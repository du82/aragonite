["https://davx5.com/faq/can-i-use-davdroid-with-an-old-android-version"]
title = "Can I use DAVx⁵ with Android <7?"
full_description = "Current DAVx⁵ versions require Android 7 or later.Older Android versions are not supported anymore, but you can use old DAVx⁵ versions which were compatible with Android <7.Older DAVx⁵ versions work with Android <7, but there is no support and there won't be any updates. We strongly recommend to update your Android device to Android 7.0 or later (maybe using a custom ROM) and use the latest version of DAVx⁵. System requirements DAVx⁵ version required Android version ≥ 4.3.9 ≥ 7.0 ≥ 3.0 ≥ 5.0 (Lollipop) ≥ 1.9.3 ≥ 4.4 (KitKat) ≥ 1.6.3 ≥ 4.1 (Jelly Bean) ≥ 1.3.2.1 ≥ 4.0.3 (Ice Cream Sandwich) <1.3.2.1 ≥ 4.0 (Ice Cream Sandwich) How can I get an old DAVx⁵ version? App stores (like Google Play): We try to keep multiple versions online at the same time, so that you can install DAVx⁵ even if you have an old Android version. However, we may not be able to keep old versions for ever. F-Droid / direct APK: If you really need to install an old version of DAVx⁵, we recommend to install F-Droid and activate the archive in the F-Droid repository. Often you can also get the APK directly from the Github repository."
