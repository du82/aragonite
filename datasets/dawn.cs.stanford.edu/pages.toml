["https://dawn.cs.stanford.edu/publications/hypermapper/practical-design-space-exploration"]
title = "Practical Design Space Exploration | Stanford DAWN"
description = "Journal Article"
full_description = "Journal Article Finding Label and Model Errors in Perception Data With Learned Observation Assertions Journal Article Practical Design Space Exploration AbstractMulti-objective optimization is a crucial matter in computer systems design space exploration because real-world applications often rely on a trade-off between several objectives. Derivatives are usually not available or impractical to compute and the feasibility of an experiment can not always be determined in advance. These problems are particularly difficult when the feasible region is relatively small, and it may be prohibitive to even find a feasible experiment, let alone an optimal one. We introduce a new methodology and corresponding software framework, HyperMapper 2.0, which handles multi-objective optimization, unknown feasibility constraints, and categorical/ordinal variables. This new methodology also supports injection of the user prior knowledge in the search when available. All of these features are common requirements in computer systems but rarely exposed in existing design space exploration systems. The proposed methodology follows a white-box model which is simple to understand and interpret (unlike, for example, neural networks) and can be used by the user to better understand the results of the automatic search. We apply and evaluate the new methodology to the automatic static tuning of hardware accelerators within the recently introduced Spatial programming language, with minimization of design run-time and compute logic under the constraint of the design fitting in a target field-programmable gate array chip. Our results show that HyperMapper 2.0 provides better Pareto fronts compared to state-of-the-art baselines, with better or competitive hypervolume indicator and with 8× improvement in sampling budget for most of the benchmarks explored. Project page HyperMapper A multi-objective black-box optimization tool based on Bayesian Optimization. Author(s) Luigi Nardi David Koeplinger Kunle Olukotun Journal Name 2019 IEEE 27th International Symposium on Modeling, Analysis, and Simulation of Computer and Telecommunication Systems (MASCOTS) Publication Date 2019 DOI 10.1109/MASCOTS.2019.00045 Publisher IEEE Read article Related Topics HyperMapper More Publications Publication Prioritizing Attention in Fast Data: Principles and Promise MacroBase Journal Article MacroBase: Prioritizing Attention in Fast Data MacroBase Journal Article Finding Label and Model Errors in Perception Data With Learned Observation Assertions See All Publications Back to Top"
