["https://dawn.cs.stanford.edu/publications/snorkel/snorkel-fast-training-set-generation-information-extraction"]
title = "Snorkel: Fast Training Set Generation for Information Extraction | Stanford DAWN"
description = "Journal Article"
full_description = "Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Journal Article Snorkel: Fast Training Set Generation for Information Extraction AbstractState-of-the art machine learning methods such as deep learning rely on large sets of hand-labeled training data. Collecting training data is prohibitively slow and expensive, especially when technical domain expertise is required; even the largest technology companies struggle with this challenge. We address this critical bottleneck with Snorkel, a new system for quickly creating, managing, and modeling training sets. Snorkel enables users to generate large volumes of training data by writing labeling functions, which are simple functions that express heuristics and other weak supervision strategies. These user-authored labeling functions may have low accuracies and may overlap and conflict, but Snorkel automatically learns their accuracies and synthesizes their output labels. Experiments and theory show that surprisingly, by modeling the labeling process in this way, we can train high-accuracy machine learning models even using potentially lower-accuracy inputs. Snorkel is currently used in production at top technology and consulting companies, and used by researchers to extract information from electronic health records, after-action combat reports, and the scientific literature. In this demonstration, we focus on the challenging task of information extraction, a common application of Snorkel in practice. Using the task of extracting corporate employment relationships from news articles, we will demonstrate and build intuition for a radically different way of developing machine learning systems which allows us to effectively bypass the bottleneck of hand-labeling training data. Project page Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Author(s) Alexander J. Ratner Stephen H. Bach Henry R. Ehrenberg Christopher Ré Journal Name SIGMOD ’17: Proceedings of the 2017 ACM International Conference on Management of Data Publication Date May, 2017 DOI 10.1145/3035918.3056442 Publisher ACM Read article Related Topics Snorkel More Publications Journal Article Evaluating End-to-end Optimization for Data Analytics Applications in Weld Weld Journal Article NoScope: optimizing neural network queries over video at scale NoScope Journal Article Snorkel MeTaL: Weak Supervision for Multi-Task Learning Snorkel See All Publications Back to Top"
