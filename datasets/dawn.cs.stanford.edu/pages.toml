["https://dawn.cs.stanford.edu/publications/snorkel/snorkel-rapid-training-data-creation-weak-supervision"]
title = "Snorkel: Rapid Training Data Creation with Weak Supervision | Stanford DAWN"
description = "Journal Article"
full_description = "Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Journal Article Snorkel DryBell: A Case Study in Deploying Weak Supervision at Industrial Scale Snorkel Journal Article Snorkel: Rapid Training Data Creation with Weak Supervision AbstractLabeling training data is increasingly the largest bottleneck in deploying machine learning systems. We present Snorkel, a first-of-its-kind system that enables users to train state-of-the-art models without hand labeling any training data. Instead, users write labeling functions that express arbitrary heuristics, which can have unknown accuracies and correlations. Snorkel denoises their outputs without access to ground truth by incorporating the first end-to-end implementation of our recently proposed machine learning paradigm, data programming. We present a flexible interface layer for writing labeling functions based on our experience over the past year collaborating with companies, agencies, and research labs. In a user study, subject matter experts build models 2.8× faster and increase predictive performance an average 45.5% versus seven hours of hand labeling. We study the modeling tradeoffs in this new setting and propose an optimizer for automating tradeoff decisions that gives up to 1.8× speedup per pipeline execution. In two collaborations, with the U.S. Department of Veterans Affairs and the U.S. Food and Drug Administration, and on four open-source text and image data sets representative of other deployments, Snorkel provides 132% average improvements to predictive performance over prior heuristic approaches and comes within an average 3.60% of the predictive performance of large hand-curated training sets. Project page Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Blog post Programming Training Data: The New Interface Layer for ML December 1, 2017 Snorkel Author(s) Alexander Ratner Stephen Bach Henry Ehrenberg Jason Fries Sen Wu Christopher Ré Journal Name Proceedings of the VLDB Endowment Publication Date November 1, 2017 DOI 10.14778/3157794.3157797 Read article Related Topics Snorkel More Publications Journal Article MacroBase: Prioritizing Attention in Fast Data MacroBase Journal Article Snorkel DryBell: A Case Study in Deploying Weak Supervision at Industrial Scale Snorkel Journal Article Snorkel: A System for Lightweight Extraction Snorkel See All Publications Back to Top"
