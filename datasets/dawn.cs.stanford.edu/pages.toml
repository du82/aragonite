["https://dawn.cs.stanford.edu/publications/dawnbench/analysis-dawnbench-time-accuracy-machine-learning-performance-benchmark"]
title = "Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark | Stanford DAWN"
description = "Journal Article"
full_description = "Journal Article Finding Label and Model Errors in Perception Data With Learned Observation Assertions Journal Article Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark AbstractResearchers have proposed hardware, software, and algorithmic optimizations to improve the computational performance of deep learning. While some of these optimizations perform the same operations faster (e.g., increasing GPU clock speed), many others modify the semantics of the training procedure (e.g., reduced precision), and can impact the final model's accuracy on unseen data. Due to a lack of standard evaluation criteria that considers these trade-offs, it is difficult to directly compare these optimizations. To address this problem, we recently introduced DAWNBENCH, a benchmark competition focused on end-to-end training time to achieve near-state-of-the-art accuracy on an unseen dataset-a combined metric called time-to-accuracy (TTA). In this work, we analyze the entries from DAWNBENCH, which received optimized submissions from multiple industrial groups, to investigate the behavior of TTA as a metric as well as trends in the best-performing entries. We show that TTA has a low coefficient of variation and that models optimized for TTA generalize nearly as well as those trained using standard methods. Additionally, even though DAWNBENCH entries were able to train ImageNet models in under 3 minutes, we find they still underutilize hardware capabilities such as Tensor Cores. Furthermore, we find that distributed entries can spend more than half of their time on communication. We show similar findings with entries to the MLPERF v0.5 benchmark. Project page DAWNBench A benchmark suite for end-to-end deep learning training and inference. Author(s) Cody Coleman Daniel Kang Deepak Narayanan Luigi Nardi Tian Zhao Jian Zhang Peter Bailis Kunle Olukotun Chris Ré Matei Zaharia Journal Name ACM SIGOPS Operating Systems Review Publication Date July 25, 2019 DOI 10.1145/3352020.3352024 Publisher ACM Read paper Related Topics DAWNBench More Publications Journal Article Finding Label and Model Errors in Perception Data With Learned Observation Assertions Journal Article Spatial: A Language and Compiler for Application Accelerators Spatial Journal Article Snorkel: Rapid Training Data Creation with Weak Supervision Snorkel See All Publications Back to Top"
