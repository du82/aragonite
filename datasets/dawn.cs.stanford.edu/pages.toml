description = "A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain."
full_description = "Snorkel Main content start Snorkel is a system for programmatically building and managing training datasets.In Snorkel, users can develop training datasets in hours or days rather than hand-labeling them over weeks or months.Snorkel currently exposes three key programmatic operations: labeling data, for example using heuristic rules or distant supervision techniques; transforming data, for example rotating or stretching images to perform data augmentation; and slicing data into different critical subsets. Snorkel then automatically models, cleans, and integrates the resulting training data using novel, theoretically-grounded techniques.Snorkel has been deployed in industry, medicine, science, and government to build new ML applications in a fraction of the time; for more, see tutorials and other resources. Website Blog posts Papers The O’Reilly Data Show Podcast: Alex Ratner on why weak supervision is the key to unlocking dark data People Stephen Bach Jared Dunnmon Jason Fries Research Engineer Braden Hancock Alex Ratner Christopher Ré Principal Investigator Sen Wu Back to Top"
