["https://dawn.cs.stanford.edu/publications/snorkel/snorkel-system-lightweight-extraction"]
title = "Snorkel: A System for Lightweight Extraction | Stanford DAWN"
description = "Journal Article"
full_description = "Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Journal Article Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark DAWNBench Journal Article Snorkel: A System for Lightweight Extraction We describe a vision and an initial prototype system for extracting structured data from unstructured or dark input sources — such as text, embedded tables, and images — called Snorkel, in which users write traditional extraction scripts which are automatically enhanced by machine learning techniques. The key technical idea is to view the user’s actions with standard tools as implicitly defining a statistical model. Project page Snorkel A system for rapidly creating, modeling, and managing training data, focused on accelerating the development of structured or “dark” data extraction applications for domains in which large labeled training sets are not available or easy to obtain. Author(s) Alexander Ratner Stephen H. Bach Henry R. Ehrenberg Jason Alan Fries Sen Wu Christopher Ré Journal Name 8th Biennial Conference on Innovative Data Systems Research (CIDR ’17) Publication Date January, 2017 Read article Related Topics Snorkel More Publications Journal Article Snorkel MeTaL: Weak Supervision for Multi-Task Learning Snorkel Journal Article NoScope: optimizing neural network queries over video at scale NoScope Journal Article Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark DAWNBench See All Publications Back to Top"
