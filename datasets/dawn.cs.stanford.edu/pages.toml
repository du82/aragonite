full_description = "Main content start Principal Investigator Kunle Olukotun Cadence Design Systems Professor, Professor of Electrical Engineering and of Computer Science Kunle Olukotun is the Cadence Design Professor of Electrical Engineering and Computer Science at Stanford University. Olukotun is a pioneer in multicore processor design and the leader of the Stanford Hydra chip multiprocessor (CMP) research project. He founded Afara Websystems to develop high-throughput, low-power multicore processors for server systems. The Afara multi-core processor, called Niagara, was acquired by Sun Microsystems and now powers Oracle's SPARC-based servers. In 2017, Olukotun co-founded SambaNova Systems, a Machine Learning and Artificial Intelligence company, and continues to lead as their Chief Technologist. Olukotun is the Director of the Pervasive Parallel Lab and a member of the Data Analytics tor What's Next (DAWN) Lab, developing infrastructure for usable machine learning. He is a member of the National Academy of Engineering, an ACM Fellow, and an IEEE Fellow for contributions to multiprocessors on a chip design and the commercialization of this technology. He also received the Harry H. Goode Memorial Award. Olukotun received his Ph.D. in Computer Engineering from The University of Michigan. Projects Spatial A new Domain Specific Language for programming reconfigurable hardware from a parameterized, high level abstraction. DAWNBench A benchmark suite for end-to-end deep learning training and inference. HyperMapper A multi-objective black-box optimization tool based on Bayesian Optimization. Advisees Matthew Feldman Olivia Hsu Ph.D. Student Sho Ko Masters Student Alexander Rucker Shiv Sundram Ph.D. Student Matthew Vilim Eric Winsor Yaqi Zhang Tian Zhao Research Associate Education PhD, Michigan (1991) Contact (650) 725-3713 kunle@stanford.edu Mail Code 9030 Links Personal Site View Full Stanford Profile Publications Coleman, C., Kang, D., Narayanan, D., Nardi, L., Zhao, 