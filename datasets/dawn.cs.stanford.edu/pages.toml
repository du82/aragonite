["https://dawn.cs.stanford.edu/publications/macrobase/demonstration-macrobase-fast-data-analysis-engine"]
title = "Demonstration: MacroBase, A Fast Data Analysis Engine | Stanford DAWN"
description = "Journal Article"
full_description = "MacroBase MacroBase is a new analytic monitoring engine designed to prioritize human attention in large-scale datasets and data streams. Journal Article Demonstration: MacroBase, A Fast Data Analysis Engine AbstractData volumes are rising at an increasing rate, stressing the limits of human attention. Current techniques for prioritizing user attention in this fast data are characterized by either cumbersome, ad-hoc analysis pipelines comprised of a diverse set of analytics tools, or brittle, static rule-based engines. To address this gap, we have developed MacroBase, a fast data analytics engine that acts as a search engine over fast data streams. MacroBase provides a set of highly-optimized, modular operators for streaming feature transformation, classification, and explanation. Users can leverage these optimized operators to construct efficient pipelines tailored for their use case. In this demonstration, SIGMOD attendees will have the opportunity to interactively answer and refine queries using MacroBase and discover the potential benefits of an advanced engine for prioritizing attention in high-volume, real-world data streams. Project page MacroBase MacroBase is a new analytic monitoring engine designed to prioritize human attention in large-scale datasets and data streams. Author(s) Peter Bailis Edward Gan Kexin Rong Sahaana Suri Journal Name SIGMOD ’17: Proceedings of the 2017 ACM International Conference on Management of Data Publication Date May, 2017 DOI 10.1145/3035918.3056446 Publisher ACM Read article Related Topics MacroBase More Publications Journal Article Evaluating End-to-end Optimization for Data Analytics Applications in Weld Weld Publication Prioritizing Attention in Fast Data: Principles and Promise MacroBase Journal Article Snorkel MeTaL: Weak Supervision for Multi-Task Learning Snorkel See All Publications Back to Top"
