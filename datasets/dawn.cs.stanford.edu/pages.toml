title = "DAWNBench | Stanford DAWN"
description = "A benchmark suite for end-to-end deep learning training and inference."
full_description = "DAWNBench Main content start DAWNBench is a benchmark suite for end-to-end deep learning training and inference. Computation time and cost are critical resources in building deep models, yet many existing benchmarks focus solely on model accuracy. DAWNBench provides a reference set of common deep learning workloads for quantifying training time, training cost, inference latency, and inference cost across different optimization strategies, model architectures, software frameworks, clouds, and hardware.Building on our experience with DAWNBench, we helped create MLPerf as an industry-standard for measuring machine learning system performance. Now that both the MLPerf Training and Inference benchmark suites have successfully launched, we ended rolling submissions to DAWNBench on 3/27/2020 to consolidate benchmarking efforts. Paper Analysis CitationPlease cite the following if you use results from the benchmark or competition in any way:DAWNBench: An End-to-End Deep Learning Benchmark and CompetitionCody A. Coleman, Deepak Narayanan, Daniel Kang, Tian Zhao, Jian Zhang, Luigi Nardi, Peter Bailis, Kunle Olukotun, Chris Ré, and Matei ZahariaNIPS ML Systems Workshop, 2017 Image Classification on ImageNetTraining TimeAll SubmissionsObjective: Time taken to train an image classification model to a top-5 validation accuracy of 93% or greater on ImageNet.RankTime to 93% AccuracyModelHardwareFramework1Mar 20200:02:38ResNet50-v1.5Apsara AI Acceleration(AIACC) team in Alibaba Cloudsource16 ecs.gn6e-c12g1.24xlarge (AlibabaCloud)AIACC-Training 1.3 + Tensorflow 2.12May 20190:02:43ResNet-50ModelArts Service of Huawei Cloudsource16 nodes with InfiniBand (8*V100 with NVLink for each node)Moxing v1.13.0 + TensorFlow v1.13.13Dec 20180:09:22ResNet-50ModelArts Service of Huawei Cloudsource16 * 8 * Tesla-V100(ModelArts Service)Huawei Optimized MXNet4Sep 20180:18:06ResNet-50fast.ai/DIUx (Yaroslav Bulatov, Andrew Shaw, Jeremy Howard)source16 p3.16xlarge (AWS)PyTorch 0.4.15S