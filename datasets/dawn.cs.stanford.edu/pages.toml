["https://dawn.cs.stanford.edu/publications/finding-label-and-model-errors-perception-data-learned-observation-assertions"]
title = "Finding Label and Model Errors in Perception Data With Learned Observation Assertions | Stanford DAWN"
description = "Journal Article"
full_description = "LOA/Fixy Learned Observation Assertions is an abstraction designed to find errors in ML deployment pipelines with as little manual specification of error types as possible. Fixy is a system for finding errors in perception data, implementing the LOA abstraction. Journal Article Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark DAWNBench Journal Article Finding Label and Model Errors in Perception Data With Learned Observation Assertions AbstractML is being deployed in complex, real-world scenarios where errors have impactful consequences. In these systems, thorough testing of the ML pipelines is critical. A key component in ML deployment pipelines is the curation of labeled training data. Common practice in the ML literature assumes that labels are the ground truth. However, in our experience in a large autonomous vehicle development center, we have found that vendors can often provide erroneous labels, which can lead to downstream safety risks in trained models.To address these issues, we propose a new abstraction, learned observation assertions, and implement it in a system called Fixy. Fixy leverages existing organizational resources, such as existing (possibly noisy) labeled datasets or previously trained ML models, to learn a probabilistic model for finding errors in human- or model-generated labels. Given user-provided features and these existing resources, Fixy learns feature distributions that specify likely and unlikely values (e.g., that a speed of 30mph is likely but 300mph is unlikely). It then uses these feature distributions to score labels for potential errors. We show that Fixy can automatically rank potential errors in real datasets with up to 2× higher precision compared to recent work on model assertions and standard techniques such as uncertainty sampling. Furthermore, Fixy can uncover labeling errors in 70% of scenes in a popular autonomous vehicle dataset. Project page LOA/Fixy Learned Observation Assertions is an abstraction designed to find errors in ML deployment pipelines with as little manual specification of error types as possible. Fixy is a system for finding errors in perception data, implementing the LOA abstraction. Author(s) Daniel Kang Nikos Arechiga Sudeep Pillai Peter D. Bailis Matei Zaharia Journal Name SIGMOD ’22: Proceedings of the 2022 International Conference on Management of Data Publication Date June, 2022 DOI 10.1145/3514221.3517907 Read article More Publications Journal Article Practical Design Space Exploration HyperMapper Journal Article Analysis of DAWNBench, a Time-to-Accuracy Machine Learning Performance Benchmark DAWNBench Journal Article Evaluating End-to-end Optimization for Data Analytics Applications in Weld Weld See All Publications Back to Top"
