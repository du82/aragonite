["https://dawn.cs.stanford.edu/news/announcing-rolling-submissions-dawnbench"]
title = "Announcing Rolling Submissions for DAWNBench | Stanford DAWN"
description = "Cody Coleman, Deepak Narayanan, Daniel Kang, Peter Bailis, and Matei Zaharia"
full_description = "Accelerating Queries over Unstructured Data with ML, Part 5 (Semantic Indexes for Machine Learning-based Queries over Unstructured Data) January 18, 2022 Accelerating Queries over Unstructured Data with ML, Part 4 (Accelerating Aggregation Queries with Expensive Predicates) August 12, 2021 Main content start Announcing Rolling Submissions for DAWNBench July 25, 2018 | Cody Coleman, Deepak Narayanan, Daniel Kang, Peter Bailis, and Matei Zaharia Following the successful completion of the DAWNBench v1 competition, we are re-opening DAWNBench to allow rolling submissions. We’re eager to see the community continue to innovate and improve on optimizing for time-to-accuracy in deep learning, so starting today, we will accept new pull requests to dawn-bench-entries. The tasks, thresholds, metrics, and instructions are still the same as DAWNBench v1, but with two changes to the reviewing process:We will only review submissions that are in the top 5 results for at least one leaderboard.New submissions will be highlighted on the leaderboard to indicate they were made after the v1 deadline.For a more comprehensive benchmark, please consider submitting to the updated MLPerf benchmark, which continues DAWNBench’s focus on time-to-accuracy for common machine learning workloads. More News Finding Errors in Perception Data With Learned Observation Assertions January 24, 2022 Accelerating Queries over Unstructured Data with ML, Part 5 (Semantic Indexes for Machine Learning-based Queries over Unstructured Data) January 18, 2022 Accelerating Queries over Unstructured Data with ML, Part 4 (Accelerating Aggregation Queries with Expensive Predicates) August 12, 2021 Back to Top"
