["https://dawn.cs.stanford.edu/people/john-duchi-0"]
title = "John Duchi | Stanford DAWN"
description = "Associate Professor of Statistics, of Electrical Engineering and, by courtesy, of Computer Science"
full_description = "Main content start Principal Investigator John Duchi Associate Professor of Statistics, of Electrical Engineering and, by courtesy, of Computer Science John Duchi (http://web.stanford.edu/~jduchi/) is an assistant professor of Statistics and Electrical Engineering and (by courtesy) Computer Science at Stanford University. His work spans statistical learning, optimization, information theory, and computation, with a few driving goals. (1) To discover statistical learning procedures that optimally trade between resources--computation, communication, privacy provided to study participants--while maintaining good statistical performance. (2) To build efficient large-scale optimization methods that address the spectrum of optimization, machine learning, and data analysis problems we face, allowing us to move beyond bespoke solutions to methods that robustly work. (3) To develop tools to assess and guarantee the validity of--and confidence we should have in--machine-learned systems. Projects Advisees Hilal Asi Maxime Cauchois Chen Cheng Ph.D. Student Suyash Gupta Rohith Kuditipudi Ph.D. Student Annie Marsden Aman Sinha Education BS, Stanford University, Computer Science (2007) MS, Stanford University, Computer Science (2008) MA, University of California, Berkeley, Statistics (2012) PhD, University of California, Berkeley, EECS (2014) Contact (650) 498-5224 jduchi@stanford.edu Mail Code 4065 Links Homepage Google Scholar Page View Full Stanford Profile Back to Top"
