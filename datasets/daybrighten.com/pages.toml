["https://daybrighten.com/hellogiggles"]
title = "hellogiggles - weekly column — emily griffin"
full_description = 'A WEDNESDAY CUTEfrom april 2017-july 2018, i created and illustrated concepts for a weekly column at hellogiggles, released every wednesday under “a wednesday cute”. my images were shared throughout their site, as well as twitter and instagram, celebrating special holidays, feelings, astrology, changing seasons, and more. here are some of my favorites! View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383204073-41VXQWLG5QSAB7CIM3I2/hellogiggles_lemonade.jpg" alt="hellogiggles_lemonade.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383269820-X8QSXOD6MHZ9M7G4JYML/hellogiggles_up.jpg" alt="hellogiggles_up.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383749575-LBD6EJEKJ5RTQ9CJM6H3/IMG_6686.JPG" alt="IMG_6686.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383237377-OH6505L1RH3XEO0QSZKL/hellogigglesmom.jpg" alt="hellogigglesmom.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383211516-DY1ML4OUFCRK690JACFL/hellogiggles_float.jpg" alt="hellogiggles_float.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383760760-5T0W43YTQ52HA5644TDY/IMG_3439.JPG" alt="IMG_3439.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383776353-78HH8KW4GP9RITHATFMG/IMG_2862.JPG" alt="IMG_2862.JPG" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555383225116-HFPSV2PK9ORWH65JTLY8/hellogigglespumpkin.jpg" alt="hellogigglespumpkin.jpg" /> #block-yui_3_17_2_1_1578248302573_3694 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1578248302573_3694 .sqs-gallery-block-grid .sqs-gallery-design-grid-