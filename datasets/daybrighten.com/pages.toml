["https://daybrighten.com/tech"]
title = "tech talks + concepts — emily griffin"
full_description = '''TECH CONCEPTS + TALKSi’m passionate about taking all kinds of tech concepts and making them personable, memorable, and fun!i am currently working on an informative series about data packets and was recently featured by increment magazine in their open source issue!i also help to design tech swag, including monthly pins for local javascript meetup, brooklyn js, and stickers for ruby together + rustasync/tide + surf. ask me about speaker portraits as a fun and personalized gift for your conferences + meetups!i have had the pleasure of illustrating for liz fong-jones’ “cultivating production excellence: taming complex distributed systems”, sarah groff-palermo's "adventures in the vbuffer" and “kablooie: a history of errors and a future of solutions”, tammy butow’s “chaos engineering bootcamp” and various other talks presented at strange loop, jsconfeu, velocity conf, and more. let’s work together on your next talk :) View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520576411854-BJL2U18C9L6TJATNNGTE/packets_intro.jpg" alt="packets_intro.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520576426871-6ULGTGX0W2A9PU5CQG3F/data_depiction_.jpg" alt="data_depiction_.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520576446129-TVN9XKT0VYT7BR4H6RZQ/poptart_data.jpg" alt="poptart_data.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520576463433-LFKNZPHHT6IQ2RULYQIF/what%27s_inside.jpg" alt="what's_inside.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520576476589-4BM6DA8CKSRAPBEJOBAK/how_packets_travel_.jpg" alt="how_packets_travel_.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1555009420339-1U4BZERJ1CO01US9IECK/debugging_everyone_3.jpg