["https://daybrighten.com/avatarsandportraits"]
title = "avatars + portraits — emily griffin"
full_description = '''AVATARS + PORTRAITSi create single, couple, and family portraits on commission.if you are interested in a full-color portrait or avatar for social media assets, rates begin at $60 for one person, with additional people or pets costing extra. lower rates are available for greyscale portraits - check out the quick draws section for more details.portraits are delivered in a digital format printable at up to 10"x10" and generally take 2-3 weeks for completion. time may vary during peak holiday seasons, like christmas or valentine’s day.if you have a more customized or time-sensitive request, please send an email my way! View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1544117192994-ACD07QG3A0UGK39AR1NE/amy_and_susan_and_friends%21.jpg" alt="amy_and_susan_and_friends!.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1564964181461-21CJT9NW34Z55IRY4A6F/justin_barclay.jpg" alt="justin_barclay.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1564964194645-WCB7LEPPBUB2KR2TU6AY/helen_family_portrait.jpg" alt="helen_family_portrait.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1544117155631-BEWMSDO3SHVWN64EWCIG/keely_avatar.jpg" alt="keely_avatar.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1577899751712-97O9LCADTGR01UAPVQCH/AK_commission.jpg" alt="AK_commission.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1564964191834-Z7DJ4Z0FOUV9BE125KTY/jacob_walker_mother%27s_day.jpg" alt="jacob_walker_mother's_day.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1578250194249-95UJJUFLC764CQHSSIXN/haley_portrait.jpg" alt="haley_portrait.jpg" /> View fullsize <img src="https://images.squarespace