["https://daybrighten.com/petportraits"]
title = "pet portraits — emily griffin"
full_description = 'PET PORTRAITSfor inquiries about pet portrait commissions, please send me an email + any relevant photos!portraits are delivered in a digital format that is printable at an 10"x10" size and generally take 2-3 weeks for delivery. this may vary at peak seasons such as christmas or valentine’s day.base price for a full-color portrait is $100 for one pet; with additional pets costing extra.if you have a time-sensitive request, or are looking for a portrait of a different animal, let me know and i will work with you! i always love a new pet request! View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520573693653-NYFFVBKFQD4721ZD8CNZ/billy_commission.jpg" alt="billy_commission.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1544119813031-ERLGRPUK0ER1C08OAIPI/pug_portrait_.jpg" alt="pug_portrait_.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1564964867429-CP66A8TNPFNJ0OJ5XXFQ/gutierrez_cat.jpg" alt="gutierrez_cat.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1577899797659-1MYLB21K3SPJYH8IWRF0/hope_pet_portrait.jpg" alt="hope_pet_portrait.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520573662773-8CP9YSXIGBW8KEP5NLJD/andy_commission_.jpg" alt="andy_commission_.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1577899809467-82ZGFV26FUJF7MFQPSTO/ellen_chisa_pet.jpg" alt="ellen_chisa_pet.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1578250400130-QMYCFBUUMPSNEEXILL4J/rick_h_pet.jpg" alt="rick_h_pet.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5a906fb55ffd202154b90396/1520573625540-AQ8I7X7WIZKI39ZZ84JE/mag_borg_commission.jpg" alt="mag_borg_commission