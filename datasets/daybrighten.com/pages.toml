["https://daybrighten.com/about"]
title = "about — emily griffin"
full_description = "View fullsize hello!i'm emily, a freelance illustrator raised in texas, based in brooklyn. i’ve got a background in marketing + watercolor and a knack for soft, friendly art that makes you feel things.my work has been commissioned, featured, and shared by tumblr, marie kondo, increment magazine, brooklyn magazine, hellogiggles, glitch, honeycomb, buzzfeed, and bustle.i work primarily with media + tech companies to create illustrations for online and print media, conference branding + swag, slide deck illustrations, and educational materials.i also create couple + Family portraits, pet portraits, save-the-dates, and other personalized gifts.when i'm not making art, you'll catch me drinking bubble tea, karaoking, and cheering for the houston rockets.email or tweet at me!"
