["https://daylio.net/faq/docs/daylio-faq/issues/missing-files"]
title = "Missing Files – Knowledge Base"
full_description = "Missing Files Estimated reading: 1 minute 361 views Missing or Incomplete Backup They have not been found on your Cloud storage. This means they might have been deleted, or their upload was interrupted. If you have your auto-backup turned on, please make sure you are connected to the internet and your photo and audio files are all uploaded before you close the app. Your Phone Storage is Full Another possibility is that the file is not correctly imported into the app. This might be the case when you hit your phone storage maximum. Backups are generally not large, but your phone might be already full. If you do not have enough space on the phone, try rebooting the phone or clearing the cache (temporary files) from apps that store most content. Android and iOS have both tools to effectively and selectively clear important storage space: Android: Free up Space Tutorial iOS: If you need more space for an update Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
