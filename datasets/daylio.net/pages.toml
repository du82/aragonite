title = "Writing entries on computer – Knowledge Base"
full_description = "Writing entries on computer Estimated reading: 1 minute 311 views Daylio is not being developed for computers or the web. We are a small indie app, and we focus on doing what we know as best we can. We do not have the resources to develop a desktop app, maintain it, and communicate seamlessly between all the platforms. Android Emulator If you prefer Daylio on your computer and are unafraid of extra work, you can use an Android 🤖 emulator. One of the trusted emulators is Bluestacks – this is not a recommendation; you need to do your own research. ⚠️ However, if you are running two or more Daylio apps on one account, you need to backup and restore every time you want to switch the device. Therefore we always recommend using only one app, and if you choose a computer, it will be much easier to use a computer only. This is due to the high privacy 🔒 your data are not on our servers, making real-time synchronization hard. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 4 No 2"
