["https://daylio.net/faq/docs/daylio-faq/backup/backup-options"]
title = "Backup Options – Knowledge Base"
full_description = "Backup Options Estimated reading: 2 minutes 238 views Android We are using Google Drive since it is the easiest way for our users to backup data. Android is Google platform and they are making it very easy and reliable for developers and users to backup data. Almost every Android system has already connected Google Drive which is ready for use and you do not need to register for or install other solution. Data use special Google Drive folder that can be accessed only by Daylio installed on your phone and logged in the account. Your backups are transferred to the Google Drive via the secure (encrypted) channels. All data stored on the Google Drive are encrypted by Google. You can read more about it here: https://support.google.com/googlecloud/answer/6056693?hl=en We also like that data are staying at the Google Drive with our users. Only your Daylio app is able to read your entries. We don’t send your data to our servers so we don’t have the access to your entries. Also, any other third party app can’t read your data. iOS For iOS the native, secure and seamless solution is iCloud. Backup File The Backup File contains all your entries, moods, activities, and settings. You can export or import it back to Daylio. Use this file to manually backup Daylio data anywhere you like or transfer your data from Android to iOS and back. We still strongly advise using automatic cloud backups in addition to using the backup file. Daylio backups belong only to you and we do not have access to any copy and cannot help you to restore lost backups. Here you can read how to transfer your data using Backup File Please note: Backup File needs to be exported manually via Advanced Options. You cannot use your regular or scheduled backup file. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 2 No"
year_published = 2020
year_updated = 2020
