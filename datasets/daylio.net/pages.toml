full_description = "Delete account Estimated reading: 1 minute 250 views Daylio does not provide online accounts. App stores the data locally on your phone or if you keep backup, it is on your personal Google Drive or iCloud account. You cannot see the data, because they are in a hidden app folder. If you want to remove everything Daylio related just uninstall the app. First, please make sure to cancel your subscription if you have one: Android tutorial at https://support.google.com/googleplay/answer/7018481 iOS tutorial at https://support.apple.com/en-us/HT202039 Then, you can move to removing any data stored by app: On Android, you can remove the data from your Google Drive. See more at: Where is my data when I back up to Google Drive? On iOS you can go to your iCloud settings and turn off Daylio access/backup. See more at: https://support.apple.com/en-us/HT204247 We are sorry to see you go, but wish you all the best 👋 Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 1 No 1"
