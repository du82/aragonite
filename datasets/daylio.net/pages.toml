["https://daylio.net/faq/docs/daylio-faq/backup/are-my-data-backed-up"]
title = "Are my data backed up? – Knowledge Base"
full_description = "Are my data backed up? Estimated reading: 2 minutes 208 views Android version We use Google Drive to backup your data. If you go to More > Backup and Restore and tap Backup, we will ask Google to save your data. Once the backup is successful, you should see small toast confirmation “Yay! Backup created” and the date of your backup will be changed. If you see this Google has sent us a message that your data has been stored safely. iOS version Daylio uses iCloud for backup. Just make sure you have iCloud Drive enabled and enough space on your iCloud account. If you go to More > Backup and Restore and tap Backup, we will save your data to connected iCloud. Once the backup is successful, you should see small toast confirmation “Yay! Backup created” and the date of your backup will be changed. Automatic backup When you turn on the backups, Daylio will automatically backup your data after each entry. If for some reason backup fails (connectivity issues, full storage, phone turned off, data roaming, backup server issues, blocked app by 3rd party app), the application is trying to repeat the action later again. After a few failed attempts we will let you know that error occurred and ask you to backup data manually. The setting will stay on and the next day we will try to back up again. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 2 No 1"
year_published = 2020
year_updated = 2020
