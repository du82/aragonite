["https://daylio.net/faq/docs/daylio-faq/backup/how-to-backup-and-restore"]
title = "How to backup and restore – Knowledge Base"
full_description = "How to backup and restore Estimated reading: 3 minutes 220 views Android Backup The backup process is very simple: Go to More > Backup & Restore We advise you to use automatic backups – so your data is always safe. For a manual backup, tap the button Backup to Google Drive. If you are doing this first time, you need to select the Google Account you want to use. (You can always log out and use another account.) ⚠️ The backup will take some time – if you have photos 📸, you will see the photo upload progress. If the backup is successful, you will see the confirmation message “Yay! Backup created.” and the date of your backup will change. Now it is safely stored on your associated Google account, although you cannot see it there – but the app can. Where are my data when I backup to Google Drive? Restore Go to More > Backup & Restore and tap the menu item “Restore…“ You will see the list of your recent backups. Select the one you want to restore. It will display a message “Restoring backup… it can take a few moments. Have a cake!” When the backup is restored you will see the message “Woohoo! Backup restored.” and you will see your entries in the app. Troubles? If something goes wrong, make sure you are online. Also, there might be an issue with Google Drive. You have to wait and try in a few minutes or an hour. Are you trying to import CSV file? This is not possible. You have to use the native Daylio backup functionality. Do you use the same account for restoration and backup? Verify your account at the bottom of the screen. When everything fails, there might be some 3rd party issues. It always helps to kill the app or restart the phone. iOS Backup The backup process is very simple: Go to More > Backup & Restore We advise you to use automatic backups – so your data is always safe. For a manual backup, tap the button Backup to iCloud. ⚠️ Backup will take some time – if you have photos 📸, you will see the photo upload progress. If the backup is successful, you will see the confirmation message “Yay! Backup created.” and the date of your backup will change. Now it is safely stored on your iCloud, although you cannot see it there – but the app can. Restore Go to More > Backup & Restore and tap the menu item “Restore…” You will see the list of your recent backups. Select the one you want to restore. When the backup is restored, you will see the message “Woohoo! Backup restored.” and you will see your entries in the app. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
year_published = 2020
year_updated = 2020
