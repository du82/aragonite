title = "Daylio Family Sharing on iOS – Knowledge Base"
full_description = "Daylio Family Sharing on iOS Estimated reading: 2 minutes 219 views When you buy Daylio Premium, your purchase should be shared with your family members. You need to set up sharing and your family in your Apple Settings to make it work. However, Family Sharing is managed by Apple and should work at all times. Here is what you can do to if you have any issues: Try restoring Daylio purchases on the family device without premium access. Just tap Restore Purchases on the buy screen. Review your iOS Family settings. You can go to iOS Settings and tap on Family to see the status of your shared subscriptions. You should do this for both devices to ensure they are connected. Please see this Apple tutorial if you need any help with Family Sharing or setup. If your Family Sharing is correctly set up, you may have to try to sign out a few times. Then, sign back in immediately using your Apple ID login and password. Doing this will reset your connection to the subscriptions and recognize the acceptance of your invitation to Apple Family Sharing. ℹ️ Apple Policy, you have to be in the same region as your family member or friend you are inviting to Family Sharing. But you do not need to live in the same household. If your issue persists, it can always be something else, like an Apple server error. Unfortunately, this has to be fixed by Apple because we at Daylio have done everything to make it work. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
