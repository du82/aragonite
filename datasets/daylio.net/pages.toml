["https://daylio.net/faq/docs/daylio-faq/about/how-secure-is-my-data"]
title = "Data security – Knowledge Base"
full_description = "Data security Estimated reading: 1 minute 274 views Your data is stored only locally on your phone. You can optionally make backups to your private Google Drive space or iCloud. Data stored in the app’s private directories is not accessible by any other apps or processes. You (or anyone else) can’t download the data from the app even if you connect your phone to your computer.Your backups are transferred to Google Drive or iCloud via secure (encrypted) channels. All data stored on Google Drive is encrypted by Google, data on iCloud is encrypted by Apple.The most important thing is that only the Daylio app is able to read your entries. We don’t send your data to our servers, so we don’t have access to your entries. Also, any other third-party app can’t read your data. For more information on this, review our Privacy Policy. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 1 No"
