["https://daylio.net/faq/docs/daylio-faq/tutorials/adding-and-managing-photos"]
title = "Add and manage photos – Knowledge Base"
full_description = "Add and manage photos Estimated reading: 2 minutes 230 views Adding Photos With Daylio you can attach up to 9 photos to your entry. When you pick your activities, scroll all the way down and tap on PHOTO (under the NOTE). You can take a new photo with a camera or use a photo from your library. 🍎 iOS devices can select up to 9 photos at once in the picker. If you have an older device or downloading photos from iCloud, it might take a second to download photos to Daylio. Photos can also be visible in the Photo Gallery (in the More menu) and in the PDF export (More > Export Entries). ℹ️ To use this feature, you have to allow Daylio to open the Camera or access your Photos. Deleting Photos To delete a photo you need to edit the entry which contains the photo. Here you can tap the red X button to delete photos and save changes. Photo Gallery Photos create a Photo Gallery displayed in section More > Photo Gallery. The gallery within our app displays all your photos associated with your entries. Adding a photo is automatic – all photos are displayed here. In order to delete the photo from our app’s gallery, you need to open the associated day entry and delete the photo. To do so, please follow these steps: Open Daylio’s Photo Gallery Tap on the photo you want to delete Tap on the Show Entry button Tap on the day entry and then select Edit Tap the red X in the upper right corner of the photo. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No 1"
