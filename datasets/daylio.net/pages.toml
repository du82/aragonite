["https://daylio.net/faq/docs/daylio-faq/tutorials/using-multiple-devices"]
title = "Use multiple devices – Knowledge Base"
full_description = "Use multiple devices Estimated reading: 1 minute 228 views We recommend using Daylio on one primary device. It might be your phone or tablet. At this point, Daylio is not designed to be used simultaneously on multiple devices. It is due to our privacy policy. Only you have access to your data. We nor anyone else can’t read or access your data. Since we don’t store your data on our servers, it’s hard to do real-time sync between multiple devices. However, you can manually transfer your data between the devices via manual backup import and export at any time. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes 3 No"
