["https://daylio.net/faq/docs/daylio-faq/issues/forgotten-pin-code"]
title = "Forgotten PIN code – Knowledge Base"
full_description = "Forgotten PIN code Estimated reading: 1 minute 211 views 1. Fingerprint Method Do you have an active fingerprint lock on your phone? You can unlock Daylio using your fingerprint—this feature is available on both iOS and Android devices. 2. Backup Method If your data is backed up to Google Drive or iCloud, follow these steps: Delete the app. For Android: Go to System Settings > Apps > Daylio and tap CLEAR DATA. Reinstall the app from Google Play or the App Store. Restore your backup. For Android: Turn off your PIN code, then set a new one. For iOS: Since the PIN code is off by default, set a new PIN code. This should resolve the issue. If your data wasn’t backed up, unfortunately, we can’t assist, as only you have access to it (read more in our Privacy Policy). You can always try a few more times. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
