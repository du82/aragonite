full_description = "私たちは透明性と誠実さを信じています。このプライバシーポリシーが明確で透明であると感じていただけることを願っています。 このアプリケーションにはアカウント作成オプションがないため、私たちはあなたの入力データにアクセスしたり、保存したりしません。あなたのデータはデバイス内にのみ保存され、すべての計算もデバイス上で行われます。 オプションで、データをGoogle Drive（Android）やApple iCloud（iOS）にバックアップすることができます。バックアップはあなたのプライベートクラウドに保存され、私たちはバックアップファイルにアクセスできません。 メールまたはカスタマーサポートフォームを通じてサポートを依頼する際に、私たちはあなたのメールアドレスを取得します。私たちはメールアドレスをサポート、フィードバック、または重要な情報を提供するためにのみ使用します。 私たちは定期的にデータをバックアップすることを推奨します。ユーザーはバックアップファイルを手動でエクスポートして任意の場所に保存するか、クラウドにバックアップするオプションを選択できます。クラウドバックアップはユーザーのプライベートクラウドスペースに保存され、私たちはアクセスできません。 AndroidユーザーはGoogle Driveを使用してデータをバックアップすることができます。バックアップはユーザーのプライベートGoogle Driveスペースに保存され、その容量にカウントされます。あなたのGoogleアカウントと安全に接続し、データは私たちや他のアプリがアクセスできないフォルダに安全に保存されます。Googleのプライバシーポリシーはhttps://www.google.com/policies/privacy/で確認できます。"
