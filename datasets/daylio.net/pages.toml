full_description = "Photos – File format is not supported Estimated reading: 1 minute 215 views You might see an error ” File format is not supported” when attaching a photo to your entry. Daylio supports native photo formats: WebP, JPEG, PNG, BMP, and HEIC. However, your browser might allow you to choose other picture formats that will not be supported in our app. You might have saved animated GIFs or photos taken or converted by other apps (e.g. RAW, PSD). If you see this error, you can convert your photo and make sure your camera saves pictures in JPG or HEIC. If you have more questions, please do not hesitate to contact us. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
