["https://daylio.net/faq/docs/daylio-faq/tutorials/how-to-change-language-the-start-of-the-week-or-time-format"]
title = "Change language, the start of the week, or time format – Knowledge Base"
full_description = "Change language, the start of the week, or time format Estimated reading: 2 minutes 178 views Android Daylio is automatically installed in the language of your OS if we support this language. If you want to change Daylio language go to More > Languages and select another. The language and system settings also predefine the start of the week but you can override this in More > Start of the Week. The time format cannot be changed in Daylio and you have to change it in your Android settings. iOS 13 or newer – Language Change Apple’s iOS 13 makes the iPhone and iPad multilingual. If you are using more than one language you can change the language of an individual app without changing your primary system language. Each app can have its own separate language setting. Open iOS Settings Find Daylio Tap Language and select the language you prefer iOS 12 or older – Language Change You need to change the primary system language. App language, the start of the week, or the time format are defined by the OS settings. If you want to change this you need to change your iPhone settings. See how to change the language in iOS: https://support.apple.com/en-us/HT204031 iOS – Start of the Week or Time Format The start of the week and time format are defined by Region system settings. Go to System Settings > General > Language & Region > Region Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
