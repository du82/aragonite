s Use a big database of beautiful icons for custom activities Mix and match your own moods using funny emojis Explore interesting monthly or yearly statistics created from your logs Deep dive into advanced statistics for every mood, activity or group Customize color themes Enjoy nights with dark mode See your whole year in 'Year in Pixels' Create daily, weekly or monthly goals and motivate yourself Build habits and collect achievements Share statistics with your friends Safely backup and restore your entries to your cloud storage Set reminders and never forget to create a memory Turn on PIN lock and keep your entries safe Export PDF or CSV document to share, print or analyze your entries They talk about us If you treat yourself like an ongoing experiment that you want to improve... I’ve been using the app Daylio. It takes five seconds to check. Successful people regularly evaluate their days. And what is easier then keeping records digital? Thanks to this app you do not have to write a word. It's incredibly helpful for noticing patterns of behaviour that may be inadvertently impacting your mood. You may notice that any day you don't have a "good meal" you feel worse... Out of all of the apps we’ve covered, Daylio’s probably the easiest to use. Just launch the app, select a smiley face that represents your overall mood, and then select the activities you did today. In Love with People I love it. Never before have I kept track of my emotions this thoroughly. It has helped me to reflect more and stay in touch with what is going on with me. Being mindful, even if I don't do specific mindfulness exercises. Great app, that got me so hooked that I just had to get the premium features. — Sarah As someone diagnosed bipolar over 20 years ago, using this app is a great way to track moods (I too am in to the popular “mindfulness” trend, even before it became popular): it allows me to pause throughout the day, take a few minutes to sit quietly, notice how my body feels, see what