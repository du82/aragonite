["https://daylio.net/faq/privacy-policy/%ea%b0%9c%ec%9d%b8%ec%a0%95%eb%b3%b4-%eb%b3%b4%ed%98%b8%ec%a0%95%ec%b1%85"]
title = "개인정보 보호정책 – Knowledge Base"
full_description = "저희는 투명성과 정직성을 믿습니다. 이 개인정보 보호정책이 명확하고 투명하다고 느끼시길 바랍니다. 이 애플리케이션은 계정을 생성하는 옵션을 제공하지 않으므로, 저희는 귀하의 입력 데이터에 접근하거나 저장하지 않습니다. 귀하의 데이터는 기기 내에서만 저장되며, 모든 계산은 기기에서 이루어집니다. Android는 Google Drive에, iOS는 Apple iCloud에 데이터를 백업할 수 있는 선택 옵션을 제공합니다. 백업 데이터는 사용자의 개인 클라우드 공간에 저장되며, 저희는 백업 파일에 접근할 수 없습니다. 저희는 이메일 지원 또는 고객 지원 문의 양식을 통해 지원을 요청할 때 귀하의 이메일 주소를 수집합니다. 저희는 이메일을 오직 지원, 피드백, 또는 중요한 정보를 제공하기 위해서만 사용합니다. 저희는 사용자에게 정기적으로 데이터를 백업할 것을 권장합니다. 사용자는 백업 파일을 수동으로 내보내고 원하는 곳에 저장할 수 있으며, 선택적으로 클라우드 백업을 할 수도 있습니다. 클라우드 백업은 사용자의 개인 클라우드 공간에 저장되며, 저희는 이에 접근할 수 없습니다. Android 사용자는 Google Drive를 사용해 데이터를 백업할 수 있습니다. 백업은 개인 Google Drive 공간에 저장되며, 할당량에 반영됩니다. 귀하의 Google 계정과 안전하게 연결되며, 데이터는 저희나 다른 애플리케이션이 접근할 수 없는 폴더에 안전하게 저장됩니다. Google 개인정보 보호정책은 https://www.google.com/policies/privacy/에서 확인할 수 있습니다. Android에서 이메일 및 이름 권한은 백업에 사용되는 계정을 표시하기 위해 요청됩니다. 애플리케이션은 이메일 주소와 이름을 저장하지 않으며, Google 로그인에서 연결된 계정을 확인하고 백업 섹션에만 정보를 표시합니다. 익명 분석 데이터 수집에 동의하더라도 이메일 주소나 이름은 분석 데이터에 포함되지 않습니다."
year_published = 2025
