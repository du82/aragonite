["https://daylio.net/faq/docs/daylio-faq/issues/apple-health-troubleshooting"]
title = "Apple Health Troubleshooting – Knowledge Base"
full_description = "Apple Health Troubleshooting Estimated reading: 2 minutes 306 views If you cannot see your Apple Health entries in the app even though you have turned on synchronization and your entries are stored in Apple Health, you might review the following tips: First step: Make sure the app has turned on read and write permissions within the Apple Health app Open the Health app. Tap on your profile picture on the right side of the top bar. Tap “Apps” in the Privacy section. Tap “Daylio” in the list. Make sure that all the switches are turned on. If you do not see your data from other apps (like smart devices) in our app, please do this: Launch the Health app. Tap “Browse” on the bottom tab bar. Tap “Sleep” or “Activity” in the listing. Scroll all the way down and tap “Show All Data” in the More section of the listing. Make sure you see your entries from the other apps in the listing. If you don’t, you need to enable Health sync in the other apps according to the first tutorial on this page. iOS 18 update: iPhone won’t track sleep data automatically. You need to use Apple Watch or sleep tracking apps to get sleep data into Apple Health. Still stuck? How can we help? How can we help? Send Was this page helpful? Yes No"
