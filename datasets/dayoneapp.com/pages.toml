full_description = "Welcome to the Day One NewsroomThis space is designed for reporters and media professionals looking to delve into the essence of Day One to discover what makes our journaling app truly special. Check out our Release Notes for the latest app development updates. Visit our blog where you will find creative journaling ideas and practical tips for maximizing the journaling experience. For media inquiries or to schedule an interview, please use our Press contact form or send us and email to press@automattic.com Our HistoryPaul Mayne launched Day One on the Mac and iOS App stores in 2011 to fill a need: to record and store important memories, photos, and details of daily life. Our initial app, now known as Day One Classic, won numerous awards and high praise from users and critics alike. In 2016, we launched Day One 2.0, a complete redesign of the app that included powerful new features. Over the years, the response to Day One has been overwhelming: Over 13 million downloads; multiple awards including App of the Year, Editor’s Choice, and an Apple Design Award; and over 150,000 5-star ratings from our dedicated users around the world.Day One by the Numbers13 Million Downloads 500,000 Active Users Per Month Over 150,000 5-star reviews worldwideCompany MilestonesJanuary 2024: Launched Shared Journals December 2023: Launched Journaling Suggestions February 2023: Launched Day One on the Web June 2021: Day One Acquired by Automattic February 2018: Released Day One for Android June 2017: Day One Premium launched June 2017: End-to-End Encryption launched April 2017: Day One Book printing launched December 2016: 2016 “Best of the App Store” February 2016: Mac & iOS “Editor’s Choice” February 2016: Day One 2.0 launched May 2015: Day One Sync launched April 2015: Day One for Apple Watch launched June 2014: Apple Design Award winner December 2012: Mac App of the Year January 2012: App of the Week December 2011: Mac App Store #1 App of 2011 March 2011: Mac App Store “Editor’s Choice” March 2011: Day One for Mac and iOS launchedPress KitLogos and product images – Download the press kit (.zip)Day One is an Automattic CompanyAre you looking for another Automattic product logo or images? See all of the Automattic brand materials."
