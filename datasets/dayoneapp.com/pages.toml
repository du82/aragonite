title = "1,300 Days with Cory Schow"
description = "Taking flight over a span of 1,300 days, Cory Schow's journaling journey is as intriguing as the man himself. A resident of Utah, USA, and a dedicated pilot by profession, Cory's journal entries glide across a wide spectrum of his personal and professional life."
full_description = "Streak Stories1,300 Days with Cory Schow By The Day One Team May 30, 2023 Home » Day One Blog » 1,300 Days with Cory Schow Taking flight over a span of 1,300 days, Cory Schow’s journaling journey is as intriguing as the man himself. A resident of Utah, USA, and a dedicated pilot by profession, Cory’s journal entries glide across a wide spectrum of his personal and professional life.The first seeds of Cory’s journaling journey were planted in 2002. For him, writing serves multiple purposes. On one hand, it provides a therapeutic canvas for his thoughts, feelings, and musings – helping to clear the runways of his mind. On the other, it captures an invaluable chronicle of personal history, tracking progress, and immortalizing precious moments with his children.For Cory, the content of his journal entries isn’t set in stone. They can range from concise reflections of the day’s highlights to deep dives into problems his mind is tirelessly working to solve. His journaling routine also follows a flexible schedule, with entries penned either in the tranquility of the evening or during the early morning hours.In this article, we explore the captivating voyage of Cory’s journaling, including the lessons he’s learned, the benefits he’s reaped, and his advice for those embarking on their own journaling journey. Cory’s story is a testament to the power of journaling not only as a means of self-expression and memory preservation but also as a potent tool for mental health.How long have you been keeping a journal?I started in 2002. What makes journaling important to you? Journaling is important to me for a few reasons. One is that I find it therapeutic. It gives me a healthy way to express my feelings and possibly any frustrations or disappointments I may feel. But also it is a healthy way to remember the joys I experience and the highs of life. My brain is always thinking, and sometimes writing my thoughts down, no matter how unorganized or incoherent they may be, it leads to more organized thought and more clear decisions I may need to make. “Journaling has become an integral part of taking care of my mental health. But only by being consistent with it have I seen the full benefits of it.”Secondly, the history aspect of journaling is important to me. I can track progress, remember good times and trials I may have overcome, or with my children remember little milestones or cute things they may have said. I especially enjoy the on this day feature of Day One.What do you usually journal about?I typically write a few lines about the highlights of the day but it’s more about how I’m feeling. As I mentioned previously, I often write about the problems my brain is trying to solve non stop. So usually I write about what is occupying my mind and brain power for the day.When do you journal each day?My journal routine varies. Most frequently I write in the evening, but it’s not uncommon to write first thing in the morning if I wake up and my mind is racing. I’ve heard this referred to in other circles as “Morning Pages.” Getting these early thoughts out in my journal before the problems of the day have settled in can clear my head and make it easier to tackle the day ahead.What tips or advice would you give others who want to build a journaling habit?Start small. You do not need to write a novel daily. If one line is all you can do, write that one line, that’s it. Often you’ll continue beyond that, but one line is better than nothing.What have you learned from keeping a journal?I’ve learned that writing a journal is a healthy way to organize my thoughts, solve problems, express feeling and emotion, and that it is really important!What is your favorite thing about the Day One app? My favorite feature of the day one app is the “On This Day” feature. It’s so easy to look back and find memories. I look forward to reading it each day. I get so excited to see what happened last year that I open the app to read the entries or see the pictures that I end up writing while the app is open and I’m able to keep the streak alive.How has Day One helped you journal more consistently? Day One has helped me journal consistently because it eliminates the friction of journaling. We all have our phones with us, it’s as easy as sending a text message. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
