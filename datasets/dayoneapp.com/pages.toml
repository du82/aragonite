["https://dayoneapp.com/blog/the-next-chapter-of-day-one-at-automattic"]
title = "The Next Chapter of Day One at Automattic"
description = "Today, I’m thrilled to announce that Day One is being acquired by Automattic. This is incredibly exciting news. For the past 10 years since I started Day"
full_description = "NewsThe Next Chapter of Day One at Automattic By Paul Mayne June 14, 2021 Home » Day One Blog » The Next Chapter of Day One at Automattic Today, I’m thrilled to announce that Day One is being acquired by Automattic. This is incredibly exciting news. For the past 10 years since I started Day One, I’ve worked to not only create the best digital journaling experience in the world, but one that will last. By joining Automattic, I’m now more confident than ever that the preservation and longevity of Day One is sure. This acquisition will provide Day One access to the same technological, financial, and security benefits that WordPress.com, Tumblr, and other Automattic entities enjoy.Automattic is led by founder Matt Mullenweg, a pioneer in the web publishing space and founder of WordPress.com. The Automattic teams have built and supported products and services with massive global scale, and I can’t imagine a more ideal home for Day One now and for the future.During the past decade, our small software development team has had incredible accomplishments, earning prestigious design awards from Apple along with high praise from The New York Times, The Washington Post, Time, Wired, and more. The Day One app has been downloaded over 15 million times in 225 different countries/territories. The relentless commitment to innovation and refinement by the team are the reasons Day One is widely recognized as an enjoyable and trusted digital journaling platform.When a small software company is acquired by a larger company, the original team is often swallowed up by the larger company. That’s not the case here. I’ll be remaining at the helm of Day One, leading the same passionate team that has been responsible for the development and design behind the app today. This means that the Day One you rely on to save your thoughts, photos, videos, audio recordings, and more isn’t going away. Instead, it’ll only get better, with future integrations with Tumblr and WordPress.com. Rest assured that Day One’s commitment to protecting your privacy remains unchanged. Safely protecting memories and creating a 100% personal space is the foundation upon which this company was built. (In fact, our technical capabilities around privacy are a large part of what Automattic finds valuable in our company).It’s always been my deepest belief that personal life histories should be preserved. Thanks to the support of our incredible users, a sustainable subscription business model, a committed team, and new growth opportunities, the future is bright. We’re grateful you’ve been part of the Day One family and can’t wait to share this next chapter of our journey together.–Paul Mayne, founder and CEO of Day OneRelated posts:Automattic Blog: https://wordpress.com/blog/2021/06/14/day-one-the-journaling-app-joins-automattic/ Matt Mullenweg: https://ma.tt/2021/06/day-one-at-automattic/ TechCrunch: https://techcrunch.com/2021/06/14/wordpress-com-owner-automattic-acquires-journaling-app-day-one/Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
