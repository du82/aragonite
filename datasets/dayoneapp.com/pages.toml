full_description = "Streak Stories110 Days with Misha Penton By The Day One Team July 05, 2023 Home » Day One Blog » 110 Days with Misha Penton Misha Penton’s journey through journaling is more than a narrative—it’s a dance between words and life’s rhythm, an ode to creativity and self-awareness. Based in Houston, Texas, Misha is not just a singer and composer but also a creativity mentor. Her story with the Day One app is not measured by the length of her streak, but the depth of her introspection. Over the past seven years, her journals have echoed the chorus of her everyday life, from her music-making endeavors to her fitness routines and spiritual practices, all intertwined with her unique knack for creating narratives. With Day One serving as a catalyst for her consistency, Misha has not only built a wellness practice through her journals, but also a vibrant tapestry of her experiences, memories, and dreams. In this interview, we discover how Misha paints a vivid picture of her life through her journals, offering insights into how the simple act of journaling can serve as a grounding tool in an ever-spinning world.How long have you been keeping a journal?I started journaling consistently when I got the Day One app in 2016. What makes journaling important to you? Journaling is a wellness practice for me. I love writing about my day and creative process. I read somewhere that Day One is like social media for one — I love that idea of intimacy. “Journaling is a wellness practice for me. I love writing about my day and creative process. I read somewhere that Day One is like social media for one — I love that idea of intimacy.”What do you usually journal about?My music-making, creative work, fitness, spiritual practice, meals, travel…I like to create an outline or narrative for each day and to log in my activities. I also love having photos or videos accompany my entries.When do you journal each day?I journal in the morning and evening and sometimes brief checkin-ins during the day.What tips or advice would you give others who want to build a journaling habit?Be consistent even if it’s one phrase or one photograph for each day. Your entries will grow, mine did!What have you learned from keeping a journal?In a world that often seems relentless with its barrage of headlines, ads, and social media trends, my journal keeps me centered and reminds me who I am.What is your favorite thing about the Day One app? I love Day One’s journal templates and the section headers — these are great ways to organize ideas, create a life log, and keep track of habits and routines. My current favorite template that I created is called My Wonderful Day and the header sections are: Today’s Great Thingz (general goings-on) Grateful (a section on gratitude) Power Words (my current word for 2023 is EXPAND) Creativity (my work section) Body & Wellness (fitness log) Spirit (spiritual practice / inspiration support / affirmations) Yum Diary (meal diary)Misha’s My Wonderful Day journal templateThe formatting options for quotes and bullet lists are a great visual tool for my entries. I also love that I can use dictation on my phone or Mac and that makes brainstorms or longer entry ideas easy and fast!How has Day One helped you journal more consistently? It’s super-easy to access Day One on my Mac or iPhone and it’s one of the apps I use the most.“My journal keeps me centered and reminds me who I am.”In a world that often seems relentless with its barrage of headlines, ads, and social media trends, my journal keeps me centered and reminds me who I am. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
