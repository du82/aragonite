["https://dayoneapp.com/blog/introducing-journaling-suggestions"]
title = "Introducing Journaling Suggestions for Day One"
description = "Journaling Suggestions in Day One provide personalized journaling recommendations inspired by your photos, locations, activities, and more, bringing a whole new level of introspection and discovery to your daily reflections."
full_description = "NewsIntroducing Journaling Suggestions for Day OneSee journaling recommendations inspired by your photos, locations, activities and more. Exclusively for iPhone. By The Day One Team December 12, 2023 Home » Day One Blog » Introducing Journaling Suggestions for Day One Today we’re excited to announce a new way to deepen your journaling practice: Journaling Suggestions. Journaling Suggestions in Day One provide personalized journaling recommendations inspired by your photos, locations, activities, and more, bringing a whole new level of introspection and discovery to your daily reflections.Journaling Suggestions are available exclusively for Day One for iPhone beginning in version 2023.25. You’ll also need to update to iOS 17.2.App StoreWhat are Journaling Suggestions?Journaling Suggestions in Day One brings a new dimension to journaling, turning everyday moments into opportunities for reflection and introspection. In iOS 17.2 and later, your iPhone keeps track of the things you do throughout the day (the photos you take, the songs and podcasts you listen to, the places you visit, etc.) and gathers them into moments you might like to write about.With Journaling Suggestions, you can create journal entries based on your:Photos & Videos – Journaling Suggestions uses your photos and videos as a springboard for journaling, inviting you to capture the stories behind these moments. It’s not just about the image; it’s about reliving the experience and emotions tied to it. Locations – Whether it’s your favorite coffee shop or a park bench where you find solace, location-based Journaling Suggestions prompt you to journal about these places. What did you feel? Who were you with? With location-based journaling, you can go deeper to document the significance of these places in your life. Workouts – Your physical activities tell a story of discipline, challenge, and growth. By syncing with your workout data, Journaling Suggestions can help you create journal entries that reflect on your fitness journey. How did you push your limits today? What keeps you motivated? It’s a perfect way to track your progress and celebrate your achievements. Motion Activity – From your daily walks to spontaneous dance sessions, every motion activity has its tale. Journaling Suggestions nudge you to note down how these activities shape your day, affect your mood, and contribute to your overall well-being. Podcasts – Every podcast episode can spark a unique thought or learning. Journaling Suggestions takes cues from your podcast listening habits, prompting you to explore and document the ideas and inspirations you glean from your favorite episodes. Music – Music is often the backdrop of our lives. This feature encourages you to journal about the soundtracks that accompany your day. How does a particular song make you feel? Does a certain melody bring back memories? It’s a harmonious way to intertwine music with your memories. Contacts – The conversations and interactions we have shape our lives in profound ways. Journaling Suggestions prompts you to reflect on these connections, whether it’s a deep conversation with a friend or the impact of a new acquaintance. It’s about understanding and valuing the relationships that weave through our daily existence.The Apps & Technology That Power Journaling SuggestionsCurrently, Journaling Suggestions are powered by native Apple apps like Apple Music, Apple Podcasts, Photos, Fitness, and Phone. In the future, we may be able to pull in more activity from other third-party apps you use on a regular basis. Behind the scenes, Day One now integrates with the Apple Suggestions API to bring Journaling Suggestions directly into Day One.Getting Started with Journaling Suggestions for Day OneTo get started with Journaling Suggestions, you’ll need:An iPhone using iOS 17.2 or higher Day One version 2023.25 or higher1. Create a new entry in your Day One Journal. You’ll see a new “Suggestions” icon in the lower part of the entry editor, just above your keyboard.2. Select a Journaling Suggestion.The Journaling Suggestions picker will open, displaying your personalized suggestions in two tabs: “Recommended” and “Recent.” When you find a Journaling Suggestion you’d like to add to your Day One Journal, tap it.3. Edit and customize your Journaling Suggestion’s contents. On the next screen, you can select which elements from the Journaling Suggestion to add to your journal. For example, you can deselect photos to choose your favorites. 4. Tap the Add to “Day One” button to start writing.That’s it! Day One will go to work adding the contents of your Journaling Suggestion to your journal entry. From here, you can write your reflections, thoughts, and feelings to your entry. 5. Check back each day for new Journaling Suggestions.Every day, your Journaling Suggestions will update based on your activity, ensuring a fresh and dynamic journaling experience tailored to your daily life. Whether it’s reflecting on a new place you visited, a song that touched you, or thoughts inspired by your latest workout, these personalized prompts will keep your journal vibrant and uniquely yours.A Note on Privacy and Security for Journaling SuggestionsWe know you may have concerns about the privacy and security of Journaling Suggestions. All Journaling Suggestions are specific to your personal iPhone. Your Journaling Suggestions are always private and all entries created from your Journaling Suggestions are end-to-end encrypted by default. No one except for yourself can ever view or create journal entries from your data.Apple ensures that Journaling Suggestions are managed with your privacy in mind. Day One and other third-party apps do not have access to your Journaling Suggestions data until you select a specific suggestion and choose to share it outside of Day One.Download Day One for iPhone NowTransform your journaling experience today with Day One’s Journaling Suggestions, exclusively available on the iPhone. By integrating your daily activities, emotions, and experiences into a cohesive and reflective journaling practice, Day One offers a unique and personalized way to capture your life’s journey. Download the latest version of Day One for iPhone, embrace the power of introspection, and start turning your everyday moments into meaningful journal entries. App StoreJournaling Suggestions FAQsWhat are Journaling Suggestions?Journaling Suggestions in Day One provide journaling recommendations inspired by your photos, locations, activities and more.How do Journaling Suggestions work?Just start a new entry in Day One on your iPhone, and tap the “Suggestions” button. You’ll see a list of ideas to write about—photos, videos, locations, podcasts, and more. Tap on one, and you’re ready to start writing!What powers Journaling Suggestions?Your own activities! In iOS 17.2 and later, your iPhone keeps track of the things you do throughout the day (the photos you take, the songs and podcasts you listen to, the places you visit, etc.) and gathers them into moments you might like to write about in your journal. To be more specific, Day One now integrates with the Apple Suggestions API to add Journaling Suggestions into your Day One Journal. I’m concerned about my privacy and data. How do I know that Journaling Suggestions are secure? Apple ensures that Journaling Suggestions are managed with your privacy in mind. Day One and other third-party apps do not have access to your Journaling Suggestions data until you select a specific suggestion and choose to share it outside of Day One. Once you’ve added a suggestion to Day One, your entries are secured by default with end-to-end encryption which ensures that only you can read your journal’s content.Is any of my data shared via Journaling Suggestions? No, all Journaling Suggestions are specific to your personal iPhone. Your Journaling Suggestions are private and all entries created from your Journaling Suggestions are end-to-end encrypted by default. No one except for yourself can view or create journal entries from your data.How do I turn off Journaling Suggestions?You can turn Journaling Suggestions off in your iPhone’s Settings app by visiting Settings App > Privacy & Security > Journaling Suggestions. This will disable Journal Suggestions for all apps.Which version of Day One introduces Journaling Suggestions? Journaling Suggestions are available in Day One for iPhone beginning in version 2023.25. You’ll also need iOS 17.2 for Journaling Suggestions to work. Can I use Journaling Suggestions on my iPad or Mac?No, Journaling Suggestions are currently only available on iPhone. They are not available on iPad or Mac. However, you can sync and view entries created from Journaling Suggestions made on your iPhone if you also use Day One on a separate Apple device.Can I use Journaling Suggestions on my Android device? No, Journaling Suggestions are currently only available on iPhone. However, you can sync and view entries created from Journaling Suggestions made on your iPhone if you also use Day One on a separate Android device.Can I use Journaling Suggestions on Day One on the web?No, Journaling Suggestions are only available for iPhone devices. However, you can sync and view entries created from Journaling Suggestions made on iOS devices if you also use Day One on the web.Do I need Day One Premium to use Journaling Suggestions? No, you can use Journaling Suggestions with a free Day One account. However, some Journaling Suggestions functionality (like adding multiple photos or videos to a single journal entry) are exclusive to Day One Premium, so it’s a great time to upgrade to take full advantage of Journaling Suggestions.Have more questions? Check out our help guides or contact us.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
