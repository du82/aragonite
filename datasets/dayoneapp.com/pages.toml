title = "How I Journal: David Becker"
description = "Meet David Becker, a communications specialist hailing from Des Moines, Iowa, who has found solace and growth through journaling."
full_description = "InterviewsHow I Journal: David Becker By The Day One Team October 18, 2023 Home » Day One Blog » How I Journal: David Becker In today’s digital age, where lives seem more public than ever, there’s a quiet refuge that some choose to embrace—a sanctuary of thoughts and reflections that remain hidden from the world’s prying eyes. Meet David Becker, a communications specialist hailing from Des Moines, Iowa, who has found solace and growth through journaling. In this interview, we’ll delve into the world of David Becker’s journaling experience.Discovering the Art of JournalingDavid’s journaling journey began in March 2015 when the journaling app Day One came into David’s life. Reflecting on this, David shared, “Journaling had been a part of my life, off and on, throughout 2012-2013 during my high school days.” For David, journaling wasn’t merely about documenting life events; it was a way to nurture a dream of becoming a writer, particularly a tech journalist or blogger. It offered a space to express oneself, improve writing skills, and explore the fundamental aspects of the craft.“Journaling became a way to not only express myself through writing, but improve as a writer, even if it was in one of the most basic and fundamental ways. However, it also enabled me to write about life but in a way that was not public. As an introvert, this is a great thing because our lives are very public now because not only do you have conversations and events in-person, but you additionally live another life online. “With journaling on Day One, it allows you to live both lives but in a way that is private and kept from the general public. There could be something sitting on your mind in a day and you don’t necessarily want to talk about it publicly and that’s where a journal comes in handy because you can talk about it there and have it only been seen by you. On top of all of that, you can add photos and keep precious and important memories, good or bad. By doing that, I think seeing and reading that every now and then can help you grow as a person.”Dear Friend: A Unique Journaling FormatDavid’s journal entries follow a format inspired by The Perks of Being a Wallflower, where every entry starts with “Dear friend.” It’s a touch of personalization that adds a unique flavor to journaling, making each entry feel like a conversation with a confidant.The Where and When of JournalingAs a communications specialist, David’s life is undoubtedly busy. When it comes to where and when to journal, David explains: “Journaling about life usually happens during breaks at work or at home.” It’s a testament to the flexibility of journaling, proving that it can be integrated into daily routines, no matter how hectic they may be.The Importance of Keeping It PrivateJournaling often coincides with vulnerable moments, and these thoughts are meant solely for the journal keeper. David emphasizes the importance of keeping the journaling journey private. David advises, “Ensuring that you keep at it is crucial, and please remember that it’s an excellent way to support oneself mentally.” David suggests using passcodes and biometric locks like Face ID/Touch ID to safeguard personal thoughts. “Journaling can come at a time when we are at our most vulnerable, and those times really only need to be seen by us, the ones doing the writing. Just because you wrote it does not mean it needs to be public.”A Tool for Self-Reflection and Mental HealthJournaling isn’t just a hobby for David; it’s a tool for self-reflection and maintaining mental well-being. David shares this bit of encouragement, “Not only is it a fun hobby for people like myself, but it is a great way to keep yourself in tune with your life. Be a little more observant, but also know that it is okay to run to a journal and write those thoughts and feelings down. There’s a reason journaling has said to be an important way to help someone’s mental health. You get everything out there and then it’s not as hidden and kept away anymore. Lastly, even if the journal entry is a short one, if you keep at it each day, you’ll find you have a lot more to say than when you started.”Favorite Features: Day One’s Lock Screen WidgetDavid’s most-used feature in Day One is the Lock Screen widget. “It’s not going to sound like much, but my most-useful feature is the Lock Screen widget on my iPhone, as well as on my iPad Air fifth generation with iPadOS 17. It helps me monitor my streak and reminds me to get that journal entry in for the day. Journaling to Understand Who You Are and Who You are BecomingIn closing, David reflected on the profound impact of journaling, stating, “Journaling can be a way to truly get to know yourself at a personal and private level. Once you have so many journal entries, over the years, you can see who you are and have been as a person, the memories you have made along the way, dealing with the good and bad days, and perhaps who you are coming to be. I cannot think of another written-based medium that has that type of impact on someone.” Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac How do you journal? We’d love to hear your story! Tell us more here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
