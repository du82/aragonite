["https://dayoneapp.com/blog/streak-story-melissa-nethkin"]
title = "2,700 Days with Melissa Nethkin"
description = "For Melissa Nethkin, journaling isn't just a habit—it's a lifeline. Starting her journaling journey in 2016, Melissa has since maintained an impressive streak of 2,700 days."
full_description = "Streak Stories2,700 Days with Melissa Nethkin By The Day One Team May 16, 2023 Home » Day One Blog » 2,700 Days with Melissa Nethkin For Melissa Nethkin, journaling isn’t just a habit—it’s a lifeline. Starting her journaling journey in 2016, Melissa has since maintained an impressive streak of 2,700 days, pouring her thoughts, dreams, and daily experiences onto the pages of her Day One journal.Living with ADHD, autism, and neurofibromatosis type 1, Melissa’s life is full of unique challenges, but her journal has become a sanctuary—a place where she can unload her thoughts and feelings and gain clarity amidst the chaos. Her entries range from the mundane to the profound, capturing her ups and downs and offering a candid glimpse into her world.In this interview, we delve into Melissa’s world, exploring how journaling has shaped her life, helping her to navigate her unique challenges and understand herself better. We’ll also look at the advice Melissa offers to others looking to establish their own journaling routine, and how her habit of documenting the weather has evolved into a captivating record of her environment. How long have you been keeping a journal?I started writing in a journal at the beginning of 2016. Before I started writing in my journal every day, I wrote about my dreams starting on February 23, 2012.What makes journaling important to you? I like to write how my day was, and what I did each day (without missing a day) because I have my ups and downs, and I need to get the thing off my chest and out of my head. When I’m upset about something, I intend to write a lot. I have ADHD and autism so having a journal is very important to me to write in every day. When do you journal each day? I write between 8:30 a.m. – 11 p.m. every day. I have a reminder every day to write in my journal so I don’t miss a day. “I like to write how my day was, and what I did each day (without missing a day) because I have my ups and downs, and I need to get the thing off my chest and out of my head. Writing in a journal each day helps me.What do you write about in your journal?I still use my journal to write about my dreams. I’ve kept track of the weather since Dec 1, 2007 for the city I live in. This started as an extra credit assignment when I was in the 8th grade, and I got in the habit of writing what the weather is doing each day. I’m already on book number 2 with keeping track of the weather.What tips or advice would you give others who want to build a journaling habit?Set a reminder every day so you can get in a habit of writing in your journal.What is your favorite thing about the Day One app? My favorite is the location and the weather is my favorite so I can look in the past to see where I was when I started writing in my journal and the weather.How has Day One helped you journal more consistently? Day One helps me get things off my chest and out of my head. Sometimes I have a lot of things going on in my head and I can’t sleep. Writing in a journal each day helps me. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
