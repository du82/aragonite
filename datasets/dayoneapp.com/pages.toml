["https://dayoneapp.com/blog/streak-story-sherron-hegedus"]
title = "1,800 Days with Sherron Hegedus"
description = "For Sherron Hegedus, a devoted grandmother and retired bookkeeper from Calgary, Alberta, journaling isn't just a daily habit, but a captivating form of magic that brings stories to life."
full_description = "Streak Stories1,800 Days with Sherron Hegedus By The Day One Team June 20, 2023 Home » Day One Blog » 1,800 Days with Sherron Hegedus For Sherron Hegedus, a devoted grandmother and retired bookkeeper from Calgary, Alberta, journaling isn’t just a daily habit, but a captivating form of magic that brings stories to life. Sherron’s extraordinary journey of journaling spans over 1,800 days, wherein she’s seamlessly blended her daily life experiences, feelings, and life lessons into an ever-evolving narrative. Her writings not only bring a sense of fulfillment and personal reflection to herself, but also have proven to be a treasure trove of insights for her curious granddaughters. With the convenience and functionalities of the Day One app, Sherron has managed to maintain consistency and has made journaling a fun routine. Discover how Sherron’s approach to journaling—marked by positivity, introspection, and sincerity—creates a unique tapestry of wisdom and shared experiences that’s set to inspire future generations. Join us as we delve into her “Streak Story,” a narrative that transforms everyday moments into the timeless magic of stories.How long have you been keeping a journal?I’ve journaled sporadically throughout my adult life until I learned about the Day One app from a friend who’d learned about it at RootsTech. I downloaded the app and journaling became a daily habit.What makes journaling important to you? It gives me a way to express myself. I have preteen granddaughters who borrow and read my journals already. One granddaughter heard her parents talking about an event and filled them in on some details. When they asked how she knew that, she said, “I read it in Grandma’s journal.” I haven’t yet had the last two years’ journals printed and she keeps asking me when I’m going to send them in for printing. “Journaling is a way to express myself, sharing my life experiences and what I learn on my journey with those who read it now or in the future.”What do you usually journal about?I journal about things I learn, my feelings, experiences past and present, and day to day life. I know my grandchildren look for themselves within my journals because I include their achievements, fun things they do and say, experiences we share together and experiences of my past that they might find interesting or of value.My Uncle gave me some good advice. “Don’t write what you don’t want read. You can discuss life’s challenges without writing negatively about anyone or anything. This kind of approach to writing only reflects negatively on the writer. Write about the lessons you learned from your challenges. What you have learned or are learning. Write of your daily routine, of memories that pop into your mind, and of subjects of interest.”When do you journal each day?I usually journal at the end of my day, but if I don’t have time to fill in all the details I’ll jot down a few happenings so I don’t forget about them and then come back later to expand on them.What tips or advice would you give others who want to build a journaling habit?Use a journaling reminder until it becomes a fun habit.What have you learned from keeping a journal?For me, journaling is fulfilling and is good personal reflection. When I opted out of social media over a year ago, I learned that journaling replaced the desire to share or endlessly scroll on Instagram or Facebook.What is your favorite thing about the Day One app? The ease of having my journal with me all the time on my phone and the ability to include pictures.How has Day One helped you journal more consistently? I use the reminder but I rarely need it anymore; journaling has become fun.Sherron’s Parting Words: The Magic of StoriesJournaling tells a story and brings people to life! I found this somewhere, I don’t remember where, or know who said it, but to me, this best describes the value of journaling:“Do you have a magic spell to return someone to life?” she said.“No,” the witch said, ‘I’m sorry.”“Oh.”“Why don’t you tell me about them?”“Will that bring them back?”“For us. For a little while. Stories are a different kind of magic.” Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
