full_description = "Your journal is always protected with military-grade encryption.Because privacy is the literal foundation upon which Day One is built, end-to-end encryption is built into Day One and turned on by default. Only you have the key. Your journal is safeguarded from the start. From the moment you embark on your journaling journey, Day One takes data security to the next level. We prioritize the protection of your sensitive information through our robust encryption protocols, ensuring your data remains confidential and secure right from the start. Meet the power duo of data security: Asymmetric and Symmetric Encryption. Asymmetric and symmetric encryption work together to create an impenetrable shield around your data. Each word, each photo, each entry is meticulously guarded by layers of cryptographic algorithms, rendering your information indecipherable to anyone without the authorized private key. Only you have the master key. Your master key is the pinnacle of encryption that never leaves your device and encrypts your data at its final layer. This key remains beyond the reach of even Day One’s servers, so even if we wanted to read what’s in your journal (we don’t), we couldn’t. And if someone maliciously got into our system, they wouldn’t be able to read what’s in your journal, either. Only you have the encryption key. Access your encrypted content across multiple devices. Day One seamlessly syncs your data, allowing you to pick up where you left off, whether you’re on your phone, tablet, or computer. Experience the convenience of accessing your encrypted content across multiple devices. Go Premium Our Privacy Pledge What you put in Day One will always be your data, but we pledge to protect it like it’s our own. There are few things more private in this life than a personal journal. It’s the place where you can take all those thoughts, emotions, and big feelings swirling around in your head (and heart) and unload them. The desire for a completely private digital space is what motivated the creation of Day One in the first place. This is why privacy isn’t just a feature we offer. If you’d like to take an even deeper dive into the different ways we protect your data, we encourage you to check out the Day One Privacy Pledge. Read our privacy pledge Capture life’s moments, anytime, anywhere. Download the free Day One journal app for free on iPhone, Android, iPad, Mac, and Apple Watch. Or access your Day One Journal from any browser. App Store Android Mac Login now"
