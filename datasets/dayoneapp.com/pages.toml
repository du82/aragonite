["https://dayoneapp.com/book-printing"]
title = "Book Printing | Day One: Your Journal For Life"
description = "Preserve your memories with printed books. Print your journals in beautiful hardcover or paperback format with Day One Book printing."
full_description = "Preserve your memories with printed books.Print your journals in beautiful hardcover or paperback format with Day One Book.Starting at just $19.99.Get startedTurn the pages of your digital journals. See your memories come to lifein a book. Incorporate the details of your digital life in a longer-lasting print format. Each Day One book is unique and made-to-order. A clean, content-focused design. Your memories deserve to be preserved in a beautiful format. Each printed journal features full-color photo printing on high-quality paper. Simple yet customizable. Choose your journal’s contents, date range, tags, or cover colors and photos. The process of printing your journal should be easy, not time-consuming.“While many people are content to view the ups and downs of their lives within the confines of an app, others may prefer to see their lives unfold in a traditional book. That’s the new feature of Day One that longtime journal writers are going to love — printed books.” How it works 1. Create a journal Download the Day One iOS app* to get started. Create a journal, start writing, and add photos to capture your memories. 2. Customize your book Select the journals to be printed, customize the design, and preview your book. All inside the Day One app.Read the guide here. 3. Complete your order Checkout inside the app and we’ll get to work securely printing and shipping your Day One Book order.Download*At this time, Day One Book is only available in the Day One iOS app for iPhone and iPad.More Day One BookFeatures to ❤️ Create & order within the Day One iOS app.All of the creation, ordering, and payment (via Apple Pay) is done within the Day One app for iPhone or iPad. In just a few steps, your Day One book is ready to order. Secure file transfer and privacyThe contents of your journal are always kept private with secure file transfers to our printing facility. Printing is completely automated with no human intervention. All digital files are deleted once the book has shipped. High-quality hardcover option Upgrade your journals from the standard paperback option to hardcover for just $5. Map pages. Metadata stats. Include location, date, time, tags, and even monthly stats in your Day One Book. Smooth paper. Durable binding.All Day One Books are printed on smooth, high-quality paper with durable binding. Export to PDFWhile previewing your Day One book, you can export to a PDF file so you’ll always have a digital copy.Read the guidePeople ❤️ Day One BooksAuthor and illustrator Danny Gregory shares his Day One books. FAQsCan I make a Day One book on the Mac app or Android app?No, at this time, book printing is only supported on the Day One iOS app for iPhone or iPad.How do I create a Day One book inside the Day One iOS app?To get started, open the Day One iOS app on iPhone or iPad. Open Settings, then tap Book Printing. Check out the Day One Book Printing Guide for step-by-step instructions with screenshots.What does a Day One Book cost? What payment options are supported? Day One Books start at $19.99 for 50 color pages, then $0.10 per page. Books are 5.5″ by 8.5″ and limited to 400 pages. All prices are USD. We offer two pay options: Apple Pay and credit/debit cards (supported by Stripe). International users must pay with Apple Pay at this time. Import fees may be assessed for international orders and they are paid by the buyer. We hope to support more payment options in the future. Do I need a Day One premium account to print a Day One Book?No, basic (free) users can create printed versions of their journals inside the Day One iOS app. What customization options are available for Day One Books?Day One books offer several customization options, including the ability to:• Select journals, years, or specific date ranges to generate your book. • Choose your font and font size. • Adjust the monthly map pages, exclude entries, choose only certain entries with tags, or exclude tags.• Customize your book’s cover by editing the cover photo, back photos, color, and title text. See the Day One Book Printing Guide for more information on customization options.What are the specs of a Day One Book? Books are 5.5″ by 8.5″ Books are limited to 400 pages. How do I check my order status?Go to Day One > Settings > Book Printing > Orders. This will give you the status of your order. Tracking information will be available once shipped. You can cancel a book order within a short timeframe. If the option to cancel does not appear, the order cannot be canceled. We do not currently have expedited shipping options or guaranteed delivery dates.How are Day One Books shipped?Orders are shipped using UPS Mail Innovations. UPS carries the parcel to a last-mile carrier, usually local postal service.What is the deadline for orders to arrive by the holidays? As the Day One books are made-to-order, there are some deadlines to keep in mind for orders to arrive by the holidays. The mail-date deadline for orders to arrive before the holidays is December 10 (for US domestic orders) and December 1st (for international orders). This is not including the time to print so we recommend having orders in before these dates. We do not currently offer expedited shipping or guaranteed ship dates.I have questions or need help with my Day One Book order. Where can I go for help? The Day One support team is ready to help. Please contact us here."
