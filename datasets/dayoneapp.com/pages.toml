title = "Book Printing"
description = "Creating and ordering printed books in Day One for iOS"
full_description = 'Search For : Book Printing Creating and ordering printed books in Day One for iOS Day One has helped millions of people worldwide easily capture life as they live it. To help you preserve and share these memories, we’re pleased to introduce Day One Book.All prices are in USD. International users must pay with Apple Pay at this time. We hope to support more payment options in the future. Import fees may be assessed for international orders, and they are paid by the buyer.Book Printing is only available on iOS though our Book Printing feature. Day One does not support directly printing journals from PDF files or any other method.$19.99 USD for 50 color pages, then $0.10 per page.Table of ContentsBook Size"Create a Book"Select YearsEdit the CoverEdit the ContentPreview BookCartCheckoutOrder StatusPrinting GuidelineBook SizeBooks are 5.5″ by 8.5″Books are limited to 400 pagesTo get started, open Settings, then tap Book Printing.“Create a Book”Select the journals you wish to be printed then tap Next.Select YearsChoose the years you want included. Specific date ranges can be chosen later. Tap Next.Edit the CoverIn the process of ordering a book, you can change its cover photo, color, rear photos, adjust its title, dates, author, etc. Tap Save when you are done.Keep in mind that editing the cover of a printed book will not change the appearance of a journal in the app.Edit the ContentYou can adjust the journal, date range, monthly map pages, exclude entries, choose only certain entries with tags, or exclude certain tags. At this time further customizations, like editing the font size or rearranging photos is not possible. Tap Save when you are done.Preview BookHere you will be able to see each page as it will appear in the printed book. Please review it here to make sure it looks like you want. Tap Next to go to the Cart. CartAdd new books or proceed.If there are more entries that need an additional book there will be an indication to create a new book in the Cart. Please note the date range of the book in the cart.CheckoutTap Checkout to upload the book and pay. We offer two pay options: Apple Pay and credit/debit cards (supported by Stripe). For international orders, only Apple Pay is supported. Here is more info from those providers about how they protect your data:Apple: https://support.apple.com/en-us/HT203027Stripe: https://stripe.com/docs/security/stripeIf you use Apple Pay, the payment and shipping details will come from the Wallet & Apple Pay settings on your device. The address can be verified before you completing purchase with Touch ID/Face ID.Order StatusGo to Day One > Settings > Book Printing > tap Orders. This will give you the status of your order. You can cancel a book order within a short timeframe. If the option to cancel does not appear, the order cannot be canceled. We do not currently have expedited shipping options or guaranteed delivery dates.Starting in version 5.8, tracking is available for printed books from within the app. Go to Day One > Settings > Book Printing > tap the Orders tab > tap a book order and tracking information will be available once shipped.Books typically arrive about 7-12 business days after ordering when ordering in the US, 18-24 business days when shipping Internationally. Around holidays, shipping may take longer.Orders are shipped using UPS Mail Innovations. UPS carries the parcel to a last-mile carrier, usually local postal service.Printing GuidelineOur external printing partner, responsible for producing printed journals, may decline to proceed with printing your journal due to Objectionable Material.Objectionable Material shall mean any material that is unlawful, harmful, threatening, abusive, tortious, defamatory, libelous, vulgar, obscene, pornographic, lewd, profane, invasive of another’s privacy, hateful, racially or ethnically offensive, or otherwise objectionable, and in violation of applicable laws, including but not limited to state and federal laws protecting minors and incompetent persons. Objectionable Material also includes images that depict explicit or pornographic sexual positions or any male or female genitalia. Bare breasts and lingerie photoshoots typically do not fit the above definition and are acceptable to send if there is no exposure of genitalia.The decision will be made following their guidelines and policies, which are beyond our direct control. ← Back to Guide list'
