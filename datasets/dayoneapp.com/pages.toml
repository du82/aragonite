full_description = "NewsIntroducing Day One Paper JournalsExplore three new journals to inspire gratitude, creativity, and daily reflection. By The Day One Team February 12, 2025 Home » Day One Blog » Introducing Day One Paper Journals At Day One, we believe in journaling in all its forms. Day One paper journals are designed to complement your digital journaling practice, giving you more ways to reflect and express yourself, whether you’re unplugged, off-screen, or simply in the mood for handwriting.Buy the 3-PackMeet the Day One Paper Journal CollectionThe collection includes three beautifully crafted journals, each tailored to inspire self-reflection, creativity, and habit-building:The Daily JournalCapture the essence of your day in just a few lines with the Daily Journal. This simple yet meaningful companion makes it easy to build a consistent journaling habit, perfect for personal reflection and growth.The Prompts JournalWith the Prompts Journal, you can embark on a journey of self-discovery with 90 thought-provoking prompts across themes like gratitude, creativity, relationships, and more. Each prompt includes a QR code that opens it directly in the Day One app, bridging the gap between paper and digital journaling.The Gratitude JournalCultivate mindfulness and focus on life’s small joys with daily prompts. The Gratitude Journal is designed to help you reflect on the moments, experiences, and people that bring joy and meaning to your life.Why Paper?Journaling has always been about more than just words. It’s about creating a connection—with your thoughts, your memories, and your story. While digital journaling provides unmatched convenience and versatility, the tactile experience of writing on paper can inspire mindfulness, spark creativity, and foster a deeper sense of reflection.Our paper journals are designed to:Enhance your digital journaling habit: Use them alongside the Day One app to create a balanced practice. Encourage unplugged moments: Rediscover the magic of analog writing when you’re off-screen. Provide a timeless keepsake: Paper journals offer a tangible way to preserve your thoughts and memories for years to come.Plus, with QR code integration in the Prompts Journal, you can load each prompt directly in the Day One app, or easily bring photos of your paper journal entries into the app with the camera feature, connecting your paper and digital journaling experiences. Bundle and Save with the 3-PackExplore the collection to discover your perfect journal, or opt for the 3-pack bundle with Premium to experience all three. Plus, when you purchase the bundle, you’ll also receive a gift code for Day One Premium*—a perfect way to combine handwritten reflection with powerful digital journaling features.*Note: The Premium gift code is valid for new Day One accounts only. Buy the 3-PackFAQsHow does a Day One paper journal work with the Day One app?Day One paper journals are designed to be yet another way for you to build a lasting journaling habit. Depending on the journal, QR code integration links to prompts inside the app, so you can seamlessly switch between the two formats. I live outside the U.S. Can I buy a Day One paper journal? Sorry, right now, we only ship Day One paper journals within the U.S. We’ll be working on offering global shipment options in the future. What does a Day One paper journal cost? What payment options are supported?You’ll find the cost of each Day One paper journal in the paper journals store for the Daily Journal, Gratitude Journal, and Prompts Journal. You can checkout using any major credit card. Can I buy a bundle of all three paper journals?Yes! You can save by buying the Paper Journal 3-Pack or the Paper Journal 3-Pack with Premium, which includes a gift code for Day One Premium. Is there a version of the 3-pack that doesn’t include Premium? Yes, if you don’t need Premium, you can purchase the Paper Journal 3-Pack of all three journals.Can I buy the 3-pack with Premium if I’m already a Day One Premium customer?Yes, but please note that the 3-pack with Premium includes a Day One Premium gift code, which can only be used for a new Day One Premium subscription. While it can’t be used to extend or renew your current subscription, it makes a great gift for someone else!What are the shipping times if I order a Day One paper journal? We offer fast delivery within the United States with the efficiency and accuracy of Amazon Prime with expedited (1 working day) or standard (3 working days) delivery options.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
