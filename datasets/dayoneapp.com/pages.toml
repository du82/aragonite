["https://dayoneapp.com/blog/how-i-journal-lumin-grace"]
title = "How I Journal: Lumin Grace"
description = "For Lumin Grace, a writer, soul coach, and speaker in women’s empowerment, journaling is a vital aspect of her creative and spiritual life. Based in Los Angeles but living as a full-time digital nomad, Lumin shares her thoughts on journaling, how it empowers her, and why it's more than just pen to paper."
full_description = "InterviewsHow I Journal: Lumin Grace By The Day One Team August 14, 2023 Home » Day One Blog » How I Journal: Lumin Grace For many, journaling is a personal endeavor, a silent conversation with oneself. For Lumin Grace, a writer, soul coach, and speaker in women’s empowerment, it’s a vital aspect of her creative and spiritual life. Based in Los Angeles but living as a full-time digital nomad, Lumin shares her thoughts on journaling, how it empowers her, and why it’s more than just pen to paper.The Start of a Lifelong Passion“I’ve been journaling for as long as I can remember. As early as 10 years old,” says Lumin, recalling the school days when she first discovered the joy of expressing herself through writing. “It started in school where we had to journal for 10-20 minutes upon arrival. This memory comes back to me now as I answer this question. We were setting the tone for expressing ourselves. I loved it. I later began to use writing/ journaling as a means of creative expression. Storytelling and crafting poetry.”Empowering through JournalingLumin offers this insight: “The power of journaling is just that – it is a type of power. It is a method for empowering myself. The act of journaling, in all its various ways, feeds my multi-dimensional creative soul. I live for full expression in as many ways as possible. “The moment I realized that journaling was more than just pen to paper (although my most favorite) my world expanded. It is my playground. It is important because I granted myself the permission to be as bold and daring in these journal possibilities. The power of finding my voice, becoming vulnerable with myself and truly daring to dream all add to the power journaling provides.” “Journaling is the best gift I can give my soul. I am able to hear myself. My inner dialogue. It is the ultimate ‘ME’ time. It is my first point of courage, before I express and teach courage to others.”A Window to Various Aspects of LifeLumin’s journaling is multifaceted, from her most used ‘Life’ journal to her business-building journal. She writes about the successes and failures, the lessons learned, and captures kind words from friends and loved ones. “The beauty of my entire life is that all these moments are meant for me to use in my teachings now as a full time coach and mentor,” she reflects. “It is amazing to see how I dare to have visions and bring them to life. The behind-the-screens in building a business, brand a life has been my favorite. I see the journey from ideas, courageous actions and serendipity unfolding. The successes, the flops all of the lessons along the way. I love being able to reference the days, moments and years with ease. Capturing and saving the kind words and audios from friends, clients and loved-ones is so amazing as well.”Daily Rituals and TechniquesA thoughtful and disciplined writer, Lumin’s daily routine includes journaling “after I take a few mindfulness minutes after waking up” and at the end of the day. From capturing dreams to setting the tone for the day with personal inspirations and gratitudes, her journaling practice is a well-orchestrated ritual.“For me, capturing my dreams in a journal is important as they leave me clues and messages for the journey. I also enjoy the morning journaling because I set the tone with personal inspirations and gratitudes for the day. At night I reflect on the a-ha moments and the continued vision for my life.”Lumin’s Tips for Using the Day One Journal AppLumin’s approach to journaling is rich and varied. She appreciates features of the Day One app, like the daily writing prompt: “I like the daily journal prompt. I make use of it about once a week. Regardless of whether I write on the prompt, simply seeing the question allows me to stop and answer the question in my soul and outloud.” She also loves the flexibility of multiple journals. “Keeping my actual dreams, business, and life journals separate has been one of my favorite features. “As a full time digital nomad, I am making memories across every city and country I find myself in. I get to save them in the journal app along with words and memories of how the moments made me feel.”Lumin shared a few screenshots of her different journals, along with a snapshot of her journal entries. “I also am living for being able to do voice to text. This was a fun addition.” “I also use the shortcut to save photos and videos directly from my camera roll almost daily. I love having my memories added in. This is a quick journal moment I love. As a full time digital nomad, I am making memories across every city and country I find myself in. I get to save them in the journal app along with words and memories of how the moments made me feel.” Lumin’s Encouragement and AdviceFor those wanting to begin journaling, Lumin offers encouragement: “Find a way you best like to express yourself and make that the way you journal. If you like creating videos, do that. If you are more connected to writing, by all means use that way. If you simply want to journal a photo, as they say it is worth a thousand words, then snap away. Make journaling and any other habit you want to create sustainable to the way you naturally like to move and show up in life. Dabble with other ways, but find which methods work best for you. I also say just have fun. Make it your own. There are zero rules to it.”The Healing Power of JournalingThrough her journaling, Lumin has found healing, spirituality, and hope. She explains, “Journaling has been deeply spiritual for me. The sharing, even with myself, is healing. I recognize that I journal primarily with a hopeful disposition. That my words carry weight for my present and my future. It has been the catalyst of consistency. The main thread that ties my entire life’s journey together. I learned about myself and just how deep I am. It has taught me that my voice matters.” Lumin Grace’s perspective on journaling reveals the depth and richness of this seemingly simple practice. As a woman inspiring others to live authentically and courageously, her thoughts on journaling offer a glimpse into her vibrant and reflective inner world. “I recognize that I journal primarily with a hopeful disposition. That my words carry weight for my present and my future. It has been the catalyst of consistency. The main thread that ties my entire life’s journey together. I learned about myself and just how deep I am. It has taught me that my voice matters.”Her closing thoughts aptly capture her relationship with journaling: “Journaling is the best gift I can give my soul. I am able to hear myself. My inner dialogue. It is the ultimate ‘ME’ time. It is my first point of courage, before I express and teach courage to others.” Her words are not only an endorsement of journaling but an invitation to embrace it as a powerful means of self-discovery and empowerment. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac What’s your approach to journaling? Here’s your chance to share the techniques, templates, or prompts you use on a regular basis. Tell us how you journal here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
