["https://dayoneapp.com/blog/streak-story-kevin-anderson"]
title = "850 Days with Kevin Anderson"
description = "Kevin Anderson is approaching the impressive milestone of 850 consecutive days of journaling. In this interview, we asked Kevin about the importance of keeping a journal and for advice on how to build a journaling habit that lasts."
full_description = 'Streak Stories850 Days with Kevin Anderson"I believe our life is our story and legacy that we can leave behind for others. By journaling, I’m writing a story I hope can be beneficial to those who live after me." By The Day One Team March 21, 2023 Home » Day One Blog » 850 Days with Kevin Anderson Streak Stories is a series that celebrates Day One journalers and their recent milestone of consecutive days of journaling. Each interview features questions about how they built their journaling habit and their best tips for building a long streak. We also explore what they’ve learned from keeping a journal.Kevin Anderson is approaching the impressive milestone of 850 consecutive days of journaling. Kevin, an entrepreneur and digital marketer, owns a clothing brand called Astral Apparel, and lives in Nashville, Tennessee. In this interview, we asked Kevin about the importance of keeping a journal and for advice on how to build a journaling habit that lasts. How long have you been keeping a journal?I have been keeping a journal since my freshman year of college, which was the fall of 2017.What makes journaling important to you? Journaling is important and essential to me because it allows me to reflect and be grateful of each small day to who I have become and how I’ve grown. What do you usually journal about? I usually journal about my daily activities, my thoughts of the day, and my aspirations/goals. “My advice to those wanting to journal would be to make it fun! I write my journals imagining my future self or future kids being able to, in a sense, time travel to when I was writing that time period I journaled.”When do you journal each day?I journal at the beginning and end of the day. At the start of the day I enjoy preparing myself mentally with intentions to make my day great. I enjoy journaling at the end of the day because it’s a way to reflect and make any changes or notice any patterns.What tips or advice would you give others who want to build a journaling habit?My advice to those wanting to journal would be to make it fun! I write my journals imagining my future self or future kids being able to, in a sense, time travel to when I was writing that time period I journaled.What have you learned from keeping a journal?From journaling, I’ve learned a new sense of gratitude and patterns in my habits. By keeping a streak I’m able to see all the steps, forwards and backwards that have brought me to where I am currently.What is your favorite thing about the Day One app? My favorite thing about Day One is being able to print out the journals into printed books. I currently have 5 books of journals. It feels great seeing a collection of books being made that others who live after me can read and learn from. How has Day One helped you journal consistently? Day One has kept my journaling consistent with its notifications and option to add pictures to each day. Adding the pictures is fun to me and gives a flashback from that day. That helps me stay consistent.What else you would like to share about you or your journal? I believe our life is our story and legacy that we can leave behind for others. By journaling I’m writing a story I hope can be beneficial to those who live after me. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list'
