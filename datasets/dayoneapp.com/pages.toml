title = "Privacy Policy"
description = "Your privacy is critically important to us. At Day One we have a few fundamental principles: We are thoughtful about the personal information we ask you"
full_description = "Privacy Policy Your privacy is critically important to us. At Day One we have a few fundamental principles:We are thoughtful about the personal information we ask you to provide and the personal information that we collect about you through the operation of our services. We store personal information for only as long as we have a reason to keep it. We aim to make it as simple as possible for you to control what information in your journal is shared publicly (or kept private), indexed by search engines, and permanently deleted. We help protect you from overreaching government demands for your personal information. We aim for full transparency on how we gather, use, and share your personal information.Below is our Privacy Policy, which incorporates and clarifies these principles.Who We Are and What This CoversHowdy! We’re Automattic Inc. (“Automattic”), the folks behind the Day One application and its related websites (each, an “App​” or a “​Site​”, respectively). Through Day One’s App and Site, we offer you a journaling program to record your memories, and, if you wish, share them with others as well. Below we explain how we collect, use, and share information about you, along with the choices that you have with respect to that information.Throughout this Privacy Policy we’ll refer to Day One’s Sites, Apps, and other services collectively as “Services.” This Privacy Policy only applies to the Day One Services and not to other services provided by Automattic.Creative Commons Sharealike LicenseWe’ve decided to make this Privacy Policy available under a Creative Commons Sharealike license. You’re more than welcome to copy it, adapt it, and repurpose it for your own use. Just make sure to revise the language so that your policy reflects your actual practices. If you do use it, we’d appreciate a credit and link to Automattic somewhere on your site.Information We CollectWe only collect information about you if we have a reason to do so — for example, to provide our Services, to communicate with you, or to make our Services better.We collect this information from three sources: if and when you provide information to us, automatically through operating our Services, and from outside sources. Let’s go over the information that we collect.Information You Provide UsIt’s probably no surprise that we collect information that you provide to us directly. Here are some examples:Your Journal Entries: The most important thing we collect from you are your journal entries. Your journal entries are private. This means that when you use Day One to create a journal, none of the entries in that journal are made publicly viewable on the Internet. Entries are not accessible to other Day One users. We also offer End to End Encryption on our journals. If that option is enabled, it is impossible for our employees to access your journal data. Account Information: If you register and open an “Account” with us in order to use services like Sync and Backups, you provide us basic account information including your email address and a password. Transactional Information: When you purchase Services, we may collect information to complete and record the transaction. For example, if you buy something from us we’ll collect information, like your name and credit card information, to process those payments . If you purchase a printed book we will collect the physical address you want the book mailed to. We also keep a record of the purchases you’ve made. Communications with Us: You may also provide us with information when you provide us feedback or communicate with our Happiness Engineers about a support question. When you communicate with us via form, email, phone, or otherwise, we store a copy of our communications (including any call recordings as permitted by applicable law). You can choose not to provide us with certain information, but this may limit the features of the Services you are able to use.Information We Collect AutomaticallyWe also collect some information automatically:Log information: Like most online service providers, we collect information that web browsers, mobile devices, and servers typically make available, including the browser type, IP address, unique device identifiers, language preference, referring site, the date and time of access, operating system, and mobile network information. We collect log information when you use our Services — for example, when you log into your account or publish a journal entry. Device and Usage Information: We collect your device type, your wireless carrier, your individual device ID, and how you use our Services. In addition, in the event our App(s) crash on your mobile device, we will receive information about your mobile device model software version and device carrier, which allows us to identify and fix bugs and otherwise improve the performance of our App(s). Location Information: We may determine the approximate location of your device from your IP address. We collect and use this information to understand where our users are located so we can identify what features might be meaningful to them. Information from Cookies & Other Technologies: Like many online services, we use cookies to collect information. A cookie is a string of information that a website stores on a visitor’s computer, and that the visitor’s browser provides to the website each time the visitor returns. Pixel tags (also called web beacons) are small blocks of code placed on websites and emails. Automattic uses cookies and other technologies like pixel tags to help us identify and track visitors, usage, and access preferences for our Services, as well as track and understand email campaign effectiveness. For example, we use Google Analytics to help analyze how users use the Site. We do not combine the information generated through the use of Google Analytics with your personal information. Google’s ability to use and share information collected by Google Analytics about your visits to the Site is governed by the Google Analytics Terms of Use and the Google Privacy Policy.Information We Collect from Other SourcesWe may also get information about you from other sources. For example:Third Party Account Information: When you connect an account from another service we typically get some basic information about your account with them. For example, when you connect Day One to your Apple or Google account in order to log in, we may access certain user data such as your name, user ID, email, etc. to provide our Services. Motion, Activity, and Fitness Data: Motion and fitness information is used to enhance the metadata included in individual entries and personal journal summaries. For example, we use the motion processing capabilities of your device to enable you to add step counts to any journal entry. As another example, if you connect Apple HealthKit then time spent in the Day One app will be logged in HealthKit as Mindful Minutes. We never use your motion, activity, or fitness data for advertising and similar services or for use-based data mining. We don’t disclose this information to a third party for their own use or sell it to advertising platforms, data brokers, or information resellers.How We Use the Information We CollectWe use your personal information to:Provide you with Services and customer support; Market Services to you and send you news and information that we believe interests you; Respond to your requests, resolve disputes, and/or troubleshoot problems; Improve the Services and personalize your experience; Communicate with you about the Services; Monitor and analyze trends, usage, and activities in connection with our Services; Detect, investigate, and help prevent security incidents and other malicious, deceptive, fraudulent, or illegal activity, and help protect rights and property of ours and others; and Comply with our legal and financial obligations.We will communicate with you primarily in the form of texts, push alerts, and emails. You can manage the frequency and/or opt out of receiving these communications by changing your settings on the App, texting STOP in reply to our daily reminders, and/or clicking the “Unsubscribe” link at the bottom of each marketing email. Please note that even if you unsubscribe or opt-out of our emails, we may still send you Services related communications (e.g., emails related to your account or the App). How We Share InformationWe share information about you in limited circumstances, and with appropriate safeguards to protect your privacy. These are spelled out below:Third Party Vendors: We may share information about you with third party vendors, consultants, and advisors who help us provide our Services or who otherwise perform services for us. This includes vendors that help us provide our Services to you (like payment providers that process your credit and debit card information, cloud storage services, SMS messaging services, book printing services if you choose to print your journal to a book, and customer chat and email support services that help us communicate with you), those that assist us with our marketing efforts (like sending emails to our marketing list), those that help us understand and enhance our Services (like analytics providers), those that make tools to help us run our operations (like programs that help us with task management, scheduling, word processing, email and other communications, and collaboration among our teams), and other third-party tools that help us manage operations. We require vendors to agree to privacy commitments in order to share information with them; Subsidiaries: We may disclose information about you to a current or future parent company, any subsidiaries, joint ventures, or other companies under a common control (collectively, “Affiliates”), in which case we will require our Affiliates to honor this Privacy Policy; Business Transfers: In connection with any merger, sale of company assets, or acquisition of all or a portion of our business by another company, or in the unlikely event that we go out of business or enter bankruptcy, user information would likely be one of the assets that is transferred or acquired by a third party. If any of these events were to happen, this Privacy Policy would continue to apply to your information and the party receiving your information may continue to use your information, but only consistent with this Privacy Policy; Legal, Regulatory, & Other Obligations: We may disclose information about you if we believe in good faith that such disclosure is necessary to (a) resolve disputes, investigate problems, or enforce our Terms of Service; (b) comply with relevant laws, or warrants, subpoenas, court orders, and other enforceable legal process; or (c) protect the property or rights belonging to Day One, you, third parties, or the public at large. For example, if we have a good faith belief that there is an imminent danger of death or serious physical injury, we may disclose the least amount of information as possible to address the emergency without delay; and With Your Consent: We may share and disclose information with your consent or at your direction. Anonymous InformationWe reserve the right to disclose anonymous information or other information that cannot reasonably be used to identify you publicly without restriction.How Long We Keep InformationWe generally discard information about you when it’s no longer needed for the purposes for which we collect and use it — described in the section above on “How We Use the Information We Collect” — and we’re not legally required to keep it.For example, we keep web server logs for a few months. We retain the logs for this period of time in order to, among other things, analyze traffic, and investigate issues if something goes wrong.As another example, when you close your account we wait for a 5-day recovery window and then permanently delete all of your journal entries, their attachments, and your account data.SecurityWhile no online service is 100% secure, we work very hard to protect information about you against unauthorized access, use, alteration, or destruction, and take reasonable measures to do so. We monitor our Services for potential vulnerabilities and attacks.To enhance the security of your account, all new journal entries are end-to-end encrypted. We encourage account holders of older journal entries to manually enable end-to-end encryption. Journal entries that use end-to-end encryption cannot be accessed by anyone, including us, other than the logged in author of the entry.Your ChoicesYou have several choices available when it comes to information about you:Limit/Update the Information You Provide: You can review, change, and/or delete certain of your personal information by logging into the Site or the App and accessing your account. Delete the App: You can stop all collection of information by the App(s) by uninstalling the App(s). You may use the standard uninstall processes as may be available as part of your mobile device or via the mobile application marketplace or network. Opt out of marketing communications: You may opt out of receiving promotional communications from us. Just follow the instructions in those communications or let us know. If you opt out of promotional communications, we may still send you other communications, like those about your account and legal notices. Set your browser to reject cookies: You can usually choose to set your browser to remove or reject browser cookies before using our Sites, with the drawback that certain features may not function properly without the aid of cookies. Opt out of our internal analytics program: You can do this through your app settings. By opting out, you will stop sharing information with our analytics tool about events or actions that happen after the opt-out.Your RightsIf you are located in certain parts of the world, including some US states and countries that fall under the scope of the European General Data Protection Regulation (aka the “GDPR”), you may have certain rights regarding your personal information, like the right to request access to or deletion of your data.European General Data Protection Regulation (GDPR)If you are located in a country that falls under the scope of the GDPR, data protection laws give you certain rights with respect to your personal data, subject to any exemptions provided by the law, including the rights to:Request access to your personal data; Request correction or deletion of your personal data; Object to our use and processing of your personal data; Request that we limit our use and processing of your personal data; and Request portability of your personal data.You also have the right to make a complaint to a government supervisory authority.A note here for those in the European Union about our legal grounds for processing information about you under EU data protection laws, which is that our use of your information is based on the groun"
