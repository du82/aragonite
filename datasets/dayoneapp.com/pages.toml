["https://dayoneapp.com/about"]
title = "About Day One App"
description = "Day One was started with one mission: to help you discover the transformative power of journaling in your everyday life. Learn more about our journey and commitment to enhancing your personal experience."
full_description = "About UsDay One was started with one mission: to help you discover the transformative power of journaling in your everyday life.Since its inception, Day One has received an overwhelmingly positive response, boasting over ten million downloads, an Apple Editor’s Choice Award, App of the Year Award, Apple Design Award, and above all, a remarkable 4.8-star rating from our treasured users.App Store Android Mac App StoreFree to use. Better with Premium.Who we are Consider Day One as your life’s personal scribe. Always accessible, anytime, anywhere, Day One is your constant companion, helping you capture memorable moments and everyday experiences. What we do Leveraging a beautiful design and robust functionality, Day One assists you in developing the life-enriching habit of journaling. With Day One, you can record, reflect, and revisit your thoughts and memories. Why we do it A growing body of research supports the claim that journaling benefits your physical and psychological well-being. By serving as a safe and personal space for self-expression, Day One enables you to capture life’s journey. App of the Year Apple Editors’ Choice Apple Design AwardMeet our founder, Paul Mayne. Paul founded Day One in 2011 based on a need he saw in his own life to record memories in a private, user-friendly space. The Day One Team The Day One team is a diverse and passionate group of individuals from all corners of the globe. We are creators, developers, and innovators, each bringing unique experiences and skillsets to the table, yet all sharing a deep-rooted passion for journaling. As a fully distributed team, we thrive on remote collaboration, drawing on the wide array of cultural perspectives to continually innovate and improve the Day One experience for our users. Our diversity is our strength, fueling our collective passion to redefine the art of journaling in the digital age.Part of the family.Day One was acquired by Automattic in 2021—the company behind WordPress.com, Tumblr, Pocket Casts, WooCommerce, and more. As part of Automattic, Day One now continues its mission to provide a premium journaling experience while leveraging the innovative technologies of Automattic to deliver the best security, support, and scalability. With this newfound synergy, we aim to enhance user experience, introduce cutting-edge features, and uphold the highest standards of data protection, all while facilitating a seamless and meaningful journaling journey for our global community of users.Read more → “Something so rare it feels almost sacred: A completely private digital space.“ “Day One makes journaling as easy as composing a tweet.” “Day One makes keeping a journal delightfully easy.“ “A simple and always accessible new kind of micro-journaling…“ “Keeping and looking back on a journal can be deeply rewarding, but it’s a tough habit to build. Instead try Day One, a journaling app that makes it easy to quickly record a few thoughts, along with a photo, every day.” “Day One raises the bar for improving upon the journal writing experience.” Our Privacy Pledge Privacy is the literal foundation upon which Day One is built. What you put in Day One will always be your data, but we pledge to protect it like it’s our own. There are few things more private in this life than a personal journal. It’s the place where you can take all those thoughts, emotions, and big feelings swirling around in your head (and heart) and unload them. The desire for a completely private digital space is what motivated the creation of Day One in the first place. This is why privacy isn’t just a feature we offer—it’s the core of what we do. If you’d like to take an even deeper dive into the different ways we protect your data, we encourage you to check out the Day One Privacy Pledge. People ❤️ Day One. Many of our users have already surpassed the incredible milestone of 4000+ consecutive days of journaling, thanks to their unwavering commitment to keeping their streak alive. By building your own journaling streak, you’ll be joining the ranks of these extraordinary individuals, setting your own records and celebrating your personal milestones.Contact us We offer several resources to assist you with any questions you may have while using Day One, including our Help Guides, the Day One Forum, Premium Support, and and partnership inquiries. Capture life’s moments, anytime, anywhere. Download the free Day One journal app for free on iPhone, Android, iPad, Mac, and Apple Watch. Or access your Day One Journal from any browser. App Store Android Mac Login now"
