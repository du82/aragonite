["https://dayoneapp.com/blog/instagram-integration-discontinued"]
title = "Instagram Integration Discontinued"
description = "We regret to inform you that, starting December 4, 2024, Instagram no longer allows apps to import content through the Instagram Basic Display API. This"
full_description = "NewsInstagram Integration Discontinued By The Day One Team December 06, 2024 Home » Day One Blog » Instagram Integration Discontinued We regret to inform you that, starting December 4, 2024, Instagram no longer allows apps to import content through the Instagram Basic Display API. This change means that Day One users will no longer be able to connect their Instagram accounts to import photos and posts into their journals.Why is this happening?Meta, Instagram’s parent company, has retired the Instagram Basic Display API, which powered integrations like ours. While Instagram has introduced new APIs for business accounts, these solutions don’t support personal accounts or provide the functionality our users rely on.What does this mean for you?If you’ve been using Instagram integration to bring your photos or posts into your journal, this feature will no longer function after December 4, 2024.Your existing journal entries with Instagram content will remain intact and accessible. New Instagram content cannot be auto-imported moving forward.Our commitment to youWe know this news is disappointing. At Day One, we’re committed to making journaling as seamless and meaningful as possible, and the Instagram integration was a way to help you bring your memories into your journal. We know many of you relied on it, and it was a favorite among our team as well.While we’re sad to see this integration go, we remain more committed than ever to ensuring that your data stays yours. When platforms like Instagram make it more difficult to export your data, it highlights the importance of tools that prioritize your ownership and access to your memories. That’s why we’ll always provide full data export options, so you can maintain complete control over what you choose to store in Day One.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
