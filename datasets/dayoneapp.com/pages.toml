title = "3,900 Days with Martin Lindert"
description = "Martin Lindert, a resident of Wuppertal, Germany—a city celebrated for its iconic Suspension Railway—has been writing his life down for an impressive"
full_description = "Streak Stories3,900 Days with Martin Lindert By The Day One Team May 23, 2023 Home » Day One Blog » 3,900 Days with Martin Lindert Martin Lindert, a resident of Wuppertal, Germany—a city celebrated for its iconic Suspension Railway—has been writing his life down for an impressive 3,900 days straight. In a journey that started with a paper journal and a fountain pen in 1983 and evolved through various digital platforms until settling with Day One in 2013, Martin’s chronicle captures an array of personal and professional experiences.Working in a company dedicated to supporting long-term unemployed individuals reintegrate into the workforce, Martin’s job is as fulfilling as it is diverse. His work entails everything from managing a fleet of trucks to human resource tasks, invoicing, and customer relations. Yet, despite his demanding profession, Martin’s commitment to journaling remains unwavering.Whether it’s documenting the weather at noon, photographing his daily meals, jotting down unique occurrences at work, or capturing snippets from his favorite games, Martin’s journal entries are a testament to the beauty of ordinary moments. With a blend of technology and creativity, Martin also utilizes the Day One’s functionality to capture and date photos, even if he records them in his journal days later.In this interview, we delve into the heart of Martin’s long-standing journaling journey. From his reasons for starting, the daily habits he’s cultivated, to the lessons he’s learned along the way. We also explore how the Day One app has made his commitment to consistent journaling easier and more enjoyable.How long have you been keeping a journal?I started journaling (better “writing a diary”) in 1983 when I got my first computer (VIC-20) using a fountain pen and a paper journal. About 1999, I switched to digital journaling on my Palm OS device (Natara DayNotez, if anyone is old enough to remember) and 10 years later I got my first iPhone. First I used Momento for journaling and, in 2013, I switched to Day One.What makes journaling important to you? Journaling lets me remember when something happened or what happened on a specific date. One tends to forget so fast. What do you usually journal about? My main Journal is filled with pictures about stuff that I see around me. I take a photo of the weather each day at noon (using IFTTT to get the weather data), my food, strange things happening at work, screenshots from games or my activities, jokes … Everything I find worth remembering. “Just do it, start writing. You don’t have to write like a literature Nobel Prize winner. Maybe think about writing for your children or grandchildren or for your future you.”When do you journal each day?On my main journal I have no special time for journaling, I do it mostly when I took a photo, sometimes I add entries days later and use that “set date for entry to date of photo” feature of Day One.On my “Diary” journal I have set a reminder for 8 pm and use a template to write down some notes. But this is also not a must, I sometimes write entries days later.What tips or advice would you give others who want to build a journaling habit?Just do it, start writing. You don’t have to write like a literature Nobel Prize winner. Maybe think about writing for your children or grandchildren or for your future you.What have you learned from keeping a journal?Things don’t really change, it’s more or less the same every day, sometimes it’s more happy or funny, sometimes it’s more sad. But that’s life as it happens. And in the end it’s my life and I’m fine with it.What is your favorite thing about the Day One app? I just love that I can write entries on my iPhone, iPad or Mac. For a quick entry with a picture it’s easier to do it on the iPhone, longer texts or editing entries is easier to do on iPad or Mac.How has Day One helped you journal more consistently? It’s easy to write in Day One, just open the app and start your entry. No clumsy UI, no keys to remember, just plain writing. If you want, you can add formating but you don’t have to. Day One is just focused on journaling.I also got my first printed Day One book in November and I really love it. Download the Day One Journal App Today The Day One journaling app makes it easy to build and maintain a daily journaling habit. Daily writing prompts and journal streaks are designed to help keep you motivated and consistently journaling. Add photos, videos, and audio to your journal, anytime, anywhere. App Store Android Mac Did you recently cross a journaling streak milestone? We’d love to hear your story! Tell us your Streak Story here.Share this:XFacebookTumblrEmailPrintMoreLinkedInPinterest ← Back to Blog list"
