["http://db.cs.berkeley.edu/jmh"]
title = "Joseph M. Hellerstein"
full_description = 'Jim Gray Professor of the Graduate School EECS Computer Science Division UC Berkeley <lastname>@cs.berkeley.edu http://www.linkedin.com/in/joehellerstein My research focuses broadly on data-oriented systems and the way they drive computing. This spans topics in database systems, distributed computing, data visualization, machine learning and programming languages. In 2020 I co-founded RunLLM, an LLM-powered assistant for technical support. RunLLM grew out of research in the RISELab and SkyLab with my colleague Joseph Gonzalez and PhD students Vikram Sreekanti and Chenggang Wu. In 2012 I co-founded Trifacta, a cloud data engineering platform that runs on AWS, Azure and GCP (where it also powers Google Dataprep by Trifacta). Trifacta is based on prior research in my group on interactive data preparation [1, 2, 3]. Trifacta was acquired by Alteryx in 2022. Greenplum was a parallel data warehouse startup based on PostgreSQL. I served as an advisor, collaborator (on Apache MADlib) and briefly as Engineering Manager at the startup, on through its acquisition by EMC in 2010, where I also served as a technical advisor. Intel Research Berkeley was an experimental lablet that colocated Intel staff researchers next to Berkeley faculty and students to do "off-roadmap" experimental research. I took a leave to join Intel as Lab Director from 2003-2005, leading research topics in networking, distributed systems, databases, IoT and human-computer interaction.'
