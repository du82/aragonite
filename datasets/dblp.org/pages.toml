["https://dblp.org/db/about/privacy.html"]
title = "dblp: Data Privacy Policy"
description = "Bibliographic content of Data Privacy Policy"
full_description = "As of May 25th, 2018, we are updating our data privacy policy in accordance with the EU General Data Protection Regulation (GDPR) and German national regulations. On this page, you can find an abridged and legally non-binding summary of our policy. For the complete policy (in German only), see: Log files of HTTP requests are stored by the web services to guarantee the operation of our services. Information stored in these these log files contain, among other technical information, IP, date, time and target of your request, and the referer and user-agent information sent by your browser. Log files are deleted regularly, but at the latest after 12 months, and are protected against unauthorized access. We guarantee that cookies are only used to improve the user-friendliness of our website (e.g. to store a user's preferred data view). An identification of your browser after a page change or a tracking of your behavior does not take place. If you prefer that dblp does not store any cookies whenever you visit our website, please deactivate the use of cookies in your web browser. You can find more details on the concrete cookies we store in our FAQ. Only in a small number number of instances, the dblp website will tell your browser to load data from third-party APIs (e.g., loading tweets from twitter.com). These features will always be optional, disabled by default, and a checkbox will be available where you can choose to enable and disable contacting third-party sites at any time. Please note that we do not have any control over how a third-party might use your connection data, so please proceed with care. The dblp computer science bibliography collects, curates, indexes, and organizes bibliographic metadata of scholarly publications in computer science. The collection contains all bibliographic core metadata that are usually accompanied by scholarly publications. This also applies to person-related metadata published by authors and editors about themselves in publicly available sources for the purpose of identification, such as given names, persistent IDs, institutional affiliations, or hyperlinks to academic websites. The metadata is obtained from publically available sources, such as publisher websites or open metadata APIs."
