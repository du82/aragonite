title = "dblp: Copyright, Licence, Term of Use, Disclaimer"
description = "Bibliographic content of Copyright, Licence, Term of Use, Disclaimer"
full_description = "The dblp computer science bibliography, subsequently referred to as dblp, is copyright by Schloss Dagstuhl - Leibniz Center for Informatics (German: Schloss Dagstuhl - Leibniz-Zentrum für Informatik GmbH). The metadata provided by dblp on its webpages, as well as their XML, JSON, RDF, RIS, BibTeX, and text export formats available at our website, is released under the CC0 1.0 Public Domain Dedication license. That is, you are free to copy, distribute, use, modify, transform, build upon, and produce derived works from our data, even for commercial purposes, all without asking permission. Of course, we are always happy if you provide a link to us as the source of the data. To ensure compatibility with existing integrations of our data, all metadata is also released under Open Data Commons ODC-BY 1.0 license as a secondary license. If you are currently using our data under ODC-by 1.0, please update to CC0 accordingly. The dblp team puts much effort into guaranteeing that this web service is as up-to-date, factually correct, and as complete as possible. However, it cannot be precluded that there are flaws, errors, inconsitencies, and missing entries in the provided data. No liability whatsoever shall be assumed for claims following from material or immaterial damage or loss as the result of the use of or the inability to use our data, or the use of erroneous or incomplete data, unless premeditation or gross negligence on the part of dblp can be demonstrated. Your use of the data provided on this website is at your own risk. In dblp, brand, product and company names are used without mentioning eventual existing patents, gebrauchsmuster, or trademark rights, as it is the customary practice in scientific bibliographies. The use without mentioning existing patents, gebrauchsmuster, or trademarks does not give reason for the assumption, a brand or tradename is free of such rights. All protected brands, products or company names mentioned are the trademarks of their respective owners."
