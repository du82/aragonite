full_description = 'The dblp computer science bibliography is a joint service of Schloss Dagstuhl - Leibniz Center for Informatics and the University of Trier. Schloss Dagstuhl is a "gemeinnützige GmbH" (i.e., a charitable non-profit organization under German law) that has been founded to support and promote the worldwide computer science community. Schloss Dagstuhl receives funding from the federal government of Germany and from the federal states of Saarland and Rhineland-Palatinate. The University of Trier is a state university with - among other topics - a research focus on digital methods and the handling of bibliographic metadata. The universities main budget comes from the federal state of Rhineland-Palatinate. Dr. Michael Ley Schloss Dagstuhl - Leibniz Center for Informatics dblp computer science bibliography University of Trier, Campus II, H511-H517 54286 Trier Germany e-mail: leyuni-trier.de phone: +49-6871-905-0 dblp computer science bibliography ist ein gemeinsamer Internetdienst von Schloss Dagstuhl - Leibniz-Zentrum für Informatik GmbH und der Universität Trier. Schloss Dagstuhl - Leibniz-Zentrum für Informatik GmbH, Oktavieallee, 66687 Wadern, ist eine gemeinützige GmbH im Sinne der §§ 51 ff. AO. Sie wird durch die Geschäftsführung (Prof. Raimund Seidel, Ph.D. und Heike Meißner) vertreten. Schloss Dagstuhl LZI ist registriert beim Amtsgericht Saarbrücken (Registernummer: HRB 63800). Umsatzsteuer-Identifikationsnummer gemäß § 27a Umsatzsteuergesetz: DE 137972446. Die Universität Trier ist eine Körperschaft des öffentlichen Rechts. Sie wird durch den Präsidenten (Prof. Dr. Michael Jäckel) gesetzlich vertreten. Die zuständige Aufsichtsbehörde ist das Ministerium für Wissenschaft, Weiterbildung, Forschung und Kultur Rheinland-Pfalz, Mittlere Bleiche 61, 55116 Mainz. Dr. Michael Ley Schloss Dagstuhl - Leibniz-Zentrum für Informatik dblp computer science bibliography Universität Trier, H538, Campus II 54286 Trier Deutschland E-Mail: leyuni-trier.de Telefon: +49-6871-905-0'
