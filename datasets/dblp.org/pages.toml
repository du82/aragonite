["https://dblp.org"]
title = "dblp: computer science bibliography"
description = "The dblp computer science bibliography is the online reference for open bibliographic information on major computer science journals and proceedings."
full_description = "Update May 7, 2017: Please note that we had to disable the phrase search operator (.) and the boolean not operator (-) due to technical problems. For the time being, phrase search queries will yield regular prefix search result, and search terms preceded by a minus will be interpreted as regular (positive) search terms. Since this December’s release, hosting the monthly dblp dump snapshots (in both XML and RDF/N-Triples format) has moved to the Dagstuhl Research Online Publication Server (DROPS). This step brings many advantages over the old Apache Directory Listings solution that dblp has been using since the mid-1990s: The DROPS digital library […] The dblp Knowledge Graph (dblp KG) is a fully semantic view on all the data and relationships that you can find in the dblp computer science bibliography. In the recent years, the dblp team has been actively working on building the dblp KG, as we already discussed in several recent […] More than two years ago, we first published our dblp Knowledge Graph as an dblp RDF dump file. We have since been working on expanding and updating our RDF schema, as well as on adding new semantic relations to the graph. Today, we release our first major extension to the […] (updated 2023-06-28) A few days ago, we discussed the new dataset publications in dblp. As a preparation for more and more detailed datasets we slightly modify the DTD that defines the structure of our XML data export. A quick reminder: you can download the dblp dataset as a single XML […] The dblp computer science bibliography provides open bibliographic information on major computer science journals and proceedings. Originally created at the University of Trier in 1993, dblp is now operated and further developed by Schloss Dagstuhl. For more information check out our F.A.Q. You may download the raw dblp data in a single XML file. A simple DTD is available. The paper DBLP - Some Lessons Learned documents technical details of this XML file. In the appendix DBLP XML Requests you may find the description of a primitive dblp query API. All metadata is released as open data under CC0 1.0 license."
