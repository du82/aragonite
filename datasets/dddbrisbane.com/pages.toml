title = "DDD Brisbane - Saturday, 7 December 2024"
description = "DDD Brisbane is a non profit community event run by developers for developers. Anyone can submit a session to the event and delegates then vote on the sessions they want to see."
full_description = "DDD Brisbane is a non profit community event run by developers for developers. Anyone can submit a session to the event and delegates then vote on the sessions they want to see. If you'd like to sponsor DDD Brisbane, please email [email protected]. If you'd like to be involved, please contact the organisers at [email protected]. When and where? The event will be held on Saturday, 7 December 2024 at Brisbane State High School , in P and I blocks. Enter through gate M4 and gate M6. How much is the event? $49. DDD Brisbane is a non-profit event and any excess will be kept as part of a fund for future events. We usually try to spend it all on swag for the attendees though. Will refreshments be provided? Yes, delegates will receive lunch and snacks throughout the day. There will be coffee. I would like to sponsor DDD Brisbane Great! DDD Brisbane is an extremely visible event in the Brisbane developer community and we believe offers a fantastic marketing opportunity. It's also a great chance to give back and support the local development community. We have various levels of sponsorship available and opportunities for logo placement on the website, agenda, delegate slides, speaker shirts and we are happy to include advertisements in delegate packs. For more information please email [email protected] I would like to do this kind of thing more often Brisbane has a very active developer community. Consider attending one of the meetups such as Brisbane .Net User Group, BrisJS, Brisbane Functional Programming Group, Agile Brisbane, Brisbane GitHub User Group, Brisbane Azure User Group, or Queensland C# Mobile Developers (iOS/Android/Windows). Who is coordinating this event? DDD Brisbane is coordinated by Bronwen Zande, Chris Gilbert, and Damian Brady. DDD Brisbane 2024 will be held at the Brisbane State High School , in P and I blocks. Enter through gate M4 and gate M6. Note that in previous years the event has been held at QUT, UQ, and The Hilton. We recommend you don't go there this time!"
