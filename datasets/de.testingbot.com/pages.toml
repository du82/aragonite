["https://de.testingbot.com/security"]
title = "Sicherheit der Enterprise-Klasse – TestingBot"
description = "Sicherheit der Enterprise-Klasse für Cloud-basierte Selenium-Tests."
full_description = "Für jeden Test, den Sie ausführen, erstellen wir eine brandneue virtuelle Maschine (VM) mit der Plattform / dem Browser / Gerät, auf der Sie testen möchten. Jeder Test läuft auf einer makellosen, frisch gestarteten Maschine. Alles, was Ihr Test auf der VM macht, wird durch COW (Copy-On-Write) auf eine RAM-Disk (Speicher) geschrieben. Am Ende des Tests, nachdem wir Screenshots, Protokolle und Videos des Tests gesammelt haben, weisen wir unseren Hypervisor an, die RAM-Disk und die VM vollständig zu löschen. Jeder Test läuft auf eigene Faust, Firewall, VM. TestingBot stellt sicher, dass nur Sie auf die VM zugreifen können. Der gesamte andere Verkehr wird blockiert, indem eine Firewall für jede ausgeführte VM durchgesetzt wird. VMs können nur auf das öffentliche Internet zugreifen. Oder, falls Sie einen TestingBot-Tunnel betreiben, den Inhalt auf Ihrem Computer / Netzwerk. Standardmäßig erstellen wir Screenshots und ein Video Ihres Tests zusammen mit der Protokollierung verschiedener Komponenten (Selenium-Logs, Chrome-Treiber-Logs, Firefox-Treiber-Logs, Konsolen-Logs, ...). Diese Assets werden über SSL auf unsere Asset-Server hochgeladen. Der Zugriff auf diese Ressourcen ist eingeschränkt: Wir erstellen eine signierte URL für jedes Asset. Auf jedes Asset kann nur für 30 Minuten über SSL zugegriffen werden. Sie können auch Protokollierung, Screenshot und Videoaufnahme deaktivieren. Auf diese Weise werden wir nichts während Ihres Tests aufzeichnen. Als Eigentümer oder Administrator können Sie die Anzahl der parallelen Tests verteilen, die Ihr Abonnement zwischen Mitgliedern Ihres Teams ausführen darf. Sie können einen Überblick über die Aktivitäten eines Benutzers (Testläufe, Logins, ...) sehen und Benutzer zu Ihrem Team hinzufügen / entfernen."
year_published = 2025
