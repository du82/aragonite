full_description = "Jeder Plan beinhaltet alle unseren OS-/Browser-/Geräteplattformen mit in Echtzeit verfügbaren VMs. Außerdem enthalten sind Videowiedergaben von Tests, unbegrenzte manuelle Tests, unbegrenzte Screenshots und Debugging-Tools. TestingBot integriert sich mit allen Sprachumgebungen und CI-Systemen. Nein, Sie benötigen keine Kreditkarte Mit Ihrem kostenlosen Plan können Sie unseren Dienst für zwei Wochen ausprobieren - ohne etwas zu bezahlen. Wenn Sie einen bezahlten Plan erweitern möchten, können Sie dies ganz einfach mittels Kreditkarte oder Banküberweisung vornehmen. Unsere Pläne basieren auf monatliche Abonnements, die Sie jederzeit kündigen können. Wenn Sie in der Mitte des Monats kündigen, wird der laufende Monat berechnet. Es fallen aber keine weitere Kosten für einen jährlichen Vertrag oder ähnliche Gebühren an. Parallele Tests geben an, wie viele Tests gleichzeitig ausgeführt werden können. Mehr parallele Tests bedeuten eine höhere Verkürzung der Gesamttestzeit. Wir lieben Open-Source-Projekte! Wenn Sie ein Open-Source-Projekt haben, melden Sie sich bitte für unseren Open-Source-Plan an. Wenn Ihre verfügbare Testzeit für den Monat aufgebraucht wurde, können Sie für den restlichen Monat keine weiteren Tests durchführen. Wenn Sie weitere Tests laufen lassen möchten, sollten Sie in Erwägung ziehen, Ihren derzeitigen Plan zu erweitern"
