full_description = "MAG Exhibitcatdev2021-09-01T11:27:41-04:00 @media only screen and (max-width:1024px) {.fusion-title.fusion-title-1{margin-top:0px!important; margin-right:0px!important;margin-bottom:0px!important;margin-left:0px!important;}}@media only screen and (max-width:850px) {.fusion-title.fusion-title-1{margin-top:0px!important; margin-right:0px!important;margin-bottom:20px!important; margin-left:0px!important;}}De’VIA at the Memorial Art GalleryMemorial Art Gallery (MAG) hosted De’VIA: The Manifesto Comes of Age exhibit on November 7, 2019-February 16, 2020 with selected Deaf-themed works from RIT/NTID Dyer Arts Center and local collectors. Below are links to the panel didactics, labels, and other materials here to preserve the history of this important exhibition honoring the 30th anniversary of Deaf View/Image Art De’VIA and the 10th anniversary of Surdism. MAG’s descriptor of the show and videos of several Deaf artists explaining their works in ASL follows. Picture credit: Nancy Rourke, Second Wave of Milan .fusion-body .fusion-builder-column-0{width:100% !important;margin-top : 0px;margin-bottom : 20px;}.fusion-builder-column-0 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 1.92%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 1.92%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-0{width:100% !important;order : 0;}.fusion-builder-column-0 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:850px) {.fusion-body .fusion-builder-column-0{width:100% !important;order : 0;}.fusion-builder-column-0 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}De’VIA Panels Click below to see the full PDF .fusion-body .fusion-builder-column-1{width:50% !important;margin-top : 0px;margin-bottom : 20px;}.fusion-builder-column-1 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 3.84%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 3.84%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-1{width:100% !important;order : 0;}.fusion-builder-column-1 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:850px) {.fusion-body .fusion-builder-column-1{width:100% !important;order : 0;}.fusion-builder-column-1 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}De’VIA Labels Click below to see the full PDF .fusion-body .fusion-builder-column-2{width:50% !important;margin-top : 0px;margin-bottom : 20px;}.fusion-builder-column-2 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 3.84%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 3.84%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-2{width:100% !important;order : 0;}.fusion-builder-column-2 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:850px) {.fusion-body .fusion-builder-column-2{width:100% !important;order : 0;}.fusion-builder-column-2 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}.fusion-body .fusion-flex-container.fusion-builder-row-1{ padding-top : 0px;margin-top : 0px;padding-right : 0px;padding-bottom : 0px;margin-bottom : 0px;padding-left : 0px;}De’VIA: The Manifesto Comes of Age November 7, 2019-February 16, 2020 In 1989 a group of Deaf artists and a Deaf art historian convened to discuss contemporary art by Deaf artists. Recognizing a growing body of work that explicitly explored Deaf culture and Deaf experience, the group issued a manifesto that proclaimed a new genre of art, articulated its defining features, and named it: De’VIA: Deaf View/Image Art. During the movement’s 30th anniversary year, the Memorial Art Gallery is pleased to host De’VIA: The Manifesto Comes of Age with work by the genre’s precursors, founders, and artists whose work reflects the movement’s enduring influence. The exhibition draws principally from the permanent collection of RIT’s Dyer Arts Center, which is located on the campus of the National Technical Institute for the Deaf. The exhibition is curated by Tabitha Jacques, director of the Dyer Arts Center, and Patricia Durr, artist and NTID faculty. With one of the largest Deaf communities in the country, Rochester is often referred to as the country’s most Deaf-friendly community, a reputation earned in part thanks to its strong educational commitments to Deaf Education, starting in 1876 with the founding of the Rochester School for the Deaf, and the National Technical Institute for the Deaf, which was founded in 1965. https://mag.rochester.edu/exhibitions/devia-the-manifesto-comes-of-age/ .fusion-body .fusion-builder-column-3{width:100% !important;margin-top : 0px;margin-bottom : 20px;}.fusion-builder-column-3 > .fusion-column-wrapper {padding-top : 0px !important;padding-right : 0px !important;margin-right : 1.92%;padding-bottom : 0px !important;padding-left : 0px !important;margin-left : 1.92%;}@media only screen and (max-width:1024px) {.fusion-body .fusion-builder-column-3{width:100% !important;order : 0;}.fusion-builder-column-3 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:850px) {.fusion-body .fusion-builder-column-3{width:100% !important;order : 0;}.fusion-builder-column-3 > .fusion-column-wrapper {margin-right : 1.92%;margin-left : 1.92%;}}@media only screen and (max-width:1024px) {.fusion-title.fusion-title-2{margin-top:0px!important; margin-right:0px!important;margin-bottom:0px!important;margin-left:0px!important;}}@media only screen and (max-width:850px) {.fusion-title.fusion-title-2{margin-top:0px!important; margin-right:0px!important;margin-bottom:20px!important; margin-left:0px!important;}}De’VIA VideosClick 