["https://deaf-art.org/profiles/alex-wilhite"]
title = "Alex Wilhite – Deaf Art"
description = """
ARTIST’S WEBSITE » 

 

Alex Wilhite, Painter
1990, MFA, Pratt Institute, Brooklyn, New York

1987, BFA, University of North Alabama, Florence, Alabama.

Alex attended Rochester Institute of Technology, National Technical Institute for the Deaf from 1980 to 1985.

Alex Wilhite, who has been deaf since birth, attended to the Central Institute for the Deaf (CID) in St. Louis, Missouri, the American School"""
full_description = "Alex Wilhite .fusion-button.button-1 {border-radius:2px;}ARTIST’S WEBSITE » Alex Wilhite, Painter 1990, MFA, Pratt Institute, Brooklyn, New York 1987, BFA, University of North Alabama, Florence, Alabama. Alex attended Rochester Institute of Technology, National Technical Institute for the Deaf from 1980 to 1985. Alex Wilhite, who has been deaf since birth, attended to the Central Institute for the Deaf (CID) in St. Louis, Missouri, the American School of Kuwait, Kuwait City, Kuwait and returned to the United State of America and was awarded high school degree from the Deshler High School, Tuscumbia, Alabama. He went to the National Technical Institute for the Deaf, Rochester, New York and Gallaudet University, Washington, D.C. briefly. Where he received B.F.A. from the University of North Alabama 1987 and his M.F.A. from Pratt Institute, Brooklyn, New York 1990. Wilhite’s large-scale works are boldly abstract, geometrically precise and typically characterized by bright, strong colors. Post-minimalist painter, Wilhite considers Post-World War II abstract artists like Jackson Pollack, Frank Stella, and Mark Rothko his greatest influences. Wilhite has participated in both solo and groups exhibitions in the United States, Europe, and Japan, and has participated in artist-in-residency programs and other art programs for children in Kentucky and Alabama. Currently he is participating as a full time art teacher to teach with the adults with developed disabilities at the Enrichment Center, Winston-Salem, North Carolina. One of Wilhite’s paintings, Illusion of Red & Blue, is featured on the cover of Design for Accessibility: an Arts Administrators Guide, published in 1994 by the National Assembly of State Art Agencies and the National Endowment of the Arts. “Years of traveling throughout the world have inspired my perception of color. Color is the value of the three primary colors changing into varieties of different colors. High or strong colors define outlines; strong contrasts are involved in my style of painting, as I develop two- and three-dimensional forms. I am deeply interested in combining hard-edge paintings with flowing optical colors to create action.” .fusion-gallery-1 .fusion-gallery-image {border:0px solid #f6f6f6;} catdev2018-09-19T16:47:59-04:00"
