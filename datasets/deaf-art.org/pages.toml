["https://deaf-art.org/profiles/amy-cohen-efron"]
title = "Amy Cohen Efron – Deaf Art"
description = """
ARTIST’S WEBSITE 

 





Amy Cohen Efron is a native Brooklynite and is a late bloomer artist. I was born Deaf, and all of my childhood life; I dabbled in different art mediums to express my innermost thoughts and feelings. This was the only way that I could effectively communicate."""
full_description = "Amy Cohen Efron .fusion-button.button-1 {border-radius:2px;}ARTIST’S WEBSITE Amy Cohen Efron is a native Brooklynite and is a late bloomer artist. I was born Deaf, and all of my childhood life; I dabbled in different art mediums to express my innermost thoughts and feelings. This was the only way that I could effectively communicate. I took several art classes at school and college. I minored in Studio Art, while majoring in Psychology at Gallaudet University in Washington, D.C. I started my professional career as a school psychologist in 1992, and I worked for a non-profit organization, several state schools for the Deaf, and a residential treatment center for Deaf children for 25 years. In 2006, I founded my website, Deaf World As Eye See It where I express my thoughts in English and American Sign Language. The website was placed on hiatus in 2012. Recently, I was experiencing my “mid-life crisis” and I started dabbling in art to cope through this time. I instantly got hooked. My artworks were displayed in various galleries across the country..fusion-gallery-1 .fusion-gallery-image {border:0px solid #f6f6f6;} My art is about my Deaf experience, focusing on how I view the society; how the society views me; and the relationship between the society and me. All my art works are visually striking, explosive, subliminal, and abstract. I do not limit myself to one medium, style, or concept. My work is a constant search for the best way to interpret the absurdity, resistance, and celebration I’ve experienced everyday. I try addressing controversial themes and raising thought-provoking questions through art. I believe advertising imagery, with hidden messages, bold colors, strong lines, and using symbolism, serve as significant influences in my art. It is my goal for creating art as an agent for social change. If a viewer stops for just a moment to view, think, and reflect on artwork I have created, then I have succeeded. .fusion-gallery-2 .fusion-gallery-image {border:0px solid #f6f6f6;} patti durr2023-07-05T12:21:31-04:00"
