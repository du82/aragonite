title = "Ashley Vickers – Deaf Art"
description = """
ARTIST'S WEBSITE 

 

Ashley Vickers is originally from Valdosta, GA and currently lives in Tampa, FL. Vickers earned a bachelor’s degree in graphic design from RIT in 2008 and is the communications coordinator of Florida Deaf Art Show. A few years after college, Ashley geared her creativity away from computers towards painting. Her vibrant paintings that"""
full_description = "Ashley Vickers .fusion-button.button-1 {border-radius:2px;}ARTIST’S WEBSITE Ashley Vickers is originally from Valdosta, GA and currently lives in Tampa, FL. Vickers earned a bachelor’s degree in graphic design from RIT in 2008 and is the communications coordinator of Florida Deaf Art Show. A few years after college, Ashley geared her creativity away from computers towards painting. Her vibrant paintings that range from landscapes to deaf visual art reside in numerous U.S. private art collections and in a few homes internationally. Her latest solo show called “Rise Up: Silent Margins” was held in Rochester, NY at the Dyer Arts Center at NTID. The show encompassed 19 paintings that visually speak of Vickers’ journey as an oral deaf person seeking her identity between worlds and how ASL has helped her fill in the gaps of verbal communication and identity. Click images for title and specs for each artwork. .fusion-gallery-1 .fusion-gallery-image {border:0px solid #f6f6f6;} patti durr2023-06-15T18:12:15-04:00"
