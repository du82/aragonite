["https://deaf-art.org/profiles/alexei-svetlov"]
title = "Alexei Svetlov – Deaf Art"
description = """
ARTIST’S WEBSITE » 

 

Alexei Svetlov was born September 7th, 1964 in St. Petersburg, Russia.

From the early childhood he liked to draw and at the age of five he was taken as a student to The Children Art Studio at the Hermitage and successfully graduated at the age of 13. Three times during his solarship he"""
full_description = "Alexei Svetlov .fusion-button.button-1 {border-radius:2px;}ARTIST’S WEBSITE » Alexei Svetlov was born September 7th, 1964 in St. Petersburg, Russia. From the early childhood he liked to draw and at the age of five he was taken as a student to The Children Art Studio at the Hermitage and successfully graduated at the age of 13. Three times during his solarship he participated at We are drawing in the Hermitage exhibitions. In 1987 he graduated from the Political Technical School in Pavlovsk-Petersburg, becoming a professional art decorator. At the same time he attended the studio of the artists I. Suvorov at the Academy of Arts and Design and he also attended the studio of the famous artist E. Moiseenko at The Academy of Arts in St. Petersburg. In 1990 Alexei became a member of the Artist Union of Russia. From 1987-1992 he was employed as an instructor in Art Decoration at Children Group Boarding High School for deaf children. In 1991 Alexei was a participant of the Russian-American project Harmony, and he worked as a teacher of drawing at schools for deaf children in the cities of Vermont state, USA. The filmstudio Lennauh-film invited him to take part in the documentary film In other eyes about the art life of different invalids. In 1992 he was invited by the filmstudio Lenfilm (Troiskij Most) to play the part of a deaf boy in the film On the Irtysh River after a novel of the russian writer Zalygin. The film was ordered by the french TV TF1. He also lead many art workshops for children in the cities of Finland, Netherland and Austria. Alexei Svetlov is also designer and creater of posters, theatre sets, flats, backdrops, and so on. He is the founder of the group Real G.A.S—Company of Performance Arts, which has the aim of various activities and projects of art. Alexei Svetlov is now living in Austria. catdev2018-09-07T12:09:25-04:00"
