full_description = "Bob Green DESCRIPTION OF WORK: Graphic design, design management and consultations on design needs for corporations, startups, non-profits and marketing firms – President/Owner of Green Graphics Design, Inc. ARTWORK RELATED OR NOT RELATED TO DEAFNESS: I have a deep interest for consistent design to visually communicate for the deaf – it’s another way of reaching out. I make sure design communicates clearly to deaf and hearing communities. I intend to provide design services to help the deaf and hearing. WERE YOU BORN DEAF? Not really – I was premature baby and could not breathe due to too much oxygen in the incubator which affected my hearing. DID YOU ATTEND DEAF SCHOOLS? WHERE? A.) Millheck Manor School for Deaf B.) Hearing Schools at elementary education and junior high school and high school C.) SUNY at Farmingdale (Jr. College) ’71 AAS Degree (Advertising Art Major) D.) RIT/NTID ’75 BFA (Communications Design) E.) Currently part time student at University of Westminster (England) – MBA (Design Management) LIST OTHER FAMILY MEMBERS THAT ARE DEAF: My wife Sally, buI was the only deaf one in my family when growing up. I thank my parents for mainstreaming early and for their encouragement. My daughter Sam is hearing and we love her! METHODS OF COMMUNICATION IN YOUR FAMILY: Oral Communications w/ little signing – I use phone most of the time ADDITIONAL INFORMATION: Thank you for this honor and is indeed a testimonial of relationship w/ RIT & NTID for a number of years. I would like to thank the many who have helped me for my career and could not have done this without them. Thank You! .fusion-gallery-1 .fusion-gallery-image {border:0px solid #f6f6f6;} catdev2018-09-19T16:34:54-04:00"
