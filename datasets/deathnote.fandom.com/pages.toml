full_description = '''English Català Deutsch Español Suomi Français Italiano 日本語 Polski Português Português do Brasil Русский Home View source History Talk (61) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Welcome to Death Note Wiki High school student Light Yagami discovers a supernatural notebook that allows him to kill anyone by writing the victim's name while picturing their face. The story follows his attempts to become a god by creating a New World cleansed of evil by using the notebook, and the complex conflict between himself and all those who try to stop or help him. Death Note is a shounen series created by writer Tsugumi Ohba and artist Takeshi Obata. It began as a manga serialized in Weekly Shounen Jump in 2003, and it has been adapted into a live-action Japanese film series beginning in 2006, an anime series in 2006, a musical in 2015, a live-action television drama in 2015, an American film in 2017, and a German audio drama in 2018. Welcome to Death Note Wiki, the fan-operated site documenting the Death Note series! We are currently editing 631 articles and 6,084 files, and you can help! Death Note Wiki reveals plot details and spoilers about the series! Series and adaptations <img style="" src="https://static.wikia.nocookie.net/deathnote/images/b/b1/Volume_1.jpg/revision/latest/scale-to-width-down/160?cb=20170726180340" title="Death Note (manga) (852 KB)" class="thumbimage" alt="Manga 2003 - 2006" height="240" width="160" data-image-name="Volume 1.jpg" data-image-key="Volume_1.jpg" data-relevant="1" data-caption="&lt;br /&gt;2003 - 2006">Manga2003 - 2006<img style="" src="https://static.wikia.nocookie.net/deathnote/images/7/76/DEATH_NOTE_anime.jpg/revision/latest/scale-to-width-down/164?cb=20170720215429" title="Death Note (anime) (130 KB)" class="thumbimage" alt="Anime 2006 - 2007" height="213" width="164" data-image-name="DEATH NOTE anime.jpg" data-image-k