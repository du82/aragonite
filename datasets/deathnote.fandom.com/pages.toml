ss="thumbimage" alt="Video Games" height="284" width="160" data-image-name="Othellonia card 1572 Misa.jpg" data-image-key="Othellonia_card_1572_Misa.jpg" data-relevant="1" data-caption="">Video Games<img style="" src="https://static.wikia.nocookie.net/deathnote/images/a/a4/DNOSTIII.jpg/revision/latest/scale-to-width-down/184?cb=20160419033410" title="Category:Music (52 KB)" class="thumbimage" alt="Music" height="213" width="184" data-image-name="DNOSTIII.jpg" data-image-key="DNOSTIII.jpg" data-relevant="1" data-caption="">Music<img style="" src="https://static.wikia.nocookie.net/deathnote/images/4/47/Nendoroid_Petit_Case_File_01.jpg/revision/latest/scale-to-width-down/213?cb=20171023234800" title="Category:Merchandise (35 KB)" class="thumbimage" alt="Merchandise" height="213" width="213" data-image-name="Nendoroid Petit Case File 01.jpg" data-image-key="Nendoroid_Petit_Case_File_01.jpg" data-relevant="1" data-caption="">Merchandise News & announcements October 20, 2022 - The upcoming live-action Netflix series will be written by Halia Abdel-Meguid. July 6, 2022 - The Duffer Brothers are working on a new live-action Death Note adaptation for Netflix; this is "an entirely new take", not connected to the 2017 Netflix film. April 1, 2022 - Death Note: The Musical begins its third performance run in South Korea. February 4, 2021 - Death Note: Short Stories was released in Japan. February 4, 2020 - The new Death Note one-shot chapter was released in Jump SQ issue #3. The issue will feature Death Note on the cover and the 87-page chapter will have a color page. January 20, 2020 - Death Note: The Musical began its third performance run in Tokyo with a new cast. Earlier news (click to expand): September 19, 2019 - Preorders open for an L & Watari statue from Oniri Creations. August 2019 - An Light & L statue was released by MegaHouse. July 13 - August 12, 2019 - Takeshi Obata held his first art exhibition in Tokyo, Japan, titled Never Complete. It features art from his various works including Death Note, and hosts a preview of a new upcoming Death Note one-shot. July 5, 2019 - At Japan Expo, Oniri Creations unveiled the unpainted prototype for a new L & Watari figurine. March/April 2019 - A Light & Ryuk Diorama was released by Oniri Creations. February 28, 2019 - The final three episodes for the Death Note audio drama were released in German. February 2019 - The mobile game Othellonia held another Death Note crossover event. February 15, 2019 - Jump Force video game was released. It features various characters from Shonen Jump, including Light and Ryuk, although both are non-playable characters. January 31, 2019 - Episodes 7, 8, and 9 for the Death Note audio drama were released in German. January 22, 2019 - Death Note: Light Up the NEW World was released subtitled on DVD and Blu-ray in North America by Funimation. The first two Japanese live-action films Death Note and Death Note: The Last Name were also re-released subtitled. November 30, 2018 - Episodes 4, 5, and 6 for the Death Note audio drama were released in German. November 24, 2018 - A Russian-language concert for Death Note: The Musical performed in Moscow, Russia. All main singing roles were performed for the first time. October 26, 2018 - The first three episodes for the Death Note audio drama were released in German. October 2018 - Announcement: Wikia.com is moving to Fandom.com, and Death Note Wiki will be among the first wikis moved to the new address. All links will be forwarded after the move, so traffic from links to the former address will not be disrupted. (Staff blog announcement here.) August 22, 2018 - Announcement: A sequel to Netflix's 2017 Death Note film is in development. August 15, 2018 - The board game Death Note: Confrontation was released. July 17th, 2018 - Shonen Jump Exhibition Vol. 3 opened, featuring the 2000 era of Shonen Jump including Death Note. The Exhibitions are for Jump's 50th anniversary. May 30th - June 15th, 2018 - Jumputi Heroes mobile game began events related to Death Note. Light, Misa, and L became available in the game. January 13th, 2018 - The 2017 version of Death Note: The Musical with Hayato Kakizawa aired on WOWOW television in Japan. December 12th, 2017 - A Russian-language concert for Death Note: The Musical performed in St. Petersburg, Russia. December 2nd, 2017 - The 2017 version of Death Note: The Musical with Kenji Urai aired on WOWOW television in Japan. November 17th, 2017 - The film Death Note: Light Up the NEW World aired on television for the first time on "Friday Road Show". The version that aired is a special edition edited by the director Shinsuke Sato. October 31st and November 2nd, 2017 - Russian-language concert for Death Note: The Musical performed in Moscow, Russia. September 28th, 2017 - Netflix released Death Note: The VR Experience, an interactive video, on YouTube. September 8th-20th, 2017 - The mobile game Othellonia had a Death Note collaboration event. September 5th, 2017 - VIZ Media released the Death Not'''
