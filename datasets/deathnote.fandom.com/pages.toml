full_description = '''Recent Blog Posts Blog posts 143 posts <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Mikami Teru • 6 May 2024 0 Adding audio drama info into the wiki Hello everyone, I just wanted to let you all know I plan to slowly integrate the information from translations of the German audio drama into the articles (for instance, adding character changes or interesting trivia/differences into the character articles); many thanks to Luna (who goes by "Mikami" on Tumblr) for providing partial translations of the scripts and summaries of each chapter. This will be an ongoing/on-and-off endeavor since I do work full-time and have adulting responsibilities. Of course, if any of you all want to help, the translations and summaries can be found in the following link: https://mikami.tumblr.com/tagged/audio%20drama%20translations/chrono Please reach out to me if you have any questions. Thanks! Read Full Post Mikami Teru • 15 March 2024 1 Sharing scans from the anime guidebook Hello everyone. I want to ask if it would be possible for me to share the scans from the Death Note anime guide book volume 14. I wanted to ask first since I wasn't sure if sharing the scans say via Google Drive would be against Wikia terms of service. The book is essentially out of print and the scans are lower quality so it would be for fair use purposes such as improving or adding to certain articles on this Wikia here. I've also made some translations on some of the passages and pages here and there, but my Japanese isn't the greatest and I still have to use Google Translate. It would be nice to get some translation help from other contributors. Please let me know what you all think. Read Full Post Mikami Teru • 6 February 2024 1 Character relationship sections - keep or delete? I noticed a few character pages, namely "drama" versions of the main cast such as Light, L, and Misa, have character relationship sections. I know the main canon pages don't have them. Should we keep these sections or follow suit with the other wiki profiles and remove them? Or should we go the other direction and add relationship sections to all the important characters? Read Full Post Crimsoir • 5 March 2022 0 So lets talk about Wammy's house. So, Wammy's House, we know what it does; it is a place where L and other characters (Near, Mello, Matt, Linda, BB, A) came from. However i do want to discuss about what happened behind the walls. Wammy's House was created by Watari, for talented gifted children. At first the goal is to just to raise talented children, however soon L came in. After seeing lots of great achievements from L, Watari decided to make the project for the successor of L, in the orphanage. And here's the question: Do any of you think this is a bit too much? Putting children under pressure to make a successor of the prototype(L)? Examples of how this goes wrong is A and B. A and B was the first generation of successors, and A committed suicide due to the pressure and … Read Full Post STaG D.a.u. • 17 February 2022 1 Why Light Yagami is not Pure Evil First of all, I am aware of the Slippery slope he went down as a delusional & insane serial killer, but he did have some hidden mitigating factors/moral agency issues from what I could tell. Though some people may not have noticed them, I did. Without further ado let’s dive in. Though the scene where he hugged Misa was an act of manipulation, It might have implied that he felt some unconditional/reluctant love for her and/or proved that she was extra special to him. His fight against L was but a childish game. You can even relate both the Light hugging Misa scene & Takada’s death to when Light was calling for Misa and Takada, which was actually quite the heartbreaker, and also he seemed to regret/feel remorse for letting them outlive thei… Read Full Post ReverieCode • 27 May 2021 0 New Fandom event - The Downstream Hey everyone! This Friday, May 28th, Fandom Staff will be hosting the very first event of a series called The Downstream. This is a Twitch stream that will give updates on FandomDesktop, the Fandom brand, and Fanatical, along with conversations with various company teams. Check this blog post for the details if you want to join us. Hope we'll see you there! :) Read Full Post ReverieCode • 12 March 2021 1 Bug squashing efforts from Fandom Hello! My name is ReverieCode and I’m a Wiki Representative from Fandom. I wanted to draw your attention to a 2 week quality of life bug fixing project we’re undertaking at Fandom as we work through a ton of great feedback we got about the new unified experience we unveiled at Community Connect last weekend. This work will focus on bugs which haven’t risen to critical fix levels while the engineering teams have been heads down on the unified experience work, like features not quite working the way they’re intended or the way they used to on the legacy platform. You can read more about it in this blog, but what I’m specifically reaching out about is seeing if you have any particular bugs on the wiki that are really annoying, but not site break… Read Full Post PuffballisAwesome • 12 January 2021 0 BFB Death Note Read Full Post KylaraE • 20 October 2017 0 Improving Wikia Videos As you might already know, Wikia Staff has added videos at the top of the following pages on the Death Note Wiki: Light Yagami - Script has been edited by the community and sent for updating. Misa Amane L (character) Ryuk Rules of the Death Note These videos were not created by Death Note Wiki contributors and we had little say regarding their content or implementation. They were created by Wikia Staff. We have now been given the opportunity to update and improve them, starting with Light's video. For any members of the Death Note Wiki community or Death Note fandom, I encourage you to offer suggested improvements so that these videos are accurate and clear. The scipts we have to improve are here: Light Yagami - Done. Others pending. I would like to g… Read Full Post Sannse • 12 September 2017 0 Seeking Volunteer Curators Hey Death Note Wiki community! I'm sure you're aware of FANDOM's editorial site, Fandom.com and our coverage of gaming and entertainment news. One of the features of the site is that we curate news from other sites with the intention of providing a full picture of what's happening in the world of gaming and entertainment. To that end, we're creating a new volunteer group at FANDOM called "Volunteer Curators". What we're looking for are subject matter experts that have deep knowledge of news and features about their favorite game, movie or TV show. If you spend a bunch of time on the anime subreddit or follow anime news obsessively, we want to talk to you! We're looking for people like you to help us round out our anime coverage - everything f… Read Full Post KylaraE • 5 June 2017 3 New layout The new layout is live! I think I got all the main code that needs to be updated for readability, and I'll keep making tweaks to the rest. If you spot anything that could use an improvement, drop me a note! Stuff still to do: Main page header images. For now, I put in a quick fix to invert the images, which is why they appear white. I'll look into updating them though. Main page sub-header styles. Chat fixes. The chat room's night/day view options are now both black, so that's useless. Will need to get around to implementing display options. Tabber tabs look kinda funny. Manga navigation box image. The death note image is hard to see, maybe find a new image. Site needs like 100% more silhouettes of Ryuk flying. ???? Read Full Post Lord Murgon • 19 May 2017 0 Death Note Textures In really liked the textures the Death Notes have in Light up the NEW world. They are adding more Fantasy to it. Read Full Post The Kira Justice • 13 November 2016 3 New Season of Death Note Coming Soon. After So Many Years...Season 2 of Death Note co