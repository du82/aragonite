title = "Debian -- Security Information"
full_description = "Security Information Keeping your Debian System secure Recent Advisories Sources of Security Information Debian takes security very seriously. We handle all security problems brought to our attention and ensure that they are corrected within a reasonable timeframe. Experience has shown that security through obscurity never works. Therefore, public disclosure allows for quicker and better solutions of security problems. In that respect, this page addresses Debian's status regarding various known security holes, which could potentially affect the Debian operating system. The Debian project coordinates many security advisories with other free software vendors, and as a result, these advisories are published the same day a vulnerability is made public. In order to receive the latest Debian security advisories, please subscribe to the debian-security-announce mailing list. Debian also participates in security standardization efforts: The Debian Security Advisories are CVE-Compatible Debian publishes its security information using the Open Vulnerability Assessment Language (OVAL) Keeping your Debian System secure The packages unattended-upgrades can be installed to keep the computer current with the latest security (and other) updates automatically. The wiki entry has more detailed information how to manually set up unattended-upgrades. For more information about security issues in Debian, please refer to our FAQ and our documentation: Security FAQ Securing Debian Recent Advisories RSS These are the recent Debian Security Advisories (DSA) posted to the debian-security-announce list. T is the link to the Debian Security Tracker information, the DSA number links to the announcement mail. [14 Feb 2025] T DSA-5866-1 chromium security update [12 Feb 2025] T DSA-5865-1 webkit2gtk security update [12 Feb 2025] T DSA-5864-1 pam-pkcs11 security update [10 Feb 2025] T DSA-5863-1 libtasn1-6 security update [10 Feb 2025] T DSA-5862-1 cacti security update [07 Feb 