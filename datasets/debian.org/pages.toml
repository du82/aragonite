["https://debian.org/intro/philosophy"]
title = "Debian -- Our Philosophy: Why we do it and how we do it"
full_description = '''Our Philosophy: Why we do it and how we do it Our Mission: Creating a Free Operating System Our Values: How the Debian Community works Our Mission: Creating a Free Operating System The Debian Project is an association of individuals, sharing a common goal: We want to create a free operating system, freely available for everyone. Now, when we use the word "free", we're not talking about money, instead, we are referring to software freedom. Our Definition of Free Software Read the Free Software Foundation's statement Maybe you're wondering why so many people choose to spend lots of hours of their own time writing software, carefully packaging and maintaining it, just to give it all away without charging for it? Well, there are plenty of reasons, here are some of them: Some people simply like to help others, and contributing to a free software project is a great way to accomplish this. Many developers write programs to learn more about computers, different architectures, and programming languages. Some developers contribute to say "thank you" for all the great free software they've received from others. Many people in academia create free software to share the results of their research. Companies also help maintaining free software: to influence how applications develop or to implement new features quickly. Of course, most Debian developers participate, because they think it's great fun! Although we believe in free software, we respect that people sometimes have to install non-free software on their machines – whether they want to or not. We have decided to support these users, whenever possible. There is a growing number of packages which install non-free software on a Debian system. We are committed to Free Software and we have formalized that commitment in a document: our Social Contract Our Values: How the Community works The Debian project has more than thousand active developers and contributors spread around the world. A project of this size needs a carefully organized structure. So, if you wonder how the Debian project works and whether the Debian community has rules and guidelines, have a look at the following statements: The Debian Constitution: This document describes the organizational structure and explains how the Debian project makes formal decisions. The Social Contract and the Free Software Guidelines: The Debian Social Contract and the Debian Free Software Guidelines (DFSG) as a part of this contract describe our commitment to free software and the free software community. The Diversity Statement: The Debian Project welcomes and encourages everyone to participate, no matter how you identify yourself or how others perceive you. The Code of Conduct: We have adopted a code of conduct for participants of our mailing lists, IRC channels, etc. The Developer's Reference: This document provides an overview of the recommended procedures and the available resources for Debian developers and maintainers. The Debian Policy: A manual describing the policy requirements for the Debian distribution, e.g. the Debian archive's structure and contents, technical requirements which every package must satisfy to be included, etc. Inside Debian: Developers' Corner'''
year_published = 2025
