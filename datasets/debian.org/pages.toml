full_description = "RSS Latest News [17 Jan 2025] The Debian Project mourns the loss of Steve Langasek (vorlon) [11 Jan 2025] Updated Debian 12: 12.9 released [19 Nov 2024] The Debian Project mourns the loss of Jérémy Bobbio (Lunar) [09 Nov 2024] Updated Debian 12: 12.8 released [31 Aug 2024] Updated Debian 12: 12.7 released [31 Aug 2024] Updated Debian 11: 11.11 released [14 Aug 2024] Security support for Bullseye handed over to the LTS team [11 Aug 2024] DebConf24 closes in Busan and DebConf25 dates announced [25 Jul 2024] The Debian Project mourns the loss of Peter De Schrijver [29 Jun 2024] Updated Debian 12: 12.6 released [29 Jun 2024] Updated Debian 11: 11.10 released [15 Jun 2024] Debian 10 Long Term Support reaching end-of-life [06 Jun 2024] Statement on Daniel Pocock [10 Feb 2024] Updated Debian 12: 12.5 released [10 Feb 2024] Updated Debian 11: 11.9 released You can get the latest Debian news by subscribing to or browsing the archives for our debian-announce and debian-news mailing lists. Those seeking information about current events and development progress in the Debian community may be interested in the Debian Project News, the official Debian blog Bits from Debian, or the Debian micronews. We're also tracking Debian's press coverage. Debian, the distribution and the web site, has won awards, you can find out which ones on the awards page. The press team of the Debian project can best be reached via mail to press@debian.org. Requests for interviews will be routed to the proper person within the Debian project. Please note that due to language barriers and timezone differences using mail is preferred over phone calls."
