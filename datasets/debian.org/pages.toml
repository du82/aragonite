["https://debian.org/News/2024/20240814"]
title = "Debian -- News -- Security support for Bullseye handed over to the LTS team"
full_description = "Security support for Bullseye handed over to the LTS team August 14th, 2024 As of 14 August 2024, three years after the initial release, the regular security support for Debian 11, alias Bullseye, comes to an end. The Debian Long Term Support (LTS) Team will take over security support from the Security and the Release Teams. Information for users Bullseye LTS will be supported from 15 August 2024 to 31 August 2026. Whenever possible, users are encouraged to upgrade their machines to Debian 12, alias Bookworm, the current Debian stable release. To make the life cycle of Debian releases easier to remember, the related Debian teams have agreed on the following schedule: three years of regular support plus two years of Long Term Support. Debian 12 will receive thus regular support until 10 June 2026 and Long Term Support until 30 June 2028, three and five years after the initial release, respectively. Users that need to stick with Debian 11 can find relevant information about Debian Long Term Support at LTS/Using. Important information and changes regarding Bullseye LTS specifically can be found at LTS/Bullseye. Debian 11 LTS users are invited to subscribe to the announcement mailing list for receiving notifications about security updates, or to follow the latest advisories through the LTS Security Information webpage. A few packages are not covered by the Bullseye LTS support. Non-supported packages installed in the users machines can be identified by installing the debian-security-support package. If debian-security-support detects an unsupported package which is critical to you, please get in touch with debian-lts@lists.debian.org. Debian and its LTS Team would like to thank all contributing users, developers, sponsors and other Debian teams who are making it possible to extend the life of previous stable releases, and who have made Buster LTS a success. If you rely on Debian LTS, please consider joining the team, providing patches, testing or funding the efforts. About Debian The Debian Project was founded in 1993 by Ian Murdock to be a truly free community project. Since then the project has grown to be one of the largest and most influential open source projects. Thousands of volunteers from all over the world work together to create and maintain Debian software. Available in 70 languages, and supporting a huge range of computer types, Debian calls itself the universal operating system. Contact Information For further information, please visit the Debian web pages at https://www.debian.org/ or send mail to <press@debian.org>."
