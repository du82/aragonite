title = "Download Debian"
full_description = '''Download Debian This page has options for downloading and installing Debian 12.9.0, the stable release. Download mirrors of installation images Installation Manual with detailed installation instructions Release notes ISO images for Debian testing Verifying authenticity of Debian images Download an installation image A small installation image: can be downloaded quickly and should be recorded onto a removable disk. To use this, you will need a machine with an Internet connection. 64-bit PC netinst iso 32-bit PC netinst iso 64-bit PC netinst torrents 32-bit PC netinst torrents A larger complete installation image: contains more packages, making it easier to install machines without an Internet connection. 64-bit PC DVD-1 iso 32-bit PC DVD-1 iso 64-bit PC torrents (DVD) 32-bit PC torrents (DVD) Try Debian live before installing You can try Debian by booting a live system from a CD, DVD or USB key without installing any files to the computer. You can also run the included Calamares Installer. Only available for 64-bit PC. Read more information about this method. Live Gnome Live Xfce Live KDE Other live ISO live torrents Buy CDs, DVDs or USB sticks from a vendor of Debian installation media Many of the vendors sell the distribution for less than US$5 plus shipping (but not always internationally). Here are the basic advantages of CDs: You can install on machines without an Internet connection. You can install Debian without downloading all packages yourself. Buy a computer with Debian pre-installed There are a number of advantages to this: You don't have to install Debian. The installation is pre-configured to match the hardware. The vendor may provide technical support. Use a Debian cloud image An official cloud image, built by the cloud team, can be used on: your OpenStack provider, in qcow2 or raw formats. 64-bit AMD/Intel (qcow2, raw) 64-bit ARM (qcow2, raw) 64-bit Little Endian PowerPC (qcow2, raw) a local QEMU virtual machine, in qcow2 or raw formats. 64-bit AMD/Intel (qcow2, raw) 64-bit ARM (qcow2, raw) 64-bit Little Endian PowerPC (qcow2, raw) Amazon EC2, either as a machine image or via the AWS Marketplace. Amazon Machine Images AWS Marketplace Microsoft Azure, on the Azure Marketplace. Debian 12 ("Bookworm") Debian 11 ("Bullseye")'''
