["https://debian.org/News/2024/20241119"]
title = "Debian -- News -- The Debian Project mourns the loss of Jérémy Bobbio (Lunar)"
full_description = '''The Debian Project mourns the loss of Jérémy Bobbio (Lunar) November 19th, 2024 The Debian Project sadly shares the news of the passing of Jérémy Bobbio (Lunar) on Friday, November 8, 2024. Lunar was well recognized and respected in several areas of the Linux and Free/Libre Open Source Software (FLOSS) communities; he was equally well known as a staunch proponent of individual and collective freedoms. Lunar was dedicated to and always present in the formulation and discussion of Reproducible Builds. For many people their introduction to this system of checks and balances in software came directly from his mouth at numerous conferences, talks, and mailing lists. Lunar was also a valiant proponent of and an outspoken ambassador over concerns of surveillance and censorship and privacy protection, prompting him to work in and develop relationships and software inside of the Tor Project. Lunar was instrumental in helping the network develop tools, establish relays, and address legal concerns for operators and administrators. Lunar's passing leaves a hole in many communities. We will carry on, we will all continue to expand in the areas that were important to him, and we will continue that work in his legacy. Lunar you will be missed! Tributes and remembrances were expressed around the world at the news of Lunar's passing; here we share some of those reflections: His work on Reproducible Builds, alongside some other folks on this list, was transformational for Debian and, dare I say, ahead of its time for an industry that is slowly discovering the immense threat that supply chain attacks present (most recently with XZ). — Faidon Liambotis I always watched and paid attention to his level of detail on what others would have considered trivial, but through understanding and explanation from him those minor details transformed into a critical understanding. A true mentor. — Donald Norwood Lunar was an incredible person, and I miss them deeply, despite getting to see them only every now and then. Creative, thoughtful, smart, and kind but not indiscriminately so. Prickly when prickliness was called for, but also willing to extend a hand or grace as needed. I'll miss their sharp wit, incisive observations, and provocations to be a better person. The people who work on free software and adjacent projects form a better community for having had Lunar among us. I continue to try to live up to the standards Lunar set. — dkg I basically remember one of the last conversations I had with Lunar, a few months ago, when he told me how proud he was not only of having started Nos Oignons and contributed to the ignition of Reproducible Builds, but specifically about the fact that both initiatives were now thriving without being dependent on him. He was likely thinking about a future world without him, but also realizing how impactful his activism had been on the past and present world. — Stefano Zacchiroli I remember quite some moments but funnily the moment I most often think about is meeting him on campus in Portland at DebConf14 when he just came back from buying a big box of vegan donuts to share. He was so happy about that! On a more serious note I do think his impact on Tor, Debian & Reproducible Builds can hardly be overestimated and then there's a wide area of "offline stuff" he also deeply cared about, and yet he always stayed humble and helpful. I'm incredible thankful for all his work and having been able to share some work and good times together. — Holger Levsen About Debian The Debian Project is an association of Free Software developers who volunteer their time and effort in order to produce a completely free operating system known as Debian. Contact Information For further information, please visit the Debian web pages at https://www.debian.org/ or send mail to <press@debian.org>.'''
