bsite wird erst durch externe Dienste er­möglicht. Die schöne Schrift etwa kommt von Typekit, einem Dienst der Firma Adobe, Videos kommen von YouTube oder Vimeo, weitere Inhalte von Twitter, Facebook, Instagram, Google, Spotify, Soundcloud oder zig weiteren Diensten, die das Web so bunt machen. Durch die Ein­bindung externer Dienste werden Daten an deren Server über­mittelt — in die USA unter dem Mantel des sog. »Privacy Shield« und damit unter Ein­haltung euro­päischer Daten­schutz­bestimmungen —, und manchmal sogar Cookies gesetzt. Wir haben keinen Ein­fluss auf die Cookies, um welche Daten es sich handelt und was mit ihnen geschieht. Es gelten die Daten­schutz­bestim­mungen der je­weiligen Anbieter. (Pro-Tipp: Wenn Sie einen Account bei einem der zuvor genannten Anbieter haben und dort eingeloggt sind, kann der Anbieter unter Umständen Ihr Surf­verhalten inter­pretieren. Dies verhindern Sie, indem Sie sich vorher ausloggen.) Ihre Betroffenen­rechte Sie haben das Recht auf Auskunft über Sie betreffende Daten, die wir erfasst haben. Sie haben das Recht, eine Berichtigung, Ein­schränkung der Ver­arbeitung oder Löschung dieser Daten zu verlangen. Sie können Wider­spruch gegen die Ver­arbeitung der Daten einlegen oder eine Über­mittlung an andere Verant­wortliche fordern. Außerdem haben Sie das Recht, eine Beschwerde bei der zuständigen Aufsichts­behörde einzu­reichen. Änderung unserer Daten­schutz­bestimmungen Wir behalten uns vor, das hier anzupassen. Für Ihren erneuten Besuch gilt dann das, was dann hier steht. 🍀"
