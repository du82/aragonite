full_description = '''Share this:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window) Flipboard Click to share on WhatsApp (Opens in new window)Click to email a link to a friend (Opens in new window)Click to copy URL ‘Dog Man’ Comes to Digital, But When Will the ‘Dog Man’ Movie Be Streaming on Peacock? By Anna Menta Published Feb. 19, 2025, 11:05 a.m. ET Where to Stream: Dog Man (2025) {"content_type":"movie","id":"7170aeb3-20b6-4302-ae84-f169c198604c","id_type":"rg","settings":{"appearance":{"general":{"drop_shadow_visible":false,"style":"minimal","widget_padding":false},"header":{"break_title":true,"stream_color":"#e80100","capitalized":true},"sub_text":{"text_visible":false},"services":{"view_all":{"color":"#e80100","text":"MORE OPTIONS","font_size":10,"bold":true},"width":65},"powered_by":{"vertical":"bottom","hidden":true}},"behavior":{"services":{"group_services":false,"max_visible_services":0,"service_platforms_prioritization":[1,344,2,91,128,7,5,366]}}}} Powered by Reelgood More On: Pete Davidson Is the ‘Riff Raff’ Movie Streaming on Netflix or Amazon Prime Video? Pete Davidson Tells Drew Barrymore He Was Initially “Nervous” For His Mom To Start Dating: “I Didn’t Want Someone To Bang My Mom” Is the ‘Dog Man’ Movie Streaming on Netflix or Disney+? Kenan Thompson Says ‘SNL’ Stars Have To Pay Their “Dues” After Pete Davidson Revealed His Paltry Starting Salary Parents, I have good news and bad news. The good news is that the Dog Man movie is now available to buy and rent at home. The bad news is that it will cost you at least $19.99 to watch this animated kids’ movie at home. Yes, that’s right: Just two-and-a-half weeks after Dog Man opened in theaters, the movie is now available to buy and rent on “premium” video on demand. Written and directed by Peter Hastings, the Dog Man movie is based on the children’s graphic novel series of the same name, created by Dav Pilkey. It’s also, technically, a spin-off of the 2017 Captain Underpants movie, aka Captain Underpants: The First Epic Movie, which is also based on a children’s series by Pilkey. At least this dog wears pants! Hastings himself stars as the voice of Dog Man, with additional voices provided by Pete Davidson, Lil Rel Howery, Isla Fisher, Poppy Liu, Stephen Root, Billy Boyd and Ricky Gervais. The movie proved to be just as, if not more, successful than the book series. The Dog Man movie has earned over $88 million at the worldwide box office, making it one of the top-earning movies of 2025 so far. But the majority of Universal titles in the last few years have been pushed to “premium” video-on-demand after just over two weeks in theaters, and Dog Man is no exception. If you’re not willing to pay the premium VOD price, you should know that we expect Dog Man to stream on Peacock, the Universal-owned streamer, and Netflix in the near future. Here’s what you should know about how to watch Dog Man online, and when to expect to see Dog Man streaming on Peacock and Netflix. Where to stream the Dog Man movie online: Beginning on Tuesday, February 18, Dog Man became available to buy and rent digitally on Amazon Prime, Apple TV, Fandango At Home, and more. The price may vary depending on which platform you use to purchase the film, but on Amazon Prime, the film costs $24.99 to buy a digital copy, and costs $19.99 to rent. If you rent the film, you’ll have 48 hours to watch the movie after hitting “play.” Dog Man is not yet available to watch on a streaming service that’s subscription-based, but we do expect to see Dog Man streaming on Peacock soon. Photo: ©DreamWorks/Courtesy Everett Collection When will the Dog Man movie be streaming on Peacock? The Dog Man movie streaming release date on Peacock has not yet been announced, but we know that The Wild Robot will stream on Peacock in the not-too-distant future, because it is a Universal movie, and Peacock is the streaming service owned by NBCUniversal. All the new Universal theatrical movies end up streaming on Peacock, though the wait period has varied by title. Another Universal animated release, The Wild Robot, was also pushed to PVOD after two-and-a-half weeks in theaters, and began streaming on Peacock about 4 months after opening in theaters. If Dog Man follows a similar release strategy, then you may see Dog Man streaming on Peacock in late May 2025. When is the Dog Man movie streaming release date on Netflix? The Dog Man movie streaming release date on Netflix has not yet been announced, but it will likely stream on Netflix after four months after it streams on Peacock, as part of Universal’s deal with Netflix that sends Universal animated movies to Netflix for a limited period. If our prediction for the Peacock release of Dog Man is correct, then you might see Dog Man streaming on Netflix around late September 2025. This is all speculation. The Universal home releases have not been consistent. If you want to watch the Dog Man movie right away, you can buy or rent the film online. Tags Dog Man (2025) Peacock Pete Davidson // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=44781'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })();'''
