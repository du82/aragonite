full_description = '''Share this:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window) Flipboard Click to share on WhatsApp (Opens in new window)Click to email a link to a friend (Opens in new window)Click to copy URL ‘Flight Risk’ Comes to Digital, But When Will Mark Wahlberg’s ‘Flight Risk’ Movie Be Streaming? By Anna Menta Published Feb. 13, 2025, 4:00 p.m. ET Where to Stream: Flight Risk (2025) {"content_type":"movie","id":"2315233c-8337-4703-ad4b-ccd49bcd8f9b","id_type":"rg","settings":{"appearance":{"general":{"drop_shadow_visible":false,"style":"minimal","widget_padding":false},"header":{"break_title":true,"stream_color":"#e80100","capitalized":true},"sub_text":{"text_visible":false},"services":{"view_all":{"color":"#e80100","text":"MORE OPTIONS","font_size":10,"bold":true},"width":65},"powered_by":{"vertical":"bottom","hidden":true}},"behavior":{"services":{"group_services":false,"max_visible_services":0,"service_platforms_prioritization":[1,344,2,91,128,7,5,366]}}}} Powered by Reelgood More On: Mark Wahlberg The Top 10 Movies on Netflix That Are Most Popular Right Now From ‘Sound Of Freedom’ To ‘Brave The Dark’: Angel Studios Has A Plan For Bringing Faith-Based Adult Dramas To A Theater Near You Is Mark Wahlberg’s ‘Flight Risk’ Movie Streaming on Netflix or Amazon Prime? Stream It Or Skip It: ‘Arthur the King’ on Starz, a Sports Drama That Stages an Epic Scruff-Off Between Mark Wahlberg and a Very Cute Dog The new Mark Wahlberg movie Flight Risk is coming to digital tomorrow, just in time for Valentine’s Day. Because nothing says romance like Wahlberg in a bald cap! Also starring Topher Grace and Michelle Dockery, Flight Risk tells the story of a sketchy private plane pilot (Wahlberg) who transports a Debuty U.S. Marshal and a government witness in a mafia trial to a secure location. When the passengers learn the pilot is actually there to take out the witness, they must fight to survive while flying high. Flight Risk was directed by Mel Gibson, with a screenplay written by Jared Rosenberg. Gibson was dropped by his talent agency in 2010 after audio leaked of him screaming obscenities at his then-girlfriend, who also accused him of domestic violence. He’s made multiple, documented anti-Semitic, racist, and homophobic comments. Though many Hollywood figures cut ties with Gibson since that audio leak in 2010, he has directed two films, and produced and acted in many more films. That comeback now continues with Flight Risk. Read on for some information about where to watch the Flight Risk movie online and when we expect to see Flight Risk streaming on Starz. Flight Risk movie digital release date: The Flight Risk movie will be released on digital, on premium video-on-demand, on Friday, February 14 at 12 a.m. Eastern Time (which is also Thursday, February 13 at 9 p.m. Pacific Time). You’ll be able to buy or rent the film on digital platforms like Amazon Prime, Apple TV, Vudu, and more. The film will cost $24.99 to buy a digital copy, or $19.99 to rent. If you rent the film, you will have 48 hours to watch it after hitting play. The digital release will also come with a “making of” special feature titled “Risk Management: Making Flight Risk.” Flight Risk is not yet streaming on a subscription streaming service, but we do expect to see Flight Risk streaming on Starz eventually. When will the Mark Wahlberg movie Flight Risk be on streaming on Starz? There is not yet a Flight Risk movie streaming release date. Even though you will be able to buy or rent the Flight Risk movie online tomorrow, you won’t be able to stream it on a subscription-based streaming platform just yet. That said, you can expect to see Flight Risk on Starz eventually because that is the streaming platform owned by Lionsgate. Another Lionsgate film, Borderlands, was released on premium video-on-demand after three weeks in theaters, and began streaming on Starz on December 25, about four and a half months after the movie opened in the theaters. If Flight Risk follows the same release pattern (which it has, so far), you might see Flight Risk on Starz in about four and a half months, which would be around late May or early June 2025. But this is all speculation. If you want to watch Flight Risk right away, you can always buy or rent the film on digital. Tags Flight Risk (2025) Mark Wahlberg Starz // set a default widget id var ob_id = "AR_3"; // Select the proper template to use if ( nypost_screen === 'mobile' ) { ob_id = "MB_2"; } OB_elements = ( typeof( OB_elements ) !== 'undefined' ) ? OB_elements : []; var OB_element = {}; // Editable section OB_element.containerId = "outbrainContainer0"; OB_element.widgetId = ob_id; OB_elements.push( OB_element ); (function() { var zergnet = document.createElement('script'); zergnet.type = 'text/javascript'; zergnet.async = true; zergnet.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//www.zergnet.com/zerg.js?id=44781'; var znscr = document.getElementsByTagName('script')[0]; znscr.parentNode.insertBefore(zergnet, znscr); })();'''
