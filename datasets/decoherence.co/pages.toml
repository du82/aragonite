full_description = 'This privacy policy (the “Policy”) applies to Decoherence, Co., the Decohere.ai website, and the Decohere media generation platform (the “Services”). Decohere is a video creation tool that provides media generation services to power the next wave of computationally-enabled human creativity. As used in this Policy, “personal data” means any information that relates to, describes, could be used to identify an individual, directly or indirectly. This Policy applies to personal data that Decohere collects, uses, and discloses and which may include: (i) data collected through the Services, (ii) data collected through the process of training Decohere machine learning algorithms, (iii) data collected through Decohere websites, and (iv) data collected from third party sources. Third party sources may include, but are not limited to: public databases, commercial data sources, and the public internet. When you make purchases, we use third-party payment processors to collect credit card or other financial information. Decohere does not store the credit card or payment information you provide, only confirmation that payment was made. This Policy does not apply to the following information: Personal Data about Decohere employees and candidates, and certain contractors and agents acting in similar roles. We may update this Policy from time-to-time to reflect changes in legal, regulatory, operational requirements, our practices, and other factors. Please check this Policy periodically for updates. If any of the changes are unacceptable to you, you should cease interacting with us. When required under applicable law, we will notify you of any changes to this Policy. Through this Policy, You, or Your means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable. Company (referred to as either "the Company", "We", "Us" or "Our" in this Agreement) refers to Decoherence, Co.. Usage Data refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).'
