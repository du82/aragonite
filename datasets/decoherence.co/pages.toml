title = "Decohere | Pricing"
description = "Decohere is always free to use. However, if you want to unlock premium features, you can upgrade to one of the paid plans."
full_description = '''Yes! Decohere AI is always free to use. Every day you can generate realtime images for free, up to a limit. However, if you'd like to use more advanced features like image upscaling and video generation, you'll need to upgrade to a paid plan. If you run out of credits for your billing period, you can either upgrade to a higher plan or you can purchase refill credits. You can click the "Buy refill credits" button on the Pricing page to directly purchase credits. You must have an active plan to purchase and to use refill credits. No, your unused monthly/annual credits do not rollover. If you don't use your credits, they will expire at the end of your billing period. At the start of your next billing period, your credits will be replenished to the amount specified by your plan. Refill credits purchased never expire. They require an active plan to use. Refill credits are only used when your account runs out of monthly/annual credits. Upgrading to a paid plan will automatically remove the watermark on any new images and videos that you generate. You can cancel your subscription at any time by clicking the "Downgrade to free" button on the pricing page. Your plan will remain active until the end of your billing period, at which point you will be downgraded to the free plan. Using the Decohere service creates a real cost for us because we have to pay for our servers. Due to the unpredictable nature of AI tools, we CANNOT offer refunds for poor output quality. We can offer a refund ONLY IF you have not used the Decohere service in ANY WAY during the current billing period. By purchasing a plan, you agree to the terms of this refund policy. We cannot offer refunds for any payments outside of the current billing period. For annual plans, refunds are not allowed after the first 30 days of the billing period. If you'd like to request a refund, please email us at support@decohere.ai. If you are on the Creator plan, you own all images and videos you generate. You can use them for any commercial purposes without attribution.'''
