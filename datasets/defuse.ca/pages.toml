full_description = "Instruction Set Filters In the summer of 2013, I worked with Dr. Michael E. Locasto on a research project to determine whether disabling CPU instructions based on the current execution context could serve as an effective exploit defense mechanism. The research is not complete (I'm trying to find time to finish it!), but you can find the slides from a presentation I gave here. The Bochs Hacking Guide is also a result of this research. In the summer of 2013, I worked with Dr. Michael E. Locasto on a research project to determine whether disabling CPU instructions based on the current execution context could serve as an effective exploit defense mechanism. The research is not complete (I'm trying to find time to finish it!), but you can find the slides from a presentation I gave here. The Bochs Hacking Guide is also a result of this research."
