title = "Disk Images for the Bochs x86 Emulator"
description = "Various operating systems installed on disk images for Bochs."
full_description = '''490 December 6, 2013 Bochs Disk Images These disk images are for use with the Bochs x86 Emulator. I am providing them to make it easier to get started with hacking Bochs. All of them were built and tested using Bochs 2.6.2 compiled with the following configure options: ./configure \ --enable-smp \ --enable-x86-64 \ --enable-all-optimizations \ --enable-long-phy-address \ --enable-configurable-msrs \ --enable-disasm \ --enable-fpu \ --enable-alignment-check \ --enable-3dnow \ --enable-svm \ --enable-vmx=2 \ --enable-avx \ --enable-a20-pin \ --enable-pci \ --enable-clgd54xx \ --enable-voodoo \ --enable-usb \ --enable-usb-ohci \ --enable-usb-xhci \ --enable-cdrom \ --enable-sb16 \ --enable-es1370 \ --enable-show-ips \ --with-all-libs Tiny Core Linux (CorePlus) 5.1 (32-bit) Tiny Core Linux is a very small Linux distribution with a recent kernel (3.8.13). It is very good for testing hardware/kernel mods. See the project's Wiki for instructions on compiling a custom kernel . Download CorePlus.img.xz (15MiB) Tiny Core Bochs Configuration # System configuration. romimage: file=$BXSHARE/BIOS-bochs-latest vgaromimage: file=$BXSHARE/VGABIOS-lgpl-latest cpu: model=corei7_ivy_bridge_3770k, ips=120000000 clock: sync=slowdown megs: 128 boot: disk # Hard disks. ata0: enabled=1, ioaddr1=0x1f0, ioaddr2=0x3f0, irq=14 ata0-master: type=disk, path="CorePlus.img", cylinders=406, heads=8, spt=63 Debian Wheezy (32-bit) This is the current stable release of the Debian Linux distribution. No windowing system is installed, since that is too much for Bochs to handle. It just boots to a shell. Download DebianWheezy.img.xz (172MiB) Default Users Username: root Password: toor Username: bochs Password: bochs Debian Wheezy Bochs Configuration # System configuration. romimage: file=$BXSHARE/BIOS-bochs-latest vgaromimage: file=$BXSHARE/VGABIOS-lgpl-latest cpu: model=corei7_ivy_bridge_3770k, ips=120000000 clock: sync=slowdown megs: 1024 boot: disk # Hard disks. ata0: enabled=1, ioaddr1=0x1f0, ioaddr2=0x3f0, irq=14 ata0-master: type=disk, path="DebianWheezy.img", cylinders=4161, heads=8, spt=63 Debian Jessie (64-bit) This is the current 64-bit "testing" release of Debian. Download DebianJessie64.img.xz (197MiB) Default Users Username: root Password: toor Username: bochs Password: bochs Debian Jessie Bochs Configuration # System configuration. romimage: file=$BXSHARE/BIOS-bochs-latest vgaromimage: file=$BXSHARE/VGABIOS-lgpl-latest cpu: model=corei7_ivy_bridge_3770k, ips=120000000 clock: sync=slowdown megs: 1024 boot: disk # Hard disks. ata0: enabled=1, ioaddr1=0x1f0, ioaddr2=0x3f0, irq=14 ata0-master: type=disk, path="DebianJessie64.img", cylinders=4161, heads=8, spt=63'''
