["https://defuse.ca/eotp.htm"]
title = "Encrypting One Time Passwords System - Defuse Security"
description = "A One Time Password protocol that can be used with encryption."
full_description = '''466 Encrypting One Time Passwords [EOTP] EOTP is a cryptographic One Time Password (OTP) protocol designed to provide a static encryption key across login sessions. This protocol is a work in progress. In its current form, I feel it is too complex to analyze and too difficult to implement. I will improve it when I have time. If you have an urgent need for an EOTP-like protocol, please contact me. What's wrong with other OTP systems like S/KEY, PPP, and OTP-over-SMS? Nothing is wrong with other OTP systems like S/KEY, Pefect Paper Passwords, OTP-over-SMS, and hardware OTP devices like the Yubikey. They are all much more secure than using a password alone, however, I believe they lack an important and useful feature: Conventional OTP schemes do not provide a static secret key that can be used for data encryption. Conventional OTP schemes can be used as a second factor of authentication, but they can't be used to encrypt data. When a user authenticates themselves to a server, the server receives a simple "authentication success" or "authentication failure" response from the OTP system. If the server needs to encrypt data on the user's behalf, it must fall back to generating an encryption key from the user's static password. So if the server gets hacked, a user's data is as secure as their password. The attacker is able to completely bypass the OTP authentication requirement and can run brute-force and dictionary attacks on the user's password. EOTP changes the model. When EOTP is implemented, user data is encrypted with the combination of the user's password and a static key provided by EOTP. Requirements for EOTP As is necessary with any cryptographic protocol, security requirements must be explicit and understood prior to discussing the protocol itself. EOTP must... Strongly authenticate the client. Be at least as secure as classic password authentication. Be immune to passive man in the middle attacks. Not be vulnerable to replay attacks. Provide an encryption key to the server that is static across sessions. Be secure even when an attacker has collected a large amount of OTPs. Work for a reasonably long time after a single setup process through a secure channel. Not be vulnerable to Denial of Service attacks. Be as secure as the combination of the password and OTP. If the password has a security factor N and OTP key has a security factor M then the static key's security factor will be N * M. How does EOTP work? Hash Functions & Notation EOTP makes heavy use of HMAC (Hash Based Message Authentication Code). Put simply, an HMAC is a keyed hash function. EOTP can be implemented using an HMAC constructed from any cryptographic hash function, but HMAC-SHA512 is recommended. In the protocol description below, you will see the following notation: H(X) - Hash X. HMAC(X, K) - HMAC X with key K. A || B - Concatenate A and B. E(K, X) - Encrypt plaintext X with key K. D(K, Y) - Decrypt ciphertext Y with key K. The Setup Exchange The following one-time setup procedure must be done through a secure channel. This can be something as simple as a user (Alice) using a trusted computer to communicate with a web server (Bob) over a TLS connection. Alice authenticates herself to Bob using the existing password-based authentication. Alice uses a RNG to generate three random numbers Ra, Rb, Rx and sends them to Bob. Bob uses a RNG to generate three random numbers Rc, Rd, Ry and sends them to Alice. Bob and Alice both compute (and save) sequence key Ks = H(Ra || Rc). Bob and Alice both compute static key Kt = H(Rb || Rd). Bob and Alice both compute (and save) salt S = H(Rx || Ry). Bob uses a RNG to generate a master key Km. Bob computes Cm = E( HMAC(Kt, <Alice's Password>), Km) then destroys Km Bob saves token T = HMAC(Kt || S, <Alice's Password> || S) and destroys Kt. Bob destroys all information related to Alice's password other than T. Bob and Alice save 128-bit counters initialized to 0. Let Ia and Ib denote Alice's and Bob's counter respectively. At this point, Bob and Alice share a secret "sequence" key Ks and salt S. They both have 128-bit counters set to 0. Alice has the "static" key Kt. Bob has Cm which is the "master" key Km encrypted with Kt, but does not have Kt. Bob also has T, the HMAC of Alice's password and Kt. Alice's random numbers Ra, Rb, and Rx may be omitted if she is unable to generate random numbers (e.g. if she is a website user). The Authentication Procedure Alice would like to authenticate herself to Bob over an insecure channel that is vulnerable to passive sniffing attacks (e.g. using a computer with a keylogger installed). Alice identifies herself to Bob. Bob responds with the current value of his 128-bit counter. Alice repeatedly computes Ks = HMAC(Ks, Ia || S) and increments Ia until Ia == Ib. Alice computes OTP = Ks XOR Kt and sends her password and OTP to Bob. Bob obtains Kt = OTP XOR Ks. Bob computes T' = HMAC(Kt || S, <Alice's Password> || S). Bob compares T' and T. If they are identical, Alice is authenticated, if not, Bob stops here. Bob computes Km by decrypting Cm with key HMAC(Kt, <Alice's Password>). Bob saves Ks = HMAC(Ks, Ib || S) and increments Ib. Bob destroys of Kt and the previous Ks. Bob uses Km to encrypt and decrypt Alice's data and destroys it when finished. Visually, AliceBob "Hi, I'm Alice" --> <Alice's Password> --> Until Ia == Ib: Ks = HMAC(Ks, Ia || S) Ia = Ia + 1 OTP = Ks XOR Kt--> <--Ib Kt = OTP XOR Ks T' = HMAC(Kt || S, <Alice's Password> || S) Auth fail if T != T' Km = D(HMAC(Kt, <Alice's Password>), Cm) Destroy Kt Ks = HMAC(Ks, Ib || S) Destroy previous Ks Ib = Ib + 1 At this point, Alice has Authenticated herself to Bob and Bob has a key Km which can be used to encrypt Alice's data. How secure is EOTP? Decrypting Alice's Data If Bob is compromised, the attacker will obtain: Cm The current Ks - HMAC(Ks, Ib || S) of the previous Ks S Ib T It is also likely that the attacker will have the latest OTP that Alice sent. Alice's data is encrypted with Km. The attacker has Cm, which is Km encrypted with HMAC(Kt, <Alice's Password>). Suppose, for the sake of argument, that the attacker knew Alice's password. Now, to obtain the key to decrypt Cm, the attacker must obtain Kt = OTP XOR Ks, the previous Ks. Bob has destroyed the previous Ks, but his current Ks is a function of the old Ks: HMAC(Ks, Ib - 1 || S). To obtain Kt from OTP, the attacker must reverse the HMAC to obtain the previous Ks. Assuming a strong HMAC function, it is not computationally feasible. The attacker has T = HMAC(Kt || S, <Alice's Password> || S). This is not helpful since, assuming a strong HMAC function and nonempty S, it is impossible to deduce HMAC(Kt, <Alice's Password>). The only other way to decrypt Cm is to guess the value of HMAC(Kt, <Alice's Password>). Assuming a strong HMAC function, doing so requires 2n+m operations, assuming it would take 2n operations to guess Alice's password and 2m operations to guess Kt. Collecting OTPs Following the protocol, the OTP is Kt XOR Ks. Ks really represents a pseudorandom stream of bits: Ks = HMAC(previous Ks , Ib || S) Assuming this process represents a cryptographically strong stream cipher, the value Ks will not repeat for a very long time, so even an attacker who is able to obtain many OTPs would not be able to obtain Kt. The size of Ks is critical to security here. For that reason, Ks should be at least 512 bits wide. Impersonating Alice - use a block cipher to encrypt the password rather than simple xor, to be safe Destroying Data EOTP vs. Keyloggers and Man-In-The-Middle - general security arguments here EOTP vs. Server Compromise EOTP vs. Passwords EOTP is intended to be used alongside password authentication. EOTP vs. Other OTP Schemes - Passwords Computed In Advance or As Needed Portable C Implementation This is the PHP Implementation Ruby Implementation Old With Facebook now supporting one time passwords, the world is finally catching on the the concept of single use passwords. The idea is simple, use a different password every time you login. Once you login with a "one time" password, it can't be used again. This is useful when you want to log in to a public computer that may have spyware installed on it. When you login, any spyware on that machine will only record your single use password, which, since it has been used, can't be used to login again. Current one time password schemes are a very good way to authenticate users. The combination of a normal password and a one time password makes that authentication even stronger. But some services want to store encrypted data on the user's behalf. To create an encryption key for this data, the server needs to get a static token each time the user logs in. From this static token, a hash algorithm can be applied to create an encryption key. In most implementations, the encryption key is created from the normal password only, or is stored in plain text on the server. Unfortunately, in current one time password systems like S/KEY and Perfect Paper Passwords, there is no way for the server to obtain a token that is static across login sessions, so these systems can't be used to create encryption keys. If the server is storing encrypted data on the user's behalf, and the user's normal password has been logged by spyware on a public machine, their data will be decryptable without requiring their next one time password. Right now, one time passwords can only stop attackers from being able to access the ciphertext remotely, in the event of server compromise, OTP systems provide no protection of the data. They can't provide any provable security in the form of encryption. It would be nice for the stronger authentication that one time passwords provide to extend to encryption as well. If such a system existed, the key used to encrypt the user's data would be created from both the one time password and the normal password. This would arguably increase the security of the encrypted data considerably. For this reason, we have created the Encrypting One Time Password (EOTP) system, who's goal is to provide the server with strong authentication as well as a static token that can be used to create the same encryption key every session. Goals Must be at least as secure as normal passwords. Must provide strong authentication to the client. Client and server must only have to communicate securely once to setup the system. Must provide proof that a password has not been used before. Must allow an attacker to collect and analyze old passwords and still be secure. Must provide the server with an encryption key that is the same across sessions. Must not be vulnerable to a DoS scenario created by an attacker trying to guess passwords. Must allow the attacker to gain physical access to the server at any time and not be able to re-create the encryption key without the client's next one time password. Passwords may be computed in advance and printed or computed as needed with a mobile device. EOTP Description Functions H(data) - Secure hash function such as SHA256 E(key, data) - A block cipher, encrypts 'data' with the key, 'key'. Such as (AES, Serpent, Twofish, etc..). D(key, data) - The reverse operation of E. Decryption. People Bob - The server Alice - The client Initial Key Setup Alice and Bob need to have a secure connection at least once to setup EOTP. Using random data from both Alice and Bob, they generate a random key, 'key'. Using random data from both Alice and Bob, they generate a random initialization vector and each save a copy, 'IVa' and 'IVb'. Bob saves H(key) and IVb. Alice saves key and IVa. Alice sets a counter (CTRa) to 0 Bob sets a counter (CTRb) to 0 Both key and the IVs (IVa, IVb) have to be kept a secret. 'key' is the static key Bob will receive from Alice every session. It gets used for authentication and derivation of the application's encryption key. The IVs are going to used as a second key to encrypt 'key' as it is sent from Alice to Bob. These IVs are going to change every time Alice and Bob authenticate, which is how the same key will be sent from Alice to Bob, but will appear different (in transit) each time. Authenticating a Session Once EOTP has been setup, Alice can now authenticate to Bob. The key setup is simple. Alice ends up with the key and an IV. Bob ends up with a hash of the key and the same IV. Now, both Alice and Bob share a common secret, the IV. The goal of the authentication steps are to: Pass the key that only Alice has, to Bob. This is done by encrypting the key with the IV. The result of this encryption is the one time password. Change (increment) both Alice's and Bob's IV to create a different shared secret. That way, the next time they authenticate, the result of the encryption in the above point (the one time password) is different the next time they authenticate. Alice is sending the same key to Bob every time, the uniqueness of the password comes from encrypting it with a different key every time it is sent. Cryptographically, this is how it's done: Implementation: Alice computes P = E(IVa,key) [encrypts key with IVa]. Alice saves IVa = H(IVa), replacing her old IVa. Alice increments CTRa Alice sends P and CTRa to Bob. P is the One time password. Bob checks CTRa against his own counter, CTRb. Bob creates a temporary CTRb and IVb and repeates steps 9 and 10 until CTRa = CTRb. He should NOT yet replace the old IVb and CTRb with the new values. Bob computes key = D(IVb,P) [decrypts P with IVb] Bob validates that H(key) is equal to the hash he saved in the initial key setup. If they are not equal, Alice is an imposter. He must then STOP what he is doing and reject the attempt. If the hash is valid, Bob can now replace his CTRb and IVb with the new values (from step 5). Bob destroys all traces of IVb from non-volatile memory, so the only copy is in RAM. Bob saves IVb = H(IVb) Bob increments CTRb Bob creates an encryption key for applications to use: H(key+salt) where salt is some random data that is unique to Alice. Bob removes all traces of key from memory Note: This requires that both Bob and Alice are synchronized in the number of times their IV has been incremented. In the case of a power outage, error, etc.. they may become out of sync. To solve this, they each have a counter. If they become out of sync, Alice sends repeates step 2 and 3 until her counter is ahead of Bob's. Bob will then follow step 5 to finish the syncronization. If the passwords were computed in advance, this would be as easy as skipping to the next password in the sequence. Analysis To verify the security of EOTP, we will check if our goals have be satisfied. If all of our goals can be satisifed, we can be sure that EOTP is at least as secure as normal passwords and other OTP systems. We can also be sure that EOTP is infact useful to protect the user's data in the case of the server being compromised. Man In The Middle Attacks Like normal passwords and other OTP systems, EOTP is vulnerable to MITM attacks. If t'''
