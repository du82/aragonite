["https://defuse.ca/honestyware.htm"]
title = "Honestyware - The right way to sell software."
description = "Honestyware is a revolutionary way to sell software that embraces piracy."
full_description = '''563 Honestyware Honestyware in a Nutshell Honestyware is a philosophy for selling software (and other digital content) that lets the consumer decide whether the software is worth paying for, and how much the software is worth. It is based on the assumption—and my strong belief—that people will pay for things that are worth paying for. Software sold as honestyware can be downloaded free of charge, but if the user likes the software they must pay for it. If the user doesn't like the software, they must delete it from their system as a courtesy to the software developers. These rules are not enforced, so it's up to the user to be honest and obey them—that's why it's called honestyware. Because the rules are not enforced, software sold as honestyware is never encumbered by bloated DRM technologies or trial limitations. I truly believe that people will follow the rules and pay for good software even if they can get it for free. Sharing honestyware is legal, and even recommended. The money honestyware loses to dishonest users is quickly reclaimed by social sharing. People are more likely to share content that is accessible for free than content behind a pay wall. Besides, nearly all proprietary software is available for free on software piracy websites. If a dishonest user wants to get some piece of software for free, they will. Honestyware cuts out the middle step and embraces piracy as a form of advertising. Formal Definition of Honestyware Honestyware is any computer software that meets all of the following criteria: The full, unlimited, and official version of the software can be downloaded without charge or effort. For example, making the user register an account on a website to download the software is not acceptable, but displaying extra ads on the download page is OK. Users must not be charged any type of fee (e.g. monthly subscription) to use the software. The user may distribute copies of the software without charge or penalty; even if the user has not paid for the software. The software may present an unobtrusive message to the user informing them that the software is honestyware and must be paid for only if it does not interfere with the software's functionality in any way. Users must be able to purchase the software for any price they feel the software is worth. The software vendor must not set a minimum nor a maximum price, but can list a suggested price. The software does not use DRM technologies to limit its use, enforce "Activation" or "Registration" requirements, or attempt to "lock" itself to a computer to prevent redistribution. Any software that does not meet all of the above criteria is not honestyware and cannot be marketed as such. Is Honestyware a feasible way to sell software? To be honest, I don't know yet. I'm going to sell some software as honestyware to find out. I have very good reasons to believe honestyware is a feasible way to sell software, though: Digital content can be reproduced for free, so money is never strictly lost by allowing users to download software for free. Because users can choose their own price, those who cannot pay the full price for the software can just pay less instead of pirating the software and not paying a cent to the developer. Honestyware can be shared, so it will reach a greater audience through unsolicited social advertising. Is Honestyware Better for the User? "Better" is a broad term, but here are a few arguments why honestyware is better for the user: Honestyware is not encumbered by DRM. Users will only pay for software they like, so honestyware encourages the development of high quality software. Users can share honestyware without feeling like they are obligating friends or family members to purchase the software. Users can try the full version of the software to see if they like it before paying for it. Open Source and Free (as in speech) software can be sold as honestyware. List of Honestyware Contact me to get your software added to the list!'''
year_published = 2025
clearnet = "https://defuse.ca/honestyware.htm"
