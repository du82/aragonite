["https://dejavu-fonts.github.io"]
title = "DejaVu Fonts"
full_description = "The DejaVu fonts are a font family based on the Vera Fonts. Its purpose is to provide a wider range of characters while maintaining the original look and feel through the process of collaborative development (see authors), under a Free license. Send your questions to the dejavu-fonts mailing list. This list is also used for discussions and announcements. We have our own IRC channel on irc.freenode.org where you can ask all your questions to the developers: #dejavu. Next to that, DejaVu contains a lot of mathematical and other symbols, arrows, braille patterns, etc... Coverage of each font can be seen in PDF samples."
