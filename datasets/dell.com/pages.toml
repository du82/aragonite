dvocacy for one another We believe everyone deserves access to opportunity, balance and fulfillment, connection with the world around them, respect and most of all – to be included. 35% Team members who identify as women* Explore Cultivating Inclusion We are using the power of technology to create a digitally inclusive future We are using technology to address the digital inequities we see in the world today. As part of our commitment, we will bring our people and our portfolio of products and services to lead community-centric initiatives supporting digital inclusion. 396 million + People have benefited from our strategic giving and volunteering programs* Explore Transforming Lives We're upholding trust in all we do We’ve spent decades listening to our customers, and the conclusion is clear: Security, privacy and ethics are core to establishing and maintaining trusted relationships. We understand the criticality of data and product security, data privacy and ethical behavior to our long-term business success. Recognized as one of the World’s Most Ethical Companies by the Ethisphere Institute for the twelfth year Explore Upholding Trust We are taking action today, to deliver a better world tomorrow Climate Action 50% The steps on the way to net zero greenhouse gas emissions matter. By 2030 we will cut our scope 1 and 2 emissions by 50% and achieve net zero emissions across scopes 1, 2 and 3 by 2050. Find out how Digital inclusion 1 billion By 2030, we will improve 1 billion lives through digital inclusion, connecting underrepresented groups to skills and resources, delivering the benefits of technology for all. Find Out More Circular Economy 50% By 2030, more than half of our product content will be made from recycled, renewable or reduced carbon emissions material. Find Out More UPHOLDING TRUST Principles for Ethical Artificial Intelligence Our Principles for Ethical Artificial Intelligence (AI) is a set of guidelines to ensure AI is developed and applied ethically and responsibly. Find Out More DIGITAL INCLUSION 1,000 By 2030, we will use our expertise and technology to support the digital transformation of 1,000 nonprofit partners by 2030. Find Out More Access to key ESG resources Our FY24 ESG Report In our annual ESG report, we demonstrate how our commitments drive climate action, accelerate the circular economy, support digitally inclusive communities and champion our inclusive workforce. Read Report ESG REPORTING Our ESG report summary At Dell Technologies, we see a future that propels human progress, one that delivers business and societal impact for everyone. Read Report Summary CLIMATE ACTION Our Global Climate Principles Dell Technologies' Global Climate Principles reflect the most pressing issues related to climate change today and outline our point of view and approach to addressing climate action. Read Principles CORPORATE ETHICS Dell Technologies Code of Conduct Our Code of Conduct provides guidance on how we carry out our daily activities in accordance with our culture and values. View Code of Conduct ESG REPORTING ESG Reporting Frameworks and Guidelines We’re constantly working to enhance our ESG reporting. One of the key aspects of our reporting is the consideration of internationally recognized reporting frameworks and guidelines, including GRI, SASB, WEF and TCFD. View Indexes View All ESG Resources *Based on information available in Dell’s FY24 ESG Report. Data as of the end of FY24 (February 3, 2024).'''
