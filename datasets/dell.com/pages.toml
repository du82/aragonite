of sustainable materials in our products in FY24*. Find Out More RECYCLING 96.4% percentage of our packaging in FY24 made from recycled or renewable materials*. Recycle Now CLIMATE ACTION Net Zero We will reach net zero greenhouse gas emissions across scopes 1, 2 and 3 by 2050. Watch Video CIRCULAR DESIGN Concept Luna Our breakthrough prototype for future sustainable PC design featuring revolutionary ideas to reduce waste and emissions, reuse materials and achieve next-level innovation. Read Blog CHAMPIONING PEOPLE Dell Technologies promotes a safe, healthy workplace where people can thrive. We expect the same within our supply chain - reinforcing the responsible operation of our factories and those of our suppliers. — Kevin Brown, EVP, Chief Supply Chain Officer Read How Advancing Sustainability Our Advancing Sustainability goals focus our actions on climate change and the circular economy, ensuring better outcomes for business, people and the planet View All Goals Climate action By 2050, we will achieve net zero greenhouse gas (GHG) emissions across scopes 1, 2 and 3. Key drivers By 2030, we will reduce scopes 1 and 2 GHG emissions by 50%. By 2030, we will source 75% of electricity from renewable sources across all Dell Technologies facilities — and 100% by 2040. By 2030, we will reduce absolute scope 3 GHG emissions from purchased goods and services by 45%. By 2030, we will reduce absolute scope 3 GHG emissions associated with the use of sold products by 30%. Circular economy By 2030, for every metric ton of our product a customer buys, one metric ton will be reused or recycled. By 2030, 100% of our packaging will be made from recycled or renewable material, or will utilize reused packaging. By 2030, more than half of our product content will be made from recycled, renewable or reduced carbon emissions material. View Our Progress Where we are making an impact Climate action We are creating innovative, sustainable technology and solutions to help our customers improve business outcomes and reduce emissions, while we take action on ambitious climate targets that benefit society and the planet. Explore Circular economy We are driving circular innovation in design, manufacturing, sustainable materials and services, and have partnered with others to dramatically reduce e-waste. We continuously look for opportunities to redesign, reuse and recycle our technology, aiming for a future where nothing goes to waste. Explore Supply chain With the power of our global supply chain, we have the scale and ability to drive responsible manufacturing. We insist upon ethical practices, respect and dignity for everyone creating our products and the adoption of responsible practices to minimize environmental impact. Explore A shared focus on sustainability Together with Intel, we drive sustainability across the product lifecycle of our technology and work within our communities and across our industry to protect our planet. We are advancing sustainable computing to help you transform your organization in a low-carbon economy. From green data center solutions powered by Intel® Xeon® Scalable processors with advancements in cooling and power management to Intel® Active Management Technology on Intel vPro® for remote IT access to devices which helps reduce fuel-consuming deskside visits or asset shipments*, we’re working to reduce environmental impact for a more sustainable future for all. Advancing Sustainability resources Our FY24 ESG Report In our annual ESG report, we demonstrate how our commitments drive climate action, accelerate the circular economy, support digitally inclusive communities and champion our inclusive workforce. Read Report PRODUCT SUSTAINABILITY Sustainable by design We create our products and packaging with sustainability built in at every stage – to reduce our environmental impact and yours. Find Out More SERVERS AND STORAGE Energy efficiency meets sustainability We design our infrastructure solutions to optimize power and increase energy efficiency with advanced cooling and thermals. Dell can help you reduce the carbon footprint of your data center. Find Out More MINIMIZING OUR FOOTPRINT Product Carbon Footprints A product's carbon footprint (PCF) helps us understand its impact on the environment, providing valuable insight to design more sustainably. Find Out More CIRCULAR ECONOMY Responsible recovery and recycling services Responsible recycling is critical in protecting our planet. We offer a variety of convenient services to help businesses, organizations and consumers safely and securely retire or recycle their used technology. Find Out More View All ESG Resources Explore more Recycle today. Protect tomorrow. At Dell Technologies, we're committed to protecting our customers and our planet. That’s why we provide secure and responsible recycling options for both consumers and businesses around the world. Find the service that's right for you today. Act Now An End-to-End Sustainability Approach to Drive Greater Impact for All Our latest ESG report shares the actions we are taking today to accelerate social and environmental progress for tomorrow. Read Blog *Based on information available in Dell’s FY24 ESG Report. Data as of the end of FY24 (February 3, 2024).'''
