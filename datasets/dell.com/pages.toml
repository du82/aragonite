stomers, partners, and peers to provide you the tools, connections, and knowledge to support your technology goals. Register now and join us May 6-9 in Denver, Colorado, to solve difficult challenges, grow your expertise, and learn ways to meet the demands of your customers with less, not more, complexity. You’ll leave with new ideas to help you and your company excel.", "startDate":"2024-05-06T09:00:00.000Z", "endDate":"2024-05-09T18:00:00.000Z", "url":"https://www.redhat.com/en/summit" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":", United States", "id":"a-usa~2024~dell-technologies-world", "name":"Dell Technologies World 2024", "description":"<b>Accelerate AI adoption to unlock innovation</b>Dell Technologies World – happening at The Venetian in Las Vegas, May 20–23, 2024 – is a showcase of all the ways we’re using technology and AI to accelerate from ideas to innovation. Meet up with a community of technologists and innovators to share stories, understand our vision for the future and be a part of what’s next.", "startDate":"2024-05-20T09:00:00.000Z", "endDate":"2024-05-23T06:00:00.000Z", "url":"https://www.dell.com/en-us/dt/events/delltechnologiesworld/2024/index.htm?dgc=ba&cid=dellcom&lid=events_page_tile&refid=ba_dellcom_events_page_tile" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":", United States", "id":"a-usa~2024~iste--2024", "name":"ISTE 2024", "description":"ISTELive is one of the world’s most comprehensive edtech events, attended by a global contingent of education leaders, teachers, coaches, librarians/media specialists and more.", "startDate":"2024-06-23T12:00:00.000Z", "endDate":"2024-06-26T20:00:00.000Z", "url":"https://conference.iste.org/2024/" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Denver, United States", "id":"a-usa~2024~siggraph", "name":"Siggraph", "description":"ACM SIGGRAPH is a special interest group within ACM, and SIGGRAPH 2024 is the premier conference on computer graphics and interactive techniques worldwide. This year, we enter the next age of computer graphics and interactive techniques, leading with creativity to design our most desirable future ahead.", "startDate":"2024-07-28T09:00:00.000Z", "endDate":"2024-08-01T16:00:00.000Z", "url":"https://s2024.siggraph.org/about-the-conference/" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Las Vegas, United States", "id":"a-usa~2024~vmware-explore", "name":"VMware Explore", "description":"VMware Explore is VMware's flagship event for all things multi-cloud. VMware Explore aims to facilitate new relationships, inspire learning, and provide hands-on training and access to thought leadership in the multi-cloud space.", "startDate":"2024-08-26T09:00:00.000Z", "endDate":"2024-08-29T16:00:00.000Z", "url":"https://www.vmware.com/explore/us.html" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Amsterdam, United States", "id":"a-usa~2024~ibc-2024", "name":"IBC 2024", "description":"IBC is the world’s most inspiring content and technology event. It draws together the global media, entertainment and technology industry for a compelling live experience that enables every attendee to gain critical insights, share expertise and unlock business opportunities. Created ‘by the industry, for the industry’ – a principle established on its founding in 1967 that carries through to today – IBC has continued to evolve with each new trend and technology over its 56-year history. Attracting representatives from 24 countries in its first year, IBC now welcomes exhibitors, speakers and visitors from more than 170 nations.", "startDate":"2024-09-13T09:00:00.000Z", "endDate":"2024-09-16T18:00:00.000Z", "url":"https://show.ibc.org/" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":", United States", "id":"a-usa~2024~making-ai-real-with-data", "name":"Making AI real with Data", "description":"Join us for a virtual event, “Making AI Real with Data,” where Dell Technologies and NVIDIA will showcase how cutting-edge Dell PowerScale, ObjectScale and Dell Data Lakehouse solutions are transforming AI from a visionary concept into a tangible reality. This event is designed for professionals eager to harness the power of AI to drive innovation and efficiency in their organizations.", "startDate":"2024-10-15T02:00:00.000Z", "endDate":"2024-10-14T02:30:00.000Z", "url":"https://www.thecube.net/events/dell/making-ai-real-with-data" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"San Antonio, United States", "id":"a-usa~2024~educause", "name":"Educause", "description":"The EDUCAUSE Annual Conference connects the best thinkers in higher education technology. This is THE event where professionals and technology providers from around the world gather to network, share ideas, grow professionally, and discover solutions to today's challenges.", "startDate":"2024-10-21T09:00:00.000Z", "endDate":"2024-10-24T18:00:00.000Z", "url":"https://events.educause.edu/annual-conference" } ] [{ "@context":"https://www.schema.org", "@type":"Event", "location":"Barcelona, Spain", "id":"a-usa~2025~mobile-world-congress", "name":"Mobile World Congress", "description":"MWC Barcelona is an annual trade show dedicated to the mobile communications industry. The event is held in Barcelona, Spain, at the Fira de Barcelona Gran Via, usually in February or early March. It is attended primarily by device manufacturers, network equipment providers, representatives of wireless carriers, and the press, among others. Its annual attendance is generally around 100,000 people, while mobile phone manufacturers often use the conference to unveil upcoming devices. ", "startDate":"2025-03-03T08:00:00.000Z", "endDate":"2025-03-06T17:00:00.000Z", "url":"" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Las Vegas, United States", "id":"a-usa~2025~himms", "name":"HIMMS", "description":"The HIMSS Global Health Conference & Exhibition is a yearly conference that brings together healthcare and technology professionals to share ideas and learn about the latest health IT trends. The conference is hosted by the Healthcare Information and Management Systems Society (HIMSS). ", "startDate":"2025-03-03T08:00:00.000Z", "endDate":"2025-03-06T17:00:00.000Z", "url":"" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"San Jose, United States", "id":"a-usa~2025~nvidia-gtc", "name":"NVIDIA GTC", "description":"The NVIDIA GTC (GPU Technology Conference) is a global conference focused on artificial intelligence (AI) where developers, researchers, and industry professionals gather to learn about the latest advancements in AI, computer graphics, data science, and related technologies, primarily showcasing NVIDIA's hardware, software, and services, with a keynote speech typically delivered by NVIDIA CEO Jensen Huang at the start of the event; it's considered a leading platform for exploring the future of AI and accelerated computing. ", "startDate":"2025-03-18T08:00:00.000Z", "endDate":"2025-03-21T17:00:00.000Z", "url":"" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Hannover, Germany", "id":"a-usa~2025~hannover-messe", "name":"Hannover Messe", "description":"HANNOVER MESSE brings the core industrial sectors together at one location – from drive engineering, automation, energy, R&D and industrial IT to subcontracting. This is the place where exhibitors cross the boundaries of technology and industry.", "startDate":"2025-03-31T08:00:00.000Z", "endDate":"2025-04-04T17:00:00.000Z", "url":"" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Las Vegas, United States", "id":"a-usa~2025~nab", "name":"NAB ", "description":"he National Association of Broadcasters (NAB) Show is a yearly conference and trade show that connects media, entertainment, and technology professionals. The show features the latest products, services, and innovations in these industries. ", "startDate":"2025-04-05T08:00:00.000Z", "endDate":"2025-04-09T17:00:00.000Z", "url":"" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":", United States", "id":"a-usa~2025~dell-technolgies-world-2025", "name":"Dell Technologies World 2025", "description":"Dell Technologies World is happening May 19–22, 2025 in Las Vegas. Get ready for breaking announcements and innovations, visionary Keynotes, non-stop learning opportunities, epic entertainment and unlimited networking — all in one place. ", "startDate":"2025-05-19T04:00:00.000Z", "endDate":"2025-05-22T18:00:00.000Z", "url":"https://www.dell.com/en-us/dt/events/delltechnologiesworld/2025/index.htm?dgc=ba&cid=dellcom&lid=events_page_tile" } ,{ "@context":"https://www.schema.org", "@type":"Event", "location":"Boston, United States", "id":"a-usa~2025~red-hat-summit", "name":"Red Hat Summit", "description":"The Red Hat Summit is a conference for IT professionals, open source technologists, and enterprise leaders to learn, collaborate, and innovate. The conference features keynote speakers, breakout sessions, panels, and an expo hall. ", "startDate":"2025-05-19T08:00:00.000Z", "endDate":"2025-05-22T17:00:00.000Z", "url":"" } ] [ { "@context":"https://www.schema.org", "@type":"Event", "location":"Digital", "id":"c-NXNFKR34CVB", "name":"Translate lofty AI ambitions into impactful business success", "description":"Brought to you by Dell Technologies and NVIDIA Generative AI is set to transform global enterprise, with experts predicting Gen AI will drive significant revenue growth. However researchers are also discovering that many Gen AI projects are being abandoned as IT leaders get to grips with this powerful yet complex technology. So how do enterprises ensure AI pilots mature into successful projects that deliver measurable gains? In this CIO webcast hear from leading experts at Dell Technologies and NVIDIA as they chart a course toward AI success, sharing practical strategies and insights.", "startDate":"2025-02-07T09:00:00.000Z", "endDate":"2025-07-31T08:45:00.000Z", "url":"https://events.dell.com/d/82qh2p?ref=eventscalendar&refID=DTeventscalendar" }, { "@context":"https://www.schema.org", "@type":"Event", "location":"Digital", "id":"c-JDNN2C655JB", "name":"Shaping multi-cloud and data ecosystems to achieve innovation ambitions", "description":"Brought to you by Dell Technologies, Intel, and Microsoft. IT infrastructure optimisation will be key as CIOs accelerate digital transformation to achieve AI ambitions among other things. How does the advent of new technologies impact on IT teams seeking navigate and master a multi-cloud world?", "startDate":"2025-02-07T09:00:00.000Z", "endDate":"2025-07-31T18:00:00.000Z", "url":"https://events.dell.com/d/w2qhn9?ref=eventscalendar&refID=DTeventscalendar" }, { "@context":"https://www.schema.org", "@type":"Event", "location":"Digital", "id":"c-LSNM8X3SDVJ", "name":"Total Economic Impact of Dell Premier", "description":"IT procur'''
