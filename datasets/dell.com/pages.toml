lore Dell APEX Subscriptions Be ready for what's next while aligning to your preferred operating model Optimize workloads with ease and agility. Scale as business expands. Operate more efficiently. Flexible Deployment Options Available in appliance and rack-scale systems or ready node building blocks to meet your environment and workloads Simplified, Powerful Infrastructure Built on next-generation PowerEdge servers to deliver cloud-like agility, scalability and simplified IT management with data protection built in Leading Support and Services Backed with comprehensive, single-point-of-contact support for hardware, hypervisor and software CUSTOMER STORY “We saved $800,000 in recurring hardware-refresh costs for our police cars by making our VMware Horizon VDI a mobile solution supported by VxRail.” Richard Gagnon - CIO, City of Amarillo, Texas Awards & Reviews Dell VxRail VD-4000 CRN's 2023 Tech Innovator Awards Winner (Hyperconverged Infrastructure) See Award on CRN®.com Market Leader: VxRail 2022 IT Brand Pulse HCI Appliances Market Leader Awards See Award on itbrandpulse.com Essential Resources Analyst Reports Customer Stories Analyst Reports <object data="https://www.dell.com/en-ca/dt/converged-infrastructure/hyper-converged-infrastructure/jcr:content/par/column_control_v3_dc/column-0/tab_control_v3_6fa5/tab-list-0.htm" width="100%" height="auto"></object> Customer Stories <object data="https://www.dell.com/en-ca/dt/converged-infrastructure/hyper-converged-infrastructure/jcr:content/par/column_control_v3_dc/column-0/tab_control_v3_6fa5/tab-list-1.htm" width="100%" height="auto"></object> Related offerings Dell APEX Hybrid Cloud Accelerate your hybrid cloud adoption Delivering a consistent and secure cloud experience for your VMware workloads across multicloud environments. Explore VxRail for SAP HANA Transform your SAP HANA experience with VxRail VxRail delivers a turnkey experience for mission-critical SAP HANA environments. Explore World-Class Services Consulting, deployment and support Services designed to help you accelerate your HCI adoption. Explore Questions? We're here to help. From offering expert advice to solving complex problems, we've got you covered. Chat with a Business Advisor Request a Sales Callback Get Support'''
