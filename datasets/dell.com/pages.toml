.add("compat-object-fit"))}}}(); We’re committed to helping protect the environment. That’s why we provide convenient solutions to help you recycle or retire your computer technology and IT equipment. Get started now. It’s easy. Get started Find out which recycling and recovery services are available in your area. Recycle Now Fast facts. Recycling solutions edition. Personal equipment It’s free and easy. We accept any brand of used computers and electronics in any condition. In many locations, you can drop-off used equipment for free recycling and support your community. We provide free mail-back recycling services globally. Business equipment We accept any brand of owned or leased IT equipment. We manage end-to-end logistics. Your data stays safe: We sanitize your equipment as part of the recycling process. We’ll help you unlock value in your old equipment or recycle it. We provide you comprehensive reporting for all equipment recycled. Recycling Services Delivering solutions for a sustainable future See how Dell is accelerating sustainability through services. Read eBook Designing products for a sustainable future We’re designing products with more sustainable materials including those from closed-loop recycling. A good example – select commercial PCs incorporating bioplastics from trees.* Explore Sustainable Devices You have recycling questions. We have the answers. Equipment that can be recycled What happens to recycled equipment Ensuring security for my data Our recycling policies and positions Our recycling story We began offering recycling services in 1996. Since 2007, we have recovered more than 2.5 billion pounds (1.1B kg) of used electronics. Our focus is to recover more e-waste by making more customers aware of our recycling solutions, introducing our services in new places, and returning the most value to customers. It’s part of our commitment to advance a circular economy. Our 2030 moonshot goals There is always more we can do to protect our planet. That is why we have set goals to take back as much equipment as we produce and increase our use of recycled and renewable materials. By 2030 For every product a customer buys, we will reuse or recycle an equivalent product. By 2030 100% of our packaging will be made from recycled or renewable material. By 2030 More than half of our product content will be made from recycled or renewable material. Learn About Our 2030 Social Impact Goals Focus on sustainability Protecting the planet takes collaboration. We are always honored to work with and be recognized by stakeholder organizations like: View More Social Impact Awards Join us in the journey towards a more sustainable future It may be time to part ways with your device, but you can rest easy knowing that we have the resources to repurpose and recycle computer equipment to make the world a better place for all. With your help we can protect the planet by advancing circular economy. Recycle Now Driving the future of sustainable product design To push the boundaries of sustainable laptop design, we partnered with Intel to create Concept Luna. This prototype explores revolutionary ideas to make components easily accessible, replaceable and reusable, reducing resources and keeping more circular materials in use. .bleed .recycling-trade-in.pagebed{padding-left:0;padding-right:0} #recycling-sustainable{padding-left:0;padding-right:0} #recycling-journey{padding-left:0;padding-right:0} .protect-the-environment.list02-view .has-image .wrap-claim img{max-width:100px;max-height:100px} Questions? We're here to help. From offering expert advice to solving complex problems, we've got you covered. Chat with a Business Advisor Request a Sales Callback Get Support *Latitude 5000 series use bioplastics from trees in the LCD coverlid (21% by weight).'''
