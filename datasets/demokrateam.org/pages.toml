rwenden. Du kannst die Verwendung von Cookies über deinen Browser deaktivieren, aber bitte beachte, dass unsere Website dann unter Umständen nicht richtig funktioniert.7.1 Verwalte deine ZustimmungseinstellungenDu hast die Cookie-Richtlinie ohne Javascript-Unterstützung geladen. Unter AMP kannst du die Schaltfläche zum Zustimmen der Einwilligung unten auf der Seite verwenden.8. Aktivierung/Deaktivierung und Löschen von CookiesDu kannst deinen Internetbrowser verwenden um automatisch oder manuell Cookies zu löschen. Du kannst außerdem spezifizieren, ob spezielle Cookies nicht platziert werden sollen. Eine andere Möglichkeit ist es, deinen Internetbrowser derart einzurichten, dass du jedes Mal benachrichtigt wirst, wenn ein Cookie platziert wird. Für weitere Information über diese Möglichkeiten, beachte die Anweisungen in der Hilfesektion deines Browsers.Bitte nimm zur Kenntnis, dass unsere Website möglicherweise nicht richtig funktioniert, wenn alle Cookies deaktiviert sind. Wenn du die Cookies in deinem Browser löscht, werden diese neu platziert, wenn du unsere Website erneut besuchst.9. Deine Rechte in Bezug auf persönliche DatenDu hast in Bezug auf deine persönlichen Daten die folgenden Rechte:Du hast das Recht zu wissen, warum deine persönlichen Daten gebraucht werden, was mit ihnen passiert und wie lange diese verwahrt werden.Zugriffsrecht: Du hast das Recht, deine uns bekannten persönliche Daten einzusehen.Recht auf Berichtigung: Du hast das Recht, wann immer du wünscht, deine persönlichen Daten zu ergänzen, zu korrigieren sowie gelöscht oder blockiert zu bekommen.Wenn du uns dein Einverständnis zur Verarbeitung deiner Daten gegeben hast, hast du das Recht, dieses Einverständnis zu widerrufen und deine persönlichen Daten löschen zu lassen.Recht auf Datentransfer deiner Daten: Du hast das Recht, alle deine persönlichen Daten von einem Verantwortlichen anzufordern und in ihrer Gesamtheit zu einem anderen Verantwortlichen zu transferieren.Widerspruchsrecht: Du kannst der Verarbeitung deiner Daten widersprechen. Wir entsprechen dem, es sei denn es gibt berechtigte Gründe für die Verarbeitung.Um diese Rechte auszuüben kontaktiere uns bitte. Bitte beziehe dich auf die Kontaktdaten am Ende dieser Cookie-Erklärung. Wenn du eine Beschwerde darüber hast, wie wir deine Daten behandeln, würden wir diese gerne hören, aber du hast auch das Recht diese an die Aufsichtsbehörde (Datenschutzbehörde) zu richten.10. KontaktdatenFür Fragen und/oder Kommentare über unsere Cookie-Richtlinien und diese Aussage kontaktiere uns bitte mittels der folgenden Kontaktdaten:Samuel Marfo c/o Postflex #5590 Emsdettener Str. 10 48268 Greven Keine Pakete oder Päckchen - Annahme wird verweigert! Deutschland Website: https://www.demokrateam.org E-Mail: hey@demokrateam.org Diese Cookie-Richtlinie wurde mit cookiedatabase.org am Februar 28, 2025 synchronisiert.'
