["https://www.demokrateam.org/aktionen/heraus-zum-08-maerz-demo-zum-internationalen-feministischen-kampftag"]
title = "Demo gegen Rechts in Hamburg, Hamburg » Heraus zum 08. März - Demo zum internationalen feministischen Kampftag"
description = """
Alle gemeinsam
HERAUS ZUM 8. MÄRZ!Am 8. März, dem Internationalen Feministischen Kampftag, gehen wir auch in diesem Jahr auf die Straße! Seit über 100 Jahren kämpfen wir als Teil der Arbeiter:innenbewegung weltweit an diesem Tag für unsere Rechte und unsere Befreiung. Dieser Kampf ist aktueller denn je, denn die rasanten Rechtsentwicklungen der letzten Jahre zeigen deutlich: Die Angriffe auf uns wachsen!Wir fordern:Mehr Hilfsangebote und Beratungsstellen, mehr Kita-Plätze, mehr Frauenhäuser und die vollständige Umsetzung der Istanbul-Konvention!Körperliche Selbstbestimmung: Die Entkriminalisierung von Schwangerschaftsabbrüchen – weg mit §218! Kostenloser Zugang zu Verhütungs- und Menstruationsprodukten sowie zu Mitteln zur Unterstützung der Transition!Ein kostenloses, umfangreiches und öffentliches Gesundheitssystem für alle!Finanzielle Sicherheit und Schutz vor Altersarmut – gleicher Lohn für gleiche Arbeit und eine Rente, die zum Leben reicht!Sichere und inklusive Lebensräume für Lesben, bisexuelle, trans Frauen und genderqueere Menschen!Bezahlbarer und ausreichender Wohnraum für alle!Ein Ende der Einschränkungen des Asylrechts und ein Ehegatten-unabhängiges Aufenthaltsrecht!Unterzeichner*innen:AntiFeminizidNetzwerk Hamburg
