title = "Diskussion gegen Rechts in Online, » Politischer Gesprächskreis - Diskussionen zu tagesaktuellen Themen"
description = "Der politische Gesprächskreis ist ein neues Angebot für alle politisch Interessierten, die Lust haben, gemeinsam und auf Augenhöhe über aktuelle Themen der Tagespolitik und des Weltgeschehens zu diskutieren. Die Diskussionsthemen werden gemeinsam im Kurs festgelegt und allen zur eigenen Vorbereitung rechtzeitig kommuniziert. Die Runde wird von dem promovierten Politikwissenschaftler und Philosophen Dr. Maurice Schuhmann moderiert, der auf Begrenzungen von Redezeit und Nettiquette achtet. Bei Bedarf liefert der Kursleiter auch Hintergrundinformationen oder ordnet Sachverhalte, um eine für alle Teilnehmenden angenehme Atmosphäre und eine gewinnbringende Diskussion zu ermöglichen.Dieser Kurs findet online statt.Bitte registrieren Sie sich vorab als Teilnehmer/in unter www.vhs.cloud. Den Zugangscode zum Online-Kurs finden Sie nach Ihrer Buchung auf der Anmeldebestätigung."
