["https://www.demokrateam.org/aktionen/argumentieren-gegen-rechte-hetze-4"]
title = "Workshop gegen Rechts in Hamburg, Hamburg » Argumentieren gegen rechte Hetze"
description = """
Im Alltag begegnen uns immer wieder rechte Parolen, die uns die Sprache verschlagen. Später ärgern wir uns und denken: „… hätte ich doch den Mund aufgemacht und widersprochen.“
Hier wollen wir ansetzen und Menschen in die Lage versetzen, die Schrecksekunde zu überwinden, Position zu beziehen und deutlich zu machen: Das nehmen wir nicht länger hin!
In den sogenannten Stammtischkämpfer:innen-Workshops werden Handlungsmöglichkeiten aufgezeigt, die uns dabei unterstützen, den rechten und diskriminierende Parolen wie beispielsweise denen der AfD und ihrer Anhänger:innen etwas entgegenzusetzen.Samstag, 11. Januar 2025
10 – 16:30 Uhr
Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Samstag, 15. Februar 2025
10 – 16:30 Uhr
Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Samstag, 22. März 2025
10 – 16:30 Uhr
Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Anmeldung: agr.hh-stammtischkaempfer@t-online.de
Kosten: Die Teilnahme ist kostenfrei, jedoch freuen wir uns über Spenden.STARK GEGEN RECHTE UND DISKRIMINIERENDE PAROLENInhalte:
– Theoretischer Input
– Situationen meines Alltags, in denen ich handeln möchte
– Diskussionen und Austausch mit verschiedenen methodischen Ansätzen
– praktische ÜbungenHinweis: Der Workshop wird von weißen Personen gegeben. Innerhalb des Workshops wird zu Übungszwecken Rassismus reproduziert. Es sollen so Strategien erlernt werden, um in Situationen, in denen Rassismus beobachtet wird, sicher und angemessen reagieren zu können. Wir richten uns mit dem Workshop insbesondere an weiße Menschen. Betroffene sind natürlich trotzdem herzlich willkommen. Wir möchten aber darauf hinweisen, dass wir aktuell im Teamer:innen-Kreis keine nicht-weiße Person haben, die ggf. auftretende schmerzhafte Erfahrungen teilen und gut auffangen kann."""
full_description = "Argumentieren gegen rechte HetzeIm Alltag begegnen uns immer wieder rechte Parolen, die uns die Sprache verschlagen. Später ärgern wir uns und denken: „… hätte ich doch den Mund aufgemacht und widersprochen.“ Hier wollen wir ansetzen und Menschen in die Lage versetzen, die Schrecksekunde zu überwinden, Position zu beziehen und deutlich zu machen: Das nehmen wir nicht länger hin! In den sogenannten Stammtischkämpfer:innen-Workshops werden Handlungsmöglichkeiten aufgezeigt, die uns dabei unterstützen, den rechten und diskriminierende Parolen wie beispielsweise denen der AfD und ihrer Anhänger:innen etwas entgegenzusetzen.Samstag, 11. Januar 2025 10 – 16:30 Uhr Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Samstag, 15. Februar 2025 10 – 16:30 Uhr Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Samstag, 22. März 2025 10 – 16:30 Uhr Rothenbaumchaussee 15 (Hinterhof – GEW, Raum A)Anmeldung: agr.hh-stammtischkaempfer@t-online.de Kosten: Die Teilnahme ist kostenfrei, jedoch freuen wir uns über Spenden.STARK GEGEN RECHTE UND DISKRIMINIERENDE PAROLENInhalte: – Theoretischer Input – Situationen meines Alltags, in denen ich handeln möchte – Diskussionen und Austausch mit verschiedenen methodischen Ansätzen – praktische ÜbungenHinweis: Der Workshop wird von weißen Personen gegeben. Innerhalb des Workshops wird zu Übungszwecken Rassismus reproduziert. Es sollen so Strategien erlernt werden, um in Situationen, in denen Rassismus beobachtet wird, sicher und angemessen reagieren zu können. Wir richten uns mit dem Workshop insbesondere an weiße Menschen. Betroffene sind natürlich trotzdem herzlich willkommen. Wir möchten aber darauf hinweisen, dass wir aktuell im Teamer:innen-Kreis keine nicht-weiße Person haben, die ggf. auftretende schmerzhafte Erfahrungen teilen und gut auffangen kann. Stadt:Hamburg Datum22.03.2025 Uhrzeit 10:00 Zur QuelleZur Quelle ArtenWorkshop StandortHamburg, GEW - GewerkschaftshausRothenbaumchaussee 15, 20148 Hamburg Bundesland Hamburg Zur