["https://www.demokrateam.org/aktionen/anitfa-cafe-soli-dinner-mit-briefe-schreiben"]
title = "Event gegen Rechts in Kiel, Schleswig-Holstein » Anitfa-Café - Soli-Dinner mit Briefe schreiben"
description = "Antifa-Café: Freiheit für alle Antifas – Soli-Dinner mit BriefeschreibenIm Januar diesen Jahres stellten sich sieben der im Rahmen des Budapest-Komplexes beschuldigten Antifas nach zwei Jahren im Untergrund, wo sie sich erfolgreich dem Zugriff durch die Repressionsorgane entziehen konnten. Weiterhin sind etliche Genoss:innen im Untergrund, um sich möglichen Haftstrafen und einer Auslieferung nach Ungarn zu entziehen. Zudem beginnt aktuell der Prozess gegen Maja in Ungarn, wo bis zu 24 Jahre Haft drohen. Im Zuge des Antifa Ost-Verfahrens sitzt der Genosse Nanuk mittlerweile seit 4 Monaten in der JVA Moabit. Diese Fälle sind nur die Spitze der verschärften Repression, mit der sich Antifaschist:innen im Fahrtwind des internationalen Rechtsrucks konfrontiert sehen.Mit einem Soli-Dinner wollen wir an diesem Abend Geld zur Unterstützung der Kampagnen für die Freilassung unserer antifaschistischen Genoss:innen sammeln. Zusätzlich wird es einen Input zur aktuellen Situation der aufgetauchten Antifas durch die Solidaritätsgruppe Family and Friends Hamburg geben. Im Anschluss wollen wir dann gemeinsam Briefe an die Gefangenen schreiben.Das Dinner wird drei leckere vegane Gänge plus ausgewählte Getränke umfassen und die Spendenempfehlung liegt bei (mindestens) 10 Euro. Wer das Geld nicht hat, ist natürlich trotzdem herzlich willkommen und wer mehr hat, kann gerne mehr geben.Donnerstag, 13.03.2025 | 19 Uhr | Antifa-Café | Alte Meierei (Hornheimer Weg 2) | KielAußerdem wird es wie immer einen gut gedeckten Materialientisch vom @stadtteilladenanniwadle und einen Infoblock geben.www.antifa-kiel.org | www.altemeierei.de"
