["https://www.demokrateam.org/aktionen/offenes-antifaschistisches-treffen-3"]
title = "OAT gegen Rechts in Frankfurt (Main), Hessen » Offenes Antifaschistisches Treffen"
description = "Hallo!Wir sind das offene antifaschistische Treffen Frankfurt. Wir wollen einen Raum für alle Menschen bieten, die sich antifaschistisch engagieren und organisieren wollen, um der zunehmenden Faschisierung der sogenannten “Mitte der Gesellschaft”, neonazistischen Ideologien und den Verhältnissen, die diese hervorbringen, gemeinsam entgegenzutreten. Wir wollen dem allgemeinen Gefühl der Ohnmacht und Vereinzelung eine Perspektive der kollektiven Selbstermächtigung entgegensetzen! Deshalb wollen wir offen sein für eure Ideen wie man linke Politik emanzipatorisch, solidarisch und zugänglich gestalten kann – sei dies in Form von Demos, Vorträgen, Workshops oder anderen kreativen Aktionsformen. Das OAT bietet die Möglichkeit, sich zu vernetzen, selbst aktiv zu werden und gemeinsam mit anderen über emanzipatorische Politik zu sprechen. Auf unserem Treffen ist kein Platz für Sexismus, Antisemitismus, Rassismus, Homo- und Transfeindlichkeit, Chauvinismus und andere menschenfeindliche Ideologien, damit sich alle Menschen bei uns wohlfühlen können.Wir treffen uns jeden Donnerstag – außer in der Woche des letzten Freitags des Monats: Da treffen wir uns statt am Donnerstag am Freitag und gehen anschließend zusammen zur Antifakneipe im Café Kurzschlusz (Thema dort diese Woche: “Feministisch streiken!”).Vor jedem Plenum veranstalten wir ein Treffen für alle Interessierten. Kontaktiert uns also gern per Mail (oatfrankfurt[at]riseup.net) oder über unsere Social-Media-Kanäle (@oatffm), wenn ihr vorbeikommen wollt.Wir freuen uns auf euch!"
