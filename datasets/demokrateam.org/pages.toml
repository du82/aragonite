["https://www.demokrateam.org/aktionen/der-afd-in-altenessen-widersetzen-der-8-maerz-gehoert-uns"]
title = "Demo gegen Rechts in Essen, Nordrhein-Westfalen » Der AfD in Altenessen widersetzen! Der 8. März gehört uns!"
description = """
🚨 Achtung, Essen! Widerstand am 08.03.! 🚨Die AfD will am 8. März mit Beatrix von Storch nach Essen kommen – am Internationalen Frauenkampftag! Eine Partei, die Frauen zurück an den Herd drängen will, die gegen Gleichberechtigung hetzt und für eine Politik steht, die uns unsere hart erkämpften Rechte nehmen will. Das ist ein Schlag ins Gesicht aller, die für Feminismus, Selbstbestimmung und eine gerechte Gesellschaft kämpfen!Doch eines ist klar: Wir lassen uns diesen historischen Kampftag nicht nehmen! Die AfD versucht, ihre menschenverachtende Ideologie immer weiter in die Gesellschaft zu tragen – doch wir sagen laut und entschlossen: STOPP! Nicht mit uns!Wir werden uns widersetzen. Wir werden laut sein. Wir werden sichtbar sein. Denn Essen ist kein Ort für rechte Hetze!🔴 Seid bereit, haltet euch den Tag frei und folgt uns für weitere Infos!
Gemeinsam werden wir den 8. März zum Kampftag machen – gegen Rechts, für Feminismus und Solidarität!✊ Kein Fußbreit der AfD! Feministisch kämpfen – immer und überall!"""
