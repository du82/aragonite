description = "Nach der Demo ist vor dem nächsten Schritt! ✊✨Am 6. März lädt Strike Back euch um 18:00 Uhr in den AStA-Raum 0029 an der Uni Hamburg ein, um gemeinsam die Demo zu reflektieren: Was lief gut? Was können wir beim nächsten Mal besser machen? Aber vor allem: Wie geht es weiter?Wir wollen zukünftige Projekte planen und überlegen, wie wir uns weiter aktiv gegen den Rechtsruck engagieren können. Eingeladen sind alle, die bei der Demo oder der Planung dabei waren – aber auch alle, die sich neu einbringen möchten!Kommt vorbei, vernetzt euch, bringt eure Ideen mit! 💡🔥"
