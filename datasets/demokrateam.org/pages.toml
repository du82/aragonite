title = "Demo gegen Rechts in Flensburg, Schleswig-Holstein » Feminismus gegen den Faschismus"
description = """
🤚Die fem.aktion flensburg, queer riot und der Rote Stern Flensburg laden ein zur großen Flensburger “Feminismus gegen den Faschismus”-DEMO!WORUM GEHT’S?👉Redebeiträge, Protest, gemeinsam stark & nicht allein sein! Wir wollen mit euch auf die Straße und zeigen, dass wir viele sind, dass wir gegen Faschismus, für Vielfalt, für Selbstbestimmung, für ein Leben in Würde & Respekt einstehen!Wir wollen zeigen, dass wir gemeinsam kämpfen, dass wir uns nicht spalten lassen, dass wir immer einen Schritt voraus sind. Denn Solidarität kann erlernt werden und wir sind gut darin!Rassismus, Faschismus, Antifeminismus, Homofeindlichkeit, Antifeminismus, Transfeindlichkeit, Sexismus, Antisemitismus, Ableismus und alle weiteren strukturellen Diskriminierungsformen dienen dazu, Menschen zu entwürdigen, ihnen den Wert abzusprechen und sie auszunutzen.Wir stehen dagegen, wir sind gegen Ausbeutung, gegen Vereinfachungen, gegen stereotype Feindbilder. Wir sind für die Toleranz von Uneindeutigkeit, für komplexe Geschichten, für den Respekt von individuellen Schicksalen, wir sind für den komplizierten Weg! Und der macht gemeinsam viel mehr Spaß und ist leichter zu gehen!Also seid dabei und zeigt mit uns gemeinsam, wo ihr steht! In Flensburg haben Menschenhass und Menschenfeindlichkeit keinen Platz!Nach der Demo laden wir noch ab 17 Uhr zu einem gemütlichen, leckeren und warmen Ausklang im Tableau Kulturcafé ein! Kurze Str. 1, 24937💡Bereitet eure Transpis und Schilder vor, wir freuen uns auf euch! Am 1.3. malen wir gemeinsam Schilder, der Post kommt noch!💡Wenn ihr einen Redebeitrag halten oder sonst etwas beisteuern wollt, meldet euch bei uns! Ihr könnt euch auch melden, wenn ihr z.B. nur etwas vorlesen wollt, was andere geschrieben haben oder etwas schreiben, aber das nicht selber vortragen wollt!📅Datum: Samstag, der 8.3. um 15 Uhr.
Ort: Nordermarkt.
Chillen danach:
17 Uhr, im @tableau_kulturcafe , Kurze Str. 1"""
