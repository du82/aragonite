description = """
Lasst uns gemeinsam auf die Straße gehen für Gleichberechtigung, Freiheit und ein selbstbestimmtes Leben! 🩷Wir treffen uns am 8. März um 17 Uhr am Schüllerplatz in Lützel. Dort gibt es eine Auftaktkundgebung, danach geht es erst über die Balduinbrücke zum Zentralplatz, nach einem kurzen Stopp geht es dann weiter zum Münzplatz.
