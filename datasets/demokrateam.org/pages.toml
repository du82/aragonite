["https://www.demokrateam.org/aktionen/smash-the-patriarchy"]
title = "Demo gegen Rechts in Hamburg, Hamburg » Smash the Patriarchy"
description = """
WIR WOLLEN KEINE BLUMEN,
WIR WOLLEN DEN STURZ VOM PATRIARCHAT! 🏴Am 08. März, dem sogenannten Welt- Frauentag, nehmen sich Männer ein Herz und laufen mit Blumen durch die Straßen, machen Videos, wie sie Frauen Blumen in die Hand drücken und danken der Frau für ihre Existenz und ihre Arbeit. Dabei soll sie doch bitte dankend die Blumen annehmen, lächeIn und zufrieden sein.Für uns ist der 08.März kein Tag an dem wir Blumen wollen. Für uns ist der Tag ein anarchafeministischer Kampftag. Ein Tag um darauf Aufmerksam zu machen, dass das Patriarchat keine Lösung ist. Das FLINTA* jeden Tag diskriminiert werden. Das jeden Tag auf der Welt Femizide passieren Das sich Menschen jeden Tag für ihre Lebens Entscheidungen rechtfertigen müssen, weil diese nicht in das patriachale, heteronormative, kapitalistische Weltbild passen.KOMMT MIT UNS AM 07.MÄRZ ZUR ANARCHISTISCHEN VORABENDDEMO UM 19 UHR AM ARRIVATIPARK!ALERTA, ALERTA QUEERFEMINISTA!"""
