["https://www.demokrateam.org/aktionen/demo-8m-feministischer-kampftag"]
title = "Demo gegen Rechts in Marburg, Hessen » Demo 8M - Feministischer Kampftag"
description = """
Nach den Bundestagswahlen gibt es genug Grund zu demonstrieren. Wir laden euch ein mit uns auf die Strasse zu gehen und laut zu werden für den Feminismus, für eine gerechte Lohnpolitik, für den garantierten Schutz in Frauenhäusern, für das körperliche Selbstbestimmungsrecht eines jeden Menschen.
Als Gemeinschaft konnten wir in den letzten Wochen erkennen wie wichtig und aufbauend große Demonstrationen sein können. Hier kann man mit anderen Menschen in Kontakt kommen, Meinungen austauschen und Frust über menschenverachtende Zustände lautstark eine Stimme und ein Gesicht verleihen!
Bringt gerne grüne Tücher, das Symbol des feministischen Widerstandes in Lateinamerika. Töpfe, Holzlöffel, Pfeifen, oder Trommeln, der Fantasie sind keine Grenzen gesetzt, um einer immer engstirnigeren Politik zu vermitteln was wir wirklich wollen: Feminismus statt Faschismus! 💚💚💜💜"""
full_description = "Demo 8M – Feministischer KampftagNach den Bundestagswahlen gibt es genug Grund zu demonstrieren. Wir laden euch ein mit uns auf die Strasse zu gehen und laut zu werden für den Feminismus, für eine gerechte Lohnpolitik, für den garantierten Schutz in Frauenhäusern, für das körperliche Selbstbestimmungsrecht eines jeden Menschen. Als Gemeinschaft konnten wir in den letzten Wochen erkennen wie wichtig und aufbauend große Demonstrationen sein können. Hier kann man mit anderen Menschen in Kontakt kommen, Meinungen austauschen und Frust über menschenverachtende Zustände lautstark eine Stimme und ein Gesicht verleihen! Bringt gerne grüne Tücher, das Symbol des feministischen Widerstandes in Lateinamerika. Töpfe, Holzlöffel, Pfeifen, oder Trommeln, der Fantasie sind keine Grenzen gesetzt, um einer immer engstirnigeren Politik zu vermitteln was wir wirklich wollen: Feminismus statt Faschismus! 💚💚💜💜 Stadt:Marburg Datum08.03.2025 Uhrzeit 17:00 Zur QuelleZur Quelle ArtenDemo StandortMarburg, HauptbahnhofBahnhofstraße 32, Marburg Bundesland Hessen Zur Quelle Next Prev My Position X"
