["https://www.demokrateam.org/aktionen/dem-rechtsruck-entgegen-treten"]
title = "Demo gegen Rechts in Oberhausen, Nordrhein-Westfalen » Dem Rechtsruck entgegen treten!"
description = "Dem Rechtsruck entgegen treten!Oberhausener Kulturzentren rufen am 1.3. zur Demo gegen den Rechtsruck auf – los geht es um 12 Uhr auf dem Ebertplatz.Wichtig: Partei- und Länderflaggen sind nicht erwünscht! Pride Flaggen natürlich willkommen.Der Wahlabend hat die Befürchtungen nur bestätigt. Eine Einteilung in demokratisch oder undemokratische Parteien erscheint fehl am Platz – ein Großteil der Stimmen ging an die Parteien, die aktiv rassistische Hetze verbreiten und sich im Wahlkampf gegenseitig darin überboten haben, Menschen mit Migrationsgeschichten pauschal zu Sündenböcken zu machen. Es bestätigt sich, dass sie nicht trotz sondern gerade wegen solcher und anderen rechten Inhalte gewählt wurden. Die Wahl war nur die Konsequenz des Diskurses im Wahlkampf der letzten Wochen. Auch wenn wenig überraschend, erschüttert das Ergebnisse uns alle aufs Neue. Umso wichtiger, jetzt nicht den Mut zu verlieren!Es gilt nun erst recht zusammen zu stehen und gemeinsam unseren Antifaschismus auf die Straße zu tragen – und genau das wollen wir am kommenden Samstag, den 1.3. in Oberhausen machen.Die nun anstehende Koalition wird sich sicher nicht durch eine solidarische Sozialpolitik auszeichnen. Die Auswirkungen werden sich auch in Oberhausen ziemlich bemerkbar machen. Die Kulturzentren und die damit verbundene Jugendarbeit werden mit massiven Streichungen konfrontiert sein, während die AfD ihre Wünsche erfüllt bekommt. Daher ist es umso wichtiger gemeinsam die Unverhandelbarkeit dieser Orte zu betonen. Wir lassen uns von den Wahlergebnissen nicht lähmen! Nach dieser Wahl heißt es um so deutlicher, rechte Politik offen zu benennen und nicht unwidersprochen hinzunehmen – egal, welche Parteien sie umsetzen.Die Demo beginnt um 12 Uhr auf dem Ebertplatz und zieht von da aus zum Druckluft, in dem abschließend auch noch Raum zum Austausch existiert."
