["https://www.demokrateam.org/wissen/demo-anmelden"]
title = "Wie du eine Demo anmeldest » DemokraTEAM"
description = "Versammlungen werden in Deutschland durch dein Grundrecht auf Versammlungsfreiheit (Art. 8 GG) geschützt. Grundsätzlich darfst du dich mit anderen ohne"
full_description = "WissenWie du eine Demo anmeldestvon Sam • 19/01/2025 Eine Demo anmelden, dass wirkt auf den ersten Augenblick kompliziert. Ist es aber nicht. Dieser Leitfaden hilft dir dabei, eine – vielleicht sogar deine erste – Demo anzumelden. Neu: Der DemoKRATOR Inhaltsverzeichnis Alle Deutschen haben das Recht, sich ohne Anmeldung oder Erlaubnis friedlich und ohne Waffen zu versammeln. Grundgesetz, Artikel 8Versammlungen werden in Deutschland durch dein Grundrecht auf Versammlungsfreiheit (Art. 8 GG) geschützt. Grundsätzlich darfst du dich mit anderen ohne Genehmigung versammeln (Spontan-Demo) und über den Standort, die Zeiten und den Ablauf der Versammlung selbst entscheiden.Mache dir Gedanken zu deiner DemoUm deine Demo anmelden zu können, brauchst du einen Plan. Je nachdem was du vorhast, musst du unterschiedlichste Dinge berücksichtigen. Hier findest du die wichtigsten Eckdaten, die du auf jeden Fall im Kopf haben solltest. Wofür? Wofür möchtest du demonstrieren? Lege ein Thema fest, z. B. ein Geheimtreffen in Potsdam. Wann? Wann soll deine Aktion stattfinden? Wichtig: eine Versammlung muss immer mindestens 48 Stunden vor Beginn bei der zuständigen Behörde angekündigt werden. Denke bitte auch daran, dass du Zeit für Planung und Kommunikation brauchst. Was? Was soll passieren? Laufdemo? Kundgebung? Lichterkette? oder doch ein Flashmob? Lasse deiner Kreativität freien Lauf. Wer? Wer hilft dir? Brauchst du Ordner*innen, Künstler*innen, oder jemanden für Redebeiträge? Halte deinen Plan festJetzt wo du weißt was du vorhast, solltest du einen Plan festhalten. So hast du alle benötigten Infos für Behörden und Mitwirkende parat. Unser Tipp: nutze Google Docs, dort können andere, egal ob mit oder ohne Google-Konto, dein Dokument betrachten, oder sogar direkt bearbeiten.Melde deine Versammlung anKonzept steht? Perfekt! Kommen wir zur Bürokratie. Je nachdem in welchem Bundesland deine Versammlung stattfindet, musst du deine Demo bei der Polizei, dem Ordnungsamt oder der Versammlungsbehörde anmelden. Du kannst entweder vorhandene Onlinetools nutzen, oder eine formlose Email an die zuständige Stelle schicken. Beachte bitte, dass es zu Rückfragen seitens der Behörde kommen kann.Was du dabei grundsetzlich beachten solltest Wann muss (m)eine Versammlung angemeldet werden? Melde deine Versammlung mindestens 48 Stunden vorher bei der zuständigen Behörde an – in Bayern und Niedersachsen zählen dabei nur Arbeitstage. Und denk dran: Werbung ist erst erlaubt, wenn du eine positive Rückmeldung bekommen hast.Es gibt aber Ausnahmen:Spontandemos: Kein Planen, keine Anmeldung – wenn der Anlass akut ist, einfach loslegen.Eildemos: Kurzfristig anmelden, wenn es wirklich dringend ist.Willst du in der Nähe von Landesparlamenten, dem Bundestag, Bundesrat oder Bundesverfassungsgericht demonstrieren, denk an den Bannkreis: Hier brauchst du eine explizite Genehmigung, und die 48-Stunden-Regel reicht nicht. Werbung ist erst nach der Erlaubnis erlaubt, also plane am besten mindestens zwei Wochen vorher.Kurz gesagt: Rechtzeitig anmelden, auf Genehmigung warten und dann durchstarten! Wer kann (m)eine Versammlung anmelden? Grundsätzlich kann jede*r EU-Bürger*in eine Versammlung anmelden. Wichtig ist, dass die Person zuverlässig ist, da sie wichtige Infos weitergeben und ggf. mit der Versammlungsbehörde verhandeln muss. Sie sollte vor der Versammlung gut erreichbar sein.Pro-Tipp: Damit alles reibungslos läuft, kann die anmeldende Person auch direkt die Versammlungsleitung übernehmen – das ist aber kein Muss.Und keine Sorge: Weder Anmelder*in noch Versammlungsleitung müssen volljährig sein! Was muss bei der Anmeldung angegeben werden? Datum der Anmeldung. u.A. zur Kontrolle der 48-Stunden-Frist.Start der Versammlung: Datum und Uhrzeit des Versammlungs-Beginns. Wenn bevor die Versammlung losgeht etwas aufgebaut werden soll, muss auch das angemeldet werden.Ort der Versammlung. Bei einer Laufdemo solltest du den Start und das Ziel, sowie die genaue Laufroute angeben.Anlass der Versammlung. Für Demokratie, Unsere Stadt bleibt bunt, Lichtermeer für Vielfalt.Kontaktdaten der Veranstaltenden und der Versammlungsleitung (kann die selbe Person sein). Gib Namen, Adressen und Kontaktmöglichkeiten wie Email und Telefon an.Zahl der erwarteten Teilnehmenden. Hier kann auch ein Bereich angegeben werden, also z.B.: 100-300 Menschen.Optionale Angaben:Anzahl der Ordner*innen, die ihr einsetzten möchtet.Hilfsmittel oder Aufbauten. Nutzt ihr Fahrzeuge, Bühnen, oder Megafone? Gebt diese Dinge an, um Konflikte mit der Polizei zu vermeiden.Kommen Personen öffentlichen Interesses? Zu ihrem Schutz ist eine Anmeldung sinnvoll.Sharepic erstellenOkay, die Versammlung ist angemeldet. Zeit dafür zu sorgen, dass du nicht alleine demonstrierst. Am besten geht das, indem du ein sogenanntes Share Picture (ein Bild zum teilen auf Socialmedia) erstellst. Das kannst du entweder mit Canva oder anderen kostenlosen Tools machen.Mache auf deine Demo aufmerksam Natürlich teilst du deine Demo mit Bekannten. Hier kannst du Storys oder Posts auf Instagram, Facebook, BlueSky, WhatsApp, Snapchat, TikTok oder anderen Plattformen nutzen. Du solltest dennoch auch die Demokrat*innen erreichen, die du nicht kennst. Trage deine Demo auf demokrateam.org ein, melde dich bei lokalen Pressevertretern, Parteien oder Unternehmen und sorge dafür, dass die schweigende Mehrheit laut wird!Bleibe auf dem Laufenden Checke deine Mails. Es kann passieren, dass die zuständige Behörde neue Auflagen erlässt! Ist abzusehen, dass deutlich mehr Demokrat*innen an deiner Demo teilnehmen, könntest du aufgefordert werden mehr Ordner*innen zu stellen.Es ist soweit: endlich Demozeit! Jetzt wird es ernst. Schnapp’ dir ein Demoschild, deine Freunde und die besten Demo-Schuhe. Habt eine gute Zeit, passt auf euch auf und fangt an Demokratie zu leben.Sichtbarkeit ist wichtigEs scheint auf den ersten Blick etwas nebensächlich, aber Berichterstattung über deine Aktion für Demokratie, ist enorm wichtig!Mache Fotos & VideosTeile Eindrücke und Botschaften in Sozialen-NetzwerkenSprich mit lokalen Pressevertreter*innenSo kannst du Mitmenschen und insbesondere Politiker*innen dein Anliegen auch ohne Teilnahme an deiner Demo vermitteln.Also dann, viel spaß beim Demonstrieren! 💜Über mich Sam 21, Hamburger Jung und Initiator vom DemokraTEAM✊❤️ Lasst uns miteinander reden, nicht übereinander!"
