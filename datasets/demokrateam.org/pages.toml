["https://www.demokrateam.org/aktionen/demo-zum-feministischen-kampftag"]
title = "Demo gegen Rechts in Wiesbaden, Hessen » Demo zum feministischen Kampftag"
description = """
Auch dieses Jahr werden wir zum feministischen Kampftag unsere Wut gegen die patriarchalen Verhältnisse auf die Straße tragen.
Dazu treffen wir uns am 08.03.2025 um 14Uhr Uhr auf dem Elsässer Platz und laufen gemeinsam durch die Innenstadt zum Hauptbahnhof.Statistisch gesehen wird in Deutschland fast jeden Tag eine Frau von ihrem (Ex) Mann ermordet. Alle drei Minuten erlebt eine Frau bzw. Mädchen häusliche Gewalt. – Und die Zahlen steigen drastisch weiter.
Femizide stellen dabei eine besonders extreme und höchste Form von (patriachaler) Gewalt gegen FLINTA* dar und stehen in Zusammenhang mit anderen Gewalttaten wie häusliche Gewalt, psychischem und physischem Missbrauch.
Die Zahlen der offiziellen Statistiken geben dabei nur einen kleinen Überblick, denn die Dunkelziffer ist deutlich höher. Dies liegt unter anderem daran, dass Gewalt gegen TINA* (Trans-, inter-, nicht binäre- und agender Personen) nicht als solche aufgeführt werden, sondern in anderen Statistiken verschwimmen.
Zum anderen ist die große Hürde das Geschehene zur Anzeige zu bringen. Denn ansonsten taucht es seltenst in einer Statistik auf. Patriarchale und trans* /- queerfeindliche Gewalt tötet!Und weil die Zeiten nicht beschissener sein könnten:
20% der Wahlberechtigten geben an, bei der kommenden Bundestagswahl eine neofaschistische Partei wählen zu wollen.
Die AfD, offenkundig misogyn und reaktionär, hat es sich auf die Fahne geschrieben, Rechte von margianlisierten Gruppen bzw. FLINTA* einzuschränken. Und dabei ist sie als Partei nicht alleine. Kanzlerkandidat Merz von der CDU plädiert beispielsweise für ein Abtreibungsverbot ebenso wie die AfD.
Zudem gehören rassistische Narrative aktuell zum Wahlkampfthema Nummer eins.
Es ist jetzt mehr denn je an uns, für unsere Rechte zu kämpfen, uns zusammen zu tun, solidarisch zu bleiben und uns zu wehren.
Lasst uns gemeinsam diese patriarchalen und diskriminierenden Strukturen brechen!
🔥 Nieder mit dem patriarchalen System 🔥Deshalb auf zum feministischen Kampftag am 08. März! 🌈"""
