full_description = 'Cookie-Richtlinie (EU)Cookie-RichtlinieDiese Cookie-Richtlinie wurde zuletzt am Februar 12, 2024 aktualisiert und gilt für Bürger und Einwohner mit ständigem Wohnsitz im Europäischen Wirtschaftsraum und der Schweiz.1. EinführungUnsere Website, https://www.demokrateam.org (im folgenden: "Die Website") verwendet Cookies und ähnliche Technologien (der Einfachheit halber werden all diese unter "Cookies" zusammengefasst). Cookies werden außerdem von uns beauftragten Drittparteien platziert. In dem unten stehenden Dokument informieren wir dich über die Verwendung von Cookies auf unserer Website.2. Was sind Cookies?Ein Cookie ist eine einfache kleine Datei, die gemeinsam mit den Seiten einer Internetadresse versendet und vom Webbrowser auf dem PC oder einem anderen Gerät gespeichert werden kann. Die darin gespeicherten Informationen können während folgender Besuche zu unseren oder den Servern relevanter Drittanbieter gesendet werden.3. Was sind Skripte?Ein Script ist ein Stück Programmcode, das benutzt wird, um unserer Website Funktionalität und Interaktivität zu ermöglichen. Dieser Code wird auf unseren Servern oder auf deinem Gerät ausgeführt.4. Was ist ein Web Beacon?Ein Web-Beacon (auch Pixel-Tag genannt), ist ein kleines unsichtbares Textfragment oder Bild auf einer Website, das benutzt wird, um den Verkehr auf der Website zu überwachen. Um dies zu ermöglichen werden diverse Daten von dir mittels Web-Beacons gespeichert.5. Cookies5.1 Technische oder funktionelle CookiesEinige Cookies stellen sicher, dass Teile unserer Website richtig funktionieren und deine Nutzervorlieben bekannt bleiben. Durch das Platzieren funktionaler Cookies machen wir es dir einfacher unsere Website zu besuchen. Auf diese Weise musst du bei Besuchen unserer Website nicht wiederholt die gleichen Informationen eingeben, oder deine Gegenstände bleiben beispielsweise in deinem Warenkorb bis du bezahlst. Wir können diese Cookies ohne dein Einverständnis platzieren.5.2 Statistik-CookiesWir verwenden Statistik-Cookies, um das Website-Erlebnis für unsere Nutzer zu optimieren. Mit diesen Statistik-Cookies erhalten wir Einblicke in die Nutzung unserer Website. Wir bitten um deine Erlaubnis Statistik-Cookies zu setzen.5.3 Marketing- / Tracking-CookiesMarketing- / Tracking-Cookies sind Cookies oder eine andere Form der lokalen Speicherung, die zur Erstellung von Benutzerprofilen verwendet werden, um Werbung anzuzeigen oder den Benutzer auf dieser Website oder über mehrere Websites hinweg für ähnliche Marketingzwecke zu verfolgen.5.4 Soziale-MedienAuf unserer Website haben wir Inhalte von Facebook, Twitter, WhatsApp und Instagram eingebunden, um Webseiten zu bewerben (z. B. "Gefällt mir", "Pin") oder zu teilen (z. B. "Tweet") in sozialen Netzwerken wie Facebook, Twitter, WhatsApp und Instagram. Dieser Inhalt ist mit einem Code eingebettet, der von Facebook, Twitter, WhatsApp und Instagram stammt und Cookies platziert. Diese Inhalte können bestimmte Informationen für personalisierte Werbung speichern und verarbeiten.Bitte lies die Datenschutzerklärung dieser sozialen Netzwerke (die sich regelmäßig ändern kann), um zu erfahren, wie sie mit deinen (persönlichen) Daten umgehen, die sie mithilfe dieser Cookies verarbeiten. Die abgerufenen Daten werden so weit wie möglich anonymisiert. Facebook, Twitter, WhatsApp und Instagram hat seine Sitze in den Vereinigten Staaten.6. Platzierte Cookies iThemes SecurityFunktional Consent to service ithemes-security VerwendungWir verwenden iThemes Security für Website-Sicherheit. Mehr lesenWeitergabe von DatenFür weitere Informationen, bitte die iThemes Security Datenschutzerklärung lesen.FunktionalNameitsec-hb-login-*Ablaufdatum10 MinutenFunktionDas Verstecken der WordPress-Login-URL zur Verfügung stellenNameitsec_interstitial_browserAblaufdatumSitzungFunktionBeuge Betrug vor WordPressFunktional Consent to service wordpress VerwendungWir verwenden WordPress für Website-Entwicklung. Mehr lesenWeitergabe von DatenDiese