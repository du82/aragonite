["https://www.demokrateam.org/aktionen/riotgrrrls-der-subkulturelle-kampf-gegen-das-moderne-patriarchat"]
title = "Online-Event gegen Rechts in Online, + Online » Riotgrrrls - der subkulturelle Kampf gegen das moderne Patriarchat"
description = "Kostenloser Online-Vortrag im Rahmen “Väterwoche Reinickendorf”Beschreibung:Vor ca. 35 Jahren entstand innerhalb der amerikanischen Punkszene die Riotgirl-Bewegung, eine feministisch-orientierte Szene, mit Bands wie Bikini Kill, deren Debüt den Titel ?Revolution Girl Style Now? trug, und L7. Neben der musikalischen Ebene drückt sich dieses neue feministische Bewusstsein aber auch in anderen Medien wie der Kunst und der Zine-Kultur aus. Längst ist diese Bewegung nicht nur auf den amerikanischen Kontinent beschränkt, sondern breitet sich auch in Europa aus ? und hatte mit Bands wie Pussy Riot auch in Russland Ableger. Der Vortrag zeichnet die Entwicklung, Geschichte und die aktuelle Situation jener feministischen Bewegung und ihres Kampfes gegen das Patriarchat (auch in vermeintlich patriarchatskritischen Subkulturen) nach. Dr. Maurice Schuhmann ist Politikwissenschaftler und ist seit über 15 Jahren als Lehrkraft an Hoch- und Oberschulen, Volkshochschulen und anderen Bildungseinrichtungen tätig.Zusatzinformation:Die Veranstaltung findet online über die vhs.cloud statt und wird via BigBlueButton als Videostream übertragen. Für die Teilnahme registrieren Sie sich bitte in der kostenfreien Lernplattform der Volkshochschulen unter www.vhs.cloud. Den Kurscode finden Sie auf Ihrer Anmeldebestätigung in der pdf-Datei. Sie finden im Online-Kursraum Materialien und können sich mit anderen Teilnehmenden austauschen. Gleichfalls können Sie per Direktlink nur an der Übertragung teilnehmen – eine Registrierung in der vhs.cloud ist nicht zwingend erforderlich. Den Link versenden wir im Vorfeld per E-Mail."
