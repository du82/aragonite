["https://www.demokrateam.org/aktionen/8-maerz-wir-kaempfen-weiter"]
title = "Demo gegen Rechts in Hildesheim, Niedersachsen » 8.März: Wir kämpfen weiter"
description = """
Am 8. März ist Feministischer Kampftag! Dieses Jahr ist es wichtiger denn je, gemeinsam auf die Straße zu gehen, um solidarisch, frech und unaufhaltsam für den Feminismus laut zu sein: leistet Widerstand gegen den Rechtsruck in diesem Land! Wir kämpfen für ein Leben frei von patriarchaler Gewalt, dem binären Geschlechtersystem, Sexismus, Rassismus und allen anderen Formen von Diskriminierung. Keine Regierung wird uns davon befreien können – darum war, ist und vor allem bleibt es wichtig, klare Kante zu zeigen und dem System an den Kragen zu gehen: Feminismus heißt Entschlossenheit und unermüdliche Arbeit für eine tolerante, offene Gesellschaft ohne Macht und Gewalt, in der wir alle selbstbestimmt und frei leben können. Es ist dringend notwendig, dass wir zusammen stehen und nicht dabei zusehen, wie das letzte bisschen Solidarität von der neuen Regierung mit Füßen getreten wird! Feministische Kämpfe werden jeden Tag gekämpft, doch heute ist es wichtiger denn je: packt all eure Leute ein, wir sehen uns auf der Straße!Nach der Demo möchten wir alle dazu einladen, den Tag gemeinsam in der Loretta in der Kufa mit spritzigen Getränken und leckerem Essen von der Sokü ausklingen zu lassen. Der Kneipenabend ist offen für FLINTA* and friends!Schulter an Schulter für eine feministische Zukunft und kein Schritt zurück – WIR KÄMPFEN WEITER!Wann? 16 Uhr
Wo? Platz der weißen Rose (pvh)Ab dem Fronttranspi bis zum Lauti wird es einen Flinta* only Block geben – stellt euch laut und zahlreich auf! Falls ihr alleine kommt und Anschluss sucht: am Brunnen (direkt in der Mitte des pvh) wird es einen Treffpunkt geben, um gemeinsam auf der Demo zu laufen und laut zu sein (wir machen mit einem Schild auf uns aufmerksam). Lasst bitte generell alle National- und Organisationsfahnen Zuhause."""
