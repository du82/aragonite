["https://www.demokrateam.org/aktionen/100-jahre-hitlers-mein-kampf-eine-notwendige-entmystifizierung-und-aktuelle-einordnung-anmeldung-erforderlich"]
title = 'Online-Event gegen Rechts in Online, Berlin » 100 Jahre Hitlers "Mein Kampf". Eine notwendige Entmystifizierung und aktuelle Einordnung - Anmeldung erforderlich'
description = """
Im Juli 1925 veröffentlichte Adolf Hitler sein in der Festungshaft verfasstes Pamphlet “Mein Kampf”, in dem er seine wirre Weltsicht darstellte und sich bereits selbst stilisierte. Es war das Ergebnis seiner “Reflexionen” und Lektüren in der Haft. Er selbst benannte seine Haftzeit als Zeit des Studiums. Knapp acht Jahre später kam es zu seiner Machtübergreifung und er machte sich daran, die in dieser Schrift geäußerten Gedanken in die blutige Tat zu übersetzen. Nach dem Ende des Nationalsozialismus wurde das Werk für 70 Jahre vom Freistaat Bayern unter Berufung auf das Urheberrecht unter Verschluss gehalten. Seit zehn Jahren darf das Werk in deutschland wieder frei publiziert und verbreitet werden. Vor diesem Hintergrund gilt es zu reflektieren, welche Auswirkungen die Freigabe des Werkes hat, welche Rolle es für den modernen Rechtsextremismus spielt und auch, wie dieses Werk entmystifiziert werden kann. Dr. Maurice Schuhmann ist promovierter Politikwissenschaftler. Er unterrichtet sowohl im universitären Kontext als auch in der Erwachsenenbildung.“Wichtig ist, dass Volkshochschulen Orte des Austausches und Dialogs sind, wo Menschen unterschiedlichen Backgrounds aufeinandertreffen und in Kontakt treten können.”Anmeldung:
Tel.: 030 9018 37474
E-Mail: Infoservice.VHS@ba-mitte.berlin.de
   http://www.berlin.de/vhsmitte"""
full_description = "100 Jahre Hitlers “Mein Kampf”. Eine notwendige Entmystifizierung und aktuelle Einordnung – Anmeldung erforderlichIm Juli 1925 veröffentlichte Adolf Hitler sein in der Festungshaft verfasstes Pamphlet “Mein Kampf”, in dem er seine wirre Weltsicht darstellte und sich bereits selbst stilisierte. Es war das Ergebnis seiner “Reflexionen” und Lektüren in der Haft. Er selbst benannte seine Haftzeit als Zeit des Studiums. Knapp acht Jahre später kam es zu seiner Machtübergreifung und er machte sich daran, die in dieser Schrift geäußerten Gedanken in die blutige Tat zu übersetzen. Nach dem Ende des Nationalsozialismus wurde das Werk für 70 Jahre vom Freistaat Bayern unter Berufung auf das Urheberrecht unter Verschluss gehalten. Seit zehn Jahren darf das Werk in deutschland wieder frei publiziert und verbreitet werden. Vor diesem Hintergrund gilt es zu reflektieren, welche Auswirkungen die Freigabe des Werkes hat, welche Rolle es für den modernen Rechtsextremismus spielt und auch, wie dieses Werk entmystifiziert werden kann. Dr. Maurice Schuhmann ist promovierter Politikwissenschaftler. Er unterrichtet sowohl im universitären Kontext als auch in der Erwachsenenbildung.“Wichtig ist, dass Volkshochschulen Orte des Austausches und Dialogs sind, wo Menschen unterschiedlichen Backgrounds aufeinandertreffen und in Kontakt treten können.”Anmeldung: Tel.: 030 9018 37474 E-Mail: Infoservice.VHS@ba-mitte.berlin.de http://www.berlin.de/vhsmitte Stadt:Online Datum07.03.2025 Uhrzeit 19:30 Zur QuelleZur Quelle ArtenOnline-Event Bundesland Berlin Zur Quelle Mai 14, 2025 Magnus Hirschfeld – Ein Pionier der Sexualwissenschaft und Vorkämpfer der Homosexuellenrechte – Anmeldung erforderlich"
