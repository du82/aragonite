["https://www.demokrateam.org/aktionen/49040"]
title = "Demo gegen Rechts in Frankfurt (Main), Hessen » Solidarisch kämpfen für die Utopie!"
description = """
Wie wir uns Demo & Barabend wünschen – our wishes for the demo and bar night (EN below)Wir wollen eine 8.3.-Demo, auf der sich alle wohl fühlen und auf der feministische Kämpfe im Mittelpunkt stehen. Bitte lasst eure Nationalflaggen zu Hause, Orgafahnen nur im hinteren Teil der Demo.An der Demospitze wird es einen FLINTA*-Block geben. Hinter dem Lautsprecherwagen können alle mitlaufen. Achtet aufeinander und sprecht bei Fragen oder Problemen gerne unsere Ordner*innen an!Nach der Demo gibt es im Exzess Küche für alle (all gender). Ab 23 Uhr beginnt die FLINTA*-Party. Wenn dafür umgebaut wird, müssen alle endo cis Männer das Exzess verlassen.Verhaltet euch so, dass sich alle wohl fühlen. Unser Awareness- und Schutzteam (Lichterketten) wird sich im Exzess aufhalten und ist, so wie auch die Bar und der Einlass, jederzeit ansprechbar.———————————
We want an 8.3. demo where everyone feels comfortable and where feminist struggles take center stage. Please leave your national flags at home, orga flags only at the back of the demo.There will be a FLINTA* block at the front of the demo. Everyone can march behind the loudspeaker van. Pay attention to each other and feel free to speak to our stewards if you have any questions or problems!Afterthe demo, there will be food for everyone (all gender) at Exzess. The FLINTA* party starts at 11pm. All endo cis men have to leave the Exzess when it is being converted.Please behave in such a way that everyone feels comfortable. Our awareness and protection team (fairy lights) will be in the Exzess and can be contacted at any time, as can the bar and the entrance."""
full_description = "Solidarisch kämpfen für die Utopie!Wie wir uns Demo & Barabend wünschen – our wishes for the demo and bar night (EN below)Wir wollen eine 8.3.-Demo, auf der sich alle wohl fühlen und auf der feministische Kämpfe im Mittelpunkt stehen. Bitte lasst eure Nationalflaggen zu Hause, Orgafahnen nur im hinteren Teil der Demo.An der Demospitze wird es einen FLINTA*-Block geben. Hinter dem Lautsprecherwagen können alle mitlaufen. Achtet aufeinander und sprecht bei Fragen oder Problemen gerne unsere Ordner*innen an!Nach der Demo gibt es im Exzess Küche für alle (all gender). Ab 23 Uhr beginnt die FLINTA*-Party. Wenn dafür umgebaut wird, müssen alle endo cis Männer das Exzess verlassen.Verhaltet euch so, dass sich alle wohl fühlen. Unser Awareness- und Schutzteam (Lichterketten) wird sich im Exzess aufhalten und ist, so wie auch die Bar und der Einlass, jederzeit ansprechbar.——————————— We want an 8.3. demo where everyone feels comfortable and where feminist struggles take center stage. Please leave your national flags at home, orga flags only at the back of the demo.There will be a FLINTA* block at the front of the demo. Everyone can march behind the loudspeaker van. Pay attention to each other and feel free to speak to our stewards if you have any questions or problems!Afterthe demo, there will be food for everyone (all gender) at Exzess. The FLINTA* party starts at 11pm. All endo cis men have to leave the Exzess when it is being converted.Please behave in such a way that everyone feels comfortable. Our awareness and protection team (fairy lights) will be in the Exzess and can be contacted at any time, as can the bar and the entrance. Stadt:Frankfurt (Main) Datum08.03.2025 Uhrzeit 18:00 Zur QuelleZur Quelle ArtenDemo StandortFrankfurt (Main), HauptwacheHauptwache, 60313 Frankfurt (Main) Bundesland Hessen Zur Quelle Next Prev My Position X"
