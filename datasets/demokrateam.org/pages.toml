["https://www.demokrateam.org/aktionen/fancy-cyclista-ride"]
title = "Demo gegen Rechts in Hamburg, Hamburg » Fancy Cyclista* Ride"
description = "Feministische FahrraddemoCyclista* dieser Welt: Zeigt euch!Am 8. März 2025, 15 Uhr, Carl-von-Ossietzky-PlatzDer Fancy Cyclista*Ride demonstriert für bessere Radinfrastruktur und einen feministischen Blick auf die Mobilitätswende. Fancy wird der Ride, indem wir uns schick und bunt kleiden, mit Kleid, Glitzer oder Federboa. Außerdem können wir unsere Fahrräder schmücken: mit Blumen oder Schleifen, Plakaten oder Bannern.Frauen haben andere Bedürfnisse an Infrastruktur als Männer. Das wird in der Stadtplanung nicht ausreichend berücksichtigt. Für die Belange von Frauen einzutreten ist gerade wieder noch ein Stück wichtiger geworden. Darum zeigt euch und radelt mit uns!"
