title = "Demo gegen Rechts in Gießen, Hessen » Feministischer Kampftag - Antikapitalistisch, antirassistisch, queer - gegen patriarchale Unterdrückung!"
description = """
Feministischer Kampftag – antikapitalistisch, antirassistich, queer – gegen patriarchale Unterdrückung!Datum: Samstag, 8. März 2025
Uhrzeit: 14:00 Uhr Straßenfest mit anschließender Demo
Ort: Löwengasse, GießenKommt auf die Straßen für einen intersektionalen 8. März! Wir laden euch ein gemeinsam zu kämpfen, zu feiern und uns gegen das Patriarchat zu stellen.
Wir sind das Bündnis Feministischer Kampftag, ein Zusammenschluss verschiedener Gießener Organisationen und Privatmenschen, die gemeinsam für eine feministische Politik, hier in Gießen, aber auch in ganz Deutschland, kämpfen!
Auf unserem Straßenfest könnt ihr Kuchen essen und Live-Musik genießen. Ihr könnt unsere Bündnispartner*innen kennenlernen, euch zu feministischen Themen informieren und ins Gespräch kommen.
Anschließend wollen wir unseren Protest auf die Straßen von Gießen bringen. Und wenn ihr dann noch fit seid, können wir den Abend noch mit einer Party ausklingen lassen. Aber dazu kommt ganz bald mehr!"""
