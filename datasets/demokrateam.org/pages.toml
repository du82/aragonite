["https://www.demokrateam.org/aktionen/8-maerz-demo"]
title = "Demo gegen Rechts in Dresden, Sachsen » 8. März Demo"
description = """
📢 Demonstration zum 08. März: Schulter an Schulter, niemals allein, Feminismus heißt füreinander da zu sein. Wir kämpfen mutig, frech und unaufhaltsam!Am 8. März gehen wir gemeinsam auf die Straße – laut, entschlossen und solidarisch!Weltweit nehmen frauenfeindliche, queer-feindliche und rassistische Einstellungen zu. Feministische Errungenschaften werden zunehmend infrage gestellt. Diese Entwicklungen haben reale Konsequenzen in unser aller Alltag: Abwertung, Entrechtung, Drohungen und Gewalt. Dabei ist auf staatliche Institutionen zu unserem Schutz kein Verlass.Für uns bedeutet das: Wir müssen füreinander da sein und miteinander kämpfen!Wir müssen unsere gegenseitigen Sprachrohre, Fürsprecherinnen und Verbündete sein. Wir müssen uns ernst nehmen, zuhören und uns gegenseitig den Rücken stärken. Wir müssen Hürden gemeinsam überwinden, die uns allen oder einzelnen von uns in den Weg gestellt werden.Dafür müssen wir nicht gleich sein. Unsere Solidarität sollte sich nicht von Unterschieden aufhalten lassen. Stattdessen sollten wir aus einer Vielfältigkeit an Erfahrungen, Perspektiven und Ideen Kraft ziehen.Wir müssen der Erzählung etwas entgegensetzen, dass jeder Mensch für sein eigenes Schicksal verantwortlich ist. Der 08. März ist ein Tag, an dem wir uns Mut machen und zeigen, dass keine* von uns alleinsteht. Wir wollen zeigen, dass wir uns als Gemeinschaft begreifen, die unermüdlich für die Vielen kämpft, die von Unterdrückung, Ausbeutung und Gewalt betroffen sind.Lasst uns Schulter an Schulter auf die Straße gehen! Für eine feministische
Zukunft! Denn gemeinsam sind wir mutig, frech und unaufhaltsam!📍 Wann? 8. März, 14 Uhr
📍 Wo? Hauptbahnhof Dresden, Wiener Platz"""
full_description = "8. März Demo📢 Demonstration zum 08. März: Schulter an Schulter, niemals allein, Feminismus heißt füreinander da zu sein. Wir kämpfen mutig, frech und unaufhaltsam!Am 8. März gehen wir gemeinsam auf die Straße – laut, entschlossen und solidarisch!Weltweit nehmen frauenfeindliche, queer-feindliche und rassistische Einstellungen zu. Feministische Errungenschaften werden zunehmend infrage gestellt. Diese Entwicklungen haben reale Konsequenzen in unser aller Alltag: Abwertung, Entrechtung, Drohungen und Gewalt. Dabei ist auf staatliche Institutionen zu unserem Schutz kein Verlass.Für uns bedeutet das: Wir müssen füreinander da sein und miteinander kämpfen!Wir müssen unsere gegenseitigen Sprachrohre, Fürsprecherinnen und Verbündete sein. Wir müssen uns ernst nehmen, zuhören und uns gegenseitig den Rücken stärken. Wir müssen Hürden gemeinsam überwinden, die uns allen oder einzelnen von uns in den Weg gestellt werden.Dafür müssen wir nicht gleich sein. Unsere Solidarität sollte sich nicht von Unterschieden aufhalten lassen. Stattdessen sollten wir aus einer Vielfältigkeit an Erfahrungen, Perspektiven und Ideen Kraft ziehen.Wir müssen der Erzählung etwas entgegensetzen, dass jeder Mensch für sein eigenes Schicksal verantwortlich ist. Der 08. März ist ein Tag, an dem wir uns Mut machen und zeigen, dass keine* von uns alleinsteht. Wir wollen zeigen, dass wir uns als Gemeinschaft begreifen, die unermüdlich für die Vielen kämpft, die von Unterdrückung, Ausbeutung und Gewalt betroffen sind.Lasst uns Schulter an Schulter auf die Straße gehen! Für eine feministische Zukunft! Denn gemeinsam sind wir mutig, frech und unaufhaltsam!📍 Wann? 8. März, 14 Uhr 📍 Wo? Hauptbahnhof Dresden, Wiener Platz Stadt:Dresden Datum08.03.2025 Uhrzeit 14:00 Zur QuelleZur Quelle ArtenDemo StandortDresden, HauptbahnhofHauptbahnhof, 01069 Dresden, Deutschland Bundesland Sachsen Zur Quelle Next Prev My Position X"
