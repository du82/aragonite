["https://www.demokrateam.org/aktionen/feminism-unlimited"]
title = "Demo gegen Rechts in Berlin, Berlin » Feminism Unlimited"
description = """
Für einen antifaschistischen und universellen Feminismus!Die Welt steht in Flammen – und es sind Männer, die die Streichhölzer in der Hand halten. Ob in den USA, Afghanistan, Kurdistan, Israel, Gaza, Iran, Sudan, der Ukraine, Russland oder der BRD: Kriege, ökologische und gesellschaftliche Krisen und sexualisierte Gewalt in diesen Kontexten sind auch Ausdruck einer patriarchalen Herrschaft, in der Frauen und queere Menschen Männern gewaltvoll untergeordnet werden. Doch nicht nur im Krieg und in anderen Krisen zeigt sich die patriarchale Gewalt. Sie zeigt sich auch im Alltag: in Telegramchannels organisierter Vergewaltigungsnetzwerke, in KO-Tropfen auf Partys oder durch Faschos, die es nicht aushalten, wenn wir auf Prides demonstrieren und feiern. Wir sehen es anhand der steigenden Zahlen von häuslicher Gewalt und Feminiziden und darin, dass der Staat hier wegsieht. Und damit nicht genug: aktuell werden überall hart erkämpfte feministische Errungenschaften angegriffen und Transfeindlichkeit ist ein zentrales Mobilisierungsthema konservativer und rechter Parteien. Wir nehmen diese Angriffe nicht hin und ebensowenig den sexistischen Normalzustand!
Lasst uns am 8. März auf die Straße gehen, Seite an Seite gegen Patriarchat und Faschismus!Sexismus, Queerfeindlichkeit und Antifeminismus sind die globale Klammer rechter und autoritärer Projekte – zentrale Punkte, an dem diese Projekte trotz aller ideologischer Differenzen aneinander anknüpfen können.Widerstand dagegen war und ist immer notwendig. Gerade jetzt, wenn die Verbreitung rechter Weltbilder wieder offen zutage tritt. Sie sind eingebettet in die Strukturen von Staat und Kapitalismus. Denn in der kapitalistischen Gesellschaft leiden alle Menschen unter dem System, die nicht Teil der herrschenden Klassen sind. Dazu gehört das Gefühl, gegenüber den herrschenden Verhältnissen ohnmächtig zu sein, die Angst vor sozialem Abstieg, die Erfahrung der Ausbeutung der eigenen Arbeitskraft und die der Ungleichheit zwischen Menschen, die als natürlich dargestellt wird"""
