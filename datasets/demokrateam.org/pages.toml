["https://www.demokrateam.org/datenschutz"]
title = "Datenschutzerklärung » DemokraTEAM"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "DatenschutzerklärungDatenschutzDiese Datenschutzerklärung wurde zuletzt am Februar 12, 2024 aktualisiert und gilt für Bürger und Personen mit ständigem Wohnsitz im Europäischen Wirtschaftsraum und der Schweiz.In dieser Datenschutzerklärung erklären wir, was wir mit den Daten, die wir über dich via https://www.demokrateam.org gesammelt haben, tun. Wir empfehlen dir, dieses Dokument sorgfältig zu lesen. Während unserer Verarbeitung entsprechen wir den gesetzlichen Anforderungen. Dies bedeutet unter anderem:Wir geben klar die Zwecke für die wir persönliche Daten verarbeiten, an. Dies geschieht durch diese Datenschutzerklärung.Wir zielen darauf ab, unsere Sammlung von persönlichen Daten auf jene persönliche Daten zu beschränken, die aus legitimen Gründen benötigt werden.Wir werden zunächst dein explizites Einverständnis einholen, wenn dies notwendig sein sollte, um deine persönlichen Daten zu verarbeiten.Wir unternehmen angemessene Sicherheitsmaßnahmen um deine persönlichen Daten zu schützen und verlangen dies ebenso von Parteien, die persönliche Daten in unserem Auftrag verarbeiten.Wir respektieren dein Recht auf Einsichtnahme, Berichtigung oder Löschung deiner personenbezogenen Daten.Wenn du Fragen hast oder wissen möchtest, welche persönlichen Daten wir über dich haben, kontaktiere uns bitte.1. Zweck, Daten und AufbewahrungsfristWir können personenbezogene Daten für eine Reihe von Zwecken im Zusammenhang mit unserer Geschäftstätigkeit sammeln oder erhalten, darunter die folgenden: (zum Vergrößern anklicken)1.1 Kontakt - per Telefon, Post, E-Mail und/oder WebformateZu diesem Zweck verwenden wir die folgenden Daten:Name oder Pseudonym des KontosEine E-Mail-AdresseDie Grundlage, auf der wir diese Daten verarbeiten können, ist:Nach Erteilung der Zustimmung.BewahrungsfristWir speichern diese Daten bis zur Beendigung des Dienstes.1.2 RundschreibenZu diesem Zweck verwenden wir die folgenden Daten:Name oder Pseudonym des KontosEin Vor- und NachnameEine E-Mail-AdresseDie Grundlage, auf der wir diese Daten verarbeiten können, ist:Nach Erteilung der Zustimmung.BewahrungsfristWir speichern diese Daten bis zur Beendigung des Dienstes.2. CookiesUnsere Website benutzt Cookies. Für mehr Informationen über Cookies schaue bitte unter unseren Cookie-Richtlinien nach. 3. OffenlegungspraktikenWir legen personenbezogene Daten offen, wenn wir gesetzlich oder per Gerichtsbeschluss dazu verpflichtet sind, z. B. auf Anforderung einer Strafverfolgungsbehörde, soweit dies im Rahmen der gesetzlichen Bestimmungen zulässig ist, um Auskünfte zu erteilen, oder für eine Untersuchung in einer Angelegenheit, die die öffentliche Sicherheit betrifft.Wenn unsere Website oder unser Unternehmen im Rahmen einer Fusion oder Übernahme übernommen oder verkauft wird, können deinen Daten unseren Beratern und potenziellen Käufern offengelegt und an die neuen Eigentümer übermittelt werden.4. SicherheitWir sind der Sicherheit persönlicher Daten verpflichtet. Wir unternehmen angemessene Sicherheitsmaßnahmen um Missbrauch von und unauthorisierten Zugriff auf persönliche Daten zu begrenzen. Dies stellt sicher, dass nur notwendige Personen Zugriff auf deine Daten erhalten, dieser Zugriff geschützt ist und dass unsere Sicherheitsmaßnahmen regelmäßig geprüft werden.5. Websites von DrittanbieternDiese Datenschutzerklärung gilt nicht für Websites von Drittparteien, die durch Links auf unserer Website verbunden sind. Wir können nicht garantieren, dass diese Drittanbieter deine persönlichen Daten in verlässlicher oder sicherer Weise behandeln. Wir empfehlen dir die Datenschutzerklärungen dieser Websites vor deren Nutzung zu lesen.6. Ergänzungen zu dieser DatenschutzerklärungWir behalten uns das Recht vor, Änderungen an dieser Datenschutzerklärung vorzunehmen. Es wird empfohlen, diese Datenschutzerklärung regelmäßig zu lesen, um sich über Änderungen zu informieren. Darüber hinaus informieren wir dich wo immer möglich.7. Zugriff und Bearbeitung deiner DatenWenn du Fragen hast oder wissen möchtest, welche persönlichen Daten wir über dich haben, kontaktiere uns bitte. Du kannst uns mittels der unten stehenden Informationen erreichen. Du hast die folgenden Rechte:Du hast das Recht zu wissen, warum deine persönlichen Daten gebraucht werden, was mit ihnen passiert und wie lange diese verwahrt werden.Zugriffsrecht: Du hast das Recht deine uns bekannten persönliche Daten einzusehen.Recht auf Berichtigung: Du hast das Recht wann immer du wünscht, deine persönlichen Daten zu ergänzen, zu korrigieren sowie gelöscht oder blockiert zu bekommen.Wenn du uns dein Einverständnis zur Verarbeitung deiner Daten gegeben hast, hast du das Recht dieses Einverständnis zu widerrufen und deine persönlichen Daten löschen zu lassen.Recht auf Datentransfer deiner Daten: Du hast das Recht, alle deine persönlichen Daten von einem Verantwortlichen anzufordern und in ihrer Gesamtheit zu einem anderen Verantwortlichen zu transferieren.Widerspruchsrecht: Du kannst der Verarbeitung deiner Daten widersprechen. Wir entsprechen dem, es sei denn es gibt berechtigte Gründe für die Verarbeitung.Bitte stelle sicher, dass du immer klar angibst, wer du bist, sodass wir sicher sein können nicht die Daten der falschen Person zu bearbeiten oder zu löschen.8. Eine Beschwerde übermittelnWenn du nicht zufrieden mit der Art und Weise bist, in der wir (deine Beschwerde) die Verarbeitung deiner persönlichen Daten handhaben, hast du das Recht eine Beschwerde an die Datenschutzbehörde zu richten.9. KontaktdatenSamuel Marfo c/o Postflex #5590 Emsdettener Str. 10 48268 Greven Keine Pakete oder Päckchen - Annahme wird verweigert! Deutschland Website: https://www.demokrateam.org E-Mail: hey@demokrateam.org AnhangBurst StatisticsDiese Website benutzt Burst Statistics, ein datenschutzfreundliches Statistik-Tool, um das Besucherverhalten zu analysieren. Für diese Funktion sammeln wir (diese Website) anonymisierte Daten, die lokal gespeichert werden, ohne sie mit anderen Parteien zu teilen. Für weitere Informationen lies bitte die Privacy Statement von Burst. Complianz | The Privacy Suite for WordPressDiese Website verwendet die Privacy Suite für WordPress von Complianz, um Datensätze über Zustimmungen zu sammeln. Für diese Funktionalität wird deine IP-Adresse anonymisiert und in unserer Datenbank gespeichert. Weitere Informationen findest du in der Complianz Datenschutzerklärung. LiteSpeed CacheThis site utilizes caching in order to facilitate a faster response time and better user experience. Caching potentially stores a duplicate copy of every web page that is on display on this site. All cache files are temporary, and are never accessed by any third party, except as necessary to obtain technical support from the cache plugin vendor. Cache files expire on a schedule set by the site administrator, but may easily be purged by the admin before their natural expiration, if necessary. We may use QUIC.cloud services to process & cache your data temporarily.Please see https://quic.cloud/privacy-policy/ for more details. Loco TranslateDieses Plugin sammelt keinerlei Daten von Besuchern dieser Website.Administratoren und Auditoren können die Datenschutzerklärung des Loco-Translate-Plugins einsehen."
