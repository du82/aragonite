["https://www.demokrateam.org/team"]
title = "Team » DemokraTEAM"
description = "Das DemokraTEAM besteht zu 100% aus ehrenamtlich Engagierten, die euch mit allen wichtigen Infos und Daten zum Thema Demos versorgen."
full_description = "Wir arbeiten ehrenamtlich. schaffen (digitale) Teilhabe. finanzieren uns selbstständig. sind das Demokrateam. Ehrenamtlich. Unabhängig. Demokratisch. Überparteilich Wir werben für Teilhabe an einem faktenbasierten und demokratischen Diskurs. Ehrenamtlich Wir arbeiten zu 100% ehrenamtlich. Unabhängig Wir finanzieren uns ausschließlich aus eigenen Mitteln.Über uns.Unser Ziel ist es Demokratie nahbar und erfahrbar zu machen. Wir sammeln und teilen demokratische Aktionen (Demos, Bündnisse, Lesungen, Workshops und viele mehr) aus ganz Deutschland. Jede*r soll dazu ermutigt werden, sich im Rahmen der eigenen Möglichkeiten, für eine gerechte und inklusive Gesellschaft einzusetzen. SamImpulsantrieb VivianPixel-Picassa AndreasVernetzer CosiWiderstands-Wirbelwind MichaExcel-Fee JuleKundgebungs-KünstlerinFindest du gut? Die hier auch.Über uns.Unser Ziel ist es Demokratie nahbar und erfahrbar zu machen. Wir sammeln und teilen demokratische Aktionen (Demos, Bündnisse, Lesungen, Workshops und viele mehr) aus ganz Deutschland. Jede*r soll dazu ermutigt werden, sich im Rahmen der eigenen Möglichkeiten, für eine gerechte und inklusive Gesellschaft einzusetzen.Das DemokraTEAM besteht aus ehrenamtlich Engagierten die über ganz Deutschland verteilt und vernetzt daran arbeiten, demokratische Aktionen zu bündeln und mit euch zu teilen. Unser wichtigstes Anliegen besteht darin, Demokratie nahbar und erfahrbar zu machen. Wir stehen dafür, diese aktiv zu leben und zu gestalten. Unser Ziel: Jede*n dazu zu ermutigen für eine gerechte und inklusive Gesellschaft einzutreten. Unsere Statuten"
