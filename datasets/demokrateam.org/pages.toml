title = "Demo für Demokratie » Jetzt anmelden auf demokrateam.org"
description = "Egal ob mit oder ohne Presse, du solltest deiner Demo Sichtbarkeit verleihen. Fordere am besten auch die Teilnehmenden dazu auf, Fotos oder Videos auf ihren Kanälen zu teilen."
full_description = 'Hey, Demokrat*in!Demos für Demokratie stehen für Gleichheit, Toleranz, Vielfalt und klare Kante gegen Rechts(-extreme).Diese Seite hilft dir dabei, deine eigene Demo für Demokratie anzumelden. Schritt für Schritt unterstützen wir dich, eine eigene Versammlung anzumelden und im Anschluss bei uns listen zu lassen. Vorbereitung Sharepic Anmeldung Teilen Nach der Demo VorbereitungUm deine Demo für Demokratie anmelden zu können, musst du dir ein Paar Gedanken machen und am besten einen Plan erstellen. Wenn du möchtest, kannst du dafür unsere Planungshilfe benutzen. Wer?Brauchst du Unterstützung bei deiner Demo? Frage deine Friends oder Checke unsere Bündniskarte und wende dich an Bündnisse in deiner Nähe. Denke daran: du brauchst Ordner*innen, vielleicht ja auch Redner*innen oder Künstler*innen, die dich unterstützen.Wann?Wann soll deine Demo für Demokratie stattfinden?Versammlungen müssen immer mindestens 48 Stunden vor Beginn bei der zuständigen Behörde angekündigt werden. Denke bitte auch daran, dass du etwas Zeit für die Planung und das “Bewerben” deiner Demo brauchst.Was?Ob Kundgebung, Lichtermeer oder Flashmob: deiner Kreativität sind keine Grenzen gesetzt. Überlege dir was du mit deinen Möglichkeit schnell und realistisch umsetzten kannst.Halte deinen Plan festJetzt wo du weißt was du vorhast, solltest du einen Plan festhalten. So hast du alle benötigten Infos für Behörden und Mitwirkende parat. Nutze Google Docs, dort können andere, egal ob mit oder ohne Google-Konto, dein Dokument betrachten, oder sogar direkt bearbeiten.Erstelle ein Sharepic.Um deine Demo auf Socialmedia oder anderen Plattformen zu teilen, empfehlen wir dir eine Grafik zu erstellen. Wir stellen dir Canva-Vorlagen in verschiedenen Formaten zur Verfügung. Du musst dir nur einen kostenlosen Account anlegen und kannst die Platzhalter mit deinen Infos füllen. Zu den Canvavorlagen AnmeldungJe nach dem in welchem Bundesland die Demo stattfinden soll, ist eine unterschiedliche Behörde zuständig. Oft kannst du die Demo dort direkt per (Online-)Formular anmelden. Es ist immer möglich eine formlose Anmeldung per Email zu senden.Wenn du eine Email der zuständigen Behörde hast, kannst du unseren DemoKRATOR nutzen um eine Demoanmeldung zu verschicken. Was muss ich bei einer Demo-Anmeldung angeben? Kontaktdaten der Veranstalter*in (Falls abweichend) Kontaktdaten der Versammlungsleitung Anlass der Versammlung: "Demo für Demokratie" Ort der Versammlung Datum & Uhrzeit der Versammlung Erwartete Teilnehmende Welche Angaben kann ich bei einer Demo-Anmeldung zusätzlich machen? Anzahl der Ordner*innen Geplante Hilfsmittel Anwesende Personen öffentlichen Interesses {"@context":"https:\/\/schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Was muss ich bei einer Demo-Anmeldung angeben?","acceptedAnswer":{"@type":"Answer","text":"Kontaktdaten der Veranstalter*in\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t(Falls abweichend) Kontaktdaten der Versammlungsleitung\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\tAnlass der Versammlung: \"Demo f\u00fcr Demokratie\"\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\tOrt der Versammlung\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\tDatum & Uhrzeit der Versammlung\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\tErwartete Teilnehmende"}},{"@type":"Question","name":"Welche Angaben kann ich bei einer Demo-Anmeldung zus\u00e4tzlich machen?","acceptedAnswer":{"@type":"Answer","text":"Anzahl der Ordner*innen\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\tGeplante Hilfsmittel\n\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\