title = "Event gegen Rechts in Berlin, Berlin » AfD-Verbot Jetzt: Neuen-Treffen"
description = """
Die AfD muss auf jedem erdenklichen Wege bekämpft werden. Die bundesweite Kampagne “AfD-Verbot jetzt” wirkt auf Politiker*Innen ein, den juristischen Weg vor das Bundesverfassungsgericht zu gehen. Die AfD ist eine verfassungswidrige Partei und gefährlicher denn je…Du willst dich informieren oder mitmachen?Dann komm am 6. März zum Neuentreffen!
