["https://www.demokrateam.org/aktionen/8-maerz-internationaler-queerfeministischer-kampftag"]
title = "Demo gegen Rechts in Würzburg, Bayern » 8. März: Internationaler queerfeministischer Kampftag"
description = """
❗Wichtig: Die postende Gruppe ist nicht die Demo-Orga: Die Orga des 8. März setzt sich in Würzburg jedes Jahr aus Einzelpersonen zu einer losgelösten und temporären Gruppe zusammen. ❗Demonstration zum internationalen queerfeministischen Kamptag📍Würzburg, QR-Code-Platz
⏰ 14:00 UhrGemeinsam wollen wir in Würzburg am 08.03.2025 auf die Straße gehen um unserer Wut über das Patriarchat, Kapital und Staat Ausdruck und Kraft zu verleihen. Wir wollen am diesjährigen internationalen queerfeministischen Kampftag alle zusammen ein starkes Zeichen für FLINTA*-Rechte, körperliche und sexuelle Selbstbestimmung und die Überwindung von struktureller Gewalt setzen! Dafür nehmen wir uns gemeinsam am 8. März die Straßen Würzburgs! 💜Wir sehen uns am 8. März!
FLINTA* die kämpfen, sind FLINTA* die leben! 🔥"""
