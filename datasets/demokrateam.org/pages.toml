["https://www.demokrateam.org/aktionen/zubringerdemo-antifaschistisch-geht-nur-feministisch"]
title = "Demo gegen Rechts in Leipzig, Sachsen » Zubringerdemo: Antifaschismus geht nur FEMINISTISCH"
description = """
💜✊ANTIFASCHISMUS GEHT NUR FEMINISTISCH✊💜Wir wissen es alle: Die rechte/rechtsextreme Bewegung hat in diesen Zeiten Aufschwung wie seit den 90ern nicht mehr. Auffällig dabei ist, dass diese Bewegung zum größten Teil männlich geprägt ist.
Ein Wunder ist das nicht, wenn eben diese Bewegungen ein traditionelles Rollenbild propagieren, Schwangeren die Selbstbestimmung über den Körper absprechen wollen und stets über einen “starken, männlichen Führer” schwärmen.
Alice Weidel als ehemalige Kanzlerkandidatin ist das beste Beispiel dafür , dass ein ✨Girlboss✨noch lange nichts mit der allgemeinen Gleichstellung der Geschlechter oder der feministischen Einstellung einer Partei oder Gruppe zu tun hat.❕Es ist deswegen ganz klar, dass ein Kampf gegen Rechts auch ein Kampf im Zeichen des Feminismus ist!➡️Am 8.März ist wieder der Internationale Feministische Kampftag (auch bekannt als “Weltfrauentag”). Das @8m_leipzig veranstaltet eine große Demo und wir* organisieren einen antifaschistischen ZUBRINGER, um die Innenstadt schonmal aufzumischen!
Er startet:
📌am Willy-Brandt-Platz
13:30 Uhr
und wird einmal durch die Innenstadt zum Wilhelm-Leuschner-Platz laufen.📣Kommt zahlreich, kommt laut 📣
Alerta Alerta Antisexista!"""
full_description = "Zubringerdemo: Antifaschismus geht nur FEMINISTISCH💜✊ANTIFASCHISMUS GEHT NUR FEMINISTISCH✊💜Wir wissen es alle: Die rechte/rechtsextreme Bewegung hat in diesen Zeiten Aufschwung wie seit den 90ern nicht mehr. Auffällig dabei ist, dass diese Bewegung zum größten Teil männlich geprägt ist. Ein Wunder ist das nicht, wenn eben diese Bewegungen ein traditionelles Rollenbild propagieren, Schwangeren die Selbstbestimmung über den Körper absprechen wollen und stets über einen “starken, männlichen Führer” schwärmen. Alice Weidel als ehemalige Kanzlerkandidatin ist das beste Beispiel dafür , dass ein ✨Girlboss✨noch lange nichts mit der allgemeinen Gleichstellung der Geschlechter oder der feministischen Einstellung einer Partei oder Gruppe zu tun hat.❕Es ist deswegen ganz klar, dass ein Kampf gegen Rechts auch ein Kampf im Zeichen des Feminismus ist!➡️Am 8.März ist wieder der Internationale Feministische Kampftag (auch bekannt als “Weltfrauentag”). Das @8m_leipzig veranstaltet eine große Demo und wir* organisieren einen antifaschistischen ZUBRINGER, um die Innenstadt schonmal aufzumischen! Er startet: 📌am Willy-Brandt-Platz 13:30 Uhr und wird einmal durch die Innenstadt zum Wilhelm-Leuschner-Platz laufen.📣Kommt zahlreich, kommt laut 📣 Alerta Alerta Antisexista! Stadt:Leipzig Datum08.03.2025 Uhrzeit 13:30 Zur QuelleZur Quelle ArtenDemo StandortLeipzig, Willy-Brandt-PlatzWilly-Brandt-Platz, 04109 Leipzig Bundesland Sachsen Zur Quelle Next Prev My Position X"
