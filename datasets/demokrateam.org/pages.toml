["https://www.demokrateam.org/aktionen/aufruf-zum-8-maerz-2025-wir-kaempfen-wir-streiken-wir-leben"]
title = "Demo gegen Rechts in Stuttgart, Baden-Württemberg » Aufruf zum 8. März 2025: Wir kämpfen, wir streiken, wir leben!"
description = "Sorgearbeit, was ist das eigentlich? Ganz einfach: Po abputzen, Wäsche waschen, zuhören, Termine managen, Menschen mit Behinderungen unterstützen. Klingt alltäglich? Ist es auch! Ohne Sorgearbeit läuft gar nichts. Ob KiTa, Pflege, Sozialarbeit oder zu Hause: Diese Arbeit hält den Laden am Laufen, wird aber oft übersehen, schlecht bezahlt und hat auch sonst oft miese Arbeitsbedingungen.Aktuell laufen Tarifverhandlungen im öffentlichen Dienst. Das sind viele Berufe, die unser tägliches Leben aufrechterhalten. Zum Beispiel Erzieher:innen in städtischen Kitas oder Pfleger:innen in einem kommunalen Krankenhaus.Wir kämpfen!In diesen Berufen arbeiten vor allem Frauen und queere Personen, viele sind migrantisch. Die Forderung nach mehr Lohn? Nach mehr freien Tagen? Absolut gerechtfertigt! Schlechte Bezahlung und Arbeitsbedingungen kommen nicht von ungefähr – sie sind die Folge eines Systems, das nicht daran ausgerichtet ist, was wir brauchen sondern nach Profitlogik funktioniert.Wir kämpfen für eine andere Gesellschaft. Diese Gesellschaft muss feministisch sein, sonst ist sie nicht anders! Sorgearbeit muss als zentrale gesellschaftliche Aufgabe anerkannt werden – und das gilt nicht nur für die bezahlte, sondern auch für all die unbezahlte Sorgearbeit, die jede*r von uns übernimmt. Der Kapitalismus profitiert von der Arbeit die wir un(ter)bezahlt leisten. Wir wollen uns nicht weiter für die Profite einiger weniger abmühen – wir wollen eine Gesellschaft, in der Zeit für ein gutes Leben ist und in der Sorgearbeit gemeinsam organisiert wird.Wir streiken!Wir solidarisieren uns mit allen, die für bessere Bezahlung kämpfen – und fordern mehr: Lasst uns zusammenstehen statt allein zu kämpfen!Ob bezahlt, unbezahlt, mit oder ohne Vertrag – uns eint, dass unsere Arbeit ohne Wertschätzung bleibt, obwohl ohne uns gar nichts funktionieren würde. Überfüllte Kitas, unbezahlbare Mieten, Missstände in Pflege und Gesundheit – was macht die Politik? Sie lenkt mit rechter Hetze von den wirklichen Problemen ab und versucht uns gegeneinander aufzubringen. Die Politik spart im sozialen Bereich. Zeitgleich steckt sie Milliarden in Aufrüstung und Kriege, die weltweit Leid verursachen.Das lassen wir nicht weiter zu!Wir leben!Es reicht! Wir schließen uns zusammen! Gemeinsam gehen wir auf die Straße für gerechten Lohn und gute Arbeitsbedingungen. Gemeinsam kämpfen wir für ein Ende der patriarchalen und kapitalistischen Unterdrückung, gegen Krieg und Faschismus. Diese Kämpfe führen wir nicht alleine, sondern gemeinsam mit Frauen und queeren Menschen weltweit.Das gibt uns Kraft und Mut: Für eine Gesellschaft, in der Zeit für ein gutes Leben ist!"
