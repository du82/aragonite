title = "Demo gegen Rechts in Potsdam, Brandenburg » Der Kampf geht weiter! Raus zum queerfeministischen Kampftag!"
description = "Wir haben die jahrtausendealte Last des Patriarchats satt!Faschist*innen und Konservative greifen seit Jahren unsere Rechte an – für viele von uns eine existenzielle Bedrohung. Und diese bleibt, unabhängig vom Ausgang der Wahl.Wir kämpfen IMMER NOCH gegen sexualisierte Gewalt, Femizide, Diskriminierung von Trans, Inter und Non-Binären Personen, finanzielle Abhängigkeit, unbezahlte Care-Arbeit und das Fehlen von körperlicher Selbstbestimmung.Am 8. März schaffen wir Raum:Raum, um Wut rauszuschreien, um Verbündete zu treffen, um uns über Macker auszukotzen, zu tanzen und zu empowern und keine Person mit der Angst vor der Zukunft allein zu lassen.Wir bleiben laut und machen Rabatz – jetzt erst Recht!"
