description = "Feministischer Kampf heißt Klassenkampf!Also alle raus am 8. März um gemeinsam mit den feministaskoblenz für Gleichberechtigung, Freiheit und ein Selbstbestimmtes Leben auf die Straße zu gehen!Schließt euch an und kommt am 8. März um 17 Uhr zum Schüllerplatz nach Lützel. Dort wird die Demo nach einer Auftaktkundgebung starten und über die Balduinbrücke zum Zentralplatz für eine Zwischenkundgebung ziehen. Von dort aus geht es weiter zum Münzplatz, wo es eine Abschlusskundgebung mit anschließendem Kunstprojekt und Küfa geben wird.In Zeiten des Rechtsruck, der durch die gesamte Gesellschaft geht, wird es um so wichtiger für feministische Rechte laut zu sein. Deshalb lasst uns zusammen laut sein unter dem Motto: “Each for equal: Kämpfen – Befreien – Leben”.Antifaschistisch und feministisch kämpfen für eine Zukunft ohne Patriarchat und Kapitalismus!"
