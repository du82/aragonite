["https://www.demokrateam.org/aktionen/am-frauenkampftag-gegen-patriarchat-und-afd-fruehjahrsempfang-auf-die-strasse"]
title = "Demo gegen Rechts in Augsburg, Bayern » Am Frauenkampftag! Gegen Patriarchat und AfD-Frühjahrsempfang auf die Straße!"
description = """
Am Frauenkampftag gegen AfD und Patriarchat!
Einer Partei, die für Sozialabbau und Krieg steht und sich als parlamentarischer Arm einer faschistischen Bewegung ausgerechnet am 8. März in der Kongresshalle in Augsburg trifft, werden wir kämpferisch und entschlossen begegnen! Dass sich die AfD genau diesen Tag zu Nutze macht, ist mit Sicherheit kein Zufall.Der 8. März ist Frauenkampftag, ein Tag, an dem Frauen weltweit ihre Wut über das Patriarchat auf die Straßen tragen. Die Zahlen patriarchaler Gewalt und Übergriffe, ob im häuslichen Umfeld oder auf offener Straße, steigen stetig, und nahezu jeden Tag gibt es einen Femizid in Deutschland. Dass eben jene so sexistische Partei diesen wichtigen Tag für ihre Hetze nutzt, ist für uns nicht hinnehmbar. Die AfD unterdrückt mit ihrer Politik Frauen und queere Personen, nimmt ihnen ihre Selbstbestimmung und trägt mit ihrer Hetze maßgeblich dazu bei, dass gewalttätige Übergriffe auf Veranstaltungen wie den CSD auf der Tagesordnung stehen. Stellen wir uns also entschlossen am 8. März gegen die AfD, gegen ihre rechte Hetze und gegen ihre sexistische Propaganda.Die Bundestagswahl hat es uns deutlich gezeigt: Der Rechtsruck lässt sich nicht abwählen!Die bürgerlichen Parteien rücken gemeinsam mit der AfD weiter und weiter nach rechts und setzen deren rassistische Politik bereits um, ob nun mit oder ohne “Bauchschmerzen”. Zwei Kreuzchen auf einem Zettel werden das Problem nicht lösen, nur die selbstbestimmte und konsequente antifaschistische Organisierung im Betrieb, auf der Straße und im Viertel bringt uns weiter!Also schließt euch uns an, lasst uns gemeinsam auf die Straße gehen!Am 08.03.2025 um 15:30 Uhr am Ulrichsplatz. Und ab 16:30 Uhr vor der Kongresshalle!Alle zusammen gegen den Faschismus!"""
full_description = "Am Frauenkampftag! Gegen Patriarchat und AfD-Frühjahrsempfang auf die Straße!Am Frauenkampftag gegen AfD und Patriarchat! Einer Partei, die für Sozialabbau und Krieg steht und sich als parlamentarischer Arm einer faschistischen Bewegung ausgerechnet am 8. März in der Kongresshalle in Augsburg trifft, werden wir kämpferisch und entschlossen begegnen! Dass sich die AfD genau diesen Tag zu Nutze macht, ist mit Sicherheit kein Zufall.Der 8. März ist Frauenkampftag, ein Tag, an dem Frauen weltweit ihre Wut über das Patriarchat auf die Straßen tragen. Die Zahlen patriarchaler Gewalt und Übergriffe, ob im häuslichen Umfeld oder auf offener Straße, steigen stetig, und nahezu jeden Tag gibt es einen Femizid in Deutschland. Dass eben jene so sexistische Partei diesen wichtigen Tag für ihre Hetze nutzt, ist für uns nicht hinnehmbar. Die AfD unterdrückt mit ihrer Politik Frauen und queere Personen, nimmt ihnen ihre Selbstbestimmung und trägt mit ihrer Hetze maßgeblich dazu bei, dass gewalttätige Übergriffe auf Veranstaltungen wie den CSD auf der Tagesordnung stehen. Stellen wir uns also entschlossen am 8. März gegen die AfD, gegen ihre rechte Hetze und gegen ihre sexistische Propaganda.Die Bundestagswahl hat es uns deutlich gezeigt: Der Rechtsruck lässt sich nicht abwählen!Die bürgerlichen Parteien rücken gemeinsam mit der AfD weiter und weiter nach rechts und setzen deren rassistische Politik bereits um, ob nun mit oder ohne “Bauchschmerzen”. Zwei Kreuzchen auf einem Zettel werden das Problem nicht lösen, nur die selbstbestimmte und konsequente antifaschistische Organisierung im Betrieb, auf der Straße und im Viertel bringt uns weiter!Also schließt euch uns an, lasst uns gemeinsam auf die Straße gehen!Am 08.03.2025 um 15:30 Uhr am Ulrichsplatz. Und ab 16:30 Uhr vor der Kongresshalle!Alle zusammen gegen den Faschismus! Stadt:Augsburg Datum08.03.2025 Uhrzeit 15:30 Zur QuelleZur Quelle ArtenDemo StandortAugsburg, UlrichsplatzUlrichsplatz, 86150 Augsburg Bundesland Bayern Zur Quelle Next Prev My Position X"
