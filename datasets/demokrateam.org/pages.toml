["https://www.demokrateam.org/aktionen/kreativer-widerstand-gegen-rechts"]
title = "Demo gegen Rechts in Hamburg, Hamburg » Kreativer Widerstand gegen Rechts!"
description = """
Jeden 3. Mittwoch im Monat treffen wir uns um 17:00 Uhr zu einem „Spaziergang“ gegenüber der Jüthornstrasse 104, im Marienthaler Gehölz.Unser Ziel ist es Präsenz zu zeigen, ihnen zeigen, dass sie in unser Nachbarschaft, unserer Stadt unerwünscht sind!Die Hamburger Burschenschaft Germania (HB Germania) ist eine rechtsextreme, pflichtschlagende und farbentragende Studentenverbindung in Hamburg. 1919 gegründet und ist auch Mitglied der Deutschen Burschenschaft (DB).Aus ihrer Ablehnung der Demokratie und ihrer Befürwortung des Führerprinzips machen viele Germanen keinen Hehl!Die Verbindung wird seit 2014 jährlich im Verfassungsschutzbericht aufgeführt. „Diktion und Tenor ihrer Veröffentlichungen unterscheiden sich kaum von Veröffentlichungen rechtsextremistischer Parteien und Gruppierungen.https://www.instagram.com/kreativerwiderstandgegenrechts/https://www.facebook.com/groups/1105869343716969Kontakt: kreativer-widerstand-gegen-rechts@gmx.deMein Antrieb mit den Worten von Hape Kerkeling untermauernd:
„Ich habe manchmal das Gefühl, dass wir in einer ähnlichen Zeit leben wie in der Weimarer Republik. Mir kommt es so vor, als wären wir am Vorabend von Etwas, das ich nicht miterleben möchte.“"""
