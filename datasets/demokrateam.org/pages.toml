full_description = "Heraus zum 08. März – Demo zum internationalen feministischen KampftagAlle gemeinsam HERAUS ZUM 8. MÄRZ!Am 8. März, dem Internationalen Feministischen Kampftag, gehen wir auch in diesem Jahr auf die Straße! Seit über 100 Jahren kämpfen wir als Teil der Arbeiter:innenbewegung weltweit an diesem Tag für unsere Rechte und unsere Befreiung. Dieser Kampf ist aktueller denn je, denn die rasanten Rechtsentwicklungen der letzten Jahre zeigen deutlich: Die Angriffe auf uns wachsen!Wir fordern:Mehr Hilfsangebote und Beratungsstellen, mehr Kita-Plätze, mehr Frauenhäuser und die vollständige Umsetzung der Istanbul-Konvention!Körperliche Selbstbestimmung: Die Entkriminalisierung von Schwangerschaftsabbrüchen – weg mit §218! Kostenloser Zugang zu Verhütungs- und Menstruationsprodukten sowie zu Mitteln zur Unterstützung der Transition!Ein kostenloses, umfangreiches und öffentliches Gesundheitssystem für alle!Finanzielle Sicherheit und Schutz vor Altersarmut – gleicher Lohn für gleiche Arbeit und eine Rente, die zum Leben reicht!Sichere und inklusive Lebensräume für Lesben, bisexuelle, trans Frauen und genderqueere Menschen!Bezahlbarer und ausreichender Wohnraum für alle!Ein Ende der Einschränkungen des Asylrechts und ein Ehegatten-unabhängiges Aufenthaltsrecht!Unterzeichner*innen:AntiFeminizidNetzwerk Hamburg Amnesty International Uni Hamburg Bündnis Abtreibung Entkriminalisieren DIDF Hamburg DIDF Jugend Die Linke Landesverband Hamburg Falken Hamburg FAR Hamburg FC St. Pauli Handball Grüne Jugend Hamburg IJV – Internationaler Jugendverein IL – interventionistische Linke Intervention e.V. Junge Linke Eimsbüttel junge BAU Hamburg Justopia Verein für intersektional feministische Zusammenarbeit e.V. LAG Feminismus der Linken Hamburg Medical Students for Choice Hamburg Migrantinnen Bund Hamburg Netzwerkstelle Lesben* in Hamburg pia (profamilia in action) Rojbin kurdischer Frauenrat ROSA – international socialist feminists Hamburg Ultraviolett Wer Hat Der GibtMehr Infos bei @fstreikhamburgPreisinformation:Kostenlos, aber nicht umsonst! Stadt:Hamburg Datum08.03.2025 Uhrzeit 13:00 Zur QuelleZur Quelle ArtenDemo StandortHamburg, RathausRathausmarkt 1, 20095 Hamburg Bundesland Hamburg Zur Quelle Next Prev My Position X"
