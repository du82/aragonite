e":{"type":"any","status":!0,"conditions":[{"field":"checkbox","value":"Nein","operator":"="}]},"section_break-22_4":{"type":"all","status":!0,"conditions":[{"field":"","value":"","operator":""}]},"section_break-22_5":{"type":"all","status":!0,"conditions":[{"field":"","value":"","operator":""}]},"section_break-22_7":{"type":"all","status":!0,"conditions":[{"field":"post_title","value":"","operator":"="},{"field":"post_title","value":"Demo f\u00fcr Demokratie","operator":"!="}]},"section_break-22_8":{"type":"all","status":!0,"conditions":[{"field":"post_content","value":"","operator":"="},{"field":"post_title","value":"","operator":"!="}]},"section_break-22_9":{"type":"all","status":!0,"conditions":[{"field":"input_radio","value":"Ja","operator":"="}]},"post_content":{"type":"any","status":!0,"conditions":[{"field":"post_title","value":"","operator":"!="}]},"input_radio":{"type":"all","status":!0,"conditions":[{"field":"post_title","value":"","operator":"!="},{"field":"post_content","value":"","operator":"!="}]},"featured_image":{"type":"all","status":!0,"conditions":[{"field":"input_radio","value":"Ja","operator":"="}]},"section_break-22_11":{"type":"any","status":!0,"conditions":[{"field":"checkbox_1","value":"Ja","operator":"="}]},"behoerdeEmail":{"type":"any","status":!0,"conditions":[{"field":"checkbox_1","value":"Ja","operator":"="}]}}} Teile deine Demo.Sobald die Zuständige Behörde deine Demo genehmigt hat kann es losgehen: Erstelle Storys oder Posts auf Instagram, Facebook, BlueSky, WhatsApp, Snapchat, TikTok oder anderen Plattformen. Du solltest dennoch auch die Demokrat*innen erreichen, die du nicht kennst: Melde dich bei lokalen Pressevertretern, Parteien oder Unternehmen und sorge dafür, dass die schweigende Mehrheit laut wird!Nach der Demo, ist vor der Demo.Aber natürlich gibt es auch hier ein zwei Dinge, die du beachten solltest. Teilen, Teilen, Teilen. Egal ob mit oder ohne Presse, du solltest deiner Demo Sichtbarkeit verleihen. Fordere am besten auch die Teilnehmenden dazu auf, Fotos oder Videos auf ihren Kanälen zu teilen. Fakten schaffen. “Mit einer Protestwelle hat das nichts zu tun” DOCH! Zahlen schaffen Fakten: Frage also die Polizei nach einer Teilnehmendenzahl und lass dir diese schriftlich bestätigen. Nutze den DemoTRACKER um unsere Statistik zu vervollständigen. Engagieren. Demos sind das was wir gerade brauchen. Für einen nachhaltigen Wandel müssen wir anfangen Demokratie zu l(i)eben. Überleg dir, was das für dich bedeutet. Auf unserer Bündniskarte findest du dafür bestimmt ein Bündnis in deiner Nähe.'
