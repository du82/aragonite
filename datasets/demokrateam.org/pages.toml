["https://www.demokrateam.org/aktionen/feministisch-kaempfen-feminismus-bedeutet-antifaschismus-feministischer-kampftag"]
title = "Demo gegen Rechts in Frankfurt (Main), Hessen » Feministisch kämpfen: Feminismus bedeutet Antifaschismus - Feministischer Kampftag"
description = "Feministisch kämpfen: Feminismus bedeutet AntifaschismusFuck! Fuck! Fuck! Die Kacke ist am Dampfen. Die rechtsextreme AfD hat gute Aussichten, bei den Wahlen im Februar 20% der Stimmen zu bekommen. Die CDU bezeichnet sich selbst als AfD „in demokratisch“. Der gesellschaftliche Rechtsruck hat schwindelerregend an Fahrt aufgenommen.Dabei greifen Rechte innerhalb und außerhalb der Parlamente – egal ob mit und ohne demokratischer Selbstbezeichnung –  gezielt feministische Errungenschaften und Grundrechte an.Die Entkriminalisierung von Schwangerschaftsabbrüchen? Pustekuchen. Das Selbstbestimmungsgesetz? Schnee von gestern. Das Gewalthilfegesetz? Ihr ahnt es: Wenn wir die AfD und ihre Steigbügelhalter nicht aufhalten, können wir das alles vergessen. Antifeminismus ist nicht nur unter der Hand ein Teil des rechten Programms, sondern ein Kernstück ihrer menschenfeindlichen Ideologien. Offen und völlig ohne Scham stellen sie Gleichberechtigung, sexuelle Selbstbestimmung und geschlechtliche Vielfalt in Frage.Gerade jetzt ist es wichtiger denn je zu verstehen, dass Antifeminismus und Faschismus, Hass gegen Emanzipation und Menschenfeindlichkeit Hand in Hand gehen. Der Antifeminismus vereint sonst zerstrittene Akteur*innen. Antifeministische und faschistische Positionen dürfen aber nicht weiter normalisiert werden!Es ist an der Zeit zu kämpfen! Für eine Welt ohne Gewalt, ohne Ausbeutung, ohne Hass. Für eine freie Welt und eine feministische Utopie.Für eine Zukunft, die Kinder und Jugendliche nach ihren Bedürfnissen und Wünschen mitgestalten. Dafür, dass junge Menschen überhaupt eine Zukunft haben. Und natürlich ist emanzipatorischer Feminismus der Gegenentwurf zum Faschismus, doch aktuell bedeutet unser Kampf auch, unsere bisherigen Errungenschaften zu verteidigen. Und zwar mit aller Kraft und mit allen Mitteln!Lasst uns am feministischen Kampftag gemeinsam ein starkes, ein lautes und ein wütendes Zeichen setzen. Feminismus bedeutet Antifaschismus  – und unser Kampf für eine gerechte, feministische und solidarische Gesellschaft kennt keine Kompromisse!Kommt zum feministischen Kampftag am 08.03.25, um 14 Uhr auf den Römer!Der vordere Teil der Demo wird FLINTA* only sein, für die jüngeren wird es einen Kinderblock geben."
