["https://www.demokrateam.org/aktionen/internationalistischer-block"]
title = "Demo gegen Rechts in Kiel, Nordrhein-Westfalen » Internationalistischer Block"
description = """
🗣 Hoch die internationale Solidarität am 8. März!
Wir laden euch ein, mit uns im Internationalistischen Block zu laufen und am Feministischen Kampftag eine klare Haltung gegen Patriarchat und Kapital zu zeigen!Als solidarische Feminist*innen fordern wir:Überall auf der Welt kämpfen Frauen und queere Menschen für ihre Rechte, gegen Gewalt und Unterdrückung und für solidarische Gesellschaftsentwürfe.
Frauen müssen in Kriegsgebieten unter schlimmsten Umständen Kinder gebären, Alte pflegen und sind bedroht von sexualisierter Gewalt.
Queeren Menschen wird ihre Existenz abgesprochen und strukturelle Hilfesysteme gar nicht erst aufgebaut.Auch hier in Deutschland sind Frauen und queere Menschen tagtäglich ungerechter Behandlung, Missbrauch und Gewalt ausgesetzt. Dazu kommt, dass immer noch von uns erwartet wird, für weniger oder gar kein Geld die Gesellschaft durch Sorge- und Pflegearbeit am Laufen zu halten.❗️Wir wollen, dass diese Arbeit von allen übernommen wird und die Gesellschaft sich nicht an Profiten, sondern an Bedürfnissen orientiert!
❗️Wir wollen keine Quoten-Frauen in Führungspositionen, sondern dass niemand über andere Macht ausübt und wir nicht in ständiger Angst vor Gewalt leben müssen!
❗️Wir wollen, dass Migrant*innen nicht ausgebeutet und abgeschoben werden, sondern gleiche Rechte erhalten!Wir sehen uns am 8. März auf der Straße!"""
