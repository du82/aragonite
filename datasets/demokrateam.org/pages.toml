title = "Demo gegen Rechts in Duisburg, Nordrhein-Westfalen » 8. März - Jetzt erst recht!"
description = "„Jetzt erst recht! – Feministisch kämpfen international“ ist das diesjährige Motto für den feministischen Kampftag am 8. März.Trotz der langen Geschichte des “internationalen Frauentags” und den damit einhergehenden bisherigen Erfolgen die Frauen bereits für uns erkämpft haben, ist die Lage für unter dem Patriarchat leidende Personen wie Frauen, inter-, nichtbinäre, trans- und agender Personen weiterhin nicht annehmbar und in Anbetracht der bevorstehenden Bundestagswahl wird sie es wohl bleiben. Noch immer werden Wir auf Grund unseres Geschlechts schlechter bezahlt, diskriminiert, unterdrückt und ermordet. Wir geben nicht auf, wir stellen uns dagegen! Wir kämpfen gemeinsam für eine gleichberechtigte, menschenfreundliche, bunte und solidarische Zukunft! Kommt zahlreich am 8. März um 16 Uhr auf den Dellplatz, um für eine bessere Welt einzustehen, um wütend zu sein und um zu sehen, dass ihr nicht alleine mit euren Gefühlen seid! Die Demo endet im Stapeltor, wo im Anschluss ein Demo-Ausklang mit KüFa, einem Open Mic und einem Lagerfeuer stattfinden wird."
