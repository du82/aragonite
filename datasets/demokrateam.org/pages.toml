title = "Demo gegen Rechts in Berlin, Berlin » Demonstration zum internationalen Frauen*Kampftag - feministisch solidarisch gewerkschaftlich"
description = """
🌸✊ Auch in diesem Jahr rufen ein breites feministisches, stadtpolitisches und gewerkschaftliches Bündnis zum Internationalen Frauen*tag auf! Wir gehen gemeinsam auf die Straße für eine gerechte und friedliche Welt, in der alle Menschen – unabhängig von Geschlecht, Herkunft, sexueller Orientierung oder anderen Zuschreibungen – gleiche Chancen und Rechte haben. 💜Seit Jahrzehnten steht die Daseinsvorsorge unter Druck, und eine neue Kürzungswelle droht uns. Bildung, Mobilität, Gesundheitsversorgung und soziale Infrastruktur werden auf Kosten unserer Zukunft immer weiter beschnitten. Das können und werden wir nicht hinnehmen! 🚨Deshalb: Sei dabei und kämpfe mit uns! 💪📅 Wann: 8. März 2025, 12:30 Uhr
📍 Wo: Oranienplatz
🗣️ Abschlusskundgebung: vor dem Roten RathausKommt mit Kolleg*innen, Freund*innen, Nachbar*innen und Familie und zeigt, dass wir für eine bessere Zukunft eintreten – jetzt ist der Moment für Veränderung!"""
