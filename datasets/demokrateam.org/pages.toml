title = "Online-Event gegen Rechts in Online, Berlin » Magnus Hirschfeld - Ein Pionier der Sexualwissenschaft und Vorkämpfer der Homosexuellenrechte - Anmeldung erforderlich"
description = """
Knapp 40 Jahre nach der Gründung des Wissenschaftlich-Humanistischen Kommittees (WHK) und gut zwei Jahre nach der Zerstörung dessen durch die Nationalsozialisten verstarb der deutsche Sexualwissenschaftler Magnus Hirschfeld im französischen Exil. Anläßlich seines 90. Todestages gilt es das Wirken und das Erbe des bedeutsamen Arztes, dem wir u.a. den Begriff der Travestie verdanken, zu reflektieren und zu würdigen. Sein Schaffen veränderte die Sichtweise auf Homosexualität grundlegend – und bereitete der Normalisierung von Homosexualität in unserer Gesellschaft den Weg. Der Kursleiter, Dr. Maurice Schuhmann, ist promovierter Politikwissenschaftler mit Schwerpunkt auf politischer Philosophie.Dieser Kurs findet online statt.Bitte registrieren Sie sich vorab als Teilnehmer*in unter www.vhs.cloud.
