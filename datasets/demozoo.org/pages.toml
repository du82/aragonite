["https://demozoo.org"]
title = "Demozoo"
description = """
MountainBytes 2025 is over! The Swiss demo event of the year took place on February 14th to 16th and leaves us with many productions worth watching from four main competitions and the specials OHP demo competition and the innovative 3D graphics competition (with models included in the digital performance as part of the Saturday evening live act).
MountainBytes 2025 on Demozoo / scene.org
Video captures of the whole event including all compos and specials are to appear on YouTube sooner or later."""
full_description = '''MountainBytes 2025 is over! The Swiss demo event of the year took place on February 14th to 16th and leaves us with many productions worth watching from four main competitions and the specials OHP demo competition and the innovative 3D graphics competition (with models included in the digital performance as part of the Saturday evening live act). Video captures of the whole event including all compos and specials are to appear on YouTube sooner or later. The MountainBytes 2025 partysystem is live and available for remote entry uploads! Get an access key by contacting MountainBytes organizing by Email or Discord and register & upload at party.mountainbytes.ch. This is an upload facility for non-visitors only! For everyone going to the party in Cham/Switzerland on the next weekend, please do not apply for a key yet as you'll get a unique, lovingly handcrafted access key at the MountainBytes welcome desk. And with that, you are also able to submit suggestions to our jury here on Demozoo and Pouet for your favourite demoscene productions of 2024 - just head over to any eligible production and follow the "Recommend this production for The Meteoriks 2025" link. Inércia 2024 is over! The Portuguese event that took place on 6-8 December 2024 featured talks, music acts, a new world record on simultaneous live shader coding and many quality entries in their 4 showcases and 2 competitions. Transmission64 2024 is over! The online C64 demo party that took place on November 23rd 2024 featured talks (TeensyROM, 45 years of PETSCII in 21 minutes), music acts (Shogoon and friends 3, Vincenzo and Press Play on Tape) plus many quality entries in 7 competitions. Send an email to keys@transmission64.com to receive your access key and then head on over to https://vote.transmission64.com/ to upload your entries. Categories are Demo, 4k, Graphics, Screen Fader, BASIC oneliner, PETSCII and Music. Transmission64 organizing is very happy about your support! Deadline for your entries is Nov 22nd, 16:00 CET.'''
