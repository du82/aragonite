["https://demozoo.org/forums/260"]
title = "Demoscene News Report - Discussions - Demozoo"
full_description = "Been doing these video reports on what's new in the demoscene, currently a new one comes out every Wednesday. It's a way to keep in touch with what has been announced and released, and maybe expose the demoscene a bit more to newcomers, if you like the format you can follow the playlist is here: https://www.youtube.com/playlist?list=PLjxyPjW-DeNVnrA1TDZ_S7IG3PS9UE-yo I'll also drop the links listed on this thread regularly from now on, for reference / searchability sake. Evoke after party pagehttps://2024.evoke.eu/party/after-party-roundup/https://demozoo.org/parties/4710/https://marincomics.com/evoke-2024.html Procedural Geometry on the Gpuhttps://www.twitch.tv/videos/2226589370?t=02h02m20shttps://www.twitch.tv/videos/2226684985 Monday Night Bytes 26 August 2024https://livecode.demozoo.org/event/2024_08_26_byte_jam_monday_night_bytes.html#mc NSA Releases Internal 1982 Lecture by Computing Pioneer Rear Admiral Grace Hopperhttps://www.youtube.com/watch?v=_bP14OzIJWI FairLight TV #108, Amiga Revival interview with John Hertellhttps://www.youtube.com/watch?v=MZO6B4D-b34 PICO-1K Jam 2024 Welcome by Liquidreamhttps://demozoo.org/productions/356536/https://itch.io/jam/pico-1k-2024 Nah-Kolor AGA intro's Pack #1https://demozoo.org/productions/355749/https://demozoo.org/productions/355750/ Monday Night Bytes 2 September 2024https://livecode.demozoo.org/event/2024_09_02_shader_jam_monday_night_bytes.html#mc SLAY Radio - Pumpkin spice latte? with ziona and Slaygon [#2400]https://www.youtube.com/watch?v=BbDG5zsvYNk&ab_channel=SLAYRadio A great initiative! I watch these videos occasionaly and it's a great place to get informed since everything is packed together! Keep up the good work! :) BassoonTracker 0.5 releasedhttps://github.com/steffest/bassoontrackerhttps://www.youtube.com/watch?v=HXjLleDDY-g Firefox & Tip - Hyperbased (Hoffmans Deconstruction)https://www.youtube.com/watch?v=ElKdRCaKAZA&ab_channel=Hoffman Ericade pagadata radioshowhttps://www.youtube.com/watch?v=t-sCrLvkHxkhttps://www.youtube.com/watch?v=N9k_OvpYa2A"
