["https://www.deque.com/accessibility-statement"]
title = "Deque Accessibility Statement"
description = "Deque is committed to our mission of digital equality and is dedicated to providing an excellent user experience for everyone."
full_description = "How Can We Help? We welcome any comments, questions, or feedback on our site. If you notice aspects of our site that aren’t working for you or your assistive technology, please let us know. Call us at +1 703-225-0380 Email us: marketing@deque.com Deque is Committed to Digital Accessibility: Deque is committed to our mission of digital equality and is dedicated to providing an excellent user experience for everyone. Our website is structured in a way that allows those of all abilities to easily and quickly find the information they need. Ongoing Efforts to Ensure Accessible Content: Deque uses the Web Content Accessibility Guidelines (WCAG) version 2.2 , EN 301 549, and Section 508 as guiding principles. As we develop new pages and functionality, the principles of accessible design and development are an integral part of conception and realization. We continually test content and features for WCAG 2.2 Level AA, EN 301 549, and Section 508 compliance and remediate any issues to ensure we meet or exceed the standards. Testing of our digital content is performed by our accessibility experts using Deque-developed automated testing software (based on the axe® rules library), screen readers, a color contrast analyzer, keyboard-only navigation techniques, and a variety of bookmarklets. Summary of Accessibility Features All images and other non-text elements have alternative text associated with them Navigational aids are provided on all pages. Skip navigation links have been incorporated to facilitate keyboard navigation and to bypass groups of links on a page and jump directly to main content The title attribute has been used to make linked text more meaningful or to indicate if the link opens a new browser window Structural markup to indicate headings and lists has been provided to aid in page comprehension Forms are associated with labels and instructions on filling in forms are available to screen reader users Table navigation instructions are provided, and all data cells are associated with their headers Product VPATs Access Deque Software conformance reports in the table below. Each follows the Voluntary Product Accessibility Template (VPAT). Software or feature name Software version tested Standard tested axe Account Portal (PDF) v4.134.1 WCAG 2.2 A/AA, Section 508, EN 301 549 axe Auditor (PDF) v2.16 WCAG 2.1 A/AA axe Developer Hub (PDF) v4.130.2 WCAG 2.2 A/AA, Section 508, EN 301 549 axe DevTools Mobile_Dashboard(PDF) v1.7.0 WCAG 2.2 A/AA, Section 508, EN 301 549 axe DevTools Mobile Analyzer (PDF) v1.4 WCAG 2.2 A/AA, Section 508, EN 301 549 axe DevTools Pro Extension (PDF) v4.96.1 WCAG 2.2 A/AA, Section 508, EN 301 549 axe for Designers_Plugin (PDF) v2024.1.1 WCAG 2.2 A/AA, Section 508, EN 301 549 axe for Designers_Web Interface (PDF) NA WCAG 2.2 A/AA, Section 508, EN 301 549 axe Monitor (PDF) v8.0 WCAG 2.2 A/AA, Section 508, EN 301 549 axe Reports (PDF) v2.0.3 WCAG 2.2 A/AA, Section 508, EN 301 549 Cauldron Pattern Library (PDF) v6.2.0 WCAG 2.2 A/AA, Section 508, EN 301 549 Deque University (PDF) Production WCAG 2.1 A/AA Product Docs Site Production WCAG 2.1 A/AA SaaS Status Site (PDF) Production WCAG 2.1 A/AA Deque Help Center (PDF) Production WCAG 2.2 A/AA, Section 508, EN 301 549 Last updated: October 1st, 2024"
