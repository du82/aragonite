["https://www.deque.com/ada"]
title = "Americans with Disabilities Act (ADA) & Web Accessibility | Deque"
description = "The ADA is a law established to protect the rights of people with disabilities. Learn more about how this applies to website accessibility today."
full_description = "1973 The Rehabilitation Act prohibits discrimination based on disability in federally-funded programs Civil Rights Law ADA The Americans with Disabilities Act is a United States law established to protect the rights of people with disabilities including their right to employment, public services, and public accommodations. It applies to US citizens and organizations. Federal Law Section 508 Section 508 of the Rehabilitation Act of 1973 is a law that requires the Federal Government to provide access to its Information and Communication Technology (ICT) to people with disabilities. This applies to US government agencies and citizens. Widely-adopted guidelines WCAG WCAG, a.k.a. the Web Content Accessibility Guidelines, are the technical guidelines created by the World Wide Web Consortium (W3C) for accessible web-based content. WCAG is the global standard adopted by the accessibility community."
