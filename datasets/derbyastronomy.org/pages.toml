["https://derbyastronomy.org/AriesMayAug06SocietyNews.htm"]
title = "Aries May-August 2006 - Society News"
full_description = "Aries The Journal of the Derby and District Astronomical Society May - August 2006 [Contents] Society News Reports by Anthony Southwell January 6th 2006 Meeting - Astro-imaging DDAS members Chris Newsome and Adrian Brown presented a very enlightening and enjoyable talk on astrophotography. The talk featured some quite visually stunning astronomical images taken by both Chris and Adrian. Chris was first up and he described how you can take some quite useful images with nothing more than a modestly priced digital camera, everything form either a standard small 'point-and-click' camera to a digital SLR that can cost about a couple of hundred pounds. The images that Chris managed to take with such a set up were very impressive. Also, being that Chris is a passionate lunar photographer, he showed us a number of images of the Moon, taken by himself with digital cameras and dedicated CCDs attached to a telescope. The detail that Chris had managed to bring out in the lunar surface was very impressive. We all look forward to seeing more of Chris' efforts. Many of Chris' Moon pictures can be seen here. Then it was Adrian's turn. Adrian showed us how he took his quite staggering deep sky images. Adrian�s images were produced using a dedicated CCD device attached to a telescope and the resulting images were then image processed to bring out the fine details of the object being imaged. Chris uses similar image processing techniques to produce his lunar pictures. Adrian�s images of nebulae, galaxies, star clusters were quite amazing, and were of such a high standard that they could have easily graced the pages of magazines like Astronomy and Sky & Telescope. Adrian displayed one image that took everyone�s breath away - a picture of the Horse Head Nebula in Orion. The colour of the nebula and the detail imaged within the nebula itself were quite remarkable. It really demonstrated how far amateur astrophotography has come on in the past 10 to 15 years. Adrian managed to image the fine structure within this nebula, and I have never seen the Horse Head look that good in an amateur image before, quite remarkable indeed. The Society as a whole is also looking forward to seeing more examples of Adrian�s work and many of his pictures grace the pages of our gallery."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesMayAug06SocietyNews.htm"
