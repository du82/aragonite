["https://derbyastronomy.org/AriesMayAug06StephenHawking.htm"]
title = "Aries May-August 2006 - The Dennis Sciama Memorial Lecture - A Report"
full_description = "Aries The Journal of the Derby and District Astronomical Society May - August 2006 [Contents] The Dennis Sciama Memorial Lecture - A Report By Graham Ensor (with thanks to Neil Clifford at Oxford for his help) On Friday 24th February 2006 I was very fortunate to be given a ticket to the Third Dennis Sciama Memorial Lecture given by Stephen Hawking at the University of Oxford Physics Department. Tickets were in much demand so I was very lucky to be able to represent DDAS at the event, courtesy of Neil Clifford, Starlink Systems Manager. The connection with Dennis Sciama is explained here. I arrived in Oxford around mid morning in order to make the most of the day. I toured around, visiting the Museum of Science, took in an exhibition at the Ashmolean (a microretrospective of Tom Phillips artwork) and Modern Art Oxford, just managed to fit in a quick look at the meteorites in the University Museum and Pitt Rivers Collection before heading for the Astrophysics department. Neil took me up through the building to the roof and the new observatory dome, which was only finished this year. Following loss of viewing due to encroaching buildings and with a lack of proximity to the Sub-Department in the Denys Wilkinson Building (DWB), it was decided to move the telescope to a new and purpose built observatory on the roof of DWB on Keble Road. The Philip Wetton Telescope (PWT), the first new telescope in Oxford for 30 years, was originally installed in December 1996 in the South Tower dome of the former University Observatory and until last year provided a facility for graduates and undergraduates in the Sub-Department of Astrophysics. The telescope, a 0.4 m (16 inch) aperture Schmidt-Cassegrain by Meade Corporation of California, was presented to the University by Philip Wetton CMG FRAS. Mr Wetton, a graduate of Christ Church was, before retirement, Her Majesty's Consul General in Milan. The telescope was donated to enable students of astrophysics at Oxford to make and interpret observations of the night sky in much the same way as a professional astronomer would do. Mr Wetton also endowed the position of Philip Wetton Professor of Astrophysics, the post currently held by Professor Roger Davies who has also recently become the Chairman of the Department of Physics."
