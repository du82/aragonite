["https://derbyastronomy.org/StargazingCathedralGreen170424.htm"]
title = "Stargazing on Cathedral Green, Derby - Wednesday 17th April 2024"
full_description = "On Wednesday 17th April 2024, DDAS members, in collaboration with Derby Museums and Derby Live, put on an evening of stargazing on Cathedral Green. A number of member's telescopes were set up outside, and people got to view the sun by solar projection and also take a look at the Moon. Meanwhile we had an exhibition inside the Museum of Making, where people could chat to DDAS members about astronomy and space, view the Society's moon globe (which is signed by some of the Apollo astronauts), see our meteorite collection, several models of spacecraft, and view some static telescopes and other items of interest. We also provided a presentation on astronomy to a local Beaver's group. See our follow on event on the 9th October 2024 here."
