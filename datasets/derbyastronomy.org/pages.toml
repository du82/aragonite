["https://derbyastronomy.org/AuroralDisplay100524.htm"]
title = "Auroral Display - Friday 10th May 2024"
full_description = "On the evening of Friday 10th May 2024, a spectacular auroral display lit up the skies over the UK. Many DDAS members were quick to observe and photograph this marvel. This included a group of members who were the last to leave the DDAS 50th Anniversary Party at the Littleover Social Club in Derby that evening, who witnessed the spectacle from the club car park! What a fantastic coincidence that it occurred on that evening! For some, like Mike Lancaster, it was their first sighting of an aurora, while others could compare with previous displays. Here is a selection of DDAS members photos of this spectacle. Note that five months later another auroral display on the 10th October 2024 graced our skies."
