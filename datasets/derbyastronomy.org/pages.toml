["https://derbyastronomy.org/AriesWinter0708Editorial.htm"]
title = "Aries Winter 2007/2008 - Editorial"
full_description = "Aries The Journal of the Derby and District Astronomical Society Winter 2007-2008 [Contents] Editorial First of all I feel that I must apologise to you all for the length of time between the last edition of Aries and this edition. It is well over a year since the last Aries, suffice it to say that personal circumstances influenced Aries enforced holiday. At the time Aries was put into hibernation I was well on the way to getting another edition ready, but when my personal crisis began Aries was the first thing to suffer. By the time I came back to Aries, the news items I had collected had become woefully out of date, so I resolved to collect some more contemporary news items for a winter 2007 Aries. I decided to publish a seasonal Aries rather than a quarterly edition [at the suggestion of the Chairman], to avoid any future production difficulties. I intend to keep this publishing regime for future editions of Aries. A lot has happened since the last appearance of Aries. On the Society front, there have been two Flamsteed Lectures at the University of Derby (a brief report on the 2007 Flamsteed Lecture appears in the Society News section of this issue of Aries), a new committee has been elected, a number of new space probes have been launched, and dramatic results from current unmanned missions have been returned. Also a number of anniversaries have been observed, the first being the 50th anniversary of the establishment of the Jodrell Bank Radio Observatory, and the 50th anniversary of the launch of Sputnik 1, the world�s first satellite, on 4th October 1957. In fact, much to the author�s dismay, the Sputnik anniversary almost passed by unnoticed, the real surprise was Russia, where it was hardly celebrated at all! It really makes you think what modern-day Russia thinks of space exploration and research. To my mind the general lack of attention to this anniversary is a terrible insult to the memory of Sergei Pavlovich Korolev, the Chief Designer of the Soviet Space Programme."
