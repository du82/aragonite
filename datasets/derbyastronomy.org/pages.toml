title = "Dr Colin Steele Given Honorary DDAS Membership - Friday 6th December 2024"
full_description = "Dr Colin Steele, from the Mathematics Department at the University of Manchester, was given honorary lifetime membership of the Derby & District Astronomical Society at our meeting on Friday 6th December 2024. Colin has given many talks to the Society over the years. In some cases he has stepped in at very short notice when another speaker has had to cancel, and our meeting on the 6th December 2024 was one of these occasions. This provided us with the perfect opportunity to recognise his support of our Society over the years by presenting him with honorary lifetime membership. He then went on to deliver his talk on How the Outer Planets Were NOT Discovered. Picture Credit: Mike Lancaster."
year_published = 2025
