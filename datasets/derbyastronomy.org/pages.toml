["https://derbyastronomy.org/FlamsteedLecture2005.htm"]
title = "2005 Flamsteed Lecture"
full_description = "The 2005 Flamsteed Lecture was held on the 12th October 2005 at the University of Derby Kedleston Road campus. Professor John Zarnecki, of the Planetary and Space Sciences Research Institute at the Open University, and Principal Scientist for the Huygens lander probe gave a lecture entitled The Landing On Titan - 14 January 2005. The lecture was attended by quite a few DDAS members who had the opportunity to meet Professor Zarnecki after his talk. During the post-lecture reception the Society had a stand in the university Atrium, with astro-photographs taken by members, information leaflets on the DDAS, and copies of our Society magazine Aries. The Flamsteed Lecture is an annual event held by The University of Derby, and forms part of its Professorial and Public Lecture Series. The DDAS was originally involved in the idea for the Flamsteed Lectures when they began a few years ago. The lectures honor England's first Astronomer Royal, the Reverend John Flamsteed (1646-1719), who was born in Derbyshire and attended Derby School. The pictures on this page are by Arthur Tristram."
