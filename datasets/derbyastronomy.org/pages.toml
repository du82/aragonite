["https://derbyastronomy.org"]
title = "Derby & District Astronomical Society"
description = "Derby and District Astronomical Society"
full_description = "Welcome to the website of the Derby & District Astronomical Society (DDAS). We were founded in 1974 and are open to all with an interest in astronomy. We currently number around 50 members from all walks of life and whose knowledge of astronomy ranges from complete beginner to advanced. The society holds regular meetings on the first Friday of each month (except July and August) at 7:30 pm at the Friend's Meeting House on St. Helen's Street in Derby. This period stone building is owned by the Quakers Religious Society Of Friends, and is next door to BBC Radio Derby. Please note that we are not affiliated with the Quakers Religious Society Of Friends, but rent the meeting space from them. This venue may be found on Google Maps. Meetings usually involve an outside speaker, but members also give talks, and the society holds a quiz in January. We also hold 'Introduction to Astronomy' evenings at the Friends Meeting House on the third Friday of the month, and these are designed to cover the basics of astronomy. See below for more information or check out our meetings programme. We are a friendly and, despite our subject, 'down to earth' society. Meetings are a great way for potential new members to see what we're about in an informal and relaxed atmosphere. The social aspect continues after most monthly meetings with a visit to, appropriately enough, The Seven Stars. The society's Flamsteed Observatory houses a 10-inch Meade Schmidt-Cassegrain telescope and Altair ED-80 refractor on a computerised 'GOTO' mount. The observatory is named in honour of England's first Astronomer Royal, the Reverend John Flamsteed (1646-1719), who was born in Derbyshire and attended Derby School. Regular monthly observing sessions are held (weather permitting) at the facility and new people are always welcome. They are usually held on the second Saturday of the month and start times vary with the season. The observatory is located on North Lane, Ashbourne, DE6 1PL, about two miles north of the village of Brailsford, and may be found on Google Maps. The observatory is available for use by individual members at any time after some simple training. A barbecue is held at the observatory on the first Saturday in July instead of a meeting at The Friend's Meeting House that month. The society also takes part in a number of public events and observing evenings during the year, at which members share their enthusiasm for the night sky and bring along their telescopes. An annual trip provides the opportunity for members to visit a different site of astronomical or space interest within the UK each year. Several of our members photograph the night sky and our picture gallery is entirely comprised of DDAS member's work."
