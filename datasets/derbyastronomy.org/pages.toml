["https://derbyastronomy.org/Carsington200216.htm"]
title = "Carsington Sailing Club - Saturday 20th February 2016"
full_description = "The weather forecast for our visit to the Carsington Sailing Club on the 20th February 2016 was not good, in fact it was raining. Nevertheless a few of us took along our telescopes, along with some displays and of course our famous Moon Globe. DDAS member John Brown gave an half hour talk on Astronomy and Navigation, which was both entertaining and informative, followed by ten minutes by a Master Mariner on the use of sextants. Afterwards people where invited to wander around the displays and the weather even joined in and the clouds broke enough for a few telescopes to be set up, including some brought along by members of the sailing club. You never tire of hearing 'WOW' when people look at the moon for the first time through a telescope! All in all a great evening was had by everyone and we are considering repeating the event again around September. We where even invited to go sailing with them! I would like to thank Gordon Fleming for all his efforts and everyone from the Carsington Sailing Club for making us welcome. My thanks also go to Mike Dumelow, Anthony Southwell, Libby Ray, Peter Branson, Simon & Esther Behnke, Peter Branson, Rob Seymour and especially John Brown. The following pictures were taken by Gordon Fleming."
