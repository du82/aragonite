["https://derbyastronomy.org/AtlasCoelestis011011.htm"]
title = "DDAS Viewing of Flamsteed's Atlas Coelestis - Derby Museum - Saturday 1st October 2011"
full_description = "On Saturday 1st October 2011 a group of DDAS members were treated to a private viewing of a copy of John Flamsteed's Atlas Coelestis at the Derby Museum and Art Gallery. Sir John Flamsteed was England's first Astronomer Royal and was born in Denby, Derbyshire and attended Derby School. He eventually went to Jesus College in Cambridge but his knowledge of astronomy was gained through his own studies rather than any formal training. In 1675 he was invited by Charles II to be 'The King's Astronomical Observator'. A year later the Royal Observatory in Greenwich was founded and it was from there that Flamsteed compiled a catalogue of over 3000 star positions and magnitudes. The Atlas Coelestis is based on this catalogue and was published posthumously in 1729. The Derby Museum holds a copy of the second edition of Atlas Coelestis, published in 1753. The DDAS was invited by Jane Hardstaff from Derby Museum and Art Gallery in recognition of our involvement in their 'Astronomical: The Beauty of a Thousand Stars' exhibition, which opened on 3rd September 2011. The Society provided information for a timeline of discoveries and developments in astronomy since the invention of the telescope and a short piece on Flamsteed, his work as the first Astronomer Royal at Greenwich and how his Atlas Coelestis came about. The exhibition also has some details on the DDAS, our meeting programme and a brief history of our own Flamsteed Observatory. It runs until April 2012. Here is a selection of some of the pages and constellations seen in the Atlas. Photographs taken by Mike Lancaster with kind permission of Derby Museum."
year_published = 2025
clearnet = "https://derbyastronomy.org/AtlasCoelestis011011.htm"
