["https://derbyastronomy.org/AlvastonPark240115.htm"]
title = "Stargazing Session at Alvaston Park, Derby - Saturday 24th January 2015"
full_description = 'Once again the DDAS was invited back for a stargazing event at Alvaston Park in Derby, organised by DDAS member Katie Smith and the Alvaston Park Friends. The 2015 event was held on the 24th January and attracted many visitors and members. An array of telescopes were on hand including a couple of Meade ETX-90s, a 6" Newtonian and the 8.5" Dobsonian constructed by DDAS member Mike Dumelow from a mirror set donated by our founder member Jane Kirk. Some telescopes were also brought along by visitors and we were on hand to offer help and advice. The weather was kind enough to offer us some clear sky and we were able to observe the Moon, Jupiter, the Orion Nebula and Comet Lovejoy.'
