["https://derbyastronomy.org/DDAS50thParty100524.htm"]
title = "DDAS 50th Anniversary Party, Littleover Social Club, Derby - Friday 10th May 2024"
full_description = "On the evening of Friday 10th May 2024, the Society held a 50th anniversary party at Littleover Social Club in Derby. This was attended by both members and non-members and their partners. An excellent buffet was laid on, paid for by the Society and prepared by DDAS Chairman Gary Lambert. A bar was also available for the evening and many space themed music tracks were played in the background! Many of those who were leaving the venue were also treated to the spectacular auroral display that lit up the UK skies that evening, who witnessed the spectacle from the club car park, or when they got home! What a fantastic coincidence that it occurred on that evening! Members pictures of that aurora can be seen here, but on this page we show some pictures from the party itself."
year_published = 2025
