["https://derbyastronomy.org/AriesJanApr06NewHorizons.htm"]
title = "Aries January-April 2006 - New Horizons' Voyage to Pluto"
full_description = "Aries The Journal of the Derby and District Astronomical Society January - April 2006 [Contents] Into the Unknown � New Horizons� Voyage to Pluto By Anthony R. Southwell It was at this point that the author began to feel a little bit worried, getting home as fast as I could so I could get NASA TV up on the Internet to watch the launch for two nights in a row, and seeing that the launch vehicle was still 'rooted' to the spot for two nights in a row, I began to get the feeling that this mission could be jinxed and that the malevolent beast that haunted many a planetary mission, 'The Great Galactic Ghoul' (those who know the history of the Jet Propulsion Laboratory will be familiar with this creature! � Editor) was waiting to claim another victim. So I resigned myself to another launch scrub and realised that I would not be back home in time to watch the launch 'live' over the Internet, as the new launch time was for 6:05 pm GMT on the 19th January, and I would still be stuck on the bus home. So the next launch day arrived and I got home from work at around 6:50 pm, fully expecting to have missed the launch, I didn�t turn on the news until about 7:00pm, and what did I find on Sky News? Live coverage of the New Horizons launch! The launch was an hour late! The Atlas V had already left the pad and was now steadily accelerating away (I use the term 'steadily accelerating' in the loosest possible way! This vehicle really moves!). By this point the Atlas V was about two minutes into its flight and was at the point of jettisoning its strap-on solid rocket boosters (the launch vehicle had five of them). I immediately dropped everything and rushed to the PC and got NASA TV up and running, I watched the rest of the launch phase over the Internet. Before too long the tracking cameras at the Cape lost the launch vehicle and NASA TV switched to a live telemetry feed from the vehicle. A computer graphic of the launch vehicle above the Earth was displayed, the graphic changed as the Atlas V went through its various programmed manoeuvres during the launch phase. At T + 4 minutes 34 seconds, the Atlas V core stage had shut down and separated from the rest of the launch vehicle. At T + 4 minutes 44 seconds, the Centaur upper stage fired and raised New Horizons orbit and added to it's velocity. Following the first Centaur burn, the combined Centaur/New Horizons spacecraft went on to cruise in orbit for about 10 minutes. During the cruise phase the Centaur fired its own control thrusters to keep a good trim during this coasting phase of the launch. You could actually watch these thruster firings 'live' via the computer graphic. You saw a thrusters fire and the graphic would slightly alter its orientation. It was almost like being there, you felt that you were riding along with the New Horizons spacecraft during its launch. Then after the coast phase of the launch the Centaur fired again at around 16 minutes or so after launch for 32 minutes and 23 seconds and added more velocity to New Horizons. At T + 42 minutes the Centaur shut down for the last time and separated from New Horizons, then the Star 48B solid motor third stage lit and fired for 52 seconds. At T + 47 minutes and 22 seconds the Star 48B separated from New Horizons after giving it the final push the probe needed to leave the Earth, and boy did New Horizons leave the Earth, from launch to Earth escape velocity took a little over 47 minutes."
