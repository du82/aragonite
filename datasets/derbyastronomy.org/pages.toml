["https://derbyastronomy.org/CPP_Summary.htm"]
title = "Child Protection Policy and Procedures"
full_description = "The DDAS does not have any members, or actively recruit young people, under the age of 16 years. However, the DDAS encourages young people to take an interest in science, generally, and astronomy, in particular. The DDAS welcomes young people as guests to its activities, and therefore, needs to be prepared for the possibility that they will be joining us from time to time, to talks and to look at the night sky. It is expected that young people be accompanied by a familiar adult, but we cannot guarantee that such adults will attend, or be mature, responsible people. The DDAS has a duty of care for young people who attend the activities of the society, so we must also prepare for the possibility that a young person is unaccompanied. While DDAS talks take place in a reasonably safe environment, observing sessions present specific difficulties for the care, and therefore the protection, of young people. Observing takes place: Please read the Policy and Procedures. They are very sensible precautions, and will help us to feel far more comfortable about the prospect of encouraging young people to take an interest in Astronomy. DDAS members - in the Member's Area. If you need an account please contact the writeAddress('webmaster', 'derbyastronomy.org', '<FONT face=Verdana size=2>Web Master.</FONT>') <FONT size=1>Web Master.</FONT>"
