["https://derbyastronomy.org/Meetings2025.htm"]
title = "2025 Meeting Programme"
full_description = '''Our 'Main Meetings' and 'Introduction to Astronomy Evenings' are held at the Friend's Meeting House on St. Helen's Street, Derby, DE1 3GY. This period stone building is owned by the Quakers Religious Society Of Friends, and is next door to BBC Radio Derby. Please note that we are not affiliated with the Quakers Religious Society Of Friends, but rent the meeting space from them. This venue may be found on Google Maps. Our main meetings usually involve a popular level talk by an outside speaker, typically from a university, on some aspect of astronomy or space science. DDAS members may also give talks, and in January we hold an informal quiz. The May meeting is replaced by our AGM, the July meeting by a barbecue at our observatory, and the August meeting by an observing session. Our 'Introduction to Astronomy Evenings' are aimed specifically at beginners, and may include advice and help on using telescopes, finding your way around the night sky, astrophotography etc. There is a room collection for meetings held at The Friends Meeting House, which is �1 for members and �3 for visitors. Coffee and biscuits are available during the break at these meetings, and there is a donations dish for this and we suggest a 25p contribution or thereabouts. Our monthly observing sessions are held at The Flamsteed Observatory, North Lane, Ashbourne, DE6 1PL, about two miles north of the village of Brailsford. Find our observatory on Google Maps. Our 10" Meade Schmidt-Cassegrain, Altair ED80 refractor and GPCAM under the dome, as well as any telescopes that may be brought along by members are available. During summer months we also have a Lunt Solar Scope available before the sun goes down. Members and visitors alike are also encouraged to bring along their telescope if they have one. Please note that anyone visiting our observatory and site, be they members or non-members, do so entirely at their own risk. Further details of all meetings may be obtained from our Secretary writeAddress('secretary', 'derbyastronomy.org', 'Brian Dodson')Brian Dodson on 07491 407261.'''
year_published = 2025
clearnet = "https://derbyastronomy.org/Meetings2025.htm"
