["https://derbyastronomy.org/AriesWinter0708RobertGoddard.htm"]
title = "Aries Winter 2007/2008 - Robert Hutchings Goddard"
full_description = "Aries The Journal of the Derby and District Astronomical Society Winter 2007-2008 [Contents] Robert Hutchings Goddard By Malcolm Neal Robert Hutchings Goddard was the pioneer of liquid fuelled rockets that ultimately led the way to the Moon. However this knowledge was passed on via German researchers who took more notice of what he was doing than did the Americans at the time. Born October 5th 1882 and died August 10th 1945 he died young and never saw the fruits of his experiments with rocketry. It was as early as 1926 that he launched the first ever-liquid fuelled rocket. It was a tiny projectile as shown by the image below. Eventually his rockets reached speeds of well over 500 mph but they never reached space. He was born at Worcester Massachusetts and was an only child. Even early in his childhood he showed a scientific bent, experimenting with static electricity and soon became interested in flight first via kite flying and later balloons. Like many of us it was science fiction in the form of stories by H.G. Wells that turned his interest towards space and the means of getting there. His early education was troubled mainly through his poor health but he proved to be a very able student and eventually enrolled at Worcester Polytechnic Institute where he obtained his bachelors degree in 1908. Whilst there he was interested in gyroscopes as ways of ensuring controlled (balanced) flight. This interest led to an article published in Scientific American, a journal still very much alive. He first mentioned the possibility of liquid fuelled rockets in 1909 using as oxidiser, liquid oxygen, and as a fuel, liquid hydrogen. He correctly assumed that there would be a greater propellant effect than using the gunpowder-based fuels of the time. He gained an MA in 1910 and this was followed very quickly, the next year by his PhD, both from Clark University. The next year he moved to Princeton University where he had been offered a research fellowship. At Princeton his interests were in electronics and he took out many patents in this field. However at the same time he also took out patents in the field of liquid fuelled rockets the most notable being The first, Patent No. 1,102,653, July 7th 1914, which described a multi-stage rocket and the second, Patent No. 1,103,503, issued just a week later described a rocket fuelled with petrol and liquid nitrous oxide. The two patents would become milestones in the history of rocketry. His rocket research was however outstripping his ability to pay for it as he only earned a small amount as a lecturer back at Clark University, to which he had returned in 1914. In 1916 he applied for and was given a grant of some $5000 dollars from the Smithsonian Institute to continue his research into rocket motors. This cash was to last a five year period. His researches at this time also involved potential weapons and he did the groundwork for, and demonstrated, a very early bazooka that eventually became a standard weapon in World War Two."
