["https://derbyastronomy.org/FlamsteedObservatory.htm"]
title = "Flamsteed Observatory"
full_description = "The Society's Flamsteed Observatory is situated a couple of miles north of the village of Brailsford, in rolling countryside to the north-west of Derby. It is named in honour of John Flamsteed (1646-1719), England's First Astronomer Royal, who was born in the village of Denby, also a few miles north of Derby. While living at his father's house on what is now 27 Queen Street in Derby, Flamsteed made groundbreaking astronomical observations, before he later moved to London and began work at Greenwich. The Flamsteed Observatory currently houses a 10-inch Meade Schmidt-Cassegrain telescope, mounted on an EQ6-Pro computerised 'GOTO' mount and pier under a rotating dome. This telescope is primarily used for visual observations of the moon, planets and deep sky objects under our dark skies. An 80mm Altair ED refractor is piggybacked on the Meade, and is connected to an Altair GPCAM camera, which provides a live viewing experience on-screen. This setup was installed in 2022 to replace the older 10-inch Newtonian telescope and 'push-to' mount. A major upgrade of the observatory power supply and electrics was also undertaken at this time. As the observatory if 'off the grid', power is sourced from an array of solar panels mounted on the building, which charge a set of batteries, and both 12v DC power and 240v AC is available, the latter via an inverter. Monthly observing sessions are held at the observatory, usually on the second Saturday of the month. These are open evenings at which both members and visitors are welcome. We also welcome visits by schools, scout, guide and other private groups. If you would like to attend an observing session or book a group visit please contact our Secretary writeAddress('secretary', 'derbyastronomy.org', 'Brian Dodson')Brian Dodson. The observatory may be found on Google Maps. Please note that anyone visiting our observatory and site, be they members or non-members, do so entirely at their own risk. Members are entitled to some training on the use of our Flamsteed Observatory, and when deemed competent may obtain a key to enable them to use the facility at any time."
year_published = 2025
clearnet = "https://derbyastronomy.org/FlamsteedObservatory.htm"
