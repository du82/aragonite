["https://derbyastronomy.org/AriesSepDec05Editorial.htm"]
title = "Aries September-December 2005 - Editorial"
full_description = "Aries The Journal of the Derby and District Astronomical Society September - December 2005 [Contents] Editorial It is with great pleasure that I present this edition of Aries to you all after a break of about two years. Before I go any further I must offer my thanks to someone, and that someone is the former Editor of this journal, Kevin Woodward. Kevin (right) took over the Editorship of Aries from myself in 1999. In his time as Editor he transformed Aries from an A4-sized journal to an A5-sized publication with a very eye-catching format and style. With Kevin at the helm Aries went from strength to strength, producing it with far more regularity than before. The articles were varied and entertaining, there were 'Fun Pages' with questions to test the most astronomically minded brain, member�s observations pages, an astro-news section, and sky maps. All in all Aries was shaping up to be a very well rounded journal, something the Society should be proud of. I only wish I managed to write more articles for Kevin than I did. I really wish I had finished my 'Mining the Sky' article series for him, maybe I�ll get to finish that in this latest incarnation of Aries? Kevin finally stood down as Editor of Aries in 2004 at his own request - he just could not find the time to devote to it. So he thought it would be for the good of the journal that he step down as Editor. I was sad that Kevin decided to do this, as I think Kevin was one of the most successful Editors Aries ever had. Even though I was sad at Kevin�s decision, I did respect it. So, thank you Kevin for all you hard work as Editor of Aries, I�ll look after it for you, and by the way, do you fancy submitting an article? (Evil Laugh � Ed). So, what happened next? After a time, with no Aries being produced, the membership began to ask if it was ever going to return. There were discussions at committee as regards to finding a successor to Kevin as Editor, but no one came forward, but then myself and our Chairman, Mike Lancaster, decided to include Aries as part of our Society web-page, an idea which would not only keep Aries going, but would bring the journal to a wider audience. Then it was pointed out that not everyone in the Society has access to the Internet, so the plan was hastily revised to produce a 'hardcopy' version of Aries to service those with no Internet access. But that still left the question of who would be the Editor? With still no resolution to this issue and still no Aries produced, a committee member threw his hat into the ring as we approached the May 2005 AGM."
