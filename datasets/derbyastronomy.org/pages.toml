title = "DDAS Visit to the Old Royal Observatory in Greenwich - Saturday 28th February 2015"
full_description = "DDAS Visit to the Old Royal Observatory in Greenwich - Saturday 28th February 2015Report by Mike Lancaster On Saturday, 28th February 2015 the DDAS visited the Old Royal Observatory in Greenwich. The trip by coach from Derby was organised by DDAS member Brian Dodson and our visit fell close to the 340th anniversary of the appointment of Derbyshire born John Flamsteed as the first Astronomer Royal on the 4th March 1675. We were met by Eddie Yeadon from the Flamsteed Society and given a series of short talks on John Flamsteed and the founding of the observatory. I was delighted to be able to give the first of these talks about Flamsteed's early life in Derby and up to his appointment as Astronomer Royal. Eddie and a couple of his colleagues from the Flamsteed Society followed up with talks on the observatory and instruments that Flamsteed used and the observations he made. We were then split into two groups and given a guided tour of the observatory. My group was led by Flamsteed Society member and observatory tour guide David Wescott who showed us around Flamsteed House and the beautiful Octagon Room, where we saw the Tompion clocks that Flamsteed used. David then took us into the Meridian Building and explained the workings and history behind the various quadrants and telescopes there. This was followed by a visit to the Great Equatorial Telescope inside the Onion Dome and finally a tour of various exhibits charting the history of time keeping which was David's area of expertise. Our time at the observatory concluded with a showing of the 'Dark Universe' presentation in the planetarium, narrated by award-winning astrophysicist and author Neil deGrasse Tyson. Our thanks go to the Flamsteed Society for making our day so special, to the Royal Observatory Greenwich and to DDAS member Brian Dodson for organising our visit. If you would like to use any of the images in this article please contact the writeAddress('webmaster', 'derbyastronomy.org', 'Webmaster') Webmaster."
year_published = 2025
clearnet = "https://derbyastronomy.org/Greenwich280215.htm"
