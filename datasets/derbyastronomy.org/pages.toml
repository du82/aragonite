["https://derbyastronomy.org/AriesMayAug06Editorial.htm"]
title = "Aries May-August 2006 - Editorial"
full_description = "Aries The Journal of the Derby and District Astronomical Society May - August 2006 [Contents] Editorial Well, at long last, here it is! Sorry for the long wait for this issue, but things ran away with me and before I knew where I was, were heading for September! So apologies once again for the late appearance of this edition of Aries, in fact as I am completing this edition, I have started work on the September � December edition! Phew! I hope to have that edition published by the November meeting, but knowing my luck of late, it may even be the December meeting! So watch this space! So what has been going on since the last edition of Aries, well, quite a bit really! First up we have had a number of highly successful public events during the last few months, culminating in our presence at the Relay for Life event at Moorways Stadium during Saturday 17th and Sunday 18th June (see the Society News pages for more details). Also during this period, we have had, not one, but two Shuttle missions! The second Return to Flight mission, STS-121/Discovery took off on the 4th July (of course!) and had the good grace to land on 17th July, a day away from me leaving for Heathrow to go to Greece! There was no way that I was going to worry about that mission while I was on my hols! But if they had stayed up any longer I would have gone spare without access to NASA TV to see if everything was all right! The second mission is not a Return to Flight mission, this is the first construction mission to the International Space Station since October 2002, when Space Shuttle Atlantis visited the station, and quite appropriately, it was Atlantis that launched on 9th September on Shuttle mission STS-115. The mission is in progress as I write this editorial - this is Atlantis� first flight in over three years! The main goal of this mission is to deliver the P3/P4 solar arrays and the truss structure for the ISS. These items are the heaviest items that the Space Shuttle has ever taken into orbit. The mission is scheduled to last 11 days, and yes, there has been foam loss of the External Tank on both missions, but from the images I�ve seen of the STS-115/Atlantis ET, there seems very little cause for concern, at least to my mind. The mission is progressing well and Atlantis is undamaged."
