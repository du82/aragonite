["https://derbyastronomy.org/DDASMeeting041209.htm"]
title = "In Pursuit of Pulsars - Dame Jocelyn Bell Burnell at the DDAS - 4th December 2009"
full_description = "On the 4th December 2009, to round off a great year of meetings and events for the DDAS, world famous astronomer Dame Jocelyn Bell Burnell delighted our members with her talk 'In Pursuit of Pulsars'. This is in fact her third talk to the DDAS, and she brought us bang up to date with the latest from the world of those most extreme objects the neutron stars and pulsars. As ever she was able to make some pretty amazing astrophysics highly accessible, and the talk was followed by a lively question and answer session. Jocelyn Bell Burnell discovered the first radio pulsar in 1967 while a PhD student at Cambridge. This launched her on a highly distinguished career and she now holds many honours. At the time of writing she is Visiting Professor in Astrophysics at the University of Oxford."
