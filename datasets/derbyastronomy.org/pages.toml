["https://derbyastronomy.org/Herstmonceux251009.htm"]
title = "IYA 2009 - Moonwatch at Herstmonceux - Sunday 25th October 2009"
full_description = '''What better way to take part in the Moonwatch of October 2009 than at the home (or former home) of the 98" Isaac Newton Telescope, namely Herstmonceux, Sussex. A wonderful opportunity to look through some big telescopes - and I mean BIG. Looking at Albireo through the 7th largest refractor in the world was wonderful. On the weekend of 25th October 2009, I visited family in Kent with a view to going on to the observatory at Herstmonceux with my niece, Caitlin (the owner of my old Celestron C6-N). I had been keeping an eye on metcheck.com during the week and as the weekend got closer the weather was acting as forecast for the evening, namely clear! During the afternoon of 25th October, the weather omens were good and we enjoyed a fantastic sunset over Hastings on the Sussex Coast. The wind was strong and the sea very rough, but most importantly the sky was clear. I captured this view with a 10mm superwide Canon lens on my 400D. When the sun had gone down, and we had enjoyed a mug of coffee and hot chocolate on the sea front, it was a short distance to Herstmonceux. We arrived at about 6pm and I could just make out the shadow of the dome of the INT against the deep blue sky - and then it happened! A poxy cloud over the site was emptying itself of rain! That soon passed and there could be the whirring of the domes in the main complex as they were opened up and slewed into position. Now that the skies were completely dark it was time to go to the first of the big telescopes, namely a 30" reflector/spectroscope. What a beast of an instrument! Attached to it was a finder that puts most amateur telescopes to shame - a refractor of about 8" diameter. The moon through it was very bright and as spellbinding as when I first looked at it through a telescope more than 30 years ago. I had my LPI with me but due to the fact that they were using 2" eyepiece mounts, I couldn't use it, so the next best thing to hand was the good old mobile phone. The distortion in the photograph was due to me not being able to get the mobile phone properly lined up with the eyepiece.'''
year_published = 2025
clearnet = "https://derbyastronomy.org/Herstmonceux251009.htm"
