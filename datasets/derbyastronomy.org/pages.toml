["https://derbyastronomy.org/AriesMayAug06RadioAstronomy.htm"]
title = "Aries May-August 2006 - Radio Astronomy Experiments at 12 GHz"
full_description = "Aries The Journal of the Derby and District Astronomical Society May - August 2006 [Contents] Radio Astronomy Experiments at 12 GHz By Tony Razzell Normal amateur astronomy uses a tiny fraction of the available electromagnetic spectrum, between about 0.4 and 0.7 microns wavelength. The first of the 'New Astronomies' that appeared in the 20th century was radio astronomy, at wavelengths less than ~20 metres. The first amateur radio astronomer was Grote Reber, a ham radio enthusiast who built a 30ft dish in has back garden in Illinois, and produced the first ever maps of the sky at radio wavelengths. Since Reber�s pioneering work, the development of electronics has been enormous in the intervening 60 odd years. Satellite television has resulted in the availability of very sensitive microwave receivers at very low cost, which are comparable with some that the professionals were using in the 60�s and 70�s. A number of amateur radio astronomers have built radio telescopes using surplus satellite TV equipment, so I thought I�d have a go at doing the same. A simple amateur radio telescope (known as a total power instrument) consists of an antenna to collect radio waves from space, a low noise amplifier to increase the signal strength whilst adding minimal noise, a frequency converter to drop the signal down to a lower frequency, an IF (intermediate frequency amplifier), and a detector to convert the signal to a DC voltage. An IF amplifier is used as it is easier to build high gain amplifiers at lower frequencies (this receiver arrangement is known as the superheterodyne or superhet). The low noise amplifier and frequency converter are usually built into the same unit for satellite TV, and sit at the focus of a small dish antenna. A schematic arrangement of the telescope is shown in Figure 1. The first problem was the microwave receiver and dish antenna. I acquired my first receiver (known in the satellite TV trade as a Low Noise Block or LNB) for �5 at an amateur radio rally. This was followed by a rather bent Sky TV dish and LNB found by a friend of mine in a skip. I then came across a really good 0.9 m dish with an offset feed, mounting and LNB which was dumped next to the lane along which I go to and from work. A Sky minidish (newer technology than the old Sky TV unit) also turned up dumped in the lane, so that was collected as well. Having got a selection of LNBs, I needed something to plug them into. An LNB converts the microwave signal from the satellite frequency ~12Ghz (or 2.5 cm wavelength) into a lower frequency (0.9-2.1GHz) that is used by the satellite tuner that sits on top of the TV. What I needed was an equivalent unit to the tuner to act as the IF amplifier, but which converted the signal into a voltage that I could record or read with a meter. The book on Amateur Radio Astronomy by William Lonc is a very good source of information, as well as several sites on the internet. Eventually, I decided to make my own IF amplifier, based on application notes for MAR-6 MMA devices and the book by Lonc. The circuit diagram is shown in Figure 2."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesMayAug06RadioAstronomy.htm"
