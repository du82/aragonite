["https://derbyastronomy.org/AriesJanApr06HistorySolarSystem.htm"]
title = "Aries January-April 2006 - A History of the Solar System"
full_description = "Aries The Journal of the Derby and District Astronomical Society January - April 2006 [Contents] A History of the Solar System By Dave Selfe What exactly is the 'Solar System'? Well our Solar System consists of the Sun and all of the objects that are gravitationally bound to it. These objects are the planets and their associated satellites, the asteroids, the Kuiper Belt Objects (KBOs) and the comets that orbit the sun in the far off Oort Cloud. In later articles of Aries, we will study these objects more closely and we shall discover what a wonderful and diverse solar system we reside in. Our solar system is dominated by the Sun, which constitutes something around 99.8% of the total mass of the whole of the solar system. When we consider that amount � 99.8% of the total mass of the whole of the solar system � we may find difficulty in grasping just how huge an amount this actually is. Well if we realize that the planet Jupiter has more mass than all the other planets added together and if we also consider that the mass of the Sun is about 1,000 times the mass of Jupiter then maybe we get just the vaguest idea of just how massive our Sun is. And let us not forget that our Sun is just a very average star! After the Sun, the planets make up the next major constituents of the Solar System and these are probably the most explored objects of all in the Solar System. Besides the numerous ground and space based telescopes that have examined them, there have been many spacecraft put in orbit around them and robotic missions dropped to the surfaces to investigate further. In recent years, even the comets and asteroids have had spacecraft sent to examine them. The current theory for the formation of the Solar System is that it began to form around 4.6 billion years ago within a rotating disc of gas and dust. This is known as the Solar Nebula. The planar shape and the shared sense of rotation is strong evidence of how the Solar System formed and by measuring the products of radioactive decay of meteorites, the age of the Solar System can be determined."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesJanApr06HistorySolarSystem.htm"
