["https://derbyastronomy.org/ArthurLeavingPresent090915.htm"]
title = "Leaving Presentation for Arthur Tristram - Wednesday 9th September 2015"
full_description = '''At the DDAS meeting on September 4th 2015 we said goodbye to a long standing member and supporter of the DDAS, Arthur Tristram. Arthur has been a member for 36 years and dropped the bombshell that he was moving to pastures new only a few weeks before hand! DDAS Secretary Brian Dodson (after consulting with Arthur's long time friend Dave Maynard) went ahead and purchased an ornamental brass telescope and had it engraved with 'ARTHUR Best Wishes and Good Luck From All at the DDAS'. We presented him with it a few days later on the 9th September 2015 at the Seven Stars pub as he was moving house the following Friday! We wish Arthur the very best in his new location, which should provide somewhat darker skies than Derby! The following pictures were taken by Dave Maynard. Arthur responded with the following message: "May I take this opportunity to thank you all for the excellent engraved brass telescope which was presented to me at the Seven Stars a few weeks ago. I was overwhelmed by the present and kind words from members of the Society. Your friendship over the last 36 years has meant a great deal to me. The telescope will be a permanent reminder as if l needed one of such a good and friendly Society as the one in Derby. Hope to see you all in the near future. Kind regards, Arthur". If you would like to use any of the images in this article please contact the writeAddress('webmaster', 'derbyastronomy.org', 'Webmaster') Webmaster.'''
