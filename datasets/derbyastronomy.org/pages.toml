["https://derbyastronomy.org/DDASWalk170508.htm"]
title = "DDAS Sponsored Walk in Monsal Dale - Saturday 17th May 2008"
full_description = '''The DDAS held a sponsored walk on Saturday the 17th May 2008 to raise money for the Society. The eight mile walk started at around 10 am at Monsal Head in the Derbyshire Peak District. The route followed a path down through the woods below the viewpoint at Monsal Head and along Monsal Dale to a weir on the River Wye. The route then crossed a footbridge over the Wye and followed the north bank of the river as far as the A6 at the foot of Taddington Dale. From there our intrepid walkers took a path up the 'dry valley' of Deep Dale and thence over the fields to the village of Sheldon. After a brief pause in the village and some longing looks at the local pub the party took a path down into Little Shacklow Wood where a break was made for the consumption of packed lunches. Thence the route was down to the Wye again and into Ashford in the Water. After another brief rest the group took the steep path up and out of Ashford and back over the fields to Monsal Head, arriving at around 3 pm. A big thank you to all our walkers and those who sponsored them. The amount raised will be posted on the website in due course. Unable to make the sponsored walk from Monsal Dale on the 17th May, Arthur Tristram and Dave Maynard did their own sponsored walk for the DDAS on the 10th May 2008 instead. They walked from Mickleover to Burnaston and then over fields to Etwall. After a short break they then followed the sustrans track back to Mickleover. Their walk was just over 7 miles and took 3 hrs and Arthur states that they "enjoyed it very much". Many thanks chaps - it all helps! Here are their photos... Picture Credits: Monsal Dale, Deep Dale - Mike Lancaster. Sheldon, Monsal Head - Dave Selfe. Arthur and Dave - Arthur and Dave.'''
year_published = 2025
clearnet = "https://derbyastronomy.org/DDASWalk170508.htm"
