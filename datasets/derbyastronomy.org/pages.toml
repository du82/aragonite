["https://derbyastronomy.org/AriesSepDec05KeplerLaws.htm"]
title = "Aries September-December 2005 - The Life and Laws of Johannes Kepler"
full_description = "Aries The Journal of the Derby and District Astronomical Society September - December 2005 [Contents] The Life and Laws of Johannes Kepler By Maurice Batchelor Tycho of course, was in no danger at all, because up to the time of his death at the end of 1601, he still felt sure that the Sun moved around the Earth. He undoubtedly hoped that his pupil Johannes Kepler would use the Hven observatories on an island in the Baltic to prove the unlikely looking 'Tychonic' theory. Kepler began his work with an open mind. Fortunately he was as brilliant as a theorist as Tycho had been as an observer. Johannes Kepler was born at Weil der Stadt, W�rttemburg (Germany) in 1571. In his early years he did not enjoy good health. A severe illness when he was four years old left him with a partially crippled hand, poor eyesight and a generally delicate constitution. It is therefore not surprising that he made very few astronomical observations himself. He went to Tubingen University planning to enter the Church, however, he soon turned his attention to astronomy. In the year 1594 he accepted a lecturing post at the University of Gr�tz. His first book published two years later contained a measure of science mixed with a good deal of astrological superstition and some quite unsound ideas. Tycho Brahe, having read the book was highly impressed by it, with the result Tycho invited Kepler to join him as his assistant. Here surely was a man who would be able to make proper use of the Hven observations. Kepler was glad to accept as there were religious troubles in Gr�tz, so the young German mathematician joined the old Dane in Prague. Less than two years later Tycho died and Kepler succeeded him as Imperial Mathematician to Emperor Rudolph II. Kepler now had the task of proving that the Earth moved round the Sun. He also looked into the question of the movements of various planets. This presented a problem as according to Tycho�s observations compared with his own results, the two could not be compared. He then made an important discovery. The planets move round the Sun indeed, but they do so in orbits which are not circles but ellipses."
