["https://derbyastronomy.org/AriesJanApr06SolarEclipses.htm"]
title = "Aries January-April 2006 - Solar Eclipses - worth a visit?"
full_description = '''Aries The Journal of the Derby and District Astronomical Society January - April 2006 [Contents] Solar Eclipses - worth a visit? By Malcolm Neal A total eclipse means that you are on the narrow mid line of the eclipse path. The width of the path varies, as does the length of the total eclipse phase according to the relative earth-moon and earth-sun distances. If the earth moon distance is short i.e. the moon is closer than normal and the earth sun distance is greater i.e. the sun is farther away than normal then the total phase and the total length of the whole eclipse will be longer. The reverse is also true. Totality in the 1999 eclipse was a maximum of 2 minutes and 20 seconds though they can be for only a few seconds or up to about 8 minutes if the geometry of the eclipse is ideal. This does not happen very often. At any place on the earth�s surface a total eclipse is quite rare. Because the path is only a couple of hundred miles wide and the path may be a couple of thousand miles long but much may be over oceans, only a few inhabited places are touched by the path of totality. Also because of celestial mechanics the path of each eclipse covers different parts of the earth�s surface. England for instance will not have another total eclipse until 2090, a very long wait for those of us over 50 years old! Celestial mechanics, the relative movements of the Earth, moon and Sun all combine so that very 18 years, and 10 or 11 and a third days the cycle of eclipses repeats (whether it's 10 or 11 days depends on how many of the 18 years are leap years). Amazingly enough, this period was actually discovered 2,500 years ago, by Babylonian astronomers It is called the Saros, meaning "repetition". A Saros cycle is, then, a series in which similar eclipses happen every 18 years 10/11 and a third days. But of course, eclipses happen more often than that. The explanation is that there are many combinations of circumstances that can produce an eclipse. So, there are, at any one time, 42 Saros cycles running at once! This results in a bit more than 2 eclipses per year though not all are total. There are between 54 and 71 total eclipses per century according to the NASA 6 millennium eclipse catalogue. Partial and annular eclipses occur slightly more often, up to 95 per century and hybrid eclipses that are annular and total along different segments of the path are very rare (only up to 26 per century).'''
