title = "DDAS Visit to Dr Allan Chapman's Collection of Reconstructed Astronomical Instruments in Oxford - 19th August 1981"
full_description = "DDAS Visit to Dr Allan Chapman's Collection of Reconstructed Astronomical Instruments in Oxford19th August 1981 On the 19th August 1981, a group of DDAS members visited Dr Allan Chapman and his collection of reconstructed astronomical instruments in Oxford. These included refracting telescopes and mural quadrants of the type used by the first Astronomer Royal, John Flamsteed of Derby, when he was based at the Royal Greenwich Observatory in London between 1675 and 1719. Pictures courtesy of Arthur Tristram. Related Topic: DDAS 50th Anniversary Lecture: John Flamsteed - Derby's Gift to Astronomy by Dr Allan Chapman - Saturday 18th May 2024"
