["https://derbyastronomy.org/BangTalkBasingstokeOct2007.htm"]
title = "BANG! A Complete History of the Universe - Basingstoke Astronomical Society - 25th October 2007"
full_description = 'The title says it all, but on the 25th October 2007, Dr Chris Lintott changed it to BANG! An Hour-Long History Of The Universe when he gave a presentation to the Basingstoke Astronomical Society � after all, that is the only way you can fit 13.7 billion years into an evening! Dr Lintott, along with Sir Patrick Moore, is the face of the BBC programme The Sky At Night and gave a talk to the Basingstoke Astronomical Society on the above date. A trip down to the town of my upbringing was a must and so I set off south especially for it. Chris Newsome and Dr Chris Lintott at the meeting of the Basingstoke Astronomical Society on the 25th October 2007 The evening was divided into two sections. In the first half, Dr Lintott explained about the Big Bang and how it explained the goings on in the universe on current thinking and scientific observation. For example the microwave background noise that was detected coming from the formation of the universe, explaining what was being observed in an extremely easy to understand way. As he put it, the history of the universe and the big bang effectively starts at page 3, pages 1 and 2 of the history have not/could not be written because the laws of physics as we know it fall down. After a short break, the secretary of the Basingstoke society, John Stapleton, gave a short presentation on Whats Up in the night sky in November 2007 and provided me with some information about an upcoming photo opportunity on 28th/29th November! If the skies are clear, you will see the results � but I ain�t going to tell you what it is... just yet! The second half of the evening was a less formal question and answer session with Dr Lintott on anything astronomical including his career. Dr Lintott provided a bit of an insight into the behind the scenes goings on at The Sky At Night including anecdotes about the producer who got the wrong aeroplane tickets for a trip to Hawaii (which forced the crew to stay in the sun a week longer than was originally planned... twice!), who decides on the subject matter of each program � Sir Patrick in consensus with Dr Lintott and the producer! Also the script for the 1st programme was discovered and the 50th Anniversary programme used that script, only for Sir Patrick, later over a drink with the crew, to come out with the comment that it couldn�t have been the script because "when have I ever stuck to the script?!"'
