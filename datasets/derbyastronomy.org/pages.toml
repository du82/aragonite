["https://derbyastronomy.org/AriesSepDec05DeepImpact.htm"]
title = "Aries September-December 2005 - Bullseye! Deep Impact at Comet Tempel 1"
full_description = "Aries The Journal of the Derby and District Astronomical Society September - December 2005 [Contents] Bullseye! Deep Impact at Comet Tempel 1 By Anthony R. Southwell On July 4th 2005 a quite unprecedented event occurred some 268 million miles from Earth, for the first time, humankind was to get a glimpse inside a cometary nucleus by smashing a portion of a spacecraft into it. The comet in question was Comet Tempel 1 and the spacecraft was the Deep Impact probe. Deep Impact is part of NASA�s Discovery Program of space science missions, which are low-cost highly focused science missions; a proposed mission must stay within the $299 million price cap set by the Discovery Program. Other missions in this program have included: So, as you can see, Deep Impact comes from a very distinguished stable. Planning and design for the Deep Impact mission took place from November 1999 through to May 2001. As pictured at left, the spacecraft was launched atop a Delta II booster from Cape Canaveral on January 12th 2005. Encounter with its target comet was scheduled to take place on July 4th 2005. Deep Impact was going to shoot an 820-pound instrumented projectile into the nucleus of Comet Tempel 1. It was hoped that the 23,000 mph collision would form quite a sizable crater, and that the flyby spacecraft will be able to observe the stages of the crater�s development, how deep it gets and how wide it becomes. It was hoped that Deep Impact would be able to look into the newly formed crater for almost 15 minutes before the spacecraft rapidly moves away from Tempel 1 on to an orbit around the Sun. It was expected that the collision of the impactor with Tempel 1 would cause a plume of gas and dust to spray out of the newborn crater, and the spacecraft was expected to measure and record what the plume does to the comet�s atmosphere. So why pick Comet Tempel 1 as the target for Deep Impact? Choosing Tempel 1 as the target had a lot to do with timing. The mission planners needed a comet that would be relatively easy to reach at about the time the spacecraft was ready for launch. The comet has an orbital period of 5.5 years and it was 268 million miles away from Earth at the time of encounter. Also Tempel 1 has a big nucleus (3.1 miles wide by 6.8 miles long). The impact should form a crater, and not obliterate the comet. Tempel 1 also has an orbit that would allow the spacecraft to reach the comet wit a high velocity and on the sunward side, so that the impact would be sunlit and visible from Earth. So, as it turns out, Tempel 1 was the prime candidate for Deep Impact because it was in the right place at the right time."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesSepDec05DeepImpact.htm"
