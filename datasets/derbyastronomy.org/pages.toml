["https://derbyastronomy.org/AriesSepDec05STS114.htm"]
title = "Aries September-December 2005 - STS-114 Discovery Return To Flight"
full_description = "Aries The Journal of the Derby and District Astronomical Society September - December 2005 [Contents] STS-114/Discovery: Return To Flight By Anthony R. Southwell After a wait of about 2� years and after numerous launch date slips, the Space Shuttle Discovery took off on STS-114, the Return to Flight mission on 26th July 2005. The flight was due to launch on 13th July, but the launch was scrubbed at T - three hours, due to erroneous readings from one of four fuel sensors in the External Tank (ET). These sensors tell the Shuttle�s onboard General Purpose Computers (GPCs) when the ET is getting low on fuel, at that point the GPCs automatically shut down the Shuttle main engines. On the day of the of the first launch attempt, the fuel cells were tested and it was found that one of the sensors was giving a false reading. It was reading �dry� when it should be reading �wet.� In other words the sensor was convinced that the ET was empty or nearly empty, when in reality it was completely covered in super cold liquid hydrogen fuel. Mission rules stated that the Shuttle could not be launched if all four sensors were not in agreement. So, the launch was scrubbed and STS-114 was delayed for about a week, while NASA management and engineers worked to resolve the problem. The problem proved to be more difficult to track down, let alone solve. It was determined that the sensor was suffering from an intermittent electrical failure, and that no physical cause for this an anomaly could be found. So with no clear resolution to this problem, NASA management decided to, against its own flight rules, launch Space Shuttle Discovery on the STS-114 mission on July 26th. As it turned out, the fuel sensor never again gave any sign of trouble and Discovery was able to launch. Commander: Colonel (USAF Retired) Eileen M. Collins. Collins was the first woman to fly as Pilot and last as Commander on a Space Shuttle mission. STS-114/Discovery would be Collins' fourth spaceflight. Mission Specialist 1: Soichi Noguchi of the Japanese Space Agency. Noguchi was making his first spaceflight."
year_published = 2025
