["https://derbyastronomy.org/AriesWinter0708ToSeeNotSee.htm"]
title = "Aries Winter 2007/2008 - The Nature of Light and What Makes the Sky Blue"
full_description = "Aries The Journal of the Derby and District Astronomical Society Winter 2007-2008 [Contents] To See or Not To See - An Introduction to Astronomy By Tony Hubbard I�m new to astronomy. That�s not to say I haven�t had an interest in astronomy before now � I just haven�t had time to indulge (now I�m retired - and have even less time!). But, of course, anything new is prime territory for �Sod�s Law�. For me �Sod� is not an occasional visitor, it is a way of life. So much so that I have a formula (courtesy of a very bored US statistician) for calculating its likely effect on anything I do. If you are interested, here it is: But I intend to persevere, nonetheless. The first thing I thought I would do, my knowledge of all things astronomical being somewhat sketchy, was to join a society. And so, I contacted the DDAS and was warmly invited to the next observing meeting at the Flamsteed Observatory. The website showed that the next session was on the 4th August at 7.30pm. Just my luck, and unfortunately custom made for the intervention of �Sod�, I had three and a half weeks to wait. I hadn�t expected a local club to have a large telescope in an observatory, so I was quite excited (yes, even we middle-agers can still get excited � well, at least �quite excited�, as I said) at the prospect of seeing sights in the heavens for real. Well the day eventually came. The session seemed full of promise - the day was glorious, with not a cloud in the sky. So I set off early to allow plenty of time for mishaps. Although I had clear directions the ending seemed a bit uncertain � look for a 5 bar gate. I eventually arrived bang on time, having missed the gate on three �flybys�. But could this be it? A gate to a field, with no sign of life, not even a cow. And I�ve been in the scouts, so I was able to deduce that no vehicle had been through that gate for a while. I waited 15 minutes or so, but no one came near � �is it the right day, am I in the right place?� Well, I could always ring Dave Selfe and check, couldn�t I? Well no, I couldn�t because I couldn�t get a signal on either of my two mobiles!"
