["https://derbyastronomy.org/AriesJanApr06SocietyNews.htm"]
title = "Aries January-April 2006 - Society News"
full_description = "Aries The Journal of the Derby and District Astronomical Society January - April 2006 [Contents] Society News Reports by Anthony Southwell The 2005 Flamsteed Lecture was presented by Professor John Zarnecki, of the Open University. Professor Zarnecki was the principal scientist for the hugely successful Huygens lander probe which touched down on the surface of Saturn�s major moon Titan. Professor Zarnecki�s lecture was entitled Landing on Titan � 14th January 2005. The lecture itself was simply brilliant, Professor Zarnecki gave us all a fascinating insight of what it is like to be involved in such a worthwhile endeavour - the hard work that goes into every space science mission, most often for years prior to launch and can take up a person�s whole professional life, and finally the overwhelming sense of wonder and excitement on the day of the landing on Titan. Professor Zarnecki also presented data from the Titan lander mission that was 'hot of the press', as it were. These included details of the latest results from the Titan mission that were not due to be published in the science journal Nature for another week after Professor Zarnecki�s presentation to us! During his presentation Professor Zarnecki played for us a movie composed of images from the Huygens descent camera of the probe�s descent to the surface of Titan. Huygen�s took about two hours to reach Titan�s surface, but the movie took only thirty seconds to run! The views provided by the descent camera were startling, and seeing what looked like drainage channels on the surface below was quite mind-boggling, and then, all of a sudden, we were on the surface of that frigid moon, looking at a pebble-strewn vista. Quite remarkable. After the movie presentation was completed, the lecture audience broke into spontaneous applause, which lasted a good thirty-odd seconds, everyone in that room was so enthralled by wonders that Titan was presenting to us all. At the end of Professor Zarnecki�s lecture you actually felt that you had been to Titan yourself!"
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesJanApr06SocietyNews.htm"
