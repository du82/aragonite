title = "Observing Mars with the Brownies - Aston-upon-Trent - Wednesday 16th November 2005"
full_description = '''On a frigid Wednesday evening DDAS members Tony Razzell, Ian Bennett and Mike Lancaster treated a group of Brownies at the Memorial Hall in Aston-Upon-Trent to a view of Mars and the Moon through a variety of telescopes. The Society's 8" Meade LX-90 was available as well as a 4" refractor and tripod mounted binoculars, allowing the Brownies to get a variety of views and look at the Moon as well as Mars. Mars elicited many a cool! and wow! Even the local indoor bowls club came out later to take a look!'''
