["https://derbyastronomy.org/Culham200517.htm"]
title = "DDAS Visit to the Culham Centre for Fusion Energy in Oxfordshire - Saturday 20th May 2017"
full_description = "How do you build a star on Earth? On Saturday 20th May 2017 a group of 12 DDAS members headed down to Culham in Oxfordshire to find out. It might be usual for astronomical societies to visit observatories, and places of space and astronomy research etc., and indeed looking through our past trips on this website that has been the case. But on this occasion our secretary Brian Dodson had arranged something a little bit different. We were not disappointed. Awe struck would be good term. Fusion is the process that powers the stars including our own Sun. Nature has done this trillions of times across the universe but to our own species this presents something of a challenge. We've already done it in the apocalyptic power of the H-bomb but to release this source of energy in a sustained and peaceful fashion to provide power for the grid is something else entirely. As science presenter Brian Cox has said, it would be a 'get out of jail card' for the future of our energy needs. Our day began with 2 hours of fossil fuel burning from Derby to Abingdon on the south side of Oxford, where we stopped off at The Spread Eagle pub for an excellent lunch. Having replenished our own energy levels we drove over to the Culham Centre for Fusion Energy, which is operated by the UK Atomic Energy Authority. This was in fact an open day and we were one of four groups touring the site this afternoon. After receiving our security passes at the main gate we headed over to the centre itself where after tea and biscuits we were given a lecture on fusion energy and the work being carried out at Culham. The centre operates two main experiments - MAST (Mega Amp Spherical Tokamak) and JET (Joint European Torus). Following the talk the four groups split up to tour the facility and the DDAS party were taken to see the MAST experiment (Mega Amp Spherical Tokamak). A tokamak is a device that uses a powerful magnetic field to confine plasma in the shape of a torus. The tokamak is one of several types of magnetic confinement devices being developed to contain the hot plasma needed for producing controlled thermonuclear fusion power. MAST uses a spherical shaped containment vessel rather than the more conventional torus used by JET, and is one of the world's two leading spherical tokamaks (the other being at Princeton in the USA). We were shown around MAST by a very enthusiastic and enganging scientist. Having originally begun operating in 1999 the device is currently undergoing a major upgrade (MAST-U). It is designed to study the physics of plasmas and investigate the potential of the spherical tokamak route to fusion power. In particular the results from MAST-U will be used to shape the design of ITER (International Thermonuclear Experimental Reactor), the next generation of fusion reactor being built in the south of France. Our guide showed us video footage of the plasma inside MAST and the site of what will become the MAST-U control centre. Next we got up close to MAST itself before being shown a number of components from it, and also a scale model of the device."
