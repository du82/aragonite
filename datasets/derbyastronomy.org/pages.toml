["https://derbyastronomy.org/AllanChapmanLecture180524.htm"]
title = "DDAS 50th Anniversary Lecture - Dr Allan Chapman - John Flamsteed: Derby's Gift to Astronomy - Saturday 18th May 2024"
full_description = "DDAS 50th Anniversary LectureJohn Flamsteed - Derby's Gift to AstronomyDr Allan ChapmanSaturday 18th May 2024 On the afternoon of Saturday 18th May 2024, we were delighted to welcome Dr Allan Chapman from Wadham College, Oxford, to deliver a lecture at Derby Museum on John Flamsteed - Derby's Gift to Astronomy and Founder of the Royal Greenwich Observatory. This was one of several events the Society had organised for our 50th Anniversary year, and one of the most eagerly anticipated. It was held in the Old Library on the Wardwick, and attended by 100 people. These included members from both the Derby & District Astronomical Society and Derby Civic Society, as well as Friends of Derby Musuem and members of the public. Dr Chapman is arguably the world's leading expert on John Flamsteed, the first Astronomer Royal, and is a historian of science, Fellow of the Royal Astronomical Society, and founder member of the Society for the History of Astronomy. In addition to a distinguished academic career spanning nearly 50 years, he has presented the TV series Gods in the Sky and Great Scientists. Back in January 2013 on a cold and foggy evening, Allan was one of the presenters who came to Derby for the BBC Stargazing Live programme, which DDAS members attended. Dr Chapman was on top form for his lecture at the museum, keeping the audience educated and entertained by his talk on Derby's illustrious astronomical son. This was followed by a lively question and answer session, and finally a chance for attendees to meet and chat with Allan. We are grateful to Derby Museum, and especially Museum Events Organiser Dan Webber, for arranging the venue and promoting the talk. Here are a selection of member's photos of the event. Related Topic: DDAS Visit to Dr Allan Chapman's Collection of Reconstructed Astronomical Instruments in Oxford - 19th August 1981"
