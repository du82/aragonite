["https://derbyastronomy.org/Greenwich251008.htm"]
title = "DDAS Visit to the Royal Observatory, Greenwich - Saturday 25th October 2008"
full_description = '''Twelve DDAS members including myself made our way to the Royal Observatory in Greenwich Park, London on the 25th October 2008 for a special guided tour of this most historic site. We were shown around by Gilbert Satterthwaite who is Chairman of the Society for the History of Astronomy (SHA) and President of the Orpington Astronomical Society. In fact it was DDAS member Arthur Tristram, also a member of the SHA, who asked Gilbert if he would be able to give us a tour. Gilbert joined the staff of the Royal Observatory on leaving school in 1952 and used some of its most famous instruments including the Airy Transit Circle. It is no exaggeration to say that Gilbert was passionate about the Royal Observatory and was the ideal person to show us around. After meeting Gilbert at the Observatory gates he gave us an introduction to the site and its history. He then showed us around Flamsteed House, built for England's first Astronomer Royal, the Reverend John Flamsteed (1646-1719), as both living quarters and observatory. Charles II appointed John Flamsteed as his first Astronomer Royal in March 1675 and the Royal Observatory was built to improve navigation at sea and "find the so-much desired longitude of places". Flamsteed has of course a special meaning for the DDAS as he was born in Derbyshire, attended Derby School, and in the years leading up to his appointment at Greenwich made many important astronomical observations from his father's house on Queen Street Derby. The first floor of Flamsteed House contains Christopher Wren's famous Octagon Room. This is a beautiful piece of 17th century architecture but it is hard to imagine it functioning as a practical observatory, even poking the very long focal length refractors of the time out of the windows as it was designed to do. As Gilbert explained, Flamsteed never really used the Octagon Room as an observatory and conducted his observations from more dedicated facilities he went on to construct nearby. After viewing the Octagon Room we entered the Time Galleries to view the remarkable clocks constructed by John Harrison in the 18th century. These were designed to be the most accurate chronometers of their day and were constructed in order to provide an accurate means of obtaining longitude at sea. Gilbert then introduced us to the range of instruments used by a succession of Astromers Royal that are housed in the Meridian Building. These included among others the Iron Quadrant installed by Edmund Halley, who succeeded Flamsteed as Astronomer Royal and the brass quadrant installed by the third Astronomer Royal, James Bradley. Gilbert then gave us a detailed look at Airy's Transit Circle, installed in 1851 by the seventh Astronomer Royal George Biddell Airy. Gilbert himself spent many hours using this instrument, and made the very last official observation through it in 1954. Airy's Transit Circle sits precisely on the Greenwich Meridian, at 0 degrees longitude. It comprises an 8-inch f/17 refractor mounted very precisely on a system of counterweights. The transit circle was used to make two measurements - the time at which a star crosses the meridian, as it travels from East to West across the sky, and the angle of the star above the horizon. From these measurements an astronomer could determine the precise position of the star in the sky in Right Ascension and Declination. Conversely, if the star's coordinates were already known, then the transit of a star across the meridian could be used to set the clocks at the observatory. The timings were made by the astronomer watching the star move across a series of vertical wires. Each time the star crossed a wire, the astronomer at the telescope pressed a button to send a signal to a drum chronograph which recorded the precise times at which the star crossed the wires. The angle of the telescope was recorded with great precision using an array of microscopes attached to the side of the pier, with a precision of 0.01 seconds of arc.'''
year_published = 2025
clearnet = "https://derbyastronomy.org/Greenwich251008.htm"
