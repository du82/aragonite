["https://derbyastronomy.org/AriesMayAug06NewHorizons.htm"]
title = "Aries May-August 2006 - New Horizons' Voyage to Pluto - Part 2"
full_description = "Aries The Journal of the Derby and District Astronomical Society May - August 2006 [Contents] Into the Unknown � New Horizons� Voyage to Pluto - Part 2 By Anthony R. Southwell In part one of this article I described the launch of New Horizons on its journey to Pluto, back in January 2006, and then went on to describe Pluto�s discovery and included a �potted� history of what we have learnt about Pluto since its discovery, much of which has been gleaned in recent decades. We now know Pluto to be an enigmatic world, which does not seem to fit its place within the Solar System. It is an oddball of a world. Pluto is tiny, smaller than our own Moon, so it could not be responsible for the gravitational �wobbles� of Uranus and Neptune, which prompted the search for Pluto in the first place. Its orbit is strange, for a time, it comes within the orbit of Neptune and then swings out again, in its 248-year dance about the Sun. Also its orbit is inclined to the plane of the orbits of the other planets of the Solar System, by 17�, so it orbits both above and below the plane of the ecliptic. This sounds the alarm bells. Did Pluto form at the same time as the other planets in the Solar System? Its orbital characteristics would seem to say not. If that is the case, what is Pluto? The more we learnt about Pluto, the more of an oddball this small frozen world became. I finished the first part of this article by saying that I would round off what we already know about Pluto and take a look at the continuing debate concerning Pluto�s status as planet. Following that, the second part of the article would take a look at the New Horizons spacecraft and its mission. When this author was writing the first part of that article, we were living in a Solar System that comprised nine worlds, then the International Astronomical Union (IAU) Congress occurred on August 24th 2006, and everything changed! So much for writing a simple second part to this article! At the moment there seems to be a controversy raging in the aftermath of the IAU Congress and its decision as to Pluto�s present status, more on that later."
