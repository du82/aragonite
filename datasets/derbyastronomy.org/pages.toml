["https://derbyastronomy.org/AriesWinter0708SocietyNews.htm"]
title = "Aries Winter 2007/2008 - The Nature of Light and What Makes the Sky Blue"
full_description = "Aries The Journal of the Derby and District Astronomical Society Winter 2007-2008 [Contents] Society News Reports by Anthony Southwell The Annual Flamsteed Lecture at the University of DerbyWednesday 10th October 2007 Professor Collin Pillinger CBE FRSPlanetary and Space Sciences Research Institute, The Open University.Fifty Years In Space. In this fiftieth anniversary year of the launch of Sputnik 1, which heralded the beginning of the Space Age, it seemed only fitting that the University of Derby invite Professor Colin Pillinger to present his Fifty Years In Space lecture, which was subtitled Space Is A Funny Place, which, incidentally, is the title of his new book. Professor Pillinger�s presentation was a sideways examination of space exploration as seen through the eye of the cartoonist. From the dawn of the space race to the more recent missions to the Moon and the planets of the solar system, comets and asteroids, space has provided fertile ground for cartoon jokes, especially when things go wrong. The Editor remembers the field day the world�s cartoonists had when it was discovered that the Hubble Space Telescope was deployed with a misshapen mirror and was therefore short-sighted! Professor Pillinger also spoke about the Beagle 2 mission to Mars, of which he was the leader and principal investigator. Professor Pillinger spoke of the trials, the sheer amount of hard work, the meetings, the endless round of media interviews in order to raise the profile of the mission (and to raise funds for it), the joy at the launch in June 2003 and the feelings of utter disappointment when, on Christmas Day 2003, Beagle 2 should have sent a message from the surface of Mars. That message never made it to Earth. All in all the entire lecture was a fascinating look into the world of space exploration seen through the eyes of someone who has actually been involved in it. Indeed, Professor Pillinger has worked on the lunar samples returned by the Apollo astronauts. We were due to have Professor Pillinger come to the 2003 Flamsteed Lecture to discuss the Beagle 2 mission, but he could not make the lecture due to operational issues concerning Beagle 2 (which was on route to Mars at that time), but it was real pleasure to see him this time 'in the flesh' and share his experiences and observations."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesWinter0708SocietyNews.htm"
