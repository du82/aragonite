["https://derbyastronomy.org/AriesJanApr06Editorial.htm"]
title = "Aries January-April 2006 - Editorial"
full_description = "Aries The Journal of the Derby and District Astronomical Society January - April 2006 [Contents] Editorial So here we are again, and what does the 2006 have in store for us? Well the front cover for this edition of Aries should give you a clue. As I write this editorial, we are a little over two weeks to the launch of one of the most ambitious space missions ever conceived of. On January 17th 2006 the New Horizons spacecraft will start its long journey into history, its destination, that frozen outpost of the Solar System, Pluto. At long last we have a spacecraft that is going to investigate that mysterious and chilly body. New Horizons will conduct a fly-by investigation of Pluto. The spacecraft will have to get to its destination fast, for it is engaged in a race against time. It is hoped to get New Horizons to Pluto before that body�s tenuous atmosphere freezes out as Pluto begins to recede from the Sun in its orbit. For that to happen, New Horizons will be literally flung out of the warm heart of the Solar System towards Pluto, which means that the spacecraft will not be slowing down, hence the Pluto fly-by. But the mission does not stop there, New Horizons will carry on, it is hoped to send New Horizons on to encounters with at least two Kuiper Belt Objects (KBOs), the class of objects to which it is thought that Pluto belongs to. To my mind the New Horizons mission marks the end of the first phase of the exploration of the Solar System, what the second phase of Solar System exploration will reveal is anyone�s guess, nor would I even try to do so. The New Horizons mission will not be a short one. It will take the spacecraft nine years to traverse the Solar System to get to Pluto. The Pluto encounter is scheduled to take place in 2015. To aid New Horizons in its journey to this frozen world, the giant of the Solar System, Jupiter, will lend a hand. New Horizons will fly by Jupiter and get a velocity 'boost' courtesy of the giant planet�s gravitational field. But that is not to say that New Horizons is a 'slow' spacecraft. New Horizons will be launched atop an Atlas V heavy lift launch vehicle that will throw the spacecraft out of the gravity well of the Earth and onto the first leg of its journey. New Horizons is also quite a small spacecraft, definitely not a 'monster' probe like Cassini/Huygens, so being that New Horizons is so small, it is also a very light spacecraft. The Atlas V will impart quite a considerable amount of energy to New Horizons in the very early stages of its journey. In addition to this, to help New Horizons get to Jupiter, a Centaur upper stage will give New Horizons additional velocity. To give you some idea of how much velocity the Atlas V and the Centaur upper stage combination will give to New Horizons, it took the Apollo astronauts about four days to reach the Moon, New Horizons will pass the orbit of the Moon on the evening of its launch day! Furthermore, it took the Galileo spacecraft six years to get to Jupiter and Cassini/Huygens took four years to pass that gas giant. New Horizons, on a more direct route, will pass the orbit of Jupiter in thirteen months! This little spacecraft is really screaming out of the inner Solar System to get to Pluto."
