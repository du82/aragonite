["https://derbyastronomy.org/BoulbyMineVisit151106.htm"]
title = "DDAS Visit to Boulby Mine"
full_description = "A while ago I watched a Horizon programme concerning the search for dark matter � that elusive material which many scientists believe to account for the �missing mass� in our universe. I was intrigued by the underground experiments being conducted at Boulby Mine in North Yorkshire that were featured in the programme. What an amazing place for a DDAS visit that would be I thought! I made the suggestion to our Secretary Dave Selfe and he got in contact with the group at Sheffield University who are conducting the experiments at the mine. Luckily for us they do allow small groups down the mine from time to time and we booked ourselves on a visit. So on the 15th November 2006 a group of six of us including myself, Arthur Tristram, Mike Dumelow, Graham Ensor, Neil Clifford and Adrian Brown travelled up to North Yorkshire for what was to be a trip down the deepest mine in the UK. We were met by Dr Sean Paling of the Institute for Underground Science (IUS), Department of Physics and Astronomy, University of Sheffield, who was to be our guide for the day. He showed us into the John Barton Building � the purpose built surface facility for dark matter research at the mine site. As well as offices this building contains laboratories, computing facilities, a kitchen, conference room, shower and changing rooms. The dark matter facilities at Boulby are part of the IUS, which in turn is a member of the UK Dark Matter Collaboration (UKDMC), which also includes the CCLRC - Rutherford Appleton Laboratory (RAL), The University of Edinburgh, and Imperial College London. Funding for the dark matter facilities at Boulby is largely provided by central government in the form of a Joint Infrastructure Facility (JIF) grant. After an overview of what we were to expect from our tour and a brief introduction to the facility, Sean showed us to the changing room where we donned the clothing required for our visit down the mine. This involved removing shoes, shirts and trousers, and donning a T-shirt, an orange reflective one-piece overall, equipment belt and safety glasses. Any valuables and anything containing batteries were removed and placed in lockers. Next we had a safety briefing where the mine safety procedures and precautions were explained to us. We were also shown how to use the self-rescuer. These are portable oxygen sources for providing breathable air when the surrounding atmosphere is contaminated or un-breathable, for example in the unlikely event of a fire down the mine."
year_published = 2025
clearnet = "https://derbyastronomy.org/BoulbyMineVisit151106.htm"
