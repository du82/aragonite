["https://derbyastronomy.org/ObservingSession201007.htm"]
title = "DDAS Observing Session - Saturday 20th October 2007"
full_description = '''Metcheck.com looked promising, the Met Office website looked promising and the weather itself looked promising. No clouds in the sky meant that an observing session at The Flamsteed Observatory could take place and we would be treated to a fantastic evening's viewing of the skies. However we were in competition to the England v South Africa Rugby Union World Cup Final! Adrian Brown and I arrived early to open up the observatory and set up his ED80/HEQ6. While the kit was being transported from the car park to the observatory we were treated to the first sight of the night. Bang on cue at 18:39, the International Space Station made its one visible pass of the night over Brailsford from west to south east. A wonderful deep blue sky provided the backdrop as it shone at about -1 magnitude as it passed overhead. As the sky darkened I pointed my Canon EOS300D towards the region just below Arcturus, low in the north west. I was hoping to capture Comet LONEOS but it was too close to the horizon to be visible through the camera and I was also restricted to 30 second exposures. So, I didn't image it... shame! I gave up! The fantastic 10" Newtonian in the dome was swung to it's first (and only object) of the evening, namely the moon, only to discover that the moon (a couple of days past first quarter) was behind a tree and so viewing that would have to wait for a bit before it came into view. In the meantime, Adrian had got the ED80 set up and the GOTOs were very accurate. All that was needed was for the sky to darken. DDAS members started arriving and in total there were eight of us, including the addition of a Meade LX90 8" SCT to add to the viewing pleasure. In the dome, the views of the moon (which had moved enough to be visible in the 10" Newtonian) were breathtaking. The lunar terminator is something I never tire of, and yet again I wasn't to be disappointed. The crater Copernicus was right on the border between day and night with the centre of it filled with shadow. Clavius was awesome and the mountainous region around Plato was stunning. The assembled members of the society had some fantastic views of the lunar landscape with a 26mm eyepiece and then with an added 2x Barlow lens.'''
year_published = 2025
clearnet = "https://derbyastronomy.org/ObservingSession201007.htm"
