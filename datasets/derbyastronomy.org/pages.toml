["https://derbyastronomy.org/AriesSepDec05HowFarStars.htm"]
title = "Aries September-December 2005 - How Far Away Are The Stars?"
full_description = "Aries The Journal of the Derby and District Astronomical Society September - December 2005 [Contents] How Far Away Are The Stars? By Maurice Batchelor In early days, mapping the Solar system had been difficult enough, but figuring out the distances of stars was to present much more of a problem. The first man to tackle this very seriously was the Rev James Bradley, who was in fact the third Astronomer Royal. He succeeded Halley in 1742 and he held the position until he died 20 years later. Bradley was born in 1693 and was educated at Oxford. He then proceeded to take up the position of vicar at Burstow in Monmouthshire (as it was then). In the year 1721, he became Professor of Astronomy back at Oxford, remaining there until the death of Halley, when he moved to Greenwich. Bradley was a very careful observer and he decided to improve the existing star catalogues. He measured the positions of more than 6,000 stars and his results are still of great value, even today. In order to achieve this, one method he used was parallax. This is the apparent movement of one object relative to another when viewed from a different point. For example, suppose you hold a pencil at arm�s length and line it up with a distant object using just one eye, then without moving your head or the pencil, use the other eye. The pencil will no longer be lined up with the distant object. It will appear to have shifted. This method of assessing the distances of stars is only effective with stars of less than a few hundred light years away. For stars of greater distances, the shifts become so small that they are swamped by unavoidable errors in observation. Often in astronomy, 2 types of parallax exists as follows: This is the apparent movement of one celestial body relative to another when viewed from different parts of the Earth�s surface. Owing to the small size of the Earth, and the vast distances of the stars, the Diurnal Parallax of stars is absolutely insensible, but it is noticeable with closer objects."
year_published = 2025
clearnet = "https://derbyastronomy.org/AriesSepDec05HowFarStars.htm"
