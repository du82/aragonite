full_description = "Trout Rising Series Welcome to the DeYoung “Trout Rising” Series Gallery. This is a portfolio of DeYoung’s Trout Rising work. It been organized for you to search either by Species or by Series. Just click on an image thumbnail below to see the full painting in a separate viewing window. In the world of a dry fly fisherman, there is no sight more exciting then a trout’s snout breaking the water as it takes a bug. Being a reader of the “Drake Magazine”, one of Derek’s favorite cover photos was of a trout pushing a bubble of water, just before the water tension gave way and the mayfly fell into the trout’s mouth. Derek has done a series of paintings called the “Trout Rising Series” based on this idea. Rising Brown (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Henry's Fork Riser (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Drive-In Hatch (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Gates of Paradise (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Moon Rising (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Hex Hatch (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) 6th Street Brown (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Downtown Brown - PERSONAL GALLERY (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) ◄ 1 2 Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047"
