full_description = "The Lind Family Loves their Commissioned Painting by Derek & Janell on June 1st, 2016 “The first time I saw “Derek’s work was at a local restaurant in Missoula, Montana. Immediately I knew his art would be perfect above the fireplace in our home on the nearby Bitterroot River. After spending some time looking at the various paintings on Derek’s website, I came up with an idea to incorporate our […] READ MORE A Custom Commissioned Barracuda Painting by Derek & Janell on April 28th, 2016 Derek just finished this custom commission of a 2 panel Barracuda Face. He painted it for Lynn Bell who owns the Square Grouper Bar and Grill in the Florida Keys. She wanted a Barracuda Face with the logo of her restaurant in the mouth. This is a picture was taken once the painting was hung. […] READ MORE A note from a happy customer by Derek & Janell on April 8th, 2016 It is such a wonderful aspect of our business to make people happy with art! One of Derek’s custom commission clients just received his original oil painting “Brown Trout Flank -Green”. We really appreciated his emailed response. “The painting arrived 100% in tack and beautifully shipped. ALL I CAN SAY IS I AM BLOWN AWAY!!!! […] READ MORE Reel Service Project with Vedavoo by Derek & Janell on March 14th, 2016 Every year, Vedavoo organizes their “REEL SERVICE” project to raise money to support worthy causes – pairing their best packs with their favorite artists. This year, they dedicated the whole of the proceeds to Project Healing Waters Fly Fishing, and the veterans they serve. They hand-built a series of packs, bags, and gear items – then sent these “blank canvases” […] READ MORE Brown Trout/Tarpon Hybrid by Derek & Janell on October 25th, 2015 The Brown Trout/Tarpon Hybrid finally found its place on our customer’s outdoor living room. Derek worked on this piece while at the ICAST show in Orlando this year as a custom commission piece for a client who loves to fish Brown Trout and Tarpon, and this