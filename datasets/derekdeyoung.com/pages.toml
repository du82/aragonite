["https://www.derekdeyoung.com/gallery/series/riverscapes"]
title = "Riverscape Series | Derek DeYoung"
description = "Welcome to the DeYoung “Riverscape Series” Gallery. This is a portfolio of DeYoung’s Riverscape work. It been organized for you to search either by Species or by Series. Just click on an image thumbnail below to see the full painting in a separate viewing window. “I have been doing a lot more plein air painting […]"
full_description = '''Riverscape Series Welcome to the DeYoung “Riverscape Series” Gallery. This is a portfolio of DeYoung’s Riverscape work. It been organized for you to search either by Species or by Series. Just click on an image thumbnail below to see the full painting in a separate viewing window. “I have been doing a lot more plein air painting recently (painting out in nature – in the mountains and on the river.) I have primarily been a studio painter my whole life. The control in the studio setting with lighting and easels that can put your painting in any position is incredible. While the control in the studio is awesome, you throw that all away when you are painting in the open air. The wind is threatening to throw over painting whole time. It might rain or snow (or both). Recently I went to Armstrong’s Spring Creek and walked the entire creek looking for a place to paint. I ended up going just below the parking lot, just took a canvas and bag of paints and a palette and sat on rock. The setting was literally inches from the water. I sat and held the canvas and worked in a completely different way than usual. It felt like a return to simpler things. But any artist that isn’t looking at new challenges and how to broaden their skill set isn’t growing. The goal here for me is to be an old man who has experienced many interesting things in life through his passion for painting. These new challenges don’t always translate into what I might sell more of per say. As for plein air painting, it came down to the fact I have wanted to do more of this for a while. To develop my own style in painting river and landscapes. It is so inspiring…chasing trout in some of the northern Rockies most beautiful rivers and lakes, I often set the rod down, and consider the scene in front of me, not in how to best fish it, but how to best paint it.” – DeYoung "Brook Trout - Waterfall" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Yellowstone Thorofare (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) Grizzly Gaze (ORIGINAL SOLD , PRINTS AVAILABLE) "Who Cooks For You" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) Emigrant Risers (ORIGINAL SOLD, PRINTS AVAILABLE) Paradise Valley Owl (ORIGINAL SOLD, PRINTS AVAILABLE) The Old Owl's Favorite Steelhead Run (ORIGINAL SOLD, PRINTS AVAILABLE) Brown Trout - Waterfall (ORIGINAL SOLD & PRINTS AVAILABLE) Harvest Moon Riser (ORIGINAL SOLD, PRINTS AVAILABLE) Henry's Fork Riser (ORIGINAL SOLD, PRINTS AVAILABLE) Teton Risers (ORIGINAL SOLD, PRINTS AVAILABLE) Teton Riser Day (ORIGINAL SOLD, PRINTS AVAILABLE) Gates of Paradise (ORIGINAL SOLD, PRINTS AVAILABLE) South of Ennis (ORIGINAL SOLD, PRINTS AVAILABLE) Van Gogh - Steelhead - PERSONAL COLLECTION Eagle with Trout (ORIGINAL SOLD, PRINTS AVAILABLE) Yellowstone Study (ORIGINAL SOLD, PRINTS AVAILABLE) Bird Float (ORIGINAL SOLD, PRINTS AVAILABLE) 1 2 ►'''
