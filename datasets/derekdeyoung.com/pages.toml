full_description = 'Trout Rising Series Welcome to the DeYoung “Trout Rising” Series Gallery. This is a portfolio of DeYoung’s Trout Rising work. It been organized for you to search either by Species or by Series. Just click on an image thumbnail below to see the full painting in a separate viewing window. In the world of a dry fly fisherman, there is no sight more exciting then a trout’s snout breaking the water as it takes a bug. Being a reader of the “Drake Magazine”, one of Derek’s favorite cover photos was of a trout pushing a bubble of water, just before the water tension gave way and the mayfly fell into the trout’s mouth. Derek has done a series of paintings called the “Trout Rising Series” based on this idea. "Native Rainbow" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "Firehole River Riser" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "Flowers Camp" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "2 Panel - Brown Riser" (ORIGINAL SOLD, AVAILABLE - CLICK ON SHOP) "Who Cooks For You" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) "Rising Brookie" (ORIGINAL SOLD & PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "Oxbow Campsite" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP) Man in the Mountain (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "Spring Creek Battle" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP) Emigrant Risers (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Browns - Three Risers (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Harvest Moon Riser (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Brown Stonefly (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Brown Callibaetis (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Teton Riser- Night (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Teton Riser - Day (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Jungle Tarpon (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Hopper Dropper (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) 1 2 ►'
