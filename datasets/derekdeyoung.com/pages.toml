["https://www.derekdeyoung.com/about-derek/derek/what-people-are-saying"]
title = "What People Are Saying | Derek DeYoung"
description = "Gratitude and praise from fans of DeYoung Fine Art who tell about their connection with Derek's innovative fish art & painting style and unique merchandise."
full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 My wife and I wanted to share how much we love the cubist dripping brown canvas we got from you. Plus, it has brought me really good luck fishing lately. I caught a nice 24” hookjaw after Christmas. Two weeks later, I caught a brown trout of a lifetime: 33” & 18lbs5oz. Both were released. Hope the luck continues 🙂 Thank you again for creating art that inspires fishermen to enjoy their passion in the home and on the water. Hi Derek and Janell, Got my 4 Panel Brown Pere Marquette canvas print yesterday, and it’s absolutely beautiful! I’ve long admired your work and I figured it was time to have a canvas above my tying desk. On the weekends I enjoy chasing browns in the backcountry with my dachshund princess. You’d love it up there, high elevation mountains with lots of streams, lakes and lots of great wildlife to take pics of. I wish you both the best and I’ll be purchasing more in the future. Cheers – Bobby “From my earliest of days on the Fly Fishing Show circuit, I knew I always wanted to have something to hang on my wall by Derek DeYoung, and when I inherited a little something from my Grandma G when she passed away, the economy had taken a turn for the worst, but I decided then, why not do it now – then I can enjoy it longer – and so I did commission this painting in his earlier days – 4 special fish of mine, from special places and special moments. My Dad wrote me a letter when I told him about the art and sent an image that I’ve kept – and it said something to the effect: “in economic hard times, art is one of the last things people buy, so this says about you, you have courage, knowing no matter what happens, you’ll make it through.” I’d say, that was also my Grandma, who loved the arts and loved that I walked to the beat of my own drum. Thanks Derek for the amazing piece we collaborated on way back when!” – Nicole Bellevue, WA"
