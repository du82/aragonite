full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 Fine Art Originals “I place more importance on using a unique style and palette rather than painting a fish to look photo realistic. When painting fish, I try to capture all the intricacies they possess; their scales, patterns, dimension and texture. For me, the most inspirational vision comes once I’ve landed a particularly beautiful fish. I hold it up, tilting the fish back and forth in the sunlight, allowing all the subtle colors and patterns to come alive. After setting the fish back into the water and releasing it into the depths, the only thing on my mind is getting back to my studio to bring that fish back to to life on my canvas.” – Derek DeYoung Watch Derek as he works on “2 Panel Redfish Confetti” Abstract Brown Trout – Bear – Original Painting $12,500.00 Add to cart1 in stock Barred Owl In Flight – Original Painting $8,400.00 Add to cart1 in stock Starry Night Owl – Original Painting $7,200.00 Add to cart1 in stock Cutthroat Trout – Tarpon Mount (Original Painting on Mount) $5,500.00 Add to cart1 in stock Yellowfin Tuna – Fiberglass Mount (Original Painting on Mount) $5,000.00 Add to cart1 in stock Sale! 4 in 1 – Tarpon Mount – (Original Painting on Mount) $6,200.00 Original price was: $6,200.00.$4,995.00Current price is: $4,995.00. Add to cart1 in stock Abstract Brook Flank – Framed Original Oil Painting On Board $2,500.00 Add to cart1 in stock Abstract Brown Flank 1 – Framed Original Oil Painting On Board $2,500.00 Add to cart1 in stock Abstract Brown Flank 2 – Framed Original Oil Painting On Board $2,500.00 Add to cart1 in stock Abstract Brown Flank 3 – Framed Original Oil Painting On Board $2,500.00 Add to cart1 in stock Brown, Barred and Bear – Original Painting $7,400.00 Add to cart1 in stock River Life – Original Painting $7,400.00 Add to cart1 in stock 1 2 →"
