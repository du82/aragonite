["https://www.derekdeyoung.com/about-derek/media/media-2"]
title = "Media | Derek DeYoung"
description = "July 2011 Derek’s Trout Confetti#1 featured on the front cover of Jackson Hole’s “One Fly” Magazine           September 2010 Derek and The Drake’s Geoff Mueller spent a couple days fishing in Montana this summer. While waiting out a furious thunderstorm under a bridge on the Madison River, the two hatched ideas […]"
full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 Derek and The Drake’s Geoff Mueller spent a couple days fishing in Montana this summer. While waiting out a furious thunderstorm under a bridge on the Madison River, the two hatched ideas for this cover. The scene depicts a famous hole on the Big Horn River, “The Drive In”. As the harvest moon rises, a large brown trout in spectacular spawning colors takes his last meal of the day. An article on Derek follows inside the magazine as well titled “The Artist”. “Livingston, Montana, at dusk unravels like a cliche “Welcome to the West” postcard. Through my bug-smashed windshield, I spot the century-old Murray Hotel, and the one-time Northern Pacific railway line that linked Livingston to adventurers seeking Yellowstone National Park. Today the town is home to nearly 7,000 residents – a mix of writers, including Jim Harrison; artists, like Russell Chatham; famous fishing names such as Dan Bailey and the Anderson clan; along with contemporary ranchers, bikers, goths, meth-heads, the rich, and the destitute. But the community’s most notable minority might be the fraction of those people that don’t fish. Rolling into Derek DeYoung’s driveway, I am greeted by two dogs. The house doubles as a studio space for DeYoung’s art business: turning river fodder into iconic, abstract fish phenomena. Inside, his trout rendering eat wall space throughout the house. A colossal fish carving dangles above the staircase that leads to his studio. But we detour first to the computer room, where the 30-year-old pulls up digital images from a recent excursion to the South Fork Flathead. A shot of DeYoung hoisting a 10-pound bull trout swallows the screen.” Derek’s 4 panel “Tarpon on Turtle Grass” was featured in Fly Fishing in Salt Waters Magazine November/December 2008 issue on page 57 Zach Matthews writes “Derek DeYoung is arguably the hottest young painter working in the outdoor world right now. Tune in to understand his philosophy, his market, and why he just loves to paint trout.”"
