full_description = 'Wildlife Series Welcome to the DeYoung “Wildlife Series” Gallery. This is a portfolio of DeYoung’s Wildlife Series work. It been organized for you to search either by Species or by Series. Just click on an image thumbnail below to see the full painting in a separate viewing window. As fly fisherman, we are exposed to amazing wildlife scenarios playing out in front of us as as we pursue trout. Some of the craziest things Derek has seen have happened while standing waist deep in rivers around the west. This series of paintings are inspired by the things Derek sees or imagines while out on the river. "Starry Night Owl" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) "Barred Owl In Flight" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) "Brown, Barred and Bear" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) "Deadliest Catch" (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Yellowstone Thorofare (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) River Life (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) Grizzly Gaze - (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Garden of Eden - (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Jaguar Sunset - (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Tune of the Apocalypse (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) "Who Cooks For You" (ORIGINAL & PRINTS AVAILABLE - CLICK ON SHOP) Paradise Valley Owl (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Black Ghost (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Grizzly Portrait (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Eagle With Trout (ORIGINAL SOLD, PRINTS AVAILABLE - CLICK ON SHOP REPRODUCTIONS) Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047'
