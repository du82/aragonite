full_description = "The DeYoung + Costa T Shirt Collection by Derek & Janell on August 6th, 2018 Costa Del Mar is one of those undisputed champions of what they do… Polarized Fishing Sunglasses. But Costa is a company that sees its success as an opportunity to change some minds and do some good conservation wise. And I mean a lot of good! I have worked with Costa to raise money for Bonefish Tarpon Trust and they are a shining beacon of what all fishing companies should strive for. Because of that, when I got a call that they wanted to send their new apparel manager down to the Florida Keys to pitch a collaboration with me, I was very excited and humbled! The meeting was unique, spending a late night at the Square Grouper Bar and Grill, sampling their extensive wine list, then an early morning aboard my salty old Redfisher, chasing Tarpon, Cuda and Blacktip sharks. We got into some nice fish, and had some great brainstorming ideas for the new T Shirt line. By the way… These shirts are great quality and an amazing value @ $20! Check out the T shirt collaboration here Categories Fishing Adventures Fresh off the Easel In the News Merchandise Updates Promotions Sharing Something Special Uncategorized What People are Posting Latest Posts20% Off All Pilsner Glasses2025-02-06Celebrate at the end of a long day of throwing …One Week Only, 20% Off All Phone Cases2025-01-09If you just purchased a new iphone or just want …Join Us at the Grand Opening of DeYoung Gallery2024-10-31iphone 16 Cases Are Now Available2024-09-2315% Off All Canvas Prints2024-09-22Canvas Prints are a great option for those who want … Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047"
