["https://www.derekdeyoung.com/about-derek/dereks-art"]
title = "Derek DeYoung Answers Questions about His Fish Art"
description = '''"When chest deep in a river, I'm not just chasing fish, I'm searching for a magical experience or vision that inspires me & raises my paintings to a higher level'''
full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 “My work has veered off from the traditional fish illustration style. I place more importance on using a unique style and palette rather than painting a fish to look photo realistic. The reason I’ve chosen fish as the subject of my life’s work is I find fish to be intriguing, not just as a fisherman, but as an artist. When painting fish, I try to capture all the intricacies they possess; their scales, patterns, dimension and texture. When chest deep in a river, I’m not just chasing fish, I’m searching for a magical experience or vision that will inspire me, and raise my paintings to a higher level. For me, the most inspirational vision comes once I’ve landed a particularly beautiful fish. I hold it up, tilting the fish back and forth in the sunlight, allowing all the subtle colors and patterns to come alive. After setting the fish back into the water and releasing it into the depths, the only thing on my mind is getting back to my studio to bring that fish back to to life on my canvas.” “I used to think that Derek was an extremely talented artist. Then we went fishing. Now I’m not sure whether he’s an angler with a brush or an artist with a fly rod. Either way, there are not many people in the world able to combine the two geniuses as well as he does. Even my non-fishing friends (there are a few) are captivated by his work….” Read Jim’s story & more A: “When I first got into the fly fishing world, my goal was to bring something new to the table. I have no illusions that I am the best painter out there, but I think I am one of the more creative artists. I want to bring you something fresh and new every time. That was a challenge in the beginning of my career, because fresh and new is not always welcome. I had people tell me to take a hike and that I will never be embraced by the fly fishing world. This caused me to work harder. Now, bright and fresh is the norm in the fly fishing industry. I am proud to have been part of that movement.”"
