["https://www.derekdeyoung.com/commissions"]
title = "Commissions | Derek DeYoung"
description = "Commissioning a custom painting is often the best way to get your hands on an original painting by Derek. Process is easy & fun. Book your spot 406.333.2217"
full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 Commissioning a custom painting is often the best way to get your hands on an original painting by Derek, and it is a very easy and fun process. Derek keeps a list of commissions, and depending on time of year is usually booked from one to six months out. Send us your information and ideas and we’ll get back to you as soon as possible to discuss your custom artwork. “They are amazing to see in person – much greater than I even expected! I’m really fortunate to have gotten in touch with Derek’s work and to proudly show it in my home. Fits perfectly well here in Naples, Florida!” “My favorite commissioned painting was of my two sons catching large, beautiful trout on the Missouri River and the Madison River. It was through numerous conversations that Derek came up with the idea of having a neutral setting in between the two boys that allowed for the painting to actually be two physically separate paintings that were connected together. So for now, I am the proud owner of one large painting of my two sons holding up fish in a driftboat. At some point, as each boy grows up, we can separate that painting so that each boy can have his own painting. Brilliant!” “When we finished our home in Montana, looking at the fireplace, it did not take one second before my wife and I thought, “this place needs a DeYoung.” We later met Derek and Janell at an event in San Francisco where we talked about what we wanted. Derek then “saw” a vision that is now turning into the centerpiece of our home.“ “Derek, Thanks again, you truly have inspired not only myself but my students that I teach. You are the Van Gogh in the fish world. Keep Rockin’ – Rock the Arts! ” Sincerely, Matthew All images and content copyright 2024 Canvasfish.com, LLC. All rights reserved. Livingston, Montana. Welcome to the collection of fish paintings by fish artist Derek DeYoung, whose work is dedicated to the avid angler. A fresh view on a classic subject."
