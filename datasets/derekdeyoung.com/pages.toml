["https://www.derekdeyoung.com/about-derek/derek"]
title = "About Derek DeYoung"
description = "A little of the personal story of innovative fishing artist Derek DeYoung. Born near Lake Michigan where his love of fishing was ignited and grew from there"
full_description = "Facebook Vimeo Instagram Pinterest Email us: [email protected] Call us: 616-308-0255 Gallery: 209 South Main, Livingston, MT 59047 Derek DeYoung was born on a bayou near the shores of Lake Michigan where his love of fishing was ignited. Over the years his art has veered from the classical fishing art, placing more importance on using a unique style and palette. Using oil paints on canvas, he artfully captures all the subtle intricacies fish possess; their patterns, dimension and texture. In his artwork DeYoung is constantly pushing the limits by painting fish in beautiful and original ways. Ever since I can remember, my connection to the world and the people around me has been through my artwork. I was an average student at best in a family of overachievers academically, but my ability to draw and paint always kept my mom from worrying about me too much. From the very beginning I was known as “The Artist”. When I’d meet someone new at school, I’d say, “I’m an artist”, and they would say, “Oh, I know who you are, I’ve seen your artwork hanging in the hallway. It was that way in 1st grade, and it was that way as a senior in college at Kendall College of Art and Design. The first compliment my wife ever gave me when we met at a party was that she liked my artwork. Strange how you can become what you do, but that seems to be the case here. It has been a good thing for the most part, but with it comes with some suffering too. I’m tortured by my paintings that don’t go well. I toss and turn in my sleep when things aren’t going well in the studio. On the other hand, the satisfaction I get from finishing a great painting is immeasurable. It keeps me working hard, striving to grow as an artist. Many people are surprised by the success I’ve had so far running DeYoung Studio, as it is a struggle for most artists to create artwork and run a good business. My secret is the people around me. I find supportive people in every direction, and they step up to help me in the ways I need help most. My wife deserves most of the credit for giving me the drive to work hard and to build a future for us. Without her encouragement, I would probably be satisfied having a few paintings hung up at a local coffee shop, and spend the majority of my time chasing Trout and Steelies."
