["https://derelictplaces.co.uk/help/privacy-policy"]
title = "Privacy policy | Derelict Places - Urban Exploring Forum"
description = "You must accept this policy before using the site."
full_description = '''We are Derelict Places - Urban Exploring Forum ("we", "our", "us"). We’re committed to protecting and respecting your privacy. If you have questions about your personal information please contact us. Further data may be collected if you choose to share it, such as if you fill out fields on your profile. In addition to notifying you of activity on our site which may be relevant to you, from time to time we may wish to communicate with all members any important information such as newsletters or announcements by email. You can opt-in to or opt-out of such emails in your profile. We may collect non-personally identifiable information about you in the course of your interaction with our site. This information may include technical information about the browser or type of device you're using. This information will be used purely for the purposes of analytics and tracking the number of visitors to our site. We are committed to ensuring that any information you provide to us is secure. In order to prevent unauthorized access or disclosure, we have put in place suitable measures and procedures to safeguard and secure the information that we collect. Cookies are small text files which are set by us on your computer which allow us to provide certain functionality on our site, such as being able to log in, or remembering certain preferences. You have a right to access the personal data we hold about you or obtain a copy of it. To do so please contact us. If you believe that the information we hold for you is incomplete or inaccurate, you may contact us to ask us to complete or correct that information. You also have the right to request the erasure of your personal data. Please contact us if you would like us to remove your personal data. Continued use of our site signifies your acceptance of this policy. If you do not accept the policy then please do not use this site. When registering we will further request your explicit acceptance of the privacy policy. We may make changes to this policy at any time. You may be asked to review and re-accept the information in this policy if it changes in the future.'''
year_published = 2025
