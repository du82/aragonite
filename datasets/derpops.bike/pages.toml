["https://derpops.bike/navel-gazing/red%20hat/rackspace/2012/11/26/hanging-up-the-hat.html"]
title = "Hanging up the Hat | Derp Ops – The blog of Jesse Keating"
description = "Seven years ago I put on a Red Hat.  I had been a part of the community for a few years prior to that as well, first as a newbie in #redhat looking for help, later as somebody providing help to others, then as an early cabal member in the newly formed Fedora project, later as a leader of Fedora Legacy.  Along the way I've made some very strong friendships that I hope will continue. This is my last week as a Red Hatter. I'd like to think that the Fedora project is a better place now than when I joined.  I hope my time here has made a positive difference.  My new role will leave me with less time to participate directly in Fedora, although I will likely continue maintaining a few packages here and there for my personal use. I do plan on being at FUDCon in January, I hope to see many of you there. I'll likely be shutting down this particular blog this week, but a new one will start and I'll link to it from here if you really like me and wish to keep tabs on what I'm doing :)"
