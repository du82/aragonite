title = "d×e"
description = "Empowering Design Engineers with learning resources, job opportunities, expert insights, and skills demonstration."
full_description = "We asked designers at our Config 2023 London Watch Party how they like to work with developers. Find out how closer alignment could impact the product development process. Design Technologists, possessing expertise in design best practices and scalable components creation with accessible APIs, could potentially eliminate the 'design and engineering gap' instead of merely bridging it. Delving into Design Technology, we'll explore how this role promotes robust teams, strengthens organization connections, and transcends traditional titles with its mindset. In software, engineering and design are infantile in existence compared to other sectors: mechanical, electrical, aerospace, and environmental engineering. In my teens, I was involved in many extra-curricular activities in high school. I was president of the art club for all 4 years and lead for the school's robotics team. While I wasn't officially part of the class counsel, due to my volunteer work especially with the homecoming floats, I was given a new title by my peers over 20 years ago; Design Engineer. Hi 👋 I'm Lichin, I joined PicCollage one year ago as a design engineer. Design engineer, or UX engineer, is a relatively new role in Taiwan, so it can be challenging to introduce or explain this role to folks who ask about it. I’ve written this as an attempt to describe what a Design Engineer is and does, but also introduce some projects that I've been part of over the past year. Emil Widlund's journey from a freelance designer to a UX Engineer at EA showcases his transition through self-taught coding skills, driven by curiosity and a desire to improve design-to-development workflows. His work, particularly in integrating React into game development and pioneering with design systems, highlights the value of blending design intuition with technical proficiency in a rapidly evolving tech landscape. In this talk, Lichin will share five stories about designing together on different scales, from a group of product designers at PicCollage, the local Figma community, to a classroom with 50 students."
year_published = 2025
