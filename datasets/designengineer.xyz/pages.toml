full_description = "We asked designers at our Config 2023 London Watch Party how they like to work with developers. Find out how closer alignment could impact the product development process. We had such good traction on one of our first episodes, we decided to bring on another friend of the program, Donnie D'Amato to talk about design technologists, where they should sit in the org, and how we can use them as designers to be our best helping hand. In my teens, I was involved in many extra-curricular activities in high school. I was president of the art club for all 4 years and lead for the school's robotics team. While I wasn't officially part of the class counsel, due to my volunteer work especially with the homecoming floats, I was given a new title by my peers over 20 years ago; Design Engineer. In this talk, Lichin will share five stories about designing together on different scales, from a group of product designers at PicCollage, the local Figma community, to a classroom with 50 students. A design technologist can move between the design and engineering worlds seamlessly. They can change their shape and blend in depending on the environment, and therein lies their power: they are powerful advocates for holistic thinking. They are the first point of contact for engineers because of their eye for design. They are the first point of contact for designers because of their ability to confirm feasibility and prototype rapidly. In this video, Kathryn welcomes the awesome Karl Koch, Product Design Lead at Moneybox, to chat about the designer-developer handoff, share good practices for translation between devs and designers! Over the last few months, design engineering has by far been the #1 most requested topic. So I wanted to get the inside scoop from the team at Vercel to learn more. The goal of this conversation is to help people understand the role that design engineers play and to outline a path you can take to develop some of these skills. We talk about: Hi 👋 I'm Lichin, I joined PicCollage one year ago as a design engineer. Design engineer, or UX engineer, is a relatively new role in Taiwan, so it can be challenging to introduce or explain this role to folks who ask about it. I’ve written this as an attempt to describe what a Design Engineer is and does, but also introduce some projects that I've been part of over the past year."
