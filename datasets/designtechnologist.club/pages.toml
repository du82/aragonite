["https://designtechnologist.club/book/cooperation-with-other-team-members"]
title = "Cooperation with other team members - Design Technologist Handbook"
description = "As with other UX roles, communication and cooperation are the key for Design Technologist jobs"
full_description = "Cooperation with other team membersReading time: 2 min.Author: KonstantinChapter in Design Technologist HandbookDesign Technologist is a very varied role, so you will need to be comfortable wearing a lot of different hats. As with other UX roles, communication and cooperation are the key, because one should be able to close the gap between designers, developers, and product managers at the same time. Design Technologists should be able to speak with various stakeholders and have the right skills to make the business work. Since it always takes some effort to understand the viewpoints of other team members, it will often require from you to be outgoing, sharp, confident to present your ideas.[1][2]A Design Technologist often takes part with designers in group design activities (brainstorming, design critiques, user research, etc.). Therefore, it is particularly important to develop creative thinking, design skills and knowledge of design tools. During concepting, Design Technologists help designers understand technical restrictions and opportunities that are given to a project on the designer's ideas.[3]One of the biggest challenges is to translate designer language to engineers, especially in waterfall product development. Cooperation between designers and Design Technologists creates valuable insights for further experiments, calculates a designer idea’s feasibility to be integrated with the user needs, technology opportunities and business requirements. Sometimes, basic details are not discussed by developers and designers because the first assumes that the latter are aware of technical problems when that is often not the case. It is common that a designer creates wireframes and hands them off to engineers, with no communication after the mock-ups are complete. This makes designers project living separately from technical constraints and sometimes they are impossible to implement. Furthermore, by the time the mocks have been coded, it sometimes does not look anymore like what the designer was thinking of. Minimizing such misunderstanding and miscommunication may help save time and nerves.[4][5][6][7]Design Technologists are the first contact point for engineers when they need design help. They have an eye for design, and they speak the same language as engineers, understand their needs and restrictions. Thus, close cooperation with engineers aligns code with platform design and UX.[2][7]Design Technologists also cooperate with UX researchers, planing and implementing UX studies together with them. Design Technologists should be able to produce prototypes, ranging from low to high allegiance, by supplying more real of the product and the higher quality of feedback than designer’s prototype in their design tools. Other tasks include gathering and evaluating user requirements, creating storyboards, process flows, and sitemaps, managing usability testing.[2][5]Previous article:SkillsNext article:Job descriptionShare in social media:References:Neal B., Advice for Creative Technologist (https://medium.com/@laserpilot/advice-for-creative-technologists-21f3f220b2)Stevens E., 5 UX specialties that could be your next career move (https://www.invisionapp.com/inside-design/5-ux-specialties/)Bird J., No, UX ** ** is not a dumb job title (https://uxplanet.org/no-ux-is-not-a-dumb-job-title-927a83b37888)Cordova, Design Thinking in UX Engineering (https://medium.com/uxelab/2-design-thinking-in-ux-engineering-c8d75b99ef82)Kushner M.H., Your UX Team Needs a Design Technologist. Here’s Why (https://blog.prototypr.io/your-ux-team-needs-a-design-technologist-heres-why-3426be8f78a)Kashkinova A. NET magazine, October 2019, Issue 324. Become a hybrid designer George K., Why your team needs a Design Technologist (https://medium.com/@katie.george/why-your-team-needs-a-design-technologist-3c83d3ac18ba)"
