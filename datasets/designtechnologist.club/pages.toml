["https://designtechnologist.club/book/skills"]
title = "Skills - Design Technologist Handbook"
description = "The basic skill set is well established for Design Technologists and includes coding, design, and building prototypes"
full_description = "SkillsReading time: 4 min.Author: KonstantinChapter in Design Technologist HandbookThere are different names for the role of Design Technologist, but there is a basic skill set that is well established: the ability to write code, build prototypes, and at the same type be sensitive to design and user experience. But the most important skills that clearly stand out are, of course, design and coding. More than half of IT jobs and more than a quarter of jobs outside of IT these days require knowledge of digital design; successful workers must think like designers. On the other hand, coding is also increasing its influence in various positions and require knowledge of it till some extent for graphic designers, marketers, and business people. Half of all job openings in the top income quartile are in positions that now show a significant demand for coding skills.[1][2]In day-to-day work, Design Technologist’s main tasks are tasks of Front-End developer and are related to HTML, CSS, and JavaScript. The scope is what differs this skillset from regular Front-End Developer: Design Technologist should be able to develop rapidly mockups and prototypes showing how sites would look and work, generate prototypes to help illustrate UX solutions and interactive designs.[3][4]The required skillset and knowledge level quite often depend on the company where the Design Technologist is working. In case of a freelancer, you would need to know a great deal of design. When working for startups or agencies, knowing exactly how much effort implementing a certain feature makes it much easier to prioritize steps during the first design phases. It also allows to avoid checking the design with the development team all the time. This is especially useful if you work remotely or in different time zones and cannot easily communicate with colleagues at any time you need to. If you have at least basic Front-End skills (HTML/CSS), fixing some code by yourself will take a minimum amount of time. In bigger organizations knowing some design would help you communicate your ideas better with other teams and with designers.[6][14]PrototypingThe role of Design Technologist is sometimes called UX prototyper. During the design phase, a Design Technologist converts design intent to real prototypes. A prototype is unlikely to have production-ready code, but certainly part of it can be reusable and thus prototypes and specifications can be used later in the implementation phase by the engineering team. It also helps the designer find UX problems earlier and in communicating design intent faster. The series of prototypes multiplied by Design thinking then come to play by minimizing the uncertainty and risk of innovation and by engaging with users in learning, testing, and refining concepts. Design Technologists build exploratory solutions to solve the problem instead of just making empirical assumptions on how to solve a UX problem, which then ensures that team members spend less time planning and more time doing.[6][7]One of the popular methods to organize fast prototyping with designers is RITE or Rapid Iterative Testing and Evaluation. It allows updating design quickly in response of customer feedback. It differs from usual usability testing because it advocates for UI changes once a problem is found and a solution is clear.[8]SkillsAdobe XDFigmaSketchFramerOrigamiIt is useful to learn the basics of classical design as well, including type, space, motion, color, and rhythm, which apply also to the Web. The fundamentals of design relate to user experience in a stronger way than most realize. Inspiration often comes outside the web and uses the tools of the web to make your ideas come alive. A Design Technologist also should be able to answer different tricky design questions: why text is left-aligned, why paragraphs should be longer than 50-70 characters per line, why it is better dark-colored text on light-colored backgrounds etc.[9][10]Vector and static design tools will be always a part of your arsenal, because it reflects what users see, when they use your product. Getting outside the comfortable boundaries of static design tools allows though to explore more exciting and innovative solutions and to open your eyes to new ways of interacting with products.[10]Front-End developmentIn many teams Design Technologists handle the Front-End implementation role. In such case they might support designers so that they do not have to be any more detailed in their instructions - due to the Design Technologist’s eye for design. In the engineering side, the core Design Technologist skill is problem-solving. There is always a need to take a problem and break it down to its subcomponents and then tackle individual problems. Concretely in Front-End side, the Design Technologist might be focused on interactive features, including, for example, animations, touch, tap, and swipe gestures, accessibility features etc. Often, however, a Design Technologist is not directly intersecting with other Front-End developers, as they have quite concrete design tasks assigned to them like designing graphic user interface elements (menus, tabs, widgets), building page navigation buttons and search fields, designing responsive interfaces etc.[7]Another task that Design Technologists can do is finding inefficient processes, creating new processes or tools to improve old ones. For example, some can write a plugin to auto populate data into Sketch mocks, a tool to help researchers interpret video recordings of usability studies, a mockup viewer that shows designs in different devices and sizes or dashboards to track new metrics.[11][12]SkillsHTML, CSS, JavaScript (ECMAScript 6)JavaScript frameworks (React.js, Vue.js, Angular.js)Build tools (webpack, gulp)CSS pre-processors, post-processors (SASS, LESS, PostCSS)AnimationsAccessibility (automated testing)AlgorithmsSoftware design patternsResponsive designTesting and debugging (Jest, Enzyme, Axe)Version control (git, GitHub, GitLab)Package and dependency managers (npm, yarn)Command line toolsProgressive Web AppsBrowser dev toolsDesign systemsEngineering tools (Visual Studio Code, Atom, WebStorm)[9][13]UXGetting a Design Technologist on the team means there is always an engineer whose work is first and most important, the user experience. It means minor things like CSS animations, button alignment, and error messages, and major things like consistency, brand, and usability will not be forgotten. It also means that to turn into a Design Technologist you would also need to have at least some experience in the core UX principles, philosophies, and methods. This includes, but is not limited to, how and why to do user research, wireframing and personas.[7][11]SkillsUsabilityUX testingPersonasUX writingService blueprintsCustomer journey mapUX researchSoft skillsThese skills will ensure that you land your dream job, whatever the requirements. Not only does it highlight the multidisciplinary nature of design technologists, it also shows that mostly they form medium between other fields, often with conflicting goals.[9]SkillsCommunication (written and verbal)List itemTeamworkEmpathy for usersProblem solvingCritical thinkingBusiness skillsPrevious article:ChallengesNext article:Cooperation with other team membersShare in social media:References:Burning Glass Technologies. Report. The Hybrid Job Economy: How New Skill are Rewriting the DNA of the Job Market (https://www.burning-glass.com/wp-content/uploads/hybrid_jobs_2019_final.pdf)Wasberger E., Design Technologists will transform your creative process — if you let them (https://medium.com/@TOPPDesign/design-technologists-will-transform-your-creative-process-if-you-let-them-95eb46c8da39)Stevens E., 5 UX specialties that could be your next career move (https://www.invisionapp.com/inside-design/5-ux-specialties/#UI/UX%20developer)UX Engineers: What We Are (https://uxplanet.org/ux-engineers-what-we-are-2b0c4d10b3a6)Justmind, Should designers learn front-end development? 10 UX-perts weigh in (https://uxplanet.org/should-designers-learn-front-end-development-10-ux-perts-weigh-in-7fb22c2ae21d)Cordova, Design thinking in UX Engineering (https://medium.com/uxelab/2-design-thinking-in-ux-engineering-c8d75b99ef82)Kushner M.H., Your UX Team Needs a Design Technologist. Here’s Why. (https://blog.prototypr.io/your-ux-team-needs-a-design-technologist-heres-why-3426be8f78a)Wikipedia, RITE Method (https://en.wikipedia.org/wiki/RITE_Method)Bostian E., UX Engineering (https://dev.to/emmabostian/ux-engineering-3hem)Kristen, Upstate Interactive, What Is a Design Technologist? An Interview With James Patrick Gibson (https://medium.com/upstate-interactive/what-is-a-design-technologist-an-interview-with-james-patrick-952fa020fffa)Todish T.R., Hi, I'm a UX Developer - You're a what? (https://uxmag.com/articles/hi-im-a-ux-developer-youre-a-what)Lou E., What Is a Design Technologist? (https://medium.com/indeed-design/what-is-a-design-technologist-6431531f0d48)Kas A., Being a designer-developer hybrid in 2019 (https://uxdesign.cc/being-a-designer-developer-hybrid-in-2019-3e389d58fe7)Kashkinova A. NET magazine, October 2019, Issue 324. Become a hybrid designer"
