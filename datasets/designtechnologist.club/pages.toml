external-references = ["join.slack.com"]

["https://designtechnologist.club/book/searching-for-yourself"]
title = "Searching for yourself - Design Technologist Handbook"
description = "Not a surprise that Design Technologists often begin with searching for themselves at the start of their career"
full_description = "Searching for yourselfReading time: 2 min.Author: KonstantinChapter in Design Technologist HandbookThis handbook is trying to find a standard definition for the design technologist, describe hybrid professions, explore the job market, explain benefits and challenges that Design Technologists can cope with, and compare it to other nearby professions.We are still in a situation when there is no exact definition for the design technologist profession and which skills does it require. You cannot find this job title in Cambridge Dictionary nor Longman Dictionary of Contemporary English; instead, various websites and blog posts contain mixed information about the subject. Besides, companies often use other job titles for the design technologist such as UX developer or engineer, Creative technologist - joined just by the general idea of building bridges between design and development.This fact also means though that, fortunately, companies have started to use design thinking in their companies and rethink traditional waterfall practices. Modern times require a modern solution - a new approach to product development, when the wall between developers and designers falls despite the traditional division for people who design and for people who build, for how it looks, and how to make it happen. Hence new Design Technologist skill set is combining expertise that no job ever used to have.Not a surprise that Design Technologists at the start of their career start to feel that something might be wrong with them, and their career path often begins with searching for themselves. Finding a perfect career does not happen overnight, life goes by quickly, and people can find themselves doing not so exciting job and questioning how they got there. Design Technologists regularly end up with asking themselves questions: can I do that, am I smart enough, and do I have enough experience to do that? It is easy to get into impostor syndrome and to think you are not as competent as other people think you are, and thus not to apply to the jobs and the projects you deserve. As generalized specialists, Design Technologists do not have the advantage the engineer experts have in gaining knowledge in their specific discipline because of the continuous switch between different technologies. However, companies should understand the benefits the technologist brings into the business and UX - understanding of the intersection between fields, examining issues and details from multiple perspectives, delivering a broad view to any project. Design Technologists are solving problems with code and could be, in principle, happy as engineers. Still, they thrive by analyzing the bigger picture of the project and examining the impact of code on the product, instead of reviewing code itself.The situation in the job market is quite positive nowadays; in fact, there was no such profession as a Design Technologist a decade ago. There is a clear trend of jobs becoming more and more hybrid, more complex, and they demand essential new sets of skills. The biggest companies, such as Amazon, Google, Facebook, and eBay, are searching for Design Technologists right now. Startups also adopt actively design thinking in their procedures, erasing the distinction between design and code and thus also looking for Design Technologists. It can still be hard getting into the professional field of creative technology when you are just starting. Design Technologists have to learn new technologies and trends permanently: a little bit about software development, display tech, and many other things.This handbook is going to help some of you to overcome challenges, to know yourself better. It also covers positive things: using the latest technologies, being less affected by work automatization, and the main one - a satisfaction feeling, when an end-user sends you kudos about the product you have created.Next article:Generalists, specialists, hybrid and T-shaped peopleShare in social media:References:Field D., 6 major tech companies have doubled their design hiring goals in last half decade (https://techcrunch.com/2017/05/31/here-are-some-reasons-behind-techs-design-shortage/)Bird J., No, UX ** ** is not a dumb job title (https://uxplanet.org/no-ux-is-not-a-dumb-job-title-927a83b37888)Burning Glass Technologies. Report. The Hybrid Job Economy: How New Skill are Rewriting the DNA of the Job Market (https://www.burning-glass.com/wp-content/uploads/hybrid_jobs_2019_final.pdf)Connor A., Marks S. Published by IGI Global, 2016. Creative Technologies for Multidisciplinary Applications Neal B., Advice for Creative Technologist (https://medium.com/@laserpilot/advice-for-creative-technologists-21f3f220b2)Amazon, Senior Design Technologist (https://www.amazon.jobs/en/jobs/1224029/senior-design-technologist)eBay, Senior Design Technologist (https://lensa.com/senior-design-technologist-jobs/bellevue/jd/83ba54323e3160be83455d6e2c11d5e4)Google, UX Engineer (https://careers.google.com/jobs/results/128220503476183750/)Quartz, Growth Engineer (https://angel.co/company/quartz-an-atlantic-media-company/jobs/500426-growth-engineer)"
year_published = 2025
