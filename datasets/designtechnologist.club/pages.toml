["https://designtechnologist.club/about"]
title = "About the author - Design Technologist Club"
full_description = "I know how it feels. Design Technologist, UX Developer, Creative Technologist... It has many names, and I have battled for many years to understand who I am - at work, in my own projects, at University. I could give up... But I did not. Instead, I researched and collected data from various sources and wrote the handbook that you can read here. I felt that I needed to help others, who struggle with the same questions: who they are, what is their job title, and how to find their dream job. My aim is also to increase the awareness of employers about how Design Technologists can help their business. I'm a multidisciplinary Design Technologist, passionate about software development, Human-Computer Interaction, modern design, and accessibility, in which I have over 14 years of experience. As a Design Technologist, I like to work at the intersection of development, design, and UX, to resolve problems and challenges for end-users, instead of just coding for the sake of coding. I use rapid prototyping and prefer to fail fast instead of developing a product that nobody is going to use. I implement my ideas using React.js, Gatsby.js, Figma, and Adobe XD. My current focus is around accessibility, WCAG, and the legislation related to it. My task is to make technology serve human needs, which happens often in the opposite way."
year_published = 2025
clearnet = "https://designtechnologist.club/about"
tags = ["author", "awareness", "battled", "designer.", "developer,", "employers", "feels", "handbook", "increase", "names"]
language = "en"
