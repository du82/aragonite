["https://designtokens.org/glossary"]
title = "Design Tokens Glossary | Design Tokens Community Group"
description = "The DTCG’s goal is to provide standards upon which products and design tools can rely for sharing stylistic pieces of a design system at scale."
full_description = "This glossary contains high-level definitions, leaving out technical details on purpose. Part of the DTCG's mission is to write those technical definitions in the form of specifications.Design tokenThe single source of truth to name and store a design decision, distributed so teams can use it across design tools and coding languages.Design token translation toolA tool that translates token sets from one format (such as YAML) to a range of other formats (such as CSS custom properties, Sass, Swift, Sketch palettes…).ExamplesStyle DictionaryCobaltSpecifyTheoDesign toolA tool for visual design creation and editing.ExamplesPhotoshopIllustratorInkscapeUXPinSketchFigmaMarvelVendorCompany shipping design tool(s), in a position to implement the design token specification, such as Adobe, Framer, UXPin, Figma, Sketch, and many others.VariableGeneric term describing the most common way (but not the only way) a design token is formatted and used in code.ExamplesCSS custom propertySass variableJavaScript variableAndroid resourceDesign token nameA label assigned to a design decision.Examplestext-color-primaryfont-size-titleDesign token valueA context-specific value assigned to a design token name.Examplesa hex or rgb colora px, rem, or sp font sizeDesign token propertiesAdditional data describing the token’s value or the token as a whole.ExamplesDesign token typeDescriptionMetadataVendorDesign token aliasA token value that is a reference to another token.Examplecolor.text.primary’s value uses an alias: color.palette.black: #000000 color.text.primary: ${color.palette.black} Design token groupAuthor-defined categorizations applied to related sets of tokens.ExamplesA brand color paletteA list of viewport sizesA component’s themeable style properties.Design token typeA classification applied to the value of a token.ExamplesColorSizeFontComposite design tokensComposite design tokens contain values that represent more than one design decision.ExamplesText Style: composed of font size, weight, family, line height, and letter-spacingBorder: composed of color, width, and styleGradient: linear/gradial, at least 2 colors, a directionShadow: x-direction, y-direction, color, blur, spreadDesign token schemaRules for writing tokens that are used to determine if the syntax is valid."
year_published = 2025
