["https://www.designtokens.org/press-kit"]
title = "Press kit | Design Tokens Community Group"
description = "The DTCG’s goal is to provide standards upon which products and design tools can rely for sharing stylistic pieces of a design system at scale."
full_description = "Guidelines and assets to help the public talk about the Design Tokens Community Group. The press kit allows anyone such as speakers, bloggers, YouTubers, and newsletter authors to share our work.About the Design Tokens W3C Community GroupThe Design Tokens Community Group's goal is to provide standards upon which products and design tools can rely for sharing stylistic pieces of a design system at scale.In long-form content, you may use this language:The Design Tokens Community Group is a community initiative to develop standards for design tokens as a way to capture the stylistic values of a design system to scale. Design token standards enable creators, products, and design tools to develop and maintain design tokens on a stable foundation of shared understanding. Standards ensure that all parties using design tokens will have an expected, quality experience for scaling design.Refer to this group as:Design Tokens Community GroupDTCGNote: the DTCG is not a W3C Working Group. The technical reports published by the DTCG are not W3C Standards nor are they on the W3C Standards Track.LogoDownload PNGThe DTCG’s logo was created by Tim Van DammePlease do not distort or change the logo in any way to preserve the integrity and recognition of the logoLinksDesignTokens.org: Official home of the Design Tokens Community Group where you can learn more about the group, the principles we value, glossary, blog, and links to other resourcesGitHub design-tokens/community-group: Official GitHub DTCG repository for the design tokens specificationsw3.org/community/design-tokens: Official W3C home of the DTCG for announcements, reports, and contributorsTwitter: @DesignTokens: Official Twitter account for DTCG social media communicationsLinkedIn: Official LinkedIn account for DTCG social media communicationsOpen Collective: Where people and companies can donate to the DTCGDesign Tokens Community Group Glossary: High-level definitions to provide a common language during discussionsChairsJina Anne, Product Design Manager, Design Systems @ Asana / Founder @ ClarityKaelig Deloumeau-Prigent, Development Acceleration @ ShopifyVal Head, Senior Design Advocate, AdobeContributorsAdam Sedwick, UX Engineer, Design Systems @ Discovery EducationAdekunle Oduye, Senior Front-end Engineer @ MailChimpAyesha Mazumdar, Design Technologist @ PinterestCaleb WilliamsDanny Banks, Principal Design Technologist @ AWSDonna Vitan, Design Lead, Design Systems @ TELUS DigitalGarth Braithwaite, Design System Engineer @ AdobeJames Nash, Design Systems AficionadoJohan Stromqvist, Motion Design Specialist @ Shopify PolarisKathleen McMahon, Senior Design Engineer @ LaunchDarklyKevin Powell, Principal Front-End Developer @ EightShapesLouis Chenais, Co-Founder & Chief-Evangelist @ SpecifyMatt Felten, Senior Manager, Design Systems @ ServiceTitanMatthew Strom, Director of Design @ Simple HealthNathan Curtis, Founder and Principal @ EightShapesTim Van Damme, Software designer @ Gowalla"
