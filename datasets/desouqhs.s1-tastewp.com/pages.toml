title = "Quick WordPress Testing & Staging Sites – TasteWP"
description = "Create a WordPress test site with one click. FREE and no login required. Ideal for testing things out before you do it on your real site."
full_description = "Get a taste of WordPress Set up a new WordPress instance now: Set it up! (no sign up required!) Advanced Setup I agree with the Terms What is this good for? Get started with WordPress quickly even without being logged in Play around without inhibitions​ Clone other sites and use TasteWP as your staging server with this plugin​ Host your site with us permanently and use your own domain​ Other use cases: Demo your WordPress product | Teach WordPress to Students Premium Features No expiry Use the site(s) for as long as you want More space Up to 20 GB per site (need more?) Top support Get help when you get stuck Own domain Use any domain name Buy now From 2.98 USD/month only – cancel anytime. Questions? FAQ How long are the sites live? If you create a site when not logged in on TasteWP, it's valid for 2 days, otherwise it's 7 days. It's free to sign up, you can do it here. If you don’t want your sites to expire at all, check out our premium features. Disclaimer: Sites created on wordpress.org will have 8 hours expiration time for non-logged in users and 3 days for logged in users. How much space do the sites have? By default it's 1 GB (for free sites). If you want more, have a look at our premium features. How many sites can I create at once? If you're not logged into TasteWP, you can create up to 2 sites (and once they expire, create new ones). If you're logged into TasteWP, you can create up to 6. Sign up now, it's free. If you use our premium features, then you can have as many premium sites as you paid for (there is no limits of premium sites). Can I migrate to another hoster? Yes you can! By default a migration plugin is installed (Backup Migration), which allows you to migrate easily to another hoster. Can I create WP with multisite support? Yes! Just click on 'Advanced options' and click on the respective button. Can I change my PHP version later? Yes, if you are logged in, you can do it in the site manager. Can I download WordPress debug.log file? Yes you can do it in the site manager (in the dashboard). Can I change the domain you give me? That will be possible soon. Stay tuned! Show others Prev 1 / 2 Next TasteWP is part of the Inisev product family See all projects"
