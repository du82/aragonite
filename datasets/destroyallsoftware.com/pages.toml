["https://www.destroyallsoftware.com/screencasts/catalog/outside-in-tdd-stubs-vs-stash"]
title = "Outside-in TDD: Stubs vs. Stash"
full_description = "When doing TDD from the outside in, stubs are the norm. We build the outermost class first, stubbing its dependencies, which may not even exist yet. Those stubs tell us what the interface of the next layer down should be; this is how TDD drives the design. When we're not isolating our tests, though, we can't do this. We can still start at the top, but we can't make the test pass without an actual implementation. This can lead to large, unwieldy commits. We'll look at how to avoid those large commits using the git stash, and then compare the results of outside-in TDD with stubs vs. outside-in TDD with the stash. Looking for something more interactive? Try Execute Program, an interactive learning platform from Destroy All Software LLC! It has courses on TypeScript, SQL, regular expressions, JavaScript concurrency, and more. All Destroy All Software subscriptions include full access to Execute Program, or you can subscribe to Execute Program directly. Outside-in TDD: Stubs vs. Stash was published on 2011-11-10. It uses Git 1.7.6, Rails 3.0.10, RSpec 2.6.4, Ruby 1.8.7, and Vim 7.3."
