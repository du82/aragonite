["https://destroyallsoftware.com/blog/2016/state-of-das-december-2016"]
title = "State of DAS: December 2016"
full_description = '''Destroy All Software's original series of 90 screencasts was published from March 2011 until March 2013. As far as I know, it was the first subscription-only programming screencast product, and it worked! This was good. Eventually, I got tired: both from the fixed screencast release schedule and from conference speaking. I was publishing once per week, then later once every other week. I averaged one conference talk per month at my peak, which was far too much for me. DAS was suspended in March 2013. I then spent three years writing 1.5 books, but published none of it. This was less good, but I learned some things. DAS relaunched in August 2016. I converted a section of one unpublished book into a screencast series on Computation, explained using code rather than the traditional mathematical terminology and notation. This was good. The computation series is now almost done. There's one more screencast left, which I expect to release around the new year. I need to decide what comes next. Unlike the original DAS run, I want to plan the future a bit; I want to decide where I'm going, rather than simply finding myself somewhere. In September, I did four live streams to test the waters. My favorites were writing a text editor and a compiler from scratch in about an hour each, which got great responses from viewers. The videos were watched around 10,000 times, if I remember correctly, but they're now down because Twitch videos expire eventually. I expect to reprise these topics eventually. My next experiment is going to be live streaming in earnest, probably once per week to start. I've never written about my DAS recording process in detail, but it's basically a live-streaming process already. I record the full screencast, end to end, over and over again, until it meets my standards. What you watch on DAS is effectively a live recording, with very light editing to remove the parts where I swallow water and so on. For viewers, true live streaming means that little mistakes will sneak in, which viewers say that they miss from the earlier DAS screencasts. Live streams are also more "organic", for lack of a better term; you and I both know that there's no safety net, and we both seem to like it.'''
