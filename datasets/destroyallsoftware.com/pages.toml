["https://destroyallsoftware.com/screencasts/catalog/computing-by-constructing"]
title = "Computing by Constructing"
full_description = "We write a simple, easy-to-read example function in Python. Then, remove Python features one by one, transforming it into the lambda calculus. At the end, there's nothing left except (1) definitions of functions that take exactly one argument and (2) calls to functions with exactly one argument. At the end, there are still some helper functions that use Python features. Next time, we'll remove all of those as well, reimplementing numbers and booleans from scratch using nothing but functions of one argument. The final code is available on GitHub, but it won't make sense unless you've watched the screencast! Looking for something more interactive? Try Execute Program, an interactive learning platform from Destroy All Software LLC! It has courses on TypeScript, SQL, regular expressions, JavaScript concurrency, and more. All Destroy All Software subscriptions include full access to Execute Program, or you can subscribe to Execute Program directly."
