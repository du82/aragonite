["https://destroyallsoftware.com/screencasts/catalog/test-isolation-and-refactoring"]
title = "Test Isolation and Refactoring"
full_description = "Isolated unit tests have many benefits, but one drawback is a loss of confidence in the integrated system. At high levels of isolation, you lack a feedback mechanism for learning that the pieces don't actually work together: for example, they call the wrong methods, or call them with the wrong number of arguments. This can make refactoring with isolated tests scary. In this screencast, we'll look at the technique I use as a first line of defense. It's a hybrid between fully isolated unit testing and slow, expensive integration testing. Looking for something more interactive? Try Execute Program, an interactive learning platform from Destroy All Software LLC! It has courses on TypeScript, SQL, regular expressions, JavaScript concurrency, and more. All Destroy All Software subscriptions include full access to Execute Program, or you can subscribe to Execute Program directly. Test Isolation and Refactoring was published on 2011-07-14. It uses RSpec 1.6.4, Ruby 1.8.7, and Vim 7.3."
