["https://destroyallsoftware.com/screencasts/catalog/mutation-in-tell-dont-ask"]
title = "Mutation in Tell Don't Ask"
full_description = '''The Tell Don't Ask principle tells us not to manipulate objects conditionally based on their state; instead, the knowledge of when to manipulate belongs in the object. That sounds like a rule about mutability, but it's not: it applies just as well when objects are immutable. This screencast will look at an example of "asking", convert it to a "tell", and examine the role (or lack thereof) of mutation. Looking for something more interactive? Try Execute Program, an interactive learning platform from Destroy All Software LLC! It has courses on TypeScript, SQL, regular expressions, JavaScript concurrency, and more. All Destroy All Software subscriptions include full access to Execute Program, or you can subscribe to Execute Program directly. Mutation in Tell Don't Ask was published on 2012-05-03. It uses RSpec 2.4.0, Ruby 1.8.7, Vim 7.3, and Zsh 4.3.9.'''
