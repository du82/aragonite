["https://www.destroyallsoftware.com/blog/2018/a-case-study-in-not-being-a-jerk-in-open-source"]
title = "A Case Study in Not Being A Jerk in Open Source"
full_description = '''Here's a mailing list message written by Linus Torvalds, original author and maintainer of the Linux kernel. It's unnecessarily mean. It also contains strong language, so probably don't put this on text-to-speech unless you want people around you to hear profanity. The full email is reproduced below. We're also going to go through it piece by piece, so you can skip past this block quote if you don't mind seeing the email revealed piece by piece. I'm not talking about the changes themselves - I can live with them. But the _rationale_ is pure and utter garbage, and dangerously so. The fact is, using a union to do type punning is the traditional AND STANDARD way to do type punning in gcc. In fact, it is the *documented* way to do it for gcc, when you are a f*cking moron and use "-fstrict-aliasing" and need to undo the braindamage that that piece of garbage C standard imposes. So the commit message that talks about how horrible union aliasing is is pushing a story that is simply wrong. Using the standard to push it - the same standard that came up with the completely mis-guided aliasing rules - is not a valid argument. Andy, what is the background for trying to push this idiocy? Don't tell me "the C standard is unclear". The C standard is _clearly_ bogus shit (see above on strict aliasing rules), and when it is bogus garbage, it needs to be explicitly ignored, and it needs per-compiler workarounds for braindamage. The exact same situation is true when there is some lack of clarity. This is why we use -fwrapv, -fno-strict-aliasing etc. The standard simply is not *important*, when it is in direct conflict with reality and reliable code generation. The *fact* is that gcc documents type punning through unions as the "right way". You may disagree with that, but putting some theoretical standards language over the *explicit* and long-time documentation of the main compiler we use is pure and utter bullshit. I've said this before, and I'll say it again: a standards paper is just so much toilet paper when it conflicts with reality. It has absolutely _zero_ relevance. In fact, I'll take real toilet paper over standards any day, because at least that way I won't have splinters and ink up my arse.'''
