["https://destroyallsoftware.com/screencasts/catalog/growing-a-test-suite"]
title = "Growing a Test Suite"
full_description = "When building a system, it's easy to continually append tests to your suite without considering the relationship between them. By building your test suite more deliberately, you can write clearer, terser tests, and also put better design pressure on your system. We'll build a small piece of code both ways: first by simply appending tests, then by extending existing tests and thinking about the implications. Looking for something more interactive? Try Execute Program, an interactive learning platform from Destroy All Software LLC! It has courses on TypeScript, SQL, regular expressions, JavaScript concurrency, and more. All Destroy All Software subscriptions include full access to Execute Program, or you can subscribe to Execute Program directly. Growing a Test Suite was published on 2011-03-31. It uses RSpec 2.5.1, Ruby 1.8.7, Vim 7.3, and Zsh 4.3.9."
