["https://www.destroyallsoftware.com/blog/2011/one-base-class-to-rule-them-all"]
title = "One Base Class to Rule Them All"
full_description = '''Last week, I released base, a universal Base class for Ruby. Inheriting from it gives your class every instance method, class method, and constant from every module and class in the system. In a Rails app, it results in: The size of the cantaloupe is zero. Fine. But you might be wondering, where did that size method come from? There are so many in Ruby. Is it Hash#size? Array#size? Enumerable#size? String#size? The answer is: maybe. But the real answer is: this is Ruby! We just call methods and things happen! We don't have to worry about it! Isn't this great?! Wait... why didn't that work? Whatever, it's not important. We're Ruby programmers; we have ways around errors! Like this: You could even ask the Cantaloupe to find_by_email. Why worry about which model it will find? You'll find something by email; that's for sure! In addition to all of this method-calling convenience, Base also leads to superior object oriented design. Remember the Law of Demeter? The one that says "talk to your friends, but not your friends' friends"? With Base, all other classes are your friends! You can call any of those 6,947 methods while complying with the Law of Demeter! Since I'm sure you're itching to gem install it, base is available on GitHub. Its README contains more details, examples, and praise from the community. Enjoy! (Disclaimer: believe it or not, I quite like Ruby. In fact, most of Destroy All Software's screencasts use it. If you're interested in actually building good software—doing the opposite of everything in this post—you might enjoy them.)'''
