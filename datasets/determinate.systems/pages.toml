["https://determinate.systems/policies/dmca"]
title = "DMCA (Digital Millennium Copyright Act) takedown request requirements"
description = "A process for addressing claims of copyright infringement"
full_description = "We take the intellectual property rights of others seriously and require that our Users do the same. The Digital Millennium Copyright Act (DMCA) established a process for addressing claims of copyright infringement. If you own a copyright or have authority to act on behalf of a copyright owner and want to report a claim that a third party is infringing that material on or through FlakeHub’s services, please send a notice that meets the minimum requirements of the DMCA, to dmca@flakehub.com, and we will take appropriate action. DMCA notice requirements You must include: A description of the copyrighted work that you claim is being infringed; A description of the material you claim is infringing and that you want removed or access to which you want disabled and the URL or other location of that material; Your name, title (if acting as an agent), address, telephone number, and email address; This statement: “I have a good faith belief that the use of the copyrighted material I am complaining of is not authorized by the copyright owner, its agent, or the law (as a fair use)”; This statement: “The information in this notice is accurate and, under penalty of perjury, I am the owner, or authorized to act on behalf of the owner, of the copyright or of an exclusive right that is allegedly infringed”; and An electronic or physical signature of the owner of the copyright or a person authorized to act on the owner’s behalf. Submissions under this DMCA Policy should be sent to dmca@flakehub.com. We will review your submission and take whatever action we deem appropriate under the DMCA, including the removal of the challenged content from the website. Further more, we may, in appropriate circumstances, disable access or terminate the account(s) of the reported user(s). DMCA Counter Notice requirements The owner of the allegedly-infringing content may submit a DMCA Counter-Notice to dmca@flakehub.com. The Counter-Notice must comply with the requirements of the DMCA, and must include this: Contact Information: Your name, title (if acting as an agent), physical address, email address, and phone number; Content Identification: A reasonable identification of the material that has been removed or to which access has been blocked; Statement under Perjury: This statement: “I swear, under penalty of perjury, that I have a good faith belief that the material was removed or disabled as a result of mistake or misidentification of the material to be removed or disabled”; Consent to Jurisdiction: One of these statements (as appropriate): If based in the United States: “I consent to the jurisdiction of the Federal District Court for the judicial district in which my provided address is located” If based outside of the United States: “I consent to the jurisdiction of any United States Federal District Court in which FlakeHub may be found” Consent to service of process: This statement: “I will accept service of process from the person who provided the original notification or an agent of such person”; and Signature: An electronic or physical signature of the owner of the copyright or the person authorized to act on the owner’s behalf. We will review the counter-notice, and: if the counter-notice doesn’t satisfy the DMCA requirements, we’ll request a revised submission; or if the counter-notice is complete and valid, we’ll forward the counter notice to the person who filed the original takedown notice, advising that the challenged content will be reinstated within 10-14 business days, unless we receive a notification that the copyright owner is seeking a court order regarding this matter. Trademark takedown request requirements If you’re sure you want to report content on FlakeHub that you believe infringes your trademark, please provide this information: Details of the original trademark (and a description if it’s a logo). A list of the countries in which the trademark is registered. The registration number(s) of the trademark. A scanned copy of the trademark registration certificate(s) or screenshot of the registration on the website or database of the applicable national intellectual property office(s). A declaration of this statement: “By submitting this notice, I state that I have a good-faith belief that the reported use, in the manner that I have complained of, is not authorised by the intellectual property rights owner, its agent or the law; that the information contained in this notice is accurate; and, under penalty of perjury, that I am authorised to act on behalf of the owner of the intellectual property rights at issue”. You can send this information to dmca@flakehub.com, you should receive an automated confirmation of receipt. Namespaces and other disputes Disputes regarding namespaces, ownership and trademarks are not governed by DMCA. These disputes must be resolved by the parties involved. FlakeHub will never act as arbitrators or intermediaries in these disputes and will not take any action without the appropriate legal orders. For more information, see our terms of service. Adapted from the GitLab DMCA Policy."
