external-references = ["blog.openpolicyagent.org", "brew.sh", "cache.nixos.org", "cli.github.com", "discord.gg", "en.wikipedia.org", "github.com", "go.dev", "imperva.com", "jamf.com", "jqlang.github.io", "jwt.io", "linkedin.com", "markdownguide.org", "nixos.wiki", "opencontainers.org", "openssl.org", "pkg.go.dev", "python.org", "support.apple.com"]

