["https://determinate.systems/posts/changelog-determinate-nix-0371"]
title = "Changelog: version synchronization to 0.37.1"
description = "Just a version change but one that should make things more straightforward for users"
full_description = "Today, we at Determinate Systems are announcing a symbolic change for a broad range of our tools. As of now, all of these have been bumped to version 0.37.1: The determinate flake Determinate Nixd, the helpful daemon that is bundled with Determinate Nix Determinate Nix Installer Determinate.pkg, the GUI installer for macOS nixos-amis, Determinate Systems’ official Amazon Machine Images (AMIs) for NixOS Please note that there are no substantive changes in this release. Previously, all of the above followed their own version schedule, which has been a source of minor confusion and friction for a subset of our users. We’re confident that this will make things more straightforward for users going forward and that any short-term awkwardness will be worthwhile. To upgrade Determinate Nix to the most recent version: Upgrade Determinate Nixsudo determinate-nixd upgrade If you aren’t using Determinate yet, check out our getting started guides for organizations and individuals."
