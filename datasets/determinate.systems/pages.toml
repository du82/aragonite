full_description = '''class i extends HTMLElement{connectedCallback(){try{const e=this.querySelector("a");if(!e)return;const t=new URL(e.href),n=t.searchParams;e.addEventListener("click",()=>{if(!window.posthog)return;const s=e.href;setTimeout(()=>{e.href=s},500),n.set("phid",window.posthog.get_distinct_id()),e.href=t.toString()})}catch{}}}customElements.define("ph-id",i); Determinate NixFlakeHubInstall Nix Docs More Open more nav menu Learn Nix About Careers Blog const e=document.querySelector("#resources-menu");e&&e.addEventListener("focusout",()=>{e.matches(":focus-within")||setTimeout(()=>{e.open=!1},200)}); Get Determinate Navigate Determinate NixFlakeHubInstall Nix Docs Get started Other resources Learn NixOpen sourceEnterpriseAboutPeopleCareersBlog Status The people behind Determinate Systems Cole Helbling Cole is an avid Nix user and developer, championing Nix and its ecosystem. With a love for Rust and a willingness to dive in headfirst, he is a member of the OfBorg team, maintaining the Nixpkgs CI service. Cole Mickens Cole is a long-time Nix nerd and a recovering Kubernetes enthusiast. Creator of nixpkgs-wayland and Nixpkgs contributor, he has an eye on the future of desktop Linux powered by Wayland and NixOS. Cole is eager to use Nix to make modern software development simpler and more reliable. Eelco Dolstra Eelco started the Nix project as a PhD student at Utrecht University. He is a co-founder at Determinate Systems and a member of the Nix team. Graham Christensen Graham is a Nix and Rust developer, with a passion and focus on reliability in the lower levels of the stack. He founded Determinate Systems, Inc to support Nix adoption at your workplace. Jeff Martens Jeff has been building developer tools for the last 15 years, in both product management and startup founder roles. He believes that the best way to deliver great experiences with software to end users is to empower developers with delightful tools—like Nix. At Determinate Systems, Jeff leads Go-to-Market, corporate strategy, and operations. Luc Perkins Luc is a technical writer, software engineer, and Nix advocate who's always on the lookout for qualitatively better ways of building software. He originally hails from the Pacific Northwest but has recently taken to living abroad. Martin Wimpress Martin is a long-time Linux user, developer, and community builder who leads product strategy at Determinate Systems. In his spare time, he is a maker, an aspiring game developer, and hosts a podcast with his friends, where they discuss all the Linux Matters that matter. Uche Obasi Uche is a Nix enthusiast. He is deeply interested in frontend web engineering, open source, and cloud-native tech. Uche is originally based out of Lagos, Nigeria but spends some time globe-trotting.'''
