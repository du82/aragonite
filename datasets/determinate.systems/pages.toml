["https://determinate.systems/posts/nix-installer-macos-12-monterey"]
title = "Discontinuing support for macOS Monterey"
description = "Determinate software will no longer support macOS Monterey (version 12), following Apple's dropped support."
full_description = "Determinate Nix Installer and related software will no longer support macOS Monterey (version 12). This change follows Apples’ standard procedure of discontinuing support for older macOS versions. Timeline Our software will no longer explicitly target or test against macOS Monterey starting Monday, October 21, 2024. Our deprecation date is in advance of GitHub’s own deprecation timeline, which drops support on December 3, 2024. Note that between October 21 and December 3, DeterminateSystems/nix-installer-action and DeterminateSystems/magic-nix-cache-action will detect macOS Monterey, and fall back to the last release known to support macOS Monterey. Security patches will not be back ported to these older releases. This fallback behavior will be removed after GitHub fully disables hosted runners for macOS Monterey. Affected Software nix-installer fh flake-checker flakehub-push determinate-nixd magic-nix-cache How will this affect users? According to our data, most macOS Monterey users are on GitHub Actions. These users will need to update their workflows to use a more recent macOS version, like macos-latest. But we understand that this change might impact macOS Monterey users we’re unaware of, as future updates to our software will no longer explicitly support this platform. We’re here to help. If you do need continued support for macOS Monterey, please reach out to us at hello@determinate.systems. Our goal is to ensure that your projects continue to run smoothly and we’re open to finding ways to accommodate your requirements. We would be happy to discuss your needs and explore potential solutions."
author = "Graham Christensen"
year_published = 2025
