title = "Discontinuing support for i686-linux in the Determinate Nix Installer"
description = "Usage patterns suggest unambiguously that the Determinate Nix Installer no longer needs to support this system type."
full_description = "Here at Determinate Systems, our mission is to transform the software industry by bringing Nix to the enterprise. As a small team, we periodically evaluate how we spend our time and the impact that we have on our users. Today, we’re announcing that we plan to discontinue supporting i686-linux in the Determinate Nix Installer. The decision to end support for i686-linux comes after carefully reviewing usage patterns and the resources required to maintain this system type. For i686-linux, we saw only one attempt to install Nix in the last three months—and that attempt failed. Given this essentially non-existent usage, the burden of continuing to support and test compatibility significantly outweighs the benefits. Timeline Determinate Nix Installer releases will continue to support i686-linux until August 15, 2024. How will this affect users? According to our data, it won’t. But we understand that this change might impact i686-linux users we’re unaware of, as future updates to the Determinate Nix Installer will no longer support this architecture. We’re here to help. If you do need continued support for i686-linux, please reach out to us at hello@determinate.systems. Our goal is to ensure that your projects continue to run smoothly and we’re open to finding ways to accommodate your requirements. We would be happy to discuss your needs and explore potential solutions. The Determinate Nix Installer will continue to support these systems for the foreseeable future: x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin"
author = "Graham Christensen"
year_published = 2025
clearnet = "https://determinate.systems/posts/nix-installer-i686-linux"
tags = ["affect", "august", "determinate", "discontinuing", "i686-linux", "installer", "nix", "support", "timeline", "users?"]
language = "en"
internal-references = ["none"]
external-references = ["brew.sh", "curl.se", "demo.cloudscalehydra.com", "doc.rust-lang.org", "docs.fileformat.com", "docs.rs", "en.cppreference.com", "en.wikipedia.org", "git-scm.com", "github.blog", "github.com", "imperva.com", "javascript.com", "jwt.io", "linux-kvm.org", "microsoft.com", "protobuf.dev", "support.apple.com", "techtarget.com", "zero-to-nix.com"]

["https://determinate.systems/posts/changelog-determinate-nix-030"]
title = "Changelog: customer binding, nix.conf, and yanked Nix 2.25.4"
description = "Updates in Determinate Nix 0.3.0 and nix-installer 0.33.0."
full_description = "We’d like to announce some noteworthy changes to Determinate Nix involving customer binding, user customization, Determinate in OCI containers, and a yanked Nix release. We’ve also cut two new releases for the Determinate Nix Installer. Customer binding We’ve updated Determinate Nixd to enable users to bind a Determinate installation to a specific FlakeHub organization. When you do this, it prevents users from logging in to a FlakeHub account that isn’t associated with the organization. Here’s an example binding command: Binding a Determinate installation to a specific orgdeterminate-nixd auth bind AmbiguousTechnologies For persistent CI workers, we recommend pre-binding the Determinate installation to prevent CI jobs from substituting from outside caches. For more information, see our documentation on binding your installation. Splitting user customization from Determinate defaults in the Determinate Nix Installer The Determinate Nix Installer now writes user-specified configuration entries to a nix.custom.conf file. The default Nix configuration is written to nix.conf, which imports the nix.custom.conf. We made this change in collaboration with Emily from the nix-darwin project, for which we are grateful. At the same time, Determinate now takes a more prescriptive approach to the nix.conf. Previously, Determinate left the nix.conf alone if it was a symlink. This created unpredictable behavior for some users. Determinate will now move the nix.conf out of the way to a backup file and write its own at startup. User-specified settings can still be saved to nix.custom.conf. Determinate also previously tried to migrate the contents of nix.conf to the custom file, but the migration was unacceptably sloppy and error prone. Users reported seeing their nix.custom.conf growing with time, which is certainly not ideal. Consider reviewing your custom configuration and deleting any duplicate entries. Would you like access to private flakes and FlakeHub Cache? Sign up for FlakeHub Determinate in OCI containers While installing upstream Nix with the Determinate Nix Installer generally works quite well in Open Container Initiative (OCI) containers, installing Determinate has generally not worked properly and we are not currently testing for container compatibility. If your use case involves Determinate in OCI containers, reach out to us and we can put improved container support on our roadmap. Nix 2.25.4 yanked from DeterminateSystems/nix on FlakeHub During our release process for Nix 2.25.4, we saw a regression in Nix around relative path:. flake references. Nix 2.25.4 was briefly made available through our nix and determinate flakes. Those releases have been yanked and rolled back to 2.25.3. We submitted a patch for the bug and will validate and roll out Nix 2.25.5 as soon as possible. Determinate Nix Installer releases In addition to changes to Determinate Nix, we recommend checking out these recent releases of the Determinate Nix Installer: v0.33.0 v0.32.3"
author = "Graham Christensen"
year_published = 2025
clearnet = "https://determinate.systems/posts/changelog-determinate-nix-030"
tags = ["2.25.4", "ambiguoustechnologies", "auth", "bind", "binding", "binding,", "changelog:", "containers", "customer", "customization"]
language = "en"
