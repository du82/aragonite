dEventListener("click",()=>{l.forEach(e=>{e.id===s.id?(e.classList.remove("hidden"),e.classList.add("flex","flex-col","gap-6")):(e.classList.add("hidden"),e.classList.remove("flex","flex-col","gap-6"))}),d.forEach(e=>{e.id!==s.id?(e.classList.remove("border-2","border-amber-600"),e.classList.add("border-0")):(e.classList.remove("border-0"),e.classList.add("border-2","border-amber-600"))})})}); Latest from the blog Feb 26, 2025 by Luc Perkins Fetch artifacts directly from FlakeHub Cache using fh fetch Local builds getting you down? Build in CI and pull bytes over the wire instead. Feb 24, 2025 by Luc Perkins Introducing Determinate AMIs for NixOS Deploy NixOS configurations with just two commands Feb 21, 2025 by Luc Perkins Changelog: version synchronization to 0.37.1 Just a version change but one that should make things more straightforward for users More from the blog'''
