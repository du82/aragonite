full_description = "Featuring: Flakes — Nix users have overwhelmingly adopted flakes. With the Determinate Systems stability guarantee that any flakes that works today will work tomorrow. Users of the Determinate Nix Installer don’t need to hesitate or worry about adopting flakes. macOS upgrade resilience — Nix will continue to work across macOS upgrades. An uninstaller — Don’t like it? No worries. Our installer has a single-command, safe, and thorough uninstaller. Uninstall Determinate Nix with /nix/nix-installer uninstall. Where’s the magic? Totally free — backed by GitHub Actions’ cache, there is no additional service to pay for. Zero configuration — add our action to your workflow. That’s it. Everything built in your workflow will be cached. No secrets — Forks and pull requests benefit from the cache, too. Secure — Magic Nix Cache follows the same semantics as the GitHub Actions cache, and malicious pull requests cannot pollute your project. Upgrade your flake to use SemVer today with fh convert. Don’t like it? It’s safe and automatic to undo by running fh eject."
