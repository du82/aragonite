full_description = "Linux, macOS, and Windows Subsystem for Linux (WSL) One-liner for installing Determinate Nixcurl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --determinate The right choice on every platform. Install Nix on macOS, on Linux, in containers, in CI pipelines, in WSL, or anywhere else. Determinate Nix Installer is rigorously tested and has been used millions of times across all of these platforms. Nix even keeps working across macOS upgrades. Flake first for the future of Nix Nix users have overwhelmingly adopted flakes. With the Determinate Systems stability guarantee that any flakes that work today will work tomorrow. Users of the Determinate Nix Installer don’t need to hesitate or worry about adopting flakes. Undo! Undo! Don’t like it? No worries. Our installer has a safe, thorough, and single-command uninstaller. Uninstall with /nix/nix-installer uninstall."
