full_description = "Deploy Nix with confidence on SELinux-enabled systems. Determinate Nix provides seamless integration with SELinux security policies, ensuring system integrity while delivering powerful development environments. SELinux integration Native policy support: Pre-configured SELinux policies for Nix operations MAC compliance: Full mandatory access control compatibility Zero policy conflicts: Works without disabling SELinux Security Features Policy enforcement: Maintains SELinux security guarantees Containment: Proper domain separation Audit Logging: SELinux-aware activity tracking Zero-trust architecture: Fine-grained access controls Get started For step-by-step instructions, visit our comprehensive getting started guide. Contact us at hello@determinate.systems to learn more about how Determinate Nix can help your organization. Are you already familiar with Nix? Jump right in: Install Nixcurl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --determinate"
