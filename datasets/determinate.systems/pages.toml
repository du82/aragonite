["https://determinate.systems/posts/zscaler-macos-and-nix-on-corporate-networks"]
title = "Solving corporate TLS certificates for Nix on macOS"
description = "Determinate solves a key problem with TLS/SSL certificates on macOS."
full_description = '''Enterprises often use tools like Zscaler to bolster their overall security posture. Zscaler is an intercepting TLS proxy that inspects the traffic coming in and going out of the network. Because it intercepts all traffic, clients have to be configured with a custom TLS certificate for the connections to be trusted. This doesn’t always play nicely with other tools, especially tools that require TLS certificates—like Nix. Zscaler and Nix used to be a big pain Nix users in enterprise environments have run head-first into this problem countless times: warning: unable to download '...': SSL peer certificate or SSH remote key was not OK (60) On Linux, this isn’t a huge issue. Users and admins can add the certificate to their trusted bundle at a standard location like /etc/ssl/certs/ca-certificates.crt or /etc/pki/tls/certs/ca-bundle.crt. On macOS, however, the story is slightly more annoying for Nix because macOS stores the custom certificates in Keychain, a key and secret store used by applications across the macOS ecosystem. If you’re fully steeped in macOS, this is fine and works out of the box. But if you’re using a tool like Nix that’s mostly designed and used by Linux users to build Linux software then… things can get unpleasant. Users have long had to export their enterprise certificate from Keychain, reconfigure Nix, and manage this over time. When the certificate eventually expires and needs rotating, the user has to figure out how they fixed it the first time and try again. Uff da… what a headache. Determinate means Nix + Zscaler doesn’t have to be a huge pain Our goal with Determinate is to make Nix a pleasure to use across these platforms and to elegantly solve thorny problems for both users and IT administrators. So we fixed the Nix/Zscaler certificate issue on macOS. Determinate automatically configures Nix on macOS with an up-to-date certificate bundle from Keychain and synchronizes the bundle with Keychain over time. How to install Determinate Install Determinate with the Determinate Nix Installer by passing the --determinate flag: Terminal windowcurl --proto '=https' --tlsv1.2 -sSf -L \ https://install.determinate.systems/nix | sh -s -- install --determinate Alternatively, you can use our signed macOS .pkg for convenient distribution. If Installomator is your thing, we provide a Mobile Device Management (MDM) script that integrates especially well with automated processes. Determinate is available on all systems that the Determinate Nix Installer supports. More to come This is just the beginning of a series of posts about what we’re doing to improve the experience of using Nix in the enterprise. If this is music to your ears, join our Discord at https://determinate.systems/discord and come chat.'''
author = "Graham Christensen"
year_published = 2025
clearnet = "https://determinate.systems/posts/zscaler-macos-and-nix-on-corporate-networks"
tags = ["certificate", "certificates", "corporate", "determinate", "doesn’t", "huge", "install", "macos", "means", "nix"]
language = "en"
internal-references = ["none"]
external-references = ["bsky.app", "contributor-covenant.org", "discord.gg", "docs.determinate.systems", "en.wikipedia.org", "flakehub.com", "github.com", "hachyderm.io", "install.determinate.systems", "jamf.com", "linkedin.com", "opencontainers.org", "opentofu.org", "registry.terraform.io", "rust-lang.org", "support.apple.com", "terraform.io", "trust.determinate.systems", "twitter.com", "zscaler.com"]

["https://determinate.systems/posts/home-manager-deployments-with-fh"]
title = "Supercharging Nix deployments with FlakeHub Cache"
description = """
FlakeHub Cache transforms Nix deployments by eliminating local builds and evaluation.
See how to deploy Home Manager configs instantly on both macOS and Linux."""
full_description = 'Today, I’m excited to share how FlakeHub Cache can dramatically improve your Nix development and deployment workflow. While our Magic Nix Cache has helped teams boost CI performance over the past year, FlakeHub Cache represents the next evolution - accelerating builds and fundamentally transforming how Nix deployments work. We’ll examine a Home Manager configuration that demonstrates how FlakeHub Cache’s pre-built closures and pre-evaluated store paths can make deployments both faster and more reliable, especially in resource-constrained environments. If you’re currently using Magic Nix Cache, which will reach end-of-life for its free tier on February 1st, 2025, this is the perfect time to explore how FlakeHub Cache can enhance your entire Nix workflow. The challenge with traditional Nix deployments If you’ve worked with Nix, you’re likely familiar with the standard deployment flow: evaluate Nix expressions, realise closures, and download or build missing dependencies. While this works, it can be time-consuming and resource-intensive, especially when deploying to multiple machines or CI environments. Enter FlakeHub Cache FlakeHub Cache fundamentally changes how Nix deployments work by eliminating build time and evaluation overhead. Here’s why this matters: Traditional Nix deployments, even with a binary cache, require two steps that can be resource-intensive: Evaluation: Nix must evaluate your configuration to determine the store paths it needs - this alone can overwhelm memory-constrained devices Realization: Nix then either builds those paths or downloads them from a binary cache FlakeHub Cache eliminates both steps. When you push configurations through CI, FlakeHub: Evaluates and stores the exact store paths your configuration needs Caches the built closures for those paths Using FlakeHub Cache when deploying means you can bypass Nix evaluation entirely: Apply the Home Manager configuration supplying only a flake outputfh apply home-manager "determinatesystems/home-manager-example/*#homeConfigurations.linuxUsername@linuxHostname" This single command is transformative - especially for resource-constrained environments where evaluating a Nix configuration could cause out-of-memory errors. FlakeHub already knows the store paths needed, so no local Nix evaluation is required. It fetches the pre-built closure and activates it. Would you like access to private flakes and FlakeHub Cache? Sign up for FlakeHub Real benefits for real teams What makes this approach particularly powerful? Zero evaluation overhead: Skip not just building but even the memory-intensive process of evaluating Nix expressions Resource efficient: Deploy to severely constrained environments that couldn’t even evaluate complex Nix configurations Consistent environments: Every machine gets bit-for-bit identical outputs CI verified: Configurations are pre-tested before reaching production Bandwidth optimized: Only download what you need See it in action We’ve created a complete example repository that demonstrates these concepts. The configuration supports both macOS and Ubuntu systems, showing how to: Structure your flake for multi-platform support Configure GitHub Actions to build and cache your configurations Deploy configurations rapidly using fh Check out the complete example on GitHub to see how it all fits together. Beyond Home Manager While this example focuses on Home Manager, the same principles apply to: NixOS system configurations nix-darwin configurations Development environments Custom tooling and packages The benefits become even more pronounced with larger configurations that traditionally require significant build time. Getting started Ready to supercharge your own Nix deployments? Here’s how to get started: Sign up for FlakeHub to get access to FlakeHub Cache. Get one month free by applying the coupon code FHC during checkout. If you’re a maintainer of an open source project, contact us at support@flakehub.com for a free account. Review our comprehensive documentation to learn more about FlakeHub’s capabilities. Follow our getting started guide to begin your journey. Join the revolution FlakeHub Cache represents a fundamental shift in how we think about Nix deployments. By moving computation from deployment time to build time, we’re making Nix more accessible and practical for teams of all sizes. Have questions or want to learn more? Join us on Discord. We’d love to hear about your use cases and help you get started with FlakeHub Cache. Remember: your deployments should be boring and predictable, providing a sense of security and stability. With FlakeHub Cache, they can be.'
author = "Martin Wimpress"
year_published = 2025
clearnet = "https://determinate.systems/posts/home-manager-deployments-with-fh"
tags = ["1st,", "action", "actions", "apply", "bandwidth", "benefits", "beyond", "build", "cache", "challenge"]
