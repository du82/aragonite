["http://dev.edenspiekermann.com/2018/09/07/craft-3-heroku-boilerplate"]
title = "Craft 3 - Heroku Boilerplate"
description = "To make sure we can seamlessly work in teams, we have a specific requirements for our hosting environment.Currently, our hosting solution of choice is Netlif..."
full_description = 'To make sure we can seamlessly work in teams, we have a specific requirements for our hosting environment. Currently, our hosting solution of choice is Netlify and Heroku. Netlify is mostly for our static websites. Heroku is for almost all other projects. With Craft 3, which was released in April’18, it’s already much easier to install the CMS as a composer package and host it. But there were still some things we needed to take care of in order to host it on Heroku. This button has been made for those who just want to have a fresh Craft 3 instance on Heroku. Click the button and directly deploy our public boilerplate repository to a new instance on your Heroku account. After the install process, visit the URL of your app and add /admin/install to it. For example: https://YOUR-URL-GOES-HERE.herokuapp.com/admin/install Go and create a new and empty Git repository with your account. There must not be any .git or README.md file. After it is created, go with: To make your repository work on Heroku, we first have to update the reference URL with your freshly created repository. Heroku reads all the deploy details from the app.json file. So we need to replace the "repository" URL with your repository YOUR-REMOTE-PROJECT-URL. Push the changed app.json to your GitHub repository and adjust the following link with your repository and branch: https://heroku.com/deploy?template=https://github.com/YOUR-REMOTE-PROJECT-URL/tree/YOUR-BRANCH-NAME For example: https://heroku.com/deploy?template=https://github.com/edenspiekermann/craft3-heroku-starterkit/tree/master After you adjusted the link, visit it in your browser. You will see a Heroku page for creating a new instance. It will also install a free plan of a MariaDB and connect it with Craft. Please fill out all the details and don’t forget to choose the region. If you are in Europe, please use Europe and US if you are in the US or nearby. If you choose the wrong region, it could be that your website is slower than it could be.'
