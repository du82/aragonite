["http://dev.edenspiekermann.com/2018/08/10/performance-profiling-with-craft-cms"]
title = "Performance Profiling with CraftCMS"
description = "In one of our recent CraftCMS projects, we encountered a very slow page-speed. This project was for the swiss lifestyle magazine Friday. As we to implemented..."
full_description = "In one of our recent CraftCMS projects, we encountered a very slow page-speed. This project was for the swiss lifestyle magazine Friday. As we to implemented more and more articles on our testing platform, we discovered that the database queries grew exponential 📈. The loading time went up to several seconds and we knew, that we have to tackle this as soon as possible. So we started to investigate our template code. Here is a quick guide of how to tackle performance issues with CraftCMS. First you need to enable the debugger toolbar. In Craft you can debug your templates with the build-in Yii Debug Toolbar. This toolbar provides you with valuable information about the database queries executed by the page. You can filter or sort all queries to see which one takes more time than expected. The Yii Debug Toolbar is a configurable set of panels that display various debug information about the current request/response and when clicked, displays more details about the panel’s content. 11th August UPDATE: The awesome nystudio107 told me, that you don’t have to be in devMode. So you can skip this part After that, go to your admin panel and click on the bottom left corner on the craft licence link. This will open up the licence overview. In order to enable the debugger toolbar, you need to have the full version of CraftCMS. There are 2 options: In the admin panel, click on the top left corner and open up your profile. Check if you have admin permission. Then go to preferences tab and enable both checkboxes. Now you will see a small toolbar in the bottom right corner. Click on it to see more details. If you click anywhere in the toolbar, you can see all the details. Sort by duration is the main feature we are using here. As a quick reminder, we want to identify queries, which take too much time and need some improvements. If you open up the Performance Profiling window, you can identify which part of the template takes the longest. If you split up your templates in several different templates, it is easier to determine slow parts in the code. You can see in the image above, that the global-header is part of the layout template. So in this case the layout.twig template is including the partial global-header.twig. You can read more about includes in the Twig Docs"
author = "Dimitri Steinel"
year_published = 2018
clearnet = "http://dev.edenspiekermann.com/2018/08/10/performance-profiling-with-craft-cms"
