["https://dev.edenspiekermann.com/2016/03/29/jekyll-on-heroku"]
title = "Running a Jekyll Site on Heroku, The Easier Way"
description = "Eric Schaefer is a full-stack JavaScript developer at Edenspiekermann. These days he works mainly with React and Node.js. If you can’t find him, he’s probably drumming or making music."
full_description = "Recently I’ve been working on a prototype where I simply needed to serve the static files compiled by Jekyll, on Heroku. Seems straightforward right? Wrong. Turns out that for every URL that isn’t just a single page on root index.html, you need to add a custom config.ru to your project with all kinds of rack-rewrite rules to remove the .html extensions from URLs, add a Gemfile, and the list goes on… just to get Heroku to serve static files with a Rack server. Dave Rupert’s article on deploying Jekyll to Heroku using Dropbox got me partially there, but it seemed to me like his solution could be simplified, and better yet, support nice clean URLs for more than one page. Yeah, that’s right. The good ol’ PHP buildpack comes with an apache server that is more than capable of serving these stupid lil’ static assets, and automatically handle the obvious case of rewriting /contact-us/ to silently point at /contact-us/index.html. The presence of this file is a signal for Heroku to initiate its PHP buildpack on deployment. In your project root: Procfiles are a Heroku-specific config that spin up workers and define little customizations on app deployment. In your project root: In short, we are accomplishing a quick way to serve static assets, and get the basic URL rewriting behavior that we expect from the folder structure of a Jekyll project. The automatic URL rewrites are what ultimately convinced me of using Heroku’s PHP buildpack in this scenario. Hopefully it can help some of you agonizing over Rack configuration. Eric Schaefer is a full-stack JavaScript developer at Edenspiekermann. These days he works mainly with React and Node.js. If you can’t find him, he’s probably drumming or making music."
