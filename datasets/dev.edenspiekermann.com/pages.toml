["https://dev.edenspiekermann.com/2019/01/21/turn-craft-into-a-headless-cms"]
title = "Turn Craft 3 into a headless CMS"
description = "Dimitri Steinel is a frontend developer at Edenspiekermann (Berlin)."
full_description = "The classic CMS approach is to couple the presentational layer with the CMS directly. With this monolithic approach of building a CMS, your developers need to use a specific template language, and you lose much flexibility. This kind of CMS outputs content for only one channel: web browsers. You may think that this is enough for now, but we will prove that you can do so much more with your content than show it on one channel. Instead, we want to enable an omnichannel experience. Performance, Security and Scalability. In the headless approach there is no presentational layer out-of-the-box, and therefore developers are not bound to any templating or programming language to create one. With a headless CMS instead, you can have multiple heads, and this gives us a lot of freedom, scalability, and flexibility. Think of an app, voice interface, AR or any other new technology you need to deliver content to. A Static Site Generator like GatsbyJS or Nuxt.js (there are many others) fetches all the content from your CMS via an API and generates old fashioned static sites. Static does not mean the site cannot be interactive. It just means that the site doesn’t need to communicate with the CMS to fetch the content. If you are looking to improve the security of your site, a static site can live on another server without any connection to the CMS. The connection happens during build time which means, our frontend is blazing fast! Let’s see how to make use of Craft as a headless CMS. We’ll use CraftQL to access content in Craft, and Gatsby to render it into static HTML. Here we go. Our static site generator of choice is GatsbyJS. With the plugin CraftQL we can connect our GatsbyJS with the CMS over GraphQL. Let’s start with installing the plugin: composer require markhuot/craftql:^1.0.0 Once installed, we need to create an endpoint. Go to your CraftCMS admin and head over to settings —> CraftQL. Enter the URI for your endpoint or stíck with the default ‘api’. Think of a name and generate a new token. Make sure you open the settings of your token you just created. Here you can adjust the power of the token. Should this token be read-only or can you also mutate entries with your token?"
author = "Dimitri Steinel"
year_published = 2019
clearnet = "https://dev.edenspiekermann.com/2019/01/21/turn-craft-into-a-headless-cms"
