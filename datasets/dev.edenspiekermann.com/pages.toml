["http://dev.edenspiekermann.com/2016/09/09/rails-multitenant-site"]
title = "Creating a multi-tenant site with rails"
description = "We recently worked on a joint-venture project between two companies. The goal was to build one “white-label” site that would be released in two different mar..."
full_description = "We recently worked on a joint-venture project between two companies. The goal was to build one “white-label” site that would be released in two different markets. Apart from some branding, the sites would be identical, but completely separate. We chose the third option as it would result in building, hosting and maintaining just a single application. Once we had decided we were going to build a multi-tenant site, we then needed to pick the most suitable approach. There’s two main ways to build a multi-tenant ruby on rails application: This option requires scoping the data by the site it belongs to. In essence, adding a site_id to database tables and scope all database queries to only return data belonging to that site. This option creates separate tables within the database for each site. Database queries for a site only use database tables belonging to that site. When it comes to databases at Edenspiekermann, we ❤️ PostgreSQL. It’s got a very nice way of segregating a database using schemas, we chose to go with the second option using PostgreSQL schemas. Our two sites were going to be completely separate - there’s no shared data, and data from one site should not be visible to the other. By using schemas, we can create two separate versions of the site and restrict request from each site to only access their own database tables. We also remove the need for any site specific schema details like storing site_id on tables. As far as each site is concerned, the sub-section of the database it has access to, is the only database there is. Ryan Bates has a great railscast on how to create a multi-tenant site using PostgreSQL schemas and search paths. It’s surprisingly quite straight forward. We chose to use the apartment gem which does a great job of wrapping up and abstracting the logic. It looks after mapping the request coming in to the correct database schema or ‘tenant’ as it calls them. It also ensures that all database migrations are run or rolled back on all your schemas."
author = "Niall Burkley"
