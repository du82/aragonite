["https://dev.edenspiekermann.com/2016/03/02/gists-as-npm-packages"]
title = "Gists as npm packages"
description = "Have you ever heard of “bling dot js”? It is a few lines of JavaScript code from no one else but Paul Irish to mimick the most popular features from jQuery (..."
full_description = "Have you ever heard of “bling dot js”? It is a few lines of JavaScript code from no one else but Paul Irish to mimick the most popular features from jQuery ($(), .on and iterating on NodeList) without all the bloat. Pretty rad. I wanted to use bling dot js in the latest version of Sass Guidelines, but it only exists as a GitHub Gist. Not a npm package, not a traditional GitHub repository. Just a Gist. And I really dislike copying and pasting third-party libraries inside a project. Losing connection to the source is quite not ideal. So I had a look, and it turns out that using a Gist as a npm package is surprisingly easy. The same way you can use GitHub repositories as npm packages, you can use a Gist as a package as long as it has a package.json file. After all, a Gist is really just a Git repository with a ridiculously simple UI. So all I had to do is fork Paul’s Gist, add a package.json file with the only two mandatory keys, and I was basically done. Note that the name and the version does not matter here; feel free to pick whatever. Then, it is possible to install this Gist with its ID (found in the URL): That’s it! At this point, you can find the files from the Gist in node_modules/blingdotjs. Using it can be as easy as copying the file to your assets folder, or something equivalent. Or if you want to automatically do it after an install, you can have a post-install hook in your package.json: Kitty Giraudel is a non-binary accessibility & diversity advocate, frontend developer, author and real life cat."
