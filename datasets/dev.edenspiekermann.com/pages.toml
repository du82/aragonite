["http://dev.edenspiekermann.com/2016/02/11/introducing-accessible-modal-dialog"]
title = "Introducing A11y Dialog"
description = "Kitty Giraudel is a non-binary accessibility & diversity advocate, frontend developer, author and real life cat."
full_description = "If there’s one thing I try to push forward more and more at Edenspiekermann, it’s accessibility. I can’t help but feel that we don’t care enough about assistive technology users. That’s a shame, really. It’s not that we don’t want to—it’s more like we don’t really know where to start. Almost all projects involve some form of dialog window at one point or another. However, accessibility is all too often set aside in favor of quick implementation. Truth is, accessible dialog windows are hard. Very hard. Fortunately, there is a super clever guy named Greg Kraus who implemented an accessible modal dialog a few years ago and open-sourced it on GitHub. Now that’s nice! However, his version—no matter how good it is—requires jQuery. We try to avoid using jQuery as much as we can here. We realised we did not really need it most of the time. On top of that, his script is not very flexible: only one dialog window per page, hard-coded IDs inside the functions. Not very practical and certainly not a drop-in script for any project. I spent a few hours improving the original version and came up with new ideas as I went, so here is the full list. The script no longer has jQuery as a dependency. It is now pure vanilla JS, ready to be used in any kind of project. You can still use jQuery if you want, but the script itself does not need it. It is now possible to use several different dialog windows on the same page, thanks to the Factory pattern. I added a small DOM API to open and close dialog windows (data-a11y-dialog-show and data-a11y-dialog-hide) without having to bind any listeners yourself. You can have as many openers and closers per dialog window as you want; no limit! There is also a teeny tiny JS API to allow you to manually hide and show a dialog window from its instance. It’s also possible to know whether a dialog window is hidden or shown without having to query the DOM. And last but not least, I fixed a minor bug with the original version where elements with tabindex attribute set to -1 would be focusable."
author = "Kitty Giraudel"
year_published = 2016
clearnet = "http://dev.edenspiekermann.com/2016/02/11/introducing-accessible-modal-dialog"
