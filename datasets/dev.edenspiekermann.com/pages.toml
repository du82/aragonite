["https://dev.edenspiekermann.com/2016/06/02/using-mjml-in-rails"]
title = "Using MJML in Rails"
description = "Recently, I had to implement an email for the Amaphiko project. And since I won’t code email, at least not in this life, I had to find a workaround. There ca..."
full_description = "Recently, I had to implement an email for the Amaphiko project. And since I won’t code email, at least not in this life, I had to find a workaround. There came MJML. MJML introduces itself as “the responsive email framework”. Practically speaking, MJML is a markup language built on React that produces email-compliant (whatever that means) markup once compiled. MJML comes with about 20 components to build simple newsletters (texts, images, links, buttons, columns, tables, etc.) and can be extended by leveraging the power of React for advanced usage. Amaphiko is a Rails app. Therefore, I needed a way to integrate MJML in the Rails pipeline to be able to produce proper responsive emails based on dynamic data. While MJML is fairly recent, I was pleased to see there already is a fresh gem to plug it into Rails, called mjml-rails. The thing is, this gem is basically just a wrapper around the mjml npm package. Because of this, it needs mjml to be installed independently. You can either install it globally to avoid adding a Node.js dependency to your project: Then in app/views, we create a foobar_mailer folder, containing a file named after our action baz. This file has to be a .mjml file. When the mail gets a bit long or repetitive, it might be interesting to leverage the power of ERB to have separate files, and render them inside the main template. For instance, each section of the newsletter could live in its own file. MJML is such a fantastic tool to build responsive email newsletters without the hassle and I am super happy to see a proper and simple Rails integration. Kitty Giraudel is a non-binary accessibility & diversity advocate, frontend developer, author and real life cat."
