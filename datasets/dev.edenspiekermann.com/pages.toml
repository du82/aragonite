["https://dev.edenspiekermann.com/2015/10/26/prop-type-checking-in-react"]
title = "Ensuring Component Stability through Prop Validation"
description = "Eric Schaefer is a full-stack JavaScript developer at Edenspiekermann. These days he works mainly with React and Node.js. If you can’t find him, he’s probably drumming or making music."
full_description = "Our React application for Amaphiko has grown quite a lot over the last year. One of our primary goals is to ensure the scalability and stability of the application. And to that end, we’ve been religiously adding prop checks to the top of every component. This serves a few purposes: When you’re looking at the code for a component, the first thing you expect to see is what type of data you have available. This eliminates needing to switch between looking at the API documentation and your component code. propTypes can serve as a sort of mini-reference to your back-end’s API. Immediately we can see that this ProjectTile component accepts a project object. And we also see its properties, like id and title. So when we’re writing the UI elements inside the component, we already know we can call properties like this.props.title in our render method, without having to look at the parent component or some other documentation. If a prop is missing, or has an incorrect data type, you’ll see a warning in the JavaScript console. And for performance reasons, React will only check the propTypes in development mode. One can start to see the power of this when combining these prop checks with integration tests and other pre-push hooks. It is often the case as a project grows, that the structure of a back-end API response could change, and therefore break an element in the UI if that piece of data is missing, or if a new property is added. Having propTypes can eliminate a whole swath of these kinds of errors. Let’s consider the code snippet above. If a new property teaser is added to this.props.project, the required object shape defined in React.PropTypes.shape() would not match. In development, the console would warn us of this, and we would know to re-examine the data we’re getting from this.props, and update our prop checks accordingly. JavaScript is an extremely expressive language, and ES6 even more so. But sorely, enforcing types in JS is tricky business, and introduces notoriously difficult debugging edge cases since the language is weakly typed. Religious use of propTypes can really minimize these edge cases. Combined with a an additional type checking tool like Flow, prop checks can drastically improve your long-term productivity and coerce your code to seem more strongly typed."
author = "Eric Schaefer"
year_published = 2015
clearnet = "https://dev.edenspiekermann.com/2015/10/26/prop-type-checking-in-react"
