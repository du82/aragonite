full_description = 'Regular expressions, or regex, is a tool for testing, analysing and matching patterns of text in a larger text set. Regex theory was conceived by an American mathematician in 1956 and practical implementations became popular in the late 1960s. They have been around for a very long time and are rooted in Computer Science theory. Regex set theory defines the underlying standard, however different languages and environments implement different features and syntaxes to achieve it. I’ll focus on Javascript’s implementation because it is simpler than many, and we use it often. Regular expressions are often referred to as patterns, which are enclosed in delimiters. In JS, this is the forward slash. Chuck your patterns in between these. It’s nice think of each logical unit of a regex pattern as an atom. This could be a single letter, or a complex sequence of characters—so long as they are interpreted as a single unit. The simplest pattern is a string literal. A string literal will match the exact text in the target string. More complex patterns can be built using special characters which represent a set of characters or escaped characters. This table show’s the most common: String literals and special characters can be combined to create character sets. In JS, these are enclosed in square brackets. String literals, special characters or character sets can be followed by a qualifier. This determines how many times the atom can be repeated. By default, qualifiers are greedy, meaning that they will try to match as many characters as possible. To make them non-greedy, append a ? after the qualifier. Multiple atomic patterns can be combined to build up expressions. The simplest way to do this is to combine string literals, special characters, character sets and qualifiers into one pattern. To build even more complex patterns, expressions can be grouped into sub-expressions which themselves can have qualifiers. It’s possible to reuse captured groups in the same pattern with the \n special character (where n is a positive integer). For example, this pattern will find any double occurrences of words, like ‘the the’ or ‘and and’:'
