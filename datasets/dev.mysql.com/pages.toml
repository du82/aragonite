full_description = "Documentation Home MySQL 9.2 C API Developer Guide Preface and Legal Notices The MySQL C API MySQL C API Implementations Writing C API-Based Client Applications C API Function Reference C API Basic Interface C API Prepared Statement Interface C API Asynchronous Interface C API Thread Interface C API Client Plugin Interface C API Binary Log Interface Index Download this Manual PDF (US Ltr) - 1.4Mb PDF (A4) - 1.4Mb version 9.2 9.1 9.0 8.4 current 8.0 5.7 MySQL 9.2 C API Developer Guide Abstract This is the MySQL 9.2 C API Developer Guide. This document accompanies MySQL 9.2 Reference Manual. The C API provides low-level access to the MySQL client/server protocol and enables C programs to access database contents. The C API code is distributed with MySQL and implemented in the libmysqlclient library. For legal information, see the Legal Notices. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-03-04 (revision: 81100) Table of Contents Preface and Legal Notices 1 The MySQL C API 2 MySQL C API Implementations 3 Writing C API-Based Client Applications 3.1 Example C API Client Programs 3.2 Building C API Client Programs 3.3 Building C API Client Programs Using pkg-config 3.4 Writing C API Threaded Client Programs 3.5 Running C API Client Programs 3.6 Using C API Features 3.6.1 Support for Encrypted Connections 3.6.2 SSL Session Reuse 3.6.3 Multiple Statement Execution Support 3.6.4 Prepared Statement Handling of Date and Time Values 3.6.5 Prepared CALL Statement Support 3.6.6 Prepared Statement Problems 3.6.7 Optional Result Set Metadata 3.6.8 Automatic Reconnection Control 3.6.9 NULL mysql_store_result() Return After mysql_query() Success 3.6.10 Results Available from a Query 3.6.11 Obtaining the Unique ID for the Last Inserted Row 3.6.12 Obtaining the Server Version and Client Library Version 4 C API Function Reference 5 C API Basic Interface 5.1 Overview of