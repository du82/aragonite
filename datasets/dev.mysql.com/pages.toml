title = "MySQL :: MySQL Cluster Manager 1.4 User Manual"
full_description = "Documentation Home MySQL Cluster Manager 1.4 User Manual Preface and Legal Notices Overview of MySQL Cluster Manager MySQL Cluster Manager Installation, Configuration, Cluster Setup Using MySQL Cluster Manager MySQL Cluster Manager Client Commands MySQL Cluster Manager Limitations and Known Issues Attribute Summary Tables Index Related Documentation MySQL Cluster Manager 1.4 Release Notes Download this Manual PDF (US Ltr) - 1.8Mb PDF (A4) - 1.8Mb version 1.4 9.2 9.1 9.0 8.4 current 8.0 MySQL Cluster Manager 1.4.8 User Manual Abstract This is the User Manual for the MySQL Cluster Manager, version 1.4.8. It documents the MySQL Cluster Manager Agent and MySQL Cluster Manager Client software applications, which can be used to administer MySQL NDB Cluster, a version of the MySQL Database System (referred to hereafter as “MySQL Server” or simply “MySQL”) that incorporates the NDB storage engine for high availability and data redundancy in a distributed computing environment. This Manual applies to MySQL Cluster Manager 1.4.8 and contains information that may not apply to older versions of the MySQL Cluster Manager software. For documentation covering previous MySQL Cluster Manager releases, see MySQL Documentation: MySQL NDB Cluster, on the MySQL website. MySQL Cluster Manager features. This manual describes features that may not be included in every version of MySQL Cluster Manager, and such features may not be included in the version of MySQL Cluster Manager licensed to you. If you have any questions about the features included in your version of MySQL Cluster Manager, refer to your MySQL Cluster Manager license agreement or contact your Oracle sales representative. MySQL Cluster Manager, MySQL Server, and MySQL NDB Cluster features. This manual contains certain basic information about MySQL Server and MySQL NDB Cluster; however, it is not in any way intended as an exhaustive reference for either of these products. Current versions of MySQL NDB Cluster compatible with MySQL Cluster Manager are based on versions 7.5 and 7.6 of the NDB storage engine; these versions of MySQL NDB Cluster are known as “MySQL NDB Cluster 7.5” and “MySQL NDB Cluster 7.6,”, respectively. MySQL NDB Cluster functionality varies between MySQL NDB Cluster releases; MySQL Cluster Manager cannot supply or emulate MySQL NDB Cluster features that are not present in the version of the MySQL NDB Cluster software in use. For information about MySQL NDB Cluster 7.6 and 7.5, see MySQL NDB Cluster 7.5 and NDB Cluster 7.6. MySQL Cluster Manager 1.4 supports MySQL NDB Cluster 8.0 on an experimental basis only, and should not be used with MySQL NDB Cluster 8.0 in a production environment. Some examples of MySQL 8.0 features that are not supported are listed here: The default_auth_plugin system variable. The --upgrade option for mysqld. The new SET PERSIST statement for persisting system variables. If you do not have the MySQL Server and MySQL NDB Cluster documentation, you can obtain it free of charge from the MySQL Documentation Library, on the MySQL website. For notes detailing the changes in each release of MySQL Cluster Manager 1.4, see MySQL Cluster Manager 1.4 Release Notes. For legal information, see the Legal Notices. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Licensing information. This product may include third-party software, used under license. See the MySQL Cluster Manager 1.4 License Information User Manual for licensing information, including licensing information relating to third-party software that may be included in this release. Document generated on: 2023-03-29 (revision: 75245) Table of ContentsPreface and Legal Notices1 Overview of MySQL Cluster Manager1.1 MySQL Cluster Manager Terminology1.2 MySQL Cluster Manager Architecture1.3 Basic Operational Concepts for MySQL Cluster Manager1.3.1 Eventual Consistency2 MySQL Cluster Manager Installation, Configuration