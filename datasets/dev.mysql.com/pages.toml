ide Security in MySQL Starting and Stopping MySQL MySQL and Linux/Unix MySQL and Windows MySQL and macOS MySQL and Solaris Building MySQL from Source MySQL Restrictions and Limitations MySQL Partitioning MySQL Tutorial MySQL Performance Schema MySQL Replication Using the MySQL Yum Repository MySQL NDB Cluster 8.0 version 8.0 9.2 9.1 9.0 8.4 current 5.7 8.0 Japanese MySQL 8.0 Reference Manual / Tutorial Chapter 5 Tutorial Table of Contents5.1 Connecting to and Disconnecting from the Server5.2 Entering Queries5.3 Creating and Using a Database5.3.1 Creating and Selecting a Database5.3.2 Creating a Table5.3.3 Loading Data into a Table5.3.4 Retrieving Information from a Table5.4 Getting Information About Databases and Tables5.5 Using mysql in Batch Mode5.6 Examples of Common Queries5.6.1 The Maximum Value for a Column5.6.2 The Row Holding the Maximum of a Certain Column5.6.3 Maximum of Column per Group5.6.4 The Rows Holding the Group-wise Maximum of a Certain Column5.6.5 Using User-Defined Variables5.6.6 Using Foreign Keys5.6.7 Searching on Two Keys5.6.8 Calculating Visits Per Day5.6.9 Using AUTO_INCREMENT5.7 Using MySQL with Apache This chapter provides a tutorial introduction to MySQL by showing how to use the mysql client program to create and use a simple database. mysql (sometimes referred to as the “terminal monitor” or just “monitor”) is an interactive program that enables you to connect to a MySQL server, run queries, and view the results. mysql may also be used in batch mode: you place your queries in a file beforehand, then tell mysql to execute the contents of the file. Both ways of using mysql are covered here. To see a list of options provided by mysql, invoke it with the --help option: $> mysql --help This chapter assumes that mysql is installed on your machine and that a MySQL server is available to which you can connect. If this is not true, contact your MySQL administrator. (If you are the administrator, you need to consult the relevant portions of this manual, such as Chapter 7, MySQL Server Administration.) This chapter describes the entire process of setting up and using a database. If you are interested only in accessing an existing database, you may want to skip the sections that describe how to create the database and the tables it contains. Because this chapter is tutorial in nature, many details are necessarily omitted. Consult the relevant sections of the manual for more information on the topics covered here. PREV HOME UP NEXT Related Documentation MySQL 8.0 Release Notes MySQL 8.0 Source Code Documentation Download this Manual PDF (US Ltr) - 43.3Mb PDF (A4) - 43.4Mb Man Pages (TGZ) - 296.6Kb Man Pages (Zip) - 402.0Kb Info (Gzip) - 4.3Mb Info (Zip) - 4.3Mb Excerpts from this Manual MySQL Backup and Recovery MySQL Globalization MySQL Information Schema MySQL Installation Guide Security in MySQL Starting and Stopping MySQL MySQL and Linux/Unix MySQL and Windows MySQL and macOS MySQL and Solaris Building MySQL from Source MySQL Restrictions and Limitations MySQL Partitioning MySQL Tutorial MySQL Performance Schema MySQL Replication Using the MySQL Yum Repository MySQL NDB Cluster 8.0 $(function() { var doc = new $.doc({ 'mobile': $.browser.mobile, 'docId': 1, 'highlight': true }); });"
