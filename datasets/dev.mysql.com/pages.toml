ucts. MySQL Cluster Manager 9.2 supports MySQL NDB Cluster 9.2, MySQL NDB Cluster 8.4, and MySQL NDB Cluster 8.0. MySQL NDB Cluster functionality varies between MySQL NDB Cluster releases; MySQL Cluster Manager cannot supply or emulate MySQL NDB Cluster features that are not present in the version of the MySQL NDB Cluster software in use. For complete information about MySQL Server and MySQL NDB Cluster see MySQL NDB Cluster 9.2, MySQL NDB Cluster 8.4, and MySQL NDB Cluster 8.0. If you do not have the MySQL Server and MySQL NDB Cluster documentation, you can obtain it free of charge from the MySQL Documentation Library, on the MySQL website. For notes detailing the changes in each release of MySQL Cluster Manager , see MySQL Cluster Manager 9.2 Release Notes. For legal information, see the Legal Notices. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-03-04 (revision: 81100) Table of ContentsPreface and Legal Notices1 Overview of MySQL Cluster Manager1.1 MySQL Cluster Manager Terminology1.2 MySQL Cluster Manager Architecture1.3 Basic Operational Concepts for MySQL Cluster Manager1.3.1 Quorum Requirement1.3.2 Eventual Consistency2 What Is New in MySQL Cluster Manager 9.23 MySQL Cluster Manager Installation, Configuration, Cluster Setup3.1 Obtaining MySQL Cluster Manager3.2 Supported Platforms and MySQL NDB Cluster Versions3.3 MySQL Cluster Manager Installation3.3.1 Installing MySQL Cluster Manager on Unix-like Platforms3.3.2 Installing MySQL Cluster Manager on Windows Platforms3.3.3 Setting the MySQL Cluster Manager Agent User Name and Password3.4 MySQL Cluster Manager Configuration File3.5 Upgrading MySQL Cluster Manager4 Using MySQL Cluster Manager4.1 mcmd, the MySQL Cluster Manager Agent4.2 Starting and Stopping the MySQL Cluster Manager Agent4.2.1 Starting and Stopping the Agent on Linux4.2.2 Starting and Stopping the MySQL Cluster Manager Agent on Windows4.3 Starting 