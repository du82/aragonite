ing the JDBC DriverManager Interface Using JDBC Statement Objects to Execute SQL Using JDBC CallableStatements to Execute Stored Procedures Retrieving AUTO_INCREMENT Column Values through JDBC Connection Pooling with Connector/J Multi-Host Connections Configuring Server Failover for Connections Using JDBC Configuring Server Failover for Connections Using X DevAPI Configuring Load Balancing with Connector/J Configuring Source/Replica Replication with Connector/J Advanced Load-balancing and Failover Configuration Using the X DevAPI with Connector/J: Special Topics Connection Compression Using X DevAPI Schema Validation Using the Connector/J Interceptor Classes Using Logging Frameworks with SLF4J Using Connector/J with OpenTelemetry Using Connector/J with Tomcat Using Connector/J with Spring Using JdbcTemplate Transactional JDBC Access Connection Pooling with Spring Troubleshooting Connector/J Applications Known Issues and Limitations Connector/J Support Connector/J Community Support How to Report Connector/J Bugs or Problems Index Related Documentation MySQL Connector/J Release Notes Download this Manual PDF (US Ltr) - 1.2Mb PDF (A4) - 1.2Mb MySQL Connector/J Developer Guide Abstract This manual describes how to install, configure, and develop database applications using MySQL Connector/J 9.2, a JDBC and X DevAPI driver for communicating with MySQL servers. MySQL Connector/J 9.2 supersedes the 9.1 series and is recommended for use on production systems. It is for use with MySQL Server 8.0 and up. Please upgrade to MySQL Connector/J 9.2. For notes detailing the changes in each release of Connector/J, see MySQL Connector/J Release Notes. For legal information, including licensing information, see the Preface and Legal Notices. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-03-02 (revision: 81077) Table of Contents Preface and Legal Notices 1 Overview of MySQL Connector/J 2 C