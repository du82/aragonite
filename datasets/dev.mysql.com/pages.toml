title = "MRS Developer's Guide"
full_description = "MRS Developer's Guide This book explains how to install and configure the MySQL REST Service (MRS) as well as how to access the data through REST calls. Chapter Overview MRS Introduction MRS Deployment Architecture MRS Configuration Adding REST Services Adding Schemas and Objects to a REST Service MRS Examples MRS Notes Example MRS Scripts Example Please also see MySQL REST Service - SQL Reference - This book discusses the MySQL REST Service SQL Extension. MySQL REST Service - Core REST APIs - This book provides examples of using the MySQL REST Service queries and other operations against tables and views after you have REST-enabled them. MySQL REST Service - SDK Reference - This book explains how to work with the MRS Software Development Kit and discusses the Client APIs. 1 Introduction to the MySQL REST Service Welcome to the MySQL REST Service (MRS). It provides a fast and powerful way to serve data to client applications via a HTTPS REST interface. To start with a hands-on approach, see the MRS Notes Example and follow the instructions for Build and Deployment there. This section provides an overview of the MySQL REST Service and its features. About the MySQL REST Service The MySQL REST Service (MRS) offers HTTPS REST access to selected MySQL schema objects. It is modelled after and supports a subset of the Oracle REST Data Services (ORDS). For more information, see ORDS MRS consists of the following components: A MySQL Solution (like MySQL Heatwave, MySQL InnoDB Cluster, a standalone MySQL Server, etc.) Serving a metadata schema mysql_rest_service_metadata that holds the MRS configuration Serving the application’s data MySQL Router One or many MySQL Router instances to serve the HTTPS REST interface on default port 8443 MySQL Shell / MySQL Shell for VS Code Support for managing MRS through a graphical user interface (GUI) embedded inside VS Code MRS plugin to configure and manage the MRS setup on the terminal and using scripts About REST APIs Representational State Transfer (REST) is a style of software architecture for distributed hypermedia systems such as the World Wide Web. An API is described as RESTful when it conforms to the tenets of REST. Although a full discussion of REST is outside the scope of this document, a REST API has the following characteristics: Data is modelled as a set of resources. Resources are identified by URIs. A small, uniform set of operations are used to manipulate resources (for example, PUT, POST, GET, DELETE). A resource can have multiple representations (for example, a blog might have an HTML representation and an RSS representation). Services are stateless and because the client is likely to access related resources, these should be identified in the representation returned, typically by providing hypertext links. Feature Overview Feature Description MRS AutoREST Enabling REST access to a table, view, or procedure allows it to be accessed through RESTful services. AutoREST is a quick and easy way to expose database tables as REST resources. REST data mapping Views REST data mapping views combine the advantages of relational schemas with the ease-of-use of document databases. They give your data a conceptual and an operational duality as it is organized both relationally and hierarchically. Serving Static Content In addition to serving dynamic content using AutoREST it is possible to upload static content, like HTML, CSS, and image files. This feature is not meant to replace dedicated HTTP servers that support capabilities like server-side programming. It can aid the quick deployments of prototypes and proof-of-concept efforts that help bring ideas to life. End User Authentication MRS supports a number of authentication methods, including MRS REST service specific authentication, native MySQL authentication and OAuth2 authentication (Sign in with FaceBook and Google) End User Authorization Built in support for row-level security, role based security, user-hierarchy based security, Group based security, Group-hierarchy based security as well as custom authorization support REST Service SDK API Generation Live SDK API updates for interactive prototyping using TypeScript, SDK API generation for application development 2 Deployment Architecture MySQL REST Service (MRS) can be deployed in many different ways depending on the individual project requirements. Deployments for Development The smallest possible development environment consists of a single MySQL Server instance and a MySQL Router instance running on the same machine. The recommended deployment for development consists of an InnoDB Cluster deployed with a minimum of three MySQL Server instances and two MySQL Router instances. For cloud-based development, a MySQL Database Service instance with the high availability feature enabled and two compute instances with MySQL Router deployments should be used. Production Deployments In a production environment, an InnoDB Cluster set up with three or more MySQL Router instances should be used. It is recommended to use a load balancer to expose the HTTPS port of the MySQL Router instances to the public internet. For cloud-based development in production, a MySQL Database Service instance with the high availability feature enabled and three or more compute instances with MySQL Router deployments should be used. It is recommended to use a load balancer to expose the HTTPS port of the MySQL Routers to the public internet. MySQL REST Service Architecture Diagram 3 Configuring MySQL REST Service To configure the MySQL REST Service (MRS), use these steps: Deploy a MySQL solution. Configure the MRS metadata database schema. Bootstrap and run one or more MySQL Router instances for MRS support. After performing these steps, MySQL REST Service is fully configured. The HTTP/S endpoints can then be accessed as configured during the MySQL Router bootstrap process. Deployment of a MySQL solution The following MySQL solutions are supported: MySQL HeatWave MySQL InnoDB Cluster MySQL InnoDB ClusterSet MySQL InnoDB ReplicaSet MySQL Operator For development purposes, a standalone MySQL Server instance is also supported. Avoid using a standalone setup in a production deployment because it provides no form of High Availability (HA). Standalone MySQL Server See the corresponding documentation about how to deploy and configure the different MySQL solutions. 3.1 Configuring the MRS Metadata Schema MySQL REST Service stores its configuration in the mysql_rest_service_metadata database schema. To deploy the metadata schema, perform one of the tasks described in this section. Note: The MySQL user that is used to connect to the MySQL Solution must have MySQL privileges to create database schemas and roles. 3.1.1 MRS Configuration Using MySQL Shell for VS Code Start VS Code, install the MySQL Shell for VS Code extension, and then add a database connection to the MySQL setup. Right-click the connection in the DATABASE CONNECTIONS view and select Configure Instance for MySQL REST Service Support. Configure Instance for MySQL REST Service Support The MRS metadata schema has now been configured. 3.1.2 MRS Configuration Using MySQL Shell Open a terminal, start MySQL Shell, and connect to the MySQL setup. mysqlsh dba@localhost Configure the metadata schema using the MRS plugin by executing mrs.configure(). MySQL> localhost:33060+> JS> mrs.configure() MySQL Rest Data Service configuration. Checking MRS metadata schema and version... Creating MRS metadata schema... The MRS metadata is well configured, no changes performed. The MRS metadata schema has now been configured. 3.2 Bootstrapping and Running MySQL Routers with MRS Support MySQL Router is an essential part of any MySQL solution and therefore often deployed in the same step as the MySQL Server instances. See the MySQL Router documentation for more details. A MySQL Router instance needs to be configured to support MRS. This is usually done by using the mysqlrouter_bootstrap command, which queries the user account for the necessary information. 3.2.1 Using MySQL Shell for VS Code to Bootstrap and Run MySQL Router When working with a local development setup it is common to install the MySQL Router instance on the local development machine. In this case, MySQL Shell for VS Code can be used to simplify the bootstrap process and to launch the MySQL Router instance as follows: Download and install the MySQL Router package on your local development machine When not using the DMG on macOS or MSI package on Windows to install MySQL Router, be sure that the directory containing the MySQL Router binaries is in the system PATH. Inside MySQL Shell for VS Code, expand a DB Connection in the DATABASE CONNECTIONS view, right-click the MySQL REST Service tree item, and then select Start Local MySQL Router Instance. If the MySQL Router has not been configured yet, the bootstrap operation runs in an integrated VS Code terminal and then starts MySQL Router. MySQL Router debug output can then be inspected in the VS Code terminal. To shut down MySQL Router, set the focus to the VS Code terminal showing the debug output and press Ctrl + C. Note: The previous task only works for classic MySQL connections that are not using the MySQL SSH tunneling or MDS tunneling feature. Bootstrap and Start MySQL Router After the MySQL Router has been bootstrapped and started, MRS is available at https://localhost:8443/<service-name>. You can then proceed and add a REST service. 3.2.2 Bootstrapping MySQL Router From the Command Line When deploying a new MySQL Router instance, it is advised to use the mysqlrouter_bootstrap command to bootstrap and configure the router, including the MRS configuration. This is also true for reconfiguring an existing MySQL Router instance for MRS support. mysqlrouter_bootstrap dba@127.0.0.1:3306 --mrs --directory ~/.mysqlrouter Follow the interactive steps on the command line to configure the router. Manual Creation of MySQL User Account for MySQL Router Access When using the mysqlrouter_bootstrap command to configure MySQL Router for MRS, access the user accounts described in this section can be created automatically. If you want to manage the required MySQL accounts manually, the following steps need to be performed: Create the MySQL user account(or accounts) If only one account is specified, MySQL Router uses it to access both the MRS metadata schema and application schema data. This account must have the mysql_rest_service_meta_provider and mysql_rest_service_data_provider roles. If two accounts are used, MySQL Router, uses one for the MRS metadata schema access and the other one for the application schema data. Assign the mysql_rest_service_meta_provider role to one user and mysql_rest_service_data_provider to the other. Bootstrap the MySQL Routers instance using the created MySQL accounts with the following options: --mrs-mysql-metadata-account used by the router to access the MRS metadata schema --mrs-mysql-data-account used by the router to access the application schema As part of the MRS metadata schema creation, two SQL ROLEs have been created for MySQL Router to access MySQL: The ‘mysql_rest_service_meta_provider’ ROLE grants access to the required MRS metadata schema tables. The ‘mysql_rest_service_data_provider’ ROLE grants access to the served schema objects in the application database schemas. To create the MySQL account, connect to the MySQL setup with MySQL Shell or MySQL Shell for VS Code and execute the following SQL statements: CREATE USER 'mysqlrouter_mrs_<router_name>'@'<router_host>' IDENTIFIED BY 'password'; GRANT 'mysql_rest_service_meta_provider', 'mysql_rest_service_data_provider' TO 'mysqlrouter_mrs_<router_name>'@'<router_host>'; The user name specified for the account can then be used when calling the mysqlrouter_bootstrap command. Option Description --mrs-mysql-metadata-account=USER_NAME Setting the MRS metadata user --mrs-mysql-data-account=USER_NAME Setting the MRS data user Adding a MRS Configuration to an Existing MySQL Router Configuration In case your MySQL Router instances are configured already, it is possible to add the MRS configuration later on. To get the path of the existing configuration file, execute mysqlrouter --help to show the exact location of the router config file. The following is an example when connecting to a single development server. [DEFAULT] logging_folder = /var/log/mysqlrouter runtime_folder = /var/run/mysqlrouter config_folder = /etc/mysqlrouter [logger] level = DEBUG [routing:mrs_rw] bind_address=0.0.0.0 bind_port=6446 destinations=10.0.1.135:3306 routing_strategy=round-robin protocol=classic To enable MRS support on the router, the configuration file needs to be extended with the [http_server] section and the [rest_mrs] section. It is advised to use the mysqlrouter_bootstrap command to configure the router for MRS. mysqlrouter_bootstrap dba@127.0.0.1:13000 --mrs --directory /export/mysql/src/mysql-trunk/boot These parameters can be used to set the MRS configuration options. Option Description --mrs Include MRS configuration --mrs-mysql-metadata-account=USER_NAME Setting the MRS metadata user --mrs-mysql-data-account=USER_NAME Setting the MRS data user --mrs-global-secret=SECRET The global JWT secret that must be the same for every MySQL Router installation The following example demonstrates connecting to a single development server and serving the REST services using HTTP. [http_server] port=8443 ssl=1 ssl_cert=/Users/myUser/.mysqlsh/plugin_data/gui_plugin/web_certs/server.crt ssl_key=/Users/myUser/.mysqlsh/plugin_data/gui_plugin/web_certs/server.key [mysql_rest_service] mysql_read_only_route=bootstrap_ro mysql_read_write_route=bootstrap_rw mysql_user=mysql_router_mrs16_250ho3u15n mysql_user_data_access= router_id=16 4 Adding REST Services and Database Objects MRS supports the setup of a large number individual REST services. Each REST service has its own settings for URL path, host name, supported protocols, authentication options, and other settings. A service can expose a selected list of database schemas and objects. It is possible to perform an individual setup for each application and it is advised to setup an separate REST service for each application. Preconditions for Adding a REST Service Before setting up a new REST service, ensure that the following preconditions are met: The MySQL REST Service must be configured on the targeting MySQL Solution. Please see the Configuration section of this manual. The MySQL account used to connect to the targeting MySQL Solution needs to be granted the mysql_rest_service_admin MySQL role or a superset of privileges. To grant the mysql_rest_service_admin MySQL role, execute the following SQL statement. GRANT 'mysql_rest_service_admin' TO 'user_account'@'%'; -- Please ensure to include all roles in the next statement -- that should become active when the user connects ALTER USER 'user_account'@'%' DEFAULT ROLE 'mysql_rest_service_admin'; 4.1 Setting Up a New RE"
