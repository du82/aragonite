full_description = "Documentation Home Extending MySQL 8.0 Preface and Legal Notices Introduction MySQL Threads The MySQL Test Suite The MySQL Plugin API Types of Plugins Plugin API Characteristics Plugin API Components Writing Plugins Overview of Plugin Writing Plugin Data Structures Server Plugin Library and Plugin Descriptors Server Plugin Status and System Variables Client Plugin Descriptors Compiling and Installing Plugin Libraries Writing Full-Text Parser Plugins Writing Daemon Plugins Writing INFORMATION_SCHEMA Plugins Writing Semisynchronous Replication Plugins Writing Audit Plugins Writing Authentication Plugins Writing the Server-Side Authentication Plugin Writing the Client-Side Authentication Plugin Using the Authentication Plugins Implementing Proxy User Support in Authentication Plugins Writing Password-Validation Plugins Writing Protocol Trace Plugins Using the Test Protocol Trace Plugin Using Your Own Protocol Trace Plugins Writing Keyring Plugins MySQL Services for Plugins Adding Functions to MySQL Adding a Native Function Adding a Loadable Function Porting MySQL Index Download this Manual PDF (US Ltr) - 420.4Kb PDF (A4) - 419.7Kb version 8.0 9.2 9.1 9.0 8.4 current 5.7 Extending MySQL 8.0 Abstract This document describes what you need to know when working on the MySQL 8.0 code. To track or contribute to MySQL development, follow the instructions in Installing MySQL Using a Development Source Tree. If you are interested in MySQL internals, you should also join the MySQL Community Slack. Feel free to ask questions about the code and to send patches that you would like to contribute to the MySQL project! For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-03-02 (revision: 81077) Table of Contents Preface and Legal Notices 1 Introduction 2 MySQL Threads 3 The MySQL Test Suite 4 The MySQL Plugin API 4.1 Types of Plugins 4.2 Plugin API Characteristics 4.3 Plugin A