full_description = "Documentation Home MySQL Cluster Manager 9.0 User Manual Preface and Legal Notices Overview of MySQL Cluster Manager What Is New in MySQL Cluster Manager 9.0 MySQL Cluster Manager Installation, Configuration, Cluster Setup Using MySQL Cluster Manager MySQL Cluster Manager Client Commands MySQL Cluster Manager Limitations and Known Issues Attribute Summary Tables Index Related Documentation MySQL Cluster Manager 9.0 Release Notes Download this Manual PDF (US Ltr) - 1.3Mb PDF (A4) - 1.3Mb version 9.0 9.2 9.1 8.4 current 8.0 1.4 MySQL Cluster Manager 9.0.1 User Manual Abstract This is the User Manual for the MySQL Cluster Manager, version 9.0.1. It documents the MySQL Cluster Manager Agent and MySQL Cluster Manager Client software applications, which can be used to administer MySQL NDB Cluster, a version of the MySQL Database System (referred to hereafter as “MySQL Server” or simply “MySQL”) that incorporates the NDB storage engine for high availability and data redundancy in a distributed computing environment. This manual applies to MySQL Cluster Manager 9.0.1 and contains information that may not apply to older versions of the MySQL Cluster Manager software. For documentation covering previous MySQL Cluster Manager releases, see MySQL Documentation: MySQL NDB Cluster, on the MySQL website. MySQL Cluster Manager features. This manual describes features that may not be included in every version of MySQL Cluster Manager, and such features may not be included in the version of MySQL Cluster Manager licensed to you. If you have any questions about the features included in your version of MySQL Cluster Manager, refer to your MySQL Cluster Manager license agreement or contact your Oracle sales representative. MySQL Cluster Manager, MySQL Server, and MySQL NDB Cluster features. This manual contains certain basic information about MySQL Server and MySQL NDB Cluster; however, it is not in any way intended as an exhaustive reference for either of these products. Current versions of MySQL NDB Cluster compatible with MySQL Cluster Manager are based on versions 9.0, 8.4, and 8.0 of the NDB storage engine; these versions of MySQL NDB Cluster are known as “MySQL NDB Cluster 9.0,”, “MySQL NDB Cluster 8.4,” and “MySQL NDB Cluster 8.0” respectively. MySQL NDB Cluster functionality varies between MySQL NDB Cluster releases; MySQL Cluster Manager cannot supply or emulate MySQL NDB Cluster features that are not present in the version of the MySQL NDB Cluster software in use. For complete information about MySQL Server and MySQL NDB Cluster see MySQL NDB Cluster 9.0, MySQL NDB Cluster 8.4, and MySQL NDB Cluster 8.0. If you do not have the MySQL Server and MySQL NDB Cluster documentation, you can obtain it free of charge from the MySQL Documentation Library, on the MySQL website. For notes detailing the changes in each release of MySQL Cluster Manager , see MySQL Cluster Manager 9.0 Release Notes. For legal information, see the Legal Notices. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-01-28 (revision: 80794) Table of ContentsPreface and Legal Notices1 Overview of MySQL Cluster Manager1.1 MySQL Cluster Manager Terminology1.2 MySQL Cluster Manager Architecture1.3 Basic Operational Concepts for MySQL Cluster Manager1.3.1 Quorum Requirement1.3.2 Eventual Consistency2 What Is New in MySQL Cluster Manager 9.03 MySQL Cluster Manager Installation, Configuration, Cluster Setup3.1 Obtaining MySQL Cluster Manager3.2 Supported Platforms and MySQL NDB Cluster Versions3.3 MySQL Cluster Manager Installation3.3.1 Installing MySQL Cluster Manager on Unix-like Platforms3.3.2 Installing MySQL Cluster Manager on Windows Platforms3.3.3 Setting the MySQL Cluster Manager Agent User Name and Password3.4 MySQL Cluster Manager Configuration File3.5 Upgrading MySQL Cluster Manager4 Using MySQL Cluster Manager4.1 mcmd, the MySQL Cluster Manager Agent4.2 Start