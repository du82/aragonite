ok: Create and Drop a View DB Notebook: Show Data in Visual Graph Format Appendices AdminAPI Quick Reference Dba Class Methods Cluster Class Methods ClusterSet Class Methods ReplicaSet Class Methods Command Palette and Display Setting Reference Command Palette Display Settings Icons for Auto-Completion MySQL Shell for VS Code Certificates MySQL Shell for VS Code / Getting Started / Set Up MySQL Shell for VS Code 2.1 Set Up MySQL Shell for VS Code This section describes how to install the MySQL Shell for VS Code for use inside Visual Studio Code and to activate an embedded instance of MySQL Shell if it is not installed on your system. MySQL Shell is a component that you can install separately. Download the MySQL Shell for VS Code extension file Install the MySQL Shell for VS Code extension How to get MySQL Requirements The MySQL Shell for VS Code extension is available on Microsoft Windows, Linux, and macOS platforms. This installation requires: Visual Studio Code (update to the latest version), supported on the following platforms: Windows 10+ (x64) macOS 11+ (arm64, x64) Linux glibc 2.12 (arm64, x64) The MySQL Shell for VS Code extension is tested with these distributions. Linux Distribution Releases Debian 11 Ubuntu 20.04, 22.04 Ubuntu-WSL2 20.04 Kubuntu 21.10 RedHat/OEL 7, 8 Fedora 35 Raspberry Pi OS January 28th 2022 MySQL Shell 8.0.28 and later (optional). If you intend to maintain MySQL Shell as a standalone product, instead of using the embedded instance, install MySQL Shell before installing the MySQL Shell for VS Code extension. This extension requires the MS VC++ runtime libraries on Windows platforms. Please download them from the following web page and install them on your system. MS Visual C++ 2019 Redistributable Access to MySQL Server or MySQL Database Service, 8.0.28 and later. Download the MySQL Shell for VS Code extension file The MySQL Shell for VS Code is available for you to install or download from the Visual Studio Marketplace. Install the MySQL Shell for VS Code extension Click Install on the Visual Studio Marketplace entry. Open Visual Studio Code and select Appearance from the View menu. From the open list, enable: Show Side Bar Show Status Bar Show Activity Bar Click the Extensions icon in the activity bar to open the view in the side bar. In the EXTENSIONS: MARKETPLACE search, enter "MySQL Shell for VS Code". Click Install on the entry for MySQL Shell for VS Code. Restart Visual Studio Code when prompted to complete the installation. How to get MySQL MySQL Server Check our downloads page at https://dev.mysql.com/downloads/ for information about the current version of MySQL and for downloading instructions. For RPM-based Linux platforms that use Yum as their package management system, MySQL can be installed using the MySQL Yum Repository. See Installing MySQL on Linux Using the MySQL Yum Repository for details. For Debian-based Linux platforms, MySQL can be installed using the MySQL APT Repository. See Installing MySQL on Linux Using the MySQL APT Repository for details. For SUSE Linux Enterprise Server (SLES) platforms, MySQL can be installed using the MySQL SLES Repository. See Using the MySQL SLES Repository for details. To obtain the latest development source, see Installing MySQL Using a Development Source Tree. MySQL Database Service See Getting Started with MySQL Database Service. PREV HOME UP NEXT $(function() { var doc = new $.doc({ 'mobile': $.browser.mobile, 'docId': 114, 'highlight': true }); });'''
