title = "MySQL Connector/NET and X DevAPI"
full_description = "MySQL Connector/NET and X DevAPI MySQL Connector/NET 9.2 supports X Protocol, which enables you to use X DevAPI with the .NET language of choice to develop applications that communicate with a MySQL server functioning as a document store, relational database, or both. To get started, review the following main classes: MySQLX: Features static methods for creating sessions using the X Protocol. Session: Represents a server session. DbDoc: Represents a generic document. Collection: Represents a collection of documents. Schema: Represents a schema or database. Result: Represents a general statement result. DocResult: Represents the result of an operation that includes a collection of documents. For an introduction to X DevAPI concepts, see the X DevAPI User Guide. For general information about MySQL Connector/NET, see the MySQL Connector/NET Developer Guide. MySQL Connector/NET MySQL Connector/NET 9.2 also supports the development of .NET, .NET Core and .NET Framework applications that require secure, high-performance data connectivity with MySQL through the classic protocol. It supports ADO.NET, Entity Framework and various web providers. To get started, review the following main classes: MySqlConnection: Represents an open connection to a MySQL database. MySqlConnectionStringBuilder: Aids in the creation of a connection string by exposing the connection options as properties. MySqlCommand: Represents an SQL statement to execute against a MySQL database. MySqlCommandBuilder: Automatically generates single-table commands used to reconcile changes made to a DataSet object with the associated MySQL database. MySqlDataAdapter: Represents a set of data commands and a database connection that are used to fill a data set and update a MySQL database. MySqlDataReader: Provides a means of reading a forward-only stream of rows from a MySQL database. MySqlException: The exception that is thrown when MySQL returns an error. MySqlHelper: Helper class that makes it easier to work with the provider. MySqlTransaction: Represents an SQL transaction to be made in a MySQL database. MySQLMembershipProvider: Manages storage of membership information for an ASP.NET application in a MySQL database. MySQLRoleProvider: Manages storage of role membership information for an ASP.NET application in a MySQL database. MySqlEFConfiguration: Adds the dependency resolvers for MySQL classes. MySqlExecutionStrategy: Enables automatic recovery from transient connection failures. For additional information about MySQL Connector/NET, see the MySQL Connector/NET Developer Guide. Additional Resources MySQL Discussion Forum MySql Bugs database For more information about this and other MySQL products, please visit MySQL Contact & Questions."
