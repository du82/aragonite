title = "MySQL :: MySQL Workbench Manual"
full_description = "Documentation Home MySQL Workbench Manual Preface and Legal Notices General Information Installation Configuration Home Screen Tab Connections in MySQL Workbench Administrative Tasks Performance Tools Database Development Database Design and Modeling Database Migration Wizard MySQL Workbench Frequently Asked Questions Keyboard Shortcuts Extending Workbench How To Report Bugs or Problems MySQL Enterprise Features MySQL Utilities Related Documentation MySQL Workbench Release Notes Download this Manual PDF (US Ltr) - 17.0Mb PDF (A4) - 17.0Mb MySQL Workbench Abstract This is the MySQL Workbench Reference Manual. It documents the MySQL Workbench Community and MySQL Workbench Commercial releases for versions 8.0 through 8.0.41. MySQL Workbench is developed and tested with MySQL Server 8.0. MySQL Workbench may connect to MySQL Server 8.4 and higher but some MySQL Workbench features may not function with those later server versions. MySQL Workbench platform support evolves over time. For the latest platform support information, see https://www.mysql.com/support/supportedplatforms/workbench.html. For notes detailing the changes in each release, see the MySQL Workbench Release Notes. For legal information, including licensing information, see the Preface and Legal Notices. If you have not yet installed the MySQL Workbench Community release, please download your free copy from the download site. The MySQL Workbench Community release is available for Microsoft Windows, macOS, and Linux. For help with using MySQL, please visit the MySQL Forums, where you can discuss your issues with other MySQL users. Document generated on: 2025-03-04 (revision: 81100) Table of Contents Preface and Legal Notices 1 General Information 1.1 What Is New in MySQL Workbench 1.1.1 New in MySQL Workbench 8.0 Release Series 1.1.2 New in MySQL Workbench 6.0 Release Series 1.2 MySQL Workbench Editions 2 Installation 2.1 System Requirements 2.2 Command-Line Options 2.3 MySQL Workbench on