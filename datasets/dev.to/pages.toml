title = "Status Codes - DEV Community"
description = "Status codes trong HTTP phản ánh kết quả của một yêu cầu HTTP từ máy khách tới máy chủ. Các mã trạng..."
full_description = "Do Van Phuc Posted on Mar 1 Status Codes Status codes trong HTTP phản ánh kết quả của một yêu cầu HTTP từ máy khách tới máy chủ. Các mã trạng thái này giúp máy khách biết kết quả của yêu cầu và hành động tiếp theo cần thực hiện. Dưới đây là một số nhóm mã trạng thái phổ biến và ý nghĩa của chúng: 2xx: Success (Thành công) 200 OK: Yêu cầu thành công. 201 Created: Tài nguyên mới đã được tạo. 204 No Content: Yêu cầu thành công nhưng không có nội dung trả về. 3xx: Redirection (Chuyển hướng) 301 Moved Permanently: URL đã thay đổi vĩnh viễn. 302 Found: URL tạm thời thay đổi. 304 Not Modified: Không có thay đổi từ lần yêu cầu cuối. 4xx: Client Error (Lỗi từ phía khách hàng) 400 Bad Request: Yêu cầu không hợp lệ. 401 Unauthorized: Người dùng chưa được xác thực. 403 Forbidden: Người dùng không có quyền truy cập. 404 Not Found: Không tìm thấy tài nguyên. 405 Method Not Allowed: Phương thức không được phép. 5xx: Server Error (Lỗi từ phía máy chủ) 500 Internal Server Error: Lỗi từ phía máy chủ. 502 Bad Gateway: Máy chủ đóng vai trò là gateway hoặc proxy và nhận được phản hồi không hợp lệ từ máy chủ khác. 503 Service Unavailable: Dịch vụ không khả dụng. 504 Gateway Timeout: Máy chủ đóng vai trò là gateway hoặc proxy và không nhận được phản hồi kịp thời từ máy chủ khác. Top comments (0) Subscribe Personal Trusted User Create template Templates let you quickly answer FAQs or store snippets for re-use. Submit Preview Dismiss Code of Conduct • Report abuse Are you sure you want to hide this comment? It will become hidden in your post, but will still be visible via the comment's permalink. Hide child comments as well Confirm For further actions, you may consider blocking this person and/or reporting abuse"
