full_description = '''Do Van Phuc Posted on Mar 1 RESTful API API (Application Programming Interface) là một tập các quy tắc và cơ chế mà theo đó, một ứng dụng hay một thành phần sẽ tương tác với một ứng dụng hay thành phần khác. API có thể trả về dữ liệu mà bạn cần cho ứng dụng của mình ở những kiểu dữ liệu phổ biến như JSON hay XML. REST (REpresentational State Transfer) là một dạng chuyển đổi cấu trúc dữ liệu, một kiểu kiến trúc để viết API. Nó sử dụng phương thức HTTP đơn giản để tạo cho giao tiếp giữa các máy. Vì vậy, thay vì sử dụng một URL cho việc xử lý một số thông tin người dùng, REST gửi một yêu cầu HTTP như GET, POST, DELETE,... đến một URL để xử lý dữ liệu. RESTful API là một tiêu chuẩn dùng trong việc thiết kế các API cho các ứng dụng web để quản lý các resource. RESTful là một trong những kiểu thiết kế API được sử dụng phổ biến ngày nay để cho các ứng dụng (web, mobile…) khác nhau giao tiếp với nhau. Các phương thức HTTP phổ biến GET Phương thức GET được sử dụng để yêu cầu dữ liệu từ một tài nguyên trên máy chủ. Phương thức này có tính bất biến nên có thể gọi nhiều lần mà vẫn ra cùng 1 kết quả cho đến khi một phương thức khác làm thay đổi tài nguyên. Không có body. Sử dụng khi muốn lấy dữ liệu mà không thay đổi trạng thái của tài nguyên. Ví dụ lấy dữ liệu để hiển thị ra màn hình. POST Phương thức POST được sử dụng để gửi dữ liệu đến máy chủ để tạo một tài nguyên mới. POST không có tính bất biến vì vậy khi gửi 2 yêu cầu giống hệt nhau sẽ tạo ra 2 tài nguyên khác nhau, cùng dữ liệu (trừ ID). Có body. Sử dụng khi muốn tạo mới một tài nguyên. Ví dụ dùng để tạo tài khoản cho người dùng, tạo sản phẩm mới,... PUT Phương thức PUT được sử dụng để cập nhật toàn bộ thông tin của tài nguyên hiện có trên máy chủ. Có body. Sử dụng khi muốn cập nhật toàn bộ thông tin của một tài nguyên. PATCH Phương thức PATCH được sử dụng để cập nhật một phần thông tin của tài nguyên hiện có trên máy chủ. Có body. Sử dụng khi muốn cập nhật một phần cụ thể của tài nguyên. DELETE Phương thức DELETE được sử dụng để xóa một tài nguyên khỏi máy chủ. Sử dụng khi muốn xóa một tài nguyên. Không có body. OPTIONS Phương thức OPTIONS được sử dụng để mô tả các tùy chọn giao tiếp cho tài nguyên mục tiêu. Nó trả về các phương thức HTTP mà máy chủ hỗ trợ cho URL cụ thể đó. Không có body. Sử dụng khi muốn kiểm tra các phương thức HTTP được phép sử dụng cho một tài nguyên hoặc kiểm tra cấu hình của máy chủ mà không thực hiện bất kỳ hành động cụ thể nào. Trong RESTful APIs, "body" là phần dữ liệu được gửi kèm với yêu cầu hoặc phản hồi HTTP. Body có thể chứa bất kỳ dữ liệu nào mà máy chủ hoặc máy khách muốn truyền tải. Các phương thức GET và DELETE thường không có body, vì GET chỉ yêu cầu dữ liệu từ máy chủ và DELETE chỉ yêu cầu xóa một tài nguyên cụ thể. Phương thức POST, PUT và PATCH thường có body để truyền tải thông tin dữ liệu cần thiết cho máy chủ xử lý. Top comments (0) Subscribe Personal Trusted User Create template Templates let you quickly answer FAQs or store snippets for re-use. Submit Preview Dismiss Code of Conduct • Report abuse Are you sure you want to hide this comment? It will become hidden in your post, but will still be visible via the comment's permalink. Hide child comments as well Confirm For further actions, you may consider blocking this person and/or reporting abuse'''
