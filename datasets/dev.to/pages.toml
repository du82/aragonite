full_description = '''Nikola Perišić for Dev.to Rater Organization Posted on Feb 18 The end: Create React App (2016-2025) #webdev #programming #javascript #react The Sunsetting of Create React App On February 14, 2025, React officially deprecated Create React App (CRA), marking the end of an era for React developers. For years, CRA was the go-to tool for bootstrapping new React projects. Why is Create React App Being Deprecated? React ecosystem has evolved significantly since CRA’s introduction in 2016. Modern frameworks and build tools have surpassed CRA in both performance and flexibility. With no active maintainers and better alternatives available, the React team decided to retire CRA. The React team is encouraging developers to migrate to frameworks like Next.js or build tools like Vite. Also because: CRA does not provide a routing system CRA lacks optimized data-fetching strategies CRA ships apps as a single JavaScript bundle, which can result in longer load times. Modern frameworks automatically handle code splitting CRA has lacked active maintainers What now? Starting today, developers installing Create React App will see a deprecation warning: create-react-app is deprecated. You can find a list of up-to-date React frameworks on react.dev For more info see: react.dev/link/cra Enter fullscreen mode Exit fullscreen mode CRA will still function in maintenance mode and has been updated to support React 19. However, no new features will be added, and developers are strongly encouraged to migrate to modern solutions. How to Migrate Away from Create React App You can visit the official guide at the React blog post here. Final Thoughts Our tip: If you're looking for the simplest and most efficient way to set up a new React project after Create React App's deprecation, React + Vite is the way to go. What are your thoughts on this change? Let’s discuss in the comments! 🚀 Top comments (50) Subscribe Personal Trusted User Create template Templates let you quickly answer FAQs or store snippets for re-use. Submit Preview Dismiss Collapse Expand Amir Husain Amir Husain Amir Husain Follow Joined Feb 19, 2025 • Feb 19 Dropdown menu Copy link Hide React + vite or react + next which one is more future secure? Like comment: Like comment: 14 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide Hello, Amir! I think it depends on your project’s needs. React + Vite is awesome for fast development. It's the best choice for SPAs & smaller projects IMO. On the other hand, React + Next is best for scalability because of it's server-side rendering(SRR) and static generation(SSG) and built-in routing. I don't think you can go wrong whichever one you choose. Thanks for the comment 🚀 Like comment: Like comment: 8 likes Like Comment button Reply Collapse Expand programORdie programORdie programORdie Follow Hi! Thank for clicking on my profile! I am a dev that doesn't know how to stop progamming, and i like making AI's that gonna take over the world. Location Mars Pronouns He/him/Alien Joined Mar 21, 2024 • Feb 20 Dropdown menu Copy link Hide For big projects nextjs, for quick testing or static pages vite Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide Agree @programordie Like comment: Like comment: 2 likes Like Comment button Reply Collapse Expand anscarlett anscarlett anscarlett Follow Joined May 24, 2021 • Feb 21 Dropdown menu Copy link Hide Webassembly Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 22 Dropdown menu Copy link Hide For sure! Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Jayaraj Viswanathan Jayaraj Viswanathan Jayaraj Viswanathan Follow Joined Aug 24, 2024 • Feb 20 Dropdown menu Copy link Hide Definitely next js!! Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Sarfaraz Shaik Sarfaraz Shaik Sarfaraz Shaik Follow Software engineer Joined Jul 1, 2024 • Feb 20 Dropdown menu Copy link Hide It's sad that CRA is deprecated, but I'm excited to try Next.js and Vite for better one Like comment: Like comment: 6 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide Yes, it's sad. To be honest, I haven't used it in a long time. I remember using it when I started learning React.js. I always use React + Vite + Typescript. However, there is some nostalgia because the first React app I built was generated using CRA :( Like comment: Like comment: 5 likes Like Comment button Reply Collapse Expand Osman Zakir Osman Zakir Osman Zakir Follow Joined Feb 20, 2025 • Feb 20 Dropdown menu Copy link Hide I'm the same way. Using Next.js with TypeScript now, and React + TypeScript + Vite if Next.js isn't needed, but CRA still gives me nostalgia. Like comment: Like comment: 4 likes Like Comment button Reply Collapse Expand the_aceix the_aceix the_aceix Follow Joined Nov 10, 2018 • Feb 20 Dropdown menu Copy link Hide Just deprecate react already. Vue is the better Like comment: Like comment: 4 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide I like Vue, but what are the key things because you think it's better? Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Drew Riley Drew Riley Drew Riley Follow Joined May 15, 2024 • Feb 21 Dropdown menu Copy link Hide Omg 100% The slowest websites are all React. Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Zach Goethel Zach Goethel Zach Goethel Follow Location Wisconsin, United States Work Full Stack Software Developer Joined Feb 21, 2025 • Feb 21 Dropdown menu Copy link Hide I don't disagree. However, Blazor WebAssembly would like to talk to you ;P Like comment: Like comment: Like Comment button Reply Collapse Expand muwanguzi alvin muwanguzi alvin muwanguzi alvin Follow Joined Jul 22, 2024 • Feb 20 Dropdown menu Copy link Hide Now where does this leave react native? Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 • Edited on Feb 20 • Edited Dropdown menu Copy link Hide Hello! I have good news for you 🙂 React Native remains unaffected by CRA's deprecaton because it has its own ecosystem. Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Friday candour Friday candour Friday candour Follow I solve problems qualitatively. creator of all Uiedbook's packages https://github.com/Uiedbook . Email fridaycandours@gmail.com Education Computer science Pronouns He/him Work Developer Joined Jan 9, 2021 • Feb 20 Dropdown menu Copy link Hide Which is metro bundler Like comment: Like comment: 1 like Like Thread Thread Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide Yep Like comment: Like comment: 1 like Like Thread Thread Drew Riley Drew Riley Drew Riley Follow Joined May 15, 2024 • Feb 21 Dropdown menu Copy link Hide Metro with react 19? Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Nerdherd Nerdherd Nerdherd Follow The Good SWE Joined Mar 26, 2019 • Feb 20 Dropdown menu Copy link Hide Im coming from NextJS (used at work for an e-commerce platform), and have to say I'm really liking the simplicity of react-router v7 over the vastly many concepts you have to know in nextjs. Like comment: Like comment: 2 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide Like for example? Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Nerdherd Nerdherd Nerdherd Follow The Good SWE Joined Mar 26, 2019 • Feb 20 • Edited on Feb 20 • Edited Dropdown menu Copy link Hide I like that: caching is just using http headers Back in NextJS 14, I had to run a bash script that would periodically delete cached images on my instance (it was a simple setup, since we didnt have time for a CDN) the only alternative was to use vercel that automatically handles the cached files back then, not sure if its the same now since ive not run latest nextjs in prod. I didnt like that we would be vendor locked in, especially for a small company. routing can either be explicit or via file/directory of your pages (using fs-routes) I personally prefer explicitness for routing for larger frontend projects client vs server side rendering is defined with a simple clientLoader function in a file that defines your page component it feels more natural to have it defined as a function to me vs having a 'use client' string defined in the page in NextJS React router provides SSR with actions the action functions visually breaks the page into key "segments" making it feel more "class-like" makes it easier for junior and mid-lvl engineers in my team to reason about , especially if they're new to frontend and need to work on simple CRUD dashboards for internal tools. NextJS has something similar to react-router's actions with getServerSideProps and getStaticProps, but I never managed to get the caching mechanism to work properly maybe my understanding was poor or did not learn the proper fundamentals of nextjs in the rush to build the web app Like comment: Like comment: 1 like Like Thread Thread Daniel Friesen Daniel Friesen Daniel Friesen Follow Joined Jan 4, 2019 • Feb 23 Dropdown menu Copy link Hide You might want to revisit Next.js sometime. I don't know whether it'll be exactly to your taste. But Next.js' old pages directory API (the one with getServerSideProps) and the new app directory API are so different they might as well be completely different frameworks. Caching is still changing so you might want to wait, but it's already very different from what you remember. You are limited to file based routing, but having layouts changes things a lot. And stuff like getServerSideProps is completely replaced with React's new RSC components and Server Actions. Like comment: Like comment: 2 likes Like Comment button Reply Collapse Expand Hem D Hem D Hem D Follow Joined Jul 26, 2017 • Feb 23 Dropdown menu Copy link Hide I haven’t used Remix at work yet due to company needs but this should give some insight: remix.run/blog/remix-vs-next Like comment: Like comment: 1 like Like Comment button Reply Collapse Expand Muhammad Qasim Muhammad Qasim Muhammad Qasim Follow Software Engineer Joined Feb 20, 2025 • Feb 20 Dropdown menu Copy link Hide Should i give up learning react ? 🤔 Like comment: Like comment: 2 likes Like Comment button Reply Collapse Expand Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 20 Dropdown menu Copy link Hide No, just learn it the right way. I suggest React + Vite + TypeScript + Tailwind + Sass Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Muhammad Qasim Muhammad Qasim Muhammad Qasim Follow Software Engineer Joined Feb 20, 2025 • Feb 20 Dropdown menu Copy link Hide Ahh i see, thank you so much Like comment: Like comment: 3 likes Like Comment button Reply Collapse Expand Rense Bakker Rense Bakker Rense Bakker Follow I am a fullstack developer with experience designing and building responsive web apps. Proficient with ReactJS, Typescript, Javascript, HTML and CSS. Joined Feb 20, 2022 • Feb 25 Dropdown menu Copy link Hide Disagree on learning tailwind and sass. Learn css, which is a transferable skill for the web and then have a look at any styling solution for react except tailwind 😛 I recommend pandacss. Like comment: Like comment: 1 like Like Thread Thread Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.com Location Podgorica, Montenegro Education BSc Information Technologies, University of Donja Gorica Work Software Engineer @ Vega IT Joined Jun 27, 2023 • Feb 25 Dropdown menu Copy link Hide CSS must be known. That's the default. That's why I didn't mention it Like comment: Like comment: 1 like Like Thread Thread Rense Bakker Rense Bakker Rense Bakker Follow I am a fullstack developer with experience designing and building responsive web apps. Proficient with ReactJS, Typescript, Javascript, HTML and CSS. Joined Feb 20, 2022 • Feb 26 Dropdown menu Copy link Hide You don't need to know any CSS for tailwind, which is already happening... People don't know how to do the simplest things with CSS, all they know is limited tailwind utility class names. Like comment: Like comment: 1 like Like Thread Thread Nikola Perišić Nikola Perišić Nikola Perišić Follow Software Engineer | Technical Writer | 100k+ Reads Email perisicnikola37@gmail.co'''
