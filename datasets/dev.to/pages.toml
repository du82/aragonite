description = "A collection of 10 cool and exciting front-end demos shared on CodePen during February 2025. Tagged with html, css, showdev, javascript."
full_description = "Alvaro Montoro Posted on Mar 1 • Originally published at alvaromontoro.com 10 Cool CodePen Demos (February 2025) #html #css #showdev #javascript Studio Ghibli - ThreeJS A three-JS-dimensional homage to Studio Ghibli movies by Ricardo Oliva Alonso. Pay attention to the details and how clean it looks. Can you find the hidden Easter eggs in this demo? Single-element wavy range slider I've seen many type of range sliders, but this is a first: a wavy input range. It was coded by Temani Afif using a single HTML element, the new attr(), and CSS trigonometric functions. claw machine Masahito Leo Takeuchi developed a cute pixel art/kawaii claw machine using HTML, CSS, and vanilla JavaScript. It takes a couple of tries to get used to the controls, but it's a fun and entertaining game to play. Also, the toys and their position changes every time the game is loaded. Radio Are So Moody Diana Moretti crafted a fun demo to answer the question in everyone's mind: What if radio buttons reacted based on their mood? Select the different options and see the radios jitter, jump, float, or vanish... Some great work. CSS mix-blend-mode Study I like demos that showcase specific features or properties, what values they support, and how they would look on the screen. [Marie Mosley built exactly that to highlight the mix-blend-mode property. Will you be my valentine? You don't want to be my Valentine? That's fine, just click on the correct button and it's done. No? Another simple yet fun demo created with HTML and vanilla JavaScript by NANOUU. sunshine pure css A cute sun coded in HTML and CSS by Ekaterina. I like the small details like having rounded edges in lines (which can be a real pain in the neck when doing CSS), and how the gradients bring the sun together. Gradient Sliders More sliders! The design of these ones —created by Chris Gannon— is beautiful and so clean (it lacks keyboard interaction, but it could be added). It uses GSAP and SVG to build a smoother experience. Baby Groot This demo reminded me of the old Flash games/apps that allowed to interact with different characters. It's a similar idea, with a Baby Groot that will change from pirate, to rock start, or from summer to winter. It has over 200 possibilities, try them and enjoy! Amazing job by Grant Jenkins. Infinite Maze Solver This demo by ComputerK will generate a random maze, define the start and end points, and then proceed to solve it. The process is visualized, with trial and error, until a path is found. Really neat demo. If you liked these demos, check out the previous edition of this series: https://dev.to/alvaromontoro/10-cool-codepen-demos-january-2025-2lkn Top comments (0) Subscribe Personal Trusted User Create template Templates let you quickly answer FAQs or store snippets for re-use. Submit Preview Dismiss Code of Conduct • Report abuse Are you sure you want to hide this comment? It will become hidden in your post, but will still be visible via the comment's permalink. Hide child comments as well Confirm For further actions, you may consider blocking this person and/or reporting abuse"
