title = "Claude 3.7 Sonnet Thinking vs. Deepseek r1: Complete Analysis - DEV Community"
description = "So, Anthropic finally broke the silence and released Claude 3.7 Sonnet, a hybrid model that can think... Tagged with programming, javascript, ai, productivity."
full_description = 'Sunil Kumar Dash for Composio Posted on Mar 1 • Originally published at composio.dev Claude 3.7 Sonnet Thinking vs. Deepseek r1: Complete Analysis #programming #javascript #ai #productivity So, Anthropic finally broke the silence and released Claude 3.7 Sonnet, a hybrid model that can think step-by-step like a thinking model for complex reasoning tasks and answer instantly like a base model. From the ARC-AGI benchmarks, Claude’s 3.7 Sonnet with thinking has scored on par with the o3-mini-high for 16k context. And the r1 compares with the base Sonnet model. Anthropic sure has done a great job. For reference, the Deepseek r1 scored around 15%. But I have been using Deepseek r1 for a while, and it gets many things done that matter. So, I was curious how it would stack against the new Claude 3.7 Sonnet. I will compare both models across tasks like complex reasoning, Mathematics, Coding, and writing. So, let’s get started. Table of Contents Claude 3.7 Sonnet vs. Deepseek r1 Complex Reasoning Mathematics Coding Writing Final Verdict TL;DR • Both Claude and Deepseek r1 fall in the same ballpark for day-to-day reasoning and math tasks. • As Anthropic explicitly mentioned, they have trained the model for practical use cases; this is also reflected in the tests. • It performs much better than Deepseek r1 in the coding department. There is not much comparison. • Claude is good at technical writing, while Deepseek r1 is more human-like. Claude 3.7 Sonnet vs. Deepseek r1 It would be criminal not to consider the pricing before any comparison. This is important for many users, especially those building applications on top of them. DeepSeek R1 Pricing • Input Tokens (Cache Hit): $0.14 per million tokens • Input Tokens (Cache Miss): $0.55 per million tokens • Output Tokens: $2.19 per million tokens Claude 3.7 Sonnet Pricing • Input Tokens: $3.00 per million tokens • Output Tokens: $15.00 per million tokens From a cost perspective, Deepseek r1 is still the king. This makes it an absolute beast for the reasoning capabilities it offers. It’s also open-source, and you can host it on your hardware, which is also important for privacy-sensitive enterprises. But raw capability matters as well. So, let’s compare these two models. Complex reasoning 1. Riddle to judge cognitive bias This is a straightforward question, but most models I have tried fail to answer. Prompt: A woman and her son are in a car accident. The woman is sadly killed. The boy is rushed to the hospital. When the doctor sees the boy, he says, “I can’t operate on this child; he is my son! How is this possible? I have tweaked the question, and it falls apart. *Prompt: The surgeon, who is the boy’s father, says, “I can’t operate on this child; he is my son”, who is the surgeon of this child. Be straightforward”. * It was the same case with the Deepseek r1 as well. This has become my go-to question for vibe-check reasoning models. 2. Blood Relationship *Prompt: Jeff has two brothers, and each of his brothers has three sisters. Each of the sisters has four step-brothers and five step-sisters, for a total of eight siblings in this family. * Claude’s output was similar to Deepseek and even that of o3-mini. However, Deepseek r1, as usual, has gems hidden in the CoT. Though the output was wrong, it got it correct in its Chain of thought. 3. Playing Tic-tac-toe I asked Claude to make the next move that would ensure its victory. I expected it to answer correctly, but it failed. Deepseek r1 is not a multi-modal model. Mathematics 1. Find the GCD of this series set {n^99(n^60-1): n>1} It was a fairly difficult question, and Claude couldn’t solve it. However, Deepseek r1 was spot on. 2. Find (x-14)^10, where x is the number of vowels in the response Claude 3.7 Sonnet was able to answer it correctly. Deepseek r1 wasn’t able to get it right. Summary of Math Math ability is a mixed bag. You can never go wrong with either, but Deepseek’s cost-to-performance makes it unbeatable. But, well, Claude is clever, and Deepseek is nerdier. Coding Coding has always been Claude’s domain; they even specifically train the models on coding tokens to make them developer’s darling. This is Claude on SWE-Bench. But let’s compare both of them. 1. Creating SVGs This is an interesting test; I picked it from Simon Willison. *Prompt: Create an SVG of a unicorn running in the field. * And this was Claude’s response. Claude creating SVG From Deepseek r1. Deepseek drawing unicorn Claude’s creation is a bit better, with a better background and view. Deepseek is decent, but not really there. 4. Balls in a geometrical object Prompt: Write me a Python script for 10 balls inside a fast-spinning hexagon. Code of the simulation import pygame import math import sys # Initialize Pygame pygame.init() # Screen settings SCREEN_WIDTH = 800 SCREEN_HEIGHT = 600 screen = pygame.display.set_mode((SCREEN_WIDTH, SCREEN_HEIGHT)) pygame.display.set_caption("Spinning Hexagon with Balls") # Colors BACKGROUND_COLOR = (0, 0, 0) HEXAGON_COLOR = (255, 255, 255) BALL_COLOR = (255, 0, 0) # Center coordinates CENTER = (SCREEN_WIDTH // 2, SCREEN_HEIGHT // 2) # Hexagon parameters HEX_RADIUS = 200 # Distance from center to vertices ROTATION_SPEED = 0.15 # Radians per frame # Ball parameters NUM_BALLS = 10 BALL_RADIUS = 10 BALL_ORBIT_RADIUS = 150 # Distance from center for ball positions # Initialize rotation angle angle = 0 # Main loop clock = pygame.time.Clock() running = True while running: for event in pygame.event.get(): if event.type == pygame.QUIT: running = False # Clear screen screen.fill(BACKGROUND_COLOR) # Update rotation angle angle += ROTATION_SPEED # Draw hexagon hex_points = [] for i in range(6): theta = angle + i * math.pi / 3 # 60 degrees between vertices x = CENTER[0] + HEX_RADIUS * math.cos(theta) y = CENTER[1] + HEX_RADIUS * math.sin(theta) hex_points.append((x, y)) pygame.draw.polygon(screen, HEXAGON_COLOR, hex_points, 2) # Draw balls for i in range(NUM_BALLS): ball_angle = angle + (2 * math.pi * i) / NUM_BALLS x = CENTER[0] + BALL_ORBIT_RADIUS * math.cos(ball_angle) y = CENTER[1] + BALL_ORBIT_RADIUS * math.sin(ball_angle) pygame.draw.circle(screen, BALL_COLOR, (int(x), int(y)), BALL_RADIUS) # Update display pygame.display.flip() clock.tick(60) pygame.quit() sys.exit() Enter fullscreen mode Exit fullscreen mode Deepseek r1 output import pygame import math import sys # Initialize Pygame pygame.init() # Screen settings SCREEN_WIDTH = 800 SCREEN_HEIGHT = 600 screen = pygame.display.set_mode((SCREEN_WIDTH, SCREEN_HEIGHT)) pygame.display.set_caption("Spinning Hexagon with Balls") # Colors BACKGROUND_COLOR = (0, 0, 0) HEXAGON_COLOR = (255, 255, 255) BALL_COLOR = (255, 0, 0) # Center coordinates CENTER = (SCREEN_WIDTH // 2, SCREEN_HEIGHT // 2) # Hexagon parameters HEX_RADIUS = 200 # Distance from center to vertices ROTATION_SPEED = 0.15 # Radians per frame # Ball parameters NUM_BALLS = 10 BALL_RADIUS = 10 BALL_ORBIT_RADIUS = 150 # Distance from center for ball positions # Initialize rotation angle angle = 0 # Main loop clock = pygame.time.Clock() running = True while running: for event in pygame.event.get(): if event.type == pygame.QUIT: running = False # Clear screen screen.fill(BACKGROUND_COLOR) # Update rotation angle angle += ROTATION_SPEED # Draw hexagon hex_points = [] for i in range(6): theta = angle + i * math.pi / 3 # 60 degrees between vertices x = CENTER[0] + HEX_RADIUS * math.cos(theta) y = CENTER[1] + HEX_RADIUS * math.sin(theta) hex_points.append((x, y)) pygame.draw.polygon(screen, HEXAGON_COLOR, hex_points, 2) # Draw balls for i in range(NUM_BALLS): ball_angle = angle + (2 * math.pi * i) / NUM_BALLS x = CENTER[0] + BALL_ORBIT_RADIUS * math.cos(ball_angle) y = CENTER[1] + BALL_ORBIT_RADIUS * math.sin(ball_angle) pygame.draw.circle(screen, BALL_COLOR, (int(x), int(y)), BALL_RADIUS) # Update display pygame.display.flip() clock.tick(60) pygame.quit() sys.exit() Enter fullscreen mode Exit fullscreen mode Claude had better overall output. The spinning hexagon has better ball-moving physics. Deepseek got the “fast-moving” part right. Overall, Claude was better. 3. 3d animation using 3js Prompt: Can you make a 3d animation of a metropolitan city using 3js? The code: <!doctype html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Metropolitan City - Three.js</title> <style> body { margin: 0; overflow: hidden; background-color: #000; } canvas { display: block; } .info { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial, sans-serif; background-color: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; } </style> </head> <body> <div class="info"> Click and drag to orbit. Scroll to zoom. Use arrow keys to move camera. </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script> // Main scene variables let scene, camera, renderer; let cityGroup, vehiclesGroup; let clock = new THREE.Clock(); let cameraRotationSpeed = 0.003; let autoRotate = true; // Setup function init() { // Create scene scene = new THREE.Scene(); scene.background = new THREE.Color(0x050518); // Night sky color // Create camera camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 2000, ); camera.position.set(150, 150, 150); camera.lookAt(0, 0, 0); // Create renderer renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement); // Create groups cityGroup = new THREE.Group(); vehiclesGroup = new THREE.Group(); scene.add(cityGroup); scene.add(vehiclesGroup); // Add lighting addLights(); // Create fog for depth scene.fog = new THREE.FogExp2(0x050518, 0.002); // Create city elements createGround(); createBuildings(); createStreets(); createVehicles(); createSkyline(); // Add event listeners setupControls(); // Start animation loop animate(); } // Lighting setup function addLights() { // Ambient light const ambientLight = new THREE.AmbientLight(0x404040, 0.5); scene.add(ambientLight); // Directional light (moonlight) const moonLight = new THREE.DirectionalLight(0x8888ff, 0.5); moonLight.position.set(100, 200, 100); moonLight.castShadow = true; moonLight.shadow.mapSize.width = 1024; moonLight.shadow.mapSize.height = 1024; moonLight.shadow.camera.near = 10; moonLight.shadow.camera.far = 500; moonLight.shadow.camera.left = -100; moonLight.shadow.camera.right = 100; moonLight.shadow.camera.top = 100; moonLight.shadow.camera.bottom = -100; scene.add(moonLight); // Add point lights of various colors to simulate city lights addCityLights(); } // Add city lights function addCityLights() { const colors = [ 0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffffff, ]; // Street lights for (let i = 0; i < 30; i++) { const x = (Math.random() - 0.5) * 200; const z = (Math.random() - 0.5) * 200; const streetLight = new THREE.PointLight(0xffffaa, 0.5, 30); streetLight.position.set(x, 3, z); scene.add(streetLight); } // Building lights for (let i = 0; i < 50; i++) { const x = (Math.random() - 0.5) * 200; const y = 5 + Math.random() * 40; const z = (Math.random() - 0.5) * 200; const color = colors[Math.floor(Math.random() * colors.length)]; const intensity = 0.2 + Math.random() * 0.5; const distance = 10 + Math.random() * 20; const buildingLight = new THREE.PointLight( color, intensity, distance, ); buildingLight.position.set(x, y, z); scene.add(buildingLight); } } // Create ground plane function createGround() { const groundGeometry = new THREE.PlaneGeometry(400, 400); const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8, metalness: 0.2, }); const ground = new THREE.Mesh(groundGeometry, groundMaterial); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; cityGroup.add(ground); } // Create buildings function createBuildings() { // Downtown area createDowntown(); // Surrounding buildings createSurroundingBuildings(); // Landmark building createLandmarkBuilding(); } // Create downtown area with skyscrapers function createDowntown() { // Create a grid of tall buildings for (let x = -80; x <= 80; x += 30) { for (let z = -80; z <= 80; z += 30) { // Skip some positions to create streets if (Math.abs(x) % 60 === 0 || Math.abs(z) % 60 === 0) continue; // Randomize building parameters const width = 10 + Math.random() * 15; const height = 20 + Math.random() * 80; const depth = 10 + Math.random() * 15; // Add some variation to positions const xPos = x + (Math.random() - 0.5) * 10; const zPos = z + (Math.random() - 0.5) * 10; createBuilding( xPos, height / 2, zPos, width, height, depth, ); } } } // Create surrounding lower buildings function createSurroundingBuildings() { // Create outer areas with smaller buildings for (let i = 0; i < 80; i++) { const angle = Math.random() * Math.PI * 2; const radius = 100 + Math.random() * 80; const x = Math.cos(angle) * radius; const z = Math.sin(angle) * radius; const width = 5 + Math.random() * 15; const height = 5 + Math.random() * 25; const depth = 5 + Math.random() * 15; createBuilding(x, height / 2, z, width, height, depth); } } // Create a landmark tall building at the center function createLandmarkBuilding() { // Base createBuilding(0, 50, 0, 25, 100, 25, 0x888899); // Top section createBuilding(0, 105, 0, 15, 30, 15, 0x8888aa); // Spire const spireGeometry = new THREE.ConeGeometry(3, 20, 8); const spireMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaacc, metalness: 0.8, roughness: 0.2, }); const spire = new THREE.Mesh(spireGeometry, spireMaterial); spire.position.set(0, 130, 0); spire.castShadow = true; cityGroup.add(spire); // Beacon light const beaconLight = new THREE.PointLight(0xff0000, 1, 50); beaconLight.position.set(0, 140, 0); scene.add(beaconLight); } // Helper function to create a building function createBuilding(x, y, z, width, height, depth, color) { // Create building geometry const buildingGeometry = new THREE.BoxGeometry( width, height, depth, ); // Create building material with random color if not provided const buildingColor = color || new THREE.Color( 0.3 + Math.random() * 0.1, 0.3 + Math.random() * 0.1, 0.4 + Math.random() * 0.2, ); const buildingMaterial = new THREE.MeshStandardMaterial({ color: buildingColor, roughness: 0.7, metalness: 0.2, }); // Create building mesh const building = new THREE.Mesh( buildingGeometry, buildingMaterial, ); building.position.set(x, y, z); building.castShadow = true; building.receiveShadow = true; cityGroup.add(building); // Add window lights randomly to some buildings if (Math.random() > 0.5 && height > 10) { addBuildingWindows(x, y, z, width, height, depth); } return building; } // Add window lights to buildings function addBuildingWindows(x, y, z, width, height, depth) { const windowGeometry = new THREE.PlaneGeometry(1, 1); const windowMaterial = new THREE.MeshBasicMa'
