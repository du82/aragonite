title = "Jakarta EE and MicroProfile on Azure – February 2025 - Microsoft for Java Developers"
description = "Hi everyone, welcome to the February 2025 update for Jakarta EE and MicroProfile on Azure. It covers topics such as the latest updates to Azure extensions for Quarkus, and the recent refresh to Jakarta EE Solutions for supporting multiple deployments within the same resource group. If you’re interested in providing feedback or collaborating on migrating […]"
full_description = "Hi everyone, welcome to the February 2025 update for Jakarta EE and MicroProfile on Azure. It covers topics such as the latest updates to Azure extensions for Quarkus, and the recent refresh to Jakarta EE Solutions for supporting multiple deployments within the same resource group. If you’re interested in providing feedback or collaborating on migrating Java workloads to Azure with the engineering team developing Jakarta EE and MicroProfile on Azure solutions, please complete this short survey on Jakarta EE migration. The team of product managers, architects, and engineers will promptly get in touch with you to initiate close collaboration. Microsoft partner with Oracle, IBM, and Red Hat to build a portfolio based on two pillars: the Azure Marketplace offers include Solution Templates and Base Images which allow customers to quickly deploy software on Azure Virtual Machines (VMs), Azure Kubernetes Service (AKS), Azure Red Hat OpenShift (ARO), and Azure Container Apps (ACA) within Azure Portal; additionally, within Azure Learn, you’ll find an extensive collection of Java EE, Jakarta EE and MicroProfile guidance. Beyond these, there are numerous supporting technologies for open specifications-based Cloud Native Java, such as Quarkus extension, the Azure MicroProfile library, and integration with other Azure development services. To refresh your experience using Java EE, Jakarta EE, and MicroProfile on Azure, here is the news you should know! Explore the newest Azure service extension for Quarkus and secure your Quarkus applications with Microsoft Entra ID Azure Event Hubs Extension for Quarkus (pkg:maven/io.quarkiverse.azureservices/quarkus-azure-eventhubs@1.1.1) is newly published. Azure Event Hubs is a big data streaming platform and event ingestion service. It can receive and process millions of events per second. This extension allows you to produce and consume events from Azure Event Hubs in your Quarkus application. Check out the step-by-step guide on how to use the extension with your Quarkus application. If you’re looking for a complete code sample, check out Azure Event Hubs sample. Give it a try! It is noteworthy that, in addition to the newly launched extension, the previously published Azure Services Extensions are being refreshed to add support for Microsoft Entra ID as well. These efforts are part of our commitment to aligning our offerings with the principles of Microsoft Secure Future Initiative (SFI). For more on how Jakarta EE and MicroProfile on Azure keeps you safe, see Open Standard Enterprise Java and our Secure Future Initiative. Azure Blob Storage Extension for Quarkus (pkg:maven/io.quarkiverse.azureservices/quarkus-azure-storage-blob@1.1.1) and Azure App Configuration Extension for Quarkus (pkg:maven/io.quarkiverse.azureservices/quarkus-azure-app-configuration@1.1.1) are refreshed to add support for Microsoft Entra ID. Azure Blob Storage is a massively scalable and secure object storage for cloud-native workloads, archives, data lakes, high-performance computing, and machine learning. Azure App Configuration is a fast, scalable parameter storage for app configuration. If you want to know more about setting up an OpenID Connect provider to protecting and testing your Quarkus app secured with Microsoft Entra ID, read the guide Quarkus with Microsoft Entra ID. It is perfect for Java developers looking to enhance security and streamline authentication and authorization processes. Explore more Azure Services Extensions for Quarkus. Deploy multiple Jakarta EE on Azure offers to the same resource group Our Jakarta EE offers allow customers to quickly deploy their software on Azure Virtual Machines (VMs), Azure Kubernetes Service (AKS), Azure Red Hat OpenShift (ARO), and Azure Container Apps (ACA) within Azure Portal. The deployment of Application Solutions used to require an empty resource group. However, creating a new resource group typically requires multiple reviews and approvals in an organization. Thanks to your valuable feedback, the offers now support multiple deployments to the same resource group. Try our Jakarta EE on Azure offers now! You’re encouraged to connect with the development team and provide feedback on improving Jakarta EE and MicroProfile on Azure solutions. Overview of Jakarta EE and MicroProfile on Azure offers Microsoft partners with IBM, Oracle, and Red Hat to bring top Java app server products to Azure: To explore IBM WebSphere Product Family on Azure, start from the Learn topic – What are solutions to run the WebSphere family of products on Azure? To explore Oracle WebLogic Server on Azure Solutions, start from the following Learn topics What are solutions for running Oracle WebLogic Server on Azure Virtual Machines? What are solutions for running Oracle WebLogic Server on the Azure Kubernetes Service? To explore JBoss EAP on Azure, start from the Learn topic – Red Hat JBoss EAP on Azure Additionally, we offer several complementary technologies for Cloud Native Java, such as Quarkus extensions, the Azure MicroProfile library, and integrations with various Azure developer services. Quarkus Azure Services Extensions are: Quarkus Azure Event Hubs Extension: pkg:maven/io.quarkiverse.azureservices/quarkus-azure-eventhubs@1.1.1 | code | doc | sample Quarkus Azure App Configuration Extension: pkg:maven/io.quarkiverse.azureservices/quarkus-azure-app-configuration@1.1.1 | code | doc | sample Quarkus Azure Blob Storage Extension: pkg:maven/io.quarkiverse.azureservices/quarkus-azure-storage-blob@1.1.1 | code | doc | sample Quarkus Azure key Vault Extension pkg:maven/io.quarkiverse.azureservices/quarkus-azure-keyvault@1.1.1 | code | doc | sample Quarkus Azure Cosmos pkg:maven/io.quarkiverse.azureservices/quarkus-azure-cosmos@1.1.1 | code | doc | sample Azure Extensions for MicroProfile are: Maven Central: com.azure.microprofile | code | doc Related posts Jakarta EE on Azure – November 2024 – Microsoft for Java Developers Jakarta EE on Azure – September 2024 – Microsoft for Java Developers Jakarta EE on Azure – June 2024 – Microsoft for Java Developers Jakarta EE on Azure – February 2024 – Microsoft for Java Developers"
author = "Josephine Qiu"
year_published = 2025
