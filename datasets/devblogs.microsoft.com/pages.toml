 an issue with YAML pipelines failing after Patch 3 installation. We will continue to provide updates in this blog. This issue was reported in the Developer Community. Today we are releasing patches that impact our self-hosted product, Azure DevOps Server. We strongl... Feb 4, 2025 2 3 Full web support for conditional access policies across Azure DevOps and partner web properties Angel Wong We’re happy to announce that we’ve made significant progress in updating our web authentication stack on Azure DevOps services and partner web properties to utilize Microsoft Entra tokens to handle web sessions. By replacing our previous cookies with Entra tokens, we’ve deepened the integration we have with Microsoft Entra ID on our web experience. This change allows us to continuously evaluate identity compliance with Entra policies on an hourly basis (the duration of an Entra token). Previously, we could only regularly evaluate IP-fencing policies (at a much less frequent cadence than every hour) with our old... Feb 3, 2025 0 1 Update to Azure DevOps Allowed IP addresses Soo Stahl We are excited to announce some important upgrades to our networking infrastructure that will enhance the performance and reliability of our service. As part of these infrastructure upgrades, we are introducing new IP addresses that you will need to allow list in your firewall configurations. What’s Changing And Why? We are transitioning from the current set of network edge devices supporting Azure DevOps to new, better-performing network edge devices by May 2025. As part of this transition, we have added new IP addresses to the current published allow list - Allowed address lists and network connections - Azur... Jan 28, 2025 2 0 Upcoming support lifecycle milestones for older on-premises products Gloridel Morales Multiple versions of our on-premises product will reach the end of support on October 14, 2025. Customers are encouraged to start planning and deploying upgrades now to ensure that installed products remain supported and secure, and to take advantage of new capabilities offered in successor products. The latest version of our on-premises product is Azure DevOps Server 2022.2. October 14, 2025, is the date for the end of Extended Support for Team Foundation Server 2015 - meaning it will no longer receive security updates or technical support. Upon end of support, there will be no new updates, free or paid assiste... Jan 28, 2025 0 0 Changes to provisioning Azure DevOps projects using the Azure DevOps Demo Generator Gloridel Morales The Azure DevOps Demo Generator is a tool that allows you to create projects in your Azure DevOps organization, complete with pre-filled sample content. This includes source code, work items, iterations, service connections, and build and release pipelines, all based on a template you select. Starting February 28, 2025, we are eliminating the need for us to authenticate on your behalf. This update will give you greater control over creating new projects and ensure a more secure process. Instead of the previous authentication process, you will run the ADOGenerator project as a console application or executable (.... Jan 6, 2025 7 4 Reducing personal access token (PAT) usage across Azure DevOps Angel Wong In the new year, we’ll be making moves towards strengthening Microsoft and our customers' security posture in regards to the usage and creation of personal access tokens (PATs). If you’ve been following this blog, you may have noticed we’ve been distancing away from PATs as the recommended authentication method for Azure DevOps APIs by offering restrictive policies and more secure alternatives. PATs can be an enticing vector for unauthorized access, especially when insecurely stored, over-scoped, or set for long durations. There exist scenarios where PATs remain the primary form of authentication within Azure D... Jan 5, 2025 11 4 Important: Switching CDN providers Clayton Kanyika The current content delivery network (CDN) provider Edgio, used by Azure DevOps is retiring. We're urgently transitioning to a solution served by Akamai and Azure Front Door CDNs to maintain the responsiveness of our services. What this means for you For most of you, this transition will be seamless. To ensure that you can continue to access Azure DevOps without any interruptions, use the following Powershell commands to validate that your current firewall settings allow connectivity to the new CDN providers: If your network includes firewalls that could affect access to the new CDNs, we recommend adding ... Dec 11, 2024 6 0 New Boards Hub Rollout Expectations Dan Hellem Although the process may seem slow, we are steadily progressing toward rolling out the New Boards Hub to all customers. Our plan is to deprecate the old Boards experience for all Azure DevOps service users by the end Q1 2025. The rollout is advancing on two fronts. First, we are setting the New Boards Hub as the default experience. Second, for customers who already have the New Boards Hub enabled as the default, we are transitioning groups to exclusively use the New Boards Hub. Removing the option to revert to the old Boards experience. Currently, 60% of customers have the New Boards Hub set as their default ex... Dec 3, 2024 4 2 Microsoft DevLabs Extensions Dan Hellem The Microsoft DevLabs publisher was created as a hub for internal teams at Microsoft to channel their passion for Azure DevOps into experimental extensions. These extensions helped address product gaps and fostered innovation, ultimately benefiting Azure DevOps customers via the public marketplace. The challenge Over time, as the original creators of these extensions moved on to other things, many extensions became outdated. This led to several problems: To restore the value of the Microsoft DevLabs publisher, we conducted a review to identify which extensions should be actively maintained and which ne... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton 