or smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 13, 2025 0 1 Database and AI: solutions for keeping embeddings updated Davide Mauri In the previous article of this series, it was discussed how embeddings can be quickly created from data already in Azure SQL. This is a useful starting point, but since data in a database changes frequently, a common question arises: “How can the vectors be kept updated whenever there is a change to the content from which they have been generated?” This article aims to address that question. Solutions to keep embeddings updated Several methods can be employed to ensure that embeddings are updated to reflect any modifications made to the content from which they are generated: This i... Feb 12, 2025 0 0 External REST Endpoint Invocation in Azure SQL Managed Instance is now in Public Preview Brian Spendolini External REST Endpoint Invocation is available in Azure SQL Managed Instance with the Always-up-to-date update policy configured. Call Azure Services such as functions, Azure OpenAI, event hubs, content safety and more! To enable this feature in Azure SQL Managed Instance, run the following code: To execute sp_configure to change a configuration option or to run the RECONFIGURE statement, a user must be granted the ALTER SETTINGS server-level permission. The ALTER SETTINGS permission is implicitly held by the sysadmin and serveradmin fixed server roles. Examples and sample code can be found here and a wo... Feb 10, 2025 1 1 .NET Aspire and Data API builder with the Community Toolkit Jerry Nixon Announcing .NET Aspire Integration with Data API builder (DAB) As engineers add components to their solution architecture, their development environments can become complex and difficult to replicate across teams and environments. Placing each service in a dedicated container simplifies the setup—but only if you're familiar with Docker. Enter .NET Aspire, a simple orchestration tool that replaces Docker’s complexity with the familiarity of C#. It’s supported in Visual Studio, Visual Studio Code, and Rider, offering built-in framework features, including SQL Server and Azure SQL Database support.... Feb 6, 2025 20 3 Azure Data Studio Retirement Carlos Robles We’re announcing the upcoming retirement of Azure Data Studio (ADS) on February 6, 2025, as we focus on delivering a modern, streamlined SQL development experience. ADS will remain supported until February 28, 2026, giving developers ample time to transition. This decision aligns with our commitment to simplifying SQL development by consolidating efforts on Visual Studio Code (VS Code) with the MSSQL extension, a powerful and versatile tool designed for modern developers. Why Retire Azure Data Studio? Azure Data Studio has been an essential tool for SQL developers, but evolving developer needs and the rise o... Feb 4, 2025 7 3 Storing, querying and keeping embeddings updated: options and best practices Davide Mauri Embeddings and vectors are becoming common terms not only for engineers involved in AI-related activities but also for those using databases. Some common points of discussion that frequently arise among users familiar with vectors and embeddings include: Let’s tackle each one of these questions one by one starting from the very first. In the next blog posts I’ll discuss about the other questions. Quickly vectorize existing data This is a straightforward question. While the answer is often "it depends," in this case, there is a clear and direct solution: to efficiently vectorize data, batchi... Feb 3, 2025 1 1 Stored Procedure Caching in Data API builder Now Supported Jerry Nixon Announcing Procedure Cache Data API builder (DAB) has long supported Level 1 cache for tables and views. Level 1 is an in-memory cache that automatically stores frequent queries or slow-changing data in the API layer, bypassing several database queries. Today, Data API builder (DAB) also supports Level 1 cache for stored procedures. This is important. Minimizing long-running procedure calls can dramatically increase the number of concurrent calls your Data API can support. How does it get configured? The Data API builder (DAB) settings file configures cache at both the global level (under the runtime ... Jan 30, 2025 1 4 Hot Reload in Data API builder Now Available Jerry Nixon Announcing Hot Reload In a recent release, Data API builder (DAB) announced support for Hot Reload. This allows developers to modify the configuration file, save it and see the impact of those changes without restarting the engine. This tightens the loop, allowing developers to tune their implementation without waiting for needless tear down/set up operations. How is this useful? Getting your REST API just right is tricky. As you manipulate REST paths and settings, hit refresh in Swagger to see your changes and keep testing. Hot reload makes REST configuration faster and easier. Getting your GraphQL s... Jan 27, 2025 0 1 Introducing Change Event Streaming: Join the Azure SQL Database Private Preview for Change Data Streaming Sasa Popovic In a world where digital transformation is accelerating, the ability to integrate and process real-time data from diverse sources is crucial for success. Organizations today depend on timely insights to enhance decision-making, improve operations, and foster innovation. To meet this need, we’re thrilled to announce the private preview of Change Event Streaming (CES), a new functionality that lets you stream data changes directly from your Azure SQL Database into Azure Event Hubs. Starting now, you can apply to join this preview program. Participants will have the chance to test CES on Azure SQL Database and Az... Jan 23, 2025 0 1 Improve the “R” in RAG and embrace Agentic RAG in Azure SQL Davide Mauri The RAG (Retrieval Augmented Generation) pattern, which is commonly discussed today, is based on the foundational idea that the retrieval part is done using vector search. This ensures that all the most relevant information available to answer the given question is returned and then fed to an LLM to generate the final answer. While vector search is great for its specific use case - semantic search, which is approximate by nature - it fails when it comes to searching for precise questions, like "show me the latest 10 code samples" as that request can - and should - be answered precisely without the need for vec... Load more posts .toggleWrapper:last-child { border: no