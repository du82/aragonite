, and share a few tips we found f... Apr 22, 2024 0 11 How we built “Ask Learn”, the RAG-based knowledge service Sarah,Bob My name is Bob Tabor and I’m a member of Microsoft’s Skilling organization. We create documentation and training content about Azure, developer tooling and languages, AI, Windows and much more hosted at Microsoft Learn. Our organization also develops and maintains the content publishing platform, the content hosting platform, the interactivity, and popular sites like Microsoft Q&A. One of the most ambitious and impactful projects our engineers have built recently is Ask Learn, an API that provides generative AI capabilities to Microsoft Q&A and the ground truth necessary to power the new Microsoft Copilo... Mar 4, 2024 0 5 Enhancing reliability in Microsoft Fabric and Azure Synapse through load testing Predrag Vlatković Microsoft has employed Azure Load Testing to enhance the reliability of Microsoft Fabric and Azure Synapse, ensuring they can handle high loads. Azure Synapse integrates various data analytics technologies, while Microsoft Fabric offers a full enterprise analytics solution. Through rigorous daily and weekly load testing, involving complex scenarios and extensive data sizes, Microsoft aims to identify and rectify potential issues, ensuring optimal performance. This testing, integrated within their development pipelines, supports continuous improvement, leverages Azure's scalability, and utilizes Power BI for detai... Dec 3, 2023 0 6 Accessibility Insights now supports WCAG 2.2 AA Nandita,Jacqueline,Mark To celebrate the International Day for Persons with Disabilities on December 3rd we have some exciting new announcements for Accessibility Insights, Microsoft’s open-source suite of tools to help developers deliver accessible software! Technology plays a huge role in empowering everyone, including people with disabilities around the globe. Developers can now build with more accessibility in mind using Accessibility Insights for Web: This updated version includes testing support and guidance for WCAG 2.2 within the Assessment feature. We are constantly striving to improve user experience and added features that ma... Nov 15, 2023 3 16 Building Paved Paths: The Journey to Platform Engineering Amanda Silver Over the past year, AI has taken the world by storm. Our industry is innovating at an unprecedented rate, bringing incredible products to market that make life and work easier and more efficient for real people across a wide range of sectors and job functions. Like previous industry shifts—the introduction of the PC, internet, and search—it’s a pretty safe bet that we’ll look back at this moment and see the world before AI, and a world powered by AI. It’s an all-up mindset shift that fundamentally changes how we interact with technology. In the developer space, GitHub Copilot has become the most widely-adopted AI... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Engineering@Microsoft Related LinksThe DevOps Journey at Microsoft 1ES DevOps Story Five Steps to Culture Change DevOps Resource Center Open Source at Microsoft Top BloggersPredrag VlatkovićSarah LuckErik MavrinacPrincipal Software EngineerNandita GuptaProduct ManagerSuraj GupthaPrincipal Manager, Product Management Archive December 2024 September 2024 July 2024 May 2024 April 2024 March 2024 December 2023 November 2023 October 2023 August 2023 July 2023 May 2023 March 2023 December 2022 July 2022 March 2022 February 2022 December 2021 October 2021 September 2021 August 2021 July 2021 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-o