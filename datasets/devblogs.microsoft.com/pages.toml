{ // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 27, 2025 0 0 Jakarta EE and MicroProfile on Azure – February 2025 Josephine Qiu Hi everyone, welcome to the February 2025 update for Jakarta EE and MicroProfile on Azure. It covers topics such as the latest updates to Azure extensions for Quarkus, and the recent refresh to Jakarta EE Solutions for supporting multiple deployments within the same resource group. If you're interested in providing feedback or collaborating on migrating Java workloads to Azure with the engineering team developing Jakarta EE and MicroProfile on Azure solutions, please complete this short survey on Jakarta EE migration. The team of product managers, architects, and engineers will promptly get in touch with you to ... Feb 12, 2025 4 4 GitHub Copilot for Eclipse: Code Completion Now in Public Preview Hang Wang We are excited to announce the Public Preview of GitHub Copilot for Eclipse. As part of the broader GitHub Copilot family, which enhances productivity in various IDEs, this latest integration ensures that developers using Eclipse can benefit from AI-assisted coding like never before. GitHub Copilot is an AI-powered code assistant designed to streamline software development by offering intelligent code completions, inline suggestions, and context-aware recommendations. While it has been widely adopted in Visual Studio Code, Visual Studio, Xcode, JetBrains IDEs, Neovim, and Azure Data Studio, its integration into... Jan 30, 2025 1 2 DeepSeek-R1 on Azure with LangChain4j Demo Rory Preddy DeepSeek-R1 has been announced on GitHub Models as well as on Azure AI Foundry, and the goal of this blog post is to demonstrate how to use it with LangChain4j and Java. We concentrate here on GitHub Models as they are easier to use (you just need a GitHub token, no Azure subscription required), then Azure AI Foundry uses the same model and infrastructure. Demo project The demo project is fully Open Source and available on GitHub at https://github.com/Azure-Samples/DeepSeek-on-Azure-with-LangChain4j. It contains the following examples: Please note that despite being called a Chat Model, D... Jan 16, 2025 0 0 Java OpenJDK January 2025 Patch & Security Update Derek,Brian Hello Java customers! We are happy to announce the latest January 2025 patch & security update release for the Microsoft Build of OpenJDK. Download and install the binaries today. Check our release notes page for details on fixes and enhancements. The source code of our builds is available now on GitHub for further inspection: jdk21u, jdk17u, jdk11u. Microsoft Build of OpenJDK specific updates OpenJDK21 OpenJDK17 OpenJDK11 Summary of Upstream Updates OpenJDK 21 OpenJDK 17 OpenJDK 11 OpenJDK 8 ... Jan 9, 2025 0 0 MWA pattern: Strangler Fig Rory Preddy Author’s Note: After announcing the Modern Web App (MWA) pattern (https://devblogs.microsoft.com/java/introducing-the-modern-web-app-mwa-pattern-for-java), we now focus on one of its many pattens - the Strangler Fig pattern. This pattern incrementally modernizes a legacy Java application by “strangling” targeted areas and replacing them with new microservices or minimal web apps. We’ll explore an example showing how to integrate this approach and smoothly transition from a monolith to modern microservices. MWA pattern: Strangler Fig Introduction In today's fast-paced technological landscape, modern... Jan 8, 2025 0 1 Free Plan Support for GitHub Copilot Available on JetBrains IDEs Jialuo Gan Hello, developers! Welcome to our very first blog post dedicated to GitHub Copilot Plugin for JetBrains IDEs in 2025. We are excited to share that the new Free Plan for GitHub Copilot has been available for everyone on JetBrains IDEs! Whether you use IntelliJ IDEA (Ultimate, Community, Educational), PyCharm(Professional, Community, Educational), WebStorm, PhpStorm, Rider, or any other compatible JetBrains IDEs, you can now take advantage of this free plan to assist you in your development. With this Free Plan, you can enable GitHub Copilot using just your GitHub account—no trials, subscriptions, or credit cards ... Dec 12, 2024 1 1 Announcing Javac support in Visual Studio Code Java Nick Zhu Hi everyone, we are pleased to announce partial support of Javac as the underlying compiler in Visual Studio Code Java, JDT, and JDT-LS. The effort to provide this support has been a joint collaboration with Red Hat and Microsoft and is nearly a year in the making. This change aims to ensure timely support for the latest Java features and align Java language support on VS Code more closely with common build tools (such as Maven, Gradle). Many of our users have shared the desire for a more seamless, out-of-the-box development experience, and we believe introducing Javac is a strong first step toward making that... Dec 6, 2024 0 0 Deletion of Outdated Azul Zulu for Azure Container Images for Better Security Bruno Borges We at Microsoft are committed to providing customers with a secure ecosystem of tools for building and deploying applications. As part of this commitment, we continuously update our Java container image offerings to ensure they meet the highest security standards. Back in January 2022, we announced the End of Updates for the Azul Zulu for Azure build of OpenJDK. As part of that announcement, we shared that Microsoft and Azul Systems were no longer going to provide further updates, security patches, and support for this specific Azul Zulu for Azure build of OpenJDK. Since then, we have updated Azure Platform serv... Nov 27, 2024 0 0 Jakarta EE on Azure – November 2024 Josephine Qiu Hi everyone, welcome to the November 2024 update for Jakarta EE on Azure. It covers topics as new AZD template of Quarkus Apps on Azure Container Apps, Cargo Tracker Deployment with AI integration, AI infused apps with Open Liberty on AKS, Java apps authentication with Microsoft Entra ID, and new features for JBoss EAP on Azure and WebLogic Server on Azure. If you're interested in providing feedback or collaborating on migrating Java workloads to Azure with the engineering team developing Jakarta EE on Azure solutions, please complete this short survey on Jakarta EE migration. The team of product managers, arc... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics JavaOpen SourceVisual Studio CodeCloudDesktopOpenJDKWebIntelligent Ap