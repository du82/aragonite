full_description = '''Jun 29, 2007 0 0 Silverlight "How-to" videos Web Development Tools Microsoft We recently released a set of Silverlight "How-to" videos online. This includes Scott Guthrie's keynote demo at Mix07 which shows off how to create a Silverlight 1.1 application using the Visual Studio add-in for Silverlight. This is also a good time to let you all know that we have had ASP.Net videos and ASP.Net AJAX videos available for a while... ASP.NET Jun 22, 2007 0 0 Multi-targeting support in Visual Studio Orcas Web Development Tools Microsoft The web development tools team has been working on an article about a new Orcas feature we call "multi-targeting". However Scott Guthrie beat us to it and has written up an excellent and detailed article yesterday about this feature so we will just post a link to his article instead. Thanks to this feature, you can get all of the great improveme... ASP.NET Jun 20, 2007 0 0 Solution / Hotfix: Developing web applications using Visual Studio 2005 and IIS7 Web Development Tools Microsoft Bradley Millington on our team posted a while back on required configuration steps for developing web applications using Visual Studio 2005 & IIS7 on Vista. This is an update to that post with information to address issues that you may still encounter resulting in the following errors when doing F5 debugging with web applications on IIS7: ... ASP.NET Jun 14, 2007 0 0 Style Application Tool Bar Web Development Tools Microsoft After Orcas Beta1 released, some web developers mentioned that there is no documentation available for the new CSS editing features. Since I played around with this feature a lot recently, I would like to give it a try and explain it a little. The first tool I’d like to mention is the style application tool bar. This tool bar enables desig... ASP.NET Jun 8, 2007 0 0 Manage Styles Tool window Web Development Tools Microsoft This tool window provides a tree hierarchy view of all CSS selectors available from the current page