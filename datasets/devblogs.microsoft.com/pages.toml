We’re excited to announce the public preview of the Azure Cosmos DB SDK for Rust, a native Rust SDK that enables developers to interact with Azure Cosmos DB for NoSQL accounts from their Rust applications. Following the release of Azure SDK for Rust Beta, the Azure Cosmos DB Rust SDK provides an idiomatic API for performing operations on databases, containers, and items. With this release, Rust developers can now build high-performance, scalable applications using Azure Cosmos DB. Rust is an excellent choice for modern application development due to its focus on performance, memory safety, and concurrency. ... Feb 25, 2025 0 3 Migrating data from DynamoDB to Azure Cosmos DB Abhishek Gupta Co-authors: RK Iyer, Mangal Dutta Migrating stateful systems, such as databases, is a complex process. A frequent requirement for customers is to transfer data from DynamoDB to Azure Cosmos DB for NoSQL. This process involves several stages, including exporting data from DynamoDB, performing necessary transformations, and importing the data into Azure Cosmos DB. Common migration techniques: Offline and Online Migration strategies include offline and online approaches, which can be used independently or combined based on your needs. Online migration is ideal for applications requiring real-time data transfer ... Feb 24, 2025 0 0 New Azure Cosmos DB Design Patterns Video Series – Learn, Implement, and Contribute! Jay Gordon We’re excited to introduce the Azure Cosmos DB Design Patterns video series—your go-to resource for learning how to design scalable, efficient, and cost-effective applications with Azure Cosmos DB. Built on real-world use cases, each episode explores a proven design pattern, walking through how it works, when to use it, and how to implement it using sample code from the Azure Cosmos DB Design Patterns GitHub repository. Hosted by Mark Brown (Azure Cosmos DB Principal Program Manager) and Jasmine Greenaway (Microsoft Senior Cloud Advocate), this series provides actionable insights to help you optimize your data ... Feb 20, 2025 0 0 Moving to TLS 1.2 for Azure Cosmos DB: Ensuring Secure Connections Iria Osara Security and reliability are at the core of modern cloud applications. To strengthen data protection and align with industry best practices, we encourage all Azure Cosmos DB customers to transition to TLS 1.2. This post explains why this change is important, how to make the transition, and the benefits it brings to your applications. Why Move to TLS 1.2? Transport Layer Security (TLS) is a critical component in securing data transmitted over networks. TLS 1.2 offers enhanced security features compared to its predecessors, TLS 1.0 and 1.1. By moving to TLS 1.2 or later, you ensure that your data is protected wi... Feb 12, 2025 0 3 DocumentDB is Gaining Momentum in the Open-Source Database World Patty Chow In the short amount of time since we unveiled DocumentDB, our open-source document database platform powering the vCore based Azure Cosmos DB for MongoDB, and the feedback has been nothing short of phenomenal. In this short time, we've received a lot of attention from tech media and community members alike. Rapid Community Adoption Developers and database enthusiasts have embraced DocumentDB with overwhelming enthusiasm, rapidly driving traction among both users and contributors. In just under a week, our project earned 1000 GitHub stars, nearly 50 forks, and multiple pull requests and issues—clear evidence of ... Feb 11, 2025 3 0 A Powerful, Open-Source MongoDB GUI for Everyone Tomasz Naumowicz Introduction Azure Cosmos DB for MongoDB provides robust support through its Request Units (RU) model and vCore-based architecture, enabling flexible and scalable options for various workloads. We are now on a mission to deliver the ultimate developer experience. To achieve this, we have integrated Azure Cosmos DB for MongoDB support into the Azure Databases VS Code Extension. The free Azure Databases VS Code Extension, available on the VS Code Marketplace, provides a reliable and intuitive MongoDB GUI for developers, database administrators, and teams working with MongoDB - on Azure and beyond. MongoDB Supp... Feb 5, 2025 0 3 Use Azure Cosmos DB as a Docker container in CI/CD pipelines Abhishek Gupta There are lot of benefits to using Docker containers in CI/CD pipelines, especially for stateful systems like databases. For example, when you run integration tests, each CI job can start the database in an isolated container with a clean state, preventing conflicts between tests. This results in a testing environment that is reliable, consistent, and cost effective. This approach also reduces latency and improves the overall performance of the CI/CD pipeline because the database is locally accessible. The Linux-based Azure Cosmos DB emulator is available as a Docker container and can run on a variety of platf... Feb 3, 2025 0 0 Doctors generate faster, more accurate medical charts with Sayvant and Azure Cosmos DB Azure Cosmos DB Team This article is guest authored by Justin Mardjuki, CEO, Sayvant. Emergency rooms and urgent care facilities handle an estimated 350 million visits each year. Acute care environments are fast-paced, unpredictable, and high stakes. In these settings, providing care quickly is paramount. That’s why we created Sayvant, the leading clinical documentation AI solution for acute care. Sayvant helps clinicians generate accurate, defensible medical charts in seconds, enabling them to focus on delivering patient care instead of administrative tasks like documentation. Sayvant automates the creation of clinically accurate... Jan 24, 2025 0 0 Revolutionizing Large-Scale AI with Janusgraph and Azure Managed Instance for Apache Cassandra Dileep Rao JanusGraph is a high-performance graph database that offers flexibility in choosing storage backends. Apache Cassandra is a distributed NoSQL database known for its scalability and fault tolerance. Combining these two technologies can create a robust and efficient graph database solution. You can use the Azure Managed Instance for Apache Cassandra which is a fully-managed offering on Azure with boasts of features such as Turnkey Horizontal and Vertical Scaling, Support for Customer Managed Keys, LDAP support, auto patch of OS, automatic repairs, Azure Monitor, Lucene Index support and keeping in line with tod... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Azure Cosmos DB for NoSQLAnnouncementsAzure Cosmos DB for MongoDBTips and TricksNewsAzure Cosmos DB for Apache CassandraJava SDKAIQueryMigration Relevant LinksNoSQL SDKs .NET Java Node.js Python Database APIs NoSQL MongoDB vCore Resources Cosmos DB AI Samples Cosmos DB on GitHub Documentation Official Product Pages Azure Cosmos DB Pricing Top BloggersSajeetharan SinnathuraiPrincipal Program Manager Jay GordonSenior Program ManagerMeredith MooreSenior Product ManagerJames CodellaPrincipal Product Man"
