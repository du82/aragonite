argin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 12, 2025 0 3 DocumentDB is Gaining Momentum in the Open-Source Database World Patty Chow In the short amount of time since we unveiled DocumentDB, our open-source document database platform powering the vCore based Azure Cosmos DB for MongoDB, and the feedback has been nothing short of phenomenal. In this short time, we've received a lot of attention from tech media and community members alike. Rapid Community Adoption Developers and database enthusiasts have embraced DocumentDB with overwhelming enthusiasm, rapidly driving traction among both users and contributors. In just under a week, our project earned 1000 GitHub stars, nearly 50 forks, and multiple pull requests and issues—clear evidence of ... Feb 11, 2025 2 0 A Powerful, Open-Source MongoDB GUI for Everyone Tomasz Naumowicz Introduction Azure Cosmos DB for MongoDB provides robust support through its Request Units (RU) model and vCore-based architecture, enabling flexible and scalable options for various workloads. We are now on a mission to deliver the ultimate developer experience. To achieve this, we have integrated Azure Cosmos DB for MongoDB support into the Azure Databases VS Code Extension. The free Azure Databases VS Code Extension, available on the VS Code Marketplace, provides a reliable and intuitive MongoDB GUI for developers, database administrators, and teams working with MongoDB - on Azure and beyond. MongoDB Supp... Feb 5, 2025 0 3 Use Azure Cosmos DB as a Docker container in CI/CD pipelines Abhishek Gupta There are lot of benefits to using Docker containers in CI/CD pipelines, especially for stateful systems like databases. For example, when you run integration tests, each CI job can start the database in an isolated container with a clean state, preventing conflicts between tests. This results in a testing environment that is reliable, consistent, and cost effective. This approach also reduces latency and improves the overall performance of the CI/CD pipeline because the database is locally accessible. The Linux-based Azure Cosmos DB emulator is available as a Docker container and can run on a variety of platf... Feb 3, 2025 0 0 Doctors generate faster, more accurate medical charts with Sayvant and Azure Cosmos DB Azure Cosmos DB Team This article is guest authored by Justin Mardjuki, CEO, Sayvant. Emergency rooms and urgent care facilities handle an estimated 350 million visits each year. Acute care environments are fast-paced, unpredictable, and high stakes. In these settings, providing care quickly is paramount. That’s why we created Sayvant, the leading clinical documentation AI solution for acute care. Sayvant helps clinicians generate accurate, defensible medical charts in seconds, enabling them to focus on delivering patient care instead of administrative tasks like documentation. Sayvant automates the creation of clinically accurate... Jan 24, 2025 0 0 Revolutionizing Large-Scale AI with Janusgraph and Azure Managed Instance for Apache Cassandra Dileep Rao JanusGraph is a high-performance graph database that offers flexibility in choosing storage backends. Apache Cassandra is a distributed NoSQL database known for its scalability and fault tolerance. Combining these two technologies can create a robust and efficient graph database solution. You can use the Azure Managed Instance for Apache Cassandra which is a fully-managed offering on Azure with boasts of features such as Turnkey Horizontal and Vertical Scaling, Support for Customer Managed Keys, LDAP support, auto patch of OS, automatic repairs, Azure Monitor, Lucene Index support and keeping in line with tod... Jan 13, 2025 0 3 Cosmos DB Embeddings Generator Sample Mark Brown Ever since our first preview announcement for vector indexing and support for DiskANN and then again when we announced the GA for these features, customers have been asking us to make it easier to generate Azure OpenAI embeddings on their data in Azure Cosmos DB. So we did just that and created the Azure Cosmos DB Embeddings Generator sample application and hosted it on GitHub. This sample shows how to use an Azure Cosmos DB Trigger and Output Binding in Azure Functions to automatically generate Azure OpenAI embeddings on a new or updated item, then save it back to the same item in Cosmos DB. There is bo... Dec 12, 2024 1 2 An introduction to Multi-Agent AI apps with Azure Cosmos DB and Azure OpenAI Theo van Kraay Azure Cosmos DB was named by Bloomberg as the no. 1 Database of choice for Retrieval Augmented Generation (RAG) and Large Language Model (LLM) customization. It is used by OpenAI to scale it’s ChatGPT service, and by many thousands of customers worldwide, serving billions of end-users with globally distributed apps at planet scale. In this blog we will explore a simple example for lightweight multi-agent orchestration in Python using OpenAI Swarm. We’ll also see the benefits of being able to use Azure Cosmos DB as both a vector store and an operational database. What are multi-agent apps? Multi-agent AI apps... Dec 5, 2024 0 0 Announcing Azure Cosmos DB Integration with Spring AI and Langchain4J! Theo van Kraay We’re continuing to simplify AI app development by integrating Azure Cosmos DB’s cost-effective and scalable vector search directly with Spring AI and LangChain4J! These frameworks empower Java developers to efficiently manage fast and accurate data retrieval with Azure Cosmos DB’s scalability and efficient vector indexing and search capabilities, allowing for efficient handling of high-dimensional vectors. By using Azure Cosmos DB’s vector store, developers can keep vectors directly within their documents, enabling seamless integration with Spring AI or Langchain4J for advanced vector search queries. Spring AI ... Dec 3, 2024 0 1 Microsoft Fabric API for GraphQL™ for Azure Cosmos DB Mirroring Rodrigo Souza The Microsoft Fabric API for GraphQL™ provides a data access layer that enables you to query multiple data sources quickly and efficiently using a widely adopted and familiar API technology. This API abstracts the specifics of backend data sources, allowing you to focus on your application's logic and deliver all the data a client needs in a single call. Microsoft Fabric's Mirroring enables you to seamlessly integrate your existing Azure Cosmos DB data with the rest of your data in Microsoft Fabric, eliminating the need for ETL. You can replicate your Azure Cosmos DB data continuously into OneLake in ne... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Azure Cosmos DB for NoSQLAnnouncementsAzure Cosmos DB for MongoDBTips and TricksNewsAzure Cosmos DB for Apache CassandraJava SDKAIQueryAnalytics Relevant LinksNoSQL SDKs .NET Java Node.js Python Database APIs NoSQL MongoDB vCore Resources Cosmos DB AI Samples Cosmos DB on GitHub Documentation Official Product Pages Azure Cosmos DB Pricing Top BloggersSajeetharan SinnathuraiPrincipal Program Manager Jay GordonSenior Program ManagerMeredith MooreSenior Product ManagerJames CodellaPrincipal Product ManagerTheo van KraayPrincip"
