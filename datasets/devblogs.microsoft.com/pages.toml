full_description = '''Dec 20, 2006 0 0 Visual Studio 2005 SP1 released – details about changes for web tools Web Development Tools Microsoft As many of you may heard Visual Studio 2005 SP1 was officially released several days ago. There have already been a couple of blog posts announcing the release from ScottGu and Soma. One item of feedback I saw on those posts was a request for more information about the actual fixes in SP1.I'm writing this blog post to provide ... ASP.NET Dec 20, 2006 0 0 Difference Between Perf Data Reported by Different Tools – 3 maoni Both the !SOS.gchandles command (added in CLR 2.0) and the .NET CLR Memory\# GC Handles counter show you the number of GC handles you have in your process. The # GC Handles counter is one of the rare counters in the .NET CLR Memory category that doesn’t get updated at the end of each GC. Rather we update it in the handle table code, for example, w... .NET Dec 12, 2006 0 0 Difference Between Perf Data Reported by Different Tools – 2 maoni Managed Heap Size We have both .NET CLR Memory perf counters and SoS extensions that report manged heap size related data. Difference 2 There are a few .NET CLR Memory counters that are related to the managed heap size: # Total Committed Bytes # Total Reserved Bytes I explained what these counters mean here. Now, how are they r... .NET Dec 12, 2006 0 0 Difference Between Perf Data Reported by Different Tools – 1 maoni So, there are many perf tools and some of them report either the same or the same type of data. I want to talk about various differences between the ones related to managed heap investigation. This is not supposed to cover everything..just the ones I think people use frequently. Managed Heap Size We have both .NET CLR Memory perf counters and SoS e... .NET Dec 11, 2006 0 0 WPF/E ASP.NET Server Control Web Development Tools Microsoft The other day, I have posted on an entry on my blog showing how to embed videos on your websites using simple IFrame technique. The next thing I wanted to do is to build an ASP.NET Server Control to show how easy it is to integrate rich content into ASPX pages - but Mike Harsh beat me to it. See his post about the WPF/E ASP.NET Server Control ... ASP.NETWPF'''
