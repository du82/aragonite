保持一致，并利用 Gradle 工具中的优势。要使用此功能，只需在运行测试之前选择“Delegate Test to Gradle”作为默认测试配置文件。这里有一个如何使用它的演示。 在这次发布中，我们只支持“运行测试”，但我们也计划很快支持“调试测试”，所以请继续关注。下面是这个功能的演示。 要使用上述 Gradle 功能... Jul 25, 2024 0 0 Java on Azure Tooling的更新 – 2024年6月 Jialuo Gan 大家好，欢迎阅读 Java on Azure 开发者工具6月份更新。在本次更新中，我们将介绍在 IntelliJ IDEA 中 Azure Toolkit 对 Azure Container Apps 提供的工作负载配置文件支持。我们希望您喜欢这些更新，并享受使用 Azure 工具包的流畅体验。请下载并安装 IntelliJ 的 Azure 工具包。让我们开始吧！ Azure Toolkit for IntelliJ 提升 对 Azure Container Apps 支持工作负荷配置文件 在 5 月份的更新中，我们宣布针对 IntelliJ IDEA 的 Azure 工具包已为具有灵活部署选项的 Azure 容器应用程序提供了支持。 在最新版本中，我们通过工作负载配置文件环境支持进一步增强了这种体验。工作负载配置文件决定了部署在环境中的容器应用程序可用的计算和内存资源量。通过这一增强功能，您可以在 IntelliJ IDEA 中轻松调整工作负载配置文件的最小和最大实例数。此外，您还可以灵活配置每个应用程序，使其运行在容器应用程序环境中最合适的工作负载配置文件上。下面是一个简短的演示。 反馈与建议 如果您感兴趣，请不要犹豫并尝试使用我们的产品吧! 您的反馈和建议对我们非常重要，将有助于我们产品的未来发展。 资源 以下链接和资源能帮助您更好地了解 ... Jun 28, 2024 0 0 Java on Visual Studio Code的更新 – 2024年6月 Nick Zhu 大家好，欢迎阅读Visual Studio Code for Java的六月更新！在这篇博客中，我们将分享项目设置项目的重要更新以及一系列Spring的功能改进，让我们开始吧！ 项目设置页面功能增强 编译器配置 在项目设置页面添加了一个新的编译器配置标签页。这使您可以方便地设置项目的Java编译器相关选项。目前的选项包括源代码和目标兼容性、用于交叉编译的--release选项以及类文件生成的自定义。请参见下方截图中的编译器部分。 Maven相关选项 除了编译器部分，我们还添加了Maven标签页，使用户可以轻松指向的Maven配置文件。用户只需点击“Maven”并输入Maven配置文件的名称。 Formatter配置 最后，许多用户需要使用格式化器(Formatter)来格式化代码。我们在项目部分添加了使用格式化器的跳转方式。点击“Formatter”后，Visual Studio Code Java将引导用户进入格式化器视图。如果用户当前没有格式化器的文件，Visual Studio Code Java将引导用户直接创建一个格式化器。请参见下方的演示。 更方便地访问项目设置页面 自从我们引入更新后的项目设置页面以来，我们收到了用户的积极反馈。因此，我们使项目设置页面更加易于访问，现在您可以通过Java状态菜单直接从状态栏进入该页面。请参见下方截图。 要使用上述所有功能，用户... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Java in ChineseJavaOpen SourceVisual Studio CodeJava on Azure Tooling Top BloggersNick ZhuSenior Program ManagerJialuo GanProgram Manager Archive January 2025 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 April 2024 March 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 July 2023 June 2023 May 2023 April 2023 March 2023 Februa