tures As part of our continuing ramp-up on C++23 conformance, the team has implemented the following features. In future releases customers can expect to see continued acceleration towards C++23 conformance. Note: C++23 features can be used by either adding or to the command... Feb 11, 2025 3 1 What’s New for C++ Developers in Visual Studio 2022 17.13 Sy Brand We are happy to announce that Visual Studio 2022 version 17.13 is now generally available! This post summarizes the new features you can find in this release for C++. You can download Visual Studio 2022 from the Visual Studio downloads page or upgrade your existing installation by following the Update Visual Studio Learn page. Standard Library and Compiler On the compiler side, we’ve implemented C++23’s literal suffix. The suffix or (or any permutation of these) will help you avoid sneaky truncations or signed comparison mismatches, especially when writing loops. For example: Note that, while this feature... Jan 30, 2025 1 2 Document build instructions and more with enhanced C++ awareness from Copilot Chat in Visual Studio Sinem Akinci C++ development often involves nuances beyond the file you’re developing in. This can leave developers with many mental tabs open, balancing all the relevant context for their project to develop their C++ code properly. Copilot Chat in Visual Studio can already utilize context provided by specified files and invoked agents such as @workspace to generate suggestions. However, to improve the relevance of Copilot suggestions, we must provide tailored context to Copilot with considerations specific to the C++ language for developers to achieve better results. That way, developers can focus less on providing all th... Jan 23, 2025 0 0 What’s New in vcpkg (January 2025) Augustin Popa This blog post summarizes changes to the vcpkg package manager as part of the 2025.01.13 registry release, 2025-01-11 tool release, as well as changes to vcpkg documentation throughout January. This release includes minor improvements and bug fixes. Some stats for this period: vcpkg changelog (2025.01.13 release) The following notable changes were made in January: Documentation changes There are no changes to vcpkg documentation this month. If you have any suggestions for our documentation, please submit an issue in our GitHub repo or see the box at the bottom of ... Jan 6, 2025 0 0 What’s New in vcpkg (December 2024) Augustin Popa This blog post summarizes changes to the vcpkg package manager as part of the 2024.12.16 registry release, 2024-12-09 tool release, as well as changes to vcpkg documentation throughout December. This release includes a command line option to force vcpkg to use classic mode even if a manifest file is found along with bug fixes. Some stats for this period: vcpkg changelog (2024.12.16 release) The following notable changes were made in December: Documentation changes If you have any suggestions for our documentation, please submit an issue in our GitHub repo or ... Dec 6, 2024 0 6 MSVC Compiler Language Updates in Visual Studio 2022 version 17.12 Cameron DaCamara Introduction In alignment with the Visual Studio 2022 version 17.12 release, and based upon feedback received from the community, the MSVC compiler team would like to provide greater visibility into the C++ language-level fixes for customer-reported issues that made it into the release. This is similar to how the standard library team publishes regular changelogs (see VS 2022 17.12 for reference). The focus for Visual Studio 2022 version 17.12 is primarily to address bugs reported through Developer Community. C++23 Features: While our overall focus has been on fixing bugs reported via Developer Community, we i... Nov 23, 2024 0 1 What’s New in vcpkg (November 2024) Augustin Popa This blog post summarizes changes to the vcpkg package manager as part of the 2024.11.16 registry release, 2024-11-12 tool release, as well as changes to vcpkg documentation throughout November. This release includes a command line option to force vcpkg to use classic mode even if a manifest file is found along with bug fixes. Some stats for this period: vcpkg changelog (2024.11.16 release) The following changes were made in November: Documentation changes If you have any suggestions for our documentation, please submit an issue in our GitHub repo or ... Nov 12, 2024 0 2 Siemens Healthineers manages C++ libraries with vcpkg in an offline build environment Augustin Popa vcpkg is a free and open-source C/C++ package manager maintained by Microsoft and the C++ community that runs on Windows, macOS, and Linux. Over the years we have heard from companies using vcpkg to manage dependencies at enterprise-scale. For this blog post, I spoke to Shrey Chauhan, a Senior DevOps Engineer with Siemens Healthineers. Siemens Healthineers adopted vcpkg in late 2023 after a successful proof of concept. Their main motivation was to improve their versioning and overall dependency management for C++ libraries in their offline, air-gapped build environment. They also like vcpkg’s integration with ... Nov 12, 2024 5 2 What’s New for C++ Developers in Visual Studio 2022 17.12 Sy Brand We are happy to announce that Visual Studio 2022 version 17.12 is now generally available! This post summarizes the new features you can find in this release for C++. You can download Visual Studio 2022 from the Visual Studio downloads page or upgrade your existing installation by following the Update Visual Studio Learn page. Standard Library and MSVC Compiler As always, you can find all the details about our STL work in the changelog on GitHub. Thanks to everyone who contributed changes for this release! On the conformance side, we have finished the implementation of C++23’s P2286R8 Formatting Ranges by im... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics C++AnnouncementCMakeVcpkgNew FeatureVisual Studio CodeLinuxDiagnosticsGener