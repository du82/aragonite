full_description = '''Dev BlogsAzure Notification Hubs Blog /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } Azure Notification Hubs BlogLearn about Push Notifications and updates, releases and features of Notification Hubs Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Sep 25, 2024 0 0 Security Update: Changes to URI Expiry Time in Azure Notification Hubs Sreehari R As part of our ongoing efforts to enhance the security of Azure Notification Hubs, we are making an important change to the expiry time of the generated URIs. Starting from October 2024, the expiry time of PnsErrorDetailsUri will be reduced from 10 days to 5 days. This means that the PnsErrorDetailsUri returned will now be valid for only 5 days and will expire thereafter. The PnsErrorDetailsUri is returned from the Get Notification Message Telemetry API, which provides additional telemetry on the finished states of outgoing push notifications. Learn more about Get Notification Message Telemetry API here. Consum... May 22, 2024 0 0 Support of Azure Notification Hubs’ Firebase Cloud Messaging (FCM) legacy API will be deprecated on June 20, 2024. Heather Tian GCM/FCM is being deprecated: Customers have less than a month to migrate to FCM v1 Firebase Cloud Messaging (FCM) is a service that, among other things, facilitates developers sending push notifications to Google Play supported Android devices. ANH previously communicated with FCM using the Legacy HTTP protocol. FCM v1 is an updated API that offers more features and capabilities. Google will stop supporting FCM legacy HTTP on June 20, 2024. All customers must migrate your applications and notification payloads to the new format (FCM v1) before then. The Firebase Cloud Messaging (FCM) legacy API will be depr... Mar 27, 2024 6 2 Announcing Browser Push GA with Azure Notification Hubs Heather Tian We are extremely excited to announce the general availability of Azure Notification Hubs Browser Push Notifications, also known as Web Push Notifications. We know this has been a long asked for feature and we’re happy to say that you can now send notification messages via web browsers with ANH. This feature can be used through the Azure Portal, our REST APIs or Server-side SDKs. Azure Notification Hubs now supports Browser Push for all major browsers including Microsoft Edge, Google Chrome and Mozilla Firefox. Apple Safari is not included as you can use existing APNS support as described in Configuring Safari Pu... Mar 1, 2024 0 2 Announcing FCM v1 for ANH Heather Tian We are happy to announce that Azure Notification Hubs (ANH) Firebase Cloud Messaging (FCM) v1 is now generally available all customers. This means that you can start using the new features and capabilities of FCM v1 with ANH today. FCM v1 offers better security, performance, and reliability than the legacy FCM HTTP API, which will be deprecated by Google on June 20, 2024. To avoid any disruption in service, we strongly recommend that you migrate your applications and notification payloads to FCM v1 before then. To help you with the migration, we have updated our documentation with the steps and best practices fo... Jan 31, 2024 1 1 FCM v1 SDK preview program Heather Tian We are excited to announce that core capabilities for the integration of Azure Notification Hubs (ANH) with Firebase Cloud Messaging (FCM) v1 SDKs are ready for testing. As a reminder, Google will stop supporting FCM Legacy HTTP on June 20, 2024, so you will need to migrate your applications and notification payloads to the new format before then. All methods of onboarding will be ready for migration March 1, 2024. To help you with this transition, we are inviting you to join our preview program and test the FCM v1 onboarding process for SDKs in February. This will give you early access to the new features and c... Jan 12, 2024 5 2 FCM v1 Update as of Jan 2024 Heather Tian We are excited to announce that core capabilities for the integration of Azure Notification Hubs (ANH) with Firebase Cloud Messaging (FCM) v1 is ready for testing. As a reminder, Google will stop supporting FCM Legacy HTTP on June 20, 2024, so you will need to migrate your applications and notification payloads to the new format before then. All methods of onboarding will be ready for migration March 1, 2024. To help you with this transition, we are inviting you to join our preview program and test the FCM v1 onboarding process for Rest APIs in February. This will give you early access to the new features and ca... Nov 10, 2023 0 1 Introducing Private Link (Public Preview) Heather Tian We are excited to announce the public preview of Private Link, a new feature that enables you to connect to your data sources privately and securely from within your own virtual network. Private Link provides a direct and encrypted connection between your virtual network and your data source, without exposing your data to the public internet. This means you can access your data with lower latency, higher reliability, and enhanced security. Private Link is easy to set up and use. You can create a private endpoint for your data source in a few clicks. To get started with Private Link visit our documentation page h... Sep 26, 2023 4 3 Announcing Public Preview of Web Push Notifications with Azure Notification Hubs Heather Tian We are extremely excited to announce the public preview of Azure Notification Hubs Web Push Notifications. We know this has been a long asked for feature and we’re happy to say that you can now send notification messages via web browsers with ANH. Azure Notification Hubs now supports Browser Push for all major browsers including Microsoft Edge, Google Chrome and Mozilla Firefox. Apple Safari is not included as you can use existing APNS support as described in the Configuring Safari Push Notifications , with certificate-based authentication. Browser Push capability is currently supported across platforms with the... Sep 11, 2023 0 0 Introducing Availability Zones GA for Azure Notification Hubs Heather Tian We are excited to announce another new general available feature that improves the high availability of your push notifications: Availability Zones. This feature is available for an extra cost of $350 a month for all tiers. Starting October 9th, all customers including those who were previously in preview will begin to be billed for the feature add-on. You can only configure availability zones for new namespaces at this time. These zones are physically separate locations within each Azure region that are tolerant to local failures. Failures can range from software and hardware failures to events such as earthqua... Load 