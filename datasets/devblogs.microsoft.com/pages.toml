full_description = '''Dev BlogsAzure VM Runtime Team /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } Azure VM Runtime TeamAzure VM Runtime Team Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Nov 27, 2024 0 0 Properly cycling domain passwords with the JSonADDomain extension Joseph Calev For those familiar with the JsonAdDomain extension, it provides an easy way to join VMs to your domain. However, one aspect that customers have been less crazy about is that the domain password must be shared in the protected settings (where it is at least encrypted) and, more importantly, the functionality of the extension doesn't work well with standard security practices. There are several basic security practices involving something like a domain password: The standard procedure for cycling passwords is to actually have two keyvaults. Each contains a password, but only one is valid. When a... Nov 27, 2024 0 1 So how many replicas should my VM Application use? Joseph Calev One great advantage of VM Applications is the ability to specify how many replicas you want for each VM Application version. While documentation exists on how to specify replicas, we don't really provide advice on determining how many replicas to use. The goal of this post is to rectify that gap. First, the basics. When you specify a replica count, we create one storage account behind the scenes for each replica. These are shared across versions of the same application. So, if you have version 1, 2, and 3, and each has 3 replicas, then they'll all use the same storage account underneath. Different applications... Apr 29, 2024 0 0 Introducing Managed RunCommand Artifacts Joseph Calev As most of you may know from the current Managed RunCommand documentation there are multiple ways your script may be specified. However, what if your script uses various artifacts that also must be downloaded to the machine? Well, in the past it was necessary to call RunCommand are use some other technique to get those files on the machine. That process is now simplified. Added to the properties for Managed RunCommand is "artifacts". This is a collection containing artifacts with three properties. artifactUri - The uri from which to download the artifact. As with scriptUri, this may be a SAS ... Apr 3, 2024 0 1 Using Managed RunCommand in an ARM Template Joseph Calev Perhaps one of the largest differences between "Action RunCommand" (internally called RunCommand V1) and "Managed RunCommand" (internally called RunCommand V2) is that Managed RunCommands are ARM resources themselves. That means you can use them in ARM templates. Recently, I needed to issue a RunCommand in an ARM template, so I looked around for examples how to do this. Yes, even though we wrote RunCommand, we're just as lazy as anyone else. However, I didn't find anything, so I thought I'd share how this works so others may be lazy where I failed. The following is an example resource for a VM. This is f... Jan 5, 2024 0 1 When will CustomScript extension re-execute my script? Joseph Calev One of the lesser known differences between RunCommand and CustomScriptExtension is the fact that we do promise to not re-run your script in RunCommand, but no such promise exists for CustomScript. This is mentioned in the documentation, which isn't often fully understood. However, more than once I've been asked: when does CSE actually re-run the script? The answer is, it may run on a reboot. This can happen if your script never finished running. This is actually by design, since many scripts run by CSE may reboot the machine. So, in that case the scripts runs, installs some stuff, reboots the machine... Dec 11, 2023 0 0 The treatFailureAsDeploymentFailure flag Joseph Calev In both VmApplications and RunCommand, we support a property called "treatFailureAsDeploymentFailure". Note that for Managed RunCommand it may not be visible yet in Powershell or CLI, but it is available via ARM. Note that this flag is only available for managed RunCommand. It is not available for action RunCommand. For those unaware, managed RunCommand is the newer version and should be used by default. This flag originated in VmApplications, where the question arose "what if my application should fail to install?" Should this result in a failed deployment? In some cases yes, but in others no. The truth is we... Jul 5, 2023 0 1 Working with VM Application Names Joseph Calev I admit that VM Application names can be a bit tricky, or at least non-intuitive. The basic issue is this, you have some binary - let's call it MyApp.exe - and you want to install it on your VM. Therefore, you create a blob with the name MyBlob and set your install script to the following: You then name your VM Application "MyVmApp" and deploy it to a VM. The install will not work. Why? Because when we download your package to your VM, we'll rename it as "MyVmApp" (no extension). Why do we do that? Well, the VM doesn't know what name your package should be called. Therefore, it gives it the best name... Jun 19, 2023 0 2 Working with unmanaged storage account quotas in VM Applications Joseph Calev While working with VM Applications, it's possible to receive the following error. Operation could not be completed as it results in exceeding approved UnmanagedStorageAccountCount quota. Additional details - Deployment Model: Resource Manager, Location: northeurope, Current Limit: 64, Current Usage: 64, Additional Required: 1, (Minimum) New Limit Required: 65. Please read more about quota increase at https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits As errors go, this one is well done. It describes the problem, the current quota, and how to go about f... Jun 16, 2023 0 1 How to determine if your Runcommand script failed Joseph Calev Today, we're going to cover what can be a maddening issue in just determining whether your script failed. Let's start with a very simple operation. Open a Powershell window and run the following: This shouldn't be rocket science here. It's very clear that "this is an error" is, in fact, an error. So, with this universal fact determined, let's run it on an Azure VM. And now let's see the result. Note that you need to pass in -expand "instanceView" to see the actual error. Without this, you'll receive the following. This leads one to believe everything worked, when it didnt't. So, the first lesson... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics RunCommandVM ApplicationsAzure VM Runtime TeamCustomScriptExtensionARM TemplateJsonADDomain Top BloggersJo