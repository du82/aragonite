for GitHub Copilot Free through the Copilot setting in your GitHub account. No subscription needed! :D What is GitHub Copilot? GitHub Copilot is an AI coding assistant that helps you write code faster and with less effort, allowing you to focus more energy on problem solving and collaboration. GitHub Copilot has ... Feb 5, 2025 5 4 Windows Terminal Preview 1.23 Release Christopher Nguyen Happy New Year everyone! Here is our first Windows Terminal Preview release of the year! In this release, we focused on porting many of our beloved settings to the Settings UI. We also have several bug fixes and accessibility updates as well. We are also updating Windows Terminal stable to version 1.22 which will include all of the features from this previous blog post. Those that loved our sixel support and Snippets Pane in 1.22 Preview can now see those features in our mainline product! Also, huge thanks to the folks that have shared the cool stuff they've been doing with sixels to us. We're glad that you fol... Nov 19, 2024 3 4 What’s new in the Windows Subsystem for Linux in November 2024 Craig Loewen The latest updates to WSL bring new enterprise security features, new improvements to WSL distros, and the announcement that RedHat is officially becoming a WSL distro! Check out the table of contents in this post for a quick overview of all the announcements! Red Hat is becoming an official WSL distro Although you can run any Linux distro in WSL, being an official distro makes it easier for WSL users to install and discover it with actions like and . We’re excited to announce that Red Hat will soon be delivering a Red Hat Enterprise Linux WSL distro image in the coming months, and it will be shipped with t... Oct 29, 2024 4 3 GitHub Copilot in Windows Terminal Christopher Nguyen GitHub Copilot users can now use the power of GitHub Copilot to get command suggestions and explanations without leaving the terminal with Terminal Chat in Windows Terminal Canary 🚀 This is available for all GitHub Copilot Individual, Business, and Enterprise customers. To get started, sign up for a GitHub Copilot free trial and check out the GitHub Copilot quickstart guide. What is GitHub Copilot? GitHub Copilot is an AI coding assistant that helps you write code faster and with less effort, allowing you to focus more energy on problem solving and collaboration. GitHub Copilot has been proven to increase d... Aug 27, 2024 4 17 Windows Terminal Preview 1.22 Release Christopher Nguyen Hello friends, we have a new Windows Terminal Preview release! Windows Terminal Preview 1.22 is a large release that contains new features such as Sixel image support (a LARGE community contribution!), Grapheme Cluster Support, the Snippets Pane, Quick Fixes in CMD, and a new Cooked Read popup in CMD to name a few! We are also updating Windows Terminal stable to version 1.21 which will include all of the features from this previous blog post. For those that use Input Method Editor (IME), you will notice that we have improved our IME integration in Windows Terminal 1.21. We strive to make a globally-conscious pro... May 30, 2024 7 17 What’s new in the Windows Subsystem for Linux in May 2024 Craig Loewen For this year's Microsoft BUILD conference, we are thrilled to announce significant updates to WSL. This blog post will provide an overview of these enhancements and the recent developments in WSL. Memory, storage, and networking improvements We announced several improvements back in September as experimental features and have since been moving these features from experimental to the default settings. The latest pre-release version of WSL contains improvements to fundamentals of WSL, including: Experimental features include: - to enable automatic disk space reclaim. - wslconfig setting of s... May 21, 2024 0 6 WinGet.CommandNotFound Christopher Nguyen We are pleased to announce the release of ! This PowerShell module is a feedback provider plugin for PowerShell that leverages the Windows Package Manager to provide suggestions for packages to install when a native command cannot be found. The command-line predictor feature in PowerShell enables this module to display WinGet packages as predictive suggestions. This module was originally incubated as a utility in PowerToys. Thanks to the help of the PowerShell and PowerToys community, we got lots of positive feedback to turn this PowerToys utility into a real PowerShell module! :) Requirements The module is... May 8, 2024 2 12 Windows Terminal Preview 1.21 Release Christopher Nguyen Windows Terminal is back with another preview release! Windows Terminal Preview 1.21 introduces long-awaited features like Buffer Restore and fontfall back as well as new experimental features like Scratchpad and the ability to load up an image as a texture. There's also a LOT MORE stuff so check out the rest of this blog post to learn more! We are also updating Windows Terminal stable to version 1.20 which will include all of the features from this previous blog post. You can install Windows Terminal and Windows Terminal Preview from the Microsoft Store, from the GitHub releases page, or by using winget. If yo... Apr 30, 2024 2 7 Cascadia Code 2404.23 Christopher Nguyen Hello world! We are excited to announce the first major version update of Cascadia Code since the 2111.01 release three years ago! (Wow, time sure flies!) In this new 2404.03 release, we have added support for Quadrants, Sextants, Octants, Large Type Pieces, more legacy computing symbols, and Nerd Fonts to Cascadia Code. Huge shoutouts to Philippe Majerus (@PhMajerus), Aaron Bell (@aaronbell), and Fini (@Finii) for contributing to this release! You can download the latest version of the font from the GitHub releases page and it will be shipped in the latest update of the Windows Terminal. Quadrants and Sexta... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Windows Subsystem f