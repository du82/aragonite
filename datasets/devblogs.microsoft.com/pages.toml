description = "To report any issues, share an idea, ask us a question, or even pay us a compliment, please use our feedback button to submit your concern directly to our blog team. Please see the bottom section for details on how to use our feedback button."
full_description = "Dev BlogsDev Blogs FAQs .faq-page p, .faq-page li { font-size: var(--fs-h6); line-height: var(--lh-h6); } .faq-updates { width: 100%; } .entry-content h3 { margin: 0; } .faq-lists .toggleWrapper { padding-bottom: 16px; } .toggleButton { cursor: pointer; border-radius: 4px; align-items: center; } .toggleButton h3 { flex: 1; } .submit-feedback img { border: 1px solid var(--clr-border); width:100%; } .faq-img-dark { display: none; } html[theme='dark'] { .faq-img-light { display: none; } .faq-img-dark { display: block !important; } } @media (min-width: 1212px) { .faq-updates { width: 34%; } .faq-feed-back { width: 50%; } } Dev Blogs FAQs To report any issues, share an idea, ask us a question, or even pay us a compliment, please use our feedback button to submit your concern directly to our blog team. Please see the bottom section for details on how to use our feedback button. Latest Updates This is what we recently updated on the blog. Leave a note to tell us what you think, via the feedback button. Site Wide: Breadcrumbs: We’ve added breadcrumbs to make navigating easier. Main Dev Blogs page: Highlights: We’ve curated a list of blog posts that we think you’ll find very interesting but may have missed. Home Page: Popular topics: We’ve added a listing of the most commonly used topics for posts in this blog. Blog Page: Social share, comments, and likes: these are on left side of the page and always available while reading the post. Author Page: Topics: We now show the topics that the author writes about. Frequently Asked Questions Here are some of the questions that we’ve heard. If you have a different question or we didn’t completely answer one, please share your thoughts through our feedback button. How do I find other developer blogs? On the Dev Blogs Homepage go to the right hand side where you will see “All blogs”. How do I follow a blog team? From the blog homepage go to the “Follow this blog” section at the right hand side. You can follow the team on their social media sites or sign up to receive emails when new posts are published. Can I get notified when a new post is published? Yes. From the blog homepage go to the “Stay informed” section at the right hand side. You can sign up to receive emails when new posts are published. Where can I submit feedback? We would love to hear from you! Please see our instructions for how to submit feedback How can I manage my data? To submit a comment you will now need to sign in. After signing in, you will be able to edit or delete your comments from each post. You can also edit or delete your profile. You can find a detailed description and guidance on our Privacy on DevBlogs page. How to Submit Feedback You’ll notice a button with “Feedback” in blue at the bottom right on our pages that you can select to either share a suggestion, report a bug, give us a compliment, or ask a question. If you cannot submit feedback, please leave comment."
