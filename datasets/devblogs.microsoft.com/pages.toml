ention all the SDKs and packages they take a dependency on in their code. Sometimes it can be challenging to figure out how to make it all work together. If you’re tasked with providing guidance and common infrastructure for other developers on your team, you may need to wrestle with many more tools and services. Whether you use the Visual Studio family of IDEs, GitHub, Azure DevOps or build apps for Azure, Windows, M365, Teams or ... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Microsoft for DevelopersAnnouncement Relevant LinksMicrosoft for Developers Visual Studio Visual Studio Code DotNet Azure GitHub Microsoft Learn Archive November 2024 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-overlay'); const masonryContainer = document.querySelector('.masonry-container'); // Check the initial post count const initialPosts = masonryContainer.querySelectorAll('.masonry-card'); // Adjust selector if needed if (initialPosts.length < 8) { loadMoreButton.style.display = 'none'; // Hide "Load More" button if 9 or fewer posts } // Add a click event listener for the "Load More" button loadMoreButton.addEventListener('click', function () { currentPage++; // Increment page number const currentBlogId = loadMoreButton.getAttribute('data-siteid'); loadMoreButton.style.display = 'none'; // Hide "Load More Posts" text // Prepare data to send in the POST request const data = new FormData(); data.append('action', 'evo_pagination_load_more'); data.append('site_id', currentBlogId); data.append('paged', currentPage); // Show the preloader loaderOverlay.style.display = 'block'; // Perfo