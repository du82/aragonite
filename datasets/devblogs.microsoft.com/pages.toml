nsition after appending the item setTimeout(() => { item.classList.remove('hidden'); // Trigger the CSS transition }, 100); }); // Show the masonry container after the items are added masonryContainer.style.opacity = 1; // **Re-initialize Gifffer after new items are added** setTimeout(() => { if (typeof Gifffer === 'function') { Gifffer(); // Reinitialize Gifffer for new images } }, 300); // Delay to ensure new elements are in the DOM // Show the "Load More Posts" button again only if there are more pages if (currentPage < res.max) { loadMoreButton.style.display = 'block'; // Show "Load More Posts" text } // Hide the preloader after 500ms setTimeout(() => { loaderOverlay.style.display = 'none'; }, 500); }) .catch(error => { console.error('Error:', error); // Show the "Load More Posts" button if an error occurs loadMoreButton.style.display = 'block'; // Hide the preloader loaderOverlay.style.display = 'none'; }); }); });'''
