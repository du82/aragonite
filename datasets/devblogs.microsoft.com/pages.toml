title = "Azure DevOps Basic usage included with GitHub Enterprise - Azure DevOps Blog"
description = "Many customers want to use both GitHub and Azure DevOps together. Until now, unless you purchased Visual Studio subscriptions with GitHub Enterprise, you had to pay separately for both products. With the Sprint 252 release, Azure DevOps Basic usage rights are included with GitHub Enterprise Cloud. Your users access this benefit automatically when they login […]"
full_description = "Many customers want to use both GitHub and Azure DevOps together. Until now, unless you purchased Visual Studio subscriptions with GitHub Enterprise, you had to pay separately for both products. With the Sprint 252 release, Azure DevOps Basic usage rights are included with GitHub Enterprise Cloud. Your users access this benefit automatically when they login to Azure DevOps using Microsoft Entra. Their access level will change to “GitHub Enterprise” and just like a Visual Studio subscriber, there are no Azure DevOps charges for these users. We’ll be adding support for GitHub Enterprise Cloud with Data Residency customers soon. For more information, visit our GitHub Enterprise licensing FAQ and if you have any questions or feedback, please drop a comment below."
