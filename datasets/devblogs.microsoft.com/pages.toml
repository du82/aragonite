storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 28, 2025 0 0 Azure DevOps Basic usage included with GitHub Enterprise Andrew Brenner Many customers want to use both GitHub and Azure DevOps together. Until now, unless you purchased Visual Studio subscriptions with GitHub Enterprise, you had to pay separately for both products. With the Sprint 252 release, Azure DevOps Basic usage rights are included with GitHub Enterprise Cloud. Your users access this benefit automatically when they login to Azure DevOps using Microsoft Entra. Their access level will change to “GitHub Enterprise” and just like a Visual Studio subscriber, there are no Azure DevOps charges for these users. We’ll be adding support for GitHub Enterprise Cloud with Data Residenc... Feb 19, 2025 7 4 GitHub Copilot for Azure DevOps users Dan Hellem Azure DevOps customers frequently ask us when GitHub Copilot will be available to them. What many don’t realize is that GitHub Copilot for Business is already accessible to all customers, including those using Azure DevOps. Even better, much of its powerful functionality is integrated into tools you already use, like Visual Studio and VS Code. In this post, we’ll share resources to help you get started with GitHub Copilot as an Azure DevOps customer and highlight some of the great features available in your IDE. 👟 Getting Started Getting started with GitHub Copilot is simple and opens the door to a more efficie... Feb 11, 2025 6 2 February Patches for Azure DevOps Server Gloridel Morales Update 2/24: We re-released Patch 3 for Azure DevOps Server 2022.2. If you have previously installed the earlier versions of this patch, please update it using the provided link. This re-release addresses an issue causing YAML pipelines to fail. Further details on the issue can be found in the Developer Community. Update 2/13: We have re-released Patch 3 for Azure DevOps Server 2022.2 to fix the YAML pipelines failing issue reported in the Developer Community. You can use the link provided in this blog post to download the patch for the first time as well as fixing the issue if you have previously installed Patc... Feb 4, 2025 2 4 Full web support for conditional access policies across Azure DevOps and partner web properties Angel Wong We’re happy to announce that we’ve made significant progress in updating our web authentication stack on Azure DevOps services and partner web properties to utilize Microsoft Entra tokens to handle web sessions. By replacing our previous cookies with Entra tokens, we’ve deepened the integration we have with Microsoft Entra ID on our web experience. This change allows us to continuously evaluate identity compliance with Entra policies on an hourly basis (the duration of an Entra token). Previously, we could only regularly evaluate IP-fencing policies (at a much less frequent cadence than every hour) with our old... Feb 3, 2025 0 1 Update to Azure DevOps Allowed IP addresses Soo Stahl We are excited to announce some important upgrades to our networking infrastructure that will enhance the performance and reliability of our service. As part of these infrastructure upgrades, we are introducing new IP addresses that you will need to allow list in your firewall configurations. What’s Changing And Why? We are transitioning from the current set of network edge devices supporting Azure DevOps to new, better-performing network edge devices by May 2025. As part of this transition, we have added new IP addresses to the current published allow list - Allowed address lists and network connections - Azur... Jan 28, 2025 2 0 Upcoming support lifecycle milestones for older on-premises products Gloridel Morales Multiple versions of our on-premises product will reach the end of support on October 14, 2025. Customers are encouraged to start planning and deploying upgrades now to ensure that installed products remain supported and secure, and to take advantage of new capabilities offered in successor products. The latest version of our on-premises product is Azure DevOps Server 2022.2. October 14, 2025, is the date for the end of Extended Support for Team Foundation Server 2015 - meaning it will no longer receive security updates or technical support. Upon end of support, there will be no new updates, free or paid assiste... Jan 28, 2025 0 1 Changes to provisioning Azure DevOps projects using the Azure DevOps Demo Generator Gloridel Morales The Azure DevOps Demo Generator is a tool that allows you to create projects in your Azure DevOps organization, complete with pre-filled sample content. This includes source code, work items, iterations, service connections, and build and release pipelines, all based on a template you select. Starting February 28, 2025, we are eliminating the need for us to authenticate on your behalf. This update will give you greater control over creating new projects and ensure a more secure process. Instead of the previous authentication process, you will run the ADOGenerator project as a console application or executable (.... Jan 6, 2025 8 4 Reducing personal access token (PAT) usage across Azure DevOps Angel Wong In the new year, we’ll be making moves towards strengthening Microsoft and our customers' security posture in regards to the usage and creation of personal access tokens (PATs). If you’ve been following this blog, you may have noticed we’ve been distancing away from PATs as the recommended authentication method for Azure DevOps APIs by offering restrictive policies and more secure alternatives. PATs can be an enticing vector for unauthorized access, especially when insecurely stored, over-scoped, or set for long durations. There exist scenarios where PATs remain the primary form of authentication within Azure D... Jan 5, 2025 11 4 Important: Switching CDN providers Clayton Kanyika The current content delivery network (CDN) provider Edgio, used by Azure DevOps is retiring. We're urgently transitioning to a solution served by Akamai and Azure Front Door CDNs to maintain the responsiveness of our services. What this means for you For most of you, this transition will be seamless. To ensure that you can continue to access Azure DevOps without any interruptions, use the following Powershell commands to validate that your current firewall settings allow connectivity to the new CDN providers: If your network includes firewalls that could affect access to the new CDNs, we recommend adding ... Load more posts .toggleWrapper: