 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Jan 29, 2025 0 0 Automating Developer Environments with Microsoft Dev Box and Teams Customizations Isaac Levin The following blog walks through the experience of defining and automating the creation of developer environments with the newly announced Teams Customizations feature in Microsoft Dev Box. This allows developer team leads or managers to define the software installed by default every time a developer creates a new environment, ensuring that every team member has the latest tools and frameworks needed to deliver on a project right away. This automates the typical process of using a combination of custom images, miscellaneous scripts, and manual configuration that is used in most organizations today. Moving to an a... Jan 28, 2025 0 1 Unlock key capabilities via Generation 2 VMs in Azure DevTest Labs Anish Trakru We are excited to announce enhanced support for Generation 2 VMs on Azure DevTest Labs, now in public preview. We listened to your feedback and have improved the support for using Generation 2 VMs in Azure DevTest Labs. Generation 2 Virtual Machines (VMs) support key capabilities that are not supported in Generation 1 VMs such as increased memory, Intel Software Guard Extensions (Intel SGX), and virtualized persistent memory (vPMEM). Generation 2 VMs might have improved boot and installation times. You can now easily choose between 1 (Gen 1) and Generation 2 (Gen 2) version of the same marketplace image and... Jan 27, 2025 0 0 Reduce costs with Hibernation in Azure DevTest Labs Anish Trakru In the ever-evolving landscape of cloud computing, cost efficiency remains a top priority for platform engineers and lab users. To help organizations optimize cloud costs and management, we’re excited to introduce the Hibernation feature for virtual machines (VMs) in Azure DevTest Labs, now in public preview. The new Hibernation feature in Azure DevTest Labs helps optimize costs by pausing Virtual Machines (VMs) while preserving their state, making it easy to resume work without losing progress. Hibernation is an effective way to reduce costs and adds more flexibility to VM management. Azure DevTest Labs ha... Nov 26, 2024 0 1 Introducing more secure and seamless access in Azure DevTest Labs Anish Trakru We’re excited to announced new support in Azure DevTest labs for accessing Azure DevOps artifact repos via Managed Identities and GitHub artifact repos through GitHub app authentication. Additionally, the lab storage account can also now be accessed via Managed Identities. Until now, users have relied on Personal Access Tokens (PATs) and Storage Access Shared (SAS) tokens to connect to these resources. However, these tokens can introduce security risks if exposed, require ongoing management, and may expire unexpectedly, leading to disruptions. With Managed Identity and GitHub app authentication, development... Nov 19, 2024 0 2 Introducing a new landing page and welcome tour for Microsoft developer portal! Vedha At Microsoft, we are dedicated to shaping a developer experience that is efficient, user-friendly, and tailored to your needs. With the new landing page and welcome tour, we’re excited to empower you to work more effectively and unlock new levels of productivity. Together, we’re building a platform that evolves with you. At Microsoft, we’re focused on creating a developer experience that’s easy to use and meets your needs. Our new Dev Box landing page and welcome tour are designed to help you work efficiently and boost productivity. The updated landing page is a central hub that organizes key ... Nov 19, 2024 0 1 Understanding the basics of Dev Box teams customizations Fawad Khan Streamline Your Development Workflow with Dev Box Customizations Are you looking to enhance your team's development environment? Look no further! With Microsoft Dev Box, you can now customize your development boxes to fit your team's specific needs. Let's dive into how you can leverage Dev Box customizations to streamline your workflow. What is Dev Box Customization? Dev Box customization allows development team leads to create ready-to-code configurations for their entire team. By defining tools, packages, and settings in a single configuration file, you can ensure that every team member has a consisten... Nov 19, 2024 0 1 New features enhance developer experience, customizations, and security in Azure Deployment Environments Sagar Chandra Reddy Lankala If you’ve been following our journey with Azure Deployment Environments (ADE), you’ll know we’ve been on a mission to make the service as seamless and simple as possible to help developers access the infrastructure they need. Earlier this year at Build, we were excited to announce continued improvements to the ADE extensibility model that enable platform engineers to customize deployment with any infrastructure-as-code (IaC) framework and customize the deployments to meet your organization’s specific needs. But we’re not stopping there—we’ve continued to innovate with ADE, and today, we’re excited to announce ... Nov 19, 2024 0 1 Boost security and team agility through project-level guardrails with Dev Box project policies Denizhan Yigitbas As development teams embrace cloud-based tools to accelerate their workflows, managing resources securely and efficiently across different projects has become a top priority for IT pros and developers alike. Microsoft Dev Box is designed to streamline project-based development, providing developers with tailored cloud development environments optimized for productivity and collaboration. Today, we’re excited to announce a new feature, now available for preview for Microsoft Dev Box: project policies. Project policies bring a powerful new way for platform engineers to set guardrails around resources enabled on ... Nov 18, 2024 0 1 Developer Productivity Services QR codes Fawad Khan QR codes for Developer Productivity Services (DPS) resources: Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Dev BoxAzure Deployment EnvironmentsAzure DevTest Labs Rel