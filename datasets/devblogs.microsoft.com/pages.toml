1 (Gen 1) and Generation 2 (Gen 2) version of the same marketplace image and... Jan 27, 2025 0 0 Reduce costs with Hibernation in Azure DevTest Labs Anish Trakru In the ever-evolving landscape of cloud computing, cost efficiency remains a top priority for platform engineers and lab users. To help organizations optimize cloud costs and management, we’re excited to introduce the Hibernation feature for virtual machines (VMs) in Azure DevTest Labs, now in public preview. The new Hibernation feature in Azure DevTest Labs helps optimize costs by pausing Virtual Machines (VMs) while preserving their state, making it easy to resume work without losing progress. Hibernation is an effective way to reduce costs and adds more flexibility to VM management. Azure DevTest Labs ha... Nov 26, 2024 0 1 Introducing more secure and seamless access in Azure DevTest Labs Anish Trakru We’re excited to announced new support in Azure DevTest labs for accessing Azure DevOps artifact repos via Managed Identities and GitHub artifact repos through GitHub app authentication. Additionally, the lab storage account can also now be accessed via Managed Identities. Until now, users have relied on Personal Access Tokens (PATs) and Storage Access Shared (SAS) tokens to connect to these resources. However, these tokens can introduce security risks if exposed, require ongoing management, and may expire unexpectedly, leading to disruptions. With Managed Identity and GitHub app authentication, development... Nov 19, 2024 0 2 Introducing a new landing page and welcome tour for Microsoft developer portal! Vedha At Microsoft, we are dedicated to shaping a developer experience that is efficient, user-friendly, and tailored to your needs. With the new landing page and welcome tour, we’re excited to empower you to work more effectively and unlock new levels of productivity. Together, we’re building a platform that evolves with you. At Microsoft, we’re focused on creating a developer experience that’s easy to use and meets your needs. Our new Dev Box landing page and welcome tour are designed to help you work efficiently and boost productivity. The updated landing page is a central hub that organizes key ... Nov 19, 2024 0 1 Understanding the basics of Dev Box teams customizations Fawad Khan Streamline Your Development Workflow with Dev Box Customizations Are you looking to enhance your team's development environment? Look no further! With Microsoft Dev Box, you can now customize your development boxes to fit your team's specific needs. Let's dive into how you can leverage Dev Box customizations to streamline your workflow. What is Dev Box Customization? Dev Box customization allows development team leads to create ready-to-code configurations for their entire team. By defining tools, packages, and settings in a single configuration file, you can ensure that every team member has a consisten... Nov 19, 2024 0 1 New features enhance developer experience, customizations, and security in Azure Deployment Environments Sagar Chandra Reddy Lankala If you’ve been following our journey with Azure Deployment Environments (ADE), you’ll know we’ve been on a mission to make the service as seamless and simple as possible to help developers access the infrastructure they need. Earlier this year at Build, we were excited to announce continued improvements to the ADE extensibility model that enable platform engineers to customize deployment with any infrastructure-as-code (IaC) framework and customize the deployments to meet your organization’s specific needs. But we’re not stopping there—we’ve continued to innovate with ADE, and today, we’re excited to announce ... Nov 19, 2024 0 1 Boost security and team agility through project-level guardrails with Dev Box project policies Denizhan Yigitbas As development teams embrace cloud-based tools to accelerate their workflows, managing resources securely and efficiently across different projects has become a top priority for IT pros and developers alike. Microsoft Dev Box is designed to streamline project-based development, providing developers with tailored cloud development environments optimized for productivity and collaboration. Today, we’re excited to announce a new feature, now available for preview for Microsoft Dev Box: project policies. Project policies bring a powerful new way for platform engineers to set guardrails around resources enabled on ... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Dev BoxAzure Deployment EnvironmentsAzure DevTest Labs Relevant LinksDev Box resources Dev Box docs Azure Deployment Environments Archive February 2025 January 2025 November 2024 October 2024 September 2024 August 2024 May 2024 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "L'''
