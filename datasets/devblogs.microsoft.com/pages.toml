full_description = '''Dev BlogsMicrosoft for Go Developers /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } Microsoft for Go DevelopersNews, updates, and insights for Go development with Microsoft tools Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 13, 2025 0 0 Go 1.24.0-1 Microsoft build now available Davis Goodin A new release of the Microsoft build of Go is now available for download. Feb 12, 2025 0 0 Go 1.23.6-2 and 1.22.12-2 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go including security fixes is now available for download. Feb 6, 2025 0 2 Microsoft build of Go 1.24 FIPS changes Quim Muntal The Microsoft build of Go 1.24 ships with many new FIPS-140 related features. Here's a closer look at the upcoming changes. Feb 5, 2025 0 0 Go 1.23.6-1 and 1.22.12-1 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go including security fixes is now available for download. Jan 17, 2025 0 0 Go 1.23.5-1 and 1.22.11-1 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go including security fixes is now available for download. Dec 4, 2024 0 0 Go 1.23.4-1 and 1.22.10-1 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go is now available for download. Dec 3, 2024 0 0 Go 1.23.3-2 and 1.22.9-2 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go is now available for download. Nov 7, 2024 0 0 Go 1.23.3-1 and 1.22.9-1 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go is now available for download. Oct 2, 2024 0 0 Go 1.23.2-1 and 1.22.8-1 Microsoft builds now available Davis Goodin A new release of the Microsoft build of Go is now available for download. Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Microsoft for Go DevelopersSecurityCommunity AboutMicrosoft for Go Developers – Go on Azure Documentation Center – Go in Visual Studio Code – Microsoft Build of Go toolset Archive February 2025 January 2025 December 2024 November 2024 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 April 2024 March 2024 February 2024 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-overlay'); const masonryContainer = document.querySelector('.masonry-container'); // Check the initial post count const initialPosts = masonryContainer.querySelectorAll('.masonry-card'); // Adjust selector if needed if (initialPosts.length < 8) { loadMoreButton.style.display = 'none'; // Hide "Load More" button if 8 or fewer posts } // Add a click event listener for the "Load More" button loadMoreButton.addEventListener('click', function () { currentPage++; // Increment page number const currentBlogId = loadMoreButton.getAttribute('data-siteid'); loadMoreButton.style.display = 'none'; // Hide "Load More Posts" text // Prepare data to send in the POST request const data = new FormData(); data.append('action', 'evo_pagination_load_more'); data.append('site_id', currentBlogId); data.append('paged', currentPage); // Show the preloader loaderOverlay.style.display = 'block'; // Perform the AJAX request using fetch API fetch(devblogs_ajax_evo.ajaxurl, { method: 'POST', body: data }) .then(response => response.json()) .then(res => { // Append new items to the masonry container const tempDiv = document.createElement('div'); tempDiv.innerHTML = res.html; const newItems = tempDiv.children; Array.from(newItems).forEach(item => { item.classList.add('hidden'); // Add the 'hidden' class initially masonryContainer.appendChild(item); // Use CSS transition after appending the item setTimeout(() => { item.classList.remove('hidden'); // Trigger the CSS transition }, 100); }); // Show the masonry container after the items are added masonryContainer.style.opacity = 1; // **Re-initialize Gifffer after new items are added** setTimeout(() => { if (typeof Gifffer === 'function') { Gifffer(); // Reinitialize Gifffer for new images } }, 300); // Delay to ensure new elements are in the DOM // Show the "Load More Posts" button again only if there are more pages if (currentPage < res.max) { loadMoreButton.style.display = 'block'; // Show "Load More Posts" text } // Hide the preloader after 500ms setTimeout(() => { loaderOverlay.style.display = 'none'; }, 500); }) .catch(error => { console.error('Error:', error); // Show the "Load More Posts" button if an error occurs loadMoreButton.style.display = 'block'; // Hide the preloader loaderOverlay.style.display = 'none'; }); }); });'''
