ut-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Oct 31, 2021 0 0 Time-of-flight camera characterization with functional modeling for synthetic scene generation Azure Depth Platform team Staying at the forefront of 3D sensing technology development requires continuous investment and innovation. Microsoft's paper : “Time-of-flight camera characterization with functional modeling for synthetic scene generation”, which was recently published in "Optics express" is a clear demonstration of the depth (pun intended) we go to at Microsoft, to make sure partners and customers get the best 3D sensing capabilities possible - click here to read. In this manuscript, we design, describe, and present a functional model of Time-of-Flight (ToF) cameras. The model can be used to generate randomized scenes ... Aug 12, 2021 0 0 How Do ToF Based Depth Cameras Improve Our Lives? Azure Depth Platform team This installment of the Azure Depth Platform blog is co-authored by David Chen, Co-founder & Chief Executive Officer at Orbbec and Amit Banjeree, Co-founder & Technical Lead, Azure Depth Platform program. The concept of medical imaging was born in 1895 with the invention of the x-ray by a German professor of physics, Wilhelm Rontgen. X-ray paved the way for the more advanced imaging techniques used in medicine and forensic investigation such as CT (computed tomography) scans and MRI (magnetic resonance imaging). Today, optical fiber imaging has enabled medical professionals to see inside the body wit... Jul 8, 2021 0 0 DS Smith, provider of sustainable packaging solutions, pilots digital 3D dimensioning to transform logistic operations Azure Depth Platform team DS Smith is a leading provider of sustainable fiber-based packaging that improves transport and storage efficiency, boosts retail presentation and increases product sales for their customers worldwide. Headquartered in London, the company plays a central role in the value chain across sectors including e-commerce, fast moving consumer goods and industrials and is constantly looking for ways to improve its production process. To optimize warehousing processes, the availability of real-time dimensional data of packaged product is essential. DS Smith creates packaging solutions that meet their customers‘ su... Jun 11, 2021 0 0 Case Study: dnata digitally transforms air cargo ground operations with Microsoft 3D technology and Azure. Azure Depth Platform team The aviation industry relies heavily on service providers to efficiently transport cargo between locations. Related processes which are part of what is known as ground operations, are poised to experience tremendous growth, according to Boeing’s World Air Cargo Forecast (2020-2039), “Overall, world air cargo traffic will more than double over the next 20 years, expanding from 264 billion revenue ton-kilometer (RTK) in 2019 to 578 billion RTKs in 2039.” dnata is one of the world’s largest air service providers that serves airlines and airports with everything from ground and cargo handling to inflight cater... Jun 7, 2021 0 0 Case Study: Davidovich Group keeps its eyes on inventory with Azure 3D and AI in the cloud. Azure Depth Platform team Davidovich chooses Microsoft’s 3D Time-of-Flight (ToF) technology to capture high-quality, precise 3D data of objects in motion in the company's warehouse to improve inventory management. May 27, 2021 0 0 Time of Flight Camera – System Overview paulo The Azure Depth Platform program is delighted to have Paul O’Sullivan - System Engineer, and Nicolas Le Dortz - System Engineer Manager at Analog Devices as our guest blog authors for this edition of the Azure Depth Platform blog. Paul O'Sullivan Nicolas LeDortz Analog Devices (ADI) is building on the core Microsoft ToF pixel technology to deliver complete ToF solutions to a broad customer base in areas such as industrial factory automation, inventory management, automotive infotainment, augmented reality, computational photography and videography. This blog post will describe some of the advantages of c... Apr 16, 2021 0 0 Understanding Indirect ToF Depth Sensing Oliver Now that you’ve had a chance to read the Intro to Indirect Time-of-Flight (ToF) post, let’s dig a little deeper into the mechanics behind the Microsoft implementation of time-of-flight depth sensing, as well as a couple functional advantages it presents. How does “Indirect” ToF work? To recap, “time-of-flight” refers to emitting light at an object and measuring how long it takes to bounce back and return, then converting the time measurement into distance using the speed of light, giving us the object’s shape and position in its surroundings. Figure 1. Generalized operation of time-of-flight sensing. In pra... Mar 8, 2021 0 0 Moore’s Law for ToF Pixels swati In 1975 Gordon Moore made a prediction which became famous as Moore’s law which states that the number of transistors in a microchip doubles every two years (or 18 months depending on who you talk to) (Figure 1). The simplified version of this law states that the processing power or processing speed doubles every two years. Translating to image sensors in general, does the number of pixels in a sensor double every two years or pixel size scale by √2 every two years. Not so fast, image sensors are more like analog chips than digital chips which do not scale proportionately with the technology node. RGB sensors hav... Feb 4, 2021 4 0 Raw-to-Depth: Advanced 3D Sensing Sergio Brief: Microsoft ToF technology is now available to industry and Azure customers can access premium processing for enhanced 3D depth sensing that delivers improvements in spatial frequencies, ambience resilience, pixel resolution, processing time, and more. Microsoft has made a strategic decision to make its Time-of-Flight technology accessible outside of Microsoft, to enable camera makers, solution providers, and ISVs to drive innovative 3D sensing capabilities across multiple industries and scenarios, such as: Robotics, IoT, logistics, factory automation, retail, fitness, healthcare and more… Working across... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Azure Depth PlatformSensorsRobotics Program Mission Driving autonomous automation using 3D vision & AI Azure Depth integrates Microsoft Time of Flight (ToF) depth sensing technology with the Azure intelligent edge and intelligent cloud platforms to drive cloud-connected 3D vision through our ecosystem of semiconductor, IHV, ISV, and system integrator partners to disrupt computer vision adoption as we know it. Learn more. Partnership NewsLX Semicon Inropa Beevision MintT Orbbec LG Innotek Tempo speedcargo Agent Factory Analog Devices SICK Leopard Imaging D3 Engineering Relevant LinksMeet our team Meet our partners Watch our videos Contact us to partner Archive October 2021 August 2021 July 2021 June 2021 May 2021 April 2021 March 2021 February 2021 January 2021 Follow this blog document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-overlay'); const masonryContainer = document.querySelector('.masonry-container'); // Check the initial post count const initialPosts = masonryContainer.querySelectorAll('.masonry-card'); // Adjust selector if needed if (initialPosts.length < 8) { loadMoreButton.style.display = '''
