rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Jan 16, 2025 0 0 Unlocking new possibilities: Microsoft AI, database, and identity products receive authorization for Top Secret workloads Douglas Phillips Microsoft’s leading AI capabilities are being used across industries to enhance data analysis, bolster security, and support key business priorities. Our U.S. Government customers and authorized partners consistently share that they are ready and eager to apply these same tools to serve their critical missions, and Microsoft is committed to delivering the breadth of our capabilities to them securely, responsibly and compliantly. These capabilities open new possibilities for government agencies to improve public services, streamline internal workflows, and support critical missions like disaster response and publi... Aug 12, 2024 2 0 Azure OpenAI, including GPT-4o, Approved as a Service within the FedRAMP High Authorization for Azure Government Douglas Phillips Editor’s note (September 3, 2024): this post has been updated to note that Azure OpenAI has been approved as a service within the DOD IL4 and IL5 Provisional Authorization for Azure Government by Defense Information Systems Agency (DISA). As part of our ongoing effort to deliver the latest AI innovations to our government customers, our team is proud to announce several significant updates: Agencies requiring FedRAMP High Authorization are now able to access these leading AI capabilities within their Azure Government tenant, enabling secure and responsible access to the latest AI technologie... Jun 11, 2024 0 1 Next steps: how to rapidly reach the potential of AUKUS Scott Gills “… the story of AI's industrialisation is intimately tied to Cloud infrastructure …”1 The United States (US) has long recognised the imperative to apply innovative commercial technologies like artificial intelligence (AI) to national security.2 Transformative developments of AI will impact many areas of society, including Defence.3 For example the Maven Smart System is a powerful AI platform developed by the US Department of Defense, designed to identify personnel and equipment on the battlefield using machine learning algorithms. It integrates various data sources, including satellite imagery and geol... May 20, 2024 0 0 Anticipating the future of physical systems design Mujtaba Hamid Rising complexity, IP intensity and need for security of physical systems products requires a transformation in how to develop, manufacture and operate these systems. To meet time-to-market demands, software developers and hardware producers alike need optimized cloud + AI solutions that can provide higher levels of collaboration, higher protection and access to scalable computing resources, and the latest AI technologies. Additionally, government and industry require increasing validation of security and access controls to many physical systems that are key to commercial and national security. In March, Micro... May 6, 2024 0 2 Microsoft AI Powering DARPA’s AI Cyber Challenge William Chappell One of the most promising applications of advanced AI is its ability to help combat cyberattacks from enhanced threat intelligence to AI-powered remediation. The Defense Advanced Research Projects Agency (DARPA) has launched the AI Cyber Challenge (AIxCC) that will bring together the foremost experts in AI and cybersecurity to develop innovative solutions to safeguard critical infrastructure from cyber threats. Microsoft is proud to support this challenge by providing the participating teams with access to the latest AI models in Microsoft Azure. Innovation with AI and cybersecurity is even more important for ... Apr 30, 2024 0 0 Beyond the hype: Part 1, How trustworthy AI empowers US Government agencies Kent Cunningham Large language models’ (LLM) ability to transform mission workflows for US Government agencies is revolutionary and adoption is now starting to accelerate. As agencies begin to leverage LLMs, they unlock capabilities that promise to streamline processes and drive innovation forward. It also means that there’s more to be done in the near term to support the deployment of LLM applications. With this great potential comes great responsibility. From a national security perspective, LLMs are essential for readiness and resilience. Adversaries have already invested heavily in this technology, employing AI to power d... Apr 23, 2024 0 2 Supporting Federal Agencies in Their Implementation of the Executive Order on AI – Part 1 Jason,Kent,Richard The Office of Management and Budget’s (OMB) Memorandum on Artificial Intelligence (M-24-10) (the “Memo”), part of the President’s comprehensive strategy on AI, outlines a structured approach for federal agencies to leverage artificial intelligence responsibly. The Memo provides direction that establishes a governance framework, fosters responsible AI innovation, and implements important risk management protocols. Microsoft values the Memo’s guidance that enables agencies to implement AI safely and effectively in fulfilling their missions, is committed to supporting these initiatives, and offers agencies the ca... Mar 18, 2024 0 5 Azure Modeling and Simulation Workbench now in public preview Mujtaba,Prashant Mujtaba Hamid, GM Product Management, Strategic Missions & Technologies, Microsoft Prashant Varshney, Head of Product, Azure MSWB, Strategic Missions & Technologies, Microsoft Designing a silicon chip, an aircraft engine, an autonomous system, running sub-surface simulation for oil drilling, and other complex engineering systems are processes that typically include thousands of functions to verify, complex system interactions to optimize and multiphysics simulations to validate manufacturability. The need for close collaboration of developers from different disciplines, software and IP partners and ... Feb 21, 2024 0 5 Comprehensive Document Translation Solution Sreedhar,Richard,Ted Background and Use Cases Many of our customers have a requirement to translate documents from a variety of languages into a common language to ensure their mission success. These documents can be in a variety of formats, with unique page layouts and styles, and they may contain images with embedded text essential for a complete understanding by the reader. In many scenarios, there are large numbers of documents that must be translated quickly and securely to ensure mission success. Below are some common use cases for government organizations requiring document translation: The C... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Azure GovernmentAzureCloud StrategyComplianceSecurityGovernmentGovernment CloudCybersecurityMeetupDoD Relevant LinksMicrosoft Azure Blog Microsoft Azure Blog – Government Microsoft Azure for US Government Archive January 2025 August 2024 June 2024 May 2024 April 2024 March 2024 February 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 May 2023 July 2022 June 2022 May 2022 April 2022 March 2022 January 2022 December 2021 October 2021 September 2021 August 2021 July 2021 June 2021 May 2021 April 2021 March 2021 February 2021 January 2021 November 2020 October 2020 September 2020 August 2020 July 2020 June 2020 May 2020 April 2020 March 2020 February 2020 January 2020 December 2019 November 2019 October 2019 September 2019 August 2019 July 2019 June 2019 May 2019 April 2019 March 2"
