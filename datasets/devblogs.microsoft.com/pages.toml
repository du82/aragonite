: 24px; margin-bottom: 24px; } } .postexcerpt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .highlights-summary:nth-child(4n) { padding-bottom: 0px; margin-bottom: 0px; border: none; } Microsoft Developer Blogs Get the latest information, insights, and news from Microsoft. Feb 25, 2025.NET Aspire 9.1 is here with six great new dashboard features, and more!.NET Aspire 9.1 is here! From enhanced dashboard capabilities like Resource Relationships and Localization Overrides to improved Docker integration and flexible console logs, this release is packed with tools to streamline your development process.Read more Feb 24, 2025Claude 3.7 Now Available in GitHub Copilot for Visual StudioThe world of AI is evolving at a breathtaking pace, and today brings an exciting milestone for developers and tech enthusiasts alike. Anthropic’s newest release, Claude 3.7, is now available directly within GitHub Copilot for Visual Studio 2022 17.13, heralding a new era of seamlessly...Read more Feb 24, 2025Let's Learn .NET: GitHub Copilot EventJoin us for an exciting Let's Learn .NET live stream event where we will explore GitHub Copilot and its capabilities.Read more .netsposts-paginate .next.page-numbers.hidden { display: none; } /* as btn-secondary */ .netsposts-paginate .next.page-numbers { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--clr-body); background-color: var(--clr-btn-greyscale-bg); padding: 5px 12px 7px 12px; border-radius: 4px; border: 1px solid var(--clr-btn-greyscale-border); text-decoration: none; display: inline-flex; justify-content: center; align-items: center; } @media (max-width: 1084px) { .netsposts-paginate .next.page-numbers { margin-bottom: 40px; } } .netsposts-paginate .next.page-numbers path { fill: var(--clr-btn-greyscale); } .netsposts-paginate .next.page-numbers:hover { color: var(--clr-btn-greyscale-hover); background-color: var(--clr-btn-greyscale-hover-bg); border-color: var(--clr-btn-greyscale-hover-border); text-decoration: none; } .netsposts-paginate .next.page-numbers:active { color: var(--clr-btn-greyscale-active); background-color: var(--clr-btn-greyscale-active-bg); border-color: var(--clr-btn-greyscale-active-border); } @media (forced-colors: active) { .netsposts-paginate .next.page-numbers { color: ButtonText; } .netsposts-paginate .next.page-numbers:hover { color: Highlight; } } /* sidebar */ span.card-text.listdisplay ul li { padding-bottom: 12px; } span.card-text.listdisplay ul li:last-child { padding-bottom: 0px; } .listdisplay ul { padding-left: 1rem; list-style-type: none; } /* rss button */ .container-sidebar-home aside .rssfeed-section a { display: inline-flex; align-items: center; gap: 6px; } .rssfeed-section a:hover, a.rssfeed-link:hover { background-color: #f5f5f5; text-decoration: none; } .rssfeed-section a:focus { border-color: #000; } .rssfeed-section a:active { background-color: #E0E0E0; } html[theme="dark"] .rssfeed-section a:hover, html[theme="dark"] .rssfeed-section a:active { background-color: #141414; } html[theme="dark"] .rssfeed-section a:focus { border-color: #fff; } html[theme="dark"] .evo-dropdown-button { background-color: #000; } .rssfeed-link { border: 1px solid #D1D1D1; line-height: 1; height: 32px; padding: 7px 12px 8px; border-radius: 4px; } html[theme='dark'] .rssfeed-link { border: 1px solid #525252; } html[theme='dark'] .rssfeed-link:hover { background: #1F1F1F; text-decoration: none; } .rssfeed-section svg { width: 18px; height: 18px; } .rssfeed-link span { line-height: 1.2; display: inline-block; vertical-align: top; font-size: 14px; } .rssfeed-link.link-mobile.hide-mobile { display: none; } .rssfeed-link.link-mobile svg { width: 18px; height: 18px; } Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = true; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 28, 2025 Post comments count0 Post likes count0Azure DevOps Basic usage included with GitHub EnterpriseAndrew BrennerMany customers want to use both GitHub and Azure DevOps together. Until now, unless you purchased Visual Studio subscriptions with GitHub Enterprise, you had to pay separately for both products. With the Sprint 252 release, Azure DevOps Basic usage rights are included with GitHub...Azure DevOps Blog Feb 28, 2025 Post comments count0 Post likes count0Announcing AI Shell Preview 2Steven BucherWe are pleased to share a new preview release of AI Shell!PowerShell Team Feb 28, 2025 Post comments count0 Post likes count3Announcing TypeScript 5.8Daniel RosenwasserToday we're excited to announce the release of TypeScript 5.8! If you're not familiar with TypeScript, it's a language that builds on top of JavaScript by adding syntax for types. Writing types in our code allows us to