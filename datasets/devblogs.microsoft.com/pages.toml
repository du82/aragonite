full_description = '''Dev BlogsPower Platform Developer Blog /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } Power Platform Developer BlogInsights, how-tos and updates for building low code solutions with the Power Platform Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Feb 28, 2025 0 1 Integrate Copilot Studio agents with Microsoft Entra External ID to give your customers access Joylynn Kirui Learn how to integrate Copilot Studio agents with Microsoft Entra External ID using the Generic OAUTH 2.0 service provider option, ensuring your customers can securely log in to your agents. Feb 27, 2025 0 0 Powerful Devs Hack Together 2025 Wrap Up Elaiza Benitez We're almost at the finish line! Our Powerful Devs Hack Together is coming to a close and we encourage you to continue with your AI journey. Feb 11, 2025 0 1 Bells and whistles: Building with Microsoft Copilot Studio Daniel,Gomolemo In this series, we showcase the different capabilities of building agents with Copilot Studio, which includes building, testing, deploying, analyzing, security and data loss prevention policy. Feb 6, 2025 0 0 Mastering automated testing in Power Platform: Evergreen concepts for robust solutions Grant Archibald Get a deep dive into the concepts of automated testing within the Power Platform, along with insights and best practices to help you build robust and reliable solutions. Feb 3, 2025 0 3 Announcing the ‘Simplify Microsoft Power Platform Deployments by Using Pipelines’ Learning Path Daniel Laskewitz Microsoft Learn offers many Power Platform learn modules. Now, we are expanding the collection with a new release! Pipelines in Power Platform is a managed environments feature that has been released a while back now! Over time, it has improved significantly with updates like SPN support, deployment pages, extensibility, and personal pipelines. Many people requested more content on pipelines in Power Platform, so we created a new learning path: "Simplify Microsoft Power Platform Deployments by Using Pipelines." This path will help you: Modules in the learning path To support your learning, we are launc... Jan 14, 2025 0 4 Announcing Powerful Devs Conference + Hack Together 2025 April Dunnam We are excited to invite you to participate in this year’s Powerful Devs Conference + Hackathon, commencing on February 12, 2025. The conference will be followed by a two-week Hack Together, ending on February 28, 2025. Join us to unleash your creativity and build innovation solutions! Jan 9, 2025 0 2 Exploring the Essentials: Building Basics with Microsoft Copilot Studio Elaiza Benitez Exploring the Essentials: Building Basics with Microsoft Copilot Studio Don’t know how to start with building an agent in Microsoft Copilot Studio? We’ve got you covered! In our AI in Action: Building with Copilot Studio series on the Microsoft Power Platform YouTube channel, we have several episodes that guide you through how to get started in building an agent. In this series we showcase the different capabilities of building agents with Copilot Studio, which includes building, testing, deploying, analyzing, security and data loss prevention policy. This blog post will cover the building basics with Microso... Oct 28, 2024 1 1 Automate Power Platform Environment Creation & Solution Imports with GitHub Actions (Federated Auth Setup) Anuj Goyal Automate Power Platform Environment Creation & Solution Imports with GitHub Actions (Federated Auth Setup) Automating your CI/CD pipeline for Power Platform solutions streamlines development and reduces manual tasks. Integrating GitHub Actions with federated authentication provides secure and scalable access for creating environments, importing solutions, and even cleaning up temporary environments. This post guides you through automating these tasks with a federated authentication setup. Introduction This guide details how to automate Power Platform environment creation and solution import using GitHub ... Aug 29, 2024 0 0 We are deprecating earlier versions of Visual Studio for Dynamics 365 for Finance and Operations development Peter Villadsen Abstract Microsoft will no longer be shipping or supporting the Visual Studio extensions supporting development work against Dynamics 365 for Finance and Operations, and for the Power Platform tools, for Visual Studio versions other than Visual Studio 2022. What will change? We have supported older versions of Visual Studio for our extension that includes the project system, the X++ compiler, and so on for a long time, but we have made the decision to not support those earlier versions in the future. We will no longer ship the VSIX files for those versions, and you will not find those versions installe... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Power AppsPower Platform CLIPower PlatformAIFusion developmentPower Platform DeveloperCopilot StudioCode-firstALMSolutions Top BloggersDaniel LaskewitzSenior Power Platform AdvocateGomolemo MohapiPower Apps Cloud AdvocatePeter VilladsenElaiza BenitezAnuj GoyalPrincipal Software Engineer Relevant LinksExplore Guided Training Embrace the Low Code Revolution Join the Community Archive February 2025 January 2025 October 2024 August 2024 July 2024 June 2024 April 2024 February 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 July 2023 June 2023 May 2023 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-overlay'); const masonryContainer = document.querySelector('.masonry-container'); // Check the initial post count const initialPosts = masonryContainer.querySelectorAll('.masonry-card'); // Adjust selector if needed if (initialPosts.length < 8) { loadMoreButton.style.display = 'none'; // Hide "Load More" button if 8 or fewer posts } // Add a click event listener for the "Load More" button loadMoreButton.addEventListener('click', function () { currentPage++; // Increment page number const currentBlogId = loadMoreButton.getAttribute('data-siteid'); loadMoreButton.style.display = 'none'; // Hide "Load More Posts" text // Prepare data to send in the POST request const data = new FormData(); data.append('action', 'evo_pagination_load_more'); data.append('site_id', currentBlogId); data.append('paged', currentPage); // Show the preloader loaderOverlay.style.display = 'block'; // Perform the AJAX request using fetch API fetch(devblogs_ajax_evo.ajaxurl, { method: 'POST', body: data }) .then(response => response.json()) .then(res => { // Append new items to the masonry container const tempDiv = document.createElement('div'); tempDiv.innerHTML = res.html; const newItems = tempDiv.children; Array.from(newItems).forEach(item => { item.classList.add('hidden'); // Add the 'hidden' class initially masonryContainer.appendChild(item); // Use CSS transition after appending the item setTimeout(() => { item.classList.remove('hidden'); // Trigger the CSS transition }, 100); }); // Show the masonry container after the items are added masonryContainer.style.opacity = 1; // **Re-initialize Gifffer after new items are added** setTimeout(() => { if (typeof Gifffer === 'function') { Gifffer(); // Reinitialize Gifffer for new images } }, 300); // Delay to ensure new elements are in the DOM // Show the "Load More Posts" button again only if there are more '''
