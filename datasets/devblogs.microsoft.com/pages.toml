ther than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens