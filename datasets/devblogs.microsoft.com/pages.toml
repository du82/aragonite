full_description = '''Dev BlogsDirectX Developer Blog /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } DirectX Developer BlogThe latest news on Microsoft's Graphics and Display technology Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = false; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Jan 30, 2025 0 0 Agility SDK 1.716.0-preview: New D3D12 Video Encode Features Sil Vilerino Today DirectX 12 provides APIs to support GPU video encode acceleration for several applications, as detailed in D3D12 Video Encoding - Windows drivers | Microsoft Learn previous blog posts such as Announcing new DirectX 12 feature - Video Encoding! - DirectX Developer Blog. In this blog post we’re happy to announce a series of new features included in the Agility SDK 1.716.0-preview that provide more control to apps using the D3D12 Video Encode API. These new features help reduce latency and improve quality in several scenarios. New feature list Let’s take a look at each of t... Jan 30, 2025 0 0 Agility SDK 1.716.0-preview & 1.615-retail: Shader hash bypass Amanda,Amar The D3D runtime as of 1.615 officially supports applications opting to bypass shader hash validation. The historical purpose of the hash that the DX shader compiler embeds in every shader binary was to give the D3D runtime to confidence that shaders being given to it are well formed. The assumption was that a hashed shader likely came from an official compiler that ran its validator run on the code, and also that there was no memory corruption after that. These assumptions still apply by default. Meaning most developers that just want to use DXC to compile shaders and pass them to D3D can continue to do so,... Jan 30, 2025 0 2 AgilitySDK 1.716.0-preview and 1.615-retail Amanda,Tanner We are pleased to announce both a retail release of Shader hash bypass and a preview AgilitySDK release with several new features, available on Agility SDK Downloads today! You can find detailed information about all the features on the individual blog pages: Jan 27, 2025 0 0 Agility SDK 1.716.0-preview: Application Specific Driver State Henchhing Limbu Today we’re excited to announce the release of a new D3D12 feature: Application Specific Driver State. This feature is intended to be used by capture/replay tools, such as PIX on Windows, to help with issues caused by “app detect” behavior. Background D3D12 drivers occasionally have to perform workarounds for bugs in specific applications. For example, this may occur if an older game shipped with a bug that only affects a new generation of GPUs. The driver may be forced to detect when the application is running and then perform an application-specific workaround for the bug. This behavior is often called "app d... Jan 23, 2025 0 1 Agility SDK 1.716.0-preview: Recreate At GPUVA Roland Shum New Recreate At GPUVA Feature After months of effort from both our hardware partners and us, the D3D12 team is happy to announce the preview of the Recreate At GPUVA feature as part of its Agility SDK Downloads 1.716 release. This feature is mostly intended to be used by tooling developers, such as PIX, to simplify capturing and replaying of GPU workloads. The Problem: Resource allocation behaves much like malloc in C, there are no guarantees about what memory address is given to the caller. Within a single process this is usually fine, until the application starts recording these addresses into buffers and us... Jan 6, 2025 0 5 Enabling Neural Rendering in DirectX: Cooperative Vector Support Coming Soon Cassie,Serena Neural Rendering: A New Paradigm in 3D Graphics Programming In the constantly advancing landscape of 3D graphics, neural rendering technology represents a significant evolution. Neural rendering broadly defines the suite of techniques that leverage AI/ML to dramatically transform traditional graphics pipelines. These new methods promise to push the boundaries of what’s possible in real-time graphics. DirectX is committed to cross-platform enablement of neural rendering techniques, and cooperative vectors are at the core of this initiative. We are excited to share our plans to add cooperative vector support to... Dec 17, 2024 0 2 Agility SDK 1.716.0-preview: Tight Alignment of Resources Tanner Van De Walle We’re pleased to announce that we have a new preview Agility SDK out today, letting developers try out the new Tight Alignment feature! You can find the NuGet package here. Background When placed resources were introduced in D3D12, there was an intentional decision to simplify alignment restrictions and take the greatest common denominator across the hardware ecosystem. There was a desire to migrate to tighter alignment across the ecosystem over time, but this hadn't happened yet. Since D3D12's launch, developers have noticed that it is actually pretty common to have numerous tiny resources (meaningfull... Oct 23, 2024 2 2 DirectSR Preview: Now Supporting AMD FidelityFX™ Super Resolution (FSR) 3.1 Upscaler Norman Chen Following our initial announcement of the DirectSR preview, we are pleased to share an update. DirectSR, our standardized super resolution (SR) API for D3D12 titles, now supports FSR 3.1 (upscaler-only), bringing enhanced upscaling capabilities to further improve your gaming experience. Learn more about FSR 3.1 here. What’s New with FSR 3.1? With this update, developers can leverage FSR 3.1 upscaler alongside other leading SR technologies like Intel XeSS and NVIDIA DLSS Super Resolution through DirectSR’s common interface. This ensures a consistent and high-quality gaming experience across various hardware conf... Sep 19, 2024 8 12 DirectX Adopting SPIR-V as the Interchange Format of the Future Chris,Cassie Today the Direct3D and HLSL teams are excited to share some insight into the next big step for GPU programmability. Once Shader Model 7 is released, DirectX 12 will accept shaders compiled to SPIR-V™. The HLSL team is committed to open development processes and collaborating with The Khronos® Group and LLVM Project. We’re sharing this information at the beginning of our multi-year development process so that we can be transparent about this transition from the start. We are working with the Khronos SPIR™ and Vulkan® working groups to ensure that this transition benefits the whole development ecosystem. Embracing... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics DirectXDirect3D12DirectX12GamingGraphicsdirect3dDirectX 12PC GamingNvidiaD3D12 Relevant LinksDirectX Landing Page @DirectX12 (Twitter) DirectX Discord server DirectX-Specs (GitHub) DirectX-Graphics-Samples (GitHub) DirectX 12 and Graphics Education (YouTube) PIX on Windows (Performance tuning and debugging for DirectX 12) Top BloggersChris BienemanCompiler EngineerJoshua TuckerAmar PatelEngineer Archive January 2025 December 2024 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 March 2024 February 2024 December 2023 November 2023 September 2023 August 2023 June 2023 May 2023 April 2023 March 2023 February 2023 January 2023 December 2022 November 2022 October 2022 September 2022 July 2022 June 2022 May 2022 April 2022 March 2022 February 2022 January 2022 December 2021 October 2021 August 2021 July 2021 June 2021 April 2021 March 2021 January 2021 November 2020 October 2020 September 2020 August 2020 June 2020 May 2020 March 2020 January 2020 December 2019 November 2019 October 2019 September 2019 August 2019 July 2019 June 2019 May 2019 April 2019 March 2019 February 2019 January 2019 October 2018 April 2018 March 2018 November 2017 July 2017 March 2017 January 2017 July 2016 May 2016 October 2015 July 2015 May 2015 April 2015 March 2015 Febr'''
