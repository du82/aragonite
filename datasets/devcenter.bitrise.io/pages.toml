["https://devcenter.bitrise.io/en/api/authenticating-with-the-bitrise-api.html"]
title = "Authenticating with the Bitrise API - Bitrise Docs"
description = "You need to create a personal access token to authenticate with the Bitrise API. The token is needed for all endpoints."
full_description = '''Home API Authenticating with the Bitrise API Authenticating with the Bitrise API Abstract You need to create a personal access token to authenticate with the Bitrise API. The token is needed for all endpoints. The current API supports two types of authentication: User-generated personal access tokens. Workspace API tokens. Every API endpoint requires authentication, except the “root” URL (https://api.bitrise.io). Create either a personal access token or a Workspace API token. Save it in a secure way. Add an Authorization header with the access token to your API calls. For example, the following call retrieves a list of apps you or your Workspace has access to: curl -X 'GET' \ 'https://api.bitrise.io/v0.1/apps' \ -H 'Authorization: <ACCESS-TOKEN>' -H 'accept: application/json' In this section: See also: Personal access tokens Workspace groups Managing the owners of a workspace Workspace API token'''
