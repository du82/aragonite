full_description = "Home Projects Projects Abstract Projects are the main building blocks of your Bitrise experience: a Git repository that stores source code is added to Bitrise as a project. Projects are the main building blocks of your Bitrise experience: a Git repository that stores source code is added to Bitrise as a project. As such, a Bitrise project isn't necessarily an actual mobile app: it's just the code on which you run builds with Bitrise. Once you have access to a Workspace, you can start adding and managing projects. You can configure pretty much every aspect of your project at any time after the initial setup. Among other things, you can: Change your project's repository URL. Setting up service credentials. Update your project's SSH keys. Register new webhooks and update existing ones. The users invited to work on a Bitrise project make up the project's team. You can invite users individually, or assign Workspace groups to projects. The same user or the same Workspace group can have different roles on different project teams. In this section:"
