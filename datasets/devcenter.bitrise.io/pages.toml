["https://devcenter.bitrise.io/en/apps/public-apps.html"]
title = "Public projects - Bitrise Docs"
description = "To create a public project, simply add a new project to Bitrise and at the start of the process, set the privacy of the project to Public. If your Bitrise project is public, anyone who has the build URL can see the build logs."
full_description = "Home Projects Public projects Public projects Abstract To create a public project, simply add a new project to Bitrise and at the start of the process, set the privacy of the project to Public. If your Bitrise project is public, anyone who has the build URL can see the build logs. Open source projects are great - we all love them! They can be a pain to maintain, however, especially with CI/CD in the picture. That’s why we have introduced the Public projects feature for Bitrise: to make everyone’s life a lot easier! If your Bitrise project is public, anyone who has the build URL can see the build logs. For example, if the CI status check on GitHub fails on a pull request, anyone can click on the build URL and view the build logs. To create a public project, simply add a new project to Bitrise and at the start of the process, set the privacy of the project to Public. Can't modify privacy later You can't change this setting later! Once you've added an project as a public project, you can't set it back to private. You would have to add the project again. When you have a public project, outside contributors can troubleshoot issues easier, find out why, for example, a pull request of theirs resulted in a failed build. They do not have to be invited to a Bitrise team to be able to view Bitrise logs and they do not need the help of a Bitrise team member, either. Of course, this does not mean anyone can do anything with your public project on Bitrise. If the user viewing the logs is not invited to work on the project in some role, they will only be able to: View the build logs. Download the build logs. View the build’s bitrise.yml file. Public project’s build logs are available for anyone Remember: a public project’s build logs and bitrise.yml file can be seen by anyone - make sure these files do not expose anything you do not want to be seen! In this section:"
year_published = 2025
clearnet = "https://devcenter.bitrise.io/en/apps/public-apps.html"
