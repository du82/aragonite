["https://devcenter.bitrise.io/en/builds.html"]
title = "Builds - Bitrise Docs"
description = "A Bitrise build is specified by the project’s Workflow which is a collection of Steps. The project’s build configuration can be modified in the bitrise.yml file or in the graphical Workflow Editor."
full_description = "Home Builds Builds Abstract A Bitrise build is specified by the project’s Workflow which is a collection of Steps. The project’s build configuration can be modified in the bitrise.yml file or in the graphical Workflow Editor. A Bitrise build is a series of jobs, specified by the project’s Workflow which is a collection of Steps. The project’s build configuration is specified in the bitrise.yml configuration file which you can modify in bitrise.io’s graphical Workflow Editor or locally. The file can be stored on bitrise.io or in your app's Git repository. When a build is running, the scripts that define the Steps will be executed in the order you’ve defined in your Workflow, with the input parameters you set. They can produce multiple different outputs that other Steps can use, including but not limited to executable binaries, screenshots, test reports, variables, and so on. The build process is the following: Starting the build, either manually or by an automatic trigger. Environment preparation: A virtual machine will be provisioned and prepared to run the build. Build specific Environment Variables are preset so you can use these in your Steps. You can find more information about the available stacks in the Workflow Editor, on the Stack tab. Workflow execution: Steps in Workflows are executed in the same order as defined in the Workflow Editor of your application, from top to bottom. You can reorder the Steps by dragging them around. The log each Step generates will be displayed on the build’s details page. Cleanup: After the execution of the build, a build log is created and stored on the Bitrise server. The virtual machine running the build is destroyed so your code/files will never fall into the wrong hands. Build retention for 200 days On the Builds page of your app, we only show builds from the last 200 days. The same limit applies if you are searching for specific builds on the page. This limitation also applies to most API calls: the GET/apps/{app-slug}/builds endpoint and related endpoints can only return builds from the last 200 days. However, there are two methods to get a build that is older than 200 days: If you know the exact build URL, you can access the build. You can use the GET/apps/{app-slug}/archived-builds API endpoint: Listing the archived builds of an app. After the build has finished, users can be notified via email, or you can set up your own Slack integration, for example. In this section: A Workflow is a collection of Steps, Environment Variables, and other configurations. When Bitrise starts a build, it runs one or more Workflows according to the configuration defined in the bitrise.yml file. A Step is a block of script execution that encapsulates a build task on Bitrise: the code to perform that task, the inputs and parameters you can define for the task, and the outputs the task generates. appprojecttriggerapplicationappappappprojectstack"
