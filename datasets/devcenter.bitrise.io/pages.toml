["https://devcenter.bitrise.io/en/accounts/resetting-your-password.html"]
title = "Resetting your password - Bitrise Docs"
description = "If you forgot your password, you can reset it by clicking on the Forgot your Password on the Bitrise Login page. You will receive an email with further instructions."
full_description = "Home Accounts Resetting your password Resetting your password Abstract If you forgot your password, you can reset it by clicking on the Forgot your Password on the Bitrise Login page. You will receive an email with further instructions. You can log into Bitrise in many ways: with your Bitrise username and password with your Gitlab/Github/Bitbucket account with your Bitrise Workspace name if SAML SSO has been set up to and enforced on it your Bitrise Workspace If you try to log in but you forgot your password: Click Forgot your password on our Login page. Provide your Email or Username so that we know where to send password recovery link. Check your inbox for the Reset password instructions sent by letsconnect. Click Reset Password or copy the URL into your browser. Add your new password and hit Save. Once your password has been changed, click Log in to access our login page again. Add your Username and new Password to log into your Bitrise Dashboard. If you failed to log in for the third time, reCAPTCHA will get enabled to check if you are a human. If you failed to log in for an excessive amount of attempts, you will automatically get locked out. Check your inbox for our Unlock Instructions email! In this section:"
year_published = 2025
