["https://devcenter.bitrise.io/en/bitrise-cli/installing-and-updating-the-bitrise-cli.html"]
title = "Installing and updating the Bitrise CLI - Bitrise Docs"
description = "The Bitrise CLI is distributed as a single binary for macOS and Linux. You can download it using curl or Homebrew."
full_description = "Home Bitrise CLI Installing and updating the Bitrise CLI Installing and updating the Bitrise CLI Abstract The Bitrise CLI is distributed as a single binary for macOS and Linux. You can download it using curl or Homebrew. The Bitrise CLI is distributed as a single binary for macOS and Linux. You can download it using curl or Homebrew. Installing the Bitrise CLI with curl Run the following command in a bash shell: curl -fL https://github.com/bitrise-io/bitrise/releases/latest/download/bitrise-$(uname -s)-$(uname -m) > /usr/local/bin/bitrise You can check the latest release of the Bitrise CLI on its releases page. Make the downloaded binary executable: chmod +x /usr/local/bin/bitrise Run bitrise setup. This will verify if everything that is required for Bitrise to run is installed and available. If you skip this, the CLI will perform the setup anyway the first time you call bitrise run. Installing the Bitrise CLI with Homebrew If you have the Homebrew package manager installed on your Mac, you can use it to install the Bitrise CLI. Open the Terminal app on your Mac and run: brew update && brew install bitrise Run bitrise setup. This will verify if everything that is required for Bitrise to run is installed and available. If you skip this, the CLI will perform the setup anyway the first time you call bitrise run. Updating the Bitrise CLI Updating the Bitrise CLI is easy, and it doesn’t matter if you installed it with Homebrew or from the GitHub release. Simply run bitrise update - that’s it! The CLI checks for updates once every day and notifies you as soon as there is a new version. In this section:"
