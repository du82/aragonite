title = "Accounts - Bitrise Docs"
description = "When you sign up for Bitrise, you create your own individual user account. By itself, having a user account isn’t enough to add apps and run builds. For that, you must be part of a Workspace."
full_description = "Home Accounts Accounts Abstract When you sign up for Bitrise, you create your own individual user account. By itself, having a user account isn’t enough to add apps and run builds. For that, you must be part of a Workspace. Your Bitrise account is managed from your account page. From this page, you can: Edit your profile, including username, email address, password, and avatar. Enable two-factor authentication. Find all Workspaces that you're a part of. Create and manage personal access tokens used to access the Bitrise API. Register test devices. Can't run builds yet! When you sign up for Bitrise, you create your own individual user account. By itself, having a user account isn’t enough to add apps and run builds. To be able to work on Bitrise, you need at least one of three options: Creating a Workspace. Get invited to an existing Workspace.Workspace groups Get added as an outside contributor to an app’s team. In this section: A Workspace is an environment that allows you to manage your Bitrise apps and the team members working on the apps. You can create multiple Workspaces, and you can be invited to Workspaces by other Bitrise users. To be able to add apps and run builds, you either need to be part of a Workspace, or you have to be an outside contributor on an app's team. apps"
