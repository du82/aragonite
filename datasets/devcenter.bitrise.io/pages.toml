["https://devcenter.bitrise.io/en/bitrise-cli/installing-and-upgrading-the-offline-workflow-editor.html"]
title = "Installing and upgrading the offline Workflow Editor - Bitrise Docs"
full_description = "Home Bitrise CLI Installing and upgrading the offline Workflow Editor Installing and upgrading the offline Workflow Editor Bitrise Workflow Editor is designed in such a way that you can run it offline on your Mac/PC without having to log into bitrise.io. The Workflow Editor is open source, you can find its repository here. You can also join the discussion around Workflow Editor here. Installing the offline Workflow Editor to your computer Install the Bitrise CLI. Make sure you have Go installed on your local computer. Run bitrise setup to install offline Workflow Editor as part of the Bitrise Plugins. Running bitrise setup also checks if Bitrise Core tools, OS X tools, Bitrise Plugins and Toolkits are installed on your local machine. If not, the command will automatically install them. Starting the offline Workflow Editor cd into a directory where you have your bitrise.yml. Run bitrise :workflow-editor command to start your offline session. Here is the overall look and feel: Upgrading Workflow Editor version You can upgrade to the latest version of the Workflow Editor by running bitrise plugin update workflow-editor command. In this section:"
year_published = 2025
