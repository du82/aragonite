["https://devcenter.heroku.com/articles/getting-started-with-ruby"]
title = "Getting Started on Heroku with Ruby | Heroku Dev Center"
description = "A step-by-step guide for deploying your first Ruby app and mastering the basics of Heroku"
full_description = '''Getting Started on Heroku with Ruby Introduction Complete this tutorial to deploy a sample Ruby app to Cedar, the legacy generation of the Heroku platform. To deploy the app to the Fir generation, only available to Heroku Private Spaces, follow this guide instead. The tutorial assumes that you have: A verified Heroku Account Ruby 3.2.4 installed locally - see the installation guides for Ruby and Rails on OS X, Windows, and Linux Bundler installed locally - run gem install bundler Postgres installed locally An Eco dynos plan subscription (recommended) If you’re running Windows, consider following Getting Started with Ruby on Heroku (Microsoft Windows) instead. If you don’t follow the Windows guide, you can’t run bundle install as you must manually install OpenSSL and the Puma web server. First, download OpenSSL. Next, extract the lzma download with 7Zip, and then extract the tar file to C:\openssl. Verify the file is in the correct location: $ dir c:\openssl bin include lib ssl Now run: $ gem install puma -- --with-opt-dir=c:\openssl After this command finishes, run: $ bundle update puma Using dynos and databases to complete this tutorial counts towards your usage. We recommend using our low-cost plans to complete this tutorial. Eligible students can apply for platform credits through our new Heroku for GitHub Students program. Set Up Install the Heroku Command Line Interface (CLI). Use the CLI to manage and scale your app, provision add-ons, view your logs, and run your app locally. The Heroku CLI requires Git, the popular version control system. If you don’t already have Git installed, complete the following before proceeding: Git installation First-time Git setup Download and run the installer for your platform: macOS Install Homebrew and run: $ brew tap heroku/brew && brew install heroku Windows Download the appropriate installer for your Windows installation: 64-bit installer 32-bit installer You can find more installation options for the Heroku CLI here. After installation, you can use the heroku command from your command shell. On Windows, start the Command Prompt (cmd.exe) or Powershell to access the command shell. To log in to the Heroku CLI, use the heroku login command: $ heroku login heroku: Press any key to open up the browser to login or q to exit: Opening browser to https://cli-auth.heroku.com/auth/cli/browser/*** heroku: Waiting for login... Logging in... done Logged in as me@example.com This command opens your web browser to the Heroku login page. If your browser is already logged in to Heroku, click the Log In button on the page. This authentication is required for the heroku and git commands to work correctly. If you have any problems installing or using the Heroku CLI, see the main Heroku CLI article for advice and troubleshooting steps. If you’re behind a firewall that uses a proxy to connect with external HTTP/HTTPS services, set the HTTP_PROXY or HTTPS_PROXY environment variables in your local development environment before running the heroku command. Clone the Sample App If you’re new to Heroku, it’s recommended that you complete this tutorial using the Heroku-provided sample application. If you have an existing application you want to deploy, follow this article instead. Clone the sample application so that you have a local version of the code. Execute these commands in your local command shell or terminal: $ git clone https://github.com/heroku/ruby-getting-started.git $ cd ruby-getting-started You now have a functioning git repository that contains a simple application. It includes a Gemfile file, which Ruby’s dependency manager, bundler, uses to install dependencies. Define a Procfile Use a Procfile, a text file in the root directory of your application, to explicitly declare what command to execute to start your app. The Procfile in the example app looks like this: web: bundle exec puma -C config/puma.rb This Procfile declares a single process type, web, and the command needed to run it. The name web is important here. It declares that this process type is attached to Heroku’s HTTP routing stack and receives web traffic when deployed. The command used here runs Puma, the web server, and passes in a configuration file. A Procfile can contain additional process types. For example, you can declare a background worker process that processes items off a queue. Create Your App Using a dyno and a database to complete this tutorial counts towards your usage. Delete your app, and database as soon as you’re done to control costs. Apps use Eco dynos if you’re subscribed to Eco by default. Otherwise, it defaults to Basic dynos. The Eco dynos plan is shared across all Eco dynos in your account. It’s recommended if you plan on deploying many small apps to Heroku. Learn more here. Eligible students can apply for platform credits through our Heroku for GitHub Students program. Create an app on Heroku to prepare the platform to receive your source code: $ heroku create Creating app... done, ⬢ polar-inlet-4930 http://polar-inlet-4930.herokuapp.com/ | https://git.heroku.com/polar-inlet-4930.git When you create an app, a git remote called heroku is also created and associated with your local git repository. Git remotes are versions of your repository that live on other servers. You deploy your app by pushing its code to that special Heroku-hosted remote associated with your app. Heroku generates a random name for your app, in this case, polar-inlet-4930. You can specify your own app name. Provision a Database The sample Rails app requires a database. Provision a Heroku Postgres database, one of the add-ons available through the Elements Marketplace. Add-ons are cloud services that provide out-of-the-box additional services for your application, such as logging, monitoring, databases, and more. An essential-0 Postgres size costs $5 a month, prorated to the minute. At the end of this tutorial, we prompt you to delete your database to minimize costs. $ heroku addons:create heroku-postgresql:essential-0 Creating heroku-postgresql:essential-0 on ⬢ polar-inlet-4930... ~$0.007/hour (max $5/month) Database should be available soon postgresql-encircled-75487 is being created in the background. The app will restart when complete... Use heroku addons:info postgresql-encircled-75487 to check creation progress Use heroku addons:docs heroku-postgresql to view documentation Your Heroku app can now access this Postgres database. The DATABASE_URL environment variable stores your credentials, which Rails connects to by convention. You can see all the add-ons provisioned with the addons command: $ heroku addons Add-on Plan Price State ────────────────────────────────────────────── ─────────── ──────── ─────── heroku-postgresql (postgresql-encircled-75487) essential-0 $5/month created └─ as DATABASE The table above shows add-ons and the attachments to the current app (polar-inlet-4930) or other apps. Deploy the App Using a dyno to complete this tutorial counts towards your usage. Delete your app as soon as you’re done to control costs. Deploy your code. This command pushes the main branch of the sample repo to your heroku remote, which then deploys to Heroku: $ git push heroku main Enumerating objects: 524, done. Counting objects: 100% (524/524), done. Delta compression using up to 16 threads Compressing objects: 100% (284/284), done. Writing objects: 100% (524/524), 127.49 KiB | 63.75 MiB/s, done. Total 524 (delta 210), reused 523 (delta 210), pack-reused 0 remote: Compressing source files... done. remote: Building source: remote: remote: -----> Building on the Heroku-22 stack remote: -----> Determining which buildpack to use for this app remote: ! Warning: Multiple default buildpacks reported the ability to handle this app. The first buildpack in the list below will be used. remote: Detected buildpacks: Ruby,Node.js remote: See https://devcenter.heroku.com/articles/buildpacks#buildpack-detect-order remote: -----> Ruby app detected remote: -----> Installing bundler 2.3.25 remote: -----> Removing BUNDLED WITH version in the Gemfile.lock remote: -----> Compiling Ruby/Rails remote: -----> Using Ruby version: ruby-3.2.4 remote: -----> Installing dependencies using bundler 2.5.6 remote: Running: BUNDLE_WITHOUT='development:test' BUNDLE_PATH=vendor/bundle BUNDLE_BIN=vendor/bundle/bin BUNDLE_DEPLOYMENT=1 bundle install -j4 ... remote: -----> Detecting rake tasks remote: -----> Preparing app for Rails asset pipeline remote: Running: rake assets:precompile ... remote: Asset precompilation completed (1.93s) remote: Cleaning assets remote: Running: rake assets:clean remote: -----> Detecting rails configuration remote: remote: remote: -----> Discovering process types remote: Procfile declares types -> web remote: Default types for buildpack -> console, rake remote: remote: -----> Compressing... remote: Done: 82.1M remote: -----> Launching... remote: Released v6 remote: https://polar-inlet-4930.herokuapp.com/ deployed to Heroku remote: remote: Verifying deploy... done. To https://git.heroku.com/polar-inlet-4930.git * [new branch] main -> main The application is now deployed. Visit the app at the URL shown in the logs. As a handy shortcut, you can also open the website as follows: $ heroku open View Logs Heroku treats logs as streams of time-ordered events, aggregated from the output streams of all your app and Heroku components. Heroku provides a single stream for all events. View information about your running app by using one of the logging commands, heroku logs --tail: $ heroku logs --tail 2023-03-01T20:35:41.251666+00:00 heroku[web.1]: Starting process with command `bundle exec puma -C config/puma.rb` 2023-03-01T20:35:42.338830+00:00 app[web.1]: [2] Puma starting in cluster mode... 2023-03-01T20:35:42.338853+00:00 app[web.1]: [2] * Puma version: 6.4.2 (ruby 3.2.4-p170) ("The Eagle of Durango") 2023-03-01T20:35:42.338854+00:00 app[web.1]: [2] * Min threads: 5 2023-03-01T20:35:42.338877+00:00 app[web.1]: [2] * Max threads: 5 2023-03-01T20:35:42.338888+00:00 app[web.1]: [2] * Environment: production 2023-03-01T20:35:42.338908+00:00 app[web.1]: [2] * Master PID: 2 2023-03-01T20:35:42.338925+00:00 app[web.1]: [2] * Workers: 2 2023-03-01T20:35:42.338951+00:00 app[web.1]: [2] * Restarts: (✔) hot (✖) phased 2023-03-01T20:35:42.338968+00:00 app[web.1]: [2] * Preloading application 2023-03-01T20:35:45.603105+00:00 app[web.1]: [2] * Listening on http://0.0.0.0:41385 2023-03-01T20:35:45.603195+00:00 app[web.1]: [2] Use Ctrl-C to stop 2023-03-01T20:35:45.610050+00:00 app[web.1]: [2] - Worker 0 (PID: 6) booted in 0.0s, phase: 0 2023-03-01T20:35:45.610915+00:00 app[web.1]: [2] - Worker 1 (PID: 9) booted in 0.0s, phase: 0 2023-03-01T20:35:45.758375+00:00 heroku[web.1]: State changed from starting to up To see more log messages generate, visit your application in the browser first. To stop streaming the logs, press Control+C. Scale the App After deploying the sample app, it automatically runs on a single web dyno. Think of a dyno as a lightweight container that runs the command specified in the Procfile. You can check how many dynos are running by using the ps command: $ heroku ps === web (Eco): `bundle exec puma -C config/puma.rb` web.1: up 2023/03/01 11:28:21 (~ 4m ago) Scaling an application on Heroku is equivalent to changing the number of running dynos. Scale the number of web dynos to zero: $ heroku ps:scale web=0 Access the app again by hitting refresh in your browser, or heroku open to open it in a web tab. You get an error message because you no longer have web dynos available to serve requests. Scale it up again: $ heroku ps:scale web=1 By default, apps use Eco dynos if you’re subscribed to Eco. Otherwise, it defaults to Basic dynos. The Eco dynos plan is shared across all Eco dynos in your account and is recommended if you plan on deploying many small apps to Heroku. Eco dynos sleep if they don’t receive any traffic for half an hour. This sleep behavior causes a few seconds delay for the first request upon waking. Eco dynos consume from a monthly, account-level quota of eco dyno hours. As long as you haven’t exhausted the quota, your apps can continue to run. To avoid dyno sleeping, upgrade to a Basic or higher dyno type as described in the Dyno Types article. Upgrading to at least Standard dynos allows you to scale up to multiple dynos per process type. Declare App Dependencies Heroku recognizes an app as a Ruby app by the existence of a Gemfile file in the root directory. The demo app you deployed already has a Gemfile, and it looks something like this: source 'https://rubygems.org' ruby '>= 3.1', '< 3.4' # Bundle edge Rails instead: gem 'rails', github: 'rails/rails' gem 'rails', '~> 7.0.4.2' # Use postgresql as the database for Active Record gem 'pg', '~> 1.3.5' # Use SCSS for stylesheets gem 'sass-rails' # Use Uglifier as compressor for JavaScript assets gem 'uglifier' ... The Gemfile file specifies the dependencies to install with your application. It also determines the version of Ruby used to run your application on Heroku. When an app deploys, Heroku reads this file and installs the appropriate Ruby version and dependencies using the bundle install command. To run the app locally, you must also install dependencies locally. This Gemfile dependency pg only resolves if you have Postgres installed locally. Install Postgres before you proceed. If the command which psql returns some value on your command line, Postgres is installed locally: $ which psql /usr/local/bin/psql Run bundle install in your local directory to install the dependencies, preparing your system for running the app locally: $ bundle install Using rake 13.0.6 Using concurrent-ruby 1.2.2 Using i18n 1.12.0 .... Using turbolinks 5.2.1 Using uglifier 4.2.0 Your bundle is complete! After installing dependencies, you can run your app locally. Run the App Locally Running apps locally in your own dev environment requires some effort. The sample app uses a database, so you must create the appropriate database and table locally using the rake task: $ bundle exec rake db:create db:migrate == 20140707111715 CreateWidgets: migrating ==================================== -- create_table(:widgets) -> 0.0076s == 20140707111715 CreateWidgets: migrated (0.0077s) =========================== Now start your application locally using the heroku local command, which is part of the Heroku CLI: $ heroku local web --port=5001 [OKAY] Loaded ENV .env File as KEY=VALUE Format 2:48:23 PM web.1 | [69541] Puma starting in cluster mode... 2:48:23 PM web.1 | [69541] * Puma version: 6.4.2 (ruby 3.2.4-p170) ("The Eagle of Durango") 2:48:23 PM web.1 | [69541] * Min threads: 5 2:48:23 PM web.1 | [69541] * Max threads: 5 2:48:23 PM web.1 | [69541] * Environment: development 2:48:23 PM web.1 | [69541] * Master PID: 69541 2:48:23 PM web.1 | [69541] * Workers: 2 2:48:23 PM web.1 | [69541] * Restarts: (✔) hot (✖) phased 2:48:23 PM web.1 | [69541] * Preloading application 2:48:24 PM web.1 | [69541] * Listenin'''
