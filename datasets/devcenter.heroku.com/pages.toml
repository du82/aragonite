["https://devcenter.heroku.com/articles/getting-started-with-scala"]
title = "Getting Started on Heroku with Scala and Play | Heroku Dev Center"
description = "A step-by-step guide for deploying your first Scala app and mastering the basics of Heroku"
full_description = '''Getting Started on Heroku with Scala and Play Introduction Complete this tutorial to deploy a sample Scala app to Cedar, the legacy generation of the Heroku platform. To deploy the app to the Fir generation, only available to Heroku Private Spaces, follow this guide instead. The tutorial assumes that you have: A verified Heroku Account OpenJDK 17 (or newer) installed sbt installed Postgres installed An Eco dynos plan subscription (recommended) Using dynos and databases to complete this tutorial counts towards your usage. We recommend using our low-cost plans to complete this tutorial. Eligible students can apply for platform credits through our new Heroku for GitHub Students program. Set Up Install the Heroku Command Line Interface (CLI). Use the CLI to manage and scale your app, provision add-ons, view your logs, and run your app locally. The Heroku CLI requires Git, the popular version control system. If you don’t already have Git installed, complete the following before proceeding: Git installation First-time Git setup Download and run the installer for your platform: macOS Install Homebrew and run: $ brew tap heroku/brew && brew install heroku Windows Download the appropriate installer for your Windows installation: 64-bit installer 32-bit installer You can find more installation options for the Heroku CLI here. After installation, you can use the heroku command from your command shell. On Windows, start the Command Prompt (cmd.exe) or Powershell to access the command shell. To log in to the Heroku CLI, use the heroku login command: $ heroku login heroku: Press any key to open up the browser to login or q to exit: Opening browser to https://cli-auth.heroku.com/auth/cli/browser/*** heroku: Waiting for login... Logging in... done Logged in as me@example.com This command opens your web browser to the Heroku login page. If your browser is already logged in to Heroku, click the Log In button on the page. This authentication is required for the heroku and git commands to work correctly. If you have any problems installing or using the Heroku CLI, see the main Heroku CLI article for advice and troubleshooting steps. If you’re behind a firewall that uses a proxy to connect with external HTTP/HTTPS services, set the HTTP_PROXY or HTTPS_PROXY environment variables in your local development environment before running the heroku command. Prepare the App If you’re new to Heroku, it’s recommended to complete this tutorial using the Heroku-provided sample application. If you have your own application that you want to deploy instead, see Preparing a Codebase for Heroku Deployment. Create a local copy of the sample app by executing the following commands in your local command shell or terminal: $ git clone https://github.com/heroku/scala-getting-started $ cd scala-getting-started This functioning Git repository contains a sample Scala application. It includes a build.sbt file, which is used by sbt, a Scala build tool. Create Your App Using a dyno and a database to complete this tutorial counts towards your usage. Delete your app, and database as soon as you’re done to control costs. Apps use Eco dynos if you’re subscribed to Eco by default. Otherwise, it defaults to Basic dynos. The Eco dynos plan is shared across all Eco dynos in your account. It is recommended if you plan on deploying many small apps to Heroku. Learn more here. Eligible students can apply for platform credits through our Heroku for GitHub Students program. To prepare Heroku to receive your source code, create an app: $ heroku create Creating app... done, ⬢ peaceful-inlet-84135 http://peaceful-inlet-84135.herokuapp.com/ | https://git.heroku.com/peaceful-inlet-84135.git When you create an app, a git remote called heroku is also created and associated with your local git repository. Git remotes are versions of your repository that live on other servers. You deploy your app by pushing its code to that special Heroku-hosted remote associated with your app. Heroku generates a random name for your app, in this case, peaceful-inlet-84135. You can specify your own app name. Define a Procfile Use a Procfile, a text file in the root directory of your application, to explicitly declare what command to execute to start your app. The Procfile in the example app looks like this: web: target/universal/stage/bin/scala-getting-started -Dhttp.port=${PORT} This Procfile declares a single process type, web, and the command needed to run it. The name web is important here. It declares that this process type is attached to Heroku’s HTTP routing stack and receives web traffic when deployed. A Procfile can contain additional process types. For example, you can declare a background worker process that processes items off a queue. Provision a Database The sample app requires a database. Provision a Heroku Postgres database, one of the add-ons available through the Elements Marketplace. Add-ons are cloud services that provide out-of-the-box additional services for your application, such as logging, monitoring, databases, and more. An essential-0 Postgres size costs $5 a month, prorated to the minute. Delete your database after completing this guide to minimize costs. $ heroku addons:create heroku-postgresql:essential-0 Creating heroku-postgresql:essential-0 on ⬢ peaceful-inlet-84135... ~$0.007/hour (max $5/month) Database should be available soon postgresql-fitted-70383 is being created in the background. The app will restart when complete... Use heroku addons:info postgresql-fitted-70383 to check creation progress Use heroku addons:docs heroku-postgresql to view documentation Your Heroku app now has access to a Postgres database. The DATABASE_URL environment variable stores the credentials. Heroku also automatically makes a JDBC_DATABASE_URL environment variable available for Scala applications. It contains a JDBC-compatible version of DATABASE_URL. You can see all the add-ons provisioned with the addons command: $ heroku addons Add-on Plan Price State ─────────────────────────────────────────── ─────────── ──────── ─────── heroku-postgresql (postgresql-fitted-70383) essential-0 $5/month created └─ as DATABASE Deploy the App Deploy your code. This command pushes the main branch of the sample repo to your heroku remote, which then deploys to Heroku: $ git push heroku main remote: Compressing source files... done. remote: Building source: remote: remote: -----> Building on the Heroku-22 stack remote: -----> Determining which buildpack to use for this app remote: -----> Play 2.x - Scala app detected remote: -----> Installing OpenJDK 17... done remote: -----> Priming Ivy cache... done remote: -----> Running: sbt compile stage remote: Downloading sbt launcher for 1.7.2: remote: From https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.7.2/sbt-launch-1.7.2.jar remote: To /tmp/scala_buildpack_build_dir/.sbt_home/launchers/1.7.2/sbt-launch.jar remote: Downloading sbt launcher 1.7.2 md5 hash: remote: From https://repo1.maven.org/maven2/org/scala-sbt/sbt-launch/1.7.2/sbt-launch-1.7.2.jar.md5 remote: To /tmp/scala_buildpack_build_dir/.sbt_home/launchers/1.7.2/sbt-launch.jar.md5 remote: /tmp/scala_buildpack_build_dir/.sbt_home/launchers/1.7.2/sbt-launch.jar: OK remote: [info] [launcher] getting org.scala-sbt sbt 1.7.2 (this may take some time)... remote: [info] [launcher] getting Scala 2.12.16 (for sbt)... remote: [info] welcome to sbt 1.7.2 (Azul Systems, Inc. Java 17.0.6) remote: [info] loading global plugins from /tmp/scala_buildpack_build_dir/.sbt_home/plugins remote: [info] compiling 1 Scala source to /tmp/scala_buildpack_build_dir/.sbt_home/plugins/target/scala-2.12/sbt-1.0/classes ... remote: [info] Non-compiled module 'compiler-bridge_2.12' for Scala 2.12.16. Compiling... remote: [info] Compilation completed in 15.389s. remote: [info] done compiling remote: [info] loading settings for project scala_buildpack_build_dir-build from plugins.sbt ... remote: [info] loading project definition from /tmp/