["https://devcenter.heroku.com/articles/getting-started-with-nodejs"]
title = "Getting Started on Heroku with Node.js | Heroku Dev Center"
description = "A step-by-step guide for deploying your first Node app and mastering the basics of Heroku"
full_description = '''Getting Started on Heroku with Node.js Introduction Complete this tutorial to deploy a sample Node.js app to Cedar, the legacy generation of the Heroku platform. To deploy the app to the Fir generation, only available to Heroku Private Spaces, follow this guide instead. The tutorial assumes that you have: A verified Heroku Account Node.js and npm installed locally An Eco dynos plan subscription (recommended) Using dynos to complete this tutorial counts towards your usage. To complete this tutorial, we recommend using our low-cost plans. Eligible students can apply for platform credits through our new Heroku for GitHub Students program. Set Up Install the Heroku Command Line Interface (CLI). Use the CLI to manage and scale your app, provision add-ons, view your logs, and run your app locally. The Heroku CLI requires Git, the popular version control system. If you don’t already have Git installed, complete the following before proceeding: Git installation First-time Git setup Download and run the installer for your platform: macOS Install Homebrew and run: $ brew tap heroku/brew && brew install heroku Windows Download the appropriate installer for your Windows installation: 64-bit installer 32-bit installer You can find more installation options for the Heroku CLI here. After installation, you can use the heroku command from your command shell. On Windows, start the Command Prompt (cmd.exe) or Powershell to access the command shell. To log in to the Heroku CLI, use the heroku login command: $ heroku login heroku: Press any key to open up the browser to login or q to exit: Opening browser to https://cli-auth.heroku.com/auth/cli/browser/*** heroku: Waiting for login... Logging in... done Logged in as me@example.com This command opens your web browser to the Heroku login page. If your browser is already logged in to Heroku, click the Log In button on the page. This authentication is required for the heroku and git commands to work correctly. If you have any problems installing or using the Heroku CLI, see the main Heroku CLI article for advice and troubleshooting steps. If you’re behind a firewall that uses a proxy to connect with external HTTP/HTTPS services, set the HTTP_PROXY or HTTPS_PROXY environment variables in your local development environment before running the heroku command. Before you continue, check that you have the prerequisites installed properly. Type each command below, and make sure that each one displays the version that you installed. (Your versions can be different from the example.) If no version is returned, install the prerequisites. To declare app dependencies and subsequent steps, you must complete this local setup. This tutorial works for any version of Node greater than 18. $ node --version v22.11.0 npm is installed with Node, so check that it’s there. If you don’t have it, install a more recent version of Node. $ npm --version 10.8.1 Now check that you have git installed. If not, install it, and test again. $ git --version git version 2.42.0 Prepare the App In this step, you prepare a sample application that’s ready to be deployed to Heroku. If you’re new to Heroku, we recommend that you complete this tutorial using the Heroku-provided sample application. However, if you have an existing application that you want to deploy instead, read this article to learn how to prepare it for Heroku deployment. To clone a local version of the sample application that you can then deploy to Heroku, execute these commands in your local command shell or terminal. $ git clone https://github.com/heroku/node-js-getting-started.git $ cd node-js-getting-started You now have a functioning Git repository that contains a simple application and a package.json file, which Node’s dependency manager uses. Deploy the app In this step, you deploy the app to Heroku. Using dynos to complete this tutorial counts towards your usage. To control costs, Delete your app as soon as you‘re done. By default, apps use Eco dynos if you’re subscribed to Eco. Otherwise, it defaults to Basic dynos. If you plan to deploy many small apps to Heroku, we recommend the Eco dynos plan, which is shared across all Eco dynos in your account. Learn more here. Eligible students can apply for platform credits through our Heroku for GitHub Students program. Create an app on Heroku, which prepares Heroku to receive your source code. $ heroku create Creating app... done, ⬢ shrouded-anchorage-35377 https://shrouded-anchorage-35377.herokuapp.com/ | https://git.heroku.com/shrouded-anchorage-35377.git When you create an app, you also create a Git remote called heroku. It’s associated with your local Git repository. Heroku generates a random name for your app, in this case shrouded-anchorage-35377. Or you can pass a parameter to specify your own app name. Deploy your code. $ git push heroku main Enumerating objects: 554, done. Counting objects: 100% (554/554), done. Delta compression using up to 20 threads Compressing objects: 100% (412/412), done. Writing objects: 100% (554/554), 248.74 KiB | 124.37 MiB/s, done. Total 554 (delta 109), reused 548 (delta 106), pack-reused 0 remote: Compressing source files... done. remote: Building source: remote: remote: -----> Building on the Heroku-22 stack remote: -----> Determining which buildpack to use for this app remote: -----> Node.js app detected remote: remote: -----> Creating runtime environment remote: remote: NPM_CONFIG_LOGLEVEL=error remote: NODE_VERBOSE=false remote: NODE_ENV=production remote: NODE_MODULES_CACHE=true remote: remote: -----> Installing binaries remote: engines.node (package.json): 22.x remote: engines.npm (package.json): unspecified (use default) remote: remote: Resolving node version 22.x... remote: Downloading and installing node 22.11.0... remote: Using default npm version: 10.8.1 remote: remote: -----> Installing dependencies remote: Installing node modules (package.json) remote: remote: added 160 packages, and audited 161 packages in 4s remote: remote: 64 packages are looking for funding remote: run `npm fund` for details remote: remote: found 0 vulnerabilities remote: remote: -----> Build remote: remote: -----> Caching build remote: - node_modules remote: remote: -----> Pruning devDependencies remote: remote: up to date, audited 74 packages in 450ms remote: remote: 9 packages are looking for funding remote: run `npm fund` for details remote: remote: found 0 vulnerabilities remote: remote: -----> Build succeeded! remote: -----> Discovering process types remote: Procfile declares types -> web remote: remote: -----> Compressing... remote: Done: 43.4M remote: -----> Launching... remote: Released v3 remote: https://shrouded-anchorage-35377.herokuapp.com/ deployed to Heroku remote: remote: Verifying deploy... done. To https://git.heroku.com/shrouded-anchorage-35377.git * [new branch] main -> main Ensure that at least one instance of the app is running. $ heroku ps:scale web=1 Visit the app at the URL generated by its app name. As a shortcut, you can open the website. $ heroku open View Logs Heroku treats logs as streams of time-ordered events aggregated from the output streams of all your app and Heroku components, providing a single channel for all of the events. View information about your running app using one of the logging commands, heroku logs --tail: $ heroku logs --tail 2023-03-02T19:56:09.671017+00:00 heroku[web.1]: Starting process with command `npm start` 2023-03-02T19:56:12.617099+00:00 app[web.1]: 2023-03-02T19:56:12.617126+00:00 app[web.1]: > node-js-getting-started@0.3.0 start 2023-03-02T19:56:12.617127+00:00 app[web.1]: > node index.js 2023-03-02T19:56:12.617127+00:00 app[web.1]: 2023-03-02T19:56:12.738203+00:00 app[web.1]: Listening on 16832 2023-03-02T19:56:13.217147+00:00 heroku[web.1]: State changed from starting to up Visit your application in the browser again, and you see another log message generated. To stop streaming the logs, press Control+C. Define a Procfile Use a Procfile, which is a text file in the root directory of your application, to explicitly declare what command executes to start your app. The Procfile in the example app you deployed looks like: web: npm start The name web is important because it declares that this single process type attaches to Heroku’s HTTP routing stack and receives web traffic when deployed. This command uses the start script specified in the package.json. Procfiles can contain additional process types. For example, you can declare one for a background worker process that processes items off of a queue. Scale the App Right now, your app runs on a single web dyno. Think of a dyno as a lightweight container that runs the command specified in the Procfile. You can check how many dynos are running using the ps command. $ heroku ps === web (Eco): npm start (1) web.1: up 2023/03/02 15:56:13 -0400 (~ 6m ago) By default, your app deploys on an Eco dyno. If they don’t receive any traffic, Eco dynos sleep after 30 minutes of inactivity. Upon waking, expect a delay of a few seconds for the first request. Subsequent requests perform normally. Eco dynos also consume from a monthly, account-level quota of Eco dyno hours. As long as the quota isn’t exhausted, all Eco apps can continue to run. To avoid dyno sleeping, you can upgrade to a Basic or Professional dyno type as described in the Dyno Types article. For example, if you migrate your app to a professional dyno, you can scale it by running a command that tells Heroku to execute a specific number of dynos, each running your web process type. Scaling an application on Heroku is equivalent to changing the number of dynos running. Scale the number of web dynos to zero. $ heroku ps:scale web=0 Access the app again by hitting refresh on the web tab, or heroku open to open it in a web tab. You get an error message because you no longer have any web dynos available to serve requests. Scale it up again. $ heroku ps:scale web=1 Declare App Dependencies Heroku recognizes an app as Node.js from a package.json file in the root directory. For your own apps, you can create one by running npm init --yes. The demo app that you deployed already has a package.json that looks like: { "name": "node-js-getting-started", "version": "0.3.0", ... "engines": { "node": "22.x" }, "dependencies": { "ejs": "^3.1.5", "express": "^4.15.2" }, ... } The package.json file determines the version of Node.js to run your application on Heroku and the dependencies to install with your application. Run this command in your local directory to install the dependencies, preparing your system to run the app locally. $ npm install added 160 packages in 6s After installation, a package-lock.json file is generated when npm install is run. Make sure to check this into Git. When subsequent dependencies are added, npm makes changes to this file, so make sure to add those changes to Git too. When an app is deployed, Heroku reads the package.json to install the appropriate node version and the package-lock.json to install the dependencies. Run the App Locally Start your application locally using the heroku local command, which installed as part of the Heroku CLI. $ heroku local web --port 5006 [OKAY] Loaded ENV .env File as KEY=VALUE Format 4:09:49 p.m. web.1 | > node-js-getting-started@0.3.0 start 4:09:49 p.m. web.1 | > node index.js 4:09:49 p.m. web.1 | Listening on 5006 Just like Heroku, heroku local examines the Procfile to determine what to run. Open http://localhost:5006 with your web browser to see your app running locally. To stop the app from running locally, in the CLI, press Ctrl+C to exit. Push Local Changes In this step, you learn how to propagate a local change to the application through to Heroku. As an example, you modify the application to add an additional dependency and the code to use it. Begin by adding a dependency for cool-ascii-faces in package.json. Run this command. $ npm install cool-ascii-faces added 11 packages in 2s Modify index.js so that it requires this module at the start. Also add a new route (/cool) that uses it. You want the final code to look like: const express = require('express') const path = require('path') const cool = require('cool-ascii-faces') const port = process.env.PORT || 5006 const app = express() app.use(express.static(path.join(__dirname, 'public'))) app.set('views', path.join(__dirname, 'views')) app.set('view engine', 'ejs') app.get('/', (req, res) => { console.log(`Rendering 'pages/index' for route '/'`) res.render('pages/index') }) app.get('/cool', (req, res) => { console.log(`Rendering a cool ascii face for route '/cool'`) res.send(cool()) }) const server = app.listen(port, () => { console.log(`Listening on ${port}`) }) process.on('SIGTERM', async () => { console.log('SIGTERM signal received: gracefully shutting down') if (server) { server.close(() => { console.log('HTTP server closed') }) } }) Test locally. $ npm install $ heroku local --port 5006 When you visit your application at http://localhost:5006/cool, the sample application shows you cute faces on each refresh: ( ⚆ _ ⚆ ). Deploy. Almost every deploy to Heroku follows this same pattern. First, add the modified files to the local Git repository. $ git add . Commit the changes to the repository. $ git commit -m "Add cool face API" Deploy, just as you did previously. $ git push heroku main Check that everything works. $ heroku open cool If everything is in working order, you see another face. Provision Add-Ons Add-ons are third-party cloud services that provide out-of-the-box additional services for your application, from persistence through logging to monitoring and more. By default, Heroku stores 1,500 lines of logs from your application. However, it makes the full log stream available as a service. Several add-on providers have logging services that provide things such as log persistence, search, and email and SMS alerts. In this step, you provision one of these logging add-ons, Papertrail. Provision the papertrail logging add-on. $ heroku addons:create papertrail Creating papertrail on ⬢ shrouded-anchorage-35377... free Welcome to Papertrail. Questions and ideas are welcome (technicalsupport@solarwinds.com). Happy logging! Created papertrail-fluffy-46630 as PAPERTRAIL_API_TOKEN Use heroku addons:docs papertrail to view documentation The add-on is now deployed and configured for your application. You can list add-ons for your app. $ heroku addons To see this particular add-on in action, visit your application’s Heroku URL a few times. Each visit generates more log messages, which route to the papertrail add-on. Visit the papertrail console to see the log messages. $ heroku addons:open papertrail Your browser opens a Papertrail web console showing the latest log events. You can search and set up alerts. Start a Console To get a feel for how dynos work, you can create another one-off dyno and run the bash command, which opens a shell on that dyno. You can then execute commands there. Each dyno has its own ephemeral filespace, p'''
