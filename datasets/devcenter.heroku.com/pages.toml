t-84135.herokuapp.com/ deployed to Heroku remote: remote: Verifying deploy... done. To https://git.heroku.com/peaceful-inlet-84135.git * [new branch] main -> main By default, apps use Eco dynos if you’re subscribed to Eco. A dyno is a lightweight Linux container that runs the command specified in your Procfile. After deployment, ensure that you have one web dyno running the app. You can check how many dynos are running using the heroku ps command: $ heroku ps Eco dyno hours quota remaining this month: 1000h 0m (100%) Eco dyno usage for this app: 0h 0m (0%) For more information on Eco dyno hours, see: https://devcenter.heroku.com/articles/eco-dyno-hours === web (Eco): target/universal/stage/bin/scala-getting-started -Dhttp.port=${PORT} (1) web.1: up 2023/03/09 17:00:28 +0100 (~ 1m ago) The running web dyno serves requests. Visit the app at the URL shown in the logs. As a handy shortcut, you can open the website with: $ heroku open The Eco dynos plan is shared across all Eco dynos in your account and is recommended if you plan on deploying many small apps to Heroku. Eco dynos sleep if they don’t receive any traffic for half an hour. This sleep behavior causes a few seconds delay for the first request upon waking. Eco dynos consume from a monthly, account-level quota of eco dyno hours. As long as you haven’t exhausted the quota, your apps can continue to run. To avoid dyno sleeping, upgrade to a Basic or Professional dyno type as described in Dyno Types. Scale the App Horizontal scaling an application on Heroku is equivalent to changing the number of running dynos. Scale the number of web dynos to zero: $ heroku ps:scale web=0 Access the app again by refreshing your browser or running heroku open. You get an error message because your app no longer has any web dynos available to serve requests. Scale it up again: $ heroku ps:scale web=1 You can also vertically scale your app by upgrading to larger dynos. See Dyno Types and Scaling Your Dyno Formation for more info. View Logs Heroku treats logs as streams of time-ordered events, aggregated from the output streams of all your app and Heroku components. Heroku provides a single stream for all events. View information about your running app by using one of the logging commands, heroku logs --tail: $ heroku logs --tail 2023-03-09T17:01:33.946880+00:00 heroku[web.1]: Starting process with command `target/universal/stage/bin/scala-getting-started -Dhttp.port=${PORT}` 2023-03-09T17:01:34.777255+00:00 app[web.1]: Setting JAVA_TOOL_OPTIONS defaults based on dyno size. Custom settings will override them. 2023-03-09T17:01:34.865577+00:00 app[web.1]: Picked up JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -Xmx300m -Xss512k -XX:CICompilerCount=2 -Dfile.encoding=UTF-8 2023-03-09T17:01:36.959678+00:00 app[web.1]: 2023-03-09 17:01:36 WARN play.api.http.HttpConfiguration 2023-03-09T17:01:37.096800+00:00 app[web.1]: 2023-03-09 17:01:37 INFO play.api.Play Application started (Prod) (no global state) 2023-03-09T17:01:37.700798+00:00 app[web.1]: 2023-03-09 17:01:37 INFO play.core.server.AkkaHttpServer Listening for HTTP on /[0:0:0:0:0:0:0:0]:7707 2023-03-09T17:01:38.191846+00:00 heroku[web.1]: State changed from starting to up 2023-03-09T17:01:56.000000+00:00 app[api]: Build succeeded 2023-03-09T17:04:55.627566+00:00 heroku[router]: at=info method=GET path="/" host=peaceful-inlet-84135.herokuapp.com request_id=f7b88a86-0e62-49f8-b37a-a083a558ed0e fwd="85.222.134.3" dyno=web.1 connect=0ms service=196ms status=200 bytes=9081 protocol=https 2023-03-09T17:04:55.932796+00:00 heroku[router]: at=info method=GET path="/assets/stylesheets/main.css" host=peaceful-inlet-84135.herokuapp.com request_id=af71979c-ea8b-4486-af07-0248d59fc5d5 fwd="85.222.134.3" dyno=web.1 connect=0ms service=95ms status=200 bytes=1115 protocol=https 2023-03-09T17:04:55.934057+00:00 heroku[router]: at=info method=GET path="/assets/images/lang-logo.png" host=peaceful-inlet-84135.herokuapp.com request_id=893a88af-6de6-40fa-888b-16488831aef