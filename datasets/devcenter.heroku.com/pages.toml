["https://devcenter.heroku.com/articles/account-verification"]
title = "Account Verification | Heroku Dev Center"
description = "Learn how to verify your Heroku account."
full_description = "Accounts & BillingAccount Verification Account Verification English — 日本語に切り替える Last updated June 11, 2024 Table of ContentsWhen Is Verification Required?How to Verify and Pay for Resources Used on a Heroku AccountAccepted Credit CardsHow to Unverify Your Heroku Account Heroku must be able to identify and contact our users in the event of an issue. Account verification helps us prevent abuse. Having a credit card on file is the most reliable way of obtaining verified contact information. A credit card is also required to pay for resources used. When Is Verification Required? You must verify your account if you or collaborators of your app want to: Create apps Deploy code Use dynos Add any add-on to the app Add a custom domain to the app Receive the transfer of an app Access to all Performance dynos and some paid add-on plans are limited to customers with an established payment history. How to Verify and Pay for Resources Used on a Heroku Account To verify a Heroku account: Go to Account Settings in the Heroku Dashboard. Click the Billing tab. Click Add Credit Card. Alternatively, when attempting to perform an action that requires a credit card, either from the Heroku CLI or through the web interface, you’re prompted to visit the credit card page. Heroku Team accounts require you to provide your card information upon the creation of the team. If for some reason your Heroku Team isn’t a verified account, you can verify it by completing these steps. Navigate to your team account in the Heroku Dashboard. Click on the Billing tab. Click Add Credit Card. Beyond account verification, the credit card on file is used to pay for the resources you use. See Usage & Billing and Credit Card Processing for more info. Accepted Credit Cards Visa, MasterCard, American Express, Discover, and JCB credit cards are accepted. Debit cards are accepted for Visa, MasterCard, and JCB. Only Visa and MasterCard credit cards are accepted for India-issued cards. Some exclusions may apply. If you have issues adding a credit card, contact your financial institution or see this Knowledge Base article. Payment Card Charge Verification Hold We perform a $1 USD temporary pre-authorization transaction as a credit security check to ensure your card details are correct and authorized. These temporary holds can appear on your statement for up to 7 days, but we aren’t actually charging you and no funds transfer from your card to Heroku. If you see multiple instances of verification charges, it’s due to submitting the card information multiple times. No Credit or Debit Card If you don’t have a credit or debit card that we can accept, you can still be a team member or collaborator on apps owned by a Heroku Enterprise or verified account. How to Unverify Your Heroku Account To learn how to remove your credit card and unverify your account, see Credit Card Processing. Keep readingAccounts & Billing FeedbackLog in to submit feedback."
