["https://devcenter.heroku.com/articles/getting-started-with-java"]
title = "Getting Started on Heroku with Java | Heroku Dev Center"
description = "A step-by-step guide for deploying your first Java app and mastering the basics of Heroku"
full_description = '''Getting Started on Heroku with Java Introduction Complete this tutorial to deploy a sample Java app to Cedar, the legacy generation of the Heroku platform. To deploy the app to the Fir generation, only available to Heroku Private Spaces, follow this guide instead. The tutorial assumes that you have: A verified Heroku Account OpenJDK 17 (or newer) installed locally Postgres installed locally An Eco dynos plan subscription (recommended) If you prefer to use Gradle instead of Maven, see the Getting Started with Gradle on Heroku guide. Using dynos and databases to complete this tutorial counts towards your usage. We recommend using our low-cost plans to complete this tutorial. Eligible students can apply for platform credits through our new Heroku for GitHub Students program. Set Up Install the Heroku Command Line Interface (CLI). Use the CLI to manage and scale your app, provision add-ons, view your logs, and run your app locally. The Heroku CLI requires Git, the popular version control system. If you don’t already have Git installed, complete the following before proceeding: Git installation First-time Git setup Download and run the installer for your platform: macOS Install Homebrew and run: $ brew tap heroku/brew && brew install heroku Windows Download the appropriate installer for your Windows installation: 64-bit installer 32-bit installer You can find more installation options for the Heroku CLI here. After installation, you can use the heroku command from your command shell. On Windows, start the Command Prompt (cmd.exe) or Powershell to access the command shell. To log in to the Heroku CLI, use the heroku login command: $ heroku login heroku: Press any key to open up the browser to login or q to exit: Opening browser to https://cli-auth.heroku.com/auth/cli/browser/*** heroku: Waiting for login... Logging in... done Logged in as me@example.com This command opens your web browser to the Heroku login page. If your browser is already logged in to Heroku, click the Log In button on the page. This authentication is required for the heroku and git commands to work correctly. If you have any problems installing or using the Heroku CLI, see the main Heroku CLI article for advice and troubleshooting steps. If you’re behind a firewall that uses a proxy to connect with external HTTP/HTTPS services, set the HTTP_PROXY or HTTPS_PROXY environment variables in your local development environment before running the heroku command. Prepare the App If you’re new to Heroku, it’s recommended to complete this tutorial using the Heroku-provided sample application. If you have your own application that you want to deploy instead, see Preparing a Codebase for Heroku Deployment. Create a local copy of the sample app by executing the following commands in your local command shell or terminal: $ git clone https://github.com/heroku/java-getting-started $ cd java-getting-started This functioning Git repository contains a sample Java application. It includes a pom.xml file, which is used by Maven, a Java build tool. Create Your App Using a dyno and a database to complete this tutorial counts towards your usage. Delete your app, and database as soon as you’re done to control costs. By default, apps use Eco dynos if you’re subscribed to Eco. Otherwise, it defaults to Basic dynos. The Eco dynos plan is shared across all Eco dynos in your account and is recommended if you plan on deploying many small apps to Heroku. Learn more here. Eligible students can apply for platform credits through our Heroku for GitHub Students program. To prepare Heroku to receive your source code, create an app: $ heroku create Creating app... done, ⬢ peaceful-inlet-84135 http://peaceful-inlet-84135.herokuapp.com/ | https://git.heroku.com/peaceful-inlet-84135.git When you create an app, a git remote called heroku is also created and associated with your local git repository. Git remotes are versions of your repository that live on other servers. You deploy your app by pushing its code to that special Heroku-hosted remote associated with your app. Heroku generates a random name for your app, in this case, peaceful-inlet-84135. You can specify your own app name. Define a Procfile Use a Procfile, a text file in the root directory of your application, to explicitly declare what command to execute to start your app. The Procfile in the example app looks like this: web: java -jar target/java-getting-started-1.0.0-SNAPSHOT.jar This Procfile declares a single process type, web, and the command needed to run it. The name web is important here. It declares that this process type is attached to Heroku’s HTTP routing stack and receives web traffic when deployed. A Procfile can contain additional process types. For example, you can declare a background worker process that processes items off a queue. Provision a Database The sample app requires a database. Provision a Heroku Postgres database, one of the add-ons available through the Elements Marketplace. Add-ons are cloud services that provide out-of-the-box additional services for your application, such as logging, monitoring, databases, and more. An essential-0 Postgres size costs $5 a month, prorated to the minute. Delete your database after completing this guide to minimize costs. $ heroku addons:create heroku-postgresql:essential-0 Creating heroku-postgresql:essential-0 on ⬢ peaceful-inlet-84135... ~$0.007/hour (max $5/month) Database should be available soon postgresql-fitted-70383 is being created in the background. The app will restart when complete... Use heroku addons:info postgresql-fitted-70383 to check creation progress Use heroku addons:docs heroku-postgresql to view documentation Your Heroku app now has access to a Postgres database. The DATABASE_URL environment variable stores the credentials. Heroku also automatically makes a JDBC_DATABASE_URL environment variable available for Java applications. It contains a JDBC-compatible version of DATABASE_URL. You can see all the add-ons provisioned with the addons command: $ heroku addons Add-on Plan Price State ─────────────────────────────────────────── ─────────── ──────── ─────── heroku-postgresql (postgresql-fitted-70383) essential-0 $5/month created └─ as DATABASE The table above shows add-ons and the attachments to the current app (peaceful-inlet-84135) or other apps. Deploy the App Deploy your code. This command pushes the main branch of the sample repo to your heroku remote, which then deploys to Heroku: $ git push heroku main remote: Compressing source files... done. remote: Building source: remote: remote: -----> Building on the Heroku-22 stack remote: -----> Determining which buildpack to use for this app remote: -----> Java app detected remote: -----> Installing OpenJDK 17... done remote: -----> Executing Maven remote: $ ./mvnw -DskipTests clean dependency:list install ... remote: [INFO] ------------------------------------------------------------------------ remote: [INFO] BUILD SUCCESS remote: [INFO] ------------------------------------------------------------------------ remote: [INFO] Total time: 10.733 s remote: [INFO] Finished at: 2023-03-09T16:00:12Z remote: [INFO] ------------------------------------------------------------------------ remote: -----> Discovering process types remote: Procfile declares types -> web remote: remote: -----> Compressing... remote: Done: 86.4M remote: -----> Launching... remote: Released v5 remote: https://peaceful-inlet-84135.herokuapp.com/ deployed to Heroku remote: remote: Verifying deploy... done. To https://git.heroku.com/peaceful-inlet-84135.git * [new branch] main -> main By default, apps use Eco dynos if you’re subscribed to Eco. A dyno is a lightweight Linux container that runs the command specified in your Procfile. After deployment, ensure that you have one web dyno running the app. You can check how many dynos are running using the heroku ps command: $ heroku ps Eco dyno hours quota remaining this month: 1000h 0m (100%) Eco dyno usage for this app: 0h 0m (0%) For more information on Eco dyno hours, see: https://devcenter.heroku.com/articles/eco-dyno-hours === web (Eco): java -jar target/java-getting-started-1.0.0-SNAPSHOT.jar (1) web.1: up 2023/03/09 17:00:28 +0100 (~ 1m ago) The running web dyno serves requests. Visit the app at the URL shown in the logs. As a handy shortcut, you can open the website with: $ heroku open The Eco dynos plan is shared across all Eco dynos in your account and is recommended if you plan on deploying many small apps to Heroku. Eco dynos sleep if they don’t receive any traffic for half an hour. This sleep behavior causes a few seconds delay for the first request upon waking. Eco dynos consume from a monthly, account-level quota of eco dyno hours. As long as you haven’t exhausted the quota, your apps can continue to run. To avoid dyno sleeping, upgrade to a Basic or Professional dyno type as described in Dyno Types. Scale the App Horizontal scaling an application on Heroku is equivalent to changing the number of running dynos. Scale the number of web dynos to zero: $ heroku ps:scale web=0 Access the app again by refreshing your browser or running heroku open. You get an error message because your app no longer has any web dynos available to serve requests. Scale it up again: $ heroku ps:scale web=1 You can also vertically scale your app by upgrading to larger dynos. See Dyno Types and Scaling Your Dyno Formation for more info. View Logs Heroku treats logs as streams of time-ordered events, aggregated from the output streams of all your app and Heroku components. Heroku provides a single stream for all events. View information about your running app by using one of the logging commands, heroku logs --tail: $ heroku logs --tail 2023-03-09T16:03:23.130513+00:00 app[web.1]: 2023-03-09T16:03:23.130Z INFO 2 --- [ main] o.s.b.w.embedded.tomcat.TomcatWebServer : Tomcat initialized with port(s): 41040 (http) 2023-03-09T16:03:23.141029+00:00 app[web.1]: 2023-03-09T16:03:23.140Z INFO 2 --- [ main] o.apache.catalina.core.StandardService : Starting service [Tomcat] 2023-03-09T16:03:23.141265+00:00 app[web.1]: 2023-03-09T16:03:23.141Z INFO 2 --- [ main] o.apache.catalina.core.StandardEngine : Starting Servlet engine: [Apache Tomcat/10.1.5] 2023-03-09T16:03:23.218914+00:00 app[web.1]: 2023-03-09T16:03:23.218Z INFO 2 --- [ main] o.a.c.c.C.[Tomcat].[localhost].[/] : Initializing Spring embedded WebApplicationContext 2023-03-09T16:03:23.220624+00:00 app[web.1]: 2023-03-09T16:03:23.220Z INFO 2 --- [ main] w.s.c.ServletWebServerApplicationContext : Root WebApplicationContext: initialization completed in 976 ms 2023-03-09T16:03:23.469655+00:00 app[web.1]: 2023-03-09T16:03:23.469Z INFO 2 --- [ main] o.s.b.a.w.s.WelcomePageHandlerMapping : Adding welcome page template: index 2023-03-09T16:03:23.692938+00:00 app[web.1]: 2023-03-09T16:03:23.692Z INFO 2 --- [ main] o.s.b.w.embedded.tomcat.TomcatWebServer : Tomcat started on port(s): 41040 (http) with context path '' 2023-03-09T16:03:23.707694+00:00 app[web.1]: 2023-03-09T16:03:23.707Z INFO 2 --- [ main] c.heroku.java.GettingStartedApplication : Started GettingStartedApplication in 1.927 seconds (process running for 2.33) 2023-03-09T16:03:23.940755+00:00 heroku[web.1]: State changed from starting to up 2023-03-09T16:03:24.673236+00:00 app[web.1]: 2023-03-09T16:03:24.672Z INFO 2 --- [io-41040-exec-3] o.a.c.c.C.[Tomcat].[localhost].[/] : Initializing Spring DispatcherServlet 'dispatcherServlet' 2023-03-09T16:03:24.673549+00:00 app[web.1]: 2023-03-09T16:03:24.673Z INFO 2 --- [io-41040-exec-3] o.s.web.servlet.DispatcherServlet : Initializing Servlet 'dispatcherServlet' 2023-03-09T16:03:24.674938+00:00 app[web.1]: 2023-03-09T16:03:24.674Z INFO 2 --- [io-41040-exec-3] o.s.web.servlet.DispatcherServlet : Completed initialization in 1 ms 2023-03-09T16:03:24.948408+00:00 heroku[router]: at=info method=GET path="/" host=peaceful-inlet-84135.herokuapp.com request_id=e010a5e5-f212-4e0b-a624-c96f7421c98f fwd="85.222.134.1" dyno=web.1 connect=0ms service=304ms status=200 bytes=8917 protocol=https 2023-03-09T16:03:25.162539+00:00 heroku[router]: at=info method=GET path="/stylesheets/main.css" host=peaceful-inlet-84135.herokuapp.com request_id=dcbe440f-82c5-4442-80bc-be7be0b5cd61 fwd="85.222.134.1" dyno=web.1 connect=0ms service=10ms status=304 bytes=208 protocol=https 2023-03-09T16:03:25.335819+00:00 heroku[router]: at=info method=GET path="/lang-logo.png" host=peaceful-inlet-84135.herokuapp.com request_id=071b67a6-1e22-4cfe-b57b-c49db6b5af19 fwd="85.222.134.1" dyno=web.1 connect=0ms service=3ms status=304 bytes=208 protocol=https 2023-03-09T16:03:25.534061+00:00 heroku[router]: at=info method=GET path="/favicon.ico" host=peaceful-inlet-84135.herokuapp.com request_id=cc651ead-23ce-4c43-a3ce-4edc93450b14 fwd="85.222.134.1" dyno=web.1 connect=0ms service=82ms status=404 bytes=333 protocol=https To see more log messages generate, visit your application in the browser first. To stop streaming the logs, press Control+C. Provision a Logging Add-on Add-ons are third-party cloud services that provide out-of-the-box additional services for your application, from persistence through logging to monitoring and more. By default, Heroku stores 1500 lines of logs from your application, but the full log stream is available as a service. Several add-on providers have logging services that provide things such as log persistence, search, and email and SMS alerts. In this step, you provision one of these logging add-ons, Papertrail. Provision the Papertrail logging add-on: $ heroku addons:create papertrail Creating papertrail on ⬢ peaceful-inlet-84135... free Welcome to Papertrail. Questions and ideas are welcome (technicalsupport@solarwinds.com). Happy logging! Created papertrail-slippery-84785 as PAPERTRAIL_API_TOKEN Use heroku addons:docs papertrail to view documentation The add-on is now deployed and configured for your application. You can list add-ons for your app with this command: $ heroku addons To see this particular add-on in action, visit your application’s Heroku URL a few times. Each visit generates more log messages, which get routed to the Papertrail add-on. Visit the Papertrail console to see the log messages: $ heroku addons:open papertrail Your browser opens up a Papertrail web console that shows the latest log events. The interface lets you search and set up alerts. Use a Database Heroku provides managed data services for Postgres and Redis, and the add-on marketplace provides additional data services, including MongoDB and MySQL. Use the heroku addons command for an overview of the database provisioned for your app: $ heroku addons Add-on Plan Price State ─────────────────────────────────────────── ─────────── ──────── ─────── heroku-postgresql (postgresql-fitted-70383) essential-0 $5/month created └─ as DATABASE papertrail (papertrail-slippery-84785) choklad free created └─ as PAPERTRAIL Listing the config vars for your app displays the URL that your app uses to connect t'''
