["https://devcenter.heroku.com/articles/platform-api-reference"]
title = "Platform API Reference | Heroku Dev Center"
description = "A technical description of the Heroku Platform API, which lets you programmatically automate, extend and combine Heroku with other services."
full_description = '''Extending HerokuPlatform APIPlatform API Reference Platform API Reference English — 日本語に切り替える Last updated February 27, 2025 Table of ContentsOverviewAccountAccount DelinquencyAccount FeatureAdd-onAdd-on ActionAdd-on AttachmentAdd-on ConfigAdd-on Plan ActionAdd-on Region CapabilityAdd-on ServiceAdd-on WebhookAdd-on Webhook DeliveryAdd-on Webhook EventAllowed Add-on ServiceAppApp FeatureApp SetupApp TransferApp WebhookApp Webhook DeliveryApp Webhook EventAudit Trail ArchiveAudit Trail EventBuildBuildpack InstallationsCollaboratorConfig VarsCreditDomainDynoDyno SizeEnterprise AccountEnterprise Account Daily UsageEnterprise Account MemberEnterprise Account Monthly UsageFiltersFormationGenerationIdentity ProviderInbound RulesetInvoiceInvoice AddressKeyLog DrainLog SessionOAuth AuthorizationOAuth ClientOAuth GrantOAuth TokenOCI ImagePasswordResetPeeringPeering InfoPermission EntityPipelinePipeline BuildPipeline Config VarsPipeline CouplingPipeline DeploymentPipeline PromotionPipeline Promotion TargetPipeline ReleasePipeline StackPipeline TransferPlanRate LimitRegionReleaseReview AppReview App ConfigurationSlugSMS NumberSNI EndpointSourceSpaceSpace AccessSpace Network Address TranslationSpace TopologySpace TransferStackTeamTeam Add-onTeam AppTeam App CollaboratorTeam App PermissionTeam Daily UsageTeam DelinquencyTeam FeatureTeam InvitationTeam InvoiceTeam MemberTeam Monthly UsageTeam PreferencesTeam SpaceTelemetry DrainTest CaseTest NodeTest RunUser PreferencesPrivate Spaces VPN Overview The platform API empowers developers to automate, extend and combine Heroku with other services. You can use the platform API to programmatically create apps, provision add-ons and perform other tasks that could previously only be accomplished with the Heroku CLI or Dashboard. For details on getting started, see Getting Started with the Platform API. Authentication OAuth should be used to authorize and revoke access to your account to yourself and third parties. Details can be found in the OAuth article. For personal scripts you may also use HTTP bearer authentication, but OAuth is recommended for any third party services. HTTP bearer authentication must be constructed using an API token, passed as the Authorization header for each request, for example Authorization: Bearer 01234567-89ab-cdef-0123-456789abcdef. The quick start guide has more details. Caching All responses include an ETag (or Entity Tag) header, identifying the specific version of a returned resource. You may use this value to check for changes to a resource by repeating the request and passing the ETag value in the If-None-Match header. If the resource has not changed, a 304 Not Modified status will be returned with an empty body. If the resource has changed, the request will proceed normally. Clients Clients must address requests to api.heroku.com using HTTPS and specify the Accept: application/vnd.heroku+json; version=3 Accept header. Clients should specify a User-Agent header to facilitate tracking and debugging. CORS The Platform API supports cross-origin resource sharing (CORS) so that requests can be sent from browsers using JavaScript served from any domain. Schema The API has a machine-readable JSON schema that describes what resources are available via the API, what their URLs are, how they are represented and what operations they support. You can access the schema using cURL: $ curl https://api.heroku.com/schema \ -H "Accept: application/vnd.heroku+json; version=3" { "description": "The platform API empowers developers to automate, extend and combine Heroku with other services.", "definitions": { ... } } cURL Examples cURL examples are provided to facilitate experimentation. Variable values are represented as $SOMETHING so that you can manipulate them using environment variables. Examples use the -n option to fetch credentials from a ~/.netrc file, which should include an entry for api.heroku.com similar to the following: machine api.heroku.com login {your-email} password {your-api-token} Because Heroku’s V3 API is only accessible through HTTP Accept header, it may also be convenient to create a cURL alias for easy access: alias c3='curl -n -H "Accept: application/vnd.heroku+json; version=3"' Custom Types Name JSON Type Description date-time string timestamp in iso8601 format uuid string uuid in 8-4-4-4-12 format Data Integrity Both unique id and more human-friendly attributes can be used reference resources. For example you can use name or id to refer to an app. Though the human-friendly version may be more convenient, id should be preferred to avoid ambiguity. You may pass the If-Match header with an ETag value from a previous response to ensure a resource has not changed since you last received it. If the resource has changed, you will receive a 412 Precondition Failed response. If the resource has not changed, the request will proceed normally. Errors Failing responses will have an appropriate status and a JSON body containing more details about a particular error. See error responses for more example ids. Error Attributes Name Type Description Example id string id of error raised "rate_limit" message string end user message of error raised "Your account reached the API limit. Please wait a few minutes before making new requests" url string reference url with more information about the error https://devcenter.heroku.com/articles/platform-api-reference#rate-limits Note that the url is included only when relevant and may not be present in the response. Error Response HTTP/1.1 429 Too Many Requests { "id": "rate_limit", "message": "Your account reached the API rate limit\nPlease wait a few minutes before making new requests", "url": "https://devcenter.heroku.com/articles/platform-api-reference#rate-limits" } Escaping Some attributes are text fields. Those fields will not be escaped to prevent XSS flaws. It is up to the client to escape that data. Methods Method Usage DELETE used for destroying existing objects GET used for retrieving lists and individual objects HEAD used for retrieving metadata about existing objects PATCH used for updating existing objects POST used for creating new objects Method Override When using a client that does not support all of the methods, you can override by using a POST and setting the X-Http-Method-Override header to the desired methed. For instance, to do a PATCH request, do a POST with header X-Http-Method-Override: PATCH. Parameters Values that can be provided for an action are divided between optional and required values. The expected type for each value is specified and unlisted values should be considered immutable. Parameters should be JSON encoded and passed in the request body. Ranges List requests will return a Content-Range header indicating the range of values returned. Large lists may require additional requests to retrieve. If a list response has been truncated you will receive a 206 Partial Content status and the Next-Range header set. To retrieve the next range, repeat the request with the Range header set to the value of the previous request’s Next-Range header. The number of values returned in a range can be controlled using a max key in the Range header. For example, to get only the first 10 values, set this header: Range: id ..; max=10;. max can also be passed when iterating over Next-Range. The default page size is 200 and maximum page size is 1000. The property used to sort values in a list response can be changed. The default property is id, as in Range: id ..;. To learn what other properties you can use to sort a list response, inspect the Accept-Ranges headers. For the apps resource, for example, you can sort on either id or name: $ curl -i -n -X GET https://api.heroku.com/apps \ -H "Accept: application/vnd.heroku+json; version=3" ... Accept-Ranges: id, name ... The default sort order for resource lists responses is ascending. You can opt for descending sort order by passing a order key in the range header: $ curl -i -n -X GET https://api.heroku.com/apps \ -H "Accept: application/vnd.heroku+json; version=3" -H "Range: name ..; order=desc;" Combining with the max key would look like this: $ curl -i -n -X GET https://api.heroku.com/apps \ -H "Accept: application/vnd.heroku+json; version=3" \ -H "Range: name ..; order=desc,max=10;" Rate Limits The API limits the number of requests each user can make per hour to protect against abuse and buggy code. Each account has a pool of request tokens that can hold at most 4500 tokens. Each API call removes one token from the pool. Tokens are added to the account pool at a rate of roughly 75 per minute (or 4500 per hour), up to a maximum of 4500. If no tokens remain, further calls will return 429 Too Many Requests until more tokens become available. You can use the RateLimit-Remaining response header to check your current token count. You can also query the rate limit endpoint to get your token count. Requests to the rate limit endpoint do not count toward the limit. If you find your account is being rate limited but don’t know the cause, consider cycling your API key on the account page on Heroku dashboard. Request Id Each API response contains a unique request id in the Request-Id header to facilitate tracking. When reporting issues, providing this value makes it easier to pinpoint problems and provide solutions more quickly. Responses Values returned by the API are split into a section with example status code and relevant headers (with common http headers omitted) and a section with an example JSON body (if any). Response Headers Header Description RateLimit-Remaining allowed requests remaining in current interval Stability Each resource in the Heroku Platform API Schema is annotated with a stability attribute, which will be set to one of three values: prototype, development, or production. This attribute reflects the change management policy in place for the resource. For a full explanation of these policies, please see the Dev Center API compatibility article. Statuses The result of responses can be determined by returned status. Successful Responses Status Description 200 OK request succeeded 201 Created resource created, for example a new app was created or an add-on was provisioned 202 Accepted request accepted, but the processing has not been completed 206 Partial Content request succeeded, but this is only a partial response, see ranges Error Responses Error responses can be divided in to two classes. Client errors result from malformed requests and should be addressed by the client. Heroku errors result from problems on the server side and must be addressed internally. Client Error Responses Status Error ID Description 400 Bad Request bad_request request invalid, validate usage and try again 401 Unauthorized unauthorized request not authenticated, API token is missing, invalid or expired 402 Payment Required delinquent either the account has become delinquent as a result of non-payment, or the account’s payment method must be confirmed to continue 403 Forbidden forbidden request not authorized, provided credentials do not provide access to specified resource 403 Forbidden suspended request not authorized, account or application was suspended. 404 Not Found not_found request failed, the specified resource does not exist 406 Not Acceptable not_acceptable request failed, set Accept: application/vnd.heroku+json; version=3 header and try again 409 Conflict conflict request failed, see response body for suggested resolution 410 Gone gone requested resource can no longer be found at this location, see the Platform API Reference for alternatives. 416 Requested Range Not Satisfiable requested_range_not_satisfiable request failed, validate Content-Range header and try again 422 Unprocessable Entity invalid_params request failed, validate parameters try again 422 Unprocessable Entity verification_needed request failed, enter billing information in the Heroku Dashboard before utilizing resources. 429 Too Many Requests rate_limit request failed, wait for rate limits to reset and try again, see rate limits Heroku Error Responses Status Description 500 Internal Server Error error occurred, we are notified, but contact support if the issue persists 503 Service Unavailable API is unavailable, check response body or Heroku status for details Versioning The current version of the API is version 3. See the API compatibility policy article for details on versioning. Account Stability: production An account represents an individual signed up to use the Heroku platform. Attributes Name Type Description Example allow_tracking boolean whether to allow third party web activity tracking default: true true beta boolean whether allowed to utilize beta Heroku features false country_of_residence nullable string country where account owner resides "United States" created_at date-time when account was created "2012-01-01T12:00:00Z" default_organization nullable object team selected by default null default_organization:id uuid unique identifier of team "01234567-89ab-cdef-0123-456789abcdef" default_organization:name string unique name of team "example" default_team nullable object team selected by default null default_team:id uuid unique identifier of team "01234567-89ab-cdef-0123-456789abcdef" default_team:name string unique name of team "example" delinquent_at nullable date-time when account became delinquent "2012-01-01T12:00:00Z" email email unique email address of account "username@example.com" federated boolean whether the user is federated and belongs to an Identity Provider false id uuid unique identifier of an account "01234567-89ab-cdef-0123-456789abcdef" identity_provider nullable object Identity Provider details for federated users. null identity_provider:id uuid unique identifier of this identity provider "01234567-89ab-cdef-0123-456789abcdef" identity_provider:name string user-friendly unique identifier for this identity provider "acme-sso" identity_provider:organization:name string unique name of team "example" identity_provider:owner:id uuid unique identifier of the owner "01234567-89ab-cdef-0123-456789abcdef" identity_provider:owner:name string name of the owner "acme" identity_provider:owner:type string type of the owner one of:"team" or "enterprise-account" "team" identity_provider:team:name string unique name of team "example" last_login nullable date-time when account last authorized with Heroku "2012-01-01T12:00:00Z" name nullable string full name of the account owner "Tina Edmonds" sms_number nullable string SMS number of account "+1 ***-***-1234" suspended_at nullable date-time when account was suspended "2012-01-01T12:00:00Z" two_factor_authentication boolean whether two-factor auth is enabled on the account false updated_at date-time when account was updated "2012-01-01T12:00:00Z" verified boolean whether account has been verified with billing information false Account Info Info for account. GET /account Curl Example $ curl -n https://api.heroku.com/account \ '''
