["https://devcenter.heroku.com/articles/getting-started-with-rails6"]
title = "Getting Started on Heroku with Rails 6.x | Heroku Dev Center"
description = "Creating, configuring, deploying and scaling Rails 6.x applications on Heroku, using Bundler dependency management."
full_description = '''Language SupportRubyRails SupportGetting Started on Heroku with Rails 6.x Getting Started on Heroku with Rails 6.x English — 日本語に切り替える Last updated December 05, 2024 This article is a work in progress, or documents a feature that is not yet released to all users. This article is unlisted. Only those with the link can access it. Table of ContentsLocal SetupCreate a New or Upgrade an Existing Rails AppAdd the pg GemCreate a Welcome PageSpecify the Ruby VersionCreate a ProcfileStore The App in GitFix a babel regressionCreate a Heroku AppProvision a DatabaseDeploy the App to HerokuMigrate The DatabaseScale and Access the ApplicationView Application LogsOptional StepsRails asset pipelineRemove Heroku GemsTroubleshootingNext StepsDeleting Your App and Add-on This article is archived. It is no longer receiving updates. It is presented here for historical reference only. We cannot guarantee that any statements made are still true or that the instructions will still work. This version of Rails is no longer supported by Rails core. If you are starting a new application, we recommend you use the most recently released version of Rails. The latest version of Rails available is Rails 8. If you’re starting a new application, we recommend you use the most recently released version. Ruby on Rails is a popular web framework written in Ruby. This guide covers using Rails 6 on Heroku. For information on running previous versions of Rails on Heroku, see the tutorial for Rails 5.x or Rails 4.x. The tutorial assumes that you have: Basic familiarity with Ruby/Rails and Git A locally installed version of Ruby 2.5.0+, Rubygems, Bundler, and Rails 6+ A locally installed version of the Heroku CLI A verified Heroku Account A subscription to the Eco dynos plan (recommended) Using dynos and databases to complete this tutorial counts towards your usage. We recommend using our low-cost plans to complete this tutorial. Eligible students can apply for platform credits through our new Heroku for GitHub Students program. Local Setup After installing the Heroku CLI, log in through your terminal: $ heroku login heroku: Press any key to open up the browser to login or q to exit › Warning: If browser does not open, visit › https://cli-auth.heroku.com/auth/browser/*** heroku: Waiting for login... Logging in... done Logged in as me@example.com This command opens your web browser to the Heroku login page. If your browser is already logged in to Heroku, click the Log in button on the page. This authentication is required for the heroku and git commands to work correctly. Create a New or Upgrade an Existing Rails App Ensure that you’re using Rails 6.x by running rails -v. If necessary, install it with this command: $ gem install rails -v 6.1.7.3 --no-document Successfully installed rails-6.1.7.3 1 gem installed Create a Rails app: $ rails _6.1.7.3_ new myapp --database=postgresql Move into the application directory and add the x86_64-linux and ruby platforms to Gemfile.lock. $ cd myapp $ bundle lock --add-platform x86_64-linux --add-platform ruby Fetching gem metadata from https://rubygems.org/.......... Resolving dependencies..... Writing lockfile to ./myapp/Gemfile.lock Create a local database: $ bin/rails db:create Database 'myapp_development' already exists Database 'myapp_test' already exists Add the pg Gem For new or existing apps where --database=postgresql isn’t defined, confirm the sqlite3 gem doesn’t exist in the Gemfile. Add the pg gem in its place. gem 'sqlite3' To this: gem 'pg' Heroku highly recommends using PostgreSQL locally during development. Maintaining parity between development and deployment environments prevents introducing subtle bugs due to the differences in environments. Install Postgres locally. For more information on why Postgres is recommended instead of Sqlite3, see why Sqlite3 is not compatible with Heroku. With the Gemfile updated, reinstall the dependencies: $ bundle install The installation also updates Gemfile.lock with the changes. In addition to the pg gem, ensure that config/database.yml defines the postgresql adapter. The development section of config/database.yml file looks something like this: $ cat config/database.yml # PostgreSQL. Versions 9.3 and up are supported. # # Install the pg driver: # gem install pg # On macOS with Homebrew: # gem install pg -- --with-pg-config=/usr/local/bin/pg_config # On macOS with MacPorts: # gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config # On Windows: # gem install pg # Choose the win32 build. # Install PostgreSQL and put its /bin directory on your path. # # Configure Using Gemfile # gem 'pg' # default: &default adapter: postgresql encoding: unicode # For details on connection pooling, see Rails configuration guide # https://guides.rubyonrails.org/configuring.html#database-pooling pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %> development: <<: *default database: myapp_development # The specified database role being used to connect to postgres. # To create additional roles in postgres see `$ createuser --help`. # When left blank, postgres will use the default role. This is # the same name as the operating system user running Rails. #username: myapp # The password associated with the postgres role (username). #password: # Connect on a TCP socket. Omitted by default since the client uses a # domain socket that doesn't need configuration. Windows does not have # domain sockets, so uncomment these lines. #host: localhost # The TCP port the server listens on. Defaults to 5432. # If your server runs on a different port number, change accordingly. #port: 5432 # Schema search path. The server defaults to $user,public #schema_search_path: myapp,sharedapp,public # Minimum log levels, in increasing order: # debug5, debug4, debug3, debug2, debug1, # log, notice, warning, error, fatal, and panic # Defaults to warning. #min_messages: notice # Warning: The database defined as "test" will be erased and # re-generated from your development database when you run "rake". # Do not set this db to the same as development or production. test: <<: *default database: myapp_test # As with config/credentials.yml, you never want to store sensitive information, # like your database password, in your source code. If your source code is # ever seen by anyone, they now have access to your database. # # Instead, provide the password or a full connection URL as an environment # variable when you boot the app. For example: # # DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase" # # If the connection URL is provided in the special DATABASE_URL environment # variable, Rails will automatically merge its configuration values on top of # the values provided in this file. Alternatively, you can specify a connection # URL environment variable explicitly: # # production: # url: <%= ENV['MY_APP_DATABASE_URL'] %> # # Read https://guides.rubyonrails.org/configuring.html#configuring-a-database # for a full overview on how database connection configuration can be specified. # production: <<: *default database: myapp_production username: myapp password: <%= ENV['MYAPP_DATABASE_PASSWORD'] %> Be careful here. If the value of adapter is postgres and not postgresql, the application won’t work. Create a Welcome Page Rails 6 no longer has a static index page in production by default. When you’re using a new app, there isn’t a root page in production, so you must create one. Create a controller called welcome for the home page: $ rails generate controller welcome In file app/views/welcome/index.html.erb write: <h2>Hello World</h2> <p> The time is now: <%= Time.now %> </p> Create a Rails route to this action. Edit config/routes.rb to set the index page to the new method: In file config/routes.rb, on line 2 add: root 'welcome#index' You can verify that the page is there by running your server: $ rails server Visit http://localhost:3000 in your browser. If you don’t see the page, use the logs to debug. Rails outputs logs in the same terminal where rails server started. Specify the Ruby Version Rails 6 requires Ruby 2.5.0 or above. Heroku has a recent version of Ruby installed by default. Specify an exact version with the ruby DSL in Gemfile. For example: ruby "3.0.6" Always use the same version of Ruby locally. Confirm the local version of ruby with ruby -v. Refer to the Ruby Versions article for more details on defining a specific ruby version. Create a Procfile Use a Procfile, a text file in the root directory of your application, to explicitly declare what command to execute to start your app. This Procfile declares a single process type, web, and the command needed to run it. The name web is important here. It declares that this process type is attached to Heroku’s HTTP routing stack and receives web traffic when deployed. By default, a Rails app’s web process runs rails server, which uses Puma in Rails 7. When you deploy a Rails 7 application without a Procfile, this command executes. However, we recommend explicitly declaring how to boot your server process via a Procfile. In file Procfile write: web: bundle exec puma -C config/puma.rb The Procfile filename is case sensitive. There is no file extension. If config/puma.rb doesn’t exist, create one using Heroku’s Puma documentation for maximum performance. A Procfile can contain additional process types. For example, you can declare a background worker process that processes items off a queue. Store The App in Git Heroku relies on Git, a distributed source control management tool, for deploying applications. If the application is not already in Git, first verify that git is on the system with git --help: $ git --help usage: git [--version] [--help] [-C <path>] [-c <name>=<value>] [--exec-path[=<path>]] [--html-path] [--man-path] [--info-path] [-p | --paginate | -P | --no-pager] [--no-replace-objects] [--bare] [--git-dir=<path>] [--work-tree=<path>] [--namespace=<name>] [--super-prefix=<path>] [--config-env=<name>=<envvar>] If the command produces no output or command not found, install Git. Navigate to the root directory of the Rails app. Use the ls command to see its contents: $ ls Gemfile Gemfile-e Gemfile.lock Procfile README.md Rakefile app babel.config.js bin config config.ru db lib log node_modules package.json postcss.config.js public storage test tmp vendor yarn.lock Within the Rails app directly, initialize a local empty Git repository and commit the app’s code: $ git init $ git add . $ git commit -m "init" Verify everything committed correctly with git status: $ git status On branch main nothing to commit, working tree clean With the application committed to Git, it’s ready to deploy to Heroku. Fix a babel regression Rails 6 relies on the webpacker gem which uses babel as a dependency. Version 7.22.0 of babel released a breaking change in a minor version that caused new Rails 6.1.x apps to break. Rails 6 and webpacker are no longer receiving bug fixes so unless babel reverts the change, then you will need to workaround this bug in your new app. Test to see if your application is affected by this bug by running this command: $ rake webpacker:clobber webpacker:compile 2>&1 | grep "Cannot find package '@babel/plugin-proposal-private-methods'" Error: Cannot find package '@babel/plugin-proposal-private-methods' imported from ./myapp/babel-virtual-resolve-base.js To fix this issue modify babel.config.js, replace plugin-proposal-private-methods with plugin-transform-private-methods: - '@babel/plugin-plugin-private-methods', + '@babel/plugin-transform-private-methods', Verify that it works correctly: $ rake webpacker:clobber webpacker:compile Commit the fix to git: $ git add . $ git commit -m "fix babel error" Create a Heroku App Using a dyno and a database to complete this tutorial counts towards your usage. Delete your app, and database as soon as you’re done to control costs. To create an app on Heroku, use the Heroku CLI Inside the Rails app’s root directory: $ heroku create --stack heroku-20 Creating app... done, serene-fortress-54097, stack is heroku-20 https://serene-fortress-54097.herokuapp.com/ | https://git.heroku.com/serene-fortress-54097.git When you create an app, a git remote called heroku is also created and associated with your local git repository. Git remotes are versions of your repository that live on other servers. You deploy your app by pushing its code to that special Heroku-hosted remote associated with your app. Verify the remote is set with git config: $ git config --list --local | grep heroku remote.heroku.url=https://git.heroku.com/serene-fortress-54097.git remote.heroku.fetch=+refs/heads/*:refs/remotes/heroku/* If the current directory is incorrect or Git isn’t initialized, Git returns fatal: not in a git directory. If Git returns a list of remotes, it’s ready to deploy. Following changes in the industry, Heroku has updated our default git branch name to main. If the project you’re deploying uses master as its default branch name, use git push heroku master. Provision a Database Provision a Heroku Postgres database, one of the add-ons available through the Elements Marketplace. Add-ons are cloud services that provide out-of-the-box additional services for your application, such as logging, monitoring, databases, and more. An essential-0 Postgres size costs $5 a month, prorated to the minute. At the end of this tutorial, we prompt you to delete your database to minimize costs. $ heroku addons:create heroku-postgresql:essential-0 Creating heroku-postgresql:essential-0 on ⬢ serene-fortress-54097... ~$0.007/hour (max $5/month) Database should be available soon postgresql-acute-36546 is being created in the background. The app will restart when complete... Use heroku addons:info postgresql-acute-36546 to check creation progress Use heroku addons:docs heroku-postgresql to view documentation Your Heroku app can now access this Postgres database. The DATABASE_URL environment variable stores your credentials, which Rails connects to by convention. Deploy the App to Heroku Using a dyno to complete this tutorial counts towards your usage. Delete your app as soon as you’re done to control costs. Deploy your code. This command pushes the main branch of the sample repo to your heroku remote, which then deploys to Heroku: $ git push heroku main remote: Updated 101 paths from 59c4854 remote: Compressing source files... done. remote: Building source: remote: remote: -----> Building on the Heroku-20 stack remote: -----> Determining which buildpack to use for this app remote: ! Warning: Multiple default buildpacks reported the ability to handle this app. The first buildpack in the list below will be used. remote: Detected buildpacks: Ruby,Node.js remote: See https://devcenter.heroku.com/articles/buildpacks#buildpack-detect-order remote: -----> Ruby app detected remote: -----> Installing bundler 2.3.25 remote: -----> Removing BUNDLED WITH version in the Gemfile.lock remote: -----> Compiling Ruby/Rails remote: -----> Using Ruby vers'''
