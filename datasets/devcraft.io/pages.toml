full_description = 'Note Oriented Programming - DEF CON CTF Qualifier 2018 May 21, 2018 nop 145 points, 29 Solves, pwn/shellcode We are given a binary that reads up to 2000 frequencies as shorts into a fixed mapping at 0x40404000. These were then convert to the musical note equivilent and copied to 0x60606000, along with a short prelude and int 0x80 appened to create the final shellcode. So we have to create our shellcode using only A0, A#0, B1, etc. We can also send a frequency of 0xffff followed by any arbitrary data and it will be copied to the 0x40404000 region but be skipped when converting to the notes, allowing us to put data at a know location. Looking at the combinations of notes and the gadgets they produce, we have a lot of xor,inc but no way to set ecx for a execve syscall. This left either self self-modifying code, or sigreturn to execve as we could setup the stack and store /bin/sh in the 0x40404000 region. In the prelude, edi and esi were setup to point to the stack, which was prefilled filled with O along with a message ---- Welcome to Note Oriented Programming!! ---- and the other registers set to 0. Some useful gadgets found after combining some off the notes are: D6 - inc esp; ss F6 - inc esi; ss G6 - inc edi; ss A3F4 - inc ecx; xor eax,DWORD PTR [esi+0x34] A1F4 - inc ecx; xor DWORD PTR [esi+0x34],eax A3G0 - inc ecx; xor eax,DWORD PTR [edi+0x30] B5A9B9 - inc edx; xor eax,0x39423941 B5F9B9 - inc edx; xor eax,0x39423946 I decided to go with the sigreturn method as we could easily xor the stack to 0 and then set it to the required value with a few more xors. The stack needed to look like the following: 0x00000063 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000 0x40404747 0x00000000 0x00000000 0x0000000b 0x00000000 0x00000000 0x60606666 0x00000023 0x00000000 0x00000000 0x0000002b 0x00000000 0x00000000 0x00000000 0x00000000 0x00000000 Then set eax to 0x77 for sigreturn, /bin/sh at 0x40404747 and pad the payload so that int 