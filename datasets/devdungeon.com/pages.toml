["https://www.devdungeon.com/content/neotrellis-m4-circuitpy-tutorial-adabox-010"]
title = "NeoTrellis M4 CircuitPy Tutorial (AdaBox 010) | DevDungeon"
description = '''I subscribe to Adafruit's [AdaBox](https://www.adafruit.com/adabox) and I get a fun project every 3 months mailed to me. A little while back I received [AdaBox 010](https://learn.adafruit.com/adabox010) which came with a [NeoTrellis M4 board](https://www.adafruit.com/product/3938) as the centerpiece. The board comes with a microcontroller that can be programmed with Python using [CircuitPython](https://learn.adafruit.com/welcome-to-circuitpython/overview). The [NeoTrellis M4](https://learn.adafruit.com/adafruit-neotrellis-m4/board-tour) comes with a grid of 32 NeoPixels, which double as buttons. On top of that, it has an audio processor with an 1/8" audio output jack so it can play sound files and generate noise. Furthermore, it even has an accelerometer that can detect motion in three direction so you have even more input available to control the audio and lights. It also comes with a microphone. To top it off, it can act as a MIDI device! It can use the USB port as the MIDI interface or it can use the UART connector for MIDI. The micro-USB connector is used for power but also acts as a USB removable drive for easy access to the source code files and easily upload sound files. It can also serve as a MIDI USB interface to interact with MIDI software. The USB can also serve as a generic USB HID (Human interface device) like a mouse or keyboard to send events to a computer that it understands like a keypress or a mouse event. In this tutorial, I try to provide an overview of all the capabilities and give you an idea of all the possibilities with this board. You will find several code examples that focus on one specific aspect of the board.'''
full_description = '''Submitted by nanodano on Mon, 07/08/2019 - 00:34 Introduction I subscribe to Adafruit's AdaBox and I get a fun project every 3 months mailed to me. A little while back I received AdaBox 010 which came with a NeoTrellis M4 board as the centerpiece. The board comes with a microcontroller that can be programmed with Python using CircuitPython. The NeoTrellis M4 comes with a grid of 32 NeoPixels, which double as buttons. On top of that, it has an audio processor with an 1/8" audio output jack so it can play sound files and generate noise. Furthermore, it even has an accelerometer that can detect motion in three direction so you have even more input available to control the audio and lights. It also comes with a microphone. To top it off, it can act as a MIDI device! It can use the USB port as the MIDI interface or it can use the UART connector for MIDI. The micro-USB connector is used for power but also acts as a USB removable drive for easy access to the source code files and easily upload sound files. It can also serve as a MIDI USB interface to interact with MIDI software. The USB can also serve as a generic USB HID (Human interface device) like a mouse or keyboard to send events to a computer that it understands like a keypress or a mouse event. In this tutorial, I try to provide an overview of all the capabilities and give you an idea of all the possibilities with this board. You will find several code examples that focus on one specific aspect of the board. NeoTrellis M4 Board components The NeoTrellis M4 board is made up of several chips. The name NeoTrellis M4 is a combination of the various products it is built with. When you understand how the components fit together, you can really appreciate the form-factor and engineering that went in to it. Let's break it down a little further. These are the main chips that we will look at: SAMD51 Flash storage ADXL343 Accelerometer NeoPixels Elastomer keypad MAX4466 Microphone amplifier TRSS Audio connector USB connector 4-JST-PH connector SAMD51 processor The SAMD51 is the main microcontroller is a 32-bit ARM processor. It is a Cortex-M4 high performance embedded processor. It runs with 3.3V power. It has 512KB flash storage (for the program code) and for memory it has 192KB SRAM (to store variables during run-time). The NeoTrellis M4 board comes with another chip dedicated to storage, but we'll look at that later. The SAMD51 runs at 120MHz, or 0.120GHz. While it is not much to be impressed with when you compare it to a 64-bit 32-core 4.2GHz AMD Ryzen Threadripper 2990WX, but when you compare it to an Arduino Uno, which clocks in at 16MHz with an 8-bit ATmega328P, the SAMD51 is about 10-times faster and has much more floating-point precision with 32-bits, making it much more suitable for real-time audio processing. For further reference, a current Raspberry Pi 3B has a Cortex-A53 ARM that clocks in around 1.5GHz with 4-core and 64-bits. One other key factor in the SAMD51 is tha it contains two digital-to-analog (DAC) converters (12-bit, 500KSPS) that are used to generate the two analog output channels for stereo sound, as well as hardware accelerated audio processing. QSPI FLASH storage The board comes with an 8MB QSPI flash storage, which is good enough to store many low quality WAV files and your Python source code along with supporting configuration files. This 8MB storage is the removable drive you see named CIRCUITPY when connecting it via USB to a computer. NeoPixels The RGB LEDs are Adafruit NeoPixels. The nice thing about NeoPixels is that they come with libraries that are easyt to use and come in a variety of form factors from strips, to sew-on buttons, to a grid like is on the NeoTrellis M4 board. There is a copper ring that surrounds each NeoPixel that is used for button press detection. These are connected on pin 10 of the main microcontroller if using Arduino software to control them. Elastomer keypad The elastomer keypad is an important component because there is a conductive ring around the bottom of each button that connects with the copper ring that surrounds the NeoPixel LEDs. Connecting the conductive ring from the bottom of the button to the circuit on the board is how button presses are detected. The silicone allows the light from the NeoPixel below it to shine through. ADXL343 accelerometer The ADXL343 is a three-axis accelerometer that lets you detect acceleration/tilt in three directions. You can use it to turn the board in to a joystick, or just use the tilt information for general input. TRRS audio jack The board comes with a TRRS 1/8" audio headset jack so you can use any standard headphones or connect standard speakers to it. It can also be used as an input line if programmed that way. It has more than the normal three pins: ground, left, and right. It has an extra pin on the jack that goes to the MAX4466 mic amplifier and through the analog-to-digital converter before going to the SAMD51 processor. This means you can use iPhone earbuds that have the built in microphone with it and it will support stereo output and be able to use your microphone. The audio pins are analog 1 (left) and analog 2 (right) if using Arduino. The equivalents in CircuitPY are board.A0 (right) and board.A1 (left). It can potentially also detect the up/down and pause button presses on a headset. See https://learn.adafruit.com/adafruit-neotrellis-m4/board-tour#microphone-input-2-13 for more details. Microphone amplifier The board does not have a microphone itself, but it has an MAX4466 electret mic amplifier that goes in to an analog-to-digital converter (ADC) that allows the processor to use the microphone input. The audio jack connects to this allowing the use of headphone+microphone combos. Input is available on board.MICOUT in CircuitPy. The Arduino equivalents is PIN_MIC. Micro-USB connector It comes with a micro-USB connector that is used for power. It also allows you to connect it to a computer and have it detected as a removable disk drive. You can also configure it to act as a generic USB-HID device like a keyboard, mouse, or joystick, or have it act like a MIDI device. JST connector & GPIO Between the USB connector and the audio jack, there is white connector with four pins. This is the JST connector. More specifically, 4-pin JST-PH connector. It has four pins: power (3.3V), ground, and two general purpose pins for doing whatever you want. The two general pins can be used for just about anything you want, including MIDI, digital in/out, ADC, UART, and I2C. This feature makes it incredibly easy to connect and disconnect various devices. Around the edge of the board there are areas with a series of 5 copper stripes together. These are the equivalent to the four pins in the JST connector, with one extra (INT). You can use these to connect additional devices. Start from scratch By 'start from scratch' I mean updating the bootloader and then installing CircuitPy and then restoring the default sample files. This way you can restore your board to a clean state no matter how bad you mess it up and make sure you have the latest versions. If you got the board from Adafruit it should already have the bootloader and sample code on it so you don't need to do all these steps. In my case the bootloader was old and I wanted to fully understand how it worked so I wanted to start from scratch. Install bootloader Plug in the USB to a computer. In its default state from packaging it will connect as a removable drive named CIRCUITPY. Double-tap the reset button on the bottom side of the board to restart it in setup mode. It will create a new removable drive named TRELM4BOOT (Trellis M4 Bootloader). Download the .uf2 file that contains the upadted bootloader from Bootloader updater uf2. It will have a name like update-bootloader-trellis_m4-v2.0.0-adafruit.7.uf2. Do not change the name. Copy-and-paste the .uf2 file to the TRELM4BOOT drive. It will disconnect itself and process the file, removing it in the process. It will boot back in to a drive named TRELM4BOOT. Check the info file to see what version it is. Install CircuitPy After the bootloader is installed, and your board is connecting over USB as the TREL4BOOT drive still, you can then install CircuitPy. Install CircuitPy by downloading it from Circuit Python uf2. It will have a name like adafruit-circuitpython-trellis_m4_express-en_US-4.0.2.uf2. Copy-and-paste the .uf2 file over to the TRELM4BOOT drive. It will disconnect itself again and run the file. This time it will boot in to a CIRCUITPY drive. This is where you can place an updated code.py file. You can also download the default files that go in the CIRCUITPY drive from https://learn.adafruit.com/adafruit-neotrellis-m4/circuitpython The most important files to keep are the lib folder which contains the importable Python modules, and code.py which is the entry point on boot. Connect via serial console To see the STDOUT text output, you can monitor it over the serial connection. This step is not required but is helpful for debugging. If you connect after the board has already been running for a while, it may not actively be printing anything to STDOUT and you may see a blank screen. In this case, you can press CTRL-C and it will exit the currently running Python script. It will ask you if you want to enter the REPL or restart the Python program with CTRL-D. This makes it easy for you to run raw Python commands and debug. Once in the REPL, you can execute Python code. You can run some commands to get some more information about the environment: >>> import sys >>> sys.version '3.4.0' >>> sys.path ['', '/', '.frozen', '/lib'] >>> sys.implementation (name='circuitpython', version=(4, 0, 2)) >>> sys.platform 'MicroChip SAMD51' The sys.path is a list of directories where it will look for modules when calling import. Learn more about Python syspath in my Python import, sys.path, and PYTHONPATH Tutorial You can load and execute a Python source file from the REPL like this: # Execute a Python file from the REPL >>> exec(open('code.py').read()) Programmatically Note that you can also use various programming languages to connect and communicate over serial. For example, you can also use Python from your host environment to connect to the board over serial with PySerial. This isn't recommended unless you have a particular reason for connecting programmatically. The easier way is to simply use putty. Read on for more options. Windows Check which serial port is being used for the device. Go to Device Manager, and expand Ports (COM & LPT). You will see a device listed like USB Serial Device (COM4). If you aren't sure which one it is, you can unplug and replug your device to see which one shows up as new. Connect using putty or MobaXTerm with the serial option. Set the speed to 115200 and the port to COM4 or whatever name your device manager listed. Linux/Mac Identify the serial port/device name by checking in /dev/. It will have a name like ttys004 or ttyACM4. If you aren't sure which device it is, you can check the list of devices in /dev/ before and after plugging it in to see which one is new. Try ls /dev/tty* to see the list of devices. Alternatively, you can use dmesg to look for information about recently connected devices. Connect using any serial client. You can use putty on Linux just like Windows. You can also use screen like screen /dev/ttyACM0 115200. You may need to run it with sudo or add yourself to the device group (e.g. dialout in Fedora). Code examples The most important file on the CIRCUITPY drive is the code.py file. Whenever the board is powered up, this is the file it will run. You can browse the default code.py for an example of how to use the different things like: Interacting with serial console Controlling NeoPixel LEDs Detecting button presses Reading files Reading data from the accelerometer Playing a .wav file out Generate raw audio Get microphone input UART communication MIDI input and output over USB and UART We will look at simple code examples that isolate each of these in order to better understand each aspect. To upload and run the code, you simply need to copy your code.py file over to the CIRCUITPY removable drive. Copy over any other support files that you need if you have any configuration files our sound files to go with your program. Any time you modify a file on the disk, it will restart and re-run the code.py file. The rotation value provided to the TrellisM4Express constructor indicates the orientation that the board is intending to use. For example, if you plan to stand it upright vs use it horizontally. (0, 0) is supposed to be the top-left. 0 degree rotation is horizontal with the USB connector facing away from you. 90 degree rotation is vertical with USB connector to the right. Interact with serial console Since the serial console is just using STDIN and STDOUT communication, you can use print() and input() to interact. For example: # serial_example.py print('Hello') name = input('Enter your name: ') print("Your name is: %s" % name) Control NeoPixel LEDs To control the NeoPixels, first instantiate the TrellisM4Express class, and then access the pixels via the pixels property. Here is an example of how to check the size of the grid, change the brightness, fill the whole board with a color, and control specific pixels. Remember to call show() in order to display the changes. The lights will all turn off once the program exits, so there is an infinite loop at the end to keep the program from exiting. NeoPixels are on pin 10. import time import adafruit_trellis_express trellis = adafruit_trellis_express.TrellisM4Express(rotation=90) print('Width: %s' % trellis.pixels._width) print('Height: %s' % trellis.pixels._height) print('Total buttons: %s' % (trellis.pixels._width * trellis.pixels._height)) # Change the overall brightness 0-1 trellis.pixels._neopixel.brightness = .25 # Fill every pixel with a certain color (RED, GREEN, BLUE) # (0, 0, 0) is black/empty/off # (255, 255, 255) is white trellis.pixels._neopixel.fill((0, 0, 0)) # Set specific neopixels. Rotation value affects grid coordinates trellis.pixels._neopixel[17] = (255, 0, 0) # Pixel 17 to red trellis.pixels[(2, 1)] = (0, 255, 0) # Pixel (2, 1) to green # Changes to neopixels won't be displayed until `show()` is called trellis.pixels._neopixel.show() # Do nothing else except stay on while True: time.sleep(300) Detect button presses Here is a simple example that shows how to detect button presses. It will print out any button presses detected to the serial console. import adafruit_trellis_express trellis = adafruit_trellis_express.TrellisM4Express(rotation=90) while True: # Keypress is stored as a separate variable because `trellis.pressed_keys` # might detect a key press on one line, but when read later on a different # line, no keypress is detected. Storing it ensures the pressed key # is not lost between the time it is checked and the time it is used. pressed_buttons = trellis.pre'''
