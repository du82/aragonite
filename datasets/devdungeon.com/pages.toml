title = "PyPortal CircuitPy Tutorial (AdaBox 011) | DevDungeon"
description = "The PyPortal is an awesome little IoT device that is programmable with CircuitPython. It's got wi-fi, a color touch screen, a speaker and speaker connector, microSD card slot, 8MB flash memory, a light sensor, a temperature sensor, a NeoPixel LED, a few JST connectors, and more! You can buy a PyPortal at [https://www.adafruit.com/product/4116](https://www.adafruit.com/product/4116). This tutorial covers the PyPortal that came in AdaBox011. I don't believe there are any differences between the AdaBox version and the one you can buy separately from the shop. In this tutorial we will take a look at the various components and how to use them in CircuitPython with code examples for each. After following the tutorial you should have a solid grasp on the PyPortal. Since the hardware and software is open source, you can find the sources online: - [EagleCAD PCB files](https://github.com/adafruit/Adafruit-PyPortal-PCB) - [Schematic files](https://learn.adafruit.com/adafruit-pyportal/downloads) - [Fritzing PyPortal object](https://github.com/adafruit/Fritzing-Library/blob/master/parts/Adafruit%20PyPortal%20-%20CircuitPython%20Powered%20Internet%20Display.fzpz) - [Laser cutting files for stand](https://learn.adafruit.com/adabox011/build-the-pyportal-stand) - [CircuitPython source](https://github.com/adafruit/circuitpython) - [CircuitPython PyPortal libary](https://github.com/adafruit/Adafruit_CircuitPython_PyPortal) - [Adafruit CircuitPython libraries](https://github.com/adafruit/Adafruit_CircuitPython_Bundle/releases/)"
full_description = '''Submitted by nanodano on Sun, 07/14/2019 - 19:31 Introduction The PyPortal is an awesome little IoT device that is programmable with CircuitPython. It's got wi-fi, a color touch screen, a speaker and speaker connector, microSD card slot, 8MB flash memory, a light sensor, a temperature sensor, a NeoPixel LED, a few JST connectors, and more! You can buy a PyPortal at https://www.adafruit.com/product/4116. This tutorial covers the PyPortal that came in AdaBox011. I don't believe there are any differences between the AdaBox version and the one you can buy separately from the shop. In this tutorial we will take a look at the various components and how to use them in CircuitPython with code examples for each. After following the tutorial you should have a solid grasp on the PyPortal. Since the hardware and software is open source, you can find the sources online: EagleCAD PCB files Schematic files Fritzing PyPortal object Laser cutting files for stand CircuitPython source CircuitPython PyPortal libary Adafruit CircuitPython libraries PyPortal board components There are several chips, sensors, and connectors on the board so let's break it down and make sure we understand what it has and what the parts do. For more details about the specific pins being used by each component, check out https://learn.adafruit.com/adafruit-pyportal/pinouts SAMD51 The main processor that sits roughly in the center of the board is an ATMEL ATSAMD51J20 Cortex M4 that clocks in at 120MHz and runs off 3.3V power. It comes with 1MB of built-in Flash storage and 256KB of RAM. QSPI flash storage The flash storage chip sits between the reset button and the SAMD51 processor and can store up to 8MB of data. This includes the Python source code files as well as any images, sound files, and libraries needed to support your application. This storage is the 8MB CIRCUITPY removable drive you see when it is connected to your computer. MicroSD card slot Even though the board comes with an 8MB flash storage chip, that can be quite limiting because it is fairly small and it is read-only from your source code. By adding the microSD card slot it allows you to add huge amounts of extra storage that you can both read from and write to. You can get microSD cards that can store 1TB of data and you can easily swap them out so it is a very useful addition. It uses board.SD_CS for the CS pin or Arduino D32. There is also a board.SD_CARD_DETECT/D33 to see if a card is present. ESP32 wifi processor The Espressif ESP32 is a Wi-Fi processor that is very common in IoT devices and frequently used with Arduino boards. The main purpose on this board is to provide Wi-Fi that includes encrpytion (TLS/SSL) support allowing you to do all the normal HTTP and HTTPS requests you would expect to be able to do. Since it handles all of the encryption and network processing, the SAMD51 processor is free to handle all other operations. The board is configured to use board.ESP_CS, board.ESP_BUSY, and board.ESP_RESET, or Arduino pins 8, 5, 7, respectively. Speaker & Speaker plug Built in speaker and a 2-pin Molex PicoBlade connector for an 8-16 ohm speaker. It is on pin A0 or board.AUDIO_OUT. There is a solder jumper next to the speaker that sends the electricity to both the internal and external speaker. Cut it to send all the power to the external speaker only. TFT touch screen One of the main components is a 3.2" color touch screen with 320x240 resolution. The board uses board.TOUCH_YD, board.TOUCH_YU, board.TOUCH_XL, and board.TOUCH_XR or Arduino pints 4, 6, 5, and 7 respectively. Additionally, there are control pins: board.TFT_RESET, board.TFT_WR/board.TFT_DC, board.TFT_RD, board.TFT_RS, board.TFT_CS, board.TFT_TE, or Arduino pins 24, 25, 9, 10, 11, 12 respectively. The backlight can be set with board.TFT_BACKLIGHT or A25. Light sensor The light sensor is on pin A2 or board.LIGHT and sits between the ESP32 wifi chip and the microSD card slot. ADT7410 temperature sensor This is a temperature sensor from Analog Devices. It doesn't need any calibration. Since it is a chip on all on its own, it uses I2C to communicate. JST-PH connectors 2 x 3-pin JST-PH connector (board.D3/A1 and board.D4/A3 for GPIO) 1 x 4-pin JST-PH connector (I2C) MicroUSB connector There is a microUSB connector that lets you power the board, connect it to a computer as a removable drive to upload code, act as a USB HID device (like a keyboard, mouse, joystick), or as a MIDI sender or receiver, among other things. NeoPixel LED On the board is a single NeoPixel LED that can be used as a status indicator. It is on the back of the board so it's not quite visible if you had it mounted on the wall. The NeoPixel is on pin D2 or board.NEOPIXEL. Other LED There is also an LED right behind the microUSB connector. This LED is on the standard pin D13 or board.L. Setup The PyPortal from the AdaBox already comes with CircuitPy installed, but if you need to wipe the board and start over, double tap the reset button on the back of the board while it is plugged in via USB to a computer. This will put it in to boot mode where you can modify the firmware and you should see a removable drive named PORTALBOOT. Install CircuitPy firmware Once you have the PORTALBOOT removable drive available, download the latest version of CircuitPy from https://circuitpython.org/board/pyportal/. When you have the .uf2 file downloaded, copy it over to the PORTALBOOT drive. It will automatically detect that a file has been copied, and it will reboot itself and install CircuitPy. After it restarts itself, you should then see a removable drive named CIRCUITPY instead of PORTALBOOT. At this point you have a working CircuitPython setup where you can write Python code and put it in code.py. If you want to completely clear the CIRCUITPY drive removing all libraries, static files, and libraries, you have a few options. You can simply delete all of the files from your computer's file explorer, you can use your system tools to format it as a FAT drive, or you can connect to the REPL via serial and run: >>> import storage >>> storage.erase_filesystem() This will give you a clean drive that you can re-install the default software in the next section. Note that this will only format the CIRCUITPY drive and not the PORTALBOOT drive so the CircuitPy firmware is left intact and you can simply drop in a new code.py file and it will execute as expected. Without a code.py file it will default to printing the serial output on the TFT screen. Install default example program You can download the default sample program (random quotes display) from https://learn.adafruit.com/adabox011/updating-your-pyportal. You can clear out the whole drive before copying over the default files. In the zip file, there is a directory that contains all of the files including the most important file: code.py. Copy all of those files in to the root of the CIRCUITPY drive so it contains code.py and the lib directory are sitting in the root of the drive. The lib directory is where all the libraries go and where Python will look when importing modules. It will automatically detect when any files change and restart itself. To get the default code running properly, you will need to update secrets.py to have your Wi-Fi network name and password. Connect to serial console To debug or use the Python REPL, you can connect using serial over USB. When it is plugged in to a computer it will be accessible as a serial device. The PyPortal uses a baud rate of 115200. I recommend using one of the following programs to connect over serial: PuTTy (Windows/Linux) MobaXTerm (Windows) GNU Screen (Linux/Mac) Arduino IDE (Windows/Linux/Mac) Android Serial Console (Android) Android Serial USB Terminal (Android) For more information, check out my tutorial How to Connect to a Serial Console. Once connected to the serial console you can monitor the serial output or interact with it like a console. There is also a Python REPL that you can use. Using the REPL In the REPL, you can execute Python code. You can run some commands to get some more information about the environment: >>> import sys >>> sys.version '3.4.0' >>> sys.path ['', '/', '.frozen', '/lib'] >>> sys.implementation (name='circuitpython', version=(4, 0, 2)) >>> sys.platform 'MicroChip SAMD51' The sys.path is a list of directories where it will look for modules when calling import. Learn more about Python syspath in my Python import, sys.path, and PYTHONPATH Tutorial. You can load and execute a Python source file from the REPL like this: # Execute a Python file from the REPL >>> exec(open('code.py').read()) Code examples Let's look at how you would use the various components on the board. You will find some code samples below or links to official code examples. Interact with serial console Since the serial console is just using STDIN and STDOUT communication, you can use print() and input() to interact. For example: # serial_example.py print('Hello') name = input('Enter your name: ') print("Your name is: %s" % name) Read files from flash storage You can use regular Python syntax for reading files from the CIRCUITPY drive. The file system is read-only from the source code, but you can put files on the drive when it connected to a computer and it shows up as the removable drive. with open('code.py') as source_file: print('Code.py contents:') print(source_file.read()) Use the SD card The PyPortal does not come with a microSD card but you can insert one in to the connector it provides. Once you insert a microSD card, you can use it by Get all libraries including the SD card library and its dependencies from GitHub at Adafruit CircuitPython Bundle You will need at a minimum the libaries in your lib/ directory: adafruit_bus_device/ adafruit_sdcard.mpy I had a few errors along the way to get this working. After making sure I upgraded all of the libraries to the latest version I had better luck. Note that I had trouble using Samsung EVO SD cards and got the error: "OSError: timeout waiting for v2 card", however it worked with generic 8GB and 256GB cards. I was able to read and write files on the 256GB disk, however when trying to do the os.statvfs to calculate the total disk size it would take forever and basically hang the program. It uses board.SD_CS for the CS pin or Arduino D32. There is also a board.SD_CARD_DETECT/D33 to see if a card is present. import os import busio import digitalio import board import storage import adafruit_sdcard # See if a card is present card_detect_pin = digitalio.DigitalInOut(board.SD_CARD_DETECT) card_detect_pin.direction = digitalio.Direction.INPUT card_detect_pin.pull = digitalio.Pull.UP print('SD card present: %s' % card_detect_pin.value) # Try to connect to the SD card sdcard = adafruit_sdcard.SDCard( busio.SPI(board.SCK, board.MOSI, board.MISO), digitalio.DigitalInOut(board.SD_CS) ) # Mount the card to a directory virtual_file_system = storage.VfsFat(sdcard) storage.mount(virtual_file_system, '/sd') # At this point, you can use it like a normal file system. # Create files, open files, create directories, etc # Calculate disk space # Avoid performing this disk size calculation on very large disks (takes too long) # Works just fine on 8GB disks, hangs on 256GB disks vfs_stats = os.statvfs('/sd') # Total size = block size * number of blocks total_size_in_mb = int(vfs_stats[0] * vfs_stats[2] / (1024 * 1024)) # Free space = block size * number of available blocks available_space_in_mb = int(vfs_stats[0] * vfs_stats[3] / (1024 * 1024)) print('Disk size: %s MB' % total_size_in_mb) print('Free space: %s MB' % available_space_in_mb) print('Used space %s MB' % (total_size_in_mb - available_space_in_mb)) # Create/open a file and write to it with open('/sd/test.txt', 'w') as output_file: output_file.write('Hello, world!\n') # Print contents of SD card root directory for file_name in os.listdir('/sd'): stats = os.stat('/sd/' + file_name) file_size = stats[6] # Size in bytes is_dir = stats[0] & 0x4000 # Bitmask if is_dir: print('Dir: %s' % file_name) else: print('File: %s (%s bytes)' % (file_name, file_size)) # Unmount the SD card storage.umount('/sd') Use "regular" LED There is an LED on D13 or board.L. This example shows how to use the 'regular' LED. We will look at using the NeoPixel LED in the next example. For more information on using digitalio, check out the digitalio CircuitPy documentation. There are no library dependencies needed in the lib directory. It is built in to CircuitPython. import digitalio import board import time led = digitalio.DigitalInOut(board.L) # Or board.D13 led.direction = digitalio.Direction.OUTPUT while True: led.value = True time.sleep(1) led.value = False time.sleep(1) Use NeoPixel LED The NeoPixel is on board.NEOPIXEL/D2 and is an RGB LED with controllable brightness. For more information on working with the NeoPixel check out the CircuitPython NeoPixel documentation. There is one dependency that you will need in your lib directory, which you can get the library from Adafruit CircuitPython Bundle. neopixel.mpy import board import neopixel import time # Connect to the NeoPixel (there is only one so it is index 0) # auto_write means we don't have to call pixels.show() each time pixels = neopixel.NeoPixel(board.NEOPIXEL, 1, auto_write=True) while True: pixels[0] = (255, 0, 0) # Red, green, blue time.sleep(.25) pixels[0] = (0, 0, 255) time.sleep(.25) Use the speaker The audio output is on pin A0 or board.AUDIO_OUT. By default it will use the small built-in speaker, but you can also use the 2-pin Molex PicoBlade to connect an 8-16 ohm speaker. If you plug in a speaker it will go to both the buit-in speaker and external speaker unless you cut the solder jumper that is right next to the speaker. Cutting it will also allow more of the electricity to flow to the speaker, making it louder. In CircuitPython, you can use the audioio module to output sound. You can output raw waveforms or .wav files. You can learn more about using audio out with CircuitPython and examples at https://learn.adafruit.com/circuitpython-essentials/circuitpython-audio-out. Play .wav files This example shows how to play a .wav file. It uses the pyportal_startup.wav file which you can download from here: PyPortal demo files. The audio file should be in the root of the CIRCUITPY drive. There are no library dependencies needed in the lib directory since audioio is a built-in CircuitPy library. import audioio import board import time def play_sound_file(file_path): try: with open(file_path, "rb") as f: wave = audioio.WaveFile(f) audio.play(wave) while audio.playing: time.sleep(0.005) except OSError as e: print('Error opening file: %s' % e) with audioio.AudioOut(board.AUDIO_OUT) as audio: # or board.A0 play_sound_file("pyportal_startup.wav") Play raw audio This example shows how to generate and play a sine wave through the board.AUDIO_OUT/board.A0. There are no library dependencies needed in the lib directory. # Adapted from examples at: # https://circuit'''
