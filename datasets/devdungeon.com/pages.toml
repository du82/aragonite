full_description = "Help Desk Bot is Discord bot written in Python 3 with a variety of commands. Source Code https://github.com/DevDungeon/HelpDeskBot Screenshot Installation pip install helpdeskbot Running Pass the command-line launcher the name of the channel it should listen in and the file with the bot token. # Usagehelpdeskbot <channel-name> <token_file># Example usagehelpdeskbot help-desk bot_token.txt In the chat channel, type ?help to get a list of commands. Some commands include: ?8ball ?bitcoin Tutorials Make a Discord Bot with Python - Part 1 Make a Discord Bot with Python - Part 2 Similar Projects There is another DevDungeon Discord bot project named Chatty Cathy, an AI conversational chat bot. For an AI chat bot in Python check out Chatty Cathy Discord bot and the AI Chat Bot in Python with AIML tutorial. Tags: PythonDiscordBotsysadminProjectutility"
