title = "Change Console Font Size in Debian | DevDungeon"
description = "## Introduction If you do a base install of Debian with no graphical desktop, you'll only have the console terminal. You can change this font to make it larger. ## dpkg-reconfigure Use the `dpkg-reconfigure` tool to update the console. ``` sudo dpkg-reconfigure console-setup ``` When you run it, it will ask you - Encoding: UTF-8 - Character set: Guess best - Font: Try Terminus or Terminus Bold with framebuffer Try out different fonts to see what works best for you. ## Conclusion You should now be able to resize and change the font for the non-graphical console in Debian."
full_description = '''Submitted by nanodano on Mon, 03/08/2021 - 21:56 Introduction If you do a base install of Debian with no graphical desktop, you'll only have the console terminal. You can change this font to make it larger. dpkg-reconfigure Use the dpkg-reconfigure tool to update the console. sudo dpkg-reconfigure console-setup When you run it, it will ask you Encoding: UTF-8 Character set: Guess best Font: Try Terminus or Terminus Bold with framebuffer Try out different fonts to see what works best for you. Conclusion You should now be able to resize and change the font for the non-graphical console in Debian. <p><a href="http://devdungeon.disqus.com/?url=https%3A%2F%2Fwww.devdungeon.com%2Fcontent%2Fchange-console-font-size-debian">View the discussion thread.</a></p> Tags: LinuxDebian nanodano's blog'''
