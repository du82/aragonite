["https://www.devdungeon.com/content/making-tor-http-requests-go"]
title = "Making Tor HTTP Requests with Go | DevDungeon"
description = "Learn how to make a request using the Tor proxy with the Go programming language."
full_description = '''Submitted by nanodano on Fri, 09/16/2016 - 11:42 Go provides standard packages for working with HTTP, URLs, and proxies. Below is an example of how to make an HTTP request using a Tor proxy with the Go programming language. The key difference from making a standard HTTP request is that you must configure the HTTP client to use the proxy. This is done by creating a proxy dialer, creating an HTTP transport that uses that proxy dialer, and then creating an HTTP client that uses that transport. Check out the example below. If you do not already have Tor setup, you can follow these instructions for setting up Tor in Linux or download the Tor Browser Bundle. package mainimport ( "io/ioutil" "log" "net/http" "net/url" "time")// URL to fetchvar webUrl string = "https://check.torproject.org"// Specify Tor proxy ip and portvar torProxy string = "socks5://127.0.0.1:9050" // 9150 w/ Tor Browserfunc main() { // Parse Tor proxy URL string to a URL type torProxyUrl, err := url.Parse(torProxy) if err != nil { log.Fatal("Error parsing Tor proxy URL:", torProxy, ".", err) } // Set up a custom HTTP transport to use the proxy and create the client torTransport := &http.Transport{Proxy: http.ProxyURL(torProxyUrl)} client := &http.Client{Transport: torTransport, Timeout: time.Second * 5} // Make request resp, err := client.Get(webUrl) if err != nil { log.Fatal("Error making GET request.", err) } defer resp.Body.Close() // Read response body, err := ioutil.ReadAll(resp.Body) if err != nil { log.Fatal("Error reading body of response.", err) } log.Println(string(body)) log.Println("Return status code:", resp.StatusCode)} Reference https://godoc.org/golang.org/x/net/proxy https://golang.org/pkg/net/http/ https://golang.org/pkg/net/url/ https://gist.github.com/Yawning/bac58e08a05fc378a8cc <p><a href="http://devdungeon.disqus.com/?url=https%3A%2F%2Fwww.devdungeon.com%2Fcontent%2Fmaking-tor-http-requests-go">View the discussion thread.</a></p> Tags: GoTor nanodano's blog'''
