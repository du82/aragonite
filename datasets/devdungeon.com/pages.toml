["https://devdungeon.com/content/command-line-arguments-php"]
title = "Command Line Arguments in PHP | DevDungeon"
description = "In PHP, all command line arguments, including the script name itself are stored in a special array named $argv. The first element, zero, is the name of the script being run. For example:"
full_description = '''Submitted by nanodano on Mon, 07/27/2015 - 19:31 In PHP, all command line arguments, including the script name itself are stored in a special array named $argv. The first element, zero, is the name of the script being run. For example: <?phpecho "This script being executed is named " . $argv[0] . ".\n"; If you run php myScript.php The output will be This script being executed is named test.php. The output will be the same if you begin the file with a shebang like #!/usr/bin/php and run the script by typing ./myScript.php All subsequent arguments will be in the $argv array.<p><a href="http://devdungeon.disqus.com/?url=https%3A%2F%2Fwww.devdungeon.com%2Fcontent%2Fcommand-line-arguments-php">View the discussion thread.</a></p> Tags: PHPCLI nanodano's blog'''
