["https://www.devdungeon.com/gpg"]
title = "Public PGP Keys | DevDungeon"
description = "Here is my public GPG key. This key is used for communication typically via email or XMPP at nanodano@devdungeon.com. To learn more about GPG and how to use it visit my [GPG Tutorial](https://www.devdungeon.com/content/gpg-tutorial)."
full_description = "Here is my public GPG key. This key is used for communication typically via email or XMPP at nanodano@devdungeon.com. To learn more about GPG and how to use it visit my GPG Tutorial. To get my public key, there are three main options: Directly downloading the file over HTTP Using gpg to fetch from a public key server like MIT Copy and paste the file contents Direct download You can download my public key file directly from https://www.devdungeon.com/nanodano.gpg # Download and import nanodano@devdungeon.com public key curl -O https://www.devdungeon.com/nanodano.gpg gpg --import nanodano.gpg gpg --list-keys Fetch from a public key server You can use gpg to fetch the public key directly from MIT's public PGP key server http://pgp.mit.edu or [https://sks-keyservers.net/](SKS Keyservers). You only need to get it from one. It won't hurt to fetch from both but hopefully at least one works. If the keyservers are down, you'll have to use one of the other methods # Import nanodano@devdungeon.com public key from keyserver gpg --keyserver pgp.mit.edu --recv A6D4E83A1866995E gpg --keyserver hkps.pool.sks-keyservers.net --recv A6D4E83A1866995E gpg --list-keys Copy and paste You can copy and paste the key below and save it to a file. The name of the file is not too important. You can name it nanodano.gpg. After saving the contents below to a file, use gpg to import the key like this: # Import nanodano@devdungeon.com public key gpg --import nanodano.gpg gpg --list-keys Here is the contents of nanodano.gpg: -----BEGIN PGP PUBLIC KEY BLOCK----- mQINBGCtrdYBEADDBJiacdCT5scapdK+dYsyOJC8K+RDAWYyr5z/POizTVLSa3Hk yu5qyVrQ6NDEmSV1OI4pGF5KUonEaBjxYJ5GTdi0g+bgbfoH+0qJEFGZZ7VTEka7 eXewd4WS0ZX+dEHwF39Xaskxm/aLkHKIhrUPvM6m30BCxYfKOKpOFSlmVFM+z6c7 fFAeQJw8cNTjEqFQLPUNGcDxv/HMmgZz+fFe/FqWQqCPx6GpnIQc0L7ovaUYe2mF dXvjxq6KKtTiKN5WLtfTGt+Nghm4LwMt7hmbP/29RhCloFyIQxjaI+07OZVmoNQs Deub6Ld0B43hCPDgE2b7pmRhnPmMEp0GNXZt07d/OHcLd1PYvvyZWcRzJeUZiiL6 TIKCZUyAPqlnmV31yxQrM+E7cAeUgeOwlGla