full_description = '''Submitted by nanodano on Tue, 07/28/2015 - 19:22 Control structures like if/else statements, for loops, and switch cases are vital to writing program logic. These code snippets will serve as easy references for these control structures when writing with the Tcl programming language # If, elseif, elseif {$x > 3} { puts "x is greater than 3"} elseif {$x < 3} { puts "x is less than 3"} else { puts "x must equal 3 since it is the only option left"} # Foreachforeach name $customerList { puts name #continue can be used to jump to the next iteration} # Whilewhile {$x < 100} { puts $x incr x # Increment $x #break can be used to exit loop} # Switchputs "Enter your name: "gets stdin nameswitch $name { "NanoDano" { puts "Hello master." } "Jim Raynor" { puts "Welcome, Commander!" } default { puts "You must not be important." }} <p><a href="http://devdungeon.disqus.com/?url=https%3A%2F%2Fwww.devdungeon.com%2Fcontent%2Fcontrol-structures-tcl">View the discussion thread.</a></p> Tags: tcl/tk nanodano's blog'''
