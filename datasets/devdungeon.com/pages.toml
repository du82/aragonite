["https://devdungeon.com/content/coffeescript-basics"]
title = "CoffeeScript Basics | DevDungeon"
description = "CoffeeScript is an evolution of JavaScript. It actually compiles down to optimized JavaScript. It feels a lot like Python because of the significant whitespace, and lack of semi-colon line endings and curly braces. The syntax is a lot sparser than JavaScript which lends to its readability and simplicity. CoffeeScript can be run as an interpreter or a compiler. You can write plugins for the GitHub Atom Editor using CoffeeScript. The compiled JavaScript can be used for a web application or for command line applications run by Node.js."
full_description = '''Submitted by nanodano on Sat, 08/01/2015 - 21:29 CoffeeScript is an evolution of JavaScript. It actually compiles down to optimized JavaScript. It feels a lot like Python because of the significant whitespace, and lack of semi-colon line endings and curly braces. The syntax is a lot sparser than JavaScript which lends to its readability and simplicity. CoffeeScript can be run as an interpreter or a compiler. You can write plugins for the GitHub Atom Editor using CoffeeScript. The compiled JavaScript can be used for a web application or for command line applications run by Node.js. Installing CoffeeScript Package with NPM npm install -g coffee-script Using the CoffeeScript Shell Coffee provides an interactive shell. The REPL can be used just by running the coffee program without any arguments. Once in the shell you can start typing code. coffee Running a CoffeeScript Program You can run a CoffeeScript file directly without compiling it to JavaScript. This is useful for running command line programs. coffee myScript.coffee Compiling CoffeeScript to JavaScript This will compile our CoffeeScript file myCoffeeScript.coffee in to a JavaScript file. The --compile option can be swapped out with its equivalent short option of -c. You can also specify the output directory with -o or --output. Compiled JavaScript files can be run using Node.js or run in the browser. # Compile single file to current directorycoffee --compile myCoffeeScript.coffee# Compile an entire directory of coffee files and output them to a js directorycoffee --output /var/www/website/js /var/www/website/coffeeSources CoffeeScript Examples Now that we know how to use the interpreter and the compiler, let's look at some actual CoffeeScript code. ###Multiline comments are surrounded by triple hash tags#### Assignment is straight forwardx = 10alive = true# Wrapping function arguments in parenthesis is optionalconsole.log 'Hi'console.log('Hi')# Creating and calling a functiontriple = (x) -> x * 3twentyOne = triple 7# If statementsif x == true console.log 'It is so.'else console.log 'It is not so.'# Postfix if with an existence test (question mark)console.log "It's alive!" if frankensteinAlive?# If then on one lineif true == true then console.log 'Yes.'# Unlessunless x == 10 console.log 'Still not a 10...'# For loopfor element in [1, 1, 2, 3, 5, 8] console.log element# For loop with indicesfor element, index in myArray console.log index + " " + element# Postfix for loopconsole.log element for element in myArray# Create an arraymyArray = [1, 2, 3]# Create an Objectrectangle = area: (length, width) -> length * width perimeter: (length, width) -> length * 2 + width * 2# Use object methodconsole.log rectangle.area(15, 20)# Splats (...)# The ... signifies an array with# variable number of argumentssomeFunction = (firstArg, restOfArgs...) -> console.log firstArg, restOfArgs# Splats can go at the beginningsomeFunction = (someArgs..., lastArg) -> console.log someArgs, lastArg# Splats can go in the middle toosomeFunction = (firstArg, someArgs..., lastArg) -> console.log firstArg, someArgs, lastArg# Smart arrayscubes = (math.cube number for number in numberArray) <p><a href="http://devdungeon.disqus.com/?url=https%3A%2F%2Fwww.devdungeon.com%2Fcontent%2Fcoffeescript-basics">View the discussion thread.</a></p> Tags: JavaScriptCoffeeScriptNode.js nanodano's blog'''
