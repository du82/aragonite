["https://www.devdungeon.com/content/using-libpcap-c"]
title = "Using libpcap in C | DevDungeon"
description = "libpcap allows us to capture or send packets from a live network device or a file. This tutorial and code examples will walk you through using libpcap to find network devices, get information about devices, process packets in real time or offline, send packets, and even listen to wireless traffic."
full_description = '''Submitted by nanodano on Fri, 08/14/2015 - 22:19 Overview Intro Find a Network Device Get Info About Device Live Capture Print Packet Info Processing Packets with pcap_loop() Determining Packet Type Finding the Data Payload Loading Pcap File Wireless, Promiscuous, and Monitor Mode Using Filters Example Filters Closing Handle Sending Packets Bindings to Other Languages References Intro libpcap allows us to capture or send packets from a live network device or a file. These code examples will walk you through using libpcap to find network devices, get information about devices, process packets in real time or offline, send packets, and even listen to wireless traffic. This is aimed at Debian based Linux distributions but may also work on Mac OSX. Not intended for Windows, but WinPcap is a port that is available. Compiling a pcap program requires linking with the pcap lib. You can install it in Debian based distributions with sudo apt-get install libpcap-dev Once the libpcap dependency is installed, you can compile pcap programs with the following command. You will need to run the program as root or with sudo to have permission to access the network card. gcc <filename> -lpcap Find a Network Device The simplest program to start with will just look for a network device. We won't be able to do anything else if we can't get a device to work with. If you get a device called "any" bound to 0.0.0.0 that is acceptable. You can also us ifconfig or ip addr to get device names. /* Compile with: gcc find_device.c -lpcap */#include <stdio.h>#include <pcap.h>int main(int argc, char **argv) { char *device; /* Name of device (e.g. eth0, wlan0) */ char error_buffer[PCAP_ERRBUF_SIZE]; /* Size defined in pcap.h */ /* Find a device */ device = pcap_lookupdev(error_buffer); if (device == NULL) { printf("Error finding device: %s\n", error_buffer); return 1; } printf("Network device found: %s\n", device); return 0;} Get Info About Device Now we can expand on the simple program above. After we find a device, we can call pcap_lookupnet and it will tell us what the ip address and subnet mask of the device. It will also fill up the error buffer with an error message if something goes wrong. #include <stdio.h>#include <pcap.h>#include <arpa/inet.h>#include <string.h>int main(int argc, char **argv) { char *device; char ip[13]; char subnet_mask[13]; bpf_u_int32 ip_raw; /* IP address as integer */ bpf_u_int32 subnet_mask_raw; /* Subnet mask as integer */ int lookup_return_code; char error_buffer[PCAP_ERRBUF_SIZE]; /* Size defined in pcap.h */ struct in_addr address; /* Used for both ip & subnet */ /* Find a device */ device = pcap_lookupdev(error_buffer); if (device == NULL) { printf("%s\n", error_buffer); return 1; } /* Get device info */ lookup_return_code = pcap_lookupnet( device, &ip_raw, &subnet_mask_raw, error_buffer ); if (lookup_return_code == -1) { printf("%s\n", error_buffer); return 1; } /* If you call inet_ntoa() more than once you will overwrite the buffer. If we only stored the pointer to the string returned by inet_ntoa(), and then we call it again later for the subnet mask, our first pointer (ip address) will actually have the contents of the subnet mask. That is why we are using a string copy to grab the contents while it is fresh. The pointer returned by inet_ntoa() is always the same. This is from the man: The inet_ntoa() function converts the Internet host address in, given in network byte order, to a string in IPv4 dotted-decimal notation. The string is returned in a statically allocated buffer, which subsequent calls will overwrite. */ /* Get ip in human readable form */ address.s_addr = ip_raw; strcpy(ip, inet_ntoa(address)); if (ip == NULL) { perror("inet_ntoa"); /* print error */ return 1; } /* Get subnet mask in human readable form */ address.s_addr = subnet_mask_raw; strcpy(subnet_mask, inet_ntoa(address)); if (subnet_mask == NULL) { perror("inet_ntoa"); return 1; } printf("Device: %s\n", device); printf("IP address: %s\n", ip); printf("Subnet mask: %s\n", subnet_mask); return 0;} The program above will look up the device like the first program, but will go a step further and get information about the device as well. The next step is to use the device to actually capture packets. Later on we'll also look at opening an existing pcap file instead of capturing live. Live Capture The next example program will demonstrate how to open a network device for live capturing, and capture a single packet. We will use pcap_open_live to get a handle, just like we would when opening a file to get a file handle. Instead of a FILE type handle though it is a pcap_t type. #include <stdio.h>#include <time.h>#include <pcap.h>#include <netinet/in.h>#include <netinet/if_ether.h>void print_packet_info(const u_char *packet, struct pcap_pkthdr packet_header);int main(int argc, char *argv[]) { char *device; char error_buffer[PCAP_ERRBUF_SIZE]; pcap_t *handle; const u_char *packet; struct pcap_pkthdr packet_header; int packet_count_limit = 1; int timeout_limit = 10000; /* In milliseconds */ device = pcap_lookupdev(error_buffer); if (device == NULL) { printf("Error finding device: %s\n", error_buffer); return 1; } /* Open device for live capture */ handle = pcap_open_live( device, BUFSIZ, packet_count_limit, timeout_limit, error_buffer ); /* Attempt to capture one packet. If there is no network traffic and the timeout is reached, it will return NULL */ packet = pcap_next(handle, &packet_header); if (packet == NULL) { printf("No packet found.\n"); return 2; } /* Our function to output some info */ print_packet_info(packet, packet_header); return 0;} The program above will capture a single packet and then call print_packet_info(). I left that function out intentionally to keep the snippet above short. Let's take a look at print_packet_info() now. You will need to add that function after main(). Print Packet Info The print_packet_info() function will provide information about what type of ethernet packet it found (IP or ARP), the timestamp, packet length, and the source and destination of the packet. void print_packet_info(const u_char *packet, struct pcap_pkthdr packet_header) { printf("Packet capture length: %d\n", packet_header.caplen); printf("Packet total length %d\n", packet_header.len);} Processing Packets with pcap_loop() We've slowly been adding more and more to our capabilities with pcap. We've covered finding a device, opening a device, how to capture a single packet, and how to pull information from the packet. Capturing a single packet is not very practical though. If you are looking for a single packet, chances are it will not be the very first packet you see, but buried in a stream of many packets. Now we will talk about how to process all of the packets received continuously. This is where pcap_loop() comes in. The pcap_loop() function is provided by libpcap. This is what the declaration looks like in pcap.h. int pcap_loop(pcap_t *p, int cnt, pcap_handler callback, u_char *user) From the previous examples we know that pcap_t is the device handle from where we want to capture. The second argument is an int which is the number of packets you want to capture. Pass 0 for unlimited packets. The pcap_handler accepts a function name that is the callback to be run on every packet captured. We will look more in depth at that in a moment. The last argument to pcap_loop is arguments to the callback function. We do not have any in our example so we pass NULL. The pcap_handler argument for pcap_loop() is a specially defined function. This is the declartion of the type in pcap.h. /* The contract we have to satisfy with our callback function */typedef void (*pcap_handler)(u_char *, const struct pcap_pkthdr *, const u_char *); We will define our own callback function to handle packets, but it will have to match the format of the pcap_handler type. Here is an empty example. We will create a handler later that actually does something useful. void my_packet_handler( u_char *args, const struct pcap_pkthdr *header, const u_char *packet){ /* Do something with the packet here. The print_packet_info() function shows in the previous example could be used here. */ /* print_packet_info(packet, header); */ return;} Let's look at a full program example of how to take advantage of pcap_loop(). Inside our callback function that handles packets, we will just print out the packet information like we did in our previous example. Since this program will continuously loop and process packets, you will have to use CTRL-C to end the program or use the kill command. #include <stdio.h>#include <time.h>#include <pcap.h>#include <netinet/in.h>#include <netinet/if_ether.h>void my_packet_handler( u_char *args, const struct pcap_pkthdr *header, const u_char *packet);void print_packet_info(const u_char *packet, struct pcap_pkthdr packet_header);int main(int argc, char *argv[]) { char *device; char error_buffer[PCAP_ERRBUF_SIZE]; pcap_t *handle; int timeout_limit = 10000; /* In milliseconds */ device = pcap_lookupdev(error_buffer); if (device == NULL) { printf("Error finding device: %s\n", error_buffer); return 1; } /* Open device for live capture */ handle = pcap_open_live( device, BUFSIZ, 0, timeout_limit, error_buffer ); if (handle == NULL) { fprintf(stderr, "Could not open device %s: %s\n", device, error_buffer); return 2; } pcap_loop(handle, 0, my_packet_handler, NULL); return 0;}void my_packet_handler( u_char *args, const struct pcap_pkthdr *packet_header, const u_char *packet_body){ print_packet_info(packet_body, *packet_header); return;}void print_packet_info(const u_char *packet, struct pcap_pkthdr packet_header) { printf("Packet capture length: %d\n", packet_header.caplen); printf("Packet total length %d\n", packet_header.len);} Determining Packet Type Packet type can be determined by inspecting the ethernet header and comparing the ether_type value against known constants for IP, ARP, and reverse ARP types. #include <stdio.h>#include <pcap.h>#include <netinet/in.h>#include <net/ethernet.h>/* This function can be used as a callback for pcap_loop() */void my_packet_handler( u_char *args, const struct pcap_pkthdr* header, const u_char* packet) { struct ether_header *eth_header; /* The packet is larger than the ether_header struct, but we just want to look at the first part of the packet that contains the header. We force the compiler to treat the pointer to the packet as just a pointer to the ether_header. The data payload of the packet comes after the headers. Different packet types have different header lengths though, but the ethernet header is always the same (14 bytes) */ eth_header = (struct ether_header *) packet; if (ntohs(eth_header->ether_type) == ETHERTYPE_IP) { printf("IP\n"); } else if (ntohs(eth_header->ether_type) == ETHERTYPE_ARP) { printf("ARP\n"); } else if (ntohs(eth_header->ether_type) == ETHERTYPE_REVARP) { printf("Reverse ARP\n"); }}int main(int argc, char **argv) { pcap_t *handle; char error_buffer[PCAP_ERRBUF_SIZE]; char *device = "eth0"; int snapshot_len = 1028; int promiscuous = 0; int timeout = 1000; handle = pcap_open_live(device, snapshot_len, promiscuous, timeout, error_buffer); pcap_loop(handle, 1, my_packet_handler, NULL); pcap_close(handle); return 0;} Finding the Data Payload The payload is not always going to be in the same location. Headers will be different sizes based on the type of packet and what options are present. For this example we are strictly talking about IP packets with TCP on top. We start with the pointer to the beginning of the packet. The first 14 bytes are the ethernet header. That is always going to be the same because it is defined in the standard. That ethernet header contains the destination then source MAC(hardware) addresses, which are lower level than IP addresses. Each one of those is 6 bytes. There are also two more bytes at the end of the ethernet header that represent the type. With two bytes you could have thousands of different types. They could be ARP packets but we only want IP packets in this situation. Ethernet is considered the second layer in OSI's model. The only level lower than ethernet is the physical medium that the data uses, like a copper wire, fiber optics, or radio signals. On top of ethernet, the second layer, we have the third layer: IP. That is our IP address which is one level higher than the hardware MAC address. Layer four is TCP and UDP. Before we can actually get to our payload, we have to get past the ethernet, IP, and TCP layer. That is how we will come up with the formula for calculating the payload location in memory. IP and TCP header length are variable. The length of the IP header is one of the very first values provided in the IP header. We have to get the IP header length to figure out how much further we have to look to find the beginning of the TCP header. Once we know where the TCP header is we can get the data offset value, which is part of the TCP header. The data offset is how much further we have to go from the start of the TCP packet to the actual payload. Look at this psuedo-code. payload_pointer =packet_pointer + len(Ethernet header) + len(IP header) + len(TCP header) The ethernet header is always 14 bytes as defined by standards. The IP header length is always stored in a 4 byte integer at byte offset 4 of the IP header. The TCP header length is always stored in a 4 byte integer at byte offset 12 of the TCP header. The payload starts at packet base location plus all the header lengths. Now we have enough knowledge to figure out where the payload is in memory. The IP header and TCP are typically about 20 bytes each if there are no options passed. That means the first 54 bytes are the header layers, and the rest is actual data. We should not guess or assume the headers will always be 20 bytes each though. We need to get the actual header length for both IP and TCP layers in order to calculate the offset for the payload. That is what this code example will do. #include <stdio.h>#include <pcap.h>#include <netinet/in.h>#include <netinet/if_ether.h>/* Finds the payload of a TCP/IP packet */void my_packet_handler( u_char *args, const struct pcap_pkthdr *header, const u_char *packet){ /* First, lets make sure we have an IP packet */ struct ether_header *eth_header; eth_header = (struct ether_header *) packet; if (ntohs(eth_header->ether_type) != ETHERTYPE_IP) { printf("Not an IP packet. Skipping...\n\n"); return; } /* The total packet length, including all headers and the data payload is stored in header->len and header->caplen. Caplen is the amount actually available, and len is the total packet length even if it is larger than what we currently have captured. If the snapshot length set with pcap_open_live() is too small, you may not have the whole packet. */ printf("Total packet available: %d bytes\n", header->caplen); printf("Expected packet size: %d bytes\n", header->len); /* Pointers to start point of various headers */ const u_char *ip_header; const u_char *tcp_hea'''
