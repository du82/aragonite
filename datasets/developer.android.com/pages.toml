title = "ChromeOS devices  |  Multidevice  |  Android Developers"
description = "You can distribute your Android apps to Google ChromeOS devices, such as Chromebooks through the Google Play app store."
full_description = '''Android Developers Multidevice ChromeOS devices Stay organized with collections Save and categorize content based on your preferences. ChromeOS devices ChromeOS is the speedy, simple, and secure operating system that powers every Chromebook. You can distribute your Android apps to Google ChromeOS devices through the Google Play app store. Get started Design Android apps connect experiences from mobile to laptop form factors. Delight your users with more ways to be productive on large screens and with keyboard, trackpad, and mouse inputs. Design for ChromeOS ChromeOS basics Build a ChromeOS app You have an existing Android app designed for phones or tablets that you want to optimize for Chromebooks. This is where you get started with Android development for ChromeOS. Get started ChromeOS basics Optimize a ChromeOS app Android apps have an important role to play in redefining what modern computing looks like on large screens. Just porting a mobile app to Chromebooks doesn't give your users the best experience. Learn some ways that you can tailor your experience towards laptop and convertible form factors. Optimize your app for ChromeOS Latest news View more news Latest videos View more videos Blog Post Read more about ChromeOS development on our blog. Just search for "ChromeOS". Android Developers Blog'''
