nt-family); letter-spacing: .25px; } } Android Developers Design & Plan UI Design TV Stay organized with collections Save and categorize content based on your preferences. Design for TV Explore our guides, patterns, and more to help you learn how to create for Android TV. Start designing for TV today! Foundations guide Get started Guides Foundations Fundamental concepts and principles of Android Design like accessibility and system bars. Go to foundations Guides Style Discover how to create beautiful visual design with color, type, motion, and theming for your app. Go to style Guides Layout How content should be structured within a view - from basics of layouts and grid to displaying graphics, and modern Android features, like edge to edge. Go to layout Guides Components Small repeatedly used UI interactive building blocks. Learn more about using Material Design components. Go to components Explore our kits Use our design components to create a beautiful & functional TV UI. These components and patterns ensure the optimal user experience for TV apps, while maintaining consistency & showing your brand. Figma Android TV Figma community Explore our Figma design kits and use our styles, themes, patterns, components, and more, to springboard the creation of your next TV app. Go to the TV Figma community Explore components :root { --item-border-radius: 24px; --component-card-background-color: white; --component-card-border-color: #eaecf0; --component-card-box-shadow-hover-color: rgba(0, 0, 0, .2); --component-card-desc-color: #202124; --component-card-image-background-color: #f1f3fc; --frame-border-color: #2c2c2c; --frame-box-shadow-color: rgba(0, 0, 0, 0.15); --sample-card-border-color: #eaecf0; } .color-scheme--dark { --component-card-background-color: #202124; --component-card-border-color: #80868b; --component-card-box-shadow-hover-color: rgba(255, 255, 255, .2); --component-card-desc-color: #f1f3f4; --component-card-image-background-color: #3c4043; --frame-border-col