full_description = "/* Styles inlined from /assets/css/design-plan.css */ :root { --item-border-radius: 24px; } .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-guides .devsite-landing-row-item-description { padding-inline: 24px; } .android-guides .devsite-landing-row-item-description { padding-block: 24px; } .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .android-guides:not(.android-promo) a:hover { color: #1769e0 !important; } .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-guides:not(.android-promo) a:hover { color: #aecbfa !important; } .android-illustrated-resources-secondary.devsite-landing-row-3-up .devsite-landing-row-group { grid: auto-flow / repeat(auto-fit, minmax(290px, 1fr)); } Android Developers Develop Stay organized with collections Save and categorize content based on your preferences. Develop for Android The code samples, guides, and API reference you need—whether you're building for phones, watches, tablets, laptops, foldables, TVs, or cars. Take advantage of these resources to develop your app faster and with higher quality. I'm new to Android Download samples Accelerate your app development by example. See code Develop with Android Studio Code in the IDE custom-built for Android. Write code Browse API reference Find information about the Android APIs you're using. Look up code Integrate AI into your apps Use Google's full suite of AI and ML tools to make your apps more useful and intuitive. Get started with AI on Android Devices Device compatibility For your app to be successful on all devices, it must tolerate feature variability and provide a flexible user interface that adapts to different screen configurations. View compatibility guide Large screens Extend your mobile app to tablets and foldables. Wear OS Create an app for watches running Wear OS. Android TV Extend your app for TV viewing. ChromeOS Build and optimize your app for ChromeOS. Android for Cars Extend your app for vehicle dashboard use. Cross device SDK Easily make your app compatible with multiple devices. Health Connect Tap into and share on-device health and fitness data. Assistant Enable voice control in your app. Android XR Extend your app to an infinite display. Developer centers New Productivity Level up your productivity app with media, adaptive layouts, and more. Learn more Dev center Media apps Learn how to build and extend engaging media experiences to users across Android's multidevice ecosystem. Learn more Dev center Games You use a game engine for most of your game design and development, but you still need to use Android tools to get the job done. Learn more Dev center Health & Fitness Take your health and fitness app to the next level using Health Services with Health Connect. Learn more Dev center Social & Messaging Build apps that connect, communicate, and share information. Learn more Core areas User interfaces The guides you need to write the code for your UI—whether you're using Jetpack Compose or Views-based APIs, or migrating from Views to Compose. Develop your UI Guides Data & files Store, manage, and share data. Security Permissions Access and protect restricted data and actions. Security User identity Manage user identity and related data. App architecture Navigation Navigate between screens and apps. Guides Intents and intent filters Request actions from other apps. Guides Background tasks Run app tasks in the background. Guides Services Perform long-running background operations. Guides Alarms Run scheduled operations in the background. Dev Center Audio & video Play and record audio and video. Dev Center Camera Easily use the camera. Guides Sensors Orient your app in the real world. Guides User location Make your app location aware. Guides Connectivity Connect your app through various protocols. Guides App compatibility Maintain backward compatibility. Google Play App bundles Publish your app to Google Play. Build and test Configure your build Use Android Studio with Gradle to automate and manage the build process. Configure Test Test your app's correctness, functional behavior, and usability before releasing it publicly. Test Developer stories How developers are finding success with Android. View all stories Google Photos builds for large screens See how the Google Photos team increased daily active users by investing in developing responsive layouts across across tablets, foldables, and ChromeOS devices. Monzo moves to CameraX Monzo reduced over 9,000 lines of code and improved registration dropout by 5x with CameraX. Evernote users spend more time on large screens After investing in making their Android app work on ChromeOS, Evernote saw those users tripled the time they spent using the app."
