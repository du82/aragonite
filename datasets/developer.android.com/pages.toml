full_description = '''/* Styles inlined from /assets/css/jetpack.css */ .dac-jetpack-compose-page-hero-illustration { padding: 20px; background-color: #2B2B2B; border-radius: 24px; display: grid; grid-template-columns: 3fr 1fr; align-content: center; max-width: 900px; margin: 0 auto; } .dac-jetpack-compose-page-hero-illustration .dac-code { width: calc(100% - 32px); } .dac-jetpack-compose-page-hero-illustration .dac-preview { border-radius: 12px; background-color: #E9EAE9; display: flex; justify-content: center; align-items: center; overflow: hidden; } .dac-jetpack-compose-adopt-page .android-spotlight-hero .devsite-landing-row-item-media { width: 100%; } @media screen and (max-width: 720px) { .dac-jetpack-compose-page-hero-illustration { grid-template-columns: none; margin: 0; } .dac-jetpack-compose-page-hero-illustration .dac-code { width: 100%; } .dac-jetpack-compose-page-hero-illustration .dac-preview { display: none; } } .dac-jetpack-compose-adopt-page .android-spotlight-hero.devsite-landing-row { padding-bottom: 56px; } .dac-jetpack-compose-adopt-page .android-video-spotlight-hero.devsite-landing-row-1-up .devsite-landing-row-item-description { grid-column: 1/ span 12; } .dac-jetpack-compose-testimonials .devsite-landing-row-item-buttons { justify-content: center; } .dac-jetpack-compose-testimonials .devsite-landing-row-item-buttons .button:first-child { flex-grow: 1; } .android-apps-grid { display: grid; grid-gap: 50px; grid-template-columns: repeat(7, 3fr); align-content: space-around; justify-content: center; justify-items: center; text-align: center; } .android-apps-grid-icon:hover .android-apps-grid-icon-label { display: block; margin-top: 8px; } .android-apps-grid-icon { height: 100px; } .android-apps-grid-icon-image { width: 104px; height: 104px; border-radius: 100px; overflow: hidden; margin: 0 auto; display: inline-block; filter: drop-shadow(0px 0px 1px grey); } .android-apps-grid-icon-label { display: none; } Android Developers Get started Compose Compose for teams Stay organized with collections Save and categorize content based on your preferences. Adopt Compose for Teams Give your developers the modern toolkit that speeds and simplifies Android UI development. Read more to learn why adopting Compose can help your team succeed. Get started Less code Fewer lines of code translates into code that’s easy to read and maintain, less bugs, and more time to focus on building unique app experiences. Do more with less Intuitive Describe your UI using Compose declarative APIs, that are legible and easy to find. See how Accelerate development Iterate quickly with live previews, full tooling support, and easier theming, with small components that are easy to test. Build faster Powerful Concise Kotlin DSL APIs, and out-of-the-box Material Design give your teams easier access to the best of Android. Get started Design across devices Your team can easily leverage skills for building with Compose to designing for different screens, and gain productivity benefits across your app’s supported form factors. Tablet and foldables Develop UIs that provide your users a good experience across any display size. Wear OS Write apps for wearables that help your users live more present, healthy, and productive lives. Android TV Build apps for TV to connect with your users in their homes. Widgets Enable your users to quickly see the most important content from your app on their home screen. What developers are saying See what developers like about using Jetpack Compose. MAX “Compose significantly reduced the time required to implement UI changes, solving the pain point of maintaining a large, complex UI codebase and making it easier to iterate on the app's design and user experience.” Read more SoundCloud “We were able to save up to 45% of lines of code when migrating screens from XML views to Compose. We used Compose to prototype, and it enabled us to iterate fast even when we changed our design ideas daily.” Watch video Read more adidas “I can build the same feature with Compose about 30% faster than with Views. Compose's efficiency not only accelerated development, but also helped us achieve our business goals.” Watch video Read more Google Drive “Compose, combined with architecture improvements, cut our development time nearly in half.” Watch video Read more Threads “For developers who are building new apps, I would definitely recommend using Compose. Not only is it enjoyable... it sets your team up for success in the future.” Watch video Read more Reddit “Compose has helped us with engineering retention. In our developer surveys, our engineers tell us that Compose is one of the biggest improvements to our dev experience.” Watch video Read more Dropbox “We rewrote the search experience using Compose in just a matter of weeks. It took 40% less time than anticipated to build the feature, and took less than half the time it took to build it on iOS.” Watch video Read more Lyft "Compose is clearly the future of Android development. It requires less code, and it's easier to understand and maintain." Watch video Read more Airbnb “We’ve prioritized building sound technical foundations and empowering our engineers to do excellent work. Jetpack Compose enabled both of these goals and is a critical part of our technical strategy.” Watch video Read more Clue “We noticed a massive improvement in our productivity. Our development speed increased up to 3X compared to our legacy codebase.” Watch video Read more X “Compose increased our productivity dramatically. It’s much easier and faster to write a Composeable function than to create a custom view, and it’s also made it much easier to fulfill our designers’ requirements.” Watch video Read more ZEPETO "We rewrote the Character Shop feature in Compose. It was much faster to write it in Compose, and we reduced the amount of code by over 10%." Watch video Read more Mercari “It’s the same app with way less code. The rewritten app has about 355,000 fewer lines of code, which is about 69% less than what it had before.” Read more Play Store “Compose has been a boon for our team’s developer happiness, and a big step-up for code quality and health.” Read more Block “By using Compose, we can focus on things that are unique to Block and our UI infrastructure, rather than solving the broader issue of building a declarative UI framework.” Read more Cuvva "The speed at which Compose allows us to put together a new feature means we can iterate more rapidly, providing a higher-quality experience for our customers faster than before." Read more Monzo "Compose allows you to build higher quality screens more quickly." Read more Get your team started with Compose today Get started'''
