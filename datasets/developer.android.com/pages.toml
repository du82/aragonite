["https://developer.android.com/develop/xr"]
title = "Android XR  |  Android Developers"
description = "Your AI development companion for Android development."
full_description = "/* Styles inlined from /assets/css/develop-xr.css */ .android-spotlight-callout h2 { font-weight: 500; font-size: 48px; line-height: 56px; } .android-spotlight-callout video { border-radius: 24px; } .android-spotlight-callout .devsite-landing-row-item-description { font-size: 16px; line-height: 24px; letter-spacing: 0; } .devsite-landing-row-100 .devsite-landing-row-description { max-width: 1252px; } The Android XR SDK is now available in Developer Preview. We want your feedback! Visit our support page to reach out. Android Developers Develop Devices Android XR Stay organized with collections Save and categorize content based on your preferences. Develop with the Android XR SDK Redefine how users interact with your app with Android XR — from focused productivity to immersive entertainment. Android XR apps become part of your user's environment and create expansive experiences for watching, learning, and getting things done. Develop for XR Start with the tools you're familiar with The Android XR Software Development Kit supports developing from where your app is today. Choose whether you want to develop with Android Jetpack XR, Unity, OpenXR, or WebXR. Select your tools Build or spatialize an Android app You can build a new app from scratch or adapt an Android large screen or mobile app for XR by adding spatial components. Develop with Jetpack XR SDK Alas, your browser doesn't support HTML5 video. That's OK! You can still download the video and watch it with a video player. This JetNews app is an Android large-screen app adapted for Android XR. Build a new app or port a Unity, OpenXR, or WebXR app Bring existing immersive experiences to a new audience, with minimal development lift. Develop with Unity, OpenXR, or WebXR Job Simulator is an Unity game ported to Android XR. Simplified development Most Android apps are compatible with Android XR without any additional development effort. Reduce your learning curve and build for a range of XR devices by using familiar Android APIs and frameworks. You can use Jetpack Compose for XR, Android Studio, the emulator, and your preferred 3D tools to create custom XR experiences. Develop with the Jetpack XR SDK Easy on-ramp to bring apps to XR XR-compatible mobile app Reach users on XR devices with your existing compatible mobile apps. No changes required. XR-compatible large screen app Adaptive layouts ensure your app works across devices. Existing large screen apps are optimized for XR. No changes required. XR-differentiated app Take advantage of spatial panels, 3D models, and spatial environments to design an immersive experience. Or use Unity, OpenXR, or WebXR to build a fully customized immersive experience. Explore Android development tools Create XR experiences using familiar tools, extended for XR. Android Studio Create a new device flow, device manager, and layout inspector. Use the Android XR emulator to test apps directly on your machine, with or without access to a physical device. Jetpack Compose for XR Includes everything you need to design an XR app. Find UI and interaction recommendations, an automatic layout engine, preset layouts, and spatial UI compositions. ARCore for Jetpack XR Brings perception capabilities for your app to understand and interact with real-world features such as anchors and semantic segmentation. Jetpack SceneCore Includes the building blocks to add immersive content to your Android XR app. The SceneCore library supports spatial entity and environment APIs. Material Design for XR Provides a foundation to create user-friendly apps that follow established patterns of interaction, spatial, and visual design. 3D tools Use the 3D tool of your choice to create glTF or GLB files. Examples: Blender, Maya, Spline Explore the Hello Android XR sample app Try out the Hello Android XR sample app, optimized for an immersive experience. See firsthand how spatial panels and environments come together in a real-world application. Work through Android XR codelabs Follow step-by-step guides to learn the building blocks of Android XR experiences and adapt an existing app to make use of them. Take the first codelab Build with Unity, OpenXR, or WebXR Anyone familiar with 3D development can build with the popular Unity realtime 3D engine, the industry standard OpenXR, or the readily-accessible WebXR. These frameworks give you the flexibility to build the XR experiences you want. Unity Build apps that can target multiple platforms with Unity's established OpenXR support and developer ecosystem. Develop with Unity OpenXR Build fast at lower costs using a common set of APIs to develop XR applications that work across a range of devices. Develop with OpenXR WebXR Build meaningful XR experiences directly in a browser using WebXR’s known and trusted standards and technologies. Develop with WebXR Get hands-on help at an Android XR developer bootcamp In early 2025, we are hosting Android XR developer bootcamps around the world. At these two-day events, you can: Participate in guided technical sessions. Work with the Android XR team as you build a new app or adapt an existing one. Get access to prerelease headset hardware. Space is limited. Register today to be considered for participation. Apply to the developer bootcamp Get started with design Android XR includes ready-to-go UI, components, and spatial elements. Get started"
