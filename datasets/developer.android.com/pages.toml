full_description = "/* Styles inlined from /assets/css/design-plan.css */ :root { --item-border-radius: 24px; } .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-guides .devsite-landing-row-item-description { padding-inline: 24px; } .android-guides .devsite-landing-row-item-description { padding-block: 24px; } .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .android-guides:not(.android-promo) a:hover { color: #1769e0 !important; } .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-guides:not(.android-promo) a:hover { color: #aecbfa !important; } .android-illustrated-resources-secondary.devsite-landing-row-3-up .devsite-landing-row-group { grid: auto-flow / repeat(auto-fit, minmax(290px, 1fr)); } Android Developers Design & Plan Stay organized with collections Save and categorize content based on your preferences. Design & Plan Before you start coding, do your homework to design and plan a great app. Create a great user experience, carefully plan your app architecture, and follow recommended security and privacy practices. Design a beautiful app Explore UI design guides and samples to create a great visual experience. Learn about Android styles and themes, download Figma-based kits, and more. Design your UI Plan a robust architecture Learn the recommended patterns for building well-organized UI layers and data layers for your next Android app. Architect your app Design for app quality Create an app that follows privacy and security best practices. Build a high quality app that keeps your users safe and builds trust. Optimize for quality Plan for the next billion users The pace of smartphone growth around the world is unprecedented, and billions of new users will come from markets that require unique technical and design decisions. Make sure your app is ready. Go to Build for Billions Design guides Guide Mobile design guides Get started with Android UI design guides. Follow style guidance, learn about themes, and create a beautiful Android app experience. Guide Large screen design guides Tablets, foldables, and ChromeOS devices expand UI possibilities. Design a user experience that only large screens can provide. Guide Wear design guides Wear apps have their own unique challenges and design principles. Learn the specifics of designing an Android app for the wrist. Guide XR design guides Build experiences that push boundaries and transform how people create, explore, and enjoy entertainment, powered by Android XR. Guide TV design guides Create a dynamic and elegant Android TV app. Design for TV specs and dimensions and follow our best practices and recommendations. Quality guides Guide Security & privacy Safeguard your users' security and privacy. Follow Android's best practices and guidance to build an app with a foundation of trust and integrity. Go to security guides Guide Technical quality Technical quality is the foundation of a great app. Follow our technical quality guides to ensure stability, high performance, and a great user experience for your app. Go to quality guides"
