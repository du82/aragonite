nt-family); letter-spacing: .25px; } } Android Developers Design & Plan UI Design Stay organized with collections Save and categorize content based on your preferences. Design for Android Design beautiful and modern Android apps that meet your user where they are, whether browsing their phone, reading on their tablet, glancing at their wrist, or watching TV. Design for mobile Create a beautiful and usable modern app design using Android themes, components, and UI patterns. Explore mobile design → Expand to large screens Create an immersive and engaging user experience with layouts that resize and reconfigure to optimize presentation, interactivity, and usability. Explore large screen design → Get inspired for large screen UI design → Boundless creation with XR Create groundbreaking experiences with powerful tools that transform how we interact with digital content and the world around us. Explore XR design → Enhance your app with widgets Use widgets to help users quickly engage with your app content and features. Explore widget design → Provide at-a-glance information on Wear OS A smartwatch adds a great surface for quick and frequent interactions with your app. Start designing experiences for Wear OS by Google. Explore Wear OS design → Get inspired for Wear OS design → Design for TV Start designing your Android TV app experience using our guides and kits. Explore TV design → Get inspired for TV design → Design for Cars Start designing your app experience for Android Auto and Android Automotive OS using our guides and templates. Go to design guidance Try out a case study or sample Start designing for Android devices with one of our Figma-based case studies or app samples. Mobile & large screens Get the Now in Android case study (in Figma) and explore our celebrated Play Store published media sample app. Go to the Now in Android case study Wear Explore our collection of design kits and templates for Wear OS. See Wear samples TV Explore our Figma-based design kits for