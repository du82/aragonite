title = "Android for Cars  |  Multidevice  |  Android Developers"
description = "Let drivers listen to and control content in your music and other media apps and hear and respond to your messaging service via the car's controls and screen."
full_description = "Android Developers Multidevice Android for Cars Stay organized with collections Save and categorize content based on your preferences. Android for Cars Build apps that help users connect on the road through Android Automotive OS and Android Auto. Users who have a vehicle with Android Automotive OS can install your app onto their vehicle's infotainment system. Android Auto lets users connect their phone, Android 9 or higher, to a compatible vehicle to display a driver-optimized version of your app directly on the console. Get started Android for cars Design Learn how to design apps that are optimized for drivers and vehicles. Design apps that delight your users with experiences that are simple, consistent, and free from distractions. Learn more Build media apps Build media apps such as music, radio, and audiobook players that users can install in their Android-powered vehicle, project into their vehicle from their phone, or use on their phone while on the road. Build messaging apps Build messaging apps that receive incoming notifications, read messages using text-to-speech, and let users reply through the Android Auto app using their voice while on the road. Build templated apps Build point of interest, internet of things, weather, and navigation apps for Android Auto and Android Automotive OS that help users find where they want to go, get directions there, and stay connected and informed on the way. Build parked apps Port your existing Android video apps, browsers, and games to Android Automotive OS for users to enjoy in their parked car. Latest news More news Latest videos More videos Building an ecosystem We partnered with manufacturers around the world to bring the Android platform to cars. Starting in 2020, Android-powered vehicles using Android Automotive OS let users enjoy a dedicated Android experience in the car. And Android Auto gives millions of users a safe and convenient way to enjoy app experiences on the road through hundreds of compatible cars and aftermarket stereo systems. Users can also download the Android Auto app to experience the magic of Android Auto without a compatible vehicle. Learn more"
year_published = 2025
clearnet = "https://developer.android.com/cars"
