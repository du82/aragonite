nt-family); letter-spacing: .25px; } } Android Developers Design & Plan UI Design Wear Stay organized with collections Save and categorize content based on your preferences. Design for Wear OS Watches enable users to get information at a glance and then take action. These frequent interactions can help users get back to being present in their daily lives. Create immersive and engaging user experiences on Wear OS to increase app usage and brand loyalty. Getting started guide Get inspired Media The watch is the ultimate on-body controller that gives people quick access to media or media controls. Learn more about media Fitness & Health Help people live healthier lives by tracking workouts and setting fitness goals. Learn more about fitness Messaging Enable people to stay connected. Provide a reliable, helpful, and safe messaging experience. Learn more about messaging Wear OS for kids Design principles Design your app so that kids stay engaged, safe, and present. Learn more Develop experiences for kids Optimize your Wear OS app's experience for kids. Learn more Get started Guides Getting started Learn the fundamentals for designing on Wear OS. See getting started Guides Design principles Keep the design principles in mind when designing for Wear OS. See design principles Guides Styles Adopt material styles like color, typography, motion and iconography to make your app feel premium. See styles Guides Surfaces Use notifications, complications, tiles and apps to help people get things done. See surfaces Guides Behaviors & Patterns Reuse proven design patterns and behaviors so users can get things done quickly on the watch. See behaviors Guides Components Leverage small, commonly used, interactive, UI building blocks. Learn more about using Wear OS’s Material Design components. See components Guides Accessibility Make your experiences work for everyone. See accessibility Guides Screen sizes Create an adaptive design for your app, allowing users to enjoy your app on a variety of screen sizes. See screen sizes Explore our kits Explore our other Figma-based library kits, plugins, and the Material theme builder. Start building your Android app with modern themes, tools and user-generated dynamic color, or check out our Mobile kits and TV kits to build for other devices. Compose for Wear OSMaterial Design kit Use the Compose for Wear OS Material Design catalog (Figma) to create your own wearable apps. This kit includes components, styles, and layouts to kickstart your designs. Download the Compose for Wear OS Figma design kit Tiles on Wear OSMaterial Design kit Use the Tiles on Wear OS Material Design catalog (Figma) to create your own wearable tiles. This kit includes components, styles, and layouts to kickstart your designs. Download the Tiles on Wear OS Figma design kit Use proven design patterns Messaging Scroll Enhance your user experience by using Rotary input to allow your user to quickly accomplish various tasks. Enable scroll Fitness & Health Health services Enable your app to utilize accurate data to improve fitness experiences, such as GPS position and heart rate tracking. Health services for Wear OS Media Output devices Enable your users to choose the audio output device before the media starts. Detect audio devices Messaging Tiles Use our recommended tile layouts to help your users quickly complete actions. See the recommendations Develop for Wear Developer guides Use our developer guides and API reference to learn how to build Wear OS apps. See developer guides Quality guides Assess the quality of your app by using our checklist. See app quality Check out our latest videos YouTube video Introduction to UX Research & Product Inclusion on Wear OS May 22, 2023 YouTube video Introduction to UX Design on Wear OS May 22, 2023 YouTube video Introduction to Product Inclusion & Equity May 22, 2023"
