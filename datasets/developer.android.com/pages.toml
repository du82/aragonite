title = "Privacy Sandbox  |  Google for Developers"
description = "Privacy-focused APIs and updates for cookies, advertising, identity, personalization, and fraud prevention."
full_description = "Home Privacy Sandbox Send feedback Stay organized with collections Save and categorize content based on your preferences. Protect user privacy online The Privacy Sandbox initiative aims to create technologies that both protect people's privacy online and give companies and developers tools to build thriving digital businesses. The Privacy Sandbox reduces cross-site and cross-app tracking while helping to keep online content and services free for all. Get started Prepare for Chrome changes Learn more about changes to Chrome's treatment of third-party cookies and understand what actions you need to take to preserve your site's features. Get started Private advertising APIs Start building with the Privacy Sandbox solutions to enable advertising use cases without third-party identifiers. Get started About the initiative language Privacy Sandbox on Web The Privacy Sandbox's vision of the future has browsers providing specific tools to satisfy specific use cases, while preserving user privacy. Learn more android Privacy Sandbox on Android Our goal with the Privacy Sandbox on Android is to develop effective and privacy enhancing advertising solutions, where users know their privacy is protected, and developers and businesses have the tools to succeed on mobile. Learn more Latest news The latest news and updates on Privacy Sandbox filter_list FedCM UI update: Display filtered out accounts. From Chrome 133, the FedCM UI will display filtered-out accounts if no account is available for the user to sign into the RP. Read more compress HTTP headers support for the Storage Access API We've shipped Storage Access Headers in Chrome 133. The new headers support non-iframe storage access requests and improve performance. Read more new_releases New Shared Storage features in Chrome 132 We've enabled the use of cross-origin worklet scripts in Shared Storage and updates to Select URL with the support of saved queries. Read more feed View all articles See all the news, posts, and updates from the Privacy Sandbox blog. View all Explore additional resources Learn about the status and timeline of the Privacy Sandbox APIs and find out more about available resources. API status and feature updates for Chrome Review Chrome platform status, resources, and feature release timelines. Learn more Progress updates for Android A summary of new developments and updates to the design proposals, key questions and feedback we have received. Learn more Provide feedback for Chrome Where and how to provide feedback for Privacy Sandbox proposals throughout the development process. Learn more Resources In this section, you can find different resources such as demos, videos, training material, and information on events related to Privacy Sandbox. Learn more"
