full_description = "/* Styles inlined from /assets/css/design-plan.css */ :root { --item-border-radius: 24px; } .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-guides .devsite-landing-row-item-description { padding-inline: 24px; } .android-guides .devsite-landing-row-item-description { padding-block: 24px; } .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .android-guides:not(.android-promo) a:hover { color: #1769e0 !important; } .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-guides:not(.android-promo) a:hover { color: #aecbfa !important; } .android-illustrated-resources-secondary.devsite-landing-row-3-up .devsite-landing-row-group { grid: auto-flow / repeat(auto-fit, minmax(290px, 1fr)); } Android Developers Essentials Stay organized with collections Save and categorize content based on your preferences. Android Essentials Explore documentation, training, and Codelab tutorials to grow your Android skills, whether you're brand new to the platform or a seasoned developer looking to use features in the latest release. Learn to extend your app's user experience across a multitude of devices, and how to leverage Google Play to make money with your app. Get started Do a quick tutorial or dive deeper into a training course for an overview of key Android development topics. Start Find Android releases Explore the current Android 14 preview release, as well as Android 13, Android 12, and legacy Android releases. Update Monetize Make money with subscriptions, financial transactions, and important purchase flows with Google Play. Earn Better together Build elevated experiences to help your app work better together across multiple devices. Extend Support multiple devices Android is built for everyone, everywhere, and to give people more choice in devices, whether it's based on the design, features, or overall value. Extend your user experience by supporting a range of devices and form factors. Learn about multidevice support Monetize with Google Play Monetize and integrate a billing system into your app using Google Play. Google play offers a variety of features and support to help you make money off your app while reaching a global market. Google Play Billing AI on Android Enable your Android apps to generate text and images, understand content, enrich information, and build engagement with users. Use Google's full suite of AI and ML tools to make your apps more useful and intuitive. Explore AI on Android Developer centers Productivity Level up your productivity app with media, adaptive layouts, and more. View dev center Games Get everything you need to develop and deliver games on Android. View dev center Media apps Your first stop for content on developing media apps. View dev center Social & Messaging Build apps that connect, communicate, and share information. View dev center Health & Fitness Health and fitness apps record valuable data. Go to Health Connect Enterprise apps Leverage APIs and other tools to build enterprise solutions. View guidelines Latest updates Discover what's new across the Android ecosystem. View all Latest updates See the latest Android release View the latest Android platform releases, including the current preview release. Explore the latest Jetpack libraries Jetpack libraries ship separately from the Android OS, so updates to the libraries can happen independently and more frequently. Get Android Studio preview Get early access to the latest features and improvements in Android Studio. Get Wear OS Developer Preview The next version of Wear OS is now available for testing, development, and feedback. Try it out with your apps and let us know what you think! Privacy Sandbox on Android The Privacy Sandbox on Android aims to develop new technologies that improve user privacy and enable effective, personalized advertising experiences for mobile apps. Developer stories How developers are finding success with Android. View all stories Marvel Strike Force improves their install rate Due to a large file size, the number of organic installs was lower than the team had hoped for such a popular franchise. Google Play Instant to the rescue! Cuvva adopts Jetpack Compose Learn how the Android engineers at Cuvva re-architected their app to use a unidirectional data flow and Jetpack Compose. Duolingo reduces its line count by an average of 30% After seeing that their codebase's line count was growing 46% every year, Duolingo's Android developers found success in migrating from Java to Kotlin."
