full_description = '''/* Styles inlined from /assets/css/dev-center.css */ :root { --item-border-radius: 24px; --headline-font-family: Google Sans, Noto Sans, Noto Sans JP, Noto Sans KR, Noto Naskh Arabic, Noto Sans Thai, Noto Sans Hebrew, Noto Sans Bengali, sans-serif; } .android-featured-samples .devsite-card, .android-featured-samples .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-featured-samples .devsite-card-content, .android-featured-samples .devsite-landing-row-item-description { padding-inline: 24px; } .android-featured-samples .devsite-landing-row-item-body h3 { color: #073042; font: 500 24px / 32px var(--headline-font-family); } .android-featured-samples .devsite-landing-row-item-description-content { display: flex; flex: 1; flex-direction: column; } .android-featured-samples .devsite-landing-row-item-description-content p { color: #5f6368; } .android-featured-samples .fully-clickable:hover a { color: #1769e0 !important; } .color-scheme--dark .android-featured-samples .devsite-card, .color-scheme--dark .android-featured-samples .devsite-landing-row-item, .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-body h3, .color-scheme--dark .android-featured-samples .devsite-landing-row-item-custom-image-icon { color: white; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-description-content p { color: #f8f9fa; } .color-scheme--dark .android-featured-samples .devsite-dynamic-content-display-tag { color: white; } .color-scheme--dark .android-featured-samples .fully-clickable:hover a { color: #aecbfa !important; } Android Developers Essentials Games dev center Stay organized with collections Save and categorize content based on your preferences. Developer center Android Games Dev Center Get everything you need to develop and deliver games on Android: tools, downloads, samples, libraries, and guidance. Get started What's new Event Google at GDC Build interactive agents with Gemini, supercharge your Android game with powerful APIs, and expand your PC gamer audience with Play's growth tools. Read more about upcoming conference sessions. Learn more Case study Kuro Games reduces 9.68% power consumption for Wuthering Waves Wuthering Waves is a high fidelity action RPG game developed by Kuro Games. Optimizing the power consumption is very important to sustainably deliver a premium user experience for long gaming sessions. Read More Priority workstreams Graphics Performance and Quality Improve graphics performance so you can reduce slow sessions or improve graphics quality. Learn more Thermal and workload management React to thermal changes to avoid slow sessions caused by thermal throttling with ADPF. ADPF will also help the system react to changes in the game workload for better performance. Learn more Multiplatform and form factors Make your game run everywhere with multiplatform support and optimizations for large screens. Learn more Developer stories How game developers are finding success with Android tools. View more games stories MediaTek enhances dynamic performance of Android SoCs "Kakao Games's Ares was able to increase FPS stability to 96%by adjusting the workload at runtime in response to the thermal API." Read more Call of Duty Warzone Mobile uses Vulkan for better graphics "Vulkan reduced development overhead and friction and enabled delivery of authentic, high-fidelity Call of Duty content and gameplay to Android players." Read more Com2uS - Google Play Games for PC "Vulkan allowed Com2uS to provide the best possible graphics quality for their key user demographic on both PC and mobile devices." Read more Highlighted resources Optimize Android GPU Inspector (AGI) Analyze the impact your game has on Android devices by using this powerful graphics profiler, so you can identify performance issues and areas to optimize. Read the docs Deliver Deploy to Android, ChromeOS, and Windows Add social and competitive game services such as profiles, leaderboards, and achievements, and then deploy your Android game through the Google Play store. Read the docs Downloads Find all your tools in one place. Samples Find sample apps and example code. Tutorials Follow guided, step-by-step codelabs to complete game development tasks. Community resources Mobile Insights Report Find stats and analysis for game development businesses. See the report Quarterly newsletter Get the latest news and tips to grow your games. Sign up Community resources page See our latest blogs, videos, programs, community, and support resources. Visit the page'''
