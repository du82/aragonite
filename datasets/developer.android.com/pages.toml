full_description = "Android Developers Essentials Platform Releases Stay organized with collections Save and categorize content based on your preferences. Android 9 Pie Android 9 harnesses the power of artificial intelligence to give you more from your phone. Now it's smarter, faster and adapts as you use it. See what's new Make your apps compatible Test your apps for compatibility with Android 9. Just download a device system image, install your current app, and test in areas where behavior changes may affect the app. Update your code and publish, using the app's current platform targeting. Download a system image How to get Android 9 for your Pixel device Learn more Behavior changes System changes that affect all apps on Android 9 Learn more Compatibility testing Easy steps to reach compatibility Learn more What's in Android 9? Simplicity, speed, and many new ways to extend your apps. Notification updates and smart reply ImageDecoder for bitmaps and drawables Data cost sensitivity in JobScheduler Display cutout APIs Multi-camera APIs More... Get started with Android 9! Start by targeting Android 9 and supporting its behavior changes. When you're ready, extend your apps with new features and APIs. Targeting Android 9 Studio setup and how to target Android 9 Learn more Behavior changes for apps targeting API 28+ System changes for apps targeting Android 9 Learn more Android 9 features Extend your apps with Android 9 Learn more Latest news and videos"
