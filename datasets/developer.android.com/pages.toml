o test against the latest behavior changes! Read more Developer centers New Productivity apps Level up your productivity app with media, adaptive layouts, and more. Learn more Featured Social & messaging apps Use Android's unique capabilities to supercharge your app's social and messaging features. Learn more Featured Camera & media apps Learn how to build and extend engaging media experiences to users across Android's multidevice ecosystem. Learn more Featured Health & fitness apps Take your health and fitness app to the next level using Health Services with Health Connect. Learn more Platform updates Keep up to date with what's going on with the Android platform. Go to Android Platform Tools updates The latest on tools that help you build the highest quality Android apps for every Android device. Go to Android Studio Explore more Developer guides Find training classes that describe how to accomplish a specific task with code samples you can re-use in your app. Sample code Jump-start your development using these sample projects. Quality guidelines Build a high quality app with these design and behavior guidelines. Distribute your app Learn how to launch and distribute your apps and games successfully. Latest news Keep up to date with what's going on in Android. View all news Latest videos Get the latest Android news, best practices, live videos, demonstrations, tutorials. View all videos"
