n about what's new — review the behavior changes for all apps and the behavior changes for apps targeting Android 13 that might've affected your app. Test your app — run through all flows to look for issues. Toggle behavior changes at runtime to isolate issues. Update your app — target Android 13 if possible, and test with users using beta channels or other groups. Tools and resources Compatibility tools Toggle top behavior changes and debug with integrated logging—no need to change targeting. Learn More Migrate your apps Follow this checklist of steps to get your apps ready for Android 13. Learn More Give feedback Your feedback and issue reports are critical! Use our main issue tracker to let us know! Learn More Latest news'''
