nt-family); letter-spacing: .25px; } } Android Developers Design & Plan UI Design Mobile Stay organized with collections Save and categorize content based on your preferences. Design for mobile Create your app design using Android themes and components. Leverage Android’s unique design patterns and offerings to create a beautiful, usable, modern app. Go to design foundations Get started Guides Foundations Fundamental concepts and principles of Android design. See guidance Guides Styles How to create beautiful visual design with color, type, motion, and theming for your app. See guidance Guides Layout & content How content should be structured within a view – from basics of layouts and grids to displaying graphics, and modern Android features, like edge-to-edge content. See guidance Guides Behaviors & patterns Interaction patterns that help your users understand, interact with, and control their experience in your app. Common behavior patterns include navigation, sharing, predictive back, and settings. See guidance Guides Components Leverage small, reusable, interactive, UI building blocks. Learn more about using Material Design components. See guidance Guides Home screen Extend your app to create unique experiences across the device by using system UI features like app widgets and notifications. See guidance Guides Glossary Understand common Android terminology. See guidance Guides Accessibility Benefit everyone by designing in accessibility support to help 15% of the world’s population communicate, learn, and work. See guidance Explore our kits Explore our other Figma-based library kits, plugins, and the Material theme builder. Start building your Android app with modern themes, tools and user-generated dynamic color, or check out our Wear OS kits and TV kits to build for other devices. Android UI kit Get started designing for Android faster and easier with an introductory guide, styles, components, and system templates. Go to Android UI kit Material Design community Explore the Figma-based Material library and explore case studies and kits. Go to Material Design community Theme builder Use the web-based Material theme builder to design your next Android app. Go to the theme builder Use a proven design system Try Material Design 3 Material Design 3 is an open source, adaptable system of guidelines, components, and tools that support the best practices of user interface design. Go to the Material Design website Develop for mobile Developer guides Use our developer guides and reference to build your app design. See the developer guides Quality guides Lay out your designs by following Android best practices. See the quality guides"
