full_description = '''/* Styles inlined from /assets/css/ai-lp.css */ .android-ai-lp .android-spotlight-hero { padding-bottom: 42px !important; } .android-ai-lp .android-ai-hero-video { padding-bottom: 0 !important; border-bottom: solid 1px #dadce0; } .color-scheme--dark.android-ai-lp .android-ai-hero-video { border-color: #80868b; } .android-ai-lp .android-ai-video-frame { background: url("/images/ai/screen.png") no-repeat bottom center; height: 383px; min-width: 341px; } @media only screen and (-webkit-min-device-pixel-ratio: 2), only screen and (min--moz-device-pixel-ratio: 2), only screen and (o-min-device-pixel-ratio: 2/1), only screen and (min-device-pixel-ratio: 2), only screen and (min-resolution: 192dpi), only screen and (min-resolution: 2dppx) { .android-ai-lp .android-ai-video-frame { background: url("/images/ai/screen_2x.png") no-repeat bottom center / 378px 383px; } } .android-ai-lp .android-ai-video-mask { height: 375px; margin: 0 auto; max-width: 100%; overflow: hidden; padding: 68px 0 0; position: relative; width: 309px; } .android-ai-lp .android-ai-video-container { position: absolute; width: 365px; top: 68px; left: -28px; } .android-ai-lp .android-advanced-ai-solutions { background: #0a0b12 url("/images/ai/advanced-ai-solutions-bg.jpg") scroll 50% 50% repeat-x; padding-bottom: 232px; } .android-ai-lp .android-advanced-ai-solutions .devsite-landing-row-description { max-width: 100%; } .android-ai-lp .android-row-background-grey-900.android-illustrated-resources-index .devsite-landing-row-item:not([background]) { background-color: #0e0e0e; border-color: #80868b; } .android-ai-lp .android-row-background-grey-900.android-illustrated-resources-index .devsite-landing-row-item:not([background]):before { box-shadow: 0 14px 25px 0 rgba(60,64,67,.8),0 4px 13px 0 rgba(60,64,67,.8); } .android-ai-lp .android-row-background-grey-900.android-illustrated-resources-index .devsite-landing-row-item-description, .android-ai-lp .android-row-background-grey-900.android-illustrated-resources-index .devsite-landing-row-item-description h3, .android-ai-lp .android-row-background-grey-900.android-illustrated-resources-index .devsite-landing-row-item-description h3 a { color: #fff; } .android-ai-lp .android-advanced-ai-solutions-button { background-color: transparent; margin-top: -152px; } Android Developers Develop Overview Stay organized with collections Save and categorize content based on your preferences. Transform your Android experiences with AI Enable your Android apps to generate text and images, understand content, enrich information, and build engagement with users. Use Google's full suite of AI and ML tools to make your apps more useful and intuitive. Generative AI solutions for Android developers Build powerful generative AI experiences using Google's state-of-the-art Gemini models and integrated developer tools. With access to a range of modalities, capabilities, and architectures, you can create exactly the solution that you need - whether running on-device, integrating with cloud-based models, or a full enterprise AI solution. High-performance on-device AI Use Gemini Nano to deliver rich generative AI experiences on-device when privacy, offline functionality, low latency, and cost are your primary concerns. Multimodal Cloud AI with Google's most capable models Create rich, multimodal generative AI experiences using Google's cutting-edge cloud-based models, including Gemini Pro, directly in your app. Managed AI platform and services Enterprise developers can build custom-developed AI experiences using Vertex AI, Google's fully-managed, unified AI development platform for AI. Get started with generative AI on Android Experience the future of generative AI with Gemini 2.0 Flash! Experience the future of generative AI with Gemini 2.0 Flash! Gemini 2.0 Flash is currently available to Android developers to experiment with using backend integration. This cutting-edge model enjoys improved capabilities, including superior speed, native tool use, multimodal generation, and a 1M token context window. Check out the server SDK AI case studies Summarize voice notes Gemini Nano with multimodality enables support for longer recordings and higher-quality summaries in the Recorder app. Learn more TalkBack uses Gemini Nano for image accessibility Discover how Google Workspace is using Gemini to help users create, write, visualize, and organize documents to boost productivity in new ways. Learn more Innovative Android apps using Vertex AI in Firebase Read about how Android developers are using Vertex AI in Firebase to add generative AI features to their apps. Learn more Magic Editor Learn how Google Photos uses generative AI for the Magic Editor feature, available on Pixel 9 Series devices. Learn more Latest news and videos Accelerate your development AI-enhanced productivity tools can significantly accelerate Android development by automating repetitive tasks, suggesting code snippets, and offering intelligent debugging assistance, letting you focus on higher-level problem-solving and innovation. Gemini in Android Studio Gemini in Android Studio is your coding companion for Android development. It can generate code, find relevant resources, learn best practices, troubleshoot errors, and save time. Learn more Gemini API starter template This template and code samples streamline setup of a new AI-powered project in Android Studio, making it easier to leverage Gemini's multimodal capabilities for tasks like conversational chat, translation, and image captioning. Learn more Google AI Studio The fastest way to start using Gemini is with Google AI Studio, a web-based tool that lets you prototype, run prompts right in your browser, and get started with the Gemini API. Get started ML solutions Leverage Android device processing power for your ML detection and classification tasks to process images, sound and text. Play for On-device AI Deploy and manage your custom ML and GenAI models for on-device AI features efficiently with Play for On-device AI. Google Play simplifies model delivery, helping you to enhance user experience while keeping app size optimized. Join the early access program Common user flows with ML Kit SDKs ML Kit provides production-ready solutions to common problems and requires no ML expertise. Models are built-in and optimized for mobile. ML Kit is easy to use and lets you focus on feature development rather than model training and optimization. Learn more LiteRT If you want more control or to deploy your own ML models, Android provides a custom ML stack built on top of LiteRT and Google Play services, covering essentials needed to deploy high performance ML features. Learn more Get in touch If you are building generative AI features, we would love to have a conversation with you! Complete this form to keep in touch. Learn more Join a community group Android developers venturing into AI projects can tap into a wealth of community resources, including forums, online courses, code repositories, and dedicated events, fostering collaboration, knowledge sharing, and accelerated learning. Find a Google Developer Group near you, and search for events on the community site filtered by "Android", "Build with AI", "Gemini", and more. Find a Google Developer Group'''
