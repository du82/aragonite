not([background]) { background: var(--light-bluish); } .android-section-light-greenish, .android-section-light-greenish:not([background]) { background: var(--light-greenish); } .android-section-light-greenish .devsite-landing-row-description a { color: var(--link-color) !important; text-decoration: none; } .android-section-light-greenish .devsite-landing-row-description a:hover { text-decoration: underline; } .android-section-purplish .button-white, .android-section-reddish .button-white, .android-section-greenish .button-white, .android-section-lavenderish .button-white, .android-section-orangish .button-white, .android-section-bluish .button-white, .android-section-cyanish .button-white { color: var(--button-color) !important; } .android-spotlight-hero .devsite-landing-row-group { max-width: none; } .android-parallax-hero .button-primary { background: black !important; color: white !important; } .android-parallax-hero .button-primary:hover, .android-parallax-hero .button-primary:active { background: white !important; color: black !important; } .android-design-hub .external::after { display: inline-block; } .android-design-hub .devsite-header-no-lower-tabs .devsite-product-id-row { min-height: 68px; padding: 16px 24px; } .android-design-hub .devsite-landing-row.android-row-padding-top-xlarge-bottom-large { padding: 48px 0 24px !important; } .android-design-hub .devsite-landing-row-item-image a { position: relative; } .android-design-hub .devsite-landing-row-item-image a::before { border-radius: var(--item-border-radius); bottom: 0; box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .2); content: ''; left: 0; opacity: 0; position: absolute; right: 0; top: 0; transition: opacity .2s ease-out; } .android-design-hub .android-editorial-and-updates .devsite-landing-row-item-image a::before { border-radius: var(--item-border-radius) var(--item-border-radius) 0 0; } .android-design-hub .devsite-landing-row-item-image a:hover::before { opacity: 1; } .android-promo-full-width h2, .android-section-intro-full-width h2 { font: 600 40px / 48px var(--headline-font-family); letter-spacing: -.5px; } .android-callout .devsite-landing-row-item-description-content, .android-design-hub .devsite-landing-row-2-up:not(.android-editorial-and-updates) .devsite-landing-row-item-description-content, .android-design-hub .devsite-landing-row-3-up:not(.android-editorial-and-updates) .devsite-landing-row-item-description-content, .android-promo-full-width .devsite-landing-row-description, .android-section-intro-full-width .devsite-landing-row-description { font: 400 16px / 24px var(--headline-font-family); letter-spacing: .25px; } .android-promo-full-width .devsite-landing-row-header-buttons { margin-top: 20px; } .android-promo-full-width .devsite-landing-row-group { margin-top: 32px !important; } .android-design-hub-overview video { border-radius: var(--item-border-radius); } .android-design-hub-overview .android-promo-full-width .button { margin: 4px; } .android-design-hub-overview .android-promo-full-width .button + .button { margin-inline-start: 4px; } .android-design-hub-overview .android-promo-full-width .button-white { background: rgba(0, 0, 0, .06) !important; padding: 0 24px; } .android-design-hub-overview .android-promo-full-width .button-white:hover { background: rgba(0, 0, 0, .12) !important; } .android-design-hub-large-screens .android-video-caption { display: grid; grid: auto-flow / repeat(3, 1fr); grid-gap: 12px; margin-top: 12px; } .android-design-hub-large-screens .android-video-caption-item { align-items: center; display: flex; flex-direction: column; } .android-design-hub-large-screens .android-video-caption-item h4 { font: 400 16px / 24px var(--primary-font-family); margin: 0; } .android-design-hub-large-screens .android-video-caption-item p { font: 500 14px / 16px var(--primary-font-family); } .android-design-hub-samples .android-callout .devsite-landing-row-item { align-items: flex-start; } .android-design-hub .xr-video { display: var(--xr-video-display); } .android-design-hub .xr-video_dt { display: var(--xr-video-display-dt); } @media screen and (max-width: 600px) { .android-design-hub-overview .android-promo-full-width .button-white { max-width: 400px; width: 100%; } .android-design-hub-samples .android-callout .devsite-landing-row-item-media { order: 1; } .android-design-hub-samples .android-callout .devsite-landing-row-item-description { order: 2; } .android-design-hub-samples .android-callout .devsite-landing-row-item-media + .devsite-landing-row-item-description { margin-top: 0; } } @media screen and (min-width: 601px) { .android-design-hub .devsite-landing-row.android-row-padding-top-xlarge-bottom-large { padding: 64px 0 48px !important; } } @media screen and (min-width: 841px) { .android-design-hub .devsite-landing-row.android-row-padding-top-xlarge-bottom-large { padding: 94px 0 64px !important; } .android-design-hub-overview .android-promo-full-width .button + .button { margin-inline-start: 28px !important; } .android-promo-full-width h2, .android-section-intro-full-width h2 { font: 600 48px / 56px var(--headline-font-family); } .android-callout .devsite-landing-row-item-description-content, .android-design-hub .devsite-landing-row-2-up:not(.android-editorial-and-updates) .devsite-landing-row-item-description-content, .android-design-hub .devsite-landing-row-3-up:not(.android-editorial-and-updates) .devsite-landing-row-item-description-content, .android-promo-full-width .devsite-landing-row-description, .android-section-intro-full-width .devsite-landing-row-description { font: 400 20px / 32px var(--headline-font-family); } .android-design-hub-samples .android-callout .devsite-landing-row-item-media-left { grid-column: 1 / span 4; } } @media screen and (min-width: 1281px) { .android-design-hub-large-screens .android-video-caption-item h4 { font: 500 20px / 28px var(--headline-font-family); } .android-design-hub-large-screens .android-video-caption-item p { font: 400 16px / 24px var(--headline-font-family); letter-spacing: .25px; } } The Android XR SDK is now available in Developer Preview. We want your feedback! Visit our support page to reach out. Android Developers Design & Plan UI Design Android XR Stay organized with collections Save and categorize content based on your preferences. Design for Android XR Extended reality opens up a world of infinite space. Users can multitask while grounded in the real world, or escape into full immersion. While traditional UI design is limited to flat screens, XR creates endless possibilities for intuitive, immersive, and natural interactions. Design for XR Start from where you are Android XR is a flexible platform where you can design immersive experiences and bring your app into extended reality. Compatible Android mobile and large-screen apps are automatically available in the Play Store. Create a brand new experience from the ground up - or add immersive elements to an existing app using Android Jetpack XR, Unity, OpenXR, or WebXR. Android XR design options Design Android XR differentiated apps Create scenes that delight users with spatial panels, tangible 3D content, dynamic environments, and spatial audio. Learn more Design Unity, OpenXR, or WebXR experiences Build an app that's compatible across platforms with advanced immersive tools. Learn more Get started Guides Getting started Learn the foundations of Android XR including spaces, environments, and natural inputs. Get started Guides Design principles Start from where you are, keep users comfortable, add key XR moments, and make your app accessible. Design for XR Guides Visual design Adopt Material Design styles including sizes, scaling, large target sizes, colors, and typography. See visual design Guides Multimodal inputs Design experiences that let users naturally interact with your app. Learn about inputs Guides Spatial UI You can break out your app into spatial panels, include orbiters, and add spatial elevation. See spatial UI Guides 3D models Add 3D elements to bring a sense of depth, scale, and realism to your app. See 3D models Guides Environments Put the user at the center of the app experience with full immersion. See environments Guides Motion Motion can transform your XR app from a static scene into an interactive experience. See motion Adaptable design Material Design for XR provides components and layouts that adapt for XR. If your large-screen app aligns with Material Design guidelines, its typography, target sizes, and components are compatible with Android XR. Get started with the Material 3 Design Kit Develop for Android XR Developer guides Use our developer guides and APIs to build your Android XR app. Develop with Jetpack XR SDK, Unity, OpenXR, or WebXR App quality guidelines Follow XR design best practices to ensure your app is easy to use and comfortable. See Android XR app quality guidelines"
