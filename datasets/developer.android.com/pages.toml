{ display: inline-block; font-family: var(--headline-font-family); font-style: normal; font-weight: 600; font-size: 22px; line-height: 34px; } @media screen and (max-width: 600px) { .dac-migration-flow-item-header span { font-size: 18px !important; line-height: 25px; } .dac-android-migration { border: solid 20px var(--migration-flow-background) !important; } .dac-migration-flow-item-description p { font-size: 14px; } } .dac-migration-flow-item:last-child, .dac-migration-flow-item:last-child span { color: #fff !important; background: #073042; } .dac-migration-flow-media { background: url(/images/shared/arrow.svg); height: 60px; background-repeat: no-repeat; align-items: center; background-position: center; } .dac-migration-flow { background-color: var(--migration-flow-background); } .dac-migration-flow-item-description, .dac-migration-flow-item-header { padding: 25px 20px; } The Android 16 Beta is now available. Try it out today and let us know what you think! Android Developers Essentials Releases Stay organized with collections Save and categorize content based on your preferences. Android 15 continues our mission of building a private and secure platform that helps improve your productivity while giving you new capabilities to produce beautiful apps, superior media and camera experiences, and an intuitive user experience, particularly on tablets and foldables. Get started Test your app Behavior changes The Android 15 platform includes changes that may affect your app. Test and modify your app as needed. All apps Apps targeting Android 15 New features Android 15 introduces great new features and APIs for developers. Read more Get started with Android 15 Set up a runtime environment — see Get Android 15 to flash a Google Pixel device or set up an emulator. Set up Android Studio — try the Android 15 SDK and tools. See the SDK setup page for steps. Learn about what's new — review the behavior changes for all apps and the behavior changes for apps targeting Android 15 that might've affected your app. Test your app — run through all flows to look for issues. Toggle behavior changes at runtime to isolate issues. Update your app — target Android 15 if possible, and test with users using beta channels or other groups. Tools and resources Compatibility tools Toggle top behavior changes and debug with integrated logging—no need to change targeting. Learn more Migrate your apps Follow this checklist of steps to get your apps ready for Android 15. Learn more Give feedback Your feedback and issue reports are critical information for the Android team! Use our main issue tracker to let us know. Learn more Latest news'''
