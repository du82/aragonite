title = "Develop UI for Android  |  Jetpack Compose  |  Android Developers"
description = "Jetpack Compose is Android's recommended modern toolkit for building native UI. It simplifies and accelerates UI development on Android. Quickly bring your app to life with less code, powerful tools, and intuitive Kotlin APIs."
full_description = "/* Styles inlined from /assets/css/ui-overview.css */ :root { --item-border-radius: 24px; --primary-font-family: Google Sans Text, Noto Sans, Noto Sans JP, Noto Sans KR, Noto Naskh Arabic, Noto Sans Thai, Noto Sans Hebrew, Noto Sans Bengali, sans-serif; --headline-font-family: Google Sans, Noto Sans, Noto Sans JP, Noto Sans KR, Noto Naskh Arabic, Noto Sans Thai, Noto Sans Hebrew, Noto Sans Bengali, sans-serif; } .android-develop-ui .devsite-landing-row-item-description-content { font-family: var(--primary-font-family); font-size: 16px; } .android-decorative-develop-ui-hero { padding-bottom: 0px; line-height: 24px !important; } .android-featured-samples .devsite-card, .android-featured-samples .devsite-landing-row-item, .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-featured-samples .devsite-card-content, .android-featured-samples .devsite-landing-row-item-description, .android-guides .devsite-landing-row-item-description { padding-inline: 24px; } .android-featured-samples .devsite-landing-row-item-body h3 { font: 500 24px / 32px var(--headline-font-family); } .android-guides .devsite-landing-row-item-description { padding-block: 24px; } .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .android-featured-samples .devsite-landing-row-item-description-content { display: flex; flex: 1; flex-direction: column; } .android-featured-samples .devsite-landing-row-item-description-content p { color: #5f6368; } .android-featured-samples .devsite-card-metadata { align-items: flex-start; display: flex; justify-content: space-between; margin-top: auto; } .android-featured-samples .devsite-dynamic-content-display-tag-container, .android-featured-samples .devsite-card-skill { padding: 0; } .android-featured-samples .devsite-dynamic-content-display-tag { border-radius: 12px; color: #3c4043; font-size: 12px; font-weight: 500; line-height: 20px; margin-block: 2px; } .android-featured-samples .fully-clickable:hover a { color: #1769e0 !important; } .color-scheme--dark .android-featured-samples .devsite-card, .color-scheme--dark .android-featured-samples .devsite-landing-row-item, .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-body h3 { color: white; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-description-content p { color: #f8f9fa; } .color-scheme--dark .android-featured-samples .devsite-dynamic-content-display-tag { color: white; } .color-scheme--dark .android-featured-samples .fully-clickable:hover a { color: #aecbfa !important; } Android Developers Develop Core areas UI Stay organized with collections Save and categorize content based on your preferences. Develop UI for Android Jetpack Compose is Android's recommended modern toolkit for building native UI with less code, powerful tools, and intuitive Kotlin APIs. It simplifies and accelerates UI development, including adaptation to any form factor—from smartphones, foldables, and tablets to TVs and wearables. Compose offers pre-built UI components that work with graphics, animations, and other visual elements. For existing views-based UIs, you can choose to migrate to Compose or continue to use views-based workflows. New! Try Quick Guides Try the tutorial Learn building UI with Android New to Compose? For developers already familiar with Android: this course covers the essentials of building native UI with Compose, including layouts, theming, animations, architecture, state, accessibility and testing. Start Compose course New to Compose and Android? For developers just getting started with Android: learn how to build an Android app using Jetpack Compose, the recommended toolkit for building user interfaces on Android. Start Android Basics with Compose course Build across devices Guide Large screens Develop for large screens to make more UI options available for users. Large screens—like tablets, foldables, and ChromeOS devices—showcase content and facilitate multitasking. Guide Wear OS Write apps for wearables that enable users to stay connected, monitor biometric data, track exercise, and take advantage of other useful features on-the-go. Guide Android for TV Create new apps for TVs based on what you already know about Android. Or, extend your existing apps to run on TVs. Guide Android for Cars Bring your app to vehicles running Android Auto or Android Automotive OS. One app architecture works for both cases so your users can enjoy your app in cars. Support accessibility Design for accessibility to design for everyone. Check out integrating accessibility features and services to improve your app's usability. Develop for accessibility Now in Android Now in Android is an Android app built with Kotlin and Jetpack Compose. Now in Android is designed to serve as a reference for Android developers and models best practices for design and development. Android System UI Intermediate AppWidget AppWidgets is a collection of samples that demonstrates how to build app widgets using Jetpack Glance—a framework built on top of Compose. UI Intermediate Performance Refine your app's performance to ensure that your user interface runs smoothly, with tangible reactivity. Read the docs Testing Write robust tests to ensure that your app's user interface is reliable, free of jank, and working as intended. Learn more Getting started Get started with Android 14 Android 14 introduces great new features and APIs for developers. Build richer media experiences with Ultra HDR, new camera extensions, and lossless USB audio. Simplify sign-in and provide health insights. Support large-screen overrides per user or manufacturer. And much more. Features and APIs overview Latest videos"
