{ display: inline-block; font-family: var(--headline-font-family); font-style: normal; font-weight: 600; font-size: 22px; line-height: 34px; } @media screen and (max-width: 600px) { .dac-migration-flow-item-header span { font-size: 18px !important; line-height: 25px; } .dac-android-migration { border: solid 20px var(--migration-flow-background) !important; } .dac-migration-flow-item-description p { font-size: 14px; } } .dac-migration-flow-item:last-child, .dac-migration-flow-item:last-child span { color: #fff !important; background: #073042; } .dac-migration-flow-media { background: url(/images/shared/arrow.svg); height: 60px; background-repeat: no-repeat; align-items: center; background-position: center; } .dac-migration-flow { background-color: var(--migration-flow-background); } .dac-migration-flow-item-description, .dac-migration-flow-item-header { padding: 25px 20px; } The Android 16 Beta is now available. Try it out today and let us know what you think! Android Developers Essentials Releases Stay organized with collections Save and categorize content based on your preferences. Build richer camera and media experiences with Ultra HDR, more camera extensions, and lossless USB audio. Simplify sign-in using Credential Manager, and provide health and fitness insights securely using Health Connect. Make your app more expressive and personal with predictive back, per-app languages, grammatical inflection, and more. Deliver engaging, differentiated experiences on large screens. Get started Test your app Behavior changes The Android 14 platform includes changes that may affect your app. Test and modify your app as needed. All apps Apps targeting Android 14 New features Android 14 introduces great features and APIs for developers in areas such as camera, media, internationalization, accessibility, and user experience. Read more Get more with Android 14 There are over 60 new or updated features related to Android 14, but we've made it easier to explore by sorting the most-popular ones into the following themes. See all features and APIs Expression Deeper and more-personal customization, allowing your users to express themselves on their devices. Guide HDR video capture The Camera2 APIs support high dynamic range (HDR) video capture. Guide Glance for widgets Build layouts for remote surfaces using a Jetpack Compose-style API. Multidevice experience Develop quality experiences for a variety of devices that work seamlessly together, including large screens, foldables, and watches. Guide Compose for Wear OS Compose for Wear OS, part of Android Jetpack, helps you write better code faster. Guide Multi-window fullscreen API Multi-window mode enables multiple apps to share the same screen simultaneously. Protection Secure by default and private by design. Guide Privacy Sandbox Privacy Sandbox aims to improve user privacy and enable effective, personalized advertising experiences for mobile apps. Guide Photo picker The photo picker provides a browsable, searchable interface that presents the user with their media library, sorted by date from newest to oldest. Get started with Android 14 Set up a runtime environment — see Get Android 14 to flash a Google Pixel device or set up an emulator. Set up Android Studio — try the Android 14 SDK and tools. See the SDK setup page for steps. Learn about what's new — review the behavior changes for all apps and the behavior changes for apps targeting Android 14 that might've affected your app. Test your app — run through all flows to look for issues. Toggle behavior changes at runtime to isolate issues. Update your app — target Android 14 if possible, and test with users using beta channels or other groups. Tools and resources Compatibility tools Toggle top behavior changes and debug with integrated logging—no need to change targeting. Learn more Migrate your apps Follow this checklist of steps to get your apps ready for Android 14. Learn more Give feedback Your feedback and issue reports are critical information for the Android team! Use our main issue tracker to let us know. Learn more Latest news'''
