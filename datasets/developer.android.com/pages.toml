full_description = "/* Styles inlined from /assets/css/android-go.css */ :root { --item-border-radius: 24px; } .android-go-page .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-go-page .android-guides .devsite-landing-row-item-description { padding-block: 24px; padding-inline: 24px; } .android-go-page .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .color-scheme--dark.android-go-page .android-guides .devsite-landing-row-item { border-color: #80868b; } Android Developers Design & Plan Build for Billions Stay organized with collections Save and categorize content based on your preferences. Android (Go edition) A lightning-speed OS built for smartphones with 4GB or lower RAM. Android (Go edition) runs lighter, saves data, and optimizes storage so users can have access to amazing smartphone experiences on entry-level devices. Read about why Android (Go edition) Getting started Whether you’ve already built your Android app or are looking to get started, here are some guides for best practices to follow to ensure the best performance. Guide Develop for Android (Go edition) Considerations to remember when you begin your development journey on Android (Go edition). Read more Guide Hardware requirements There are minimum RAM requirements for devices to run Android (Go edition), depending on the version of Android you are running. Read more Guide Optimize for Android (Go edition) Optimize existing applications to perform well on low-RAM devices. Read more Build for billions guidelines There are unique challenges when building for emerging markets around the world with incredibly fast growing internet and smartphone usage. Deliver the best possible experience for your users and help your app succeed in these markets by checking out our advice on building for the world. Read more Next Billion Users initiative Everyone — no matter their location, language or digital literacy — deserves an internet that was made for them. Google’s Next Billion Users initiative conducts research and builds products for people around the world. Read about Google’s Next Billion Users initiatives Resources"
