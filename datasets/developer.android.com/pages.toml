full_description = '/* Styles inlined from /assets/css/distribute.css */ /* Google Play landing page hero module illustration. */ .dac-play-page .dac-play-hero-banner::after { background: url(/distribute/images/heroes/google-play-console-webinars.svg) center / 65% no-repeat; } @media screen and (max-width: 1200px) { .dac-play-page .dac-play-hero-banner::after { background-size: 80%; } } /* Fix inline link colors */ [background="white"] .devsite-landing-row-item-description-content :link:not(.button), [background="white"] .devsite-landing-row-item-description-content :visited:not(.button) { color: #1a73e8; text-decoration: underline; } .dac-play-page .dac-featured-cards .devsite-landing-row-item-description-content { -webkit-box-orient: vertical; -webkit-line-clamp: 4; display: -webkit-box; overflow: hidden; text-overflow: ellipsis; } .dac-play-policies-page .dac-illustration-play-policies-app-bundle::after { background: url(/distribute/images/app-bundle.svg) center / 50% no-repeat; } .dac-play-policies-page .dac-timeline td { vertical-align : middle; } .dac-play-policies-page .dac-timeline a { text-decoration: underline; } .dac-play-services-page .dac-play-more-services { padding: 24px 24px 12px 24px !important; } .android-reflex-media .devsite-landing-row-header { flex-direction: column; } .android-centered-media .devsite-landing-row-header { text-align: center !important; align-items: center !important; justify-content: center !important; } .android-reflex-media .devsite-landing-row-header-buttons { padding-top: 30px; margin: 0px !important; } .final-image-padding { padding: 40px; } Google Play Overview Stay organized with collections Save and categorize content based on your preferences. Google Play With the ability to publish rapidly to over 2 billion active Android devices, Google Play helps you grow a global audience for your apps and games and earn revenue. Sign in to Play Console Reach Google Play helps you reach over 2.5 billion active Android devices, including phones, tablets, watches, cars, and TVs. Sign in to Play Console Security Protect your apps and games and protect your users with the Play Integrity API. Use the Play Integrity API Monetization Sell digital subscriptions and in-app content in 135 countries with hundreds of payment methods on our safe and trusted commerce platform. Sell digital content Quality Monitor app behavior metrics to help you fix issues that affect your app and game quality, like crashes, unresponsive apps, and app behavior that drains battery life. Use the Reporting API Find tools to help with trust, safety, and more Explore dozens of APIs, guides, docs, and more to help you do everything from monetizing your app to building user trust. Security & privacy Play Integrity API Protect your apps and games from potentially risky and fraudulent interactions to reduce attacks and abuse. gaming Develop Android Games Develop Android games and deploy them to multiple device types on Android, ChromeOS, and Windows. quality Reporting API Access app-level data from outside Play Console to build internal dashboards, combine datasets, and more. tools SDK Index Get insights and usage data for over 100 commercial SDKs to make informed decisions about whether an SDK is right for you. Monetization Play Billing APIs Sell digital products and content in your Android app, including subscriptions and special offers. tools Google Play Services Build powerful and reliable Android apps for Google Play using the latest Google features and technologies. Google Play Console Troubleshoot before launch, ensure technical performance, maximize your reach, and more with dozens of built-in features. Learn more about Play Console Distribution Make your app launch a success with tools and strategies to help publish, manage, and distribute your app worldwide Learn more Acquisition Accelerate your user growth with our reporting and optimization tools, including unique market insights exclusive to Google Play Learn more Monetization Create a revenue stream by launching a paid app or offering digital content or subscriptions Learn more Engagement Keep users coming back for more with our engagement tools and insights Learn more Latest news View all news'
