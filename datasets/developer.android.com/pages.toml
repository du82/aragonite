["https://developer.android.com/develop/connectivity"]
title = "Android Connectivity  |  Android Developers"
description = "Connectivity describes how Android apps connect to and use network connections, including WiFi and Bluetooth."
full_description = "Android Developers Develop Core areas Connectivity Stay organized with collections Save and categorize content based on your preferences. Connectivity Connect your app to the outside world, whether it's through Bluetooth, Wi‑Fi or cellular network, USB, or another standard protocol. Go to the guides Common protocols Android supports a variety of standard communication protocols. Guide USB Support USB accessory and host modes. Guide 5G Add 5G capabilities to your app. Guide Near field Communication (NFC) Enable devices to communicate within 4 cm or less. Guide VPN Develop and test a VPN client. Guide Telecom Manage audio and video calls on Android. Guide Ultra-wideband (UWB) communication Measure precise ranging between devices. Bluetooth Use the Bluetooth protocol that matches your app needs and use cases. Bluetooth Classic Exchange data with other devices. Bluetooth Low Energy (BLE) Exchange smaller data chunks using less energy. BLE Audio Receive high-fidelity audio using less energy. Wi‑Fi Use the Wi-Fi protocol that matches your app needs and use cases. Wi-Fi access Scan for Wi-Fi access points. Wi-Fi Direct (P2P) Enable direct device connections between any devices. Wi-Fi Aware Enable direct connections between Android 8.0+ devices. Wi-Fi RTT (Round-Trip Time) Measure distances between nearby access points and devices. Optimize your app for connectivity Get the most out of using communications technology with your app. Guide Cronet Reduce latency and increase network request throughput. Guide Save energy Preserve battery usage."
