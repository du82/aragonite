full_description = '''/* Styles inlined from /assets/css/mad-update.css */ :root { --item-border-radius: 24px; --primary-font-family: Google Sans Text, Noto Sans, Noto Sans JP, Noto Sans KR, Noto Naskh Arabic, Noto Sans Thai, Noto Sans Hebrew, Noto Sans Bengali, sans-serif; --headline-font-family: Google Sans, Noto Sans, Noto Sans JP, Noto Sans KR, Noto Naskh Arabic, Noto Sans Thai, Noto Sans Hebrew, Noto Sans Bengali, sans-serif; } .android-mad-update .android-section-intro-sidecar-primary h2 { font: 600 32px / 40px var(--headline-font-family); letter-spacing: -.25px; } .android-mad-update .android-section-intro-sidecar-primary .devsite-landing-row-header { grid-column: 1 / span 4; } .android-mad-update .android-table-good-great th, .android-mad-update .android-table-good-great td { background: white; border: 3px solid white; color: black; font: 500 16px / 24px var(--headline-font-family); vertical-align: middle; } .android-mad-update .android-table-good-great th { font-weight: 600; padding: 24px; } .android-mad-update .android-table-good-great td { padding: 6px 24px; } .android-mad-update .android-table-good-great td > div { align-items: center; display: flex; } .android-mad-update .android-table-good-great td[colspan="2"] > div { justify-content: center; } .android-mad-update .android-table-good-great img { margin-inline-end: 12px; max-width: 56px; } .android-mad-update th.android-table-header-good { background: #d7effe; } .android-mad-update th.android-table-header-great { background: #45e190; } .android-mad-update td.android-table-cell-title { padding: 6px 24px 6px 0; } .android-mad-update td.android-table-cell-good { background: #ebf7fe; } .android-mad-update td.android-table-cell-great { background: #f5fcf6; } @media screen and (min-width: 601px) { .android-mad-update .android-table-cell-title, .android-mad-update .android-table-cell-great { width: 35%; } .android-mad-update .android-table-cell-good { width: 30% } } @media screen and (min-width: 601px) and (max-width: 840px) { .android-hidden-tablet { display: none; } } @media screen and (min-width: 841px) { .android-hidden-desktop { display: none; } } @media screen and (min-width: 1281px) { .android-mad-update .android-section-intro-sidecar-primary .devsite-landing-row-group { margin-inline-start: 40px; } } @media screen and (max-width: 1280px) { .android-mad-update .android-section-intro-sidecar-primary .devsite-landing-row-inner { display: block; } .android-mad-update .devsite-table-wrapper { margin: 64px 0 0; } .android-mad-updateb .devsite-table-wrapper + .devsite-table-wrapper { margin-top: 80px; } } @media screen and (max-width: 840px) {} @media screen and (max-width: 600px) { .android-hidden-mobile { display: none; } .android-mad-update .android-table-cell-title { width: 45%; } } .android-mad-update .devsite-landing-row-item-description-content { font-family: var(--primary-font-family); font-size: 16px; } .android-decorative-develop-ui-hero { padding-bottom: 0px; line-height: 24px !important; } .android-featured-samples .devsite-card, .android-featured-samples .devsite-landing-row-item, .android-guides .devsite-landing-row-item { border: 1px solid #e8eaed; border-radius: var(--item-border-radius); } .android-featured-samples .devsite-card-content, .android-featured-samples .devsite-landing-row-item-description, .android-guides .devsite-landing-row-item-description { padding-inline: 24px; } .android-featured-samples .devsite-landing-row-item-body h3 { font: 500 24px / 32px var(--headline-font-family); } .android-guides .devsite-landing-row-item-description { padding-block: 24px; } .android-guides .devsite-landing-row-group { grid-gap: 32px; margin-top: 20px !important; } .android-featured-samples .devsite-landing-row-item-description-content { display: flex; flex: 1; flex-direction: column; } .android-featured-samples .devsite-landing-row-item-description-content p { color: #5f6368; } .android-featured-samples .devsite-card-metadata { align-items: flex-start; display: flex; justify-content: space-between; margin-top: auto; } .android-featured-samples .devsite-dynamic-content-display-tag-container, .android-featured-samples .devsite-card-skill { padding: 0; } .android-featured-samples .devsite-dynamic-content-display-tag { border-radius: 12px; color: #3c4043; font-size: 12px; font-weight: 500; line-height: 20px; margin-block: 2px; } .android-featured-samples .fully-clickable:hover a { color: #1769e0 !important; } .color-scheme--dark .android-featured-samples .devsite-card, .color-scheme--dark .android-featured-samples .devsite-landing-row-item, .color-scheme--dark .android-guides .devsite-landing-row-item { border-color: #80868b; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-body h3 { color: white; } .color-scheme--dark .android-featured-samples .devsite-landing-row-item-description-content p { color: #f8f9fa; } .color-scheme--dark .android-featured-samples .devsite-dynamic-content-display-tag { color: white; } .color-scheme--dark .android-featured-samples .fully-clickable:hover a { color: #aecbfa !important; } Android Developers Essentials Get started Stay organized with collections Save and categorize content based on your preferences. Get started with Android To get started, do a quick codelab or dive deeper into a training course for an overview of key Android development topics. Create a Hello World app Follow this introductory codelab with step-by-step instructions to make a simple Hello World app. Start codelab Build a scalable, modularized, testable Android app This tutorial shows you how to build a scalable, modularized, testable app from scratch. This won't be a Hello World app. We'll concentrate on building an app architecture that will enable your app to grow. Courses Start the Android Basics course Take the full course to learn the basics of creating apps with Jetpack Compose, Android's modern toolkit for developing user interfaces. As you create a series of apps, you’ll learn the basics of the Kotlin programming language and the fundamentals of app development. Start codelab Learn Browse learning resources Go deeper by exploring other training resources, such as learning pathways for more-advanced topics, including Compose, app architecture, and accessibility. Go to training resources Assemble your toolkit Compose: Build compelling user interfaces Jetpack Compose simplifies and accelerates UI development on Android. Write less code and use powerful tools and intuitive Kotlin APIs. Use Compose Kotlin: A modern, concise, powerful language More than 95% of the the top 1,000 Android apps use Kotlin to boost productivity, developer satisfaction, and code safety. Learn more Jetpack: Libraries for easier app development Check out the Android suite of libraries, which implement our best practices and reduce boilerplate code. Get started Use Android Studio for development Android Studio is the official IDE for Android app development, featuring Compose design tools, flexible build system, and Android Emulator. Android Studio Target the latest Android version We handle backwards compatibility, so you can target the latest Android version, use the latest technologies, and run consistently across Android versions and devices. Get started Architecture and testing best practices Architecture, testing patterns, and guidance help you build solid, scalable apps. Learn more App quality matters Build high-quality apps to provide seamless and consistent user experiences. Explore how to build for large screens, and ensure your apps work well across form factors like tablets, foldable devices, and Chromebooks. Use the Android core app-quality checklist to help evaluate the smoothness and safety of your user experience. See guidelines Good Great Core value Fun, useful, or both User experience Easy to use Delightful to use Technical quality Work well on users' devices Make the most of users' devices Privacy and security Safe Designed for safety Good Core value Fun, useful, or both User experience Easy to use Technical quality Works well on users’ devices Privacy and security Safe Great Core value Fun, useful, or both User experience Delightful to use Technical quality Makes the most of users' devices Privacy and security Designed for safety Featured samples If you learn best by reading code, there's a wide range of sample apps that you can check out, modify, and learn from. Now in Android Now in Android is an Android app built with Kotlin and Jetpack Compose. Now in Android is designed to serve as a reference for Android developers that models best practices for design and development. Compose samples This repository contains a set of individual Android Studio projects to help you learn about Compose in Android. Each sample demonstrates different use cases, complexity levels and APIs. To do app These samples showcase different architectural approaches to developing Android apps. In its different branches you'll find the same app (a TODO app) implemented with small differences. Browse all the samples'''
