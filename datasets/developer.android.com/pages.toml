title = "Brand guidelines  |  Google Play  |  Android Developers"
description = "Guidelines and downloads for the Android and Google Play brands."
full_description = '''Google Play Brand & marketing Brand guidelines Stay organized with collections Save and categorize content based on your preferences. The "Android" name, the Android logo, the "Google Play" brand, and other Google trademarks, are property of Google LLC and not part of the assets available through the Android Open Source Project. These guidelines correspond to and complement the marketing materials on the Partner Marketing Hub and Google Brand Permissions. All creatives that include or reference Android or Google trademarks must be reviewed and fully approved by the Android brand team. Below are relevant legal guidelines on how to display our trademarks. Use the brand request form to submit your marketing for review. Google Play Google Play name and icon Use of the "Google Play" name and the Google Play Store icon is allowed only in association with devices licensed to access Google Play. For a list of devices licensed to use Google Play, refer to Supported devices. Google Play badge App developers distributing an Android app can find the Google Play badge in the Partner Marketing Hub. These visuals can be used in marketing materials. Google play badges Badges can be used in marketing campaigns to promote content on Google Play. arrow_forward Other For all other uses of the Google Play brand, please consult guidance on the Partner Marketing Hub and submit your request using the inquiry form below. Android The use of the "Android" trademark on hardware, packaging or marketing materials of device is restricted to Android-compatible devices only. Here are guidelines for the Android brand and related assets that can be used for compatible devices. For detailed guidance, please consult the Partner Marketing Hub. The following are guidelines for the Android brand and related assets. Android robot The green Android robot can be reproduced and/or modified as long as the following Creative Commons attribution line is included in the creative: "The Android robot is reproduced or modified from work created and shared by Google and used according to terms described in the Creative Commons 3.0 Attribution License." PNG SVG PNG SVG The color value for print is PMS 2412C and the online hex color is #3ddc84. You may not file trademark applications for or claim trademark rights to the Android robot logo or any derivatives thereof. Google retains all trademark rights to the Android robot. We want to ensure that the Android robot remains available for all to use. Android in text Trademark & Attribution warning Caution Android™ should have a trademark symbol the first time it appears in a creative. > Android is a trademark of Google LLC. warning Caution Any use of the Android name needs to include this attribution in your communication. 'Android' wordmark alongside logos If used with your logo, "for Android" or "with Android" should be no larger than 90% of your logo's size. The first instance of this use should be followed by a TM symbol: "for Android™". Case / Grammar of 'Android' Android should always be capitalized and is never plural or possessive. Using 'Android' in application naming "Android", or anything confusingly similar to "Android", cannot be used in names of applications or accessory products, including phones, tablets, TVs, speakers, headphones, watches, and other devices. Instead, use "for Android". "MediaPlayer for Android" check_circle Do "Android MediaPlayer" "Ndroid MediaPlayer" cancel Don't "Android TV", "Android Wear", "Android Auto", "Android Automotive OS", "Google Pay", and "Android Things" may only be used to identify or market products or services with prior approval. Use "for Android" or "with Android" for all other Android-based products. "Streaming Stick with Android" check_circle Do "Android TV Streaming Stick" "Streaming Stick with Android TV" cancel Don't 'Android' as a text descriptor Android may be used as a descriptor in text, as long as it is followed by a proper generic term and is not the name of your product, app, or service. Think of "Android" as a term used in place of "the Android platform." "Android features" "Android applications" check_circle Do "Android MediaPlayer" "Android XYZ app" cancel Don't Android wordmark cancel Don't Unless expressly authorized by Google through written agreement, the Android wordmark and custom typeface may not be used. Marketing reviews and brand inquiries Submit a brand request to make any marketing reviews or brand inquires. Typical response time is at least one week. emailBrand request form For questions about Partner Marketing Hub, our brands, or marketing permissions. arrow_forward'''
year_published = 2025
clearnet = "https://developer.android.com/distribute/marketing-tools/brand-guidelines"
