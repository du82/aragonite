full_description = '''window.stringResources = {}; Developer Microsoft 365 Viva Build apps for Microsoft Viva Use the Viva Connections toolkit and the Viva Learning API to grow your customer reach with an open and extensible platform. APIs for Viva Topics and Viva Insights coming soon! Extend Viva Connections Integrate with Viva Learning Why develop for Microsoft Viva? Build with simple and familiar frameworks Use simple tools such as SharePoint Framework and Adaptive Cards, improving your time to market. Get more with the Viva footprint Increase the value of your Microsoft 365 and Microsoft Teams subscriptions by engaging employees in new Viva experiences. Expand your reach across Viva and Microsoft 365 Share your app across Viva and Microsoft 365 surfaces and expand the reach of your solutions. Take advantage of partner benefits Sign up for the Microsoft Partner Program and increase customer reach and engagement. What can I do with Viva? Reach users in Viva Connections with Adaptive Card Extensions Build an extension Get started with Microsoft Graph connectors Build a custom connector Customize Viva Topics pages with SharePoint client-side web parts Read overview of web parts Build custom Power BI templates with Viva Insights data Analyze query data Get more Viva resources Browse code samples Explore our samples and discover what you can build. Download code samples Community calls Join our community calls to stay up to date and upgrade your skills. Add to calendar Sample solutions Explore our sample solution gallery. Explore gallery Videos Watch developer videos on our YouTube channel. View videos Learn Take our multi-part series that teaches you how to extend Microsoft Viva Connections with custom components. Start now Newsletter Register for more details about Microsoft Viva. Sign up What's new in Viva extensibility Announcing SharePoint Framework 1.20 with updates on building enterprise extensibility within Microsoft 365 Read blog post Announcing SharePoint Fr