full_description = '''.img-blog-hero { background-image: url(https://devblogs.microsoft.com/wp-content/themes/devblogs-evo/images/blog-hero.png); background-size: 59%; background-position: right bottom; background-repeat: no-repeat; } .clr-blog-hero { background: linear-gradient(164deg, #F9F8FE 29.52%, #F7E7FF 55.42%); } html[theme=dark] .clr-blog-hero { background: linear-gradient(164deg, #141414 29.52%, #201625 55.42%); } Dev BlogsBlog Microsoft for DevelopersEmpowering every developer with trusted Microsoft insights /* Default Grid View */ .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } @media (min-width: 1361px) { .masonry-container { grid-template-columns: repeat(3, minmax(0px, 1fr)); } } @media (max-width: 1360px) { .masonry-container { grid-template-columns: repeat(2, minmax(0px, 1fr)); } } /* The image itself */ .thumbnail-container img { height: auto; max-height: 100%; width: auto; max-height: 301px; } @media (min-width: 900px) { .pinned-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } } Latest posts /* Storing grid globle styles here for now*/ .masonry-card { box-sizing: border-box; } .archive-posts.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } /* Masonry thumbnail */ .masonry-thumbnail { display: flex; justify-content: center; } .grid-view .masonry-thumbnail { align-items: center; width: 100%; min-height: 188px; } .grid-view .masonry-thumbnail img { max-height: 164px; width: auto; } .masonry-thumbnail { background: var(--clr-card-image-bg); border-radius: 8px; padding: 12px; } /* Grid View */ .home.blog .archive-posts.grid-view .masonry-card { display: block; } /* Single Column View */ .archive-posts.single-column { display: block; } .archive-posts.single-column .masonry-card { min-height: 311px; margin-bottom: 24px; } @media (min-width: 1084px) { .masonry-container { gap: 40px; } .masonry-card { padding: 24px; } .archive-posts.single-column .masonry-card { margin-bottom: 40px; } } @media (min-width: 900px) { .card-body { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; } .archive-posts.single-column .card-body { width: 60%; } } @media (max-width: 760px) { .masonry-container { grid-template-columns: 1fr; } .single-column .masonry-card { display: block; } .single-column .masonry-thumbnail { margin-bottom: 16px; } } .single-column .masonry-card { flex-direction: row; gap: 32px; } @media (min-width: 761px) { .single-column .masonry-card .masonry-thumbnail { flex-grow: 1; align-items: center; min-width: 240px; max-width: 449px; width: 40%; } } .single-column .card-body .card-top>div { margin-top: 0px; } /* Style the button */ .layout-toggle { display: none; } @media (min-width: 760px) { .layout-toggle { display: flex; gap: 12px; height: 32px; } } .layout-toggle button { background-color: transparent; border: none; cursor: pointer; padding: 0px; } .layout-toggle button svg path { fill: var(--clr-landing-navbar); } .layout-toggle button.active svg rect { fill: var(--clr-btn-toggle); stroke: none; } .layout-toggle button:not(.active) svg rect { fill: var(--clr-card-bg); stroke: var(--clr-btn-greyscale-border); } .layout-toggle button.active svg path { fill: white; } .layout-toggle button:not(.active):hover svg rect { fill: var(--clr-btn-greyscale-hover-bg); } .layout-toggle button:focus { border-radius: 4px; } .excerpt-title { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } .excerpt-body { display: -webkit-box; -webkit-line-clamp: 3; /* Number of full lines */ -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; } document.addEventListener('DOMContentLoaded', function () { // detect if we are on the landing page or a blog home page in PHP, but otherwise keep the logic in JS for clarity const isMainSite = true; // Single column layout view toggle const wrappers = document.querySelectorAll('.archive-posts'); const paginateSelector = (isMainSite ? '.netsposts-paginate .next' : '#pload-more' ); const paginate = document.querySelector(paginateSelector); const gridButton = document.getElementById('grid-view-btn'); const columnButton = document.getElementById('column-view-btn'); // observer to apply the updated layout attribute to newly added cards automatically after load more is clicked const cardObserver = new MutationObserver((mutations, observer) => { let newCards = false; // check that at least one new card has been added mutations.forEach(function(mutation) { if (mutation.type === 'childList') { newCards = true; } }); // run once if new cards have been added rather than once for each mutation if (newCards) { let chosenLayout = (gridButton.classList.contains('active') ? 'grid-view' : 'single-column'); updateLatestPostsTracking(chosenLayout); } }); cardObserver.observe(wrappers[0], {childList: true}); // Check for stored layout in localStorage let storedLayout = localStorage.getItem('layout') || 'grid-view'; // Default is grid-view // Apply the stored layout wrappers.forEach(wrapper => { wrapper.classList.add(storedLayout); }); updateLatestPostsTracking(storedLayout); // Function to update the layout state in localStorage function updateLayoutState(layout) { localStorage.setItem('layout', layout); // Store layout in localStorage } // function to update data bi attributes to reflect the current layout function updateLatestPostsTracking(layout) { let layoutString = ''; let cardLinkSelector = ( isMainSite ? 'netsposts-posttitle-link' : 'single-click' ); // make layout string compliant with tracking requirements switch (layout) { case 'grid-view': layoutString = 'grid'; break; case 'single-column': layoutString = 'column'; break; } // update data attributes on all cards wrappers.forEach(wrapper => { // get current collection of cards in case new cards have been added let cards = wrapper.getElementsByClassName(cardLinkSelector); Array.from(cards).forEach(card => { if (isMainSite) { card.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_card'); } else { card.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_card_singleclick'); } }) }); if (paginate) { // update data attributes on pagination if (isMainSite) { paginate.setAttribute('data-bi-id', 'landing_page_latest_posts_'+layoutString+'_load_more'); } else { paginate.setAttribute('data-bi-id', 'blog_home_page_latest_posts_'+layoutString+'_load_more'); } } } // Function to check screen size and apply the correct layout (but without removing single-column) function checkScreenSize() { // No need to remove single-column for smaller screens storedLayout = localStorage.getItem('layout'); wrappers.forEach(wrapper => { if (storedLayout === 'single-column') { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); } else { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); } }); // Update button active state based on stored layout if (storedLayout === 'single-column') { columnButton.classList.add('active'); gridButton.classList.remove('active'); } else { gridButton.classList.add('active'); columnButton.classList.remove('active'); } } // Run check on load and window resize checkScreenSize(); window.addEventListener('resize', checkScreenSize); // Set event listener for Grid View button gridButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('single-column'); wrapper.classList.add('grid-view'); }); // Update active button state gridButton.classList.add('active'); columnButton.classList.remove('active'); updateLayoutState('grid-view'); // Save grid-view in localStorage updateLatestPostsTracking('grid-view'); // update data bi attr }); // Set event listener for Column View button columnButton.addEventListener('click', function () { wrappers.forEach(wrapper => { wrapper.classList.remove('grid-view'); wrapper.classList.add('single-column'); }); // Update active button state columnButton.classList.add('active'); gridButton.classList.remove('active'); updateLayoutState('single-column'); // Save single-column in localStorage updateLatestPostsTracking('single-column'); // update data bi attr }); }); Nov 19, 2024 3 2 Getting the most out of Azure DevOps and GitHub Aaron Hallberg Microsoft has two very successful DevSecOps products in the market – GitHub and Azure DevOps. Azure DevOps has a large enterprise customer base that loves the highly customizable enterprise-focused planning and tracking capabilities in Azure Boards, the robust continuous delivery capabilities in Azure Pipelines, the manual and exploratory testing capabilities in Azure Test Plans, and the deep integrations across the suite. GitHub is the world’s largest developer community, with over 100M developers. It also serves over 4M organizations, including 90% of the Fortune 100. It’s beloved by developers and at the foref... Nov 18, 2024 3 8 Software is a team sport: Building the future of software development together Amanda,Mario At Microsoft, we strive to build the world’s most beloved developer tools and services. Our vision is to empower every developer to transform their concepts into reality, from idea to code to cloud, at lightning speed. The Visual Studio family, Azure, GitHub, and GitHub Copilot empower developers around the world to do just that. Since GitHub joined Microsoft in 2018, we’ve been working hard to bring our tools and services together to deliver a productive and delightful experience for developers so they can focus on driving innovation through their code. We started by integrating features and services develope... Nov 11, 2024 14 Welcome to the Microsoft for Developers blog Amanda Silver Did you know that developers use an average of 16 tools per day? A typical developer works across their code editor, a terminal, several command-line tools and web portals – not to mention all the SDKs and packages they take a dependency on in their code. Sometimes it can be challenging to figure out how to make it all work together. If you’re tasked with providing guidance and common infrastructure for other developers on your team, you may need to wrestle with many more tools and services. Whether you use the Visual Studio family of IDEs, GitHub, Azure DevOps or build apps for Azure, Windows, M365, Teams or ... Load more posts .toggleWrapper:last-child { border: none; } .toggleButton { cursor: pointer; border-radius: 4px; } Popular topics Microsoft for DevelopersAnnouncement Relevant LinksMicrosoft for Developers Visual Studio Visual Studio Code DotNet Azure GitHub Microsoft Learn Archive November 2024 Follow this blog Stay informed Get notified when new posts are published. Subscribe By subscribing you agree to our Terms of Use and Privacy document.addEventListener('DOMContentLoaded', function () { let currentPage = 1; // Reference the "Load More" button const loadMoreButton = document.getElementById('pload-more'); const loaderOverlay = document.getElementById('loader-overlay'); const masonryContainer = document.querySelector('.masonry-container'); // Check the initial post count const initialPosts = masonryContainer.querySelectorAll('.masonry-card'); // Adjust selector if needed if (initialPosts.length < 8) { loadMoreButton.style.display = 'none'; // Hide "Load More" button if 9 or fewer posts } // Add a click event listener for the "Load More" button loadMoreButton.addEventListener('click', function () { currentPage++; // Increment page number const currentBlogId = loadMoreButton.getAttribute('data-siteid'); loadMoreButton.style.display = 'none'; // Hide "Load More Posts" text // Prepare data to send in the POST request const data = new FormData(); data.append('action', 'evo_pagination_load_more'); data.append('site_id', currentBlogId); data.append('paged', currentPage); // Show the preloader loaderOverlay.style.display = 'block'; // Perform the AJAX request using fetch API fetch(devblogs_ajax_evo.ajaxurl, { method: 'POST', body: data }) .then(response => response.json()) .then(res => { // Append new items to the masonry container const tempDiv = document.createElement('div'); tempDiv.innerHTML = res.html; const newItems = tempDiv.children; Array.from(newItems).forEach(item => { item.classList.add('hidden'); // Add the 'hidden' class initially masonryContainer.appendChild(item); // Use CSS transition after appending the item setTimeout(() => { item.classList.remove('hidden'); // Trigger the CSS transition }, 100); }); // Show the masonry container after the items are added masonryContainer.style.opacity = 1; // Show the "Load More Posts" button again only if there are more pages if (currentPage < res.max) { loadMoreButton.style.display = 'block'; // Show "Load More Posts" text } // Hide the preloader after 500ms setTimeout(() => { loaderOverlay.style.display = 'none'; }, 500); }) .catch(error => { console.error('Error:', error); // Show the "Load More Posts" button if an error occurs loadMoreButton.style.display = 'block'; // Hide the preloader loaderOverlay.style.display = 'none'; }); }); });'''
