["https://developer.microsoft.com/en-us/identity"]
title = "Identity and access for a connected world | Microsoft Developer"
description = "Integrate robust identity management with the Microsoft identity platform. Enhance security, boost user trust, and streamline onboarding—all while saving development time."
full_description = '''Cutting-edge identity management for your applications Boost user trust, enhance security, and streamline onboarding with the Microsoft identity platform—all while saving development time. Explore docs Watch overview Browse by use case Identity management for employees and partners Protect access to your organization's resources and data using strong authentication and real-time, risk-based adaptive access policies with Microsoft Entra ID. Explore and learn Customer identity and access management Customize and control how your customers sign up, sign in, and manage their profiles when using your applications with Microsoft Entra External ID. Explore and learn Identity management for applications and services Manage identities for apps and services and secure their access to resources using Microsoft Entra Workload ID. Explore and learn User-generated, decentralized digital credentials Issue and accept verifiable credentials using Microsoft Entra Verified ID. Explore and learn Explore the Microsoft identity platform and identity fundamentals Explore The Microsoft identity platform is a comprehensive framework that enables you to integrate authentication and authorization services into your applications. Visit docs overview Learn Learn fundamental concepts and terminology to help you understand identity and access management (IAM) and get you building in no time. Learn identity fundamentals Develop The Microsoft Authentication Library (MSAL) is a versatile, cross-platform library that streamlines the integration of authentication with your applications and enhances application security and user experience. Get started with MSAL Identity for a connected world, in a single toolkit Identity and Microsoft Graph Connect to Microsoft Graph and build apps, services, or workflows for Microsoft 365 organizations and consumers. Build on a platform that gives you access to powerful data and functionality through a single endpoint. Streamline new user onboarding, assign managers, grant permissions to documents, add users to roles, and more. Get startedRead docs Identity and Microsoft 365 Build apps that are secure by default using Microsoft Entra ID for identity and authentication. Extend popular Microsoft 365 apps like Outlook, Teams, and SharePoint, integrating custom workflows and services. Leverage rich SDKs and APIs, ensuring seamless integration with Microsoft 365 services for your applications. Get startedRead docs Identity and Azure Build, deploy, scale, and manage high-performance applications securely, with Microsoft Azure. Integrate seamlessly using familiar development environments like Visual Studio and GitHub with a vast range of operating systems, languages, frameworks, and databases supported. Use Azure's advanced DevOps tools to streamline and accelerate delivery. And harness Azure's AI and machine learning tools to embed intelligent algorithms into your applications. Get startedRead docs Identity and Power Platform Create and scale custom apps rapidly with minimal coding using Power Platform's low-code capabilities. Automate workflows and processes across applications and services while taking advantage of Microsoft's robust security architecture and identity and access management features. Get startedRead docs Videos Microsoft identity platform basics Authentication fundamentals Developer training series Microsoft identity platform videos Learn about the basics of modern authentication, key components of the Microsoft identity platform, and how to get started adding modern, secure authentication to your apps. Explore more Read our latest blog posts For updates and best practices on identity management, visit our blog. James Casey February 06, 2025 February 2025: A look at the latest Microsoft Entra key feature releases, announcements, and updates This is the February 2025 edition of our monthly developer update, summarizing the latest news and developments in Microsoft Entra. This month, we bring you feature updates, public previews, announcements, and other important updates. Read on to learn more and make the most of Microsoft Entra. What went Generally Available (GA) since January 2025? Microsoft […] The post February 2025: A look at the latest Microsoft Entra key feature releases, announcements, and updates appeared first on Microsoft Entra Identity Platform. James Casey January 20, 2025 January 2025: A look at the latest Microsoft Entra key feature releases, announcements, and updates Welcome to the January 2025 edition of our monthly developer update, summarizing the latest news and developments in Microsoft Entra. This month, we bring you feature updates, public previews, announcements, and other important updates. Read on to learn more and make the most of Microsoft Entra. What went Generally Available (GA) since December 2024? Microsoft […] The post January 2025: A look at the latest Microsoft Entra key feature releases, announcements, and updates appeared first on Microsoft Entra Identity Platform. Bora Ozbayburtlu January 10, 2025 Announcing the Public Preview of Apple Identity Provider Support for Microsoft Entra External ID Announcing the public preview of "Sign in with Apple" support for Microsoft Entra External ID. This feature allows users to sign up and sign in to applications using their Apple ID. Apple joins Google and Facebook as pre-configured social identity providers, supporting Single Sign-On (SSO) through the OAuth framework. The post Announcing the Public Preview of Apple Identity Provider Support for Microsoft Entra External ID appeared first on Microsoft Entra Identity Platform. Read more blog posts Join our community Stack Overflow Learn, share your knowledge, and collaborate with other developers. Ask a question Microsoft Q&A Get answers to your identity app development questions directly from our expert community. Ask a question Support Explore our support and help options for developers. Get support Follow us on the web'''
