["https://developer.microsoft.com/en-us/azure"]
title = "Azure Developer | Microsoft Developer"
description = "Explore our Azure developer hub, offering a wealth of resources and tools tailored specifically for developers. Discover how Azure can help you achieve more."
full_description = "Azure Developer Hub Make your cloud-based apps stronger, take them farther, and do it all faster with Azure. Download the latest updates and best-in-class tools. Find the perfect code sample to jump-start your next project. Level up your cloud platform skills with free tutorials, videos, and training modules. Get started with Azure Menu News + updates Featured solutions Languages Tools + extensions Azure developer community Additional resources News + Updates What's new for Azure developers Skip carousel Previous slide Next slide Microsoft Copilot for Azure (preview) Get more info Latest Azure product updates View updates feed Azure services community livestreams Watch now Awesome azd templates Explore templates Azure Integration Services Watch now Back to carousel navigation controls featured solutions Get started with these Azure solutions and tutorials Select an area AI New to Azure App development Security + monitoring Data + analytics Microsoft AI Tour: Cloud Skills Challenge Develop your AI skills and unlock the power of AI by completing the series of Cloud Skills Challenges. Go to challenge Azure AI reference templates Learn how to develop applications that use Azure OpenAI Service and other Azure AI Services using .NET, Python, JavaScript, Java, or Go. View reference templates Simple Chat Application using Azure OpenAI A sample chat app that uses Python and the Quart framework to stream chat completions from the OpenAI SDK. Deployable to Azure Container Apps. Go to sample AI Shopping Cart App Template AI Shopping Cart Sample Application with Azure OpenAI and Azure Spring Apps Go to sample Microsoft Azure Fundamentals This course will provide foundational level knowledge on cloud concepts; core Azure services; and Azure management and governance features and tools. Go to course Build great solutions with the Microsoft Azure Well-Architected Framework You want to build great things on Azure, but you're not sure exactly what that means. Using key principles throughout your architecture, regardless of technology choice, can help you design, build, and continuously improve your architecture. View learning path Microsoft Azure Fundamentals: Describe cloud concepts Learn about cloud computing and the different cloud service types with use cases and benefits aligned with each service type. Go to learning path Microsoft Azure Fundamentals: Describe Azure architecture and services Learn about core architectural components, compute and networking, storage, and authentication within Azure. Go to learning path Choose the right DevOps tool This module explores Azure DevOps and GitHub tools and helps organizations define their work management tool and licensing strategy. Go to module Contoso Real Estate: JavaScript + Enterprise This repository contains the reference architecture and components for building enterprise-grade modern composable frontends (or micro-frontends) and cloud-native applications. View code sample Deploy cloud-native apps using Azure Container Apps Learn how to build, deploy, scale, and manage containerized cloud-native apps using Azure Container Apps, Azure Container Registry, and Azure Pipelines. Go to learning path Automate your workflow with GitHub Actions Learn how GitHub Actions enables you to automate your software development cycle and deploy applications to Azure. Go to learning path Microsoft Azure Fundamentals: Describe Azure management and governance This learning path introduces you to tools to help with governance, compliance, and monitoring within Azure. Go to learning path Implement secure Azure solutions Learn how to more securely deploy apps in Azure by using Azure Key Vault, managed identities, and Azure App Configuration. View learning path Secure your cloud applications in Azure Learn how to secure your Azure apps and associated data with encryption, certificates, and policy. Go to learning path Implement security and validate code bases for compliance This learning path explores an infrastructure and configuration strategy and appropriate toolset for a release pipeline and application infrastructure. It explains compliance and security implementation in your application infrastructure. Go to learning path Microsoft Azure Data Fundamentals: Explore core data concepts Data is the foundation on which all software is built. By learning about common data formats, workloads, roles, and services, you can prepare yourself for a career as a data professional Go to learning path ChatGPT + Enterprise data This sample demonstrates a few approaches for creating ChatGPT-like experiences over your own data using the Retrieval Augmented Generation pattern. View code sample Microsoft Azure Data Fundamentals: Explore data analytics in Azure Microsoft Azure provides multiple services that you can combine to build large-scale analytics solutions that leverage the latest technologies and techniques for data ingestion, storage, modeling, and visualization. Go to learning path Get started with data engineering on Azure An Azure data engineer also helps ensure that data pipelines and data stores are high-performing, efficient, organized, and reliable, given a specific set of business requirements and constraints. Go to learning path languages Supported languages and frameworks .NET Java Python JavaScript TypeScript C++ Tools + Extensions Extend and enhance your Azure developer experience Azure AI Build intelligent apps at enterprise scale with the Azure AI portfolio. Learn more CLI Connect to Azure and run administrative commands on Azure resources through a command-line interface. Azure Developer CLI Azure CLI Services + SDKs Build and manage powerful applications using Microsoft Azure services and software development kits. Download Azure SDKs Browse Azure products Visual Studio Develop, debug, deploy, manage, and diagnose cloud-scale Azure applications with a full-featured IDE. Develop for Azure with Visual Studio Buy a Visual Studio subscription Visual Studio Code Edit and debug code quickly with a lightweight code editor that runs on Windows, Linux, and macOS. Try VS Code in your browser Get Azure extensions for VS Code GitHub Take advantage of the seamless integration between Azure products and GitHub services to deliver your software more quickly and securely. Explore GitHub Actions for Azure Use Azure with GitHub Power Platform Achieve your business goals, whether it's creating analytics, process automation, or data-driven productivity applications using low-code tooling. Discover low-code tooling Show all products Check out the Microsoft Azure Developers channel Dive in to hundreds of videos and livestreams created exclusively for Azure developers. Topics include Azure functions, container apps, SDKs, logic apps, and more. New content uploaded weekly. Watch on YouTube Azure developer community Stay updated, get inspired, and connect with other developers building with Azure Explore more Azure Developer Community livestreams Check out our weekly livestreams from our Azure products and services. Hear about the latest product updates, get your questions answered live from the product owners and developers, and see demos of best practices! Get the latest updates News + updates Follow us for the latest dev info, tips, research... We're your developer source for all things Azure! Find us on X Subscribe to see the most recent blog posts and announcements across all of Azure. Microsoft Azure Blog Join this group for anyone who uses Microsoft Azure: developers, cloud engineers, whatever you do! LinkedIn Skip carousel Previous slide Next slide Azure Friday Join Scott Hanselman as he hosts the engineers who build & use Azure, demo it, answer questions, and share insights. Watch now Getting Started on Azure Demo Series View expert-led demos to quickly learn how to get started and accomplish your goals with Azure services. Watch now .NET on Azure Discover the latest services and features in Azure designed specifically for .NET developers. Watch now Python on Azure Discover the latest services and features in Azure designed specifically for Python developers. Watch now JavaScript on Azure Discover the latest services and features in Azure designed specifically for JavaScript developers. Watch now Back to carousel navigation controls Keep on learning Documentation Learn how to build and manage powerful applications using Microsoft Azure cloud services. Browse documentation Code samples Explore code samples for Azure products and discover what you can build with Microsoft developer tools and technologies. Browse code samples Tutorials + training Grow your skills to build and manage Azure applications in the cloud, on-premises, and at the edge. Browse learning paths Certifications Stand out in your field, learn new skills, and become eligible for 50% off a Microsoft Certification exam - all in 30 days. Get details"
