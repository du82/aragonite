title = "Java Development at Microsoft | Code, Deploy, Scale"
description = "Through the power of open source, Azure, and GitHub, Microsoft empowers Java developers to build and deploy your Java app, app server, or framework faster."
full_description = '''window.stringResources = {}; Java Application Containerization and Deployment Use this DZone refcard to get started with packaging, shipping, and delivering Java to production. Get started Developer Java at Microsoft The Modern Web App (MWA) Pattern for Java Designed for the Spring Framework, Azure and beyond Modernize Java applications with a scalable cloud-native architecture on Azure. Learn more Java at Microsoft Code, deploy, and scale Java your way Microsoft supports your workload with abundant choices, whether you're working on a Java app, app server, or framework. Get started Microsoft JDConf 2025 Microsoft JDConf is an opportunity for the Java community to connect with Microsoft, partners, and other luminaries for an exceptional two-day virtual experience. Microsoft JDConf draws thousands of live viewers worldwide while fostering a network of local community events. Check out the latest JDConf 2025 News! Upcoming Java developer events DevNexus 2025 Mar 4-6, 2025, Atlanta, GA Java Ecosystem Join Microsoft at Devnexus 2025, the largest Java conference in the US brings in 2000+ attendees for an experience spanning three days. Engage with Java experts, attend hands-on trainings, and explore Java ecosystem innovations. Don't miss this opportunity to learn and network in Atlanta, Georgia! Register now JavaOne 2025 Mar 18-20, 2025, Redwood Shores, CA Java programming language and platform Java turns 30 this year and, to mark the occasion, JavaOne 2025 brings the industry's best developer conference back to California, down the road from where it all began. Join us for this three-day event featuring Java leaders from around the globe, an in-person Java 24 launch celebration, and more! Register now Red Hat Summit May 19-22, 2025, Boston, MA Build a better foundation for the future of IT Join interactive sessions covering automation, edge computing, security, artificial intelligence and machine learning, the developer experience, and more! Connec