title = "Microsoft Power Platform - Accelerate development with AI-powered, low code tools | Microsoft Developer"
description = "Simplify integration with a unified, low-code platform for building, managing, and integrating applications and data across Microsoft and third-party apps and services."
full_description = "Build smarter and faster with Power Platform Read docs Create a dev environment Menu Overview Products + extensions Featured solutions Resources News + announcements Community Extend, integrate, and innovate with the most adaptable developer platform Supercharge business processes with agents Change what you build: With Copilot as the new UI for AI, build powerful agents to streamline business processes. Enhance productivity with AI Change how you build: Unlock faster development using natural language, images, and documents to develop applications, automations, and more. Streamline governance and security Ensure your business applications are secure, scalable with centralized management in the Admin Center. February 12 - 28, 2025 Join us for a one-day virtual conference + 2-week hack together, an event for developers to maximize the Power Platform's potential for enterprise app development. Learn how to build smarter and faster with less effort. Register today Products + Extensions Explore innovative, AI-powered developer tools Power Platform Create and deploy more applications in less time with Power Platform. Microsoft Copilot Studio Build your own copilots and embrace the future of conversational AI. Get started with Copilot Studio Power Apps Build and deliver intelligent apps for your users. Get started with Power Apps Power Automate Revolutionize the way you work with automation and AI. Get started with Power Automate Power Pages Transform user experiences and business objectives with Copilot-built websites. Get started with Power Pages Dataverse Create enterprise applications and drive efficiency with data and AI. Get started with Dataverse CLI Run administrative commands and perform various operations through this simple, one-stop developer CLI. Get started with CLI featured solutions Create modern, full-stack solutions faster, easier, and more securely With Power Platform and AI, developers can create custom connectors, code efficiently, and build sophisticated solutions using a comprehensive set of integrated tools. This enhances productivity, drives innovation, and ensures enterprise-grade security. Build on top of Azure Power Platform builds on Azure's security stack, offering robust data protection, encryption, governance, and compliance features. With Power Platform, you can create intelligent reports from Azure data sources, automate processes with RPA, and build conversational AI solutions. Learn more Accelerate development with Copilot Create Power Platform solutions with Copilot to speed up development and add AI functionality to make your solutions more intelligent with agents and generative AI. Learn more Automate with GitHub With GitHub Actions for Microsoft Power Platform, you can create workflows in your repository to build, test, package, release, and deploy apps; perform automation; and manage bots and other components built on Microsoft Power Platform. Get started Integrate with Microsoft 365 Integrating Power Platform with Microsoft 365 enables developers to create unified workspaces using AI agents, build connected apps with Power Apps, automate approvals, and enhance security. Learn more Connect with Visual Studio By integrating Power Platform as a connected service in Visual Studio, developers can create custom connectors for web APIs, configure dev tunnels for real-time testing, and create Power Apps to simplify development. Get started Develop with Visual Studio Code The Power Platform Visual Studio Code extension makes it easy to manage Power Platform environments and allows you to create, build and deploy Power Platform solutions, packages and portals. Get started resources Begin your journey Select an area Build Extend Integrate Skip carousel Previous slide Next slide Developers documentation Explore all the developer documentation to get started. Explore docs Code samples Explore code samples and sample prompts for the Power Platform to discover what you can build with low code. Explore code samples Tutorial + training Grow your skills to build Power Platform solutions. Browse learning paths Applied skills Complete these scenario-based credentials to improve your proficiency specific to critical business problems. Complete a skill. Browse credentials Power Platform well architected Get useful insights and suggestions in the lifecycle of a modern application workload built with Microsoft Power Platform. Learn more Back to carousel navigation controls Skip carousel Previous slide Next slide Extend the UI of your apps Create code components for model-driven and canvas apps to enhance the user experience. Get started Add AI to your solutions with AI Builder Create and use prebuilt or custom AI models to automate and optimize business processes and gain insights from your data. Learn how Extend your solutions with Azure Explore solutions and architectures that use Power Platform together with Azure services. Learn how Back to carousel navigation controls Skip carousel Previous slide Next slide Integrate your services with connectors Connect apps, data and devices in the cloud with a variety of prebuilt connectors or use custom connectors for tailored scenarios. Learn more Create custom, GPT-powered prompts Prompt builder allows you to build, test and save custom prompts that generate text for tasks and goals. Get started Uplevel your skills with self-guided workshops Take these workshops to uplevel your skills on a variety of Power Platform technologies. Explore workshops Back to carousel navigation controls Check out our Power Platform YouTube channel Get the latest updates about Power Platform with our videos and demos to learn how to accelerate productivity and customize solutions to help you with your development. Subscribe and watch News + announcements What's new for Power Platform developers Read all blogs Daniel Laskewitz • February 11, 2025 Bells and whistles: Building with Microsoft Copilot Studio Read blog Grant Archibald • February 06, 2025 Mastering automated testing in Power Platform: Evergreen concepts for robust solutions Read blog Daniel Laskewitz • February 03, 2025 Announcing the ‘Simplify Microsoft Power Platform Deployments by Using Pipelines’ Learning Path Read blog April Dunnam • January 14, 2025 Announcing Powerful Devs Conference + Hack Together 2025 Read blog Power Platform Community Stay current, get inspired, and connect with others to build with Power Platform Join our vibrant community to learn about the latest product updates, watch live demos from our community and product teams, and get your questions answered! Join our community Participate in our community calls Skip carousel Previous slide Next slide Low Code Revolution The Low Code Revolution, hosted by the Power Platform Advocacy team, explores the intersection of low code and code first development. Watch now Microsoft Copilot Studio Learning Series Learn how to build with the latest capabilities of Copilot Studio in these live demos . Watch now AI in Action Explore the latest innovations with AI in the Power Platform with this video series from the Power Platform Advocacy team. Watch now Back to carousel navigation controls Follow us on the web"
