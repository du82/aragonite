 Graph. Explore Azure Communication Services Explore the Microsoft Graph API Build your Teams app with these quick starts Get started building apps with Teams Toolkit Get started Build an AI-powered Teams bot Get started Build a Teams message extension app Get started Build a Teams tab app Get started Resources to help you get started Microsoft 365 Developer Program Get resources and information to help you build solutions for the Microsoft 365 platform, including recommendations tailored to your areas of interest. You might also qualify for a free, renewable developer subscription that's configured with sample data. Join now Read the FAQ Your learning journey starts here Build apps for Microsoft Teams with Teams Toolkit. Start learning path Explore more resources Try code samples Watch demos and videos Get inspiration with best practices Learn from others Don't reinvent the wheel. Share with others and contribute your knowledge about building apps for Teams. Join our community Get the latest Teams news Unified manifest support for Word, Excel, and PowerPoint is available for preview Read blog post Teams Toolkit for Visual Studio Code update – January 2025 Read blog post Preview the GitHub Copilot extension for Teams Toolkit Read blog post Boost your Microsoft 365 app performance: Introducing tree shaking in TeamsJS Read blog post View more Follow us Share this page document.addEventListener('DOMContentLoaded', function () { const shareButtons = document.querySelectorAll('.social-media-share'); shareButtons.forEach(button => { button.addEventListener('click', e => { if (!(typeof mscc === "undefined")) { if (mscc.hasConsent()) { var shareUrl = (window.location.pathname.toLowerCase().indexOf("/events") > 0 || window.location.pathname.toLowerCase().indexOf("/gallery") > 0) ? encodeURI("https://developer.microsoft.com" + window.location.pathname + window.location.search) : encodeURI("https://developer.microsoft.com" + window.location.pathname); window.open(e.currentTarg