full_description = "ISV AI Envisioning Days Training Learn about industry gen AI use cases and envisioning frameworks for app development. Register now Microsoft for Developers Any platform. Any language. Our tools. GitHub Copilot Free Start using GitHub Copilot for free in Visual Studio Code. Learn more Azure AI Foundry Your platform for developing, testing, and deploying generative AI apps responsibly. Build now .NET Aspire Easily build cloud-native apps with intuitive orchestration tools, comprehensive observability, and versatile deployment. Learn more February 12 – 28, 2025 Powerful Devs Conference + Hack Together Join us for a one-day virtual conference + 2-week hack together, an event for developers to maximize the Power Platform's potential for enterprise app development. Register today Start building with these Microsoft products Microsoft 365 Create engaging experiences and bring users into your app as they work day-to-day in Microsoft 365. Microsoft Azure Turn your ideas into solutions with cloud services. Build how you want and deploy where you want. Microsoft Teams Build intelligent, collaborative apps that engage users in their flow of work with Teams. Power Platform Accelerate innovation and turn your ideas into powerful solutions with Power Platform. Visual Studio Best-in-class tools for any developer. Use your favorite language to deliver apps and services on any platform. Windows Develop for Windows. Build experiences that reach users everywhere. Build Intelligent Apps! Join our hands-on meetup series to collaborate, learn, and build scalable AI-powered solutions based on real-world use cases with fellow developers. Register today Other ways to get your project started Cloud development Develop cloud applications for Microsoft Azure. Azure Developer CLI Accelerate provisioning and deploying app resources on Azure. Game development Create bold, immersive game experiences that attract and engage players. Microsoft Graph Use the data and intelligence in Microsoft 365 to build apps that reach millions of users. Learn Find training and certifications and discover resources that will assist you on your learning journey. Whether you are just starting or you are an experienced professional, our hands-on approach helps you arrive at your goals faster, with more confidence and at your own pace. Learning paths Learn .NET Learn AI Learn Azure Learn Power Platform Learn shows Developer YouTube channel Tools Use the right tools and platforms for building many types of applications. .NET GitHub Visual Studio Visual Studio Code Resources Explore documentation, tutorials, sample code, developer guides, and get answers to your technical questions. Code samples Documentation Microsoft Q&A Microsoft.Source Newsletter Tech Community hub Share, connect, and get inspired Microsoft for Developers Blog Subscribe to our new blog for the latest in developer innovation and insights. Visit the blog Cloud advocates Engage and learn from Microsoft's Cloud advocates about Microsoft Cloud + AI platform. Connect Connect with community Discover and connect with others who build with Microsoft tools and services. Explore a community Events Join upcoming events and watch past events delivered by the technical community and Microsoft experts. Discover events Microsoft Reactor Microsoft Reactor connects you with the developers and startups that share your goals. Explore Reactor events Follow us on the web"
