title = "Python | Microsoft Developer"
description = """
ISV AI Envisioning Days Training                                        Learn about industry gen AI use cases and envisioning frameworks for app development."""
full_description = "ISV AI Envisioning Days Training Learn about industry gen AI use cases and envisioning frameworks for app development. Register now Microsoft for Python developers Learn. Code. Grow. Share. Python developers do more with Microsoft tools Visual Studio Code The lightweight, powerful and extensible editor, optimized for modern web and cloud applications. Learn more GitHub Copilot GitHub Copilot uses AI to suggest entire functions in real-time, right from your editor. Work smarter. Learn more Azure The cloud platform designed to help you bring new solutions to life. Learn more Python education Unparalleled products and support for educators and students. Teach moreLearn faster Windows Subsystem for Linux (WSL) Access the power of Windows and Linux at the same time on a Windows machine. Learn more Python on Windows Find the information and ideas you need to power your ingenuity. Learn more Data science Python in Excel Supercharge your data analysis and tell better stories with Python in Excel. Learn more Product Jupyter Notebooks VS Code Work with Jupyter Notebooks in your VS Code editor seamlessly with native support. Product Data Wrangler VS Code A code-centric data viewing and cleaning tool that is integrated into VS Code and VS Code Jupyter Notebooks. Product Azure Data Factory Simplify hybrid data integration at enterprise scale. Product Azure Data Science Virtual Machines End-to-End Data Science Workflow with rich pre-configured environment for training, education and enterprise solutions. Learn Data Science for Beginners Video Dive into practical data science skills in this Data Science for Beginners video series. Learn Azure Data Manager for Energy Data Lab Check out this GitHub repo with Data Science for engergy lab. Learn Predict meteor showers by using Python and Visual Studio Code Learn how to use concepts from machine learning to predict the occurrence of meteor showers (or Moon Goddess tears). Learn Introduction to Python for space exploration Get an introduction to the types of space exploration problems that Python and data science can influence. AI and machine learning Product VS Code AI Toolkit A VS Code extension that simplifies generative AI app development by bringing together cutting-edge AI development tools and models from Azure AI Foundry Catalog and other catalogs like Hugging Face. Product Azure ML for VS Code Don't leave your VS Code editor when managing Azure Machine Learning resources, training models, debuging ML experiments and schema-based language support. Product Semantic Kernel Semantic Kernel is a lightweight, open-source development kit that lets you easily build AI agents and integrate the latest AI models into your C#, Python, or Java codebase. Product GitHub Models Newly announced pre-trained generative AI models that can be used for a variety of tasks, such as text generation, embeddings, and chat available through GitHub. Learn Work with compute in Azure Machine Learning Learn how to work with compute targets and environments in the Azure Machine Learning workspace. Learn Build an AI web app using Python and Flask Use Python, Flask, and Azure AI services to build a web app that incorporates AI. Learn Introduction to Machine Learning A high-level overview of machine learning for people with little or no knowledge of computer science and statistics. Learn Designing and implementing a Microsoft Azure AI solution Intended for software developers wanting to build AI infused applications that leverage Azure AI Services, Azure AI Search, and Azure OpenAI. Python developer Azure Developers Python Day Build on the trusted Azure platform. Watch the event replay. Watch on-demand Product CosmosDB Cosmos DB code gallery is your best source for patterns and content for Azure Cosmos DB. Product Python Azure Get started with Python development running in the cloud with your Azure account using 12 months of free services. Product VS Code for Python See how you can optimize your Python developer experience in VS Code with advanced IntelliSense, linting, debugging, unit testing and environment settings. Product Playwright See how Playwright's cross-browser, cross-platform open source framework enables reliable end-to-end testing for modern Python web apps. Learn Python Web Development on Windows A step-by-step guide to get you started using Python for web development on Windows, using the Windows Subsystem for Linux (WSL). Learn Using GitHub Copilot with Python GitHub Copilot is an AI pair programmer that offers autocomplete-style suggestions as you code in Python. Learn Host a web application with Azure App Service Azure App Service enables you to build and host web applications in the programming language of your choice without managing infrastructure. Learn Designing and implementing cloud- native applications using Microsoft Azure Cosmos DB Create a Python application using the NoSQL API and SDK for Azure Cosmos DB. Teach and learn Python Visual Studio Code for Education Learn to code with Visual Studio Code, the same tool used by industry professionals. Access free online courses, lessons and projects in Python. Learn more Product MakeCode Learn by doing in the block-based MakeCode Arcade environment with Python! Product Educator Center Dive deep into learning with interactive lessons, earn professional development hours, acquire certifications and find programs that help meet your goals. Product Student Hub Learn how to get more done by engaging in interactive projects, self paced training, communities, and more. Product Teach computing skills with Visual Studio Code for Education A free online computer science education platform that provides integrated curriculum and a sandbox coding environment for everyone. Learn Python for Beginners Over the course of a set of videos we're going to show you the ropes of Python development. Learn Build Real World Applications with Python Interested in learning to build apps in Python, that you can maintain? You will learn language syntax but also patterns for how to structure your app. Learn Introduction to Python Learn how to write a few lines of Python code, declare variables, and work with console input and output. Learn Python Functions The next step after using procedural code is to write modular software by using functions. Functions, from simple ones to multiple-argument ones, are useful in making code reusable. Supercharge your developer toolkit Azure Python SDK A collection of libraries built to make it easier to use Azure services. Learn more Awesome AZD An awesome list that curates content and templates for the Azure Developer CLI. Learn more Dev Containers A full-featured development environment with a well-defined tool and runtime stack. Learn more Azure OpenAI Service Build your own copilot and generative AI applications. Learn more Python blogs and articles Insights, tips, and news for Python by Microsoft experts and MVPs. jikang • December 11th 2024 Python in Visual Studio Code - December 2024 Release We're excited to announce the December 2024 release of the Python, Pylance and Jupyter extensions for Visual Studio Code! This release includes the following announcements: Docstring generation features using Pylance and Copilot, Python Environments extension in preview, and Pylance 'full' language server mode. Courtney, Eleanor • December 9th 2024 2024 Python in VS Code Wrapped As the year comes to a close, we would like to take time to reflect and celebrate the incredible progress the Python extension for VS Code has made in the past year. Microsoft Excel • September 16th 2024 Python in Excel Python in Excel is now generally available for Windows users of Microsoft 365 Business and Enterprise. Last August, in partnership with Anaconda, we introduced an exciting new addition to Excel by integrating Python, making it possible to seamlessly combine Python and Excel analytics within the same workbook, no setup required. Since then, we've brought the power of popular Python analytics libraries such as pandas, Matplotlib, and NLTK to countless Excel users. Varun Dhawan • October 6th 2024 PostgreSQL 17 Preview on Azure Postgres Flexible Server We recently announced the preview of PostgreSQL 17 on Azure Database for PostgreSQL - Flexible Server!This release brings exciting new features like improved query performance, dynamic logical replication, enhanced JSON functions, and more—all backed by Azure's reliable managed services. Chris Noring • October 4th 2024 What is Microsoft Entra (and why use it)? Microsoft Entra is a family of identity and network access products designed to implement a Zero Trust security strategy. It is part of the Microsoft Security portfolio which also includes Microsoft Defender for cyberthreat protection and cloud security, Microsoft Sentinel for security information and event management (SIEM), Microsoft Purview for compliance, Microsoft Priva for privacy and Microsoft Intune for endpoint management. Cloud Skills Challenges Learn. Compete. Develop skills with this self-paced technical upskilling challenge. December 15, 2023 - April 15, 2024 Python Data Science Cloud Skills Challenge Learn more Follow us on the web"
