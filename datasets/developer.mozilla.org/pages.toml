title = "Learn web development | MDN"
description = "Welcome to MDN Learning Web Development (also known as Learn). This resource provides a structured set of tutorials teaching the essential skills and practices for being a successful front-end developer, along with challenges and further recommended resources."
full_description = '''Learn web developmentThe essential skillset for new front-end developersWelcome to MDN Learning Web Development (also known as Learn). This resource provides a structured set of tutorials teaching the essential skills and practices for being a successful front-end developer, along with challenges and further recommended resources.About Learn web development Defines the essential skills and knowledge every front-end developer needs for career success and industry relevance. Created by the MDN community and refined with insights from students, educators, and developers from the broader web community. Designed to take you from "beginner" to "comfortable" (not "beginner" to "expert"), giving you enough knowledge to use more advanced resources (such as the rest of MDN). Note: Last updated: December 2024 (see changelog). Don't know where to get started? Never coded before? Our Getting started modules provide setup tutorials and essential concepts and background information for complete beginners. You should start here if you are a complete beginner (i.e. you've not installed a code editor or written any code yet). Want to master the essentials? Our Core modules provide a structured set of tutorials teaching the essential skills and practices for being a successful front-end developer. Beyond the basics? Our Extension modules cover useful additional skills to learn as you start to expand your knowledge and develop specialisms. Go onto these after you finish our Core. Working at a school? Use our modules to guide your teaching, check out our Educators page for more ideas, or enroll your students in Scrimba's Frontend Developer Career PathMDN learning partner. Getting our code examplesThe code examples you'll encounter in the Learning Area are all available on GitHub: The easiest way to get them is to download a ZIP of the latest main code branch. If you are familiar with Git and GitHub, you could also choose to clone the repository. Contact usIf you want to get in touch with us about anything, use the communication channels. We'd love to hear from you about anything you think is wrong or missing on the site, requests for new learning topics, requests for help with items you don't understand, or any other questions or concerns. If you're interested in helping develop/improve the content, take a look at how you can help and get in touch! We are more than happy to talk to you, whether you are a learner, teacher, experienced web developer, or someone else interested in helping to improve the learning experience.See also Codecademy A great interactive site for learning programming languages from scratch. freeCodeCamp.org Interactive site with tutorials and projects to learn web development. Learn JavaScript An excellent resource for aspiring web developers — Learn JavaScript in an interactive environment, with short lessons and interactive tests, guided by automated assessment. The first 40 lessons are free, and the complete course is available for a small one-time payment. The Frontend Developer Career Path MDN learning partner Scrimba's Frontend Developer Career Path teaches all you need to know to be a competent front-end web developer, with fun interactive lessons and challenges, knowledgeable teachers, and a supportive community. Go from zero to landing your first front-end job! Many of the course components are available as standalone free versions.'''
