["https://developer.mozilla.org/en-US/docs/MDN/Community/Issues"]
title = "Creating and working on issues - MDN Web Docs | MDN"
description = """
As a contributor, you can report and work on issues.
After you report an issue, the issue gets triaged. Issue triaging is typically done by people assigned the role of a maintainer or an owner."""
full_description = '''Creating and working on issuesAs a contributor, you can report and work on issues. After you report an issue, the issue gets triaged. Issue triaging is typically done by people assigned the role of a maintainer or an owner.General guidelines for participationWhile reporting an issue or participating in a conversation in an issue, always ensure that your inputs are contributing to the overall progress of the project. Consider whether the issues you open and your comments in an issue are constructive and on topic and are not just adding noise. Do the following: Before filing an issue, consider if you need to discuss it with the staff/community. Use discussions to gain different viewpoints and to converge on an agreed-upon course of action. This helps to keep issues focused and productive. After filing an issue, try to fix the problem yourself. Read our contribution guide to learn more. If you have a question, you can ask it in the MDN Web Docs chat rooms instead of filing an issue. Avoid doing the following: Complicating issues by trying to discuss multiple topics or by making off-topic comments. Opening lots of issues asking vague questions. Asking questions without trying to solve the problem yourself first. Guidelines for reporting an issueIssues are used to track bugs. An issue must be a single actionable task or a collection of related actionable tasks and must have a clear outcome.Before filing an issueIf you think you've found a bug with the content on MDN Web Docs or with the look and feel of the website, search the current open issues in the relevant repository and make sure nobody else has reported the issue.Reporting an issue Depending on the type of problem you've discovered, report it by filing an issue on one of the followings: documentation translation the website's look and feel the "Try it" interactive example section DOM examples Learning area the browser compatibility information Choose the appropriate category to report the issue. For example, to report a content bug, use the Content issue template in the mdn/content repository. Provide sufficient information while reporting the issue: Issue title must convey succinctly the required action. Issue description must clearly describe the bug and the action required to resolve the issue. It must also list the task or sub-tasks to be completed to resolve the issue. Some other guidelines include: Use the description field to indicate the status of the task or sub-tasks by using checklists. Update the status of a task in the issue description instead of commenting on the issue. Use task lists in the description if an issue has multiple parts. This helps others who may otherwise need to scroll through comments on the issue to determine the status of various tasks. Comments in an issue should be limited to details or context that help resolve the issue. If the information you provide in the issue is incomplete, then you might be contacted later during the issue triaging process. If you find yourself in one of the following situations, move the conversation to MDN's discussion on GitHub: A discussion needs to take place to clarify an issue. A discussion begins after opening the issue. The issue has no clear consensus on its resolution. The requirements for completing the task expand while it's being resolved or the work is unclear. For minor and small bugs, you can make the changes yourself and submit a pull request. Creating a task list issueIf the issue you're opening is not to report a bug but to perform a series of tasks, you can create the issue as a task list. Explain the context or reason for performing the tasks in the description. Ensure that you list all the actionable tasks as a checklist. For example: markdown// Issue title Ensure sections follow the order defined in the CSS property template ### Description The CSS property page template is defined [here](/en-US/docs/MDN/Writing_guidelines/Page_structures/Page_types/CSS_property_page_template). The task list in this issue will be used to compare the documented CSS properties with the template and track changes to the property pages for compliance. ### List of pages checked - [x] [accent-color](/en-US/docs/Web/CSS/accent-color) - checked, okay - [ ] [backdrop-filter](/en-US/docs/Web/CSS/backdrop-filter) - [ ] [letter-spacing](/en-US/docs/Web/CSS/letter-spacing) - open pull request to move `Accessibility concerns` and `Internationalization concerns` sections before the `Specifications` section. Guidelines for working on an issueRemember that if you take on an issue, the expectation is for the work to be completed in a timely manner. If you're not able to make any progress for a week after being assigned or can no longer complete the required task, leave a comment and unassign yourself from the issue. These are the general steps for working on an issue: Find an issue: If you're looking to contribute, search for issues with good first issue, help wanted or p3 label. Most repositories have issues with these labels. You are welcome to browse and pick an issue that is suitable for your skill set. Another useful place to look for issues to work on is the MDN Contributors Task Board. This project view lists open issues from multiple repositories. You can filter the list based on the topics (Labels column) you're interested in. See the description of some of the labels that get applied during the issue triage process. Note: An issue with the needs triage label indicates that the MDN Web Docs core team has not reviewed the issue yet, and you shouldn't begin work on it. Assign the issue to yourself: After finding an issue you'd like to work on, make sure that the issue is not assigned to anybody else. Add a comment saying you would like to work on the issue, and if you are able to, assign the issue to yourself. Do the research: Most issues need some investigation before work can start. Scope out the work that needs to be done. If you need to ask questions, ask them in the MDN Web Docs chat rooms. If the issue is well-described, and the work is pretty obvious, go ahead and do it. If the issue is not well-described, and/or you are not sure what is needed, feel free to @mention the poster and ask for more information. Make the changes: Fork and branch the repository. Do your work and open a pull request in the repository. Reference the issue in the pull request description. Depending on the files you've updated in the pull request, a reviewer will be assigned to your pull request automatically. (Teams per topic area are defined in the CODEOWNERS file). After opening the pull request, if you find you no longer have the time to make changes or incorporate review feedback, let the team know as soon as possible in a comment in the pull request. This will help the team assign another interested contributor to complete the work on the pull request and close the linked issue. After your pull request has been reviewed and merged, you can mark the linked issue as closed. If you opened the pull request with Fixes #<issue> verbiage, the issue will be closed automatically when the pull request is merged. Fixing issues yourselfIf you spot a bug — whether it's a problem with the website's look and feel or an error in documentation — you can try to fix it yourself. Learn how you can contribute by going through our contribution guide. If the bug is small, such as a typo or a minor sentence improvement, or involves an uncontroversial fix, submit a pull request with the changes. For all other type of bugs, begin by opening the issue. Add a comment about your intent to work on the issue and if possible, describe your proposed solution or steps to fix the issue. Wait for the issue to be triaged, so that the MDN Web Docs team can verify that the issue is legit and approves your proposed solution. Note: If you open a pull request before the issue has been triaged, your time and effort might go waste if the linked issue is deemed invalid or the solution does not match the one expected by the MDN Web Docs team. After the issue is triaged, assign the issue to yourself. Using the guidelines on working on an issue, try to fix the problem by updating the appropriate source, such as: The MDN Web Docs content (in English) in the content repository The MDN Web Docs translated content in the translated-content repository The MDN Web Docs website look and feel in the yari repository Each repository includes useful information to guide you on how to contribute.Guidelines for triaging issuesIf you are a maintainer or an owner in the MDN Web Docs GitHub organization, you are responsible for triaging issues in one or more MDN Web Docs repository. The overall process for triaging includes some general and some issue-specific tasks.General triaging tasks When an issue is opened, the needs triage label is set on the issue automatically. You can search for this label to look for issues that need to be triaged. Contributors or anybody else should not work on the issue until the issue has been triaged. (Triagers should remember to remove the needs triage label after triaging the issue.) In the mdn/content repository, an additional Content: label, such as Content:CSS or Content:WebAPI, is set on the issue automatically. This gets set based on the MDN URL mentioned in the issue. You can use the content-specific label to look for issues to be triaged in your specific topic area. If an issue concerns an active, non-en-US locale, set the appropriate label, such as l10n-fr, l10n-zh, or l10n-ja. The teams for those locales will pick these issues up and triage them. You don't need to actively triage issues all the time. Set aside time, say 30 minutes every week, to triage issues on a regular basis in your area of responsibility. Triaging doesn't have to be done as part of a synchronous meeting or even at the same time as everyone else, but it should be done regularly to make sure that the backlog of untriaged bugs doesn't get too high. Apart from triaging incoming issues every week, review the list of old bugs to see if there are any that are stalled, need closing, or are no longer relevant. The idle label is automatically set on issues that have had no activity for 30 days. Check assigned issues that are still open to see if the assignee is making progress. If there is no progress after a week of being assigned, ask them if they still have time to work on the issue. If another week passes by without any progress, unassign them and leave a comment indicating that you're making the issue available for other interested contributors. If a pull request has been opened to fix the issue but has not been reviewed for a week, give the reviewer a gentle ping to ask if they can get to it. If a pull request to fix the issue is waiting on review comments to be addressed after a week, then ask the author if they can respond to their review. If another week goes by, either fix the review comments yourself if you have time, or close the pull request and unassign the related issue. Issue-specific triaging tasksThese are the guidelines to follow while triaging each issue. Review if the issue is valid These are some of the things to keep in mind while reviewing the validity of an issue: Check if the issue raised is valid and if the fix will improve the content for the readers and the website. Evaluate if the impact of the fix will be small or site-wide. Evaluate if the fix for the issue will need a discussion first, in which case, point the author to open a discussion instead. Check if the issue complies with our writing guidelines and templates. Check whether suggestions for adding links comply with our external links policy. Review the issue for completeness of information Review each issue against the following checklist to ensure that the issue contains the described information for someone to start working on the bug: URL of the MDN Web Docs page with the problem or URL of an example MDN Web Docs page if the problem exists on multiple pages The specific heading or section on the MDN Web Docs page where the problem was found A clear description of the incorrect, unhelpful, incomplete, or missing information If any of the above information is not present, then you should ask the author of the issue to provide these details, and add the needs info label to the issue. Resume triaging the issue only after those details have been provided (after which, you can remove the needs info label). It is okay to wait for up to a week to get a response from the author. Set a priority label For each bug, set a priority label based on the severity of the issue to help people who want to work on the most important issues or areas. Critical issue: This type of issue needs to be fixed as soon as possible, regardless of where it appears on the site. This type of issue could damage MDN's reputation severely and/or harm users. Examples of this issue include an incorrect code snippet, which if used in production, could create a severe security problem and undesirable content such as malware, profanity, pornography, hate speech, or links to such content. Label: p0 (will be addressed immediately) Major issue: This type of issue could severely affect a page's usefulness. For example, a significant amount of out-of-date information, a complex and important code example that doesn't work, a significant amount of prose that is badly written and hard to understand, or a large number of broken links. Labels: p1 (will be addressed soon) and p2 (will be addressed soon, but higher priority items will take precedence) Minor issue: This is a type of improvement issue that can make the existing content better but does not affect learning or only has a minor effect on learning. Since these types of issues are not actively planned for, help from contributors to fix these issues is welcome and much appreciated. Fixing some of these issues can also provide the necessary practice to beginner contributors who are starting to get familiar with the contribution process. Examples include typos, bad grammar, a broken link, a small amount of out-of-date information or badly-written prose, or a code snippet that doesn't work. Labels: p3 (no visibility when the issue will be addressed) In general, critical issues should be fixed immediately and are most likely handled by MDN Web Docs staff and peers. Add helpful information If possible, add information that can help contributors to fix the issue. The information can be in the form of steps, general approach, links to other similar fixed issues, or reading resources. A well-laid out plan or steps is especially required in issues that are labeled good first issue and can help ramp up new contributors quickly. You can time-box this task to 5-10 minutes. For example, as a triager, you can add the following information to the issue you are triaging: mdTo whoever fixes this issue, it looks like the following is needed: - Update the first paragraph below heading X to correct t'''
