full_description = "MDN Community Where web enthusiasts learn, collaborate, and create Start contributing Join MDN Discord 45K+ Total contributors 200+ Weekly commits 7 Language communities MDN's community powers the webMDN’s strength comes from the passion and dedication of our global community. Since our founding in 2005, we’ve grown into a thriving network. Together, we’ve created a comprehensive, open, and free resource that serves web developers across the globe. With volunteers leading translation efforts in 7 languages, we’re truly international.Meet our contributorsWe are an open-source community dedicated to building resources for a better web. Our diverse contributors, including developers, technical writers, students, educators, designers, and more, come from various backgrounds and platforms. Anyone can contribute, and each contribution strengthens our community, driving innovation and improving this vital resource for developers worldwide. Join us View all contributors Jason Lam, 林家祥 https://github.com/JasonLamv-t Grantit Nicolò Ribaudo https://github.com/nicolo-ribaudo Igalia Joshua Chen https://github.com/Josh-Cena Kimchanmin https://github.com/c17an SK Planet Gibbeum Yoon https://github.com/givvemee Jongha Kim https://github.com/wisedog Qizhe ZHANG https://github.com/PassionPenguin Artem Shibakov https://github.com/saionaro Bright Data HoChan Lee https://github.com/hochan222 11STREET Sangchul Lee https://github.com/1ilsang WoowaBros Park Sunhee https://github.com/sunhpark42 WoowaBros FU CHUNHUI https://github.com/fuchunhui Baidu Estelle Weyl https://github.com/estelle Open Web Docs Yitao Yin https://github.com/yin1999 Northwestern Polytechnical University Florian Scholz https://github.com/Elchi3 Open Web Docs Contributor spotlight There are many other things I like about MDN: the openness of its governance, the respect for contributors' work, the professional conversations, and the always timely reviews. MDN has consistently demonstrated the ideal form of an open-source project. Joshua Chen (MDN contributor) MDN Web Docs has the most up-to-date and accurate information and the content is presented in an easy-to-understand manner. I also like that it's available in many languages (very important!). Yuji (MDN contributor) There are millions of web developers in China, and many of them begin their developer journey at MDN Web Docs. Contributing to MDN Web Docs is an excellent way to help people who are starting out. YiTao Yin (MDN contributor) If you wish to be a part of the featured contributors here, let us know. If you’re featured here and would like to opt-out, please file an issue on GitHub.Learn how to get startedWe collaborate on GitHub, our project's home, on various tasks such as writing and improving documentation, fixing bugs, and providing review feedback. It starts here, with you. Want to start right away, but not sure how? Follow our guide to make your first contribution. Watch this video on how to get started with contributing to MDN. Video from the community team on contributing to MDNJoin us in shaping a better webBecome part of this globally cherished group that’s dedicated to documenting web technologies. Whether you’re an expert or a beginner, there’s a place for you in our inclusive community. Check out some of the ways you can contribute and engage. Fix issues Submit pull requests to fix reported issues. Squash bugs Improve content Fix inaccuracies and fill in missing information. Start writing Localize content Participate in translating content into one of our supported languages. Find your locale Answer questions Share your knowledge and expertise and guide fellow learners. Help on Discord Help us fix open issuesNew to MDN or open-source projects? Tackle our beginner-friendly issues to help improve MDN.TitleRepositoryJoin the conversation Chat with us on Discord Connect with the community. Engage with domain experts. Help others learn. Join MDN Discord Join our Community Call Every month, get exclusive updates from the MDN team. Share your ideas and contributions. RSVP to the next community call While working in Mozilla spaces and communities, please adhere to the Mozilla Community Participation Guidelines, which promote respect, inclusion, and a harassment-free environment for all community members.Licensing and reuseMDN's resources are freely available under various open-source licenses. For detailed information on reusing MDN content, check out our Attribution and Copyright Licensing page."
