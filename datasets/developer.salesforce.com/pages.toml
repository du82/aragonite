full_description = 'Explore developer centers Overview Guides Reference Overview Guides Reference Overview Guides Reference Overview Guides Reference Browse all APIs Discover what’s new in Spring ’25! Dive into the release notes to discover new innovations for Agentforce, Data Cloud, and more. Start learning { "@context": "https://schema.org/", "@type": "WebSite", "name": "Salesforce Developers", "url": "https://developer.salesforce.com/" } const releaseBannerEl = document.querySelector(".home-banner-release-button"); releaseBannerEl.addEventListener("click", (e) => { track(e.currentTarget, "custEv_ctaLinkClick", { click_text: e.currentTarget.innerText, element_title: "Discover what’s new in Spring ’25!", click_url: "https://help.salesforce.com/s/articleView?id=release-notes.salesforce_release_notes.htm&amp;release=254&amp;type=5", element_type: "button", content_category: "banner: cta" }); }); function track(element, event, payload) { const TRACKING_EVENT_NAME = "developerwebsite_track"; const LISTENER_QUEUE = "__DX_INSTRUMENTATION_QUEUE__"; const LISTENER_INDICATOR = "__DX_INSTRUMENTATION_IS_INITIALIZED__"; const detail = { event, payload }; if (window[LISTENER_INDICATOR] === undefined) { window[LISTENER_QUEUE] = window[LISTENER_QUEUE] || []; window[LISTENER_QUEUE].push(detail); } else { const e = new CustomEvent(TRACKING_EVENT_NAME, { bubbles: true, composed: true, detail }); element.dispatchEvent(e); } }'
