["https://developer.samsung.com/health/blog/en/2024/06/25/unveiling-the-future-key-moments-from-the-samsung-health-partner-day-2024"]
title = "Unveiling the Future: Key Moments from the Samsung Health Partner Day 2024 | Samsung Developer"
description = "The world runs on you."
full_description = '''EN KR Events Health, Mobile, Galaxy Watch Unveiling the Future: Key Moments from the Samsung Health Partner Day 2024 Samsung Developer On May 28th, 2024, market leaders from digital healthcare gathered for the Samsung Health Partner Day, held at Gravity Seoul Pangyo, Autograph Collection. Over 200 stakeholders attended the event, representing healthcare companies, medical institutions, and investment firms. This important event marked the first step for solidifying the Samsung Health ecosystem. The day featured a variety of programs, including an introduction to Samsung Health, partner collaboration case studies, VC sessions, panel discussions, exhibitions, and networking opportunities. It provided a compelling glimpse into the future of digital healthcare. Samsung Health Partner Day: Opening The event began with a welcome speech from Hon Pak, Leader of Digital Health team, at the MX Division of Samsung Electronics. "Our relationships with partners are key to realizing Samsung Health's vision of Connected Care as the next-generation healthcare platform," emphasized Pak. Samsung Health Partner Day: Samsung Health Session In the "Present and Future of Samsung Health" session, Junil Choi, Head of the Health Strategy Group, in the Digital Health team at Samsung Electronics, introduced the unique offerings of Samsung Health in the digital healthcare market and outlined its future directions. Notably, the platform's strategy of analyzing personal medical and lifelog data to provide tailored information for users' needs was well received by the partners. The next session showcased digital healthcare technologies by Samsung Health. Moonbae Song from the Digital Health team at Health Software Development Group said that "Samsung Health SDK provides a medical research system that allows connection of many different devices for a large user base," detailing its role as a platform. Jongmin Choi, Head of the Health Hardware Development Group, Digital Health team, shared current technologies of Samsung Health sensors. He explained that the sensor's algorithms are designed to focus on user health, including monitoring sleep health, detecting arrhythmias, predicting diabetes, and measuring blood sugar levels. Samsung Health Partner Day: Panel Discussion Following the Samsung Health session, a panel discussion on "Digital Healthcare and AI" took place. Hansol Paeng, CEO of haheho moderated the discussion, and the panelists included Hon Pak from Samsung Health, Professor Yonggi Jeong and Professor Woncheol Cha from Samsung Medical Center, and Dooah Choi, CEO of HurayPositive. The discussion reviewed the partners' strategies for positioning themselves as successful digital healthcare businesses and discussed what role Samsung Health can play as a platform in the digital healthcare market. Professor Yonggi Jeong stated, "I am confident that polysomnograms will soon be replaced with Galaxy Watch," emphasizing that the data owned by Samsung Health SDK is at the core of digital healthcare. Samsung Health Partner Day: Partner Session The next session was highly anticipated and focused on real-life cases of partner collaboration. Joohoon Jeong, CEO of 3boon1, discussed the future direction of digital healthcare and the importance of solutions in the B2C sleep market. He mentioned that he has high expectations for wellness collaborations, extending beyond the utilization of Galaxy Watch sensors. Jooyeon Kim, CEO of LILLIUS, introduced the collaboration of sports tech with Samsung Health. LILLIUS offers a variety of sports challenges such as "100 squats in 5 minutes every day," aiming to make the world healthier by incorporating Samsung Health technologies to provide challenge results and health indicators. Joonmyeong Kwon, CEO of Medical AI, talked about "Health AI Technologies Needed in the Medical Field and Collaboration with Samsung." Medical AI has developed an innovative healthcare service using the Galaxy Watch's ECG sensor for biometric signal AI analysis to keep customers healthy. Mr. Kwon expressed confidence that Samsung Health solutions can help overcome the limitation of digital diagnostics. Kwanghyeon Lee, Director at i-SENS, demonstrated a collaboration case where various health data from Samsung Health was combined with the continuous blood sugar data from i-SENS. The strategy to enhance the continuous blood sugar data display feature on Galaxy Watch was enthusiastically received by the attending partners. Samsung Health Partner Day: VC Session & Discussion All eyes were on the next session, "Global Healthcare Trend from the Perspective of Samsung Next." David Lee, Head of Samsung Next Center, mentioned that "AI/machine learning and personalization of medicine" are emerging as market keywords. He also highlighted the growing importance of medicine outside conventional medical spaces, as technologies are increasingly used in remote medicine and remote patient monitoring. The investment strategies for digital health infrastructure and Samsung Health's collaboration with partners were met with excitement. The sessions were followed by a VC panel discussion where various investors expressed their opinions. Jeonghyo Goo from Samsung Next moderated, while Yoonseop Choi, Chief Partner of Digital Healthcare Partners, Chiwon Kim, Vice President of Kakao Ventures, Seungwoo Lee, Director of Devsisters Ventures participated as panelists to share their views on global healthcare trends. They first shared recent healthcare investment trends, then discussed the strengths and weaknesses of Korean startups from investors' perspectives. The session concluded with all the speakers from Samsung Health taking the stage to answer questions and receive feedback and suggestions from partners. Samsung Health Partner Day: Exhibition In addition to the various sessions, Partner Day featured eye-catching exhibitions that visualized distinct aspects of Samsung Health. The exhibition highlighted the remarkable progress of Samsung Health, celebrating its 12th anniversary since the service was launched. Key milestones, such as the launch of the irregular heart rhythm warning feature and obtaining FDA approval for the sleep apnea detection feature, highlighted Samsung Health's technological leadership. Samsung Health's Sleep Insight booth featured an intriguing exhibition where 716 million sleep records were analyzed and summarized into different sleep animal types. Participants could discover their own sleep animal type and experience Samsung Health's sleep coaching technology. The Health Feature exhibition showcased how the combination of Samsung Health technologies and Galaxy's wearable devices have established a key digital healthcare platform. The partner ecosystem exhibition, created from the vast Samsung Health data, demonstrated the current status of various Health SDK partnerships and highlighted Samsung Health's consistent philosophy of open collaboration. Additionally, the prototype of Samsung’s widely anticipated "Galaxy Ring," a smart device in ring form, was unveiled for the first time in Korea, catching the eyes of participants. Samsung Health Partner Day: Networking After all the sessions concluded, further networking took place between Samsung Health and the attending participants who excitedly shared their visions for expanding the digital health ecosystem. Jongmin Choi stated, "There will be great opportunities for many partners based on the technologies of Samsung Health and Galaxy Watch," forecasting a promising future for digital healthcare through collaboration between Samsung Health and its many partners. If you need more information about Samsung Health, please visit https://developer.samsung.com/health 0'''
