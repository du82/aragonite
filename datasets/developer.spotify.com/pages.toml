title = "Ads API | Spotify for Developers"
full_description = '''Ads API [data-ch-theme="s4d"] { --ch-t-colorScheme: dark;--ch-t-foreground: #ffffff;--ch-t-background: #1E073C;--ch-t-lighter-inlineBackground: #1e073ce6;--ch-t-editor-background: #1E073C;--ch-t-editor-foreground: #F8F8F2;--ch-t-editor-lineHighlightBackground: #3E3D32;--ch-t-editor-rangeHighlightBackground: #ffffff0b;--ch-t-editor-infoForeground: #3794FF;--ch-t-editor-selectionBackground: #49483E;--ch-t-focusBorder: #007FD4;--ch-t-tab-activeBackground: #1E073C;--ch-t-tab-activeForeground: #ffffff;--ch-t-tab-inactiveBackground: #2D2D2D;--ch-t-tab-inactiveForeground: #ffffff80;--ch-t-tab-border: #252526;--ch-t-tab-activeBorder: #1E073C;--ch-t-editorGroup-border: #444444;--ch-t-editorGroupHeader-tabsBackground: #252526;--ch-t-editorLineNumber-foreground: #858585;--ch-t-input-background: #3C3C3C;--ch-t-input-foreground: #F8F8F2;--ch-t-icon-foreground: #C5C5C5;--ch-t-sideBar-background: #252526;--ch-t-sideBar-foreground: #F8F8F2;--ch-t-sideBar-border: #252526;--ch-t-list-activeSelectionBackground: #094771;--ch-t-list-activeSelectionForeground: #fffffe;--ch-t-list-hoverBackground: #2A2D2E; } About The Spotify Ads API lets you build, manage, and report on Ads Manager campaigns. This guide can help you get started. Topics include: Getting started requirements and instructions An Ads Manager overview Descriptions of available endpoints Help and support information Next steps If you're not sure what to do now, try these recommendations: New to the Ads API? See the Quickstart section. It provides instructions about how to set up an account to work with our API. Already using the Ads API? Great! Check the Release Notes section for information on the latest changes, or browse the available methods below. Support To report a bug or ask questions about this service, contact the Ads API team at ads-api-support@spotify.com. NOTE: Please be sure to include info such as your client ID and a copy of the request and response (including the sp_trace_id) if relevant. Subscribe to Newsletter Sign up for our monthly Ads API newsletter here if you want to receive updates about new releases, testing opportunities, and more! API Design This section covers important design elements that affect how the Ads API works. Take a moment to review this information. Rate Limiting Rate limiting caps the number of API calls a user or app can make within a set period of time. The Ads API applies RPS rate limits on a per-user basis for each calling app, regardless of the number of simultaneous app users. These limits help Spotify provide API access equitably to all our engineering partners. In addition, there is also a cap on the reporting endpoints that takes precedence over the general cap on the client ID + user ID key since these specific endpoints are most at risk for high-request volumes, oftentimes due to bad or malformed requests. Note: If our API returns status code 429, it means that you have sent too many requests. When this happens, check the headers for the following info: X-RateLimit-Remaining: The count of requests remaining in the rate limit window X-RateLimit-Limit: The maximum number of requests allowed within the rate limit window X-RateLimit-Reset: The number of seconds left until the rate limit resets and you can retry your request again Rate Limit OnRate Limit RequestWindow (seconds)Sustained Requests per second (RPS) limitClient ID + User ID (as a single key)150030s50 RPSClient ID + User ID (as a single key) on Reporting Endpoints15030s50 RPS Breaking v. Non-Breaking Changes Policy This section provides a more detailed list of what Ads API considers to be a "Breaking" change, and what is considered a "Non-Breaking" change (i.e. backwards compatible change). The API defines these terms in the following way: Breaking Changes: Any alteration in the API that causes existing integrations to fail or function incorrectly from the perspective of the Ads API customers / users. Integrations built on the previous version of the API would not continue to function as expected after these changes are implemented, and would thus require immediate attention and modification. Non-Breaking/Backwards Compatible Changes: Updates or enhancements to the API that do not disrupt existing integrations. Integrations built on the previous version of the API continue to function as expected, even after these changes are implemented. Breaking Changes Removing an existing operation/endpoint Request Headers Removing or renaming an existing header Adding a new required header Making a previously optional header required Changing the type of a header Changing the default value of a header Body Removing or renaming an existing field Adding or increasing restrictions to the accepted values for an existing non-enum field Removing enum options from an existing enum-type field Adding a new required request field Making a previously optional request field required Changing the type of an existing request field Changing the default value of an existing field Query/Path Parameters Removing or renaming an existing parameter Adding or increasing restrictions to the accepted values for an existing non-enum parameter Removing enum options from an existing enum-type parameter Adding a new required parameter Making a previously optional parameter required Changing the type of an existing parameter Changing the default value of a parameter Response Body Removing or renaming an existing field Removing enum values/options from an existing enum-type field Changing the type of an existing field Adding a new validation rule to an existing parameter or making an existing validation rule more restrictive Changing the value of what is being returned behind the scenes Changing authentication or authorization requirements Non-Breaking/Backwards Compatible Changes Updating documentation, both internally and externally facing Adding a new operation/endpoint Request Headers Adding a new optional header Making a previously required header optional Request Body Adding a new optional field Making a previously required field optional Adding enum values to an existing enum type field Marking an existing field as deprecated to warn of future remove, but not removing it Query/Path Parameters Adding a new optional parameter Making a previously required parameter optional Adding enum values to an existing enum type parameter Marking an existing parameter as deprecated to warn of future remove, but not removing it Response Headers Adding a new header Body Adding a new field Changing the order of properties in existing API responses Adding enum values to an existing enum type field Marking an existing field as deprecated to warn of future remove, but not removing it Any bug fixes that don’t fall into the breaking changes category Codebase improvements that don't fall into the breaking changes category (e.g. Testing Improvements, Performance Improvements, etc.) Marking an existing endpoint as deprecated to warn of future remove, but not removing it Versioning The most recent version of the Ads API is v3. All endpoints are versioned with a version number in the URI. Version numbers are integers and the version number is a prefix of the URI. In accordance with semantic versioning, versions are bumped when there is a backwards-incompatible change that necessitates it, such as significant schema changes. Updates that do not break existing consumers will be deployed to the current version as patch releases. Patch releases: Non-Breaking Changes Major releases, e.g. /v3/ to /v4/: Major Breaking/Backwards Compatible Changes For each of these releases, the API team will communicate with clients and detail the changes in the API Release Notes. Release Calendar In order to maintain a healthy evolution of fixes and improvements to the API, in January 2024 the Ads API began to follow a lifecycle of sunsetting its currently latest version approximately every year. From v2 onwards, the API team will maintain 3 versions (e.g., v2, v3, and v4 will be maintained at the same time). Within about 12 months, the current version is considered deprecated. Deprecation means that a newer version is now available and the flagged version will soon be sunset. After another 6 months, the version is sunset and will no longer be accessible. For example, the current latest version (v3) of the API will be deprecated ~12 months from January 2025 in Q1 2026 then sunset ~Q3 2026: To summarize the release policy: Deprecations: The existing version is typically deprecated when a new version is released. Once deprecated, new features will not be added to the version, and non-critical bugs will not be resolved. In rare exceptions, critical bug fixes will still be made to the version until it's sunset. Sunset: The Ads API team will give a 6 month notice before a version becomes sunset, meaning HTTP requests can no longer be made. Release Notes: The Ads API team will continue to post monthly updates (see more in the Release Notes section). Monthly Newsletter: The newsletter includes a summarized version of the release notes (see more in the Monthly Newsletter section). Past Versions For historical reasons, here's a table of previous API versions: API VersionRelease DateDeprecation DateSunset Datev3January 2025TBATBAv2August 2023January 21, 2025July 22, 2025v1.4November 2022November 13, 2023November 27, 2023v1.3July 2022November 13, 2023November 27, 2023v1.2December 2021August 25, 2022November 27, 2023v1.1June 2019August 25, 2022November 27, 2023v1.0March 2019July 1, 2022November 27, 2023 Time Format Times are always recorded in ISO 8601 format as Coordinated Universal Time (UTC) with a zero offset: YYYY-MM-DDTHH:MM:SSZ. Pagination Most list endpoints support paging the dataset by taking an offset and limit as query parameters. limit specifies the number of results to be returned from the call. If not specified, the default value is 50. The max allowed value is also 50. offset specifies the starting position of the first result. If you specify a limit of 5, the API will return 5 results. On the next page you’d put an offset of 6 to retrieve results 6 through 10. We return the total number of results along with the page size in the paging object. The reporting endpoints are an exception and use continuation tokens for paging instead of offset. The reporting response will include a continuation token that can then be sent in a subsequent reporting request to access the next page of results. When sending a request with a continuation token included, no other fields should be specified. If the continuation token returned in the response is null, that means there are no more pages available. Continuation tokens are base64 encoded and encrypted strings that look like the following: AMC-fuxpGRIqFcOUEzDEdWQsM5Iy7mkRThKFo94mEys6RF1lzeKyq1sOlWU4RsdjSsgDWR2D7An1nFgLXNBU9hocKnWQ9jRsps6kCLqKd7Q77zNEhHm_Xlb6J_Fci6kK7tXVM3U6H8OajjcTA18eFcr-kv0etZJZBWlMhtP84xj4WiVDZnPWaMo7AL3jRrHH32grJ3eRA2PAoZmhg80%3D Release Notes This section documents changes to the Ads API, including all patch updates, bug fixes, new version releases, version deprecations, version sunsets, etc. January 2025 All of the following updates are included under a new major version (v3) released on January 21, 2025. v2 Deprecation Timeline v2 of the Ads API will be deprecated on July 22, 2025. All partners are required to update their integration to v3 by this date in order to avoid disruption to their integrations. What’s New Introducing business and ad account management capabilities! New endpoints under “Businesses”: Get Businesses for Current User Get Business by ID Create Business Update Business New endpoints under “Ad Accounts”: Create Ad Account Update Ad Account Get Ad Accounts for Current User by Business ID [Breaking Change] This endpoint is intended to replace the v2 Get Ad Accounts for Current User endpoint, which has been deprecated and removed Changes under ad account entity: New field business_id New field legal_entity_name [Breaking change] display_name is now nested under billing_address object and renamed to name [Breaking change] statusReason renamed to status_reason [Breaking] address renamed to billing_address Support for video views and podcast streams campaign objectives New enum values available for objective under the Campaign entity: VIDEO_VIEWS and PODCAST_STREAMS Also added to the Estimate Audience and Estimate Bid endpoints Support for new opt-in video format New optional field in Create Ad Set, Estimate Audience, and Estimate Bid endpoints: video_delivery_formats This field is only applicable for video ad sets. It specifies the allowed delivery formats of the ad set, which define how the ads within them will be shown to users. Allowed values: IN_STREAM OPT_IN For video views campaigns, the only allowed value (and default value) is OPT_IN For clicks campaigns, the only allowed value (and default value) is IN_STREAM For all other campaigns with video ad sets, the default is both OPT_IN and IN_STREAM Expanded support for third-party tracking tags: New enum value UNSET supported for the measurement_partner field under the third_party_tracking object on the Ad entity – UNSET should be used for any partners aside from DCM or IAS Other Non-Breaking Changes Campaigns New filters under Get Campaigns by Ad Account ID: name ad_set_statuses Ad Sets New filters under Get Ad Sets by Ad Account ID: name statuses Ads New filters and sort fields under Get Ads by Ad Account ID: Filter by: name statuses asset_ids Sort by: name status budget start_date_time end_date_time Added new field key to the call_to_action object in the response body which represents the un-localized CTA key (the localized equivalent is still returned via the existing text field) Assets New fields under the Asset entity: asset_subtypes aspect_ratios New filters and sort fields under Get Assets by Ad Account: Filter by: asset_subtypes aspect_ratios statuses Sort by: sort_direction (allowed values: ASC, DESC) sort_field (allowed values: CREATED_AT, NAME) Reporting New async reporting endpoints: Create A CSV Report Asynchronously New metrics supported: MODELED_LEADS MODELED_PAGE_VIEWS MODELED_PURCHASES UNMODELED_ADD_TO_CART UNMODELED_LEADS UNMODELED_PAGE_VIEWS UNMODELED_PURCHASES Get CSV Report Status by ID Get Aggregate Report: New metrics supported: UNMUTES COMPLETION_RATE Removed ACTIVE from list of filterable ad statuses Targets Get Geo Targets country_code validation relaxed: Users are no longer required to input a country_code when specifying an id or list of ids Breaking Changes/Deprecations Ad Sets exclude_placements has been removed and replaced with new required field placements – when calling Create Ad Set, users will now specify placements to include (as opposed to exclude) Allowed enum values: MUSIC PODCAST (NOTE: only available for certain markets and cannot be specified on its own) sensitive_topic_exclusion_ids from under the targets objects has been removed – users should instead use sensitive_topic_'''
