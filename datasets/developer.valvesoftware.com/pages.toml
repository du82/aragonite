full_description = '''Main Page From Valve Developer Community Jump to navigation Jump to search Welcome to the Valve Developer Community 12,473 articles documenting the development process. Sign up to become part of the community! Whether you're building a commercial project or a modification for Half-Life® 2, you'll want to sign up as a Valve developer today. It's free to join and is open to anyone working with the Source engine and its software development kit. GoldSrc and the Half-Life SDK If you want to create a Mod for Half-Life or looking for more GoldSrc documentation, click above. Source and the Source SDK If you want to create a Source SDK Base mod, or content-based mod for Half-Life 2, Team Fortress 2 or looking for more Source documentation, click above. Source 2 Documentation If you want to port Source content to Source 2, create a content-based mod for Source 2 games or looking for more Source 2 documentation, click above. Otherwise, you can check out the following Source 2 games with Workshop Tools: Dota 2 Workshop Tools SteamVR Workshop Tools Half-Life: Alyx Workshop Tools Counter-Strike 2 Workshop Tools The engine under the hood of Half-Life 2 can make your game a success. Let Source™ do the heavy lifting so that your team can focus on building great games. If you're interested in building a product using Source or Source 2, talk to us about options for distribution on Steam. Read about Valve Technology For Mod Teams Source Engine Features Why choose the Source engine for your mod? Read Making a Mod - building a team through the shipping process. Already using the SDK? Check the Source SDK FAQ for some helpful answers. New to Source coding? Get started with basic programming articles. Read (or add) a tutorial on Source development, or any part of the content creation process. New to the wiki? For help with using the wiki, see Help:Contents. For help with navigating the wiki, see Category:Entry pages or Category:Valve Developer Community. For more in