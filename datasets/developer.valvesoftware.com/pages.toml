["https://developer.valvesoftware.com/wiki/Source_SDK_2013"]
title = "Source SDK Base 2013 - Valve Developer Community"
full_description = '''Source SDK Base 2013 From Valve Developer Community (Redirected from Source SDK 2013) Jump to navigation Jump to search SDK Base (2006, 2007) SDK Base 2013 (About) Setup - SDK Base 2013 SP Setup - SDK Base 2013 MP (TF2)edit Contents 1 SDK Base versions 2 Setting up & compiling code 3 SDK Base Content 3.1 Singleplayer branch 3.2 Multiplayer branch Source SDK Base 2013 - Singleplayer and Source SDK Base 2013 - Multiplayer are tools available to all Steam users which, as the name suggest, is locked to Source 2013 engine branch, to prevent incompatible engine updates from making your mod unusable. Tip:Despite the names, both Source SDK Base 2013 - Singleplayer and Source SDK Base 2013 - Multiplayer ( only) can be used for singleplayer.The Multiplayer branch provides additional features (static prop lightmaps, BSP compression, more ambient cubes per visleaf, and slightly newer code), which may be desirable over the Singleplayer branch if not using a base mod such as Mapbase and not making a single-player mod that does not modify game code. TF2 branch version of Source SDK Base 2013 - Multiplayer makes some changes which break singleplayer mode, such as save loading not working correctly[1] and attempting to load any map with maxplayers (singleplayer) and cl_localnetworkbackdoor both set to 1 will also crash the game[2]. SDK Base versions There are two versions of Source SDK Base(s) 2013: Source SDK Base 2013 - Multiplayer (AppID: 243750 - Click to Install) Note:This branch originally runs on Source 2013 Multiplayer, but it has been upgraded to Team Fortress 2 branch, which might be incompatible with mods built on legacy version of Source 2013 Multiplayer (that runs on Source 2013 Multiplayer).To downgrade to legacy version of Source SDK Base 2013 Multiplayer, follow the instructions: Open Steam, go to Source SDK 2013 Multiplayer, right click Properties A window will open. Go to "Betas", select previous2021 beta branch. Steam will automatically re-download the files. Once it's done, run Source SDK Base 2013 MP as normal, or use it's tools. Source SDK Base 2013 - Singleplayer (AppID: 243730 - Click to Install) Note:By default, many sourcemods (including Mapbase), will crash when launched, unless you select the upcoming branch.To select upcoming branch, follow the instructions: Open Steam, go to Source SDK 2013 Singleplayer, right click Properties A window will open. Go to "Betas", select upcoming beta branch. Steam will automatically re-download the files. Once it's done, try to launch the mod again. Setting up & compiling code To set up Source SDK 2013 and compiling mods, see: Setting up Source SDK Base 2013 Multiplayer - for Team Fortress 2 branch (using post-2025 Source SDK Base 2013 - Multiplayer) Setting up Source SDK Base 2013 Singleplayer - for Source 2013 Singleplayer (using Source SDK Base 2013 - Singleplayer) Source code for this SDK is not yet updated, unlike TF2 branch, and will require using older version of Visual Studio or GCC to compile. Also applies to legacy (pre-2025) version of Source SDK Base 2013 - Multiplayer. SDK Base Content Singleplayer branch Source Engine Test (sourcetest) Half-Life 2: Episode Two shared (ep2) Half-Life 2: Episode One shared (episodic) Half-Life 2 shared (hl2) Source 2013 Singleplayer branch (32-bit binaries only) Multiplayer branch Source Engine Test (sourcetest) Note:Source Engine Test can be only launched with 32-bit binaries only. Half-Life 2: Deathmatch shared (hl2mp) Half-Life 2 Complete (hl2_complete) Half-Life 2 shared (hl2) Team Fortress 2 branch (32/64-bit binaries) Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Source_SDK_Base_2013&oldid=465209" Categories: ToolsSourceSDK 2013Source 2013 SP engine branch gamesTeam Fortress 2 branch gamesHidden category: English'''
