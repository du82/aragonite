title = "Faceposer - Valve Developer Community"
full_description = '''Faceposer From Valve Developer Community Jump to navigation Jump to search Faceposer playing back a complex scene with multiple actors. Faceposer is the SDK tool used to produce choreographed sequences for the Source engine. It can create facial expressions (including lip-syncing), manage skeletal animations, the position of actors in the world, and any map triggers that need to be fired during a scene. See Choreography creation for a step-by step guide to creating choreography in the Source engine. See Faceposer reference for a quick-reference guide to the different parts of the Faceposer interface. Note:To use Faceposer with your own 2013-based mod, you'll need to set the VPROJECT environment variable to the game directory of your mod. Note:All imported audio should be WAV files encoded as compressed 4-bit ADPCM or uncompressed 16-bit PCM. The sampling rate can either be 11025 Hz, 22050 Hz, or 44100 Hz. Issues Faceposer (in pre- games) has missing icons for the Play / Stop / Pause buttons. To fix this, extract this to your SDK's bin (or hl2/gamedir) folder. The Phoneme Extractor is broken by default. This can be fixed by using the Lipsinc Speech API instead of the default Microsoft Speech API. The Textured Render view only displays missing textures. Try using Smoothshaded or Flatshaded instead. Faceposer has some trouble loading debug materials, and will spam the Output window constantly when it uses them. This can cause the program to stutter quite a bit. You can try replacing your MaterialSystem.dll with this to silence these logs. The program will also, in semi-rare cases, spam the Output window with Invalid controller index, and eventually crash. It is unknown what exactly causes this. If models fail to load, or Faceposer is no longer starting, try deleting the HKEY_CURRENT_USER\Software\Valve\faceposer registry key, and delete the hlfaceposer.rf file inside your SDK's bin folder. If your mod uses custom shaders, Faceposer will fail to render any materials that use them when it's launched via VPROJECT. You'll need to launch Faceposer with the -game parameter pointing to the game directory of your mod. Similar to HLMV, opening folders inside of the "Load model..." browser will give you an error if said folder only exists within a VPK. Official Source SDK tools Map editors HammerMap compilers VBSP • VVIS • VRAD • vmpiMap tools bspzip • glview • VBSP2 • vbspinfoModel compilers StudioMDLModel tools Dmxconvert • Dmxedit • HLFaceposer • HLMV • Itemtest • Modelbrowser • QC_EyesTexture tools Height2Normal • height2ssbump • makevmt • mksheet • Pfm2tgas • Shadercompile • Splitskybox • VTEX • VTF2TGA • xwadSound tools VSoundEditEngine tools ActBusy Script Editor • Entity Placement Tool • Commentary Editor • Foundry • Material Editor • Particle Editor • Source FilmmakerOther Captioncompiler • Demoinfo • Elementviewer • Motionmapper • Sfmgen • VConfig • Vfont • Vfont_decompiler • VICE • vpk Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Faceposer&oldid=461985" Categories: ToolsOfficial Source ToolsHidden categories: TranslationEnglish'''
