title = "Half-Life - Valve Developer Community"
full_description = '''Half-Life From Valve Developer Community Jump to navigation Jump to search This article is about the 1998 game. For the documentation on GoldSrc and Half-Life SDK, see Half-Life SDK. Half-Life Developer(s) Valve Corporation Publisher(s) Sierra Entertainment (retail)Valve Corporation Series Half-Life series Release date(s) November 19, 1998 Windows:November 19, 1998PlayStation 2:November 14, 2001macOS, Linux:Beta: January 28, 2013Stable: February 14, 2013 Genre(s) First-person shooter Mode(s) Single-player, Multiplayer Platform(s) Windows, Playstation 2, macOS, Linux Engine GoldSrc Steam AppID 70 Written in C++ Mod support Yes, drop-in folders SDK Half-Life SDK System requirements Win 7 or later 800 MHz CPU 512 MB RAM 4 GB disk space 32 MB VRAM video card For details, see below Steam Deck compatbility Verified Distribution Retail, Steam Official website https://www.half-life.com/halflife Links Steam page Mods for Half-Life on Steam ModDB page Previous game N/A Next game Half-Life: Opposing Force "They're waiting for you Gordon... in the test chamberrr...." Half-Life, Valve's debut 1998 title, blends action and adventure with award-winning technology to create a frighteningly realistic world where players must think to survive. Named Game of the Year by over 50 publications, it also includes an exciting multiplayer mode that allows you to play against friends and enemies around the world. Half-Life is also the debut of the GoldSrc engine, and was followed by a Source engine sequel in 2004, Half-Life 2. It is also ported to the Source engine, and remastered under the name Half-Life: Source. A PlayStation 2 port of the game was released in 2001, developed by Gearbox Software, which features many changes which were not present in the PC version of the game. On November 17, 2023, the game received a major update for its 25th anniversary[1], simulating the retail/WON menu UI,[3] implementing proper widescreen support with Hor+ FOV and better UI scaling for high-DPI and 4K (or higher) displays, partially fixing support for overbright lighting, and much more. The game was also available for free to keep until November 20. Additionally, Uplink and content from Half-Life: Further Data was added to the game. The downside with this update however, is that several non-standalone GoldSrc mods (except custom content and textures) and games (like Counter-Strike, Team Fortress Classic and more) were initially broken with this update; Valve provides a beta build (steam_legacy) to revert to the version prior to the update, to fix the mod incompatibility. Contents 1 Content 2 Chapters 3 Official multiplayer maps 4 Credits 5 Bugs and Limitations 6 System Requirements 7 See also 8 References 9 External links Content Half-Life maps (valve) Half-Life HD pack (valve_hd) GoldSrc shared (valve) GoldSrc code Chapters Half-Life has total of 20 chapters, 19 of which are playable. There are 14 (15 with Hazard Course) chapters set in Black Mesa and 4 (5 with Endgame) chapters set in Xen. Half-Life Chapters Hazard Courset0a0 Black Mesa Inboundc0a0 Anomalous Materialsc1a0 Unforeseen Consequencesc1a1 Office Complexc1a2 "We've Got Hostiles!"c1a3 Blast Pitc1a4 Power Upc2a1 On a Railc2a2 Apprehensionc2a3 Residue Processingc2a4 Questionable Ethicsc2a4d Surface Tensionc2a5 "Forget About Freeman!"c3a1 Lambda Corec3a2 Xenc4a1 Gonarch's Lairc4a2 Interloperc4a1a Nihilanthc4a3 Endgamec5a1 Todo: put links to the applicable Combine OverWiki pages on the above chapter pages. Official multiplayer maps Stub This article or section is a stub. You can help by expanding it. The original release of Half-Life included 8 multiplayer maps: Boot Camp (boot_camp.bsp) Bounce (bounce.bsp) Datacore (datacore.bsp) Lambda Bunker (lambda_bunker.bsp) Snark Pit (snark_pit.bsp) Stalkyard (stalkyard.bsp) Subtransit (subtransit.bsp) Undertow (undertow.bsp) Subsequent updates, patches, and several web-site exclusive releases (such as for IGN and PC Gamer Online) throughout 1998-1999, added the following: Crossfire (crossfire.bsp) Frenzy (frenzy.bsp) Gasworks (gasworks.bsp) Team9 (team9.bsp) The Hill (thehill.bsp) 'Half-Life: Further Data', a retail-released series of CDs released in February 1999 with more additional content, included the following maps: DoubleCross (doublecross.bsp) Rust Mill (rustmill.bsp) Xen DM (xen_dm.bsp) The February 2001 Planet Half-Life Mapping Contest winner, Rapidcore (rapidcore.bsp) by Michael "Wolf" Schulz was added in a patch.[2] The 'Half-Life: Further Data' content was added to the Steam version of 'Half-Life' in November 2023 in celebration of the series' 25th Anniversary, which also added brand new maps:[1] Contamination (contamination.bsp) Disposal (disposal.bsp) Pool Party (pool_party.bsp) Rocket Frenzy (rocket_frenzy.bsp) Credits Main article: Half-Life Credits These are the official credits for "Half-Life", as released in November of 1998: Ted Backman TK Backman Kelly Bailey Yahn Bernier Ken Birdwell Steve Bond Dario Casali John Cook Greg Coomer Wes Cumberland John Guthrie Mona Lisa Guthrie Mike Harrington Monica Harrington Brett Johnson Chuck Jones Marc Laidlaw Karen Laur Randy Lundeen Yatsze Mark Lisa Mennet Gabe Newell Dave Riller Aaron Stackpole Jay Stelly Harry Teasley Steve Theodore Bill Van Buren Robin Walker Douglas R. Wood Uncredited Voice work: Mike Shapiro: Black Mesa Security Guards, Soldiers, the G Man Harry S Robins: Black Mesa Scientists, Soldiers Kathy Levin: Hologram Trainer, Black Mesa Train Announcer Bugs and Limitations Visit GitHub page in order to prevent duplicate or outdated bug reports at the wiki. For engine specific bugs, see Bugs and Limitations at GoldSrc page. System Requirements Windows (Retail/WON version): Windows 95 / 98 / NT 4.0 166 MHz CPU 32 MB RAM 500 MB disk space OpenGL, Glide (3Dfx) or Direct3D 6.0+ compatible video card Windows (Steam version): Windows 7 or later 800 MHz CPU 512 MB RAM 4 GB disk space 32 MB VRAM video card Note:The Steam version is no longer compatible with XP and Vista since the 25th anniversary update.User using these OS can downgrade to previous version of the game by using the steam_legacy beta branch instead. OS X: OS X 10.6.3 Intel Core 2 Duo processor 1 GB RAM 4 GB disk space Nvidia GeForce 8xxx series or ATI Radeon X1600 video card or Intel HD Graphics 3000 Linux: Ubuntu 12.04, SteamOS 1.0 2.8 GHz Dual Core processor 1 GB RAM 4 GB disk space Nvidia Geforce 8600/9600 GT or ATI (AMD) Radeon HD 2600/3600 video card OpenGL 2.1 or above For Nvidia: 310 driver version For ATI (AMD): 12.11 driver version OpenAL-compatible audio See also Half-Life ports: PlayStation 2 version Cancelled Dreamcast version Half-Life: Source - remaster, ported to the Source engine. Black Mesa - Fan-made remake of Half-Life, running on Source engine. Half-Life 2 - Sequel to Half-Life Half-Life.fgd Half-Life SDK Mods on VDC References References 1. Half-Life 25th Anniversary Update 2. PHL Mapping Contest Results! on Planet Half-Life (archived) 3. As the new game, settings, save/load, and multiplayer menus are kept in the Steam style, and the splash background is done differently from the retail version, the WON menu is a simulation of the old menu, rather than an actual restoration. External links Half-Life on Combine OverWiki Half-Life on Wikipedia Valve Games GoldSrc Half-Life (also on PS2) • Counter-Strike • Deathmatch Classic • Ricochet • Day of Defeat • Team Fortress Classic Source Alien Swarm • Counter-Strike: Source • Counter-Strike: Global Offensive • Day of Defeat: Source Half-Life 2 (also on Xbox) • Half-Life 2: Episode One • Half-Life 2: Episode Two • Half-Life 2: Lost Coast • Half-Life 2: Deathmatch • Half-Life: Source • Half-Life Deathmatch: Source Portal • Portal 2 • Left 4 Dead • Left 4 Dead 2 • Team Fortress 2 Source 2 Dota 2 • Robot Repair (The Lab) • Half-Life: Alyx • Counter-Strike 2 • Aperture Desk JobOther Engines The Lab (use Unity, all other minigames except Robot Repair) Official Half-Life games GoldSrc Half-Life (also on PS2) • Half-Life: Further Data • Half-Life: Uplink • Half-Life: Opposing Force • Half-Life: Blue Shift • Half-Life: Decay (only in PS2) • Deathmatch Classic Source Half-Life 2 (also on Xbox) • Half-Life 2: Episode One • Half-Life 2: Episode Two • Half-Life 2: Lost Coast • Half-Life 2: Deathmatch • Half-Life: Source • Half-Life Deathmatch: Source Source 2 Half-Life: AlyxRelated Portal series Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Half-Life&oldid=461291" Categories: Half-LifeGoldSrcStubsValve GamesHalf-Life seriesOpen source mods and gamesHidden categories: TranslationEnglishTODO rev year 2025'''
