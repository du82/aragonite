["https://developer.valvesoftware.com/wiki/Source"]
title = "Source - Valve Developer Community"
full_description = "Source From Valve Developer Community Jump to navigation Jump to search id Tech 2 ▶ GoldSrc ▶ Source ▶ Source 2 SourceScreenshot in-game of Counter-Strike: Source, using the Source Engine, running on latest TF2 branch. Developer(s) Valve Corporation Release date(s) October 7, 2004 Platform(s) Windows, macOS, Linux, Xbox, Xbox 360, PlayStation 3, Nintendo Switch, AndroidNote: Valve (first-party) games only. Written in C++ SDK Source SDK Documentation License Proprietary (, , source code available for non-commercial purposes.) Official website Official Website (archived) Links GitHub Issues (bug report for all Source games, except CS:GO) Source SDK 2013 source code Predecessor GoldSrc Successor Source 2 Screenshot in-game of Counter-Strike: Global Offensive. CS:GO use then latest engine branch, which add many new features and graphical improvements. Promotional screenshot of Apex Legends, which runs on a heavily modified version of the Source Engine, featuring DirectX (Direct3D) 11, detailed models and better graphics, plus increased the engine limit, allowing maps to be larger. It also use deferred shading, allowing many dynamic lights to be lit with little to no performance loss. This article is about the game engine. For the documentation on Source and its SDK, see Source SDK Documentation. Source is a 3D game engine created by Valve in 2004, and is the successor to GoldSrc. The Source engine is well-known for its advancements in physics, AI, and graphics which made the games realistic for its time, while being scalable on older, less powerful hardware. One game, Half-Life 2, earned several awards for it's graphics, which were made possible with Source. Source has been used by Valve, third-party companies, and (much like GoldSrc) countless community mods by people around the globe, with at least 100 games developed on Source. The engine also has several branches, each with new features added and improved graphical capabilities. Despite the Source engine being 20 years old, and has been superseded by the Source 2 engine for first-party usage since 2015, it's still being commonly used today by modders and some third-party companies due to the lack of some Source 2 documentation and was rarely licensed to third-party developers compared to Source, and it's still regularly being maintained with engine and security updates. Clarify: not all Source games have Valve Anti-Cheat. See Apex Legends. Contents 1 Features 1.1 Renderer 1.2 Materials System 1.3 Multiplayer Network Code 1.4 Advanced Characters 1.5 Physics 1.6 Advanced AI 1.7 Sound System 1.8 UI 1.9 Input 1.10 Programming 1.11 Tools 2 Branches 3 Products using Source 3.1 Products made by Valve 3.2 Third-Party 3.2.1 Released 3.2.2 In development (Unreleased) 4 See also 5 External links Features List of Source engine features and capabilities. Some new features listed here may not apply to previous or later Source branches, or third-party games/branch. For a list of Source branches (including third-party games) with their specific new features, see this category page. Renderer Supports Shader Model 2.0 to 3.0 Some third-party games can also support Shader Model 4.0, 5.0 and later by using Direct3D 11 and later, like Titanfall branch and Strata Source. Anti-aliasing support (MSAA, FXAA, MLAA, TAA, etc.) See the Anti-aliasing page for more information, and features & drawbacks with various anti-aliasing methods. More anisotropic and texture filtering options Anisotropic filtering allows textures on far distances to look sharper and less blurry. Compared to GoldSrc (prior to 2013) featuring only Bilinear or Trilinear texture filtering, Source features more texture filtering options, ranging from Bilinear, Trilinear, Anisotropic 2x up to 16x. Support for both forward and deferred rendering pipelines. Deferred rendering is a rendering technique that allows games to render as much lights with little performance impact. Deferred rendering is commonly used in most modern titles. Half-Life 2 up to Counter-Strike: Global Offensive uses forward renderer, while Dota 2, aswell as some third-party Source games (, , etc.) uses deferred renderer (shading or lighting). Bump mapping and Normal mapping on models and the world Author shaders with HLSL Cube and environment mapping Cubemapping also supports Anisotropy (in all games since ) Phong shading for models Phong is also supported on world brushes (in all games since )(also in ) Dynamic lights, vertex lighting and lightmaps, many light types including flickering, pulsing etc. HDR (in all games since ) and LDR (SDR) lighting LDR is deprecated since Left 4 Dead engine branch. This does not apply to some games such as the original release of Dota 2, for example. Water with refraction, real-time world reflections and fresnel effects Water also supports flow mapping (in all games since ) Advanced particle systems that can emit sprites or models Render-to-texture shadows allow for a large number of characters per scene (in all games since ) (also in ) Occluder entities for visibility blocking Indoor/Outdoor environments Deformable terrain 3D Skyboxes extend the horizon and add parallax on distant objects Dynamically rendered organics (grass, trees, etc.) Swaying trees (in all games since ) (also in ) Subdivision surfaces, diffuse & specular bump maps Real-time radiosity lighting Real-time Cascaded Shadow Mapping that comes from the skybox (in all games since ) (also in ) Effects include but are not limited to: particles, beams, volumetric smoke, sparks, blood, & environmental effects like fog and rain Scalability Screen Space Ambient Occlusion (SSAO) (only in ) A technique for efficiently approximating the ambient occlusion effect in real time. Widescreen display support Source is one of the earliest game engines to support Widescreen monitors natively (16:9 and 16:10 aspect ratio) without stretching the image, while most games from that era are usually designed for 4:3/5:4 displays only. Games such as Half-Life 2 support widescreen display at launch back in 2004, with horizontal FOV (field of view), allow you to see more details. Physically Based Rendering (only in ) Parallax Occlusion Mapping(only in ) Support various graphics API (Direct3D, OpenGL, Vulkan) Direct3D versions Direct3D 9 On earlier version of Source (Source 2004 up to Source 2013), it had a Hardware DirectX level system that allows older GPUs to run on DirectX 8.0, 8.1 (Pixel Shader 1.x) render path (disabling DX9 graphical features not available on previous card). Previous version of Source ( and ), aswell as Source 2013 (RTX Remix only), also had support for DirectX 7.0 and 6.0 render path. This can be changed using mat_dxlevel console command, or -dxlevel command line argument. Note:DirectX hardware level system (and support for all GPUs prior to DirectX 9.0 / Shader Model 2) are no longer supported since Left 4 Dead engine branch.Also, regardless which dxlevel was set to, all Source games will always run on Direct3D 9. Direct3D 9Ex (in all games since ) (also in ) - DX9 Windows Aero extensions, requires Vista or later. User can enable/disable in Video Settings - Advanced (Windows Aero extensions), or through -disable_d3d9ex (only in ). Direct3D 11 (only in ) Direct3D 12 (only in ) Note:Direct3D 9 can be forced by the launch option -dx9, if it was forced by commands such as -gamepadui, which enables both the Gamepad UI and Vulkan renderer unless combined with -dx9 OpenGL(in all games since /) which is another graphics API used in Source games on macOS and Linux. dxlevel 92 is the OpenGL equivalent to DirectX 9 Shader Model 3 (D3D9.0c) Vulkan graphics API (only in ) A low-level API, successor to OpenGL. Vulkan can be used to workaround various graphical issues such as the Portal 2's projected textures, which does not render properly on newer graphics drivers (both NVIDIA and AMD). Enable Vulkan using -vulkan launch options. Note: Counter-Strike: Global Offensive has Vulkan support only on Linux Note:Source allows up to 8 LOD Models, although it does not have automatic level of detail out of box. Manual LoD is supported, however. Warning: Counter-Strike: Global Offensive currently does not support level of detail. $lod will be ignored, but the model will still work. Try to avoid using this command in . Materials System Instead of traditional textures, Source defines sets of materials that specify what the object is made from and the texture used for that object. A material specifies how an object will fracture when broken, what it will sound like when broken or dragged across another surface, and what that object's mass and buoyancy are. This system is much more flexible than other texture-only systems Materials can interact with objects or NPCs, such as mud or ice for vehicles to slide/lose traction on Multiplayer Network Code Time- and gamer-tested by millions of gamers around the world Support for both LAN-based multiplayer and Internet-based multiplayer games Prediction analysis for interpolating collision/hit detection Optimizations for high-latency, high-packet-loss 56k connections Advanced Characters Detailed and believable characters Realistic eyes Focus on player/object, not simply parallel views Proper eye bulge for realistic eye reflections Simulated musculature provides outstanding emotions, speech, and body language Language independent speech, characters can speak naturally in many languages Skeletal/bone system for animation Layered animation system can synthesize complex animations out of several pieces Physics Uses Havok physics engine, licensed from Havok Group (now acquired by Microsoft) More responsive world with realistic interactions Sounds & graphics follow from physics AI characters can interact with physically simulated objects Ropes/cables, machines, constraint systems, ragdoll physics Can be controlled by level design Kinematic animated bone followers Custom procedural physics controllers Vehicles Wheels slip and skid Realistic suspensions with springs on each wheel Realistic leaning during acceleration/deceleration and turning Individually tunable parameters such as horsepower, gearing, max speed, shift speed, tire material, tire friction, spring tension/dampening, etc. Multiple players in a vehicle in multiplayer Hovercraft support for cheaper simulation Advanced AI I/O system allows level designers to control AI Sophisticated navigation: characters that run, fly, jump, crouch, climb stairs and ladders, and burrow underground AI senses things using sight, sound, and smell AI relationships determine friend/foe status of other entities Battle AI allows squads of AI characters to operate together, know when to advance, retreat, lay cover fire, etc. Sound System Use Miles Sound System middleware (except in some third-party games) or minimp3 7.1, 5.1 surround sound, 4 speaker surround Bug:Despite all Source games prior to Alien Swarm has 7.1 audio option, the game only outputs only 5.1 surround despite 7.1 selected. This issue is not affected by some third-party games, such as Titanfall 2, Apex Legends as they used newer version of Miles Sound System, which have this problem fixed. [todo tested in ?] Note:Some or newer Source games (such as Alien Swarm, Portal 2 and Counter-Strike: Global Offensive) may not include options to enable 7.1 surround sound without using console commands, despite this, 7.1 audio option are most likely still broken in those games. High-quality 3D spatialization Custom software DSP Automatic DSP based on environmental geometry Microsoft ADPCM-compressed WAV files 16-bit 44.1 KHz (CD Quality), stereo wave data with all features Note:Source does not support 48 KHz audio (DVD Quality) by default. MP3 decompression (requires Miles license) Alternatively, minimp3 can be used instead. Support for audio streaming on any wave [Clarify] Real-time wave file stitching [Clarify] Pre-authored Doppler effect encoded waves Pre-authored distance variant encoded waves Commentary system UI Screenshot of Half-Life 2: Episode Two main menu, which is rendered using VGUI, with New Game, Options, and Achievements window opened. Screenshot of VGUI's Gamepad UI used in some Source 2013 games after 2022. This UI was enabled by default when playing on Steam Deck. Server browser — Displays all active game servers and allows a player to choose which one to participate in. Players can filter and sort server lists to speed up the display and selection of a server. VGUI — Valve's custom GUI interface mimics most of the Windows controls but is rendered using the Source engine for both in game and out of game uniform UI display. Some features: Dynamic in-game HUD display Many widgets/controls (e.g., buttons, treeview, html control…) Themes/custom visualization allowed Platform independent Localized text (Unicode compliant) Gamepad UI ( Source 2013 version) — Since the release of Half-Life 2 (and its episodes) as well as Portal updates in 2022, Valve have added a modern UI which is designed for consoles and handhelds like Steam Deck. With the new Gamepad UI, it was more scalable across any resolution (including 4K and higher), unlike the regular VGUI (which, the higher the resolution, the text and UI will become smaller). This UI can be also enabled manually by using -gamepadui command line argument (which will also enable Vulkan renderer that may not work on some older GPUs unless -dx9 is used in combination of -gamepadui). Scaleform (officially called Scaleform GFx) — Introduced with CS:GO engine branch at launch, this is a vector graphics rendering engine used to display Adobe Flash-based UI and HUD for games. Also used in Dota 2. Both games eventually replaced Scaleform with Panorama (circa 2015[confirm] with Dota 2 Reborn update, and 2018 for CS:GO when it went free to play, along with Danger Zone update). Panorama (in all games since ) — Introduced in 2018, replacing Scaleform, Valve's new Custom GUI interface that resembles modern web design and authoring (HTML5/CSS/JS). Using .XML and JavaScript files, developers can create dynamic and clean HUDs and menus and even high-quality in-game intractable panels. Input Source supports the following input and controller APIs: DirectInput - this method is supported in previous Source branch (, ). XInput - Introduced with Source 2007, this allows the game to be controlled using Xbox 360, Xbox One & Series X/S controller. On some Source games this was superseded by Steam Input API, but can be re-enabled by disabling Steam Input API. Steam Input API - control the game using any controllers (Xbox, PlayStation, Nintendo, others). Many Valve's Source games have been updated to natively support them. For the list of games that natively support Steam Input API, see this page. Programming Source natively support various CPU architectures, such as x86 (PC and 8th, 9th-gen Consoles), ARM ( Android, Nintendo Switch), PowerPC ( Xbox 360, PlayStation 3), and more, with both 32 and 64-bit. Support for 64-bit architect"
