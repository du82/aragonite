["https://developer.valvesoftware.com/wiki/Fi/Building_Mods_with_Valve_Technology"]
title = "Modien rakentaminen Valven Teknologialla - Valve Developer Community"
full_description = 'Modien rakentaminen Valven Teknologialla From Valve Developer Community < Fi Jump to navigation Jump to search "Modin(en)" (peli joka riippuu toisen pelin pää teknologiasta) tekeminen on todella usein paras tapa kehittää uusi peli. Kun sinä luotat yhtä vakintuneeseen peli teknologiaan kuin Sourceen, sinun tiimisi aika ja vaiva voivat mennä ainutlaatuisen pelin tekemiseen, sen sijaan kuin asioihin kuten renderöinti teknologiaan tai netti koodiin. Source Pelimoottori ja sen SDK tarjoavat tehokkaimman, kokonaisimman, ja voimakkaimman pelin kehitys paketin joka on saatavilla. Ja jos sinä jo omistat Half-Life 2, Counter-Strike: Source tai sinulla on ainakin ladattuna Source SDK 2013(en) (SP, MP tai molemmat) ja/tai Alien Swarm, niin sinulla on jo käytössäsi koko SDK. Se on kaikki mitä sinä tarvit sinun pelin rakentamiseen. Contents 1 Miksi Source? 1.1 Valve 1.2 Source ja Steam on suunniteltu modit mielessä 1.3 Isompi määrä pelaajia kuin kaikilla muilla toimintapeli moottoreilla yhteensä 1.4 Sisältää kaikki Half-Life 2sen rakentamiseen käytetyt työkalut 1.5 Source Pelimoottorin voima 2 Sinä olet valmis modin rakentamiseen! Miksi Source? Tässä on joitain syitä miksi sinun kannattaisi tehdä pelisi modina Source Pelimoottorilla: Valve Valve pysyy omistautuneena tukemaan modi yhteisöä. Valve on tehnyt useista modeista kokonaisia kaupallisia tuotteita. Source ja Steam on suunniteltu modit mielessä SDK on päivitetty jatkuvasti ja automaattisesti, usein uusien ominaisuuksien kanssa (kuten HDR(en)). Voimakas (ja ilmainen!) sarja sisällön kehittämis työkaluja tulee mukana. Source on yksinkertaisesti joustavin ja voimakkain pelimoottori saatavilla. Source/Steam antaa sinulle suoran suhteen sinun pelaajien/asiakkaiden kanssa. Isompi määrä pelaajia kuin kaikilla muilla toimintapeli moottoreilla yhteensä Modi näkyvyyttä tulee tunnetuimman alustan osana olemisesta Pääsy valtavaan, vakiintuneeseen yhteisöön ja yleisöön. Steam pelit vastaavat yli 90% kaikista tietokone netti toimintapeleistä. Noin 5 miljardia pelaaja-minuuttia kuukausittain. Yli 100,000 peli palvelijaa Yli miljoona samanaikaista pelaaja millä tahansa hetkellä Sisältää kaikki Half-Life 2sen rakentamiseen käytetyt työkalut HL2 lähdekoodi sisälletty Myös saatavilla julkisesti virallisella GitHub sivulla. Softimage XSI|EXP mallien rakentamiseen Hammer kenttä editori Täysin dokumentoitu kuvilla ja esimerkeillä Valmistettu yhteisön tekemillä syvällisillä oppailla Faceposer Half-Life Model Viewer Source Pelimoottorin voima Source Pelimoottori tarjoaa todistetusti alan johtavaa suoritusta. Renderoija Materiaali Systeemi Edistyneitä Hahmoja Fysiikkoja Edistynyt Tekoäly Monipelaaja Verkko Koodia Ääni Systeemi Käyttöliittymä (VGUI(en)) Ohjelmointia Työkaluja Lue Source Pelimoottorin ominaisuuksista(en). Sinä olet valmis modin rakentamiseen! Hanki Steam. Lataa SDK(en). Liity tähän yhteisöön(en), anna ideasi wikille, keskustele ongelmista millä tahansa sivulla, ja liity myös jakelulistaan. Lue tietoa Source modien tekemisestä(en). Aloita rakentaminen! Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Fi/Building_Mods_with_Valve_Technology&oldid=430546" Categories: Fi/ValveFi/SourceHidden categories: FinnishFi/Translation'
