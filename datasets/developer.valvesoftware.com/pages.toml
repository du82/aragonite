["https://developer.valvesoftware.com/wiki/Help:Deletion"]
title = "Help:Deletion - Valve Developer Community"
full_description = '''Help:Deletion From Valve Developer Community Jump to navigation Jump to search <Help:Contents This article contains information on a widely accepted policy that should be followed. This is a help pageThat means that this article contains information intended to advise or aid on the functions of the wiki, on how to use the wiki, or on general recommendations for users of the wiki. Some articles or images may be candidates for deletion if they do not meet Wiki standards or conform to Wiki guidelines. Content may be deleted if it is vulgar or offensive, unrelated to Steam applications and their development, or meets other criteria for deletion. Contents 1 Criteria for deletion 2 Suggesting content for deletion 3 Process for deleting content 4 See also Criteria for deletion These are guidelines for articles and images that should be deleted. This list is not comprehensive and common sense should be used Anything that violates the terms of use Any images that don't meet the Image use policy, such as images with nudity or unrelated to Wiki content Articles which do not cover any aspect of development or any relevant games or mods. An article about someone's school or a Gameboy game would fall into this category Mod profiles which do not meet the mod profile criteria - generally these articles are someone's concept for a mod with no actual work done Articles which have been created for the sake of vandalism or spam. Articles created to attack individuals, games, or companies An article about a mod you are thinking about making but don't have a team or any content for Anything offensive or vulgar in nature Suggesting content for deletion To nominate content for deletion, users must add {{delete}} to mark content for deletion. The template will automatically identify the namespace of the content (ie. template, category, page, etc.). It is best practice to provide a short description within the template stating why the content has been nominated for deletion. This can be done as follows {{delete|This page is being marked for deletion because it is spam.}}. Process for deleting content Stub This article or section is a stub. You can help by expanding it. Note:Only Administrators can delete content. Mark the content for deletion Do not delete page contents until a decision has been made. The user who nominated the content for deletion should create a new discussion topic in Reasons for speedy deletion by selecting the link generated by the template Users will then hold a discussion concerning that content. An Administrator will review all pertinent information prior to taking action. See also Help:Cleanup Image use policy Category:Candidates for speedy deletion Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Help:Deletion&oldid=369306" Categories: HelpWiki'''
year_published = 2025
clearnet = "https://developer.valvesoftware.com/wiki/Help:Deletion"
