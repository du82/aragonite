["https://developer.valvesoftware.com/wiki/Counter-Strike:_Source"]
title = "Counter-Strike: Source - Valve Developer Community"
full_description = '''Counter-Strike: Source From Valve Developer Community Jump to navigation Jump to search Counter-Strike: Source Developer(s) Valve, Turtle Rock StudiosHidden Path Entertainment (2010 update) Publisher(s) Valve Series Counter-Strike series Release date(s) October 7, 2004 Windows:October 7, 2004macOS:June 23, 2010Linux:February 5, 2013 Genre(s) Tactical first-person shooter Mode(s) Multiplayer Platform(s) Windows, macOS, Linux Engine Source (TF2 branch) Steam AppID 240 Written in C++ Mod support Yes (custom folder) SDK Source SDK Distribution Retail, Steam Official website Official Website (Archived) Links Steam page ModDB page Previous game Counter-Strike: Condition Zero Next game Counter-Strike: Global Offensive Counter-Strike: Source is a recreation of Counter-Strike inside the Source engine, and the third game of the Counter-Strike franchise. Released in October 2004, it was the first Source game to be released, leading Half-Life 2 by some weeks as a Steam pre-order bonus. It features the Counter-Strike bot, the precursor to Left 4 Dead's AI. As opposed to previous Counter-Strike games, there is no Assassination game mode and no riot shield included. Included are the Hostage and Bombing scenario. Originally at launch, player could purchase ammo separately until an update (between 2006-2009) released, removing the option to buy ammo separately, and instead buying any weapons will automatically gives you the ammo. Also at launch, CSS only had one character for both teams (Phoenix Connexion for T, Seal Team 6 for CT) until an update released in Dec 2005 up to Apr 2006, slowly adding G.I.G.N, Guerilla, Leet Krew, SAS, GSG9 and Arctic. A beta version developed by Hidden Path Entertainment (later known for developing Counter-Strike: Global Offensive) and Valve, ported the game to the Orange Box engine (Source Multiplayer), which was finished and released on Jun 23, 2010 for PC and Mac OS X, replacing the older (Source 2006 version, also known as v34/1.0.0.34). The game now features 144 (now 147) new achievements, a domination and revenge system, MVP Awards, and a new scoreboard. Currently, it runs on Team Fortress 2 branch, an updated version of Source 2013 Multiplayer which includes 64-bit support, VScript, and other new features as well as bug fixes. Contents 1 Limitations 2 Official Maps 3 Content 4 Gallery 4.1 Official screenshots 4.2 Other (in-game) 5 See also 6 External links Limitations Bug:A bug, which hasn't been fixed for over 18 years (since 2006) since the reintroduction of class selection (alternatively, selecting characters), the SAS has a weaker weapon throw due to an unconfigured ValveBiped. Bug:Video Stress Test is currently broken with recent (Team Fortress 2 branch) update, and will crash the game. Use GitHub in order to prevent duplicate or outdated bug reports at the wiki. Official Maps Counter-Strike: Source has the following official maps included. Maps with the prefix cs_ are Hostage Rescue Scenarios, maps with the prefix de_ are Bomb Defusal Scenarios. Map Filename Official Map since Remake from Counter-Strike? Available in CS:GO? Available in CS2? cs_assault 2005-06-07 Yes Yes No cs_compound 2005-02-24 No No No cs_havana 2004-10-07 (launch) Yes No No cs_italy 2004-10-07 (launch) Yes Yes Yes cs_militia 2006-01-18 Yes Yes No cs_office 2004-10-07 (launch) Yes Yes Yes de_aztec 2004-10-07 (launch) Yes Removed No de_cbble 2004-10-07 (launch) Yes Yes No de_chateau 2004-10-07 (launch) Yes No No de_dust 2004-10-07 (launch) Yes Removed No de_dust2 2004-10-07 (launch) Yes Yes Yes de_inferno 2005-03-15 Yes Yes Yes de_nuke 2005-12-15 Yes Yes Yes de_piranesi 2004-10-07 (launch) Yes No No de_port 2005-02-24 No No No de_prodigy 2004-12-16 Yes No No de_tides 2005-01-17 Yes No No de_train 2005-02-24 Yes Yes Yes Content Counter-Strike: Source (cstrike) Source shared (hl2) Team Fortress 2 engine branch (32/64-bit binaries) Gallery Official screenshots Train (de_train) Compound (cs_compound) - Front area Compound (cs_compound) - T Spawn Assault (cs_assault) Inferno (de_inferno) Other (in-game) See also Counter-Strike: Source - Wikipedia article about CS:S. Category:Counter-Strike: Source - for anything related to CS:S. External links Counter-Strike: Source on Steam ModDB page Gamebanana page Counter-Strike games GoldSrc Counter-Strike (also on Xbox) · Counter-Strike: Condition Zero · Condition Zero Deleted Scenes Third party: Counter-Strike Neo · Counter-Strike Online · Counter-Strike Nexon Source Counter-Strike: Source · Counter-Strike: Global Offensive (delisted on PC, remains available on console) Third party: Counter-Strike Online 2 Source 2 Counter-Strike 2Other Engines Third party: Counter-Strike Neo: White Memories () • FreeCS () Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Counter-Strike:_Source&oldid=465034" Categories: Counter-Strike: SourcePages with uncategorized bugsCounter-Strike seriesTeam Fortress 2 branch gamesHidden categories: TranslationEnglish'''
