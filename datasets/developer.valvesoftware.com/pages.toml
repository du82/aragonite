["https://developer.valvesoftware.com/wiki/Es/Building_Mods_with_Valve_Technology"]
title = "Building Mods with Valve Technology - Valve Developer Community"
full_description = 'Building Mods with Valve Technology From Valve Developer Community < Es Jump to navigation Jump to search La creación de un "mod" (Un juego que se basa con la tecnológica principal de otro juego) es a menudo la mejor manera para desarrollar un nuevo juego. Cuando se basa en una tecnología que esta bien establecida de un juego como el Source Engine, el tiempo y esfuerzo de su equipo puede ser empleado en la construcción creativa y con contenido único, en lugar de elementos como las funciones de la tecnología o el código de red o la detección de colisiones. Source Engine y su asociado SDK proveen el paquete de desarrollador más eficiente, completo y poderoso en el mercado. Y sí tu posees Half-Life 2 o Counter-Strike: Source, también tendrás acceso completo a SDK. Es todo lo que necesitas para empezar a crear tu juego. ¿Por qué Source? Aquí tenemos algunas razones del porque tiene sentido construir/crear tu juego como un mod usando Source Engine: Valve Valve sigue dedicado en apoyar la comunidad de mods. Valve también tiene un historial donde a demostrado convertir mods a productos comerciales en pleno derecho. Source y Steam están diseñados con mods en mente El SDK es actualizado constante y automáticamente, incluyendo nuevas funciones. (Like HDR) Un poderoso (¡Y gratis!) paquete de contenido para desarrollador con herramientas incluidas. Source es simplemente el mas flexible y mas poderoso motor en el mercado. Las plataformas Source/Steam permiten que obtengas una relación directa con tus jugadores/clientes Una amplia base de jugadores más que todas las demás con motores de juego de acción combinado Accesos a una gran comunidad y audiencia establecida. Los juegos de Steam representan el 88% de juegos de acción en linea para PC. Aproximadamente 5 billones de jugadores por minuto cada mes. 50,00 servidores de juegos. 100,00 a 220,000 usuarios simultáneos en cualquier momento. Incluye: todas las herramientas usadas para construir Half-Life 2 Incluido el código fuente de HL2 Softimage XSI|EXP para construir modelos The Hammer editor de niveles. Completamente documentado con imágenes y ejemplos Complementado a profundidad con tutoriales de la comunidad FacePoser Half-Life Model Viewer (Visor de modelos Half-Life) El poder de Source Engine En cada categoría, el Source Engine entrega un desempeño demostrando ser líder en la industria. Renderizador Sistema de Materiales Personajes Avanzados Físicas IA Avanzada Código de Red Multijugador Sistema de Sonido UI (Vgui) Programación Herramientas Lee sobre the features of the Source Engine(en). Estas listo para empezar a crear! Consigue Steam. Obten el SDK(en). Entra a esta comunidad(en), colabora con tus ideas para la Wiki, publica tus dudas en cualquier pagina, y únete a la lista de correos, también. Lee la información sobre Como ser un desarrollador(en) de mods con Source. Empieza a crear! Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Es/Building_Mods_with_Valve_Technology&oldid=430545" Categories: Es/ValveEs/SourceHidden categories: SpanishEs/Translation'
