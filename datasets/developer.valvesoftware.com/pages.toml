["https://developer.valvesoftware.com/wiki/SDK_Installation"]
title = "SDK Installation - Valve Developer Community"
full_description = '''SDK Installation From Valve Developer Community Jump to navigation Jump to search <SDK Docs Contents 1 Tools Installation 1.1 Source 2013 (SteamPipe) & TF2 branch 1.2 Source 2006/2007/2009/MP 2 Downloading the source code and SDK Base 2.1 Team Fortress 2 branch 2.2 Source 2013 2.3 Alien Swarm 2.4 Legacy branches - Source 2006 - 2009/MP 2.4.1 Source SDK Base 2.4.2 Source code 2.5 Source 2004 3 Use 4 Where do I go from here? 5 Bugs and Issues 6 See also The Source SDK is freely available to all Steam users. It is used to develop mods and content for the Source 2006, Source 2007, Source 2013 and Team Fortress 2 branch engine branches. Valve games (running on Source 2013 branch, or Team Fortress 2 branch), usually have Source SDK tools installed by default. Valve games since 2008 onward started to have their own SDK or Authoring Tools, and are engine versions that have no source code available to the public (except Alien Swarm): Left 4 Dead Authoring Tools Left 4 Dead 2 Authoring Tools Alien Swarm - SDK (free to all, includes source code) Portal 2 Authoring Tools Counter-Strike: Global Offensive Authoring Tools Some Third-party games also have their own SDK or Authoring Tools (they may or may not have the source code available to the public): Alien Swarm: Reactive Drop - SDK (free to all) SiN Episodes SDK The Ship SDK Zombie Panic! Source Mod Tools Note:Most of the Source SDK tools, such as Hammer, HLMV, etc... are exclusive to Windows only, but you can run them on Mac/Linux using Wine/Proton. Tools Installation Source 2013 (SteamPipe) & TF2 branch With the introduction of Source 2013 branch and migration to SteamPipe, Valve changed how authoring tools were distributed for Team Fortress 2, Counter-Strike Source, Day of Defeat: Source, and Half-Life 2, Half-Life 2: Deathmatch, Portal, as well as other Source 2013 games. Previously these tools were distributed together under the "Source SDK" tool, which resided in a different folder than the games, had a SDK Launcher, and only supports Source 2009 and earlier. Valve have moved towards a model more similar to L4D, Alien Swarm, Portal 2 and CS:GO, with the exception of the SDK Launcher itself. The SDK tools or Authoring Tools are now shipped with the game by default. Note that the tools are only available for Windows. Note:Check if the tools are downloaded on mac, or if they just don't work The tools are located in the respective bin folder for the game (e.g: [steam]/steamapps/common/Team Fortress 2/bin) and are meant to be launched from the following batch or exe files: hammer.bat - Hammer faceposer.bat - Faceposer hlmv.bat - Half-Life Model Viewer studiomdl.exe - StudioMDL vtex.bat - VTEX Note:If the tools do not launch, check the environment variables on your computer and change VProject to the directory where gameinfo.txt residesAlso remember to not launch the .exe directly. Launch the .bat instead! The .bat file will detect where the game was installed, and set the VProject variable before launching the tools. Note:Some games such as Half-Life: Source, and Half-Life Deathmatch: Source, do not come with FGD files for Hammer and needs to be manually configured. Source 2006/2007/2009/MP Screenshot of the now-deprecated "Source SDK" launcher. For previous version of the branch, you can download "Source SDK" (AppID: 211) tool. After installing, launch Source SDK tool, and you should be able to run Hammer, Faceposer or other tools. Downloading the source code and SDK Base Note:For most users, we recommend using the latest available branch, such as Source SDK 2013. Alternatively, Alien Swarm branch can be also used, which have features from Left 4 Dead engine branch and above, however it is not cross-platform compatible by default. The following instructions are appropriate if you need to download the source code. If you only need the authoring tools, then the instructions probably do not apply to you. Team Fortress 2 branch See: Setting up Source SDK Base 2013 Multiplayer Note:For Team Fortress 2 branch. Source 2013 See: Setting up Source SDK Base 2013 Singleplayer. Note:For both Singleplayer and legacy (pre-2025) Multiplayer branch. Alien Swarm See: Alien Swarm - SDK Legacy branches - Source 2006 - 2009/MP To install Source SDK tools for Source 2006, 2007, 2009 and MP branches, Click here to install the Source SDK. For future reference, or if that doesn't work: Open the Steam window. Go to the Library. Change the list to Tools. Find and double-click on the Source SDK item. You can also use the search bar to find the SDK. Read over the dialog box and make sure you have enough space, then click Download and Install / Next to continue The Source SDK will then be downloaded to your computer via Steam. Source SDK Base To install Source SDK Base (2006 and 2007), click the following links below: Install/Run Source SDK Base 2006 (AppID: 215) Install/Run Source SDK Base 2007 (AppID: 218) Source code Source code for the Orange Box (Source 2007) branch is available here on GitHub, or can be obtained in src_mod\ep1 folder inside SourceSDK\vpks\depot_211_dir.vpk after installing Source SDK. Source code for the Episode One (Source 2006) branch is available here on GitHub, or can be obtained in src_mod\orangebox folder inside SourceSDK\vpks\depot_211_dir.vpk after installing Source SDK. Source 2004 The Source SDK 2004 is no longer officially available. An archive of SDK 2004 is available here on GitHub. Use Once Steam has finished downloading you can launch the SDK from the Tools tab. You can also create a desktop shortcut by right-clicking on the SDK in the Tools tab and clicking Create desktop shortcut from the context menu that appears. (Recommended for quick access) When you first run the SDK it will spend a long time extracting its downloaded archive onto your disk. This will not happen again until the SDK is next updated. After that, you will be able to select a game and run any of the tools provided by the launcher. However, you will run into problems unless the game you want to work with is fully up to date. You can make sure it is up to date by launching the game and quitting once you get to the main menu, or you can try to verify game files on Steam. Where do I go from here? If you want to learn about how to create content for the Source Engine in general, the main page of the Source SDK documentation is a good place to start. Bugs and Issues Read the Source SDK Release Notes for information about the latest SDK release. See the Source SDK FAQ for answers to general SDK questions. For level design and Hammer editor issues, see the Level Design FAQ. See also Cleanly reinstalling Steam List of SDKs, Authoring Tools and Workshop Tools GoldSrc Half-Life SDKThird-party: Sven Co-op SDK Source Source SDK (Installation for 2004 - 2013) · Left 4 Dead Authoring Tools · Left 4 Dead 2 Authoring Tools · Alien Swarm - SDK · Portal 2 Authoring Tools · Source Filmmaker SDK · Counter-Strike: Global Offensive Authoring Tools Third-party: Reactive Drop - SDK · SiN Episodes SDK · Zombie Panic! Source Mod Tools · The Ship SDK Source 2 Dota 2 Workshop Tools · SteamVR Workshop Tools · Half-Life: Alyx Workshop Tools · Counter-Strike 2 Workshop Tools Retrieved from "https://developer.valvesoftware.com/w/index.php?title=SDK_Installation&oldid=464832" Categories: SourceToolsSource SDK FAQHidden categories: TranslationEnglish'''
