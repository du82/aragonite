title = "Building Mods with Valve Technology - Valve Developer Community"
full_description = '''Building Mods with Valve Technology From Valve Developer Community < Ja Jump to navigation Jump to search This page needs to be translated.This page either contains information that is only partially or incorrectly translated, or there isn't a translation yet.If this page cannot be translated for some reason, or is left untranslated for an extended period of time after this notice is posted, the page should be requested to be deleted.Also, please make sure the article tries to comply with the alternate languages guide. Valveのテクノロジーを使用したMODの作成 "MOD"(他のゲームのコアテクノロジーを基としたゲーム)の作成が、新しいゲームを開発する最良の方法であることがとても頻繁にあります。Source Engine(訳注:HL2のゲームエンジンの名前)のように定評のあるゲームテクノロジーを基とすることで、チームの時間と努力をレンダリングテクノロジーやネットワークコードや衝突検知といったことではなく、クリエイティブなゲームプレイや独自のコンテントといったものに向けることができます。Source EngineとそのSDKは市場において一番効率的で、完全で強力なゲーム開発環境を提供します。そしてもしあなたがHalf-Life 2かCounter-Strike: Sourceを持っているのなら、もう既に完全なSDKを使用する権利があるのです。このSDKが自分のゲームを作るのに必要なもの全てです。 なぜSource Engineを使用するのか? Source Engineを使用してMODとして自分のゲームを作るのがなぜ理にかなっているのかを示す理由の一部を以下にあげます: Valve ValveはMODコミュニティを熱心に支援することを続けます またValveにはMODを完全な商用製品まで育てたという実績があります Source EngineとSteamはMODのことを考えて設計されました SDKは継続的にそして自動的に更新されます。新機能(例:HDRなど)も含みます 強力な(そして無料の!)コンテント開発ツールセットが同梱されています Source Engineは市場における最も柔軟で強力なエンジンです。 Source Engine/Steamプラットホームによってプレイヤー/カスタマーと直接関係を持つことができます 他の全てのアクションゲームエンジンのプレイヤーの合計を上回る大きなプレイヤーベース 一番人気のプラットホームの一部であることからMODの注目性が生まれます 巨大で、既に確立されたコミュニティとオーディエンスへのアクセス オンラインPCアクションゲームの88%を占めるSteamのゲーム 1ヶ月に約50億分のプレイヤープレイ分 50,000のゲームサーバ 常に100,000から220,000の同時接続ユーザ グラフ 付属物: Half-Life 2の作成に使われた全てのツール HL2のソースコード同梱 モデル作成を行うSoftimage XSI|EXP ハンマーマップエディタ 画像と例付きの完全なドキュメンテーション コミュニティによるチュートリアルによって詳細まで補足 FacePoser(振り付けシーン作成) Half-Lifeモデルビューワー Source Engineの力 どのカテゴリにおいてもSource Engineは業界を主導するパフォーマンスを約束します。 レンダラー マテリアルシステム 高度なキャラクタ 物理 高度なAI マルチプレイヤーネットワークコード サウンドシステム UI (Vgui) プログラミング ツール Source Engineの機能についてはここを参照してください(en)。 作成を開始しましょう! Steamを入手します SDKをSteamから入手します コミュニティに加わり、アイデアをWikiに追加し、ページで問題を議論し、メーリングリストに入りましょう 作成を開始します! Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Ja/Building_Mods_with_Valve_Technology&oldid=430548" Categories: Ja/To be translatedJa/ValveJa/SourceHidden categories: JapaneseJa/Translation'''
