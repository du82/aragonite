full_description = '''Help:Stubs From Valve Developer Community Jump to navigation Jump to search <Help:Contents This is a help pageThat means that this article contains information intended to advise or aid on the functions of the wiki, on how to use the wiki, or on general recommendations for users of the wiki. Stubs are (short) sections or articles that someone thinks should have more detail. If you come across a stub (or any other article, for that matter), and know something about the subject, you are invited to contribute to the article. If you don't already know how to edit, see Help:Contents (you need an account, which is free). For a list of all stubs, see Category:Stubs. Stubs are being treated a little differently here than at Wikipedia. There are no sub-stubs, nor stub categories—just stubs. Put {{Stub}} at the top of a page to add the stub notice, which also puts the page in the stubs category. If you're looking to help out here, the stubs category is an easy way to find articles that need to be completed. Don't fall into thinking that a page being small means it is a stub. Sometimes small pages just don't have anything else that could be added to them. In that case, don't mark them as stubs, but do consider possibly merging their content into a larger (appropriate) page. On the other end of that, a page that's large may still lack important details, which would probably make it a stub if so. See also Special:ShortPages - Lists all pages starting with the smallest. Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Help:Stubs&oldid=435998" Categories: HelpWikiHidden categories: TranslationEnglish'''
