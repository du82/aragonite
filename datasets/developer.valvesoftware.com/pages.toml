["https://developer.valvesoftware.com/wiki/Fr/Building_Mods_with_Valve_Technology"]
title = "Créer des Mods avec la Technologie de Valve - Valve Developer Community"
full_description = '''Créer des Mods avec la Technologie de Valve From Valve Developer Community < Fr Jump to navigation Jump to search Créer un "mod" (un jeu relié à un moteur et à la technologie d'un autre jeu) est très souvent la meilleure manière de créer un nouveau jeu. Lorsque vous comptez sur la technologie des jeux aussi bien établies que le moteur Source, le temps de votre équipe et l'effort peuvent être consacrées à la construction de jeu créatif et un contenu unique, plutôt que sur des choses comme la technologie de rendu ou d'un code de réseau ou de détection de collision. Le moteur Source et son SDK associées constituent la solution la plus efficace, la plus complète et la plus puissante de développement de jeux sur le marché. Et si vous possédez déjà Half-Life 2 ou Counter-Strike: Source, vous avez déjà eu accès au SDK complet. C'est tout ce dont vous avez besoin pour commencer à construire votre jeu. Pourquoi Source ? Voici quelques raisons pour que vous choisissiez le moteur Source pour créer votre jeu: Valve Valve demeure résolu à soutenir la communauté de mods. Valve a également fait ses preuves pour tourner des mods dans des produits commerciaux à part entière. Source et Steam ont été conçus pour être modulable Le SDK est mis a jour continuellement et automatiquement, incluant de nouvelles fonctions (comme le HDR(en)). Une puissante (et gratuite !) suite d'outils pour le développement est incluse. Source est simplement le moteur le plus flexible du marché. La plateforme Source/Steam vous permet d'avoir une relation directe avec vous joueurs/revendeurs. Une base de joueurs plus grande que tous les moteurs de jeux combinés La visibilité de votre mod vient en partie de la plateforme de jeux la plus populaire. Accès à une communauté énorme et établie. Les jeux Steam comptent pour 88% des jeux d'action en ligne sur PC. Approximativement 5 milliards de joueurs par mois 50,000 serveurs de jeux 100,000 à 220,000 utilisateurs simultanés à n'importe quel moment Inclus: tous les outils utilisés pour créer Half-Life 2 Code source d'HL2 inclus Softimage XSI|EXP pour créer des models L'éditeur de niveaux Hammer Complètement documenté avec des images et des exemples Complétés par des tutoriaux en la communauté FacePoser Half-Life Model Viewer La puissance du moteur source Dans chaque catégorie, le moteur Source offre des performances de pointe: Moteur de rendu Système de matériaux Personnages avancés Physique Intelligence artificielle avancée Code de réseau multijoueur Système de son Interface utilisateur (Vgui) Programmation Outils Lisez les fonctions du moteur Source . Vous êtes prêt à construire un mod ! Récupérez Steam. Installez le SDK(en). Rejoignez cette communauté(en), contribuez au Wiki, discuter des questions sur n'importe quelle page, et rejoignez la liste de mailing. Lisez les informations sur comment développer(en) des mods Source. Commencez un mod ! Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Fr/Building_Mods_with_Valve_Technology&oldid=430547" Categories: Fr/ValveFr/SourceHidden categories: FrenchFr/Translation'''
