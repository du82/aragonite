["https://developer.valvesoftware.com/wiki/Help:Templates"]
title = "Help:Templates - Valve Developer Community"
full_description = '''Help:Templates From Valve Developer Community Jump to navigation Jump to search ← Help:Contents This is a help pageThat means that this article contains information intended to advise or aid on the functions of the wiki, on how to use the wiki, or on general recommendations for users of the wiki. This article or section needs to be cleaned up to conform to a higher standard of quality.For help, see the VDC Editing Help and Wikipedia cleanup process. Also, remember to check for any notes left by the tagger at this article's talk page. A template is a wiki page created to be included in other pages. Templates usually contain repetitive material that might need to show up on a larger number of articles or pages. They are commonly used for boilerplate messages, standardized warnings or notices, infoboxes, navigational boxes, and similar purposes. They enable you to do things much faster and/or easier. Templates are used very frequently on pages, so it’s best to learn about them. When the wiki sees a template it recognizes on a page, it will automatically replace it with something else. What appears there is up to the users. Contents 1 How to use a Template 1.1 Examples 1.2 Substitution 2 Making Templates 2.1 Unnamed Parameters 2.2 Named Parameters 2.3 Default Value 2.4 Parser Functions 2.5 Documentation 2.6 Templates not updating 2.7 Template Shortcuts 2.8 Translations 2.8.1 Method One: #switch: {{language}} 2.8.2 Method Two: Strings Subpage 3 Useful Templates 3.1 Per-game Templates 3.2 Inline Note Templates 3.3 Notice Templates 3.4 Miscellaneous Templates 4 Magic Words 4.1 __TOC__ 4.2 __FORCETOC__ 4.3 __NOTOC__ 4.4 __HIDDENCAT__ 4.5 __NOINDEX__ 4.6 {{DISPLAYTITLE:title}} 5 See also How to use a Template To add a template to a page (which is called transcluding), simply type {{, the name of the template, and then }}. If you wish to add any parameters, put a | between the template's name and the }}, and define the parameters there. All parameters you define need to be separated by another |. Note:Any page can be transcluded by another one actually. A transclusion of the Main Page can be done using {{:Main Page}}, but we don't do this here because it would add all of the headlines of the Main Page to the table of contents of this page. Examples Here’s a template where we don’t define any parameters. When previewing, the expression {{Restart}} (or {{restart}}) will be replaced with the content of the page Template:Restart. If you visit it, you’ll see that it contains just those five words. {{Restart}} → Requires restart to take effect. Note:Below is an example with the sv_cheats console command, which is wrong, because it is not an entity. Please use {{Command}} for console commands. {{Ent}} can accept up to two unnamed parameters. As described on its page, the template works in a way that it will display the value of the first parameter in a monospace font and also making it a wikilink. Suppose we want a code style link to sv_cheats; To use this template, we type {{, followed by the template name which is ent or Ent, then for the first parameter we type a pipe and the value sv_cheats. If we want to, we can also specify a second parameter which (as the template specifies) will also be displayed in code style but not as a link. The order of unnamed parameters matters. If we specify no parameter, the template doesn't work as intended. {{Ent|sv_cheats}} → sv_cheats {{Ent|sv_cheats|1}} → sv_cheats 1 {{Ent}} → [[{{{1}}}|{{{1}}}]] Template:KV is one of the most common templates used to display information about a keyvalue of an entity class. It accepts multiple optional named parameters such as only and nofgd. To specify a value for those, we need to type the name of the parameter, an equals sign and then the value. Named parameters can be defined in any order. Note that we can specify both unnamed and named parameters. In the following example, we have three unnamed parameters (ammo, integer and the last one) and two named parameters (only={{css}} and nofgd=1). {{KV|only={{css}}|ammo|nofgd=1|integer|Amount of reserve ammo to be added. Fallback value is 0.}} ↓ ammo ([todo internal name (i)]) <integer> (only in ) !FGD Amount of reserve ammo to be added. Fallback value is 0. Without the |nofgd=1, the !FGD part would not have displayed. Note:Unnamed parameters can be specified like named parameters in any order, like so: {{Ent|2=1|1=sv_cheats}} → sv_cheats 1. In fact, unnamed parameters do have a name they can be defined with, namely their parameter number. This way one could also for example specify a third parameter but not a first and second. Note:When calling a template, you can always specify any number of named and unnamed parameters. The only question is whether the template regards them or not, yielding a different result or the same. By the way, specifying a parameter multiple times displays an error at the top of the page. Templates can also use templates, named nesting. Recursion is not supported, so a template cannot use itself. Substitution This is for advanced users. Instead of transcluding a template, one can choose to substitute it. Substitution will replace the wikitext of a template call with the contents of the template. Do not substitute carelessly, because the substituted wikitext will not be updated when the template is. See Wikipedia:Help:Substitution for more information. To substitute a template, transclude it like you normally would, then add subst: between {{ and the template's name. After that, click the save button and the wikitext will automatically be added. For example, if you write {{Restart}} on a page, save it, and edit the page again, you will still find {{Restart}} at the same place in the wikitext. In contrast, if you save {{subst:restart}} and edit the page again, you'll find Requires restart to take effect. instead. It can be imagined that the wiki "copy-pastes" the content over, but it does regard parameter values: {{subst:delete|This is a bad page.}} If a page is saved with this, that text will be replaced with the content of Template:Delete where every occurrence of {{{1}}} is replaced with This is a bad page.: {{Delete-meta|{{#if: This is a bad page. | This is a bad page. }} }}[[Category:Candidates for speedy deletion]] Note the automatic forwarding of parameters. When substituting, the page should not appear any differently than it would if transcluded. The only difference is in the page code. Tip:When editing, be sure to make use of View Changes before saving substitutions to see what you're actually doing to the wikitext. Making Templates Before a template can be added somewhere, first its contents must be defined on its own page. Template pages start with the prefix Template:. See also: Help:Page Creation. Making a template like Template:Restart is rather easy: Enter Template:Restart in the search bar in the top right, click on its red link (assuming the page doesn't exist yet), type the text you want, and save it. After that, this new template can be used as described above. Tip:When making templates, you may want to space out your code to make it easier to read, but watch out for unintentional whitespace, especially newlines. HTML comments (<!-- -->) can also be useful. Note:Named parameters (such as {{{title}}}) will have leading and trailing whitespace trimmed in the template's result, unnamed parameters (such as {{{1}}}) will not. Unnamed Parameters To add an unnamed parameter, simply put {{{1}}} wherever you want the value of the first unnamed parameter to be. Here's a part of the code for Template:Tip: Tip:{{{1}}} If you've seen this template before you know that it has its own special look, but this is all we will look at for now. All the user has to do when transcluding this is enter the text they want: {{Tip|Do not carve without vertex editing afterward.}} ↓ Tip:Do not carve without vertex editing afterward. If you want to add more than one unnamed parameter, simply change the number. Here's the old (condensed) code for Template:Distinguish. This template has some things we haven't talked about yet, but you can still see that there's four unnamed parameters used: {{{1}}}, {{{2}}}, {{{3}}}, and {{{4}}}. :''Not to be confused with [[:{{{1}}}]]{{#if:{{{2|}}} |{{#if:{{{3|}}} |, [[:{{{2}}}]]| or [[:{{{2}}}]].}}|.}}{{#if:{{{3|}}} |{{#if:{{{4|}}} |, [[:{{{3}}}]]|, or [[:{{{3}}}]].}}}}{{#if:{{{4|}}} |, or [[:{{{4}}}]].}}'' All the user has to do when transcluding is this: {{Distinguish|Combine|Civil Protection|Overwatch}} ↓ Not to be confused with Combine, Civil Protection or Overwatch. Named Parameters Usually you would want to have named parameters affect anything only if they are defined when being transcluded. We'll talk about conditions later. For now, let's look at Template:IO, which has many named parameters. In this template, {{{param}}} marks a place to add wikitext that's defined by |param=texthere when transcluding. With named parameter: {{IO|SetString|Updates the string.|param=string}} ↓ SetString <string> Updates the string. Without named parameter: {{IO|SetString|Updates the string.}} ↓ SetString Updates the string. Important:Unnamed parameters don't strip leading and trailing whitescape Example of unnamed: {{Note| test }} result: Note: test Example of named: {{Note|1 = test }} result: Note:test Default Value To make a parameter have a value by default, add a | to the right of the parameter name, and then define the default value. Both named and unnamed parameters can use this. This would set the value for {{{1}}} to 3000 if the user does not specify it. {{{1|3000}}} This returns the empty string if the user does not specify |value=.... Note the difference between {{{value}}} and {{{value|}}}. The former would literally return the text {{{value}}} if the user doesn't define it. {{{value|}}} Note:Specifying a default value for a parameter applies only to that specific occurrence of the parameter. If you have multiple occurrences of {{{1}}} and all of them should have the default value of 0, then you must type {{{1|0}}} for all of them. On the other hand, this allows you to use different default values at different occurrences, if appropriate. Parser Functions To make text (dis)appear only if a certain parameter is defined or set to a specific value, the following expressions are the way to go. The parser function #if: checks if a string is empty or not. The syntax is {{#if: <string> | <then> | <else> }}. This expression evaluates to <then> iff <string> is not the empty string, otherwise to <else>. The <else> value can be omitted in which case it defaults to the empty string; The same applies to the following <else>s. {{#if: | Not empty | Empty }} → Empty {{#if: X | Not empty | Empty }} → Not empty {{#if: | Not empty }} → {{#if: X | Not empty }} → Not empty {{#if: {{{target|}}} | Target aqcuired | Sleep mode activated... }} → Sleep mode activated... {{#if: Something is there! | Target aqcuired | Sleep mode activated... }} → Target aqcuired Note:The expression {{{target|}}} returns the empty string because you (probably) are not viewing this page through a transclusion, so it's never had a chance to be defined and thus returns its default value being the empty string. #ifeq: checks for equality between two strings. The syntax is {{#ifeq: <string1> | <string2> | <then> | <else> }}. This evaluates to <then> iff the two (trimmed) strings are entirely equal, otherwise to <else>. {{#ifeq: X | X | Equal | Not equal }} → Equal {{#ifeq: X | Y | Equal | Not equal }} → Not equal {{#ifeq: {{{target|}}} | friend | Friend... | Go away! }} → Go away! {{#ifeq: friend | friend | Friend... | Go away! }} → Friend... #switch: checks for equality between an input string and multiple strings. The syntax is {{#switch: <input> | <string1> = <value1> | <string2> = <value2> | ... | #default = <default> }}. This statement evaluates to the corresponsing <valueX> of the first <stringX> that equals the <input>. If that <stringX> is not followed by an equals sign such that there is no <valueX>, then the <valueY> of the next <stringY> that does have an equals sign is used instead. If no equality is found, <default> is returned which defaults to the empty string if not specified. #expr: solves math problems. See Help:Calculation for all it's abilities. If an error occurs, a string within a <strong class="error"> element is returned. {{#expr: 2 + 2}} → 4 {{#expr: cos(pi/3)^2}} → 0.25 {{#expr: 0 and 1 or 1}} → 1 {{#expr: 1 + }} → Expression error: Missing operand for +. {{#ifeq: {{#expr: 1 + }} | 1 | True | False}} → False #ifexpr: tests whether a math expression is true or false and can returns different values depending on it. {{#ifexpr: 6 + 3 = 9 | Right | Wrong }} → Right {{#ifexpr: 6 + 3 = 63 | Right | Wrong }} → Wrong Warning:When passing parameters to the expression, pay attention not to get errors if the parameter is empty. For example, if an integer parameter should behave like 0 if it is left empty, add a decimal point because . is converted to the same zero as 0.. For example, use {{{hl2|0}}}. instead of {{{hl2|0}}} because the latter may fail if hl2= is specified: {{#ifexpr: 1 or . | True | False}} → True {{#ifexpr: 1 or | True | False}} → Expression error: Missing operand for or. lc: and uc: convert a string to lower case or upper case. Note that these don't have a hash sign as opposed to #if: and so on. There is also lcfirst: and ucfirst: that only manipulate the first character of the expression. {{lc:Case Sensitivity}} → case sensitivity {{uc:Case Sensitivity}} → CASE SENSITIVITY {{lcfirst:Case Sensitivity}} → case Sensitivity See also: Help:Extension:ParserFunctions Documentation Please give a description of what your template does, and especially examples. To keep describing text from appearing on pages that use the template or to make the template page itself look cleaner, there are three different HTML tags you can use. <noinclude>...</noinclude> prevents wikitext from from being transcluded to other pages. It will show only on the template's page. <onlyinclude>...</onlyinclude> makes only wikitext inside it appear on destination pages. Everything else is not transcluded but will still appear on the template's page. <includeonly>...</includeonly> prevents wikitext inside from appearing on the template's page. It has no effect on the destination page. So you can either surround everything that should be transcluded with <onlyinclude> or surround everything else with <noinclude>. In addition, you can use <includeonly> to hide the template text on the template page. The tags can sound very confusing at first. If you're confused on how to use them, check the source code for a template, because almost all use them for one purpose or another. If the documentation cannot be kept short, then it is a good idea to move all explanations and/or examples to an own page. By convention, the documentation page of a template should be its subpage /doc. For instance, Template:Note has its documenta'''
