title = "Building Mods with Valve Technology - Valve Developer Community"
full_description = 'Building Mods with Valve Technology From Valve Developer Community < Ko Jump to navigation Jump to search "개조 게임"(다른 게임의 핵심 기술을 사용하는 게임)을 만드는것은 새로운 게임을 개발하는 가장 좋은 방법입니다. 여러분이 잘 확립된 소스엔진의 게임 기술을 사용한다면, 여러분의 팀은 렌더링 기술이나 네트워크 코드나 충돌 감지보다 게임 플레이와 독창적인 컨텐츠를 만드는것에 시간과 노력을 더 보낼수 있습니다. 소스엔진과 연계된 SDK는 어떠한 게임 개발 패키지 시장에서 보다 능률적이고, 완벽하며, 가장 강력합니다. 게다가 여러분이 이미 하프라이프2나 카운터 스트라이크: 소스를 갖고 계신다면, 이미 모든 SDK를 갖고 있는겁니다. 그게 여러분의 게임을 만드는데 필요한 모든것입니다. Contents 1 왜 소스엔진을 사용해야 하나요? 2 Valve 3 소스와 스팀은 모드를 염두에 두고 설계되었습니다 4 다른 모든 액션 게임 엔진의 사용자의 합보다 많습니다 5 아래의 하프라이프2 개발에 사용된 모든 툴이 포함되어 있습니다. 6 소스엔진의 힘 7 여러분은 만들 준비가 되었습니다! 왜 소스엔진을 사용해야 하나요? 여러분의 개조게임을 소스엔진으로 만들어야 하는 합당한 이유가 아래에 나열되어 있습니다. Valve Valve는 아직까지 개조 게임 커뮤니티를 지원합니다. 게다가 Valve는 개조 게임을 실제 상용성있는 제품으로 만든 전적이 있습니다. 소스와 스팀은 모드를 염두에 두고 설계되었습니다 SDK는 계속 자동적으로 새로운 기능(예를 들어 HDR)과 함께 상향됩니다. 강력한 콘텐츠 개발툴이 함께 세트로 들어있습니다.(게다가 무료입니다!) 소스는 현 시장중 가장 간단하고 유연하며 강력한 엔진입니다. 소스/스팀 플랫폼을 통해 여러분은 사용자/고객과 직접적인 소통을 할 수 있습니다. 다른 모든 액션 게임 엔진의 사용자의 합보다 많습니다 가장 인기있는 플랫폼은 개조 게임의 가시성이 한 부분이 될 수 있습니다. 크고 탄탄한 커뮤니티와 방문객들이 있습니다. 스팀의 게임중 온라인 PC 액션 게임이 88%를 차지하고 있습니다. 한달에 대략 50억명의 플레이어가 분당 접속합니다. 게임 서버가 50,000개 입니다. 동시 접속자가 100,000 에서 220,000입니다. 아래의 하프라이프2 개발에 사용된 모든 툴이 포함되어 있습니다. 하프라이프2 소스코드 모델 제작을 위한 소프트이미지 XSI|EXP 해머 레벨 에디터 이미지와 예제를 포함한 모든 문서들 커뮤니티의 깊이 있는 튜토리얼로 자습도 가능합니다. 얼굴표정툴 하프라이프 모델 뷰어 소스엔진의 힘 모든 범주에서, 소스엔진은 업계 최고의 퍼포먼스를 보장합니다. 렌더러 재질 시스템 발전된 문자열 물리 발전된 인공지능 멀티플레이어 네트워크 코드 소리 시스템 유저 인터페이스 (Ygui) 프로그래밍 툴 소스 엔진의 기능(en)문서도 같이 읽어보세요. 여러분은 만들 준비가 되었습니다! Steam로 가세요. SDK(en)를 받으세요. 이 커뮤니티에 참여하시고(en), 이 위키에 여러분의 생각을 더하고, 어떤 문서의 문제에 대해 토의도 해보며, 메일링 리스트에도 참여하세요. 소스 개조의 개발 방법(en) 문서를 읽어보세요. 시작입니다! Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Ko/Building_Mods_with_Valve_Technology&oldid=430549" Categories: Ko/ValveKo/SourceHidden categories: KoreanKo/Translation'
