title = "Half-Life SDK - Valve Developer Community"
full_description = '''Half-Life SDK From Valve Developer Community Jump to navigation Jump to search <GoldSrc Todo: Add links to applicable TWHL Wiki pages on various GoldSrc pages, such as entity pages, as that wiki is more up-to-date and verbose for GoldSrc content. The Half-Life SDK is the set of tools needed to create content for GoldSrc. On 30th August 2013, the Half-Life SDK was finally added to Steam in the 'Tools' section. You can now create and compile Half-Life and other GoldSrc mods for Windows, macOS and Linux as a result of the SteamPipe updates. About GoldSrc · Download and Installation · Frequently Asked Questions · Release Notes Modding Creating, organizing and releasing your GoldSrc project. Level Design Maps are the 3D worlds where everything comes together. Programming A mod's C++ code defines the way its world and game rules behave. Modeling Models are the detailed 3D objects that appear in the game world. Textures Textures are used to add additional 2-dimensional detail to a map or model. Sounds Quality audio adds a fourth dimension to your world. Sprites Effects like smoke, sparks, blood and fire are created with sprites. Tutorials Step-by-step guides on a variety of topics. Technical In-depth discussion on the GoldSrc Engine's features. Glossary Explanations for terms you may encounter. Official Tools Official tools made by Valve for their games. Third-Party Tools Useful developer tools created by the community. List of SDKs documentation index GoldSrc Half-Life SDK Source Source SDK Source 2 Source 2 Documentation (all games in general) Workshop Tools: Dota 2 Workshop Tools · SteamVR Workshop Tools · Half-Life: Alyx Workshop Tools · Counter-Strike 2 Workshop Tools Retrieved from "https://developer.valvesoftware.com/w/index.php?title=Half-Life_SDK&oldid=463478" Categories: GoldSrcHalf-LifeGoldSrc ToolsHalf-Life SDKEntry pagesHidden categories: TranslationEnglishTODO rev year 2025Official GoldSrc Tools'''
