title = "GoldSrc - Valve Developer Community"
full_description = '''GoldSrc From Valve Developer Community Jump to navigation Jump to search id Tech 2 ▶ GoldSrc ▶ Source ▶ Source 2 GoldSrcScreenshot in-game of Half-Life, using the GoldSrc Engine. Developer(s) Valve Corporation Release date(s) November 19, 1998 Platform(s) Windows, macOS, Linux, Xbox, PlayStation 2 Written in C++, C, Assembly language SDK Half-Life SDK License Proprietary (source code available for non-commercial purposes) Links GitHub page(SDK v2.5 source code & bug reports)SDK v2.4 on GitHub (steam_legacy branch) GoldSrc tutorials on TWHL Successor Source GoldSrc (also known as GoldSource, and formerly just the Half-Life Engine) is a 3D video game engine created by Valve in 1996. It was the driving force behind many famous games of the late 90s and early 00s, such as Half-Life, Team Fortress Classic, Counter-Strike, and Day of Defeat. GoldSrc is a heavily modified version of the Quake engine and runs on C++ (with some "C" code). GoldSrc and its level editor, Valve Hammer Editor, were released by Valve for public use, making it the source of countless community-made modifications. GoldSrc was replaced by its successor, Source, in 2004, which currently holds first place as the choice engine for Valve modders. Though GoldSrc is past its prime, many gamers and some third-party developers still seek to use it for mods and level design. The engine is actively being updated and maintained by Valve as of 2023, recently with the Half-Life's 25th-anniversary updates which increased the engine limits and fixed many bugs. Screenshot in-game of Half-Life: Blue Shift, using stencil Shadows. Screenshot in-game of Cry of Fear, which runs on a heavily modified version of GoldSrc. Screenshot in-game of Counter-Strike: Condition Zero, using detail textures and higher-definition player models. In-game screenshot of Counter-Strike on Xbox. Contents 1 Features 1.1 Renderer 1.1.1 Since 2013 SteamPipe Update 1.1.2 Since 25th Anniversary 1.2 AI 1.3 Sound System 1.4 UI 1.5 Programming and Platforms 1.6 Tools 1.7 Other 1.7.1 Since 25th Anniversary 2 Versions and forks 3 Half-Life SDK 4 Products using GoldSrc 4.1 Officially Licensed 4.2 Modifications 5 Specifications 6 Bugs and Limitations 7 Trivia 8 See also 9 External links 10 References Features Todo: expand here or add links Renderer GoldSrc has two in-game renderers Software Renderer and OpenGL (previously three as Direct3D 6 support was removed in the 2013 SteamPipe Update) both renderers have differences. Colored lighting - Quake simply had monotone lighting Transparent textures - Glass can now be used in maps Transparent Water Water ripple Water waves Dynamic iris simulation - adjust screen brightness automatically. A feature similar to Source's HDR Rendering. (only in ) Texture Filtering - First introduced with GLQuake, a version of Quake that runs on OpenGL. Anisotropic filtering (16x by default) supported since the 2013 SteamPipe update. Skeletal animation - allowing for more stable animation of models, compared to the vertex animation in Quake Higher poly counts - GoldSrc allows for far more detailed models than Quake HD models - Higher polygon and texture quality for in-game models. Detailed textures Bug:Detail texture rendering has been broken since the 25th Anniversary update. [todo tested in ?] Since 2013 SteamPipe Update FBO renderer - A new method of rendering the game, which allows MSAA to work with GoldSrc engine. This also allows the game to run on fullscreen in a borderless window (which also makes Alt+Tab faster), and aspect ratio that are different from your monitors, for example, 4:3 on 16:9, will not be stretched to fill the black bars. Note:You can disable the new FBO renderer using -nofbo command line, note that this will also disable MSAA. MSAA anti-aliasing - GoldSrc now natively support anti-aliasing, specifically, MSAA 4X, which is enabled by default on most modern hardwares. This will reduce the amount of jagged edges/staircases effect on the geometry. Support for Anisotropic filtering - Increases visual quality of textures at steep angles to the camera. GoldSrc uses 16x Aanisotropic filtering by default. Since 25th Anniversary Widescreen "Hor+" FOV Instead of cropping the image and reducing FOV when using widescreen, the image will be expanded. Shaders support (OpenGL) With shaders support, it also fix the issues with overbright lighting not working under OpenGL. Dynamic Shadows Note:This feature was originally from GLQuake. To enable Dynamic Shadows r_shadows must be set to 1 Software Renderer support on Linux AI AI flocking - NPCs can group together, seen with Houndeyes. Scripted sequences - Used extensively to tell Half-Life's story. Player Bots - play multiplayer offline with bots. (only in ) Sound System Use Miles Sound System middleware (since 2001) Used for in-game voice chat feature, and later for MP3 playback (MP3 playback previously undocumented and unused on WON version but later used in Steam version of GoldSrc since 2003). Supports MP3 (since 2003), WAV audio files, aswell as CD audio. Hardware accelerated audio (A3D/EAX) - improves DSP sound effects (such as removing echo's buzzing noises), and add surround sounds support (Removed since 2013 SteamPipe update). Requires Sound Blaster-compatible (or A3D-compatible) sound cards (but can be bypassed using workaround below). While support for A3D/EAX was removed in most GoldSrc games since SteamPipe update (but can be restored using MetaAudio, which requires disabling VAC to work), there are some GoldSrc games that still support A3D/EAX. However, starting with Windows Vista or later, it requires an workaround to enable A3D/EAX audio. UI VGUI2 - Introduced in 2003 update (Steam), Valve's custom GUI interface mimics most of the Windows controls. This will allow the game to switch between the game and the menu quicker, without switching resolutions to 640x480, which adds delay. Programming and Platforms GoldSrc supports various platforms, such as Windows, macOS and Linux, aswell as consoles (PlayStation 2, Original Xbox). All, or most of the engine code written on C/C++ using Visual Studio 2010, and 2019 (since 25th anniversary) or later. Tools Hammer 3.x (formerly Worldcraft) WYSIWYG World editor Create world brushes Place AI NPCs Place triggers, clip brushes, logic, etc. Allows level designer to hook up I/O between entities to control AI within the game Note:While it's functional, it is recommend to use modern third-party alternatives (such as J.A.C.K.) instead. Half-Life Model Viewer Full model previewer Rotate models in any direction Set up hit boxes View physics hull View normals Wireframe, shaded or textured view modes StudioMDL Model compiler QCSG, QBSP2, QRAD, VIS Map compilation tools (bsp, lighting and visibility) Note:It is recommend to use ZHLT, VHLT and derivatives map compilation tool (HLCSG, HLBSP, HLVIS, HLRAD) instead, as some of the tools are bugged, especially QRAD which requires light_environment on every PVS. Other In-game advertisements ( Counter-Strike, removed since SteamPipe) - Introduced in 2007. Since 25th Anniversary Increased engine limits - Valve has increased engine limitations, allowing for more entities and detailed maps. func_vehicle entity support from Counter-Strike Native Steam Deck support Steam Input support - Steam Input support was added, which allows the game to support more controllers and buttons. VGUI menu can be navigated using the controller. Versions and forks This article or section needs to be cleaned up to conform to a higher standard of quality.For help, see the VDC Editing Help and Wikipedia cleanup process. Also, remember to check for any notes left by the tagger at this article's talk page. Click here to edit this list. Year Version Company Features Base Notes 1998 [Clarify] v1.0.x.x/SDK v1 Valve Software Per-texture palettesColored lightingSkeletal ModelsSupport for HW accelerated audio (EAX/A3D) Quake (id Tech 2) v30 .bsp, v10 .mdl 2000[Clarify] v1.1.x.x/SDK v2.0 Valve Software VGUIPrediction-based NetworkingMiles Sound System (since 2001) v1.0.x.x/SDK v1 v30 .bsp, v10 .mdl 2001 (leak)[Clarify] Dreamcast Captivation Digital Laboratories Gearbox Software Compressed model textures v1.0.1.3/SDK v1 v30 .bsp, v11 .mdl 2001 PlayStation 2 Gearbox Software LOD models Dreamcast[citation needed] v40 .bs2, v10 .dol 2002 007: Nightfire Gearbox Software Direct3D 8 rendererMSAA support v1.1.x.x/SDK v2.0 (For PC)[citation needed] v42 .bsp, v14 .mdlConsole version uses custom in-house engine while PC version uses heavily modified GoldSrc. 2003 Xbox Ritual Entertainment Turtle Rock Studios Improved lightingDynamic iris simulation (HDR-like brightness adjust) Counter-Strike: Condition Zero engine branch earlier version[citation needed] v30 .bsp, v11 .mdl, .sxwad format instead of wad 2003 Counter-Strike Neo engine branch Namco Heavily modified OpenGL RendererNative linux support v1.1.x.x/SDK v2.0 Confirm:only for ver.1Counter-Strike: Condition Zero engine branch (ver.2)[citation needed] v30 .bsp, v10 .mdl [confirm] 2003 Day of Defeat Valve Software VGUI2Widescreen resolution support v1.1.x.x/SDK v2.0 v30 .bsp, v10 .mdl 2003 Steam Valve Software Turtle Rock Studios Gearbox Software[citation needed] Ritual Entertainment Detail texturesRemoved support for WON (World Opponent Network) v1.1.x.x/SDK v2.0[confirm] v30 .bsp, v10 .mdl [confirm]Starting with this version, game files are no longer packaged inside .pak files, and instead either stored directly on filesystem, or stored in .gcf files prior to SteamPipe. 2013 2013 SteamPipe (SDK 2.4) Valve Software Linux and Mac supportFBO rendererMSAA (4X) supportRemoved support for EAX/A3D surround sound and Direct3D 6 renderer Steam v30 .bsp, v10 .mdl 2013 Cry of Fear engine branch Team Psykskallar Improved Paranoia's OpenGL Renderer Steam/ Paranoia HLSDK fork[3] v30 .bsp, v10 .mdl [confirm] 2016 Svengine Sven Co-op Team AngelScriptFMOD audio (restores EAX/surround sound features)Extended engine limits 2013 SteamPipe v30 .bsp, v10 .mdlSignificantly modified with extended engine limits and scripting using AngelScript. 2023 25th anniversary, aka HL25 (SDK 2.5) Valve Software Increased engine limitSteam InputShadersHigh-DPI support for VGUIWidescreen (Hor+) FOVWebM 2013 SteamPipe v30 .bsp, v10 .mdlIntroduced with Half-Life 25th Anniversary Update, fixing various bugs and increased engine limit. The HLSDK was later updated with code introduced with said update. Half-Life SDK Main article: Half-Life SDK Todo: when were SDK 2.1, 2.2, and 2.3 released? As of August 2013, it is available on Steam under the "Tools" section. With it comes Hammer 3.4, the 3ds Max sources for many cut and retail NPCs as well as player and weapon models, tools for packing textures into WADs, and detailed documentation on implementing baseline features such as voice chat into a mod. The full source code for Half-Life SDK (2.5), which contains changes from Half-Life 25th anniversary update, can be found on Valve's GitHub Page. Source code for previous version (SDK 2.4) can be found here. Note: Hammer 3.5 is the final GoldSrc-only editor released by Valve and can be downloaded separately, such as through the Sven Co-op SDK. Products using GoldSrc This is the list of games that uses the GoldSrc engine. Officially Licensed Click here to edit this list. Year Title Developer(s) Publisher(s) Platforms Notes 1998 Half-Life Valve Sierra Entertainment (retail)Valve (digital) PC: Windows, Mac, Linux Console(s): PlayStation 2, Dreamcast (cancelled) First official game to use the GoldSrc engine. The Mac port (for Mac OS 9, OS X on PowerPC systems) by Logicware was originally cancelled in 2000 before it's was silently released for Intel Macs running OS X/macOS in 2013 by Valve.The game received a major update in November 17, 2023, for it's 25th anniversary, which fixes tons of bugs, added new maps and content and increased engine limits. 1999 Half-Life: Opposing Force Gearbox Software, Valve PC: Windows, Mac, Linux First official expansion for Half-Life. Team Fortress Classic Valve PC: Windows, Mac, Linux Remake of Quake mod, Team Fortress in GoldSrc engine. 2000 Counter-Strike Valve Sierra Entertainment (retail)Valve (digital) PC: Windows, Mac, Linux Originally was an Half-Life mod, it was later available to purchase separately from Half-Life. The game later become popular when it was released and kick-start several tournaments involving Counter-Strike games. Gunman Chronicles Rewolf Entertainment Sierra Entertainment PC: Windows Ricochet Valve Valve PC: Windows, Mac, Linux 2001 Deathmatch Classic PC: Windows, Mac, Linux Half-Life: Blue Shift Gearbox Software, Valve Sierra Entertainment (retail)Valve (digital) PC: Windows, Mac, Linux Console(s): Dreamcast (cancelled) Second official expansion to the original Half-Life, as well was set hours earlier and during the event of Half-Life. Players play as Barney Calhoun, who later returned in Half-Life 2 series. Half-Life: Decay Gearbox Software Sierra Entertainment Console(s): PlayStation 2 Half-Life last expansion, exclusive to PlayStation 2. An unofficial port of Half-Life Decay for PC developed by Hoaxer, was released in 2008. James Bond 007: Nightfire Gearbox Software (PC) Electronic Arts PC: Windows, Mac (PowerPC) Highly modified engine with MSAA support (up to 8X) and Direct3D 8 (DX8). The console version was developed by Eurocom and uses an entirely different engine. Is the only GoldSrc game to be ported to PowerPC-based Mac (Half-Life port to PPC Mac was cancelled). 2003 Day of Defeat Valve Activision, Valve (digital) PC: Windows, Mac, Linux Counter-Strike (Xbox) Ritual Entertainment, Turtle Rock Studios Xbox Game Studios (formerly Microsoft Studios) Console(s): Original Xbox Counter-Strike Neo Namco Namco PC (Arcade) 2004 Counter-Strike: Condition Zero Condition Zero Deleted Scenes Valve, Ritual Entertainment, Gearbox Software, Turtle Rock Studios Sierra Entertainment, Valve (digital) PC: Windows, Mac, Linux Last Valve game to be developed on GoldSrc engine (CS Online and Nexon Studio does not count). 2008 Counter-Strike Online Valve, Nexon Nexon PC: Windows Free to play game based off Counter-Strike: Condition Zero with micro-transcations and skins, as well as many other game modes like Zombies.This version doesn't require Steam, and is only available in Asia. The console commands has been restricted to only some commands to prevent cheating and other exploits. 2012 (Mod)2013 (Steam) Cry of Fear Team Psykskallar Team Psykskallar PC: Windows Runs on older (pre-Steampipe), but highly modified version of GoldSrc (Steam 2003-2012, while using Paranoia OpenGL renderer), featuring better graphics. Standalone mod. 2014 Counter-Strike Nexon Valve, Nexon Nexon PC: Windows Last officially licensed game to use the GoldSrc engine. Worldwide (America, Europe) version of Counter-Strike Online. Originally called as Counter-Strike: Nexon Zombies. 1999 (Mod)2016 (Steam) Sven Co-op Sven Co-op Team Sven Co-op Team PC: Windows, Ma'''
