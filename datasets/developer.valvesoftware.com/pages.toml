["https://developer.valvesoftware.com/wiki/Source_Engine_Features"]
title = "Source Engine Features - Valve Developer Community"
full_description = "Source Engine Features From Valve Developer Community Jump to navigation Jump to search For Source 2 engine features, see Source 2 - Features section. The Source Engine in action. Rendering System Source features fast, reliable and flexible technology to render computationally intensive game environments. The highest-performing shader-based rendering available to game developers helps you quickly produce even the most complex scenes quickly and efficiently. Source’s renderer utilizes advanced processor technologies such as multi-core and SIMD, as well as the latest GPU features via DirectX (Direct3D), OpenGL or Vulkan, to bring your vision to life in vibrant detail. Contents 1 Rendering System 1.1 Advanced Shader Technology 1.2 Dynamic Lighting and Shadows 1.3 Effects 1.4 Materials 2 Modeling and Animation 2.1 Advanced Character Meshes 2.2 Advanced Animation Tools 3 Environments 4 Physics 5 Game Mechanics 6 Programming 7 Audio 8 Networking 9 Console Support 10 Source SDK 11 Printable Feature List 12 Licensing Advanced Shader Technology Support for HLSL shaders. Author shaders for the Direct3D pipeline using up to Shader Model 3.0. Support for Shader Model 4.0, 5.0 or higher is also supported with Direct3D 11, 12 or higher (Example: Titanfall branch). Advanced Shader Library. Use Valve’s existing shader library or augment with your own algorithms. Existing techniques include all manner of sophisticated lighting effects from the non-photorealistic rendering (NPR) style of Team Fortress 2 to the hyper-realistic look of the Half-Life 2 episodes—all in one engine. LOD on Models and World. Achieve maximum performance on all levels of hardware with automatic management of geometric Level of Detail (LOD). Alpha-to-Coverage. Enables MSAA anti-aliasing of alpha-tested primitives such as foliage, fences, and grillwork. Infinite Resolution Masking. Use distance-coded alpha masking for infinite resolution texture masking—useful for resolution-independent UI elements or any alpha-tested primitives. Dynamic Lighting and Shadows Radiosity Lighting. World geometry is lit with radiosity lighting stored in light maps or per vertex to provide immersive environments. Light maps encode directional information so that lighting combines naturally with bump maps, resulting in more accurate lighting of local surface detail, including self-shadowing. Radiosity is computed using a distributed radiosity solver (vrad) which can be deployed across your local network for rapid iteration on world lighting. High Dynamic Range (HDR) Lighting. All lighting data including light maps, environment maps and dynamic lights in the scene are computed in high dynamic range space for natural lighting. High dynamic range lighting is supported in the Source engine on all DirectX 9 or higher feature level hardware, unlike most competing engines at the time. Radiance Transfer/Indirect Lighting. Dynamic objects and characters in the world pick up bounced light computed during offline radiosity computation. This lighting effect truly grounds characters and other dynamic objects in the game world. High Performance Dynamic Shadows. Dynamic objects and characters in the world generate high performance shadows which are projected onto world geometry, providing critical lighting cues. Shadow Depth Mapping. Shadow depth textures allow for realistic self-shadowing of objects in the world, providing a more realistic and immersive effect, at a greater cost than RTT shadows. Rim Lighting. A separate rim lighting term can be used to highlight key characters, as in Left 4 Dead, or provide a stylized look, as in Team Fortress 2. Advanced Material Rendering. Apply diffuse, specular, detail, emissive, iridescent and other special effects. Effects Full Range of Special Effects . Including particles, beams, volumetric smoke, sparks, blood and environmental effects like fog and rain. Particle Effects. Source’s advanced particle system can emit sprites or models for realistic fire, explosions, snow, and more. Multi-core graphics optimizations improves particle rendering performance. Particle Editor. Edit and create particle systems with fully interactive preview and the ability to see edited systems immediately in the game. Soft Particles. Particle shaders use scene depth information to eliminate hard intersections seen in traditional particle rendering. Motion Blur. Render full-screen camera motion blur in real-time. Water. Generate realistic-looking reflective water surfaces with refraction and Fresnel effects. Materials Material System. Source defines sets of materials that specify what the object is made from and the texture used for that object. A material specifies how an object will fracture when broken, what it will sound like when struck or dragged across another surface, and what that object’s mass and buoyancy are. This system is much more flexible than other texture-only based systems. Self-shadowed Bump Maps create soft shadows and ambient occlusion with both dynamic and pre-calculated radiosity lighting. Source renders self-shadowed bump maps on both current and older-generation graphics hardware. Wrinkle Maps. Particularly useful for facial and clothing wrinkles, additional texture maps are blended in to provide dynamic surface detail in areas of models which compress and stretch. Detail Textures. Combine low frequency textures with high frequency detail to conserve video memory while maintaining apparent texture density. Versatile Multi-Texture Blending. Define blend masks with variable sharp edges, combine textures using multiple different modes, and apply per-surface color correction. Dynamic Color Correction. Interactively edit the color cast and contrast of your scene to match the desired art style. Modeling and Animation Compatibility with popular graphics and 3D modeling software lets you model realistic or highly-stylized characters, weapons, vehicles, and props within the Source environment. A robust set of tools help you efficiently rig, animate, and define physics interactions for a wide range of characters and objects. Advanced Character Meshes Create believable characters with accurate human characteristics: Simulated musculature projects character emotions, speech, and body language. Spherically-shaped eyes realistically reflect light and focus on the player/object, rather than parallel views. Language independent speech. Characters accurately and naturally lip-synch speech in any language. Improved human skin shading. Skin rendering includes natural-looking Phong shading, including a view-dependent Fresnel effect tuned for realistic human skin. Infinite Resolution Masking. Use distance-coded alpha masking for infinite resolution texture masking—useful for resolution-independent UI elements or any alpha-tested primitives. Artist Plug-ins. Streamline artist workflow by integrating Source modeling functions with familiar programs favored by creative professionals: Autodesk® Maya®, 3ds Max®, and Gmax®; SOFTIMAGE® | XSI®, Blender, LightWave 3D®, Maxon CINEMA 4D, Milkshape 3D, FragMOTION Model and Materials Compiler. Compile models and materials with the Studiomdl and Vtex tools. Model Viewer. Preview models in wireframe, shaded, or textured view modes; set up hit boxes, play animations, and fine-tune physics constraints. Advanced Animation Tools Skeletal Animation System. Articulate models with fluid and complex motion using Valve’s proprietary skeletal animation system. Facial Animation System. Valve’s proprietary facial animation system seamlessly blends a wide range of facial expressions for natural, emotion-driven speech and movement. With more than 40 distinct facial “muscles,” human characters convey the full array of human emotion and respond to the player with fluidity and intelligence. Advanced Procedural Animation Tools. Tune ragdoll, animated bone followers, and custom procedural physics controllers. Animation Blending. Seamlessly blend gestures to create continuous movement or add depth to any character situation. Layered Animation Blending. Synthesize animations out of multiple pieces. Faceposer. Easily craft speech and emotions using the Faceposer facial expression tool. Environments Valve Hammer Editor, the Source map creation tool, is an intuitive design environment for constructing level architecture (geometry, texturing, lighting); placing and scripting models, entities, and NPCs; and compiling and running game levels. Included is the VMPI tool, which greatly reduces map build time by distributing compilation across multiple PCs. Displacement Surfaces. Freely create and sculpt natural hills, valleys, trenches, slopes, and tunnels using displacement geometry brush surfaces. Transform and clip displacement surfaces using brush and vertex tools. Brush Entities. Define how objects interact with world architecture using a comprehensive inventory of brushes, including occluders, doors, triggers, area portals, soundscapes, and more. Skyboxes. Cube and environment mapping (skyboxing) extends the horizon and adds parallax on distant objects. Lighting Preview. Easily view the effects of manipulating light sources within a level. Model Browser. Integrated within the Valve Hammer Editor, the Model Browser helps you quickly find, preview, and place models. Physics Source’s highly scalable, network-enabled physics system is both processor and bandwidth efficient. Construct responsive, transformable worlds where AI characters interact with physically simulated objects, and sound and graphics follow from physics. Source’s physics features can be controlled by level design. Machinery. Construct detailed machinery with functioning mechanisms, gears, belts, and pulleys. Vehicles. Non-player characters and, in a multiplayer game, other players can come along for a ride in cars that feature realistic suspensions with springs on each wheel and wheels that slip and skid depending on the surface material. Individually tunable parameters include horsepower, gearing, max speed, shift speed, tire material, tire friction, spring tension/dampening, and more. Leaning during acceleration, deceleration, and turning enhances the realism of the driving experience. Deformable Objects. Physics-based animation simulates flexible hair and clothing and blends ragdoll physics with predefined animations. Ropes and Cables can be dynamically shaken or broken by level events. Constraint System Manager. Realistically define bone movement within a physical system using a series of constraints that enable a nearly limitless range of complex movements. Inverse Kinematics ensures that characters’ limbs correctly react to environments, such as moving around obstructions and adjusting for uneven terrain. Game Mechanics Innovative and seamless interaction between player and non-player characters is a hallmark of Source-powered games. A sophisticated AI system allows NPCs to follow players, join in the fight, or engage the player in epic non-scripted battles. AI characters can run, fly, jump, crouch, climb stairs, and burrow underground. The sophisticated Pathfinding and Navigation System features a local avoidance system to help NPCs navigate around obstacles; a path cost system for fine tuning pathfinding choices; and dynamic and level designer-controlled path connections. The system recognizes the size of creatures—knowing where they can and cannot travel—and automatically accounts for all known methods of movement. The AI Sensory System emulates human senses—vision, hearing, and even scent—to track and identify objects. The tunable system can be used for nearly limitless in-game mechanics and player challenges. AI Relationships . Set a relationship between characters—an NPC, an NPC class, or player(s)—to influence behavior and action based on a variety of entities, such as hate, like, or fear. Battle AI . Squads of AI characters can operate together and share knowledge about enemies. AI squad members track the status of each other—while one squad member is laying cover fire, another may recognize the opportunity to move or reload a nearly-empty gun cartridge. I/O System . The flexible I/O system allows level designers to control AI without touching code. Programming Authored entirely in C++, the Source engine is architected with extensibility, flexibility, and performance in mind. Licensees of Source technology have access to all of the source code that Valve uses to build the Source engine as well as our award-winning games. This allows your development staff to spend its time realizing your game design rather than starting from the scratch. Cross-platform. Target the PC, PS3 and Xbox 360 platforms from the same codebase using Microsoft Visual Studio, Mac with Xcode, Linux with GNU Compiler Collection. Multi-core. Source engine games utilize multi-core processors in both the PC, PlayStation 3 and Xbox 360, aswell as newer platforms (Xbox One, PlayStation 4, Xbox Series X/S, PlayStation 5 and Nintendo Switch) to deliver high-performance gaming experiences. Code Reuse. Easily and quickly create new game rules, AI behaviors, game objects, and more using Valve’s tested codebase as a starting point. Complete Control. Make the modifications you need for your game to any part of the codebase—Source licensees have access to it all. Efficiency . Take advantage of the memory and performance optimizations that Valve has developed for its own products. Profiling. Utilize Valve’s existing tools for monitoring video, network, and game entity performance. Presentation. Valve’s platform-independent custom GUI framework mimics most of the windows controls but is rendered using the Source engine for consistent in game and out of game UI. Audio Source includes a powerful suite of digital audio technologies to create vibrant, dynamic soundscapes within the game world. Seamlessly blend sound effects, dialogue, and music with visual elements for an intensely immersive and realistic playing experience. Threaded Sound Engine. Sound mixing processing can run on separate cores on multicore systems. Memory Management. Sounds can be asynchronously loaded, streamed, cached into a fixed pool or preloaded. Surround Sound. Support for Stereo, Headphones, 4 channel and 5.1 surround mixes. Some Source engine games (prior to Alien Swarm engine branch, and in all Titanfall branch games) also offers 7.1 surround support. Older version of Miles Audio System used in - and Left 4 Dead engine branch usually doesn't work properly with 7.1 and instead plays the audio in 5.1 only with newer version of Windows and/or some systems without some workarounds. 3D Spatialization. Apply occlusion and obstruction effects, distance, and environmental reverberation using custom 3D spatialization algorithms. DSP. A wide range of stackable preset DSP filters includes reverb, chorus, ADSR envelope, low-frequency oscillation (LFO), and low-pass, high-pass, and band-pass filters. Custom or preset DSP effects can be triggered in-game based on e"
