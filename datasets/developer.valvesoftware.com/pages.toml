title = "Counter-Strike 2 Workshop Tools - Valve Developer Community"
full_description = '''Counter-Strike 2 Workshop Tools From Valve Developer Community Jump to navigation Jump to search The Counter-Strike 2 Workshop Tools is a set of software utilities available as a free download for Counter-Strike 2 that allow you to create items for inclusion in the Steam Workshop and your own custom game addons, such as new maps. Note:Looking for Maps Workshop? See this page. Note:The Animgraph Editor is not in CS:2 and it is unknown if they will be added. Map scripting currently exists in a limited form called source_ts, which Valve uses to implement game modes such as gun game. Note:A small amount of the pages here are placeholders taken from Half-Life: Alyx Workshop Tools for now. Bug:Since the Armory Update, a newer version of the Nvidia Studio driver may cause tool crashes when trying to preview lighting or compile a map using Path Tracing. If you are experiencing crashes, you can try the stable version of the driver: Nvidia Studio 561.09 (Tue Sep 17, 2024). Confirm:RTX 50 series graphics card has been released, and it only support new driver. Is there any other workaround for these card, or whether if its not affected on RTX 50 series? (tested in: Hammer (Map Editor) on January 20, 2025 with Nvidia GeForce RTX 4060 and Windows 10 22H2 (Pro)‎) Bug:On some systems, running Counter-Strike 2 with Workshop Tools, will cause the memory usage to increase abnormally (memory leak).1 Workaround:Launch CS2 Workshop Tools (without -gpuraytracing) by going to CS2's bin\win64 directory and launch csgocfg.exe with -steam -retail -vulkan. However this will disable GPU Path Tracing option in Hammer. (tested in: Hammer on 32GB RAM, NVIDIA GeForce RTX 3060 and Windows 10 21H2 (LTSC). --leonidakarlach (talk) 23:25, 30 January 2025 (PST)) Download and Installation Introduction Introduction to using the Counter-Strike 2 Workshop Tools Level Design Creating levels for Counter-Strike 2 with the Hammer Editor Animgraph Using the Animgraph node-based animation system for Counter-Strike 2 Postprocessing Using the Postprocessing editor to add postprocessing effects to Counter-Strike 2 addons Scripting Writing scripts for Counter-Strike 2 Modeling Creating 3D models for Counter-Strike 2 Materials Creating materials for Counter-Strike 2 Weapon Finishes Introduction to creating weapon finishes for Counter-Strike 2 using the Workshop Tools Sound Adding sounds to an Addon in Counter-Strike 2 Source Filmmaker Creating videos, films and stills with Source 2 and Counter-Strike 2 Reference Reference documentation for Counter-Strike 2 Examples Example maps, prefabs and other content for Counter-Strike 2 Scripting API The Scripting API for Counter-Strike 2 Particles Creating particles with the Particle Editor for Counter-Strike 2 List of SDKs, Authoring Tools and Workshop Tools GoldSrc Half-Life SDKThird-party: Sven Co-op SDK Source Source SDK (Installation for 2004 - 2013) · Left 4 Dead Authoring Tools · Left 4 Dead 2 Authoring Tools · Alien Swarm - SDK · Portal 2 Authoring Tools · Source Filmmaker SDK · Counter-Strike: Global Offensive Authoring Tools Third-party: Reactive Drop - SDK · SiN Episodes SDK · Zombie Panic! Source Mod Tools · The Ship SDK Source 2 Dota 2 Workshop Tools · SteamVR Workshop Tools · Half-Life: Alyx Workshop Tools · Counter-Strike 2 Workshop Tools Counter-Strike 2 Note:This template is currently a work in progress. Some links may lead to CS:GO-related page with some CS2 info, and some information may not apply to CS2.Level Design Entities · Maps · Map Publishing Tool · Mapper's Reference · Places for a Navigation Mesh · Sky ListTechnical Bot Behavior Trees · Dedicated Servers · Spectator Tools · Scripting · Surface Types · Panorama API · Panorama CSS · Procedural generation · Workshop ToolsGameplay General Bugs · Particles · Soundscapes · WeaponsGame Modes Arms Race · Co-op Strike · Custom · Deathmatch · Demolition · Retakes · Weapons Expert · Wingman Retrieved from "https://developer.valvesoftware.com/w/index.ph