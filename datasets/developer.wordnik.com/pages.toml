["https://developer.wordnik.com/gettingstarted"]
title = "Getting Started With The Wordnik API"
description = "The Wordnik API: All the words"
full_description = '''Check out these helpful tips for getting started with the Wordnik API. Don't find what you need? Email us at apiteam@wordnik.com for more help! Before you can sign up for a Wordnik API key, you will need a Wordnik username (which you can get here). Once you have validated your email address, log in and sign up for an API key here. When you sign up for your key, please give us enough information to understand your use case. If you will be using the Wordnik API in an existing app or on a website, please give us an app store link or a web link. If you donate US$5 when you sign up, you will get your key within 24 hours. Otherwise, it may take up to seven days to receive your key. Please note: we are not able to send keys to mailinator addresses or addresses at other disposable-email-address domains. Wordnik API key plan limits are calculated per-minute and per hour. You can see your plan limits and your remaining calls per hour and minute in the response headers from your API call. The headers are: x-ratelimit-remaining-hour x-ratelimit-remaining-minute x-ratelimit-limit-minute x-ratelimit-limit-hour Please note: the remaining limits may not be consistent from call to call as we reconcile limits at intervals. You will never receive a lower limit than your plan allows. Wordnik uses the OpenAPI Specification to describe our API. You can explore the available calls on our docs page, here. In your language: Check out our libraries page to get help using Wordnik in the programming language of your choice. All API responses that require attribution will include an "attributionText" property in the response, as in this definition response for the word 'fragor': If your application or site uses Wordnik data in any way, you must link to Wordnik and cite Wordnik as your source. Check out our complete attribution requirements here. If you are an employer using the Wordnik API for coding tests or job applications, we'd appreciate a heads-up! This helps us offer appropriate support. You can email us at apiteam@wordnik.com with details.'''
year_published = 2025
clearnet = "https://developer.wordnik.com/gettingstarted"
