full_description = "The section names are on the left, the legally-binding language is in the middle; the human-friendly language is on the right. Questions? Please email us at apiteam@wordnik.com. The Wordnik Games Dataset (Wordnik Gameset) is a downloadable, offline dataset containing a selection of English words and related data (including, but not limited to, parts-of-speech, labels, and definitions). You are granted a perpetual, non-sublicensable right to use the Wordnik Gameset and use the Wordnik Data for your commercial and informational use in your game(s) or application(s) only in accordance with the terms of this Agreement, and any terms of service, documentation and specifications, or privacy policies provided to you by Wordnik from time to time. Wordnik may monitor Your use of the Wordnik Gameset to ensure quality, improve Wordnik products and services, and verify your compliance with these terms. You shall not interfere with such monitoring or otherwise obscure from Wordnik. The license granted to You in this Section 1 is subject to the condition that You adhere to the Wordnik Attribution Requirements below and subject to change or modification by Wordnik in its sole discretion if Wordnik Data is served in your games(s) or application(s). You can use this dataset FOREVER, as long as you follow these terms, and any clarifications we send from time to time. We may check on your use to make sure you're following our rules, and if you try to stop us, that itself breaks the rules. The most important parts here? You must not sell the dataset to anyone else, and you have to follow our attribution requirements for the data. For the purposes of this agreement, a single game is taken to mean one discrete, unique title. A single game may have multiple releases, but the title, SKU, or other identifying information will not change. E.g., a game called ‘Excellent Word Game’ in three updates (v1, v2, v3) is the same game; however a brand extension, rebranding, or re-titling (e.g., ‘Excellent Word Game: Baseball Edition’) is not considered the same game for the purposes of this license."
