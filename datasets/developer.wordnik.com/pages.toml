["https://developer.wordnik.com/faq"]
title = "Wordnik API FAQ"
description = "The Wordnik API: All the words"
full_description = '''To get a Wordnik API key, first go sign up for a Wordnik.com account, and validate your email address. Then sign up here. If you already have a paid plan, you can change your Wordnik API plan from your API dashboard. To start a paid plan, visit the Pricing page. Email us at apiteam@wordnik.com with your Wordnik username, and we'll check it out. Remember that we reserve the right to turn off keys that are exceeding our limits, that don't obey our attribution requirements, that have been accidentally or deliberately made public, or that show other signs of abuse, at our sole discretion. Absolutely. We want your product or service to be successful! We do ask that if you have a commercial app (beyond the proof-of-concept stage) that you upgrade to a paid API plan, so that we can continue to provide our API service. If you aren't sure whether or not your app qualifies, ask yourself: "Is my app or service a clone of the Wordnik API?" If not, you're probably good. Still not sure? Please email us at apiteam@wordnik.com. Users with a paid API plan can temporarily cache display text (not the raw data sent from our API) for offline use. We do not allow caching of any data with the Basic Plan. We also offer a downloadable dataset of nearly 200,000 words and definitions optimized for use in word games. You can find more information about that dataset here. Absolutely. Please send screenshots to apiteam@wordnik.com. Unfortunately, we are unable to install applications. Unfortunately we are not able to amend our terms of service for users on the Basic, Hobby, or Pro plans. Depending on the adjustment, some separate agreements may be possible for users with Enterprise plans. If you have significantly different requirements, please email us at apiteam@wordnik.com! We're happy to chat with you about raising your limits! Please email us at apiteam@wordnik.com and include a link to your app (or at least a description) and any other information you think we might need. Now that Wordnik is a non-profit we have to support our mission—to find and share data about every single word of English!—by charging for our API services.'''
year_published = 2025
