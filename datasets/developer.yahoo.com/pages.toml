["https://developer.yahoo.com/blogs/705087322584170496"]
title = "Yahoo Developer Network"
description = "Measure, monetize, advertise and improve your apps with Yahoo tools. Join the 200,000 developers using Yahoo tools to build their app businesses."
full_description = '<p>Happy Holidays! Screwdriver team is pleased to announce our newest release which brings in new features and bug fixes across various components.</p><h2><b>New Features</b></h2><p><b>UI</b></p><ul><li>Enable <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2580">deleting</a> disconnected <a href="https://href.li/?https://docs.screwdriver.cd/user-guide/configuration/externalConfig#external-config">Child Pipelines</a> from UI. This will give users more awareness and control over SCM URLs that are removed from child pipelines list.</li></ul><figure class="tmblr-full" data-orig-height="920" data-orig-width="2324"><img src="https://64.media.tumblr.com/1dd83153df672b610fe4d55997251f29/e9ffa8afba532afd-ad/s540x810/a62cedc18f978f37e2fefe40c0ac72f08eb41ced.png" data-orig-height="920" data-orig-width="2324"/></figure><p><b>API</b></p><ul><li>Cluster admins can configure <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2763">different bookends</a> for individual <a href="https://href.li/?https://docs.screwdriver.cd/cluster-management/configure-api#bookend-plugins">build clusters</a>.</li></ul><ul><li>Add more <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/pull/2784">audit logs</a> for Cluster admins to track API usage.</li></ul><!-- more --><h2><b>Bug Fixes</b></h2><p><b>UI</b></p><ul><li>Collections sorting <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2765">enhancements</a>. </li><li>Create Pipeline flow now <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2282">displays all</a> Templates properly.</li></ul><p><b>API</b></p><ul><li>Pipeline badges have been <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/pull/2789">refactored</a> to reduce resource usage..</li><li>Prevent artifact upload errors due to <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2755">incorrect retry</a> logic.</li></ul><p><b>Queue Service</b></p><ul><li>Prevent archived jobs from <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2743">running periodic jobs</a> if cleanup fails at any point.</li></ul><h2><b>Internals</b></h2><ul><li><a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2790">Update golang</a> version to 1.19 across all golang projects.</li><li>Node.js has been <a href="https://href.li/?https://github.com/screwdriver-cd/screwdriver/issues/2683">upgraded to v18</a> for Store, Queue Service &amp; Build Cluster Worker.</li><li>Feature <a href="https://href.li/?https://github.com/screwdriver-cd/queue-service/pull/60">flag added</a> to Queue Service to control Redis Table usage to track periodic builds.</li></ul><h2><b>Compatibility List</b></h2><p>In order to have these improvements, you will need these minimum versions:</p><ul><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/screwdriver">API</a> - v5.0.12</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/ui">UI</a> - v1.0.759</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/store">Store</a> - v5.0.2</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/queue-service">Queue-Service</a> - v3.0.0</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/launcher">Launcher</a> - v6.0.178</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/buildcluster-queue-worker">Build Cluster Worker</a> - v3.0.2</li></ul><h2><b>Contributors</b></h2><p>Thanks to the following contributors for making this feature possible:</p><ul><li><a href="https://href.li/?https://github.com/adong">Alan</a></li><li><a href="https://href.li/?https://github.com/banusha2">Anusha</a></li><li><a href="https://href.li/?https://github.com/klu909">Kevin</a></li><li><a href="https://href.li/?https://github.com/itleigns">Haruka</a></li><li><a href="https://href.li/?https://github.com/ibu1224">Ibuki</a></li><li><a href="https://href.li/?https://github.com/GWT5091">Masataka</a></li><li><a href="https://href.li/?https://github.com/pritamstyz4ever">Pritam</a></li><li><a href="https://href.li/?https://github.com/sagar1312">Sagar</a></li><li><a href="https://href.li/?https://github.com/tkyi">Tiffany</a></li><li><a href="https://href.li/?https://github.com/yoshwata">Yoshiyuki</a></li><li><a href="https://href.li/?https://github.com/y-oksaku">Yuki</a></li><li><a href="https://href.li/?https://github.com/yk634">Yuta</a></li></ul><h2><b>Questions and Suggestions</b></h2><p>We’d love to hear from you. If you have any questions, please feel free to reach out<a href="https://href.li/?https://docs.screwdriver.cd/about/support"> here</a>. You can also visit us on<a href="https://href.li/?https://github.com/screwdriver-cd"> Github</a> and<a href="https://href.li/?https://slack.screwdriver.cd/"> Slack</a>.</p><p><b>Author</b><br/><a href="https://t.umblr.com/redirect?z=https%3A%2F%2Fwww.linkedin.com%2Fin%2Fjithine%2F&amp;t=NzIyYTMyYTRjYjdiNGVkMzU1Y2UxNjMwMzMzYTVmN2U5YTU1OWFjNSxiZTRiMzRlY2U3MjA1MjFkMDYwNmEyYWUzYjJmMmMwZWYyMTRjMzVh&amp;ts=1672423789">Jithin Emmanuel</a>, Director Of Engineering, Yahoo</p>'
