["https://developer.yahoo.com/fantasysports/guide"]
title = "Fantasy Sports API - Yahoo Developer Network"
full_description = '''Fantasy Sports API¶ Introduction to Fantasy Sports API¶ The Fantasy Sports APIs provide URIs used to access fantasy sports data. Currently the APIs support retrieval of Fantasy Football, Baseball, Basketball, and Hockey data including game, league, team, and player information. The APIs are based on a RESTful model. Therefore, resources like game, league, team, player etc. and collections like games, leagues, teams, players form the building blocks for these APIs. Each resource is identified by a resource ID, and a collection is identified by its scope, specified in the URI. Historically, Yahoo! has provided two full draft and trade style fantasy football and baseball games – a free version, and a plus version (which contains more features and content). With the 2010 seasons, the Free and Plus versions of Football and Baseball have merged. Each game is comprised of many “leagues”, which typically contain 8-12 teams, which are managed by one or more users. At the beginning of a league’s season, professional athletes (“players”) are uniquely assigned or chosen through a draft to each team. The players that are not chosen or assigned are available to be acquired via a free-agent or waiver wire process (a “transaction”). These teams compete against each other based on statistics from real-world competitions based on categories like touchdowns, yards gained, batting average and ERA. Many fantasy sport rules can be set and changed within a league; for instance, the roster positions, statistics used to score, scoring modifiers, and game style are configurable. The game structure means that a lot of fantasy data is relevant only in the context of a particular league and team. For instance, without the league’s scoring rules, the statistics compiled by a player in a real-life competition are not meaningful to a particular league. Three rushing touchdowns by a running back is irrelevant to a league that only considers defensive players. Many leagues are private – the information about them is only available to users that are a members. Getting Started¶ OAuth¶ If you’re going to use the Fantasy Sports APIs, you’re going to have to get a bit familiar with OAuth. OAuth is the authentication mechanism for these services that allows users to grant you permission to make requests on their behalf. Many other Yahoo! services use OAuth, and thus all of the underlying details are explained in exhaustive detail in our primary OAuth documentation. Of particular interest is the OAuth Authorization Flow, which explains where each request is made and where the user needs to get involved. However, constructing OAuth flows from scratch is complicated and easy to get wrong. It’s often easier to use existing libraries, which are available for most languages on the OAuth.net Code page. Registering Your Application¶ To work with OAuth and Yahoo! services, you also must register your application with the Yahoo! Developer Network. When you register your application, you define a scope of Yahoo! services that your application will need access to, as well as the basic descriptive information that will be presented to users of your application when they’re asked to grant you permissions. You will be given a consumer key and secret value that will need to be fed into OAuth requests that you generate. You should be sure to keep these values secret, as anyone with access to them could masquerade as your application. To create a new OAuth application to use with the Fantasy Sports APIs, you should go through the New API Key flow on YDN. Be sure to specify that you need access to private user data, and select either Read or Read/Write access for Fantasy Sports. PHP Sample Code¶ Basic OAuth Library Use¶ While everyone will have their favorite language to use when writing applications using the Fantasy Sports APIs, hopefully this PHP example will still serve as a useful reference. It tries to do several interesting things: keeping track of (and potentially refreshing) access tokens for future reuse, facilitating the interactive user authentication flow, and actually making a request based on any tokens retrieved. In order to use this code, you must have the default PHP OAuth extension installed, and you will need to fill in your own consumer key and secret where specified. You should then be able to execute the PHP script from the command line. <?php // **** POTENTIAL CONFIGURATION STARTS HERE **** // NOTE: If you don't have the OAuth extension hooked into PHP, you may need // to include it here. // MODIFY: Insert whichever URL you'd like to try below. By default, the // following URL will try to pull out the NFL teams for the logged-in user $url = 'https://fantasysports.yahooapis.com/fantasy/v2/users;use_login=1/games;game_keys=nfl/teams'; $scope = 'test'; // MODIFY: Insert your own consumer key and secret here! $consumer_data = array(); $consumer_data['test']['key'] = '<INSERT CONSUMER KEY HERE>'; $consumer_data['test']['secret'] = '<INSERT CONSUMER SECRET HERE>'; // **** MAIN PROGRAM START HERE **** $consumer_key = $consumer_data[$scope]['key']; $consumer_secret = $consumer_data[$scope]['secret']; // By default, try to store token information in /tmp folder $token_file_name = '/tmp/oauth_data_token_storage_' . $consumer_key . '.out'; $access_token = NULL; $access_secret = NULL; $access_session = NULL; $access_verifier = NULL; $store_access_token_data = false; if( file_exists( $token_file_name ) && $tok_fh = fopen( $token_file_name, 'r' ) ) { $invalid_file = false; // Get first line: access token $access_token = fgets( $tok_fh ); if( $access_token ) { // Get next line: access secret $access_secret = fgets( $tok_fh ); if( $access_secret ) { // Get next line: access session handle $access_session = fgets( $tok_fh ); if( ! $access_session ) { $invalid_file = true; } } else { $invalid_file = true; } } else { $invalid_file = true; } if( $invalid_file ) { print "File did not seem to be formatted correctly -- needs 3 lines with access token, secret, and session handle.\n"; $access_token = NULL; $access_secret = NULL; $access_session = NULL; } else { print "Got access token information!\n"; $access_token = rtrim( $access_token ); $access_secret = rtrim( $access_secret ); $access_session = rtrim( $access_session ); print " Token: ${access_token}\n"; print " Secret: ${access_secret}\n"; print " Session Handle: ${access_session}\n\n"; } // Done with file, close it up fclose( $tok_fh ); } else { print "Couldn't open ${token_file_name}, assuming we need to get a new request token.\n"; } // 1. See if we have a stored access token/secret/session. If so, try to use // that token. if( $access_token ) { $o = new OAuth( $consumer_key, $consumer_secret, OAUTH_SIG_METHOD_HMACSHA1, OAUTH_AUTH_TYPE_URI ); $o->enableDebug(); $auth_failure = false; // Try to make request using stored token try { $o->setToken( $access_token, $access_secret ); if( $o->fetch( $url ) ) { print "Got data from API:\n\n"; print $o->getLastResponse() . "\n\n"; print "Successful!\n"; exit; } else { print "Couldn'\t fetch\n"; } } catch( OAuthException $e ) { print 'Error: ' . $e->getMessage() . "\n"; print 'Error Code: ' . $e->getCode() . "\n"; print 'Response: ' . $e->lastResponse . "\n"; if( $e->getCode() == 401 ) { $auth_failure = true; } } // 2. If we get an auth error, try to refresh the token using the session. if( $auth_failure ) { try { $response = $o->getAccessToken( 'https://api.login.yahoo.com/oauth/v2/get_token', $access_session, $access_verifier ); } catch( OAuthException $e ) { print 'Error: ' . $e->getMessage() . "\n"; print 'Response: ' . $e->lastResponse . "\n"; $response = NULL; } print_r( $response ); if( $response ) { $access_token = $response['oauth_token']; $access_secret = $response['oauth_token_secret']; $access_session = $response['oauth_session_handle']; $store_access_token_data = true; print "Was able to refresh access token:\n"; print " Token: ${access_token}\n"; print " Secret: ${access_secret}\n"; print " Session Handle: ${access_session}\n\n"; } else { $access_token = NULL; $access_secret = NULL; $access_session = NULL; print "Unable to refresh access token, will need to request a new one.\n"; } } } // 3. If none of that worked, send the user to get a new token if( ! $access_token ) { print "Better try to get a new access token.\n"; $o = new OAuth( $consumer_key, $consumer_secret, OAUTH_SIG_METHOD_HMACSHA1, OAUTH_AUTH_TYPE_URI ); $o->enableDebug(); $request_token = NULL; try { $response = $o->getRequestToken( "https://api.login.yahoo.com/oauth/v2/get_request_token", 'oob' ); $request_token = $response['oauth_token']; $request_secret = $response['oauth_token_secret']; print "Hey! Go to this URL and tell us the verifier you get at the end.\n"; print ' ' . $response['xoauth_request_auth_url'] . "\n"; } catch( OAuthException $e ) { print $e->getMessage() . "\n"; } // Wait for input, then try to use it to get a new access token. if( $request_token && $request_secret ) { print "Type the verifier and hit enter...\n"; $verifier = fgets( STDIN ); $verifier = rtrim( $verifier ); print "Here's the verifier you gave us: ${verifier}\n"; try { $o->setToken( $request_token, $request_secret ); $response = $o->getAccessToken( 'https://api.login.yahoo.com/oauth/v2/get_token', NULL, $verifier ); print "Got it!\n"; $access_token = $response['oauth_token']; $access_secret = $response['oauth_token_secret']; $access_session = $response['oauth_session_handle']; $store_access_token_data = true; print " Token: ${access_token}\n"; print " Secret: ${access_secret}\n"; print " Session Handle: ${access_session}\n\n"; } catch( OAuthException $e ) { print 'Error: ' . $e->getMessage() . "\n"; print 'Response: ' . $e->lastResponse . "\n"; print "Shoot, couldn't get the access token. :(\n"; } } } if( $access_token ) { // Try to make request using stored token try { $o->setToken( $access_token, $access_secret ); if( $o->fetch( $url ) ) { print "Got data from API:\n\n"; print $o->getLastResponse() . "\n\n"; print "Successful!\n"; } else { print "Couldn'\t fetch\n"; } } catch( OAuthException $e ) { print 'Error: ' . $e->getMessage() . "\n"; print 'Error Code: ' . $e->getCode() . "\n"; print 'Response: ' . $e->lastResponse . "\n"; } } // 4. Rewrite token information if necessary if( $store_access_token_data ) { print "Looks like we need to store access token data! Doing that now.\n"; $tok_fh = fopen( $token_file_name, 'w' ); if( $tok_fh ) { fwrite( $tok_fh, "${access_token}\n" ); fwrite( $tok_fh, "${access_secret}\n" ); fwrite( $tok_fh, "${access_session}\n" ); fclose( $tok_fh ); } else { print "Hm, couldn't open file to write back access token information.\n"; } } ?> Full OAuth Flow without Libraries¶ If the PHP library described above doesn’t fit your needs, you may feel like implementing the flow yourself. It’s mildly tricky and you may run into common issues like not sorting the parameters correctly, or not encoding the various parts of the URL at the right time. The following script is an example of doing absolutely everything from scratch, and may be a useful guide for you. <?php // **** POTENTIAL CONFIGURATION STARTS HERE **** // MODIFY: Insert your own consumer key and secret here! $consumer_data = array(); $consumer_data['test']['key'] = '<INSERT CONSUMER KEY HERE>'; $consumer_data['test']['secret'] = '<INSERT CONSUMER SECRET HERE>'; // **** HELPER FUNCTIONS START HERE **** /////////////////////////////////////////////////////////////////////////////// // FUNCTION _make_signed_request /// @brief Helper function to make a signed OAuth request. Only allows GET /// requests at the moment. Will add on standard OAuth params, but /// you may need to fill in non-generic ones ahead of time. /// /// @param[in] $consumer_key Application consumer key /// @param[in] $consumer_secret Application consumer secret /// @param[in] $token Token (request or access token) /// @param[in] $token_secret Token secret /// @param[in] $signature_method 'PLAINTEXT' or 'HMAC-SHA1' /// @param[in] $url URL to make request to /// @param[in] $params Array of key=>val for params. Don't /// urlencode ahead of time, we'll do that here. /////////////////////////////////////////////////////////////////////////////// function _make_signed_request( $consumer_key, $consumer_secret, $token, $token_secret, $signature_method, $url, $params = array() ) { // Only support GET in this function $method = 'GET'; $signature_method = strtoupper( $signature_method ); if( $signature_method != 'PLAINTEXT' && $signature_method != 'HMAC-SHA1' ) { print "Invalid signature method: ${signature_method}\n"; return false; } $oauth_nonce = rand( 0, 999999 ); $oauth_timestamp = time(); $oauth_version = '1.0'; $params['oauth_consumer_key'] = $consumer_key; $params['oauth_nonce'] = $oauth_nonce; $params['oauth_signature_method'] = $signature_method; $params['oauth_timestamp'] = $oauth_timestamp; $params['oauth_version'] = $oauth_version; if( $token ) { $params['oauth_token'] = $token; } if( ! $token_secret ) { $token_secret = ''; } // Params need to be sorted by key ksort( $params, SORT_STRING ); // Urlencode params and generate param string $param_list = array(); foreach( $params as $key => $value ) { $param_list[] = urlencode( $key ) . '=' . urlencode( $value ); } $param_string = join( '&', $param_list ); // Generate base string (needed for SHA1) $base_string = urlencode( $method ) . '&' . urlencode( $url ) . '&' . urlencode( $param_string ); // Generate secret $secret = urlencode( $consumer_secret ) . '&' . urlencode( $token_secret ); if( $signature_method == 'PLAINTEXT' ) { $signature = $secret; } else if( $signature_method == 'HMAC-SHA1' ) { $signature = base64_encode( hash_hmac( 'sha1', $base_string, $secret, true ) ); } // Append signature $param_string .= '&oauth_signature=' . urlencode( $signature ); $final_url = $url . '?' . $param_string; // Make curl call $ch = curl_init(); curl_setopt( $ch, CURLOPT_URL, $final_url ); curl_setopt( $ch, CURLOPT_AUTOREFERER, 1 ); curl_setopt( $ch, CURLOPT_RETURNTRANSFER, 1 ); curl_setopt( $ch, CURLOPT_FOLLOWLOCATION, 0 ); curl_setopt( $ch, CURLOPT_SSL_VERIFYPEER, 0 ); curl_setopt( $ch, CURLOPT_SSL_VERIFYHOST, 0 ); $timeout = 2; // seconds curl_setopt( $ch, CURLOPT_TIMEOUT, $timeout ); curl_setopt( $ch, CURLOPT_CONNECTTIMEOUT, $timeout ); $contents = curl_exec($ch); $ret_code = curl_getinfo( $ch, CURLINFO_HTTP_CODE ); $errno = curl_errno($ch); $error_str = curl_error($ch); if( $errno || $error_str ) { //print "Error: ${error_str} (${errno})\n"; } //print "Response code: ${ret_code}\n"; //print "Contents:\n${contents}\n\n"; curl_close($ch); $data = array( 'return_code' => $ret_code, 'contents' => $contents, 'error_str' => $error_str, 'errno' => $errno ); return $data; } /////////////////////////////////////////////////////////////////////////////// // FUNCTION oauth_response_to_array /// @brief Break up the oauth response data into an associate array /////////////////////////////////////////////////////////////////////////////'''
year_published = 2025
