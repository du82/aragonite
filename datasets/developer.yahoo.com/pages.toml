full_description = '<p>Happy Spring! The Screwdriver team is pleased to announce our newest release which brings in new features and bug fixes across various components.</p><h2><b>New Features</b></h2><p><b>UI</b></p><p><b></b></p><ul><li>UI codebase has been upgraded to use <a href="https://github.com/screwdriver-cd/screwdriver/issues/2608">Ember.js 4.4</a></li><li>Build detail page to <a href="https://github.com/screwdriver-cd/screwdriver/issues/2822">display the Template</a> in use</li></ul><figure data-orig-width="3096" data-orig-height="394" class="tmblr-full"><img src="https://64.media.tumblr.com/210114d19670f7e61e88ce83c45929ba/11f868cfe6e9aebd-8f/s540x810/24b113d5bd0ab4d6493adacec21b9fef207a47ae.png" data-orig-width="3096" data-orig-height="394"/></figure><ul><li>Links in the event label are <a href="https://github.com/screwdriver-cd/screwdriver/issues/2833">now clickable</a></li><li><a href="https://github.com/screwdriver-cd/screwdriver/issues/2836">PR title</a> shows on PR build page</li><li>Job list to display a <a href="https://github.com/screwdriver-cd/screwdriver/issues/2774">build’s start &amp; end times</a> on hover</li></ul><figure data-orig-width="3086" data-orig-height="654" class="tmblr-full"><img src="https://64.media.tumblr.com/9bc706b16524ca11bf390d2848927694/11f868cfe6e9aebd-24/s540x810/7092ce4a62755add0ec5040111df8e4a6f02626e.png" data-orig-width="3086" data-orig-height="654"/></figure><h2><b><br/></b></h2><!-- more --><h2><b>Bug Fixes</b></h2><p><b>UI</b></p><ul><li>Job list view to <a href="https://github.com/screwdriver-cd/screwdriver/issues/2773">handle job display name</a> as expected</li><li>Artifacts with <a href="https://github.com/screwdriver-cd/screwdriver/issues/2839">&amp; in name</a> are now loaded properly<br/></li></ul><p><b>API</b></p><ul><li>Fixed data loss when adding <a href="https://github.com/screwdriver-cd/screwdriver/issues/2765">Templates from multiple browser tabs</a><br/></li><li>Add API endpoints to add or <a href="https://github.com/screwdriver-cd/screwdriver/pull/2797">remove one or more pipelines</a> in a collection</li></ul><h2><b>Internals</b></h2><ul><li>Fix for Launcher putting <a href="https://github.com/screwdriver-cd/screwdriver/issues/1398">invalid characters</a> on log lines</li></ul><h2><b>Compatibility List</b></h2><p>In order to have these improvements, you will need these minimum versions:</p><ul><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/screwdriver">API</a> - v6.0.9</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/ui">UI</a> - v1.0.790</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/store">Store</a> - v5.0.2</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/queue-service">Queue-Service</a> - v3.0.2</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/launcher">Launcher</a> - v6.0.180</li><li><a href="https://href.li/?https://hub.docker.com/repository/docker/screwdrivercd/buildcluster-queue-worker">Build Cluster Worker</a> - v3.0.3</li></ul><h2><b>Contributors</b></h2><p>Thanks to the following contributors for making these features possible:</p><ul><li><a href="https://href.li/?https://github.com/adong">Alan</a></li><li><a href="https://href.li/?https://github.com/banusha2">Anusha</a></li><li><a href="https://href.li/?https://github.com/itleigns">Haruka</a></li><li><a href="https://href.li/?https://github.com/ibu1224">Ibuki</a></li><li><a href="https://github.com/kumada626">Keisuke</a></li><li><a href="https://href.li/?https://github.com/pritamstyz4ever">Pritam</a></li><li><a href="https://href.li/?https://github.com/sagar1312">Sagar</a></li><li><a href="https://href.li/?https://github.com/y-oksaku">Yuki</a></li><li><a href="https://href.li/?https://github.com/yk634">Yuta</a></li></ul><h2><b>Questions and Suggestions</b></h2><p>We’d love to hear from you. If you have any questions, please feel free to reach out<a href="https://href.li/?https://docs.screwdriver.cd/about/support"> here</a>. You can also visit us on<a href="https://href.li/?https://github.com/screwdriver-cd"> Github</a> and<a href="https://href.li/?https://slack.screwdriver.cd/"> Slack</a>.</p><p><b>Author</b><br/><a href="https://t.umblr.com/redirect?z=https%3A%2F%2Fwww.linkedin.com%2Fin%2Fjithine%2F&amp;t=NzIyYTMyYTRjYjdiNGVkMzU1Y2UxNjMwMzMzYTVmN2U5YTU1OWFjNSxiZTRiMzRlY2U3MjA1MjFkMDYwNmEyYWUzYjJmMmMwZWYyMTRjMzVh&amp;ts=1672423789">Jithin Emmanuel</a>, Director Of Engineering, Yahoo</p>'
