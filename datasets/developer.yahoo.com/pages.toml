["https://developer.yahoo.com/sign-in-with-yahoo"]
title = "Sign In With Yahoo"
description = "Sign In With Yahoo"
full_description = 'Sign In With YahooIntegration GuideOverview1. Register Your App2. Request an Authorization Code3. Request an Access Token4. Refresh Your Access TokenExamplesAndroid ExampleiOS ExampleJava ExampleNode.js ExamplePython ExampleAdditional Integration DetailsOAuth 2.0 ErrorsGet User Info APIDecoding the ID TokenSign-In ButtonRulesAdditional detailsDeveloper SupportSign In With YahooSign In With Yahoo is an easy, convenient way for your users to create an account and sign into your web or mobile app. Whether you’re a retailer looking to better engage your customers or a publisher looking to boost monetization, Sign In With Yahoo can help you enhance your user experience and derive more value from your traffic.Build trust with your user baseGive users the peace of mind of knowing that their identity is managed by a trusted provider that respects consumer privacy and choice when they see the Sign In With Yahoo button on your login page.Boost user account creationUsers can quickly and easily create an account in your web app using their Yahoo credentials without needing to fill out a registration form and remember a new password. This convenient experience can help lift your conversion rate.Increase logged in trafficUsers already signed into their Yahoo account in the same browser session can sign in with one click. Advanced account recovery services help ensure that your users don’t get locked out of their account.Re-engage your usersReach 148 million U.S. users with a validated email address from the second largest U.S. email provider. Improve newsletter open rates with the new subscriptions and shopping-focused Yahoo Mail app.Enable personalized experiences and higher quality interactionsPersonalized experiences are more engaging and lead to higher retention. Sign In With Yahoo lets you access user profile information to create more relevant content and ad experiences for your users. When users authorize your app to access their data, your app gets access to their real identity. Apps based on real identity often have less spam and foster higher quality user interactions.Enhance your existing account systemSign In With Yahoo complements your existing account system by giving users the option to sign in with their Yahoo account alongside email or other social login options. When an email address you get from Sign In With Yahoo matches one already in your system, you can sign that user into their existing account without additional passwords.Maximize your monetization of ads inventoryImprove match rates for logged in users with advertising identity products such as Yahoo ConnectID.OverviewSign In With Yahoo is a secure and convenient way for users to create an account and sign into your web or mobile app. It can be used to enable the following experiences:User Account Creation (Registration)Let users quickly and easily create an account in your web app without needing to fill out a registration form and remember a new password. This convenient experience can help lift your conversion rate.User Sign In (Authentication)Let users easily sign into your web app by entering their Yahoo account credentials. If they are already signed into their Yahoo account in the same browser session, they can sign in with one click.Private User Data Access Management (Authorization)Request permissions to access your users’ private data, which may include a validated email address to reengage them at a later date.Token Lifecycle Management for Yahoo APIsSign In With Yahoo manages the OAuth 2.0 token lifecycle, simplifying your integration with Yahoo APIs.PersonalizationPersonalized experiences are more engaging and lead to higher retention. Sign In With Yahoo lets you access user information which could be arduous to collect via your own registration form.Integration GuideThis guide provides step-by-step instructions for integrating Sign In With Yahoo to your website:Step 1. Register your application on the Yahoo Developer Network (YDN) to receive your OAuth 2.0 credentials.Step 2. Redirect the user to the /request_auth endpoint so that they may authorize access to their data.Note: After successful authentication and authorization, Yahoo redirects the user back to your application’s redirect_uri, passing an Authorization Code as a query parameter.Step 3. Exchange the Authorization Code for an Access Token, Refresh Token and ID Token using the /get_token endpoint.Note: The ID Token can be decoded to access most claims for either the profile or email OpenID Connect scopes. To access additional claims or to fetch updated user information, use the Get User Info API.Step 4. When the Access Token expires, exchange the Refresh Token for a new Access Token.<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1608px) 1608px, 100vw" decoding="async" loading="eager" src="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/7012357387221ee3e0d1ccec6ec624d5/b2f3a/flow-diagram.jpg" srcSet="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/7012357387221ee3e0d1ccec6ec624d5/a15a9/flow-diagram.jpg 402w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/7012357387221ee3e0d1ccec6ec624d5/59d20/flow-diagram.jpg 804w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/7012357387221ee3e0d1ccec6ec624d5/b2f3a/flow-diagram.jpg 1608w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Step 1.Register your application on the Yahoo Developer Network (YDN) to receive your OAuth 2.0 credentials.Note: Developers who would like access to restricted scopes (mail, contacts, calendar) must follow the instructions on the Developer Access page.You’ll need to create a Yahoo account to set up applications on the Yahoo Developer Network (YDN).After you have a Yahoo account, create an application to get your Client ID (Consumer Key) and Client Secret (Consumer Secret) for later use in the OAuth 2.0 flow.In the Create Application form, provide an application name and a callback domain (redirect URI). Yahoo will redirect your users to this URI after they authorize access to their data, so you’ll want to be the domain owner.If your application needs to access private user data from Yahoo APIs, you’ll need to request permissions in the API Permissions checklist. To request access to user profile information, check the Profile option under OpenID Connect Permissions. When your app requires a user email address, also check the Email option.At this point, you should identify your client type. Since traditional, multi-page web applications run in an environment that is controlled by the application owner, they can protect a client secret and are therefore considered confidential clients. On the other hand, mobile apps, native desktop apps, and single-page applications (SPAs) cannot protect a client secret, and are therefore considered public clients. When implementing the Authorization Code Flow in later steps, the PKCE extension is strongly recommended for confidential clients and required for public clients. For more information on the PKCE extension, click here.Finish creating your application by clicking Create App.<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1999px) 1999px, 100vw" decoding="async" loading="eager" src="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/30495c912cf50bcd00354111a82002cd/e436c/create-application.png" srcSet="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/30495c912cf50bcd00354111a82002cd/97432/create-application.png 500w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/30495c912cf50bcd00354111a82002cd/8a288/create-application.png 1000w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/30495c912cf50bcd00354111a82002cd/e436c/create-application.png 1999w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Tip: You can always go to My Apps to view your applications and OAuth 2.0 credentials.Step 2.Redirect the user to the /request_auth endpoint so that they may authorize access to their data.After you’ve created your application, you’ll be given a Consumer Key and Consumer Secret. You’ll use the Consumer Key as the client_id and the callback domain you provided as the redirect_uri.To create an authorization request, you’ll need Yahoo’s OAuth 2.0 authorization endpoint, a supported HTTP method, and the request parameters given below. Be sure to use the request parameter response_type=code to receive an ID Token, an Access Token, and a Refresh Token in Step 3.OAuth 2.0 Authorization Endpoint:https://api.login.yahoo.com/oauth2/request_authSupported HTTP Methods: GET, POSTThe request parameters below can either be transmitted in the request body using POST or as part of the query string with GET.Request ParametersDescriptionclient.id(Required) The Client ID (Consumer Key) provided to you when you created your application.redirect_uri(Required) Yahoo redirects users to this URL after they agree to use SSO and authorize access to their private data. Provide the complete URL including the HTTP/HTTPS protocol. If the user should not be redirected to your server, specify the callback as oob (out of band).response_type(Required) For the Authorization Code Flow, you must use code.scope(Required for OpenID Connect) To get an ID Token to authenticate a user, you are required to specify the scope identifier openid. For example: scope=openidAdditionally, to access private user data from the Yahoo APIs, include the relevant API scope identifiers. The scopes can be delimited by a space or comma. In the example below, the scope identifier is specified for requesting the ID Token and an Access Token that provides read access to the Yahoo Mail API:scope=openid mail-rscope=openid,mail-rcode_challenge(Required if implementing the PKCE extension) Base64-URL-encoded hash of the code verifier, an alphanumeric string of characters with a minimum length of 43 characters and a maximum length of 128 characters that needs to be dynamically generated by the client when implementing the PKCE extension.code_challenge_method(Required if implementing the PKCE extension) Method type used to generate the code challenge (e.g., S256).state(Recommended) Create a unique session token to maintain state between the request and the callback. By cryptographically binding the value of this parameter to a browser cookie, you can mitigate cross-site request forgery (CSRF, XSRF).language(Optional) Language identifier. The default value is en-us.nonce(Required) An arbitrary URL-safe string used to associate your client session with an ID Token and to mitigate replay attacks. The value is passed through unmodified from the Authentication Request to the ID Token. See Nonce Notes for more information.prompt(Optional) A string value specifying whether Yahoo prompts the user for re-authentication or consent. To prompt the user to re-authorize your application, include prompt=consent in the request. The Yahoo Consent Screen will then be displayed every time the user signs in to your application. To prompt the user to re-authenticate to Yahoo, include prompt=login in the request.This parameter can be used to make sure that the user is still present for the current session or to bring attention to the request.max_age(Optional) You can specify the allowable elapsed time in seconds since the last time the user was actively authenticated by Yahoo. If the elapsed time is greater than this value, Yahoo will attempt to actively re-authenticate the user.Sample /request_auth URL:https://api.login.yahoo.com/oauth2/request_auth?client_id=dj0yJmk9WGx0QlE0UWdCa0hKJmQ9WVdrOWNrNUhXVnBhTkhFbWNHbzlNQS0tJnM9Y29uc3VtZXJzZWNyZXQmeD01OA--&response_type=code&redirect_uri=https://yahoo.com&scope=openid%20mail-r&nonce=YihsFwGKgt3KJUh6tPs2Note: In the authorization code flow, you will only need to reauthorize access from the user in the future if the user revokes access through Yahoo account settings.Once the user authenticates, they will be presented with the Yahoo Consent Screen shown below. From the Yahoo Consent Screen, the user will be able to view the permissions you are requesting and either agree or disagree to grant those permissions.<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1250px) 1250px, 100vw" decoding="async" loading="eager" src="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/c56ff9297d8ede3d96a66a50ac8853d4/bcec5/consent-screen.png" srcSet="https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/c56ff9297d8ede3d96a66a50ac8853d4/0d080/consent-screen.png 313w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/c56ff9297d8ede3d96a66a50ac8853d4/0deab/consent-screen.png 625w,https://s.yimg.com/oo/sign-in-with-yahoo/d2a215759cadc2422a6a5d79e4f822e8798e2f35/static/c56ff9297d8ede3d96a66a50ac8853d4/bcec5/consent-screen.png 1250w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}If the user denies access to their data by clicking “Not now”, Y'
