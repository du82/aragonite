["https://developer.yahoo.com/podcasts"]
title = "Dash Open Podcast - Yahoo Developer Network"
description = "In this episode, Gil Yehuda (Sr. Director, Open Source) interviews Mujib Wahab (Sr. Director, Software Dev Engineering)and Henry Avetisyan (Distinguished Software Dev Engineer). Mujib and Henry discuss why Verizon Media open sourced Athenz, a platform for X.509 Certificate-based Service Authentication and Authorization. They also share how others can use and contribute to Athenz. Learn more at https://www.athenz.io."
full_description = "Dash Open is your place for interesting conversations about open source and other technologies, from the open source program office at Verizon Media. We are a division of Verizon and home of many leading brands including Yahoo News, Sports, Finance, Mail, TechCrunch, HuffPost, Flurry, AOL, and many more. Subscribe to learn about new episodes and let us know what you want to hear, or if you want to be featured, in an upcoming episode. Listen onApple Podcasts Listen onSoundcloud Listen onSpotify Dash Open is your place for interesting conversations about open source and other technologies, from the open source program office at Verizon Media. We are a division of Verizon and home of many leading brands including Yahoo News, Sports, Finance, Mail, TechCrunch, HuffPost, Flurry, AOL, and many more. Subscribe to learn about new episodes and let us know what you want to hear, or if you want to be featured, in an upcoming episode. In this episode, Gil Yehuda (Sr. Director, Open Source) interviews Mujib Wahab (Sr. Director, Software Dev Engineering)and Henry Avetisyan (Distinguished Software Dev Engineer). Mujib and Henry discuss why Verizon Media open sourced Athenz, a platform for X.509 Certificate-based Service Authentication and Authorization. They also share how others can use and contribute to Athenz. Learn more at https://www.athenz.io. In this episode, Ashley Wolf, Open Source Program Manager, interviews Eran Shapira, Software Development Engineering Manager, Verizon Media. Based in Tel Aviv, Israel, Eran manages the video activation team. Eran shares about his team’s focus, which technology he’s most excited about right now, the value of presenting at meetups, and his advice for being a great team member. In this episode, Rosalie Bartlett, Sr. Open Source Community Manager, interviews Shaunak Mishra, Sr. Research Scientist, Verizon Media. Shaunak discusses two papers he presented at Knowledge Discovery and Data Mining (KDD) - “Understanding Consumer Journey using Attention-based Recurrent Neural Networks” and “Learning from Multi-User Activity Trails for B2B Ad Targeting”."
year_published = 2020
clearnet = "https://developer.yahoo.com/podcasts"
tags = ["agreements", "alan", "alexa", "analytics", "apache", "athenz", "attention-based", "authn", "authz", "benefits"]
