totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Overview Run machine learning models, powered by serverless GPUs, on Cloudflare's global network. Available on Free and Paid plans Workers AI allows you to run AI models in a serverless way, without having to worry about scaling, maintaining, or paying for unused infrastructure. You can invoke models running on GPUs on Cloudflare's network from your own code — from Workers, Pages, or anywhere via the Cloudflare API. Workers AI gives you access to: 50+ open-source models, available as a part of our model catalog Serverless, pay-for-what-you-use pricing model All as part of a fully-featured developer platform, including AI Gateway, Vectorize, Workers and more... Get started Watch a Workers AI demo Custom requirementsIf you have custom requirements like private custom models or higher limits, complete the Custom Requirements Form ↗. Cloudflare will contact you with next steps. Workers AI is now Generally AvailableTo report bugs or give feedback, go to the #workers-ai Discord channel ↗. If you are having issues with Wrangler, report issues in the Wrangler GitHub repository ↗. Features Models Workers AI comes with a curated set of popular open-source models that enable you to do tasks such as image classification, text generation, object detection and more. Browse models Related products AI Gateway Observe and control your AI applications with caching, rate limiting, request retries, model fallback, and more. Vectorize Build full-stack AI applications with Vectorize, Cloudflare’s vector database. Adding Vectorize enables you to perform tasks such as semantic search, recommendations, anomaly detection or can be used to provide context and memory to an LLM. Workers Build serverless applications and deploy instantly across the globe for exceptional performance, reliability, and scale. Pages Create full-stack applications that are instantly deployed to the Cloudflare global network. R2 Store large amounts of unstructured data without the costly egress bandwidth fees associated with typical cloud storage services. D1 Create new serverless SQL databases to query from your Workers and Pages projects. Durable Objects A globally distributed coordination API with strongly consistent storage. KV Create a global, low-latency, key-value data storage. More resources Get started Build and deploy your first Workers AI application. Plans Learn about Free and Paid plans. Limits Learn about Workers AI limits. Use cases Learn how you can build and deploy ambitious AI applications to Cloudflare's global network. Storage options Learn which storage option is best for your project. Developer Discord Connect with the Workers community on Discord to ask questions, share what you are building, and discuss the platform with other developers. @CloudflareDev Follow @CloudflareDev on Twitter to learn about product announcements, and what is new in Cloudflare Workers. Was this helpful? Edit page Last updated: Feb 18, 2025 Next Get started Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
