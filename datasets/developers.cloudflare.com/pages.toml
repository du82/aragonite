title = "Network operators · Cloudflare 1.1.1.1 docs"
description = "Network operators, including Internet Service Providers (ISPs), device manufacturers, public Wi-Fi networks, municipal broadband providers, and security scanning services can use 1.1.1.1 in place of operating their own recursive DNS infrastructure."
full_description = '''Products … 1.1.1.1 Infrastructure Network operators {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/infrastructure/","name":"Infrastructure"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/infrastructure/network-operators/","name":"Network operators"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Network operators Network operators, including Internet Service Providers (ISPs), device manufacturers, public Wi-Fi networks, municipal broadband providers, and security scanning services can use 1.1.1.1 in place of operating their own recursive DNS infrastructure. Cloudflare also partners with ISPs and network equipment providers to make 1.1.1.1 for Families available within their offerings. Refer to our blog post ↗ for details. Using 1.1.1.1 can improve performance for end-users due to Cloudflare's extensive global network ↗, as well as provide higher overall cache hit rates due to our regional caches. The 1.1.1.1 resolver was designed with a privacy-first approach. Refer to our data and privacy policies for what is logged and retained by 1.1.1.1. Configuring 1.1.1.1 There are multiple ways to use 1.1.1.1 as an operator: Including a DNS over HTTPS or DNS over TLS proxy on end-user routers or devices (best for privacy). Pushing 1.1.1.1 to devices via DHCP/PPP within an operator network (recommended; most practical). Having a DNS proxy on a edge router make requests to 1.1.1.1 on behalf of all connected devices. Where possible, we recommend using encrypted transports (DNS over HTTPS or TLS) for queries, as this provides the highest degree of privacy for users over last-mile networks. Available Endpoints NoteCloudflare Zero Trust ↗ supports customizable DNS policies, analytics, additional built-in filtering categories, and custom rate limiting capabilities.If you require additional controls over our public 1.1.1.1 resolver, contact us ↗. The publicly available endpoints for 1.1.1.1 are detailed in the following table: ResolverIPv4 addressIPv6 addressDNS over HTTPS endpointDNS over TLS endpoint1.1.1.1 (unfiltered)1.1.1.1 1.0.0.12606:4700:4700::1111 2606:4700:4700::1001https://cloudflare-dns.com/dns-querycloudflare-dns.comFamilies (Malware)1.1.1.2 1.0.0.22606:4700:4700::1112 2606:4700:4700::1002https://security.cloudflare-dns.com/dns-querysecurity.cloudflare-dns.comFamilies (Adult Content + Malware)1.1.1.3 1.0.0.32606:4700:4700::1113 2606:4700:4700::1003https://family.cloudflare-dns.com/dns-queryfamily.cloudflare-dns.com You may wish to provide end users with options to change from the default 1.1.1.1 resolver to one of the 1.1.1.1 for Families endpoints. Rate Limiting Operators using 1.1.1.1 for typical Internet-facing applications and/or users should not encounter any rate limiting for their users. In some rare cases, security scanning use-cases or proxied traffic may be rate limited to protect our infrastructure as well as upstream DNS infrastructure from potential abuse. Best practices include: Avoiding tunneling or proxying all queries from a single IP address at high rates. Distributing queries across multiple public IPs will improve this without impacting cache hit rates (caches are regional). A high rate of "uncacheable" responses (such as SERVFAIL) against the same domain may be rate limited to protect upstream, authoritative nameservers. Many authoritative nameservers enforce their own rate limits, and we strive to avoid overloading third party infrastructure where possible. Help If you are a network operator and still have outstanding questions, contact resolver@cloudflare.com with your use case, so it can be discussed further. Make sure to visit 1.1.1.1/help ↗ from within your network and share the resulting report when contacting Cloudflare. Was this helpful? Edit page Last updated: Nov 27, 2024 Previous DNSKEY Next Support for IPv6-only networks Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
