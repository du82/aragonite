);Grok Grok ↗ is s a general purpose model that can be used for a variety of tasks, including generating and understanding text, code, and function calling. Endpoint https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok URL structure When making requests to Grok ↗, replace https://api.x.ai/v1 in the URL you are currently using with https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok. Prerequisites When making requests to Grok, ensure you have the following: Your AI Gateway Account ID. Your AI Gateway gateway name. An active Grok API token. The name of the Grok model you want to use. Examples cURL Requestcurl https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok/v1/chat/completions \ --header 'content-type: application/json' \ --header 'Authorization: Bearer {grok_api_token}' \ --data '{ "model": "grok-beta", "messages": [ { "role": "user", "content": "What is Cloudflare?" } ]}' Use OpenAI SDK with JavaScript If you are using the OpenAI SDK with JavaScript, you can set your endpoint like this: JavaScriptimport OpenAI from "openai"; const openai = new OpenAI({ apiKey: "<api key>", baseURL: "https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok",}); const completion = await openai.chat.completions.create({ model: "grok-beta", messages: [ { role: "system", content: "You are Grok, a chatbot inspired by the Hitchhiker's Guide to the Galaxy.", }, { role: "user", content: "What is the meaning of life, the universe, and everything?", }, ],}); console.log(completion.choices[0].message); Use OpenAI SDK with Python If you are using the OpenAI SDK with Python, you can set your endpoint like this: Pythonimport osfrom openai import OpenAI XAI_API_KEY = os.getenv("XAI_API_KEY")client = OpenAI( api_key=XAI_API_KEY, base_url="https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok",) completion = client.chat.completions.create( model="grok-beta", messages=[ {"role": "system", "content": "You are Grok, a chatbot inspired by the Hitchhiker's Guide to the Galaxy."}, {"role": "user", "content": "What is the meaning of life, the universe, and everything?"}, ],) print(completion.choices[0].message) Use Anthropic SDK with JavaScript If you are using the Anthropic SDK with JavaScript, you can set your endpoint like this: JavaScriptimport Anthropic from "@anthropic-ai/sdk"; const anthropic = new Anthropic({ apiKey: "<api key>", baseURL: "https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok",}); const msg = await anthropic.messages.create({ model: "grok-beta", max_tokens: 128, system: "You are Grok, a chatbot inspired by the Hitchhiker's Guide to the Galaxy.", messages: [ { role: "user", content: "What is the meaning of life, the universe, and everything?", }, ],}); console.log(msg); Use Anthropic SDK with Python If you are using the Anthropic SDK with Python, you can set your endpoint like this: Pythonimport osfrom anthropic import Anthropic XAI_API_KEY = os.getenv("XAI_API_KEY")client = Anthropic( api_key=XAI_API_KEY, base_url="https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/grok",) message = client.messages.create( model="grok-beta", max_tokens=128, system="You are Grok, a chatbot inspired by the Hitchhiker's Guide to the Galaxy.", messages=[ { "role": "user", "content": "What is the meaning of life, the universe, and everything?", }, ],) print(message.content) Was this helpful? Edit page Last updated: Jan 21, 2025 Previous Google Vertex AI Next Groq Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
