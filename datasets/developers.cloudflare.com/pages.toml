ing its nameservers to Cloudflare's for management. DNS address map A data structure enabling customers with BYOIP prefixes or account-level static IPs to specify which IP addresses should be mapped to DNS records when they are proxied through Cloudflare. BYOIP AI models An AI model is a trained system that processes input data to generate predictions, decisions, or outputs based on patterns it has learned. Workers AI alarm A Durable Object alarm is a mechanism that allows you to schedule the Durable Object to be woken up at a time in the future. Durable Objects allowlist An allowlist is a list of items (usually websites, IP addresses, email addresses, etc.) that are permitted to access a system. WAF anycast Anycast is a network addressing and routing method in which incoming requests can be routed to a variety of different locations. Anycast typically routes incoming traffic to the nearest data center with the capacity to process the request efficiently. Magic WAN apex domain Apex domain is used to refer to a domain that does not contain a subdomain part, such as example.com (without www.). It is also known as "root domain" or "naked domain". DNS API call Also known as an API request. An API call is a message sent to a server asking an API to provide a service or information. API Shield API endpoint The API endpoint is the location where API calls or requests are fulfilled. API Shield defines endpoints as a host, method, and path tuple. API Shield API key An API key is unique to each Cloudflare user and used to confirm identity when using the Cloudflare API. Fundamentals API schema The API schema defines which API requests are valid based on several request properties like target endpoint, path or query variable format, and HTTP method. API Shield API token API tokens authorize access to specific Cloudflare dashboard pages, accounts, and zones. API tokens are associated to the user that created them. Fundamentals API Tokens API Tokens are authentication credentials used to securely access and manage Workers AI resources via the REST API. Workers AI App Launcher The App Launcher portal provides end users with a single dashboard to open applications secured by Cloudflare Zero Trust. Cloudflare One application The resource protected by Cloudflare Zero Trust, which can be a subdomain, a path, or a SaaS application. Cloudflare One application token A piece of data that grants a user access to a specific Access application for a period of time. Can be stored in a browser cookie or passed to the application in place of a normal password. Cloudflare One attack score A number from 1 (likely malicious) to 99 (likely clean) classifying how likely an incoming request is malicious or not. Allows you to detect new attack techniques before they are publicly known. WAF attribute Traffic that flows through Area 1 can receive one or more attributes, which indicate that a specific condition has been met. Area 1 Authenticated Origin Pulls Authenticated Origin Pulls allow origin web servers to validate that a web request came from Cloudflare using TLS client certificate authentication. SSL/TLS autonomous system numbers (ASNs) A large network or group of networks that has a unified routing policy. Every computer or device that connects to the Internet is connected to an autonomous system. BYOIP Auxiliary Worker A Worker created locally via the Workers Vitest integration that runs in a separate isolate to the test runner, with a different global scope. Workers backup codes Backup codes allow restoration of Cloudflare account access outside the normal two-factor authentication process. A backup code becomes invalid after use. Fundamentals bandwidth The maximum rate of data transfer across a network. Speed binding Bindings allow your Workers to interact with resources on the Cloudflare Developer Platform. Workers bit field matching Matches raw bits in a packet to certain values specified in your rules. Magic Firewall blocklist A blocklist is a list of items (usually websites, IP addresses, email addresses, etc.) that are prevented from accessing a system. WAF Border Gateway Protocol (BGP) The routing protocol for the Internet, which is responsible for picking the most efficient routes to deliver Internet traffic. BYOIP bot A software application programmed to do tasks that can be used for good (chatbots, search engine crawlers) or for evil (inventory hoarding, credential stuffing). Bots bot score A score from 1 to 99 that indicates how likely that request came from a bot, in which 1 to 29 is likely automated and 30 to 99 is likely human. Bots bot tags Additional information about a bot request, such as why Cloudflare has given it a bot score and whether the request came from a verified bot or a category of verified bots. Bots brotli compression Brotli compression is a data compression algorithm developed by Google, optimized for web content, and designed to achieve higher compression ratios than traditional algorithms like Gzip. Speed C3 C3 is a command-line tool designed to help you set up and deploy new applications to Cloudflare. Workers cache A temporary storage area where frequently accessed data is stored for quick retrieval. Cache cache hit When a requested piece of content is found in the cache, reducing the need to fetch it from the origin server. Cache cache lock Cache lock (or mutex) is a mechanism employed by CDN data centers, comprising numerous servers, to prevent the overloading of origin servers. This mechanism ensures that only one server can request a specific file from the origin at any given time, facilitating efficient coordination among the servers. Cache cache miss When a requested piece of content is not found in the cache, requiring the server to fetch it from the origin server. Cache cached bandwidth (cached egress bandwidth) The amount of bandwidth served from Cloudflare without hitting the origin server. Cached bandwidth is the sum of all EdgeResponseBytes where CacheCacheStatus equals hit, stale, updating, ignored, or revalidated. Cache cached requests The number of requests served from Cloudflare without having to hit the origin server. Cached requests are the sum of all requests where CacheCacheStatus equals hit, stale, updating, ignored. This does not include revalidated since the request had to be sent to the origin server. Cache cacheTtl CacheTtl is a parameter that defines the length of time in seconds that a KV result is cached in the global network location it is accessed from. KV caching The process of storing copies of files or data in a cache to accelerate future requests. Cache CAPTCHA A CAPTCHA test is designed to determine if an online user is really a human and not a bot. CAPTCHA is an acronym that stands for "Completely Automated Public Turing test to tell Computers and Humans Apart." Turnstile captive portal A login screen shown to users when they connect to a public Wi-Fi. Captive portals typically occur in places such as airports, cafes, and hotels. Cloudflare One certificate SSL certificates enable encryption over HTTPS for traffic between a client and a website. SSL certificates contain the website's public key and the website's identity along with related information. Devices attempting to communicate with the origin web server reference the SSL certificate to obtain the public key and verify the server's identity. Cloudflare provides a Universal SSL certificate for each active Cloudflare domain. SSL/TLS Certificate Authority (CA) A CA is a trusted third party that provides SSL certificates for encrypting network traffic. SSL/TLS certificate packs Certificate packs allow Cloudflare to fallback to a different SSL certificate for browsers that do not support the latest standards. Certificate packs allow Custom SSL certificates to contain different signature algorithms for the same hostnames listed within the SSL certificate without taking up additional Custom SSL certificate quota for your Cloudflare account. SSL/TLS certificate pinning A security mechanism used to prevent on-path attacks on the Internet by hardcoding information about the certificate that the application expects to receive. If the wrong certificate is received, even if it is trusted by the system, the application will refuse to connect. SSL/TLS Certification Authority Authorization (CAA) record A CAA record declares which CAs are allowed to issue an SSL certificate for a domain. SSL/TLS cf-aig-backoff Header to customize the backoff type for request retries of a request. AI Gateway cf-aig-cache-key The cf-aig-cache-key-aig-cache-key let you override the default cache key in order to precisely set the cacheability setting for any resource. AI Gateway cf-aig-cache-status Status indicator for caching, showing if a request was served from cache. AI Gateway cf-aig-cache-ttl Specifies the cache time-to-live for responses. AI Gateway cf-aig-collect-log The cf-aig-collect-log header allows you to bypass the default log setting for the gateway. AI Gateway cf-aig-cust'''
