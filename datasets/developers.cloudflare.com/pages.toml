description = "It is possible to encrypt DNS traffic out from your router using DNS-over-TLS if it is running OpenWrt. For more details, see our blog post on the topic: Adding DNS-Over-TLS support to OpenWrt (LEDE) with Unbound."
full_description = '''Products … 1.1.1.1 Set up Router {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/setup/","name":"Set up"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/setup/router/","name":"Router"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Router Go to the IP address used to access your router's admin console in your browser. Linksys and Asus routers typically use http://192.168.1.1 or http://router.asus.com (for ASUS). Netgear routers typically use http://192.168.1.1 or http://routerlogin.net. D-Link routers typically use http://192.168.0.1. Ubiquiti routers typically use http://unifi.ubnt.com. Enter the router credentials. For consumer routers, the default credentials for the admin console are often found under or behind the device. In the admin console, find the place where DNS settings are set. This may be contained within categories such as WAN and IPv6 (Asus Routers) or Internet (Netgear Routers). Consult your router's documentation for details. Take note of any DNS addresses that are currently set and save them in a safe place in case you need to use them later. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Save the updated settings. Using DNS-Over-TLS on OpenWrt It is possible to encrypt DNS traffic out from your router using DNS-over-TLS if it is running OpenWrt. For more details, see our blog post on the topic: Adding DNS-Over-TLS support to OpenWrt (LEDE) with Unbound ↗. FRITZ!Box Starting with FRITZ!OS 7.20 ↗, DNS over TLS is supported, see Configuring different DNS servers in the FRITZ!Box ↗. Was this helpful? Edit page Last updated: Aug 13, 2024 Previous macOS Next Windows Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/