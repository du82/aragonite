full_description = '''Products … Cloudflare Zero Trust Policies Secure Web Gateway {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/cloudflare-one/","name":"Cloudflare Zero Trust"}},{"@type":"ListItem","position":3,"item":{"@id":"/cloudflare-one/policies/","name":"Policies"}},{"@type":"ListItem","position":4,"item":{"@id":"/cloudflare-one/policies/gateway/","name":"Secure Web Gateway"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Secure Web Gateway Cloudflare Gateway, our comprehensive Secure Web Gateway, allows you to set up policies to inspect DNS, Network, HTTP, and Egress traffic. DNS policies inspect DNS queries. You can block domains and IP addresses from resolving on your devices. For more information on DNS filtering, refer to our Learning Center article ↗. Network policies inspect individual TCP/UDP/GRE packets. You can block access to specific ports on your origin server, including non-HTTP resources. HTTP policies inspect HTTP requests. You can block specific URLs from loading, not just the domain itself. For more information on URL filtering, refer to our Learning Center article ↗. Egress policies inspect traffic to assign egress IP addresses unique to your organization. Resolver policies inspect DNS queries to enable resolution by custom authoritative nameservers. NoteWhen creating or editing policies, it may take up to 60 seconds for that policy to be updated across all of Cloudflare's data centers. Best practices For each type of policy, we recommend the following workflow: Connect the devices and/or networks that you want to apply policies to. Verify that Gateway is successfully proxying traffic from your devices. Set up basic security and compatibility policies (recommended for most use cases). Customize your configuration to the unique needs of your organization. To get started with specific Gateway filtering types, refer to the initial setup for DNS, Network, and HTTP policies. Select a policy type The recommended policy type depends on what kind of traffic you are trying to filter. For example: To block websites, create an HTTP policy. To block non-HTTP traffic such as SSH and RDP, create a network policy. To block malware and other security threats, create both DNS and HTTP policies. To assign static IP addresses to your organization's egress traffic, create an egress policy. Refer to the DNS, network, HTTP, and egress configuration pages to see the available filtering options within each policy builder. Was this helpful? Edit page Last updated: Sep 10, 2024 Previous Policies Next DNS filtering Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
