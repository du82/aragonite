|(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Build a Retrieval Augmented Generation (RAG) AI Last reviewed: 3 months ago This guide will instruct you through setting up and deploying your first application with Cloudflare AI. You will build a fully-featured AI-powered application, using tools like Workers AI, Vectorize, D1, and Cloudflare Workers. At the end of this tutorial, you will have built an AI tool that allows you to store information and query it using a Large Language Model. This pattern, known as Retrieval Augmented Generation, or RAG, is a useful project you can build by combining multiple aspects of Cloudflare's AI toolkit. You do not need to have experience working with AI tools to build this application. Sign up for a Cloudflare account ↗. Install Node.js ↗. Node.js version manager Use a Node version manager like Volta ↗ or nvm ↗ to avoid permission issues and change Node.js versions. Wrangler, discussed later in this guide, requires a Node version of 16.17.0 or later. You will also need access to Vectorize. During this tutorial, we will show how you can optionally integrate with Anthropic Claude ↗ as well. You will need an Anthropic API key ↗ to do so. 1. Create a new Worker project C3 (create-cloudflare-cli) is a command-line tool designed to help you setup and deploy Workers to Cloudflare as fast as possible. Open a terminal window and run C3 to create your Worker project: (() => { class StarlightTabsRestore extends HTMLElement { connectedCallback() { const starlightTabs = this.closest('starlight-tabs'); if (!(starlightTabs instanceof HTMLElement) || typeof localStorage === 'undefined') return; const syncKey = starlightTabs.dataset.syncKey; if (!syncKey) return; const label = localStorage.getItem(`starlight-synced-tabs__${syncKey}`); if (!label) return; const tabs = [...starlightTabs?.querySelectorAll('[role="tab"]')]; const tabIndexToRestore = tabs.findIndex( (tab) => tab instanceof HTMLAnchorElement && tab.textContent?.trim() === label ); const panels = starlightTabs?.querySelectorAll(':scope > [role="tabpanel"]'); const newTab = tabs[tabIndexToRestore]; const newPanel = panels[tabIndexToRestore]; if (tabIndexToRestore < 1 || !newTab || !newPanel) return; tabs[0]?.setAttribute('aria-selected', 'false'); tabs[0]?.setAttribute('tabindex', '-1'); panels?.[0]?.setAttribute('hidden', 'true'); newTab.removeAttribute('tabindex'); newTab.setAttribute('aria-selected', 'true'); newPanel.removeAttribute('hidden'); } } customElements.define('starlight-tabs-restore', StarlightTabsRestore); })() npm pnpm yarn Terminal windownpm create cloudflare@latest -- rag-ai-tutorial Terminal windowpnpm create cloudflare@latest rag-ai-tutorial Terminal windowyarn create cloudflare rag-ai-tutorial class r extends HTMLElement{static#e=new Map;#t;#n="starlight-synced-tabs__";constructor(){super();const t=this.querySelector('[role="tablist"]');if(this.tabs=[...t.querySelectorAll('[role="tab"]')],this.panels=[...this.querySelectorAll(':scope > [role="tabpanel"]')],this.#t=this.dataset.syncKey,this.#t){const i=r.#e.get(this.#t)??[];i.push(this),r.#e.set(this.#t,i)}this.tabs.forEach((i,c)=>{i.addEventListener("click",e=>{e.preventDefault();const n=t.querySelector('[aria-selected="true"]');e.currentTarget!==n&&this.switchTab(e.currentTarget,c)}),i.addEventListener("keydown",e=>{const n=this.tabs.indexOf(e.currentTarget),s=e.key==="ArrowLeft"?n-1:e.key==="ArrowRight"?n+1:e.key==="Home"?0:e.key==="End"?this.tabs.length-1:null;s!==null&&this.tabs[s]&&(e.preventDefault(),this.switchTab(this.tabs[s],s))})})}switchTab(t,i,c=!0){if(!t)return;const e=c?this.getBoundingClientRect().top:0;this.tabs.forEach(s=>{s.setAttribute("aria-selected","false"),s.setAttribute("tabindex","-1")}),this.panels.forEach(s=>{s.hidden=!0});const n=this.panels[i];n&&(n.hidden=!1),t.removeAttribute("tabindex"),t.setAttribute("aria-selected","true"),c&&(t.focus(),r.#r(this,t),window.scrollTo({top:window.scrollY+(this.getBoundingClientRect().top-e),behavior:"instant"}))}#i(t){!this.#t||typeof localStorage>"u"||localStorage.setItem(this.#n+this.#t,t)}static#r(t,i){const c=t.#t,e=r.#s(i);if(!c||!e)return;const n=r.#e.get(c);if(n){for(const s of n){if(s===t)continue;const a=s.tabs.findIndex(o=>r.#s(o)===e);a!==-1&&s.switchTab(s.tabs[a],a,!1)}t.#i(e)}}static#s(t){return t.textContent?.trim()}}customElements.define("starlight-tabs",r); For setup, select the following options: For What would you like to start with?, choose Hello World example.For Which template would you like to use?, choose Hello World Worker.For Which language do you want to use?, choose JavaScript.For Do you want to use git for version control?, choose Yes.For Do you want to deploy your application?, choose No (we will be making some changes before deploying). In your project directory, C3 has generated several files. What files did C3 create? wrangler.jsonc: Your Wrangler configuration file. worker.js (in /src): A minimal 'Hello World!' Worker written in ES module syntax. package.json: A minimal Node dependencies configuration file. package-lock.json: Refer to npm documentation on package-lock.json ↗. node_modules: Refer to npm documentation node_modules ↗. Now, move into your newly created directory: Terminal windowcd rag-ai-tutorial 2. Develop with Wrangler CLI The Workers command-line interface, Wrangler, allows you to create, test, and deploy your Workers projects. C3 will install Wrangler in projects by default. After you have created your first Worker, run the wrangler dev command in the project directory to start a local server for developing your Worker. This will allow you to test your Worker locally during development. Terminal windownpx wrangler dev --remote NoteIf you have not used Wrangler before, it will try to open your web browser to login with your Cloudflare account.If you have issues with this step or you do not have access to a browser interface, refer to the wrangler login documentation for more information. You will now be able to go to http://localhost:8787 ↗ to see your Worker running. Any changes you make to your code will trigger a rebuild, and reloading the page will show you the up-to-date output of your Worker. 3. Adding the AI binding To begin using Cloudflare's AI products, you can add the ai block to the Wrangler configuration file. This will set up a binding to Cloudflare's AI models in your code that you can use to interact with the available AI models on the platform. This example features the @cf/meta/llama-3-8b-instruct model, which generates text. wrangler.jsonc wrangler.toml { "ai": { "binding": "AI" }} [ai]binding = "AI" Now, find the src/index.js file. Inside the fetch handler, you can query the AI binding: export default { async fetch(request, env, ctx) { const answer = await env.AI.run("@cf/meta/llama-3-8b-instruct", { messages: [{ role: "user", content: `What is the square root of 9?` }], }); return new Response(JSON.stringify(answer)); },}; By querying the LLM through the AI binding, we can interact directly with Cloudflare AI's large language models directly in our code. In this example, we are using the @cf/meta/llama-3-8b-instruct model, which generates text. You can deploy your Worker using wrangler: Terminal windownpx wrangler deploy Making a request to your Worker will now generate a text response from the LLM, and return it as a JSON object. Terminal windowcurl https://example.username.workers.dev .expressive-code:has(figure.code-output){margin-top:0 !important}.expressive-code .code-output .copy{display:none !important}.expressive-code .code-output > pre{border-top-width:0 !important;background:var(--sl-color-gray-6) !important}.expressive-code .code-output > pre > code{user-select:none;transition:opacity 0.5s ease}.expressive-code .code-output > pre > code:hover{cursor:default;opacity:0.5}{"response":"Answer: The square root of 9 is 3."} 4. Adding embeddings using Cloudflare D1 and Vectorize Embeddings allow you to add additional capabilities to the language models you can use in your Cloudflare AI projects. This is done via Vectorize, Cloudflare's vector database. To begin using Vectorize, create a new embeddings index using wrangler. This index will store vectors with 768 dimensions, and will use cosine similarity to determine which vectors are most similar to each other: Terminal windownpx wrangler vectorize create vector-index --dimensions=768 --metric=cosine Then, add the configuration details for your new Vectorize index to the Wrangler configuration file: wrangler.jsonc wrangler.toml { "vectorize": [ { "binding": "VECTOR_INDEX", "index_name": "vector-index" } ]} # ... existing wrangler configuration [[vectorize]]binding = "VECTOR_INDEX"index_name = "vector-index" A vector index allows you to store a collection of dimensions, which are floating point numbers used to represent your data. When you want to query the vector database, you can also convert your query into dimensions. Vectorize is designed to efficiently determine which stored vectors are most similar to your query. To implement the searching feature, you must set up a D1 database from Cloudflare. In D1, you can store your app's data. Then, you change this data into a vector format. When someone searches and it matches the vector, you can show them the matching data. Create a new D1 database using wrangler: Terminal windownpx wrangler d1 create database Then, paste the configuration details output from the previous command into the Wrangler configuration file: wrangler.jsonc wrangler.toml { "d1_databases": [ { "binding": "DB", "database_name": "database", "database_id": "abc-def-geh" } ]} # ... existing wrangler configuration [[d1_databases]]binding = "DB" # available in your Worker on env.DBdatabase_name = "database"database_id = "abc-def-geh" # replace this with a real database_id (UUID) In this application, we'll create a notes table in D1, which will allow us to store notes and later retrieve them in Vectorize. To create this table, run a SQL command using wrangler d1 execute: Terminal windownpx wrangler d1 execute database --remote --command "CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, text TEXT NOT NULL)" Now, we can add a new note to our database using wrangler d1 execute: Terminal windownpx wrangler d1 execute database --remote --command "INSERT INTO notes (text) VALUES ('The best pizza topping is pepperoni')" 5. Creating a workflow Before we begin creating notes, we will introduce a Cloudflare Workflow. This will allow us to define a durable workflow that can safely and robustly execute all the steps of the RAG process. To begin, add a new [[workflows]] block to your Wrangler configuration file: wrangler.jsonc wrangler.toml { "workflows": [ { "name": "rag", "binding": "RAG_WORKFLOW", "class_name": "RAGWorkflow" } ]} # ... existing wrangler configuration [[workflows]]name = "rag"binding = "RAG_WORKFLOW"class_name = "RAGWorkflow" In src/index.js, add a new class called RAGWorkflow that extends Workflow: export class RAGWorkflow { async run(event, step) { await step.do('example step', async () => { console.log("Hello World!") }) }} This class will define a single workflow step that will log "Hello World!" to the console. You can add as many steps as you need to your workflow. On its own, this workflow will not do anything. To execute the workflow, we will call the RAG_WORKFLOW binding, passing in any parameters that the workflow needs to properly complete. Here is an example of how we can call the workflow: env.RAG_WORKFLOW.create({ params: { text } }) 6. Creating notes and adding them to Vectorize To expand on your Workers function in order to handle multiple routes, we will add hono, a routing library for Workers. This will allow us to create a new route for adding notes to our database. Install hono using npm: Terminal windownpm install hono Then, import hono into your src/index.js file. You should also update the fetch handler to use hono: import { Hono } from "hono";const app = new Hono(); app.get("/", async (c) => { const answer = await c.env.AI.run("@cf/meta/llama-3-8b-instruct", { messages: [{ role: "user", content: `What is the square root of 9?` }], }); return c.json(answer);}); export default app; This will establish a route at the root path / that is functionally equivalent to the previous version of your application. Now, we can update our workflow to begin adding notes to our database, and generating the related embeddings for them. This example features the @cf/baai/bge-base-en-v1.5 model, which can be used to create an embedding. Embeddings are stored and retrieved inside Vectorize, Cloudflare's vector database. The user query is also turned into an embedding so that it can be used for searching within Vectorize. export class RAGWorkflow { async run(event, step) { const { text } = event.params const record = await step.do(`create database record`, async () => { const query = "INSERT INTO notes (text) VALUES (?) RETURNING *" const { re'''
