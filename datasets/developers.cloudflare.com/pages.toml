full_description = 'Products … 1.1.1.1 Set up Linux {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/setup/","name":"Set up"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/setup/linux/","name":"Linux"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Linux Before you begin, take note of any DNS addresses you might have set up, and save them in a safe place in case you need to use them later. Consider the sections below to set up 1.1.1.1 using either the command line interface (CLI) or a graphical user interface (GUI) of your preference. Use command line interface (CLI) Choose whether you want to use 1.1.1.1 or 1.1.1.1 For Families, and replace 1.1.1.1 with the corresponding IPv4 or IPv6 address accordingly. resolv.conf Usually, /etc/resolv.conf is where you can configure the resolver IPs that your system is using. In that case, you can use the following one-line command to specify 1.1.1.1 as your DNS resolver and 1.0.0.1 as backup: Terminal windowecho -e "nameserver 1.1.1.1\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf WarningNote that other systems, such as dynamic host configuration protocol (DHCP), may automatically write to /etc/resolv.conf and change that configuration. In those cases, consider changing your network settings or DHCP to use 1.1.1.1. Alternatively, you can use an editor (nano or vim, for example) to manually edit the file. systemd-resolved If you use systemd-resolved utility and the resolver IPs configuration is in /etc/systemd/resolved.conf, consider the steps below: Run the following command, replacing <EDITOR> with your preferred editor. Terminal windowsudo <EDITOR> /etc/systemd/resolved.conf In the editor, add or edit the following lines: [Resolve]DNS=1.1.1.1 To use DNS over TLS, add #one.one.one.one and set DNSOverTLS to yes, as in the following example: [Resolve]DNS=1.1.1.1#one.one.one.oneDNSOverTLS=yes Use graphical user interface (GUI) GNOME Go to Show Applications > Settings > Network. Select the adapter you want to configure — like your Ethernet adapter or Wi-Fi card — and select the Settings button. On the IPv4 tab > DNS section, disable the Automatic toggle. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Go to IPv6. Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select Apply. KDE Plasma Go to System Settings > Wi-Fi & Internet > Wi-Fi & Networking. (or Connections, if on Plasma 5) Select the connection you want to configure - like your current connected network. On the IPv4 tab, select the Method drop-down menu > Automatic (Only addresses). Select the text box next to DNS servers. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 On the IPv6 tab, select the Method drop-down menu > Automatic (Only addresses). Select the text box next to DNS servers. Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select Apply. NoteSetting up a static IP address to configure a DNS server may prevent you from connecting to some public Wi-Fi networks that use captive portals — these are the web pages some wireless networks employ to let users log in and use their services.If you are experiencing connectivity issues related to captive portals: Remove the static IP addresses from the device or disable the 1.1.1.1 app. Connect to the Wi-Fi network. Once the connection has been established, re-add the static IP addresses or enable the 1.1.1.1 app. Was this helpful? Edit page Last updated: Dec 16, 2024 Previous iOS Next macOS Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
