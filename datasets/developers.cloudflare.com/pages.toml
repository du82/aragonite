tro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);AI Gateway Binding Methods Last reviewed: about 1 month ago This guide provides an overview of how to use the latest Cloudflare Workers AI Gateway binding methods. You will learn how to set up an AI Gateway binding, access new methods, and integrate them into your Workers. Prerequisites Install and use the @cloudflare/workers-types library, version 4.20250124.3 or above. 1. Add an AI Binding to your Worker To connect your Worker to Workers AI, add the following to your Wrangler configuration file: (() => { class StarlightTabsRestore extends HTMLElement { connectedCallback() { const starlightTabs = this.closest('starlight-tabs'); if (!(starlightTabs instanceof HTMLElement) || typeof localStorage === 'undefined') return; const syncKey = starlightTabs.dataset.syncKey; if (!syncKey) return; const label = localStorage.getItem(`starlight-synced-tabs__${syncKey}`); if (!label) return; const tabs = [...starlightTabs?.querySelectorAll('[role="tab"]')]; const tabIndexToRestore = tabs.findIndex( (tab) => tab instanceof HTMLAnchorElement && tab.textContent?.trim() === label ); const panels = starlightTabs?.querySelectorAll(':scope > [role="tabpanel"]'); const newTab = tabs[tabIndexToRestore]; const newPanel = panels[tabIndexToRestore]; if (tabIndexToRestore < 1 || !newTab || !newPanel) return; tabs[0]?.setAttribute('aria-selected', 'false'); tabs[0]?.setAttribute('tabindex', '-1'); panels?.[0]?.setAttribute('hidden', 'true'); newTab.removeAttribute('tabindex'); newTab.setAttribute('aria-selected', 'true'); newPanel.removeAttribute('hidden'); } } customElements.define('starlight-tabs-restore', StarlightTabsRestore); })() wrangler.jsonc wrangler.toml { "ai": { "binding": "AI" }} [ai]binding = "AI" class r extends HTMLElement{static#e=new Map;#t;#n="starlight-synced-tabs__";constructor(){super();const t=this.querySelector('[role="tablist"]');if(this.tabs=[...t.querySelectorAll('[role="tab"]')],this.panels=[...this.querySelectorAll(':scope > [role="tabpanel"]')],this.#t=this.dataset.syncKey,this.#t){const i=r.#e.get(this.#t)??[];i.push(this),r.#e.set(this.#t,i)}this.tabs.forEach((i,c)=>{i.addEventListener("click",e=>{e.preventDefault();const n=t.querySelector('[aria-selected="true"]');e.currentTarget!==n&&this.switchTab(e.currentTarget,c)}),i.addEventListener("keydown",e=>{const n=this.tabs.indexOf(e.currentTarget),s=e.key==="ArrowLeft"?n-1:e.key==="ArrowRight"?n+1:e.key==="Home"?0:e.key==="End"?this.tabs.length-1:null;s!==null&&this.tabs[s]&&(e.preventDefault(),this.switchTab(this.tabs[s],s))})})}switchTab(t,i,c=!0){if(!t)return;const e=c?this.getBoundingClientRect().top:0;this.tabs.forEach(s=>{s.setAttribute("aria-selected","false"),s.setAttribute("tabindex","-1")}),this.panels.forEach(s=>{s.hidden=!0});const n=this.panels[i];n&&(n.hidden=!1),t.removeAttribute("tabindex"),t.setAttribute("aria-selected","true"),c&&(t.focus(),r.#r(this,t),window.scrollTo({top:window.scrollY+(this.getBoundingClientRect().top-e),behavior:"instant"}))}#i(t){!this.#t||typeof localStorage>"u"||localStorage.setItem(this.#n+this.#t,t)}static#r(t,i){const c=t.#t,e=r.#s(i);if(!c||!e)return;const n=r.#e.get(c);if(n){for(const s of n){if(s===t)continue;const a=s.tabs.findIndex(o=>r.#s(o)===e);a!==-1&&s.switchTab(s.tabs[a],a,!1)}t.#i(e)}}static#s(t){return t.textContent?.trim()}}customElements.define("starlight-tabs",r); This configuration sets up the AI binding accessible in your Worker code as env.AI. 2. Basic Usage with Workers AI + Gateway To perform an inference task using Workers AI and an AI Gateway, you can use the following code: src/index.tsconst resp = await env.AI.run("@cf/meta/llama-3.1-8b-instruct", { prompt: "tell me a joke"}, { gateway: { id: "my-gateway" }}); Additionally, you can access the latest request log ID with: const myLogId = env.AI.aiGatewayLogId; 3. Access the Gateway Binding You can access your AI Gateway binding using the following code: const gateway = env.AI.gateway("my-gateway"); Once you have the gateway instance, you can use the following methods: 3.1. patchLog: Send Feedback The patchLog method allows you to send feedback, score, and metadata for a specific log ID. All object properties are optional, so you can include any combination of the parameters: gateway.patchLog('my-log-id', { feedback: 1, score: 100, metadata: { user: "123" }}); Returns: Promise<void> (Make sure to await the request.) Example Use Case: Update a log entry with user feedback or additional metadata. 3.2. getLog: Read Log Details The getLog method retrieves details of a specific log ID. It returns an object of type Promise<AiGatewayLog>. You can import the AiGatewayLog type from the @cloudflare/workers-types library. const log = await gateway.getLog("my-log-id"); Returns: Promise<AiGatewayLog> Example Use Case: Retrieve log information for debugging or analytics. 3.3. run: Universal Requests The run method allows you to execute universal requests. Users can pass either a single universal request object or an array of them. This method supports all AI Gateway providers. Refer to the Universal endpoint documentation for details about the available inputs. const resp = await gateway.run({ provider: "workers-ai", endpoint: "@cf/meta/llama-3.1-8b-instruct", headers: { authorization: "Bearer my-api-token" }, query: { prompt: "tell me a joke" }}); Returns: Promise<Response> Example Use Case: Perform a universal request to any supported provider. Conclusion With the new AI Gateway binding methods, you can now: Send feedback and update metadata with patchLog. Retrieve detailed log information using getLog. Execute universal requests to any AI Gateway provider with run. These methods offer greater flexibility and control over your AI integrations, empowering you to build more sophisticated applications on the Cloudflare Workers platform. Was this helpful? Edit page Last updated: Feb 12, 2025 Previous Agents ↗ Next Workers AI Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
