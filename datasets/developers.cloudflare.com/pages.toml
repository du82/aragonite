title = "Set up Evaluations · Cloudflare AI Gateway docs"
description = "This guide walks you through the process of setting up an evaluation in AI Gateway. These steps are done in the Cloudflare dashboard."
full_description = '''Products … AI Gateway Evaluations Set up Evaluations {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/ai-gateway/","name":"AI Gateway"}},{"@type":"ListItem","position":3,"item":{"@id":"/ai-gateway/evaluations/","name":"Evaluations"}},{"@type":"ListItem","position":4,"item":{"@id":"/ai-gateway/evaluations/set-up-evaluations/","name":"Set up Evaluations"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Set up Evaluations This guide walks you through the process of setting up an evaluation in AI Gateway. These steps are done in the Cloudflare dashboard ↗. 1. Select or create a dataset Datasets are collections of logs stored for analysis that can be used in an evaluation. You can create datasets by applying filters in the Logs tab. Datasets will update automatically based on the set filters. Set up a dataset from the Logs tab Apply filters to narrow down your logs. Filter options include provider, number of tokens, request status, and more. Select Create Dataset to store the filtered logs for future analysis. You can manage datasets by selecting Manage datasets from the Logs tab. NotePlease keep in mind that datasets currently use AND joins, so there can only be one item per filter (for example, one model or one provider). Future updates will allow more flexibility in dataset creation. List of available filters Filter categoryFilter optionsFilter by descriptionStatuserror, statuserror type or status.Cachecached, not cachedbased on whether they were cached or not.Providerspecific providersthe selected AI provider.AI Modelsspecific modelsthe selected AI model.Costless than, greater thancost, specifying a threshold.Request typeUniversal, Workers AI Binding, WebSocketsthe type of request.TokensTotal tokens, Tokens In, Tokens Outtoken count (less than or greater than).Durationless than, greater thanrequest duration.Feedbackequals, does not equal (thumbs up, thumbs down, no feedback)feedback type.Metadata Keyequals, does not equalspecific metadata keys.Metadata Valueequals, does not equalspecific metadata values.Log IDequals, does not equala specific Log ID.Event IDequals, does not equala specific Event ID. 2. Select evaluators After creating a dataset, choose the evaluation parameters: Cost: Calculates the average cost of inference requests within the dataset (only for requests with cost data). Speed: Calculates the average duration of inference requests within the dataset. Performance: Human feedback: measures performance based on human feedback, calculated by the % of thumbs up on the logs, annotated from the Logs tab. NoteAdditional evaluators will be introduced in future updates to expand performance analysis capabilities. 3. Name, review, and run the evaluation Create a unique name for your evaluation to reference it in the dashboard. Review the selected dataset and evaluators. Select Run to start the process. 4. Review and analyze results Evaluation results will appear in the Evaluations tab. The results show the status of the evaluation (for example, in progress, completed, or error). Metrics for the selected evaluators will be displayed, excluding any logs with missing fields. You will also see the number of logs used to calculate each metric. While datasets automatically update based on filters, evaluations do not. You will have to create a new evaluation if you want to evaluate new logs. Use these insights to optimize based on your application's priorities. Based on the results, you may choose to: Change the model or provider Adjust your prompts Explore further optimizations, such as setting up Retrieval Augmented Generation (RAG) Was this helpful? Edit page Last updated: Jan 29, 2025 Previous Evaluations Next Add Human Feedback using Dashboard Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
