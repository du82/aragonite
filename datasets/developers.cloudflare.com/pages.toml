le Cloud supports configuring outbound server policy ↗ within Cloud DNS. Policies are applied per Virtual Private Cloud (VPC) network, and will affect all resources within that VPC network, including any existing virtual machines. NoteIf you are using Cloudflare Zero Trust, you can choose assigned locations to apply custom DNS policies via Gateway. To configure 1.1.1.1 for your Google Cloud VPC network(s): Open the Google Cloud Console ↗. Navigate to Network Services > Cloud DNS and select DNS Server Policies ↗. Select Create Policy. Provide a name for your Policy (such as cloudflare-1-1-1-1) and select associated VPC network or networks. Under Alternate DNS servers, select Add Item and type: 1.1.1.11.0.0.1 Select Create. DNS requests within the configured VPC network(s) will now use 1.1.1.1. Was this helpful? Edit page Last updated: Aug 13, 2024 Previous Gaming consoles Next iOS Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
