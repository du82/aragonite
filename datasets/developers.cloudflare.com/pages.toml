ou might have set up, and save them in a safe place in case you need to use them later. Go to System Settings. You can find it by pressing CMD + Space on your keyboard and typing System Settings. Go to Network. Select a network service. Select Details. Go to DNS. Under DNS Servers, select Add. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select OK. NoteSetting up a static IP address to configure a DNS server may prevent you from connecting to some public Wi-Fi networks that use captive portals — these are the web pages some wireless networks employ to let users log in and use their services.If you are experiencing connectivity issues related to captive portals: Remove the static IP addresses from the device or disable the 1.1.1.1 app. Connect to the Wi-Fi network. Once the connection has been established, re-add the static IP addresses or enable the 1.1.1.1 app. Encrypt your DNS queries 1.1.1.1 supports DNS over TLS (DoT) and DNS over HTTPS (DoH), two standards developed for encrypting plaintext DNS traffic. This prevents untrustworthy entities from interpreting and manipulating your queries. For more information on how to encrypt your DNS queries, please refer to the Encrypted DNS documentation. Was this helpful? Edit page Last updated: Jan 20, 2025 Previous Linux Next Router Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {