onst s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Configure DoH on your browser There are several browsers compatible with DNS over HTTPS (DoH). This protocol lets you encrypt your connection to 1.1.1.1 in order to protect your DNS queries from privacy intrusions and tampering. Some browsers might already have this setting enabled. NoteTo use 1.1.1.1 For Families, follow the steps below but, instead of choosing the default 1.1.1.1 option, refer to Set up and specify the URL you want to use. Mozilla Firefox Select the menu button > Settings. In the Privacy & Security menu, scroll down to the Enable secure DNS using: section. Select Increased Protection or Max Protection. By default, it will use the Cloudflare provider. If this is not the case, select Cloudflare in the Choose Provider dropdown. Google Chrome Select the three-dot menu in your browser > Settings. Select Privacy and security > Security. Scroll down and enable Use secure DNS. Select the With option, and from the drop-down menu choose Cloudflare (1.1.1.1). Microsoft Edge Select the three-dot menu in your browser > Settings. Select Privacy, Search, and Services, and scroll down to Security. Enable Use secure DNS. Select Choose a service provider. Select the Enter custom provider drop-down menu and choose Cloudflare (1.1.1.1). Brave Select the menu button in your browser > Settings. Select Privacy and security > Security. Under Advanced, enable Use secure DNS. From the Select DNS provider drop-down menu, choose Cloudflare (1.1.1.1). Check if the browser is configured correctly Visit 1.1.1.1 help page ↗ and check if Using DNS over HTTPS (DoH) shows Yes. Was this helpful? Edit page Last updated: Nov 21, 2024 Previous Using JSON Next Connect to 1.1.1.1 using DoH clients Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-esl