full_description = '''Products … 1.1.1.1 Encryption DNS over HTTPS Make API requests to 1.1.1.1 Using JSON {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/encryption/","name":"Encryption"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/encryption/dns-over-https/","name":"DNS over HTTPS"}},{"@type":"ListItem","position":5,"item":{"@id":"/1.1.1.1/encryption/dns-over-https/make-api-requests/","name":"Make API requests to 1.1.1.1"}},{"@type":"ListItem","position":6,"item":{"@id":"/1.1.1.1/encryption/dns-over-https/make-api-requests/dns-json/","name":"Using JSON"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Using JSON WarningThe DNS over HTTPS JSON format does not have a formal RFC, which means behavior might be different between providers. Additionally, there might be small changes in behavior in the future.For critical use cases, it is recommended to use the DNS over HTTPS wireformat, which is defined in RFC 1035 ↗. Cloudflare's DNS over HTTPS endpoint also supports JSON format for querying DNS data. For lack of an agreed upon JSON schema for DNS over HTTPS in the Internet Engineering Task Force (IETF), Cloudflare has chosen to follow the same schema as Google's DNS over HTTPS resolver. JSON formatted queries are sent using a GET request. When making requests using GET, the DNS query is encoded into the URL. The client should include an HTTP Accept request header field with a MIME type of application/dns-json to indicate that the client is able to accept a JSON response from the DNS over HTTPS resolver. Supported parameters FieldRequired?DescriptionDefaultnameYesQuery name.-typeNoQuery type (either a numeric value or text ↗).AdoNoDO bit - whether the client wants DNSSEC data (either empty or one of 0, false, 1, or true).falsecdNoCD bit - disable validation (either empty or one of 0, false, 1, or true).false Examples Example request and response: Terminal windowcurl --header "accept: application/dns-json" "https://cloudflare-dns.com/dns-query?name=example.com&type=AAAA" .expressive-code:has(figure.code-output){margin-top:0 !important}.expressive-code .code-output .copy{display:none !important}.expressive-code .code-output > pre{border-top-width:0 !important;background:var(--sl-color-gray-6) !important}.expressive-code .code-output > pre > code{user-select:none;transition:opacity 0.5s ease}.expressive-code .code-output > pre > code:hover{cursor:default;opacity:0.5}{ "Status": 0, "TC": false, "RD": true, "RA": true, "AD": true, "CD": false, "Question": [ { "name": "example.com.", "type": 28 } ], "Answer": [ { "name": "example.com.", "type": 28, "TTL": 1726, "data": "2606:2800:220:1:248:1893:25c8:1946" } ]} In the case of an invalid request a 400 Bad Request error is returned: Terminal windowcurl --header "accept: application/dns-json" "https://cloudflare-dns.com/dns-query?name=example.com&cd=2" { "error": "Invalid CD flag `2`. Expected to be empty or one of `0`, `false`, `1`, or `true`."} Response fields The following tables have more information on each response field. Successful response FieldDescriptionStatusThe Response Code of the DNS Query. These are defined here: https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml#dns-parameters-6 ↗.TCIf true, it means the truncated bit was set. This happens when the DNS answer is larger than a single UDP or TCP packet. TC will almost always be false with Cloudflare DNS over HTTPS because Cloudflare supports the maximum response size.RDIf true, it means the Recursive Desired bit was set. This is always set to true for Cloudflare DNS over HTTPS.RAIf true, it means the Recursion Available bit was set. This is always set to true for Cloudflare DNS over HTTPS.ADIf true, it means that every record in the answer was verified with DNSSEC.CDIf true, the client asked to disable DNSSEC validation. In this case, Cloudflare will still fetch the DNSSEC-related records, but it will not attempt to validate the records.Question: nameThe record name requested.Question: typeThe type of DNS record requested. These are defined here: https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml#dns-parameters-4 ↗.Answer: nameThe record owner.Answer: typeThe type of DNS record. These are defined here: https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml#dns-parameters-4 ↗.Answer: TTLThe number of seconds the answer can be stored in cache before it is considered stale.Answer: dataThe value of the DNS record for the given name and type. The data will be in text for standardized record types and in hex for unknown types.Authority: nameThe record owner.Authority: typeThe type of DNS record. These are defined here: https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml#dns-parameters-4 ↗.Authority: TTLThe number of seconds the answer can be stored in cache before it is considered stale.Authority: dataThe value of the DNS record for the given name and type. The data will be in text for standardized record types and in hex for unknown types.Additional: nameThe record owner.Additional: typeThe type of DNS record. These are defined here: https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml#dns-parameters-4 ↗.Additional: TTLThe number of seconds the answer can be stored in cache before it is considered stale.Additional: dataThe value of the DNS record for the given name and type. The data will be in text for standardized record types and in hex for unknown types.CommentList of EDE messages. Refer to Extended DNS error codes for more information. Error response FieldDescriptionerrorAn explanation of the error that occurred. Was this helpful? Edit page Last updated: Feb 6, 2025 Previous DNS Wireformat Next Configure DoH on your browser Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
