full_description = 'Products … 1.1.1.1 Set up Windows {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/setup/","name":"Set up"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/setup/windows/","name":"Windows"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Windows Windows 10 Take note of any DNS addresses you might have set up, and save them in a safe place in case you need to use them later. Select the Start menu > Settings. On Network and Internet, select Change Adapter Options. Right-click on the Ethernet or Wi-Fi network you are connected to and select Properties. Choose Internet Protocol Version 4. Select Properties > Use the following DNS server addresses. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Select OK. Go to Internet Protocol Version 6. Select Properties > Use the following DNS server addresses. Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select OK. Windows 11 Take note of any DNS addresses you might have set up, and save them in a safe place in case you need to use them later. Select the Start menu > Settings. On Network and Internet, choose the adapter you want to configure - like your Ethernet adapter or Wi-Fi card. Scroll to DNS server assignment and select Edit. Select the Automatic (DHCP) drop-down menu > Manual. Select the IPv4 toggle to turn it on. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Select the IPv6 toggle. Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select Save. NoteSetting up a static IP address to configure a DNS server may prevent you from connecting to some public Wi-Fi networks that use captive portals — these are the web pages some wireless networks employ to let users log in and use their services.If you are experiencing connectivity issues related to captive portals: Remove the static IP addresses from the device or disable the 1.1.1.1 app. Connect to the Wi-Fi network. Once the connection has been established, re-add the static IP addresses or enable the 1.1.1.1 app. Encrypt your DNS queries 1.1.1.1 supports DNS over TLS (DoT) and DNS over HTTPS (DoH), two standards developed for encrypting plaintext DNS traffic. This prevents untrustworthy entities from interpreting and manipulating your queries. For more information on how to encrypt your DNS queries, please refer to the Encrypted DNS documentation. Was this helpful? Edit page Last updated: Aug 13, 2024 Previous Router Next Encryption Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
