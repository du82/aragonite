title = "Set up Cloudflare 1.1.1.1 resolver · Cloudflare 1.1.1.1 docs"
description = "Learn how to set up Cloudflare's 1.1.1.1 DNS resolver for enhanced security and privacy. Protect against malware and adult content with easy configuration."
full_description = '''Products … 1.1.1.1 Set up {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/setup/","name":"Set up"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Set up By default, the DNS server ↗ your devices use is provided by your Internet service provider (ISP). Some ISPs and network equipment providers partner with Cloudflare to add safer browsing to their offerings. If your providers are not currently using Cloudflare, you can change the DNS settings on your device or router as detailed in the following instructions. Device or router specific guides Android Azure Gaming consoles Google Cloud iOS Linux macOS Router Windows You can also set up 1.1.1.1 for Families for an added layer of protection on your home network against malware and adult content. 1.1.1.1 for Families leverages Cloudflare's global network to ensure that it is fast and secure around the world, and includes the same strong privacy guarantees that Cloudflare committed to when launching 1.1.1.1. 1.1.1.1 for Families 1.1.1.1 for Families categorizes destinations on the Internet based on the potential threat they pose regarding malware, phishing, or other types of security risks. 1.1.1.1 for Families has two default options: Block malware Use the following DNS resolvers to block malicious content: 1.1.1.2 1.0.0.2 2606:4700:4700::1112 2606:4700:4700::1002 Block malware and adult content Use the following DNS resolvers to block malware and adult content: 1.1.1.3 1.0.0.3 2606:4700:4700::1113 2606:4700:4700::1003 Cloudflare returns 0.0.0.0 if the fully qualified domain name (FQDN) ↗ or IP in a DNS query is classified as malicious. Domain miscategorizationIf you are using 1.1.1.1 for Families and see a domain that you believe is miscategorized, fill in this form ↗ to bring it to our attention. Your submission will remain anonymous.We review these submissions to improve Cloudflare’s categorization. Test 1.1.1.1 for Families After configuring 1.1.1.1 for Families, you can test if it is working as intended with the following URLs: https://malware.testcategory.com/ ↗: Use this to test if 1.1.1.1 for Families is blocking known malware addresses correctly. https://nudity.testcategory.com/ ↗: Use this to test if 1.1.1.1 for Families is blocking known adult content and malware addresses correctly. DNS over HTTPS (DoH) If you have a DoH-compliant client, such as a compatible router, you can set up 1.1.1.1 for Families to encrypt your DNS queries over HTTPS. This prevents spoofing and tracking by malicious actors, advertisers, ISPs, and others. For more information on DoH, refer to the Learning Center article on DNS encryption ↗. To configure an encrypted DoH connection to 1.1.1.1 for Families, type one of the following URLs into the appropriate field of your DoH-compliant client: Block malware https://security.cloudflare-dns.com/dns-query Block malware and adult content https://family.cloudflare-dns.com/dns-query DNS over TLS (DoT) 1.1.1.1 for Families also supports DoT if you have a compliant client, such as a compatible DoT router. DoT allows you to encrypt your DNS queries, protecting you from spoofing, malicious actors, and others. You can learn more about DoT in the Learning Center article on DNS encryption ↗. To configure an encrypted DoT connection to 1.1.1.1 for Families, type one of the following URLs into the appropriate field of your DoT-compliant client: Block malware security.cloudflare-dns.com Block malware and adult content family.cloudflare-dns.com Was this helpful? Edit page Last updated: Jan 30, 2025 Previous IP addresses Next Android Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
