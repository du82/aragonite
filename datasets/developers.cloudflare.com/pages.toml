full_description = '''Products … Cloudflare Zero Trust Policies Access {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/cloudflare-one/","name":"Cloudflare Zero Trust"}},{"@type":"ListItem","position":3,"item":{"@id":"/cloudflare-one/policies/","name":"Policies"}},{"@type":"ListItem","position":4,"item":{"@id":"/cloudflare-one/policies/access/","name":"Access"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Access Cloudflare Access determines who can reach your application by applying the Access policies you configure. An Access policy consists of an Action as well as rules which determine the scope of the action. To build a rule, you need to choose a Rule type, Selector, and a Value for the selector. Actions Rule types Selectors Actions Actions let you grant or deny permission to a certain user or user group. You can set only one action per policy. Allow The Allow action allows users that meet certain criteria to reach an application behind Access. The following example lets any user with an @example.com email address, as validated against an IdP, reach the application: ActionRule typeSelectorValueAllowIncludeEmails Ending In:@example.com You can add a Require rule in the same policy action to enforce additional checks. Finally, if the policy contains an Exclude rule, users meeting that definition are prevented from reaching the application. For example, this second configuration lets any user from Portugal with a @team.com email address, as validated against an IdP, reach the application, except for user-1 and user-2: ActionRule typeSelectorValueAllowIncludeCountryPortugalRequireEmails Ending In@team.comExcludeEmailuser-1@team.com, user-2@team.com Block The Block action prevents users from reaching an application behind Access. For example, this configuration blocks every request to the application, except for requests from user-1@team.com: ActionRule typeSelectorValueBlockIncludeEveryoneEveryoneExcludeEmailuser-1@team.com Bypass WarningBypass does not enforce any Access security controls and requests are not logged. Bypass policies should be tested before deploying to production. Consider using Service Auth if you would like to enforce policies and maintain logging without requiring user authentication.As Bypass does not enforce Access security controls, Bypass policies do not support identity-based rule types. When making Bypass policies, you will not be able to apply certain identity-based selectors (such as email, or IP). The Bypass action disables any Access enforcement for traffic that meets the defined rule criteria. Bypass is typically used to enable applications that require specific endpoints to be public. For example, some applications have an endpoint under the /admin route that must be publicly routable. In this situation, you could create an Access application for the domain test.example.com/admin/<your-url> and add the following Bypass policy: ActionRule typeSelectorValueBypassIncludeEveryoneEveryone As part of implementing a Zero Trust security model, Cloudflare does not recommend using Bypass to grant direct permanent access to your internal applications. To enable seamless and secure access for on-network employees, use Cloudflare Tunnel to connect your private network and have users connect through WARP. NoteWhen applying a Bypass action, security settings revert to the defaults configured for the zone and any configured Page Rules. If Always use HTTPS is enabled for the site, then traffic to the bypassed destination continues in HTTPS. If Always use HTTPS is disabled, traffic is HTTP. Service Auth Service Auth rules enforce authentication flows that do not require an identity provider IdP login, such as service tokens and mutual TLS. ActionRule typeSelectorService AuthIncludeValid certificate Rule types Rules work like logical operators. They help you define which categories of users your policy will affect. All Access policies must contain an Include rule. This is what defines the initial pool of eligible users who can access an application. You can then add Exclude and Require rules to enforce specific policies for those users. Include The Include rule is similar to an OR logical operator. In case more than one Include rule is specified, users need to meet only one of the criteria. Exclude The Exclude rule works like a NOT logical operator. A user meeting any Exclusion criteria will not be allowed access to the application. Require The Require rule works like an AND logical operator. A user must meet all specified Require rules to be allowed access. Require rules with OR operators By default, any values added to a Require rule are concatenated by an AND operator. For example, let's say you want to grant access to an application to both the full-time employees and the contractors, and only the ones based in specific countries — say Portugal and the United States. If you set up a rule with the following configuration: ActionRule typeSelectorValueAllowRequireCountryUnited States, PortugalRequireEmails ending in@cloudflare.com, @contractors.com the policy will only grant access to people reaching the application from both the United States AND Portugal, and who have both an email ending in @cloudflare.com AND in @contractors.com. Therefore, nobody will have access to the application. To require only one country and one email ending: Create a rule group that includes users in Portugal OR in the United States: Rule typeSelectorValueIncludeCountryUnited States, Portugal Create a policy that requires the rule group, and that also includes users with emails ending in either @cloudflare.com OR @contractors.com: ActionRule typeSelectorValueAllowRequireRule groupCountry requirementsIncludeEmails ending in@cloudflare.com, @contractors.com Selectors When you add a rule to your policy, you will be asked to specify the criteria/attributes you want users to meet. These attributes are available for all Access application types, including SaaS, self-hosted, and non-HTTP applications. Identity-based attributes are only checked when a user authenticates to Access, whereas non-identity attributes are polled continuously for changes during the user session. If you have configured SCIM provisioning, you can force a user to re-attest all attributes with Access whenever you revoke the user in the IdP or update their IdP group membership. SelectorDescriptionChecked at loginChecked continuously1Emailsyou@company.com✅❌Emails ending in@company.com✅❌External EvaluationAllows or denies access based on custom logic in an external API.✅❌IP ranges192.168.100.1/24 (supports IPv4/IPv6 addresses and CIDR ranges)✅✅CountryUses the IP address to determine country.✅✅EveryoneAllows, denies, or bypasses access to everyone.✅❌Common NameThe request will need to present a valid certificate with an expected common name.✅✅Valid CertificateThe request will need to present any valid client certificate.✅✅Service TokenThe request will need to present the correct service token headers configured for the specific application.✅✅Any Access Service TokenThe request will need to present the headers for any service token created for this account.✅✅Login MethodsChecks the identity provider used at the time of login.✅❌Authentication MethodChecks the multifactor authentication method used by the user, if supported by the identity provider.✅❌Identity provider groupChecks the user groups configured with your identity provider (IdP). This selector only displays if you use Microsoft Entra ID, GitHub, Google, Okta, or an IdP that provisions groups with SCIM.✅❌SAML GroupChecks a SAML attribute name / value pair. This selector only displays if you use a generic SAML identity provider.✅❌OIDC ClaimChecks an OIDC claim name / value pair. This selector only displays if you use a generic OIDC identity provider.✅❌Device postureChecks device posture signals from the WARP client or a third-party service provider.✅✅WarpChecks that the device is connected to WARP, including the consumer version.✅✅GatewayChecks that the device is connected to your Zero Trust instance through the WARP client.✅✅ 1 For SaaS applications, Access can only enforce policies at the time of initial sign on and when reissuing the SaaS session. Once the user has authenticated to the SaaS app, session management falls solely within the purview of the SaaS app. Order of execution Policies are evaluated based on their action type and ordering. Bypass and Service Auth policies are evaluated first, from top to bottom as shown in the UI. Then, Block and Allow policies are evaluated based on their order. For example, if you have a list of policies arranged as follows: Allow A Block B Service Auth C Bypass D Allow E The policies will execute in this order: Service Auth C > Bypass D > Allow A > Block B > Allow E. Once a user matches an Allow or Block policy, evaluation stops and no subsequent policies can override the decision. Common misconfigurations If you add any of the following rules to an Allow policy, anyone will be able to access your application. Include everyone Rule typeSelectorValueIncludeEveryoneEveryone Include all valid emails Rule typeSelectorValueIncludeLogin MethodsOne-time PIN Was this helpful? Edit page Last updated: Feb 27, 2025 Previous Managed service providers (MSPs) Next Manage Access policies Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
