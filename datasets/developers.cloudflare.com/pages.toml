title = "Set up 1.1.1.1 on Android · Cloudflare 1.1.1.1 docs"
description = "1.1.1.1: Faster Internet is the preferred method of setting up 1.1.1.1 DNS resolver and 1.1.1.1 for Families. It allows you to automatically configure your phone to use 1.1.1.1 on any network you connect to."
full_description = 'Products … 1.1.1.1 Set up Android {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/1.1.1.1/","name":"1.1.1.1"}},{"@type":"ListItem","position":3,"item":{"@id":"/1.1.1.1/setup/","name":"Set up"}},{"@type":"ListItem","position":4,"item":{"@id":"/1.1.1.1/setup/android/","name":"Android"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Android 1.1.1.1: Faster Internet ↗ is the preferred method of setting up 1.1.1.1 DNS resolver and 1.1.1.1 for Families. It allows you to automatically configure your phone to use 1.1.1.1 on any network you connect to. The app also allows you to enable encryption for DNS queries or enable WARP mode, which keeps all your HTTP traffic private and secure, including your DNS queries to 1.1.1.1. You can select between the options available in the app settings. By default, 1.1.1.1: Faster Internet is configured to WARP mode. Set up 1.1.1.1: Faster Internet Download 1.1.1.1: Faster Internet from Google Play ↗ for free. Launch 1.1.1.1: Faster Internet and accept the Terms of Service. Toggle the WARP button to Connected. Install the VPN profile that allows your phone to connect securely to 1.1.1.1. Your connection to the Internet and your DNS queries are now protected. Enable 1.1.1.1 for Families Open 1.1.1.1: Faster Internet. Tap the menu button. Select Advanced > Connection options. In DNS settings > 1.1.1.1 for Families, select the option you want to use. Configure 1.1.1.1 manually Android 11 or later Android 11 or later versions support both DNS over TLS (DoT) and DNS over HTTPS (DoH). Go to Settings > Network & internet. Select Advanced > Private DNS. Select the Private DNS provider hostname option. Depending on what you want to configure, use one of the following DNS hostnames or IP addresses and select Save. Use 1.1.1.1 resolver one.one.one.one Or the corresponding IP address if your device requires it: IPv4: 1.1.1.1 or 1.0.0.1 IPv6: 2606:4700:4700::1111 or 2606:4700:4700::1001 Block malware with 1.1.1.1 for Families security.cloudflare-dns.com Or the corresponding IP address if your device requires it: IPv4: 1.1.1.2 or 1.0.0.2 IPv6: 2606:4700:4700::1112 or 2606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families family.cloudflare-dns.com Or the corresponding IP address if your device requires it: IPv4: 1.1.1.3 or 1.0.0.3 IPv6: 2606:4700:4700::1113 or 2606:4700:4700::1003 Android 9 or 10 Android 9 and Android 10 support DNS over TLS to secure your queries through encryption. In Android, this option is called Private DNS. It prevents your queries from being tracked, modified or surveilled by third-parties. Unlike previous versions of Android, this method also ensures 1.1.1.1 does not need to be configured for each new Wi-Fi network your smartphone joins. Go to Settings > Network & internet. Select Advanced > Private DNS. Select the Private DNS provider hostname option. Enter one.one.one.one and select Save. Or consider the following options if you want to use 1.1.1.1 for Families. Block malware with 1.1.1.1 for Families security.cloudflare-dns.com Or the corresponding IP address if your device requires it: IPv4: 1.1.1.2 or 1.0.0.2 IPv6: 2606:4700:4700::1112 or 2606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families family.cloudflare-dns.com Or the corresponding IP address if your device requires it: IPv4: 1.1.1.3 or 1.0.0.3 IPv6: 2606:4700:4700::1113 or 2606:4700:4700::1003 Previous Android versions Before making changes, take note of any DNS addresses you might have and save them in a safe place in case you need to use them later. Open Settings > Wi-Fi. Press down and hold the name of the network you are currently connected to. Select Modify Network. Select the checkbox Show Advanced Options. Change the IP Settings to Static. Depending on what you want to configure, choose one of the following DNS addresses for IPv4: Use 1.1.1.1 resolver 1.1.1.11.0.0.1 Block malware with 1.1.1.1 for Families 1.1.1.21.0.0.2 Block malware and adult content with 1.1.1.1 for Families 1.1.1.31.0.0.3 Depending on what you want to configure, choose one of the following DNS addresses for IPv6: Use 1.1.1.1 resolver 2606:4700:4700::11112606:4700:4700::1001 Block malware with 1.1.1.1 for Families 2606:4700:4700::11122606:4700:4700::1002 Block malware and adult content with 1.1.1.1 for Families 2606:4700:4700::11132606:4700:4700::1003 Select Save. You may need to disconnect from the Wi-Fi and reconnect for the changes to take place. NoteSetting up a static IP address to configure a DNS server may prevent you from connecting to some public Wi-Fi networks that use captive portals — these are the web pages some wireless networks employ to let users log in and use their services.If you are experiencing connectivity issues related to captive portals: Remove the static IP addresses from the device or disable the 1.1.1.1 app. Connect to the Wi-Fi network. Once the connection has been established, re-add the static IP addresses or enable the 1.1.1.1 app. Was this helpful? Edit page Last updated: Aug 13, 2024 Previous Set up Next Azure Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
