description = "Encrypt traffic between Cloudflare and your origin web server and reduce origin bandwidth consumption."
full_description = 'Products … SSL/TLS Origin server Cloudflare origin CA {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/products/","name":"Products"}},{"@type":"ListItem","position":2,"item":{"@id":"/ssl/","name":"SSL/TLS"}},{"@type":"ListItem","position":3,"item":{"@id":"/ssl/origin-configuration/","name":"Origin server"}},{"@type":"ListItem","position":4,"item":{"@id":"/ssl/origin-configuration/origin-ca/","name":"Cloudflare origin CA"}}]} class t extends HTMLElement{constructor(){super(),this.isManualToggle=!1,this.breadcrumbs=null,this.mainBemClass=null,this.totalWidth=0,this.resizeObserver=null,this.handleTruncatedButtonClick=()=>{this.breadcrumbs?.classList.remove("is-truncated"),this.isManualToggle=!0},this.mainBemClass=this.dataset.mainBemClass||null;const e=this.dataset.id;!("truncated"in this.dataset)||!e||(this.breadcrumbs=document.getElementById(e),this.initializeCrumbs(),this.setupResizeObserver())}initializeCrumbs(){this.breadcrumbs?.querySelectorAll(`.${this.mainBemClass}__crumb`)?.forEach(s=>{this.totalWidth+=s.offsetWidth})}setupResizeObserver(){this.resizeObserver=new ResizeObserver(e=>{e.forEach(s=>{this.checkOverflow(s.target.clientWidth)})}),this.breadcrumbs&&this.resizeObserver.observe(this.breadcrumbs)}connectedCallback(){this.showHiddenCrumbs()}disconnectedCallback(){this.resizeObserver&&this.breadcrumbs&&(this.resizeObserver.unobserve(this.breadcrumbs),this.resizeObserver.disconnect())}toggleTruncated(e){this.breadcrumbs?.classList.toggle("is-truncated",e)}showHiddenCrumbs(){const e=this.breadcrumbs?.querySelector(`.${this.mainBemClass}__truncated-button`);e?.removeEventListener("click",this.handleTruncatedButtonClick),e?.addEventListener("click",this.handleTruncatedButtonClick.bind(this))}checkOverflow(e){const s=this.totalWidth>e&&!this.isManualToggle;this.toggleTruncated(s),s||(this.isManualToggle=!1)}}customElements.get("astro-breadcrumbs")||customElements.define("astro-breadcrumbs",t);Cloudflare origin CA If your origin only receives traffic from proxied records, use Cloudflare origin CA certificates to encrypt traffic between Cloudflare and your origin web server and reduce bandwidth consumption. Once deployed, these certificates are compatible with Strict SSL mode. For more background information on origin CA certificates, refer to the introductory blog post ↗. NoteUsing Cloudflare origin CA certificates does not prevent you from using delegated DCV. Availability Free Pro Business Enterprise Availability Yes Yes Yes Yes Deploy an Origin CA certificate 1. Create an Origin CA certificate To create an Origin CA certificate in the dashboard: Log in to the Cloudflare dashboard and select an account. Choose a domain. Go to SSL/TLS > Origin Server. Select Create Certificate. Choose either: Generate private key and CSR with Cloudflare: Private key type can be RSA or ECC. Use my private key and CSR: Paste the Certificate Signing Request into the text field. List the hostnames (including wildcards) the certificate should protect with SSL encryption. The zone apex and first level wildcard hostname are included by default. Choose a Certificate Validity period. Select Create. Choose the Key Format: Servers using OpenSSL — like Apache and NGINX — generally expect PEM files (Base64-encoded ASCII), but also work with binary DER files. Servers using Windows and Apache Tomcat require PKCS#7 (a .p7b file). Copy the signed Origin Certificate and Private Key into separate files. For security reasons, you cannot see the Private Key after you exit this screen. Select OK. NoteFor details about working with certificates programmatically, refer to API calls. 2. Install Origin CA certificate on origin server To add an Origin CA certificate to your origin web server Upload the Origin CA certificate (created in Step 1) to your origin web server. Update your web server configuration: Apache httpd ↗ GoDaddy Hosting ↗ Microsoft IIS 7 ↗ Microsoft IIS 8 and 8.5 ↗ Microsoft IIS 10 ↗ NGINX ↗ Apache Tomcat ↗ Amazon Web Services ↗ Apache cPanel ↗ Ubuntu Server with Apache2 ↗ NoteIf you do not see your server in the list above, search the DigiCert documentation ↗ or contact your hosting provider, web admin, or server vendor. (Required for some) Upload the Cloudflare CA root certificate to your origin server. This can also be referred to as the certificate chain. Enable SSL and port 443 at your origin web server. 3. Change SSL/TLS mode After you have installed the Origin CA certificate on your origin web server, update the SSL/TLS encryption mode for your application. If all your origin hosts are protected by Origin CA certificates or publicly trusted certificates: Go to SSL/TLS. For SSL/TLS encryption mode, select Full (strict). If you have origin hosts that are not protected by certificates, set the SSL/TLS encryption mode for a specific application to Full (strict) by using a Page Rule. WarningSite visitors may see untrusted certificate errors if you pause Cloudflare or disable proxying on subdomains that use Cloudflare origin CA certificates. These certificates only encrypt traffic between Cloudflare and your origin server, not traffic from client browsers to your origin. Revoke an Origin CA certificate If you misplace your key material or do not want a certificate to be trusted, you may want to revoke your certificate. You cannot undo this process. To prevent visitors from seeing warnings about an insecure certificate, you may want to set your SSL/TLS encryption to Full or Flexible before revoking your certificate. Do this globally via the Cloudflare dashboard ↗ or for a specific hostname via a Page Rule. To revoke a certificate: Log in to the Cloudflare dashboard and select an account. Choose a domain. Go to SSL/TLS > Origin Server. In Origin Certificates, choose a certificate. Select Revoke. Additional details Cloudflare Origin CA root certificate Some origin web servers require upload of the Cloudflare Origin CA root certificate or certificate chain. Use the following links to download either an ECC or an RSA version and upload to your origin web server: Cloudflare Origin ECC PEM (do not use with Apache cPanel) Cloudflare Origin RSA PEM Hostname and wildcard coverage Certificates may be generated with up to 200 individual Subject Alternative Names (SANs). A SAN can take the form of a fully-qualified domain name (www.example.com) or a wildcard (*.example.com). You cannot use IP addresses as SANs on Cloudflare origin CA certificates. Wildcards may only cover one level, but can be used multiple times on the same certificate for broader coverage (for example, *.example.com and *.secure.example.com may co-exist). API calls To automate processes involving Origin CA certificates, use the following API calls. To authenticate, use either Origin CA Keys or an API token with Permissions that include Zone-SSL and Certificates-Edit. OperationMethodEndpointList certificatesGETcertificates?zone_id=<<ZONE_ID>>Create certificatePOSTcertificatesGet certificateGETcertificates/<<ID>>Revoke certificateDELETEcertificates/<<ID>> Troubleshooting If you find NET::ERR_CERT_AUTHORITY_INVALID or other issues after setting up Cloudflare origin CA, refer to troubleshooting. Was this helpful? Edit page Last updated: Jan 23, 2025 Previous SSL/TLS Recommender Next Troubleshooting Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
