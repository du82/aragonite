he costly egress bandwidth fees associated with typical cloud storage services. You can use R2 for multiple scenarios, including but not limited to: Storage for cloud-native applications Cloud storage for web content Storage for podcast episodes Data lakes (analytics and big data) Cloud storage output for large batch processes, such as machine learning model artifacts or datasets Get started Browse the examples Features Location Hints Location Hints are optional parameters you can provide during bucket creation to indicate the primary geographical location you expect data will be accessed from. Use Location Hints CORS Configure CORS to interact with objects in your bucket and configure policies on your bucket. Use CORS Public buckets Public buckets expose the contents of your R2 bucket directly to the Internet. Use Public buckets Bucket scoped tokens Create bucket scoped tokens for granular control over who can access your data. Use Bucket scoped tokens Related products Workers A serverless ↗ execution environment that allows you to create entirely new applications or augment existing ones without configuring or maintaining infrastructure. Stream Upload, store, encode, and deliver live and on-demand video with one API, without configuring or maintaining infrastructure. Images A suite of products tailored to your image-processing needs. More resources Pricing Understand pricing for free and paid tier rates. Discord Ask questions, show off what you are building, and discuss the platform with other developers. Twitter Learn about product announcements, new tutorials, and what is new in Cloudflare Workers. Was this helpful? Edit page Last updated: Jan 30, 2025 Next Get started Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
