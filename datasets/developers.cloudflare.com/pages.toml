ld exist does not"}, // 8 { name: "NotAuth", description: "Not Authorized"} // 9 ]; const response = JSON.parse(resultText); if (response.Status !== 0) { return errors[response.Status].name; } const outputData = []; let cacheTTL = 0; for (const i in response.Answer) { outputData.push(response.Answer[i].data); const ttl = response.Answer[i].TTL; cacheTTL = Math.min(cacheTTL || ttl, ttl); } const outputString = outputData.join(','); if (useCache) { cache.put(cacheBinKey, outputString, Math.max(cacheTTL, minCacheTTL)); } return outputString;} Using 1.1.1.1 When you feed the function NSLookup a record type and a domain, you will get a DNS record value in the cell you called NSLookup. To limit the number of DNS lookups and speed up the results (especially in larger Google Sheets), you can cache the returned DNS record value. Both the cache usage and the cache TTL can be controlled in arguments 3 and 4, respectively. Supported DNS record types A AAAA CAA CNAME DS DNSKEY MX NS NSEC NSEC3 RRSIG SOA TXT For example, typing: NSLookup(B1, B2) Or - depending on your regional settings - you may have to use this formula: NSLookup(B1; B2) Returns 198.41.214.162, 198.41.215.162 Was this helpful? Edit page Last updated: Oct 24, 2024 Previous SLA and support Next DNS over Discord Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
