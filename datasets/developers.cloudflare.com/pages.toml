provider to your gateway. AI Gateway offers multiple endpoints for each Gateway you create - one endpoint per provider, and one Universal Endpoint. To use AI Gateway, you will need to create your own account with each provider and provide your API key. AI Gateway acts as a proxy for these requests, enabling observability, caching, and more. Additionally, AI Gateway has a WebSockets API which provides a single persistent connection, enabling continuous communication. This API supports all AI providers connected to AI Gateway, including those that do not natively support WebSockets. Below is a list of our supported model providers: Amazon Bedrock Anthropic Azure OpenAI Cartesia Cerebras Cohere DeepSeek ElevenLabs Google AI Studio Google Vertex AI Grok Groq HuggingFace Mistral AI OpenAI OpenRouter Perplexity Replicate Universal Endpoint Workers AI If you do not have a provider preference, start with one of our dedicated tutorials: OpenAI Workers AI View analytics Now that your provider is connected to the AI Gateway, you can view analytics for requests going through your gateway. Your AI Gateway dashboard shows metrics on requests, tokens, caching, errors, and cost. You can filter these metrics by time and provider-type. To view analytics in the dashboard: Log into the Cloudflare dashboard ↗ and select your account. Go to AI > AI Gateway. Make sure you have your gateway selected. NoteThe cost metric is an estimation based on the number of tokens sent and received in requests. While this metric can help you monitor and predict cost trends, refer to your provider’s dashboard for the most accurate cost details. Next steps Learn more about caching for faster requests and cost savings and rate limiting to control how your application scales. Explore how to specify model or provider fallbacks for resiliency. Learn how to use low-cost, open source models on Workers AI - our AI inference service. Was this helpful? Edit page Last updated: Jan 16, 2025 Previous Overview Next Uni