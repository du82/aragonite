-breadcrumbs",t);Replicate Replicate ↗ runs and fine tunes open-source models. Endpoint https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/replicate URL structure When making requests to Replicate, replace https://api.replicate.com/v1 in the URL you’re currently using with https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/replicate. Prerequisites When making requests to Replicate, ensure you have the following: Your AI Gateway Account ID. Your AI Gateway gateway name. An active Replicate API token. The name of the Replicate model you want to use. Example cURL Requestcurl https://gateway.ai.cloudflare.com/v1/{account_id}/{gateway_id}/replicate/predictions \ --header 'Authorization: Token {replicate_api_token}' \ --header 'Content-Type: application/json' \ --data '{ "input": { "prompt": "What is Cloudflare?" } }' Was this helpful? Edit page Last updated: Jan 21, 2025 Previous Perplexity Next Tutorials Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'''
