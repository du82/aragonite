bs",t);Costs Supported Providers AI Gateway currently supports cost metrics from the following providers: Anthropic Azure OpenAI Cohere Google AI Studio Groq Mistral OpenAI Perplexity Replicate Cost metrics are only available for endpoints where the models return token data and the model name in their responses. NoteThe cost metric is an estimation based on the number of tokens sent and received in requests. While this metric can help you monitor and predict cost trends, refer to your provider’s dashboard for the most accurate cost details. CautionProviders may introduce new models or change their pricing. If you notice outdated cost data or are using a model not yet supported by our cost tracking, please submit a request ↗ Custom costs AI Gateway allows users to set custom costs when operating under special pricing agreements or negotiated rates. Custom costs can be applied at the request level, and when applied, they will override the default or public model costs. For more information on configuration of custom costs, please visit the Custom Costs configuration page. Was this helpful? Edit page Last updated: Sep 26, 2024 Previous WebSockets API Next Analytics Cloudflare DashboardDiscordCommunityLearning CenterSupport Portal // eslint-disable-next-line @typescript-eslint/no-unused-vars function OptanonWrapper() {} Cookie Settings'
