["https://developers.googleblog.com/en/everything-google-wallet-at-io-24"]
title = """
Everything you need to know about Google Wallet                        - Google Developers Blog"""
description = "All the new features and enhancements Google Wallet announced at I/O this year, focused on security, wearables, push notifications, and more."
full_description = "We're working on making the Google Wallet API a more comprehensive, more convenient, and more approachable platform for offering digital valuables of all kinds to more users in more places. We're also focused on enabling you to do more with Google Wallet in conjunction with other Google products and services, because the Google experience is better when we work together to bring the magic of Google to you and your users. Let’s take a look at all the new features and enhancements we announced at Google I/O this year in different areas, focused on security, wearables, push notifications, Auto Linked Passes, Generic Private Passes, Gmail integration, and developer experience. To provide your users more opportunities to leverage their digital credentials, Android is introducing an extension to the Android Credential Manager API to allow users to use digital credentials, such as government-issued digital IDs from Android wallet apps, including Google Wallet. App developers will soon be able to securely verify users' details from their digital credential by requesting attributes like a user's age, legal name, legal address and so on, through the API. Since you’ll be able to limit your request to only the info needed for your use case, instead of users’ entire ID, privacy is built right in. When sharing ID data from the Google Wallet app, users will always review and need to authorize the action within the Google Wallet app before ID data is shared. As the API is built on Android Credential Manager, any app that contains digital credentials compatible with the API can supply them through the API. Meaning as a developer, you can receive credentials from whichever app a user chooses to store them with only a single integration. The API is currently in a closed alpha stage. If you’re looking to pilot and test, please indicate interest through this sign-up form. We’ll open up to more developers this year, and plan to get to general availability in 2025. If you’re using Wear OS wearables, using your passes stored in Google Wallet will now be easier than ever, with expanded support for passes on Wear OS devices."
