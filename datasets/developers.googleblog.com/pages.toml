["https://developers.googleblog.com/en/beyond-the-chatbot-agentic-ai-with-gemma"]
title = """
Beyond the Chatbot: Agentic AI with Gemma                        - Google Developers Blog"""
description = "Learn about Agentic AI with Gemma and how to build a dynamic lore generator, expanding AI functionality beyond reactive chatbots."
full_description = '''Gemma is a family of lightweight, generative artificial intelligence (AI) open models, built from the same research and technology used to create the Gemini models. In a blog post last year, we showcased a text-based adventure game creation using Gemma. In this blog post, you will learn how to use Gemma with a form of AI called Agentic AI, which offers a different way to use Large Language Models (LLMs). Most common AIs today are reactive. They respond to specific commands, like a smart speaker playing music when asked. They’re useful, but can only do what they’re told. In contrast, Agentic AI is proactive and autonomous. It makes its own decisions to reach goals. A key feature is using external tools like search engines, specialized software, and other programs to get information beyond their inherent knowledge base. This lets Agentic AI work and solve problems very independently and effectively. Here, we’ll provide a practical guide to constructing a Gemma 2 based Agentic AI system, covering key technical concepts like "Function Calling", "ReAct" and "Few-shot prompting". This AI system will serve as a dynamic lore generator for a fictional game, actively expanding its history and providing a distinct, perpetually evolving narrative landscape for players. Before we dive into the coding, let's understand Gemma's agentic AI capabilities. You can experiment directly with it through Google AI Studio. Google AI Studio offers several Gemma 2 models. The 27B model is recommended for the best performance, but the smaller model like 2B can also be used as you can see below. In this example, we tell Gemma that there’s a get_current_time() function and ask Gemma to tell us the time in Tokyo and Paris. This result shows that Gemma 2 does not suggest calling the get_current_time() function. This model capability is called "Function Calling", which is a key feature for enabling AI to interact with external systems and APIs to retrieve data. Gemma’s built-in function calling capabilities are limited, which limits its ability to act as an agent. However, its strong instruction-following capabilities can be used to compensate for this missing functionality. Let’s see how we can harness these capabilities to expand Gemma’s functionality.'''
year_published = 2025
