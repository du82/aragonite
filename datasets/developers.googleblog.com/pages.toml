["https://developers.googleblog.com/en/celebrating-flutters-production-era"]
title = """
Celebrating Flutter’s “Production Era”                        - Google Developers Blog"""
description = "Explore how Flutter is empowering developers to build high-quality, production-ready apps with a focus on performance, user experience, and a thriving ecosystem."
full_description = "Just over six years ago, we unveiled Flutter 1.0. Today, at #FlutterInProduction, we’re celebrating how far we’ve come — from the immense support we’ve received from thousands of contributors in the community, to the widespread adoption of Flutter as a production-grade app framework for building multi-platform app experiences. If you haven’t experienced Flutter yet, we invite you to try it! As we shared today, you’d be joining a big group: Flutter has over 1 million monthly active developers across the globe, and powers nearly 30% of all new iOS apps. More than 90 thousand developers actively participate in Flutter Meetups across more than sixty countries. And if you want input on designing or building a new successful Flutter app, we have a large and growing list of Flutter Consultants ready to help you. It’s been an incredible journey, starting in 2014 (in what we now call our experimental era) as a Google experiment codenamed “Sky.” Before Flutter, compromises were inevitable. Many developers have become skeptical that any framework can truly deliver a premium experience across multiple platforms. With the launch of Flutter 1.0 in 2018 we had a clear mission to resolve that technology dilemma: We aimed to empower developers with the ultimate app framework for crafting beautiful, high-performance user interfaces across all platforms. Also, to enable developers to reach all customers with high-quality apps on all the platforms that customers care about, but with lower cost and in less time. Our focus has remained constant through Flutter’s growth era, even as we’ve added support for the six major platforms across mobile, web, and desktop — and continue to push beyond, with work like Toyota’s use of Flutter for infotainment systems. We’re now in the “production era,” and we’re celebrating that with #FlutterInProduction! This event spotlights the achievements of developers using Flutter in real-world applications. None of this would be possible without our amazing community of over 1,400 contributors, more than 10,000 package publishers authoring over 50,000 packages, and passionate Flutter content creators and enthusiasts."
