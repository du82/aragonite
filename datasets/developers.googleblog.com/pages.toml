["https://developers.googleblog.com/ko"]
title = """
Home                        - Google Developers Blog"""
full_description = "올해 Google I/O는 5월 20일부터 21일까지 진행됩니다. 라이브 스트리밍을 통해 Android, AI, 웹, 클라우드에 대한 최신 정보 및 소식을 확인해 보세요. Google I/O 웹사이트에서 등록할 수 있습니다. 이미지 캡션, OCR, 다양한 크기의 객체 감지와 같은 기능을 제공하도록 업그레이드된 비전 언어 모델 PaliGemma 2 mix가 출시되었습니다. 자체적으로 의사 결정을 내리고 외부 도구를 활용해 목표를 달성할 수 있는 일종의 AI인 Gemma 2 기반 Agentic AI 시스템을 구축하기 위한 실용적인 가이드입니다. 이 AI 시스템을 통해 가상의 게임 세계를 위한 동적 콘텐츠를 생성할 수 있습니다. 현재 프로덕션 준비 단계에 있으며 더 높은 속도 한도, 향상된 성능, 단순화된 요금제를 자랑하는 Gemini 2.0 Flash 출시를 포함해 Gemini 2.0 모델 제품군의 중요한 업데이트가 이루어지고 있습니다. 개발자는 오늘 바로 Gemini 2.0 Pro의 업데이트된 시험용 버전에 대한 테스트를 시작할 수도 있습니다. 또한 특히 대규모 워크로드에 적합하게 설계된 Gemini 2.0 Flash-Lite라는 새로운 버전도 다음 주에 선보일 예정입니다. Gemini API 개발자 대회 수상자들은 AI 기반 개인 비서부터 접근성과 창의성을 위한 도구까지, 영향력 있는 솔루션을 만드는 데 있어 Gemini API의 잠재력을 잘 보여주었습니다. Gemini 2.0 Flash-Lite is now generally available in the Gemini API for production use in Google AI Studio and for enterprise customers on Vertex AI. 2.0 Flash-Lite offers improved performance over 1.5 Flash across reasoning, multimodal, math and factuality benchmarks. For projects that require long context windows, 2.0 Flash-Lite is an even more cost-effective solution, with simplified pricing for prompts more than 128K tokens. 이미지 캡션, OCR, 다양한 크기의 객체 감지와 같은 기능을 제공하도록 업그레이드된 비전 언어 모델 PaliGemma 2 mix가 출시되었습니다."
