["https://developers.googleblog.com/en/configure-google-pay-payment-options"]
title = """
Want a smoother checkout with Google Pay? Configure your payment options!                        - Google Developers Blog"""
description = "Configure accepted payment methods for Google Pay, with options for authentication methods, card networks, and card types, and upcoming features for enhanced control and customization."
full_description = "Integration of Google Pay into your app or website is a great way to make checkout easier and faster for your customers. You can also modify the payment methods that Google Pay provides at checkout. This post guides you to configure the accepted payment methods for your Google Pay integration. We explore the range of options, along with card networks, authentication methods, and card types. You can learn how to select the best configuration to meet your business requirements and maximize security for you and your customers. You can set up the Google Pay API to only allow certain card types to be accepted by setting the CardParameters. You need to configure the following: Card Networks: Choose card networks that you can accept. AMEX, DISCOVER, INTERAC, JCB, MASTERCARD, and VISA are the supported networks. Assurance Details (optional): You can choose to request information about the validation performed on the returned payment data. As a best practice, we recommend you to request assurance details to distinguish between a Funding Primary Account Number (FPAN) and a Device Primary Account Number (DPAN). DPAN is a tokenized version of the FPAN used in mobile payments or digital wallets to help prevent fraud and credit card number exposure. Authentication Methods: PAN_ONLY is the most widely supported option, but CRYPTOGRAM_3DS provides superior security and can qualify for liability shift with certain card networks. It's highly recommended to enable both authentication methods. Make sure to check authentication options with your processor to see which ones are supported. Card Networks: Your choices depend on your payment processor's capabilities. Make sure that you support the networks that align with your processing setup. Card Types: If you've specific business requirements to exclude prepaid or credit cards, use the respective options to control their acceptance. Assurance Details: If you want assurance details, then you can get information on the account verification and the cardholder authentication. If both are true, you don’t have to step up the returned credentials."
