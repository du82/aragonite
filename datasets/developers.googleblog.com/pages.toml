["https://developers.googleblog.com/en/whats-new-in-google-pay-io-2024"]
title = """
What’s new in Google Pay (I/O 2024)                        - Google Developers Blog"""
description = "We’re adding new features to Google Pay so you can offer richer and more accessible payment experiences for your customers, and improved APIs to simplify your payments integrations."
full_description = '''Today, hundreds of millions of people use Google Pay to securely check out when shopping with their favorite retailers in more than 180 countries. During Google I/O 2024, we shared some of the new features we’re adding to Google Pay and discussed how you can use them to offer richer and more accessible payment experiences for your customers, and improved APIs to simplify your payments integrations. Read on for a summary of what we covered during the event, or check out the recording of our session on YouTube: Everything you need to know about Google Pay & Wallet. We recently introduced support for “buy now, pay later”, with Affirm and Zip in the US. Industry studies have shown “buy now, pay later” leads to better customer acquisition, conversion, and retention—helping to drive your business goals. For most merchants, "buy now, pay later" can be surfaced as an option for users right away, and you can manage the integration from the Google Pay & Wallet Console. During last year's I/O, we introduced the dynamic Google Pay button which displays the card network and last four digits for the customer’s last used form of payment directly on the button. We have seen this context drive consistent conversion improvements with increases of up to 40% in the number of transactions. We are upgrading the Google Pay button to include card art and the name of the issuer providing a richer and more delightful experience for your users, and we will extend this dynamic experience to non-button UI implementations, providing important context everywhere Google Pay is offered. These changes will begin rolling out in the US later this year. We are also adding dynamic copy to various Google Pay button types on the Web. This feature displays user card identifying information such as the last four digits of the card number on the button surface. Google Pay offers merchants zero fraud liability for eligible transactions by leveraging the security capabilities of leading payment networks. We have broadened this benefit by rolling out merchant liability shift for eligible Visa online transactions using Google Pay. Enabling this liability shift is quick and easy in the Google Pay & Wallet Console.'''
