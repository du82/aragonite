["https://developers.googleblog.com/en/streamlining-llm-inference-at-the-edge-with-tflite"]
title = """
Streamlining LLM Inference at the Edge with TFLite                        - Google Developers Blog"""
description = "XNNPack, the default TensorFlow Lite CPU inference engine, has been updated to improve performance and memory management, allow cross-process collaboration, and simplify the user-facing API."
full_description = "XNNPack is the default TensorFlow Lite CPU inference engine for all models. It delivers game changing speedups across mobile, desktop, and Web platforms. One of the optimizations employed in XNNPack is repacking the static weights of the Convolution, Depthwise Convolution, Transposed Convolution, and Fully Connected operators into an internal layout optimized for inference computations. During inference, the repacked weights are accessed in a sequential pattern that is friendly to the processors’ pipelines. The inference latency reduction comes at a cost: repacking essentially creates an extra copy of the weights inside XNNPack. Previous efforts have been made to reduce that cost by adding an in-memorycache to XNNPack. This cache allows sharing the packed weights between independent TFLite interpreters that would run the same model independently. TFLite XNNPack delegate implementation has been improved to address some of the shortcomings of the existing cache. 1. The cache lives in anonymous memory, which incurs swapping to disk in case of memory pressure, leading to poor performance. 3. Because repacking reads the original TFLite weights and writes to a new buffer, this leads to a high peak memory usage during the packing. 4. It requires tedious steps and careful lifecycle management to properly enable caching through XNNPack delegate. XNNPack has been updated and provides an interface that lets you implement a weight cache provider. A weight cache provider behaves as a dictionary that XNNPack will fill and query in order to access packed buffers. Here are its main functions. The interactions between XNNPack and the weight cache provider are illustrated in the following diagram. The TFLite Delegate now uses this new interface and has its own weight cache provider. This provider is capable of saving and loading the packed weights directly to / from disk. TFLite has been leveraging flatbuffer and file-backed memory mapping for a long time. We are filling the gap here by leveraging the same technique, for the following advantages."
year_published = 2024
year_updated = 2024
