["https://developers.googleblog.com/pt-br/ai-edge-torch-generative-api-for-custom-llms-on-device"]
title = """
AI Edge Torch Generative API for Custom LLMs on Device                        - Google Developers Blog"""
description = "AI Edge Torch Generative API enables developers to bring powerful new capabilities on-device, such as summarization, content generation, and more."
full_description = "É um grande prazer para nós permitir que os desenvolvedores forneçam novos modelos de IA generativa no dispositivo para dispositivos de borda. Para atender a essa necessidade, anunciamos a API AI Edge Torch Generative, com a qual os desenvolvedores podem criar LLMs de alto desempenho no PyTorch para implantação usando o ambiente de execução do TensorFlow Lite (TFLite). Esta é a segunda de uma série de postagens que abordam os lançamentos para desenvolvedores do Google AI Edge. A primeira postagem da série introduziu o Google AI Edge Torch, que ativa a inferência de alto desempenho de modelos do PyTorch em dispositivos móveis usando o ambiente de execução TFLite. A API AI Edge Torch Generative permite que os desenvolvedores forneçam novos recursos avançados no dispositivo, tais como resumo, geração de conteúdo e muito mais. Já permitimos que os desenvolvedores forneçam alguns dos LLMs mais populares para dispositivos usando a API MediaPipe LLM Inference. Agora, temos o grande prazer de permitir que os desenvolvedores forneçam qualquer modelo com suporte no dispositivo com um ótimo desempenho. A versão inicial da API AI Edge Torch Generative oferece o seguinte: Nesta postagem do blog, nos aprofundaremos no desempenho, na portabilidade, na experiência de criação do desenvolvedor, no pipeline de inferência completo e no conjunto de ferramentas de depuração. Outras documentações e exemplos estão disponíveis aqui. Como parte de nosso trabalho para fazer com que alguns dos LLMs mais populares funcionem perfeitamente por meio da API MediaPipe LLMInference, nossa equipe criou vários transformers escritos de forma totalmente manual e com desempenho de última geração no dispositivo (blog da API MediaPipe LLM Inference). Alguns temas emergiram desse trabalho: como representar a atenção de forma eficaz, o uso da quantização e a importância de uma boa representação da Cache de KV. A API generativa torna tudo isso fácil de expressar (como veremos na próxima seção) e ainda atinge um desempenho que é 90% mais alto do que o de nossas versões escritas manualmente, com uma velocidade de desenvolvimento muito mais alta."
