["https://developers.googleblog.com/en/firebase-demo-day-24"]
title = """
Learn to build and run AI powered apps at Firebase Demo Day ‘24                        - Google Developers Blog"""
description = "Learn to use Firebase to build, run, test, and monitor AI features, and add cutting-edge functionality to your apps."
full_description = "We just released 8 bite sized demo videos to showcase how Firebase helps you build and run AI-powered apps. We’ll show you how to use new Firebase products and features like Firebase Genkit, Vertex AI in Firebase, Gemini in Firebase and Firebase App Hosting, to build AI features into your existing applications, monitor their performance, and create great experiences for your users. To bring these concepts to life, we'll take you on an app dev journey through Compass, our sample travel app. We’ll demonstrate how you can use Firebase to create features like personalized recommendations, smart itineraries, AI-powered chatbots, and more. Follow along as we highlight how you can leverage Firebase tools to add the same cutting-edge functionality to your own apps. Watch as we transform our travel app with the power of Firebase and AI. Our build demos show you how to build and deploy AI features with new Firebase products like Vertex AI, Genkit and Firebase Hosting, all while leveraging Firebase's fully managed infrastructure to get to market quickly and securely. Integrate the power of Gemini directly into your Android app using the native Vertex AI in Firebase SDK for Android to make calls to Gemini. Use the native Vertex AI in Firebase SDK for Apple platforms to make calls to Gemini, construct a chat, and run inference on files stored in Firebase Storage. Connect your app's data for personalized experiences and improved responses by implementing Retrieval Augmented Generation (RAG) using Firebase, Genkit, and Gemini. Enhance your app's functionality with Genkit by using tool calling to connect your app with external APIs, such as a weather service, to provide users with real-time information. Call a Genkit flow from a Next.js application and deploy it seamlessly to Firebase App Hosting to launch new features quickly. Use Firebase to launch, monitor, and continuously improve our AI-powered travel app. Our run demos show you how to gain valuable insights with AI Monitoring, automate testing with the AI Testing Agent, and even personalize user experiences with Remote Config, all to help you deliver the best possible app experience."
