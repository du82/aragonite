description = "AI Edge Torch Generative API enables developers to bring powerful new capabilities on-device, such as summarization, content generation, and more."
full_description = "我们很高兴能让开发者将全新的设备端生成式 AI 模型无缝应用到边缘设备上。为了满足这一需求，我们推出了 AI Edge Torch 生成式 API。该 API 可使开发者使用 PyTorch 创作高性能的 LLM，并利用 TensorFlow Lite (TFLite) 运行时进行部署。本文是 Google AI Edge 开发者版本系列博文中的第二篇文章。该系列的第一篇文章对 Google AI Edge Torch 进行了简单介绍，该产品可以在使用 TFLite 运行时的移动设备上实现高性能的 PyTorch 模型推理。 AI Edge Torch 生成式 API 使得开发者能够在设备端实现强大的新功能，比如摘要生成、内容创造等。我们已经通过 MediaPipe LLM 推理 API，让开发者能够将一些最热门的 LLM 部署到设备上。现在，我们非常兴奋地宣布，AI Edge Torch 生成式 API 将使开发者能够以极高的性能将任何受支持的模型部署至设备端。该 API 的初始版本提供以下功能： 在本篇博文中，我们将深入探讨性能、可移植性、创作开发体验、端到端的推理流水线以及调试工具链。如需更多文档和示例，请参见此处。 我们致力于通过 MediaPipe LLM 推理 API 无缝运行一些最热门的 LLM，在此过程中，我们的团队创作了几个全手写的 Transformer，它们具有最先进的设备端性能水平（参见 MediaPipe LLM 推理 API 博客）。从这项工作中我们总结出几个关键主题：有效表示注意力机制的方式、量化的使用，以及构建高效 KV 缓存表示的重要性。生成式 API 能轻松地实现上述主题（后文会详细介绍），同时其性能还超过手写版本 90% 及以上，极大提高了开发者的工作效率。 基准测试是在设备的大核心上进行的，使用了 4 个 CPU 线程，是这些模型在所列设备上目前所知最快的 CPU 实现。 核心创作库提供常见 Transformer 模型（如仅编码器、仅解码器或编码器 - 解码器样式等）的基本模块。您能够借助此库从零开始创建模型，或者重新创作现有模型以提升性能。我们建议大多数用户选择重新创作，因为这样不需要进行训练/微调步骤。生成式 API 创作的核心优势包括："
