description = "Announcing the winners of the Gemini API Developer Competition, showcasing innovative applications across Android, Firebase, web, and more."
full_description = "在五月的 I/O 活动期间，我们向全球发起了开发者挑战，鼓励他们使用 Gemini API 开发变革性的应用程序，而收到的反馈令我们备受鼓舞：世界各地数以千计的开发者响应号召，为现有的应用程序添加 AI 驱动功能，或创造出突破可能性极限的 AI 导向型应用。 Jayu 是一款 AI 驱动的个人助手，展示了将 Gemini API 与创意开发相结合的巨大潜力。这款创新应用与多种应用程序兼容，从网页浏览器、代码编辑器、音乐流媒体到游戏等应有尽有。Jayu 不仅能够解读视觉信息、直接与应用界面互动，还能进行实时翻译，不仅彰显了 Gemini API 的强大功能，同时也彰显了开发者利用这一能力的卓越技巧。对我们来说，Jayu 不仅仅是一款获奖的应用，它让我们得以一窥 AI 融入生活并服务于我们的未来图景。 Vite Vere 通过为日常任务提供个性化指导，帮助认知障碍人士实现更大程度的独立。这款应用利用 Gemini 视觉理解和巧妙提示的方式令我们印象深刻，它能够一步步提供指导，帮助用户完成任务，提升用户独立生活的能力与个人技能。 Outdraw 以其独特的创意与 AI 融合吸引了我们，带来了只有 AI 才能实现的游戏体验。游戏让用户绘制出人类能够识别，但却难倒 AI 视觉理解的图像。通过将 AI 从合作伙伴转变为挑战对手，这款应用重新定义了 AI 在创意领域的角色。这便是 AI 最具创意的应用方式之一。 Prospera 是一款创新的 Flutter 应用，它利用 Gemini API 构建了一个实时 AI 销售指导工具。通过分析销售对话并提供即时反馈和绩效报告，Prospera 能借此帮助销售代表提升销售技能。这款应用展示了 Gemini 模型在应对实际商业挑战和促进职业发展方面的多样性。欲了解更多关于 Prospera 的信息以及我们选择它的原因，请查看 Flutter 博客。"
