["https://developers.googleblog.com/en/how-we-built-purrfect-code"]
title = """
How We Built Purrfect Code: A Puzzle Game for Developers                        - Google Developers Blog"""
description = "Purrfect Code is a sokoban style box pushing puzzler Purrfect based on Google tech (Flutter, IDX, FLAME, Firebase) and designed to be playable on web browsers. Open the game in Project IDX, earn badges for each level, and showcase your badges on your Developer Profile."
full_description = '''"Purrfect Code" is a new box-pushing programming puzzle game, powered by Flutter, Dart, and the Flame game engine and designed to challenge developers to solve puzzles by writing code. In "Purrfect Code," players are tasked with updating the programming of a janitor robot on Google's new space station headquarters where a shipment of cats has mistakenly arrived. The goal of the game is to help the robot safely round up boxes containing the cats and push them onto teleporter plates so they can get home. Players write JavaScript to control the robots movements while trying to discover efficient solutions to navigate through grid-based puzzles. The game is a fun way to explore coding, using your intelligence and creativity. Each level is focused on a programming concept and gently increases in complexity over the course of the five levels in the game. 4. Players are scored on the efficiency of their solutions including the number of spaces moved and the brevity of their code We chose to build "Purrfect Code" using Flutter and Dart, as they provide a powerful and flexible framework for creating multi-platform applications and games. Flutter's widget system and reactive programming model allowed us to create a responsive user interface for a variety of screen sizes in the browser. Dart's strongly-typed and object-oriented programming features made it easy to structure our code and keep our codebase clean. The Flame game engine, built on top of Flutter, offered a nice foundation of basic features needed for game development, allowing us to focus on our gameplay logic and the unique aspects of the game. Flutter and Flame were a clear choice for this project due to Purrfect Code’s nature as a unique game/app hybrid with both an IDE inspired UI and a game view with animated sprites and sound. Once we settled on the programming concept for the game, we needed to choose what programming language players would use. We wanted something familiar and popular among devs. Initially we considered using Python as the in-game programming language. However after some consideration, we decided to go with JavaScript to leverage the built-in JavaScript support provided by Chrome. By utilizing JavaScript, we could tap into the browser's native capabilities without the need to load an additional language interpreter. This decision not only simplified our development process, but also ensured a seamless experience for players, as the game could load quickly with minimal dependencies.'''
