["https://developers.redhat.com/cheat-sheets/10-tips-running-nodejs-applications-openshift"]
title = "10 tips for running Node.js applications on OpenShift | Red Hat Developer"
description = "When you start running Node.js applications in containers, you should adopt some best practices that improve efficiency and security. This cheat sheet offers tips for making the most of Node.js"
full_description = "Breadcrumb Red Hat cheat sheets 10 tips for running Node.js applications on OpenShift 10 tips for running Node.js applications on OpenShift Luke Holmquist Related topics: Node.js Related products: Red Hat build of Node.js Share: May 19, 2022 English Download Cheat sheet About When you start running Node.js applications in containers, you should adopt some best practices that improve efficiency and security. This cheat sheet offers tips for making the most of Node.js JavaScript applications on Red Hat OpenShift as well as other container environments: Don’t run as root. Use UBI containers. Try to use the most minimal image you can through two-stage builds. Don’t use npm start. Use health checks. Logging. Metrics. Externalize secrets. Don’t use privileged ports. Set memory limits. Excerpt Node.js developers need to know how to do logging in a cloud-native environment. In container development, writing logs out to disk does not generally make sense because of the extra steps needed to make the logs available outside the container—and they will be lost once the container is stopped.Logging to standard out (`stdout`) is more appropriate for the cloud, and structured logging (for example, using JSON) is the current trend. One excellent module is https://getpino.io/[pino], a fast, structured logger for Node.js that is easy to use. Related Cheat sheets ECMAScript Modules Cheat sheet Lucas Holmquist Download Node.js Event Emitter Cheat Sheet Alex Alykiotis Download npm CLI Cheat Sheet Lucas Holmquist Download"
