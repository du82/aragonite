title = "Developer Sandbox | Red Hat Developer"
description = "The Developer Sandbox is perfect for immediate access to OpenShift, but where do you even start? Here are some recommended activities to help you get started."
full_description = "Start exploring in the Developer Sandbox for freeTry Red Hat's products and technologies without setup or configuration.Start your sandbox for free OverviewActivitiesFrequently asked questions What is the Developer Sandbox?The Developer Sandbox provides you with a 30-day trial experience to a selection of Red Hat products. Get instant access to an environment for evaluation and experimentation. With Developer Sandbox, you can:Bring your source code: You can deploy your application on OpenShift or develop your code in OpenShift Dev Spaces.Try our technology: Your Developer Sandbox cluster includes trials of tools and services like:Red Hat OpenShiftRed Hat OpenShift AIRed Hat OpenShift VirtualizationRed Hat OpenShift PipelinesRed Hat OpenShift Dev SpacesRed Hat OpenShift ServerlessLearn using guided tutorials: Develop your skills with our catalog of use case-based activities created by Red Hat experts, including sample code.Refer to our FAQs for more details. Build and deploy your apps to KubernetesThe OpenShift cloud-native application platform has everything you need to manage your development life cycle, including standardized workflows, support for multiple environments, continuous integration, and release management. Learn more about Red Hat OpenShift.Launch Code and test in a cloud-based development environmentQuickly spin up a development environment hosted on OpenShift. Code, build, and test with VS Code, using only a web browser. Leverage bundled high-grade, certified container images for popular stacks as the base for your applications. Learn more about Red Hat OpenShift Dev Spaces.Launch Develop, train, and serve AI/ML modelsAccess an AI platform that includes popular open source tooling, like Jupyter, TensorFlow, and PyTorch, along with MLOps components for model serving and data science pipelines—all integrated into a flexible UI. Learn more about Red Hat OpenShift AI.Launch Ease onboarding and improve developer productivityUse Red Hat Developer Hub to set up an internal development platform for maximizing developer productivity. Developer Hub extends Backstage by providing additional features for platform engineers such as integration with OpenShift, enterprise role-based access control (RBAC), and dynamic plug-ins. Learn more about Red Hat Developer Hub.Launch Develop your application with runtimes and frameworksWith the Developer Sandbox, get access to industry-leading frameworks and languages such as Quarkus, Node.js, React.js, and .NET to jump-start your application development. Learn more about runtimes and frameworks.Launch Automate CI/CD processes with OpenShift PipelinesOpenShift Pipelines, based on the Tekton project, offers a native integration with the OpenShift platform to provide a smooth experience for developers. Learn more about Red Hat OpenShift Pipelines.Launch Featured Developer Sandbox activities The Developer Sandbox is perfect for immediate access to OpenShift, but where do you even start? Here are some recommended activities to help you get started. Get started with your Developer Sandbox Learn Kubernetes using the Developer Sandbox Install and configure Red Hat Developer Hub and explore templating basics Export your appliction from the developer Sandbox into Rosa View all Developer Sandbox activities What comes after the Developer Sandbox? The Developer Sandbox is an ideal place to start exploring Red Hat technology. Once you have a sense of what’s possible, let’s connect to talk about how Red Hat products, support, and training could benefit your organization. Contact the Red Hat Sales team"
