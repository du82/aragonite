["https://developers.redhat.com/app-platform"]
title = "App Dev Platform | Red Hat Developer"
description = "Drive team productivity and accelerate innovation"
full_description = "Cloud-native Application PlatformRed Hat OpenShift is a comprehensive application platform with support for popular workloads and any popular application architectures such as microservices, virtualization, AI/ML, Event-Driven, Serverless, and many more. It fosters an excellent developer experience, enhancing SDLC management through efficient pipelines and automation, thereby boosting productivity.Try App Platform with Developer SandboxMore ways to try Learning Exercises OverviewRuntimes & Frameworks supportIntegration & ConnectivityCloud-Native application architecturesGet started Application platform, not just KubernetesOpenShift offers advanced management and security features, including multicluster management, cluster security, global registry, and cluster data management. It provides integrated DevOps services such as service mesh, serverless computing, builds, pipelines, GitOps, tracing, log management, cost management, and migration tools. With Kubernetes and cluster services, OpenShift enables easy installation, over-the-air updates, networking, ingress, storage management, monitoring, log forwarding, registry management, authorization, and support for containers, virtual machines (VMs), operators, and Helm charts. Kubernetes Container PlatformOpenShift Container Platform simplifies and accelerates the development, delivery, and life cycle management of a hybrid mix of applications, consistently anywhere across on-premise, public clouds, and edge Learn More Learn more about Containers VirtualizationRed Hat® OpenShift® Virtualization, a feature of Red Hat OpenShift, allows IT teams to run virtual machines (VM) alongside containers on the same platform, simplifying management and improving time to production. Learn More Cluster ManagementCluster management is critical for ensuring the efficient operation, scalability, and availability of applications running in a clustered environment. Red Hat® Advanced Cluster Management for Kubernetes controls clusters and applications from a single console, with built-in security policies. Learn More Cluster SecurityCluster security is vital for containerized platforms, protecting against attacks, securing data and applications, and providing automated controls in dynamic environments. Red Hat Advanced Cluster Security enhances OpenShift clusters, shielding containerized applications throughout development and operation. Learn More Pipelines & IaCOpenShift Pipelines automates the entire application lifecycle, from provisioning infrastructure to deploying and managing code. This approach helps developers deliver applications faster, with fewer errors, and greater consistency, supporting agile innovation and rapid response to market demands. Learn More about GitOps Learn More about DevOps AI Workloads and AppsRed Hat OpenShift AI accelerates AI/ML workflows by providing tools for building, deploying, and monitoring models across any environment (on-premise, cloud, edge). This empowers data scientists and developers to collaborate seamlessly, bringing AI-powered applications to life faster. Learn More ObservabilityObservability is the ability to monitor, measure, and interpret a system or application's status by analyzing its outputs, logs, and performance metrics. OpenShift observability empowers you to make data-driven decisions about your applications and infrastructure. It helps engineers ensure their reliability, optimize resource usage, and ultimately deliver a better user experience Learn More ModernizationApplications should be modernized to improve performance, enhance user experience, save costs, enhance security, improve integration and compatibility, and ensure regulatory compliance. Modernizing applications helps organizations stay competitive, improve operational efficiency, and provide better experiences for their users. Learn More Internal Developer PortalIDPs provide developers with access to resources, tools, and documentation needed to build and deploy applications within an organization. Red Hat Developer Hub is an enterprise-grade, open developer platform for building developer portals, containing a supported and opinionated framework. Learn More Developer ProductivityDeveloper experience, or DevEx, refers to the overall experience and satisfaction of developers while working with a particular platform, framework, or toolset. It encompasses various aspects that directly impact developers' productivity, efficiency, and satisfaction throughout the software development lifecycle. Learn More Enterprise support for runtimesEnterprise support makes it possible for developers to ensure the reliability, security, and performance of an environment used for building, running, and operating applications. This also helps developers to enable businesses to achieve their goals effectively and efficiently.Red Hat build of QuarkusThe Red Hat build of Quarkus is an enterprise-grade distribution of the Quarkus framework, optimized for building lightweight, fast, and efficient Java applications. Learn More Red Hat build of OpenJDKThe most trusted enterprise grade multi-platform Java runtime with with FIPS compliance, AQA Assurance, low pause time garbage collector and reduced header sizes with build time configs Learn More Red Hat support for Spring BootRed Hat's Spring Boot support offers enterprise-grade assistance, integration, security, performance, and expert guidance for modern application development and deployment. Learn More Red Hat build of Node.jsRed Hat's Node.js support offers expert help, consistent workflows via RPMs, and security with FIPS validations. It provides flexibility by installing only necessary components and pre-built containers for easy deployment. Learn More Integration and Application ConnectivityIntegration and application connectivity are essential in Kubernetes-based platforms for enabling seamless communication between microservices, facilitating service discovery, supporting scalability and elasticity, ensuring fault tolerance, and enhancing security.Red Hat build of KeyCloakRed Hat build of Keycloak is a cloud-native Identity Access Management solution based on the popular open-source Keycloak project. Learn More API Management (3Scale)The OpenShift API Management service adds full API lifecycle management capabilities to Red Hat OpenShift Dedicated and Red Hat OpenShift Service on AWS. Learn More Service interconnectTraditional methods of connecting applications across environments, like VPNs with complex firewall rules, can be cumbersome and slow. Red Hat Service interconnect offers secure, dynamic connections for applications regardless of where they are and fosters agility in hybrid deployments Learn More Enterprise IntegrationEnterprise integration connects data, apps, and devices across IT. Camel Quarkus and Camel K offer lightweight integration for Quarkus and serverless/microservices. Red Hat Fuse provides agile integration for on-premise and cloud, crucial for digital transformation. Learn More Events, Streaming & MessagingEvents, data, and messaging are crucial for real-time communication, data processing, and system integration in modern applications. Red Hat's AMQ suite provides a fast, lightweight, and secure platform offering high-throughput, low-latency data sharing and efficient messaging capabilities Learn More Cloud-Native application architecturesAll things around detailed planning and specification of a system's components and interactions to build applications for the modern hybrid cloud.View System Design & Architecture pageMicroservicesMicroservices break down your application architecture into smaller, independent components that communicate through APIs.This approach lets multiple team members work on different parts of the architecture simultaneously for faster development. It’s a scalable, flexible, resilient way to build modern applications Learn More ServerlessA serverless environment lets you deploy code to Kubernetes, but no resources are consumed unless your code needs to do something. With Knative, you create a service by packaging your code as a Docker image and handing it to the system. Your code only runs when it needs to, with Knative starting and stopping instances automatically. Learn More Event-Driven ArchitectureEvent-Driven Architecture (EDA) builds applications that react to specific events, triggering real-time processing and independent scaling of individual components. This asynchronous communication style promotes loose coupling, allowing for greater flexibility and easier adaptation to changing conditions, making it ideal for applications requiring responsiveness. Learn More Disconnected EnvironmentsDisconnected or isolated environments lack internet connectivity for security reasons. Some systems or components need this disconnection due to sensitive data or regulatory compliance. Disconnecting from the internet reduces cyberattack avenues, enhancing security. Learn More VirtualizationVirtualization creates virtual versions of servers, storage devices, operating systems, or network resources, enhancing scalability, efficiency, and security. It enables running multiple applications and operating systems on a single physical server, maximizing resource use and reducing costs. Learn More Hybrid Cloud ArchitectureHybrid cloud architecture combines a mixture of public cloud, private cloud, or on-premises infrastructure for storage and computing. It includes software components that connect these parts, enable them to communicate, deliver updates, ensure security, and help the organization manage it all. Learn More Internet of Things (IoT)Internet of Things (IoT) refers to the network of interconnected devices that communicate and share data with each other. By processing data closer to where it is generated, IoT enables faster response times and more efficient operations. This distributed computing approach improves scalability and reduces the need for centralized processing, making it ideal for environments with large numbers of connected devices.Learn More EdgeEdge computing occurs near the user or data source, offering faster, more reliable services. This approach provides companies with hybrid cloud flexibility. It also offloads compute-intensive rendering pipeline parts to the cloud, preventing computing power lags. Learn More Red Hat architecture and design patternsTried, tested, and trusted patterns for your cloud-native platforms.Browse Red Hat architecture & solution patterns Try OpenShift nowThe application platform is available in multiple footprints on-premise, public cloud, self-managed and managed. OpenShift is a complete hybrid cloud platform that brings together developers, platform engineers, and operations teams on one platform to efficiently develop, deploy and manage a wide variety of workloads. How this platform enables the Cloud Native Intelligent Application Lifecycle is explained below.Explore ways to try OpenShift Red Hat named a Leader in 2024 Gartner® Magic Quadrant™ for Container ManagementRecognized for completeness of vision and ability to execute.Quadrant for Container Management. Gartner Magic Quadrant research methodology provides a graphical competitive positioning of four types of technology providers in fast-growing markets: Download analyst report for details Red Hat named a Leader in 2024 Gartner® Magic Quadrant™ for Cloud Application PlatformsRecognized for completeness of vision and ability to execute.Red Hat has been recognized by Gartner as a Leader in the first-ever 2024 Gartner Magic Quadrant for Cloud Application Platforms.Download analyst report for details"
