["https://developers.yubico.com/java-webauthn-server"]
title = "java-webauthn-server"
full_description = '''Psychic signatures in Java In April 2022, CVE-2022-21449 was disclosed in Oracle’s OpenJDK (and other JVMs derived from it) which can impact applications using java-webauthn-server. The impact is that for the most common type of WebAuthn credential, invalid signatures are accepted as valid, allowing authentication bypass for users with such a credential. Please read Oracle’s advisory and make sure you are not using one of the impacted OpenJDK versions. If you are, we urge you to upgrade your Java deployment to a version that is safe. <dependency> <groupId>com.yubico</groupId> <artifactId>webauthn-server-core</artifactId> <version>2.6.0</version> <scope>compile</scope> </dependency> You may need additional dependencies with JCA providers to support some signature algorithms. In particular, OpenJDK 14 and earlier does not include providers for the EdDSA family of algorithms. The library will log warnings if you try to configure it for algorithms with no JCA provider available. RelyingPartyIdentity rpIdentity = RelyingPartyIdentity.builder() .id("example.com") // Set this to a parent domain that covers all subdomains // where users' credentials should be valid .name("Example Application") .build(); RelyingParty rp = RelyingParty.builder() .identity(rpIdentity) .credentialRepository(new MyCredentialRepository()) .build(); Optional<UserIdentity> findExistingUser(String username) { /* ... */ } PublicKeyCredentialCreationOptions request = rp.startRegistration( StartRegistrationOptions.builder() .user( findExistingUser("alice") .orElseGet(() -> { byte[] userHandle = new byte[64]; random.nextBytes(userHandle); return UserIdentity.builder() .name("alice") .displayName("Alice Hypothetical") .id(new ByteArray(userHandle)) .build(); }) ) .build()); String credentialCreateJson = request.toCredentialsCreateJson(); return credentialCreateJson; // Send to client import * as webauthnJson from "@github/webauthn-json"; // Make the call that returns the credentialCreateJson above const credentialCreateOptions = await fetch(/* ... */).then(resp => resp.json()); // Call WebAuthn ceremony using webauthn-json wrapper const publicKeyCredential = await webauthnJson.create(credentialCreateOptions); // Return encoded PublicKeyCredential to server fetch(/* ... */, { body: JSON.stringify(publicKeyCredential) });'''
year_published = 2025
