title = "Using a library"
full_description = '// handles HTTPS requests to /register public Either<String, RegistrationRequest> startRegistration(String username, String displayName, String credentialNickname) { ... if (userStorage.getRegistrationsByUsername(username).isEmpty()) { byte[] userId = challengeGenerator.generateChallenge(); RegistrationRequest request = new RegistrationRequest( username, credentialNickname, U2fB64Encoding.encode(challengeGenerator.generateChallenge()), rp.startRegistration( new UserIdentity(username, displayName, userId, Optional.empty()), Optional.of(userStorage.getCredentialIdsForUsername(username)), Optional.empty() ) ); registerRequestStorage.put(request.getRequestId(), request); return new Right(request); } else { return new Left("The username \"" + username + "\" is already registered."); } } // handles HTTPS requests to /register/finish public Either<List<String>, SuccessfulRegistrationResult> finishRegistration(String responseJson) { ... RegistrationResponse response = null; ... response = jsonMapper.readValue(responseJson, RegistrationResponse.class); ... RegistrationRequest request = registerRequestStorage.getIfPresent(response.getRequestId()); registerRequestStorage.invalidate(response.getRequestId()); ... Try<RegistrationResult> registrationTry = rp.finishRegistration( request.getPublicKeyCredentialCreationOptions(), response.getCredential(), Optional.empty() ); if (registrationTry.isSuccess()) { return Right.apply( new SuccessfulRegistrationResult( request, response, addRegistration( request.getUsername(), request.getPublicKeyCredentialCreationOptions().user(), request.getCredentialNickname(), response, registrationTry.get() ), registrationTry.get().attestationTrusted() ) ); } else { ... return Left.apply(Arrays.asList("Registration failed!", registrationTry.failed().get().getMessage())); } ... } // handles HTTPS requests to /authenticate public AssertionRequest startAuthentication(Optional<String> username) { ... AssertionRequest request = new AssertionRequest( username, U2fB64Encoding.encode(challengeGenerator.generateChallenge()), rp.startAssertion( username.map(userStorage::getCredentialIdsForUsername), Optional.empty() ) ); assertRequestStorage.put(request.getRequestId(), request); return request; }'
