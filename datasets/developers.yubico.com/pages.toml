title = "WebAuthn Walk-Through"
full_description = 'This walk through is designed for people who prefer to learn by doing. If you prefer learning concepts from the ground up, check out our WebAuthn Developer Guide. This walk-through and the guide are complementary to each other. You will get warnings in your browser about the connection not being secure. This is expected, because this server uses a self-signed certificate. You can safely proceed to the site. public class WebAuthnServer { private final RegistrationStorage userStorage; // The InMemoryRegistrationStorage implements the RegistrationStorage and CredentialRepository interfaces private final RelyingParty rp; public WebAuthnServer() { this(new InMemoryRegistrationStorage(), Config.getRpIdentity(), ...); } public WebAuthnServer(RegistrationStorage userStorage, RelyingPartyIdentity rpIdentity, ...) { this.userStorage = userStorage; ... rp = RelyingParty.builder() .identity(rpIdentity) .credentialRepository(this.userStorage) ... .build(); } ... } { "rp": { "name": "Yubico WebAuthn demo", "id": "localhost" }, "user": { "name": "test", "displayName": "test", "id": "eShrgFw-m1yWL_VJYKuBqOk2Wcxnkfi1v4adq7Xqr_s" }, "challenge": "g9xJT91T0xXBdsyqDXX9-tfZJBJ1rO6E8Mfiv30VCdg", "pubKeyCredParams": [ { "alg": -7, "type": "public-key" }, { "alg": -8, "type": "public-key" }, { "alg": -257, "type": "public-key" }], "excludeCredentials": [], "authenticatorSelection": { "requireResidentKey": false, "userVerification": "preferred" }, "attestation": "direct", "extensions": {} } { "challenge": "kVDORSw87Z4PwuiCKOmQ7lduC-SReKF_TLayhPLBW5c", "rpId": "localhost", "allowCredentials": [ { "type": "public-key", "id": "a_TJPMGXaqyff0ZuEVD3k3bnfiiK049rPnmWSfnNkIFW1vWYaKSgIJpIiuyUChF0Br7MDUxpbKRKVWtGKQv1tA" } ], "userVerification": "preferred", "extensions": { "appid": "https://localhost:8443" } }'
