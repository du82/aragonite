["https://developers.yubico.com/Developer_Program/WebAuthn_Starter_Kit"]
title = "WebAuthn Starter Kit"
full_description = "WebAuthn is the standard for modern online authentication, combining high security with a simple and easy user experience. Replacing the password with WebAuthn has been a goal frequently stated, but difficult to realize for large deployments. The Yubico WebAuthn Starter Kit was created to provide an Adaptive Multi-Factor Authentication roadmap, simplifying the transition of users to a passwordless WebAuthn experience. Prior to this project, a developer integrating WebAuthn into their identity provider ran into difficulties finding code examples and documentation that explain: We wanted to make this easier by describing an Adaptive Multi-Factor Authentication flow and providing a reference architecture you can try out and share with others. The starter kit adds WebAuthn to the AWS Cognito identity provider by integrating Yubico’s java webauthn server library into Cognito’s user pool custom authentication flow. It hosts an example web app on AWS Amplify Console so that you can try out the Adaptive Multi-Factor Authentication flow. The Yubico WebAuthn Starter kit is a project anyone can deploy on their own AWS account, providing a powerful tool for anyone looking to test a proof of concept for their organization, empowering them to deliver the vision and promise of WebAuthn with an end-to-end example of how to implement WebAuthn in their own services. The Yubico WebAuthn Starter Kit is open source, with the source code freely available to be reviewed or referenced. The kit also includes install scripts for MacOS, Linux and Windows to make it simple to configure and deploy the reference architecture to your AWS account. AWS account: A free tier account can be used, but the account holder will be charged a small amount for using a t2 small DB. Once an instance of the Yubico WebAuthn Starter kit is deployed, it opens your default browser to the example web app so you can try out the Adaptive Multi-Factor Authentication flow on any modern browser supporting WebAuthn. A reference architecture demonstrating an Adaptive Multi-Factor Authentication flow for migrating to WebAuthn from existing authentication methods"
year_published = 2025
