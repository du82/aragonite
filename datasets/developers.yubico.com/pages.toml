["https://developers.yubico.com/developer-program"]
title = "Developer Program"
full_description = "The Yubico developer program provides the tools you need to develop, integrate, and launch your Works with YubiKey product. Once approved, share your content and imagery with Yubico and get added to the Works with YubiKey catalog The Yubico Developer Program provides workshops, documentation, implementation guides, APIs and SDKs to aid in rapid integration of Yubico technologies including YubiKey integration using any of the supported protocols: FIDO U2F, FIDO2, One-time password (OTP), PIV (smart card), and OpenPGP. These resources can all be found on the developer site. The FIDO2/WebAuthn open authentication specifications enable strong first-factor, second-factor, and multi-factor authentication options. Yubico OTP is a simple yet strong authentication mechanism that is supported by all YubiKeys. Yubico OTP can be used as the second factor in a 2-factor authentication model or on its own, providing first-factor authentication. The YubiKey provides smart card features based on the Personal Identity and Verification Card (PIV) standard over the CCID protocol, which supports smart cards on a USB interface. This enables you to perform RSA or ECC sign and decrypt operations using a private key stored on the YubiKey. OpenPGP is a standards-based public key cryptography for signing, encrypting, and decrypting texts, e-mails, files, SSH, etc. Both the YubiKey 4 series and Yubikey NEO can securely hold a PGP key. The YubiHSM 2 provides advanced cryptography, including hashing, asymmetric and symmetric key cryptography, to protect the cryptographic keys that secure critical applications, identities, and sensitive data in an enterprise for certificate authorities, databases, code signing and more. For technical questions, try Stack Exchange sites. Stack Exchange is a network of question and answer sites for developers to learn and share their knowledge, which includes Stack Overflow. If you’ve never used a Stack Exchange site then you should review their guide for asking good questions. Use the Yubico tag when asking a question."
year_published = 2025
clearnet = "https://developers.yubico.com/developer-program"
