["https://developers.yubico.com/PIV/Guides/SSH_with_PIV_and_PKCS11.html"]
title = "SSH with PIV and PKCS11"
full_description = 'We strongly recommend changing the management key; keeping the default management key is explicitly discouraged. The examples given in the following steps assume that you have not yet changed the management key. If you have changed the management key, add --key to the yubico-piv-tool -a import-certificate command below. yubico-piv-tool -a verify-pin -a selfsign-certificate -s 9a -S "/CN=SSH key/" -i public.pem -o cert.pem This command will prompt for the PIV PIN. The default PIV PIN is 123456. You should change the default PIN before generating keys with yubico-piv-tool -a change-pin. This command will export all keys stored on the YubiKey. The slot order should remain the same, thereby facilitating identification of the public key associated with your targeted private key.'
