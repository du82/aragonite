["https://developers.yubico.com/Mobile/Concepts.html"]
title = "Concepts"
full_description = 'This document describes general concepts of a YubiKey, how to use them, as well as the functionality they provide. These concepts are used throughout our SDKs. A YubiKey refers to the physical device. Sometimes referred to as a Security Key or an Authenticator. A YubiKey has one or more Transports available which allow it to be connected to a host device, such as a desktop computer, or a mobile smart phone. A Transport is a mechanism for communicating with a YubiKey. Different models of YubiKeys support different Transports. Examples include: USB, NFC, and Lightning. The USB transport can be used with YubiKeys having a physical USB A or C connector. When connected via USB, the YubiKey will present a Vendor ID and Product ID. The Vendor ID (VID) for Yubico is 0x1050 (decimal 4176) and the Product ID (PID) will vary depending on the model and configuration of the YubiKey. The HID based OTP USB interface (sometimes referred to as the keyboard interface) causes the YubiKey to act as a USB keyboard. It is used to communicate with the YubiOTP Application, and to output keyboard sequences when triggered via the touch sensor (short or long press). The CCID USB interface causes the YubiKey to act as a smart card reader. It can be used to communicate with several of the YubiKey Applications. The HID-based FIDO USB interface causes the YubiKey to act as a FIDO Authenticator, for use with FIDO protocols and WebAuthn. This interface was previously referred to as the "U2F" interface. Note: USB Interfaces will deactivate if their Applications are disabled or unsupported, and will, in such a case, not be present in the USB Descriptor. The NFC transport can be used with YubiKeys having a built-in NFC antenna. The host device needs an NFC reader, and communication is done via the "contactless smart card" protocol (ISO/IEC 14443). The Lightning transport can be used with YubiKeys having a Lightning connector, such as the YubiKey 5Ci. Similar to USB, the Lightning transport provides multiple interfaces, which allow iOS to interact with the YubiKey as a FIDO Authenticator and a keyboard, but only one of the interfaces is directly accessible to client applications, which is the Accessory interface. The protocol used for this is proprietary and can be accessed via the Yubico Mobile SDK for iOS.'
year_published = 2025
clearnet = "https://developers.yubico.com/Mobile/Concepts.html"
