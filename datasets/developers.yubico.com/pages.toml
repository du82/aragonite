["https://developers.yubico.com/OATH/OATH_Walk-Through.html"]
title = "OATH Walk-Through"
full_description = "The YubiKey supports Open Authentication (OATH) standards for generating one-time password (OTP) codes. Configure the YubiKey to generate the OTP for users to enter as their passcode. The YubiKey-generated passcode can be used as one of the authentication options in two-factor or multi-factor authentication. The user’s login credentials are typically the other half of the two-factor authentication. Go to Two Factor Auth (2FA) for a list of software and web sites that support two-factor authentication. Configure the YubiKey using the tools to read and generate the OATH codes. The end user or a provisioning administrator configures the YubiKey for one of the supported methods. Provide secret key. Go to the Yubico API key signup page to generate a shared symmetric key for use with Yubico Web Services. The YubiKey securely stores it to use in combination with a timestamp or authentication counter to generate the OTP code. OTP verification server. Use the YubiCloud server with a Yubico API key, or host one of two YubiCloud Validation Servers. Time-based One-Time Password algorithm (TOTP) — Requires an application that can read OATH codes from YubiKeys. Uses a timestamp to calculate the OTP code. HMAC-based One-time Password algorithm (HOTP) — Can be configured using the YubiKey Manager as a GUI, or as a CLI. Uses an authentication counter to calculate the OTP code. Use the Yubico Authenticator app to read OATH codes from your YubiKey over NFC or over USB (Android app for OATH). a) Build the APK to install on the Android device. From the device command line, run the following command to build the debug version of the app: The compiled file is stored in the directory build/app/outputs/flutter-apk/. More information about building for Android can be found at Development documentation page. b) Manage OATH credentials by command. See YKOATH protocol specification. The YKOATH protocol includes commands for: Select, Put, Delete, Set Code, Reset, List, Calculate, Validate, Calculate All, Send Remaining."
year_published = 2025
