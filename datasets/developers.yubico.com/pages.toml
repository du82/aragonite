["https://developers.yubico.com/OTP/Libraries/Using_a_library.html"]
title = "Using a library"
full_description = "Yubico OTPs can be validated by YubiCloud or a self-hosted verification server. Throughout this document we will refer to both these alternatives simply as YubiCloud. # clientId and secretKey is retrieved from https://upgrade.yubico.com/getapikey client = Yubico(clientId, secretKey) After validating the OTP, you also want to make sure that the YubiKey belongs to the user logging in. This is done by comparing the first 12 characters of the OTP (which is the YubiKey’s ID) with the YubiKey ID that is associated with the user: Provisioning is simply a matter of associating the first 12 characters of an OTP with a user in your user database. You can allow users to provision YubiKeys themselves. This is called self-provisioning and works like this: On your website, provide the option for users to associate a YubiKey with their account. When a user registers, verify the OTP to make sure that the key is valid. Later the user comes back to your site. Since the user has an associated YubiKey, ask for an OTP (that you verify) before logging her/him in. The client-side (browser-side) is not handled by libraries. Luckily, you just have to add another text field to your existing login form. From a user point of view, press Enter is replaced with touch the YubiKey button."
