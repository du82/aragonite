["https://developers.yubico.com/PIV"]
title = "PIV"
full_description = "PIV, or FIPS 201, is a US government standard. It enables RSA or ECC sign/encrypt operations using a private key stored on a smartcard (such as the YubiKey), through common interfaces like PKCS#11. PIV is primarily used for non-web applications. It has built-in support under Windows, and can be used on macOS and Linux via the OpenSC project."
