["https://developers.yubico.com/OTP/Guides/Self-hosted_OTP_validation.html"]
title = "Self-hosted OTP validation"
full_description = 'Yubico has declared end-of-life for the YubiKey Validation Server (YK-VAL) and YubiKey Key Storage Module (YK-KSM). These have been moved to YubicoLabs as a reference architecture. See article, YK-VAL, YK-KSM and YubiHSM 1 End-of-Life. By default the yhsm-yubikey-ksm daemon will listen on port 8002 on the loopback interface only. This means that you will be able to access the service from the local machine, but not remotely. We recommend keeping this setting this way, and exposing the port only to the Validation Server(s) which will be using it. Remote Validation Servers can access the port by proxying it through another web server (with authentication) or tunneled through SSH, etc. Opening this port to the Internet without authentication will expose the server to DoS attacks (denial of service). sudo yhsm-generate-keys -D /etc/yubico/yhsm/keys.json --key-handle 1 --start-public-id interncccccc -c 10 The following commands show decrypting of OTP secrets, and handling of secrets on a command line. This example is for testing purposed ONLY. You should take extreme care when handling production secrets and avoid passing them as command line arguments, as they may become visible to other parts of the system or logged. sudo yhsm-decrypt-aead --aes-key 000102030405060708090a0b0c0d0e0f --key-handle 1 --format yubikey-csv /var/cache/yubikey-ksm/aeads/ curl http://localhost:8002/wsapi/decrypt?otp=interncccccctkbngftibfuvvbihrdjguvnrcdihejut OK counter=0001 low=5d6e high=cb use=00 curl http://localhost/wsapi/2.0/verify h=mUQ4lXMqhwKkJmkeySdm17RxWDY= t=2016-10-31T15:00:12Z0074 status=MISSING_PARAMETER curl "http://localhost/wsapi/2.0/verify?id=1&nonce=0123456789abcdef&otp=internccccccvunvcnjucfjefvfkbbjunhutdhucbclt" h=WLaajHlUqayhltxLgT8uIy/Wza0= t=2016-10-31T15:07:44Z0785 otp=internccccccvunvcnjucfjefvfkbbjunhutdhucbclt nonce=0123456789abcdef sl=0 status=OK curl "http://localhost/wsapi/2.0/verify?id=1&nonce=abababababababab&otp=internccccccvunvcnjucfjefvfkbbjunhutdhucbclt" h=uiWxzfRHJz+5QZSN7KNov3CNkzM= t=2016-10-31T15:11:43Z0142 otp=interncccccclifeelkcgebfgbdjikbuubbljvhhudln nonce=abababababababab status=REPLAYED_OTP'
year_published = 2025
