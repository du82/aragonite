full_description = "I am a hands-on software architect, trainer, and published author living in Boston, MA, USA. I’ve been in the technology industry since 1983, and I have experience in the architecture and delivery of Microservices Architectures, Service-Based Architectures, and Service-Oriented Architectures in a variety of platforms and languages. I’ve published numerous books and videos on areas of Microservices, software architecture, and enterprise messaging, and I have spoken at hundreds of conferences and user groups around the world. I am the founder of this website (DeveloperToArchitect.com), a website I started in January 2018 to help software developers in the move to becoming a software architect.Mark RichardsHands-on Software Architect, Published AuthorTwitter: @markrichardssaLinkedIn: https://www.linkedin.com/in/markrichards3/Email: info@developertoarchitect.comWeb: http://www.wmrichards.comGithub: https://github.com/wmr513/ReadingList : Books I’ve ReadPublications : Books I’ve WrittenGit Repos and Source CodeEvent-Driven Design PatternsReactive ArchitectureDistributed CachingEnterprise Messaging"
