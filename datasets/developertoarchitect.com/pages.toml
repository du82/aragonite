full_description = 'Included here are some resources to help you along the way from software developer to software architect.Architecture Characteristics WorksheetThis worksheet will help you identify what driving architecture characteristics (“-ilities”) are critical for your system. See this video for a short tutirial on how to use the worksheet. Included in it are definitions of some of the more common architecture characteristics.Download PDF Format (.pdf)Download Keynote Format (.key)Download Powerpoint Format (.pptx)Download Word Format (.docx)Architecture Styles WorksheetThis star-rating chart Neal Ford and I put together for our book Fundamentals of Software Architecture is useful for determining if you have the right architecture in place for your system, and also which one might be a good candidate to migrate to based on your driving architectural characteristics. Download PDF Format (.pdf)Download Keynote Format (.key)Download Powerpoint Format (.pptx)O’Reilly Architecture Kata ReposThis is a list created by Jacqui Read of the winners and semi-finalists for the O’Reilly Architecture Katas. These repos provide you with excellent examples of how to construct and present an architectural solution.https://github.com/TheKataLogKeep Up With TrendsThese are resources I use for keeping up with current trends in the industry—check them out, and use the 20 minute rule to expand your technical breadth. Just click on either of these images to get started on keeping up with the trends in our industry. The Architect’s BookshelfAside from the books I have written, here are ones that might help you in your journey to becomming an effective software architect. If you want to learn more about why these books are on this list and why they have been influential in my career as an architect, check out this lesson from Software Architecture Monday.My Shepard Listhttps://shepherd.com/best-books/to-better-understand-software-architectureSoftware Architecture Books I’ve Writtenhttps://www.developertoarchitect.com/books.htmlBook RecommendationsCommunication Patternsby Jacqui ReadO’Reilly Media, November 2023ISBN 978-1098140540Residues: Time, Change, and Uncertainty in Software Architectureby Barry O’ReillyLeanpub, April 2024The Software Architect Elevatorby Gregor HohpeO’Reilly Media, April 2020ISBN 978-1492077541Design It!by Michael KeelingPragmatic Bookshelf, October 2017ISBN 978-1680502091Sustainable Software Architectureby Carola LilienthalRocky Nook, October 2019ISBN 978-1681985695Just Enough Software Architectureby George H. FairbanksMarshall & Brainerd, April 2010ISBN 978-0984618101Presentation Patternsby Neal Ford, Matthew McCullough, Nate SchuttaAddison-Wesley Professional, August 2012ISBN 978-0321820808Release It! 2nd Editionby Michael NygardPragmatic Bookshelf, January 2018ISBN 978-1680502398Building Evolutionary Architecturesby Neal Ford, Rebecca Parsons, and Patrick KuaO’Reilly Media, October 2017ISBN 978-1491986363Software Architecture for Developers Volume 1by Simon BrownLeanPub Publishing, August 2017 Software Architecture for Developers Volume 2by Simon BrownLeanPub Publishing, July 2017Enterprise Integration Patternsby Gregor Hohpe and Bobby WoolfAddison-Wesley Professional, October 2003ISBN 978-0321200686Streaming Architectureby Ted Dunning and Ellen FriedmanO’Reilly Media, May 2016ISBN 978-1491953926Building Microservices: Designing Fine-Grained Systemsby Sam NewmanO’Reilly Media, February 2015ISBN 978-149195035797 Things Every Software Architect Should Knowedited by Richard Monson-HeafelO’Reilly Media, February 2009ISBN 978-0596522698Your Code as a Crime Sceneby Adam TornhillPragmatic Bookshelf, April 2015ISBN 978-1680500387A Practical Guide to Enterprise Architectureby James McGovern, Scott Ambler, et alPrentice Hall, November 2003ISBN 978-0131412750The Real Business of ITby Richard Hunter and George WestermanHarvard Business Press, October 2009ISBN 978-1422147610Interesting Articles and PodcastsThese are some of the articles and podcasts that I’ve found very useful in my journey as a software architect.Interview: Key Software Architecture Recommendations Apiumhub, January 2021Interview with Mark Richards about some key software architecture recommendations.A Promising New Metric To Track Maintainabilityby Alexander von ZitzewitzHello2morrow, December 2018In this article Alexander introduces an interesting new metric for how to measure the overall maintainability of a system.Architects: Communicate like your job depends on itby Fred ChurchvilleTechTarget.com, July 2020Fred Churchville talks to Mark Richards and Neal Ford about software architecture and the skills an architect needs to survive. Saga Patternby Chris RichardsonMicroservices.io, August 2018Chris Richardson describes this useful pattern when having to deal with transactionality in a highly distributed architecture like Microservices. Pattern: Backends for Frontendsby Sam NewmanSamNewman.io, November 2015I’ve been referring a lot to the BFF pattern lately (Backends for Frontends), and this article by Sam Newman is a great reference for this common pattern, particularly when designing API layers in a microservices ecosystem.Sacrificial Architectureby Martin FowlerMartinFowler.com, October 2014This short must-read article by Martin Fowler talks about what it means to essentially “throw away” portions of the code, and places a focus on architectural modularity, one of my favorite topics.On Orchestrated Microservicesby Matt StineBuild To Adapt, July 2016This article really caught my attention because of the tweet Matt starts the article with: "if your microservices must be deployed as a complete set in a specific order, please put them back in a monolith and save yourself some pain”. How true this is. This article is a worth-while read as it might save you lots of pain and lessons-learned regarding the dangers of inter-service communication and orchestration within a complex microservices ecosystem.'
