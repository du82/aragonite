description = "Developer To Architect"
full_description = "“The journey from developer to software architect is a difficult and uncharted path filled with lots of challenges, pitfalls, and confusion. The purpose and goal of DeveloperToArchitect.com is to provide resources and training to help you along the journey to becoming an effective software architect”Mark Richards, Software Architect, Founder of DeveloperToArchitect.comI created this website to provide developers with resources and guidance in the long and difficult journey from software developer to software architect. In here you’ll find helpful lessons, articles, books, videos, source code, and training classes I teach. Software Architecture Monday is a free bi-weekly video lesson series on some aspect of software architecture. These 10 minute YouTube videos contain various aspects of application, integration, and enterprise architecture. The Resources page contains lots of resources to help you in your journey, including worksheets, book and article references, and ways to keep up with industry trends.The Software Architecture Bookclub Podcast is a monthly free hour-long Q&A-driven podcast that focuses on one chapter a month of one of our books. Register for free to participate in this monthly event."
