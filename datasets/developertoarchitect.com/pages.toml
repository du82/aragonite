title = "Software Architecture Bookclub Podcast | Developer to Architect | Mark Richards"
full_description = '''This live monthly podcast is a chance to get your questions answered about or software architecture books from the authors. Generally, we spend the first 20 minutes or so discussing a chapter from one of our books. We will then entertain questions from the audience related to that chapter topic (or other areas of software architecture you have questions about). Since it will be a live recorded podcast (voice only), we’ll be sure to respect attendee privacy with regards to names and identity. Seating is still limited to 100 participants, so register early and sign in early to ensure a seat. We’ll be kicking off 2025 by giving a “behind the scenes” view of what’s involved in writing a technical book. Then we’ll launch into our 2nd edition of the Fundamentals of Software Architecture, scheduled to be released in February 2025. Bookclub Podcast Events Episode 1: Friday, February 2, 2024 11:00am - 12:00pm ESTHead First Software Architecture Chapter 1: Let’s Get Started! In this podcast we talk about our upcoming book Head First Software Architecture and dive into some of the topics in the first chapter, including the dimensions of software architecture, logical vs. physical architecture, and the differences between architecture and design. This browser cannot play the embedded audio file. var audio = document.getElementById('audio'); if (audio.canPlayType && audio.canPlayType('audio/x-m4a')) { // canPlayType is overoptimistic, so we have browser sniff. } else { fallback(audio); } Episode 2: Thursday, March 7, 2024 11:00am - 12:00pm ESTHead First Software ArchitectureChapter 2: Architectural Characteristics In this live question/answer driven podcast we talk about the second chapter of Head First Software Architecture, and take a detailed look at what we call architectural characteristics (what some people call non-functional requirements), including how to define them, identify them, categorize them, and unravel the complexity of composite architectural characteristics (things like reliability and agility). This browser cannot play the embedded audio file. var audio = document.getElementById('audio2'); if (audio.canPlayType && audio.canPlayType('audio/x-m4a')) { // canPlayType is overoptimistic, so we have browser sniff. } else { fallback(audio); } Episode 3: Friday, April 12, 2024 11:00am - 12:00pm ESTHead First Software ArchitectureChapter 3: Everything’s a Trade-offIn this live question/answer driven podcast we focus on trade-off analysis, the focus of chapter 3 of Head First Software Architecture. Here we dive into how to do trade-off analysis in software architecture and how it impacts architectural decisions. We then talk about our two laws of software architecture, and how to write effective architecture decision records. This browser cannot play the embedded audio file. var audio = document.getElementById('audio3'); if (audio.canPlayType && audio.canPlayType('audio/x-m4a')) { // canPlayType is overoptimistic, so we have browser sniff. } else { fallback(audio); } Episode 4: Friday, May 3, 2024 11:00am-12:00pm ESTHead First Software ArchitectureChapter 4: Logical ComponentsIn this live question/answer driven podcast we focus on chapter 4 of Head First Software Architecture and discuss logical components—the building blocks of a system. Here we talk about how to identify logical components, coupling, and building a logical architecture. This browser cannot play the embedded audio file. var audio = document.getElementById('audio4'); if (audio.canPlayType && audio.canPlayType('audio/x-m4a')) { // canPlayType is overoptimistic, so we have browser sniff. } else { fallback(audio); } Episode 5: Friday, June 7, 2024 11:00am-12:00pm ESTHead First Software ArchitectureChapter 5: Architectural StylesIn this live question/answer driven podcast we focus on chapter 5 of Head First Software Architecture and discuss architectural partitioning and the differences between monolithic and distributed architectures (and when