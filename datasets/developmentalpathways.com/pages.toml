["https://developmentalpathways.com/counseling-services"]
title = "Pediatric Counselors | Counseling Services | California"
description = "If your child displays behavioral or developmental problems, our pediatric counselors would love to sit with you and evaluate your child's needs."
full_description = "Jennifer Berry Wang, M.A., has been providing therapeutic services to children, adults, and families since 2009. Currently, Jennifer is working in private practice as a Marriage and Family Therapy Intern (IMF 81462) and is supervised by Dr. Valerie Sher, Ph.D. (PSY 23292) through the private practice, Paths to Wellness. She is currently working with clients from DPK two days per week. Individual counseling: Together we will engage in a collaborative process that aims to facilitate change and improve your quality of life. Holistic wellness includes social, emotional, occupational, physical, spiritual, environmental, and intellectual wellness. Through improving self-awareness, examining which aspects of your life feel incomplete, and learning new skills, you may benefit from self-growth and self-actualization. Family counseling: As social beings, we need fulfilling, healthy relationships to be happy. Using a systems approach by working with families and couples in intimate relationships, we can nurture change and development. Social skills groups: Children with social deficits often do not innately understand or “get” social communication and social interaction. Through facilitated playgroups with neuro-typical peers, these children can learn positive and appropriate ways to engage with others. Parent coaching: When children experience emotional or behavioral difficulties, parents can feel stressed, overwhelmed, and concerned. Through psychoeducation, coaching, positive behavior management, and modeling, parents can learn new ways to help their children. Behavioral consultation: The limitations of general education classrooms often leave children who are deemed “different” (ADD, ASD, gifted learners, LD) to feel like they’re treading to stay above water, or worse, like they’re drowning. Similarly, their teachers may feel unprepared to meet their individual learning needs. Through classroom observation and consultation, we can find ways to improve your child’s learning experience."
