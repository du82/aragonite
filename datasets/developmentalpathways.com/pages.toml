full_description = "What Does It Mean to Be Sensory Sensitive? By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids June 17, 2024 Have you ever walked into a brightly lit store filled with loud music and felt overwhelmed? Or maybe certain textures on clothing make you itch uncontrollably? If so, you might have experienced a moment of sensory sensitivity. Being sensory... Read More › Self-Regulation and Sensory Diet Activities for a Sensory Seeker By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids May 16, 2024 A “sensory seeker” is someone who has a high threshold for sensory input and is actively seeking out sensory experiences throughout the day. They seek out input to meet their needs or fill up their “sensory bucket”. When... Read More › What is Proprioceptive input and Why we LOVE it! By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids April 15, 2024 Proprioceptive input is calming and organizing for all central nervous systems. Proprioceptive input refers to the sensory information that your body receives from receptors located in muscles, tendons, and joints. This input helps you... Read More › Vestibular Input By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids March 15, 2024 Vestibular input refers to sensory Information that the brain receives when we move our head In different positions related to gravity. For example: swinging, spinning in a circle, shaking your head no, doing forward rolls, i.e., any time your... Read More › Calming a Dysregulated Child: The “Regulate, Relate, and Reason” Approach By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids February 11, 2024 Dysregulation can happen for a variety of reasons with our kids. We can never know exactly what’s going on inside of them, but in general, when they are dysregulated, it means that the demands are greater than our child’s capacity to... Read More › Is a Sensory Diet Beneficial for Kids With a Diagnosis of... By Rebecca Berry, MSPT, Director at Developmental Pathways for Kids January 3, 2024 A sensory diet is a personalized activity plan designed to meet the sensory needs of individuals, especially children diagnosed with ADHD (Attention Deficit Hyperactivity Disorder). Sensory diets can include activities that stimulate the senses,... Read More › 1234"
