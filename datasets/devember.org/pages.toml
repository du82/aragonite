["https://devember.org/rules"]
title = "Devember - Rules"
description = "Devember has been, and it will come again."
full_description = "But, hey, remember that it's a challenge to yourself by yourself. It's your challenge. You can do a soft Devember, if you think so, and make it yours. Remember what Devember really is. Programming for at least 1 hour. Updating a public devlog about the code done. Updating a public repository with the code done. I, *insert name*, will participate to the next Devember. My Devember will be *insert objective*. I promise I will program for my Devember for at least an hour, every day of the next December. I will also write a daily public devlog and will make the produced code publicly available on the internet. No matter what, I will keep my promise. *here describe your Devember* In the final section describe more in the detail what your Devember will be. What guide, or book, will you be following. What language, libraries, tools will you be using. What are your plans. You can have the same Devember together with other people! If so write their names in this section. Put your contract somewhere public. It can be your blog, your Facebook, your Tumblr, your Devember devlog, etc."
year_published = 2025
