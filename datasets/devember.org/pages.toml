["https://devember.org/why"]
title = "Devember - Why?"
description = "Devember has been, and it will come again."
full_description = "We think everybody should learn to code. If this sounds strange to you, try to imagine the people that fought against illiteracy, not much time ago. Probably their ideas sounded strange to many, back then. Nowaday, having quite won against illiteracy, we face a new form of it: code illiteracy. People that don't know how to code are code illiterate. Code literacy enables a great power, a power of freedom. Like reading and writing, coding can ( and has to! ) be fun. Through coding you can craft interactive creations, a unique and powerful medium. Being able to code you can think about something and give it life. Coding is awesome. And it's quite simple, at its basics. The awesome guys at Code.org have shot a lot of cool videos on this matter. We particularly like these two. Mitch Resnick is one of the creators of Scratch, a visual programming language. It helps to introduce kids to programming all over the world. Watch his passionate TED talk about it and why we should teach kids to code! Everyone is encouraged to join Devember. From newbies to pro developers. Everyone can learn. Learning is life. Sharing boosts learning. When, in the contract, you agree to keep a devlog, is because of two reasons. In the first instance it gives you a dayly motivation to keep faith to the contract, but it also makes you share your experience with everyone else. This means you will get both the feedback from others and their own experiences. And all this is mutual. This is humanity superpower: community learning. It is together that our societies evolved through history. Now, Devember is coming. Will you join the others? Will you join the learning? Will you join the fun? Will you join Devember?"
year_published = 2025
