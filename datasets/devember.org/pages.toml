["https://devember.org/resources/coollibraries"]
title = "Devember - Resources - Cool Libraries"
description = "Devember has been, and it will come again."
full_description = "The stb library (Sean’s Tool Box) is a nice library with a lot of basic essential tools to make C programming more agile. There you can find all the other stb_* libraries that add up to stb.h, providing multimedia IO and more. They are all single file libraries and in public domain: easy to include in your project, and to tweak as you like . On stb site there is a list of single file libraries for c/c++, and some cool ones that have more than one file. IMGUI is a super cool library useful to add to your program debug graphical interfaces, without the weight of MVC pattern. SDL2 lets you get access to basic multimedia functionalities in a portable manner. You can create windows, use input devices, output audio, dynamically load code, work with files, create GPU contexts and render something. This library is thought for games, but you could use it for other things, for example VLC can output video using SDL. It is written in C and can be used in C++. Look at the wiki for documentation. If you use SDL2 you can get SDL_Mixer and SDL_TTF too. The former lets you play sounds easily, the latter loads fonts and lets you render them. Rapidjson is the fastest C++ json loading library. It's pretty simple to use. You could use it to save and load custom data in your program. Bootstrap is a well known and vastly used framework that lets you build up websites with cool appearance without being a html/js/css genius. It’s based on grids and has a cool navbar. jQuery is a fast high-level Javascript library that enables you to make your websites interactive and dynamic without all the Javascript-DOM madness. If you want to make use of grids in your website, but you want more than Bootstrap you have a lot of choices: Sammy.js “is a tiny JavaScript framework developed to ease the pain and provide a basic structure for developing JavaScript applications”. With it you can make web applications that never reload the page, but clicking links changes the url in the browser and the content of the page, like Twitter or Google Inbox."
year_published = 2025
