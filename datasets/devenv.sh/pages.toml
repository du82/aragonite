["https://devenv.sh/guides/using-with-flakes"]
title = "Using with Flakes - devenv"
description = "Fast, Declarative, Reproducible, and Composable Developer Environments using Nix"
full_description = '''Using with Flakes Many experienced Nix users prefer to use Nix flakes, although devenv is considered a superior interface since it's way simpler, but lacks integration with existing tooling. Getting started Set up a new project with Nix flakes using our template: nix flake init --template github:cachix/devenv This template will create: A flake.nix file containing a basic devenv configuration. A .envrc file to optionally set up automatic shell activation with direnv. Working with flake shells The flake.nix file Setting up devenv inside a flake requires wiring up a few outputs. Here's a minimal flake.nix to start you off that includes: A devShell created with devenv.lib.mkShell. See the reference documentation for the possible options to use here. Two packages, devenv-up and devenv-test, that are needed for devenv up and devenv test to work inside the shell. { inputs = { nixpkgs.url = "github:cachix/devenv-nixpkgs/rolling"; devenv.url = "github:cachix/devenv"; }; nixConfig = { extra-trusted-public-keys = "devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw="; extra-substituters = "https://devenv.cachix.org"; }; outputs = { self, nixpkgs, devenv, ... } @ inputs: let system = "x86_64-linux"; pkgs = nixpkgs.legacyPackages.${system}; in { packages.${system}.devenv-up = self.devShells.${system}.default.config.procfileScript; packages.${system}.devenv-test = self.devShells.${system}.default.config.test; devShells.${system}.default = devenv.lib.mkShell { inherit inputs pkgs; modules = [ ({ pkgs, config, ... }: { # This is your devenv configuration packages = [ pkgs.hello ]; enterShell = '' hello ''; processes.run.exec = "hello"; }) ]; }; }; } Entering the shell Create and enter the devenv shell with: nix develop --no-pure-eval This will evaluate the inputs to your flake, create a flake.lock lock file, and open a new shell using the devenv configuration from your flake.nix. Why do I need to use the --no-pure-eval flag? Flakes use "pure evaluation" by default, which prevents devenv from figuring out the environment its running in: for example, querying the working directory. The --no-pure-eval flag relaxes this restriction. An alternative, and less flexible, workaround is to override the devenv.root option to the absolute path to your project directory. This makes the flake non-portable between machines, but does allow the shell to be evaluated in pure mode. Launching processes, services, and tests Once in the shell, you can launch processes and services with devenv up. $ devenv up 17:34:37 system | run.1 started (pid=1046939) 17:34:37 run.1 | Hello, world! 17:34:37 system | run.1 stopped (rc=0) And run tests with devenv test. $ devenv test Running tasks devenv:enterShell Succeeded devenv:git-hooks:install 10ms Succeeded devenv:enterShell 4ms 2 Succeeded 14.75ms • Testing ... Running tasks devenv:enterTest Succeeded devenv:git-hooks:run 474ms Not implemented devenv:enterTest 1 Skipped, 1 Succeeded 474.62ms Automated shell switching You can configure your shell to launch automatically when you enter the project directory. First, install nix-direnv. The add the following line to your .envrc: use flake . --no-pure-eval Allow direnv to evaluate the updated .envrc: direnv allow Multiple shells Some projects lend themselves to defining multiple development shells. For instance, you may want to define multiple development shells for different subprojects in a monorepo. You can do this by defining the various development shells in a central flake.nix file in the root of the repository. The flake.nix file contains multiple devShells. For example: { inputs = { nixpkgs.url = "github:cachix/devenv-nixpkgs/rolling"; devenv.url = "github:cachix/devenv"; }; outputs = { self, nixpkgs, devenv, ... } @ inputs: let system = "x86_64-linux"; pkgs = nixpkgs.legacyPackages.${system}; in { packages.${system} = { projectA-devenv-up = self.devShells.${system}.projectA.config.procfileScript; projectA-devenv-test = self.devShells.${system}.projectA.config.test; projectB-devenv-up = self.devShells.${system}.projectB.config.procfileScript; projectB-devenv-test = self.devShells.${system}.projectB.config.test; }; devShells.${system} = { projectA = devenv.lib.mkShell { inherit inputs pkgs; modules = [ { enterShell = '' echo this is project A ''; } ]; }; projectB = devenv.lib.mkShell { inherit inputs pkgs; modules = [ { enterShell = '' echo this is project B ''; } ]; }; }; }; } Here we've define two shells, each with a separate devenv configuration. To enter the shell of project A: $ nix develop --no-pure-eval .#projectA this is project A (devenv) $ To enter the shell of project B: $ nix develop --no-pure-eval .#projectB this is project B (devenv) $ External flakes If you cannot, or don't want to, add a flake.nix file to your project's repository, you can use external flakes instead. Create a separate repository with a flake.nix file, as in the example above. Then refer to this flake in your project: $ nix develop --no-pure-eval file:/path/to/central/flake#projectA this is project A (devenv) $ You can also add this to the direnv configuration of the project. Make sure the following line is in .envrc: nix flake --no-pure-eval file:/path/to/central/flake#projectA External flakes aren't limited to local paths using file:. You can refer to flakes on github: and generic git: repositories. See Nix flake references for more options. When using this method to refer to external flakes, it's important to remember that there is no lock file, so there is no certainty about which version of the flake is used. A local project flake file will give you more control over which version of the flake is used.'''
