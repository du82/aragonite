["https://devenv.sh/blog/archive/2022"]
title = "2022 - devenv"
description = "Fast, Declarative, Reproducible, and Composable Developer Environments using Nix"
full_description = "December 22, 2022 2 min read devenv 0.5 Highlights devenv search now shows results from the options that can be set in devenv.nix: bobvanderlinden added Nix Flakes support and wrote a guide how to get started. thenonameguy rewrote how the developer environment is set up so that it doesn't pollute unnecessary environment variables and improves performance. thenonameguy contributed nix-direnv integration that will speed up loading of the developer environment. domenkozar further improved Nix error messages to include the relevant error at the bottom. zimbatm and R-VdP reduced the number of nixpkgs instances (see why it's important) to 1. Languages Rust language support now integrates with fenix to provide stable/nightly/unstable toolchain for cargo, rustc, rust-src, rust-fmt, rust-analyzer and clippy. Python language now sets $PYTHONPATH to point to any installed packages in packages attribute. Ruby langauge support now defaults to the latest version 3.1.x, ships with an example running rails, sets $GEM_HOME and $GEM_PATH environment variables. Next release will support picking any version of Ruby - please leave a thumbs up. jpetrucciani contributed Nim, V and HCL/Terraform languages support. Services zimbatm moved all existing services into services.* option namespace. shyim contributed services for minio, MailHog, adminer, memcached, blackfire, elasticsearch, rabbitmq and cadddy. Phew! bobvanderlinden contributed wiremock. Integrations alejandrosame contributed starship integration domenkozar added difftastic integration. shyim improved gitpod integration for devenv repository. rkrzr added hivemind process.implementation option. domenkozar added an example how to integrate NUR. Bug fixes shyim fixed MySql sleep on macOS. domenkozar disabled update checking when using flakes and fixed devenv to warn correctly if CLI is newer than the devenv.lock pin. mdavezac fixed macOS readlink bug using the wrong command. domenkozar fixed devenv shell to propagate exit code back to the main shell. bobvanderlinden removed version information when loading the environment, as now that's redudant due to devenv info command."
