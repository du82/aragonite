title = "DeviantArt - Discover The Largest Online Art Gallery and Community"
description = "DeviantArt is the world's largest online social community for artists and art enthusiasts, allowing people to connect through the creation and sharing of art."
full_description = '''Here at DeviantArt we respect the rights of all artists and creative people worldwide and we expect our members to also demonstrate that respect and assist us in creating a beneficial and positive atmosphere for all DeviantArt visitors and members. The bottom line is: Just about anything that is on this site, on the web, on TV, on CD's, on DVD's, in books & in magazines is probably copyrighted by someone. Copyright can be a confusing territory for many people. In many cases the natural confusion over the sometimes varied circumstances surrounding copyright will lead people to rely on rumor or myth more often than the actual law which naturally confuses the matter even more. In this document we will attempt to eliminate some of the confusion and counter many of the myths surrounding copyright and to present clearly the DeviantArt policies and practices with regard to copyright. The availability of this document should not be construed as rendering legal or other professional advice, and this document is not a substitute for the advice of an attorney. If you require legal advice, you should seek the services of a qualified attorney. Under most national laws and international copyright treaties you receive a copyright automatically in any original work as you make it. Registration may be required to exercise some rights, like commencing a lawsuit. Copyright does NOT protect ideas. Copyright protects the expression of ideas or the ways in which an idea is materially placed or expressed in the work. To simplify this question, copyright infringement occurs when you do certain things with a creative work which someone else produced without first getting the proper permission. The best way to avoid infringing on the rights of another creative person is to use your skill, talent and imagination to create your own completely original work. When we use the word 'original' we don't mean that you must come up with an idea which hasn't been used before - recall that copyright does not protect ideas. When used in reference to copyright "original" means that you created your work without referencing or deliberately copying anyone else's work during the process.'''
