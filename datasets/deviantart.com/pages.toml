500,q_70,strp/invitation_by_4ratko_dj09dzm-250t-2x.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..D0P1x4cFf_JlGN8k1EXXdA2TAMmJVRd6k8d4sSAauq0 2x" style="width:172px;height:241px;object-fit:cover;object-position:50% 100%"/>Invitation<img alt="4ratko&#x27;s avatar" width="24" height="24" src="https://a.deviantart.net/avatars-big/4/r/4ratko.jpg?8" class="_121Hz"/>4ratko584Surfside Inn by theprophetObblonge, literatureSLiteratureSurfside InnWalking back from the beach was always quicker than going there. For years I would scan those assembled for my sister. It didn't occur to me until very recently that in my mind she never aged. Or that she would be wearing different colors. Or different clothes at all. I had been deposited on the sand finally, and she was nowhere to be seen. After hanging out by the hotel, I had just gone home. Even when she wasn't there in the morning, I didn't think anything of it. People meet, go to parties or rooms, lose track of time and responsibilities. Even when, days later, her boss at General Dollar called, all I had on deck as an answer was the equivalent of a shrug. I still live at the same place. It was cheap, and still is. Spend most of my time on the screened-in porch reading, or walking the sand by the strip of hotels, fireworks exploding year-round above my head. There isn't any place else to go, or anything else to do. I don't register faces that aren't hers, or voices without her<img alt="theprophetObblonge&#x27;s avatar" width="24" height="24" src="https://a.deviantart.net/avatars-big/t/h/theprophetobblonge.jpg" class="_121Hz"/>theprophetObblonge721Explore Community FeaturesLearn moreFan Art Friday: Smurfs by moonbeam13, journalFan Art Friday: SmurfsFeb 21, 2025It’s Fan Art Friday time, and this week, we’re diving into the magical, mushroom-filled village of The Smurfs! With their big-screen reboot bringing these tiny blue legends back into the spotlight, it’s the perfect moment to celebrate decades of smurfy adventures, laughter, and friendship. From classic cartoons to modern takes, let’s honour these little blue icons through the creativity of fan art across the years! “You never know what you can do until you try.” — Papa Smurf “This is so smurfin’ embarrassing!” — Grouchy Smurf Whether you grew up watching the original series, enjoyed the movies, or are excited for their rebooted adventure, The Smurfs have always brought a little magic and mischief into our lives. Share your favourite Smurf moments, and let’s get smurfy with some incredible fan art! Explore previous editions in our Fan Art Friday Collection Want to suggest your own theme or post your own Fan Art Friday to community? Send me a note!<img alt="moonbeam13&#x27;s avatar" width="24" height="24" src="https://a.deviantart.net/avatars-big/m/o/moonbeam13.jpg?9" class="_121Hz"/>moonbeam13822Fan Art Friday: Pokemon by moonbeam13, journalFan Art Friday: Pokemon2 days agoHello, Trainers! Welcome to Fan Art Friday, where we showcase incredible artwork from the talented artists of our community! This week, we're celebrating Pokémon—because Pokémon Day was just yesterday, and we’re not ready to stop the party! For nearly three decades, Pokémon has captured our hearts and imaginations, from the pixelated adventures of Red & Blue to the stunning open worlds of Legends: Arceus and Scarlet & Violet. Whether you spent hours battling in Gyms, hunting for Shiny Pokémon, or just vibing with your team, we all have that special Pokémon memory that sticks with us. But today isn’t just about nostalgia—it’s about art! The creativity in this community is super effective, and we can’t wait to share some legendary Pokémon-inspired pieces with you! So, grab your Poké Balls, throw on your trainer cap, and let’s dive in! "I see now that the circumstances of one's birth are irrelevant. It is what you do with the gift of life that determines who you are." – Mewtwo<img alt="moonbeam13&#x27;s avatar" width="24" height="24" src="https://a.deviantart.net/avatars-big/m/o/moonbeam13.jpg?9" class="_121Hz"/>moonbeam131622KovoWolf Features: Community Resources by KovoWolf, journalKovoWolf Features: Community ResourcesMay 13, 2024 This journal is dedicated to guiding you through the vast and wondrous world of artistic inspiration through resources! Whether you're a seasoned artist or just starting your creative journey, this collection of resources aims to spark your imagination, and connect you with a vibrant community of fellow creators! GROUP RESOURCES This group curates and collects various resources for community members to use and receive inspiration from! Don't forget to check out the groups resources! It's building everyday! Do you have your own favorite resource? Share in the comments below! NAVIGATION PHOTOSHOP BRUSHES CLIP STUDIO PAINT BRUSHES PAINT TOOL SAI BRUSHES'''
