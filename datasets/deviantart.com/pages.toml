full_description = "My name is Sena (They/She). I'm a queer disabled freelance illustrator and I specialize in character art. I have 8 years of experience working with a variety of fantasy races and species from a multitude of different fandoms. A few of my favorite are TTRPG, TESO, Star Wars, GW2 and WoW. By the gods, you upload faster than I can favorite! I love your diverse and vibrant characterdesigns. Great use of colors too and there's a lot of personality in the portraits! Hey, thank you so much, I really appreciate your kind words ^^ And haha, yeah, I've been putting it off to upload my art for over a year now, and decided it's finally time to stop procrastinating on it xD"
