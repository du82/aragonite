deas. Let us know what you think so we can continue to evolve DeviantArt. Leaving your feedback through this link gets it seen. See the features currently being voted on ! CORE Need more informati...<img alt="team&#x27;s avatar" width="24" height="24" src="https://a.deviantart.net/avatars-big/t/e/team.gif?6" class="_121Hz"/>team333More small improvements to Studio are rolling out that streamline how you manage content and access frequently used actions What’s New? By popular request, now when you click on the thumbnail of a Sta.sh or Playground item, you'll land on the page of the item itself rather than the editing modal. On Drafts, the upload date is now displayed instead of the word “Draft.” (For published content, the publish date displays). Labels are now positioned next to the date for better visibility. Draf'''
