["https://www.deviantart.com/about/policy/etiquette"]
title = "DeviantArt - Discover The Largest Online Art Gallery and Community"
description = "DeviantArt is the world's largest online social community for artists and art enthusiasts, allowing people to connect through the creation and sharing of art."
full_description = "DeviantArt is an expansive, worldwide community of artists young and old who create works spanning every medium, subject, and level of talent and skill. As the guiding force of this large and vibrant community, we have two primary and often conflicting goals in the service we provide for you, the members of the community. The first is to ensure that members are free to express themselves within reason with as few restrictions as possible while nurturing an environment of creativity, learning, and talent, while the second is to protect the members of the community - to the best of our abilities - from copyright infringement, discrimination, harassment, and prejudice. All members of the DeviantArt community are expected to be familiar with these rules of etiquette. By using DeviantArt you agree to these guidelines as well as our terms of service. Failure to follow these guidelines can result in deleted content, a suspended profile, or other restrictions to your account. It is our policy to welcome artists of all levels, from amateur to professional, and to that end we do not attach any minimum standards of quality to deviations submitted by our members; all manner of submissions and posts are welcome providing they comply with our terms of service, etiquette, and copyright policies. While we do not impose quality standards we do ask that you practice self-moderation in what you choose to post. Respect other authorsSubmit only content which you have created or that you have the right to share. Don't post anything you've copied or collected from the internet or that you don't have the right to post. Learn more about our copyright policy and our sharing etiquette policy. Tag your mature contentWhen we talk about mature content, we are referring to submissions which some viewers may find offensive, distasteful, or otherwise undesirable to view or read. Most commonly this includes, but is not limited to, nudity, sexual themes, scenes of blood and gore, some generally violent themes, and certain ideologically sensitive topics.You should also consider the audience when personalizing different aspects of your DeviantArt profile, such as your avatar. Personalizing your profile using mature content could result in that material being removed."
