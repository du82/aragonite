full_description = "We've designed our APIs to use open standards so developers can leverage off-the-shelf libraries. We aim to provide APIs that are as simple as possible yet still open the door to great possibilities. All APIs require that your client sends a User Agent and uses HTTP compression. Clients making requests not doing this will be rejected. To use our oAuth API first you need to have a DeviantArt account and then you need to login to register a new developer application. Once that's done you will be given a client_id and client_secret that can be used to authenticate users and access the API."
