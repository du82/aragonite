["https://devtomek.pl/blog/2018/11/22/projects/smartmirror---inteligentne-lustro-z-asystentem-glosowym"]
title = "SmartMirror - Inteligentne lustro z asystentem głosowym | DevTomek"
description = "SmartMirror jest urządzeniem, które pozwala na interakcję z różnymi usługami webowymi za pośrednictwem komend głosowych. Dodatkowo użytkownik może poruszać się po interfejsie aplikacji za pomocą prostych gestów dłoni."
full_description = 'SmartMirror - Inteligentne lustro z asystentem głosowym22 listopada 2018 · 6 min aby przeczytaćDevTomek.plAdminSmartMirror jest urządzeniem, które pozwala na interakcję z różnymi usługami webowymi za pośrednictwem komend głosowych. Dodatkowo użytkownik może poruszać się po interfejsie aplikacji za pomocą prostych gestów dłoni.DeprecatedProjekt ten jest przestarzały (deprecated) i obecnie kody źródłowe, które zostały w nim wykorzystane nie są już aktualne, ponieważ korzystają z niewspieranych już interfejsów API. Obecnie trwają pracę nad nową wersją tego projektu.Cel projektu​Głównym celem projektu było stworzenie urządzenia typu Internet Rzeczy (IoT) wykorzystującego asystenta głosowego oraz technologie webowe. Ostatecznie postanowiłem stworzyć inteligentne lustro, które będzie posiadało następujące funkcje:wyświetlanie prognozy pogody na najbliższe pięć dni,dodawanie i wyświetlanie wydarzeń z kalendarza,wyświetlanie zawartości skrzynki email,wyświetlanie i dodawanie postów w serwisie społecznościowym,wyświetlanie informacji odnośnie korków na drogach,ustalanie lokalizacji na podstawie adresu IP,sterowanie za pomocą komend głosowych,komunikacja z zewnętrzną baza danych czasu rzeczywistego,sterowanie za pomocą prostych gestów dłoni,wykrywanie obecności użytkownika,odtwarzanie dźwięku,prezentacja interfejsu graficznego użytkownika GUI,rejestracja dźwięku,pomiar temperatury powietrza,pomiar wilgotności otoczenia.Proces tworzenia urządzenia został podzielony na dwa główne etapy. Pierwszy stanowił projekt oraz realizację części sprzętowej urządzenia, czyli stworzenie korpusu oraz podłączenie wszystkich elementów peryferyjnych wchodzących w skład całego systemu. Drugim etapem był proces tworzenia oprogramowania urządzenia.Poniżej zamieściłem film przedstawiający finalną wersję urządzenia, która powstała w obrębie tego projektu.Hardware​Przed przystąpienie do tworzenia urządzenia wykonałem schemat blokowy części sprzętowej urządzenia (ang. hardware).Schemat blokowy urządzenia - hardwareNastępnie stworzyłem projekt korpusu urządzenia, który postanowiłem wykonać z czarnej płyty meblowej.Projekt obudowyW kolejnym kroku połączyłem wszystkie komponenty w całość według poniższego projektu.Projekt inteligentnego lustraFinalnie korpus urządzenia prezentuje się następująco:Ostateczna wersja korpusu urządzeniaPo stworzeniu korpusu urządzenia przystąpiłem do wyboru komputera oraz poszczególnych elementów peryferyjnych:Nazwa komponentuFunkcjaRaspberry Pi 3 model BGłówny komputer urządzeniaMonitor Fujitsu Siemens L19W-9Prezentacja interfejsu graficznego użytkownikaKonwerter sygnału HDMI do VGAWymagany do podłączenia monitoraZewnętrzna karta dźwiękowa Media-Tech MT5101Wymagana do podłączenia mikrofonu za pomocą złącza minijackCzujnika gestów APDS-9960Rozpoznawania prostych gestów dłoniCzujnika ruchu PIR HC-SR501Wykrywanie obecności użytkownikaZewnętrzny moduł pomiarowy​W skład inteligentnego lustra wchodzi również zewnętrzny moduł pomiarowy, który służy do zdalnego pomiaru temperatury powietrza oraz względnej wilgotności otoczenia.Nazwa komponentuFunkcjaModuł ESP8266 NodeMCUGłówna jednostka obliczeniowa modułuCzujnik temperatury DS18B20Pomiar temperaturyCzujnik wilgotności DHT11Pomiar wilgotnościOpis kluczowych komponentów zewnętrznego modułu pomiarowegoModuł ten służy do zdalnego pomiaru temperatury powietrza oraz względnej wilgotności otoczenia. Odczytane dane są następnie przesyłane do zewnętrznej bazy czasu rzeczywistego Firebase typu NoSQL. Komunikacja z bazą danych odbywa się za pośrednictwem sieci Internet z wykorzystaniem protokołu WebSocket, co pozwala na wyświetlanie informacji w czasie rzeczywistym. Baza Firebase stanowi główne medium transmisyjne pomiędzy zewnętrznym modułem pomiarowym a inteligentnym lustrem.Schemat komunikacji pomiędzy zewnętrznym modułem pomiarowym a urządzeniemNa koniec postanowiłem przedstawić poglądowy kosztorys urządzania.KomponentCena [zł]Aluminiowa rama30,00Monitor Fujitsu Siemens L19W-970,00Konwerter sygnału HDMI do VGA26,00Płyty meblowe15,00Kątowniki i wkręty30,00Lustro weneckie150,00Zewnętrzna karta dźwiękowa Media-Tech MT510110,00Raspberry Pi 3 model B, obudowa, radiatory i zasilacz249,00Karta pamięci microSD 32GB74,00Czujnik gestów APDS-996058,90Przewód HDMI8,90Akcesoria elektroniczne10,00Moduł ESP8266 NodeMCU36,90Czujnik temperatury DS18B2012,90Czujnik wilgotności DHT116,90Czujnik ruchu PIR HC-SR5017,50Czarna obudowa plastikowa8,00Suma:804,00Przybliżony koszt całego urządzenia wraz z zewnętrznym modułem pomiarowym wyniósł 804 zł.Software​Po zrealizowaniu sprzętowej części urządzenia przystąpiłem do tworzenia oprogramowania (ang. software). Poniżej zamieściłem schemat blokowy poszczególnych modułów urządzenia.Schemat blokowy urządzenia - softwareW pierwszej kolejności dokonałem implementacji asystenta głosowego. Wybór padł na Google Assistant, który został połączony z usługą Dialogflow służącej do tworzenia konwersacji w języku naturalnym.Użytkownik za pomocą komend głosowych może wykonywać następujące akcje:publikację postu - Facebook,dodawanie całodniowego wydarzania - kalendarz Google,dodawanie wydarzenia w konkretnym dniu - kalendarz Google,dodawanie wydarzenia w konkretnym dniu i godzinie - kalendarz Google,wyświetlanie następnego lub poprzedniego postu - Facebook,przełączanie pomiędzy kartami - interfejs graficzny aplikacji.Aplikacja urządzenia została podzielona na dwa moduły - klient oraz serwer. Aplikacje klienta została napisana w języku TypeScript (JavaScript) z wykorzystaniem Angular 5. Aplikacja serwera została napisana w języku JavaScript i uruchomiona w środowisku Node.js. Komunikacja pomiędzy aplikacjami odbywa się za pomocą protokołu WebSocket.Schemat aplikacji klient-serwer komunikującej się za pomocą protokołu WebSocketOprogramowanie urządzenia implementuje następujące funkcjonalności:dodawanie oraz wyświetlanie postów z serwisu społecznościowego Facebook,wyświetlenie informacji o aktualnym natężeniu ruchu oraz wyznaczenie optymalnej trasy z punktu A do punktu B,dodawanie oraz wyświetlanie wydarzeń z kalendarza Google,prognoza pogody,wyświetlenie wiadomości ze skrzynki pocztowej Gmail.W kolejnym etapie tworzenia oprogramowania stworzono interfejs graficzny aplikacji.Graficzny interfejs użytkownika​Interfejs graficzny aplikacji bazuje na komponencie Tabs. Każda z kart stanowi oddzielny moduł na którym prezentowana jest w sposób graficzny zawartość pozyskana z zewnętrznego serwisu webowego.Facebook GUIMaps GUICalendar GUIWeather GUIGmail GUIDodatkowo wyświetlana jest animacja pulsującego mikrofonu symbolizująca gotowość asystenta Google, co w praktyce oznacza, że użytkownik nie musi już aktywować asystenta za pomocą frazy "Hey Google" lub "Ok Google".Ikona mikrofonu symbolizująca gotowość asystenta GoogleZaimplementowano również tryb kompaktowy, który zmniejsza rozmiar prezentowanych kart.Widok kompaktowy modułu WeatherKażdy z modułów implementuje dedykowany lub stworzony przez społeczność interfejs programistyczny (ang. API). Niektóre z modułów zostały napisane w języku Python i komunikują się z aplikacją serwera za pośrednictwem protokołu UDP. Poniżej zamieściłem schemat blokowy wszystkich komponentów wchodzących w skład całego systemy.Schemat ideowy połączeń wszystkich modułówUrządzenie, które powstało w obrębie tego projektu stanowi bazę do dalszego rozwoju. Zastosowana konstrukcja modułowa pozwala na szybką rozbudowę istniejącego systemu bez konieczności ingerowania w pozostałe moduły.Tagi:ProjektyFirebaseESPRaspberry PiJavaScriptNode.js'
