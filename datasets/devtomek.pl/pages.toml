["https://devtomek.pl/blog/2019/09/24/programming/instalacja-emoji-w-systemie-linux"]
title = "Instalacja Emoji w systemie Linux | DevTomek"
description = "Dodajemy wsparcie dla Emoji w starszych systemach Linux za pomocą pakietu fonts-noto-color-emoji."
full_description = "Instalacja Emoji w systemie Linux24 września 2019 · 2 min aby przeczytaćDevTomek.plAdminDodajemy wsparcie dla Emoji w starszych systemach Linux za pomocą pakietu fonts-noto-color-emoji.Wstęp​Starsze wersje systemów Linux bazujące na Ubuntu w wersji niższej od 18.04 nie posiadają domyślnego wsparcia dla wyświetlania emotikonek, co często objawia się wyświetlaniem prostokątów zamiast emoji lub jakiś czarno-białych buziek imitujących emoji. Aby rozwiązać ten problem, należy zainstalować pakiet fonts-noto-color-emoji, który dostarcza graficzne emoji znane z nowoczesnych aplikacji.Emojipedia.org - przed instalacją fonts-noto-color-emojiInstalacja dla systemu Ubuntu >=18.04​Dla systemów bazujących na Ubuntu w wersji 18.04 oraz nowszych proces instalacji sprowadza się do wykonania jednej komendy z poziomu terminala, ponieważ pakiet fonts-noto-color-emoji znajduje się w standardowym repozytorium Ubuntu.sudo apt-get install fonts-noto-color-emojiInstalacja dla systemu Ubuntu <18.04​Dla systemów starszych niż Ubuntu 18.04 konieczne jest ręczne pobranie pakietu fonts-noto-color-emoji z centralnego repozytorium Ubuntu:wget http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_0~20180810-1_all.debPo pobraniu należy zainstalować pobrany pakiet wykonując poniższą komendę:sudo apt-get install ./fonts-noto-color-emoji_0~20180810-1_all.debOdświeżenie Font-Cache​Po zainstalowaniu pakietu fonts-noto-color-emoji konieczne jest odświeżenie systemowego cache dla fontów. W tym celu należy wykonać poniższą komendę.sudo fc-cache --force --verboseWeryfikację procesu instalacji można dokonać odwiedzając tą stronę: https://emojipedia.org.Emojipedia.org - po instalacji fonts-noto-color-emojiTagi:ProgramowanieLinux"
