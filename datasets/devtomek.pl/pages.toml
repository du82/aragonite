["https://devtomek.pl/blog/2018/09/18/projects/tester-tranzystorow-bipolarnych-na-ukladzie-ne555"]
title = "Tester tranzystorów bipolarnych na układzie NE555 | DevTomek"
description = "Tester tranzystorów jest małym układem służącym do testowania tranzystorów bipolarnych."
full_description = "Tester tranzystorów bipolarnych na układzie NE55518 września 2018 · 1 min aby przeczytaćDevTomek.plAdminTester tranzystorów jest małym układem służącym do testowania tranzystorów bipolarnych.Zasada działania​Generator astabilny (klasyczna aplikacja NE555) generuje ciąg impulsów zasilających badane tranzystory. Takie rozwiązanie umożliwia badanie tranzystorów odmiennej polaryzacji bez stosowania mechanicznego przełącznika zmieniającego polaryzacji dla NPN-PNP. Poziom niski na wyjściu generatora umożliwia badanie tranzystora typu PNP, wysoki NPN. Po dołączeniu do zacisków pomiarowych tranzystora dowolnego rodzaju układ automatycznie wyświetli typ tranzystora i określi czy jest sprawny.Wygląd układu (góra)Wygląd układu (dół)Wskazania testera​Stan tranzystora określany jest na podstawie dwóch diod LED:świeci jedna z diod: NPN lub PNP − tranzystor sprawny,świecą obie diody na przemian − tranzystor niesprawny (przebicie emiter−kolektor),nie świeci żadna dioda − tranzystor niesprawny (przerwa w tranzystorze).Układ został opracowany na podstawie kitu AVT-1347 z małymi modyfikacjami. W pliku do pobrania znajduje się schemat elektryczny oraz płytki PCB wykonany w programie Eagle oraz dokument pdf z dokładniejszym opisem zasady działania układu.Schemat elektrycznyProjekt płytki PCB PobierzTagi:Projekty"
