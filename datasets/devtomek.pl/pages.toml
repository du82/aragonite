full_description = "Raspberry Pi, noVNC i ngrok - zdalny dostęp przez Internet31 maja 2024 · 5 min aby przeczytaćDevTomek.plAdminZdalny dostęp do naszego Raspberry Pi możemy uzyskać na wiele sposobów, np. za pomocą Raspberry Pi Connect. Niestety, to rozwiązanie nie działa z Raspberry Pi 3. W tym poście przedstawię, jak można zrealizować taki dostęp za pomocą noVNC oraz ngrok, które działają dla wszystkich wersji Raspberry Pi i nie tylko.Tagi:ProgramowanieRaspberry PiCzytaj więcej Arduino Custom Data Station #3 - prezentacja danych7 grudnia 2020 · 5 min aby przeczytaćDevTomek.plAdminEtap #3, czyli dodajmy możliwość prezentacji danych w formie wykresów przy użyciu popularnej biblioteki Chart.js.Tagi:ProjektyJavaScriptNode.jsAVRArduinoCzytaj więcej Arduino Custom Data Station #2 - odczyt danych30 listopada 2020 · 6 min aby przeczytaćDevTomek.plAdminEtap #2, czyli tworzymy aplikację WEBową do odczytu danych z Arduino za pośrednictwem Serial Portu z wykorzystaniem Web Serial API.Tagi:ProjektyJavaScriptNode.jsAVRArduinoCzytaj więcej Arduino Custom Data Station #1 - wysyłanie danych24 listopada 2020 · 2 min aby przeczytaćDevTomek.plAdminEtap #1, czyli dokonujemy pomiaru temperatury oraz wilgotności powietrza przy użyciu Arduino z czujnikiem DHT11. Odczytane dane będą przesyłane do komputera za pośrednictwem Serial Portu i prezentowane w serial monitorze.Tagi:ProjektyJavaScriptNode.jsAVRArduinoCzytaj więcej Arduino Custom Data Station #0 - wprowadzenie23 listopada 2020 · 3 min aby przeczytaćDevTomek.plAdminTym razem postaram się opisać jak w łatwy i prosty sposób można stworzyć własny system IoT, który będzie odczytywał i zapisywał dane z Arduino za pośrednictwem serial portu, a następnie prezentował je w aplikacji webowej.Tagi:ProjektyFirebaseJavaScriptNode.jsAVRArduinoCzytaj więcej"
