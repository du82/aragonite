full_description = "dLight for LEGO MINDSTORMS Give your NXT a bright future with the dLight. The dLight is a bright LED that can be controlled by your NXT. A dLight is capable of producing millions of different colors that can be continuously on or blink in various patterns. Up to four dLights can be daisy chained on a single sensor port... Introduction The Dexter Industries NXTChuck allows you to control your LEGO MINDSTORMS robot with the Nintendo Wii® Nunchuk. The digital adapter plugs into any sensor port on your LEGO MINDSTORMS NXT. It connects a Wii Nunchuck to the adapter, and you can control your robot with the Wii Nunchuck! Setup To setup the NXTChuck, simply plug it into any one... Introduction In this how-to we will show you how to connect to and control a robot from your web-browser. There are three steps to connecting: Connect to the internet over a WIFI network, Establish a websocket connection, and then . . . Send and receive information. In this tutorial we assume you have already connected to the Internet and... Now you can control your LEGO MINDSTORMS robot from any iPhone or iPad with Dexter Industries WIFI Module! We have provided an example in RobotC for connecting your robot with step-by-step directions below on how to setup the connection. Connect your WIFI module to the internet. Use our WPA or WEP examples to connect to the internet and establish... Introduction The dSwitch is a controller designed to be used with LEGO® MINDSTORMS® NXT hardware and software. The dSwitch controls any appliance in your house, such as a light, a toaster, or anything else you can plug into a household socket. The device acts as a switch, allowing your NXT inventions to turn off and on any appliance in... Introduction The Dexter Industries dCompass is a compass sensor for LEGO® MINDSTORMS® NXT. This compact sensor detects magnetic fields for navigation. Using a magnetic sensor, the sensor is able to measure the earth’s magnetic field and returns a magnetic heading, telling you which way your robot is heading. The device can be used without calibration and can be calibrated with software to account..."
