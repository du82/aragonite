full_description = "The Dexter Industries Arduino GPS Shield can be purchased here. Easily add navigation to your Arduino projects with Dexter Industries Arduino GPS Shield! Dexter Industries GPS Shield for Arduino slides over the Arduino UNO, Leonardo, and Mega and many newer models of Arduino. The Arduino shield provides serial data to the Arduino. Slide it on and go outside! You can modify the pins you use with the Arduino shield. The standard examples use Pin 10 (see diagram above) but you can change the pin on the Arduino GPS shield to use pins 3, 10, 11, and 12, depending on your board and depending on other shields you may be stacking that may conflict with Pin 10. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
