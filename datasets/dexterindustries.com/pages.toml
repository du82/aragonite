title = "Enable or Disable BrickPi Communications - Dexter Industries"
description = "In the latest Dexter Industries Software, Raspbian for Robots 2015.11.04 or later, your BrickPi might appear to not communicate with the Raspberry Pi. How to Fix It If you are not able to get a response from the BrickPi+ motors and sensors, we recommend updating the serial communications ports on the software.  This can be done on the Desktop of the […]"
full_description = "In the latest Dexter Industries Software, Raspbian for Robots 2015.11.04 or later, your BrickPi might appear to not communicate with the Raspberry Pi. If you are not able to get a response from the BrickPi+ motors and sensors, we recommend updating the serial communications ports on the software. This can be done on the Desktop of the Raspberry Pi. Logon with VNC or using an HDMI monitor. On older versions of Raspbian for Robots, click on the icon in the lower left “IR Receiver Setup”. 4). Click “Exit.” The program will allow you to reboot. For the changes to take effect you must reboot your Raspberry Pi. The BrickPi+ and BrickPi use the serial lines to communicate with the Raspberry Pi. These serial lines are also needed to use the Grove Infrared Sensor with the GrovePi and GoPiGo. The two can not be used at the same time. We wrote special software that dedicates the serial lines on the Raspberry Pi to one product or the other. This software lets you disable the Infrared Receiver (enabling the BrickPi+) or enable the Infrared Receiver (disabling the BrickPi+). If you liked this tutorial, consider getting the SD Card with Raspbian for Robots here and our BrickPi kit here. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
