title = "Raspberry Pi - Dexter Industries"
full_description = "The Raspberry Pi is designed around the Broadcom BCM2835 SoC, which includes an ARM1176JZF-S 700 MHz processor, VideoCore IV GPU, and 1GB of RAM. The design does not include a built-in hard disk or solid-state drive. Instead, it relies on a microSD card for booting and long-term storage. A Wi-Fi Dongle, camera, and keyboard can all be easily added to the Raspberry Pi. Because it has an ARMv7 processor, it can run the full range of ARM GNU/Linux distributions, including Snappy Ubuntu Core, as well as Microsoft Windows 10 (see the Raspberry Pi blog for more information). It also has an identical form factor to the Model B+ and is completely compatible with Raspberry Pi 1. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
