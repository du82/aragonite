title = "NXTChuck - Dexter Industries"
description = "Introduction The Dexter Industries NXTChuck allows you to control your LEGO MINDSTORMS robot with the Nintendo Wii® Nunchuk.  The digital adapter plugs into any sensor port on your LEGO MINDSTORMS NXT.  It connects a Wii Nunchuck to the adapter, and you can control your robot with the Wii Nunchuck! Setup To setup the NXTChuck, simply plug it into any one of […]"
full_description = "The Dexter Industries NXTChuck allows you to control your LEGO MINDSTORMS robot with the Nintendo Wii® Nunchuk. The digital adapter plugs into any sensor port on your LEGO MINDSTORMS NXT. It connects a Wii Nunchuck to the adapter, and you can control your robot with the Wii Nunchuck! To setup the NXTChuck, simply plug it into any one of the four sensor ports on the NXT. The NXTChuck will work on any of the four sensor ports. Warning, improper orientation of Wii extension plug and NXTChuck adapter board could result in permanent damage to the NXTChuck, Wii extension, and/or possibly the NXT. Always ensure proper orientation before plugging the NXTChuck into the NXT. Refer to the image on the right for proper orientation. The NXTChuck is supported in NXT-G, Labview, NXC, and soon ROBOTC. Examples, blocks, and drivers can be downloaded from our download section. Blocks for NXT-G can be downloaded from our download section. After installing the NXT-G Blocks for the NXTChuck (see our guide on installing 3rd Party NXT-G Blocks), you should see the NXTChuck icon in the “Advanced Pallet.” The NXTChuck Functions in NXT-G. From the block you can access the x and y-axis of the joystick, the accelerometer’s x,y, and z values, the trigger buttons and the port the sensor is connected to. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
