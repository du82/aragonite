title = "Dexter Industries"
description = "Dexter Industries builds robot kits that help people learn how to program. Most of our kits are based on the Raspberry Pi, a credit card sized computer."
full_description = "Dexter kits help you build, learn, and experiment with robotics – from kids, to college students, to hobbyists, and researchers. Dexter kits are designed to help you get started and go further with robotics. Follow along with playful projects and curriculum to make learning fun for everyone. Educators all over the world are using Dexter robot kits in the classroom. You can get the most out of your Dexter robots when you visit the DexterEd page for more information and sign up for a free Teacher Trial! Modular Robotics announces recall of Dexter Industries Rechargeable Battery Packs, sold between March 2018 and February 2020 and compatible with GoPiGo and BrickPi robots. Consumers should stop using the Dexter Industries Rechargeable Battery Packs, contact Modular Robotics for a free replacement battery pack, and then safely dispose of the defective product by following local laws for disposal of the batteries. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
