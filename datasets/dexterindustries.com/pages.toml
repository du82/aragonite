["https://www.dexterindustries.com/manual/page/2"]
title = "Manuals - Dexter Industries"
description = "Now you can control your LEGO MINDSTORMS robot from any iPhone or iPad with Dexter Industries WIFI Module!  We have provided an example in RobotC for connecting your robot with step-by-step directions below on how to setup the connection. Connect your WIFI module to the internet.  Use our WPA or WEP examples to connect to the internet and establish..."
full_description = "Now you can control your LEGO MINDSTORMS robot from any iPhone or iPad with Dexter Industries WIFI Module! We have provided an example in RobotC for connecting your robot with step-by-step directions below on how to setup the connection. Connect your WIFI module to the internet. Use our WPA or WEP examples to connect to the internet and establish... Introduction The dSwitch is a controller designed to be used with LEGO® MINDSTORMS® NXT hardware and software. The dSwitch controls any appliance in your house, such as a light, a toaster, or anything else you can plug into a household socket. The device acts as a switch, allowing your NXT inventions to turn off and on any appliance in... Introduction The Dexter Industries dCompass is a compass sensor for LEGO® MINDSTORMS® NXT. This compact sensor detects magnetic fields for navigation. Using a magnetic sensor, the sensor is able to measure the earth’s magnetic field and returns a magnetic heading, telling you which way your robot is heading. The device can be used without calibration and can be calibrated with software to account... Introduction The Dexter Industries Inertial Motion Unit (IMU) Sensor measures acceleration, tilt, and rotation on all three axes. The sensor combines an accelerometer and a gyroscope into one sensor for the LEGO Mindstorms system. Build robots that know which way is up, can measure tilt, balance themselves, and measure acceleration and rotation on all axes all at once. Accelerometer:... Introduction The Dexter Industries Thermal Infrared Sensor reads surface temperatures of objects. It is a non-contact thermometer based on the MLX90614. Detecting the infrared radiation from an object, the sensor can read object temperatures between -90°F and 700°F (-70°C and +380°C). The sensor has a high accuracy of 0.5°C and a resolution of 0.02°C. The Thermal Infrared Sensor reads... Introduction The Dexter Industries Wifi sensor for Lego Mindstorms NXT is a sensor designed to allow your NXT to connect to the internet via a local Wifi network. The sensor operates with standard 802.11 b/g/n access and can be configured to run on the vast majority of home networks. The Dexter Industries Wifi Sensor connects to the NXT via..."
