["https://www.dexterindustries.com/manual/dlight_for_lego_mindstorms"]
title = "dLight - Dexter Industries"
description = "dLight for LEGO MINDSTORMS Give your NXT a bright future with the dLight. The dLight is a bright LED that can be controlled by your NXT. A dLight is capable of producing millions of different colors that can be continuously on or blink in various patterns. Up to four dLights can be daisy chained on a single sensor port and […]"
full_description = "Give your NXT a bright future with the dLight. The dLight is a bright LED that can be controlled by your NXT. A dLight is capable of producing millions of different colors that can be continuously on or blink in various patterns. Up to four dLights can be daisy chained on a single sensor port and still be controlled individually. A set of dLights consists of one adapter board, three satellite boards and three cables for connecting the boards. Both the adapter and the satellite boards have a small but bright LED on one side and the electronics and connectors on the other side. The boards have holes to connect them to your LEGO device. The adapter board has a standard LEGO connector and a two smaller custom connectors, one to the left and one to the right. The adapter board can be connected to a NXT using the NXT connector and a standard NXT cable. The two custom connectors are used to connect satellite boards using the cables that come with the set. The satellite boards have no NXT connector and are smaller than the adapter board. They do have two custom connectors that are used to connect them to each other or to an adapter board. Satellite lights have two very small switches on the back side that are used to select an address and give the Satellite a unique address for commands. The set comes with three custom cables to connect the satellite boards to each other or to an adapter board. The cables are color coded to help you make a proper connection. To connect all four dLights one needs just one free sensor port on the NXT. The adapter board is connected to the sensor port. The satellite boards are connected to the adapter board or to another satellite board. When connecting the satellite boards one must make sure to properly connect the four pins, an upper pin must always be connected to another upper pin. Use the different colors of the cable to check this. It does not matter if you use the right or left connector, one can freely choose either one. A satellite board can be connected to another satellite board, and so on, as long as one of the satellite boards is connected to the adapter board."
year_published = 2012
year_updated = 2012
