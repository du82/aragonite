title = "Temperature, Humidity & Pressure Sensor - Dexter Industries"
description = "Temperature, Humidity & Pressure Sensor The Temperature Humidity and Pressure Sensor attaches to the GrovePi, GoPiGo and BrickPi to measure environmental conditions. It can be used to build projects like a classroom weather station or plant monitoring station. $19.99 About the Temperature Humidity Pressure Sensor for a Raspberry Pi Robot The Temperature Humidity Pressure Sensor can be mounted to Dexter […]"
full_description = '''The Temperature Humidity and Pressure Sensor attaches to the GrovePi, GoPiGo and BrickPi to measure environmental conditions. It can be used to build projects like a classroom weather station or plant monitoring station. The Temperature Humidity Pressure Sensor can be mounted to Dexter Industries robots like the GoPiGo, GrovePi, and BrickPi . It detects temperature, humidity and pressure from the surrounding environment. For this reason, it is often called a weather sensor. The sensor will measure atmospheric pressure between 30kPa to 110kPa, relative humidity and temperature. It comes with a grove cable to plug the sensor into the GoPiGo3, BrickPi, or GrovePi and begin measuring; no soldering required! This sensor can be used by educators to teach concepts such as weather, environmental impact, and even plant growth. Some popular projects that use this sensor include a weather station and plant monitoring station. /*<![CDATA[*/ (function () { var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js'; if (window.ShopifyBuy) { if (window.ShopifyBuy.UI) { ShopifyBuyInit(); } else { loadScript(); } } else { loadScript(); } function loadScript() { var script = document.createElement('script'); script.async = true; script.src = scriptURL; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script); script.onload = ShopifyBuyInit; } function ShopifyBuyInit() { var client = ShopifyBuy.buildClient({ domain: 'modrobotics.myshopify.com', storefrontAccessToken: '3c818648268b3e3aab483e090028f8cd', }); ShopifyBuy.UI.onReady(client).then(function (ui) { ui.createComponent('product', { id: '5308535406759', node: document.getElementById('product-component-1593443373053'), moneyFormat: '%24%7B%7Bamount%7D%7D', options: { "product": { "styles": { "product": { "@media (min-width: 601px)": { "max-width": "calc(25% - 20px)", "margin-left": "20px", "margin-bottom": "50px" }, "text-alig