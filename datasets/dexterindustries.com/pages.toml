["https://dexterindustries.com/GrovePi/projects-for-the-raspberry-pi"]
title = "Raspberry Pi Projects with the GrovePi"
description = "A set of projects for the GrovePi and Raspberry Pi projects that bring sensors and electronics to the Raspberry Pi."
full_description = "Here we have a list of example projects that show just how easy it is to start a project with the Raspberry Pi. These Raspberry Pi projects combine easy-to-use Grove sensors with the powerful Raspberry Pi. This project shows a simple example in which we connect the Grove Pi to a rotary angle sensor (a fancy name for a potentiometer). The Raspberry Pi reads the analog value and changes the PWM to the LED which sets the LED’s intensity. The LED is dimmed using the potentiometer. In this project we’re going to show you how to build a custom Minecraft Controller. With some parts, the Raspberry Pi, and the GrovePi+, we will make a custom controller that automates some tasks and makes it easier and faster to build, destroy, and fly in the game Minecraft. In this project, we use a Grove Accelerometer and a Buzzer to tell whether the Accelerometer is tilted or not. We use a Grove switch to turn the entire circuit on and off. This is a simple example for the Raspberry Pi to demonstrate how to use multiple Grove Sensors with GrovePi and Raspberry Pi in your Projects. All the parts used in this project are available in the GrovePi Starter Kit. In this project, we use a Grove DHT (Digital Humidity and Temperature) sensor as a Raspberry Pi temperature sensor. This project uses a Grove OLED display to show the temperature and humidity. In this project we tweet the temperature, light, and sound levels with our Raspberry Pi. The data is taken by the GrovePi and pushed to our Twitter feed with the Raspberry Pi. In this project we use an Ultrasound Sensor to detect if anyone has entered the room. We use a Raspberry Pi Camera to take a photo of the intruder, and the Raspberry Pi sends an e-mail to us. We added a few actuators like a status LED, a relay (to control any electronic circuit . . . because we can), a power switch to turn the entire thing on and off, and a buzzer which makes a loud sound whenever someone comes in. With this project, we will see how to detect if there’s a non-secure wifi around us. This is also handy when you travel and don’t have your usual places to connect to the Internet. You could be walking down the street until the GrovePi+ finds a coffee place or a restaurant that offers free WiFi. This is often referred to as ‘wardriving‘."
