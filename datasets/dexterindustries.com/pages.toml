title = "Playstation Controller - Dexter Industries"
description = "Overview The Dexter Industries Playstation Dual Shock Controller Shield is a project we’ve developed to interface the PlayStation 2 style controller to the Arduino.  The shield allows you to connect any Playstation 2 device to the Arduino. The best place to start for hardware is Bill Porter’s Playstation 2 Device Page.  This page gives a great overview of what’s going […]"
full_description = "The Dexter Industries Playstation Dual Shock Controller Shield is a project we’ve developed to interface the PlayStation 2 style controller to the Arduino. The shield allows you to connect any Playstation 2 device to the Arduino. The best place to start for hardware is Bill Porter’s Playstation 2 Device Page. This page gives a great overview of what’s going on between the Arduino and the Playstation 2 Controller. We have a fork of the PS2x Arduino Library on our Github page. The software comes with drivers and a full example for reading the PS2 device information. The full schematic and board design can be downloaded from our Github Repository for the Playstation Controller. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
