["https://www.dexterindustries.com/howto/install-raspbian-for-robots-image-on-an-sd-card"]
title = "Install the Image on The Raspberry Pi"
description = "A tutorial for Installing the Raspbian for Robots image on the Raspberry Pi. We show you how to install the image on the raspberry pi using a Mac and a PC."
full_description = "This tutorial will show you how to download and install Dexter Industries software, either GoPiGo OS or Raspbian for Robots on an SD Card. We show you how to install the image on the Raspberry Pi using a Mac and a PC. Before beginning, make sure you are using a 8GB microSD Card or larger (we recommend a 8 GB card). You will need: Next, put the micro SD card into your micro SD card adapter. Put the SD card into your SD card reader. Insert the SD Card into your PC SD Card reader. Select “Etcher for PC” or “Download for Windows >= xx”, on the big green button in the middle of the page. This should begin your download. The total size of the download is about 80 MB. This should download a file named something like `Etcher-1.0.0-beta.19-win32-x64.exe` Once the download is complete, double click on the “.exe” file and follow the directions to install Etcher on your PC. Now, find the file we downloaded earlier. Drag this file over to the blue “Select Image” button on the Etcher program. You can also click the blue “Select Image” button and find the file on your file directory. If you haven’t inserted your SD card at this point, please do. You should see it automatically pop up, and the red “Connect a Drive” button will disappear, replaced with information about your SD Card location. Note a few things on Step 2 at this point. First, the disk location is showing. In our case it is `I: – 7.9 GB`. Your drive might be different, depending on your computer. Also, our SD Card is 8.0 GB, yours may be a different size. If you see a number that is much larger than your SD Card, stop and seek help. At this point, we’re ready to flash the image onto the SD card. Press the blue “Flash!” button. After a few seconds, you should see progress. Note in the picture below the image has 9% written, and the speed is shown below the blue button. Depending on the SD card you are using and your PC, the time to flash the image may take some time. Finally, after the image is flashed, the Etcher software will check to make sure it is properly written to the SD card (this is called Validating)."
