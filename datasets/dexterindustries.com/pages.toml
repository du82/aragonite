title = "DexterEd - Educational Robots with the Raspberry Pi"
description = "DexterEd builds great resources for educators to make learning about technology more accessible for everyone. This includes robots with the Raspberry Pi."
full_description = "Students will investigate different types of energy & the flow of energy by learning about how the GoPiGo works. Long term investigation, measuring and monitoring plant growth with light sensors, camera, moisture sensors & more. By building their own weather station students will learn how technology can assist with the prediction of weather. Perfect curriculum for middle school students – great to use in maker spaces or technology classes. See the standards it covers. Have you ever seen an activity using robotics and thought, “That would be great, but I don’t have enough TIME?” Do you want to incorporate robotics or programming, but you do not have much experience yourself? In this webinar, Lisa Rode, sixth grade classroom teacher at Kings Glen Elementary in Fairfax County, VA, presents how to include robotics and programming in your school. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
