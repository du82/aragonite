["https://www.dexterindustries.com/howto/installing-the-raspberry-pi-camera"]
title = "Installing the Camera - Dexter Industries"
description = "A step by step guide to installing the Raspberry Pi Camera. This tutorial walks you through setting up the Raspberry Pi Camera hardware and software."
full_description = "The Raspberry Pi Camera is useful for all of Dexter products, be it the GoPiGo, the BrickPi, or the GrovePi. So here’s a step-by-step explanation about how to connect that useful little magical eye! It is best to install the camera to the Raspberry Pi without the extra boards. In other words, remove the Pi from the GoPiGo, or the GrovePi board, in order to have just the Pi. On the Raspberry Pi B+, 2 and 3, the camera port is between the audio port and the HDMI port. On the original Raspberry Pi B, it is between the Ethernet port and the HDMI port. To open the port, use two fingers and lift the ends up slightly. Please note that there is another port on the Pi board that looks just the same, but that other one is not meant for the camera. The cable has to be inserted with the right orientation: the blue has to face the Ethernet port, and the silver side is facing the HDMI port. Insert the cable so that almost no blue is showing. This photo shows the beginning of the insertion. To close the port and keep the cable snugly in place, push the top of the port while holding the cable with the other hand. Because you’re pushing it down, more blue will be exposed. That’s okay. Hold the Pi in one hand, and the camera cable in the other. Give a gentle tug. No force is needed, really. If the cable is not properly held in place, it will slide out of the port. You will feel a resistance if it’s inserted solidly. Just a little pull is enough. On the back of the camera, you will find a similar cable port. It opens and closes the same way as the one on the Raspberry Pi but it’s requires a little bit more pressure to get it opened than the one on the Pi. The case for GoPiGo has two slots where the camera cable can go through. One is to the side and is usually used when there’s also an ultrasonic sensor on the servo. The other one is in the center and is usually used when the camera is attached to the servo motor instead of the ultrasonic sensor. Both are a tight fit for the camera cable. Make sure that when you pull the cable through, the metal side of the connector is facing forward, and not the blue side, unless you want the camera to check the robot’s back. This implies that the cable has to be twisted once."
