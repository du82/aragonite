title = "GoPiGo3 Tutorials and Documentation for your Raspberry Pi Robot Car"
description = "Getting Started is easy with the GoPiGo3 Raspberry Pi Robot. Here we outline tutorials and documentation on setting up your Raspberry Pi Robot."
full_description = "Congratulations on getting a GoPiGo Raspberry Pi Robot Kit! These are instructions for the GoPiGo3. If you have the GoPiGo2, please go here. This page and the sub-pages will help walk you through getting it set up and started. We recommend you go through each page, in the following order: After you have completed all the steps above, you can make something and share it with the community. After you’ve assembled your GoPiGo3 and powered and connected to it, you’re ready to do some programming! We have 2 different operating systems, one for beginners called DexterOS, and one for advanced users called Raspbian for Robots. DexterOS programming is done entirely on the GoPiGo3, in the browser. DexterOS teaches programming skills using a Blockly-based programming language, Bloxter. Bloxter is easy to get started with and fun to use. Lessons on programming the GoPiGo3 with Bloxter are built right into the software. Projects and Curriculum at all different levels are available in our project platform community, Dexter Studio. You can search by different languages, age ranges and even project duration. Python, the most widely used programming language in education, is a professional level programming language that is easy to start with. The GoPiGo3 is ready to be programmed in Python! Check out our Python documentation here. Scratch is an easy to learn graphical programming language used in schools, coding clubs, and after school robotics and coding programs and camps. Click here to learn more about using GoPiGo3 with Scratch. Users on the Advanced operating system, Raspbian for Robots can try out the following projects in Python & Scratch. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings."
