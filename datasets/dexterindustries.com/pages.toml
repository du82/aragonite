["https://www.dexterindustries.com/robotics-challenges-for-python-and-gopigo"]
title = "Projects · GoPiGo.io"
description = "GoPiGo Robot Projects Jump to… Getting Started with Bloxter Mars Rover Projects Python Challenges Misc. Projects GoBox Missions Getting Started with Bloxter Bloxter is an easy-to-use programming language for the GoPiGo. Drag-and-drop code blocks connect like puzzle pieces to make coding your own robot easier. GoPiGo OS includes several lessons to help you start programming […]"
full_description = "Bloxter is an easy-to-use programming language for the GoPiGo. Drag-and-drop code blocks connect like puzzle pieces to make coding your own robot easier. Set out and explore the Red Planet with GoPiGo. Work your way through this progressive series of projects that connect robotics and science. Explore more than 20 hours of intermediate Python activities with Jupyter Notebooks and the GoPiGo robot. Complete this series of five challenges to learn and practice all sorts of computer science essentials. Help your robot navigate an area of previously unseen terrain to reach its destination, passing through a number of waypoints. Design a robot that can navigate through the maze-like jungle, without bashing into things, and rescue a group of lost scientists. Improve the number of shipments a robot picker can handle for the world’s largest online retailer, Amazing.com. In this challenge, you’ll build a color-aware mail delivery robot for the residents of GoPiGo Drive. In addition to the projects above, there are loads of projects for your GoPiGo Raspberry Pi robot. Access these projects on GoLabs."
