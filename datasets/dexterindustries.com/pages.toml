["https://dexterindustries.com/BrickPi/projects/rolly-robot-a-rolling-alarm-clock-with-raspberry-pi"]
title = "Rolly Robot - Dexter Industries"
description = "Ever find yourself turning off your alarm clock without realizing it only to wake up an hour later and have to race out the door?  In this build we are going to build a robot alarm clock that makes you work to turn it off!  Not only that, but the robot will be able to sync to your Google Calender […]"
full_description = "Ever find yourself turning off your alarm clock without realizing it only to wake up an hour later and have to race out the door? In this build we are going to build a robot alarm clock that makes you work to turn it off! Not only that, but the robot will be able to sync to your Google Calender allowing for the alarm time to be adjusted using almost any device. Today almost everyone uses their phone as an alarm clock which has a range of benefits. Phones are easy to set, easy to adjust, play custom songs, and can even sense when is the best time to wake you up. The problem is, unless your phone is across the room, we use our phones so much we can literally use them in our sleep. Why not build a robot that is able to do all these things, but wont stop till you get up and start moving! Our robot will be able to easily move randomly around the room over any surface with ease playing a custom alarm tone. In order to set the alarm simple link the program on the BrickPi to your Google account and it will search events with the title “wake1” and automatically start the alarm at the events time. This means the alarm time can very easily be adjusted using any device that can access your Google Calender. In order to begin we will need to collect the components from the bill of materials below. These will be the components needed in order to build our robot. It is possible to use either LEGO® Mindstorm® NXT or EV3 motors and sensors for this project. Upon completion of collecting all of the necessary part it will simply be a matter of assembling the robot. This can be done by following the step by step instructions found here in PDF format. Instruction Manual Once the robot has been assembled it is important to remember which sensors and motors are plugged into each port. For our software to work we will need to install a few additional components to our Raspberry Pi so that everything is able to operate correctly. You will first need to download the .zip folder below. While there are two versions the ultrasonic sensor is the sensor which determines which version you are able to use."
