title = "GrovePi+ Starter Kit - Dexter Industries"
description = "GrovePi+ Starter Kit GrovePi helps you build your own smart devices. The Starter Kit includes the GrovePi board, 2-sided Acrylic Case, 12 Grove sensors, Raspberry Pi 3, Ethernet Cable, Power Adapter and microSD Card (blank, but you can download the software for free from our site). $229.99 GrovePi is a hardware system that helps you connect, program, and control sensors […]"
full_description = "GrovePi helps you build your own smart devices. The Starter Kit includes the GrovePi board, 2-sided Acrylic Case, 12 Grove sensors, Raspberry Pi 3, Ethernet Cable, Power Adapter and microSD Card (blank, but you can download the software for free from our site). GrovePi is a hardware system that helps you connect, program, and control sensors to build your own smart devices. It is built to work with all versions of the Raspberry Pi, a very powerful, yet small computer board about the size of a credit card. Learn more about it on the GrovePi product page. The GrovePi board connects to the Raspberry Pi to the Grove Sensor System and is a Raspberry Pi Internet of Things Kit. The kit allows you to easily connect hundreds of sensors to the Raspberry Pi. Simply connect a cable from the GrovePi to your sensor, download our software examples, and write programs on your Raspberry Pi computer to control and automate any device. The GrovePi+ Starter Kit gets you up and running with the GrovePi quickly. This Raspberry Pi Internet of Things Kit includes: Connecting sensors to the Internet of Things (IOT) has never been this easy! No need for soldering or breadboards: plug in your Grove sensors and start programming directly. GrovePi+ is an easy-to-use and modular system for hardware hacking with the Raspberry Pi and the Internet of Things. The GrovePi is a system that connects over 100 Grove sensors and devices to the Raspberry Pi. GrovePi is an easy-to-use and modular system for hardware hacking with the Raspberry Pi. No need for soldering or breadboards: plug in your Grove sensors and start programming. Grove is an easy to use collection of more than 100 inexpensive plug-and-play modules that sense and control the physical world. By connecting Grove Sensors to the Raspberry Pi, we empower you Pi to connect to the physical world. With hundreds of sensors to choose from in the Grove collection, the possibilities for interaction are endless. GrovePi is about integrating Grove sensors and modules with the performance and ease of the Raspberry Pi."
