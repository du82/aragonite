title = "Light & Color Sensor - Dexter Industries"
description = "Light & Color Sensor The Light & Color Sensor attaches to the GrovePi, GoPiGo and BrickPi to measure light levels and detect different colors. It can be used to build projects like a Rubik’s Cube solver, weather station, or plant monitoring station. $19.99 Light & Color Sensor for a Raspberry Pi Robot The Light & Color Sensor can be mounted to […]"
full_description = '''The Light & Color Sensor attaches to the GrovePi, GoPiGo and BrickPi to measure light levels and detect different colors. It can be used to build projects like a Rubik’s Cube solver, weather station, or plant monitoring station. The Light & Color Sensor can be mounted to Dexter Industries robots like the GoPiGo, GrovePi, and BrickPi. It detects light levels and color from the surrounding environment. It comes with a Grove cable to plug the sensor into the GoPiGo3, BrickPi, or GrovePi and begin measuring; no soldering required! This RGB color and light sensor helps your robot see in color and light. The sensor can read all visible colors and light intensity. You can use the sensor to read the color of an object, or to read the intensity of light in the room. This sensor can be paired with the Temperature, Humidity, & Pressure Sensor and used by educators to teach concepts such as weather, environmental impact, and even plant growth. Some popular projects that use this sensor include a weather station and plant monitoring station. /*<![CDATA[*/ (function () { var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js'; if (window.ShopifyBuy) { if (window.ShopifyBuy.UI) { ShopifyBuyInit(); } else { loadScript(); } } else { loadScript(); } function loadScript() { var script = document.createElement('script'); script.async = true; script.src = scriptURL; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script); script.onload = ShopifyBuyInit; } function ShopifyBuyInit() { var client = ShopifyBuy.buildClient({ domain: 'modrobotics.myshopify.com', storefrontAccessToken: '3c818648268b3e3aab483e090028f8cd', }); ShopifyBuy.UI.onReady(client).then(function (ui) { ui.createComponent('product', { id: '5308535537831', node: document.getElementById('product-component-1592591945539'), moneyFormat: '%24%7B%7Bamount%7D%7D', options: { "product": { "styles": { "product": { "@media 