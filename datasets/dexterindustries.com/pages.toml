["https://www.dexterindustries.com/manual/controlling-a-mindstorms-robot-with-a-web-browser"]
title = "Controlling a MINDSTORMS Robot with a Web Browser - Dexter Industries"
description = "Introduction In this how-to we will show you how to connect to and control a robot from your web-browser. There are three steps to connecting: Connect to the internet over a WIFI network, Establish a websocket connection, and then . . . Send and receive information. In this tutorial we assume you have  already connected to the Internet and have […]"
full_description = "In this tutorial we assume you have already connected to the Internet and have an Internet connection (see our downloads section for examples for connecting your LEGO MINDSTORMS NXT to a WIFI network). We used RobotC for the following example. Websockets are an Internet protocol that establish two-way communications between a web-browser (such as Apple’s Safari, Internet Explorer or Google Chrome) and a server (such as the WIFI sensor for LEGO MINDSTORMS). Unlike previous examples in HTTP, websockets can send information very quickly, allowing for rapid, real-time control and monitoring of sensors on the robot. With HTTP protocol, there can be a noticeable lag between sending and receiving information; with websockets, that lag is almost eliminated. It is important to note that there are two types of websockets currently being used by different browsers. We have RobotC examples for both. You must match the code example with the browser type you are using. The first type we will call Safari type. The example code for Safari-type browsers are all labeled with the word “Safari”. The Safari example will work for Safari, Mac iOS (iPad, iPhone, Touch), Opera, and Android’s browser. The second type we call Chrome. The example code for Chrome-type browsers are all labeled with the word “Chrome”. The Chrome example will work for Google’s Chrome browser and Firefox/Mozilla browsers. Connect to the Internet – For this example to work properly, you must be connected to the Internet: both the Dexter Industries dWiFi Sensor and your web browser must be connected before beginning. Establishing a Connection – This is the most complicated step, but it is taken care of by the software library we wrote. This section is to help you better understand what’s going on behind the scenes. The first step in setting up a connection over websockets is to perform a handshake between the webpage and the Dexter Industries’ WIFI Module. The handshake begins by the webpage sending a key, or a set of keys, to the LEGO MINDSTORMS NXT. The NXT must calculate a response and return the exact response the webpage expects. If it does not send the exact response the browser expects back, the webpage will drop the connection."
