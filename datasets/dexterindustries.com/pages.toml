["https://www.dexterindustries.com/howto/use-google-cloud-vision-on-the-raspberry-pi"]
title = "Use Google Cloud Vision On the Raspberry Pi and GoPiGo - Dexter Industries"
description = "In this tutorial we show you step by step how to use Google Cloud Vision on the Raspberry Pi with a little bit of Python."
full_description = "What is Google Cloud Vision API? Check out the video by Google here: Use Google Cloud Vision on the Raspberry Pi to take a picture with the Raspberry Pi Camera and classify it with the Google Cloud Vision API. First, we’ll walk you through setting up the Google Cloud Platform. Note: the Google Cloud Platform may change in the future and this is out of our control. We’ve updated this tutorial on April 2019. Next, we will use the Raspberry Pi Camera to take a picture of an object, and then use the Raspberry Pi to upload the picture taken to Google Cloud. Finally, we can analyze the picture in the cloud, and the cloud will either try to label the picture (tell us in text what’s going on in the picture), or try to find logos in the picture (company logos that are in the picture) or analyze faces in the picture (tell us everything from emotions on the face to where the face is on the picture). Skynet here we come! These directions are meant to simplify getting started with Cloud Vision on your Raspberry Pi. They are derived from directions found here but modified to work with the Raspberry Pi, and simplify set up. We will use Google Cloud Vision on the Raspberry Pi to detect images with these three python examples. The Google Cloud Account requires a credit card although low use projects will not incur charges. Do verify the billing information before going ahead. This is controlled by Google and we have no say in it. Verify pricing before going ahead with the project and know your limits! These directions assume you’re using Raspbian for Robots on your SD Card. You can buy an SD Card with Raspbian for Robots on it, or you can download it for free and install it using our directions here. In this picture we’ve asked Google Cloud Vision to analyze the GoPiGo on the left, with the returned text response on the right. It returns “labels” (the things it sees in the picture) such as “vehicle”, “wheel”, “toy”, “product”, and “model car”. Pretty good job Google!"
year_published = 2025
