["https://www.dexterindustries.com/about"]
title = "About Dexter - More information on us!"
description = "Meet the company behind the Dexter line of robots."
full_description = "Modular Robotics started as a spin-off from Carnegie Mellon University, where founder Eric Schweikardt invented Cubelets while working on a PhD. After years of research and development, Cubelets robot blocks were released to the public in 2010. Funding came from National Science Foundation grants and venture capital from the Foundry Group. This began our work of trying to make the world a better place with thousands and thousands of tiny robots. Production of Cubelets started inside a small house in Boulder, CO where circuit boards were hand-assembled with tweezers and hot plates. In late 2013, Modular Robotics launched the MOSS robot construction system on Kickstarter. The campaign reached its $100k goal in 12 hours and went on to raise more than three times the original goal. Over the next several years, the Modular Robotics factory grew and expanded to fill a 15,000 square foot facility that utilized a fully functional SMT line and automated production processes. Cubelets and MOSS continued to grow in popularity stressing our production limits. To meet the growing demand for Cubelets, production was moved to a manufacturing partner in Shenzhen in 2016. More than 10 years after being introduced to the public, Cubelets robot blocks continue to inspire and engage children, students, and museum-goers all over the world. In 2019, Modular Robotics began the next chapter in its history by acquiring Dexter Industries, another educational robotics company. In addition to Cubelets, Modular Robotics now makes the GoPiGo Raspberry Pi robot, BrickPi, GiggleBot micro:bit robot, GrovePi, and PivotPi. Each of these robots leverages popular computing platforms and extends their capabilities to the field of robotics. Each platform serves a unique audience and is rated at the top of their respective niche. To date, work continues supporting a family of robotics brands and developing new experiences that will continue what is becoming a decades-long tradition of building tools that help educate and inspire people all over the world."
