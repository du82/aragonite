description = "IMU Sensor The IMU Sensor attaches to the GrovePi, GoPiGo and BrickPi to detect motion, orientation, and position of your robot. It has a compass, accelerometer, and gyroscope and is used to build a BalanceBot! This page is obsolete. Please visit GoPiGo.IO for up to date information IMU Sensor for a Raspberry Pi Robot The IMU (Inertial Measurement Unit) Sensor […]"
full_description = '''The IMU Sensor attaches to the GrovePi, GoPiGo and BrickPi to detect motion, orientation, and position of your robot. It has a compass, accelerometer, and gyroscope and is used to build a BalanceBot! The IMU (Inertial Measurement Unit) Sensor can be mounted to Dexter Industries robots like the GoPiGo, GrovePi, and BrickPi . It detects motion, orientation, and position of your robot. The sensor has 9 degrees of freedom (9-DOF) and provides an accurate and high-speed orientation of your robot. The sensor has a built in compass, accelerometer, and gyroscope. You can use these to tell which compass direction your robot is turned to, how fast it is turning, what angle it is to the ground, and how fast it is changing speed. It comes with a grove cable to plug the sensor into the GoPiGo3, BrickPi, or GrovePi and begin measuring; no soldering required! This sensor can be paired with the Distance Sensor and used by educators to teach advanced math concepts as they turn their BrickPi or GoPiGo into a BalanceBot! /*<![CDATA[*/ (function () { var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js'; if (window.ShopifyBuy) { if (window.ShopifyBuy.UI) { ShopifyBuyInit(); } else { loadScript(); } } else { loadScript(); } function loadScript() { var script = document.createElement('script'); script.async = true; script.src = scriptURL; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script); script.onload = ShopifyBuyInit; } function ShopifyBuyInit() { var client = ShopifyBuy.buildClient({ domain: 'modrobotics.myshopify.com', storefrontAccessToken: '3c818648268b3e3aab483e090028f8cd', }); ShopifyBuy.UI.onReady(client).then(function (ui) { ui.createComponent('product', { id: '5308540158119', node: document.getElementById('product-component-1592591259442'), moneyFormat: '%24%7B%7Bamount%7D%7D', options: { "product": { "styles": { "product": { "@media (min-width: 601px)": { "max