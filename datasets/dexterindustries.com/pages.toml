["https://www.dexterindustries.com/howto/how-to-transfer-files-to-your-raspberry-pi-from-a-mac"]
title = "Transfer Files Between Your Mac and Raspberry Pi"
description = "How to Transfer Files Between Your Mac and Your Raspberry Pi. This tutorial walks through preparing your Mac and Raspberry Pi to edit files."
full_description = "You can quickly move files between your Mac and Raspberry Pi, and edit files using your Mac that are on your Raspberry Pi. In the picture above, we’re looking at the file system on your Mac. Click “Go” and click “Connect to Server . . . “. You will be prompted for a Server Address. This is the address of your Raspberry Pi. In our tutorial, we are using Raspbian for Robots, and the default server name is “dex.local”. In the “Connect to Server” dialog, enter “smb://dex.local” into the Server Address, and click “Connect”. After connecting, on the left hand side of the Finder window, you should see a new category, “Shared”. Under that category, you should now see “dex.local”. Finally, a quick tip: you can save files to the Pi using the file dialog box on a particular program. For example, using a text editor on your Mac, you can save the file as, and select the dex.local directory. A final option to transfer files between your Raspberry Pi and Mac is to use a USB Drive. This last option is a little slower, but it can be helpful in some situations! If you liked this tutorial, consider getting the Raspberry Pi here and SD Card with Raspbian for Robots here. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
