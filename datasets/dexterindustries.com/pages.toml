description = "GrovePi+ Classroom Kit GrovePi helps you build your own smart devices. The Classroom Kit is a set of five (5) Starter Kits which includes the GrovePi board, 2-sided Acrylic Case, 12 Grove sensors, Raspberry Pi 3, Ethernet Cable, Power Adapter and microSD Card (blank, but you can download the free software on our website). $1,199.99 Visit the GrovePi Product Support […]"
full_description = "GrovePi helps you build your own smart devices. The Classroom Kit is a set of five (5) Starter Kits which includes the GrovePi board, 2-sided Acrylic Case, 12 Grove sensors, Raspberry Pi 3, Ethernet Cable, Power Adapter and microSD Card (blank, but you can download the free software on our website). Visit the GrovePi Product Support & Documentation page for step-by-step tutorials, technical specs, detailed product pictures, and sample code libraries. GrovePi is a hardware system that helps you connect, program, and control sensors to build your own smart devices. It is built to work with all versions of the Raspberry Pi, a very powerful, yet small computer board about the size of a credit card. Learn more about it on the GrovePi product page. The GrovePi board connects to the Raspberry Pi to the Grove Sensor System and is a Raspberry Pi Internet of Things Kit. The kit allows you to easily connect hundreds of sensors to the Raspberry Pi. Simply connect a cable from the GrovePi to your sensor, download our software examples, and write programs on your Raspberry Pi computer to control and automate any device. Please also read this blog post on how to get multiple robots working with one wifi network in your classroom. We recommend the storage bin. It will fit the assembled robot and accessories. Also, it comes with 6, so you have one extra for the teacher and other accessories, like other sensors, that you might buy for the class to share: http://amzn.to/1Z7BjOZ Connecting sensors to the Internet of Things (IOT) has never been this easy! No need for soldering or breadboards: plug in your Grove sensors and start programming directly. GrovePi+ is an easy-to-use and modular system for hardware hacking with the Raspberry Pi and the Internet of Things. The GrovePi is a system that connects over 100 Grove sensors and devices to the Raspberry Pi. GrovePi is an easy-to-use and modular system for hardware hacking with the Raspberry Pi. No need for soldering or breadboards: plug in your Grove sensors and start programming. Grove is an easy to use collection of more than 100 inexpensive plug-and-play modules that sense and control the physical world. By connecting Grove Sensors to the Raspberry Pi, we empower you Pi to connect to the physical world. With hundreds of sensors to choose from in the Grove collection, the possibilities for interaction are endless. GrovePi is about integrating Grove sensors and modules with the performance and ease of the Raspberry Pi."
