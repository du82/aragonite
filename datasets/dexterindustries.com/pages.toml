title = "Webinars - Dexter Industries"
full_description = "If you attended the live session, you’ll be emailed a CE certificate within 24 hours of the webinar. If you view the recording and would like a CE certificate, join the EdWeb Student-Driven Learning community and go to the Webinar Archives folder to take the CE quiz. Do you want to learn how to integrate robotics into the core curriculum and reach all types of learners? In this edWebinar, you will learn how to integrate robotics into core curriculum to engage students of all abilities. During this live, interactive event, Lisa Rode, a sixth grade classroom teacher at Kings Glen Elementary in Springfield, VA, will share: There will be time for a Q&A session after the presentation. Elementary, middle and high school educators, librarians, technology resource teachers, and anyone who is working with children and interested in or already using technology will benefit from attending this session. Join us to learn about integrating robotics into the classroom in ways to engage all learners. Lisa Rode is a sixth grade classroom teacher at Kings Glen Elementary in Fairfax County, VA. This is her 10th year teaching sixth grade. In 2014, Lisa started a Raspberry Pi after-school robotics club to teach students programming, engineering, and problem-solving skills. She integrates technology and robotics into classroom lessons and an after-school program. Have you ever seen an activity using robotics and thought, “That would be great, but I don’t have enough TIME?” Do you want to incorporate robotics or programming, but you do not have much experience yourself? In this webinar, Lisa Rode, sixth grade classroom teacher at Kings Glen Elementary in Fairfax County, VA, presents how to include robotics and programming in your school. Lisa explores ways to integrate robotics and programming into a variety of content areas such as language arts, social studies, math, and science. Learn ways to plan and develop lessons that correlate to their standards as well as break down misconceptions about incorporating building, programming, and robotics into core curriculum. Lisa also shares examples of projects and lessons for a variety of content areas."
