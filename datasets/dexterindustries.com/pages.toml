["https://www.dexterindustries.com/howto"]
title = "Howto - Dexter Industries"
description = "This tutorial will show you how to download and install Dexter Industries software, either GoPiGo OS or Raspbian for Robots  on an SD Card.  We show you how to install the image on the Raspberry Pi using a Mac and a PC. Before beginning, make sure you are using a 8GB microSD Card or larger (we recommend a 8..."
full_description = "This tutorial will show you how to download and install Dexter Industries software, either GoPiGo OS or Raspbian for Robots on an SD Card. We show you how to install the image on the Raspberry Pi using a Mac and a PC. Before beginning, make sure you are using a 8GB microSD Card or larger (we recommend a 8... What is Cinch? We’ve released a new version of our robot software for the Raspberry Pi called Cinch. Cinch is designed to make it even easier to connect to your robot and start programming! Often homes and schools have complex wifi setups that make it hard to connect to the Raspberry Pi. The Cinch Operating System solves this problem for Raspberry Pi Robots by... In the latest Dexter Industries Software, Raspbian for Robots 2015.11.04 or later, your BrickPi might appear to not communicate with the Raspberry Pi. How to Fix It If you are not able to get a response from the BrickPi+ motors and sensors, we recommend updating the serial communications ports on the software. This can be done on the Desktop of... In this tutorial we will walk you through how to change your Raspberry Pi Hostname. This can be used for both Raspbian for Robots and Cinch. In this tutorial we will walk you through how to change the name of your robot when using our software. The name of your robot is the wifi name that your robot will... The Raspberry Pi Camera is useful for all of Dexter products, be it the GoPiGo, the BrickPi, or the GrovePi. So here’s a step-by-step explanation about how to connect that useful little magical eye! Before we begin to Install the Raspberry Pi Camera: It is best to install the camera to the Raspberry Pi without the extra boards. In... When using the Raspberry Pi, many times you may have a program you want to automatically start it at boot so that you can use your project without logging in to the RaspberryPi via SSH or VNC. Unlike the Arduino, the Pi needs to be set up to run a program automatically. This tutorial will demonstrate how to auto-run Python programs..."
