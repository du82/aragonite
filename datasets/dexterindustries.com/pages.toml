["https://dexterindustries.com/BrickPi/projects/space-program"]
title = "Raspberry Pi in Space - the BrickPi"
description = "Sending the Raspberry Pi in Space using the BrickP, the Raspberry Pi, and a little bit of LEGO."
full_description = "The goal of this project is to send a BrickPi into near space and learn enough to teach others how to do it. And take some nice pictures. We made a video of the entire adventure. For more details, click on the sections below to find out how we did it and what we learned about high altitude ballooning and the Raspberry Pi. Here we document some of the issues we tried to address before starting while planning the project. You could replace “Challenge” with “Fear” at this point. Option 1: Cell Phone. We have an old cell phone we could use. The upside is that we own it already. The downside is that we’ll be doing this in Virginia and there are pockets without cell phone reception. The risk is a $200 – $600 phone (a used HTC phone). No text: goodbye phone, BrickPi, accesories, etc. Multiplying by 1.5X the weight, gives us about 350g with all attached. So plan for 500g payload. We will use a 600 G balloon for this then. Highaltitude Science has helium calculations broken out very well (including tips on how to go about getting it!). You can fly with as little as 60 cft (cubic ft) of helium. Total Lift Required = Weight of Payload + Weight of Balloon + Positive Buoyancy (Weight of Payload / 2). Congratulations! You can be confident you haven’t under or over-inflated your balloon. You are now ready to tie off your balloon. We’re going to need to take some pictures. We might need it to last up to 4 hours if we don’t properly fill the balloon. Hmm. We enabled the Python code to run on startup using crontab. If you type “sudo crontab -e” in the command line of your Raspberry Pi, you can designate a specific file to run on startup. With this modification, the code begins running on powering up the Raspberry Pi (it could be cumbersome to boot up the Pi, login, and start the program at the launch site) and if any error was detected, we wrote the code to just restart the Raspberry Pi. We used the CUSF Landing Predictor to calculate out where our balloon would land. The online software allows you to enter latitude and longitude, as well as anticipated ascent and descent rates, and draws the resulting balloon path across a map."
year_published = 2025
clearnet = "https://dexterindustries.com/BrickPi/projects/space-program"
