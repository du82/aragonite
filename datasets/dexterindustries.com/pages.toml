["https://www.dexterindustries.com/batteryrecall"]
title = "Dexter Industries Rechargeable Battery Pack Safety Recall - Modular Robotics | Cubelets robot blocks"
description = "Consumers should immediately stop using the rechargeable battery packs, contact Modular Robotics for a free replacement battery pack, and then safely dispose"
full_description = "Consumers should immediately stop using the rechargeable battery packs, contact Modular Robotics for a free replacement battery pack, and then safely dispose of the defective product by following local laws for the disposal of the batteries. The Dexter Industries Rechargeable Battery Packs are being recalled due to the fact that they can short circuit, causing them to overheat, posing a burn hazard to consumers. About 2,400 units were sold between March 2018 and January 2020. The majority of units were sold directly from www.dexterindustries.com. They were sold individually, and also within GoPiGo and BrickPi Classroom Kits. The Dexter Industries Rechargeable Battery Pack is a 9.6 200Ah NiMH battery pack with Max Charge Current 2A and is wrapped in black plastic. “Dexter Industries Rechargeable Battery Pack” is printed on a white label on the battery pack. Modular Robotics has received four reports of rechargeable battery packs smoking and overheating. No injuries have been reported. What Should You Do? Consumers should stop using the Dexter Industries Rechargeable Battery Packs, contact Modular Robotics for a free replacement battery pack, and then safely dispose of the defective product by following local laws for the disposal of the batteries. Need help finding a local professional to safely dispose of your rechargeable battery? Click here to search based on your location within the US. For additional support, email us at recalls@modrobotics.com or call us toll-free at 877-233-6859. We will return all calls within 48 hours. Please answer every question completely and double-check your email address. We will contact you via email to collect your proof of purchase and confirm your shipping address. After we receive and verify your proof of purchase and confirm your shipping address, we will ship your free replacement battery pack. You will have 30 days to reply to the confirmation email to still be eligible for the free replacement. Anyone who has safely disposed of their Dexter Industries Rechargeable Battery Pack should register for the recall so we can keep track of how many Rechargeable Battery Packs have been safely disposed of. If you live outside the US, please still register for the recall and follow all applicable local laws for safely disposing of your battery pack."
year_published = 2025
clearnet = "https://www.dexterindustries.com/batteryrecall"
