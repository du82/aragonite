["https://www.dexterindustries.com/howto/use-cinch-operating-system"]
title = "Use Cinch Operating System - Dexter Industries"
description = "What is Cinch? We’ve released a new version of our robot software for the Raspberry Pi called Cinch. Cinch is designed to make it even easier to connect to your robot and start programming!  Often homes and schools have complex wifi setups that make it hard to connect to the Raspberry Pi. The Cinch Operating System solves this problem for Raspberry Pi Robots by allowing […]"
full_description = "We’ve released a new version of our robot software for the Raspberry Pi called Cinch. Cinch is designed to make it even easier to connect to your robot and start programming! Often homes and schools have complex wifi setups that make it hard to connect to the Raspberry Pi. The Cinch Operating System solves this problem for Raspberry Pi Robots by allowing you to connect to your robot directly over wifi. You can use any wifi enable device (such as a laptop, PC, a phone, or a tablet). Cinch works by creating a wifi network with the Raspberry Pi, and allowing a computer to log-on to the Raspberry Pi. This is often called wifi tethering, and it allows you to quickly and easily set up a connection with the Raspberry Pi and bypass any complex network issues on your school or home network. You can purchase an SD Card with Cinch already installed from Dexter Industries. You can also download Cinch for free here and use our instructions for installing the software on your 8 GB microSD Card here. 1. Build your robot. You can find instructions for the GoPiGo here, the BrickPi Here, and the GrovePi here. 2. Insert the Cinch microSD card into the Green Raspberry Pi board. (Please notice this picture just shows the Raspberry Pi green board, but the this green board should be connected to your robot (BrickPi, GrovePi, GrovePi, PivotPi) as you move through the next steps!) 5. Look for the wifi network “dex” on your computer & connect to it. There is no password required to connect to Cinch over wifi. The wifi network may take a few minutes to appear. 7. Once connected to the “dex” wifi network, open a web browser and go to “http://dex.local”. We recommend using Chrome, but for touchscreen laptops, you might want to use Firefox. (Note: sometimes if you can’t find “dex.local” try the address “http://10.10.10.10”) 8. Now you can choose VNC (to get to the Dexter Desktop, which is probably where you want to go) or Terminal. 9. If you choose VNC, you’ll be prompted to enter the password at the top. Enter password “robots1234”, then hit enter. (To enter Terminal you will also need the username, “pi”.)"
