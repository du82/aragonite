title = "Distance Sensor - Dexter Industries"
description = "Distance Sensor Distance Sensor for the GoPiGo. The distance sensor can be mounted to the GoPiGo Raspberry Pi robot using the servo package to enable rotation. It detects distances from obstacles and objects, giving your robot the ability to navigate. This package includes the cable for connecting the Distance Sensor to the GoPiGo. $29 Distance Sensor for a Raspberry Pi […]"
full_description = '''Distance Sensor for the GoPiGo. The distance sensor can be mounted to the GoPiGo Raspberry Pi robot using the servo package to enable rotation. It detects distances from obstacles and objects, giving your robot the ability to navigate. The Distance Sensor can be mounted to Dexter Industries robots like the GoPiGo, GrovePi, and BrickPi using the servo package for the GoPiGo to enable rotation. It detects distances from obstacles and objects, giving your robot the ability to navigate. This package includes the cable for connecting the Distance Sensor to your robot. The Distance Sensor uses a small laser to determine the distance to an object. The sensor uses the Time of Flight method for a very fast and accurate distance reading. The package includes two googly eyes to give your robots a lively look! Distance sensors are great for programming robots that can avoid objects. They do this by measuring the time interval between sending a small invisible laser pulse and receiving the light back, and based on the time it takes, calculating the distance to an object. This comes in handy when you are programming a robot to detect objects and find their way around them. /*<![CDATA[*/ (function () { var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js'; if (window.ShopifyBuy) { if (window.ShopifyBuy.UI) { ShopifyBuyInit(); } else { loadScript(); } } else { loadScript(); } function loadScript() { var script = document.createElement('script'); script.async = true; script.src = scriptURL; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script); script.onload = ShopifyBuyInit; } function ShopifyBuyInit() { var client = ShopifyBuy.buildClient({ domain: 'modrobotics.myshopify.com', storefrontAccessToken: '3c818648268b3e3aab483e090028f8cd', }); ShopifyBuy.UI.onReady(client).then(function (ui) { ui.createComponent('product', { id: '5308535341223', node: document.getElementByI