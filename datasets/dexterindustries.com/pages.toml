["https://www.dexterindustries.com/raspberry-pi-robot-software"]
title = "Raspberry Pi Robot Software - Dexter Industries"
description = "Raspberry Pi Robots for hobbyists, educators, & engineers! Check out our GoPiGo robot car, BrickPi for LEGO MINDSTORMS and GrovePi IoT kit!"
full_description = "As many of your know, Dexter Industries has built custom software for our robot kits! These robots are all based on the Raspberry Pi, that awesome little credit card sized computer that we’ve turned into a few different robots. Raspberry Pi has software called “Raspbian”, and our version of it is called “Raspbian for Robots”. Raspbian for Robots has all the software you need built in to connect to your GoPiGo, BrickPi, GrovePi or Arduberry and get you programming in just a few minutes. All you need is an assembled robot and a computer with a web browser – no other downloads. All of the coding programs you need like Scratch and Python are already built-in, ready with sample programs to run, test and start learning. We’ll continue to add to this section as we make more updates, but please read this blog post for now. All of our robots require a computer or device to program and run them. (If you have a HDMI monitor, keyboard & mouse, you can also use that, but we recommend a separate computer). Raspbain for Robots: If using Raspbian for Robot, you’ll connect the robot to a computer network with an ethernet cable first, then set up wifi. Each robot will come with the same software, which will all have the same name — when on your network or when broadcasting the hotspot. So, if you are using multiple robot kits in one location (in one classroom or school), you will need to go through a few extra steps to configure your robots so that each one has a unique name on your network. This will help you know which robot you are connected to from each computer! This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings."
