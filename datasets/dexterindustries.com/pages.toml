["https://www.dexterindustries.com/howto/setup-networking-for-a-camp-or-classroom-raspberry-pi-in-a-classroom"]
title = "Setup Raspberry Pi Networking in a Classroom or Camp"
description = "How to setup multiple Raspberry Pi Networking in a Classroom or camp environment. In this tutorial we explain Raspberry Pi Networking in a Classroom."
full_description = "This tutorial will walk you through setting up robots and wifi for a classroom and we will explain Raspberry Pi Networking in a Classroom or Camp Environment. When setting up Raspberry Pi Networking in a Classroom, you can scan a network for available hostnames using two tools: Optionally, if you have physical access to the school/camp router, you may want to connect your own wifi router to it by using an ethernet cord. This will give internet access to the Pis. If your school has a firewall or restricted network permissions, you can skip connecting the router to your local network, but you will not have access to the internet. You may need to contact your network administrator for further help if you need internet access. Alternatively, you can connect your Mac or PC to the wifi router using an ethernet cord. Simply plug one end of the cord into your Mac or PC, and the other end of the cord into one of the blue colored ports on the back of the wifi router. The lights on the Raspberry Pi ethernet port should turn on and start blinking. Here is a quick video of the Pi starting up. If you get a positive response, we have established a connection between the Raspberry Pi and your PC or Mac. Once you have established a connection between your Raspberry Pi and the PC, we can connect the Raspberry Pi to the Wifi router over Wifi. Make sure you have the Wifi dongle attached to the Raspberry Pi. This will connect the Pi and the Wifi Router over Wifi. Enter the Wifi credentials into the Pi by following the videos below. The Wifi router SSID (network name) is called “linksys” and there is no password, it should be broadcasting an open Wifi network. Please note that you will be using the hostname you set before beginning “hostname.local”, not “dex.local” as shown in the video: Now that we have the Pi connected to the Wifi router, disconnect the ethernet cable from the Pi. Remove the ethernet cord joining your Pi and the Wifi router. The final step! Make sure you can connect between your PC or Mac and your Pi. From your PC or Mac, ping the Pi."
