["https://www.dexterindustries.com/howto/page/3"]
title = "Howto - Dexter Industries"
description = "As you keep using the Raspberry Pi, the SD card image becomes bloated and filled up with files that you do not need anymore. If you want to make a backup image or just want to have some of that precious SD card space back, it becomes very difficult to reclaim any of the wasted space. One of the easiest..."
full_description = "As you keep using the Raspberry Pi, the SD card image becomes bloated and filled up with files that you do not need anymore. If you want to make a backup image or just want to have some of that precious SD card space back, it becomes very difficult to reclaim any of the wasted space. One of the easiest... Wouldn’t it be great if you could connect to your Raspberry Pi Directly from your mobile phone or tablet? There is a very simple and easy way that you can control your Pi directly from your phone or tablet. Attach a bluetooth Keyboard and you can have a mobile Linux computer at your disposal. First install tightvncserver on your Raspberry... Congrats on your new Raspberry Pi. You are holding a great little device with a unlimited potential in it. You can create your own version of Dropbox, or a crazy little LEGO tank of maybe a server to host your own website with this little credit card sized computer. Like most of the users, you probably don’t have a spare... In this HowTo, we’ll show you how to get your EV3 and your Arduino to communicate, and how to use Arduino Shields with the EV3. The EV3 is much more powerful than the NXT, but at the time of writing this article, the software available is much harder to hack with. We recently tried to make this easier by developing... Since we first got the Raspberry Pi, we have wanted to make a robot out of it. There aren’t many kits out there yet that let you do that (yet). This HowTo Raspberry Pi Project shows you how we hacked together a motor controller from the Raspberry Pi and used it to control LEGO MINDSTORMS Motors. The LEGO MINDSTORMS... In this HowTo, we’ll show you how to get your LEGO MINDSTORMS NXT and your Arduino to talk. In the demonstration, we use an Arduino Uno, but the example we’ve written can be used for just about any of the versions of Arduino. This example can be extended to use the Arduino as a sensor for the NXT, and... We’ve written previously about connecting LEGO MINDSTORMS I2C sensor to the Raspberry Pi. This is another sensor post: how to get an NXT Touch Sensor working with the Raspberry Pi. Unlike the dIMU in our previous post, this sensor does not use digital communications like I2C. Rather it’s a simple on/off GPIO. Wait, what’s a GPIO? The acronym stands..."
