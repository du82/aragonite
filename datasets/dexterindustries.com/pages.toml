["https://www.dexterindustries.com/howto/change-the-hostname-of-your-pi"]
title = "Change the Hostname of Your Raspberry Pi - Change Raspberry Pi Name"
description = "How to Change the Raspberry Pi Hostname. In this tutorial we show how to change the hostname of the Raspberry Pi using various methods."
full_description = "In this tutorial we will walk you through how to change your Raspberry Pi Hostname. This can be used for both Raspbian for Robots and Cinch. In this tutorial we will walk you through how to change the name of your robot when using our software. The name of your robot is the wifi name that your robot will broadcast for you to connect to with your computer (if you’re using Cinch). The most common reason to do this is if you have more than one robot working in the same space at the same time. Classrooms with multiple robots are a great example. Each robot needs a different name (wifi name) so you know you are connected to the correct one! Default names are the names the software or Raspberry Pi (the brain of your robot) operating system comes with. These are the names they come with, out of the box if you get it from Dexter Industries: There are a few reasons why you might want to change the hostname for your robot. If you are using a version before 2015.11.09, you may want to do this so that you are working off the same hostname as our new software, which is “dex.local”. The biggest reason to change a hostname for your robot is if you are working with more than one robot on the same network. Classrooms, camps, meetup groups, and households with more than one robot being used, should change the hostname for each robot so they are different. This will allow you to know which one you are connecting to, so you aren’t confused when you are trying to program and control your robots over the same network connection (wifi network). We have two videos below to walk you through renaming the Hostname. If you prefer written directions and pictures, please scroll below! OR you have a version dated “2015.11.09” or later and you have a sd card reader in your computer: Changing the hostname on an older version of Raspbian for Robots (before 2015.11.09) requires logging into the Pi and using the command line. Also, if your computer does not have an SD card reader, you can use this method with the newer image too."
year_published = 2025
