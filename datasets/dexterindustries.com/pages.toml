full_description = "BrickPi3 is our latest version of the BrickPi. If you have recently purchased your BrickPi, it most likely is a BrickPi3. If you are in doubt, check the following: Welcome to the BrickPi+ Getting Started guide! We’ll walk you through getting it setup and started with these step-by-step instructions. We recommend you go through each step below, in the following order: This section has information about programming the BrickPi. At this point, we assume you’ve gotten your BrickPi setup, the case built, and you’re ready to program the BrickPi to tell some sensors and motors what to do! If not, please start with the Getting Started guide above. Before moving forward, please be sure to enable BrickPi communications over serial. We have a guide on how to do this with Raspbian for Robots here. Here are a few cool projects for the BrickPi that we’ve done in Python. Each one comes with building instructions, a bill of material, as well as the code to get it going! This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. This website uses Google Analytics to collect anonymous information such as the number of visitors to the site, and the most popular pages."
