["https://www.dexterindustries.com/shipping-information-policies"]
title = "Shipping & Ordering - Dexter Industries"
description = "Information about shipping and purchasing policies from Dexter Industries. Learn about how you can pay for and get your products from Dexter Industries."
full_description = "Dexter Industries also offers United States Postal Service (USPS) or UPS shipping for orders. If you’ll be shipping to a PO box, please keep in mind that UPS will not deliver to these locations and you must select the USPS option. Packages unable to be delivered by UPS will be returned to us and re-shipped USPS at the recipient’s expense. We fill all other orders as soon as possible. Due to normal variations in order volume, this may be up to 2 business days. Once your order has shipped, you’ll receive a Shipping Confirmation email with tracking information. We do not accept C.O.D. orders, and we are not responsible for lost or stolen packages. We will file claims for packages that are insured. In general, UPS Worldwide shipping options are faster and more reliable than USPS. Please select a UPS option if you require a guarantee that your package will arrive by a specific date. USPS Priority Mail International is cost saving but can take anywhere from 6 days to 2 months (seriously!) depending on your country’s mail service and how remote your location is. For more information about the estimated shipping times for each service, please follow the links below, or send an email to info@modrobotics.com with your city, country and postal code. Any duties and taxes for international shipments are the responsibility of the customer. Modular Robotics is not responsible for any extra charges once the original package has been shipped. If the customer refuses to pay these extra charges, the return shipping and any additional fees will be taken out of the cost of the order, with any remaining funds being refunded to the recipient. If you’re in Colorado but have a tax-exempt status, please first register as a customer. Then, email a copy of your exemption certificate to info@modrobotics.com. We’ll apply the exemption to your account and reply to your email to let you know. At that point you will be able to place your order as normal, and tax won’t be added at checkout."
