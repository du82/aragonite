title = "Clusters · Diagrams"
description = "`Cluster` allows you to group (or cluster) nodes in an isolated group."
full_description = 'Cluster allows you to group (or cluster) nodes in an isolated group. Basic Cluster represents a local cluster context. You can create a cluster context using the Cluster class. You can also connect the nodes in a cluster to other nodes outside a cluster. from diagrams import Cluster, Diagram from diagrams.aws.compute import ECS from diagrams.aws.database import RDS from diagrams.aws.network import Route53 with Diagram("Simple Web Service with DB Cluster", show=False): dns = Route53("dns") web = ECS("service") with Cluster("DB Cluster"): db_primary = RDS("primary") db_primary - [RDS("replica1"), RDS("replica2")] dns >> web >> db_primary Nested Clusters Nested clustering is also possible: from diagrams import Cluster, Diagram from diagrams.aws.compute import ECS, EKS, Lambda from diagrams.aws.database import Redshift from diagrams.aws.integration import SQS from diagrams.aws.storage import S3 with Diagram("Event Processing", show=False): source = EKS("k8s source") with Cluster("Event Flows"): with Cluster("Event Workers"): workers = [ECS("worker1"), ECS("worker2"), ECS("worker3")] queue = SQS("event queue") with Cluster("Processing"): handlers = [Lambda("proc1"), Lambda("proc2"), Lambda("proc3")] store = S3("events store") dw = Redshift("analytics") source >> workers >> queue >> handlers handlers >> store handlers >> dw There is no depth limit to nesting. Feel free to create nested clusters as deep as you want.'
year_published = 2024
year_updated = 2024
clearnet = "https://diagrams.mingrammer.com/docs/guides/cluster"
tags = ["basic", "cluster", "clusters", "diagrams", "getting", "guides", "handlers", "import", "nested", "nodes"]
language = "en"
internal-references = ["none"]
external-references = ["brew.sh", "buymeacoffee.com", "chocolatey.org", "github.com", "graphviz.gitlab.io", "graphviz.org"]

["https://diagrams.mingrammer.com/docs/nodes/c4"]
title = "C4 · Diagrams"
description = "## C4 Diagrams"
full_description = '''C4 Diagrams C4 is a standardized model to visualize software architecture. You can generate C4 diagrams by using the node and edge classes from the diagrams.c4 package: from diagrams import Diagram from diagrams.c4 import Person, Container, Database, System, SystemBoundary, Relationship graph_attr = { "splines": "spline", } with Diagram("Container diagram for Internet Banking System", direction="TB", graph_attr=graph_attr): customer = Person( name="Personal Banking Customer", description="A customer of the bank, with personal bank accounts." ) with SystemBoundary("Internet Banking System"): webapp = Container( name="Web Application", technology="Java and Spring MVC", description="Delivers the static content and the Internet banking single page application.", ) spa = Container( name="Single-Page Application", technology="Javascript and Angular", description="Provides all of the Internet banking functionality to customers via their web browser.", ) mobileapp = Container( name="Mobile App", technology="Xamarin", description="Provides a limited subset of the Internet banking functionality to customers via their mobile device.", ) api = Container( name="API Application", technology="Java and Spring MVC", description="Provides Internet banking functionality via a JSON/HTTPS API.", ) database = Database( name="Database", technology="Oracle Database Schema", description="Stores user registration information, hashed authentication credentials, access logs, etc.", ) email = System(name="E-mail System", description="The internal Microsoft Exchange e-mail system.", external=True) mainframe = System( name="Mainframe Banking System", description="Stores all of the core banking information about customers, accounts, transactions, etc.", external=True, ) customer >> Relationship("Visits bigbank.com/ib using [HTTPS]") >> webapp customer >> Relationship("Views account balances, and makes payments using") >> [spa, mobileapp] webapp >> Relationship("Delivers to the customer's web browser") >> spa spa >> Relationship("Make API calls to [JSON/HTTPS]") >> api mobileapp >> Relationship("Make API calls to [JSON/HTTPS]") >> api api >> Relationship("reads from and writes to") >> database api >> Relationship("Sends email using [SMTP]") >> email api >> Relationship("Makes API calls to [XML/HTTPS]") >> mainframe customer << Relationship("Sends e-mails to") << email It will produce the following diagram:'''
year_published = 2022
year_updated = 2022
clearnet = "https://diagrams.mingrammer.com/docs/nodes/c4"
