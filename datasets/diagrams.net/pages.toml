usiness model canvas (template library) | Download Customer story map for purchasing groceries online | Download Inbound marketing flow (template library) | Download PERT and Gantt charts PERT diagram with preferred path (template library) | Download PERT diagram (template library) | Download Gantt chart (template library) | Download Timelines and roadmaps Project development roadmap | Download Horizontal timelines using shapes from the infographic shape library | Download Vertical timelines using shapes from the infographic shape library | Download Project phases and the teams involved | Download Infographics Infographic of the many draw.io integrations | Download Infographic using shapes and clipart available in draw.io | Download Infographic using the infographic shape library in draw.io | Download Layered shapes available in the infographic shape library | Download Project steps for a slide in a presentation | Download Infographic with callouts and icons | Tutorial | Download Dark background infographic with callouts and icons | Download Six-layer infographic | Download Five-layer infographic | Download Horizontal layered infographic on a dark background | Download Venn diagrams Venn diagrams | Venn template category via Arrange > Insert > Template Science and educational illustrations Cell culture illustration, using the Bioicons integration | Download Water cycle illustration, modified from a draw.io template | Download Visual tutorial for draw.io’s online whiteboard editor theme | Download Formula reference table containing mathematical typesetting | Download Focal length calculation | Download Light through a prism | Download Parts of a horse | Download Floorplans Floorplan | Download Floorplan of an apartment, as a multi-page diagram with links | Download Floorplan for LAN cabling | Download Theatre seating plan | Download Evacuation plan | Download"
