title = "draw.io Blog"
full_description = "features atlassian draw.io zero-egress Forge apps for Confluence and Jira Companies want complete control over their content and data when using cloud platforms. Atlassian’s secure-by-design Forge development platform enables and enforces isolation - with zero-egress apps like draw.io, none of your data ever leaves your Atlassian cloud environment. 20 Feb 2025 use cases templates shape libraries UML interaction overview diagrams Interaction overview diagrams show a high-level overview of how components of the system interact with each other. General flowchart shapes show the interaction flow between activities, and sometimes entire sequence diagrams or activity diagrams are embedded for detailed documentation. 17 Feb 2025 features shapes text connectors Using adaptive colours to diagram in light and dark modes When you change from light to dark mode in draw.io, the colours automatically switch intensity so that your diagram and its labels are easy to read. You can set now specific colours for shapes, connectors, text and the diagram page background for both light and dark modes via the updated colour palette. 07 Feb 2025 use cases templates shape libraries UML overview - where and why each UML diagram is used UML notation is one of the most popular technical diagramming standards defining a wide range of diagrams useful in many different industries and professions, not just software engineering. That many different technical diagrams can be daunting, so here is an overview of each of the different types of UML diagrams, who draws or reads them, and why they are useful. 30 Jan 2025 features atlassian draw.io app Editions for Atlassian Confluence Cloud (early access program) App editions for Atlassian Confluence Cloud will soon be available for customers who sign up for Atlassian’s early-access program. App editions is a new Atlassian Marketplace feature introduced with Forge, and draw.io will be available in Standard and Advanced editions. 20 Dec 2024 use cases shape libraries More updated networking and cloud shape libraries In addition to updating the main AWS and Azure shape libraries in draw.io, several new networking and cloud shape libraries have been added, including shapes for Alibaba Cloud, Dynamics365 and OpenStack. 05 Dec 2024"
