full_description = "Security-first diagramming for teams. Bring your storage to our online tool, or save locally with the desktop app. Start Download No login or registration required. Diagram files created in 2005 will load in the app today Share with everyone Don't worry about licenses or platforms, it just works. Powerful features Collaborate with shared cursors in real-time. draw.io has everything you expect from a professional diagramming tool. Privacy first Store your data wherever you want to. We cannot access your data. More features | Example diagrams & templates Our range of draw.io branded integrations Google Workplace and Google Drive Works with Google Drive and Google Workplace (G Suite). Use add-ons for Docs, Sheets and Slides. Sharepoint and OneDrive Works with OneDrive and Sharepoint. Office 365 and Microsoft Teams apps provide tighter integration. Atlassian Highest-rated Confluence app, delivered by us as draw.io. Also for Jira. Git and Dropbox Works with GitHub, GitLab and Dropbox for visual documentation in distributed teams. Desktop Download draw.io Desktop for offline use, or draw.io for VSCode.* Notion Embed and edit diagrams directly with the draw.io for Notion Chrome extension. See more Start Now * Third-party integration."
