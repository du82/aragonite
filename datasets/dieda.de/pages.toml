["https://dieda.de/news/stadtradeln-in-egenhausen"]
title = "Stadtradeln in Egenhausen - DIEDA Systembauteile GmbH & Co. KG"
description = "Erfahren Sie mehr über die erfolgreiche Teilnahme der Gemeinde Egenhausen beim STADTRADELN. Dieda unterstützte das siegreiche Team mit beeindruckenden Kilometerleistungen und CO2-Einsparungen. Lesen Sie jetzt den Artikel"
full_description = 'Alle News13. Juli 2023DIEDA sponsert siegreiches Team beim Stadtradeln in EgenhausenDie Gemeinde Egenhausen nahm erstmalig am bundesweiten Wettbewerb STADTRADELN teil. Mit neun Teams und 88 aktiven Radfahrern wurden beeindruckende 21.964 Radkilometer zurückgelegt, was zu einer Einsparung von vier Tonnen CO2 führte. Egenhausen belegte den neunten Platz unter den 13 teilnehmenden Städten und Gemeinden im Landkreis-Ranking nach absoluten Kilometern. Das Unternehmensteam "Carbon statt Kondition – powered by Dieda" erreichte in Egenhausen den 1. Platz mit insgesamt 7.121 geradelten Kilometern und einer CO2-Vermeidung von 1.154 kg. Zusätzlich wurden die Top-Radfahrer und das radaktivste Team ausgezeichnet.Überblick über die aktivsten STADTRADELN-Teilnehmer im Jahr 2023Herr Markus Lehmann, ein Bürger aus Egenhausen, hat für das Offene Team-Egenhausen mit beeindruckenden 1.211 Radkilometern und einer CO2-Vermeidung von 196,1 kg den 1. Platz in Egenhausen belegt.Herr Walter Dölker, ein Mitarbeiter im Ruhestand der Firma Dieda, folgt dicht dahinter auf dem 2. Platz mit herausragenden 1.113 Radkilometern und einer CO2-Vermeidung von 180,2 kg.Den 3. Platz belegt Herr Martin Zobel, ein Mitarbeiter der Firma Dieda, mit hervorragenden 905 Radkilometern und einer CO2-Vermeidung von 146,5 kg.Bürgermeister Sven Holder bedankte sich bei allen Teilnehmern, die mit ihrer Teilnahme an der Kampagne des Klima-Bündnisses Baden-Württemberg einen positiven Beitrag zum Klima- und Umweltschutz geleistet haben. Er gratulierte den besonders engagierten Radfahrern sowie dem radaktivsten Team und überreichte als Zeichen der Anerkennung Siegerurkunden und (Egenhausen-) Gutscheine.Alle News anzeigen'
year_published = 2023
