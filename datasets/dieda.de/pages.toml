["https://dieda.de/gelaender/laufmeter/ganzglas-profil-schwarz-aluminium"]
title = "Ganzglas anthrazit, Profil schwarz - DIEDA Systembauteile GmbH & Co. KG"
description = "Das DIEDA Ganzglas-Geländer ist die perfekte Wahl für Balkongeländer im Freien - jetzt als Laufmeter erhältlich!"
full_description = "LaufmeterMontagezeit2,0 Std.SchwierigkeitsgradHändler findenAngebot anfragenVorteileProduktdetailsDetailsDieses stilvolle Ganzglasgeländer bietet nicht nur grenzenlosen Weitblick, sondern auch eine elegante Präsentation Ihrer Außenfassade. Das Geländer besteht aus hochwertigem, eloxiertem Aluminium und Ganzglas, das eine moderne und ansprechende Optik verleiht. Die Verwendung von Aluminium und Glas sorgt für eine langlebige und wetterbeständige Konstruktion, die sowohl im Innen- als auch im Außenbereich eingesetzt werden kann. Dank der flexiblen Montage mit einem schwarzen Profil lässt sich das Geländer leicht an unterschiedliche bauliche Gegebenheiten anpassen und in verschiedenen Laufmetern bestellen, um Ihren spezifischen Anforderungen gerecht zu werden.EigenschaftenIdeal für Innen- und Außenbereich – Dieses Geländer ist äußerst witterungsbeständig und eignet sich für den Einsatz sowohl im Innen- als auch im Außenbereich. Es trotzt Regen, Wind und anderen Witterungseinflüssen, ohne seine Qualität und Optik zu verlieren.Hohe Sicherheit – Das Geländer besticht durch seine hohe Sicherheit, insbesondere dank des robusten 8mm dicken Ganzglases. Dieses Material ist nicht nur bruchsicher, sondern bietet auch eine klare und ungehinderte Sicht.Chromatiert – Die eloxierte und chromatische Oberfläche des Aluminiumprofils sorgt für zusätzliche Korrosionsbeständigkeit und eine edle Optik, die lange erhalten bleibt.Vielseitigkeit – Das Geländer eignet sich hervorragend für verschiedene Anwendungen im Innen- und Außenbereich und kann flexibel an die vorhandenen baulichen Gegebenheiten angepasst werdenWerkzeugeFür die erfolgreiche Montage Ihres Geländers benötigen Sie die folgenden Werkzeuge:Bohrmaschine – Zum Vorbohren der Löcher in den Montageflächen.Schraubendreher/Schraubenschlüssel – Für das Befestigen der Schrauben und Muttern.Wasserwaage – Zum genauen Ausrichten der Geländerstützen.Maßband – Zum genauen Abmessen der benötigten Teile.Stift – Zum Markieren der Schnitt- und Bohrstellen.Montage-TippsVorbereitung – Säubern und ebnen Sie die Montagefläche, um eine stabile Installation zu gewährleisten.Montage mit schwarzem Profil – Verwenden Sie das schwarze Profil für eine sichere und feste Anbringung des Ganzglases auf Balkonen und Terrassen.Sicherheitsabstand – Achten Sie darauf, die Glasplatten in gleichmäßigen Abständen zu platzieren, um maximale Stabilität zu gewährleisten.Abstandhalter – Nutzen Sie Abstandhalter, um einen optimalen Abstand zwischen den Glasplatten zu gewährleisten und die Montage zu erleichtern.Individuelle Anpassung – Passen Sie das Geländer flexibel an Ihre baulichen Gegebenheiten an, um eine perfekte Integration zu gewährleisten.Das passt dazu250011Montageset, 3 Inbus + Universal- schlüssel, vernickelt 250012Montagekleber, Injektionsmörtel, Inhalt 150 ml 250013Gewindestange V4A, 4 Stück, 10/110 mm250014Siebhülse, 4 Stück, 16/85 mm250015Schlüsselschrauben, V2A, 4 Stück, 10 x 80 mm 250233Schwerlastdübel V4A, 2 Stück, 10 mmÄhnliche ProdukteLaufmeterAcrylglas, Stütze eckig, AluminiumLaufmeterVierkantstäbe waagerecht, Stütze eckig, AluminiumLaufmeterRundstäbe waagerecht, Stütze rund, Edelstahl V2A"
