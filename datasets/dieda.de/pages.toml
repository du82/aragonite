["https://dieda.de/news/projekt-schulfrucht-grundschule-egenhausen"]
title = "Projekt Schulfrucht an der Grundschule in Egenhausen - DIEDA Systembauteile GmbH & Co. KG"
description = "Die Gesundheit der Kinder liegt uns am Herzen. Daher freuen wir uns ganz besonders, das Projekt „Schulfrucht“ an der Grundschule in Egenhausen in diesem Jahr als Sponsor unterstützen zu dürfen."
full_description = "Alle News15. März 2023Projekt Schulfrucht der Grundschule EgenhausenHeutzutage kann eine gesunde Ernährung bei vielen Kindern aus den unterschiedlichsten Gründen nicht mehr sichergestellt werden – doch gerade im Wachstum ist eine ausgewogene Ernährung von besonders großer Bedeutung. Das EU-Schulprogramm „Schulfrucht“ sorgt dafür, dass Kinder in Kitas und Grundschulen regelmäßig mit Obst, Gemüse, Milch und Milchprodukten von einem regionalen Lieferanten beliefert werden. Dank der pädagogischen Begleitung des Projekts erfahren die Kinder außerdem mehr über die Herkunft, Ernte und die richtige Zubereitung der frischen und saisonalen Lebensmittel.Somit trägt dieda Systembauteile GmbH & Co. KG einen wichtigen Teil dazu bei, die Kinder der Grundschule auf den Geschmack gesunder Lebensmittel zu bringen und so den Grundstein für eine ausgewogene Ernährungsweise zu legen.Alle News anzeigen"
