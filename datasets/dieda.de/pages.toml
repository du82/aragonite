full_description = "KomplettsetsMontagezeit1,5 Std.SchwierigkeitsgradHändler suchenAngebot anfragenVorteileProduktdetailsDetailsDas Geländersystem Ole besticht durch seine hohe Stabilität und seine zeitlose, elegante Optik. Es passt sich jeder Umgebung an und ist die perfekte Lösung für den Innen- und Außenbereich sowie als Treppen- und Balkongeländer. Machen Sie Ihr Geländer zu einem Blickfang in Ihrem Zuhause. Die pulverbeschichtete Oberfläche verleiht dem Geländer eine moderne und ansprechende Optik.Lieferumfang1 Handlauf rund, Ø 40 mm, inkl. Verbinder und Endkappen2 Stützen, Aluminium, anthrazit, inkl. Rundstabhalter5 Rundstäbe waagerecht, Aluminium, anthrazit10 Endkappen für Rundstäbe5 Verbinder für RundstäbeMontagematerial (Schrauben, Muttern, Unterlegscheiben)Stockschrauben zur Befestigung auf Holz, Mauerwerk, Naturstein oder BetonMontageanleitungEigenschaftenAlles enthalten – Im Set sind alle notwendigen Bestandteile enthalten, um das Geländer komplett zu montieren. Dazu gehören Handlauf, Stützen, Rundstäbe, Endkappen und Verbinder.Beliebig erweiterbar – Das Geländerset enthält alle Montagebestandteile und kann nach Bedarf gerade oder um Ecken erweitert werden. Die einzelnen Elemente lassen sich nahtlos zusammenführen.Pflegeleicht – Das Geländerset ist aufgrund seiner Materialbeschaffenheit aus Aluminium sehr pflegeleicht und schmutzunempfindlich, was die Reinigung und Instandhaltung erheblich vereinfacht.Hohe Flexibilität – Durch die modulare Bauweise lassen sich mehrere Sets miteinander kombinieren und mit passendem Zubehör erweitern, um individuellen Anforderungen gerecht zu werden.WerkzeugFür die erfolgreiche Montage Ihres Geländersets benötigen Sie die folgenden Werkzeuge:Bohrmaschine – Zum Vorbohren der Löcher in den Montageflächen.Schraubendreher/Schraubenschlüssel – Für das Befestigen der Schrauben und Muttern.Wasserwaage – Zum genauen Ausrichten der Geländerstützen.Maßband – Zum genauen Abmessen der benötigten Teile.Metallsäge oder Hartmetallwerkzeug – Zum individuellen Anpassen der Geländerhöhe und -breite.Stift – Zum Markieren der Schnitt- und Bohrstellen.Montage-TippsVorbereitung – Säubern und ebnen Sie die Montagefläche, um eine stabile Installation zu gewährleisten.Seitliche Montage – Verwenden Sie die seitlichen Befestigungspunkte für eine sichere und feste Anbringung des Geländers.Montage von oben – Diese Methode bietet zusätzlichen Halt und Stabilität, ideal für höhere Sicherheitsanforderungen.Sicherheitsabstand – Achten Sie darauf, die Rundstäbe in gleichmäßigen Abständen zu platzieren, um maximale Stabilität und Sicherheit zu gewährleisten.Höhenanpassung – Passen Sie den Handlauf in der Höhe an, um den Komfort und die Sicherheit zu erhöhen.Schritt-für-Schritt ProduktanleitungFür die Einbindung von Videos werden eventuell nutzerbezogene Daten an Dritte übertragen. Bitte akzeptieren Sie die Marketing-Cookies, um Videos anzuzeigen.Cookiebanner öffnenDas passt dazu186410Geländereckset, Aluminium rund, eloxal186414Geländereckset, Aluminium rund, weiß186412Geländereckset, Aluminium rund, anthrazitÄhnliche ProdukteKomplettsetsGeländerset Linus, Aluminium eckigKomplettsetsEingangsgeländer SetKomplettsetsSet bodentiefe Fenster"
