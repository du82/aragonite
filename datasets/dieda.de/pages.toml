["https://dieda.de/news/dieda-jubilaeum-2023"]
title = "DIEDA ehrt langjährige Mitarbeiter - DIEDA Systembauteile GmbH & Co. KG"
description = "Dieda würdigt langjährige Mitarbeiter auf der Weihnachtsfeier. Geschäftsführer Florian David begrüßte Jubilare mit bis zu 30 Jahren Betriebszugehörigkeit."
full_description = "Alle News8. Januar 2024DIEDA ehrt langjährige MitarbeiterIm Rahmen der diesjährigen Weihnachtsfeier begrüßte Geschäftsführer Florian David die rund 60 anwesenden Gäste und ganz besonders die zahlreichen Firmen-Jubilare. Auch für Ihn selbst war es ein besonderes Jahr: seit 20 Jahren ist er inzwischen Teil der Geschäftsführung und leitet das Unternehmen gemeinsam mit seiner Schwester Annette Bratz. In seiner Begrüßungsrede blickte er geschäftlich, wie privat auf bewegende zwei Jahrzehnte zurück. Für die kommenden 20 Jahre wünschte er sich, den Mitarbeitern und den Familien vor allen Dingen „Mut, Kraft und Zuversicht“.Besonders stolz ist Prokuristin Annette Bratz auf die Betriebszugehörigkeit aller Kollegen/innen von durchschnittlich 16 Jahren. Sie ehrte im feierlichen Rahmen zahlreiche Jubilare des Unternehmens, für 20 Jahre Betriebszugehörigkeit Hajnalka Kermel und für 30 Jahre Larissa Wagner, sowie Valentin Schlegel. Auch für das kommende Jahr hat sich das Unternehmen aus Egenhausen einiges vorgenommen. Rund 350 internationale Baumärkte werden auf neue Konzeptionen im Bereich der Handlauf- und Geländersysteme aktualisiert. Ab Februar ist auch das neu entwickelte Balkongeländersystem mit integrierter Photovoltaik Anlage für alle Kunden verfügbar.Personen auf dem BildVon links nach rechts: Valentin Schlegel, Hajnalka Kermel, Florian David, Larissa Wagner und Annette Bratz.Alle News anzeigen"
