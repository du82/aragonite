["https://dieda.de/news/projekt-naturnahe-firmengelaender"]
title = "DIEDA News – Projekt Naturnahe Firmengelände - DIEDA Systembauteile GmbH & Co. KG"
description = "Seit diesem Frühjahr stehen auch auf unserem Gelände in Egenhausen zwei Bienenvölker der Imkerei Brenner und Litmeier aus Effringen. Das Projekt wurde von Leader Heckengäu gefördert und wird bereits von fünf Firmen im Landkreis Calw umgesetzt."
full_description = "Alle News9. Januar 2022Zu Besuch bei der Imkerei Brenner & LittmeierGeschäftsführer Florian David fand die Idee naturnaher Firmengelände toll und spannend zugleich. So wurden auf dem Firmengelände heimische Obstbäume gepflanzt und wie in den vergangenen Jahren werden auf den unbebauten Flächen mehrjährige Blühmischung eingesetzt, so dass sich Insekten wieder wohlfühlen und vermehren können.Doch auch in der Firmenphilosophie hat Nachhaltigkeit seit vielen Jahren einen wichtigen und hohen Stellenwert. Das moderne Büro- und Produktionsgebäude in Egenhausen ist nicht nur optisch ein Leckerbissen im Industriebau, auch technisch ist es seiner Zeit voraus:Die Photovoltaikanlage wurde bereits im Juli 2009 in Betrieb genommen. Die Anlage hat eine Leistung von 100 kW und besteht aus 1.302 Dünnschichtmodulen. Die Anlage produziert rund 30 % des Strombedarfs der Firma -die restlichen 70% sind selbstverständlich schon seit über 15 Jahren atomfrei- und vermeidet pro Jahr rund 85.605 kg CO2-Emissionen. Das komplette Werk in Egenhausen wird mit eigenen Spänen geheizt, so dass kein Liter Heizöl verbraucht wird, also zu 100% CO² neutral!Aus den restlichen Spänen werden Holzbriketts gepresst und verkauft. Seit Inbetriebnahme der Anlage wurden rund 1 Million Briketts produziert. Die jährliche Produktionsmenge beträgt 80 Tonnen, was einem Heizwert von 48.000 Litern Heizöl entspricht. Gerade stellt die Firma die komplette Fertigungshalle auf eine LED-Beleuchtung um, was pro Stunde Hallenbeleuchtung ca. 20 kW Strom einspart.Der produzierte Honig der fleißigen Bienen auf dem Firmengelände von dieda Systembauteile GmbH + Co. KG in Egenhausen wird voraussichtlich wie bei der Hochdorfer Kronenbrauerei, Wagon GmbH, Digel AG oder der Volksbank Herrenberg-Nagold-Rottenburg eG an Kunden und Mitarbeiter verschenkt. Die speziell entwickelten Etiketten weisen auf das Projekt Naturnahe Firmengelände hin und sollen auch im privaten Bereich zur Nachahmung motivieren.Alle News anzeigen"
year_published = 2022
