["https://dieda.de/news/jubilare-bei-dieda"]
title = "DIEDA News – Jubiläen bei DIEDA - DIEDA Systembauteile GmbH & Co. KG"
description = "Im Rahmen der diesjährigen Weihnachtsfeier wurden zahlreiche Jubilare geehrt. Dieda ist besonders stolz auf die langjährige Betriebszugehörigkeit und sagt Danke!"
full_description = "Alle News19. Dezember 2022Jubiläen bei DIEDA 2022Im Rahmen der diesjährigen Weihnachtsfeier begrüßte Geschäftsführer Florian David die rund 50 anwesenden Mitarbeiter und ganz besonders die zahlreichen Firmen-Jubilare. Auch wenn sich die Wirtschafts- und Konjunkturaussichten europaweit deutlich eintrüben, steht dieda auf einer gesunden Basis und sieht sich für die Zukunft bestens positioniert. Florian David zog zu Beginn der Feierlichkeiten ein mehr als erfreuliches Fazit zum Jahresende „Gemeinsam dürfen wir stolz auf das Erreichte sein, denn 2022 ist das erfolgreichste Umsatzjahr der letzten 10 Jahre“. Insbesondere mit unseren Handlauf- und Geländer Systemlösungen aus Aluminium, Glas und Edelstahl hat das Unternehmen aus Egenhausen in den letzten Jahren außerordentlichen Erfolg. Auch die neu entwickelten Tisch- und Bankuntergestelle verbinden modernes Design und Funktionalität im Geschäftsbereich der Möbelprojekte.Besonders stolz ist Prokuristin Annette Bratz auf die Betriebszugehörigkeit aller Kollegen/innen von durchschnittlich 15 Jahren. Sie ehrte im feierlichen Rahmen zahlreiche Jubilare des Unternehmens, für 15 Jahre Betriebszugehörigkeit Marc Brenner, für 20 Jahre Fedor Zang, Evgjenije Krasniqi und Andrea Held. Zum 25jährigen Jubiläum Herrn Reiner Schübel, Frau Tatjana Engelmann und Daniela Schwarzbach-Mönch. Schon beeindruckende 30 Jahre sind Valerie Wagner und Silke Lauser für das Familienunternehmen tätig. Gemeinsam mit Herrn Frank Rothfuß blickt Sie selbst ebenfalls auf 35 Jahre Betriebszugehörigkeit zurück.Alle News anzeigen"
