["https://dieda.de/ueber-uns"]
title = "Wir über uns – DIEDA - DIEDA Systembauteile GmbH & Co. KG"
description = "Wir sind DIEDA, Ihr Partner für hochwertige Edelstahlgeländer, Balkongeländer und Handläufe, Top Materialien, perfekte Verarbeitung und einfache Montage."
full_description = "Wir über unsdieda wurde 1966 von Dietrich David als Ein-Mann-Betrieb gegründet und wird heute in zweiter Generation geführt. Im Zeitalter der Globalisierung nehmen traditionelle Werte wie Beständigkeit, Zuverlässigkeit und Familie eine immer bedeutendere Rolle ein.Werte liegen uns am HerzenWir verstehen uns als fairer Partner für Mitarbeiter, Kunden und Lieferanten. Nachhaltiges Handeln bestimmt unser tägliches Tun. Bei der Entwicklung neuer Produkte setzen wir auf bewährtes Know-how und konsequentes Qualitätsbewusstsein. Innovative und clevere Ideen sichern unsere Zukunft.Nie haben wir uns auf unseren Lorbeeren ausgeruht, der stetige Wille zum «Schaffen» von neuen Innovationen und die kontinuierliche Weiterentwicklung bestehender Prozesse bestimmt unser tägliches Handeln, unser Blick ist hierbei stets nach vorn gerichtet. Gewöhnliche Dinge ungewöhnlich zu tun und das Ganze zum einfachen und schnellen Selbermachen, das ist die Maxime von dieda. Innovative und clevere Ideen sichern unsere Zukunft. Modernes Trend-Design und traditionelle Gemütlichkeit sind für uns keine Gegensätze sondern ergänzen sich. Hieraus ist in unserer über 50 jährigen Firmengeschichte ein Unternehmen entstanden, das heute ein umfangreiches Systembau-Sortiment für den Do-It-Yourself-Kunden aller Altersgruppen anbietet.Unsere MissionIntelligente Lösungen mit SystemDie Bedürfnisse unserer Zielgruppen stehen immer im Fokus: Einfachstes Handling und maximale Montagefreundlichkeit sind wichtige Messgrößen bei der kontinuierlichen Optimierung unserer Produkte. Auch unsere Maßnahmen zur Absatzförderung im Markt werden stetig weiterentwickelt. Wir sind immer auf der Suche nach neuen Materialien und innovativen Ideen. „Gemacht zum Selbermachen!“ ist unsere Maxime.Unser VersprechenIhr Projekt immer im FokusDie Anforderungen unserer Kunden haben sich in den vergangenen Jahrzehnten deutlich gewandelt: Begrenztes Platzangebot und umfangreiche Sortimente kennzeichnen die Situation am Point of Sale. Als kompetenter Partner bieten wir deshalb flexible Lösungen wie bspw. das Kommissionsmodul als variables Präsentationskonzept, unsere Balkonplanungssoftware und individuelle Produktlösungen.Wir setzen auf NachhaltigkeitWir heizen unser komplettes Werk in Egenhausen mit eigenen Spänen, so dass hierfür keine zusätzlichen fossilen Brennstoffe verbraucht werden. Unsere Wärme gewinnen wir auf diese Weise zu 100% CO2-neutral.Mehr erfahrenAnsprechpartnerGeschäftsführungFlorian DavidTel.: +49 7453 9490-13Fax: +49 7453 9490-50florian.david@dieda.dePersonal und LogistikAnnette BratzTel.: +49 7453 9490-24Fax: +49 7453 9490-90annette.bratz@dieda.deProduktentwicklungMartin ZobelTel.: +49 7453 9490-26Fax: +49 7453 9490-50martin.zobel@dieda.deEinkaufDaniel SchlechtTel.: +49 7453 9490-18Fax: +49 7453 9490-50daniel.schlecht@dieda.deVertriebsinnendienst FrankreichMillor FotsingTel.: +49 7453 9490-16Fax: +49 7453 9490-50millor.fotsing@dieda.deVertriebsinnendienst InlandMichael LeberTel.: +49 7453 9490-15Fax: +49 7453 9490-50michael.leber@dieda.deFakturierungSilke LauserTel.: +49 7453 9490-12Fax: +49 7453 9490-50silke.lauser@dieda.deZentrale/AuftragserfassungDaniela Schwarzbach-MönchTel.: +49 7453 9490-10Fax: +49 7453 9490-50daniela.schwarzbach-moench@dieda.deZentraleAndrea HeldTel.: +49 7453 9490-11Fax: +49 7453 9490-50andrea.held@dieda.deBuchhaltungUte LenkTel.: +49 7453 9490-23Fax: +49 7453 9490-90ute.lenk@dieda.deBuchhaltungSonja EckertTel.: +49 7453 9490-22Fax: +49 7453 9490-90sonja.eckert@dieda.deLeitung Verpackung und LagerThomas BohnetTel.: +49 7453 9490-35Fax: +49 7453 9490-50thomas.bohnet@dieda.deMeister ProduktionReiner SchübelTel.: +49 7453 9490-31Fax: +49 7453 9490-49reiner.schuebel@dieda.de"
