full_description = "Tipps & TricksGeländer reinigen und pflegenDamit Sie lange Freude an Ihren Geländern und Handläufen aus Edelstahl (V2A oder V4A) haben, ist die richtige Pflege besonders wichtig.Hinweise für die Reinigung und PflegeHier finden Sie alle Dokumente für die Pflege und Reinigung von Edelstahl Oberflächen. Pflege - EdelstahlPDF Reinigung - Edelstahl rostfreiPDF Reinigung - Edelstahl stark gechädigtPDFFür die Einbindung von Videos werden eventuell nutzerbezogene Daten an Dritte übertragen. Bitte akzeptieren Sie die Marketing-Cookies, um Videos anzuzeigen.Cookiebanner öffnenDie Gründe für Oxidation sind vielfältigSind die Oberflächen von Edelstahlgeländern oder –Handläufen korrosiven Belastungen ausgesetzt, können sich diese verfärben oder sie beginnen zu rosten. Diese Belastungen können beispielsweise durch unsaubere Arbeitsweise (z. B. Bearbeitung mit älterem Werkzeug, Funkenflug durch Winkelschleifer, Berührung mit Bauchemie), durch mangelhafte Pflege oder durch Umwelteinflüsse (Berührung mit Chlor, Streusalz oder salzhaltigem Spritzwasser, Meeresnähe, aggressive Luftverschmutzung, mit korrosions\u0003auslösenden Partikeln belastetes Regenwasser, welches z. B. an der Fassade entlang läuft) entstehen.Richtige Edelstahlpflege für dauerhaft schöne OptikNach der Montage müssen alle Eisenpartikel (wie z. B. Späne, Schleifstäube oder Schweißspritzer), die sich durch die Berührung mit Werkzeugen, Gerüsten, Transportmitteln oder durch Arbeiten im Umfeld mit Baustahl auf den Edelstahloberflächen ablagern, unbedingt entfernt werden, da diese ein Rosten des Edelstahls bewirken können. Eine Erstreinigung ist unbedingt erforderlich. Die Reinigung sollte in regelmäßigen Abständen wiederholt werden. Ist die Oberfläche bereits durch Ablagerungen verunreinigt, lassen sich diese mit haushaltsüblichen (ferritfreien) Reinigungsschwämmen oder speziellen Reinigern entfernen. Hat bereits Korrosionsangriff eingesetzt, ist eine mechanische Oberflächenbehandlung unumgänglich.Pflege- und ReinigungssetWir empfehlen zur Reinigung unserer Geländersysteme das dieda Pflege- und Reinigungsset mit der Hauptartikel Nr. 250010. Reinigungsset bestellen"
