title = "Asparagus – low carb recipes for spring   -  Diet Doctor"
description = "Asparagus –  low carb recipes for spring The delicate asparagus comes in green, white and even purple. They’re all really tasty and packed with nutrients. At the same time, they’re low in carbs (about 2-3 %), easy to cook and very versatile. Here you’ll find some inspiration for this lovely spring super veggie. Our favorite..."
