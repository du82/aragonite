ssDiabetes or pre-diabetesHigh blood pressureIrritable bowel syndrome (IBS)Polycystic ovary syndrome (PCOS)Cholesterol abnormalitiesEpilepsy Cognitive declineCancer adjunctive therapyAthletic performanceMental health, performance, and attention A low-carb or keto diet can have many benefits, but not everyone needs to be on one. This guide presents some things to consider when choosing whether or not this kind of diet is right for you. You can also read about a scientific paper exploring the potential contraindications to a keto diet. .family-mp-cta{background:rgba(14,52,120,.1)}.vegetarian-mp-cta{background:#f8efe7}.budget-mp-cta{background:linear-gradient(180deg, rgba(245, 238, 232, 0.3) 0%, #f4ede6 100%)}.quick-mp-cta{background:#f1f5ec}.generic-cta{background:#e7f1ee}.survey-cta{background:rgba(14,52,120,.1)}.cta-widget-header{overflow:hidden;text-align:center;color:#404040;opacity:.6;font-size:0.6666666667rem;line-height:1.1666666667;margin-bottom:1em}.cta-widget-header::before,.cta-widget-header::after{background-color:#404040;opacity:.6;content:"";display:inline-block;height:1px;position:relative;vertical-align:middle;width:50%}.cta-widget-header::before{right:1em;margin-left:-50%}.cta-widget-header::after{left:1em;margin-right:-50%}.cta-widget-footer{background-color:#404040;opacity:.4;display:inline-block;height:1px;width:100%}.tv .cta-widget-header{color:#fff;opacity:1}.tv .cta-widget-header::before,.tv .cta-widget-header::after{background-color:#fff;opacity:1}.tv .cta-widget-footer{background-color:#fff;opacity:1}.pmp-cta-content-wrapper{background:#f2f2f2;border-radius:10px;padding:5px 15px 5px 15px}.pmp-cta-content-wrapper h5{margin:.7778rem 0 .7778rem}.pmp-cta-content-wrapper .pmp-cta-circles{display:flex;justify-content:center;margin-top:1em;margin-bottom:1em}.pmp-cta-content-wrapper .pmp-cta-circles.layout-1 .circle-1,.pmp-cta-content-wrapper .pmp-cta-circles.layout-1 .circle-2,.pmp-cta-content-wrapper .pmp-cta-circles.layout-1 .circle-3{border:1px so