title = "Carbs on Low Carb: How Low Carb Is Low Carb? — Diet Doctor"
description = "This guide will show you different carb levels and help you decide what level you should aim for. So how few carbs are there in a low-carb diet? In short, it depends on what you’re trying to achieve and who you are."
full_description = '''How low carb is low carb? By Dr. Andreas Eenfeldt, MD<img width="25" height="25" class="size-author-thumbnail wp-image-3475942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/10/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Andreas Eenfeldt, MD" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" />, Dr. Michael Tamber, MD<img width="25" height="25" class="size-author-thumbnail wp-image-4799557" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/10/michael-tamber.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Michael Tamber, MD" /> Evidence basedThis guide is based on scientific evidence, following our policy for evidence-based guides. Click for more info. /* <![CDATA[ */ckdc.ready((function(e){e("#ckdc-evidence-based-content").hide(),ckdc.body.on("click",".evidence-based-anchor",(function(c){const p=e("#ckdc-evidence-based-content");if(0===p.length)return;const n=`<div class="wppopup-wrapper"><div class="pop-inside">${p.html()}</div></div>`;ckdc.simplebox.open(n,{wrapperClasses:"wppopup-prompt",closeClasses:"wppopup-prompt-cancel"}),c.preventDefault()}))})); //# sourceMappingURL=evidence-based.min.js.map /* ]]&gt; */ .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ OverviewThree carb levelsFiber & net carbsHow to choo