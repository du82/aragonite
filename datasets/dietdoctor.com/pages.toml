title = "5 Weeks of Keto with Kristie – Keto Meal Plans & Support – Diet Doctor"
description = "Join Kristie Sullivan on this guided, member-only keto course. Eat delicious, satisfying food while fine-tuning your understanding of how to make keto work for you!"
full_description = '<img class="alignnone size-full wp-image-4529730 lazy" alt="5 weeks head_logo" loading="lazy" width="1200" height="532" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 1200px, 100vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=1200&amp;h=533&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=150&amp;h=67&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=200&amp;h=89&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=267&amp;h=119&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=400&amp;h=178&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=600&amp;h=266&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=800&amp;h=355&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=1000&amp;h=444&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=1200&amp;h=533&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=1600&amp;h=711&amp;fit=crop 1600w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=2000&amp;h=888&amp;fit=crop 2000w,https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=2400&amp;h=1066&amp;fit=crop 2400w" /><noscript><img class="alignnone size-full wp-image-4529730" src="https://i.dietdoctor.com/wp-content/uploads/2019/06/5-weeks-head_logo.png?auto=compress%2Cformat&amp;w=1200&amp;h=533&amp;fit=crop" alt="5 weeks head_logo" loading="lazy" width="1200" height="532" /> By Kristie Sullivan, PhD<img width="25" height="25" class="size-author-thumbnail wp-image-3580759" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/02/KristieSullivan-2.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Kristie Sullivan, PhD" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" /> Maybe you’ve tried keto before or you’re currently following a ketogenic diet, but you would like some company along the way? I’d like to invite you to join me for 5 Weeks of Keto with Kristie — we’ll spend a focused five weeks thinking, talking, and eating keto together! This program is available only for Diet Doctor members. Enroll today by signing up for a free 30-day membership trial! My five-week plan includes delicious, satisfying meals and teaches you how to create your own favorite keto meals. Together we will fine-tune your keto habits to make this lifestyle better and easier. My goal is to help you to learn more about how and why keto works using the very best content on Diet Doctor. If you’re brand new to a ketogenic diet, then you might want to start with the 2-week Get started challenge, but be sure to join me afterwards for an additional five weeks of keto support. With a full seven weeks of guidance, you’ll be well on your way to better health! Ready for five weeks of focused keto? Sign up now! Sign up for Diet Doctor Plus and start the 5 Weeks of Keto with Kristie today! Try Diet Doctor Plus for free Why join me? We may have a lot in common. I was morbidly obese as a child and for most of my adult life. Like many others, I failed at every diet I’d ever tried. My ‘diet career’ mainly included caloric restriction, eating low-fat foods, embarrassing exercise, attempting fad diets that involved unlimited soup, and counting “points” down to decimals! Each time I began with high hopes, dogged determination, and money plunked down for whatever plan, pills, or potion was the new promise of the day. Each time I found short-term success that left me even more frustrated with my body. Each failure compounded into desperation and left me wondering what was wrong with me. Why couldn’t I succeed? It wasn’t for lack of wanting. It wasn’t because I enjoyed the difficulties of being obese — the stylish clothes that wouldn’t fit, the name-calling, the fat-shaming, the being out-of-breath walking even a short distance, and the constant worry about fitting in chairs. In June 2013 when I first started a ketogenic diet, I was cautiously hopeful. Not 100% confident this would work, but desperate enough to try, I committed to a two-week trial. The science was clear, and a friend cautioned me, “Even one little Hershey Kiss can throw you off plan.” No Kisses for two weeks! I had done crazier things. For two weeks, I would eat protein, fat, and low-carb veggies. No sugar, no starch… no kidding. Two weeks seemed like a small commitment. I had eaten really disgusting ‘diet’ cabbage soup for that long. At least this time I was eating bacon. I dove in. And finally, my weight started dropping. Keto was the beginning to a whole new life for me! And a brand new, healthier relationship with food. In the more than six years since I started keto, I’ve learned a lot. I’ve been fascinated not only with the changes in my physical health, but in my new attitude towards food. My “diet career”, has gone from failure after failure to long-term success. Not only do I get to share my success with others, but every day I get to help others to realize their own success. My career really is a diet career these days! We can do this together! Join me as an apprentice. I’ll teach you all the tricks to being successful — eating the best ketogenic foods, understanding macronutrients, eating out, addressing the concerns of others (maybe even your own physician!), shopping, managing cravings, and troubleshooting! Together, we’ll enjoy the best of making keto simple, and we’ll address potential obstacles head-on. Plus, other than groceries, there’s nothing to purchase — no plans, no pills, no products, and no counting calories. We will simply eat real food! What you can expect Together we will prepare for our five weeks of keto living. Once you sign up, you’ll receive links to our Welcome and Prepare pages for some action items that will help you get ready. And wait to you see the first three weeks of meal plans! The food I’ve planned is truly delicious. While the activities are optional, I encourage you to do as many as possible so that you can make the most of our time together. Preparation for the five weeks includes getting into the right mindset, preparing our kitchens, shopping for staples, and thinking about why you want to follow the program and what you want to accomplish. Our weekly routine Each Friday, I’ll provide you with an overview of the following week. For the first three weeks, I’ve put together meal plans full of recipes that are my personal favorites. The meals I’ve chosen have keto macros, and are generally easy to make with ingredients most people like, and are exceptionally tasty! Here’s what the first week of dinners look like: .family-mp-cta{background:rgba(14,52,120,.1)}.vegetarian-mp-cta{background:#f8efe7}.budget-mp-cta{background:linear-gradient(180deg, rgba(245, 238, 232, 0.3) 0%, #f4ede6 100%)}.quick-mp-cta{background:#f1f5ec}.generic-cta{background:#e7f1ee}.survey-cta{background:rgba(14,52,120,.1)}.cta-widget-header{overflow:hidden;text-align:center;color:#404040;opacity:.6;font-size:0.6666666667rem;line-height:1.1666666667;margin-bottom:1em}.cta-widget-header::before,.cta-widget-header::after{background-color:#404040