title = ""
full_description = "Alexandre J. Pelouze, MDPhysicianI recommend the low-carb diet both before and after surgery to any patient undergoing cardio-vascular surgery, whether they are undergoing cardiac bypass for stenosed arteries, heart valve replacement or vascular procedures on peripheral vessels. Decreasing the inflammatory reaction before a huge stress such as a surgical procedure may help improve the outcome. Losing weight in overweight patients is also related to a better outcome. Since low-carb is more a lifestyle than just a diet, people will keep on it over the long run and therefore improve both their cardiovascular health and their general health.DegreesDoctor of MedicineSpecialtiesCardiovascular SurgeryContact informationGeneva, Switzerland"
