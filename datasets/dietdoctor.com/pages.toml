description = "Diet Doctor is a health company with the goal of empowering people everywhere to dramatically improve their health. A billion people suffer from health issues related to type 2 diabetes and obesity..."
full_description = "Career menu Start People Jobs Employee Log in Candidate Log in to Connect Homepage dietdoctor.com Facebook X LinkedIn .block-cover-bg { background-image: var(--block-bg-background-small); } @media (min-width: 640px) { .block-cover-bg { background-image: var(--block-bg-background-medium); } } @media (min-width: 1280px) { .block-cover-bg { background-image: var(--block-bg-background-full); } } Join our world-changing team Connect Our rocketship At Hava, you have the opportunity to join a rapidly growing startup that is already profitable and successful with Diet Doctor as foundationHava.co is newly launched with thousands of paying members already. Our sister brand Diet Doctor have been active for over 15 years and is today on the the world's largest low carb platforms.But this is still just the early beginning, most of our challenges are still ahead of us. LEARN MORE What we do Technology: Advanced AI for personalized nutritional guidance With Diet Doctor, we build tools and apps that make it simpler for people to start and sustain a healthy low-carb lifestyle. With Hava, we're pioneering personalized nutrition through advanced AI. Our app is a unique blend of technology and nutritional science, designed to offer customized, high-satiety food recommendations. We're committed to continuously leverage AI to better understand and meet the diverse nutritional needs and preferences of our users and combine it with our satiety score. Food: Transformative satiety scoring system With Diet Doctor, we create amazing low-carb recipes, meal plans and cooking videos. Our site offers more than 1000 free recipes, empowering people to eat delicious food while improving their health.With Hava, we introduce a revolutionary concept in nutritional guidance - the 'Satiety Score'. This unique feature rates foods based on their ability to provide fullness and satisfaction, helping users make informed, health-promoting food choices. Insights: Empowering health through AI and satiety With Diet Doctor, we write guides and inspiring stories, that make low carb simple. For popular low-carb searches we’re often the first result on Google, a responsibility we take very seriously. We keep working hard to make sure our advice is effective, inspiring and solidly evidence-based.With Hava, our platform combines AI-driven features and personalization with our satiety scoring system to revolutionize how people approach their health and nutrition. We provide insights that empower users to navigate their nutrition effortlessly, making healthy eating both simple and enjoyable. How we act Goodness We treat everyone, including ourselves, with kindness and respect. We strive to make the world a better place and want to spread the power to do good. Trustworthiness We aim to be worthy of trust in everything we do. We show no ads, sell no products and take no industry money. We base our advice on the best available evidence. We act as if the world were watching and keep our commitments. Simplicity We focus on the most important things. We make our products as simple as possible to use. We remove all unnecessary words, details and rules. Inspiration We inspire people around us and make work fun. We create products that delight and motivate people to act. We celebrate success. Diet Doctor HQ Team Diet Doctor Dr. Mark Cucuzzella, MD Family physician Dr. Colin Champ, MD Oncology expert Dr. Peter Foley, MBBS, MRCGP Family medicine Dr. Michael D. Fox, MD Fertility and PCOS expert Rasool Mirzaei Senior Backend Developer Piotr Sabaranski Customer Support Specialist Joshua Tran Video Content Creator Dr. Joanne McCormack, MD Family physician More people About Diet Doctor Diet Doctor is a health company with the goal of empowering people everywhere to dramatically improve their health. We give inspiration and trustworthy information that make it simple to start and sustain a healthy low-carb lifestyle. We give everything people need for free, so that more people can have healthy and fulfilling lives. Founded in 2011 Co-workers 25+ Turnover 59M SEK Career site Start People Jobs Data & privacy Manage cookies Locations Diet Doctor HQ Teams Product & Design Medical review board Expert contributors Corporate Video Leadership Engineering dietdoctor.com Employee login Candidate Connect login Already working at Diet Doctor? Let’s recruit together and find your next colleague. @dietdoctor.com dietdoctor.com kostdoktorn.se"
