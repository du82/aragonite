ds/2020/12/groceries.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop" alt="groceries" width="200" height="200" loading="lazy" /> 2. Get your shopping list Along with your meal plan, we’ll provide convenient shopping lists. We do the planning for you. <img class="aligncenter size-full wp-image-5099133 lazy" alt="meal" width="200" height="200" loading="lazy" sizes="(max-width: 319px) 100vw, (min-width: 1200px) 400px, 33vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w" /><noscript><img class="aligncenter size-full wp-image-5099133 lazy" alt="meal" width="200" height="200" loading="lazy" sizes="(max-width: 200px) 100vw, 200px" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=267&amp;h=267&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w" /><noscript><img class="aligncenter size-full wp-image-5099133" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal.png?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop" alt="meal" width="200" height="200" loading="lazy" /> 3. Enjoy delicious meals Dig in! Try out all of the delicious meals provided for you — and experience the low-carb benefits. <img class="aligncenter size-full wp-image-4914919 lazy" alt="meal plan" width="800" height="450" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=800&amp;h=171&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=150&amp;h=32&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=200&amp;h=43&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=267&amp;h=57&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=400&amp;h=85&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=800&amp;h=171&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=1600&amp;h=342&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-full wp-image-4914919 lazy" alt="meal plan" width="800" height="450" loading="lazy" sizes="(max-width: 769px) 100vw, 800px" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=800&amp;h=171&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=150&amp;h=32&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=200&amp;h=43&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=267&amp;h=57&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=400&amp;h=85&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=600&amp;h=128&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=800&amp;h=171&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=1000&amp;h=214&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=1200&amp;h=256&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=1600&amp;h=342&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-full wp-image-4914919" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/meal-plan.png?auto=compress%2Cformat&amp;w=800&amp;h=171&amp;fit=crop" alt="meal plan" width="800" height="450" loading="lazy" /> More about personalized meal plans Get what you want, how you want it — with personalized meal plans. When you take our survey, be sure to tell us what you prefer. Don’t eat dairy, eggs, seafood, or pork? We’ll remove those. Only have a short amount of time to cook? No problem. We’ll only add fast and easy recipes to your plan. One of the best parts about personalized meal plans is that nothing is set in stone. If you don’t like a recipe — or don’t have the ingredients or time required to make it — we’ll give you a new meal suggestion. Personalized meal plans will allow you to: ✅ Enjoy delicious food ✅ Lose weight with less hunger ✅ See fast results.footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 Start FREE trial Scientific studies now prove that compared to other diets, low-carb or keto diets are often more effective for weight loss, and for improving certain health markers. This has been demonstrated in several meta-analyses of high-quality studies, for example this one: The British Journal of Nutrition 2016: Effects of low-carbohydrate diets v. low-fat diets on body weight and cardiovascular risk factors: a meta-analysis of randomised controlled trials [strong evidence] Learn more Here are two selected high-quality studies (RCTs) demonstrating this: New England Journal of Medicine 2008: Weight loss with a low-carbohydrate, mediterranean, or low-fat diet [moderate evidence] Annals of Internal Medicine 2014: Effects of low-carbohydrate and low-fat diets: a randomized trial [moderate evidence] More studies (over 50): The science of low carb ↩'
