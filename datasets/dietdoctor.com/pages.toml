["https://dietdoctor.com/low-carb/meal-plans/vegetarian-diet-meal-plan"]
title = "Free 7-day vegetarian diet meal plan – Diet Doctor"
description = "Are you eating the same veggie low-carb meals every day? Spice it up with our easy and delicious plant-based meal plans!"
full_description = '.rcorners3 { border-radius: 12px; } How to follow a vegetarian meal plan By Franziska Spritzler, RD, CDE<img width="25" height="25" class="size-author-thumbnail wp-image-5588615" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2022/01/Franziska-Round-2021.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Franziska Spritzler, RD, CDE" /> .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ What is a vegetarian meal plan?How to lose weight7-day vegetarian keto meal plan Do you want delicious, nourishing meals that suit your keto vegetarian lifestyle? Then you’ll love this keto vegetarian meal plan. This vegetarian diet plan is designed to provide variety and meet your nutrition needs while keeping you under 20 grams of net carbs per day. <img alt="Plant-based meals for vegetarian meal planning" width="600" height="420" class="rcorners3 lazy" loading="lazy" data-src="/wp-content/uploads/2019/07/low_carb_vegan_buddha_bowl_h.jpg" src="/wp-content/uploads/2019/07/low_carb_vegan_buddha_bowl_h.jpg" /><img alt="Plant-based meals for vegetarian meal planning" width="600" height="420" class="rcorners3 lazy" loading="lazy" data-src="/wp-content/uploads/2019/07/low_carb_vegan_buddha_bowl_h.jpg" /><noscript><img src="/wp-content/uploads/2019/07/low_carb_vegan_buddha_bowl_h.jpg" alt="Plant-based meals for vegetarian meal planning" width="600" height="420" class="rcorners3" loading="lazy" /> DD+ MEMBERSHIP<img src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" alt="DDplus_icon_Black-Gold-small" width="50" class="" loading="lazy" /> Premium vegetarian diet plan When you become a Diet Doctor Plus member, you get access to this premium vegetarian meal plan, along with many others. Just press play and get started with simple recipes and shopping lists. You can also customize your own plan by answering a few questions. Take the 1-minute quiz Low carb: Vegetarian #5This week offers a delicious, colorful, and nutritious mix of vegetarian and vegan low-carb dishes. They will satisfy your appetite and make your taste buds sing. Indulge in vibrant veggies, flavorful cheeses and exciting spices. This meal plan will keep you below 33 g net carbs per day Full meal plan → <img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4521008" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/06/halloumi_and_spinach_curry_v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Halloumi and spinach curry" title="" />Mon<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-1891030" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/03/DD-600-lowcarbmushroomrisotto.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Creamy low carb cauliflower mushroom risotto" title="" />Tue<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4678451" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/07/low_carb_vegan_buddha_bowl_v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Low carb vegan Buddha bowl" title="" />Wed<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4757366" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/08/low_carb_vegan_kebab_wraps_v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto vegan kebab wraps with garlic sauce" title="" />Thu<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-1891249" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/03/Stuffed_greek_bellpeppers_V.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Feta cheese stuffed bell peppers" title="" />Fri<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4806436" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/02/176A8775.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Halloumi burger with rutabaga fries" title="" />Sat<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-1890494" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/03/Goatcheese_salad_V.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Goat cheese salad with balsamico butter" title="" />Sun Every meal plan is created and tested by our Diet Doctor recipe team and verified by our in-house dietitian, ensuring that you can enjoy delicious food with the right balance of macronutrients you need each day. Start free trial Already a member? Log in here <img src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Low-carb-vegan-tempeh-pumpkin-bowl_16-9.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop" alt="Low-carb vegan tempeh pumpkin bowl" width="400" height="280" class="rcorners3" loading="lazy" /> Guide to a plant-based low-carb diet plan What is a keto vegetarian diet plan? A keto vegetarian meal plan features recipes without meat or fish that are very low in carbs. On a keto vegetarian diet plan, protein comes from both animal sources, like eggs and dairy, and plant sources, such as soy and other legumes. A plant-based-diet meal plan may or may not contain some animal foods, while a vegan diet plan would not contain any animal foods. Following a keto vegan diet plan can be difficult because all plants contain some carbs. For this reason, we recommend following a keto vegetarian meal plan, which may include some vegan recipes. FREE TRIALGet your personalized meal plan with a FREE 30-day trial!What is your gender?FemaleMaleOther <img src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Low-carb-vegan-tempeh-pumpkin-bowl_16-9.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop" alt="Low-carb vegan tempeh pumpkin bowl" width="400" height="280" class="rcorners3" loading="lazy" /> Guide to a plant-based low-carb diet plan How can I lose weight on a vegetarian diet plan? A keto vegetarian meal plan for weight loss features nourishing low-carb, meat-free meals that provide adequate protein to help you feel full and satisfied. Eggs, cheese, and soy top the list of the best foods to include on a keto vegetarian weight loss meal plan. Disclaimer: If you are taking medications to lower your blood sugar or blood pressure, always check with your healthcare provider before making a significant dietary change. A low-carb, high-protein diet may further lower blood sugar and blood pressure to dangerous levels when combined with medications. If you need to find a clinician familiar with low-carb nutrition, you can start with our find a doctor map. 7-day vegetarian keto meal plan for weight loss Here is a full week of delicious vegetarian recipes for breakfast, lunch, and dinner. You’ll save time planning, preparing, cooking, and cleaning up by making two dinner servings and refrigerating half to enjoy for lunch the next day. Monday Breakfast <img width="1200" height="675" class="main-image size-site-size-ws wp-image-2182217" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/05/DD-620-scrambledinamug-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Scrambled eggs in a mug" title="" />Scrambled eggs in a mug 3g Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-585074" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/02/DD-362.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto Capre