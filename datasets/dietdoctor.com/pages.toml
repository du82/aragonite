description = "With this simple family diet plan, you won’t have to cook separate dishes for the non-low-carb members of your household."
full_description = '.rcorners3 { border-radius: 12px; } Our best family meal plan ideas By Franziska Spritzler, RD, CDE<img width="25" height="25" class="size-author-thumbnail wp-image-5588615" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2022/01/Franziska-Round-2021.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Franziska Spritzler, RD, CDE" /> .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ Create a meal plan for your familyFree 7-day family meal plan ​​Are you looking for a 7-day family meal plan that will fit your keto or low-carb diet? With this meal plan, you won’t have to cook separate dishes for the non-low-carb members of your household. It’s packed with delicious low-carb meals that your whole family will love. <img alt="Family meal planning" width="600" height="420" class="rcorners3 lazy" loading="lazy" sizes="(max-width: 900px) 100vw, (min-width: 1200px) 600px, 50vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=600&amp;h=401&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=150&amp;h=100&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=300&amp;h=200&amp;fit=crop 300w,https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=600&amp;h=401&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=800&amp;h=534&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=801&amp;fit=crop 1200w" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2021/07/Quick-Turkey-Bolognese-With-Cabbage-Noodles-h.jpg?auto=compress%2Cformat&amp;w=600&amp;h=401&amp;fit=crop" alt="Family meal planning" width="600" height="420" class="rcorners3" loading="lazy" /> DD+ MEMBERSHIP<img src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" alt="DDplus_icon_Black-Gold-small" width="50" class="" loading="lazy" /> Weekly family meal plans When you become a Diet Doctor Plus member, you get access to this premium family-friendly meal plan, along with many others. Just press play and get started with simple recipes and shopping lists. You can also customize your own by answering a few questions. Take the 1-minute quiz Keto: Family favorites #4This vibrant and flavorful meal plan is packed with keto meals that the whole family will enjoy. Everything from amazing keto salads like my mouthwatering keto cheeseburger salad and Naomi’s keto chicken pesto zoodle salad to keto pizza and bacon-wrapped hamburgers. This meal plan will keep you below 18 g net carbs per day. Full meal plan → <img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4882090" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/02/keto-cheeseburger-salad-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto cheeseburger salad" title="" />Mon<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4890184" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/03/Low-carb-Zoodle-Pesto-Chicken-Salad-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto chicken pesto zoodle salad" title="" />Tue<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-874700" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/06/DD-443-baconburger2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Bacon-wrapped keto burgers" title="" />Wed<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4840985" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/01/Three-Cheese-Fritatta_v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Three cheese keto frittata" title="" />Thu<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4883390" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/03/Pork-Skewers-with-zoodles-and-Chili-Mayo-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Grilled pork skewers with ribbon zoodles" title="" />Fri<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4873889" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/02/Keto-Lemony-Baked-Chicken-Thighs-Cauli-Mash-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Lemon-baked chicken thighs with cauliflower mash" title="" />Sat<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4826226" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/11/Keto-pizza-omelet-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto pizza omelet" title="" />Sun Every meal plan is created and tested by our Diet Doctor recipe team and verified by our in-house dietitian, ensuring that you can enjoy delicious food with the right balance of macronutrients you need each day. Start free trial Already a member? Log in here How to create a meal plan for your family How do you plan meals if you’re the only one in your family who follows a low-carb diet? The good news is that low-carb meals can be delicious, easy to prepare, and meet your entire family’s nutrition needs. However, feel free to add some minimally processed carbs to the plates of any family members who want them, such as sweet or white potatoes, milk, fruit, or grains. DD+ MEMBERSHIPMeals for the familyYou don’t have to cook several meals on a low-carb diet. With our family-friendly meal plans, you’ll get simple and tasty recipes the whole family can enjoy.Try it today!Learn more Disclaimer: If you are taking medications to lower your blood sugar or blood pressure, always check with your healthcare provider before making a significant dietary change. A low-carb, high-protein diet may further lower blood sugar and blood pressure to dangerous levels when combined with medications. If you need to find a clinician familiar with low-carb nutrition, you can start with our find a doctor map. 7-day family meal plan Here is a full week of delicious family-friendly recipes for breakfast, lunch, and dinner. You’ll save time planning, preparing, cooking, and cleaning up by making two dinner servings and refrigerating half to enjoy for lunch the next day. Monday Breakfast <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4807703" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/10/low-carb-granola-vh-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Low-carb granola with yogurt and raspberries" title="" />Low-carb granola with yogurt and raspberries 13g Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-585074" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/02/DD-362.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto Caprese omelet" title="