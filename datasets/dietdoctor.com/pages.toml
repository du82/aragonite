description = "FAQ: Low-carb & keto Some questions about low carb and keto are very common. Here you can find answers to them. To jump down to each category of questions, just click the topic: Weight loss Diabetes and blood sugar Food, hunger and cravings Cholesterol Medications The science behind low carb Common fears about low carb..."
full_description = 'FAQ: Low-carb & keto By Dr. Andreas Eenfeldt, MD<img width="25" height="25" class="size-author-thumbnail wp-image-3475942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/10/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Andreas Eenfeldt, MD" /> Some questions about low carb and keto are very common. Here you can find answers to them. To jump down to each category of questions, just click the topic: Weight loss Diabetes and blood sugar Food, hunger and cravings Cholesterol Medications The science behind low carb Common fears about low carb Low-carb side effects Ketosis, ketones and ketogenic diets Can XYZ follow a low-carb diet? How much should I eat? Sugar addiction Places to learn more .kd-section-marked{position:relative;z-index:1;background-color:#f2f2f2;margin:2em 0;padding-top:1px}.kd-section-marked:first-child{margin-top:0}.kd-section-marked-inner{position:relative;z-index:5;background-color:#f2f2f2}.kd-section-marked .kd-section-marked-inner img{margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0}.kd-section-marker{position:absolute;top:0;width:100%;width:100vw;height:100%;margin-left:0;margin-left:calc(50% - 50vw);z-index:0;background-color:#f2f2f2}.one-col .kd-text-section-left .kd-section-marker{margin-left:calc(600px - 50vw)} /*# sourceMappingURL=kd-section-marked.min.css.map */ Weight loss <img class="aligncenter size-large wp-image-285685 lazy" alt="" width="800" height="533" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=150&amp;h=100&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=200&amp;h=133&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=267&amp;h=178&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=1067&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-large wp-image-285685" src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71678709_LARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" alt="" width="800" height="533" loading="lazy" /> I’m not losing weight as fast as I want to or I have plateaued. What to do? There are a few things you can think about in order to lose weight, where the ones that might have the greatest impact are: Eat a strict low-carb diet with less than 20 grams of carbs per day. Eat only when hungry and avoid snacking. Try intermittent fasting. Sleep enough (7 or even 8+ hours per night) and avoid excessive stress. Note that as you get closer to reaching your ideal weight, the rate of weight loss will most likely slow down. It’s normal to reach a temporary plateau at some point. Also weight fluctuations of several pounds happen every day. This is all OK, just keep on doing what you’re doing. However, if your weight loss stops for many weeks or even months, or if you want to speed it up, here are more things to consider: How to Lose Weight Do people who stop a low-carb diet and return to their old eating habits regain weight fast? Can low-carb diets cause “carb intolerance”? When following low-carb diets, people tend to lose more weight than on other diets (on average). So it is logical that when people return to their old diet they might regain more. It is simply a bigger step in the wrong direction, compared to going off other diets. There’s no evidence for the speculation that eating low carb would cause carb intolerance. However, a temporary “cheat day” may lead to filling up your body’s sugar stores (glycogen), which binds more water, adding weight. This water weight (perhaps 1-2 pounds or slightly more) quickly disappears within days when you go low carb again. How do I STOP losing weight? For some people it is very easy to drop a significant amount of weight on low carb. Normally weight loss stabilizes within the normal weight range, as long as you eat when hungry and don’t starve yourself. However, if you’re concerned that you’re losing too much weight, then you have a few options: Eat often, at least three times per day, including plenty of protein, and lift weights to put on muscle. Eat slightly more carbs (like low-glycemic fruits, sweet potato, etc.) to put on a bit more fat. To summarize, there’s normally no need to stop a low-carb diet to stop losing weight. This will happen anyway, as you reach what your body perceives is the right weight for you. Should I want to, is it possible to gain weight on low carb? It’s hard for most people to gain fat mass on low carb. But it’s clearly possible to add lean mass, like muscle. Check out our guide here: How to gain weight on low carb Diabetes and blood sugar <img class="aligncenter size-large wp-image-279276 lazy" alt="" width="800" height="533" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=150&amp;h=100&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=200&amp;h=133&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=267&amp;h=178&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=1067&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-large wp-image-279276" src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_71235635_XXXLARGE.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" alt="" width="800" height="533" loading="lazy" /> Is a low-carb diet good for people with type 2 diabetes? Yes. People with type 2 diabetes have a hard time regulating sugar in the body. The pancreas produces a lot of the hormone insulin in order to move sugar out of the blood and into the body’s cells. More and more insulin may be required for this, leading to a vicious cycle resulting in insulin resistance and consequences of high insulin (including weight gain). By following a low-carb diet, you may reduce blood sugar levels, insulin levels and your need for medication. So yes, a low-carb diet can be very beneficial for patients with diabetes type 2. It can even start reversing the disease. Note though – this is very important – that if you are taking medications, especially insulin, you need to monitor your blood sugar levels closely when starting a low-carb diet, and adapt (lower) doses as appropriate to avoid low blood sugar. You should of course consult with your doctor, as ideally he or she has knowledge about how to reduce medications on a low-carb diet. Read more about starting keto or low carb with diabetes medications. Learn more: How to reverse type 2 diabetes – the quick start guide How to reverse your type 2 diabetes (the longer guide) Is a low-carb diet good for people with type 1 diabetes? Yes. It may help stabilize blood sugar levels and reduce the need for high insulin doses (also helping with weight loss if needed, as a bonus). Be very careful when starting a low-carb diet, as you’ll have to adapt your insulin doses. Big changes may be needed, e.g. a reduction by 30-70%, depending on your specific situation. This can only be done by testing sugars and adapting insulin doses to your specific needs. Learn more: Type 1 diabetes Should I be worried about low blood sugar on low carb or while intermittent fasting? Generally, you don’t have to be worried as long as you feel fine and are not taking any diabetes medication. Blood sugars can be slightly lower than normal on a low-carb diet, especially when you are in ketosis. In this situation the brain can rely on ketones for fuel and does not have quite the same need for glucose. Learn more: Food for thought: Does the brain need carbs? So if you feel great, you probably have all the blood sugar that your body needs. If you’re not feeling well, you should eat something straight away, and break any fast. If you’re on medication, like insulin or certain diabetes medications, low blood sugar is a sign that you may have to reduce your dosage (especially if you get any symptoms). Learn more: Starting keto or low carb with diabetes medications High blood sugar in the morning – why? Elevated morning blood sugar is a common concern. This is known as “the Dawn Phenomenon” and occurs due to hormonal effects in the early morning hours. It may possibly be even more pronounced on a low-carb diet, compared to other diets. Many people get surprised as their average blood sugar (measured as HbA1c) goes down nicely on low carb, blood sugar is great during the day… but morning sugar remains elevated. This is normally a natural phenomenon, caused by a morning rise in cortisol and other hormones that cause the liver to release glucose, thus raising blood sugar levels. This can be thought of as a way for the body to prepare you for getting active again, after sleeping. Learn more: The dawn phenomenon – why are blood sugars high in the morning? Food, hunger and cravings <img class="aligncenter size-large wp-image-279283 lazy" alt="" width="800" height="533" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=150&amp;h=100&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=200&amp;h=133&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=267&amp;h=178&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=1067&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-large wp-image-279283" src="https://i.dietdoctor.com/wp-content/uploads/2016/07/iStock_88856573_XXXLARGE-1.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop" alt="" width="800" height="533" loading="lazy" /> Can I eat XYZ? There are a few foods that don’t contain too much carbohydrate, but which might not be optimal for health, cravings, and weight loss reasons. These include: Dairy products such as milk and yoghurt. Learn more Artificial sweeteners such as aspartame, sucralose, and acesulfame-K may keep one’s sweet tooth alive, possibly causing cravings and overeating. In some cases products that contain these sweeteners also have quite a lot of carbs. Learn more Nuts – some are fairly high in carbs, and they can easily cause overeating due to unconscious snacking. Low-carb nuts guide Oils that are rich in omega-6 fatty acids, such as canola and soybean oil, are highly processed, and their effects on health aren’t clear. Learn more: Vegetable oils: are they healthy? Alcoholic beverages that contain quite a lot of carbs. The best options are low-carb wine and pure spirits. Low-carb alcohol guide Fruit. This is candy from nature, and in most cases contains a lot of sugar. Low-carb fruits guide Low-carb cookies/bread/pasta. This is not a good idea, given that the vast majority of these low-carb “carb substitutes” are packed with carbs. Examples: Atkins, greed and the fairy-tale cookies Low-carb bread: Another fairy tale bites the dust The Dreamfields pasta fraud I’m constantly hungry and craving food in between meals. What should I do? You’re not supposed to get hungry between meals on a low-carb diet. Here’s what you should try: Eat more food at meals, especially more fat. Add more fat to your meals, until you feel satisfied. Add butter to food. Add olive oil to salads. And perhaps check out our low-carb condiments recipes for more inspiration. Also make sure to have a delicious and high-quality source of protein with most meals. You’re not supposed to be hungry all the time. If you are, you’re not eating enough fat and protein. If I’m lowering carbs and even limiting protein… what do I eat? Usually, there is no need to limit protein, it is fine to eat a “normal” amount. Just don’t overdo it with protein. Remember that LCHF is supposed to be a low-carb and high-fat, diet, not a high-protein diet. Read our guidelines for individualized protein intake. For a standard low-carb meal, you simply remove the carb-heavy ingredients, like rice. You then add some vegetables and some healthy oil or fat-based sauce. But there are plenty of other options. Here are many delicious examples of what a meal can look like: Low-carb recipes. I’m craving carbs. Can I have a cheat meal – or a cheat day – once in a while? Only you can decide – cheating can be a good idea for some, and a terrible idea for others. It also matters how you cheat. Check out our guide: A guide to low-carb cheating I’m really struggling with cravings for carbs, even when I’m not hungry. What should I do? Carb cravings can be tough. Fortunately, avoiding sweets and other foods that trigger foods can be a very effective solution. Learn more about sugar and carb addiction Do you need to eat resistant starch on low carb to feed your gut bacteria? At this time it’s unknown, but there appear to be some potential benefits of doing so Cholesterol <img class="aligncenter size-large wp-image-279284 lazy" alt="" width="800" height="533" loading="lazy" sizes="(max-width: 769px)'
