ar .social-share-button .social-share-icon{line-height:0;display:block;float:left;padding-right:10px}.social-share-wrap.style-bar .social-share-button svg{fill:#fff;width:16px;height:16px}.social-share-wrap.style-bar .social-share-button .social-share-label{display:block;float:left;line-height:16px}.social-share-wrap.style-bar .social-share-button .social-share-count{display:none} /*# sourceMappingURL=social-share.min.css.map */ /* <![CDATA[ */ckdc.ready((function(t){"undefined"!=typeof ckdc&&ckdc.setup.addSetupContent("social-share-links",(function(e){var a=e.find('.social-share-button[target="_blank"]');a.on("click touchstart",(function(e){e.preventDefault();var a="",i=this.href;switch(i.split("/")[2]){case"www.facebook.com":a="width=585,height=468";break;case"twitter.com":a="width=585,height=361";break;case"pinterest.com":a="width=750,height=650";break;default:a="width=585,height=515"}window.open(i,"","menubar=no,toolbar=no,resizable=yes,scrollbars=yes,"+a),t(this).trigger("social-share-click")})),a.on("social-share-click",(function(){var e=t(this),a=e.data("social-network"),i=e.data("social-action"),c=e.data("social-target"),o=e.data("social-title");return a&&i&&c&&ckdc.events.ga4("social-share",i,{network:a,title:o,target:c}),!1}))}))})); //# sourceMappingURL=social-share.min.js.map /* ]]&gt; */FacebookTweetPinLinkedIn How few carbs are there in a low-carb diet? It depends on who you are, what you find sustainable, and what you’re trying to achieve. Low carb is often defined as any diet containing fewer than 130 grams of carbs per day. Generally speaking, the fewer the carbs, the more effective the diet appears to be for weight loss without hunger and for treating type 2 diabetes..footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 However, eating fewer carbs also makes the diet more restrictive and can make it feel more challenging to sustain. At Diet Doctor, we recommend recipes and meal plans for up to 100 grams of carbs per day. Here are three examples of how a low-carb dinner can look, depending on how many carbs you eat per day (the yellow stuff is delicious herb butter). Ketogenic Under 20 grams per day<img alt="Strict low carb" width="400" height="299" class="alignnone size-full wp-image-141909 lazy" loading="lazy" sizes="(max-width: 319px) 100vw, (min-width: 1200px) 400px, 33vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img alt="Strict low carb" width="400" height="299" class="alignnone size-full wp-image-141909 lazy" loading="lazy" sizes="(max-width: 400px) 100vw, 400px" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=267&amp;h=267&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=600&amp;h=600&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Keto-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" alt="Strict low carb" width="400" height="299" class="alignnone size-full wp-image-141909" loading="lazy" /> Moderate 20-50 grams per day<img alt="moderate low carb" width="400" height="299" class="alignnone size-full wp-image-141933 lazy" loading="lazy" sizes="(max-width: 319px) 100vw, (min-width: 1200px) 400px, 33vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img alt="moderate low carb" width="400" height="299" class="alignnone size-full wp-image-141933 lazy" loading="lazy" sizes="(max-width: 400px) 100vw, 400px" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=267&amp;h=267&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=600&amp;h=600&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Moderate-low-carb-dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" alt="moderate low carb" width="400" height="299" class="alignnone size-full wp-image-141933" loading="lazy" /> Liberal 50-100 grams per day<img alt="Liberal low carb" width="400" height="299" class="alignnone size-full wp-image-141923 lazy" loading="lazy" sizes="(max-width: 319px) 100vw, (min-width: 1200px) 400px, 33vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img alt="Liberal low carb" width="400" height="299" class="alignnone size-full wp-image-141923 lazy" loading="lazy" sizes="(max-width: 400px) 100vw, 400px" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=200&amp;h=200&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=267&amp;h=267&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=600&amp;h=600&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=800&amp;h=800&amp;fit=crop 800w" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2019/09/Liberal-low-carb-Dinner.jpg?auto=compress%2Cformat&amp;w=400&amp;h=400&amp;fit=crop" alt="Liberal low carb" width="400" height="299" class="alignnone size-full wp-image-141923" loading="lazy" /> .kd-section-marked{position:relative;z-index:1;background-color:#f2f2f2;margin:2em 0;padding-top:1px}.kd-section-marked:first-child{margin-top:0}.kd-section-marked-inner{position:relative;z-index:5;background-color:#f2f2f2}.kd-section-marked .kd-section-marked-inner img{margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0}.kd-section-marker{position:absolute;top:0;width:100%;width:100vw;height:100%;margin-left:0;margin-left:calc(50% - 50vw);z-index:0;background-color:#f2f2f2}.one-col .kd-text-section-left .kd-section-marker{margin-left:calc(600px - 50vw)} /*# sourceMappingURL=kd-section-marked.min.css.map */ Our definition Here’s the way we define different levels of carb intake at Diet Doctor: Ketogenic low carb <20 grams of net carbs per day.2This level of carbohydrates is defined as below 5 energy percent (E%) carbs in our recipes or, if it is a meal, 7 grams of carbs or less.3 In our ketogenic recipes, the amount of carbs per serving is shown in green balls. Moderate low carb 20-50 net grams per day. This level is defined as between 5-10 E% carbs in our recipes and the amount of carbs per serving is shown in yellow balls. Liberal low carb 50-100 net grams per day. This means 10-20 E% carbs in our recipes and the amount of carbs per serving is shown in orange balls. For comparison, a regular Western diet can easily contain 250 grams of carbs or more in a day — most of them refined carbs, including sugar.4 Note: Although our recipes are arranged by percent calories from carbs, protein, and fat, we do not feel you need to calculate these on your own. We provide them as a reference, but we recommend you limit your carbs, ensure adequate protein, and adjust fat as needed for taste. That eliminates the need to constantly calculate “percent macros.” Fiber Our listed carb counts are the number of digestible carbs, also called net carbs. This simply means we do not count the fiber.5 For example, you can eat nearly all the fiber you want from keto vegetables without seeing a significant blood sugar or insulin impact.6 However, don’t be fooled by the label “net carbs” on processed products, like chocolate bars. The labels can be misleadin'''
