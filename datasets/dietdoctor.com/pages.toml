title = "Meet Team Diet Doctor"
description = "Inspiring and empowering people all over the world to improve their health requires a team of dedicated professionals. Our team members come from all over the world and together we hold a broad range of knowledge and expertise that makes this company unique."
full_description = 'Meet our team .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ LeadershipMedicalMedical review boardExpert contributorsExpert panelCorporateEngineeringProduct & MarketingModerators We’re hiring! Empowering people everywhere to revolutionize their health requires a team of dedicated professionals. Our team members come from all over the world, and together we hold a broad range of knowledge and expertise that makes this company unique. Our team comprises all kinds of skill sets and professions, from doctors, dietitians and nurses to journalists, developers, school teachers and cookbook authors. We create the content on our site. Despite our different backgrounds, we all have one thing in common: We all want to create a brighter future for millions of people — wherever they live and whatever their means. Leadership <img alt="DD_Andreas" class=" lazy" loading="lazy" width="300" height="300" sizes="(max-width: 319px) 50vw, (min-width: 1200px) 300px, 25vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2016/01/DD_Andreas.png?auto=compress%2Cformat&amp;w=300&amp;h=300&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2016/01/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2016/01/DD_Andreas.png?auto=compress%2Cformat&amp;w=300&amp;h=300&amp;fit=crop 300w,https://i.dietdoctor.com/wp-content/uploads/2016/01/DD_Andreas.png?auto=compress%2Cformat&amp;w=600&amp;h=600&amp;fit=crop 600w" /><noscript><img alt="DD_Andreas" class=" lazy" loading="lazy" width="300"