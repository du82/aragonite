title = "Get Started with Diet Doctor's FREE 2-Week Keto Challenge!"
description = "Do you want to lose weight, improve your health, or reverse your type 2 diabetes? Sign up for our two-week keto program and get meal plans, shopping lists, and more for free. Try the best free keto program today."
full_description = 'Keto challenge By Dr. Andreas Eenfeldt, MD<img width="25" height="25" class="size-author-thumbnail wp-image-3475942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/10/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Andreas Eenfeldt, MD" />, Jill Wallentin<img width="25" height="25" class="size-author-thumbnail wp-image-2632271" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/08/DD_JillWallentin_2018_round.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Jill Wallentin" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" /> Evidence basedThis guide is based on scientific evidence, following our policy for evidence-based guides. Click for more info. /* <![CDATA[ */ckdc.ready((function(e){e("#ckdc-evidence-based-content").hide(),ckdc.body.on("click",".evidence-based-anchor",(function(c){const p=e("#ckdc-evidence-based-content");if(0===p.length)return;const n=`<div class="wppopup-wrapper"><div class="pop-inside">${p.html()}</div></div>`;ckdc.simplebox.open(n,{wrapperClasses:"wppopup-prompt",closeClasses:"wppopup-prompt-cancel"}),c.preventDefault()}))})); //# sourceMappingURL=evidence-based.min.js.map /* ]]&gt; */ Do you want to lose weight and improve your health? Perhaps you want to reverse your type 2 diabetes?.footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 Then join us and do what over 1 million people have already done – and sign up for our free 2-week keto challenge. We’ll provide you with all the information and support you need to get started with your new diet and healthier life. What have you got to lose? Well, maybe a few pounds, your high blood sugar, sugar cravings, and even other health issues like IBS, PCOS, and acne. What will you eat? This is no arduous diet, with two weeks of struggle and deprivation. This is two weeks of delicious, satisfying meals. You’ll be amazed at all that you can eat! Diet Doctor’s recipe team creates the meal plan for each week. It’s designed to be as simple and delicious as possible. Unlike other diets, you won’t have to worry about feeling hungry or deprived. The foods you’ll eat are filling, flavorful, and nutritious.2 Here are some of the amazing dishes you’ll feast on: <img class="aligncenter size-full wp-image-5098958 lazy" alt="Keto recipes" width="1200" height="534" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 1200px, 100vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=534&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=150&amp;h=67&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=200&amp;h=89&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=267&amp;h=119&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=400&amp;h=178&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=600&amp;h=267&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=800&amp;h=356&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=1000&amp;h=445&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=534&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=712&amp;fit=crop 1600w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=2000&amp;h=891&amp;fit=crop 2000w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=2400&amp;h=1069&amp;fit=crop 2400w" /><noscript><img class="aligncenter size-full wp-image-5098958" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=534&amp;fit=crop" alt="Keto recipes" width="1200" height="534" loading="lazy" /> <img class="aligncenter size-full wp-image-5098971 lazy" alt="GSKC-2021-Recipes-EN-2" width="1200" height="2695" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 1200px, 100vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=2695&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=337&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=200&amp;h=449&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=267&amp;h=600&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=400&amp;h=898&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=600&amp;h=1348&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=800&amp;h=1797&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1000&amp;h=2246&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=2695&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=3593&amp;fit=crop 1600w,https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1781&amp;h=4000&amp;fit=crop 1781w" /><noscript><img class="aligncenter size-full wp-image-5098971" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/GSKC-2021-Recipes-EN-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=2695&amp;fit=crop" alt="GSKC-2021-Recipes-EN-2" width="1200" height="2695" loading="lazy" /> .kd-section-marked{position:relative;z-index:1;background-color:#f2f2f2;margin:2em 0;padding-top:1px}.kd-section-marked:first-child{margin-top:0}.kd-section-marked-inner{position:relative;z-index:5;background-color:#f2f2f2}.kd-section-marked .kd-section-marked-inner img{margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0}.kd-section-marker{position:absolute;top:0;width:100%;width:100vw;height:100%;margin-left:0;margin-left:calc(50% - 50vw);z-index:0;background-color:#f2f2f2}.one-col .kd-text-section-left .kd-section-marker{margin-left:calc(600px - 50vw)} /*# sourceMappingURL=kd-section-marked.min.css.map */ Sign up for free today! Sign up for instant access to a simple step-by-step guide. You’ll also receive supportive emails describing in detail the next steps, meal plans, recipes, and shopping lists for two weeks. You don’t need to buy any special products; you’ll need to buy, cook, and eat real food. .mc-subscribe,.mc-subscribe-wrapper{display:none} /*# sourceMappingURL=mc-subscribe.min.css.map */ Sign up In case you have not received an email from us after signing up, please check your spam folder. Testimonial What kind of results can you expect from the two-week keto challenge? Check out Caroline’s story for inspiration: Why keto? Everyone is talking about the keto diet. Why? Because it works! Scientific research and a growing legion of personal stories document the array of positive effects. Common results include weight loss without hunger, improved diabetes management, reduced sugar cravings, calmer stomachs, and improved health markers.34 We know that not everyone will see results by switching to keto eating. But we do know from more than 10 years of experience on our site that many people’s lives are improved so dramatically that we must help as many as we can. You, too, could become one of the hundreds of inspiring success stories.5 Will you experience dramatic results? You’ll only know if you try. So think of this as an exciting, no-risk, two-week adventure into a new way of eating. It may very well put you on the road to a happier, healthier you for the rest of your life. Doesn’t that sound simply irresistible? You know you want to try it. Sign up for free today! Sign up for instant access to a simple step-by-step guide. You’ll also receive supportive emails describing in detail the next steps, meal plans, recipes, and shopping lists for two weeks. You don’t need to buy any special products; you’ll need to buy, cook, and eat real food. Sign up In case you have not received an email from us after signing up, please check your spam folder. The success stories What kind of results can you expect on a keto diet? Hundreds of people have sent us their success stories. Check out a few for inspiration: Fantastic – I loved it! Kick-started my low-carb journey, easy to follow, love the app – it’s brilliant! Kick-started my low-carb journey, easy to follow, love the app – it’s brilliant! I don’t have to wonder and think about what to eat. All I have to do is shop. Rita The daily emails made it super easy to get started.This challenge was user-friendly and a great resource. I was initially ambivalent about getting started, but the daily emails made it super easy to get started. I didn’t have to log in to the website to find my daily plan. It was sent straight to my email. The recipes were easy to follow and very tasty. I also felt that I didn’t waste a lot of food because many of the ingredients are consistently used. I highly recommend this website to get started. Thank you! Blanca Hello Diet Doctor staff, The keto challenge was wonderful, not so much a challenge but a joy.The keto challenge was wonderful, not so much a challenge but a joy. 😊 I followed the advice on other Dr. Eenfeldt videos on your site, where he suggested eating as much of the permitted foods to satiety rather than counting macros, which I would find tedious. I am so pleasantly surprised! I thought I had a sugar addiction. It seems I don’t. On day two — and ever since — I’ve had ZERO cravings for sweet food. This is remarkable for me. And I have lost 13 pounds (6 kilos) in 4 weeks. (I did a week of keto before and after the challenge.) I am continuing to eat keto as I love it. Thank you for your excellent website. It’s so informative. Paulette Frequently asked questions Frequently asked questions How much weight will I lose on the 2-week keto challenge? This is highly individual, but most people lose between 3 and 15 pounds (1.5 to 7 kilos) in the two weeks.6 Some lose more, some lose less. Why does the challenge last two weeks? Two weeks are enough to determine your own response to the diet and to get through early difficulties — like removing sugar from your diet. It’s enough time to start experiencing the true benefits of a keto diet and to know if you want to continue.7 It’s not a huge undertaking, and basically anyone can commit to this challenge for two weeks. Are you up for it? .family-mp-cta{background:rgba(14,52,120,.1)}.vegetarian-mp-cta{background:#f8efe7}.budget-mp-cta{background:linear-gradient(180deg, rgba(245, 238, 232, 0.3) 0%, #f4ede6 100%)}.quick-mp-cta{background:#f1