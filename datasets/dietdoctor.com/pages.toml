title = ""
full_description = "Delicious recipes, meal plans made simple, insightful videos, weight loss advice from medical experts & more. We’ll create a unique meal plan, customized to your preferences and lifestyle, from our catalogue of 1,200+ recipes. See nutrition information, adjust servings, and save favorites. Create your own meal plans or swap recipes in our existing ones. See your weight loss over time (more health metrics coming soon). We aim to help you make sense of — and improve — your journey. Get expert guidance with our evidence-based weight loss programs. Choose 2, 5, or 10 weeks and go step by step. Our pros share their best tips for getting started, navigating social situations, handling common challenges, and so much more. Exclusive app-only features help you eat, track, learn, and connect wherever you are. Get answers on the go or access your shopping list. Access all of our movies, presentations, documentaries, and video courses on topics from sugar addiction to keto for beginners. Simplify the grocery store! The right amounts of all the ingredients for your DD recipes auto-update as you adjust servings and recipes. The first 30 days are free when you sign up. Then it costs US$14.99 per month or US$119 per year (equivalent to three months free). If you cancel your membership within the first 30 days, you pay nothing. No, unfortunately not. We don’t accept advertising money, so we are supported by our members. The premium content in Diet Doctor Plus is created and maintained by our hard-working team. They make the programs, videos, community, recipes, app, and site as trustworthy, simple, and inspiring to use as possible. There is no charge if you cancel within the trial period. If you wish to keep your Diet Doctor membership after your free trial, your billing information is stored so that the account can convert with no service interruption."
