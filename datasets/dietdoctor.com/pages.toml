title = "Low Carb and Keto for Clinicians — Diet Doctor"
description = "How can you as a doctor treat patients with type 2 diabetes? Dr. Sanjeev Balakrishnan learned the answer to this question seven years ago. Check out this video for all the details!"
full_description = 'Low carb & keto for clinicians By Dr. Evelyne Bourdua-Roy, MD<img width="25" height="25" class="size-author-thumbnail wp-image-5017488" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/06/dr-bourdua-roy.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Evelyne Bourdua-Roy, MD" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" /> Evidence basedThis guide is based on scientific evidence, following our policy for evidence-based guides. Click for more info. /* <![CDATA[ */ckdc.ready((function(e){e("#ckdc-evidence-based-content").hide(),ckdc.body.on("click",".evidence-based-anchor",(function(c){const p=e("#ckdc-evidence-based-content");if(0===p.length)return;const n=`<div class="wppopup-wrapper"><div class="pop-inside">${p.html()}</div></div>`;ckdc.simplebox.open(n,{wrapperClasses:"wppopup-prompt",closeClasses:"wppopup-prompt-cancel"}),c.preventDefault()}))})); //# sourceMappingURL=evidence-based.min.js.map /* ]]&gt; */ .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ IntroductionMisconceptionsThe scienceClinical toolsCME activityVideo coursePatient resourcesClinician resourcesFind a low-carb doctorClinicians’ storiesPatients’ stories 1. Introduction Are you a clinician curious about how low-carb nutrition can help your patients? Look no further. Or maybe you’re a clinician who has heard about low-carb nutrition, but some outlandish claims have given you a reason to doubt its scientific foundations. We sympathize with that perspective too. Our main goal at Diet Doctor is to make low-carb diets simple for people who could benefit from them and to do so in the most trustworthy and reliable manner possible. About Diet Doctor This includes making it easy for clinicians to learn about low-carb diets. Carbohydrate reduction expands the options clinicians can offer patients. As these hundreds of success stories show, many individuals find low carb to be a life-changing discovery. But there’s another important change that can occur: Not only can low carb transform patients’ lives, it can transform your clinical practice. Rising rates of metabolic diseases have highlighted just how ineffective our tools are for dealing with these conditions..footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 Many clinicians are frustrated with constantly juggling risk factors, medications, and side effects for patients with chronic disease. We think all clinicians would like to see their patients become healthier. They’d like to remove medications instead of always adding them. Many clinicians who have started using carbohydrate reduction as a therapeutic tool have been able to do just that. As a result, they’ve found more enjoyment, satisfaction, and patient engagement in their daily work. We can help that happen for you too, by giving you the tools to assist patients in working to reverse – rather than just manage – chronic conditions like obesity, type 2 diabetes, and metabolic syndrome.2 .family-mp-cta{background:rgba(14,52,120,.1)}.vegetarian-mp-cta{background:#f8efe7}.budget-mp-cta{background:linear-gradient(180deg, rgba(245, 238, 232, 0.3) 0%, #f4ede6 100%)}.quick-mp-cta{background:#f1f5ec}.generic-cta{background:#e7f1ee}.surve