title = "Terms and conditions   -  Diet Doctor"
description = "Diet Doctor is a purpose-driven company that exists to empower people everywhere to revolutionize their health. Our current mission is to make low carb simple."
full_description = 'Terms and conditions By Dr. Andreas Eenfeldt, MD<img width="25" height="25" class="size-author-thumbnail wp-image-3475942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/10/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Andreas Eenfeldt, MD" /> – Updated March 14, 2024 .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ DisclaimerCopyrightPrivacy policyComments policyAdditional membership terms Diet Doctor is a purpose-driven company that exists to empower people everywhere to revolutionize their health. Our current mission is to make low carb simple. Below are the terms you agree to anytime you use DietDoctor.com, any of our apps, or other services. Disclaimer To achieve our mission of making low carb simple, we provide visitors with the knowledge, tools, and inspiration we believe they will benefit from to the best of our ability. Although we do our best to provide reliable and informative material, we cannot and do not make any representations or warranty with respect to the content on our site and apps. Use of our site, apps, and other services is done at your own risk. The information we provide at DietDoctor.com is not intended to replace consultation with a qualified medical professional. Seek the advice of your physician or another qualified health provider with any questions you may have regarding a medical condition. The content we provide is not intended to be relied upon for medical diagnosis or treatment. Inform your physician of any changes you may make to your lifestyle and discuss these with him or her. Do not disregard medical advice or delay visiting a medical professional because of something you read on our site, app, or on our other communication channels. For questions or concerns about any medical conditions you may have, please contact your doctor. Find a low-carb doctor Diet Doctor copyright policy You can not use any of our content for commercial purposes unless you have obtained the right to do so from us. Feel free to use and translate our articles and guides as long as you add a clearly visible link or reference to our site (on every page), and indicate if changes to our content were made. You may use such content in any reasonable manner, but not in any way that suggests Diet Doctor endorses you or your usage of our content. You may not use our recipes or membership content unless you have obtained the right to do so from us. Diet Doctor privacy policy Diet Doctor Sweden AB stores and uses personal information provided by you when you visit our website, dietdoctor.com (regardless of where you visit it from), and interact with our services either as a visitor or member. Diet Doctor respects your privacy and is committed to protecting your personal data. This privacy policy will inform you as to how we look after your personal data and tell you about your privacy rights and how the law protects you. We will never sell your information and will only share it with trusted third parties in order to continuously improve our service to you in accordance with this privacy policy. This privacy policy is provided in a layered format so you can click through to the specific areas set out below. Alternatively, you can download a pdf version of the policy here. Please also use the glossary to understand the meaning of some of the terms used. Important information and who we areThe data we collect about youHow is your personal data collected?How we use your personal dataDisclosures of your personal dataInternational transfersData securityData retentionYour legal rightsGlossary Important information & who we are Purpose of this privacy policy This privacy policy aims to give you information on how Diet Doctor Sweden AB collects and processes your personal data through your use of this website dietdoctor.com including any data you may provide through this website when you sign up for our service or sign up for our newsletter, take a survey and/or interact on our social media sites including but not limited to Instagram or Facebook. This website is not intended for children and we do not knowingly collect data relating to children. It is important that you read this privacy policy together with any other privacy policy or fair processing policy we may provide on specific occasions when we are collecting or processing personal data about you so that you are fully aware of how and why we are using your data. This privacy policy supplements other notices and privacy policies and is not intended to override them. Controller Diet Doctor Sweden AB is the controller and responsible for your personal data. We have appointed a data protection officer (DPO) who is responsible for overseeing questions in relation to this privacy policy. If you have any questions about this privacy policy or our privacy practices, including any requests to exercise your legal rights, please contact the DPO using the details set out below. Contact details Full name of legal entity: Diet Doctor Sweden AB Email address: privacy@dietdoctor.com Postal address: Fleminggatan 7, 112 26 Stockholm, Sweden Complaints You have the right to make a complaint at any time to the Swedish Data Protection Authority (SDPO), Sweden’s supervisory authority for data protection issues (www.datainspektionen.se) We would, however, appreciate the chance to deal with your concerns before you approach the SDPO so would be appreciative if you would please contact us in the first instance. Changes to the privacy policy and your duty to inform us of changes We keep our privacy policy under regular review. This version was last updated on Oct [16], 2020. Historic versions can be obtained by contacting us at privacy@dietdoctor.com. It is important that the personal data we hold about you is accurate and current. Please keep us informed if your personal data changes during your relationship with us. Third-party links This website may include links to third-party websites, plug-ins, and applications. Clicking on those links or enabling those connections may allow third parties to collect or share data about you. We do not control these third-party websites and are not responsible for their privacy statements. When you leave our website, we encourage you to read the privacy policy of every website you visit. The data we collect about you Personal data, or personal information, means any information about an individual from which that person can be identified. It does not include data where the identity has been removed (anonymous data). We may collect, use, store, and transfer different kinds of personal data about you, which we have grouped together as follows: Identity data includes first name, last name, gender, and country of residence. Contact data includes the billing address and email address. Financial data includes billing address, email address, and payment card details (although we do not store this information as processed directly by our third-party payment provider). Technical data includes internet protocol (IP) address, your login data, browser type and version, operating system and platform, and other technology on the devices you use to access this website, and may also include time zone setting and location, browser plug-in types and versions. Profile data includes your username, password, and other membership information such as the date you first became a paying member, date when membership status was updated, your interests, preferences, feedback, and survey responses. Usage data includes information about how you use our website and services. Marketing and communications data includes your preferences in receiving marketing from us. Health data includes your height, age, weight, health conditions (such as diabetes, high blood pressure, or other metabolic issues), body metrics such as your waist circumference, blood pressure/sugar levels and any specific dietary requirements. Special categories of personal data Other than the limited health data that you voluntarily provide to us in order to customize meal plans, we do not specifically collect any other special categories of personal data about you (this includes details about your race or ethnicity, religious or philosophical beliefs, sex life, sexual orientation, political opinions, trade union membership, and genetic and biometric data). Nor do we collect any information about criminal convictions and offenses. The only exception to the above would arise in relation to information that you share on our social media platforms when you choose to share content with us, message, or communicate with us and others via those platforms. When you volunteer such information to Diet Doctor, via our site or social media platforms in order to comment on posts and articles, rate a recipe or video, ask or answer a question, mark content as favorite or to watch later, or in other such ways, the content submitted is still processed and stored by us. If you are logged in as a member, it may also be linked to your account. Furthermore, it may in some cases include your internet address, which is also potentially personally-identifying. Please be careful with any personal or sensitive health information you submit or share on our social media platforms. Comments, success stories, and similar content can be visible to anyone visiting the site anywhere in the world! We do not filter user-submitted content for personal information or sensitive health information, and by submitting it you are giving permission to publish the content, process, and store it as needed for that purpose. This information may also be transmitted, processed, and stored by third-party service providers to detect spam and to ensure that the service works as intended. Please read through the social media platform’s own privacy policies to learn more about how you can control who can see the things you share. If you do share sensitive health information about yourself on such platforms, it is understood that you have consented to do this but you are able to change your mind at any time by deleting any comments or photographs yourself. Please do let us know though if you have any difficulty here and need our help by using any of the contact details above. We also collect, use, and share aggregated data such as statistical or demographic data for any purpose. Aggregated data could be derived from your personal data but is not considered personal data in law as this data will not directly or indirectly reveal your identity. For example, we may aggregate your usage data to calculate the percentage of users accessing a specific website feature. However, if we combine or connect aggregated data with your personal data so that it can directly or indirectly identify you, we will treat the combined data as personal data, which will only be processed in accordance with this privacy policy. If you fail to provide personal data Where we need to collect personal data by law, or under the membership terms of a contract we have with you, and you fail to provide that data when requested, we may not be able to perform the membership contract we have or are trying to enter into with you (for example, to provide you with our additional services). In this case, we may have to cancel your membership, but we will notify you if this is the case at the time. How is your personal data collected? We use different methods to collect data from and about you including through: Direct interactions. You may give us your identity data, contact data, and health data by filling out forms or surveys on dietdoctor.com, our social media platforms, or by corresponding with us by post, phone, email, or otherwise. This includes personal data you provide when you: apply for membership; request marketing to be sent to you; enter a competition, promotion or fill out an in house survey; or give us feedback or contact us in any manner. Automated technologies or interactions. As you interact with the dietdoctor.com website, we will automatically collect Technical Data about your equipment, browsing actions, and patterns. We collect this personal data by using cookies, server logs, and other similar technologies. Please see our cookie policy for further details. Third parties or publicly available sources. We also receive Technical Data about you from various third parties, including but not limited to the following: cloud infrastructure providers such as Amazon Web Services, Google which are based outside of the EEA; analytics providers such as Google, Firebase, Apple, Fivetran which are based outside the EEA; survey providers such as SurveyMonkey, which are based outside the EEA; search engine information providers such as Google, which are based outside the EEA; email providers such as Mailchimp and Mandrill, which are based outside the EEA; and technical support services such as Zendesk and Userback, which are based outside of the EEA. We may also receive contact data and financial data from providers of technical, payment, and delivery services such as Braintree based inside the EEA and Stripe based outside the EEA. How & why we use your personal data We will only use your personal data when the law allows us to. Most commonly, we will use your personal data for the following reasons: Where we need to perform the membership contract, we are about to enter into or have entered into with you. Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests. Where we need to comply with a legal obligation. Note that we may process your personal data for more than one lawful ground depending on the specific purpose for which we are using your data. Please contact us if you need details about the specific legal ground we are relying on to process your personal data where more than one ground has been set out in the table below. Our marketing practices We strive to provide you with choices regarding certain personal data uses, particularly around marketing and advertising. We have established the following personal data control mechanisms: Promotional offers from us We may use your identity, contact, technical, usage, profile and marketing, and communications data to form a view on what we think you may want or need or what may be of interest to you. This is how we decide which services and offers may be relevant for you (we call this marketing). You will receive marketing communications from us if you have requested information from us or purchase'
