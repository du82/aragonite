or IF, means choosing to voluntarily go without eating for a planned period of time. This guide focuses on shorter-term fasts. Learn more Getting started: To begin, simply delay the time you eat breakfast. For example, if you usually eat breakfast at 7am, wait until 9 am. Then stretch it longer. Learn more Who shouldn’t fast? Some individuals should avoid fasting or only fast under direct physician supervision. See our list. Learn more Your complete guide to intermittent fasting Evidence based By Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" />, medical review by Dr. Michael Tamber, MD<img width="25" height="25" class="size-author-thumbnail wp-image-4799557" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/10/michael-tamber.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Michael Tamber, MD" /> Evidence basedThis guide is based on scientific evidence, following our policy for evidence-based guides. Click for more info. FacebookTweetPinLinkedIn Getting startedBenefitsHow to succeedPrecautionsFAQSummary Intermittent fasting has become one of the most popular and possibly easiest means for weight loss and better health. For some, fasting may sound scary and uncomfortable, but it doesn’t have to be. In this guide, you’ll learn all you need to know to get started with a successful intermittent fasting routine. .kd-sidebar-box{position:absolute;right:0;width:300px;overflow-x:hidden;margin-right:8px}.kd-box{position:relative;color:#404040;border:1px solid #2a2a2a;margin:1rem 0;padding:15px 15px 15px 50px;background-repeat:no-repeat;background-position:8px center}@media(min-width: 900px){.kd-box{padding:30px 50px 30px 100px}}.kd-box:before{font-family:FontAwesome;font-size:1.8rem;line-height:1em;position:absolute;left:1