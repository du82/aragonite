["https://dietdoctor.com/about"]
title = "About Diet Doctor – Our Purpose, Mission and Values"
description = "Regaining health in an unhealthy world requires thinking and acting differently. It requires trusting not in corporate propaganda or old misinformation, but in nature. In the power of your own body to return to its natural state, given the right environment and lifestyle."
full_description = 'About Diet Doctor By Dr. Andreas Eenfeldt, MD<img width="25" height="25" class="size-author-thumbnail wp-image-3475942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/10/DD_Andreas.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Andreas Eenfeldt, MD" /> We’re hiring! Regaining your health in an unhealthy world requires thinking and acting differently. It requires putting your trust not in industry ads or dogma, but in science and nature. It means trusting in the surprising power of your own body to return to health, given the right environment and evidence-based lifestyle changes. Our mission is to find the most trustworthy science and practical knowledge about health, make it inspiring and simple to use, and make it accessible and free for everyone. We’re focusing on making low carb simple for people who could benefit, and who want to try it..footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 Our long-term purpose is to empower people everywhere to dramatically improve their health. There’s a great need for this. While plenty of free information is available online, most of it is hard to trust. Websites are often trying to sell a specific product or a pill, or push an agenda for the people funding it. But real long-term health can’t easily be found in a pill. And nobody can outrun a bad diet. We aim to provide unbiased and evidence-based information, as well as free and inspiring tools to help improve your health. We’re primarily funded by our users via an optional membership.2 We show no ads, sell no products, and take no industry money. Welcome to Diet Doctor, the largest low-carb site in the world. We make low carb simple. Quick facts Purpose: Empowering people everywhere to dramatically improve their health. Mission: Making low carb and keto simple. Values: Trustworthiness, simplicity, inspiration, and goodness. The largest low-carb site in the world: Around 500,000 visits per day. Available in English, Spanish and Swedish (media mentions). Trustworthiness: Our guides are written and reviewed by medical doctors and experts, based on scientific evidence and trusted by practicing physicians.3 To stay unbiased we show no ads, we sell no products and we take no money from industry. Our website does not host any form of advertisements.4 Founded by: Dr. Andreas Eenfeldt, MD, in 2011, after Swedish beginnings in 2007. Read our story here. Fast-growing: Today our team includes over 20+ full-time co-workers, and partners. Do you want to join us? Visit our careers page. Contact info: Find our e-mails and other info on our contact page. Diet Doctor is also available on Twitter, Facebook, YouTube, Instagram, Pinterest and LinkedIn. Headquarters: Stockholm, Sweden (on Fleminggatan 7). Legal company name: Diet Doctor Sweden AB. Policy documents: Editorial / Grading scientific evidence / Evidence-based guides / Food / Comments / Privacy. Intended audience: Diet Doctor provides health information to adults in the general population. Note that this is not intended to replace consultation with a qualified medical professional. Full disclosure Free: Membership is optional. A broken world Something is wrong. While technological evolution and innovation speeds up exponentially, the world is plagued by human suffering. More and more people – the majority in the Western world – are obese or overweight, and a high percentage of them are on prescription drugs every day for the rest of their lives. <img class="aligncenter size-full wp-image-2828316 lazy" alt="Obesity in the USA 1984-2017" loading="lazy" width="800" height="536" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=800&amp;h=537&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=150&amp;h=101&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=200&amp;h=134&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=267&amp;h=179&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=400&amp;h=268&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=800&amp;h=537&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=1074&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-full wp-image-2828316 lazy" alt="Obesity in the USA 1984-2017" loading="lazy" width="800" height="536" sizes="(max-width: 769px) 100vw, 800px" data-src="https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=800&amp;h=537&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=150&amp;h=101&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=200&amp;h=134&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=267&amp;h=179&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=400&amp;h=268&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=600&amp;h=403&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=800&amp;h=537&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=1000&amp;h=671&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=805&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=1074&amp;fit=crop 1600w" /><noscript><img class="aligncenter size-full wp-image-2828316" src="https://i.dietdoctor.com/wp-content/uploads/2018/10/obesity_1984-2017_map.jpg?auto=compress%2Cformat&amp;w=800&amp;h=537&amp;fit=crop" alt="Obesity in the USA 1984-2017" loading="lazy" width="800" height="536" /> Every year more and more people are added to the sad statistics. As we get increasingly richer as a society, our health appears to be declining. Why is this? Many people feel guilt and shame, as if the excess weight, hunger, and tiredness were their own fault, a moral failing. People count their calories and attempt to eat less food and exercise more, but for many it’s not working. If only everyone had more willpower – or is there some other reason? Diabetes type 2 – a new epidemic in the history of humankind – will soon impact 500 million people. The death toll is already enormous, as is the number of people suffering the other consequences: blindness, dementia, heart disease, cancer. Type 2 diabetes is considered progressive and chronic, and the current treatment consists of daily drugs to reduce the symptoms. There is no cure, experts say. Obesity – another new epidemic affecting a large part of the population – is considered almost as incurable. The only effective treatment is said to be bariatric surgery, i.e. surgically removing parts of healthy organs. This operation carries a significant risk of life-long complications and sometimes even death. And a year after surgery, the excess weight usually starts returning. Epidemics of obesity and diabetes are just the tip of the iceberg. As these problems spread across the world, other diseases follow closely behind: heart disease, cancer, eating disorders and food addiction, high blood pressure… and the list could go on. Experts still suggest eating less and exercising more to slow down the epidemics, and they have been advising this for 30 years as the problems have exploded. These recommendations are clearly not enough. It may be even worse. The problem really started in the early 80s, just when we were told to eat “healthily”, just when the first Dietary Guidelines for Americans were released, and then copied around the world. That’s when the epidemic started. Overweight people in the US* <img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><noscript><img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><noscript><img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><img class="aligncenter size-full wp-image-2834240 lazy" alt="Overweight graph" loading="lazy" data-src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" /><noscript><img class="aligncenter size-full wp-image-2834240" src="https://www.dietdoctor.com/wp-content/uploads/2018/10/overweight_graph_simplified.svg" alt="Overweight graph" loading="lazy" /> * Overweight and obese over BMI 25+, aged 15-74. Source: OECD What’s holding us back? Our bodies are made to stay healthy throughout our lives and supply us with the energy to reach our goals and our full potential. We should be able to return to this natural state with the resources the world has today. Imagine a world where everyone can feel good in their bodies again. Where children can run and play without having to stop and catch their breath every few steps. Where most people have no need for chronic medications, a nation no longer on drugs, where nobody is obsessively counting calories just to maintain their weight. Where health is normal again. Where we can reach our potential and care for each other. Where we use our willpower for higher purposes, together shaping a better world for our children. Much of what we need to get there is already known. But it’s not that simple. The food industry profits from selling cheap, highly processed, nutritionally depleted and addictive food. And people are often advised to eat at least every three hours. The pharmaceutical industry profits by selling daily medications to reduce the symptoms of all the chronic diseases caused by highly processed food. <img class="aligncenter size-full wp-image-23372 lazy" alt="Junk-to-Drugs" loading="lazy" width="800" height="303" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=800&amp;h=303&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=150&amp;h=57&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=200&amp;h=76&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=267&amp;h=101&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=400&amp;h=152&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=800&amp;h=303&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=1233&amp;h=467&amp;fit=crop 1233w" /><noscript><img class="aligncenter size-full wp-image-23372 lazy" alt="Junk-to-Drugs" loading="lazy" width="800" height="303" sizes="(max-width: 769px) 100vw, 800px" data-src="https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=800&amp;h=303&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=150&amp;h=57&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=200&amp;h=76&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=267&amp;h=101&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=400&amp;h=152&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=600&amp;h=227&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=800&amp;h=303&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=1000&amp;h=379&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=455&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=1233&amp;h=467&amp;fit=crop 1233w" /><noscript><img class="aligncenter size-full wp-image-23372" src="https://i.dietdoctor.com/wp-content/uploads/2011/03/junk-to-drugs.jpg?auto=compress%2Cformat&amp;w=800&amp;h=303&amp;fit=crop" alt="Junk-to-Drugs" loading="lazy" width="800" height="303" /> These are trillion-dollar industries. There’s a lot of money to be made on people who are kept sick. The facts are obscured by corporate propaganda. Companies sell highly processed food and pills while using misinformation for the benefit of their shareholders but to the detriment of humanity. It’s obscured by government limitations, allowing corporations to influence policy via armies of lobbyists, while relying on experts who are often stuck in failed p'
