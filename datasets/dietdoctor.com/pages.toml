full_description = 'FREE continuing medical education course on low carb April 10 2020 by Adele Hite, PhD, MPH, RDN<img width="25" height="25" class="size-author-thumbnail wp-image-2303973" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/06/HiteAdele.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Adele Hite, PhD, MPH, RDN" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" /> in About Diet Doctor, Diabetes, For doctors, Low carb & high fat, Metabolic syndrome, Weight loss <img class="alignleft size-full wp-image-4906040 lazy" alt="CME_16x9_light_color" width="800" height="450" loading="lazy" sizes="(max-width: 769px) 100vw, (min-width: 1200px) 800px, calc(100vw - 300px)" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=800&amp;h=450&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=150&amp;h=84&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=200&amp;h=113&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=267&amp;h=150&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=400&amp;h=225&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=800&amp;h=450&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=900&amp;fit=crop 1600w" /><noscript><img class="alignleft size-full wp-image-4906040 lazy" alt="CME_16x9_light_color" width="800" height="450" loading="lazy" sizes="(max-width: 769px) 100vw, 800px" data-src="https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=800&amp;h=450&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=150&amp;h=84&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=200&amp;h=113&amp;fit=crop 200w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=267&amp;h=150&amp;fit=crop 267w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=400&amp;h=225&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=600&amp;h=338&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=800&amp;h=450&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=1000&amp;h=563&amp;fit=crop 1000w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop 1200w,https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=1600&amp;h=900&amp;fit=crop 1600w" /><noscript><img class="alignleft size-full wp-image-4906040" src="https://i.dietdoctor.com/wp-content/uploads/2020/04/CME_16x9_light_color.jpg?auto=compress%2Cformat&amp;w=800&amp;h=450&amp;fit=crop" alt="CME_16x9_light_color" width="800" height="450" loading="lazy" /> Our continuing medical education activity is made for clinicians, but is open to everyone. The best part? It’s free! If you’re interested in learning more about how low-carb diets can improve obesity, type 2 diabetes, and metabolic syndrome, please view the course. Diet Doctor recently launched its first continuing medical education activity, Treating metabolic syndrome, type 2 diabetes, and obesity with therapeutic carbohydrate restriction. It provides clinicians with information and tools to safely and effectively use low-carb and keto diets with patients. Currently, over 700 clinicians have taken the course and applied for CME credits. Although only doctors, nurses, dietitians, nurse practitioners, and physician assistants are eligible for continuing education credits, anyone can take the course. The course provides a solid, evidence-based approach to carbohydrate-restricted diets. If you’ve been confused by some of the things you’ve heard about low-carb and keto diets, this course can help sort fact from fiction. As “keto” diets have skyrocketed in popularity, some of the basic ideas about low-carb diets have gotten lost in the hype. Unlike most social media soundbites, the course includes references to scientific articles to support the information provided. For example, a low-carb diet does not necessarily have to include a lot of fat. Fat should be included for flavor and fullness, but limiting carbs is the first and most important step to improving health with low carb or keto. You don’t need to have Diet Doctor Plus to view the course. All you need to do is register at dietdoctor.com/cme, scroll to the bottom of the page for the access button, and follow the rest of the steps to get to the course. You can help us promote the course by printing this one-page flyer to post wherever doctors, nurses, or dietitians might see it. You can also email the flyer to friends, families, and your own doctor, or you can share the link on social media. .family-mp-cta{background:rgba(14,52,120,.1)}.vegetarian-mp-cta{background:#f8efe7}.budget-mp-cta{background:linear-gradient(180deg, rgba(245, 238, 232, 0.3) 0%, #f4ede6 100%)}.quick-mp-cta{background:#f1f5ec}.generic-cta{backgr