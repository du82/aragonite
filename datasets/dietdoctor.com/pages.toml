["https://dietdoctor.com/food-policy"]
title = "Food Policy - What Our Keto Recipes Are Made of and Why - Diet Doctor"
description = "Here you can read our thoughts on different types of food and why we use or don't use them in our low-carb and keto recipes."
full_description = 'The Diet Doctor food policy By Franziska Spritzler, RD, CDE<img width="25" height="25" class="size-author-thumbnail wp-image-5588615" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2022/01/Franziska-Round-2021.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Franziska Spritzler, RD, CDE" />, medical review by Dr. Bret Scher, MD<img width="25" height="25" class="size-author-thumbnail wp-image-2705167" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/09/bret-scher-2.jpg?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Dr. Bret Scher, MD" /> Evidence basedThis guide is based on scientific evidence, following our policy for evidence-based guides. Click for more info. /* <![CDATA[ */ckdc.ready((function(e){e("#ckdc-evidence-based-content").hide(),ckdc.body.on("click",".evidence-based-anchor",(function(c){const p=e("#ckdc-evidence-based-content");if(0===p.length)return;const n=`<div class="wppopup-wrapper"><div class="pop-inside">${p.html()}</div></div>`;ckdc.simplebox.open(n,{wrapperClasses:"wppopup-prompt",closeClasses:"wppopup-prompt-cancel"}),c.preventDefault()}))})); //# sourceMappingURL=evidence-based.min.js.map /* ]]&gt; */ Which foods should be part of a healthy low carb or keto diet? Sometimes, it may seem confusing to know what to eat — and what to avoid. In this food policy, we explain our position on nutritional matters and what foods you can expect from our low carb and keto recipes. Our goal, to empower people everywhere to revolutionize their health, reflects our belief that everyone is unique and may have different needs at different times. We hope you will find this policy helpful when you embark on your journey of finding out what foods work best for you. .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ Different levels of low carbCarbohydrates (carbs)ProteinFatHigher-carb ingredientsFruits and berriesSweetenersSugarGlutenGluten-free grainsDairy productsNuts and seedsMeatLegumesSoyChocolateHigh-oxalate foods Different levels of low carb.footnotes{display:none}.footnote-sup{display:none}sup.footnote-link{width:1rem;margin-right:.3rem;margin-left:.2rem;display:inline-block} /*# sourceMappingURL=footnotes.min.css.map */ 1 Here’s how we define different levels of low carb at Diet Doctor: Ketogenic low carb <20 grams net carbs per day.2This level of carbohydrates is defined as below 5 energy percent (E%) carbs in our recipes or, if it is a meal, 7 grams of carbs or less. In our ketogenic recipes the amount of carbs per serving is shown in a green ball. Moderate low carb 20-50 net grams per day. This level is defined as between 5-10 E% carbs in our recipes and the amount of carbs per serving is shown in a yellow ball. Liberal low carb 50-100 net grams per day. This means 10-20 E% carbs in our recipes and the amount of carbs per serving is shown in an orange ball. <img class="alignright two-column last-column size-full wp-image-426624" style="padding-left: 15px;" src="https://i.dietdoctor.com/wp-content/uploads/2016/03/LC-BG-veggies-16-9-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Low-Carb Vegetables" width="1000" height="666" loading="lazy" /> Carbohydrates (carbs) We aim to provide recipes with 0–20 percent of the total energy coming from carbs, mainly from unprocessed whole food sources (e.g. vegetables). Carbs are not essential to the human body, but if they come from unprocessed food they can contribute nutrients and fiber.34 They can also add variety to your diet and texture and color to your plate. We show net carbs (total carbs minus dietary fiber) because in most people, fiber doesn’t cause a rise in blood glucose or insulin.5 Visual guide: Low-carb vegetables – the best and worst Protein We recommend meat, poultry, fish, seafood, eggs and/or dairy as the best sources of protein, preferably as unprocessed as possible.6 Protein is essential to the human body. Some people fear that amino acids from protein foods can be converted to glucose, thereby raising insulin levels. Although this occurs under experimental conditions, only a small percentage of amino acids are actually converted to glucose.7 People with type 2 diabetes usually do well with the adequate levels of protein Diet Doctor recommends, if their diets are also low carb.8 We recommend prioritizing your protein intake and focusing on foods that provide high nutrition at a lower calorie intake. At Diet Doctor, we define adequate protein as 1.2 to 2.0 grams per kilo of reference body weight per day, or 15 to 35% of calories. This is the higher end of the US Institutes of Medicine definition, which sets 10% to 35% of calories as the acceptable range for protein intake.9 We believe most people would benefit by increasing their protein intake to 1.6 to 2.0 grams per kilo per day, or 25 to 35% of daily calories. Use this simple chart to find out what your minimum daily protein target should be, based on your height.10 Minimum daily protein target .wp-block-table{overflow-x:auto}.dd-table-sort,.wp-block-table table{width:100%}.dd-table-sort tr:nth-child(even),.wp-block-table table tr:nth-child(even){background-color:#f2f2f2}.dd-table-sort tr:hover,.wp-block-table table tr:hover{background-color:silver}.dd-table-sort thead th.has-text-align-center,.wp-block-table table thead th.has-text-align-center{text-align:center !important}.dd-table-sort thead th.has-text-align-left,.wp-block-table table thead th.has-text-align-left{text-align:left !important}.dd-table-sort thead th.has-text-align-right,.wp-block-table table thead th.has-text-align-right{text-align:right !important}.dd-table-sort thead th.desc::after,.wp-block-table table thead th.desc::after{font-family:FontAwesome;content:"";display:inline-block;padding-left:5px;vertical-align:middle}.dd-table-sort thead th.asc::after,.wp-block-table table thead th.asc::after{font-family:FontAwesome;content:"";display:inline-block;padding-left:5px;vertical-align:middle}.dd-table-sort thead th::after,.wp-block-table table thead th::after{display:inline-block;padding:0 .25rem}.dd-table-sort th,.wp-block-table table th{padding:8px;text-align:left;background-color:#0e3478;color:#fff}.dd-table-sort td,.wp-block-table table td{padding:8px}.wp-block-table.is-style-dd-table-green-light table th{background-color:#f6fdea;color:#404040}.wp-block-table.is-style-dd-table-pink table th{background-color:#e73568}.wp-block-table.dd-table-sortable table th{cursor:pointer} /*# sourceMappingURL=table-sortable.min.css.map */ /* <![CDATA[ */ckdc.ready((function(t){"undefined"!=typeof ckdc&&ckdc.setup.addSetupContent("table-sortable",(function(e){var d=e.find("table.dd-table-sort[id], .dd-table-sortable table");d.length>0&&d.each((function(){t(this).tableSortable()}))}))})); //# sourceMappingURL=table-sortable-app.min.js.map /* ]]&gt; */HeightWomenMenUnder 5’4″ ( < 163 cm) 90 grams 105 grams5’4″ to 5’7″ (163 to 170 cm) 100 grams 110 grams5’8″ to 5’10” (171 to 178 cm) 110 grams 120 grams5’11” to 6’2″ (179 to 188 cm) 120 grams 130 gramsOver 6’2″ (188 cm +) 130 grams 140 grams As the chart indicates, you should try to get around 100 grams if you’re a woman and 120 grams if you’re a man of average height and build. Eat more if you’re a man taller than 6 feet (183 cm) or a woman taller than 5’6″ (168 cm) or if you’re very physically active. Eat less if you’re shorter or have a very small frame. Our complete guide provides much more information about the best high-protein foods to choose for weight loss. Learn more about our policy on protein Check out our guide about protein Our high protein recipes If a meal (lunch, dinner, or main course) has more than 25 energy percent (E%) protein and includes at least 30 grams (25 grams for breakfasts), we consider it a high protein meal. For the rest of our recipes, such as desserts and bread, they need to have at least 25 E% protein per serving to be labeled as high protein. These recipes are marked with a blue outline around the colored carb circle so you can easily spot them. Learn more about why a higher protein diet could be beneficial for you in our practical guide. All our high-protein recipes > <img class="alignright two-column last-column size-full wp-image-426624" style="padding-left: 15px;" src="https://i.dietdoctor.com/wp-content/uploads/2019/03/LC-Fats-Sauces-16-9-fats-only2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Low-Carb Fats &amp; Sauces" width="1000" height="666" loading="lazy" /> Fat Some dietary fat is essential to the human body.11 We primarily recommend fat that’s part of natural foods such as fatty cuts of meat, eggs, and avocados over added oils and butter.12 Minimally processed added fats — such as butter, olive oil, and coconut oil — can be used in amounts needed to add flavor to your meals, and the extra calories may also help with satiety.13 However, they should still be seen as a modest part of one’s diet and not the main component due to their relative lack of protein and other essential nutrients. Vegetable and seed oils (except olive or coconut oil) are often highly processed and high in omega-6 fats and, therefore, are not something we recommend. Examples of these non-recommended vegetable and seed oils are soybean oil, corn oil, and sunflower oil. In large quantities, omega-6 fats might potentially increase inflammation.14 These fats may also be less tolerant to heating, potentially forming harmful substances when used for frying.15 Processed fats such as margarine are not used on our site. Visual guide: Low-carb fats and sauces – the best and worst Learn more about fat Vegetable oils: What we know and what we don’t Higher-carb ingredients We see whole foods high in carbs, like potatoes and rice, as something that can be a part of a healthy diet in small to moderate amounts, for some people (especially if they are insulin sensitive). However, such foods are high in carbs, reduce the effects of a low carb diet, and can be a problem for people who are more insulin-resistant.16 Therefore, we have chosen to not include potatoes and rice in our meal plans or recipes. Certain seeds, like buckwheat and quinoa, are not something we recommend eating large amounts of, but are theoretically allowed in quantities that keep the recipes within our set limits for carbs. As a general rule, we don’t use them in our keto recipes. <img class="alignright two-column last-column size-full wp-image-426624" style="padding-left: 15px;" src="https://i.dietdoctor.com/wp-content/uploads/2016/03/Low-Carb-Fruits-16-9.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Low-Carb Fruits" width="1000" height="666" loading="lazy" /> Fruits and berries We see fruits and berries as nature’s candy and something that can be a part of a healthy diet, in small to moderate amounts, for many people.17 However, fruit contains a large proportion of calories from sugar. Thus, people with insulin resistance or type 2 diabetes may want to limit their fruit intake to low-sugar, high-fiber sources such as raspberries.18 We aim to clearly mark recipes with a significant amount of sugar in them as moderate or liberal. This is to make it simple for people sensitive to sugar, such as people with diabetes, to take that into consideration.19 As a general rule, we avoid fruit in our keto recipes. Berries are usually a lower-carb option and are used in recipes as long as they stay within our set limits for carbs. Additionally, although we occasionally use very small amounts of citrus juice in some of our recipes, we ensure that they fall within our established carb limits. Avocados and olives are technically fatty fruits, although they are often grouped with vegetables. Because they contain very few net carbs, they are included in many of our keto recipes. Visual guide: Low-carb fruits and berries – the best and worst <img class="alignright two-column last-column size-full wp-image-426624" style="padding-left: 15px;" src="https://i.dietdoctor.com/wp-content/uploads/2018/02/LC-Sweeteners2-16-9-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Low-carb sweeteners" width="1000" height="666" loading="lazy" /> Sweeteners We recommend minimizing the use of non-caloric sweeteners due to the potential for maintaining a preference for sweet tastes or stimulating over-consumption.20 Some people can also experience gastrointestinal problems when consuming them.21 Certain sweeteners that we deem potentially less harmful, such as erythritol and stevia, may be used mainly in our dessert and smoothie recipes.22 Visual guide: Low-carb sweeteners – the best and worst Sugar As a rule, we don’t use white sugar, brown sugar, honey, agave, or other sugars in our recipes because they don’t provide anything necessary for a healthy diet. However, we do use a small amount of sugar (no more than 1 teaspoon for an entire recipe) in a few of our bread recipes in order to activate the yeast. Sugar raises blood glucose which causes insulin release, and it also has other potentially negative effects (see guide below).23 Learn more about sugar and its effects on your health Gluten In most of our recipes, we don’t use ingredients known to contain gluten because it can cause problems for people sensitive to it, even in small amounts.24 There is an exception for recipes that contain seitan (vital wheat gluten), a plant-based protein source. Any recipes with gluten will be clearly labeled as “This recipe contains gluten.” We can’t guarantee that some ingredients used in our recipes (ground psyllium husk, oat fiber, and protein powder, etc.) haven’t been contaminated in production.25 However, we acknowledge that those who are not sensitive to gluten may be able to add it sparingly in low-carb diets. Learn more about gluten and wheat Gluten-free grains Gluten-free grains, such as oats, are not something we recommend eating a lot of due to their high carb content.26 We do think that in small to moderate amounts, they can be part of a healthy diet for insulin-sensitive people. That’s why small amounts of gluten-free grains are allowed in our moderate and liberal low-carb recipes as long as they stay within our set limits for carbs. As a general rule, we don’t use them in our keto recipes. However, some of our keto and low-carb recipes do contain oat fiber, which does not raise blood sugar and insulin levels because it is not digested and absorbed by your body.27 Dairy products We use full-fat and low-fat dairy products such as butter, heavy whipping cream, yogurt, and cheese in our recipes unless they are m'
