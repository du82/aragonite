title = "16:8 intermittent fasting – free diet plan – Diet Doctor"
description = "Want faster results? Try our delicious intermittent fasting and keto meal plan: simple lunch and dinner within eight hours."
full_description = '.rcorners3 { border-radius: 12px; } Best ways to follow an intermittent fasting diet plan By Franziska Spritzler, RD, CDE<img width="25" height="25" class="size-author-thumbnail wp-image-5588615" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2022/01/Franziska-Round-2021.png?auto=compress%2Cformat&amp;w=150&amp;h=150&amp;fit=crop" alt="Franziska Spritzler, RD, CDE" /> .toc-wrapper ol.toc{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 0 -0.5rem}.toc-wrapper ol.toc.light a{color:#fff}.toc-wrapper ol.toc.light a:hover{color:#e1c058}.toc-wrapper ol.toc li{list-style:none;font-weight:bolder;line-height:1.2rem;white-space:nowrap;padding:0;margin:.3rem 0}.toc-wrapper ol.toc li a{padding:0 .5rem}.toc-wrapper ol.toc li:not(:last-child){border-right:.1em solid #979797} /*# sourceMappingURL=toc.min.css.map */ What can I eat? Example of a meal planBest beverages7-day intermittent fasting meal plan Do you prefer to skip breakfast? Then you’ll love our 16:8 intermittent fasting diet plan; you’ll eat lunch and dinner within an eight-hour window and fast the rest of the day. This keto meal plan features delicious, nutrient-dense dishes that provide less than 20 grams of net carbs per day. <img alt="7-day free intermittent fasting meal plan" width="600" height="420" class="rcorners3 lazy" loading="lazy" sizes="(max-width: 900px) 100vw, (min-width: 1200px) 600px, 50vw" data-src="https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=600&amp;h=400&amp;fit=crop" data-srcset="https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=150&amp;h=100&amp;fit=crop 150w,https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=300&amp;h=200&amp;fit=crop 300w,https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=400&amp;h=267&amp;fit=crop 400w,https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=600&amp;h=400&amp;fit=crop 600w,https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=800&amp;h=533&amp;fit=crop 800w,https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=800&amp;fit=crop 1200w" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=600&amp;h=400&amp;fit=crop" alt="7-day free intermittent fasting meal plan" width="600" height="420" class="rcorners3" loading="lazy" /> DD+ MEMBERSHIP <img alt="DDplus_icon_Black-Gold-small" width="50" class="lazy" loading="lazy" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" /><img alt="DDplus_icon_Black-Gold-small" width="50" class=" lazy" loading="lazy" data-src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" /><noscript><img src="https://i.dietdoctor.com/wp-content/uploads/2019/04/DDplus_icon_Black-Gold-small.svg?auto=compress%2Cformat" alt="DDplus_icon_Black-Gold-small" width="50" class="" loading="lazy" /> Premium 16:8 intermittent fasting meal plan When you become a Diet Doctor Plus member, you get access to this premium intermittent fasting meal plan, along with many others. Just press play and get started with simple recipes and shopping lists. You can also customize your own by answering a few questions. Take the 1-minute quiz Keto: Enjoy losing weight (16:8) #1If you want to lose weight while still enjoying amazing food, we’ve got the perfect meal plan for you. To help turn you into a fat-burning machine, we’ve decided to employ intermittent fasting (16:8) in this week’s meal plan. This means your first meal will be at lunch — but feel free to drink coffee, tea, and of course, water throughout the day. This mouth-watering ketogenic menu will keep you way below 20 grams of carbs per day. It includes some popular budget-friendly meals, such as our No-bean keto chili and Crispy tuna burgers, plus a few more elevated meals like our Ribeye steak with loaded cauliflower mash. Remember, you can always swap pricey ingredients such as ribeye with cheaper protein options such as chicken thighs or pork chops. Just make sure to adjust the cooking time as needed. By skipping breakfast, you’ll automatically save money that you could potentially spend on higher-quality ingredients such as grass-fed beef and organic eggs — a good investment for your body, the animals, and the environment. Full meal plan → <img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5107828" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/Keto-chicken-burger-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto chicken burger with jalapeño aioli" title="" />Mon<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5056836" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/09/Turkey-schnitzel-green-bean-fries-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto turkey schnitzel with green bean fries and dijon mayo" title="" />Tue<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5107856" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/Keto-avocado-Keto-Alfredo-sauce-with-zoodles-and-chicken-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Keto avocado Alfredo sauce with zoodles and chicken" title="" />Wed<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5093494" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/Easy-Keto-Chili-Bowl-v1-.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="No-bean keto chili" title="" />Thu<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5080941" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/11/Italian-turkey-meatballs-with-zoodles-v-2-scaled.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Italian keto turkey meatballs with zoodles" title="" />Fri<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-5107840" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/12/Ribeye-steak-with-loaded-cauliflower-mash-bake-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Ribeye steak with loaded cauliflower mash" title="" />Sat<img width="150" height="225" class="main-image size-sidebar-size-half-vt wp-image-4956942" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/05/keto-crispy-tuna-burgers-v.jpg?auto=compress%2Cformat&amp;w=150&amp;h=225&amp;fit=crop" alt="Crispy keto tuna burgers" title="" />Sun Every meal plan is created and tested by our Diet Doctor Recipe Team and verified by our in-house dietitian, ensuring that you can enjoy delicious food with the right balance of macronutrients you need each day. Start free trial Already a member? Log in here <img src="/wp-content/uploads/2021/09/healthy-weight-loss-intermittent-fasting.jpg" alt="" width="400" height="280" class="rcorners3" loading="lazy" /> Guide: Intermittent fasting for healthy weight loss What can I eat on an intermittent fasting meal plan? On an intermittent fasting diet plan, you only eat twice a day. For this reason, it’s important to get plenty of protein, vitamins, and minerals at lunch and dinner to meet your daily needs. At each meal, make sure you include a generous serving of protein: meat, poultry, fish, eggs, dairy, or plant-based protein, like soy. Our intermittent fasting meal plans are designed to provide you with all the nutrition you need, with very low carb counts that fit your keto lifestyle. Disclaimer: If you are taking medications to lower your blood sugar or blood pressure, always check with your healthcare provider before making a significant dietary change. A low-carb, high-protein diet may further lower blood sugar and blood pressure to dangerous levels when combined with medications. If you need to find a clinician familiar with low-carb nutrition, you can start with our find a doctor map. DD+ MEMBERSHIPWant to try intermittent fasting?With our personalized meal plans, we do the planning for you. All you have to focus on is cooking, eating, and enjoying healthy, delicious food.Try it today!Learn more What is a good meal plan for intermittent fasting? 16:8 Most keto and low-carb intermittent fasting meal plans provide two meals per day to be eaten within a compressed eating window, usually eight hours per day. For this reason, they’re called 16:8 intermittent fasting meal plans, meaning you fast for 16 hours and eat within an eight-hour window. OMAD OMAD stands for “one meal a day.” While an OMAD meal plan might provide only one meal a day, it is very difficult to consistently meet nutrition needs when eating one meal daily. That’s why we don’t recommend doing OMAD all the time. If you’d like to incorporate OMAD into your life, we recommend a meal plan that provides three days of OMAD and four days of 16:8 intermittent fasting. FREE TRIALGet your personalized meal plan with a FREE 30-day trial!What is your gender?FemaleMaleOther What can I drink on an intermittent fasting diet plan? The best beverages are carb-free or nearly carb-free. Include these drinks on your intermittent fasting diet plan: Water: still or sparkling Coffee: black, or with a splash of cream or milk Tea: black, green, or herbal (unsweetened) Broth: chicken, beef, or vegetable <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4678270" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2016/07/bone_broth_h.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Slow-cooked bone broth – 3 ways!" title="" />Slow-cooked bone broth – 3 ways! 0.3g <img width="1200" height="675" class="main-image size-site-size-ws wp-image-258568" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2016/06/DD-180.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Flavored water" title="" />Flavored water 0g <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4823812" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2019/12/Electrolyte-elixir-drink-h.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Electrolyte elixir" title="" />Electrolyte elixir 2g <img src="/wp-content/uploads/2021/09/healthy-weight-loss-intermittent-fasting.jpg" alt="" width="400" height="280" class="rcorners3" loading="lazy" /> Guide: Intermittent fasting for healthy weight loss 7-day keto & 16:8 intermittent fasting Here is a full week of delicious keto recipes for lunch, and dinner. You’ll save time planning, preparing, cooking, and cleaning up by making two dinner servings and refrigerating half to enjoy for lunch the next day. Monday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4806442" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2015/03/176A8650.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto coconut curry chicken" title="" />Keto coconut curry chicken 8g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-1218885" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/09/DD-512_PhillyCheesesteakCasserole_.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto cheesesteak casserole" title="" />Keto cheesesteak casserole 9g Tuesday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-1218885" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/09/DD-512_PhillyCheesesteakCasserole_.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto cheesesteak casserole" title="" />Keto cheesesteak casserole 9g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-313815" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2016/08/DD-176.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto lasagna" title="" />Keto lasagna 8g Wednesday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-313815" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2016/08/DD-176.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto lasagna" title="" />Keto lasagna 8g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-2638252" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/08/DD-646-CreamyGarlicMushroomChicken-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto garlic mushroom chicken thighs" title="" />Keto garlic mushroom chicken thighs 6g Thursday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-2638252" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/08/DD-646-CreamyGarlicMushroomChicken-2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto garlic mushroom chicken thighs" title="" />Keto garlic mushroom chicken thighs 6g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-1015627" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/07/DD-462-chili.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto chili and tortillas" title="" />Keto chili and tortillas 8g Friday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-1015627" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2017/07/DD-462-chili.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto chili and tortillas" title="" />Keto chili and tortillas 8g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4882089" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/02/keto-cheeseburger-salad-h.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto cheeseburger salad" title="" />Keto cheeseburger salad 7g Saturday Lunch <img width="1200" height="675" class="main-image size-site-size-ws wp-image-4882089" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2020/02/keto-cheeseburger-salad-h.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto cheeseburger salad" title="" />Keto cheeseburger salad 7g Dinner <img width="1200" height="675" class="main-image size-site-size-ws wp-image-3141608" loading="lazy" src="https://i.dietdoctor.com/wp-content/uploads/2018/12/Keto-pizza-zucchini-boats_JW_5_H.2.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=675&amp;fit=crop" alt="Keto zucchini pizza boats with goat cheese" title="" />Keto '
