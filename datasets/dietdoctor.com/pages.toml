title = "The diabetes program"
description = "Higher-satiety eating can help you lose weight while feeling full and satisfied. We've designed a 3-week intro program to help you get started!"
full_description = 'The Diabetes Program10 weeks to better blood sugar Do you have type 2 diabetes, prediabetes, or insulin resistance? Then we have good news! It’s possible to reverse your type 2 diabetes with proper nutrition. If you’re ready to live a healthier and more delicious life, this tailor-made program is for you! Start your free 30-day trial Important! If you’re on medication for diabetes, always discuss relevant changes in lifestyle and medication and with your doctor. Read more about it here. If you are taking medications to lower your blood sugar or blood pressure, always check with your healthcare provider before making a significant dietary change. A low carb, high protein diet may further lower blood sugar and blood pressure to dangerous levels when combined with medications. Have you already signed up for The Diabetes Program? Click here! .section--banner{ padding: 75px 0; } .page--heading{ color: #155B71; font-weight: 600; font-size: 50px; margin-top: 20px; } .page--button{ background-color: #155B71 !important; border-color: #155B71 !important; }</p> <p> .paragraph--small{ width: 70%; margin: 0 auto; } .sub--heading{ color: #155B71; font-size: 1.7rem; }.heading--secondary{ color: #155B71; line-height: 2rem;font-size: 1.8rem; } .section-title { color: #155B71; font-size: 2.5rem; font-weight: 600; letter-spacing:-1px; } h3, h5{color: #155B71;} .section-title span{ display: block; font-size: 1.5rem; font-weight: 500; padding-bottom:7px; } .summary-wrapper{ border-left-color: #155B71; border-radius: 0 15px 15px 0; } .summary-wrapper .title { font-weight: 500; font-size: 1rem; color: #155B71; } .summary-wrapper p{ font-size: 0.85rem;} .custom--summary{ border-left: none; border-radius: 15px; } hr{ margin: 0 0 1rem !important;; padding-top: 0.6rem !important;; }</p> <p> span.takeaway-item{ align-items: center !important; } .row-rev{flex-direction: row-reverse;} .row-rev .two-column-padded{margin:0;} .row-rev .last-column{margin-right: 3% !important;} .separator--mobile{display: none}</p> <p> .custom--summary{ border-left: none; border-radius: 15px; }</p> <p> @media screen and (max-width: 992px) {</p> <p> .columns-responsive .three-column{width: 49% !important;} .row-rev{ flex-direction: column-reverse !important; } .separator--mobile{ display: block } .columns-responsive .three-column .column--custom-padded{ width: 50% !important; } .heading--secondary{font-size: 1.8rem !important;} } @media screen and (max-width: 700px) {</p> <p> .section-title { font-size: 2.4rem; margin-top: 1rem; } .column--hero{ display: block !important; } .img-infographic{display: none;} .column--hero .two-column-padded{ width: 100%; } .paragraph--padding{ padding-bottom: 55%; } .page--heading{ font-size: 40px; } .image--form{ max-width: 300px !important; max-height: 300px !important; margin: 0 auto !important; width: 300px !important; height: 300px !important; } .pullquote{display: block !important;} } @media screen and (max-width: 500px) { .section-title { font-size: 2rem; margin-top: 1rem; } Feedback from The Diabetes Program 71% have lowered their blood sugar after completing the program 74% have reached below 7.0 mmol/L in fasting blood glucose (the threshold for diabetes) 34% have reduced their medication 12% have stopped taking medication completely 92% would recommend the program to someone else What’s included in the program? Throughout the 10 weeks, we’ll give you everything you need to get started on your journey to better health. The first two weeks can be the most challenging, but don’t worry — that’s what we’re here for! The program includes: delicious weekly menus three dietitian-approved recipes per day smart shopping lists tips and encouragement via email access to lectures, video courses, and other in-depth material to help you learn more about diabetes If there’s a recipe you don’t care for, or if you’re allergic to something, simply replace it with one of our other low carb recipes. Start your free 30-day trial <img src="https://i.dietdoctor.com/wp-content/uploads/2023/03/the_diabetes_program_1x1-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=1200&amp;fit=crop" alt="the_diabetes_program_1x1-1" class="wp-image-5621919" loading="lazy" width="1200" height="1200" /> What’s on the menu? The meals you’ll be eating on the program include high protein foods such as eggs, fish, meat, chicken, and dairy products. We’ve added some fat for flavor, and the amount of carbohydrates will vary between dishes, but it will be relatively low. One thing the meals all have in common is that they’re made from real, whole foods — we like to cook from scratch and focus on nutrition! Here are some examples of the tasty meals you’ll enjoy. <img src="https://i.dietdoctor.com/wp-content/uploads/2023/03/smash-burger-and-green-bean-fries-1x1-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=1200&amp;fit=crop" alt="smash-burger-and-green-bean-fries-1&#215;1-1" class="wp-image-5622012" loading="lazy" width="1200" height="1200" /> Smash burger with green bean fries and chipotle mayo <img src="https://i.dietdoctor.com/wp-content/uploads/2023/03/keto-chicken-garam-masala.png?auto=compress%2Cformat&amp;w=1200&amp;h=1200&amp;fit=crop" alt="keto-chicken-garam-masala" class="wp-image-5621606" loading="lazy" width="1200" height="1200" /> Quick keto chicken garam masala <img src="https://i.dietdoctor.com/wp-content/uploads/2023/03/tuna-burger-salad-tzatziki-1x1-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=1200&amp;fit=crop" alt="tuna-burger-salad-tzatziki-1&#215;1" class="wp-image-5622010" loading="lazy" width="1200" height="1200" /> Tuna burgers with salad and tzatziki <img src="https://i.dietdoctor.com/wp-content/uploads/2023/03/keto-scrambled-pancakes-1x1-1.jpg?auto=compress%2Cformat&amp;w=1200&amp;h=1200&amp;fit=crop" alt="keto-scrambled-pancakes-1&#215;1" class="wp-image-5622008" loading="lazy" width="1200" height="1200" /> Keto scrambled pancakes FAQs How much does The Diabetes Program cost?The Diabetes Program — and all our premium content — is included with your Diet Doctor membership! Not a member yet? You can join for free for 30 days. Then it costs $14.99 monthly or $119 for a full year until you cancel it.What can I expect from the program?If you stick to the program, you can expect better blood sugar levels with less diabetes medication, weight loss, and increased energy – all while enjoying a wide variety of tasty, filling, nutritious mealsDo I have to be a good cook to join the program?Nope! You don’t need to be a chef to participate in The Diabetes Program. Our delicious recipes have clear instructions and are easy to follow. Medication and diabetes If you’re on medication that lowers blood sugar levels, cutting out too many carbohydrates can be risky because your blood sugar levels can drop too low (hypoglycemia). The two types of medication that this applies to are sulfonylureas (such as glipizide and glimepiride) and all forms of insulin. SGLT2 inhibitors (Jardiance, Invokana, or Jardiance) are another type of medication that may need to be adjusted or discontinued, as they may increase the risk of diabetic ketoacidosis in people who eat a very low carb diet. If you are taking any of these medications, please consult your doctor before joining this program so they can help you adjust your medication as soon as you start! Your blood sugar will likely begin decreasing on the same day that you reduce your carbohydrate intake. Are you ready to join The Diabetes Program? The Diabetes Program is exclusive to our members. Not a member yet? Try the first 30 days for free! I want to join! What happens next? Join The Diabetes Program and look forward to receiving a welcome email immediately! Didn’t get an email? Please check your spam folder.'
