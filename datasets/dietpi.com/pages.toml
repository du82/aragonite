["https://dietpi.com/contribute.html"]
title = "Contribute to DietPi"
description = "Creating a bug report helps us to improve. Providing required info, steps to replicate, and expected vs. actual behaviour you give us valuable info to understand the problem.Create now a GitHub issue.Security is on top of our list. Please report any security vulnerability shipped with our images or created by our scripts (in /boot/dietpi/). For more details check our Security Policy guide."
full_description = "Contributions are always welcome, no matter how small or large. You can do this in many ways and this page provides everything you need to get started! We are asking you to help the DietPi project. DietPi is an open-source product and it is free to use. We are sustained by donations and even a small one (as little as the price of a cup of coffee) would help the things move forward, covering the costs for hardware (new boards, micro SD cards etc.), web hosting and future development.This allows us to continue working on DietPi, make it better with every new update.In the last years we made many releases to bring improvements, changes and bug fixes (nearly monthly releases). We provided new software titles, support new SBCs and brought many optimisations. There are over 120000 systems running DietPi.Enable us to grow also in the future! You can improve the software you rely on. It's empowering to be able to make changes, even small ones: whether it's coding, documentation, testing, web design. If you're looking to help, there's something for you on here! Creating a bug report helps us to improve. Providing required info, steps to replicate, and expected vs. actual behaviour you give us valuable info to understand the problem.Create now a GitHub issue. Security is on top of our list. Please report any security vulnerability shipped with our images or created by our scripts (in /boot/dietpi/). For more details check our Security Policy guide. Sometimes issues are created with missing information, or we are not able to replicate, or plain invalid.Help make them easier to resolve. Handling issues takes a lot of time that we could rather spend on fixing bugs and adding features.Browse DietPi issues on GitHub or DietPi documentation tasks on GitHub. Start a discussion, ask and answer questions. There are many questions on the DietPi GitHub repository and on our forum for which you may have already the answers, or you could provide valuable insights. Browse DietPi issues on GitHub or browse different conversation topics on the DietPi community forum and find the ones that interest you the most."
year_published = 2025
clearnet = "https://dietpi.com/contribute.html"
tags = ["able", "allows", "always", "answer", "asking", "become", "better", "boards,", "bring", "brought"]
language = "en"
internal-references = ["none"]
external-references = ["github.com", "graphberry.com", "myvirtualserver.com", "patreon.com", "paypal.com", "twitter.com", "wordpress.org", "zakratheme.com"]

["https://dietpi.com/docs/dietpi_tools/system_configuration"]
title = "System Configuration - DietPi.com Docs"
description = "Official documentation pages for DietPi OS"
full_description = "System configuration¶DietPi-Config¶Configure various system settings, from display / audio / network to auto start options. To start the system configuration, use the following command:dietpi-config Display OptionsAudio OptionsPerformance OptionsAdvanced OptionsSecurity OptionsLanguage/Regional OptionsNetwork Options: AdaptersNetwork Options: MiscAutoStart OptionsToolsThe display options are used toSet your screen resolution, or go headless to save additional resources. Control your GPU memory splits. Enable/disable the RPi camera.The audio options are used toChange sound cards with ease (e.g.: HiFiBerry / Odroid HiFi shield).The performance options are used toOverclock your system with a vast selection of overclocking profiles for your device.Change the CPU governor and tweak your ARM temperature limits.The advanced options are used toConfigure swap file sizeSet APT cache handlingConfigure time synchronization and real time clock sourceToggle serial consoleToggle BluetoothThe security options are used toChange password and hostnameThe language/regional options are used toSet timezone, locale and keyboard options. Everything you will need to make it feel like homeThe network options are used toScan and connect to your WiFi router with easeChange to a static IP address on your networkConfigure your proxy settingsTest internet connectionToggle IPv6 supportThe miscellaneous network options options are used toSelect an APT mirror to connect to the Debian (or Raspbian) APT repository.Select an NTP mirror to synchronise your system time.Choose these options for the network and URL connection tests:Set Network test connection timeout and number of connection test tries.Set IPv4 and IPv6 addresses used for the connection test.Set the domain used for the domain name resolution test.Network Drives redirects you to the DietPi-Drive_Manager which allows you to mount Samba and NFS shares on your DietPi system.Select one of several Dynamic DNS (DDNS) providers which allows you to access your home network/server with a static domain name. The client is required to inform the DDNS of your current dynamic external IP on a regular basis.The autostart options are used toQuickly and easily change what software runs after boot. Kodi, Desktop, console and many moreThe tools options are used toPerform CPU, RAM, filesystem and network benchmarks, optionally upload your results and review statistics at: https://dietpi.com/survey/#benchmarkPerform CPU/IO/RAM/DISK stress tests to test the stability of your system, e.g. after applying some overclocking.DietPi drive manager¶Feature-rich drive management utility. It is a lightweight program that allows you to:Manage drives: Mount, format external drivesMaintenance drives: Check and repair drives, resize (expand) filesystem, change reserved blocks countSet drive attributes: Set read only filesystems, set idle spindown timeMove DietPi User dataTransfer RootFS to external drive (Raspberry Pi and some ODROID boards only)Disable swap file, change swap file sizeRun benchmarks on drivesMount network drives (NFS and Samba)To start DietPi-Drive_Manager, use the following command:dietpi-drive_manager Setup a dedicated drive for DietPi¶To use an additional drive (example USB drive) the following steps have to be done:Run dietpi-drive_manager to bring up the main menu.Plug in the drive you wish to use.Select Refresh from the menu (if it doesn’t show up straight away, give it a few seconds for system to update, then try again).Select the drive you wish to use from the list, then press Enter.If needed, format the drive before usage selecting the Format option (filesystem type description see below). Remark: Formatting drives can only be done unmounted.If needed, mount the drive via the Mount selection. If mounted, commands Unmount, Benchmark, User data, Swapfile and Read only are present.Move the location of user data and swap file¶You can move the location of the DietPi user data (default /mnt/dietpi_userdata) or the swap file to a different location on a target drive. This may be useful if your filesystem containing the DietPi user data resp. swap file has only little space left. Therefore execute the following steps (example user data, swap file is quite similar):Run dietpi-drive_manager to bring up the main menu.Have the target drive connected and mounted (see description above).Select the target drive and press Enter.In the drives menu select User data resp. Swapfile and follow the instructions.Move user data:Change swap file size:Format filesystem types¶Formatting filesystems lead you to these dialogues:In the latter dialog you have to choose the filesystem type. The following selections may be chosen:ext4 (Default)NTFSFAT32exFATHFS+BtrfsF2FSXFSRecommended for users who plan to use this drive solely on Linux systems (e.g. dedicated drive).+ The standard for Linux filesystems- Not compatible on a Windows systemRecommended for users who plan to use this drive on a Windows system.+ Compatible on a Windows system- Only emulated support for UNIX permissions- Does support symbolic links (creation)- High CPU usage during transfers (spawns a process)Recommended for users who want high compatibility across multiples operating systems.+ Highly compatible with all OS- 4 GiB file size limit- 2 TiB drive size limit- Does not support UNIX permissions- Does not support symbolic linksWindows filesystem, intended for external drives, e.g. USB flash drives or SD cards.+ Flash-Friendly File System: https://en.m.wikipedia.org/wiki/ExFAT+ Compatible on a Windows system- Does not support UNIX permissions- Does not support symbolic linksRecommended for users who plan to use this drive on a macOS system.+ macOS filesystem- Not compatible on a Windows systemA modern Linux filesystem.+ Advantages were described in this DietPi issue- Compatible with Windows only via additional windows driver WinBtrfsLinux filesystem designed for flash/NAND based drives.+ Flash-Friendly File System: https://en.wikipedia.org/wiki/F2FS- Not compatible on a Windows systemA modern Linux filesystem.+ Well accepted for large files (typically in a file server use)- Not compatible on a Windows systemMove DietPi system to a larger SD card¶If you want to extend your DietPi SD card space by moving the system to a larger memory card, this can be achieved by the following steps:Shutdown your system and put the SD card into a card reader of a different systems.Copy the SD card contents to the new (larger) SD card. This can e.g. be done usingthe dd command (command line option)balenaEtcher or Rufus (graphical user interface option)gnome-disks (graphical user interface option)Boot the system with the copied memory card.Run dietpi-drive_manager to bring up the main menu.Select the disk containing the root (/) partition and press Enter.Select Resize and press Enter.Reboot your system to expand the root filesystem to use the whole space of the new memory card.A similar procedure may be used when moving the SD card contents to a smaller SD card. During this procedure you typically need to shrink the partition size (e.g. with parted or gparted) before copying the partition image to a different memory card. Also, do the resize to use the full space on the new card.Mount network drive¶If you want to mount a NFS drive or a Samba share, you can do this by:Run dietpi-drive_manager to bring up the main menu.Select Add network drive.Select the type of network drive that you have.Follow the prompts.Mounting a macOS Samba shareTo mount a macOS Samba share enabled in Sharing, you need to (in the server) go to Sharing > File Sharing > Options > Windows File Sharing and select your username.DietPi file explorer¶Lightweight file manager and explorer. To start DietPi-Explorer, use the following command:dietpi-explorer DietPi autostart¶Defines software packages to start when the DietPi OS boots up. Example, boot into the desktop with Kodi running. To start DietPi-Autostart, use the following command:dietpi-autostart Autostart option in dietpi.txt (first initial boot)When booting the DietPi system the first time, the autostart option can also be set via the file dietpi.txt. See optionAUTO_SETUP_AUTOSTART_TARGET_INDEX= for further information. The numbers shown on the left in the dietpi-autostart command correspond to the values in dietpi.txt.DietPi services¶Provides service control, priority level tweaks and status print. To start DietPi-Services, use the following command:dietpi-services The dialog to tweak a service is entered by highlighting the service (keys Up and Down) and pressing Enter. The configuration dialog (example: cron service) looks like this:Be careful at tweaking the services.DietPi LED control¶Change triggers for the status LEDs on your SBC/motherboard. To start DietPi-LED_Control, use the following command:dietpi-led_control Depending on your used hardware, the number of entries in the dialog will change.DietPi cron¶Modify the start times of specific cron job groups. To start DietPi-Cron, use the following command:dietpi-cron DietPi JustBoom¶Change the audio settings. To start DietPi-JustBoom, use the following command:dietpi-justboom If the sound output is configured, the following dialog appears:If no sound output is configured, the following dialog appears:In this case you have to e.g. install a sound program package via dietpi-software or configure the sound output e.g. via dietpi-config.DietPi display¶DietPi Display allows the configuration of console display modes and rotation via KMS/DRM (Kernel Mode Setting, Direct Rendering Manager). This is e.g. valid for a local display of the Raspberry Pi and the NanoPi M6:dietpi-display DietPi survey¶DietPi Survey allows the DietPi project to obtain general information regarding your system and installed software. To start DietPi-Survey, use the following command:dietpi-survey Privacy and goalsThe following privacy rules and goals are considered:No private data is sent. No one can identify you. No IP address is obtained.DietPi Survey is an Opt-in system, which means that it won’t send any data without your explicit interactive permission.On your first interactive login on a fresh DietPi system, you will be asked once for the Opt-in/Opt-out mode.The transmitted data allows the DietPi project team to achieve the best future possible experience for everyone tofocus and improve especially popular areas,ensure the most common devices and software titles will receive support and improvements,keep up support for software and hardware that you use.In short words: By selecting Opt IN, you are supporting the DietPi project with no impact to your system or private data.Data transmission eventsUploaded amount of dataTransmitted data contentsSelecting Opt-in or Opt-outThe DietPi Survey data file is sent when you install software with dietpi-software and update DietPi with dietpi-update.The uploaded data is tiny (about 1 KB) and will not affect your internet bandwidth or system performance.Within the command line program dietpi-survey the exact copy of the transmitted data can be viewed. The transmitted file is written in bash code to allow us faster report page creation (e.g. done for https://dietpi.com/survey).Following is an example how this file may look like:#!/bin/bash ((aDIETPI_VERSION[6.34]++)) ((aGIT_BRANCH[MichaIng/master]++)) ((aDEVICE_NAME[Virtual Machine (x86_64)]++)) ((aCPU_ARCH[x86_64]++)) ((aCPU_COUNT[2]++)) ((aDISTRO_VERSION[buster]++)) ((aAUTOSTART_OPTION[${aAUTOSTART_NAME[0]:=0}]++)) ((aAUTO_SETUP_AUTOMATED[0]++)) ((aNETWORK_INTERFACE[eth0]++)) # ------------------------- # DietPi-Software installs # ------------------------- ((aSOFTWARE[${aSOFTWARE_NAME6_34[103]:=103}]++)) ((aSOFTWARE[${aSOFTWARE_NAME6_34[104]:=104}]++)) The tail of the file lists installed software packages by their IDs. The example above shows a very basic system, so only two software packages (#103: DietPi-RAMlog, #104: Dropbear) are installed. To find out the names of the installed software package IDs installed via dietpi-software you can executedietpi-software list | grep ' =2' This gives the IDs, names and info of software. The above example would show# dietpi-software list | grep ' =2' id 103 | =2 | dietpi-ramlog: minimal, optimised logging | | https://dietpi.com/docs/software/log_system/#dietpi-ramlog id 104 | =2 | dropbear: lightweight ssh server | | https://dietpi.com/docs/software/ssh/#dropbear You can select Opt-in or Opt-out of DietPi Survey by running the following command and follow the instructions:dietpi-survey This may also be achieved by setting SURVEY_OPTED_IN=0 (Opt-out) or SURVEY_OPTED_IN=1 (Opt-in) in /boot/dietpi.txt before the first system boot.To check the actual status, dietpi-survey may be called. The current mode will be pre-selected and highlighted. Alternatively you can usegrep 'SURVEY_OPTED_IN' /boot/dietpi.txt which displays the status like# grep 'SURVEY_OPTED_IN' /boot/dietpi.txt SURVEY_OPTED_IN=1"
