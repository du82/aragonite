full_description = "DietPi Tools Overview¶DietPi-Launcher¶It provides an easy access to all DietPi OS tools and can be accessed by running next command:dietpi-launcher Software Installation¶DietPi Software - Automated installation of software packagesDietPi LetsEncrypt - A frontend for the Let’s Encrypt integrationDietPi VPN - A combination of OpenVPN installation and DietPi front end GUIDietPi DDNS - A generic Dynamic DNS (DDNS) clientSystem Configuration¶DietPi Config - Configure various system settingsDietPi Drive Manager - Feature-rich drive management utilityDietPi File Explorer - Lightweight file manager and explorerDietPi Autostart - Defines software packages to start when the DietPi OS boots upDietPi Services - Provides service control, priority level tweaks and status printDietPi LED Control - Change triggers for the status LEDs on your SBC/motherboardDietPi Cron - Modify the start times of specific cron job groupsDietPi JustBoom - Change the audio settingsDietPi Display - Allow controlling the console display modes and rotation via KMS/DRMDietPi Survey - Allow to obtain general information regarding your system and installed softwareSystem Maintenance¶DietPi Update - Update DietPi OS version and inform when updates are availableDietPi Cleaner - Clean up not necessary files and free up valuable disk spaceDietPi Log Clear - Clear log files in /var/log/DietPi Backup (backup/restore) - Backup and restore your DietPi systemDietPi Sync - Duplicate a directory from one location to anotherMisc Tools¶Useful DietPi Shell FunctionsDietPi Banner - Configuration of the initial banner, displayed on logonDietPi CPU Info - Displays CPU temperature, processor frequency, throttle level etc.DietPi Morse Code - Converts a text file into morse codeDietPi Bug Report"
