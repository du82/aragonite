title = "DietPi-Software - Lightweight justice for your SBC!"
description = "LXDEHow to Setup / Details:ViewPros:Ultra lightweight, fast and functional desktopCons:TBAHighly optimized lightweight desktop without the bloatware. If you are seeking a raw performance desktop, LXDE is all you need. One of the lightest and functional desktops available. One of our favourites!Desktop can be run by typing startxYou can also have DietPi boot directly to the desktop by using dietpi-autostart and selecting Desktop."
full_description = 'Easily install optional "ready to run" and optimized software for your device. As well as automating the Linux installation and configuration process for you, DietPi-Software also applies specific optimizations unique to your hardware model, ensuring you get the maximum performance from your device. NB: Available software is dependent on the device and CPU architecture, some software titles may be unavailable. You can run the following command to list disabled items: dietpi-software list | grep DISABLED Highly optimized lightweight desktop without the bloatware. If you are seeking a raw performance desktop, LXDE is all you need. One of the lightest and functional desktops available. One of our favourites! Run a Desktop environment on your device that can be accessed remotely, over the network. Great for headless devices. Remote desktop server with advanced features, such as screen recording. The client also scans for all available NoMachine servers on your network, allowing easy connection and maintenance of your remote desktops. Run a Desktop environment on your device that can be accessed remotely, over the network. Great for headless devices, RealVNC also supports shared desktop mode. A lightweight, bare-bones, no frills HiFi music player with a web based interface. Select or search for a song and play it, simple and effective. If you are seeking the highest raw performance audio playback, without bloatware and additional processing, YMPD is highly recommended. YMPD is a front end for MPD. A feature-rich web interface audio player for MPD. Includes song/album scraping, ideal for music catalog browsing. A feature-rich python based music player with a web based interface. Mopidy is also highly customisable and supports various extensions from web extensions to backend extensions. Airsonic is a free, web-based media streamer, providing ubiquitous access to your music. Use it to share your music with friends, or to listen to your own music while at work. You can stream to multiple players simultaneously, for instance to one player in your kitchen and another in your living room.'
