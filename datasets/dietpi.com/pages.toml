["https://dietpi.com"]
title = "DietPi - Lightweight justice for your SBC!"
description = "CPU:BCM2708 900/1000 MHz | 1 Core | ARMv6RAM:256 MiB - 512 MiB LPDDR2Download Image:Download (SHA256) (Signature)How to install / Details:ViewAmiberry image:Download (SHA256) (Signature)This image installs and boots into Amiberry automatically on first boot.Allo GUI image:Download (SHA256) (Signature)This image has our Allo web GUI and audiophile software pre-installed.Bullseye images:We provide images based on the older Debian Bullseye release as well, as not all software in our catalogue is compatible with Debian Bookworm yet. All info about this can be found here.These images are compatible with all Raspberry Pi models, but we recommend it only for Raspberry Pi 1 and Zero (1) models."
full_description = '''This release mainly adds support for Pi-hole v6. If you updated Pi-hole v5 to v6, the DietPi update performs some additional migration and cleanup steps, and offers to uninstall webserver and PHP. DietPi is extremely lightweight at its core, with features of low process/memory footprint and DietPi-RAMlog installed by default, to get the maximum performance from your device. Quickly and easily install popular software "ready to run" and optimised for your system. Gone are the days of reading 5+ page guides, DietPi does everything for you, giving you more time to enjoy the software you require. Looking to purchase a new SBC device? Curious to see which devices perform best? With thanks to our end users, you can now view and compare DietPi-Benchmark results for all devices. DietPi is an extremely lightweight Debian OS, highly optimised for minimal CPU and RAM resource usage, ensuring your SBC always runs at its maximum potential. DietPi programs use lightweight Whiptail menus. Spend less time staring at the command line, more time enjoying your Pi. Quickly and easily install popular software "ready to run" and optimised for your system. Only the software you need is installed. Quickly and effortlessly customise your device's hardware and software settings for your needs, including network connection and localisation setup. You decide how much logging you need. Get a performance boost with DietPi-RAMlog, or, rsyslog and logrotate for log critical servers. Control which installed software has higher or lower priority levels: nice, affinity, policy scheduler and more. DietPi automatically checks for updates and informs you when they are available. Update instantly, without having to write a new image. Allows you to completely automate a DietPi installation with no user input. Simply by configuring dietpi.txt before powering on. These images are compatible with all Raspberry Pi models, but we recommend it only for Raspberry Pi 1 and Zero (1) models. These images are compatible with all Raspberry Pi 2, 3, 4 and 5 models, but we recommend it only for Raspberry Pi 2 PCB v1.1, or if you require a 32-bit system explicitly.The Raspberry Pi 2 comes in two versions, which is printed onto the PCB. PCB v1.1 has an ARMv7 chip, hence needs to use this image, PCB v1.2 can use the ARMv8 image, which we then generally recommend.'''
