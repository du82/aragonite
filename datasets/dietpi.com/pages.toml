description = "Our new blog to share experiences and setup examples around DietPi OS"
full_description = "File Browser: A lightweight storage option in DietPi StephanStS2025-02-14ApplicationsNo Comments on File Browser: A lightweight storage option in DietPiSearching for a lightweight and powerful cloud storage system for a DietPi system which is easier to handle than Nextcloud? With File Browser we offer a solution for this purpose! This post describes its benefits, the installation and the basic configuration/management options. File Browser is so easy to use that no user documentation for the […]Read More DietPi and NFS: Basics and improving security StephanStS2024-10-31Hardware, InstallationNo Comments on DietPi and NFS: Basics and improving securityThe Network File System (NFS) is a distributed file system protocol that allows users to access files over a network as if they were on a local disk. Developed by Sun Microsystems in 1984, NFS provides a way to share directories and files with others over a network. NFS is widely used in UNIX and […]Read More DietPi’s WiFi – Part 2: WiFi-to-LAN gateway StephanStS2024-02-23Hardware, Installation1 Comment on DietPi’s WiFi – Part 2: WiFi-to-LAN gatewayThis is the second post in a row of several ones dealing with DietPi’s WiFi functionality.It describes the option of a gateway from a WiFi area to a (local) LAN. The WiFi HotSpot of DietPi gives an easy to use subordinated WiFi subnet routet to a superimposed Ethernet LAN. Sometimes an inverse functionality is needed: […]Read More DietPi’s WiFi – Part 1: Combining the WiFi HotSpot with an Ad blocker StephanStS2023-12-22Hardware, Installation6 Comments on DietPi’s WiFi – Part 1: Combining the WiFi HotSpot with an Ad blockerThis is a first post in a row of several ones dealing with DietPi’s WiFi functionality.It describes the options of an Ad blocker extension like AdGuard Home resp. Pi-hole and how to combine it with your DietPi WiFi HotSpot. The WiFi HotSpot of DietPi gives an easy to use subordinated WiFi subnet routet to a […]Read More Using a RAID system with DietPi – part 5 StephanStS2023-08-03Backup/Restore, Installation5 Comments on Using a RAID system with DietPi – part 5Part 5: Redundancy tasks. The first four posts “Using a RAID system with DietPi – part 1“, “– part 2“, “– part 3” and “– part 4” dealt with the setup of, the access to, the management/diagnosis and the maintenance tasks of a RAID system with an example of a RAID 5. This blog post […]Read More"
