ve a close relationship but my brother is unreliable, at best, so when she asked me to be the executor of the will I agreed. But now that I know more about the will, I’m horrified. The will leaves a little to charity, a little to their church, and a very very little (like $100) to my brother’s young kids, and a dollar to my brother. The bulk of the estate is left to me, my family, and my children. But outside the will, my mom has verbally told me and left written instructions asking me to pay out half of “my” inheritance to my brother under the table within six months of receiving it. He apparently owes considerable child support and both my brother and my mom are convinced this will avoid garnishment. I didn’t react on the phone call with them because I was so stunned. I’m starting to question whether she’s of sound mind. Not only is this illegal and unethical it’s also something I wouldn’t even know how to do. The cleanest thing I can think of is to give half of the inheritance to my brother, legally and with transparency. He will be subject to taxes and anything else. I assume he will be furious and that our relationship will not recover. It might seem simple on paper but I’m heartbroken by this, and worried about losing any remaining connection to my extended family. I have no idea how to have this conversation with my mom or brother, or if I even should. My mom has always doted on my brother, and her jealous treatment of his now ex-wife seemed like a major driver in their divorce. She’s never done anything like this before, though, and I’m worried it’s a combination of previous feelings and new cognitive problems. How do I even start here? Slate Kristin Wong advises the letter writer to consult an estate attorney and follow the law in their area. “Have an honest conversation with your mom, explain to her that you’re uncomfortable with her request because of the legal risks involved,” she writes. “You could suggest that she work with a lawyer to find a way to manage her estate without violating the law (or putting you in the middle of it!).” Read the rest of her answer. Am I Wrong Not To Want To See My In-Laws Anymore After They Laughed At Me Because I Needed Surgery? I've been married a long time. My in-laws have been a problem during my entire marriage. I've had serious health issues and a lot of surgeries over the past 10 years. My cancer came back, and I had to have colon surgery just to name one. Most recently, I had hand surgery. When my in-laws found out, they couldn't stop laughing at me. When one of them saw me again, she laughed and asked, "Any more planned?" I didn't answer; I just walked away. I want to cut them out of my life. My husband is not supportive. Am I wrong? [UExpress https://www.uexpress.com/life/dearabby/2025/02/21/1] Abigail Van Buren endorses the letter writer’s plan to take a step back from their in-laws. “I can't blame you for wanting to protect yourself, especially since your husband is unwilling to protect you from his family's hurtful reaction,” she writes. “Avoiding people who hurt you is healthy, and you would not be wrong to do it.” Read the rest of her answer https://www.uexpress.com/life/dearabby/2025/02/21/1. Was I Wrong Not To Send Thank-You Notes To People Who Attended My Husband’s Wake? My husband recently passed, and I sent thank-you notes to everyone who gave a monetary gift or sent flowers. Are thank-you notes required to those who attended the wake services? I heard that a friend of a friend was offended at not receiving a thank-you. UExpress Judith Martin, Nicholas Ivor Martin and Jacobina Martin rule that hosts are not obligated to write thank-you notes to their guests. “Any such expectation is particularly ugly in connection with funerary services, where the purpose is to show respect for the deceased and offer comfort to the bereaved,” they write. Read the rest of their answer. Am I Wrong To Be Upset That My Boyfriend’s Friend Sent Back His Dish Twice At A Restaurant And Then Complained About His Third Dish? My boyfriend, one of his friends, and I went to a restaurant that serves somewhat exotic pizza. The friend ordered without closely reading the menu, and when his pizza came out, he took one bite and didn’t like it. The waitress noticed and offered to get something different for him. He took one bite of the second pizza and also didn’t like it. He complained to the waitress, and she got him a third dish, which he finally ate (though still complained about). I have never sent food back and was horribly embarrassed that the friend did it twice. My boyfriend mentioned this to the friend, who refuses to apologize for his behavior. He says it’s the restaurant’s fault for having bad food. Am I crazy to be upset? The Boston Globe Robin Abrahams agrees that the friend’s behavior was bad. “If your food is spoiled or not what you ordered, send it back,” she writes. “If you simply don’t like it, that’s your problem, and you do what all grown-ups do when confronted by food they don’t like: eat a bit, mess the rest around on your plate, and focus on the delights of conversation rather than cuisine.” Read the rest of her answer. // This loops through links inside of additional content and adds appropriate properties const markdownAdditionalContentLinks = document.querySelectorAll('.additionalContent a'); if (markdownAdditionalContentLinks) { markdownAdditionalContentLinks.forEach((link) => { link.setAttribute('rel', 'nofollow'); link.setAttribute('target', "_blank"); }); } gallery { display: none; } gallery div.viewport, gallery img.image { padding: 0 !important; height: 400px !important; } gallery div.viewport div.ad > div { max-width: 100%; max-height: 100%; } gallery .thumbnails img { width: 40px !important; height: 40px !important; padding: 0 !important; } (function() { const zoneId = 'CEAIE53I'; const galleries = document.querySelectorAll('gallery'); const galleryAdPositions = Array.from({ length: 100 }, (_, index) => index * 3 + 1); // 3 is