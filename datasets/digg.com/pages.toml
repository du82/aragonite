title = "Can I Reach Out Again To A Woman I Contacted 8 Times In 2 Weeks After Meeting Her At A Volunteering Event, And Other Advice Column Questions | Digg"
description = '''
There are too many excellent advice columns to keep up with, so we're committed to bringing you links to the best advice column questions and answers every week. Here's a roundup of the most interesting, thought-provoking and surprising questions that our favorite columnists addressed in recent days.
 
Can I Reach Out Again To A Woman I Contacted 8 Times In 2 Weeks After Meeting Her At A Volunteering Event?

This isn’t for my job, but it’s for a nonprofit organization related to my career that involves some level of professionalism. I’m afraid that I scared off a new member by coming on too strong to her.
I volunteer at a STEM-related organization that mentors children. My position is at the state level, and a new person just joined at the group level. I met her for the first time at a regular group meeting.
I’ll admit, I’m really attracted to her, but I still wanted to get to know her regardless of whether or not she’s interested. She’s the only other woman I know who’s in my field with some of the same interests I have, and she’s incredibly driven and smart. …
She put her number into my phone, and when I texted my name to her, it showed up on her screen. Here are the texts I’ve sent her since:
[Day we met, T+0]
[STEM-related meme]
Hey just wanted to say it was great meeting you tonight :)
Have you been to Teapot Museum by any chance?
[T+1]
The one by [location]?
[T+3]
Hey! Can I call you sometime today? Because there have been some new policies that Organization wants to implement that I’m worried could affect what you want to teach at Teapot Group.
[T+6]
Hi! Just wanted to let you know that Cool Teapot Event is happening on [date] that the kids might want to know about!
All these text messages were labeled as “delivered” until T+8, when they all went to “read.” She didn’t reply to any of them.
I had also found her on LinkedIn and sent a (still pending) request on T+9 (I haven’t done this with other members). On T+10, I invited her to a monthly Teams meeting that I schedule for our group, and she still hasn’t sent an RSVP. On T+12, I called and left a voicemail about future lessons. I’m writing this letter to you on T+14. …
Why wouldn’t she have replied at some point? … I can understand forgetting to text back, but there were multiple chances to interact. Not to mention that our organization’s state conference is next month, and I don’t know if she knows about it. …
Did I scare her off? Can I still reach out to her?

Ask A Manager
Alison Green directs the letter writer not to contact this woman again. “You do not need to inform her about the state conference next month,” she writes. “If there is something urgent that she must be contacted about, someone else from the organization should do it, not you.” Read the rest of her answer.

How Can I Get My Brothers To Forgive My Dad For Neglecting Them As Kids But Pretending That He Was An Involved Father?

I admit our dad was not the most involved father. My twin brothers are eight years older than I am, and they were the ones who came to my softball games, taught me to ride a bike, drive, etc.
Now that we’re all grown, I can see how much our dad regrets that my brothers aren’t close to him. I have forgiven any neglect because his work as a surgeon was all-consuming. It seems to me he didn’t look up from it and realize what he was missing until I was in high school and he and my mom divorced.
One coping strategy he has is to claim to remember doing things with us that he wasn’t really there for. Like taking the training wheels off my bike, or teaching us all to swim, or being at the shelter with us when we got our puppy. I think it’s kind of sad and sweet, but it bothers my brothers.
They usually just mutter about him not actually being there. But when my dad was telling his girlfriend about my one brother reading a poem at his best friend’s funeral in high school, my brother exploded at him. He said my dad couldn’t remember anything about it because he wasn’t there, and the only advice our dad gave him was not to do the reading if he couldn’t do it without blubbering. Our dad denied saying that and said our mom had told him all about it and he felt like he was there.
Later I asked my brother to let things like that go, especially in front of our dad’s girlfriend. I told him our dad is 62, they’re 35, and they should be relating to him as adults, not hurt children. My brother got mad at me and said that because of them, I didn’t really miss out on having a dad like they did, so I should stay out of it.
I think I do have a place as an advocate for healing here. I think it would be healthier for my brothers if they could embrace our dad’s regret and forgive him like I did. Am I wrong?

The Washington Post
Carolyn Hax encourages the letter writer to apologize to their brother for asking him to let their dad’s comments go. “I don’t think it’s a coincidence the triggering event was when your father co-opted the narrative of your brother’s best friend’s funeral — a horrific experience for anyone, much less the adolescent he was at the time,” she writes. “Don’t you think when your dad rewrote this piece of history in his favor, he crossed an uncrossable line?” Read the rest of her answer.

What Should I Do After My Mom Asked Me To Help Her Hide My Brother’s Inheritance So He Won’t Have To Pay The Child Support He Owes?

My dad passed away last year and my mom is in delicate health. My dad invested well and there is enough to keep her comfortable even if she lives to 102. We don’t have a close relationship but my brother is unreliable, at best, so when she asked me to be the executor of the will I agreed.
But now that I know more about the will, I’m horrified. The will leaves a little to charity, a little to their church, and a very very little (like $100) to my brother’s young kids, and a dollar to my brother. The bulk of the estate is left to me, my family, and my children. But outside the will, my mom has verbally told me and left written instructions asking me to pay out half of “my” inheritance to my brother under the table within six months of receiving it. He apparently owes considerable child support and both my brother  and my mom are convinced this will avoid garnishment. I didn’t react on the phone call with them because I was so stunned. I’m starting to question whether she’s of sound mind.
Not only is this illegal and unethical it’s also something I wouldn’t even know how to do. The cleanest thing I can think of is to give half of the inheritance to my brother, legally and with transparency. He will be subject to taxes and anything else. I assume he will be furious and that our relationship will not recover. It might seem simple on paper but I’m heartbroken by this, and worried about losing any remaining connection to my extended family.
I have no idea how to have this conversation with my mom or brother, or if I even should. My mom has always doted on my brother, and her jealous treatment of his now ex-wife seemed like a major driver in their divorce. She’s never done anything like this before, though, and I’m worried it’s a combination of previous feelings and new cognitive problems. How do I even start here?

Slate
Kristin Wong advises the letter writer to consult an estate attorney and follow the law in their area. “Have an honest conversation with your mom, explain to her that you’re uncomfortable with her request because of the legal risks involved,” she writes. “You could suggest that she work with a lawyer to find a way to manage her estate without violating the law (or putting you in the middle of it!).” Read the rest of her answer.

Am I Wrong Not To Want To See My In-Laws Anymore After They Laughed At Me Because I Needed Surgery?

I've been married a long time. My in-laws have been a problem during my entire marriage. I've had serious health issues and a lot of surgeries over the past 10 years. My cancer came back, and I had to have colon surgery just to name one.
Most recently, I had hand surgery. When my in-laws found out, they couldn't stop laughing at me. When one of them saw me again, she laughed and asked, "Any more planned?" I didn't answer; I just walked away. I want to cut them out of my life. My husband is not supportive. Am I wrong?

[UExpress https://www.uexpress.com/life/dearabby/2025/02/21/1]
Abigail Van Buren endorses the letter writer’s plan to take a step back from their in-laws. “I can't blame you for wanting to protect yourself, especially since your husband is unwilling to protect you from his family's hurtful reaction,” she writes. “Avoiding people who hurt you is healthy, and you would not be wrong to do it.” Read the rest of her answer https://www.uexpress.com/life/dearabby/2025/02/21/1.
Was I Wrong Not To Send Thank-You Notes To People Who Attended My Husband’s Wake?

My husband recently passed, and I sent thank-you notes to everyone who gave a monetary gift or sent flowers.
Are thank-you notes required to those who attended the wake services? I heard that a friend of a friend was offended at not receiving a thank-you.

UExpress
Judith Martin, Nicholas Ivor Martin and Jacobina Martin rule that hosts are not obligated to write thank-you notes to their guests. “Any such expectation is particularly ugly in connection with funerary services, where the purpose is to show respect for the deceased and offer comfort to the bereaved,” they write. Read the rest of their answer.

Am I Wrong To Be Upset That My Boyfriend’s Friend Sent Back His Dish Twice At A Restaurant And Then Complained About His Third Dish?

My boyfriend, one of his friends, and I went to a restaurant that serves somewhat exotic pizza. The friend ordered without closely reading the menu, and when his pizza came out, he took one bite and didn’t like it. The waitress noticed and offered to get something different for him. He took one bite of the second pizza and also didn’t like it. He complained to the waitress, and she got him a third dish, which he finally ate (though still complained about). I have never sent food back and was horribly embarrassed that the friend did it twice. My boyfriend mentioned this to the friend, who refuses to apologize for his behavior. He says it’s the restaurant’s fault for having bad food. Am I crazy to be upset?

The Boston Globe
Robin Abrahams agrees that the friend’s behavior was bad. “If your food is spoiled or not what you ordered, send it back,” she writes. “If you simply don’t like it, that’s your problem, and you do what all grown-ups do when confronted by food they don’t like: eat a bit, mess the rest around on your plate, and focus on the delights of conversation rather than cuisine.” Read the rest of her answer.'''
