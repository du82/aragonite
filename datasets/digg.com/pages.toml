title = "If All The World's Money Was Divided Equally, Here's How Much You'd Get | Digg"
description = """
As of 2024, the global M2 supply — all the money people have easily accessible, like cash, savings and money market funds — stands at roughly $123 trillion. If that sum was split equally between the world's eight billion people, how much would everyone get?
The short answer is: not a lot. According to Visual Capitalist, who analyzed CEIC and UN population data, dividing $123 trillion between all of the world's human beings only leaves each person with $15,108. This relatively low sum highlights just how unequally money is distributed across the globe.
To illustrate how far $15,000 can go, Visual Capitalist listed some of the things you can buy for that amount, including a used car, around four months of rent in NYC or two years' worth of groceries.
Click image to enlarge

Via Visual Capitalist."""
full_description = '''even-steven If All The World's Money Was Divided Equally, Here's How Much You'd Get Darcy Jimenez The world holds around $123 trillion in cash, and is home to more than eight billion people. 5 days ago · 22.3k reads · · 11 · As of 2024, the global M2 supply — all the money people have easily accessible, like cash, savings and money market funds — stands at roughly $123 trillion. If that sum was split equally between the world's eight billion people, how much would everyone get? The short answer is: not a lot. According to Visual Capitalist, who analyzed CEIC and UN population data, dividing $123 trillion between all of the world's human beings only leaves each person with $15,108. This relatively low sum highlights just how unequally money is distributed across the globe. To illustrate how far $15,000 can go, Visual Capitalist listed some of the things you can buy for that amount, including a used car, around four months of rent in NYC or two years' worth of groceries. Click image to enlarge Via Visual Capitalist. // This loops through links inside of additional content and adds appropriate properties const markdownAdditionalContentLinks = document.querySelectorAll('.additionalContent a'); if (markdownAdditionalContentLinks) { markdownAdditionalContentLinks.forEach((link) => { link.setAttribute('rel', 'nofollow'); link.setAttribute('target', "_blank"); }); } gallery { display: none; } gallery div.viewport, gallery img.image { padding: 0 !important; height: 400px !important; } gallery div.viewport div.ad > div { max-width: 100%; max-height: 100%; } gallery .thumbnails img { width: 40px !important; height: 40px !important; padding: 0 !important; } (function() { const zoneId = 'CEAIE53I'; const galleries = document.querySelectorAll('gallery'); const galleryAdPositions = Array.from({ length: 100 }, (_, index) => index * 3 + 1); // 3 is spacer. const galleryAdTemplate = `<img class="w-full h-full object-cover rounded" src="##image##" loading="lazy" 