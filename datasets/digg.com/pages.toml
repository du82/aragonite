3. Straight dude
The Meme
This week, X user @spookyshah treaded the fine line between becoming a meme and Main Character when she posted a tweet mocking the straight dude who came back to her apartment and was "so impressed by the simplest things." A lot of folks picked on OP and dissected her take, while others took the opportunity to crack jokes about the things a straight dude might be impressed by in their homes.
