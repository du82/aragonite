title = "Where There Are More Hogs Than People, Mapped | Digg"
description = '''
There are a whole lot of humans on the coasts of the United States, that's for sure, but we're not the only "domesticated animals" around. Reddit user u/ptunnel put together this lovely county-level map using 2022 USDA data to determine what animals reign supreme in each county.

Key Findings:


Hog counties are primarily focused in the Midwest and Great Plains, but you can find rogue hog-heavy counties in Pennsylvania, North Carolina, Mississippi and Utah.


Humans outnumber the rest of the bunch in 1,495 counties from sea to shining sea, but cattle and chicken combined end up at 1,350 counties, so we can't feel too good about ourselves.


Chukars, a type of partridge, outnumber humans in just a single county in central Pennsylvania.


New York is almost exclusively made up of human-dominated counties, but there are five chicken counties and five cattle counties in upstate and western New York.


Unsurprisingly, California's counties are mostly humans, but there's one duck county, one turkey county, six chicken counties and  11 cattle counties.



*Click image to enlarge*


Via Reddit.'''
