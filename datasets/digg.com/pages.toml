(true); const thumbnail = thumbnailClone.querySelector('div img'); thumbnail.src = image.src; thumbnail.dataset.idx = idx; thumbnail.dataset.ad = image.ad; if (idx == 0) { thumbnail.classList.remove('opacity-40'); } clone.querySelector('.thumbnails').appendChild(thumbnailClone); }); gallery.appendChild(clone); gallery.style.display = 'block'; } }); function addThumbnailOpacities(gallery) { gallery.querySelectorAll('.thumbnails img').forEach(image => { image.classList.add('opacity-40'); }); } function renderGalleryMainView(gallery, image) { const targetElementImage = gallery.querySelector('.viewport img.image'); const targetElementAd = gallery.querySelector('.viewport div.ad'); const isAd = image.dataset.ad === 'false' ? false : true; if (!isAd) { // if image targetElementAd.classList.remove('block'); targetElementAd.classList.add('hidden'); targetElementImage.classList.remove('hidden'); targetElementImage.classList.add('block'); targetElementImage.src = image.src; } else { // if ad targetElementImage.classList.remove('block'); targetElementImage.classList.add('hidden'); targetElementAd.classList.remove('hidden'); targetElementAd.classList.add('block'); _bsa.init('custom', zoneId, 'placement:digg', { target: `.${gallery.dataset.uuid} .viewport div.ad`, template: galleryAdTemplate, clear_contents: true, }); } } // Add event listeners to change main image. // Add listeners for next and previous. galleries.forEach(gallery => { gallery.querySelectorAll('gallery .thumbnails img').forEach(image => { image.addEventListener('click', evt => { evt.preventDefault(); addThumbnailOpacities(gallery); renderGalleryMainView(gallery, evt.target); const picture = gallery.querySelector('picture'); picture.dataset.active = evt.target.dataset.idx; evt.target.classList.remove('opacity-40'); }); }); gallery.querySelector('.next').addEventListener('click', evt => { evt.preventDefault(); const picture = evt.target.closest('picture'); const thumbnails = evt.target.closest('.thumbnails'); const count = parseInt(picture.dataset.count, 10); let active = parseInt(picture.dataset.active, 10); active++; if (active > (count-1)) active = 0; picture.dataset.active = active; const image = picture.parentElement.querySelectorAll('.thumbnails img')[active]; renderGalleryMainView(gallery, image); addThumbnailOpacities(gallery); image.classList.remove('opacity-40'); }); gallery.querySelector('.previous').addEventListener('click', evt => { evt.preventDefault(); const picture = evt.target.closest('picture'); const thumbnails = evt.target.closest('.thumbnails'); const count = parseInt(picture.dataset.count, 10); let active = parseInt(picture.dataset.active, 10); active--; if (active < 0) active = (count - 1); picture.dataset.active = active; const image = picture.parentElement.querySelectorAll('.thumbnails img')[active]; renderGalleryMainView(gallery, image); addThumbnailOpacities(gallery); image.classList.remove('opacity-40'); }); }); } })();'''
