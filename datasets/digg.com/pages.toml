2. Hilary Duff clap challenge
The Meme
Any lover of math rock knows that some music can be difficult to clap along with, but most of it isn't very hard. However, countless women on TikTok have spent the last week exposing their boyfriends and husbands for their ineptitude. An exceedingly simple pop song that's in the same 4/4 time signature as the vast majority of popular music in the United States is too much for them to handle, it seems.
Hilary Duff would be embarrassed that these dudes are completely musically illiterate. Drop and give her twenty (if you can count).
