title = "These Three OECD Countries Have Higher Wages Than The US | Digg"
description = """
Across the Organisation for Economic Co-operation and Development (OECD)'s member countries, the average annual wage stands at roughly $58,000 — but in some places, that figure can be many thousands higher or lower.
Using the latest available OECD data for 2023, Visual Capitalist mapped the average annual wage in 34 of the organization's countries. Figures are presented in US dollars after adjusting for purchasing power parity.
European countries dominate the ranking, with Luxembourg boasting the highest average wage overall, at just under $90,000 a year.
There are three other countries where the average annual wage exceeds $80,000: Iceland ($87,421), Switzerland ($83,332) and the US ($80,115).
Wages are lowest in Mexico, where the average worker earns just $20,474 annually, followed by Greece ($30,238).
In Eastern Europe's Lithuania, Latvia and Estonia, wages have grown by more than 200 percent since 1995. Japan, on the other hand, has seen the worst growth overall, with real wages declining by around three percent over the same period.
Click image to enlarge"""
full_description = '''not too shabby These Three OECD Countries Have Higher Wages Than The US Darcy Jimenez There are four places where the average worker earns at least $80,000 a year. 5 days ago · 7k reads · · 1 · Across the Organisation for Economic Co-operation and Development (OECD)'s member countries, the average annual wage stands at roughly $58,000 — but in some places, that figure can be many thousands higher or lower. Using the latest available OECD data for 2023, Visual Capitalist mapped the average annual wage in 34 of the organization's countries. Figures are presented in US dollars after adjusting for purchasing power parity. European countries dominate the ranking, with Luxembourg boasting the highest average wage overall, at just under $90,000 a year. There are three other countries where the average annual wage exceeds $80,000: Iceland ($87,421), Switzerland ($83,332) and the US ($80,115). Wages are lowest in Mexico, where the average worker earns just $20,474 annually, followed by Greece ($30,238). In Eastern Europe's Lithuania, Latvia and Estonia, wages have grown by more than 200 percent since 1995. Japan, on the other hand, has seen the worst growth overall, with real wages declining by around three percent over the same period. Click image to enlarge // This loops through links inside of additional content and adds appropriate properties const markdownAdditionalContentLinks = document.querySelectorAll('.additionalContent a'); if (markdownAdditionalContentLinks) { markdownAdditionalContentLinks.forEach((link) => { link.setAttribute('rel', 'nofollow'); link.setAttribute('target', "_blank"); }); } gallery { display: none; } gallery div.viewport, gallery img.image { padding: 0 !important; height: 400px !important; } gallery div.viewport div.ad > div { max-width: 100%; max-height: 100%; } gallery .thumbnails img { width: 40px !important; height: 40px !important; padding: 0 !important; } (function() { const zoneId = 'CEAIE53I'; const galleries = document.querySelectorAll('gallery'); const galleryAdPositions = Array.from({ length: 100 }, (_, index) => index * 3 + 1); // 3 is spacer. const galleryAdTemplate = `<img class="w-full h-full object-cover rounded" src="##image##" loading="lazy" alt="##headline##">`; function generateRandomId(length) { const timestamp = Date.now().toString(36); const randomString = Math.random().toString(36).substr(2, length); return timestamp + randomString; } if (galleries) { const template = document.querySelector("#galleryTemplate"); const templateThumbnail = document.querySelector("#galleryTemplateThumbnail"); galleries.forEach(gallery => { // Add ads to the gallery. const galleryImages = gallery.querySelectorAll('img'); galleryAdPositions.forEach(slot => { if (slot > galleryImages.length) return; const placeholderAdSlot = document.createElement('img'); placeholderAdSlot.dataset.ad = true; placeholderAdSlot.dataset.src = "https://placehold.co/1000x1000?text=Ad"; gallery.insertBefore(placeholderAdSlot, gallery.children[slot]); }); // Process the gallery. const images = []; const imageElements = gallery.querySelectorAll('img'); imageElements.forEach(image => { images.push({ ad: image.dataset.ad || false, src: `https://digg.com/cdn-cgi/image/width=600,height=400,quality=90,fit=cover/${image.dataset.src}`, }); }); if (images.length) { const clone = template.content.cloneNode(true); gallery.innerHTML = ''; const galleryUUID = `gallery-${generateRandomId(20)}`; gallery.classList.add(galleryUUID); gallery.dataset.uuid = galleryUUID; // Setting first image as main one. clone.querySelector('img.image').src = images[0].src; clone.querySelector('img.image').classList.remove('hidden'); // Setting number of images available. clone.querySelector('picture').dataset.count = images.length; // Add thumbnails. images.forEach((image, idx) => { const thumbnailClone = templateThumbnail.content.cloneNode(true); const thumbnail = thumbnailClone.querySelector('div img'); thumbnail.src = image.src; thumbnail.dataset.idx = idx; thumbnail.dataset.ad = image.ad; if (idx == 0) { thumbnail.classList.remove('opacity-40'); } clone.querySelector('.thumbnails').appendChild(thumbnailClone); }); gallery.appendChild(clone); gallery.style.display = 'block'; } }); function addThumbnailOpacities(gallery) { gallery.querySelectorAll('.thumbnails img').forEach(image => { image.classList.add('opacity-40'); }); } function renderGalleryMainView(gallery, image) { const targetElementImage = gallery.querySelector('.viewport img.image'); const targetElementAd = gallery.querySelector('.viewport div.ad'); const isAd = image.dataset.ad === 'false' ? false : true; if (!isAd) { // if image targetElementAd.classList.remove('block'); targetElementAd.classList.add('hidden'); targetElementImage.classList.remove('hidden'); targetElementImage.classList.add('block'); targetElementImage.src = image.src; } else { // if ad targetElementImage.classList.remove('block'); targetElementImage.classList.add('hidden'); targetElementAd.classList.remove('hidden'); targetElementAd.classList.add('block'); _bsa.init('custom', zoneId, 'placement:digg', { target: `.${gallery.dataset.uuid} .viewport div.ad`, template: galleryAdTemplate, clear_contents: true, }); } } // Add event listeners to change main image. // Add listeners for next and previous. galleries.forEach(gallery => { gallery.querySelectorAll('gallery .thumbnails img').forEach(image => { image.addEventListener('click', evt => { evt.preventDefault(); addThumbnailOpacities(gallery); renderGalleryMainView(gallery, evt.target); const picture = gallery.querySelector('picture'); picture.dataset.active = evt.target.dataset.idx; evt.target.classList.remove('opacity-40'); }); }); gallery.querySelector('.next').addEventListener('click', evt => { evt.preventDefault(); const picture = evt.target.closest('picture'); const thumbnails = evt.target.closest('.thumbnails'); const count = parseInt(picture.dataset.count, 10); let active = parseInt(picture.dataset.active, 10); active++; if (active > (count-1)) active = 0; picture.dataset.active = active; const image = picture.parentElement.querySelectorAll('.thumbnails img')[active]; renderGalleryMainView(gallery, image); addThumbnailOpacities(gallery); image.classList.remove('opacity-40'); }); gallery.querySelector('.previous').addEventListener('click', evt => { evt.preventDefault(); const picture = evt.target.closest('picture'); const thumbnails = evt.target.closest('.thumbnails'); const count = parseInt(picture.dataset.count, 10); let active = parseInt(picture.dataset.active, 10); active--; if (active < 0) active = (count - 1); picture.dataset.active = active; const image = picture.parentElement.querySelectorAll('.thumbnails img')[active]; renderGalleryMainView(gallery, image); addThumbnailOpacities(gallery); image.classList.remove('opacity-40'); }); }); } })();'''
