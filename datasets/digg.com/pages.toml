title = "Do States With The Fewest Gyms Have The Highest Obesity Rates? | Digg"
description = """
Across the US, the average obesity rate is 33 percent — but how does that number vary from state to state, and could the availability of gyms have something to do with it?
In the map below, Veridion compared the obesity rate and number of gyms per 100,000 people in each US state. Figures are accurate as of 2024.
Massachusetts has the most gyms per 100,000 inhabitants (10.6), as well as the second-lowest obesity rate (27 percent).
At 25 percent, Colorado and Hawaii are tied for lowest obesity rate in the US. There are 9.9 gyms for every 100,000 Colorado residents, while Hawaii has 8.4 gyms per 100,000 people.
The lowest number of gyms per 100,000 residents was found in West Virginia (3.1), whose obesity rate of 41 percent is the highest in the country.
Kentucky and Alabama share the second-highest obesity rate overall (40 percent), and have 4.2 and 4.3 gyms for every 100,000 people, respectively.


Via Veridion/Voronoi."""
