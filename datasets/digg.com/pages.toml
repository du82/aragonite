["https://digg.com/data-viz/link/highest-earning-oscar-nominees-per-minute"]
title = "The Highest-Paid Oscar Nominees, Per Minute On Screen | Digg"
description = '''
With the 2025 Academy Awards taking place on March 2, Casino.org wanted to know which of the past decade's Oscar nominees were highest-paid for their roles, so they analyzed revenue and screen time data to work out Oscar-nominated actors' earnings per minute on screen.
Bradley Cooper leads the highest-earning Oscar nominees since 2015,  racking up a staggering $591,856 for each of the 84 minutes he spent on screen in "American Sniper".
The second-ranking actor is Joe Pesci, whose role in 2019's "The Irishman" earned him $461,148 per minute. Will Smith takes third place, making $443,607 for every minute he showed up in "King Richard."
Of the 10 highest-paid Academy Award nominees on the list, just two are women. The eighth spot went to Meryl Streep, who made $353,153 for every 60 seconds on screen in "The Post," while ninth-ranking Octavia Spencer was paid $314,848 per minute for her role in Oscar-nominated fantasy "The Shape of Water."
On average, Oscar-nominated men have made $99,998 per minute of screen time over the past 10 years, while Oscar-nominated women have earned $72,839. That's a pay gap of $27,159.
Click image to enlarge

Via Casino.org.'''
full_description = '''big bucks Hollywood's Highest-Paid Oscar Nominees, Per Minute On Screen Darcy Jimenez In the last decade, eight of the ten highest-earning, Oscar-nominated actors have been men. 3 days ago · 6.7k reads · · · With the 2025 Academy Awards taking place on March 2, Casino.org wanted to know which of the past decade's Oscar nominees were highest-paid for their roles, so they analyzed revenue and screen time data to work out Oscar-nominated actors' earnings per minute on screen. Bradley Cooper leads the highest-earning Oscar nominees since 2015, racking up a staggering $591,856 for each of the 84 minutes he spent on screen in "American Sniper". The second-ranking actor is Joe Pesci, whose role in 2019's "The Irishman" earned him $461,148 per minute. Will Smith takes third place, making $443,607 for every minute he showed up in "King Richard." Of the 10 highest-paid Academy Award nominees on the list, just two are women. The eighth spot went to Meryl Streep, who made $353,153 for every 60 seconds on screen in "The Post," while ninth-ranking Octavia Spencer was paid $314,848 per minute for her role in Oscar-nominated fantasy "The Shape of Water." On average, Oscar-nominated men have made $99,998 per minute of screen time over the past 10 years, while Oscar-nominated women have earned $72,839. That's a pay gap of $27,159. Click image to enlarge Via Casino.org. // This loops through links inside of additional content and adds appropriate properties const markdownAdditionalContentLinks = document.querySelectorAll('.additionalContent a'); if (markdownAdditionalContentLinks) { markdownAdditionalContentLinks.forEach((link) => { link.setAttribute('rel', 'nofollow'); link.setAttribute('target', "_blank"); }); } gallery { display: none; } gallery div.viewport, gallery img.image { padding: 0 !important; height: 400px !important; } gallery div.viewport div.ad > div { max-width: 100%; max-height: 100%; } gallery .thumbnails img { width: 40px !important; height: 40