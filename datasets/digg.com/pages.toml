str(2, length); return timestamp + randomString; } if (galleries) { const template = document.querySelector("#galleryTemplate"); const templateThumbnail = document.querySelector("#galleryTemplateThumbnail"); galleries.forEach(gallery => { // Add ads to the gallery. const galleryImages = gallery.querySelectorAll('img'); galleryAdPositions.forEach(slot => { if (slot > galleryImages.length) return; const placeholderAdSlot = document.createElement('img'); placeholderAdSlot.dataset.ad = true; placeholderAdSlot.dataset.src = "https://placehold.co/1000x1000?text=Ad"; gallery.insertBefore(placeholderAdSlot, gallery.children[slot]); }); // Process the gallery. const images = []; const imageElements = gallery.querySelectorAll('img'); imageElements.forEach(image => { images.push({ ad: image.dataset.ad || false, src: `https://digg.com/cdn-cgi/image/width=600,height=400,quality=90,fit=cover/${image.dataset.src}`, }); }); if (images.length) { const clone = template.content.cloneNode(true); gallery.innerHTML = ''; const galleryUUID = `gallery-${generateRandomId(20)}`; gallery.classList.add(galleryUUID); gallery.dataset.uuid = galleryUUID; // Setting first image as main one. clone.querySelector('img.image').src = images[0].src; clone.querySelector('img.image').classList.remove('hidden'); // Setting number of images available. clone.querySelector('picture').dataset.count = images.length; // Add thumbnails. images.forEach((image, idx) => { const thumbnailClone = templateThumbnail.content.cloneNode(true); const thumbnail = thumbnailClone.querySelector('div img'); thumbnail.src = image.src; thumbnail.dataset.idx = idx; thumbnail.dataset.ad = image.ad; if (idx == 0) { thumbnail.classList.remove('opacity-40'); } clone.querySelector('.thumbnails').appendChild(thumbnailClone); }); gallery.appendChild(clone); gallery.style.display = 'block'; } }); function addThumbnailOpacities(gallery) { gallery.querySelectorAll('.thumbnails img').forEach(image => { image.classList.add('opacity-40'); }); }