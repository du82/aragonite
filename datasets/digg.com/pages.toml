t('picture'); const thumbnails = evt.target.closest('.thumbnails'); const count = parseInt(picture.dataset.count, 10); let active = parseInt(picture.dataset.active, 10); active--; if (active < 0) active = (count - 1); picture.dataset.active = active; const image = picture.parentElement.querySelectorAll('.thumbnails img')[active]; renderGalleryMainView(gallery, image); addThumbnailOpacities(gallery); image.classList.remove('opacity-40'); }); }); } })();'''
