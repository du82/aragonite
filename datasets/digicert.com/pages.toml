["https://digicert.com/blog/25-security-blogs-and-pki-experts-you-need-to-follow-today"]
title = "25 Security Blogs and PKI Experts You Need to Follow Today | DigiCert"
description = "As it stands, the global cybersecurity market is worth $173B and predicted to grow to $270B by 2026. To get the inside track, we've compiled a list of the top 25 blogs and experts, in the security and PKI space that will get your questions answered."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. As it stands, the global cybersecurity market is worth $173B and predicted to grow to $270B by 2026. It's fair to say, then, the sector is expanding quickly, with security and public key infrastructure (PKI) becoming an increasing priority for organizations as everyone adapts to a remote post-COVID-19 world. But with constant updates and dramatic news headlines, it can be hard to stay on top of the latest insights. So to get the inside track, we've compiled a list of the top 25 blogs and experts, in no particular order, in the security and PKI space that will get your questions answered: The IACR is a non-profit, scientific organization with a view to advance research in the cryptography field. Their blog is full of news, events and publications, and there's also an option to become a member for added insights. This site is home to the security bloggers network (SBN), which is over 400 blogs strong. It promotes content from leading bloggers in the security space, and a quick search will provide you with a number of PKI-related discussions. InfoSec News is a long-running and well-respected source of cybersecurity news, and the cryptography section of this blog features hand-curated news and a steady stream of helpful content. This blog is run by Byron Acohido, a Pulitzer-winning journalist and respected cybersecurity influencer. It heavily features his take on PKI's expanding role in digital transformation. Considered a leading news outlet in the industry, Dark Reading offers a broad range of cybersecurity topics, from analytics and application security to mobile and cloud security. It's regularly updated, so you'll never fall out of the loop. Brian Honan writes plenty of timely, news-related cybersecurity updates and roundups on his BH Consulting blog. It’s perfect for keeping up with today’s rapidly changing security landscape."
