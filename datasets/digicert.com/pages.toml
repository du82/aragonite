full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Best Practices 09-18-2014 Intro to Penetration Testing Part 2: Adopting a Pen Tester's Mindset DigiCert Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. This is the second post in a four-part pentesting series, focusing on re-evaluating home network security and employing home network security best practices. Penetration testing (pentesting) evokes an image of a team of skilled programmers and hackers attacking a corporation's network security, searching for vulnerabilities to exploit like in the 90's movie Sneakers. Although you may think of pentesting being done only in the corporate world, the concept of pentesting—strengthening network security—can be applied to your home network. Although you may not be a pentester, you can use the mindset of one to evaluate whether your home network is secure. We'll use two scenarios to help you think like a pen tester when it comes to your home network security. In each scenario, Bob the burglar (representing a pen tester) will attempt to break into two houses. House A is occupied by John and is Bob's first target. Bob begins by observing John, his habits, noting the times when John is home and when John is absent. During some of John's absences, Bob probes the outside of House A—careful to remain unseen—searching for easy access. Bob notices that the front door does not have a deadbolt, the door itself appears to be flimsy, and the door knob is old and loose. He sneaks to the backyard and finds an old sleeping guard dog. Continuing, he finds that the windows on the ground level have no locks. On a different day, he observes that John leaves a spare key under the front door mat. Rather than breaking a window or door, Bob opts for the easiest way into House A by using the key under the mat."
