["https://digicert.com/cn/insights/zero-trust"]
title = "零信任 | 数字信任的基础 | DigiCert洞见"
description = "什么是零信任？ 在当今的数字环境中，基于边界的安全性已经不够了。为了建立真正的数字信任，我们必须采用零信任方法，每次都要验证每个访问请求。"
full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 零信任：数字信任的 基础 保护边界已经不再是可行的 安全策略。不信任任何人是 实现数字信任的关键。 在一个已让握手、印章和签名都实现了数字化的世界里，信任有了全新的含义。 零信任遵循一个简单原则：永不信任，始终验证。验证不仅提供与握手或公证人印章相同的安全级别——它甚至更安全，它在企业环境中围绕每个应用程序、服务和网络建立不可逾越的堡垒。这一切都要归功于PKI。 无边界的数字信任 随着创新者不断突破远程工作的极限，零信任将越来越成为当务之急，而不是待实现的目标。美国国防部有一个专门负责零信任的办公室，而且全球具有安全意识的组织也在效仿。 对零信任的推动正在加强世界各地人和设备之间的连接，并在不牺牲便利性或易用性的情况下增强数字信任。 在整个组织中 建立零信任 通过使用DigiCert® Trust Lifecycle Manager，能在不牺牲灵活性的情况下降低风险，这是一种不限定CA的证书生命周期管理和PKI服务解决方案，可在集中化可见性和控制的同时保护身份与访问。"
