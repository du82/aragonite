["https://digicert.com/blog/anonymous-facebook-via-tor"]
title = "Supporting the Anonymous Use of Facebook via Tor | DigiCert.com"
description = """
Announcements
\t \t  \t   
\t           11-05-2014
\t\t\t   Supporting the Anonymous Use of Facebook via Tor
\t \t  \t   
\t \t  \t   \t  Jeremy Rowley"""
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Friday, Facebook announced that the popular social network will be available to users of the Tor anonymizing browser. To eliminate warnings that might prevent users from accessing the .onion service, help users identify the service, and help reduce the likelihood of spoofing attacks, DigiCert issued a digital certificate to Facebook’s .onion address. DigiCert supports the goals of both Tor and Facebook in this endeavor and is proud to issue certificates for use with these services. The Tor project helps users browse the web anonymously—and service providers, like Facebook, have a strong interest in identifying their service to Tor users. Using a digital certificate from DigiCert, Tor users are able to identify the exact .onion address operated by Facebook. Tor users can evaluate the digital certificate contents to discover that the entity operating the onion address is the same entity as the one operating facebook.com. According to privacy and security researcher, Runa Sandvik (who also is a Tor advocate and volunteer), this action represents the first publicly trusted SSL Certificate issued for the Tor browser and its .onion top-level domain. This action also helps solve other security architectural issues resulting from incongruities between Facebook’s policies and the way Tor operates. For example, when users have previously connected to Facebook via Tor, they could receive “SSL Certificate Warning” messages and were unable to reliably verify that they were connecting to the authentic Facebook site. Also, users were often locked out when connecting over Tor because of the infrastructure of routing users around the world. In these cases, Facebook would treat users as “hacked’ since their location would vary throughout the world. Using the .onion address prevents the lock-out from occurring."
