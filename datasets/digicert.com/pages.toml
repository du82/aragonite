["https://digicert.com/blog/a-guide-to-tls-certificate-revocations"]
title = "A Guide to TLS Certificate Revocations | DigiCert.com"
description = "A Guide to TLS/SSL Certificate Revocations. Certificate revocations can be disruptive and painful to customers and relying parties. We often get questions about why certificates were revoked, who said we need to revoke them and why more notice was not provided. This article provides background and details to these and other related questions."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Certificate revocations can be disruptive and painful to customers and relying parties. We often get questions about why certificates were revoked, who said we need to revoke them and why more notice was not provided. This article provides background and details to these and other related questions. The CA/Browser (CA/B) Forum is one of several entities that provide rules and standards for publicly trusted TLS/SSL certificates. The forum is NOT an enforcement or adjudication body. It merely sets standards in a collaborative environment among certificate authorities (CAs) and browsers. In addition to the forum, rules come from Browser Root Program policies from browsers such as Mozilla, Microsoft, Apple and Google, as well as auditing standards like WebTrust. These rules specify how digital certificates must be issued, what the SSL validation requirements are, what the rules are regarding revocation and many other related topics. Publicly trusted certificates must be issued in accordance with these various rules, and those that are not must be revoked. As all publicly trusted TLS certificates are published in Certificate Transparency logs, it is very easy for the public to monitor certificate issuance and report non-compliance with the rules. If a digital certificate is found to be issued in violation of these rules, which could mean anything from a spelling error of a city name to the use of a weak key, it must be revoked per the timelines specified in the CA/B Forum documents. This revocation is mandated by the Mozilla program rules in section 6.1: For any certificate in a hierarchy capable of being used for SSL-enabled servers, CAs MUST revoke certificates that they have issued upon the occurrence of any event listed in the appropriate subsection of section 4.9.1 of the Baseline Requirements, according to the timeline defined therein. CAs MUST also revoke any certificates issued in violation of the then-current version of these requirements according to the timeline defined in section 4.9.1 of the Baseline Requirements."
year_published = 2025
