["https://digicert.com/blog/1-year-tls-ssl-certificates-are-here-what-now"]
title = "1-Year Certificates are Here: What Now? | DigiCert.com"
description = "Starting today, certificates have a max validity of 398 days, approximately one year. It’s here, whether you’re ready or not. Since Apple announced they would enforce shorter lifetimes on certificates, both Chrome and Mozilla followed their lead."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. With shrinking lifetimes, using spreadsheets and notifications to manage certificate expirations is not viable. As the leader in the industry, DigiCert is continuing to develop innovative solutions to help customers do this more simply, through DigiCert CertCentral® and automation. Shorter certificate lifetimes are here, whether you’re ready or not. After Apple announced they would enforce shorter lifetimes on certificates, both Chrome and Mozilla followed suit and adopted similar policies. Starting today, certificates have a max validity of 398 days — just over one year. This shorter certificate lifetime can lead to management challenges unless administrators incorporate automation. Fortunately, DigiCert has innovative solutions to simplify certificate management in CertCentral. Even without shorter certificate lifetimes, tracking manually on a spreadsheet is a burdensome job. Plus, it's prone to human error. Certificate management requires close attention to remain compliant with industry standards and stay up to date with hardware and software updates. You essentially have to do all of the following: While this process may work for small organizations, it certainly struggles to hold up at scale. And certificate outages can have serious consequences. Lack of visibility is a top challenge many organizations face in managing their certificates. It is why many organizations operate without knowing if all their certificates are valid and is one of the largest contributors to the certificate-related outages that are damaging brands. One expired TLS certificate can shut down a website for hours or days, costing a company potentially millions in revenue. DigiCert supports shortening certificate lifetimes because it allows us to make updates to the certificate ecosystem faster (transition from SHA1 to SHA2 and longer keys). In fact, DigiCert has supported short-term certificates for a long time, even certificates that only last hours. And we have the ability to issue flexible certificate lifetimes as short as hours through our APIs. Most organizations do not have the certificate agility to do that. See more details in our Position on 1 Year Certificates blog."
year_published = 2025
clearnet = "https://digicert.com/blog/1-year-tls-ssl-certificates-are-here-what-now"
