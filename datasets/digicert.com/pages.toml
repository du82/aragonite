["https://digicert.com/blog/advancing-goal-automated-pki-secure-devops"]
title = "Advancing the Goal of Automated PKI for More Secure DevOps | DigiCert.com"
description = """
Announcements
\t \t  \t   
\t           04-18-2017
\t\t\t   Advancing the Goal of Automated PKI for More Secure DevOps
\t \t  \t   
