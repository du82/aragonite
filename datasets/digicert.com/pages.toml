["https://digicert.com/blog/a-star-is-born-and-reborn"]
title = "A Star is Born. And Reborn. | DigiCert.com"
description = "Today, DigiCert announced the availability of DigiCert Secure Site, DigiCert Secure Site EV, DigiCert Secure Site Multi-Domain, DigiCert Secure Site EV Multi-Domain, and DigiCert Secure Site Wildcard. And these five products from our reincarnated Secure Site family represent the first opportunity for you to sell DigiCert-branded certificate products which combine the Norton Seal (and the new DigiCert Secured site seal) with even higher warranties than any previous Secure Site product."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Reincarnation is often referred-to as “life after death”. But I’m now a believer that reincarnation happens without requiring something’s death first. To demonstrate my point, take the example of today’s announcement of our new TLS/SSL certificate product family: DigiCert Secure Site™. Ah yes, just think of the parallel possibilities: you suddenly have options for offering two flagship product lines from us – because there’s now multiple flagship Secure Site TLS/SSL certificate families for you to offer to your customers. Today, we’ve announced the availability of DigiCert Secure Site, DigiCert Secure Site EV, DigiCert Secure Site Multi-Domain, DigiCert Secure Site EV Multi-Domain, and DigiCert Secure Site Wildcard. And these five products from our reincarnated Secure Site family represent the first opportunity for you to sell DigiCert-branded certificate products which combine the Norton Seal (and the new DigiCert Secured site seal) with even higher warranties than any previous Secure Site product. But your customers aren’t the only ones who suddenly get choices. You do, too: Remember how I’ve been blogging about the development of our new partner portal based on DigiCert’s award-winning CertCentral platform? Since we won’t migrate the data from the Website Security partner portals until the CertCentral partner portal moves out of beta, you can now offer the DigiCert Secure Site certificates independently from the Symantec Secure Site products – or you can simply wait to offer them all from the CertCentral partner portal once we release it to general availability. Either way, all the Symantec-branded Secure Site products will be available to you, alongside their reincarnations."
