["https://digicert.com/blog/3-trends-from-digicerts-pki-automation-survey"]
title = "3 Things that Stood Out to Us from DigiCert’s PKI Automation Survey"
description = "Previously, we discussed what separates a PKI automation leader from a laggard, as DigiCert learned in its 2021 State of PKI Automation Survey. I’ll now wrap up this blog series with a discussion of three trends that stood out in the study."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Automation 10-27-2021 3 Things that Stood Out to Us from DigiCert’s PKI Automation Survey David Bisson Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Previously, we discussed what separates a PKI automation leader from a laggard, as DigiCert learned in its 2021 State of PKI Automation Survey. I’ll now wrap up this blog series with a discussion of three trends that stood out in the study. When DigiCert examined its survey data, it noticed a discrepancy between its expectations of how easy it would be for some organizations to manage their certificates and the experience those organizations had with PKI certificate management. This was especially evident for organizations with the fewest number of certificates. Given those organizations’ relatively low PKI certificate imprint, DigiCert predicted that those entities wouldn’t have too many difficulties. But the opposite was true. They were more likely to have suffered outages related to unexpected certificate expiration, and they performed worse than organizations with greater numbers of certificates across a variety of PKI management metrics. Given those findings, it’s therefore not surprising that those “low-volume PKI certificate” organizations were 50% more likely to express concern about the time required for PKI management certificates than enterprises with more certificates. This development boils down to PKI management maturity. If organizations have a low volume of certificates, they might be more inclined to look at their environments and say, “We really don’t have a lot of certificates to manage. Why do we need automation?” As a result, they might not work through the path of ironing out vital integrations and doing other tasks associated with PKI automation, as they might not be convinced that work is important."
year_published = 2025
