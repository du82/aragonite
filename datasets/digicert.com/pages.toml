["https://digicert.com/blog/2024-security-predictions"]
title = "DigiCert 2024 Security Predictions | DigiCert"
description = "it’s once again time to look back on security developments over the past year, gaze into the future, and make some bold security predictions about the future"
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. As 2023 draws to a close, it’s time once again to look back on the past year’s security developments and make some bold predictions about the future of technology, identity and digital trust. Artificial intelligence (AI) was all over the news in 2023, and 81% of participants in a recent survey expressed concerns about the security risks associated with ChatGPT and generative AI. So it’s no surprise that AI is driving security trends for the year ahead, teaming up with quantum computing as the two hot-button issues most poised to transform cybersecurity strategies. What other trends are impacting the outlook for 2024? Our team of cybersecurity experts, including Avesta Hojjati, Dean Coclin, Lorie Groth, Brian Trzupek and Tim Hollebeek weighs in on what’s in store. A recent Ponemon Institute survey revealed that, while the risk of “harvest now, decrypt later” cyberattacks worries most IT leaders, many business executives are still unaware of quantum computing’s implications. The survey also revealed that the majority of organizations lack clarity in ownership, budget and strategy for post-quantum cryptography (PQC) preparation. Fostering proactive, effective communication is key. In 2024, PQC education and planning activities will accelerate investments in this area. We predict companies will move aggressively to start enforcing policies around PQC. NIST is expected to release its final standards in February, which will push organizations to take steps to consider, document and specify their quantum strategy and crypto-agility approach. One of the most vital steps will be a move to a certificate management platform and discovery. The eIDAS regulation has long played a key role in the governance of electronic identification and trust services for the EU. A new piece of legislation places a stronger emphasis on Qualified Website Authentication Certificates (QWACs), requiring browsers to display the information in these certificates prominently and intuitively."
