["https://digicert.com/blog/a-guide-to-multi-factor-authentication"]
title = "A Guide to Multi-Factor Authentication | DigiCert.com"
description = "What Is Multi-Factor Authentication? How Does Multi-Factor Authentication Add Security Benefits? What Multi-Factor Authentication Options Are Available for Mobile Devices? How Is Multi-Factor Authentication Implemented in the Cloud? Read on for more info."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Today, computers and smart devices are inexpensive enough that we can own many of them: smart phones, laptops, tablets and wearable micro devices. Our work and private lives demand portability. This, along with a trend towards moving enterprise servers into the cloud, makes secure user authentication even more imperative — and tricky. That brings us to multi-factor authentication: what it is and how it is achieved. The goal of multi-factor authentication is to create a layered defense of two or more independent credentials: what you know (password), what you have (security token) and what you are (biometric verification). Requiring multiple factors to authenticate a user makes it more difficult for an unauthorized person to gain access to computers, mobile devices, physical locations, networks or databases; each successive layer should help protect where other layers may be weak. In fact, multi-factor authentication blocks 99.9% of automated attacks, according to Microsoft. Multi-factor authentication is becoming more common, particularly in the financial industry, and is advancing to include retina and fingerprint scanning, voice recognition and even facial recognition. If only it were possible to develop a single method of authentication that was 100% accurate and could not be hacked, we wouldn’t need multi-factor authentication. But passwords can be seen, overheard, guessed or bypassed; a token can be lost or stolen; and an identical twin or using a photograph may even work to fool biological recognition systems. That is why multi-factor authentication is currently very important to account security. The concept of security using multi-factor authentication is that, while there may be a weakness in one authentication factor — say, a stolen password or PIN — the strength of a second or third factor would compensate to provide proper authorization for access."
