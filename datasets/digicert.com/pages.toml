["https://digicert.com/blog/2020-quantum-advances-and-2021-predictions"]
title = "2020 Quantum Advances and 2021 Predictions | DigiCert.com"
description = "We’ve rounded up some of the significant quantum advances of 2020 and prepared our predictions for what you can expect going into 2021."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. This year quantum computing is reaching a turning point. Quantum computing has made significant progress in 2020, and we predict the advancements in 2021 will bring it closer to reality than ever before. However, preparing for post-quantum computing will likely take longer than you expect and you need to start preparing now to protect your organization. We’ve rounded up some of the significant quantum advances of 2020 and prepared our predictions for what you can expect going into 2021. A lot happened in 2020, and while many of us transitioned to work from home, quantum development continued to push forward. Here’s a timeline of some of the quantum advances in 2020. Given the many advances made this year toward achieving practical, large-scale quantum computers, the easiest 2021 prediction is that these advances will continue. And that prediction will almost certainly be correct. One of these companies will likely announce in 2021 that they have used a quantum computer to successfully solve a practical problem that cannot be solved by conventional supercomputers. Solving a problem with quantum unsolvable by conventional supercomputers is the next major milestone in the evolution of commercially viable quantum computers. On its own, it doesn’t mean that encryption methods like RSA or ECC are at risk, since breaking encryption algorithms requires fairly large quantum computers, and those will not exist in 2021. But the ability to solve practical problems will drive additional investment in developing better quantum computers. That is the same virtuous feedback loop that led to Moore’s law, where classical computers became exponentially more powerful every year. Cryptographic transitions take time, often decades, so organizations will have to start preparing now if they want to be ready when sufficiently large quantum computers exist. Standards organizations and security experts are busy working on laying the groundwork for those transitions. The National Institute for Standards and Technology (NIST) recently held a workshop on Considerations in Migrating to Post-Quantum Cryptographic algorithms, and NIST will likely select a few algorithms for standardization in late 2021. This will hopefully jumpstart the efforts to get these algorithms deployed."
