["https://digicert.com/blog/anthem-hack-preventable"]
title = "Anthem Hack: Was It Preventable? | DigiCert.com"
description = """
Best Practices
\t \t  \t   
\t           02-14-2015
\t\t\t   Anthem Hack: Was It Preventable?
\t \t  \t   
\t \t  \t   \t  Scott Rea"""
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. As details of last week's Anthem hack of up to 80 million customer records continue to emerge, it appears that some fundamental security controls—such as two-factor authentication and encryption—could have helped prevent or significantly minimize the attack. Reports suggest that attackers accessed Anthem’s database using a stolen name and password obtained from one of the company’s senior administrators. If a successful spearphishing attack is found to be the culprit, it will serve as an important reminder of the need for information security policies that utilize security layers and deploy available tools at multiple levels to protect organizational data. As of today, tens of millions of Anthem customers deal with the fallout. Anthem customers’ most privy personally identifiable information is now available to attackers: social security numbers, addresses, birthdates, phone numbers, e-mail addresses, and employment information (such as their salaries). It’s hard to imagine that it could have been worse, but at least Anthem indicated that no medical records were stolen, and no credit card numbers appear to have been swiped. With Anthem being a healthcare-related organization, it’s no surprise that they would be targeted for any Private Healthcare Information (PHI) they hold, with reports claiming the value of medical records on the black market today to be up to $50 per record. The negative consequences of leaked social security numbers can be enduring for Anthem’s customers. As the baseline method of identification in the U.S., social security numbers can be used to imitate someone’s identity, including applying for credit cards or even filing fraudulent tax refunds in the victim’s name. Since a social security number is an underlying form of personal identity, it’s not easily changed without enduring a painful process. A credit card, on the other hand, could easily be canceled with a new one to be issued."
year_published = 2025
