["https://digicert.com/blog/8-steps-stronger-wifi-security"]
title = "8 Steps to Stronger WiFi Security | DigiCert.com"
description = """
Best Practices
\t \t  \t   
\t           10-21-2014
\t\t\t   8 Steps to Stronger WiFi Security
\t \t  \t   
\t \t  \t   \t  DigiCert"""
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. With the continuous proliferation of public hotspots, and increase in a remote workforce, more and more attention has been drawn to the security measures in place to prevent wireless man-in-the-middle attacks. You should start by using TLS/SSL Certificates to provide network security. However, in addition to employing TLS Certificates to provide network security, these WiFi security options will dramatically improve the security of your network. Like all passwords, the WPA2 password that you use to secure your wireless network should be long and sophisticated enough to foil hackers attempting to “aircrack” your password. Avoid personal names, simple dictionary words, or easily guessed numbers should be avoided. The easy first step to improved security is to change the default username and password. Since most routers don’t require a physical connection to log into the admin interface, eliminating this vulnerability removes the lowest hanging fruit available to hackers. If your hardware can only support WEP or WPA encryption, you should replace it. The Wi-Fi Alliance strongly recommends the uniform adoption of WPA2. Cutting-edge encryption has been proven to be secure against even the most committed attackers as long as it is properly implemented. If you manage an enterprise environment, you should be using the additional protection afforded by dedicated digital certificates. Taking your WiFi security a step further requires securing your administrative login pages with a digital certificate for WiFi. The self-signed certificates that come pre-installed on some routers are publicly untrusted, easy to duplicate, and vulnerable to Man-In-The-Middle (MITM) attacks. TLS Certificates from trusted Certificate Authorities will ensure that all of your communication via WiFi remains secure and private. If your router doesn’t cover digital certificates in the quick start guide, you can find instructions on the manufacturer’s support website."
