["https://digicert.com/blog/announcing-certcentrals-new-keylocker"]
title = "Announcing DigiCert CertCentral’s New KeyLocker | DigiCert"
description = "As companies struggle to ensure compliance with new CA/Browser Forum requirements that all code signing private keys be stored in FIPS 140-2 compliant hardware, DigiCert announces a new capability called DigiCert KeyLocker to address these requirements"
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Convenient, easy to access, inexpensive way to comply with new CA/B Forum changes for code signing private keys. As companies struggle to ensure compliance with new (as of June 1) CA/Browser (CA/B) Forum requirements that all code signing private keys be stored in FIPS 140-2 compliant hardware, DigiCert announced a new capability called DigiCert KeyLocker to address these compliance requirements. Over the past several decades, there have been countless incidents where a software developer has stored private code signing keys in insecure locations. A notable example occurred with the Taiwanese computer manufacturer Asus. In this example, private code signing keys were stored on web servers. Hackers breached the webservers, found the code signing credentials, added malware to legitimate Asus driver updates, signed them and in hours, Asus was pushing out infected updates to thousands in their unknowing customer base. Asus isn’t alone. Nvidia and GitHub are a few more notable examples. Most recently, there was an incident with MSI that involved Intel's private keys. If one searches the dark web, it is easy to find, for a price, malware kits along with stolen code signing credentials. Developers are creatures of habit and convenience. They are driven by market pressures to produce new product capabilities faster than ever. They utilize processes and tools — such as DevOps, continuous integration and continuous deployment (CI/CD) and cloud native infrastructure — which heavily rely on automation. In addition, security often isn’t their primary focus. These factors often can lead to shortcuts — that is, code signing private keys being stored where they are convenient but not secure."
