["https://digicert.com/blog/10-tips-to-avoid-phishing-scams"]
title = "10 Tips to Avoid Phishing Scams | DigiCert.com"
description = "So what can you do to avoid becoming a victim of Phishing Scams? Read our top 10 Tips to avoid Phishing Scams and protect your self from harmful risks."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Have you noticed more spam mail this year? You’re not alone. In 2020, spam emails averaged just over 50% of all global email traffic. Furthermore, PhishLabs identified a 47% increase in phishing attempts from 2020 to 2021. They’ve become all too commonplace: those pesky emails that flood your inbox, designed only to siphon your personal and most sensitive information without you knowing. Some are easier to detect than others; if you get an email from a Nigerian prince looking for a place to store his fortune, for example, it’s probably best to delete it. Unfortunately, these “Nigerian” scammers were still a major threat in 2020, especially with content related to the pandemic. But others are craftier, better designed and harder to detect. These digital scam artists have become quite adept at making fraudulent emails look exactly like legitimate ones, often time from businesses or establishments with which you are familiar and trust. Phishing emails commonly impersonate businesses like PayPal, Apple and banks to steal your personal information like account login. But according to the PhishLabs report, social media accounts are also a trending target, as many users are more carless about securing them. It’s not just emails either. So what can you do to avoid becoming a victim? There are steps you can take to minimize your risk. By following these 10 tips you'll be well on your way to becoming a phishing scam defense expert. Phishing is defined as leveraging or exploiting the design of web pages, text messages, social media direct messages and emails in a social engineering attack that tricks the user into thinking they are in a legitimate and secure web session with a trusted site or individual. Often phishing emails will contain links to these phishing sites, which appear to be real. In reality, the phishing site is designed to install malicious software or acquire personal information, including credit card numbers, personal identification numbers (PINs), social security numbers, banking numbers and passwords. This information is then used by the phisher for identity theft, to steal money or for other fraudulent purposes."
