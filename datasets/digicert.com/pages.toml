["https://digicert.com/insights/post-quantum-cryptography/sphincs"]
title = "SPHINCS+ | Post-Quantum Cryptography | DigiCert Insights"
description = "SPHINCS+ is stateless, hash-based signature scheme that protects data against quantum computing attacks. A Post-Quantum Cryptography solution."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português What is SPHINCS+? SPHINCS+ is stateless, hash-based signature scheme that protects data against quantum computing attacks. As a Post-Quantum Cryptography solution, its primary advantage is a small signature size with fast signing and security that's stronger than other schemes and previous versions of SPHINCS. The scheme was proposed to the NIST Post-Quantum Cryptography project in 2017, and it was adopted as one of the first four NIST-recommended PQC standards in 2022. Improving on SPHINCS for Stronger Post-Quantum Cryptography In an effort to improve on SPHINCS, its designers worked with experts in the field to generate a new version that decreases the signature size while increasing the speed of signing. This improved version, known as SPHINCS+ was presented in three forms: SPHINCS+ -SHA3 (using SHAKE 256) SPHINCS+ -SHA2 (using SHA2) SPHINCS+ -Haraka (using Haraka short-input hash function) NIST Approval In 2016, the United States National Institute of Standards and Technology put out a call for proposals, requesting submissions of post-quantum cryptographic schemes. Round 1 submissions closed on November 30, 2017. Several dozen schemes were presented and considered. SPHINCS+ was one of four schemes recommended by NIST as an accepted standard for PQC, and one of only three recommended for digital signing."
