["https://digicert.com/blog/3-reasons-for-strong-password-policy"]
title = "3 Quick Facts on Why a Strong Password Policy Matters | DigiCert.com"
description = "73% of users have the same password for multiple sites, 33% use the same password every time creating an easy target for breaches and identity theft."
full_description = 'Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Strong password policies have come a long way. When I created my very first online account many, many years ago, my password was the word “cool” (don’t judge me, ok? I was very young at the time). That password has long since been changed, to something much more secure, but passwords still remain part of every day life as more and more of the services we rely upon are managed online through web sites or mobile applications. Users today are inundated with passwords they must remember. Think about it. Website logins, email accounts, social media accounts, banking accounts, smartphone pass codes, ATM pin numbers, and home security system alarm codes all require some type of password. Creating a strong password policy is key to helping users safeguard these critical systems they rely on every day. While additional complexity can seem like an inconvenience to many users, it shouldn’t prevent a strong password policy from implemented in your organization. When it comes to security breaches, we’ve seen an escalation of security breaches. Even major brands have had systems compromised exposing user passwords. While administrators quickly respond and notify users by forcing password changes, their efforts are limited to their own site. Changing a password with one site is not always enough. Chances are that compromised passwords are used elsewhere, leaving users vulnerable to hackers. And it’s closely followed by just as insecure passwords like “password", “welcome", and “12345". A strong password policy doesn’t need to be the only line of defense to your systems and network. Adding multi-factor authentication creates multiple layers of security to protect users and resources.'
