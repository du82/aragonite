["https://digicert.com/blog/2-challenges-health-it-still-faces"]
title = "2 Challenges Health IT Still Faces | DigiCert.com"
description = "Let the National Health IT Week parties commence! But, before we do, let’s reflect on the progress, health and growth of IT and what the industry has seen over the last decade. Despite the progress, we are still far from a state of nirvana, where we realize all of the great promises the technology can bring. The healthcare IT industry still faces challenges. One of the challenges we still face is the interoperability of clinical data.  Many of the EHR systems still refuse to open the doors and communicate and share information with other systems. These walls need to come down so patient data can freely follow the patients, allowing them to be armed with a complete history of their medical care, so doctors can better treat them."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Let the National Health IT Week parties commence! But, before we do, let’s reflect on the progress and growth the industry has seen over the last decade. When I began my career in healthcare 12 years ago at the US Department of Health and Human Services (HHS), the adoption of health IT was in it’s infancy. At the time, there were hundreds of IT vendors selling products of all types that promised improvements in efficiency, medical errors, transportation of medical data, and a myriad of other benefits. Because of the large volume of vendors in the space, many that worked in the industry struggled to know which products were best suited to help them achieve the promises of Health IT. Under the leadership of then HHS Secretary, Michael O. Leavitt, the Department formed a group called the Health Information Technology Standards Committee (HITSC), involving many industry thought leaders to establish baseline standards for health IT around functionality, interoperability, and security. This work eventually led to the creation of the Certification Commission for Health Information Technology (CCHIT), which evaluated and certified HIT vendors based on the standards created by HITSC. IT vendors started certifying their products, and this gave more confidence to those buying IT products in healthcare because consumers knew certified products at least met a baseline standard. This effort also caused many of the bad vendors to move out of the market as they couldn’t keep up with the standards that were now in place. Following these efforts, the adoption of health IT began to accelerate but most of the growth was seen in metropolitan areas. To spur the adoption of health IT in rural communities, Secretary Leavitt decided to leverage the power of the Centers for Medicare and Medicaid Services (CMS). The department developed a Medicare demonstration project that offered healthcare organizations incentive money if they adopted CCHIT certified technology and demonstrated clinical and process improvements. The money acted as a dangling carrot and triggered increasing adoption in smaller communities. When President Obama came into office, his administration quickly decided to move this project out of demonstration and make it a national project with $20 billion in incentive money tied to it. This project is now commonly known as Meaningful Use."
year_published = 2025
