["https://digicert.com/blog/4-considerations-for-iot"]
title = "Four Considerations for Internet of Things | DigiCert.com"
description = """
Certificate Management
\t \t  \t   
\t           06-15-2015
\t\t\t   Four Considerations for Internet of Things
\t \t  \t   
\t \t  \t   \t  Jeremy Rowley"""
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Connected devices are hitting the market in droves. Gartner estimates there will be 25 billion connected devices by 2020. This means there will be billions of connected devices that are potentially transmitting unencrypted data. When these devices include high-value targets, such as medical devices, high energy devices, and devices containing personal data, the risk of a data leak is astronomical. PKI is the best solution. It is established and can provide authentication and encryption for securing the expanding universe of the Internet of Things (IoT). However, implementing PKI for IoT has issues that need to be considered to make it work. Managing millions of certificates is one of the first obstacles for securing IoT. Most organizations are capable and accustomed to managing hundreds, even thousands of certificates, but with IoT we’re not talking about hundreds, thousands, or even ten thousand; we’re talking millions, which is significantly more than what most organizations have had to manage. In the automobile industry alone, there are currently 23 million connected cars, and nearly 100% of all new cars on the market are not secure. With millions of connected devices, certificate management is a huge factor. Manufacturers need to be working alongside Certificate Authorities (CAs) and security researchers so their connected devices can be provisioned with certificates. Provisioning is only the beginning of securing IoT. Manufacturers need to develop devices so their security can be updated with better security as it becomes available. Security is always evolving and becoming better. The same security that worked 20, 10, or even five years ago, is obsolete today. New threats to security are always emerging. A decade ago 512-bit keys were considered secure. However, if you used a 512-bit key today, your site would be vulnerable to brute force attacks. Validity periods for digital certificates exist because what is considered secure today may not be secure in three years. Validity periods ensure that sites keep up with emerging threats."
year_published = 2025
