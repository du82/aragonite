["https://digicert.com/kb/ssl-certificate-installation.htm"]
title = "SSL Certificate Installation Tutorial - Step By Step Instructions"
full_description = "An SSL Certificate is a text file with encrypted data that you install on your server so that you can secure/encrypt sensitive communications between your site and your customers. Learn more about SSL certificates. After you create a CSR (certificate signing request) and purchase a certificate, our Validation team validates and processes your certificate request. (Learn more about the certificate validation process.) Once validated, we issue your SSL Certificate and send it to you via email. You can also download your SSL Certificate in your DigiCert account. Verified Mark Certificates Looking for instructions on how to install your Verified Mark Certificate (VMC)? See our knowledge base article, VMC, PEM file and SVG: Where Does Everything Go? When you install an SSL certificate on a server or SSL-enabled application, you’ll also need to install an intermediate certificate. This intermediate certificate establishes the trust of your SSL certificate by tying it to your Certificate Authority’s root certificate (your DigiCert issued SSL certificate → the intermediate certificate → DigiCert root certificate). To complete the certificate trust chain, a Browser requires the intermediate certificate to be present. Learn more about the role of intermediate and root certificates. Note: For some servers (such as Microsoft), the intermediate certificates are bundled with the SSL certificate. Once you've installed your certificate, we recommend you check to make sure everything is working correctly. Use our free SSL Installation Diagnostics Tool to check your certificate installation. Alternatively, for an easy way to find and manage all the certificates on your network, use our free Discovery Cloud tool. After you’ve installed your SSL certificate, we recommend you make a backup copy of the certificate and store it in a secure place. If a server crashes or needs to be replaced, it is much easier to secure the replacement server. DigiCert has an award-winning in-house technical support team that is here to help you with any digital certificate issues that you have. Our dedication to unparalleled customer support is reflected in the numerous service awards we have won."
