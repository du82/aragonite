["https://digicert.com/blog/4-tips-for-avoiding-malware"]
title = "4 Tips for Avoiding Malware | DigiCert.com"
description = "Despite how easy some malware attacks are for an attacker, malvertisement campaigns can be as dangerous as other forms of social engineering."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. In late 2015, Cyphort reported that malvertising had increased by 325% since the previous year. Malvertisements are ads that can infect a user’s computer when they click on the ad. Malvertising is only becoming more and more of a threat for users every day; the attacks are relatively easy to implement, requiring attackers to pay for adspace in order to attach malware to the ad. As with phishing emails, malvertisers attempt to trick users into infecting their own computer. Malvertisement campaigns can be as dangerous as other forms of social engineering. Malicious ads can reach a thousands of users in a short time. Even when malicious ads are taken down within 24 to 48 hours after they’re discovered, they can infect up to hundreds of thousands of users. This was the case with a large malvertising campaign last month that hit high profile entertainment, news, and sports sites, including MSN, New York Times, BBC, AOL, Xfinity, NFL, and others. The campaign affected thousands of users in the first 24 hours. Ad networks offer an easy way for attackers to customize their malicious ads. Ad networks offer companies the freedom to configure ads to appear only when users use key words or phrases in their searches. Attackers may want to cast a wide net and attempt to scare users into clicking on ads. For example, if a pop-up appears warning users of malware on their computer, the ad will offer to uninstall the malware, and once the user clicks on the malicious ad, they unknowingly install the malware themselves. Attackers may also wish to target high value targets such as executives who are traveling to a conference. The malicious ad could be configured to appear when executives or their assistants search for hotel rates or flights. These ads may entice users to click on them by offering cheaper rates or promotions."
