full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 浏览这些页面，了解DigiCert如何帮助组织建立、管理并扩展数字信任，以解决现实世界的问题。 查看我们的全球后量子研究成果，世界在为量子计算做准备的这场竞赛中位于何处。 我们于2003年成立，我们的创立理念很简单，即如果每个人都能更轻松地实施数字安全性，那么数字安全性就会更好。从公司成立第一天起，我们就一直通过我们的产品、工具和支持服务来帮助人们做到这一点。今天，我们对数字辅助功能的承诺与我们的创立理念和品牌价值观相一致。 DigiCert致力于让我们的所有客户都能有效地访问我们的网站和产品。我们将尽一切合理努力以确保DigiCert制作或赞助的内容符合Web内容辅助功能指南（WCAG）2.1 AA级要求，并符合美国司法部美国残疾人法案（ADA）第508节辅助功能的设计标准。 为了做到这一点，我们建立了一支多元化团队，该团队接受过数字辅助功能方面的培训，并致力于为所有客户提供最佳的数字体验。通过这一持续的数字辅助功能之旅，DigiCert正在努力将可用性功能融入我们的数字体验中，这将为残障客户（包括屏幕阅读器用户、仅使用键盘的用户、视力不佳/视力丧失的用户、听力障碍或听力不佳的用户以及色盲用户提供方便。 我们还为在打字、打手势、移动鼠标​​或阅读时遇到问题的客户提供 辅助技术应用程序 的访问权限。可免费下载由我们的合作伙伴eSSENTIAL Accessibility开发的应用程序。 我们的品牌价值观是1）关心客户和员工 2）为实现数字安全性而做正确的事情 3）开展创新以解决问题。对于DigiCert而言，创造可访问且具有包容性的产品和体验是我们所有价值观的基础。如果您遇到了任何辅助功能方面的问题，请致电1-801-701-9600联系客户服务或给我们发送电子邮件至 support@digicert.com。"
