full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. If you're contacting DigiCert's customer service for support, there's a chance that your day is already not going how you planned. And while we pride ourselves on our 5-star customer support and amazing support representatives, we know that you want to get your problem solved as quickly as possible. Here are four ways you can help your support representative pinpoint your problem faster and get you back to what you were doing. Having this information will be very helpful in solving your problem. Of course, your reason for contacting support may be that you need this information—and that’s OK. But if you have it, it's best to collect this information before you contact support. The more specific you can be about the issue the better. If you have errors with your certificate and your server happens to be behind a firewall or load balancer, letting us know those details up front will be very helpful. If you have an error, copy and paste the exact error message or take a screenshot rather than trying to explain what wasn't working. We just want to help you find a solution. If you made changes to your server configuration (even ones you'd rather not admit to) or something relevant like that, go ahead and tell us. It can avoid wasting a lot of time looking in the wrong places. Your tech support engineer will most likely ask all kinds of questions that may seem obvious or irrelevant to you. We ask these questions to help rule things out, to narrow down the problem, and to give you the quickest solution possible. If you are asked for your order number, or what domain name the certificate in question is for, it’s not because we want to test your knowledge of your account details. There are underlying reasons for our questions, and our goal is to efficiently solve your problem so you can go back to doing what you do."
