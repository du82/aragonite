["https://digicert.com/cn/insights/post-quantum-cryptography/dilithium"]
title = "Dilithium | 后量子加密 | DigiCert深入解析"
description = "Dilithium是一种基于点阵的数字签名方案，可保护数据免受量子计算的威胁。它基于PQC算法的CRYSTAL系列。"
full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 什么是 CRYSTALS-Dilithium？ Dilithium是一种基于点阵的数字签名方案，可保护数据免受量子计算的威胁。它基于后量子加密（PQC）算法的CRYSTAL（代数点阵加密套件）系列。它特别适合抵御选择消息攻击。 由于Dilithium基于模块点阵上的点阵问题的难度，因此它是一种比基于哈希的方案快得多的PQC方案，而且很容易实现，因为它不需要高斯采样。 Dilithium基于Fiat-Shamir with Aborts。 在其底部，Dilithium在Lyubashevsky的Fiat-Shamir with Aborts上运营，以实现其点阵方案。这个范例重复执行，直到验证一个没有中止的循环迭代。使用该协议的结果是小得多公钥，从而以更低的能耗实现更高的安全性和效率。 NIST审批 2016年，美国国家标准与技术研究所发出提案征集，要求提交后量子加密方案。第一轮提交于2017年11月30日结束。几十个方案被提交并审议。 CRYSTALS-Dilithium是NIST推荐的、作为PQC已接受标准的四个方案之一，而且是仅有的三个推荐用于数字签名的方案之一。"
