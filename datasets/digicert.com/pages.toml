["https://digicert.com/cn/difference-between-dv-ov-and-ev-ssl-certificates"]
title = "DV、OV和EV SSL证书之间有什么区别？"
description = "dv、ov和ev ssl证书之间有什么区别？要了解域名验证（DV）、组织验证（OV）和扩展验证（EV）这三类SSL证书之间的区别，首先要了解证书是什么，以及DigiCert等CA如何颁发证书。"
full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 DV、OV和EV SSL证书之间有什么区别？ 三个级别的身份验证、信任和 品牌保护。 解码TLS首字母缩略词 每个SSL证书类型的名称代表着在颁发证书之前进行的验证步骤。例如，域名验证证书是指对URL所有者的简单验证，而组织验证证书则验证域名所有者并对与此URL相关联的商业组织进行身份验证。扩展验证证书是高保障度身份证书，因为这类证书需要对域名所有者、商业组织和业务涉及的法人实体进行验证。 在DV级别，此流程相当短，只要求购买者证明对域名或URL的控制权。验证方式是CA向（WHOIS数据库所列的）域名所有者发送电子邮件。如果您立即需要证书，这算是一种便捷的验证方法，但这种只进行一项检查的验证形式是互联网中最低标准的验证形式，其相应的信任度也应该是最低的。 OV和EV证书的区别在于获取证书所需要的额外的验证层和验证步骤。对于EV和OV证书，CA必须验证域名所有者以及与证书相关联的企业的相关详细信息，包括名称、类型、状态和实际地址。 要获得EV，还需要九个额外步骤，包括验证企业的对外电话号码、开展业务的年限、注册号和管辖权，以及域名欺诈检查、联系人黑名单检查并致电以验证申请者的就业情况。 让您的客户更清楚地了解您的身份 除了证明网站已加密之外，每种TLS/SSL证书还会向客户表明您的证书所代表的组织身份级别。 域名验证 域名验证（DV）证书是身份验证程度最低的SSL证书，即使是恶意bot也可以快速轻松地获取这类证书。这些证书是低成本证书，只需要验证公司或个人能证明他们对想要为其申请证书的Web域名的控制。 要获得DV证书，网站所有者将收到来自颁发CA的确认电子邮件，该电子邮件会被发送至域名的WHOIS记录中所列的电子邮件地址。DV证书通常由不开展业务或不进行信用卡交易的网站使用。 使用DV证书的网站类型： 博客 个人网站 不进行交易或不收集个人信息的网站"
