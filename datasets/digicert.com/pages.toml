["https://digicert.com/blog/6-days-apple-app-store-shutdown-app-secure-2015"]
title = "Only 6 Days Until the Apple App Store Shutdown, Is Your App Ready for 2015? | DigiCert.com"
description = """
Mobile
\t \t  \t   
\t           12-17-2014
\t\t\t   Only 6 Days Until the Apple App Store Shutdown, Is Your App Ready for 2015?
\t \t  \t   
\t \t  \t   \t  Flavio"""
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. There are over 1.2 million apps in the Apple App Store, over 9 million registered app developers, and the app revolution has added more than 291,250 iOS jobs to the U.S. economy since the introduction of iPhone in 2007. This has resulted in Apple paying more than $9 billion in royalties to developers through the App Store. If you are one of these developers, then the annually planned and pending closure of the App Store for the holiday season is already on your mind. Looking forward to 2015, we wanted to share some information security tips to help you keep your app users safe, keep their information private, and help prevent malicious entities from stealing your hard work. Changing the way an app manages permissions requires care and consideration for both how the code is handled and how the user experience is defined. Since these changes have already been documented by Apple, we're going to focus on a few quick tips that can help you keep your app secure moving into 2015. Apps distributed in the App Store are protected with Fairplay DRM, which helps prevent theft and duplication of your apps. However, Fairplay has been broken for some time and tools are readily available to allow malicious users to remove DRM from apps. This means the contents of an app can be easily investigated by third parties, potentially revealing sensitive information about the app, the developer, or how the app is being used. Knowing that DRM will only get you so far, you will want to protect the assets in your app to the best of your ability. One of the easiest ways people can extract information from your app is by investigating the contents through the file system. Here they can see all the files that make up your app."
