["https://digicert.com/cn/insights/post-quantum-cryptography/sphincs"]
title = "SPHINCS+ | 后量子加密 | DigiCert深入解析"
description = "SPHINCS+是一种无状态的、基于哈希的签名方案，可保护数据免受量子计算攻击。后量子加密解决方案。"
full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 什么是SPHINCS+？ SPHINCS+是一种无状态的、基于哈希的签名方案，可保护数据免受量子计算攻击。作为一种后量子加密解决方案，其主要优势在于签名小，签名速度快，安全性强于其他方案和SPHINCS的早期版本。该方案于2017年被提交给NIST后量子加密项目，并于2022年被采纳，成为首批被NIST推荐的四个PQC标准之一。 改进SPHINCS以实现更强的后量子加密 为了改进SPHINCS，其设计者与该领域的专家共同合作生成了一个新版本，该版本在提高签名速度的同时让签名变得更小。这种被称为SPHINCS+的改进版本有三种形式： SPHINCS+ -SHA3（使用SHAKE 256） SPHINCS+ -SHA2（使用SHA2） SPHINCS+ -Haraka（使用Haraka短输入哈希函数） NIST审批 2016年，美国国家标准与技术研究所发出提案征集，要求提交后量子加密方案。第一轮提交于2017年11月30日结束。几十个方案被提交并审议。 SPHINCS+是NIST推荐的、作为PQC已接受标准的四个方案之一，而且是仅有的三个推荐用于数字签名的方案之一。"
