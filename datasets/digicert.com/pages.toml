["https://digicert.com/blog/3-surprising-uses-of-pki-in-big-companies-and-how-to-ensure-they-are-all-secure"]
title = "3 Surprising Uses of PKI | DigiCert"
description = "Learn more about three surprising uses of PKI in big companies like using digital signatures, encrypted and authenticated email communications, and physical and virtual smart card authentication, and how to ensure they are all secure by reading more here."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português PKI 12-28-2020 3 Surprising Uses of PKI in Big Companies and How to Ensure They Are all Secure DigiCert Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. It's the invisible safety net we place behind information, people and devices on the internet. We rely on cryptographic keys and the certificates associated with them to keep our data private and secure. One of the most widespread use cases of PKI is in the TLS/SSL protocol, which secures almost every single encrypted HTTPS communication you can think of: browsing social media websites, reading the news, online shopping. Indeed, more than 80% of websites are protected by HTTPS-encrypted communication, so you use them every day. This means that website TLS certificates are the most widely used PKI certificates. But PKI is much broader than everyday internet traffic and communications. In fact, when you dig a little deeper, you'll discover that PKI is often used for other applications, devices and major portions of our digital lives. After all, sending off a physically signed contract for approval can take a lot of time. And as we all know, the longer something takes, the more frustrating it can be. Legally binding documents may require in-person signing or signing before a witness or notary, so delay is not the only factor. With the coronavirus pandemic, face-to-face signings carry health risks, too. Using digital-signature technology speeds up the signing and approval of important documents — for example, when people sign contracts for new services. You may have already seen this with online services or signing a PDF document. But if you're looking to use digital signing in your business, you need to be sure that the digital signature is genuine, the document hasn't been tampered with and that nobody can see it without permission. That's a job for a digital certificate and the PKI that makes it possible."
year_published = 2025
