["https://digicert.com/blog/45-percent-healthcare-breaches-occur-on-laptops"]
title = "45% of Healthcare Breaches Occur on Stolen Laptops | DigiCert.com"
description = "Stolen devices such as a laptop or a USB thumb drive rarely come up when most people think of data breaches, but breaches caused by stolen devices are."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Stolen devices such as a laptop or a USB thumb drive rarely come up when most people think of data breaches, but breaches caused by stolen devices are a very real threat organizations face. Verizon’s 2015 Data Breach Investigation Report (DBIR) revealed that this type of data breach is common for healthcare organizations, making up almost half (45%) of healthcare data breaches. Not only are these data breaches common, but they can deal a huge financial blow to an organization. One example of this is the Cancer Care Group data breach. In mid-2012, a thief stole a laptop that contained personally identifiable information (PII) such as names, addresses, date of birth, social security numbers, and insurance information for 55,000 current and former patients. The breach cost the Cancer Care Group $750,000 in a HIPAA settlement. Recently, Premier Healthcare suffered a similar data breach when one of their laptops containing 200,000 patients’ PII went missing. Fortunately for Premier Healthcare, the laptop was returned and investigators stated that as far as they could tell the PII in the laptop had not been accessed. Unlike other aspects of data security, e.g., the challenges of securing IoT devices, mitigating data breaches caused by stolen or lost devices is more attainable, if the proper measures are taken. Below are three steps healthcare organizations can use to get started. In both of these examples, the laptops containing PII were not encrypted. Although encryption cannot stop a thief from physically stealing a device, encryption can safeguard the sensitive information contained within by making it unreadable to a thief. Encryption will vary from device to device. Some organizations may choose to encrypt a hard drive, which users can only access using two-factor authentication (two-factor authentication adds another layer of security, usually in addition to a password). Others may choose to encrypt a portion of a drive where sensitive files, etc., are to be stored; again, users would need the proper credentials (and other authentication factors) to decrypt the files stored there. Regardless of the method, encryption can help organizations avoid the cost hundreds to thousands of dollars in fines."
year_published = 2025
