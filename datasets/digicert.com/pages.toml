["https://digicert.com/cn/insights/post-quantum-cryptography"]
title = "后量子加密 | 零到量子 | DigiCert深入解析"
description = "DigiCert对后量子加密的深入解析。什么是量子计算？量子计算和后量子加密将如何影响数字信任？"
full_description = "返回 CHOOSE YOUR LANGUAGE 英语 西班牙语 荷兰语 德语 法语 意大利语 中文（简体） 中文（繁体） 日语 韩语 葡萄牙语 从零到量子 量子计算革命已经到来。 什么是量子计算？后量子加密 将如何影响数字信任？ 什么是量子计算？ 量子计算是一种快速发展的技术，它将量子力学与高级数学和计算机工程相结合，以解决经典计算机无法解决的复杂问题。由于量子计算的原理与经典计算完全不同，使用的机器也完全不同，因此摩尔定律并不适用。量子计算的力量和能力令人难以置信并且在快速提升，这已经在改变我们使用计算机解决问题、分析信息和保护数据的方式。 为什么我们想要 量子计算？ 今天，即使是世界上最先进的超级计算机也基于可追溯到一个多世纪前计算机发明时的 晶体管二进制和计算原理进行计算。许多问题都涉及到变量的复杂性，这些变量无法基于这种经典计算模型进行计算。 由于量子计算基于量子可变性进行，因此这些复杂问题的计算速度可以与经典计算机解决经典问题的速度一样快。 量子计算为通过非传统方式解决具有许多细微差别的变量打开了大门。量子计算科学家注意到了在高度复杂且涉及看似随机因素的系统中获得巨大收益的机会，如天气建模、医药与化学、国际金融、商业与供应运输、网络安全、真正的人工智能，当然还有量子物理。 叠加 在量子水平上，物理系统可以同时以多种状态存在。在系统被观察或测量之前，系统会同时占据所有位置。量子力学的这一核心原理能让量子计算机利用系统的可能性，而所有可能的结果同时存在于计算之中。在量子计算的情况下，被使用的系统可以是光子、被捕获的离子、原子或准粒子。 干扰 量子态可以干扰其他量子态。干扰可以采取消去振幅或提高振幅的形式。一种将干扰可视化的方法是想象同时将两块石头扔到水中。当每块石头形成的波浪穿越传播路径时，就会在涟漪中形成更强的波峰和波谷。这些干扰模式能让量子计算机运行与经典计算机完全不同的算法。"
