full_description = 'Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. With the amount consumer dependency on technology services today, it’s critical that enterprises take the necessary precautions to ensure that security and privacy are key elements. Doing this will enhance their customer relationship and lead to greater trust in enterprise services. Forrester recently reported that 84% of users don’t believe enterprises are doing enough to protect their data, and nearly 25% of users backed out of a purchase online because of security concerns. People’s personal privacy matters, and information security has a real effect in how customers do business today. Despite the growing number of reports of improper online tracking, enterprise data gathering, and ad network targeting, privacy is not dead. Users today have not surrendered privacy in order to take benefit from technology and online services. That is the top-line finding of a new study of 15,000 consumers in 15 countries. The privacy paradox was surfaced most directly in one question: Would you be willing to trade some privacy for greater convenience and ease? Worldwide, 51 percent replied no, and 27 percent said yes. There were country-by-country differences, but there was a consistency to the results, especially in the developed nations… When asked to name the leading threats to online privacy in the future, 51 percent of the global panel of consumers picked “businesses using, trading or selling my personal data for financial gain without my knowledge or benefit..." The survey seems to present a grim outlook for data-driven online businesses and marketers. Within mobile developer networks huge debates continue to take place around the issue of ad-supported vs. paid-for mobile applications. Studies continue to prove that free but ad-supported applications drive significantly more revenue to developers than paid applications with no ads.'
