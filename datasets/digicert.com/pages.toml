["https://digicert.com/blog/a-security-solution-that-learns-along-with-iot-development"]
title = "A Security Solution that Learns Along with IoT Development | DigiCert.com"
description = "The Internet of Things (IoT) has not yet reached maturity, but with all its possibilities, we’re still figuring out a lot about the IoT: what we want from it, what level of privacy we are comfortable with, where the legal limits should lie and how to secure it."
full_description = '''Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português DigiCert Labs 07-07-2020 A Security Solution that Learns Along with IoT Development Dr. Avesta Hojjati Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. The Internet of Things (IoT) has not yet reached maturity, but with all its possibilities, users and manufacturers have enthusiastically acquired and invested in it without properly considering security. We're still figuring out a lot about the IoT: what we want from it, what level of privacy we are comfortable with, where the legal limits should lie and how to secure it. Getting the answers to all of those questions is a race against time. The issue goes beyond mere data theft. Attackers can now leverage the functionality of the IoT to further their crimes. Issues have been raised with robotic vacuum cleaners that scan the architecture of a house in order to determine the area they have to clean. This would be a great feature if it weren't for the fact that it uses a default username/password combination, allowing an adversary to turn that device into a remote spying device. And this is just one example of many. In recent research conducted by Kumar et. al., "All Things Considered: An Analysis of IoT Devices on Home Networks," researchers identified that in 11 different geographical locations and 15.5 million homes, there exist 83 million IoT devices. The figure below depicts IoT device type distributions between different geographic regions. Source: "Kumar, Deepak, et al. "All Things Considered: An Analysis of IoT Devices on Home Networks." 28th {USENIX} Security Symposium ({USENIX} Security 19). 2019 As these threats continue to grow, governments are introducing regulation all over the world at both regional and national levels. For example, the U.K. government recently introduced a certification scheme which will allow compliant devices to be labeled with the Secure by Design standard. The Finnish government has recently announced that they will be adopting similar measures. It seems that market forces will now help police the security of the IoT too.'''
