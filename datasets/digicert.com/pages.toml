["https://digicert.com/kb/csr-creation.htm"]
title = "CSR Creation | Create Certificate Signing Request | DigiCert"
full_description = "Before you can get a TLS/SSL certificate, you must generate a Certificate Signing Request (CSR) from your server or device. Learn more about SSL certificates » A CSR is an encoded file that provides a standardized way to send DigiCert your public key and some information identifying your company and domain name. When you generate a CSR, most server software asks for the following information: common name (e.g., www.example.com), organization name and location (country, state/province, city/town), key type (typically RSA), and key size (2048-bit minimum). If you're uncertain about the exact company name or location when generating the CSR, don't worry. We offer the flexibility to modify and finalize that information during our review process before issuing the certificate. Once you've created the CSR, you'll need to copy and paste it into the online form where you submit a request to get a TLS/SSL certificate. To remain secure, SSL certificates must use keys that are 2048-bits in length or greater. More details » Can't generate a CSR with a 2048-bit key on your server platform? Please contact us. When generating a CSR for a Wildcard certificate, the common name must start with an asterisk (*) (e.g., *.example.com). The Wildcard character (*) can assume any name that doesn't have a dot character in it. DigiCert has an award-winning in-house technical support team that is here to help you with any digital certificate issues that you have. Our dedication to unparalleled customer support is reflected in the numerous service awards we have won. We try to keep our online documentation as up-to-date as possible. However, if you have a particular article or platform that you would like to see documentation for, please contact DigiCert Support."
