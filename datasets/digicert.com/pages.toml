["https://digicert.com/how-tls-ssl-certificates-work"]
title = "How TLS/SSL Certificates Work | DigiCert"
description = "How does a TLS SSL certificate work? When a user tries to connect to a server, the server sends them its TLS/SSL certificate. The user then verifies the server's certificate using CA certificates that are present on the user's device to establish a secure and safe connection."
full_description = "Back CHOOSE YOUR LANGUAGE English Español Dutch Deutsch Français Italiano Chinese (Simplified) Chinese (Traditional) Japanese Korean Português A Lock, Two Keys, Strong Identity, and Gold Standard Encryption Establishing trust from the back end of eCommerce websites to delivery at your front door. That's digital trust for the real world. Explore these pages to discover how DigiCert is helping organizations establish, manage and extend digital trust to solve real-world problems. Transport Layer Security (TLS) certificates, also known as Secure Sockets Layer (SSL), are essential to securing internet browser connections and transactions through data encryption. TLS/SSL is the standard security technology that works behind the scenes to keep your online transactions and logins secure—here’s how it works. Invisible to the end-user, a process called the “TLS/SSL handshake” creates a protected connection between your web server and web browser nearly instantaneously every time you visit a website. Websites secured by a TLS/SSL certificate will display HTTPS and the small padlock icon in the browser address bar. TLS/SSL certificates are used to protect both the end users’ information while it’s in transfer, and to authenticate the website’s organization identity to ensure users are interacting with legitimate website owners."
