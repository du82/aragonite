["https://digifors.cs.up.ac.za"]
title = "DigiForS"
full_description = "PROF Hein Venter Prof. Hein S. Venter graduated at the Rand Afrikaans University (RAU) in 1996, majoring in Computer Science and Informatics. He successfully obtained a B.Sc (Hons.) degree in Computer Science in 1997. In 1999 he received the M.Sc degree (Cum Laude) in Computer Science. Since February 2000 he has been a junior lecturer in the Department of Computer Science at the RAU and was promoted to full lecturer in February 2002. Since February 2003 he has been a senior lecturer in the Department of Computer Science at the University of Pretoria. His research interests are in computer and Internet security, which include network security, Intrusion detection, information privacy, and digital forensics. Prof. Venter has published in a number of accredited international subject journals. A number of acclaimed international and national, Computer and Information Security conferences, were attended where he presented his research papers. He is also a member of the organising committee of the Information Security for South Africa (ISSA) national conference and the South African Institute of Computer Scientists and Information Technologists (SAICSIT) national conference. Prof. Venter is also involved in consultation work from time to time, involving setting up and creating information and computer security courses for industry, as well as security consultation work. Currently Supervising: -> HONOURS: 1 student(s) -> MASTERS: 6 student(s) -> DOCTORATE: 3 student(s) Past Supervision: -> HONOURS: 2 student(s) -> MASTERS: 1 student(s) -> DOCTORATE: 1 student(s) PROF Martin Olivier Martin Olivier is a professor at the Department of Computer Science in the School of Information Technology at the University of Pretoria. In addition to normal teaching and research duties, he is the research coordinator of the School of Information Technology. His current research interests include privacy and digital forensics as well as database, application and system security. Research Activities are carried out in the Information and Computer Security Architecture Research Group at the University of Pretoria. He is author or co-author of more than 80 academic publications. More than a dozen students have completed their Masters or Doctoral studies under his guidance. He is a member of the editorial board of Data & Knowledge Engineering. He is also a member of IFIP working group 11.3 on database and application security, IFIP working group 11.9 on digital forensics, the ACM, the Computer Society of South Africa and the Suid-Afrikaanse Akademie vir Wetenskap en Kuns (South African Academy for Science and Art). Prof Olivier holds a BSc degree in Mathematical Sciences, BSc (Honours), MSc and PhD degrees in Computer Science, a BA degree in Humanities and a BA (Honours) degree in Philosophy. Currently Supervising: -> HONOURS: 0 student(s) -> MASTERS: 0 student(s) -> DOCTORATE: 0 student(s) Past Supervision: -> HONOURS: 0 student(s) -> MASTERS: 0 student(s) -> DOCTORATE: 0 student(s)"
