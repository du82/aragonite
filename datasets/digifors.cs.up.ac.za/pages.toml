["https://digifors.cs.up.ac.za/projects"]
title = "DigiForS"
full_description = "Digital Forensic Readiness in the Cloud Members: Sheunesu M. Makura, Classification: Open Source Description: In this project, we are trying to find ways on how we can make cloud environments forensically ready for a digital forensic investigation to take place. This is achieved through the use of Digital Forensic Readiness. Learn more... Software Defined Networking Members: Avinash Singh, Howard Munkhondya, Classification: Open Source Description: Software defined networks (SDN) are a growing phenomenon, however, the rate at which data passes through the network makes it easy to be attacked. This makes it difficult to conduct an investigation due to evidence being lost due to the volatile nature of SDN. Learn more... Ransomware Forensics Members: Avinash Singh, Daneel Nortier, Kevin Cui, Classification: Open Source Description: Ransomware has been on the rise and digital forensic investigators have often been left clueless on how to investigate a ransomware attack. Due to the volatile nature of ransomware, the evidence is most likely destroyed further complicating the investigation process. This project aims to investigate novel methods and techniques to aid forensic investigation. Learn more... Natural human language framework for digital forensic readiness Members: Classification: Open Source Description: Natural human language framework for digital forensic readiness Learn more... Digital forensic cybercrime semantic triggers Members: Classification: Open Source Description: Digital forensic cybercrime semantic triggers Learn more... Digital forensic language library Members: Stacey Baror Henry, Classification: Open Source Description: Developing a web beacon that uses NLP techniques to build a Digital Forensic Language Library Learn more... Digital Forensic Readiness Members: Avinash Singh, Ivans Kigwana, Mvelo McUba, Tjaart Booyens, Maxime Lagrasse, Sebastien Philomin, Classification: Open Source Description: Digital Forensic Readiness (DFR) is defined as the capacity of an organization to conduct forensic investigations and to collect forensic evidence whilst minimizing costs. Learn more..."
