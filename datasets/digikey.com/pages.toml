title = "DigiKey - Electronic Components Distributor"
description = "DigiKey offers millions of products from thousands of manufacturers, many in-stock quantities available to ship same day. Apple Pay, Google Pay™ & Paypal accepted, order online today!"
full_description = "Last up to 15 years Enables long-term operation where replacing batteries is difficult Wide range operating temperature Excellent high-pulse discharging performance Learn More Eaton’s new precision timing devices features: Wide frequency range allows versatile application in electronic devices Compact footprint 0806 (2016 metric) to 2012 (5032 metric) AEC-Q200 qualified options to meet industry standards for automotive Learn More Thin film automotive-grade chip resistors are AEC-Q200 qualified and provide excellent long-term reliability. In addition, the RNCA features outstanding anti-sulfur performance, passing the industry standard ANSI/EIA977 sulfur test. Learn More Schneider Electric’s Altivar soft starter ATS480 is the next evolution of soft starters for digitization optimized to meet cybersecurity standards. Designed to address processes and infrastructures, ATS480 maximizes the availability of users’ applications even in the most demanding environments. Learn More SANYO DENKI 60x60x56 mm San Ace 60 9CRH type Counter Rotating Fan achieves the high static pressure 13.4 inchH2O and the high airflow 90.8 CFM. It is suitable for cooling servers, telecom equipment, and network equipment. This fan uses a lead-free brass material and is RoHS Directive-compliant. Learn More The AL58221 is a 12-channel, constant-current, adaptive pulse density modulation LED driver which operates over a 3V~5.5V input voltage range. It provides 12 open-drain constant-current sinking outputs that are rated to 24V and deliver up to 60mA of high-accuracy current to each string of LED. Learn More MPM3632C step-down converter offers a compact solution that requires only input and output capacitors to achieve 3A of continuous output current with excellent load and line regulation over a wide input range. Learn More Fine-pitch connectors offering perfect alignment High-Speed data transmission Mixed signal and power options Learn More Binding posts with 4 mm safety jacks are ideal for mounting in pre-drilled panels and are frequently used in electronic test equipment. These 73095 binding posts are spring-loaded for quick and easy wire attachment methods, while offering the ability to connect sheathed banana plugs. Learn More"
year_published = 2025
