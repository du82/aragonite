["https://digital.slub-dresden.de/hinweise-zur-suche-in-den-digitalen-sammlungen"]
title = "SLUB Dresden: Hinweise zur Suche in den Digitalen Sammlungen"
full_description = 'SLUB Dresden Entdecken SLUB Sammlungen digital Hinweise zur Suche in den Digitalen Sammlungen Suche in den Metadaten und in den Volltexten Eine Suche in den Digitalen Sammlungen der SLUB ist über alle Kollektionen oder innerhalb einzelner Kollektionen möglich.Es stehen jeweils eine Metadatensuche und eine Volltextsuche zur Verfügung. Die Metadatensuche umfasst die Suche in den Titelmetadaten und Strukturmetadaten. Die Volltextsuche umfasst die Suche in den Volltexten, sofern Volltexte vorhanden sind. Startseite der Digitalen Sammlungen Detailsuche in den Kollektionen Eingrenzung der Suchergebnisse Suchergebnisse können durch die Verwendung der Facetten auf der rechten Seite weiter eingegrenzt werden. Es stehen folgende Facetten zur Verfügung:Autor ErscheinungsortErscheinungsdatumSammlungenStrukturtyp Volltextsuche in den Kollektionen Bei einer Suche im Volltext ist zu beachten, dass für einige Objekte kein Volltext vorhanden ist, wie zum Beispiel für Handschriften. Des Weiteren ist bei der Auswertung der Treffer zu berücksichtigen, dass die Generierung von Volltexten über eine automatisierte Texterkennungssoftware im Rahmen der Digitalisierung mit der Workflowsoftware Kitodo erfolgt. Eine intellektuelle Nachbereitung der Volltexte erfolgt nicht. Fehler bei der Texterkennung, wie zum Beispiel aufgrund verschiedener verwendeter Schriftarten oder eines komplexen Layouts, können daher nicht ausgeschlossen werden.Nach einer Suche im Volltext werden in der Trefferliste die Objekte angezeigt, die die Suchbegriffe im Volltext enthalten. Über das Symbol neben den einzelnen Werktiteln lässt sich die Anzeige ein- und ausblenden, die den Volltextabschnitt mit dem Suchbegriff enthält. Es werden die entsprechenden Textauszüge angezeigt und in die Werkansicht verlinkt. Folgt man dem Link in die Werkansicht, werden die Suchbegriffe dort hervorgehoben. Trefferliste nach der Volltextsuche Volltextsuche in der Werkansicht Wenn ein Volltext zu einem Werk vorhanden ist, ist dies in der Werkansicht über das Symbol "Volltext an / Volltext aus" erkennbar. Das Symbol wird nur angezeigt, wenn ein Volltext verfügbar ist. Ist ein Volltext hinterlegt, ist eine Suche innerhalb des Volltextes eines Werks mit dem Symbol "Lupe" möglich. Lage der Symbole Anzeige des Suchfeldes Allgemeine Hinweise zur Suche Groß- und Kleinschreibung werden bei der Suche nicht berücksichtigt.Diakritische Zeichen werden bei der Suche berücksichtigt. Zum Beispiel â, ě, é. Während der Indexierung von Volltexten wird eine Stammformreduktion (Stemming) durchgeführt. Verschiedene Wortvarianten werden dabei jeweils auf einen gemeinsamen Wortstamm reduziert. Zum Beispiel wird der Plural "Höfe" zurückgeführt auf den Wortstamm "Hof". Daher ergibt eine Volltextsuche nach Hof oder nach Höfe auch die Treffer "Hofes", "Höfen". Suchfunktionen PhrasensucheEine Phrasensuche ist in den Digitalen Sammlungen der SLUB Dresden nicht möglich. Zum einen, weil einige sogenannte Stopworte nicht berücksichtigt werden. Zum anderen, weil aufgrund des oben beschriebenen Stemming-Verfahrens eine Suche nach "Dresdner Hof" zum Beispiel auch "Dresdner Hofes" als Suchergebnis ergibt.Durch die Anwendung von Anführungszeichen (" ") ist jedoch eine Suche nach Wortkombinationen ohne Stopworte möglich, wie zum Beispiel "Dresdner Hof".Eine präzise Phrasensuche in den Volltexten der Zeitungsausgaben der SLUB Dresden kann im Deutschen Zeitungsportal durchgeführt werden. Allerdings sind dort die Zeitungsausgaben nur mit Verzögerung verfügbar.Trunkierung und MaskierungEine Trunkierung ist mit Sternchen (*) als Platzhalter für beliebige Zeichen möglich. Eine Suche nach heilig* ergibt somit zum Beispiel "heilig", "heilige" oder auch "Heiligenaltäre" als Treffer. Das Fragezeichen (?) ersetzt hingegen genau ein Zeichen bei der Suche (Maskierung). Eine Suche nach Tos?ana ergibt also zum Beispiel Treffer für die Schreibweisen "Toskana" und "Toscana".Boolesche OperatorenUmfasst eine Suchanfrage mehrere Begriffe, wird standardmäßig derBoolesche Operator AND angewendet.Beispiel: Dresden Löbtau PieschenEine Suche mittels des Booleschen Operators OR ist möglich. Die Suche ergibt Treffer, die mindestens einen der Suchbegriffe enthalten.Beispiel: Dresden OR Löbtau OR PieschenUm einzelne Begriffe aus der Suche auszuschließen, ist die Verwendung des Booleschen Operators NOT möglich. Zum Beispiel ergibt eine Suche nach Dresden NOT Löbtau Treffer, welche den Begriff "Dresden", aber nicht den Begriff "Löbtau" enthalten.Beispiel: Dresden NOT LöbtauKombination von SuchmöglichkeitenEs können verschiedene Suchmöglichkeiten kombiniert werden. Einige Suchmöglichkeiten schließen sich jedoch aus, wie zum Beispiel die Trunkierung und die Maskierung innerhalb einer Suche in Anführungszeichen (" "). Kollektionen Inhaltsverzeichnis AnsprechpartnerinSuche in den Metadaten und in den VolltextenEingrenzung der SuchergebnisseVolltextsuche in den KollektionenVolltextsuche in der WerkansichtAllgemeine Hinweise zur SucheSuchfunktionen Ansprechpartnerin Geschäftsstelle Digitale Bibliothek Annika-Valeska Walzel Tel.: +49 351 4677-179 E-Mail.: digital@slub-dresden.de'
author = "SLUB Dresden"
year_published = 2025
