title = "Frequently asked questions – Beacon"
description = "Calculate the environmental impact of a web page, see the breakdown and learn what measures can be taken to improve it."
full_description = "The grades have been created by the team at Sustainable Web Design to give a more understandable rating for the impact of our digital products. If, while using any feature of Beacon, you find an issue please report it to us by emailing [email protected]. The internet uses a lot of electricity and a lot of that energy comes from the grid where we don't use 100% renewable energy; it uses it for three distinct areas: servers, network and devices. Beacon calculates the impact based on data transmission which we can accurately measure and using the OneByte methodology we calculate the numbers Beacon displays. With new features constantly being added and those features being constantly tested, Beacon is never at the point of a fully stable release. This is done to aid in the flexibility and speed of development."
year_published = 2025
