["https://digitalbeacon.co/imprint"]
title = "Imprint – Beacon"
description = "Calculate the environmental impact of a web page, see the breakdown and learn what measures can be taken to improve it."
full_description = "Beacon is to be used for non-commercial purposes only unless written permission given by Aline; to seek permission please contact us by emailing [email protected] We use cookieless tracking to be able to track submissions and any errors that may come up. This data cannot be used to personally identify any visitor and is separated from the request form submissions where that data is used for only internal purposes and never shared. This application is built using Laravel and uses CloudFlare as a CDN; as part of these services 3 essential cookies are set. The CO2 score is lowered by 10% if hosted with a provider using renewable energy (or offseting it) as that is roughly the amount of energy used transmitting the data from the server to the network. While Beacon checks your hosting provider; it cannot determine the difference between hosts using renewable energy or offseting their carbon footprint – this is down to the data source we are using (The Green Web Foundation) and will be monitored in case this data does become available. All data saved is completely anonymous and private; it's only use is internally to monitor usage and help improve this product. We reserve the right to get in touch with site owners to offer additional services to help reduce the emissions caused by their website."
year_published = 2025
