title = "Custom Email Notifications and RSS | Digital Repository - Villanova University Charles Widger School of Law"
full_description = "Receive personalized email notifications (bealerts) Notification Criteria: Search What are bealerts? bealerts help you keep track of newly published content, tailored to your interests. To be notified via email of content fitting your desired criteria, simply enter a keyword or author name in the field above and click Search. A new screen will appear with your results. By clicking Save this search on the new page, you will receive weekly updates based on your criteria. Get the Villanova University Charles Widger School of Law Digital Repository RSS feed Subscribe to the Villanova University Charles Widger School of Law Digital Repository feed To use the Villanova University Charles Widger School of Law Digital Repository RSS feed, simply drag this link into your feed reader or news aggregator. What is RSS? RSS (Really Simple Syndication) is a standardized XML-based format for sharing and distributing frequently updated web content such as news headlines. RSS feeds may be subscribed to using programs called feed readers or news aggregators. The RSS feed is updated when new work appears in Villanova University Charles Widger School of Law Digital Repository."
