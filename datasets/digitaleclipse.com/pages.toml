["https://www.digitaleclipse.com/games/llamasoft"]
title = "Llamasoft: The Jeff Minter Story"
description = "Journey back to an era in which a kid with a Commodore VIC-20 and dreams of radioactive sheep could become one of Britain's best-known game makers."
full_description = '''Journey back to an era in which a kid with a Commodore VIC-20 and dreams of radioactive sheep could become one of Britain's best-known game makers. ‍Journey back in time to an era of cassette tapes, photocopied zines, and README.TXT. An era in which a kid with a Commodore VIC-20 and dreams of radioactive sheep could become one of Britain's best-known game makers. A virtual museum of design documents, playable games, and all-new video features tell the fascinating story of a true independent game designer. Llamasoft: The Jeff Minter Story includes 42 classic games from 8 different platforms, from Jeff Minter's earliest work on the Sinclair ZX81 and Commodore VIC-20, to later work on the Spectrum, Commodore 64 and Atari 800, through to the Atari ST line of computers and Atari's gaming console, the Jaguar. A full game list follows at the bottom of the page. Jeff's signature shooter masterpiece Gridrunner gets an all-new look from Digital Eclipse, updated into thrilling modern graphics and sound – while still running the core of the Commodore 64 version for 100% gameplay accuracy. ‍Sheep In Space. Andes Attack. Attack of the Mutant Camels. Matrix. Metagalactic Llamas Battle at the Edge of Time. Hellgate. Laser Zone. And many more. All the Minter classics you've heard of (and several you probably haven't), now with new quality-of-life features to make playing them more fun than ever before. Two of Jeff Minter's earliest "light synthesizers," Psychedelia and Colourspace, are also included, with all-new options and features optimized for controller-based play. Finally, Jeff's demo of Attack of the Mutant Camels for the unreleased Konix Multi-System console is also included. Llamasoft: The Jeff Minter Story is the second installment in Digital Eclipse’s Gold Master Series, which presents iconic games in an innovative "interactive documentary" format, putting the shared history of games and their creators into one comprehensive package. Heart of Neon is a feature documentary about legendary game designer and programmer Jeff Minter, a computer artist whose influential career has endured almost the entire history of home video game entertainment. Directed by industry veteran Paul Docherty, the film Heart of Neon is not only a unique insight into the video games community, but is also a celebration of the joy that comes from making and playing captivating digital art. Docherty contributed over an hour of all-new video featurettes to Digital Eclipse’s Llamasoft: The Jeff Minter Story.‍Full game list by platform:'''
