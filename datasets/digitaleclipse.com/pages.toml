["https://www.digitaleclipse.com/games/disneyafternoon"]
title = "The Disney Afternoon Collection"
description = "A return to the legendary team-up of Capcom and Disney, which produced several critically acclaimed, million-selling games of the 8-bit era."
full_description = "A return to the legendary team-up of Capcom and Disney, which produced several critically acclaimed, million-selling games of the 8-bit era. Disney's DuckTales, Chip & Dale: Rescue Rangers, Darkwing Duck, and TaleSpin entertained a generation of fans on after-school television, and the hit NES games by Capcom sold millions of copies and delighted fans.. Digital Eclipse brings that era back like a hurricane with The Disney Afternoon Collection. In addition to offering six legendary games with save and rewind capabilities, Digital Eclipse enhances every title with new Time Attack and Boss Rush modes, which let players tackle the toughest enemies in each game and post their results on competitive leaderboards. With museum galleries showcasing never-before-seen art, rare promotional images, pencil-to-pixel transformations, a comprehensive music player, and more, The Disney Afternoon Collection is a definitive collection of these gems of the 8-bit era."
