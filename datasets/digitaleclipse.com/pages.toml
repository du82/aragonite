title = "Street Fighter 30th Anniversary Collection"
description = "Return to the series that defined a genre with this collection of 12 Street Fighter titles, complete with online play and a detailed interactive museum."
full_description = "Return to the series that defined a genre with this collection of 12 Street Fighter titles, complete with online play and a detailed interactive museum. When Capcom released the original Street Fighter in 1987, few realized it would spawn a franchise that defined fighting games for years to come. Digital Eclipse enshrined that legacy with 12 arcade-perfect restorations spanning three decades in Street Fighter 30th Anniversary Collection. Fans can battle online in four of the most competitive games in the series: Street Fighter II': Hyper Fighting, Super Street Fighter II Turbo, Street Fighter Alpha 3, and Street Fighter III: Third Strike. Exclusive training modes added to each of those titles let players can sharpen their skills before testing their mettle online. Digital Eclipse celebrates the series' rich lore with detailed histories for every character and frame-by-frame animation viewers let players luxuriate in the games' legendary sprite artwork. The museum section also contains hundreds of pieces of concept art, a detailed franchise timeline, a soundtrack player, a guided tour through the original game's internal pitch document and, in a fitting tribute to one of the most important games in history, an exclusive and deep exploration of the making of Street Fighter II."
