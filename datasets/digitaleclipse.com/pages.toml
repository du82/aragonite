["https://digitaleclipse.com/media/wizardry-pgmo-v11"]
title = "Wizardry PGMO - v1.1 patch notes"
description = "Fast combat, higher level cap, and more improvements have arrived in The Maze."
full_description = "Aug 21, 2024DE StaffminsGameGreetings, adventurers! We've heard your feedback since the release of Wizardry, and we appreciate all your suggestions. We've fixed numerous bugs and added a few features requested specifically by players, and we hope these changes make your time in The Maze even more enjoyable. Grab the latest update for the platform of your choice and you'll see the following improvements!‍New Features‍Fast Combat Option‍Players can choose to deactivate animations to speed up combat if they choose. The enemy has to be fully inspected/deduced for this feature to appear. Once available, it can be activated with a button press.Level Cap IncreasePlayers now have a limit of 99 million XP.Old-School Options > Castle Options > Honor Guard Terms You may choose to keep your gear after being invited to the Honor Guard.Old-School Options > Castle Options > Aging from Inn‍You can now remove the penalty for aging when staying at the Inn.Old-School Options > Maze Options > All HAMAN Results‍This allows HAMAN and MAHAMAN to trigger additional effects, when they previously would not due to a bug in the original game.Old-School Options > Maze Options > Distribute Extra Gold‍When enabled, this new option gives leftover gold to one of the members of the party. Otherwise, per the original rules, the leftover gold will be discarded.Old-School Options > Cheats > Honor Guard RewardsWhen invited to the Honor Guard, you can choose to receive the experience reward once or multiple times. Details for this feature are included in the menu description. ‍Rebalanced recruited character generation Stop by Gilgamesh's and see who's available!‍Spells cast by the party that target a party member now resolve at the end of combat.‍We've added new UI for active effects: MAPORFIC, MILWA/LOMILWA and found characters.‍You may now rest your full party in town even when one character is injured or dead.‍Bug FixesMAPORFIC, MILWA/LOMILWA, HAMAN/MAHAMAN now properly stored between saves/sessions‍Returning to title screen from the dungeon while possessing the amulet will no longer force you into the Honor Guard‍Corrected treasure table data‍Corrected damage roll for MADALTO‍Fixed some issues that would cause combat not to proceed‍Numerous other minor bugs fixed, as well as some polish‍‍Thanks for all the constructive criticism and feedback. We hope you return from your next deadly excursion into The Maze in one piece!TWITTERcopied :)"
year_published = 2025
