["http://digitaleclipse.com/our-games"]
title = "Our Games"
full_description = '''Celebrate three decades of Power Rangers in a new experience that blends brawling, blasting, fighting, and driving action. A full 3D remake of the first game in the legendary Wizardry series of RPGs, powered by the original source code. Journey back to an era in which a kid with a Commodore VIC-20 and dreams of radioactive sheep could become one of Britain's best-known game makers. Rescue cats! Collect hearts! Defy the laws of physics! Q.P.I.D. is part platformer, part physics puzzler, part race against the clock. Did we mention the cats? Prepare your elf! At Santa's workshop, the sportsmanship is nice, but the ferocious spikes at the net are downright naughty. An alien smorgasboarding party is attacking your dining room! Can you deliver their dinner before they wreck your restaurant? Smash pumpkins, collect candy, power up, and defeat the Pumpking in this all-new throwback to the arcades of the 1980s. Play the history! Go behind the scenes of Jordan Mechner's landmark game Karateka in this interactive documentary from Digital Eclipse, with archival materials, video features, and more. An interactive documentary charting the origins of the video game industry, now expanded with more than 140 playable games. An all-new game originally released as an 8-bit NES cartridge, including Digital Eclipse's signature package of quality-of-life features. The heroes in a half-shell make their long-awaited return in this complete collection of Konami's critically acclaimed arcade, home, and portable series. All 16-bit versions of Aladdin, The Lion King, and The Jungle Book in a single definitive package, including the all-new "Final Cut" of Aladdin. An all-new side-scrolling, pixel art brawler paying homage to classic 16-bit beat-em-ups, released alongside the film of the same name. The Lost Vikings, Rock N Roll Racing, and Blackthorne make their long-awaited return, with special Definitive Editions and an extensive Museum that tells the story of the founding of Blizzard Entertainment.'''
