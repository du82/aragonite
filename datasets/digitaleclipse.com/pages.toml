full_description = '''Alexey Pajitnov's brilliant follow-up to Tetris joins the playable game list. Plus: Our plans for 2025. Our quest to create the best version of the original Wizardry continues with major updates to visuals, animation, and music. We've added more features and quality-of-life improvements to our reimagined version of the OG RPG. Here's what's new! A mix of overlooked gems, rare prototypes, and fan favorites just expanded the Atari 50 game library. We're prepping updates to address a number of player pain points, including save games, party wipes, and more. Wizardry trademark and copyright holders have licensed the IP to California-based game development studio‍ Here's everything you need to know about our first early access game. We'll update this page with fresh information! The first entry in our new Gold Master Series is an interactive documentary exploring the creation of Jordan Mechner's debut game. The Making of Karateka kicks off Digital Eclipse's new line of interactive documentaries, exploring gaming's greatest creators and creations. "Why can’t video games be the medium through which we tell the stories about the history of video games?”'''
