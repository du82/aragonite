["https://digitaleclipse.com/page/presskit"]
title = "Press Kit"
full_description = "The original incarnation of Digital Eclipse was founded in Emeryville, California in 1992 by current CEO Andrew Ayre. In 1994, Digital Eclipse created a series of games for the Macintosh platform called Williams Digital Arcade, which were the first ever commercial game products to use emulation. Digital Eclipse continued to produce emulation-based classic game packages for various platforms, as well as many original titles for the Game Boy Color and Game Boy Advance. In 2003, Digital Eclipse merged with ImaginEngine to form Backbone Entertainment; in 2005, Backbone merged with The Collective to form Foundation 9 Entertainment, which at one point was the largest independent video game development studio in the world. In 2007, Andrew Ayre left Foundation 9 to form Other Ocean Interactive, and later re-acquired the rights to the Digital Eclipse name. Digital Eclipse was relaunched in 2015 as a studio dedicated to telling the stories of gaming history, preserving classic games, and keeping them alive for future generations. Starting with its first release, 2015's Mega Man Legacy Collection, the reborn Digital Eclipse has produced critically acclaimed releases of classic brands and franchises such as Street Fighter, Samurai Shodown, Teenage Mutant Ninja Turtles, Disney, and Atari. Digital Eclipse's game releases focus on capturing the artists' original intent, providing historical and archival material to place the games in their proper context, and enhancing the player experience in a variety of ways through the custom Eclipse Engine technology platform. After the success of Atari 50: The Anniversary Celebration, Atari acquired Digital Eclipse in late 2023. The development team continues to innovate from its Emeryville studio. Llamasoft: The Jeff Minter Story (Gold Master Series #02) (Digital Eclipse)Wizardry: Proving Grounds of the Mad Overlord (Digital Eclipse)The Making of Karateka (Gold Master Series #01) (Digital Eclipse)Digital Eclipse Arcade: Q.P.I.D. (Digital Eclipse)"
