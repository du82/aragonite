["https://digitaleclipse.com/about-us"]
title = "About Us"
full_description = "Classic video games deserve better. At Digital Eclipse, we treat them with the same care and respect given to other artistic mediums. Founded in 1992, Digital Eclipse is globally recognized as the market-leading game developer focused on the craft and history of classic video games. Digital Eclipse strives to set the gold standard for archival game re-releases, preserving gaming history for future generations. The studio's original games pay homage to the gaming industry's legacy, with the signature style and timeless gameplay of the classics. Digital Eclipse is based in Emeryville, California and is a wholly-owned subsidiary of Atari. At the heart of Digital Eclipse's releases is our proprietary Eclipse Engine technology. Custom-built for this special purpose, Eclipse Engine allows us to integrate multiple software emulation processes, original programmed work, video, audio, archival documents and more into a single, seamless multimedia experience.This tech allows our engineers to enhance and evolve classic gameplay, adding additional layers of functionality on top of a classic game. Online play, quality of life enhancements, or even deeper modifications can be added – all without disturbing the original work running underneath the enhancements.Eclipse Engine: Technology designed for preserving, and enhancing, games for future generations."
