["https://www.digitaleclipse.com/games/atari50"]
title = "Atari 50: The Anniversary Celebration"
description = "An interactive documentary charting the origins of the video game industry, now expanded with more than 140 playable games."
full_description = "An interactive documentary charting the origins of the video game industry, now expanded with more than 140 playable games. Having established itself as the industry leader in historic game releases, Digital Eclipse now presents an evolution of the genre. Atari 50: The Anniversary Celebration is an interactive documentary exploring the history of the company that launched an entire industry. Presented across five interactive timelines is the story of Atari. It begins with the highs: Atari's founding in 1972, the landmark release of Pong, the Atari 2600's establishment of the home console market. But it also gives an honest assessment of the difficult times that followed. These stories are told through archival footage, over an hour of all-new interviews, digital artifacts, newly-unearthed design documents - and, of course, over 100 playable games, which are all accessible through the timelines, to place them in their proper contexts. Digital Eclipse's engineers have also developed six all-new games for Atari 50 that pay homage to the golden years of Atari, like VCTR-SCTR, Haunted Houses, and Quadratank. And fans of the long-unfinished Swordquest series will love that the fourth game in the series, Swordquest: AirWorld, has been newly developed for this release. By combining games, videos, artifacts, and historical trivia into a single comprehensive documentary format, Atari 50: The Anniversary Celebration is a whole new way to experience game history – and celebrate the foundational art on which a medium and an industry were built. ‍Atari 50: The Anniversary Celebration - Expanded Edition, released in 2024, adds two additional timelines, 38 more games, and an hour of new video segments filled with exclusive interviews and historical analysis. For existing owers of Atari 50 in any form, this additional content is also available in the form of two digital add-on packs, The Wider World of Atari and The First Console War."
year_published = 2025
clearnet = "https://www.digitaleclipse.com/games/atari50"
