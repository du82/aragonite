["https://digitaleclipse.com/games/volgarr2"]
title = "Volgarr the Viking II"
description = "A hardcore, 2D action-platformer where only precision can keep you from death."
full_description = "More than a decade after Volgarr the Viking’s chaotic, challenging debut, the barbarian king’s story continues in an uncompromising new form. Developed in partnership with Crazy Viking Studios, Volgarr the Viking II is a hardcore, 2D action-platformer where precision is everything and one false move can spell a brutal death. Players of the original game will feel right at home on this relentless voyage, even with the addition of new power-ups, new forms of magic, new enemy types, and a chest-thumping new soundtrack.While the sequel delivers the same unforgiving 1980s-arcade level of difficulty as the original, Volgarr the Viking II also (mercifully, begrudgingly) offers modern quality-of-life options such as checkpoints, save states, and an undead mode. You decide how punishing your quest should be – but now, anyone can be a Viking!With new and larger worlds inspired by Norse mythology, multiple endings, and a variety of ruthless bosses to conquer, Volgarr the Viking II expands and improves on the original in every way. Draw your sword, don your helmet, and chop your way through this violent Viking adventure!"
