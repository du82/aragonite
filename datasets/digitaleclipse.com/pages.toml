["http://digitaleclipse.com/media/tetris-forever-update-saving-the-saves"]
title = "Tetris Forever Update: Saving the Saves"
description = "We've improved game saves, DOS graphic modes, and more in our latest update."
full_description = "Jan 17, 2025Chris KohlerminsGameHello, Tetris players! Our latest update brings a few small but important improvements to Tetris Forever, some of which have been specifically added as a result of player feedback.‍First, we're excited to announce an update to the way game progress is saved in certain games. For console games that originally had battery backup – meaning that high scores, player profiles, and game progress were saved between play sessions – the versions in Tetris Forever now work the same way.‍If you leave or reset the game, your progress will be retained, without having to use the Save/Load features in the in-game menu. As you work your way through the challenging campaigns of games like Tetris 2 + Bombliss on Famicom or the various modes of Super Tetris 3, you'll be able to retain your profiles and progress with ease. Additionally, the high score leaderboards for two MS-DOS games will also be persistent between game sessions, recording your accomplishments for all eternity.‍The games with these upgraded save features are:‍Famicom:Igo: Kyū Roban TaikyokuTetris 2 + BomblissSuper Famicom:Super Tetris 2 + BomblissSuper Tetris 2 + Bombliss GenteibanSuper Tetris 3Super BomblissMS-DOS:Tetris (AcademySoft)Tetris (Spectrum HoloByte)Also of interest to MS-DOS players, we've expanded the graphics modes for Tetris (AcademySoft), Tetris (Spectrum Holobyte), and Welltris. Choose the Game Settings option in the in-game menu, and you'll be able to select from display settings including CGA, EGA, VGA, Tandy, and Hercules, depending on the game.We know some players grew up with these specific visual settings, so we wanted to present them as accurately as possible. MS-DOS games now also have key-repeat functionality, so holding down a button will now result in repeated presses (letting you slide a Tetrimino piece without having to repeatedly press the key, for example).‍You may spot a few other bug fixes as well, including a fix for the Apple II score reset issue, as well as for the haptic feedback settings during multiplayer games of Tetris Time Warp. ‍And we're far from done! Today's update is just the appetizer – we are working on even more improvements for Tetris Forever and Tetris Time Warp, and we'll have more information on that soon. Thanks for your continued support!TWITTERcopied :)"
year_published = 2025
