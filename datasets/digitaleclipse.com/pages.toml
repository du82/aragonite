["https://digitaleclipse.com/media/ritas-rewind-release-update"]
title = "An Important Update for the Release of Rita's Rewind"
description = "UPDATE: All versions of the game will be available on December 10!"
full_description = "Nov 27, 2024Dan Amrich, Content EditorminsGameWe've been working hard on Mighty Morphin Power Rangers: Rita's Rewind for more than a year now, and the fan response has been incredible. From live demos at conventions to kind words from press previews, we know you can't wait to play on December 10. Unfortunately, we're facing two issues that will affect our launch plans. ‍‍UPDATE 12/4/2024: We are thrilled to confirm that the Nintendo Switch version will NOT be delayed to December 19 as previously announced, and the Nintendo Switch version will be available along with the PlayStation, Xbox, and Steam versions on the original announced release date of Tuesday, December 10.‍However, due to technical issues that are simply taking more time to sort out than we'd hoped, online play will support two players on PlayStation and Steam, and will not be enabled for the Xbox and Nintendo Switch versions at launch. The good news is we expect to have two-player online play for those platforms available within a few weeks followed by support for additional players for all versions soon after. Also, offline play won't be affected; Rita's Rewind remains fully playable with friends & family in couch co-op mode.‍UPDATE 12/16/2024: We are continuing to update players regarding the online status, as well as balancing updates, at our general FAQ for the game, located here: https://www.digitaleclipse.com/media/ritafaq‍We would like to blame Robo Rita for these issues, but we just need a little extra time to deliver on everyone's expectations, including our own. We'll continue to improve and enhance the game after launch to make it what you – and we! – want it to be.‍We wanted to update you as quickly as possible once the situation became clear. Thank you for your support and understanding.‍TWITTERcopied :)"
