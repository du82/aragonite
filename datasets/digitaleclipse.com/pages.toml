["http://digitaleclipse.com/games/mmpr"]
title = "Mighty Morphin Power Rangers: Rita's Rewind"
description = "Celebrate three decades of Power Rangers in a new experience that blends brawling, blasting, fighting, and driving action."
full_description = "Celebrate three decades of Power Rangers in a new experience that blends brawling, blasting, fighting, and driving action. Coming December 10, 2024!Experience the origins of the Mighty Morphin Power Rangers again – for the first time! Mighty Morphin Power Rangers: Rita’s Rewind is an all-new adventure with an original storyline that both respects and remixes Power Rangers lore with scenarios and gameplay that will be both familiar and new to MMPR fans. Players will brawl, blast, fight, and drive through a constantly shifting mix of classic game genres and fan-favorite moments from the series. In Mighty Morphin Power Rangers: Rita's Rewind, the team faces off against a robotic reincarnation of the Power Rangers' long-time nemesis. Robo-Rita has conjured a portal to send herself back in time so she can finally vanquish the Power Rangers by forming an alliance with her younger self. Working together, Robo-Rita and Rita Repulsa rewind, rewrite, and remix the past in an attempt to stop the very formation of the Power Rangers, altering the course of history. Will the two Ritas and their army of monstrous enemies from across the MMPR timeline finally succeed in destroying the Power Rangers? Or will these teenagers with attitude learn to work together and counter this catastrophic chronological collaboration? ‍TM & © 2024 SCG Power Rangers LLC and Hasbro. Power Rangers and all related logos, characters, names, and distinctive likenesses thereof are the exclusive property of SCG Power Rangers LLC. All Rights Reserved. Used Under Authorization."
