["https://digitaleclipse.com/games/disneyclassicgames"]
title = "Disney Classic Games Collection"
description = 'All 16-bit versions of Aladdin, The Lion King, and The Jungle Book in a single definitive package, including the all-new "Final Cut" of Aladdin.'
full_description = '''All 16-bit versions of Aladdin, The Lion King, and The Jungle Book in a single definitive package, including the all-new "Final Cut" of Aladdin. SNES or Genesis? The debate over which 16-bit version of Disney's Aladdin is superior continues to this day, but with Disney Classic Games Collection, players don't have to choose. All 16-bit versions of Aladdin, The Lion King, and The Jungle Book are represented in this definitive package. Working from the game's source code and in cooperation with some of its original developers, Digital Eclipse created a new "Final Cut" of the Genesis version of Aladdin, incorporating numerous bug fixes, cut content, and other features. Extensive Museum sections for all three titles show off a variety of development materials, some never before seen, from the archives of the games' creators as well as from the Disney vaults. Video interviews, pixel art, sketches, and even development materials from the 1964 The Jungle Book motion picture are included in this Disney fan's treasure trove. ‍Disney Classic Games Collection is available as a standalone release or as an update to the 2019 package Disney Classic Games: Aladdin and The Lion King.'''
