full_description = "Apr 10, 2023Digital Eclipse TeamminsGameTeenage Mutant Ninja Turtles: The Cowabunga Collection just received another update, and it includes a new feature we know fans have been requesting: You can now play TMNT III: The Manhattan Project online with friends! You'll also find some gorgeous artwork in the Turtles' Lair, including some fantastic work from TMNT co-creator Kevin Eastman.‍Here's a peek at some of the new art included in the Turtles' Lair!‍The latest patch follows a big content update from December 2022, which added online play for Turtles in Time SNES, several new color palettes for the Game Boy titles, arcade stick support on all platforms, Group Mode in the Japanese version of TMNT Tournament Fighters on SNES, and more.The latest free update for TMNT: The Cowabunga Collection is available now on all platforms — PlayStation 4, PlayStation 5, Xbox One, Xbox Series X|S, Nintendo Switch, and PC. If you haven't fired it up for a while, now's a great time!TWITTERcopied :)"
