["https://www.digitaleclipse.com/games/gpk"]
title = "Garbage Pail Kids: Mad Mike and the Quest for Stale Gum"
description = "An all-new game originally released as an 8-bit NES cartridge, including Digital Eclipse's signature package of quality-of-life features."
full_description = "An all-new game originally released as an 8-bit NES cartridge, including Digital Eclipse's signature package of quality-of-life features. Developed by Retrotainment and released in partnership with iam8bit Presents, Garbage Pail Kids: Mad Mike and the Quest for Stale Gum rights the decades-old wrong of there having been no Garbage Pail Kids game released at the series' peak in the 1980s. iam8bit released the 2D platformer as a limited run of 4,000 physical NES cartridges, and made it available on modern platforms in partnership with Digital Eclipse. The modern console versions of Garbage Pail Kids: Mad Mike and the Quest for Stale Gum include the ability to save and load progress, a Watch mode that lets players view a playthrough of the game and jump in at any time, an in-game museum with Garbage Pail Kids images and trivia, and an audio soundtrack player. (Several members of the studio also starred in a mockumentary video about the game's fictional backstory.) With four playable characters, an in-game system for card trading, and six expansive levels packed with rotten Easter eggs, Garbage Pail Kids: Mad Mike and the Quest for Stale Gum is the ultimate love letter to fans of the proudly disgusting franchise."
