["https://digitaleclipse.com/media/new-gameplay-features-added-to-ritas-rewind"]
title = "New Gameplay Features Added to Rita's Rewind"
description = "By request, some exciting changes are coming your way."
full_description = "Feb 19, 2025DE TeamminsGameIt's been a wild few weeks since we released Mighty Morphin Power Rangers: Rita's Rewind, and we're thrilled to see so many fans having so much fun, especially after the major balance update that went live in December (which was all based on fan feedback). We've continued listening to your thoughts and suggestions, and we have two pieces of news that we think you'll be happy to hear. This week, we're adding several new features to the game in a free update that we expect will be available on all platforms by next week. Different platforms have different processes, so we aren't sure exactly when the update will appear, but here's what you can expect when the Power Blast update arrives on your system. ‍Each Ranger now has individual stats. You decide the balance!‍Upgradeable RangersMany players asked for Rangers to feature different statistics, and some asked for a way to upgrade Rangers' abilities over time. Our original design aligned with the source material, which shows pretty clearly that all Power Rangers are very capable; we didn't want to make this one slower or that one weaker just for the sake of it. So, we're implementing a new statistics system designed with personal customization in mind. As you play through the game, you'll unlock stat points that you can use to augment your Ranger in one of three skill areas (Strength, Defense, and Speed). This gives each character variety while also allowing every fan to make their favorite Rangers play how they want them to play.‍Morphers can be actviated before you start a new game. Mix and match as you see fit.‍‍MorphersOur arcade-style experience was designed to be short but replayable. To make those replays more fun, we're adding Morphers, which modify gameplay elements like gravity, damage, and more. (And if you enjoyed the fact that all the Rangers were equally capable, one Morpher even restores that, too!) Mixing and matching these options will offer a lot of variety, and can make the game dramatically easier or seriously challenging. However you mix it up, the goal is to add even more fun to your sessions. They're intended to make replays more fun, not remove all challenge from the first playthrough, so you'll need to beat the game once to unlock Morphers!‍Tap Attack & Special at the same time to unleash a Power Blast...at a cost.‍Power BlastWhen Rita's minions threaten to overwhelm you, this new attack can knock them back…in exchange for a bit of your character's health bar. No reward without risk, but this heroic tactic might turn the tide in a difficult fight! Just tap Attack & Special at the same time to give it a try. Each Ranger displays a different visual effect when they perform this move.‍‍Ground RecoveryWith a properly timed button press, a hero who has been knocked back by an enemy attack can recover quickly and start attacking again, as opposed to landing on the ground and then needing to get up. This should keep the pace of those brawls at maximum speed.‍‍Remappable Controls‍Here's another feature requested by players that we're happy to add. During play, simply head to the options menu and, under Move List, select Remap Controls. Now, whatever buttons feel most comfortable and the ones you can use.‍We've recently announced a physical edition of Rita's Rewind, which will be available in early summer. We're happy to confirm that the gameplay improvements discussed above will be included on the PS5 and Switch physical media when those editions are released on May 30, 2025. If you would like to pre-order, click here for the evolving list of international retailers that will be carrying the game. What's next? Online improvements! Later this spring, we'll upgrade the game's online mode to allow up to six machines to connect for multiplayer matches. It's worth noting that since our game uses peer-to-peer connections, more machines in more locations with more distance between them will introduce more latency. We still feel a two-machine connection with multiple players on each side will offer the best co-op experience online, but since this feature was heavily requested, you will ultimately be the judge. ‍Thank you for all of your feedback and support for Rita's Rewind since launch; everyone at Digital Eclipse really appreciates the enthusiasm and love from the franchise's many fans. May the power protect you!TWITTERcopied :)"
year_published = 2025
clearnet = "https://digitaleclipse.com/media/new-gameplay-features-added-to-ritas-rewind"
