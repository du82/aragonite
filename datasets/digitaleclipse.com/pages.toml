title = "The Making of Karateka — Available Now!"
description = "The first entry in our new Gold Master Series is an interactive documentary exploring the creation of Jordan Mechner's debut game."
full_description = "Aug 29, 2023Digital EclipseminsGame★★★★★“The Making of Karateka is the gold standard for games preservation” — GamesHub9/10“Digital Eclipse has elevated this one game to an almost indispensable level” — Destructoid★★★★“A superbly crafted interactive documentary” — Video Games Chronicle‍After several years of development, we're excited to finally be able to say that The Making of Karateka, entry #01 in the Gold Master Series, is available today for PC and consoles! An interactive documentary exploring the creation of Karateka, the debut game of Prince of Persia creator Jordan Mechner, The Making of Karateka has debuted to excellent reviews. ‍Check out the official game page to learn more about the project and click the BUY NOW button to buy it for the low, low price of just $19.99, and prepare to transport yourself back into Jordan's college dorm room in 1984, as you find out how a teenager with an Apple II and a dream revolutionized the medium of the video game forever.‍Wondering where the Gold Master Series will go from here? You won't have to wait too long, as we expect to release game #02 this year. Subscribe to our email newsletter if you want to be the first to know what's next.TWITTERcopied :)"
