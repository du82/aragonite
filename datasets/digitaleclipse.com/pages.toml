["https://www.digitaleclipse.com/games/wizardry"]
title = "Wizardry: Proving Grounds of the Mad Overlord"
description = "A full 3D remake of the first game in the legendary Wizardry series of RPGs, powered by the original source code."
full_description = "A full 3D remake of the first game in the legendary Wizardry series of RPGs, powered by the original source code. ‍Congratulations to Winifred Phillips on her Grammy-award winning score to Wizardry: Proving Grounds of the Mad Overlord!‍ The first party-based RPG video game ever released, Wizardry: Proving Grounds of the Mad Overlord was a direct inspiration to series like Final Fantasy and Dragon Quest. Digital Eclipse's revival preserves the appeal of the classic, with many upgrades for modern role-playing game fans. Craft your own party of adventurers and head into the labyrinth at the behest of the mad overlord Trebor, in search of the amulet stolen by the evil wizard Werdna. Battle groups of challenging enemies, avoid hidden traps, and make your way deeper into the dungeon as you prepare for the ultimate battle: Facing Werdna himself. Wizardry: Proving Grounds of the Mad Overlord is built directly on top of the original 1981 game's code. Although it looks all new, underneath the hood is the authentic game. You can even view the original Apple II interface as you play. While the well-known difficulty of the enemies has not been altered, quality-of-life improvements have been added in every area. Party management, navigation, spellcasting, and combat have all been significantly enhanced. If you're just discovering the legendary Wizardry franchise, Wizardry: Proving Grounds of the Mad Overlord is the perfect jumping-in point for new players. Series veterans will love the gorgeous new graphics and sound, and the streamlined interface. Grammy-Winning SoundtrackWinifred Phillips' original score for Wizardry: Proving Grounds of the Mad Overlord earned a Grammy award for Best Score Soundtrack for Video Games and Other Interactive Media at the 2025 Grammy Awards. ‍Wizardry™ is a registered trademark of Drecom Co., Ltd. Proving Grounds of the Mad Overlord Copyright © (1981-2024) by FRPG Corporation. All rights reserved. Proving Grounds of the Mad Overl