["https://www.digitaleclipse.com/media/own-physical-editions-of-the-gold-master-series"]
title = "Own Physical Editions of the Gold Master Series"
description = "Tetris Forever, Llamasoft, and The Making of Karateka go physical in spring 2025."
full_description = '''Feb 18, 2025DE TeamminsGameWhen we launched the Gold Master Series of interactive documentaries in 2023, our editorial director Chris Kohler stated that our mission was "to elevate these games, presenting them in their best possible light while putting them in their proper historical context." We'd look at the creation of not only the playable games themselves, but explore what inspired their creators in the first place, hopefully imparting some insight while also preserving important games that we felt deserved more attention.We also wanted them on our shelves! As we released digital versions of The Making of Karateka, Llamasoft: The Jeff Minter Story, and Tetris(R) Forever, we'd always hoped to be able to produce physical editions as well. We know that would take time, but that time is finally here. All three Gold Master series titles will be available this spring in physical form for the PlayStation 5 and Nintendo Switch, courtesy of Limited Run Games in North America and Clear River Games in European territories. In addition to standard editions, each game will also be offered as a Deluxe or Collector's edition with additional items that we hope fans of each title will appreciate.‍‍The Making of Karateka's Collector's Edition includes a new, illustrated version of Jordan Mechner's personal journals, which is unavailable elsewhere. There's also a CD of Francis Mechner's legendary soundtrack to Karateka, an enamel pin of the player character sprite, and a poster of the Making of Karateka cover artwork, all packed in a clever box that resembles a vintage floppy disk drive. ‍‍Inside the Collector's Edition of Llamasoft: The Jeff Minter Story, you'll find the original soundtrack on CD, a reproduction of Llamasoft's first "The Nature of the Beast" fan newsletter from 1984, a cassette tape case insert like the ones that came with original Llamasoft releases, a poster of the title's psychedelic cover artwork, a pair of light-diffraction glasses (so you can see the world as if it were one big light synth), and a brightly-colored bandana covered in digital llamas. All of this is packed in a display-worthy box that looks like a stack of 3.5" floppy disks. ‍‍The box for the Collector's Edition of Tetris(R) Forever itself is a collectible; it's a special modular design that lets you reconfigure the package into the shape of your personal favorite Tetrimino. Inside, you'll find an exclusive limited-edition handheld Tetris game unit, which comes with a display stand. The set also includes a CD of the original soundtrack to Tetris Time Warp, a set of Tetrimino magnets, five woven patches, and a poster of Willea Zwey's striking key art.‍Pre-order pages for the Gold Master Series physical editions will be found at the websites of Limited Run Games for the North American releases and Clear River Games for the European releases starting February 25, 2025. We hope you'll want to add the whole Gold Master Series to your permanent collection.TWITTERcopied :)'''
