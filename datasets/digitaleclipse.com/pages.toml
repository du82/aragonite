["https://digitaleclipse.com/media/tetris-forever-welltris"]
title = "Tetris Forever Update: Welcome, Welltris!"
description = "Alexey Pajitnov's brilliant follow-up to Tetris joins the playable game list. Plus: Our plans for 2025."
full_description = '''Dec 20, 2024Chris KohlerminsGameHello Digital Eclipse fans! It's your editorial director Chris Kohler here. We've been blown away by the reception to Tetris Forever, and we know you want more. Frankly, so do we! That's why we've been working behind the scenes since we launched on November 12 to continue to bring you new features and, today, a new game.‍After the success of Tetris, its creator Alexey Pajitnov was inundated with requests for a "3D Tetris." The question was, what is 3D Tetris? What Alexey landed on was a brilliant combination of 2D gameplay and three-dimensional thinking: Welltris! ‍Pieces -- Tetriminos, of course, but also other polyominoes! -- fall down four sides of a well, and your job is to get them to form lines at the bottom. Can you handle Tetris times four? Much like the other MS-DOS games in Tetris Forever, Welltris has never before been officially re-released. Now you can play it from the comfort of your couch!‍In addition to Welltris, we also announced:‍All four players can now remap their controls in Tetris Time Warp.Remappable controls are also now available for MS-DOS, Electronika 60, and Apple II games on all platforms.We have fixed the audio stuttering issue that affected some games on the Nintendo Switch platform. This was being caused by a conflict with the Rewind feature, which has now been disabled on Switch in certain games. We will look into restoring it in a later update, if possible.‍WHAT'S NEXT IN 2025‍We wanted to get this update to you before the holidays, so you can enjoy Welltris while you're taking some time off! But that doesn't mean we're done. Tetris Time Warp's lead designer and programmer Jason Cirillo has been hard at work on a larger update to our original time-bending Tetris title, with many new features and game modes, which we aim to release early next year.‍In addition to continuing to explore the possibility of adding more new playable games, we're also prioritizing a fix for the issue that is keeping saved game functionality from working as it should across the classic games in Tetris Forever. The team is working on a fix that we expect to be able to have ready in early January.‍Want more news from us? Sign up for the Digital Eclipse email newsletter and we'll get it into your inbox as it happens. Have a happy holiday season, and we will see you in the new year for more Tetris Forever!TWITTERcopied :)'''
