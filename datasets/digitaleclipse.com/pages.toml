["https://www.digitaleclipse.com/page/wizardry-jp"]
title = "Wizardry: Proving Grounds of the Mad Overlord"
description = "伝説のRPG「ウィザードリィ」第一作のフル3Dリメイク版です。"
full_description = "『Wizardry: Proving Grounds of the Mad Overlord』はパーティー制を導入した世界初のRPGであり、後の国産RPGにも多大なる影響を与えました。Digital Eclipse による今回のリメイクでは、オリジナルの雰囲気を残しつつも、現在のRPGファンにも受け入れられるような改良も加えられています。 冒険者たちを集めてパーティーを編成、狂王トレボーの城塞都市に隣接した地下迷宮を探索し、邪悪な魔導師ワードナに奪われた魔除けを取り戻そう。様々な強敵と戦い、罠を避け、迷宮の奥底に進み、最後に待ち受けるのはワードナとの直接対決だ。 この『Wizardry: Proving Grounds of the Mad Overlord』は、1981年のオリジナル版のプログラムを流用して作られています。見た目こそ新しくなっていますが、その中身はまさに本物。Apple II 版のインターフェースがそのまま登場する場面も。 良く知られた、シリーズならではの難易度はそのままに、ゲームがより快適に遊べるよう全体的に改良を加え、パーティー編成、ダンジョン探索、呪文の詠唱、戦闘などがよりスムーズに行えるように調整を行います。 伝説の「ウィザードリィ」シリーズに馴染みの無い人にも、『Wizardry: Proving Grounds of the Mad Overlord』は最初にプレイするのにふさわしい作品になるでしょう。一方、リッチになったグラフィックやサウンド、そしてスムーズなインターフェースはベテランプレイヤーも満足させるはずです。 Wizardry™ is a registered trademark of Drecom Co., Ltd. Proving Grounds of the Mad Overlord Copyright © (1981-2024) by FRPG Corporation. All rights reserved. Proving Grounds of the Mad Overlord is a copyrighted program licensed to SirTech Entertainment Corp by FRPG Corporation. Proving Grounds of the Mad Overlord has been licensed to Digital Eclipse Entertainment Partners Co., by SirTech Entertainment Corp."
