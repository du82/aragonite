["https://www.digitaleclipse.com/games/tmnt"]
title = "Teenage Mutant Ninja Turtles: The Cowabunga Collection"
description = "The heroes in a half-shell make their long-awaited return in this complete collection of Konami's critically acclaimed arcade, home, and portable series."
full_description = "The heroes in a half-shell make their long-awaited return in this complete collection of Konami's critically acclaimed arcade, home, and portable series. In the 1980s and 1990s, the world was green and full of pizza. The Teenage Mutant Ninja Turtles took over the airwaves, movie screens, toy aisles… and, of course, video games, thanks to Konami's top-selling series of critically acclaimed TMNT titles. In 2022, Digital Eclipse and Konami brought every arcade, home console, and handheld game in the original series back to fighting form in the Cowabunga Collection. 13 games, plus their original Japanese versions, make Cowabunga a definitive look back at the Turtles' original run at the top. A variety of Enhancements for each game let players manipulate difficulty settings, lives, and other functions to play the games the way they want to. Digital Eclipse's signature Watch Mode lets players jump to any point in the game and start playing. The extensive Turtles' Lair is a Technodrome-sized archive of fascinating Turtle memorabilia. Its centerpiece is over a thousand pages of never-before-seen, intricately detailed design documents pulled from Konami's archives, giving players an inside look at how games of the 1980s and 1990s were created. The Lair is also filled with game boxes, full manuals, magazine advertisements, a soundtrack player, comic book covers, TV show screenshots, and much more. Finally, a unique Strategy Guide replicates the fun of reading through a 1980s video game magazine, with helpful tips, historical trivia, secret moves, detailed maps, and video tutorials for every game in the collection."
year_published = 2025
