["https://www.digitaleclipse.com/games/samuraishodown"]
title = "Samurai Shodown NeoGeo Collection"
description = '''Seven games from SNK's legendary fighting franchise get the deluxe treatment, including the first appearance of the series' "lost" game.'''
full_description = '''Seven games from SNK's legendary fighting franchise get the deluxe treatment, including the first appearance of the series' "lost" game. With its massive sprites and sharp weapon-based gameplay, 1993's Samurai Shodown sent SNK into the elite tier of fighting game creators. In 2020, Digital Eclipse collected six of the finest games in the series — plus a surprise players didn't expect they'd ever see. During the extensive research for Samurai Shodown NeoGeo Collection, Digital Eclipse discovered an unreleased, enhanced version of the game, dubbed Samurai Shodown V Perfect, which it restored and released some 15 years after its creation. The supplementary material from Digital Eclipse includes hours of exclusive video interviews with the series' original developers, more than 2000 pieces of development art and design documents, a detailed and interactive character guide spanning all the games, gameplay videos of tournament matches, and a music player featuring more than 200 tracks.'''
