["https://www.digitaleclipse.com/page/jobs"]
title = "Working at Digital Eclipse"
description = "We're always looking for team members with passion and talent. Is our studio the creative home you've been seeking?"
full_description = "We're always looking for team members with passion and talent. Is our studio the creative home you've been seeking? We're always on the lookout for creative people who love classic games and seek a creative challenge. Connect with us on LinkedIn or Indeed to see our currently available roles, but even if you don't see a perfect match in our public listings, reach out and introduce yourself and your work -- we might be a great fit for an unannounced project in development. The ideal candidate will be a highly skilled programmer with strong leadership and communication skills. You will work with our custom engine, developing new features, solving technical challenges, and contributing directly to the design and feel of our games. You will report directly to our Technical Director and interact directly with all disciplines of the development team. Help us develop video game emulators that allow classic games to be played on contemporary hardware! You will be responsible for designing, developing, and optimizing video game emulators. You will work closely with our engineers, designers, and QA team to ensure high performance, accuracy, and compatibility. Your work will directly contribute to bringing classic gaming experiences to new audiences.More info at the links below!Apply via GreenhouseApply via LinkedIn In 1994, the original incarnation of Digital Eclipse pioneered accurate video game re-releases, emulating vintage arcade games well before “emulation” was a household word. Nearly 30 years later, we remain dedicated to preserving gaming's heritage, telling the stories of gaming history through archival releases and interactive documentaries. At the heart of Digital Eclipse's releases is our proprietary Eclipse Engine technology. Custom-built for this special purpose, Eclipse Engine allows us to integrate multiple software emulation processes, original programmed work, video, audio, archival documents and more into a single, seamless multimedia experience.This tech allows our engineers to enhance and evolve classic gameplay, adding additional layers of functionality on top of a classic game. Online play, quality of life enhancements, or even deeper modifications can be added – all without disturbing the original work running underneath the enhancements.Eclipse Engine: Technology designed for preserving, and enhancing, games for future generations."
year_published = 2025
