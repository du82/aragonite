full_description = "Digital Eclipse respects your concerns about privacy. We want you to understand the types of information we collect, how we use that information, how we secure it, and whether we share it. When you use our websites, games, game engines, and applications, you agree to our collection, use, disclosure, and transfer of information as described in this policy, so please review it carefully. This policy applies to Digital Eclipse Entertainment Partners Co., and does not apply to our websites, games or applications that have their own separate privacy policies or notices. We only collect, use, share, store, or otherwise process your personal information when we have an appropriate basis. For example, we may process your personal information as necessary to provide services that are subject to terms you have accepted, such as our end user license agreements or service terms and conditions. We may process your personal information when necessary to comply with legal obligations or for purposes of pursuing legitimate interests, if doing so is consistent with your rights and appropriate to the context, such as providing services, addressing game performance, fixing bugs, performing internal analytics, and conducting reasonable monitoring of your use of our services to prevent misuse of our services and fraud. Additionally, we may, in certain cases, ask you for your consent for certain processing of your personal information. We generally collect or receive information in three ways: (1) you voluntarily provide information to us, such as by creating an account or signing up for email alerts, (2) we collect information automatically, such as through cookies or our games and other software, and (3) other parties, such as social networks, may provide information to us. Each of these methods is described in more detail below . You may provide your personal information to us when you choose to use our websites, games, game engines, or applications. Because we change our offerings and features from time to time, the options you have to provide us with information also may change. The following are some examples of situations in which you may provide information to us:"
