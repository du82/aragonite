title = "HostGator Alternatives, Part 1: Who is EIG? –  The Digital FAQ"
description = "The Hostgator you knew is gone, eaten up by the competition. We'll take an in-depth look at alternative web hosts, so this never happens to you again."
full_description = '''Home > Editorials > Web Design and Development HostGator Alternatives, Part 1: Who is EIG? Added January 13, 2015 by KP Since August 2013, Hostgator has had repeated downtime. Their entire datacenter would go offline. Hundreds of thousands of sites were affected, leaving customers without service AND without support. Each instance has lasted almost a full day. And it’s not just Hostgator that was affected. Bluehost, Hostmonster, JustHost and several other “hosts” were down as well. But it wasn’t a coincidence. For you see, all of those hosts are actually the same hosting company — Endurance International. People have started to realize that the Hostgator they once knew is gone, eaten up by the competition (pun intended). It is now under new ownership, and exists in name only. So where else can you go? We’re going to take an in-depth look at true Hostgator alternatives, so this never happens to you again. This article series was originally written in August 2013, and has been updated several times in 2014, 2015 and 2016. (Note: If you just want the quick advice on which host to use, then here it is: (1) SiteGround, (2) InMotion, and (3) Namecheap. Those are excellent Hostgator alternatives. However, you really should read the three-part editorial…) If you find this article interesting, please share it with others, using these links: <div style="padding-top: 5px; color: darkgray;">Javascript seems to be disabled; Google +1, Facebook, and Twitter are blocked.</div> And if you've found our site to be as helpful as a magazine, book or class, then consider a small donation to support what we do here. Or sign up as a Premium Member for only $20. Thanks! What Happened to Hostgator? Back in June 2012, Hostgator was sold for $225 million dollars to Endurance International Group (EIG). Brent Oxley — founder of Hostgator, former CEO, the primary reason it was so good for so long (and one rich son-of-a-gun) — is now gone. In the initial 14 months after the buyout, EIG made a number of major changes to Hostgator, all of which have resulted in degraded performance and poor uptime for customers. To understand what hosts are true alternatives to Hostgator, and safe from the EIG monster (i.e., future potential acquisitions!), it’s important to first understand who EIG is. Who is the Endurance International Group? A lot of people are unfamiliar with EIG — many didn’t even know about the buyout of Hostgator! Yet this comes as no surprise…. Endurance started out as Bizland Hosting about 15 years ago, in the late 1990s. It was a small host, and never really took market share from competing brands like JaguarPC or Network Solutions. So instead of growing as most businesses do, they made the then-unusual move (in the hosting industry) of acquiring other hosts to get new customers. And for at least 13 years, that’s what they’ve done. But EIG also did something that’s unusual for most industries — they hide. When EIG buys out a brand, it’s not made known to the public or the customers. No press releases. No branding changes. Most new companies love to rename their acquisition, or somehow add their name to it. (For example, the recent acquisition of Softlayer by IBM now carries the tagline “an IBM company”.) EIG now owns more than 60 brands, such as Hostgator, Bluehost, A Small Orange, Arvixe, and Site5. News involving EIG comes almost entirely from investigative “follow the money” type reporting within the hosting industry. And because web hosting is still considered too techie for the average news reader, it never makes it into regular news outlets — not even the national ones like USA Today, CNN or BBC. This is why most folks were completely blindsided a year after the EIG acquisition of Hostgator. <a href='http://cdn6.digitalfaq.com/cache/c/ab8fded8/0228201301' target='_blank'> <img class="colorbox-2931" src='http://cdn6.digitalfaq.com/cache/v/8/0228201301/ab8fded8' border='0' alt='' /></a> EIG … The Good, the Bad and the Ugly EIG doesn’t just buy hosts — it liquidates them. From what we can tell, it has 4 divisions: - the older vDeck brands - the older cPanel brands, using the “Bluehost method” (Hostgator, Bluehost) - the newer cPanel brands, using the “A Small Orange method” (Site5, Arvixe, ASO) - and recent acquisitions, which are eventually assimilated by EIG Until 2011, EIG would acquire a host, and then convert the customers to its proprietary vDeck control panel, which is like a limited version of cPanel. They only supported shared hosting, and non-shared customers were cast aside, casualties of the buyout. Starting with Bluehost in 2011, EIG began to use a crippled and throttled version of cPanel, and using the not-better BetterLinux custom OS that allowed more customers to be crammed on a server. For users that wonder why EIG servers are so slow, that’s why. And it wasn’t just the customers that got the shaft. Historically, EIG has fired (laid off) the staff of recently acquired hosts, and shuttered its doors. The old owner and/or management was gone, paid off handsomely, so nobody was left to protect the employees. Many HG customers have noticed a severe delay in ticket response and scripted tech support for months; attrition and non-HG EIG techs taking tickets is likely. One has to wonder if the Hostgator employees in Texas will be another casualty. With the HG migration to an EIG datacenter underway, the employees and the alligator mascot are all that’s left. <a href='http://cdn6.digitalfaq.com/cache/c/ab8fded8/0228201301' target='_blank'> <img class="colorbox-2931" src='http://cdn6.digitalfaq.com/cache/v/8/0228201301/ab8fded8' border='0' alt='' /></a> Conclusion of Part 1 The hosting community at large — found on sites such as webhostingtalk.com (WHT) — was half shocked by this announcement, and many seasoned hosting customers familiar with EIG’s past bailed out early. Most were aware of EIG’s repetitive past, and had no desire to be part of its future. The other half were aware that Hostgator had been on the market before (in 2011), that EIG wanted Hostgator badly, and it was only a matter of time and price before that happened. Those users bailed out even earlier. Regardless of why those users left, they moved on to better providers. And that brings us to Part 2 — who are the better Hostgator-like alternatives? Read more: HostGator Alternatives, Part 1: Who is EIG? HostGator Alternatives, Part 2: Who to Use and Why HostGator Alternatives, Part 3: The Future of EIG? Have comments or feedback? — Be sure to share your thoughts in this forum post. If you find this article interesting, please share it with others, using these links: <div style="padding-top: 5px; color: darkgray;">Javascript seems to be disabled; Google +1, Facebook, and Twitter are blocked.</div> And if you've found our site to be as helpful as a magazine, book or class, then consider a small donation to support what we do here. Or sign up as a Premium Member for only $20. Thanks! Copyright Notice: All guides, articles and editorials found on digitalFAQ.com are copyright by The Digital FAQ and/or the respective authors. Articles may not be copied, borrowed, full-quoted or reproduced in any manner, online or in print, which includes blogs and forums, without the written email consent of Site Staff (which may or may not be given, for free or fee). Know that digitalFAQ.com staff does routinely monitor online plagiarism, and we do send takedown notices to site admins and/or web hosts (DMCA et al legal actions) as is necessary. If you would like for others to read articles found on The Digital FAQ, simply link to our content. (Note: Printouts for personal use is specifically allowed.) Article Category: Web Design and Development Article Tags: EIG, Hostgator, hosting, unlimited hosts, web hosting Site Search Recent Reviews WebHostingBuzz UK Hosting [Pre-Review] Best DVD Recorders | 2002-2014 in Review: Part 1 Ninja Hawk Hosting [Pre-Review] Recent Guides Video Workflows: Capture MPEG-2 for DVD How to Block Throwaway (Disposable) Email Accounts How to Prevent Forum Spam and Blog Comment Spam How to Encode MPEG-2 with Avidemux (Freeware) – Part 2 How to Print Web Pages and Remove Unwanted Content Recent Editorials KVC Hosting 4-year Review, Pt1: Price, Speed, Uptime What’s in a Professional Video Workflow to Convert Analog Videotapes? Restore Manager: the Best cPanel Backup Solution HostGator Alternatives, Part 1: Who is EIG? HostGator Alternatives, Part 2: Who to Use and Why Latest Forum Posts LordSmurf budget workflow output check? Is Panasonic AG-1980 worth it for VHS-C? Datavideo TBC-1000 broken? ATI AIW 9800 XT faulty squid cable, stuck pin? Eliminate interference due to poor reception Horisontal lines in high contrast areas on Video8 transfers? JVC PTU94023B jig RCU on eBay, several available! Building library of free images for video editing! Best digitization equipment for my budget? Capture of VHS - reasonable filtering?'''
