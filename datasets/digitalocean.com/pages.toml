["https://digitalocean.com/pricing/managed-databases"]
title = "Managed Database Pricing | DigitalOcean"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = 'Fully managed MongoDB, Kafka, MySQL, PostgreSQL, and Caching database engines to give your application the performance it needs-without the operational overhead of managing your own database server. MongoDB is a source-available cross-platform document-oriented database program for high-volume storage. Classified as a NoSQL database program, MongoDB uses JSON-like documents with optional schemas. Kafka is an open-source distributed event and stream-processing platform built to process demanding real-time data feeds. It is inherently scalable, with high throughput and availability. All Kafka clusters are priced in terms of the number of "brokers", with plans starting out with three brokers for high availability. MySQL is a prominent open-source relational database management system. An incredibly flexible and powerful program, MySQL is used to store and retrieve data for a wide variety of popular applications. PostgreSQL is an open source, object-relational database built with a focus on extensibility, data integrity, and speed. Its concurrency support makes it fully ACID compliant, and it supports dynamic loading and catalog-driven operations to let users customize its data types, functions, and more. Managed Caching is compatible with Redis, which is an open-source, key-value database built with an in-memory design that emphasizes speed. It has support for rich data types, atomic operations, and Lua scripting. OpenSearch is a flexible open-source search and analytics suite designed to meet the needs of growing businesses. This powerful platform gives you the power to efficiently index, search, and analyze vast amounts of data. We accept Visa, Mastercard, American Express, Discover, PayPal, Google Pay, and Apple Pay. Apple pay requires a Safari browser. For additional payment options, including wire transfer, purchase orders, and ACH, please contact us. Note that when you add a card, we may send a temporary pre-authorization request to the issuing bank. This pre-authorization charge is immediately released by DigitalOcean but may take a few days to clear from your card depending on the bank.'
