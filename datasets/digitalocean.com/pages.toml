["https://digitalocean.com/blog/now-available-anthropic-deepseek-models-gen-ai-platform"]
title = "Anthropic and DeepSeek Join the GenAI Platform Model Library | DigitalOcean"
description = "DigitalOcean’s GenAI Platform continues to expand, making AI-powered development more accessible, flexible, and powerful. Today, we're excited to announce the availability  of Anthropic's Claude models and DeepSeek R1 into our ecosystem, giving you even more options to build and deploy AI-driven applications."
full_description = "DigitalOcean’s GenAI Platform continues to expand, making AI-powered development more accessible, flexible, and powerful. Today, we’re excited to announce the availability of Anthropic’s Claude models and DeepSeek R1 into our ecosystem, giving you even more options to build and deploy AI-driven applications. With Anthropic Claude 3.5 (Sonnet & Haiku), Claude 3 Opus, and DeepSeek R1-distill-llama-70B, you get access to advanced AI options for content generation, real-time interactions, and problem-solving. Beyond serverless inference, meaning that you do not have to manage or provision underlying infrastructure to run AI models, DigitalOcean’s GenAI Platform offers an end-to-end agentic framework with seamless integration and easy deployment. This helps enable you to build AI-driven experiences without infrastructure headaches, paying only for what you use. Anthropic’s Claude models are designed to cater to a variety of enterprise needs, balancing intelligence, speed, and cost. Here’s an overview of the available models: Claude 3.5 Sonnet – This is the most advanced model in the Claude 3.5 family, offering top-tier performance with improved speed. It’s ideal for: Claude 3.5 Haiku – This model offers near-instant responsiveness, emulating human interactions. It’s best for: Claude 3 Opus – This model is designed for strong performance on highly complex tasks, such as mathematics and coding. It’s well-suited for: Users can now integrate Claude models into their GenAI Platform agents by providing their Anthropic API key at setup. Token usage is billed directly to the user’s Anthropic account, while any DigitalOcean resources used (e.g., knowledge bases, functions, guardrails) are billed through their DigitalOcean team account. The DeepSeek R1 model family represents cutting-edge advancements in open-source AI. Released in January, DeepSeek R1 models have made a splash in the AI community, in some instances, even outperforming leading models. DeepSeek R1-distill-llama-70B is available on the GenAI Platform, and token usage is billed directly through the user’s DigitalOcean account, with no API key needed."
