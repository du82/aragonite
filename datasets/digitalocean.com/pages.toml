full_description = "With the wild wave of 2022 behind us, we’re taking the opportunity to look back at the impact DigitalOcean created and supported last year. Here’s a recap of progress and highlights from the first official year of DO Impact: In April, DigitalOcean launched DO Impact at the NYSE. The event was both a celebration and a commitment to developing our strategy and programming as a Pledge 1% member. We’re just getting started, but feel excited about the meaningful headway we’ve made since then. Despite an economically challenging year, DigitalOcean remained committed to its philanthropy and Pledge 1% commitment. Between cash grants, ERG-driven donations, employee donation credits, and matching employee contributions, DigitalOcean gave over $1.1M to more than 900 organizations in 2022. This $1.1M was split across: Finally, this year, we surpassed 2,200 nonprofit organizations using DigitalOcean with the support of infrastructure credits via Hollie’s Hub for Good (HH4G). In 2022, we hosted two extremely successful employee giving campaigns and launched our first skills-based volunteering pilots. These initiatives reinforced how fortunate we are to be the place of work for such generous and thoughtful employees. Below are a few highlights: We engaged with amazing partners like UNICEF and Fast Forward, helping catalyze and extend our reach to more tech-driven nonprofits worldwide. We held a workshop in Bolivia with Hollie’s Hub for Good recipient Unicodemy, where we helped young girls in La Paz learn how to use cloud technology. We also held our first panel session at our customer conference highlighting two incredible nonprofit partners, Code Berlin and Bonterra. Hollie’s Hub for Good was recognized at the 2022 DevRel Awards, winning Best DevRel Initiative and Greatest Contribution to Society, and DigitalOcean was honored as the RaisedBy.Us Impact Partner of the year. Finally, we joined our Pledge 1% community at Nasdaq to celebrate Giving Tuesday, and DO 