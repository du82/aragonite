["https://digitalocean.com/blog/do-impact-at-deploy"]
title = "DO Impact at deploy | DigitalOcean"
description = "This year at deploy, the DO Impact team announced a new round of grants, interviewed nonprofits and social enterprises, and had a blast connecting with conference participants in our social impact Discord channel."
full_description = "This year at deploy, DigitalOcean’s annual customer conference, the DO Impact team had an opportunity to shine the spotlight on nonprofits, sharing sessions, content, and engagement with a unique social impact focus. Our team announced a new round of grants, interviewed nonprofits and social enterprises, and had a blast connecting with conference participants in our social impact Discord channel. We loved learning more about what DigitalOcean means to our broader community. Check out a recap of the events below! During the opening keynote, we shared the exciting news that in 2022, DigitalOcean has committed a total of $1M in cash grants to support nonprofits and social enterprises around the world. This milestone is the first of many we’ll share on our journey toward our Pledge 1% commitment. As part of this year’s giving, we announced five new grantees at deploy. DO Impact will award a total of $300,000 to five organizations spread across three communities that are important to us—each representing places where most of our employees are concentrated. We’re so inspired by—and thrilled to partner with—these incredible organizations dedicated to improving their communities. New York: As the location of DigitalOcean’s original headquarters, the city of New York is home to many of our employees. And we know that across NYC, the Bronx is the borough with the highest percentage of residents without broadband internet access. We’ve partnered with The Bronx Community Foundation’s Digital Equity Initiative to expand access to digital resources for children, families, and seniors in the Bronx—the most underserved community in NYC. In addition to the cash grant, our Data Center team is working with the Foundation on a broader collaboration to leverage equipment, like retired servers, and technical capacity with our employee volunteers. Dr. Meisha Porter, President and CEO of the Bronx Community Foundation, said: “We’re so excited to work alongside DigitalOcean as we build sustainable futures in the Bronx. Our organizations are incredibly mission-aligned, and this partnership will allow us to continue to enable the next generation of diverse innovators.”"
