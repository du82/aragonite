["https://digitalocean.com/customers/parabol"]
title = "Customers - Parabol"
description = "When Parabol got started, they were familiar with AWS because they’d used it before. But they wanted to try something else. They were initially drawn to DigitalOcean because of a superior product offering – including the first blades with SSD hard drives at just $5 a month for a Droplet."
full_description = "Parabol is a remote meeting platform for Agile teams. They make it very easy for Agile product development teams and business agility teams to routinely hold plannings, scrum, and retrospective meetings online – remotely – without the need for a conference room or Post-it® Notes. Parabol estimates that there are approximately 20 million developers who use some flavor of the Agile product development methodology on their teams. The easiest proxy for their market is the folks who supply tools for backlog management or development team knowledge management like Atlassian, Microsoft DevOps, GitLab (to some extent), ZenHub, Clubhouse, and more. One of their company values is transparency. With publicly available metrics, they believe they can “[be] an open book.” They have experienced a dramatic increase in usage since the healthcare crisis began. In February 2019, Parabol were seeing a rolling four-week average of 500 signups a week. Once the pandemic hit in full force, they saw a steady increase in signups, increasing to 750 signups a week, followed by 1,250 in another week, and peaking at close to 5,000 in a single week. At that point Jordan realized the growth was “out of control.”. “Specifically in relation to DigitalOcean, we had to scramble to bring up a whole bunch of additional infrastructure,” he recalled. When Parabol got started, they were familiar with AWS because they’d used it before. But they wanted to try something else. Jordan was initially drawn to DigitalOcean because of a superior product offering – including the first blades with SSD hard drives at just $5 a month for a Droplet. But they also understood that the emotional side of the experience was critical. The cloud needed to offer a simple user experience, but it also had to look great. Jordan recalled previous experiences conducting software experiments, in which he’d create tools for teams to use where the hosting option became DigitalOcean simply because the product was so easy and friendly to manage – all at the right price."
