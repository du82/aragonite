title = "Deploying your Microservices Architecture App in App Platform using Managed Kafka | DigitalOcean"
description = "Microservices architecture apps are characterized by organizing application components in such a way that they can be developed, tested, deployed and scaled separately. App Platform aims to make this model seamless by allowing the user to add multiple components on the same app."
full_description = "Microservices architecture apps are characterized by organizing application components in such a way that they can be developed, tested, deployed and scaled separately. App Platform aims to make this model seamless by allowing the user to add multiple components on the same app. This type of microservices architecture allows developers to scale the web service API (producer) and the backend processing service (consumer) separately to meet application demands. For example, the backend service processing may be CPU resource intensive and benefit from a Dedicated CPU instance that can autoscale based on demand. On the other hand, the web service API may perform well with a Shared CPU instance with a fixed scale of 2 for redundancy. App Platform support for apps with multiple components enables the producer and consumer pattern that microservices architectures need. However, we take it a step further to simplify the developer journey by implementing a seamless integration with DigitalOcean Managed Kafka Offering. More details on the integration can be found in here. App Platform’s Kafka integration allows you to attach Kafka instances to your app and simplifies the environment variable configuration needed to connect to Kafka. This allows you to focus on building your app and not worry about the infrastructure setup. Our goal is to make this as DO Simple as possible, here are the steps. Try it and let us know what you think! Instructions on how to deploy a managed Kafka can be found here. A topic is also required in order to publish and consume messages. Here is how your app would look like. Notice the producer is a web service and the consumer is a worker. Also, in order to ensure your application can connect to Kafka correctly, the following environment variables are needed. There is a web UI included in the sample app to produce a message. The text you entered in the UI can be seen in the runtime logs of the consumer component. In the interest of being iterative in our value delivery to you, we released the Managed Kafka integration with App Platform as Beta. But we are not going to stop there!"
