["https://digitalocean.com/blog/daily-backups-now-generally-available"]
title = "Protect your data with Daily Backups | DigitalOcean"
description = "We’re thrilled to announce that daily backups have officially moved from early availability to general availability, making them available to all our customers! This is a major milestone for us, and we’re thrilled to expand access to this powerful feature."
full_description = "We’re thrilled to announce that daily backups have officially moved from early availability to general availability, making them available to all our customers and across all of our data centers! This is a major milestone for us, and we’re thrilled to expand access to this powerful feature. For those who missed our early availability announcement, here’s a quick refresher on daily backups: Businesses today generate a huge volume of data at incredible velocity making backups a crucial element of every business’ data protection strategy. With daily backups now available, DigitalOcean has you covered so you can: Creating a new Droplet? Backups are available for you to enable during your Droplet creation. Set your four hour time window to help ensure there are no disruptions during your most critical times. Have an existing Droplet you’re looking to enroll in daily backups? It’s just as easy to enable your existing Droplets with daily backups! Either select a Droplet from your fleet to manage and update your backup settings, or head over to the ‘Backups and Snapshots’ section to setup automated backups. Looking for your backups? You can find all of your backups under “Backups & Snapshots,” where you can find a list of all of your Droplets enabled with backups, and a dropdown list of all backups for each Droplet. And remember—just like all of our other features—daily backups can be created and managed via the Cloud Console, CLI, or API. Be sure to check out our documentation for more details. For any additional support, feel free to reach out to our sales team. If you haven’t explored daily backups yet, now’s the perfect time. Dive in and see the benefits for yourself! We’re excited about what’s next for data protection at DigitalOcean. Stay tuned for future enhancements and updates that will help you further secure and protect your data. We also welcome your feedback to help us improve and evolve the feature. Thank you for your continued support and enthusiasm! We’re committed to delivering the best possible experience and look forward to continuing to serve you."
