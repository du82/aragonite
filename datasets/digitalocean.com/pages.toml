["https://digitalocean.com/blog/deploy-2024-virtual-conference"]
title = "Join us at Deploy, DigitalOcean’s virtual conference | DigitalOcean"
description = "Deploy is back! DigitalOcean’s signature virtual conference is a place for developers, startups, founders, and everyone in between to learn from experts, connect, and be inspired to build their vision on DigitalOcean’s simple, developer-friendly cloud."
full_description = "Deploy is back! DigitalOcean’s signature virtual conference is a place for developers, startups, founders, and everyone in between to learn from experts, connect, and be inspired to build their vision on DigitalOcean’s simple, developer-friendly cloud. Deploy will be held on July 9, 2024, and this year we’re bringing in new speakers, new sessions, and new product updates that you won’t want to miss. At Deploy we’re committed to providing valuable developer and technical sessions on the latest advancements in the cloud. You’ll also hear from DigitalOcean leaders including CEO Paddy Srinivasan and VP of AI Advocacy, Dillon Erb, and industry experts like Eric Ries of the Lean Startup. Get inspired by DigitalOcean customers across industries who leverage DigitalOcean’s capabilities to build disruptive applications and guide the next wave of AI development, including Kyle Campbell, Founder and CEO of cto.ai, and Johnny Dallas, Founder and CEO of Zeet. We’ll have sessions to help business leaders navigate the cloud landscape and learn how to maximize their reach through DigitalOcean’s Marketplace. Plus, we’ll bring dedicated sessions for developers and technical leaders, such as Nomic, Supermaven, and Lepton using Paperspace by DigitalOcean to advance their AI objectives You can also explore an interactive talk on how to build a photo editor using Rust that incorporates gRPC for efficient inter-service communications. We hope you are excited, because Deploy attendees will get a sneak peek at upcoming DigitalOcean product and feature releases and a behind-the-scenes look at our engineering processes and priorities. You’ll have a chance to see how customers get things done, meeting growth objectives with DigitalOcean. DigitalOcean Interim CTO Todd Redfoot and other members of the engineering teams at DigitalOcean will walk you through our infrastructure roadmap, including technical deep dives on regional balancing, performance telemetry, and implementing