["https://digitalocean.com/blog/10th-anniversary-hacktoberfest-recap"]
title = "The 10th anniversary of Hacktoberfest is a wrap! | DigitalOcean"
description = "Hacktoberfest, a month-long celebration of open-source software, has once again joyfully brought individuals together worldwide to contribute to open-source projects during the month of October."
full_description = "Hacktoberfest, a month-long celebration of open-source software, has once again joyfully brought individuals together worldwide to contribute to open-source projects during the month of October. Developers, maintainers, and first-time contributors crafted innovative solutions, making technology more accessible to all. We are deeply grateful to those who contributed and helped make this Hacktoberfest a great year, even as we made several changes to the program. Hacktoberfest’s legacy as an open source celebration continues to grow, and we saw many new participants this year! What stood out was the genuine enthusiasm among participants to work together to contribute to open source projects, driven by a desire for improvement rather than focusing on rewards. At its core, Hacktoberfest’s mission is to inspire more people to get involved in open source and work together to improve the software powering our world today. We’re proud that Hacktoberfest continues to be a source of inspiration, consistently motivating people and successfully fulfilling our mission. This year we removed the t-shirt reward that folks had come to know and love. While we expected this to impact participation in Hacktoberfest, we were very pleased that 98,855 people from 184 different countries registered for Hacktoberfest compared to 146,891 last year. Participants also completed a total of 118,469 contributions during the month of October and 139,422 repositories opted-in to participate. In fact, Hacktoberfest has contributed 2.4 million accepted pull/merge requests to open source projects in its ten years. From our partner, OpenSauced “We were inspired to see our contributors making progress and growing through our repositories and documenting their growth and contributions through the OpenSauced platform during Hacktoberfest. We also had the privilege of onboarding two dedicated community maintainers who supported new contributors with kindness. The commitment and energy of our contributors and maintainers have inspired others to make meaningful contributions to open source that have already continued beyond October.”"
