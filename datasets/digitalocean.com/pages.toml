full_description = "This is a contract between you (the “Affiliate”) and DigitalOcean, LLC or an applicable DigitalOcean Affiliate (“DigitalOcean”). It describes how we will work together and other aspects of our business relationship. It is a legal document so some of the language is necessarily “legalese” but we have tried to make it as readable as possible. The Affiliate Program Agreement applies to your participation in our Affiliate Program (the “Affiliate Program”). These terms are so important that we cannot have you participate in our Affiliate Program unless you agree to them. We periodically update these terms. We might also choose to replace these terms in their entirety if, for example, the Affiliate Program changes, ends, or becomes part of an existing program, including our partner programs. If we update or replace the terms we or the Affiliate Tool will let you know via electronic means, which may include an in-app notification or by email. If you don’t agree to the update or replacement, you can choose to terminate as we describe below. 1.1. This Agreement is between you and the relevant DigitalOcean Affiliate as set out in Program Policies. If the Program Policies do not specify a DigitalOcean Affiliate then this agreement is between you and DigitalOcean, LLC. 1.2. This Agreement does not create an exclusive agreement between you and us. Both you and we will have the right to recommend similar products and services of third parties and to work with other parties in connection with the design, sale, installation, implementation and use of similar services and products of third parties. 2.1. Once you complete an application to become an Affiliate, we will review your application and notify you whether you have been accepted to participate in the Affiliate Program, or not. Before we accept an application, we may want to review your application with you, so we may reach out to you for more information. We may require that you complete certain requirements or certification(s) before we accept your application. If we do not notify you that you are accepted to participate in the Affiliate Program within thirty (30) days from your application, your application is considered to be rejected."
