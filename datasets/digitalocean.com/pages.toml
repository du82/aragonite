["https://digitalocean.com/community/tutorials/the-hidden-bottleneck-how-gpu-memory-hierarchy-affects-your-computing-experience"]
title = "The Hidden Bottleneck: How GPU Memory Hierarchy Affects Your Computing Experience | DigitalOcean"
description = "In this article, we examine the mechanisms behind GPU memory hierarchy."
full_description = "The GPU memory hierarchy is increasingly becoming an area of interest for deep learning researchers and practitioners alike. By building an intuition around memory hierarchy, developers can minimize memory access latency, maximize memory bandwidth, and reduce power consumption leading to shorter processing times, accelerated data transfer, and cost-effective compute usage. A thorough understanding of memory architecture will enable developers to achieve peak GPU capabilities at scale. CUDA (Compute Unified Device Architecture) is a parallel computing platform developed by NVIDIA for configuring GPUs. The execution of a CUDA program begins when the host code (CPU serial code) calls a kernel function. This function call launches a grid of threads on a device (GPU) to process different data components in parallel. A thread is comprised of the program’s code, the current execution point in the code, as well as the values of its variables and data structures. A group of threads form a thread block and a group of thread blocks compose the CUDA kernel grid. The software components, threads and thread blocks, correspond directly to their hardware analogs, the CUDA core and the CUDA Streaming Multiprocessor (SM). Threads are organized into blocks and blocks are organized into grids. Figure taken from the NVIDIA Technical Blog. H100s introduce a new Thread Block Cluster architecture, extending GPU’s physical programming architecture to now include Threads, Thread Blocks, Thread Block Clusters, and Grids. There are varying degrees of accessibility and duration for memory storage types utilized by a CUDA device. When a CUDA programmer assigns a variable to a specific CUDA memory type, they dictate how the variable is accessed, the speed at which it’s accessed, and the extent of its visibility. Figure taken from Chapter 5 of the 4th edition of the textbook, Programming Massively Parallel Processors. Register memory is private to each thread. This means that when that particular thread ends, the data for that register is lost."
year_published = 2025
