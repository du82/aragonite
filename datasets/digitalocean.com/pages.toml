["https://digitalocean.com/currents/november-2022"]
title = "December 2022 | DigitalOcean"
description = "DigitalOcean's Q4 2022 report on how startups and SMBs are faring today."
full_description = "In our latest edition of Currents, DigitalOcean’s regular research report, we examined how startups and SMBs are faring today. With an impending recession and regular news of layoffs and spending cuts throughout the technology industry, we wanted to find out how startup founders and small business executives are really feeling. How negatively is the economy impacting them, and what are their priorities going into 2023? What opportunities do they see for the future, and how are they planning to future-proof their businesses? We examined these topics, along with other areas that are top-of-mind for businesses today, including security threats, cost of technology, funding concerns, and cloud migration. To get a pulse on these items, we surveyed a targeted group of founders, CEOs, and executives at startups and small businesses across industries, with a focus on those building digital solutions. The below results are based on completed responses from 554 respondents, 70% of whom identify as CEO, founder, or owners, and 23% who identify as CTOs. Small businesses are feeling the economic slowdown, but remain optimistic about the future: 32% of SMB respondents say the economy has had no impact on their business, while 14% say it has impacted them positively. The optimism extends to their revenue opportunities, with 48% saying their business is performing better now than this time last year. Sixty-three percent feel positive about the outlook for 2023; seventy-nine percent feel positive about the next three years. Investing in technology helps drive efficiency and future-proof businesses: Eighty-five percent of companies believe that investing in technology will help them prepare their businesses for the future, including investments in automation/self-service (53%), cloud computing (41%), and managed services (32%). Respondents say these technology investments provide increased efficiency (67%) and cost savings (47%). Businesses are struggling with cloud migration: Half of businesses have migrated cloud providers, with 49% of those who have migrated saying the process was very or somewhat difficult, and 85% saying they might consider migrating if the process was easier. Costs are the main driving factor for both those who have migrated (65%) and those who haven’t migrated cloud providers in the past (70%)."
