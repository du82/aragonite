title = "November 2023 | DigitalOcean"
description = "DigitalOcean's November 2023 report on how startups and SMBs are faring today."
full_description = "In this latest installment of Currents, our recurring research report, we delve into the present state of startups in an uncertain economic landscape. Focusing on key players in the tech ecosystem—founders, executives, and employees—we explored how they’re navigating issues like fundraising, hiring, and future-proofing their businesses. With the world of work in flux, we gauged sentiment toward remote work and return-to-office policies. As the artificial intelligence boom continues, we also examined how businesses are adopting AI technologies, from conversational agents like ChatGPT to complex machine learning models, and the challenges they face in doing so. Naturally, we also touch upon critical areas like cloud computing and cybersecurity. To capture a well-rounded view, we surveyed a diverse group that includes respondents from domains such as developer tools, tech infrastructure, fintech, blockchain, gaming, and entertainment. The survey has a global reach, featuring respondents from around the world—from Belarus to Brazil. The findings are based on 665 completed surveys, with 58% of respondents identifying as full-time employees, 19% as self-employed or entrepreneurs, and 15% as company owners or founders. Let’s get to the details. 2023 has been characterized by rising inflation, elevated interest rates, and widespread layoffs in the tech sector, posing challenges for both businesses and consumers. We found that 42% of respondents indicate that the current economic situation has negatively impacted their business. However, many businesses remain optimistic—asked about the outlook for their business in the next year, 37% had a somewhat positive stance, while 15% had a very positive posture. Despite economic challenges, most companies remain committed to investing in emerging technologies like AI/ML to improve operations, though ethical concerns and implementation costs are top barriers. Software development tools and data analytics are seen as the most promising AI applications across industries, though the current hype cycle has left many uncertain about tangible benefits. The survey uncovered that 43% of respondents are currently using AI/ML tools for both personal and business use. Meanwhile, 78% of those surveyed believe that their use of AI/ML will increase compared to last year."
