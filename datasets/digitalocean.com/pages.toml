title = "Open Source | DigitalOcean"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "Open source software is freely available to use, lovingly made by people all over the world, and at the heart of DigitalOcean's business. In addition to open source powering many of our own libraries and frameworks, open source projects and the open source community embody values that we believe in and advocate for—innovation, collaboration, and optimism. Open source enables our business, and developers everywhere, to innovate and iterate quickly, which improves our products and helps our customers and community grow their big ideas more effectively. DigitalOcean relies on open source technologies to do what we do. From our website that's built with Next.js to our core products, DigitalOcean proudly uses open source technologies like those below to run our business. We contribute to open source projects and we create them. Some of our projects are aimed at improving the developer experience of using DigitalOcean. We also create useful projects for developers of all platforms, not just DigitalOcean. DigitalOcean offers grants of credits to open source projects to help with their development, infrastructure, and testing needs. No. All applications are subject to our review and approval process. You will be asked to fill out the Credits for Open Source Application each time you renew. If the project renewal is declined you will be informed before your grant runs out. It is helpful for us to understand why you need the renewal, and if you have new or different usage needs. You will be prompted to answer those questions when you fill out the Application. At DigitalOcean, we help open source projects thrive by participating in events and hosting our own, notably Hacktoberfest. We encourage everyone to contribute to the wider open source community. We're proud to support open source. DigitalOcean offers credit grants to open source projects, assisting with development, infrastructure, and testing. We give back to the open source ecosystem we participate in and depend on."
