["https://digitalocean.com/customers/scraperapi"]
title = "Customers - ScraperAPI"
description = "ScraperAPI is a proxy solution for web scraping that helps companies collect clean, insightful data from any HTML webpage. They utilize DigitalOcean Managed Databases and DigitalOcean Kubernetes to manage their data-heavy business."
full_description = "ScraperAPI is a proxy solution for web scraping that helps companies collect clean, insightful data from any HTML webpage without being blocked. Whether you’re looking to scrape marketplace pricing, stock market data, job listings, or simply keep an eye on your competitors, you can scrape the data you need with a simple API call. Founded in 2018, ScraperAPI is used by over 10,000 companies today—including startups, small businesses, and large enterprises. The scale at which ScraperAPI operates is immense. 36 billion web scraping requests are initiated on their platform each month and it scrapes over 14,000 websites per second. Needless to say, databases are a critical part of their business. Zoltan Bettenbuk, the CTO of ScraperAPI, understands the pain involved in self-managing databases. Before joining ScraperAPI, he had first-hand experience maintaining databases in prior roles. It was a significant burden on business. “The weight of self-managing databases on you and your team is incredible. You’re responsible for making sure that the data, which is the most valuable asset of a company, is always safe, available, has backups, and has failover. I would honestly never do it again.” — Zoltan Bettenbuk, CTO of ScraperAPI Ultimately, he sought to find a better solution than burdening the ScraperAPI team with that immense task. He found that solution with DigitalOcean Managed Databases. In his previous job, Zoltan used a bare metal service provider where scaling a database could take upwards of two weeks; the provider had to provision new hardware. That experience cemented his decision to find a cloud option instead. Today, ScraperAPI uses DigitalOcean Managed PostgreSQL and Managed Redis, which have allowed them to scale with ease. If ScraperAPI needs to scale the database to get more storage or compute power, they can do so on-demand and with the click of a button. “The best thing here is that if I want to scale up to even 2x, I can do it in about a minute.” — Zoltan Bettenbuk, CTO of ScraperAPI"
year_published = 2025
