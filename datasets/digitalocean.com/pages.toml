["https://digitalocean.com/pricing/functions"]
title = "Functions Pricing | DigitalOcean"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "DigitalOcean Functions is a serverless computing solution that runs on-demand, enabling you to focus on your code, scale instantly with confidence, and save costs by eliminating the need to maintain servers. DigitalOcean Functions is a serverless computing solution that runs on-demand, enabling you to focus on your code, scale instantly with confidence, and save costs by eliminating the need to maintain servers. Use this formula to calculate GiB-seconds of your Functions usage: GiB-seconds = Number of Function invocations * RAM Memory in GiB * Function run-time in seconds. Previously, only functions deployed via App Platform were being counted toward your monthly free allowance. Starting August 1, functions deployed via the developer console and CLI will also count towards your monthly free allowance of 90,000 GiB-seconds for your account/team. This means the same pricing will apply to functions regardless of how they are deployed. The monthly free allowance includes 90,000 GiB-seconds for the account/team. These are not prorated, do not roll over, and can be used on any apps under the same team. GiB-seconds is used to indicate the amount of memory allocated to a task per second. For functions, GiB-seconds are the number of seconds your function runs for, multiplied by the amount of RAM memory consumed. It's a measure of resources used by your function. After you exceed your free allowance, additional GiB-seconds are charged at $0.0000185. Usage is pooled at the account level. At the end of each billing period, we aggregate usage and charge for the amount of GiB-seconds in excess of the free allowance at the rate of $0.0000185 per GiB-seconds. In the invoice, you'll see two items depending on your usage: You can set up billing alerts in aggregate across all their DO resources, but not for Functions directly. As a workaround, you can set up an alert on the metric 'GiB-seconds' which roughly maps to your spend on Functions. Minimum runtime is the minimum duration we'll charge you for. Function runtime will be rounded up to the nearest 100 ms."
