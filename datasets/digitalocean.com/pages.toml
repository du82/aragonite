full_description = "This is some placeholder text to show examples of Markdown formatting. We have a full article template you can use when writing a DigitalOcean article. Please refer to our style and formatting guidelines for more detailed explanations: https://do.co/style We also support some extra syntax for setting the width, height and alignment of images. You can provide pixels (200/200px), or a percentage (50%), for the width/height. The alignment can be either left or right, with images being centered by default. These settings are all optional. This is inline code. This is a variable. This is an in-line code variable. You can also have code in links. And all of these can be combined together, with a language for syntax highlighting as well as a line prefix (line numbers, command, custom prefix, etc.), and even an environment and label: On desktop the columns will be evenly distributed in a single row, on tablets they will wrap naturally, and on mobile they will be in a single stack. Both the width and height are optional, with the defaults being 480 and 270 respectively. The width/height set are treated as maximums – the video will scale down to fit the available space, maintaining the aspect ratio. As with the YouTube embed, both the width and height are optional and have the same defaults. The same behaviour applies to the width/height set, with responsive scaling. As with the YouTube embed, both the width and height are optional and have the same defaults. The same behaviour applies to the width/height set, with responsive scaling. These flags can be combined in any order to create a custom CodePen embed. For example, [codepen MattCowley vwPzeX dark css 384] would create a dark mode embed that shows the CSS tab by default, with a height of 384px. Certain features of our Markdown engine are designed specifically for our tutorial content-types. These may not be enabled in all contexts in the DigitalOcean community, but are enabled by default in the do-mar