["https://digitalocean.com/customers/vuukle"]
title = "Customers - Vuukle"
description = "Vuukle is a publisher workplace solution that enables content creators to amplify audience engagement. After moving to DigitalOcean, Vuukle was able to scale up while keeping costs low and improving response times."
full_description = "Vuukle is a publisher workspace and collection of tools to help creators super-charge their content, maximize ad revenue, improve site speed and amplify audience engagement. Through their share and reaction tools, live analytics and AI-powered comment moderation, Vuukle has become one of the fastest growing technology companies dedicated to publisher engagement and monetization, and now serves more than 6 billion ad impressions across 300 million monthly unique visitors on more than 420 publishers globally. Vuukle experienced rapid expansion over the past 3 years and during this time, they tried multiple hosting providers, both large and small, to meet their growing needs. This led to an infrastructure that was scattered across platforms; while Vuukle used one cloud service for their application logic, they used a managed database solution from another cloud provider to take the burden of database administration off of their team. They quickly realized that having the application logic and backend services running on different clouds impacted latency. Vuukle decided to address those issues and circumvent risks associated with outages and switched to DigitalOcean. “Fortunately, with DigitalOcean we’ve never encountered outages and downtime. The reliability of the platform has been outstanding.” Vuukle sought to bring their cloud services together under one consolidated environment. Vuukle also wanted to ensure their costs would stay low as their business scaled to serve billions of API requests per month, so looked for a cloud provider that could help them scale globally, keep costs in check, and deliver a superior experience to their customers. After evaluating their options, Vuukle chose DigitalOcean for the platform’s simplicity in spinning up servers, reliability, and predictable costs. Another key motivation for choosing DigitalOcean was the bandwidth allowance. Vuukle’s application is bandwidth intensive, which often means that bandwidth costs start low but as traffic increases, bandwidth costs go up exponentially and can quickly increase the overall costs. When they evaluated other providers, Vuukle found that anticipated bandwidth costs were way over their budget. Moving to DigitalOcean helped them keep their bandwidth costs low and overall operating costs well within their budget."
