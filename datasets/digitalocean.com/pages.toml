["https://digitalocean.com/community/tutorials/deepscaler"]
title = "Running DeepScaleR-1.5B with vLLM on DigitalOcean | DigitalOcean"
description = "'The purpose of this tutorial is two-fold: to give readers an overview of DeepScaleR-1.5B-Preview, an open-source reasoning model, as well as demonstrate how…"
full_description = "DeepSeek-R1, an open-source-model, achieved comparable performance to OpenA1’s o1 model on reasoning tasks. If this wasn’t already impressive, newer open-source models like DeepScaleR-1.5B-Preview by Agentica, part of the Berkeley AI Research and Sky Computing lab, surpass o1 performance in benchmarks like AIME2024. This level of performance on AIME2024 is especially significant because mathematical reasoning has traditionally been a weakness for language models. Trained on 40,000 math problems over 3,800 A100 GPU hours, DeepScaleR uses a novel iterative context lengthening scheme. The training process involves curating a high-quality dataset, using an Outcome Reward Model (ORM) instead of a Process Reward Model (PRM), and progressively increasing the context window from 8K to 24K tokens. This approach allows the model to learn effective reasoning patterns at shorter contexts before scaling to longer ones, significantly improving efficiency. The authors have open-sourced their dataset, code, and training logs to further research in scaling intelligence with RL. There are two sections of this article. (1) An overview of the model and (2) its implementation. The overview requires some familiarity with LLM training and evaluation. Knowledge of reinforcement learning algorithms like Proximal Policy Optimization (PPO) machine learning concepts like loss functions would be helpful. The implementation, where we run the model on DigitalOcean’s GPU droplets, is very straightforward and requires minimal coding experience. Feel free to skip the overview section if you’re simply interested in running this model. Here’s a quote outlining DeepScaleR’s performance from Agentica’s blog post, “DeepScaleR: Surpassing O1-Preview with a 1.5B Model by Scaling RL”: “Our results confirm this: RL scaling improved AIME accuracy from 28.9% to 43.1%! These findings suggest that neither SFT nor RL alone is sufficient. Instead, by combining high-quality SFT distillation with RL scaling, we can truly unlock the reasoning potential of LLMs.”"
