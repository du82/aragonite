["https://digitalocean.com/community/tutorials/how-to-write-a-proposal-and-outline-for-a-digitalocean-community-tutorial"]
title = "How To Write a Proposal and Outline for a DigitalOcean Community Tutorial | DigitalOcean"
description = "In this article, you’ll see how to craft a proposal and outline for your tutorial idea. You’ll do some preparation first that will help you shape the content…"
full_description = "So you want to write a tutorial for DigitalOcean! The DigitalOcean Editorial Team is here to support writers like you: developers and engineers who want to share their knowledge with others in the Community. Because DigitalOcean can’t accept every tutorial that’s submitted to us, we ask to see a proposal before we approve you to begin writing. We don’t want you to write the whole tutorial before you know whether you’re accepted, so we ask for a detailed outline. That way, we get a good idea of what you want to write about, and we can offer you some feedback before you start writing. That’s the best time to make structure changes to your article, because it’s much easier to revise an outline than it is to revise a draft. With a good outline in place, you have a framework that makes the writing process go more smoothly. In this article, you’ll see how to craft a proposal and outline for your tutorial idea. You’ll do some preparation first that will help you shape the content, you’ll decide on the goal that you want readers to achieve, and then you’ll define the steps that will get them there. The writing process is iterative, so you may find yourself returning to previous steps, but this framework will help create the outline. The first thing to decide on is what you want to write about. Often, you’ll start this idea with a single noun, for example: Nginx, or Helm, or React. Next, find the verb that goes with the noun: what do you want users to do with the product? Or to put it another way, what’s the learning outcome for the reader? At this stage, you’ll shift the focus from the writer to the reader. Instead of “what do I want to write about?” the question becomes “what does the reader want to accomplish?” Finding the right verb will answer that question. Verbs like “learn” or “understand” aren’t good topics for a tutorial, because they don’t have a measurable outcome. Instead, consider verbs like these: Almost all DigitalOcean tutorials start with the words “How To,” which gives you a lead-in to choosing a good verb. The following are good tutorial titles that use the nouns with appropriate verbs:"
