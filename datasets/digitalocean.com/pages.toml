full_description = "Attach secure, scalable, highly available NVMe-based Volumes Block Storage to Droplets and get the latest standard in storage technology that is faster than SSDs and traditional HDD storage. Volumes Block Storage is designed for demanding business-critical applications requiring high throughput and IOPS. NVMe is the fastest available storage medium that also provides low latency for reading and writing data. Always encrypted at rest and when replicated, your data is protected and maintains high durability and availability even if hardware fails. All your Volumes data is transmitted to Droplets over isolated networks, is stored independently of Droplet storage and can be instantly moved across Droplets Easily write and access persistent data in Kubernetes clusters with Volumes Block Storage by creating a PersistentVolumeClaim (PVC) as part of your deployment. Get 99.99% uptime SLA per month with affordable pricing and scalability in mind, so you can always and easily scale block storage up or down and move storage between Droplets. Increase Droplet storage capacity independently without paying for a larger, more expensive Droplet and keep your data safely on Volumes even if you destroy your Droplet. Use Volumes to store the input data you need to train artificial intelligence/machine learning models and to store the output of trained models. Volumes Block Storage is persistent and secure, perfect for distributed web applications like blockchain and NFTs that need high performance storage for many distributed web applications such as “Proof of Stake” nodes. Save data such as website files, log files, and backups and access them at high speeds to prevent application failures caused by slow storage. Confidently host databases that need to quickly serve the demands of high-traffic applications and services. Volumes Snapshots create on-demand disk backups of your Volumes, so you can further protect data and quickly create new volumes with those backups to share across multiple Droplets."
