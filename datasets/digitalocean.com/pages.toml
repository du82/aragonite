["https://digitalocean.com/customers/hedera"]
title = "Customers - HEDERA"
description = "HEDERA helps microfinance institutions (MFIs) and other organizations working with rural communities to collect and manage high-quality customer data through their innovative digital solutions. DigitalOcean's reliable offerings, along with support from Hollie's Hub for Good, enables HEDERA's mission and vision."
full_description = "HEDERA helps microfinance institutions (MFIs) and other organizations working with rural communities to collect and manage high-quality customer data through their innovative digital solutions. HEDERA provides its customers with mobile and web versions of standard questionnaires for client-centric needs assessment based on the latest frameworks. The Berlin-based startup gives customers access to cutting-edge, automated cleaning, analysis, and reporting tools. Using standard indicators, these tools enable organizations to understand their customers better and efficiently track their contribution to the Sustainable Development Goals (SDGs). HEDERA is partnered with Hollie’s Hub for Good and utilizes DigitalOcean for its infrastructure needs. The team at HEDERA believes that MFIs across the globe are a powerful vehicle for sustainable development and can make a significant social and environmental impact on individuals and communities, especially in rural regions. Co-founders Natalia Realpe Carrillo and Alfonso Caiazzo recognized the need for more robust tools for the microfinance’s private sector. In 2017, HEDERA gained admission to the Centre for Entrepreneurship (CfE), the start-up incubator at the Technical University Berlin. In 2018, the organization was awarded the EXIST Business Grant from the German Ministry of Energy and Economics. The EXIST grant allowed HEDERA to finalize the prototype of the HEDERA Impact Toolkit for energy access assessments, bring it to market, and further develop it through several pilot projects in Africa and Latin America. Since 2020, HEDERA has been supported by the Gründung Innovativ program of the Investititionsbank des Landes Brandenburg (ILB) and by the German Federal Environmental Foundation (Deutsche Bundesstiftung Umwelt - DBU) through the Green StartUp program. This funding program aims at supporting companies with a strong focus on the connection between sustainability and digitalization. In 2021, HEDERA was awarded by Alliance for Rural Electrification at the African Microfinance Week as the most innovative organization for energy access impact management. In 2022, HEDERA was awarded the 2022 IMPACT Award for Education and Social Innovation at the German IMPACT FESTIVAL."
