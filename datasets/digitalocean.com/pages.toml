full_description = "Open source software is freely available to use, lovingly made by people all over the world, and at the heart of DigitalOcean's business. Hacktoberfest is one of the most popular, well-attended annual global celebrations of open source. Every October, people from a variety of expertise backgrounds, and experience levels from all over the world come together and use their skills to help maintain open source projects. The Hacktoberfest Advisory Council ensures Hacktoberfest remains educational, fair, inclusive, and community-centric by bringing in people from outside DigitalOcean to provide earnest feedback and thoughtful guidance. Hacktoberfest 2021 was Estee Tey's second Hacktoberfest and she had set big goals for herself to go from non-technical contributions like documentation edits to more technically demanding ones. “It was really interesting to explore different codebases and also communicate with the project maintainers to agree on a solution to achieve together. There were some hurdles in setting up some of the projects, but that's part and parcel for most newcomers onboarding dev projects.” We are working hard to bring you another great year of Hacktoberfest and can't wait to share the news. Join our email list or tune in to our Hacktoberfest discord server or Hacktoberfest Twitter to keep up to date with the latest announcements. There's much more open source love to come — so stay tuned and we look forward to seeing you at Hacktoberfest! Open source projects power many of our libraries and frameworks. We believe in and advocate for the values that the open source community embodies: innovation, collaboration, and optimism. At DigitalOcean, we help open source projects thrive by participating in events and hosting our own, notably Hacktoberfest. We encourage everyone to contribute to the wider open source community. We're proud to support open source. DigitalOcean offers credit grants to open source projects, assisting with development, 