full_description = "Protect your cloud infrastructure from cyberattacks, define what services are visible on your Droplets, and easily block traffic with Cloud Firewalls, available at no additional cost. Create rules to permit certain types of traffic to your Droplet and block everything else with simple and effective Firewalls. Cloud Firewalls are designed to grow with you. Once you define your filtering rules, you can easily apply them to new and existing Droplets. See all Cloud Firewall rules in one centralized view. Add, edit, and remove rules in a single place and update your whole infrastructure. DigitalOcean Cloud Firewalls are built to be secure by default to protect you from malicious traffic. Get granular control by controlling which ports are open and which devices can access them. Whitelist by IP address range, tags, Droplets, or Load Balancers. Everything else is blocked by your Cloud Firewall. Cloud Firewalls are simple to set up and maintain. Set up a Cloud Firewall in the dashboard, CLI, or API, and enable protection without installing or maintaining any software. Find out more about Cloud Firewalls and protecting against cyber attacks with the help of these step-by-step tutorials. DigitalOcean Cloud Firewalls are a product from DigitalOcean that act as a barrier between incoming traffic and DigitalOcean Droplets. In general, cloud-based firewalls are a security feature deployed on cloud infrastructure that act as a barrier between web applications and data and external traffic. Firewalls are designed to protect your application from suspicious traffic and cyber attacks by acting as a virtual barrier and enabling users to set up filtering rules, such as defining which IP addresses are allowed to access your application. A cloud firewall gives security teams granular control over what traffic accesses their application, and allows them to monitor network traffic. Firewalls are an important part of an organization’s overall security policies, and can prevent attacks such as distributed denial of service (DDoS) attacks and other cyber attacks."
