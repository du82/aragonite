["https://digitalocean.com/community/tutorials/python-check-if-string-contains-another-string"]
title = "Python Check If String Contains Another String with Examples | DigitalOcean"
description = "Learn how to check if one string contains another in Python using in, find(), and regular expressions. Explore common pitfalls, and efficient practices."
full_description = "Checking if a string contains another substring is a common task when working with Python. String manipulation is a common task in any programming language. Python provides two common ways to check if a string contains another string. Python string supports in operator. So we can use it to check if a string is part of another string or not. The in operator syntax is: It returns True if “sub” string is part of “str”, otherwise it returns False. Let’s look at some examples of using in operator in Python. If you are not familiar with f-prefixed strings in Python, it’s a new way for string formatting introduced in Python 3.6. You can read more about it at f-strings in Python. When we use in operator, internally it calls __contains__() function. We can use this function directly too, however it’s recommended to use in operator for readability purposes. We can also use string find() function to check if string contains a substring or not. This function returns the first index position where substring is found, else returns -1. Regular expressions offer a powerful way to perform advanced pattern matching in strings. They allow for complex searches and extractions of data, making them a valuable tool in many applications. In the following example, we use the re.search() function to search for the string “python” within the text “Learning Python is fun!”. The re.IGNORECASE flag is used to make the search case-insensitive, ensuring that the function matches “python”, “Python”, “PYTHON”, or any other variation of the string. Regular expression flags are used to modify the behavior of the search function. Here are some common flags and their effects: Here’s an example of how to use multiple flags together to compile a regular expression pattern. In this case, we’re using re.IGNORECASE and re.MULTILINE to create a pattern that matches the string “hello” at the start of each line, regardless of case. Using re.IGNORECASE allows case-insensitive searches, making it useful for handling user input or inconsistent casing. This is particularly important when working with user-generated content, where the case of the input may vary."
year_published = 2025
