full_description = "Node.js is a JavaScript runtime for server-side programming. It allows developers to create scalable backend functionality using JavaScript, a language many are already familiar with from browser-based web development. In this guide, we will show you three different ways of getting Node.js installed on an Ubuntu server: For many users, using apt with the default repo will be sufficient. If you need specific newer (or legacy) versions of Node, you should use the PPA repository. If you are actively developing Node applications and need to switch between node versions frequently, choose the nvm method. Simplify deploying Node applications with DigitalOcean App Platform. Deploy directly from GitHub in minutes. This guide assumes that you are using the latest Ubuntu version (at the time of writing, the latest Ubuntu lts version was 24.04). Before you begin, you should have a non-root user account with sudo privileges set up on your system. You can learn how to do this by following the right guide from this collection on Ubuntu initial server setup. Before proceeding, we recommend you take a look at this nodesource distribution chart to check which Node version is compatible with your Ubuntu installation. These steps are valid for the most recent versions of Ubuntu: Ubuntu 24.04, Ubuntu 22.04, and Ubuntu 20.04. If you are using Ubuntu version <= 18.04, we recommend you upgrade to a more latest version since Ubuntu no longer provides support for the older versions. This collection of guides will help you in upgrading your Ubuntu version. Ubuntu contains a version of Node.js in its default repositories that can be used to provide a consistent experience across multiple systems. At the time of writing, the version in the repositories is 12.22.9. This will not be the latest version, but it should be stable and sufficient for quick experimentation with the language. To get this version, you can use the apt package manager. Refresh your local package index first by typing: Press Y when prompted to confirm installation. If you are prompted to restart any services, press ENTER to accept the defaults and continue. Check that the install was successful by querying node for its version number:"
