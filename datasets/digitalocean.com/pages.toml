title = "DigitalOcean Functions | Serverless Computing Starting at $0/mo"
description = "Run functions on demand and scale effortlessly with Functions, DigitalOcean's serverless computing solution."
full_description = "DigitalOcean Functions is a serverless computing solution that runs on-demand, enabling you to focus on your code, scale instantly with confidence, and save costs by eliminating the need to maintain servers. Develop and launch modern apps quickly without provisioning or managing servers. Build or extend your apps easily without learning new frameworks or languages. Invoke functions (snippets of code) in response to web events. You'll only be charged when your resources are active, saving you money. Scale up or down instantly and automatically based on demand without the need for pre-provisioned resources. Easily add functions as components of your app or website and deploy to production using App Platform. Build apps that require long-running servers and on-demand functions, with an integrated experience andworkflow. Easily extend existing applications with new serverless functionalities. If you're building an app that needs a database, you can easily add a managed database in the app creation process. Connections between the apps and databases are secure with features such as trusted sources. Develop functions locally using your favorite editors and IDEs, ship quickly to the cloud, and live-preview your functions before committing your code to GitHub or GitLab and deploying your app in production. Out-of-the-box support for many popular runtimes, including Node.js, Python, Go and PHP. Automatic patches and updates to ensure the execution environment is stable and secure. DigitalOcean Functions is a serverless computing solution that runs on-demand, enabling you to focus on your code, scale instantly with confidence, and save costs by eliminating the need to maintain servers. Learn how you can use App Platform to add functions as components of your apps. See how you can use the functions developer console and CLI to quickly build, test and deploy functions."
