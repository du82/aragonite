["https://digitalocean.com/customers/tabya"]
title = "Customers - Tabya"
description = "Tabya, a SaaS company in the construction industry in Europe, uses DigitalOcean to enhance their platform's reliability and scalability."
full_description = "Tabya, a SaaS company focused on digitalizing the construction industry in Europe, uses DigitalOcean to enhance their platform’s reliability and scalability. The company uses DigitalOcean’s Managed Databases and App Platform to simplify operations, improve efficiency, and eliminate the need for intensive infrastructure management. Tabya was founded in 2018 with a mission to transform how European construction companies manage their warehouses and equipment. Their platform helps construction companies track vehicles, materials, and equipment with ease. However, as a startup with just 10 employees, managing their own infrastructure was becoming a challenge. Initially, Tabya hosted their services on a European provider but encountered growing pains as they scaled, with CTO Aaron Bach mentioning “The prices were pretty good, but the effort to keep everything running in a reliable state was high, and we didn’t have much peace of mind.” While Tabya explored other cloud providers, including AWS and Google Cloud, DigitalOcean stood out for its affordability and ease of use. AWS, despite its startup credits, came with long-term cost concerns, while DigitalOcean offered a competitive pricing model with all the features Tabya needed. Another key driver for moving was DigitalOcean App Platform, a Platform as a Service offering that allowed them to eliminate their self-hosted Kubernetes solution and offload much of the infrastructure management burden. As CTO Aaron Bach explained, “App Platform was a main part of our decision to move to DigitalOcean, because we don’t want to get too deep into ops. We needed a platform where every developer could quickly manage things, and we didn’t have to worry about the operational side.” In addition to wanting to efficiently manage their infrastructure through a PaaS solution, Tabya liked that DigitalOcean offers a full suite of cloud products, including Managed Databases. Aaron highlighted “We needed PostgreSQL and were also looking at Redis. DigitalOcean had everything we were looking for, and we already knew from others in our network that DigitalOcean was reliable.”"
