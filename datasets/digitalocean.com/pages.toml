["https://digitalocean.com/products/backups"]
title = "DigitalOcean Backups"
description = "Protect your business data with frequent and fast backup"
full_description = "Protect your data with daily, automated backups of your Droplets. Designed for simplicity, DigitalOcean Backups can be configured for the times that work best for you and your business. Automatically protect your data with daily snapshots and faster backups. With the ability to retain seven recent copies and customizable backup windows, you can ensure seamless disaster recovery, enhanced compliance, and uninterrupted business continuity. Our new backup storage infrastructure uses incremental backup technology to quickly backup only what you change. Pick any four-hour window for your backups to be taken—you can always recover your Droplet along with any files, applications, or databases running on top of it. DigitalOcean Backups are automatically-created disk images of our virtual machines called Droplets. Turning backups on for Droplets enables automatic, system-level backups at daily* or weekly intervals, which provide a way to revert to an older state or create new Droplets from a backup. Backups and snapshots are both disk images of Droplets. Backups are taken automatically daily or weekly and can be retained for seven days or four weeks respectively. Snapshots are taken manually and retained until you choose to delete them. If you want to keep a backup indefinitely, you can convert it to a snapshot. Have a complex setup or additional questions around pricing? Contact our sales team to get more information on DigitalOcean pricing."
