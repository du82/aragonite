full_description = "PiCap is a leading ride-sharing and logistics company in Latin America, utilizing motorcycles to provide safe rides and efficient package transportation throughout crowded cities like Mexico and Brazil. By leveraging the agility of motorcycles, PiCap efficiently navigates through dense urban traffic, offering a unique and cost-effective solution to urban mobility challenges. After migrating from AWS and Heroku to DigitalOcean, they now leverage multiple DigitalOcean products, notably Managed Databases and App Platform, which saves them money and increases the scalability of their application. PiCap’s partnership with DigitalOcean is rooted in several key benefits, including cost efficiency, ease of management, robust community support, and exceptional customer service. “We love how easy it is to manage and how cheap it is to maintain. We also like how easy it is to scale and how great the support and communication has been with DigitalOcean,” said Andres Murcia, CTO of PiCap. PiCap utilizes DigitalOcean’s App Platform and Managed Databases, including SQL/Postgres and MongoDB, to power their operations. The simplicity and scalability of these products have been crucial for PiCap as they launch new products and scale existing ones. “We were previously on AWS but started migrating everything because we really love DigitalOcean in terms of cost and support. We saved a lot of money—we went from $120,000 to $30,000 [per month],” noted Andres. To address latency issues previously experienced with AWS, PiCap integrated Redis for caching, resulting in a 20-30% performance improvement. Additionally, they have adopted DigitalOcean’s Managed OpenSearch feature to enhance address lookup functionalities in their application. In addition to moving their databases from AWS, PiCap also moved from Heroku to DigitalOcean App Platform. With App Platform, PiCap has transitioned from 20 clusters with 100 applications on Heroku to 70 applications on DigitalOcean, managed by a single DevOps engineer. This shift has streamlined their operations and reduced overhead costs significantly."
