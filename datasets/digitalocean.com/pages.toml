["https://digitalocean.com/legal/law-enforcement-guidelines"]
title = "Legal - Law Enforcement Guidelines"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "These guidelines are intended for those seeking information about a DigitalOcean account, or looking to take action against a resource hosted on our network. Safeguarding our users’ data is vital to the trust our users place in our service to keep their data secure. For the most part, DigitalOcean’s ability to disclose user information is governed by the Electronic Communications Privacy Act, 18 U.S.C. §2701, et seq. (“ECPA”). ECPA mandates that DigitalOcean disclose certain user information to law enforcement only in response to specific types of legal process, including subpoenas, court orders, and search warrants. To request information for a site hosted on DigitalOcean, the site’s IP address and a date range must be specifically included in the request. We can’t process overly broad or vague requests. If your inquiry alerts us to a violation of our policies or Terms of Service, we will handle it via our usual abuse procedures which may include contacting the user regarding their misconduct or suspending the site entirely. The length of time data is retained varies based on the type of information and actions of the user. Generally, Droplet contents are purged immediately upon deletion by the customer. Additionally, customers can control the format of their content (e.g. plain text, masked, or encrypted) and can delete or destroy server content whenever they choose. DigitalOcean accounts can contain various information, which is unverified and is provided at the user’s discretion. Before revealing information to anyone who is not the account owner, we require a valid subpoena, warrant, or court order that specifically requests it, unless we have a good faith belief that there is an emergency involving death or serious physical injury. See below for more details. As US law permits, we may disclose user information to law enforcement without a subpoena or warrant when we believe that doing so without delay is necessary to prevent death or serious physical harm to an identifiable victim. We require emergency requests to be made in writing via email and include all the information available so that we may evaluate the urgency of the request. Please see the example imminent harm request below for emergency process details."
year_published = 2025
