title = "Customers - 3CX"
description = "3CX is a complete communications platform for businesses looking for a simple and affordable solution for calls, video, and live chat. They value DigitalOcean's simplicity and pricing as they meet growing customer demand."
full_description = "3CX is a complete communications platform for businesses looking for a simple and affordable solution for calls, video, and live chat. The organization is one of the fastest-growing communications solutions in the market, available on-premise on Windows /Linux as well as a cloud-hosted solution. 3CX includes free mobile apps, video conferencing, live chat, and WhatsApp, Facebook and CRM integration - making it an all-encompassing communications system. 3CX was born out of a simple need for a new phone system that was reliable, feature-rich, and affordable at a time when VoIP was still an emerging technology. In 2005, the majority of phone systems were hardware-based, proprietary, and extremely expensive. Nick Galea, 3CX founder, was struggling to find a phone system for his business that was software-based, could connect remote offices, and could be managed by the internal IT team. When nothing could be found, he created one. Now, more than 600,000 customers in 190 countries trust 3CX to help their businesses connect and collaborate. 3CX launched 3CX StartUP in May 2022, a cloud-native solution made to specifically address the communication requirements of startups and smaller businesses. Its reliable set-and-forget system is equipped with sophisticated call center features such as call queues and IVRs, ready to serve teams of up to 10 users completely FREE! For teams up to 20, StartUP PRO edition unlocks even more choice with call reporting, choice of SIP trunks, and training tools added to the bundle. Best part? Both require zero internal tech support. By bundling smaller installs on a shared instance, 3CX can manage setup, installation, and system updates while minimizing communication costs for the end users. To adequately support its business aspirations, 3CX needed to have reliable resources supporting its operation and found that DigitalOcean’s products were a match. The simplicity and pricing model stood out amongst competition, and afforded the company better flexibility to sustainably meet growing customer demand."
