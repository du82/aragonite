title = "Worry-Free Managed PostgreSQL Hosting | DigitalOcean"
description = "Leave the complexity of PostgreSQL administration to us. We’ll handle setting up, backing up, and updating — so you can focus on building great apps."
full_description = "Leave the complexity of PostgreSQL administration to us. We’ll handle setting up, backing up, and updating, so you can focus on building great apps. PostgreSQL is an open source, object-relational database built with a focus on extensibility, data integrity, and speed. Its concurrency support makes it fully ACID compliant, and it supports dynamic loading and catalog-driven operations to let users customize its data types, functions, and more. DigitalOcean's Managed PostgreSQL now supports PostgreSQL v17, which offers boosted query and vacuum performance, enhances logical replication with features like failover control, and introduces developer tools such as constructors. Launch a database cluster with just a few clicks and then access it via our simplified UI or API. Easily migrate your database from another location with minimal downtime. Scale up at any time to support your business growth. Dynamically increase CPUs, RAM, and storage on existing PostgreSQL clusters and easily spin up read-only nodes to scale read operations. Your data is critical. That's why we ensure it's backed up automatically every day. Restore data to any point within the previous seven days. In the event of a failure, Managed Databases will automatically switch data handling to a standby node to minimize downtime. Managed Databases run on enterprise-class hardware for fast performance. Now supporting PostgreSQL v17, you can access the latest features. Run your clusters on shared vCPU Droplets or opt for 100% dedicated vCPUs for mission-critical workloads. Databases run in your account's private network, and only whitelisted requests via the public internet can reach your database. Data is also encrypted in transit and at rest. Understand database performance, resource usage, and errors so that you can efficiently size, scale, and tune your PostgreSQL database. Managed databases include critical database-level metrics, such as connections, cache hit ratio, sequential vs indexed scans, throughput, and more."
