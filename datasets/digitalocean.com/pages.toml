["https://digitalocean.com/blog/2022-demonstrated-strength-of-small-businesses"]
title = "2022 demonstrated the strength of small businesses | DigitalOcean"
description = "As 2022 comes to a close, we’re more committed than ever before to being the ideal cloud for SMBs, from SaaS applications and streaming businesses to agencies and eCommerce stores."
full_description = "2022 was a year marked by instability around the globe, but through it all I continue to be inspired by the resiliency of small and medium businesses and how they innovate even during trying times. At DigitalOcean, we’re more committed than ever before to being the ideal cloud for SMBs, from SaaS applications and streaming businesses to agencies and eCommerce stores. This year, we made some important steps towards that goal, including the acquisition of Cloudways, a leading managed hosting provider that will enhance DigitalOcean’s ability to serve small business owners at every stage of their business journey. We increased our global presence with the launch of our Sydney data center in November, and deepened our social impact work with the formal launch of DO Impact in April 2022. We launched new products and features targeted at the needs of small businesses, including DigitalOcean Functions, a high availability control plane for DigitalOcean Kubernetes, and DigitalOcean Support Plans. We also introduced the Partner Pod, our new partner program which gives small businesses even more ways to work with us. DigitalOcean’s community continued to show up for each other in 2022. Employees donated both time and money to causes important to them, and our employee resource groups hosted events throughout the year to connect with each other and the community. We made many important updates to products in 2022 to better serve the needs of growing businesses and our global customer base. These included the launch of DigitalOcean Functions, providing new ways for customers to get their applications into the cloud. We also made key updates to DigitalOcean Kubernetes, including launching a high availability control plane and adding an egress gateway for DigitalOcean Kubernetes, giving our customers even more confidence in leveraging our Kubernetes offering to deploy their code in the cloud. Small businesses often need dedicated support, so we added two new support levels to DigitalOcean’s Support Plans, which enable users to get faster response times and dedicated support from technical managers. We’ve also introduced enhancements to Spaces Object Storage and Volumes Block Storage that better address the increasing needs of our customers’ applications."
