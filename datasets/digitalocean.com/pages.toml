full_description = "As Chief Executive Officer, Paddy Srinivasan drives the strategic direction for DigitalOcean. With over 25 years of experience in technology leadership and a proven track record of delivering customer-centric solutions, Srinivasan brings invaluable expertise to further DigitalOcean's mission of simplifying cloud computing. Prior to joining DigitalOcean, Paddy served as CEO at GoTo, a leading SaaS company with over $1 billion in revenue, where he demonstrated exceptional leadership in cloud communication and IT management software. Throughout his career, he has consistently demonstrated a deep understanding of developer needs and a passion for building products that drive meaningful impact. Paddy's background includes leadership roles at prominent technology companies such as Microsoft, Amazon, and Oracle where he played pivotal roles in product and technology development. He co-founded and led Opstera, a cloud monitoring and managed service provider which was acquired by Avanade (a Microsoft-Accenture company). Paddy holds a wealth of experience in product and technology leadership, having held various executive positions including Chief Product and Technology Officer, Senior Vice President of Products and General Manager, and Vice President of Products and Engineering. Paddy received a B.S. in Electrical and Electronic Engineering from the Birla Institute of Technology and Science and an M.B.A. from Southern Methodist University."
