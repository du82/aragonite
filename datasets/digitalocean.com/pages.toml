["https://digitalocean.com/blog/do-impact-reflecting-on-progress-and-the-path-ahead"]
title = "DO Impact: Reflecting on progress and the path ahead | DigitalOcean | DigitalOcean"
description = "We're excited to share what the DO Impact team has been up to look ahead to the rest of this year."
full_description = "It’s been a whirlwind three months since we announced the launch of DO Impact—our global social impact program to empower changemakers through our three pillars of product, philanthropy, and planet—and we’ve been busy! Though the road to meaningful, sustained impact is a long one, we’re eager to share some early wins as we continue to lay the groundwork for DO Impact. One of our goals is to bring this community along for the journey, so we’re excited to share the first of many progress updates and a look ahead to the rest of this year (and beyond). Shortly after the initial announcement, we celebrated the start of DO Impact and our first anniversary as a publicly-traded company with an event at the New York Stock Exchange. For the first time in a while, we had an opportunity to gather in person, so many of our colleagues were able to reunite, and others met for the very first time. In the same month, DigitalOcean was honored at the 2022 DevRel Awards—Hollie’s Hub for Good (HH4G) took home Best DevRel Initiative and Greatest Contribution to Society. The awards recognized HH4G for creating meaningful impact beyond the developer community and standing out amongst peers in the category. Since then, our DO Impact team has grown: Christy Schmidt joined the team to help us create and scale our social impact programming, and Jen Petraglia is on board, helping us leverage our technology to support and expand the technical capacity of more nonprofits. Partnering with teams across DigitalOcean—from marketing, sales, and people, to operations, engineering, and product—we’re working together to develop ambitious goals for DO Impact. We have more than 2,000 organizations enrolled in Hollie’s Hub for Good, and that number continues to grow rapidly. We love hearing from our Hollie’s Hub organizations that are advancing equity and building a better world, all with the help of DigitalOcean’s range of cloud computing products. Some of the newest Hollie’s Hub for Good projects include:"
