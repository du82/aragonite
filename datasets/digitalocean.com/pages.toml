["https://digitalocean.com/community/tutorials/deepseek-r1-gpu-droplets"]
title = "How to Run DeepSeek R1 Large Language Models on DigitalOcean GPU Droplets | DigitalOcean"
description = "In the first of this two part article series, we will show how to run DeepSeek R1 models on DigitalOcean’s GPU Droplets using Ollama."
full_description = "Here at DigitalOcean, we have been carefully watching the closing of the gap between open-source Large Language Models (LLMs) and their commercial, closed-source counterparts. One of the most important capabilities of these models is reasoning - the action of thinking about something in a logical, sensible way. For a long time, LLMs were very linear. When given a prompt, they provided an answer. There is no meta-logic involved, or any stage where the model might be able to self-correct if it is mistaken. This effectively hinders their ability to reason, question, or adjust to problems that may be inherent to the instruction they are responding to. For example, with low-reasoning models, complex language based mathematics problems may be too complicated to solve without explicit instructions and work on the users part. Enter the latest generation of reasoning LLMs. Ushered in by OpenAI’s O1 model series, reasoning models have taken the community by storm as they have effectively closed the gap between human and machine learning capabilities on a variety of logic tasks. These include coding, mathematics, and even scientific reasoning. Like with all previous steps forward in development, the open source community has been working hard to match the closed-source models capabilities. Recently, the first open-source models to achieve this level of abstract reasoning, the Deepseek R1 series of LLMs, was released to the public. In the first of this 2 part article series, we will show how to run these models on DigitalOcean’s GPU Droplets using Ollama. Readers can expect to learn how to set up the GPU Droplet, install Ollama, and begin reasoning with Deepseek R1. The first thing we need to do is set up our machine. To begin, create a new GPU Droplet following the procedure shown in the official DigitalOcean documentation. We recommend selecting the “AI/ML Ready” OS and using a single NVIDIA H100 GPU for this project, unless you intend to use the largest, 671B parameter model."
