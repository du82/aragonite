["https://digitalocean.com/blog/join-us-for-hacktoberfest-2024"]
title = "Join us this Hacktoberfest | DigitalOcean"
description = "This month marks the 11th year of Hacktoberfest, a month-long virtual event that encourages developers to contribute to the open source projects that so many of us rely on. What started as a small hackathon founded by DigitalOcean in 2014 has now morphed into a month when the global developer community comes together virtually."
full_description = "This month marks the 11th year of Hacktoberfest, a month-long virtual event that encourages developers to contribute to the open source projects that so many of us rely on. What started as a small hackathon founded by DigitalOcean in 2014 has now morphed into a month when the global developer community comes together virtually. During Hacktoberfest, tens of thousands of developers donate their time and expertise to help maintain open source technologies. It’s an important month not just for encouraging participation in open source projects, but also for developers to learn new skills, teach others, and connect with the wider community. This year’s Hacktoberfest is significant to me as it marks my first as CEO of DigitalOcean, so I thought I’d bring you along as I dive into the history of the event, and why open source is critical to the developer community. At its core, Hacktoberfest is a celebration of open source, the projects that power much of today’s most popular websites and applications. It’s not an exaggeration to say that the internet as we know it would look very different without open source projects, and these projects are often maintained and updated by developers on their own time, with little to no budget. Open source is the backbone of tech today, and developers who maintain and contribute to these projects are the backbone of open source. Hacktoberfest aims to rally even more developers, including those new and returning to open source, to give back to these projects during a dedicated month. By participating in Hacktoberfest, developers can make tangible improvements to the tools millions of people use daily, while learning new skills and meeting fellow members of the developer community along the way. Hacktoberfest started out in 2014 as a small hackathon organized by DigitalOcean—the first year had 676 participants who each completed 50 commits to various open source projects. At the time of the inaugural Hacktoberfest, DigitalOcean was a relatively new cloud provider focused on providing developers with simple and performant virtual machines so they could build without the complexity or costs of hyperscalers. Hacktoberfest was, and is still today, aligned strongly with DigitalOcean’s mission of enabling developers to spend more time creating software that changes the world."
