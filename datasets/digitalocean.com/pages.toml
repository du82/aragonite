["https://digitalocean.com/legal/pipeda-faq"]
title = "Legal - PIPEDA FAQ"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "DigitalOcean is a cloud computing platform that provides a cloud platform to deploy, manage, and scale applications of any size. Its infrastructure and platform-as-a-service solutions provide a no DevOps required experience, allowing developers to focus their energy on creating innovative software. By combining the power of simplicity, love for the developer community, an obsession for customer service, and the advantages of open source, DigitalOcean brings software development within the technical and economic reach of anyone around the world. DigitalOcean delivers its services via the Internet. Customers log into DigitalOcean’s services through a website using unique usernames and passwords. DigitalOcean’s services allow for various additional authentication methods that may be activated by customers, as appropriate to their needs, such as two-factor authentication. We also serve our customers through what is known in the industry as cloud-based services architecture, which is designed for security, efficiency, availability, scalability, and rapid innovation. DigitalOcean’s services are hosted in various locations depending on customer instructions and each specific service provided. Please refer to DigitalOcean’s Trust Platform available at https://www.digitalocean.com/trust/ for more information on our data center locations and our use of public cloud infrastructure. If you have questions, please contact privacy@digitalocean.com Yes. DigitalOcean complies with Canada’s Personal Information Protection and Electronic Documents Act (“PIPEDA”) as it applies to DigitalOcean in provisioning and operating our services. Yes. The Office of the Privacy Commissioner of Canada’s Processing Personal Data Across Borders Guidelines (the “Guidelines”), available at https://www.priv.gc.ca/en/privacy-topics/airports-and-borders/gl_dab_090127/, state that “PIPEDA does not prohibit organizations in Canada from transferring personal information to an organization in another jurisdiction for processing. However under PIPEDA, organizations are held accountable for the protection of personal information transfers under each individual outsourcing arrangement.” The Guidelines further clarify that organizations responsible for personal information must use contractual or other means to ensure a comparable level of protection for personal information after it is transferred."
