["https://digitalocean.com/community/conceptual-articles/s-o-l-i-d-the-first-five-principles-of-object-oriented-design"]
title = "SOLID: The First 5 Principles of Object Oriented Design | DigitalOcean"
description = "SOLID is an acronym for the first five object-oriented design (OOD) principles by Robert C. Martin. In this article, you will be introduced to each principle…"
full_description = "SOLID is an acronym for the first five object-oriented design (OOD) principles by Robert C. Martin (also known as Uncle Bob). Note: While these principles can apply to various programming languages, the sample code contained in this article will use PHP. These principles establish practices for developing software with considerations for maintaining and extending it as the project grows. Adopting these practices can also help avoid code smells, refactor code, and develop Agile or Adaptive software. In this article, you will be introduced to each principle individually to understand how SOLID can help make you a better developer. A class should have one and only one reason to change, meaning that a class should have only one job. For example, consider an application that takes a collection of shapes—circles and squares—and calculates the sum of the area of all the shapes in the collection. Next, create the AreaCalculator class and write the logic to sum up the areas of all provided shapes. The area of a square is calculated by length squared, and the area of a circle is calculated by pi times radius squared. To use the AreaCalculator class, you will need to instantiate it, pass in an array of shapes, and display the output at the bottom of the page. The AreaCalculator class would handle all of the logic, violating the single responsibility principle. The AreaCalculator class should only be concerned with the sum of the areas of provided shapes. It should not care whether the user wants JSON or HTML. To address this, you can create a separate SumCalculatorOutputter class and use that new class to handle the logic you need to output the data to the user: Consider a scenario where the user would like the sum of additional shapes like triangles, pentagons, hexagons, etc. You would have to constantly edit this file and add more if/else blocks. That would violate the open-closed principle. A way you can make this sum method better is to remove the logic to calculate the area of each shape out of the AreaCalculator class method and attach it to each shape’s class."
year_published = 2025
clearnet = "https://digitalocean.com/community/conceptual-articles/s-o-l-i-d-the-first-five-principles-of-object-oriented-design"
