["https://digitalocean.com/currents/june-2022"]
title = "June 2022 | DigitalOcean"
description = "a seasonal report on developer and SMB trends in the cloud"
full_description = "Currents is DigitalOcean’s regular report on how developers, startups, and small-to-medium-sized businesses are engaging with technology today. In this edition of Currents, we surveyed over 2,500 developers around the globe on their participation in the open source community, their job satisfaction, and the biggest challenges they face. We dug into emerging trends including serverless and low-code solutions, and examined the popularity of containerization systems and different coding languages. We looked into how factors such as years of job experience and company stage factor into technology usage, and examined how the perceptions of minority groups differ around progress in Diversity and Inclusion. The results demonstrate some clear trends across all developers, and some findings that differ based on company size and years of experience. Throughout our survey, one trend that comes through across respondents is the impact that the Great Resignation has had on developers. Following the Great Resignation of 2020–2021, we are now seeing a developer talent shortage, motivated largely by compensation and a desire for remote work. There is also a small but clear movement for developers to leave jobs to start their own companies, indicating that entrepreneurship is strong among this group. Those who remain at their jobs are also stretched thin, with technical debt and lack of resources as top challenges for developers today. Other main findings show that organizations continue to rely on open source projects for their software development, and participation in the community remains strong. Low-code and no-code solutions, which enable developers and non-developers to create applications without advanced coding skills, have garnered mixed feelings as they become more common, but Kubernetes and serverless solutions are both growing in adoption. The Great Resignation continues in the developer community: Over a quarter of developers who have been in the workforce for over a year started a new job in the past year, with developers at enterprises and startups changing jobs in roughly equal numbers. Additionally, 42% of those who haven’t left their jobs yet are considering or may consider leaving their current jobs this year. Both those who have already left and those considering leaving jobs are motivated by two main factors: Compensation and fully remote or flexible work environments. With an ongoing rise in inflation and the continuing COVID-19 pandemic, it’s clear companies need to offer high pay and work flexibility to retain developers."
year_published = 2025
