full_description = "WordPress is one of the most popular content management and blog platforms in the world, allowing you to create and manage website content efficiently. This tutorial will guide you through setting up a WordPress site using the WordPress 1-Click App. Deploy your WordPress applications from GitHub using DigitalOcean App Platform. Let DigitalOcean focus on scaling your app. In addition to the features installed in a regular Ubuntu Droplet, the WordPress 1-Click image also includes the following components: These components create the LAMP stack, a group of open-source software typically installed together to enable a server to host dynamic websites like WordPress. The term LAMP is an acronym that represents the configuration of a Linux operating system with an Apache web server, with site data stored in a MySQL database and dynamic content processed by PHP. In the following steps, you’ll create a WordPress 1-Click Droplet, then set up your WordPress site, configure the domain, and share information on how to access the MySQL database. Create a Wordpress Droplet from the 1-Click App Marketplace, by pressing the Create WordPress Droplet button: This takes you to the Create Droplets page, where you can customize your settings before creating your WordPress Droplet. Read the guide on How to Create your First Droplet for a detailed description of all the choices you need to make. The following sections provide a few key settings to consider. Once the WordPress image is properly selected, you can accept the defaults or adjust settings according to your use case. We typically recommend the following changes: To avoid potential latency, it is recommended that you select a data center region closest to your user base. In some regions, we have more than one data center. There is no difference between these same-region data centers (e.g., SFO3 and SFO2). The SSH Key option is recommended, rather than a Password for your Droplet. Authentication using SSH Keys is typically more secure."
