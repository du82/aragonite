full_description = "Scale your applications and improve availability, security, and performance across your infrastructure in a few clicks. DigitalOcean's Load Balancers ensure traffic is distributed across your infrastructure to increase your application's availability and help you deliver exceptional experiences to your customers. Load Balancers are constantly monitored for availability and anomalies—any issues discovered are corrected automatically so your app always runs smoothly. Automatically provision and renew SSL certificates free of charge through Let's Encrypt, and provide better performance for your users with HTTP/3. With DigitalOcean's Internal Load Balancer, you can effortlessly scale your private workloads within a VPC without public internet exposure. Load Balancers are a highly available, fully-managed service that work right out of the box and can be deployed as fast as a Droplet. Load Balancers distribute incoming traffic across your infrastructure to increase your application's availability, performance, and reliability at scale so you can be sure your Droplet runs smoothly at all times. Load Balancers can be sized to suit your needs, and each node only costs $12 per month. Equipped with integrated Let's Encrypt SSL, provisioning, renewal, and support for HTTP/3, Load Balancers are incredibly easy to use and give your users exceptional performance. A must-have for production apps, Load Balancers spread traffic across your compute resources to improve availability, performance, and scalability. Take any number of actions—including creating a new Load Balancer and adding Droplets to them through the API (Go and Ruby wrappers coming soon). Includes OAuth support. Find out more about Load Balancers and creating highly available infrastructure with the help of step-by-step tutorials."
