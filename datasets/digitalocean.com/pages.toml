["https://digitalocean.com/community/tutorials/how-to-monitor-docker-using-zabbix-on-ubuntu-20-04"]
title = "How to Monitor Docker Using Zabbix on Ubuntu 20.04 | DigitalOcean"
description = "Learn how to set up monitoring for Docker containers using Zabbix, an open-source monitoring tool for IT infrastructure."
full_description = "The author selected the Open Source Initiative to receive a donation as part of the Write for DOnations program. Docker is a popular application that simplifies managing application processes in containers. Containers are similar to virtual machines, but since they are more dependent on the host operating system, they are more portable and resource-friendly. When using containers in a production environment, you should know if they are all running and what resources they are consuming. Zabbix is a monitoring system that can monitor the state of almost any element of your IT infrastructure, such as networks, servers, virtual machines, and applications. Zabbix recently introduced a new agent (Zabbix agent 2) with advanced capabilities. One of the key advantages of the new agent is the ability to expand functionality using plugins. At the moment, there are several plugins available, including one for monitoring Docker. In this tutorial, you will set up Docker monitoring in Zabbix using Zabbix agent 2 on Ubuntu 20.04. You’ll explore metrics and simulate a crash to generate a notification. In the end, you will have a monitoring system in place for your Docker application, which will notify you of any problems with containers. Two Ubuntu 20.04 servers set up by following the Initial Server Setup Guide for Ubuntu 20.04, including a non-root user with sudo privileges and a firewall configured with ufw. The first server, where you’ll install Zabbix, will be the Zabbix server. Install the following components: The second server, where you’ll install Docker (and the Zabbix agent), will be the Docker server. Install Docker by following Step 1 of the tutorial How To Install and Use Docker on Ubuntu 20.04. A fully registered domain name. This tutorial will use your_domain as an example throughout. You can purchase a domain name on Namecheap, get one for free on Freenom, or use the domain registrar of your choice. An A record with your_domain pointing to your Zabbix server’s public IP address. You can follow this introduction to DigitalOcean DNS for details on how to add it."
