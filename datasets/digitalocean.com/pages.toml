["https://digitalocean.com/community/tutorials/how-to-set-up-ssh-keys-on-ubuntu-20-04"]
title = "How to Set Up SSH Keys on Ubuntu 20.04 | DigitalOcean"
description = "In this guide, we’ll focus on setting up SSH keys for an Ubuntu 20.04 installation. SSH keys provide an easy, secure way of logging into your server and are …"
full_description = "SSH, or secure shell, is an encrypted protocol used to administer and communicate with servers. When working with an Ubuntu server, chances are you will spend most of your time in a terminal session connected to your server through SSH. In this guide, we’ll focus on setting up SSH keys for an Ubuntu 20.04 installation. SSH keys provide a secure way of logging into your server and are recommended for all users. Creating a DigitalOcean Droplet will allow you to instantly add your computer’s SSH keys so you can connect privately and securely. By default recent versions of ssh-keygen will create a 3072-bit RSA key pair, which is secure enough for most use cases (you may optionally pass in the -b 4096 flag to create a larger 4096-bit key). Press enter to save the key pair into the .ssh/ subdirectory in your home directory, or specify an alternate path. If you choose to overwrite the key on disk, you will not be able to authenticate using the previous key anymore. Be very careful when selecting yes, as this is a destructive process that cannot be reversed. Here you optionally may enter a secure passphrase, which is highly recommended. A passphrase adds an additional layer of security to prevent unauthorized users from logging in. To learn more about security, consult our tutorial on How To Configure SSH Key-Based Authentication on a Linux Server. You now have a public and private key that you can use to authenticate. The next step is to place the public key on your server so that you can use SSH-key-based authentication to log in. The quickest way to copy your public key to the Ubuntu host is to use a utility called ssh-copy-id. Due to its simplicity, this method is highly recommended if available. If you do not have ssh-copy-id available to you on your client machine, you may use one of the two alternate methods provided in this section (copying via password-based SSH, or manually copying the key). The ssh-copy-id tool is included by default in many operating systems, so you may have it available on your local system. For this method to work, you must already have password-based SSH access to your server."
year_published = 2025
clearnet = "https://digitalocean.com/community/tutorials/how-to-set-up-ssh-keys-on-ubuntu-20-04"
