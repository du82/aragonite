["https://digitalocean.com/pricing/kubernetes"]
title = "Kubernetes Pricing | DigitalOcean"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "Always more cost effective than hyperscalers, DigitalOcean delivers optimal performance and transparent pricing. For a variety of ISV applications, DigitalOcean is consistently less expensive than AWS. Eliminate surprise fees and hard-to-estimate usage costs such as data egress or storage performance. Always know what you pay with monthly caps and flat pricing on DigitalOcean. Learn more about DigitalOcean Kubernetes or check out our DigitalOcean Kubernetes product documentation. Run your Kubernetes clusters on the powerful DOKS control plane and add the High Availability to the control plane for only $40/month. The DigitalOcean Container Registry is also free up to 500MiB, updates are free, and our autoscaler is free. Get free bandwidth based on the nodes you use, starting at 2,000 GiB/node per month and scaling up. Bandwidth pooling lets you add all your nodes free bandwidth together to increase your free allowance. Plus, a $0.01/GiB overage keeps costs low if you go over. Only outgoing transfers are billed; internal transfers are free. Kubernetes automation like advanced scheduling and autoscaling help you get the most out of your infrastructure, hands free. Unused resources can be automatically deleted and you can have more pods automatically created to meet spiking demand. No, DigitalOcean Kubernetes provides the control plane for free. This includes management for processes like etcd, kube-apiserver, kube-controller-manager, kube-scheduler, cloud-controller-manager, and other services. You can add High Availability to the control plane for only $40/month. Learn how to create a HA DOKS cluster. All pricing on this page is for a single node. The price goes up as you increase the number of nodes in your cluster. For example, the price of one node that uses a general-purpose Droplet with 8 GiB of RAM is $63/month. If you increase the cluster size to 3 of those nodes, then the price would be $189/month. We recommend using a minimum of two nodes to prevent downtime during upgrades or maintenance."
