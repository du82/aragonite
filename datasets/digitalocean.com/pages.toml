["https://digitalocean.com/community/tutorials/harnessing-gpus-glb-vpc-for-genai-products"]
title = "Scaling GenAI with GPU Droplets and DigitalOcean Networking | DigitalOcean"
description = "Build Scalable and Secure GenAI with DigitalOcean’s GPUs, VPC, and Global Load Balancers."
full_description = "If you have, you know the key to a good image is a good detailed prompt. And I am bad at such detailed visual prompting, so I rely on large language models to generate the detailed prompt and then use that to generate great images. Here are some examples of the prompts and images I was able to generate: Prompt: Create a stunning aerial view of Bengaluru, India with the city name written in bold, golden font across the top of the image, with the city skyline and Nandi Hills visible in the background. Prompt: Design an image of the iconic Vidhana Soudha building in Bengaluru, India, with the city name written in a modern, sans-serif font at the bottom of the image, in a sleek and minimalist style. Prompt: Generate an image of a bustling street market in Bengaluru, India, with the city name written in a playful, cursive font above the scene, in a warm and inviting style. In order to achieve these results we are using Flux.1-schnell model for image generation and Llamma 3.1 - 8B - Instruct model for Prompt generation. Both of them are hosted on 1 single H100 machine with the help of MIG(more on this later). This blog is not another image generation tutorial. Our goal is to create a scalable, secure, and globally accessible (and affordable) GenAI architecture. Imagine a business case where a global e-commerce platform requires rapid image customisation for users or a content platform delivering on-demand AI-generated text across continents. Such a setup has many challenges for a developer. Example: To make this possible, we designed a distributed architecture using DigitalOcean’s infrastructure. We start with a Global Load Balancer (GLB) to manage incoming requests, ensuring that users from any region experience minimal latency. Next, we have lightweight image generation apps deployed in key regions—London, New York, and Sydney—each with its on cache and ready to connect with our GPU resources as needed. Finally, all these components securely communicate over VPC Peering, channeling complex tasks back to our powerhouse H100 GPU in Toronto, where the prompt and image generation magic happens."
