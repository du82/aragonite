["https://digitalocean.com/community/tutorials/how-to-list-and-delete-iptables-firewall-rules"]
title = "How To List and Delete Iptables Firewall Rules | DigitalOcean"
description = "Iptables is a firewall technology that plays an essential role in network security for many Linux systems. In this tutorial, we will cover how to do the foll…"
full_description = "Iptables is a firewall that plays an essential role in network security for most Linux systems. While many iptables tutorials will teach you how to create firewall rules to secure your server, this one will focus on a different aspect of firewall management: listing and deleting rules. Note: When working with firewalls, take care not to lock yourself out of your own server by blocking SSH traffic (port :22, by default). If you lose access due to your firewall settings, you may need to connect to it via an out-of-band console to fix your access. This tutorial assumes you are using a Linux server with the iptables command installed, and that your user has sudo privileges. If you need help with this initial setup, please refer to our Initial Server Setup with Ubuntu 20.04 guide. It is also available for Debian and CentOS. Let’s look at how to list rules first. There are two different ways to view your active iptables rules: in a table or as a list of rule specifications. Both methods provide roughly the same information in different formats. To list out all of the active iptables rules by specification, run the iptables command with the -S option: As you can see, the output looks just like the commands that were used to create them, without the preceding iptables command. This will also look similar to the iptables rules configuration files, if you’ve ever used iptables-persistent or iptables save. If you want to limit the output to a specific chain (INPUT, OUTPUT, TCP, etc.), you can specify the chain name directly after the -S option. For example, to show all of the rule specifications in the TCP chain, you would run this command: Now let’s take a look at the alternative way to view the active iptables rules: as a table of rules. Listing the iptables rules in the table view can be useful for comparing different rules against each other. To output all of the active iptables rules in a table, run the iptables command with the -L option: If you want to limit the output to a specific chain (INPUT, OUTPUT, TCP, etc.), you can specify the chain name directly after the -L option."
year_published = 2025
