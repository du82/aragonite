title = "Resoto | DigitalOcean"
description = "Open Source Asset Inventory for Digital Ocean"
full_description = "Resoto is a free, self-hosted and open-source infrastructure resource tool (RESOurce TOol… But we also love the italian dish Risotto 🍚). Resoto creates an inventory of your cloud by taking a snapshot of your cloud assets. We collect that snapshot data through API-based interactions. We created Resoto to “scratch our own itch” as they say. As platform engineers, we were trying to understand what’s running in our cloud. The cloud providers don’t always make that easy. The first use case for Resoto is simply just having your Digital Ocean resource inventory, and how all resources relate to each other. Once you know your inventory, you can build more use cases on top of that. For example cloud cost, security, search, engineering metrics. Resoto’s differentiator is a unified data model that builds a single graph out of your entire resources. That gives you a ton of advantages, from full-text search across your entire infrastructure to the ability to get a 10,000 foot view of literally “everything”. It’s a bit like Google Search for your infrastructure. You can type !ref in this text area to quickly search our full set of tutorials, documentation & marketplace offerings and insert the link! Have you created an Integration, API Wrapper, Service, or other Tool that helps developers build on DigitalOcean? Help users find it by listing it in Community Tools. Get paid to write technical tutorials and select a tech-focused charity to receive a matching donation. The Wave has everything you need to know about building a business, from raising funding to marketing your product."
