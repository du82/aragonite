description = "Collect metrics, monitor application performance and receive alerts if infrastructure issues arise – no configuration required."
full_description = "Track metrics for visibility, monitor Droplet performance, and receive alerts if infrastructure issues arise—with no configuration required. Stay on top of server performance with DigitalOcean Monitoring and help ensure a smooth user experience. Easily enable open-source-powered Monitoring via the control panel or API to track performance, view metrics, and set up alerts all in one place. Know how your Droplets are performing over time and when to scale to improve your application's performance with up-to-the minute visualizations. Get notified when any metric—on any Droplet or group of Droplets—crosses your specified threshold and when critical issues arise in your infrastructure. Easily integrate with your Slack account (or email) via OAuth to instantly get pinged in a Slack channel when a new alert is triggered. DigitalOcean Droplets are Linux-based virtual machines (VMs) that run on top of virtualized hardware. Each Droplet you create is a new server you can use, either standalone or as part of a larger, cloud-based infrastructure. Monitoring on DigitalOcean is automatically enabled when you install the Monitoring agent on your Droplet. To install the Monitoring agent, you just need to select Monitoring on your cloud console. You can also use our API, or a package manager to add the agent to your Droplets. The data for the running Droplets is retained for 14 days. When a Droplet is destroyed, the data associated with the Droplet is also deleted. When you create an alert policy, you first choose the Droplet metric you want it to monitor. Next, you choose the evaluation period (e.g. five minutes or one hour). To set a threshold, set a target value and choose whether the alert will trigger when the value is above or below the value. Find out more about Monitoring and creating highly available infrastructure with the help of step-by-step tutorials."
