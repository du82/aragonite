title = "If I destroy a droplet will I lose my SSL settings and DNS settings? | DigitalOcean"
description = "If I destroy a droplet will I loose my SSL settings and DNS settings? Planning to update Ubuntu OS to 22 and PHP to version 8.1"
full_description = "If I destroy a droplet will I loose my SSL settings and DNS settings? Planning to update Ubuntu OS to 22 and PHP to version 8.1 You can type !ref in this text area to quickly search our full set of tutorials, documentation & marketplace offerings and insert the link! These answers are provided by our Community. If you find them useful, show some love by clicking the heart. If you run into issues leave a comment, or add your own answer to help others. The DNS settings will not be changed/lost if you destroy your droplet. You will just need to update the DNS later on when you configure a new droplet. As with almost any upgrade between major releases of an operating system, this process carries an inherent risk of failure, data loss, or broken software configuration. Comprehensive backups and extensive testing are strongly advised. To avoid these problems, we recommend migrating to a fresh Ubuntu 22.04 server rather than upgrading in-place. You may still need to review differences in software configuration when upgrading, but the core system will likely have greater stability. You can follow our series on how to migrate to a new Linux server to learn how to migrate between servers. You can still upgrade the current version of Ubuntu if this is the desired approach by following the steps in this article: If you manage your DNS in your DigitalOcean account or in any other place you will keep your DNS settings. As for the SSL, yes, the certificate and any configuration on your Droplet will be lost but you can re-create them afterwards. Anyway, if you currently have Ubuntu and you just want to update from 18.04 to 22.04 or from 20.04 to 22.04 there is no need to destroy the Droplet and re-create it. You can just update your OS. To do so just run Lastly, before doing that I’ll recommend you to create a Snapshot on your Droplet just to be on the safe side: Snapshots are on-demand disk images of DigitalOcean Droplets and volumes saved to your account. Use them to create new Droplets and volumes with the same contents."
