full_description = "Nonprofit Exchange is a technology nonprofit established in 2015 whose mission is to maximize capacity for charitable organizations through custom, low-cost technology solutions. As long-time customers, Nonprofit Exchange uses DigitalOcean Droplets as a foundation to enable their work, and the work of many nonprofits across the U.S. Executive Director John Hernandez shared that he first signed up for DigitalOcean on a recommendation from colleagues who trusted the technology. Over time, Nonprofit Exchange has increasingly relied on DigitalOcean for three key reasons: Scalability: “The ability to instantly scale our Droplets allows us to feel confident in supporting even more nonprofits and projects—especially when we’re dealing with emergency situations.” Easily-accessible resources: “When a university asked for our help raising money for its gala, we were able to use DigitalOcean’s readily provided information on our server’s infrastructure to quickly and efficiently become a registered vendor.” Platform confidence: “DigitalOcean provides a safe and secure environment where our programs and services can scale. When you have infrastructure that grows with you—one that you never have to worry about—it allows you to focus on the main mission of your organization.” When John began working with local nonprofits in El Paso, Texas, he quickly realized that many had similar pain points. Prior knowledge of the developer space led him to one conclusion: he could create one technology solution that simultaneously solves all of these pain points. Enter: The Nonprofit Exchange—a nonprofit agency serving multiple charitable organizations with simple technology solutions. At the time, many existing products available to nonprofits were too expensive, yet not robust enough. The first solution John and his team built was an SMS fundraising platform called Donor Charm, a platform built on DigitalOcean and powered by Twilio. The platform has more than 100 customizable features to support a nonprofit’s mission and fundraising campaigns."
