["https://digitalocean.com/pricing/app-platform"]
title = "App Platform Pricing | DigitalOcean"
description = "App Platform: Free tier for static sites. Web hosting from $3.00/month. Only pay for the components you need with transparent, modular pricing."
full_description = "Build, deploy, and scale apps quickly using a simple, fully managed solution. We'll handle the infrastructure, app runtimes, and dependencies, so you can focus on your code. App Platform's modular pricing means you have the flexibility to select resources to suit your use case. Select container instances from fixed, shared or dedicated resources to suit your requirements. Shared container instances are typically recommended for applications such as low traffic websites, blogs, discussion forums, and CMS.Dedicated container instances are generally recommended for applications with higher performance requirements or more consistent resource needs, such as ecommerce, SaaS, gaming, and AI/ML workloads.For optimal performance, we highly recommend testing your application with both shared and dedicated instances. In some cases, smaller dedicated instances may provide better performance than shared instances.This guidance is similar to droplet recommendations for shared vs. dedicated. Learn more here. At a high level, an app is either free (only using static site components) or paid (using container instances). The amount of outbound data transfer included with your App Platform app depends on the number and size of the container instances your app is using.Each container instance comes with a specific amount of data transfer allowance based on its size. For example, a dedicated container instance with 1 vCPU/0.5 GiB of RAM includes 100 GiB of outbound data transfer per month. If your app is using 5 instances of the 1 vCPU/0.5 GiB dedicated container size, your total data transfer allowance would be:100 GiB × 5 instances = 500 GiB (or 0.488 TiB) per month, assuming all 5 instances were running continuously throughout the month.It's important to note that the data transfer allowance is prorated on a per-second basis, just like with Droplets. This means that if you scale your app's instances up or down during the month, your data transfer allowance will be adjusted accordingly."
