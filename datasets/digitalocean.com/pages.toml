["https://digitalocean.com/currents/november-2021"]
title = "November 2021 | DigitalOcean"
description = "a seasonal report on developer and SMB trends in the cloud"
full_description = "Small and medium-sized businesses (SMBs) make up a huge part of the economy, but many solutions cater to enterprises, and SMBs face unique challenges when it comes to running their business and selecting technology solutions. To gather in-depth information about SMBs of all types and their challenges and use of cloud solutions today, DigitalOcean worked with research agency AspenFinn to conduct research with three groups: To answer our questions surrounding business challenges and identify trends regarding SMBs and cloud usage, a survey was conducted with 2,400 IT decision makers in 48 countries. The main sample consists of a roughly equal amount of respondents in each of the three business types. A summary of findings is below, and you can download the full 50+ page report, which includes regional insights and additional data, by downloading the report. SMBs of all types have less technical staff than enterprises and are more likely to have multiple priorities when it comes to managing cloud solutions. This report found that the responsibility of managing cloud services often falls on the CEO, president, or even the owner of the traditional SMB. On top of limited technical staff, traditional SMBs note cost (19%), technical training and education (13%), and time required to manage services (12%) as barriers to cloud adoption, showing traditional SMBs are calling for cloud solutions that are less complex and easier to manage. Traditional SMBs suffer from a knowledge gap around cloud solutions, which means their cloud setups are less complex than tech-focused SMBs and enterprises. For example, 48% of respondents from traditional SMBs are not familiar with the term “cloud native,” compared to the 5% of respondents from enterprises who are not familiar with the term. Meanwhile, 56% of respondents from traditional SMBs are not familiar with the term “digital native,” compared to the 18% of respondents from enterprises who are not familiar. Of the respondents who reported increased cloud usage in 2020 due to COVID-driven digital acceleration, 82% of traditional SMBs, 82% of tech SMBs, and 92% of enterprises said their cloud usage has continued to increase this year. Sixty-nine percent of respondents believe the cloud has helped their business recover from the ongoing pandemic. Businesses of all sizes say coping with the impacts of COVID-19 is the biggest challenge they face right now, but for traditional SMBs, keeping up with the technology curve is just behind."
year_published = 2025
