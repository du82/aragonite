title = "How To Set Up a Node.js Application for Production on Ubuntu 22.04 | DigitalOcean"
description = "Node.js is an open-source JavaScript runtime environment for building server-side and networking applications. The platform runs on Linux, macOS, FreeBSD, an…"
full_description = "Node.js is an open-source JavaScript runtime environment for building server-side and networking applications. The platform runs on Linux, macOS, FreeBSD, and Windows. Though you can run Node.js applications at the command line, this tutorial will focus on running them as a service. This means that they will restart on reboot or failure and are safe for use in a production environment. In this tutorial, you will set up a production-ready Node.js environment on a single Ubuntu 22.04 server. This server will run a Node.js application managed by PM2, and provide users with secure access to the application through an Nginx reverse proxy. The Nginx server will offer HTTPS using a free certificate provided by Let’s Encrypt. When you’ve completed the prerequisites, you will have a server serving your domain’s default placeholder page at https://example.com/. Let’s write a Hello World application that returns “Hello World” to any HTTP requests. This sample application will help you get up and running with Node.js. You can replace it with your own application — just make sure that you modify your application to listen on the appropriate IP addresses and ports. Save the file and exit the editor. If you are using nano, press Ctrl+X, then when prompted, Y and then Enter. This Node.js application listens on the specified address (localhost) and port (3000), and returns “Hello World!” with a 200 HTTP success code. Since we’re listening on localhost, remote clients won’t be able to connect to our application. Note: Running a Node.js application in this manner will block additional commands until the application is killed by pressing CTRL+C. To test the application, open another terminal session on your server, and connect to localhost with curl: If you get the following output, the application is working properly and listening on the correct address and port: If you do not get the expected output, make sure that your Node.js application is running and configured to listen on the proper address and port."
