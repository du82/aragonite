["https://digitalocean.com/products/ddos-protection"]
title = "DigitalOcean DDoS Protection"
description = "Always-on DDoS protection for your DigitalOcean resources."
full_description = "Your DigitalOcean resources are protected—for free—against Distributed Denial of Service (DDoS) attacks with always-on protection and automated mitigation, so you can run your website and apps without interruption. Your DigitalOcean resources are safeguarded from DDoS attacks with free, built-in DDoS protection that works automatically. You're protected against ever-evolving varieties of network-layer DDoS, without any need for manual configuration. Built into the DigitalOcean cloud, in-network DDoS mitigation defends your resources without having to route traffic to a third party. Common, generalized DDoS attacks are blocked automatically via rules that adapt to attack types, while still allowing legitimate data traffic to pass through. Volumetric attacks such as UDP floods, ICMP floods, TCP floods, and DNS reflection attacks are covered, plus protocol-layer attacks such as SYN floods, BGP attacks, and ping-of-death attacks. DDoS Protection covers your DigitalOcean cloud infrastructure, including Droplets, Kubernetes, Managed Databases, Load Balancers, and assigned Reserved IPs, across all our data centers. DDoS Protection is a free, always-on service that safeguards your DigitalOcean cloud resources from a range of generalized, network-layer DDoS attacks to help ensure your apps & websites run without disruption. No, DigitalOcean DDoS Protection is built into our cloud and mitigation happens within our network so you get powerful protection with no additional latency. DigitalOcean DDoS Protection operates in Network (layer 3) and Transport (layer 4) layers of the OSI model. Application layer (layer 7) DDoS Protection is not supported. DDoS Protection covers DigitalOcean Droplets, Kubernetes, Managed Databases, Load Balancers, and assigned Reserved IPs. Have a complex setup or additional questions around pricing? Contact our sales team to get more information on DigitalOcean pricing."
