title = "Customers - EGLogics"
description = "EGLogics is a global web and digital marketing agency providing website development, mobile app development, and digital marketing services. They rely on DigitalOcean Droplets, Managed MongoDB, Volumes Block Storage, and Spaces to scale quickly and provide a reliable service."
full_description = "EGLogics, a global web and digital marketing agency founded in 2013 in India, offers website development, mobile app development, and digital marketing services to a range of clients—from startups to Fortune 500 companies. With customers across the United Kingdom, The United States, and India, EGLogics trusts DigitalOcean to host the websites, applications, and products they build. They rely on DigitalOcean products like Droplets, Managed MongoDB, Volumes Block Storage, and Spaces to scale quickly and provide a reliable service, whether they’re building eCommerce websites or internal inventory software. When Ankit Aggarwal, the CEO and CTO of EGLogics, started EGLogics he gravitated towards AWS for his agency’s cloud infrastructure needs. However, he and his team quickly encountered challenges—including the difficulty of simply navigating the platform. “They have made the interface so complicated that a normal user can not easily navigate through all the options. For instance, to provide someone with access, it’s not easily possible.” — Ankit Aggarwal, CEO and CTO of EGLogics Furthermore, when they encountered challenges, they couldn’t easily consult documentation. That, too, was difficult to decipher. “When I used AWS, the documentation was not easy to use. If you wanted to find a way to achieve something, it was difficult. If I have to choose a VPS provider, their documentation and display of services should be easy to use.” — Ankit Aggarwal, CEO and CTO of EGLogics Furthermore, forecasting their expenses while operating across multiple regions was unpredictable. Aggarwal sought out a different cloud solution for the company to alleviate these issues. His primary considerations in evaluating cloud providers included speed of go-to-market and simple maintenance. He landed on DigitalOcean. Aggarwal previously used DigitalOcean for working on smaller projects. When it came time to explore a new cloud solution for his growing agency, he found what he needed to support EGLogics’ growth. With DigitalOcean products like Droplets, Managed MongoDB, Volumes Block Storage, and Spaces, their agency has scaled to have clients and partners in over 30 countries. Besides supporting his agency, they built and scaled their affiliate marketing product—Career Wallet—to 15 countries, launching in new geographies more every quarter."
