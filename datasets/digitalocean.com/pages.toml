full_description = "Reliably run training and inference on AI/ML models, process large data sets and complex neural networks for deep learning use cases, and serve additional use cases like high-performance computing (HPC). The prices listed below are subject to change. For more detailed information on billing please refer to our DigitalOcean GPU Droplet product documentation. Take advantage of our promotional prices! Try out our on-demand H100 GPUs at our promotional prices. Save more by reserving instances for prices as low as $2.50/GPU/hr *Promotional pricing is subject to change at any time. Promotional pricing is limited to on-demand GPU Droplets. All discount promotions are subject to our Promotional Credit and Discount Terms. When you power off your GPU Droplet, you are still billed for it. This is because your disk space, CPU, RAM, and IP address are all reserved, even while powered off. Therefore, charges are made until you destroy the instance. No. You will only be charged for the time you use your GPU Droplet in seconds. If you use your GPU Droplet for more than the standard 672-hour monthly limit, you will still be charged for the time you use your GPU Droplets in seconds. We accept Visa, Mastercard, American Express, Discover, PayPal, Google Pay, and Apple Pay. Apple pay requires a Safari browser. For additional payment options, including wire transfer, purchase orders, and ACH, please contact us. Note that when you add a card, we may send a temporary pre-authorization request to the issuing bank. This pre-authorization charge is immediately released by DigitalOcean but may take a few days to clear from your card depending on the bank. DigitalOcean billing cycles are monthly. Typically, on the first day of each month we invoice and automatically charge your account's primary payment method for the previous month's usage. In some cases, we might charge if your usage exceeds a threshold. You can also login and self pay the balance at any time. No. Your card is only charged at the end of the billing cycle or upon exceeding a usage threshold. Pre-authorization charge: When you add a card, we may send a preauthorization request to the issuing bank. This is to verify that the card being added has been issued by the bank and that they will authorize any charges in future. These temporary pre-authorizations are typically $1 but can vary in range and are immediately canceled by us. Depending on your bank, it might take a few days for the charge to clear from the card."
