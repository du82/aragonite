description = "Hack The Box offers advanced training for IT security professionals and hackers through gamified, hands-on experiences. Hack The Box uses DigitalOcean Kubernetes to scale their platform and successfully host thousands of users at a time."
full_description = "Hack The Box offers advanced training for IT security professionals and hackers through gamified, hands-on experiences. Users learn hacking methodology, the penetration testing process, and how to research vulnerabilities by completing a series of challenges on the platform. Completely self-driven, users are rewarded with points and increased rankings for solving progressively complex scenarios that teach them invaluable skills. Hack The Box has seen tremendous growth over the last four years. What began as a nimble, three-person team in 2017 has scaled to over 100 employees. With multiple rounds of funding and a user-base that’s grown to more than 750,000 platform members and more than 800 organizations, Hack The Box needed a partner that could scale easily and quickly while maintaining high performance. Driven by the need for simplicity and base performance, the Hack The Box team engaged DigitalOcean. The preliminary platform ran on a hyperscale cloud provider, with a couple of virtual machines and a Relational Database. The division of infrastructure was two-fold–one side took care of the database tasks, and the second side took care of presenting the main Web Application. When James Hooker joined Hack The Box as CTO, he suggested exploring DigitalOcean for their infrastructure. Having been a long-time user of DigitalOcean, Hooker knew that the platform provided simplicity, VM performance, and community support that would benefit Hack The Box. Hack The Box was interested in moving to DigitalOcean and ran benchmarking tests to ensure the performance would exceed their current setup. As Hack The Box began migrating, it became clear that the performance of Droplets in DigitalOcean was superior. Now, Hack The Box takes full advantage of DigitalOcean’s product portfolio and runs around 95% of its infrastructure on DigitalOcean. The primary web server, backend database server, and task scheduler for Hack The Box as a platform, Capture the Flag, Academy and Enterprise Platform all operate on DigitalOcean Droplets. And the team uses dedicated CPU Droplets with “Parrot Linux” for penetration testing and lucrative attacking environments."
