title = "Customers - myCast"
description = "myCast uses DigitalOcean App Platform to quickly and easily monitor performance and ensure a great experience for hundreds of thousands of users per day. They benefit from the time saved no longer needing to manually maintain server-side infrastructure."
full_description = "The myCast platform allows fans to speculatively select who should play characters in their favorite stories through proposing actors, commenting on other individuals’ ideas, and voting for their favorite suggestions. The idea of “fan casting”—fans of a story pitching their ideas for which actors should play the characters in film adaptations—is an increasingly popular online activity, with various platforms and social media accounts garnering hundreds of thousands of followers dedicated to this hypothetical casting. myCast began as a passion project for founder Billy Swift after a site he enjoyed with a similar concept shut down. Fan casting is fun for many people, and he wanted to find a way to serve this online community. Swift is a web developer without much experience building and maintaining backend infrastructure. He also has a full-time career, meaning he had limited hours to dedicate to his project. Although he knew how to build the web application he envisioned, he needed a cloud provider that would give him the ability to maintain his backend infrastructure himself even with his minimal time and server-side experience. DigitalOcean’s simple offerings that are easy to use and understand, along with its reasonable price point that allows rapid scaling within a limited budget, appealed to Swift as he researched hosting options for his web application. Swift built his platform on DigitalOcean’s Droplets and launched it in 2017. Over the last few years, the site has seen successful organic growth. The myCast team joined DigitalOcean’s Hatch program in 2019 when it was searching for ways to scale rapidly at a reasonable cost. The Hatch program helps global startups grow and scale their businesses through infrastructure credits, training, and support. With the additional support they received through Hatch, the myCast team was able to sustainably scale to meet the demands of their customers. Now, the myCast team consists of Swift and a few other individuals who all work on the project in their spare time. Swift is the only technical contributor, with the other individuals focused on content, marketing, and design. They received no startup funding and bootstrapped the project until receiving an investment in 2020 that allowed the team to further develop the application and add new features to benefit users. The team has been working to monetize the site through ad revenue and hopes to continue to build the user base and grow their organic traffic. What began as a small project with a handful of patrons has grown to an online community now serving over 100,000 users per month."
year_published = 2025
