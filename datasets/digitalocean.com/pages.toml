title = "Technical Recommendations and Best Practices for DigitalOcean's Tutorials | DigitalOcean"
description = "This guide is an effort to summarize established best practices and strong recommendations for authors of DigitalOcean tutorials. It is intended to provide a…"
full_description = "This guide is an effort to summarize established best practices and strong recommendations for authors of DigitalOcean tutorials. It is intended to provide a foundation for consistency, technical correctness, and ease of use in DigitalOcean’s instructional material. This guide is by nature both a work in progress and an opinionated document, based on the growing experience of in-house technical writers and editors, community managers, and engineers. Its recommendations are subject to change, and are written specifically for educational content with a broad range of readers and end-users in mind. Many tutorials will rely on existing tutorials as prerequisites. Put all prerequisites for the article (including any nested prerequisites for the prerequisites) into the article, rather than having deeply nested prereq lists. In general, avoid unnecessary complication. For unpackaged software installed from source or binaries, you should generally accept the default installation prefix unless it’s very unusual or introduces conflicts. An init script, conforming to official recommendations for the distribution, should be given for service-oriented software, if not provided by the package or other installation method. On Linux systems, put self-contained binaries or directories in /opt and standalone scripts in /usr/local/bin. Ubuntu and Debian systems should have unattended-upgrades with at least security updates installed and configured. We recommend no auto-reboot or auto-update all, given context. We generally recommend using the apt command for Ubuntu 18.04 and newer. Change apt-get and apt-cache to use apt. When updating apt commands, do not use the -y flag; readers should be guided through any necessary inputs and prompts. For CentOS and Rocky Linux tutorials, we now recommend using dnf, which has superseded yum and provides better performance. If a tutorial relies on the latest updates, call update and upgrade during Step 1 setup or as needed. Call update first so that your server pulls the latest versions of packages. When including upgrade, which downloads and installs new versions for every package, please be aware that some users may choose to keep certain packages at a lower version."
