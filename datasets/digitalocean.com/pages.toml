["https://digitalocean.com/blog/announcing-digitalocean-netlify-extension"]
title = "Introducing the DigitalOcean Netlify Extension | DigitalOcean"
description = "We’re thrilled to announce our latest partnership with Netlify! This collaboration combines the power of DigitalOcean’s scalable cloud infrastructure with Netlify’s seamless web deployment capabilities, giving developers an even easier way to build, deploy, and scale their web projects."
full_description = "At DigitalOcean, we are constantly striving to make the developer experience as smooth and efficient as possible. That’s why we’re thrilled to announce our latest partnership with Netlify! This collaboration combines the power of DigitalOcean’s scalable cloud infrastructure with Netlify’s seamless web deployment capabilities, giving developers an even easier way to build, deploy, and scale their web projects. Today, with the launch of the Netlify Extensions, we are excited to announce the DigitalOcean Netlify Extension, which enables customers to easily connect their Netlify sites to DigitalOcean’s Managed MongoDB offering. Combining Netlify with the power and flexibility of MongoDB gives developers the ideal platform to build and scale their dynamic web applications. Whether you’re developing in Jamstack or NodeJS, DigitalOcean Managed MongoDB gives you the flexibility you need to manage dynamic data while maintaining the speed and performance of your static site. And, since you’re hosting your MongoDB on DigitalOcean, you’ll have access to all the features and benefits that come with DigitalOcean’s Managed MongoDB including: High availability: add redundancy with standby nodes that start serving requests if your primary fails To get started with the DigitalOcean Netlify Extension simply install the extension through the Netlify console. You can access the extension through your site on the side nav of the Netlify console. Once you’ve installed the extension, simply add your DigitalOcean Managed MongoDB connection string to the provided text box. Once it’s added then tada! Your MongoDB instance is now available in your Netlify project’s environment variables and it can be accessed via Netlify Functions. We’ve started the DigitalOcean/Netlify Partnership by enabling a MongoDB connection, but we don’t plan on stopping there! Coming soon, we’re looking to add additional database engines, Spaces Object Storage and much much more!"
year_published = 2025
