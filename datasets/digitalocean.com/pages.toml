["https://digitalocean.com/customers/snipitz"]
title = "Customers - Snipitz"
description = "Snipitz is a multi-screen, interactive video platform that allows viewers to watch multiple angles and additional content around sports and entertainment events in a single player. They worked with DigitalOcean and partners Red5Pro and CTO.ai to create a scalable, low-latency video solution."
full_description = "Snipitz is a multi-screen, interactive video platform that allows viewers to watch multiple angles and additional content around sports and entertainment events in a single player, creating a truly customizable experience for live and on demand events. After spending the last few years building the video player and experience, Snipitz had to ensure their solution was highly scalable and production-ready for upcoming events with the Legends of the LPGA in the US and the European Athletics Team Championships in Poland. To prepare, they enlisted the help of DigitalOcean partners Red5 Pro and CTO.ai to deliver streaming video infrastructure at scale. “At Snipitz we always knew that building a first-of-it’s-kind video player wasn’t going to be easy, however, the teams at DigitalOcean, Red5 Pro and CTO.ai were up for the challenge and share the same vision that the marketplace is calling for a reimagination of digital broadcast. “ - Andrew Lombardi, Snipitz Chief Product Officer Snipitz was started in 2020 when the founder, Denny Darmo, was watching television with his family and started thinking about how they could all watch the same thing but experience it in a unique way, jumping from stream to stream seamlessly incorporating different views, commentary, and user-generated content. Denny wanted to be able to provide both a truly individualized viewing experience, and the content producer with data on how different streams were performing. “The first thing that comes to mind when you’re a startup is pricing and flexibility, which is how our development team had landed on DigitalOcean.” - Denny Darmo, Snipitz Founder and CEO The Snipitz video player was built on DigitalOcean from the start at the recommendation of their small development team, but when they signed a contract with the Legends of the LPGA the team knew they needed help ensuring their infrastructure could handle a large event. Snipitz needed to move fast, as they only had a limited amount of time before the first big test of their application, so they turned to DigitalOcean and its partners for help."
