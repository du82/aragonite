["https://digitalocean.com/community/tutorials/using-grep-regular-expressions-to-search-for-text-patterns-in-linux"]
title = "Using Grep & Regular Expressions to Search for Text Patterns in Linux | DigitalOcean"
description = "Grep is a tool used to search for specified patterns within text input using regular expressions. Regular expressions are a system for describing complex te…"
full_description = "The grep command is one of the most useful commands in a Linux terminal environment. The name grep stands for “global regular expression print”. This means that you can use grep to check whether the input it receives matches a specified pattern. This seemingly trivial program is extremely powerful; its ability to sort input based on complex rules makes it a popular link in many command chains. In this tutorial, you will explore the grep command’s options, and then you’ll dive into using regular expressions to do more advanced searching. To follow along with this guide, you will need access to a computer running a Linux-based operating system. This can either be a virtual private server which you’ve connected to with SSH or your local machine. Note that this tutorial was validated using a Linux server running Ubuntu 20.04, but the examples given should work on a computer running any version of any Linux distribution. If you plan to use a remote server to follow this guide, we encourage you to first complete our Initial Server Setup guide. Doing so will set you up with a secure server environment — including a non-root user with sudo privileges and a firewall configured with UFW — which you can use to build your Linux skills. In this tutorial, you’ll use grep to search the GNU General Public License version 3 for various words and phrases. If you’re on an Ubuntu system, you can find the file in the /usr/share/common-licenses folder. Copy it to your home directory: You’ll also use the BSD license file in this tutorial. On Linux, you can copy that to your home directory with the following command: In the most basic form, you use grep to match literal patterns within a text file. This means that if you pass grep a word to search for, it will print out every line in the file containing that word. The first argument, GNU, is the pattern you’re searching for, while the second argument, GPL-3, is the input file you wish to search. By default, grep will search for the exact specified pattern within the input file and return the lines it finds. You can make this behavior more useful though by adding some optional flags to grep."
year_published = 2025
