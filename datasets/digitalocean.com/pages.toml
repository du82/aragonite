["https://digitalocean.com/community/tutorials/digitalocean-s-technical-writing-guidelines"]
title = "DigitalOcean's Technical Writing Guidelines | DigitalOcean"
description = "DigitalOcean is excited to continue building out its collection of technical articles related to server administration and software engineering. To keep the …"
full_description = 'DigitalOcean is excited to continue building out its collection of technical articles related to server administration and software engineering. To ensure that DigitalOcean articles have consistent quality and style, we have developed the following guidelines. To get published quickly, we recommend that you read the Style and Structure sections in their entirety before you begin working on your article. You can use the Formatting section of this guide along with our Markdown previewer and How To Write a Proposal and Outline for a DigitalOcean Community Tutorial as references while writing your article. We have developed article templates in Markdown format you can use as a starting point for your article. We strongly recommend using one of these templates to plan and develop your article. The style for DigitalOcean articles reflects our purpose in publishing them: to provide quality learning information for engineers and developers. We strive to ensure that all DigitalOcean tutorials are: These principles guide authors to create articles, tutorials, and other learning materials that help people solve their problems and grow as developers. Our articles are written to be as clear and detailed as possible without making assumptions about the reader’s background knowledge. We explicitly include every command a reader needs to go from their first SSH connection on a brand new server to the final, working setup. We also provide readers with all of the explanations and background information they need to understand the tutorial. The goal is for our readers to learn the concepts, not just copy and paste code and commands. We avoid words like "simple,” "straightforward,” “easy,” “simply,” “obviously,” and “just,” as these words make assumptions about the reader’s knowledge. While authors use these words to encourage and motivate readers to push through challenging topics, they often have the opposite effect; a reader who hears that something is “easy” may be frustrated when they encounter an issue. Instead, we encourage our readers by providing the explanations they need to be successful.'
