["https://digitalocean.com/community/tutorials/multi-gpu-on-raw-pytorch-with-hugging-faces-accelerate-library"]
title = "Multi-GPU on raw PyTorch with Hugging Face’s Accelerate library | DigitalOcean"
description = "In this article, we examine HuggingFace’s Accelerate library for multi-GPU deep learning. We apply Accelerate with PyTorch and show how it can be used to sim…"
full_description = "Distributed machine learning is complicated, and when combined with deep learning models that are also complex, it can make just getting anything to work into a research project. Add in setting up your GPU hardware and software, and it may become too much to take on. Here we show that Hugging Face’s Accelerate library removes some of the burden of using a distributed setup, while still allowing you to retain all of your original PyTorch code. In order to follow along with this article, you will need experience with Python code, and a beginners understanding of Deep Learning. We will operate under the assumption that all readers have access to sufficiently powerful machines, so they can run the code provided. For instructions on getting started with Python code, we recommend trying this beginners guide to set up your system and preparing to run beginner tutorials. Accelerate is a library from Hugging Face that simplifies turning PyTorch code for a single GPU into code for multiple GPUs, on single or multiple machines. You can read more about Accelerate on their GitHub repository here. With state-of-the-art deep learning at the cutting edge, we may not always be able to avoid complexity in the real data or models, but we can reduce the difficulty in running them on GPUs, and on more than one GPU at once. Several libraries exist to do this, but often they either provide higher-level abstractions that remove fine-grained control from the user, or provide another API interface that needs to be learned first before it can be used. This is what inspired the motivation of Accelerate: to allow users who need to write fully general PyTorch code to be able to do so, while reducing the burden of running such code in a distributed manner. Another key capability provided by the library is that a fixed form of code can be run either distributed or not. This is different from the traditional PyTorch distributed launch that has to be changed to go from one to the other, and back again."
