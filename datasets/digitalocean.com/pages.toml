["https://digitalocean.com/blog/a-conversation-with-afro-sharks-employee-resource-group"]
title = "A conversation with DigitalOcean’s Afro Sharks Employee Resource Group leaders | DigitalOcean"
description = "We spoke to the leaders of DigitalOcean’s newest ERG, the Afro Sharks, about why coming together as a Black community is important and the work they plan to do."
full_description = "At DigitalOcean, we are committed to fostering a welcoming and inclusive place for everyone. As a values-driven organization with love at our core, we want to make sure individuals feel respected, supported, and connected at work. Our Employee Resource Groups (ERGs) are places where communities can come together to find and offer support. We spoke to the leaders of DigitalOcean’s newest ERG, the Afro Sharks, about why coming together as a Black community is important and the work they plan to do. Below is our conversation with Admas Kanyagia, Andrea Evans, Christopher Gibson, Makeissah Robinson, and Thandi Muno. Admas: When I joined late last year, I was so excited to see a company that embraced the values of community and love. I immediately wanted to extend those values by building a community with Black Sharks at DigitalOcean. We put out a call out for interest to convene an Black ERG, and got a great response from the community. So we decided to move ahead, with the leadership of my colleagues here and the support of the company. Christopher: Here at DigitalOcean we’ve successfully launched four ERGs which is great. We saw this as an opportunity to launch our first ethnicity focused ERG. With Afro Sharks we wanted to have a space where we can share our authentic voices. We wanted to have a place to keep evangelizing this both inside and outside of DO which we hope will increase our community as the organization grows. Andrea: Having a space at work where people of color can comfortably express themselves is not something I’ve experienced at other companies I’ve worked for. So I jumped at this opportunity to be able to join people like me at work in this ERG. DigitalOcean has demonstrated that it is a company that is forward-thinking in supporting ERGs like Afro Sharks. ** Christopher**: Social stress on top of all of the other normal stress can be a lot for some. It’s important to have an outlet to speak up, and share your voice where there is a community that will both listen and support you."
year_published = 2025
