["https://digitalocean.com/community/tutorials/how-to-install-and-use-docker-on-ubuntu-20-04"]
title = "How To Install and Use Docker on Ubuntu 20.04 | DigitalOcean"
description = "Master containerized applications with Docker on Ubuntu 20.04. Work effectively with images, containers, and Docker repositories."
full_description = "Docker is an application that simplifies the process of managing application processes in containers. Containers let you run your applications in resource-isolated processes. They’re similar to virtual machines, but containers are more portable, more resource-friendly, and more dependent on the host operating system. For a detailed introduction to the different components of a Docker container, check out The Docker Ecosystem: An Introduction to Common Components. In this tutorial, you’ll install and use Docker Community Edition (CE) on Ubuntu 20.04. You’ll install Docker itself, work with containers and images, and push an image to a Docker Repository. This article will walk you through installing Docker on an Ubuntu server. If you wanted a 1-click way to deploy a Docker application to a live server, take a look at DigitalOcean App Platform. The Docker installation package available in the official Ubuntu repository may not be the latest version. To ensure we get the latest version, we’ll install Docker from the official Docker repository. To do that, we’ll add a new package source, add the GPG key from Docker to ensure the downloads are valid, and then install the package. Notice that docker-ce is not installed, but the candidate for installation is from the Docker repository for Ubuntu 20.04 (focal). Docker should now be installed, the daemon started, and the process enabled to start on boot. Check that it’s running: Installing Docker now gives you not just the Docker service (daemon) but also the docker command line utility, or the Docker client. We’ll explore how to use the docker command later in this tutorial. By default, the docker command can only be run the root user or by a user in the docker group, which is automatically created during Docker’s installation process. If you attempt to run the docker command without prefixing it with sudo or without being in the docker group, you’ll get an output like this: If you want to avoid typing sudo whenever you run the docker command, add your username to the docker group:"
