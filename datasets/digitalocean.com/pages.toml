["https://digitalocean.com/blog/digitalocean-bug-bounty-program"]
title = "Announcing the Public Launch of DigitalOcean’s Paid Bug Bounty Program | DigitalOcean"
description = "DigitalOcean announces the public launch of our paid bug bounty program, inviting security researchers to collaborate in improving platform security with increased bounty rewards and a comprehensive reporting process."
full_description = "Today we are excited to launch DigitalOcean’s paid public bug bounty program, the next step in DigitalOcean’s long history of working with security researchers to identify security bugs on our platform. At DigitalOcean, we believe bug bounties are an indispensable tool for improving our security posture, and look forward to continued collaboration with security researchers in the future. Our current bug bounty program is hosted on Intigriti at: https://app.intigriti.com/programs/digitalocean/digitalocean. Please use this bug bounty program for all vulnerability communications, and make sure to review the program policy and details before submitting a report. If for some reason you cannot report a submission to our bounty program, we also accept messages to security@digitalocean.com, and you can encrypt your messages with age if you feel strongly about doing so. We would prefer not to receive any communications using PGP, but a GPG public key is also provided at this link. Please review the program policy at our bug bounty program above for guidance on valid vs. invalid submissions before sending us a message. Note that we cannot reward bounties for email submissions—to be rewarded, you must submit vulnerabilities through the bug bounty program link. DigitalOcean also receives embargoed security notices from several of our partners. If you are a maintainer of technology used by DigitalOcean and would like to inform us of an issue under embargo, please email us at security@digitalocean.com. A responsible disclosure program is an important facet of a modern company’s security program. These programs provide a safe, structured method for security researchers to report potential issues to a company’s security team without fear of reprisal or legal action, as long as the research follows the company’s safe harbor guidelines. While it’s best to reward researchers for their time, an unpaid program is still a great way to interact with your security-conscious customers and improve your product, as it provides researchers safety in knowing they will not be prosecuted for good faith reports. While there are exceptions, there are typically two types of bug bounty programs: unpaid “vulnerability disclosure programs,” and paid “bug bounty programs.”"
year_published = 2025
