["https://digitalocean.com/pricing/droplets"]
title = "Droplet Pricing | DigitalOcean"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "Deploy Droplets (cloud VMs) in seconds. Run any workload, from mission critical CPU, memory, and storage intensive apps to low traffic sites. View our DigitalOcean Droplet product documentation to learn which Droplet plan is right for you or talk to an expert. Basic Droplets have the most efficient CPU usage at a lower cost for workloads that underuse dedicated threads. They’re ideal for bursty applications that can handle variable levels of CPU. CPU-Optimized Droplets provide a 2:1 ratio of memory to CPU. This configuration with fast (2.6GHz+), dedicated vCPUs is optimal for applications that demand fast, consistent performance such as media streaming, gaming and data analytics. The Premium variant of CPU-Optimized Droplets also provides up to 10Gbps outbound network speeds and NVMe SSDs. General Purpose Droplets have a balanced ratio of memory to dedicated CPU, suitable for a wide variety of production workloads. They’re best for general purpose workloads that require dedicated computer power. The Premium variant of General Purpose Droplets also provides up to 10Gbps outbound network speeds and NVMe SSDs. Memory-optimized Droplets provide 8 GiB RAM for each vCPU. The additional memory can help you avoid excessively swapping to disk or getting out-of-memory errors, both of which significantly impact your application's performance and stability. Memory-Optimized Droplets use NVMe SSDs which deliver better disk performance for workloads that involve a large number of transactions Storage-Optimized Droplets use NVMe (non-volatile memory express), which is an interface protocol explicitly built for modern SSDs. It takes advantage of parallelism to deliver disk performance that can be order of magnitude faster than our regular SSDs. DigitalOcean Droplets are Linux-based virtual machines (VMs) that run on top of virtualized hardware. Each Droplet you create is a new server you can use, either standalone or as part of a larger, cloud-based infrastructure. Choosing the right Droplet plan depends on your workload. Please refer to this article that explains the differences between shared and dedicated CPUs, and goes into detail on each Droplet plan."
