title = "Write for DOnations | DigitalOcean"
description = "Technical tutorials, Q&A, events — This is an inclusive place where developers can find or lend support and discover new ways to contribute to the community."
full_description = "The Write for DOnations program brings together two initiatives: building content to help developers and supporting tech-focused charities and nonprofits. Through the program, community authors help grow DigitalOcean’s library of DevOps, software development, and production systems tutorials—all based on free and open-source software. These authors then receive a personal payout and select a tech-focused charity to receive a donation. Our tutorials help developers at all levels solve problems, answer questions, and do things they couldn’t do before with open-source software. For Write for DOnations, we’re looking for practical guides covering open-source software and Linux/Unix-like systems, including production installations, deployments, containers, and automation. We’re especially interested in: Are you a whiz at setting up SSH keys? Are you the one people come to when they can’t find a file? Is your knowledge of environmental variables the envy of all? Share what you know by submitting a tutorial about system administration. Are you a grep power user? Do you use Rsync to make backups a breeze? Are your systemd service files second to none? Help others reach your level of expertise by proposing a tutorial about Linux tools. Do you make YAML files in Docker Compose that are works of art? Do you excel at keeping your Docker images clean ? Does your Docker monitoring leave no container in the shadows? Give the community the benefit of your experience by writing a tutorial about Docker. Do you have fun configuring firewalls? Is WireGuard part of your standard toolbox? Have you got Suricata on speed dial? Help others secure their installations by submitting a tutorial about security. TIP: Our tutorials focus on providing a series of steps to solve a specific problem. Each step is explained thoroughly so that readers are always aware of what the code or commands do, and gives them enough information that they can adapt the process to their own situations. As an example, check out the tutorial, Initial Server Setup with Ubuntu 20.04. This tutorial features a set of discrete steps. In each step, the reader is directed to take a specific action, which is given in the step title, and the result is described. The emphasis is on what the reader is doing, rather than describing the technology involved."
