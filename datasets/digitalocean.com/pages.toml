["https://digitalocean.com/blog/understanding-seed-funding"]
title = "Startup funding explained: Series A, Series B, Series C | DigitalOcean"
description = "Learn the basics of Series A, Series B, and Series C funding."
full_description = "Startup funding can get confusing. Outside of bootstrapping a startup with founder funds, many early-stage businesses raise funding from a variety of sources. Understanding how to raise early funding is critical. Thirty percent of startups fail due to inadequate funding. Thankfully, there are a wide variety of funding opportunities for growth-hungry startups, including “Series” funding. So, what is Series funding? How does it work? And how do startups maneuver throughout each funding layer? Here’s a guide to Series A, B, and C funding. Seed funding refers to any money a startup raises from external entities — like angels, friends, and incubators. In return for funding, these external entities will want equity in the company. This equity is determined by the investors and is considered the pre-money valuation. In 2020, the median pre-money valuation seed round was $6 million. Most founders can expect to give away at least 10 percent of their startup during the initial seed round. Startups without any cash flow or customers will likely give up more equity. After the initial round of seed funding, many startups grow (or fail) without any further investments. Startups give away a chunk of their equity, and they get some quick cash. But what happens when they need more money to promote growth? Some businesses can thrive on $100,000. Others may need a couple million to even make a tiny splash in their market. Startups will get seeded before they participate in seeding rounds. Initial seed money can come from a variety of places. Friends and family are obvious sources, but other common seed and pre-seed sources include: Once a startup is seeded, it can participate in Series funding rounds to generate additional funding. Series A is the next round of funding after the seed funding. By this point, a startup probably has a working product or service. And it likely has a few employees. Startups can raise an additional round of funding in return for preferred stock. Remember, a startup and any angels it worked with are the current holders of that startup’s stock. When a startup starts Series A, it will sell off more stock in return for extra cash (usually between 10 and 30 percent). Around 1 in 3 startups that make it past the seeding round will successfully raise Series A."
year_published = 2025
