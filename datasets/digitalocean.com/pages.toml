["https://digitalocean.com/currents/may-2023"]
title = "May 2023 | DigitalOcean"
description = "DigitalOcean's May 2023 report on how startups and SMBs are faring today."
full_description = "In our May 2023 edition of DigitalOcean’s research report, Currents, we examined a range of topics impacting small-to-medium businesses, founders, and developers today. Innovation often occurs during economic downturns, and with continuing turmoil in the technology industry, we were interested in looking at how individuals are turning to side jobs and starting new businesses during this time. Are those working in the technology industry increasingly likely to start a small business or have a side job, and how are they looking to grow that business? How do they feel about their current job security? We also examined how new tools such as the rise of ChatGPT and generative AI are impacting businesses already, and looked at ongoing trends in cloud computing. Results for this report came from over 1,600 individual employees, developers, and small business or startup founders who were surveyed from March to April 2023. Side jobs are becoming small businesses: With layoffs and market stagnation top of mind, many employees are becoming solopreneurs who are actively creating businesses outside of their primary employment in order to pursue a passion and professional independence. The goal for a majority of these businesses is to stay small, but scale to a point where it can become the owner’s primary income. There is also evidence that those impacted directly by layoffs are more likely to be starting a new business or scaling their idea than those not impacted by layoffs. Small businesses are weathering the economy: While a third of businesses have made changes to their business due to the current economic conditions, a majority continue to feel positive about their growth and how their business will fare a year from now. Over a quarter plan to raise funds in the next 6 months. AI and ChatGPT are in a widespread testing phase: AI and ChatGPT are catching on quickly, but many companies are still in the testing phase and do not have usage policies put into place. It’s a decisive component that new emerging businesses must consider, and there’s a distinct generational gap when it comes to feelings around AI or machine learning tools. Findings make it clear that AI/ChatGPT usage is growing quicker than its policy formation, and will be a critical aspect for newly forming SMBs to keep in mind."
