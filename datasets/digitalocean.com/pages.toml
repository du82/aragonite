["https://digitalocean.com/blog/day-in-the-live-customer-success-manager"]
title = "A day in the life with DigitalOcean's Customer Success Managers | DigitalOcean"
description = "We get to know DigitalOcean Senior Customer Success Manager Bella Nitonde and how she spends her days helping our customers reach their goals."
full_description = "DigitalOcean’s Customer Success Managers work daily with startups and small-to-medium businesses looking to grow on DigitalOcean. They help troubleshoot issues and better understand our customers and how DigitalOcean can help them achieve their goals. We talked to Senior Customer Success Manager Bella Nitonde to get a sense of what a day in a life of a CSM looks like. A CSM is a strategic partner to the customer and an extension of the customer team within DO. The key to this important role is developing a clear understanding of the customer’s strategic goals, how DigitalOcean fits in their strategy, and their overall business model. The CSM organization works with a couple of cross-functional teams, advocating for the customers and helping them to achieve their desired outcomes. They also share customer feedback on products and missing features. In short, a customer success manager partners with the customer and our internal teams to ensure the customers’ success with DigitalOcean. I start my day with a standup with the team. During the standup we all talk about the things we hope to achieve for the week/day (on Monday we discuss the week). We highlight any issues we might need help with and give updates on any of the projects we are working on. After the standup I action my plan for the day. I prepare customer meetings and presentations for the calls I have for the day and make sure to prep all internal persons who will be joining the calls. After each conversation I make sure to update the notes and log them in our CRM Gainsight. In the afternoon we have our global teamsync where we discuss the full team’s updates. I have a 2 year old dachshund that is my full-time work buddy. He definitely makes sure that I take small breaks in between calls. At lunchtime we have lunch together and then we go to the park for him to have a bit of exercise with his friends. We have really awesome customers. Advocating for them and helping them to succeed on DigitalOcean is really fulfilling. Especially when you help them through a difficult situation."
year_published = 2025
