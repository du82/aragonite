title = "Legal - DMCA Copyright Policy"
description = "Helping millions of developers easily build, test, manage, and scale applications of any size - faster than ever before."
full_description = "DigitalOcean, LLC (“DigitalOcean”) has a simple way to handle copyright issues under the Digital Millennium Copyright Act (“DMCA”). If you think someone is using your content without your permission, follow the steps below to report it. Please use the linked form to issue your DMCA complaint to avoid delays. If you think your copyrighted content is being infringed on DigitalOcean, complete the DMCA Form and include the following information: Identification of the specific copyrighted work claimed to have been infringed including the URL or IP address of the allegedly infringing content. Contact information about the complaining party, including address, telephone number and e-mail address. A statement that the complaining party has a good faith belief that the material is not authorized by the copyright owner, its agent, or the law. A statement made under penalty of perjury that the information provided is accurate and the complaining party is authorized to make the complaint on behalf of the copyright owner. A physical or electronic signature of a person authorized to act on behalf of the owner of the copyright that has been allegedly infringed. Please use the linked DMCA Form to submit your complaint. Using any other method may delay the process. Review: DigitalOcean will check your complaint for completeness and may follow up if additional information is needed. Please note if you do not provide the additional information requested, we may not be able to respond to, or move forward with, your complaint. Forwarding: If the complaint is valid and involves a DigitalOcean customer, we will send your complaint and contact information to the customer using the content. Removing the Content: The customer may simply remove the content once they receive the complaint. If they do so, DigitalOcean will consider the DMCA complaint resolved. If the customer does not remove the content, then DigitalOcean may disable the entire server used by the customer to