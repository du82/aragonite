["https://digitalocean.com/blog/announcing-do-impact"]
title = "Announcing DO Impact | DigitalOcean"
description = "We're pleased to share information around how our new social impact program, DO Impact, will impact communities around the globe and announce our first grantees."
full_description = "A year ago DigitalOcean joined the Pledge 1% movement, committing $50 million to social impact causes. Today, I’m pleased to share additional information about how that commitment will be realized in communities across the globe with the launch of our new social impact program, DO Impact. DigitalOcean’s mission is to simplify cloud computing so that builders can spend more time creating software that changes the world. Our inaugural social impact program, Hollie’s Hub for Good, has already made a difference by providing over 2,000 organizations with infrastructure credits to grow their reach. DO Impact will deepen and expand our commitment to social impact by empowering changemakers around the globe through products and philanthropy, enabling DigitalOcean employees to do good in their communities, and ensuring our footprint is sustainable. We believe that technology can solve the world’s greatest problems, and are excited to support organizations that are making an impact not only in their local communities, but also by providing tools and learnings to the broader social impact ecosystem. From virtual learning platforms for students, to applications that prioritize mental wellness, and organizations building local capacity, we all benefit when organizations have the tools they need. In addition to the infrastructure credits DigitalOcean has already provided to organizations, we’re excited to now provide cash grants that will enable organizations to hire staff and fund new programs. Some of the first grantees of DO Impact include Unicodemy, which empowers girls in Bolivia by teaching them STEM concepts, Project Sitara Foundation, an educational technology organization working with underserved communities in India, and the Federation of Humanitarian Technologists, a network of technologists that maintains open source technologies used for humanitarian crises. We will also encourage DigitalOcean employees to get more involved, both through direct work in their own communities and by providing mentoring to organizations through DO Impact. In 2021, one-third of DigitalOcean employees donated through our matching program or volunteered. We look forward to providing more opportunities for employees to engage with important work through initiatives such as Fast Forward, an accelerator for tech nonprofits."
