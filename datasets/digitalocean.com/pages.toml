full_description = "We’re excited to announce that PostgreSQL 17 is now available on DigitalOcean Managed PostgreSQL. With this latest release, you can take advantage of a wealth of benefits, including better performance, expanded developer tools, enhanced security, observability and management tools, and more. Of course, we’ll continue to handle the maintenance, backups, and scaling for you. Improved performance—PostgreSQL 17 introduces significant enhancements that help to optimize database performance: Reduced memory usage for vacuum operations, making maintenance tasks more efficient and improving overall database health. Indexing improvements that make lookups and data retrieval for applications with large datasets quicker. Expanded Developer Tools—Developers will benefit from several new features that make database management more intuitive and efficient: New constructors and identity functions that simplify the way you define and manage database schema elements. The JSON_TABLE() function, allowing seamless transformation and querying of JSON data within PostgreSQL. Enhanced high availability and replication—For businesses that rely on high uptime and data resilience, PostgreSQL 17 brings key improvements: Failover for logical replication, ensuring smoother transitions in high availability setups and disaster recovery scenarios. Slot preservation during upgrades that reduce downtime and improving data consistency when moving to newer versions. Performance optimizations in replication, providing better synchronization across distributed databases. Advanced security and monitoring—Security and database observability get notable upgrades in this release: Expanded monitoring and analysis tools that open up deeper insights into system health and performance for database administrators. Improvements in auditing features, allowing organizations to more precisely track and log critical database events. With DigitalOcean Managed PostgreSQL, you get the latest innovations without the headaches of manual maintenance. Our fully managed solution includes:"
