title = "Hacktoberfest 2024: Celebrate All Things Open Source! | DigitalOcean"
description = "Hacktoberfest 2024 is just a month away! Join fellow devs and open-source advocates to celebrate all things open source all October long."
full_description = "October’s coming up and you know what that means… Hacktoberfest is coming! Our month-long celebration of all things open source kicks off on October 1! Each year maintainers and contributors come together for Hacktoberfest to contribute to the open-source projects that many companies, including DigitalOcean, and builders of every skill level rely on. In the 11 years since its inception, Hacktoberfest has exploded from a group of just 676 contributors to a global open-source phenomenon, with 98,855 participants last year across 184 countries. That’s a lot of love for open source! Hacktoberfest challenges you to support open-source projects by creating 4 pull/merge requests that are accepted by project maintainers during the month of October. Participants will earn a digital badge—brought to you with love by Holopin!—depicting Hacktoberfest 2024’s mascot, Sloan. The pin is customizable and evolves as your pull/merge requests are accepted. WARNING: Sloan the Sloth is a treasure and you will fall in love with them. Starting today, visit Hacktoberfest.com to get amped about making your contributions, or prepare your project to receive some—then mark your calendar for September 23 when registration opens. The Hacktoberfest website is the place for newcomers and seasoned experts to come explore contributor resources that will help you complete the Hacktoberfest challenge in no time, and there’s also guidance for project maintainers looking to join Hacktoberfest and grab the attention of contributors. Contributing to open-source projects can take many forms. Here are a few ways you can contribute to a project during Hacktoberfest: Use your non-technical skills and experience such as writing, graphic design, and advocacy to support a project One of our most consistent partners-in-open-source Major League Hacking is back again this year, cheerleading open-source maintainers and contributors as ever! We’re partnering with MLH again this year for Global Hack Week, a monthly event series where you can learn new skills, build your portfolio, attend fun sessions, and connect with developers from around the world. Join us for a special Open Source edition of Global Hack Week (timing details to come), complete with live streams, mini-events, and special challenges. Register for free today to join in on the fun with thousands of other developers!"
