esponsibility of Author. Other than the amounts to be paid to Author pursuant to an Exhibit A, Company will not be required to make any payments of any nature for, or in connection with, the acquisition, exercise or exploitation of the rights granted to Company hereunder. Author will be responsible for the payment of all taxes associated with or incurred as a result of the compensation for Services paid by Company."
