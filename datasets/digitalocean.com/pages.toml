title = "DigitalOcean expands backup capabilities with acquisition of SnapShooter | DigitalOcean"
description = "To better enable startups and SMBs to protect their cloud data across files, apps, and databases, we’re excited to announce DigitalOcean’s acquisition of SnapShooter, a backup and recovery solutions provider."
full_description = "Startups and small and medium-sized businesses (SMBs) are continually turning to the cloud to enhance the agility, scalability, and cost-effectiveness of their business–57% reported increased reliance on the cloud in 2022, according to DigitalOcean’s Currents report. However, one concern for many businesses is data disruption due to accidental deletion, tech stack changes, or service disruptions. Losing data can cause revenue loss, reputational damage, and poor customer experience, which are especially harmful to small, growing businesses. To better enable startups and SMBs to protect their cloud data across files, apps, and databases, we’re excited to announce DigitalOcean’s acquisition of SnapShooter, a backup and recovery solutions provider. SnapShooter makes cloud backups simple, fast and flexible, offering one system to consolidate all backups so you can be confident in knowing your cloud data is protected. Here’s what SnapShooter customer Siebird, a web design and digital marketing agency, has to say about their experience: “Siebird has trusted SnapShooter to back up and protect our client websites for over 2.5 years. We host all our client websites on DigitalOcean. From the beginning, SnapShooter stood out from the rest with how effortless it has made configuring backups. We always dreaded setting up new backup jobs–now we don’t. We have peace of mind knowing our client websites are protected and can be restored with a click of a button.” SnapShooter enables users to back up their files, apps, and databases from DigitalOcean and other cloud providers. It also supports popular apps such as Laravel and WordPress, and databases including MongoDB, MySQL, and PostgreSQL. Comprehensive backups can be taken daily, weekly, and monthly from server backups, or up to every 5 minutes for file backup. SnapShooter consolidates backups into a single job that can be easily configured by the user to meet their specific needs, eliminating the need for manual backups. For example, a user running WordPress can back up their application files and also generate a MySQL backup at once."
year_published = 2025
