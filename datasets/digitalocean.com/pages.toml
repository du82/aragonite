["https://digitalocean.com/community/tutorials/how-to-deploy-openai-models-using-llm-cli-on-gpu-droplets"]
title = "How to Use LLM CLI to Deploy the GPT-4o Model on DigitalOcean GPU Droplets | DigitalOcean"
description = "Learn how to deploy and use OpenAI GPT-4o model effortlessly using the LLM CLI on DigitalOcean GPU Droplets."
full_description = "With the rise of large language models (LLMs), it’s becoming more practical to run these Generative AI models on cloud infrastructure. DigitalOcean recently introduced GPU Droplets, which allows developers to run computationally heavy tasks such as training and deploying LLMs efficiently. In this tutorial, you will learn to setup and use the LLM CLI and deploy OpenAI’s GPT-4o model on a DigitalOcean GPU Droplet using the command line. LLM CLI is a command line utility and Python library for interacting with Large Language Models, both via remote APIs and models that can be installed and run on your own machine. 1.Create a New Project - You will need to create a new project from the cloud control panel and tie it to a GPU Droplet. 2.Create a GPU Droplet - Log into your DigitalOcean account, create a new GPU Droplet, and choose AI/ML Ready as the OS. This OS image installs all the necessary NVIDIA GPU Drivers. You can refer to our official documentation on how to create a GPU Droplet. 3.Add an SSH Key for authentication - An SSH key is required to authenticate with the GPU Droplet and by adding the SSH key, you can login to the GPU Droplet from your terminal. 4.Finalize and Create the GPU Droplet - Once all of the above steps are completed, finalize and create a new GPU Droplet. Many LLM models require an API key. These API keys can be provided to this tool using several different mechanisms. In this tutorial since you are deploying OpenAI’s GPT-4o model, you can obtain an API key for OpenAI’s language models from the API keys page on their site. LLM CLI ships with a default plugin for talking to OpenAI’s API. It uses the gpt-3.5-turbo model as the default plugin. You can also install LLM plugins to use models from other providers such as Claude, gpt4all, llama etc, including openly licensed models to directly run on your own computer. You can use the llm install <model-name> command (a thin wrapper around pip install) to install other plugins. First, we will switch from ChatGPT 3.5 (the default) to GPT-4o. You can start interacting with it by querying directly from the command line. For example, ask the model a question like this:"
