["https://digitalocean.com/currents/august-2020"]
title = "August 2020 | DigitalOcean"
description = "A seasonal report on developer trends in the cloud."
full_description = "With our eighth edition of Currents we wanted to shake things up and look at the trends influencing developers at work. We decided to look exclusively at technical leaders and founders at small- and medium-sized businesses (SMBs). We see these organizations as the unsung heroes of the global economy as the size and scale of their output dwarves even the world’s largest companies. Collectively, SMBs represent close to 90% of all registered businesses and employ half of the world’s workforce. Despite their large footprint, when it comes to cloud services, SMBs remain underserved relative to their enterprise counterparts. They often face unique technical challenges and constraints when it comes to deploying new technology, yet there’s comparatively little focus on this relative to larger organizations. Our original goal was to understand what’s most important to SMBs, where their unique challenges lie, and what’s keeping them up at night. But then the world changed, and SMBs became among those hardest hit by the economic impacts of COVID-19. The resulting report includes responses from 500 founders and technology decision-makers at small and medium tech companies (under 1,000 employees), collected in June 2020. Their responses provide unique insight into larger technical challenges, but also how business processes are changing in light of COVID-19. Just over half (51%) of all survey respondents were founders or cofounders of their companies, while the remainder were technical decision makers. Here’s a look at what’s most important to SMB founders, 88% of whom indicated that they had launched their first companies. Eighty-eight percent of founders indicated their current company is the first they’ve started. Of the 85% of startups with a dedicated IT team, 82% have IT teams of at least four members or more. Among founders who do not have a dedicated IT team, 86% manage IT themselves. IT security is a top priority for the majority of small and medium businesses: 59% rank it as their top priority, while 91% rank it among their top three priorities. It also accounts for a large percentage of company spending, with nearly a quarter (23%) of respondents saying that more than half their company’s budget goes toward IT security."
