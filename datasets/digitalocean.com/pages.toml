full_description = "A must-have for production apps, Load Balancers spread traffic across your compute resources to improve availability, performance, and scalability. We accept Visa, Mastercard, American Express, Discover, PayPal, Google Pay, and Apple Pay. Apple pay requires a Safari browser. For additional payment options, including wire transfer, purchase orders, and ACH, please contact us. Note that when you add a card, we may send a temporary pre-authorization request to the issuing bank. This pre-authorization charge is immediately released by DigitalOcean but may take a few days to clear from your card depending on the bank. DigitalOcean billing cycles are monthly. Typically, on the first day of each month we invoice and automatically charge your account's primary payment method for the previous month's usage. In some cases, we might charge if your usage exceeds a threshold. You can also login and self pay the balance at any time. No. Your card is only charged at the end of the billing cycle or upon exceeding a usage threshold. Pre-authorization charge: When you add a card, we may send a preauthorization request to the issuing bank. This is to verify that the card being added has been issued by the bank and that they will authorize any charges in future. These temporary pre-authorizations are typically $1 but can vary in range and are immediately canceled by us. Depending on your bank, it might take a few days for the charge to clear from the card. We're required by law to apply taxes in some countries. Click here to learn whether we collect taxes in your country, what the tax rate is, etc. Check out the docs to learn how to destroy Droplets, Kubernetes clusters, Managed Databases clusters (PostgreSQL, MySQL, Caching), Spaces, Volumes , Firewalls , and Load Balancers. Yes, you can set up billing alerts and we will email you if the monthly spending exceeds an amount you specify. Your card will be charged only after you have utilized the free credits. For example, if you received a $200 credit for 60 days, then that $200 credit is automatically applied to your account. If you spend $25 in that timeframe, then your card will not be charged. If you spend $300, then the $200 credit would be fully utilized and your card will be charged only $100. Since the credit is valid for 60 days, you won't be able to use any remaining credit after 60 days."
