["https://www.digitalprivatevault.com/blogs/how-to-turn-on-find-my-iphone"]
title = "How to Turn on Find My iPhone -Locate & Protect Your Missing Device"
description = "Did you skip a heartbeat when you didn't feel the phone in your pocket? It's time to know how to turn on Find My iPhone & also ways to track your iPhone."
full_description = "Smartphones — these gadgets nowadays are more than just a mode of communication. They are powerful palm-sized beasts that can perform varied tasks ranging from sophisticated photography, gaming to productive work. And the fact that they are with us everywhere — on the commute, on the desk while working, next to our meals and bed — shows how close they are knitted in our lives. But what if your phone goes missing, stolen, lost or is out of sight just for a few moments? It’s apparent to skip a heartbeat. However, if you are an iPhone user, Apple’s got your back with the Find My iPhone feature. This article discusses the steps you need to turn on Find My iPhone on your device and use it to track and retrieve your device. But furst let’s understand how does it work. Find My iPhone is a tool to find missing or stolen Apple devices. It is preinstalled on iPhone and iPad and can help you to locate the range of devices including iPhone, iPad, iPod touch, Mac, Apple Watch and even AirPods. All you need is to sign in to iCloud.com or launch Find My iPhone app and you’ll see the location of your devices on the map. Once located you have the option to take three actions: Play sound, enable lost mode or erase the data. Play Sound – This is a handy option if your device goes missing or is misplaced in the house. Once you select this option, your respective device will play a loud dinging tone. This feature works even if your phone is on silent or vibrate mode. Lost Mode – In case your device is lost, you can set up to display a phone number on the screen. You can also draw attention to the device using the play sound feature and when someone finds your device, they can call on the displayed number. Erase – Erase option enables deleting the entire data on your iPhone remotely. You can use this option when you are unable to retrieve your device and want to protect your data. Now once Find My iPhone is enabled on your device you can locate it in case it gets stolen or missing. Once you enable and turned it on, your paired Airpods and Apple Watch gets set up automatically."
