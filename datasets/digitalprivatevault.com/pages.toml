rom Personal Data by excluding information (such as your name) that make the data personally identifiable to you. When you use our VPN Service, we may also collect Anonymous Data regarding your aggregate bandwidth usage. We use Anonymous Data to analyze request and usage patterns so that we may improve our Service and for billing, network operations, and support purposes. We reserve the right to use Anonymous Data for any purpose and disclose Anonymous Data to third parties in our sole discretion.'
