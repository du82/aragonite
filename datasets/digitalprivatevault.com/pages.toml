description = 'Who we are Our website address is: http://localhost/privtevault. What personal data we collect and why we collect it Comments When visitors leave comments on the site we collect the data shown in the comments form, and also the visitor’s IP address and browser user agent string to help spam detection. An anonymized string created from … Continue reading "Privacy Policy"'
