["https://www.digitalprivatevault.com/blogs/forgot-iphone-passcode-steps-to-reset-or-unlock-the-iphone-password"]
title = "Forgot iPhone Passcode? Steps to Unlock or Reset the iPhone Password"
description = "Here’s our step-by-step guide for what to do when you’ve forgot iPhone passcode. You can use this for iPhone 5,6,7,8 and above."
full_description = "You tried your best to recall the passcode. You also tried entering the possible combinations to unlock. But each attempt — only takes you closer and closer to the doom of disabling your iPhone. Whether you have recently changed your iPhone’s passcode and before getting used to it — you forgot the passcode! Or maybe your memory just gave up on the nexus of numbers — that you purposely made more complex for extra security. Whatever the reason is, we know you’re locked out of your iPhone and this article will help you to reset your passcode. We hope you have backed up your data because to reset iPhone’s passcode, first you’ll need to erase the phone’s data. And that’s the only option — erase the entire data, including your passcode and set up a new one. This might sound like a big step but it is intended to secure your personal data in case your iPhone is stolen. (Someone is highly vigilant in security measures.) Anyways, if you have recently backed up your data on iCloud or locally in iTunes, this won’t be an issue for you. You’ll restore all the data since your last backup. If you have previously used iTunes to sync and back up your data, you can easily erase the data on your phone and restore it. Here’s how. You’ll immediately have the backup data and settings on your phone and later — the apps, movies, purchased music and photos will begin to download. To put your phone into recovery mode, you’ll need to connect your iPhone with your computer or Mac and launch iTunes. Now, press this combination of buttons on your respective devices. Side note: You need to hold the power button all the way till Recover Mode screen, don’t release it when the Apple logo appears. Once you have put the phone on the recovery mode, you’ll get a popup with options ‘Restore’ or ‘Update’. Choose the Restore option and the relevant software will be downloaded. Once done your iPhone will be restored to factory settings. Remember, when iOS is being reinstalled, your device might exit the recovery mode. If this happens, follow Step 1 to put your phone on recovery mode."
