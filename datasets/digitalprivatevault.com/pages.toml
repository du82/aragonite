["https://www.digitalprivatevault.com/blogs/list-of-most-common-passwords-at-risk-of-being-hacked-is-your-one-of-them"]
title = "List of Most Common Passwords at Risk of Being Hacked: Watch out yours"
description = "Using the traditional advice on settingup password is always a good practice. Suggestions to make your password secure and list of most common passwords"
full_description = "Here’s the issue. We all know passwords have significant importance. They are the key to access our digital information. And a strong password is a sine qua non in this digital world. But even then, when it comes to setting up these passwords — we snub the system’s warnings and create something that’s easy to guess and easy to crack-most common passwords — first name, first six natural numbers, name of a favorite band or favorite football team. And this is an open invitation to a malicious intruder — to break-in and exploit our sensitive information. Always create a strong password and you can hide it in a vault app which keeps a secure note. UK’s National Cyber Security Centre (NCSC) conducted a survey to analyze the accounts whose passwords were compromised. The survey revealed some of the most common passwords that include names of the fictional characters, some popular first names and even names of rock bands and famous rappers. The undisputed winner of the most common and guessable password was “123456” with 23.2 million accounts using it. It was followed by “123456789” which was used by 7.7 million users and “qwtery” being third most common with 3.8 million users. DC’s “Superman” toped in the fictional character category of the most common passwords while even “Batman” made in the top five. Thousands of frenzy football fans used the name of their favorite football clubs Liverpool being the most popular. Here’s the entire list of most common and vulnerable passwords. “12345678”, “abc123”, “Password1” and “12345” made it in top 10 while “iloveyou”, “monkey” and “dragons” were in top 20. The survey also revealed some more interesting stats. 89% of the people use the internet to make online purchases out of which 39% use it on a weekly basis. While only 15% said that they know enough about cybersecurity and can protect themselves from malicious online activity. Dr. Ian Levy, NCSC Technical Director, advice to get creative and use hard-to-guess passwords. Also, a combination of three random but memorable words makes the password strong and less vulnerable."
