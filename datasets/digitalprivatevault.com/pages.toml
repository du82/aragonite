["https://www.digitalprivatevault.com/blogs/what-to-do-if-you-click-on-a-phishing-link"]
title = "What to Do If You Click on a Phishing Link - 4 Steps to Minimize Impact"
description = "How to save yourself from phishing attacks and what to do if you click on phishing link? This article discusses all you need to save yourself from phishing."
full_description = "Have you fallen into a phishing trap? Wondering what to do after clicking on a phishing link? Here, follow these steps to minimize impact and save yourself from these pernicious attacks. Phishing is so common these days that it contributes a massive one-third part of the overall data breaches. And the reason why it’s so prevalent and successful is that — it exploits the hard-wired human instinct of trust, fear and carelessness. Just a little bit of trickery, manipulation and some digital sleight, voila — the victim is easily outwitted to handover sensitive information. Even your email inbox right now might have swamped with phishing emails. And on a bad day, before you could realize, you might fall into the pernicious phishing trap. So what to do if you click on a phishing link? Here, take these steps right away. The first thing that you must do is to disconnect your device from the internet. If the device is connected to the internet via ethernet wire — unplug it. While if you are connected through the WiFi, disconnect it or even power off the router. This will prevent the malware from spreading to the other devices connected to your network. In the wake of the phishing attack, your data is prone to get destroyed or deleted. So once you disconnect your device from the internet, the first thing you must do is back up your important files — personal files, photos, videos and important documents. You can backup your data on external drives, thumb drive or SD cards. However, it’s always a good practice to regularly backup your important data. This ensures in case the primary source gets corrupted or faces some technical issues or cyber attacks like these, you’ll a copy of your files. While now you have backed up your data, it’s time to perform a system scan. As per research by Avana, a cloud security platform, 51% of phishing attacks contain links to malware. This malicious software can then be used to steal data or monitor your activities. Thus, you need to perform a system scan to check and remove the malicious software injected through the phishing link."
