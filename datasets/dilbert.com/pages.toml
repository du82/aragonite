full_description = "Disgraced and canceled cartoonist Scott Adams has moved his work and upgraded it to a spicier version entitled Dilbert Reborn. Dilbert Reborn daily by subscription (a spicier version of Dilbert) plus the digital version of the Daily Dilbert calendar. Dilbert Reborn (spicier version), Selected oldies, the new Robots Read News comic, usually two livestreams per day, Micro Lessons on success, and lots of politics. For now, the older Dilbert comics are not available. I plan to build an AI interface so you can search by any criteria. Probably by late summer 2024. I don't have a system for licensing Dilbert comics for now. If you are a subscriber on Locals to the new Dilbert Reborn comics, or you subscribe to on the X platform, you have automatic permission to use (a few) older Dilbert comics for your internal business meetings. But don't turn them into marketing materials and don't start republishing them regularly, please. And be careful about using the Dilbert Reborn comics. Those are too spicy for the general public. I don't recommend trying to use Dilbert for any marketing or book illustration purposes. It is currently too controversial for that. There is no paper version of the 2024 Dilbert calendar but a 2025 edition is available now at https://shopdilbert.online Subscribers to Dilbert Reborn on X and on Locals see a digital version of the 2024 calendar for no extra cost. Most of my backlist books were cancelled, but my new book, Reframe Your Brain and the 2nd Edition of How to Fail at Almost Everything and Still Win Big are for sale at If you look into the context, the point that got me cancelled is that CRT, DEI and ESG all have in common the framing that White Americans are historically the oppressors and Black Americans have been oppressed, and it continues to this day. I recommended staying away from any group of Americans that identifies your group as the bad guys, because that puts a target on your back. I was speaking hyperbolically, of course, because we Americans don't have an option of staying away from each other. But it did get a lot of attention, as I hoped. (More than I planned, actually.)"
