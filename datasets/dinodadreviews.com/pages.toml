["https://dinodadreviews.com/2025/01/26/tyrannosaurus-rex-a-pop-up-guide-to-anatomy"]
title = "Tyrannosaurus rex: A Pop-Up Guide to Anatomy – Dino Dad Reviews"
description = "An excellent pop-up “dissection” of a T. rex."
full_description = "Tyrannosaurus rex: A Pop-Up Guide to Anatomy January 26, 2025 Dino Dad Reviews Pop Up Books 2 comments Dougal Dixon is an author that needs little introduction to a certain brand of science nerd. He is perhaps best known for his speculative evolution books, but he has also authored numerous books on prehistoric life as well (including When the Whales Walked, which I’ve reviewed before). Tyrannosaurus rex: A Pop-Up Guide to Anatomy is another excellent book from Dixon, made all the better by the artwork of Rachel Caldwell. Gorgeously illustrated with intricate pop-up displays, this book is a real treat to peruse. Two sides to the T. rex’s head, one fleshed and the other defleshed. Flaps on the fleshy side allow the reader to dissect some of the facial features of the T. rex. The book is presented as though it is the official report on the dissection of a Tyrannosaurus cadavar, not unlike the National Geographic TV special T. Rex Autopsy. Flaps on the pop-up pieces allow readers to perform variousstages of the “dissection”, pulling away sections of cardboard “flesh” layer by layer. The process moves down the length of the body, going from the head, to the abdomen, and finishing with the legs and tail. The creators of this book use what we can glean from muscle attachment sites and other anatomical information to flesh out the T. rex, fully restoring it to the best of scientific knowledge. The book isn’t afraid to go into detail about the various organs and body parts. This goes for more complex parts like the set of unidirectional air sacs in its bird-like respiratory system is highlighted, or simpler bits like what the orientation of the pelvis can tell us about the size of the intestines. This is a fantastic book overall. Some of the Rex illustrations occasionally look a little Jurassic-Park-ish, but it doesn’t detract from the overall look of the book. I highly recommend Tyrannosaurus rex: A Pop-Up Guide to Anatomy. With extensive information and even more detailed artwork, this book is both highly engaging and highly educational. I am quite satisfied in giving it my Dino Dad Stomp of Approval. For other pop-up books I’ve reviewed, check out Prehistoric Pets, Encyclopedia Prehistorica Dinosaurs, Sharks and Other Sea Monsters, Jurassic World: The Ultimate Pop-Up Book, and Dino World: A 3-D Prehistoric Dinosaur Pop-Up Book. Share this:TwitterFacebookLike Loading... Related dinosaurdinosaurspaleontologybooksdinoT. rexT-rexTyrannosaurustyrannosaurscomparitive anatomypop up bookpop upDougal Dixonanatomy Post navigation Previous Post: Alaska Dinosaurs, Mammoths, and MoreNext Post: A Dinosaur A Day"
