["https://dinodadreviews.com/2024/11/24/when-sue-found-sue"]
title = "When Sue Found Sue – Dino Dad Reviews"
description = "The story of how Sue Hendrickson discovered her T. rex."
full_description = "When Sue Found Sue November 24, 2024 Dino Dad Reviews paleontology, Science History, women in STEM Leave a comment Among the many women in paleontology that have been featured in books I’ve reviewed, there’s one significant individual I have not yet covered. I am pleased therefore to have finally acquired a copy of When Sue Found Sue, the story of how Sue Hendrickson discovered Sue the T. rex. I appreciate the serendipity of Sue Hendrickson growing up visiting the same museum that Sue the T. rex would eventually end up in. Sue the Tyrannosaurus (also featured in Ted Rechlin’s SUE) hardly needs any introduction. With over 90% of the skeleton accounted for, this specimen is the most complete Tyrannosaurus ever found. The fierce legal battle and exorbitant auction price associated with the skeleton has only added to the superstar’s fame. Rather less known is the skeleton’s namesake, Sue Hendrickson. This book aims to introduce children to her, starting with her childhood, and recounting her most famous discovery. Author Toni Buzzeo tells the story in simple but well-written language, making it easy for children to follow. I appreciate how the book emphasizes that Sue was a shy & quiet, but curious, child. As someone with a similar personality type, I can’t help but identify with her to a certain extent, and I’m sure other shy children will, as well. Diana Sudyka’s illustrations have a soft, child-friendly feel to them. The dinosaur illustrations aren’t exactly rigorous, but they don’t need to be in this case. The illustrations work well for the story being told, and contribute to the approachable feel of the book. I recommend When Sue Found Sue for any young, budding paleontology enthusiasts. Sue’s story will doubtless inspire plenty of children, giving them a role model they can relate to, especially if they are the quieter, shyer type. For another famous individual who discovered the very first T. rex, check out my review of Barnum’s Bones. For more women in paleontology, check out my reviews of Daring to Dig and She Found Fossils. Happy reading! Share this:TwitterFacebookLike Loading... Related bookschildrenchildren's bookdinodinosaurdinosaurshistorykidskids bookspaleontologyreviewSue the T. rexT. rextyrannosaursTyrannosaurusTyrannosaurus Sue Post navigation Previous Post: Speed Thief: Volume 1Next Post: Dinosaur Explorers"
