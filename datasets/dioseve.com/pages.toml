を生じるものとします。 第7条（アクセス解析） 当サイトは、第三者配信の広告サービス「Google アナリティクス」を利用しています。広告配信事業者は、利用者の興味に応じた広告を表示するためにCookie（クッキー）を使用することがあります。これによって利用者のブラウザを識別できるようになりますが、個人を特定するものではありません。Cookie（クッキー）を無効にする方法や「Google アナリティクス」に関する詳細は、https://policies.google.com/technologies/ads?gl=jp をご覧ください。 第8条（お問い合わせ窓口） ご意見、ご質問、苦情のお申出その他個人情報の取扱いに関するお問い合わせは、下記の窓口までお願いいたします。 〒136-0082 東京都江東区新木場1-17-8 三井リンクラボ2 223号室株式会社Dioseve（ディオシーヴ）個人情報取扱責任者：岸田 和真 個人情報保護方針に同意します。 表示されている文字を入力してください↓"
