title = "MEMBERS Archive - 株式会社Dioseve(ディオシーヴ)"
full_description = "MEMBER Representative Director & CEO Kazuma Kishida Graduated from Waseda University, and began a career in M&A advisory at the U.S.-based investment bank Houlihan Lokey. Co-founded Dioseve, Inc. in 2021 and currently serves as the company’s Representative Director. Principal Scientist Yasunari Seita Ph.D. Obtained a Doctorate degree from Azabu University, and worked as a researcher at the Child Health Institute of New Jersey, Shiga University of Medical Science, and University of Pennsylvania. Joined Dioseve in 2023 Director at Product Development Goich Yanai Ph.D. Received a Ph.D. in Medicine from the Institute for Frontier Life and Medical Sciences at Kyoto University. Subsequently engaged in process development, manufacturing, and medical affairs of cell products at biotech ventures and pharmaceutical companies. Has held the current position since 2024. Senior Scientist Kasane Kishi DVM, Ph.D. Obtained a Doctorate degree from the Graduate School of Agricultural and Life Sciences, The University of Tokyo in 2018 and worked as a pharmacologist in Astellas Pharma Inc. Joined Dioseve as Senior Scientist in 2023 External Advisor Yoshinori Shinoki Graduated from the Department of Biopharmaceuticals, Kyoto Pharmaceutical University. Launched the Clinical Development Department at Eli Lilly Japan and Parexel International, and since 2015, General Manager of JConsulting Management Department. External Advisor Nobuhiko Suganuma M.D., Ph.D. Professor Emeritus of Kyoto Univ. since 2018. Graduated from the Graduate School of Medicine, School of Medicine, Nagoya University. Director of Japan Society of Fertilization and Implantation. Director of Japan Society of Assisted Reproduction. Board Chairman of Japan Society for Uterus Transplantation. External Advisor Nobuhiro Noro Ph.D. Obtained the degree of Ph.D. at the Faculty of Science, Kyoto University, engaged in several research areas such as neurobiology and celular biology. Joined GlaxoSmithKline Co., Ltd. in 1997 and worked in drug discovery and late phase clinical development. Appointed as an corporate officer of the company in 2011. Appointed as the Chief Scientific Officer of Bonac Corporation in 2021, engaged in the research & development in nucleic acid medicine and corporate management."
