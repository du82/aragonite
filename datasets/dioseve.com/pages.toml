title = "CAREER アーカイブ - 株式会社Dioseve(ディオシーヴ)"
full_description = "CAREER ご応募ありがとうございます。書類を確認のうえ、選考通過された方へのみ１週間以内にご連絡いたします。 Principal Scientist 仕事内容 弊社の研究チームのリーダーとなり、Senior Scientist、Scientist、Research Associateとともに研究を進め、その統括を行なって頂きます。 CSOである浜崎とのディスカッションを定期的に行ない、弊社の研究方針に沿った戦略や目標を立てて頂きます。 その戦略や目標を達成するための実験の他に、主に研究員のマネジメント、研究指導などのサポートをして頂きます。 得られた研究データの取りまとめや、そのデータをもとにした資料作成、論文作成を行なって頂きます。 共同研究先とのディスカッションやプロジェクトマネジメントを行い、研究部門を推進して頂きます。 応募資格 – 必須 – 生殖細胞に関する研究経験を持ち、製薬企業でのマネジメント経験またはアカデミアで助教相当の研究経験を有する方 分子生物学、細胞生物学、遺伝子工学の領域での豊富な研究経験（特に多能性幹細胞の取扱い、分化誘導、FACS、RT-PCRなどのご経験歓迎） 研究の指導経験（後輩、部下、学生の研究指導ならびにタイムラインマネジメント経験） ビジネスレベルの英語力（研究者として英語圏への海外駐在経験歓迎） – 歓迎 – 民間企業で再生医療に関する研究経験のある方 生殖領域（特に卵細胞）に関する知見のある方 勤務地 東京（熊本ラボへの出張あり） 給与 月給：575,000円 – 1,200,000円(みなし残業45時間/月)、賞与あり 賞与あり、ストックオプション付与も検討可能 休暇・休日 休日：土日祝日（作業内容に応じて土日出勤/平日休暇など自由に設定可能） 年間13日の有給休暇付与 (半年後付与、就業年数に応じて増加) APPLY Senior Scientist / Scientist 仕事内容 Chief Science Officer や Principal Scientistとディスカッションを行いながら弊社の研究方針に沿った研究を他の研究メンバーとともに実施 研究全体を把握するために、社内の別テーマ担当者と進捗状況を共有し、ディスカッション 研究を進めるにあたって必要な情報を論文等から収集 テクニカルスタッフへの指示出し 得られた研究データのまとめや、そのデータをもとにした資料作成 応募資格 – 必須 – 医薬獣生農学領域の博士号をお持ちの方 分子細胞生物学、生化学、遺伝子工学、発生生物学、ゲノミクス、ハイスループットアッセイのいずれかの領域での豊富な研究経験のある方 一人、またはチームで研究の企画、推進、データ考察ができる方 英語での簡単なディスカッションに抵抗の無い方（流暢である必要はありません） ※ラボに外国人メンバーがおり、英語でのコミュニケーションが発生します – 歓迎 – 生殖細胞、卵巣/精巣における支持細胞、もしくは減数分裂に関する研究経験のある方 多能性幹細胞（ES/iPS細胞）の取扱い、分化誘導、FACS、RT-PCRなどのご経験のある方（遺伝子工学が得意な方） 民間企業での創薬や再生医療における研究経験のある方 ビジネスレベルの英語力や、研究者として英語圏への海外駐在経験のある方 勤務地 東京ラボ（新木場） 給与 月給：350,000円 – 640,000円(みなし残業45時間/月)、賞与あり 休暇・休日 休日：土日祝日（作業内容に応じて土日出勤/平日休暇など自由に設定可能） 年間13日の有給休暇付与 (半年後付与、就業年数に応じて増加) APPLY Research Associate 仕事内容 Scientific Director、Senior Scientist、Scientistとディスカッションを行いながら、弊社の研究方針に沿った研究に従事 実験サンプルの作成をはじめとする実験実務 試薬、器具等の管理や整備などのラボマネジメント その他、研究周辺業務 応募資格 – 必須 – 医歯薬獣理農水学領域の学部卒または専門学校卒以上の方 動物細胞培養経験、大腸菌の形質転換、RT-PCRなどを用いた研究実務経験のある方 英語での研究に関する指示報告、簡単な日常会話のできる方 ※一緒に研究していただくサイエンティストが外国人の方となります – 歓迎 – 民間企業での創薬や再生医療における研究経験のある方 多能性幹細胞（ES/iPS細胞）の取扱い経験のある方 生殖領域（特に卵細胞）に関する知見のある方 ビジネスレベルの英語力や、研究者として英語圏への海外駐在経験のある方 修士号、博士号をお持ちの方 勤務地 東京ラボ 給与 月給：250,000円 – 400,000円(みなし残業20時間/月)、賞与あり 休暇・休日 休日：土日祝日（作業内容に応じて土日出勤/平日休暇など自由に設定可能） 年間13日の有給休暇付与 (半年後付与、就業年数に応じて増加) APPLY QC/QA担当 【採用目的】 細胞製品のQC及びQA業務をラボベースからリードできる人材の確保のため。 本ポジションでは、細胞製品の品質管理および品質保証業務を担当していただきます。 【採用背景及び業務内容】 当社はiPS 細胞を利用した生殖補助医療の開発に取り組む会社です。現在はiPS細胞から卵巣内細胞を分化誘導する技術を用いて、体外受精の成功率を大幅に向上させるだけでなく、投薬の負担を軽減させる治療法を開発しています。 現在臨床研究にフェーズが移行しており、今後はCDMO含め外部機関や規制当局とのやりとりが増加することが想定され、そこで弊社としてはGMPに準拠した製品供給体制を強化するため、当該パイプラインの開発に関連したQC/QA部門をリードできる人材を募集しています。 応募者様のキャリア構築を踏まえいずれはプロジェクト全体のマネジメントや海外を含めたCMOやCDMOとの外部リソースに対するマネジメントなどQC/QAを超えた業務推進もお任せしたいと考えております。 【必須要件（以下すべて必要）】 ・GMP、GQPに関する知識 【要歓迎】 ・バイオ系大学修了 ・製薬企業でのバイオ医薬品、細胞製品、再生医療等製品のQCまたはQA業務の経験（3年以上） ・細胞培養や微生物試験の基本的な知識・経験 ・文書作成およびデータ管理能力 ・アカデミア経験のみ不可 ・フローサイトメトリー、qPCR、HPLCなどの分析機器の使用経験 ・QC/QA業務に関するバリデーション経験 ・再生医療等製品に関する国内外の規制（FDA, EMA, PMDA）に関する知識 ・CDMOでの業務経験 ・CPCでの業務経験 【言語】 ・日本語ネイティブ必須 ・英語による関連技術文書の読解・作成力 【勤務地】 東京（新木場） リモート勤務可（週3日以上は出社） 注：CDMO等の社外との折衝のために出張があります。 【処遇】 ・月給と賞与の金額はオファー時に詳細を通知いたします。 ・前職の年収も考慮致します。 ・賞与： 年 2 回 ( 昨年実績： あり ) ・ストックオプション付与（適用条件あり） APPLY CMC製造担当 【採用目的】 細胞製品のプロセス開発及び臨床製造をラボベースからリードできる人材の確保 【採用背景及び業務内容】 当社はiPS 細胞を利用した生殖補助医療の開発に取り組む会社です。現在はiPS細胞から卵巣内細胞を分化誘導する技術を用いて、体外受精の成功率を大幅に向上させるだけでなく、投薬の負担を軽減させる治療法を開発しています。 現在臨床研究にフェーズが移行しており、今後はCDMO含め外部機関や規制当局とのやりとりが増加することが想定され、そこで弊社としては当該パイプラインの開発に関連したCMC業務を担当できる人材を募集しています。 応募者様のキャリア構築を踏まえいずれはプロジェクト全体のマネジメントや海外を含めたCMOやCDMOとの外部リソースに対するマネジメントなどCMC全般の推進もお任せしたいと考えております。 【必須要件（以下すべて必要）】 ・バイオ系大学修了 ・企業経験３年以上 ・企業において1年以上のバイオ医薬品、細胞製品、再生医療等製品を取り扱ったプロセス開発/製造/CMC部門での経験 ・GMP、cGMPなど日本国内だけでなく海外も含めた関連法規・規制への理解 ・ＳＯＰなどの文書作成能力・経験 ・アカデミア経験のみ不可 【要歓迎】 ・生殖医療経験 ・CMC薬事業務の経験・知識 ・医薬品・治療薬の製造・試験・品質保証の業務経験 ・iPS、ES、MSCなどの幹細胞を用いた目的細胞への分化誘導経 ・CDMOでの業務経験 ・CPCでの業務経験 【言語】 ・日本語ネイティブ必須 ・英語による関連技術文書の読解・作成力 【勤務地】 東京（新木場） リモート勤務可 (週3日以上は出社） 注：細胞を取り扱うのでラボワークや不定期に週末・休日出勤があります。またCDMOとの折衝のために出張があります。 【処遇】 ・月給と賞与の金額はオファー時に詳細を通知いたします。 ・前職の年収も考慮致します。 ・賞与： 年 2 回 ( 昨年実績： あり ) ・ストックオプション付与（適用条件あり） APPLY 開発担当 【採用目的】 細胞製品上市のために開発をリードできる人材の確保のため。 本ポジションでは、細胞製品の臨床開発やプロジェクトマネジメント業務を担当していただきます 【採用背景及び業務内容】 当社はiPS 細胞を利