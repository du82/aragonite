full_description = "CONTACT Thank you for your inquiry. We will get back to you within one week regarding matters we are able to address. Japan Company Name Affiliation Your Name Phone number E-mail Inquiry Details Privacy policy. The Company recognises the importance of protecting personal data and has established a policy for the protection of personal data and is committed to the appropriate protection of personal data.The basic principles regarding the collection and use of personal information, management methods and effective means of education, training and auditing are stipulated and implemented as follows. Article 1 (Personal information) The term 'personal information' refers to 'personal information' as defined in the Act on the Protection of Personal Information (Act No. 57 of 2003, hereinafter referred to as the 'Personal Information Protection Act'). It refers to information relating to a living individual that can be used to identify a specific individual by name, date of birth or other description or that contains a personal identification code. Article 2 (Acquisition and use of personal information) We will acquire and use your personal information to the extent necessary for the following purposes.If we use your personal information beyond the scope of the following purposes, we will obtain your prior consent in an appropriate manner. To respond to enquiries.To inform you of the date and time of the interview and the results of the selection process.To analyse information such as browsing and purchase history obtained and send information by email on new functions, updates and campaigns of the services used by the user in order to inform the user of new products and services.To contact the user as necessary, e.g. for maintenance ofservices.To identify users who have violated the Terms of Use or used services for other unauthorised and unreasonable purposes, and to refuse their use of services.The purpose of use of personal information shall only be changed if the relevance before and after the change is deemed reasonable.In the event of a change to the purpose of use of personal information, the User shall be notified of the change by the method prescribed by the Company, which shall also be made public on the website. Article 3 (Management and protection of personal information) Personal data shall be strictly managed and shall not be disclosed or provided to third parties without the consent of the user, except in the following cases. In consideration of safety, measures are taken to prevent and correct risks such as unauthorised access to personal information, loss, destruction, falsification and leakage of personal information. Where it is necessary for the protection of a person's life, body or property and it is difficult to obtain the consent of the person concerned.Where it is particularly necessary for the improvement of public health or the promotion of the sound development of children and it is difficult to obtain the consent of the person concerned.Where it is necessary to cooperate with a state body, a local authority or an individual or entity entrusted by one in executing the affairs prescribed by law, and where obtaining the consent of the person is likely to impede the execution of the affairs concerned.Where the handling of personal information is outsourced in whole or in part to the extent necessary to achieve the purpose of use, in order to facilitate the smooth performance of business operations.Where personal information is provided as a result of the succession of business due to merger or other reasons.Where otherwise permitted by law. Article 4 (Joint use) The Company shall not provide or entrust personal data to third parties without the prior consent of the individual, except to the extent necessary to achieve the purpose of use or in the cases described in (1) to (6) of the preceding paragraph. Article 5 (Disclosure of personal information) If the Company is requested by a User to disclose, correct or take measures to use personal information in accordance with the provisions of the Personal Data Protection Act, the Company shall, after confirming that the request is made by the User himself/herself, disclose the information to the User within a reasonable period of time (if the relevant personal information does not exist, the Company shall notify the User to that effect). However, this shall not apply in cases where the Company is not obliged to disclose, correct or take usage measures in accordance with the Personal Data Protection Act or other laws and regulations. Article 6 (Procedure for changing privacy policy) The Company will review the contents of this Policy from time to time and endeavour to improve it. The content of this Policy may be changed, except as otherwise provided by law or otherwise in this Policy. The amended Privacy Policy shall become effective when notified to the User in the manner prescribed by the Company or posted on the Company's website. Article 7 (Access analysis) This Website uses the third-party advertising service Google Analytics.Ad-serving providers may use cookies in order to display advertisements that match the interests of the user. This enables the identification of the user's browser, but does not identify the individual.For more information on how to disable cookies and on 'Google Analytics', please visit https://policies.google.com/technologies/ads?gl=jp. Article 8 (Contact point for enquiries) Please direct any comments, questions, complaints or other enquiries regarding the handling of personal data to the following contact point. Room 223, Mitsui Link Lab 2, 1-17-8 Shinkiba, Koto-ku, Tokyo 136-0082, JapanDioseve CorporationPerson responsible for handling personal information: Kazuma Kishida I agree with this privacy policy. Please enter the characters shown.↓"
