["https://dioseve.com/members"]
title = "MEMBERS Archive - 株式会社Dioseve(ディオシーヴ)"
full_description = "MEMBER 代表取締役 岸田 和真 早稲田大学卒 米系投資銀⾏Houlihan LokeyにてM&Aアドバイザリー業務に従事 2021年株式会社Dioseveを共同創業 同社代表取締役に就任 プリンシパル・サイエンティスト 清田弥寿成 Ph.D. 2009年麻布大学大学院にて博士号取得後、Child Health Institute of New Jersey研究員滋賀医科大学動物生命科学センター特任講師、University of Pennsylvania 研究員 2023年より現職 プロダクト開発ディレクター 柳井伍一 Ph.D. 京都大学再生医科学研究所卒、医学博士。 その後バイオベンチャーや製薬企業にて細胞製品のプロセス開発、製造、メディカルアフェアーズに従事。 2024年より現職 シニア・サイエンティスト 貴志 かさね DVM,Ph.D. 2018年に東京大学大学院農学生命科学研究科にて博士号を取得後、アステラス製薬株式会社で薬理研究員として勤務 2023年より現職 外部顧問 椎木 義統 パレクセル・インターナショナル株式会社 パレクセルコンサルティング統括部長、日本イーライリリーにて臨床開発、新規開発品目の臨床開発計画の立案及びその実行を経験。その後、CRO世界最大手のパレクセルインターナショナルにて臨床開発部の立ち上げを行い、2015年より現職 外部顧問 菅沼 信彦 M.D., Ph.D. 京都大学名誉教授。日本産婦人科学会功労会員、日本生殖医学会生殖医療専門医、日本受精着床学会理事、日本IVF学会理事、日本子宮移植研究会理事長。名古屋大学医学部医学科卒。 外部顧問 野呂信弘 Ph.D. 京都大学理学研究科にて博士号を取得後、神経科学・細胞生物学など多岐に渡る分野で研究に従事。1997年現グラクソ･スミスクライン株式会社に入社後、探索研究ならびに後期臨床開発に従事し、2011年に同社執行役員に就任。 2021年に株式会社ボナックにて最高科学責任者として核酸医薬品の研究開発および経営に参画。"
