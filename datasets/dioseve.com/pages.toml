title = "CAREER アーカイブ - 株式会社Dioseve(ディオシーヴ)"
full_description = "CAREER Thank you for your application. We will review the documents and contact only those who pass the document screening within one week. Principal Scientist About the role You will be the leader of our research team, working with Senior Scientists, Scientists, and Research Associates to conduct and supervise research. In addition to conducting experiments to achieve the strategy and goals, you will mainly support researcher management and research guidance. You will be responsible for summarizing the research data obtained and preparing materials and papers based on the data. You will promote the research department by conducting discussions and project management with joint research partners. Requirements – Prerequisite – Those who have research experience on germ cells and have management experience at a pharmaceutical company or research experience equivalent to an assistant professor at academia Abundant research experience in the fields of molecular biology, cell biology, and genetic engineering (especially experience in handling pluripotent stem cells, induction of differentiation, FACS, RT-PCR, etc. is welcome) Research guidance experience (junior, subordinate, student research guidance and timeline management experience) Business-level English skills (Experience working overseas as a researcher in an English-speaking country is welcome) – Welcome Additional Skills – Those who have research experience in regenerative medicine at a private company Those who have knowledge of the reproductive region (especially egg cells) Working place Tokyo Lab (Shinkiba) (with a business trip to Kumamoto Lab) Salary ￥575,000/month to ￥1,200,000/month (Including the pay for deemed overtime of 45 hours) + Incentive reward Benefits Paid leave: 13 days of annual paid leave Holidays: Saturdays, Sundays, and holidays (working on Saturdays and Sundays/weekdays off, etc. can be freely set according to the work content) APPLY Senior Scientist / Scientist About the role Conduct research in line with our research policy with other research members while discussing with the Chief Science Officer and Principal Scientist In order to understand the overall research, share the progress with the person in charge of another theme in the company and hold a discussion Collecting necessary information from research papers, etc. Giving instructions to technical staff Summarize the research data obtained and create materials based on that data Requirements – Prerequisite – Those who have a doctoral degree in the field of medicinal and veterinary agriculture Extensive research experience in any of the areas of molecular and cell biology, biochemistry, genetic engineering, developmental biology, genomics, or high-throughput assays Those who can plan, promote, and examine data on their own or in a team Those who are comfortable with simple discussions in English (no need to be fluent) *There are foreign members in the lab, and communication will occur in English. – Welcome Additional Skills – Those with research experience in germ cells, support cells in ovary/testis, or meiosis Those who have experience in handling pluripotent stem cells (ES/iPS cells), differentiation induction, FACS, RT-PCR, etc. (good at genetic engineering) Those who have research experience in drug discovery and regenerative medicine at private companies Those who have business-level English proficiency and experience working overseas as a researcher in an English-speaking country Working place Tokyo Lab (Shinkiba) Salary ￥350,000/month to ￥640,000/month (Including the pay for deemed overtime of 45 hours/month) + Incentive reward Benefits Paid leave: 13 days of annual paid leave Holidays: Saturdays, Sundays, and holidays (working on Saturdays and Sundays/weekdays off, etc. can be freely set according to the work content) APPLY Research Associate About the role Engage in research in line with our research policy while discussing with the Scientific Director, Senior Scientist, and Scientist Experimental work including creation of experimental samples Laboratory management such as management and maintenance of reagents, instruments, etc. Other work related to research Requirements – Prerequisite – Undergraduate or vocational school graduates in the field of medicine, pharmacy, veterinary science, agriculture Experience in research using animal cell culture, E. coli transformation, RT-PCR, etc. Able to give instruction and report on research in English and have simple daily conversation * The scientist who will research together will be a foreigner. – Welcome Additional Skills – Those who have research experience in drug discovery and regenerative medicine at private companies Those who have experience handling pluripotent stem cells (ES/iPS cells) Those who have knowledge of the reproductive region (especially egg cells) Those who have business-level English proficiency and experience working overseas as a researcher in an English-speaking country Those with a master’s or doctoral degree Working place Tokyo Lab(Shinkiba) Salary ￥250,000/month to ￥400,000/month (Including the pay for deemed overtime of 20 hours) + Incentive reward Benefits Paid leave: 13 days of annual paid leave Holidays: Saturdays, Sundays, and holidays (working on Saturdays and Sundays/weekdays off, etc. can be freely set according to the work content) APPLY"
