["https://dioxuslabs.com/blog/fulltime"]
title = "Dioxus | Fullstack crossplatform app framework for Rust"
description = "Dioxus | A fullstack crossplatform app framework for Rust. Supports Web, Desktop, SSR, Liveview, and Mobile."
full_description = "Hey folks, we’re going to deviate from the typical release post or technical discussion and talk about the future of Dioxus. If you’re new here, Dioxus is a UI library for Rust that supports web, desktop, mobile, liveview, TUI, and more. Our goal is to simplify app development, combining projects like React, Electron, Flutter, NextJS, InkJS, and Phoenix under one unified stack. I’m happy to announce that I’m now working on Dioxus Labs full time. Thanks to the generous support of Futurewei, Satellite.im, the GitHub Accelerator program, and several amazing individuals, Dioxus Labs is now able to employ both myself and top contributors like ealmloff full time. Over the past year, Dioxus has grown significantly. We’ve made huge strides in pushing forward the Rust frontend ecosystem. Some of the amazing innovations in this space include hot-reloading, syn-based autoformatting, and dioxus-liveview. Built on top of these innovations are breakthrough projects like Sledgehammer, Taffy, Freya, and Blitz. We want to continue innovating while also maturing Dioxus on all fronts. Going full time on open source is a huge jump. It takes a lot of courage to leave a company as great as Cloudflare. Being independent truly means independent - no work colleagues, no free snacks, no transit card, no beautiful office, and no company-sponsored health insurance. That being said, I’m eternally grateful to have the opportunity to pursue Dioxus Labs with my entire passion. We are committed to helping developers build better apps. There’s a lot more on the roadmap. If you’re at all interested in contributing to Dioxus, let us know in the community discord, and we’ll be there to help. If you’re interested in supporting the project to help us grow, please reach out. Again, a huge thanks to our wonderful sponsors and an even bigger thanks to the Rust community who have used and contributed to Dioxus over the past year."
