["https://dioxuslabs.com/blog/release-020"]
title = "Dioxus | Fullstack crossplatform app framework for Rust"
description = "Dioxus | A fullstack crossplatform app framework for Rust. Supports Web, Desktop, SSR, Liveview, and Mobile."
full_description = '''Dioxus is a recently-released library for building interactive user interfaces (GUI) with Rust. It is built around a Virtual DOM, making it portable for the web, desktop, server, mobile, and more. Dioxus looks and feels just like React, so if you know React, then you'll feel right at home. A ton of stuff happened in this release; 550+ commits, 23 contributors, 2 minor releases, and 6 backers on Open Collective. When Dioxus was initially released, we had very simple support for logging Dioxus elements out as TUI elements. In the past month or so, @ealmloff really stepped up and made the new crate a reality. The new TUI renderer even supports mouse movements, keyboard input, async tasks, borders, and a ton more. We totally revamped the router, switching away from the old yew-router approach to the more familiar React-Router. It's less type-safe but provides more flexibility and support for beautiful URLs. Apps with routers are really simple now. It's easy to compose the "Router", a "Route", and "Links" to define how your app is laid out: We're also using hooks to parse the URL parameters and segments so you can interact with the router from anywhere deeply nested in your app. Managing state in your app can be challenging. Building global state management solutions can be even more challenging. For the first big attempt at building a global state management solution for Dioxus, we chose to keep it simple and follow in the footsteps of the Recoil.JS project. Fermi uses the concept of "Atoms" for global state. These individual values can be get/set from anywhere in your app. Using state with Fermi is basically as simple as use_state. For internal components, explicitly declaring props structs can become tedious. That's why we've built the new component macro. This macro lets you inline your props definition right into your component function arguments. You won't be able to document each field or attach attributes so you should refrain from using it in libraries. Sometimes you don't want to specify every value in a component's props, since there might a lot. That's why the Props macro now supports optional fields. You can use a combination of default, strip_option, and optional to tune the exact behavior of properties fields.'''
