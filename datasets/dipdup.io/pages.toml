title = "EVM: Etherscan · DipDup Docs"
description = "Etherscan is a popular Ethereum blockchain explorer. It provides a public API to fetch ABIs of verified contracts. DipDup can use its API to fetch ABIs for contracts being indexed."
full_description = "Table of ContentsAuthorizationBlockscout compatibilityEtherscanNoteExamples below are for Ethereum mainnet. For other supported networks, see EVM Networks.Etherscan is a popular Ethereum blockchain explorer. It provides a public API to fetch ABIs of verified contracts. DipDup can use its API to fetch ABIs for contracts being indexed.Explorers of other EVM networks (e.g. BscScan, PolygonScan) are usually based on Etherscan and have similar APIs.To use this datasource, add the following section in config:dipdup.yamldatasources: etherscan: kind: evm.etherscan url: ${ETHERSCAN_URL:-https://api.etherscan.io/api} api_key: ${ETHERSCAN_API_KEY:-''} During initialization, DipDup will use this datasource to fetch contract ABIs. If your config contains definitions for multiple networks, you can assign the datasource explicitly in evm index definitions:dipdup.yamlindexes: evm_events: kind: evm.events datasources: - etherscan ... AuthorizationIf you have an Etherscan API key, you can set it in config. You may also want to increase the ratelimit according to your subscription plan. Otherwise, you will be limited to 5 requests per second.dipdup.yaml etherscan: kind: evm.etherscan url: ${ETHERSCAN_URL:-https://api.etherscan.io/api} api_key: ${ETHERSCAN_API_KEY:-''} http: ratelimit_period: 1 ratelimit_rate: 10 Blockscout compatibilityIf you are using Blockscout, you can use the same configuration with it. Blockscout and Etherscan APIs are partially compatible, just enough for DipDup to fetch contract ABIs.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousEVM: Node RPCNextEVM: BlockvisionHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
