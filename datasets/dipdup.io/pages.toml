["https://dipdup.io/docs/troubleshooting"]
title = "Troubleshooting · DipDup Docs"
description = 'This page contains tips for troubleshooting DipDup issues. Start with "General" section and then proceed to one that matches your problem.'
full_description = '''Table of ContentsGeneralUpdate DipDup to the latest versionEnable debug loggingInstallationConfigEnsure that config is correctCheck env variablesPackageUse linters to find errors in your Python codeInspect the package structureBlockchainsTezos: explorersFound a bug?Got stuck?TroubleshootingThis page contains tips for troubleshooting DipDup issues. Start with "General" section and then proceed to one that matches your problem.GeneralUpdate DipDup to the latest versionIf you experience an issue, first of all, make sure that you're using the latest version of DipDup. If a new release is available you'll see a warning message when running DipDup. You can update DipDup using the following commands depending on your installation method:Terminal# Built-in installer dipdup self update # pipx pipx upgrade dipdup # PDM pdm update # Poetry poetry update # pip pip install --upgrade dipdup When using Docker images you can use X and X.Y tags to lock to specific major/minor releases:DockerfileFROM dipdup/dipdup:8 We follow semantic versioning, so you can safely update to a new patch version without any breaking changes.Enable debug loggingMore logs can give you a clue about the reason for an issue. Enable debug logging in config:dipdup.yamllogging: DEBUG Or using env variable:Terminalexport DIPDUP_DEBUG=1 InstallationConfigEnsure that config is correctDipDup config can be correct syntactically but not necessarily semantically. It's especially easy to make a mistake when actively using templates and environment variables. Use config export command to dump config the way DipDup "sees" it, after resolving all links and templates.Terminaldipdup -c . -c configs/dipdup.sqlite.yaml config export Check env variablesconfig env command can help you to find missing environment variables.Terminaldipdup -c . -c configs/dipdup.sqlite.yaml config env PackageUse linters to find errors in your Python codeExceptions that occurred during callback execution are reraised as CallbackErrors. If you experience this issue, most likely your code is incorrect. Luckily, the Python ecosystem has lots of tools called linters to help you find mistakes. Default DipDup project template includes black, ruff and mypy to check your code for errors and type mismatches. You can run them with the following commands:Terminalmake format make lint See the Makefile file in your project root for more details.Inspect the package structureBlockchainsTezos: explorersBetter Call Dev is a blockchain explorer for Tezos smart contracts. It provides a more human-friendly interface than TzKT to explore exact contract calls and parameter/storage structures.Try it out when writing index definitions.Found a bug?When an exception occurs DipDup saves crash dumps to ~/local/share/dipdup/reports. You can inspect them using dipdup report ls and dipdup report show commands.If you think you've found a bug, please report it directly to the GitHub Issues. For all other discussions.Got stuck?Ask for help! We are always ready to answer your questions.join our socials:Discord (preferred)TelegramSlackhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousF.A.Q.NextContributingHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
