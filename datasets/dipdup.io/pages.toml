["https://dipdup.io/docs/quickstart-substrate"]
title = "Quickstart · DipDup Docs"
description = "This page will guide you through the steps to get your first selective indexer up and running in a few minutes without getting too deep into the details."
full_description = "Table of ContentsInstall DipDupCreate a projectWrite a configuration fileGenerate types and stubsDefine data modelsImplement handlersNext stepsQuickstartWarningSubstrate support is in beta stage. API and features may change in the future.This page will guide you through the steps to get your first selective indexer up and running in a few minutes without getting too deep into the details.A selective blockchain indexer is an application that extracts and organizes specific blockchain data from multiple data sources, rather than processing all blockchain data. It allows users to index only relevant entities, reducing storage and computational requirements compared to full node indexing, and query data more efficiently for specific use cases. Think of it as a customizable filter that captures and stores only the blockchain data you need, making data retrieval faster and more resource-efficient. DipDup is a framework that helps you implement such an indexer.Let's create an indexer for the balance transfers in AssetHub network. Our goal is to save all transfers to the database and then calculate some statistics of its holders' activity.Install DipDupA modern Linux/macOS distribution with Python 3.12 installed is required to run DipDup.The recommended way to install DipDup CLI is pipx. We also provide a convenient helper script that installs all necessary tools. Run the following command in your terminal:Terminalcurl -Lsf https://dipdup.io/install.py | python3.12 See the Installation page for all options.Create a projectDipDup CLI has a built-in project generator. Run the following command in your terminal:Terminaldipdup new Choose From template, then Substrate network and demo_substrate_events template.NoteWant to skip a tutorial and start from scratch? Choose Blank at the first step instead and proceed to the Config section.Follow the instructions; the project will be created in the new directory.Write a configuration fileIn the project root, you'll find a file named dipdup.yaml. It's the main configuration file of your indexer. We will discuss it in detail in the Config section; now it has the following content:dipdup.yamlspec_version: 3.0 package: demo_substrate_events runtimes: assethub: kind: substrate type_registry: statemint datasources: subsquid: kind: substrate.subsquid url: https://v2.archive.subsquid.io/network/asset-hub-polkadot subscan: kind: substrate.subscan url: https://assethub-polkadot.api.subscan.io/api node: kind: substrate.node url: https://statemint.api.onfinality.io/rpc?apikey=${NODE_API_KEY:-''} ws_url: wss://statemint.api.onfinality.io/ws?apikey=${NODE_API_KEY:-''} indexes: assethub_transfers: kind: substrate.events runtime: assethub datasources: - subsquid - subscan - node handlers: - callback: on_transfer name: Assets.Transferred Generate types and stubsNow it's time to generate typeclasses and callback stubs based on definitions from config. Examples below use demo_substrate_events as a package name; yours may differ.Run the following command:Terminaldipdup init DipDup will create a Python package demo_substrate_events with everything you need to start writing your indexer. Use package tree command to see the generated structure:Terminal$ dipdup package tree demo_substrate_events [.] ├── abi │ └── assethub/v601.json ├── configs │ ├── dipdup.compose.yaml │ ├── dipdup.sqlite.yaml │ ├── dipdup.swarm.yaml │ └── replay.yaml ├── deploy │ ├── .env.default │ ├── Dockerfile │ ├── compose.sqlite.yaml │ ├── compose.swarm.yaml │ ├── compose.yaml │ ├── sqlite.env.default │ └── swarm.env.default ├── graphql ├── handlers │ ├── batch.py │ └── on_transfer.py ├── hasura ├── hooks │ ├── on_index_rollback.py │ ├── on_reindex.py │ ├── on_restart.py │ └── on_synchronized.py ├── models │ └── __init__.py ├── sql ├── types │ ├── assethub/substrate_events/assets_transferred/__init__.py │ └── assethub/substrate_events/assets_transferred/v601.py └── py.typed That's a lot of files and directories! But don't worry, we will need only models and handlers sections in this guide.Define data modelsDipDup supports storing data in SQLite, PostgreSQL and TimescaleDB databases. We use modified Tortoise ORM library as an abstraction layer.First, you need to define a model class. DipDup uses model definitions both for database schema and autogenerated GraphQL API. Our schema will consist of a single model Holder with the following fields:addressaccount addressbalancetoken amount held by the accountturnovertotal amount of transfer/mint callstx_countnumber of transfers/mintslast_seentime of the last transfer/mintHere's how to define this model in DipDup:models/__init__.pyfrom dipdup import fields from dipdup.models import CachedModel class Holder(CachedModel): address = fields.TextField(primary_key=True) balance = fields.DecimalField(decimal_places=6, max_digits=40, default=0) turnover = fields.DecimalField(decimal_places=6, max_digits=40, default=0) tx_count = fields.BigIntField(default=0) last_seen = fields.BigIntField(null=True) class Meta: maxsize = 2**12 Using ORM is not a requirement; DipDup provides helpers to run SQL queries/scripts directly, see Database page.Implement handlersEverything's ready to implement an actual indexer logic.Our task is to index all the balance updates. Put some code to the on_transfer handler callback to process matched logs:handlers/on_transfer.pyfrom decimal import Decimal from demo_substrate_events import models as models from demo_substrate_events.types.assethub.substrate_events.assets_transferred import AssetsTransferredPayload from dipdup.context import HandlerContext from dipdup.models.substrate import SubstrateEvent from tortoise.exceptions import DoesNotExist async def sql_update( ctx: HandlerContext, address: str, amount: Decimal, level: int, ) -> None: await ctx.execute_sql_query( 'update_balance', address, str(amount), level, ) # NOTE: Not used, just for demonstration purposes async def orm_update( ctx: HandlerContext, address: str, amount: Decimal, level: int, ) -> None: try: holder = await models.Holder.cached_get(pk=address) except DoesNotExist: holder = models.Holder(address=address) holder.cache() holder.balance += amount holder.turnover += abs(amount) holder.tx_count += 1 holder.last_seen = level await holder.save() async def on_transfer( ctx: HandlerContext, event: SubstrateEvent[AssetsTransferredPayload], ) -> None: amount = Decimal(event.payload['amount']) if not amount: return await sql_update(ctx, event.payload['from'], -amount, event.data.level) await sql_update(ctx, event.payload['to'], amount, event.data.level) And that's all! We can run the indexer now.Next stepsRun the indexer in memory:dipdup run Store data in SQLite database (defaults to /tmp, set SQLITE_PATH env variable):dipdup -c . -c configs/dipdup.sqlite.yaml run Or spawn a Compose stack with PostgreSQL and Hasura:cd deploy cp .env.default .env # Edit .env file before running docker-compose up DipDup will fetch all the historical data and then switch to realtime updates. You can check the progress in the logs.If you use SQLite, run this query to check the data:sqlite3 /tmp/demo_substrate_events.sqlite 'SELECT * FROM holder LIMIT 10' If you run a Compose stack, open http://127.0.0.1:8080 in your browser to see the Hasura console (an exposed port may differ). You can use it to explore the database and build GraphQL queries.Congratulations! You've just created your first DipDup indexer. Proceed to the Getting Started section to learn more about DipDup configuration and features.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}NextInstallationHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
