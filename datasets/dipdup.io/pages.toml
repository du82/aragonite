["https://dipdup.io/docs/datasources/ipfs"]
title = "IPFS · DipDup Docs"
description = "While working with contract/token metadata, a typical scenario is to fetch it from IPFS. DipDup has a separate datasource to perform such requests via public nodes."
full_description = "IPFSWhile working with contract/token metadata, a typical scenario is to fetch it from IPFS. DipDup has a separate datasource to perform such requests via public nodes.dipdup.yamldatasources: ipfs: kind: ipfs url: https://ipfs.io/ipfs You can use this datasource within any callback. Output is either JSON or binary data.ipfs = ctx.get_ipfs_datasource('ipfs') file = await ipfs.get('QmdCz7XGkBtd5DFmpDPDN3KFRmpkQHJsDgGiG16cgVbUYu') assert file[:4].decode()[1:] == 'PDF' file = await ipfs.get('QmSgSC7geYH3Ae4SpUHy4KutxqNH9ESKBGXoCN4JQdbtEz/package.json') assert file['name'] == 'json-buffer' html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousCoinbaseNextHTTPHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
