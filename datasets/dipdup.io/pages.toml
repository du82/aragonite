full_description = '''Table of Contents8.2.1 - 2025-02-19AddedFixed8.2.0 - 2025-02-10AddedFixedChangedDeprecatedOther8.2.0rc1 - 2025-01-24AddedFixedChanged8.1.4 - 2025-01-12Fixed8.1.3 - 2024-12-20Fixed8.1.2 - 2024-12-10Fixed8.1.1 - 2024-10-17Fixed8.1.0 - 2024-10-16AddedFixed8.0.0 - 2024-09-10AddedFixedRemovedPerformance8.0.0b5 - 2024-08-09AddedFixedChangedOther8.0.0b4 - 2024-07-20AddedFixed7.5.9 - 2024-07-20Fixed8.0.0b3 - 2024-07-04AddedFixed7.5.8 - 2024-07-04Fixed8.0.0b2 - 2024-06-27AddedFixed8.0.0b1 - 2024-06-19AddedFixedOther7.5.7 - 2024-05-30Fixed7.5.6 - 2024-05-16FixedChanged8.0.0a1 - 2024-05-06AddedFixedChangedRemovedOther7.5.5 - 2024-04-17Added7.5.4 - 2024-04-09Fixed7.5.3 - 2024-03-28Fixed7.5.2 - 2024-03-20Fixed7.5.1 - 2024-03-17FixedPerformance7.5.0 - 2024-03-08AddedFixedPerformance7.4.0 - 2024-02-20AddedFixed7.3.2 - 2024-02-06AddedFixedPerformance7.3.1 - 2024-01-29Fixed7.3.0 - 2024-01-23AddedFixed7.2.2 - 2023-12-27Fixed7.2.1 - 2023-12-12AddedFixed7.2.0 - 2023-11-30AddedFixedPerformanceSecurity7.1.1 - 2023-11-07Fixed7.1.0 - 2023-10-27AddedFixed7.0.2 - 2023-10-10AddedFixed7.0.1 - 2023-09-30AddedFixed7.0.0 - 2023-09-25Fixed7.0.0rc5 - 2023-09-06Fixed7.0.0rc4 - 2023-08-23AddedFixedChanged7.0.0rc3 - 2023-08-05Fixed7.0.0rc2 - 2023-07-26Fixed7.0.0rc1 - 2023-07-21AddedFixedChangedRemovedOtherChangelogAll notable changes to this project will be documented in this file.The format is based on Keep a Changelog, and this project adheres to Semantic Versioning.Releases prior to 7.0 has been removed from this file to declutter search results; see the archived copy for the full list.8.2.1 - 2025-02-19Addedcli: Rewritten interactive mode for new command.evm.blockvision: Added evm.blockvision datasource to fetch ABIs from Blockvision API.evm.sourcify: Added evm.sourcify datasource to fetch ABIs from Sourcify API.Fixedcoinbase: Fixed crash when using coinbase datasource.evm.node: Fixed crash when block range goes out of bounds.8.2.0 - 2025-02-10Addedstarknet.node: Added methods for fetching contract ABIs for init command.Fixedcli: Fixed help message on CallbackError reporting batch handler instead of actual one.starknet: Process all data types correctly.starknet.node: Fetch missing block timestamp and txn id when synching with node.substrate.subsquid: Fixed parsing nested structures in response.substrate.subsquid: Fixed parsing for __kind junctions with multiple keys.Changedproject: Set default PostgreSQL password and Hasura secret (both are changeme) for new projects.project: Use PostgreSQL 16 image for new projects.Deprecatedpackage: DipDup packages are expected to have pyproject.toml and dipdup.yaml files in the root directory. This will become a requirement in 9.0.Otherdeps: tortoise-orm updated to 0.24.0.8.2.0rc1 - 2025-01-24Addedproject: Support uv package manager in the default project template.substrate.events: Added subtrate.events index kind to process Substrate events.substrate.node: Added subtrate.node datasource to receive data from Substrate node.substrate.subscan: Added substrate.subscan datasource to fetch ABIs from Subscan.substrate.subsquid: Added substrate.subsquid datasource to fetch historical data from Squid Network.Fixeddatabase: Don't process internal models twice if imported from the project.evm.subsquid: Fixed event/transaction model deserialization.Changedenv: Database migrations with aerich require DIPDUP_MIGRATIONS variable to be set.evm.etherscan: Datasource has been renamed from abi.etherscan to evm.etherscan for consistency.project: Expose Prometheus and internal API ports in default sqlite environment.8.1.4 - 2025-01-12Fixedevm: Fixed sending JSONRPC requests via web3.py provider.evm: Fixed parsing tuple types in ABI.evm.subsquid: Fixed type of timestamp field of event/transaction models.evm.subsquid: Fixed empty field base conversion on event deserialization.starknet: Fixed parsing contract addresses starting with 0x0.8.1.3 - 2024-12-20Fixedcli: Don't wrap exceptions with CallbackError to avoid shadowing the original exception.cli: Fixed --template option being ignored when --quiet flag is set.config: Fixed setting default loglevels when logging is a dict.config: Fixed parsing config files after updating to pydantic 2.10.3.config: Fixed starknet index validation error.metrics: Fixed indexed objects counter.starknet: Added support for struct and array types, as well as u256 and ByteArray handlers.starknet: Fixed event payload parsing (account for keys field).starknet: Fixed missing class property in node datasource.8.1.2 - 2024-12-10Fixedcontext: Allow to add Starknet contracts in runtime.database: Ignore non-existent immutable table on schema wipe.starknet.events: Fixed event ID calculation.8.1.1 - 2024-10-17Fixedcli: Fixed progress estimation logging.8.1.0 - 2024-10-16Addedevm.etherscan: Try to extract ABI from webpage when API call fails.cli: Added schema subcommands to manage database migrations: migrate, upgrade, downgrade, heads and history.cli: Added interactive mode for new command.database: Support database migrations using aerich.hasura: Added hide and hide_internal config options to make specified tables/views private.Fixedcli: Reload constants in dipdup.env after applying env-files.8.0.0 - 2024-09-10Addedcli: Added -C option, a shorthand for -c . -c configs/dipdup.<name>.yaml.database: Added dipdup_status view to the schema.Fixedcli: Don't update existing installation in self install command unless asked to.cli: Fixed env files not being loaded in some commands.install: Fixed reinstalling package when --force flag is used.package: Create package in-place if cwd equals package name.performance: Add index name to fetcher and realtime queues.subsquid: Fixed missing entry in dipdup_head internal table.tezos.big_maps: Fixed logging status message in skip_history mode.tezos.big_maps: Respect order of handlers in skip_history mode.Removedconfig: Removed advanced.skip_version_check flag; use DIPDUP_NO_VERSION_CHECK environment variable.database: Removed dipdup_head_status view; use dipdup_status view instead.Performancedatabase: Set synchronous=NORMAL and journal_mode=WAL pragmas for on-disk SQLite databases.8.0.0b5 - 2024-08-09Addedpackage: Added built-in batch handler to modify higher-level indexing logic.Fixedcli: Fixed progress estimation when there are indexes with last_level option set.cli: Don't save reports for successful test runs.database: Fixed concurrency issue when using get_or_create method.evm: Fixed crash when contract ABI contains overloaded methods.tezos.operations: Fixed sr_cement operation index subscription.Changedconfig: When filtering EVM transactions by signature, use signature field instead of method.context: Signatures of fire_handler and fire_hook methods have changed.context: ctx.logger is a regular logging.Logger instead of pre-configured FormattedLogger.Otherdeps: Use uvloop to improve asyncio performance.8.0.0b4 - 2024-07-20Addedconfig: Publish JSON schemas for config validation and autocompletion.starknet.node: Added Starknet node datasource for last mile indexing.tezos.operations: Added sr_cement operation type to process Smart Rollup Cemented Commitments.Fixedevm.events: Improve fetching event batches from node.models: Fixed CachedModel preloading.7.5.9 - 2024-07-20Fixedevm.events: Improve fetching event batches from node.models: Fixed CachedModel preloading.8.0.0b3 - 2024-07-04Addedenv: Added DIPDUP_LOW_MEMORY variable to reduce the size of caches and buffers.Fixedcli: Fixed --pre installer flag.cli: Import some dependencies on demand to reduce memory footprint.evm.subsquid: Fixed typo in iter_events method name.7.5.8 - 2024-07-04Fixeddeps: Removed pyarrow from dependencies, bumped web3.project: Fixed make image target command.8.0.0b2 - 2024-06-27Addedenv: Added DIPDUP_JSON_LOG environment variable to enable JSON logging.cli: Added --pre flag to self group commands to install pre-release versions.Fixedconfig: Allow sentry.dsn to be empty string.models: Fixed setting default value for Meta.maxsize.starknet.events: Fixed filtering events by key.8.0.0b1 - 2024-06-19Addedcli: Added full project migration support for 3.0 spec.starknet.events: Added starknet.events index kind to process Starknet events.starknet.subsquid: Added starknet.subsquid datasource to fetch historical data from Subsquid Archives.Fixedcli: Fixed errors raised when the project package is invalid.config: Fixed setting logging levels according to the config.evm.events: Fixed matching logs when filtering by topic0.Otherdeps: tortoise-orm updated to 0.21.2.7.5.7 - 2024-05-30Fixedconfig: Fixed setting logging levels according to the config.evm.subsquid.events: Fixed matching logs when filtering by topic0.7.5.6 - 2024-05-16Fixedcli: Improved logging of indexer status.performance: Fixed estimation indexing speed in levels per second.Changedapi: /performance endpoint response format has been changed.performance: All time intervals are now measured in seconds.performance: Several metrics have been renamed and new ones have been added.8.0.0a1 - 2024-05-06Addedcli: Added spec_version 3.0 support to migrate command.cli: Added package verify command to check the package consistency.cli: Added --raw option to config export command to dump config preserving the original structure.env: Added DIPDUP_PACKAGE_PATH environment variable to override discovered package path.Fixedcli: Improved logging of indexer status.config: Fixed (de)serialization of hex strings in config.performance: Fixed estimation indexing speed in levels per second.yaml: Fixed indentation and formatting of generated YAML files.Changedapi: /performance endpoint response format has been changed.config: Index kinds have been renamed and grouped by the network.config: Index configs accept datasources list instead of datasource field.config: Index template values now can be any JSON-serializable object.deps: Python 3.12 is now required to run DipDup.performance: All time intervals are now measured in seconds.performance: Several metrics have been renamed and new ones have been added.Removedconfig: node_only index config flag has been removed; add evm.node datasource(s) to the datasources list instead.config: abi index config field has been removed; add evm.etherscan datasource(s) to the datasources list instead.Otherdemos: Demo projects have been renamed to reflect the new config structure.deps: datamodel-code-generator updated to 0.25.deps: pyarrow updated to 16.0.deps: pydantic updated to 2.2.deps: sentry-sdk updated to 2.1.deps: tortoise-orm updated to 0.20.1.deps: web3 updated to 6.18.7.5.5 - 2024-04-17Addedevm.subsquid: evm.node datasources can be used as index datasources.7.5.4 - 2024-04-09Fixedconfig: Don't raise ConfigurationError from some model validators.config: Fixed crash when database path is relative and nested.config: Fixed issue with from filter being ignored.config: Forbid extra arguments in config mappings.7.5.3 - 2024-03-28Fixedtezos.tzkt.operations: Fixed missing operations when handler pattern contains item without entrypoint.7.5.2 - 2024-03-20Fixedevm.node: Fixed updating dipdup_head table when head block is received.tezos.tzkt.operations: Fixed crash when handler definition contains optional items.7.5.1 - 2024-03-17Fixedevm.node: Fixed default ratelimit sleep time being too high.evm.subsquid.transactions: Fixed issue with node_only flag ignored.Performanceevm.subsquid: Dynamically adjust the batch size when syncing with node.7.5.0 - 2024-03-08Addedconfig: Added http.polling_interval option to set the interval between polling requests (some datasources).hasura: Allow bulk request type in custom metadata files.Fixedevm.etherscan: Raise AbiNotAvailableError when contract is not verified.cli: Fixed incorrect indexer status logging.evm.node: Fixed memory leak when using realtime subscriptions.evm.node: Fixed processing chain reorgs.evm.node: Respect http.batch_size when fetching block headers.Performancehasura: Apply table customizations in a single request.performance: Collect hit/miss stats for cached models.performance: Decrease main loop and node polling intervals.performance: Drop caches when all indexes have reached realtime.7.4.0 - 2024-02-20Addedcli: Added --template option to new command to skip template selection.evm.subsquid.transactions: Added evm.subsquid.transactions index kind to process EVM transactions.Fixedcli: Fixed crash when running init command with a config outside of the project directory.codegen: Don't create intermediate events.json file in ABI directory.evm.subsquid: When request to worker fails, ask router for another one instead of retrying the same worker.7.3.2 - 2024-02-06Addedenv: Added DIPDUP_NO_VERSION_CHECK and DIPDUP_NO_SYMLINK variables.Fixedcli: Do not consider config as oneshot if tezos.tzkt.head index is present.codegen: Allow dots to be used in typenames indicating nested packages.evm.node: Make withdrawals_root field optional in EvmNodeHeadData model.http: Fixed crash on some datasource URLs.Performanceevm.subsquid.events: Increase indexing speed when using EVM node.7.3.1 - 2024-01-29Fixedcodegen: Always cleanup jsonschemas before generating types.config: Make ws_url field optional for evm.node datasource.7.3.0 - 2024-01-23Addedtezos.tzkt.operations: Added new operation type sr_execute for Etherlink smart rollups.Fixedevm.etherscan: Fixed handling "rate limit reached" errors.cli: Fixed setting logger levels based on config and env variables.http: Fixed incorrect number of retries performed on failed requests.7.2.2 - 2023-12-27Fixedevm.subsquid: Last mile indexing is significantly faster now.tezos.tzkt: Fixed an issue with approving schema after reindexing triggered by rollback.7.2.1 - 2023-12-12Addedcli: Added DIPDUP_CONFIG and DIPDUP_ENV_FILE environment variables corresponding to --config and --env-file options.Fixedevm.node: Fixed crash on anonymous event logs during the last mile indexing.evm.node: Raise an exception when no realtime messages have been received in http.connection_timeout seconds.7.2.0 - 2023-11-30Addedapi: Added HTTP API to manage a running indexer.config: Added http.request_timeout option to set the total timeout for HTTP requests.evm.subsquid: Added Prometheus metrics required for Subsquid Cloud deployments.project: Added optional package_manager field to replay config.project: Added Makefile to the default project template (only for new projects).tezos.tzkt: Added support for Etherlink smart rollups (sr1… addresses).Fixedcli: Don't suppress uncaught exceptions when performance monitoring is disabled.codegen: Use datamodel-code-generator from the project's virtualenv.evm.node: Fixed an issue with realtime subscriptions which led to indexing being stuck in some cases.http: Use request_timeout instead of connection_timeout for total timeout.install: Don't install datamodel-code-generator as a CLI tool.install: Respect package manager if specified in pyproject.toml.Performanceevm.subsquid.events: Request logs in batches to speed up the last mile indexing.Securitydeps: Updated PyArr'''
