["https://dipdup.io/docs/indexes/tezos_big_maps"]
title = "Big map updates · DipDup Docs"
description = "Big maps are lazy structures allowing to access and update only exact keys. Gas costs for these operations doesn't depend on the size of a big map, but you can't iterate over its keys onchain."
full_description = "Table of ContentsHandlersIndex only the current statebig_map IndexBig maps are lazy structures allowing to access and update only exact keys. Gas costs for these operations doesn't depend on the size of a big map, but you can't iterate over its keys onchain.big_map index allows querying only updates of specific big maps. In some cases, it can drastically reduce the amount of data transferred and thus indexing speed compared to fetching all operations.dipdup.yamlindexes: token_big_map_index: kind: tezos.big_maps datasources: - tzkt skip_history: never handlers: - callback: on_ledger_update contract: token path: data.ledger - callback: on_token_metadata_update contract: token path: token_metadata HandlersEach big map handler contains three required fields:callback — a name of async function with a particular signature; DipDup will search for it in dipdup_indexer.handlers.<callback> modulecontract — big map parent contractpath — path to the big map in the contract storage (use dot as a delimiter)Index only the current stateWhen the skip_history field is set to once, DipDup will skip historical changes only on initial sync and switch to regular indexing afterward. When the value is always, DipDup will fetch all big map keys on every restart. Preferable mode depends on your workload.All big map diffs DipDup passes to handlers during fast sync have the action field set to BigMapAction.ADD_KEY. Remember that DipDup fetches all keys in this mode, including ones removed from the big map. You can filter them out later by BigMapDiff.data.active field if needed.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousTransactionsHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
