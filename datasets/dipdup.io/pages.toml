["https://dipdup.io/docs/graphql/genql"]
title = "GenQL · DipDup Docs"
description = "GenQL is a great library and CLI tool that automatically generates a fully typed SDK with a built-in GQL client. It works flawlessly with Hasura and is recommended for DipDup on the client side."
full_description = '''Table of ContentsProject structureSDK package configDemoGenQLGenQL is a great library and CLI tool that automatically generates a fully typed SDK with a built-in GQL client. It works flawlessly with Hasura and is recommended for DipDup on the client side.Project structureGenQL CLI generates a ready-to-use package, compiled and prepared to publish to NPM. A typical setup is a mono repository containing several packages, including the auto-generated SDK and your front-end application.project_root/ ├── package.json └── packages/ ├── app/ │ ├── package.json │ └── src/ └── sdk/ └── package.json SDK package configYour minimal package.json file will look like the following:package.json{ "name": "%PACKAGE_NAME%", "version": "0.0.1", "main": "dist/index.js", "types": "dist/index.d.ts", "devDependencies": { "@genql/cli": "^2.6.0" }, "dependencies": { "@genql/runtime": "2.6.0", "graphql": "^15.5.0" }, "scripts": { "build": "genql --endpoint %GRAPHQL_ENDPOINT% --output ./dist" } } That's it! Now you only need to install dependencies and execute the build target:Terminalyarn yarn build Read more about CLI options available.DemoCreate a package.json file with%PACKAGE_NAME% => metadata-sdk%GRAPHQL_ENDPOINT% => https://metadata.dipdup.net/v1/graphqlAnd generate the client:Terminalyarn yarn build Then create new file index.ts and paste this query:index.tsimport { createClient, everything } from './dist' const client = createClient() client.chain.query .token_metadata({ where: { network: { _eq: 'mainnet' } }}) .get({ ...everything }) .then(res => console.log(res)) We need some additional dependencies to run our sample:Terminalyarn add typescript ts-node Finally:Terminalnpx ts-node index.ts You should see a list of tokens in your console with metadata attached.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousREST EndpointsNextDockerHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
