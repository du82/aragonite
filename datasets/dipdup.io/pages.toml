["https://dipdup.io/docs/indexes/tezos_operations_unfiltered"]
title = "Raw operations · DipDup Docs"
description = "This index allows indexing all operations of the Tezos blockchain. It's a low-level index that doesn't parse operation storage/parameter and doesn't filter operations by type. Here's a minimal config example:"
full_description = "tezos.operations_unfiltered indexThis index allows indexing all operations of the Tezos blockchain. It's a low-level index that doesn't parse operation storage/parameter and doesn't filter operations by type. Here's a minimal config example:dipdup.yamlspec_version: 3.0 package: demo_tezos_raw datasources: tzkt_mainnet: kind: tezos.tzkt url: ${TZKT_URL:-https://api.tzkt.io} http: batch_size: 10000 indexes: mainnet_operations: kind: tezos.operations_unfiltered datasources: - tzkt_mainnet types: - origination - transaction - migration callback: on_operation first_level: 1589000 last_level: 1590000 Handlers receive TzktOperationData model that contains untyped operation data.from demo_tezos_raw import models from dipdup.context import HandlerContext from dipdup.models.tezos import TezosOperationData async def on_operation( ctx: HandlerContext, operation: TezosOperationData, ) -> None: await models.Operation.create( hash=operation.hash, level=operation.level, type=operation.type, ) To use this demo as a template choose demo_tezos_raw in dipdup new command.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousTransactionsHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
