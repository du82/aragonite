["https://dipdup.io/docs/advanced/metadata-interface"]
title = "Metadata interface · DipDup Docs"
description = "When issuing a token on Tezos blockchain, there is an important yet not enough covered aspect related to how various ecosystem applications (wallets, explorers, marketplaces, and others) will display and interact with it. It's about token metadata, stored wholly or partially on-chain but intended for off-chain use only."
full_description = '''Table of ContentsToken metadata standardsBasic: on-chain links / off-chain storageCustom: off-chain viewDipDup-based solutionMetadata interfaceWhen issuing a token on Tezos blockchain, there is an important yet not enough covered aspect related to how various ecosystem applications (wallets, explorers, marketplaces, and others) will display and interact with it. It's about token metadata, stored wholly or partially on-chain but intended for off-chain use only.Token metadata standardsThere are several standards regulating the metadata file format and the way it can be stored and exposed to consumers:TZIP-21 | Rich Metadata — describes a metadata schema and standards for contracts and tokensTZIP-12 | FA2.0 — a standard for a unified token contract interface, includes an article about how to store and encode token metadataTZIP-7 | FA1.2 — single asset token standard; reuses the token metadata approach from FA2.0Keeping aside the metadata schema, let's focus on which approaches for storing are currently standardized, their pros and cons, and what to do if any of the options available do not fit your case.Basic: on-chain links / off-chain storageThe most straightforward approach is to store everything in the contract storage, especially if it's just the basic fields (name, symbol, decimals):storage └── token_metadata [big_map] └── 0 ├── token_id: 0 └── token_info ├── name: "" ├── symbol: "" └── decimals: "" But typically, you want to store more like a token thumbnail icon, and it is no longer feasible to keep such large data on-chain (because you pay gas for every byte stored). Then you can put large files somewhere off-chain (e.g., IPFS) and store just links:storage └── token_metadata [big_map] └── 0 ├── token_id: 0 └── token_info ├── ... └── thumbnailUri: "ipfs://" This approach is still costly, but sometimes (in rare cases), you need to have access to the metadata from the contract (example: Dogami). We can go further and put the entire token info structure to IPFS:storage └── token_metadata [big_map] └── 0 ├── token_id: 0 └── token_info └── "": "ipfs://" It is the most common case right now (example: HEN).The main advantage of the basic approach is that all the changes applied to token metadata will result in big map diffs that are easily traceable by indexers. Even if you decide to replace the off-chain file, it will cause the IPFS link to change. In the case of HTTP links, indexers cannot detect the content change; thus, token metadata won't be updated.Custom: off-chain viewThe second approach presented in the TZIP-12 spec was intended to cover the cases when there's a need in reusing the same token info or when it's not possible to expose the %token_metadata big map in the standard form. Instead, it's offered to execute a special Michelson script against the contract storage and treat the result as the token info for a particular token (requested). The tricky part is that the script code itself is typically stored off-chain, and the whole algorithm would look like this:Try to fetch the empty string key of the %metadata big map to retrieve the TZIP-16 file locationResolve the TZIP-16 file (typically from IPFS) — it should contain the off-chain view bodyFetch the current contract storageBuild arguments for the off-chain view token_metadata using fetched storage andExecute the script using Tezos node RPCAlthough this approach is more or less viable for wallets (when you need to fetch metadata for a relatively small amount of tokens), it becomes very inefficient for indexers dealing with millions of tokens:After every contract origination, one has to try to fetch the views (even if there aren't any) — it means synchronous fetching, which can take seconds in the case of IPFSExecuting a Michelson script is currently only* possible via Tezos node, and it's quite a heavy call (setting up the VM and contract context takes time)There's no clear way to detect new token metadata addition or change — that is actually the most critical one; you never know for sure when to call the viewOff-chain view approach is not supported by TzKT indexer, and we strongly recommend not to use it, especially for contracts that can issue multiple tokens.DipDup-based solutionThe alternative we offer for the very non-standard cases is using our selective indexing framework for custom token metadata retrieval and then feeding it back to the TzKT indexer, which essentially acts as a metadata aggregator. Note that while this can seem like a circular dependency, it's resolved on the interface level: all custom DipDup metadata indexers should expose specific GraphQL tables with certain fields:query MyQuery { token_metadata() { metadata // TZIP-21 JSON network // mainnet or <protocol>net contract // token contract address token_id // token ID in the scope of the contract update_id // integer cursor used for pagination } } DipDup handles table management for you and exposes a helper.Tezos Domains example:await ctx.update_token_metadata( network=ctx.datasource.network, address=store_records.data.contract_address, token_id=token_id, metadata={ 'name': record_name, 'symbol': 'TD', 'decimals': '0', 'isBooleanAmount': True, 'domainData': decode_domain_data(store_records.value.data) }, ) TzKT can be configured to subscribe to one or multiple DipDup metadata sources, currently we use in production:Generic TZIP-16/TZIP-12 metadata indexer GitHub | PlaygroundTezos Domains metadata indexer GitHub | PlaygroundUbisoft Quartz metadata indexer GitHub | Playgroundhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousSquid CloudNextCLIHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
year_published = 2025
clearnet = "https://dipdup.io/docs/advanced/metadata-interface"
