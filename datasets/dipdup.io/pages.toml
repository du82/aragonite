full_description = '''Table of ContentsGetting startedEndpoints and statusImmutable zkEVM MainnetImmutable zkEVM TestnetImmutable zkEVMGetting startedDipDup works with any EVM-compatible network as long as there are Subsquid and/or archive nodes available! Here's how to get started with your favorite network:Follow the EVM quickstart guide. Choose a template from the "EVM-compatible" section and follow the instructions.Update the datasources config section with URLs from the table below. Modify the file or better use environment variables.Update the contracts config section. If you want to run the demo project as is, just replace the ERC-20 contract address with the one from your network.That's it! You can now run the indexer with dipdup run.Endpoints and statusWarningWe do not recommend any specific node provider. Providers mentioned below were tested with DipDup on a free tier and listed for informational purposes only.Immutable zkEVM MainnetExplorer: BlockscoutdatasourcestatusURLsevm.subsquid🤔 not testedhttps://v2.archive.subsquid.io/network/immutable-zkevm-mainnetevm.etherscan🤔 not testedhttps://explorer.immutable.com/evm.node🤔 not testedhttps://rpc.immutable.comImmutable zkEVM TestnetExplorer: BlockscoutdatasourcestatusURLsevm.subsquid🤔 not testedhttps://v2.archive.subsquid.io/network/immutable-zkevm-testnetevm.etherscan🤔 not testedhttps://explorer.testnet.immutable.com/apievm.node🤔 not testedPreviousGnosisNextHokumHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
