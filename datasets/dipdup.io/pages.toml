["https://dipdup.io/docs/references/cli"]
title = "CLI · DipDup Docs"
description = "Command-line interface reference"
full_description = "Table of ContentsconfigenvexporthasuraconfigureinitmigratenewpackagetreeverifyreportlsrmshowrunschemaapproveexportinitwipeselfinstalluninstallupdateCLI referencedipdup____ _ ____/ __ (_)____ / __ __ __ ____/ / / // // __ / / / // / / // __ / /_/ // // /_/ // /_/ // /_/ // /_/ //_____//_// .___//_____/ __,_// .___//_/ /_/dipdup [OPTIONS] COMMAND [ARGS]... Options--versionShow the version and exit.-c, --config <PATH>A path to DipDup project config.-e, --env-file <PATH>A path to .env file containing KEY=value strings.-C <NAME>A shorthand for -c . -c configs/dipdup.<name>.yamlEnvironment variablesDIPDUP_CONFIGProvide a default for --configDIPDUP_ENV_FILEProvide a default for --env-fileDocumentation: https://dipdup.io/docs GitHub: https://github.com/dipdup-io/dipdup Discord: https://discord.gg/aG8XKuwsQdconfigCommands to manage DipDup configuration.dipdup config [OPTIONS] COMMAND [ARGS]... envDump environment variables used in DipDup config.If variable is not set, default value will be used.dipdup config env [OPTIONS]Options-o, --output <output>Output to file instead of stdout.--unsafeUse actual environment variables instead of default values.-c, --composeOutput in docker-compose format.-i, --internalInclude internal variables.exportPrint config after resolving all links and, optionally, templates.WARNING: Avoid sharing output with 3rd-parties when –unsafe flag set - it may contain secrets!dipdup config export [OPTIONS]Options--unsafeUse actual environment variables instead of default values.-f, --fullResolve index templates.-r, --rawDo not initialize config; preserve file structure.hasuraCommands related to Hasura integration.dipdup hasura [OPTIONS] COMMAND [ARGS]... configureConfigure Hasura GraphQL Engine to use with DipDup.dipdup hasura configure [OPTIONS]Options-f, --forceProceed even if Hasura is already configured.initGenerate project tree, typeclasses and callback stubs.This command is idempotent, meaning it won’t overwrite previously generated files unless asked explicitly.dipdup init [OPTIONS] PATH Options-f, --forceOverwrite existing types and ABIs.-b, --baseInclude template base: pyproject.toml, Dockerfile, etc.ArgumentsPATHOptional argument(s)migrateMigrate project to the new spec version.If you’re getting MigrationRequiredError after updating DipDup, this command will fix imports and type annotations to match the current spec_version. Review and commit changes after running it.dipdup migrate [OPTIONS]Options-n, --dry-runPrint changes without applying them.newCreate a new project interactively.dipdup new [OPTIONS]Options-q, --quietUse default values for all prompts.-f, --forceOverwrite existing files.-r, --replay <replay>Use values from a replay file.-t, --template <template>Use a specific template.packageInspect and manage project package.dipdup package [OPTIONS] COMMAND [ARGS]... treeDraw package tree.dipdup package tree [OPTIONS]verifyVerify project package.dipdup package verify [OPTIONS]reportManage crash and performance reports.dipdup report [OPTIONS] COMMAND [ARGS]... lsList reports.dipdup report ls [OPTIONS]rmRemove report(s).dipdup report rm [OPTIONS] [ID]Options-a, --allRemove all reports.ArgumentsIDOptional argumentshowShow report.dipdup report show [OPTIONS] ID ArgumentsIDRequired argumentrunRun the indexer.Execution can be gracefully interrupted with Ctrl+C or SIGINT signal.dipdup run [OPTIONS]schemaCommands to manage database schema.dipdup schema [OPTIONS] COMMAND [ARGS]... approveContinue to use existing schema after reindexing was triggered.dipdup schema approve [OPTIONS]exportPrint SQL schema including scripts from sql/on_reindex.This command may help you debug inconsistency between project models and expected SQL schema.dipdup schema export [OPTIONS]initPrepare database schema for running DipDup.This command creates tables based on your models, then executes sql/on_reindex to finish preparation - the same things DipDup does when run on a clean database.dipdup schema init [OPTIONS]wipeDrop all database tables, functions and views.WARNING: This action is irreversible! All indexed data will be lost!dipdup schema wipe [OPTIONS]Options-i, --immuneDrop immune tables too.-f, --forceSkip confirmation prompt.selfCommands to manage local DipDup installation.dipdup self [OPTIONS] COMMAND [ARGS]... installInstall DipDup for the current user.dipdup self install [OPTIONS]Options-q, --quietUse default values for all prompts.-f, --forceForce reinstall.-v, --version <version>Install DipDup from specific version.-r, --ref <ref>Install DipDup from specific git ref.-p, --path <path>Install DipDup from local path.--preInclude pre-release versions.-e, --editableInstall DipDup in editable mode.uninstallUninstall DipDup for the current user.dipdup self uninstall [OPTIONS]Options-q, --quietUse default values for all prompts.updateUpdate DipDup for the current user.dipdup self update [OPTIONS]Options-q, --quietUse default values for all prompts.-f, --forceForce reinstall.--preInclude pre-release versions.NextConfigHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
