["https://dipdup.io/docs/graphql/hasura"]
title = "Hasura GraphQL · DipDup Docs"
description = "DipDup provides seamless integration with Hasura GraphQL Engine to expose your data to the client side. It's a powerful tool that allows you to build a GraphQL API on top of your database with minimal effort. It also provides a subscription mechanism to get live updates from the backend. If you don't plan to use GraphQL, you can skip this section."
full_description = '''Table of ContentsDatabase limitationsUnauthorized accessConvert field names to camel caseCustom Hasura metadataHasura GraphQLDipDup provides seamless integration with Hasura GraphQL Engine to expose your data to the client side. It's a powerful tool that allows you to build a GraphQL API on top of your database with minimal effort. It also provides a subscription mechanism to get live updates from the backend. If you don't plan to use GraphQL, you can skip this section.DipDup can connect to any Hasura instance, cloud or self-hosted, and configure it to expose your data via GraphQL API. All you need is to enable this integration in the config file:dipdup.yamlhasura: url: http://hasura:8080 admin_secret: ${HASURA_SECRET:-changeme} DipDup will generate Hasura metadata based on your DB schema and apply it using Metadata API.Hasura metadata is all about data representation in GraphQL API. The structure of the database itself is managed solely by DipDup ORM.Metadata configuration is idempotent: each time you call run or hasura configure commands, DipDup queries the existing schema and updates metadata if required. DipDup configures Hasura after reindexing, saves the hash of resulting metadata in the dipdup_schema table, and doesn't touch Hasura until needed.Database limitationsThe current version of Hasura GraphQL Engine treats public and other schemas differently. Table schema.customer becomes schema_customer root field (or schemaCustomer if camel_case option is enabled in DipDup config). Table public.customer becomes customer field, without schema prefix. There's no way to remove this prefix for now. You can track related issue on Hasura's GitHub to know when the situation will change. Starting with 3.0.0-rc1, DipDup enforces public schema name to avoid ambiguity and issues with the GenQL library. You can still use any schema name if Hasura integration is not enabled.Unauthorized accessDipDup creates user role that allows querying /graphql endpoint without authorization. All tables are set to read-only for this role.You can limit the maximum number of rows such queries return and also disable aggregation queries automatically generated by Hasura:dipdup.yamlhasura: select_limit: 100 allow_aggregations: False Note that with limits enabled, you have to use either offset or cursor-based pagination on the client side.Convert field names to camel caseFor those of you from the JavaScript world, it may be more familiar to use camelCase for variable names instead of snake_case Hasura uses by default. DipDup now allows to convert all fields to this casing:dipdup.yamlhasura: camel_case: true Now this example query to hic et nunc demo indexer...QueryPlayground Experiment with this queryquery MyQuery { hic_et_nunc_token(limit: 1) { id creator_id } } ...will become this one (hic_et_nunc_token -> hicEtNuncToken):QueryPlayground Experiment with this queryquery MyQuery { hicEtNuncToken(limit: 1) { id creatorId } } All fields auto-generated by Hasura will be renamed accordingly: hic_et_nunc_token_by_pk to hicEtNuncTokenByPk, delete_hic_et_nunc_token to deleteHicEtNuncToken and so on. To return to defaults, set camel_case to False and run hasura configure --force.Remember that "camelcasing" is a separate stage performed after all tables are registered. So during configuration, you can observe fields in snake_case for several seconds even if conversion to camel case is enabled.Custom Hasura metadataThere are some cases where you want to apply custom modifications to the Hasura metadata. For example, assume that your database schema has a view that contains data from the main table, in which case you cannot set a foreign key between them. Then you can place files with a .json extension in the hasura directory of your project with the content in Hasura query format, and DipDup will execute them in alphabetical order of file names when the indexing is complete.The format of the queries can be found in the Metadata API documentation.Feature flag allow_inconsistent_metadata set in Hasura configuration section allows users to modify the behavior of the requests error handling. By default, this value is False.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousOverviewNextREST EndpointsHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
year_published = 2025
clearnet = "https://dipdup.io/docs/graphql/hasura"
