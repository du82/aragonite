["https://dipdup.io/docs/getting-started/handlers"]
title = "Handlers · DipDup Docs"
description = "After defining the index in the configuration file and initializing the project, you can start implementing handlers. DipDup generates callback stubs for all handlers specified in the configuration file. You can find them in the handlers directory."
full_description = '''Table of ContentsCallback signatureProcessing dataHandling name collisionsHandlersAfter defining the index in the configuration file and initializing the project, you can start implementing handlers. DipDup generates callback stubs for all handlers specified in the configuration file. You can find them in the handlers directory.Callback signatureThis partial callback definition matches two contract calls in the same transaction:callback: on_transaction pattern: - type: transaction destination: contract entrypoint: foo - type: transaction destination: contract entrypoint: bar The callback stub will look like the following:async def on_transaction( ctx: HandlerContext, foo: TezosTransaction[FooParameter, ContractStorage], bar: TezosTransaction[BarParameter, ContractStorage], ) -> None: ... Don't rename module and function names, as DipDup uses them to find the callback.The first argument is always HandlerContext. It provides useful helpers and contains an internal state (see Context Reference). The rest of the arguments are generated according to the handler pattern. Payloads of some arguments are typed, and DipDup generates corresponding models for them in the types directory.Processing dataDefine the callback body to process the data. The most common case is to perform some calculations and store the result in the database. DipDup provides a convenient ORM to work with the database.demo_tezos_raw/handlers/on_operation.pyfrom demo_tezos_raw import models from dipdup.context import HandlerContext from dipdup.models.tezos import TezosOperationData async def on_operation( ctx: HandlerContext, operation: TezosOperationData, ) -> None: await models.Operation.create( hash=operation.hash, level=operation.level, type=operation.type, ) Handling name collisionsIndexing operations of multiple contracts with the same entrypoints can lead to name collisions during code generation. In this case DipDup raises a ConfigurationError and suggests to set alias for each conflicting handler. Currently, it applies to tezos.operation indexes only. In the following snippet "call" entrypoint of both contracts is called. Add alias field to resolve the conflict:callback: on_mint pattern: - type: transaction entrypoint: mint alias: foo_mint - type: transaction entrypoint: mint alias: bar_mint You can also change argument names (but not the order!) manually if you want to.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousIndexesNextHooksHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
year_published = 2025
