title = "EVM: Subsquid · DipDup Docs"
description = "DipDup uses Subsquid Network as a source of historical data for EVM-compatible blockchains."
full_description = "Subsquid NetworkNoteExamples below are for Ethereum mainnet. For other supported networks, see EVM Networks.NoteSubsquid Network has been rebranded to SQD Network. We keep using old name in documentation and config specification for compatibility reasons.DipDup uses Subsquid Network as a source of historical data for EVM-compatible blockchains.Configure the datasource in your project config:dipdup.yamldatasources: subsquid: kind: evm.subsquid url: ${SUBSQUID_URL:-https://v2.archive.subsquid.io/network/ethereum-mainnet} Then, add it to EVM index definitions:dipdup.yamlindexes: eth_usdt_events: kind: evm.events datasources: - subsquid - etherscan - evm_node handlers: - callback: on_transfer contract: eth_usdt name: Transfer DipDup will use Subsquid Network when possible and fallback to EVM nodes for the latest data and realtime updates.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}NextEVM: Node RPCHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
