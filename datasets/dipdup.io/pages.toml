full_description = "Table of Contentsdipdup.context.DipDupContextdipdup.context.HandlerContextdipdup.context.HookContextdipdup.context.DipDupContext.add_contractdipdup.context.DipDupContext.add_indexdipdup.context.DipDupContext.execute_sqldipdup.context.DipDupContext.execute_sql_querydipdup.context.DipDupContext.fire_hookdipdup.context.DipDupContext.get_abi_etherscan_datasourcedipdup.context.DipDupContext.get_coinbase_datasourcedipdup.context.DipDupContext.get_evm_node_datasourcedipdup.context.DipDupContext.get_evm_subsquid_datasourcedipdup.context.DipDupContext.get_http_datasourcedipdup.context.DipDupContext.get_ipfs_datasourcedipdup.context.DipDupContext.get_tzip_metadata_datasourcedipdup.context.DipDupContext.get_tezos_tzkt_datasourcedipdup.context.DipDupContext.reindexdipdup.context.DipDupContext.restartdipdup.context.DipDupContext.rollbackdipdup.context.DipDupContext.update_contract_metadatadipdup.context.DipDupContext.update_token_metadataContext referencedipdup.context.DipDupContextclass dipdup.context.DipDupContext(config, package, datasources, transactions)Common execution context for handler and hook callbacks.Parameters:config (DipDupConfig) – DipDup configurationpackage (DipDupPackage) – DipDup packagedatasources (dict[str, Datasource[Any]]) – Mapping of available datasourcestransactions (TransactionManager) – Transaction manager (don’t use it directly)logger – Context-aware logger instancedipdup.context.HandlerContextclass dipdup.context.HandlerContext(config, package, datasources, transactions, logger, handler_config)Execution context of handler callbacks.Parameters:config (DipDupConfig) – DipDup configurationpackage (DipDupPackage) – DipDup packagedatasources (dict[str, Datasource[Any]]) – Mapping of available datasourcestransactions (TransactionManager) – Transaction manager (don’t use it directly)logger (Logger) – Context-aware logger instancehandler_config (HandlerConfig) – Configuration of the current handlerdipdup.context.HookContextclass dipdup.context.HookContext(config, package, datasources, transactions, logger, hook_config)Execution context of hook callbacks.Parameters:config (DipDupConfig) – DipDup configurationpackage (DipDupPackage) – DipDup packagedatasources (dict[str, Datasource[Any]]) – Mapping of available datasourcestransactions (TransactionManager) – Transaction manager (don’t use it directly)logger (Logger) – Context-aware logger instancehook_config (HookConfig) – Configuration of the current hookdipdup.context.DipDupContext.add_contractasync DipDupContext.add_contract(kind, name, address=None, typename=None, code_hash=None)Adds contract to the inventory.Parameters:kind (Literal['tezos', 'evm', 'starknet']) – Either ‘tezos’ or ‘evm’ or ‘starknet’ allowedname (str) – Contract nameaddress (str | None) – Contract addresstypename (str | None) – Alias for the contract scriptcode_hash (str | int | None) – Contract code hashReturn type:Nonedipdup.context.DipDupContext.add_indexasync DipDupContext.add_index(name, template, values, first_level=0, last_level=0, state=None)Adds a new index from template.Parameters:name (str) – Index nametemplate (str) – Index template to usevalues (dict[str, Any]) – Mapping of values to fill template withfirst_level (int) – First level to start indexing fromlast_level (int) – Last level to indexstate (Index | None) – Initial index state (dev only)Return type:Nonedipdup.context.DipDupContext.execute_sqlasync DipDupContext.execute_sql(name, *args, **kwargs)Executes SQL script(s) with given name.If the name path is a directory, all .sql scripts within it will be executed in alphabetical order.Parameters:name (str) – File or directory within project’s sql directoryargs (Any) – Positional arguments to pass to the scriptkwargs (Any) – Keyword arguments to pass to the scriptReturn type:Nonedipdup.context.DipDupContext.execute_sql_queryasync DipDupContext.execute_sql_query(name, *args)Executes SQL query with given name included with the projectParameters:name (str) – SQL query name within sql directoryvalues – Values to pass to the queryargs (Any)Return type:Anydipdup.context.DipDupContext.fire_hookasync DipDupContext.fire_hook(name, wait=True, **kwargs)Fire hook with given name and arguments.Parameters:name (str) – Hook namewait (bool) – Wait for hook to finish or fire and forgetkwargs (Any) – Hook argumentsReturn type:Nonedipdup.context.DipDupContext.get_abi_etherscan_datasourceDipDupContext.get_abi_etherscan_datasource(name)Get evm.etherscan datasource by nameParameters:name (str) – Name of the datasourceReturn type:EvmEtherscanDatasourcedipdup.context.DipDupContext.get_coinbase_datasourceDipDupContext.get_coinbase_datasource(name)Get coinbase datasource by nameParameters:name (str) – Name of the datasourceReturn type:CoinbaseDatasourcedipdup.context.DipDupContext.get_evm_node_datasourceDipDupContext.get_evm_node_datasource(name)Get evm.node datasource by nameParameters:name (str)Return type:EvmNodeDatasourcedipdup.context.DipDupContext.get_evm_subsquid_datasourceDipDupContext.get_evm_subsquid_datasource(name)Get evm.subsquid datasource by nameParameters:name (str)Return type:EvmSubsquidDatasourcedipdup.context.DipDupContext.get_http_datasourceDipDupContext.get_http_datasource(name)Get http datasource by nameParameters:name (str) – Name of the datasourceReturn type:HttpDatasourcedipdup.context.DipDupContext.get_ipfs_datasourceDipDupContext.get_ipfs_datasource(name)Get ipfs datasource by nameParameters:name (str) – Name of the datasourceReturn type:IpfsDatasourcedipdup.context.DipDupContext.get_tzip_metadata_datasourceDipDupContext.get_tzip_metadata_datasource(name)Get metadata datasource by nameParameters:name (str) – Name of the datasourceReturn type:TzipMetadataDatasourcedipdup.context.DipDupContext.get_tezos_tzkt_datasourceDipDupContext.get_tezos_tzkt_datasource(name)Get tezos.tzkt datasource by nameParameters:name (str)Return type:TezosTzktDatasourcedipdup.context.DipDupContext.reindexasync DipDupContext.reindex(reason=None, **context)Drops the entire database and starts the indexing process from scratch.Parameters:reason (str | ReindexingReason | None) – Reason for reindexing in free-form stringcontext (Any) – Additional information to include in exception messageReturn type:Nonedipdup.context.DipDupContext.restartasync DipDupContext.restart()Restart process and continue indexing.Return type:Nonedipdup.context.DipDupContext.rollbackasync DipDupContext.rollback(index, from_level, to_level)Rollback index to a given level reverting all changes made since that level.Parameters:index (str) – Index namefrom_level (int) – Level to rollback fromto_level (int) – Level to rollback toReturn type:Nonedipdup.context.DipDupContext.update_contract_metadataasync DipDupContext.update_contract_metadata(network, address, metadata)Inserts or updates corresponding rows in the internal dipdup_contract_metadata table to provide a generic metadata interface (see docs).Parameters:network (str) – Network name (e.g. mainnet)address (str) – Contract addressmetadata (dict[str, Any] | None) – Contract metadata to insert/updateReturn type:Nonedipdup.context.DipDupContext.update_token_metadataasync DipDupContext.update_token_metadata(network, address, token_id, metadata)Inserts or updates corresponding rows in the internal dipdup_token_metadata table to provide a generic metadata interface (see docs).Parameters:network (str) – Network name (e.g. mainnet)address (str) – Contract addresstoken_id (str) – Token IDmetadata (dict[str, Any] | None) – Token metadata to insert/updateReturn type:NonePreviousConfigNextHTTP APIHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
