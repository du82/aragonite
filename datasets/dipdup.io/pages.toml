["https://dipdup.io/docs/release-notes/v8.1"]
title = "8.1 · DipDup Docs"
description = "This release was created during the ODHack 8.0 event by the following participants:"
full_description = '''Table of ContentsChanges since 8.0AddedFixedRelease Notes: 8.1This release was created during the ODHack 8.0 event by the following participants:@bigherc18 contributed support for database migrations using the Aerich tool. This optional integration allows to manage database migrations with the dipdup schema commands. See the Migrations section to learn to enable and use this integration.@JoE11-y contributed an interactive config generator. Now you can create a working DipDup config without knowing the syntax, just answering the questions. Run dipdup new command and choose "Interactively" to try it out.@tosoham contributed the hide and hide_internal config options to make tables/views private in Hasura API. See the Hasura config reference.@MrRoudyk contributed improvements to the version checker, so you'll never miss an update. And @fabrobles92 improved the readability of app reports.Thank you!Changes since 8.0Addedcli: Added schema subcommands to manage database migrations: migrate, upgrade, downgrade, heads and history.cli: Added interactive mode for new command.database: Support database migrations using aerich.evm.etherscan: Try to extract ABI from webpage when API call fails.hasura: Added hide and hide_internal config options to make specified tables/views private.Fixedcli: Don't wrap exceptions with CallbackError to avoid shadowing the original exception.cli: Fixed --template option being ignored when --quiet flag is set.cli: Fixed progress estimation logging.cli: Reload constants in dipdup.env after applying env-files.config: Fixed parsing config files after updating to pydantic 2.10.3.config: Fixed setting default loglevels when logging is a dict.config: Fixed starknet index validation error.context: Allow to add Starknet contracts in runtime.database: Ignore non-existent immutable table on schema wipe.evm.subsquid: Fixed empty field base conversion on event deserialization.evm.subsquid: Fixed type of timestamp field of event/transaction models.evm: Fixed parsing tuple types in ABI.evm: Fixed sending JSONRPC requests via web3.py provider.metrics: Fixed indexed objects counter.starknet.events: Fixed event ID calculation.starknet: Added support for struct and array types, as well as u256 and ByteArray handlers.starknet: Fixed event payload parsing (account for keys field).starknet: Fixed missing class property in node datasource.starknet: Fixed parsing contract addresses starting with 0x0.See you soon! 👋DipDup is a free open-source software created by the community and for the community. Join our socials to discuss this release, ask any questions, or participate in development.Twitter | Discord | GitHubPrevious8.2Next8.0Help and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
