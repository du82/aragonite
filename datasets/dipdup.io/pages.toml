full_description = "Demo projectsYou can start with DipDup by using one of the demo projects, basic indexer examples for various real-case scenarios. Run dipdup new to create a new project and choose one of the available demos.WarningDo not use the demo projects in production unmodified! They are intended to help you understand how to use DipDup and get started with your project.namenetworkdescriptionsourcedemo_blankEmpty config for a fresh startlinkdemo_evm_eventsEVMERC-20 token transfers (from event logs)linkdemo_evm_transactionsEVMERC-20 token transfers (from transactions)linkdemo_evm_uniswapEVMUniswap V3 pools, positions, etc. (advanced, uses TimescaleDB)linkdemo_starknet_eventsStarknetERC-20 token transfers (from events)linkdemo_substrate_eventsSubstrateSubstrate balance transferslinkdemo_tezos_auctionTezosNFT marketplace (TzColors)linkdemo_tezos_daoTezosDAO registry (Homebase DAO)linkdemo_tezos_dexTezosDEX balances and liquidity (Quipuswap)linkdemo_tezos_domainsTezosDomain name service (Tezos Domains)linkdemo_tezos_etherlinkTezosEtherlink smart rollup transactionslinkdemo_tezos_eventsTezosProcessing contract eventslinkdemo_tezos_factoriesTezosExample of spawning indexes in runtimelinkdemo_tezos_headTezosProcessing head block metadata (realtime only)linkdemo_tezos_nft_marketplaceTezosNFT marketplace (hic at nunc)linkdemo_tezos_rawTezosProcess raw operations without filtering and typed payloadslinkdemo_tezos_tokenTezosFA1.2 token contract operationslinkdemo_tezos_token_balancesTezosFA1.2 token balanceslinkdemo_tezos_token_transfersTezosFA1.2 token transferslinkPreviousModelsNextIn productionHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
