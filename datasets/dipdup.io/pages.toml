full_description = "BlockvisionNoteExamples below are for Ethereum mainnet. For other supported networks, see EVM Networks.Blockvision is multi-chain Node, Token, NFT, and DeFi API provider and data retrieval portal for developers. It provides a public API to fetch ABIs of verified contracts. DipDup can use its API to fetch ABIs for contracts being indexed.To use this datasource, add the following section in config:dipdup.yamldatasources: blockvision: kind: evm.blockvision url: https://monad-api.blockvision.org/testnet/api During initialization, DipDup will use this datasource to fetch contract ABIs. If your config contains definitions for multiple networks, you can assign the datasource explicitly in evm index definitions:dipdup.yamlindexes: evm_events: kind: evm.events datasources: - blockvision ... html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousEVM: EtherscanNextEVM: SourcifyHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
