["https://dipdup.io/docs/getting-started/config"]
title = "Config · DipDup Docs"
description = "Developing a DipDup indexer begins with creating a YAML config file of a specific format. DipDup expects it to be located in the project root and named dipdup.yaml. However, you can provide any path with a -c CLI option."
full_description = '''Table of ContentsStructureMerging multiple filesEnvironment variablesContract typenamesReindexingAdvanced optionsConfigDeveloping a DipDup indexer begins with creating a YAML config file of a specific format. DipDup expects it to be located in the project root and named dipdup.yaml. However, you can provide any path with a -c CLI option.StructureConfig consists of multiple top-level mappings. In the table below they are grouped by sections for convenience, but in the config file, they can be in any order. The only required section is Header.See Config reference guide for the full list of available options.Headerspec_version*DipDup project specification; currently "3.0"package*Python package nameInventorydatabaseDatabase configurationcontractsContracts that need to be indexeddatasourcesDatasources to gather information fromIndexesindexesIndex definitionstemplatesAlso index definitions, but with placeholders that make them reusableHookshooksCallbacks to run manually or by schedulejobsSchedules for hooksIntegrationsapiInternal API configurationhasuraHasura GraphQL Engine configurationsentrySentry configurationprometheusPrometheus configurationMiscellaneousadvancedTunables that affect framework behaviorcustomMapping of user-defined values; neither typed nor validatedloggingConfigure logging verbosityMerging multiple filesDipDup allows you to customize the configuration for a specific environment or workflow. It works similarly to docker-compose anchors but only for top-level sections. If you want to override a nested property, you need to recreate a whole top-level section. To merge several DipDup config files, provide the -c command-line option multiple times:Terminaldipdup -c dipdup.yaml -c configs/dipdup.sqlite.yaml run # or, using a shorthand dipdup -C sqlite run Use config export and config env commands to check the resulting config used by DipDup.Environment variablesFor the list of variables to configure DipDup see this page.DipDup supports compose-style variable expansion with an optional default value. Use this feature to store sensitive data outside of the configuration file and make your app fully declarative. If a required variable is not set, DipDup will fail with an error. You can use these placeholders anywhere throughout the configuration file.dipdup.yamldatabase: kind: postgres host: ${POSTGRES_HOST:-localhost} password: ${POSTGRES_PASSWORD} There are multiple ways to pass environment variables to DipDup:Export them in the shell before running DipDupCreate the env file and pass it to DipDup with the -e CLI optionFor every config file in the deploy project directory, DipDup will create a corresponding .env.default file with all the variables used in the config. Copy it, remove the .default suffix and fill in the values.deploy/.env.defaultPOSTGRES_HOST=localhost POSTGRES_PASSWORD= You can use dipdup -e .env config export --unsafe command to ensure that env variables resolve as expected, but avoid sharing the output with third parties.Contract typenamestypename is an alias for the particular contract script, meaning that two contracts sharing the same code can have the same type name. If this field is not set, a contract alias will be used instead.dipdup.yamlcontracts: kusd_dex_mainnet: kind: tezos address: KT1CiSKXR68qYSxnbzjwvfeMCRburaSDonT2 typename: quipu_fa12 tzbtc_dex_mainnet: kind: tezos address: KT1N1wwNPqT5jGhM91GQ2ae5uY8UzFaXHMJS typename: quipu_fa12 If multiple contracts you index have the same interface but different code, see F.A.Q. to learn how to avoid conflicts.ReindexingIn some cases, DipDup can't proceed with indexing without a full wipe. Several reasons trigger reindexing:reasondescriptionmanualReindexing triggered manually from callback with ctx.reindex.migrationApplied migration requires reindexing. Check release notes before switching between major DipDup versions to be prepared.rollbackReorg message received from datasource and can not be processed.config_modifiedOne of the index configs has been modified.schema_modifiedDatabase schema has been modified. Try to avoid manual schema modifications in favor of SQL scripts.It is possible to configure desirable action on reindexing triggered by a specific reason.actiondescriptionexception (default)Raise ReindexingRequiredError and quit with error code. The safest option since you can trigger reindexing accidentally, e.g., by a typo in config. Don't forget to set up the correct restart policy when using it with containers.wipeDrop the whole database and start indexing from scratch. Be careful with this option!ignoreIgnore the event and continue indexing as usual. It can lead to unexpected side-effects up to data corruption; make sure you know what you are doing.To configure actions for each reason, add the following section to the DipDup config:advanced: reindex: manual: wipe migration: exception rollback: ignore config_modified: exception schema_modified: exception Advanced optionsFlags related to the project are set in the advanced section of the config (most likely in dipdup.yaml).flagdescriptionearly_realtimeEstablish realtime connection and start collecting messages while sync is in progress (faster, but consumes more RAM).decimal_precisionOverwrite precision if it's not guessed correctly based on project models.postpone_jobsDo not start job scheduler until all indexes reach the realtime state.rollback_depthA number of levels to keep for rollback.unsafe_sqliteDisable journaling and data integrity checks. Use only for testing.html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}PreviousCore conceptsNextPackageHelp and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense'''
year_published = 2025
clearnet = "https://dipdup.io/docs/getting-started/config"
