title = "In production · DipDup Docs"
description = "This page is a brief overview of projects that use DipDup as an indexing solution."
full_description = "Table of ContentsRarible / Tezos marketplace indexerUbisoft / Quartz tokens metadataYouvesKord.fiStakeNowMavrykVersumYupanaHicDEX (Teia)HomebaseTezos ProfilesJustertz1andTezotopiaBuilt with DipDupThis page is a brief overview of projects that use DipDup as an indexing solution.Want to see your project on this page? Create an issue on GitHub!Rarible / Tezos marketplace indexerHomepage | GitHubRarible is a multichain community-centric NFT marketplace, that also allows to trade on aggregated listings from other NFT platforms. Rarible uses a DipDup-based solution to aggregate sales and auctions from major Tezos marketplaces.Rarible: on Tezos indexingUbisoft / Quartz tokens metadataHomepage | API | GitHubUbisoft Quartz is a new platform for players to get Digits, the first NFTs playable in AAA games. Under the hood, Quartz uses Aleph as persistent token metadata storage and a non-standard token metadata signaling schema. To enable wallets and other TzKT API consumers with Quartz NFTs data we created a custom indexing plugin.Metadata interfaceYouvesHomepage | GitHubYouves is a decentralized, non-custodial and self-governed platform for the creation and management of synthetic assets. Youves uses a DipDup-based solution to track vaults, DEX trades, and oracle price quotes.Kord.fiHomepageKord.Fi is a DeFi protocol for Tezos that allows liquidity providers to tap into additional leverage provided by Tezos Blockchain asset owners.StakeNowHomepageStakeNow.fi gives you a 360° view of your investments and lets you manage your Tezos assets in one place.MavrykHomepageMavryk is a DAO-operated financial ecosystem that lets users borrow and earn on their terms while participating in the governance of the platform.VersumHomepageVersum combines features of NFT platforms and social platforms to introduce a marketplace that focuses on organic discovery, decentralized storage, and accessibility.YupanaHomepageYupana.Finance is an open-source, decentralized, and non-custodial liquidity protocol built to securely lend and borrow digital assets via smart contracts.HicDEX (Teia)Homepage | API | GitHubHicDEX is a Tezos indexer for hicetnunc.art marketplace (currently teia.art). Indexed data is available with a public GraphQL endpoint.Hicdex: the Hic Et Nunc indexer (Medium)HomebaseHomepage | GitHubHomebase is a web application that enables users to create and manage/use DAOs on the Tezos blockchain. This application aims to help empower community members and developers to launch and participate in Tezos-based DAOs.Tezos ProfilesHomepage | API | GitHubTezos Profiles enables you to associate your online identity with your Tezos account.JusterHomepage | API | GitHubJuster is an on-chain smart contract platform allowing users to take part in an automated betting market by creating events, providing liquidity to them, and making bets.tz1andHomepage | API | GitHubA Virtual World and NFT Marketplace.TezotopiaHomepageTezotopia is a Tezos-based Real-Time Strategy (RTS) gaming platform that allows players to acquire land (Tezotops), items and resources.PreviousDemosNext8.2Help and tips -> Join our Discord Ideas or suggestions -> Issue Tracker GraphQL IDE -> Open PlaygroundDipDup—ChangelogContributionLicense"
