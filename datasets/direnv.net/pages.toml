["https://direnv.net/man/direnv-fetchurl.1.html"]
title = "DIRENV-FETCHURL 1 “2019” direnv “User Manuals” | direnv"
description = "unclutter your .profile"
full_description = "This command downloads the given URL into a fixed disk location, based on the content of the retrieved file. This has been introduced to avoid a dependency on curl or wget, while also promoting a more secure way to fetch data from the Internet. Use this instead of curl <url> | sh. Since the on-disk location is based on the hash, it also acts as a cache. One implication of this design is that URLs must be stable and always return the same content. Downloaded files are marked as read-only and executable so it can also be used to fetch and execute static binaries. If the integrity-hash is being passed, it will output the path to the on-disk location, if the retrieval was successful. If only the url is being passed, it will output the hash as well as some human-readable instruction. If stdout is not a tty, only the hash will be displayed. XDG_CACHE_HOME This variable is used to select the on-disk location of the fetched URLs as $XDG_CACHE_HOME/direnv/cas. If XDG_CACHE_HOME is unset or empty, defaults to $HOME/.cache."
year_published = 2025
