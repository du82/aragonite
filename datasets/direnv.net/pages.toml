["https://direnv.net/man/direnv.toml.1.html"]
title = "DIRENV.TOML 1 “2019” direnv “User Manuals” | direnv"
description = "unclutter your .profile"
full_description = "A configuration file in TOML format to specify a variety of configuration options for direnv. The file is read from $XDG_CONFIG_HOME/direnv/direnv.toml (typically ~/.config/direnv/direnv.toml). The configuration is specified in sections which each have their own top-level tables, with key/value pairs specified in each section. This allows one to hard-code the position of bash. It maybe be useful to set this to avoid having direnv to fail when PATH is being mutated. If set to true, also look for and load .env files on top of the .envrc files. If both .envrc and .env files exist, the .envrc will always be chosen first. If set to true, the .envrc will be loaded with set -euo pipefail. This option will be the default in the future. Specify how long to wait before warning the user that the command is taking too long to execute. Defaults to “5s”. A duration string is a possibly signed sequence of decimal numbers, each with optional fraction and a unit suffix, such as “300ms”, “-1.5h” or “2h45m”. Valid time units are “ns”, “us” (or “µs”), “ms”, “s”, “m”, “h”. This feature is disabled if the duration is lower or equal to zero. Will be overwritten if the environment variable DIRENV_WARN_TIMEOUT is set to any of the above values. Set to true to hide the diff of the environment variables when loading the .envrc. Defaults to false. Specifying whitelist directives marks specific directory hierarchies or specific directories as “trusted” – direnv will evaluate any matching .envrc files regardless of whether they have been specifically allowed. This feature should be used with great care, as anyone with the ability to write files to that directory (including collaborators on VCS repositories) will be able to execute arbitrary code on your computer. Accepts an array of strings. If any of the strings in this list are a prefix of an .envrc file’s absolute path, that file will be implicitly allowed, regardless of contents or past usage of direnv allow or direnv deny."
year_published = 2025
