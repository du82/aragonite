["https://direnv.net/man/direnv-stdlib.1.html"]
title = "DIRENV-STDLIB 1 “2019” direnv “User Manuals” | direnv"
description = "unclutter your .profile"
full_description = "Outputs a bash script called the stdlib. The following commands are included in that script and loaded in the context of an .envrc. In addition, it also loads the file in ~/.config/direnv/direnvrc if it exists. Returns 0 if the command is available. Returns 1 otherwise. It can be a binary in the PATH or a shell function. Outputs the path of filename when searched from the current directory up to /. Returns 1 if the file has not been found. Logs error for every variable not present in the environment or having an empty value. Typically this is used in combination with source_env and source_env_if_exists. Loads another script from the given url. Before loading it will check the integrity using the provided integrity-hash. To find the value of the integrity-hash, call direnv fetchurl <url> and extract the hash from the outputted message. Applies the environment generated by running argv as a command. This is useful for adopting the environment of a child process - cause that process to run “direnv dump” and then wrap the results with direnv_load. Prepends the expanded path to the PATH environment variable. It prevents a common mistake where PATH is replaced by only the new path. Prepends the expanded path to the MANPATH environment variable. It takes care of man-specific heuritic. Removes directories that match any of the given shell patterns from the PATH environment variable. Order of the remaining directories is preserved in the resulting PATH. Expands some common path variables for the given prefix_path prefix. This is useful if you installed something in the prefix_path using ./configure --prefix=$prefix_path && make install and want to use it in the project. Adds “$(direnv_layout_dir)/go” to the GOPATH environment variable. And also adds “$PWD/bin” to the PATH environment variable. Setup environment variables required by perl’s local::lib See http://search.cpan.org/dist/local-lib/lib/local/lib.pm for more details. Similar to layout python, but uses Pipenv to build a virtualenv from the Pipfile located in the same directory. The path can be overridden by the PIPENV_PIPFILE environment variable."
year_published = 2025
