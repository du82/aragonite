["https://dirtyelectronics.org/work/mute4.html"]
title = "Mute 4.0 Synth | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "The Dirty Electronics Mute 4.0 Synth is a synth with inputs, a digital wavetable synthesiser, an analogue noise circuit, and programmable sequencer. These features can all be combined in an environment to experiment with sound. The Mute 4.0 Synth is on-going research by Dirty Electronics into making music with wires and code, objects and materials; and an artwork printed circuit board collaboration with Mute Records, Adrian Shaughnessy and Regular Practice. Printed circuit board meets album cover. Dirty Electronics Voltage Collection The Synth also contains a voltage collection that could be thought of as composition, group of sequences, set of data, range of patterns, or fancy pre-set. The extended sequences, the longest being 1440-steps, automate the synth making a generative artwork. The sequences are built around a three-part form and themes of movement, stasis and repetition; and the five sequences present the themes in different orders often working against each other. There is no end as such to the Collection. Each of the five sequences is different in length resulting in shifting relationships between them as they loop. However, the Collection is open to interpretation. It is intended, not only to be listened to, but also interacted with. This interaction may take the form of bypassing individual sequences, simply mixing the Synth’s sound sources or changing the overall tempo of the sequences. Method of generating arrays (written in Max/MSP): one random function combined with other functions/random functions (example pdf)"
year_published = 2025
clearnet = "https://dirtyelectronics.org/work/mute4.html"
tags = ["collection", "dirty", "electronics", "voltage"]
language = "en"
