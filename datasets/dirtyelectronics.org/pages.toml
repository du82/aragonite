["https://dirtyelectronics.org/shop/radical22.html"]
title = "Radical22 | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Second edition June 2023. 32 new programs (64 in total). Existing owners (first edition) email for free chip update (P&P not included) A voltage controlled digital noise module ... 64 programs (second edition) with unique characters and chaotic behaviours ... Features digital noise 64 programs/algorithms 2 CVs (pots + CVs in) - program control 1 CV (pot + CV in) - program select CV shaping - attenuation, offset, invert artwork panel - white silk screen on black with immersion gold Spec power con. +12V: <33mA, -12V: <26mA 10pin power connector (diode protected) 14HP depth 40mm (including power connector) output DC coupled centred @0V The Radical22 goes from sharp clicks to glitchy fm to an mp3 wash to harsh noise to video game sawteeth, to silence. The module has 64 programs/algorithms that can be selected by a control voltage. Each program has a unique characteristic and chaotic behaviour that can be selected and explored through control voltages. The Radical22 is ongoing work by Dirty Electronics and Max Wainwright born out of the idea of Microcomputer Music: a music made from mini microprocessors and raw electronics that is always in-flux, noisy and may be overwritten."
