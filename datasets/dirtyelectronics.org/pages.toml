["https://dirtyelectronics.org/work/solder_score.html"]
title = "Solder a Score | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Dirty Electronics Solder a Score, part of Notation and Interpretation Festival, Institute of Contemporary Arts (ICA), London, Lower Gallery, 16 - 20 February, 2011. Residency that included compositions, the design and creation of an electronic sound device, public performance, an article and video installation. Solder a Score continued with many of the themes I have been developing as Dirty Electronics: composing inside electronics, creating an artistic environment for shared experiences; and exploring the boundaries between artwork and circuit board. This included asking the questions: “What is an instrument?”, “How might a collective building process and touch-based instrument create new paradigms for performance?” and “What constitutes a score, and how a predetermined electronics schematic could be viewed as a schema for a generative musical process?” The work also covered the design of a sound device that could become part of a networked system, symbolically reflecting the social engagement of the collective building process. Lead and Schemas. Short video showing rehearsals, factory production of instrument and residency at the ICA. Includes music composition. Twisted Bodies Carry Electricity (video/performance). Performed by Eleonara Oreggio, Shidan Ye and Dirty Electronics. Exhibition Notation and Interpretation Festival, Institute of Contemporary Arts (ICA), London, Lower Gallery, 16 - 20 February, 2011. Collaboration with illustrator Natalie Kay-Thatcher showing interpretations of Dirty Electronics' scores and schematics, Ribbon Cable, I Love You and Skull Etching."
