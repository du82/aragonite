["https://dirtyelectronics.org/work/dark_elec.html"]
title = "Dark Electronics | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Darkness - a room without a window Make a sound circuit Blow into a whistle to generate electric current, light and sound A collective performance An all-day event making a Dirty Electronics’ sound and light circuit in oblique conditions. What happens when darkness descends on our workbench? And mains electricity becomes scarce and precious? Dirty Electronics’ and Kanta Horio’s Dark Electronics is an event where the making is set out like a score with preconditions. These preconditions are designed to test and challenge us. A performance unfolds. The preconditions will: Force the simplification of designs and constructs Question optimisation and efficiency in production Act as a call for collective action and do-it-together (DIT) Critique maker culture and tokenistic making Celebrate the hand-made and manual labour Emphasise touch and listening Create a holistic practice of making and performing"
