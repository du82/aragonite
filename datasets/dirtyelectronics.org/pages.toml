["https://dirtyelectronics.org/work/making_for_radio.html"]
title = "Making for Radio | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Making for Radio is part-hoerspiel, part-performance, part-documentary about DIY electronic music culture. The making of an impossible and ‘real’ electronic instrument circuit become the starting points for the work. Processes, tools and their relationship to makers/musicians are crossed examined through short, humorous sketches and radio curios. Fact and fiction co-exist. There are musical interludes. The work brings together researchers and musicians from De Montfort University, Leicester, UK, and the Academy of Performing Arts (HAMU), Prague in a collaboration for Czech Radio. Making for Radio was recorded at the Czech Radio, Prague, 24 November 2017, and broadcast on Czech Radio 3 - Vltava, 6 December 2017. Performers: Anna Björn, Bruno Cunha, Matouš Hejl, Katie-Jane Howard, Monika Jagerova, Steve Jones, Nick Luscombe (voice recording), Luigi Marino, Johana Ožvold, Martin Ožvold, Amit Patel, Michal Rataj, John Richards, Samantha Topley, Maya Verlaak, Max Wainwright, et al. Making for Radio Workshop A workshop covering instrument making and rehearsals for the radio program was hosted by the Institute of Intermedia (IIM), Prague, 22-23 November 2017. Speculative Sound Circuits This article details Dirty Electronics’ Making for Radio that illustrates speculative sound circuits along with spontaneous and intuitive approaches to circuit building, rapid prototyping strategies, and making as a processual part of performance. The article was based on a keynote lecture given at the 51st International Musicological Colloquium, Masaryk University, Brno, October 2016 that was part lecture, part performance. Speculative Sound Circuits was presented at Politics of Machines / EVA Copenhagen, Aalborg University Copenhagen, 16 May 2018. Slippery Bows and Slow Circuits Article illustrating ongoing research into the making of electronic sound ‘through’ materials and exploring the material nature of electronic sound. The article also identifies various themes that are presented in the piece Making for Radio. Published in the Czech journal Musicologica Brunensia."
year_published = 2025
clearnet = "https://dirtyelectronics.org/work/making_for_radio.html"
