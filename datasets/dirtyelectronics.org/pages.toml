title = "Violations | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Violations instrument and composition were developed in stages. This involved a prototype version of the instrument named Colossus and a workshop variation, De Machinis. The versions of this piece are unified by the aim to develop a hybrid analogue/digital one button, one potentiometer programable sound object, investigating the material nature of electronic sound (particularly the idiosyncrasies of coding), and exploring the intersection between artwork printed circuit board and electronic sound object. Part of the initial work was presented in a co-authored paper at NIME conference, 2016. Disruption, intervention, transference, halfway-ness, violation - the conversion of data/sound from one medium to another and new material phenomena, trans-media, found in the hidden corners of esoteric technological processes. A feedback system is designed where audio of a sequenced pattern is used to re-program itself. Violations further explores how sound and/or code can collectively coalesce and gravitate or not towards a mean. The artwork for the printed circuit board takes inspiration from Arjun Appadurai's book The Social Life of Things, and the exploded-view illustrations of fifteenth century artist-engineer Mariano Taccola found in his De ingeneis (Concerning Engines) and De machinis (Concerning Machines)."
year_published = 2025
clearnet = "https://dirtyelectronics.org/work/violations.html"
