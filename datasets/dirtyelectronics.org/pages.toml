full_description = "Bad Buffer performance in a multi-storey car park with Louie Perillo. Heavy guitar, not-guitar Dirty Electronics-stylee. Yarmonics festival of sound and new music September 2024. Photo honor ash A performance-installation with Tim Shaw that explores ways to produce electronic sound without the use of conventional loudspeakers. Beyond the Loudspeaker was developed with Contemporary Musiking Hong Kong and presented at the Sound Forms Festival at Tai Kwun Contemporary November 2023 and Newcastle Contemporary Art March 2024. More ... Live music performance by Dirty Electronics, with film featuring butoh dancer Kazuo Ohno and photography by Bob Fujisaki ... a dialogue between moving image, sound, installed light and ‘impossible’ instruments. At IKLECTIK, London, October 2023 Performance-installation for spark-gap transmission and electromagnetic spectrum. London, Czechia, Austria, Slovakia. March/April 2023 (with Tim Shaw) Performance and sound installation for Not Necessarily in the Right Order, Stephen Lawrence Gallery, Greenwich, February 2023 (with Dushume) Curated research, composition, workshop, performance, text (with John Bowers, Tim Shaw, Robin Foster, Akihiro Kubota, et al) Eurorack synth module. Generative composition for microprocessor and artwork PCB (with Max Wainwright) Physical Edition - collaboration with Mute Records, composition and artwork PCB (with Adrian Shaughnessy and Regular Practice) Performance-installation tour UK (Newcastle, Birmingham, London, Bristol) and video documentary. Supported by Arts Council England (with Tetsuya Umeda and Tim Shaw). Composition for microprocessor, text to sound and artwork PCB. Performance with mini dot matrix printer. Commissioned by Noisexistance Festival, Hamburg (with Max Wainwright). Playing with graphics and sound - sound device, artwork PCB, and composition for microprocessor and analogue circuits. Collaboration with Jack Featherstone, bleep and production and technology studio Artists & 