["https://dirtyelectronics.org/work/radical_chip.html"]
title = "Radical Chip | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "The Radical Chip is a collection of digital wavetable synth sounds by Dirty Electronics and Max Wainwright originally conceived as a swappable chip for the Mute 4.0 Synth. There are 5 wavetables and 9 algorithms making 45 combinations that are randomly selected. The sounds range from gritty digital sounds and extreme noise to pure tones. The sounds may also be thought of as programs that have complex behaviours that can be interacted with through the Mute Synth’s controls. The Radical Chip can also be used with minimum components in a standalone DIY synth (see Radical Nails). The Radical Chip came with a limited edition A2 risograph printed poster/booklet on Microcomputer Music: a music made from mini microprocessors and raw electronics that is always in-flux, noisy and may be overwritten. Radical Nails The Radical Nails is a hardware mash-up of the Radical Chip and circuit construction using a variety of mixed materials such as wood, nails, wires and electronic components. Pop-up for Collaborative Music-making (with Amit Patel) Paper outlining the development of the Radical Nails that derived from original research undertaken for the Radical Chip and Mute 4.0 Synth. The paper also discusses the research themes of stand-alone sound objects as composition, making as a procedural part of performance and public making."
year_published = 2025
