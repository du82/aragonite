["https://dirtyelectronics.org/about.html"]
title = "About | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "John Richards explores Dirty Electronics focusing on shared experiences, social interaction and critical making. He is concerned with the performance of large-group electronic music and DIY electronics, and he has come to consider these activities as a holistic action. It is a fluid, live practice associated with the ideas of workshop-installation and performance-installation. His work pushes the boundaries between music, performance art, electronics, and graphic design and is transdisciplinary as well as having a socio-political dimension. He has also written numerous texts on DIY practices, performance of electronic music, and object-orientated and material approaches in relation to sound art. As Dirty Electronics, Richards has created sound devices for various arts organisations and festivals. He released a series of hand-held synths on Mute Records in collaboration with the designer and writer Adrian Shaughnessy. Other significant artwork/sound circuits have included: the Sonar 20th Anniversary Synth for the electronic music festival Sonar; and Polytik, collaboration with graphic designer Jack Featherstone and Artists & Engineers. Richards considers these devices as 'physical editions', an embodiment and means of dissemination of musical ideas. He has collaborated and performed with, amongst others, Merzbow, Pauline Oliveros, Howard Skempton (founder member of the Scratch Orchestra), Gabriel Prokofiev, Anna Meredith, Nicholas Bullen, Kanta Horio, Tetsuya Umeda and Yan Jun. Other notable collaborations include working with Rolf Gehlhaar (original Stockhausen group), Chris Carter from Throbbing Gristle, Keith Rowe, Anat Ben-David, Makoto Nomura, Stu Smith (ASMO), Dushume (Amit D Patel), Max Wainwright, Tim Shaw and Afrorack (Brian Bamanya). In 2023, he relased an album with Oliver Torr on Mille Plateuax. He has also worked closely with illustrator Natalie Kay-Thatcher and film director Johana Ožvold (The Sound is Innocent)."
year_published = 2025
clearnet = "https://dirtyelectronics.org/about.html"
