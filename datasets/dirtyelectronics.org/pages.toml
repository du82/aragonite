["https://dirtyelectronics.org/work/sacrificial.html"]
title = "Sacrificial Floors | Dirty Electronics"
description = "Music for DIY Electronics"
full_description = "Sacrificial Floors and Tables: Making/Unmaking Sound (book chapter) Book chapter that sets out a definition of performance-installation and explores making as a processual part of performance. Improvisation through Performance-installation (text/article) Also discusses Points of Failure Tour, February 2020 (with Tim Shaw) Sacrificial Floors Tour, 26-30 September 2018 A UK tour with Tetsuya Umeda and Tim Shaw funded by Arts Council England exploring the themes outlined in the chapter Sacrificial Floors and Tables: unmaking sound. A floor strewn with beer cans, bits of scrap metal, ceramic bowls, curious, miscellaneous electronics and wires: a collection of sundry things to make sound. Tetsuya Umeda, Dirty Electronics and Tim Shaw create a series of performance-installations that embrace ‘working in public’. Objects and things are explored in situ, in time, in memory. There is a prioritisation of sound. It is only through the dismantling and analyzing of things that we may understand their structure ... making and unmaking become a processual part of performance. This unique collaboration focuses on performing in ‘each other spaces’; and how prototypic, extended electronic circuits and technological processes may intersect with materials and physical objects within a space. Dates 2018: Newcastle, 26 Sept, Northern Charter / Birmingham, 28 Sept, Centrala / London, 29 Sept, IKLECTIK / Bristol, 30 Sept, Arnolfini."
year_published = 2025
