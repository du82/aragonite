title = "ASP.NET Core 9 and ASP.NET 4.8.x Support for Shared .NET Hosting Plans"
description = "ASP.NET hosting - ASP.NET Core 9 Hosting, ASP.NET Core 8 Hosting, ASP.NET Core 7 Hosting, ASP.NET 4.8.x Hosting"
full_description = "ASP.NET Core is a complete rewrite of ASP.NET from the ground up. It's a leaner, meaner .NET. We support both framework-dependent deployment and self-contained deployment. We maintain a list of .NET Core versions that are installed on the servers in our knowledge base. The latest .NET Core version we support is ASP.NET Core 9.x. If the ASP.NET Core version you are using is not on the list, then you can use self-contained deployment. If you are using Visual Studio 2013 to target ASP.NET 4.5.1, ASP.NET 4.5.2 is backward compatible with ASP.NET 4.5.1. If you are using Visual Studio 2012 to target ASP.NET 4.5, ASP.NET 4.5.2 is backward compatible with ASP.NET 4.5. .NET Framework 3.5 comes with the addition of Language Integrated Query (LINQ), which facilitates the process of building SQL queries. Complete with compiler and Intellisense support, LINQ makes relational data queries a first-class language construct in C# and Visual Basic. With .NET 3.5 hosting, what was previously an extension to the ASP.NET runtime, ASP.NET AJAX is now built into the platform and makes the complex task of building cross-platform, standards based AJAX applications that much easier. With ASP.NET AJAX, developers can quickly create pages with sophisticated user interfaces and efficient client-server communication by adding a few server controls to their pages. New ListView control provides flexibility in displaying data, by enabling complete control over the HTML markup generated. In addition, the DataPager control can handle large-record page-throughs. With .NET Framework 3.5 hosting, Windows Communication Foundation (WCF) supports building Web services that can be exposed using standard protocols, such as SOAP, RSS, JSON, POX and more. The DiscountASP.NET ASP.NET hosting platform is compatible with the Microsoft Visual Studio 2008 family suite including Visual Studio 2008 and Visual Web Developer 2008 Express Edition. Data access can be accomplished declaratively (without code) using new data source controls. New data source controls can represent different data back ends such as SQL and XML, and there are new data-bound controls for rendering common UI for data, such as grids, details, and forms."
