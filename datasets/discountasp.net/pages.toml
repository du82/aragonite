full_description = 'Visual Studio 2015 supports building apps with ASP.NET Core. You can download the Visual Studio SDK here. Drag visual guides from rulers to precisely place elements and create custom layouts with ease. The XAML editor supports IntelliSense for databinding and resources and smart commenting. Use the Peek Definition command to view and edit code without having to switch away from the code that you are writing. When working with long code files, you can customize the code window scroll bar to give you a better view of what is happening in your code. VS 2013 includes .NET Framework memory analysis, enhanced unit test filtering, enhanced C++ code analysis rules categorization and filtering. Visual Studio adds search functions that span the entire environment including code, menus, dialog boxes and controlsâ€"but also extends across the entire environment. For more responsive applications, Visual Studio 2012 supports new async methods modifiers and wait operators in C# and Visual Basic languages. VS 2012 provides tooling for several different platform such as desktop, web, Windows Phone and Xbox 360. Visual Studio 2012 comes with .NET Framework 4.5 and will support developing applications targeting Windows 8. NOTE: Our platform is at .NET 4.5.2 now and is backward compatible with .NET 4.5. Project compatibility means that developers using different versions of Visual Studio can work together. The Microsoft team has worked hard to de-clutter the interface design so that you can remain focused on your development tasks without distraction. There are many application marketplaces such as the Windows Phone Marketplace for Windows Phone. Visual Studio 2012 offers integrated tools to publish applications to app stores so that you can expose your application to a large market. Document windows such as the Code Editor and the Design view window can float outside the IDE window, so you can drag the Code Editor and view it side by side with the Design view window. The new Code Editor makes code easier to read as you can zoom in on text and scroll with the mouse wheel. When you click a symbol in your code, all instances of that symbol are highlighted. A new Navigate To feature provides search-as-you-type support for files, types, and members. Navigate To enables you to take advantage of Camel casing and underscores to abbreviate your search text, so you can use for example, "AOH" to search for "AddOrderHeader."'
