["https://discountasp.net/asp.net-hosting/legacy-hosting/webmatrix"]
title = "Legacy Microsoft WebMatrix support at DiscountASP.NET ASP.NET Hosting"
description = "DiscountASP.NET ASP.NET Hosting plans support webmatrix hosting - sites built with Microsoft legacy publishing tool, WebMatrix."
full_description = "Microsoft WebMatrix is a free web development tool that includes everything you need for website development. You can choose to start with open source web applications, built-in web templates or just start writing code yourself. It should be noted that in August 2016, Microsoft announced their decision to deprecate WebMatrix in favor of their new free Visual Studio Code IDE. Microsoft will no longer be updating WebMatrix or fixing any bugs. Remote Site EditingYou can open your remote sites and make changes. And remote site editing includes full editing capabilities so it makes it feel like you are editing locally. Integrated with GitWebMatrix is now integrated with source control systems like Git which makes it even more convenient to publish your applications. Optimized for Open SourceTo get started developing websites easily, you can start with an open source application. WebMatrix takes the often time-consuming deployment of open source apps and simplifies installation with an auto-installer for a growing list of open source apps. This includes ASP.net apps like DotNetNuke, nopCommerce and BlogEngine as well as PHP apps like WordPress, Drupal, and Joomla...etc. Support for popular languages beyond ASP.NETWebMatrix is a Microsoft tool, so you would expect first class support for ASP.NET, which it has. However, WebMatrix also provides support for other commonly used languages such as PHP, HTML5, JQuery, CSS3 and even Node.js. Optimized for MobileWebMatrix helps you design your websites not only for the desktop, but also for these new mobile form factors. WebMatrix comes with mobile friendly templates, code-completion for jquery mobile, and mobile device emulators. ExtensionsWebMatrix supports extensions that extend its core functionality. Microsoft provides a means of extension discovery in their new Extension Gallery and also allows you to create your own extensions. WebMatrix Publish SettingsIn the DiscountASP.NET Control Panel you can navigate to the Account Info section and download the XML Web Deploy publish settings for WebMatrix."
