["https://discountasp.net/control-panel/api"]
title = "DiscountASP.NET Open Control Panel API Initiative for ASP.NET Hosting"
description = "DiscountASP.NET’s Open Control Panel Initiative for Shared Windows ASP.NET Hosting"
full_description = "DiscountASP.NET is proud to present the Open Control Panel InitiativeThe goal of the Open Control Panel Initiative is to offer an open hosting system framework which provides maximum control over your hosting presence management. With an Open Control Panel framework, you can move beyond accepting web hosting management via a host-defined web-based control panel and develop your own creative solutions. To support this initiative, DiscountASP.NET introduces the control panel API, a standards-based ASP.NET web service API library you can use to develop your own web, desktop, or mobile applications that interface directly with your web hosting account. News, resources, IIS: methods to display news and resource usage, and manage some aspects of Internet Information Services (IIS), such as recycling the application pool. (See this post in our Community Forum for more info.) SQL database backup: methods to backup SQL databases. Build your own web, desktop, or mobile applications for database backup without logging in to Control Panel. (See this post in our Community Forum for more info.) DNS controls: methods to manage DNS. Build your own web, desktop, or mobile applications for SQL backups and for DNS Management, including A, CNAME, MX, and TXT records. (See this post in our Community Forum for more info.) To demonstrate the use of the control panel API, we have released a sample application that can be downloaded from the DiscountASP.NET Community Forum. The download includes the binary executable as well as the complete source code. You are free to extend these applications. For example, the Usage Alert Tool is a systray application that allows you to set thresholds for various hosting resources such as bandwidth, disk space, email storage space and SQL database disk space. The tool displays an alert when the hosting account reaches any of the thresholds. With this tool, you no longer have to log into the web-based control panel to review resource usage. Access to the API is activated via Control Panel, in the Control Panel API section. You will be assigned a unique Authentication Key, as well as a Sandbox Key to test your applications without the risk of making changes to your hosting account."
