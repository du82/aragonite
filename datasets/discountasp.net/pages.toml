full_description = '''.NET Core is supported on Windows 2019/IIS10 and Windows 2016/IIS10. The latest .NET Core version we support is ASP.NET Core 9.x Most versions of Visual Studio, Visual Studio Community, Visual Studio Code, Visual Studio Express, and Visual Web Developer are supported. See our Visual Studio page for more information. Yes, and we provide a secure database directory that is configured to disallow direct downloading of .mdb files. It's worth noting though that Access databases were not designed for use on the web. We recommend migrating your Access data to Microsoft SQL or MySQL. Every account has an alternative FTP address that you can use to upload your files before your domain resolves to our servers. So you can get started right away whether you are registering a new domain or using an existing domain. Every account also has an alternative URL so you can view your site before your domain resolves to our servers. Perfect for testing your web site before pointing your domain to our servers. If you already own a domain name you do not have to transfer the name to us. You can continue the relationship with your current domain registrar and pay them for your domain renewals. To open an account using an existing domain name, use the "Use an existing domain name" option in our sign up form, and update your domain's name servers to point to our servers. You must specify a domain name when signing up for web hosting. You can purchase a new domain name, use an existing domain name that you have registered elsewhere, or use a domain name that you intend to register later. While we do support all traditional country code domains (.co, .tv, etc.), we do not currently support the new internationalized domain names (IDNs) that use languages other than English. For example, .рф, قطر., .இந்தியா, .新加坡. Domain registration fees are paid annually. When we register a domain name for you, we will lock the registration to prevent unauthorized changes and automatically renew it for as long as your hosting account remains open.'''
