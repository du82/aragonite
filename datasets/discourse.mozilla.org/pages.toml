full_description = "Category Topics Developer Tools Discussion of the Firefox Developer Tools. 594 Add-ons Discussions about add-on development, add-on support and addons.mozilla.org. You can also learn more about add-ons on MDN, or in the add-ons blog. 753 Common Voice Welcome to the Common Voice community forum. A space to collaborate, connect with members and engage in the weekly updates. This forum is multilingual, learn more on our readme. 1099 Firefox On Android A place for the Mozilla community to discuss Firefox, Fenix and GeckoView on Android 78 IAM Discussions about Mozilla's Identity and Access Management project. 155 Thunderbird Discussion of Thunderbird, an Email and communications platform for desktop. Here you can discuss the application, get mentorship on how to begin contributing, and offer up ideas and concepts for the future of the software. 388 Firefox Tooling Announcements Announcements of internal Firefox tooling changes. 145 Linux This category is for discussions around Linux in relation to Mozilla. 55 SpiderMonkey Discussions related to the JavaScript engine that powers Firefox and other software. How it works, how to contribute, how to use in other projects, and more. 48 Firefox Development Questions and answers about Firefox browser development. Come help us build the best web browser and the future of the Open Web. 624 Meta Discussion about this forum, its organization, how it works, and how we can improve it. 210 Mozillians This is the place for mozillians to gather, talk and discuss about any general topic around Mozilla Project and its products. 709 WebThings Discussion of WebThings, an open platform for monitoring and controlling devices over the web (webthings.io) 993 Fluent Fluent is a localization system designed to improve how software is translated. This Discourse category is a place to discuss the design of Fluent, plan the future versions and receive support. 73 Firefox Containers Test Pilot experiment for Firefox Containers https://wiki.mozilla.org/Security/Contextual_Identity_Project/Containers 106 MDN The MDN category is for discussing topics related to the MDN site. If you want to be involved in making MDN more awesome, please share your ideas, opinions, questions, etc. Please observe the Mozilla Community Participation Guidelines to create a safe and positive community for everyone. 913 Firefox Nightly Use Firefox Nightly, report bugs, build and empower a community of power-users all around the globe, let's discuss all things Nightly here! 84 Localization The primary forum for announcements, questions, and discussions all on localization and translation at Mozilla. 82 Community Portal This category is where we’ll share updates and solicit feedback, input and beta testers during the development of the new Community Portal - wiki page here. 79 Pontoon Feedback and support for pontoon.mozilla.org, and conversations on new developments. 111 Mozilla Festival Discussion about MozFest 2019 from 21 to 27 October. 14 Developer Community The Developer Community project by Mozilla aims to support developers and groups of developers around the world. 104 Communities Discussions for local communities. You can email to communities@mozilla-community.org to post to this category. 19 Community Ops Discussions relating to Community Ops 213 Accessibility This category is all about Firefox’s support for people with disabilities, temporary or permanent, and its support for assistive technologies such as screen readers. 13 Mozilla Brasil Olá, você é novo por aqui? 8 Open Policy + Advocacy Conversations about current and upcoming tech policy issues worldwide, and what we can do about them as a community. Join to connect and learn with others! Topics are not curated by Mozilla Policy or Advocacy teams. Please start a topic below. 17 SUMO Discussions for support.mozilla.org 228 Reps Category for Mozilla Reps to discuss about the program and activities. The Reps program is now closed 1153 people.mozilla.org Pu