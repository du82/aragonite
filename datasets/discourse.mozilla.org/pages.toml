full_description = "Mozilla Brasil Localização - L10n Traduzimos os projetos da Mozilla para o Português do Brasil. Resolução de conflitos Este é o lugar para avançarmos nessa ferramenta para que possamos melhorar nossa convivência, resolver problemas de comunicação, conflitos e ruídos. Sinta-se a vontade para colocar aqui sua idéia para tornar esse nosso conselho mais completo. SUMO Ajudamos usuários dos produtos da Mozilla respondendo dúvidas, criando e traduzindo artigos, tutoriais e dicas. Web Services Nós oferecemos soluções relacionadas a serviços web, como gerenciamento, manutenção e implementação de recursos no servidor de acordo com as políticas estabelecidas pelo time de Community Ops da Mozilla. WoMoz Trabalhamos com diversos projetos para incentivar e dar maior visibilidade a participação e contribuição de mulheres e minorias na Mozilla e no mundo open-souce. Topic Replies Views Activity About the Mozilla Brasil category Mozilla Brasil 4 2943 September 6, 2016 Firefox consumindo boa parte da memória quando o Telegram WEB fica um tempo no ar Resolução de conflitos 0 379 July 1, 2024 Idioma portugues-brasil Web Services 0 324 April 15, 2024 Mozilla HUBS Mozilla Brasil localization 0 833 September 13, 2022 Redes Sociais - Mozilla Brasil Mozilla Brasil 34 2095 August 12, 2022 Firefox não reconhece arquivo html? Resolução de conflitos 2 799 April 24, 2022 ! atualizações | news! Resolução de conflitos 2 917 July 2, 2021 Community in Brazil Mozilla Brasil 3 1006 July 2, 2021 Próximo Encontro da Comunidade Online Mozilla Brasil 0 672 June 28, 2021 Mozillians ativos na comunidade no Brasil Mozilla Brasil 13 968 June 27, 2021 Nova versão do Firefox Mozilla Brasil 4 1014 May 28, 2021 Poll feature Mozilla Brasil participation 0 677 December 22, 2020 Guia do Eleitor: 7 Dicas para Desintoxicar Seus Dados — Casa Hacker Mozilla Brasil 0 805 June 22, 2020"
