full_description = 'Q: Where can I buy a Discover digital subscription? A: Currently Kalmbach Publishing offers a digital subscription for Discover the website. To subscribe to the digital edition and receive unlimited access to the entire digital archive and website, please click here.Discover is also available on the Nook, Kindle, and through the Apple App Store and from Zinio. Q: Why is the digital price the same as print? A: Our digital site subscription provides access to the full content of the website and is not tied to the timing of a print magazine subscription. Therefore, an automated monthly payment is used to provide our site subscribers more flexibility in length of subscription term.Q: How do I access my digital issue through the Discover website? A: After subscribing, you can log in to the website using the Login link in the top right corner of the site header. If you have not yet registered on the site, you may do so by clicking “Create An Account” in the login window. Use the same name and email address you used when purchasing your subscription. Once registered, log in and click on "The Magazine" in the top left corner of the site header to access the current issue. Watch for subsequent emails to arrive on a bi-monthly basis alerting you that the new issue is ready to view.Q: What if I have a question about my digital subscription? A: You can visit Customer Service online here or via phone 800-829-9132 for further assistance. Q: If I’m a current print subscriber, can I add a digital subscription?A: Your print subscription already includes unlimited access to the entire Discover Digital Archive and website. You can, however, convert your print + digital subscription to digital only. Call Customer Service at 1-800-829-9132.Q: Can I convert my print subscription into a digital subscription?A: You can convert your print + digital subscription to digital only. Call Customer Service at 1-800-829-9132. Q: How do I cancel my print + digital or digital site subscription?A: You can visit Customer Service online here or via phone 800-829-9132 for further assistance.'
