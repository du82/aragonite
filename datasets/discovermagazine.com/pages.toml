["https://discovermagazine.com/about"]
title = "About Discover Magazine | Discover Magazine"
description = "Discover satisfies everyday curiosity with relevant and approachable science news, feature articles, photos and more."
full_description = "About UsFrom ancient history to modern technology, science is filled with things that make you stop, think, and wonder. Discover fuels this curiosity by sharing stories that enlighten, entertain, and inform our readers. But curiosity is not enough. We inspire readers to learn more, to share their knowledge, and to take action.At Discover, we believe science can and should be for everyone. For more than 40 years, we have reported on research, developments, and discoveries across all areas of scientific inquiry; we make it our mission to share the science that matters with you. Our team of dedicated science writers and editors works hard to uncover information worth sharing and worth knowing. We’re intensely curious about the world around us and share that curiosity through stories that are approachable, informative, and easy to understand.We invite everyone to discover the science that is making a difference in their lives and in the world around them.Our LegacyDiscover was launched in 1980, as the “news magazine of science.” Then as now, the magazine (and later, the website) served an engaged cohort of readers who were curious about science but were not necessarily scientists themselves. The brand has always strived to offer in-depth science journalism that is rich in detail yet written in a style that is accessible to a layperson. Discover continues that journalistic tradition today as part of LabX Media Group.Editorial PhilosophyDiscover remains true to its founding principles of providing deeply informative and engaging science content for a general consumer audience. Editors and writers work hard to make Discover stories accessible, framing information in an optimally understood and entertaining way. Whenever possible, Discover places particular emphasis on science topics that are directly relevant to readers’ lives, seen most clearly in coverage of medical and environmental topics. Discover editorial elicits and fuels curiosity, inspiring readers to embrace science in their everyday lives.Editorial StandardsDiscover’s editors and writers are passionate science communicators with decades of experience covering a broad range of scientific endeavors. Our team has experience writing and editing complex scientific topics that impact our daily lives. We are experts in choosing scientific studies that are timely, relevant to modern-day issues, or elicit curiosity about our ancient past. In a time of misinformation online, the team also identifies topics to debunk and explain with accurate information, and without regard to personal, political, or religious beliefs.Our writers use peer-reviewed studies and high-quality sources, referencing publications like the National Library of Medicine, Nature, PLOS One and others when compiling information for an article. In addition, they may reference news releases and reports on breaking science news and newly published research from scientific establishments. Whenever possible, our writers will interview qualified expert sources for insight and context.Discover editors review and fact-check each article for scientific accuracy, consistency and grammar to ensure that readers get an accurate, well-rounded view of the topic. Before each article is published online, it passes through at least two rounds of edits.We follow AP Style guidelines as well as Discover’s editorial style. We will always strive to include diverse voices and experts.Trust & TransparencyFrom its first issue more than four decades ago, Discover has fiercely maintained its reputation for and commitment to deeply reported, carefully vetted, fully unbiased science journalism. Our only agenda is to report current scientific news and research factually, in formats that are informative and accessible to everyone. Our reputation as a credible and trustworthy source of information has been independently verified many times over the years, most recently including a 100% green rating from NewsGuard, a global leader in the vetting of information reliability. This rating confirms Discover’s tireless commitment to the highest standards of journalistic credibility and transparency. (Credit: Newsguard)That being said, our writers and editors are only human, and errors can sometimes occur. Readers who believe they have found an error in our content can report such instances to editorial@discovermagazine.com. See our correction policy for more information. As a matter of transparency, we strictly adhere to privacy laws with regards to customer information and user data. Please visit our Privacy Policy page for more information. Contact UsDiscover Magazine Inc1000 N West Street Suite 1200, Wilmington DE 19801, United States.For customer questions about subscriptions or other Discover products, please call (800) 829-9132 or email DiscoverMagazine@Omeda.com.For editorial questions, email us at editorial@discovermagazine.com. Please note: Because of our privacy and security standards, editorial staff have no access to customer data and cannot assist with subscriber inquiries. For additional contact information, please visit our Contact page.View our staff page.For frequently asked questions, see our FAQ page."
