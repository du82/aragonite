full_description = 'Avery Hurt is a freelance science journalist. In addition to writing for Discover, she writes regularly for a variety of outlets, both print and online, including National Geographic, Science News Explores, Medscape, and WebMD. She’s the author of "Bullet With Your Name on It: What You Will Probably Die From and What You Can Do About It," Clerisy Press 2007, as well as several books for young readers. Avery got her start in journalism while attending university, writing for the school newspaper and editing the student non-fiction magazine. Though she writes about all areas of science, she is particularly interested in neuroscience, the science of consciousness, and AI–interests she developed while earning a degree in philosophy. Find her on socials @AveryHurt'
