description = "Discover satisfies everyday curiosity with relevant and approachable science news, feature articles, photos and more."
full_description = "At Discover, our writers, editors, and fact-checkers pride themselves on the factual accuracy of every story they produce. But despite our best efforts, honest mistakes can sometimes occur. If you think you’ve found one, please let us know by emailing us at editorial@discovermagazine.com. We take every such report seriously and promise to review the story in question quickly and carefully. In the event that our review process does indeed confirm an error, we will issue a correction. For errors appearing In the magazine, this will take the form of a printed correction in the next available issue. On the website, we will update the story in question to correct the error within 72 hours (typically sooner). Minor errors (for example, formatting errors or copy errors such as misspellings) will be corrected and the story updated to reflect the date/time of the correction. Larger errors requiring new headlines or extensive revisions to all or part of the story will be accompanied by a footnote to explain the error and the correction.All corrections are subject to the discretion and approval of the editors."
