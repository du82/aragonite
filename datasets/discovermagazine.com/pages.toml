["https://discovermagazine.com/faq"]
title = "Frequently Asked Questions | Discover Magazine"
description = "Discover satisfies everyday curiosity with relevant and approachable science news, feature articles, photos and more."
full_description = '''I have a product, book, film or television series that I’d like Discover to review, or have made a scientific breakthrough I’d like Discover to cover.Since Discover is a fully remote editorial operation with no central mailroom, we strongly encourage the sending of digital versions of book catalogs, sub rights guides, and review copies whenever possible. They can be sent electronically to editorial@discovermagazine.com. If this is not feasible, please indicate that in an introductory email sent to the above address. If we are interested in receiving a hard copy of your materials, you will be contacted with an appropriate mailing address.Press releases should be sent to editorial@discovermagazine.com. Due to the overwhelming volume of press releases we receive daily, we regret that we cannot provide a personal response to each release sent to us.I have a question about an illness from which someone I know (or I myself) suffers.We’re sorry, but Discover’s writers and editors cannot advise you on medical matters — even those we’ve written about. The information in our stories is provided for educational purposes only and should never take the place of guidance or treatment from qualified medical professionals. Always consult your doctor or health practitioner regarding any health concerns.I have an opinion about an article or recent issue of Discover that I’d like to share.We love to hear from our readers! Please email the editors at editorial@discovermagazine.com. Be sure to include your name, hometown and state.Unless your communication specifically requests otherwise, any letter or email sent to us may potentially be included in the mail page of Discover. Letters/emails may be edited for length or clarity before being run, but we will never make changes that affect the content or intent of your letter.I’m looking for a copy of an article that ran in Discover.Please start by searching discovermagazine.com. (Google searches using "Discover magazine" and the author's name are usually the most effective.)If you cannot find the article online, please take the following steps:Do you know the issue of the article you’re searching for? If so, subscribers can access our online archive, which contains digital copies of most issues of Discover. Issues published within the last year or two may be available by contacting our customer service department at (800) 829-9132, by email at DiscoverMagazine@Omeda.com, or by visiting discovermagazine.com/customer-service. We regret that we do not have older back issues of Discover for sale at this time. If you don’t know the title, author, and/or issue of the article you’re searching for, contact us at editorial@discovermagazine.com. Please be advised that without sufficient information about the story in question, we may not be able to honor your request. Our staff’s primary job is focused on producing new content and searching our indices and archives can be a time-intensive process. You will likely have faster results searching online or utilizing the services of your local library.I need to get in touch with the author of an article that ran in Discover.Sorry, but we do not give personal contact information for our authors and contributors. You may write to us at editorial@discovermagazine.com, and we’ll forward your email to the author. As many of our writers are independent contractors, we are not necessarily aware of their schedules or availability—and therefore cannot guarantee a response on their behalf.I’d like to advertise with Discover, or would like advertising information.Please visit our advertising page.I need reprint rights for an article from Discover.Content on discovermagazine.com and in the print magazine is copyrighted, and cannot be used without permission. It is unlawful to share or distribute copyrighted materials in any way, including via PDF, posting online or creating hard copies for others. Requests to repurpose material from Discover or to obtain reprints should be directed to PARS International.I’m a science journalist and would like to pitch an article.Please visit our pitch guidelines page.I emailed you, but you never responded.We make every effort to answer as many of the emails we receive as possible, but our workloads sometimes mean that it will be several weeks before we can respond. We receive literally hundreds of emails daily. We appreciate your understanding that occasionally, sheer volume prevents us from sending personal responses to each email; please know that we do read every email and letter and consider your ideas and opinions.Are you hiring? Are you accepting applications for interns?Job opportunities at Discover will be posted on the Careers page of the website of our parent company, LabX Media Group.We do not offer internships on a regular basis, but do occasionally host fellows participating in the AAAS Mass Media Science & Engineering Fellowship, and encourage interested science, engineering and mathematics graduate students to apply to the program.Stop calling me and/or sending me renewal notices!Unfortunately, Discover is one of many high-profile magazines suffering as result of magazine renewal scams, both via telephone and mailings. Mailings may promise savings, while they in fact charge more than Discover’s subscription rate. Phone calls may become verbally abusive in an attempt to get the subscriber’s credit card information.Please understand that these companies operate without our permission, and we're as angry about it as you are. Customer service is a high priority to Discover, so we absolutely hate to have these people harassing current or former subscribers in our name! We are working with Periodical Watchguard, the attorney general's office and the post office to report these problems and shut these companies down, but it's a very slow process.Your best option is to simply hang up if these scammers call, and always avoid giving out personal information; as a rule, be wary of third-party solicitations, or anyone who attempts to gather your personal data, credit card or bank account information. The safest way to subscribe or renew your subscription to Discover is through our online customer service center, or by using a postcard that comes inside an issue of the magazine.I have an idea for a story or a topic I’d like to see you cover.We're always thrilled to hear our readers’ ideas for features, columns and in-depth coverage in the magazine or online. Feel free to send your suggestions by contacting us at editorial@discovermagazine.com. We cannot respond to every emailed suggestion we receive, but be assured we'll keep your ideas in mind as we plan the content for future issues of Discover.I'm having problems with your website.If you need assistance logging onto the website, accessing subscriber-only content or accessing additional digital content, please contact our customer service department at (800) 829-9132, by email at DiscoverMagazine@Omeda.com, or by visiting discovermagazine.com/customer-service.There’s a problem with my subscription: an issue arrived damaged, an issue never arrived, I need to renew, etc.Frequently asked questions about subscriptions are answered on our Subscription FAQ page. To renew your subscription, pay your bill, change your mailing/email address, report a missing/damaged issue or order recent back issues of the magazine, please contact our customer service department at (800) 829-9132, by email at DiscoverMagazine@Omeda.com, or by visiting discovermagazine.com/customer-service.'''
