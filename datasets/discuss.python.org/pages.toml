["https://discuss.python.org/t/should-we-expand-the-voter-pool-for-the-sc/62060"]
title = "Should we expand the voter pool for the SC? - Committers - Discussions on Python.org"
description = "Maybe controversial opinion, but one change I’m wishing to see is allowing non committers to vote for the SC.  The decisions made by SC impact the wider Python users and Python community members, I think more people should be allowed to at least vote or share their voice in addition to the 120+ committers (currently). I’m not suggesting we should let everyone in the world to vote, but I personally would be open to something like giving voting privilege to the Triagers team or other active contri..."
full_description = "Should we expand the voter pool for the SC? Committers governance Mariatta August 25, 2024, 9:24pm 1 Maybe controversial opinion, but one change I’m wishing to see is allowing non committers to vote for the SC. The decisions made by SC impact the wider Python users and Python community members, I think more people should be allowed to at least vote or share their voice in addition to the 120+ committers (currently). I’m not suggesting we should let everyone in the world to vote, but I personally would be open to something like giving voting privilege to the Triagers team or other active contributors/3rd party library/package maintainers. 23 Likes Should we consider Ranked Choice voting for SC elections? Steering Council continuity guarantees Collecting feedback about expanding the voter pool for SC Elections ncoghlan (Alyssa Coghlan) August 26, 2024, 4:51am 2 Mariatta: I’m not suggesting we should let everyone in the world to vote, but I personally would be open to something like giving voting privilege to the Triagers team or other active contributors/3rd party library/package maintainers. If we were to expand the SC voting franchise, adding in the PSF Fellows would be a plausible option. 3 Likes pitrou (Antoine Pitrou) August 26, 2024, 8:45am 3 Mariatta: The decisions made by SC impact the wider Python users and Python community members, I think more people should be allowed to at least vote or share their voice in addition to the 120+ committers (currently). The fact that decisions impact the wider community is par for the course in any open source project. I have not seen any precedent in other open source projects for giving voter rights to people outside the core developer group, do you have any pointers to that? Mariatta: I personally would be open to something like giving voting privilege to the Triagers team or other active contributors/3rd party library/package maintainers. I wouldn’t mind triagers or frequent contributors, though if they are involved and trusted enough, perhaps they should simply be made core developers? I would definitely mind people who have not shown activity in the project, as they do not have the same information that core developers do for evaluating each candidate to the SC. In any case, it seems like this should be a separate discussion thread. Time to split the thread perhaps? 9 Likes dhellmann (Doug Hellmann) August 26, 2024, 12:09pm 4 Antoine Pitrou: The fact that decisions impact the wider community is par for the course in any open source project. I have not seen any precedent in other open source projects for giving voter rights to people outside the core developer group, do you have any pointers to that? The OpenStack Technical Committee (TC) has a role similar to Python’s SC. Members of the TC are elected by “active contributors” to any official OpenStack sub-project. The simplest way to become a contributor is to have a patch merged, but it is also possible for someone to be listed as a contributor based on other work they do to help the project. The Triagers team fits that description pretty well. Maintainers of 3rd party libraries might be more of a stretch. 4 Likes brettcannon (Brett Cannon) August 27, 2024, 12:00am 5 Mariatta: I personally would be open to something like giving voting privilege to the Triagers team I would be fine with that. Mariatta: other active contributors/3rd party library/package maintainers. This feels like asking for trouble. I would be concerned that a project being chosen gets viewed as an endorsement by us w/o having to vet them regularly for things that we may decide is critical (e.g., has a code of conduct). And that’s not without tackling the definition of “active” (we don’t even have such a definition ourselves as you just self-certify you want to vote). Alyssa Coghlan: adding in the PSF Fellows would be a plausible option. That might be a bit controversial as it means the PSF has a way to influence elections. As it stands, the PSF and the core team are pretty well separated with the only way to influence each other when someone happens to be a member of both. 9 Likes barry (Barry Warsaw) August 27, 2024, 12:32am 6 Mariatta: I personally would be open to something like giving voting privilege to the Triagers team One way to think about that is that both core developers and folks on the path to core developership would get a vote. It wouldn’t necessarily change the structure of SC elections, but expands the definition of core team member. The other aspect of this expanded definition would be the nomination process. SC members do not have to be core developers themselves, but they must be nominated by a “core team member” [1]. including self-nominations ↩︎ 2 Likes Mariatta August 27, 2024, 9:19pm 7 Would you all be ok if we move this discussion to under the Core Development category? 6 Likes freakboy3742 (Russell Keith-Magee) August 28, 2024, 3:58am 8 Mariatta: Maybe controversial opinion, but one change I’m wishing to see is allowing non committers to vote for the SC. IMHO, it’s not that controversial at all. There are many people who aren’t Python core developers who have a very significant interest in the evolution of the language. Exactly who does get voting rights might be mildly controversial, but I think the voting pool could be substantially expanded without exposing the future of the language to substantial risk. Adding triagers at the very least seems entirely uncontroversial to me - the idea that we’d trust someone to perform non-trivial community management, but not trust them to have an informed opinion on the SC seems inconsistent. Antoine Pitrou: The fact that decisions impact the wider community is par for the course in any open source project. I have not seen any precedent in other open source projects for giving voter rights to people outside the core developer group, do you have any pointers to that? One data point: The Django Steering Council is elected by the full DSF membership. DSF membership isn’t as open as PSF membership - it is by nomination, for “substantial or sustained contributions”, but with a caveat that membership discussions explicitly err on the side of saying “yes”. Brett Cannon: That might be a bit controversial as it means the PSF has a way to influence elections. To some extent, isn’t that their mandate? The PSF mission is to “promote, protect and advance the Python Programming language”; providing some input to the group of people who will select the council that shepherds the language seems entirely in-scope for that mandate. 6 Likes corona10 (Donghee Na) August 28, 2024, 7:39am 9 I concur with expanding voters to triager members when considering that expanding too much scope can make the SC vote a popularity vote. Sometimes, steering committee members have to make decisions that go against the wishes of community users for the sustainability of the project. I believe that consideration should be given to setting a minimum range to prevent steering committee members from being disadvantaged in the next election due to such decisions. 6 Likes hugovk (Hugo van Kemenade) August 28, 2024, 9:10am 10 PEP 13 currently says only “active” core team members can vote: Those who haven’t made any non-trivial contribution in two years may be asked to move themselves to this category, and moved there if they don’t respond. […] While someone is in inactive status, though, they lose their active privileges like voting or nominating for the steering council, and commit access. And each election begins with generating a voter roll from active core members. Last election, 87 active of some 115 core members were active (see PEP 8105). Would expanding the voter pool add a similar “active” requirement to be able to vote? How would we define being active for them? Self-declaring could work, but I wouldn’t expect PSF Fellows to commit to CPython, and perhaps not triagers either. Or would we remove the active requirement entirely? 3 Likes malemburg (Marc-André Lemburg) August 28, 2024, 9:36am 11 Hugo van Kemenade: Or would we remove the active requirement entirely? IMO, the “active” status should only be relevant for the commit bit to help with keeping our repo secure. The additional overloading for the purpose of voting and nomination is not really necessary. In fact, I find it somewhat contrived, since all past committers, including currently inactive ones, have a stake in Python and should be allowed to influence the future direction of Python. Additionally, there are lots of ways a core member can be active which does not involve committing to the repo. PEP 13 has a long list of such activities. 4 Likes jhylton (Jeremy Hylton) August 28, 2024, 1:25pm 12 I’m not sure I have a strong opinion about this topic, but the question of active status gave me a way to think about it. I have been an inactive core developer for several years, and I’m recently re-engaged a bit. I have always felt a strong connection to Python because of my earlier work, but I don’t think I would have been an informed voter on SC issues. If I had voted in earlier elections, I would have known a lot about candidates I had personally work with years ago. I would have known very little about candidates who joined more recently. It doesn’t seem like I would have been a useful contributor to the vote. I think the SC serves to organize the active development of Python, and I think it makes a lot of sense for the voters to be actively engaged in core Python development. Triagers have been mentioned, and that makes sense. If you expand the voter pool to include people who aren’t contributing to core development, I worry that they have different goals and levels of information and the SC might be less grounded in the day-to-day development work that they shepherd. Perhaps there’s a discussion to be had about how the SC and the core development team engage with the wider community. There’s no doubt that a robust engagement with the larger community is important–and surely happens already. Would it be worth writing down some thoughts about how that engagement works today and how it could be improved? 15 Likes malemburg (Marc-André Lemburg) August 28, 2024, 5:24pm 13 I think you have to differentiate between the voters and the possible SC candidates. PEP 13 mandates that candidates must be nominated by core team members. This should guarantee that they are indeed “grounded in the day-to-day development work that they shepherd”. Just to clarify and make sure we’re discussing the same things: As I understand, the topic we’re discussing here is to expand the voter pool for the SC, not what PEP 13 calls the “core team members”, so it’s well possible to have the “core team member” criteria stay the same, while we add an additional set of stakeholders to the set of voters currently defined by PEP 13, e.g. triagers expand the set to all core team members not just the one who commit to the repo possibly other stakeholders as well Some additional notes: PEP 13 does not define quorum criteria, so having more voters won’t get us into trouble if only a subset actually do vote. Whatever we define as voter should be easily verifiable before a vote by looking at a static public list in a repo. Not only to simplify the voting process from the current very dynamic one, but also to make things more transparent for the Python community. At the moment, this list is only created a few weeks before the vote and it takes a longer while to complete the process. And on the topic of voting in general, I’d like to suggest: PEP 13 should be expanded to also allow for voting to happen on other topics, not just SC elections, PEP 13 changes and votes of no confidence. This may make things easier for the SC in situations where a proposal is made, which doesn’t have a clear backing in the community. In such a case, the SC may opt to call for a vote on the topic. 2 Likes jhylton (Jeremy Hylton) August 28, 2024, 6:28pm 14 I was thinking primarily of the voters FWIW. I worry that a large number of voters who are not actively involved in core development would be less informed about the candidates. I agree that a voter population that includes people active in a variety of ways (not just committers) makes sense. Jeremy 2 Likes brettcannon (Brett Cannon) August 28, 2024, 6:32pm 15 Russell Keith-Magee: brettcannon: That might be a bit controversial as it means the PSF has a way to influence elections. To some extent, isn’t that their mandate? The PSF mission is to “promote, protect and advance the Python Programming language”; providing some input to the group of people who will select the council that shepherds the language seems entirely in-scope for that mandate. With my core dev hat on, that’s their mandate, not ours. Just because the PSF says that’s their goals doesn’t mean it should grant them voting. It’s like if the DSF tacked on, “and also promote, protect and advance the Python Programming language” to its mandate and that somehow means DSF members should also now get to vote just because of what’s in the mandate. I don’t think that’s strictly what you mean, but it can be interpreted that way. There’s a bit of history here over concern that the PSF would have an outsized influence on core development. Up to now there’s been friendly support both ways, but no direct way for one to influence the other. Bringing in 411 new voters via the Fellows list is a bit of a shift in terms of the voter roll such that core developers lose control over who sets project policy. I’ll also say that because a large chunk of us were given their fellowships due to being grandfathered in, it isn’t quite as clean as the DSF might have it in their program. For instance, I don’t think ESR should get to vote for the SC. I think a bigger question is why do people want to vote for the SC? For me, it’s because they direct the CPython project which I actively contribute to. I suspect people who aren’t core devs want a vote because the SC also manage the language’s semantics via the PEP process. But because the same council handles both aspects it leads this tension between core devs not wanting non-team members potentially messing w/ the dev process but others wanting an indirect seat at the table for language influence. I’m sure people will suggest splitting the responsibilities, but that’s a separate, complicated discussion. 17 Likes hugovk (Hugo van Kemenade) August 28, 2024, 9:28pm 16 Marc-André Lemburg: Additionally, there are lots of ways a core member can be active which does not involve committing to the repo. PEP 13 has a long list of such activities. Indeed, and PEP 13 currently allows core members to self-declare as active for these important activities. It’s not limited to those committing to a single repo (and I don’t think anyone is suggesting it should). 2 Likes freakboy3742 (Russell Keith-Magee) August 28, 2024, 10:52pm 17 Brett Cannon: With my core dev hat on, that’s their mandate, not ours. Just be"
