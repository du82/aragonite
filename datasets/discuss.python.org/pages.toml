description = "I ran git fetch --all successfully several times today. Now I get this (MacBook Pro, running in Terminal):  % git fetch --all Fetching upstream git@github.com: Permission denied (publickey). fatal: Could not read from remote repository.  Please make sure you have the correct access rights and the repository exists. error: could not fetch upstream Fetching origin git@github.com: Permission denied (publickey). fatal: Could not read from remote repository.  Please make sure you have the correct acc..."
full_description = "GitHub access suddenly gone? Committers smontanaro (Skip Montanaro) January 14, 2025, 12:06am 1 I ran git fetch --all successfully several times today. Now I get this (MacBook Pro, running in Terminal): % git fetch --all Fetching upstream git@github.com: Permission denied (publickey). fatal: Could not read from remote repository. Please make sure you have the correct access rights and the repository exists. error: could not fetch upstream Fetching origin git@github.com: Permission denied (publickey). fatal: Could not read from remote repository. Please make sure you have the correct access rights and the repository exists. error: could not fetch origin I’m using git as provided by Apple: % git --version git version 2.39.5 (Apple Git-154) I can access my Git space through my browser. Adding --verbose to the above git fetch command didn’t display any extra information. Thinking an SSH agent process had crashed, I went ahead and rebooted my laptop, but that didn’t help. Does anyone have a suggestion about what’s going on? Is there a better channel here to get this sort of help? Since this seems to be a Git/GitHub issue, is there a good place on github.com to ask for help with this? zware (Zachary Ware) January 14, 2025, 12:07am 2 It’s a GitHub outage, see GitHub Status - Incident with Git Operations 5 Likes smontanaro (Skip Montanaro) January 14, 2025, 12:19am 3 Thanks. I was unaware of githubstatus.com. I’ve subscribed… 3 Likes"
