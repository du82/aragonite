["https://discuss.python.org/t/changing-pep-13-to-adopt-bloc-star-voting/64971"]
title = "Changing PEP 13 to adopt Bloc STAR voting - Committers - Discussions on Python.org"
description = "I am proposing to adopt STAR voting starting with the elections for the 2025 Steering Council term. Unlike my preceding post (Adopting STAR voting), which was about refining the proposed changes, this thread (topic) is the actual poll, so please pay attention. I’m also planning to send an email to all current core devs to alert them of this poll.  The voting method is fixed by PEP 13, which has a specific procedure for changes. After a Discourse poll about how to change PEP 13, I believe an anon..."
full_description = '''Comment by gvanrossum - PEP 13: Add STAR voting and misc tidbits python:main ← gvanrossum:star Question for the SC (primarily): If I were to commit this today, it would appear… to affect the upcoming election for SC2025. That's not a good idea, because we'd have to scramble to figure out exactly how to run the election. So my plan has always been to make this go into effect for the election *after* the upcoming one, voting for SC2026. I can think of a few ways to implement that plan: - Update the text of the PR slightly to explicitly state "for elections in or after 2025" or some such. (Awkward: not the text that was voted for.) - Update the PEP now with the unstated assumption that it goes into effect next year. Not great. - Similar, but add a `.. note::` explaining that it starts after June 2025, for example. (A little awkward, but we can always remove the note once it's no longer relevant.) - Hold off merging this PR until the upcoming election is over. (Elegant, but that means about two months until we see the change.) What would the current SC prefer that I do?'''
author = """
guido            (Guido van Rossum)"""
