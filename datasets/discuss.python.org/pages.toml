description = "Hi I’m new to CPython and I’m interested in helping improve asyncio. I’m trying to get myself familiar with concepts in Lib/asyncio and Modules/_asynciomodule.c. But I don’t know where to get started.  Currently, I noticed that in Lib/asyncio/futures.py, it says _CFuture needs tests:  try:     import _asyncio except ImportError:     pass else:     # _CFuture is needed for tests.     Future = _CFuture = _asyncio.Future  But it seems that the tests are well-written in Lib/test/test_asyncio/test_fu..."
full_description = "How can I help asyncio, where to start? Async-SIG xuantengh (Xuanteng Huang) October 20, 2024, 6:12am 1 Hi I’m new to CPython and I’m interested in helping improve asyncio. I’m trying to get myself familiar with concepts in Lib/asyncio and Modules/_asynciomodule.c. But I don’t know where to get started. Currently, I noticed that in Lib/asyncio/futures.py, it says _CFuture needs tests: try: import _asyncio except ImportError: pass else: # _CFuture is needed for tests. Future = _CFuture = _asyncio.Future But it seems that the tests are well-written in Lib/test/test_asyncio/test_futures.py, for both _PyFuture and _CFuture. So I’m not sure which kinds of tests are needed. Hope to hear your suggestions, including but not limited to tests, docs. 1 Like graingert (Thomas Grainger) October 20, 2024, 8:02am 2 Xuanteng Huang: _CFuture is needed for tests. This says “_CFuture is needed for tests” not “tests are needed for _CFuture” xuantengh (Xuanteng Huang) October 20, 2024, 11:30am 3 Thomas Grainger: This says “_CFuture is needed for tests” not “tests are needed for _CFuture” Oh sorry this was a huge misunderstanding willingc (Carol Willing) October 20, 2024, 11:06pm 4 If you do wish to contribute, you can search for issues tagged as asyncio: Issues · python/cpython · GitHub Please also review the Dev Guide which outlines our contribution processes and best practices: https://devguide.python.org"
