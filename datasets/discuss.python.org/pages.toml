full_description = "2025 Core Dev Sprint: 15th-19th September at Arm Ltd in Cambridge, UK Committers diegor (Diego Russo) November 21, 2024, 5:01pm 1 Hello folks I am thrilled to announce that Arm Ltd will be hosting the 2025 Core Dev Sprint at our headquarters in Cambridge, UK. There is some flexibility about the availability of the venue. Please mark your preference. Availability for 2025 Core Dev Sprint: 15th - 19th September 22nd - 26th September 6th - 10th October 0 voters I’ll keep the poll open for two weeks to allow ample time for people to express their preferences. More details will be shared soon. We appreciate the Steering Council’s acceptance of our proposal! 21 Likes willingc (Carol Willing) November 21, 2024, 5:17pm 2 Great news! Thanks for sharing @diegor. 6 Likes hugovk (Hugo van Kemenade) November 22, 2024, 10:29am 3 Reminder that Python 3.14.0 final is planned for Wednesday 1st October 2025 (hopefully we won’t need to revert anything last minute this time ). 7 Likes diegor (Diego Russo) January 10, 2025, 2:01pm 4 Hi everyone, Thanks a lot for voting in the poll and for being so patient. After looking at the results and talking to everyone who voted, I’m glad to confirm that the Core Dev Sprint 2025 will be happening from September 15th to 19th, 2025 at Arm Ltd’s headquarter in Cambridge, UK In the coming weeks, we’ll put together all the info you need about the logistics of the event, just like Itamar and Petr did in the past. In the meantime, if you have any questions, feel free to ask me either privately on Discord or here in this thread. Thanks again for the opportunity to host this event. We really look forward to it. 17 Likes guido (Guido van Rossum) January 11, 2025, 9:28pm 5 We should invite Jukka (mypy’s author), he lives in Cambridge and is a member of the typing council. 10 Likes diegor (Diego Russo) January 13, 2025, 11:38am 6 I sent him a message here in Discuss hoping he reads it. Otherwise I need to scout for his email. 2 Likes"
