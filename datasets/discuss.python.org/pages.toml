title = "Make asyncio eager task factory default - Async-SIG - Discussions on Python.org"
description = "Now asyncio uses lazy task factory by default; it starts executing task’s coroutine at the next loop iteration.  Optional asyncio.eager_task_factory() was added in Python 3.12. It generally makes the code a little faster, but eager factories are not 100% compatible with lazy ones, especially if the test relies on deferred execution.  I propose making eager factory default:   loop.create_task() calls asyncio.Task(..., eager_start=True). Add create_lazy_task_factory() and lazy_task_factory() funct..."
