title = "Measuring coroutine blocking time - Async-SIG - Discussions on Python.org"
description = "I couldn’t find an easy way to measure how long an async coroutine blocks the event loop, so I rolled my own.   I use this in conjunction with a lag monitor to keep track of event loop health and identify the next best targets for optimization.  It’s difficult to maintain: every so often I come across a library that does something new that I haven’t accounted for. It breaks across different python versions sometimes too.  I noticed that there are some coroutine time measurements in CPython.   Is..."
full_description = '''asynchronous-flows/asyncflows/blob/main/asyncflows/utils/async_utils.py#L154-L220 async def measure_coro( log: structlog.stdlib.BoundLogger, f: Awaitable[T], timer: Timer, timeout: float = 180, ) -> T: coro_wrapper = f.__await__() arg = None exc = None fut = None first_run = True while True: try: if first_run: first_run = False elif fut is None: log.debug( "Coroutine returned None", arg=arg, This file has been truncated. show original python/cpython/blob/406ffb5293a8c9ca315bf63de1ee36a9b33f9aaf/Lib/asyncio/base_events.py#L1948-L2029 def _run_once(self): """Run one full iteration of the event loop. This calls all currently ready callbacks, polls for I/O, schedules the resulting callbacks, and finally schedules 'call_later' callbacks. """ sched_count = len(self._scheduled) if (sched_count > _MIN_SCHEDULED_TIMER_HANDLES and self._timer_cancelled_count / sched_count > _MIN_CANCELLED_TIMER_HANDLES_FRACTION): # Remove delayed calls that were cancelled if their number # is too high new_scheduled = [] for handle in self._scheduled: if handle._cancelled: handle._scheduled = False else: new_scheduled.append(handle) This file has been truncated. show original'''
