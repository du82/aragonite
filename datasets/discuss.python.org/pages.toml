title = 'Should we post SC Updates in "Core Development" rather than "Committers"? - Committers - Discussions on Python.org'
description = "Historically the SCs have been posting their update summaries in this Committers forum. So that is what I repeated while sharing our backlog of posts earlier today. They are publicly readable here, but only Committers can comment.  Now that we’ve hired a Communications Liason, it’d likely be easier and timelier to have Velda post these directly over in Core Development (as she is not a core dev so cannot post here in Committers).  poll If you feel strongly one way or another, consider sharing wh..."
full_description = 'Should we post SC Updates in "Core Development" rather than "Committers"? Committers sc-update gpshead (Gregory P. Smith) August 15, 2024, 11:20pm 1 Historically the SCs have been posting their update summaries in this Committers forum. So that is what I repeated while sharing our backlog of posts earlier today. They are publicly readable here, but only Committers can comment. Now that we’ve hired a Communications Liason, it’d likely be easier and timelier to have Velda post these directly over in Core Development (as she is not a core dev so cannot post here in Committers). Put future Steering Council Updates posts in Core Development Keep Steering Council Updates posts here in Committers 0 voters If you feel strongly one way or another, consider sharing why below. I believe the “Core Development” category allows anyone here on Discuss to post and comment. I’m personally happy with that. I’m asking mostly because I don’t want us to surprise anyone as I assume some people might subscribe to Committers in a more verbose mode than they do to Core Development. 2 Likes Steering Council Updates for August 2024 nedbat (Ned Batchelder) August 15, 2024, 11:38pm 2 TBH, It’s hard to tell the difference between the two categories. Are we sure we need both? ncoghlan (Alyssa Coghlan) August 16, 2024, 2:38am 3 It’s akin to the old mailing list split, where anything posted in Committers we really should be reading, while reading Core Development threads is more “if you’re so inclined and have the time”. So keeping both categories makes sense, but moving the SC updates still seems reasonable. 3 Likes pitrou (Antoine Pitrou) August 16, 2024, 10:08am 4 Gregory P. Smith: it’d likely be easier and timelier to have Velda post these directly over in Core Development (as she is not a core dev so cannot post here in Committers) Well, can we simply make an exception for her to post into the Committers category? I suppose she’s trusted a priori. (edit: I haven’t voted anything as I’m fine with both choices) 6 Likes Mariatta August 16, 2024, 4:59pm 5 I think the SC news are relevant to all contributors so the “Core Development” makes sense to me. Are we sure we need both? Perhaps this needs a different discussion thread. where anything posted in Committers we really should be reading, while reading Core Development threads is more “if you’re so inclined and have the time”. If that’s the case, can we @-mention the “Committers” group when posting, to get the core team’s attention? I believe this is supported on Discourse platform. To me posting on “Committers” category/mailing list has the extra effect of non-committers are not allowed to engage/reply, which is a different meaning from “here are the things we really want the committers to read”. 5 Likes'
