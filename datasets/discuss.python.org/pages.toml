title = "Revisiting PersistentTaskGroup with Kotlin's SupervisorScope - Async-SIG - Discussions on Python.org"
description = "https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/supervisor-scope.html  I found that Kotlin’s supervisorScope does the exact same thing that I have been going to achieve with aiotools.PersistentTaskGroup while Kotlin’s coroutineScope corresponds to asyncio.TaskGroup.   Unlike coroutineScope, a failure of a child does not cause this scope to fail and does not affect its other children, so a custom policy for handling failures of its children can be implemen..."
full_description = '''GitHub - achimnol/cpython at asyncio-supervisor asyncio-supervisor The Python programming language. Contribute to achimnol/cpython development by creating an account on GitHub. Revisiting PersistentTaskGroup with Kotlin's SupervisorScope Async-SIG achimnol (Joongi Kim) August 23, 2022, 5:30am 1 https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/supervisor-scope.html I found that Kotlin’s supervisorScope does the exact same thing that I have been going to achieve with aiotools.PersistentTaskGroup while Kotlin’s coroutineScope corresponds to asyncio.TaskGroup. Unlike coroutineScope, a failure of a child does not cause this scope to fail and does not affect its other children, so a custom policy for handling failures of its children can be implemented. See SupervisorJob for additional details. A failure of the scope itself (exception thrown in the block or external cancellation) fails the scope with all its children, but does not cancel parent job. There was a concern about the naming “persistent” in gh-90999, and now I’m inclined to use “SupervisorScope”. As you may already notice, it also resembles with supervisord. How about your thoughts? Would the Kotlin’s analogy make better sense to add this API to asyncio? 2 Likes Server-oriented task scope design guido (Guido van Rossum) August 23, 2022, 5:36pm 2 Looking at the docs for aiotools.PersistentTaskGroup I finally understand the key feature that you want: when a child task crashes with an unexpected exception you don’t want its siblings to be cancelled. I wonder if this can’t be done with a very simple wrapper for asyncio.TaskGroup that simple wraps each task (coroutine) in a try/except BaseException block that ignores all exceptions? (Maybe with the exception of KeyboardInterrupt and SystemExit, like TaskGroup and the rest of asyncio do.) So we could do something like this (untested, and simplified): class AltTaskGroup(asyncio.TaskGroup): def create_task(self, coro): async def wrapper(): try: await coro() except (KeyboardInterrupt, SystemExit): raise except BaseException: pass return super().create_Task(wrapper()) achimnol (Joongi Kim) August 24, 2022, 1:50am 3 Your draft is equivalent to wrap the child tasks with asyncio.shield(). The point is that the child tasks still must be cancellable when the parent task group is explicitly cancelled (i.e., shutdown). So I had to change the internal logic of TaskGroup to write PersistentTaskGroup. When the persistent task group is cancelled or explicitly shutdown: all child tasks should be cancelled and awaited. → This makes it different from simply shielding child tasks. Propagation of cancellation should be controlled in the task group instead of individual tasks. When a child task is cancelled: all other child tasks should remain intact. When a child task raised unhandled exception: an exception handler configured in the persistent task group is invoked (the default fallback is loop.call_exception_handler()). All other child tasks should remain intact. If all child tasks have finished, the persistent task group should exit as well. (same to the original task group) It should guarantee termination of all child tasks if the control flow has exited from the persistent task group. (same to the original task group) achimnol (Joongi Kim) August 24, 2022, 2:50am 4 Guido van Rossum: I wonder if this can’t be done with a very simple wrapper for asyncio.TaskGroup that simple wraps each task (coroutine) in a try/except BaseException block that ignores all exceptions? (Maybe with the exception of KeyboardInterrupt and SystemExit, like TaskGroup and the rest of asyncio do.) One of the reason to rewrite the code is that I need to call the shutdown process other than __aexit__() handler, such as shutdown(), when the persistent task group is used as long-lived object instead of a context manager. The current TaskGroup has all its shutdown routines inside __aexit__() and it’s not reusable from other methods. It’s not “refactored” or “designed” to be subclassed. guido (Guido van Rossum) August 24, 2022, 7:01am 5 I wonder if maybe your proposed functionality could be implemented as a flag passed to the TaskGroup class. The main effect of the flag should be that if one task crashes this shouldn’t cause all other tasks to be cancelled, instead the exception should be logged (either by loop.call_exception_handler() or in some other way). Also you want a shutdown() method. Would that work? If I am right then the main bikeshedding might have to be about the logging API to be used. I prefer there to be no coupling between asyncio and logging, so hopefully just calling loop.call_exception_handler() works for you? 2 Likes achimnol (Joongi Kim) August 24, 2022, 8:49am 6 Yeah, that would be nice! I’d like to be able to customize the error handler with the default fallback to loop.call_exception_handler(), and agree with you in that it’s better to remove coupling between asyncio and logging. I’ll try to implement a modified version of TaskGroup with the optional flag. If done, shall I make a pull request to the CPython repository? Or would you prefer to see it in a separate repo (e.g., aiotools)? guido (Guido van Rossum) August 24, 2022, 8:35pm 7 I recommend that you work on a PR, so I can review it, and eventually merge it so it will become available in 3.12. I’m not going to be able to review code that goes into other repos. 2 Likes DontPanicO (Andrea Tedeschi) January 26, 2023, 12:13am 8 Hello, new contributor here, I would like to help with that. I was looking at the TaskGroup source code and it seems that the only thing that should change (as has already been stated) is the behaviour of TaskGroup._on_task_done when a task raises (if the appropriate flag has been set). Joongi Kim: When the persistent task group is cancelled or explicitly shutdown: all child tasks should be cancelled and awaited. → This makes it different from simply shielding child tasks. Propagation of cancellation should be controlled in the task group instead of individual tasks. Do we really need to await on each task after calling .cancel()? Joongi Kim: When a child task raised unhandled exception: an exception handler configured in the persistent task group is invoked (the default fallback is loop.call_exception_handler()). All other child tasks should remain intact. SystemExit and KeyboardInterrupt are still considered special, I guess ? 1 Like achimnol (Joongi Kim) January 29, 2023, 5:24am 9 Thanks for the interest! I have been too busy on my business affairs (traveling through the globe…) so could not fire up the development yet. I recently updated my fork of CPython and created a branch to add this. github.com GitHub - achimnol/cpython at asyncio-supervisor asyncio-supervisor The Python programming language. Contribute to achimnol/cpython development by creating an account on GitHub. My plan is as follows: First, create a separate asyncio.Supervisor class which has the same coding convention of asyncio.TaskGroup but takes the implementation from aiotools.PersistentTaskGroup. Import & improve the test cases from aiotools and write new test cases. Explore possibility to merge asyncio.Supervisor as a part of asyncio.TaskGroup, or search for a better naming. This may require some refactoring of the existing asyncio.TaskGroup codes. Tighten up as the pull request and ask reviews from the core developers including Guido. If you are interested, I can invite you as the collaborator in my CPython fork. I’ll make it sure that you are also included as the PR author and co-contributor, of course. 1 Like achimnol (Joongi Kim) January 29, 2023, 5:42am 10 Do we really need to await on each task after calling .cancel()? Yes, because after catching asyncio.CancelledError, the task may have further await statements for clean up, such as await something.aclose(), __aexit__() of async with blocks, and etc. SystemExit and KeyboardInterrupt are still considered special, I guess ? Yes, along with asyncio.CancelledError, they are BaseException but not Exception, to allow them to be used as a control-flow signal rather than representation of failures. Note that asyncio.CancelledError has been changed to BaseException since Python 3.8 to avoid silent swallowing of cancellation in 3rd-party library codes. DontPanicO (Andrea Tedeschi) January 29, 2023, 1:24pm 11 Thanks for getting back. I’ve cloned your fork and I’m exeprimenting with it, if you want to invite me as a collaborator my Github username is the same as here (DontPanicO). 1 Like achimnol (Joongi Kim) May 1, 2023, 2:45am 12 Exception handling in Supervisor @DontPanicO I think we need to address the following design changes from your initial implementation (see also: Asyncio, tasks, and exception handling - recommended idioms? - #11 by achimnol): Supervisor should not raise the exception group by itself nor remember all exceptions. Since a supervisor is meant to run for an indefinite length of time, it should never remember individual task’s results or the task instances for its whole lifespan to avoid memory leak. For the above reason, we need to have an explicit exception handler interface with the default fallback to loop.call_exception_handler(). @guido For this reason, I’d like to also suggest making Supervisor as a separate API to TaskGroup, instead of adding a mode of operation to TaskGroup, due to this significant difference of exception raising behavior. TaskGroup: all subtasks share the same “destiny” All tasks are cancelled at once upon both external cancellation or internal unhandled exception, otherwise they run to successful completion. Unhandled exceptions are collected as an exception group. Supervisor: each subtask has its own “destiny” Only the cancellation from outside (e.g., shutdown()) cancels them all at once. Unhandled exceptions are processed by an explicit exception handler. gather_safe() experimentation To embrace result collection patterns, I’d like to add a wrapper around Supervisor as follows: @dataclass class GroupResult: results: list[Any] = field(default_factory=list) cancelled: int = 0 async def gather_safe(coros, group_result: GroupResult) -> GroupResult: errors = [] ongoing_cancelled_count = 0 def result_callback(t: asyncio.Task) -> None: nonlocal errors, ongoing_cancelled_count try: group_result.results.append(t.result()) except asyncio.CancelledError: ongoing_cancelled_count += 1 except Exception as e: errors.append(e) try: async with Supervisor() as supervisor: for coro in coros: t = supervisor.create_task(coro) t.add_done_callback(result_callback) return group_result except asyncio.CancelledError as e: errors.append(e) # cannot reraise directly here because the finally block will override it. finally: group_result.cancelled = ongoing_cancelled_count if errors: raise BaseExceptionGroup("unhandled exceptions in gather_safe()", errors) Sample test code: @pytest.mark.asyncio async def test_gather_safe_timeout(): detected_exc_groups = set() group_result = GroupResult() try: async with asyncio.timeout(0.35): await gather_safe([ do_job(0.1, 1), # sleeps 0.1s and returns 1 fail_job(0.2), # raises ZeroDivisionError after 0.2s fail_job(0.25), # raises ZeroDivisionError after 0.25s do_job(0.3, 3), # sleeps 0.3s and returns 3 # timeout occurs here do_job(0.4, 4), # cancelled fail_job(0.5), # cancelled fail_job(0.6), # cancelled ], group_result) except* asyncio.TimeoutError as e: detected_exc_groups.add("timeout") # we should be able to access the partial results assert group_result.results == [1, 3] assert group_result.cancelled == 3 except* ZeroDivisionError as e: detected_exc_groups.add("zerodiv") # we should be able to access the partial results assert group_result.results == [1, 3] assert group_result.cancelled == 3 else: pytest.fail("inner exception was not re-raised") assert detected_exc_groups == {"timeout", "zerodiv"} assert group_result.results == [1, 3] assert group_result.cancelled == 3 Note that the above code only works with my suggested patch to asyncio.timeouts.Timeout.__aexit__() as in this another thread, because the current asyncio.timeout context manager does not detect CancelledError contained in BaseExceptionGroup. I’d like to hear @yselivanov’s opinion about this point. The above experimentation code is available at aiotools’ GitHub repo. A New Naming Idea “PersistentTaskGroup” is a bit too long. We already have one candidate: “Supervisor” following Kotlin’s SupervisorScope. How about “TaskScope”, which aligns better with “TaskGroup” but emphasizes the difference between “Group” (sharing the destiny) and “Scope” (individuality)? Asyncio, tasks, and exception handling - recommended idioms? achimnol (Joongi Kim) May 1, 2023, 3:11am 13 About as_completed_safe() I have mentioned an idea about addition of a safer version of asyncio.as_completed() based on PersistentTaskGroup or Supervisor at a short in-person discussion with @yselivanov and @guido in PyCon last week. After some testing and experimentation, I’m now inclinded to deprecate this idea, even as a 3rd party library function. The reasons are: After more experimentation, I could figure out how to properly handle both timeouts and exceptions from the block body. This eliminates the necessity of making timeout changes for recognizing BaseExceptionGroup because TimeoutError is mutually exclusive to other exceptions happening. It is impossible to distinguish the cancellation and other exceptions from the view of the async generator. The caller must have a complicated boilerplate to handle both potential exceptions inside the block and aclose(). This complication comes from the use of async generators, not from the API’s purpose. This difficultiy is also described at Using ExceptionGroup at Anthropic (experience report) We also need to carefully handle GeneratorExit and CancelledError as written below. async def as_completed_safe(coros): q = asyncio.Queue() tasks = set() def result_callback(t: asyncio.Task) -> None: tasks.discard(t) q.put_nowait(t) async with Supervisor() as supervisor: for coro in coros: t = supervisor.create_task(coro) : Task[Unknown] t.add_done_callback(result_callback) tasks.add(t) await asyncio.sleep(0) while True: if not tasks: return try: yield await q.get() except (GeneratorExit, asyncio.CancelledError): # GeneratorExit: injected when aclose() is called # CancelledError: injected when a timeout occurs (i.e., the outer scope cancels the inner) await supervisor.shutdown() raise Usage example: @pytest.mark.asyncio async def test_as_completed_safe_error_from_body(): executed = 0 cancelled = 0 loop_count = 0 async def do_job(delay, idx): nonlocal cancelled, executed try: await asyncio.sleep(delay) executed += 1 return idx except asyncio.CancelledError: cancelled += 1 raise with VirtualClock().patch_loop(): results = [] with pytest.raises(ZeroDivisionError): async with aclosing(as_completed_safe([ do_job(0.1, 1), do_job(0.2, 2), # cancellation occurs here do_job(0.3, 3), ])) as ag: '''
