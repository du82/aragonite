full_description = "Python 3.13.0rc2 tomorrow^W this Friday! Committers thomas (Thomas Wouters) September 2, 2024, 10:00pm 1 A friendly reminder: tomorrow is the scheduled date for Python 3.13.0 rc2 (the last release candidate). If the macOS thin-lto performance issues get sorted out by @nad (which looks to be the case), it should happen on schedule. I plan to lock the branch for the release and then keep it locked until the final 3.13.0 release. If you have any bugs you think should be fixed in 3.13.0 (not just rc2), or any PRs that should go into 3.13.0, let me know now. If you run into any bugs or PRs you think can’t wait for 3.13.1 after rc2 has been cut, let me know and we’ll figure out how to address it together. 18 Likes thomas (Thomas Wouters) September 3, 2024, 12:49pm 2 After talking with @ambv (who just came back from vacation) about some of the pending pyrepl issues he would like to fix before rc2, we’ve decided to push 3.13.0rc2 to this Friday, September 6, instead. 12 Likes thomas (Thomas Wouters) September 6, 2024, 9:14pm 3 FYI, 3.13.0rc2 release process has started, the 3.13 branch is now locked down. 11 Likes ambv (Łukasz Langa) September 7, 2024, 10:04am 4 Thank you for accommodating PyREPL, Thomas. The release is now out: Python 3.13.0RC2, 3.12.6, 3.11.10, 3.10.15, 3.9.20, and 3.8.20 are now available! Core Development Hi there! A big joint release today. Mostly security fixes but we also have the final release candidate of 3.13 so let’s start with that! Python 3.13.0RC2 Final opportunity to test and find any show-stopper bugs before we bless and release 3.13.0 final on October 1st. Get it here: Call to action We strongly encourage maintainers of third-party Python projects to prepare their projects for 3.13 compatibilities during this phase, and where necessary publish Python 3.13 wheels on PyPI to be re… 5 Likes"
