description = "[4/4] Now it’s Velda’s turn (see her own introduction below!). This catches up to near-time.  If you have any questions or concerns, feel free to contact us or open an issue in the SC repo: GitHub - python/steering-council: Communications from the Steering Council. We also maintain SC office hours - rumor has it there may currently be issues with the calendar time slot tool? If so, just reach out to schedule.  The update source lives on GitHub, here it is:   Steering Council Updates for July 202..."
full_description = 'Steering Council Updates for July 2024 Committers sc-update gpshead (Gregory P. Smith) August 15, 2024, 11:10pm 1 [4/4] Now it’s Velda’s turn (see her own introduction below!). This catches up to near-time. If you have any questions or concerns, feel free to contact us or open an issue in the SC repo: GitHub - python/steering-council: Communications from the Steering Council. We also maintain SC office hours - rumor has it there may currently be issues with the calendar time slot tool? If so, just reach out to schedule. The update source lives on GitHub, here it is: Steering Council Updates for July 2024 2024-06-26 Discussion on Code of Conduct violation 2024-07-03 PEP 667 discussion: Review issues raised specifically in areas that are affecting the user, confirm it has tests, examples and implications mentioned EuroPython Sprints discussion on how to make it better, probability of coming up with a guide on how to hold successful sprints Discussed on ways to have a one stop shop for all the working groups in one page, improve on the current one 2024-07-10 Discussion on Code of Conduct violation 2024-07-17 Re-review of PEP 667 Drafting mentorship survey to help the SC make decisions based on the survey Discussion on how to get people to support mentorship Discussion on creating a contributor guide to help new contributors and timeline to start triaging CPython Bugs. 2024-07-24 Steering Council and Developer in Residence Meeting Report on EuroPython 2024 Discussion on PyREPL which presented some bugs during EuroPython which are being worked on. Steering Council Meeting 3.13rc1 vs PEP 667 Discussion on code of conduct violation 2024-07-31 Discussion on the release of Python 3.13rc1 Discussion on proposed semantics for PEP 667 Discussion on Code of Conduct violation Conversation on how to improve inclusivity in the Python community This past month’s updates (July) are brought to you by Velda Kiara, the Communications Liaison for the Python Steering Council. Velda bridges the gap between the Python community and the Steering Council. A software developer (Django dev) and technical writer, Velda’s articles have been featured on freeCodeCamp and Daily.dev. Her contributions extend to various Python projects like Django Debug Toolbar, Beeware, and the Novu Python SDK. Currently, she serves as the Vice Chair for Black Python Devs and a director on the Django Events Foundation North America. Velda’s dedication was recently recognised with a Microsoft Most Valuable Professional award for Developer Technologies (Python and Web Development). 10 Likes Should we post SC Updates in "Core Development" rather than "Committers"? Steering Council Nomination: Thomas Wouters (2025 term)'
