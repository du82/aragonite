title = "Changing PEP 13 to remove the CoC responsibility from the SC - Committers - Discussions on Python.org"
description = "Please note: This proposal is currently on hold, until we have fleshed out a better proposal to fill in the gap that is created by removing the CoC responsibility from the SC. Please see this message for details. I will send out a new email when the poll is ready to be rescheduled. Thank you for your understanding.   As discussed in topic Calling for a Vote of No Confidence - Committers - Discussions on Python.org, I am proposing  a change to PEP 13, which removes the responsibility to handle C..."
full_description = "Changing PEP 13 to remove the CoC responsibility from the SC Committers malemburg (Marc-André Lemburg) November 21, 2024, 1:56pm 1 Please note: This proposal is currently on hold, until we have fleshed out a better proposal to fill in the gap that is created by removing the CoC responsibility from the SC. Please see this message for details. I will send out a new email when the poll is ready to be rescheduled. Thank you for your understanding. As discussed in topic Calling for a Vote of No Confidence - Committers - Discussions on Python.org, I am proposing a change to PEP 13, which removes the responsibility to handle CoC topics from the SC. You can find the draft PR for PEP 13 implementing this proposal at PEP 13 Change Proposal - Remove CoC responsibility - Pull Request #4134 · python/peps. I will finalize the PR before opening the poll below. Motivation The reasoning behind this change is simple: The SC was created to steer the development of the Python programming language and as such requires deep understanding of language design, knowledge of how Python is being used and a good sense for the Python community’s needs. Conflating these main requirements with additional and orthogonal HR management skills does not do anyone a favor. We want to have the SC focus on it’s main tasks and do those well, without getting stressed and side tracked, having to also deal with non-technical issues in a completely different domain. Tasks related to guiding the community in questions of conduct and moderation to help steer clear of issues can well be managed outside the scope of the SC, eg. by people participating in discussions and, if needed, by those who run the communication platforms we use. Change procedure PEP 13 doesn’t specify the procedure on how to run votes on changes, but Guido had already run a change proposal for PEP 13 a couple of week ago, so I’m following the same procedure. The poll for the change will be open for two weeks starting from Sunday, 2024-11-24, until Sunday, 2024-12-08 AoE. I will try to email all core developers to inform them of this poll. TBD: Anonymous poll with the following answers… Let’s make this change Please leave things as they are I wish to abstain Edit history: Removed the “yes” and “no” from the poll items as per @hugovk 's suggestion. Removed one additional spot where PEP 13 mentioned conduct issues. Thanks to @barry for spotting this one. Put proposal on hold. See this message for details. 7 Likes Shedding light on a three-month suspension Shedding light on a three-month suspension Shedding light on a three-month suspension malemburg (Marc-André Lemburg) November 21, 2024, 2:04pm 2 Please let me know if I missed anything or need to further clarify things. Thanks. thomas (Thomas Wouters) November 21, 2024, 2:06pm 3 I tried to make this point in the SC self-nomination that I posted last night, but I just want to be absolutely clear here: I think this proposal, as is, is a bad idea. We cannot just ignore our responsibility to CoC enforcement. If it doesn’t belong with the people supposedly (according to PEP 13) in charge of making contributions “as accessible, inclusive, and sustainable as possible”, where exactly does it belong? We cannot just elide this part of PEP 13 and hope CoC enforcement just works out. It is counter to the goals of the SC (again, as described in PEP 13). As I mentioned in my self-nomination, I’m not opposed to a different group (possibly with overlapping members) given the responsibility of community management, but it needs to be clear, deliberate and holistic. The CoC and how it’s handled matters to the community, and the community matters to the CoC. 21 Likes alex_Gaynor (Alex Gaynor) November 21, 2024, 2:15pm 4 I don’t have an a priori opinion on who should have this responsibility. However, given the SC has had this responsibility, I think a proposal to strip them of it would be better formulated as an affirmative resolution to explicitly move the responsibility to someplace else. (Explicit is better than implicit) Phrased another way: While I’d be happy to vote for a resolution moving the responsibility somewhere, I’m unlikely to support one that appears to simply discard enforcement. 29 Likes ambv (Łukasz Langa) November 21, 2024, 2:21pm 5 Marc-André Lemburg: Conflating these main requirements with additional and orthogonal HR management skills does not do anyone a favor. I find this motivation both incorrect and disingenuous. The Steering Council over the past five years has done plenty of both CoC enforcement and “HR management”. I can attest to both as I have biweekly meetings with the SC as the developer in residence. I also wear the hat of the CoC WG chair. It’s pretty clear that this proposal is a reaction to Tim’s suspension. It would be more honest to say that in the motivation section. In any case, that situation involved three layers of people: core developers reporting to the COC WG, the COC WG making a recommendation, and the SC making an enforcement decision. If you feel this decision was incorrect, we should definitely discuss, but the first reaction shouldn’t be to remove the SC’s ability to enforce. It shouldn’t be the first reaction as there were other SC actions over the years in terms of CoC enforcement, which did not create the same pushback. So clearly most actions are uncontroversial. Finally, this proposal is incomplete without clearly stating who is supposed to be the CoC enforcer if the SC isn’t supposed to do that. 15 Likes Shedding light on a three-month suspension Shedding light on a three-month suspension hugovk (Hugo van Kemenade) November 21, 2024, 2:22pm 6 I agree with Thomas and Alex. Having a different group take responsibility may well be a good idea, but I’d like to see a concrete suggestion of where that responsibility goes in such a vote rather than simply removing it from the SC. About vote wording, I suggest avoiding questions including “yes”/“no” to avoid potential bias. 14 Likes mhammond (Mark Hammond) November 21, 2024, 4:51pm 7 Łukasz Langa: The Steering Council over the past five years has done plenty of both CoC enforcement and “HR management”. I don’t think MAL has suggested they have not done that. The question is whether they are the correct group to actually be doing that. Łukasz Langa: It’s pretty clear that this proposal is a reaction to Tim’s suspension. It would be more honest to say that in the motivation section. I can’t speak for MAL, but my interest in this topic is my reaction to a number of issues over the last 6 months, all of which fall under a “CoC enforcement” umbrella. Tim’s is but one of these (and obviously the one shining the most light on the issue), but I’m not sure it would help the discussion by re-litigating them all here. I do agree that this proposal needs more detail about how the CoC is managed in the future, but I am not sure a concrete plan needs to be agreed first - general agreement that a process is not working seems a reasonable first step towards a process which does. I look forward to MAL clarifying his thoughts on this. The reason I’m even thinking about this is due to the communication around some of these controversies. The small amount of communication about these events have been credibly and directly contradicted by those individuals. The lack of followup from the SC is something I find troubling. Łukasz Langa: If you feel this decision was incorrect, we should definitely discuss, Haven’t people been trying to do that? People tried to discuss them but were told there was “information asymmetry”, that information individuals were “personally privy” to and respecting the privacy of impacted individuals mean we can’t know the full story and we should just trust the pcoess. But when other parties shared their side of this asymmetry, directly contradicted the small amount of information which was released and gave their permission to have an open discussion, the response has been either silence or more stonewalling. So yes, we should continue to discuss this - but in my opinion, the onus is now on the SC to directly address some of the responses made by these individuals. For these reasons I agree that the status quo is not serving the Python community. The SC doesn’t seem willing to directly engage with this, so proposals which look to address this are going to attract attention when they are the only proposal on the table. Mark 16 Likes ambv (Łukasz Langa) November 21, 2024, 5:10pm 8 Mark Hammond: For these reasons I agree that the status quo is not serving the Python community. That’s a far-reaching claim after one case you find not to your liking. I don’t think we need to reform the entire institution of SC to address actions by a single one. The SC will soon change, and voting for people who represent your values is an option that was on the table from the day PEP 8016 was chosen as the governance model for the language. To be explicit, my main worry here is that removing the SC’s ability to enforce CoC without naming a new body to do so will create a vacuum that will be impossible to replace. How do you choose a new group of people to do this? Will there be another 2/3 majority vote to change PEP 13? What if there’s no 2/3 support for that particular idea? It would create a vacuum where CoC would not be enforceable. Sure, a few core committers would enjoy that. But that’s a bad situation. I feel like tying the vote to a concrete proposal for replacement is required to make this an informed decision. Don’t vote on hand-waving a replacement later. It might not happen at all. 12 Likes willingc (Carol Willing) November 21, 2024, 5:13pm 9 I would support this change if it stated a specific plan for who would be responsible for CoC. While I understand and appreciate the desire for a change, swinging the pendulum too far in the other direction with no clear group or plan identified would be as problematic, if not more, than the status quo. If the end goal is improving the current situation, our approach would be more effective to converge on a new solution before updating the PEP. P.S. On a personal note, if the CoC is unspecified, I would recommend that all communications channels be public. In other words, there should be no private communications channels for core development activities. This would provide the most transparency since that seems to be one of the goals of this proposed change. 14 Likes thomas (Thomas Wouters) November 21, 2024, 6:08pm 10 Mark Hammond: The reason I’m even thinking about this is due to the communication around some of these controversies. The small amount of communication about these events have been credibly and directly contradicted by those individuals. The lack of followup from the SC is something I find troubling. […] For these reasons I agree that the status quo is not serving the Python community. The SC doesn’t seem willing to directly engage with this, so proposals which look to address this are going to attract attention when they are the only proposal on the table. I can’t speak for the whole Steering Council, but I can tell you why I haven’t responded to those contradictions: having a he-said/he-said fight would in no way improve the situation. (Also, nobody asked me or the SC directly to respond, and I definitely don’t want to jump into any conversation to try and correct impressions people have.) As for the SC not being willing to engage, I’m sorry we gave the impression, although I’m not entirely sure how we could’ve done better. As far as I know, we’ve engaged with anyone who wanted to talk to us about it (individually or the SC as a whole). Is there a specific thing you would like the Steering Council to do to spur that engagement? 6 Likes mhammond (Mark Hammond) November 21, 2024, 6:51pm 12 Łukasz Langa: That’s a far-reaching claim after one case you find not to your liking. I really tried to be clear about this: Mark Hammond: my interest in this topic is my reaction to a number of issues over the last 6 months, all of which fall under a “CoC enforcement” umbrella. Tim’s is but one of these (and obviously the one shining the most light on the issue) I don’t see how you could read that as me being concerned about exactly one case. My message also corrected your mis-characterization of MAL’s comment, suggesting he was somehow saying the SC wasn’t performing duties when he was clearly starting they were. It would seem more helpful to engage with what we are actually saying. Mark tim.one (Tim Peters) November 21, 2024, 6:51pm 13 Łukasz Langa: I find this motivation both incorrect and disingenuous. , It’s pretty clear that this proposal is a reaction to Tim’s suspension. I would say it’s more that my ban was the “straw that broke the camel’s back”. MAL has been an active participant in ban discussions for years, has made many good suggestions, all of which were seemingly ignored. Neither is this the first time SC members have expressed deep discomfort with performing tasks that are generally far outside their areas of core competence. But “information asymmetry” applies in all directions, and I’m not at liberty to disclose what prior SC members have told me in private. Łukasz Langa: If you feel this decision was incorrect, we should definitely discuss How? I’ve done everything humanly possible to be as transparent and open about everything I know on my blog. Which by now contains dozens of specific claims, not a one of which, to date, has been disputed.by anyone, or even publicly acknowledged as having been made by any PSF representative. The stonewalling is total. It’s also the case that I told the SC, in advance, about almost all the things I would be saying if they didn’t speak up first, and about how that would be perceived, and about how that would in turn increase community damage. But they never replied to anything I sent after Aug 8, the day after the ban was announced. I personally was totally stonewalled too. So you can perhaps understand why I find “we should definitely discuss” disingenuous too. If “we” means PSF representatives, they certainly appear to be utterly determined to never clarify anything about my case. For the rest, I too would like to see it spelled out who would do the CoC enforcement currently done by the SC. But perhaps nothing will ever change unless something forces change. Getting the SC out of the ban business first would certainly light a fire that would make filling that gap an urgent priority. I was on the Board, and voted for the first CoC the PSF adopted. Enforcement was the Board’s responsibility then. That’s the most natural place for enforcement to fall. Whether the Board wants to set up another group for enforcement is, of course, up to them. But it should not fall on the SC. They hate doing it, “tach nerds” aren’t generally suited to this kind of work, and at least IMO they are in fact poor at doing it. Not starting with my ban either. Perhaps they do a stellar job at resolv"
