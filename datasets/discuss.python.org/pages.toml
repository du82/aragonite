["https://discuss.python.org/t/three-month-suspension-for-a-core-developer/60250"]
title = "Three month suspension for a Core Developer - Committers - Discussions on Python.org"
description = "(Posting for the whole Steering Council)  The Steering Council, following a recommendation from the PSF’s Code of Conduct Workgroup, has decided to suspend a Core Developer for three months. Quoting the CoC WG’s recommendation:   The user showed these repeated violations of the following behaviors expected by the Code of Conduct:   Overloading the discussion of the bylaws change (47 out of 177 posts in topic at the time the moderators closed the topic), which created an atmosphere of fear, uncer..."
full_description = "Three month suspension for a Core Developer Committers thomas (Thomas Wouters) August 7, 2024, 6:23pm 1 (Posting for the whole Steering Council) The Steering Council, following a recommendation from the PSF’s Code of Conduct Workgroup, has decided to suspend a Core Developer for three months. Quoting the CoC WG’s recommendation: The user showed these repeated violations of the following behaviors expected by the Code of Conduct: Overloading the discussion of the bylaws change (47 out of 177 posts in topic at the time the moderators closed the topic), which created an atmosphere of fear, uncertainty, and doubt, which encouraged increasingly emotional responses from other community members. The later result of the vote showed 81% support for the most controversial of the bylaws changes, which demonstrates the controversy was blown out of proportion. Defending “reverse racism” and “reverse sexism”, concepts not backed by empirical evidence, which could be seen as deliberate intimidation or creating an exclusionary environment. Using potentially offensive language or slurs, in one case even calling an SNL skit from the 1970s using the same slur “genuinely funny”, which shows a lack of empathy towards other community members. Making light of sensitive topics like workplace sexual harassment, which could be interpreted as harassment or creating an unwelcoming environment. Casually mentioning scenarios involving sexual abuse, which may be inappropriate or triggering for some audiences. Discussing bans or removals of community members, which may be seen as publishing private information without permission. Dismissing unacceptable behavior of others as a “neurodivergent” trait, which is problematic because it creates a stereotype that neurodivergent people are hard to interact with and need special treatment. Excessive discussion of controversial topics or past conflicts, which could be seen as sustained disruption of community discussions. Use of potentially offensive terms, even when self-censored or alluded to indirectly. Making assumptions or speculations about other community members’ motivations and/or mental health. In the interest of transparency, let it be known that Brett Cannon and Łukasz Langa, who are core developers of CPython as well as Discourse moderators, abstained in the vote for that recommendation to avoid bias. While we’re following the CoC WG’s recommendation here, we should make clear that we also received direct, very specific communication about the problematic behaviour and its impact. Like PEP 13 says, “Core team members are expected to act as role models for the community”. We’re not taking this lightly. This is an attempt at corrective action, and we hope it impresses upon everyone that these things matter. 41 Likes Calling for a Vote of No Confidence Recommended CoC improvements Shedding light on a three-month suspension David Mertz's keynote address at PyCon Nigeria Calling for a Vote of No Confidence Calling for a Vote of No Confidence stoneleaf (Ethan Furman) August 13, 2024, 6:20pm 4 Thomas Wouters: Like PEP 13 says , “Core team members are expected to act as role models for the community”. I found that Core Developer’s behavior to be exemplary, and this suspension to be proof of the validity of their concerns. I fully agree with this analysis of the situation. If I am still a Core Developer and able to vote for the next Steering Council, I will not be voting for anyone on the current Steering Council. 89 Likes gpshead (Gregory P. Smith) August 13, 2024, 8:02pm 5 Speaking for myself here: I encourage you to run for Steering Council yourself since you seem to want change. We always need more candidates in the pool. I encourage you to read PEP-13 to understand what our role is supposed to be. The current council welcomes constructive feedback on what you think the steering council should and shouldn’t be doing and why. If you believe changes to PEP-13 are warranted, the process for seeking consensus to make that happen is outlined within. I suspect the only statements likely to be seen circulating in public about this summer’s events such as this short term ban may be dominated by interpretations of a single side. People, regardless of opinion on conduct matters, often feel like they’ll be attacked for speaking up. The chilling effect of a space being perceived as unsafe leaves the majority of voices left in a room to trend towards extremes, instead of accurately reflecting the community’s thoughts as a whole. I find it best to think of events like this as a workplace HR response. Bystanders do not have all of the information and generally never will for confidentiality reasons. The “analysis” you link to, at a glance, appears to be conflating past history of contributions with the here and now. Nobody here is claiming past contributions were not valuable. Having done a bunch of useful things in the past does not grant anyone freedom to behave however they want in the future. I believe that’s actually why many perceived it important to do what was done. We try to hold everybody to the same expectations within our community. Regardless of history. 33 Likes Shedding light on a three-month suspension Shedding light on a three-month suspension pitrou (Antoine Pitrou) August 14, 2024, 9:58pm 6 Ethan Furman: I found that Core Developer’s behavior to be exemplary, and this suspension to be proof of the validity of their concerns. I fully agree with this analysis of the situation. If this is true, then my guess of who this is about was entirely wrong, and I’m baffled about this decision. Gregory P. Smith: Having done a bunch of useful things in the past does not grant anyone freedom to behave however they want in the future. I don’t think anyone disputes that. The disagreement is about the list of “violations”, which don’t match my recollection of the behavior of the member mentioned in the above blog post. For example, I might have missed something (I didn’t read all the messages in that thread), but I don’t remember them “making light of sensitive topics like workplace sexual harassment” (which, indeed, would be appalling). A special mention is deserved for “discussing bans or removals of community members […] may be seen [by whom?] as publishing private information without permission”. It’s entirely unspecific, and implies that any discussion of such bans or removals can be reason for banning someone else. 34 Likes Shedding light on a three-month suspension brettcannon (Brett Cannon) August 14, 2024, 10:31pm 7 Antoine Pitrou: I might have missed something Everyone except the person in question has incomplete knowledge of what was said; information asymmetry easily happens when conversations span multiple topics, places, and public/private spaces. At some point I think you have to decide if you trust that the people making the decision had enough information to say and do what they did compared to the information any of us may have been personally privy to. Antoine Pitrou: A special mention is deserved for “discussing bans or removals of community members […] may be seen [by whom?] as publishing private information without permission”. It’s entirely unspecific, and implies that any discussion of such bans or removals can be reason for banning someone else. My takeaway from that is you need to make sure that you have permission from the person who was banned or removed to name them publicly, otherwise you risk outing them when they didn’t want to be publicly named. 10 Likes Shedding light on a three-month suspension pitrou (Antoine Pitrou) August 15, 2024, 8:21am 8 Brett Cannon: Everyone except the person in question has incomplete knowledge of what was said; information asymmetry easily happens when conversations span multiple topics, places, and public/private spaces. Hmm. I was assuming that this was entirely about the “discussion of the bylaws change”, but I realize my interpretation of the announcement may be wrong. It would be good to get a clarification of which spaces were involved. 11 Likes nas (Neil Schemenauer) August 15, 2024, 5:53pm 9 Here are my thoughts on this, FWIW. I think the CoC WG and steering council has acted unwisely in this situation. I agree what Chris has written on his blog about it and with Ethan’s comment. I’ll add that, at least for me, the long history this developer has in serving the project is not the deciding factor. I would consider the reasons and evidence brought forward by the WG to be far insufficient for such action, no matter who the developer was (e.g. if it was a core dev who started this month, I would think the same). I’m not going to address every point from the WG recommendation, Chris did a good job of it. I will add that basing CoC actions merely on complaints of behavior is not correct. It’s too open to be abused by bad faith actors. I’m not saying that’s what happened here but just that the application of CoC policy needs to be based on objective evaluation of evidence of bad behavior. Certainly complaints could initiate a CoC WG investigation into the situation. Comments from people in power similar to “there is secret information that was used to make this decision, trust us” seem to be coming up often now. I don’t dispute that sometimes things need to be keep secret. However, I would hope and expect they are rare cases. Keeping secrets erodes trust. In this specific case, I don’t believe there was some secret details involved (e.g. CoC violating behavior that has not been disclosed). I suspect this action is going to cause some harmful effects to the Python community (beyond the obvious harm of an unjust suspension of a core developer). I support having a CoC policy and enforcing it. I think it needs to be enforced more cautiously so that potential harmful effects don’t outweigh the good ones. 58 Likes pf_moore (Paul Moore) August 15, 2024, 8:53pm 10 Neil Schemenauer: I suspect this action is going to cause some harmful effects to the Python community (beyond the obvious harm of an unjust suspension of a core developer). I support having a CoC policy and enforcing it. I think it needs to be enforced more cautiously so that potential harmful effects don’t outweigh the good ones. I agree. I have every sympathy for the people on the CoC working group and on the SC - code of conduct issues are an extremely stressful and unpleasant subject to have to deal with, and I’d never be able to do that job myself. And I don’t want to add more stress to what they do. Even if this was a mistake, people make mistakes, and we need to accept that and be forgiving. Having said that, I hope that this suspension, and the subsequent community feedback, results in some form of follow-up review from the CoC work group and the SC, to understand how the situation could have been handled better. While I only saw the parts of the offending discussions that were on Discourse, my view is that it was, in general, a fairly difficult conversation, with strongly held (and stated!) views on both sides. The behaviour pointed out as leading to the suspension wasn’t ideal, but it certainly wasn’t unique (maybe in degree it was worse, and maybe some specifics were inappropriate, but in context it was all part of a conversation that had been let get out of hand). My hope is that the various parties involved in handling this situation (moderators, CoC working group, SC, and whoever in the PSF handles this sort of issue) will look very closely at how to handle discussions that are getting out of hand, so that problems like this can be addressed before individual behaviour becomes problematic. I’d like to see people taking more care when they make statements that (for whatever reason) they can’t back up with evidence - “I know stuff I can’t tell you” is an extremely frustrating argument, almost guaranteed to inflame a debate rather than calming it. With luck, we can all learn from it and do better in future. 36 Likes brettcannon (Brett Cannon) August 15, 2024, 9:22pm 11 Neil Schemenauer: I will add that basing CoC actions merely on complaints of behavior is not correct. It’s too open to be abused by bad faith actors. I’m not saying that’s what happened here but just that the application of CoC policy needs to be based on objective evaluation of evidence of bad behavior. Why do you think the action was based on “complaints of behavior” and not an “objective evaluation of evidence of bad behavior”? (Remember I’m not on the SC and recused myself on the Conduct WG for this, so this isn’t meant to be a leading question or anything.) Neil Schemenauer: Comments from people in power similar to “there is secret information that was used to make this decision, trust us” seem to be coming up often now. How far back are you thinking here in thinking it’s “coming up often now”? I fully agree that’s come up a lot this month and last, but I think it was a rather abnormal situation and I don’t feel like it’s been that often. Neil Schemenauer: I would hope and expect they are rare cases. I would hope so as well, but I don’t know if we can “expect” that short of expecting people to not do things that require privacy/secrecy. Neil Schemenauer: In this specific case, I don’t believe there was some secret details involved Why is that (if you can share)? As I said earlier there are unfortunate gaps in everyone’s knowledge, so the best we can do is speculate. But obviously speculating it guessing and that means we can be wrong about how we guessed. Neil Schemenauer: I think it needs to be enforced more cautiously so that potential harmful effects don’t outweigh the good ones. I don’t think anyone involved didn’t weigh that concern (either this time or any other time). I can say that from my time on the SC and the Conduct WG there has never been a conduct decision made where the cost of some action wasn’t thought about or acknowledged when making the decision. I’m not saying you can’t disagree with the balance decided, but I want people to know that in my experience these decisions have historically not been made in a flippant or casual manner (which makes these decisions that much harder, painful, and stressful to make; it was the worst part for me when I was on the SC). I think there are two ways to disagree with what happened: You distrust the SC and/or Conduct WG (somewhat), and so you think (some of) the list of violations are false which negates the corrective action You trust the people involved and thus the list of violations, but you think the corrective action was wrong for the violations (in either direction; too lenient or too severe) To be clear, I don’t think taking either view is inherently wrong (and the same goes with agreeing with what the SC chose to do). But I do want to say that I feel like we are avoiding using the word “distrust” here even though it’s implied. If the SC and Conduct WG are saying “trust us”, either you do or you don’t (I realize you can trust them on some things and n"
