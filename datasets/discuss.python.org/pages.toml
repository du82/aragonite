["https://discuss.python.org/t/is-uvloop-still-faster-than-built-in-asyncio-event-loop/71136"]
title = "Is uvloop still faster than built-in asyncio event loop? - Async-SIG - Discussions on Python.org"
description = "If so, why hasn’t the standard asyncio event loop switched to use it?  I’m considering using it, but am suspicious of it magically being faster with no other tradeoffs or concerns. Sounds too good to be true.  Put another way, as an application author, should I use uvloop for performance reasons?"
full_description = "Is uvloop still faster than built-in asyncio event loop? Async-SIG help drmason13 (David) November 14, 2024, 9:40am 1 If so, why hasn’t the standard asyncio event loop switched to use it? I’m considering using it, but am suspicious of it magically being faster with no other tradeoffs or concerns. Sounds too good to be true. Put another way, as an application author, should I use uvloop for performance reasons? Tinche (Tin Tvrtković) November 14, 2024, 10:20am 2 David: I’m considering using it, but am suspicious of it magically being faster with no other tradeoffs or concerns. Sounds too good to be true. The ecosystem is full of examples like this - orjson is much faster than the json module, structlog can be configured to be much faster than logging, etc. Not everything needs to be in the standard library, where it incurs a maintenance burden on the core devs. 2 Likes elis.byberi (Elis Byberi) November 14, 2024, 2:37pm 3 Python is designed with extensibility in mind! If you’re aiming for better performance, consider using uvloop, an ultra-fast event loop for asyncio. For additional performance-focused tools, explore libraries like simdjson and similar options. drmason13 (David) November 14, 2024, 7:26pm 4 I agree with the responses here. I guess I’m hoping for more confirmation regarding uvloop specifically. I guess I thought that switching the event loop implementation to uvloop wouldn’t be a breaking change (since it’s a “drop in replacement”). I hadn’t considered that, just because it’s API is identical doesn’t mean it is not a maintenance burden Tinche (Tin Tvrtković) November 14, 2024, 7:29pm 5 My experience with uvloop has always been great, so I encourage you to try it and see if it’s faster for your use case (almost certainly will be). 1 Like elis.byberi (Elis Byberi) November 14, 2024, 8:08pm 6 Does the fact that both PEP 492 and uvloop have the same author reassure you? 2 Likes drmason13 (David) November 14, 2024, 8:23pm 7 Yes it does, thank you for pointing that out 1 Like"
