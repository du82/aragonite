title = "Is this forum exclusively about asyncio or is it about async programming in general? - Async-SIG - Discussions on Python.org"
description = "I worked in the telephony field for many years and had significant exposure to SDL (ppl might also know it as rational rose or message sequence charts). I recently released a python library (ansar-connect) that implements this model of operation. Network messaging is built in. Wondering what level of interest there may be in the python community. Perhaps there is a better place to post?"
full_description = "Is this forum exclusively about asyncio or is it about async programming in general? Async-SIG help mr-ansar (Scott Woods) May 28, 2024, 1:11am 1 I worked in the telephony field for many years and had significant exposure to SDL (ppl might also know it as rational rose or message sequence charts). I recently released a python library (ansar-connect) that implements this model of operation. Network messaging is built in. Wondering what level of interest there may be in the python community. Perhaps there is a better place to post? adamsilkey (Adam Silkey) May 28, 2024, 2:23pm 2 Discussion of asynchronous programming with async/await, mainly using the asyncio standard library. If your library implements async (and uses the async/await keywords), I think this is totally the right forum. If not, you might try Python Help, which is a bit of a catchall category, despite its name. mr-ansar (Scott Woods) May 28, 2024, 3:21pm 3 Thanks - will do. It was the “mainly using” that seemed to leave the question open. adamsilkey (Adam Silkey) May 28, 2024, 3:32pm 4 Worst case scenario, one of the forums mods moves it to a better spot. As a fellow user with zero authority, I say post about your project! mr-ansar (Scott Woods) May 28, 2024, 4:10pm 5 Like the all-guns-blazing, but took your advice and posted this; Is there any interest in a new approach to network messaging? Python Help I recently released a new way to do network messaging. Its aimed at anyone wanting to do; multi-processing on a host, e.g. a pool of job processes messaging within a LAN, e.g. site automation messaging across the Internet, e.g. remote weather stations It is designed to take the major headaches out of network messaging (e.g. marshaling, encoding, async sockets, network I/O, network address management), leaving applications as clear as possible. I’m hoping that there is somebody here that is in…"
