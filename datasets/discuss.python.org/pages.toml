["https://discuss.python.org/t/why-is-asyncio-streamwriter-write-sync/63201"]
title = "Why is asyncio.StreamWriter.write sync? - Async-SIG - Discussions on Python.org"
description = "I’m using asyncio for the first time and find it a bit strange that asyncio.StreamReader.read is async but asyncio.StreamWriter.write is sync. Instead asyncio.StreamWriter.drain is async.  Based on experience with streaming IO in other langs, I’d expect the concrete StreamWriter implementation to notice when its internal buffer is full and flush as necessary. Since any write could trigger that case, I’d expect write to be async and for drain to be something you only call for latency/shutdown rea..."
full_description = "Why is asyncio.StreamWriter.write sync? Async-SIG jgarvin (Joseph Garvin) September 7, 2024, 5:37pm 1 I’m using asyncio for the first time and find it a bit strange that asyncio.StreamReader.read is async but asyncio.StreamWriter.write is sync. Instead asyncio.StreamWriter.drain is async. Based on experience with streaming IO in other langs, I’d expect the concrete StreamWriter implementation to notice when its internal buffer is full and flush as necessary. Since any write could trigger that case, I’d expect write to be async and for drain to be something you only call for latency/shutdown reasons. The current design seems to require StreamWriter derived classes to buffer an arbitrary amount of data internally which goes against the goal of being for streaming, where you’re typically trying to stay in memory limits. Why the asymmetry? maximesteisel (Maximesteisel) September 7, 2024, 7:35pm 2 You may be interested to read Guido thoughs on that at the time : https://groups.google.com/g/python-tulip/c/hIGtXVYVfKU/m/3dl-HPC3BM8J 1 Like"
