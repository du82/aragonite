title = "Store current task on the loop - Async-SIG - Discussions on Python.org"
description = "Currently the current task of a loop in stored in a global dict mapping loops to their corresponding current tasks.   However this will perform poorly in free threading build as such I propose to store it  in on the loop itself.   asyncio._enter_task will set the task on the loop as _current_task asyncio._leave_task will set it to None if the task matches otherwise it’ll raise error asyncio.current_task will just lookup the attribute on loop._current_task and return it  Note that there isn’t any..."
full_description = "python/cpython/blob/8d16919a06a55a50756bf083221a6f6cab43de50/Modules/_asynciomodule.c#L102 PyTypeObject *FutureIterType; PyTypeObject *TaskStepMethWrapper_Type; PyTypeObject *FutureType; PyTypeObject *TaskType; PyObject *asyncio_mod; PyObject *context_kwname; /* Dictionary containing tasks that are currently active in all running event loops. {EventLoop: Task} */ PyObject *current_tasks; /* WeakSet containing scheduled 3rd party tasks which don't inherit from native asyncio.Task */ PyObject *non_asyncio_tasks; /* Set containing all eagerly executing tasks. */ PyObject *eager_tasks; /* An isinstance type cache for the 'is_coroutine()' function. */ PyObject *iscoroutine_typecache;"
