title = "Another year of distributed work. A brand new set of questions. – Distributed.blog"
description = "Today most companies are approaching a year of distributed work and looking ahead at another. While the dust has started to settle for most companies, new questions are emerging––from who shoulders…"
full_description = "Another year of distributed work. A brand new set of questions. Mar 08, 2021March 8, 2021 Published by Distributed Editors View all posts by Distributed Editors In May of 2020, I wrote about the move to adopting a distributed model and how change happens slowly, and then all at once. Today most companies are approaching a year of distributed work and looking ahead at another. While the dust has started to settle for most companies, new questions are emerging — from who shoulders tax burdens for remote employees, to what ongoing support looks like for employees and their families. These questions go well beyond the productivity and collaboration topics that typically accompany any discussion around distributed work. And the answers are more important than ever as companies that want to return to the physical office look at another year away from it — and for others that plan to permanently embrace distributed work. A recent article by Chip Cutter and Emily Glazer in the Wall Street Journal examines what another year of remote working looks like along with some insights into how some companies are tackling some big, thorny issues. Discussions about the future of work, such as whether to reduce the salaries of employees who have left high-cost cities, are priority items in board meetings and senior executive sessions across industries, according to chief executives, board members and corporate advisers. Listen to this article 6 minutes Among the questions companies are trying to resolve: Who should shoulder tax costs as employees move to new locations while working remotely? And what is the most effective way to support working parents? Companies say there is much at stake, from the happiness and productivity of employees to regulatory consequences, if they get these decisions wrong. Head to the Wall Street Journal to read the rest of the article. Share this:TwitterFacebookLike this:Like Loading... Mar 08, 2021March 8, 2021"
