["https://distributed.blog/2020/06/19/morra-aarons-mele-introversion-anxiety"]
title = "Episode 21: Morra Aarons-Mele on Introversion and Anxiety in Remote Work – Distributed.blog"
description = "Is working from home a breakthrough for introverts? The answer, of course, is not so simple. Morra Aarons-Mele is the host of The Anxious Achiever podcast for HBR Presents from Harvard Business Rev…"
full_description = "Episode 21: Morra Aarons-Mele on Introversion and Anxiety in Remote Work Jun 19, 2020August 3, 2021 Published by Distributed Editors View all posts by Distributed Editors Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Is working from home a breakthrough for introverts? The answer, of course, is not so simple. Matt Mullenweg’s latest Distributed conversation is with Morra Aarons-Mele, host of The Anxious Achiever podcast for HBR Presents from Harvard Business Review, and founder of award-winning social impact agency Women Online and its database of women influencers, The Mission List. She’s also the author of Hiding in the Bathroom: How to Get Out There (When You’d Rather Stay Home). To learn more about Aarons-Mele’s work, go to womenandwork.org. The full episode transcript is below. (Intro Music) MATT MULLENWEG: You are listening to Distributed with me, Matt Mullenweg. Today’s guest is Morra Aarons-Mele. Morra is the founder of Women Online, an award-winning social impact agency, and she is also the author of “Hiding In the Bathroom: How to Get Out There When You’d Rather Stay At Home.” A title I love. [laughs] It’s a book that rethinks introversion in the workplace. Interested to hear about her experiences so I can learn more about how Automattic can better serve the many introverts on distributed teams and talk about the theory that maybe distributed is better for introverts. So, welcome, Morra. MORRA AARONS-MELE: Hi, Matt. How are you? MATT: Thank you so much for joining. And where are you joining from today just out of curiosity? MORRA: Right outside Boston. MATT: Cool. I’m in Houston, Texas. MORRA: All right. MATT: I celebrated 100 days here yesterday which is my longest I’ve been here in a long time. MORRA: Oh my gosh. [laughter] MATT: So we had a very brief introduction there but what brought you to this topic? MORRA: Uh, life. [laughter] I didn’t know that I was an introvert with social anxiety, I think that’s an important piece of it, which we can talk about as well, until I was about 35 years old. I would never have wanted to be an introvert when I was younger because I didn’t really know what being an introvert meant. I was really ambitious and I worked in sales and marketing and I talk a lot, I’m not shy. And so I remember even taking a Myers-Briggs once in graduate school and sort of gaming it so that I could be as extroverted as possible because I felt like I should be extroverted, you know? MATT: How did you game it? What answers did you change? MORRA: All the answers that are about… This is 16 years ago so I’m… but you know, the answers that are leading you to the E about your interaction style and do you like to be in big groups and all that. Anyway, so it never occurred to me. But what did happen to me was I was just often really, really unhappy at all my jobs. And I had a lot of jobs. I quit a lot of jobs. I hated office politics. I would get really good jobs but because I was sort of preferring to not be in the ring I would get layered over real quick. And then I finally quit my last job for good and started freelancing. And it’s like this lightbulb went off when I was sitting at my kitchen table doing the same work I had always done but by myself on my own time, in my own lighting. I was like, “ohhh this is for me.” And as I spent more time working for myself and learning about work styles and workplace flexibility, I began to read up and realized I am really introverted and I have really intense social anxiety and I have been working in an entirely wrong way for many years. MATT: If it’s worth it, do you mind defining what an introvert is for people and maybe what social anxiety is just so we’re working from the same set of assumptions? MORRA: Yes. The thing about being an introvert is there is no blood test. So you could probably talk to a bunch of different people and they would say different things. And it’s funny because over the years I’ve had people email me and say you’re not an introvert, you’re a highly sensitive person. You’re not an introvert, you have ADHD. This all may be true but the thing about being an introvert is it’s actually not about whether you are shy, whether you’re quiet, whether you are… some people think you’re socially awkward if you’re an introvert. It’s really about how you manage your energy and what kind of situations fill you with energy versus drain you. So this is… I think a lot of people know being… engaging with a lot of people, giving a lot of output all day, getting a lot of stimulus back can be really hard for introverts. It’s hard for most people frankly, but introverts just do not get energy from that constant being on with the people in collaboration. And we are also usually very sensitive to other kinds of stimuli, so lights, noise. If you walk into any modern hotel and it’s full of bright lights and a million different cable channels as well as music piped over the loudspeaker and you want to close your eyes and hide in a dark closet, you might be an introvert. MATT: The energy part has always been hard for me because I… Like, I love seeing people so much but sometimes I do feel really worn out at the end of the day, but I’m not sure if that’s because it was a great day or that was draining my energy. MORRA: I mean that’s the thing, right? I think that even extroverts probably at the end of a long day with a lot of people are drained but they would choose to go back the next day whereas most introverts probably wouldn’t. When we gear ourselves up for something like that it tends to be more performative, it’s something that we have to prepare for, something that we have to get ready for, something that we have to rehearse. And a lot of introverts are performers. Some of our most famous performers, like Oprah and Lady Gaga and people who get up and literally own a stadium are hugely introverted. And this means that when they’re out there, they are giving it their all, they love it, but it is very much about gathering the energy and performing. It may not be a natural switch. You’ll also talk to a lot of introverts and they’ll say, you know, I can go give a speech in front of 3,000 people, no problem, but if I have to mingle afterwards that’s it, I instantly feel drained. MATT: Did you just say that Oprah and Lady Gaga are introverts? MORRA: Mhm. MATT: Wow. MORRA: Yeah, yeah. MATT: Mind blown. Today I learned. [laughter] MORRA: Oprah actually likes to hide in the bathroom to get away from people. MATT: Wow. You mentioned social anxiety. Do you mind defining that for us? MORRA: Social anxiety is a learned trait. So introversion is something that we’re naturally born probably one way or the other, although I think it ebbs and flows given your life experience and your life stage. But people might naturally be introverted if they prefer quiet, if they like to be by themselves, if a great day for them involves being with fewer people versus being with more people. Society anxiety is a learned behavior and it is when you actually fear social interaction and that could be with one other person or it could be a group. It is that experience of walking into a room and feeling like you don’t belong there, everyone hates you, you’re going to make a fool of yourself, it’s really about shame. Ellen Hendrickson, who is one of my favorite psychologists on this subject, calls it the fear of the reveal. So if you’re listening and you think about a time when you walked into — back when we had networking events — a networking event and you felt like you were a total fraud and that you were scared to open your mouth and talk to people because you definitely did not belong in that room, that’s social anxiety. It can come from being ashamed when you’re a kid, it can come from being criticized if you are a quiet introvert for not talking enough. There’s a lot of reasons why we become socially anxious but it’s really about shame. MATT: I didn’t realize that one was learned and one you were kind of born with. MORRA: I mean, I’m not a scientist, but most of the literature would say that introversion is more of a character trait. And the same way that some people really love music and love to work to music and some people need quiet, I think of it like that. You know? It’s just who you are. Whereas social anxiety… Of course there are some people who are more genetically anxious, etcetera, it could be epigenetic, but it tends to stem from learned behavior over time. MATT: What would you say is the prevalence in society, do we know a percentage for introversion or social anxiety? MORRA: You’ll hear it all over the map. Anxiety is very, very prevalent. Up to about a third of adults have some sort of anxiety disorder at some point. Introversion, I’ve heard 40% of the population, I’ve heard 30%. Again, it’s on a continuum. So I would think it’s probably between 30% and 40%. But of course a lot of people convince themselves they’re not introverts so they would never admit or they wouldn’t even know they were. MATT: And that was you at some point, right? MORRA: Mhm. MATT: So if 30% of the population — let’s just go with the lowest — is introverted, why are offices designed like they are? MORRA: Where do we start? [laughter] I think work sucks, the way that most knowledge work places… Actually, the way that most workplaces are set up… Even I see my kids in school, there is such an emphasis on team and collaboration and performance from an early age, it’s really, really ingrained. I think it’s a very western thing. It’s very American. We have a very old-fashioned view of leadership. It is still based on command and control and usually a white guy in front of the room telling us all what to do. And one thing that I think all the white guys who used to run the world — no offense, Matt — is they liked their people close, they liked proximity so that they could work hierarchically and tell people what to do and then gather everyone together and rally the troops. I’m using a lot of quasi-military language, I realize, but I think that’s intentional. And so the office really comes out of that model. It is this hierarchical leadership model where being present means you are committed, you are going to go and report to whoever is in charge, be at their beck and call, which they think means just seeing you, it’s not really that they are engaged, it’s just that they are there. And a lot of leaders over time got to be lazy and think ehh, I just want my people here so I can get them to do what I want. I really think it’s just the old models are really slow to die. MATT: Well there’s probably a lot of CEOs listening that don’t relate to what you just described and I can speak personally that I’ve had impostor syndrome sometimes over the years being like, well, why don’t I travel with an entourage everywhere I go [laughs] like some of these other CEOs I know? And it’s like uhh.. I think there’s some very different models that can be successful. MORRA: 100%, 100%. And again, a lot of the workforce, even before the pandemic, was distributed. I think though that it is the stereotypes, the reality is different but I think that the stereotypes die hard. I think you see it especially in sales and marketing cultures where there is this sense of being present and being on as a sign of being committed. And I think also that it’s all down to communication. Communication is not most managers’ strong suit because we’re not taught how to be effective communicators and to be in touch with our feelings and other people’s feelings. And I’d love to hear your thoughts. I think when your team is distributed and you can’t just gather them in a room, you have to communicate better. Right? You have to rely on different models. And that’s hard work and so a lot of people just don’t want to do that. MATT: Yes, I’ve been thinking a lot about that it’s… It’s not even being distributed or not or centralized or not but the way meetings, the structure of a meeting tends to reward people who do well in meetings. And a meeting is usually a means to an end. Right? It’s to solve a problem for a customer or it’s a… it’s to have some outcome. And there are other ways to get that same outcome. MORRA: 100%. MATT: I think meetings encourage a lot of reaction, so we’re responding in real time versus considering something, thinking about it, editing it. And there is a ton of research already about who speaks up or who is most present in meetings. MORRA: Well and I’ve seen research, and I think this is true, that introverts, we are not as good on the fly. We actually prefer the time to digest and sit with our thoughts. And social anxiety, which a lot of introverts have, is also a real hindrance to performing, what did you say? Doing well in a meeting, being good at meetings. And so yes, the way that meetings are set up, the way that a lot of work is set up is really hard on people who think differently. And I always tell introverts who are in a lot of meetings speak early, just say something, it doesn’t have to be earth-shattering, because then you have registered your presence and you are not going to get that look at the end of the meeting of “hmm, Julie, you haven’t said anything, do you have anything to add?” Which is totally, you know… MATT: Which, by the way, is taught as a best practice. MORRA: Yes. MATT: So I do try to… If I feel like someone is really hanging back in the meeting or it’s being dominated by a few people I try to make a space for the folks who might be quieter. But that probably also might be a little terrifying, you know? MORRA: I don’t like it. I think it’s a team thing, it’s an individual thing, and it’s… I think also if your folks know that you’re introverted they might respond differently if you ask them to talk because they’re like “oh, he gets it.” I think often though it can make people feel like they are being treated like a child and it turns the whole spotlight onto you at the end of the meeting and really can set all those shame bombs, like “why didn’t I say anything, oh my god, they’re going to think I’m dumb, I’m definitely not getting that promotion.” It can really set the ruminating in motion. So I am in general not a fan. It is hard to shut people down though who take up a lot of room. MATT: Yes. What do you recommend then? Because I have definitely seen it as well where there might be gender differences. Often men talk a lot more in these meetings. And so just trying to make room for maybe the not even introverts but just people who don’t have as much room to speak if you just let the meeting dynamic continue uninterrupted. MORRA: I think it’s better to keep it general. Like you said, you could say, “You know, let’s hear from some folks who haven’t talked,” because that also shuts down the talkers rather than picking on people individually. But I also think it’s always worth a one-on-one check-in afterwards because one of the other things that"
