full_description = "Stephen Wolfram on 28 Years of Remote Work Stephen Wolfram started out on an academic career path, but eventually realized that founding a company would allow him to pursue his scientific work more efficiently. He’s served as a remote CEO of Wolfram Research for the last 28 years. In this episode, Stephen shares with host Matt Mullenweg — another remote CEO — his perspective on the value of geo-distribution, and the processes his partially-distributed company uses to make world-changing software. For more, go to Distributed.blog. Produced by Mark Armstrong and the team at Charts & Leisure: Jason Oberholtzer, Whitney Donaldson, Cole Stryker, Levi Sharpe, and Michael Simonelli. Theme music by Jason Oberholtzer. Cover art by Matt Avery.More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Listen to Matt Mullenweg Discuss the Stewardship of the Web on The Rework Podcast Our host finds himself on the other side of the mic on the latest episode of The Rework Podcast. Basecamp co-founder David Heinemeier Hansson invited Matt for a friendly debate about tech monopolies, power in open-source communities, and how Matt views his role as the CEO of a successful company that contributes to the WordPress…More Welcome to the Chaos Sonal Gupta leads Automattic’s Other Bets division, a team that develops experimental products that hover around Automattic’s core business. She relies on her legal background in order to clearly communicate the team’s new ideas to the rest of the company. More Distributed Podcast: Hear Matt Mullenweg in conversation with Sonal Gupta. Read the transcript. Automattic’s Sonal Gupta on Communication and Chaos Sonal Gupta leads Automattic’s Other Bets division, a team that develops experimental products that hover around Automattic’s core business. She relies on her legal background in order to clearly communicate the team’s new ideas to the rest of the company. For more, go to Distri