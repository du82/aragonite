title = "Episode 29: Dylan Field, Figma Co-founder, Talks Design, Digital Economy, and Remote Culture with Host Connie Yang – Distributed.blog"
description = "The latest episode of the Distributed podcast pairs Dylan Field, Figma’s CEO and Co-founder, and guest host Connie Yang, Head of Payments Design at Stripe. Join a discussion on design, instilling r…"
full_description = "Episode 29: Dylan Field, Figma Co-founder, Talks Design, Digital Economy, and Remote Culture with Host Connie Yang Nov 18, 2021November 23, 2021 Published by Distributed Editors View all posts by Distributed Editors Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Nearly ten years ago, Dylan Field and Evan Wallace turned a Thiel Fellowship into a solution to the ‘single source of truth’ problem for design systems. Their interest in design collaboration and WebGL laid the foundation for the origin story of Figma, today’s ubiquitous browser-based design tool — and rapidly-growing company. “The more (we) pulled this thread, the more we learned there’s so much to do in terms of making design better, and in making it so more people can access design within the organization,” says Dylan of their early pursuis. (Spoiler: drone technology was a runner up in their technology explorations). The latest episode of the Distributed podcast pairs Dylan, Figma’s CEO and Co-founder, and guest host Connie Yang, Head of Payments Design at Stripe, with past design leadership posts at Coinbase and Facebook. Connie’s passion — uncovering the bits of magic surrounding us in everyday life — guides their friendly dialogue from design to remote culture and much more. Early in the show, Dylan shares what he’s learned about instilling culture in a rapidly-growing company, especially amid the changes brought on by the pandemic. “The main thing that changes once you go from in-person to remote is you can no longer rely on physical context to instill culture,” says Dylan. “It matters even more to elevate the role of design, and elevate anything you think is really important in that digital context.” Dylan also builds on a recurring Distributed podcast theme over the past year, adding “It’s really important to be intentional about creating serendipitous moments.” Figma’s playful approach to collaboration influenced its recently-launched FigJam, a digital whiteboard that can help fill the need for serendipity. Dylan speaks with the unique authority of a tech leader who has not only prioritized design but, with his team and products, greatly influenced it in a way that seems to have happened just in time for distributed collaboration. “We’ve gone from a physical economy to a digital economy. I don’t think these are new trends or new things that happen but now, all of a sudden it happened all at once, and accelerated massively,” he says, echoing Matt’s May 2020 post Gradually, Then Suddenly. “I think that we’re seeing every part of the economy shape around design,” says Dylan, noting how Figma has even observed collaboration in the product, beyond design, on days when other workplace chat tools were down. Why does it matter? Because now, Dylan says, “Design leads to winning.” Thank you to both of our guests for this latest episode of Distributed. We hope you enjoy it. The full episode transcript is below. *** CONNIE YANG: Hey everyone, welcome to the Distributed Podcast. I’m your host for today, Connie Yang. I am the Head of Payments Design at Stripe and I want to give a huge thanks to Matt Mullenweg for allowing me the opportunity to host this podcast. I am super excited to have an opportunity to talk to one of the leaders in advancing design technology and changing how we all in the industry work together. Dylan Field is not only co-founder and CEO of Figma, a collaborative design tool used by some of the biggest design teams in the space, he is also a leading advocate for bringing more designers into companies and the importance of the role of design in building successful products. He is also a huge proponent of community and an open source approach to design. Dylan, thank you so much for joining us today. DYLAN FIELD: Thanks, Connie. It’s really good to see you. CONNIE: Good to see you too. Dylan, before we even get into Figma and all the momentum you’ve built let’s start by talking about design itself. DYLAN: Okay. CONNIE: It seems like you had some amazing insight nearly ten years ago now on the importance of designers on teams, the way we work with one another and how we work with even non-designers. What did you discover about design in those early days that motivated you to dive into this world of design and creativity? DYLAN: Yeah so I’ve always been interested in design and excited about design product. But I think I started getting really excited about and interested in how do we make design tools better when I started working full-time as a design intern at Flipboard. And at the time I was kind of watching how the tools worked, we were in Fireworks pretty much every single day and collaborating through a Dropbox folder. We kind of had attempts to do a blog where we could post work in progress but honestly all the collaboration was kind of a mess and that was with a very design-forward team. Flipboard was very excited about let’s go make.. Flipboard was really into let’s go make design a really core part of the product experience and how we build product. And leaving Flipboard I was thinking a lot about creative tools with my co-founder Evan and should we go and build a company around this. And on the list was always design. We thought this would be a great area to go into is interface design but we weren’t sure the market was big enough. But honestly it was. Once we figured out that the market was there, the problems were very clear. It was.. the experience of designing product was not synchronous at all. It was you had all these different sources of truth, there was no one source of truth you could rely on. I remember the version problem where you have final underscore, final underscore two, you never know which one is the latest version. And then I started interviewing people at larger organizations and would hear stories about how a file would go halfway across the org at a super large enterprise and suddenly you’ve got some random product manager somewhere who’s mad at some other product manager because they think they’re doing something that they’re not even doing anymore because that was like two months ago. And the single source of truth problem was really huge. I think as we started to think about okay, what does it take to scale design teams up, design systems are incredibly important in that role and without a design system, it was really hard to keep things consistent or scalable. The more we pulled this thread, the more we learned in terms of there is so much to do in terms of making design better. And also so much to do in terms of making it so that more people can access design within the organization. And I think we started to have this thesis about it’s just really important to get more people to do more design and for companies to invest more in design and that’s how companies will win or lose in the future. And I think that has played out and is playing out now, which is really exciting to see. CONNIE: Yeah, I mean now has been a really interesting time. DYLAN: Yes. CONNIE: Especially for Figma, right? So we’re almost two years into the pandemic, lots of change, what are some of the top trends that you’ve seen change with designing remotely and the way that we work? DYLAN: I think there’s a lot of changes generally in the way that work happens right now, especially for teams that were not distributed before. The teams that have been distributed this entire time, I don’t know how much change they’ve seen during the pandemic in terms of the way that they work. But I think that the main thing that changes once you go from in-person to remote is you can no longer rely on physical context to instill culture and it matters even more to elevate the role of design and elevate anything you think is really important in that digital context. And digital contexts have no walls, they are flat, but they are not.. they still have these systems in place were, for example, if I (imagine a digital?) context, if I don’t intentionally make time to talk with somebody, that conversation will not happen. Whereas in an office, we might run into each other on the way to the bathroom or something or waiting for a drink in the kitchen. I think it’s really important to be intentional about creating serendipitous moments. And also I think to elevate the things that you hold dear as a company. I think that the other thing that’s happened as we’ve all gone remote and during the pandemic is that we’ve gone from a physical economy to a digital economy. And we’ve gone from physical spaces to digital spaces in terms of where we congregate. And I don’t think these are new trends or a new thing that has happened. I think that actually has been happening for decades. But now we’re at a place where all the sudden it happened all at once and it accelerated massively. So as you go from a physical economy to a digital economy, it is really important to create a great digital product experience, otherwise you’re not gonna win. And it turns out that everyone, every company needs to do this to survive right now, whether you’re at Stripe and you’re creating a payments API, it actually does matter how good your design is. Whereas maybe 10-20 years ago people would assume actually it doesn’t matter at all. If you’ve a bank, if you want to survive against a challenger bank, you better have a great design. If you are a company that’s doing logistics or industrial, you need to actually have really well designed processes inside the company and good internal tools. And if you don’t design those well you might lose that to Amazon. So I think that we are seeing every part of the economy shape around design and realize that design is a core part of how they win or lose. CONNIE: Yeah and I love hearing all these specific examples that you’re bringing up of how these different companies should be thinking about building products. This is kind of a funny question. How do you think companies are.. Do you think they’re getting better at designing remotely whether they use Figma or not? Is it even possible to design remotely without Figma now? DYLAN: Well we definitely saw a lot of people that, as they went into a remote design scenario, they really wanted Figma. CONNIE: Yeah. DYLAN: So I’m not an expert on the work flows outside of Figma as much but I think it is less painful to design in Figma than not in Figma in general. And that’s definitely true for remote teams. But what do you think? Because you’re in Figma a lot. CONNIE: We are. We are definitely a Figma oriented team. I was trying to imagine what was that world like? You know, we had the issues with updated files and (getting things across?), and all this stuff that you brought up earlier. So I sort of can’t imagine with the speed that we have to work now and the amount of distributed teams that we have, I can’t imagine designing without Figma. That’s pretty rough for me. But hey, props. DYLAN: Okay, thank you. I’ll take that. CONNIE: I definitely appreciate the tool. So Dylan, you and I have actually met a number of times before. DYLAN: Yup. CONNIE: Including co-judging a really big hackathon for crypto projects a few years ago. But big events like this are still not happening live and some will probably be forever remote from now on. So it’s a changing landscape. How can we still support events like this? Is Figma doing anything? DYLAN: Well, I think that again it’s about going from physical space to digital spaces. And if you look at how people are interacting online right now, there is so much happening, whether it’s just on Twitter but also in virtual spaces, whether that’s VR or Gather.Town or people are finding stuff like Clubhouse or Twitter spaces. We’ve even seen it in Figma. People have started to hang out in Figma and that inspired FigJam, which is our digital white boarding tool. And we started watching how people were interacting in Figma, which is basically this abstracted canvas, how they were greeting each other, how they were talking to each other, they were typing text. And we saw Slack went down one day and people started to really interact with each other over Figma instead. I’m not saying that we’re competing with Slack, we’re not, [laughs] no interest in that. But I think as we have seen more people go in these spaces they just want a place to play and they want a place to have these experiences and to be with people and to be collaborative. And I think that design is a really interesting place and role and activity to do where you’re visually creating with each other. And the more that you’re visually creating, the less you’re coming from a place of fear during a pandemic, the less that you have ego involved. You’re just able to get in the sandbox and play. I’ve been really excited to see people do that in Figma, in FigJam. I think in terms of the literal interpretation of your question around getting people together in person or together in event space, I think there’s just so much around that. We have thrown a few conferences during the pandemic. We threw one recently around design systems called Schema through a Config, every year. And just find ways to have people gather around an event, around a.. maybe it’s a product announcement or maybe it’s a topic that everyone cares about. But both finding ways to bring people together but also not have the wideness of the internet be a distraction. There’s so many ways that people that are trolls can come in or noise can get high, and so you have to be very intentional about that too, while also making it so people are able to have that access. Because that’s the beautiful thing, I think, about digital events is that they are not exclusive anymore. Right? You don’t have to find your way to San Francisco to come to Config and it’s hard to imagine going back from that. Even though there’s real benefits to having a physical event, it’s just really lovely to have that access for everyone in our community. CONNIE: Yeah, it’s like opening a gate, why would you close that again? DYLAN: Yeah. CONNIE: I really liked how you referenced so much of the word ‘play’ when describing Figma. And one side bar I want to dig into a little bit, when you say you watch designers or you see people using it in the space, what is that kind of user research like for you? Are you literally watching designers? DYLAN: Well, we do a combination of things. I mean, we talk to people, we watch people user research sessions use Figma, we talk about their lived experience and ask them questions about how they use it, what artifacts people create. We look at the way we use it ourselves, too. That’s a huge way we learn. And then I think also just.. for example for FigJam, one of the things I heard most about was how people were excited to do these playful things. And we watched ourselves use it and that’s what inspired the name FigJam. It’s a playful name. We’re using it and we’re trying different things and seeing what resonate"
