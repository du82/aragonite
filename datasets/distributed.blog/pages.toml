full_description = "A new podcast, 15 years in the making. May 15, 2019August 3, 2021 Published by Matt In 2002 I started contributing to Open Source software, and life has just gotten better from there. Co-founder of WordPress, founder Automattic. View all posts by Matt Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Matt Mullenweg, cofounder of WordPress and CEO of Automattic, embarks on a journey to understand the future of work. Having built his own 850-person company with no offices and employees scattered across 68 countries, Mullenweg examines the benefits and challenges of distributed work and recruiting talented people around the globe. Produced by Mark Armstrong and the team at Charts & Leisure: Jason Oberholtzer, Whitney Donaldson, Cole Stryker, and Michael Simonelli. Theme music by Jason Oberholtzer. Cover art by Matt Avery. Share this:TwitterFacebookLike this:Like Loading... May 15, 2019August 3, 2021"
