full_description = "Episode 23: Lara Hogan on the Secret to Being a Successful Manager Are companies setting up their managers for success? What are BICEPS? How do you assemble your colleagues like a management Voltron? Lara Hogan is the founder of Wherewithall, a firm that specializes in management and leadership training. She’s the author of Resilient Management, a must-read for anyone who is a manager, wants to become one, or generally just wants to learn how to be a better teammate.More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. 161 Ways to Practice Self-Care While Working from Home We asked our colleagues: How are you taking care of yourself during the pandemic? More Distributed FAQ: Should Companies Use Software Tools to Monitor Remote Workers? In a distributed company that cultivates trust, employee surveillance is counterproductive.More The Things You Learn about Leadership after 10 Years at a Distributed Company A veteran of fully remote work shares tried-and-true tools for leading distributed teams. More Episode 22: Raj Choudhury Sees a Future Where You Don’t Have to Move Your Family for a Job “We have introduced so many frictions to people’s lives by forcing them to move.” Prithwiraj (Raj) Choudhury, the Lumry Family Associate Professor at Harvard Business School, studies the future of work — specifically the changing geography of work. What happens to cities, to immigration policies, and to issues around gender equity when more companies let people work from anywhere? More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Are We at the End of the “Culture of Presentism and Micromanagement”? With a few more months of (forced) remote work due to the pandemic, the benefits of the distributed model have gone mainstream.More Distributed FAQ: What Does the Ideal Remote Office Setup Look Like? One of the best things about distributed work is that everyone gets their own corner office.More"
