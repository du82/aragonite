["https://distributed.blog/2021/04/22/getting-legal-work-done-in-a-distributed-environment-paul-sieminski-with-chad-main-on-technically-legal"]
title = "Getting Legal Work Done in a Distributed Environment: Paul Sieminski with Chad Main on Technically Legal – Distributed.blog"
description = "Automattic’s General Counsel, Paul Sieminski, recently joined the Technically Legal podcast to talk about how legal work can thrive in a fully distributed company. “It’s aimed at a legal audience, …"
full_description = "Getting Legal Work Done in a Distributed Environment: Paul Sieminski with Chad Main on Technically Legal Apr 22, 2021August 3, 2021 Published by Distributed Editors View all posts by Distributed Editors Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. 500-page bound merger agreements, office printers, and libraries lined with law books. Legal work looks a lot different now that most in-house counsel (and law firms for that matter) have adopted some form of distributed work. But that doesn’t mean the work itself has changed. Contracts still need to be written and signed, litigation still needs to happen, and employment law might be more important than ever. What’s become clear over a year into a global pandemic is that legal work can be even more effective without the office. To make it happen, however, lawyers need to adapt their communication mediums and technology in a way that fits company culture and mission. Automattic’s General Counsel, Paul Sieminski, recently joined the Technically Legal podcast to talk about how legal work can thrive in a fully distributed company. “It’s aimed at a legal audience, and I love to remind my fellow layers how much value we can add to a distributed organization,” said Paul of his appearance on the podcast. “We are trained to communicate clearly, and especially to write cogently and persuasively. These are invaluable skills in any environment, but especially in an environment where writing is paramount…like a distributed company.” Paul has written on the topic in other places, such as Modern Counsel. He talks about communication starting just after the 23:00 mark with host Chad Main. For that discussion, and legal topics spanning the advantages of creating a searchable document database, to what tools and protocols we use to communicate transparently while protecting confidentiality, you can learn more about legal work in the distributed model by listening to the full episode here. Share this:TwitterFacebookLike this:Like Loading... Apr 22, 2021August 3, 2021"
