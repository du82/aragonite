full_description = "Why Distributed Companies Will Likely Move Away from Location-Based Compensation Hiring from a global talent pool should also come with equitable compensation policies.More Distributed FAQ: How Do You Create Company Culture When You Rarely See Your Colleagues? You can promote shared values and experiences even when your company doesn’t possess a single hallway or water cooler.More Matt Mullenweg with Reid Hoffman on Managing Remote Teams “What’s enabled by being distributed that’s more powerful?”More How Zillow Is Adapting to Distributed Work “I expect this will have a lasting influence on the future of work.”More Twitter Will Let Employees Work from Home Permanently Jack Dorsey emails employees with a plan for the future. More Distributed FAQ: How Does Crisis Management Work in a Remote Context? Every business finds itself in difficult situations every once in a while. How do you tackle them with a globally distributed workforce?More On the Psychology of Remote Meetings Our brains are optimized to process in-person communication. What happens when we need to adjust to seeing a grid of faces on a screen?More Distributed FAQ: What Are the Key Tools for Creating an Effective Remote Work Environment? From the physical (a good lamp!) to the abstract (trust), here are the tools that can make a real difference in your distributed life.More Episode 20: Adam Gazzaley on the Distracted Mind During a Crisis Matt Mullenweg speaks with neuroscientist Dr. Adam Gazzaley, co-author of the book The Distracted Mind: Ancient Brains in a High-Tech World, about how our brains work, particularly during times like the current pandemic. How does the brain handle internal and external stimuli, and what do we know about the effect of practices like meditation, exercise, nutrition, and sleep? More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen."
