["https://distributed.blog/2021/05/10/hiring-for-distributed-companies-angel-investing-this-week-in-startups-with-jason-calacanis"]
title = "Hiring For Distributed Companies & Angel Investing: This Week in Startups with Jason Calacanis – Distributed.blog"
description = "“Why would the best employees in the world choose so little autonomy in the third of their day or more that they spend working?” Matt Mullenweg asks Jason Calacanis in a recent appearan…"
full_description = "Hiring For Distributed Companies & Angel Investing: This Week in Startups with Jason Calacanis May 10, 2021August 3, 2021 Published by Distributed Editors View all posts by Distributed Editors Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. “Why would the best employees in the world choose so little autonomy in the third of their day or more that they spend working?” Matt Mullenweg asks Jason Calacanis in a recent appearance on the long-running This Week In Startups. The angel investing-themed episode opens with both investors sharing their approaches to early-stage companies, supporting entrepreneurs, and making an ecosystem-building impact, on top of return-on-investment. The conversation soon shifts toward the outlook for distributed work. “What do you think the world’s going to look like in six months when everybody’s got their shots and is back to work, in at least the United States and Europe?” Jason asks. Matt shares a hiring insight for distributed, global companies, from the changing perspective of a talented individual who can now work from many more places: “You can really build a robust social network with folks you choose to connect with…(anything) that gives you that sense of community, not just where you happen to work.” Matt’s latest appearance on the show – he first appeared on Episode 26 in 2010, according to Jason, and again in 2013 – touches on Automattic’s business structure, using collaboration tools like P2 to onboard new employees, cryptocurrency, and the value of editors. “I haven’t met a single writer – or any of my own writing – that hasn’t been vastly improved by really great editing,” says Matt. “Engaging your ideas with another human just improves them every single time.” You can listen to the full This Week in Startups episode here, or check out the YouTube channel. Share this:TwitterFacebookLike this:Like Loading... May 10, 2021August 3, 2021"
