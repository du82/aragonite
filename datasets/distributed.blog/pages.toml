full_description = "Episode 15: Inside the Grand Meetup Nov 26, 2019August 3, 2021 Published by Matt In 2002 I started contributing to Open Source software, and life has just gotten better from there. Co-founder of WordPress, founder Automattic. View all posts by Matt Read more about the Grand Meetup in “The Importance of IRL in a World of Screens.” Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. On this episode of the Distributed podcast, we get an insider’s look at the Grand Meetup, Automattic’s annual weeklong all-staff event, where employees have an opportunity to collaborate, learn from one another, and hang out face-to-face. Folks from across the company share what makes this gathering so special, talk about social cohesion in the context of a large distributed company, and reflect on what’s great (and what’s tough) about the distributed lifestyle. The full episode transcript is below. *** Mark Armstrong: Okay go. Josepha: The song that’s in my head right now is “Good morning. Good morning.” My name is Josepha Haden Chomphosy. I shouldn’t say it like a question. That is my name. My name is Josepha. Mark: Great to see you. Thank you for stopping by the Automattic podcast booth. Josepha what do you do with Automattic? Josepha: Great question. A little bit of everything. I am the lead of the .Organization Division, which is the division that supports and helps to guide a lot of our open-source work with the WordPress project itself. /// Mark: Who are you? Tell me your name. Aaron Douglas: My name is Aaron Douglas. I am a Mobile Wrangler for Automattic. My official job title is actually Chief Tater Tot Officer — I neglected to change that and it just stuck. I work on the WooCommerce mobile app as my primary thing, but everywhere around Automattic I try to help out where I can. /// Mark: OK. Here we are in the hallway again. What’s your name and what do you do at Automattic? Brandon Kraft: Hi, I’m Brandon Kraft. I’m a Code Wrangler working with our Jetpack plugin. /// Mark: What is your name? Sheri: Sheri Bigelow. Mark: And what do you do at Automattic? Sheri: I am an Excellence Wrangler. /// Rocío Valdivia: My name is Rocío Valdivia. I am from Spain and I’m a Community Wrangler at Automattic. /// Achaessa James: I’m Achaessa and I’m with the Legal team. /// Will Brubaker: So my name is Will Brubaker. I am the Chief Mechanical Officer. /// Erin Casali: So hello, I’m Erin Casali, often referred as “Folletto,” and I currently work as the Design Lead of Jetpack. And how long? It’s been a while now, six years. Mark: Where are we now, here? Erin: So we are — I think — in Orlando, because we are inside a hotel, and have been a while, so I’m not entirely sure where we are? Your hotels look all the same. But we’re in Orlando. I lost count of time. I think we are on day three or four of the Grand Meetup. Mark: It really is a blur, isn’t it? Erin: It is. Mark: Thank you for being here. Matt Mullenweg: Howdy howdy, I’m Matt Mullenweg, the CEO of Automattic, and the host of the Distributed podcast. Those voices you just heard? Those were Automatticians — folks who work for Automattic — and today we’re going to be hearing from them about this year’s Grand Meetup, and more broadly, what distributed work means to them. Back in September, Automattic held its annual Grand Meetup, which is the one time during the entire year that pretty much everyone at Automattic gets together in one place. The other 51 weeks of the year, we all work from different places all over the world — over 70 countries now. So this is a chance for some of us to meet face-to-face for the first time, and for everyone to catch up with old friends, discuss our work and align around our goals, and hear great talks from folks like Stephen Wolfram (who was a guest on this podcast a few weeks back). We set up a recording booth at the meetup and talked to a bunch of folks from around the company to hear about their experiences with distributed work. My colleagues Mark Armstrong and Ben Huberman were on the ground, asking questions throughout the meetup. Mark and Ben are from Automattic’s Editorial team, and they’ve also been helping out a ton with this podcast. We’ll kick things off with some Automatticians talking about why meetups matter for distributed teams, then get into an interview with Megan Marcel, our Director of Global Events & Sponsorships, about what it takes to pull off this huge event with so many people — I think we had around 900 this time. Then we’ll hear some remote work tips, and finish with some stories about why these folks have chosen the distributed lifestyle. OK, let’s do it. Take it away, Mark. Mark: OK, thank you, Matt. Now that we’ve met some of our colleagues from Automattic, let’s go deeper and learn a little bit more about their experiences at the Grand Meetup. If I can set the scene a little bit, Ben and I stationed ourselves at different tables outside in the hallways of this conference room in Orlando — just a few miles from Walt Disney World. We just flagged down people as we saw them, or people would see us with a microphone and say, “Hey, what’s that? Can I get interviewed?” I have to say it was super fun to have an excuse to pull people aside and interview them and ask them about their experience at the Grand Meetup. It can be such a nerve-wracking experience to be surrounded by all the people you work with, so it’s just fun to take a step back and look at the scene, and ask some questions of each other on what it’s all about and why we’re even there in the first place. Mark: Now we’re here at the Grand Meetup in Orlando, Florida. What is the Grand Meetup? Josepha: The Grand Meetup is basically like a company all-hands. I think that’s how corporate places call it, where we get everybody from the company who’s able and willing together in one place to do some additional training, additional team-building, and a lot of [the things that have] to happen when you work in a distributed company. So when you work in a distributed company, every time that you interact with your colleagues via text, or however you are away from them, you are taking out of your social bank account with them. And so when you get people together, that’s when you have the opportunity to see each other face to face, remind everybody that you’re all human beings, and fill that social capital back up, because it’s so hard to communicate via text. That’s one of the main benefits of bringing everybody together this way. Of course we have a lot of trainings and a lot of opportunities to have high-bandwidth conversations. But I think that’s one of the main benefits, and it’s almost a side-effect benefit. I don’t think anyone thinks actively about that when they bring everybody together for this. /// Mark: When did you join Automattic? Achaessa: November 1 in 2018, so I give a flash talk this year. It’s my first GM. Mark: Fantastic. So what how has it been so far? Achaessa: The GM? I love it. I love it. I’m meeting all these people who I’ve been working with all this time and it’s so awesome. It’s like the best in the world. /// Will: It’s a very energizing experience to be here. My job is very demanding, and my life is very demanding, and everything around us is very demanding. I start to get de-energized in about July or August, and it’s also like things are physically — it’s hot outside, and things are more difficult in this time of year, at least for me. But then I get here, and I get around people and I ask questions there that are on my mind and what I’m passionate about, and I want a real answer here. And you know what? I get a real answer, and I get an answer that inspires me and makes me want to go home and work harder. You know what? I’m empowered now to fix the things that have exhausted me, and we’re going to start over, and we’re going to move towards the next year’s goals, and I’m very clear what those are. And that’s what this does for me, is that it’s a reset. It energizes. /// Ben: So right now we are in Orlando for the annual Grand Meetup. What does the Grand Meetup mean to you? Rocío Valdivia: Wow. The Grand Meetup means a lot of things to me. I love the energy. I come back home with all my batteries charged for the rest of the year. I’m very aligned with the values of this company and I’m very aligned with the kind of people that I find here in general. Nobody’s normal, right, and everybody’s different in so many different ways. And in this company you can be however you want to be, and [be] nice to each other. And something that I will highlight as well is that everybody helps each other. I love that. And what I value the most about the GM is the connections that I create in person, that I can use them. It’s like I take advantage of all the connections I create in person during the GM the rest of the year. I learn more what people do. For example, I sit down and I meet someone during lunch and hey, this person just tells me that [they] work in marketing or [they’re] working on this and that. And then we have a conversation and we realized that we have so many things in common. And then for example, I am marketing seeking help maybe with WordCamps, and then we start planning. “Oh we should do this. We should do that.” And I love it. Because normally those kinds of things don’t happen during the year because you are so focused on your daily-basis job that you can not find the time to just hang out in different teams’ channels. I don’t normally do it because [I am] so busy. Right? /// Mark: What was your first Grand Meetup like? Josepha: Oh, my first Grand Meetup was terrifying. I’m a wild extrovert, especially compared to a distributed technology company standard-issue employee. Wild extrovert. Mark: What are you talking about? Josepha: “I’ve never heard of such a thing!” I was told by my team lead at the time that I didn’t need to prepare for anything because I was so extroverted. And so I arrived and I had no idea what to expect or who was there. I joined a tiny team — like seven people, maybe six even — and so I joined and I knew them and that was it. I didn’t know that there was this whole other company going on. I didn’t know that we had classes we had to attend. I just showed up to stuff randomly on the day that they were happening and it was really stressful. Even for me, I remember thinking at the end of it like, “I’m not sure that I’m an excellent fit here.” I wasn’t prepared. Everybody knows everyone. I don’t know anyone. I have nothing in common because of course I hadn’t spent any time trying to figure out where I was headed. It was really stressful. But I made it through. Mark: It’s a sensory overload, isn’t it? Josepha: Yeah. It’s like the first time you go to CES, in case anyone does. You can make it about two-and-a-half days before you’re like, “This is terrible and I’m going to hide in my room until everyone is gone. And then I’m going to get on the first very slow transportation out of here, and that’s it.” Mark: But it’s like CES, but they are everyone you work with, and a bunch of people who you have already chatted with, but you have never met them in person. Josepha: Exactly. Exactly. And you’re not sure whether you inadvertently offended them. And sometimes you completely forgot to respond to them cause you hadn’t figured out how to use all the communication channels yet. And they’re like, “I asked you something two months ago, it probably shouldn’t have been time sensitive, but now I’m mad and it is.” So you run into all these surprises because you hadn’t figured out how to communicate. You hadn’t figured out how to work with all of the information that comes in because there’s so much information all the time and you have to be proactive about finding it, which is good, in a way, and also really difficult in ways as well. Mark: We’re in a big hotel complex in Orlando, Florida right now. We’ve got a bunch of employees in front of us. How does this compare to your first Grand Meetup? Josepha: It was so much more casual, because, if you think about the difference between 300 employees to almost a thousand employees, and the types of employees, and the roles that they have — that we’ve taken on since then — it was so much more casual. It was almost familial before. And I don’t know if it’s mostly a matter of the way that my work has changed, but I remember that I was in full discovery mode the whole event and just trying to figure out who did what and why, and where all the work came from, and what we were doing, and why we did it. And now it feels like — and I don’t know if it’s accurate or not — but it feels like for the most part, everybody already knows where they’re supposed to be, what they’re supposed to be doing, how the work is supposed to go. We show up and everybody already has this excellent plan and a goal for what to do for the week, even if that goal is “finish my support rotation.” And I think that’s a really nice thing, to have a really easy, collegial sense, which before was a “Hey, casually figuring out what to do now that we’ve arrived.” Mark: Now there’s another element to Grand Meetups that continues to this day, although it’s evolved a bit. Your first Grand Meetup, correct me if I’m wrong, you did not know that you were going to have to present a flash talk? Josepha: Yeah, I didn’t quite know. I had never seen a flash talk. I didn’t even do any research. So I arrived and someone had told me, “This is a thing that has to happen but it’s really easy, because you’re an extrovert, and so you show up and you talk for four minutes, it’ll be easy.” Now I love public speaking and I’ve done a lot of it, and four-minute presentations for me are way harder than 45 minutes, because you have to choose and plan what you’re going to say, every second of all of that. You don’t have any room for extemporaneous chatter. And so I showed up and they were like, “Oh we never received your slides.” And I was like, “What slides? Why do I need slides? What is it? What is the flash talk?” It’s short. I thought I just had to get up and say my name. And so I had to suddenly pull together slides and it was the most boring, bland title for a talk I could have ever imagined. It was like “Learning to be a better mentor,” which is super on-brand for me. And also, especially seeing what I do now, super on-brand for the future of my work here. But I didn’t know that at the time. No one else knew it at the time. I was just someone here to manage meetups. Man, I felt so stupid because everyone else is “Making paella the best: why Spaniards hate your stupid ham.” And mine was like, “Be a better mentor.” I was so serious. I showed up and I was serious and it was mildly embarrassing, but I survived. Mark: I have to say, I think I remember watching your flash talk and saying, “Yes, Josepha is here.” I really enjoyed it. I remember enjoying it. Kudos to you. Josepha: Thank you. Mark: But it is a funny thin"
