full_description = "For Years, VR Promised to Replace the Office. Could It Really Happen Now? How VR might empower remote workers with high fidelity communication.More Distributed Podcast: Hear Matt Mullenweg in conversation with John Vechey. Read the transcript. ‘The American Dream Is Broken, and I Think We Have a Shot at Fixing It.’ Upwork CEO Stephane Kasriel on how distributed work will spread opportunity around the globe.More Distributed Podcast: Hear Matt Mullenweg in conversation with Stephane Kasriel. Read the transcript. Upwork’s Stephane Kasriel on Fixing the American Dream How changing the way we think about work can give workers freedom and flexibility. For more, go to Distributed.blog. Produced by Mark Armstrong and the team at Charts & Leisure: Jason Oberholtzer, Whitney Donaldson, Cole Stryker, Levi Sharpe, and Michael Simonelli. Theme music by Jason Oberholtzer. Cover art by Matt Avery.More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. A new podcast, 15 years in the making. I created a company with no offices. Now it’s time to share what I’ve learned. More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. WordPress Showed Me the Power of Distributed Work. It’s Time to Share What We’ve Learned. 900 employees, 68 countries, and no office. More"
