full_description = "Yes, Remote Work Can Hamper Creativity. That Doesn’t Mean It Has To. The RTO debate has a new point of contention, it seems. At CNBC’s recent Workforce Executive Council Summit, Ellevest CEO Sallie Krawcheck said that her team has been more successful overall and even better at hitting deadlines since moving to a fully distributed model. But that came at a price, she added: “We are less…More Atlassian Doubles Down on Distributed Work In a recent interview with Fast Company, Annie Dean, Atlassian’s VP of Team Anywhere, made it clear that the Australia-based software company’s future is distributed. Dean was a proponent of flexible work long before she came to the company known for collaboration tools like Trello and Jira, but in the years before the pandemic, her…More RTOblox: Roblox Steps Away From Remote Work In a recent post to the Roblox company blog, founder and CEO David Baszucki mandated that the large majority of Roblox’s remote employees return to a physical office in 2024. Citing concerns about “Zoom fatigue” and lack of creative collaboration, he concluded that “we aren’t there yet” when it comes to a remote work technology…More The New York Times Takes Stock of the WFH Revolution In a recently published article, The New York Times offered a brief overview of some things society has learned (or not) about remote work. More than three years after the pandemic kicked off what reporter Emma Goldberg calls “a mass workplace experiment,” plenty of companies have yet to figure out what works—either for employees or…More Episode 30: The Magic of Meetups On this episode of the Distributed podcast, we dig into the good, the bad, and the history of Automattic meetups. More Episode 29: Dylan Field, Figma Co-founder, Talks Design, Digital Economy, and Remote Culture with Host Connie Yang The latest episode of the Distributed podcast pairs Dylan Field, Figma’s CEO and Co-founder, and guest host Connie Yang, Head of Payments Design at Stripe. Join a discussion on design, instilling remote culture, and the digital economy, including Field’s perspective on the role of design in technology. “We’ve gone from a physical economy to a digital economy. I don’t think these are new trends or new things that happen but now, all of a sudden it happened all at once, and accelerated massively,” he says.More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen."
