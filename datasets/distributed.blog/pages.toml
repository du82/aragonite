["https://distributed.blog/2023/05/26/episode-30-meetups"]
title = "Episode 30: The Magic of Meetups – Distributed.blog"
description = "On this episode of the Distributed podcast, we dig into the good, the bad, and the history of Automattic meetups."
full_description = "Episode 30: The Magic of Meetups May 26, 2023June 19, 2023 Published by Distributed Editors View all posts by Distributed Editors On this episode of Distributed, we dig into the good, the bad, and the karaoke-filled history of Automattic meetups. Before the COVID-19 pandemic, our annual Grand Meetup brought the entire company together for a week. The time spent together — along with team-specific meetups scattered throughout the year — helped us strengthen relationships with our colleagues located around the world. Now, as companies and workers grapple with returning to the office, it’s a perfect chance to consider in-person time as an important complement to the autonomy and flexibility of distributed work. We spoke with Automatticians about how to stay connected in a distributed work culture. You’ll hear from Toni Schneider, Automattic’s first CEO, Josepha Haden Chomphosy, Executive Director of the WordPress Project, and Nick Gernert, CEO of WordPress VIP, along with a wide range of Automatticians. The full episode transcript is below and has been lightly edited for clarity. *** MATT MULLENWEG: Howdy howdy. This is Matt Mullenweg, the co-founder of WordPress and the CEO of Automattic, and you are listening to the Distributed podcast, which is back after a – I’m embarrassed to say – 500 day hiatus, roughly. I wasn’t as drawn to do more Distributed episodes last year. One because I got super busy and, you know, 2022 I started running Tumblr directly and WordPress.com. So, things at work got pretty busy, but also just felt like everyone was doing it. Everyone had kind of figured out the remote and distributed thing. And it was going fine. So like, the reason I started the podcast was done so the purpose, the goal I set out to accomplish was completed. However, recently there’s been a lot of news about companies who are rolling back their employee flexibility and forcing people back into the office 2, 3, 4, 5 days a week. Sometimes, they might be doing this as a way to lay people off. It’s hard to tell the motivations of some of these executives. But some, I think, in good faith are saying that they were missing something when people weren’t getting together and that employees that joined during the pandemic maybe weren’t as productive as employees who joined prior. It got me thinking and I started to wonder if what they were missing was meetups. So there is something magic, some frisson that happens in person, that’s impossible to recreate. At Automattic, we just don’t think that needs to be 52 weeks a year. Just like a little salt makes the dish, getting together in person a few times a year is a key ingredient of Automattic’s culture. So I wanted to share with the world and podcast listeners who are now seeing this pop up after 500 days. How we do meetups at Automattic and why it’s so key. So, I tapped my colleague Chenda Ngak to gather some stories and best practices from Automatticians of how we do meetups. We’ll also put together some guides on the distributed.blog website, after this episode is up. But please get together. Seeing people is important. And without further ado, I’ll pass you over to the Chenda. CHENDA NGAK: Grand meetups at Automatic are the stuff of legends. We paused them because of the pandemic and have slowly restarted smaller meetups over the last year. Meetups have been an important tradition ever since the first meetup in 2006. Now, I’d never been to a grand meetup, so I wanted to hear what it was like from Automatticians who have attended. I started with Lori McLeese. She leads our global people team from Asheville, North Carolina. I couldn’t think of a better person to give me a crash course in meetups. She’s been at Automattic for a decade, and her team is connected to every Automattician around the world. LORI MCLEESE: So, the different types of meetups that Automattic are our Grand Meetup, which is when the whole company comes together. Unfortunately, we have not had an all company meetup since the end of 2019 because of the pandemic. However, when we were having them before that, it usually lasted about seven to eight days and we usually held them in September or October, and it was a week when the whole company could get together. We could learn from each other. We could do projects. We could hear amazing speakers, you know, spend time together, both as teams and with people that maybe you don’t work with on a normal basis and just have fun and build relationships. So, that’s one type of meetup. A second type of meet up is team meetups, which is very similar to the Grand Meetup, but on a much, much, much smaller scale. So, team meetups are usually anywhere from four to 10 people. The team actually decides where to go, what to do, what type of social activities they want to be involved in. And as a company, we give them a budget and then the teams make all that decision. And we ask people after their meetups to actually write a summary on our internal, we call it Meetomattic and it’s a P2 or a website where all the teams record experiences of their meetup and actually rate the location about whether it would be good for other teams to go. CHENDA NGAK: So, for those who don’t know, Lori is talking about an internal network of blogs called P2. The recaps on P2 are like a mini city guide with best restaurants, activities, the team’s itinerary for the week, and the average cost of throwing a meetup in cities around the world. LORI MCLEESE: And then a third type of meetup is a division meetup, and that’s when several teams within the division get together. And I would say that those depending on the division run from like 75 to maybe 200 people. So, it’s a little bit of a mash up between team and Grand Meetup. CHENDA NGAK: Why do you think that meetups are so important for our culture? LORI MCLEESE: While it’s great to work from home, work distributedly, work from anywhere, there is something missing when all you ever have is either text communication or perhaps even video communication and I think one of the best things about meetups is that that’s where spontaneity can occur. CHENDA NGAK: I wanna expand on that and see if we can talk a bit about what meetups mean for team morale and inclusion. LORI MCLEESE: For team morale, there is an excitement not only of being at the meetup, but also planning the meetup and talking about what do we want to do together? Whether that’s the work activities or the social activities, and learning about people’s preferences for inclusion. It’s also really important because we have a pre-meetup survey that we ask each attendee to complete as the team members are planning the meetup. And you know, it’s not just dietary needs, which are important, but it’s things like how far are you comfortable walking? Are you comfortable speaking up in public or would you rather have the questions beforehand? And so it gives you an understanding of people’s work styles, which are very different and helps the organizers to really plan a much more inclusive event. And those learnings then carry over after you get back from the meetup when you’re working online so that you can remember like, oh, this person doesn’t like to be called out on the spot. They like to have questions in advance so that they can think about it before presenting an answer. CHENDA NGAK: Now that Lori has explained the different types of meetups, I thought it would be interesting to get background on why we started doing them. So, I caught up with Toni Schneider who joined Automattic in 2006 as its first CEO, just six months after the company was founded. TONI SCHNEIDER: I think the reason we started having meetups right away and they worked right away is because there was a meeting of the existing team that was already distributed and working together via open source and really liked meeting in person every once in a while. So, that was already a pattern that was established and in my background, coming from other startups and spending a little bit of time at Yahoo, at a bigger company, kinda seeing if we fast forward this, if WordPress gets huge and we have a huge team, how can we make this work at scale? That’s gonna be different than those big companies. And the big companies I saw were, when they were doing meetups, it was really offsites and they were awkward, in my opinion, because people were already spending all day together at work. And they’re like, “How do we have to now go somewhere else and spend even more time?” And they’d be very scripted and all about the product roadmap and all these things. And I knew we didn’t want that at all. We flipped it upside down and said, what if we had a meetup and did essentially no work, nothing extra, nothing scripted, purely focus it on social time, purely focus it on bonding because that’s what we need more of. And then we saw things that came out of the meetups that I don’t think would’ve arisen otherwise. And I think that’s why we kept doing them too. Things like P2 came out of the meetup and that became hugely important for the company. We had town halls and we had flash talks, things like that. I think, are examples of things that just happen when you get together in person and just kinda see what arises for people. WordCamps were another example. You know, the first WordCamp was essentially a brainstorm in one of our meetups and said, “Let’s try it.” CHENDA NGAK: Do you have any practical advice for startups that wanna throw a meet up today? TONI SCHNEIDER: Yeah, I think it’s important to set the expectations. And we have to be pretty explicit and say, “No, this is part of the job. This is part of your expectation. You can’t skip these.” And it’s really important to say that up front to people and say, “Look, there’s 52 weeks in a year. You know, you’re gonna maybe work, I don’t know, 40-some of those. And most of that’s gonna be at home and you’re totally in control, but you know, probably two or three weeks a year, you’re gonna participate in these types of activities.” CHENDA NGAK: Another thing that I was curious about is if you’ve noticed meetups come up in other conversations with any startups that you’ve been working with, or in the tech industry in general. TONI SCHNEIDER: Oh, absolutely. I mean, I am now with True Ventures. We have ours, a little shorter, usually three days every quarter, four times a year. Most of the startups I work with – we have over 200 in our portfolio. At True, everybody is at least partially remote or fully remote, and everybody’s trying to figure out how to spend time together. So, it’s on everybody’s mind. I think a lot of people are adopting these kinds of, you know, best practices that fully distributed companies have come up with. I think it’s working. I feel like there’s a whole set of tools in the industry growing up around it. Right? There’s a lot of people going, “OK, we can host some of these meetups and retreats and be a great place for people to get together. We can be a platform where people can organize their meetups.” And I think one of the companies we invested in called Happy does that. And there’s a huge demand for it, especially from big companies who are saying, “OK, all of our teams want to meet in person and we’re not set up for it, help us figure out how to do these things.” And I think we’ll just see more and more of it. I have friends who are essentially building retreat centers around this notion and saying, we don’t need more hotels. We need more places where these teams can gather and spend several days and be creative together. It’s really nice to be in a place where you feel like, “Oh, it’s just us. We get to do our thing.” I think all of our initial meetups were like, there was like a ranch in Arizona where it was just us and there was like a bed and breakfast in Mexico where it was just us. And we could bring our Wii and play Wii tennis and be goofy and stay up till two in the morning and nobody cared. And I think that’s important too, to pick venues that allow for that to happen versus again, the more scripted, “Here’s, you know, a place with good wifi and good presentation system.” And let’s all sit in a conference room. We’ve always avoided that. I see a lot of teams gravitating towards the more retreat type setting. And I think hopefully there’ll be a lot more of it. I think there’s still, there’s a huge untapped market for it because it’s still hard to find something that’s like a retreat, but also has really good internet and you actually can be connected. We would find these places like, “Oh my God, this looks amazing.” “Oh no, we don’t have internet people come here to disconnect.” “Oh no, that’s not us.” We’re gonna be the opposite. We’re gonna get there and you know, 20 or 30 laptops are gonna open and your internet’s gonna come to a halt. CHENDA NGAK: What do you think our legacy has been for remote companies today? TONI SCHNEIDER: Yeah, it’s hard to tell, but I always assumed that it’s amazing as WordPress is. I think our long term impact might be just as much that we showed that a remote model can work. I definitely remember the early days and it was very, very different when we tell people that we were distributed. A lot of people didn’t like the idea. They wanted to argue why it was a bad idea or they just didn’t think it was ever gonna scale. There was a lot of like, “Oh, that’s great, but you’re just 20 people just wait till you’re 50 people just wait till you’re a hundred people. It’s definitely gonna break at 200 people.” So there was just a lot of disbelief that this actually works. I think we kind of chipped away and it’s not like we started the company to prove that distributed can work. It just worked for us and we thought, well, let’s keep going and let’s make it work even better. And let’s really lean into it. And just leading by example, I guess, other companies now look and go, “Oh yeah, that’s an option. It’s not the only option. There’s lots of ways to build an organization, but this is a real option. This can work.” We’re 2,000 people now and it’s working and it’s a great organization. So, I really think it has helped tremendously to just make it available to other entrepreneurs and, and be able to say, “Oh look, they did it, WordPress did it.” It’s funny to think back, but there was a lot of skepticism. We even had employees who would say, “Can you send a message to my parents and tell them that this is real, this isn’t like some weird scam?” Even the employees were like, “I love it, but like my friends and family think I’m crazy.” So, we’ve come a long way. I’m proud that we’ve been able to help this model gain more mainstream acceptance. And obviously with COVID, it kind of kicked into hyper drive and 10 years of adoption happened in like 10 days. I think all that work of slowly perfecting the model and showing that it works, sort of, at the right time was all available for people to go, “Oh OK, let’s try that.” And then I think the other thing t"
