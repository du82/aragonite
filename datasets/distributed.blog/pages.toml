title = "Upwork’s Stephane Kasriel on Fixing the American Dream – Distributed.blog"
description = "How changing the way we think about work can give workers freedom and flexibility. For more, go to Distributed.blog. Produced by Mark Armstrong and the team at Charts & Leisure: Jason Oberholtz…"
full_description = "Upwork’s Stephane Kasriel on Fixing the American Dream May 16, 2019August 3, 2021 Published by Matt In 2002 I started contributing to Open Source software, and life has just gotten better from there. Co-founder of WordPress, founder Automattic. View all posts by Matt Read more about Stephane Kasriel in “The American Dream Is Broken, and I Think We Have a Shot at Fixing It.” Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. “The American Dream is Broken, and I think we have a shot at fixing it.” Stephane Kasriel, the CEO of Upwork, thinks that most work, as we think of it today, is in need of an overhaul. In this episode, Stephane explains how changing the way we think about work can simultaneously give workers freedom and flexibility, enable companies to operate more efficiently, and revitalize local economies all over the world. He also shares tips on how companies can make smart moves toward a distributed work model. The full episode transcript is below. *** Matt: To start off, say your name and how long you’ve been here, just so people have a sense of you. And then we’ll talk. Stephane: Sure. So my name is Stephane Kasriel, I’m the CEO of Upwork. I joined the company close to seven years ago. Initially I was running product management and design and then when our head of engineering left, I became the head of product management, design and engineering. And then a couple years later, when the CEO left, I got promoted and became the CEO of the company. And that was about four years ago. Matt: Awesome. How big is Upwork? How should people think of it? Stephane: You know, that’s a great question, how big it is it depends if you define it by employees or everybody in the workforce. There’s about fifteen hundred people who work at the company, about four hundred of them are full time employees of Upwork Inc., the company, and they mostly work in one of our three offices in the U.S. We have an office in Chicago, we have an office in the South Bay — in Mountain View, and then we have an office in San Francisco. But then we have another eleven hundred or so people that are what we would call freelancers and they work from home — they work from about five hundred different cities in the world, which is pretty impressive. Matt: That’s a lot of cities. Stephane: I’m not sure I can name five hundred cities in the world, so that’s a pretty big part of the world. And part of the reason why we call them freelancers is because that doesn’t have a legal meaning. And so some of them are full time employees of Upwork but they just happen to work remotely. Some of them are independent contractors or whatever is the equivalent in that particular country. And then some of them are essentially what the U.S. would call leased employees, meaning they get a W2 but they get a W2 from something called Upwork Payroll, which is our product. So as you can imagine, we use our own product to manage our entire remote workforce. And so depending on the employment law and all of the other considerations that are embedded in the product, they end up being classified differently. And because this whole discussion was pretty long, we call them freelancers. Matt: [laughs] And Upwork is now a public company. Stephane: Mhm, yeah. Matt: Tell me about that. Stephane: Yeah we took the company public in October of last year, which is something that we had wanted to do for a long time. The reason being, you know, a lot of companies go public because they need to raise a lot more money. In our case, we’ve been cash flow positive or break even for many, many years, so we did not need to raise the money. What we really needed was to raise the awareness. And I think the labor market is obviously one of the biggest markets in the world, like a hundred trillion dollars or so, of which remote work can be a very substantial part of it, and I think Upwork can play a role in trying to create a better future of work. Like I think the current present of the labor market is pretty messy — and we can talk about that if you want — but it’s pretty broken for a lot of people in the world. And we think we can be a driving force in creating a better future but we need a big, big loudspeaker in order to be able to influence people. And being a public company just allows us to have a lot more visibility, a lot more credibility, than what we used to have. And that’s been the main driver for doing this. Matt: And that also means all your numbers are public. So what’s the rough size of the business now? Stephane: Yeah so this year we’re going to do on the order of about one point seven billion dollars. Matt: Wow. Stephane: And it’s growing pretty nicely so it’s going to be much more than that next year. Matt: That’s super cool. Stephane: Mhm. And I should mention that’s the amount of business that is done on the site, what we call gross services volume, or GSV — we looked at the financials of the business, gap revenue is… about fourteen point something percent of that one point seven billion. So the gap revenue in 2018 is on the order of two hundred and fifty million dollars. Matt: That’s incredible. Stephane: But what I really care about, to be honest — Matt: Is the gross. Stephane: Is the gross. Because that’s how much money we give in the freelancer’s pockets. Fundamentally our mission at this company is to create economic opportunity so people have better lives. And the way we measure that is the amount of money that goes into people’s pockets. So revenue is how much we get to keep, we are a for-profit company, we need to make money too, we need to hire all these people and continue to build the business and all that stuff. But the real reason why this company exists is for the GSV, right? It’s the money that goes and allows people to be more free, be more flexible, live anywhere in the world that they choose to live in and be able to have access to jobs that they would not be able to get otherwise. Matt: Would you call that number your north star metric? Stephane: Yeah. I mean the one number — like, when I look at our all-hands and what we talk about all the time, we don’t talk about revenue, we don’t talk about EBITDA. I mean obviously we have a finance team and we have an accounting team and they really care deeply about this stuff but I would say the reason why people join this company either as full time employees or as freelancers and either in an office or remote, is because they get to create jobs for lots of people. And the proxy for that is how much money goes into the freelancer’s pockets. Matt: You mentioned earlier that work was a little broken. Stephane: Mhm. Very broken. Matt: Tell me more about that. Stephane: Well I think we’re in a place right now where if you live in San Francisco, for instance, where, ya know, we are based here, you have — If you are highly skilled you have access to amazing economic opportunities, great jobs, working for some of the most amazing companies in the world. But the cost of living has been rising faster than your salary. The average rent in San Francisco has been growing by about seven percent per year for the last forty-five years, so you compound that, it’s become outrageously expensive. What we see is that young people, young college graduates, when they move to the Bay Area, spend close to seventy percent of their disposable income on rent. And that’s despite the fact that they have a pretty lousy apartment and they typically have roommates. And that is more than twice as much as the overall U.S. market right now, right? So you’ve got a place where [there are] great jobs, great environment, very international, very dynamic, all that stuff, but completely unaffordable to live in. And then meanwhile you just go a couple hundred miles away from here, you go to Stockton, you go to Modesto, you go to Fresno, you go to Sacramento, let alone going in the Midwest of the country, and you have places where it’s extremely affordable to live in and frankly it’s actually very nice to live in. There’s plenty of beautiful places outside of the Bay Area where you really want to live but there’s no jobs. So fundamentally we are in this economy where if you’re a young person in particular and you don’t already have real estate that belongs to you and you might even have a ton of college debt to get started, you have this catch 22, where if you live in the middle of the country you don’t have a job and if you live in the big cities in the U.S. you have a job but you have no money, and either way it seems like a pretty bad outcome. And it doesn’t need to be that way. It’s the last evolution where we missed — we missed a turn. The first industrial revolution you had to move people from the farms where they used to be working to the assembly line because physically we were manufacturing our goods and you had to be on site and the whole nine-to-five was because the machine was gonna run from nine-to-five and so you had to work when the machine was gonna run because frankly at the time machines were expensive and humans were pretty cheap and so it made sense that way, right? But you fast forward to the fifties where manufacturing started to slow down in the U.S. and a big part of the western world and the service industry knowledge work became a big thing. And increasingly a bigger part of it was done in office towers and cube farms. And if you think about it, that was — I would say — a bad metaphor. The cube farm is the modern version of the assembly line except that none of the work that you do in the cube farm actually has to be done on the cube farm. And increasingly work can be done from anywhere, and increasingly it doesn’t need to be done from nine-to-five, increasingly it doesn’t need to be this long term, one-on-one relationship between an employer and an employee. But somehow we missed the transition and we are continuing to operate as if work had to be done the same way. And you could say so what’s the big deal? Let’s keep doing it. But the reason why it’s a big deal is like — not to get into politics or something — but there is increasingly, in the Western world, a group of, a part of the population that is saying this system is not working for us. And you have the myth of the American dream, the idea that if you’re highly skilled and working hard, you should be able to be successful increasingly depends on where you were born or where you live or how much wealth your parents have and whether you’ve been able to go to college or not as a result. And that is not what — I’m an immigrant in this country, I signed up for the American dream. And I think it’s pretty broken right now and I think we’ve got a shot at fixing it. Matt: When I moved from Houston to San Francisco my rent went from eight fifty per month, which I paid half, to twenty-seven hundred dollars a month. And this was 2005. Stephane: Yeah. It’s gotten worse since then. Matt: So compound that by seven percent per year since then. Stephane: It’s bad. Matt: For a similarly sized place, ya know? A little bit of an upgrade. Yeah. How about you? Do you remember your old rent when you lived in France? Stephane: Well I moved here in ’97 and I remember when I moved here people were saying don’t buy a house, it’s crazy, some of these houses are worth a million dollars. There is no way this is going to last. And of course the same houses now are probably three or four times that. You know, eighty percent of houses in San Francisco cost more than a million dollars. Matt: Eighty percent? Stephane: Eighty percent. There’s not a ton of people in the world, even if you work for a tech company — like the amount of money you need to save in order to have a down payment to be able to afford a million dollar house and then you pay, you know, one point something percent of property tax. I mean it’s really hard to afford a good life in the Bay Area right now, even if you are a data scientist working at Facebook. If you are not in tech and you’re just an average worker trying to get by, it’s a real struggle. Matt: It’s kind of amazing as well. We think of the Bay Area as this engine of innovation but the percent of the economic activity that just goes to landlords is astounding. Stephane: Yes. Historically there have been more billionaires coming from real estate than from tech in the Bay Area. [laughter] Little known fact. Matt: You have so many cool stats about the Bay Area. [laughter] Stephane: Twenty years of doing this. But you know the thing is, it doesn’t need to be that way. And I think this whole distributed company, remote workforce, whatever you want to call it movement is finally the awakening by the tech industry [to the reality] that we are part of the problem. Part of the reason why jobs have been destroyed in plenty of places in the country while all of the new jobs were created in a small number of areas is because of tech. And overall it’s a good thing. Right? Increasing productivity makes people richer. We need innovation, we need automation. By the way, we don’t make as many kids as we used to so we need more robots to actually help us grow the economy — like, all these things are true. But the problem is the jobs that are being displaced are not in the same location and don’t need the same skills as the jobs being created and the displacement of the jobs comes from us, the tech industry, right? And so I think increasingly there is both a practicality of — as a small start up you just can’t hire good developers in San Francisco because if they are really good, they are paid so much more money by the big tech companies that you can’t possibly attract them. So there’s a very down-to-earth, like, you-don’t-have-a-choice type of approach to this. But I think increasingly there’s also a bigger social calling for realizing that hey, there’s some really great developers and great marketers and great everything else over there, and we can really help these people get a better life by giving them a job instead of trying to poach people from Google who will then poach them back. This very zero sum game, red ocean type of approach of the war for talent, the way it’s conducted in the Bay Area. Matt: If we allow the economic opportunity to be world wide, won’t that just mean more accumulation of capital by the companies themselves? So Google has to pay their employees very high salaries because they’re in this competitive market. Stephane: Mhm. Matt: If the global average was much lower than that, let’s say a third of what it was in the Bay Area, the extra profit would just go to Google shareholders or the company itself. Stephane: Well I think it’s — the economy is not a zero sum game, right? In an ideal world workers are better off and companies are better off. I mean that makes it much more attractive than if it’s a win-lose where yeah Google is worse off but Google’s employees are better off. I mean that’s going to be how to convinc"
