full_description = "Episode 14: InVision CEO Clark Valberg on Distributed Design Nov 14, 2019August 3, 2021 Published by Matt In 2002 I started contributing to Open Source software, and life has just gotten better from there. Co-founder of WordPress, founder Automattic. View all posts by Matt Read more about Clark Valberg in “Building the Tools that Bring the Screen to Life.” Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. InVision CEO Clark Valberg needed a tool to help his distributed team collaborate on design projects. So he created it — and it became the company’s flagship product, one that every Fortune 100 company now uses. In this episode, Clark joins our host Matt Mullenweg to discuss how he built his distributed company, and how that structure informs InVision’s collaborative-design products. The full episode transcript is below. *** MATT MULLENWEG: Howdy howdy. Welcome to the Distributed podcast. I’m your host, Matt Mullenweg. My guest this week is Clark Valberg, the founder and CEO of InVision, a company that makes a collaborative design platform that’s very popular with distributed teams. It does ideation, design, prototyping, sharing… and it all lives in the cloud. No more emailing files back and forth — it’s pretty slick. Clark founded the company seven years ago in Brooklyn, and now they have over 5 million users at places like Airbnb, Amazon, Netflix, Starbucks, and my company, Automattic. Like Automattic, InVision is fully distributed. And they’re similar to us in size, so I’m interested to hear from Clark about his experience leading and growing a distributed workforce. Alrighty. Let’s get started. MATT MULLENWEG: Welcome, Clark. CLARK VALBERG: Hey, great to be here. MATT: Y’all are one of the other big fully distributed companies. Tell me a little bit first about what InVision does for people in a cave who might not know yet. And tell me a little bit about the scale of what y’all are doing in the — CLARK: That was my opening to you, by the way. Oh y’all are one of the other largest remote companies. This is a constant debate, by the way, internally, which one is bigger. CLARK: Okay so Clark is the CEO and Founder of a company called InVision. InVision is a design collaboration platform. Most of the products — I hope most of the products — that you use everyday, if they’re well designed, if you love them, if you feel excited about how they work and how they fit into your life, it’s because the design of the product is good. And so that’s where InVision comes in. We are the place where those products are designed, tested. We’re the stakeholders that make that product great, are engaged, we are both the design tool and the place. MATT: So if you were to describe what it’s like to use an InVision product. Let’s say I’m a designer, I’m collaborating with another designer, what will we do? CLARK: If you are a digital product designer, you need a place to design, you need the place to actually create the screens that make your product beautiful. That’s InVision. MATT: So before, I would do this in Photoshop on my computer and now it’s happening in a web app? CLARK: Photoshop or a cave wall, depending on how old school you are. So yes, you would’ve done that there and now you do that [in] InVision and then InVision is also the place where that design comes to life in a collaborative sense. It’s the place where you put your design so that others can look at it, engage with it, give you feedback on it. The question you’re asking is fundamental to this transition of design altogether, which I can talk about for a long time, but design is no longer a job to be done, it’s now an organizational discipline in a world where the screen has become the most important place, or one of the most important places in the world. MATT: When and how did design become important to you? CLARK: I ran an agency and dealt with what was the general operating dynamic of agencies at that time, and probably still today in many respects. You have a client, they have an idea of what they want, they have some business problem they’re trying to solve and you’re trying to put together some kind of a requirements document, some kind of a contract that hopes to look into the future and imagine everything they’ll ever need to accomplish whatever business goal they’re trying to accomplish, and define that today, or at least in the next few hours until we can get this thing signed and move forward. So this idea of up-front definition bothered me, that was a deep intellectual itch. How can I, instead of creating a contract that separates me from the client and hopefully mitigates the legal risk of giving them exactly what I told them that I would give them, and we’re charging by the hour, how could I align my values and go on this journey with them together side by side? How could I act as their guide toward the business reality that we would ultimately end up discovering together? Any time there’s a client, there’s that dynamic of — you know what you want in your head; it’s impossible for me to get that out of your head and get it into my head. And by the way, even if I could, hopefully if we do something right that will change over time, the more articulate that vision of the future becomes. MATT: How did this agency look? Clients, were you meeting them in person, were your colleagues in person? CLARK: Both. It was my first dip of toes into the world of being able to work with people seamlessly online. So a lot of the fundamental inventions, collaborative inventions that we have here at InVision — 900 people, totally remote — came from that world of just trying to make clients happy at a much smaller scale, sometimes remote. MATT: How big did the agency get before you switched to doing the product work as your primary thing? CLARK: The biggest ever? I think it got to 25 tops. So it was a small agency. The word “boutique” sounds much better than small, doesn’t it? MATT: There’s probably a lot of people [who are] part of or running agencies, listening to this [who have] that dream of switching to be a product company. What advice do you have for them? What made it work for you? Because there’s so many examples of that not working. CLARK: I’ll tell you, I did not have a vision of becoming a product company. It happened as an extension to the reason why we started this agency in the first place. So the agency was founded on, “Hey, instead of ending up in these weird litigious, semi-adversarial relationships with clients, what if we could figure out a different operating model, a different communication model?” So we started by building prototypes, and we would write those prototypes in code, we would show them to clients early, we’d be able to have a diverse conversation across the organization, instead of just dealing with one project manager, we’d be able to embrace all the different business leaders that represented the parts of the business that we were trying to serve with the software. We’d have holistic, multi-dimensional, diverse conversations. That was the whole idea. I wanted to be an agency that loves its clients. I want to be on the same side of the table. These were all the different key words, [laughs] the key phrases that we used to make ourselves sound different and differentiate. But I think it sprung from a place of what we saw wrong with the industry. And then that tool called a prototype just evolved over time. And at some point someone — not me — said “Hey, what if we just took designs out of Photoshop and connected them together and turned them into a little simulation that was almost as high-fidelity as the coded prototypes that you were building? It would be almost good enough and probably you could — we’ll just run it as an experiment but it’ll take an eighth of the time to build and maybe we can use that as a communication device.” MATT: Who was the first client you tried that on? CLARK: It was a company in upstate New York. So this is one of our few fully, fully remote engagements, like we went to see them maybe once a quarter but other than that everything was happening online. I’ll reserve the name but a large education-product company. They created educational products that they sold into school districts. And we were building essentially a totally custom ERP solution for them — every part of their entire business modeled into a piece of software, every experience that exists between two people in that entire company was modeled into a screen some place. MATT: Wow. CLARK: So a very sophisticated piece of software. And it would have been an absolute nightmare had we not employed this process because there were just too many stakeholders with too great a diversity of perspective on what needed to be built, and it just had to be a conversation that happened over time. This was a “Let’s try this new thing. What do we call this new thing?” I think literally the time that we’ve been on this call so far was the time it took us to come up with the name InVision. [laughter] I think it was the second idea, like, “Oh, we’ll just change it later, that’s fine.” And we had absolutely no interest, almost an explicit disinterest, in having anyone outside of the company know what this thing was. This was just for internal use only. Somebody even said “Hey, what if we wrote a blog post about this? What if we..?” And once it worked, once we saw that it would totally change the game for us, and it really did in very profound ways, this is like a whole new movement for agencies, this would be a cool thing to talk about. I said, “Absolutely not. This is our differentiator, this is our competitive advantage in this agency, maybe let’s just keep this under hat.” MATT: Ha! CLARK: Luckily someone — it’s good to have a lot of people who disagree with you all the time around you, otherwise you end up being a victim of your own vision. MATT: So at this time, it sounds like you have an office and colleagues in that office. At what point did you switch to being fully remote and using these tools to enable that? CLARK: Even the agency was hybrid. And in New York City, my entire movement into a fully remote world — again, never had a vision for it, didn’t think this was the future. I’m still not sure if it’s the future for everyone, okay, this is a matter of significant debate and worthy of debate. It was a necessity thing. So the agency was a hybrid but let’s call it a reluctant hybrid, like “Hey, we can’t find enough people in New York so we’ll hire people who aren’t here and we’ll just deal with the overhead and managing that overhead, that collaborative overhead as a cost of doing business.” When we transitioned into InVision, so yada, yada, yada — we’re yada yada yada-ing through the birth of an entire company — but this product is cool, what if other people liked it? Let’s put it in front of the world and see if they bite. They did. We raised some capital and then we had to transition out of the agency and into the product company. I sold the agency to a — basically a hostile takeover. I sold it to my wife for a dollar. Literally, it’s a whole big story where the company, InVision, sort of launched its for-pay model on my wedding day. So here we are with $1.1 million and an office that my co-founder and I are sitting back-to-back in a tiny Regus space in midtown Manhattan. I think it was the year that Google opened up the Google megaplex — I don’t know if it has an official name, but the building in Chelsea? MATT: Yes. CLARK: We just found that every conversation we were having with an engineer, designer, anybody, everyone — they were also talking to Google, they were also talking to Yahoo and Facebook. Anybody with a New York office with a more fashionable name and better ping-pong tables to our no-ping-pong tables was just destroying us for talent, and I found that we were spending all of our time wining and dining engineers we weren’t hiring. MATT: Wow. CLARK: And so we got together after about three weeks of slogging through this talent thicket, and asked ourselves an existential question. We did what we called a pre-postmortem — I’m sure you’ve heard this idea. Let’s look into the future, let’s imagine the things that don’t work out and let’s guess, based on what we know today, what are the likely sources of that failure? And the biggest one for me was not spending enough time on the things that really make a business successful. At the end of the day, product-market fit is where it’s at, at this critical birthing stage. We have to get a group of people vehemently, maybe violently excited about this new product and talking about it to people. It has to have independent lift, it has to have word of mouth, groundswell. And what will we probably be doing instead of focusing on the design of the product, the marketing of the product? We’ll probably be trying to hire engineers and moving way too slow. And we just opened up the envelope. And again, it may not have been me, somebody thought, “What if we just hired the people that we had worked with as contractors in the agency?” We had a pretty significant bench of folks that we pulled in who were full-time other places and just did little side jobs for us in exotic, far-flung destinations like Phoenix, Arizona… Houston, Texas. Places that were secondary, tertiary tech markets, folks that we just knew, knew from conferences, because they were developers in the same language that we were developers in — what if we just hired them full time? So we said, what if we just did this at scale? What if we somehow figured out how to make collaboration work where everyone was remote? And I had a piece of advice. I don’t know if he even knows that he gave me this advice and how pivotal it was for me. Do you know David Cancel from Drift? I called him up. He had just sold a company to HubSpot. I ran the idea by him, like, “Hey, what do you think about this remote idea? What do you think about this talent hack — instead of hiring people in New York, we’ll hire them anywhere. We’ll actually pay them above market.” That was our thesis originally, to pay them above their local market but arguably below the New York market. And there is a very, very wide spread there, at least there was then even more so than it is today. And then sell them on this lifestyle change. Sell them on getting rid of their commute, sell them on work/life integration. This is the time where everybody talked about — the common theme was work/life separation — how do I turn off my phone, how do I turn off my email at a certain time a day? We said, well, the people that we work with, they were moonlighting for us while working full time, they clearly have more passion, more interest in being involved in the work they do than 9-5, so maybe it’s not about a certain time of the day where you just die from work. Maybe it’s about having more control over when and how. Maybe there’s a work/life integratio"
