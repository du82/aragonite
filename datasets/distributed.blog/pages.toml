["https://distributed.blog/2021/07/22/erica-pandey-axios-returning-to-work"]
title = "Episode 28: Erica Pandey of Axios on Returning to Work – Distributed.blog"
description = "Whether making their start as a solo blogger on their own beat, or growing up in a thriving newsroom, journalists must forge their own unique work life as they write the first draft of history, as …"
full_description = "Episode 28: Erica Pandey of Axios on Returning to Work Jul 22, 2021August 10, 2021 Published by Distributed Editors View all posts by Distributed Editors Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. We admire journalists today more than ever. Whether getting their start as a solo blogger on their own beat, or growing up in a thriving newsroom, journalists must forge their own unique work life as they write the first draft of history. So it’s no surprise that this episode of the Distributed podcast with Matt Mullenweg and special guest Erica Pandey, business journalist and writer of the What’s Next newsletter at Axios, moves fast and covers a lot of ground, from Erica’s career, to how she works with her Axios colleagues in different cities and bureaus, to what she is seeing as she covers the intersection of technology, business and people. Erica has recently written about how workers are discovering their own ‘Third Workplace,” and shared insight on how HR departments can improve childcare benefits for working parents. “Childcare has always been a problem. The pandemic just spotlighted it, and hopefully now something will be done about it,” says Pandey. She balances Axios’ Smart Brevity style with authoritative reporting on complex topics, seeking multiples perspectives, from data to experts to people on the ground. Says Erica, “One of my greatest joys is being able to talk to people.” The lively conversation centers on how we’re all returning to work after so much change and adaptation, including the rise of hybrid workplaces. “The best possible form of hybrid – and this is not just me, this is what HR experts are trying to game out here – is everybody meeting, and (then) everybody at home, at the same time,” says Pandey. “The benefits of being in person, which are social interaction, which may be rubbing shoulders with leadership, which may be the innovation that happens on the spot when you are talking with someone at the coffee maker, happen when everyone is there. And then when everyone’s home, they can work on solo projects or get longer term projects done.” “When you make it so that there is no penalty for not being in the office,” Matt later agrees, “you’re not missing opportunities, you’re not missing socialization, you’re not missing anything. That is to me the superpower (of distributed work).” The duo see that this moment may represent – as Erica names it – a ‘code switch’ from prioritizing a job near your family and social life, to adjusting your work to where you live. But it’s an adjustment for everyone, she adds, including journalists: “Journalism is also so much about the energy of the newsroom. There’s the camaraderie of it too. When you’re always distributed…and you don’t get to come back to your desk with all of your colleagues typing away furiously, you do lose a sense of the team sport of it.” And that may be what we can all learn from journalists: at home, out for an interview, writing from a Third Workplace or with the team in the newsroom, figuring out how and where we work our best, deadlines and all. “We’re not work from home evangelists. We’re kind of like ‘Work from wherever you’re going to be most effective’ evangelists,” says Matt. “I can’t wait for people to experience a good version of work from anywhere – not where you’re isolated, and fearing for your life or your family, but where you can actually really get out and enjoy your community.” Thanks to Erica for joining and sharing her insight. And thanks for listening. The full episode transcript is below *** MATT MULLENWEG: All right, howdy everybody and welcome to the Distributed podcast. I’m your host, Matt Mullenweg. Today’s guest is a hard-working reporter covering the intersection of business, technology and people. Erica Pandy is a business writer for Axios and author of the What’s Next newsletter. The last few months of her coverage has included biometric tracking, pandemic-driven migration patterns and a subject near and dear to my heart, which is the fried chicken shortage. We follow her most closely for her extensive coverage of the changing workplace, including diversity hiring, gender inequalities and other trends surrounding the return-to-work discussion. Erica has been writing a lot about hybrid office culture, hybrid schools and even hybrid concerts and weddings. So you can imagine we’re going to be talking about one of our favorite topics – distributed work. Axios is an exciting publisher as well and Erica is right in the middle of some of the most relevant trends in reporting. So I’m excited to learn from someone whose work is all about learning from others in business, tech and beyond. So, Erica, thank you so much for joining today. ERICA PANDY: Thanks, Matt. It is awesome to be here. MATT: So, where are you joining us from today just out of curiosity? ERICA: So I actually am living out the trends that I’m writing. I lived in Brooklyn, New York, I was a classic millennial living in Brooklyn having that perfect hipster lifestyle. And after the pandemic hit, I have since moved to Hoboken, New Jersey. So, New Jersey has been one of the biggest beneficiaries of the pandemic era exodus from New York and I am definitely part of that. I never saw myself as a New Jersey person but there’s more space and if I’m not going to be having to go to the office every single day I don’t mind being in a different state. MATT: How did you choose Hoboken? ERICA: A couple reasons. It’s just cheaper, first of all, than Brooklyn and I wanted to.. Also I’m one of those people who decided to buy during the pandemic. I had rented before this and for the price of something in Hoboken, I’d be living in a studio in Brooklyn. And there’s a little bit more space, there’s a little bit.. it’s a little quieter, a better place to raise a puppy. I also got a pandemic puppy. I’m really hitting all the stereotypes here. So, yeah, a plethora of reasons but yeah, not.. New York kind of shutting down for a year made me realize that I didn’t need to be in the thick of it all the time. MATT: How is it feeling over there? I’ve heard New York is feeling a lot of energy and almost back to normal. ERICA: Yeah, it really is. I mean, everything from the restaurant scene to the entertainment scene is back. And some of the things that the city is holding onto I think are great too. You know, all of those outdoor dining set ups that people really grew to love are staying up through the summer. And I think there is a real desire for that space that restaurants and people took over from cars in cities. So I’m hoping that the New York of the future will be a little bit more community driven and a little bit less just cars and parking. MATT: It also feels like restaurants that happen to have street front have disproportionately benefited from that from like a restaurant in a basement or a second floor. ERICA: Absolutely. It’s nice to see those kind of speakeasy type spots coming back too now that people aren’t really afraid to be in a cellar somewhere, in close quarters with others. Because that’s also quintessentially part of the New York experience. But that outdoor dining set up is basically like free advertising. You walk by, you see a well decorated outdoor dining set up, it’s covered, you go right ahead. And one interesting thing that I’ve seen in New York, I don’t know if it’s happening as much in other cities, is restaurants, which as you and I know have been battered by the pandemic, are using this new world to make money in new ways. Like, there’s some cafes here in New York that opened for dinner at five or six but during the day they rent out their table space to remote workers so you can work from a place that’s not the home or the office. MATT: Wow, and have you tried this yet? ERICA: Yes. I tried it at a cafe in the East Village called Kindred. They’re like Eastern European food at night and a classic dinner spot but during the day, for $25 you get a table for eight hours, you get to have free Wi-Fi access, you have outlets right there and free coffee all day. And they’ve built in the outlets into the outdoor dining set up so you can sit outside but in a sort of closed, less-chaotic space. It’s this rise of the third workplace. I like the flexibility of working in isolation on my own times sometimes, but you get sick of being in your house, especially if you’re a New Yorker and being in your house means being with three roommates. MATT: Are there any studies or surveys you’ve come across that say how many people want to do this or how often it’s happening? ERICA: Well, there aren’t really studies on this call it the third workplace yet because it’s so new. But the overwhelming majority of people, like around 60 or 70 percent, across different studies, want to do hybrid work. And what we’re learning is that hybrid work doesn’t really mean just home or the office, it means all sorts of things. So, maybe you want to go to L.A. for a couple of days and visit friends but you only want to take one of the days off and you work there. Maybe you want to rent some space in a WeWork that’s closer to where you live rather than commute 40 minutes to the office. So, hybrid just encompasses all of these things where you’re just taking your laptop and sitting down and work happens where you are. And then there’s only about 10 or 15 percent of people who want in-person all the time or at-home all the time. So it’s very much those are the two extremes and everybody else kind of wants to be a floater. MATT: What feels tricky about the term ‘hybrid’ is you can kind of bring to it almost anything. Like, arguably, Automattic, which has been distributed for 15 years, was hybrid because we would do meet-ups. So we would try to see colleagues sometimes, it was just once year for the whole company and then a few weeks a year for each team. So I guess that is a form of hybrid. But I’m curious, if you were to describe the best possible form of hybrid and the worst possible form of hybrid, which would each archetype be? ERICA: So, the best possible form of hybrid, and this is not just me, this is what some HR experts are trying to game out here, is every.. like you’re saying with Automattic, everybody meeting and everybody at home at the same time. So, if you’ve really going to do a hybrid work week what that would look like is everybody comes to the office on Mondays or Wednesdays, for example, and everybody is home on the other three days. The worst possible form of hybrid is when people just come and go as they please, which is unfortunately what a lot of companies are leaning towards. And I will explain why each of those is. The best works the best because then the benefits of being in-person, which is that social interaction, which may be rubbing shoulders with leadership, which may be the innovation that happens on the spot when you are talking to someone at the coffee maker, happens when everyone is there. And then, when everyone is home, they can work on solo projects or get longer term projects done. If people are just coming and going as they please you might come to an empty office or you might stay home on the day where everyone else is there. So it doesn’t really work for anybody. If you’re trying to make it a little bit more structured then you please your employees who want the social interaction but you also make your employees happy who want to be home more. If you just let people do whatever, you end up in a situation where maybe someone really wants to come to the office and then they arrive and they realize I’m coming in on days when no one else is here, I don’t like this energy, I’m leaving and going to a different company. But obviously it’s not as simple as that. MATT: Can you just ask your colleagues, like, hey are you going to be there on Wednesday? ERICA: I’ve kind of been doing that with Axios, trying to set up days where everyone comes in. But again, it’s not that simple because there’s some folks who want to work from home all the time and hybrid policies do let them do that. So I have honestly no idea what the future is going to look like. I do sympathize with my colleagues who have kids or who have moved deeper into Brooklyn or further away and they don’t want to commute to an office in Chelsea every day, or ever. So we’ll see what it looks like. But I do think there’s going to be some redistributing of people towards companies that have work philosophies that align more with what they want. MATT: That’s funny because what you said is the best, that few days a week in, a few days out, I would actually say is the worst of all worlds. [laughter] ERICA: Yeah. You have a point too because if you have a days in, a few days out, then if I’m someone who really wants to move far away, I have to kind of have one foot in the door all the time. So that doesn’t have its (perks either?). What you’re saying is great too. I mean, if you want to be an all-remote company but then do very intentional, big budget retreats where you bring everyone together in a way that’s fun and cool, that also works. So yeah, we’ll have to see where different companies land. Yeah, I don’t think anyone really knows. That is such a good example of how convoluted it all is that we have opposite ideas of what’s good, what’s bad. MATT: [laughs] Yeah, for me so much of the power of working from anywhere is that ability to, like you said, travel for a week or two or even for a few days, or just leave that kind of commuting, what’s it called, like the commuting geographic boundary of where that office happens to be. Because then you unlock access to all the talent that either never lived there in the first place or all the talent that is thinking about something different, something further afield in Hoboken for optimizing their life and integrating their life with their work and their family as best as they could. ERICA: Mhm. MATT: So, when you make it so there’s no penalty for not being in the office – you’re not missing opportunities, you’re not missing socialization, you’re not missing anything, that is to me the superpower of it and something companies have to do anyway, by the way, as soon as they get big enough where they’re going to have multiple offices or even multiple floors in the same office. Like, how much of that benefit of in-person work if your team is spread across three different floors and only sees each other every now and then are you really getting? I’m curious, like, the really objective challenge of the sort of hand wave-y benefits of in-person work, especially after we had a year, a year and a half, of companies doing some of the best ever, certainly by stock market performance, at a time when we literally couldn’t see each other. ERICA: Yeah. I think also going a little bit back on what works.. I think my perspective is a little bit warped just by my age too. I’m in that kind of mid to late twenties continge"
