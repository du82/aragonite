full_description = "Returning to the Office “The way that we run our company – which is very asynchronous, people in timezones all over the world – written communication is very important. We maybe over index in our hiring process for people who are really clear writers, which I think sort of begets clear thinking,” said Matt Mullenweg, when asked about managing…More Distributed by Default: Matt Mullenweg on The Knowledge Project Matt Mullenweg joins Shane Parrish on The Knowledge Project podcast to talk about companies that are distributed from the beginning, and some of the benefits that means for its people. “Part of our model of distributed work also provides a fair amount of autonomy in how people get their work done,” Matt said. “I like that it creates a lot more objectivity and focus around what the actual work is.”More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Episode 27: Leading with Values: Sid Sijbrandij joins Matt Mullenweg to talk about GitLab, Transparency and Growing a Distributed Company Matt welcomes Sid Sijbrandij, Co-Founder and CEO of GitLab, another pioneering company with Open Source origins and a long-running commitment to a completely distributed workforce. Sid and Matt settle into a conversation about how GitLab’s six values are reinforced in 20 ways at the fully-remote company. GitLab, now with more than 1,300 employees, updated its values over 300 times in the last calendar year. “They have to be reinforced,” says Sid, “and be alive in that way.” The values, how they are experienced, and most other details and data about GitLab’s processes are publicly shared in a 10,000 page Handbook. “Transparency is sunlight,” says Sid. More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen. Hiring For Distributed Companies & Angel Investing: This Week in Startups with Jason Calacanis “Why would the best employees in the world choose so little autonomy in the third of their day or more that they spend working?” Matt Mullenweg asks Jason Calacanis in a recent appearance on the long-running This Week In Startups. More Subscribe to Distributed at Pocket Casts, Apple Podcasts, Spotify, RSS, or wherever you like to listen."
