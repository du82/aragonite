title = "DKB"
full_description = "Interview with KagiJune 17, 2022Last updated: June 17, 2022#search#interviewThe internet is run by adtech right now, and all the biggest companies are thriving on that, and I think the sooner we get out of that, the better. It is certainly going to be hard, and I'm not against ads per-se, but I'm against ads everywhere, ads by default, ads making our lives crappier and more miserable. Interview with NeevaJune 1, 2022Last updated: June 1, 2022#search#interviewWe thought this was wrong. Search is a daily utility that all of us use. There needs to be alternate mechanisms for how we go about it. And so things like the ads-free and private model that Neeva is built on were consequences of this basic observation. Interview with Brave SearchMay 6, 2022Last updated: May 6, 2022#search#interviewMost search engines are not independent search engines, and while they may provide some value, they are qualitatively different from what Brave Search is doing. Independence is not something directly actionable, but it’s a fundamental property. The Next GoogleApril 5, 2022Last updated: April 5, 2022#searchDuckDuckGo and Bing are not true alternatives – they’re just worse versions of Google. The next Google can’t just be an input box that spits out links. We need new thinking to create something much better than what came before. MarketRank: The Anti-SEO Ranking AlgorithmMarch 11, 2022Last updated: March 11, 2022#search#whitepaperThe websites at the top of Google are not the highest quality websites, but the ones that put the most effort into SEO. We need a ranking algorithm that cannot be easily gamed. This paper describes MarketRank, a ranking algorithm that is immune to SEO and simple to compute. Google Search Is DyingFebruary 15, 2022Last updated: February 18, 2022#searchReddit is currently the most popular search engine. The only people who don’t know that are the team at Reddit, who can’t be bothered to build a decent search interface. So instead we resort to using Google, and appending the word “reddit” to the end of our queries."
