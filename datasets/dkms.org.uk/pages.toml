title = "Jamie’s inspiring donation story"
description = "Local hero’s journey from friend to stem cell donor"
full_description = 'Get InvolvedStoriesJamie’s inspiring donation storyDonor StoryJamie’s inspiring donation storyLocal hero’s journey from friend to stem cell donorShare:22/01/2025“After donating, I feel completely different mentally – it was an incredible experience. I would tell anyone to sign up if they can.” At just 25 years old, Jamie from Fleetwood has undergone a life-changing experience through the act of giving. Jamie explains, “I joined the stem cell register a few years ago after my close friend Charlotte’s mum was diagnosed with acute myeloid leukaemia (AML) and needed a stem cell transplant. Her story inspired my friends and I to register with DKMS.” The donation experience <img data-gatsby-image-ssr="" title="A black and white photo of a young white man and woman smiling" data-main-image="" style="opacity:0" sizes="(min-width: 540px) 540px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/58b02d50-4557-4366-b7fe-ae62d75fd2c0/Jaimie%20and%20Charlotte%20.jpeg?w=540&amp;h=640&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/58b02d50-4557-4366-b7fe-ae62d75fd2c0/Jaimie%20and%20Charlotte%20.jpeg?w=135&amp;h=160&amp;auto=format&amp;lossless=true&amp;fit=crop 135w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/58b02d50-4557-4366-b7fe-ae62d75fd2c0/Jaimie%20and%20Charlotte%20.jpeg?w=270&amp;h=320&amp;auto=format&amp;lossless=true&amp;fit=crop 270w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/58b02d50-4557-4366-b7fe-ae62d75fd2c0/Jaimie%20and%20Charlotte%20.jpeg?w=540&amp;h=640&amp;auto=format&amp;lossless=true&amp;fit=crop 540w" alt="A black and white photo of a young white man and woman smiling"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} “When I was told I was a match, I immediately thought of Charlotte. It felt special to do something in her mum’s memory. “I donated in London and brought my mum along with me. We even had time for some sightseeing and a nice meal, which made the trip even more memorable. DKMS covered all the costs — travel, accommodation, and more — so the process was straightforward and stress-free.” How Jamie’s journey inspired others “Everyone is really proud of me, and I know several friends who have since signed up to the registry after hearing my story. In fact, one of them was called to be a donor almost immediately, which is incredible!” Charlotte, Jamie’s friend, adds: “I am so incredibly proud of Jamie for joining the registry back in 2020 and becoming a match for someone in need of a life-saving stem cell transplant. Knowing that Jamie has given hope to another family in such a profound way is beyond inspiring. “This means so much to me personally because my mum once needed a stem cell transplant, and I know how transformative this gift can be — offering someone a second chance at life. Jamie’s selflessness and courage are truly remarkable. I hope their story encourages others to consider joining the donor registry and making a life-saving impact.” How you can help Register today and join heroes like Jamie who are changing the lives of people affected by blood cancer and blood disorders. You could be the match a patient has been waiting for!Share:Related stories<img data-gatsby-image-ssr="" title="Four DKMS volunteers wearing branded t-shirts in front of a banner " data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop 400w" alt="Four DKMS volunteers wearing branded t-shirts in front of a banner "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}News15/01/2025Celebrating a decade of dedicationThe DKMS West Midlands Volunteering Hub marks its 10th anniversary<img data-gatsby-image-ssr="" title="DKMS office" data-main-image="" style="object-position:32.39% 33.18%;opacity