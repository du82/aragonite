rentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} How Caleb’s journey began Caleb’s journey started a few years ago when he came across DKMS while researching online. As a regular blood donor, he was already aware of the critical need for stem cell donors. He ordered a free swab kit and registered. Everything changed in May 2024 when Caleb received a call. “I was told I might be a match for someone,” he recalls. “After a blood test and health checks, I found out I was the best match for the patient. I’d mentioned it to my mum, and they were both incredibly supportive. My mum especially understood the importance because some of her friends’ families had gone through the struggle of searching for a stem cell match.” The donation process Caleb donated his stem cells over two days via a peripheral blood stem cell donation, a procedure similar to giving blood. “It was pretty straightforward – a bit boring, to be honest! You can’t move around much, so I just sat, watched TV, and chatted with the nurses,” Caleb explains. “I did think about the person receiving my stem cells – their life before their illness, and what they might go on to achieve after recovery. Maybe they’ll even start a family. It’s amazing to think that I’ve played a part in that.” While Caleb doesn’t know who received his donation, he knows it has given someone a future they might not otherwise have had. Strict regulations ensure the anonymity of both donors and recipients. Sparking interest within his community Caleb’s story has already inspired those around him. “Not many people my age even know about stem cell donation,” he says. “When I told some of my mates, they were surprised at how easy it was. A few of them even asked for the DKMS link so they could register too.” Caleb encourages others to consider registering. “The thought that I’ve directly helped someone is incredible. You never know when you might be someone’s perfect match. It’s such a rewarding thing to do.” Will you be the next lifesaver? Register today to offer hope to people living with blood cancer and blood disorders.Share:Related donor stories<img data-gatsby-image-ssr="" title="Young white man with blond hair smiling on the hospital bed" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bc8cfba7-08e3-4207-b1e1-57da1c042535/IMG_0257.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bc8cfba7-08e3-4207-b1e1-57da1c042535/IMG_0257.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bc8cfba7-08e3-4207-b1e1-57da1c042535/IMG_0257.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bc8cfba7-08e3-4207-b1e1-57da1c042535/IMG_0257.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop 400w" alt="Young white man with blond hair smiling on the hospital bed"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Donor Story22/01/2025Jamie’s inspiring donation storyLocal hero’s journey from friend to stem cell donor<img data-gatsby-image-ssr="" title="Elderly white man smili