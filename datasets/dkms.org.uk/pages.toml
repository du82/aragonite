description = "After your stem cell donation, we ask you to take part in a donor follow-up. This helps us to keep a close eye on your well-being."
full_description = 'Donation ExplainedAfter the DonationTopic1 ArticleAfter the donationAfter your stem cell donation, we ask you to take part in a donor follow-up. This helps us to keep a close eye on your well-being. <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/4e6e720d-7191-4b03-9ff1-d4cdce59c805/a-illustration-topic-followup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/4e6e720d-7191-4b03-9ff1-d4cdce59c805/a-illustration-topic-followup.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/4e6e720d-7191-4b03-9ff1-d4cdce59c805/a-illustration-topic-followup.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/4e6e720d-7191-4b03-9ff1-d4cdce59c805/a-illustration-topic-followup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/4e6e720d-7191-4b03-9ff1-d4cdce59c805/a-illustration-topic-followup.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="Graphic showing female member of DKMS staff"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The first donor follow-up takes place four weeks after your stem cell donation. It consists of a blood test to check your blood values have returned to normal after the donation and a questionnaire. You will receive the questionnaire, directly after your donation, from the DKMS team. Please return the completed health questionnaire, together with the results of your blood test, to followup@dkms.org.uk. In addition, you will receive a letter for your family doctor. <img data-gatsby-image-ssr="" title="Person wearing a headset taking notes" data-main-image="" style="object-position:57.620000000000005% 34.57%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/270c69a2-675f-47bf-932b-951cf4941c7e/office%20_DKMS_summer21_rachel_manns_16_small.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/270c69a2-675f-47bf-932b-951cf4941c7e/office%20_DKMS_summer21_rachel_manns_16_small.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/270c69a2-675f-47bf-932b-951cf4941c7e/office%20_DKMS_summer21_rachel_manns_16_small.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/270c69a2-675f-47bf-932b-951cf4941c7e/office%20_DKMS_summer21_rachel_manns_16_small.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt="Person wearing a headset taking notes"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}ArticleLong-term donor follow-up All further donor follow-up will be through DKMS. Blood tests are usually no longer necessary. Protecting your health after your donationWhy and how often are my blood values checked? After a stem cell donation, the body regenerates the stem cells within a few weeks. The follow-up programme includes checking blood values four weeks after donation to make sure that the relevant blood values have returned to normal. Only if a blood value needs to be rechecked will we ask for additional blood tests.Can I donate blood in the run up to and after a blood stem cell donation?If you are identified as a potential blood stem cell match for someone, we ask that you do not donate blood from the time of confirmatory typing. Your confirmatory typing will take place after you are identified as a potential donor. Following your donation, we ask you not to donate blood until six months after a peripheral blood stem cell donation and 12 months after a bone marrow donation. How often do I have to have blood samples taken after donation?Normally, a blood sample only needs to be taken once - four weeks after donation. Only in the case that a blood value needs to be rechecked will we ask for additional blood tests.More steps to donating Topic4 ArticlesYou are a potential match for a patientWhat happens if your tissue characteristics match those of a patient? <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 200px) 200px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d66292df-0257-4495-8021-1a4e8129e448/a-confirmatorytyping-small.png?w=200&amp;h=200&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d66292df-0257-4495-8021-1a4e8129e448/a-confirmatorytyping-small.png?w=50&amp;h=50&amp;auto=format&amp;lossless=true&amp;fit=crop 50w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d66292df-0257-4495-8021-1a4e8129e448/a-confirmatorytyping-small.png?w=100&amp;h=100&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d66292df-0257-4495-8021-1a4e8129e448/a-confirmatorytyping-small.png?w=200&amp;h=200&amp;auto=format&amp;lossless=true&amp;fit=crop 200w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Topic6 ArticlesPreparing to donate Once you have undergone confirmatory typing, we will know you are a “genetic twin” and can prepare to donate to your matched patient. <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 200px) 200px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/efe52fa8-957b-4d82-b4c7-e820820a6940/a-workup-small.png?w=200&amp;h=200&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets