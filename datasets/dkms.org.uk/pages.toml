full_description = 'Get InvolvedStoriesCaleb inspires others to registerDonor StoryCaleb inspires others to register23-year-old emergency medical technician donates stem cells to help a stranger.Share:13/01/2025“I feel like I’ve made a real difference – it’s a privilege to give someone a second chance at life,” says Caleb Toole, 23, an emergency medical technician with the North West Ambulance Service. Caleb, who works alongside paramedics responding to emergency callouts, recently performed an extraordinary act of kindness. After signing up with DKMS, he selflessly donated his stem cells to a stranger in need of a lifesaving stem cell transplant. <img data-gatsby-image-ssr="" title="Man hiking on a mountain by the sea" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/2c064932-e5f6-4669-bfae-0de9b64b96dc/Caleb%20out%20hiking%23.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/2c064932-e5f6-4669-bfae-0de9b64b96dc/Caleb%20out%20hiking%23.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/2c064932-e5f6-4669-bfae-0de9b64b96dc/Caleb%20out%20hiking%23.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/2c064932-e5f6-4669-bfae-0de9b64b96dc/Caleb%20out%20hiking%23.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Man hiking on a mountain by the sea"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.da