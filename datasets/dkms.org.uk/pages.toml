full_description = 'Donation ExplainedStem Cell DonationTopic5 ArticlesYour stem cell donation: preparation and procedureThere are several methods by which you may be asked to donate your blood stem cells or lymphocytes.<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b653c97e-95ff-4a0a-af41-efab8b4d2b68/a-illustration-topic-stemcellcollection.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b653c97e-95ff-4a0a-af41-efab8b4d2b68/a-illustration-topic-stemcellcollection.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b653c97e-95ff-4a0a-af41-efab8b4d2b68/a-illustration-topic-stemcellcollection.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b653c97e-95ff-4a0a-af41-efab8b4d2b68/a-illustration-topic-stemcellcollection.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b653c97e-95ff-4a0a-af41-efab8b4d2b68/a-illustration-topic-stemcellcollection.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="A graphic showing someone donating blood stem cells via PBSC"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}There are two different ways to donate blood stem cells: peripheral stem cell donation, and bone marrow donation. The method by which you are asked to donate ultimately depends on what is best for the patient and what their doctor decides after careful consideration. Wherever possible, your wishes will be taken into account, but ideally, you would be willing to donate by either method. You may also be asked to donate your lymphocytes.<img data-gatsby-image-ssr="" data-main-image="" style="object-position:65.63% 40.949999999999996%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttr