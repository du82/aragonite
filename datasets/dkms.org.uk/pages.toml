full_description = '''Donation ExplainedPatient MeetingTopic4 Articles How is my patient?After donating, you may find you have new questions. These may be about the recipient of the stem cells. How are they doing? Is it possible to get in touch or even get to know each other? <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b050c176-1693-461f-9302-eff7140c10a4/a-illustration-donorpatientcontact-topic-workup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b050c176-1693-461f-9302-eff7140c10a4/a-illustration-donorpatientcontact-topic-workup.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b050c176-1693-461f-9302-eff7140c10a4/a-illustration-donorpatientcontact-topic-workup.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b050c176-1693-461f-9302-eff7140c10a4/a-illustration-donorpatientcontact-topic-workup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b050c176-1693-461f-9302-eff7140c10a4/a-illustration-donorpatientcontact-topic-workup.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="Graphic showing man and woman"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Whether, when and how contact between donor and patient is allowed depends on the rules of the different countries. In many countries there is at least a two-year period of anonymity; however it is possible to contact each other anonymously by letter or e-mail. Unfortunately, some countries prohibit contact. Whether you would like to make contact is and remains your own personal decision. There is no general answer to this question and every donor or patient is free to decide whether or not they wish to do so. DKMS will support you in your individual decision-making process and will gladly provide you with all the information you need. You can contact us at any time with any questions you may have. <img data-gatsby-image-ssr="" title="How is my patient?" data-main-image="" style="object-position:45.57% 49.43%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cc419962-95fd-4b2a-912e-7fcf88c21f34/pexels-wictor-cardoso-4810803.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cc419962-95fd-4b2a-912e-7fcf88c21f34/pexels-wictor-cardoso-4810803.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cc419962-95fd-4b2a-912e-7fcf88c21f34/pexels-wictor-cardoso-4810803.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cc419962-95fd-4b2a-912e-7fcf88c21f34/pexels-wictor-cardoso-4810803.jpg?w=800&a