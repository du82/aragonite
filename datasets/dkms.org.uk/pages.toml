title = "Celebrating a decade of dedication"
description = "The DKMS West Midlands Volunteering Hub marks its 10th anniversary"
full_description = 'Get InvolvedStoriesCelebrating a decade of dedicationNewsCelebrating a decade of dedicationThe DKMS West Midlands Volunteering Hub marks its 10th anniversaryShare:15/01/2025Today we’re honoring our amazing group of committed volunteers in the West Midlands as they celebrate their 10th anniversary as a DKMS volunteering hub. Throughout the last decade, this hub has added more than 6,400 new donors to the stem cell register and has raised over £50,000 to support our mission. From awareness to lifesaving impact “We started the DKMS West Midlands Volunteering Hub in 2015 to raise awareness within the South Asian community about the importance of registering as potential donors,” share Kam, Jasdeep, Robbie, and Harkamal, who are amongst the hub’s founding members. “This was initially to help an individual in desperate need of a donor at the time. At that stage, we didn’t fully comprehend the scale of blood cancer or how many lives it impacts. “This motivated us to organise stem cell donor registration drives and bring more volunteers on board. It is thanks to these additional volunteers that the hub has become what it is today. Without them, we would never have found the matches we have, registered so many potential donors, or raised vital funds for DKMS. Let’s hope the next 10 years bring us the same, if not greater, success.” <img data-gatsby-image-ssr="" title="DKMS volunteers wearing branded t-shirts" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c5ce2f17-a7bf-489f-8cf2-510cd1d5f9c9/9ff88885-4a68-408b-85c0-9e2c654b2c20.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c5ce2f17-a7bf-489f-8cf2-510cd1d5f9c9/9ff88885-4a68-408b-85c0-9e2c654b2c20.jpeg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&