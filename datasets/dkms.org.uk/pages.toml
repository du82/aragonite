["https://dkms.org.uk/donation-explained/search-for-a-match/eligibility-to-register"]
title = "Eligibility to register to donate your blood stem cells"
description = "Overview of the health, age, location and other status conditions which would enable you, or prevent you from, registering to donate with DKMS UK."
full_description = '''Donation ExplainedSearch for a matchEligibility to registerThe perfect matchEligibility to registerFind out whether you can register to become a potential blood stem cell donor.Share:Every 20 minutes someone in the UK is diagnosed with a blood cancer, such as leukaemia, lymphoma or myeloma. DKMS provides patients with a second chance at life, working closely with their families from diagnosis to transplant and beyond. The donor journey begins with a swab of the cheek that takes two minutes and can be the action that leads to a lifesaving transplant. Basic eligibility criteria to join the register aged between 17 (minimum age) – 55 (maximum age) in general good health Body Mass Index (BMI) under 40 not already registered on another bone marrow registry - you only need to be on one: Anthony Nolan British Bone Marrow Registry (BBMR) Welsh Bone Marrow Donor Registry (WBMDR) UK resident at a permanent address for two years minimum haven’t recently requested a swab online from DKMS. Health conditions you can register with You can register if the following criteria apply to you: enlarged thyroid or underactive thyroid thyroid (hypothyroidism/Hashimoto’s Thyroiditis stable and symptom-free. NOT Graves’ disease iron-deficiency anaemia, if treatable with iron supplement hay fever, mild asthma, food allergy basalioma and cervical carcinoma in situ, if fully removed unipolar depression, mild depression, without any limitations in daily life; no previous manic episodes high blood pressure, stable and well-controlled. Ready to become a potential lifesaver? Join the register nowBecome a donor Health conditions you cannot register with You will not be able to register if you have any of the following conditions: severe heart, lung or kidney diseases severe illnesses of the central nervous system severe mental health conditions severe metabolic diseases addictions: alcohol, drugs, tablets severe tropical infectious diseases infectious diseases like HIV, hepatitis B or hepatitis C, syphilis systemic autoimmune diseases or other severe chronic illnesses, e.g. Type 1 diabetes or rheumatism cancer, including being cancer-free, but having had cancer in the past diseases of the haematopoietic system (blood disorders). Unsure whether you can register? Contact us Enquiriesinfo@dkms.org.uk 020 8747 5620Contact usShare:Related Donor Articles<img data-gatsby-image-ssr="" title="DKMS Life Scien Lab centrifuge" data-main-image="" style="object-position:50% 50%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/40880331-b07b-4546-b0a6-d73a489ab424/FXT35857.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/40880331-b07b-4546-b0a6-d73a489ab424/FXT35857.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/40880331-b07b-4546-b0a6-d73a489ab424/FXT35857.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/40880331-b07b-4546-b0a6-d73a489ab424/FXT35857.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt="DKMS Life Scien Lab centrifuge"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("