full_description = 'Get InvolvedStoriesRichard’s life-saving giftDonor StoryRichard’s life-saving giftLeigh-on-Sea stem cell donor gives stranger a second chance at lifeShare:15/12/2024Richard Lloyd, a 47-year-old partnerships manager from Leigh-on-Sea, recently performed an incredible act of kindness that has inspired many. He selflessly donated his stem cells to help a stranger living with blood cancer. His extraordinary journey highlights the profound impact of stem cell donations and the urgent need for more donors. “I feel like I’ve done something that counts and makes a difference. It’s amazing to directly be helping one person and their family. I left the donation centre with a bounce in my walk – the sun was shining, I had my music playing, I was smiling – I wish everyone could experience that feeling,” says Richard. Inspired by friendship Richard’s decision to join the DKMS stem cell donor register was deeply personal. In 2019, his best friend’s son, Jack, was diagnosed with blood cancer. Determined to help, Richard organised fundraising events and a donor registration drive with DKMS. “Jack going through treatment during the pandemic was very scary. But in February 2023, he finally rang his end-of-treatment bell,” Richard shares. Then, in May 2024, another close friend’s wife was diagnosed with incurable blood cancer while pregnant. “Fortunately, they were able to deliver the baby early, and he’s doing really well,” Richard adds. Answering the call In August 2024, Richard received the life-changing news that he was a potential match for a patient. “It was a really emotional moment,” he recalls. Following medical tests and a week of G-CSF injections to prepare his body, Richard underwent the donation procedure. “I’m not good with needles at all, so I got my wife to help me with the G-CSF injections,” he admits. Despite minor discomfort, the process was straightforward. “On the first day, I donated for five hours, and on the second day, about three hours. It was quite comfortable.” <img data-gatsby-image-ssr="" title="Man on a hospital bed holding a bag of stem cells" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/480e7fa9-89f7-43f1-b017-b9babcb8fb16/IMG_0866.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/480e7fa9-89f7-43f1-b017-b9babcb8fb16/IMG_0866.jpg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/480e7fa9-89f7-43f1-b017-b9babcb8fb16/IMG_0866.jpg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/480e7fa9-89f7-43f1-b017-b9babcb8fb16/IMG_0866.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 800w" alt="Man on a hospital bed holding a bag of stem cells"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="Elderly man at the hospital holding a bag of stem cells" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1eb331d3-78cf-4d92-b5b4-990601d3a850/IMG_0882.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1eb331d3-78cf-4d92-b5b4-990601d3a850/IMG_0882.jpg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1eb331d3-78cf-4d92-b5b4-990601d3a850/IMG_0882.jpg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1eb331d3-78cf-4d92-b5b4-990601d3a850/IMG_0882.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 800w" alt="Elderly man at the hospital holding a bag of stem cells"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="Middle aged white couple in football jerseys" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cd9c4f94-5dd6-4bb0-896b-63a3b0dbdce3/IMG_0953.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cd9c4f94-5dd6-4bb0-896b-63a3b0dbdce3/IMG_0953.jpg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cd9c4f94-5dd6-4bb0-896b-63a3b0dbdce3/IMG_0953.jpg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/cd9c4f94-5dd6-4bb0-896b-63a3b0dbdce3/IMG_0953.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 800w" alt="Middle aged white couple in football jerseys"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} The Impact of kindness Due to strict anonymity regulations, Richard knows little about the recipient, except that he is a 50-60-year-old man living in the United States. “I was blown away and shed a tear when I found out I’ll now be reserved for him for two years if he needs more stem cells,” Richard says. “I like to think about what he’d be like – maybe a New York cabbie! I’d love to meet him one day and plan on sending him a Christmas card.” Richard’s selflessness has also inspired others. “I did a talk at work about donating, and afterwards, people said I’d inspired them to register. It makes me emotional because I feel like I’ve got so much out of it myself,” he reflects. How you can help Richard’s story is a powerful reminder of the impact one person can make. By joining the DKMS stem cell donor register, you could offer someone a second chance at life. As Richard puts it, “The reward I got from the experience was enough for me. Donating my stem cells wasn’t about me; it was about that person on the other side.” Share:Related stories<img data-gatsby-image-ssr="" title="Four DKMS volunteers wearing branded t-shirts in front of a banner " data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop 400w" alt="Four DKMS volunteers wearing branded t-shirts in front of a banner "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}News15/01/2025Celebrating a decade of dedicationThe DKMS West Midlands Volunteering Hub mar