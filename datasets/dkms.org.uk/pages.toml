description = "Working closely with our donors, we use the latest possible typing information and laboratory processes in our search for the perfect match for every patient."
full_description = 'Donation ExplainedDonation ExplainedMatching suitable stem cell donors to patients is at the heart of the DKMS mission. Follow our step-by-step guide to registering as a stem cell donor, potentially matching with a patient and, ultimately, making your donation.123456 1Step 1Search for a matchStep 1Search for a matchWe work closely with our potential donors to maintain an up-to-date register of tissue type profiles. ArticleEligibility to registerUpdating your donor profile Fine typing for a patient enquiryDonors with common HLA characteristics 2Step 2A potential matchStep 2A potential matchIf you are selected as a potential donor, we will confirm you are still willing to donate your stem cells.ArticleYour briefing call Health questionnaire Confirmatory typing: analysis of your tissue characteristicsHow long does the path to donation take? 3Step 3Preparing to donateStep 3Preparing to donateEverything you need to know as you get ready to donate your blood stem cells.ArticleWhere can I make my donation?Donor Handbook Covering your costs as a donorPreliminary health check and consent to donationPreparing for the transplantCOVID-19 update for donors 4Step 4Stem cell donationStep 4Stem cell donationThere are two different ways to donate stem cells: peripheral stem cell donation, and bone marrow donation.ArticlePeripheral blood stem cell collectionBone marrow donationA guide to G-CSF self-administration Potential second donationsLymphocyte donation 5Step 5After donatingStep 5After donatingAfter your stem cell donation, we ask you to take part in a donor follow-up to ensure your wellbeing.ArticleLong-term donor follow-up 6Step 6How is my patient?Step 6How is my patient?After your donation, you may have questions about the recipient of your stem cells.ArticleHow is my patient doing? A letter from a lifesaver A unique experience: meeting in personEveryone grieves differently 1Step 1Search for a match 2Step 2A potential match 3Step 3Preparing to donate 4Step 4Stem cell donation 5Step 5After donating 6Step 6How is my patient?Further information info@dkms.org.uk020 8747 5620Contact usPopular Donor Articles<img data-gatsby-image-ssr="" data-main-image="" style="object-position:65.63% 40.949999999999996%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bef22b04-2f7e-4f9e-9f59-0702f33da49a/leighton_-_flipped.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Stem cell donationPeripheral blood stem cell collectionThe most common method of stem cell removal, used in around 90 percent of cases. <img data-gatsby-image-ssr="" data-main-image="" style="object-position:48.58% 30.520000000000003%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c0eabc7f-a86e-48a5-85ad-8e21887ea863/Lorna%2C%20Alfie%20and%20Christin%20at%20Chiswick%20Town%20Hall.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c0eabc7f-a86e-48a5-85ad-8e21887ea863/Lorna%2C%20Alfie%20and%20Christin%20at%20Chiswick%20Town%20Hall.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c0eabc7f-a86e-48a5-85ad-8e21887ea863/Lorna%2C%20Alfie%20and%20Christin%20at%20Chiswick%20Town%20Hall.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c0eabc7f-a86e-48a5-85ad-8e21887ea863/Lorna%2C%20Alfie%20and%20Christin%20at%20Chiswick%20Town%20Hall.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Prepare to donateCovering your costs as a donorDKMS will arrange all examinations and treatments before you make your donation. We will organise your travel to and from the hospital collection centre and any accommodation