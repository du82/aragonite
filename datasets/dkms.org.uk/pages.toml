title = "A community-driven journey to becoming a hero"
description = "Young Hackney resident inspires community by donating stem cells to give a stranger a second chance at life"
full_description = '''Get InvolvedStoriesA community-driven journey to becoming a heroDonor StoryA community-driven journey to becoming a heroYoung Hackney resident inspires community by donating stem cells to give a stranger a second chance at lifeShare:10/12/2024“For me, community is bringing people together and giving back.,” shares Elizabeth. 32-year-old Elizabeth from Hackney recently donated her stem cells to help a complete stranger. She explains: “You can’t say you’re part of a community, no matter how borad, if you don’t actually give back. Matches are based on genetics so if you’re Black, you’re more likely to donate to someone of a similar heritage.” Taking an inspirational first step Elizabeth joined the stem cell register in 2019: “I remember registering at work – there was a table in the canteen where they were registering donors. Although I was apprehensive, I signed up mainly because I knew there was low participation from Black donors.” Five years later, Elizabeth was identified as the best match for a patient in need of a donor, and she went on to donate her stem cells. She recalls: “My dad came with me to the donation – he’s a retired nurse so he understood the medical side of things. He even helped me with my G-CSF injections (the injections that stimulate the growth of your stem cells before donating).” <img data-gatsby-image-ssr="" title="African woman giving a thumbs up in a hospital bed" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/8e367da9-2f6f-4ddf-873f-99bea871144a/IMG-20241105-WA0001.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/8e367da9-2f6f-4ddf-873f-99bea871144a/IMG-20241105-WA0001.jpeg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/8e367da9-2f6f-4ddf-873f-99bea871144a/IMG-20241105-WA0001.jpeg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/8e367da9-2f6f-4ddf-873f-99bea871144a/IMG-20241105-WA0001.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="African woman giving a thumbs up in a hospital bed"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="African woman smiling in a hospital bed" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3a588034-7ff7-4d7f-9de0-162f14b3d92f/PXL_20241105_135355298.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3a588034-7ff7-4d7f-9de0-162f14b3d92f/PXL_20241105_135355298.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3a588034-7ff7-4d7f-9de0-162f14b3d92f/PXL_20241105_135355298.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3a588034-7ff7-4d7f-9de0-162f14b3d92f/PXL_20241105_135355298.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="African woman smiling in a hospital bed"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} Busting myths about stem cell donation “At first, my parents were like ‘why are you putting yourself at risk?’ – of course, they were very understanding and proud but also worried for me. The way I explained it to my mum is that the upside of donating is saving a life – that definitely outweighs any risks. Now I’ve donated, she won’t stop telling people what I’ve done! “My friends were shocked and a bit squeamish hearing that I was donating my stem cells. Everyone immediately thinks of a painful procedure taking your bone marrow – but that’s not the case. Elizabeth's message to others “It doesn’t hurt to be on the register - you’re unlikely to actually be called but, if you do, you could save a life.” Thinking about signing up as a donor but still have questions? Please reach out, we're here to answer all of your questions.Share:Related stories<img data-gatsby-image-ssr="" title="Four DKMS volunteers wearing branded t-shirts in front of a banner " data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500