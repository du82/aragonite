full_description = '''Request a free swab kitRegister now<img data-gatsby-image-ssr="" title="DKMS colleague Mia " data-main-image="" style="object-position:41.58% 94.55%;opacity:0" sizes="(min-width: 1920px) 1920px, 100vw" decoding="async" loading="eager" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/06625662-8563-4071-af4d-6d35d9869cbd/office%20_DKMS_summer21_rachel_manns_165.jpg?w=1920&amp;h=1980&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/06625662-8563-4071-af4d-6d35d9869cbd/office%20_DKMS_summer21_rachel_manns_165.jpg?w=480&amp;h=495&amp;auto=format&amp;lossless=true&amp;fit=cover 480w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/06625662-8563-4071-af4d-6d35d9869cbd/office%20_DKMS_summer21_rachel_manns_165.jpg?w=960&amp;h=990&amp;auto=format&amp;lossless=true&amp;fit=cover 960w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/06625662-8563-4071-af4d-6d35d9869cbd/office%20_DKMS_summer21_rachel_manns_165.jpg?w=1920&amp;h=1980&amp;auto=format&amp;lossless=true&amp;fit=cover 1920w" alt="DKMS colleague Mia "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Get InvolvedBecome a DonorEvery 14 minutes, someone in the UK is diagnosed with blood cancerYou could be someone's lifelineFour out of 10 UK patients looking for an unrelated donor are unable to find a matchRead moreBecome a donor02:00<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 128px) 128px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c1c5e07c-9a3d-4511-96f3-be8745470713/a-illustration-topic-aboutstemcelldonation.png?w=128&amp;h=96&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c1c5e07c-9a3d-4511-96f3-be8745470713/a-illustration-topic-aboutstemcelldonation.png?w=32&amp;h=24&amp;auto=format&amp;lossless=true&amp;fit=crop 32w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c1c5e07c-9a3d-4511-96f3-be8745470713/a-illustration-topic-aboutstemcelldonation.png?w=64&amp;h=48&amp;auto=format&amp;lossless=true&amp;fit=crop 64w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c1c5e07c-9a3d-4511-96f3-be8745470713/a-illustration-topic-aboutstemcelldonation.png?w=128&amp;h=96&amp;auto=format&amp;lossless=true&amp;fit=crop 128w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c1c5e07c-9a3d-4511-96f3-be8745470713/a-illustration-topic-aboutstemcelldonation.png?w=256&amp;h=192&amp;auto=format&amp;lossless=true&amp;fit=crop 256w" alt="Graphic showing peripheral blood stem cell collection process"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Only 30% of patients are able to find a compatible donor in their familyAnyone aged between 17 and 55 years old and in general good health can join the registerFind out moreRegister as a potential blood stem cell donorBecome a donor How you can helpFollow our three-step guide to registering1. Order a swab kit onlineAnswer a few health questions to make sure you are safe to donate. If it's 'yes' then you can request your swab kit online.2. Swab your cheeksFollow the instructions on the swab pack and return your swabs to our Freepost address. We analyse your swabs in our laboratory. 3. Join the registerYou are added to the register as a potential donor for patients worldwide and we'll send out your donor card via email.If you are a match, what happens next?You are a potential matchIf you are a potential match for a patient, our team will be in touch as soon as possible.Health checkWe take a blood sample to confirm that you are the best possible match for the patient.Peripheral blood stem cell donationIn 90% of donations, stem cells are collected directly from the bloodstream in an outpatient clinic without surgery.Bone marrow donationIn 10% of donations, the stem cells are collected from your pelvic bone under general anaesthetic.The transplant takes placeThe collected blood stem cells are transplanted to the patient in a procedure similar to a blood transfusion. A second chance at lifeYour job is done and your incredible donation will help to give someone a second chance at life.Becoming a donor: your questions answeredWhat are blood cancers and blood disorders?Blood cancers and blood disorders are caused by changes in the genes of blood cells. Mostly cancer gene changes happen during your lifetime. In some blood disorders, you are born with faulty genes that you’ve inherited from your parents. Find out more Types of blood cancer Types of blood disorder Am I missing stem cells after my donation?A stem cell donation is comparable to a blood donation, and does not lead to a permanent loss of stem cells. The body reproduces the blood stem cells within about two weeks. Four weeks after donation, your blood levels are checked. This is to make sure that the relevant blood values have returned to normal.How will the security of my data be ensured? The protection and security of your data is of paramount importance to us here at DKMS. We will only record, process and use your personal data in accordance with your consent. We adhere to legal guidelines on the use of any data and only keep what is legally permissible and necessary in order to find a suitable blood stem cell donor. We are registered and adhere to the Data Protection Act 2018 and ensure that all employees are fully up-to -date and trained in this Act. Your personal data will be stored on our secure DKMS database and only your anonymised data will be transmitted to registries to find out if you are a potential match for a patient (data such as HLA tissue characteristics, age, gender and donor number).Go to FAQs<img data-gatsby-image-ssr="" title="Man holding three swabs" data-main-image="" style="object-position:51.019999999999996% 44.89%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/195c523b-05b7-4d37-8ea3-f044724d56f0/JAZ_3SWAB-SHOT.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/195c523b-05b7-4d37-8ea3-f044724d56f0/JAZ_3SWAB-SHOT.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=cover 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/195c523b-05b7-4d37-8ea3-f044724d56f0/JAZ_3SWAB-SHOT.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=cover 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/195c523b-05b7-4d37-8ea3-f044724d56f0/JAZ_3SWAB-SHOT.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=cover 800w" alt="Man holding three swabs"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Help us to register even more lifesaversEveryone who needs a blood stem cell donor should be able to find their match.Put in a Pound!Volunteer with us!Fundraise for us'''
