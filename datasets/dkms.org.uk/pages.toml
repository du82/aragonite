full_description = 'Get InvolvedStoriesPatients are peoplePatient StoryPatients are peopleThis year, World Cancer Day focusses on a people-centred approach to care.Share:04/02/2025“Nobody asked us how we were or how we were coping with the sudden and shocking diagnosis of myeloma." Natalie. My name is Natalie and my husband Rich was diagnosed with myeloma in April 2022, after four years of being checked regularly via blood tests. We had been married for ten years at this point, having known each other for seven years prior to this. We were both parents and grandparents, and had a hectic and happy family and social life. Rich was an action man; walking, cycling, swimming, gardening – he rarely sat still. When Rich woke up one morning and was unable to get out of bed, I called for an ambulance. We received the diagnosis of myeloma in the A&E department of our local hospital. Whilst we had known this was always a possibility, the shock hit us like a freight train. We sat, stunned, neither of us knowing what to say. There didn’t seem any adequate words. <img data-gatsby-image-ssr="" title="Elderly white man on a hike" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/221160c9-55ae-4c29-b748-b0a5620e4185/Richard%20hiking.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/221160c9-55ae-4c29-b748-b0a5620e4185/Richard%20hiking.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/221160c9-55ae-4c29-b748-b0a5620e4185/Richard%20hiking.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/221160c9-55ae-4c29-b748-b0a5620e4185/Richard%20hiking.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Elderly white man on a hike"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="Elderly white man smiling and leaning on a railing" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f9f76c9-b2eb-4833-ae1a-177c232c4b7d/Richard.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f9f76c9-b2eb-4833-ae1a-177c232c4b7d/Richard.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f9f76c9-b2eb-4833-ae1a-177c232c4b7d/Richard.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f9f76c9-b2eb-4833-ae1a-177c232c4b7d/Richard.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Elderly white man smiling and leaning on a railing"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} Stepping into a new role unexpectedly Overnight I became Rich’s carer. His spine had multiple tumours, so it was too painful for him to walk. Previously shared domestic tasks became my sole responsibility. I was cook, cleaner, gardener, grandparent carer, shopper, but most importantly Rich’s carer, with all that this role entails. I went into a ‘firefighting mode’ of activity, ploughing through each day to ensure all the tasks got done. I existed from hour to hour, not wanting to let anybody down, and proving I could cope. Actually, I wasn’t coping very well. My sleep was erratic and anxiety punctuated a part of every day. Our family and friends were amazing; so supportive and always there when needed. But nobody from the medical teams or the hospital asked us how we were managing, whether we were OK, did we need any external support? Rich’s physical needs were superbly supported, but our emotional needs were never questioned. After a particularly difficult period, Rich undertook some counselling, which had minimal impact because the counsellor did not understand the diagnosis and its ramifications. Coping with loss <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/341928d8-092d-4113-9d90-cda7e49c80a2/Natalie%20and%20Richard%203.jpg?w=400&amp;h=421&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/341928d8-092d-4113-9d90-cda7e49c80a2/Natalie%20and%20Richard%203.jpg?w=100&amp;h=105&amp;auto=format&amp;lossless=true&amp;fit=cover 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/341928d8-092d-4113-9d90-cda7e49c80a2/Natalie%20and%20Richard%203.jpg?w=200&amp;h=211&amp;auto=format&amp;lossless=true&amp;fit=cover 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/341928d8-092d-4113-9d90-cda7e49c80a2/Natalie%20and%20Richard%203.jpg?w=400&amp;h=421&amp;auto=format&amp;lossless=true&amp;fit=cover 400w" alt=""/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} We are all aware of how stretched our NHS currently is and I cannot fault the treatment Rich received: it was timely, managed with dignity and was the best that was on offer at the time. What was missing in the initial treatment interview was the question “How are you both doing?” Recognition that this was a life-changing event for both of us would have enabled us to feel understood. Empathy for others’ situations is incredibly powerful and affirming. To be able to say out loud “actually this is really tough” doesn’t change the situation, but it helps us accept the enormity of it. Rich passed away in March 2023. He was 66 years old. I have spent the last two years coming to terms with the loss of the man who shared my life and who made it exciting and never predictable. I am OK, and I am grateful that family and friends still ask me that question. I know they are prepared to hear about it if I’m not. The importance of people-centred care Person or people centred care and treatment focuses on the needs of the individual, ensuring that people’s preferences, needs and values guide clinical decisions, thus providing care that is respectful to them. I would go a step further and suggest that person centred care requires seeing patients as people, that this guides the type of interaction that takes place with patients and their carers. Such an approach can have the effect of being personalised and empowering. Our medical team were good at giving us information – what was going to happen with forthcoming treatments, appointments and side effects of medication etc --but nobody asked us how we were or how we were coping with the sudden and shocking diagnosis of myeloma. On World Cancer Day, wouldn’t it be wonderful if all cancer patients, and their carers, were seen as people first and patients second? Share:Related stories<img data-gatsby-image-ssr="" title="Middle aged woman and young boy" data-main-image="" style="object-position:37.56% 31.52%;opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f3b9d94-b29b-4d37-9fdb-6548df956bf8/ab5a3c3a-7cf6-4a8f-a8ba-97e7af5c74c4.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f3b9d94-b29b-4d37-9fdb-6548df956bf8/ab5a3c3a-7cf6-4a8f-a8ba-97e7af5c74c4.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f3b9d94-b29b-4d37-9fdb-6548df956bf8/ab5a3c3a-7cf6-4a8f-a8ba-97e7af5c74c4.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/3f3b