 cell donor. This festive season, you can make a difference and give families more precious moments together. Demi’s & Rob's story: a journey from heartache to hope <img data-gatsby-image-ssr="" title="A little girl in the hospital" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e3d8e84e-ba10-4e00-8be3-b82308c73abb/image00011.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e3d8e84e-ba10-4e00-8be3-b82308c73abb/image00011.jpeg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e3d8e84e-ba10-4e00-8be3-b82308c73abb/image00011.jpeg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e3d8e84e-ba10-4e00-8be3-b82308c73abb/image00011.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="A little girl in the hospital"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="Little girl with a nose tube" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/82c31e24-d03f-4fca-b3e0-df22a9007653/image00034.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/82c31e24-d03f-4fca-b3e0-df22a9007653/image00034.jpeg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/82c31e24-d03f-4fca-b3e0-df22a9007653/image00034.jpeg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/82c31e24-d03f-4fca-b3e0-df22a9007653/image00034.jpeg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Little girl with a nose tube"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} When Demi was just 16 months old, her family received heart-breaking news: she had the same life-threatening condition that had already taken the life of her twin sister, DaeLynn. "It was the hardest thing I hope I will ever go through; grieving the loss of one daughter, whilst facing the possibility of losing the other." shared DeeDee, Demi's mom. But everything changed when Rob, was identified as a match on the DKMS register. His selfless decision to donate gave Demi the second chance she desperately needed. Today, Demi is a vibrant 8-year-old who loves school, playing with friends, and chasing chickens—living the normal, joyful childhood that once seemed impossible. A life-changing meeting: building a new family After four years of exchanging messages and gifts, DeeDee and Demi finally met Rob in person. It was an emotional reunion that marked the beginning of a lifelong bond. "Rob isn’t just Demi’s donor—he’s become part of our family," says DeeDee. "He saved my daughter’s life, and in doing so, he saved all of us from unimaginable heartache." Rob, a soldier in the UK Army, never imagined the impact his donation would have. "Meeting Demi was the most incredible feeling. She feels like a little sister to me," Rob says. "I’m taking our photo with me on deployment to remind me of the amazing thing I was able to do." <img data-gatsby-image-ssr="" title="Young man and a little girl outside Buckingham palace " data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/aea95d69-f30a-49a9-947e-14ea511c6e97/IMG_1518.jpeg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/aea95d69-f30a-49a9-947e-14ea511c6e97/IMG_1518.jpeg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/aea95d69-f30a-49a9-947e-14ea511c6e97/IMG_1518.jpeg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/aea95d69-f30a-49a9-947e-14ea511c6e97/IMG_1518.jpeg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 800w" alt="Young man and a little girl outside Buckingham palace "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-i