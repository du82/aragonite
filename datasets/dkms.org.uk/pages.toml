title = "Searching for the perfect blood stem cell match"
description = "For many patients, their only chance of survival is to find a matching blood stem cell donor, as fast as possible."
full_description = '''Donation ExplainedSearch for a matchTopic4 ArticlesSearching for the perfect match As the world’s leading blood stem cell donor centre, we are constantly improving our quality standards.<img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/7275fb5f-4eb2-4e59-917c-bccef39a573f/a-illustration-topic-qualityassurance.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/7275fb5f-4eb2-4e59-917c-bccef39a573f/a-illustration-topic-qualityassurance.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/7275fb5f-4eb2-4e59-917c-bccef39a573f/a-illustration-topic-qualityassurance.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/7275fb5f-4eb2-4e59-917c-bccef39a573f/a-illustration-topic-qualityassurance.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/7275fb5f-4eb2-4e59-917c-bccef39a573f/a-illustration-topic-qualityassurance.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="Graphic of DNA and a magnifying glass"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}For many blood cancer patients, their only chance of survival is to find a matching blood stem cell donor, as fast as possible. We are constantly developing innovative ideas to make the search for a donor, and all the other processes around a blood stem cell donation, even faster and more effective. Our donors support us in a range of initiatives, such as: Updating donor profiles Selected donor groups are asked to provide a new sample for typing and to fill in a health questionnaire. Detailed typing for a patient request Gives us an even more detailed comparison between a donor’s typing profile and that of a specific patient. Donors with common HLA markers To ensure we can organise their donation even faster, we ask potential donors with more common markers to: fill out a health questionnaire every two years reconfirm their willingness to donate if they come up as a match. <img data-gatsby-image-ssr="" title="Man donating blood stem cells via peripheral blood stem cell collection" data-main-image="" style="object-position:25.71% 26.32%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d95cc230-f966-4fd3-99e0-5c6683cf57e7/Spender%20Lukas_Schmetz_2.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d95cc230-f966-4fd3-99e0-5c6683cf57e7/Spender%20Lukas_Schmetz_2.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d95cc230-f966-4fd3-99e0-5c6683cf57e7/Spender%20Lukas_Schmetz_2.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4ce