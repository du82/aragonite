full_description = 'Get InvolvedStoriesWelcoming the new Country Manager of DKMS UK!NewsWelcoming the new Country Manager of DKMS UK!We are thrilled to officially announce Peter McCleave as the new Country Manager of DKMS UK!Share:07/01/2025<img data-gatsby-image-ssr="" title="White man in a suit" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0aca4d63-2ee0-4d03-a82d-c0226577969e/Pete%20enhanced%20-%20Copy.jpg?w=400&amp;h=501&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0aca4d63-2ee0-4d03-a82d-c0226577969e/Pete%20enhanced%20-%20Copy.jpg?w=100&amp;h=125&amp;auto=format&amp;lossless=true&amp;fit=cover 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0aca4d63-2ee0-4d03-a82d-c0226577969e/Pete%20enhanced%20-%20Copy.jpg?w=200&amp;h=251&amp;auto=format&amp;lossless=true&amp;fit=cover 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0aca4d63-2ee0-4d03-a82d-c0226577969e/Pete%20enhanced%20-%20Copy.jpg?w=400&amp;h=501&amp;auto=format&amp;lossless=true&amp;fit=cover 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0aca4d63-2ee0-4d03-a82d-c0226577969e/Pete%20enhanced%20-%20Copy.jpg?w=800&amp;h=1002&amp;auto=format&amp;lossless=true&amp;fit=cover 800w" alt="White man in a suit"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} Peter brings a wealth of experience and a deep personal commitment to our mission. As a former volunteer for DKMS, he has a first-hand understanding of our work. Through his impactful campaigns — 10,000 Donors and Gob for Good — Peter has already recruited thousands of stem cell donors and raised vital funds to support people living with blood cancer and blood disorders. Peter’s vision for the future "I’m honoured to step into this role and continue the incredible work of DKMS UK. Every year, four in ten people in the UK are unable to find a matching donor for a stem cell transplant — a statistic that is even more challenging for individuals from non-white European backgrounds. My aim is to improve the chances for everyone facing a diagnosis of blood cancer or a blood disorder, ensuring that more lives can be saved. “Having ran global Operations and Project business functions in my Investment banking career, being able to use my people and team building experience alongside our moral and life affirming work feels like a great fit for me in this next phase of my career,” shares Peter. Driving innovation at DKMS UK Peter is spearheading several innovative projects aimed at enhancing DKMS UK’s impact. Among them is the e-registration initiative, which will simplify and modernise the donor registration process. By leveraging digital data capture, this project will improve quality and ensure a seamless experience for donors. Alongside this, Peter is focused on revitalising the volunteer programme, creating opportunities to attract more dedicated individuals while fostering an engaging and rewarding experience. Drawing on his personal volunteer journey, he is also prioritising the education of new donors, particularly within ethnic minority communities, where addressing myths and misinformation remains critical. Looking to the future Together, we will continue to deliver hope and support to patients and their loved ones when they need it most. We’re excited to welcome Peter to the team and look forward to achieving great things together!Share:Related stories<img data-gatsby-image-ssr="" title="Four DKMS volunteers wearing branded t-shirts in front of a banner " data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop 400w" alt="Four DKMS volunteers wearing branded t-shirts in front of a banner "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.queryS