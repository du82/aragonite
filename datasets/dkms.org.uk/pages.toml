["https://dkms.org.uk/faq"]
title = "Frequently Asked Questions"
description = "Discover more about DKMS and the work we do to recruit donors and fight blood cancer and blood disorders."
full_description = "FAQsFrequently Asked QuestionsDiscover more about DKMS and the work we do to recruit donors and fight blood cancer and blood disorders.Blood stem cells: who can become a donor?Who can register as a potential blood stem cell donor?If you are aged between 17 and 55 years and in general good health, you may be able to register as a blood stem cell donor. For details of our basic requirements and more detailed information on the key conditions that: do not prevent you from becoming a blood stem cell donor will prevent you from becoming a blood stem cell donor Find out more Eligibility to register as a blood stem cell donor.I am registered as a potential donor but I have moved abroad from the UK. Can I still donate?DKMS UK can only retain donors who are full-time residents within the United Kingdom. If you have moved abroad or have plans to leave the UK on a permanent basis, you can email our donor support team via info@dkms.org.uk who will be happy to advise on next steps.Why does DKMS want people from different ethnicities to sign up?Tissue characteristics vary from person to person and between ethnicities. When finding a matching donor, a person’s ethnic background is important. A donor with the same ethnic background as a patient may be a better match than one who comes from an entirely different ethnic background. This means we need as many people as possible with the widest possible variety of genetic characteristics to register on our database. If you register with DKMS as a potential blood stem cell donor, we ask you about your ethnic background. This information allows us to organise our database more efficiently, making it easier and faster for doctors to search for a matching donor for their patient.Why does DKMS register people until the age of 55, whereas other organisations have an earlier age cut? The most important goal – which all organisations holding registers of potential stem donors are seeking to achieve – is to enable more people to make informed choices about signing up, as every 20 minutes, someone in the UK is diagnosed with blood cancer. In registering people aged 17-55 to the stem cell register, DKMS has been able to facilitate stem cell donations by people in their forties and fifties – both in the UK and overseas – which have offered a wide range of people needing transplants a second chance at life, including those from ethnic minority backgrounds. People of such heritages are currently under-represented on registers, meaning blood cancer patients from these communities face longer waits to find a compatible donor match, and may even pass away whilst waiting.Why is the age relevant for stem cell donation? Several studies show that stem cells from younger donors improve patient outcome. However, in registering people aged 17-55 to the stem cell register, DKMS has been able to facilitate stem cell donations by people in their forties and fifties – both in the UK and overseas – which have offered a wide range of people needing transplants a second chance at life, including those from ethnic minority backgrounds. The upper age limit of 55 years for registering potential donors is for their safety: once registered, potential donors can stay on the register until their 61 birthday.How old do I need to be to register as a blood stem cell donor?Anyone between the ages of 17-55 and in general good health can register to become a blood stem cell donor. If you are 17, you can complete the registration process, but will only be added to the registry after your 18th birthday. The upper age limit is in place to protect the safety of the donor and to provide the best possible treatment for patients. Younger people are more likely to be chosen as donors and are less likely to have health issues that could cause complications with donating. With age there is also an increase in risk from anaesthesia. Find out more: Eligibility to register as a blood stem cell donor.Can I register to donate if I'm gay, lesbian or bisexual?Yes, your sexuality does not affect your blood stem cell donor eligibility.Show More ResultsBlood stem cells: register as a donorWhen will I hear from DKMS about my swab pack, registration and donor card? Registration request: You’ll receive an email from us shortly after requesting a swab pack. Be sure to check your junk folder, as sometimes they end up there! Swab pack: You should receive your swab pack in the post within four to six working days of registering. If you haven’t received your pack within 10 days, please email info@dkms.org.uk and we will send you another one. Please include your full address with your request. Once you’ve returned your swabs, we will email you to let you know that your swabs have arrived. Donor card and personal donor number: It takes approximately six to eight weeks to process your swabs and add you to the DKMS register. When you have been added, we will email you with your digital donor card. On your digital donor card, you will find your personal donor number. Please keep your donor number handy so that if you ever need to contact us, you can quote your donor number and we can quickly access your details. Updating your details: Please update your contact details. If your details - name, address, contact details or registered GP - change during this time it's very important to let us know. If you are identified as a potential match for someone in need, our team will be in touch using the contact details you provided at registration. Keeping in touch: You may receive updates from time to time about the work we are doing. How can I update my details?If your details change there is no need to register again, simply update your details here. It’s important to keep your details up to date so we can quickly reach out to you if you are matched with a patient. Please help us by ensuring you use a personal email address and phone number (not work, school or university). If you are a student using a non-personal email address such as a college or university one, it is really important to update your address when you move or finish college or university in order for you to continue being a registered donor. Please get in touch with us on info@dkms.org.uk if you have any questions about the details that we currently have on record for you.How do I know that my data is secure?DKMS treats the collection, processing and storage of the personal data and information of all its registered blood stem cell donors, supporters and stakeholders with the utmost care, consideration, seriousness and responsibility. We are committed to full compliance with all relevant data protection legislation and guidance, including the UK General Data Protection Regulation. We work to clear and robust data and information standards and security protocols to ensure that your data is accurate, safe and secure. We process only the data and information we need, store it securely, ensure it is accessed or handled only by those staff or third parties that need to see and retain and dispose of it in line with agreed data retention schedules, based upon need for the data or national and international regulation. We pseudonymise any data that is used in the search and matching process for blood stem cell donation, including HLA tissue characteristics, age, biological sex, etc. This means that doctors and transplant centres searching the database for a matching donor are only able to see this information. Where we work with third parties for the purposes of fulfilment, regulation or the search and match process for national and international stem cell donations, then we work with only trusted partners and under legally binding and regulatory compliant data sharing agreements. We will never sell your data to third parties. For more information on how we look after your personal data, please see our Data Protection Policy and our Privacy Notice.How can I obtain my HLA tissue type or profile?Contact our Data Management Team, info@dkms.org.uk, who will be able to arrange this for you. Blood stem cells: your health and registrationCan I donate blood in the run up to and after a blood stem cell donation?If you are identified as a potential blood stem cell match for someone, we ask that you do not donate blood from the time of confirmatory typing. Your confirmatory typing will take place after you are identified as a potential donor. Following your donation, we ask you not to donate blood until six months after a peripheral blood stem cell donation and 12 months after a bone marrow donation. I've received a blood transfusion, can I still register?Receiving a blood transfusion may not stop you from registering as a potential blood stem cell donor: if you received a transfusion following a one-off loss of blood during pregnancy/childbirth or after trauma you are fine to register if you received a transfusion because of a different medical condition, please email us with details about the condition. Regardless of the reason for the transfusion, if it took place outside of Europe, Australia or North America, just let us know by emailing info@dkms.org.uk.I take regular medication, can I still donate?This very much depends on your medication. If you’re thinking about registering and you’re unsure about whether you can donate while taking your medication, please contact our Medical Team on info@dkms.org.uk. If you’re already on the registry and you’re identified as a potential match, we will conduct a health screening to determine what medication you are on and whether you can still donate while on this medication. We will never ask you to stop taking your medication to donate.What if I am pregnant or become pregnant? What if I'm breastfeeding?Pregnancy You can register as a potential blood stem cell donor even if you are pregnant, as long as you meet all of the other requirements. Please let us know if you are pregnant and when your due date is. You will be blocked from donor searches during your pregnancy, until six months after your due date. After that, we will include you in searches again unless you instruct us otherwise. Breastfeeding You can register as a potential blood stem cell donor while breastfeeding, however, you will need to be deactivated on the register until you have stopped. It is best to wait until after you have stopped breastfeeding before registering as a potential blood stem cell donor. If you are not breastfeeding, you need to wait until six months after your baby is born before you can register.Can I donate blood stem cells from umbilical cord blood?If you are pregnant or thinking of becoming pregnant and would like to donate cord blood, you can do so through the NHS Cord Blood Bank. DKMS UK is not set up to collect stem cells from cord blood. If I register with DKMS, will I automatically be tested for HIV?No. When you register, we analyse your tissue characteristics so they can be matched with patients in need of a stem cell transplant. We do not check for any infections other than cytomegalovirus (CMV). If you are identified as a match for a patient, we will carry out a health assessment with you that checks for specific viruses and infectious diseases such as HIV, hepatitis B and hepatitis C. This is to ensure that any such viruses or infectious diseases are not passed onto the transplant patient in need of your blood stem cell donation.I have a latex allergy, can I still use the swabs as part of the registration process?The mouth/cheek swabs that we send you when you register do not intentionally use or have any latex component added during the manufacturing process. However, there is a possibility that the sterile packed swabs contain residual latex or a latex component. If you have a latex allergy, we recommend that you consult your GP or medical consultant before taking a mouth swab.Show More ResultsBlood stem cells: how it worksHow are blood stem cells collected?Blood stem cells are collected from donors in one of two ways: Peripheral blood stem cell (PBSC) collection takes from the bloodstream. This procedure is used in 90 percent of donations. No surgery is necessary; you can usually leave the clinic on the same day. Bone marrow donation is used in 10 percent of donations. This takes place under general anaesthesia using a puncture needle in the iliac crest of the pelvis. Your stay in hospital can last up to three days in total. Find out more Your stem cell donation: preparation and procedure. Am I missing stem cells after my donation?A stem cell donation is comparable to a blood donation, and does not lead to a permanent loss of stem cells. The body reproduces the blood stem cells within about two weeks. Four weeks after donation, your blood levels are checked. This is to make sure that the relevant blood values have returned to normal.Does a donor need to have the same blood group as the patient?For blood stem cell transplants, what matters is the best possible match between the tissue characteristics from the donor and patient. Blood groups are not so important. A perfect match is very complicated to find and much like looking for a needle in a haystack. When blood stem cells are transplanted, the recipient acquires the same blood group as the donor. At most, your blood group would be an additional factor in your selection.Can I donate blood stem cells more than once? Will I be asked to donate again?Some people donate blood stem cells more than once, either to the same patient or to a different one. If you have blood stem cells removed, your body will regenerate them in a couple of weeks. So it is possible to donate more than once. To minimise the strain on donors as much as possible, we limit the number of times a donor can donate to twice for either peripheral blood stem cell collections or bone marrow collections.Can I withdraw from making a donation if I have already agreed to make one?It is important that you discuss any concerns you may have about your donation with your DKMS coordinator as early on as possible. When you are identified as a match for a patient, you may withdraw from making a donation at short notice for personal or other reasons. We respect your decision, regardless. However, if you withdraw shortly before the actual transplant, the doctors will have already started the patient’s preparation phase for the blood stem cell transplant, which leaves the patient in a vulnerable state. Who is my patient? Can I meet them?The blood stem cell donation and transplant is intended to be confidential and anonymous, as far as identification is concerned between the donor and the patient. This is set out legislation and standards. However, if the patient’s country of residence allows it, we can request an update on their state of health National guidelines stipulate that donors and patients may only meet in person two years after the donation. In the meantime, donors can contact patients anonymously, sending letters via DKMS if this is permitted by the patient’s co"
