full_description = 'Donation ExplainedA Potential MatchTopic4 ArticlesYou are a potential match for a patientWhat happens if your tissue characteristics match those of a patient? <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d9d4d975-b0eb-41c8-9148-d5639043346b/a-illustration-topic-confirmatorytyping.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d9d4d975-b0eb-41c8-9148-d5639043346b/a-illustration-topic-confirmatorytyping.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d9d4d975-b0eb-41c8-9148-d5639043346b/a-illustration-topic-confirmatorytyping.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d9d4d975-b0eb-41c8-9148-d5639043346b/a-illustration-topic-confirmatorytyping.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d9d4d975-b0eb-41c8-9148-d5639043346b/a-illustration-topic-confirmatorytyping.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="Graphic showing patient receiving medical tests"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}If your tissue characteristics match those of a patient, we will contact you immediately to ask if you are still willing to donate your stem cells. We will use the contact details we have on file to call, email and text you so please try to keep your contact details up to date. If we can’t reach you over the first few days we will also write to you to try to make contact. If you miss our call, you can reach us on 0208 747 5665 or at ct@dkms.org.uk and let us know a convenient time to call you back. If you are still willing to donate your stem cells, we take you through our donor briefing where we ask questions to ensure you are able to donate. Not all donors who match with a patient at this stage will be asked to go on to donate their stem cells. This can be for a number of reasons including: The patient’s team may find another donor who is a slightly better match The patient’s treatment plan may change. We will update you every step of the way, whether you are needed to donate your stem cells or not. How will I donate? The exact procedure for your donation depends on the type of search the patient’s medical team has ordered. There are two possible options you will be asked to agree to: peripheral blood stem cell (PBSC) donation bone marrow donation. <img data-gatsby-image-ssr="" title="A man sat at a desk on the telephone" data-main-image="" style="object-position:37.84% 26.400000000000002%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e88e4111-8d7c-46be-87df-0429bf79ee6e/office%20_DKMS_summer21_rachel_manns_47_small.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e88e4111-8d7c-46be-87df-0429bf79ee