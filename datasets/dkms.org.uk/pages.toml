career with DKMSHelp give blood cancer patients a second chance at life. Interested in working for DKMS? If there are no roles advertised that match your skillset, why not tell us about yourself? Email us your CV stating the type of role you are interested in. We will keep you informed about job opportunities and events that match your interests. To apply for our advertised vacancies, please submit your CV and a cover letter describing how you meet the person specification to jobs@dkms.org.uk. Interviews may be held earlier than the stated closing date for the right candidate. Current openings We currently have no new openings. Volunteer with us!We have a number of volunteer roles availableFind out more Working with DKMS Globally, DKMS has registered more than 12 million potential donors and made possible more than 120,000 blood stem cell transplants to patients in need. When you join DKMS, you will be part of a growing international nonprofit organisation where we reward: creativity initiative compassion collaboration, and strategic thinking as we work together to expand our reach, recruit more donors, and help save more lives. We offer a wide range of benefits to our employees. Find out more Based in Chiswick Our office is a short distance from Chiswick Park, and Turnham Green (Underground, District Line), Gunnersbury (Overground/Underground) and Chiswick and Kew Bridge rail stations. <img data-gatsby-image-ssr="" title="Map of DKMS UK office in Chiswick with local Underground and rail stations" data-main-image="" style="object-fit:contain;opacity:0" sizes="(min-width: 1000px) 1000px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/974d1a9b-ac37-45ad-84f6-4abd3bfb593b/DKMS%20UK%20map.jpg?w=1000&amp;h=566&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/974d1a9b-ac37-45ad-84f6-4abd3bfb593b/DKMS%20UK%20map.jpg?w=250&amp;h=142&amp;auto=format&amp;lossless=true&amp;fit=cover 250w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/974d1a9b-ac37-45ad-84f6-4abd3bfb593b/DKMS%20UK%20map.jpg?w=500&amp;h=283&amp;auto=format&amp;lossless=true&amp;fit=cover 500w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/974d1a9b-ac37-45ad-84f6-4abd3bfb593b/DKMS%20UK%20map.jpg?w=1000&amp;h=566&amp;auto=format&amp;lossless=true&amp;fit=cover 1000w" alt="Map of DKMS UK office in Chiswick with local Underground and rail stations"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Share:'''
