ttps://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1c6ad262-4780-4bcb-a727-c833e0a2ac28/Mike%20Peters%20on%20tour%20October%2024.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1c6ad262-4780-4bcb-a727-c833e0a2ac28/Mike%20Peters%20on%20tour%20October%2024.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/1c6ad262-4780-4bcb-a727-c833e0a2ac28/Mike%20Peters%20on%20tour%20October%2024.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Middle aged white man at a Rock concert"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} Make a difference with a simple cheek swab Jules, chair of LHS, also supports the One in a Million mission. “During this difficult time, we want to put our energy into helping others find that perfect match’” she says. “So please donate a cheek swab and get on the list to help a stranger. If we can boost the register by another 250,000 people, imagine the impact this legacy will have.” If you’re between 17 and 55, you can register online in a few simple steps and get a swab kit delivered to your home. Each new addition to the register could be the match that gives someone a second chance at life, making One in a Million more than just a campaign — it’s an opportunity to make a meaningful difference.Share:Related stories<img data-gatsby-image-ssr="" title="Four DKMS volunteers wearing branded t-shirts in front of a banner " data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=100&amp;h=56&amp;auto=format&amp;lossless=true&amp;fit=crop 100w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/101bd669-4c63-4639-9160-e304c5a95f6e/0bd759b9-8b05-4b7a-bfe5-afdb4214500f.jpeg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=crop 400w" alt="Four DKMS volunteers wearing branded t-shirts in front of a banner "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}News15/01/2025Celebrating a decade of dedicationThe DKMS West Midlands Volunteering Hub marks its 10t