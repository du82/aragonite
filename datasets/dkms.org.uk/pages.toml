of people holding a giant swab" data-main-image="" style="opacity:0" sizes="(min-width: 539px) 539px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=539&amp;h=231&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=135&amp;h=58&amp;auto=format&amp;lossless=true&amp;fit=cover 135w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=270&amp;h=116&amp;auto=format&amp;lossless=true&amp;fit=cover 270w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=539&amp;h=231&amp;auto=format&amp;lossless=true&amp;fit=cover 539w" alt="Group of people holding a giant swab"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Online Event (Virtual Fundraiser)Summer Challenge 202431/05/2024 - 29/06/2024Share:01/04/2024DKMS Summer Challenge launched! Throughout June, we’re challenging you to virtually travel 694 miles across Europe and help give more people with blood cancer a second chance of life! Join together with your friends, family, colleagues, teammates or neighbours to make the journey together. Take on a life-saving challenge Each time we register a new donor, the swabs they give us are analysed for a match to a waiting patient by our state-of-the art laboratory in Dresden, Germany. Our donors’ swabs need to get to Dresden. This summer we need you and your team to get them there, whether you cycle, run, walk, swim, roll, skate, scoot or anything else! You can embark on the very same journey that each and every potentially lifesaving swab kit takes. That’s a distance of 694 miles! Along the way you will meet transplant recipients, donors and pioneers of blood stem cell transplants. <img data-gatsby-image-ssr="" title="Group of people holding a giant swab" data-main-image="" style="opacity:0" sizes="(min-width: 1920px) 1920px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=1920&amp;h=1280&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=480&amp;h=320&amp;auto=format&amp;lossless=true&amp;fit=crop 480w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=960&amp;h=640&amp;auto=format&amp;lossless=true&amp;fit=crop 960w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/ba59e853-542a-401d-b0ca-0a1c8286c2b5/DSC_1297.jpg?w=1920&amp;h=1280&amp;auto=format&amp;lossless=true&amp;fit=crop 1920w" alt="Group of people holding a giant swab"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} New and improved You may remember our Swabtember challenges from 2022 and 2023. We’ve revamped this successful event to get even more of you involved. Over the last two years, over 200 of you have joined the challenge, covering over 30,000 miles! Together you’ve raised nearly £7,500, enough to fund the registrations of 187 potential lifesavers. Heaton Runners put their regular training runs to good use both years, totting up the miles together and raising £500 in the process. Caroline, one of the Heaton Runners, said, "It was a great event! It really helped to spread awareness and quite a few of our members signed up as donors. We will definitely be taking part again this year!" But don’t worry if you’re not an avid runner. All activities can contribute to your total; whether you are someone that enjoys a leisurely stroll, gets around using a wheelchair, scoots to work, roller skates with your kids or goes for a swim at the weekend. How to join the challenge Entry to the challenge is £6 and you have all of June to complete your journey. All participants will receive a DKMS t-shirt to wear on their journey. Raise £50 or more to receive a medal, and raise an amazing £150 for an exclusive DKMS water bottle. Tracking your journey You won’t face any travel chaos. You can do this all from your own home, or wherever you like to be active! Simply hook up your Strava to your fundraising page OR log your distance travelled manually. Watch as you travel along the map, around Europe and ultimately end your journey at the DKMS Life Science Labs in Dresden, Germany. More information Download your challenge information pack here Summer Challenge Pack(9 MB) Don’t hesitate to pop up us a message on fundraising@dkms.org.uk if you have any questions. This challenge is open to all ages and abilities.Share:Help us find more donorsEveryone who needs a blood stem cell transplant must find their potential donor. Can you help?Fundraise for usRegister as a donorVolunteer with us!'
