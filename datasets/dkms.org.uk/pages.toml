ataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} From personal experience to advocacy Max shares: “I first heard about DKMS through Mum’s transplant journey... For me, I realised how lucky Mum was that she had a sibling as a donor. It felt like it was the least I could do. “Me being a donor means a lot for Mum – it’s very much a full circle moment and I feel like I’m paying it forward.” <img data-gatsby-image-ssr="" title="Young man smiling on a hospital bed and holding bags of stem cells" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e1e8f3c1-0b7c-43e3-9b18-b0ebba5759ca/max%20donating%203.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e1e8f3c1-0b7c-43e3-9b18-b0ebba5759ca/max%20donating%203.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e1e8f3c1-0b7c-43e3-9b18-b0ebba5759ca/max%20donating%203.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e1e8f3c1-0b7c-43e3-9b18-b0ebba5759ca/max%20donating%203.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Young man smiling on a hospital bed and holding bags of stem cells"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" title="Man lying on a hospital bed and smiling at Camera" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/81ea54f8-fa68-417c-b65d-0adba71cf967/max%20donaitng.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/81ea54f8-fa68-417c-b65d-0adba71cf967/max%20donaitng.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/81ea54f8-fa68-417c-b65d-0adba71cf967/max%20donaitng.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/81ea54f8-fa68-417c-b65d-0adba71cf967/max%20donaitng.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Man lying on a hospital bed and smiling at Camera"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} Lesley adds: “Celebrating five years cancer-free - and then marking my five-year transplant anniversary just a few months later - are huge milestones for myself, as well as for anyone who has gone through a blood cancer diagnosis. Given the severity of our illness at diagnosis, the daunting prognosis, and the intense treatment we endure, reaching these milestones feels extraordinary. “For people who have had a blood cancer diagnosis, or have had a stem cell transplant, we understand just how significant these milestones are — especially when, at the start, we initially start counting our survival in days. Launching a movement: DKMS Herts and Essex Volunteering Hub "My own experience reaching these milestones, alongside Max’s donation, inspired me to get involved with DKMS as a volunteer and launch the DKMS Herts and Essex Volunteering Hub. Through our new volunteering hub, we want to raise awareness about the stem cell register and encourage more people to join – because every patient deserves a second chance." <img data-gatsby-image-ssr="" title="A man and a woman at a DKMS event holding a heart shaped balloon" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/84b6aca8-958f-4ffa-97f3-b707b65541e2/13.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/84b6aca8-958f-4ffa-97f3-b707b65541e2/13.jpg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/84b6aca8-958f-4ffa-97f3-b707b65541e2/13.jpg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5