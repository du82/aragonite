title = "Preparing to donate"
description = "Once you have undergone confirmatory typing, we will know you are a “genetic twin” and can give a person with blood cancer a second chance at life."
full_description = '''Donation ExplainedPrepare to DonateTopic6 ArticlesPreparing to donate Once you have undergone confirmatory typing, we will know you are a “genetic twin” and can prepare to donate to your matched patient. <img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 320px) 320px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/76aabec8-70a3-47d4-9fa6-f6df433a8346/a-illustration-topic-workup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/76aabec8-70a3-47d4-9fa6-f6df433a8346/a-illustration-topic-workup.png?w=80&amp;h=60&amp;auto=format&amp;lossless=true&amp;fit=crop 80w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/76aabec8-70a3-47d4-9fa6-f6df433a8346/a-illustration-topic-workup.png?w=160&amp;h=120&amp;auto=format&amp;lossless=true&amp;fit=crop 160w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/76aabec8-70a3-47d4-9fa6-f6df433a8346/a-illustration-topic-workup.png?w=320&amp;h=240&amp;auto=format&amp;lossless=true&amp;fit=crop 320w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/76aabec8-70a3-47d4-9fa6-f6df433a8346/a-illustration-topic-workup.png?w=640&amp;h=480&amp;auto=format&amp;lossless=true&amp;fit=crop 640w" alt="Graphic showing a checklist"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}From now on, every day counts: in many cases, patients need their stem cell transplants to happen as soon as possible. As you prepare to make your stem cell donation, our Workup Team colleagues will be with you every step of the way, giving expertise, advice and assistance whenever you need it. They will work closely with you to take care of all the organisation for your donation: travel arrangements to the collection centre any necessary hotel bookings, or certification for your employer. A designated contact will be available at all times to answer your questions about your stem cell donation. For DKMS it is crucially important to know that as a future stem cell donor you feel safe, well-informed and well looked after.<img data-gatsby-image-ssr="" title="Apheresis machine" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/80d85538-6e56-42c4-891e-21b9dd4dee35/london_clinic%20_DKMS_summer21_rachel_manns_5.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/80d85538-6e56-42c4-891e-21b9dd4dee35/london_clinic%20_DKMS_summer21_rachel_manns_5.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=contain 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/80d85538-6e56-42c4-891e-21b9dd4dee35/london_clinic%20_DKMS_summer21_rachel_manns_5.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=contain 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/80d85538-6e56-42c4-891e-21b9dd4dee35/london_clinic%20_DKMS_summer21_rachel_manns_5.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=contain 800w" alt="Apheresis machine"/>const t=