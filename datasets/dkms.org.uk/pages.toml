title = "A full circle of hope"
full_description = 'Get InvolvedStoriesA full circle of hope Family StoryA full circle of hope Inspired by her personal experience, Lesley launches DKMS volunteering hub to boost stem cell registration in Herts and EssexShare:17/02/2025Lesley and Max are a mum and son duo who share a special connection through stem cells! Now, we have an exciting update... Inspired by their journey, Lesley has launched the DKMS Herts and Essex Volunteering Hub to help add more lifesaving stem cell donors to the register. Their story began in 2019 when Lesley was diagnosed with blood cancer. That same year, she received a stem cell transplant from her sister – an experience that motivated Max to register as a stem cell donor himself. Last year, Max went on to donate his stem cells after being called as a match for a patient in need. <img data-gatsby-image-ssr="" title="Two elderly white women smiling with one on the hospital bed" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e375ef87-98d7-4bbf-aef8-935dda6021b0/lesley%20and%20sister%201.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e375ef87-98d7-4bbf-aef8-935dda6021b0/lesley%20and%20sister%201.jpg?w=150&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 150w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e375ef87-98d7-4bbf-aef8-935dda6021b0/lesley%20and%20sister%201.jpg?w=300&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 300w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/e375ef87-98d7-4bbf-aef8-935dda6021b0/lesley%20and%20sister%201.jpg?w=600&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 600w" alt="Two elderly white women smiling with one on the hospital bed"/>const t="undefined"!=ty