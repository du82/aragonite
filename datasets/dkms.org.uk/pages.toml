full_description = '''Campaign01/09/2024Blood Cancer Awareness Month 2024<img data-gatsby-image-ssr="" title="A graphic design featuring a blood droplet and the words lymphoma, myeloma and leukaemia " data-main-image="" style="object-fit:cover;opacity:0" sizes="(min-width: 1920px) 1920px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c58568d5-aaa8-4438-a13c-a0eec4a90a33/Copy%20of%20BCAM%20Graphics%201080x1080%20%281%29.png?w=1920&amp;h=1980&amp;auto=format&amp;lossless=true&amp;fit=clip" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c58568d5-aaa8-4438-a13c-a0eec4a90a33/Copy%20of%20BCAM%20Graphics%201080x1080%20%281%29.png?w=480&amp;h=495&amp;auto=format&amp;lossless=true&amp;fit=clip 480w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c58568d5-aaa8-4438-a13c-a0eec4a90a33/Copy%20of%20BCAM%20Graphics%201080x1080%20%281%29.png?w=960&amp;h=990&amp;auto=format&amp;lossless=true&amp;fit=clip 960w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/c58568d5-aaa8-4438-a13c-a0eec4a90a33/Copy%20of%20BCAM%20Graphics%201080x1080%20%281%29.png?w=1920&amp;h=1980&amp;auto=format&amp;lossless=true&amp;fit=clip 1920w" alt="A graphic design featuring a blood droplet and the words lymphoma, myeloma and leukaemia "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Get InvolvedCampaignsBlood Cancer Awareness Month 2024Share:01/09/2024 This September, we’re dedicating each week to not only raising awareness, but also educating and inspiring action around various blood cancers and disorders. With the help of leading charities, patients, and medical experts, we'll be sharing essential knowledge, uplifting stories and practical ways you can make a real difference this Blood Cancer Awareness Month. What's happening each week? Week 1: spotlight on myeloma Myeloma is a cancer that targets plasma cells in the bone marrow. It’s less common but no less devastating. This week is all about raising awareness of myeloma through expert-led discussions, patient stories, and informative content. We’re partnering with Myeloma UK to ensure you have access to the most accurate and helpful information. Week 2: focus on leukaemia Leukaemia is one of the most common types of blood cancer, yet there’s still so much to learn about it. We are partnering with Leukaemia Care and Leukaemia UK to delve deep into what leukaemia is, how it affects people, and how you can better spot the symptoms. Week 3: understanding lymphoma Lymphoma affects the lymphatic system, which is crucial for our immune response. This week, we are collaborating with Lymphoma Action to shed light on the different types of lymphoma, their symptoms, and the importance of early diagnosis. You’ll also hear from a patient about living with and beyond lymphoma. Week 4: blood disorders and their impact Not all blood-related conditions are cancers, but many are life-altering. From sickle cell disease to aplastic anaemia, this week we’ll explore various blood disorders that impact thousands of lives and share stories from people who live with these conditions. Week 5: patient-donor meeting The final week will feature a special patient-donor meeting. This event will bring together a former patient and the hero who donated stem cells to give them a second chance at life. Raising awareness for a diverse register To mark Blood Cancer Awareness Month, we also met up with stem cell donor Paul and members of The Prince’s Trust Youth Voice programme to discuss the importance of signing up to the stem cell register and increasing awareness within the Black community, where people are under-represented on the register. Learn more <img data-gatsby-image-ssr="" title="Three African people looking at an event" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/af80afcb-cdcb-49ab-a343-df0edde9477e/1.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/af80afcb-cdcb-49ab-a343-df0edde9477e/1.jpg?w=200&amp;h=150&amp;auto=format&amp;lossless=true&amp;fit=crop 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/af80afcb-cdcb-49ab-a343-df0edde9477e/1.jpg?w=400&amp;h=300&amp;auto=format&amp;lossless=true&amp;fit=crop 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/af80afcb-cdcb-49ab-a343-df0edde9477e/1.jpg?w=800&amp;h=600&amp;auto=format&amp;lossless=true&amp;fit=crop 800w" alt="Three African people looking at an event"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<img data-gatsby-image-ssr="" t