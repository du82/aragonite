ansform our mission into reality. Our volunteers make a huge difference every day by helping us to advance our work. Whether you’re able to donate a few hours a week or a few hours a year, there may be a role for you! There are lots of things you can do to get involved: raising funds raising awareness about the importance of blood stem cell donation supporting a donor recruitment drive providing support to patients throughout the donation process volunteering as a student helping with administrative tasks. There is plenty on offer, whatever your interest. Contact us Ian CorpuzVolunteering Managervolunteering@dkms.org.ukGet in touch Benefits of volunteering As a volunteer with DKMS, you will also: build your confidence meet new people develop your skills. Some roles include expected time commitments, while others can be a one-off opportunities. Expected time commitments are listed within the volunteer role description for each volunteer role. At college or university? Volunteer with us!Apply here Join us Our network of volunteer hubs supports DKMS across the UK <img data-gatsby-image-ssr="" title="Members of DKMS Bedford hub" data-main-image="" style="object-position:48.9% 24.11%;opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d3623c53-72aa-44b2-89a8-7db9aa03502c/befordhub_1200x820.jpg?w=800&amp;h=450&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d3623c53-72aa-44b2-89a8-7db9aa03502c/befordhub_1200x820.jpg?w=200&amp;h=113&amp;auto=format&amp;lossless=true&amp;fit=cover 200w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/d3623c53-72aa-44b2-89a8-7db9aa03502c/befordhub_1200x820.jpg?w=400&amp;h=225&amp;auto=format&amp;lossless=true&amp;fit=cover 400w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a