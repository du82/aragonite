ries can be directed to Press@dkms.org.uk. Outside of these hours, please leave a message using the 'Contact us' button. We will reply to you during the next working day.Frequently Asked Questions (FAQs)Find answers to common questions about our work including the registration process, making a blood stem cell donation, and volunteering with us.Go to FAQsGeneral enquiries and Registering as a donorIf you have questions or want to find out more about the work of DKMS, get in touch. Also support for our registered donors and anyone wishing to find out more about the registration process and blood stem cell collection processes info@dkms.org.uk020 8747 5620Contact usPatient and Families enquiries Contact us to learn how we assist in finding matches. We're dedicated to supporting you every step of the way. patients@dkms.org.uk020 8747 5620Contact usPress enquiriesIf you have questions or want to find out more about the work of DKMS, get in touch. press@dkms.org.uk07399 019 149email usUpdate your detailsIf you are identified as a matching donor, it is important that we can contact you. Please keep us updated with any changes to your personal details. Update your detailsOur officesDKMS UKAshburnham House, Castle Row, Horticultural Place, Chiswick,London W4 4JQ020 8747 5620Get involved, support our missionJoin the register, raise awareness, do a fundraising challenge - you choose!<img data-gatsby-image-ssr="" title="Table with a red cloth and the DKMS logo on " data-main-image="" style="object-fit:cover;opacity:0" sizes="(min-width: 500px) 500px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/93a3e4a2-0086-494b-ac9b-1d07049ce53f/LSEG%20_DKMS_summer21_rachel_manns_73_small.jpg?w=500&amp;h=500&amp;auto=format&amp;lossless=true&amp;fit=clip" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/93a3e4a2-0086-494b-ac9b-1d07049ce53f/LSEG%20_DKMS_summer21_rachel_manns