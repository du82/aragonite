["https://dkms.org.uk/get-involved/stories/love-hope-strength-foundation-launches-one-in-a-million-campaign"]
title = "Love Hope Strength Foundation launches new campaign"
description = "Rock star’s charity aims to double its number on stem cell register"
full_description = 'Get InvolvedStoriesLove Hope Strength Foundation launches "One in a Million" campaignNewsLove Hope Strength Foundation launches "One in a Million" campaignRock star’s charity aims to double its number on stem cell register Share:13/11/2024<img data-gatsby-image-ssr="" title="Love hope strength foundation logo " data-main-image="" style="opacity:0" sizes="(min-width: 288px) 288px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b80cc5e3-5636-4809-bfe3-9702e289ea71/lhs-blk-logo-web.jpg?w=288&amp;h=424&amp;auto=format&amp;lossless=true&amp;fit=cover" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b80cc5e3-5636-4809-bfe3-9702e289ea71/lhs-blk-logo-web.jpg?w=72&amp;h=106&amp;auto=format&amp;lossless=true&amp;fit=cover 72w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b80cc5e3-5636-4809-bfe3-9702e289ea71/lhs-blk-logo-web.jpg?w=144&amp;h=212&amp;auto=format&amp;lossless=true&amp;fit=cover 144w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/b80cc5e3-5636-4809-bfe3-9702e289ea71/lhs-blk-logo-web.jpg?w=288&amp;h=424&amp;auto=format&amp;lossless=true&amp;fit=cover 288w" alt="Love hope strength foundation logo "/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}} The Love Hope Strength Foundation (LHS), led by rock star Mike Peters and his wife, Jules, is dedicated to increasing the number of stem cell donors on international registries. Through their new One in a Million campaign, they aim to double the number of registered donors over the next two years. Having already inspired 250,000 individuals to register in collaboration with DKMS, LHS is now reaching out to more potential donors to provide potentially life-saving matches for blood cancer patients worldwide. This week, Mike and Jules have undertaken numerous media interviews, encouraging people to join the UK stem cell donor register. The launch of their One in a Million campaign has also featured in print and online news headlines right across the UK. Mike Peters’ journey and appeal For Mike, frontman of rock band The Alarm, the One in a Million campaign holds deep personal significance. Diagnosed nearly 30 years ago with chronic lymphocytic leukaemia (CLL), he now faces an urgent need for a stem cell transplant following a recent diagnosis of Richter’s Syndrome, a rare and aggressive form of lymphoma. “Imagine if you could help someone by being their ‘One in a Million’ life-saving match,” he says. “We all search for some kind of legacy, and what a legacy this could be. Being a donor requires so little effort, and the reward is immense.” Though Mike was close to preparing for a transplant, the setback delayed the procedure, highlighting the critical importance of finding a match for patients like him. Mike remains hopeful, exploring options that could bridge him to potentially transformative therapies. "The future is uncertain," he says, “but I want to make sure I help other blood cancer sufferers like me.” <img data-gatsby-image-ssr="" title="A middle age man and woman at the beach" data-main-image="" style="opacity:0" sizes="(min-width: 600px) 600px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/bcf86b07-51d6-47e0-839e-f6fee226ade5/Jules%20and%20Mike%