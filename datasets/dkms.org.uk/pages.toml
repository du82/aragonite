["https://dkms.org.uk/donation-explained/stem-cell-donation/bone-marrow-donation"]
title = "Bone marrow removal"
description = "Stem cells are taken from the iliac crest of your pelvis, under a general anaesthetic. About one litre of bone marrow-blood mixture is removed."
full_description = 'Donation ExplainedStem Cell DonationBone marrow donationStem cell donationBone marrow donationBone marrow removal is used in about 10 percent of stem cell donations. Share:Donation method: how it works Your donation takes place in a certified collection clinic. Stem cells are taken from the iliac crest of your pelvis under a general anaesthetic. About one litre of bone marrow-blood mixture is removed, which is the equivalent of about five percent of the total bone marrow in your body. Your bone marrow regenerates within a few weeks. Before your donation The health risk of bone marrow removal is low and essentially limited to the general risk that comes with any operation under general anaesthetic. In order to eliminate avoidable risks, a thorough medical health check for our donors is our top priority. In the collection clinic, doctors carry out what is known as a preliminary donor health check to determine the medical suitability of the donor. This includes looking at their medical history, a physical health check and an assessment of lab results. Donors also speak to a doctor from the collection clinic. If stem cells are to be removed via bone marrow surgery, a consultation with an anaesthesiologist clarifies the risks of the anaesthesia. When all of the health checks show that the donor’s health will not be impacted in any way by a stem cell donation, the procedure is finally carried out. After the bone marrow has been removed, you may experience localised pain for a few days. This is caused by the wound and often feels like bruising. After your donation Donors donating via bone marrow removal normally stay in hospital for one or two nights following the procedure. After that, our doctors advise you to consult staff at the collection clinic and spend a few more days recovering at home. Bone marrow donation guide Bone marrow donation guide(4.43 MB)Share:Get involved, support our missionRaise awareness, join the registry, host your own event, do a fundraising challenge - you choose!<img data-gatsby-image-ssr="" title="A little girl sitting in a garden blowing bubbles" data-main-image="" style="object-fit:cover;object-position:57.92% 34.58%;opacity:0" sizes="(min-width: 500px) 500px, 100vw" decoding="async" loading="lazy" src="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0b3eba2d-f8ad-4c3a-80a9-1bbe7370d082/livia%20_DKMS_summer21_rachel_manns_39_small.jpg?w=500&amp;h=500&amp;auto=format&amp;lossless=true&amp;fit=clip" srcSet="https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0b3eba2d-f8ad-4c3a-80a9-1bbe7370d082/livia%20_DKMS_summer21_rachel_manns_39_small.jpg?w=125&amp;h=125&amp;auto=format&amp;lossless=true&amp;fit=clip 125w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0b3eba2d-f8ad-4c3a-80a9-1bbe7370d082/livia%20_DKMS_summer21_rachel_manns_39_small.jpg?w=250&amp;h=250&amp;auto=format&amp;lossless=true&amp;fit=clip 250w,https://assets-eu-01.kc-usercontent.com:443/a67f4cea-f9cd-01b2-53e6-d2d3c10aed5a/0b3eba2d-f8ad-4c3a-80a9-1bbe7370d082/livia%20_DKMS_summer21_rachel_manns_39_small.jpg?w=500&amp;h=500&amp;auto=format&amp;lossless=true&amp;fit=clip 500w" alt="A little girl sitting in a garden blowing bubbles"/>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Make a financial gift<img data-gatsby-image-ssr="" title="Donor drive in progress" data-main-image="" 