["https://dlib.net/books.html"]
title = """
dlib C++ Library           - Suggested Books"""
full_description = '''One of the major goals of dlib is to have documentation that enables someone to easily make use of its various components. Ideally, you would read a short description of something, understand it immediately, and begin using it in your application without any difficulty. Obviously, this depends partly on the background of the user. For example, if you have never written C++ software before then it probably isn't going to be this easy. This page is meant to complement the main library documentation by providing references to books, along with my commentary, which explain most of the background material needed to understand the various parts of the library. In most cases these are the books I learned from during the process of creating dlib. As always, if you disagree with anything or think I have left out an important text then shoot me an email. The second important subject is optimization. Whenever you see the text mention the KKT conditions, duality, "primal variables", or quadratic programming it is talking about ideas from optimization. A good book which will explain all this to you is Practical Methods of Optimization. Note that this book calls the KKT conditions just the "KT" conditions. It is talking about the same thing. Also, duality is something that comes up a lot in optimization but in the context of machine learning usually people are talking about a particular form known as the Wolfe Dual.'''
