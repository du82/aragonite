["https://dlib.net/compile.html"]
title = "dlib C++ Library"
full_description = "Either run pip install dlib --verbose or grab the latest sources from github, go to the base folder of the dlib repository, and run python setup.py install. Once either of these commands finishes running you are ready to use dlib from Python. Note that you need to have CMake and a working C++ compiler installed for this to work. Also note that various optional features like GUI support (e.g. dlib.image_window) and CUDA acceleration will be automatically enabled or disabled based on what is available on your computer. When you run the install command it will print messages telling you what it is using. Read those messages and take appropriate action if you don't like the results. For example, Linux and OSX users may have to install libX11 to use the GUI tools. If you care about this then read the messages since they tell you how to get these optional features installed. Alternatively, if you want to add more python bindings to dlib's python interface then you probably want to avoid the setup.py file and work directly using CMake. In particular, dlib's python API is built by the CMake project in the tools/python folder. You build this project using the usual CMake commands and when compiled it outputs the dlib shared library that defines the python API for dlib. The examples/CMakeLists.txt file tells CMake how to build the examples. You can create your own projects by starting with this file and editing it however you like. You can also perform additional configuration of a cmake project using the cmake-gui or ccmake tool. For example, if you are using dlib's face detector then you should turn on either SSE4 or AVX instructions since this makes it run much faster (also see this FAQ). Finally, note that when using Visual Studio, CMake will by default generate a 32bit executable. This means the programs you compile will only be able to use 2GB of RAM. To avoid this, you need to tell CMake to generate a 64bit executable. You do this by using a command like In most cases, to use this library all you have to do is extract it somewhere, make sure the folder containing the dlib folder is in your include path, and finally add dlib/all/source.cpp to your project."
year_published = 2025
