full_description = "如何备考 TOEFL/GRE Posted on 2016-03-21 | In Knowledge | Reading time ≈ 13 前言的前言去年 11 月通过微信群做了 T/G 备考经验的分享，之后一直没有时间把当时的内容整理成文字。后来李臻博同学主动帮我进行了整理（编辑：链接已失效）。不过我还是想用自己的文字做一遍整理和修改。最近终于找到了时间，所以现在把这篇经验分享给大家，希望大家各项考试顺利，都能申请到自己的 Dream School > <。 本文采用署名 - 非商业性使用 - 禁止演绎 3.0 中国大陆许可协议进行许可。著作权由章凌豪与李臻博共同所有。 前言先晒一下成绩以表诚意：TOEFL：14 年 11 月 110；15 年 10 月 112GRE：15 年 10 月 Verbal 161 + Quant 170 + AW 4.0 本文的目的是分享一些对于有一定英语基础的人适用的 DIY 备考经验，而不会讨论诸如“我听力很烂应该怎么提高”之类的问题的。因为这些问题基本上都可以用“努力多练”四个字来回答。当然，本文提到的一些备考资源和工具是完全可以拿来提高自己的弱项的。 TOEFLT 是一个衡量日常和学术英语能力的考试，而不是一个需要死记硬背考前突击的考试。所以，英语基础比较好的同学并不用花很大的力气去准备。 我第一次考 T 的时候就是做了 15 套 TPO 里面的听力和阅读，除此以外只在考前熟悉了一下口语和写作的题型。 曾经有好几位基础还不错的同学来找我询问 T 的备考策略。他们都提到了要不要花钱去英语培训机构上课。我始终认为那些培训结构除了满足伸手党的惰性和督策一部分极度不自律的人以外没有任何帮助。我也接触过一些培训机构，拿到过一些所谓的内部资料，并不觉得是什么自己动手所比不上的资源。事实上那几位同学听从我的建议 DIY 备考以后几乎都拿到了 100 分以上的成绩。 听力听力在 T 中有着举足轻重的地位。除了阅读以外的部分都要用到听力。 听力除了因为词汇量和练习量的问题听不懂以外，另一个问题就是注意力不集中，使得原本能听懂的内容也没能听懂。我两次考 T 听力都是满分，即便如此我在考试中照样也遇到了因为一个分心就没听到一个信息点的情况。我的经验是，在考场上不要花太多经历去记笔记，而是专注于听懂材料的内容。一个 Section 里面三篇材料，第一篇是不需要记任何东西的，后面两篇也只需要记一些很明显是分点叙述的关键句。比如材料里面教授说某某艺术流派有三个重要的特点，那么把这三点的第一句记下来就差不多了。虽然题目里一定会考到一些细节，但仔细去听去理解往往比手忙脚乱用笔去记要更容易回忆起细节来。 第二次考 T 的时候，因为无聊加上前后座位距离近，我观察了一下前排三个人做听力的方式。我发现一个限时 10 分钟、只有 17 道题的 Section，他们都要耗到最后一两分钟才能做完。因为我是那种平时练习吊儿郎当容易分心的人，所以我非常理解他们的心理。这就是因为注意力不集中没有听到某个点，遇到题目就只能排除掉前两个选项，在剩下两个选项中不断纠结，只能靠猜了。 所以说，真正到考前时，多想想怎么提高自己的专注力，可能会更有帮助。 做微信群分享时，有同学推荐了 aboboo 这个用于提高听力的 APP，可以一试。 阅读阅读没有太多可说的，当时有同学提问如下： 时间不够。这就是单词量太小或者阅读量不够。练吧。 六选三总是做错。这个题型有一定技巧，一般用排除法会比较好入手。错误的选项往往是有细节跟文章不符（常见的比如把两个观点混杂在一起，把观点的一部分讲反，或是夸大观点的结论等），或是虽然跟文章相符但不属于文章主线。这时候如果阅读速度比较快会很有优势，因为可以在做题之前先把文章通读一遍，最后做到六选三甚至还有时间重新去翻文章。 口语准备 T 的口语跟提高日常口语能力几乎是完全等价的。口语好的人完全不用担心 T 的口语，因为一定不会让你没有东西讲，你要做的只是熟悉题型和不要紧张。 具体到备考，可以去找一些机经上的口语问题，但不要背它给的答案（一是背模板容易出事，二是很多机经的答案质量很低），而是自己掐着表对着麦克风讲。如果考前能这样每天练个半小时，考试的时候应该就不会惊慌失措了。 要注意的是，口语 6 个题里面有一半都是要用到听力的。所以你看，听力在 T 里面有多重要。 写作写作的第一部分基本就是考听力，会给一篇阅读材料，里面会分三段论述一个观点。而听力材料则会逐点反驳或是支持阅读材料（一般反驳的比较多）。最后你要结合阅读和听力材料写一篇文章，不过重点是放在听力上的。基本上把听力材料里面每一段的关键句记下来就可以了。写的时候就先提一下阅读材料里面的观点，然后讲一下听力材料里面是怎么反驳或是支持它的。 第二部分就是标准的三段八股文，没有太多可说的。题目一般都比较生活化，不会想不到东西写。有一个说法是，在语言大体流畅的前提下，写的越多分数越高。这个说法可能有一定道理，因为我第一次考 T 时，写了 400 词后就把时间都花在润色上了，最后拿了 27 分；而第二次我决定听从这个建议，写了将近 500 词，就得了 29 分。当然样本太小不能说明任何结论，但是这个说法还是值得提一下。 我曾经帮不计其数的同学改过他们写的英文，感觉很多人之所以写不顺畅就是因为他们下笔之前先在脑子里生成中文，然后强行翻译成英文再写下来。这是一个非常错误的做法。因为翻译的要求比写作高多了。正确的做法是在平时刻意锻炼自己用英语思维进行表达的能力，尽量跳过中文直接把思绪用英文写下来。同时也要有意识地积累常见的习惯表达和搭配。这么做可能刚开始会比较辛苦，但一旦长期坚持下来一定是有好处的。 备考策略 提前规划，留出足够的时间提高弱项。 做 10 套以上 TPO 熟悉题型，同时针对弱项进行练习。 抽时间熟悉作文题型 考前一个月左右开始熟悉和练习口语题型，每天坚持半小时。 考前一周放松心态，可以做 1~2 套 TPO 保持手感。 GREG 和 T 是完全不同的两种考试。对中国学生来说（至少对理工科来讲），Quant 基本不成问题，大部分学校对 AW 分数的要求也不会太高，所以考 G 基本就是在考 Verbal。所以如果要考 G 的，我建议一定要早早规划好好准备，争取一次通关，因为准备 Verbal 实在是太恶心了。 单词犹豫了很久，还是打算在这里谈一点对背单词这件事情的看法。 我认为现在市面上几乎所有背单词 APP 的实际学习效果都几乎为 0。这个结论来自于我的个人经验和与朋友的交流，以及来自研究的间接支持（绝大部分背单词 APP 的学习方式都很容易给学习者带来这篇文章里所说的Illusion of Competence）。我不打算在这里展开论述，只是如果你在用 APP 背单词，我希望你能抽空思考一下这样背单词究竟有没有带来什么实际的成果。 尤其是像 G 这种难度和容量的词汇要求，用 APP 背单词是非常不可取的。最好的方式还是对着词汇书背。要注意不要光看中文释义，以及要多跟同义词和反义词进行联想，这一点在 Verbal 中相当重要。 Verbal首先是官方的 OG，现在一共有一本总册和 Verbal、Quant 两本分册。因为 G 的官方题目是稀缺资源，所以这三本基本上都是要买来刷完的。 然后就是神器 Magoosh 了。Magoosh 上有 1000 多道题，Verbal 和 Quant 各占一半。它的 Verbal 应该是目前为止最接近实考难度和质量的题库了。订阅 6 个月 Magoosh 的费用是 99 美元，目前我还没有遇到过买了后悔的。虽然 Magoosh 并没有给我广告费，但出于良心还是要安利一下的，尤其是在这个高质量 Verbal 题库如此稀缺的现状下。 Verbal 三种题型，刚开始做的时候会觉得，阅读生词多逻辑又复杂，完型和选择总是一半单词不认识，特别打击信心。这时候要调整好心态，从背单词开始，做一题是一题。到最后会发现，单词背得熟的话，阅读只要头脑清醒就很容易做对，完型和选择也能排除掉绝大多数的错误选项。当然，最后考试成绩跟运气和发挥是有很大关系的。因为考试就那么几个题，一个单词忘记了可能就少一分。但是反过来想，多背熟一个单词可能就多一分，所以也算是天道酬勤吧。 11 届一位去了 CMU 的学姐说过，只要把要你命（新东方的 GRE 词汇书）背个十遍， Verbal 就能上 160 了。虽然我只背了两遍，但这句话还是很有教育意义的。 如果买了 Magoosh 的话，要善用它的错题标记和笔记功能。到最后阶段可以把笔记导出来，作为高频错词整理复习，非常有帮助。 QuantOG 里的题应付 Quant 基本足够了。数学基础比较薄弱的同学可能要着重针对下概率、统计和数列这些知识点。 如果你买了 Magoosh，上面五六百道 Quant 题也够你做了。 一般来说胆大心细就能拿到 170 或者 168 分。但是也不能掉以轻心，陷阱题还是挺多的。 Analytical WritingG 的写作分为 Issue 和 Argument。Issue 是给你一个论题让你发表自己的看法，而 Argument 则是给一篇论证让你反驳。 一般来说 Argument 比较好写，因为给你的材料里面往往有很多的逻辑漏洞。比如材料会说某市进行了问卷调查，根据结果市政府应该如何如何。那么你上来就可以质疑该问卷的调查对象、问卷设计以及有效问卷数等，基本就是耍嘴皮子。 Issue 稍微难写一点，这也是 G 的作文跟 T 的作文很不一样的一个地方。一是 Issue 的论题往往比较复杂，容易想不到写什么；二是 Issue 要求不能一边倒，不能像 T 的作文一样无脑三段八股文碾压过去。比如要反驳一个论点，如果是 T 的作文可能就是直接分三点反驳，而 G 的要求是你必须详细叙述在这个论点在多大程度上是错误的，指出它所依赖的假设和前提条件，并分析当这些条件发生变化时论点的强度会发生怎样的变化。 Issue 我参考的是李建林老师的新GRE写作5.5分。这本书主要把常见的 Issue 题目分成了几个大类，对每类题型都总结了一套能让你言之有物的分析思路，并配以实际例子讲解。比如针对因果性的建议类题目，可以采用的角度就有：一、原因是否成立；二、从这个而原因是否能推出与目的一致的结果；三、是否有其他做法也可以达到相同的目的。花点时间看完讲解并试着动手写一写，到考试时应该就不会什么都写不出来，或是写不到规定字数了。 另外就是 OG 上的范文也是很好的资源，都是真实考场上出现的高分作文，要好好看。 要注意的一点是，G 的作文注重的是逻辑，而不是文采。当然两者都有最好，但千万不要试图写一堆 G 的词汇来彰显自己的文采，因为阅卷的考官不一定认识这些词汇。 备考策略 每天背单词，做 Magoosh。提前计划好，在考前半个月时至少过完两遍单词且做完 Magoosh。 抽几个周末出来把 OG 刷完。 考前一个月左右抽时间研究 AW 的题型和思路，试着写两三篇找感觉。 考前半个月开始可以做做模考（我做过 PP2、Kalpan 和 Barron，但是感觉都不怎么样，有更好的资源欢迎留言告知）。 最后阶段视短板而定，可以反复复习高频错词，巩固下 Quant 难点，多看看 OG 上的范文，又或者是重做 Magoosh 的错题。 后记备考 T 和 G 是我大学生活里非常独特的两段时光。其实平均下来每天花的时间也就大概刚刚到一个小时。所以说只要想做总不会没时间的。 我的一家之言难免有失偏颇。我能保证这篇文章所讲的是对有一定基础的人来说比较有效的备考策略，但不能保证它是适合所有人的最佳策略。希望大家明白兼听则明偏信则暗的道理。 Buy me an Asahi beer :) Donate Alipay Installing XGBoost on Windows 如何在 Kaggle 首战中进入前 10%"
