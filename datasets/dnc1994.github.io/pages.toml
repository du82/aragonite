full_description = "过去这五年，我学到了什么 Posted on 2018-12-25 | In Knowledge | Reading time ≈ 10 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/five-year-learning-2013-2018/。 本文是前一篇五年总结的后续。希望就如何实现自己的目标这个话题给各位带来一些启发。 基本方法论了解自我了解自我是伴随每个人终身最重要的课题。人生的早期阶段，尤其是高等教育期间，是了解自我的黄金时期。 进入一个好大学，就读有竞争力的专业，获得优秀的学习成绩，拿到心仪的工作机会。这些固然是非常重要的目标，但不应该仅仅只是目标。达到这些目标的过程同时也应该被看作是了解自我的一种手段。 具体来说，了解自我可以体现在方方面面。比如弄清楚自己一天中什么时候学习、工作效率最高，连续集中注意力的时间上限是多少；又比如探索自己分别擅长和不擅长哪种类型的任务，或是哪种类型的回报对自己的激励作用最强等。 以我的个人经历为例，过去五年间我最重要的两点发现是：1、我完全无法做好自己不发自内心认同的事情。2、我享受做面向用户的产品。这样的自我认识对职业道路的选择就有着重要的指导意义。 一个人就是一家创业公司在人生的早期阶段，我们面临的困境跟创业者们所面临的困境很像：世界每分每秒都在变化，对事物的认知永远无法达到完全正确，甚至很多时候错得离谱。创业公司拥抱这种现实的方式，是通过快速的迭代和试错，来最大化他们理解市场和用户的速度。 我们可以从中得到许多借鉴。总的来说，每个人都应该把自己当做一家创业公司，接受失败和试错的常态，在考虑多个机会时偏向于能够更多更快地学到新东西的那个选择。 师傅领进门，修行在自身。一个潜在的问题是如何跨越从零到一的槛。基于个人经历，我的建议有： 广泛阅读：本文第二部分关于执行计划的方法论和技巧基本都是我从一些 MOOC 和生产力书籍中学到的。 混入到比你优秀的人当中：大一时我开始与一群朋友租用独立服务器，借此以 Linux 基本操作和 Web 后端开发为起点入门了 CS 这个庞大的领域。 寻求 Mentorship：大二时我在学校实验室导师的指导下学习了如何阅读论文。 建立高效的反馈回路建立高效的反馈回路对快速的迭代和试错来说至关重要。寻求外界的帮助（比如学校的导师和工作的前辈）或是自行设立衡量指标，用来帮助你在学习新事物或是实验新技巧时了解当前的效果如何以及如何改进。 我在学习如何阅读论文时，每周会跟导师面对面交流对上一周布置的 2~3 篇论文的理解，这使我的错误理解和不良习惯得以被纠正；在了解到番茄工作法（Pomodoro）之后，我通过完成事项的数量和质量（客观指标）和对工作时精神状态的自我评价（主观指标）来确定每个时间周期应该定为多长。 建立这样的反馈回路有时是困难的，甚至是不可能的。在这种情况下，重要的是我们能够有意识地去思考反馈、指标和修正这些元素。 执行！执行！执行！设立目标 Shoot for the moon. Even if you miss, you’ll land among the stars. 有句玩笑话说：梦想还是要有的，万一实现了呢？这其实不无道理。 我们应该尽早地为自己设立多个不同层次的目标。这样做至少有以下好处： 平摊达成目标所需的成本：以准备 GRE 考试为例，我提前 6 个月制定了备考计划，从而使得每天所花时间平均不到一小时。这样一来我不需要脱产备考，也更容易坚持完成进度。 利用大脑的排演机制：研究认为，大脑在睡眠时会排演学到的新内容或是未来计划中困难的部分。通过将目标提前罗列在脑海中，我们可以在事实上降低达成目标的难度。 对抗拖延：这一点要求在设立目标时不能停留于「我要做 X」，而要详细到「我要做 X，如果到了 Y 时进度跟不上，我就去做 Z」这种程度。 Getting Things Done高效执行计划的核心在于尽量多地完成预设的目标。而如何在有限的时间内做完尽量多的事，基本就可以归结于发展一套适用于自己的 GTD（Getting Things Done）系统。 市面上有许多关于 GTD 的资料，但具体采用什么方法论或是使用哪些工具不是最重要的。重要的是要有意识地去实验、确定和执行适合自己的系统。举例来说，我的 GTD 系统主要包含如下部分： 规划事项和估计耗时：规划杂务和有截止期限的事项很容易，要留意的主要是处于「第二象限」（重要但不紧急）的事项。我个人习惯先花一定时间将目标具体细分并设定时间线，然后每周预留固定时段用来完成这些子目标。估计耗时则主要依赖于经验，而且并不需要十分准确，更重要的是借助估计的过程在脑海中初步形成「如果某一阶段耗时超出可接受范围该怎么办」的概念。 记录和追踪事项进度：如这篇文章中所说，我将所有的待办事项放在同一个列表中。一般而言，列表本身可以用任何文字编辑工具（包括纸笔这样的物理介质）来管理，也有人偏好使用专门的软件。而我选择的是表达能力比纯文本更强一点的 Markdown 以及 Mak 这个编辑器。 Prioritization：事情永远是做不完的。我们需要周期性地评估和调整所有待办事项的优先度，从而决定在某个空闲时段应该做什么事项。我在写下待办事项的同时，还会记录它们所对应的中长期目标，并将这些目标放在列表的最顶部用来指导 prioritization：永远优先做当下对达成目标贡献最大的事项（有截止期限的事项除外）。 执行事项：我一般会使用上文提到过的番茄工作法，以 50 分钟 + 10 分钟的周期进行工作。 总结与反思：我会阶段性地借助日常记录的各种数据（脱离数据无法讨论改进，但也要平衡好记录的颗粒度）来调整自己下一阶段的目标。今后我可能会需要形成更正式的流程。 态度决定高度珍惜时间时间是最稀缺的资源。不要为了节约其他资源（尤其是金钱）而牺牲时间。 但有时候「浪费时间」是不可避免的。我们主观上觉得浪费了的时间可能是解决问题所必不可缺的一部分。或者说，某些「浪费」掉的时间是比其他时间更有价值的。这件事情没有统一的标尺，一般来说花大量时间去巩固基础绝不会是浪费。 对抗焦虑 We shape our tools, and thereafter our tools shape us. 拒绝 FOMO：在这个信息过载的时代，我们往往已经拥有足够多的信息来达成目标，在此前提下不断被动地收取额外的信息不仅浪费时间而且徒增焦虑。更有收益的是整理自己已经掌握的信息，比如把它们写成像本文一样的总结。 管理期望：我们的焦虑往往来自于错位的期望。而期望管理是一个通过反复刻意练习可以提高的技巧。 远离有毒的工具、平台和社交关系：关闭不必要的推送，卸载知乎和今日头条这样的 App，好好利用 Screen Time 或类似的功能，做更多能让你忘记捧起手机的事情。 自我 Hacking：小到情绪管理，大到人际交往，在掌握了运作原理和潜在规则之后，我们是能够在一定程度上对抗自身的动物性和身心局限的。举例来说，如果破费去吃最喜欢的食物能够一扫负面情绪并让自己开始有效率地产出的话，那就去吧！ 寻求帮助 勇于寻求帮助 用正确的方式寻求帮助。 帮助和影响身边的人 一个人的成功往往在很大程度上依赖和反映于他周围的人的成功。 在帮助他人的过程中我们往往能够发现自己需要改进的地方，比如对一个知识点理解得不够透彻等。 帮助他人这件事情本身能够带来巨大的回报感和满足感。 连点成线Connecting the dots 是一个非常美丽的梦想。没有人不想能够像 Steve Jobs 那样在获得了伟大的成就以后回顾自己的经历并将其串成线来津津乐道。 而我浅薄的理解则是，它更多地是一种 自证预言（Self-fulfilling prophecy）。正因为刻意的自我暗示所带来的正反馈回路，我们才有可能开拓一条之后看来自洽和谐不误入歧途的人生道路。 除了在心理上自我暗示以外，我们还可以做的是在阶段性回顾时多去思考自己的不同经历之间有什么联系。 改变，从今天开始上文一些内容可能过于抽象，所以在结尾我会给出一些具体可行的建议。如果您认同本文的部分内容却担心自己无法迈出改变的第一步，从下面挑一两件事先尝试做起来吧！ 写下当前阶段困惑你的问题，找三个合适的对象（学长、导师、前辈等）进行交流。 思考自己目前在学习的一件新事物，你是否已经建立了有效的反馈回路？ 尝试番茄工作法并确定它是否适合自己。 为自己设定未来一年内和未来三年内想要达到的目标各三个（包括不能按时达成目标时的 Plan B）。 将自己未来一周内要完成的事项列表，选择一种管理工具（可以从纸笔开始！）尝试规划和追踪进度。 找三本自己领域内公认的经典著作，读完并做详细的笔记。 选择手机上一个消耗你的时间较多且不重要的 App，卸载它！ Buy me an Asahi beer :) Donate Alipay 创造者和他们的工具——利器社群计划 Annoucing New Blog | 博客迁移公告"
