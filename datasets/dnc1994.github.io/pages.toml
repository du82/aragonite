["https://dnc1994.github.io/2018/10/notes-the-effective-engineer"]
title = "[Notes] The Effective Engineer | Wille"
description = "This blog has been migrated to linghao.io. Read this post on my new blog: https://linghao.io/notes/the-effective-engineer/. Starting from “time is our most limited resource”, The Effective Engineer by"
full_description = "[Notes] The Effective Engineer Posted on 2018-10-16 | In Notes | Reading time ≈ 40 This blog has been migrated to linghao.io. Read this post on my new blog: https://linghao.io/notes/the-effective-engineer/. Starting from “time is our most limited resource”, The Effective Engineer by Edmond Lau first establishes the methodology of using “leverage” to guide our actions. The book then, from multiple angles, discusses how to become a more effective engineer by focusing on high-leverage activities that produce a disproportionately high impact for a relatively small time investment. Ranging from adopting mindsets, actual execution, to building long-term values, topics involved are complemented with ample examples within the industry. Much content are easily generalizable to areas beyond software engineering as well. A must-read for software engineers. This post is a refined version of the notes I took while reading this book. Part I: Adopt the Right Mindsets1. Focus on High-Leverage ActivitiesUse leverage to measure your engineering effectivenessLeverage = Impact Produced / Time Invested Leverage is critical because time is your most limited resource. Pareto principle: 80% impact from 20% work – high-leverage activities that produce a disproportionately high impact for a relatively small time investment. Systematically increase the leverage of your timeThree ways to increase your leverage: Reducing time Increasing output Shifting to higher-leverage activities Examples: Attending meetings Defaulting to a half-hour meeting instead of a one-hour meeting Prepare an agenda and a set of goals Replace the in-person meeting with email discussion if possible Developing a customer-facing feature Automate parts of the development / testing process Prioritize tasks Use knowledge about customers to understand whether there’s another feature you could be working on Fixing bottlenecks in a web application Learn to effectively use a profiling tool Measure both performance and visit frequency so you can address the bottlenecks that affect the most traffic first Design performant software from the outset so that speed is prioritized as a feature instead of a bug to be fixed Focus your effort on leverage pointsDon’t confuse high-leverage activities with easy wins. Many high-leverage activities require consistent applications of effort over long time periods to achieve high impact. Find leverage points, establish high-leverage habits. 2. Optimize for LearningAdopt a growth mindset Fixed mindset: humans are born with a predetermined amount of intelligence Growth mindset: humans can cultivate and grow their intelligence and skills through effort Own your story. Instead of apologizing for where your resume doesn’t line up, take control of the parts that are within your sphere of influence. Invest in your learning rateLessons from compound interest: Compounding leads to an exponential growth curve The earlier compounding starts, the sooner you hit the region of rapid growth and the faster you can reap its benefits Even small deltas in the interest rate can make massive differences in the long run When companies pay you for cushy and unchallenging 9-to-5 jobs, what they are actually doing is paying you to accept a much lower intellectual growth rate. Treat yourself like a startup. Startups initially prioritize learning over profitability to increase their chances of success. You would rather invest your financial assets in accounts that pay high interest rates, not low ones. Why would you treat your time – your most limited asset – any differently? Seek work environments conducive to learningOne of the most powerful leverage points for increasing our learning rate is our choice of work environment – because we spend so much time at work. Factors to consider: Fast growth. When the number of problems to solve exceeds available resources, there are ample opportunities to make a big impact. A lack of growth, on the other hand, leads to stagnation and politics. Training. Openness. Pace. People. Autonomy. The freedom to choose what to work on and how to do it drives our ability to learn. Capitalize on opportunities on the job to develop new skillsBorrow the idea of 20% time from Google, but take it in one- or two-hour chunks each day, because you can then make a daily habit out of improving your skills. Gain experience in adjacent disciplines: For product engineers: product management, user research, backend engineering For infrastructure engineers: machine learning, database internals, web development For growth engineers: data science, marketing, behavioral psychology. Tips: Study code for core abstractions written by the best engineers at your company. Write more code. Go through any technical, educational material available internally. Master the programming language that you use. Send your code reviews to the harshest critics. Enroll in classes on areas where you want to improve. Participate in design discussions of projects you’re interested in. Work on a diversity of projects. Interleaving different projects can tech you what problems are common across projects and what might just be artifacts of your current ones. Make sure you’re on a team with at least a few senior engineers whom you can learn from. Jump fearlessly into code you don’t know. Highly correlated to engineering success. Always be learning, even when outside of the workplaceSome skills we learn could be cross-functional and help our engineering work. For example, increasing your comfort level in conversing with strangers can help with meeting and interviewing. Other skills might not translate directly into engineering benefits, but the practice of adopting a growth mindset toward them makes us better learners and more willing to stretch beyond our comfort zone. Continual learning is inextricably linked with increased happiness. Tips: Learn new programming languages and frameworks. Invest in skills that are in high demand. Read books. Join a discussion group. Attend talks, conferences, and meetups. Build and maintain a strong network of relationships. Follow bloggers who teach. Write to teach – Feynman’s technique. Tinker on side projects. Creativity stems from combining existing and often disparate ideas in new ways. Pursue what you love. 3. Prioritize RegularlyTrack and review to-dos in a single, easily accessible listThe human brain is optimized for processing and not for storage. The average brain can actively hold on 7 +/- 2 items. Expending effort on remembering things reduces our attention, impairs our decision-making abilities, and even hurts our physical performance. To-do lists should be 1) a canonical representation of our work and 2) easily accessible. Instead of accurately computing the leverage of each task (which is incredibly difficult), compile a small number of goals to complete. Pick initial tasks towards these goals, and then make a pairwise comparison between what you’re currently doing and what else is on your to-do list. Continuously shift your top priorities towards the ones with the highest leverage. Focus on what directly produces valueActivity is not necessarily production. Activities like writing status reports, organizing things, creating organizational systems, recording things multiple times, going to meetings, replying to low-priority communications only have a weak and indirect connection to creating value. Once you’re producing results, few people will complain about declined meetings, slow email response times, or even non-urgent bugs not being fixed. Defer and ignore tasks that don’t directly produce value. Focus on the important and non-urgent Urgency should not be confused with importance. Put first things first. Label to-dos from 1 to 4 based on which quadrant the activity fall under. Oftentimes, the root cause of a Quadrant 1 problem is an underinvestment in a Quadrant 2 activity. The act of prioritization is itself a Quadrant 2 activity, whose important often gets overlooked because it’s rarely urgent. Prioritize the act of prioritization. Protect your scheduleEngineers need longer and more contiguous blocks of time to be productive than many other professionals. Managers traditionally organize their time into one-hour blocks. Makers generally prefer to use time in units of half a day at least. Tips: Schedule necessary meetings back-to-back at the beginning or end of your work day. Defer helping others when in the middle of a focused activity. Block off hours on your calendar or schedule days like “no meeting Wednesdays”. Limit the amount of work in progressIncreasing work linearly increases the likelihood of failure exponentially. Constant context switching hinders deep engagement in any one activity and reduces our overall chance of success. Fight procrastination with if-then plansMany people do not have sufficient motivation to summon the activation energy required to start a difficult task. Planning creates a link between the situation or cue and the behavior that you should follow, which follows automatically without any conscious intent when the cue triggers. Subconscious followup is important because procrastination primarily stems from a reluctance to expand the initial activation energy on a task. This reluctance leads us to rationalize why it might be better to do something easier or more enjoyable, even if it has lower leverage. When we’re in the moment, the short-term value that we get from procrastinating can often dominate our decision-making process. But when we make if-then plans and decide what to do ahead of time, we’re more likely to consider the long-term benefits associated with a task. If-then planning also can help fill the small gaps in our schedule. Make prioritization a habitTake general principles and iteratively adapt your own prioritization system. The actual mechanics of how your review your priorities matter less than adopting the habit of doing it. Part II: Execute, Execute, Execute4. Invest in Iteration SpeedMove fast to learn fastInvesting in iteration speed is a high-leverage decision. The faster you can iterate, the more you can learn about what works and what doesn’t work. You can build more things and try out more ideas. Not every change will produce positive value and growth. But with each iteration, you get a better sense of which changes will point you in the right direction, making your future efforts much more effective. Invest in time-saving toolsAlmost all successful people write a lot of tools. Faster tools get used more often, therefore saving even more time. Faster tools can enable new development workflows that previously weren’t possible. Examples: Continuous integration / deployment Incremental compilation Interactive programming, REPL Hot code reloads Sometimes, the time-saving tool that you built might be objectively superior to the existing one, but the switching costs discourage other engineers from actually changing their workflow and learning your tools. It’s worth investing the additional effort to lower the switching cost and to find a smoother way to integrate the tool into existing workflows. One side benefit of proving to people that your tool saves times is that it also earns you leeway with your manager and your peers to explore more ideas in the future. Shorten your debugging and validation loopsAs engineers, we can shortcut around normal system behaviors and user interactions when we’re testing your products, extending the concept of a minimal reproducible test case. When you’re fully engaged with a bug you’re testing or a new feature you’re building, the last thing you want to do is to add more work. When you’re already using a workflow that works, albeit with a few extra steps, it’s easy to get complacent and not expend the mental cycles on devising a shorter one. Don’t fall into this trap! Effective engineers have an obsessive ability to create tight feedback loops for what they’re testing. Master your programming environmentGiven how much time we spend in our programming environments, the more efficient we can become, the more effective we will be as engineers. Mastery is a process, not a event. As you get more comfortable, the time savings will start to build. Tips: Get proficient with your favorite text editor or IDE. Learn at least one productive, high-level programming language. Each minute spent writing boilerplate code for a less productive language is a minute not spent tackling the meatier aspects of a problem. Get familiar with UNIX (or Windows) shell commands. Prefer the keyboard over the mouse. Automate your manual workflows. Test out ideas on an interactive interpreter. Make it fast and easy to run just the unit tests associated with your current changes. Don’t ignore non-engineering bottlenecksOne common type of bottleneck is dependency on other people. Oftentimes the cause is misalignment of priorities rather than negative intentions. The sooner you acknowledge that you need to personally address this bottleneck, the more likely you’ll be able to either adapt your goals or establish consensus on the functionality’s priority. Project fail from under-communicating, not over-communicating. Ask for updates and commitments from team members at meetings or daily stand-ups. Periodically check in with that product manager to make sure what you need hasn’t gotten dropped. Follow up with written communication on key action items and dates that were decided in-person. Even if resource constraints preclude the dependency that you want from being delivered any sooner, clarifying priorities and expectations enables you to plan ahead and work through alternatives. Another common type of bottleneck is obtaining approval from a key decision maker. This kind of bottlenecks generally fall outside of an engineer’s control. Prioritize building prototypes, collecting early data, conducting user studies and so on to get preliminary project approval. Don’t defer approvals until the end. A third type of bottleneck is the review processes that accompany any project launch. Expend slightly more effort in coordination and communication. Premature optimization is the root of all evil. Find out the biggest bottlenecks and optimize them. 5. Measure What You Want to ImproveUse metrics to drive progressIf you can’t measure it, you can’t improve it. Good metrics accomplish a number of goals: They help you focus on the right things. When visualized over time, they help guard against future regressions. Engineers know the value of writing a regression test while fixing bugs: it confirms that a patch actually fixes a bug and detects if the bug re-surfaces in the future. Good metrics play a similar role, but on a system-wide scale. They can drive forward progress. Performance ratcheting: Any new change that would push latency or other key indicators past the ratchet can’t get deployed until it’s optimized, or until some other feature is improved by a counterbalancing amount. They let you meas"
