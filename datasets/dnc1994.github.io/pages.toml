title = "【翻译】Evangelion角色分析：明日香 | Wille"
description = "【高能预警：巨量图片】 准备好了伙计们，是时候来一篇关于惣流·明日香·兰格雷的重量级分析了。"
full_description = "【翻译】Evangelion角色分析：明日香 Posted on 2015-01-26 | In ACG | Reading time ≈ 79 【高能预警：巨量图片】 准备好了伙计们，是时候来一篇关于惣流·明日香·兰格雷的重量级分析了。 原文地址 前言 (可以跳过这一部分) (For GC: English version below) 这是一篇在去年就应该完成了的翻译稿。当时我从EvaGeeks论坛上看到这篇转帖，当即就着了迷，马上到Tumblr上关注了原作者GC。从去年夏天GC授权我进行翻译开始，我一直在犯拖延症。明日香是我最爱的动画角色，现在我终于可以将这篇对她的深度分析展现给大家。 在翻译GC的文章时，我遵循的是自己的一套方法。为了最大限度地保留原意，我在不影响理解和不显得别扭的情况下都采用了直译。同时为了追求语言的流畅度，我从忙碌的日常中抽出尽可能多的时间来斟酌、精炼词句，尽量使用地道的中文表达。但还是不可避免地会出现词不达意的情况。还请原谅。 这篇翻译离完美还很远。现在的版本要我说才刚刚达到了能看懂并理解原文主要内容的水平。文中有很多问题，我之后会提到一些。如果有人通过读我的翻译而有所收获，我强烈建议你们去读GC的原文，这样能获得更多有趣的细节。虽然GC的母语并不是英语，但也比我强出许多。 括号里的内容大多是GC原文中的注释。但必要时我也会将自己的译注放在括号里。这只是为了帮助读者更好地理解GC的想法，所以我也不费心去区分这两种注释了。 在不少地方因为看不懂GC的用语，我只能直译过来。比如我不知道「refused love interest archetype」是什么意思。虽然GC说我可以随时提有关翻译的问题，但主要是我自己没有这个时间去做这件事。所以很遗憾那些直译暂时只能就这样放在那里。我打算之后抽空把不明白该怎么翻的地方整理出来发给GC，再根据回复来修改我的翻译。 在翻译过程中，我重温了几集Evangelion的旧TV版，发现有些地方GC所提到的点是根据英语字幕而来的，但我所看到的中文字幕以及我听到的日语似乎与之不大一样。我对自己的日语听力并不是100%确信，但我查了其中一些的原文从而知道英文字幕并不准确。当然，字幕翻译的准确与否大多没有太大影响，因为很多时候不同的翻译基本是同一个意思。但作为一个完美主义者(虽然我没有戏剧性人格障碍)，我决定找时间重看整个旧TV版，并将所有的差异在注释中注明。 现在文中所有的截图都是从GC的原文中复制过来的，所以里面的字幕都是英文的。这主要是因为我没时间去把图重新截一遍。我本来想在每个图下面放上图中字幕的中文翻译，但后来一想我可以在重看有中文字幕的旧TV版时进行截图，这样可以事半功倍。所以这件事情也要之后有空再做了。 最后我想谈一点过度解读的问题。很多人会说Evangelion只是一部商业动画，所以我们的分析都是在过度挖掘一些原本就不存在的东西。我不同意这个观点。在我看来，当作品完成以后，对它的解读就跟作品的制作者的本意无关了。而且，谁说制作人员并没打算让Evangelion被解读得那么深？他们明显把许多值得深入分析的元素放在了一起，这些元素可能并不是原创的，但它们在一起表现出了一个晦涩而又集中的主题，这是极具独创性的。GC用的类似于精神分析(如果不是请纠正)的分析手法是完全合理的，因为Evangelion中出现的大量心理剧场景是不可否认的。(有人会说出现这样的场景是因为GAINAX没有预算了。好吧，但许多元素在TV中出现得很早，而且庵野秀明及其他一些主要工作人员的采访记录也可以证明他们的确是打算把Evangelion做成一部有深度的动画。) 最后我要再次感谢GC同意我翻译这篇文章。我期待着看到GC的更多文章，也打算在空闲时能翻译更多GC的文章。希望大家读得开心！ Preface (You can skip this part if you like) This is a piece of translation that was supposed to be finished last year. I saw the repost from the EvaGeeks Forum and was fascinated by its cleverness. Then I followed the author, GC, on Tumblr. I’ve been procrastinating again and again since GC authorized me to translate the post into Chinese last summer. Now finally I can present to you this translated in-depth analysis of my favorite anime character Asuka. I practiced my own methodology while translating GC’s post. To preserve as much information as possible, I followed the principle of word-to-word translation as long as it doesn’t prevent my translation from being understood by Chinese readers or doesn’t sound too weird. Also I have tried my best(in terms of time I spent to refine my work in my already busy routine) to use native Chinese phrases and slangs for language fluency. Still I couldn’t avoid the occurrence of not delivering the accurate meaning. Please forgive me. My translation is far from perfect. The current version is only, as I would phrase it, legible and understandable in terms of the main idea. It’s flawed in many ways, some of which I’ll mention below. In fact I strongly encourage anybody who enjoys reading this to read GC’s original post in English. You’ll definitely get more details. Although neither of GC and me uses English as the first language, GC’s English is surely way better than mine. Those texts between parentheses are mostly GC’s original comments. But as the translator, I put my words in parentheses too when necessary. I don’t bother distinguishing them since my intent is to help readers better understand GC’s brilliant ideas. There are many places where I don’t understand GC’s words at all that I could only metaphrase them. For instance I don’t know what refused love interest archetype is. Although GC said I could ask him for the language he used anytime, it was myself that didn’t have time to do that. So I’m sorry that for now I have to publish my work with all that. Hopefully I’ll sort out a list of not properly translated languages and send that to GC. And I’ll refine my work again based on GC’s explanations. As I translated, I rewatched several episodes of NGE and found that there are several places where GC took a point from English subtitle that differs from both Chinese subtitle and my understanding of Japanese dubbing. I’m not 100% confident about my Japanese listening but some of them are confirmed by looking up the original script. Of course though, most of them don’t matter much as different translations imply almost the same meaning. But as a perfectionist(though I don’t have HPD), I decided to rewatch the whole NGE and make sure that each difference is noted in comments. For now all the screenshots are copied from GC’s original post, which explains why they are English-subtitled. I did that because I don’t have enough time to recapture them all from my copy of NGE. At first I thought I’d just put the translation of subtitles under each screenshot. But then I realized that I could just capture screenshots as I rewatch NGE with Chinese subtitles. This reduces total work to be done, doesn’t it? So, another to-do item on my leisure time. Finally I would like to talk a little bit about the problem of over-interpretation. Many would say that Evangelion is only a commercial anime and our analyses are over-digging something not intended to be there. I couldn’t agree to that. IMHO as soon as the work is done and published, no interpretation should depend on makers’ intent. And who’s to say that the staff of Evangelion didn’t meant it to be analyzed that much when they apparently put elements worth in-depth analyses with ingenuity in ways of combining non-original pieces together to present a obscurely strong theme? GC’s psychoanalysis-like approach(correct me if I’m wrong) is totally legit because no one could ignore the large portion of psychodrama-like scenes in Evangelion.(Some would argue that the reason for those scenes was GAINAX turning out of budget. Well, many pieces emerged very early in the series. Besides interviews with Anno and other major staff can be found, which demonstrate the point that Evangelion was intended to be an in-depth anime.) I’d like to thank GC again for authorizing me to do this translation. I look forward to more analyses from GC and doing more translations in my leisure time. Enjoy reading! 准备好了伙计们，是时候来一篇关于惣流·明日香·兰格雷的重量级分析了。或者说，让我们来分析是绝大多数随流的爱好者文化是如何没能正确地理解她的。 主要内容： 驾驶EVA之于明日香的重要性 明日香与加持、真嗣和丽的关系 《End of Evangelion》中出现的「地狱厨房」(Hell Kitchen)场景的含义 戏剧化人格障碍(histrionic personality disorder)的一种解释 许多其他内容！ 高能预警：本文将提及自杀、死亡恐惧(thanatophobia)、精神疾病、强奸、月经、裸体。基本上也就是任何Evangelion相关的东西所能触发的预警了。这篇文章将会很长，大约两万四千字。如果有任何疏漏，请联系我。 请注意在本文中我将讨论局限于来自TV动画的惣流·明日香·兰格雷(惣流·アスカ·ラングレー)，而不涉及到来自新剧场版系列的式波·明日香·兰格雷(式波·アスカ·ラングレー)。这是因为式波是一个与惣流完完全全不同的角色，她们之间的相像仅仅是外表和浅层人格上的。 作为接触实验(Contact Experiments)的一部分，明日香的母亲恭子被剥离了她部分的灵魂，尤其是她母性的那一部分。与唯被EVA完全吸收的惨剧不同，NERV认为他们可以在保持恭子存活的同时启动EVA。毕竟最初他们也并不打算成为彻头彻尾的怪物。 与从一开始就被摆明着被挑选出来的丽和真嗣不同，明日香是第一个非碇源渡系的，从众多候选中脱颖而出的驾驶员。注意，正如剑介在第四话中指出，真嗣所在的学校里每个人都失去了母亲。这是因为NERV收割了他们所有人的母亲的灵魂，以便应对可能需要在他们中间产生驾驶员的情况。明日香显然天资异禀，而且她也打算要好好利用自己的天赋大干一场。 (顺便，零号机和二号机是基于亚当(Adam)而制造的，它们拥有的灵魂并不完整。这一事实解释了为何真嗣的同步率得分能够快速地上升。实际上的最强驾驶员的确是明日香，在《End of Evangelion》中最后达到完全同步之前与量产机的激烈战斗靠的都是她自己的力量。) 不幸的是，由于灵魂被部分剥离，恭子的精神开始失常。她开始对着一个人偶说话，并用把它当成明日香去照顾。同时，明日香的父亲与恭子的医生开始了婚外情，最后他也娶了那位医生。 当明日香成为第二适格者时，她处于一种极度渴望母爱的状态。只要母亲能再看着她，她愿意打破一切规则，甚至毁灭世界。她想着，一次就好，只能要再看她一眼就好。 母亲的精神失常对年幼的明日香造成了极大的影响。这首先使得她对人偶嗤之以鼻；更重要的是，这使得她极度渴望他人的关注，极度需求自我隔绝，极度想要证明自己的独立。她变得再也不想依靠任何人，再也不会再为了任何人而试图杀死自己。 小结一下：因为她的母亲将注意力都放在人偶而不是她身上，明日香变得既渴望他人的关注却又对再度依赖他人感到恐惧。结果就是她拼尽一切努力想要变得像一个大人。 在那个混乱的社会里，明日香认为成长对于女性来说就是被人看作是一个大人。这一观念由于她将全部的人生价值都寄托在驾驶EVA上而得以内化。事实上，戴在头上A10神经连接器是她的经典形象的一部分。这么说是因为，在明日香版本的「裸体出浴」场景中，明显可以看到她在洗澡时还戴着连接器。而真嗣和丽，或是在动画中短暂出场的其他两名驾驶员，都没有这样的举动。只有明日香这么做了。虽然真嗣和丽也将他们的人生价值寄托在驾驶EVA上，这种寄托的强度远没有明日香那样强。 现在我要破除一个常见的误解。不少动画爱好者将明日香「诊断」为自恋，但我认为她并不自恋。恰恰相反，明日香遭受的是戏剧化人格障碍的困扰。而从根源上来说，这与依赖性人格障碍更为相像。加持是具有戏剧化人格障碍的另一个例子，不过他的心智很正常。虽然他的性格中有着许多的戏剧化元素，但他并没有像明日香那样表现出戏剧化人格障碍。 让我们来粗略地看一看与戏剧化人格障碍相关的症状和行为。因为我们只需要简单的总览(毕竟我们并不是真的要去诊断一个虚拟角色的人格)，这里就直接引用维基百科了： 煽动性(挑逗性)的行为 将与他人的关系看得过度亲密 寻求关注 易受影响 语言表达中充斥着强烈的个人表现欲、缺少细节 情绪不稳定、波动剧烈 化妆、把用外表用于吸引关注 情绪夸张、戏剧化 我们可以用「PRAISE ME」(「夸夸我」，是上述各项英文首字母连写)来记忆这些与戏剧化人格障碍有关的常见元素。总结一下也就是说，有自恋型人格障碍的人是发自内心地相信自己比别人要好，而有戏剧化人格障碍的人却只是将自己表现得比别人要好，同时在内心深处对这么做的自己感到非常厌恶。 明日香毫不掩饰地称自己是最强的驾驶员，并对自己的杰出引以为傲。同样地，她对于自己是学校里最受欢迎的女孩也感到非常自豪，特别是从她跟真嗣讲话时提到自己最受欢迎就可以看出。然而，正如我们所知道的，明日香其实非常憎恨自己，这样的憎恨反复地出现，尤其是在故事的后半部分。但在我们开始对她的戏剧化人格障碍的具体分析之前，我们先回到她的背景故事。 在恭子开始接触实验之前，她就没有对自己的孩子有过多少的关注。跟律子和美里的母亲一样，她抚养出了一个渴望关注的孩子。 母亲恭子因为失去部分的灵魂而精神失常，父亲也出了轨，最后还娶了恭子的医生。纵使明日香在看着母亲抱紧怀中的人偶时流露出的目光是如此凶恶和愤怒，她无疑还是很高兴能见到自己的母亲的，并且不断地试图通过表现来获取母亲的关注。 之后，明日香成为了驾驶员，她把这件事告诉了母亲。然而此时她的母亲正打算自杀。在令人不寒而栗的最后时刻，我们看到恭子请求明日香(人偶)跟她一起去死。所有目睹过这一幕的人都不可能忘记明日香是怎么回答的： 只要母亲不抛弃她，她甚至愿意跟母亲一起去死。最后明日香并没有自杀，但这段经历震撼到了她内心的深处：她发现自己完全愿意为他人而死。在葬礼上，明日香告诉自己，她会成为一个大人，从而可以不用再依靠任何人。在童年时期被长期忽略的确是戏剧化人格障碍的的理论成因之一。为了补偿童年时没能得到的关注，明日香说她要成为一个独立的大人，然而她却选择了通过外部认同(external validation)来成为大人。(EVA的一个主题就是，外部认同对于获得属于自己的幸福是无济于事的；认同和爱只能在自己的内心逐渐建筑起来，伴随着「一个人要是都不爱自己，怎么可能学会去爱别人呢？」的想法，等等。不过这些就是下一次的另一篇博客的主题了。) 她的这种想法存在两方面的问题：首先，她认为成人就仅仅是性成熟。明日香迫不及待地想要长大，而这就是问题的症结，尤其是从她与加持和真嗣的关系上来说。她没有耐心地想通过她身边的男性的认同来证明自己的成长。因为这是社会所教给她的，也是父亲抛弃母亲再婚的经历所教给她的。(我个人认为明日香是个无浪漫者。) 在来到日本之前，明日香和加持在船上有一次很能说明问题的对话。从时间上来说，这正好发生在第八话之前。明日香先是谈到美里，说自己不是特别喜欢她。(这在之后很重要，关系到她和美里的关系，以及她与自己的关系。)加持告诉明日香，她可能会在日本交上很多新男友，并且第三适格者(真嗣)是个男生。这就暗示了一些很有趣的事情：明日香在德国曾经有过男朋友。并且根据加持所说的，她有过许多男朋友，从一个换到另一个，希望从他们身上获得认同。但当她发现这并不能使她更快乐时，她就变得越来越失望和挫败。 注意：加持和我在这里所说的，指的并不是真正意义上的「男朋友」，而是指当明日香来到第三新东京市时那些对她有好感的男孩。即使在践踏他们并表现得高高在上的同时，她还是能通过对自己有好感的绝对人数而获得认同，但显然他们中没有一个能让她真正地感到被认同。不要忘记明日香是从德国唯一的驾驶员变成了甚至在日本都排不上第一的驾驶员，考虑一下这个变化会如何影响她所受到的关注等。之后我再提到「男朋友」时，请记住：我指的是那些她毫不费力就能交上的男性朋友。考虑实际的话，要是有任何人企图跟她约会，最后就会变得跟班长光拜托她跟一位朋友约会时那样——明日香中途感到无趣逃走，留下被抛弃的男孩一个人困在过山车上。 事实上这是很重要的一点：正如美里通过性爱满足自己，明日香也通过某种方式来填充自己的空虚。然而，美里和明日香这种「用获得的欢愉来代替真正的幸福」的做法背后的逻辑却是大相庭径。美里狂野地做爱，是因为正如她自己所解释的，被人所需要的感觉很棒，即使只是肉体被需要。而明日香则是因为她自身需要被认同。她并不想要被人所「需要」。她所想要的，本质上就是别人能关注她，而她不需要去在意他们。她想要被人所「需要」，并不是在与美里一样(真正的需要)的那种意义上，而是在一种使别人关心她而她不需要反过来也「需要」别人的意义上。美里想要的是双向的需要，而当她发现自己无法拥有这种双向需要时，她就让步于在肉体上被需要。明日香想要的是单向的需要，而这种需要没法使她高兴，因为事实上这种需要是不存在的。她没有办法应付这种情况。 注意：当提及美里的性生活时，我指的是从明日香的视角出发所看到的。从美里与加持的谈话中可以知道，她其实并没有狂野地做爱。但明日香却认为她做了(并且直到人类补完都这么认为)。 其他的一些EVA分析者已经指出了在EVA中反复出现的三位一体的象征手法，比如MAGI超级计算机以及加持-源堂-冬月三人。在这里我不会过度深究，但总的来说，加持代表着年轻而充满阳刚之气的男性；源堂着代表残酷而好战的男性；冬月着代表年迈而充满智慧的男性。这类似于莎士比亚写的《人生的七个阶段(Seven Stages of Man)》那首诗，同样这也是下次博文的话题了。这其中最关键的部分是加持代表着年轻而阳刚的男性，他显然是三人中最性感的。与简单随意地就能圈牢的，很有可能会对任何人投怀送抱那些男朋友不同，加持是一个成年人。他喝酒，抽烟，有着丰富的性爱，并且如果他真的对她有意，她无疑就能成为真正的大人。 所以，很不当地，明日香试图引诱他。 当然，他拒绝了她的探求，因为他不是她的法定监护人(他从来没能培养出一段积极的关系)，而且他不是恋童癖(pedophile)也没有少年爱(hebephilia)。不幸的是，这对明日香来说并不单纯只是拒绝而已。这是对明日香作为成年人的地位的否定。加持对她说，「你还是个孩子。」 对明日香来说，没有什么能比被叫作是一个孩子更能伤到她的了。因为正是她还是一个孩子这一事实，差点杀死她自己，使她精神失常到答应跟母亲一起去死。她无法忍受当一个需要依靠他人的孩子这样的想法。她必须马上长大，不是么？ 重申一下：明日香并不是爱着加持。或许她对加持是有类似于一见倾心的迷恋，就像年轻的女孩子对有吸引力且比她们小的男孩子所产生的那种迷恋一样。(可以认为，与真嗣相比，她对加持更有那种感觉) 我想指出她说这话时伴随着的彻彻底底的孩子气。「接吻，甚至那之后的事情。」我能拿到的所有字幕上基本都是这句话的不同翻法。(为了能好好地分析EVA，我配着几套不同的字幕看了很多遍，包括官方英文字幕、蹩脚的直翻、爱好者们制作的字幕等，从而在某个字幕可能出错的地方我能知道总体上应该是什么感觉。)她甚至都不敢谈及性爱。她其实根本就没有准备好跟人做爱。 这一幕的构图很有意思，因为我们能从正面看到明日香的乳沟。明日香在EVA的三位女主角中胸围是最小的，但在一些其他场景中，比如不可摧毁的耶利哥之墙(Wall of Jericho，指第九话中明日香关上的隔门)那一幕，她的胸看起来大了一些。但从另一方面讲，在这一幕中她看起来几乎就是平胸。素白胸罩的使用也进一步地印证了她不是个大人这一点。她还是个孩子，还几乎没有从童年中成长分毫，她试图成为一个大人，但还为时太早。她想要成为一个大人从而能够不再依赖任何人，但当她不被认同而是被拒绝时，她又回到了最初的基本需求： 是的。看着她。看着她，因为她的母亲从没看过她，她的父亲也从没看过她，因为她的母亲用一个人偶替代了她，因为到最后她感到自己对别人来说什么都不是。她因此而恨着每个人。她恨其他人类。当然，她最恨的还是自己。 所以设定就是这样：明日香寻找着对自己成为大人的认同，从而能够变得独立而不用再依靠任何人。这是她所反复告诉自己的。而在现实中，她渴望关注。这就是她憎恨自己的原因。她固有的对人类的憎恨和对孤立的渴望，与她由于童年从未获得过关注而产生的能够有人看着她的强烈需要，构成了一对矛盾。 加持拒绝了她。不过这时新选手出场了：第三适格者，真嗣。真嗣是她身边唯一一个同为驾驶员的男孩，而且他作为驾驶员而言很优秀。当真正的大人加持让她失望时，她转而试图引诱真嗣，因为他是一个很好的替代品(从他是人类的救世主等意义上来说)。 说到真嗣，该谈谈明日香在日本的经历了。 在第九话的开头，明日香最终抵达日本时，我们看到了学生们以一种很有意思的，预言性的方式谈论着她： 对我来说这一幕很明显是在暗示明日香无疑会表现得让传言成真：她想让别人以为她很早熟。要知道这可是在我们产生对她的第一印象之前，那么故事的作者早早地将这一预设抛给我们就是一件很有意思的事情了。当然，其他的学生很有力地回应说，她可能只是因为被伤透了心才来到这里的。 起初，真嗣是不大乐意见到明日香的。毕竟她有点喜欢欺负他。而另一方面，明日香显然认为自己美丽动人(大部分的学生都会同意)，看到真嗣忐忑不安，立马就开始挖苦伤害他。好戏开场了。 当然，这里的重点在于，明日香会与真嗣交流，是因为真嗣是第三适格者；同样地，明日香与丽交流，仅仅是因为丽是第一适格者罢了。 之后在公寓时，明日香显然深信真嗣将会被当做垃圾而抛弃掉。她都没有怎么再去考量真嗣，而是不断说着他将会如何被取代。这当然是因为她完全没有把他看在眼里，不想为他浪费时间。 借此机会我要提醒读者，加持才是明日香用她那颗小小的少女心去真正在意的男人。 在这里我们还能看到明日香很有意思的一面。 她吐槽了日本人不在门上装锁，并且也没有办法能隔开她和真嗣。基本上随便是谁只要愿意都可以走过这扇门。 现在让我们花点时间来回想一下与鸟天使(Arael)的战斗。明日香哀求使徒不要再窥探和挖掘她精神的更深处。她只想让别人看到她的外壳，看到那个「美丽动人的明日香」，那个完美的明日香。在这一话之后的部分，明日香抱怨她在日本的第一次战斗让她显得「不酷」了。她沉溺于只将自己最好的一面展示给别人看。所以，仅仅是允许别人走进房间的想法就使她恐惧而愤怒。她感到没有隐私。在德国生活时，明日香可以把内心封闭起来，但到了日本，她没法再这么做了。 嘿，记得我说过明日香的胸有点小吗？仔细看看上面这张截图，再跟在船上的那一幕对比一下，你就会知道我说的是什么意思。 这一段里明日香在向真嗣提出挑战。因为像在德国时那样，她打算利用当地的男孩子来认同自己。现在既然美里已经明确了真嗣不会被换掉，明日香突然就对他有了兴趣，因为他也一样是EVA驾驶员，还是人类的救世主。他的存在是有一定分量的。 所以她就提出了「挑战」。顺便，不可摧毁的耶利哥之墙倒塌了。她试图让真嗣想要她，试图让真嗣渴求她关注她，好让她可以嘲笑他无视他，从而获得认同。跟明日香最初的行动是羞辱真嗣一样，现在她试图创造出一段靠情感负担而使自己处于上位的关系。 当真嗣真的无所动作时，她决定让事情进一步发展。她在真嗣身边躺了下来，让自己的胸部能被整个看到。这下真嗣必须有所反应了。更不用提她当时还在做着噩梦。 不管怎样，她睡着了。真嗣惊慌着，眼睛盯在她的胸上(真嗣被明日香吸引从本质上来讲完全或者说几乎是出于性本能，讲到《End of Evangelion》等其他内容时我们就会明白)。正如明日香期待的那样，他决定上钩了。他准备亲吻她，然而在静谧的夜里，明日香却流露出了她从不想表现在外的真实自我： 尽管成为一个大人是明日香唯一想要的，但她无疑还是个孩子。她等不及想要长大(在上面的截图中你也可以清楚地看到她的胸)，但却无法逃避对他人的依赖程度之高以及对他人关注的需求，因为她的母亲没有给予她足够的关注。这在她的心上留下了深深的伤痕。 她需要关注，需要成为绝对的第一名，这在接下的几话里驱使着她。在第九话中，她做到了与真嗣「同步」，说明她的确有这个能力，但两人还是没能走出之前发生的事(因为一个人可以在心智无法正常运作的同时从外部看上去一切正常，正如这部作品里绝大多数成年人一样)。在第十话中，她不能忍受真嗣看着丽的泳装而没有注意到她，所以她不仅借热膨胀调侃自己的胸部来挑逗真嗣，还回头喊他看自己的背翻式入水。之后，她宁愿死在火山里也不愿意放弃任务。第十一话中，她甚至为真嗣挡下一击，因为她不能忍受自己没能成为第一，没能成为他人依靠和关注的对象(与此类似地，她在基地停电时也当起了小组的领队)，等等。 最后，那个臭名昭著的真香之吻来了。这一吻为许多真香粉所欢呼，他们将其看作是真香恋的有力证明。那我们就来看看吧。 在那一话的开头，明日香又给加持打了电话，这次她在电话里装作自己正在受到性侵犯，以图让加持在意。如果这都算不上是极度的绝望，我也不知道怎样才是了。之后她跟一个男孩出去约会，但她显然中途就跑出来了，因为她说那个男孩很无聊(意思就是在他心里比不上真嗣或是「认同大师」加持)。 美里跟加持出去了。严格来说，美里是跟加持和律子一起出去的，但明日香自然就把这当做是美里(一个她一并不完全喜欢的女人)跟加持的一场约会。显然她对事情的发展感到很不舒服，因为美里作为一个成年人正在获得认同，而加持却将她弃于尘土中。 这时，明日香转而寻求她生命中的另一个男孩，一个她最容易得到身体和认同的男孩：真嗣。她问真嗣他觉得美里和加持在干什么。当真嗣想要避开这个话题时，她又问他有没有接过吻。真嗣回答说没有，她就逼迫他跟自己接吻。但是请注意她脸上的表情：当她要求真嗣跟他接吻时，她看起来既不高兴也不满意，而不如说是一副郁郁不乐、一厢情愿的表情。她满脑子想的都是加持的事情以及如何获得认同。 注意：明日香也是一个处于青春期的少女，而且从我的分析看来，她在这里可能并不是在算计什么。她这么做部分只是出于实验心理，而且她被真嗣所吸引或许只是那种典型的「他们那个年龄的非无性欲(allosexual)的男孩和女孩共处在一个环境下」时所会发生的事。不论如何，让我们继续在明日香在作品中的整体发展的框架内来看这个吻。 对于将要到来的这个吻，真嗣似乎并不是特别高兴。 当他拒绝时，明日香刺激他。正如我所提到的，明日香对于把她对人类的憎恨当作武器来使用已经是驾轻就熟。她提到今天是真嗣母亲的忌日并问他是不是害怕了，这使真嗣木桩穿心。母亲之名遭到侮辱，真嗣回答说他当然不会害怕一个小小的吻。明日香气势逼人地站了起来。她比真嗣要高，而且她向真嗣靠近的镜头被处理得与其说是浪漫不如说是胁迫而高高在上的。 当真嗣和明日香靠近对方时，真嗣的脸稍红了一下(因为他觉得明日香很性感，所以还是有点吃惊的)，而明日香却看上去要命地严肃。她犹豫了一会，告诉真嗣不要呼气。作为人类，真嗣显然还是会让她分心的。 接着，她用手捏住真嗣的鼻子，并突然吻了上去。他们一动不动地保持了这个相当尴尬的吻好一会。 可怜的真嗣没法呼吸，他的脸先是变红，然后又变青。明日香几乎让他窒息了。 第一次看到这一幕时，我以为这不过是个勃起的玩笑，因为真嗣两手握拳像是要掩盖裤子里的帐篷一样。或许真嗣一开始的确勃起了(毕竟他才十四岁，正在跟一个异常有魅力的少女接吻。他显然对她有性冲动，还看到过她的胸部，之后我们还会发现他对着她自慰)。但当他们继续吻下去时： 可怜的真嗣这下真的要窒息了。由于缺氧，他的皮肤都变青了。这并不令他开心。最后真嗣实在受不了缺氧带来的致死感，一把推开了明日香，开始大口地喘气，庆幸自己没有真的窒息而死。 然而对于明日香来说，这不仅仅意味着拒绝。这里发生了许多事情：首先，亲吻第三适格者并没有让明日香好受些；其次，真嗣显然不知道自己在干什么，也没法回应明日香，而是傻站在那儿直到实在受不了而跌跌撞撞地跑开。所以他并不是像加持那样有男人味的「选手」，他在明日香的「认同名单」上自然就排在加持之后；再次，他没有继续而是离开了她，这意味着对她的拒绝；最后，他不是加持。从明日香的角度来想象一下：你梦想中的男人正在跟一个你不是很喜欢的女人约会，而你吻了一个男孩，一边吻一边在心里想，为什么我还是不高兴？为什么？还要多久我才会高兴起来？接着那个男孩突然推开了你，开始大口喘气，很庆幸终于不用再跟你接吻了。 这跟你刚才被加持拒绝可不一样。你是被第三适格者拒绝了，是被一个你在德国随手就能找出一堆的普通得不能再普通的十四岁男孩拒绝了。而他还是你见过的最懦弱的男孩。 明日香转头跑进卫生间开始漱口。 明日香立马把过错归到真嗣头上来试图挽回面子。因为她的恼火跟她刚刚经历了最糟糕的被拒绝情形和最没法获得认同的事情毫无关系，而仅仅是因为真嗣接吻很差劲。(提示：事实正好是反过来的。)明日香还没有成为大人，她还是个孩子。遭到打击时，她只会责怪真嗣。当真嗣直白地问她怎么了，她狠狠地回击说她不高兴就是因为自己吻了他。这说的倒也没错，但她的本意却并不是真嗣所理解的那样。 顺便，这一切都是在加持和美里在分别八年之后重归于好的背景下发生的。一对真爱之间的吻与两个没法交流的孩子之间毫无头绪的吻形成了鲜明的对比。 之后，加持拖着美里回来了。他把美里安顿到床上，确保她没问题之后走了出来。因为见到了她亲爱的加持君，明日香看上去精神好多了，立马抓住了这个机会。 加持委婉地拒绝了住下来的邀请，说自己必须得回家，而明日香坚持要他留下来。真嗣或许是个无用的废物，但加持的话一定能拯救她一天的心情。 不幸的是，当明日香试图对加持表现出她最「娇」的一面时，加持拒绝并离开了，留下她一个人站在那里。注意看下一幕中，在观察到一件重要的事的同时，她有多么心碎。 这当然是对这一话之前的部分的回应。就在明日香跟光的朋友去约会之前，她问美里能"
