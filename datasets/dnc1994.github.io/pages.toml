full_description = "Annoucing New Blog | 博客迁移公告 Posted on 2019-07-10 | In Personal | Reading time ≈ 1 This blog is deprecated and will no longer be updated. Please visit linghao.io for my new blog. While existing posts will stay, the domain is set to expire in Jan 2020. After that you can visit this site via dnc1994.github.io. Thank you :) 本博客已经停止更新，请前往 linghao.io 访问我的新博客。 本博客的现有内容会全部保留，但域名将于 2020 年 1 月过期。之后请通过 dnc1994.github.io 访问。 感谢各位读者的支持。 过去这五年，我学到了什么 Posted on 2018-12-25 | In Knowledge | Reading time ≈ 10 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/five-year-learning-2013-2018/。 本文是前一篇五年总结的后续。希望就如何实现自己的目标这个话题给各位带来一些启发。 Read more » 创造者和他们的工具——利器社群计划 Posted on 2018-12-09 | In Productivity | Reading time ≈ 7 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/liqi-interview/。 工具和灵感，都是利器。当来自不同的领域，不同类型的创造者的工具和灵感互相碰撞的时候，才会迸发出更多的可能性。为了鼓励更多的工具和灵感的出现，我们发起了「利器社群计划」。「利器社群计划」鼓励独立的组织或个人，在自己的平台上分享「利器」。你可以像 eico 的陶子一样，采访自己身边的同事；也可以像扶墙老师一样，在自己的博客上分享清单。 Read more » [Notes] The Effective Engineer Posted on 2018-10-16 | In Notes | Reading time ≈ 40 This blog has been migrated to linghao.io. Read this post on my new blog: https://linghao.io/notes/the-effective-engineer/. Starting from “time is our most limited resource”, The Effective Engineer by Edmond Lau first establishes the methodology of using “leverage” to guide our actions. The book then, from multiple angles, discusses how to become a more effective engineer by focusing on high-leverage activities that produce a disproportionately high impact for a relatively small time investment. Ranging from adopting mindsets, actual execution, to building long-term values, topics involved are complemented with ample examples within the industry. Much content are easily generalizable to areas beyond software engineering as well. A must-read for software engineers. This post is a refined version of the notes I took while reading this book. Read more »"
