title = "创造者和他们的工具——利器社群计划 | Wille"
description = "本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/liqi-interview/。  工具和灵感，都是利器。当来自不同的领域，不同类型的创造者的工具和灵感互相碰撞的时候，才会迸发出更多的可能性。为了鼓励更多的工具和灵感的出现，我们发起了「利器社群计划」。「利器社群计划」鼓励独立的组织或个人，在自己的平台上分享「利器」。你可以像 e"
full_description = "创造者和他们的工具——利器社群计划 Posted on 2018-12-09 | In Productivity | Reading time ≈ 7 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/liqi-interview/。 工具和灵感，都是利器。当来自不同的领域，不同类型的创造者的工具和灵感互相碰撞的时候，才会迸发出更多的可能性。为了鼓励更多的工具和灵感的出现，我们发起了「利器社群计划」。「利器社群计划」鼓励独立的组织或个人，在自己的平台上分享「利器」。你可以像 eico 的陶子一样，采访自己身边的同事；也可以像扶墙老师一样，在自己的博客上分享清单。 介绍一下你自己和所做的工作。我是 Google 的一名软件工程师。 你的职业生涯的转折点是什么？作为一名刚刚进入第一份全职工作的工程师，很难说自己经历过什么称得上是转折点的事件。硬要说的话，2016 年暑假在 Strikingly 的实习，让我确信了自己喜欢的是开发面向消费者的产品，从而彻底打消了进入学术界的念头。这也算是对职业生涯有重要影响的事件吧。 你都在使用哪些硬件？Lenovo X1 CarbonOK，这其实是一个不太符合事实的短回答。更长的回答是： 由于喜欢 X1C 优秀的工业设计和便携性，15 年入坑之后我一直将其作为主力笔记本。而作为一名中度游戏玩家，在 X1C 之外我另有一台联想的游戏本（Y520）。入职以后我在公司主要使用 Linux Workstation，同时还配了一台 13” rMBP。由于在工作之外没有高强度的开发需求，所以目前在家里接有显示器的游戏本加上 MBP 基本可以覆盖日常需求，于是 X1C 正在吃灰。 但如果有朝一日成为了无业游民，我想作为主要生产力的笔记本还会是 X1C。（应该会考虑入 X1 Extreme 作为 Y520 的替代。） Filco Majestouch NINJA TKL Linear Action（黑轴）一款很优秀的机械键盘。选择黑轴是为了兼顾写字、代码和游戏。 在这之前用的是朋友送的 Cherry G80-3000（青轴），目前在老家吃灰。主要是因为全键盘尺寸携带不便，而且青轴不适合长时间游戏。 Logitech G502黑五打折买的游戏鼠标。外形和手感都不错，侧键多功能性强。 iPhone XS我从 2011 年开始就是 iPhone 用户，先后使用过 iPhone 4、iPhone 4S、iPhone 6S 和 iPhone 7。最近由于 7 的电池损耗严重而换到 XS。 我很少在手机上进行生产活动，在社交、娱乐等功能以外主要是将其作为摄影和图片编辑工具。有时我也会用 iBooks 看电子书。手机同时也是保障我个人账户安全的 2nd Factor， AirPods这里想单独提一下 AirPods。因为它实在是太好用了。在 AirPower 遥遥无期的现在，买到就是赚到。 iPad 4 Mini我的 iPad 在阅读电子书和 PDF 之外，基本只用于娱乐（观看视频和直播）。 软件呢？Mak朋友 Shu Ding 开发的 Mak 是我目前最重要的生产力应用。它是我所知最优秀的 Markdown 编辑器（当然，它本身不仅是一个编辑器）。 我用 Mak 来维护自己生产力流程中最为关键的 Todo List，并用它来写绝大部分 Markdown 可以满足的文章。这篇文章也是我用 Mak 写的。 Mak 的设计理念很好地体现了 Less is More。纵观市面上层出不穷的生产力、笔记以及编辑器应用，许多都犯了过度设计的问题。我相信在工具链中越是处于基本和重要地位的部分，就越需要避免过度设计带来的干扰。在这一点上 Mak 跟我的想法高度一致。 PinboardPinboard 是我主要使用的书签管理工具。它有着极简的用户界面和完善的标签管理系统。与 Mak 类似，不带任何干扰的它也是我工具链的重要组成部分。 G Suite（作为 Google 员工）提到生产力工具就不能不提到 G Suite。在工作和日常中我都有大量使用 Gmail，Calendar，Drive 和 Docs。 值得一提的是我跟一些朋友共同订阅了一个 G Suite 的 Business Plan（$10 / 人 / 月），因此获得了无限容量的 Drive 存储空间。我用它来备份所有的个人数据。 SparkSpark 是我在手机上使用的邮件客户端。Gmail 官方客户端不能满足我的原因是： 为了将工作与私人生活分隔，在 Gmail 客户端上我只登陆了工作邮箱。 我有两个非 Gmail 的 Legacy 邮箱地址也需要管理。 Spark 本身非常优秀！ Google PhotosGoogle Photos 是我的照片备份、同步和整理工具。作为 iOS 用户我也体验过 iCloud Photos，结论是只谈备份和同步功能它与 Google Photos 体验类似（严格来说会更好，毕竟有原生支持）。但在照片整理上 Google 的确做得比 Apple 好很多，按人物、地点或是事物分类的算法非常准确，也支持带条件的搜索。 1Password1Password 是我的密码管理方案。从最近某次更新开始 iOS 的密码自动填充支持以 1Password 作为来源，再配合 Face ID 使用起来异常便利。 TelegramTelegram 是我唯一喜欢的 IM 软件。它的回复、链接预览和表情包管理等功能都比其他替代品优秀太多。欢迎关注我的个人频道。 Sublime Text作为一名主要跟 Data 和 Model 打交道的工程师，我的大部分时间都花在自底向上的探索或是编写查询语句上了，经常涉及的工具有 Jupyter Notebook 和各种数据后端提供的查询界面等。 因为不曾有过绝对意义上的重度开发经历，就编辑代码而言 Sublime Text 对我来说足够了。目前在公司里主要使用的是内部的 IDE，不过也在尝试提高 Vim 的熟练度。 你最理想的工作环境是什么？可以调节高度的桌子，舒适的椅子，27 寸或以上的双显示器，没有 Cubicle，空气清新光照充足 。桌上要有一些自己喜欢的小玩意，比如明日香黏土，又比如 Jill Plush。纯净水和 Diet Coke 要管够。 你平时获得工作灵感的方式有哪些？UCSD 的 Learning How to Learn 中提到过，人的大脑有 Focused Mode 和 Diffuse Mode 这两种不同的思考模式。比如当你集中注意力解决数学问题时，大脑就会处于 Focused Mode。而 Diffuse Mode 指的是一种放松的思考模式。在思考卡壳的时候，让大脑进入 Diffuse Mode 有助于找到缺失的灵感。所以我在感觉自己无法解决眼下的问题时会选择换一种活动，比如出去散步或者听会音乐。 推荐一件生活中的利器给大家。最近买了水牙线，非常好用。 本文参与了「利器社群计划」，发现更多创造者和他们的工具：http://liqi.io/community/ Buy me an Asahi beer :) Donate Alipay [Notes] The Effective Engineer 过去这五年，我学到了什么"
