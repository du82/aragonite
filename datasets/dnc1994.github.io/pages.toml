title = "如何提高英语姿势水平 | Wille"
description = "本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/improve-english/。 前言既然标题口气这么大，那就先放点考试成绩让大家对我的英语水平有个直观的了解（当然，成绩只是考察语言能力的一个角度）：  TOEFL：R 30 + L 30 + S 23 + W 29 = 112 GRE：Verbal 161 + Quant 1"
full_description = "如何提高英语姿势水平 Posted on 2017-01-23 | In Knowledge | Reading time ≈ 13 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/improve-english/。 前言既然标题口气这么大，那就先放点考试成绩让大家对我的英语水平有个直观的了解（当然，成绩只是考察语言能力的一个角度）： TOEFL：R 30 + L 30 + S 23 + W 29 = 112 GRE：Verbal 161 + Quant 170 + AW 4.0 FET（复旦英语测试）：100（满分，意味着在那一年参加考试的人群中接近或者处于第一名的位置） 我不敢说自己是个英语特别好的人，但可以说在目前的需求下对英语还是运用自如的。在此之前，我在很多场合介绍过自己准备托福和 GRE 的经验，却很少谈及 generally 提高英语水平的心得。这是有原因的：一方面是因为我自己最近几年英语水平的提高已经完全是依靠长时间沉浸在有足够输入输出的环境中的积累，而这个状态跟绝大多数向我寻求帮助的人所处的学习阶段相去甚远；另一方面是因为，即使从我自身的经验中提取出能帮助到别人的部分，也是一件比较难的事情。不过我还是尝试了一下，在 15 年 5 月的时候做了一次班内分享，不过当时对一些问题思考的还不够全面。最近又有学妹找我咨询这方面的问题，我思考了一下觉得现在应该能把自己的心得概括得比较到位了，于是就有了这篇文章。 不同于我的其他博文，在本文中我将从一个比较高的层次谈谈自己对英语学习的理解，而不会把重点放在给出全面和具体的建议上面。这也意味着本文可能需要依赖于读者的反馈来进行后续的修改，以充实内容。欢迎任何方面的评论和提问：） 环境：Input & Output在大学的前两年经常听到的一句自嘲的话是，“高三是我英语水平的巅峰”。然而，如果有谁不只停留在自嘲，而是发自内心这么想的话，那就是错得离谱了。 不再被强迫上英语课，水平就会逐渐下降，这纯粹是无稽之谈。如果一个人每天都有一定量的英语输入和输出，水平不仅不会下降，说不定还能在不花费额外时间的情况下得到提高。 这里的逻辑在于，如果一个人想要提高自己的英语水平，那么一般来说他肯定正处在一个需要他这么做的环境中，也就是我所说的能够保证一定程度的输入和输出量的环境；如果他并没有处在这种环境中，而只是单纯地想提高英语水平，那么他就必须努力去创造这样的环境，否则任何提高都是不可能的。 举例来说，我的专业领域的学术环境基本上是由英语主导的，同时我也有留学美国的打算，之前又长时间沉浸在学习 MOOC 中，还有好几段必须使用英语的经历，再加上我由于从小喜欢英语而在文化消费上一直在接受大量的英语材料，所以我可以说是半主动半被动地在一个每天都会输入和输入大量英语信息的环境中生活和学习。在这种前提下，英语水平想不提高反倒是比较难的。 从发挥主观能动性的角度来讲，参加海外交流项目或者是去国际化的公司实习，都是非常理想的创造英语输入输出环境的方式。当然这样的机会并不是总能争取到的，所以这里再介绍几个我比较推崇而又足够 accessible 的方式。 MOOC在这个话题下，最值得推荐的就是 MOOC 了。试想，适合大学生，又与实际运用联系紧密，还能能作为长期输入输出来源的，除了上课还有什么呢？ 学习 MOOC 对英语水平的提高是多方面的：看授课视频能够提高真实学术场景下的听力；阅读课本和补充材料以及完成作业和考试能够提高英语学术能力；跟教授、TA 和其他学习者在论坛中交流则能提高书面表达能力。更不要说很多想要提高英语水平的人的目的都是出国学习，提前学习 MOOC 非常有助于到时适应以英语为主导的学习环境。 阅读很多人会问，为什么读了那么多 XXX 和 YYY，理解能力还是没有提高，阅读速度还是那么慢。其实答案很简单，就像其他任何学科一样，英语学习也是要靠不断把自己推出舒适区，才能有提高的。 具体说来，就是在平时接触阅读材料的时候，有意识地去思考和锻炼。举个例子，当你遇到一个有意思的表达时，可以想想是不是能用在自己最近写过的东西上面，或者思考一下如果你是作者这里会怎么写，再作一番比较；又比如说，在阅读材料时可以给自己记个时，不断逼自己在保持对内容的把握的前提下用更短的时间完成阅读。总而言之，只有让自己稍微不那么好受一点，接触到的材料才能多多少少积累进脑子里。 下面推荐一些我平时的阅读材料来源。 Wikipedia：不用介绍了。如果你兴趣足够广泛，光维基就足够你看了。 The Guardian：同不用介绍。 The New York Times：继续不用介绍。 Aeon：我最喜欢的在线杂志，多是深度长文，话题涵盖丰富，遣词造句值得学习积累。 PS：一般来说新闻类的文章阅读价值不大，评论类的比较值得用心读。 刷剧虽然刷起来最后看到忘我是标准结局，但也并不是完全学不到英语的。或者说，既然横竖都要刷剧，那么不妨稍微花点心思积累一些语言点，不也挺好的吗？ 首先要选对剧。比如说新闻编辑室和反恐 24 小时，哪个能学到英语，哪个能看得爽就不用多说了吧（当然，如果能对上口味，新闻编辑室是可以鱼和熊掌兼得的）。 其次就是心态要放轻松，不要隔三差五暂停做笔记什么的。要明确刷剧学英语更多地是一种潜移默化的影响，只是一个辅助方式，而不是知识点密度高到值得提取出笔记的一种媒介。 还有就是字幕的问题。在达到不借助字幕能看懂生肉的水平之前，我比较推崇只开英文字幕。这样练多了还有个额外的好处是很多时候不用等中字出来就能刷剧，比如像纸牌屋这种 Netflix 的剧都内嵌了英字，我每季都是出来的当天刷完的。当然，如果有质量高的双语字幕，开着中翻也是可以学到东西的，像人人字幕组的很多作品都翻的非常信雅达，值得学习。而且开中字还可以尝试挑错，也是很有趣的。 情怀：Work Hard说完了如何在有输入输出的环境中通过不断积累来提高英语水平，那么如果想专注提高自己某一方面的能力该怎么办呢？ 其实答案不外乎“努力”二字。虽然我一直推崇积累的方式，但是不可否认很多时候我们会有短期提高的需求；与此同时积累的学习方式也需要我们先达到一个足够的水平，也就是说会有一个不可跳过的 bootstrap 的过程。绝大部分人在准备相关考试的时候，其实就已经或多或少地涉及到了非积累性的水平提高方式。只不过由于应试的压力，取得的成果往往是容易反弹的。这里就介绍一些我自己用过比较有效的方法吧： 听抄：顾名思义，放听力材料然后试图把原文一字不落地写下来。听抄是提高听力最有效的方式，它能够锻炼不同层次的听力技巧：既要在短时间内把握大致意象，又强迫人去听出每个细节，从而对快速提高能够应对的语速以及更准确地理解细节有很大的帮助。 口译：这是上英语口译课时被丁小龙老师推荐的方法。除了在正式的场合做口译以外，只要有心随时随地都可以练习。比如在听不那么重要的讲课时，可以在心中默默把英文翻译念出来。 背诵：把喜欢的文章或是影视作品的片段背下来，对口语和写作都有帮助。像 The Minister 的很多片段我就能倒背如流，这也在一定程度上影响了我的写作风格。 翻译：只有在两种语言之间不断切换，才能深刻地理解思维和文化上的差异。可以找些自己感兴趣的材料当搬运工，又或者接份兼职翻译的工作，一遍赚钱一遍锻炼能力。这大概是能够比较全面地提高英语水平又有足够激励使人能坚持下去的比较好的选择之一吧。 这些方法虽然可以在短时间内拔高英语水平，但要消耗的时间和精力实在是过于巨大。要长期坚持下来，可能需要大量情怀支撑吧…… 误区：How Not To Fail在很多领域，成功的方式有无数种，没有人可以打包票教会你如何才能成功；但往往失败的方式却是可以被总结和避免的。创业是如此（事实上，我第一次接触 How Not To Fail 这个表述就是来自于 Alistair Croll 关于 startup 和 growth hacking 的 talk），英语学习也是如此。所以在这一小节里，我会讨论几个常见的误区。 单词我个人是不推崇用软件背单词的。确切地说，部分背单词软件的形式很容易让人做无用功。 比如说，给一个单词和四个选项，让你选出正确的义项，这种形式就会让你高估自己对单词的掌握程度；又比如说，只有单词没有例句的，就很容易让人学到一堆孤立的单词却没法用起来，在句子里听到也反应不过来；更为离谱的是，如果单词只有中文释义，很多抽象近义词之间的差别是没法讲清楚的。不要小看这一点，很多时候固定搭配之所以成为固定搭配，并不是完全没有道理的，找一本靠谱的英英词典仔细看就会理解了。 如果让我推荐，我会去找一本带靠谱英文释义、整理了词根近义词反义词、有高质量例句并且带例句录音的乱序单词书来背。我当年花了 4 个月的时间完全（这个“完全”的程度可不是开玩笑的）掌握托福词汇就是这么做的，至今受用无穷。 当然，我上一次不为应试目的背单词已经是 13 年的事情了。现在大家在用的背单词软件应该也都科学了许多。这里只是提醒一下，不要陷入上述这类误区。 写作中国学生最容易犯的问题，就是在下笔写文章之前，先在脑子里想好中文，然后逐字逐句翻成英文。这样做的问题在于，翻译是一件比写作难得多的事情。在遇到稍复杂一点的意思时，用中译英的思维方式几乎不可能写出地道的表达，因为这么做势必会在一定程度上丢掉对逻辑结构、颗粒度和固定搭配的考虑。 在有了好的想法以后，要写出好文章，首先一定要切换到英语思维直接下笔，其次就是一定要从读者的角度出发考虑易读性。永远不要认为内容可以掩盖语言能力的不足。因为根据我的观察来看，以大部分中国学生的英语书面表达能力之弱，根本轮不上拼文章内容的程度。试想如果读者看不懂你想表达的意思，内容再精彩又有什么用？ 在一般情况下，不要写结构复杂的长句子，不要用 GRE 里面的高级词汇，不要逐字句查字典翻译来表达你不会表达的意思（英语不是文言文）。至于应该怎么写，在学好语法的基础上，只要输入够多，平时又有意识地去积累，写出来的文章虽然不一定辞藻华丽，但肯定能够清楚地表意。在此基础上再慢慢改进，直到最后达到一种德式严谨和法式浪漫之间的完美平衡。 PS：根据我帮别人改文章的经验来看，大部分时候下笔不达意的主要原因是动词和介词用的不恰当（表达不够地道）；读起来枯燥的主要原因是句式单一以及不注意换词（积累不足或是意识缺乏）；文字冗余的主要原因则是逻辑混乱，下笔之前就没想清楚，让他用中文写也会出一样的问题。所以说母语能力决定二语表达能力上限这句话是绝对没错的。 结语除非是将语言作为学术研究对象，否则它对我们来说始终只是一门工具、一项技能。如果是为了应试，准备起来总不会难到哪里去；如果是身处实际运用的环境，就要在平时刻意去锻炼和积累才能提高；如果想要短期拔高，那么必然要付出巨量的时间和精力作为代价。 如果抛开功利不谈，是什么使我坚持学习外语到今天呢？我想是因为多学一门语言就能多打开一扇新世界的大门。我心目中最理想的状态，是在面对其他语言时能像面对母语一样处变不惊，只把它当做生活中一个平凡的组成部分。祝愿大家都能发现更宽广的世界。 附录以前写的几篇关于英语学习的文章： 如何备考 TOEFL/GRE 知乎回答：托福上 110 分需要英语达到什么水平？ Buy me an Asahi beer :) Donate Alipay DIY 留学申请全攻略 [Notes] Programming Beyond Practices"
