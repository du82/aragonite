description = "本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/gradapply-diy/。  Preface本文采用署名 - 非商业性使用 - 禁止演绎 3.0 中国大陆许可协议进行许可。著作权由章凌豪所有。 （笔者章凌豪是一名来自复旦大学的 17 Fall CS 方向的 DIY 申请者。在刚刚过去的申请季中，笔者总共申请了美国 14 个大"
full_description = "DIY 留学申请全攻略 Posted on 2017-01-05 | In Knowledge | Reading time ≈ 30 本博客已经迁移到新域名 linghao.io。请前往新博客阅读本文：https://linghao.io/posts/gradapply-diy/。 Preface本文采用署名 - 非商业性使用 - 禁止演绎 3.0 中国大陆许可协议进行许可。著作权由章凌豪所有。 （笔者章凌豪是一名来自复旦大学的 17 Fall CS 方向的 DIY 申请者。在刚刚过去的申请季中，笔者总共申请了美国 14 个大学的 19 个 Master 项目。） 关于申请，总是有很多 myth。最经典的一个就是在申请季开始的时候总会有一大堆人打印十几二十份成绩单跑到教务处去盖章。而事实上，现在绝大多数的项目都采用网申系统，在申请时往往只要求上传成绩单的扫描件。以笔者的 19 个项目为例，其中只有 2 个项目要求寄送纸质成绩单。诸如此类的 myth 代代相传，真正有用的信息却总是凌乱琐碎，再加上唯恐天下不乱的各路中介散布各种不负责任的观点，这种信息不对称使我们 DIY 申请者走了许多弯路。 申请本身是一件充满了不确定性的事情。在申请季到来时，我们自身的经历和成就往往不会再有太大的变化。我们要做的就是确保不要引入什么减分项，努力表现出自己的加分项，同时控制和减小各个环节的不确定性。本文的主要目的，就是将笔者在 DIY 申请的过程中感受和了解到的一些重要的信息，经过整理和组织后提取出一些通用的内容，以极高的干货密度分享出来。接下来笔者将从申请前需要做的准备，申请时各种材料应当如何处理，以及如何规划和管理申请的进度几个方面来展开。 提示 1：本文中关于材料具体应该如何准备的部分（比如书写 SOP/PS 的思路）可能只适用于理工科申请，请人文、艺术、商科等方向的读者自行鉴别，兼听则明；而其余部分的内容则基本上对于所有方向的申请都适用。 提示 2：本文将不会涉及以下内容： 如何选择学校和项目。 PhD 申请相关的问题：如何套瓷、如何写好 research proposal、如何准备一对一面试等。 网申阶段结束以后的问题：如何选择 offer、如何 argue 奖学金等。 提示 3：本文的干货密度很高，建议仔细阅读，大概需要 15 分钟。 Preparations理想情况下，在申请之前，你需要： 一个能够（相对）稳定翻墙的网络环境。换句话说，一个（甚至几个）代理或者 VPN。如何搭建或是购买它们则不属于本文的讨论范围，只能说至少在目前看来愿意花钱总是能办到的。 一个（相对）可靠的邮箱。如果能确保上一条，建议选择 Gmail。此外建议使用包含姓名/生日等标示性信息的用户名，比如`xiaoming.wang.95@gmail.com`。 一张用于在线支付的信用卡，推荐 Visa。 几个近两年的、跟你同一申请方向的学长学姐。 几个跟你同一申请方向的同级生。 Program Requirements & Progress Tracking对于 DIY 申请来说，最重要的就是要有条理。所以在最开始，笔者想要强调很多人都会忽视的两点：看清项目需求，管好申请进度。 绝大多数项目都会要求提供如下材料： 个人基本信息 教育经历，包括上传或者寄送成绩单（Transcript） 英语考试成绩 动机函（SOP = Statement of Purpose）或是个人陈述（PS = Personal Statement），以及简历（CV/Resume） 由推荐人填写推荐并提交推荐信 这些也是本文将要重点讨论的内容。但与此同时，不同项目对这些材料的要求可能会很不一样，并且大部分项目都会要求一些额外的材料。所以，在申请之前必须先逐个考察和记录好每个项目要求提供的材料清单。 对于进度管理，笔者建议使用电子表格做一个简单的 tracker 来帮助自己掌握每个项目的进展。在申请结束后，笔者的 tracker 是这样的： 这里给出笔者所使用的模板供参考。如果不方便翻墙的，这里 还有一个 Excel 版。 Transcripts在填写教育经历时，大部分项目都只要求上传成绩单扫描件，在获得 offer/AD 之后才要求寄送原件。但也有个别项目在申请时就会要求寄送原件，或者是要求进行成绩认证。 首先要仔细阅读项目对成绩单的要求，比如是否要有签字、是否要附上评分标准、是否要提供中文原件等。在办好满足要求的成绩单后，就可以拿去扫描上传。在上传时，可能会遇到一些比较奇葩的网申系统限制文件的大小。这时需要用一些工具来压缩 PDF 的大小，那么在重新上传之前务必要确认压缩后的文件是否依然足够清晰到能够看清上面的文字。 对于寄送成就单原件，一般都是使用学校的官方信封，然后到教务处盖上骑缝章。寄送的时候一般选择 DHL，三天基本就能到了，学生件的价格也很低（150 RMB/件）。 做成绩认证则比较麻烦。笔者遇到的有学信网认证（与 ApplyWeb 合作）和 WES 认证。流程分别如下： 学信网： 登录学信网上传成绩单和个人证件的扫描件，缴费并提交申请。 等待 20 天。 认证报告出来后，在美国学校的网申系统中缴费并提交认证请求。 这时在学信网上能够看到已经缴费的项目，选择发送电子报告即可（即达）。 WES： 在 WES 上创建申请，选好收件方，缴费并获得一个 reference number。 对于来自中国大陆学校的成绩单，必须先使用学信网或者学位网完成认证并将报告寄到 WES。这两个认证网站都有目的为 WES 的选项，按照指示操作即可。 等待学信网/学位网完成认证并发件到 WES。 WES 需要大概 7 天来将收到的报告跟你的档案匹配起来，再花 7 天左右来处理报告。 WES 将最终的报告寄给收件方。 可以看到，如果要做成绩认证，需要花的时间还是挺长的，尤其是 WES。如果遇到感恩节、圣诞节之类的假期，就要等待更久。所以如果想申请的项目中有要求成绩认证的，一定要尽早开始。这也是为什么申请任何一个项目要做的第一件事永远是看清需要提交的材料清单的原因。 这里可能遇到问题的是交流的成绩单。如果你选择将交流经历写入教育经历，那么就要搞清楚是否需要提交交流时的成绩单。一般来说，如果学分被转换回来并且记载到了本科学校的成绩单上，往往就不需要再提交交流成绩单，但并不总是这样的。而且在实际操作中，如果在交流的时候没有做好准备，事后申请往往比较麻烦，所以这里要提前做好打算。 Test Scores对北美申请而言，大多数情况下我们所需要的英语成绩就是托福和 GRE。在申请季到来时，分两种情况： 你已经有满意的成绩：那么只需送分即可。不过这里要注意下有效期的问题。一般学校对成绩有效期的要求是能够在你提交申请时有效即可，但也不乏要求有效期能够覆盖到申请 deadline 甚至是实际入学日期的。更有甚者，某些学校会强行只承认托福的有效期为 18 个月而不是 2 年。所以这里要留个心眼。 你还有要参加的考试：注意出成绩和送成绩的时间间隔，尽量不要卡 deadline；还有一个问题是，在申请季如果寄送多份成绩给学校，要留心学校的规定。某些学校会明确指出最多接受 2 封成绩，或者说取最后一次为准（而不是我们所希望的取最高为准）等等。 至于怎样的成绩足够好，往往所申项目的网站上会给出最低要求，或者是每年的申请者和被录取者的平均成绩。一般而言，对于理工科来说，托福 100+，GRE 320+（Verbal 152+，Quant 168+，AW 不重要）就可以满足绝大多数项目的要求了。不过这里要注意的是，项目介绍中提及的数字，有 hard limit（如果不满足要求就直接淘汰），也有 soft limit（如果低于要求只要其他方面足够强也可以被录取）。像是申请做助教要求托福口语单项 24 这种往往是 hard limit，其他的情况就很难区分了。可能需要去调查一下往年被录取者的背景。不过如果分数差的不多，又是的确想去的项目，建议还是申请一下撞撞运气，毕竟多申一个项目的费用相对于以后留学的开销来讲都是小意思。 有些项目的网申系统中可以查看成绩是否已经寄到。由于成绩从 ETS 寄到学校以后，还有一个将成绩跟你的申请档案匹配起来的过程（通过填写的考试注册号、姓名、生日等），所以系统中的这个成绩状态可能会更新得比较慢。笔者的经验是最慢的项目大概 15 天左右也都显示寄到了。这里还是建议一旦确定要申请某个项目就马上送分。 有些项目是无法在系统中查询成绩状态的，这时如果实在不放心，可以尝试发邮件询问，但不一定会得到回复。不过由于大部分系统都会让你上传电子版成绩单，所以即使出了意外没寄到问题应该也不算太大，真的缺文件之后学校往往会发邮件给你的。 关于电子版成绩单的问题，托福可以用纸质成绩单扫描件，或是 NEEA 上的网页截图。GRE 则是在 ETS 官网有 PDF 下载。 这里顺带提一下，关于托福和 GRE 的备考，笔者曾经写过一篇文章，可以参考。 SOP/PS对于申请最重要的一篇 essay 就是 SOP/PS 了。这里其实也有一个 myth，很多人都会强调它们之间的区别，说 SOP 侧重于 Purpose 所以要重点描述自己申请这个项目的目标是什么希望收获什么，PS 侧重于 Personal 所以要重点描述过去的经历是如何促使自己想要申请这个项目的。这类观点并不是全无道理，但事实是大部分项目对于 SOP/PS 中应该包括什么内容都是有要求的。如果你把上面的定义跟每个项目的具体要求去对比，就会发现把这篇 essay 叫成 SOP 还是 PS 很多时候都是随意的。所以还是根据要求来就好。 以 CMU MIIS 项目的要求为例： A good essay conveys three types of information about you.First, we look for strong evidence that you can do well in the MIIS degree program. For example, a description of your academic experience is good evidence. A description of a software project, your involvement in the project, and the impact of the project is good evidence. A description of an internship or professional experience is good evidence. These descriptions are stronger if they provide details about what you did, what you liked, and what you learned from the experience.Second, your essay is stronger if it explains why you want to be in the MIIS program. We understand that you may be applying to more than one degree program. Tell us why are you applying to this one, and what you hope to get out of your experience here.Third, a brief discussion of your career goals - what you enjoy, what you hope to do after you complete the MIIS degree - helps us to understand how the MIIS degree may contribute to your long-term professional goals. 一般来说，SOP/PS 可能会包含这些内容： 开头：主要描写自己的 motivation / dream / goal。这里如果没法写得特别引人入胜，建议开门见山。以及切忌无脑引用名人名言。 两到三段经历：挑选跟申请方向最相关的事例，串成几段逻辑连贯的经历。有个简单的验证方法就是每段经历的中心句拿出来可以连成一个故事；在写每段经历的时候，一般都是问题描述+解决方案（what you did）+感想收获（what you liked and learned）的结构，要注意把握细节性和故事性之间的平衡，同时避免写泛泛而谈的内容（e.g. I fixed many bugs and felt very glad about it.），因为这谁都能写的出来；段与段之间注意过渡。 Why School & Why Program：为什么选择这个学校是很难写的，大部分人如果试图回答这个问题往往只能编出特别庸俗的故事（我有一个学长/男朋友在贵校……）。而为什么选择这个项目则相对而言比较好写：可以花点时间去了解下项目的课程安排，然后提一两门课的名字，说觉得这些课能补充你不足的地方；又或者提一下项目的亮点，比如跟工业界接触多、团队协作多，等等。总之要让招生委觉得你仔细地研究过了项目。 Why graduate school / Why further education：这跟上一点不大一样，比较好的方法是写一段自己对专业领域的比较独到的见解，又或者是畅想一下这个领域的未来，从而自然地引出你觉得在这样的情况下自己离实现目标还差一些技能和经验，所以想要继续学习。 Career goal：如果前面的铺垫足够，只要从职业的角度重申一下自己的目标就行了。同样可以结合自己的见解或是对未来的畅想使这部分言之有物。 下面提供笔者本人申请 CMU LTI 的 SOP 的开头段和末尾两段： “Give a computer a fish, you feed it for a day; teach it how to fish, you feed it for a lifetime.” I still remember this quote from Professor Hsuan-Tien Lin’s slides. After spending my freshman year without much motivation, it was his online course Machine Learning Foundations and Techniques that sparked my interests in Machine Learning and Data Mining. Today, I’m determined to pursue a Master’s degree from the Language Technologies Institute (LTI) at Carnegie Mellon University (CMU) because of the same passion that has been driving me to boldly advance in this exciting field for the last two years. … This technical leadership experience tremendously inspired me. It made me reflect on where the industry is heading and what I still lack to accomplish my dream. As computing becomes ubiquitous in our life, the future of software industry will be dominated by machine intelligence. However, shipping intelligent products is always faced with extra complexity stemming from its very nature. For instance, a Machine Learning system can never be as decoupled as ordinary software, because the reason to develop it in the first place is that the desired behavior cannot be explicitly programmed without dependency on external data. As in the case of EVA, data dependencies often lead to unexpected performance drop and high maintenance cost, which tend to compound and become what we know as technical debt. To create genuine productivity, we have to continuously pay off technical debt by making sound decisions and refactoring legacy codes. Therefore, apart from deepening my understanding of Machine Learning and Data Mining, I need to polish system design and software engineering skills as well. My career goal is to become a leading intelligent software developer. And I believe that a professional degree would help me better prepare myself for it. After thorough research, I’m convinced that LTI is the best choice to realize my dream. As a trailblazing leader, LTI fascinates me with the way it combines research and engineering, especially the projects using large-scale information extraction and content analysis to combat crimes from human trafficking to cyberterrorism. I’m applying for Master in Intelligent Information Systems (MIIS) and Master of Computational Data Science (MCDS) because both program suits my experiences and interests perfectly well. Courses like Machine Learning for Text Mining and Large-Scale Multimedia Analysis will provide highly specialized insights and I cannot wait to challenge myself with them. Given my solid background in Computer Science, practical experience with research projects and sufficient exposure to industrial applications, I’m confident that I will succeed in this ambitious endeavor and teach machines how to “fish” forever. 可以看到开头很恰当地引用了林轩田老师的一句话，其余部分基本就是开门见山。而倒数第二段写了自己对 Machine Learning 作为一个软工系统的所具有的独特的复杂性的见解，最后一段通过描述对 LTI 的直观感受和项目里的两门课程来表达自己对项目的兴趣。 中间主体的经历部分由于包含一些隐私信息，不便公开。不过可以给出每段的中心句： Motivated by my desire to gain a more systematic grasp, I joined Shanghai Key Laboratory of Data Science. While gradually shifting my focus to real-world applications, I realized that many scenarios require customized tweaks due to various constraints. Encouraged by my achievements and impelled by the curiosity to taste the difference between academia and industry, I joined Strikingly, a startup company specializing in website building tools. 总结一下笔者的思路，大概就是： 通过 MOOC 对 Machine Learning 和 Data Mining 产生了兴趣。 在实验室系统地学习了相关的知识，并解决了一些实际问题。 对实际问题越来越感兴趣，发现它们往往涉及到理解现有算法和模型的原理并进行相应的修改，所以在交流时加入的实验室那边进行了尝试。 被之前的成就所鼓励，同时也对工业界的实际情况感兴趣，加入了一家创业公司实习。 在实习期间逐渐体会到 Machine Learning 系统所特有的复杂性，感受到自己还有许多短板。 希望能够加入这个非常符合我的兴趣和经历的项目。 对于 DIY 申请者来说，我们需要依赖学长学姐或是文书咨询顾问的反馈来修改我们的 SOP/PS。这里比较推荐的方式是，找至少两位值得信任又能够及时回复的审稿人，用快速迭代的方式，每写一稿就发给他们，再根据反馈来修改。一开始不要急着对语言进行润色，而是把内容先定下来。最后如果有条件也可以找 Native Speaker 帮你润色语言，但要把握好修改的度，不要适得其反。 笔者本人的 SOP/PS 基本保持着一周一稿的速度，一共改了八稿，在这个过程中也得到了不少感悟。除了上面已经提到过的几点以外，还有： 写第一稿是最痛苦和漫长的，笔者花了两星期。建议留一段比较空闲的时间来好好回忆和梳理大学三年的经历，再仔细写出来。一开始不要害怕字数会超出太多，之后可以慢慢删减。 切忌写成 CV 的展开版。尤其是第一稿一定要小心，否则由于锚定效应，很容易限制之后修改的思路。 一开始总想一口气表现出自己各方面的优点，但后来往往会发现把所有内容都写的很出色是不可能的，势必要根据重要性来做一些详略上的取舍。 过渡是很重要的，尤其是行文如果不符合读者心理预期，会让人对文章的印象分大减。建议反复跟审稿人确认文章是否存在这样的问题。 改最后几稿时，要开始考虑可读性的问题。招生委读你的文章的时间是很有限的，不仅要避免用太高级的词汇，语法和表达如果用的不好，也会出问题。有时候审稿人跟你是一个专业但是方向并不相同，就可能不会看的特别仔细，也不会提出这类问题。但是就笔者的经验，几乎没有人的写作水平能够地道到不犯这种错误。最好能让对你的专业有了解的人来读读看会不会遇到坑。笔者的 SOP/PS 一开始就有几处容易读出歧义的地方，而笔者本人却完全不自知。并且，笔者在帮别人修改 SOP/PS 的时候，也经常遇到由于作者语言能力不过关的原因而不能理解所想要表达的意思。 多用主动语态，多用显得自己充满信心和笃定的词。 还有一个问题是，对于不同的学校和项目，通常要提供不同版本的文书。但如果真的为了 N 个项目去写 N 份 SOP/PS，恐怕没人会有那么多的时间和精力。一个比较折中的解决方案是，先写出针对 dream school 的一份底稿，对其他的项目就在此基础上只修改开头和结尾的两段。一般而言，如果你申请的所有项目都是同一个方向的，那么主体部分是不用大改的。甚至在很多情况下，你只需要修改学校和项目的名字。当然，这里千万注意不要把名字搞错了。 CVCV 就比较简单，把常见的内容都罗列上去就行了，网上能找到很多模板，我这里也提供一个 LaTeX 模板系列作为参考。强调几点： 每个想要详述的 Project 采用类似于 SOP/PS 经历段的三点展开。 描述自己做了什么的时候注意使用恰当的动词。 CV 要不 1 页要不 2 页，再长就不合适了，1 页半也很尴尬。除非项目有明确要求，否则一般都可以通过行距和页边距来调整紧凑程度。 举例来说，笔者本人的 CV 包含如下内容： Education B.S. of Computer Science, Fudan University Exchange Program, National Chiao Tung University Selected MOOCs Professional Experience Data Mining Engineer Intern, Strikingly Technical Director, Student Information Management Center Academic Experience Research Assistant, Shanghai Key Laboratory of Data Science Visiting Student, Machine Learning Laboratory of NCTU Honors and Awards Selected Side Projects Extracurricular Activities Programming Skills 这里注意，笔者选择将 Professional Experience 放在前面，并在最后加入了 Programming Skills，是由于笔者主要申请的都是就业导向的项目。对于学术导向的项目，需要做相应的调整。 笔者本人的一个 Project 是这样写的： Content Filtering Phishing & spamming detection service used by the main site. Redesigned the prediction pipeline to support customized i18n handlers. More malicious behaviors can now be identified with greater accuracy. 很好地遵循了是什么+做了什么+有什么用的结构，简明扼要又符合读者的预期。 Recommendations在这一部分，你需要找到一定数量（一般是 3 位）的推荐人，将他们的信息填写进网申系统。系统将会向他们的邮箱发送邮件，其中会包含一个链接或一对用户名/密码用于访问推荐填写系统。推荐的形式一般是提交一封推荐信，加上回答若干个问题（跟被推荐人的关系，对被推荐人的各方面进行基于百分比的评价等）。 一般而言推荐人可以是： 上过的课程的老师 所待实验室的教授 交流期间的教授 实习期间的上司 对于北美申请来说，通常来自美国/加拿大的教授的推荐信比较有效。而如果是领域内知名的大牛，或者是要申请的学校那边有分量的教授（比如院长）这类就算是牛推了。当然，大部分人是拿不到牛推的。这时候在推荐人的构成上如果能够全面一点会比较好（至少对于 Master 申请是如此）。比如笔者的三位推荐人就分别是在复旦实验室的教授、交流期间实验室的教授和实习公司的 CTO。 在跟推荐人沟通时，要注意以下几点： 提前问好推荐人愿意提交几份推荐。有些比较严肃的推荐人可能只愿意提交 5 份推荐，或者只愿意提交给他所认可的学校。如果首选的 3 个推荐人中存在这种情况，那你就要考虑将自己最想去的项目交给这个推荐人，然后为其他项目找新的推荐人了。所以仅仅确认推荐人愿意为你作推荐的意愿是不够的，这些细节都必须提前商量好。 在发送推荐请求时，尽量一口气把所有项目的邮件一同发送，这样不仅方便了推荐人，也减小了因为推荐人迟迟不填申请而导致你提心吊胆的概率，对大家都有好处。 很多时候推荐人比较忙，这时候要不失礼貌但又不懈地提醒对方。这个问题在推荐人是海外的教授时比较常见，因为我们通常没有邮件以外的方式去联系他们。所以最好能够保存对方的电话，或是跟对方实验室里的学生保持联系。 照理来说，推荐信应该是由推荐人自己起草和提交的。但在实际操作中，尤其是对于中国的教授而言，大家都知道很多时候推荐信底稿是由申请者自己写的。在这种情况下，一封好的推荐信应该满足如下几个要素： 推荐人跟你的关系以及如何认识你的。 推荐人跟你共事的经历。 对你各方面能力的评价（通过具体事例的细节来论证）。 对你为人和性格的评价。 一些比较私人的、在你的 SOP/PS 和 CV 中没有的内容（使推荐信更可信）。 跟 SOP/PS 相反，写推荐信切忌开上帝视角，很多细节性的东西你的推荐人是不应该会知道的。虽然说在没有牛推的情况下，推荐信处理得再好可能最多也只是起到一个不减分的作用。但从尽人事的角度出发，努力让推荐信看起来真实并且很好地支撑你的整个申请，绝对不会是一件有害的事情。 这里给出一个推荐信样本作为参考。 还有一点要注意的是，在填写推荐人联系邮箱时，一定要用职业邮箱。比如对教授来说就是 edu 邮箱。 Extra Materials在上述材料以外，项目有可能会要求以下这些材料： Personal History Statement：公立学校（比如 UC 各校）常见，通常是要求描写个人成长过程中遇到的困难（侧重于因为自己是 minority group 或者家庭经济情况所导致的困难），你是如何克服这些困难的，以及它们是如何 motivate 你来申请学校的。对于这篇 essay，笔者的几位学长都表示，如果不是 LGBT/残疾人/黑人之类公认的 minority group，写了可能作用也不是很大，建议如果是 optional 的就不写，如果是 required 的话也不要花太多时间在上面。听从他们的建议，笔者最后就按照实际情况写了自己是如何从一个落后的农村来到复旦读书的。 Diversity Essay：这个就更侧重在 minority group 上面了，要求描写自己能够如何促进学校的 diversity。如何处理同上。 Video Essay：要求提交一个长 1 ~ 2 分钟的视频，其中由申请者本人出镜，对内容的要求一般是简单的自我介绍，说一些 SOP/PS 上没有涉及的内容。写个稿子直接录制，注意下着装、背景、光线和音质即可，不需要花太多时间，也没有必要给视频加什么特效。 Video Interview：网申阶段的面试往往是播放几个录制好的问题，然后实时采集你的回答，跟托福口语考试的形式比较像。这里要注意的是找一个好的网络环境。面试可能会要求描述自己的某段经历（e.g. Describe the most challenging project you’ve ever worked on.），或者问一些比较 general 的问题（e.g. When working on a group project, how do you acknowledge the achievements of your teammates?），可以找同学互相出题准备一下。 Recommended Schedule & Approach申请时建议按照如下的步骤进行。 确认要申请的项目列表。 查阅要申请的每个项目的 FAQ 等相关页面，确定需要准备的材料清单。 进入每个项目的网申系统创建申请。 送英语成绩，申请成绩认证，寄送纸质成绩单。 准备其他文书，并抽空填写个人信息。 在确定推荐人和推荐信内容以后发送推荐信请求。 在文书准备得差不多或是 deadline 将至时，上传文书。 最终检查并付款提交。 比较关键的就是第 4 点一定要尽早做，因为这部分的材料都是需要等待第三方进行处理的，不像其他材料可以拖到最后一天再提交（当然，最好不要这么做）。 实际操作时，笔者推荐每次完成所有项目的网申系统中的一个部分。比如今天的任务是填写基本信息，那么就一口气把所有项目的基本信息都填写完毕，不多不少。这样做的好处是效率高而且不容易遗漏。当然，如果你喜欢卡 deadline，那么显然就要从最想去的项目开始填一个提交一个。（说真的，不要卡 deadline。） Tips 再次强调，申请任何一个项目之前一定要先看清和记录好要求。 对 DIY 申请来说，由于没有中介帮忙分析定位和管理进度，就更容易出错。所以做到有条有理和万事提前是很重要的。（当然，DIY 申请的好处也在这里：不会被中介坑。） 有任何不确定的问题第一时间发邮件问。因为不一定会有回复，所以有一同申请的人可以互相交流和分享资讯是非常必要的。 要认清自己的优势和短板。交流经历（尤其是英语授课的项目）和实习经历（尤其是 big name 和 startup）是很强的加分项，尤其对于 Master 申请来说；当助教的经历也是很强的加分项，甚至比这门课拿 A/A+ 更强，尤其对于 PhD 申请来说。建立在清晰的自我认知的前提下，很多时候我们都需要对实际经历进行适当的艺术加工来使自己的 case 更有力，这是完全 OK 的。 学长学姐的帮助是你最宝贵的财富。绝大多数情况下他们都是很乐于提供自己的文书和帮你审阅文书的。 Epilog作为一个刚刚度过有着五门课和一周三天兼职实习的申请季的人来说，笔者深知这几个月对每个申请者来说都是一场艰苦的持久战。希望本文能为各位带来一些启发，节省一些时间。希望大家都能申请到自己的 dream school。 Buy me an Asahi beer :) Donate Alipay How to Rank 10% in Your First Kaggle Competition 如何提高英语姿势水平"
