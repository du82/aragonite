["https://dnscrypt.info"]
title = "DNSCrypt version 2 - Official Project Home Page"
description = "New home of the DNSCrypt project, now implementing multiple protocols to improve DNS security. Download official DNSCrypt & DoH servers and clients here."
full_description = "DNSCrypt is a protocol that encrypts, authenticates and optionally anonymizes communications between a DNS client and a DNS resolver. It prevents DNS spoofing. It uses cryptographic signatures to verify that responses originate from the chosen DNS resolver and haven’t been tampered with. It is an open specification, with free and open source reference implementations, and it is not affiliated with any company nor organization. Free, DNSCrypt-enabled resolvers are available all over the world. Let's secure your DNS! Why was DNSCrypt developed? Most applications on your computer, mobile devices and connected gadgets heavily use DNS, a mandatory protocol to communicate over the Internet. Unfortunately, the security of that important protocol could be vastly improved. Encryption is nonexistent, and authentication mechanisms exist, but are criticized and haven’t received much adoption. Pioneered by the OpenBSD operating system circa 2008, systems to tunnel DNS over a secure channel greatly improve DNS security. The DNSCrypt protocol was then specifically designed for that purpose. DNSCrypt version 2 was specified and implemented in 2013, and is probably the most deployed encrypted DNS protocol to date. Anonymized DNS In October 2019, Anonymized DNS was announced. Anonymized DNS improves over the original protocol and DoH by hiding client IP addresses in addition to encrypting queries. Community Feel free to join the subreddit dedicated to discussing DNSCrypt!"
