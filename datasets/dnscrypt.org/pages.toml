title = "DNSCrypt - Official Project Home Page"
description = "Home of the DNSCrypt project, a protocol to improve DNS security. Download DNSCrypt clients, the DNSCrypt server proxy, and read the specifications here."
full_description = '''DNSCrypt is a protocol that authenticates communications between a DNS client and a DNS resolver. It prevents DNS spoofing. It uses cryptographic signatures to verify that responses originate from the chosen DNS resolver and haven't been tampered with. It is an open specification, with free and open source reference implementations, and it is not affiliated with any company nor organization. A couple companies, organizations and individuals are operating public recursive DNS servers supporting the DNSCrypt protocol, so that all you need to run is a client. A constantly updated list of open DNSCrypt resolvers can be downloaded to replace the default CSV file shipped with the dnscrypt-proxy client. If you are running your own public DNS resolver in order to help make the Internet a more secure place, please submit a pull request to have your resolver added to the list of public DNS resolvers. DNSCrypt itself is not a product, but a protocol that anyone can implement. Portable implementations are also available, on top on which graphical user interfaces and convenient tools have been built. Choose your platform to discover some of the available options: Windows - macOS - Linux / BSD - Android - iOS or run the software on a router. Firewall setup: although some resolvers may prefer a different port, the default port used by the DNSCrypt protocol is 443. Outgoing queries to this port on both TCP and UDP should be allowed by your firewall. "DNScrypt is a very secure protocol that is helping build a safer web" ( James Awland - BestCasino.co.uk) "We highly recommend DNScrypt to those looking to access the best new casino sites" (Aidan Howe - BestCasinoSites.net) Important: We are aware of fake packages pretending to be DNSCrypt Windows clients, that actually contain Malware/Potentially Unwanted Program (PUP). Do not download anything that pretends to be a DNSCrypt client from torrents, links in YouTube videos or unofficial download locations. It scans files and website for viruses, blocks fraudulent webpages, protects your passwords and bank card details, and keeps your online payments safe from theft.'''
