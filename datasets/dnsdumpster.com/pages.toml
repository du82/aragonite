["https://dnsdumpster.com/developer"]
title = "Developer - DNSDumpster.com"
description = "Access to the dnsdumpster.com datasets via API is available to both Free users and those with Plus Access. Response data includes all found DNS records, ASN network owner, netblocks and Banner records found in our databases. Requirements To use the API you will need an API key, this can be found on your account dashboard […]"
full_description = 'DeveloperAccess to the dnsdumpster.com datasets via API is available to both Free users and those with Plus Access. Response data includes all found DNS records, ASN network owner, netblocks and Banner records found in our databases.RequirementsTo use the API you will need an API key, this can be found on your account dashboard after logging in. Sign up for a Free account now.LimitsFree accounts are limited to 50 records retrieved, while the Plus account will retrieve up to 200 records for a domain. If you need higher numbers of results take a look at our parent company hackertarget.com for complete data access.Example UsageHere’s an example of how to make a request using cURL:curl -H "X-API-Key: your_api_key_here" https://api.dnsdumpster.com/domain/example.comThe API will return JSON data containing DNS and attack surface information for the specified domain.{ "a": [ { "host": "dnsdumpster.com", "ips": [ { "asn": "63949", "asn_name": "AKAMAI-LINODE-AP Akamai Connected Cloud, SG", "asn_range": "172.104.208.0/20", "banners": { "http": { "apps": [ "Nginx" ], "server": "nginx", "title": "403 Forbidden" }, "https": { "alt_n": [ "dnsdumpster.com" ], "apps": [ "Nginx" ], "cn": "dnsdumpster.com", "server": "nginx", "title": "403 Forbidden" }, "ip": "172.104.213.248" }, "country": "United States", "country_code": "US", "ip": "172.104.213.248", "ptr": "" } ] } ], "cname": [], "mx": [], "ns": [ { "host": "dns1.registrar-servers.com", "ips": [ { "asn": "397237", "asn_name": "SECURITYSERVICES", "asn_range": "156.154.132.0/24", "country": "United States", "country_code": "US", "ip": "156.154.132.200", "ptr": "" } ] }, { "host": "dns2.registrar-servers.com", "ips": [ { "asn": "397237", "asn_name": "SECURITYSERVICES", "asn_range": "156.154.133.0/24", "country": "United States", "country_code": "US", "ip": "156.154.133.200", "ptr": "" } ] } ], "total_a_recs": 1, "txt": [ "v=spf1 -all" ] } Rate LimitAs the domain search is conducted across a significant amount of records the API has a rate limit of 1 request per 2 seconds. If you exceed this limit, you will receive a 429 (Too Many Requests) response in JSON format. For example:{"error":"Rate limit exceeded"}PaginationAfter the first 200 records, additional pages of host records are available via the API. A “Plus” membership is required. Simply use “?page=2” as a HTTP GET parameter.curl -H "X-API-Key: xxxxx" "https://api.dnsdumpster.com/domain/example.com?page=2"Domain Map in ResponseUsers on the “Plus” membership also have the option of generating a domain map that is included in the json response. Include the HTTP GET parameter “?map=1” in the request for the map to be generated and included. Note that the map is base64 encoded and generates a large amount of data in the resulting json.curl -H "X-API-Key: xxxxx" "https://api.dnsdumpster.com/domain/example.com?map=1"'
