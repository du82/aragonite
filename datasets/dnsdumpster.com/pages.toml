["https://dnsdumpster.com/about-faq"]
title = "About & FAQ - DNSDumpster.com"
description = "Frequently Asked Questions What is the purpose of the DNSDumpster Search? Domain-based reconnaissance allows security teams to map an organization’s Internet infrastructure efficiently. Starting with DNS queries, we can discover and enumerate the external attack surface by correlating DNS records with other Internet-scale datasets. This process reveals networks, IP addresses, and services that comprise the […]"
full_description = "About & FAQFrequently Asked QuestionsWhat is the purpose of the DNSDumpster Search?Domain-based reconnaissance allows security teams to map an organization’s Internet infrastructure efficiently. Starting with DNS queries, we can discover and enumerate the external attack surface by correlating DNS records with other Internet-scale datasets. This process reveals networks, IP addresses, and services that comprise the organization’s public-facing infrastructure.This approach serves both defensive and offensive security operators by identifying critical assets and potential entry points. Security teams can prioritize their efforts by focusing on high-value targets and vulnerabilities, while penetration testers can assess potential attack vectors during security assessments.How does DNSDumpster find subdomains for a given domain?DNSDumpster identifies subdomains by leveraging multiple data sources. These include certificate transparency logs, various search engines, and extensive web data repositories like Common Crawl. By aggregating and analyzing data from these sources, DNSDumpster can reveal a broad range of hosts and subdomains associated with a target domain.Can I use the data in my commercial tools or reports?Yes, you may use data from DNSDumpster in your commercial products, tools, or reports, provided that you include clear attribution to DNSDumpster. Proper credit ensures acknowledgment of the data’s source and supports the continued availability of these services.How many queries can I run?With a free DNSDumpster membership, you are limited to 50 queries per day with a 50 result limit. A Plus membership is available, allowing up to 200 queries per day with up to 200 results. This upgraded membership provides more flexibility and is ideal for users who require higher query limits."
