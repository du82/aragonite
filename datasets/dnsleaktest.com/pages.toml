["https://dnsleaktest.com/webrtc.html"]
title = "DNS leak test"
full_description = "WebRTC (Web Real-Time Communication) is a Google-led, open-source technology that enables audio, video, and data sharing between local web browsers and remote systems without the need for plugins. It allows for direct peer-to-peer communication, making it useful for applications like video conferencing and file sharing. Any browser-based request that handles the device's ISP-issued IP address or a VPN provider-issued internal IP address that sends the request to a 3rd-party could be considered a leak. WebRTC implements STUN (Session Traversal Utilities for NAT) and TURN (Traversal Using Relays around NAT), protocols that allows the discovery of the externally assigned IP address. The request to the STUN/TURN server may leak outside the VPN tunnel and expose the assigned IP address(es). A WebRTC leak can also occur via JavaScript when a website accesses the WebRTC API to retrieve the device's local and public IP addresses without their knowledge. WebRTC requires IP addresses to establish peer-to-peer connections, and if not properly managed, it can expose these addresses even when a user is behind a VPN. Google Chrome / Microsoft Edge: Current versions of Chrome and some Chromium-based browsers for desktop systems do not offer a way to disable WebRTC. In the uBlock Origin Settings area (gear icon), check the box to disable JavaScript. This will likely break many modern websites. Brave / Opera: These browsers are based on Chromium, though offer an option to partially mitigate WebRTC leaks. This offers less protection compared to using a 3rd-party extension, so a 3rd-party extension might be preferred: uBlock Origin https://ublockorigin.com/ In the uBlock Origin Settings area (gear icon), check the box to disable JavaScript. This will likely break many modern websites. Tor Browser: Tor Browser is based on Mozilla Firefox and the media.peerconnection.enabled option controlling WebRTC is disabled by default."
year_published = 2025
clearnet = "https://dnsleaktest.com/webrtc.html"
