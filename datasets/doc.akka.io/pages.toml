full_description = "Package akka.stream.javadsl Class Flow<In,​Out,​Mat> java.lang.Object akka.stream.javadsl.Flow<In,​Out,​Mat> All Implemented Interfaces: Graph<FlowShape<In,​Out>,​Mat> public final class Flow<In,​Out,​Mat> extends java.lang.Object implements Graph<FlowShape<In,​Out>,​Mat> A Flow is a set of stream processing steps that has one open input and one open output. Nested Class Summary Nested classes/interfaces inherited from interface akka.stream.Graph Graph.GraphMapMatVal<S extends Shape,​M> Constructor Summary Constructors Constructor Description Flow​(Flow<In,​Out,​Mat> delegate) Method Summary All Methods Static Methods Instance Methods Concrete Methods Deprecated Methods Modifier and Type Method Description Flow<In,​Out,​Mat> addAttributes​(Attributes attr) Add the given attributes to this Flow. <Agg,​Emit>Flow<In,​Emit,​Mat> aggregateWithBoundary​(java.util.function.Supplier<Agg> allocate, Function2<Agg,​Out,​Pair<Agg,​java.lang.Object>> aggregate, Function<Agg,​Emit> harvest, Pair<java.util.function.Predicate<Agg>,​java.time.Duration> emitOnTimer) Aggregate input elements into an arbitrary data structure that can be completed and emitted downstream when custom condition is met which can be triggered by aggregate or timer. Flow<In,​Out,​Mat> alsoTo​(Graph<SinkShape<Out>,​?> that) Attaches the given Sink to this Flow, meaning that elements that passes through will also be sent to the Sink. Flow<In,​Out,​Mat> alsoToAll​(Graph<SinkShape<Out>,​?>... those) Attaches the given Sinks to this Flow, meaning that elements that passes through will also be sent to all those Sinks. Flow<In,​Out,​Mat> alsoToAll​(scala.collection.immutable.Seq<Graph<SinkShape<Out>,​?>> those) Attaches the given Sinks to this Flow, meaning that elements that passes through will also be sent to all those Sinks. <M2,​M3>Flow<In,​Out,​M3> alsoToMat​(Graph<SinkShape<Out>,​M2> that, Function2<Mat,​M2,​M3> matF) Attaches the given Sink to this Flow, meaning that elements that passes through will also be sent to the Sink. <U,​CtxU,​CtxOut>FlowWithContext<U,​CtxU,​Out,​CtxOut,​Mat> asFlowWithContext​(Function2<U,​CtxU,​In> collapseContext, Function<Out,​CtxOut> extractContext) Turns a Flow into a FlowWithContext which manages a context per element along a stream. <S> Flow<In,​S,​Mat> ask​(int parallelism, ActorRef ref, java.lang.Class<S> mapTo, Timeout timeout) Use the ask pattern to send a request-reply message to the target ref actor. <S> Flow<In,​S,​Mat> ask​(ActorRef ref, java.lang.Class<S> mapTo, Timeout timeout) Use the ask pattern to send a request-reply message to the target ref actor. Flow<In,​Out,​Mat> asScala() Converts this Flow to its Scala DSL counterpart Flow<In,​Out,​Mat> async() Put an asynchronous boundary around this Flow Flow<In,​Out,​Mat> async​(java.lang.String dispatcher) Put an asynchronous boundary around this Flow Flow<In,​Out,​Mat> async​(java.lang.String dispatcher, int inputBufferSize) Put an asynchronous boundary around this Flow Flow<In,​Out,​Mat> backpressureTimeout​(java.time.Duration timeout) If the time between the emission of an element and the following downstream demand exceeds the provided timeout, the stream is failed with a BackpressureTimeoutException. <S> Flow<In,​S,​Mat> batch​(long max, Function<Out,​S> seed, Function2<S,​Out,​S> aggregate) Allows a faster upstream to progress independently of a slower subscriber by aggregating elements into batches until the subscriber is ready to accept them. <S> Flow<In,​S,​Mat> batchWeighted​(long max, Function<Out,​java.lang.Long> costFn, Function<Out,​S> seed, Function2<S,​Out,​S> aggregate) Allows a faster upstream to progress independently of a slower subscriber by aggregating elements into batches until the subscriber is ready to accept them. Flow<In,​Out,​Mat> buffer​(int size, OverflowStrategy overflowStrategy) Adds a fixed size buffer in the flow that allows to store elements from a faster upstream until it becomes full. <T> Flow<In,​T,​Mat> collect​(scala.PartialFunction<Out,​T> pf) Transform this stream by applying the given partial function to each of the elements on which the function is defined as they pass through this processing step. <T> Flow<In,​T,​Mat> collectType​(java.lang.Class<T> clazz) Transform this stream by testing the type of each of the elements on which the element is an instance of the provided type as they pass through this processing step. static <I,​O,​M>Flow<I,​O,​java.util.concurrent.CompletionStage<M>> completionStageFlow​(java.util.concurrent.CompletionStage<Flow<I,​O,​M>> flow) Turn a CompletionStage into a flow that will consume the values of the source when the future completes successfully. Flow<In,​Out,​Mat> completionTimeout​(java.time.Duration timeout) If the completion of the stream does not happen until the provided timeout, the stream is failed with a CompletionTimeoutException. <M> Flow<In,​Out,​Mat> concat​(Graph<SourceShape<Out>,​M> that) Concatenate the given Source to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. Flow<In,​Out,​Mat> concatAllLazy​(Graph<SourceShape<Out>,​?>... those) Concatenate the given Sources to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. Flow<In,​Out,​Mat> concatAllLazy​(scala.collection.immutable.Seq<Graph<SourceShape<Out>,​?>> those) Concatenate the given Sources to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. <M> Flow<In,​Out,​Mat> concatLazy​(Graph<SourceShape<Out>,​M> that) Concatenate the given Source to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. <M,​M2>Flow<In,​Out,​M2> concatLazyMat​(Graph<SourceShape<Out>,​M> that, Function2<Mat,​M,​M2> matF) Concatenate the given Source to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. <M,​M2>Flow<In,​Out,​M2> concatMat​(Graph<SourceShape<Out>,​M> that, Function2<Mat,​M,​M2> matF) Concatenate the given Source to this Flow, meaning that once this Flow&rsquo;s input is exhausted and all result elements have been generated, the Source&rsquo;s elements will be produced. Flow<In,​Out,​Mat> conflate​(Function2<Out,​Out,​Out> aggregate) Allows a faster upstream to progress independently of a slower subscriber by conflating elements into a summary until the subscriber is ready to accept them. <S> Flow<In,​S,​Mat> conflateWithSeed​(Function<Out,​S> seed, Function2<S,​Out,​S> aggregate) Allows a faster upstream to progress independently of a slower subscriber by conflating elements into a summary until the subscriber is ready to accept them. <In2> Flow<In2,​Out,​Mat> contramap​(Function<In2,​In> f) Transform this Flow by applying a function to each *incoming* upstream element before it is passed to the Flow static <T> Flow<T,​T,​NotUsed> create() Create a `Flow` which can process elements of type `T`. Flow<In,​Out,​Mat> delay​(java.time.Duration of, DelayOverflowStrategy strategy) Shifts elements emission in time by a specified amount. Flow<In,​Out,​Mat> delayWith​(java.util.function.Supplier<DelayStrategy<Out>> delayStrategySupplier, DelayOverflowStrategy overFlowStrategy) Shifts elements emission in time by an amount individually determined through delay strategy a specified amount. Flow<In,​Out,​Mat> detach() Detaches upstream demand from downstream demand without detaching the stream rates; in other words acts like a buffer of size 1. Flow<In,​Out,​Mat> divertTo​(Graph<SinkShape<Out>,​?> that, Predicate<Out> when) Attaches the given Sink to this Flow, meaning that elements will be sent to the Sink instead of being passed through if the predicate when returns true. <M2,​M3>Flow<In,​Out,​M3> divertToMat​(Graph<SinkShape<Out>,​M2> that, Predicate<Out> when, Function2<Mat,​M2,​M3> matF) Attaches the given Sink to this Flow, meaning that elements will be sent to the Sink instead of being passed through if the predicate when returns true. Flow<In,​Out,​Mat> drop​(long n) Discard the given number of elements at the beginning of the stream. Flow<In,​Out,​Mat> dropWhile​(Predicate<Out> p) Discard elements at the beginning of the stream while predicate is true. Flow<In,​Out,​Mat> dropWithin​(java.time.Duration duration) Discard the elements received within the given duration at beginning of the stream. <U> Flow<In,​U,​Mat> expand​(Function<Out,​java.util.Iterator<U>> expander) Allows a faster downstream to progress independently of a slower upstream by extrapolating elements from an older element until new element comes from the upstream. Flow<In,​Out,​Mat> extrapolate​(Function<Out,​java.util.Iterator<Out>> extrapolator) Allows a faster downstream to progress independent of a slower upstream. Flow<In,​Out,​Mat> extrapolate​(Function<Out,​java.util.Iterator<Out>> extrapolator, Out initial) Allows a faster downstream to progress independent of a slower upstream. Flow<In,​Out,​Mat> filter​(Predicate<Out> p) Only pass on those elements that satisfy the given predicate. Flow<In,​Out,​Mat> filterNot​(Predicate<Out> p) Only pass on those elements that NOT satisfy the given predicate. <T,​M>Flow<In,​T,​Mat> flatMapConcat​(Function<Out,​? extends Graph<SourceShape<T>,​M>> f) Transform each input element into a Source of output elements that is then flattened into the output stream by concatenation, fully consuming one Source after the other. <T,​M>Flow<In,​T,​Mat> flatMapMerge​(int breadth, Function<Out,​? extends Graph<SourceShape<T>,​M>> f) Transform each input element into a Source of output elements that is then flattened into the output stream by merging, where at most breadth substreams are being consumed at any given time. <Out2,​Mat2>Flow<In,​Out2,​Mat> flatMapPrefix​(int n, Function<java.lang.Iterable<Out>,​Flow<Out,​Out2,​Mat2>> f) Takes up to n elements from the stream (less than n only if the upstream completes before emitting n elements), then apply f on these elements in order to obtain a flow, this flow is then materialized and the rest of the input is processed by this flow (similar to via). <Out2,​Mat2,​Mat3>Flow<In,​Out2,​Mat3> flatMapPrefixMat​(int n, Function<java.lang.Iterable<Out>,​Flow<Out,​Out2,​Mat2>> f, Function2<Mat,​java.util.concurrent.CompletionStage<Mat2>,​Mat3> matF) mat version of flatMapPrefix(int, akka.japi.function.Function<java.lang.Iterable<Out>, akka.stream.javadsl.Flow<Out, Out2, Mat2>>), this method gives access to a future materialized value of the downstream flow (as a completion stage). static <Out,​In extends java.util.Optional<Out>>Flow<In,​Out,​NotUsed> flattenOptional() Collect the value of Optional from the elements passing through this flow, empty Optional is filtered out. <T> Flow<In,​T,​Mat> fold​(T zero, Function2<T,​Out,​T> f) Similar to scan but only emits its result when the upstream completes, after which it also completes. <T> Flow<In,​T,​Mat> foldAsync​(T zero, Function2<T,​Out,​java.util.concurrent.CompletionStage<T>> f) Similar to fold but with an asynchronous function. static <I,​O>Flow<I,​O,​NotUsed> fromFunction​(Function<I,​O> f) Creates a [Flow] which will use the given function to transform its inputs to outputs. static <I,​O,​M>Flow<I,​O,​M> fromGraph​(Graph<FlowShape<I,​O>,​M> g) A graph with the shape of a flow logically is a flow, this method makes it so also in type. static <I,​O,​M>Flow<I,​O,​java.util.concurrent.CompletionStage<M>> fromMaterializer​(java.util.function.BiFunction<Materializer,​Attributes,​Flow<I,​O,​M>> factory) Defers the creation of a Flow until materialization. static <I,​O>Flow<I,​O,​NotUsed> fromProcessor​(Creator<org.reactivestreams.Processor<I,​O>> processorFactory) static <I,​O,​Mat>Flow<I,​O,​Mat> fromProcessorMat​(Creator<Pair<org.reactivestreams.Processor<I,​O>,​Mat>> processorFactory) static <I,​O>Flow<I,​O,​NotUsed> fromSinkAndSource​(Graph<SinkShape<I>,​?> sink, Graph<SourceShape<O>,​?> source) Creates a Flow from a Sink and a Source where the Flow's input will be sent to the Sink and the Flow's output will come from the Source. static <I,​O>Flow<I,​O,​NotUsed> fromSinkAndSourceCoupled​(Graph<SinkShape<I>,​?> sink, Graph<SourceShape<O>,​?> source) Allows coupling termination (cancellation, completion, erroring) of Sinks and Sources while creating a Flow from them. static <I,​O,​M1,​M2,​M>Flow<I,​O,​M> fromSinkAndSourceCoupledMat​(Graph<SinkShape<I>,​M1> sink, Graph<SourceShape<O>,​M2> source, Function2<M1,​M2,​M> combine) Allows coupling termination (cancellation, completion, erroring) of Sinks and Sources while creating a Flow from them. static <I,​O,​M1,​M2,​M>Flow<I,​O,​M> fromSinkAndSourceMat​(Graph<SinkShape<I>,​M1> sink, Graph<SourceShape<O>,​M2> source, Function2<M1,​M2,​M> combine) Creates a Flow from a Sink and a Source where the Flow's input will be sent to the Sink and the Flow's output will come from the Source. Attributes getAttributes() <K> SubFlow<In,​Out,​Mat> groupBy​(int maxSubstreams, Function<Out,​K> f) This operation demultiplexes the incoming stream into separate output streams, one for each element key. <K> SubFlow<In,​Out,​Mat> groupBy​(int maxSubstreams, Function<Out,​K> f, boolean allowClosedSubstreamRecreation) This operation demultiplexes the incoming stream into separate output streams, one for each element key. Flow<In,​java.util.List<Out>,​Mat> grouped​(int n) Chunk up this stream into groups of the given size, with the last group possibly smaller than requested due to end-of-stream. Flow<In,​java.util.List<Out>,​Mat> groupedWeighted​(long minWeight, java.util.function.Function<Out,​java.lang.Long> costFn) Chunk up this stream into groups of elements that have a cumulative weight greater than or equal to the minWeight, with the last group possibly smaller than requested minWeight due to end-of-stream. Flow<In,​java.util.List<Out>,​Mat> groupedWeightedWithin​(long maxWeight, int maxNumber, Function<Out,​java.lang.Long> costFn, java.time.Duration duration) Chunk up this stream into groups of elements received within a time window, or limited by the weight and number of the elements, whatever happens first. Flow<In,​java.util.List<Out>,​Mat> groupedWeightedWithin​(long maxWeight, Function<Out,​java.lang.Long> costFn, java.time.Duration duration) Chunk up this stream into groups of elements received within a time window, or limited by the weight of the elements, whatever happens first. Flow<In,​java.util.List<Out>,​Mat> groupedWithin​(int maxNumber, java.time.Duration duration) Chunk up this stream into groups of elements received within a time window, or limited by the given number of elements, whatever happens first. Flow<In,​Out,​Mat> idleTimeout​(java.time.Duration timeout) If the time between two"
