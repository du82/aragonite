Sink static <U,​In>Sink<In,​java.util.concurrent.CompletionStage<U>> fold​(U zero, Function2<U,​In,​U> f) A Sink that will invoke the given function for every received element, giving it its previous output (or the given zero value) and the element as input. static <U,​In>Sink<In,​java.util.concurrent.CompletionStage<U>> foldAsync​(U zero, Function2<U,​In,​java.util.concurrent.CompletionStage<U>> f) A Sink that will invoke the given asynchronous function for every received element, giving it its previous output (or the given zero value) and the element as input. static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> foreach​(Procedure<T> f) A Sink that will invoke the given procedure for each received element. static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> foreachAsync​(int parallelism, Function<T,​java.util.concurrent.CompletionStage<java.lang.Void>> f) A Sink that will invoke the given procedure asynchronously for each received element. static <T,​M>Sink<T,​M> fromGraph​(Graph<SinkShape<T>,​M> g) A graph with the shape of a sink logically is a sink, this method makes it so also in type. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<M>> fromMaterializer​(java.util.function.BiFunction<Materializer,​Attributes,​Sink<T,​M>> factory) Defers the creation of a Sink until materialization. static <In> Sink<In,​NotUsed> fromSubscriber​(org.reactivestreams.Subscriber<In> subs) Helper to create Sink from Subscriber. Attributes getAttributes() static <In> Sink<In,​java.util.concurrent.CompletionStage<In>> head() A Sink that materializes into a CompletionStage of the first value received. static <In> Sink<In,​java.util.concurrent.CompletionStage<java.util.Optional<In>>> headOption() A Sink that materializes into a CompletionStage of the optional first value received. static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> ignore() A Sink that will consume the stream and discard the elements. static <In> Sink<In,​java.util.concurrent.CompletionStage<In>> last() A Sink that materializes into a CompletionStage of the last value received. static <In> Sink<In,​java.util.concurrent.CompletionStage<java.util.Optional<In>>> lastOption() A Sink that materializes into a CompletionStage of the optional last value received. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<M>> lazyCompletionStageSink​(Creator<java.util.concurrent.CompletionStage<Sink<T,​M>>> create) Defers invoking the create function to create a future sink until there is a first element passed from upstream. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<M>> lazyInit​(Function<T,​java.util.concurrent.CompletionStage<Sink<T,​M>>> sinkFactory, Creator<M> fallback) Deprecated. Use 'Sink.lazyCompletionStageSink' in combination with 'Flow.prefixAndTail(1)' instead. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<java.util.Optional<M>>> lazyInitAsync​(Creator<java.util.concurrent.CompletionStage<Sink<T,​M>>> sinkFactory) Deprecated. Use 'Sink.lazyCompletionStageSink' instead. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<M>> lazySink​(Creator<Sink<T,​M>> create) Defers invoking the create function to create a sink until there is a first element passed from upstream. <Mat2> Sink<In,​Mat2> mapMaterializedValue​(Function<Mat,​Mat2> f) Transform only the materialized value of this Sink, leaving all other properties as they were. Sink<In,​Mat> named​(java.lang.String name) Add a name attribute to this Sink. static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> never() A Sink that will always backpressure never cancel and never consume any elements from the stream. static <In> Sink<In,​NotUsed> onComplete​(Procedure<scala.util.Try<Done>> callback) A Sink that when the flow is completed, either through a failure or normal completion, apply the provided function with Success or Failure. Pair<Mat,​Sink<In,​NotUsed>> preMaterialize​(ClassicActorSystemProvider systemProvider) Materializes this Sink, immediately returning (1) its materialized value, and (2) a new Sink that can be consume elements 'into' the pre-materialized one. Pair<Mat,​Sink<In,​NotUsed>> preMaterialize​(Materializer materializer) Materializes this Sink, immediately returning (1) its materialized value, and (2) a new Sink that can be consume elements 'into' the pre-materialized one. static <T> Sink<T,​SinkQueueWithCancel<T>> queue() Creates a Sink that is materialized as an SinkQueueWithCancel. static <T> Sink<T,​SinkQueueWithCancel<T>> queue​(int maxConcurrentPulls) Creates a Sink that is materialized as an SinkQueueWithCancel. static <In> Sink<In,​java.util.concurrent.CompletionStage<In>> reduce​(Function2<In,​In,​In> f) A Sink that will invoke the given function for every received element, giving it its previous output (from the second element) and the element as input. <M> M runWith​(Graph<SourceShape<In>,​M> source, ClassicActorSystemProvider systemProvider) Connect this Sink to a Source and run it. <M> M runWith​(Graph<SourceShape<In>,​M> source, Materializer materializer) Connect this Sink to a Source and run it. static <In> Sink<In,​java.util.concurrent.CompletionStage<java.util.List<In>>> seq() A Sink that keeps on collecting incoming elements until upstream terminates. static <T,​M>Sink<T,​java.util.concurrent.CompletionStage<M>> setup​(java.util.function.BiFunction<ActorMaterializer,​Attributes,​Sink<T,​M>> factory) Deprecated. Use 'fromMaterializer' instead. SinkShape<In> shape() The shape of a graph is all that is externally visible: its inlets and outlets. static <In> Sink<In,​java.util.concurrent.CompletionStage<java.util.List<In>>> takeLast​(int n) A Sink that materializes into a a CompletionStage of List containing the last n collected elements. java.lang.String toString() akka.stream.impl.LinearTraversalBuilder traversalBuilder() INTERNAL API. Sink<In,​Mat> withAttributes​(Attributes attr) Replace the attributes of this Sink with the given ones. Methods inherited from class java.lang.Object clone, equals, finalize, getClass, hashCode, notify, notifyAll, wait, wait, wait Constructor Detail Sink public Sink​(Sink<In,​Mat> delegate) Method Detail fold public static <U,​In> Sink<In,​java.util.concurrent.CompletionStage<U>> fold​(U zero, Function2<U,​In,​U> f) A Sink that will invoke the given function for every received element, giving it its previous output (or the given zero value) and the element as input. The returned CompletionStage will be completed with value of the final function evaluation when the input stream ends, or completed with Failure if there is a failure is signaled in the stream. foldAsync public static <U,​In> Sink<In,​java.util.concurrent.CompletionStage<U>> foldAsync​(U zero, Function2<U,​In,​java.util.concurrent.CompletionStage<U>> f) A Sink that will invoke the given asynchronous function for every received element, giving it its previous output (or the given zero value) and the element as input. The returned CompletionStage will be completed with value of the final function evaluation when the input stream ends, or completed with Failure if there is a failure is signaled in the stream. collect public static <U,​In> Sink<In,​java.util.concurrent.CompletionStage<U>> collect​(java.util.stream.Collector<In,​?,​U> collector) Creates a sink which materializes into a CompletionStage which will be completed with a result of the Java Collector transformation and reduction operations. This allows usage of Java streams transformations for reactive streams. The Collector will trigger demand downstream. Elements emitted through the stream will be accumulated into a mutable result container, optionally transformed into a final representation after all input elements have been processed. The Collector can also do reduction at the end. Reduction processing is performed sequentially. reduce public static <In> Sink<In,​java.util.concurrent.CompletionStage<In>> reduce​(Function2<In,​In,​In> f) A Sink that will invoke the given function for every received element, giving it its previous output (from the second element) and the element as input. The returned CompletionStage will be completed with value of the final function evaluation when the input stream ends, or completed with Failure if there is a failure signaled in the stream. If the stream is empty (i.e. completes before signalling any elements), the reduce operator will fail its downstream with a NoSuchElementException, which is semantically in-line with that Scala's standard library collections do in such situations. fromSubscriber public static <In> Sink<In,​NotUsed> fromSubscriber​(org.reactivestreams.Subscriber<In> subs) Helper to create Sink from Subscriber. cancelled public static <T> Sink<T,​NotUsed> cancelled() A Sink that immediately cancels its upstream after materialization. ignore public static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> ignore() A Sink that will consume the stream and discard the elements. never public static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> never() A Sink that will always backpressure never cancel and never consume any elements from the stream. asPublisher public static <T> Sink<T,​org.reactivestreams.Publisher<T>> asPublisher​(AsPublisher fanout) A Sink that materializes into a Publisher. If fanout is true, the materialized Publisher will support multiple Subscribers and the size of the inputBuffer configured for this operator becomes the maximum number of elements that the fastest Subscriber can be ahead of the slowest one before slowing the processing down due to back pressure. If fanout is false then the materialized Publisher will only support a single Subscriber and reject any additional Subscribers. foreach public static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> foreach​(Procedure<T> f) A Sink that will invoke the given procedure for each received element. The sink is materialized into a CompletionStage which will be completed with Success when reaching the normal end of the stream, or completed with Failure if there is a failure signaled in the stream. foreachAsync public static <T> Sink<T,​java.util.concurrent.CompletionStage<Done>> foreachAsync​(int parallelism, Function<T,​java.util.concurrent.CompletionStage<java.lang.Void>> f) A Sink that will invoke the given procedure asynchronously for each received element. The sink is materialized into a CompletionStage which will be completed with Success when reaching the normal end of the stream, or completed with Failure if there is a failure signaled in the stream. onComplete public static <In> Sink<In,​NotUsed> onComplete​(Procedure<scala.util.Try<Done>> callback) A Sink that when the flow is completed, either through a failure or normal completion, apply the provided function with Success or Failure. head public static <In> Sink<In,​java.util.concurrent.CompletionStage<In>> head() A Sink that materializes into a CompletionStage of the first value received. If the stream completes before signaling at least a s"
