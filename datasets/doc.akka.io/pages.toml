["https://doc.akka.io/libraries/akka-core/current/typed/index-persistence-durable-state.html"]
title = "Persistence (Durable State) • Akka Documentation"
description = "Durable state with Akka Persistence enables actors to persist the latest version of the state. This persistence is used for recovery on failure, or when migrating within a cluster."
