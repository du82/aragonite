["https://doc.akka.io/libraries"]
title = "Akka Libraries :: Akka Documentation"
full_description = 'Akka Libraries Akka provides a set of libraries for building and running responsive applications. Key libraries and resources are outlined to help you get started. Find the latest Akka library versions at Akka library versions. Start Learning First example: Create a simple "Hello world!" example. Get started guide: Learn Akka fundamentals with an IoT project. Microservices guide: Build resilient and scalable microservices. Foundations Actors: A model for concurrency and distribution without all the pain of threading primitives. Streams: An intuitive and safe way to do asynchronous, non-blocking, backpressured stream processing. Event Sourcing: Enables stateful actors to persist their state changes, so that the state can be recovered when an actor is restarted. Durable State: Enables stateful actors to persist their latest state, so that it can be recovered when an actor is restarted. Projections: Build a projected model out of streams of events. Communication and Integrations HTTP: Modern, fast, asynchronous, streaming-first HTTP server and client. gRPC: Build typed, streaming gRPC services. Alpakka: Streaming integrations with Kafka and other technologies. Akka Persistence R2DBC: Use Postgres-compatible databases with Akka Persistence. Cassandra Persistence: Use Cassandra databases with Akka Persistence. Resilience and Distribution Cluster: Boost resilience with distribution across multiple nodes. Cluster Sharding: Distribute actors across your cluster. Distributed Data: Eventually consistent, low latency data. Architecture Distributed Cluster: Connect Akka services built on Akka libraries across geographical locations for lower latency and higher availability. Edge: Move your endpoints to the edge of the cloud for lower latency and higher availability. Akka Edge Rust extends the power of Akka’s event-driven model to resource-constrained devices. Operations and Observability Management: Extensions for operating Akka on cloud providers and Kubernetes. Diagnostics: Identify configuration and operational issues in your Akka application. Insights: Intelligent monitoring and observability purpose-built for Akka. akka version'
