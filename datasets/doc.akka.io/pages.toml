["https://doc.akka.io/java/component-and-service-calls.html"]
title = "Component and service calls :: Akka Documentation"
full_description = 'Component and service calls An Akka service comprises many components. Such components might depend on one another, on other Akka services or even external services. This section describes how to call other components and services from within an Akka service. Akka components Since Akka is an auto-scaling solution, components can be distributed across many nodes within the same service. That’s why calls between Akka components is done via a client rather than through normal method calls, the receiving component instance may be on the same node, but it may also be on a different node. Requests and responses are always serialized to JSON between the client and the component. Component Client The akka.javasdk.client.ComponentClient is a utility for making calls between components in a type-safe way. To use the ComponentClient you need to inject it into your component via the constructor: CounterEndpoint.java @Acl(allow = @Acl.Matcher(principal = Acl.Principal.INTERNET)) @HttpEndpoint("/counter") public class CounterEndpoint { private final ComponentClient componentClient; public CounterEndpoint(ComponentClient componentClient) { (1) this.componentClient = componentClient; } @Get("/{counterId}") public CompletionStage<Integer> get(String counterId) { return componentClient.forEventSourcedEntity(counterId) (2) .method(CounterEntity::get) .invokeAsync(); (3) } @Post("/{counterId}/increase/{value}") public CompletionStage<HttpResponse> increase(String counterId, Integer value) { return componentClient.forEventSourcedEntity(counterId) .method(CounterEntity::increase) .invokeAsync(value) .thenApply(__ -> ok()); (4) } } 1 Accept the ComponentClient as a constructor argument, keep it in a field. 2 Use a specific request builder for the component you want to call 3 Invoking the method returns a CompletionStage<T> where T is what the component eventually returns. 4 Adapt the response rather than returning it as is. In this case discarding the response value, and respond OK without a response body. The component client can call command handlers on Event Sourced Entities, Key Value Entities, Workflows, Timed Actions, and query methods on Views. The component client is available for injection only in Service Setup, Endpoints, Consumers, Timed Actions, and Workflows. For more information, see dependency injection. Akka services Calling other Akka services in the same project is done by invoking them using an HTTP or a GRPC client depending on what type of endpoints the service provides. Over HTTP The service is identified by the name it has been deployed. Akka takes care of routing requests to the service and keeping the data safe by encrypting the connection and handling authentication for you. In this sample we will make an action that does a call to the Key Value Entity Counter service, deployed with the service name counter. The SDK provides akka.javasdk.http.HttpClientProvider which provides HTTP client instances for calling other services. In our delegating service implementation: DelegatingServiceEndpoint.java @Acl(allow = @Acl.Matcher(service = "*")) @HttpEndpoint public class DelegatingServiceEndpoint { private final HttpClient httpClient; public DelegatingServiceEndpoint(HttpClientProvider componentClient) { (1) this.httpClient = componentClient.httpClientFor("counter"); (2) } // model for the JSON we accept record IncreaseRequest(int increaseBy) {} // model for the JSON the upstream service responds with record Counter(int value) {} @Post("/delegate/counter/{counterId}/increase") public CompletionStage<String> addAndReturn(String counterId, IncreaseRequest request) { CompletionStage<String> result = httpClient.POST("/counter/" + counterId + "/increase") (3) .withRequestBody(request) .responseBodyAs(Counter.class) .invokeAsync() (4) .thenApply(response -> { (5) if (response.status().isSuccess()) { return "New counter vaue: " + response.body().value; } else { throw new RuntimeException("Counter returned unexpected status: " + response.status()); } }); return result; } } 1 Accept a HttpClientProvider parameter for the constructor 2 Use it to look up a client for the counter service 3 Use the HttpClient to prepare a REST call to the counter service 4 Invoking the call will return a CompletionStage<StrictResponse<T>> with details about the result as well as the deserialized response body. 5 Handle the response, which may be successful, or an error The HTTP client provider is only available for injection in the following types of components: HTTP Endpoints, gRPC Endpoints, Workflows, Consumers and Timed Actions. External HTTP services Calling HTTP services deployed on different Akka projects or any other external HTTP server is also done with the HttpClientProvider. Instead of a service name, the protocol and full server name is used when calling httpClientFor. For example https://example.com or http://example.com. CallExternalServiceEndpoint.java package com.example.callanotherservice; import akka.javasdk.annotations.Acl; import akka.javasdk.annotations.http.Get; import akka.javasdk.annotations.http.HttpEndpoint; import akka.javasdk.http.HttpClient; import akka.javasdk.http.HttpClientProvider; import akka.javasdk.http.StrictResponse; import java.util.List; import java.util.concurrent.CompletionStage; import java.util.stream.Collectors; @HttpEndpoint @Acl(allow = @Acl.Matcher(principal = Acl.Principal.ALL)) public class CallExternalServiceEndpoint { private final HttpClient httpClient; public record PeopleInSpace(List<Astronaut> people, int number, String message) {} public record Astronaut(String craft, String name) {} public record AstronautsResponse(List<String> astronautNames) {} public CallExternalServiceEndpoint(HttpClientProvider httpClient) { (1) this.httpClient = httpClient.httpClientFor("http://api.open-notify.org"); (2) } @Get("/iss-astronauts") public CompletionStage<AstronautsResponse> issAstronauts() { CompletionStage<StrictResponse<PeopleInSpace>> asyncResponse = httpClient.GET("/astros.json")(3) .responseBodyAs(PeopleInSpace.class) (4) .invokeAsync(); return asyncResponse.thenApply(peopleInSpaceResponse -> { (5) var astronautNames = peopleInSpaceResponse.body().people.stream() .filter(astronaut -> astronaut.craft.equals("ISS")) .map(astronaut -> astronaut.name) .collect(Collectors.toList()); return new AstronautsResponse(astronautNames); (6) }); } } 1 Accept a HttpClientProvider parameter for the constructor 2 Look up a HttpClient for a service using http protocol and server name. 3 Issue a GET call to the path /astros.json on the server 4 Specify a class to parse the response body into 5 Once the call completes, handle the response. 6 Return an adapted result object which will be turned into a JSON response. Over gRPC The service is identified by the name it has been deployed. Akka takes care of routing requests to the service and keeping the data safe by encrypting the connection and handling authentication for you. In this sample we will make an endpoint that does a call to the gRPC endpoints customer registry service, deployed with the service name customer-registry. The SDK provides akka.javasdk.grpc.GrpcClientProvider which provides gRPC client instances for calling other services. To consume a gRPC service, the service protobuf descriptor must be added in the src/proto directory of the project, this triggers generation of a client interface and Java classes for all the message types used as requests and responses for methods in the service. Since the service protobuf descriptors need to be shared between the provider service and the consuming service, one simple option could be to copy the service descriptions to each service that needs them. It is also possible to use a shared library with the protobuf descriptors. In our delegating service implementation: DelegateCustomerGrpcEndpointImpl.java @GrpcEndpoint public class DelegateCustomerGrpcEndpointImpl implements DelegateCustomerGrpcEndpoint { private final Logger log = LoggerFactory.getLogger(getClass()); private CustomerGrpcEndpointClient customerService; public DelegateCustomerGrpcEndpointImpl(GrpcClientProvider clientProvider) { (1) customerService = clientProvider.grpcClientFor(CustomerGrpcEndpointClient.class, "customer-registry"); (2) } @Override public CompletionStage<CreateCustomerResponse> createCustomer(CreateCustomerRequest in) { log.info("Delegating customer creation to upstream gRPC service: {}", in); if (in.getCustomerId().isEmpty()) throw new GrpcServiceException(Status.INVALID_ARGUMENT.augmentDescription("No id specified")); return customerService .createCustomer(in) (3) .handleAsync((response, ex) -> { if (ex != null) { throw new RuntimeException("Delegate call to create upstream customer failed", ex); } else { return response; } }); } } 1 Accept a GrpcClientProvider parameter for the constructor 2 Use the generated gRPC client interface for the service CustomerGrpcEndpointClient.class and the service name customer-registry to look up a client. 3 Use the client to call the other service and return a CompletionStage<CreateCustomerResponse> Since the called service and the DelegateCustomerGrpcEndpoint share request and response protocol, no further transformation of the request or response is needed here. For dev mode and in tests, providing a config override in application.conf like for external calls is possible, however when deployed such configuration is ignored. The gRPC client provider is only available for injection in the following types of components: HTTP Endpoints, gRPC endpoints, Workflows, Consumers and Timed Actions. External gRPC services Calling gRPC services deployed on different Akka projects or any other external gRPC server is also done with the GrpcClientProvider. Instead of a service name, the protocol and fully qualified DNS name of the service is used when calling grpcClientFor. For example hellogrpc.example.com. CallExternalGrpcEndpointImpl.java @GrpcEndpoint @Acl(allow = @Acl.Matcher(principal = Acl.Principal.ALL)) public class CallExternalGrpcEndpointImpl implements CallExternalGrpcEndpoint { private final ExampleGrpcEndpointClient external; public CallExternalGrpcEndpointImpl(GrpcClientProvider clientProvider) { (1) external = clientProvider.grpcClientFor(ExampleGrpcEndpointClient.class, "hellogrpc.example.com"); (2) } @Override public CompletionStage<HelloReply> callExternalService(HelloRequest in) { return external.sayHello(in); (3) } } 1 Accept a GrpcClientProvider parameter for the constructor 2 Use the generated gRPC client interface for the service ExampleGrpcEndpointClient.class and the service name doc-snippets to look up a client. ExampleGrpcEndpointClient.class. 3 Use the client to call the other service and return a CompletionStage<HelloReply> Since the called service and the DelegatingGrpcEndpoint share request and response protocol, no further transformation of the request or response is needed here. The service is expected to accept HTTPS connections and run on the standard HTTPS port (443). For calling a service on a nonstandard port, or served unencrypted (not recommended) it is possible to define configuration overrides in application.conf (or application-test.conf specifically for tests): application.conf akka.javasdk.grpc.client."hellogrpc.example.com" { # configure external call, to call back to self host = "localhost" port = 9000 use-tls = false } Consumers Configure message brokers'
