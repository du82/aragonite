title = "Introduction to Actors • Akka Documentation"
description = "The Actor model, managing internal state and changing behavior in Akka Actors."
full_description = 'Introduction to Actors You are viewing the documentation for the new actor APIs, to view the Akka Classic documentation, see Classic Actors. Module info The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } To use Akka Actors, add the following dependency in your project:sbtval AkkaVersion = "2.10.2" libraryDependencies ++= Seq( "com.typesafe.akka" %% "akka-actor-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-actor-testkit-typed" % AkkaVersion % Test )Maven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor-typed_${scala.binary.version}</artifactId> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor-testkit-typed_${scala.binary.version}</artifactId> <scope>test</scope> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-actor-typed_${versions.ScalaBinary}" testImplementation "com.typesafe.akka:akka-actor-testkit-typed_${versions.ScalaBinary}" } Both the Java and Scala DSLs of Akka modules are bundled in the same JAR. For a smooth development experience, when using an IDE such as Eclipse or IntelliJ, you can disable the auto-importer from suggesting javadsl imports when working in Scala, or viceversa. See IDE Tips. Project Info: Akka Actors (typed) Artifactcom.typesafe.akka akka-actor-typed 2.10.2 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.actor.typed LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 2.6.0, 2019-11-06 Home pagehttps://akka.io/ API documentation API (Scaladoc) API (Javadoc) Forums Akka Discuss Release notesAkka release notes IssuesGithub issues Sourceshttps://github.com/akka/akka Akka Actors The Actor Model provides a higher level of abstraction for writing concurrent and distributed systems. It alleviates the developer from having to deal with explicit locking and thread management, making it easier to write correct concurrent and parallel systems. Actors were defined in the 1973 paper by Carl Hewitt but have been popularized by the Erlang language, and used for example at Ericsson with great success to build highly concurrent and reliable telecom systems. The API of Akka’s Actors has borrowed some of its syntax from Erlang. Note 🎓 For a deeper understanding of the Actor Model, consider the free online course Actor Fundamentals in Akkademy. First example If you are new to Akka we recommend watching the short introduction video to Akka actors. This sample can be downloaded and includes Mavensbt project with the needed dependencies: Scala akka-quickstart-scala.zip Java akka-quickstart-java.zip It is helpful to become familiar with the foundational, external and internal ecosystem of your Actors, to see what you can leverage and customize as needed, see Actor Systems and Actor References, Paths and Addresses. As discussed in Actor Systems Actors are about sending messages between independent units of computation, but what does that look like? In all of the following these imports are assumed: Scala copysourceimport akka.actor.typed.ActorRef import akka.actor.typed.ActorSystem import akka.actor.typed.Behavior import akka.actor.typed.scaladsl.Behaviors Java copysourceimport akka.actor.typed.ActorRef; import akka.actor.typed.Behavior; import akka.actor.typed.javadsl.AbstractBehavior; import akka.actor.typed.javadsl.ActorContext; import akka.actor.typed.javadsl.Behaviors; import akka.actor.typed.javadsl.Receive; With these in place we can define our first Actor, and it will say hello! Scala copysourceobject HelloWorld { final case class Greet(whom: String, replyTo: ActorRef[Greeted]) final case class Greeted(whom: String, from: ActorRef[Greet]) def apply(): Behavior[Greet] = Behaviors.receive { (context, message) => context.log.info("Hello {}!", message.whom) message.replyTo ! Greeted(message.whom, context.self) Behaviors.same } } Java copysourcepublic class HelloWorld extends AbstractBehavior<HelloWorld.Greet> { public static record Greet(String whom, ActorRef<Greeted> replyTo) {} public static record Greeted(String whom, ActorRef<Greet> from) {} public static Behavior<Greet> create() { return Behaviors.setup(HelloWorld::new); } private HelloWorld(ActorContext<Greet> context) { super(context); } @Override public Receive<Greet> createReceive() { return newReceiveBuilder().onMessage(Greet.class, this::onGreet).build(); } private Behavior<Greet> onGreet(Greet command) { getContext().getLog().info("Hello {}!", command.whom); command.replyTo.tell(new Greeted(command.whom, getContext().getSelf())); return this; } } This small piece of code defines two message types, one for commanding the Actor to greet someone and one that the Actor will use to confirm that it has done so. The Greet type contains not only the information of whom to greet, it also holds an ActorRefActorRef that the sender of the message supplies so that the HelloWorld Actor can send back the confirmation message. The behavior of the Actor is defined as the Greeter with the help of the receivereceive behavior factory. Processing the next message then results in a new behavior that can potentially be different from this one. State is updated by returning a new behavior that holds the new immutable state. In this case we don’t need to update any state, so we return samesame, which means the next behavior is “the same as the current one”. The type of the messages handled by this behavior is declared to be of class Greet., meaning that message argument is also typed as such. This is why we can access the whom and replyTo members without needing to use a pattern match. Typically, an actor handles more than one specific message type where all of them directly or indirectly extendimplement a common traitinterface. On the last line we see the HelloWorld Actor send a message to another Actor, which is done using the ! operator (pronounced “bang” or “tell”)tell method. It is an asynchronous operation that doesn’t block the caller’s thread. Since the replyTo address is declared to be of type ActorRef[Greeted]ActorRef<Greeted>, the compiler will only permit us to send messages of this type, other usage will be a compiler error. The accepted message types of an Actor together with all reply types defines the protocol spoken by this Actor; in this case it is a simple request–reply protocol but Actors can model arbitrarily complex protocols when needed. The protocol is bundled together with the behavior that implements it in a nicely wrapped scope—the HelloWorld objectclass. As Carl Hewitt said, one Actor is no Actor — it would be quite lonely with nobody to talk to. We need another Actor that interacts with the Greeter. Let’s make a HelloWorldBot that receives the reply from the Greeter and sends a number of additional greeting messages and collect the replies until a given max number of messages have been reached. Scala copysourceobject HelloWorldBot { def apply(max: Int): Behavior[HelloWorld.Greeted] = { bot(0, max) } private def bot(greetingCounter: Int, max: Int): Behavior[HelloWorld.Greeted] = Behaviors.receive { (context, message) => val n = greetingCounter + 1 context.log.info("Greeting {} for {}", n, message.whom) if (n == max) { Behaviors.stopped } else { message.from ! HelloWorld.Greet(message.whom, context.self) bot(n, max) } } } Java copysourcepublic class HelloWorldBot extends AbstractBehavior<HelloWorld.Greeted> { public static Behavior<HelloWorld.Greeted> create(int max) { return Behaviors.setup(context -> new HelloWorldBot(context, max)); } private final int max; private int greetingCounter; private HelloWorldBot(ActorContext<HelloWorld.Greeted> context, int max) { super(context); this.max = max; } @Override public Receive<HelloWorld.Greeted> createReceive() { return newReceiveBuilder().onMessage(HelloWorld.Greeted.class, this::onGreeted).build(); } private Behavior<HelloWorld.Greeted> onGreeted(HelloWorld.Greeted message) { greetingCounter++; getContext().getLog().info("Greeting {} for {}", greetingCounter, message.from()); if (greetingCounter == max) { return Behaviors.stopped(); } else { message.from().tell(new HelloWorld.Greet(message.whom(), getContext().getSelf())); return this; } } } Note how this Actor manages the counter by changing the behavior for each Greeted reply rather than using any variables.Note how this Actor manages the counter with an instance variable. No concurrency guards such as synchronized or AtomicInteger are needed since an actor instance processes one message at a time. A third actor spawns the Greeter and the HelloWorldBot and starts the interaction between those. Scala copysourceobject HelloWorldMain { final case class SayHello(name: String) def apply(): Behavior[SayHello] = Behaviors.setup { context => val greeter = context.spawn(HelloWorld(), "greeter") Behaviors.receiveMessage { message => val replyTo = context.spawn(HelloWorldBot(max = 3), message.name) greeter ! HelloWorld.Greet(message.name, replyTo) Behaviors.same } } } Java copysourcepublic class HelloWorldMain extends AbstractBehavior<HelloWorldMain.SayHello> { public static record SayHello(String name) {} public static Behavior<SayHello> create() { return Behaviors.setup(HelloWorldMain::new); } private final ActorRef<HelloWorld.Greet> greeter; private HelloWorldMain(ActorContext<SayHello> context) { super(context); greeter = context.spawn(HelloWorld.create(), "greeter"); } @Override public Receive<SayHello> createReceive() { return newReceiveBuilder().onMessage(SayHello.class, this::onSayHello).build(); } private Behavior<SayHello> onSayHello(SayHello command) { ActorRef<HelloWorld.Greeted> replyTo = getContext().spawn(HelloWorldBot.create(3), command.name); greeter.tell(new HelloWorld.Greet(command.name, replyTo)); return this; } } Now we want to try out this Actor, so we must start an ActorSystem to host it: Scala copysourceval system: ActorSystem[HelloWorldMain.SayHello] = ActorSystem(HelloWorldMain(), "hello") system ! HelloWorldMain.SayHello("World") system ! HelloWorldMain.SayHello("Akka") Java copysourcefinal ActorSystem<SayHello> system = ActorSystem.create(HelloWorldMain.create(), "hello"); system.tell(new HelloWorldMain.SayHello("World")); system.tell(new HelloWorldMain.SayHello("Akka")); We start an Actor system from the defined HelloWorldMain behavior and send two SayHello messages that will kick-off the interaction between two separate HelloWorldBot actors and the single Greeter actor. An application normally consists of a single ActorSystemActorSystem, running many actors, per JVM. The console output may look like this: [INFO] [03/13/2018 15:50:05.814] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/greeter] Hello World! [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/greeter] Hello Akka! [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-2] [akka://hello/user/World] Greeting 1 for World [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/Akka] Greeting 1 for Akka [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-5] [akka://hello/user/greeter] Hello World! [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-5] [akka://hello/user/greeter] Hello Akka! [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/World] Greeting 2 for World [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-5] [akka://hello/user/greeter] Hello World! [INFO] [03/13/2018 15:50:05.815] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/Akka] Greeting 2 for Akka [INFO] [03/13/2018 15:50:05.816] [hello-akka.actor.default-dispatcher-5] [akka://hello/user/greeter] Hello Akka! [INFO] [03/13/2018 15:50:05.816] [hello-akka.actor.default-dispatcher-4] [akka://hello/user/World] Greeting 3 for World [INFO] [03/13/2018 15:50:05.816] [hello-akka.actor.default-dispatcher-6] [akka://hello/user/Akka] Greeting 3 for Akka You will also need to add a logging dependency to see that output when running.Note 🎓 For a deeper introduction to actors, consider the free online courses Akka Basics for JavaAkka Basics for Scala) in Akkademy. A More Complex Example The next example is more realistic and demonstrates some important patterns: Using a sealed trait and case class/objectsan interface and classes implementing that interface to represent multiple messages an actor can receive Handle sessions by using child actors Handling state by changing behavior Using multiple actors to represent different parts of a protocol in a type safe way Functional Style First we will show this example in a functional style, and then the same example is shown with an Object-oriented style. Which style you choose to use is a matter of taste and both styles can be mixed depending on which is best for a specific actor. Considerations for the choice is provided in the Style Guide. Consider an Actor that runs a chat room: client Actors may connect by sending a message that contains their screen name and then they can post messages. The chat room Actor will disseminate all posted messages to all currently connected client Actors. The protocol definition could look like the following: Scala copysourceobject ChatRoom { sealed trait RoomCommand final case class GetSession(screenName: String, replyTo: ActorRef[SessionEvent]) extends RoomCommand sealed trait SessionEvent final case class SessionGranted(handle: ActorRef[PostMessage]) extends SessionEvent final case class SessionDenied(reason: String) extends SessionEvent final case class MessagePosted(screenName: String, message: String) extends SessionEvent sealed trait SessionCommand final case class PostMessage(message: String) extends SessionCommand private final case class NotifyClient(message: MessagePosted) extends SessionCommand } Java copysourcestatic interface RoomCommand {} public static final class GetSession implements RoomCommand { public final String screenName; public final ActorRef<SessionEvent> replyTo; publi'
