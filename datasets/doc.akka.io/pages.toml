title = "JwtClaims"
description = """
public interface JwtClaims
Representation of JWT claims that have been validated and extracted from the bearer token of a
 request."""
full_description = '''Package akka.javasdk Interface JwtClaims public interface JwtClaims Representation of JWT claims that have been validated and extracted from the bearer token of a request. Method Summary All MethodsInstance MethodsAbstract Methods Modifier and Type Method Description Iterable<String> allClaimNames() Returns the names of all the claims in this request. Map<String,String> asMap() Returns all the claims as a map of strings to strings. Optional<String> audience() Get the audience, that is, the aud claim, as described in RFC 7519 section 4.1.3. Optional<Instant> expirationTime() Get the expiration time, that is, the exp claim, as described in RFC 7519 section 4.1.4. Optional<Boolean> getBoolean(String name) Get the boolean claim with the given name. Optional<List<Boolean>> getBooleanList(String name) Get the boolean list claim with the given name. Optional<Double> getDouble(String name) Get the double claim with the given name. Optional<List<Double>> getDoubleList(String name) Get the double list claim with the given name. Optional<Integer> getInteger(String name) Get the integer claim with the given name. Optional<List<Integer>> getIntegerList(String name) Get the integer list claim with the given name. Optional<Long> getLong(String name) Get the long claim with the given name. Optional<List<Long>> getLongList(String name) Get the long list claim with the given name. Optional<Instant> getNumericDate(String name) Get the numeric data claim with the given name. Optional<List<Instant>> getNumericDateList(String name) Get the numeric date list claim with the given name. Optional<com.fasterxml.jackson.databind.JsonNode> getObject(String name) Get the object claim with the given name. Optional<List<com.fasterxml.jackson.databind.JsonNode>> getObjectList(String name) Get the object list claim with the given name. Optional<String> getString(String name) Get the string claim with the given name. Optional<List<String>> getStringList(String name) Get the string list claim with the given name. boolean hasClaims() Does this request have any claims that have been validated? Optional<Instant> issuedAt() Get the issued at, that is, the iat claim, as described in RFC 7519 section 4.1.6. Optional<String> issuer() Get the issuer, that is, the iss claim, as described in RFC 7519 section 4.1.1. Optional<String> jwtId() Get the JWT ID, that is, the jti claim, as described in RFC 7519 section 4.1.7. Optional<Instant> notBefore() Get the not before, that is, the nbf claim, as described in RFC 7519 section 4.1.5. Optional<String> subject() Get the subject, that is, the sub claim, as described in RFC 7519 section 4.1.2. Method Details allClaimNames Iterable<String> allClaimNames() Returns the names of all the claims in this request. Returns: The names of all the claims in this request. asMap Map<String,String> asMap() Returns all the claims as a map of strings to strings. Note that all values will be encoded to JSON. This means that if the value is a string, it will include the quotes. E.g. "\"my-string-claim\"" for a string claim. Returns: All the claims represented as a map of string claim names to string values containing a JSON representation of its value. hasClaims boolean hasClaims() Does this request have any claims that have been validated? Returns: true if there are claims. issuer Optional<String> issuer() Get the issuer, that is, the iss claim, as described in RFC 7519 section 4.1.1. Returns: the issuer, if present. See Also: RFC 7519 section 4.1.1 subject Optional<String> subject() Get the subject, that is, the sub claim, as described in RFC 7519 section 4.1.2. Returns: the subject, if present. See Also: RFC 7519 section 4.1.2 audience Optional<String> audience() Get the audience, that is, the aud claim, as described in RFC 7519 section 4.1.3. Returns: the audience, if present. See Also: RFC 7519 section 4.1.3 expirationTime Optional<Instant> expirationTime() Get the expiration time, that is, the exp claim, as described in RFC 7519 section 4.1.4. Returns: the expiration time, if present. Returns empty if the value is not a numeric date. See Also: RFC 7519 section 4.1.4 notBefore Optional<Instant> notBefore() Get the not before, that is, the nbf claim, as described in RFC 7519 section 4.1.5. Returns: the not before, if present. Returns empty if the value is not a numeric date. See Also: RFC 7519 section 4.1.5 issuedAt Optional<Instant> issuedAt() Get the issued at, that is, the iat claim, as described in RFC 7519 section 4.1.6. Returns: the issued at, if present. Returns empty if the value is not a numeric date. See Also: RFC 7519 section 4.1.6 jwtId Optional<String> jwtId() Get the JWT ID, that is, the jti claim, as described in RFC 7519 section 4.1.7. Returns: the JWT ID, if present. See Also: RFC 7519 section 4.1.7 getString Optional<String> getString(String name) Get the string claim with the given name. Note that if the claim with the given name is not a string claim, this will return the JSON encoding of it. Parameters: name - The name of the claim. Returns: The string claim, if present. getInteger Optional<Integer> getInteger(String name) Get the integer claim with the given name. Parameters: name - The name of the claim. Returns: The integer claim, if present. Returns empty if the claim is not an integer or can't be parsed as an integer. getLong Optional<Long> getLong(String name) Get the long claim with the given name. Parameters: name - The name of the claim. Returns: The long claim, if present. Returns empty if the claim is not a long or can't be parsed as an long. getDouble Optional<Double> getDouble(String name) Get the double claim with the given name. Parameters: name - The name of the claim. Returns: The double claim, if present. Returns empty if the claim is not a double or can't be parsed as an double. getBoolean Optional<Boolean> getBoolean(String name) Get the boolean claim with the given name. Parameters: name - The name of the claim. Returns: The boolean claim, if