full_description = "Package akka.stream.javadsl Class Sink<In,​Mat> java.lang.Object akka.stream.javadsl.Sink<In,​Mat> All Implemented Interfaces: Graph<SinkShape<In>,​Mat> public final class Sink<In,​Mat> extends java.lang.Object implements Graph<SinkShape<In>,​Mat> Java API A Sink is a set of stream processing steps that has one open input. Can be used as a Subscriber Nested Class Summary Nested classes/interfaces inherited from interface akka.stream.Graph Graph.GraphMapMatVal<S extends Shape,​M> Constructor Summary Constructors Constructor Description Sink​(Sink<In,​Mat> delegate) Method Summary All Methods Static Methods Instance Methods Concrete Methods Deprecated Methods Modifier and Type Method Description static <In> Sink<In,​NotUsed> actorRef​(ActorRef ref, java.lang.Object onCompleteMessage) Sends the elements of the stream to the given ActorRef. static <In> Sink<In,​NotUsed> actorRefWithAck​(ActorRef ref, java.lang.Object onInitMessage, java.lang.Object ackMessage, java.lang.Object onCompleteMessage, Function<java.lang.Throwable,​java.lang.Object> onFailureMessage) Deprecated. Use actorRefWithBackpressure instead static <In> Sink<In,​NotUsed> actorRefWithBackpressure​(ActorRef ref, java.lang.Object onInitMessage, java.lang.Object onCompleteMessage, Function<java.lang.Throwable,​java.lang.Object> onFailureMessage) Sends the elements of the stream to the given ActorRef that sends back back-pressure signal. static <In> Sink<In,​NotUsed> actorRefWithBackpressure​(ActorRef ref, java.lang.Object onInitMessage, java.lang.Object ackMessage, java.lang.Object onCompleteMessage, Function<java.lang.Throwable,​java.lang.Object> onFailureMessage) Sends the elements of the stream to the given ActorRef that sends back back-pressure signal. Sink<In,​Mat> addAttributes​(Attributes attr) Add the given attributes to this Sink. static <T> Sink<T,​org.reactivestreams.Publisher<T>> asPublisher​(AsPublisher fanout) A Sink that materializes into a Publisher. Sink<In,​Mat> asScala