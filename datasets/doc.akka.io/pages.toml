["https://doc.akka.io/java/event-sourced-entities.html"]
title = "Implementing Event Sourced Entities :: Akka Documentation"
full_description = 'Implementing Event Sourced Entities Event Sourced Entities are components that persist their state using the Event Sourcing Model. Instead of persisting the current state, they persist all the events that led to the current state. Akka stores these events in a journal. Event Sourced Entities persist their state with ACID semantics, scale horizontally, and isolate failures. An Event Sourced Entity must not update its in-memory state directly as a result of a command. The handling of a command, if it results in changes being required to state, should persist events. These events will then be processed by the entity, at which point the in-memory state can and should be changed in response. When you need to read state in your service, ask yourself what events should I be listening to? When you need to write state, ask yourself what events should I be persisting? The image above is from the Akka console and illustrates how events for a shopping cart updates the state of the cart entity. 3 Akka T-shirts added. 5 Akka socks added. 4 more Akka T-shirts added, making a total of 7. Cart is checked out. To load an Entity, Akka reads the journal and replays events to compute the Entity’s current state. As an optimization, by default, Event Sourced Entities persist state snapshots periodically. This allows Akka to recreate an Entity from the most recent snapshot plus any events saved after the snapshot. In contrast with typical create, read, update (CRUD) systems, event sourcing allows the state of the Entity to be reliably replicated to other services. Event Sourced Entities use offset tracking in the journal to record which portions of the system have replicated which events. Entity and Workflow sharding Stateful components, such as Entities and Workflows, offer strong consistency guarantees. Each stateful component can have many instances, identified by ID. Akka distributes them across every service instance in the cluster. We guarantee that there is only one stateful component instance in the whole service cluster. If a command arrives to a service instance not hosting that stateful component instance, the command is forwarded by the Akka Runtime to the one that hosts that particular component instance. This forwarding is done transparently via Component Client logic. Because each stateful component instance lives on exactly one service instance, messages can be handled sequentially. Hence, there are no concurrency concerns, each Entity or Workflow instance handles one message at a time. The state of the stateful component instance is kept in memory as long as it is active. This means it can serve read requests or command validation before updating without additional reads from the durable storage. There might not be room for all stateful component instances to be kept active in memory all the time and therefore least recently used instances can be passivated. When the stateful component is used again it recovers its state from durable storage and becomes an active with its system of record in memory, backed by consistent durable storage. This recovery process is also used in cases of rolling updates, rebalance, and abnormal crashes. Event Sourced Entities persist changes as events and snapshots. Akka needs to serialize that data to send it to the underlying data store. However, we recommend that you do not persist your service’s public API messages. Persisting private API messages may introduce some overhead when converting from a public message to an internal one but it allows the logic of the service public interface to evolve independently of the data storage format, which should be private. The steps necessary to implement an Event Sourced Entity include: Model the entity’s state and its domain events. Implementing behavior in command and event handlers. The following sections walk through these steps using a shopping cart service as an example (working sample can be downloaded from Github). Modeling the Entity Through our "Shopping Cart" Event Sourced Entity we expect to manage our cart, adding and removing items as we please. Being event-sourced means it will represent changes to state as a series of domain events. Let’s have a look at what kind of model we expect to store and the events our entity might generate. ShoppingCart.java public record ShoppingCart(String cartId, List<LineItem> items, boolean checkedOut) { (1) public record LineItem(String productId, String name, int quantity) { (2) public LineItem withQuantity(int quantity) { return new LineItem(productId, name, quantity); } } } 1 Our ShoppingCart is fairly simple, being composed only by a cartId and a list of line items. 2 A LineItem represents a single product and the quantity we intend to buy. Above we are taking advantage of the Java record to reduce the amount of boilerplate code, but you can use regular classes so long as they can be serialized to JSON (e.g. using Jackson annotations). Another fundamental aspect of our entity will be its domain events. For now, we will have 3 different events ItemAdded, ItemRemoved and CheckedOut, defined as below: ShoppingCartEvent.java public sealed interface ShoppingCartEvent { (1) @TypeName("item-added") (2) record ItemAdded(ShoppingCart.LineItem item) implements ShoppingCartEvent { } @TypeName("item-removed") record ItemRemoved(String productId) implements ShoppingCartEvent { } @TypeName("checked-out") record CheckedOut() implements ShoppingCartEvent { } } 1 The 3 types of event all derive from the same type ShoppingCartEvent. 2 Includes the logical type name using @TypeName annotation. The use of logical names for subtypes is essential for maintainability purposes. Our recommendation is to use logical names (i.e. @TypeName) that are unique per Akka service. Check type name documentation for more details. Identifying the Entity In order to interact with an Entity in Akka, we need to assign a component id and an instance id: component id is a unique identifier for all entities of a given type. To define the component id, the entity class must be annotated with @ComponentId and have a unique and stable identifier assigned. id, on the other hand, is unique per instance. The entity id is used in the component client when calling the entity from for example an Endpoint. As an example, an entity representing a customer could have the component id customer and a customer entity for a specific customer could have the UUID instance id 8C59E488-B6A8-4E6D-92F3-760315283B6E. The component id and entity id cannot contain the reserved character |, because that is used internally by Akka as a separator. Event Sourced Entity’s Effect API The Event Sourced Entity’s Effect defines the operations that Akka should perform when an incoming command is handled by an Event Sourced Entity. An Event Sourced Entity Effect can either: persist events and send a reply to the caller directly reply to the caller if the command is not requesting any state change instruct Akka to delete the entity and send a reply to the caller return an error message For additional details, refer to Declarative Effects. Implementing behavior Now that we have our Entity state defined along with its events, the remaining steps can be summarized as follows: declare your entity and pick a component id (it needs to be unique as it will be used for sharding purposes); implement how each command is handled and which event(s) it generates; provide an event handler and how it updates the entity’s state. The class signature for our shopping cart entity will look like this: ShoppingCartEntity.java @ComponentId("shopping-cart") (2) public class ShoppingCartEntity extends EventSourcedEntity<ShoppingCart, ShoppingCartEvent> { (1) } 1 Create a class that extends EventSourcedEntity<S, E>, where S is the state type this entity will store (i.e. ShoppingCart) and E is the top type for the events it persists (i.e. ShoppingCartEvent). 2 Make sure to annotate such class with @ComponentId and pass a stable unique identifier for this entity type. The @ComponentId value shopping-cart is common for all instances of this entity but must be stable - cannot be changed after a production deploy - and unique across the different entity types in the service. Updating state Having created the basis of our entity, we will now define how each command is handled. In the example below, we define a method that will add a new line item to a given shopping cart. It returns an Effect to persist an event and then sends a reply once the event is stored successfully. The state is updated by the event handler. The only way for a command handler to modify the Entity’s state is by persisting an event. Any modifications made directly to the state (or instance variables) from the command handler are not persisted. When the Entity is passivated and reloaded, those modifications will not be present. ShoppingCartEntity.java public Effect<Done> addItem(LineItem item) { if (currentState().checkedOut()) { logger.info("Cart id={} is already checked out.", entityId); return effects().error("Cart is already checked out."); } if (item.quantity() <= 0) { (1) logger.info("Quantity for item {} must be greater than zero.", item.productId()); return effects().error("Quantity for item " + item.productId() + " must be greater than zero."); } var event = new ShoppingCartEvent.ItemAdded(item); (2) return effects() .persist(event) (3) .thenReply(newState -> Done.getInstance()); (4) } @Override public ShoppingCart applyEvent(ShoppingCartEvent event) { return switch (event) { case ShoppingCartEvent.ItemAdded evt -> currentState().onItemAdded(evt); (5) }; } 1 The validation ensures the quantity of items added is greater than zero and it fails for calls with illegal values by returning an Effect with effects().error. 2 From the current incoming LineItem we create a new ItemAdded event representing the change of the cart. 3 We store the event by returning an Effect with effects().persist. 4 The acknowledgment that the command was successfully processed is only sent if the event was successfully stored and applied, otherwise there will be an error reply. The lambda parameter newState gives us access to the new state returned by applying such event. 5 Event handler returns the updated state after applying the event - the logic for state transition is defined inside the ShoppingCart domain model. As mentioned above, the business logic that allows us to transition between states was placed on the domain model as seen below: ShoppingCart.java public ShoppingCart onItemAdded(ShoppingCartEvent.ItemAdded itemAdded) { var item = itemAdded.item(); var lineItem = updateItem(item); (1) List<LineItem> lineItems = removeItemByProductId(item.productId()); (2) lineItems.add(lineItem); (3) lineItems.sort(Comparator.comparing(LineItem::productId)); return new ShoppingCart(cartId, lineItems, checkedOut); (4) } private LineItem updateItem(LineItem item) { return findItemByProductId(item.productId()) .map(li -> li.withQuantity(li.quantity() + item.quantity())) .orElse(item); } private List<LineItem> removeItemByProductId(String productId) { return items().stream() .filter(lineItem -> !lineItem.productId().equals(productId)) .collect(Collectors.toList()); } public Optional<LineItem> findItemByProductId(String productId) { Predicate<LineItem> lineItemExists = lineItem -> lineItem.productId().equals(productId); return items.stream().filter(lineItemExists).findFirst(); } 1 For an existing item, we will make sure to sum the existing quantity with the incoming one. 2 Returns an update list of items without the existing item. 3 Adds the update item to the shopping cart. 4 Returns a new instance of the shopping cart with the updated line items. Retrieving state To have access to the current state of the entity we can use currentState() as you have probably noticed from the examples above. However, what if this is the first command we are receiving for this entity? The following example shows the implementation of the read-only command handler getCart: ShoppingCartEntity.java private final String entityId; private static final Logger logger = LoggerFactory.getLogger(ShoppingCartEntity.class); public ShoppingCartEntity(EventSourcedEntityContext context) { this.entityId = context.entityId(); (1) } @Override public ShoppingCart emptyState() { (2) return new ShoppingCart(entityId, Collections.emptyList(), false); } public ReadOnlyEffect<ShoppingCart> getCart() { return effects().reply(currentState()); (3) } 1 Stores the entityId on an internal attribute so we can use it later. 2 Provides initial state - overriding emptyState() is optional but if not doing it, be careful to deal with a currentState() with a null value when receiving the first command or event. 3 Returns the current state as reply for the request. We are returning the internal state directly back to the requester. In the endpoint, it’s usually best to convert this internal domain model into a public model so the internal representation is free to evolve without breaking clients code. Deleting an Entity Normally, Event Sourced Entities are not deleted because the history of the events typically provide business value. For certain use cases or for regulatory reasons the entity can be deleted. ShoppingCartEntity.java public Effect<Done> checkout() { if (currentState().checkedOut()) return effects().reply(Done.getInstance()); return effects() .persist(new ShoppingCartEvent.CheckedOut()) (1) .deleteEntity() (2) .thenReply(newState -> Done.getInstance()); } 1 Persist final event before deletion, which is handled as any other event. 2 Instruction to delete the entity. When you give the instruction to delete the entity it will still exist for some time, including its events and snapshots. The actual removal of events and snapshots will be deleted later to give downstream consumers time to process all prior events, including the final event that was persisted together with the deleteEntity effect. By default, the existence of the entity is completely cleaned up after a week. It is not allowed to persist more events after the entity has been "marked" as deleted. You can still handle read requests to the entity until it has been completely removed. To check whether the entity has been deleted, you can use the isDeleted method inherited from the EventSourcedEntity class. It is best to not reuse the same entity id after deletion, but if that happens after the entity has been completely removed it will be instantiated as a completely new entity without any knowledge of previous state. Note that deleting View state must be handled explicitly. Snapshots Snapshots are an important optimization for Event Sourced Entities that persist many events. Rather than reading the entire journal upon loading or restart, Akka can initiate them from a snapshot. Snapshots are stored and handled automatically by Akka without any specific code required. Snapshots are stored after a configured number of events: application.conf akka'
