title = "Distributed Data • Akka Documentation"
description = "Share data between nodes and perform updates without coordination in an Akka Cluster using Conflict Free Replicated Data Types CRDT."
full_description = 'Distributed Data You are viewing the documentation for the new actor APIs, to view the Akka Classic documentation, see Classic Distributed Data. Module info The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } To use Akka Cluster Distributed Data, you must add the following dependency in your project:sbtval AkkaVersion = "2.10.2" libraryDependencies += "com.typesafe.akka" %% "akka-cluster-typed" % AkkaVersionMaven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-typed_${scala.binary.version}</artifactId> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-cluster-typed_${versions.ScalaBinary}" } Project Info: Akka Cluster (typed) Artifactcom.typesafe.akka akka-cluster-typed 2.10.2 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.cluster.typed LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 2.6.0, 2019-11-06 Home pagehttps://akka.io/ API documentation API (Scaladoc) API (Javadoc) Forums Akka Discuss Release notesAkka release notes IssuesGithub issues Sourceshttps://github.com/akka/akka Introduction Akka Distributed Data is useful when you need to share data between nodes in an Akka Cluster. The data is accessed with an actor providing a key-value store like API. The keys are unique identifiers with type information of the data values. The values are Conflict Free Replicated Data Types (CRDTs). All data entries are spread to all nodes, or nodes with a certain role, in the cluster via direct replication and gossip based dissemination. You have fine grained control of the consistency level for reads and writes. The nature of CRDTs makes it possible to perform updates from any node without coordination. Concurrent updates from different nodes will automatically be resolved by the monotonic merge function, which all data types must provide. The state changes always converge. Several useful data types for counters, sets, maps and registers are provided and you can also implement your own custom data types. It is eventually consistent and geared toward providing high read and write availability (partition tolerance), with low latency. Note that in an eventually consistent system a read may return an out-of-date value. Using the Replicator You can interact with the data through the replicator actor which can be accessed through the DistributedDataDistributedData extension. The messages for the replicator, such as Replicator.UpdateReplicator.Update are defined as subclasses of Replicator.CommandReplicator.Command and the actual CRDTs are defined in the akka.cluster.ddata package, for example GCounterGCounter. It requires a implicit akka.cluster.ddata.SelfUniqueAddress, available from: Scala copysourceimplicit val node: SelfUniqueAddress = DistributedData(context.system).selfUniqueAddress Java copysourcefinal SelfUniqueAddress node = DistributedData.get(context.getSystem()).selfUniqueAddress(); The replicator can contain multiple entries each containing a replicated data type, we therefore need to create a key identifying the entry and helping us know what type it has, and then use that key for every interaction with the replicator. Each replicated data type contains a factory for defining such a key. Cluster members with status WeaklyUp, will participate in Distributed Data. This means that the data will be replicated to the WeaklyUp nodes with the background gossip protocol. Note that it will not participate in any actions where the consistency mode is to read/write from all nodes or the majority of nodes. The WeaklyUp node is not counted as part of the cluster. So 3 nodes + 5 WeaklyUp is essentially a 3 node cluster as far as consistent actions are concerned. This sample uses the replicated data type GCounter to implement a counter that can be written to on any node of the cluster: Scala copysourceimport akka.actor.typed.ActorRef import akka.actor.typed.Behavior import akka.actor.typed.scaladsl.Behaviors import akka.cluster.ddata.GCounter import akka.cluster.ddata.GCounterKey import akka.cluster.ddata.typed.scaladsl.Replicator._ object Counter { sealed trait Command case object Increment extends Command final case class GetValue(replyTo: ActorRef[Int]) extends Command final case class GetCachedValue(replyTo: ActorRef[Int]) extends Command case object Unsubscribe extends Command private sealed trait InternalCommand extends Command private case class InternalUpdateResponse(rsp: Replicator.UpdateResponse[GCounter]) extends InternalCommand private case class InternalGetResponse(rsp: Replicator.GetResponse[GCounter], replyTo: ActorRef[Int]) extends InternalCommand private case class InternalSubscribeResponse(chg: Replicator.SubscribeResponse[GCounter]) extends InternalCommand def apply(key: GCounterKey): Behavior[Command] = Behaviors.setup[Command] { context => implicit val node: SelfUniqueAddress = DistributedData(context.system).selfUniqueAddress // adapter that turns the response messages from the replicator into our own protocol DistributedData.withReplicatorMessageAdapter[Command, GCounter] { replicatorAdapter => // Subscribe to changes of the given `key`. replicatorAdapter.subscribe(key, InternalSubscribeResponse.apply) def updated(cachedValue: Int): Behavior[Command] = { Behaviors.receiveMessage[Command] { case Increment => replicatorAdapter.askUpdate( askReplyTo => Replicator.Update(key, GCounter.empty, Replicator.WriteLocal, askReplyTo)(_ :+ 1), InternalUpdateResponse.apply) Behaviors.same case GetValue(replyTo) => replicatorAdapter.askGet( askReplyTo => Replicator.Get(key, Replicator.ReadLocal, askReplyTo), value => InternalGetResponse(value, replyTo)) Behaviors.same case GetCachedValue(replyTo) => replyTo ! cachedValue Behaviors.same case Unsubscribe => replicatorAdapter.unsubscribe(key) Behaviors.same case internal: InternalCommand => internal match { case InternalUpdateResponse(_) => Behaviors.same // ok case InternalGetResponse(rsp @ Replicator.GetSuccess(`key`), replyTo) => val value = rsp.get(key).value.toInt replyTo ! value Behaviors.same case InternalGetResponse(_, _) => Behaviors.unhandled // not dealing with failures case InternalSubscribeResponse(chg @ Replicator.Changed(`key`)) => val value = chg.get(key).value.intValue updated(value) case InternalSubscribeResponse(Replicator.Deleted(_)) => Behaviors.unhandled // no deletes case InternalSubscribeResponse(_) => // changed but wrong key Behaviors.unhandled } } } updated(cachedValue = 0) } } } Java copysourceimport akka.actor.typed.ActorRef; import akka.actor.typed.Behavior; import akka.actor.typed.javadsl.AbstractBehavior; import akka.actor.typed.javadsl.ActorContext; import akka.actor.typed.javadsl.Behaviors; import akka.actor.typed.javadsl.Receive; import akka.cluster.ddata.GCounter; import akka.cluster.ddata.Key; import akka.cluster.ddata.SelfUniqueAddress; import akka.cluster.ddata.typed.javadsl.DistributedData; import akka.cluster.ddata.typed.javadsl.Replicator; import akka.cluster.ddata.typed.javadsl.ReplicatorMessageAdapter; public class Counter extends AbstractBehavior<Counter.Command> { interface Command {} enum Increment implements Command { INSTANCE } public static class GetValue implements Command { public final ActorRef<Integer> replyTo; public GetValue(ActorRef<Integer> replyTo) { this.replyTo = replyTo; } } public static class GetCachedValue implements Command { public final ActorRef<Integer> replyTo; public GetCachedValue(ActorRef<Integer> replyTo) { this.replyTo = replyTo; } } enum Unsubscribe implements Command { INSTANCE } private interface InternalCommand extends Command {} private static class InternalUpdateResponse implements InternalCommand { final Replicator.UpdateResponse<GCounter> rsp; InternalUpdateResponse(Replicator.UpdateResponse<GCounter> rsp) { this.rsp = rsp; } } private static class InternalGetResponse implements InternalCommand { final Replicator.GetResponse<GCounter> rsp; final ActorRef<Integer> replyTo; InternalGetResponse(Replicator.GetResponse<GCounter> rsp, ActorRef<Integer> replyTo) { this.rsp = rsp; this.replyTo = replyTo; } } private static final class InternalSubscribeResponse implements InternalCommand { final Replicator.SubscribeResponse<GCounter> rsp; InternalSubscribeResponse(Replicator.SubscribeResponse<GCounter> rsp) { this.rsp = rsp; } } public static Behavior<Command> create(Key<GCounter> key) { return Behaviors.setup( ctx -> DistributedData.withReplicatorMessageAdapter( (ReplicatorMessageAdapter<Command, GCounter> replicatorAdapter) -> new Counter(ctx, replicatorAdapter, key))); } // adapter that turns the response messages from the replicator into our own protocol private final ReplicatorMessageAdapter<Command, GCounter> replicatorAdapter; private final SelfUniqueAddress node; private final Key<GCounter> key; private int cachedValue = 0; private Counter( ActorContext<Command> context, ReplicatorMessageAdapter<Command, GCounter> replicatorAdapter, Key<GCounter> key) { super(context); this.replicatorAdapter = replicatorAdapter; this.key = key; final SelfUniqueAddress node = DistributedData.get(context.getSystem()).selfUniqueAddress(); this.node = DistributedData.get(context.getSystem()).selfUniqueAddress(); this.replicatorAdapter.subscribe(this.key, InternalSubscribeResponse::new); } @Override public Receive<Command> createReceive() { return newReceiveBuilder() .onMessage(Increment.class, this::onIncrement) .onMessage(InternalUpdateResponse.class, msg -> Behaviors.same()) .onMessage(GetValue.class, this::onGetValue) .onMessage(GetCachedValue.class, this::onGetCachedValue) .onMessage(Unsubscribe.class, this::onUnsubscribe) .onMessage(InternalGetResponse.class, this::onInternalGetResponse) .onMessage(InternalSubscribeResponse.class, this::onInternalSubscribeResponse) .build(); } private Behavior<Command> onIncrement(Increment cmd) { replicatorAdapter.askUpdate( askReplyTo -> new Replicator.Update<>( key, GCounter.empty(), Replicator.writeLocal(), askReplyTo, curr -> curr.increment(node, 1)), InternalUpdateResponse::new); return this; } private Behavior<Command> onGetValue(GetValue cmd) { replicatorAdapter.askGet( askReplyTo -> new Replicator.Get<>(key, Replicator.readLocal(), askReplyTo), rsp -> new InternalGetResponse(rsp, cmd.replyTo)); return this; } private Behavior<Command> onGetCachedValue(GetCachedValue cmd) { cmd.replyTo.tell(cachedValue); return this; } private Behavior<Command> onUnsubscribe(Unsubscribe cmd) { replicatorAdapter.unsubscribe(key); return this; } private Behavior<Command> onInternalGetResponse(InternalGetResponse msg) { if (msg.rsp instanceof Replicator.GetSuccess) { int value = ((Replicator.GetSuccess<?>) msg.rsp).get(key).getValue().intValue(); msg.replyTo.tell(value); return this; } else { // not dealing with failures return Behaviors.unhandled(); } } private Behavior<Command> onInternalSubscribeResponse(InternalSubscribeResponse msg) { if (msg.rsp instanceof Replicator.Changed) { GCounter counter = ((Replicator.Changed<?>) msg.rsp).get(key); cachedValue = counter.getValue().intValue(); return this; } else { // no deletes return Behaviors.unhandled(); } } } } Although you can interact with the Replicator using the ActorRef[Replicator.Command]ActorRef<Replicator.Command> from DistributedData(ctx.system).replicatorDistributedData(ctx.getSystem()).replicator() it’s often more convenient to use the ReplicatorMessageAdapter as in the above example. Update To modify and replicate a data value you send a Replicator.Update message to the local Replicator. In the above example, for an incoming Increment command, we send the replicator a Replicator.Update request, it contains five values: the KeyKEY we want to update the data to use as the empty state if the replicator has not seen the key before the write consistency level we want for the update an ActorRef[Replicator.UpdateResponse[GCounter]]ActorRef<Replicator.UpdateResponse<GCounter>> to respond to when the update is completed a modify function that takes a previous state and updates it, in our case by incrementing it with 1 There is alternative way of constructing the function for the Update message: Scala copysource// alternative way to define the `createRequest` function // Replicator.Update instance has a curried `apply` method replicatorAdapter.askUpdate( Replicator.Update(key, GCounter.empty, Replicator.WriteLocal)(_ :+ 1), InternalUpdateResponse.apply) // that is the same as replicatorAdapter.askUpdate( askReplyTo => Replicator.Update(key, GCounter.empty, Replicator.WriteLocal, askReplyTo)(_ :+ 1), InternalUpdateResponse.apply) The current data value for the key of the Update is passed as parameter to the modify function of the Update. The function is supposed to return the new value of the data, which will then be replicated according to the given write consistency level. The modify function is called by the Replicator actor and must therefore be a pure function that only uses the data parameter and stable fields from enclosing scope. It must for example not access the ActorContext or mutable state of an enclosing actor. Update is intended to only be sent from an actor running in same local ActorSystem as the Replicator, because the modify function is typically not serializable. You will always see your own writes. For example if you send two Update messages changing the value of the same key, the modify function of the second message will see the change that was performed by the first Update message. As reply of the Update a Replicator.UpdateSuccess is sent to the replyTo of the Update if the value was successfully replicated according to the supplied consistency level within the supplied timeout. Otherwise a Replicator.UpdateFailure subclass is sent back. Note that a Replicator.UpdateTimeout reply does not mean that the update completely failed or was rolled back. It may still have been replicated to some nodes, and will eventually be replicated to all nodes with the gossip protocol. It is possible to abort the Update when inspectin'
