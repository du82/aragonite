title = "Overview • Akka Persistence Cassandra"
full_description = 'Overview The Akka Persistence Cassandra plugin allows for using Apache Cassandra as a backend for Akka Persistence and Akka Persistence Query. It uses Alpakka Cassandra for Cassandra access which is based on the Datastax Java Driver. Project Info Project Info: Akka Persistence Cassandra Artifactcom.typesafe.akka akka-persistence-cassandra 1.3.0 Akka library snapshot repository JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.persistence.cassandra LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 1.0.0, 2020-04-30 Home pagehttps://akka.io API documentation API (Scaladoc) Forums Lightbend Discuss Release notesGitHub releases IssuesGitHub issues Sourceshttps://github.com/akka/akka-persistence-cassandra Dependencies This plugin requires Akka 2.10.0 or later. See Akka’s Binary Compatibility Rules for details. The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository. sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } Additionally, add the dependencies as below.sbtval AkkaVersion = "2.10.0" libraryDependencies ++= Seq( "com.typesafe.akka" %% "akka-persistence-cassandra" % "1.3.0", "com.typesafe.akka" %% "akka-persistence" % AkkaVersion, "com.typesafe.akka" %% "akka-persistence-query" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-tools" % AkkaVersion )Maven<properties> <akka.version>2.10.0</akka.version> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-cassandra_${scala.binary.version}</artifactId> <version>1.3.0</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-query_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-tools_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> </dependencies>Gradledef versions = [ AkkaVersion: "2.10.0", ScalaBinary: "2.13" ] dependencies { implementation "com.typesafe.akka:akka-persistence-cassandra_${versions.ScalaBinary}:1.3.0" implementation "com.typesafe.akka:akka-persistence_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-persistence-query_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-tools_${versions.ScalaBinary}:${versions.AkkaVersion}" } Note that it is important that all akka-* dependencies are in the same version, so it is recommended to depend on them explicitly to avoid problems with transient dependencies causing an unlucky mix of versions. The table below shows Akka Persistence Cassandra’s direct dependencies and the second tab shows all libraries it depends on transitively. Direct dependencies OrganizationArtifactVersion com.datastax.ossjava-driver-core4.17.0 com.lightbend.akkaakka-stream-alpakka-cassandra_2.139.0.0 com.typesafe.akkaakka-cluster-tools_2.132.10.0 com.typesafe.akkaakka-persistence-query_2.132.10.0 com.typesafe.akkaakka-persistence_2.132.10.0 org.scala-langscala-library2.13.15 Dependency treecom.datastax.oss java-driver-core 4.17.0 com.datastax.oss java-driver-shaded-guava 25.1-jre-graal-sub-1 Apache 2 com.datastax.oss native-protocol 1.5.1 Apache 2 com.fasterxml.jackson.core jackson-core 2.17.2 The Apache Software Lic