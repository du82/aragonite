["https://doc.akka.io/concepts/declarative-effects.html"]
title = "Declarative effects :: Akka Documentation"
full_description = "Declarative effects Effects are declarative APIs that describes the actions the Akka runtime needs to perform. It is inherently lazy, acting as a blueprint of operations to be executed. Once passed to the Akka runtime, the Effect is executed, resulting in the requested system changes. Effect APIs are essential for implementing components, bridging your application logic with the Akka runtime. Each application layer component defines its own Effect API offering predefined operations tailored to the component specific semantics. For example, Event Sourced Entities provide an Effect for persisting events, while a Workflow Effect defines both what needs to be executed and how to handle the result to transition to the next step. Think of it as a dialogue between your application components and the Akka runtime. The component implementation processes incoming commands, executes the necessary business logic, and returns a description of what needs to be done. The Akka runtime then executes the effect and manages all necessary operations to ensure responsiveness and resilience. This model simplifies development by removing the need to handle persistence, distribution, serialization, cache management, replication, and other distributed system concerns. Developers can focus on business logic — defining what needs to be persisted, how to respond to the caller, transitioning to different steps, rejecting commands, and more — while the Akka runtime takes care of the rest. For details on the specific Effect types, refer to the documentation for each component. Event Sourced Entities Key Value Entities Views Workflows Timers Consumers Development process Entity state models"
