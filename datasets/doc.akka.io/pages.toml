title = "Akka Management"
full_description = "Akka Management Akka Management is a suite of tools for operating Akka Clusters. The current version may only be used with Akka 2.10. Overview Akka Management consists of multiple modules: akka-management is the base module that provides an extensible HTTP management endpoint for Akka management tools as well a pluggable health check mechanism. akka-cluster-bootstrap helps bootstrapping an Akka cluster using Akka Discovery. akka-management-cluster-http is a module that provides HTTP endpoints for introspecting and managing Akka clusters. kubernetes-lease a lease backed by Kubernetes API server. rolling-updates provides recommendations and extensions for having smoother rolling updates. As well as Akka Discovery methods for: Kubernetes API AWS Azure Various parts of Akka management can be used together for deploying Akka Cluster applications to Kubernetes. Deploying Akka Cluster to Kubernetes"
