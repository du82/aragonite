source from. Must not be empty. Returns: A 404 not found response if there is no such resource. 403 forbidden if the path contains .. or references a folder. Throws: RuntimeException - if the request path does not start with prefixToStrip or if prefixToStrip is empty serverSentEvents public static <T> akka.http.javadsl.model.HttpResponse serverSentEvents(akka.stream.javadsl.Source<T,?> source) Returns: A HttpResponse with a server sent events (SSE) stream response. The HTTP response will contain each element in the source, rendered to JSON using jackson. An SSE keepalive element is emitted every 10 seconds if the stream is idle."
