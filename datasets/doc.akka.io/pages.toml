title = "Event Sourcing • Akka Documentation"
description = "Event Sourcing with Akka Persistence enables actors to persist your events for recovery on failure or when migrated within a cluster."
full_description = 'Event Sourcing You are viewing the documentation for the new actor APIs, to view the Akka Classic documentation, see Classic Akka Persistence. Module info The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } To use Akka Persistence, add the module to your project:sbtval AkkaVersion = "2.10.2" libraryDependencies ++= Seq( "com.typesafe.akka" %% "akka-persistence-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-persistence-testkit" % AkkaVersion % Test )Maven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-typed_${scala.binary.version}</artifactId> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-testkit_${scala.binary.version}</artifactId> <scope>test</scope> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-persistence-typed_${versions.ScalaBinary}" testImplementation "com.typesafe.akka:akka-persistence-testkit_${versions.ScalaBinary}" } You also have to select journal plugin and optionally snapshot store plugin, see Persistence Plugins. Project Info: Akka Event Sourcing (typed) Artifactcom.typesafe.akka akka-persistence-typed 2.10.2 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.persistence.typed LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 2.6.0, 2019-11-06 Home pagehttps://akka.io/ API documentation API (Scaladoc) API (Javadoc) Forums Akka Discuss Release notesAkka release notes IssuesGithub issues Sourceshttps://github.com/akka/akka Introduction Akka Persistence enables stateful actors to persist their state so that it can be recovered when an actor is either restarted, such as after a JVM crash, by a supervisor or a manual stop-start, or migrated within a cluster. The key concept behind Akka Persistence is that only the events that are persisted by the actor are stored, not the actual state of the actor (although actor state snapshot support is available). The events are persisted by appending to storage (nothing is ever mutated) which allows for very high transaction rates and efficient replication. A stateful actor is recovered by replaying the stored events to the actor, allowing it to rebuild its state. This can be either the full history of changes or starting from a checkpoint in a snapshot, which can dramatically reduce recovery times. Akka Persistence also supports Durable State Behaviors, which is based on persistence of the latest state of the actor. In this implementation, the latest state is persisted, instead of events. Hence this is more similar to CRUD based applications. The Event Sourcing with Akka 2.6 video is a good starting point for learning Event Sourcing, together with the Microservices with Akka tutorial that illustrates how to implement an Event Sourced CQRS application with Akka Persistence and Akka Projections. Event Sourcing concepts See an introduction to Event Sourcing at MSDN. Another excellent article about “thinking in Events” is Events As First-Class Citizens by Randy Shoup. It is a short and recommended read if you’re starting developing Events based applications. What follows is Akka’s implementation via event sourced actors. An event sourced actor (also known as a persistent actor) receives a (non-persistent) command which is first validated if it can be applied to the current state. Here validation can mean anything, from simple inspection of a command message’s fields up to a conversation with several external services, for example. If validation succeeds, events are generated from the command, representing the effect of the command. These events are then persisted and, after successful persistence, used to change the actor’s state. When the event sourced actor needs to be recovered, only the persisted events are replayed of which we know that they can be successfully applied. In other words, events cannot fail when being replayed to a persistent actor, in contrast to commands. Event sourced actors may also process commands that do not change application state such as query commands for example. Example and core API Let’s start with a simple example. The minimum required for a EventSourcedBehaviorEventSourcedBehavior is: Scala copysourceimport akka.persistence.typed.scaladsl.EventSourcedBehavior import akka.persistence.typed.PersistenceId object MyPersistentBehavior { sealed trait Command sealed trait Event final case class State() def apply(): Behavior[Command] = EventSourcedBehavior[Command, Event, State]( persistenceId = PersistenceId.ofUniqueId("abc"), emptyState = State(), commandHandler = (state, cmd) => throw new NotImplementedError("TODO: process the command & return an Effect"), eventHandler = (state, evt) => throw new NotImplementedError("TODO: process the event return the next state")) } Java copysourcepublic class MyPersistentBehavior extends EventSourcedBehavior< MyPersistentBehavior.Command, MyPersistentBehavior.Event, MyPersistentBehavior.State> { interface Command {} interface Event {} public static class State {} public static Behavior<Command> create(PersistenceId persistenceId) { return new MyPersistentBehavior(persistenceId); } private MyPersistentBehavior(PersistenceId persistenceId) { super(persistenceId); } @Override public State emptyState() { return new State(); } @Override public CommandHandler<Command, Event, State> commandHandler() { return (state, command) -> { throw new RuntimeException("TODO: process the command & return an Effect"); }; } @Override public EventHandler<State, Event> eventHandler() { return (state, event) -> { throw new RuntimeException("TODO: process the event return the next state"); }; } } The first important thing to notice is the BehaviorBehavior of a persistent actor is typed to the type of the Command because this is the type of message a persistent actor should receive. In Akka this is now enforced by the type system. The components that make up an EventSourcedBehaviorEventSourcedBehavior are: persistenceId is the stable unique identifier for the persistent actor. emptyState defines the State when the entity is first created e.g. a Counter would start with 0 as state. commandHandler defines how to handle command by producing Effects e.g. persisting events, stopping the persistent actor. eventHandler returns the new state given the current state when an event has been persisted. Note that the concrete class does not contain any fields with state like a regular POJO. All state of the EventSourcedBehavior must be represented in the State or else they will not be persisted and therefore be lost when the actor is stopped or restarted. Updates to the State are always performed in the eventHandler based on the events. Next we’ll discuss each of these in detail. PersistenceId The PersistenceIdPersistenceId is the stable unique identifier for the persistent actor in the backend event journal and snapshot store. Cluster Sharding is typically used together with EventSourcedBehavior to ensure that there is only one active entity for each PersistenceId (entityId). There are techniques to ensure this uniqueness, an example of which can be found in the Persistence example in the Cluster Sharding documentation. This illustrates how to construct the PersistenceId from the entityTypeKey and entityId provided by the EntityContextEntityContext. The entityId in Cluster Sharding is the business domain identifier of the entity. The entityId might not be unique enough to be used as the PersistenceId by itself. For example two different types of entities may have the same entityId. To create a unique PersistenceId the entityId should be prefixed with a stable name of the entity type, which typically is the same as the EntityTypeKey.name that is used in Cluster Sharding. There are PersistenceId.applyPersistenceId.of factory methods to help with constructing such PersistenceId from an entityTypeHint and entityId. The default separator when concatenating the entityTypeHint and entityId is |, but a custom separator is supported.Note The | separator is also used in Lagom’s scaladsl.PersistentEntity but no separator is used in Lagom’s javadsl.PersistentEntity. For compatibility with Lagom’s javadsl.PersistentEntity you should use "" as the separator. A custom identifier can be created with PersistenceId.ofUniqueIdPersistenceId.ofUniqueId. Command handler The command handler is a function with 2 parameters, the current State and the incoming Command. A command handler returns an EffectEffect directive that defines what event or events, if any, to persist. Effects are created using a factory that is returned via the Effect() method the Effect factory. The two most commonly used effects are: persist will persist one single event or several events atomically, i.e. all events are stored or none of them are stored if there is an error none no events are to be persisted, for example a read-only command More effects are explained in Effects and Side Effects. In addition to returning the primary Effect for the command EventSourcedBehaviors can also chain side effects that are to be performed after successful persist which is achieved with the thenRun function e.g. Effect.persist(..).thenRunEffect().persist(..).thenRun. Event handler When an event has been persisted successfully the new state is created by applying the event to the current state with the eventHandler. In the case of multiple persisted events, the eventHandler is called with each event in the same order as they were passed to Effect.persist(..)Effect().persist(..). The state is typically defined as an immutable class and then the event handler returns a new instance of the state. You may choose to use a mutable class for the state, and then the event handler may update the state instance and return the same instance. Both immutable and mutable state is supported, but it must only be modified in the event handler. The same event handler is also used when the entity is started up to recover its state from the stored events. The event handler must only update the state and never perform side effects, as those would also be executed during recovery of the persistent actor. Side effects should be performed in thenRun from the command handler after persisting the event or from the RecoveryCompletedRecoveryCompleted after Recovery. Completing the example Let’s fill in the details of the example. Command and event: Scala copysourcesealed trait Command final case class Add(data: String) extends Command case object Clear extends Command sealed trait Event final case class Added(data: String) extends Event case object Cleared extends Event Java copysourceinterface Command {} public static class Add implements Command { public final String data; public Add(String data) { this.data = data; } } public enum Clear implements Command { INSTANCE } interface Event {} public static class Added implements Event { public final String data; public Added(String data) { this.data = data; } } public enum Cleared implements Event { INSTANCE } State is a List containing the 5 latest items: Scala copysourcefinal case class State(history: List[String] = Nil) Java copysourcepublic static class State { private final List<String> items; private State(List<String> items) { this.items = items; } public State() { this.items = new ArrayList<>(); } public State addItem(String data) { List<String> newItems = new ArrayList<>(items); newItems.add(0, data); // keep 5 items List<String> latest = newItems.subList(0, Math.min(5, newItems.size())); return new State(latest); } } The command handler persists the Add payload in an Added event: Scala copysourceimport akka.persistence.typed.scaladsl.Effect val commandHandler: (State, Command) => Effect[Event, State] = { (state, command) => command match { case Add(data) => Effect.persist(Added(data)) case Clear => Effect.persist(Cleared) } } Java copysource@Override public CommandHandler<Command, Event, State> commandHandler() { return newCommandHandlerBuilder() .forAnyState() .onCommand(Add.class, command -> Effect().persist(new Added(command.data))) .onCommand(Clear.class, command -> Effect().persist(Cleared.INSTANCE)) .build(); } The event handler appends the item to the state and keeps 5 items. This is called after successfully persisting the event in the database: Scala copysourceval eventHandler: (State, Event) => State = { (state, event) => event match { case Added(data) => state.copy((data :: state.history).take(5)) case Cleared => State(Nil) } } Java copysource@Override public EventHandler<State, Event> eventHandler() { return newEventHandlerBuilder() .forAnyState() .onEvent(Added.class, (state, event) -> state.addItem(event.data)) .onEvent(Cleared.class, () -> new State()) .build(); } These are used to create an EventSourcedBehavior: These are defined in an EventSourcedBehavior: Scala copysourceimport akka.persistence.typed.scaladsl.EventSourcedBehavior import akka.persistence.typed.PersistenceId def apply(id: String): Behavior[Command] = EventSourcedBehavior[Command, Event, State]( persistenceId = PersistenceId.ofUniqueId(id), emptyState = State(Nil), commandHandler = commandHandler, eventHandler = eventHandler) Java copysourceimport akka.persistence.typed.javadsl.EventSourcedBehavior; import akka.persistence.typed.PersistenceId; public class MyPersistentBehavior extends EventSourcedBehavior< MyPersistentBehavior.Command, MyPersistentBehavior.Event, MyPersistentBehavior.State> { // commands, events and state defined here public static Behavior<Command> create(PersistenceId persistenceId) { return new MyPersistentBehavior(persistenceId); } private MyPersistentBehavior(PersistenceId persistenceId) { super(persistenceId); } @Override public State emptyState() { return new State(); } @Override public CommandHandler<Command, Event, State> commandHandler() { return newCommandHandlerBuilder() .forAnyState() .onCommand(Add.class, command -> Effect().persist(new Added(command.data))) .onCommand(Clear.class, command -> Effect().persist(Cle'
