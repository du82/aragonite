title = "Cluster Sharding • Akka Documentation"
description = "Shard a clustered compute process across the network with locationally transparent message routing using Akka Cluster Sharding."
full_description = 'Cluster Sharding You are viewing the documentation for the new actor APIs, to view the Akka Classic documentation, see Classic Cluster Sharding Module info The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } To use Akka Cluster Sharding, you must add the following dependency in your project:sbtval AkkaVersion = "2.10.2" libraryDependencies += "com.typesafe.akka" %% "akka-cluster-sharding-typed" % AkkaVersionMaven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-sharding-typed_${scala.binary.version}</artifactId> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-cluster-sharding-typed_${versions.ScalaBinary}" } Project Info: Akka Cluster Sharding (typed) Artifactcom.typesafe.akka akka-cluster-sharding-typed 2.10.2 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.cluster.sharding.typed LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 2.6.0, 2019-11-06 Home pagehttps://akka.io/ API documentation API (Scaladoc) API (Javadoc) Forums Akka Discuss Release notesAkka release notes IssuesGithub issues Sourceshttps://github.com/akka/akka Introduction Cluster sharding is useful when you need to distribute actors across several nodes in the cluster and want to be able to interact with them using their logical identifier, but without having to care about their physical location in the cluster, which might also change over time. It could for example be actors representing Aggregate Roots in Domain-Driven Design terminology. Here we call these actors “entities”. These actors typically have persistent (durable) state, but this feature is not limited to actors with persistent state. The Introduction to Akka Cluster Sharding video is a good starting point for learning Cluster Sharding. Cluster sharding is typically used when you have many stateful actors that together consume more resources (e.g. memory) than fit on one machine. If you only have a few stateful actors it might be easier to run them on a Cluster Singleton node. In this context sharding means that actors with an identifier, so called entities, can be automatically distributed across multiple nodes in the cluster. Each entity actor runs only at one place, and messages can be sent to the entity without requiring the sender to know the location of the destination actor. This is achieved by sending the messages via a ShardRegion actor provided by this extension, which knows how to route the message with the entity id to the final destination. Cluster sharding will not be active on members with status WeaklyUp if that feature is enabled. Warning Make sure to not use a Cluster downing strategy that may split the cluster into several separate clusters in case of network problems or system overload (long GC pauses), since that will result in multiple shards and entities being started, one in each separate cluster! See Downing. Basic example Sharding is accessed via the ClusterShardingClusterSharding extension Scala copysourceimport akka.cluster.sharding.typed.ShardingEnvelope import akka.cluster.sharding.typed.scaladsl.ClusterSharding import akka.cluster.sharding.typed.scaladsl.EntityTypeKey import akka.cluster.sharding.typed.scaladsl.EntityRef val sharding = ClusterSharding(system) Java copysourceimport akka.cluster.sharding.typed.ShardingEnvelope; import akka.cluster.sharding.typed.javadsl.ClusterSharding; import akka.cluster.sharding.typed.javadsl.EntityTypeKey; import akka.cluster.sharding.typed.javadsl.EntityRef; import akka.cluster.sharding.typed.javadsl.Entity; import akka.persistence.typed.PersistenceId; ClusterSharding sharding = ClusterSharding.get(system); It is common for sharding to be used with persistence however any BehaviorBehavior can be used with sharding e.g. a basic counter: Scala copysourceobject Counter { sealed trait Command case object Increment extends Command final case class GetValue(replyTo: ActorRef[Int]) extends Command def apply(entityId: String): Behavior[Command] = { def updated(value: Int): Behavior[Command] = { Behaviors.receiveMessage[Command] { case Increment => updated(value + 1) case GetValue(replyTo) => replyTo ! value Behaviors.same } } updated(0) } } Java copysourcepublic class Counter extends AbstractBehavior<Counter.Command> { public interface Command {} public enum Increment implements Command { INSTANCE } public static class GetValue implements Command { private final ActorRef<Integer> replyTo; public GetValue(ActorRef<Integer> replyTo) { this.replyTo = replyTo; } } public static Behavior<Command> create(String entityId) { return Behaviors.setup(context -> new Counter(context, entityId)); } private final String entityId; private int value = 0; private Counter(ActorContext<Command> context, String entityId) { super(context); this.entityId = entityId; } @Override public Receive<Command> createReceive() { return newReceiveBuilder() .onMessage(Increment.class, msg -> onIncrement()) .onMessage(GetValue.class, this::onGetValue) .build(); } private Behavior<Command> onIncrement() { value++; return this; } private Behavior<Command> onGetValue(GetValue msg) { msg.replyTo.tell(value); return this; } } Each Entity type has a key that is then used to retrieve an EntityRef for a given entity identifier. Note in the sample’s Counter.applyCounter.create function that the entityId parameter is not called, it is included to demonstrate how one can pass it to an entity. Another way to do this is by sending the entityId as part of the message if needed. Scala copysourceval TypeKey = EntityTypeKey[Counter.Command]("Counter") val shardRegion: ActorRef[ShardingEnvelope[Counter.Command]] = sharding.init(Entity(TypeKey)(createBehavior = entityContext => Counter(entityContext.entityId))) Java copysourceEntityTypeKey<Counter.Command> typeKey = EntityTypeKey.create(Counter.Command.class, "Counter"); ActorRef<ShardingEnvelope<Counter.Command>> shardRegion = sharding.init(Entity.of(typeKey, ctx -> Counter.create(ctx.getEntityId()))); Messages to a specific entity are then sent via an EntityRefEntityRef. The entityId and the name of the Entity’s key can be retrieved from the EntityRef. It is also possible to wrap methods in a ShardingEnvelopeShardingEnvelope or define extractor functions and send messages directly to the shard region. Scala copysource// With an EntityRef val counterOne: EntityRef[Counter.Command] = sharding.entityRefFor(TypeKey, "counter-1") counterOne ! Counter.Increment // Entity id is specified via an `ShardingEnvelope` shardRegion ! ShardingEnvelope("counter-1", Counter.Increment) Java copysourceEntityRef<Counter.Command> counterOne = sharding.entityRefFor(typeKey, "counter-1"); counterOne.tell(Counter.Increment.INSTANCE); shardRegion.tell(new ShardingEnvelope<>("counter-1", Counter.Increment.INSTANCE)); Cluster sharding initinit should be called on every node for each entity type. Which nodes entity actors are created on can be controlled with roles. init will create a ShardRegion or a proxy depending on whether the node’s role matches the entity’s role. The behavior factory lambda passed to the init method is defined on each node and only used locally, this means it is safe to use it for injecting for example a node local ActorRefActorRef that each sharded actor should have access to or some object that is not possible to serialize. Specifying the role: Scala copysourcesharding.init( Entity(TypeKey)(createBehavior = entityContext => Counter(entityContext.entityId)).withRole("backend")) Java copysourceEntityTypeKey<Counter.Command> typeKey = EntityTypeKey.create(Counter.Command.class, "Counter"); ActorRef<ShardingEnvelope<Counter.Command>> shardRegionOrProxy = sharding.init( Entity.of(typeKey, ctx -> Counter.create(ctx.getEntityId())).withRole("backend")); A note about EntityRef and serialization If including EntityRefEntityRef’s in messages or the State/Events of an EventSourcedBehaviorEventSourcedBehavior, those EntityRefs will need to be serialized. The entityId and typeKey of an EntityRefgetEntityId and getTypeKey methods of an EntityRef provide exactly the information needed upon deserialization to regenerate an EntityRef equivalent to the one serialized, given an expected type of messages to send to the entity. At this time, serialization of EntityRefs requires a custom serializer, as the specific EntityTypeKeyEntityTypeKey (including the type of message which the desired entity type accepts) should not simply be encoded in the serialized representation but looked up on the deserializing side. Persistence example When using sharding, entities can be moved to different nodes in the cluster. Persistence can be used to recover the state of an actor after it has moved. Akka Persistence is based on the single-writer principle, for a particular PersistenceIdPersistenceId only one persistent actor instance should be active. If multiple instances were to persist events at the same time, the events would be interleaved and might not be interpreted correctly on replay. Cluster Sharding is typically used together with persistence to ensure that there is only one active entity for each PersistenceId (entityId). Here is an example of a persistent actor that is used as a sharded entity: Scala copysourceimport akka.actor.typed.Behavior import akka.cluster.sharding.typed.scaladsl.EntityTypeKey import akka.persistence.typed.scaladsl.Effect object HelloWorld { // Command sealed trait Command extends CborSerializable final case class Greet(whom: String)(val replyTo: ActorRef[Greeting]) extends Command // Response final case class Greeting(whom: String, numberOfPeople: Int) extends CborSerializable // Event final case class Greeted(whom: String) extends CborSerializable // State final case class KnownPeople(names: Set[String]) extends CborSerializable { def add(name: String): KnownPeople = copy(names = names + name) def numberOfPeople: Int = names.size } private val commandHandler: (KnownPeople, Command) => Effect[Greeted, KnownPeople] = { (_, cmd) => cmd match { case cmd: Greet => greet(cmd) } } private def greet(cmd: Greet): Effect[Greeted, KnownPeople] = Effect.persist(Greeted(cmd.whom)).thenRun(state => cmd.replyTo ! Greeting(cmd.whom, state.numberOfPeople)) private val eventHandler: (KnownPeople, Greeted) => KnownPeople = { (state, evt) => state.add(evt.whom) } val TypeKey: EntityTypeKey[Command] = EntityTypeKey[Command]("HelloWorld") def apply(entityId: String, persistenceId: PersistenceId): Behavior[Command] = { Behaviors.setup { context => context.log.info("Starting HelloWorld {}", entityId) EventSourcedBehavior(persistenceId, emptyState = KnownPeople(Set.empty), commandHandler, eventHandler) } } } Java copysourceimport akka.actor.typed.javadsl.Behaviors; import akka.cluster.sharding.typed.javadsl.EntityTypeKey; import akka.persistence.typed.PersistenceId; import akka.persistence.typed.javadsl.CommandHandler; import akka.persistence.typed.javadsl.Effect; import akka.persistence.typed.javadsl.EventHandler; public static class HelloWorld extends EventSourcedBehavior<HelloWorld.Command, HelloWorld.Greeted, HelloWorld.KnownPeople> { // Command public interface Command extends CborSerializable {} public static final class Greet implements Command { public final String whom; public final ActorRef<Greeting> replyTo; public Greet(String whom, ActorRef<Greeting> replyTo) { this.whom = whom; this.replyTo = replyTo; } } // Response public static final class Greeting implements CborSerializable { public final String whom; public final int numberOfPeople; public Greeting(String whom, int numberOfPeople) { this.whom = whom; this.numberOfPeople = numberOfPeople; } } // Event public static final class Greeted implements CborSerializable { public final String whom; @JsonCreator public Greeted(String whom) { this.whom = whom; } } // State static final class KnownPeople implements CborSerializable { private Set<String> names = Collections.emptySet(); KnownPeople() {} private KnownPeople(Set<String> names) { this.names = names; } KnownPeople add(String name) { Set<String> newNames = new HashSet<>(names); newNames.add(name); return new KnownPeople(newNames); } int numberOfPeople() { return names.size(); } } public static final EntityTypeKey<Command> ENTITY_TYPE_KEY = EntityTypeKey.create(Command.class, "HelloWorld"); public static Behavior<Command> create(String entityId, PersistenceId persistenceId) { return Behaviors.setup(context -> new HelloWorld(context, entityId, persistenceId)); } private HelloWorld( ActorContext<Command> context, String entityId, PersistenceId persistenceId) { super(persistenceId); context.getLog().info("Starting HelloWorld {}", entityId); } @Override public KnownPeople emptyState() { return new KnownPeople(); } @Override public CommandHandler<Command, Greeted, KnownPeople> commandHandler() { return newCommandHandlerBuilder().forAnyState().onCommand(Greet.class, this::greet).build(); } private Effect<Greeted, KnownPeople> greet(KnownPeople state, Greet cmd) { return Effect() .persist(new Greeted(cmd.whom)) .thenRun(newState -> cmd.replyTo.tell(new Greeting(cmd.whom, newState.numberOfPeople()))); } @Override public EventHandler<KnownPeople, Greeted> eventHandler() { return (state, evt) -> state.add(evt.whom); } } To initialize and use the entity: Scala copysourceimport akka.cluster.sharding.typed.scaladsl.ClusterSharding import akka.cluster.sharding.typed.scaladsl.Entity import akka.util.Timeout class HelloWorldService(system: ActorSystem[_]) { import system.executionContext private val sharding = ClusterSharding(system) // registration at startup sharding.init(Entity(typeKey = HelloWorld.TypeKey) { entityContext => HelloWorld(entityContext.entityId, PersistenceId(entityContext.entityTypeKey.name, entityContext.entityId)) }) private implicit val askTimeout: Timeout = Timeout(5.seconds) def greet(worldId: String, whom: String): Future[Int] = { val entityRef = sharding.entityRefFor(HelloWorld.TypeKey, worldId) val greeting = entityRef ? HelloWorl'
