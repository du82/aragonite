["https://doc.akka.io/java/workflows.html"]
title = "Implementing Workflows :: Akka Documentation"
full_description = 'Implementing Workflows Workflows implement long-running, multi-step business processes while allowing developers to focus exclusively on domain and business logic. Workflows provide durability, consistency and the ability to call other components and services. Business transactions can be modeled in one central place, and the Workflow will keep them running smoothly, or roll back if something goes wrong. Users can see the workflow execution details in the console (both locally and in the cloud). Entity and Workflow sharding Stateful components, such as Entities and Workflows, offer strong consistency guarantees. Each stateful component can have many instances, identified by ID. Akka distributes them across every service instance in the cluster. We guarantee that there is only one stateful component instance in the whole service cluster. If a command arrives to a service instance not hosting that stateful component instance, the command is forwarded by the Akka Runtime to the one that hosts that particular component instance. This forwarding is done transparently via Component Client logic. Because each stateful component instance lives on exactly one service instance, messages can be handled sequentially. Hence, there are no concurrency concerns, each Entity or Workflow instance handles one message at a time. The state of the stateful component instance is kept in memory as long as it is active. This means it can serve read requests or command validation before updating without additional reads from the durable storage. There might not be room for all stateful component instances to be kept active in memory all the time and therefore least recently used instances can be passivated. When the stateful component is used again it recovers its state from durable storage and becomes an active with its system of record in memory, backed by consistent durable storage. This recovery process is also used in cases of rolling updates, rebalance, and abnormal crashes. Workflow’s Effect API The Workflow’s Effect defines the operations that Akka should perform when an incoming command is handled by a Workflow. A Workflow Effect can either: update the state of the workflow define the next step to be executed (transition) pause the workflow end the workflow fail the step or reject a command by returning an error reply to incoming commands For additional details, refer to Declarative Effects. Modeling state We want to build a simple workflow that transfers funds between two wallets. Before that, we will create a wallet subdomain with some basic functionalities that we could use later. A WalletEntity is implemented as an Event Sourced Entity, which is a better choice than a Key Value Entity for implementing a wallet, because a ledger of all transactions is usually required by the business. The Wallet class represents domain object that holds the wallet balance. We can also withdraw or deposit funds to the wallet. Wallet.java public record Wallet(String id, int balance) { public Wallet withdraw(int amount) { return new Wallet(id, balance - amount); } public Wallet deposit(int amount) { return new Wallet(id, balance + amount); } } Domain events for creating and updating the wallet. WalletEvent.java public sealed interface WalletEvent { @TypeName("created") record Created(int initialBalance) implements WalletEvent { } @TypeName("withdrawn") record Withdrawn(int amount) implements WalletEvent { } @TypeName("deposited") record Deposited(int amount) implements WalletEvent { } } The domain object is wrapped with a Event Sourced Entity component. WalletEntity.java @ComponentId("wallet") public class WalletEntity extends EventSourcedEntity<Wallet, WalletEvent> { public Effect<Done> create(int initialBalance) { (1) if (currentState() != null){ return effects().error("Wallet already exists"); } else { return effects().persist(new WalletEvent.Created(initialBalance)) .thenReply(__ -> done()); } } public Effect<Done> withdraw(int amount) { (2) if (currentState() == null){ return effects().error("Wallet does not exist"); } else if (currentState().balance() < amount) { return effects().error("Insufficient balance"); } else { return effects().persist(new WalletEvent.Withdrawn(amount)) .thenReply(__ -> done()); } } public Effect<Done> deposit(int amount) { (3) if (currentState() == null){ return effects().error("Wallet does not exist"); } else { return effects().persist(new WalletEvent.Deposited(amount)) .thenReply(__ -> done()); } } public Effect<Integer> get() { (4) if (currentState() == null){ return effects().error("Wallet does not exist"); } else { return effects().reply(currentState().balance()); } } } 1 Create a wallet with an initial balance. 2 Withdraw funds from the wallet. 3 Deposit funds to the wallet. 4 Get current wallet balance. Now we can focus on the workflow implementation itself. A workflow has state, which can be updated in command handlers and step implementations. During the state modeling we might consider the information that is required for validation, running the steps, collecting data from steps or tracking the workflow progress. TransferState.java public record TransferState(Transfer transfer, TransferStatus status) { public record Transfer(String from, String to, int amount) { (1) } public enum TransferStatus { (2) STARTED, WITHDRAW_SUCCEED, COMPLETED } public TransferState(Transfer transfer) { this(transfer, STARTED); } public TransferState withStatus(TransferStatus newStatus) { return new TransferState(transfer, newStatus); } } 1 A Transfer record encapsulates data required to withdraw and deposit funds. 2 A TransferStatus is used to track workflow progress. Implementing behavior Now that we have our workflow state defined, the remaining tasks can be summarized as follows: declare your workflow and pick a workflow id (it needs to be unique as it will be used for sharding purposes); implement handler(s) to interact with the workflow (e.g. to start a workflow, or provide additional data) or retrieve its current state; provide a workflow definition with all possible steps and transitions between them. Starting workflow Let’s have a look at what our transfer workflow will look like for the first 2 points from the above list. We will now define how to launch a workflow with a startTransfer command handler that will return an Effect to start a workflow by providing a transition to the first step. Also, we will update the state with an initial value. TransferWorkflow.java @ComponentId("transfer") (1) public class TransferWorkflow extends Workflow<TransferState> { (2) public record Withdraw(String from, int amount) { } public Effect<Done> startTransfer(Transfer transfer) { (3) if (transfer.amount() <= 0) { (4) return effects().error("transfer amount should be greater than zero"); } else if (currentState() != null) { return effects().error("transfer already started"); } else { TransferState initialState = new TransferState(transfer); (5) Withdraw withdrawInput = new Withdraw(transfer.from(), transfer.amount()); return effects() .updateState(initialState) (6) .transitionTo("withdraw", withdrawInput) (7) .thenReply(done()); (8) } } 1 Annotate such class with @ComponentId and pass a unique identifier for this workflow type. 2 Extend Workflow<S>, where S is the state type this workflow will store (i.e. TransferState). 3 Create a method to start the workflow that returns an Effect<Done> class. 4 The validation ensures the transfer amount is greater than zero and the workflow is not running already. Otherwise, we might corrupt the existing workflow. 5 From the incoming data we create an initial TransferState. 6 We instruct Akka to persist the new state. 7 With the transitionTo method, we inform that the name of the first step is "withdraw" and the input for this step is a Withdraw object. 8 The last instruction is to inform the caller that the workflow was successfully started. The @ComponentId value transfer is common for all instances of this workflow but must be stable - cannot be changed after a production deploy - and unique across the different workflow types. Workflow definition One missing piece of our transfer workflow implementation is a workflow definition method, which composes all steps connected with transitions. A workflow Step has a unique name, an action to perform (e.g. asynchronous call to an Akka component, or asynchronous call to any external service) and a transition to select the next step (or end transition to finish the workflow, in case of the last step). TransferWorkflow.java public record Deposit(String to, int amount) { } final private ComponentClient componentClient; public TransferWorkflow(ComponentClient componentClient) { this.componentClient = componentClient; (2) } @Override public WorkflowDef<TransferState> definition() { Step withdraw = step("withdraw") (1) .asyncCall(Withdraw.class, cmd -> componentClient.forEventSourcedEntity(cmd.from) (2) .method(WalletEntity::withdraw) .invokeAsync(cmd.amount)) (3) .andThen(Done.class, __ -> { Deposit depositInput = new Deposit(currentState().transfer().to(), currentState().transfer().amount()); return effects() .updateState(currentState().withStatus(WITHDRAW_SUCCEED)) .transitionTo("deposit", depositInput); (4) }); Step deposit = step("deposit") (1) .asyncCall(Deposit.class, cmd -> componentClient.forEventSourcedEntity(cmd.to) .method(WalletEntity::deposit) .invokeAsync(cmd.amount)) (5) .andThen(Done.class, __ -> { return effects() .updateState(currentState().withStatus(COMPLETED)) .end(); (6) }); return workflow() (7) .addStep(withdraw) .addStep(deposit); } 1 Each step should have a unique name. 2 Using the ComponentClient, which is injected in the constructor. 3 We instruct Akka to run a given asynchronous call to withdraw funds from a wallet. 4 After successful withdrawal we return an Effect that will update the workflow state and move to the next step called "deposit." An input parameter for this step is a Deposit record. 5 Another workflow step action to deposit funds to a given wallet. 6 This time we return an effect that will stop workflow processing, by using special end method. 7 We collect all steps to form a workflow definition. In the following example all WalletEntity interactions are not idempotent. It means that if the workflow step retries, it will make the deposit or withdraw again. In a real-world scenario, you should consider making all interactions idempotent with a proper deduplication mechanism. A very basic example of handling retries for workflows can be found in this sample. Retrieving state To have access to the current state of the workflow we can use currentState(). However, if this is the first command we are receiving for this workflow, the state will be null. We can change it by overriding the emptyState method. The following example shows the implementation of the read-only command handler: TransferWorkflow.java public ReadOnlyEffect<TransferState> getTransferState() { if (currentState() == null) { return effects().error("transfer not started"); } else { return effects().reply(currentState()); (1) } } 1 Return the current state as reply for the request. We are returning the internal state directly back to the requester. In the endpoint, it’s usually best to convert this internal domain model into a public model so the internal representation is free to evolve without breaking clients code. A full transfer workflow source code sample can be downloaded as a zip file. Follow the README file to run and test it. Pausing workflow A long-running workflow can be paused while waiting for some additional information to continue processing. A special pause transition can be used to inform Akka that the execution of the Workflow should be postponed. By launching a Workflow command handler, the user can then resume the processing. Additionally, a Timer can be scheduled to automatically inform the Workflow that the expected time for the additional data has passed. TransferWorkflow.java Step waitForAcceptation = step("wait-for-acceptation") .asyncCall(() -> { String transferId = currentState().transferId(); return timers().startSingleTimer( "acceptationTimeout-" + transferId, ofHours(8), componentClient.forWorkflow(transferId) .method(TransferWorkflow::acceptationTimeout) .deferred()); (1) }) .andThen(Done.class, __ -> effects().pause()); (2) 1 Schedules a timer as a Workflow step action. Make sure that the timer name is unique for every Workflow instance. 2 Pauses the Workflow execution. Remember to cancel the timer once the Workflow is resumed. Also, adjust the Workflow timeout to match the timer schedule. Exposing additional mutational method from the Workflow implementation should be done with special caution. Accepting a call to such method should only be possible when the Workflow is in the expected state. TransferWorkflow.java public Effect<String> accept() { if (currentState() == null) { return effects().error("transfer not started"); } else if (currentState().status() == WAITING_FOR_ACCEPTATION) { (1) Transfer transfer = currentState().transfer(); Withdraw withdrawInput = new Withdraw(currentState().withdrawId(), transfer.amount()); return effects() .transitionTo("withdraw", withdrawInput) .thenReply("transfer accepted"); } else { (2) return effects().error("Cannot accept transfer with status: " + currentState().status()); } } 1 Accepts the request only when status is WAITING_FOR_ACCEPTATION. 2 Otherwise, rejects the requests. Error handling Design for failure is one of the key attributes of all Akka components. Workflow has the richest set of configurations from all of them. It’s essential to build robust and reliable solutions. Timeouts By default, a workflow run has no time limit. It can run forever, which in most cases is not desirable behavior. A workflow step, on the other hand, has a default timeout of 5 seconds. Both settings can be overridden at the workflow definition level or for a specific step configuration. TransferWorkflow.java return workflow() .timeout(ofSeconds(5)) (1) .defaultStepTimeout(ofSeconds(2)) (2) 1 Sets a workflow global timeout. 2 Sets a default timeout for all workflow steps. A default step timeout can be overridden in step builder. TransferWorkflow.java Step failoverHandler = step("failover-handler") .asyncCall(() -> { return CompletableFuture.completedStage("handling failure"); }) .andThen(String.class, __ -> effects() .updateState(currentState().withStatus(REQUIRES_MANUAL_INTERVENTION)) .end()) .timeout(ofSeconds(1)); (1) 1 Overrides the step timeout for a specific step. Recover strategy It’s time to define what should happen in case of timeout or any other unhandled error. TransferWorkflow.java return workflow() .failoverTo("failover-handler", maxRetries(0)) (1) .defaultStepRecoverStrategy(maxRetries(1).failoverTo("failover-handler")) (2) .addStep(withdraw) .addStep(deposit, maxRetries(2).failoverTo("compensate-withdraw")) (3) 1 Set a failover transition in case of a workflow timeout. 2 Set a defa'
