full_description = "Security AnnouncementsNote Security announcements has moved to a shared page for all Akka projects and can now be found at akka.io/security Receiving Security Advisories The best way to receive any and all security announcements is to subscribe to the Akka security list. The mailing list is very low traffic, and receives notifications only after security reports have been managed by the core team and fixes are publicly available. Reporting Vulnerabilities We strongly encourage people to report such problems to our private security mailing list first, before disclosing them in a public forum. Following best practice, we strongly encourage anyone to report potential security vulnerabilities to [email protected] before disclosing them in a public forum like the mailing list or as a GitHub issue. Reports to this email address will be handled by our security team, who will work together with you to ensure that a fix can be provided without delay. Security Related Documentation Java Serialization Remote deployment allow list Remote Security Fixed Security Vulnerabilities Java Serialization, Fixed in Akka 2.4.17 Camel Dependency, Fixed in Akka 2.5.4 Broken random number generators AES128CounterSecureRNG / AES256CounterSecureRNG, Fixed in Akka 2.5.16"
