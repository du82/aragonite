ts or not. didPersistEvents boolean didPersistEvents() Returns: Whether the command handler persist events or not. getAllEvents List<Object> getAllEvents() Returns: All the events that were emitted by handling this command. getNextEventOfType <E> E getNextEventOfType(Class<E> expectedClass) Look at the next event and verify that it is of type E or fail if not or if there is no next event. If successful this consumes the event, so that the next call to this method looks at the next event from here. Returns: The next event if it is of type E, for additional assertions.'
