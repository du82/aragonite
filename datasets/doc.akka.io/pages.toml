["https://doc.akka.io/operations/organizations/regions.html"]
title = "Regions :: Akka Documentation"
full_description = "Regions Overview Akka projects are deployed to specific regions, which are tied to the backend infrastructure Akka uses to support projects. Regions: Are linked to a particular cloud provider (e.g., GCP, AWS) Exist in specific geographic locations (e.g., Europe, North America) May have unique performance characteristics Can provide varying levels of isolation (e.g., dedicated plans offer isolated regions) For Organizations When an organization is created, it is assigned access to one or more regions. A region must be specified when creating a new project within the organization. For example, if the organization myorg has access to the region `aws-us-east-`2, you would create a project in that region using the following command: akka project new myproject --organization myorg --region aws-us-east-2 Finding Available Regions If you’re unsure which regions your organization has access to, there are two options: Error Prompt: If you omit the --region flag when creating a new project, Akka will inform you of the available regions in the error message. For instance: $ akka project new myproject --organization myorg --region is a required flag. The following regions are available: [aws-us-east-2] List Regions Command: You can list the regions directly using the following command: akka regions list --organization myorg Example output: NAME ORGANIZATION aws-us-east-2 db805ff5-4fbd-4442-ab56-6e6a9a3c200a Requesting new regions By default organizations are limited to which regions they can use, particularly for trial organizations. If you would like access to other regions, you can use the ? in the upper right of the Akka Console to request additional regions via the Contact support menu item. BYOC and self-hosted regions Akka also supports Bring Your Own Cloud (BYOC) meaning that we can run regions in your AWS, Azure, or Google Cloud account. These are not available to trial users. These regions work just like any other regions and are exclusive to your workloads. To get a BYOC region setup you can Contact Us. To learn more about self-hosted Akka regions please To get a BYOC region setup you can Submit a request for more information. See also akka regions commands akka project regions commands Manage users Billing"
