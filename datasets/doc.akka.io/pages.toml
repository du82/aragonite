full_description = "Operating Akka provides capabilities to manage, monitor and gather insights from your application and its services once they are deployed. These resources will guide you through operating Akka applications and services. You should already be familiar with the Deployment model. In these sections, you can find information on: Deploying and Managing Services Operating Services provides an overview of what services are and how to manage them. Deploy and manage services Invoking Akka services Viewing data Data migration Integrating with CI/CD tools Observability and Monitoring Observability and monitoring provides the tools and guidance you need to understand your running Akka services. View logs View metrics View traces Exporting metrics, logs, and traces Organizations Organizations are the root of the Akka management tree. All services and artifacts live inside of them. They are primarily a logical construct. Managing organization users Regions Billing Projects Projects in Akka are the place where services are deployed to. They can span Regions and are the central management point for operating groups of Services in Akka. Create a new project Managing project users Configure a container registry Configure an external container registry Configure message brokers Aiven for Kafka AWS MSK Kafka Confluent Cloud Google Pub/Sub Regions Projects in Akka can span across Regions with data automatically replicated between all the regions. Shopping cart quickstart Organizations"
