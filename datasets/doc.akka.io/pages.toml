full_description = '''Akka module versions 24.10 This table lists all Akka modules that are part of the Akka 24.10 release along with their current versions. Akka 24.10.8 is cross-built for Scala 2.13 and Scala 3.3. Akka is certified for use with certain Java versions, see Java Versions. Some modules in Akka do not live up to the high standards we require to fully support them for Akka Licensees. Modules are marked with their readiness level in the “project info” section of their documentation. Akka is licensed under the Business Source License 1.1, please see Akka License FAQ. Module Current version Documentation Akka Dependencies BOM 24.10.8 Akka (core) 2.10.1 Documentation JavaDoc ScalaDoc Akka Actors 2.10.1 Documentation JavaDoc ScalaDoc Akka Cluster 2.10.1 Documentation JavaDoc ScalaDoc Akka Event Sourcing 2.10.1 Documentation JavaDoc ScalaDoc Akka Durable State 2.10.1 Documentation JavaDoc ScalaDoc Akka Streams 2.10.1 Documentation Operators JavaDoc ScalaDoc Akka gRPC 2.5.0 Documentation ScalaDoc Akka HTTP 10.7.0 Documentation Predefined Directives JavaDoc ScalaDoc Akka Persistence plugin for Cassandra 1.3.0 Documentation Akka Persistence plugin for JDBC 5.5.0 Documentation Akka Persistence plugin for R2DBC 1.3.3 Documentation Akka Persistence plugin for DynamoDB 2.0.5 Documentation Akka Projections 1.6.9 Documentation Akka Management 1.6.0 Documentation Akka Diagnostics 2.2.0 Documentation Alpakka 9.0.0 Documentation Alpakka Kafka 7.0.0 Documentation Akka Edge Rust 0.8.0 Guide API Repository The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } Akka (core) 2.10.1 At the core of Akka: A model for concurrency and distribution without all the pain of threading primitives. Documentation JavaDoc ScalaDoc Migration guides Complete dependency listing of Akka core modules Check the documentation to learn which dependencies you require. Maven<properties> <akka.version>2.10.1</akka.version> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-tools_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-discovery_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-distributed-data_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-multi-node-testkit_${scala.binary.version}</artifactId> <version>${akka.version}</version> <scope>test</scope> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-tck_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-persistence-query_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-protobuf-v3_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-remote_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor-testkit-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> <scope>test</scope> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-slf4j_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-stream_${scala.binary.version}</artifactId> <version>${akka.version}</version> <scope>test</scope> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-stream-testkit_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-stream-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-testkit_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-coordination_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-metrics_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-sharding_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-sharding-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> </dependencies>sbtval AkkaVersion = "2.10.1" libraryDependencies ++= Seq( "com.typesafe.akka" %% "akka-actor" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-tools" % AkkaVersion, "com.typesafe.akka" %% "akka-discovery" % AkkaVersion, "com.typesafe.akka" %% "akka-distributed-data" % AkkaVersion, "com.typesafe.akka" %% "akka-multi-node-testkit" % AkkaVersion % Test, "com.typesafe.akka" %% "akka-persistence" % AkkaVersion, "com.typesafe.akka" %% "akka-persistence-tck" % AkkaVersion, "com.typesafe.akka" %% "akka-persistence-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-persistence-query" % AkkaVersion, "com.typesafe.akka" %% "akka-protobuf-v3" % AkkaVersion, "com.typesafe.akka" %% "akka-remote" % AkkaVersion, "com.typesafe.akka" %% "akka-actor-testkit-typed" % AkkaVersion % Test, "com.typesafe.akka" %% "akka-slf4j" % AkkaVersion, "com.typesafe.akka" %% "akka-stream" % AkkaVersion % Test, "com.typesafe.akka" %% "akka-stream-testkit" % AkkaVersion, "com.typesafe.akka" %% "akka-stream-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-testkit" % AkkaVersion, "com.typesafe.akka" %% "akka-actor-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-coordination" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-metrics" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-sharding" % AkkaVersion, "com.typesafe.akka" %% "akka-cluster-sharding-typed" % AkkaVersion )Gradledef versions = [ AkkaVersion: "2.10.1", ScalaBinary: "2.13" ] dependencies { implementation "com.typesafe.akka:akka-actor_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-tools_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-discovery_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-distributed-data_${versions.ScalaBinary}:${versions.AkkaVersion}" testImplementation "com.typesafe.akka:akka-multi-node-testkit_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-persistence_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-persistence-tck_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-persistence-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-persistence-query_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-protobuf-v3_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-remote_${versions.ScalaBinary}:${versions.AkkaVersion}" testImplementation "com.typesafe.akka:akka-actor-testkit-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-slf4j_${versions.ScalaBinary}:${versions.AkkaVersion}" testImplementation "com.typesafe.akka:akka-stream_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-stream-testkit_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-stream-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-testkit_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-actor-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-coordination_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-metrics_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-sharding_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-cluster-sharding-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" } Akka Actors The Actor Model provides a higher level of abstraction for writing concurrent and distributed systems. It alleviates the developer from having to deal with explicit locking and thread management, making it easier to write correct concurrent and parallel systems. Documentation JavaDoc ScalaDoc Akka Cluster Akka Cluster provides a fault-tolerant decentralized peer-to-peer based Cluster Membership Service with no single point of failure or single point of bottleneck. It does this using gossip protocols and an automatic failure detector. Documentation JavaDoc ScalaDoc Akka Event Sourcing Akka Persistence enables stateful actors to persist their state so that it can be recovered when an actor is either restarted, such as after a JVM crash, by a supervisor or a manual stop-start, or migrated within a cluster. Documentation JavaDoc ScalaDoc Akka Durable State Enables stateful actors to persist their latest state, so that it can be recovered when an actor is restarted. Documentation JavaDoc ScalaDoc Akka Streams An intuitive and safe way to do asynchronous, non-blocking backpressured stream processing. Documentation Operators JavaDoc ScalaDoc Akka gRPC 2.5.0 Akka gRPC provides support for building streaming gRPC servers and clients on top of Akka Streams and Akka HTTP. Documentation ScalaDoc Maven <project> <modelVersion>4.0.0</modelVersion> <name>Project name</name> <groupId>com.example</groupId> <artifactId>my-grpc-app</artifactId> <version>0.1-SNAPSHOT</version> <properties> <akka.grpc.version>2.5.0</akka.grpc.version> <project.encoding>UTF-8</project.encoding> </properties> <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> <pluginRepositories> <pluginRepository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </pluginRepository> </pluginRepositories> <dependencies> <dependency> <groupId>com.lightbend.akka.grpc</groupId> <artifactId>akka-grpc-runtime_2.13</artifactId> <version>${akka.grpc.version}</version> </dependency> </dependencies> <build> <plugins> <plugin> <groupId>com.lightbend.akka.grpc</groupId> <artifactId>akka-grpc-maven-plugin</artifactId> <version>${akka.grpc.version}</version> <executions> <execution> <goals> <goal>generate</goal> </goals> </execution> </executions> </plugin> </plugins> </build> </project> sbt // in project/plugins.sbt: resolvers += "Akka library repository".at("https://repo.akka.io/maven") addSbtPlugin("com.lightbend.akka.grpc" % "sbt-akka-grpc" % "2.5.0") // // in build.sbt: resolvers += "Akka library repository".at("https://repo.akka.io/maven") enablePlugins(AkkaGrpcPlugin) Gradle buildscript { repositories { gradlePluginPortal() maven { url "https://repo.akka.io/maven" } } } plugins { id 'java' id 'application' id 'com.lightbend.akka.grpc.gradle' version '2.5.0' } repositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } Akka HTTP 10.7.0 The Akka HTTP modules implement a full server- and client-side HTTP stack on top of Akka Actors and Akka Streams. Documentation Predefined Directives Migration guides JavaDoc ScalaDoc Complete dependency listing of Akka HTTP modules Check the documentation to learn which dependencies you require.Maven<properties> <akka.http.version>10.7.0</akka.http.version> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-core_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-jackson_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-spray-json_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-testkit_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> <scope>test</scope> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-xml_${scala.binary.version}</artifactId> <version>${akka.http.version}</version> </dependency> </dependencies>sbtval AkkaHttpV'''
