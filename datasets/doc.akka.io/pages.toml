title = "Implementing Views :: Akka Documentation"
full_description = 'Implementing Views Views allow you to access multiple entities or retrieve entities by attributes other than their entity id. You can create Views for different access patterns, optimized by specific queries, or combine multiple queries into a single View. Views can be defined from any of the following: Key Value Entity state changes Event Sourced Entity events Messages received from subscribing to topics on a broker Events consumed from a different Akka service The remainder of this page describes: How to transform results How to modify a View Query syntax reference Be aware that Views are not updated immediately when the Entity state changes. It is not instant but eventually all changes will become visible in the query results. View updates might also take more time during failure scenarios (e.g. network instability) than during normal operation. View’s Effect API The View’s Effect defines the operations to be performed when an event, a message or a state change is handled by a View. A View Effect can either: update the view state delete the view state ignore the event or state change notification (and not update the view state) For additional details, refer to Declarative Effects. Creating a View from a Key Value Entity Consider an example of a Customer Registry service with a Customer Key Value Entity. When customer state changes, the entire state is emitted as a value change. Those value changes update any associated Views. To create a View that lists customers by their name, define the view for a service that selects customers by name and associates a table name with the View. The table is created and used to store the View. This example assumes the following Customer exists: Customer.java public record Customer(String email, String name, Address address) { (1) public Customer withName(String newName) { (2) return new Customer(email, newName, address); } public Customer withAddress(Address newAddress) { (2) return new Customer(email, name, newAddress); } } As well as a Key Value Entity component CustomerEntity.java that will produce the state changes consumed by the View. You can consult Key Value Entity documentation on how to create such an entity if needed. Define the View You implement a View by extending akka.javasdk.view.View and subscribing to changes from an entity. You specify how to query it by providing one or more methods annotated with @Query, which can then be made accessible via an HTTP Endpoint. CustomersByEmail.java import akka.javasdk.annotations.ComponentId; import akka.javasdk.annotations.Consume; import akka.javasdk.annotations.Query; import akka.javasdk.view.TableUpdater; import akka.javasdk.view.View; import customer.domain.Customer; import java.util.List; @ComponentId("customers_by_email") (1) public class CustomersByEmail extends View { (2) public record Customers(List<Customer> customers) { } @Consume.FromKeyValueEntity(CustomerEntity.class) (3) public static class CustomerByEmail extends TableUpdater<Customer> { } (4) @Query("SELECT * AS customers FROM customers_by_email WHERE email = :email") (5) public QueryEffect<Customers> getCustomer(String email) { return queryResult(); (6) } } 1 Define a component id for the view. 2 Extend from View. 3 Subscribe to updates from Key Value Entity CustomerEntity. 4 Declare a TableUpdater of type Customer (entity’s state type). 5 Define the query, including a table name (i.e. customers_by_email) of our choice. 6 Use method queryResult() to return the result of the query. Assigning a component identifier (i.e. @ComponentId) to your View is mandatory, it must be unique, and it should be stable. This allows you to refactor the name of the class later on without the risk of losing the view. If you change this identifier later, Akka will not recognize this component as the same view and will create a brand-new view. For a view consuming from an Event Sourced Entity this becomes very resource consuming because it will reprocess all the events of that entity to rebuild it. While for a view built from a topic, you can lose all the previous events because, depending on the topic configuration, you may only process events from the current time forwards. Last but not least, it’s also a problem for Key Value Entities because it will need to index them again when grouping them by some value. Using a transformed model Often, you will want to transform the entity model to which the view is subscribing into a different representation. To do that, let’s have a look at the example in which we store a summary of the Customer used in the previous section instead of the original one: CustomersByName.java public record CustomerSummary(String customerId, String name, String email) { } In this scenario, the view state should be of type CustomerSummary and you will need to handle and transform the incoming state changes into it, as shown below: CustomersByName.java import akka.javasdk.annotations.ComponentId; import akka.javasdk.annotations.Consume; import akka.javasdk.annotations.Query; import akka.javasdk.view.TableUpdater; import akka.javasdk.view.View; import customer.domain.Customer; import java.util.Collection; @ComponentId("customers_by_name") public class CustomersByName extends View { public record CustomerSummary(String customerId, String name, String email) { } @Consume.FromKeyValueEntity(CustomerEntity.class) public static class CustomerByNameUpdater extends TableUpdater<CustomerSummary> { (1) public Effect<CustomerSummary> onUpdate(Customer customer) { (2) return effects() .updateRow(new CustomerSummary(updateContext().eventSubject().get(), customer.name(), customer.email())); (3) } } @Query("SELECT * FROM customers_by_name WHERE name = :name") (4) public QueryEffect<CustomerSummary> getFirstCustomerSummary(String name) { (5) return queryResult(); } } 1 Declares a TableUpdater of type CustomerSummary. This type represents each stored row. 2 Implements a handler method onUpdate that receives the latest state of the entity Customer and returns an Effect with the updated row. 3 The id of the entity that was updated is available through the update context as eventSubject. 4 Defines the query. 5 Uses the new type CustomerSummary to return the result of the query. Handling Key Value Entity deletes The View state corresponding to an Entity is not automatically deleted when the Entity is deleted. We can update our table updater with an additional handler marked with @DeleteHandler, to handle a Key Value Entity delete operation. CustomerSummaryByName.java @Consume.FromKeyValueEntity(value = CustomerEntity.class) public static class Customers extends TableUpdater<CustomerSummary> { (1) public Effect<CustomerSummary> onUpdate(Customer customer) { return effects() .updateRow(new CustomerSummary(updateContext().eventSubject().get(), customer.name())); } // ... @DeleteHandler (2) public Effect<CustomerSummary> onDelete() { return effects().deleteRow(); (3) } } 1 Note we are adding a new handler to the existing table updater. 2 Marks the method as a delete handler. 3 An effect to delete the view row effects().deleteRow(). It could also be an update of a special column, to mark the view row as deleted. Creating a View from an Event Sourced Entity You can create a View from an Event Sourced Entity by using events that the Entity emits to build a state representation. Using our Customer Registry service example, to create a View for querying customers by name, you have to define the view to consume events. This example assumes a Customer equal to the previous example and an Event Sourced Entity that uses this Customer. The Event Sourced Entity is in charge of producing the events that update the View. These events are defined as subtypes of the class CustomerEvent using a sealed interface: CustomerEvent.java import akka.javasdk.annotations.Migration; import akka.javasdk.annotations.TypeName; public sealed interface CustomerEvent { @TypeName("internal-customer-created") (1) record CustomerCreated(String email, String name, Address address) implements CustomerEvent { } @TypeName("internal-name-changed") record NameChanged(String newName) implements CustomerEvent { } @TypeName("internal-address-changed") record AddressChanged(Address address) implements CustomerEvent { } } 1 Includes the logical type name using @TypeName annotation. It’s highly recommended to add a @TypeName to your persisted events. Akka needs to identify each event in order to deliver them to the right event handlers. If no logical type name is specified, Akka uses the FQCN, check type name documentation for more details. Define the View to consume events Defining a view that consumes from an Event Sourced Entity is very similar to the one consuming a Key Value Entity. In this case, the handler method will be called for each event emitted by the Entity. Every time an event is processed by the view, the state of the view can be updated. You can do this with the updateRow method, which is available through the effects() API. Below you can see how the View is updated: CustomerByNameView.java import akka.javasdk.annotations.ComponentId; import akka.javasdk.annotations.Consume; import akka.javasdk.annotations.Query; import akka.javasdk.view.TableUpdater; import akka.javasdk.view.View; import customer.domain.CustomerEvent; import customer.domain.CustomerRow; import customer.domain.CustomersList; @ComponentId("view_customers_by_name") (1) public class CustomerByNameView extends View { @Consume.FromEventSourcedEntity(CustomerEntity.class) public static class CustomersByName extends TableUpdater<CustomerRow> { (2) public Effect<CustomerRow> onEvent(CustomerEvent event) { (3) return switch (event) { case CustomerEvent.CustomerCreated created -> effects().updateRow(new CustomerRow(created.email(), created.name(), created.address())); case CustomerEvent.NameChanged nameChanged -> effects().updateRow(rowState().withName(nameChanged.newName())); case CustomerEvent.AddressChanged addressChanged -> effects().updateRow(rowState().withAddress(addressChanged.address())); }; } } @Query("SELECT * as customers FROM customers_by_name WHERE name = :name") public QueryEffect<CustomersList> getCustomers(String name) { return queryResult(); } } 1 Defines a component id for the view. 2 Declares a TableUpdater of type CustomerRow. 3 Handles the super type CustomerEvent and defines the proper update row method for each subtype. Ignoring events You can ignore events by returning Effect.ignore for those you are not interested in. Using a sealed interface for the events is a good practice to ensure that all events types are handled. Handling Event Sourced Entity deletes The View row corresponding to an Entity is not automatically deleted when the Entity is deleted. To delete from the View you can use the deleteRow() effect from an event transformation method, similarly to the example shown above for a Key Value Entity. Creating a View from a topic The source of a View can be a topic. It works the same way as shown in Creating a View from an Event Sourced Entity or Creating a View from a Key Value Entity, but you define it with @Consume.FromTopic instead. For the messages to be correctly consumed in the view, there must be a ce-subject metadata associated with each message. This is required because for each message consumed from the topic there will be a corresponding view row. That view row is selected based on such ce-subject. See the example below for how to pass such metadata when producing to a topic with Akka SDK. CounterJournalToTopicWithMetaConsumer.java @ComponentId("counter-journal-to-topic-with-meta") @Consume.FromEventSourcedEntity(CounterEntity.class) @Produce.ToTopic("counter-events-with-meta") (1) public class CounterJournalToTopicWithMetaConsumer extends Consumer { public Effect onEvent(CounterEvent event) { String counterId = messageContext().metadata().asCloudEvent().subject().get(); (2) Metadata metadata = Metadata.EMPTY.add("ce-subject", counterId); logger.info("Received event for counter id {}: {}", counterId, event); return effects().produce(event, metadata); (3) } } 1 Uses @Consume.FromTopic annotation to set the target topic. 2 Composes the ce-subject attribute from the entity’s event subject. 3 Returns a producing effect with the updated metadata together with the message payload. How to transform results When creating a View, you can transform the results as a projection for constructing a new type instead of using a SELECT * statement. Result projection Instead of using SELECT * you can define which columns will be used in the response message. If you want to use a CustomerSummary used on the previous section, you will need to define your entity as this: CustomerSummaryByName.java @Query("SELECT id, name FROM customers WHERE name = :customerName") (1) public QueryEffect<CustomerSummary> getCustomer(String customerName) { return queryResult(); (2) } 1 Note the renaming from customerId as id on the query, as id and name match the record CustomerSummary. 2 Returns the query result. In a similar way, you can include values from the request in the response, for example :requestId: SELECT :requestId, customerId as id, name FROM customers WHERE name = :customerName Multiple results Oftentimes a query might be designed to return multiple results. In this case, you can either: Wrap the results in a Collection field in the response type. Stream the results to the client. Wrapping results in a Collection To include the results in a Collection field in the response object, you can do as below: CustomerList.java public record CustomerList(Collection<Customer> customers) { } CustomersResponseByName.java public class CustomersResponseByName extends View { @Consume.FromKeyValueEntity(CustomerEntity.class) public static class Customers extends TableUpdater<Customer> { } (1) @Query(""" SELECT * AS customers FROM customers_by_name WHERE name = :name """) (2) public QueryEffect<CustomerList> getCustomers(String name) { (3) return queryResult(); } } 1 Table updater type is the original Customer as shown at the beginning of this section. 2 Note the use of * AS customers so records are matched to customers field in CustomersList. 3 Return type of the query is CustomersList. Streaming the result Instead of collecting the query result in memory as a collection before returning it, the entries can be streamed. To return the result as a stream, modify the returned type to be QueryStreamEffect and use queryStreamResult() to return the stream. Streaming view updates A query can provide a near real-time stream of results for the query, emitting new entries matching the query as they are added or updated in the view. This will first list the complete result for the query and then keep the response stream open, emitting new or updated entries matching the query as they are added to the view. The stream does not complete until the client closes it. To use streaming, modify the returned type to be QueryStreamEffect instead and use queryStreamResu'
