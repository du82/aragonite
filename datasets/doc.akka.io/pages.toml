["https://doc.akka.io/java/samples.html"]
title = "Samples :: Akka Documentation"
full_description = 'Samples New to Akka? Start here: Author your first Akka service to get a minimal "Hello World!" Akka service and run it locally. Samples are available that demonstrate important patterns and abstractions. These can be cloned from their respective repositories. Please refer to the README file in each repository for setup and usage instructions. Description Source download Level Build a shopping cart Github Repository Beginner A customer registry with query capabilities customer-registry-quickstart.zip Intermediate A funds transfer workflow between two wallets workflow-quickstart.zip Intermediate A user registration service implemented as a Choreography Saga choreography-saga-quickstart.zip Advanced Akka Chess: a complete, resilient, automatically scalable, event-sourced chess game Github Repository Advanced It is also possible to deploy a pre-built sample project in the Akka console, eliminating the need for local development. Maven archetype To create the build structure of a new service you can use the Maven archetype. From a command window, in the parent directory of the new service, run the following: Linux or macOS mvn archetype:generate \ -DarchetypeGroupId=io.akka \ -DarchetypeArtifactId=akka-javasdk-archetype \ -DarchetypeVersion=3.2.0 Windows 10+ mvn archetype:generate ^ -DarchetypeGroupId=io.akka ^ -DarchetypeArtifactId=akka-javasdk-archetype ^ -DarchetypeVersion=3.2.0 The Author your first Akka service starts from the Maven archetype and lets you implement a very simple service. Developer best practices Shopping cart quickstart'
