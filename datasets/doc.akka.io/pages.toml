e parsed as a JSON array of doubles. getBooleanList Optional<List<Boolean>> getBooleanList(String name) Get the boolean list claim with the given name. Parameters: name - The name of the claim. Returns: The boolean list claim, if present. Returns empty if the claim is not a JSON array of booleans or cannot be parsed as a JSON array of booleans. getNumericDateList Optional<List<Instant>> getNumericDateList(String name) Get the numeric date list claim with the given name. Parameters: name - The name of the claim. Returns: The numeric date list claim, if present. Returns empty if the claim is not a JSON array of numeric dates or cannot be parsed as a JSON array of numeric dates. getObjectList Optional<List<com.fasterxml.jackson.databind.JsonNode>> getObjectList(String name) Get the object list claim with the given name. Parameters: name - The name of the claim. Returns: The object list claim, if present. Returns empty if the claim is not a JSON array of objects or cannot be parsed as a JSON array of objects.'''
