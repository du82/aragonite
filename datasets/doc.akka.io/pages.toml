full_description = "oakka.actor.typed.pubsubTopic object TopicA pub sub topic is an actor that handles subscribing to a topic and publishing messages to all subscribed actors.It is mostly useful in a clustered setting, where it is intended to be started once on every node that want to house subscribers or publish messages to the topic, but it also works in a local setting without cluster.In a clustered context messages are deduplicated so that there is at most one message sent to each node for each publish and if there are no subscribers on a node, no message is sent to it. Note that the list of subscribers is eventually consistent and there are no delivery guarantees built in.Each topic results in a akka.actor.typed.receptionist.ServiceKey in the akka.actor.typed.receptionist.Receptionist so the same scaling recommendation holds for topics, see docs: https://doc.akka.io/libraries/akka-core/current/typed/actor-discovery.html#receptionist-scalability SourceTopic.scalaLinear SupertypesAnyRef, AnyOrderingAlphabeticBy InheritanceInheritedTopicAnyRefAnyHide AllShow AllVisibilityPublicProtectedType Members  trait Command[T] extends internal.pubsub.TopicImpl.Command[T]Not for user extension Not for user extension Annotations@DoNotInherit()  trait TopicStats extends AnyRefResponse to the GetTopicStats query.Response to the GetTopicStats query.Note that this is a snapshot of the state at one point in time, that there was subscribers at that time does not guarantee there is once this response arrives. The information cannot be used to achieve delivery guarantees, but can be useful in for example tests, to observe a subscription completed before publishing messages.Not for user extension. Annotations@DoNotInherit() Value Members  final def !=(arg0: Any): BooleanDefinition ClassesAnyRef → Any  final def ##: IntDefinition ClassesAnyRef → Any  final def ==(arg0: Any): BooleanDefinition ClassesAnyRef → Any  def apply[T](topicName: String, ttl: FiniteDuration)(implicit cla