w with the given Source so the first element emitted by that source is emitted after the last element of this flow.Concatenates this Flow with the given Source so the first element emitted by that source is emitted after the last element of this flow.This is a shorthand for concat Definition ClassesFlowOps  def ->[B](y: B): (Flow[In, Out, Mat], B)ImplicitThis member is added by an implicit conversion from Flow[In, Out, Mat] toArrowAssoc[Flow[In, Out, Mat]] performed by method ArrowAssoc in scala.Predef.Definition ClassesArrowAssocAnnotations@inline()  final def ==(arg0: Any): BooleanDefinition ClassesAnyRef → Any  def addAttributes(attr: Attributes): Repr[Out]Add the given attributes to this Flow.Add the given attributes to this Flow. If the specific attribute was already present on this graph this means the added attribute will be more specific than the existing one. If this Flow is a composite of multiple graphs, new attributes on the composite will be less specific than attributes set directly on the individual graphs of the composite. Definition ClassesFlow → Graph → FlowOps  def aggregateWithBoundary[Agg, Emit](allocate: () => Agg)(aggregate: (Agg, Out) => (Agg, Boolean), harvest: (Agg) => Emit, emitOnTimer: Option[((Agg) => Boolean, FiniteDuration)]): Repr[Emit]Aggregate input elements into an arbitrary data structure that can be completed and emitted downstream when custom condition is met which can be triggered by aggregate or timer.Aggregate input elements into an arbitrary data structure that can be completed and emitted downstream when custom condition is met which can be triggered by aggregate or timer. It can be thought of a more general groupedWeightedWithin.Emits when the aggregation function decides the aggregate is complete or the timer function returns trueBackpressures when downstream backpressures and the aggregate is completeCompletes when upstream completes and the last aggregate has been emitted downstreamCancels when downstream cancels allocateallocate the initial data structure for aggregated elementsaggregateupdate the aggregated elements, return true if ready to emit after update.harvestthis is invoked before emit within the current stage/operatoremitOnTimerdecide whether the current aggregated elements can be emitted, the custom function is invoked on every intervalDefinition ClassesFlowOpsAnnotations@ApiMayChange()  def alsoTo(that: Graph[SinkShape[Out], _]): Repr[Out]Attaches the given Sink to this Source, meaning that elements that pass through will also be sent to the Sink.Attaches the given Sink to this Source, meaning that elements that pass through will also be sent to the Sink.It is similar to #wireTap but will backpressure instead of dropping elements when the given Sink is not ready.Emits when element is available and demand exists both from the Sink and the downstream.Backpressures when downstream or Sink backpressuresCompletes when upstream completesCancels when downstream or Sink cancels Definition ClassesFlowOps  def alsoToAll(those: Graph[SinkShape[Out], _]*): Repr[Out]Attaches the given Sinks to this Source, meaning that elements that pass through will also be sent to the Sink.Attaches the given Sinks to this Source, meaning that elements that pass through will also be sent to the Sink.It is similar to #wireTap but will backpressure instead of dropping elements when the given Sinks is not ready.Emits when element is available and demand exists both from the Sinks and the downstream.Backpressures when downstream or any of the Sinks backpressuresCompletes when upstream completesCancels when downstream or any of the Sinks cancels Definition ClassesFlowOps  def alsoToGraph[M](that: Graph[SinkShape[Out], M]): Graph[FlowShape[Out, Out], M]Attributesprotected Definition ClassesFlowOps  def alsoToMat[Mat2, Mat3](that: Graph[SinkShape[Out], Mat2])(matF: (Mat, Mat2) => Mat3): ReprMat[Out, Mat3]Attaches the given Sink to this Flow, meaning that elements that pass through will also be sent to the Sink.Attaches the given Sink to this Flow, meaning that elements that pass through will also be sent to the Sink. Definition ClassesFlowOpsMatSee also#alsoTo It is recommended to use the internally optimized Keep.left and Keep.right combiners where appropriate instead of manually writing functions that pass through one of the values.  def asFlowWithContext[U, CtxU, CtxOut](collapseContext: (U, CtxU) => In)(extractContext: (Out) => CtxOut): FlowWithContext[U, CtxU, Out, CtxOut, Mat]Turns a Flow into a FlowWithContext which manages a context per element along a stream.Turns a Flow into a FlowWithContext which manages a context per element along a stream. collapseContextturn each incoming pair of element and context value into an element of this FlowextractContextturn each outgoing element of this Flow into an outgoing context value  final def asInstanceOf[T0]: T0Definition ClassesAny  def asJava[JIn <: In]: javadsl.Flow[JIn, Out, Mat]Converts this Scala DSL element to it's Java DSL counterpart.  def ask[S](parallelism: Int)(ref: ActorRef)(implicit timeout: Timeout, tag: ClassTag[S]): Repr[S]Use the ask pattern to send a request-reply message to the target ref actor.Use the ask pattern to send a request-reply message to the target ref actor. If any of the asks times out it will fail the stream with a akka.pattern.AskTimeoutException.Do not forget to include the expected response type in the method call, like so:flow.ask[ExpectedReply](parallelism = 4)(ref)otherwise Nothing will be assumed, which is most likely not what you want.Parallelism limits the number of how many asks can be "in flight" at the same time. Please note that the elements emitted by this operator are in-order with regards to the asks being issued (i.e. same behaviour as mapAsync).The operator fails with an akka.stream.WatchedActorTerminatedException if the target actor is terminated, or with an java.util.concurrent.TimeoutException in case the ask exceeds the timeout passed in.Adheres to the ActorAttributes.SupervisionStrategy attribute.Emits when the futures (in submission order) created by the ask pattern internally are completedBackpressures when the number of futures reaches the configured parallelism and the downstream backpressuresCompletes when upstream completes and all futures have been completed and all elements have been emittedFails when the passed in actor terminates, or a timeout is exceeded in any of the asks performedCancels when downstream cancels Definition ClassesFlowOpsAnnotations@implicitNotFound()  def ask[S](ref: ActorRef)(implicit timeout: Timeout, tag: ClassTag[S]): Repr[S]Use the ask pattern to send a request-reply message to the target ref actor.Use the ask pattern to send a request-reply message to the target ref actor. If any of the asks times out it will fail the stream with a akka.pattern.AskTimeoutException.Do not forget to include the expected response type in the method call, like so:flow.ask[ExpectedReply](ref)otherwise Nothing will be assumed, which is most likely not what you want.Defaults to parallelism of 2 messages in flight, since while one ask message may be being worked on, the second one still be in the mailbox, so defaulting to sending the second one a bit earlier than when first ask has replied maintains a slightly healthier throughput.Similar to the plain ask pattern, the target actor is allowed to reply with akka.util.Status. An akka.util.Status#Failure will cause the operator to fail with the cause carried in the Failure message.The operator fails with an akka.stream.WatchedActorTerminatedException if the target actor is terminated.Adheres to the ActorAttributes.SupervisionStrategy attribute.Emits when the futures (in submission order) created by the ask pattern internally are completedBackpressures when the number of futures reaches the configured parallelism and the downstream backpressuresCompletes when upstream completes and all futures have been completed and all elements have been emittedFails when the passed in actor terminates, or a timeout is exceeded in any of the asks performedCancels when downstream cancels Definition ClassesFlowOpsAnnotations@implicitNotFound()  def async(dispatcher: String, inputBufferSize: Int): Repr[Out]Put an asynchronous boundary around this Flow Put an asynchronous boundary around this Flow dispatcherRun the graph on this dispatcherinputBufferSizeSet the input buffer to this size for the graphDefinition ClassesFlow → Graph  def async(dispatcher: String): Repr[Out]Put an asynchronous boundary around this Flow Put an asynchronous boundary around this Flow dispatcherRun the graph on this dispatcherDefinition ClassesFlow → Graph  def async: Repr[Out]Put an asynchronous boundary around this Flow Put an asynchronous boundary around this Flow Definition ClassesFlow → Graph → FlowOps  def backpressureTimeout(timeout: FiniteDuration): Repr[Out]If the time between the emission of an element and the following downstream demand exceeds the provided timeout, the stream is failed with a akka.stream.BackpressureTimeoutException.If the time between the emission of an element and the following downstream demand exceeds the provided timeout, the stream is failed with a akka.stream.BackpressureTimeoutException. The timeout is checked periodically, so the resolution of the check is one period (equals to timeout value).Emits when upstream emits an elementBackpressures when downstream backpressuresCompletes when upstream completes or fails if timeout elapses between element emission and downstream demand.Cancels when downstream cancels Definition ClassesFlowOps  def batch[S](max: Long, seed: (Out) => S)(aggregate: (S, Out) => S): Repr[S]Allows a faster upstream to progress independently of a slower subscriber by aggregating elements into batches until the subscriber is ready to accept them.Allows a faster upstream to progress independently of a slower subscriber by aggregating elements into batches until the subscriber is ready to accept them. For example a batch step might store received elements in an array up to the allowed max limit if the upstream publisher is faster.This only rolls up elements if the upstream is faster, but if the downstream is faster it will not duplicate elements.Adheres to the ActorAttributes.SupervisionStrategy attribute.Emits when downstream stops backpressuring and there is an aggregated element availableBackpressures when there are max batched elements and 1 pending element and downstream backpressuresCompletes when upstream completes and there is no batched/pending element waitingCancels when downstream cancelsSee also FlowOps.conflateWithSeed, FlowOps.batchWeighted maxmaximum number of elements to batch before backpressuring upstream (must be positive non-zero)seedProvides the first state for a batched value using the first unconsumed element as a startaggregateTakes the currently batched value and the current pending element to produce a new aggregateDefinition ClassesFlowOps  def batchWeighted[S](max: Long, c'''
