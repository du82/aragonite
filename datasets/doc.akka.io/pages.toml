title = "Cluster Usage • Akka Documentation"
description = "Build distributed applications that scale across the network with Akka Cluster, a fault-tolerant decentralized peer-to-peer based cluster node membership service with no single point of failure."
full_description = 'Cluster Usage This document describes how to use Akka Cluster and the Cluster APIs. The Stateful or Stateless Applications: To Akka Cluster or not video is a good starting point to understand the motivation to use Akka Cluster. For specific documentation topics see: When and where to use Akka Cluster Cluster Specification Cluster Membership Service Higher level Cluster tools Rolling Updates Operating, Managing, Observability You are viewing the documentation for the new actor APIs, to view the Akka Classic documentation, see Classic Cluster. You have to enable serialization to send messages between ActorSystems (nodes) in the Cluster. Serialization with Jackson is a good choice in many cases, and our recommendation if you don’t have other preferences or constraints. Module info The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository.sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } To use Akka Cluster add the following dependency in your project:sbtval AkkaVersion = "2.10.2" libraryDependencies += "com.typesafe.akka" %% "akka-cluster-typed" % AkkaVersionMaven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-cluster-typed_${scala.binary.version}</artifactId> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-cluster-typed_${versions.ScalaBinary}" } Project Info: Akka Cluster (typed) Artifactcom.typesafe.akka akka-cluster-typed 2.10.2 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.cluster.typed LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 2.6.0, 2019-11-06 Home pagehttps://akka.io/ API documentation API (Scaladoc) API (Javadoc) Forums Akka Discuss Release notesAkka release notes IssuesGithub issues Sourceshttps://github.com/akka/akka Cluster API Extension The Cluster extension gives you access to management tasks such as Joining, Leaving and Downing and subscription of cluster membership events such as MemberUp, MemberRemoved and UnreachableMember, which are exposed as event APIs. It does this through these references on the ClusterCluster extension: manager: An ActorRefActorRef[akka.cluster.typed.ClusterCommandakka.cluster.typed.ClusterCommand]ActorRefActorRef<akka.cluster.typed.ClusterCommandakka.cluster.typed.ClusterCommand> where a ClusterCommand is a command such as: JoinJoin, LeaveLeave and DownDown subscriptions: An ActorRefActorRef[akka.cluster.typed.ClusterStateSubscriptionakka.cluster.typed.ClusterStateSubscription]ActorRefActorRef<akka.cluster.typed.ClusterStateSubscriptionakka.cluster.typed.ClusterStateSubscription> where a ClusterStateSubscription is one of GetCurrentStateGetCurrentState or SubscribeSubscribe and UnsubscribeUnsubscribe to cluster events like MemberRemovedMemberRemoved state: The current CurrentClusterStateCurrentClusterState All of the examples below assume the following imports: Scala copysourceimport akka.actor.typed._ import akka.actor.typed.scaladsl._ import akka.cluster.ClusterEvent._ import akka.cluster.MemberStatus import akka.cluster.typed._ Java copysourceimport akka.actor.typed.*; import akka.actor.typed.javadsl.*; import akka.cluster.ClusterEvent; import akka.cluster.typed.*; The minimum configuration required is to set a host/port for remoting and the akka.actor.provider = "cluster". copysourceakka { actor { provider = "cluster" } remote.artery { canonical { hostname = "127.0.0.1" port = 2551 } } cluster { seed-nodes = [ "akka://[email protected]:2551", "akka://[email protected]:2552"] downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider" } } Accessing the ClusterCluster extension on each node: Scala copysourceval cluster = Cluster(system) Java copysourceCluster cluster = Cluster.get(system); Note The name of the cluster’s ActorSystemActorSystem must be the same for all members, which is passed in when you start the ActorSystem. Joining and Leaving a Cluster If not using configuration to specify seed nodes to join, joining the cluster can be done programmatically via the managermanager(). Scala copysourcecluster.manager ! Join(cluster.selfMember.address) Java copysourcecluster.manager().tell(Join.create(cluster.selfMember().address())); Leaving the cluster and downing a node are similar: Scala copysourcecluster2.manager ! Leave(cluster2.selfMember.address) Java copysourcecluster2.manager().tell(Leave.create(cluster2.selfMember().address())); Cluster Subscriptions Cluster subscriptionssubscriptions() can be used to receive messages when cluster state changes. For example, registering for all MemberEventMemberEvent’s, then using the manager to have a node leave the cluster will result in events for the node going through the Membership Lifecycle. This example subscribes to a subscriber: ActorRef[MemberEvent]ActorRef<MemberEvent> subscriber: Scala copysourcecluster.subscriptions ! Subscribe(subscriber, classOf[MemberEvent]) Java copysourcecluster.subscriptions().tell(Subscribe.create(subscriber, ClusterEvent.MemberEvent.class)); Then asking a node to leave: Scala copysourcecluster.manager ! Leave(anotherMemberAddress) // subscriber will receive events MemberLeft, MemberExited and MemberRemoved Java copysourcecluster.manager().tell(Leave.create(anotherMemberAddress)); // subscriber will receive events MemberLeft, MemberExited and MemberRemoved Cluster State Instead of subscribing to cluster events it can sometimes be convenient to only get the full membership state with Cluster(system).stateCluster.get(system).state(). Note that this state is not necessarily in sync with the events published to a cluster subscription. See Cluster Membership more information on member events specifically. There are more types of change events, consult the API documentation of classes that extends akka.cluster.ClusterEvent.ClusterDomainEventakka.cluster.ClusterEvent.ClusterDomainEvent for details about the events. Cluster Membership API Joining The seed nodes are initial contact points for joining a cluster, which can be done in different ways: automatically with Cluster Bootstrap with configuration of seed-nodes programatically After the joining process the seed nodes are not special and they participate in the cluster in exactly the same way as other nodes. Joining automatically to seed nodes with Cluster Bootstrap Automatic discovery of nodes for the joining process is available using the Akka Management project’s module, Cluster Bootstrap. Please refer to its documentation for more details. Joining configured seed nodes When a new node is started it sends a message to all seed nodes and then sends a join command to the one that answers first. If none of the seed nodes replies (might not be started yet) it retries this procedure until success or shutdown. You can define the seed nodes in the configuration file (application.conf): akka.cluster.seed-nodes = [ "akka://ClusterSystem@host1:2552", "akka://ClusterSystem@host2:2552"] This can also be defined as Java system properties when starting the JVM using the following syntax: -Dakka.cluster.seed-nodes.0=akka://ClusterSystem@host1:2552 -Dakka.cluster.seed-nodes.1=akka://ClusterSystem@host2:2552 When a new node is started it sends a message to all configured seed-nodes and then sends a join command to the one that answers first. If none of the seed nodes replies (might not be started yet) it retries this procedure until successful or shutdown. The seed nodes can be started in any order. It is not necessary to have all seed nodes running, but the node configured as the first element in the seed-nodes list must be started when initially starting a cluster. If it is not, the other seed-nodes will not become initialized, and no other node can join the cluster. The reason for the special first seed node is to avoid forming separated islands when starting from an empty cluster. It is quickest to start all configured seed nodes at the same time (order doesn’t matter), otherwise it can take up to the configured seed-node-timeout until the nodes can join. As soon as more than two seed nodes have been started, it is no problem to shut down the first seed node. If the first seed node is restarted, it will first try to join the other seed nodes in the existing cluster. Note that if you stop all seed nodes at the same time and restart them with the same seed-nodes configuration they will join themselves and form a new cluster, instead of joining remaining nodes of the existing cluster. That is likely not desired and can be avoided by listing several nodes as seed nodes for redundancy, and don’t stop all of them at the same time. If you are going to start the nodes on different machines you need to specify the ip-addresses or host names of the machines in application.conf instead of 127.0.0.1 Joining programmatically to seed nodes Joining programmatically is useful when dynamically discovering other nodes at startup through an external tool or API. Scala copysourceimport akka.actor.Address import akka.actor.AddressFromURIString import akka.cluster.typed.JoinSeedNodes val seedNodes: List[Address] = List("akka://[email protected]:2551", "akka://[email protected]:2552").map(AddressFromURIString.parse) Cluster(system).manager ! JoinSeedNodes(seedNodes) Java copysourceimport akka.actor.Address; import akka.actor.AddressFromURIString; import akka.cluster.Member; import akka.cluster.typed.JoinSeedNodes; List<Address> seedNodes = new ArrayList<>(); seedNodes.add(AddressFromURIString.parse("akka://[email protected]:2551")); seedNodes.add(AddressFromURIString.parse("akka://[email protected]:2552")); Cluster.get(system).manager().tell(new JoinSeedNodes(seedNodes)); The seed node address list has the same semantics as the configured seed-nodes, and the the underlying implementation of the process is the same, see Joining configured seed nodes. When joining to seed nodes you should not include the node itself, except for the node that is supposed to be the first seed node bootstrapping the cluster. The desired initial seed node address should be placed first in the parameter to the programmatic join. Tuning joins Unsuccessful attempts to contact seed nodes are automatically retried after the time period defined in configuration property seed-node-timeout. Unsuccessful attempts to join a specific seed node are automatically retried after the configured retry-unsuccessful-join-after. Retrying means that it tries to contact all seed nodes, then joins the node that answers first. The first node in the list of seed nodes will join itself if it cannot contact any of the other seed nodes within the configured seed-node-timeout. The joining of given seed nodes will, by default, be retried indefinitely until a successful join. That process can be aborted if unsuccessful by configuring a timeout. When aborted it will run Coordinated Shutdown, which will terminate the ActorSystem by default. CoordinatedShutdown can also be configured to exit the JVM. If the seed-nodes are assembled dynamically, it is useful to define this timeout, and a restart with new seed-nodes should be tried after unsuccessful attempts. akka.cluster.shutdown-after-unsuccessful-join-seed-nodes = 20s akka.coordinated-shutdown.exit-jvm = on If you don’t configure seed nodes or use one of the join seed node functions, you need to join the cluster manually by using JMX or HTTP. You can join to any node in the cluster. It does not have to be configured as a seed node. Note that you can only join to an existing cluster member, which for bootstrapping means a node must join itself and subsequent nodes could join them to make up a cluster. An actor system can only join a cluster once, additional attempts will be ignored. Once an actor system has successfully joined a cluster, it would have to be restarted to join the same cluster again. It can use the same host name and port after the restart. When it come up as a new incarnation of an existing member in the cluster and attempts to join, the existing member will be removed and its new incarnation allowed to join. Leaving There are a few ways to remove a member from the cluster. The recommended way to leave a cluster is a graceful exit, informing the cluster that a node shall leave. This is performed by Coordinated Shutdown when the ActorSystemActorSystem is terminated and also when a SIGTERM is sent from the environment to stop the JVM process. Graceful exit can also be performed using HTTP or JMX. When a graceful exit is not possible, for example in case of abrupt termination of the the JVM process, the node will be detected as unreachable by other nodes and removed after Downing. Graceful leaving offers faster hand off to peer nodes during node shutdown than abrupt termination and downing. The Coordinated Shutdown will also run when the cluster node sees itself as Exiting, i.e. leaving from another node will trigger the shutdown process on the leaving node. Tasks for graceful leaving of cluster, including graceful shutdown of Cluster Singletons and Cluster Sharding, are added automatically when Akka Cluster is used. For example, running the shutdown process will also trigger the graceful leaving if not already in progress. Normally this is handled automatically, but in case of network failures during this process it may still be necessary to set the node’s status to Down in order to complete the removal, see Downing. Downing In many cases a member can gracefully exit from the cluster, as described in Leaving, but there are scenarios when an explicit downing decision is needed before it can be removed. For example in case of abrupt termination of the the JVM process, system overload that doesn’t recover, or network partitions that don’t heal. In such cases, the node(s) will be detected as unreachable by other nodes, but they must also be marked as Down before they are removed. When a member is considered by the failure detector to be unreachable the leader is not allowed to perform its duties, such as changing status of new joining members to ‘Up’. The node must first become reachable again, or the status of the '
