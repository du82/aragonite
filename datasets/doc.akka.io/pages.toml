["https://doc.akka.io/java/consuming-producing.html"]
title = "Consuming and producing :: Akka Documentation"
full_description = '''Consuming and producing Consuming and producing allow stream based interaction between services and also with the outside world. Consuming or publishing a stream of events is a common Microservices pattern. The source of events can be the journal of an Event Sourced Entity, the Key Value Entity state changes, a Google Cloud Pub/Sub or Apache Kafka topic for asynchronous messaging between services. In this section, we will explore how you can use a Consumer component to: Consume events emitted by an Event Sourced Entity within the same service. Consume state changes emitted by a Key Value Entity within the same service. Consume events from Event Sourced Entities using as service to service eventing. Consume messages from topics of Google Cloud Pub/Sub or Apache Kafka. Produce messages to a Google Cloud Pub/Sub or Apache Kafka topic. Events and messages are guaranteed to be delivered at least once. This means that Consumers must be able to handle duplicated messages. Consumer’s Effect API The Consumer’s Effect defines the operations that Akka should perform when an incoming message is delivered to the Consumer. A Consumer Effect can either: return a message to be published to a Topic (in case the method is a publisher) return Done to indicate that the message was processed successfully ignore the incoming message For additional details, refer to Declarative Effects. Consume from Event Sourced Entity You can consume event from an Event Sourced Entity by adding @Consume.FromEventSourcedEntity as a type level annotation of your Consumer implementation. CounterEventsConsumer.java @ComponentId("counter-events-consumer") (1) @Consume.FromEventSourcedEntity(CounterEntity.class) (2) public class CounterEventsConsumer extends Consumer { (3) public Effect onEvent(CounterEvent event) { (4) return switch (event) { case ValueIncreased valueIncreased -> { //processing value increased event yield effects().done(); (5) } case ValueMultiplied valueMultiplied -> effects().ignore(); (6) }; } } 1 Set component id, like for any other component. 2 Set the source of the events to the Event Sourced Entity CounterEntity. 3 Extend the Consumer component class. 4 Add handler for CounterEvent events. 5 Return effect().done() when processing is completed. 6 Return effect().ignore() to ignore the event and continue the processing. If an exception is raised during the event processing. Akka runtime will redelivery the event until the application process it without failures. When deleting Event Sourced Entities, and want to act on it in a consumer, make sure to persist a final event representing the deletion before triggering delete. Consume from Key Value Entity You can consume state changes from a Key Value Entity. To receive messages with the entity state changes, annotate the Consumer with @Consume.FromKeyValueEntity and specify the class of the entity. Although it looks similar to an Event Sourced Entity Consumer, the semantics are different. The Key Value Entity Consumer is guaranteed to receive the most recent state change, but not all changes in between in case of a very high update pace. ShoppingCartConsumer.java @ComponentId("shopping-cart-consumer") @Consume.FromKeyValueEntity(ShoppingCartEntity.class) (1) public class ShoppingCartConsumer extends Consumer { public Effect onChange(ShoppingCart shoppingCart) { (2) //processing shopping cart change return effects().done(); } @DeleteHandler public Effect onDelete() { (3) //processing shopping cart delete return effects().done(); } } 1 Set the source to the Key Value Entity ShoppingCartEntity. 2 Add handler for ShoppingCart state update. 3 Optionally, add handler when the entity is deleted. Service to Service Eventing An Akka application can be comprised of multiple services working to support specific business requirements. Although each service is an independent deployable unit, often times information needs to flow between those services. Akka provides brokerless at-least-once event delivery across Akka services in the same project through the Service to Service eventing. The source of the events is an Event Sourced Entity. Its events can be published as a stream and consumed by another Akka service without the need to set up a message broker. For eventing from an entity inside the same Akka service as the consuming component, use regular @Consume.FromEventSourcedEntity instead of Service to Service eventing. Event Producer The event producer is a Consumer that consumes the events from a local source and makes them available for consumption from another service. This is done with an additional @Produce.ServiceStream annotation, the stream id is what identifies the specific stream of events from the consuming services. The ACL configuration is set to allow access from specific (or all) Akka services. To illustrate how to publish entity events, let’s assume the existence of a CustomerEntity that emits events of types: CustomerCreated, NameChanged and AddressChanged. You will get the events delivered to a Consumer, transform them to a public set of event types and let them be published to a stream. CustomerEvents.java @ComponentId("customer-events-service") @Consume.FromEventSourcedEntity(CustomerEntity.class) (1) @Produce.ServiceStream(id = "customer_events") (2) @Acl(allow = @Acl.Matcher(service = "*")) (3) public class CustomerEvents extends Consumer { public Effect onEvent(CustomerEvent event) { (4) return switch (event) { case CustomerCreated created -> effects() .produce(new CustomerPublicEvent.Created(created.email(), created.name())); case NameChanged nameChanged -> effects() .produce(new CustomerPublicEvent.NameChanged(nameChanged.newName())); case AddressChanged __ -> effects().ignore(); (5) }; } } 1 Identify which Event Sourced Entity to publish events for. 2 Set stream public identifier for Consumers. 3 Allow access from other Akka services (in the same project), but not from the public internet. 4 Event handler transforms service internal event model into public API types. 5 Filter event types that should not be available to consuming services using ignore(). Event Consumer The consuming side can be a Consumer or a View, annotated with @Consume.FromStream with a service identifying the publishing service, and the id of the stream to subscribe to. CustomersByNameView.java @ComponentId("customers_by_name") public class CustomersByNameView extends View { @Consume.FromServiceStream( (1) service = "customer-registry", (2) id = "customer_events", (3) consumerGroup = "customer-by-name-view" (4) ) public static class CustomersByName extends TableUpdater<Customer> { public Effect<Customer> onEvent( (5) CustomerPublicEvent.Created created) { var id = updateContext().eventSubject().get(); return effects().updateRow( new Customer(id, created.email(), created.name())); } public Effect<Customer> onEvent( CustomerPublicEvent.NameChanged nameChanged) { var updated = rowState().withName(nameChanged.newName()); return effects().updateRow(updated); } } @Query("SELECT * as customers FROM customers_by_name WHERE name = :name") public QueryEffect<CustomersList> findByName(String name) { return queryResult(); } } 1 Annotate the Table Updater with @Consume.FromStream to subscribe to an event stream from another Akka service. 2 The name of the Akka service publishing the event stream. 3 The public identifier of the specific stream. 4 Consumer group is required in case many consumers subscribing to the same stream. 5 Handler method per message type that the stream may contain. If you’re looking to test this locally, you will likely need to run the 2 services with different ports. For more details, consult Running multiple services. Consume from a message broker Topic To receive messages from a Google Cloud Pub/Sub or Apache Kafka topic, annotate the Consumer class with @Consume.FromTopic and specify the topic name. Only topic names are referenced and no additional details about how to connect to the topics are needed. When deploying the application there must be a broker configuration in the Akka project, with credentials and details on how connect to the broker. For details about configuring a broker see Configure message brokers. In the following example the events from the topic are delivered to the Consumer and logged. CounterEventsTopicConsumer.java @ComponentId("counter-events-topic-consumer") @Consume.FromTopic(value = "counter-events") (1) public class CounterEventsTopicConsumer extends Consumer { private Logger logger = LoggerFactory.getLogger(CounterEventsTopicConsumer.class); public Effect onValueIncreased(ValueIncreased event) { (2) logger.info("Received increased event: " + event.toString()); return effects().done(); (3) } public Effect onValueMultiplied(ValueMultiplied event) { (2) logger.info("Received multiplied event: " + event.toString()); return effects().done(); } } 1 Consume from topic 'counter-events'. 2 Add handler for a given message type. 3 Mark processing as completed. By default, Akka assumes the messages in the topic were serialized as JSON and as such, deserializes them into the input type of your handlers by taking advantage of CloudEvents standard. Receiving CloudEvents This time instead of a single event handler, we have a handler for each message type. Consumer is able to match the payload type to the handler method based on the ce-type attribute of the CloudEvent message. Akka uses the CloudEvents standard when receiving from and publishing to topics. The CloudEvents specification standardizes message metadata so that systems can integrate more easily. Describing the structure of the message payload is the CloudEvents feature most important to Akka. An example of that is the capability to send serialized JSON messages and have Akka deserialize them accordingly. To allow proper reading of JSON messages from external topics, the messages need to specify the message attributes: Content-Type = application/json ce-specversion = 1.0 ce-type = fully qualified name (e.g. com.example.ValueIncreased) (The ce- prefixed attributes are part of the CloudEvents specification.) Receiving Bytes If the content type is application/octet-stream, no content type is present, or the type is unknown to Akka, the message is treated as a binary message. The topic subscriber method must accept the byte[] message. RawBytesConsumer.java public class RawBytesConsumer extends Consumer { public Effect onMessage(byte[] bytes) { (1) // deserialization logic here return effects().done(); } } 1 When consuming raw bytes messages from a topic the input type must be byte[]. If a Consumer produce messages of byte[] type to a topic, the messages published to the topic will have content-type application/octet-stream. Producing to a Topic Producing to a topic is the same as producing to a stream in service to service eventing. The only difference is the @Produce.ToTopic annotation. Used to set a destination topic name. To guarantee that events for each entity can be read from the message broker in the same order they were written, the cloud event subject id must be specified in metadata along with the event. See how to in Metadata below. CounterJournalToTopicConsumer.java @ComponentId("counter-journal-to-topic") @Consume.FromEventSourcedEntity(CounterEntity.class) (1) @Produce.ToTopic("counter-events") (2) public class CounterJournalToTopicConsumer extends Consumer { public Effect onEvent(CounterEvent event) { (3) return effects().produce(event); (4) } } 1 Set the source to events from the CounterEntity. 2 Set the destination to a topic name 'counter-events'. 3 Add handler for the counter events. 4 Return Effect.produce to produce events to the topic. Only topic names are referenced and no additional details about how to connect to the topics are needed. When deploying the application there must be a broker configuration in the Akka project, with credentials and details on how connect to the broker. For details about configuring a broker see Configure message brokers. Handling Serialization Check serialization documentation for more details. Deployment-dependent sources It is possible to use environment variables to control the name of the service or topic that a consumer consumes from, this is useful for example for using the same image in staging and production deployments but having them consume from different source services. Referencing environment variables is done with the syntax ${VAR_NAME} in the service parameter of the @Consume.FromStream annotation or value parameter of the @Consume.FromTopic annotation. Changing the service or topic name after it has once been deployed means the consumer will start over from the beginning of the event stream. See akka service deploy -h for details on how to set environment variables when deploying a service. Metadata For many use cases, a Consumer from Event Sourced or Key Value Entity will trigger other services and needs to pass the entity ID to the receiver. You can include this information in the event payload (or Key Value Entity state) or use built-in metadata to get this information. It is made available to the consumer via the metadata messageContext().metadata().get("ce-subject"). The same value can be also accessed via CloudEvent interface. Using metadata is also possible when producing messages to a topic or a stream. You can pass some additional information which will be available to the consumer. CounterJournalToTopicWithMetaConsumer.java @ComponentId("counter-journal-to-topic-with-meta") @Consume.FromEventSourcedEntity(CounterEntity.class) @Produce.ToTopic("counter-events-with-meta") (1) public class CounterJournalToTopicWithMetaConsumer extends Consumer { public Effect onEvent(CounterEvent event) { String counterId = messageContext().metadata().asCloudEvent().subject().get(); (2) Metadata metadata = Metadata.EMPTY.add("ce-subject", counterId); logger.info("Received event for counter id {}: {}", counterId, event); return effects().produce(event, metadata); (3) } } 1 Get the counter ID from the metadata. 2 Publish event to the topic with custom metadata. Testing the Integration When an Akka service relies on a broker, it might be useful to use integration tests to assert that those boundaries work as intended. For such scenarios, you can either: Use TestKit’s mocked topic: this offers a general API to inject messages into topics or read the messages written to another topic, regardless of the specific broker integration you have configured. Run an external broker instance: if you’re interested in running your integration tests against a real instance, you need to provide the broker instance yourself by running it in a separate process in your local setup and make sure to disable the use of TestKit’s test broker. Currently, the only external broker supported in integration tests is Google PubSub Emulator. TestKit Mocked Incoming Messages Following up on the counter entity example used above, let’s consider an example (composed by 2 Consumer and 1 Even'''
author = "Akka Documentation"
year_published = 2025
