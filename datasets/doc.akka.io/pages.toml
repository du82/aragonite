full_description = "Alpakka Documentation The Alpakka project is an initiative to implement stream-aware and reactive integration pipelines for Java and Scala. It is built on top of Akka Streams, and has been designed from the ground up to understand streaming natively and provide a DSL for reactive and stream-oriented programming, with built-in support for backpressure. Akka Streams is a Reactive Streams and JDK 9+ java.util.concurrent.Flow-compliant implementation and therefore fully interoperable with other implementations. Overview Versions Contributing External Components Self-contained examples Other documentation Integration Patterns Release Notes Data Transformations Parsing Lines JSON Compressing/decompressing Comma-Separated Values - CSV RecordIO Framing Text and charsets Extensible Markup Language - XML AMQP Artifacts Connecting to server Sending messages Receiving messages Using Pub/Sub Using rabbitmq as an RPC mechanism Acknowledging messages downstream Apache Camel External library Apache Cassandra Artifacts Sessions Reading from Cassandra Writing to Cassandra Custom Session creation Apache Geode Artifacts Setup Writing to Geode Reading from Geode Geode basic commands Apache Kafka Separate repository Apache Kudu Artifacts Configuration Writing to Kudu in a Flow Writing to Kudu with a Sink Apache Solr Artifacts Set up a Solr client Reading from Solr Writing to Solr Update documents Delete documents by ids Delete documents by query Avro Parquet Artifacts Source Initiation Sink Initiation Flow Initiation Running the example code AWS EventBridge Artifacts Setup Publish messages to AWS EventBridge Event Bus Integration testing Shared AWS client configuration AWS DynamoDB Artifacts Setup Sending requests and receiving responses Error Retries and Exponential Backoff AWS Kinesis and Firehose Artifacts Kinesis Data Streams AWS KCL Scheduler Source & checkpointer AWS Lambda Artifacts Setup Sending messages AwsLambdaFlow configuration AWS S3 Artifacts Configurati