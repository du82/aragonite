title = "ActorFlow.askWithContext • Akka Documentation"
description = "Akka is a toolkit for building highly concurrent, distributed, and resilient message-driven applications for Java and Scala."
full_description = 'ActorFlow.askWithContext Use the “Ask Pattern” to send each stream element (without the context) as an ask to the target actor (of the new actors API), and expect a reply that will be emitted downstream. Actor interop operators Dependency This operator is included in:sbtval AkkaVersion = "2.10.2" libraryDependencies += "com.typesafe.akka" %% "akka-stream-typed" % AkkaVersionMaven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-bom_${scala.binary.version}</artifactId> <version>2.10.2</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-stream-typed_${scala.binary.version}</artifactId> </dependency> </dependencies>Gradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-bom_${versions.ScalaBinary}:2.10.2") implementation "com.typesafe.akka:akka-stream-typed_${versions.ScalaBinary}" } Signature ActorFlow.askWithContextActorFlow.askWithContext Description Use the Ask pattern to send a request-reply message to the target ref actor. The stream context is not sent, instead it is locally recombined to the actor’s reply. If any of the asks times out it will fail the stream with an AskTimeoutExceptionAskTimeoutException. The ask operator requires the actor ref, a makeMessage function to create the message sent to the actor from the incoming element, and the actor ref accepting the actor’s reply message a timeout. Reactive Streams semantics emits when the futures (in submission order) created by the ask pattern internally are completed backpressures when the number of futures reaches the configured parallelism and the downstream backpressures completes when upstream completes and all futures have been completed and all elements have been emitted fails when the passed-in actor terminates, or when any of the asks exceed a timeout cancels when downstream cancels'
