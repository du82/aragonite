title = "1. Introduction • Akka HTTP"
full_description = '1. Introduction Project Info: Akka Http Artifactcom.typesafe.akka akka-http 10.7.0 Snapshots are available JDK versionsEclipse Temurin JDK 11Eclipse Temurin JDK 17Eclipse Temurin JDK 21 Scala versions2.13.15, 3.3.4 JPMS module nameakka.http LicenseBUSL-1.1 Readiness levelSupported, support is available from Lightbend Since 10.0.0, 2016-11-26 Home pagehttps://akka.io API documentation API (Scaladoc) API (Javadoc) Forums Lightbend Discuss Release notesakka.io blog IssuesGithub issues Sourceshttps://github.com/akka/akka-http The Akka HTTP modules implement a full server- and client-side HTTP stack on top of akka-actor and akka-stream. It’s not a web-framework but rather a more general toolkit for providing and consuming HTTP-based services. While interaction with a browser is of course also in scope it is not the primary focus of Akka HTTP. Akka HTTP follows a rather open design and many times offers several different API levels for “doing the same thing”. You get to pick the API level of abstraction that is most suitable for your application. This means that, if you have trouble achieving something using a high-level API, there’s a good chance that you can get it done with a low-level API, which offers more flexibility but might require you to write more application code. Philosophy Akka HTTP has been driven with a clear focus on providing tools for building integration layers rather than application cores. As such it regards itself as a suite of libraries rather than a framework. A framework, as we’d like to think of the term, gives you a “frame”, in which you build your application. It comes with a lot of decisions already pre-made and provides a foundation including support structures that lets you get started and deliver results quickly. In a way a framework is like a skeleton onto which you put the “flesh” of your application in order to have it come alive. As such frameworks work best if you choose them before you start application development and try to stick to the framework’s “way of doing things” as you go along. For example, if you are building a browser-facing web application it makes sense to choose a web framework and build your application on top of it because the “core” of the application is the interaction of a browser with your code on the web-server. The framework makers have chosen one “proven” way of designing such applications and let you “fill in the blanks” of a more or less flexible “application-template”. Being able to rely on best-practice architecture like this can be a great asset for getting things done quickly. However, if your application is not primarily a web application because its core is not browser-interaction but some specialized maybe complex business service and you are merely trying to connect it to the world via a REST/HTTP interface a web-framework might not be what you need. In this case the application architecture should be dictated by what makes sense for the core not the interface layer. Also, you probably won’t benefit from the possibly existing browser-specific framework components like view templating, asset management, JavaScript- and CSS generation/manipulation/minification, localization support, AJAX support, etc. Akka HTTP was designed specifically as “not-a-framework”, not because we don’t like frameworks, but for use cases where a framework is not the right choice. Akka HTTP is made for building integration layers based on HTTP and as such tries to “stay on the sidelines”. Therefore you normally don’t build your application “on top of” Akka HTTP, but you build your application on top of whatever makes sense and use Akka HTTP merely for the HTTP integration needs. On the other hand, if you prefer to build your applications with the guidance of a framework, you should give Play Framework or Lagom a try, which both use Akka internally. If you come from Play and want to try Akka HTTP, we collected a side-by-side comparison to show how some Play routing features map to the Akka HTTP routing DSL. Using Akka HTTP Akka HTTP is provided as independent modules from Akka itself under its own release cycle. Akka HTTP is compatible with Akka >= 2.10.0 and future Akka 2.x versions that are released during the lifetime of Akka HTTP 10.4.x. The modules, however, do not depend on akka-actor or akka-stream, so the user is required to choose an Akka version to run against and add a manual dependency to akka-stream of the chosen version. The Akka dependencies are available from Akka’s library repository. To access them there, you need to configure the URL for this repository. sbtresolvers += "Akka library repository".at("https://repo.akka.io/maven") Gradlerepositories { mavenCentral() maven { url "https://repo.akka.io/maven" } } Maven<project> ... <repositories> <repository> <id>akka-repository</id> <name>Akka library repository</name> <url>https://repo.akka.io/maven</url> </repository> </repositories> </project> Additionally, add the dependencies as below.sbtval AkkaVersion = "2.10.0" val AkkaHttpVersion = "10.7.0" libraryDependencies ++= Seq( "com.typesafe.akka" %% "akka-actor-typed" % AkkaVersion, "com.typesafe.akka" %% "akka-stream" % AkkaVersion, "com.typesafe.akka" %% "akka-http" % AkkaHttpVersion )Gradledef versions = [ AkkaVersion: "2.10.0", ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-http-bom_${versions.ScalaBinary}:10.7.0") implementation "com.typesafe.akka:akka-actor-typed_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-stream_${versions.ScalaBinary}:${versions.AkkaVersion}" implementation "com.typesafe.akka:akka-http_${versions.ScalaBinary}" }Maven<properties> <akka.version>2.10.0</akka.version> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-bom_${scala.binary.version}</artifactId> <version>10.7.0</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-actor-typed_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-stream_${scala.binary.version}</artifactId> <version>${akka.version}</version> </dependency> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http_${scala.binary.version}</artifactId> </dependency> </dependencies> You may download a packaged version of this project from: Akka HTTP Quickstart for Scala Akka HTTP Quickstart for Java Routing DSL for HTTP servers The high-level, routing API of Akka HTTP provides a DSL to describe HTTP “routes” and how they should be handled. Each route is composed of one or more level of DirectivesDirectives that narrows down to handling one specific type of request. For example one route might start with matching the path of the request, only matching if it is “/hello”, then narrowing it down to only handle HTTP get requests and then complete those with a string literal, which will be sent back as an HTTP OK with the string as response body. The Route Route created using the Route DSL is then “bound” to a port to start serving HTTP requests: Scala copysource/* * Copyright (C) 2020-2024 Lightbend Inc. <https://www.lightbend.com> */ package docs.http.scaladsl import akka.actor.typed.ActorSystem import akka.actor.typed.scaladsl.Behaviors import akka.http.scaladsl.Http import akka.http.scaladsl.model._ import akka.http.scaladsl.server.Directives._ import akka.http.scaladsl.server.Route.seal import scala.io.StdIn object HttpServerRoutingMinimal { def main(args: Array[String]): Unit = { implicit val system = ActorSystem(Behaviors.empty, "my-system") // needed for the future flatMap/onComplete in the end implicit val executionContext = system.executionContext val route = path("hello") { get { complete(HttpEntity(ContentTypes.`text/html(UTF-8)`, "<h1>Say hello to akka-http</h1>")) } } val bindingFuture = Http().newServerAt("localhost", 8080).bind(route) println(s"Server now online. Please navigate to http://localhost:8080/hello\nPress RETURN to stop...") StdIn.readLine() // let it run until user presses return bindingFuture .flatMap(_.unbind()) // trigger unbinding from the port .onComplete(_ => system.terminate()) // and shutdown when done } } Java copysourceimport akka.actor.typed.ActorSystem; import akka.actor.typed.javadsl.Behaviors; import akka.http.javadsl.Http; import akka.http.javadsl.ServerBinding; import akka.http.javadsl.server.AllDirectives; import akka.http.javadsl.server.Route; import java.util.concurrent.CompletionStage; public class HttpServerMinimalExampleTest extends AllDirectives { public static void main(String[] args) throws Exception { // boot up server using the route as defined below ActorSystem<Void> system = ActorSystem.create(Behaviors.empty(), "routes"); final Http http = Http.get(system); //In order to access all directives we need an instance where the routes are define. HttpServerMinimalExampleTest app = new HttpServerMinimalExampleTest(); final CompletionStage<ServerBinding> binding = http.newServerAt("localhost", 8080) .bind(app.createRoute()); System.out.println("Server online at http://localhost:8080/\nPress RETURN to stop..."); System.in.read(); // let it run until user presses return binding .thenCompose(ServerBinding::unbind) // trigger unbinding from the port .thenAccept(unbound -> system.terminate()); // and shutdown when done } private Route createRoute() { return concat( path("hello", () -> get(() -> complete("<h1>Say hello to akka-http</h1>")))); } } When you run this server, you can either open the page in a browser, at the following url: http://localhost:8080/hello, or call it in your terminal, via curl http://localhost:8080/hello. Marshalling Transforming request and response bodies between over-the-wire formats and objects to be used in your application is done separately from the route declarations, in marshallers, which are pulled in implicitly using the “magnet” pattern. This means that you can complete a request with any kind of object as long as there is an implicit marshaller available in scope. Default marshallers are provided for simple objects like String or ByteString, and you can define your own for example for JSON. An additional module provides JSON serialization using the spray-json library (see JSON Support for details):sbtval AkkaHttpVersion = "10.7.0" libraryDependencies += "com.typesafe.akka" %% "akka-http-spray-json" % AkkaHttpVersionGradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-http-bom_${versions.ScalaBinary}:10.7.0") implementation "com.typesafe.akka:akka-http-spray-json_${versions.ScalaBinary}" }Maven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-bom_${scala.binary.version}</artifactId> <version>10.7.0</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-spray-json_${scala.binary.version}</artifactId> </dependency> </dependencies> JSON support is possible in akka-http by the use of Jackson, an external artifact (see JSON Support for details):sbtval AkkaHttpVersion = "10.7.0" libraryDependencies += "com.typesafe.akka" %% "akka-http-jackson" % AkkaHttpVersionGradledef versions = [ ScalaBinary: "2.13" ] dependencies { implementation platform("com.typesafe.akka:akka-http-bom_${versions.ScalaBinary}:10.7.0") implementation "com.typesafe.akka:akka-http-jackson_${versions.ScalaBinary}" }Maven<properties> <scala.binary.version>2.13</scala.binary.version> </properties> <dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-bom_${scala.binary.version}</artifactId> <version>10.7.0</version> <type>pom</type> <scope>import</scope> </dependency> </dependencies> </dependencyManagement> <dependencies> <dependency> <groupId>com.typesafe.akka</groupId> <artifactId>akka-http-jackson_${scala.binary.version}</artifactId> </dependency> </dependencies> A common use case is to reply to a request using a model object having the marshaller transform it into JSON. In this case shown by two separate routes. The first route queries an asynchronous database and marshals the Future[Option[Item]]CompletionStage<Optional<Item>> result into a JSON response. The second unmarshals an Order from the incoming request, saves it to the database and replies with an OK when done. Scala copysource/* * Copyright (C) 2020-2024 Lightbend Inc. <https://www.lightbend.com> */ package docs.http.scaladsl import akka.actor.typed.ActorSystem import akka.actor.typed.scaladsl.Behaviors import akka.http.scaladsl.Http import akka.Done import akka.http.scaladsl.server.Route import akka.http.scaladsl.server.Directives._ import akka.http.scaladsl.model.StatusCodes // for JSON serialization/deserialization following dependency is required: // "com.typesafe.akka" %% "akka-http-spray-json" % "10.1.7" import akka.http.scaladsl.marshallers.sprayjson.SprayJsonSupport._ import spray.json.DefaultJsonProtocol._ import spray.json.RootJsonFormat import scala.io.StdIn import scala.concurrent.ExecutionContext import scala.concurrent.Future object SprayJsonExample { // needed to run the route implicit val system: ActorSystem[_] = ActorSystem(Behaviors.empty, "SprayExample") // needed for the future map/flatmap in the end and future in fetchItem and saveOrder implicit val executionContext: ExecutionContext = system.executionContext var orders: List[Item] = Nil // domain model final case class Item(name: String, id: Long) final case class Order(items: List[Item]) // formats for unmarshalling and marshalling implicit val itemFormat: RootJsonFormat[Item] = jsonFormat2(Item.apply) implicit val orderFormat: RootJsonFormat[Order] = jsonFormat1(Order.apply) // (fake) async database query api def fetchItem(itemId: Long): Future[Option[Item]] = Future { orders.find(o => o.id == itemId) } def saveOrder(order: Order): Future[Done] = { orders = order.items ::: orders Future { Done } } def main(args: Array[String]): Unit = { val route: Route = concat( get { pathPrefix("item" / LongNumber) { id => // there might be no item for a given id val maybeItem: Future[Option[Item]] = fetchItem(id) onSuccess(maybeItem) { case Some(item) => complete(item) case None => complete(StatusCodes.NotFound) } } }, post { path("create-order") { entity(as[Order]) { order => val saved: Future[Done] = saveOrder(order) onSuccess(saved) { _ => // we are not interested in the result value `Done` but only in the fact that it was successful complete("order created") } } } } ) val bindingFuture = Http().newServerAt("localhost", 8080).bind(route)'
