full_description = "Other Akka modules This page describes modules that compliment libraries from the Akka core. See this overview instead for a guide on the core modules. Akka HTTP A full server- and client-side HTTP stack on top of akka-actor and akka-stream. Akka gRPC Akka gRPC provides support for building streaming gRPC servers and clients on top of Akka Streams. Alpakka Alpakka is a Reactive Enterprise Integration library for Java and Scala, based on Reactive Streams and Akka. Alpakka Kafka Connector The Alpakka Kafka Connector connects Apache Kafka with Akka Streams. Akka Projections Akka Projections let you process a stream of events or records from a source to a projected model or external system. Cassandra Plugin for Akka Persistence An Akka Persistence journal and snapshot store backed by Apache Cassandra. JDBC Plugin for Akka Persistence An Akka Persistence journal and snapshot store for use with JDBC-compatible databases. This implementation relies on Slick. R2DBC Plugin for Akka Persistence An Akka Persistence journal and snapshot store for use with R2DBC-compatible databases. This implementation relies on R2DBC. Akka Management Akka Management provides a central HTTP endpoint for Akka management extensions. Akka Cluster Bootstrap helps bootstrapping an Akka cluster using Akka Discovery. Akka Management Kubernetes Rolling Updates for smooth rolling updates. Akka Management Cluster HTTP provides HTTP endpoints for introspecting and managing Akka clusters. Akka Discovery for Kubernetes, Consul, Marathon, and AWS Kubernetes Lease Akka Diagnostics Akka Thread Starvation Detector Akka Configuration Checker Akka Insights Intelligent monitoring and observability purpose-built for Akka: Lightbend Telemetry Community Projects Akka has a vibrant and passionate user community, the members of which have created many independent projects using Akka as well as extensions to it. See Community Projects."
