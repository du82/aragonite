["https://doc.akka.io/concepts/index.html"]
title = "Understanding :: Akka Documentation"
full_description = "Understanding This content here introduces key concepts to be aware of when developing Akka applications and services. The Architectural Model explains the principles by which Akka applications are structured and introduces the Components used to building Services. Akka manages the operational aspects of your application. To learn about how Akka Services run in distributed infrastructure and may span multiple Regions, see Deployment Model. Once deployed, Akka’s Telemetry and Monitoring provides operational insights into your deployment. When you are familiar with the main aspects for Akka applications, continue with Development Process to understand the steps involved to implement a Service. A detailed explanation to how Entities persist their state, is presented in State Model should you wish to learn more. Topics Architecture model Deployment model Development process Declarative effects Entity state models Multi-region operations Saga patterns Developer best practices Akka Architecture model"
