title = "Useful Programming Documents and Books"
full_description = "Useful Programming Documents and Books Programming Methodologies and Philosophies Bad Engineering Properties of Object-Oriented Languages by Luca Cardelli. The Rise of “Worse is Better” by Richard P. Gabriel. The Unix Programming Environment - The Bible of Unix programming style and philosophy by Rob Pike and Brian Kernighan. The Practice of Programming by Brian W. Kernighan and Rob Pike - More programming advice by the Bell Labs masters. Software Tools by Brian W. Kernighan and P. J. Plauger - Another masterpiece by Kernighan, the programming language(s) used are not particularly important, it is all about the philosophy and how the different tools work together. Quotes about programming. Programming Languages Alef Alef was a concurrent programming language designed for Plan 9 by Phil Winterbottom. Alef Language Reference Manual by Phil Winterbottom. Alef User’s Guide by Bob Flandrena. AWK A wonderful language for manipulating text. The Amazing Awk Assembler by Henry Spencer. The AWK Programming Language by Alfred V. Aho, Brian W. Kernighan and Peter J. Weinberger - An excellent book not only about AWK, but also about how to build a clean and elegant special-purpose language that fits well with the ‘tool philosophy’. C The C legendary programming language by Dennis M. Ritchie. A New C Compiler by Ken Thompson. Notes on Programming in C by Rob Pike. The Ten Commandments for C Programmers (Annotated Edition) by Henry Spencer. #ifdef Considered Harmful, or Portability Experience With C News by Henry Spencer and Geoff Collyer. C Programming Language by Brian W. Kernighan and Dennis M. Ritchie - C is the universal portable assembler that every programmer should know well, and this book is indispensable for anyone that has to read, write or dream C code. Limbo Limbo is a concurrent programming language developed by Sean Dorward, Phil Winterbottom, and Rob Pike at Bell Labs for the Inferno operating system. A Descent into Limbo by Brian Kernighan. The 