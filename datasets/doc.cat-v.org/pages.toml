["http://doc.cat-v.org/bell_labs/sam_lang_tutorial"]
title = "A Tutorial for the Sam Command Language"
full_description = "A Tutorial for the Sam Command Language By Rob Pike. “sam is an interactive text editor with a command language that makes heavy use of regular expressions. Although the language is syntactically similar to ed(1), the details are interestingly different. This tutorial introduces the command language, but does not discuss the screen and mouse interface. With apologies to those unfamiliar with the Ninth Edition Blit software, it is assumed that the similarity of sam to mux(9) at this level makes sam’s mouse language easy to learn.” “The sam command language applies identically to two environments: when running sam on an ordinary terminal (via sam -d), and in the command window of a downloaded sam, that is, one using the bitmap display and mouse.” sam_tut.pdf. See Also Sam editor resources page. sam(1) - The sam Plan 9 manual page. The Text Editor sam - The main paper describing sam by Rob Pike. Acme - A later text editor and programming environment by Rob Pike that uses the same command language as sam."
