["https://doc.cat-v.org/bell_labs/transparent_wsys"]
title = "Window Systems Should Be Transparent"
full_description = "Window Systems Should Be Transparent By Rob Pike (AT&T Bell Laboratories, Murray Hill) ABSTRACT “Commercial UNIX window systems are unsatisfactory. Because they are cumber- some and complicated, they are unsuitable companions for an operating system that is appreciated for its technical elegance. Their clumsy user interfaces clutter the view of the operating system. A good interface should clarify the view, not obscure it. Mux is one window system that is popular and therefore worth studying as an example of good design. (It is not commercially important because it runs only on obsolete hardware.) This paper uses mux as a case study to illustrate some principles that can help keep a user interface simple, comfortable, and unobtrusive. When designing their products, the pur- veyors of commercial window systems should keep these principles in mind.” transparent wsys.pdf See also Rio: Design of a Concurrent Window System by Rob Pike - The window system for Plan 9 A Concurrent Window System by Rob Pike."
