full_description = "Inferno Fourth Edition Papers and Documentation Inferno 4th Edition Manual Volume .1: manual pages. The Inferno Papers form Vol.2 of the Inferno Programmer’s Manual There is some overlap with the Plan 9 papers, in those cases we link to the Plan 9 version of the paper if there are no differences. Getting Started The Inferno Operating System Sean Dorward, Rob Pike, David Leo Presotto, Dennis M. Ritchie, Howard Trickey, and Phil Winterbottom An overview of the system. The Styx Architecture for Distributed Systems Rob Pike, Dennis M. Ritchie A discussion of the Styx protocol. Programming A Descent into Limbo Brian Kernighan An introduction to the Limbo programming language. The Limbo Programming Language Dennis M. Ritchie The Limbo reference manual; the definitive Limbo document. Program Development under Inferno Roger Peppe An introduction to Limbo development using Acme. Real Inferno Eric Grosse Floating point issues. User Interfaces Acme: A User Interface for Programmers Rob Pike A system with a more radical approach to programming and editing. The Inferno Shell Roger Peppe A view of the Inferno shell Implementation Dis Virtual Machine Specification An informal definition of the Dis Virtual Machine. The Several Inferno Ports Charles Forsyth A summary of the state of the ports and the compilers included in this release. Acid Reference Manual Phil Winterbottom The reference manual for the language and its libraries. Native Kernel Debugging with Acid Tad Hunt A tutorial introduction to native kernel debugging with Acid. Acid: A Debugger Built From A Language Phil Winterbottom An overview paper about the Acid debugger. Maintaining Files on Plan 9 with Mk Andrew G. Hume, Bob Flandrena An introduction to the replacement for Make. A Manual for the Assembler Rob Pike Notes on the current set of Inferno assemblers. Plan 9 C Compilers Ken Thompson The design and some internals of the compiler suite. Miscellaneous The Design of the Inferno Virtual Machine P