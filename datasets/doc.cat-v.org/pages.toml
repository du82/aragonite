title = "Systems Software Research is Irrelevant (aka utah2000 or utah2k)"
full_description = "Systems Software Research is Irrelevant (aka utah2000 or utah2k) By Rob Pike (Lucent Bell Laboratories, Murray Hill) “This talk is a polemic that distills the pessimistic side of my feelings about systems research these days. I won’t talk much about the optimistic side, since lots of others can do that for me; everyone’s excited about the computer industry. I may therefore present a picture somewhat darker than reality. However, I think the situation is genuinely bad and requires action.” utah2000.pdf utah2000.ps utah2000.html See also Slashdot thread from the year 2000. UNIX Style, or cat -v Considered Harmful by Rob Pike."
