["http://doc.cat-v.org/inferno"]
title = "The Inferno Operating System/Virtual Machine"
full_description = "The Inferno Operating System/Virtual Machine Inferno is a operating system created by the same team at Bell Labs that created Unix and Plan 9. It uses the same 9P distributed file system protocol (in Inferno lingo known as ‘Styx’), but it can run as a virtual machine on top of other operating systems as well as directly on hardware (specially well suited for embedded environments thanks to not requiring a MMU). It is also written in a new language Limbo that uses the CSP model for concurrent programming. Papers from the 4th Edition of Inferno. Manual pages. Concurrent Garbage Collection. Using Inferno to Execute Java TM on Small Devices. The PathStar Access Server: Facilitating Carrier-Scale Packet Telephony - A project by Lucent built on Inferno. Historical documents mostly of historical interest (like the original Lucent Inferno website, ancient mailing list archives, etc). Translations of some documentation to other languages (Japanese) Books Inferno Programming with Limbo by Phillip Stanley-Marbell. Principles of Operating Systems: Design and Applications by Brian Stuart, includes a comprehensive study and analysis of the Inferno kernel and environment implementations. The Inferno Programming Book: An Introduction to Programming for the Inferno Distributed System by Martin Atkins, Rob Pike, Howard Trickey. (unpublished)"
