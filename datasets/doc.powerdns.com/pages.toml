["https://doc.powerdns.com/recursor"]
title = "Introduction — PowerDNS Recursor  documentation"
full_description = "The PowerDNS Recursor is a high-performance DNS recursor with built-in scripting capabilities. It is known to power the resolving needs of over 150 million internet connections. The documentation is only for the 4.1 and higher series, users of older versions are urged to read End of life statements and upgrade! PowerDNS is an open source program so you may get help from the PowerDNS users’ community or from its authors. You may also help others (please do). The Open-Xchange/PowerDNS company can provide help or support you in private as well. Please contact PowerDNS. If you desire privacy, please consider entering a support relationship with us, in which case we invite you to contact PowerDNS. Start out with stating what you think should be happening. Quite often, wrong expectations are the actual problem. Furthermore, your operating system, which version of PowerDNS you use and where you got it from (RPM, .DEB, tar.bz2). If you compiled it yourself, what were the ./configure parameters. As much as we’d like to think we are perfect, bugs happen. If you have found a bug, please file a bug report on GitHub bug report. Please fill in the template and we’ll try our best to help you. Redistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met: THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS “AS IS” AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT OWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR