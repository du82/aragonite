["https://doc.powerdns.com/authoritative"]
title = "PowerDNS Authoritative Nameserver — PowerDNS Authoritative Server  documentation"
full_description = "The PowerDNS Authoritative Server is a versatile nameserver which supports a large number of backends. These backends can either be plain zone files or be more dynamic in nature. PowerDNS has the concepts of ‘backends’. A backend is a datastore that the server will consult that contains DNS records (and some metadata). The backends range from database backends (MySQL, PostgreSQL) and BIND zone files to co-processes and JSON API’s. Multiple backends can be enabled in the configuration by using the launch option. Each backend can be configured separately. PowerDNS is an open source program so you may get help from the PowerDNS users’ community or from its authors. You may also help others (please do). The Open-Xchange/PowerDNS company can provide help or support you in private as well. Please contact PowerDNS. If you desire privacy, please consider entering a support relationship with us, in which case we invite you to contact PowerDNS. Start out with stating what you think should be happening. Quite often, wrong expectations are the actual problem. Furthermore, your operating system, which version of PowerDNS you use and where you got it from (RPM, .DEB, tar.bz2). If you compiled it yourself, what were the ./configure parameters. As much as we’d like to think we are perfect, bugs happen. If you have found a bug, please file a bug report on GitHub. Please fill in the template and we’ll try our best to help you."
