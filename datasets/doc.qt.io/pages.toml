["https://doc.qt.io/tools.html"]
title = "Qt Documentation | Tools"
description = """
Tools

Qt Tools run on all supported development platforms and facilitate the design,
development, testing, and deployment of applications.





    Qt Creator  A cross-platform, complete integrated development environment (IDE) for application development targeting desktop, embedded, and mobile platforms.  
  
    Qt Design Studio  A UI design and development environment for creating animated UIs.  
  
    Qt Quick Studio Components  Preset components for creating UIs that inherit Qt Quick Shapes QML Types.  
  
    Qt 3D Studio  A compositing tool for the creation of interactive 3D presentations, UIs and applications.  
  
    Extending Qt Creator  A manual documenting the various ways Qt Creator can be extended in functionality.  
  
    Qt Designer  A tool for designing and building graphical user interfaces with Qt Widgets.  
  
    Qt Linguist  A tool for translating Qt C++ and Qt Quick applications into local languages.  
  
    Qt Assistant  A tool for viewing documentation in Qt help file format.  
  
    Qt Extensions for VS Code  Develop Qt and Qt Quick applications for the desktop and WebAssembly with VS Code.  
  
    Qt VS Tools  Integration of Qt development tools into Microsoft Visual Studio.  
  
    QML Live  A local and remote Qt Quick live reloading system.  
  
    Qt Installer Framework  A set of tools and utilities to create installers for desktop platforms.  
  
    Build tools: CMake  Documentation for using the CMake build tool with Qt.  
  
    Build tools: qmake  Documentation for the qmake build tool.  
  
    Build tools: Qbs  Documentation for the Qbs build tool.  
  
    Qt Tools for Android Studio  Provides support for building and deploying QML projects in Android Studio.  
  
    Qt Gradle Plugin  Allows building Qt projects as an Android Library using the Gradle build system.  
  
    QDoc Manual  Users' manual for the documentation build tool.  
  
    Qt Insight  An analytics solution that provides real user insights on the usage of Qt applications.  
  
    Qt License Server  Runtime license management and usage report collection for Qt products.  
  



Quality Assurance Tools

GUI Test automation and code coverage tools.





    Squish  A professional automated GUI testing framework. Squish makes it possible to test GUI applications based on various toolkits, including Qt.  
  
    Coco  A code coverage tool chain for C/C++, C# and QML.  
  
    Test Center  A result server that provides a central place to store all test results.  
  



