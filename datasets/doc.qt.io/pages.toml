title = "Test Center Manual"
description = """
Test Center is a test management system, a central place where you can manage your automated and manual tests, and where you can create test plans and schedule them for execution. It also acts as a central result server where you can browse and analyze your test results. Additionally Test Center also provides integrations with 3rd party systems to achieve traceability for your test results.

InstallationHow to upload resultsHow to group results
To get started with Test Center, unpack the Test Center package, specify a SMTP server to use for sending emails, start Test Center server, and add the first user.Once Test Center is set up, you can upload test results in Squish XML or HTML or Coco CSMES/CSEXE format, either manually or directly from squishide, Jenkins, or TeamCity.Test Center groups test results using Projects, Batches, Reports, and Labels."""
