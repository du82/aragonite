description = """
Class Lists

All C++ ClassesIf you know the name of the class you want, find it here.
All Classes by ModuleA list of all C++ API components in Qt
All ModulesA list of all modules in Qt 6.
All NamespacesA Qt namespace contains enum types, functions, and sometimes classes.
All QML ModulesA list of all QML modules in Qt.
All QML TypesA list of QML types in this Qt release.
Annotated Class ListIf you don't know the name of the class you want, but you know what the class should do, you might try looking here.
Groups Of Related ClassesIf you know what kind of class you want (GUI, painting, I.O, etc), look here.
Inheritance HierarchyThe C++ class inheritance hierarchy for all classes in the Qt API.
Obsolete ClassesClasses and members marked obsolete that should not be used in new code.
Obsolete QML TypesA list of obsolete QML types that should not be used in new code.

Function Lists

<QWaylandQuickExtension>File includes macros for creating Qt Quick types that correspond to subclasses of QWaylandCompositorExtension and QWaylandObject
<QtAlgorithms>Includes the generic, template-based algorithms
<QtCompilerDetection>File includes various compiler-specific macros
<QtEndian>Functions to convert between little and big endian representations of numbers
<QtGlobal>File includes an assortment of other headers
