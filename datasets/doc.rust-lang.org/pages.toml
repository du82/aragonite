title = "Introduction - The Cargo Book"
full_description = "The Cargo Book Cargo is the Rust package manager. Cargo downloads your Rust package’s dependencies, compiles your packages, makes distributable packages, and uploads them to crates.io, the Rust community’s package registry. You can contribute to this book on GitHub. Sections Getting Started To get started with Cargo, install Cargo (and Rust) and set up your first crate. Cargo Guide The guide will give you all you need to know about how to use Cargo to develop Rust packages. Cargo Reference The reference covers the details of various areas of Cargo. Cargo Commands The commands will let you interact with Cargo using its command-line interface. Frequently Asked Questions Appendices: Glossary Git Authentication Other Documentation: Changelog — Detailed notes about changes in Cargo in each release. Rust documentation website — Links to official Rust documentation and tools."
