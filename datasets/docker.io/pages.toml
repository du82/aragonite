full_description = "Docker Support How can we help? Get the help you need to build, share, and run your Docker applications with confidence. Docker Documentation Docker Training Open a Support Ticket Contact Support Need help with subscriptions, billing, troubleshooting, or running Docker? We’re here to help. Get in touch with Docker support. Contact us Find your support level Find out what support offerings are included with your subscription plan. Docker Business Docker Team Docker Pro Docker Personal Docker Personal You can find help in our documentation, join discussions on our forums, or connect with others on our Slack channel. Contact Support Resources Docker Documentation Docker Community Forums Docker Community Slack Docker Pro Support provided within 5 business days Contact Support Desktop upgrade issues Desktop installation issues Enabling virtualization in BIOS Enabling Windows features Installation crashes Failure to launch Docker Desktop on first run Usage issues Configuration issues Crash closing software Resources Docker Documentation Docker Community Forums Docker Community Slack Docker Pro subscribers Docker only offers support for the latest version of Docker Desktop. If you are running an older version, Docker may ask you to update before investigating your support request. Docker Team Support provided within 2 business days Contact Support Desktop upgrade issues Desktop installation issues Enabling virtualization in BIOS Enabling Windows features Installation crashes Failure to launch Docker Desktop on first run Usage issues Configuration issues Crash closing software Docker Desktop not behaving as expected Resources Docker Documentation Docker Community Forums Docker Community Slack Docker Team subscribers Docker only offers support for the latest version of Docker Desktop. If you are running an older version, Docker may ask you to update before investigating your support request. Docker Business Support provided within 1 business days Contact Support Desktop upgrade issues Desktop installation issues Enabling virtualization in BIOS Enabling Windows features Installation crashes Failure to launch Docker Desktop on first run Usage issues Configuration issues Crash closing software Docker Desktop not behaving as expected Resources Docker Trainings Docker Documentation Docker Community Forums Docker Community Slack Docker Business subscribers Support for Docker Desktop issues on versions up to 6 months older than the latest version, with fixes only on the latest version. Enterprise-level support experience 24x5 business-level support Priority case routing & proactive monitoring Onboarding with the Implementation team Training customized to your team's needs Increased Service Level Agreements Admin insights into the support experience Docker Communities Ask questions, share knowledge, and solve problems Community resources and forums for Docker enthusiasts discuss technical solutions, exchange ideas, and stay connected. Community Forums Community Slack Support FAQ Open All Support tickets We normally keep tickets open until full resolution; however, we do end up in situations where a request/bug has to be escalated to our engineering teams over extended periods. In this scenario, we will close out the support ticket as ‘Solved’ even if the underlying issue is not resolved. If your team responds to any ticket we’ve marked as ‘Solved’, the ticket will reopen with your latest comment. Please include logs, steps taken, and any relevant information (e.g., environment, architecture, etc.). Support documentation Docker Documentation provides additional information about what is and is not supported. Billing and payments The Docker Billing documentation includes frequently asked questions and solutions. If you are unable to find a solution here, contact Docker Support by opening a support ticket. Restoring deleted data Docker will consider restoration requests only when the request is for a project or group that is part of a paid Team or Business subscription, and one of the following is true: The data was deleted due to a Docker bug/issue The organization’s contract includes a specific provision Log/IP access requests Due to legal/privacy laws and for the security of our other customers, Docker does not provide raw logs, IP addresses, or other information requests related to our customers. Docker pricing Refer to the Docker Pricing page to learn more about subscription features and support. Open All"
