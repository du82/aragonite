["https://docker.io/careers/hiring-onboarding"]
title = "Hiring and Onboarding | Docker"
description = "We understand that contemplating a career change and interviewing are stressful. Our goal is to make our interview process and your experience with it the"
full_description = "Hiring and Onboarding We understand that contemplating a career change and interviewing are stressful. Our goal is to make our interview process and your experience with it the best it can be. We value and respect the time that you take to talk to us during your interviews. Working at Docker Hiring & Onboarding Docker Engineering Women of Docker Current Openings Docker Interview FAQs How do I apply for a role? After browsing our Current Openings to find the right role for you, click on “Apply for this Position”. You’ll then be walked through the application process. How long does it take for me to hear back after applying? If we are moving forward, we will contact you as soon as we review your application. That may be as soon as a day or two, but possibly longer due to the volume of applications we receive. If we feel you could be a good fit for the role, one of our recruiters will email you to set up an initial meeting. If we decide not to move forward with your application, we strive to email you that we are not moving forward, either soon after you apply or when we fill the role. How long will the interview process take? Our goal is to conduct all of the necessary interviews within 2 to 3 weeks. This time frame is subject to your availability and the interviewer’s availability. After your final interview, we will keep you up to date with where you are in the process and will get you a final decision as soon as we can. How will I know when my interview is scheduled? If you are moving forward after talking to our recruiter, one of our recruiting coordinators will take over scheduling. They will let you know who you will be interviewing with and the interview length, and send you a booking link so you can choose your preferred time. In some cases, the coordinator may need to work with you to find an available time instead of using a booking link. After choosing a time, you will receive an invitation email that includes the day, time, interviewer, and Zoom link to use. What tool do you use to conduct your interviews? The first interview with your recruiter will either be a phone call or a Zoom interview. After that, all of our interviews are done on Zoom. When you are sent an interview invitation, there will be a Zoom link for you to use. If I make a mistake during a screen share, did I fail the interview? We do understand that some people are nervous about coding while being watched, but please treat it as if you were coding together with a colleague. We don’t ask trick questions, and you’re welcome to use Google or whatever other online resources you would normally use in your daily work, as well as discuss what you’re doing. We want you to do your best in as natural an environment as is possible in an interview, so that we can see how you think and how you code in everyday work. Can I ask questions during the interview? Of course! We believe that interviewing should be a two-way process. We're looking for the right colleague, but you're also looking for the right job for you. So please ask whatever you need to in order to help you to make the decision of whether Docker is the right place for you. Will you let me know how the process went even if you decide not to extend an offer? We'll call or email you to let you know the final decision of the team even if we decide that this role is not a match for us or you. Keep in mind that we are constantly adding new positions so continue to check our Current Openings for a position that will be the perfect fit for you. Will I need to screen share during the interview? For engineering interviews that involve programming, we do want to see you write code. You can do that on your own computer using screen sharing, so that you can be comfortable in your own usual development environment. Other than having a development environment ready, no specific preparation is required. “The People team is here to guide and support you and your journey at Docker. Whether you’re a new cadet or a seasoned Dockhand, we’re here to answer any and all questions you may have.” Meghan Joyce, People Partner “Our hiring process moves fast without compromising the integrity of the interviews. By the end of your interviews you’ll walk away with a strong sense of our team and culture. Our onboarding team will then spoil you with swag!” Carmen Martinho, Manager, Recruiting Onboarding with Docker If all goes well and you accept an offer from us, we can’t wait to get you up and running with our team. Once we receive your written acceptance, we’ll send out your information about onboarding. We know that starting a new job can be overwhelming and we’re here to help you every step of the way. Before You Start You will receive a welcome email from our Recruiting Operations team as well as information and paperwork from BambooHR. You submit the required paperwork. We know this can get confusing so don’t hesitate to reach out to Recruiting Operations if you have any questions. The contact information will be in the welcome email. You will request your equipment — you can choose a MacBook or PC for your work use. We’ll send you some fun swag! Within two weeks of your start date, you can start to set up your home office using the Home Office Guidelines included in your onboarding paperwork. Remember to keep all of your receipts so you can submit reimbursements when you start! Our IT department will send you laptop tracking information as well as email and account credentials. We’ll send you an email with your first-day schedule so you know what to expect. Your First Day You’ll watch IT onboarding videos to guide you through setting up your laptop and accounts. If you have any questions, you can reach out to our IT Team via email or Slack for assistance. You’ll meet with your manager and your onboarding buddy. You’ll attend a Docker Onboarding Presentation to give you a company overview, learn about how we work, important processes, and more! Beyond Your First Day You’ll have a Whalecome meeting with our CEO and other new hires. You’ll meet more team members. We don’t want to overwhelm you on your first day so these introductions may be spread out over a few days. Your manager will set up a recurring 1:1 meeting for the two of you. You’ll join team meetings and company-wide meetings. You will become an integral part of the Docker team! Ready to join our team? Current openings"
year_published = 2022
year_updated = 2023
