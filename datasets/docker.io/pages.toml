["https://docker.io/captains/denis-cruz-rodrigues"]
title = "Denis Cruz Rodrigues | Docker"
description = """
Denis holds a postgraduate degree from the Institute of Mathematics and Statistics at the University of São Paulo.

He is a computer engineering enthusiast and holds memberships with The Linux Foundation, The New York Academy of Sciences, and the Association for Computing Machinery.

Known for thriving in chaotic environments, he has dedicated his professional career to mission-critical systems, working extensively in financial institutions.

He is drawn to challenging fields such as quantum computing, algorithms, complex systems, and mathematics.
His driving force is achieving more and better results with fewer resources.

As an Open Source evangelist, he actively participates in tech events and inspires developers to both use and contribute to disruptive solutions.

Denis goes above and beyond to improve developers' lives through research, process optimization, and training. He influences the roadmaps of major tech companies including Red Hat, AWS, Google, Microsoft, GitHub, Redis, and others.

When he's not immersed in technology, you'll find him motorcycle riding as therapy or enjoying tech meetups with a craft beer in hand."""
full_description = "Denis holds a postgraduate degree from the Institute of Mathematics and Statistics at the University of São Paulo. He is a computer engineering enthusiast and holds memberships with The Linux Foundation, The New York Academy of Sciences, and the Association for Computing Machinery. Known for thriving in chaotic environments, he has dedicated his professional career to mission-critical systems, working extensively in financial institutions. He is drawn to challenging fields such as quantum computing, algorithms, complex systems, and mathematics. His driving force is achieving more and better results with fewer resources. As an Open Source evangelist, he actively participates in tech events and inspires developers to both use and contribute to disruptive solutions. Denis goes above and beyond to improve developers' lives through research, process optimization, and training. He influences the roadmaps of major tech companies including Red Hat, AWS, Google, Microsoft, GitHub, Redis, and others. When he's not immersed in technology, you'll find him motorcycle riding as therapy or enjoying tech meetups with a craft beer in hand."
