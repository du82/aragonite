["https://docker.io/captains/alex-iankoulski"]
title = "Alex Iankoulski | Docker Captain"
description = "Alex Iankoulski is a DockerCon alumni. He was inspired when he attended DockerCon for the first time in San Francisco in 2015 and since then has been a Docker evangelist among his colleagues and in the community. Alex has attended DockerCon every year, initially as a spectator, then as a speaker, and now as a Docker Captain. He has been building software using Docker and helping accelerate the pace of innovation while applying container technologies to engineering, data science and AI problems. During the past 10 years he has worked on simplifying complex technologies, combating climate change, democratizing AI and ML, making travel safer, healthcare better, and energy smarter. He is currently a Principal Solutions Architect at Amazon Web Services where he helps customers unlock the value of scalable cloud computing focused on generative AI and other workloads using containers. He believes that good tools get out of the way, empower users to go fast and enable them to focus on what they do best. What he likes the most about Docker is that the answer is always “yes!” Captain"
