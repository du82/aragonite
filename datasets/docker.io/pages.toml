["https://docker.io/resources/keyfactor"]
title = "Case Study: Keyfactor and Docker | Docker"
description = "Keyfactor is a leading cybersecurity company with a global footprint that provides robust digital identity and signing solutions."
full_description = "Industry: Cybersecurity Global presence: Serves over 1,500 customers in 70 countries, including major U.S. commercial banks and telecom companies Industry leader: Recognized with multiple industry awards for contributions to cybersecurity, workplace culture, and technological innovation Keyfactor is a leading cybersecurity company with a global footprint that provides robust digital identity and signing solutions. With a diverse customer base ranging from small start-ups to government agencies and multinational corporations, Keyfactor’s products are essential for organizations who want to secure digital transactions and communications for a robust open source community of users. The innovative security company provides solutions to over 1,000 customers across 70 countries, including four of the top ten U.S. Commercial banks and three of the top U.S. telecom companies. Since the early 2000s, Keyfactor has been committed to open source principles integral to its identity and mission. Embracing the collaborative ethos of openness and transparency, teams recognized the transformative potential of community-driven collaboration and innovation, particularly in cybersecurity software. For developers and engineers that need Public Key Infrastructure (PKI), certificates and digital signing, self-signed certificates and tools like OpenSSL might suffice for basic needs. Keyfactor offers essential products like EJBCA PKI and SignServer as open-source community editions, which are easy to start with for testing and piloting. Additionally, Keyfactor provides a seamless transition to production with its Enterprise editions, which includes SLA and secure scaling capabilities necessary for a compliant production environment. EJBCA is a versatile and comprehensive enterprise PKI and certificate management solution that underpins digital security across various sectors. SignServer was initially developed to support electronic or biometric passports and has since broadened its utility to encompass code and container signing, document/PDF signing, and timestamping. Since their respective developments in 2001 and 2007, both products have significantly evolved."
