full_description = "Docker Subscription Service Agreement Last updated December 10, 2024 This Docker Subscription Service Agreement (“Agreement”), by and between the Customer identified on the applicable Order Form and Docker, Inc. (“Docker”), shall govern Customer’s initial purchase on the Effective Date (set forth on Customer’s initial Order Form) as well as any future purchases made by Customer which reference this Agreement. The parties hereby agree as follows: 1. Definitions. Capitalized terms shall have the meanings defined herein. “Account Owner” means an individual named User of the Service who has been authorized by the Customer to manage the Subscription. “Add-on Services” means those additional software or services that may be offered in the future as additional software or services at such prices as may be noted by Docker at that time. “AI Features” shall mean features of the Service enabled by artificial intelligence that are designed to assist Users with analytics, automation, prediction, decision-making or other tasks. “Customer” or “you” shall mean the entity you represent or, if that does not apply, to you individually. “Customer Data” means all information, data, and other content, in any form or medium, that is submitted, posted, or otherwise transmitted by or on behalf of Customer in the course of using the Service. For avoidance of doubt, Customer Data does not include data and information related to Customer’s use of the Service that is used by Docker in an aggregate and/or anonymized manner, including to compile statistical and performance information related to the Service, or any other information reflecting the access and use of the Service by or on behalf of Customer or its Users (“Usage Data”). “Data Processing Agreement” means Docker’s data processing agreement available at https://www.docker.com/legal/data-processing-agreement. “Docker Build Cloud” means the hosted cloud service of the Service for building container images. “Docker Desktop” means the downloadable object-code of the desktop client software component of the Service. “Docker Hub” means the hosted repository component of the Service for finding and sharing container images. “Docker Scout” means an added component of the Service used for providing insights and suggestions on improving software supply chain including aspects of security and vulnerability scanning. “Docker Product Suite” or “Service” means the development, non-production, generally available cloud subscription software products, and downloadable components thereof, ordered by Customer as set forth in an applicable Order Form, including Docker Desktop, Docker Hub, Docker Scout, Docker Build Cloud, Testcontainers Cloud, and any Add-on Services, as well as any updates thereto. Except for certain third-party software expressly set forth in an applicable Order Form, the definition of Docker Product Suite does not include Third-Party Products or content available in a registry or repository via the Service, which are instead subject to the corresponding third-party’s license or terms. “Documentation” means the Service documentation made available by Docker on the Docker website at https://docs.docker.com. “Entitlements” means the User license quantities, usage minutes, image pull count and storage, and any additional product and usage limits thereto, or support features, included in the Subscription purchased by Customer. “Evaluation Services” means software or services that are distributed or otherwise made available for Customer to try at its option, at no additional charge, and which are designated as beta, limited release, developer preview, non-production, proof of concept, evaluation, or that are similarly described in the corresponding Order Form, applicable Evaluation Services registration process or Documentation. The terms applicable to such Evaluation Services shall be set forth in an applicable Order Form or addendum to this Agreement. “Fees” means the corresponding monetary amounts quoted for a non-free of charge Subscription or Entitlement. “Government Entity” means (1) any federal, national, supranational, state, provincial, Commonwealth, local or foreign or similar government, governmental subdivision, regulatory or administrative body or other governmental or quasi-governmental agency, tribunal, commission, court, judicial or arbitral body or other entity with competent jurisdiction; (2) any entity directly or indirectly owned or controlled by the government or a government organization; (3) any entity created by law or decree; (4) any entity whose principal source of funds comes from the government; or (5) any department, agency, or instrumentality of a public international organization. It is within Docker’s sole discretion to determine if an entity is considered a Government Entity under the terms of this definition. “Marketplace” means a third-party online marketplace such as Amazon Web Services, or other authorized platforms (each, a “Marketplace”) through which Customer completes a Service license purchase. “On-Demand Usage” means usage in excess of the Entitlements’ consumption limits included or additionally purchased. “Open Source Software” means third-party software that is distributed or otherwise made available as “free software”, “open source software” or under a similar licensing or distribution model. “Order Form” means the digital or physical ordering document identifying the products and related Fees as applicable for Customer’s purchases from Docker. Order Forms shall be deemed incorporated herein by reference. “Pricing Page” means the Pricing and Subscriptions page which has a description of the Offering tier of the Service set forth at https://www.docker.com/pricing. “Public Sector SSA” means the Public Sector Subscription Service Agreement applicable to U.S. Public Sector Customers, available at https://www.docker.com/static/Docker-Public-Sector-SSA.pdf “Reseller” means a Docker authorized third-party reseller partner. “Subscription” or “Offering” means the level of Entitlements you have ordered from the Service description offerings described on the Pricing Page or an applicable Order Form. “Subscription Term” means the period of time set forth in the applicable Order Form during which Customer is authorized to use the Service. “Testcontainers Cloud” means the hosted cloud service of the Docker Product Suite for provisioning disposable, on-demand virtual containers for software development and testing use cases. “Third-Party Products” means optionable Web-based or downloadable software or services licensed by third-parties and that Docker may make available for Customer to use in conjunction with the Docker Product Suite. Except as otherwise specified in an Order Form, such Third-Party Products shall be subject to the corresponding third- party’s license or terms, as applicable. “User” means an individual authorized by Customer to log into or to otherwise use the Service for Customer’s internal business purposes and in accordance with the terms of this Agreement and the applicable Order Form. For paid Offerings, Users may include employees, consultants, contractors, and agents of Customer or its affiliates subject at all times to the license restrictions of this Agreement. “U.S. Public Sector Customer” means solely with regard to United States Customers, any Government Entity. The term also includes state, local, or public education entities created by the laws (including constitution or statute) of a U.S. state or commonwealth (“SLED”). 2. License and Ownership. 2.1 Subject to the terms and conditions of the Agreement and the applicable Order Form, Docker hereby grants Customer a limited, non-exclusive, non-transferable, non- sublicensable license during the applicable Subscription Term for Customer to permit its Users to: (i) download, install, run, and use Docker Desktop and (ii) access and use Docker Hub, and otherwise access and use the Service, in accordance with the applicable Documentation for Customer’s internal business purposes. Customer understands and agrees that Users require a Docker Hub account in order to receive the corresponding access to the Service. Docker owns the Usage Data. Nothing herein will be construed as restricting or prohibiting Docker from utilizing the Usage Data in any way, including to optimize and improve the Docker Product Suite or related Docker services so long as the Usage Data remains aggregated and de-identified, or to enforce this Agreement. 2.2 Customer grants to Docker, its Affiliates and applicable contractors a worldwide, limited-term license to host, copy, transmit and display Customer Data, as reasonably necessary for Docker to provide the Service in accordance with this Agreement. Customer will: (a) be solely responsible for the nature, quality and accuracy of the Customer Data, (b) ensure that the Customer Data complies with the terms of this Agreement and all applicable laws, (c) promptly handle and resolve any notices and claims relating to the Customer Data, and (d) ensure that it has the rights to the Customer Data necessary to grant Docker the rights contemplated by this Agreement. Docker has no liability to Customer or any third party as a result of: (i) any unauthorized disclosure or access to an Administrator’s or User’s account or Customer Data as a result of an Administrator’s or User’s, misuse of the Service or loss or theft of any Administrator or User password or username, except to the extent resulting from Docker’s gross negligence or willful misconduct, (ii) any deletion, destruction, damage or loss of Customer Data caused by, or at the direction of, Customer, or (iii) Customer’s failure to maintain adequate security or virus controls in any devices used to access the Service. 2.3 The Service is made available for use or licensed, not sold. Customer acknowledges and agrees that this Agreement does not transfer to Customer any Docker or third-party intellectual property rights. Customer acknowledges and agrees that, as between Docker and Customer, Docker owns all right, title, and interest in and to the Service (including any improvements, modifications, and enhancements thereto), and Docker shall, notwithstanding any other term of this Agreement, remain the owner of the Service. All rights not expressly granted by Docker herein are reserved. 2.4 During the Subscription Term, Docker will provide support for the Service in accordance with the Service Level Agreement & Terms available at https://www.docker.com/support/, as applicable to the products and support purchased via an Order Form. 2.5 Docker may offer certain product features, APIs, or other components of the Service (“Early Access Products”) to you as part of an Early Access Program (“EAP”). Your use of Early Access Products is subject to any additional terms specified by Docker and is only permitted during the limited period we designate (or, if not designated, until terminated in accordance with this Agreement). Docker may modify or terminate your right to use Early Access Products at any time and for any reason in its sole discretion. You understand that Early Access Products are under active development, may be inoperable or incomplete, and are likely to contain more errors and bugs than the generally available features of the Service. Docker makes no representations as to the performance of such Early Access Products nor promises that any Early Access Products will ever be made generally available. All information regarding the features or performance of any Early Access Products is deemed Docker Confidential Information. 3. Subscription Term; Payment. 3.1 The length of the Subscription Term. The Subscription Term will automatically renew for additional 12-month periods unless a party provides at least 30 days’ written notice prior to the end of the then-current term that such party does not wish to renew for the upcoming term. In the case of non-renewal by Customer, a notice as found at https://www.docker.com/static/Docker-Notice-of-Non-Renewal.pdf, must be signed and emailed to sales@docker.com no less than 30 days prior to the end of the Subscription Term. Upon renewal, Customer shall pay the subscription Fees set forth in the applicable renewal Order Form. All payment inquiries should be directed to receivables@docker.com. 3.2 For an Offering purchased or otherwise facilitated through our sales team, pricing and other relevant terms will be set forth in the applicable Order Form. Unless stated specifically otherwise on the Order Form, all payments to Docker including for invoiced On-Demand Usage, are due within 30 days of the invoice from Docker to you. Late payments will bear interest at the rate of 1.5% per month (or the highest rate permitted by law, if less). In addition to any of Docker’s other rights or remedies, Docker reserves the right to disable or suspend Customer’s and its User’s access to the Service for any failure by Customer to pay due invoices in accordance herein. All payment inquiries should be directed to receivables@docker.com. 3.3 Customer may purchase additional Entitlements as made available by Docker. 3.4. For Customer’s purchase of the Services is through a Marketplace or through a Reseller, Customer agrees to pay all fees according to the standard Docker price list found at each Marketplace or Reseller price, including all applicable charges specified for the Service (including any charges for use in excess of authorizations). The Docker price list is exclusive of any customs or other duty, tax, and similar levies imposed by any authority. Customer understands it will pay the applicable Marketplace or Reseller in lieu of paying Docker directly. Customer’s acceptance of the Marketplace or Reseller pricing and terms and conditions shall bind Customer to the obligations of this Agreement and any applicable Order Form. If Customer purchases through a Marketplace or Reseller, Customer will be responsible for full payment of the fees for the Subscription Term, regardless of usage, payment or billing terms between Customer and the Marketplace or Reseller. 3.5 Except as otherwise expressly set forth in this Agreement, all payments by Customer hereunder are non-refundable and shall be made free and clear of and without reduction for all applicable withholding, sales or use, goods and services, value- added, consumption or other similar fees or taxes imposed by any government (other than taxes on the net income of Docker), which shall be paid by Customer. Accordingly, if you are required to withhold any taxes on the amounts payable to Docker hereunder, you shall pay Docker such additional amounts as are necessary to ensure receipt by Docker of the full amount that Docker would have received but for the deduction on account of such withholding. You shall provide Docker with official receipts issued by the appropriate governmental agency, or such other evidence as is reasonably requested by Docke"
