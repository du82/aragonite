["https://docker.io/resources/distilled"]
title = "Case Study: Distilled and Docker | Docker"
description = "Distilled, a prominent Irish company, manages four major online marketplaces: Daft.ie, DoneDeal.ie, Adverts.ie, and Gumtree.ie. With a long-standing market presence, particularly with Daft.ie, which has led the market for over 20 years, Distilled is a key player in Ireland's online marketplace sector."
full_description = "About: As custodians of Ireland’s four most successful internet brands, Daft.ie, DoneDeal.ie, Adverts.ie, and Gumtree.ie, Distilled exists to make buying and selling in Ireland. Industry: Online Media Location: Dublin, Leinster “Docker Scout helps us ensure that our payments and user data are fully secured.” — Milen Dobrev, Senior Engineering Manager Distilled, a prominent Irish company, manages four major online marketplaces: Daft.ie, DoneDeal.ie, Adverts.ie, and Gumtree.ie. With a long-standing market presence, particularly with Daft.ie, which has led the market for over 20 years, Distilled is a key player in Ireland’s online marketplace sector. Driven by the need for PCI compliance for its payment processing systems, Distilled identified critical requirements. They needed a robust solution to continuously monitor and address vulnerabilities in their Docker images and ensure stringent security measures were maintained. Distilled chose Docker Scout, which led to an operational shift to secure development and help meet compliance requirements. Distilled faced an important challenge in meeting the stringent requirements of PCI-DSS 4.0 compliance for its payment processing systems. According to PCI-DSS 4.0, all system components must be protected from known vulnerabilities by installing applicable security patches/updates within one month of release. This rigorous standard demands continuous and thorough security measures. The initial security setup at Distilled, which utilized a basic Docker security scanner, did not fully meet these requirements. The core issue was that the existing tool only scanned Docker images at the point of being pushed, which meant that vulnerabilities in infrequently updated images could go unnoticed and unpatched. This approach posed a significant risk, especially for Docker images that hosted both frontend and backend applications handling sensitive payment information. There was no real-time awareness of new vulnerabilities due to the lack of continuous monitoring, exposing the system to emerging threats. “One of the requirements for PCI-DSS assessment is to ensure that any critical and high severity vulnerabilities are patched within 30 days of a patch being released,” says Milen Dobrev, Senior Engineering Manager."
year_published = 2025
clearnet = "https://docker.io/resources/distilled"
