["https://docker.io/trust/availability"]
title = "Availability | Docker"
description = "Learn about how Docker invests in the availability of its cloud applications and environments. And tune in for real-time products status updates."
full_description = "Availability at Docker Docker’s cloud applications and environments are configured for high availability with failover across multiple availability zones. With load-balanced autoscaling and cloud provider edge services ensuring high availability and low latency, Docker Hub consistently achieves 99.9% uptime. Live system status updates Find real-time and historical product status information. Keep tabs on incidents by subscribing for email notifications. View Docker product status Support for our users Get help from the Docker team and find details on our support process and service level agreement. Read our support SLA Availability FAQs Open All Does Docker have Business Continuity and Disaster Recovery plans, and are plans tested? Yes. Docker has a documented Business Continuity Plan (BCP) or Disaster Recovery (DR) Plan that is tested annually. Our Governance, Risk & Compliance (GRC) team is responsible for maintaining and updating these plans on an annual basis at a minimum. Can Docker provide a copy of its DR plan? Docker’s BCP and DR Plans are not shared externally. But TOCs and a plan summary of Docker’s BCP/DR approach is available on our Whistic profile. Customers can access Whistic by submitting a documentation request. Are critical third parties involved in Docker Disaster Recovery tests? We make relevant providers aware that we’re performing testing, that way they’re available to support. However, these providers aren’t actively involved. Does Docker actively monitor production systems to confirm continued availability? Yes. Docker has event alerting for all production systems. Our team monitors storage capacity, resource utilization, and system performance for continued availability. Docker’s SIEM receives security audit logs in real-time or near real-time. And we investigate and remediate any unusual and unauthorized events. Does Docker backup production data? Docker has a documented Backup Policy and performs full daily backups. Our team also uses tools provided by the cloud hosting provider to automatically back up production data. Is backed up data protected? Yes. Docker storage backups are encrypted and can only be accessed by the infrastructure team. Is customer data segregated so incidents affecting one customer doesn’t affect others? Yes. Docker logically separates its customer data. Each customer has its own organization, teams, and public/private repositories. Open All Related content Compliance Learn about Docker’s certifications and compliance requirements such as SOC 2, ISO 27001, GDPR and CCPA. Go to compliance Security Find answers to questions about Docker’s security program and links to see product security notices, report a vulnerability, and more. Go to security Availability Find information about our BC/DR, backup processes, and availability. Access real-time and historical uptime information. Go to availability Privacy Learn about Docker’s Privacy Program and how we comply with specific regulations such as GDPR and CCPA. Go to privacy"
