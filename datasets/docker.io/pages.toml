["https://docker.io/customer-stories"]
title = "Customer Stories | Docker"
description = "Read our customers' stories and how Docker helped them build, share, run, and test their applications."
full_description = '''Customer Stories Real-life stories. Powered by Docker. Celebrating developers and organizations reaching their potential .auto-scroll.style-1:before { background: -webkit-gradient(linear, left top, right top, color-stop(0, #F9F9FA), color-stop(18.23%, rgba(247, 251, 254, .02)), color-stop(51.37%, rgba(247, 251, 254, 0)), color-stop(87.5%, rgba(247, 251, 254, .07)), to(#F9F9FA)); background: linear-gradient(90deg, #F9F9FA 0, rgba(247, 251, 254, .02) 18.23%, rgba(247, 251, 254, 0) 51.37%, rgba(247, 251, 254, .07) 87.5%, #F9F9FA 100%); } Case studies Customers reaching new heights with Docker How Ataccama Accelerated Its AI Journey with Docker by Delighting Developers Problem Outdated infrastructure needed updated for business cloud agility, scalability, and security with modern AI requirements. Solution Update monolithic infrastructure to containerized approach with Docker Business. Products Docker Desktop Docker Hub Read more See more stories 200+ Global customers 75% Faster deployment 40% Reduction in servers Case studies Learn how Docker continues to revolutionize development How Docker Transforms Software Delivery at The Warehouse Group Problem Long setup times, inconsistent environments, and slow deployment cycles. Solution Streamline dev environments by transitioning from VMs to Docker containers. Products Docker Desktop Docker Extensions Read more See more stories 52,000 Developer hours saved 60 sec Deployment time (down from weeks) 8 months To realize ROI Case studies Learn how Docker continues to revolutionize development How Docker Accelerates ZEISS Microscopy’s AI Journey Problem Need for consistent and efficient AI model deployment across multiple platforms. Solution Adoption of Docker Business for seamless AI model and code deployment. Products Docker Desktop Read more See more stories AI models Improved consistency 48,000+ Employees GPU Access Supports Linux-based containers on Windows Customer news Teams pushing their best code with Docker Walmart’s Practical Guide to ML Web App Deployment Using Docker and Kubernetes Problem In early development, the data science team at Walmart would often directly deploy container files to Kubernetes, increasing time spent identifying and debugging issues. Solution Leveraging Docker Desktop to easily test functions and explore configurations and experimentations to prevent major code, Docker configuration or cluster-related issues. Products Docker Desktop Read more See more stories 10,000+ Walmart Global Tech employees ML Ops Integrate ML into business apps Flask Application packaging Case studies Learn how Docker continues to revolutionize development Testing Strategies for Developer Efficiency at Netflix Problem Aubrey Chipman and Roberto Perez Alcolea from Netflix discuss challenges to developer productivity by addressing frequent interruptions, slow builds, and flaky tests Solution Implement Docker and Testcontainers Cloud to optimize testing processes, reduce flaky tests, and reduce build times. Products Testcontainers Learn more See more stories 850,000 Builds monthly ~14 Million Test cases each month Flow state focus Reducing interruptions Case studies Learn how Docker continues to revolutionize development Justin Cormack Highlights Docker-Microsoft Synergy at Build 2024 Problem Developers often face inefficiencies with disjointed tools and environments, slowing down project timelines and increasing frustration. Solution Justin Cormack demonstrated at Build 2024 how Docker Desktop and Microsoft Dev Box unify development environments, boosting efficiency and productivity. Products Docker Desktop Microsoft Dev Box Watch now See more stories Unifed workflows Efficient development integration Windows on ARM Streamlined environments Global usage Popular dev solutions Community stories Discover more ways developers use Docker Industry & Environment Scientific Applications Development Insights Docker vs. Virtual Machines: Optimizing High-Performance Computing The paper discusses deploying high-performance computing (HPC) applications using Docker, highlighting its advantages over traditional virtual machines in terms of efficiency and data-intensive application handling. It delves into Docker's architecture and its minimal overhead, despite some resource management challenges. Check it out Scalability and Flexibility in TSN: A Microservices Approach The paper introduces μTSN-CP, a microservices-based control plane for Time-Sensitive Networking (TSN) that leverages Docker for dynamic scalability. This innovative approach enhances network configuration flexibility, efficiently manages TSN switches, and optimizes computational resources, making it ideal for industries with stringent networking requirements like automotive and industrial communications. Check it out Docker-Powered Dataset Analysis for U.S. Lake Water Quality This USGS dataset integrates over 35 years of lake water quality data, utilizing Docker to ensure computational reproducibility across different systems. The dataset identifies significant trends in the trophic states of over 55,000 lakes, enhancing the precision and ease of large-scale environmental studies. Check it out Using docker in unusual ways Explore innovative uses of Docker beyond typical application containerization, highlighting its role in enhancing software development workflows, ensuring backward compatibility, and managing legacy code efficiently with new features that simplify the development process. Check it out 100+ Docker Concepts you Need to Know Dive into Docker 101, where we explore the transformative power of containerization. Understand how Docker resolves "it works on my machine" and scaling challenges, making software deployment seamless across various platforms. Learn the essentials of Docker, from container basics, networking, to deploying in the cloud, and scaling with Docker's ecosystem. Check it out Advancing Biomedical Knowledge with Docker-Powered PheKnowLator Ecosystem The paper introduces PheKnowLator, leveraging Docker to deploy a scalable knowledge graph ecosystem for life sciences. This open-source framework integrates diverse biomedical data into customizable knowledge graphs, enhancing research with dynamic and efficient modeling capabilities facilitated by Docker's containerization technology. Check it out DPABINet Enhances Brain Network Analysis with Docker Technology DPABINet, leveraging Docker technology, offers a user-friendly platform for sophisticated fMRI-based brain network analysis, enhancing accessibility and precision in neuroscience research. Check it out NASA GeneLab’s Docker-Enhanced Microarray Data Processing Workflows GeneLab has integrated Docker into their new Nextflow workflows for Microarray data processing, ensuring scalable and reproducible analysis. These workflows handle data extraction, processing via Affymetrix or Agilent pipelines, and real-time validation, significantly advancing the processing capabilities for complex genetic research. Check it out From IBM & Amazon to Docker Captain & Snyk Ambassador | Interview with Vladimir Mikhalev In this video podcast episode, @RameezStories hosts Vladimir Mikhalev, a Docker Captain and seasoned developer with two decades of experience at companies like Amazon and IBM. They discuss Valdimir's journey from a young systems administrator to a respected DevOps expert, his insights on Docker's evolution, and his role as a Snyk Ambassador. Check it out A Decade with Docker: Nick Janetakis’ Journey and Insights Nick Janetakis reflects on his journey with Docker since 2014, highlighting how it revolutionized his web application development process. He discusses the challenges he faced with traditional setups and how Docker's containerization streamlined development, deployment, and team collaboration, celebrating Docker's flexibility and impact over his decade-long usage. Check it out Windows and WSL Containers in 2023 In this podcast, Bret Fisher chats with fellow Docker Captain Nuno do Carmo about desktop container solutions and the best Docker setup for Windows 11. With a focus on the upcoming 10-year Docker anniversary, Bret reflects on Docker's evolution and introduces a new live course on GitHub actions and GitOps, offering insights into enhancing DevOps workflows. Check it out Find a subscription that’s right for you Contact an expert today to find the perfect balance of collaboration, security, and support with a Docker subscription. Contact sales Customer resources Find support Get support Have questions about pricing or your current subscription? Our support team is here to help. Resources Find the resources your business needs to succeed and how Docker can help. New to the Blog Stay current on new releases, products, features, and much more. Documentation Get the technical breakdown of our products, features, and release notes.'''
