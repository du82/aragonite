["https://docker.io/community/open-source/application"]
title = "Apply Today - Docker-Sponsored Open Source Program"
description = "The Docker-Sponsored Open Source Program offers non-commercial, open source developers the tools they need to push their projects forward. Apply today!"
full_description = "Docker-Sponsored Open Source Program The open source community is at the heart of modern development. Developers around the world create new technology using open source and we’re here to help make those innovations a reality. In the Docker-Sponsored Open Source (DSOS) program, non-commercial open source developers can continue to collaborate, innovate, and push their projects forward — all with the support of Docker’s platform and tools. Who can apply? Our Docker-Sponsored Open Source (DSOS) program is ideal for developers working on projects without a path to commercialization. Why join the Docker-Sponsored Open Source program? Improve discoverability and build brand awareness on Docker HubYour images are verified by Docker and get a special badge on Docker Hub. The increased visibility makes it easier for your project to be discovered — and gives developers the confidence that they’re pulling images vetted by Docker. Focus on productivity and innovationSave time and focus on innovation with free autobuilds to set up CI for containerized projects. With autobuilds, Docker automatically builds images from source code in your external repository and automatically pushes the build image to your Docker repositories. Say goodbye to rate-limitsProgram members and users pulling public images from your project namespace are not subject to rate limits. Unlock the benefits of a free Docker Team subscriptionCore contributors of your project namespace get access to a year-long Docker Team subscription that includes: Docker Desktop, 15 concurrent builds, unlimited Docker Hub image vulnerability scans, unlimited scoped tokens, role-based access control, and audit logs. Qualification Criteria To qualify for the Docker-Sponsored Open Source program, your project namespace must: Be shared in public repositories on Docker Hub, and the source code must also be publicly accessible on its respective repository. Meet the Open Source Initiative definition. Be in active development on Docker Hub, which means image updates are pushed regularly within the past 6 months or dependencies are updated regularly, even if the project source code is stable. Not have a pathway to commercialization. Your organization must not seek to make a profit through services or by charging for higher tiers. Accepting donations to sustain your efforts is permissible. In addition Your project repositories on Docker Hub must have documentation that meets the recommended community standards. We recommend a detailed project description on your Docker Hub pages that includes a link to your project in its respective source code repository and contributing guidelines. Projects lacking this information will not receive a Docker-Sponsored Open Source membership. Docker-Sponsored Open Source program Terms of Agreement Program benefits are provided only to project leads and core project committers. Program status and benefits are valid for one year and can be renewed if your project still meets the program requirements. You may use the program benefits solely for developing non-commercial open-source projects. Docker licenses are for use only by project collaborators and cannot be shared with any third party. Apply Here Today form#mktoForm_1295, form#mktoForm_1295 .mktoFormRow, form#mktoForm_1295 .mktoFormRow, form#mktoForm_1295 .mktoFormCol, form#mktoForm_1295 .mktoFieldWrap, #mktoForm_1295 select, #mktoForm_1295 textarea { width: 100% !important; } #mktoForm_1295 input, #mktoForm_1295 select, #mktoForm_1295 textarea { width: 75% !important; } #mktoForm_1295 label.mktoHasWidth { width: 22% !important; margin-right: 1%; } #mktoForm_1295 .mktoFormRow .mktoHasWidth { width: 100% !important; max-width: unset; }"
