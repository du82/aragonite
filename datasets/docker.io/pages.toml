full_description = "Women of Docker Docker is proud to have created a workforce that consists of many exceptional women. We’re committed to creating a diverse workforce and inclusive culture for all. Docker supports the career development and advancement of all of its female employees. Working at Docker Hiring & Onboarding Docker Engineering Women of Docker Current Openings Under-Represented Genders ERG The mission of Docker’s Under-Represented Genders ERG is to build an inclusive community to discuss and create awareness around issues under-represented genders face in the workplace. The ERG provides tools and resources for gender minorities, and helps colleagues who work with gender minorities to be better equipped to support them. The group is open to all Docker employees on a voluntary basis. Group members can enjoy the benefits of networking, career development, education, and guest speakers. Diversity and Women in Tech At Docker, we feel strongly about embracing diversity and are committed to being proactive with respect to inclusion. As an example of our support for diversity, during our DockerCon 2021, we hosted Community Rooms with panels and sessions for our global audience in their native languages. We highlighted the contributions from our women Captains and community developers. Don’t miss our Docker blog post, ‘Why We Need More Gender Diversity in the Cybersecurity Space,’ to understand the critical importance of having more women in the tech industry. Docker Offers Benefits and Perks that Women Want Freedom and Flexibility Remote Work — Work from where you are Flexible Work Schedule — Fit your work around your life Time Off Paid Time Off — We encourage you to use time to recharge. Professional Development Internal Promotion of Talented Women Training Stipends to Support Learning and Career Advancement Docker’s Under-Represented Genders ERG Guest Speakers to Educate, Encourage, and Inspire Health and Wellness 100% Paid Medical, Vision, and Dental Insurance Dependent Care FSA Sick Leave Maternity, Parental, and Family Leave “As a woman in tech. it’s important to me to feel heard and supported by the organization I’m a part of. My colleagues and I formed an employee resource group for Women at Docker, and I’ve received overwhelming support from leadership and my peers for not only the employee resource group, but also my professional development!” Emma Wolin, Account Executive, Enterprise Under-Represented Genders ERG Leader Anca Iordache Shares Docker Compose with the Developer Community Anca Iordache, one of our talented engineers, gave an amazing talk during our December 2021 Community All-Hands. Anca presented “Awesome Compose: Start Running Your Container Now,” which explains Docker Compose. She also discusses why we created ‘awesome-compose’ and demoed some of the applications from the repo. Docker Concepts – Software Supply Chain Security Gabriela Georgieva, Senior Security Engineer at Docker, offers an easy-to-follow explanation of software supply chains and their importance in cybersecurity. Watch her presentation to gain insights into software supply chain threats and security best practices. Watch more “The number of women in leadership positions at Docker is inspiring. Docker sees the value of and wants women to succeed here. Being surrounded by so many talented women in this workplace has been amazing. Everyone is so respectful and supportive of one another. It really is a great environment for women to grow their career.” Trish Allsopp, Lead, Recruiting Operations Ready to join our team? Current openings"
year_published = 2022
year_updated = 2023
