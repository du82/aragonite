["https://docker.io/resources/cariad"]
title = "Case Study: CARIAD and Docker | Docker"
description = "CARIAD is the automotive software company of the Volkswagen Group, bundling the Group's tech and software competencies. The company transforms automotive mobility by developing the leading tech stack to make the automotive experience safer, more sustainable, and more comfortable. The brands benefiting from CARIAD's software solutions are all Volkswagen Group brands."
full_description = "Industry: Automotive software Company size: 6,000+ developers, engineers, and business team members Location: Headquartered in San Francisco, California, U.S., available in over 100 countries CARIAD is the automotive software company of the Volkswagen Group, bundling the Group’s tech and software competencies. The company transforms automotive mobility by developing the leading tech stack to make the automotive experience safer, more sustainable, and more comfortable. The brands benefiting from CARIAD’s software solutions are all Volkswagen Group brands. CARIAD’s software platform provides constant and efficient updates, cutting-edge vehicle functions like driver assistance systems, an innovative infotainment platform, and other software functions, creating a vast digital ecosystem within and around the VW Group vehicles. The digital platforms suit any car model, from entry-level to top-end. Applications are customized to the emerging needs of the brand, the model, and in the end, the end-user’s individual mobility behavior. Due to the various complex development tasks, CARIAD chose to partner with Docker to create a safe and compliant containerized development environment ensuring compatibility across diverse hardware platforms. By adopting advanced technological solutions, CARIAD addresses the dynamic challenges of automotive software development to streamline development processes and boost development efficiency and innovation. CARIAD’s history is one of rapid expansion. Developers from different automotive and tech companies were engaged in one software powerhouse to develop Volkswagen’s leading tech stack. Accumulating operational fragmentation, the software specialist faced growing complexity as it integrated disparate systems, each with its own technological stacks and development methodologies. The unique aspect of CARIAD’s use case lies in its deployment of Unix-based software within its vehicles, utilizing Linux devices or embedded Linux distributions. However, its development process necessitates the use of Windows technology, driven by contractual obligations, compliance mandates, and technical constraints, particularly for testing purposes where software is exclusive to Windows. This requirement is not unique to CARIAD and is a common scenario faced by developer teams across various industries operating within intricate corporate environments."
year_published = 2025
