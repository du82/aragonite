["https://docker.io/resources/zeiss"]
title = "Case Study: ZEISS and Docker | Docker"
description = "The ZEISS Research Microscopy Solutions (RMS) team faced challenges in its artificial intelligence (AI) and machine learning (ML) journey. The team crafted a strategy centered on the powerful combination of cloud platforms and Docker’s container technology, marking the beginning of a transformative era."
full_description = "About company: ZEISS is an internationally leading technology enterprise Industry: Optics and optoelectronics industries Company size: 42,000+ employees Location: Headquartered in Oberkochen, Germany; ZEISS is represented in around 50 countries around the world Product: Docker Desktop The ZEISS Research Microscopy Solutions (RMS) team faced challenges in its artificial intelligence (AI) and machine learning (ML) journey. The team crafted a strategy centered on the powerful combination of cloud platforms and Docker’s container technology, marking the beginning of a transformative era. Working with Docker, the ZEISS team took advantage of rapid deployment and scaling, GPU accessibility, cross-platform portability, resource efficiency, version control and reusability, isolation and security, developer familiarity with Docker solutions, and the vast Docker ecosystem. For more than 175 years, ZEISS has been shaping technological progress, advancing the world of optics with solutions from its four segments — Semiconductor Manufacturing Technology, Industrial Quality & Research, Medical Technology, and Consumer Markets — and meeting its customers’ needs. The ZEISS Research Microscopy Solutions (RMS) team uses containers to deploy AI models and code across various platforms. For example, ZEISS leverages its cloud-based arivis AI platform to annotate multi-dimensional microscopy image data and train AI models for segmentation. Those models — including all the code required to run them — are deployed via containers with application-specific interfaces for different clients. ZEISS is an internationally leading technology enterprise in the optics and optoelectronics industries. The ZEISS Group has more than 42,000+ employees across six continents with more than €10 billion in annual revenue. As a leading manufacturer of microscopes, ZEISS offers solutions and services for life sciences and materials research, teaching, and clinical routine. Reliable ZEISS systems are used for manufacturing and assembly in high-tech industries and the exploration and processing of raw materials worldwide and for life science research and basic research. Because modern microscopy is all about “actionable information” extracted from large, multi-dimensional datasets, powerful computer vision and processing methods are an integral component of the RMS software portfolio. In particular, the need for robust and powerful segmentation methods using state-of-the-art AI models is a common use case."
year_published = 2025
