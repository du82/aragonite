title = "Docker: Accelerated Container Application Development"
description = "Docker is a platform designed to help developers build, share, and run container applications. We handle the tedious setup, so you can focus on the code."
full_description = "Develop faster. Run anywhere. Build with the #1 most-used developer tool Download Docker Desktop Download for Mac - Intel Chip Download for Mac - Apple Silicon Download for Windows - AMD64 Download for Windows - ARM64 (BETA) Download for Linux Learn more about Docker What is Docker? Accelerate how you build, share, and run applications Docker helps developers build, share, run, and verify applications anywhere — without tedious environment configuration or management. Build Share Run Verify Test Build Spin up new environments quickly Accelerate your development by building Docker images locally or in the cloud with Docker Build Cloud. Create multiple containers using Docker Compose without the hassle of local build constraints. Integrate with your existing tools Docker seamlessly integrates with your development tools, such as VS Code, CircleCI, and GitHub. Meanwhile, Docker Build Cloud fast-tracks build times, resulting in an enhanced workflow without disruption. Containerize applications for consistency Ensure consistent application performance across any environment, whether it’s on-premises Kubernetes or cloud platforms like AWS ECS, Azure ACI, and Google GKE. Optimize builds with Docker Build Cloud Share Discover and manage container images with Docker Hub Explore Docker Hub, the world’s largest registry, where you can discover, distribute, store, and serve cloud-native components, including container images. Access a vast repository of trusted content from verified publishers and Docker Official Images. Collaborate with your team seamlessly Easily pull and publish images from Docker Hub to streamline sharing within your team, organization, or the broader community. Docker Hub simplifies the management and distribution of container applications. Ensure security and trust with Docker Hub Secure your workspaces with robust image access management, registry access controls, and private repositories. Docker Hub offers a secure and trusted marketplace for your container images, ensuring best practices and peace of mind. Discover Docker Hub Run Develop secure, modern applications with Docker Desktop Docker Desktop simplifies and accelerates the development of secure, containerized applications. Gain speed through streamlined containerized development and ensure secure workflows with robust security measures that protect your code throughout the development lifecycle. Flexible and integrated development environment Docker Desktop provides a local environment for efficient building and testing of containerized applications. It supports a wide range of programming languages and integrates seamlessly with various developer tools, including Docker Hub for pre-built components, Docker Scout for security scanning, and third-party tools. Streamline your development workflow Effortlessly manage your applications with Docker Desktop’s pre-configured templates and easy integration with image registries and CI/CD pipelines. This comprehensive platform supports both individual developers and organizations, offering a secure and flexible environment for the entire application lifecycle. Start with Docker Desktop Verify Enhance security with Docker Scout Docker Scout is a secure software supply chain solution designed to provide actionable insights for container images. It helps teams evaluate security and compliance policies, ensuring a robust security posture. Increase transparency and visibility Gain insights and context into your components, libraries, tools, and processes with Docker Scout. This increased transparency helps you understand and manage the software supply chain effectively. Proactively address security concerns Docker Scout detects and highlights security issues, offering suggestions for remediation based on policy violations and state changes. Ensure your application security by addressing concerns before they impact production. Explore Docker Scout Test Test dependencies as code Eliminate the need for mocks and complex environment configurations by defining your test dependencies as code. Simply run your tests, and Docker containers will be created and deleted as needed. Unit tests with real dependencies Utilize Testcontainers to provide lightweight, throwaway instances of databases, message brokers, web browsers, and more. Test anything that can be containerized for accurate, reliable testing. Integrate and automate with ease Efficiently run data access layer integration tests, UI/acceptance tests, and application integration tests using containerized instances. Enjoy a clean, consistent testing environment with minimal setup. Check out Testcontainers Explore all Find pricing Why use Docker? Trusted by developers. Chosen by Fortune 100 companies. Docker provides a suite of development tools, services, trusted content, and automations, used individually or together, to accelerate the delivery of secure applications. Read more customer stories 20M+monthly developers 7M+applications 20B+monthly image pulls Container development New to containers? We got you covered! Get started with the basics with our guide to containers, including what they are, their advantage over virtual machines, and more. Read the container guide Quebec, Canada Hamida Rebai Cloud Solution Architecte Revenu Quebec Learn more Mumbai, India Yadnesh Nikam Senior DevOps Consultant Holcim Learn more Longmont, USA Brandon Hunt Software Architect Intrado Life & Safety Learn more Connect Meet the community Stop by any of the hundreds of meetups around the world for in-person banter or join our Slack and Discourse for virtual peer support. Our Docker Captains are also a great source of developer insight and expertise. Connect with us Join our open source program Our Docker-Sponsored Open Source program is ideal for developers working on non-commercial projects. Apply today Develop from code to cloud with partners that you trust Our partnerships ensure that your development pipeline network will work in your preferred environment — whether local or in the cloud. Our trusted partners Simplify the development of your multi-container applications from Docker CLI to Amazon EKS and Serverless. Seamlessly bring container applications from your local machine and run them in Azure Container Instances. Easily distribute and share Docker images with the JFrog Artifactory image repository and integrate all of your development tools. Integrate with your favorite tools and images How to get started Your path to accelerated application development starts here. Download Docker Learn how to install Docker for Mac, Windows, or Linux and explore our developer tools. Get started Containerize your first app Develop a solid understanding of the Docker basics with our step-by-step developer guide. Learn Docker Publish your image on Docker Hub Share your application with the world (or other developers on your team). Sign up for free Choose a subscription that’s right for you Find your perfect balance of collaboration, security, and support with a Docker subscription. Find pricing"
