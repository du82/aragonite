title = "Is Docker Open Source? - Docker"
description = "Docker is an open source platform with a variety of components to assist in container management and additional subscription options for larger teams."
full_description = "Open Source Docker collaborates with the open source ecosystem through an array of projects that continue to fuel the containerization movement, the Docker platform and other Docker products. More about containerd Open Source Projects We provide the necessary components and tooling that helps developers build and ship their applications so they can run anywhere. In the last few years, millions of people worldwide have downloaded these container components. Compose Define and run multi-container applications with Docker View on GitHub BuildKit A set of tooling for building and packaging software using containers View on GitHub Docker CLI A command line tool that allows you to interact with Docker View on GitHub Testcontainers Testcontainers is an open source framework for providing throwaway, lightweight instances of databases, message brokers, web browsers and more View on GitHub containerd The industry-standard core container runtime, donated to the CNCF (Cloud-native Computing Foundation) with an emphasis on simplicity, robustness and portability View on GitHub HyperKit A toolkit for embedding hypervisor capabilities in your application View on GitHub CNCF Distribution The Docker toolset to pack, ship, store, and deliver content View on GitHub Moby An open framework to assemble specialized container systems without reinventing the wheel View on GitHub Notary A tool for running and interacting with trusted content collection – donated to the CNCF View on GitHub Runc The reference implementation for the Open Container Initiative (OCI) View on GitHub Swarmkit A toolkit for orchestrating distributed systems at any scale View on GitHub Get started with Docker today. Get Started"
