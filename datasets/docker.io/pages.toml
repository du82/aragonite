title = "Eric Smalling | Docker"
description = "Eric has about 30 years of professional experience in enterprise software development and architecture, including build, test, and deployment automation. He has been practicing DevOps concepts since long before the term was coined. On practically every project throughout his career, he has worn multiple hats: developer, automated testing evangelist, version control administrator, and build system engineer. Eric has been a continuous integration advocate and implementer for nearly a decade and has been a Docker user since 2013. A second-generation software developer. (his father was a SNOBOL coder in the 60s and the president of the Honeywell/Bull Users society for several years), he grew up in the 1980s and was coding 8-bit machines in elementary school. In his spare time, he enjoys spending time with his wife and kids, traveling, photography, and is an avid retro computing and EV enthusiast."
