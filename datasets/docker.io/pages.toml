["https://docker.io/resources/ataccama"]
title = "Case Study: Ataccama and Docker | Docker"
description = "Ataccama faced several technology and business challenges as it looked to scale further. The company saw the need to migrate from bare metal servers and legacy systems to take advantage of cloud platforms like AWS and Azure's agility, scalability, and cost efficiencies."
full_description = "About company: Ataccama Corporation is an international software company Industry: Software Development Company size: 501-1,000 employees Location: Headquartered in Toronto, and located near clients in North America, EMEA, and APAC In looking ahead at its scaling business, Ataccama wanted to take advantage of cloud platforms like AWS and Azure for agility, scalability, and cost efficiencies. The move from physical to cloud servers included standardizing deployment processes by adopting containerization technologies like Docker. Ataccama also transitioned development and IT teams to DevOps methodologies to facilitate this shift. Finally, improving security posture and delivering higher application performance took priority, given Ataccama’s customers’ expectations. Docker’s suite of developer tools delivered an ideal solution, helping Ataccama achieve rapid deployment, seamless portability between environments, and simplified application management. By migrating to Dockerized microservices, Ataccama was able to accelerate feature development, boost efficiency and performance, and ensure security and high availability. For more than 16 years, Ataccama has been a pioneer in data quality, governance, and master data management (MDM). Powered by generative AI (GenAI), Ataccama ONE provides comprehensive data management capabilities to help organizations accelerate their business initiatives with trusted, high-quality, governed data. With over 200 global active customers, Ataccama continues to drive innovation in how businesses maximize the value of data. The Ataccama team recognized the need to keep up with the latest technology to ensure enhanced agility, scale, and cost efficiency. This shift from monolithic legacy apps to cloud-native architecture required standardizing deployment through containers and orchestrators, including Docker and Kubernetes. Additionally, transitioning from manual coding and operations to automated DevOps methodologies presented new opportunities for upskilling the Ataccama technical teams. Equipping developers with container skills and promoting collaboration between teams was an important part of the project."
