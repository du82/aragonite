["https://docker.io/products/trusted-open-source-content"]
title = "Docker Trusted Open Source Content | Docker"
description = "Learn about Docker Trusted Open Source Content and how these reliable images can jumpstart your next project, without compromising security."
full_description = "Docker Trusted Open Source Content Secure open source software you can trust Build with open source content that sets the standard Explore images What’s Docker Trusted Open Source Content? Open source content you know is safe to use Docker Trusted Open Source Content are high-quality, maintained images of open source platforms, applications, and libraries available on Docker Hub. Made possible by the Docker Official Images and Docker Sponsored Open Source (DSOS) programs, these images provide developers with a trusted version of open source projects. By providing image provenance verification, Trusted Open Source Content limits exposure to malicious content in early development stages. Why use Trusted Open Source Content? Reliable building blocks for better builds Get all the perks that come with open source software — with added Docker benefits. Improve efficiency and velocity Only let reputable software you trust into your systems. Using reliable open source images means you’ll run into fewer bugs, get regular updates, and you’ll ship applications faster than ever. Save developer time and effort Spend more time developing new features and less time reinventing the wheel. Instead of starting from scratch, developers can pull from a library of 8,000+ trusted base images, projects, and sources. Trusted Open Source Content Secure your builds from the start. Choose from high-quality images that exemplify Dockerfile best practices, originate from known sources, and receive security updates in a timely manner. Trusted Open Source Content sources What’s included in Docker Trusted Open Source Content? Trusted Open Source Content includes two Trusted Content programs: Docker Official Images Docker Official Images are high-quality, open source container images curated by Docker and maintained in collaboration with the upstream project. These images follow best practices for building containers. Learn more about Docker Official Images Docker-Sponsored Open Source images Docker-Sponsored Open Source (DSOS) images are from non-commercial, community projects participating in the DSOS program. When you use a DSOS image, you know it came from a trusted publisher. Learn more about Docker Sponsored Open Source Additional features Take it to the next level with image management Make the most out of Trusted Open Source Content with the image management features available with a Docker Business subscription. Image Access Management lets administrators control which types of images their developers can pull from Docker Hub. Learn more about Image Access Management Take your container security to the next level with Docker Find the right subscription for your unique security requirements. See pricing Have questions?"
