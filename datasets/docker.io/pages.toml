["https://docker.io/company"]
title = "About Docker | Docker"
description = "Docker helps developers create world-changing applications. Find out more about Docker, our virtues, and our leadership team!"
full_description = '''Our Company We simplify the lives of developers building world-changing apps. Join our Team About Docker Docker helps developers bring their ideas to life by conquering the complexity of app development. Actively used by millions of developers around the world, Docker Desktop and Docker Hub provide unmatched simplicity, agility and choice. Docker Virtues Our virtues guide how we operate and make decisions. Developer Obsession We constantly put ourselves in the shoes of the developer. We seek their feedback and, by understanding their needs, we build solutions that they love. Every decision we make, big or small, starts with the customer developer in mind. Humble Confidence We leave our egos at the door. We extend kindness to each other. We assume positive intent. We respect and value differences. We are open to feedback and actively seek to learn from our mistakes. Bias for Considered Action We make data driven decisions and once a decision is made, we move! We may disagree, but as a team we commit and get behind the plan. We are not afraid to fail fast; we learn from our mistakes. We are empowered to tackle challenges in exciting and innovative ways. Open Collaboration Together, we can do great things. Our success is driven by our ability to break down silos and connect across teams, functions and geographies. We welcome new ideas and opinions from each other, our customers and the entire community. We value transparency. We ask questions. We challenge one another respectfully. We seek input and offer feedback. Outcome Driven To realize our desired outcomes, we maintain focus on the goals we set. We take ownership of our work while also leaning on the expertise of others. When tough choices need to be made, we think critically about their implications and commit to decisions that get us closer to the intended results. And if tasks drift from our North Star, we pivot and communicate to realign our day to day priorities. Leadership Don Johnson CEO Don Johnson is the CEO of Docker, leading its next phase of innovation and growth. A cloud and developer platform veteran, he previously founded Oracle Cloud Infrastructure (OCI) and was a technical leader at AWS, helping shape modern cloud computing. At Docker, Don is focused on eliminating friction in software development, from AI to CI/CD, security, and cloud operations. A math nerd, lover of dogs, and builder at heart, he’s passionate about solving hard problems and empowering developers to create the future. Download Image Scott Baumgartner Finance Scott Baumgartner is the Chief Financial Officer at Docker. He brings over 25 years of financial management and leadership experience at both public and private technology companies. Prior to joining Docker, Scott served as the Chief Financial Officer for SmartZip Analytics. Prior to SmartZip, he held various finance leadership roles at CallidusCloud, Merant Software and Read-Rite Corporation. He started his finance career at KPMG. Scott holds a Bachelor’s of Science in Accounting from the University of the Pacific—Eberhardt School of Business. Download Image Justin Cormack Technology Justin Cormack is the CTO for Docker. He has been at Docker since 2015, as a senior engineer in security and as a maintainer of Docker's open source projects. He is a member of the Technical Oversight Committee for the Cloud Native Security Foundation, helping grow projects and community in the cloud native space. He previously has worked in engineering, management and operations in finance and publishing. He is based in Cambridge, UK. Download Image Dixie Dunn Customer Success Download Image Jean-Laurent de Morlhon Engineering Jean-Laurent is the VP Engineering for Docker, overseeing the global engineering team for all products. He brings over 20 years of software engineering and development experience. He stills pushes some code when time permits. Prior to this, Jean-Laurent was leading the developer solution group within Docker. Based in Paris, he previously worked at various startups and services companies across Europe. Download Image Javier Molina Revenue Download Image Andy Ramirez Marketing Download Image Tushar Jain Engineering Download Image Kathleen Swift People Download Image Board of Directors Rob Bearden CEO, Sema4.ai Rob Bearden is an experienced enterprise software executive. He is currently CEO of Cloudera and was co-founder and CEO of Hortonworks, a publicly traded open-source company that merged with Cloudera in 2019. He also served as President and COO of SpringSource, a leading provider of open-source developer tools, until its acquisition by VMWare in 2009. Before joining SpringSource, Bearden served as Entrepreneur in Residence at Benchmark Capital. He also served as COO of JBoss, a leading open-source middleware company, until its acquisition by Red Hat in 2006. Download Image Peter Fenton General Partner, Benchmark Capital Peter joined Benchmark in 2006 after seven years as a partner at Accel Partners. In addition to Docker, he currently holds board seats at Buoyant, Cloudera (merged with Hortonworks), Cockroach Labs, Digits, Elasticsearch, New Relic (IPO: NEWR), Optimizely, Revinate, TimescaleDB, Yelp (IPO: YELP), and Zuora (IPO: ZUO). Peter’s previous investments include Coremetrics (acquired by IBM), EngineYard, FriendFeed (acquired by Facebook), JBoss (acquired by Red Hat), Lithium, Quip (acquired by Salesforce), Reactivity (acquired by Cisco), SpringSource (acquired by VMWare), Terracotta (acquired by Software AG), Twitter (IPO: TWTR), Wily Technology (acquired by CA), Xensource (acquired by Citrix), Zendesk (IPO: ZEN), Zenly (acquired by SNAP), and Zimbra (acquired by Yahoo!). Peter holds an MBA from Stanford Business School and a bachelor’s degree from Stanford University. He is also on the boards of the San Francisco Opera and the California Academy of Sciences. Download Image Jeff Horing Managing Director, Insight Partners Jeff Horing has been a co-founder and managing director at Insight Partners since 1995. Under his leadership, Insight has become a premier venture capital and private equity firm and has raised through a series of funds more than $30 billion in capital commitments. Jeff's areas of focus include data, analytics, mobile, and infrastructure and SaaS software in Europe, North America, and Israel. Jeff has invested in more than 150 companies, notably nCino (NCNO), JFrog (FROG), Alteryx (AYX), AirWatch (acquired by VMware), Shutterstock (SSTK), TeamViewer (acquired by Permira), WIX (WIX), and Greenfield Online (SRVY, later acquired by Microsoft). Prior to founding Insight, Jeff worked at Warburg Pincus and Goldman Sachs. Jeff graduated from M.I.T. and the University of Pennsylvania. Download Image Don Johnson CEO, Docker Don Johnson is the CEO of Docker, leading its next phase of innovation and growth. A cloud and developer platform veteran, he previously founded Oracle Cloud Infrastructure (OCI) and was a technical leader at AWS, helping shape modern cloud computing. At Docker, Don is focused on eliminating friction in software development, from AI to CI/CD, security, and cloud operations. A math nerd, lover of dogs, and builder at heart, he’s passionate about solving hard problems and empowering developers to create the future. Download Image Enrique Salem Managing Director, Bain Capital Ventures href="/app/uploads/2022/03/BCV-Enrique-Salem.jpg">Download Image Arjun Sethi Co-Founder, Tribe Capital Arjun Sethi is a Co-Founder of Tribe Capital, a venture capital firm built by engineers, scientists and founders. Tribe Capital has made notable investments in Bolt, Carta, Front, Instabase, Momentus, and Relativity Space. As a founder and operator, Arjun has also been an active angel investor in over 100 companies, including Lyft, Opendoor, Gusto, and Front. Prior to founding Tribe, Arjun was a partner at Social Capital from 2016 to 2018, where he led the team which established a successful track-record of backing high-growth companies such as Slack, Cloud Kitchens, and Box. He also served on the executive team at Yahoo, from 2014 to 2016, where he grew product usage to over 1 billion monthly active unique users. He joined Yahoo as part of its acquisition of MessageMe, a messaging app he founded in 2012. Prior to that, Arjun co-founded LOLapps, a mobile gaming and applications company which he scaled to 100 million monthly users before it was sold to 6waves, a subsidiary of Nexon. Download Image section.management-section .management-cards-row { display: -webkit-box; display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center; margin-top: 80px; padding-left: 0; padding-right: 0 } section.management-section .management-cards-row .management-card-item { margin-bottom: 40px; margin-left: 20px; margin-right: 20px; padding: 0 5px; position: relative; text-align: center; width: 29%; min-width: 260px; } section.management-section .management-cards-row .management-card-item .card { height: 100%; padding: 45px } section.management-section .management-cards-row .management-card-item .card .image-wrap { min-height: 200px; display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center; -webkit-box-align: center; -ms-flex-align: center; align-items: center; margin-bottom: 30px; margin-left: auto; margin-right: auto } .our-management .bio-content h3 { font-size: 24px; margin-bottom: 0px; } .our-management .bio-content h4 { font-size: 16px; margin-bottom: 0px; padding-bottom: 0; } .social-icons .twitter img { width: 24px; } .social-icons .linkedin img { width: 18px; } .social-icons .github img { width: 18px; } .social-icons .facebook img { width: 18px; } .pop-under-source { } .management-section .section-title { text-align: center; } @media screen and (max-width: 947px) { section.management-section .container .management-cards-row .management-card-item { width:45% } } @media screen and (max-width: 824px) { section.management-section .container .management-cards-row .management-card-item { width:40% } } @media screen and (max-width: 600px) { section.management-section .container .management-cards-row .management-card-item { width:80% } } @media screen and (max-width: 992px) { section.management-section .container { max-width:100% } } .modal-dialog.modal-dialog-centered { width: 90vw; height: 100%; display: flex; margin-top: 0; margin-bottom: 0; } .modal-dialog.modal-dialog-centered .modal-content { margin: auto !important; padding: 16px; } .modal-dialog.modal-dialog-centered .modal-content .image { margin-top: 36px } .modal-dialog.modal-dialog-centered .modal-content .col-md-8 { padding-left: .5em; } .modal-dialog.modal-dialog-centered .modal-content .pb-3, .modal-dialog.modal-dialog-centered .modal-content .modal-title, .modal-content .close { font-family: Poppins,sans-serif; } .modal-dialog.modal-dialog-centered .modal-header { padding-left: 0; padding-bottom: 10px; margin-bottom: 1em; } .modal-dialog.modal-dialog-centered .modal-title { font-size: 24px; } .modal-dialog .modal-content .close { color: #000; opacity: .5; font-size: 24px; font-weight: 400; } .nav>li>a:focus, .nav>li>a:hover { background-color: unset; } Get in touch Contact Us'''
