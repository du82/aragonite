title = "Events | Docker"
description = "Meet us in-person or virtually at an upcoming conference, meetup, or webinar."
full_description = "Events Learn from experts and get to know Docker. Upcoming Events 23 Apr Training Docker Admin: Set Up Your Org for Success This session is for administrators and organization owners with a Docker subscription. Learn the essentials to set up your Docker admin organization, best practices to manage your team’s security settings without limiting developer productivity, and configuring SSO and SCIM. Register! 30 Apr Training Accelerating Development with Docker Let's get started working with containers! This session is for developers with a Docker subscription. In this training, we'll show you how to start a new or existing application using Docker Desktop and Docker tools. Register! 1 Apr Training Docker Fundamentals This series is for developers with a Docker subscription who are new to Docker or those needing a refresher. Join us each month for this 3-month series, covering a range of introductory topics and live Q&A. Register! 8 Apr Training Docker in the Software Development Lifecycle Join us each month for a rotating series of topics for developers with a Docker subscription. This series covers a variety of topics around how Docker containers fit into the overall SDLC. Register! 13 Mar Conference Big Data and AI World Visit us at Booth #BD055. Join Docker at Big Data and AI World in London, and discover why Docker containers are the ideal platform for packaging GenAI applications thanks to their consistency, portability, and efficiency. Explore Docker’s leading solutions for enterprise developer teams and AI today! Register! 11 Apr Conference Google Cloud Next Visit us at Booth #1530 Meet our team at Google Cloud Next as we explore the partnership between Docker and Google Cloud, from procurement, to workflow integration, to deployment. Docker integrates security into every phase of the development lifecycle, enabling teams to build, test, and deploy software with confidence. Register! On-Demand Events Training Advanced Docker Build Building images is a common practice when working with containers. But, how does it work? What are builders? And what configuration options are there to help maximize build speeds and cache usage? In this session, we dive into those topics, as well as a few other advanced build topics. You’ll [...] Watch On-Demand Training Simplify Local Development and Testing with Docker and Testcontainers Docker has made building, running, and sharing software easy, how can containers improve testing? Containers make it easier to run dependent services for your application so you can do testing locally. What if we could make container startup, data loading, and cleanup all part of the test scripts so you [...] Watch On-Demand Training All Things Compose Containers are pretty easy to run individually, but most applications require more than one container to run properly. Discover how to create end-to-end environments using Docker Compose. Compose provides easy orchestration of containers to assemble them into a complete application. Compose takes care of all the parameters the containers need [...] Watch On-Demand Training Container Security and Docker Scout Containers often run in secure environments like production. What goes into creating a secure container? Both how the image is built and how it is executed as a container affect the container’s security. The container security and Docker Scout session covers multiple aspects of security – container users, read only [...] Watch On-Demand Training Docker Intro and Overview Whalecome to Docker! In this introductory session, you’ll start off with the basics – “What is a container?” From there, you will learn and see the power of containers in local development and how Docker’s suite of services bring it all together. You’ll see consistent development environments, integration testing made [...] Watch On-Demand Training Shift Left: Iterate faster with Docker While “shift left” can have many definitions, this talk will focus on moving items from the outer loop (CI pipelines, deploy, etc.) to the inner loop (developer’s workstation) to improve feedback loops and decrease the time to iterate. Docker specifically helps teams by supporting and enhancing developer environments, making integration [...] Watch On-Demand Training Docker and GenAI Dive into the world of GenAI app development, starting with the components of this new stack and how it can easily fit into your existing containerized development workflow. Watch On-Demand Training Docker Best Practices Learn how to bring Docker best practices to your org, team, and individual workflows at any stage of the software development life cycle, across new or existing applications. In this training, we will review the containerization journey and discuss the best practices for each phase of the SDLC, including triage, [...] Watch On-Demand Training Modernizing Applications with Containers Discover the tradeoffs and tactics you can leverage to containerize and modernize your existing monolithic applications In this presentation, we will discuss the benefits and best practices of containers. We will deep dive into the strategies of modernizing monolithic applications and the process of decomposing monoliths into services. Watch On-Demand Training Container Orchestration 101 Discover the basics and value of systems such as Kubernetes, Swarm, ECS, and Nomad in running containerized workloads in production. Watch On-Demand Conference Cloud Expo Asia Join Docker at Cloud Expo Asia 2024 to explore our latest innovations: Docker Build Cloud, Docker Scout, and Testcontainers Cloud. Discover how these tools revolutionize development, enhance security, and boost productivity. Learn how Docker can transform your enterprise and accelerate your success. Register for free! Watch On-Demand Training Using Docker in CI/CD Learn how to reduce dev feedback times and create more reliable testing by building and using containers in CI/CD. Watch On-Demand Webinar GitHub Actions Docker Build Summary: Unlock Insights and Fixes Gain visibility into your Docker builds, even when working with remote processes like GitHub Actions. Discover how Docker Build Summary provides an overview of build information, allowing you to inspect details in Docker Desktop for deeper insights and faster resolutions. Agenda: Overview of GitHub Action Docker Build Summary and Build [...] Watch On-Demand Training Image Deep-Dive and Best Practices An image is a standardized package that includes all of the files, binaries, libraries, and configurations to run a container. Images are structured into layers to promote reuse both in building images and using containers. Understanding build best practices is essential to building images quickly and securely. The image deep [...] Watch On-Demand Webinar How to Proactively Secure Containerized Applications with Docker Scout ​Developers are increasingly exploring new workflows when creating and securing artifacts throughout the software supply chain. But to secure your software supply chain and prevent vulnerability issues — you’ll need the right advantage. Join our webinar to learn about the latest Docker Scout enhancements to help you identify and address [...] Watch On-Demand Webinar Streamlining Administration with Docker Core Business Get the latest on new investments coming to Docker Core Business! We’ll explore how these new features support centralized administration and simplify license management, onboarding, and app configurations. You’ll also learn how to gain valuable insights into your organization’s productivity and Docker Desktop usage. Agenda: Investment/vision for enterprise administration offerings [...] Watch On-Demand Webinar Mastering Docker Debugging with CLI Techniques ​While containers bring great value with their isolated and portable environments, they also introduce unique challenges when it comes to debugging or troubleshooting applications. In this session, we’ll discuss a variety of debugging techniques, from the basic usage of `docker exec` to the newly released capabilities of Docker Debug. Agenda: [...] Watch On-Demand Conference Microsoft Build At Docker, we are committed to streamlining the application development lifecycle for developers, teams, and businesses by integrating the reliability and power of Docker’s products with Microsoft’s cloud and development ecosystems. Our presence at Microsoft Build showcases our dedication to providing developers and organizations with the flexibility to enhance productivity, accelerate innovation, secure applications, and […] Watch On-Demand Webinar Fast Track Your Development with Docker and Testcontainers ​Have your development projects been inconsistent lately? Join this webinar to learn how containers can simplify running your application’s external dependencies. By coupling Docker and Testcontainers, you’ll fast track your projects with consistency and reliability. In this webinar, you’ll learn: Various ways these services can be defined, including a declarative [...] Watch On-Demand Training Accelerating Development with Docker Are you a developer and want to get started with containers? You’ve come to the right place! In this recorded session, we’ll walk through how to use Docker Desktop to help you create your first containerized application. With the help of other Docker tools, you’ll also learn how to: Create [...] Watch On-Demand Webinar The Total Economic Impact™ of Docker Business: A Conversation with our CRO Dive into the Total Economic Impact™ of Docker Business with Javier Molina, Docker’s Chief Revenue Officer, and guest speaker, Anna Orbán-Imreh from Forrester. Discover how a composite organization, representative of interviewed customers with experience using Docker, turbocharged developer velocity, tripled their speed to market, slashed costs, and managed risk with [...] Watch On-Demand Training Docker Admin: Set Up Your Org for Success In this recorded session, we’ll help you hit the ground running with the essentials to set up your Docker admin organization. You’ll also learn best practices on how to: Manage your team’s security settings without limiting developer productivity Configure SSO and SCIM This training module was recorded live with a [...] Watch On-Demand Webinar Address Security Issues Before They Hit Production with Docker Scout Learn how Docker Scout generates signals across the software supply chain to help inform improved development workflows. With Scout, developers are guided by contextual recommendations right where they work and can leverage data collected from a wide range of integrations. In this webinar, we’ll cover how to: Analyze and compare [...] Watch On-Demand Webinar How IKEA Retail Leverages Docker and Kubernetes to Revolutionize Machine Learning Deployments Join the IKEA Retail team for an engaging webinar uncovering the complexities of their end-to-end MLOps journey, covering platform development, monitoring, and management. We’ll delve into the core of IKEA’s AI/ML deployment with Docker as they share the pivotal role it plays in their MLOps platform. You’ll gain valuable, practical [...] Watch On-Demand Webinar Innovate or Imitate: The Crossroads of AI Development The rise of AI has had major impacts on business investments. Now, many companies are at a pivotal point asking: should you buy or rent your AI? Creating your own AI engine allows for innovation, customization, and greater control. But building and training AI models requires significant investments in GPU [...] Watch On-Demand Webinar Docker Build Cloud: Reclaim Your Dev Time with Fast, Multi-Architecture Builds Docker Build Cloud is now in general availability! Join Docker’s Michael Irwin and Chris Crone to learn how offloading heavy builds to the cloud reduces wait time and simplifies multi-architecture builds. In this webinar, we’ll cover: Choosing the right build: local or cloud? A live demo of Docker Build Cloud [...] Watch On-Demand Webinar Docker Fundamentals: Get the Most Out of Docker Join us for a Docker fundamentals session to help you get the most out of Docker! Whether you want to optimize your existing usage, refresh your team’s knowledge, or kickstart usage of Docker tools, this session is for you. Learn how Docker can help you save time and optimize your [...] Watch On-Demand Webinar Build for Integrity and Reliability within the Software Supply Chain Watch this session to learn how the Docker Software Supply Chain acts as a system of record for your software development lifecycle, enabling DevOps and Security teams to collaborate across shared workflows. Analyze and compare images to improve your application security posture Identify real-time recommendations for remediation paths within your [...] Watch On-Demand Webinar Docker Scout: Open for general availability Docker Scout is now available in General Availability! Follow along as we dive into new features such as Docker Scout Policy Evaluation as well as security integrations with Amazon ECR or JFrog Artifactory, and more. We’ll also cover Docker Trusted Content and how it can help your organization mitigate security [...] Watch On-Demand Webinar Unlocking the power of using Docker & Kubernetes together for faster and more secure deployments Docker and Kubernetes can help you deploy faster and more securely than ever. Learn more in this webinar from the Cloud Architecture Virtual Summit. Watch On-Demand Webinar What Docker Can Do For Your Business Are you ready to learn from our Docker 101 webinar and embark on a journey into the world of containerization? We'll demystify Docker while introducing you to the basics of container technology and how you can apply this to your business. Watch On-Demand Webinar Cracking the Code to Productivity With a Container-First Approach Learn how your business can significantly cut costs and deliver solutions faster in this webinar covering the advantages of container-first development. Watch On-Demand Find a Local Meetup Attend one of the 200+ Docker Meetups around the globe. Attend a meetup"
