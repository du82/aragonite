["https://docker.io/community/captains"]
title = "Captains Program | Docker"
description = "Do you have a passion for the Docker community and love sharing knowledge with others? Apply today to become a Docker Captain!"
full_description = "Docker Captains Program Help steer Docker into the future We’re on the lookout for passionate developers who love our community just as much as we do. Join the Docker Captains Program About the program Find your Captain About the program What it means to be a Docker Captain Docker Captains are technical experts and passionate community builders who drive Docker’s ecosystem forward. As active contributors and advocates, they share Docker knowledge and help shape Docker products. Program perks Benefits of being a Captain Becoming a Captain opens up opportunities for career growth, networking, and professional development. Our Captains have a direct line to Docker, get beta access to products, receive Docker swag, enjoy community support, and much more. Visibility and recognition Stand out as a Docker expert. Join exclusive events, access Docker customers, and seize networking and career opportunities. Beta access Get your hands on beta versions of Docker products and influence their development. Create unique content before anyone else. Connection with Docker staff Directly interact with Docker staff, ask questions, provide feedback, and gain insider insights. Docker swag and discounts Receive exclusive Docker swag, special access, and discounts on Docker Pro and partner products. Community support Join a private Slack channel to connect with other Docker Captains and staff, share ideas, and solve technical issues. Annual Captains offsites Be a part of annual events with Docker Captains and staff. Discuss Docker developments and collaborate on projects. Education budget Enhance your knowledge and expertise with Docker-related training or courses, covered by an education budget for Captains. Eligibility criteria How to become a Docker Captain Must be 18+ Show technical expertise in Docker and related technologies Demonstrate active community involvement and thought leadership Provide valuable feedback and ideas for Docker’s products and features Possess a strong online presence with a significant audience or following Have a history of significant contributions to the Docker community Abide by the Docker Community Code of ConductNote: This program is open internationally. Application requirements What you need to apply In addition to the eligibility criteria, Captain applicants should fit into at least one of the following categories: Docker Advisor Be endorsed by a member from the Docker engineering or product team, highlighting your proficiency in Docker technologies. Criteria: A recommendation from a Docker team member. Docker Thought Leader Demonstrate your influence online, showcasing leadership in the Docker realm. Criteria: At least 5,000 monthly views across blogs, social media, or other online avenues. Docker Community Contributor Show significant contributions to the Docker community through content creation, event participation, or open-source engagements. Criteria: 5+ years of experience in community leadership or aiding individuals online. Special exceptions Sail the extra mile Even if you don’t meet all the criteria, you might still be called for an interview if: You fit multiple categories A Docker member or Captain vouches for you You are part of an underrepresented group You’re located in a geographical region of particular interest Your application is innovative, and you show genuine enthusiasm Renewal Process Looking to renew your Captain status? Docker Captains enjoy a term of one year. To qualify for renewal, Captains need to persistently meet their joining criteria and continuously contribute to the Docker community. Renewals are evaluated by Docker at the end of each term. Our Captains Search Search Expertise Select Al/ML (39) CI/CD (127) Developer productivity (133) Kubernetes (113) Modern Application Development (118) Observability (83) Software Secure Supply Chain (66) Tech trends (AI, Blockchain, Web3, etc) (26) WebAssembly (10) Location Select Argentina (1) Australia (4) Austria (1)