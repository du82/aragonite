["https://docker.io/resources/the-warehouse-group"]
title = "Case Study: The Warehouse Group and Docker | Docker"
description = "The Warehouse Group adopted Docker for its proven ability to simplify and accelerate application building, testing, and deployment."
full_description = "About company: The Warehouse Group (The Group) is New Zealand's largest retail chain. Industry: Retail Company size: 12,000+ employees Location: New Zealand Product: Retail The Warehouse Group (The Group) regularly reviews risks that could hinder business growth. One risk was outdated IT infrastructure constraining their digital transformation pace. To transform development and deployment, The Group adopted Docker containerization for its proven ability to simplify and accelerate the application building, testing, and deployment. The Warehouse Group (The Group) is New Zealand’s largest retail chain, employing more than 12,000 people and generating NZ$3.3 billion (US$2 billion) in annual revenue. The Group operates more than 300 stores under brands such as The Warehouse, Warehouse Stationery, Noel Leeming, and Torpedo7. The Group also runs TheMarket, an online marketplace for local businesses. The Group previously struggled with traditional development practices involving long setup times, inconsistent environments, and slow deployment cycles. The lack of standardization and automation hindered collaboration between developers and operations teams, causing delays in delivering new features and bug fixes. The Group required a solution for a DevOps culture focused on continuous integration and deployment. Previously, VMware virtualization was the default for application deployment, resulting in developers waiting weeks for environments. Matt Law, The Group’s Chapter Lead of DevOps, recalls it being incredibly slow, proving the need to provide more autonomy through faster setup times. Slow and disjointed systems were holding back The Group from innovating at the pace needed to keep up with industry changes. In 2016, The Group started working with Docker. The Group’s decision to adopt containerization technology was driven by its ability to ensure uniform environments, eradicate deployment impediments, and enable developers to conduct local testing. The organization strived to establish a streamlined and flexible development environment by transitioning from virtual machines to Docker containers."
