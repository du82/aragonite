["https://docker.io/company/newsroom/media-resources"]
title = "Logo, Icon, and Brand Guidelines | Docker"
description = "Share the magic with our curated Docker logo and icon kit along with its guidelines for use. For inquiries about Docker branding, reach out to our press team!"
full_description = "Docker Brand Guidelines Share the magic with our curated Docker logo kit and its guidelines for use. Download Logos Logos The primary logo is made up of two elements: the symbol and the wordmark. The symbol is available as a secondary logo or icon and should be used in place of the retired, vertical design. Colors The Docker logos must always appear as one of Docker’s primary brand colors. This includes our Moby Blue, Light Blue, Dark Blue, Off Black, and White. Primary Moby Blue #1D63EDRGBA(29,99,237,1) Accent Dark Blue #00084DRGBA(0,8,77,1) Accent Light Blue #E5F2FCRGBA(229,242,252,1) Accent Off Black #17191ERGBA(23,25,30,1) Scale To retain legibility and integrity, the primary and secondary Docker logos should be at least 48px. The primary logo is made up of two elements: the symbol and the wordmark. The symbol is available as a secondary logo or icon and should be used in place of the retired, vertical design. Clear space To ensure that our logo is clearly visible in all applications, surround them with sufficient clear space. The primary logo is made up of two elements: the symbol and the wordmark. The symbol is available as a secondary logo or icon and should be used in place of the retired, vertical design. Logo dont’s To maintain consistency, the Docker logo should only be used as suggested. Below are a handful of examples of what not to do when using the logo. Don't flip Don’t tilt Don’t squeeze Don’t stretch Don’t decolorize Don’t use unapproved logo colors Don’t crop Don’t use the wordmark alone Don’t reverse the icon and wordmark Don’t change the spacing Don’t change the proportions Questions? Visit our legal trademark guidelines for more information. For any further inquiries about our branding, please reach out to us at press@docker.com. Trademark Guidelines"
