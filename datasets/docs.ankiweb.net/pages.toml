["https://docs.ankiweb.net/editing.html"]
title = "Adding/Editing - Anki Manual"
description = "Anki's user manual. Anki is a flashcard program that makes learning easier."
full_description = '''Adding/Editing Adding Cards and Notes Duplicate Check Effective Learning Adding a Note Type Customizing Fields Changing Deck / Note Type Organizing Content Using Decks Appropriately Using Tags Using Flags The "Marked" Tag Using Fields Custom Study and Filtered Decks Editing Features Cloze Deletion Image Occlusion Adding an image Adding IO cards Editing IO notes Inputting Non-Latin Characters and Accents Adding international keyboard layouts Adding keyboard layouts for specific languages Right-to-left Languages Limitations Unicode Normalization Adding Cards and Notes Recall from the basics that in Anki we add notes rather than cards, and Anki creates cards for us. Click 'Add' in the main window, and the Add Notes window will appear. The top left of the window shows us the current note type. If it does not say "Basic," then you may have added some note types when you downloaded a shared deck. The text below assumes that "Basic" is selected. The top right of the window shows us the deck cards will be added to. If you would like to add cards to a new deck, you can click on the deck name button and then click "Add". Below the note type, you'll see some buttons, and an area labelled "Front" and "Back". Front and Back are called fields, and you can add, remove, and rename them by clicking the "Fields…​" button above. Below the fields is another area labelled "tags". Tags are labels that you can attach to your notes, to make organizing and finding notes easier. You can leave the tags blank if you wish, or add one or more of them. Tags are separated by a space. If the tags area says vocab check_with_tutor …​then the note you add would have two tags. When you have entered text into the front and back, you can click the "Add" button or press Ctrl+Enter (Command+Enter on a Mac) to add the note to your collection. When you do so, a card will be created as well, and placed into the deck you chose. If you would like to edit a card you added, you can click the history button to search for a recently added card in the browser. For more information on the buttons between the note type and the fields, please see the editor section. Duplicate Check Anki checks the first field for uniqueness, so it will warn you if you enter two cards with a Front field of "apple" (for example). The uniqueness check is limited to the current note type, so if you're studying multiple languages, two cards with the same Front would not be listed as duplicates as long as you had a different note type for each language. Anki does not check for duplicates in other fields automatically for efficiency reasons, but the browser has a "Find Duplicates" function, which you can run periodically. Effective Learning Different people like to review in different ways, but there are some general concepts to keep in mind. An excellent introduction is this article on the SuperMemo site. In particular: Keep it simple: The shorter your cards, the easier they are to review. You may be tempted to include lots of information "just in case," but reviews will quickly become painful. Don't memorize without understanding: If you are studying a language, try to avoid large lists of words. The best way to learn languages is in context, which means seeing those words used in a sentence. Likewise, imagine you're studying a computer course. If you attempt to memorize the mountain of acronyms, you'll find it very difficult to make progress. But if you take the time to understand the concepts behind the acronyms, learning the acronyms will become a lot easier. Adding a Note Type While basic note types are sufficient for simple cards with only a word or phrase on each side, as soon as you find yourself wanting to include more than one piece of information on the front or back, it's better to split that information up into more fields. You may find yourself thinking "but I only want one card, so why can't I just include the audio, a picture, a hint, and the translation in the Front field?" If you'd prefer to do that, that's fine. But the disadvantage of that approach is that all the information is stuck together. If you wanted to sort your cards by the hint, you wouldn't be able to do that as it is mixed in with the other content. You also wouldn't be able to do things such as moving the audio from the front to the back, except by laboriously copying and pasting it for every note. By keeping content in separate fields, you make it much easier to adjust the layout of your cards in the future. To create a new type of note, choose Tools → Manage Note Types from the main Anki window. Then click "Add" to add a new type of note. You will now see another screen that gives you a choice of note types to base the new type on. "Add" means to base the newly created type on one that comes with Anki. "Clone" means to base the newly created type on one that is already in your collection. For instance, if you'd created a French vocab type already, you might want to clone that when creating a German vocab type. After choosing OK, you will be asked to name the new type. The subject material that you are studying is a good choice here – things like "Japanese", "Trivia", and so on. Once you have chosen a name, close the Note Types window, and you will return to the adding window. Customizing Fields To customize fields, click the "Fields…​" button when adding or editing a note, or while the note type is selected in the Manage Note Types window. You can add, remove, or rename fields by clicking the appropriate buttons. To change the order in which the fields appear in this dialog and the add notes dialog, you can use the reposition button, which asks for the numerical position you want the field to have. So if you want to change a field to be the new first field, enter "1". Alternatively you can also drag and drop the field names to re-order them. To do that, use your mouse or finger to drag the field to the desired position. An indicator will show you where the field will be moved to. Do not use 'Tags', 'Type', 'Deck', 'Card', or 'FrontSide' as field names, as they are special fields and will not work properly. The options at the bottom of the screen allow you to edit various properties of the fields to be used when adding and editing the cards. This is not where you customize what appears on your cards when reviewing; for that, please see templates. Editing Font allows you to customize the font and size used when editing notes. This is useful if you want to make unimportant information smaller, or increase the size of non-Latin characters which are hard to read. The changes you make here do not affect how cards appear when reviewing: to do that, please see the templates section. If you have enabled the "type in the answer" function, however, the text you type will use the font size defined here. (For information about how to change the actual font face when typing the answer, please see the checking your answer section.) Sort by this field…​ tells Anki to show this field in the Sort Field column of the browser. You can use this to sort cards by that field. Only one field can be the sort field at once. Reverse text direction is useful if you are studying languages that display text from right to left (RTL), such as Arabic or Hebrew. This setting currently only controls editing; to make sure the text displays correctly during review, you'll need to adjust your template. Use HTML editor by default is useful if you prefer to edit the fields directly in HTML. Collapse by default. Fields can be collapsed/expanded. The animation can be disabled in the preferences. Exclude from unqualified searches (slower) can be used if you want the content of a certain field not to appear in unqualified (not limited to a specific field) searches. After you have added fields, you will probably want to add them to the front or back of your cards. For more information on that, please see the templates section. Changing Deck / Note Type While adding, you can click on the top left button to change note type, and the top right button to change deck. The window that opens up will not only allow you to select a deck or note type, but also to add new decks or manage your note types. Organizing Content Using Decks Appropriately Decks are designed to divide your content up into broad categories that you wish to study separately, such as English, Geography, and so on. You may be tempted to create lots of little decks to keep your content organized, such as "my geography book chapter 1", or "food verbs", but this is not recommended, for the following reasons: Lots of little decks may mean you end up seeing cards in a recognizable order. On older scheduler versions, new cards can only be introduced in deck order. And if you were planning to click on each deck in turn (which is slow), you will end up seeing all the "chapter 1" or "food verb" reviews together. This makes it easier to answer the cards, as you can guess them from the context, which leads to weaker memories. When you need to recall the word or phrase outside Anki, you won't always have the luxury of being shown related content first! While less of a problem than it was in earlier Anki versions, adding hundreds of decks may cause slowdowns, and very large deck trees with thousands of items can actually break the display of the deck list in Anki versions before 2.1.50. Using Tags Instead of creating lots of little decks, it's a better idea to use tags and/or fields to classify your content. Tags are a useful way to boost search results, find specific content, and keep your collection organized. There are many ways of using tags and flags effectively, and thinking in advance about how you want to use them will help you decide what will work best for you. Some people prefer using decks and subdecks to keep their cards organized, but using tags have a big advantage over decks for that: you can add several tags to a single note, but a single card can only belong to one deck, which makes tags a more powerful and flexible categorization system than decks in most cases. You can also organize tags in trees in the same way as you can do for decks. For example, instead of creating a "food verbs" deck, you could add those cards to your main language study deck, and tag the cards with "food" and "verb". Since each card can have multiple tags, you can do things like search for all verbs, or all food-related vocabulary, or all verbs that are related to food. You can add tags from the Edit window and from the Browser, and you can also add, delete, rename, or organize tags there. Please note that tags work at note level, which means that when you tag a card that has siblings, all the siblings will be tagged as well. If you need to tag a single card, but not its siblings, you should consider using flags instead. Using Flags Flags are similar to tags, but they will appear during study in the review window, showing a colored flag icon on the upper right area of the screen. You can also search for flagged cards in the Browse screen, rename flags from the browser and create filtered decks from flagged cards, but unlike tags, a single card can have only one flag at a time. Another important difference is that flags work at card level, so flagging a card that has siblings won't have any effect on the card's siblings. You can flag / unflag cards directly while in review mode (by pressing CTRL + 1-7 on Windows or CMD + 1-7 on Mac) and from the Browser. The "Marked" Tag Anki treats a tag called "marked" specially. There are options in the review screen and browse screen to add and remove the "marked" tag. The review screen will show a star when the current card's note has that tag. And cards are shown in a different color in the browse screen when their note is marked. Note: Marking is mainly left around for compatibility with older Anki versions; most users will want to use flags instead. Using Fields For those who like to stay very organized, you can add fields to your notes to classify your content, such as "book", "page", and so on. Anki supports searching in specific fields, which means you can do a search for "book:my book" page:63 and immediately find what you're looking for. Custom Study and Filtered Decks Using custom study and filtered deck you can create temporary decks out of search terms. This allows you to review your content mixed together in a single deck most of the time (for optimum memory), but also create temporary decks when you need to focus on particular material, such as before a test. The general rule is that if you always want to be able to study some content separately, it should be in a normal deck; if you only occasionally need to be able to study it separately (for a test, when under a backlog, etc.), then filtered decks created from tags, flags, marks or fields are better. Editing Features The editor is shown when adding notes, editing a note during reviews, or browsing. On the top left are two buttons, which open the fields and cards windows. On the right are buttons that control formatting. Bold, italic and underline work like they do in a word processing program. The next two buttons allow you to subscript or superscript text, which is useful for chemical compounds like H2O or simple mathematical equations like x2. Then, there are two buttons to allow you to change text colour. The rubber eraser button clears any formatting in the currently selected text — including the colour of the text, whether the selected text is bold, etc. The next three buttons allow creating lists, text alignment and text indent. You can use the paper-clip button to select audio, images, and videos from your computer's hard drive and attach them to your notes. Alternatively, you can copy the media onto your computer's clipboard (for instance, by right-clicking an image on the web and choosing 'Copy Image') and paste it into the field that you want to place it in. For more information about media, please see the media section. The microphone icon allows you to record from your computer's microphone and attach the recording to the note. The Fx button shows shortcuts to add MathJax or LaTeX to your notes. The […​] buttons are visible when a cloze note type is selected. The </> button allows editing the underlying HTML of a field. Anki 2.1.45+ supports adjusting sticky fields directly from the editing screen. If you click on the pin icon on the right of a field, Anki will not clear out the field's content after a note is added. If you find yourself entering the same content into multiple notes, you may find this useful. On previous Anki versions, sticky fields were toggled from the Fields screen. Most of the buttons have shortcut keys. You can hover the mouse cursor over a button to see its shortcut. When pasting text, Anki will keep most formatting by default. If you hold down the Shift key while pasting, Anki will strip most of the formatting. Under Preferences, you can toggle "Paste without shift ke'''
