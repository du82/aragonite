["https://docs.ankiweb.net/deck-options.html"]
title = "Deck Options - Anki Manual"
description = "Anki's user manual. Anki is a flashcard program that makes learning easier."
full_description = '''Deck Options Presets Subdecks Daily Limits New Cards/Day Maximum Reviews/Day Per-Deck Daily Limits New Cards Ignore Review Limit Limits Start From The Top New Cards Learning Steps Day Boundaries Graduating Interval Easy Interval Insertion Order Lapses Relearning Steps Minimum Interval Leeches Display Order New Card Gather Order New Card Sort Order New/Review Order Interday Learning/Review Order Review Sort Order Burying Audio Timers Internal Timer On-screen Timer Auto Advance Easy Days FSRS A Short Guide Desired Retention FSRS Parameters Reschedule Cards on Change Compute Minimum Recommended Retention The Simulator Learning and Relearning Steps Add-On Compatibility More Advanced Maximum Interval Historical Retention Ignore Cards Reviews Before Starting Ease Easy Bonus Interval Modifier Hard Interval New Interval Custom Scheduling Deck options primarily control the way Anki schedules cards. It is recommended that you spend a few weeks with the defaults to get a feel for how Anki works before you start adjusting the options. Please make sure you understand the options before changing them, as mistakes can reduce Anki's effectiveness. On your computer, do any of the following to open deck options: Click the gear icon on the Decks screen. Select a deck on the Decks screen, and then click Options at the bottom of the screen. Click More > Options while in review mode. Press O while in review mode. Here are some community posts about deck options that have been contributed in the past: Deck Options Explained Deck Options in a Mental Map Presets Anki allows you to share options between different decks, to make it easier to update options in many decks at once. To do this, options are grouped into presets. If you change an option in a preset, the change is applied to all decks that use the same preset. All newly created decks use the "Default" preset. To change the options in one deck but not other decks, click the arrow icon in the top right of the Deck Options window. You can do the following: Save: Save all modifications you've made in deck options. Add Preset: Add a new preset for this deck, with the default options. Clone: Clone your current preset, which is useful if you want to modify some of the options but keep the rest as they are. Rename: Change the name of the current preset. Delete: Delete the current preset. This will make your next sync a one-way sync. Save to All Subdecks: Like Save, but also assigns the selected preset to all subdecks of the currently selected deck. Optimize All Presets: When FSRS is enabled, this allows you to optimize the parameters of all presets at once. Deck options are not retroactive. For example, if you change an option that controls the delay after failing a card, cards that you failed before changing this option will still have the old delay, not the new one. Subdecks If your deck has subdecks, and you wish one or more subdecks to have different settings to the parent decks, you can assign those subdecks to different presets. When Anki shows a card, it will check which subdeck the card is in, and use the options for that deck. There are two exceptions: The New cards/day and Maximum reviews/day limits of a subdeck affect the number of cards that can be gathered from that subdeck. But the total number of cards you see during your study session is controlled by the limits of the deck you select to study. The display order options are taken from the deck you select to study, not the deck of the current card. For example, let's say you have this collection: - Deck A (Preset 1) - Deck A::Subdeck B (Preset 2) Preset 1 and Preset 2 are identical, with two exceptions: Preset 1: Learning steps: 1m 10m New/review order: Mix with reviews Preset 2: Learning steps: 20m 2h New/review order: Show after reviews If you choose to study Subdeck B: Learning steps for all new cards will be 20m 2h (Preset 2 applies). All new cards will be shown after reviews (Preset 2 applies). If you choose to study Deck A: Learning steps for new cards in Deck A will be 1m 10m (Preset 1 applies). Learning steps for new cards in Subdeck B will be 20m 2h (Preset 2 applies). All new cards will be mixed with reviews (Preset 1 applies). Daily Limits New Cards/Day This option controls how many new cards can be introduced each day you open the program. If you study fewer than the limit, or miss a day, the next day the counts will be back to their original setting: you won't be given more cards than your limit allows. When studying a deck that has subdecks inside it, the limits set on each subdeck control the maximum number of cards drawn from that particular deck. The selected deck's limits control the total number of cards that will be shown. For earlier versions, see this FAQ page. Studying new cards will temporarily increase the number of reviews you need to do a day, as newly-learnt material needs to be repeated a number of times before the delay between repetitions can increase appreciably. If you are consistently learning 20 new cards a day, you can expect your daily reviews to be roughly about 200 cards/day. You can decrease the reviews required by introducing fewer new cards each day until your review burden decreases. More than one Anki user has excitedly studied hundreds of new cards over their first few days of using the program, and then has become overwhelmed by the reviews required. Maximum Reviews/Day Allows you to set an upper limit on the number of review cards to show each day. When this limit is reached, Anki will not show any more review cards for the day, even if there are more waiting. If you study consistently, this setting can help to smooth out occasional peaks in due card counts, and can save you from a heart attack when returning to Anki after taking a week off. When reviews have been hidden due to this option, a message will appear in the congratulations screen, suggesting you consider increasing the limit if you have time. When studying a deck that has subdecks inside it, the review limit behaves similarly to the new card limit. Anki includes any learning cards that have crossed the day boundary (interday learning cards) in the review count, so those learning cards will be subject to the review limit. Per-Deck Daily Limits It is possible to use the same preset for different decks, with customized limits for each of them. This eliminates the need to create cloned presets just for that purpose, and makes it easier to set custom limits on subdecks. Anki provides three options for daily limits: Preset: applies to all the decks using a preset. This deck: specific to a particular deck. Today only: specific to a particular deck, and temporary. New Cards Ignore Review Limit By default, the review limit also applies to new cards, and no new cards will be shown when the review limit has been reached. If this option is enabled, new cards will be shown regardless of the review limit. If you have a backlog of overdue review cards, it is recommended that you stop introducing new cards until you catch up with that backlog. Continuing to introduce new cards when you're already behind can make the backlog worse. Limits Start From The Top By default, the daily limits of a higher-level deck do not apply if you select one of its subdecks. A parent deck can have a new card limit of 10 cards/day and its subdecks can have a new card limit of 20 cards/day. The limits set on parent deck do not affect the number of new cards you can study from its subdeck. When this option is enabled, the limits set on higher-level decks also apply to their subdecks when a subdeck is selected. In the previous example, you will be able to study only 10 new cards from the subdecks instead of 20 new cards. This option can be useful if you wish to study individual subdecks, while enforcing a total limit on cards all the subdecks. New Cards The options here only affect new cards and learning cards. Once a card has graduated (that is, gone through all the learning steps), the options in this section no longer apply to the card. Learning Steps Controls the number of learning repetitions, and the delay between them. One or more delays, separated by spaces must be entered. Each time you click Good during review, the card moves to the next step. Each time you click Again, the card goes back to the first step. For example, let's say that your learning steps are 1m 10m 1d. When you click Again, the card goes through the first step, and is shown again 1 minute later. When you click Good on a new card or after the 1 minute step, it moves to the next step, and is shown again in 10 minutes. When you click Good on a card after the 10 minute step, it is delayed until the next day. When you click Good on the card the next day, it graduates and becomes a review card. The card is shown again after the delay configured by the graduating interval. The Hard button works differently depending on which step you're on. When you're on the first step, the Hard button shows a delay of 6m. The 6m delay is the average of first two steps: 2m 10m. Exception: When there's only one learning step, Hard button shows a delay 1.5 times that step. This delay is at most 1 day longer than the learning step. When you're on any other step, the Hard button repeats that step. If there’s nothing else to study, Anki will show learning cards up to 20 minutes early by default. To turn this off or change the amount of time to look ahead, see Preferences. Day Boundaries Anki treats small steps and steps that cross a day boundary differently. With small steps, the cards are shown as soon as the delay has passed, in preference to review cards and new cards. This is done so that you can answer the card as closely to your requested delay as possible. In contrast, if the step crosses a day boundary, the delay is automatically converted to days. For example, if next day starts after 5 hours and the delay is 6 hours, Anki converts the delay to 1 day. Graduating Interval The number of days to wait before showing a card again, after the Good button is used on the final learning step. This means that it is the first interval after the learning card graduates. Please see the example from earlier in this section. Easy Interval The number of days to wait before showing a card again, after the Easy button is used on it. The Easy button turns learning cards into a review cards regardless of which step you're on, and assigns them the delay you have configured in this option. Easy interval should always be at least as long as the graduating interval, and typically a few days longer. Insertion Order Controls whether Anki should add new cards into the deck randomly, or sequentially. When you change this option, Anki will re-sort the decks in the current preset. On recent Anki versions, you should leave this option set to Sequential, and adjust the display order instead. Lapses When you click Again on a review card, it is called a lapse. The options listed here affect such lapsed cards. Relearning Steps The same as learning steps, but for lapsed cards. When you fail a review card (press Again), the card goes through relearning steps, before it becomes a review card again. If you leave the steps blank, the card will skip relearning, and will be assigned a new interval of 1 day by default. Minimum Interval Specifies a minimum number of days a card should wait after it finishes relearning. The default is one day, meaning once relearning is finished, it will be shown again the next day. Leeches Control the way Anki handles leeches. For details, see the leeches section. Display Order The options in this section are taken from the deck you select to study, not the deck of the currently displayed card. Some further information about display order is available in the studying section. New Card Gather Order Controls how Anki gathers new cards from a deck. The options are: Deck: Gathers cards from each subdeck in order, starting from the top. Cards from each subdeck are gathered in ascending position. If the daily limit of the selected deck is reached, gathering may stop before all subdecks have been checked. This order is fastest in large collections, and allows you to prioritize subdecks that are closer to the top. Decks/subdecks are always ordered alphabetically, so you can give them a numeric prefix like 001 to control the order they appear in. You can also use _ and ~ as a prefix to place items at the top or bottom. Although position order depends initially on the insertion order option, you can manually reposition cards in different ways. Deck, then random notes: Gathers cards from each subdeck in order, starting from the top. Cards from each subdeck are gathered from randomly selected notes. Ascending position: Gathers cards by ascending position (due #), which is typically the oldest-added first. Descending position: Gathers cards by descending position (due #), which is typically the latest-added first. Random notes: Gathers cards from randomly selected notes. Random cards: Gathers cards in a random order. New Card Sort Order Controls how the new cards are sorted after they have been gathered. The options are: Card type, then order gathered: Shows cards in order of card type number. Cards of each card type number are shown in the order they were gathered. If you have sibling burying disabled, this ensures all front→back cards are seen before any back→front cards. This order is useful if you don't want sibling cards to appear too close to each other. Order gathered: Shows cards exactly as they were gathered. If sibling burying is disabled, this typically results in all sibling cards appearing one after the other. Card type, then random: Shows cards in order of card type number, but shuffles the cards of each card type number. This order is useful if you don't want sibling cards to appear too close to each other, but still want the cards to appear in a random order. Random note, then card type: Picks notes at random, then shows all of their siblings in order. Random: Fully shuffles the gathered cards. New/Review Order Whether new cards should be mixed in with review cards, shown before them, or shown after them. Interday Learning/Review Order Whether (re)learning cards that cross a day boundary should be mixed in with review cards, shown before them, or shown after them. Because learning cards tend to be harder than review cards, some users prefer to see them at the end (getting the easy stuff done first), or at the start (allowing more time to review forgotten ones). Review Sort Order Controls how the review cards are sorted. The options are: Due date, then random: The default order prioritizes cards that have been waiting longer, and it's the recommended order when you are up to date, or when you only have a small backlog. If you have taken an extended break or have fallen behind in your reviews, you may want to consider changing the sort order temporarily. Due date, then deck: This also prioritizes cards th'''
