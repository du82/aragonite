["https://docs.ankiweb.net/print.html"]
title = "Anki Manual"
description = "Anki's user manual. Anki is a flashcard program that makes learning easier."
full_description = '''Introduction Quickstart In a hurry? Jump straight to Getting Started. Getting Help Looking for help? Please see Getting Help. Translations Volunteers have contributed translations of this manual. The translations may not always be up to date. Bahasa Indonesia Deutsch Español Français Italiano Polski Português Brasileiro русский язык Українська العربية فارسى 日本語 简体中文 If you would like to help translate the manual into a different language, please see the translation docs. Legacy Documentation Not on the latest version of Anki? Find archives of this manual at the Internet Archive. For information on old scheduler versions, see this FAQ. Background Active Recall Testing Use It or Lose It Spaced Repetition Why Anki? Anki is a program which makes remembering things easy. Because it is a lot more efficient than traditional study methods, you can either greatly decrease your time spent studying, or greatly increase the amount you learn. Anyone who needs to remember things in their daily life can benefit from Anki. Since it is content-agnostic and supports images, audio, videos and scientific markup, the possibilities are endless. For example: Learning a language Studying for medical and law exams Memorizing names and faces of people Brushing up on geography Mastering long poems Even practising guitar chords! There are two simple concepts behind Anki: active recall testing and spaced repetition. They are not known to most learners, despite being well-documented in scientific literature. Understanding how these concepts work will make you a more effective learner. Active Recall Testing Active recall testing means being asked a question and trying to remember the answer. This is in contrast to passive study, where we read, watch, or listen to something without pausing to consider if we know the answer. Research has shown that active recall testing is far more effective at building strong memories than passive study. There are two reasons for this: The act of recalling something strengthens the memory, increasing the chances we’ll be able to remember it again. When we're unable to answer a question, it tells us we need to return to the material to review or relearn it. You have probably encountered active recall testing in your school years without even realizing it. When good teachers give you a series of questions to answer after reading an article, or make you take weekly tests, they are not doing it simply to see if you understood the material or not. By testing you, they are increasing the chances you will be able to remember the material in the future. A good way to integrate active recall testing into your own studies is to use flashcards. With traditional paper flashcards, you write a question on one side of a card, and the answer on the other side. By not turning the card over until you've recalled the answer, you can learn things more effectively than passive observation allows. Use It or Lose It Our brains are efficient machines, and they rapidly forget information that doesn't seem useful. Chances are that you don't remember what you had for dinner on Monday two weeks ago, because this information is not usually useful. However, if you went to a fantastic restaurant that day and have spent the last two weeks telling people about how great it was, you're likely to still remember it in vivid detail. The brain's "use it or lose it" policy applies to everything we learn. If you spend an afternoon memorizing some science terms, and then don't think about that material for two weeks, you'll probably have forgotten most of it. In fact, studies show we forget about 75% of material learnt within a 48 hour period. This can seem pretty depressing when you need to learn a lot of information! However, the solution is simple: review. By reviewing newly-learnt information, we can greatly reduce forgetting. The only problem is that traditionally, reviewing has not been very practical. If you are using paper flashcards, it's easy to flick through all of them if you only have 30 of them to review, but as the number grows to 300 or 3000, it quickly becomes unmanageable. Spaced Repetition The spacing effect was reported in 1885 by a German psychologist called Hermann Ebbinghaus. He observed that we tend to remember things more effectively, if we spread reviews out over time, instead of studying multiple times in one session. Since the 1930s, there have been a number of proposals for utilizing the spacing effect to improve learning, in what has come to be called spaced repetition. One example was in 1972, when a German scientist called Sebastian Leitner popularized a method of spaced repetition with paper flashcards. By separating the paper cards into a series of boxes, and moving the cards to a different box on each successful or unsuccessful review, it was possible to see at a glance a rough estimate of how well a card was known and when it should be reviewed again. This was a great improvement over a single box of cards, and it has been widely adopted by computerized flashcard software. It is a rather rough approach however, as it cannot give you an exact date on which you should review something again, and it does not work very well with material of varying difficulty. The biggest developments in the last 30 years have come from the authors of SuperMemo, a commercial flashcard program that implements spaced repetition. SuperMemo pioneered the concept of a system that keeps track of the ideal time to review material and optimizes itself based on the performance of the user. In SuperMemo's spaced repetition system, every time you answer a question, you tell the program how well you were able to remember it — whether you forgot completely, made a small mistake, remembered with trouble, remembered easily, etc. The program uses this feedback to decide the optimal time to show you the question again. Because a memory gets stronger each time you successfully recall it, the time between reviews gets longer and longer — so you may see a question for the first time today, then 3 days later, 15 days later, 45 days later, and so on. This was a revolution in learning, as it meant material could be learnt and retained with the absolute minimum amount of effort necessary. SuperMemo's slogan sums it up: with spaced repetition, you can: "forget about forgetting". Why Anki? While there is no denying the huge impact SuperMemo has had on the field, it is not without its problems. The program is often criticized for being buggy and difficult to navigate. It only runs on Windows computers. It is proprietary software, meaning that end-users cannot extend it or access the raw data. And while very old versions have been made available for free, they are quite limited for modern use. Anki addresses these issues. There are free clients for Anki available on many platforms, so struggling students and teachers with budgetary constraints are not left out. Anki is open source, with an already flourishing library of add-ons contributed by end-users. It is multi-platform, running on Windows, macOS, Linux/FreeBSD, and some mobile devices. And it is considerably easier to use than SuperMemo. Anki's spaced repetition system is based on an older version of the SuperMemo algorithm called SM-2. Recently, a new algorithm called FSRS has been integrated as an alternative to the legacy SM-2 algorithm. Platform Notes This section explains the way Anki is installed, and the possible problems you may encounter, depending on your OS: Windows macOS Linux If you have already installed Anki, you can skip to the Getting Started section. Windows Installing & Upgrading Anki on Windows For instructions on how to install or upgrade Anki on Windows, please see: Install & Upgrade Problems If you encounter any issues when installing or starting Anki, please see the subsections in the table of contents. Installing & Upgrading Anki on Windows Requirements Installing Upgrading Add-on Compatibility Problems Requirements Recent Anki releases require a computer running the 64 bit version of Windows 10 or 11. The last Anki release that supported Windows 7 and 8.1 was Anki 2.1.49. The last Anki release that supported 32 bit Windows was Anki 2.1.35-alternate. If you're on an old machine, you can obtain old releases from the releases page. Installing To install Anki: Download Anki from https://apps.ankiweb.net. Save the installer to your desktop or downloads folder. Double-click on the installer to run it. If you see an error message, please see the installation issues page. Once Anki is installed, double-click on the new star icon on your desktop to start Anki. Upgrading If upgrading from Anki 2.1.6+, there is no need to uninstall the previous version first. All you need to do is close Anki if it is open, and then follow the installation steps above. Your cards will be preserved when you upgrade. If upgrading from an Anki version before 2.1.6, or switching from the standard to the alternate version or vice versa, we recommend uninstalling the old version first, which will remove Anki's program data, but not delete your card data. If you wish to downgrade to a previous version, please make sure you downgrade first. Add-on Compatibility Some add-ons may not always work with the latest Anki release. If you upgrade to the latest Anki version and find an add-on you cannot live without stops working, you can download older Anki versions from the releases page. Problems If you encounter any issues when installing or starting Anki, please see the following pages: Installation Issues Startup Issues Display Issues Permission Problems If you encounter any interface issues when using Anki, please see the following pages: Copy and Paste Issues Text Size Issues Windows installation issues Some error messages you may encounter when installing Anki: "Error opening file for writing" Antivirus issues Please also see startup issues. "Error opening file for writing" If closing Anki and your browser does not help, please try restarting your computer, then running the installer again. Antivirus issues Antivirus programs may sometimes report a false positive. Windows startup issues No error, but app does not appear Windows updates Windows 7/8 Video driver issues Multiple displays Antivirus/firewall software Admin access Multiple Anki installations present after updating Debugging If all else fails No error, but app does not appear If you start Anki and it fails to appear, without any error message, you can try the following: Disconnect multiple/external displays. Install the latest Anki version. Adjust your decimal separator, if it is not a period. Install the old 2.1.35-alternate build of Anki. Windows updates When starting Anki, you may receive a message like the following: Error loading Python DLL The program can't start because api-ms-win.... is missing Failed to execute script runanki Failed to execute script pyi_rth_multiprocessing Failed to execute script pyi_rth_win32comgenpy These errors are usually because your computer is missing a Windows update or Windows library. Please open Windows update, and ensure your system has all updates installed. If any needed to be installed, please restart your device after installing. Windows 7/8 On Windows 7/8, you may need to manually install extra updates. Please try: https://www.microsoft.com/en-us/download/details.aspx?id=48234 https://aka.ms/vs/15/release/vc_redist.x64.exe http://www.catalog.update.microsoft.com/Search.aspx?q=kb4474419 http://www.catalog.update.microsoft.com/Search.aspx?q=kb4490628 Video driver issues Please see display issues. Multiple displays If you get a LoadLibrary failed with error 126, this may be caused by the toolkit Anki is built on having trouble with multiple displays. Antivirus/firewall software Third-party software on your machine may prevent Anki from loading. You can try adding an exception for Anki, or temporarily disabling your antivirus/firewall to see if it helps. Admin access Some users have reported that Anki did not run for them until they right-clicked on the Anki icon and chose "Run as administrator". Anki stores all of its data in your user folder, and should not need administrator privileges, but it's something you can try if you've exhausted other options. Multiple Anki installations present after updating If the update process leaves you with multiple Anki installs (such as within C:\Program Files\Anki and C:\Program Files (x86)\Anki), they may be left in a non-working state, and Anki may refuse to start without showing an error message. Try uninstalling all copies of Anki from your computer. To do this, find them in Windows Settings > Apps & features (or Apps > Installed apps) and uninstall, or run uninstall.exe in each Anki program folder. Afterward, install Anki again. Debugging Starting Anki from a terminal may reveal a bit more information about some errors. After installing the latest Anki version and ensuring all Windows updates are installed, instead of running Anki directly, press the Windows key (or open the Start menu), type cmd, and launch Command Prompt. When the terminal window opens, paste the following command, and press Enter. (The path will be different if Anki is installed in a location that is not the default.) %LocalAppData%\Programs\Anki\anki-console.bat Presumably Anki will fail to open like before, but the output in the terminal window may reveal something about what is causing the problem. If all else fails If you are unable to start Anki after trying the above workarounds, you have two remaining options: You can try running from Python. You can try an older Anki version built with an older toolkit, such as 2.1.35-alternate, or 2.1.15. Windows Display Issues Changing the Driver From the Preferences Screen Changing the Driver From the Command Line Full Screen On Windows, there are three ways of content being displayed on screen. The default is software, which is slower, but the most compatible. There are two other options that are faster: OpenGL and ANGLE. They are faster, but they may not work, or may cause display issues such as missing menubars, blank windows, and so on. Which one works best will depend on your computer. Changing the Driver From the Preferences Screen In Anki 23.10+, you can change the graphics driver from preferences screen by navigating to Tools → Preferences and then selecting the driver from the dropdown menu. Changing the Driver From the Command Line If you run into display issues, you can try switching to software mode via cmd: echo software > %APPDATA%\Anki2\gldriver6 Or you can do it via PowerShell: echo software > $env:APPDATA\Anki2\gldriver6 It will not print anything. You can then start Anki again. To revert to the default behaviour, change software to auto, or delete that file. Full Screen Anki 2.1.50+ comes with a full screen mode, but due to various issues, it had to be disabled while OpenGL is used. Turning on software rendering as described above will allow the'''
