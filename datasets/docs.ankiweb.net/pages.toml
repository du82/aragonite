["https://docs.ankiweb.net/platform/windows/installing.html"]
title = "Install & Upgrade - Anki Manual"
description = "Anki's user manual. Anki is a flashcard program that makes learning easier."
full_description = "Installing & Upgrading Anki on Windows Requirements Installing Upgrading Add-on Compatibility Problems Requirements Recent Anki releases require a computer running the 64 bit version of Windows 10 or 11. The last Anki release that supported Windows 7 and 8.1 was Anki 2.1.49. The last Anki release that supported 32 bit Windows was Anki 2.1.35-alternate. If you're on an old machine, you can obtain old releases from the releases page. Installing To install Anki: Download Anki from https://apps.ankiweb.net. Save the installer to your desktop or downloads folder. Double-click on the installer to run it. If you see an error message, please see the installation issues page. Once Anki is installed, double-click on the new star icon on your desktop to start Anki. Upgrading If upgrading from Anki 2.1.6+, there is no need to uninstall the previous version first. All you need to do is close Anki if it is open, and then follow the installation steps above. Your cards will be preserved when you upgrade. If upgrading from an Anki version before 2.1.6, or switching from the standard to the alternate version or vice versa, we recommend uninstalling the old version first, which will remove Anki's program data, but not delete your card data. If you wish to downgrade to a previous version, please make sure you downgrade first. Add-on Compatibility Some add-ons may not always work with the latest Anki release. If you upgrade to the latest Anki version and find an add-on you cannot live without stops working, you can download older Anki versions from the releases page. Problems If you encounter any issues when installing or starting Anki, please see the following pages: Installation Issues Startup Issues Display Issues Permission Problems If you encounter any interface issues when using Anki, please see the following pages: Copy and Paste Issues Text Size Issues"
year_published = 2025
clearnet = "https://docs.ankiweb.net/platform/windows/installing.html"
