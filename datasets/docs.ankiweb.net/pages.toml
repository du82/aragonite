["https://docs.ankiweb.net/platform/mac/installing.html"]
title = "Install & Upgrade - Anki Manual"
description = "Anki's user manual. Anki is a flashcard program that makes learning easier."
full_description = "Installing & Upgrading Anki on macOS Requirements Installing Upgrading Homebrew Add-on Compatibility Problems Requirements macOS version requirements are listed on the download page. If you're on an old machine, you can obtain the old version from the releases page. The Qt5 builds on 24.11 and earlier support macOS 10.14 and later. If your macOS is between 10.10 and 10.13, you'll need to use Anki 2.1.35-alternate. Installing Download Anki from https://apps.ankiweb.net. Save the file to your desktop or downloads folder. Open it, and drag Anki to your Applications folder or desktop. Double-click on Anki in the location you placed it. Upgrading To upgrade, close Anki if it is open, and then follow the steps above. Drag the Anki icon into the same location you previously stored it, and when prompted, overwrite the old version. Your card data will be preserved. Homebrew Homebrew users can install Anki using brew install --cask anki in their preferred Terminal application. Upgrading can be done using brew upgrade, and for uninstalling: brew uninstall --cask anki Add-on Compatibility Some add-ons may not always work with the latest Anki release. If you upgrade to the latest Anki version and find an add-on you cannot live without stops working, you can download older Anki versions from the releases page. Problems If you encounter any issues when installing or starting Anki, please see: Display Issues"
