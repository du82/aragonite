["https://docs.arduino.cc/hardware/motor-shield-rev3"]
title = ""
description = "The Arduino Motor Shield allows your arduino to drive DC and stepper motors, relays and solenoids.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Motor Shield Rev3 Motor Shield Rev3The Arduino Motor Shield allows your arduino to drive DC and stepper motors, relays and solenoids.Get StartedBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Arduino Motor Shield is based on the L298, which is a dual full-bridge driver designed to drive inductive loads such as relays, solenoids, DC and stepping motors. It lets you drive two DC motors with your Arduino board, controlling the speed and direction of each one independently. You can also measure the motor current absorption of each motor, among other features. The shield is TinkerKit compatible, which means you can quickly create projects by plugging TinkerKit modules to the board.Monolithic CircuitAn integrated monolithic circuit designed to drive inductive loads such as DC and Stepper motors.DocumentationConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
