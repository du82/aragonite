["https://docs.arduino.cc/hardware/mkr-1000-wifi"]
title = ""
description = "The Arduino MKR 1000 WiFi is the easiest point of entry to basic IoT and pico-network application design. Whether you are looking at setting up a sensor network for your office or building a smart home, the MKR 1000 WiFi will make that journey easy.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR 1000 WiFi MKR 1000 WiFiEnd of LifeThe Arduino MKR 1000 WiFi is the easiest point of entry to basic IoT and pico-network application design. Whether you are looking at setting up a sensor network for your office or building a smart home, the MKR 1000 WiFi will make that journey easy.Get StartedInteractive ViewerPinoutDownloadable resourcesPinout (PDF)SchematicsFritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR 1000 WiFi is a great choice for any beginner, maker or professional to get started with Internet of Things (IoT). Using the popular Arm® Cortex®-M0 32-bit SAMD21 processor, it also features the and the ECC508 crypto-chip for security. The board is part of the MKR family, where you can choose from a large variety of shields to build projects out of the box with minimal effort!Wi-Fi This Wi-Fi module from Atmel is part of the SmartConnect family, with focus on power consumption and power saving modes.DocumentationlibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
