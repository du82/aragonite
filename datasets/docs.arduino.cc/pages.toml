["https://docs.arduino.cc/hardware/zero"]
title = ""
description = "Arduino Zero is a simple and powerful 32-bit extension of the platform established by the UNO. This board aims to provide a platform for innovative projects in smart IoT devices, wearable technology, high-tech automation, crazy robotics, and much more.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Zero ZeroArduino Zero is a simple and powerful 32-bit extension of the platform established by the UNO. This board aims to provide a platform for innovative projects in smart IoT devices, wearable technology, high-tech automation, crazy robotics, and much more.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe board is powered by Atmel’s SAMD21 MCU, which features a 32-bit ARM Cortex® M0+ core. One of its most important features is Atmel’s Embedded Debugger (EDBG), which provides a full debug interface without the need for additional hardware, significantly increasing the ease-of-use for software debugging. EDBG also supports a virtual COM port that can be used for device and bootloader programming.Embedded DebuggerThe Zero comes with a built-in debugger, which can be used with the Arduino IDE 2 version.DocumentationBattery ConnectorThe Arduino Zero features a barrel plug connector, that works great with a standard 9V battery.Low Power SupportThis board can be optimized to reduce power consumption via the Arduino Low Power library.LibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
