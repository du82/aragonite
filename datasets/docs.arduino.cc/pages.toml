title = ""
description = "Have an idea for a network project? Connect your Arduino to an ethernet shield and you will quickly be able to start sending sensor data to your network to interact with other gadgets in your home.  Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Ethernet Shield Rev2 Ethernet Shield Rev2Have an idea for a network project? Connect your Arduino to an ethernet shield and you will quickly be able to start sending sensor data to your network to interact with other gadgets in your home. Get StartedBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Arduino Ethernet Shield 2 connects your Arduino to the internet in mere minutes. Just plug this module onto your Arduino Board, connect it to your network with an RJ45 cable and follow a few simple steps to start controlling your world through the internet. As always with Arduino, every element of the platform – hardware, software and documentation – is freely available and open-source. This means you can learn exactly how it's made and use its design as the starting point for your own circuits. The shield is TinkerKit compatible, which means you can quickly create projects by plugging TinkerKit modules to the board.Ethernet controllerComes with a W550, an Ethernet controller that provides Internet connection to your devices and systems.DocumentationLibraryMicro SD Card slotThe Arduino Ethernet Shield Rev2 comes with an integrated micro SD card slot, useful for data logging and storing larger files.DocumentationLibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
