["https://docs.arduino.cc/hardware/mkr-vidor-4000"]
title = ""
description = "The Arduino MKR Vidor 4000 is without a doubt the most advanced and featured-packed board in the MKR family, and the only one with a FPGA chip on board. With a camera & HDMI connector, a Wi-Fi® / Bluetooth® module and up to 25 configurable pins, the sky is really the limit with this board.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR Vidor 4000 MKR Vidor 4000The Arduino MKR Vidor 4000 is without a doubt the most advanced and featured-packed board in the MKR family, and the only one with a FPGA chip on board. With a camera & HDMI connector, a Wi-Fi® / Bluetooth® module and up to 25 configurable pins, the sky is really the limit with this board.Get StartedPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsFritzing FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR VIDOR 4000 is nothing less than a powerhouse of a board, packing a huge set of features into a small form factor. It features the Intel® Cyclone® 10CL016 for FPGA (Field Programming Gate Array), allowing you to configure a large set of pins to accommodate any of your preferences. But why stop there? The board also has a camera connector, a Micro HDMI connector, Wi-Fi / Bluetooth® connectivity through the NINA-W102 module, and cyber-security through the ECC508 crypto chip. Just as the other members of the MKR family, it uses the popular Cortex-M0 32-bit SAMD21 microprocessor.u-blox NINA-W102Enables Bluetooth® and Wi-Fi connectivity for the MKR Vidor 4000 board.DocumentationlibraryMicro HDMI connectorConnect your board to an external monitor through the Micro HDMI connector.DocumentationlibraryMIPI Camera connectorConnect a camera and use it to implement QR code in you projects.DocumentationlibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
