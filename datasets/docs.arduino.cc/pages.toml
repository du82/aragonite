["https://docs.arduino.cc/hardware/uno-rev3"]
title = ""
description = "The Arduino UNO is the best board to get started with electronics and coding. If this is your first experience tinkering with the platform, the UNO is the most robust board you can start playing with. The UNO is the most used and documented board of the whole Arduino family.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO R3 UNO R3The Arduino UNO is the best board to get started with electronics and coding. If this is your first experience tinkering with the platform, the UNO is the most robust board you can start playing with. The UNO is the most used and documented board of the whole Arduino family.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesArduino UNO is a microcontroller board based on the ATmega328P. It has 14 digital input/output pins (of which 6 can be used as PWM outputs), 6 analog inputs, a 16 MHz ceramic resonator, a USB connection, a power jack, an ICSP header and a reset button. It contains everything needed to support the microcontroller; simply connect it to a computer with a USB cable or power it with a AC-to-DC adapter or battery to get started. You can tinker with your UNO without worrying too much about doing something wrong, worst case scenario you can replace the chip for a few dollars and start over again.Replaceable chipThe ATmega328P can easily be replaced, as it is not soldered to the board.EEPROMThe ATmega328P also features 1kb of EEPROM, a memory which is not erased when powered off.DocumentationBattery ConnectorThe Arduino UNO features a barrel plug connector, that works great with a standard 9V battery.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
