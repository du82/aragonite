["https://docs.arduino.cc/arduino-cli/pluggable-discovery-specification"]
title = ""
full_description = '''Go BackPluggable discovery specificationArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Pluggable discovery specification Pluggable discovery specificationAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌Discovery tools are a special kind of tool used to find supported boards, a platform developer can create their own following the specification below. These tools must be in the form of executables that can be launched as a subprocess using a platform.txt command line recipe. They communicate to the parent process via stdin/stdout, accepting commands as plain text strings from stdin and sending answers back in JSON format on stdout. Each tool will implement the commands to list and enumerate ports for a specific protocol as specified in this document.Pluggable discovery API via stdin/stdoutAll the commands listed in this specification must be implemented in the discovery.After startup, the tool will just stay idle waiting for commands. The available commands are: HELLO, START, STOP, QUIT, LIST and START_SYNC.After each command the client always expects a response from the discovery. The discovery must not introduce any delay and must respond to all commands as fast as possible.HELLO commandHELLO must be the first command sent to the discovery to tell the name of the client/IDE and the version of the pluggable discovery protocol that the client/IDE supports. The syntax of the command is:HELLO <PROTOCOL_VERSION> "<USER_AGENT>"<PROTOCOL_VERSION> is the maximum protocol version supported by the client/IDE (currently 1)<USER_AGENT> is the name and version of the client. It must not contain double-quotes (").some examples:HELLO 1 "Arduino IDE 1.8.13"HELLO 1 "arduino-cli 1.2.3"the response to the command is:1{2 "eventType": "hello",3 "protocolVersion": 1,4 "message": "OK"5}The protocolVersion field represents the protocol version that will be used in the rest of the communication. There are three possible cases:if the client/IDE supports the same or a more recent version of the protocol than the discovery, then the client/IDE should go into a compatibility mode and use the protocol level supported by the discovery.if the discovery supports a more recent version of the protocol than the client/IDE: the discovery should downgrade itself into compatibility mode and report a protocolVersion that is less than or equal to the one supported by the client/IDE.if the discovery cannot go into compatibility mode, it must report the protocol version supported (even if greater than the version supported by the client/IDE) and the client/IDE may decide to terminate the discovery or produce an error/warning.START commandThe START command initializes and starts the discovery internal subroutines. This command must be called before LIST. The response to the start command is:1{2 "eventType": "start",3 "message": "OK"4}If the discovery could not start, for any reason, it must report the error with:1{2 "eventType": "start",3 "error": true,4 "message": "Permission error"5}The error field must be set to true and the message field should contain a description of the error.STOP commandThe STOP command stops the discovery internal subroutines and possibly frees the internally used resources. This command should be called if the client wants to pause the discovery for a while. The response to the command is:1{2 "eventType": "stop",3 "message": "OK"4}If an error occurs:1{2 "eventType": "stop",3 "error": true,4 "message": "Resource busy"5}The error field must be set to true and the message field should contain a description of the error.QUIT commandThe QUIT command terminates the discovery. The response to QUIT is:1{2 "eventType": "quit",3 "message": "OK"4}after this output the discovery exits. This command is supposed to always succeed.LIST commandThe LIST command executes an enumeration of the ports and returns a list of the available ports at the moment of the call. The format of the response is the following:1{2 "eventType": "list",3 "ports": [4 {5 "address": <-- THE ADDRESS OF THE PORT6 "label": <-- HOW THE PORT IS DISPLAYED ON THE GUI7 "protocol": <-- THE PROTOCOL USED BY THE BOARD8 "protocolLabel": <-- HOW THE PROTOCOL IS DISPLAYED ON THE GUI9 "hardwareId": <-- A STRING THAT UNIQUELY IDENTIFIES A BOARD INSTANCE10 "properties": {11 <-- A LIST OF PROPERTIES OF THE PORT12 }13 },14 {15 ... <-- OTHER PORTS...16 }17 ]18}The ports field contains a list of the available ports.Each port has:an address (for example /dev/ttyACM0 for serial ports or 192.168.10.100 for network ports)a label that is the human readable form of the address (it may be for example ttyACM0 or SSH on 192.168.10.100)protocol is the protocol identifier (such as serial or dfu or ssh)protocolLabel is the protocol in human readable form (for example Serial port or DFU USB or Network (ssh))hardwareId (optional) a string that uniquely identifies a specific board instance (even among other boards of the same model). Different ports with the same hardwareId must belong to the same board instance. The identifier should be sufficiently long to uniquely identify the board instance and reduce the probability of collisions. Good examples of hardwareId values are: Ethernet MAC Address, USB Serial Number, CPU-ID number, etc.This value should not be used to identify the board model (see the board identification section for more information about identification of the board model).properties is a list of key/value pairs that represent information relative to the specific port.To make the above more clear let's show an example output from the serial-discovery builtin in the Arduino CLI:1{2 "eventType": "list",3 "ports": [4 {5 "address": "/dev/ttyACM0",6 "label": "ttyACM0",7 "protocol": "serial",8 "protocolLabel": "Serial Port (USB)",9 "hardwareId": "EBEABFD6514D32364E202020FF10181E",10 "properties": {11 "pid": "0x804e",12 "vid": "0x2341",13 "serialNumber": "EBEABFD6514D32364E202020FF10181E",14 "name": "ttyACM0"15 }16 }17 ]18}In this case the serial port metadata comes from a USB serial converter. Inside the properties we have all the properties of the port, and some of them may be useful for product identification (in this case only USB VID/PID is useful to identify the board model).The hardwareId field is populated with the USB serialNumber since this value is useful to identify the board instance.The LIST command performs a one-shot polling of the ports. The discovery should answer as soon as reasonably possible, without any additional delay.Some discoveries may require some time to discover a new port (for example network protocols like MDNS, Bluetooth, etc. require some seconds to receive the broadcasts from all available clients) in that case it is fine to answer with an empty or incomplete list.If an error occurs and the discovery can't complete the enumeration, it must report the error with:1{2 "eventType": "list",3 "error": true,4 "message": "Resource busy"5}The error field must be set to true and the message field should contain a description of the error.START_SYNC commandThe START_SYNC command puts the tool in "events" mode: the discovery will send add and remove events each time a new port is detected or removed respectively. If the discovery goes into "events" mode successfully the response to this command is:1{2 "eventType": "start_sync",3 "message": "OK"4}After this message the discovery will send add and remove events asynchronously (more on that later). If an error occurs and the discovery can't go in "events" mode the error must be reported as:1{2 "eventType": "start_sync",3 "error": true,4 "message": "Resource busy"5}The error field must be set to true and the message field should contain a description of the error.Once in "event" mode, the discovery is allowed to send add and remove messages asynchronously in realtime, this means that the client must be able to handle these incoming messages at any moment.The add event looks like the following:1{2 "eventType": "add",3 "port": {4 "address": "/dev/ttyACM0",5 "label": "ttyACM0",6 "hardwareId": "EBEABFD6514D32364E202020FF10181E",7 "properties": {8 "pid": "0x804e",9 "vid": "0x2341",10 "serialNumber": "EBEABFD6514D32364E202020FF10181E",11 "name": "ttyACM0"12 },13 "protocol": "serial",14 "protocolLabel": "Serial Port (USB)"15 }16}It basically provides the same information as the list event but for a single port. After calling START_SYNC an initial burst of add events must be generated in sequence to report all the ports available at the moment of the start.The remove event looks like the following:1{2 "eventType": "remove",3 "port": {4 "address": "/dev/ttyACM0",5 "protocol": "serial"6 }7}The content is straightforward, in this case only the address and protocol fields are reported.If the information about a port needs to be updated the discovery may send a new add message for the same port address and protocol without sending a remove first: this means that all the previous information about the port must be discarded and replaced with the new one.Invalid commandsIf the client sends an invalid or malformed command, the discovery should answer with:1{2 "eventType": "command_error",3 "error": true,4 "message": "Unknown command XXXX"5}State machineA well behaved pluggable discovery tool must reflect the following state machine.The arrows represent the commands outlined in the above sections, calling a command successfully assumes the state changes.A pluggable discovery state is Alive when the process has been started but no command has been executed. Dead means the process has been stopped and no further commands can be received.Board identificationThe properties associated to a port can be used to identify the board attached to that port. The algorithm is simple:each board listed in the platform file boards.txt may declare a set of upload_port.* propertiesif each upload_port.* property has a match in the properties set coming from the discovery then the board is a "candidate" board attached to that port.Some port properties may not be precise enough to uniquely identify a board, in that case more boards may match the same set of properties, that's why we called it "candidate". The board identification properties should be used only if they allows to match the board model beyond any doubt.Let's see an example to clarify things a bit, let's suppose that we have the following properties coming from the serial discovery:1"port": {2 "address": "/dev/ttyACM0",3 "properties": {4 "pid": "0x804e",5 "vid": "0x2341",6 "serialNumber": "EBEABFD6514D32364E202020FF10181E",7 "name": "ttyACM0"8 },9 ...in this case we can use vid and pid to identify the board. The serialNumber, instead, is unique for that specific instance of the board so it can't be used to identify the board model. Let's suppose we have the following boards.txt:1# Arduino Zero (Programming Port)2# ---------------------------------------3arduino_zero_edbg.name=Arduino Zero (Programming Port)4arduino_zero_edbg.upload_port.vid=0x03eb5arduino_zero_edbg.upload_port.pid=0x21576[...CUT...]7# Arduino Zero (Native USB Port)8# --------------------------------------9arduino_zero_native.name=Arduino Zero (Native USB Port)10arduino_zero_native.upload_port.0.vid=0x234111arduino_zero_native.upload_port.0.pid=0x804d12arduino_zero_native.upload_port.1.vid=0x234113arduino_zero_native.upload_port.1.pid=0x004d14arduino_zero_native.upload_port.2.vid=0x234115arduino_zero_native.upload_port.2.pid=0x824d16arduino_zero_native.upload_port.3.vid=0x234117arduino_zero_native.upload_port.3.pid=0x024d18[...CUT...]19# Arduino MKR100020# -----------------------21mkr1000.name=Arduino MKR100022mkr1000.upload_port.0.vid=0x2341 <------- MATCHING IDs23mkr1000.upload_port.0.pid=0x804e <------- MATCHING IDs24mkr1000.upload_port.1.vid=0x234125mkr1000.upload_port.1.pid=0x004e26mkr1000.upload_port.2.vid=0x234127mkr1000.upload_port.2.pid=0x824e28mkr1000.upload_port.3.vid=0x234129mkr1000.upload_port.3.pid=0x024e30[...CUT...]As we can see the only board that has the two properties matching is the mkr1000, in this case the CLI knows that the board is surely an MKR1000.Note that vid and pid properties are just free text key/value pairs: the discovery may return basically anything, the board just needs to have the same properties defined in boards.txt as upload_port.* to be identified.We can also specify multiple identification properties for the same board using the .N suffix, for example:1myboard.name=My Wonderful Arduino Compatible Board2myboard.upload_port.pears=203myboard.upload_port.apples=30will match on pears=20, apples=30 but:1myboard.name=My Wonderful Arduino Compatible Board2myboard.upload_port.0.pears=203myboard.upload_port.0.apples=304myboard.upload_port.1.pears=305myboard.upload_port.1.apples=40will match on both pears=20, apples=30 and pears=30, apples=40 but not pears=20, apples=40, in that sense each "set" of identification properties is independent from each other and cannot be mixed for port matching.An important note about vid and pidThe board identification properties should be used only if they allows to match the board model beyond any doubt. Sometimes a board do not expose a unique vid/pid combination, this is the case for example if a USB-2-serial converter chip is used (like the omnipresent FT232 or CH340): those chips exposes their specific vid/pid that will be the same for all the other boards using the same chip. In such cases the board identification properties should NOT be used.Identification of board optionsCustom board options can also be identified.Identification property values are associated with a custom board option by the board definition in boards.txt. Two formats are available.If only a single set of identification properties are associated with the option:1BOARD_ID.menu.MENU_ID.OPTION_ID.upload_port.PORT_PROPERTY_KEY=PORT_PROPERTY_VALUEIf one or more sets of identification properties are associated with the option, an index number is used for each set:1BOARD_ID.menu.MENU_ID.OPTION_ID.upload_port.SET_INDEX.PORT_PROPERTY_KEY=PORT_PROPERTY_VALUEIf multiple identification properties are associated within a set, all must match for the option to be identified.Let's see an example to clarify it, in the following boards.txt:1myboard.upload_port.pid=0x00102myboard.upload_port.vid=0x23413myboard.menu.cpu.atmega1280=ATmega12804myboard.menu.cpu.atmega1280.upload_port.c=atmega1280 <--- identification property for cpu=atmega12805myboard.menu.cpu.atmega1280.build_cpu=atmega12806myboard.menu.cpu.atmega2560=ATmega25607myboard.menu.cpu.atmega2560.upload_port.c=atmega2560 <--- identification property for cpu=atmega25608myboard.'''
