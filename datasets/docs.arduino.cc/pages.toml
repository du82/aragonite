["https://docs.arduino.cc/hardware/mkr-can-shield"]
title = ""
description = "The MKR CAN Shield is a great addon for MKR family boards, and allows you to connect to a CAN (Controller Area Network) bus, widely used in the automotive industry.To use this shield, you can refer to the documentation of the CAN library.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR CAN Shield MKR CAN ShieldThe MKR CAN Shield is a great addon for MKR family boards, and allows you to connect to a CAN (Controller Area Network) bus, widely used in the automotive industry.To use this shield, you can refer to the documentation of the CAN library.Get StartedPinoutBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR CAN Shield is based on the MCP2515 CAN controller and the TJA1049 CAN transceiver. Mounting this shield on a MKR family board allows you to connect to existing CAN systems. It also features the TPS54232 buck converter from Texas Instruments.Can InterfaceThis high-speed CAN transceiver provides an interface between a CAN controller (MCP2515) and the physical CAN bus.DocumentationLibraryPower with batteryA DC-DC converter with pulse-skipping Eco-Mode feature, which allows the use of batteries as a power supply.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
