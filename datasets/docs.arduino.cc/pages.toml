["https://docs.arduino.cc/hardware/portenta-c33"]
title = ""
description = "The Portenta C33 is a powerful System-on-Module based on the Renesas RA6M5 microcontroller group, which utilizes the high-performance Arm® Cortex®-M33 core. The Portenta C33 shares the same form factor as the Portenta H7 and is backward compatible with it, making it fully compatible with all Portenta family shields and carriers through its High-Density connectors.User Manual"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta C33 Portenta C33The Portenta C33 is a powerful System-on-Module based on the Renesas RA6M5 microcontroller group, which utilizes the high-performance Arm® Cortex®-M33 core. The Portenta C33 shares the same form factor as the Portenta H7 and is backward compatible with it, making it fully compatible with all Portenta family shields and carriers through its High-Density connectors.User ManualPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsSTEP FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesAre you looking for a cost-effective and versatile microcontroller module for your real-time applications? Look no further than the Portenta C33! The Portenta C33 is a powerful System-on-Module based on the R7FA6M5BH2CBG microcontroller, which utilizes the high-performance Arm® Cortex®-M33 core. The Portenta C33 shares the same form factor as the Portenta H7, and it is backward compatible with it. The Portenta C33 is fully compatible with all Portenta family shields and carriers through its MKR-styled and High-Density connectors.The board also supports MicroPython and other high-level programming languages, allowing developers to write code in a familiar language and accelerate development. With its onboard Wi-Fi® and Bluetooth® connectivity, the Portenta C33 is the ideal solution for Internet of Things (IoT) gateways, remote control systems, fleet management, and process tracking. These features allow the Portenta C33 to connect easily to other devices and sensors, enabling seamless data transfer and real-time control in various applications.Portenta Family Form Factor The High-Density Connectors and the MKR-styled pins allow full compatibility with the Arduino Portenta and MKR ecosystem, making the Portenta C33 very versatile for a variety of purposes. In addition, Portenta C33 features castellated pins, making it suitable for automatic assembly lines.Renesas R7FA6M5BH2CBG microcontroller The R7FA6M5BH2CBG microcontroller of the Portenta C33 uses the Arm® Cortex®-M33, a 32-bit processor that offers efficient performance, low power consumption, and advanced security features, making it an ideal choice for a wide range of embedded systems applications.DatasheetEspressif ESP32-C3-MINI-1U Wi-Fi® and Bluetooth® module The ESP32-C3-MINI-1U is a compact Wi-Fi® and Bluetooth® module with low power consumption, high performance, and various peripheral interfaces, making it a well-suited option for battery-powered IoT devices that require long battery life and real-time data processing.DatasheetNXP® SE050C2 IoT Secure Element The SE050C2 secure element offers secure storage and processing of sensitive data, cryptographic key management, and protection against physical and software-based attacks.DatasheetMicroPython Language Support Program the Portenta C33 with MicroPython and other high-level programming languages, offering rapid prototyping, efficient use of resources, and a Python®-based development environment for IoT applications.Low-power design The Portenta C33 was designed with low power consumption in mind, making it well qualified for battery-powered IoT devices that require long battery life. Its microcontroller is designed for efficient power usage, allowing it to perform real-time processing tasks while consuming minimal energy.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
