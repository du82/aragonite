["https://docs.arduino.cc/hardware/portenta-proto-kit-me"]
title = ""
description = "The Arduino Portenta Proto Kit ME (Motion Environment) is a complete solution for developing functional prototypes focused on environmental monitoring and motion detection. It includes multiple Arduino Pro products all working together to collect relevant data for a wide range of applications, such as predictive maintenance, asset tracking, smart building systems and industrial automation. With reliable sensing capabilities and seamless Cloud connectivity through the Arduino Pro 4G Module, this kit enables you to bring your ideas to life and quickly transition from functional prototypes to final products.PROTO KIT COURSEPORTENTA PROTO SHIELD"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyPro Solutions and KitsSolutions and KitsEdge ControlEdge Control Enclosure KitPortenta Machine ControlPortenta Proto Kit MEPortenta Proto Kit VEWisGate Edge Lite 2WisGate Edge ProNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta Proto Kit ME Portenta Proto Kit METhe Arduino Portenta Proto Kit ME (Motion Environment) is a complete solution for developing functional prototypes focused on environmental monitoring and motion detection. It includes multiple Arduino Pro products all working together to collect relevant data for a wide range of applications, such as predictive maintenance, asset tracking, smart building systems and industrial automation. With reliable sensing capabilities and seamless Cloud connectivity through the Arduino Pro 4G Module, this kit enables you to bring your ideas to life and quickly transition from functional prototypes to final products.PROTO KIT COURSEPORTENTA PROTO SHIELDBuy nowDownloadable resourcesDatasheetFeaturesTech SpecsCompatibilitySuggested LibrariesThe Portenta Proto Kit Motion ME is a versatile kit designed for prototyping environmental monitoring and motion detection applications. It includes powerful components such as the Portenta H7 board, the Portenta Mid Carrier, the Proto Shield, several Modulinos, the Arduino Pro 4G Module and the Nicla Sense ME board, allowing users to collect accurate data and develop innovative solutions for predictive maintenance, asset tracking, smart building systems and more.Portenta H7 Microcontroller BoardThe Portenta H7 is a versatile and powerful microcontroller board with dual-core processing that enables parallel execution of high-level and real-time tasks. It is ideal for applications ranging from smart devices to industrial automation.Read MoreNicla Sense ME Microcontroller BoardThe Nicla Sense ME is a compact and robust microcontroller board that measures motion and environmental parameters such as rotation, acceleration, pressure, humidity, temperature, indoor air quality and CO2 levels. It is ideal for projects requiring sensor fusion and edge processing.Read MorePortenta Mid CarrierThe Portenta Mid Carrier is a versatile prototyping tool that enhances Portenta family boards with access to its high-density signals and features like Ethernet, Mini PCIe, camera connectors, CAN lines, microSD support and 4G connectivity via the Arduino Pro 4G Module. It is ideal for applications such as machine vision, smart cities, and remote maintenance.Read MorePortenta Mid Carrier Proto ShieldThe Portenta Mid Carrier Proto Shield simplifies hardware prototyping with interfaces for Arduino UNO shields, Qwiic and ESLOV connectors, and a Modulino mechanical interface. It is designed to integrate with the Portenta Mid Carrier, enabling the quickly development and testing of custom hardware solutions.Read MoreModulinosModulinos are plug-and-play sensors and actuators that connect easily via the Portenta Mid Carrier Proto Shield's Qwiic connector. Designed for intuitive use, they include options like knobs for fine adjustments, LEDs for visual feedback, and sensors for measuring distance, movement, temperature and humidity, making them ideal for building and expanding projects in a fast way and with minimum complexity.Read MoreArduino Pro 4G GNSS Module GlobalThe Arduino Pro 4G GNSS Module enhances the kit capabilities with high-speed, reliable 4G connectivity, supporting 2G and 3G networks for global coverage. Designed in a Mini PCIe form factor, it ensures secure data transfer, real-time notifications and remote monitoring, making it ideal for projects ranging from firmware updates to large-scale safety and environmental monitoring.Read MoreConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
