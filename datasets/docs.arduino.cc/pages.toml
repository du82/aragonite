["https://docs.arduino.cc/hardware/mkr-fox-1200"]
title = ""
description = "The MKR FOX 1200 is your entry point to start working with the European Sigfox networks. The board can easily be added to the Sigfox infrastructure. It also features very low power consumption, and is designed to run on batteries for a longer period of time.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR FOX 1200 MKR FOX 1200End of LifeThe MKR FOX 1200 is your entry point to start working with the European Sigfox networks. The board can easily be added to the Sigfox infrastructure. It also features very low power consumption, and is designed to run on batteries for a longer period of time.Get StartedInteractive ViewerPinoutDownloadable resourcesPinout (PDF)SchematicsFritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR FOX 1200 adds Sigfox connectivity to your projects. Using the popular Arm® Cortex®-M0 32-bit SAMD21 processor, it also features the Microchip® Smart RF ATA8520 for Sigfox connectivity. The board is part of the MKR family, where you can choose from a large variety of shields to build projects out of the box with minimal effort!Microchip® Smart RF Transmitter Fully integrated, single-chip RF transmitter with low power consumption.DocumentationlibraryCoverageSigFox covers most parts of Europe, South Africa, Japan and is being introduced in many more countries.Link to MapConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
