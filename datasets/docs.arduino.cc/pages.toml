full_description = '''ProgrammingArduino IoT Cloud APIDashboardsDevicesLoraNetworkPropertiesSeriesTemplatesThingsTriggersArduino IoT Cloud APIProvides a set of endpoints to manage Arduino IoT Cloud Devices, Things, Properties and Timeseries.Create Auth TokenThis API can be called just with any HTTP Client, or using one of these clients:Javascript NPM packagePython PYPI PackageGolang ModuleToken Generation CodeYou can find the code for generating tokens for compatible clients in the following sections.Here you can find a complete guide on how to generate a token.CLIENT LIBRARYcURLPythonJavascriptcurl --request POST \--url 'https://api2.arduino.cc/iot/v1/clients/token' \ --header 'content-type: application/x-www-form-urlencoded' \ --data 'grant_type=client_credentials' \ --data 'client_id=YOUR_CLIENT_ID' \ --data 'client_secret=YOUR_SECRET_ID' \ --data 'audience=https://api2.arduino.cc/iot' Rate LimitingArduino IoT APIs are rate limited, authenticated clients limit is up to 10req/s. The following code and message are returned from the Arduino servers in case of rate limit errorStatus: 429 - Too Many RequestsYou have reached maximum request limit.DashboardsDevicesLoraNetworkPropertiesSeriesTemplatesThingsTriggersDashboards V2Dashboards V2 ListDashboards V2 CreateDashboards V2 DeleteDashboards V2 ShowDashboards V2 Patch Dashboards V2 UpdateDashboards V2 CloneDashboards V2 RequestAccessDashboards V2 ListSharesDashboards V2 Share Dashboards V2 DeleteShareDashboards V2 TemplateDashboards V2 LinkDiscoverThe Arduino Cloud is a online platform that makes it easy for you to create, deploy and monitor IoT projects.Arduino Cloud Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & Licensing'''
