["https://docs.arduino.cc/hardware/portenta-mid-carrier-proto-shield"]
title = ""
description = "The Portenta Mid Carrier Proto Shield is designed for advanced prototyping within the Arduino ecosystem. It includes dual 44-pin Portenta headers, Arduino UNO shield headers, two ESLOV connectors, and a QWIIC connector. Compatible with Nicla sensorized nodes and Modulino®, it supports modular and scalable IoT, automation, and environmental monitoring projects.Pro Proto Kit"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta Mid Carrier Proto Shield Portenta Mid Carrier Proto ShieldThe Portenta Mid Carrier Proto Shield is designed for advanced prototyping within the Arduino ecosystem. It includes dual 44-pin Portenta headers, Arduino UNO shield headers, two ESLOV connectors, and a QWIIC connector. Compatible with Nicla sensorized nodes and Modulino®, it supports modular and scalable IoT, automation, and environmental monitoring projects.Pro Proto KitPinoutBuy nowDownloadable resourcesDatasheetSchematicsSTEP FilesFeaturesTech SpecsCompatibilitySuggested LibrariesThe Portenta Mid Carrier Proto Shield is a flexible platform for prototyping and integration within the Arduino ecosystem. It has a Portenta Mid Carrier Interface connection using the dual 44-pin header for compatibility with Portenta Mid Carrier and core Portenta family boards, two ESLOV connectors and a QWIIC connector.It features Arduino UNO shield headers, offering ADC, GPIO, SPI, and I²C interfaces and provides compatibility with the UNO Shield family. Dedicated mechanical interfaces for Nicla sensorized nodes and Modulino® allow scalable sensing and data acquisition for diverse applications. Designed for standalone and integrated systems, the shield supports rapid prototyping and scalability for IoT, automation and environmental monitoring projects.2x 44-pin Headers - Portenta Mid Carrier InterfaceThe Portenta Mid Carrier Proto Shield features dual 44-pin Portenta Mid Carrier headers, offering extensive connectivity for the Portenta family board and peripheral modules.2x ESLOV & 1x QWIIC ConnectorsIncludes two ESLOV connectors and one QWIIC connector for sensors and other compatible devices.Arduino UNO Shield HeadersCompatible with Arduino UNO shields, providing ADC, GPIO, SPI, and I²C interfaces for expanded functionality.Nicla InterfacesDedicated mechanical interfaces for Nicla sensorized nodes support advanced sensing and data acquisition for various applications.Modulino® InterfacesDedicated Modulino® interfaces provide modular connectivity for flexible sensor integration and scalable prototyping.Modular DesignDesigned for scalability and customization, the Portenta Mid Carrier Proto Shield supports rapid prototyping and development for IoT, automation, and monitoring projects.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
