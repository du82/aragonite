["https://docs.arduino.cc/hardware/micro"]
title = ""
description = "The Micro runs on an ATmega32u4 processor with native USB communication. Configure via software whether the board is recognised as a standard Arduino, a mouse or keyboard.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Micro MicroThe Micro runs on an ATmega32u4 processor with native USB communication. Configure via software whether the board is recognised as a standard Arduino, a mouse or keyboard.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)Fritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Micro is a microcontroller board based on the ATmega32U4, developed in conjunction with Adafruit. It has 20 digital input/output pins (of which 7 can be used as PWM outputs and 12 as analog inputs), a 16 MHz crystal oscillator, a micro USB connection, an ICSP header, and a reset button. It contains everything needed to support the microcontroller; simply connect it to a computer with a micro USB cable to get started. It has a form factor that enables it to be easily placed on a breadboard. The Micro board is similar to the Arduino Leonardo in that the ATmega32U4 has built-in USB communication, eliminating the need for a secondary processor. This allows the Micro to appear to a connected computer as a mouse and keyboard, in addition to a virtual (CDC) serial / COM port.Built-in USB communicationThe ATmega32U4 has built-in USB communication that allows the Micro to appear as a mouse/keyboard on your machine.DocumentationLibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
