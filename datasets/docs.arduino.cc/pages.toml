["https://docs.arduino.cc/arduino-cli/platform-specification"]
title = ""
full_description = '''Go BackPlatform specificationArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Platform specification Platform specificationAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌This is the Arduino platform specification, for use with Arduino development software starting from the Arduino IDE 1.5.x series.Platforms add support for new boards to the Arduino development software. They are installable either via Boards Manager or manual installation to the hardware folder of Arduino's sketchbook folder (AKA "user directory"). A platform may consist of as little as a single configuration file.Platform installation directoriesIf the platforms are installed using the Board Manager the installation directory location will be as follow:{directories.data}/packages/{VENDOR_NAME}/hardware/{ARCHITECTURE}/{VERSION}/...{directories.data} is the data directory as specified in the configuration file.{VENDOR_NAME} is the identifier of the vendor/maintainer of the platform.{ARCHITECTURE} is the architecture of the CPU used in the platform.{VERSION} is the platform version.Alternatively, a platform may be manually installed by the user inside the Sketchbook/user directory as follows:{directories.user}/hardware/{VENDOR_NAME}/{ARCHITECTURE}/...{directories.user} is the user directory as specified in the configuration file.{VENDOR_NAME} is the identifier of the vendor/maintainer of the platform.{ARCHITECTURE} is the architecture of the CPU used in the platform.A vendor/maintainer may have multiple supported architectures.Let's see an example, below we have a bunch of platforms downloaded from three hardware vendors arduino, adafruit and esp32, and installed using the Board Manager:1{directories.data}/packages/arduino/hardware/avr/1.8.6/...2{directories.data}/packages/arduino/hardware/esp32/2.0.18-arduino.5/...3{directories.data}/packages/arduino/hardware/nrf52/1.4.5/...4{directories.data}/packages/adafruit/hardware/nrf52/1.6.1/...5{directories.data}/packages/esp32/hardware/esp32/3.0.7/...In this example three architectures have been installed from the vendor arduino (avr, esp32 and nrf52), and one from adafruit and esp32 (nrf52 and esp32 respectively). Note that the vendor esp32 has the same name as the architecture esp32.If the user manually installed the same platforms, they should have unpacked them in the following directories:1{directories.user}/hardware/arduino/avr/...2{directories.user}/hardware/arduino/esp32/...3{directories.user}/hardware/arduino/nrf52/...4{directories.user}/hardware/adafruit/nrf52/...5{directories.user}/hardware/esp32/esp32/...In this latter case the version must be omitted.Notes about choosing the architecture nameArchitecture values are case sensitive (e.g. AVR != avr).Platform developers should follow the existing architecture name conventions when creating hardware packages, if you need to differentiate your package use the vendor/maintainer folder name to do so.The architecture name is used to determine the libraries compatibility and to permit referencing resources from another platform of the same architecture. Use of a non-standard architecture name can have a harmful effect.Architecture configurationsEach architecture must be configured through a set of configuration files:platform.txt contains definitions for the CPU architecture used (compiler, build process parameters, tools used for upload, etc.)boards.txt contains definitions for the boards (board name, parameters for building and uploading sketches, etc.)programmers.txt contains definitions for external programmers (typically used to burn bootloaders or sketches on a blank CPU/board)Configuration files formatA configuration file is a list of "key=value" properties. The value of a property can be expressed using the value of another property by putting its name inside brackets "{" "}". For example:1compiler.path=/tools/g++_arm_none_eabi/bin/2compiler.c.cmd=arm-none-eabi-gcc3[....]4recipe.c.o.pattern={compiler.path}{compiler.c.cmd}In this example the property recipe.c.o.pattern will be set to /tools/g++_arm_none_eabi/bin/arm-none-eabi-gcc, which is the composition of the properties compiler.path and compiler.c.cmd.CommentsLines starting with # are treated as comments and will be ignored.1# Like in this example2# --------------------3# I'm a comment!Automatic property override for specific OSWe can specify an OS-specific value for a property. For example the following file:1tools.bossac.cmd=bossac2tools.bossac.cmd.windows=bossac.exewill set the property tools.bossac.cmd to the value bossac on Linux and macOS and bossac.exe on Windows. Supported suffixes are .linux, .windows and .macosx.Global Predefined propertiesThe following automatically generated properties can be used globally in all configuration files:{runtime.platform.path}: is the absolute path of the board platform folder (i.e. the folder containing boards.txt) unless {runtime.use_core_platform_path_for_runtime_platform_path} is set to true in this case, the value is the absolute path of the referenced core platform.{runtime.hardware.path}: the absolute path of the hardware folder (i.e. the folder containing the board platform folder){runtime.ide.path}: the absolute path of the Arduino IDE or Arduino CLI folder{runtime.ide.version}: the version number of the Arduino IDE as a number (this uses two digits per version number component, and removes the points and leading zeroes, so Arduino IDE 1.8.3 becomes 01.08.03 which becomes runtime.ide.version=10803). When using Arduino development software other than the Arduino IDE, this is set to a meaningless version number.{ide_version}: Compatibility alias for {runtime.ide.version}{runtime.os}: the running OS ("linux", "windows", "macosx"){software}: set to "ARDUINO"{name}: platform vendor name{_id}: board ID of the board being compiled for{build.fqbn}: the FQBN (fully qualified board name) of the board being compiled for. The FQBN follows the format: VENDOR:ARCHITECTURE:BOARD_ID[:MENU_ID=OPTION_ID[,MENU2_ID=OPTION_ID ...]]{build.source.path}: Path to the sketch being compiled. If the sketch is in an unsaved state, it will the path of its temporary folder.{build.library_discovery_phase}: set to 1 during library discovery and to 0 during normal build. A macro defined with this property can be used to disable the inclusion of heavyweight headers during discovery to reduce compilation time. This property was added in Arduino IDE 1.8.14/Arduino Builder 1.6.0/Arduino CLI 0.12.0. Note: with the same intent, -DARDUINO_LIB_DISCOVERY_PHASE was added to recipe.preproc.macros during library discovery in Arduino Builder 1.5.3/Arduino CLI 0.10.0. That flag was replaced by the more flexible {build.library_discovery_phase} property.{compiler.optimization_flags}: see "Sketch debugging configuration" for details{extra.time.utc}: Unix time (seconds since 1970-01-01T00:00:00Z) according to the machine the build is running on{extra.time.local}: Unix time with local timezone and DST offset{extra.time.zone}: local timezone offset without the DST component{extra.time.dst}: local daylight savings time offsetCompatibility notes:Versions before Arduino IDE 1.6.0 only used one digit per version number component in {runtime.ide.version} (so 1.5.9 was 159, not 10509).{runtime.use_core_platform_path_for_runtime_platform_path} support is available from Arduino CLI >=1.0.4.platform.txtThe platform.txt file contains information about a platform's specific aspects (compilers command line flags, paths, system libraries, etc.).The following meta-data must be defined:1name=Arduino AVR Boards2version=1.5.3The name will be shown as the Arduino IDE's Board menu section title or the Name field of arduino-cli core list's output for the platform. The version is currently unused, it is reserved for future use (probably together with the Boards Manager to handle dependencies on cores).Build processThe platform.txt file is used to configure the build process. This is done through a list of recipes. Each recipe is a command line expression that explains how to call the compiler (or other tools) for every build step and which parameter should be passed.The Arduino development software, before starting the build, determines the list of files to compile. The list is composed of:the user's Sketchsource code in the selected board's Coresource code in the Libraries used in the sketchA temporary folder is created to store the build artifacts whose path is available through the global property {build.path}. A property {build.project_name} with the name of the project and a property {build.arch} with the name of the architecture is set as well.{build.path}: The path to the temporary folder to store build artifacts{build.project_name}: The project name{build.arch}: The MCU architecture (avr, sam, etc...)There are some other {build.xxx} properties available, that are explained in the boards.txt section of this guide.Security credential propertiesSome of them allow specifying trusted security credentials (signing and encryption keys) that can be used by a "secure boot" system:build.keys.keychain: for the directory containing the keysbuild.keys.sign_key: for the signing keybuild.keys.encrypt_key: for the encryption keyIf any of these properties are defined, the others are required.These properties can be overwritten respectively with --keys-keychain, --sign-key, --encrypt-key compile flags in the Arduino CLI.Recipes to compile source codeWe said that the Arduino development software determines a list of files to compile. Each file can be source code written in C (.c files), C++ (.cpp/.cxx/.cc files) or Assembly (.S files). Every language is compiled using its respective recipe:recipe.c.o.pattern: for C files (.c)recipe.cpp.o.pattern: for CPP files (.cpp/.cxx/.cc)recipe.S.o.pattern: for Assembly files (.S)(an optional recipe.cxx.o.pattern and recipe.cc.o.pattern may be provided, if .cxx or .cc needs special handling, but it's not required and we do not recommend it)The recipes can be built concatenating the following automatically generated properties (for each file compiled):{includes}: the list of include paths in the format "-I/include/path -I/another/path...."{source_file}: the path to the source file{object_file}: the path to the output fileFor example the following is used for AVR:1## Compiler global definitions2compiler.path={runtime.ide.path}/tools/avr/bin/3compiler.c.cmd=avr-gcc4compiler.c.flags=-c -g -Os -w -ffunction-sections -fdata-sections -MMD5 6[......]7 8## Compile c files9recipe.c.o.pattern="{compiler.path}{compiler.c.cmd}" {compiler.c.flags} -mmcu={build.mcu} -DF_CPU={build.f_cpu} -DARDUINO={runtime.ide.version} -DARDUINO_{build.board} -DARDUINO_ARCH_{build.arch} {build.extra_flags} {includes} "{source_file}" -o "{object_file}"Note that some properties, like {build.mcu} for example, are taken from the boards.txt file which is documented later in this specification.Recipes to build the core.a archive fileThe core of the selected board is compiled as described in the previous paragraph, but the object files obtained from the compile are also archived into a static library named core.a using the recipe.ar.pattern.The recipe can be built concatenating the following automatically generated properties:{object_file}: the object file to include in the archive{archive_file_path}: fully qualified archive file (ex. "/path/to/core.a"). This property was added in Arduino IDE 1.6.6/arduino builder 1.0.0-beta12 as a replacement for {build.path}/{archive_file}.{archive_file}: the name of the resulting archive (ex. "core.a")For example, Arduino provides the following for AVR:1compiler.ar.cmd=avr-ar2compiler.ar.flags=rcs3 4[......]5 6## Create archives7recipe.ar.pattern="{compiler.path}{compiler.ar.cmd}" {compiler.ar.flags} "{archive_file_path}" "{object_file}"Recipes for linkingAll the artifacts produced by the previous steps (sketch object files, libraries object files and core.a archive) are linked together using the recipe.c.combine.pattern.The recipe can be built concatenating the following automatically generated properties:{object_files}: the list of object files to include in the archive ("file1.o file2.o ...."){archive_file_path}: fully qualified archive file (ex. "/path/to/core.a"). This property was added in Arduino IDE 1.6.6/arduino builder 1.0.0-beta12 as a replacement for {build.path}/{archive_file}.{archive_file}: the name of the core archive file (ex. "core.a"){compiler.libraries.ldflags}: the linking flags for precompiled libraries, which consist of automatically generated -L flags for the library path and -l flags for library files, as well as any custom flags provided via the ldflags field of library.properties. In order to support precompiled libraries, platform.txt must contain a definition of compiler.libraries.ldflags, to which any automatically generated flags will be appended. Support for precompiled libraries was added in Arduino IDE 1.8.6/arduino-builder 1.4.0.For example the following is used for AVR:1compiler.c.elf.flags=-Os -Wl,--gc-sections2compiler.c.elf.cmd=avr-gcc3 4compiler.libraries.ldflags=5 6[......]7 8## Combine gc-sections, archives, and objects9recipe.c.combine.pattern="{compiler.path}{compiler.c.elf.cmd}" {compiler.c.elf.flags} -mmcu={build.mcu} -o "{build.path}/{build.project_name}.elf" {object_files} {compiler.libraries.ldflags} "{archive_file_path}" "-L{build.path}" -lmRecipes for extraction of executable files and other binary dataAn arbitrary number of extra steps can be performed at the end of objects linking. These steps can be used to extract binary data used for upload and they are defined by a set of recipes with the following format:1recipe.objcopy.FILE_EXTENSION_1.pattern=[.....]2recipe.objcopy.FILE_EXTENSION_2.pattern=[.....]3[.....]FILE_EXTENSION_x must be replaced with the extension of the extracted file, for example the AVR platform needs two files a .hex and a .eep, so we made two recipes like:1recipe.objcopy.eep.pattern=[.....]2recipe.objcopy.hex.pattern=[.....]There are no specific properties set by the Arduino development software here.A full example for the AVR platform can be:1## Create eeprom2recipe.objcopy.eep.pattern="{compiler.path}{compiler.objcopy.cmd}" {compiler.objcopy.eep.flags} "{build.path}/{build.project_name}.elf" "{build.path}/{build.project_name}.eep"3 4## Create hex5recipe.objcopy.hex.pattern="{compiler.path}{compiler.elf2hex.cmd}" {compiler.elf2hex.flags} "{build.path}/{build.project_name}.elf" "{build.path}/{build.project_name}.hex"Recipes to compute binary sketch sizeAt the end of the build the Arduino development software shows the final binary sket'''
