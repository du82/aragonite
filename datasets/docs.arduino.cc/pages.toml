["https://docs.arduino.cc/arduino-cli/sketch-project-file"]
title = ""
full_description = 'Go BackSketch project fileArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Sketch project file Sketch project fileAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌Sketch metadata is defined in a file named sketch.yaml. This file is in YAML format.Build profilesArduino CLI provides support for reproducible builds through the use of build profiles.A profile is a complete description of all the resources needed to build a sketch. The sketch project file may contain multiple profiles.Each profile will define:The board FQBNThe programmer to useThe target core platform name and version (with the 3rd party platform index URL if needed)A possible core platform name and version, that is a dependency of the target core platform (with the 3rd party platform index URL if needed)The libraries used in the sketch (including their version)The port and protocol to upload the sketch and monitor the boardThe format of the file is the following:1profiles:2 <PROFILE_NAME>:3 notes: <USER_NOTES>4 fqbn: <FQBN>5 programmer: <PROGRAMMER>6 platforms:7 - platform: <PLATFORM> (<PLATFORM_VERSION>)8 platform_index_url: <3RD_PARTY_PLATFORM_URL>9 - platform: <PLATFORM_DEPENDENCY> (<PLATFORM_DEPENDENCY_VERSION>)10 platform_index_url: <3RD_PARTY_PLATFORM_DEPENDENCY_URL>11 libraries:12 - <LIB_NAME> (<LIB_VERSION>)13 - <LIB_NAME> (<LIB_VERSION>)14 - <LIB_NAME> (<LIB_VERSION>)15 port: <PORT_NAME>16 port_config:17 <PORT_SETTING_NAME>: <PORT_SETTING_VALUE>18 ...19 protocol: <PORT_PROTOCOL>20 ...more profiles here...There is an optional profiles: section containing all the profiles. Each field in a profile is mandatory (unless noted otherwise below). The available fields are:<PROFILE_NAME> is the profile identifier, it’s a user-defined field, and the allowed characters are alphanumerics, underscore _, dot ., and dash -.<PLATFORM> is the target core platform identifier, for example, arduino:avr or adafruit:samd.<PLATFORM_VERSION> is the target core platform version required.<3RD_PARTY_PLATFORM_URL> is the index URL to download the target core platform (also known as “Additional Boards Manager URLs” in the Arduino IDE). This field can be omitted for the official arduino:* platforms.<PLATFORM_DEPENDENCY>, <PLATFORM_DEPENDENCY_VERSION>, and <3RD_PARTY_PLATFORM_DEPENDENCY_URL> contains the same information as <PLATFORM>, <PLATFORM_VERSION>, and <3RD_PARTY_PLATFORM_URL> respectively but for the core platform dependency of the main core platform. These fields are optional.libraries: is a section where the required libraries to build the project are defined. This section is optional.<LIB_VERSION> is the version required for the library, for example, 1.0.0.<USER_NOTES> is a free text string available to the developer to add comments. This field is optional.<PROGRAMMER> is the programmer that will be used. This field is optional.The following fields are available since Arduino CLI 1.1.0:<PORT_NAME> is the port that will be used to upload and monitor the board (unless explicitly set otherwise). This field is optional.port_config section with <PORT_SETTING_NAME> and <PORT_SETTING_VALUE> defines the port settings that will be used in the monitor command. Typically is used to set the baudrate for the serial port (for example baudrate: 115200) but any setting/value can be specified. Multiple settings can be set. These fields are optional.<PORT_PROTOCOL> is the protocol for the port used to upload and monitor the board. This field is optional.A complete example of a sketch project file may be the following:1profiles:2 nanorp:3 fqbn: arduino:mbed_nano:nanorp2040connect4 platforms:5 - platform: arduino:mbed_nano (2.1.0)6 libraries:7 - ArduinoIoTCloud (1.0.2)8 - Arduino_ConnectionHandler (0.6.4)9 - TinyDHT sensor library (1.1.0)10 11 another_profile_name:12 notes: testing the limit of the AVR platform, may be unstable13 fqbn: arduino:avr:uno14 platforms:15 - platform: arduino:avr (1.8.4)16 libraries:17 - VitconMQTT (1.0.1)18 - Arduino_ConnectionHandler (0.6.4)19 - TinyDHT sensor library (1.1.0)20 port: /dev/ttyACM021 port_config:22 baudrate: 11520023 24 tiny:25 notes: testing the very limit of the AVR platform, it will be very unstable26 fqbn: attiny:avr:ATtinyX5:cpu=attiny85,clock=internal1627 platforms:28 - platform: attiny:avr (1.0.2)29 platform_index_url: https://raw.githubusercontent.com/damellis/attiny/ide-1.6.x-boards-manager/package_damellis_attiny_index.json30 - platform: arduino:avr (1.8.3)31 libraries:32 - ArduinoIoTCloud (1.0.2)33 - Arduino_ConnectionHandler (0.6.4)34 - TinyDHT sensor library (1.1.0)35 36 feather:37 fqbn: adafruit:samd:adafruit_feather_m038 platforms:39 - platform: adafruit:samd (1.6.0)40 platform_index_url: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json41 libraries:42 - ArduinoIoTCloud (1.0.2)43 - Arduino_ConnectionHandler (0.6.4)44 - TinyDHT sensor library (1.1.0)45 46default_profile: nanorpBuilding a sketchWhen a sketch project file is present, it can be leveraged to compile the sketch with the --profile/-m flag in the compile command:1arduino-cli compile --profile nanorpIn this case, the sketch will be compiled using the core platform and libraries specified in the nanorp profile. If a core platform or a library is missing it will be automatically downloaded and installed on the fly in an isolated directory inside the data folder. The dedicated storage is not accessible to the user and is meant as a "cache" of the resources used to build the sketch.When using the profile-based build, the globally installed platforms and libraries are excluded from the compile and can not be used in any way. In other words, the build is isolated from the system and will rely only on the resources specified in the profile: this will ensure that the build is portable and reproducible independently from the platforms and libraries installed in the system.Using a default profileIf a default_profile is specified in the sketch.yaml then the “classic” compile command:1arduino-cli compile [sketch]will, instead, trigger a profile-based build using the default profile indicated in the sketch.yaml.Default flags for Arduino CLI usageThe sketch project file may be used to set the default value for some command line flags of the Arduino CLI, in particular:The default_fqbn key sets the default value for the --fqbn flagThe default_programmer key sets the default value for the --programmer flagThe default_port key sets the default value for the --port flagThe default_port_config key sets the default values for the --config flag in the monitor command (available since Arduino CLI 1.1.0)The default_protocol key sets the default value for the --protocol flagThe default_profile key sets the default value for the --profile flagFor example:1default_fqbn: arduino:samd:mkr10002default_programmer: atmel_ice3default_port: /dev/ttyACM04default_port_config:5 baudrate: 1152006default_protocol: serial7default_profile: myprofileWith this configuration set, it is not necessary to specify the --fqbn, --programmer, --port, --protocol or --profile flags to the arduino-cli compile, arduino-cli upload or arduino-cli debug commands when compiling, uploading or debugging the sketch. Moreover in the monitor command it is not necessary to specify the --config baudrate=115200 to communicate with the monitor port of the board.In this page you can check the latest version of the Arduino CLI. You can find previous versions here.ON THIS PAGEBuild profilesDefault flags for Arduino CLI usage'
