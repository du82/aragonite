description = "Transform your Portenta board to an edge computer solution with the Portenta Max Carrier.User ManualGet Started With X8"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta Max Carrier Portenta Max CarrierTransform your Portenta board to an edge computer solution with the Portenta Max Carrier.User ManualGet Started With X8Interactive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesSTEP FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Portenta Max Carrier includes a wide range of features to give you flexibility in designing your next intelligent kiosk or edge computer powerhouse. Always stay connected with different connectivity options.Portenta PoweredThe Portenta Max Carrier expands upon the computational capabilities of the Portenta X8.Read MoreCellular ConnectivityEnable 4G, Cat-M1, NB-IoT and LoRa® connectivity in your Industry 4.0 solution. Send and receive texts, or communicate via internet protocols including TCP, UDP and HTTPS.Read MoreCoverageNB-IoT and LTE-M coverage includes many regions, such as Europe, North & South America and large parts of Asia.Link to mapConnectivityAccess a wide range of I/O including high density connectors, Gigabit Ethernet, mini PCIe (PCI Express), 3.5mm audio in/out as well as Serial RS232/422/485DebuggingMake solutions faster with the in application Black Magic probe debugger.Li-ion batteryThe Portenta Max Carrier includes an onboard 18650 Li-ion/LiPo battery holder and power management circuitry.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
