["https://docs.arduino.cc/hardware/mkr-485-shield"]
title = ""
description = "The MKR 485 Shield makes it possible to communicate with legacy industrial systems that uses the RS-485 protocol. The shield is simply mounted on a MKR family board, easily turning your old local system into a modern IoT system.To use this shield, you can refer to the documentation of the ArduinoRS485 library.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR 485 Shield MKR 485 ShieldThe MKR 485 Shield makes it possible to communicate with legacy industrial systems that uses the RS-485 protocol. The shield is simply mounted on a MKR family board, easily turning your old local system into a modern IoT system.To use this shield, you can refer to the documentation of the ArduinoRS485 library.Get StartedPinoutBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR 485 Shield is based on the MAXIM MAX3157 transceiver, which guarantees data rates at up to 250kbps. The shield can be switched from using a half-duplex communication (one direction at a time) or full-duplex (both directions at the same time), which is easily configured by a switch on board the shield. It also features the TPS54232 buck converter from Texas Instruments.half & full duplex communicationA transceiver with guaranteed data rates of up to 250kbps, which can be used for half-duplex or full-duplex communication.DocumentationLibraryPower with batteryA DC-DC converter with pulse-skipping Eco-Mode feature, which allows the use of batteries as a power supply.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
