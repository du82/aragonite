["https://docs.arduino.cc/hardware/portenta-h7"]
title = ""
description = "The Portenta H7 follows the Arduino MKR form factor, but enhanced with the Portenta family 80 pin high-density connector. Program it with high-level languages and AI while performing low-latency operations on its customizable hardware.Get StartedBootloader Guide"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta H7 Portenta H7The Portenta H7 follows the Arduino MKR form factor, but enhanced with the Portenta family 80 pin high-density connector. Program it with high-level languages and AI while performing low-latency operations on its customizable hardware.Get StartedBootloader GuidePinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsSTEP FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Portenta H7 simultaneously runs high level code along with real time tasks, since it includes two processors that can run tasks in parallel. For example, it is possible to execute Arduino compiled code along with MicroPython one and have both cores to communicate with one another. The Portenta functionality is two-fold, it can either be running like any other embedded microcontroller board or as the main processor of an embedded computer. For instance, use the Portenta Vision Shield to transform your H7 into an industrial camera capable of performing real-time machine learning algorithms on live video feeds.Portenta H7 Microcontroller The Portenta H7 allows for programming with high-level languages and AI while performing low-latency operations on its customizable hardware.DatasheetSTM32H747XI dual Cortex®-M7+M4 32bit low power Arm® MCU H7's main microcontroller is the dual core STM32H747, including a Cortex® M7 running at 480 MHz and a Cortex® M4 running at 240 MHz. The two cores communicate via a Remote Procedure Call mechanism that allows calling functions on the other processor seamlessly.DatasheetMurata 1DX dual WiFi and Bluetooth® 5.1 The onboard wireless module allows to simultaneously manage WiFi and Bluetooth® connectivity.DatasheetChrom-ART graphical hardware Accelerator™ Probably one of the most exciting features of the Portenta H7 is the possibility of connecting an external monitor to build your own dedicated embedded computer with a user interface. This is possible thanks to the STM32H747 processor's on-chip GPU, the Chrom-ART Accelerator™. Besides the GPU, the chip includes a dedicated JPEG encoder and decoder.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
