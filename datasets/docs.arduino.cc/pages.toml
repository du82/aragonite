["https://docs.arduino.cc/arduino-cli/UPGRADING"]
title = ""
full_description = '''Go BackUpgradingArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Upgrading UpgradingAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌UpgradingHere you can find a list of migration guides to handle breaking changes, deprecations, and bugfixes that may cause problems between releases of the CLI.1.0.4The build cache path specified with compile --build-cache-path or build_cache.path now affects also sketches.Previously the specified build cache path only affected cores and it was ignored for sketches. This is now fixed and both cores and sketches are cached in the given directory.A full build of the sketch is performed if a build path is specified in compile --build-path ....Previously if a build path was specified a cached core could have been used from the global build cache path resulting in a partial build inside the given build path.Now if a build path is specified, the global build cache path is ignored and the full build is done in the given build path.compile --build-cache-path is deprecated.The change above, makes the compile --build-cache-path flag useless. It is kept just for backward compatibility.The default build_cache.path has been moved from the temp folder to the user's cache folder.Previously the build_cache.path was in $TMP/arduino. Now it has been moved to the specific OS user's cache folder, for example in Linux it happens to be $HOME/.cache/arduino.1.0.0compile --build-cache-path slightly changed directory formatNow compiled cores are cached under the cores subdir of the path specified in --build-cache-path, previously it was saved under the core subdir. The new behaviour is coherent with the default cache directory /tmp/arduino/cores/... when the cache directory is not set by the user.Configuration file now supports only YAML format.The Arduino CLI configuration file now supports only the YAML format.gRPC Setting API important changesThe Settings API has been heavily refactored. Here a quick recap of the new methods:SettingsGetValue returns the value of a setting given the key. The returned value is a string encoded in JSON, or YAML1message SettingsGetValueRequest {2 // The key to get3 string key = 1;4 // The format of the encoded_value (default is5 // "json", allowed values are "json" and "yaml)6 string value_format = 2;7}8 9message SettingsGetValueResponse {10 // The value of the key (encoded)11 string encoded_value = 1;12}SettingsSetValue change the value of a setting. The value may be specified in JSON, YAML, or as a command-line argument. If encoded_value is an empty string the setting is deleted.1message SettingsSetValueRequest {2 // The key to change3 string key = 1;4 // The new value (encoded), no objects,5 // only scalar, or array of scalars are6 // allowed.7 string encoded_value = 2;8 // The format of the encoded_value (default is9 // "json", allowed values are "json", "yaml",10 // and "cli")11 string value_format = 3;12}SettingsEnumerate returns all the available keys and their type (string, int, []string...)ConfigurationOpen replaces the current configuration with the one passed as argument. Differently from SettingsSetValue, this call replaces the whole configuration.ConfigurationSave outputs the current configuration in the specified format. The configuration is not saved in a file, this call returns just the content, it's a duty of the caller to store the content in a file.ConfigurationGet return the current configuration in a structured gRPC message Configuration.The previous gRPC Setting rpc call may be replaced as follows:The old SettingsMerge rpc call can now be done trough SettingsSetValue.The old SettingsDelete rpc call can now be done trough SettingsSetValue passing the key to delete with an empty value.The old SettingsGetAll rpc call has been replaced by ConfigurationGet that returns a structured message Configuration with all the settings populated.The old SettingsWrite rpc call has been removed. It is partially replaced by ConfigurationSave but the actual file save must be performed by the caller.golang: importing arduino-cli as a library now requires the creation of a gRPC service.Previously the methods implementing the Arduino business logic were available in the global namespace github.com/arduino/arduino-cli/commands/* and could be called directly.The above is no more true. All the global commands.* functions have been converted to methods of the arduinoCoreServerImpl struct that implements the gRPC ArduinoCoreServer interface. The configuration is now part of the server internal state. Developers may create a "daemon-less" server by calling the commands.NewArduinoCoreServer() function and can use the returned object to call all the needed gRPC functions.The methods of the ArduinoCoreServer are generated through the gRPC protobuf definitions, some of those methods are gRPC "streaming" methods and requires a streaming object to be passed as argument, we provided helper methods to create these objects.For example if previously we could call commands.Init like this:1// old Init signature2func Init(req *rpc.InitRequest, responseCallback func(r *rpc.InitResponse)) error { ... }3 4// ...5 6// Initialize instance7if err := commands.Init(&rpc.InitRequest{Instance: req.GetInstance()}, respCB); err != nil {8 return err9}now the responseCallback must be wrapped into an rpc.ArduinoCoreService_InitServer, and we provided a method exactly for that:1// new Init method2func (s *arduinoCoreServerImpl) Init(req *rpc.InitRequest, stream rpc.ArduinoCoreService_InitServer) error { ... }3 4/// ...5 6// Initialize instance7initStream := InitStreamResponseToCallbackFunction(ctx, respCB)8if err := srv.Init(&rpc.InitRequest{Instance: req.GetInstance()}, initStream); err != nil {9 return err10}Each gRPC method has an helper method to obtain the corresponding ArduinoCoreService_*Server parameter. Here a simple, but complete, example:1package main2 3import (4 "context"5 "fmt"6 "io"7 "log"8 9 "github.com/arduino/arduino-cli/commands"10 rpc "github.com/arduino/arduino-cli/rpc/cc/arduino/cli/commands/v1"11 "github.com/sirupsen/logrus"12)13 14func main() {15 // Create a new ArduinoCoreServer16 srv := commands.NewArduinoCoreServer()17 18 // Disable logging19 logrus.SetOutput(io.Discard)20 21 // Create a new instance in the server22 ctx := context.Background()23 resp, err := srv.Create(ctx, &rpc.CreateRequest{})24 if err != nil {25 log.Fatal("Error creating instance:", err)26 }27 instance := resp.GetInstance()28 29 // Defer the destruction of the instance30 defer func() {31 if _, err := srv.Destroy(ctx, &rpc.DestroyRequest{Instance: instance}); err != nil {32 log.Fatal("Error destroying instance:", err)33 }34 fmt.Println("Instance successfully destroyed")35 }()36 37 // Initialize the instance38 initStream := commands.InitStreamResponseToCallbackFunction(ctx, func(r *rpc.InitResponse) error {39 fmt.Println("INIT> ", r)40 return nil41 })42 if err := srv.Init(&rpc.InitRequest{Instance: instance}, initStream); err != nil {43 log.Fatal("Error during initialization:", err)44 }45 46 // Search for platforms and output the result47 searchResp, err := srv.PlatformSearch(ctx, &rpc.PlatformSearchRequest{Instance: instance})48 if err != nil {49 log.Fatal("Error searching for platforms:", err)50 }51 for _, platformSummary := range searchResp.GetSearchOutput() {52 installed := platformSummary.GetInstalledRelease()53 meta := platformSummary.GetMetadata()54 fmt.Printf("%30s %8s %s\n", meta.GetId(), installed.GetVersion(), installed.GetName())55 }56}YAML output format is no more supportedThe yaml option of the --format flag is no more supported. Use --format json if machine parsable output is needed.gRPC: The type field has been renamed to types in the cc.arduino.cli.commands.v1.PlatformRelease message.Rebuilding the gRPC bindings from the proto files requires to rename all access to type field as types.By the way, the wire protocol is not affected by this change, existing clients should work fine without modification.The type field has been renamed to types in the JSON output including a platform release.Since the type field may contain multiple values has been renamed to types to better express this aspect.Previously:1$ arduino-cli core list --json | jq '.platforms[4].releases."1.8.13"'2{3 "name": "Arduino SAMD (32-bits ARM Cortex-M0+) Boards",4 "version": "1.8.13",5 "type": [6 "Arduino"7 ],8 ...Now:1$ arduino-cli core list --json | jq '.platforms[4].releases."1.8.13"'2{3 "name": "Arduino SAMD (32-bits ARM Cortex-M0+) Boards",4 "version": "1.8.13",5 "types": [6 "Arduino"7 ],8 ...The gRPC cc.arduino.cli.commands.v1.CompileRequest.export_binaries changed type.Previously the field export_binaries was a google.protobuf.BoolValue. We used this type because it expresses this field's optional nature (that is, it could be true, false, and null if not set).Now the field is an optional bool, since the latest protobuf protocol changes now allows optional fields.Some gRPC responses messages now uses the oneof clause.The following responses message:cc.arduino.cli.commands.v1.PlatformInstallResponsecc.arduino.cli.commands.v1.PlatformDownloadResponsecc.arduino.cli.commands.v1.PlatformUninstallResponsecc.arduino.cli.commands.v1.PlatformUpgradeResponsecc.arduino.cli.commands.v1.DebugResponsecc.arduino.cli.commands.v1.LibraryDownloadResponsecc.arduino.cli.commands.v1.LibraryInstallResponsecc.arduino.cli.commands.v1.LibraryUpgradeResponsecc.arduino.cli.commands.v1.LibraryUninstallResponsecc.arduino.cli.commands.v1.LibraryUpgradeAllResponsecc.arduino.cli.commands.v1.ZipLibraryInstallResponsecc.arduino.cli.commands.v1.GitLibraryInstallResponsecc.arduino.cli.commands.v1.MonitorResponsenow use the oneof clause to make the stream nature of the message more explicit. Just to give an example, the PlatformInstallResponse message has been changed from:1message PlatformInstallResponse {2 // Progress of the downloads of the platform and tool files.3 DownloadProgress progress = 1;4 // Description of the current stage of the installation.5 TaskProgress task_progress = 2;6}to:1message PlatformInstallResponse {2 message Result {3 // Empty message, reserved for future expansion.4 }5 oneof message {6 // Progress of the downloads of the platform and tool files.7 DownloadProgress progress = 1;8 // Description of the current stage of the installation.9 TaskProgress task_progress = 2;10 // The installation result.11 Result result = 3;12 }13}The other messages have been changed in a similar way.The gRPC cc.arduino.cli.commands.v1.UpdateIndexResponse and UpdateLibrariesIndexResponse have changed.The responses coming from the update index commands:1message UpdateIndexResponse {2 // Progress of the package index download.3 DownloadProgress download_progress = 1;4}5 6message UpdateLibrariesIndexResponse {7 // Progress of the libraries index download.8 DownloadProgress download_progress = 1;9}are now more explicit and contains details about the result of the operation:1message UpdateIndexResponse {2 message Result {3 // The result of the packages index update.4 repeated IndexUpdateReport updated_indexes = 1;5 }6 oneof message {7 // Progress of the package index download.8 DownloadProgress download_progress = 1;9 // The result of the index update.10 Result result = 2;11 }12}13 14message UpdateLibrariesIndexResponse {15 message Result {16 // The result of the libraries index update.17 IndexUpdateReport libraries_index = 1;18 }19 oneof message {20 // Progress of the libraries index download.21 DownloadProgress download_progress = 1;22 // The result of the index update.23 Result result = 2;24 }25}The IndexUpdateReport message contains details for each index update operation performed:1message IndexUpdateReport {2 enum Status {3 // The status of the index update is unspecified.4 STATUS_UNSPECIFIED = 0;5 // The index has been successfully updated.6 STATUS_UPDATED = 1;7 // The index was already up to date.8 STATUS_ALREADY_UP_TO_DATE = 2;9 // The index update failed.10 STATUS_FAILED = 3;11 // The index update was skipped.12 STATUS_SKIPPED = 4;13 }14 15 // The URL of the index that was updated.16 string index_url = 1;17 // The result of the index update.18 Status status = 2;19}The gRPC cc.arduino.cli.commands.v1.Profile message has been removed in favor of SketchProfileThe message Profile has been replaced with SketchProfile in the InitResponse.profile field:1message InitResponse {2 oneof message {3 Progress init_progress = 1;4 google.rpc.Status error = 2;5 // Selected profile information6 SketchProfile profile = 3;7 }8}The gRPC cc.arduino.cli.commands.v1.LoadSketchResponse message has been changed.Previously the LoadSketchResponse containted all the information about the sketch:1message LoadSketchResponse {2 string main_file = 1;3 string location_path = 2;4 repeated string other_sketch_files = 3;5 repeated string additional_files = 4;6 repeated string root_folder_files = 5;7 string default_fqbn = 6;8 string default_port = 7;9 string default_protocol = 8;10 repeated SketchProfile profiles = 9;11 SketchProfile default_profile = 10;12}Now all the metadata have been moved into a specific Sketch message:1message LoadSketchResponse {2 Sketch sketch = 1;3}4 5message Sketch {6 string main_file = 1;7 string location_path = 2;8 repeated string other_sketch_files = 3;9 repeated string additional_files = 4;10 repeated string root_folder_files = 5;11 string default_fqbn = 6;12 string default_port = 7;13 string default_protocol = 8;14 repeated SketchProfile profiles = 9;15 SketchProfile default_profile = 10;16}Drop support for builtin.toolsWe're dropping the builtin.tools support. It was the equivalent of Arduino IDE 1.x bundled tools directory.The gRPC cc.arduino.cli.commands.v1.MonitorRequest message has been changed.Previously the MonitorRequest was a single message used to open the monitor, to stream data, and to change the port configuration:1message MonitorRequest {2 // Arduino Core Service instance from the `Init` response.3 Instance instance = 1;4 // Port to open, must be filled only on the first request5 Port port = 2;6 // The board FQBN we are trying to connect to. This is optional, and it's7 // needed to disambiguate if more than one platform provides the pluggable8 // monitor for a given port protocol.9 string fqbn = 3;10 // Data to send to the port11 bytes tx_data = 4;12 // Port configuration, optional, contains settings of the port to be applied13 MonitorPortConfiguration port_configuration = 5;14}Now the meaning of the fields has been clarified with the oneof clause, making it more explicit:1message MonitorRequest {2 oneof message {3 // Open request, it must be the first incoming message4'''
