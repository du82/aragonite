["https://docs.arduino.cc/hardware/mkr-gsm-1400"]
title = ""
description = "The Arduino MKR GSM 1400 is a great starting point for building IoT projects connected to GSM / 3G network. Whether you are looking at building a sensor network for agricultural projects, or for urban data collection, the MKR GSM 1400 is your go-to board for IoT projects when Wi-Fi® is not available.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR GSM 1400 MKR GSM 1400End of LifeThe Arduino MKR GSM 1400 is a great starting point for building IoT projects connected to GSM / 3G network. Whether you are looking at building a sensor network for agricultural projects, or for urban data collection, the MKR GSM 1400 is your go-to board for IoT projects when Wi-Fi® is not available.Get StartedPinoutDownloadable resourcesPinout (PDF)SchematicsFritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR GSM 1400 is a great option for GSM / 3G connectivity projects. Using the popular Arm® Cortex®-M0 32-bit SAMD21 processor, it also features the powerful u-blox SARA-U201 module and the ECC508 crypto-chip for security. The board is part of the MKR family, where you can choose from a large variety of shields to build projects out of the box with minimal effort!GSM / 3G Connectivity Enables GSM / 3G connectivity for the MKR GSM 1400 board.DocumentationlibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
