["https://docs.arduino.cc/arduino-cli/getting-started"]
title = ""
full_description = '''Go BackGetting startedArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Getting started Getting startedAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌Arduino CLI provides all the features you can find in the Arduino IDE. Let's see some examples.Before you startarduino-cli is a container of commands and each command has its own dedicated help text that can be shown with the help command like this:1$ arduino-cli help core2Arduino core operations.3 4Usage:5 arduino-cli core [command]6 7Examples:8 arduino-cli core update-index9 10Available Commands:11 download Downloads one or more cores and corresponding tool dependencies.12 install Installs one or more cores and corresponding tool dependencies.13 list Shows the list of installed platforms.14 search Search for a core in Boards Manager.15 uninstall Uninstalls one or more cores and corresponding tool dependencies if no longer used.16 update-index Updates the index of cores.17 upgrade Upgrades one or all installed platforms to the latest version.18 19Flags:20 -h, --help help for core21 22Global Flags:23 --additional-urls strings Comma-separated list of additional URLs for the Boards Manager.24 --config-file string The custom config file (if not specified the default will be used).25 --json Print the output in JSON format.26 --log Print the logs on the standard output.27 --log-file string Path to the file where logs will be written.28 --log-format string The output format for the logs, can be: text, json29 --log-level string Messages with this level and above will be logged. Valid levels are: trace, debug, info, warn, error, fatal, panic30 --no-color Disable colored output.31 32Use "arduino-cli core [command] --help" for more information about a command.Create a configuration fileArduino CLI doesn't strictly require a configuration file to work because the command line interface provides any possible functionality. However, having one can spare you a lot of typing when issuing a command, so let's go ahead and create it with:1$ arduino-cli config init2Config file written: /home/luca/.arduino15/arduino-cli.yamlIf you inspect the contents of arduino-cli.yaml, you'll find the available options with their respective default values. For more information, see the configuration documentation.Create a new sketchTo create a new sketch named MyFirstSketch in the current directory, run the following command:1$ arduino-cli sketch new MyFirstSketch2Sketch created in: /home/luca/MyFirstSketchA sketch is a folder containing assets like source files and libraries; the new command creates for you a .ino file called MyFirstSketch.ino containing Arduino boilerplate code:1$ cat $HOME/MyFirstSketch/MyFirstSketch.ino2void setup() {3}4 5void loop() {6}At this point you can use your favourite file editor or IDE to open the file $HOME/MyFirstSketch/MyFirstSketch.ino and change the code like this:1void setup() {2 pinMode(LED_BUILTIN, OUTPUT);3}4 5void loop() {6 digitalWrite(LED_BUILTIN, HIGH);7 delay(1000);8 digitalWrite(LED_BUILTIN, LOW);9 delay(1000);10}Connect the board to your PCThe first thing to do upon a fresh install is to update the local cache of available platforms and libraries by running:1$ arduino-cli core update-index2Updating index: package_index.json downloadedAfter connecting the board to your PC by using the USB cable, you should be able to check whether it's been recognized by running:1$ arduino-cli board list2Port Type Board Name FQBN Core3/dev/ttyACM1 Serial Port (USB) Arduino/Genuino MKR1000 arduino:samd:mkr1000 arduino:samdIn this example, the MKR1000 board was recognized and from the output of the command you see the platform core called arduino:samd is the one that needs to be installed to make it work.If you see an Unknown board listed, uploading should still work as long as you identify the platform core and use the correct FQBN string. When a board is not detected for whatever reason, you can list all the supported boards and their FQBN strings by running the following:1$ arduino-cli board listall mkr2Board Name FQBN3Arduino MKR FOX 1200 arduino:samd:mkrfox12004Arduino MKR GSM 1400 arduino:samd:mkrgsm14005Arduino MKR WAN 1300 arduino:samd:mkrwan13006Arduino MKR WiFi 1010 arduino:samd:mkrwifi10107Arduino MKRZERO arduino:samd:mkrzero8Arduino/Genuino MKR1000 arduino:samd:mkr1000Install the core for your boardTo install the arduino:samd platform core, run the following:1$ arduino-cli core install arduino:samd2Downloading tools...3arduino:arm-none-eabi-gcc@4.8.3-2014q1 downloaded4arduino:bossac@1.7.0 downloaded5arduino:openocd@0.9.0-arduino6-static downloaded6arduino:CMSIS@4.5.0 downloaded7arduino:CMSIS-Atmel@1.1.0 downloaded8arduino:arduinoOTA@1.2.0 downloaded9Downloading cores...10arduino:samd@1.6.19 downloaded11Installing tools...12Installing platforms...13Results:14arduino:samd@1.6.19 - Installed15arduino:arm-none-eabi-gcc@4.8.3-2014q1 - Installed16arduino:bossac@1.7.0 - Installed17arduino:openocd@0.9.0-arduino6-static - Installed18arduino:CMSIS@4.5.0 - Installed19arduino:CMSIS-Atmel@1.1.0 - Installed20arduino:arduinoOTA@1.2.0 - InstalledNow verify we have installed the core properly by running:1$ arduino-cli core list2ID Installed Latest Name3arduino:samd 1.6.19 1.6.19 Arduino SAMD Boards (32-bits ARM Cortex-M0+)Great! Now we are ready to compile and upload the sketch.Adding 3rd party coresIf your board requires 3rd party core packages to work, you can list the URLs to additional package indexes in the Arduino CLI configuration file.For example, to add the ESP8266 core, edit the configuration file and change the board_manager settings as follows:1board_manager:2 additional_urls:3 - https://arduino.esp8266.com/stable/package_esp8266com_index.jsonIf you have your package indexes locally installed, you can list their file path in the Arduino CLI configuration file.For example, to add the NRF52832 core, edit the configuration file and change the board_manager settings as follows:1board_manager:2 additional_urls:3 - https://arduino.esp8266.com/stable/package_esp8266com_index.json4 - file:///absolute/path/to/your/package_nrf52832_index.jsonFrom now on, commands supporting custom cores will automatically use the additional URL from the configuration file:1$ arduino-cli core update-index2Updating index: package_index.json downloaded3Updating index: package_esp8266com_index.json downloaded4Updating index: package_nrf52832_index.json5Updating index: package_index.json downloaded6 7$ arduino-cli core search esp82668ID Version Name9esp8266:esp8266 2.5.2 esp8266Alternatively, you can pass a link to the additional package index file with the --additional-urls option, that has to be specified every time and for every command that operates on a 3rd party platform core, for example:1$ arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json2Updating index: package_esp8266com_index.json downloaded3 4$ arduino-cli core search esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json5ID Version Name6esp8266:esp8266 2.5.2 esp8266The same applies to the additional package index file provided by file paths:1$ arduino-cli core update-index --additional-urls file:///absolute/path/to/your/package_esp8266com_index.json2Updating index: package_esp8266com_index.json downloaded3 4$ arduino-cli core search esp8266 --additional-urls file:///absolute/path/to/your/package_esp8266com_index.json5ID Version Name6esp8266:esp8266 2.5.2 esp8266Compile and upload the sketchTo compile the sketch you run the compile command, passing the proper FQBN string:1$ arduino-cli compile --fqbn arduino:samd:mkr1000 MyFirstSketch2Sketch uses 9600 bytes (3%) of program storage space. Maximum is 262144 bytes.To upload the sketch to your board, run the following command, using the serial port your board is connected to:1$ arduino-cli upload -p /dev/ttyACM0 --fqbn arduino:samd:mkr1000 MyFirstSketch2No new serial port detected.3Atmel SMART device 0x10010005 found4Device : ATSAMD21G18A5Chip ID : 100100056Version : v2.0 [Arduino:XYZ] Dec 20 2016 15:36:437Address : 81928Pages : 39689Page Size : 64 bytes10Total Size : 248KB11Planes : 112Lock Regions : 1613Locked : none14Security : false15Boot Flash : true16BOD : true17BOR : true18Arduino : FAST_CHIP_ERASE19Arduino : FAST_MULTI_PAGE_WRITE20Arduino : CAN_CHECKSUM_MEMORY_BUFFER21Erase flash22done in 0.784 seconds23 24Write 9856 bytes to flash (154 pages)25[==============================] 100% (154/154 pages)26done in 0.069 seconds27 28Verify 9856 bytes of flash with checksum.29Verify successful30done in 0.009 seconds31CPU reset.Add librariesIf you need to add more functionalities to your sketch, chances are some of the libraries available in the Arduino ecosystem already provide what you need. For example, if you need a debouncing strategy to better handle button inputs, you can try searching for the debouncer keyword:1$ arduino-cli lib search debouncer2Name: "Debouncer"3 Author: hideakitai4 Maintainer: hideakitai5 Sentence: Debounce library for Arduino6 Paragraph: Debounce library for Arduino7 Website: https://github.com/hideakitai8 Category: Timing9 Architecture: *10 Types: Contributed11 Versions: [0.1.0]12Name: "FTDebouncer"13 Author: Ubi de Feo14 Maintainer: Ubi de Feo, Sebastian Hunkeler15 Sentence: An efficient, low footprint, fast pin debouncing library for Arduino16 Paragraph: This pin state supervisor manages debouncing of buttons and handles transitions between LOW and HIGH state, calling a function and notifying your code of which pin has been activated or deactivated.17 Website: https://github.com/ubidefeo/FTDebouncer18 Category: Uncategorized19 Architecture: *20 Types: Contributed21 Versions: [1.3.0]22Name: "SoftTimer"23 Author: Balazs Kelemen <prampec+arduino@gmail.com>24 Maintainer: Balazs Kelemen <prampec+arduino@gmail.com>25 Sentence: SoftTimer is a lightweight pseudo multitasking solution for Arduino.26 Paragraph: SoftTimer enables higher level Arduino programing, yet easy to use, and lightweight. You are often faced with the problem that you need to do multiple tasks at the same time. In SoftTimer, the programmer creates Tasks that runs periodically. This library comes with a collection of handy tools like blinker, pwm, debouncer.27 Website: https://github.com/prampec/arduino-softtimer28 Category: Timing29 Architecture: *30 Types: Contributed31 Versions: [3.0.0, 3.1.0, 3.1.1, 3.1.2, 3.1.3, 3.1.5, 3.2.0]Our favourite is FTDebouncer, let's install it by running:1$ arduino-cli lib install FTDebouncer2FTDebouncer depends on FTDebouncer@1.3.03Downloading FTDebouncer@1.3.0...4FTDebouncer@1.3.0 downloaded5Installing FTDebouncer@1.3.0...6Installed FTDebouncer@1.3.0Using the daemon mode and the gRPC interfaceArduino CLI can be launched as a gRPC server via the daemon command.The client_example folder contains a sample client code that shows how to interact with the gRPC server. Available services and messages are detailed in the gRPC reference pages.To provide observability for the gRPC server activities besides logs, the daemon mode activates and exposes by default a Prometheus endpoint (http://localhost:9090/metrics) that can be fetched for metrics data like:1# TYPE daemon_compile counter2daemon_compile{buildProperties="",exportFile="",fqbn="arduino:samd:mkr1000",installationID="ed6f1f22-1fbe-4b1f-84be-84d035b6369c",jobs="0",libraries="",preprocess="false",quiet="false",showProperties="false",sketchPath="5ff767c6fa5a91230f5cb4e267c889aa61489ab2c4f70f35f921f934c1462cb6",success="true",verbose="true",vidPid="",warnings=""} 1 15803857247263 4# TYPE daemon_board_list counter5daemon_board_list{installationID="ed6f1f22-1fbe-4b1f-84be-84d035b6369c",success="true"} 1 1580385724833The metrics settings are exposed via the metrics section in the CLI configuration:1metrics:2 enabled: true3 addr: :9090In this page you can check the latest version of the Arduino CLI. You can find previous versions here.ON THIS PAGEBefore you startCreate a configuration fileCreate a new sketchConnect the board to your PCInstall the core for your boardAdding 3rd party coresCompile and upload the sketchAdd librariesUsing the daemon mode and the gRPC interface'''
