["https://docs.arduino.cc/hardware/leonardo"]
title = ""
description = "The Leonardo differs from all preceding boards in that the ATmega32u4 has built-in USB communication, eliminating the need for a secondary processor. This allows the Leonardo to appear to a connected computer as a mouse and keyboard, in addition to a virtual (CDC) serial / COM port.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Leonardo LeonardoThe Leonardo differs from all preceding boards in that the ATmega32u4 has built-in USB communication, eliminating the need for a secondary processor. This allows the Leonardo to appear to a connected computer as a mouse and keyboard, in addition to a virtual (CDC) serial / COM port.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsCAD FilesFeaturesTech SpecsCompatibilitySuggested LibrariesThe Arduino Leonardo is a microcontroller board based on the ATmega32u4. It has 20 digital input/output pins (of which 7 can be used as PWM outputs and 12 as analog inputs), a 16 MHz crystal oscillator, a micro USB connection, a power jack, an ICSP header, and a reset button. It contains everything needed to support the microcontroller; simply connect it to a computer with a USB cable or power it with a AC-to-DC adapter or battery to get started.USB communicationThe Arduino Leonardo has built-in USB communication that allows the Micro to appear as a mouse/keyboard on your machine.Keyboard LibraryMouse LibraryBattery ConnectorThe Arduino Leonardo features a barrel plug connector, that works great with a standard 9V battery to give extra power to your projects.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
