["https://docs.arduino.cc/arduino-cli/installation"]
title = ""
full_description = '''Go BackInstallationArduino CLIHomeInstallationUpgradingGetting startedHow to ContributeFAQCommand line completionConfigurationIntegration optionsLibrary specificationPackage index json specificationPlatform specificationPluggable discovery specificationPluggable monitor specificationSketch build processSketch project fileSketch specificationBackward compatibility policyGuidesSecure bootgRPC ReferenceCommandsHome / Software / Arduino CLI / Installation InstallationAuthor Arduinov1.1.1‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌‌Several options are available for installation of Arduino CLI. Instructions for each are provided below:Install via Homebrew (macOS/Linux)The Arduino CLI is available as a Homebrew formula since version 0.5.0:1brew update2brew install arduino-cliCommand line completionCommand line completion files are already bundled in the homebrew installation.Use the install scriptThe script requires sh, which is always available on Linux and macOS. sh is not available by default on Windows, though it is available as part of Git for Windows (Git Bash). If you don't have sh available, use the "Download" installation option.This script will install the latest version of Arduino CLI to $PWD/bin:1curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | shIf you want to target a different directory, for example ~/local/bin, set the BINDIR environment variable like this:1curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=~/local/bin shIf you would like to use the arduino-cli command from any location, install Arduino CLI to a directory already in your PATH or add the Arduino CLI installation path to your PATH environment variable.If you want to download a specific Arduino CLI version, for example 0.9.0 or nightly-latest, pass the version number as a parameter like this:1curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 0.9.0Arduino CLI checks for new releases every 24 hours. If you don't like this behaviour you can disable it by setting the updater.enable_notification config or the env var ARDUINO_UPDATER_ENABLE_NOTIFICATION to false.DownloadPre-built binaries for all the supported platforms are available for download from the links below.If you would like to use the arduino-cli command from any location, extract the downloaded file to a directory already in your PATH or add the Arduino CLI installation path to your PATH environment variable.Latest releasePlatformLinux32 bit64 bitLinux ARM32 bit64 bitLinux ARMv632 bitWindows exe32 bit64 bitWindows msi64 bitmacOS64 bitmacOS ARM64 bitPrevious versionsThese are available from the "Assets" sections on the releases page.Nightly buildsThese builds are generated every day at 01:00 GMT from the master branch and should be considered unstable. In order to get the latest nightly build available for the supported platform, use the following links:PlatformLinux32 bit64 bitLinux ARM32 bit64 bitLinux ARMv632 bitWindows exe32 bit64 bitWindows msi64 bitmacOS64 bitmacOS ARM64 bitThese links return a 302: Found response, redirecting to latest generated builds by replacing latest with the latest available build date, using the format YYYYMMDD (i.e for 2019-08-06 latest is replaced with 20190806 )Checksums for the nightly builds are available at https://downloads.arduino.cc/arduino-cli/nightly/nightly-<DATE>-checksums.txtBuild from sourceIf you're familiar with Golang or if you want to contribute to the project, you will probably build Arduino CLI locally with your Go toolchain. See the "How to contribute" page for instructions.In this page you can check the latest version of the Arduino CLI. You can find previous versions here.ON THIS PAGEInstall via Homebrew (macOS/Linux)Use the install scriptDownloadBuild from source'''
year_published = 2025
clearnet = "https://docs.arduino.cc/arduino-cli/installation"
