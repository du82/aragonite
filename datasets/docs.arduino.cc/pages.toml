description = "Start taking advantage of the fast data throughput and high bandwidths offered by the Arduino Pro 4G Module.Mid Carrier User ManualMax Carrier User Manual"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Pro 4G Module Pro 4G ModuleStart taking advantage of the fast data throughput and high bandwidths offered by the Arduino Pro 4G Module.Mid Carrier User ManualMax Carrier User ManualBuy nowDownloadable resourcesDatasheetFeaturesTutorialsTech SpecsCompatibilitySuggested Libraries Designed in the widely used mini PCIe format, this device features a reliable Cat.4 modem from Quectel, ensuring stable 4G connection and supporting backward compatibility with 2G and 3G networks. It comes in two versions: EMEA and Global (including the US). It can be used with different Portenta boards for applications like smart city and building projects, remote maintenance, and fleet management.Marvell ASR1803 / Qualcomm MDM9x07 Arduino Pro 4G Module is available in two variants: the EMEA variant is powered by Quectel EC200A-EU based on the ASR1803 chipset from Marvell, while the Global variant leverages the Quectel EG25-G based on MDM9x07 chipset from Qualcomm.Mini PCIe Interface It uses a Mini PCIe connector in compliance with the PCI Express Mini Card 1.2 Standard, offering high-speed data exchange and seamless compatibility with a range of compatible carrier boards.LTE Connectivity The module integrates LTE Category 4 (CAT4) 4G technology, providing high-speed data transmission. Additionally, it features 2G/3G fallback capabilities, providing reliable connectivity in areas where 4G LTE coverage may not be available, thus ensuring continuous access to essential data services.Global Navigation Satellite System (GNSS) Global variant supports GNSS using the NMEA 0183 protocol, ensuring accurate global positioning by integrating GPS, GLONASS, BeiDou (also known as COMPASS), Galileo, and QZSS satellite systems for enhanced navigational reliability and tracking performance in various applications.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
