["https://docs.arduino.cc/hardware/mkr-nb-1500"]
title = ""
description = "The Arduino MKR NB 1500 adds Narrowband communication to your projects. It can communicate over NB-IoT and LTE-M networks, and is excellent to use for low-power projects in remote areas. The MKR NB 1500 is also compatible with the Arduino Cloud, making it easy to access wherever you are in the world.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR NB 1500 MKR NB 1500The Arduino MKR NB 1500 adds Narrowband communication to your projects. It can communicate over NB-IoT and LTE-M networks, and is excellent to use for low-power projects in remote areas. The MKR NB 1500 is also compatible with the Arduino Cloud, making it easy to access wherever you are in the world.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsFritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR NB 1500 brings NB-IoT / CAT-M1 connectivity to your projects. Using the popular Arm® Cortex®-M0 32-bit SAMD21 processor, it also features the powerful uBlox SARA-R410M-02B module and the ECC508 crypto-chip for security. The board is part of the MKR family, where you can choose from a large variety of shields to build projects out of the box with minimal effort!Network ConnectivityThis module can communicate over the LTE-M, NB-IoT and EGPRS networks and it is possible to send and receive SMS.DocumentationlibraryCoverageNB-IoT and LTE-M coverage includes many regions, such as Europe, North & South America and large parts of Asia.Link to mapConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
