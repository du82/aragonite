["https://docs.arduino.cc/hardware/portenta-h7-lite"]
title = ""
description = "The Portenta H7 Lite follows the Arduino MKR form factor, but enhanced with the Portenta family 80 pin high-density connector. Program it with high-level languages and AI while performing low-latency operations on its customizable hardware.Get StartedBootloader Guide"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta H7 Lite Portenta H7 LiteThe Portenta H7 Lite follows the Arduino MKR form factor, but enhanced with the Portenta family 80 pin high-density connector. Program it with high-level languages and AI while performing low-latency operations on its customizable hardware.Get StartedBootloader GuidePinoutBuy nowDownloadable resourcesSchematicsDatasheetSTEP FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Portenta H7 Lite is very similar to the Portenta H7, that simultaneously can run high level code along with real time tasks thanks to its two processors. It is, for example, possible to execute Arduino compiled code along with MicroPython one and have both cores to communicate with one another. However, the H7 Lite is a low-cost board with H7 functionalities that can be configured to specific use cases.Portenta H7 Microcontroller The Portenta H7 allows for programming with high-level languages and AI while performing low-latency operations on its customizable hardware.DatasheetSTM32H747XI dual Cortex®-M7+M4 32bit low power Arm® MCU H7's main processor is the dual core STM32H747 including a Cortex® M7 running at 480 MHz and a Cortex® M4 running at 240 MHz. The two cores communicate via a Remote Procedure Call mechanism that allows calling functions on the other processor seamlessly.DatasheetConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
