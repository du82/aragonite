["https://docs.arduino.cc/hardware/uno-r4-wifi"]
title = ""
description = "The Arduino UNO R4 WiFi is designed around the 32-bit microcontroller RA4M1 from Renesas while also featuring a ESP32 module for Wi-Fi® and Bluetooth® connectivity. Its distinctive 12x8 LED matrix makes it possible to prototype visuals directly on the board, and with a Qwiic connector, you can create projects plug-and-play style.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO R4 WiFi UNO R4 WiFiThe Arduino UNO R4 WiFi is designed around the 32-bit microcontroller RA4M1 from Renesas while also featuring a ESP32 module for Wi-Fi® and Bluetooth® connectivity. Its distinctive 12x8 LED matrix makes it possible to prototype visuals directly on the board, and with a Qwiic connector, you can create projects plug-and-play style.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MCU on the board is the high performance Renesas RA4M1 (Arm® Cortex®-M4) with a 48 MHz clock speed, 32 kB SRAM and 256 kB flash memory. This MCU features an RTC, a DAC and a CAN bus and has support for HID via USB.The UNO R4 WiFi also features an ESP32-S3 for Wi-Fi®/Bluetooth® connectivity, which can also be separately programmed via a specific header.Arduino CloudThe UNO R4 WiFi is compatible with the Arduino Cloud platform. Build IoT projects in just minutes!Go to PlatformUser ManualA reference to all technical features on this board, with pointers to additional documents.User Manual5 V Operating VoltageThe RA4M1 and the GPIOs of this board operates on 5 V.LED MatrixLearn how to create animations and graphics on the 12x8 LED matrix.DocumentationReal-Time Clock (RTC)Keep track of time & date and set alarms with the built-in RTC.DocumentationDigital-to-Analog Converter (DAC)Use the onboard 12-bit DAC to build sophisticated audio projects.DocumentationMouse/Keyboard Emulation (HID)Build game controllers by emulating a mouse/keyboard.DocumentationInput VoltagePower your UNO R4 board through the VIN pin or the barrel jack at up to 6-24 V.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
