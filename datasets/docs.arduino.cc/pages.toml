["https://docs.arduino.cc/hardware/uno-rev3-smd"]
title = ""
description = "The Arduino UNO is the best board to get started with electronics and coding. If this is your first experience tinkering with the platform, the UNO is the most robust board you can start playing with. The UNO is the most used and documented board of the whole Arduino family.Get Started"
full_description = 'Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO R3 SMD UNO R3 SMDThe Arduino UNO is the best board to get started with electronics and coding. If this is your first experience tinkering with the platform, the UNO is the most robust board you can start playing with. The UNO is the most used and documented board of the whole Arduino family.Get StartedPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesArduino UNO SMD is a microcontroller board based on the ATmega328P. It has 14 digital input/output pins (of which 6 can be used as PWM outputs), 6 analog inputs, a 16 MHz ceramic resonator, a USB connection, a power jack, an ICSP header and a reset button. It contains everything needed to support the microcontroller; simply connect it to a computer with a USB cable or power it with a AC-to-DC adapter or battery to get started.The "SMD" stands for surface-mount device, and the microcontroller (ATmega328p) is soldered directly to the board.EEPROMThe ATmega328P also features 1kb of EEPROM, a memory which is not erased when powered off.DocumentationBattery ConnectorThe Arduino UNO features a barrel plug connector, that works great with a standard 9V battery.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?'
