["https://docs.arduino.cc/hardware/mkr-motor-carrier"]
title = ""
description = "The MKR Motor Carrier makes it easy to control servo, DC and stepper motors. With a number of different built in motor drivers, several easy connectors for motors and batteries and support for encoders, this powerhouse of a carrier is a must for any MKR projects involving motors.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR Motor Carrier MKR Motor CarrierThe MKR Motor Carrier makes it easy to control servo, DC and stepper motors. With a number of different built in motor drivers, several easy connectors for motors and batteries and support for encoders, this powerhouse of a carrier is a must for any MKR projects involving motors.Get StartedPinoutBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR Motor Carrier features a ATSAMD11 processor for automated control of the outputs, two MC33926 DC / servo motor drivers and two DRV8871 DC motor drivers. It also features screw terminals for motor outputs, male header pins for motor outputs, an I2C connector, encoder inputs, LiPo battery connector and battery reading capabilities.ATSAMD11The MKR Motor Carrier features an on-board processor for automated control the outputs.DatasheetMC33926The MKR Motor Carrier features a DC / Servo motor driver capable of handling currents up to 5A.DatasheetDRV8871The MKR Motor Carrier features a DC motor driver with PWM control capable of handling currents up to 3A.DatasheetMotor outputsThe carrier features four servo motor outputs and four DC motor outputs (two standard, two high performance).Encoder inputsThe MKR Motor Carrier features two inputs for encoders.Screw terminalsScrew terminals makes connections more robust for projects in motion.LiPo battery connectorConnect a 6.5V - 11.1V battery to either the male headers (2S and 3S compatible) or to the screw terminals.Male header pinsSeveral male header connections for DC / servo motors are available. In addition, it also has a 4 pin I2C connector.Battery statusThe MKR Motor Carrier is capable of reading the current status of batteries.DocumentationLibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
