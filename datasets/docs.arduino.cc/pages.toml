["https://docs.arduino.cc/hardware/9-axis-motion-shield"]
title = ""
description = "Allow your Arduino to measure movement: orientation, acceleration and magnetic field!"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / 9 Axis Motion Shield 9 Axis Motion ShieldAllow your Arduino to measure movement: orientation, acceleration and magnetic field!Buy nowDownloadable resourcesSchematicsCAD FilesFeaturesTech SpecsCompatibilitySuggested LibrariesThe Arduino 9 Axis Motion Shield is based on the BNO055 absolute orientation sensor from Bosch Sensortec GmbH which integrates a triaxial 14-bit accelerometer, a triaxial 16-bit gyroscope with a range of ±2000 degrees per second and a triaxial geomagnetic sensor with a 32-bit microcontroller running the BSX3.0 FusionLib software.BNO055 sensor features three-dimensional acceleration, yaw rate, and magnetic field strength data each in 3 perpendicular axes. It also provides the sensor fusion signals such as quaternion, euler angles, rotation vector, linear acceleration, and gravity vector.IMUThe 9-axis orientation sensor from Bosch consists of three sensors: gyroscope, accelerometer and geomagnetic sensor.LibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
