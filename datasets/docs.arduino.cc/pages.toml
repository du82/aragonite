["https://docs.arduino.cc/hardware/uno-wifi-rev2"]
title = ""
description = "The Arduino UNO WiFi Rev2 is the easiest point of entry to basic IoT with the standard form factor of the UNO family. Whether you are looking at building a sensor network connected to your office or home router, or if you want to create a Bluetooth® Low Energy device sending data to a cellphone, the Arduino UNO WiFi Rev2 is your one-stop-solution for many of the basic IoT application scenarios.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO WiFi Rev2 UNO WiFi Rev2The Arduino UNO WiFi Rev2 is the easiest point of entry to basic IoT with the standard form factor of the UNO family. Whether you are looking at building a sensor network connected to your office or home router, or if you want to create a Bluetooth® Low Energy device sending data to a cellphone, the Arduino UNO WiFi Rev2 is your one-stop-solution for many of the basic IoT application scenarios.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)SchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Arduino UNO WiFi Rev 2 features the secure ATECC608 crypto chip accelerator, using the ATmega4809 8-bit microcontroller from Microchip. It also has an onboard IMU (Inertial Measurement Unit), LSM6DS3TR and features the NINA-W102 Wi-Fi & Bluetooth® module from u-Blox.Bluetooth® / WiFiEnables Bluetooth® and Wi-Fi connectivity for the UNO WiFi Rev2 board.DocumentationLibraryIMUThe UNO WiFi Rev2 comes with the LSM6DS3TR, a low-power IMU module that includes a 3D digital accelerometer & gyroscope.LibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
