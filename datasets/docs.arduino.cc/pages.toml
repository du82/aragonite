["https://docs.arduino.cc/hardware/portenta-cat-m1-nb-iot-gnss-shield"]
title = ""
description = "Unleash global connectivity and localization capabilities of your Portenta or MKR board with the Arduino® Portenta Cat. M1/NB IoT GNSS Shield. This shield enables cellular connectivity to both Cat. M1 and NB-IoT networks with the option to use eSIM technology. Easily track your valuable assets across the city worldwide with your choice of GPS, GLONASS, Galileo or BeiDou.Get StartedCheat Sheet"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta Cat. M1/NB IoT GNSS Shield Portenta Cat. M1/NB IoT GNSS ShieldUnleash global connectivity and localization capabilities of your Portenta or MKR board with the Arduino® Portenta Cat. M1/NB IoT GNSS Shield. This shield enables cellular connectivity to both Cat. M1 and NB-IoT networks with the option to use eSIM technology. Easily track your valuable assets across the city worldwide with your choice of GPS, GLONASS, Galileo or BeiDou.Get StartedCheat SheetPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsSTEP FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Portenta Cat. M1/NB IoT GNSS Shield brings cellular communication and localization on the Portenta H7 boards. The shield leverages a Cinterion TX62 wireless module designed for highly efficient, low-power IoT applications to deliver optimized bandwidth and performance. To use the GNSS functions you will need an antenna like this one.Low power global communityNB-IoT and Cat-M1 are both 3GPP standardized technologies built on next generation network architecture for low power IoT connectivity. Portenta Form FactorThe Portenta Cat.M1/NB IoT GNSS Shield has been specifically designed to provide reliable connectivity to the Portenta family of boards for a wide range of telemetry applications. 3GPPGain direct access to the TX62 hardware using the various pads provided on the shield. Service Provider Compatibility and End-Device Certification: Please be aware that the Portenta Cat. M1/NB IoT GNSS Shield is not certified as an End-Device by all cellular network providers. If you encounter difficulties with network connection, we recommend checking with your service provider to verify if End-Device certification is required for network access. Switching to a provider that does not have such requirements may resolve these issues. We advise reviewing this compatibility information during setup to ensure optimal device performance and to prevent potential service interruptions.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
