["https://docs.arduino.cc/hardware/4-relays-shield"]
title = ""
description = "The Arduino 4 Relays Shield allows your Arduino driving high power loads.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / 4 Relays Shield 4 Relays ShieldThe Arduino 4 Relays Shield allows your Arduino driving high power loads.Get StartedBuy nowDownloadable resourcesSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Arduino 4 Relays Shield is a solution for driving high power loads that cannot be controlled by Arduino's digital IOs, due to the current and voltage limits of the controller. The Shield features four relays, each relay provides 2 pole changeover contacts (NO and NC); in order to increase the current limit of each output the 2 changeover contacts have been put in parallel. Four LEDs indicate the on/off state of each relay.RelaysThe shield comes with 4 relays with a maximum of 48V loads.DocumentationStatus LEDsThe shield comes with 4 status LEDs to know what state the relays are in.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
