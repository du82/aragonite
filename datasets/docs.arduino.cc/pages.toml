["https://docs.arduino.cc/hardware/uno-mini-limited-edition"]
title = ""
description = "The Arduino UNO Mini Limited Edition (LE) is a unique black & gold board, that pays tribute to everyone's favorite maker board: the Arduino UNO. It is only 25% of the area size of the original UNO, comes with a USB-C® connector and is delivered in a special case.Get Started"
full_description = '''Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO Mini Limited Edition UNO Mini Limited EditionThe Arduino UNO Mini Limited Edition (LE) is a unique black & gold board, that pays tribute to everyone's favorite maker board: the Arduino UNO. It is only 25% of the area size of the original UNO, comes with a USB-C® connector and is delivered in a special case.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsFritzing FilesCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe UNO Mini Limited Edition (LE) is a miniature version of the classic Arduino UNO board. It is based on the ATmega328P microcontroller, has USB-C® connector for programming and powering the board, and pins available for connecting external power sources. It also comes with the standard set of female pin connectors, built-in LED, reset button and everything else that the standard UNO have, but at 25% the area size!.Tiny Form FactorThe UNO Mini LE is roughly 25% the area size of the classic UNO board (but equally as powerful).DocumentationPin Header PitchThe pitch (distance between pin holes) is 0.05", or 1.27 mm. This is half the distance compared to the classic, regular sized UNO (0.1", 2.54 mm).Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?'''
