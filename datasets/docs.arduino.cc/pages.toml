["https://docs.arduino.cc/hardware/yun-rev2"]
title = ""
description = "The Yún Rev2, Linux powered board with the Arduino simplicity, is the perfect board for your IoT projects!"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Yún Rev2 Yún Rev2End of LifeThe Yún Rev2, Linux powered board with the Arduino simplicity, is the perfect board for your IoT projects!PinoutDownloadable resourcesPinout (PDF)SchematicsFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe Yún Rev2 has the power of a Linux based system that enables advanced network connections and applications. Connecting to your Wi-Fi or wired network is simple thanks to the Yún Web Panel and the dedicated YunFirstConfig sketch. The Web panel allows you to manage your shield preferences and upload your sketch. The Yún Rev2 uses the Bridge library and so extends the board capabilities by using the Linux processor.Linux based systemThe Yún Rev2 is based on a Linux system that enables network connections and applications.DocumentationInternet connectionThe Yún Rev2 board allows you to connect to the internet using the onboard WiFi or Ethernet connection.DocumentationConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
