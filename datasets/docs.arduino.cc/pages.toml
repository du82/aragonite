title = ""
description = "The sensors, circuits and display integrated on the MKR IoT Carrier Rev2 leaves you free to focus on prototyping and programming your IoT projects.User Manual"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR IoT Carrier Rev2 MKR IoT Carrier Rev2The sensors, circuits and display integrated on the MKR IoT Carrier Rev2 leaves you free to focus on prototyping and programming your IoT projects.User ManualInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR IoT Carrier comes equipped with 5 RGB LEDs, 5 capacitive touch buttons, a colored display, IMU and a variety of quality sensors. It also features a battery holder for a 18650 Li-Ion battery, SD card holder and Grove connectors.RGB LEDsThe MKR IoT Carrier has 5 RGB LEDs that are easily accessible through the Arduino_MKRIoTCarrier library.DocumentationLibraryDisplayThe MKR IoT Carrier comes with an integrated display, letting you create graphical UIs with the 240x240 resolution display.DocumentationLibraryIMUThe MKR IoT Carrier comes with an IMU, combining an accelerometer and a gyroscope with a dedicated machine learning core.DocumentationLibraryEnvironmental sensorAn Environmental sensor that can measure pressure, humidity and temperature and comes with an onboard smart gas sensor.DocumentationLibraryColor SensorAn ambient light and RGB color sensor with gesture detection.DocumentationLibrary3x Grove connectorsThe carrier features two analog I/O and one I2C Grove connector.DocumentationLibraryConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
