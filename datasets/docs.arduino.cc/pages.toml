["https://docs.arduino.cc/hardware/uno-r4-minima"]
title = ""
description = "The Arduino UNO R4 Minima is the first UNO board featuring a 32-bit microcontroller, the RA4M1 from Renesas. It is faster, has more memory and has a number of built-in features such as a DAC, RTC and HID. The UNO R4 Minima is a 5 V only board.Get Started"
full_description = "Go BackHardwareMKR FamilyClassicBoardsLeonardoMicroUNO Mini Limited EditionUNO R4 MinimaUNO R4 WiFiUNO R3UNO R3 SMDUNO WiFi Rev2Yún Rev2ZeroShields4 Relays Shield9 Axis Motion ShieldEthernet Shield Rev2Motor Shield Rev3Nano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / UNO R4 Minima UNO R4 MinimaThe Arduino UNO R4 Minima is the first UNO board featuring a 32-bit microcontroller, the RA4M1 from Renesas. It is faster, has more memory and has a number of built-in features such as a DAC, RTC and HID. The UNO R4 Minima is a 5 V only board.Get StartedInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe UNO R4 Minima features a microcontroller based on the Renesas RA4M1 (Arm® Cortex®-M4) with an operating voltage of 5 V. It has 14 digital I/O, 6 analog inputs with up to 14-bit resolution, a clock speed of 48 MHz, and 32 kB SRAM, 256 kB flash memory & 8 kB of EEPROM.It features a DAC for audio projects, RTC for accurate time tracking and HID for emulating a keyboard/mouse. The barrel jack plug (VIN) supports voltages at up to 24V, making it compatible with common higher voltage adapters.User ManualA reference to all technical features on this board, with pointers to additional documents.User ManualUSB-CThe UNO R4 Minima is the first UNO to feature a USB-C® connector.Real-Time Clock (RTC)Keep track of time & date and set alarms with the built-in RTC.DocumentationDigital-to-Analog Converter (DAC)Use the onboard 12-bit DAC to build sophisticated audio projects.DocumentationMouse/Keyboard Emulation (HID)Build game controllers by emulating a mouse/keyboard.DocumentationPower up to 24 VPower your UNO R4 Minima board through the VIN Pin with any voltage between 6-24 V.CAN BusConnect your board to other CAN devices. This requires an external transceiver.DocumentationADC ResolutionThis board supports analog read resolutions at up to 14-bit.DocumentationConnect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
