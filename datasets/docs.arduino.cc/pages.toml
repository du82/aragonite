["https://docs.arduino.cc/hardware/mkr-env-shield"]
title = ""
description = "The MKR ENV Shield is a perfect addon for the MKR family series, and is capable of reading temperature, humidity, light and pressure. The data is acquired easily through an easy-to-use library, and has an SD card slot for offline data logging.To use this shield, you can refer to the documentation of the MKR ENV library.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR ENV Shield MKR ENV ShieldThe MKR ENV Shield is a perfect addon for the MKR family series, and is capable of reading temperature, humidity, light and pressure. The data is acquired easily through an easy-to-use library, and has an SD card slot for offline data logging.To use this shield, you can refer to the documentation of the MKR ENV library.Get StartedPinoutBuy nowDownloadable resourcesSchematicsCAD FilesFritzing FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesThe MKR ENV Shield comes equipped with three sensors: LPS22HB, HTS221 and TEMT6000. It is perfect for data capturing projects, and is a low-threshold product for beginners to start working with real-time data. The shield's components are designed to operate in temperatures between -40 °C and +120 °C.Pressure SensorA compact absolute pressure sensor with a range between 260 hPa and 1260 hPa.DocumentationLibraryHumidity / TemperatureA relative humidity and temperature sensor with high accuracy to use for your projects.DocumentationLibraryLight SensorAn ambient light sensor based on a epitaxial planar phototransistor, with a peak sensitivity of 570 nm.DocumentationLibraryMicro SD card slotStore all of your environmental data on an external SD card.VEML6075 (older versions only)Capture ultraviolet UVA and UVB intensity.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
