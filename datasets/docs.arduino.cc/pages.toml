["https://docs.arduino.cc/hardware/portenta-mid-carrier"]
title = ""
description = "The Portenta Mid Carrier is an innovative solution enabling multiple robotics, industrial, and building automation projects. Combined with the Portenta X8, H7, or C33 boards, it evolves into a powerful industrial platform, further complemented by its accessibility to every available interface of the System on Modules it carries.User ManualPro 4G Module"
full_description = "Go BackHardwareMKR FamilyClassicNano FamilyPortenta FamilyBoardsPortenta C33Portenta H7Portenta H7 LitePortenta H7 Lite ConnectedPortenta X8CarriersPortenta BreakoutPortenta Hat CarrierPortenta Max CarrierPortenta Mid CarrierModulesPro 4G ModuleShieldsPortenta Cat. M1/NB IoT GNSS ShieldPortenta Mid Carrier Proto ShieldPortenta Vision ShieldPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / Portenta Mid Carrier Portenta Mid CarrierThe Portenta Mid Carrier is an innovative solution enabling multiple robotics, industrial, and building automation projects. Combined with the Portenta X8, H7, or C33 boards, it evolves into a powerful industrial platform, further complemented by its accessibility to every available interface of the System on Modules it carries.User ManualPro 4G ModuleInteractive ViewerPinoutBuy nowDownloadable resourcesPinout (PDF)DatasheetSchematicsCAD FilesSTEP FilesSoftware MappingFeaturesTutorialsTech SpecsCompatibilitySuggested Libraries The carrier grants easy access to an array of peripherals, from Mini PCIe, to CAN, Ethernet, microSD, USB, camera, displays and analog input and output ports. Its design is further enhanced with dedicated pins for efficient debugging and full access to the SoM interfaces.Linux Powered The Portenta X8, powered by Linux, is the perfect fit for this carrier, expanding its accessibility and interfacing options.Arduino Powered The carrier is also compatible with the Portenta H7, Portenta C33, and the auxiliary core of the Portenta X8, being fully compatible with the Arduino code ecosystem.Pro 4G Module Expand your solutions connectivity with the Pro 4G Module, designed in the mPCIE format, this device features fast and reliable LTE connectivity, supporting 4G, 3G and 2G. Also supporting GNSS for global positioning and fleet management.Camera Connectors The Portenta Mid Carrier enables rapid development of machine vision applications thanks to the Portenta X8/H7 and the two camera connectors (MIPI and Arducam).CAN Bus The Portenta Mid Carrier provides a high-speed CAN FD transceiver that enables CAN bus communication connections. In addition, it integrates a second CAN interface available without an onboard transceiver.Connectivity Access a wide range of I/O with the Portenta Mid Carrier headers, including Ethernet, USB, Analog I/O, SPDIF, PDM, SAI, UART, PWM, I2S, I2C, SPI, CANBus and a JTAG connector for easy debugging.Mini PCIe Connector The Portenta SOM potentiates the possibility of adding mPCIe modules leveraging the available USB, UART and SIM connectivities through this port. A perfect feature for cellular modules among others.MicroSD Card Slot The Portenta Mid Carrier microSD card slot can be used for data logging and media operations.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingInterested in growing your business with us?Contact SalesWas this article helpful?"
