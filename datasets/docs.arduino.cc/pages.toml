["https://docs.arduino.cc/hardware/mkr-relay-shield"]
title = ""
description = "The MKR Relay Shield has two relays mounted that can be used for loads up to 24 V. It also features two status LEDs and a prototyping area for adding your own components.Get Started"
full_description = "Go BackHardwareMKR FamilyBoardsMKR 1000 WiFiMKR FOX 1200MKR GSM 1400MKR NB 1500MKR Vidor 4000MKR WAN 1300MKR WAN 1310MKR WiFi 1010MKR ZeroShieldsMKR 485 ShieldMKR CAN ShieldMKR ENV ShieldMKR ETH ShieldMKR GPS ShieldMKR IMU ShieldMKR MEM ShieldMKR Relay ShieldMKR RGB ShieldMKR SD Proto ShieldMKR Therm ShieldCarriersMKR Connector CarrierMKR IoT CarrierMKR IoT Carrier Rev2MKR Motor CarrierClassicNano FamilyPortenta FamilyPro Solutions and KitsNicla FamilyOptaEducationKitsMegaHome / Hardware / MKR Relay Shield MKR Relay ShieldThe MKR Relay Shield has two relays mounted that can be used for loads up to 24 V. It also features two status LEDs and a prototyping area for adding your own components.Get StartedPinoutBuy nowDownloadable resourcesSchematicsCAD FilesFritzing FilesFeaturesTutorialsTech SpecsCompatibilitySuggested LibrariesLow Signal RelayThese tiny relays are capable of handling up to 24V components, ideal for controlling e.g. low-voltage lamps.DocumentationPrototypingThe shield has a large area for soldering your own components. Add sensors & actuators and connect them to your MKR board without any hassle!Status LEDsKnow what state your relays are in through the on-board status LEDs.Screw TerminalsThe shield features several screw terminals for a more robust assembly.Connect and ContributeProject HubGitHub RepositoryForumProduct ComplianceHelp CenterTrademarks & LicensingWas this article helpful?"
