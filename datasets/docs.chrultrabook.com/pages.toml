["https://docs.chrultrabook.com/docs/unbricking/unbrick-flipper.html"]
title = "Unbricking with a Flipper Zero | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Unbricking with a Flipper ZeroYes, this is possible.PrerequisitesYour brain (please)A Flipper Zero with up-to-date firmware It doesn't matter if you are using stock or custom FW.A SOIC8 clip chip You can buy a cheap Chinese one hereA screwdriver / pry tool to open your ChromebookA copy of your stock ROMA way to copy files onto your Flipper ZeroPreparationsLocate the SPI flash chip (See Unbricking Page, under "Hardware Disassembly")A understanding that this may not work on your systemCautionYou will NOT be able to preserve the VPD using this method! This will not apply to you if flashing via your backup ROM. Read the Unbricking Page for more information.Step 1Obtain your stock ROM and rename it to .bin. For this guide, I will be using qFlipper. Your rom file should now look like this:Step 2Locate the spi_mem_manager folder under the path SD Card/apps_data/spi_mem_manager/. Copy the .bin file to this newly made folder.TipsYou might see a file size warning. It is safe to ignore it, only files that are 4GB+ will have issues transferring.Your spi_mem_manager/ folder should now look like this:Step 3On your Flipper Zero, go to Apps -> GPIO -> SPI Mem Manager -> Saved. You should see your backup .bin. Verify that the file is there, then proceed to the next step.Step 4Connect your SOIC clip chip to your GPIO pins now. See the image below for the wire setup.Step 5Go back to Apps -> GPIO -> SPI Mem Manager -> Saved -> Yourfilename.bin. Open the file, then select the option to "Write".Step 6Assuming all went well, you should no longer have a bricked system.Last Updated: PrevUnbricking with a Suzy-Q Cable'''
