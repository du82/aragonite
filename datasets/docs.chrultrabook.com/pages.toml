["https://docs.chrultrabook.com/docs/firmware"]
title = "Flashing Custom Firmware | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "Flashing Custom FirmwareCautionYou are about to make UNOFFICIAL changes to your device! This will VOID ANY WARRANTY that came with your original purchase. We provide ZERO WARRANTY if you encounter bugs, brick your device, lose your job because the alarm clock didn't go off, or if a thermonuclear war starts. YOU are doing all changes at your own RISK!CautionDo not continue if your device is currently owned or enrolled by a organization, such as a school or employer, unless you were given DIRECT PERMISSION to do so.PrerequisitesKnow your hardware Your CPU model and generationYour storage devices (HDD/SSD, eMMC, NVMe, etc.)Your boardnameFor example, the boardname for Asus Chromebook C302CA is CaveIf you do not know where to find this info, take a look at the System Info Page.A basic knowledge of command lines and how to use a terminal/command prompt.We cannot help you if you do not know how to go to a directory or delete a file from a terminal.A minimum of an 8GB USB drive or SD Card for creating a bootable OS installer.A second device is recommended, and required in some cases.NOTEOnly x86_64 devices are currently supported.TipsIf you only have one device, please be sure to set up a USB with your OS to install before flashing.Asking for help properlyIf you are facing a issue, please read the FAQ first.TipsWhen asking for help, ask in English. We can't help you if we do not understand the question. Using a translator is fine.Do not use manufacturer's model name or serial number when asking for help (i.e: HP Chromebook 14a), it doesn't help with identifying the machine. Provide the boardname, otherwise your support request will be ignored.If you do not know where to find your boardname, take a look here.Last Updated: Next Finding System Info"
