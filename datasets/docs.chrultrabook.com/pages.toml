["https://docs.chrultrabook.com/docs/debugging"]
title = "Debugging | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "DebuggingGrabbing LogsIf you are experiencing firmware bugs, provide output from cbmem console.If you are experiencing issues with Linux, provide output from dmesg, dmidecode and journalctl or /var/log/messages, respectivelyIf you are experiencing issues with Windows, provide screenshots from Device Manager, Event Viewer, coredumps etc.If you are experiencing issues with macOS, please ask for help using the Chrultrabook Forums.FirmwareTo debug firmware, you will need the following tools:cbmem - To view Coreboot logsectool - To interface with ChromeOS Embedded ControllerSuzyQ - If you are experiencing severe system instability (lockups, crashes), preventing you from on-device debugging.To dump the cbmem buffer, follow these steps:Download the tar archive from MrChromebox's website: wget https://mrchromebox.tech/files/util/cbmem.tar.gzUnzip the file and give the binary executable permissions: tar -xf cbmem.tar.gz;rm cbmem.tar.gz;chmod +x cbmemRun cbmem and pipe its output to cbmem.log file: sudo ./cbmem -1 > cbmem.logUpload cbmem.log file for further analysis.To interface with the Embedded Controller:Download the tar archive from MrChromebox's website: wget https://mrchromebox.tech/files/util/ectool.tar.gzUnzip the file and give the binary executable permissions: tar -xf ectool.tar.gz;rm ectool.tar.gz;chmod +x ectoolIssue commands to EC by executing commands, for example setting the fan to 100%: sudo ./ectool --name=cros_ec fanduty 100Running ./ectool help will provide you with a list of available commands, or you can take a look at ectool's source code directlySuzyQ Debug CableIf you need to use SuzyQ, you can use minicom or picocom for example. It exposes three serial devices:AP (CR50) console under /dev/ttyUSB0: minicom -D /dev/ttyUSB0 -b 115200Coreboot/platform serial under /dev/ttyUSB1: minicom -D /dev/ttyUSB1 -b 115200Embedded Controller console under /dev/ttyUSB2 minicom -D /dev/ttyUSB2 -b 115200Platform serial can be used to debug the payload or kernel, but you need to re-compile coreboot with following configuration options enabled: CONSOLE_SERIAL=yEDK2_SERIAL_SUPPORT=yTo use SuzyQ as platform debugger, you will also need to append the following to your kernel commandline: loglevel=15 console=ttyS4,115200n8ACPI and Linux kernelspaceDownload our debugging script.cd ~/Desktop;wget https://raw.githubusercontent.com/chrultrabook/linux-tools/main/debugging.shIt will dump:ACPI tables from sysfs (/sys/firmware/acpi/*)DMI information (dmidecode)Coreboot buffer (cbmem)Linux kernel logs (dmesg)List of PCI devices (lspci)List of USB devices (lsusb)Information about soundcards present in the system and their configurationInto debug-logs.tar.gz archive on your desktop.Run it: chmod +x debugging.sh;./debugging.shUpload this file if you need help with troubleshooting.Remember to remove WiFi information from dmesg to protect your privacy.flashromFlashrom is used to read and write from the SPI flashRead flashsudo flashrom -p <programmer> -r <filename.rom>Example: sudo flashrom -p internal -r backup.romCautionIf you have an Intel Chromebook, you will need to add --ifd -i bios if you want to write to the flash or else flashrom will fail.Write flashsudo flashrom -p <programmer> -w <filename.rom>Intel Example: sudo flashrom -p internal --ifd -i bios -w stock.romAMD Example: sudo flashrom -p internal -w stock.romWrite protectionView status:sudo flashrom -p internal --wp-statusEnable WP:sudo flashrom -p internal --wp-enableDisable WP:sudo flashrom -p internal --wp-disableClear WP range:sudo flashrom -p internal --wp-range 0 0Common programmers:internal: Use this when you run flashrom on the chromebook you want to program.ch341a_spi: Use this when you use a ch341a external programmer.raiden_debug_spi:target=AP: Use then when you want to flash using a Suzy-Q cable.gsctoolgsctool is used to communicate with the GSC (Google Security Chip) from ChromeOS and is usually used to unlock CCD without removing the back of the Chromebook.View status:sudo gsctool -a -IUnlock CCD:sudo gsctool -a -oThis will prompt you multiple times to press the power button, on the last time, the device will reboot back into verified modeLast Updated:"
