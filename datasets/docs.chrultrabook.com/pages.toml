["https://docs.chrultrabook.com/docs/installing/post-install.html"]
title = "Post Install | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Post InstallTipsInstall Chrultrabook Tools for fan controls, keyboard backlight controls, system information and more.WindowsDrivers and QOL improvementsCompress the install with compact.exe /compactos:always in a Command Prompt with admin privileges if necessary.Automatic Use One Click Driver Installer To install driversManual Install CoolStar's drivers if you haven't alreadyBuy audio and Thunderbolt/USB4 drivers (if needed), see CoolStar's driver portalCELES Post Install Workaround (Windows)Boot the Windows install media you used to install Windows.Click "Repair my computer" and select the Command Prompt option.Type bcdedit /set {default} useplatformclock true and press Enter.RebootLinuxGeneral QOL FixesRun the audio script if you haven't already.Run the cros-keyboard-map script to remap top row FX keys.Fixing USB C on TigerLake and AlderLakeFedora, Debian, and Ubuntu have an issue which prevents the cros_ec_typec kernel driver from loading correctly. You can fix it with the following steps:FedoraCreate a file called chromebook_typec.conf file in /etc/dracut.conf.d/Paste the following contents into the file:omit_drivers+=" intel_pmc_mux " Rebuild your initramfs with sudo dracut --force.Debian and UbuntuOpen the file /etc/initramfs-tools/modulesPaste the follwing contents to the end of the file:cros-ec-typec intel-pmc-mux Rebuild your initramfs with sudo update-initramfs -u -k all.CELES Post Install Workaround Possible (Linux)If you experience issues in applications such as Parsec, or encounter disruptive freezes, adding the kernel parameters clocksource=hpet hpet=force may fix your problem. The following instructions assume you are using GRUB, and will be different for other bootloaders. Do your own research on how to set kernel parameters in your bootloader if these do not apply.Edit /etc/default/grub with your preferred text editor (e.g. nano).Add clocksource=hpet hpet=force inside of GRUB_CMDLINE_LINUX_DEFAULT and save your changes. If you exclude either parameter, this will not work. Use sudo, su, or doas if necessary.Type grub-mkconfig -o /boot/grub/grub.cfg or update-grub into a terminal and press Enter. Use sudo, su, or doas if necessary.RebootFixing stylus orientation in GnomeSome Chromebooks come with USI styluses. They work fine in the newest versions of KDE Plasma, but they have a rotation issue in GNOME. The issue is that the stylus does not rotate with the screen, so it is only usable in one orientation. To fix this, we have to add an libinput override.Get the device ID of your stylus This information can either be read from cbmem or libwacom. To get the ID from libwacom run this script https://github.com/linuxwacom/libwacom/blob/master/tools/show-stylus.py.tux@fedora:~/Downloads/libwacom/tools$ sudo python ./show-stylus.py Using "GDIX0000:00 27C6:0E0C Stylus": /dev/input/event5 Using stylus file(s): /usr/share/libwacom/libwacom.stylus Tool id 0x1 serial 0x0 in-proximity: False ^CTerminating Suggested line for .tablet file: Styli=isdv4-aes In this case, the device ID is GDIX0000:00 27C6:0E0C Stylus.Create a .tablet file for libwacomsudo mkdir -p /etc/libwacom/ sudo nano /etc/libwacom/google-{your board name}.tablet Add the following content to the file:[Device] Name={your device id} ModelName= DeviceMatch=i2c:{the hardware id of your stylus lowercased (in this case 27c6:0e0c)} Class=ISDV4 Width=9 Height=5 IntegratedIn=Display;System #Styli=isdv4-aes Styli=@generic-no-eraser [Features] Stylus=true Touch=false Create the libinput overridesudo mkdir -p /etc/libinput/ sudo nano /etc/libinput/local-overrides.quirks Add the following content to the file:[Google Chromebook {your board name} Stylus Digitizer] MatchUdevType=tablet MatchDeviceTree=*{your board name}* MatchBus=i2c ModelChromebook=1 AttrPressureRange=1100:1000 Update the libwacom database and restart the systemsudo libwacom-update-db reboot Example Files for JinlonHere are the example files for the Jinlon Chromebook. The device ID is GDIX0000:00 27C6:0E0C Stylus./etc/libwacom/google-jinlon.tablet[Device] Name=GDIX0000:00 27C6:0E0C Stylus ModelName= DeviceMatch=i2c:27c6:0e0c Class=ISDV4 Width=9 Height=5 IntegratedIn=Display;System #Styli=isdv4-aes Styli=@generic-no-eraser [Features] Stylus=true Touch=false /etc/libinput/local-overrides.quirks[Google Chromebook Jinlon Stylus Digitizer] MatchUdevType=tablet MatchDeviceTree=*jinlon* MatchBus=i2c ModelChromebook=1 AttrPressureRange=1100:1000 Consider Upstreaming Your Changes to libwacomPlease consider upstreaming your changes to libwacom and wacom-hid-descriptors. This will help other users with the same device as you.macOSRemove VerboseOpenCore GUI SetupDisable DevirtualiseMmio if you are on CometLake (10th gen)Last Updated: PrevInstalling an OS'''
year_published = 2025
clearnet = "https://docs.chrultrabook.com/docs/installing/post-install.html"
