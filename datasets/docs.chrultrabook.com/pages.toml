["https://docs.chrultrabook.com/docs/reverting/making-recovery-usb.html"]
title = "Making a Recovery USB | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = 'Making a Recovery USBCautionMaking a Recovery USB will wipe all data on said drive. Back up anything if you need to.For you to reinstall chromeOS, you will need to make a Recovery USB. There are two methods depending on the Operating System Installed.Chromebook Recovery Utility (Windows/ChromeOS/macOS)Download the Chromebook Recovery Utility from the Chrome Web Store.Launch the app, then follow on-screen instructions. If you are unable to find your device, you can select the "Select a model from a list" option.Select the USB drive you want to use.Wait for it to complete.Manually Flash Recovery Image (Windows/ChromeOS/macOS/Linux)Go to cros.tech and find your device.Click on the "Recovery Images" dropdown and select the latest one.Extract the file.WindowsUse Rufus to flash the recovery .bin file to USB but make sure to flash in "dd" mode.macOS/ChromeOS/LinuxUse dd to flash the recovery .bin file to USB.Last Updated: PrevFlashing Stock FirmwareNext Booting the Recovery USB'
