title = "Notes for non-standard Linux distributions | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = 'Notes for non-standard Linux distributionsWarningAdvanced users only! This page is not meant for troubleshootingCautionWe will not help you if you get stuck while using an unsupported distribution!This page contains informations useful to get non-standard or niche Distros to work.Audioalsa-ucm2 for ChromebooksYou need custon alsa-ucm2 configs that arent available upstreamYou can get them hereIf your distro isnt FHS-compliant, you can specify the ucm location via an enviromental variableexport ALSA_CONFIG_UCM2 = "/share/alsa/ucm2"; Audio setup modprobesYou can find the right modprobe configs by browsing the audio scriptKeyboard mappinglibinput configurationPut this in /etc/libinput/local-overrides.quirks: (Source)[keyd virtual keyboard] MatchName=keyd virtual keyboard AttrKeyboardIntegration=internal ModelTabletModeNoSuspend=1 keyd keymapInstall keyd (Github)A configuration file can be accuired with cros-keyboard-map. Some special cases have configs in the configs folder. For all other devices use cros-keyboard-map.py.Last Updated: PrevPartitioning Instructions for Dual Booting'
