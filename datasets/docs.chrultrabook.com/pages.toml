["https://docs.chrultrabook.com/docs/firmware/battery.html"]
title = "Disabling Write Protect via Battery | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "Disabling Write Protect via BatteryWarningThis method requires opening your device. Be sure to use the correct tools to prevent hardware damage.Step 1: Open the device and disconnect the batteryPower down your device. Close the lid and flip it over.Take out all of the screws.TipsScrews may be underneath the rubber feet that keep the Chromebook from sliding.Gently pry the back off the Chromebook. If you do not have the proper tools a dull knife would be helpful.On some Chromebooks, the keyboard needs to be removed instead of the back. Be careful as there's a ribbon wire underneath that needs disconnecting first.Unplug the battery connector. You do not need to take the entire battery out of the Chromebook.Step 2: Boot using AC power, and flashPlug the Chromebook into a power adapter.TipsThere is a 15V USB-C PD requirement for booting without the battery.Boot the chromebook upIf you removed the keyboard, make sure to reattach it for this step.Continue to Flashing FirmwareLast Updated: PrevDisabling Write Protect"
