["https://docs.chrultrabook.com/docs/firmware/about.html"]
title = "Types of Firmware | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = 'Types of FirmwareRW_LEGACYUpdates/replaces the stock RW_LEGACY payload (SeaBIOS or edk2) included on many older models; supplements the ChromeOS / secure boot payload (depthcharge)Leaves all stock functionality intact, including the Developer Mode boot screen and Recovery Mode functionalityAllows device to dual-boot linux alongside ChromeOSDoes not require disabling write-protectCarries zero risk of bricking the deviceOn many models, includes bugfixes and enables additional functionalityWarningDo not run Windows on RW_LEGACY. The RW_LEGACY firmware is for users who want to dual-boot ChromeOS + Linux, or users who want to run Linux without having to open the device/disable the firmware write-protect (and are OK with the accompanying limitations).(UEFI) Full ROMA complete firmware image which includes updated/customized versions of the hardware init component (coreboot) and UEFI boot payload (edk2)Removes the developer mode boot ("OS verification is OFF") screenCompletely removes the ability to run ChromeOS (and ChromeOS Recovery Mode), creating a small risk of bricking your deviceOffers the best support for booting all OSes besides ChromeOSAdds full hardware support for virtualization (vmx / VT-x)Fixes many bugs and/or idiosyncrasies associated with the stock firmwareUEFI firmware contains updated EC firmware as well, which brings additional fixes on most Chromebooks (mainly keyboard related)Requires installation of a UEFI-compatible OS after flashingEssentially turns your ChromeOS device into a "regular" PC / laptopTipsThe (UEFI) Full ROM firmware is the best option for all users who no longer need/want to run ChromeOS (ie, want to run Linux/Windows/macOS exclusively), and who do not mind disabling write-protection on their device.Last Updated: PrevDisabling Write ProtectNext Flashing Custom Firmware'
