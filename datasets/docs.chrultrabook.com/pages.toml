["https://docs.chrultrabook.com/docs/installing/installing-windows.html"]
title = "Installing Windows | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Installing WindowsWarningDo not use Windows 8 or older. Only recent Windows 10 and 11 builds are supported.CautionDo not use unofficial versions of Windows, such as Ghost Specter or tiny10/11. They are not supported and may contain undetectable malware and/or security vulnerabilities.TipsIf you want to create a Windows installer from ChromeOS, see the Installing Ventoy page.Get a USB containing a Windows image. Ventoy, Rufus, and the official Windows media creation tool are the only methods that can be used to create a Windows USB.Bypassing Windows 11 installation checks:At the Windows installer, select "Repair my Computer".Select "Command prompt". (May be hidden under an advanced section)Type in regedit and press EnterNavigate to HKEY_LOCAL_MACHINE\SYSTEM\SetupRight click Setup and create a new Key called LabConfigRight click LabConfig and create new DWORD (32-bit) called BypassSecureBootCheck and set its value to 1Right click LabConfig and create new DWORD (32-bit) called BypassTPMCheck and set its value to 1Close Registry Editor.Run setup in the command prompt.Install Windows as you would normally.Install drivers:See Coolstar's Windows Install Helper for drivers. Some of the drivers may be paid.Installing .cab driversCab drivers are a little weird, but they're easy to install.Create a new folder.Open your cab driver using Windows Explorer. 7Zip will not work.Copy all the files to that empty folder.Enable the option to show file extensions.Right click on all the .inf files, and select install.Reboot.Paid DriversPlease see CoolStar's driver portal for a step by step tutorial on purchasing drivers.What drivers do I need to buy?CPU GenerationPaid DriversNotesSandybridgen/aIvybridgen/aHaswelln/aBroadwelln/aBaytrailn/aBraswelln/aSkylakeAVSModels with a Celeron, Pentium, i3 or m3 CPU are eligible for a AUE discount.Apollo LakeAVS or SOFCan use either SOF or AVSKaby LakeAVSAmber LakeAVSGemini LakeSOFComet LakeSOFPicasso / Dalin/aTiger LakeSOF, TB4TB4 and SOF can be purchased as a bundle.Jasper LakeSOFAlder LakeSOF, TB4TB4 and SOF can be purchased as a bundle.CezanneSOFMendocinoSOFLast Updated: PrevInstalling an OSNext Post Install'''
year_published = 2025
