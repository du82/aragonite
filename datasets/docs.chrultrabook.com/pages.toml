["https://docs.chrultrabook.com/docs/terminology.html"]
title = "Terminology | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "TerminologyTermDescriptionchrultrabookA modified Chromebook/box designed to run Windows, Linux, or even macOScorebootUEFI firmware firmware replacementUEFIThe Unified Extensible Firmware Interface (UEFI) is a specification that defines a software interface between an operating system and platform firmware. UEFI replaces the legacy Basic Input/Output System (BIOS) firmware interface originally present in all IBM PC-compatible personal computers, with most UEFI firmware implementations providing support for legacy BIOS services. UEFI can support remote diagnostics and repair of computers, even with no operating system installed. (source: Wikipedia)ECEmbedded Controller. Communicates between the main board and embedded peripherals such as hotkeys, ports, or battery.SKLAbbreviation for Skylake, an Intel CPU generation (6xxx)KBLAbbreviation for Kaby Lake, an Intel CPU generation (7xxx)APLAbbreviation for Apollo Lake, an Intel CPU generation (7xxx)ABLAbbreviation for Amber Lake, an Intel CPU generation (8xxx)GLKAbbreviation for Gemini Lake, an Intel CPU generationCMLAbbreviation for Comet Lake, an Intel CPU generation (10xxx)TGLAbbreviation for Tiger Lake, an Intel CPU generation (11xxx)JSLAbbreviation for Jasper Lake, an Intel CPU generation (Nxxx)ADLAbbreviation for Alder Lake, an Intel CPU generation (12xxx)SOFAbbreviation for Sound Open Firmware, a audio driver used for both Linux and Windows. APL, GLK, CML, TGL, JSL, and ADL use this driver.AVSAbbreviation for Audio Voice Speech, a audio driver used for both Linux and Windows. SKL, APL, KBL, and ABL use this driver.SuzyQableA cable that enables CCD (Closed Case Debug). Used to disable WP.NVRAMNon Volatile Random Access Memory. NVRAM exists on a chip in your motherboard, and contains things like your boot entries/boot order along with a suite of other things.RWLAbbreviation of RW_LegacyaltOSStands for alternate OS, a operating system thats not chromeOS.POSTStands for Power On Self Test. POST is a process performed by firmware or software routines immediately after a computer or other digital electronic device is powered on.DRMDigital rights management (DRM) is the use of technology to control access to copyrighted material. It also enables copyright holders and content creators to manage what users can do with their content, such as how many devices they can access media on and whether they can share it.LTSStands for Long Term Support.ACPIAdvanced Configuration and Power Interface (ACPI), an open standard for operating systems to identify and set up computer hardware components.DSDT/SSDTTables in your ACPI that describe the devices and how the OS should interact with them e.g. putting the computer to sleep, wake, switching GPUs, USB ports..AMLThe compiled file format of ACPI, and what your PC will execute. .DAT is another extension with the exact same use..DSLThe source code for ACPI – this is what you edit and compile for your computer. DO NOT mix this file format up with .ASL.Kext(s)Kernel Extensions, also referred to as Kexts, serve as drivers for macOS. They have various functions, such as facilitating device drivers or serving alternative purposes within Hackintoshing, such as OS patching, information injection, or task execution. It is worth noting that while Kexts play a crucial role in a successful Hackintosh setup, they are typically paired with ACPI patches and fixes.ch341aA USB programmer used to read/write firmware. You'll need this if you bricked your systemLast Updated: Next Flashing Custom Firmware"
year_published = 2025
clearnet = "https://docs.chrultrabook.com/docs/terminology.html"
