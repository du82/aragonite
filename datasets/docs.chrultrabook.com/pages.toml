["https://docs.chrultrabook.com/docs/firmware/compiling-coreboot.html"]
title = "Compiling Custom Firmware | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "Compiling Custom FirmwareCloning & Building ROMsCautionBuilding and flashing your own firmware has the potential to brick your device. Do not do this unless you are sure you know what you are doing/have a way to recover from a bad flash. Some level of knowledge with using the Linux command line is required.Install tools and libraries needed for coreboot:Debian based distros: sudo apt install -y bison build-essential curl flex git gnat imagemagick libncurses5-dev m4 nasm python-is-python3 uuid-dev zlib1g-dev libssl-devArch based distros: sudo pacman --needed -S base-devel curl git gcc-ada ncurses zlib nasm imagemagickRedhat based distros: sudo dnf install git make gcc-gnat flex bison xz bzip2 gcc g++ ncurses-devel wget zlib-devel patch openssl libuuid-devel nasm texinfoClone the repository:git clone https://github.com/mrchromebox/coreboot.gitcd to the coreboot folder, then build the coreboot toolchainmake crossgcc-i386 CPUS=$(nproc)Make changes now, if needed.Common changes include: Replacing the default logo (Documentation/coreboot_logo.bmp)Changing version string (CONFIG_LOCALVERSION)Build the ROM./build-uefi.sh <boardname>For example, ./build-uefi.sh careenaROMs will be stored in ../romsContinue onto Flashing Manually to flashLast Updated: PrevUpdating FirmwareNext Flashing Manually"
