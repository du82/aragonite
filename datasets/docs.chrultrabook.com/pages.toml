full_description = "Updating Custom FirmwareNOTEThe script does not work on Windows. If you are using Windows, boot a live Linux iso, such as Ubuntu or Fedora, and run the script from there.Tipscurl is not installed by default for Ubuntu or Ubuntu-based distros. To install it, run: sudo apt update && sudo apt install -y curlRun MrChromebox's Firmware Utility Script. In case you forgot, type cd; curl -LO mrchromebox.tech/firmware-util.sh && sudo bash firmware-util.sh and press Enter.Choose option 1: Install/Update UEFI (Full ROM) Firmware, and reboot if successful.CautionDO NOT REBOOT if flash was not successfulLast Updated: PrevFlashing FirmwareNext Compiling Custom Firmware"
