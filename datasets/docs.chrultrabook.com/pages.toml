["https://docs.chrultrabook.com/docs/installing/bootableusb.html"]
title = "Making a Bootable USB | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Making a Bootable USBCautionFlashing Ventoy or ISOs to an external drive will wipe all data on said drive. Back up anything if you need to.PrerequisitesAnother PC or laptop with at least 8GB storageAn internet connectionAn external drive like a USB drive or SD card that is at least 8GB.Downloading a ISODetermine what OS you want. For Linux, keep in mind Ubuntu and Ubuntu-based derivatives are not supported.For Windows, keep in mind only official versions of Windows 10 and newer are supported.Place the ISO in a safe place.Flashing using Rufus (Windows)For this guide, we will be using Rufus to create our bootable USB. Rufus is a useful tool that allows you to flash ISOs to an external drive.Download Rufus from here. The standard Windows x64 version will do.Plug in your external drive.Locate and launch Rufus. It should ask you to launch with administrator privileges, select YES.Press the "SELECT" button on the right-hand side.A File Explorer window should pop up, find your ISO of choice, then click "Open".Click "Start". The default options should work just fine.Wait for the green bar to say "READY", then click "Close" and eject your newly made external drive.ProfitFlashing using Ventoy (Windows/Linux/macOS)For this guide, we will be using Ventoy to create our bootable USB. Ventoy allows you to boot multiple ISO's from a single drive.Download and extract the latest version from Github.Download the respective file for your platform. Run Ventoy2Disk.exe for Windows or VentoyGUI.x86_64 for Linux.Make sure to allow administrator privilages when prompted.Plug in your external drive and click the green circle to refresh devices. It should pick up your external drive.Click Options > Partition Style and select "GPT".Once you have done Step 4, click "Install" and click ok twice to start the install.Open your Files App and find a drive that's labeled as "Ventoy".Copy the ISO you downloaded into that drive, after that eject it.ProfitFlashing with dd (Linux/macOS)Plug in your external driveRun lsblk to help determine the drive to be flashed. If the device is mounted you will need to use umount to unmount it.Flash with dd if=myfile.iso of=/dev/<device name (as shown by lsblk)> bs=16M status=progress.TipsBe sure to target the drive itself and not a partition.Last Updated: PrevKnown IssuesNext Installing Windows'''
year_published = 2025
