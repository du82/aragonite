["https://docs.chrultrabook.com/docs/installing/macos-firmware"]
title = "macOS Firmware | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "macOS FirmwareIt is recommended to flash coreboot with the Intel Management Engine interface enabled to prevent bugs after waking from sleep. Without the ME interface enabled, the following bugs can occur after waking from sleep:Blank Electron / Chromium appsBuggy video playback in web browsers like Firefox or SafariDisplay/Wallpaper settings in SysPref/SysSettingsLogging out freezes your systemCustom FirmwarePrebuiltPrebuilts can be found at ethanthesleepy.oneBuilding ManuallyFollow the steps here to download the toolchain and build the firmwareContinue these steps once build-uefi.sh <boardname> has been ranRun make menuconfig. You will be greeted by a menu which looks like the following:Select ChipsetSelect Disable HECI1 at the end of boot then press N to disable. The asterik should be gone:Use the right arrow keys to select Save at the bottom, then press OkUse the right/left arrow keys to select Exit until back at the prompt.Run make -j$(nproc) to build the firmware.The output will be found at ./build/coreboot.romFlashing FirmwareFollow the steps on this page to flash the new firmware.Last Updated: Next Fixing Hibernation"
year_published = 2025
