["https://docs.chrultrabook.com/docs/installing/installing-linux.html"]
title = "Installing Linux | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Installing LinuxThanks to recent advancements in the chrultrabook community, Linux works really well on most Chromebooks.TipsOnly Linux kernel 6.6 or newer is supported.Recommended DistributionsWarningOld (>1 year) LTS releases may have issues and are not supported. One possible workaround for Debian 12 (Bookworm) and Ubuntu is using a custom kernel. In case of Debian, the audio script will automatically install it for you. Note that not all issues can be solved with a custom kernel, as the rest of the software on the system is still old.Recommended distros as of December 2024 (in no particular order) are:Arch Linux or EndeavourOSFedora or Ultramarine LinuxopenSUSE TumbleweedPop!_OSInstallationCreate a bootable Linux USB. See here for a guide.Plug the USB Drive into the Chromebook.Turn on the Chromebook, press ESC at the POST screen (when the coreboot logo appears), and select your USB to boot from.Install as you would on any other computer.NOTEIf you are using RW_LEGACY firmware, if after pressing Ctrl+L you reach the "Additional Firmware Menu" screen, you will need to press 2 to boot from a USB.See this page for more information about RW_LEGACY booting.Fixing AudioYou will likely have audio issues after installing Linux. Run the following script to fix them.PrerequisitesPython 3.10 or newerGitCautionUsing AVS on a device with max98357a will blow your speakers. You have been warned.How to run the scriptOpen a terminal.git clone https://github.com/WeirdTreeThing/chromebook-linux-audio.gitcd chromebook-linux-audio./setup-audioFor more information please see WeirdTreeThing's repoLast Updated: PrevInstalling an OSNext Post Install'''
