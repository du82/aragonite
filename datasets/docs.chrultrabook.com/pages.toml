title = "Finding System Info | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Finding System InfoTipsSome of the following commands require Developer mode.System ArchitectureYour system architecture is very important as it determines if your device has any support at all. ARM devices are not currently supported by the project, but support for them in the future is planned.How to find your architectureOpen a crosh terminal by pressing Ctrl+Alt+TType uname -m and press enterYou should now see one of three possible outputs:x86_64aarch64armv7lIf you see x86_64, your device is very likely to be supported, you will need to find your board name next to see if your device is supported. If you see armv7l, aarch64 or anything with arm, you have an ARM device which isn't currently supported.Board NameThe board name is the special name for your device which determines if it is supported by the custom firmware.How to find your board nameDeveloper ModeOpen VT-2 by pressing Ctrl + Alt + 🡢 (F2) and login as chronosType sudo crossystem hwid and press EnterRecovery ModeEnter Recovery ModeFind the "Model" lineYou should now see your board name and some extra characters. Example: SNAPPY E25-A7C-J2L-I74-A47 In this example, SNAPPY is the board name and you can ignore the extra characters.CPU Model and generationThe CPU model and generation is used to determine OS support and any extra steps you have to take after installing the OS.How to find your CPU modelOpen VT-2 by pressing Ctrl + Alt + 🡢 (F2) and login as chronosType cat /proc/cpuinfo | grep "model name" and press EnterYou should now see your CPU model repeated a few times, we only have to look at the first line. Example output: model name : Intel(R) Celeron(R) CPU N3350 @ 1.10GHzHow to find your CPU generationFind your board name using the steps above (ex: SNAPPY).Go to the Supported Devices Page.The Supported Devices Page has sections for each generation that has a list of boards for that specific generation. Use Ctrl+F to locate your board and find which generation it's listed under.Last Updated: PrevFlashing Custom FirmwareNext Supported Devices and Platforms'''
