["https://docs.chrultrabook.com/docs/installing/macos-hibernation.html"]
title = "macOS Hibernation | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "macOS HibernationmacOS by default will try to use hibernation after sleeping for a predetermined amount of time. Some fixes in the config.plist are required in order to take advantage of this:Disable Booter->Quirks->DevirtualiseMmioSet Misc->Boot->HibernateMode to AutoBy default, OpenCore will not look for hibernated images of macOS.Set Misc->Boot->HibernationSkipsPicker to True to skip the picker when resuming from hibernationWhile not strictly required, this speeds up resume times and prevents accidently booting another OS and changing hardware state underneath macOS.Create a reserved memory region under UEFI->ReservedMemory with the properties:FieldTypeValueCommentStringFix black screen on wake from hibernationEnabledBooleanTrueAddressNumber569344EnabledBooleanTrueSizeNumber4096TypeStringRuntimeCodeTesting HibernationTo test hibernation, it is recommended to run sudo pmset -a hibernatemode 25. This will force macOS to hibernate immediately whenever the lid is closed or Sleep is selected in the menu at the top left.macOS enters S3 sleep instead of shutting downSome models (such as KLED) have drives not marked as internal, which prevents macOS from entering hibernation. To fix this, add the built-in property to the PCI device under DeviceProperties->Add-><storage device path>:FieldTypeValuebuilt-inData<01000000>You may need to add an ACPI device as well. If an ACPI device does not exist to represent the NVMe or eMMC drive, then device properties will not be applied. An example SSDT can be found here.Hibernate ModesPmset exposes a few different hibernation modes which can be set through sudo pmset -a hibernatemode <value>:0: Disables hibernation3: Hibernates after either standbydelaylow or standbydelayhigh seconds of sleep Which one is used is dependent on the battery percentage. Anything above highstandbythreshold will use standbydelayhigh instead of standbydelaylow.25: Hibernates instead of S3 sleepWhen using hibernate mode 3, macOS may keep sleeping even after the standby time has elapsed. HibernationFixup.kext may be required in this case, and provides options to fine tune when the Chromebook is allowed to sleep.Last Updated: PrevCustom macOS firmware"
year_published = 2025
