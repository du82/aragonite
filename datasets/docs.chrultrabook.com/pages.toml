full_description = "Installing an OSTipsBe sure to check the supported devices page to see what you can run.WindowsPros of WindowsWorks on most platforms with minimal tweaking¹Generally has better application supportBetter game supportCons of WindowsAudio driver is paid (10 USD) for Skylake (6th generation) and newer devicesUSB4/Thunderbolt driver is paid (20 USD) for TigerLake (11th generation Intel processors) and newer generations on devices that require themRequires the user to install many driversAVS and SOF users may experience instability at timesInstalling Windows →¹Some devices such as CELES need workarounds. Refer to the known issues page to check whether you need patches.LinuxPros of LinuxFree audio supportLightweight and optimal for Chrultrabooks with low storage / slow CPUsMost hardware (biggest exception is audio) will work out of the boxCons of LinuxPotentially difficult for a new user (depending on the distro of choice)Requires some work on the end user (running audio script, configuring keyboard mapping)AVS and SOF users experience instability at timesWarningUbuntu and Ubuntu-based distributions may have issues and are not supported.Installing Linux →macOSPros of macOSOS experience is near identical to a MacCons of macOSBattery life is subparHardware based DRM (e.g AppleTV.app) is brokenNo audio, mic, or 3.5mm support¹Doesn't support all devices.Often takes up to a week or longer to set up.Limited supportTipsAny Chromebook with an ARM, Celeron or Pentium CPU is not supported. AMD Ryzen might have support in the future.Installing macOS →Last Updated:"
