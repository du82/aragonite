["https://docs.chrultrabook.com/docs/installing/ectool.html"]
title = "Using Ectool | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = '''Using Ectoolectool is a utility that is used to interface with the ChromeOS Embedded Controller. It is used to communicate with the embedded controller from userspace and vice versa.Installing EctoolIf you use Fedora or Ultramarine Linux, you can install the chromium-ectool package from the Terra repository.Otherwise, you can download ectool for Linux from here. Alternatively there is a Alpine Linux / musl version.For Windows users, ectool is installed when you install CoolStar's Chrome EC driver and is located in C:\Program Files\crosec\ectool.exe.UsesTipsRun ectool help for a full list of commands.Some common uses of ectool include:Accessing the EC console: ectool consoleControlling the fan with ectool fanduty <percent>Set the keyboard backlight in devices that have it: ectool pwmsetkblight <percent>Last Updated: PrevPost Install'''
