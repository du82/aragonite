description = "The Chrultrabook documentation"
full_description = "Flashing Stock FirmwareWarningIf your device has hit AUE (Auto Update Expiration), you will not be able to revert to chromeOS.If you already have Linux installed, move on to step 5. Otherwise, make a bootable Linux live USB.Connect to WiFi.Open a terminal, then update and install curl.Use the distro's package manager to install it.Obtain your ROM backup.Run MrChromebox's firmware utility script.In case you forgot, type cd; curl -LO mrchromebox.tech/firmware-util.sh && sudo bash firmware-util.sh and press Enter.Choose option 2: Restore Stock ChromeOS Firmware.TipsIf, for whatever reason, lost your stock firmware backup, Use an additional drive to flash a recovery image.Follow on-screen instructionsLast Updated: PrevReverting to Stock chromeOSNext Making a Recovery USB"
