["https://docs.chrultrabook.com/docs/firmware/manually-flashing.html"]
title = "Manually Flashing ROMs | Chrultrabook Docs"
description = "The Chrultrabook documentation"
full_description = "Manually Flashing ROMsCautionFlashing your own firmware has the potential to brick your device. Do not do this unless you are sure you know what you are doing/have a way to recover from a bad flash. Some level of knowledge with using the Linux command line is required.Have your firmware rom. We will assume you already have the file you want to flash for this guide.Download flashrom, then give it execute permission. For most distributions: cd; curl -LO https://files.tree123.org/utils/x86_64/gnu/flashrom; chmod +x flashromFor musl (Alpine Linux): cd; curl -LO https://files.tree123.org/utils/x86_64/musl/flashrom; chmod +x flashromFlash your custom ROM Backup your current rom, just in case things go wrong: ./flashrom -p internal -r current.romNote: Intel Chromebooks should be flashed with --ifd -i bios ex: sudo ./flashrom -p internal --ifd -i bios -w coreboot.romFlash your custom firmware: sudo ./flashrom -p internal -w firmware.romReboot Assuming it said success on all checks, reboot.CautionDo not reboot if any of the checks failed.Last Updated: PrevCompiling Custom FirmwareNext Installing Ventoy With chromeOS"
year_published = 2025
