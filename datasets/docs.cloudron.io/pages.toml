["https://docs.cloudron.io/apps/commento"]
title = "Commento - Cloudron Docs"
description = "Cloudron is a platform to host apps on your server and keep them up-to-date and secure."
full_description = "Commento++ App About Commento++ is a fast, privacy-focused commenting platform. Comment++ is a fork of Commento. Questions? Ask in the Cloudron Forum - Commento++ Original Commento Website Commento++ Website Registration Commento++ does not integrate with Cloudron Directory. It has two types of users: Owners can manage domains and act as moderators. Commentors can write comments. Owner signup is enabled by default. To disable open owner registration, edit /app/data/commento.conf using the File manager: COMMENTO_FORBID_NEW_OWNERS=true Be sure to restart the app after making any changes. Sign-in with Google Commento++ also supports OAuth sign-in with Google for users wanting to comment. To enable this feature, create a Google API secret and key pair and put those into /app/data/commento.conf: COMMENTO_GOOGLE_KEY=<your key> COMMENTO_GOOGLE_SECRET=<your secret>"
