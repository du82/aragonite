full_description = "Comentario App About Comentario is an open-source web comment engine, which adds discussion functionality to plain, boring web pages. Questions? Ask in the Cloudron Forum - Comentario Comentario Website Comentario Docs Comentario Source Identity Providers Comentario supports login for users and commenters via many identity providers like Facebook, Google, GitHub. These can be configured by editing /app/data/secrets.yaml using the File Manager. See upstream docs for available providers and how to configure them. Be sure to restart the app after making any changes. Custom Config Custom configuration can be added by editing /app/data/env.sh using the File Manager. See upstream docs for available options. Be sure to restart the app after making any changes."
