["https://docs.cloudron.io/apps/espocrm"]
title = "EspoCRM - Cloudron Docs"
description = "Cloudron is a platform to host apps on your server and keep them up-to-date and secure."
full_description = 'EspoCRM App About EspoCRM is a web application that allows users to see, enter and evaluate all your company relationships regardless of the type. People, companies, projects or opportunities — all in an easy and intuitive interface. Questions? Ask in the Cloudron Forum - Espo CRM Espo CRM Website Espo CRM forum Espo CRM issue tracker Admin access EspoCRM is automatically setup with an admin account. username: admin password: changeme Be sure to change the admin credentials immediately after installation. To make an existing Cloudron user an admin, set the admin flag under Teams and Access Control. Currently, this requires that the Cloudron user log into EspoCRM first. Portals EspoCRM Portal is a functionality that provides the access specific CRM data and functions for your customers and partners. Portals can either be sub paths or standalone domains. Cloudron supports standalone domains for EspoCRM portals using App Location Aliases. To setup a portal domain: Create the EspoCRM portal Specify a custom URL and custom ID for the portal. For example, https://acme.cloudron.club in the screenshot below: Add the domain in the Cloudron dashboard. Add portal configuration rewrite rules in /app/data/apache/portals.conf using the File Manager: RewriteCond %{HTTP_HOST} ^acme\.cloudron\.club$ RewriteRule ^client - [L] RewriteCond %{HTTP_HOST} ^acme\.cloudron.club$ RewriteCond %{REQUEST_URI} !^/portal/acme/.*$ RewriteRule ^(.*)$ /portal/acme/$1 [L] Restart the app for the apache configuration changes to take effect. You can now visit https://acme.cloudron.club. Resetting passwords Especially for the admin user if the email was not changed to a real mailbox, a new password can be set using the following command in the Web terminal: /usr/local/bin/gosu www-data:www-data php command.php set-password admin Cron Jobs EspoCRM cron is already pre-configured on Cloudron and runs every minute. However, the scheduled jobs to run are not pre-configured and this must be configured by the administrator depending on what feature of EspoCRM used. Below is a list of jobs available out-of-the-box. You have to add them in Administration > Scheduled Jobs. CheckEmailAccounts – checks personal email accounts CheckInboundEmails – checks group email accounts Cleanup ProcessWebhookQueue SendEmailNotifications ControlKnowledgeBaseArticleStatus ProcessMassEmail SendEmailReminders SubmitPopupReminders Uninstalling extension To uninstall an extension: Enable Recovery Mode. Open the Web Terminal. php command.php extension -l to list all extensions To uninstall a specific extension: php command.php extension -u --name="Google Integration" See EspoCRM documentation for more information.'
year_published = 2025
