full_description = 'AzuraCast App About AzuraCast is a free and open-source, self-hosted web radio station in a box. Questions? Ask in the Cloudron Forum - AzuraCast AzuraCast Website AzuraCast issue tracker Cloudron Docs Introduction Installation Installation Home Server Intranet Support Support Troubleshooting Contact Us Knowledge Base Knowledge Base Apps App Store Backups Branding Certificates Dashboard Domains Email Networking Notifications Profile Security Services Settings Storage System Updates Users & Groups User Directory Volumes Guides Guides Connect to MongoDB Connect to MySQL Connect to PostgreSQL Decrypt Backups Download Backups Import Email Import Mongodb Import MySQL Import PostgresSQL Import Redis Laravel in LAMP app Load Large Data into MySQL (INFILE) Migrate WordPress Mailbox Sharing NFS Share Multiple databases with LAMP app SSH Tunnel Upgrade PHP in LAMP app Upgrading to Ubuntu 18.04 Upgrading to Ubuntu 20.04 Upgrading to Ubuntu 22.04 Upgrading to Ubuntu 24.04 Community Guides Community Guides Remote Backup with Restic & rclone Running Firefly-III Importer SMTP Relay Configuration Monitoring and Alerting Automatic update of blocklists MySQL Recovery Apps Apps 2FAuth Ackee Actual AdGuard Home Alltube Ampache Apache Answer ArchiveBox Astral Audiobookshelf AzuraCast AzuraCast Table of contents About Baserow BookStack Cal.com Calibre Web Castopod Change Detection Chatwoot Collabora Online Comentario Commento Confluence CouchPotato CryptPad Cubby Directus Discourse Docker Builder Docker Registry Documenso Documize DocuSeal Dokuwiki Dolibarr EasyAppointments Element Emby EspoCRM Etherpad evcc FilePizza FindMyDevice Firefly-III Formbricks FreeScout FreshRSS GeoIP Ghost Gitea GitHub Pages GitLab Gogs Grafana Grav Greenlight Guacamole Hastebin HedgeDoc Home Assistant HumHub Immich Invidious Invoice Ninja 5 IT-Tools Jellyfin Jingo Jirafeau Jitsi Joplin Server JupyterHub Kanboard Kavita Keycloak Kimai Koel Komga Kopano Meet Kutt LAMP LanguageTool Leantime L