["https://docs.cloudron.io/apps/findmydevice"]
title = "FindMyDevice - Cloudron Docs"
description = "Cloudron is a platform to host apps on your server and keep them up-to-date and secure."
full_description = "FindMyDevice App About FindMyDevice (FMD) Server finds your device and control it remotely. It aims to be a secure open source alternative to Google's Find My Device. The FMD app for android can be found here (source]. Questions? Ask in the Cloudron Forum - FindMyDevice FindMyDevice repo FindMyDevice issue tracker Custom Config Custom config can be set in /app/data/config.yml using the File manager. Be sure to restart the app after making any changes. UnifiedPush Communication between server and app relies on UnifiedPush. The push can be either be selfhosted using ntfy.sh or use the service at https://ntfy.sh . If you decide to selfhost ntfy server, you must enable support for UnifiedPush. See https://docs.ntfy.sh/config/#example-unifiedpush"
