["https://docs.cloudron.io/apps/bookstack"]
title = "BookStack - Cloudron Docs"
description = "Cloudron is a platform to host apps on your server and keep them up-to-date and secure."
full_description = "BookStack App About BookStack is a simple, self-hosted, easy-to-use platform for organising and storing information. Questions? Ask in the Cloudron Forum - BookStack BookStack Website BookStack discord BookStack issue tracker Admin When using Cloudron user management, BookStack's built-in admin user is disabled. See the BookStack docs for more information. In addition, the app is pre-setup to give admin status to all users. You can change this by going to Settings -> Registration and adjusting the value of Default user role after registration. This way, the first user to login will be an admin and the roles of rest of the users can be managed inside BookStack. Customization BookStack env vars file has a list of various customizable options including default book view, default light/dark mode, timezone etc. To change a setting, use the File Manager to edit custom configuration in /app/data/env. Be sure to restart the app after making any changes. External registration Bookstack does not allow external users to register when Cloudron user management (LDAP) is enabled. If you require external registration, install Bookstack with Cloudron user management disabled. See the Bookstack docs to enable 3rd party auth like Google, GitHub, Twitter, Facebook & others. Themes Custom theme can be placed in /app/data/themes . You can edit the files here using the File manager."
