["https://docs.cloudron.io/api.html"]
title = "Cloudron API Docs"
full_description = "All of the functionality in the Cloudron Dashboard is available through the API, allowing you to script complex actions. If you are an app developer, the Cloudron CLI tool implements a workflow that allows you to develop apps on your Cloudron. The CLI tool uses the REST API documented here. 2xx responses indicate success. 4xx responses indicate request errors. 5xx responses indicate server errors. When listing objects, query parameters page and per_page can be passed in. Note that these parameters have index starting from 1. API Tokens can be created as Readonly or Read and Write. With Readonly token, only GET operations can be performed. We use curl to demonstrate how to use the API. The Cloudron Dashboard Domain and the API Token are variable fields. You can export them in your shell as follows: To use the Bearer Authentication, you must first create an API token. The API Token can be passed via the Authorization header Bearer <token>: To use the Query Parameter Authentication, you must first create an API token. The API Token can be passed via the access_token query parameter: Install an app by either providing an app store id or a CloudronManifest. The latter is useful for custom apps. This can be an icon, png, jpeg depending on the upstream site. When a custom icon is set, this is the icon which was previously uploaded. Get app logs. Use this endpoint to stream logs (tail -f style). If you want to download logs, use the logs endpoint instead. This endpoint implements Server Side Events. Use the EventSource interface to parse the returned stream. An object that includes arrays for user and group restrictions. If null, everyone can access the applink. Applink icon. When not set, this the favicon of the website. This can be an icon, png, jpeg depending on the upstream site. When a custom icon is set, this is the icon which was previously uploaded. App passwords can be used as a security measure in desktop, email & mobile clients. For example, if you are trying out a new mobile app from an untrusted vendor, you can generate a temporary password that provides access to a specific app. This way your main password does not get compromised (and thus providing access to other apps as well)."
