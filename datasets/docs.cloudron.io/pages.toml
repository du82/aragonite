full_description = '''Alltube App About Alltube provides a Web GUI for youtube-dl. Despite it's name, Alltube can be used to download videos from all kinds of sources including Dailymotion, Vimeo, SoundCloud, Facebook and Instagram. Questions? Ask in the Cloudron Forum - AllTube AllTube Website AllTube issue tracker Customization Use the File Manager to edit /app/data/config.yml to add custom configuration. See the upstream file for reference. Cloudron Docs Introduction Installation Installation Home Server Intranet Support Support Troubleshooting Contact Us Knowledge Base Knowledge Base Apps App Store Backups Branding Certificates Dashboard Domains Email Networking Notifications Profile Security Services Settings Storage System Updates Users & Groups User Directory Volumes Guides Guides Connect to MongoDB Connect to MySQL Connect to PostgreSQL Decrypt Backups Download Backups Import Email Import Mongodb Import MySQL Import PostgresSQL Import Redis Laravel in LAMP app Load Large Data into MySQL (INFILE) Migrate WordPress Mailbox Sharing NFS Share Multiple databases with LAMP app SSH Tunnel Upgrade PHP in LAMP app Upgrading to Ubuntu 18.04 Upgrading to Ubuntu 20.04 Upgrading to Ubuntu 22.04 Upgrading to Ubuntu 24.04 Community Guides Community Guides Remote Backup with Restic & rclone Running Firefly-III Importer SMTP Relay Configuration Monitoring and Alerting Automatic update of blocklists MySQL Recovery Apps Apps 2FAuth Ackee Actual AdGuard Home Alltube Alltube Table of contents About Customization Ampache Apache Answer ArchiveBox Astral Audiobookshelf AzuraCast Baserow BookStack Cal.com Calibre Web Castopod Change Detection Chatwoot Collabora Online Comentario Commento Confluence CouchPotato CryptPad Cubby Directus Discourse Docker Builder Docker Registry Documenso Documize DocuSeal Dokuwiki Dolibarr EasyAppointments Element Emby EspoCRM Etherpad evcc FilePizza FindMyDevice Firefly-III Formbricks FreeScout FreshRSS GeoIP Ghost Gitea GitHub Pages GitLab Gogs Grafan