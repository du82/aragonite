full_description = "Firefly III App About Firefly III is a free and open source personal finance manager. Questions? Ask in the Cloudron Forum - Firefly III Firefly III Website Firefly III issue tracker Admin Cloudron user can login to Firefly III using their username and password. This app has no separate 'admin' account. The first user to login is made an admin (site owner). Site owners can edit and remove other users. The Firefly III UI does not have a way to grant site owner permissions to another user. Firefly III uses the SITE_OWNER environment variable in some error messages. For this reason, it is recommended to change this value in /app/data/env using the File manager. Sharing accounts Currently, sharing account between users is not implemented. See the upstream bugtracker for more information - #372 and #2531. Community Guides Running Firefly-III Importer"
