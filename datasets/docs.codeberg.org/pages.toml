["https://docs.codeberg.org/git/git-ignore"]
title = "Using .gitignore | Codeberg Documentation"
full_description = "Using .gitignore On this page Further reading You should try to keep your Git repositories small and clean of any clutter. Only the necessary files such as source files and documentation should be committed. This helps you and it also helps Codeberg, as we don't have to hold large, unnecessary files. Sometimes additional files are created within the same directory as your source files. These might be, for example binaries. To prevent accidentally committing those files to your repository, you can add file and directory names to a file named .gitignore. Files and directories that match the names in the .gitignore file are ignored by Git. They don't show up in git status and they can't be staged for a commit using git add (except when using --force). Forgejo has gitignore templates for many languages. These are shown when creating a repository. Further reading Documentation on gitignore by the Git project Section on gitignore in the book Pro Git 2nd edition Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
