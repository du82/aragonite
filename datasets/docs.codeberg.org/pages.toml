["https://docs.codeberg.org/advanced/access-token"]
title = "Generating an Access Token | Codeberg Documentation"
full_description = "Generating an Access Token On this page Generating an Access Token Deleting an Access Token Access Tokens are special tokens that are used to authenticate to Codeberg through the API. They can be used to give applications access to your Codeberg account without sharing your password. Info This guide explains how to generate an access token from the website. However, you can also generate access tokens from the API. Read more at Forgejo's documentation. Generating an Access Token Access tokens grant full access to your account. You must handle them securely. In a web browser, go to Codeberg and click on the Profiles and Settings button on the top right. The button will be your profile picture. Click on Settings in the dropdown. Navigate to the Applications settings tab. Under Manage Access Tokens | Generate New Token, enter a name to identify your token in the Token Name field. Click the generate token button. Your access token has now been generated! Copy your token and store it securely. Tip Be sure to generate new access tokens for each app you use, and delete them once they are not in use. Deleting an Access Token Once you are done using an access token, you should delete it. Deleting an access token revokes access to your account for apps using the token. To delete an access token, click the red Delete button next to the access token you want to delete, then click Yes in the popup. Your access token is now deleted. Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
