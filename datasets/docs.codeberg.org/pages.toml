["https://docs.codeberg.org/codeberg-pages/troubleshooting"]
title = "Troubleshooting | Codeberg Documentation"
full_description = "Troubleshooting On this page My web browser displays a security warning when I try to access my Codeberg Pages. My content is not updated Cloudflare and Codeberg Pages My web browser displays a security warning when I try to access my Codeberg Pages. If your user name or repository name contains a dot, your Codeberg Pages URL (https://user.name.codeberg.page or https://repo.sitory.username.codeberg.page) contains a sub-sub-domain which does not work with Let's Encrypt wildcard certificates. Use the alternative URL https://pages.codeberg.org/user.name/ as a workaround or rename you repository (e.g. replace . by _). My content is not updated The Codeberg Pages server caches files under a certain size (currently 1 MiB). Please wait a few minutes until the cache has been invalidated. This is done to improve performance, reduce cost and server load, and save energy. Cloudflare and Codeberg Pages It is important that when you use Cloudflare to manage your Domain's DNS records, that every DNS record used for Codeberg Pages needs to be set to DNS only (Have a gray cloud). This ensures that Codeberg pages can properly handle everything necessary for your site such as SSL-Certificate and redirects from other (sub-)domains. Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
