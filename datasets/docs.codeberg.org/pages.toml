["https://docs.codeberg.org/improving-codeberg/donate"]
title = "Donating to Codeberg | Codeberg Documentation"
full_description = "Donating to Codeberg On this page How to DonateReceipts for donations / membership fees Your generous donation helps Codeberg to run the servers, store thousands of awesome Free Software projects, develop new features and sustain the Free Software ecosystem around. How to Donate Liberapay Set up your recurring donation to Codeberg via Liberapay. Allows payment via Stripe (Credit or Debit Card, Direct Debit and more) and PayPal. Liberapay itself is Free Software, but the payment processors are not. Donate using Liberapay SEPA wire transfer Send us your donation directly to our bank account. An easy option for people with compatible bank accounts, and we have heard of others successfully using providers like Wise to transfer the money. Codeberg e.V. IBAN: DE90 8306 5408 0004 1042 42 BIC: GENODEF1SLR The following EPC QR code can be used to initiate a SEPA credit transfer. Notice it contains a default amount of 10 Euros, but you can change it to whatever amount you want to donate. Becoming a member of Codeberg e.V. If you join our non-profit association, your membership fee also helps keep Codeberg up and running. You can also receive voting rights and even join with your organization. Become a member! Receipts for donations / membership fees Codeberg is based in Berlin, Germany and recognized as tax-exempt by the German authorities. If you want to receive a receipt for your membership fee, please write us to codeberg-at-codeberg.org. If you want to receive a receipt for your donation, please write to us using the address above, but additionally provide us with your full name and address, as well as with the date of your donation. Warning Please beware that it might not always be possible to match your donation via PayPal and Stripe. We recommend donating via SEPA transfer if you want to be safe. Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
