["https://docs.codeberg.org/git"]
title = "Working with Git Repositories | Codeberg Documentation"
full_description = "Working with Git Repositories On these pages, you will learn how to use the Git version control system with Codeberg. There are 2 ways to interact with a Git repository hosted on Codeberg: via the command-line, either through SSH or HTTP. using the web UI Option 1 requires a Git client of your choice installed on your local system. We recommend the use of the SSH protocol. It offers improved security through key-based access (stronger protection than a regular password) and better ease of use (no need to provide credentials on every push). Find out more in this section: Using .gitignore Configuring Git Clone & Commit via CLI Clone & Commit via Web Merge multiple commits into one Tags and Releases Working with large files Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
