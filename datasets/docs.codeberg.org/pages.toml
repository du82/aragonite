["https://docs.codeberg.org/git/configuring-git"]
title = "Configuring Git | Codeberg Documentation"
full_description = "Configuring Git Once you've managed to get Git up and running, the first thing you must do before you can use your fresh installation of Git is to tell Git your name and email address. You only have to do this once; this is easily done with: git config --global user.name 'knut' git config --global user.email 'knut@example.com' The username can be anything, but it is important that the email is the same as the one you use on Codeberg. This is because the email address will later be used to assign your commits to your account. To verify that you've set up everything properly, run: git config --global --list Tip If you don't want to include your email address with your commits, you can opt to specify USERNAME@noreply.codeberg.org here instead, where USERNAME is your Codeberg username. If you ever want to change your name or email address, simply run the corresponding command again. You could also omit the --global flag to set a username and email address only for the Git repository you're currently in. Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
