["https://docs.codeberg.org/improving-documentation/docs-contributor-faq"]
title = "Documentation Contributor FAQ | Codeberg Documentation"
full_description = "Documentation Contributor FAQ On this page How should files be named? When is my contribution being approved? How to link to non-existing articles? / Draft Articles The intent of this document is to give answers to a number of questions that might arise when starting to contribute to Codeberg Documentation. If your question is not listed, feel free to ask in the issue tracker. How should files be named? Please adhere to kebab-Case naming rules for any files in Codeberg Documentation. When is my contribution being approved? A Pull Request to Codeberg/Documentation will be reviewed by at least one other Codeberg Documentation collaborators and if your Pull Request is approved, they will merge it into the main branch. There are a number of exceptions to the rule above: For bugfixes and other small and non-controversial changes, the process is much simplified - here it is enough for one collaborator to green-light and merge the changes. If you're already a collaborator yourself, feel free to merge right away (after sufficient testing, that is). For major changes, at least two people will need to approve the contribution. For changes that are critical, e.g. ones that might legally affect Codeberg e.V., the chairperson of Codeberg e.V. will need to approve of the changes as well. How to link to non-existing articles? / Draft Articles While it is not directly possible to link to non-existing articles, it is possible to create Draft Articles, which are articles that cannot be localized for example via the menu, but which do exist under their URL and do show a message stating that the article is unpublished. Creating such a draft article can be done by creating a new article with the draft property set to true, like this: --- eleventyNavigation: key: DocsContributorFAQ title: Documentation Contributor FAQ parent: ImprovingCodeberg draft: true --- Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
