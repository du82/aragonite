full_description = "Getting Started with Codeberg Hello there! We're glad you're considering to join Codeberg, the community-driven non-profit software development platform. I'm Knut the Polar Bear, and I'm going to guide you through your first steps on Codeberg. You can start with finding out more about Codeberg or by jumping right to your first steps on Codeberg. Welcome to Codeberg! 😊 Find out more in this section: What is Codeberg? Your First Steps on Codeberg Install Git Your First Repository The Basics of Issue Tracking Integrated Wiki Email Settings Licensing on Codeberg Frequently Asked Questions Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
