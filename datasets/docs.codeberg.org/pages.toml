["https://docs.codeberg.org/improving-codeberg/contributing-code"]
title = "Contributing Code | Codeberg Documentation"
full_description = "Contributing Code On this page Getting Started Finding issues to work on More questions? Hey there, thank you for heading here and your interest in improving Codeberg. This page is intended to give you a quick start on how and where to contribute code to the platform of Codeberg itself. The various projects move at their own pace, so if you already know where you are going to contribute to, check out their own contributing guides or get in touch with the maintainers. The following projects always need a helping hand: Forgejo, the software that powers Codeberg.org and all the Git features Weblate, the localization platform available at translate.codeberg.org Woodpecker CI, our hosted CI/CD solution. Codeberg Pages, a service that allows you to serve static websites from Git repositories, see codeberg.page Also check out the Codeberg and Codeberg-Infrastructure organizations, they contain numerous other software and setup projects that will appreciate your contributions. Getting Started Having a lot of options to choose from is hard. We maintain a place for all contributions to Codeberg and you should read there. If you don't know where to start, go ahead and introduce yourself there. We'll try to match you with relevant and interesting tasks. Finding issues to work on The following issue trackers may contain a few ideas for things that could be worked on: Codeberg Community Tracker Forgejo Issue Tracker We also recommend working on changes that personally bother you first. Something in the direction of simple UI changes changes would probably make the most sense, as they are the easiest to get started with and will help you get more acquainted with the codebase (which could help you solve more complicated problems later) in the process. Solving easy problems helps a lot too! It makes Codeberg's underlying software look much more polished; it also lets other contributors use more of their limited time to solve very sophisticated or unexpected problems. In the Codeberg Community Tracker, there are some issues that are marked using the contribution welcome tag. This tag is meant to show that we would really appreciate your help here. They also act as a good starting point if you are looking for something to work on. More questions? If you need help or feel stuck, need inspiration or advice, you can always reach out to us in our Contributing to Codeberg Matrix Channel. A more comprehensive list of our chat rooms can be found in the Codeberg Matrix Space. Thank you very much for your interest in improving Codeberg. Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
