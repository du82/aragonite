full_description = "Redirects On this page Status codes ExamplesSimple redirect SPA (single-page application) rewrite Splats Redirects can be created with a _redirects file with the following format: # Comment from to [status] Lines starting with # are ignored from - the path to redirect from (Note: repository and branch names are removed from request URLs) to - the path or URL to redirect to status - status code to use when redirecting (default 301) Status codes 200 - returns content from specified path (no external URLs) without changing the URL (rewrite) 301 - Moved Permanently (Permanent redirect) 302 - Found (Temporary redirect) Examples Simple redirect Redirects a specific path. /example https://example.com/ 301 /path /other-path 301 SPA (single-page application) rewrite Redirects all paths to /index.html for single-page apps. /* /index.html 200 Splats Redirects every path under /articles to /posts while keeping the path. /articles/* /posts/:splat 302 Example: /articles/2022/10/12/post-1/ -> /posts/2022/10/12/post-1/ Hey there! 👋 Thank you for reading this article! Is there something missing, or do you have an idea on how to improve the documentation? Do you want to write your own article? You're invited to contribute to the Codeberg Documentation at its source code repository, for example, by adding a pull request or joining in on the discussion in the issue tracker. For an introduction on contributing to Codeberg Documentation, please have a look at the Contributor FAQ. © Codeberg Docs Contributors. See LICENSE"
