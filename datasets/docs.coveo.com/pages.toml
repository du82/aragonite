full_description = "Coveo Platform APIs Reference documentation Under the hood, the Coveo Administration Console uses many of the platform APIs. The available API reference pages are organized below in sections similar to those of the Administration Console (platform-ca | platform-eu | platform-au) main menu to help you more easily find the appropriate API to perform a specific task. All REST API string fields are case-sensitive unless otherwise specified. For example, search queries aren’t case-sensitive. To keep behavior consistent across the Coveo Platform, the same value passed to different REST APIs must always be passed using the same case. For example, if the unique product identifier, such as ec_product_id, is passed to the Commerce API in lowercase, then it should also be passed to the Usage Analytics Write API in lowercase. Notes You may want to use the Official Coveo APIs JavaScript Client to query Coveo APIs. You can search for Coveo API Endpoints from connect.coveo.com. Coveo doesn’t support VPC peering. Content Source API Source Logs API Field API Extension API Security Cache API Index API Push API Search Search API Search Alerts API Search Usage Metrics API Search Pages API Search Interface API Machine Learning Machine Learning API Machine Learning Configuration API Analytics Usage Analytics Write API Usage Analytics Read API Organization Organization API Authorization Server API Notification API Migration API Activity API Platform API Service Schema API Customer Service API Commerce Commerce API"
