["https://docs.coveo.com/en/1655"]
title = """
Add a Jira Software Cloud source
  
            |           Coveo Platform"""
description = "Coveo Product documentation."
full_description = 'Coveo Platform Index content Sources Connector directory Add a Jira Software Cloud source Add a Jira Software Cloud source This is for: Developer System Administrator In this article Source key characteristics Requirements Add a Jira Software Cloud source Source update best practice About the Coveo User Sync app OAuth 2.0 scopes Required privileges What’s next? When you have the required privileges, you can add the content of a Jira Software Cloud instance to a Coveo organization. Leading practice The number of items that a source processes per hour (crawling speed) depends on various factors, such as network bandwidth and source configuration. See About crawling speed for information on what can impact crawling speed, as well as possible solutions. Source key characteristics The following table presents the main characteristics of a Jira Software Cloud source. Features Supported Additional information Jira Software Cloud version Latest cloud version Indexable content Jira projects, issues, comments, attachments, and work logs Content update operations refresh Takes place every hour by default. A rescan or rebuild is required to retrieve: Changes (creation, modification, deletion) on Jira projects Deletion of issues, and work logs, attachments, and comments on issues rescan Takes place every day by default. rebuild Content security options Same users and groups as in your content system Requires installing the Coveo User Sync app in your instance. See About the Coveo User Sync App for details. Specific users and groups Everyone Note Jira project metadata is included on the issues of the project, but the projects themselves aren’t indexed. Issues in a private Jira project are indexed if the crawling account is allowed to access this project. Requirements Crawling account permissions When you want to retrieve the content of your Jira Software instance, a crawling account with read permission is required. The source can only include the issues which are accessible by the source credentials you supply. You must therefore assign the source credentials to all necessary Jira Software permission schemes required to gain access to the issues to include. However, when you want to index permissions along with the content, you must also grant the Jira Administrators global permissions to the source credentials. Note When configuring the source, you must use the credentials of a native Jira Software user. Users managed by other identity providers such as Google aren’t supported. Add a Jira Software Cloud source A Jira Software Cloud source indexes cloud content. If you want to retrieve on-premises (server) content, see Add a Jira Software Data Center source instead. Leading practice It’s best to create or edit your source in your sandbox organization first. Once you’ve confirmed that it indexes the desired content, you can copy your source configuration to your production organization, either with a snapshot or manually. See About non-production organizations for more information and best practices regarding sandbox organizations. On the Sources (platform-ca | platform-eu | platform-au) page, click Add source. In the Add a source of content panel, click the Jira Software Cloud () source tile. In the Add a new Jira Cloud source panel, provide the following information: Name: The source name can’t be modified once it’s saved. Therefore, make sure to use a short and descriptive name, using letters, numbers, hyphens, and underscores. Avoid spaces and other special characters. Jira address: The root URL of your Jira instance. It often ends with jira.com. Authentication: How Coveo should log in to your Jira Software project to index your content. If you select User delegated access using OAuth 2.0 Click Authorize account, and then sign in to Jira Software with an account that has the necessary permissions to access all the content that you want to index. Click Accept to grant Coveo access to this Jira Software account. Click Add source. The Coveo OAuth 2.0 application requires read scopes only. If you select Atlassian account Create an Atlassian account dedicated to the source. This account must have access to all the content that you want to index. See Source credentials leading practices for other leading practices to follow. With this account, create an API token. This token should also be dedicated to your source. Provide Coveo with the email address and API token corresponding to the source’s Atlassian account. Install the Coveo User Sync app in your Jira Software project to synchronize users and groups with Coveo. Click Add source. If you select No login Click Next. Select who will be able to access the source items through a Coveo-powered search interface. For details on this parameter, see Content security. Click Add source. Project: Use the Project selector to associate your source with one or more Coveo project(s). Note After source creation, you can update your Coveo project selection under the Identification subtab. "Configuration" tab When configuring or editing your Jira Software Cloud source, the Configuration tab is selected by default. It contains your source’s general and authentication information, as well as other parameters that let you specify the content to index. "Content to index" subtab The Content to index subtab lets you define the content that you want to make available as search results. Additional content Optionally, you can index the files attached to the indexed issues and comments. You can also index comments posted on issues. These comments will be indexed as metadata of this content. Moreover, you can index work logs from time entries on indexed issues. "Advanced settings" subtab The Advanced settings subtab lets you customize the Coveo crawler behavior. All advanced settings have default values that are adequate in most use cases. Content and images If you want Coveo to extract text from image files or PDF files containing images, enable the appropriate option. The extracted text is processed as item data, meaning that it’s fully searchable and will appear in the item Quick view. See Enable optical character recognition for details on this feature. "Authentication" subtab The Authentication subtab contains settings used by the source crawler to emulate the behavior of a user authenticating to access restricted Jira Software content. Jira address: The root URL of your Jira instance. It often ends with jira.com. Authentication: How Coveo should log in to your Jira Software project to index your content. If you select User delegated access using OAuth 2.0 Click Authorize account, and then sign in to Jira Software with an account that has the necessary permissions to access all the content that you want to index. Click Accept to grant Coveo access to this Jira Software account. The Coveo OAuth 2.0 application requires read scopes only. If you select Atlassian account Create an Atlassian account dedicated to the source. This account must have access to all the content that you want to index. See Source credentials leading practices for other leading practices to follow. With this account, create an API token. This token should also be dedicated to your source. Provide Coveo with the email address and API token corresponding to the source’s Atlassian account. Install the Coveo User Sync app in your Jira Software project to synchronize users and groups with Coveo. If you select No login Go to the Content security tab, and then select who will be able to access the source items through a Coveo-powered search interface. For details on this parameter, see Content security. "Identification" subtab The Identification subtab contains general information about the source. Name The source name. It can’t be modified once it’s saved. Project Use the Project selector to associate your source with one or more Coveo projects. "Content security" tab Select who will be able to access the source items through a Coveo-powered search interface. For details on this parameter, see Content security. Notes The Same users and groups as in your content system option requires you to install the Coveo User Sync app in your instance. Install the version of the app that corresponds to the region of your Coveo organization, or install the HIPAA version for Coveo HIPAA environments. See About the Coveo User Sync App for details. In order to implement the above option and index these permissions, you must provide the credentials of a Jira Administrator account in the Configuration tab, under Authentication. "Access" tab In the Access tab, specify whether each group (and API key, if applicable) in your Coveo organization can view or edit the current source. For example, when creating a new source, you could decide that members of Group A can edit its configuration, while Group B can only view it. For more information, see Custom access level. Completion Finish adding or editing your source: When you want to save your source configuration changes without starting a build/rebuild, such as when you know you want to do other changes soon, click Add source/Save. When you’re done editing the source and want to make changes effective, click Add and build source/Save and rebuild source. Leading practice By default, a Jira Software source indexes the entire Jira Software instance content. If you want to index only certain projects, click Save, and then specify the desired address patterns in your source JSON configuration before launching the initial build. See Add source filters for further information. Note On the Sources (platform-ca | platform-eu | platform-au) page, you must click Launch build or Start required rebuild in the source Status column to add the source content or to make your changes effective, respectively. Back on the Sources (platform-ca | platform-eu | platform-au) page, you can follow the progress of your source addition or modification. Once the source is built or rebuilt, you can review its content in the Content Browser. Once your source is done building or rebuilding, review the metadata Coveo is retrieving from your content. On the Sources (platform-ca | platform-eu | platform-au) page, click your source, and then click More > View and map metadata in the Action bar. If you want to use a currently not indexed metadata in a facet or result template, map it to a field. Click the metadata and then, at the top right, click Add to Index. In the Apply a mapping on all item types of a source panel, select the field you want to map the metadata to, or add a new field if none of the existing fields are appropriate. Notes For details on configuring a new field, see Add or edit a field. For advanced mapping configurations, like applying a mapping to a specific item type, see Manage mappings. Should you need to create mapping rules for Jira Software custom fields, see this article. Click Apply mapping. Depending on the source type you use, you may be able to extract additional metadata from your content. You can then map that metadata to a field, just like you did for the default metadata. More on custom metadata extraction and indexing Some source types let you define rules to extract metadata beyond the default metadata Coveo discovers during the initial source build. For example: Source type Custom metadata extraction methods Push API Define metadata key-value pairs in the addOrUpdate section of the PUT request payload used to upload push operations to an Amazon S3 file container. REST API and GraphQL API In the JSON configuration (REST API | GraphQL API) of the source, define metadata names (REST API | GraphQL API) and specify where to locate the metadata values in the JSON API response Coveo receives. Database Add <CustomField> elements in the XML configuration. Each element defines a metadata name and the database field to use to populate the metadata with. Web Configure web scraping configurations that contain metadata extraction rules using CSS or XPath selectors. Extract metadata from JSON-LD <script> tags. Sitemap Extract metadata included in the XML sitemap file. Configure web scraping configurations that contain metadata extraction rules using CSS or XPath selectors. Extract JSON-LD <script> tag metadata. Extract <meta> tag content using the IndexHtmlMetadata JSON parameter. Some source types automatically map metadata to default or user created fields, making the mapping process unnecessary. Some source types automatically create mappings and fields for you when you configure metadata extraction. See your source type documentation for more details. When you’re done reviewing and mapping metadata, return to the Sources (platform-ca | platform-eu | platform-au) page. To reindex your source with your new mappings, click Launch rebuild in the source Status column. Once the source is rebuilt, you can review its content in the Content Browser. Source update best practice You can get the JIRA_UNREACHABLE_SERVER error message when your Jira Software Cloud source rebuilds or is scheduled to perform a rescan during the daily Atlassian Cloud maintenance window (1 AM to 3 AM, in your server’s time zone). During this period, Atlassian may block access to the API while performing maintenance tasks. If possible, schedule your source’s rescans so that they’re completed outside of the daily maintenance window. If not possible, ignore the errors. The next scheduled rescan outside the maintenance window shall complete normally. About the Coveo User Sync app Installing Coveo’s User Sync app in your Atlassian instance is required to replicate your instance’s content access permissions in your search interface. This lets users see in their Coveo search results the content that their role allows them to see in your Atlassian instance. To replicate your instance’s permission system, Coveo must associate user email addresses with user roles. Atlassian’s API doesn’t provide this information, but provides the roles assigned to each user account ID. So, Coveo built the User Sync app to retrieve the email address corresponding to each user account ID. It can then combine this information with the roles and account IDs provided by Atlassian’s API. Should you ever switch your source’s content security setting from Everyone to Same users and groups as in your content system, you’ll need to refresh the security identity provider after installing the app. For more information on sources that index permissions and on how Coveo handles these permissions, see Coveo management of security identities and item permissions. OAuth 2.0 scopes The Coveo OAuth 2.0 application requires the following scopes: read:jira-work read:jira-user read:issue-security-level:jira read:project-role:jira read:field:jira read:user:jira read:license:jira read:group:jira read:avatar:jira read:me Required privileges You can assign privileges to allow access to specific tools in the Coveo Administration Console. The following table indicates the privileges required to view or e'
