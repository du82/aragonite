["https://docs.coveo.com/en/1739"]
title = """
Add a SharePoint Online source
  
            |           Coveo Platform"""
description = "Coveo Product documentation."
full_description = "Coveo Platform Index content Sources Connector directory Add a SharePoint Online source Add a SharePoint Online source This is for: Developer System Administrator In this article Source key characteristics Authentication and site access Domain Name System records configuration for Microsoft 365 Add a SharePoint Online source Safely apply content filtering Update a SharePoint Online access token Required privileges What’s next? Members with the required privileges can index SharePoint Online or OneDrive content and make it searchable. In a Coveo-powered search interface, the source content is accessible to either everyone, some specific users and groups, or the same users and groups as in the content system. SharePoint Online tenants typically hold large volumes of content. Follow the SharePoint Online source configuration leading practices to optimize indexing performance. Notes To retrieve SharePoint on-premises content, you must create a SharePoint Server source. The item modifications that are retrievable during a source rescan are determined by the options selected when adding or editing the SharePoint Online source in the Additional content section. Following a refresh operation, deleted discussion lists are excluded from your SharePoint Online source content, but replies to the original discussion message will only be excluded following the next rescan operation. This is a known issue caused by a limitation of SharePoint Online. Source key characteristics The following table presents the main characteristics of a SharePoint Online source. Features Supported Additional information SharePoint Online version Latest cloud version Indexable content Sites, sub-sites, user profiles, personal websites, lists, list items, list item attachments, document libraries, document sets, documents, web parts, and microblog posts and replies. If you select Specific URLs or User profiles in the Content section, some additional items will be indexed. To retrieve user profiles, the source must dig through your SharePoint Online instance, including your host site collection and the items it contains. The items it encounters in the process are retrieved and indexed as well. Content update operations refresh Takes place every hour by default. A refresh doesn’t capture groups that are added/removed using the SharePoint Advanced site permissions panel. Only rescans and rebuilds capture these changes. rescan Takes place every week by default. Extracts all the data and indexes the following: modified permissions on items, new items, existing items with a modified date greater than the date in the index, and existing items with a computed entity tag[1] different than the one in the index. Coveo runs refreshes in parallel with rescan operations only when App authentication using certificate is used. rebuild Content security options Same users and groups as in your content system Specific users and groups Everyone metadata indexing for search Automapping of metadata to a field with a matching name Disabled by default and not recommended for this source type. Automatically indexed metadata Sample of autopopulated fields (no user-defined metadata required): • author • clickableuri • date • filename • filetype • indexeddate • language (autodetected from item content) • searchablemeta [2] • spolistbasetype • spolisttype • spparentname • spsitename • title After a content update operation, inspect your item field values in the Content Browser. Collected indexable metadata The SharePoint Online source collects some of the site, list, list item, and file-level metadata that the SharePoint Online APIs make available. After a rebuild, review the View and map metadata subpage for the list of indexed metadata and to index additional metadata from those available. Custom metadata collection Add columns to your list and libraries. Then, your SharePoint Online source will automatically collect the metadata in these columns on content update operations. Authentication and site access A SharePoint Online source uses the OAuth 2.0 authorization protocol to access your SharePoint Online site content, and the source must authenticate through an Azure Active Directory application. You can choose to authenticate the Azure Active Directory application via a client certificate using app-only permissions, or using a delegated SharePoint Online user account (crawling account). The authentication method you choose depends mainly on your individual needs and corporate policy. Before creating a new SharePoint Online source: Determine the authentication method you want to use. The following subsections highlight the main advantages of each authentication method. Perform the related prerequisites (see App authentication using certificate prerequisites or User delegated access using OAuth 2.0 prerequisites). Notes It’s important to know the difference between site access, indexed items, and user access to content. Authenticating through a certificate or a delegated crawling account gives Coveo authorization to crawl site content in your SharePoint Online tenant. The sites and items that are actually indexed by your SharePoint Online source are determined by your source Content to index settings. User access to the indexed items through a Coveo-powered search interface depends on your source Content Security settings. You must enter authentication credentials to be able to save a new SharePoint Online source configuration. App authentication using certificate (recommended) The main advantages of App authentication using certificate are: It provides a higher throttling rate limit than User delegated access using OAuth 2.0, and is recommended for indexing large amounts of data. It enables parallel refreshes, which improve content freshness by indexing latest changes even when the source is performing a long rescan operation. It allows more flexibility than User delegated access using OAuth 2.0 in terms of content access. You can grant the source with permission to access all site content, personal sites, and user profiles in your SharePoint Online tenant without having to provide individual access to each site. The content that’s actually crawled and indexed depends on your source Content to index subtab settings. You can grant the source with access to only a subset of site collections using the Sites.Selected permission (instead of Sites.FullControl.All). It provides easier setup, as you don’t need to create and manage a crawling account in SharePoint Online, assign the account appropriate roles and permissions, and grant the account access to content. App authentication using certificate prerequisites If you choose to authenticate using a certificate, you must perform the following before creating your SharePoint Online source: Create a client certificate. Create the Azure Active Directory application and assign the required permissions. Add the client certificate to the Azure Active Directory application. Create a client certificate Your SharePoint Online source uses the client certificate to authenticate the Azure Active Directory application to crawl your SharePoint Online tenant. Create a CA-signed certificate using a trusted certificate authority (recommended), or a self-signed certificate using the method of your choice. Note The certificate file format must be .cer, .pem, or .cert. You’ll need the certificate file when adding the certificate to your Azure Active Directory application. Export the certificate as a password-protected .pfx file. Depending on how you created the certificate file, the .pfx file may be created for you automatically. Note You’ll need the .pfx file and password when creating your SharePoint Online source. Create the Azure Active Directory application The Azure Active Directory application that you create for use with your source grants Coveo the permissions to crawl your SharePoint Online tenant. Create the application and assign the required permissions as follows: Access your Azure portal with an administrator account, and create (register) an Azure Active Directory application. Notes Select Accounts in this organizational directory only for the Supported account type option when creating the application. Once you register the application, you’re taken to the application Overview page in Azure. Take note of the Application (client) ID and Directory (tenant) ID as you’ll need them when creating your SharePoint Online source. Grant the Azure Active Directory application the required crawling permissions as follows: If you’re currently on your application’s page in Azure, proceed to the next step. Otherwise, access your Azure portal with an administrator account, click App registration, and then click the application you created previously. Click API permissions. If the User.Read permission is added by default, click the permission, and then click Remove permission. For each of the following required permissions, click Add a permission, and then in the Microsoft APIs tab: Click Microsoft Graph, click Application permissions, and then add the following permissions: Directory.Read.All Group.Read.All Sites.Read.All (recommended) or Sites.Selected Click SharePoint, click Application permissions, and then add the following permissions: Sites.FullControl.All (recommended) or Sites.Selected Sites.Selected isn’t compatible with the All sites and Hub sites content retrieval options. If you select the Sites.Selected scope, you need to grant the application FullControl access on a per-site basis, for each site you want to index. See Controlling app access on specific SharePoint site collections is now available in Microsoft Graph and Use Sites.Selected Permission with FullControl rather than Write or Read for further details. Create only one application per tenant when using Site.Selected. Then re-use the certificate for all sites to crawl across all sources that target the same tenant. You can’t target a set of sites using one application and another set of sites in the same tenant using another application. A security provider for the tenant is created when the first source is created. If you create a second source to capture content from the same tenant, the second source will use the same security provider as the first. User.Read.All Once you’ve added all the required permissions, grant tenant-wide admin consent to the application. Note You must have the appropriate user role to be authorized to consent on behalf of the organization. Add the client certificate to the Azure Active Directory application Follow the Microsoft documentation to add your certificate to the Azure Active Directory application. (Optional) Create a selected sites list in SharePoint Online With App authentication using certificate, if you want to use the Selected sites list URL option, you need to create a list of the selected site collections you’ve granted your application access to. You can then reference the URL of this list in your SharePoint Online source. To create the list in SharePoint Online In your SharePoint Online tenant, access one of the sites that your application has access to. Go to Site Contents. Click + New > List. Enter a descriptive Name for the list (for example, selected-sites-list), and optionally, a Description. Then click Create. In the list, click + Add column. Select the Hyperlink column type, and then click Next. For the Name field, type Url (with that precise casing), and then click Save. For each site collection that you want to index, add a new list item, and then enter the site URL in the Url column. Azure application permissions with App authentication using certificate To work with Microsoft APIs (CSOM and REST), Coveo must authenticate via an Azure Active Directory application that has the proper permissions. The access token is then limited to these permissions, which are necessary to successfully crawl SharePoint Online. You must provide tenant-wide admin consent for the permissions in the Azure Active Directory application that’s used to authenticate your source. Typically, you provide consent when creating the Azure Active Directory application for use with Coveo, but you can do so at a later time. Notes To provide admin consent, you must have the appropriate user role. You won’t be able to index your SharePoint Online content until you provide admin consent. The application permissions determine what Coveo can access when crawling your SharePoint Online tenant. The sites and items that are actually crawled and indexed by your SharePoint Online source depends on your source Content to index subtab settings. User access to the indexed items through a Coveo-powered search interface depends on your source Content security setting. Coveo is a verified publisher for the Azure application. You must provide admin consent for all required application permissions. The following table provides a description of the permissions that you must grant the application when using App authentication using certificate. API Permission Justification SharePoint Sites.FullControl.All Allows Coveo to retrieve permissions of crawled items, such as sites, users, lists, and documents. Why is FullControl required? Coveo indexes item permissions to support the Same users and groups as in your content system content security source option, ensuring user access to items in a Coveo-powered search interface mirrors your SharePoint permission system. To get all item permissions, Coveo needs to access the list of Site Collection Administrators, which Microsoft considers to contain sensitive information. Microsoft requires a user to be Site Collection Administrator to view, add, or edit this list, in other words, someone with FullControl on the site collection. This is why the application needs FullControl. Sites.Selected (FullControl) Grants Coveo the permission to access only a specified subset of site collections. You need to grant the application the FullControl permission on each crawled site. Why is FullControl required? Coveo indexes item permissions to support the Same users and groups as in your content system content security source option, ensuring user access to items in a Coveo-powered search interface mirrors your SharePoint permission system. To get all item permissions, Coveo needs to access the list of Site Collection Administrators, which Microsoft considers to contain sensitive information. Microsoft requires a user to be Site Collection Administrator to view, add, or edit this list, in other words, someone with FullControl on the site collection. This is why the application needs FullControl. Note The Sites.Selected permission can’t be used with the All sites and Hub sites options. User.Read.All Grants Coveo the permission to crawl user profiles. Note Coveo crawls all user profiles in your SharePoint Online tenant. You can’t choose to grant Coveo access to crawl only specific user profiles. Microsoft Graph Sites.Read.All Grants Coveo the permission"
