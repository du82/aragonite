description = "Coveo Product documentation."
full_description = "Solutions and integrations Solutions and integrations This is for: Developer Business Analyst System Administrator In this article Commerce Website Service Workplace The Coveo Platform offers integrations, frameworks, and APIs allowing you to unlock the value of your information ecosystem by delivering the best information at the right moment using AI-powered search and relevance. Integrations Commerce Website Service Workplace Coveo for Adobe Coveo for Commerce Coveo for Genesys Cloud Coveo for Salesforce Coveo for ServiceNow Coveo for Sitecore Coveo for Zendesk Coveo for Optimizely Coveo for Contentful Coveo In-Product Experience (IPX) The purpose of this article is to guide you towards the appropriate documentation for the solutions you want to develop using Coveo. Commerce Coveo for Commerce is a set of tools and features that help you create a personalized and relevant experience for your customers for B2C and B2B. B2C ecommerce product discovery Ecommerce customers value 1:1 personalized experiences, but this can be challenging when many site visitors are anonymous. Thanks to its Coveo Personalization-as-you-go models, Coveo can personalize customer experiences in real time, optimizing the experience with every click and interaction. Additionally, with Coveo Machine Learning (Coveo ML), you can showcase offerings that are both, relevant to individual customers, and increase your profitability. Furthermore, you can ensure each customer connects with the right product, at the right price, according to localized inventory or allotments. Explore specific integrations that suit your needs such as SAP Commerce, Salesforce Commerce Cloud B2C, and Sitecore Commerce. B2B commerce search Coveo helps B2B buyers navigate a product inventory efficiently with search capabilities tailored to their needs, from partial part number search to dynamic filters. Coveo can rank products based on individual preferences and margin data. This connects customers and sales teams to the products and rich content necessary for informed purchase decisions. Furthermore, you can ensure each buyer connects with the right product, at the right price, according to localized inventory or allotments. Consult our product documentation for Salesforce B2B Commerce on Lightning Experience, Salesforce B2B Commerce for Visualforce, and SAP Commerce. Website Coveo offers generic connectors and product-specific connectors to index your web content. Integrate AI-powered search into any web application or CMS, and offer your website visitors the most relevant experience at every touchpoint. For specific CMS connectors and integrations, refer to the appropriate documentation below: Sitecore XP or XM: Coveo for Sitecore. Adobe Experience Manager: Coveo for Adobe. Optimizely: Coveo for Optimizely. Contentful: Coveo for Contentful. Service Coveo’s extensive selection of connectors unifies structured and unstructured data to create a repository of knowledge. AI-powered intent detection, query suggestions, and recommendations ensure that even large and complex indexes will always return the most relevant content, personalized for each end user. If you’re using Genesys Cloud, Salesforce Service or Experience Cloud, ServiceNow, Slack, or Zendesk, we recommend that you use the corresponding Coveo integration (see Coveo for Genesys Cloud, Coveo for Salesforce, Coveo for ServiceNow, or Coveo for Zendesk). Workplace Coveo unifies knowledge in a secured fashion using a large selection of connectors. permissions for each indexed data repository are stored to provide users sub-second access to the same data, and only the data, they can see in those repositories. The Coveo Atomic library offers a large quantity of search components that are approachable for newcomers and highly flexible for power users. Advanced usage analytics and machine learning will give you an overview of the users' preferences and provide the most relevant content every time. Get started with the Coveo implementation guide. Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit atomic-result-section-excerpt{ max-height: 3rem !important; margin: 0px !important; font-size: 0.75rem !important; } atomic-result-link atomic-result-text { font-size: 1rem !important; font-weight: 400; color: var(--atomic-recommendations-text); } Make every experience relevant with Coveo Contact us Get a free trial In this article"
