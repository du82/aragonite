["https://docs.coveo.com/en/1637"]
title = """
Add a YouTube source
  
            |           Coveo Platform"""
description = "Add a YouTube source to index public YouTube content in your Coveo organization."
full_description = 'Coveo Platform Index content Sources Connector directory Add a YouTube source Add a YouTube source This is for: Developer System Administrator In this article Source key characteristics Add a YouTube source Required privileges What’s next? Members with the required privileges can add public YouTube company or user channel content to a Coveo organization. Note To index private channel content, use the REST API source to authorize requests to the YouTube Data API. In a Coveo-powered search interface, the source content is accessible to either everyone or some specific users and groups only (see Content Security). Source key characteristics The following table presents the main characteristics of a YouTube source. Features Supported Additional information YouTube version Data API (v3) Indexable content metadata on videos (videos themselves are not indexed) Channel playlists Playlist items Content update operations refresh A rescan or rebuild is required to take account of: Deleted videos Changes on videos Statistics (for example, view counts and likes) updates Playlist and playlist item updates rescan To comply with YouTube API Developer Policies, Coveo automatically triggers a rescan when no rebuild or scheduled rescan has occurred for 30 days. rebuild Content security options Same users and groups as in your content system Specific users and groups Everyone Add a YouTube source Follow the instructions below to add a YouTube source. On the Sources (platform-ca | platform-eu | platform-au) page, click Add source. In the Add a source of content panel, click the YouTube source tile. Configure your source. Leading practice It’s best to create or edit your source in your sandbox organization first. Once you’ve confirmed that it indexes the desired content, you can copy your source configuration to your production organization, either with a snapshot or manually. See About non-production organizations for more information and best practices regarding sandbox organizations. "Configuration" tab On the Add a YouTube source page, the Configuration tab is selected by default. It contains general and authentication information about your source, as well as other parameters. Name Enter a name for your source. Leading practice A source name can’t be modified once it’s saved, therefore be sure to use a short and descriptive name, using letters, numbers, hyphens (-), and underscores (_). Avoid spaces and other special characters. User, channel, or playlist URLs The address of one or more YouTube user or company channels, or playlists. URLs with the following formats are supported: https://www.youtube.com/@<CHANNEL_HANDLE> https://www.youtube.com/channel/<CHANNEL_ID> https://www.youtube.com/user/<USERNAME> https://www.youtube.com/playlist?list=<PLAYLIST_ID> Custom channel URLs (that is, URLs in the https://www.youtube.com/c/<NAME> format) aren’t supported. Include playlists Select the checkbox when you want YouTube channel playlists and playlist items to be included. Note This option isn’t used when you specify a playlist URL under User, channel, or playlist URLs. Project Use the Project selector to associate your source with one or more Coveo projects. "Content security" tab Select who will be able to access the source items through a Coveo-powered search interface. For details on this parameter, see Content security. "Access" tab In the Access tab, specify whether each group (and API key, if applicable) in your Coveo organization can view or edit the current source. For example, when creating a new source, you could decide that members of Group A can edit its configuration, while Group B can only view it. For more information, see Custom access level. Completion Finish adding or editing your source: When you want to save your source configuration changes without starting a build/rebuild, such as when you know you want to do other changes soon, click Add source/Save. When you’re done editing the source and want to make changes effective, click Add and build source/Save and rebuild source. Note On the Sources (platform-ca | platform-eu | platform-au) page, you must click Launch build or Start required rebuild in the source Status column to add the source content or to make your changes effective, respectively. Back on the Sources (platform-ca | platform-eu | platform-au) page, you can follow the progress of your source addition or modification. Once the source is built or rebuilt, you can review its content in the Content Browser. Once your source is done building or rebuilding, review the metadata Coveo is retrieving from your content. On the Sources (platform-ca | platform-eu | platform-au) page, click your source, and then click More > View and map metadata in the Action bar. If you want to use a currently not indexed metadata in a facet or result template, map it to a field. Click the metadata and then, at the top right, click Add to Index. In the Apply a mapping on all item types of a source panel, select the field you want to map the metadata to, or add a new field if none of the existing fields are appropriate. Notes For details on configuring a new field, see Add or edit a field. For advanced mapping configurations, like applying a mapping to a specific item type, see Manage mappings. Click Apply mapping. Depending on the source type you use, you may be able to extract additional metadata from your content. You can then map that metadata to a field, just like you did for the default metadata. More on custom metadata extraction and indexing Some source types let you define rules to extract metadata beyond the default metadata Coveo discovers during the initial source build. For example: Source type Custom metadata extraction methods Push API Define metadata key-value pairs in the addOrUpdate section of the PUT request payload used to upload push operations to an Amazon S3 file container. REST API and GraphQL API In the JSON configuration (REST API | GraphQL API) of the source, define metadata names (REST API | GraphQL API) and specify where to locate the metadata values in the JSON API response Coveo receives. Database Add <CustomField> elements in the XML configuration. Each element defines a metadata name and the database field to use to populate the metadata with. Web Configure web scraping configurations that contain metadata extraction rules using CSS or XPath selectors. Extract metadata from JSON-LD <script> tags. Sitemap Extract metadata included in the XML sitemap file. Configure web scraping configurations that contain metadata extraction rules using CSS or XPath selectors. Extract JSON-LD <script> tag metadata. Extract <meta> tag content using the IndexHtmlMetadata JSON parameter. Some source types automatically map metadata to default or user created fields, making the mapping process unnecessary. Some source types automatically create mappings and fields for you when you configure metadata extraction. See your source type documentation for more details. When you’re done reviewing and mapping metadata, return to the Sources (platform-ca | platform-eu | platform-au) page. To reindex your source with your new mappings, click Launch rebuild in the source Status column. Once the source is rebuilt, you can review its content in the Content Browser. Required privileges You can assign privileges to allow access to specific tools in the Coveo Administration Console. The following table indicates the privileges required to view or edit elements of the Sources (platform-ca | platform-eu | platform-au) page and associated panels. See Manage privileges and Privilege reference for more information. Note The Edit all privilege isn’t required to create sources. When granting privileges for the Sources domain, you can grant a group or API key the View all or Custom access level, instead of Edit all, and then select the Can Create checkbox to allow users to create sources. See Can Create ability dependence for more information. Actions Service Domain Required access level View sources, view source update schedules, and subscribe to source notifications Content Fields View Sources Organization Organization Edit sources, edit source update schedules, and edit source mappings Organization Organization View Content Fields Edit Sources View and map metadata Content Source metadata View Fields Organization Organization Content Sources Edit What’s next? Schedule source updates. Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit atomic-result-section-excerpt{ max-height: 3rem !important; margin: 0px !important; font-size: 0.75rem !important; } atomic-result-link atomic-result-text { font-size: 1rem !important; font-weight: 400; color: var(--atomic-recommendations-text); } Make every experience relevant with Coveo Contact us Get a free trial In this article'
