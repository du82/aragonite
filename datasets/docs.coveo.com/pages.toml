["https://docs.coveo.com/en/quantic/latest"]
title = """
Use the Quantic library
  
            |           Coveo Quantic"""
description = "Coveo Product documentation."
full_description = "Solutions and integrations Coveo for Salesforce Develop and customize Use the Quantic library Use the Quantic library This is for: Developer System Administrator In this article What’s Coveo Quantic? When Should I Use Quantic? Where Do I Start? What’s Coveo Quantic? Coveo Quantic is a Lightning Web Component (LWC) library for assembling powerful and responsive Coveo for Salesforce search interfaces, Coveo Case Assist interfaces, and Insight Panels. Quantic components are self-encapsulated, composable, and lightweight. Under the hood, Quantic relies on the Coveo Headless library to interface with the Coveo platform and handle the application state. When Should I Use Quantic? Quantic is the most modern way to build Coveo for Salesforce search interfaces, Case Assist interfaces and Insight Panels. As LWCs, Quantic components are faster than the previous generation of Coveo for Salesforce components, implemented in the Lightning Aura framework. As opposed to Coveo Lightning Aura components that you can drag and drop out of the box, the Quantic library is deployed as an unlocked package and requires you to create your own components from it. This means that using Quantic requires developer skills. Assuming that you have such skills, you can wrap the components of the Quantic package to create your own search interface, Case Assist interface or Insight Panels. It’s much easier to create components using Quantic components than it is using the Coveo for Salesforce Lightning Aura ones. In short, if you have developer skills and want to create new Coveo for Salesforce search interfaces or Case Assist interfaces, we recommend using Quantic. If you want to implement an Insight Panel, we recommend using the out-of-the-box Hosted Insight Panel, built using Quantic. Notes Quantic is compatible with both the Lightning Aura and Lightning Web Runtime (LWR) frameworks, though not with the LWR Locker. Quantic components aren’t meant to communicate with Coveo Lightning Aura components. As such, you can’t use a Quantic Standalone Search Box in conjunction with a Coveo Lightning Aura Full Search Page, for example. Where Do I Start? To learn the basics of the Quantic library, see the Usage section. You may also want to check out the Quantic Component Reference. Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit atomic-result-section-excerpt{ max-height: 3rem !important; margin: 0px !important; font-size: 0.75rem !important; } atomic-result-link atomic-result-text { font-size: 1rem !important; font-weight: 400; color: var(--atomic-recommendations-text); } Make every experience relevant with Coveo Contact us Get a free trial In this article"
