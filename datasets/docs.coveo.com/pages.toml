description = "Coveo Product documentation."
full_description = "Compliance Compliance This is for: System Administrator Coveo is committed to complying with all applicable laws and regulations. Coveo monitors the ever-evolving regulatory landscape to make sure its services and governance practices meet industry standards. Policies establish parameters and requirements surrounding Coveo’s compliance activities to ensure enforcement. Coveo also trusts its customers to comply with applicable laws and regulations and to abide by their contractual obligations, as set forth in the customer agreement and data processing addendum, and to follow Coveo’s acceptable use policy. When using a SaaS solution, compliance is indeed a collective effort and certain responsibilities lie with our customers. Coveo also understands that some customers may be subject to specific laws, such as the General Data Protection Regulation (GDPR), the California Consumer Privacy Act (CCPA), or the Health Insurance Portability and Accountability Act (HIPAA), among others. To ease compliance with these requirements when using Coveo, Coveo provides several features that enable customers to better meet their legal obligations. For more information regarding these features and how customers may enable them within the Coveo Platform, see the following articles. Customer data Data privacy features About the Coveo HIPAA platform Data processing and residency Data tracking Data retention Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit atomic-result-section-excerpt{ max-height: 3rem !important; margin: 0px !important; font-size: 0.75rem !important; } atomic-result-link atomic-result-text { font-size: 1rem !important; font-weight: 400; color: var(--atomic-recommendations-text); } Make every experience relevant with Coveo Contact us Get a free trial In this article"
