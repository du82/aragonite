title = """
Add a Web source
  
            |           Coveo Platform"""
description = "Make website content searchable by creating a Web source: automatic page discovery, custom crawling rules, metadata indexing, OCR, JavaScript rendering."
full_description = '''Coveo Platform Index content Sources Connector directory Add a Web source Add a Web source This is for: Developer System Administrator In this article Source key characteristics Limitations Leading practices Add a Web source Required privileges Proof of website ownership Migrate from manual form authentication What’s next? Members with the required privileges can use a Web source to make the content of a website searchable. The Web source crawler behaves similarly to bots of web search engines such as Google. The source only needs a starting URL and then automatically discovers all the pages of the site following the site navigation and hyperlinks appearing on the pages. Consequently, only pages that are discovered are indexed, and in the order they’re discovered. Source key characteristics The following table presents the main characteristics of a Web source. Features Supported Additional information Indexable content Webpages (complete) Content update operations refresh rescan Takes place every day by default The source uses changes to metadata such as the ETag and Last-Modified server response headers, as well as content size, to determine if an item has changed since the last update. rebuild Content security options Same users and groups as in your content system Specific users and groups Everyone Authentication methods Basic authentication Form authentication Crawling rules A variety of basic and advanced rules may be used to ignore the webpages you don’t want to index. metadata indexing for search Automapping of metadata to a field with a matching name Disabled by default. To enable, access the JSON configuration of your source, and set performFieldMappingUsingAllOrigins to true. Automatically indexed metadata Sample of autopopulated fields (no user-defined metadata required): clickableuri date fileextension filetype language (autodetected from document content) title The author field will also be autopopulated if the content item contains an author metadata value. After a content update operation, inspect your item field values in the Content Browser. Collected indexable metadata The source automatically collects the content attribute of <meta> tags when the tag is keyed with one of the following attributes: name, property, itemprop, or http-equiv. For example, if the HTML of a page contains the following: <meta name="author" content="jsmith"/>, the Web source extracts jsmith as the author metadata. After a rebuild, review the View and map metadata subpage for the list of indexed metadata and to index additional metadata from those available. Custom metadata collection Available using the following source features: • Web scraping • IndexJsonLdMetadata JSON configuration parameter Web scraping Exclude irrelevant sections in pages, extract custom metadata, and generate sub-items. Optical Character Recognition (OCR) Available at an extra charge. Contact Coveo Sales to add this feature to your Coveo organization license. JavaScript content rendering The crawler can run JavaScript on a webpage to dynamically render content before indexing the page. Robots.txt crawl-delay and page restrictions Some lesser-known robots.txt directives such as visit-time and request-rate aren’t supported. Limitations Only pages reachable through website page hyperlinks are indexed. For example, the Web source crawler doesn’t follow options in a <select> tag. Refresh isn’t available. A daily rescan is defined, but not enabled by default. You can enable this daily rescan on a per-source basis. Multi-factor authentication (MFA) and CAPTCHA aren’t supported. Indexing page permissions isn’t supported. Content in pop-up windows and page elements requiring interaction aren’t indexed. Although, in the source JSON configuration, the MaxPageSizeInBytes is set to 0 (unlimited size) by default, the Coveo indexing pipeline can handle web pages up to 512 MB only. Larger pages are indexed by reference (that is, their content is ignored by the Coveo crawler, and only their metadata and path are searchable). Therefore, no search result Quick view is available for these larger items. When the Execute JavaScript on pages option is enabled: The Web source doesn’t support sending AdditionalHeaders The Web source doesn’t support the UseProxy parameter. Basic authentication isn’t supported. The UseProxy parameter can’t be used in combination with Form authentication. The Coveo crawler doesn’t find links in the shadow DOM. When indexing content with the Crawling Module, ensure not to change space character encoding in your items' URIs, as Coveo uses these URIs to distinguish items. For example, an item whose URI would change from example.com/my first item to example.com/my%20first%20item wouldn’t be recognized as the same by Coveo. As a result, it would be indexed twice, and the older version wouldn’t be deleted. Item URIs are displayed in the Content Browser (platform-ca | platform-eu | platform-au). We recommend you check where these URIs come from before making changes that affect space character encoding. Depending on your source type, the URI may be an item’s URL, or it may be built out of pieces of metadata by your source mapping rules. For example, your item URIs may consist in the main site URL, plus the item filename, due to a mapping rule such as example.com/%[filename]. In such a case, changing space encoding in the item filename could impact the URI. Leading practices Favor using a Sitemap source when the site features a sitemap file. When a connector exists for the technology powering the website, rather create a source based on that connector, as it will typically index content, metadata, and permissions more effectively. Example You want to make an Atlassian Confluence-powered site content searchable. Create a Confluence source, not a Web source. It’s best to create or edit your source in your sandbox organization first. Once you have confirmed that it indexes the desired content, you can copy your source configuration to your production organization, either with a snapshot or manually. See About non-production organizations for more information and best practices regarding sandbox organizations. Always try authenticating without a custom login sequence first. You should only start working on a custom login sequence when you’re sure your form authentication details (that is, login address, user credentials, validation method) are accurate and that the standard form authentication process doesn’t work. Ensure that you have the right to crawl the public content in the event where you aren’t the owner of the website. Crawling sites that you don’t own nor have the right to crawl could create reachability issues. Furthermore, certain sites may use security mechanisms that can impact Coveo’s ability to retrieve the content. If you’re unfamiliar with these mechanisms, we recommend investigating and learning about them beforehand. For example, one impact this type of software (for example, Akamai, Cloudflare) can have is detecting the Coveo crawler as an attack and blocking it from any further crawling. The number of items that a source processes per hour (crawling speed) depends on various factors, such as network bandwidth and source configuration. See About crawling speed for information on what can impact crawling speed, as well as possible solutions. Leverage the Time the crawler waits between requests to your server parameter to increase the crawling speed for the sites you own. Contact the Coveo Support team for help if needed. Schedule rescan operations following the rate at which your source content changes. If you want to index only one or a few specific pages of a site such as for a test, enter the pages to index as Starting URLs. Then, set the Number of page levels to crawl from a starting URL parameter value to 0, instructing the crawler to only index the specified pages, and none of their linked pages. Though it’s possible to add external URLs to a Web source outside the main Add source / Edit source user interfaces (such as through the Source API or the JSON configuration), doing so is a bad practice. Always create one source per site. This helps: Prevent the crawler from using your source authentication credentials on an external site. Reduce the number and complexity of crawling and scraping rules. Optimize source configurations for each site. Avoid having a rebuild/rescan issue on one site cause the deletion of indexed items associated with the other sites. Don’t enable ExpandBeforeFiltering unless it’s necessary. Setting the ExpandBeforeFiltering parameter to true can significantly reduce the crawling speed since the crawler retrieves many pages that can be rejected in the end. Group your source and the other implementation resources together in a project. See Manage projects. Add a Web source On the Sources (platform-ca | platform-eu | platform-au) page, click Add source. In the Add a source of content panel, click the Cloud () or Crawling Module () tile, depending on your content retrieval context. With the latter, you must install the Crawling Module to make your source operational. In the Add a new Web source / Add a new Crawling Module Web source panel, fill in the following fields. Name: Use a short and descriptive name, using only letters, numbers, hyphens (-), and underscores (_). The source name can’t be modified once it’s saved. Starting URL: The URL of a website page from which the crawler starts discovering and following links found in pages, including: The protocol (for example, http, https) The subdomain, if applicable (for example, the www subdomain) Examples of valid starting URLs https://www.coveo.com https://docs.coveo.com/en With the cloud Web source, as soon as you’ve typed the website domain, the source looks for sitemap files in standard website locations. If sitemap files are found, they’re displayed and you’re prompted to switch to the Coveo Sitemap source. Switching to the Sitemap source is recommended. Continue configurations as a Sitemap source or Web source. If available, click Switch to a Sitemap source and continue configuring your Sitemap source with the autodetected sitemap URLs. OR Continue configuring your Web source. Fill in the following fields: Crawling Module: If you’re creating a Crawling Module Web source, select the installed Crawling Module instance. Project: The project(s) you want to associate your source with. Note After source creation, you can update your Coveo project selection under the Identification subtab. Click Next. Select who has permission to access the content through the search interface and click Add source. Note This information is editable later in the Content security tab. Continue configuring your source. "Configuration" tab The Configuration tab lets you manage the crawling rules, web scraping configurations, advanced settings, and authentication methods of your source. These configuration groups are presented in subtabs. "Crawling rules" subtab The Crawling rules subtab lets you define the specific pages to index. Starting URLs The Starting URL you entered when creating the Web source is automatically added to the Starting URLs list. Add other starting URLs in the same domain to ensure that orphan pages and isolated sections of your website are crawled and indexed. Exclusions and inclusions Add exclusion and inclusion rules to crawl only specific items based on their URL. The following diagram illustrates how the Web crawler applies the exclusion and inclusion rules. This flow applies to all pages, including the starting URLs. You must therefore pay attention to not filter out your starting URLs. Note The diagram shows the crawling process with the default source parameter settings. Certain parameters (for example, ExpandBeforeFiltering) can fundamentally change this behavior. About the "Include all non-excluded pages" option The Include all non-excluded pages option automatically adds an "include all" inclusion rule in the background. This ensures that all starting URLs meet the Does URL match at least one inclusion rule? condition and that all non-excluded pages get crawled. You can use any of the six types of rules: is and a URL that includes the protocol. For example, https://myfood.com/. contains and a string found in the URL. For example, recipes. begins with and a string found at the beginning of the URL and which includes the protocol. For example, https://myfood. ends with and a string found at the end of the URL. For example, .pdf. matches wilcard rule and a wildcard expression that matches the whole URL. For example, https://myfood.com/recipes*. matches regex rule and a regex rule that matches the whole URL. For example, ^.*(company-(dev|staging)).*html.?$. When using regex rules, make sure they match the desired URLs with a testing tool such as Regex101. "Web scraping" subtab The Web scraping subtab lists and lets you manage web scraping configurations for your source. When the crawler is about to index a page, it checks whether it must apply web scraping configurations that have been defined. The crawler considers the Pages to target rules of each of your web scraping configurations, starting with the configuration at the top of your list. The crawler will either apply the first matching configuration or all matching configurations. All new Web sources are created with a default web scraping configuration that excludes typical repetitive elements found in web pages that shouldn’t be indexed. Existing Web sources without a web scraping configuration prompt you to add the default configuration when you access the Web scraping subtab. When no web scraping configuration is defined: All crawling rules included pages are indexed in their entirety (that is, no sections are excluded). No custom metadata is collected. No sub-items are created. Indexing irrelevant page sections and not extracting custom metadata reduces the quality of search results. The Web source features two web scraping configuration management modes: UI-assisted mode and Edit with JSON mode. UI-assisted mode You can add (1), edit (2), and delete (3) one web scraping configuration at a time with a user interface that makes many technical aspects transparent. UI-assisted mode is easier to use and more mistake-proof than Edit with JSON mode. Use this mode except for sub-item related configurations (which are only supported in Edit with JSON mode). Note The Web scraping tab displays a message when the aggregated web scraping configuration contains a sub-item related configuration. When you add or edit a web scraping configuration using UI-assisted mode, the Add/Edit a web scraping configuration panel is displayed. See Configurations in UI-assisted mode for more details. Edit with JSON mode The Edit with JSON button gives access to the aggregated web scraping JSON configuration of the source. Adding, editing, and deleting configurations directly in the JSON requires more technical skills than u'''
