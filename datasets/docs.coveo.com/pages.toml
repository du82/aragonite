title = """
Command Line Interface
  
            |           Coveo CLI"""
description = "Coveo Product documentation."
full_description = '''Coveo Platform Command Line Interface Command Line Interface This is for: Developer In this article What Is the Coveo CLI? When to Use the Coveo CLI? Installation Usage Configuration Commands What Is the Coveo CLI? The Coveo CLI is a powerful command-line interface (CLI) that interacts with the Coveo platform to facilitate development and build automation. Key features include the following: Quickly create a Coveo Headless-powered search page for your Coveo organization, relying on popular frameworks like Angular, React, and Vue.js. Quickly create a Coveo Atomic-powered search page for your Coveo organization, with custom component examples and a search token provider. Create and manage Coveo organizations. Automate deployments between organizations. Manage Coveo Push API sources. Perform queries against a Coveo index. When to Use the Coveo CLI? We recommend the Coveo CLI both to newcomers who are looking for quick scaffolding options and to more seasoned Coveo developers who want to optimize their workflow. With the CLI, developers can get their frontend project started with a single command rather than by copy-pasting examples. The CLI also lets you automate deployments on your machine or in your CI/CD pipeline using the org:resources commands and/or the source commands. Most if not all of those operations can be done either through the Coveo Administration Console or directly using the Coveo REST APIs. The former, while being easy to understand and get started with, can also be a bit cumbersome and time-consuming for repetitive tasks. The CLI lets you avoid this issue by providing single commands that can accomplish the target tasks, and by allowing you to automate and chain commands together easily. The REST APIs are on the opposite side of the spectrum: they go straight to the point and avoid any repetition. They can however be quite hard to understand at first and require making numerous and complex requests to different APIs. The CLI can handle most of this complexity for you. Installation Option 1: Install via an Executable Download and run the executable for your operating system to install the latest available version of the CLI. Afterward, you can run coveo update at any time to update your CLI installation to the latest version. Linux https://static.cloud.coveo.com/cli/coveo-latest_amd64.deb https://static.cloud.coveo.com/cli/coveo-latest_armel.deb Mac https://static.cloud.coveo.com/cli/coveo-latest-arm64.pkg https://static.cloud.coveo.com/cli/coveo-latest-x64.pkg Windows https://static.cloud.coveo.com/cli/coveo-latest-x64.exe https://static.cloud.coveo.com/cli/coveo-latest-x86.exe Option 2: Install via NPM You can alternatively install the CLI globally via npm: npm install -g @coveo/cli Afterward, you can run npm update -g @coveo/cli at any time to update your npm-based CLI installation to the latest version. You can also run the CLI via npx: npx @coveo/cli Usage $ npm install -g @coveo/cli $ coveo COMMAND running command... $ coveo (--version) @coveo/cli/3.2.7 linux-x64 node-v20.12.2 $ coveo --help [COMMAND] USAGE $ coveo COMMAND ... Configuration The Coveo CLI is based on oclif and uses the following paths: cacheDir - CLI cache directory macOS: ~/Library/Caches/@coveo/cli Unix: ~/.cache/@coveo/cli Windows: %LOCALAPPDATA%\@coveo\cli Can be overridden with XDG_CACHE_HOME configDir - CLI config directory Unix: ~/.config/@coveo/cli Windows: %LOCALAPPDATA%\@coveo\cli Can be overridden with XDG_CONFIG_HOME dataDir - CLI data directory Unix: ~/.data/@coveo/cli Windows: %LOCALAPPDATA%\@coveo\cli Can be overridden with XDG_DATA_HOME The Coveo CLI may not function if you do not have read and write access to those directories. The main config file of the Coveo CLI is stored in a JSON file in configDir. Commands coveo atomic:cmp NAME coveo atomic:component NAME coveo atomic:deploy coveo atomic:init NAME coveo auth:login coveo auth:token coveo config:get [KEY] coveo config:set coveo help [COMMAND] coveo org:create NAME coveo org:list coveo org:resources:list coveo org:resources:model:create coveo org:resources:monitor SNAPSHOTID coveo org:resources:preview coveo org:resources:pull coveo org:resources:push coveo org:search:dump coveo plugins coveo plugins:install PLUGIN... coveo plugins:inspect PLUGIN... coveo plugins:install PLUGIN... coveo plugins:link PLUGIN coveo plugins:uninstall PLUGIN... coveo plugins:uninstall PLUGIN... coveo plugins:uninstall PLUGIN... coveo plugins:update coveo source:catalog:add SOURCEID coveo source:catalog:new NAME coveo source:list coveo source:push:add SOURCEID coveo source:push:delete SOURCEID coveo source:push:new NAME coveo ui:create:angular NAME coveo ui:create:atomic NAME coveo ui:create:react NAME coveo ui:create:vue NAME coveo ui:deploy coveo update [CHANNEL] coveo version coveo atomic:cmp NAME Scaffold a new custom component. Meant to be executed in a component library created using the coveo atomic:init --lib command, or in an npm project, or in an empty folder. USAGE $ coveo atomic:cmp [NAME] [--type page|result] ARGUMENTS NAME The name of your component. FLAGS --type=<option> The kind of component to initialize. <options: page|result> DESCRIPTION Scaffold a new custom component. Meant to be executed in a component library created using the `coveo atomic:init --lib` command, or in an npm project, or in an empty folder. ALIASES $ coveo atomic:cmp EXAMPLES $ coveo atomic:cmp --type=page myAwesomeComponent $ coveo atomic:cmp --type=result mySuperResultComponent coveo atomic:component NAME Scaffold a new custom component. Meant to be executed in a component library created using the coveo atomic:init --lib command, or in an npm project, or in an empty folder. USAGE $ coveo atomic:component [NAME] [--type page|result] ARGUMENTS NAME The name of your component. FLAGS --type=<option> The kind of component to initialize. <options: page|result> DESCRIPTION Scaffold a new custom component. Meant to be executed in a component library created using the `coveo atomic:init --lib` command, or in an npm project, or in an empty folder. ALIASES $ coveo atomic:cmp EXAMPLES $ coveo atomic:component --type=page myAwesomeComponent $ coveo atomic:component --type=result mySuperResultComponent See code: src/commands/atomic/component.ts coveo atomic:deploy Deploy your search application to the Coveo infrastructure. USAGE $ coveo atomic:deploy [-p <value>] [-c <value>] [-o <value>] FLAGS -c, --config=coveo.deploy.json [default: coveo.deploy.json] The path to the deployment JSON configuration. -o, --organization=targetorganizationg7dg3gd The unique identifier of the organization where to deploy the hosted page. If not specified, the organization you are connected to will be used. -p, --pageId=7944ff4a-9943-4999-a3f6-3e81a7f6fb0a The existing ID of the target Hosted search page. DESCRIPTION Deploy your search application to the Coveo infrastructure. The target "config" must contain the following parameters: { "name": "The name of the hosted search page.", "dir": "The directory of the hosted search page.", "htmlEntryFile": { "path": "The path to an HTML file containing the HTML markup of the hosted page." }, "javascriptEntryFiles": [ { "path": "The path to a bundled Javascript file.", "isModule": "Whether the inline code should be treated as a JavaScript module. If this property is true, the type property will be set to "module" on the script tag." } ], "javascriptUrls": [ { "path": "The URL of the JavaScript source file.", "isModule": "Whether the inline code should be treated as a JavaScript module. If this property is true, the type property will be set to "module" on the script tag." } ], "cssEntryFiles": [ { "path": "The path to a bundled CSS file." } ], "cssUrls": [ { "path": "The URL of the CSS stylesheet." } ] } ALIASES $ coveo atomic:deploy EXAMPLES Create a new Hosted Page according to the configuration in the file "coveo.deploy.json" $ coveo atomic:deploy Update the Hosted Page whose ID is "7944ff4a-9943-4999-a3f6-3e81a7f6fb0a" according to the configuration in the file "coveo.deploy.json" $ coveo atomic:deploy -p 7944ff4a-9943-4999-a3f6-3e81a7f6fb0a Create a new Hosted Page according to the configuration in the file located at "./configs/myconfig.json" $ coveo atomic:deploy -c ./configs/myconfig.json coveo atomic:init NAME Scaffold a project to work with the Coveo Atomic Framework. USAGE $ coveo atomic:init [NAME] [--type app|application|lib|library] ARGUMENTS NAME The name of your project. FLAGS --type=<option> The kind of project to initialize. Use `app`/`application` to start a new Atomic search page project, and `lib`/`library` to start a custom component library. <options: app|application|lib|library> DESCRIPTION Scaffold a project to work with the Coveo Atomic Framework. EXAMPLES $ coveo atomic:init --type=app myAwesomeSearchPage $ coveo atomic:init --type=lib myCustomAtomicComponentsLibrary See code: src/commands/atomic/init.ts coveo auth:login Log in to the Coveo Platform using the OAuth2 flow. USAGE $ coveo auth:login [-r US|us|EU|eu|AU|au|CA|ca] [-e dev|stg|hipaa|prod] [-o <value>] FLAGS -e, --environment=<option> [default: prod] The Coveo Platform environment to log in to. <options: dev|stg|hipaa|prod> -o, --organization=myOrgID The identifier of the organization to log in to. If not specified, the CLI logs you in to the first available organization. See also commands `config:get`, `config:set`, and `org:list`. -r, --region=<option> [default: us] The Coveo Platform region to log in to. See <https://docs.coveo.com/en/2976>. <options: US|us|EU|eu|AU|au|CA|ca> DESCRIPTION Log in to the Coveo Platform using the OAuth2 flow. Note: TCP port 32111 or 52296 must be available. EXAMPLES $ coveo auth:login See code: src/commands/auth/login.ts coveo auth:token Log in to the Coveo Platform using an access token. USAGE $ coveo auth:token [-r US|us|EU|eu|AU|au|CA|ca] [-e dev|stg|hipaa|prod] [-s] FLAGS -e, --environment=<option> [default: prod] The Coveo Platform environment to log in to. <options: dev|stg|hipaa|prod> -r, --region=<option> [default: us] The Coveo Platform region to log in to. See <https://docs.coveo.com/en/2976>. <options: US|us|EU|eu|AU|au|CA|ca> -s, --[no-]stdin Whether to read the token from stdin. Default to true when running in a CI environment. DESCRIPTION Log in to the Coveo Platform using an access token. EXAMPLES $ coveo auth:token See code: src/commands/auth/token.ts coveo config:get [KEY] Display the current Coveo CLI configuration. USAGE $ coveo config:get [KEY] ARGUMENTS KEY The config key for which to show the value DESCRIPTION Display the current Coveo CLI configuration. EXAMPLES Get all the configuration values $ coveo config:get Get the organization to which you are connected $ coveo config:get organization Get the access token given to you by the Coveo Platform $ coveo config:get accessToken See code: src/commands/config/get.ts coveo config:set Modify the current Coveo CLI configuration. USAGE $ coveo config:set [-o <value>] FLAGS -o, --organization=myOrgID The identifier of the organization inside which to perform operations. See <https://docs.coveo.com/en/1562/#organization-id-and-other-information>. DESCRIPTION Modify the current Coveo CLI configuration. EXAMPLES connect to a different organization $ coveo config:set --organization myOrgId See code: src/commands/config/set.ts coveo help [COMMAND] Display help for coveo. USAGE $ coveo help [COMMAND] [-n] ARGUMENTS COMMAND Command to show help for. FLAGS -n, --nested-commands Include all nested commands in the output. DESCRIPTION Display help for coveo. See code: @oclif/plugin-help coveo org:create NAME Create a new test Coveo organization. USAGE $ coveo org:create [NAME] [-s] ARGUMENTS NAME The name to assign to the new organization. FLAGS -s, --[no-]setDefaultOrganization Set the created organization as the default one DESCRIPTION Create a new test Coveo organization. See code: src/commands/org/create.ts coveo org:list List Coveo organizations. USAGE $ coveo org:list [--columns <value> | -x] [--sort <value>] [--filter <value>] [--output csv|json|yaml | | [--csv | --no-truncate]] [--no-header | ] FLAGS -x, --extended show extra columns --columns=<value> only show provided columns (comma-separated) --csv output is csv format [alias: --output=csv] --filter=<value> filter property by partial string matching, ex: name=foo --no-header hide table header from output --no-truncate do not truncate output to fit screen --output=<option> output in a more machine friendly format <options: csv|json|yaml> --sort=<value> property to sort by (prepend '-' for descending) DESCRIPTION List Coveo organizations. See code: src/commands/org/list.ts coveo org:resources:list List available Snapshots in an organization USAGE $ coveo org:resources:list [--columns <value> | -x] [--sort <value>] [--filter <value>] [--output csv|json|yaml | | [--csv | --no-truncate]] [--no-header | ] [-o <value>] FLAGS -o, --organization=targetorganizationg7dg3gd The unique identifier of the organization containing the snapshots. If not specified, the organization you are connected to will be used. -x, --extended show extra columns --columns=<value> only show provided columns (comma-separated) --csv output is csv format [alias: --output=csv] --filter=<value> filter property by partial string matching, ex: name=foo --no-header hide table header from output --no-truncate do not truncate output to fit screen --output=<option> output in a more machine friendly format <options: csv|json|yaml> --sort=<value> property to sort by (prepend '-' for descending) DESCRIPTION List available Snapshots in an organization EXAMPLES $ coveo org:resources:list -o=myOrgId See code: src/commands/org/resources/list.ts coveo org:resources:model:create Create a Snapshot Pull Model USAGE $ coveo org:resources:model:create DESCRIPTION Create a Snapshot Pull Model See code: src/commands/org/resources/model/create.ts coveo org:resources:monitor SNAPSHOTID Monitor a Snapshot operation USAGE $ coveo org:resources:monitor [SNAPSHOTID] [-w <value>] [-o <value>] ARGUMENTS SNAPSHOTID The unique identifier of the target snapshot. FLAGS -o, --organization=targetorganizationg7dg3gd The unique identifier of the organization containing the snapshot. If not specified, the organization you are connected to will be used. -w, --wait=seconds [default: 60] The maximum number of seconds to wait before the commands exits with a timeout error. A value of zero means that the command will wait indefinitely. DESCRIPTION Monitor a Snapshot operation EXAMPLES Monitor the status of the "mysnapshotid" snapshot in the "myorgid" organization. $ coveo org:resources:monitor --organization myorgid --snapshotId mysnapshotid See code: src/commands/org/resources/monitor.ts coveo org:resources:preview Preview the changes that running coveo org:resources:push would cause USAGE $ coveo org:resources:preview [-w <value>] [-p none|light|detailed] [-o <value>] [-s <value> | ] [-d] FLAGS -d, --showMissingResources Previ'''
