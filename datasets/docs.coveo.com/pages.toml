["https://docs.coveo.com/en/1967"]
title = """
Add a Sitemap source
  
            |           Coveo Platform"""
description = "Add a Sitemap source to make web pages searchable efficiently. Supports XML, text, RSS, Atom, HTML, and Gzip formats. Ideal for developers and system admins."
full_description = '''Coveo Platform Index content Sources Connector directory Add a Sitemap source Add a Sitemap source This is for: Developer System Administrator In this article Source key characteristics Limitations Leading practices Add a Sitemap source Required privileges Migrate from manual form authentication What’s next? Members with the required privileges can use a Sitemap source to make the content of webpages listed in a sitemap file or sitemap index file searchable. A sitemap file can be added to a website and is required when using a Sitemap source. The file contains a list of the website’s URLs along with their respective metadata which include the LMD (last-modified-date). This enables the Sitemap source to perform refresh updates, which the Web source doesn’t support. For this reason, although a Sitemap source requires the extra step of adding a sitemap file, it offers better performance than the Web source. Source key characteristics The following table presents the main characteristics of a Sitemap source. Features Supported Additional information Indexable content Webpages (URL) Sitemap file format XML Text RSS 2.0 Atom 1.0 HTML GZ Sitemap files and sitemap index files must respect the Sitemap protocol. Strict validations can be enforced by enabling the ParseSitemapInStrictMode option. For a .gz sitemap file, the web server response Content-Type header must be application/gzip. Content update operations refresh To be refreshed, an item in the sitemap file must have a last-modification date[1] (for example, the lastmod element in an XML sitemap, or the updated element in an Atom sitemap) whose value is more recent than the last refresh operation. A rescan or rebuild operation is required to take account of deleted sitemap entries. rescan Takes place every day by default. To be rescanned, an item in the sitemap file must have a last-modification date[1] (for example, the lastmod element in an XML sitemap, or the updated element in an Atom sitemap) whose value is more recent than the last time the item was indexed. rebuild Content security options Same users and groups as in your content system Specific users and groups Everyone Authentication methods Basic authentication Supported HTTP authentication schemes: Basic Digest NTLM Negotiate/Kerberos Form based Form authentication Crawling rules A variety of basic and advanced rules may be used to ignore the webpages you don’t want to index. metadata indexing for search Automapping of metadata to a field with a matching name Disabled by default. To enable, access the JSON configuration of your source, and set performFieldMappingUsingAllOrigins to true. Automatically indexed metadata Sample of autopopulated fields (no user-defined metadata required): clickableuri date fileextension filetype language (autodetected from document content) title The author field will also be autopopulated if the content item contains an author metadata value. After a content update operation, inspect your item field values in the Content Browser. Collected indexable metadata The source automatically collects the content attribute of <meta> tags when the tag is keyed with the name attribute. For example, if the HTML of a page contains the following: <meta name="author" content="jsmith"/>, the Web source extracts jsmith as the author metadata. After a rebuild, review the View and map metadata subpage for the list of indexed metadata and to index additional metadata from those available. Custom metadata collection Available using the following source features: • XML sitemap file custom metadata extraction • Webpage scraping • Webpage JSON-LD metadata extraction • Webpage metadata extraction using the IndexHtmlMetadata JSON configuration parameter Web scraping Exclude irrelevant sections in pages and extract metadata. JavaScript content rendering The Sitemap source crawler can execute JavaScript in a webpage to dynamically render content before indexing the page. Optical Character Recognition (OCR) Available at an extra charge. Contact Coveo Sales to add this feature to your Coveo organization license. Limitations The last-modification attribute must specify the modification time in W3C DateTime format, that is, YYYY-MM-DDThh:mm:ss. Moreover, unless you specify a time zone, you must express the modification time in Coordinated Universal Time (UTC). Multi-factor authentication (MFA) and CAPTCHA aren’t supported. Indexing page permissions isn’t supported. The Sitemap source doesn’t support robots.txt files. Content in pop-up windows and page elements requiring interaction aren’t indexed. The Coveo indexing pipeline can handle web pages up to 512 MB only. Larger pages are indexed by reference (that is, their content is ignored by the Coveo crawler, and only their metadata and path are searchable). Therefore, no search result Quick view is available for these larger items. When the Execute JavaScript on pages option is enabled: The Sitemap source doesn’t support sending AdditionalHeaders. The Sitemap source doesn’t support the UseProxy parameter. Basic authentication isn’t supported. The UseProxy parameter can’t be used in combination with Form authentication. When indexing content with the Crawling Module, ensure not to change space character encoding in your items' URIs, as Coveo uses these URIs to distinguish items. For example, an item whose URI would change from example.com/my first item to example.com/my%20first%20item wouldn’t be recognized as the same by Coveo. As a result, it would be indexed twice, and the older version wouldn’t be deleted. Item URIs are displayed in the Content Browser (platform-ca | platform-eu | platform-au). We recommend you check where these URIs come from before making changes that affect space character encoding. Depending on your source type, the URI may be an item’s URL, or it may be built out of pieces of metadata by your source mapping rules. For example, your item URIs may consist in the main site URL, plus the item filename, due to a mapping rule such as example.com/%[filename]. In such a case, changing space encoding in the item filename could impact the URI. Leading practices Ensure that you have the right to crawl the public content in the event where you aren’t the owner of the website. Crawling sites that you don’t own nor have the right to crawl could create reachability issues. Furthermore, certain sites may use security mechanisms that can impact Coveo’s ability to retrieve the content. If you’re unfamiliar with these mechanisms, we recommend investigating and learning about them beforehand. For example, one impact this type of software (for example, Akamai, Cloudflare) can have is detecting our crawler as an attack and blocking us from any further crawling. Always try authenticating without a custom login sequence first. You should only start working on a custom login sequence when you’re sure your form authentication details (that is, login address, user credentials, confirmation method) are accurate and that the standard form authentication process doesn’t work. It’s best to create or edit your source in your sandbox organization first. Once you have confirmed that it indexes the desired content, you can copy your source configuration to your production organization, either with a snapshot or manually. See About non-production organizations for more information and best practices regarding sandbox organizations. The number of items that a source processes per hour (crawling speed) depends on various factors, such as network bandwidth and source configuration. See About Crawling Speed for information on what can impact crawling speed, as well as possible solutions. Break down large sitemap files into multiple sitemap files. Group your source and the other implementation resources together in a project. See Manage projects. Add a Sitemap source On the Sources (platform-ca | platform-eu | platform-au) page, click Add source. In the Add a source of content panel, click the Cloud () or Crawling Module () tile, depending on your content retrieval context. With the latter, you must install the Crawling Module to make your source operational. In the Add a new Sitemap source / Add a new Crawling Module Sitemap source panel, fill in the following fields. Name: Use a short and descriptive name, using only letters, numbers, hyphens (-), and underscores (_). The source name can’t be modified once it’s saved. Sitemap URLs: Enter the direct sitemap URL, and not the sitemap website address. Otherwise, the source can interpret the URLs as HTML format sitemap files and crawl the links they contain. Examples of sitemap URLs Public website sitemap: http://myorgwebsite.com/sitemap.xml Public website sitemap compressed with GZIP: http://myorgwebsite.com/sitemap.xml.gz Notes The Sitemap source only crawls pages listed in a sitemap file. It doesn’t crawl links in the listed web pages themselves. The ParseSitemapInStrictMode JSON parameter dictates the extent of validation the Sitemap source applies on sitemap and sitemap index files, and on their referenced URLs. Crawling Module: If you’re creating a Crawling Module Sitemap source, select the installed Crawling Module instance. Project: Specify the project(s) you want to associate your source with. Note After source creation, you can update your Coveo project selection under the Identification subtab. Click Next. Select who has permission to access the content through the search interface and click Add source. Note This information is editable later in the Content security tab. Configure your source. Note You can save your source settings at any time by clicking Save. "Configuration" tab The Configuration tab lets you manage the crawling rules, web scraping configurations, advanced settings, and authentication methods of your source. These configuration groups are presented in subtabs. "Crawling rules" subtab The Crawling rules subtab lets you define the specific pages to index. Sitemap URLs Enter the direct sitemap URL, and not the sitemap website address. Otherwise, the source can interpret the URLs as HTML format sitemap files and crawl the links they contain. Examples of sitemap URLs Public website sitemap: http://myorgwebsite.com/sitemap.xml Public website sitemap compressed with GZIP: http://myorgwebsite.com/sitemap.xml.gz Notes The Sitemap source only crawls pages listed in a sitemap file. It doesn’t crawl links in the listed web pages themselves. The ParseSitemapInStrictMode JSON parameter dictates the extent of validation the Sitemap source applies on sitemap and sitemap index files, and on their referenced URLs. Exclusions and inclusions Add exclusion and inclusion rules to crawl only specific items based on their URL. The following diagram illustrates how the Sitemap crawler applies the exclusion and inclusion rules. This flow applies to all pages, including the sitemap URLs. You must therefore pay attention to not filter out your sitemap URLs. About the "Include all non-excluded pages" option The Include all non-excluded pages option automatically adds an "include all" inclusion rule in the background. This ensures that all sitemap URLs meet the Does URL match at least one inclusion rule? condition and that all non-excluded pages get crawled. You can use any of the six types of rules: is and a URL that includes the protocol. For example, https://myfood.com/. contains and a string found in the URL. For example, recipes. begins with and a string found at the beginning of the URL and which includes the protocol. For example, https://myfood. ends with and a string found at the end of the URL. For example, .pdf. matches wilcard rule and a wildcard expression that matches the whole URL. For example, https://myfood.com/recipes*. matches regex rule and a regex rule that matches the whole URL. For example, ^.*(company-(dev|staging)).*html.?$. When using regex rules, make sure they match the desired URLs with a testing tool such as Regex101. "Web scraping" subtab The Web scraping subtab lists and lets you manage web scraping configurations for your source. When the crawler is about to index a page, it checks whether it must apply web scraping configurations that have been defined. The crawler considers the Pages to target rules of each of your web scraping configurations, starting with the configuration at the top of your list. The crawler will either apply the first matching configuration or all matching configurations. All new Sitemap sources are created with a default web scraping configuration that excludes typical repetitive elements found in web pages that shouldn’t be indexed. Existing Sitemap sources without a web scraping configuration prompt you to add the default configuration when you access the Web scraping subtab. When no web scraping configuration is defined: All crawling rules included pages are indexed in their entirety (that is, no sections are excluded). No custom metadata is collected. Indexing irrelevant page sections and not extracting custom metadata reduces quality of search results. The Sitemap source features two web scraping configuration management modes: UI-assisted mode and Edit with JSON mode. UI-assisted mode You can add (1), edit (2), and delete (3) one web scraping configuration at a time with a user interface that makes many technical aspects transparent. UI-assisted mode is easier to use and more mistake-proof than Edit with JSON mode. This is now the recommended mode for all web scraping configurations. When you add or edit a web scraping configuration using UI-assisted mode, the Add/Edit a web scraping configuration panel is displayed. See Configurations in UI-assisted mode for more details. Edit with JSON mode The Edit with JSON button gives access to the aggregated web scraping JSON configuration of the source. Adding, editing, and deleting configurations directly in the JSON requires more technical skills than using UI-assisted mode. When you add or edit a web scraping configuration in Edit with JSON mode, the Edit a web scraping JSON configuration panel is displayed. See Configurations in Edit with JSON mode for more details. Single-match vs multi-match The Sitemap source can apply web scraping configurations in two ways: single-match or multi-match. In single-match mode, the crawler applies only the first matching web scraping configuration. In multi-match mode, the crawler applies all matching web scraping configurations. The animation below demonstrates the application of three web scraping configurations on a culinary website featuring news articles and recipe pages, in single-match mode (left) and multi-match mode (right). Sitemap sources created before mid-December 2023 were created in single-match mode. All new Sitemap sources are created in multi-match mode. Coveo converted existing single-match sources containing zero or one web scraping configuration to multi-match mode. We recommend you convert any remaining single-match Sitemap source to multi-match mode. If a Sitema'''
