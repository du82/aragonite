title = """
Leverage machine learning
  
            |           Coveo Machine Learning"""
description = "Coveo Product documentation."
full_description = "Coveo Platform Leverage machine learning Not sure what Coveo Machine Learning (Coveo ML) can do for you? Start here. For more information on Coveo ML, see the FAQ. Complete user queries Use Query Suggestions (QS) to provide users with popular queries and meaningful search content by autocompleting user queries with relevant suggestions. Provide the best results Use Automatic Relevance Tuning (ART) to boost the best-performing content to the top of the page, saving users time in addition to delivering consistent and relevant search results. Recommend additional content Use Content Recommendations (CR) to improve user experience by displaying additional content based on the user’s journey, fostering user engagement and content discovery. Enrich user navigation Use Dynamic Navigation Experience (DNE) to ensure an intuitive search experience by providing users with adaptive and intelligent query filtering options to display the best results. Improve case categorization Use Case Classification (CC) to provide accurate classification suggestions on support cases that are being filled, reducing case resolution time and effort. Answer user queries Use Smart Snippets to let users quickly find answers to their questions - displayed directly on their results page. Improve cross-selling Use Product Recommendations (PR) to enhance your customers' shopping experience by recommending products based on their profile, contexts, and behaviors. Generate answers using generative AI Use Relevance Generative Answering (RGA) to generate answers to natural language queries and display the answers in the results page. Use vector-based search Use Semantic Encoder (SE) to retrieve items from your index based on semantic similarity with the query. Leverage passage retrieval Use Passage Retrieval (CPR) to extract relevant passages from your indexed content, enhancing LLM responses with precise and contextually relevant information."
