title = "Coveo Platform overview"
description = "Discover the Coveo Platform, the cloud service revolutionizing search with AI-powered recommendations, cross-platform compatibility, and a dynamic interface ..."
full_description = "Coveo Platform overview Coveo Platform overview This is for: Developer Business Analyst System Administrator In this article Main capabilities Workflow Welcome to the Coveo Platform! The Coveo Platform is the cloud service that makes the intelligent search experience possible. The platform is unparalleled at matching intent with results and thus provides the most relevant content to each user. Get started with a free and interactive trial! Main capabilities One box to search them all The Coveo Platform unifies the content of your cloud and on-premises repositories in a single index. By centralizing access to your websites, knowledge bases, and catalogs, you improve the discoverability of your data, no matter its format or location. Cross-platform compatibility The Coveo Platform layers over your existing systems to enhance your search everywhere, from your website and customer-facing channels to enterprise search in internal portals and CRM software. Dynamic search interface Coveo-powered search pages automatically adjust to each query, reordering results and filters in the most relevant way. While basic search only matches keywords to text in an index, AI-powered search also considers previous actions and context to rank results. Filtering options also move around so that the most susceptible to be used appear at the top. Proactive AI-powered recommendations Whether it’s to provide relevant query suggestions, personalize the result ranking, enrich the navigation, or recommend additional products or content, there’s a machine learning algorithm for that. Relevance and findability constantly improve as Coveo learns from user behavior and recognizes intent patterns. Workflow The following flowchart shows how your Coveo organization receives, analyzes, and returns information. If you integrate Coveo to your instance of Salesforce, Sitecore, ServiceNow, etc., Coveo retrieves its content and stores it in your Coveo organization index. Similarly, content pulled from other sources is also stored in your unified index. If your content is secured in its original repository, Coveo also retrieves the corresponding permissions, that is, who is allowed or forbidden to see each item. See Management of security identities and item permissions for details. Whenever a query is made in your search hub, that is, in one of your search interfaces, it passes through a query pipeline for optimization. The optimized query is then sent to the Coveo index, which returns matching items to display in the search interface. As users make queries, Coveo gathers usage analytics data on the events performed in your search interface, such as their query, how they filter their search results, and the items they click. See Usage analytics concepts for details. Coveo Machine Learning (Coveo ML) analyzes this data and learns from user behavior. Coveo ML provides your search hub with means to improve the search experience based on the usage analytics data. It enables search interfaces to suggest queries, recommend items, and display items that users are likely to find the most useful at the top of the search results. Your Coveo organization therefore evolves as your end users interact with your search interfaces to offer them a better, more efficient search experience. See Coveo Machine Learning for details. Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit Is this article useful? You can close this window or leave a comment below. Very useful Not really Can you tell us more about your experience today? Comments (optional) Need help with our product? Please open a support case for expert assistance. Use this feedback option to comment on the article only. Submit atomic-result-section-excerpt{ max-height: 3rem !important; margin: 0px !important; font-size: 0.75rem !important; } atomic-result-link atomic-result-text { font-size: 1rem !important; font-weight: 400; color: var(--atomic-recommendations-text); } Make every experience relevant with Coveo Contact us Get a free trial In this article"
year_published = 2020
