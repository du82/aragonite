["https://docs.etherlink.com/tutorials/marketpulse/deploy"]
title = "Deploy the contract | Etherlink documentation"
description = "Deploy the contract locally is fine for doing simple tests, but we recommend to target the Etherlink testnet to run complete scenarios as you may depend on other services like block explorers, oracles, etc."
full_description = 'TutorialDeploy the contract Deploy the contract locally is fine for doing simple tests, but we recommend to target the Etherlink testnet to run complete scenarios as you may depend on other services like block explorers, oracles, etc. Deploy the contract locally with Hardhat: Prepare a module for the ignition plugin of Hardhat. The module is used as the default script for deployment. Rename the default file first: mv ./ignition/modules/Lock.ts ./ignition/modules/Marketpulse.ts Replace the contents of the file with this code: // This setup uses Hardhat Ignition to manage smart contract deployments.// Learn more about it at https://hardhat.org/ignitionimport { buildModule } from "@nomicfoundation/hardhat-ignition/modules";const MarketpulseModule = buildModule("MarketpulseModule", (m) => { const MarketpulseContract = m.contract("Marketpulse", []); m.call(MarketpulseContract, "ping", []); return { MarketpulseContract };});export default MarketpulseModule; This module deploys the contract and calls the Ping endpoint to verify that it deployed well. Start a local Ethereum node: npx hardhat node In a different terminal window, deploy the contract using Hardhat ignition: npx hardhat ignition deploy ignition/modules/Marketpulse.ts --reset --network localhost You can deploy the contract to any local Ethereum node but Etherlink is a good choice because it is persistent and free and most tools and indexers are already deployed on it. Check that your deployment logs do not contain any error and stop the Hardhat node. Deploy the contract on Etherlink Testnet: In the Hardhat configuration file hardhat.config.ts, add Etherlink Mainnet and Testnet as custom networks: import "@nomicfoundation/hardhat-toolbox-viem";import "@nomicfoundation/hardhat-verify";import type { HardhatUserConfig } from "hardhat/config";import { vars } from "hardhat/config";if (!vars.has("DEPLOYER_PRIVATE_KEY")) { console.error("Missing env var DEPLOYER_PRIVATE_KEY");}const deployerPrivateKey = vars.get("DEPLOYER_PRIVATE_KEY");const config: HardhatUserConfig = { solidity: "0.8.24", networks: { etherlinkMainnet: { url: "https://node.mainnet.etherlink.com", accounts: [deployerPrivateKey], }, etherlinkTestnet: { url: "https://node.ghostnet.etherlink.com", accounts: [deployerPrivateKey], }, }, etherscan: { apiKey: { etherlinkMainnet: "DUMMY", etherlinkTestnet: "DUMMY", }, customChains: [ { network: "etherlinkMainnet", chainId: 42793, urls: { apiURL: "https://explorer.etherlink.com/api", browserURL: "https://explorer.etherlink.com", }, }, { network: "etherlinkTestnet", chainId: 128123, urls: { apiURL: "https://testnet.explorer.etherlink.com/api", browserURL: "https://testnet.explorer.etherlink.com", }, }, ], }};export default config; Set up an Etherlink Testnet account with some native tokens to deploy the contract. See Using your wallet connect your wallet to Etherlink. Then use the faucet to get XTZ tokens on Etherlink Testnet, as described in Getting testnet tokens. Export your account private key from your wallet application. Set the private key as the value of the DEPLOYER_PRIVATE_KEY environment variable by running this command: npx hardhat vars set DEPLOYER_PRIVATE_KEY On the prompt, enter or paste the value of your exported private key. Hardhat use its custom env var system for storing keys, we will see later how to override this on a CICD pipeline Deploy the contract to Etherlink Testnet network specifying the --network option: npx hardhat ignition deploy ignition/modules/Marketpulse.ts --network etherlinkTestnet A successful output should look like this: Compiled 5 Solidity files successfully (evm target: paris).Hardhat Ignition 🚀Deploying [ MarketpulseModule ]Batch #1 Executed MarketpulseModule#MarketpulseBatch #2 Executed MarketpulseModule#Marketpulse.ping[ MarketpulseModule ] successfully deployed 🚀Deployed AddressesMarketpulseModule#Marketpulse - 0xc64Bc334cf7a6b528357F8E88bbB3712E98629FF Run this command to verify your deployed contract, using the contract address as the value of <CONTRACT_ADDRESS>: npx hardhat verify --network etherlinkTestnet <CONTRACT_ADDRESS> The response should include the message "Successfully verified contract Marketpulse on the block explorer" and a link to the block explorer. You can also pass the --verify option to the deployment command to verify the contract as part of the deployment process. The next step is to create the frontend application.Last updated on Feb 27, 2025'
year_published = 2025
year_updated = 2025
