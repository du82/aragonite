title = "Create the frontend application | Etherlink documentation"
description = "Deno is not mandatory as you can still use npm, but we use it on this tutorial. You can install it with this link"
full_description = 'TutorialCreate the frontend application Deno is not mandatory as you can still use npm, but we use it on this tutorial. You can install it with this link Create a frontend app on the same project root directory. Here we use Vite and React to start a default project; deno run -A npm:create-vite@latest If you have trouble with Deno, as on some Mac computers, you can create a non-deno project that works in a similar way by running this command: npm create vite@latest. Choose a name for the frontend project (such as app, which is what the examples later use), select the React framework, and select the Typescript language. Copy the images from the folder https://github.com/trilitech/tutorial-applications/tree/main/etherlink-marketpulse/app/public/ to the app/public folder of your application. Run the commands as in this example to install the dependencies and start the server: cd appnpm installnpm run dev Now the Deno or Vite server is running a starter frontend application. Stop the application. Within your frontend ./app project, import the Viem library for blockchain interactions, thirdweb for the wallet connection and bignumber for calculations on large numbers: npm i viem thirdweb bignumber.js Add the typechain library to generate your contract structures and Typescript ABI classes from your ABI json file, that is your smart contract descriptor: npm i -D typechain @typechain/ethers-v6 Add this line to the scripts section of the ./app/package.json file in the frontend application: "postinstall": "cp ../ignition/deployments/chain-128123/deployed_addresses.json ./src && typechain --target=ethers-v6 --out-dir=./src/typechain-types --show-stack-traces ../artifacts/contracts/Marketpulse.sol/Marketpulse.json", This script copies the output address of the last deployed contract into your source files and calls typechain to generate types from the ABI file from the Hardhat folders. Run npm i to call the postinstall script automatically. You should see new files and folders in the ./src folder of the frontend application. Create an utility file to manage Viem errors. Better than the technical defaults and not helpful ones touch src/DecodeEvmTransactionLogsArgs.ts Put this code in the ./app/src/DecodeEvmTransactionLogsArgs.ts file: import {Abi,BaseError,ContractFunctionRevertedError,decodeErrorResult,} from "viem";// Type-Safe Error Handling Interfaceinterface DetailedError {type: "DecodedError" | "RawError" | "UnknownError";message: string;details?: string;errorData?: any;}// Advanced Error Extraction Functionexport function extractErrorDetails(error: unknown, abi: Abi): DetailedError {// Type guard for BaseErrorif (error instanceof BaseError) { // Type guard for ContractFunctionRevertedError if (error.walk() instanceof ContractFunctionRevertedError) { try { // Safe data extraction const revertError = error.walk() as ContractFunctionRevertedError; // Extract error data safely const errorData = (revertError as any).data; // Attempt to decode error if (errorData) { try { // Generic error ABI for decoding const errorAbi = abi; const decodedError = decodeErrorResult({ abi: errorAbi, data: errorData, }); return { type: "DecodedError", message: decodedError.errorName || "Contract function reverted", details: decodedError.args?.toString(), errorData, }; } catch { // Fallback if decoding fails return { type: "RawError", message: "Could not decode error", errorData, }; } } } catch (extractionError) { // Fallback error extraction return { type: "UnknownError", message: error.shortMessage || "Unknown contract error", details: error.message, }; } } // Generic BaseError handling return { type: "RawError", message: error.shortMessage || "Base error occurred", details: error.message, };}// Fallback for non-BaseErrorreturn { type: "UnknownError", message: "message" in (error as any) ? (error as any).message : String(error), details: error instanceof Error ? error.message : undefined,};} Edit ./app/src/main.tsx to add a Thirdweb provider around your application. In the following example, replace line 7 <THIRDWEB_CLIENTID> with your own clientId configured on the Thirdweb dashboard here: import { createRoot } from "react-dom/client";import { createThirdwebClient } from "thirdweb";import { ThirdwebProvider } from "thirdweb/react";import App from "./App.tsx";import "./index.css";const client = createThirdwebClient({clientId: "<THIRDWEB_CLIENTID>",});createRoot(document.getElementById("root")!).render(<ThirdwebProvider> <App thirdwebClient={client} /></ThirdwebProvider>); ThirdwebProvider encapsulates your application to inject account context and wrapped Viem functions Edit ./app/src/App.tsx to have this code: import { Marketpulse, Marketpulse__factory } from "./typechain-types";import BigNumber from "bignumber.js";import { useEffect, useState } from "react";import "./App.css";import { defineChain, getContract, prepareContractCall, readContract, sendTransaction, ThirdwebClient, waitForReceipt,} from "thirdweb";import { ConnectButton, useActiveAccount } from "thirdweb/react";import { createWallet, inAppWallet } from "thirdweb/wallets";import { parseEther } from "viem";import { etherlinkTestnet } from "viem/chains";import { extractErrorDetails } from "./DecodeEvmTransactionLogsArgs";import CONTRACT_ADDRESS_JSON from "./deployed_addresses.json";const wallets = [ inAppWallet({ auth: { options: ["google", "email", "passkey", "phone"], }, }), createWallet("io.metamask"), createWallet("com.coinbase.wallet"), createWallet("io.rabby"), createWallet("com.trustwallet.app"), createWallet("global.safe"),];//copy pasta from Solidity code as Abi and Typechain does not export enum typesenum BET_RESULT { WIN = 0, DRAW = 1, PENDING = 2,}interface AppProps { thirdwebClient: ThirdwebClient;}export default function App({ thirdwebClient }: AppProps) { console.log("*************App"); const account = useActiveAccount(); const [options, setOptions] = useState<Map<string, bigint>>(new Map()); const [error, setError] = useState<string>(""); const [status, setStatus] = useState<BET_RESULT>(BET_RESULT.PENDING); const [winner, setWinner] = useState<string | undefined>(undefined); const [fees, setFees] = useState<number>(0); const [betKeys, setBetKeys] = useState<bigint[]>([]); const [_bets, setBets] = useState<Marketpulse.BetStruct[]>([]); const reload = async () => { if (!account?.address) { console.log("No address..."); } else { const dataStatus = await readContract({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "status", params: [], }); const dataWinner = await readContract({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "winner", params: [], }); const dataFEES = await readContract({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "FEES", params: [], }); const dataBetKeys = await readContract({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "getBetKeys", params: [], }); setStatus(dataStatus as unknown as BET_RESULT); setWinner(dataWinner as unknown as string); setFees(Number(dataFEES as unknown as bigint) / 100); setBetKeys(dataBetKeys as unknown as bigint[]); console.log( "**********status, winner, fees, betKeys", status, winner, fees, betKeys ); } }; //first call to load data useEffect(() => { (() => reload())(); }, [account?.address]); //fetch bets useEffect(() => { (async () => { if (!betKeys || betKeys.length === 0) { console.log("no dataBetKeys"); setBets([]); } else { const bets = await Promise.all( betKeys.map( async (betKey) => (await readContract({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "getBets", params: [betKey], })) as unknown as Marketpulse.BetStruct ) ); setBets(bets); //fetch options let newOptions = new Map(); setOptions(newOptions); bets.forEach((bet) => { if (newOptions.has(bet!.option)) { newOptions.set( bet!.option, newOptions.get(bet!.option)! + bet!.amount ); //acc } else { newOptions.set(bet!.option, bet!.amount); } }); setOptions(newOptions); console.log("options", newOptions); } })(); }, [betKeys]); const Ping = () => { // Comprehensive error handling const handlePing = async () => { try { const preparedContractCall = await prepareContractCall({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "ping", params: [], }); console.log("preparedContractCall", preparedContractCall); const transaction = await sendTransaction({ transaction: preparedContractCall, account: account!, }); //wait for tx to be included on a block const receipt = await waitForReceipt({ client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), transactionHash: transaction.transactionHash, }); console.log("receipt:", receipt); setError(""); } catch (error) { const errorParsed = extractErrorDetails( error, Marketpulse__factory.abi ); setError(errorParsed.message); } }; return ( <span style={{ alignContent: "center", paddingLeft: 100 }}> <button onClick={handlePing}>Ping</button> {!error || error === "" ? <>&#128994;</> : <>&#128308;</>} </span> ); }; const BetFunction = () => { const [amount, setAmount] = useState<BigNumber>(BigNumber(0)); //in Ether decimals const [option, setOption] = useState("chiefs"); const runFunction = async () => { try { const contract = getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }); const preparedContractCall = await prepareContractCall({ contract, method: "bet", params: [option, parseEther(amount.toString(10))], value: parseEther(amount.toString(10)), }); const transaction = await sendTransaction({ transaction: preparedContractCall, account: account!, }); //wait for tx to be included on a block const receipt = await waitForReceipt({ client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), transactionHash: transaction.transactionHash, }); console.log("receipt:", receipt); await reload(); setError(""); } catch (error) { const errorParsed = extractErrorDetails( error, Marketpulse__factory.abi ); console.log("ERROR", error); setError(errorParsed.message); } }; const calculateOdds = (option: string, amount?: bigint): BigNumber => { //check option exists if (!options.has(option)) return new BigNumber(0); console.log( "actuel", options && options.size > 0 ? new BigNumber(options.get(option)!.toString()).toString() : 0, "total", new BigNumber( [...options.values()] .reduce((acc, newValue) => acc + newValue, amount ? amount : 0n) .toString() ).toString() ); return options && options.size > 0 ? new BigNumber(options.get(option)!.toString(10)) .plus( amount ? new BigNumber(amount.toString(10)) : new BigNumber(0) ) .div( new BigNumber( [...options.values()] .reduce( (acc, newValue) => acc + newValue, amount ? amount : 0n ) .toString(10) ) ) .plus(1) .minus(fees) : new BigNumber(0); }; return ( <span style={{ alignContent: "center", width: "100%" }}> {status && status === BET_RESULT.PENDING ? ( <> <h3>Choose team</h3> <select name="options" onChange={(e) => setOption(e.target.value)} value={option} > <option value="chiefs"> Chiefs</option> <option value="lions">Lions </option> </select> <h3>Amount</h3> <input type="number" id="amount" name="amount" required onChange={(e) => { if (e.target.value && !isNaN(Number(e.target.value))) { //console.log("e.target.value",e.target.value) setAmount(new BigNumber(e.target.value)); } }} /> <hr /> {account?.address ? <button onClick={runFunction}>Bet</button> : ""} <table style={{ fontWeight: "normal", width: "100%" }}> <tbody> <tr> <td style={{ textAlign: "left" }}>Avg price (decimal)</td> <td style={{ textAlign: "right" }}> {options && options.size > 0 ? calculateOdds(option, parseEther(amount.toString(10))) .toFixed(3) .toString() : 0} </td> </tr> <tr> <td style={{ textAlign: "left" }}>Potential return</td> <td style={{ textAlign: "right" }}> XTZ{" "} {amount ? calculateOdds(option, parseEther(amount.toString(10))) .multipliedBy(amount) .toFixed(6) .toString() : 0}{" "} ( {options && options.size > 0 ? calculateOdds(option, parseEther(amount.toString(10))) .minus(new BigNumber(1)) .multipliedBy(100) .toFixed(2) .toString() : 0} %) </td> </tr> </tbody> </table> </> ) : ( <> <span style={{ color: "#2D9CDB", fontSize: "1.125rem" }}> Outcome: {BET_RESULT[status]} </span> {winner ? <div style={{ color: "#858D92" }}>{winner}</div> : ""} </> )} </span> ); }; const resolve = async (option: string) => { try { const preparedContractCall = await prepareContractCall({ contract: getContract({ abi: Marketpulse__factory.abi, client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), address: CONTRACT_ADDRESS_JSON["MarketpulseModule#Marketpulse"], }), method: "resolveResult", params: [option, BET_RESULT.WIN], }); console.log("preparedContractCall", preparedContractCall); const transaction = await sendTransaction({ transaction: preparedContractCall, account: account!, }); //wait for tx to be included on a block const receipt = await waitForReceipt({ client: thirdwebClient, chain: defineChain(etherlinkTestnet.id), transactionHash: transaction.transactionHash, }); console.log("receipt:", receipt); await reload(); setError(""); } catch (error) { const errorParsed = extractErrorDetails(error, Marketpulse__factory.abi); setError(errorParsed.message); } }; return ( <> <header> <span style={{ display: "flex" }}> <h1>Market Pulse</h1> <div className="flex items-center gap-4"> <ConnectButton client={thirdwebClient} wallets={wallets} connectModal={{ size: "compact" }} chain={defineChain(etherlinkTestnet.id)} /> </div> </span> </header> <div id="content" style={{ display: "flex", paddingTop: 10 }}> <div style={{ width: "calc(66vw - 4rem)" }}> <img style={{ maxHeight: "40vh" }} src="https://zamrokk.github.io/marketpulse/images/graph.png" /> <hr /> <table style={{ width: "inherit" }}> <thead> <tr> <th>Outcome</th> <th>% chance</th> <th>action</th> </tr> </thead> <tbody> {options && options.size > 0 ? ( [...options.entries()].map(([option, amount]) => ( <tr key={option}> <td className="tdTable"> <div className="picDiv"> <img style={{ objectFit: "cover", height: "inherit" }} src={ "https://zamrokk.github.io/marketpulse/images/" + option + ".png" } ></img> </div> {option} </td> <td> {new BigNumber(amount.toString()) '
