["https://docs.etherlink.com/bridging/bridging-fa"]
title = "Bridging FA tokens between Tezos layer 1 and Etherlink | Etherlink documentation"
description = "You can bridge FA standards-compliant tokens in and out of Etherlink by deploying contracts that move the tokens."
full_description = "BridgingBridging FA tokens between Tezos layer 1 and EtherlinkYou can bridge FA standards-compliant tokens in and out of Etherlink by deploying contracts that move the tokens. Then you can create dApps that use these contracts to move tokens or send a request to the Etherlink team to add your tokens to the bridge at https://www.etherlinkbridge.com/tezos-bridge. The Tezos FA standards are token standards like the Ethereum ERC-20, ERC-721, and ERC-1155 standards. For more information about the FA standards, see Token standards on docs.tezos.com. Two bridging operations are available: Bridging tokens from Tezos layer 1 to Etherlink is referred to as depositing tokens. Depositing an FA token locks it in a contract on layer 1 and mints an equivalent ERC-20 token on Etherlink. Bridging tokens from Etherlink to Tezos layer 1 is referred to as withdrawing tokens. Withdrawing an FA token burns the ERC-20 token on Etherlink and unlocks the equivalent token on Tezos layer 1. Like the bridge that transfers XTZ tokens (see Bridging XTZ between Tezos layer 1 and Etherlink), the FA bridge is permissionless, meaning that anyone can use it without restrictions or the intervention of a third party. It is also trustless, meaning that it relies on automated, transparent, and audited smart contracts installed on Etherlink and Tezos. Bridging time Tokens that you bridge from Tezos layer 1 to Etherlink are available for use on Etherlink immediately.Tokens that you bridge from Etherlink to Tezos layer 1 are available for use on Tezos in 15 days.This delay is caused by the Smart Rollup refutation period. As with all Smart Rollups, Etherlink nodes post commitments about their state to Tezos layer 1, including incoming bridging transactions, on a regular schedule. Other nodes have the length of the refutation period (14 days) to challenge those commitments. At the end of the refutation period, the correct commitment is cemented, or made final and unchangeable.After the commitment with the withdrawal transaction is cemented, any user can execute the transaction to make the bridged tokens available on Tezos layer 1.Delay variationsThis delay can vary if a Tezos layer 1 protocol upgrade changes the block times during a commitment's refutation period.When layer 1 changes block times, it adjusts the number of blocks in the refutation period to keep the refutation period at the same real-world length. It uses this new number of blocks to determine whether commitments can be cemented.For this reason, if the block time gets shorter during the commitment's refutation period, the number of blocks that must pass before cementing a commitment increases. Therefore, commitments that are not cemented when the number of blocks changes must wait slightly longer before they can be cemented.This variation affects only commitments that are not cemented when the layer 1 protocol upgrade happens. The delay is based on how much the block times changed and on how close a commitment is to being cemented when the number of blocks in the refutation period changes.The maximum change is the new block time divided by the old block time multiplied by the standard refutation period. For example, if the new block time is 8 seconds and the old block time is 10 seconds, the maximum addition to a commitment's refutation period is 10 / 8, or 1.25 times the standard 14-day period. Commitments that are close to being cemented when the block time changes have the largest change to their refutation periods, while commitments that are made close to when the block time changes have a very small change. For information about how FA token bridging works, see How bridging FA tokens works. Configuring a token for bridging​ You can configure any FA1.2 or FA2 token for bridging by deploying the necessary contracts. You can use this tool to simplify the process by deploying the contracts for a single token: https://github.com/baking-bad/etherlink-bridge. Setting up a token for bridging in this way does not make it appear on the Etherlink bridge web site. You must deploy and operate the FA bridge contracts yourself as described in Sending FA bridging transactions. Adding an FA token to the bridge UI​ You can set up your own UI to call the bridging contracts using any Tezos and EVM clients. You can also send a request to the Etherlink team to add your token to the bridge UI at https://www.etherlinkbridge.com/tezos-bridge. To request that your FA token be added to the bridge UI, fill out this request form: https://tt-tezos.typeform.com/to/RmiMO04v The form requires information about the token and the bridging contracts: The address of the FA token contract on Tezos The address of the ticketer contract on Tezos The address of the token bridge helper contract on Tezos The address of the ERC-20 proxy contract on Etherlink The name of the token The ticker symbol for the token The number of decimal places used in the token quantity An icon for the token The Twitter user name of the token creator A contact email address for follow-up questions You can get information about the bridging contracts from the response messages from the bridging tool and from block explorers. After you submit the form, the team that manages the Etherlink bridge UI reviews it and adds it to the UI if they approve it.Last updated on Feb 27, 2025"
year_published = 2025
year_updated = 2025
clearnet = "https://docs.etherlink.com/bridging/bridging-fa"
