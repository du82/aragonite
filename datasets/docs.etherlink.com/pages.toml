full_description = "ToolsData indexersThe Graph​ The Graph is an indexing protocol for organizing blockchain data and making it easily accessible with GraphQL. Etherlink dApps can use GraphQL to query open APIs called subgraphs, to retrieve data that is indexed on the network. For information on indexing contracts with The Graph, see Indexing Etherlink contracts with TheGraph. Subsquid​ Subsquid is a peer-to-peer network to quickly batch, query and aggregate on-chain and off-chain data. Learn how to use their SDK with this guide. DipDup​ DipDup provides a framework for creating custom indexers. For information on indexing Etherlink with DipDup, see Etherlink in the DipDup documentation. Subquery​ Subquery indexer is an open-source indexer that supports Etherlink, along with many other networks. For examples of using Subquery with Etherlink, see these sample projects: Mainnet: https://github.com/subquery/ethereum-subql-starter/tree/main/Etherlink%20Mainnet/etherlink-mainnet-etherlink-starter Testnet: https://github.com/subquery/ethereum-subql-starter/tree/main/Etherlink/etherlink-testnet-starter Last updated on Feb 27, 2025"
