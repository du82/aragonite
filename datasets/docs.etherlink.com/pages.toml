["https://docs.etherlink.com/network/evm-nodes"]
title = "Running an Etherlink EVM node | Etherlink documentation"
description = "The Etherlink EVM nodes are responsible for maintaining a copy of the Etherlink context and applying new blocks that process EVM transactions."
full_description = '''NetworkRunning an Etherlink EVM nodeThe Etherlink EVM nodes are responsible for maintaining a copy of the Etherlink context and applying new blocks that process EVM transactions. Prerequisites​ Make sure you understand the interaction between different nodes as described in Etherlink architecture. If you want to verify the blocks that come from the sequencer, run an Etherlink Smart Rollup node as described in Running an Etherlink Smart Rollup node. Public Smart Rollup nodes for Etherlink are not yet available, so you must run your own if you want to participate in the Etherlink network. The EVM node runs Etherlink's kernel. You can get the kernel by importing it from a running Etherlink Smart Rollup node or by providing the installer kernel. System requirements​ Running an Etherlink EVM node on Etherlink Mainnet requires a computer with 500GB of disk space and at least 16GB RAM. Getting the octez-evm-node binary​ The easiest way to get the octez-evm-node binary is to download the binaries distributed as part of its latest release from https://gitlab.com/tezos/tezos/-/releases. The release page provides static binaries for Linux systems (for amd64 and arm64 architectures). As an alternative, you can use the minimal Docker image tezos/tezos-bare with a tag that includes octez-evm-node. These images contain the correct version of the binary. Initializing the data directory​ If you want your EVM node to check the correctness of the blocks it receives via a Smart Rollup node, get the RPC URL of that Etherlink Smart Rollup node, such as http://localhost:8932. The following instructions use the variable <SR_NODE_OBSERVER_RPC> to represent this URL. Create a directory for the node to store its data in. The default directory is $HOME/.octez-evm-node. The following instructions use the variable <EVM_DATA_DIR> to represent this directory. Initialize the node by setting the data directory in the --data-dir argument and the network to use (such as mainnet or testnet) in the --network argument. To trust incoming blocks, use --dont-track-rollup-node: octez-evm-node init config \ --network mainnet \ --data-dir <EVM_DATA_DIR> \ --dont-track-rollup-node Alternatively, if you want to rely on a Smart Rollup node to check the correctness of blocks coming from the sequencer, pass the address of the Smart Rollup node to the --rollup-node-endpoint argument, as in this example: octez-evm-node init config \ --network mainnet \ --data-dir <EVM_DATA_DIR> \ --rollup-node-endpoint <SR_NODE_OBSERVER_RPC> The --network argument sets the node to use preimages that the Tezos Foundation hosts on a file server on a so-called "preimages endpoint". For example, passing --network mainnet implies these arguments: --preimages-endpoint https://snapshots.eu.tzinit.org/etherlink-mainnet/wasm_2_0_0 \--evm-node-endpoint https://relay.mainnet.etherlink.com It's safe to use these preimages because the node verifies them. If you don't want to use third-party preimages, you can build the kernel yourself and move the contents of the wasm_2_0_0/ directory to the local data directory; see Building the Etherlink kernel. However, in this case, you must manually update this directory with the preimages of every kernel voted by the community and deployed on Etherlink after that. Running the node​ You can initialize the node from a snapshot, initialize it from an existing Etherlink Smart Rollup node, or allow it to compute the Etherlink state from genesis. From a snapshot​ To automatically download and import a snapshot, start the node with the --init-from-snapshot switch and the network to use, as in this example: octez-evm-node run observer \ --data-dir <EVM_DATA_DIR> \ --network testnet \ --init-from-snapshot The node can take time to download and import the snapshot. To import the snapshot manually, download the snapshot from http://snapshotter-sandbox.nomadic-labs.eu/ and import it with this command: wget http://snapshotter-sandbox.nomadic-labs.eu/etherlink-mainnet/evm-snapshot-sr1Ghq66tYK9y-latest.gz # this is for the latest mainnet etherlink snapshots, similarly there is one for testnetoctez-evm-node snapshot import evm-snapshot-sr1Ghq66tYK9y-latest.gz \ --data-dir <EVM_DATA_DIR> You can also pass the URL of the snapshot directly to the octez-evm-node snapshot import command. Then, run this command to start the node, passing the data directory and the network to use: octez-evm-node run observer \ --network testnet \ --data-dir <EVM_DATA_DIR> From an existing Etherlink Smart Rollup node​ Download an Etherlink Smart Rollup node snapshot, and use the octez-smart-rollup-node binary to import it in a temporary directory. The following examples use <SR_OBSERVER_DATA_DIR> as the location of this temporary directory. wget https://snapshots.eu.tzinit.org/etherlink-mainnet/eth-mainnet.fulloctez-smart-rollup-node --endpoint https://rpc.tzkt.io/mainnet \ snapshot import eth-mainnet.full \ --data-dir <SR_OBSERVER_DATA_DIR> If you are running a Smart Rollup node on the same machine, you can skip this step because you can reuse its data directory. Run this command to import the kernel from the Smart Rollup node: octez-evm-node init from rollup node <SR_OBSERVER_DATA_DIR> --data-dir <EVM_DATA_DIR> Run this command to start the node: octez-evm-node run observer --data-dir <EVM_DATA_DIR> The EVM node runs in archive mode. From genesis​ Get the Etherlink installer kernel (installer.hex file), which you can build yourself as described in Building the Etherlink kernel or download here: installer.hex. Run this command to start the node with the Etherlink installer kernel that you built or downloaded; change the name of the installer.hex file in the command accordingly: octez-evm-node run observer --data-dir <EVM_DATA_DIR> --initial-kernel installer.hex The --initial-kernel argument is needed only the first time that you start the node. Verifying that the node is running​ When the node is running, its log shows information about the blocks it receives from the sequencer (referred to here as blueprints), as in this example: Jan 15 20:17:23.794: Applied a blueprint for level 16867349 at 2025-01-15T19:38:35Z containing 1Jan 15 20:17:23.794: transactions for 2814041 gas leading to creating blockJan 15 20:17:23.794: 0xeb720c1c5df94f820d4ede15ddef92b9267d1291dea15a716a160b4c2[...] in 245ms. By default, the EVM node exposes its JSON RPC API endpoint to localhost:8545. You can test that everything works as expected by running RPC requests manually or by setting your wallet to use your local node. For example, this command gets the number of the most recent block in hexadecimal: curl -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_blockNumber"}' http://localhost:8545Last updated on Feb 27, 2025'''
year_published = 2025
year_updated = 2025
clearnet = "https://docs.etherlink.com/network/evm-nodes"
