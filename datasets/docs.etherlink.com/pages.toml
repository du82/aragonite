["https://docs.etherlink.com/tutorials/marketpulse/test"]
title = "Test the contract | Etherlink documentation"
description = "With blockchain development, testing is very important because you don't have the luxury to redeploy application updates as it. Hardhat provides you smart contract helpers on chai Testing framework to do so."
full_description = '''TutorialTest the contract With blockchain development, testing is very important because you don't have the luxury to redeploy application updates as it. Hardhat provides you smart contract helpers on chai Testing framework to do so. Rename the default ./test/Lock.ts test file to ./test/Marketpulse.ts: mv ./test/Lock.ts ./test/Marketpulse.ts Replace the default file with this code: import { loadFixture } from "@nomicfoundation/hardhat-toolbox-viem/network-helpers";import { expect } from "chai";import hre from "hardhat";import { ContractFunctionExecutionError, parseEther } from "viem";//constants and local variablesconst ODD_DECIMALS = 10;let initAliceAmount = 0n;let initBobAmount = 0n;//Enum definition copy/pasta from Solidity codeenum BET_RESULT { WIN = 0, DRAW = 1, PENDING = 2,}describe("Marketpulse", function () { // We define a fixture to reuse the same setup in every test. // We use loadFixture to run this setup once, snapshot that state, // and reset Hardhat Network to that snapshot in every test. async function deployContractFixture() { // Contracts are deployed using the first signer/account by default const [owner, bob] = await hre.viem.getWalletClients(); // Set block base fee to zero because we want exact calculation checks without network fees await hre.network.provider.send("hardhat_setNextBlockBaseFeePerGas", [ "0x0", ]); const marketpulseContract = await hre.viem.deployContract( "Marketpulse", [] ); const publicClient = await hre.viem.getPublicClient(); initAliceAmount = await publicClient.getBalance({ address: owner.account.address, }); initBobAmount = await publicClient.getBalance({ address: bob.account.address, }); return { marketpulseContract, owner, bob, publicClient, }; } describe("init function", function () { it("should be initialized", async function () { const { marketpulseContract, owner } = await loadFixture( deployContractFixture ); const ownerFromStorage = await marketpulseContract.read.admin(); console.log("ownerFromStorage", ownerFromStorage); expect(ownerFromStorage.toLowerCase()).to.equal( owner.account.address.toLowerCase() ); //trick to remove capital letters }); it("should return Pong", async function () { const { marketpulseContract, publicClient } = await loadFixture( deployContractFixture ); await marketpulseContract.write.ping({ gasPrice: 0n }); const logs = await publicClient.getContractEvents({ abi: marketpulseContract.abi, eventName: "Pong", }); console.log(logs); expect(logs.length).to.equal(1); }); }); // BET SCENARIO //full scenario should be contained inside the same 'it' , otherwise the full context is reset describe("scenario", () => { let betChiefs1Id: bigint = BigInt(0); let betLions2Id: string = ""; let betKeys: bigint[] = []; it("should run the full scenario correctly", async () => { console.log("Initialization should return a list of empty bets"); const { marketpulseContract, owner: alice, publicClient, bob, } = await loadFixture(deployContractFixture); expect(await marketpulseContract.read.betKeys.length).to.equal(0); console.log("Chiefs bet for 1 ether should return a hash"); const betChiefs1IdHash = await marketpulseContract.write.bet( ["chiefs", parseEther("1")], { value: parseEther("1"), gasPrice: 0n } ); expect(betChiefs1IdHash).not.null; // Wait for the transaction receipt let receipt = await publicClient.waitForTransactionReceipt({ hash: betChiefs1IdHash, }); expect(receipt.status).equals("success"); betKeys = [...(await marketpulseContract.read.getBetKeys())]; console.log("betKeys", betKeys); betChiefs1Id = betKeys[0]; console.log("Should find the Chiefs bet from hash"); const betChiefs1 = await marketpulseContract.read.getBets([betChiefs1Id]); expect(betChiefs1).not.null; expect(betChiefs1.owner.toLowerCase()).equals( alice.account.address.toLowerCase() ); expect(betChiefs1.option).equals("chiefs"); expect(betChiefs1.amount).equals(parseEther("1")); console.log("Should get a correct odd of 0.9 (including fees) for Chiefs if we bet 1"); let odd = await marketpulseContract.read.calculateOdds([ "chiefs", parseEther("1"), ]); expect(odd).equals(BigInt(Math.floor(0.9 * 10 ** ODD_DECIMALS))); //rounding console.log("Lions bet for 2 ethers should return a hash"); // Set block base fee to zero await hre.network.provider.send("hardhat_setNextBlockBaseFeePerGas", [ "0x0", ]); const betLions2IdHash = await marketpulseContract.write.bet( ["lions", parseEther("2")], { value: parseEther("2"), account: bob.account.address, gasPrice: 0n } ); expect(betLions2IdHash).not.null; // Wait for the transaction receipt receipt = await publicClient.waitForTransactionReceipt({ hash: betLions2IdHash, }); expect(receipt.status).equals("success"); betKeys = [...(await marketpulseContract.read.getBetKeys())]; console.log("betKeys", betKeys); const betLions2Id = betKeys[1]; console.log("Should find the Lions bet from hash"); const betLions2 = await marketpulseContract.read.getBets([ betLions2Id, ]); expect(betLions2).not.null; expect(betLions2.owner.toLowerCase()).equals( bob.account.address.toLowerCase() ); expect(betLions2.option).equals("lions"); expect(betLions2.amount).equals(parseEther("2")); console.log("Should get a correct odd of 1.9 for Chiefs (including fees) if we bet 1"); odd = await marketpulseContract.read.calculateOdds([ "chiefs", parseEther("1"), ]); expect(odd).equals(BigInt(Math.floor(1.9 * 10 ** ODD_DECIMALS))); console.log( "Should get a correct odd of 1.23333 for lions (including fees) if we bet 1" ); odd = await marketpulseContract.read.calculateOdds([ "lions", parseEther("1"), ]); expect(odd).equals( BigInt(Math.floor((1 + 1 / 3 - 0.1) * 10 ** ODD_DECIMALS)) ); console.log("Should return all correct balances after resolving Win on Chiefs"); await marketpulseContract.write.resolveResult( ["chiefs", BET_RESULT.WIN], { gasPrice: 0n } ); expect( await publicClient.getBalance({ address: marketpulseContract.address, }) ).equals(parseEther("0.1")); expect( await publicClient.getBalance({ address: alice.account.address }) ).equals(initAliceAmount + parseEther("1.9")); // -1+2.9 expect( await publicClient.getBalance({ address: bob.account.address }) ).equals(initBobAmount - parseEther("2")); //-2 console.log("Should have state finalized after resolution"); const result = await marketpulseContract.read.status(); expect(result).not.null; expect(result).equals(BET_RESULT.WIN); console.log("Should return an error if we try to resolve results again"); try { await marketpulseContract.write.resolveResult( ["chiefs", BET_RESULT.WIN], { gasPrice: 0n } ); } catch (e) { expect((e as ContractFunctionExecutionError).details).contains( "VM Exception while processing transaction: reverted with reason string 'Result is already given and bets are resolved" ); } }); });}); Run the tests with Hardhat: npx hardhat test The technical Ping test and the full end2end scenario should pass. If you see errors, make sure that your application matches the application in this repository: https://github.com/trilitech/tutorial-applications/tree/main/etherlink-marketpulse. Last updated on Feb 27, 2025'''
year_published = 2025
year_updated = 2025
