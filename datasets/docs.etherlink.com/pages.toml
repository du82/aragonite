full_description = "Get StartedNetwork informationFor current and historical status information for Etherlink, see https://status.etherlink.com. For every network, we provide two public endpoints: a full RPC endpoint and a relay endpoint. The full RPC endpoint can be consumed by Etherlink users and decentralized applications to interact with the chain. The relay endpoint exposes a restricted RPC API with only eth_sendRawTransaction and eth_blockNumber available. Use the relay endpoint when setting up an Etherlink node. Our full RPC endpoint is rate-limited to 1000 requests per minute. You can set up your own node if you need an endpoint without a rate limit. Etherlink Mainnet​ ParameterValueNetwork NameEtherlink MainnetEVM versionShanghaiRPC Endpointhttps://node.mainnet.etherlink.comRelay Endpointhttps://relay.mainnet.etherlink.comTezos Smart Rollup addresssr1Ghq...vZEfChain ID42793Currency SymbolXTZBlock Explorer URLhttps://explorer.etherlink.comEtherlink smart rollup snapshotshttps://snapshots.eu.tzinit.org/etherlink-mainnet/Etherlink EVM node snapshotshttps://snapshotter-sandbox.nomadic-labs.eu/etherlink-mainnet/Pre-imageshttps://snapshots.tzinit.org/etherlink-mainnet/wasm_2_0_0 Etherlink Testnet (Ghostnet)​ ParameterValueNetwork NameEtherlink TestnetEVM versionShanghaiRPC Endpointhttps://node.ghostnet.etherlink.comRelay Endpointhttps://relay.ghostnet.etherlink.comTezos Smart Rollup addresssr18wx...MLqgChain ID128123Currency SymbolXTZBlock Explorer URLhttps://testnet.explorer.etherlink.com/Etherlink smart rollup snapshotshttps://snapshots.eu.tzinit.org/etherlink-ghostnet/Etherlink EVM node snapshotshttps://snapshotter-sandbox.nomadic-labs.eu/etherlink-ghostnet/Pre-imageshttps://snapshots.tzinit.org/etherlink-ghostnet/wasm_2_0_0Last updated on Feb 27, 2025"
