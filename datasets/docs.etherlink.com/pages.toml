["https://docs.etherlink.com/network/fees"]
title = "Fee structure | Etherlink documentation"
description = "Etherlink transactions include two fees:"
full_description = '''NetworkFee structureEtherlink transactions include two fees: The execution fee, sometimes known as the gas fee, is a fee for running the transaction. It changes depending on Etherlink throughput over time; at times of high demand for Etherlink transactions, the gas fee rises. This fee is burned. The inclusion fee goes to the sequencer to defray the cost of the data that Etherlink stores on Tezos layer 1. Transactions that use more data pay a higher fee. Unlike some other chains, Etherlink does not use a voluntary gas fee, also known as a tip, to encourage block producers to include transactions more quickly. Because the Etherlink sequencer orders transactions in first-come-first-served order, there is no need to offer higher fees for faster inclusion. The base fee of the transaction (in the Ethereum max_fee_per_gas EIP-1559 field) must be enough to cover these Etherlink fees. Etherlink ignores the priority fee in the max_priority_fee_per_gas field. If the transaction's base fee is not enough to cover Etherlink's fees, the transaction fails, even if the amount of the priority fee would be enough to cover the fee. Execution fee​ The execution fee changes based on the transaction throughput over time. Etherlink measures throughput in terms of ticks, which are execution steps. As demand increases, Etherlink runs more ticks per second to process more transactions in the same amount of time. Etherlink has a target number of ticks to run per second, referred to as the speed limit. To calculate the throughput, Etherlink stores the number of ticks used by transactions and subtracts the speed limit every second. The remaining number of ticks is known as the backlog. In this way, if the number of ticks that transactions use per second exceeds the speed limit, the backlog increases and the execution fee goes up. If the number of ticks they use per second is below the speed limit, the backlog decreases or reaches zero and the execution fee decreases or reaches a base amount. The backlog never goes below zero and the execution fee never goes below the base amount. The execution fee depends on these parameters: minimum_base_fee_per_gas: The base fee for Etherlink transactions, which is 1 gwei speed_limit: The target number of ticks per second tolerance: The size the backlog is allowed to grow to before the execution fee increases backlog: A measure of the number of ticks used per second in excess of the speed limit; Etherlink deducts the speed limit from the backlog every second alpha: A scaling factor If the backlog is less than the tolerance, the execution fee for a transaction is minimum_base_fee_per_gas. If the backlog is greater than the tolerance, Etherlink calculates the execution fee with this equation: execution fee=minimum_base_fee_per_gas∗ea∗(backlog−tolerance)\texttt{execution fee} = \texttt{minimum\_base\_fee\_per\_gas} * e ^{a * (\texttt{backlog} - \texttt{tolerance})}execution fee=minimum_base_fee_per_gas∗ea∗(backlog−tolerance) In other words, the execution fee is the base fee times the exponential function of the alpha scaling factor times the backlog in excess of the tolerance. Inclusion fee​ The inclusion fee, also called the data availability fee, helps Etherlink cover the cost of posting data to layer 1. The amount of the fee depends on the size of the data in the transaction (as provided by tx.data.size()) and the size of the access list, a list of addresses and storage keys that a transaction intends to access (as provided by tx.access_list.size()). Etherlink calculates the inclusion fee with this equation: 0.000004 XTZ∗(150+tx.data.size()+tx.access_list.size())\texttt{0.000004 XTZ} * (150 + \texttt{tx.data.size()} + \texttt{tx.access\_list.size()})0.000004 XTZ∗(150+tx.data.size()+tx.access_list.size())Last updated on Feb 27, 2025'''
year_published = 2025
year_updated = 2025
