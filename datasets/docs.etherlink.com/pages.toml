title = "Game development | Etherlink documentation"
description = "Tezos Unity SDK"
full_description = "ToolsGame developmentTezos Unity SDK​ The Tezos Unity SDK provides tools that lets you access Etherlink in games and other Unity applications. You can use the SDK to: Use a player's account as their account for a game and their wallet as their way of logging in to the game Accept payments from players in XTZ Use Etherlink to create game assets, store player inventories, and transfer assets between players Verify that users own specific game assets and allow them to transfer them to other players Use smart contracts as backend logic for games The SDK supports wallets that connect via the WalletConnect protocol, including MetaMask. It can call Etherlink contracts and initiate transfers of XTZ on Etherlink. Using Etherlink in a Unity application requires version 4.0.0 of the Tezos Unity SDK or later. For more information, see the documentation for the Tezos Unity SDK. Sequence​ Sequence is a comprehensive web3 integration platform for game developers that simplifies blockchain implementation with plug-and-play tools. Sequence offers: Support for Etherlink Mainnet and Testnet Full-stack development support across frontend, backend, and on-chain SDK integration for Unity, Unreal, and mobile Payment solutions with fiat-crypto onramps and NFT checkout Development acceleration tools for faster market entry Analytics and indexing capabilities for performance tracking Smart contract wallet solutions and marketplace building tools Last updated on Feb 27, 2025"
