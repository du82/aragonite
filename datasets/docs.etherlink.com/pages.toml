full_description = "DevelopingEthereum endpoint supportEtherlink nodes use Geth to provide access to both standard Ethereum RPC endpoints and Geth-specific RPC endpoints. These tables list these endpoints and whether Etherlink supports them: Standard Ethereum endpoints​ For information about these endpoints, see JSON-RPC API and the Ethereum JSON-RPC Specification in the Ethereum documentation. EndpointSupportedNotesdebug_getBadBlocksNodebug_getRawBlockNodebug_getRawHeaderNodebug_getRawReceiptsNodebug_getRawTransactionNoengine_exchangeCapabilitiesNoengine_exchangeTransitionConfigurationV1Noengine_forkchoiceUpdatedV1Noengine_forkchoiceUpdatedV2Noengine_forkchoiceUpdatedV3Noengine_getPayloadBodiesByHashV1Noengine_getPayloadBodiesByHashV2Noengine_getPayloadBodiesByRangeV1Noengine_getPayloadBodiesByRangeV2Noengine_getPayloadV1Noengine_getPayloadV2Noengine_getPayloadV3Noengine_getPayloadV4Noengine_newPayloadV1Noengine_newPayloadV2Noengine_newPayloadV3Noengine_newPayloadV4Noeth_accountsYesThis endpoint always returns an empty list because the Etherlink EVM node does not manage any addresseseth_blobBaseFeeNoeth_blockNumberYeseth_callYesEtherlink nodes use the standard Ethereum version of the eth_call endpoint instead of the Geth version; Etherlink does not support the state override set parametereth_chainIdYeseth_coinbaseYeseth_createAccessListNoeth_estimateGasYeseth_feeHistoryYeseth_gasPriceYeseth_getBalanceYeseth_getBlockByHashYeseth_getBlockByNumberYeseth_getBlockReceiptsYeseth_getBlockTransactionCountByHashYeseth_getBlockTransactionCountByNumberYeseth_getCodeYeseth_getFilterChangesNoeth_getFilterLogsNoeth_getLogsYeseth_getProofNoeth_getStorageAtYeseth_getTransactionByBlockHashAndIndexYeseth_getTransactionByBlockNumberAndIndexYeseth_getTransactionByHashYeseth_getTransactionCountYeseth_getTransactionReceiptYeseth_getUncleByBlockHashAndIndexYeseth_getUncleByBlockNumberAndIndexYeseth_getUncleCountByBlockHashYeseth_getUncleCountByBlockNumberYeseth_hashrateNoeth_maxPriorityFeePerGasYeseth_miningNoeth_newBlockFilterNoeth_newFilterNoeth_newPendingTransactionFilterNoeth_protocolVersionNoeth_sendRawTransactionYeseth_sendTransactionNoeth_signNoeth_signTransactionNoeth_syncingNoeth_uninstallFilterNonet_listeningNonet_peerCountNonet_versionYesweb3_clientVersionYesweb3_sha3Yes Geth-specific endpoints​ This table shows the Geth endpoints that Etherlink nodes support. All other Geth endpoints are not supported. For information about these endpoints, see the Geth documentation at https://geth.ethereum.org/docs. EndpointSupportedNotesdebug_traceTransactionPartiallySupported on testnet but not Mainneteth_callNoEtherlink nodes use the standard Ethereum version of the eth_call endpoint instead of the Geth versiontxpool_contentPartiallyReturns the transaction pool on testnet but always returns an empty pool on Mainnet ethers.js SDK methods​ The Etherlink EVM node supports these ethers.js methods: MethodSupportedNotesprovider.getBlockYesprovider.getTransactionReceipt Yesprovider.getBlockNumberYesprovider.getBalanceYessigner.sendTransactionYes Additional information​ CommentsWhitelisting Fireblocks IP addressesNot SupportedNative Token Decimals18Fee StructurePost London (Fee market is not implemented yet, but the rollup supports EIP-1559 transaction types)Last updated on Feb 27, 2025"
