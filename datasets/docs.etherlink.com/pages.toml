title = "Indexing Etherlink contracts with The Graph | Etherlink documentation"
description = "Getting historical data on a smart contract can be frustrating when building a dApp. The Graph provides an easy way to query smart contract data through APIs known as subgraphs. The Graph’s infrastructure relies on a decentralized network of indexers, enabling your dApp to become truly decentralized."
full_description = '''DevelopingIndexing Etherlink contracts with The GraphGetting historical data on a smart contract can be frustrating when building a dApp. The Graph provides an easy way to query smart contract data through APIs known as subgraphs. The Graph’s infrastructure relies on a decentralized network of indexers, enabling your dApp to become truly decentralized. Both Etherlink Mainnet & Testnet are supported by The Graph. Quick start​ These subgraphs only take a few minutes to set up. To get started, follow these three steps: Initialize your subgraph project Deploy & publish Query from your dApp Here’s a step by step walk through: Initialize your subgraph project​ Create a subgraph on Subgraph Studio⁠ Go to the Subgraph Studio and connect your wallet. Once your wallet is connected, you can begin by clicking “Create a Subgraph”. When choosing a name, it is recommended to use Title Case: “Subgraph Name Chain Name.” You will then land on your subgraph’s page. All the CLI commands you need will be visible on the right side of the page: Install the Graph-CLI⁠ On your local machine run the following: npm install -g @graphprotocol/graph-cli Initialize your subgraph⁠ You can copy this directly from your subgraph page to include your specific subgraph slug: graph init <SUBGRAPH_SLUG> You’ll be prompted to provide some info on your subgraph like this: Simply have your contract verified on the block explorer and the CLI will automatically obtain the ABI and set up your subgraph. The default settings will generate an entity for each event. Deploy & publish​ Deploy to Subgraph Studio⁠ First run these commands: $ graph codegen$ graph build Then run these to authenticate and deploy your subgraph. You can copy these commands directly from your subgraph’s page in Studio to include your specific deploy key and subgraph slug: $ graph auth <DEPLOY_KEY>$ graph deploy <SUBGRAPH_SLUG> You will be asked for a version label. You can enter something like v0.0.1, but you’re free to choose the format. Test your subgraph⁠ You can test your subgraph by making a sample query in the playground section. The Details tab will show you an API endpoint. You can use that endpoint to test from your dApp. Publish Your subgraph to The Graph’s decentralized network Once your subgraph is ready to be put into production, you can publish it to the decentralized network. On your subgraph’s page in Subgraph Studio, click on the Publish button: Before you can query your subgraph, Indexers need to begin serving queries on it. In order to streamline this process, you can curate your own subgraph using GRT, The Graph's token. When publishing, you’ll see the option to curate your subgraph. As of May 2024, it is recommended that you curate your own subgraph with at least 3,000 GRT to ensure that it is indexed and available for querying as soon as possible. Note: The Graph's smart contracts are all on Arbitrum One, even though your subgraph is indexing data from Etherlink, Ethereum or any other supported chain. Query your subgraph​ Congratulations! You can now query your subgraph on the decentralized network! For any subgraph on the decentralized network, you can start querying it by passing a GraphQL query into the subgraph’s query URL which can be found at the top of its Explorer page. Here’s an example from the CryptoPunks Ethereum subgraph by Messari: The query URL for this subgraph is: https://gateway-arbitrum.network.thegraph.com/api/[api-key]/subgraphs/id/HdVdERFUe8h61vm2fDyycgxjsde5PbB832NHgJfZNqK Now, you simply need to fill in your own API Key to start sending GraphQL queries to this endpoint. Getting your own API key In Subgraph Studio, you’ll see the “API Keys” menu at the top of the page. Here you can create API Keys. Appendix​ Sample query​ This query shows the most expensive CryptoPunks sold. { trades(orderBy: priceETH, orderDirection: desc) { priceETH tokenId }} Passing this into the query URL returns this result: { "data": { "trades": [ { "priceETH": "124457.067524886018255505", "tokenId": "9998" }, { "priceETH": "8000", "tokenId": "5822" },// ... 💡 Trivia: Looking at the top sales on CryptoPunks website it looks like the top sale is Punk #5822, not #9998. Why? Because they censor the flash-loan sale that happened. Sample code​ const axios = require('axios');const graphqlQuery = `{ trades(orderBy: priceETH, orderDirection: desc) { priceETH tokenId }}`;const queryUrl = 'https://gateway-arbitrum.network.thegraph.com/api/[api-key]/subgraphs/id/HdVdERFUe8h61vm2fDyycHgxjsde5PbB832NHgJfZNqK'const graphQLRequest = { method: 'post', url: queryUrl, data: { query: graphqlQuery, },};// Send the GraphQL queryaxios(graphQLRequest) .then((response) => { // Handle the response here const data = response.data.data console.log(data) }) .catch((error) => { // Handle any errors console.error(error); }); Additional resources:​ To explore all the ways you can optimize & customize your subgraph for a better performance, read more about creating a subgraph here. For more information about querying data from your subgraph, read more here. Last updated on Feb 27, 2025'''
year_published = 2025
year_updated = 2025
