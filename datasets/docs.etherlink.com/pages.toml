["https://docs.etherlink.com/bridging/bridging-fa-transactions"]
title = "Sending FA bridging transactions | Etherlink documentation"
description = "Because the contracts that control bridging FA tokens follow the TZIP-029 standard, the transactions to bridge tokens are the same for any token."
full_description = '''BridgingSending FA bridging transactionsBecause the contracts that control bridging FA tokens follow the TZIP-029 standard, the transactions to bridge tokens are the same for any token. Depositing FA tokens from layer 1 to Etherlink​ It takes two transactions to bridge a token from layer 1 to Etherlink: one to give the token bridge helper contract access to the tokens and another to initiate the deposit. Follow these steps to deposit FA-compliant tokens from layer 1 to Etherlink: Give the token bridge helper contract access to the tokens, depending on the type of token: For FA1.2 tokens, give the token bridge helper contract an allowance for the number of tokens to deposit. You can submit this transaction with any Tezos client. For example, this Octez client command sets the contract's allowance to 5 tokens: octez-client --wait none transfer 0 from my_wallet \ to KT1SekNYSaT3sWp55nhmratovWN4Mvfc6cfQ \ --entrypoint "approve" \ --arg "Pair \"KT1K8od35rJtmQuTUeWbWMa9ciHGTpKjPaqx\" 5" \ --burn-cap 0.1 In this example, KT1SekNYSaT3sWp55nhmratovWN4Mvfc6cfQ is the address of the token contract and KT1K8od35rJtmQuTUeWbWMa9ciHGTpKjPaqx is the address of the token bridge helper contract. For FA2 tokens, make the token bridge helper contract an operator of the token to deposit. You can submit this transaction with any Tezos client, including on many block explorers. For example, this Octez client command makes the token bridge helper contract KT1PaqqmLgyUKyrWQG9tP57rt6tag8nGSrMh an operator of the token with the ID 0 on the FA2 contract KT1N5CWnvabCM71eBmzEhotnQX3eciLLyv8v: octez-client --wait none transfer 0 from my_wallet \ to KT1N5CWnvabCM71eBmzEhotnQX3eciLLyv8v \ --entrypoint "update_operators" \ --arg "{ Left (Pair \"tz1QCVQinE8iVj1H2fckqx6oiM85CNJSK9Sx\" (Pair \"KT1PaqqmLgyUKyrWQG9tP57rt6tag8nGSrMh\" 0)) }" \ --burn-cap 0.1 Call token bridge helper's deposit entrypoint and pass the address of the Etherlink Smart Rollup and the address of the Etherlink account to send the tokens to, as in this example: octez-client --wait none transfer 0 from my_wallet \ to KT1K8od35rJtmQuTUeWbWMa9ciHGTpKjPaqx \ --entrypoint "deposit" \ --arg "Pair \"sr18wx6ezkeRjt1SZSeZ2UQzQN3Uc3YLMLqg\" (Pair 0x45Ff91b4bF16aC9907CF4A11436f9Ce61BE0650d 2)" \ --burn-cap 0.1 The token bridge helper contract sends the tokens to the ticketer contract, which issues a ticket that represents the tokens. The token bridge helper contract sends that ticket to the ERC-20 proxy contract, which mints the tokens and sends them to the Etherlink account. To see the tokens in your Etherlink wallet, look up the ERC-20 proxy contract in a block explorer or use its address to manually add the tokens to your wallet. Because the Etherlink tokens are compatible with the ERC-20 standard, EVM-compatible wallets should be able to display them. Withdrawing FA tokens from Etherlink to layer 1​ It takes two transactions to withdraw an FA token back to Etherlink: one to initiate the withdrawal and another to run the outbox transaction on Tezos layer 1. As described in Bridging FA tokens, you must wait two weeks to run the outbox transaction due to the Smart Rollup refutation period. Neither of these transactions are easy to do. Initiating the withdrawal requires sending complex information about the ticket and contracts to the FA2 withdrawal precompile on Etherlink. Running the outbox transaction requires you to know the level of the Etherlink commitment that contains it in order to get its proof and commitment, and there is no easy way to get that information without using an indexer to check each level for the transaction. The command-line tool at https://github.com/baking-bad/etherlink-bridge provides commands that can help with the withdrawal transactions.Last updated on Feb 27, 2025'''
year_published = 2025
year_updated = 2025
