full_description = 'Get StartedGetting testnet tokensThe native coin on Etherlink has the symbol XTZ, like the tez tokens on Tezos layer 1. For more information about that token and the tokens that are available on Etherlink, see Tokens. The Etherlink test network has a faucet that provides free XTZ tokens that you can use to pay transaction fees and test applications on Etherlink. To get XTZ on Etherlink Testnet, follow these steps: Go to faucet.etherlink.com. Connect your Ethereum wallet. Under "Get testnet XTZ on Etherlink," click Switch Network and approve the request to add and switch networks in your wallet. Solve the CAPTCHA. Click Send 1 XTZ. Wait until the button shows that the XTZ tokens have been transferred. You can also get testnet XTZ on the Tezos testnet faucet and bridge them to Etherlink Testnet. For information about bridging, see Bridging tokens.Last updated on Feb 27, 2025'
