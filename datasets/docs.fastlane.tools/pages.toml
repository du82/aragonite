["https://docs.fastlane.tools/plugins/using-plugins"]
title = "Use Plugins - fastlane docs"
full_description = '''fastlane Plugins The instructions below require fastlane 1.93.0 or higher fastlane is an open platform and we enable every developer to extend it to fit their needs. That's why we built a plugin system that allows you and your company to provide fastlane plugins to other fastlane users. You have the full power and responsibility of maintaining your plugin and keeping it up to date. This is useful if you maintain your own library or web service, and want to make sure the fastlane plugin is always up to date. Local actions (function () { var anchorMap = { "local-actions": "/create-action/" } var hash = window.location.hash.substring(1); if (hash) { if (anchorMap[hash]) { link = anchorMap[hash] + '#' + hash; window.location.replace(link); } } })(); This content was moved and now lives here. Find a plugin Head over to Available Plugins for a list of plugins you can use. List all available plugins using fastlane search_plugins To search for something specific fastlane search_plugins [query] Add a plugin to your project fastlane add_plugin [name] fastlane will assist you on setting up your project to start using plugins. This will: Add the plugin to fastlane/Pluginfile Make sure your fastlane/Pluginfile is properly referenced from your ./Gemfile Run fastlane install_plugins to make sure all required dependencies are installed on your local machine (this step might ask for your admin password to install Ruby gems) You'll have 3 new files, that should all be checked into version control: Gemfile, Gemfile.lock and fastlane/Pluginfile Plugin Source Your fastlane/Pluginfile contains the list of all fastlane plugins your project uses. The Pluginfile is a Gemfile that gets imported from your main Gemfile. You specify all dependencies, including the required version numbers: # Fetched from RubyGems.org gem "fastlane-plugin-xcversion" # Fetched from GitHub gem "fastlane-plugin-xcversion", git: "https://github.com/fastlane/fastlane-plugin-xcversion" gem "fastlane-plugin-xcversion", git: "https://github.com/fastlane/fastlane-plugin-xcversion", branch: "xcode-14-support" gem "fastlane-plugin-xcversion", git: "https://github.com/fastlane/fastlane-plugin-xcversion", tag: "2.0.0" # Fetched from a local directory gem "fastlane-plugin-xcversion", path: "../fastlane-plugin-xcversion" # Specify a version requirements gem "fastlane-plugin-xcversion", "1.1.0" gem "fastlane-plugin-xcversion", ">= 1.0" More information about a Gemfile Run with plugins Run fastlane using bundle exec fastlane [lane] to make sure your plugins are properly loaded. This is required when you use plugins from a local path or a git remote. If you have multiple versions of the same plugin loaded, you may not be using the one you specified in your Pluginfile or Gemfile. Install plugins on another machine To make sure all plugins are installed on the local machine, run fastlane install_plugins Update all plugins To make sure all plugins are updated to the latest version, run fastlane update_plugins Remove a plugin Open your fastlane/Pluginfile and remove the line that looks like this gem "fastlane-plugin-[plugin_name]"'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/plugins/using-plugins"
