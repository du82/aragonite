["https://docs.fastlane.tools/actions/capture_ios_screenshots"]
title = "capture_ios_screenshots - fastlane docs"
full_description = '''capture_ios_screenshots Generate new localized screenshots on multiple devices (via snapshot) Automate taking localized screenshots of your iOS, tvOS, and watchOS apps on every device Check out the new fastlane documentation on how to generate screenshots snapshot generates localized iOS, tvOS, and watchOS screenshots for different device types and languages for the App Store and can be uploaded using (deliver). You have to manually create 20 (languages) x 6 (devices) x 5 (screenshots) = 600 screenshots. It's hard to get everything right! New screenshots with every (design) update No loading indicators Same content / screens Clean Status Bar Uploading screenshots (deliver is your friend) More information about creating perfect screenshots. snapshot runs completely in the background - you can do something else, while your computer takes the screenshots for you. Features • UI Tests • Quick Start • Usage • Tips • How? Features Create hundreds of screenshots in multiple languages on all simulators Take screenshots in multiple device simulators concurrently to cut down execution time (Xcode 9 only) Configure it once, store the configuration in git Do something else, while the computer takes the screenshots for you Integrates with fastlane and deliver Generates a beautiful web page, which shows all screenshots on all devices. This is perfect to send to QA or the marketing team snapshot automatically waits for network requests to be finished before taking a screenshot (we don't want loading images in the App Store screenshots) After snapshot successfully created new screenshots, it will generate a beautiful HTML file to get a quick overview of all screens: Why? This tool automatically switches the language and device type and runs UI Tests for every combination. Why should I automate this process? It takes hours to take screenshots You get a great overview of all your screens, running on all available simulators without the need to manually start it hundreds of times Easy verification for translators (without an iDevice) that translations do make sense in real App context Easy verification that localizations fit into labels on all screen dimensions It is an integration test: You can test for UI elements and other things inside your scripts Be so nice, and provide new screenshots with every App Store update. Your customers deserve it You realize, there is a spelling mistake in one of the screens? Well, just correct it and re-run the script UI Tests Getting started This project uses Apple's newly announced UI Tests. We will not go into detail on how to write scripts. Here a few links to get started: WWDC 2015 Introduction to UI Tests A first look into UI Tests UI Testing in Xcode 7 HSTestingBackchannel : ‘Cheat’ by communicating directly with your app Automating App Store screenshots using fastlane snapshot and frameit Quick Start Create a new UI Test target in your Xcode project (top part of this article) Run fastlane snapshot init in your project folder Add the ./SnapshotHelper.swift to your UI Test target (You can move the file anywhere you want) (Xcode 8 only) add the ./SnapshotHelperXcode8.swift to your UI Test target (Objective C only) add the bridging header to your test class: #import "MYUITests-Swift.h" (The bridging header is named after your test target with -Swift.h appended.) In your UI Test class, click the Record button on the bottom left and record your interaction To take a snapshot, call the following between interactions Swift: snapshot("01LoginScreen") Objective C: [Snapshot snapshot:@"01LoginScreen" timeWaitingForIdle:10]; Add the following code to your setUp() method: Swift: let app = XCUIApplication() setupSnapshot(app) app.launch() Objective C: XCUIApplication *app = [[XCUIApplication alloc] init]; [Snapshot setupSnapshot:app waitForAnimations:NO]; [app launch]; Make sure you only have one launch call in your test class, as Xcode adds one automatically on new test files. You can try the snapshot example project by cloning this repo. To quick start your UI tests, you can use the UI Test recorder. You only have to interact with the simulator, and Xcode will generate the UI Test code for you. You can find the red record button on the bottom of the screen (more information in this blog post) Usage fastlane snapshot Your screenshots will be stored in the ./screenshots/ folder by default (or ./fastlane/screenshots if you're using fastlane) New with Xcode 9, snapshot can run multiple simulators concurrently. This is the default behavior in order to take your screenshots as quickly as possible. This can be disabled to run each device, one at a time, by setting the :concurrent_simulators option to false. Note: While running snapshot with Xcode 9, the simulators will not be visibly spawned. So, while you won't see the simulators running your tests, they will, in fact, be taking your screenshots. If any error occurs while running the snapshot script on a device, that device will not have any screenshots, and snapshot will continue with the next device or language. To stop the flow after the first error, run fastlane snapshot --stop_after_first_error Also by default, snapshot will open the HTML after all is done. This can be skipped with the following command fastlane snapshot --stop_after_first_error --skip_open_summary There are a lot of options available that define how to build your app, for example fastlane snapshot --scheme "UITests" --configuration "Release" --sdk "iphonesimulator" Reinstall the app before running snapshot fastlane snapshot --reinstall_app --app_identifier "tools.fastlane.app" By default snapshot automatically retries running UI Tests if they fail. This is due to randomly failing UI Tests (e.g. #2517). You can adapt this number using fastlane snapshot --number_of_retries 3 Add photos and/or videos to the simulator before running snapshot fastlane snapshot --add_photos MyTestApp/Assets/demo.jpg --add_videos MyTestApp/Assets/demo.mp4 For a list for all available options run fastlane action snapshot After running snapshot you will get a nice summary: Snapfile All of the available options can also be stored in a configuration file called the Snapfile. Since most values will not change often for your project, it is recommended to store them there: First make sure to have a Snapfile (you get it for free when running fastlane snapshot init) The Snapfile can contain all the options that are also available on fastlane action snapshot scheme("UITests") devices([ "iPad (7th generation)", "iPad Air (3rd generation)", "iPad Pro (11-inch)", "iPad Pro (12.9-inch) (3rd generation)", "iPad Pro (9.7-inch)", "iPhone 11", "iPhone 11 Pro", "iPhone 11 Pro Max", "iPhone 8", "iPhone 8 Plus" ]) languages([ "en-US", "de-DE", "es-ES", ["pt", "pt_BR"] # Portuguese with Brazilian locale ]) launch_arguments(["-username Felix"]) # The directory in which the screenshots should be stored output_directory('./screenshots') clear_previous_screenshots(true) override_status_bar(true) add_photos(["MyTestApp/Assets/demo.jpg"]) Completely reset all simulators You can run this command in the terminal to delete and re-create all iOS and tvOS simulators: fastlane snapshot reset_simulators Warning: This will delete all your simulators and replace by new ones! This is useful, if you run into weird problems when running snapshot. You can use the environment variable SNAPSHOT_FORCE_DELETE to stop asking for confirmation before deleting. SNAPSHOT_FORCE_DELETE=1 fastlane snapshot reset_simulators Update snapshot helpers Some updates require the helper files to be updated. snapshot will automatically warn you and tell you how to update. Basically you can run fastlane snapshot update to update your SnapshotHelper.swift files. In case you modified your SnapshotHelper.swift and want to manually update the file, check out SnapshotHelper.swift. Launch Arguments You can provide additional arguments to your app on launch. These strings will be available in your app (e.g. not in the testing target) through ProcessInfo.processInfo.arguments. Alternatively, use user-default syntax (-key value) and they will be available as key-value pairs in UserDefaults.standard. launch_arguments([ "-firstName Felix -lastName Krause" ]) name.text = UserDefaults.standard.string(forKey: "firstName") // name.text = "Felix" snapshot includes -FASTLANE_SNAPSHOT YES, which will set a temporary user default for the key FASTLANE_SNAPSHOT, you may use this to detect when the app is run by snapshot. if UserDefaults.standard.bool(forKey: "FASTLANE_SNAPSHOT") { // runtime check that we are in snapshot mode } Specify multiple argument strings and snapshot will generate screenshots for each combination of arguments, devices, and languages. This is useful for comparing the same screenshots with different feature flags, dynamic text sizes, and different data sets. # Snapfile for A/B Test Comparison launch_arguments([ "-secretFeatureEnabled YES", "-secretFeatureEnabled NO" ]) Xcode Environment Variables snapshot includes FASTLANE_SNAPSHOT=YES and FASTLANE_LANGUAGE=<language> as arguments when executing xcodebuild. This means you may use these environment variables in a custom build phase run script to do any additional configuration. How does it work? The easiest solution would be to just render the UIWindow into a file. That's not possible because UI Tests don't run on a main thread. So snapshot uses a different approach: When you run unit tests in Xcode, the reporter generates a plist file, documenting all events that occurred during the tests (More Information). Additionally, Xcode generates screenshots before, during and after each of these events. There is no way to manually trigger a screenshot event. The screenshots and the plist files are stored in the DerivedData directory, which snapshot stores in a temporary folder. When the user calls snapshot(...) in the UI Tests (Swift or Objective C) the script actually does a rotation to .Unknown which doesn't have any effect on the actual app, but is enough to trigger a screenshot. It has no effect to the application and is not something you would do in your tests. The goal was to find some event that a user would never trigger, so that we know it's from snapshot. On tvOS, there is no orientation so we ask for a count of app views with type "Browser" (which should never exist on tvOS). snapshot then iterates through all test events and check where we either did this weird rotation (on iOS) or searched for browsers (on tvOS). Once snapshot has all events triggered by snapshot it collects a ordered list of all the file names of the actual screenshots of the application. In the test output, the Swift snapshot function will print out something like this snapshot: [some random text here] snapshot finds all these entries using a regex. The number of snapshot outputs in the terminal and the number of snapshot events in the plist file should be the same. Knowing that, snapshot automatically matches these 2 lists to identify the name of each of these screenshots. They are then copied over to the output directory and separated by language and device. 2 thing have to be passed on from snapshot to the xcodebuild command line tool: The device type is passed via the destination parameter of the xcodebuild parameter The language is passed via a temporary file which is written by snapshot before running the tests and read by the UI Tests when launching the application If you find a better way to do any of this, please submit an issue on GitHub or even a pull request :+1: Radar 23062925 has been resolved with Xcode 8.3, so it's now possible to actually take screenshots from the simulator. We'll keep using the old approach for now, since many of you still want to use older versions of Xcode. Tips Check out the new fastlane documentation on how to generate screenshots Frame the screenshots If you want to add frames around the screenshots and even put a title on top, check out frameit. Available language codes ALL_LANGUAGES = ["da", "de-DE", "el", "en-AU", "en-CA", "en-GB", "en-US", "es-ES", "es-MX", "fi", "fr-CA", "fr-FR", "id", "it", "ja", "ko", "ms", "nl-NL", "no", "pt-BR", "pt-PT", "ru", "sv", "th", "tr", "vi", "zh-Hans", "zh-Hant"] To get more information about language and locale codes please read Internationalization and Localization Guide. Use a clean status bar You can set override_status_bar to true to set the status bar to Tuesday January 9th at 9:41AM with full battery and reception. If you need more granular customization, to set a Carrier name for example, also set override_status_bar_arguments to the specific arguments to be passed to the xcrun simctl status_bar override command. Run xcrun simctl status_bar --help to see the options available. Editing the Snapfile Change syntax highlighting to Ruby. Simulator doesn't launch the application When the app dies directly after the application is launched there might be 2 problems The simulator is somehow in a broken state and you need to re-create it. You can use snapshot reset_simulators to reset all simulators (this will remove all installed apps) A restart helps very often Determine language To detect the currently used localization in your tests, access the deviceLanguage variable from SnapshotHelper.swift. Speed up snapshots A lot of time in UI tests is spent waiting for animations. You can disable UIView animations in your app to make the tests faster: if ProcessInfo().arguments.contains("SKIP_ANIMATIONS") { UIView.setAnimationsEnabled(false) } This requires you to pass the launch argument like so: snapshot(launch_arguments: ["SKIP_ANIMATIONS"]) By default, snapshot will wait for a short time for the animations to finish. If you're skipping the animations, this wait time is unnecessary and can be skipped: setupSnapshot(app, waitForAnimations: false) capture_ios_screenshots Supported platforms ios, mac Author @KrauseFx 3 Examples capture_ios_screenshots snapshot # alias for "capture_ios_screenshots" capture_ios_screenshots( skip_open_summary: true, clean: true ) Parameters Key Description Default workspace Path to the workspace file project Path to the project file xcargs Pass additional arguments to xcodebuild for the test phase. Be sure to quote the setting names and values e.g. OTHER_LDFLAGS="-ObjC -lstdc++" xcconfig Use an extra XCCONFIG file to build your app devices A list of devices you want to take the screenshots from languages A list of languages which should be used ["en-US"] launch_arguments A list of launch arguments which should be used [""] output_directory The directory where to store the screenshots * output_simulator_logs If the logs generated by the app (e.g. using NSLog, perror, etc.) in the Simulator should be written to the output_directory false ios_version By default, the latest version should be used automatically. If you want to change it, do it here skip_open_summary Don't open the HTML summary after running snapshot false skip_helper_version_check Do not'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/actions/capture_ios_screenshots"
