["https://docs.fastlane.tools/actions/automatic_code_signing"]
title = "automatic_code_signing - fastlane docs"
full_description = '''automatic_code_signing Configures Xcode's Codesigning options Please use update_code_signing_settings action instead. Configures Xcode's Codesigning options of all targets in the project automatic_code_signing Supported platforms ios, mac Author @mathiasAichinger, @hjanuschka, @p4checo, @portellaa, @aeons Returns The current status (boolean) of codesigning after modification 8 Examples # enable automatic code signing enable_automatic_code_signing enable_automatic_code_signing( path: "demo-project/demo/demo.xcodeproj" ) # disable automatic code signing disable_automatic_code_signing disable_automatic_code_signing( path: "demo-project/demo/demo.xcodeproj" ) # also set team id disable_automatic_code_signing( path: "demo-project/demo/demo.xcodeproj", team_id: "XXXX" ) # Only specific targets disable_automatic_code_signing( path: "demo-project/demo/demo.xcodeproj", use_automatic_signing: false, targets: ["demo"] ) # via generic action automatic_code_signing( path: "demo-project/demo/demo.xcodeproj", use_automatic_signing: false ) automatic_code_signing( path: "demo-project/demo/demo.xcodeproj", use_automatic_signing: true ) Parameters Key Description Default path Path to your Xcode project * use_automatic_signing Defines if project should use automatic signing false team_id Team ID, is used when upgrading project targets Specify targets you want to toggle the signing mech. (default to all targets) code_sign_identity Code signing identity type (iPhone Developer, iPhone Distribution) profile_name Provisioning profile name to use for code signing profile_uuid Provisioning profile UUID to use for code signing bundle_identifier Application Product Bundle Identifier * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action automatic_code_signing CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run automatic_code_signing To pass parameters, make use of the : symbol, for example fastlane run automatic_code_signing parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/actions/automatic_code_signing"
