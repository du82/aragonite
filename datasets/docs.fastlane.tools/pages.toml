["https://docs.fastlane.tools/actions/adb_devices"]
title = "adb_devices - fastlane docs"
full_description = '''adb_devices Get an array of Connected android device serials Fetches device list via adb, e.g. run an adb command on all connected devices. adb_devices Supported platforms android Author @hjanuschka Returns Returns an array of all currently connected android devices 1 Example adb_devices.each do |device| model = adb(command: "shell getprop ro.product.model", serial: device.serial).strip puts "Model #{model} is connected" end Parameters Key Description Default adb_path The path to your adb binary (can be left blank if the ANDROID_SDK_ROOT environment variable is set) adb * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action adb_devices CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run adb_devices To pass parameters, make use of the : symbol, for example fastlane run adb_devices parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
author = "fastlane team"
year_published = 2025
