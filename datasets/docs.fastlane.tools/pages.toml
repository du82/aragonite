["https://docs.fastlane.tools/actions/artifactory"]
title = "artifactory - fastlane docs"
full_description = '''artifactory This action uploads an artifact to artifactory Connect to the artifactory server using either a username/password or an api_key artifactory Supported platforms ios, android, mac Author @koglinjg, @tommeier 2 Examples artifactory( username: "username", password: "password", endpoint: "https://artifactory.example.com/artifactory/", file: "example.ipa", # File to upload repo: "mobile_artifacts", # Artifactory repo repo_path: "/ios/appname/example-major.minor.ipa" # Path to place the artifact including its filename ) artifactory( api_key: "api_key", endpoint: "https://artifactory.example.com/artifactory/", file: "example.ipa", # File to upload repo: "mobile_artifacts", # Artifactory repo repo_path: "/ios/appname/example-major.minor.ipa" # Path to place the artifact including its filename ) Parameters Key Description Default file File to be uploaded to artifactory repo Artifactory repo to put the file in repo_path Path to deploy within the repo, including filename endpoint Artifactory endpoint username Artifactory username password Artifactory password api_key Artifactory API key properties Artifact properties hash {} ssl_pem_file Location of pem file to use for ssl verification ssl_verify Verify SSL true proxy_username Proxy username proxy_password Proxy password proxy_address Proxy address proxy_port Proxy port read_timeout Read timeout * = default value is dependent on the user's system Lane Variables Actions can communicate with each other using a shared hash lane_context, that can be accessed in other actions, plugins or your lanes: lane_context[SharedValues:XYZ]. The artifactory action generates the following Lane Variables: SharedValue Description SharedValues::ARTIFACTORY_DOWNLOAD_URL The download url for file uploaded SharedValues::ARTIFACTORY_DOWNLOAD_SIZE The reported file size for file uploaded To get more information check the Lanes documentation. Documentation To show the documentation in your terminal, run fastlane action artifactory CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run artifactory To pass parameters, make use of the : symbol, for example fastlane run artifactory parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
