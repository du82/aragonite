["https://docs.fastlane.tools/actions/add_extra_platforms"]
title = "add_extra_platforms - fastlane docs"
full_description = '''add_extra_platforms Modify the default list of supported platforms add_extra_platforms Supported platforms ios, android, mac Author @lacostej 1 Example add_extra_platforms( platforms: [:windows, :neogeo] ) Parameters Key Description Default platforms The optional extra platforms to support '' * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action add_extra_platforms CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run add_extra_platforms To pass parameters, make use of the : symbol, for example fastlane run add_extra_platforms parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
