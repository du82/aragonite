["https://docs.fastlane.tools/actions/clean_build_artifacts"]
title = "clean_build_artifacts - fastlane docs"
full_description = '''clean_build_artifacts Deletes files created as result of running gym, cert, sigh or download_dsyms This action deletes the files that get created in your repo as a result of running the gym and sigh commands. It doesn't delete the fastlane/report.xml though, this is probably more suited for the .gitignore.Useful if you quickly want to send out a test build by dropping down to the command line and typing something like fastlane beta, without leaving your repo in a messy state afterwards. clean_build_artifacts Supported platforms ios, mac Author @lmirosevic 1 Example clean_build_artifacts Parameters Key Description Default exclude_pattern Exclude all files from clearing that match the given Regex pattern: e.g. '.*.mobileprovision' * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action clean_build_artifacts CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run clean_build_artifacts To pass parameters, make use of the : symbol, for example fastlane run clean_build_artifacts parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
