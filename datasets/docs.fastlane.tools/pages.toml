["https://docs.fastlane.tools/actions/create_app_on_managed_play_store"]
title = "create_app_on_managed_play_store - fastlane docs"
full_description = '''create_app_on_managed_play_store Create Managed Google Play Apps Create new apps on Managed Google Play. create_app_on_managed_play_store Supported platforms android Author @janpio 1 Example create_app_on_managed_play_store( json_key: 'path/to/you/json/key/file', developer_account_id: 'developer_account_id', # obtained using the `get_managed_play_store_publishing_rights` action (or looking at the Play Console url) app_title: 'Your app title', language: 'en_US', # primary app language in BCP 47 format apk: '/files/app-release.apk' ) Parameters Key Description Default json_key The path to a file containing service account JSON, used to authenticate with Google * json_key_data The raw service account JSON data used to authenticate with Google * developer_account_id The ID of your Google Play Console account. Can be obtained from the URL when you log in (https://play.google.com/apps/publish/?account=... or when you 'Obtain private app publishing rights' (https://developers.google.com/android/work/play/custom-app-api/get-started#retrieve_the_developer_account_id) * apk Path to the APK file to upload * app_title App Title language Default app language (e.g. 'en_US') en_US root_url Root URL for the Google Play API. The provided URL will be used for API calls in place of https://www.googleapis.com/ timeout Timeout for read, open, and send (in seconds) 300 * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action create_app_on_managed_play_store CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run create_app_on_managed_play_store To pass parameters, make use of the : symbol, for example fastlane run create_app_on_managed_play_store parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/actions/create_app_on_managed_play_store"
