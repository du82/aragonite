["https://docs.fastlane.tools/actions/copy_artifacts"]
title = "copy_artifacts - fastlane docs"
full_description = '''copy_artifacts Copy and save your build artifacts (useful when you use reset_git_repo) This action copies artifacts to a target directory. It's useful if you have a CI that will pick up these artifacts and attach them to the build. Useful e.g. for storing your .ipas, .dSYM.zips, .mobileprovisions, .certs.Make sure your :target_path is ignored from git, and if you use reset_git_repo, make sure the artifacts are added to the exclude list. copy_artifacts Supported platforms ios, android, mac Author @lmirosevic 2 Examples copy_artifacts( target_path: "artifacts", artifacts: ["*.cer", "*.mobileprovision", "*.ipa", "*.dSYM.zip", "path/to/file.txt", "another/path/*.extension"] ) # Reset the git repo to a clean state, but leave our artifacts in place reset_git_repo( exclude: "artifacts" ) # Copy the .ipa created by _gym_ if it was successfully created artifacts = [] artifacts << lane_context[SharedValues::IPA_OUTPUT_PATH] if lane_context[SharedValues::IPA_OUTPUT_PATH] copy_artifacts( artifacts: artifacts ) Parameters Key Description Default keep_original Set this to false if you want move, rather than copy, the found artifacts true target_path The directory in which you want your artifacts placed artifacts artifacts An array of file patterns of the files/folders you want to preserve [] fail_on_missing Fail when a source file isn't found false * = default value is dependent on the user's system Documentation To show the documentation in your terminal, run fastlane action copy_artifacts CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run copy_artifacts To pass parameters, make use of the : symbol, for example fastlane run copy_artifacts parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/actions/copy_artifacts"
tags = ["actions", "code", "documentation", "examples", "parameters", "source"]
