full_description = ".fastlane-setup { border-left: .4rem solid #00b0ff; border-bottom: .1rem solid rgba(0,176,255,.1); background-color: rgba(0,176,255,.1); padding: 15px; margin-bottom: 20px; font-weight: 200; } .fastlane-setup-wrapper { background-color: rgba(0,176,255,.05); } .fastlane-setup-wrapper[open] { padding-bottom: 1px; } .fastlane-setup-header { font-size: 20px; font-weight: 500; } .fastlane-setup-more-details { font-size: 18px; font-weight: 350; } New to fastlane? Click here to open the installation & setup instructions first 1) Install the latest Xcode command line tools xcode-select --install 2) Install fastlane # Using RubyGems sudo gem install fastlane -NV # Alternatively using Homebrew brew install fastlane 3) Navigate to your project and run fastlane init More Details fastlane actions This page contains a list of all built-in fastlane actions and their available options. To get the most up-to-date information from the command line on your current version you can also run fastlane actions # list all available fastlane actions fastlane action [action_name] # more information for a specific action You can import another Fastfile by using the import action. This is useful if you have shared lanes across multiple apps and you want to store a Fastfile in a separate folder. The path must be relative to the Fastfile this is called from. import './path/to/other/Fastfile' For fastlane plugins, check out the available plugins page. If you want to create your own action, check out the local actions page. Testing Building Screenshots Project Code Signing Documentation Beta Push Releasing your app Source Control Notifications App Store Connect Misc Deprecated Plugins Testing Action Description Supported Platforms scan Alias for the run_tests action ios, mac trainer Convert the Xcode plist log to a JUnit report ios, mac slather Use slather to generate a code coverage report ios, mac swiftlint Run swift code validation using SwiftLint ios, mac xcov Nice code cove