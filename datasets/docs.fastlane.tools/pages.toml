["https://docs.fastlane.tools/advanced/fastlane"]
title = "fastlane - fastlane docs"
full_description = '''.fastlane-setup { border-left: .4rem solid #00b0ff; border-bottom: .1rem solid rgba(0,176,255,.1); background-color: rgba(0,176,255,.1); padding: 15px; margin-bottom: 20px; font-weight: 200; } .fastlane-setup-wrapper { background-color: rgba(0,176,255,.05); } .fastlane-setup-wrapper[open] { padding-bottom: 1px; } .fastlane-setup-header { font-size: 20px; font-weight: 500; } .fastlane-setup-more-details { font-size: 18px; font-weight: 350; } New to fastlane? Click here to open the installation & setup instructions first 1) Install the latest Xcode command line tools xcode-select --install 2) Install fastlane # Using RubyGems sudo gem install fastlane -NV # Alternatively using Homebrew brew install fastlane 3) Navigate to your project and run fastlane init More Details fastlane Configuring fastlane Skip update check when launching fastlane You can set the environment variable FASTLANE_SKIP_UPDATE_CHECK to skip the update check. Hide changelog information at the end of running fastlane You can set the environment variable FASTLANE_HIDE_CHANGELOG to hide the detailed changelog information when new fastlane versions are available. Output environment variables To hide timestamps in each row, set the FASTLANE_HIDE_TIMESTAMP environment variable to true (overruled by --verbose). To output the timezone in the timestamp, set the FASTLANE_SHOW_TIMEZONE environment variable to true. To disable output formatting, set the FASTLANE_DISABLE_OUTPUT_FORMAT environment variable to true. To disable warnings about startup time and Gemfile usage, set the SKIP_SLOW_FASTLANE_WARNING environment variable to true. To disable the plugins summary table printed at the beginning, set the FASTLANE_HIDE_PLUGINS_TABLE environment variable to true. To disable action summary table output, set the FASTLANE_SKIP_ACTION_SUMMARY environment variable to true. How fastlane works Priorities of parameters and options The order in which fastlane tools take their values from CLI parameter (e.g. gym --scheme Example) or Fastfile (e.g. gym(scheme: 'Example')) Environment variable (e.g. GYM_SCHEME) Tool specific config file (e.g. Gymfile containing scheme 'Example') Default value (which might be taken from the Appfile, e.g. app_identifier from the Appfile) If this value is required, you'll be asked for it (e.g. you have multiple schemes, you'll be asked for it) Directory behavior fastlane was designed in a way that you can run fastlane from both the root directory of the project, and from the ./fastlane sub-folder. Take this example Fastfile on the path fastlane/Fastfile sh "pwd" # => "[root]/fastlane" puts Dir.pwd # => "[root]/fastlane" lane :something do sh "pwd" # => "[root]/fastlane" puts Dir.pwd # => "[root]/fastlane" my_action end The implementation of my_action looks like this: def run(params) puts Dir.pwd # => "[root]" end Notice how every action and every plugin's code runs in the root of the project, while all user code from the Fastfile runs inside the ./fastlane directory. This is important to consider when migrating existing code from your Fastfile into your own action or plugin. To change the directory manually you can use standard Ruby blocks: Dir.chdir("..") do # code here runs in the parent directory end This behavior isn't great, and has been like this since the very early days of fastlane. As much as we'd like to change it, there is no good way to do so, without breaking thousands of production setups, so we decided to keep it as is for now. Passing parameters to fastlane command line tools fastlane contains several command line tools, e.g. fastlane deliver or fastlane snapshot. To pass parameters to these tools, append the option names and values as you would for a normal shell command: fastlane [tool] --[option]=[value] fastlane deliver --skip_screenshots=true fastlane snapshot --screenshots_path=xxxxx --schema=xxxx'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/advanced/fastlane"
