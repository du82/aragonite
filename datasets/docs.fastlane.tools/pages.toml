["https://docs.fastlane.tools/best-practices/continuous-integration/github"]
title = "GitHub Actions - fastlane docs"
full_description = '''GitHub Actions Integration Use GitHub Actions runner running on a macOS machine to build using fastlane. Repository setup First create a Gemfile in the root of your project with the following content: source 'https://rubygems.org' gem 'fastlane' Add a workflow yaml file to your repository. For example, if naming your workflow "build-ios-app", add .github/workflows/build-ios-app.yml with the following content: name: build-ios-app on: push: branches: - 'master' jobs: build: runs-on: macos-latest steps: - uses: actions/checkout@v2 - run: fastlane beta env: MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }} See Workflow syntax for GitHub Actions for more information on how this file works. Setting up the lanes Here's an example of a Fastfile with a lane that runs match, builds the app, and uploads to TestFlight: platform :ios do lane :beta do setup_ci if ENV['CI'] match(type: 'appstore') build_app upload_to_testflight(skip_waiting_for_build_processing: true) end end Note the usage of setup_ci: it creates a temporary keychain. Without this, the build could freeze and never finish.'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/best-practices/continuous-integration/github"
tags = ["actions", "github", "integration", "lanes", "repository", "setting", "setup"]
language = "en"
internal-references = ["none"]
external-references = ["app.gitbook.com", "appetize.io", "appstoreconnect.apple.com", "apteligent.com", "bitrise.io", "codemagic.io", "codesigning.guide", "devcenter.bitrise.io", "developer.apple.com", "docs.appcircle.io", "docs.codemagic.io", "flock.com", "go.chatwork.com", "installrapp.com", "jsonapi.org", "marketplace.visualstudio.com", "onesignal.com", "rubygems.org", "slack.com", "twitter.com"]

["https://docs.fastlane.tools/actions/create_keychain"]
title = "create_keychain - fastlane docs"
full_description = '''create_keychain Create a new Keychain create_keychain Supported platforms ios, android, mac Author @gin0606 1 Example create_keychain( name: "KeychainName", default_keychain: true, unlock: true, timeout: 3600, lock_when_sleeps: true ) Parameters Key Description Default name Keychain name path Path to keychain password Password for the keychain default_keychain Should the newly created Keychain be the new system default keychain false unlock Unlock keychain after create false timeout timeout interval in seconds. Set 0 if you want to specify "no time-out" 300 lock_when_sleeps Lock keychain when the system sleeps false lock_after_timeout Lock keychain after timeout interval false add_to_search_list Add keychain to search list true require_create Fail the action if the Keychain already exists false * = default value is dependent on the user's system Lane Variables Actions can communicate with each other using a shared hash lane_context, that can be accessed in other actions, plugins or your lanes: lane_context[SharedValues:XYZ]. The create_keychain action generates the following Lane Variables: SharedValue Description SharedValues::ORIGINAL_DEFAULT_KEYCHAIN The path to the default keychain SharedValues::KEYCHAIN_PATH The path of the keychain To get more information check the Lanes documentation. Documentation To show the documentation in your terminal, run fastlane action create_keychain CLI It is recommended to add the above action into your Fastfile, however sometimes you might want to run one-offs. To do so, you can run the following command from your terminal fastlane run create_keychain To pass parameters, make use of the : symbol, for example fastlane run create_keychain parameter1:"value1" parameter2:"value2" It's important to note that the CLI supports primitive types like integers, floats, booleans, and strings. Arrays can be passed as a comma delimited string (e.g. param:"1,2,3"). Hashes are not currently supported. It is recommended to add all fastlane actions you use to your Fastfile. Source code This action, just like the rest of fastlane, is fully open source, view the source code on GitHub Back to actions'''
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/actions/create_keychain"
