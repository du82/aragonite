["https://docs.fastlane.tools/best-practices/continuous-integration/travis"]
title = "Travis - fastlane docs"
full_description = "Travis Integration Update your .travis.yml to look like this: os: osx language: objective-c osx_image: xcode8.3 install: - bundle install script: - fastlane beta The above config files assume you have a Gemfile set up, if you don't have one yet, make sure to follow our Gemfile guide and run bundle update to make sure you're using the most recent fastlane release. Replace beta with the lane you want to run for your setup. If you want to build, sign and distribute builds from Travis, you'll need to add one more action to your Fastfile, as by default, the Travis keychain is locked. At the top of your Fastfile, add setup_travis which will setup the keychain to work well with match and gym. This action will also enable the readonly mode for match, so your CI doesn't create new certificates or provisioning profiles."
author = "fastlane team"
year_published = 2025
clearnet = "https://docs.fastlane.tools/best-practices/continuous-integration/travis"
