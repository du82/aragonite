ers of potential security risks.HoneytokenGenerate decoy secrets at scale, monitor for unauthorized use, and boost DevOps pipeline security against supply chain attacks.ConfigurationManage your workspaceCreate and manage usersManage GitGuardian users and roles for effective collaboration. Add and remove users, assign roles and permissions, and manage access control policies.Create and manage teamsManage teams for seamless collaboration and sharing of secrets incidents. Create teams, add or remove teammates, and assign permissions.Set incident permissionsLearn about incident permissions and sharing. Assign incident permissions, share incidents internally via 'grant access', and externally via 'public share link'. [links-listing-column]:nth-child(n + 4) [links-listing-column__tagline]{ margin-top: 48px; } Enterprise administrationConfigure SAML SSOManage email domainAudit logTransfer workspace ownershipManage your accountAccount settingsPlan and usageConfigure email preferencesGitGuardian API, CLI & SDKDashboardGitGuardian APIGitGuardian CLI (ggshield)Python SDKSecurity & Data privacyData retentionPrivacy modeWas this page helpful?Last updated on Jan 30, 2025'''
