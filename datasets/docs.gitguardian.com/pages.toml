["https://docs.gitguardian.com/api-docs/service-accounts"]
title = "Service accounts | GitGuardian documentation"
full_description = "Service accountsOn this pageService accountsPrelude​ A Service account is a special type of API key intended to represent a non-human user that needs to authenticate and be authorized for scenarios such as secrets scanning in CI pipelines or batch processing open incidents. Please note that service accounts are only available for workspaces under our Business plan. Creating a service account​ Only workspace Managers are allowed to manage service accounts. Go to the Service accounts page in the API section of your workspace. Click on Create service account. Name your service account according to its use-case (for example <Service Name>-<Environment>) Set an expiry date for your token (in 1 week, 1 month, 6 months, 1 year, or never). If an expiry date is set, all the Managers of the workspace will receive an email notification 5 days before expiration. Choose one or several scopes for your service account. Click on Create service account Make sure you copy the service account, it will no longer be visible to you in the future. The service accounts of your workspace are visible and can be managed here by workspace Managers of workspaces under our Business plan. Was this page helpful?Last updated on Jan 21, 2025"
year_published = 2025
