["https://docs.gitguardian.com/ggshield-docs/integrations/overview"]
title = "Overview | GitGuardian documentation"
description = "GitGuardian specializes in detecting secrets within source code, yet we also plan to expand to monitoring other sources"
full_description = "IntegrationsOverviewOn this pageOverviewGitGuardian specializes in detecting secrets within source code, yet we also plan to expand to monitoring other sources such as messaging systems, project management boards, wikis, etc. CI/CD integrations: secrets detection in your CI/CD workflow.​ GitGuardian integrates with the most common CI tools via our CLI application: ggshield. GitGuardian currently supports: Azure pipelines Bitbucket pipelines Circle CI Drone CI GitHub Actions GitLab pipelines Jenkins CI Travis CI Git hooks: prevent secrets from reaching your VCS.​ GitGuardian's CLI application, ggshield enables you to integrate secrets detection in git workflow and shift left your security. GitGuardian currently supports the following hooks: pre-commit pre-push pre-receive Docker​ GitGuardian's CLI application, ggshield enables you to scan Docker images. Monitoring other sources​ GitGuardian intends to progressively support more data sources for secrets scanning in the future. Since version 1.14.1, ggshield supports a new docset input format. Refer to the corresponding documentation for more details. If GitGuardian does not yet support one of the sources you would like to monitor, you can build your own integration by leveraging our public API for secrets detection. Troubleshooting connectivity problems​ In case you experience connectivity problems with your GitGuardian instance, please refer to this section of GitGuardian internal monitoring documentation.Was this page helpful?Last updated on Jan 21, 2025"
