["https://docs.kdab.com/kddockwidgets/1.1"]
title = "KDDockWidgets API Documentation: KDDockWidgets"
full_description = '''KDDockWidgets is a Qt dock widget library written by KDAB, suitable for replacing QDockWidget and implementing advanced functionalities missing in Qt. Although KDDockWidgets is ready to be used out of the box, it can also be seen as a framework to allow building very tailored custom docking systems. It tries to expose every internal widget and every knob for the app developer to tune. Throughout the years KDAB contributed and funded bug fixes and features to QDockWidget. Sadly, this was very painful. Each bug fix or feature took many days of implementation, and an equal number of days just to fix dozens of regressions. QDockWidget mixes GUI code with logic with state, making it very hard to move forward with new features. Furthermore, our customers were getting more creative with their requests, so it was clear we needed a better docking framework. A full demo lives in examples/dockwidgets/, it showcasts most of the features. A simpler example lives in examples/minimal/, which might be more indicated to learn the API, as it's less overwelming than the full demo. Open a terminal capable of building Qt5 applications. Make sure you have cmake, ninja, compiler, Qt, etc in PATH. Adapt the instructions to suit your cmake generator and operating system. Build and install the KDDockWidgets framework: The installation directory defaults to c:\KDAB\KDDockWidgets-<version> on Windows and /usr/local/KDAB/KDDockWidgets-<version> on non-Windows. You can change this location by passing the option -DCMAKE_INSTALL_PREFIX=/install/path to cmake. Make sure you have pyside2, shiboken2 and shiboken2-generator installed. As this time, you cannot get shiboken2-generator because the wheels are not on PyPi. To use the wheels do this: % pip3 install \ –index-url=http://download.qt.io/official_releases/QtForPython/ \ –trusted-host download.qt.io \ shiboken2 pyside2 shiboken2_generator The bindings will be installed to the passed -DCMAKE_INSTALL_PREFIX, which might require setting the PYTHONPATH env variable to point to that path when running applications. Alternatively, configure the bindings install location by passing -DKDDockWidgets_PYTHON_BINDINGS_INSTALL_PREFIX=/usr/lib/python3.8/site-packages to CMake (adjust to the python path on your system).'''
year_published = 2025
clearnet = "https://docs.kdab.com/kddockwidgets/1.1"
