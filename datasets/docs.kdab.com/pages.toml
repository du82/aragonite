["https://docs.kdab.com/kddockwidgets/1.4"]
title = "KDDockWidgets API Documentation: Main Page"
full_description = '''KDDockWidgets is a Qt dock widget library written by KDAB, suitable for replacing QDockWidget and implementing advanced functionalities missing in Qt. Although KDDockWidgets is ready to be used out of the box, it can also be seen as a framework to allow building very tailored custom docking systems. It tries to expose every internal widget and every knob for the app developer to tune. Throughout the years KDAB contributed and funded bug fixes and features to QDockWidget. Sadly, this was very painful. Each bug fix or feature took many days of implementation, and an equal number of days just to fix dozens of regressions. QDockWidget mixes GUI code with logic with state, making it very hard to move forward with new features. Furthermore, our customers were getting more creative with their requests, so it was clear we needed a better docking framework. We also have an in browser demo. Note however that this demo isn't fully featured, as it's running on Qt for WebAssembly. A simpler example can be found in examples/minimal, which might be more indicated to learn the API, as it's less overwhelming than the full demo. Open a terminal capable of building Qt5 applications. Make sure you have cmake, ninja, compiler, Qt, etc in PATH. Adapt the instructions to suit your cmake generator and operating system. Build and install the KDDockWidgets framework: The installation directory defaults to c:\KDAB\KDDockWidgets-<version> on Windows and /usr/local/KDAB/KDDockWidgets-<version> on non-Windows. You can change the installation location by passing the option -DCMAKE_INSTALL_PREFIX=/install/path to cmake. and link to the imported target KDAB::kddockwidgets. That's all you need to do (the imported target also brings in the include directories) You may also need to modify the CMAKE_PREFIX_PATH environment variable depending on where you installed KDDockWidgets. We'll try to remain source-compatible across versions. API will get a deprecation notice before being removed in the next version. Note that this source-compatibility effort is only for the public API. Private API (headers ending in _p.h) might change so you shouldn't depend on them. Private API is only exposed so more advanced users can override, for example paintEvent(), and not so they can change internal business logic.'''
year_published = 2025
