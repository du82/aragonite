["https://docs.kdab.com/kddockwidgets/1.6.0"]
title = "KDDockWidgets API Documentation: KDDockWidgets"
full_description = '''⚠️⚠️: If you're using QtQuick/QML it's recommended to use 2.0 branch. 1.x will continue to receive bug fixes for a long time but only for QtWidgets frontend. KDDockWidgets is a Qt dock widget library written by KDAB, suitable for replacing QDockWidget and implementing advanced functionalities missing in Qt. Although KDDockWidgets is ready to be used out of the box, it can also be seen as a framework to allow building very tailored custom docking systems. It tries to expose every internal widget and every knob for the app developer to tune. Throughout the years KDAB contributed and funded bug fixes and features to QDockWidget. Sadly, this was very painful. Each bug fix or feature took many days of implementation, and an equal number of days just to fix dozens of regressions. QDockWidget mixes GUI code with logic with state, making it very hard to move forward with new features. Furthermore, our customers were getting more creative with their requests, so it was clear we needed a better docking framework. We also have an in browser demo. Note however that this demo isn't fully featured, as it's running on Qt for WebAssembly. Open a terminal capable of building Qt applications. Make sure you have cmake, ninja, compiler, Qt, etc in PATH. The installation directory defaults to c:\KDAB\KDDockWidgets-<version> on Windows and /usr/local/KDAB/KDDockWidgets-<version> on non-Windows. Change the installation location by passing the option -DCMAKE_INSTALL_PREFIX=/install/path to CMake. A simpler example can be found in examples/minimal, which might be more indicated to learn the API, as it's less overwhelming than the full demo. and link to the imported target KDAB::kddockwidgets. That's all you need to do (the imported target also brings in the include directories) You may also need to modify the CMAKE_PREFIX_PATH environment variable depending on where you installed KDDockWidgets. There's currently two lines of development: v1 which is very mature and stable and v2 which is an ongoing effort to make KDDW support multiple "frontends" (QtWidgets, QtQuick and even non-Qt technologies, like flutter).'''
