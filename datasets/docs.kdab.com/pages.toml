title = "KD Chart API Documentation: KD Chart API Documentation"
full_description = "KD Chart is a tool for creating business and scientific charts. It provides developers with a sophisticated way to customize layouts and to design and manage large numbers of axes. Since all configuration settings have practical defaults, you can usually get by with tweaking just a few parameters and then relying on the defaults for the rest. KD Chart requires Qt5.15.0 or newer, and a compiler with C++11 support. Qt6 support is added starting with KD Chart version 3.0, and requires a compiler with C++17 support. After reading the introductory overview files in docs/ you will find more information at these places: Please submit your contributions or issue reports to our GitHub space at https://github.com/KDAB/KDChart. The KD Chart Software is © Klarälvdalens Datakonsult AB (KDAB), and is available under the terms of the MIT license. The KDAB Group is the global No.1 software consultancy for Qt, C++ and OpenGL applications across desktop, embedded and mobile platforms. The KDAB Group provides consulting and mentoring for developing Qt applications from scratch and in porting from all popular and legacy frameworks to Qt. We continue to help develop parts of Qt and are one of the major contributors to the Qt Project. We can give advanced or standard trainings anywhere around the globe on Qt as well as C++, OpenGL, 3D and more. KD CHART and the KD CHART logo are registered trademarks of Klaralvdalens Datakonsult AB in the European Union, the United States, and/or other countries. Other product and company names and logos may be trademarks or registered trademarks of their respective companies."
