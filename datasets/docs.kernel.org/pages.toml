["https://docs.kernel.org/admin-guide/reporting-issues.html"]
title = "Reporting issues — The Linux Kernel  documentation"
full_description = "English Chinese (Simplified) Chinese (Traditional) Reporting issues¶ The short guide (aka TL;DR)¶ Are you facing a regression with vanilla kernels from the same stable or longterm series? One still supported? Then search the LKML and the Linux stable mailing list archives for matching reports to join. If you don’t find any, install the latest release from that series. If it still shows the issue, report it to the stable mailing list (stable@vger.kernel.org) and CC the regressions list (regressions@lists.linux.dev); ideally also CC the maintainer and the mailing list for the subsystem in question. In all other cases try your best guess which kernel part might be causing the issue. Check the MAINTAINERS file for how its developers expect to be told about problems, which most of the time will be by email with a mailing list in CC. Check the destination’s archives for matching reports; search the LKML and the web, too. If you don’t find any to join, install the latest mainline kernel. If the issue is present there, send a report. The issue was fixed there, but you would like to see it resolved in a still supported stable or longterm series as well? Then install its latest release. If it shows the problem, search for the change that fixed it in mainline and check if backporting is in the works or was discarded; if it’s neither, ask those who handled the change for it. General remarks: When installing and testing a kernel as outlined above, ensure it’s vanilla (IOW: not patched and not using add-on modules). Also make sure it’s built and running in a healthy environment and not already tainted before the issue occurs. If you are facing multiple issues with the Linux kernel at once, report each separately. While writing your report, include all information relevant to the issue, like the kernel and the distro used. In case of a regression, CC the regressions mailing list (regressions@lists.linux.dev) to your report. Also try to pin-point the culprit with a bisection; if you succeed, include its commit-id and CC everyone in the sign-off-by chain. Once the report is out, answer any questions that come up and help where you can. That includes keeping the ball rolling by occasionally retesting with newer releases and sending a status update afterwards. Step-by-step guide how to report issues to the kernel maintainers¶ The above TL;DR outlines roughly how to report issues to the Linux kernel developers. It might be all that’s needed for people already familiar with reporting issues to Free/Libre & Open Source Software (FLOSS) projects. For everyone else there is this section. It is more detailed and uses a step-by-step approach. It still tries to be brief for readability and leaves out a lot of details; those are described below the step-by-step guide in a reference section, which explains each of the steps in more detail. Note: this section covers a few more aspects than the TL;DR and does things in a slightly different order. That’s in your interest, to make sure you notice early if an issue that looks like a Linux kernel problem is actually caused by something else. These steps thus help to ensure the time you invest in this process won’t feel wasted in the end: Are you facing an issue with a Linux kernel a hardware or software vendor provided? Then in almost all cases you are better off to stop reading this document and reporting the issue to your vendor instead, unless you are willing to install the latest Linux version yourself. Be aware the latter will often be needed anyway to hunt down and fix issues. Perform a rough search for existing reports with your favorite internet search engine; additionally, check the archives of the Linux Kernel Mailing List (LKML). If you find matching reports, join the discussion instead of sending a new one. See if the issue you are dealing with qualifies as regression, security issue, or a really severe problem: those are ‘issues of high priority’ that need special handling in some steps that are about to follow. Make sure it’s not the kernel’s surroundings that are causing the issue you face. Create a fresh backup and put system repair and restore tools at hand. Ensure your system does not enhance its kernels by building additional kernel modules on-the-fly, which solutions like DKMS might be doing locally without your knowledge. Check if your kernel was ‘tainted’ when the issue occurred, as the event that made the kernel set this flag might be causing the issue you face. Write down coarsely how to reproduce the issue. If you deal with multiple issues at once, create separate notes for each of them and make sure they work independently on a freshly booted system. That’s needed, as each issue needs to get reported to the kernel developers separately, unless they are strongly entangled. If you are facing a regression within a stable or longterm version line (say something broke when updating from 5.10.4 to 5.10.5), scroll down to ‘Dealing with regressions within a stable and longterm kernel line’. Locate the driver or kernel subsystem that seems to be causing the issue. Find out how and where its developers expect reports. Note: most of the time this won’t be bugzilla.kernel.org, as issues typically need to be sent by mail to a maintainer and a public mailing list. Search the archives of the bug tracker or mailing list in question thoroughly for reports that might match your issue. If you find anything, join the discussion instead of sending a new report. After these preparations you’ll now enter the main part: Unless you are already running the latest ‘mainline’ Linux kernel, better go and install it for the reporting process. Testing and reporting with the latest ‘stable’ Linux can be an acceptable alternative in some situations; during the merge window that actually might be even the best approach, but in that development phase it can be an even better idea to suspend your efforts for a few days anyway. Whatever version you choose, ideally use a ‘vanilla’ build. Ignoring these advices will dramatically increase the risk your report will be rejected or ignored. Ensure the kernel you just installed does not ‘taint’ itself when running. Reproduce the issue with the kernel you just installed. If it doesn’t show up there, scroll down to the instructions for issues only happening with stable and longterm kernels. Optimize your notes: try to find and write the most straightforward way to reproduce your issue. Make sure the end result has all the important details, and at the same time is easy to read and understand for others that hear about it for the first time. And if you learned something in this process, consider searching again for existing reports about the issue. If your failure involves a ‘panic’, ‘Oops’, ‘warning’, or ‘BUG’, consider decoding the kernel log to find the line of code that triggered the error. If your problem is a regression, try to narrow down when the issue was introduced as much as possible. Start to compile the report by writing a detailed description about the issue. Always mention a few things: the latest kernel version you installed for reproducing, the Linux Distribution used, and your notes on how to reproduce the issue. Ideally, make the kernel’s build configuration (.config) and the output from dmesg available somewhere on the net and link to it. Include or upload all other information that might be relevant, like the output/screenshot of an Oops or the output from lspci. Once you wrote this main part, insert a normal length paragraph on top of it outlining the issue and the impact quickly. On top of this add one sentence that briefly describes the problem and gets people to read on. Now give the thing a descriptive title or subject that yet again is shorter. Then you’re ready to send or file the report like the MAINTAINERS file told you, unless you are dealing with one of those ‘issues of high priority’: they need special care which is explained in ‘Special handling for high priority issues’ below. Wait for reactions and keep the thing rolling until you can accept the outcome in one way or the other. Thus react publicly and in a timely manner to any inquiries. Test proposed fixes. Do proactive testing: retest with at least every first release candidate (RC) of a new mainline version and report your results. Send friendly reminders if things stall. And try to help yourself, if you don’t get any help or if it’s unsatisfying. Reporting regressions within a stable and longterm kernel line¶ This subsection is for you, if you followed above process and got sent here at the point about regression within a stable or longterm kernel version line. You face one of those if something breaks when updating from 5.10.4 to 5.10.5 (a switch from 5.9.15 to 5.10.5 does not qualify). The developers want to fix such regressions as quickly as possible, hence there is a streamlined process to report them: Check if the kernel developers still maintain the Linux kernel version line you care about: go to the front page of kernel.org and make sure it mentions the latest release of the particular version line without an ‘[EOL]’ tag. Check the archives of the Linux stable mailing list for existing reports. Install the latest release from the particular version line as a vanilla kernel. Ensure this kernel is not tainted and still shows the problem, as the issue might have already been fixed there. If you first noticed the problem with a vendor kernel, check a vanilla build of the last version known to work performs fine as well. Send a short problem report to the Linux stable mailing list (stable@vger.kernel.org) and CC the Linux regressions mailing list (regressions@lists.linux.dev); if you suspect the cause in a particular subsystem, CC its maintainer and its mailing list. Roughly describe the issue and ideally explain how to reproduce it. Mention the first version that shows the problem and the last version that’s working fine. Then wait for further instructions. The reference section below explains each of these steps in more detail. Reporting issues only occurring in older kernel version lines¶ This subsection is for you, if you tried the latest mainline kernel as outlined above, but failed to reproduce your issue there; at the same time you want to see the issue fixed in a still supported stable or longterm series or vendor kernels regularly rebased on those. If that the case, follow these steps: Prepare yourself for the possibility that going through the next few steps might not get the issue solved in older releases: the fix might be too big or risky to get backported there. Perform the first three steps in the section “Dealing with regressions within a stable and longterm kernel line” above. Search the Linux kernel version control system for the change that fixed the issue in mainline, as its commit message might tell you if the fix is scheduled for backporting already. If you don’t find anything that way, search the appropriate mailing lists for posts that discuss such an issue or peer-review possible fixes; then check the discussions if the fix was deemed unsuitable for backporting. If backporting was not considered at all, join the newest discussion, asking if it’s in the cards. One of the former steps should lead to a solution. If that doesn’t work out, ask the maintainers for the subsystem that seems to be causing the issue for advice; CC the mailing list for the particular subsystem as well as the stable mailing list. The reference section below explains each of these steps in more detail. Reference section: Reporting issues to the kernel maintainers¶ The detailed guides above outline all the major steps in brief fashion, which should be enough for most people. But sometimes there are situations where even experienced users might wonder how to actually do one of those steps. That’s what this section is for, as it will provide a lot more details on each of the above steps. Consider this as reference documentation: it’s possible to read it from top to bottom. But it’s mainly meant to skim over and a place to look up details how to actually perform those steps. A few words of general advice before digging into the details: The Linux kernel developers are well aware this process is complicated and demands more than other FLOSS projects. We’d love to make it simpler. But that would require work in various places as well as some infrastructure, which would need constant maintenance; nobody has stepped up to do that work, so that’s just how things are for now. A warranty or support contract with some vendor doesn’t entitle you to request fixes from developers in the upstream Linux kernel community: such contracts are completely outside the scope of the Linux kernel, its development community, and this document. That’s why you can’t demand anything such a contract guarantees in this context, not even if the developer handling the issue works for the vendor in question. If you want to claim your rights, use the vendor’s support channel instead. When doing so, you might want to mention you’d like to see the issue fixed in the upstream Linux kernel; motivate them by saying it’s the only way to ensure the fix in the end will get incorporated in all Linux distributions. If you never reported an issue to a FLOSS project before you should consider reading How to Report Bugs Effectively, How To Ask Questions The Smart Way, and How to ask good questions. With that off the table, find below the details on how to properly report issues to the Linux kernel developers. Make sure you’re using the upstream Linux kernel¶ Are you facing an issue with a Linux kernel a hardware or software vendor provided? Then in almost all cases you are better off to stop reading this document and reporting the issue to your vendor instead, unless you are willing to install the latest Linux version yourself. Be aware the latter will often be needed anyway to hunt down and fix issues. Like most programmers, Linux kernel developers don’t like to spend time dealing with reports for issues that don’t even happen with their current code. It’s just a waste everybody’s time, especially yours. Unfortunately such situations easily happen when it comes to the kernel and often leads to frustration on both sides. That’s because almost all Linux-based kernels pre-installed on devices (Computers, Laptops, Smartphones, Routers, …) and most shipped by Linux distributors are quite distant from the official Linux kernel as distributed by kernel.org: these kernels from these vendors are often ancient from the point of Linux development or heavily modified, often both. Most of these vendor kernels are quite unsuitable for reporting issues to the Linux kernel developers: an issue you face with one of them might have been fixed by the Linux kernel developers months or years ago already; additionally, the modifications and enhancements by the vendor might be causing the issue you face, even if they look small or totally unrelated. "
year_published = 2025
clearnet = "https://docs.kernel.org/admin-guide/reporting-issues.html"
