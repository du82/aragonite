full_description = "MathJax Documentation MathJax is an open-source JavaScript display engine for LaTeX, MathML, and AsciiMath notation that works in all modern browsers, with built-in support for assistive technology like screen readers. Version 3.0 of MathJax is a complete rewrite of MathJax from the ground up, and its usage and configuration is significantly different from that of MathJax version 2. Use the green menu at the bottom of the sidebar on the left to access the version 2 documentation if you need it. The Basics What is MathJax? MathJax Accessibility Features Writing Mathematics for MathJax The MathJax Community Reporting Issues with MathJax Including MathJax in a Web Page Getting Started with Components Configuring and Loading MathJax The MathJax Components Typesetting and Converting Math Hosting Your Own Copy of MathJax Making a Custom Build of MathJax Examples in a Browser MathJax on a Server Using NodeJS Getting Started with Node Three Ways to Use MathJax in Node Using MathJax Components Loading Components by Hand Linking to MathJax Directly Examples in Node MathJax Input TeX and LaTeX Support MathML Support AsciiMath Support MathJax Output Output Formats HTML Support SVG Support MathML Support Lazy Typesetting Line Breaking Font Support Browser Support Configuration Options Configuring MathJax Input Processor Options Output Processor Options Document Options Accessibility Extensions Options Contextual Menu Options Safe Extension Options Startup and Loader Options Advanced topics MathJax in Dynamic Content Custom Extensions The MathJax Processing Model Synchronizing Your Code with MathJax The MathJax API Using the MathJax API The Component API The Direct API Miscellaneous MathJax FAQ MathJax Badges and Logo Articles and Presentations MathJax Updates Upgrading from Version 2.x What's New In MathJax v3.2 In MathJax v3.1 In MathJax v3.0 In Earlier Versions MathJax is a Sponsored Project of NumFOCUS, a 501(c)(3) nonprofit charity in the United States. NumFOCUS provides MathJax with fiscal, legal, and administrative support to help ensure the health and sustainability of the project. Visit numfocus.org for more information. This version of the documentation was built Dec 07, 2024."
