["https://docs.microsoft.com/en-us/training/educator-center/programs/MIE/showcase-schools"]
title = "Showcase School Program | Microsoft Learn"
full_description = "Review the Showcase School rubric Identify where your school is on the transformation journey and the areas in which you'd like your school to grow. Table of contents Microsoft Learn Educator Center Showcase School Program About the program Microsoft Showcase School program is a school transformation program and a global community of pioneer schools around the world. The program is an opportunity to engage with Microsoft, get support from local Global Training Partners, and engage with like-minded school leaders around the world to deepen and expand education transformation using Microsoft Education Transformation Framework. Showcase Schools create student-centered, immersive, and inclusive experiences that inspire lifelong learning, stimulating development of essential future-ready skills so students are empowered to achieve more. Connect with a Local Global Training Partner Check out the SCS Criteria Why become a Showcase School? Become a Showcase School to join an exclusive community of innovative school leaders who: Share insights and best practices, and engage in local, national, or global Microsoft events. Enjoy other benefits including Microsoft partner offers and product support, digital transformation guidance, access to resources and latest research, and opportunities for recognition by key global education institutions. Help shape the future of Microsoft education products and programs, contribute to the vision of schools and students around the world, and elevate your school's visibility and role as a leader. Start your journey as an Incubator School The Showcase Incubator Path is the first step on this exciting and rewarding multi-year transformation journey that culminates with becoming a Showcase School. Schools go through the Incubator Path at their own pace supported by Microsoft and its partners. In addition, they join the Showcase School community to continue to establish global connections and facilitate learning from and with other schools. Applications for 2024-2025 will open in August and remain open until the next graduation window. Familiarize yourself with the framework: Review the Microsoft K-12 Education Transformation Framework to understand the program's principles. Assess your school: Use the Showcase School rubric and criteria to evaluate your school's current standing and identify areas for growth. Visit https://aka.ms/SCSrubric20 and https://aka.ms/SCSCriteria2025 Duplicate the Incubator Sway (https://aka.ms/SCSIncubatorSwayTemplate): Collate your evidence for why you want to be in this program. Engage with a local Global Training Partner to support your transformation: https://aka.ms/findatrainer Join and engage with the worldwide and local communities to support your transformation: The more you put in the more you get out! Prepare to graduate: Check out the graduation steps below and prepare early! Join the Microsoft Incubator Path Graduate as a Showcase School Ensure your school is advancing and/or leading in each of the metrics described in the rubric (https://aka.ms/SCSrubric20) and criteria (https://aka.ms/SCScriteria2025). Duplicate the graduation Sway (https://aka.ms/scsgraduationsway) and collate your evidence of how you are meeting the criteria. Fill out the self nomination form during the application window (usually end of June each year); https://aka.ms/EduNomination (this becomes the nomination page once the window opens). Become a Showcase School Additional resources Familiarize yourself with the Microsoft K-12 Education Transformation Framework Review the Showcase School rubric Identify where your school is on the transformation journey and the areas in which you'd like your school to grow. Showcase School engagement process Submit a help request"
