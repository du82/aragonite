["https://docs.microsoft.com/en-us/credentials/certifications/renew-your-microsoft-certification"]
title = "Microsoft Certification Renewal | Microsoft Learn"
description = "Renew your certification for free in three simple steps. To get started, visit your profile on Microsoft Learn."
full_description = "Renewals are free There’s no cost to renew your certification, just make sure you pass the online assessment before your certification expires. Fundamentals certifications do not expire. Six-month renewal window You can take the renewal assessment any time during your six-month eligibility window, via Microsoft Learn. Once you pass, your certification will be extended one year from the expiration date. Assessments are short and unproctored Assessments focus on recent technological and industry updates, so they’re shorter than the original exam(s) and are open book. You can take the assessment as many times as you need as long as you pass before your certification expires. Three steps to renew Renew your certification for free in three simple steps. To get started, visit your profile on Microsoft Learn. Connect your profiles Connect your Microsoft Learn profile with your certification profile and look for the renew button. Refresh your skills Prepare for the renewal assessment with free, self-paced modules on your certification renewal page. Pass the assessment Pass the free, unproctored, online assessment before your certification expires. Assessments are open book."
