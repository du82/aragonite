full_description = "Exam MB-310 study guide Focus your studies as you prepare for the exam. Review the study guide to learn about the topics the exam covers, updates, and additional resources. Support for Credentials Get help through Microsoft Credentials support forums. A forum moderator will respond in one business day, Monday–Friday. Choose your Microsoft Credential Microsoft Applied Skills or Microsoft Certifications? Choose the path that fits your career goals, desired skillset, and schedule. Read in English Save Read in English Save Add to plan Table of contents msDocs.data.certificationRenewalData = { assessmentId: '754dfaf8-bcb3-4dbc-aca1-4fe2e0214428' }; Certification Microsoft Certified: Dynamics 365 Finance Functional Consultant Associate Analyze and translate financial business requirements into processes and solutions that implement industry recommended practices. Congratulations You've earned this credential View my credential At a glance Level Intermediate Product Dynamics 365 Role Functional Consultant Subject Business reporting Finance and accounting Renewal Frequency 12 months Last Updated 09/20/2024 Jump to Prepare for the exam Practice for the exam Take the exam Renew your certification Certification resources Show more Overview As a candidate for this certification, you analyze business requirements and translate them into fully realized business processes and solutions that implement industry-recommended practices. You have a fundamental understanding of accounting principles and financial operations as they relate to: Core tasks in the finance and operations apps Manufacturing Retail Supply chain management operations As a candidate for this exam, you specialize in one or more feature sets of Dynamics 365 Finance including: General ledger Accounts payable Accounts receivable Credit and collections Cash and bank management Budgeting Fixed assets Asset leasing Tax Expense management Subscription billing Cost accounting Cost management Consolidation and elimination Skills measured Implement financial management Implement accounts receivable, credit, collections, and subscription billing Implement and manage accounts payable and expenses Manage budgeting Manage fixed assets Prepare for the exam Hide completed Start course Practice for the exam Practice Assessment Assess your knowledge Practice assessments provide you with an overview of the style, wording, and difficulty of the questions you're likely to experience on the exam. Through these assessments, you're able to assess your readiness, determine where additional preparation is needed, and fill knowledge gaps bringing you one step closer to the likelihood of passing your exam. Take the practice assessment Previous attempts See reports of your previous attempts. Exam Sandbox Experience demo Experience the look and feel of the exam before taking it. You'll be able to interact with different question types in the same user interface you'll use during the exam. Launch the sandbox Take the exam You will have 100 minutes to complete this assessment. Exam policy This exam will be proctored, and is not open book. You may have interactive components to complete as part of this exam. To learn more about exam duration and experience, visit: Exam duration and exam experience.If you fail a certification exam, don’t worry. You can retake it 24 hours after the first attempt. For subsequent retakes, the amount of time varies. For full details, visit: Exam retake policy. Need accommodations? We offer a variety of accommodations to support you.Learn More This exam is offered in the following languages: English, Japanese Schedule through Pearson Vue Schedule exam We strongly recommend that you register for an exam with a personal MSA account. If you register with an organizational (work/school) AAD account, your exam records will be lost if you leave your organization and they will be unrecoverable. Price based on the country or region in which the exam is proctored. Renew your certification Do you know that Microsoft role-based and specialty certifications expire unless they are renewed? Learn the latest updates to the technology for your job role and renew your certification at no cost by passing an online assessment on Microsoft Learn. Learn more about renewing Certification resources Exam MB-310 study guide Focus your studies as you prepare for the exam. Review the study guide to learn about the topics the exam covers, updates, and additional resources. Certification poster Check out an overview of fundamentals, role-based, and specialty certifications Exam Replay Boost your odds of success with this great offer. Support for Credentials Get help through Microsoft Credentials support forums. A forum moderator will respond in one business day, Monday–Friday. Choose your Microsoft Credential Microsoft Applied Skills or Microsoft Certifications? Choose the path that fits your career goals, desired skillset, and schedule."
