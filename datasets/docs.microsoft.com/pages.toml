title = "Microsoft Identity Integration Server 2003 (MIIS 2003) Technical Library | Microsoft Learn"
full_description = 'Read in English Save Table of contents Read in English Save Add to plan Share via Facebook x.com LinkedIn Email Print Table of contents Microsoft Identity Integration Server 2003 (MIIS 2003) Technical Library Article 10/05/2010 In this article Applies To: Windows Server 2003, Windows Server 2003 R2, Windows Server 2003 with SP1, Windows Server 2003 with SP2 This topic outlines the different types of documentation available for MIIS 2003. What are you looking for? If you want to evaluate the basic features and functionality of MIIS 2003 MIIS: Product Evaluation This documentation set includes walkthroughs that help you with proof-of-concepts and detailed analyses of features and functionalities of MIIS 2003. You also get information that helps you make business cases when choosing MIIS 2003. If you are new to MIIS 2003 and want a brief overview about the product MIIS: Getting Started New to MIIS 2003? The Getting Started documentation includes overviews, system requirements, set-up information, and walkthroughs that help you learn about MIIS 2003. If you are familiar with MIIS 2003, but would like to have an in depth understanding of how it works MIIS: Technical Reference This documentation set provides in-depth information about MIIS 2003 components, architecture, identity management process, synchronization rules, run profiles, and details about event-based and state-based identity management architectures. If you want information about how to plan and design your MIIS 2003 deployment MIIS: Planning and Architecture Use this documentation set as you plan your MIIS 2003 deployment to help you design the most secure and optimal MIIS solution for your needs, initiate your project, design the system data flow, plan synchronization rules, and address configuration settings. If you want to learn about the processes involved in deploying MIIS 2003 MIIS: Deployment This documentation set includes information about recommended deployment scenarios for MIIS 2003 including how to upgrade from the previous versions and also solution guides that provide deployment information for uncommon scenarios. If you want information about administering and maintaining MIIS 2003 MIIS: Operations This documentation set includes "How To" guides and other documents that provide discussions and recommended solutions for specific challenges that you encounter when using MIIS 2003. If you want to learn about the security considerations for MIIS 2003 MIIS: Security and Protection This set of documents explains security considerations for MIIS 2003 and also point you to information about configuring and troubleshooting MIIS 2003 security-related issues.'
