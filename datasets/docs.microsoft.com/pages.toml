["https://docs.microsoft.com/en-us/training/educator-center/product-guides/search-coach"]
title = "Search Progress and Coach product guide - Microsoft Learn Educator Center | Microsoft Learn"
description = "Watch a detailed Search Coach demo showing setup, classroom use, and more advanced capabilities including class Insights."
full_description = '''Low-distraction, ad-free, and secure Search Coach allows students to practice their information literacy skills in a safe, secure, and ad-free environment. Designed specifically for educational use, Search Coach comes with Microsoft Bing SafeSearch on "Strict" by default, blocking out most unwanted or potentially harmful content. The simple and intuitive user interface, free from advertisements, makes it easy for students to focus on the task at hand. Innovative, expert-backed information literacy support Search Coach builds on traditional information literacy education by teaching students to create effective search queries before evaluating their results. It provides daily search tips and query feedback to help students ask and answer the right questions. These tips were created with the help of leading information literacy researchers, ensuring students receive the best advice and guidance as they build their search skills. Master advanced search techniques Search Coach exposes advanced search filters like domains, file types, date range, and operators, along with detailed descriptions for their usage. These techniques are applicable to most major search engines, making it easier to bring these skills into the real world. Take action with Search Coach Insights Education Insights dashboards allow educators to gain visibility into students' searches and their engagement with search results. Data points include how frequently students only view the first result, whether they're utilizing filters, what words they're using to perform their searches, and more to modify instruction and actively support the development of information literacy skills. Search Coach deep dive Watch a detailed Search Coach demo showing setup, classroom use, and more advanced capabilities including class Insights.'''
author = "sadadow"
year_published = 2025
