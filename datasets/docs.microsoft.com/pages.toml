["https://docs.microsoft.com/en-us/training/educator-center/programs/MIE"]
title = "Microsoft Educator programs | Microsoft Learn"
full_description = "Table of contents Microsoft Learn Educator Center Microsoft Educator program About the Microsoft Educator programs Investing in teacher effectiveness is key to improving student learning. The impact of teacher quality outweighs the impact of any other school education program or policy. In fact, teacher effectiveness is the largest factor influencing student outcomes, outside of family background. The ability and capacity of ALL teachers, leaders, and staff to continually transform their methods, adopt new technologies, and to continue as life-long learners are critical elements of education transformation. Microsoft has developed many resources for education leaders, educators, and staff. The professional growth pathway is designed to help teachers and school leaders everywhere become proficient in Microsoft technologies and learn more innovative classroom skills with fun, guided, hands-on content that's specific to their role and goals. Microsoft Educator If an educator or school leader is new to Microsoft tools in teaching and learning, we have curated a learning path to help get you started. Focused on best practice and some basics for facilitating a blended or hybrid learning environment, this is the first step in a professional. Successfully complete this online through the Learn Educator Center, or through one of our training partners in an instructor-led setting to unlock this badge. Start learning path Microsoft Advanced Educator Once an educator or school leader has earned the Educator badge and is ready to go deeper into Microsoft tools in teaching and learning, successful completion of two learning paths unlocks the Advanced Educator badge. Begin with Master Microsoft Teams for any learning environment to experience all the toolsets and features that Teams has for supporting an inclusive and accessible learning environment. Navigate through the 21st century learning design learning path to see how skills such as collaboration, self-regulation, skilled communication, problem solving, knowledge construction and the use of ICT for learning can be embedded into lessons to ensure that students are successful in their future roles. By successfully completing these learning paths, you'll be prepared to take the Microsoft Certified Educator Exam. Once you have completed the modules required for the badge, please wait 24 to 48 hours for the badge to be added to the Other tab in your Achievements on your Learn profile. Note: This is an annual badge and there will be new criteria each year for educators and school leaders to renew their annual Microsoft Advanced Educator badge) Start Master Microsoft Teams Start 21st century learning design Microsoft Educator Trainer The Microsoft Educator Trainer Academy is designed for teacher trainers and people responsible for training educators on the integration of technology in the classroom. This course gives an overview of the Microsoft Educator Trainer program, program details, and the steps for becoming a Microsoft Educator Trainer or Microsoft Educator Master trainer. Learn more Microsoft Innovative Educator Expert (MIEE) Are you an educator (an educator can be a classroom teacher, a school leader a professional learning specialist/trainer, an instructional aide, a curriculum specialist, or anyone who impacts teaching and learning in their role), striving to find new ways to engage your students and colleagues? If you’d like to connect with a global, professional learning community of other educators just like yourself who are constantly pushing the boundaries of what a classroom looks and feels like, we would love to have you as a part of our Microsoft Innovative Expert community! MIE Experts will be selected by the regional Microsoft representative based on the quality of the responses to the self-nomination form, the level of innovation and use of Microsoft tools described in the learning activity and the level of detail in how becoming a part of the program will impact both teaching and student learning. Learn more"
