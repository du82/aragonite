["https://docs.microsoft.com/en-us/training/educator-center/product-guides/reading-progress"]
title = "Reading progress product guide - Microsoft Learn Educator Center | Microsoft Learn"
description = "Engage students with virtual face-to-face connections and activities, or set up a remote lunch to keep classrooms connected and having fun."
full_description = "Provide fluency practice opportunities more often Traditionally, fluency checks are a one-on-one activity. Teachers take each student aside, listen carefully as they read and hope that the rest of the class stays on task ... times 20+ students. The logistics of fluency checks have limited the number of opportunities educators can provide for student practice. With Reading Progress, educators can do fluency checks more frequently, with less classroom disruption. Equipped with Immersive Reader features, Reading Progress further empowers students to build in their own differentiation and complete fluency checks independently - at school or at home. Differentiate instruction for impact Educators can upload a reading passage from a Word or PDF document, or quickly select sample texts provided by ReadWorks. Students read the assigned passages aloud and submit recordings that can be accessed by the educator at any time. This relieves pressure for students, reduces classroom disruption, and redirects educator time to targeted instruction. Educators can select students from their class to assign distinct passages based on their reading levels or interests, and allow for multiple attempts. With more regular fluency data, educators can be dynamic in shifting groups to meet student needs. With repeated reading students improve comprehension and build confidence. Save time with AI-assisted review Reading Progress makes the assignment review process quick and easy and enables educators to identify trends to mobilize in future planning. Educators can utilize Auto-detect for AI-powered estimations of student errors. Teachers can always overwrite the suggested errors by tapping on any word they mispronounce and manually categorize it by error type. Correct words per minute and Accuracy Rate adjust automatically as educators review the submission. Educators can listen as many times as needed and jump to any word in the passage. Unlock actionable Insights Whether educators use the auto-detect feature for quick review or manually code errors, valuable data is collected into Education Insights dashboards, helping identify trends and plan for effective teaching."
author = "sadadow"
year_published = 2025
clearnet = "https://docs.microsoft.com/en-us/training/educator-center/product-guides/reading-progress"
