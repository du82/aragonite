["https://docs.npmjs.com/about-private-packages"]
title = "About private packages | npm Docs"
description = "Documentation for the npm registry, website, and command-line interface"
full_description = 'Packages and modulesIntroductionAbout private packagesAbout private packagesSee DetailsTable of contentsNext stepsResourcesTo use private packages, you must be using npm version 2.7.0 or greater. To upgrade, on the command line, run npm install npm@latest -g have a paid user or organization account With npm private packages, you can use the npm registry to host code that is only visible to you and chosen collaborators, allowing you to manage and use private code alongside public code in your projects. Private packages always have a scope, and scoped packages are private by default. User-scoped private packages can only be accessed by you and collaborators to whom you have granted read or read/write access. For more information, see "Adding collaborators to private packages owned by a user account". Organization-scoped private packages can only be accessed by teams that have been granted read or read/write access. For more information, see "Managing team access to organization packages". Next steps "Creating and publishing private packages" "Using npm packages in your projects" Resources Edit this page on GitHub2 contributorslukekarrysethomsonLast edited by lukekarrys on October 23, 2023'
year_published = 2025
