["https://docs.npmjs.com/about-semantic-versioning"]
title = "About semantic versioning | npm Docs"
description = "Documentation for the npm registry, website, and command-line interface"
full_description = '''Packages and modulesContributingAbout semantic versioningAbout semantic versioningSee DetailsTable of contentsIncrementing semantic versions in published packagesUsing semantic versioning to specify update types your package can acceptExampleResourcesTo keep the JavaScript ecosystem healthy, reliable, and secure, every time you make significant updates to an npm package you own, we recommend publishing a new version of the package with an updated version number in the package.json file that follows the semantic versioning spec. Following the semantic versioning spec helps other developers who depend on your code understand the extent of changes in a given version, and adjust their own code if necessary. Note: If you introduce a change that breaks a package dependency, we strongly recommend incrementing the version major number; see below for details. Incrementing semantic versions in published packages To help developers who rely on your code, we recommend starting your package version at 1.0.0 and incrementing as follows: Code statusStageRuleExample versionFirst releaseNew productStart with 1.0.01.0.0Backward compatible bug fixesPatch releaseIncrement the third digit1.0.1Backward compatible new featuresMinor releaseIncrement the middle digit and reset last digit to zero1.1.0Changes that break backward compatibilityMajor releaseIncrement the first digit and reset middle and last digits to zero2.0.0 Using semantic versioning to specify update types your package can accept You can specify which update types your package can accept from dependencies in your package's package.json file. For example, to specify acceptable version ranges up to 1.0.4, use the following syntax: Patch releases: 1.0 or 1.0.x or ~1.0.4 Minor releases: 1 or 1.x or ^1.0.4 Major releases: * or x For more information on semantic versioning syntax, see the npm semver calculator. Example "dependencies": { "my_dep": "^1.0.0", "another_dep": "~2.2.0"}, Resources Edit this page on GitHub2 contributorslukekarrysethomsonLast edited by lukekarrys on October 23, 2023'''
year_published = 2025
