full_description = 'CLICommandsnpm addusernpm-adduserAdd a registry user accountSelect CLI Version:Version 11.1.0 (Latest)See DetailsTable of contentsSynopsisDescriptionConfigurationregistryscopeauth-typeSee AlsoSynopsis npm adduser alias: add-user Note: This command is unaware of workspaces. Description Create a new user in the specified registry, and save the credentials to the .npmrc file. If no registry is specified, the default registry will be used (see registry). When using legacy for your auth-type, the username, password, and email are read in from prompts. Configuration registry Default: "https://registry.npmjs.org/" Type: URL The base URL of the npm registry. scope Default: the scope of the current project, if any, or "" Type: String Associate an operation with a scope for a scoped registry. Useful when logging in to or out of a private registry: # log in, linking the scope to the custom registrynpm login --scope=@mycorp --registry=https://registry.mycorp.com # log out, removing the link and the auth tokennpm logout --scope=@mycorp This will cause @mycorp to be mapped to the registry for future installation of packages specified according to the pattern @mycorp/package. This will also cause npm init to create a scoped package. # accept all defaults, and create a package named "@foo/whatever",# instead of just named "whatever"npm init --scope=@foo --yes auth-type Default: "web" Type: "legacy" or "web" What authentication strategy to use with login. Note that if an otp config is given, this value will always be set to legacy. See Also npm registry npm config npmrc npm owner npm whoami npm token npm profile Edit this page on GitHub1 contributorlukekarrysLast edited by lukekarrys on January 1, 2023'
