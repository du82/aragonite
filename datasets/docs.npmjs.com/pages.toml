["https://docs.npmjs.com/cli/v11/commands/npm-access"]
title = "npm-access | npm Docs"
description = "Set access level on published packages"
full_description = '''CLICommandsnpm accessnpm-accessSet access level on published packagesSelect CLI Version:Version 11.1.0 (Latest)See DetailsTable of contentsSynopsisDescriptionDetailsConfigurationjsonotpregistrySee AlsoSynopsis npm access list packages [<user>|<scope>|<scope:team>] [<package>]npm access list collaborators [<package> [<user>]]npm access get status [<package>]npm access set status=public|private [<package>]npm access set mfa=none|publish|automation [<package>]npm access grant <read-only|read-write> <scope:team> [<package>]npm access revoke <scope:team> [<package>] Note: This command is unaware of workspaces. Description Used to set access controls on private packages. For all of the subcommands, npm access will perform actions on the packages in the current working directory if no package name is passed to the subcommand. public / restricted (deprecated): Set a package to be either publicly accessible or restricted. grant / revoke (deprecated): Add or remove the ability of users and teams to have read-only or read-write access to a package. 2fa-required / 2fa-not-required (deprecated): Configure whether a package requires that anyone publishing it have two-factor authentication enabled on their account. ls-packages (deprecated): Show all of the packages a user or a team is able to access, along with the access level, except for read-only public packages (it won't print the whole registry listing) ls-collaborators (deprecated): Show all of the access privileges for a package. Will only show permissions for packages to which you have at least read access. If <user> is passed in, the list is filtered only to teams that user happens to belong to. edit (not implemented) Details npm access always operates directly on the current registry, configurable from the command line using --registry=<registry url>. Unscoped packages are always public. Scoped packages default to restricted, but you can either publish them as public using npm publish --access=public, or set their access as public using npm access public after the initial publish. You must have privileges to set the access of a package: You are an owner of an unscoped or scoped package. You are a member of the team that owns a scope. You have been given read-write privileges for a package, either as a member of a team or directly as an owner. If you have two-factor authentication enabled then you'll be prompted to provide a second factor, or may use the --otp=... option to specify it on the command line. If your account is not paid, then attempts to publish scoped packages will fail with an HTTP 402 status code (logically enough), unless you use --access=public. Management of teams and team memberships is done with the npm team command. Configuration json Default: false Type: Boolean Whether or not to output JSON data, rather than the normal output. In npm pkg set it enables parsing set values with JSON.parse() before saving them to your package.json. Not supported by all npm commands. otp Default: null Type: null or String This is a one-time password from a two-factor authenticator. It's needed when publishing or changing package permissions with npm access. If not set, and a registry response fails with a challenge for a one-time password, npm will prompt on the command line for one. registry Default: "https://registry.npmjs.org/" Type: URL The base URL of the npm registry. See Also libnpmaccess npm team npm publish npm config npm registry Edit this page on GitHub2 contributorsMylesBorinslukekarrysLast edited by MylesBorins on February 7, 2023'''
