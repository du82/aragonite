["https://docs.npmjs.com/about-package-readme-files"]
title = "About package README files | npm Docs"
description = "Documentation for the npm registry, website, and command-line interface"
full_description = '''Packages and modulesContributingAbout package README filesAbout package README filesSee DetailsTable of contentsCreating and adding a README.md file to a packageUpdating an existing package README.md fileWe highly recommend including a README.md file in your package directory as it helps developers find your package on npm and have a good experience using your code in their projects. In most cases README.md files include directions for installing, configuring, and using the code in your package; as well as any other information a user may find helpful. Just like in any GitHub repository, the README.md file will be rendered on the package's page. An npm package README.md file must be in the root-level directory of the package. Creating and adding a README.md file to a package In a text editor, in your package root directory, create a file called README.md. In the README.md file, add useful information about your package. Save the README.md file. Note: The file extension .md indicates a Markdown file. For more information about Markdown, see the GitHub Guide "Mastering Markdown". Updating an existing package README.md file The README.md file will only be updated on the package page when you publish a new version of your package. To update your README.md file: In a text editor, update the contents of the README.md file. Save the README.md file. On the command line, in the package root directory, run the following commands: npm version patchnpm publish Edit this page on GitHub3 contributorskenshantalukekarrysethomsonLast edited by kenshanta on October 9, 2024'''
