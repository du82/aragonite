["https://docs.npmjs.com/adding-members-to-your-organization"]
title = "Adding members to your organization | npm Docs"
description = "Documentation for the npm registry, website, and command-line interface"
full_description = '''OrganizationsManaging membersAdding members to your organizationAdding members to your organizationSee DetailsTable of contentsInviting members to your organizationRevoking an organization invitationAs an organization owner, you can add other npm users to your organization to give them read or read and write access to public and private packages within your organization's scope, as well as public unscoped packages governed by your organization. When you add a member to your organization, they are sent an email inviting them to the organization. Once the new member accepts the invitation, they are: assigned the role of "member" added to the "developers" team If you have a paid organization, as part of an npm Teams plan, you will be billed $7 per month for each new member. Inviting members to your organization On the npm "Sign In" page, enter your account details and click Sign In. In the upper right corner of the page, click your profile picture, then click Account. In the left sidebar, click the name of your organization. On the organization settings page, click Members. Click the Invite Members button. In the "Username or email" field, type the username or email address of the person you wish to invite. Optionally you can select a specific team to invite the member to. Click Invite. Revoking an organization invitation As an organization owner, if you've made a mistake in inviting someone to your organization, you can revoke the organization invitation. On the npm "Sign In" page, enter your account details and click Sign In. In the upper right corner of the page, click your profile picture, then click Account. In the left sidebar, click the name of your organization. On the organization settings page, click Members. Click the Invite Members button. Under the "Invitations" field, click the X next to the name of the user invitation you would like to revoke. Edit this page on GitHub3 contributorslukekarrysMylesBorinsethomsonLast edited by lukekarrys on October 23, 2023'''
