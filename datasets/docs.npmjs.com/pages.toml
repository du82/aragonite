["https://docs.npmjs.com/about-npm"]
title = "About npm | npm Docs"
description = "Documentation for the npm registry, website, and command-line interface"
full_description = "About npmSee DetailsTable of contentsUse npm to . . .Getting startedSharing packages and collaborating with othersLearn moreCLI reference documentationnpm is the world's largest software registry. Open source developers from every continent use npm to share and borrow packages, and many organizations use npm to manage private development as well. npm consists of three distinct components: the website the Command Line Interface (CLI) the registry Use the website to discover packages, set up profiles, and manage other aspects of your npm experience. For example, you can set up organizations to manage access to public or private packages. The CLI runs from a terminal, and is how most developers interact with npm. The registry is a large public database of JavaScript software and the meta-information surrounding it. Use npm to . . . Adapt packages of code for your apps, or incorporate packages as they are. Download standalone tools you can use right away. Run packages without downloading using npx. Share code with any npm user, anywhere. Restrict code to specific developers. Create organizations to coordinate package maintenance, coding, and developers. Form virtual teams by using organizations. Manage multiple versions of code and code dependencies. Update applications easily when underlying code is updated. Discover multiple ways to solve the same puzzle. Find other developers who are working on similar problems and projects. Getting started To get started with npm, you can create an account, which will be available at http://www.npmjs.com/~yourusername. After you set up an npm account, the next step is to use the command line interface (CLI) to install npm. We look forward to seeing what you create! Sharing packages and collaborating with others If you choose to share your packages publicly, there is no cost. To use and share private packages, you need to upgrade your account. To share with others, create organizations, called npm organizations, and invite others to work with you, privately (for a fee) or publicly (for free). You can also use a private npm package registry like GitHub Packages or the open source Verdaccio project. This lets you develop packages internally that are not shared publicly. Learn more To learn more about npm as a product, upcoming new features, and interesting uses of npm be sure to follow @npmjs on Twitter. For mentoring, tutorials, and learning, visit node school. Consider attending or hosting a nodeschool event (usually free!) at a site near you, or use the self-help tools you can find on the site. CLI reference documentation While relevant CLI commands are covered throughout this user documentation, the CLI includes command line help, its own documentation section, and instant help (man pages).Edit this page on GitHub4 contributorslukekarrysmrienstraMylesBorinsethomsonLast edited by lukekarrys on October 23, 2023"
year_published = 2025
