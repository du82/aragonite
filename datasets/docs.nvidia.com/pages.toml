title = "NVIDIA AI Enterprise - NVIDIA Docs"
description = "NVIDIA AI Enterprise is an end-to-end, cloud-native software platform that accelerates data science pipelines and streamlines development and deployment of production-grade co-pilots and other generative AI applications. Easy-to-use microservices provide optimized model performance with enterprise-grade security, support, and stability to ensure a smooth transition from prototype to production for enterprises that run their businesses on AI."
full_description = "NVIDIA AI Enterprise is an end-to-end, cloud-native software platform that accelerates data science pipelines and streamlines development and deployment of production-grade co-pilots and other generative AI applications. Easy-to-use microservices provide optimized model performance with enterprise-grade security, support, and stability to ensure a smooth transition from prototype to production for enterprises that run their businesses on AI. Overview Release Documentation NIMs AI Workflows Deployment Guides Planning Resources Support and Services Training Platform Overview Learn more about the NVIDIA AI Enterprise cloud-native software platform. Quick Start Guide, Release 6.0 Get started with the latest version of NVIDIA AI Enterprise. AI Application Components and Development Tools NVIDIA AI Enterprise Essentials Software NVIDIA’s NGC Catalog offers a wide array of easy-to-deploy microservices, pre-trained models, and other packaged software components exclusive to NVAIE subscribers, with NVIDIA’s support guarantees. Browse NVIDIA NIMs Easy-to-use microservices designed to accelerate generative AI implementation in enterprises. Exclusively available to NVIDIA AI Enterprise Essentials subscribers, with NVIDIA's Enterprise support team's backing. Browse Active Infra Release BranchesSoftware BranchDriver BranchLatest Driver in BranchBranchLatest Release in BranchRelease DateEOL DateAI Enterprise 6.xR570570.86.15Feature and Production6.0February 2025September 2026AI Enterprise 5.xR550550.144.02Feature and Production5.3January 2025April 2025AI Enterprise 4.xR535535.216.01Long-Term Support4.5January 2025September 2027All Infra Release BranchesSoftware BranchDriver BranchLatest Driver in BranchBranchLatest Release in BranchRelease DateEOL DateAI Enterprise 3.xR525525.147.05Feature and Production3.3November 2023December 2023AI Enterprise 2.xR520520.61.05Feature2.3October 2022November 2022AI Enterprise 1.xR470470.256.02Long-Term Support1.9July 2024September 2024 NVIDIA AI Enterprise Infra Release Branches NVIDIA AI Enterprise Infra Release 6 NVIDIA AI Enterprise Infra Release 6.x documentation.Version 6.0 is the latest release. Browse NVIDIA AI Enterprise Infra Release 5 NVIDIA AI Enterprise Infra Release 5.x documentation. Version 5.3 is the latest release. Browse NVIDIA AI Enterprise Infra Release 4 NVIDIA AI Enterprise Infra Release 4.x documentation. Version 4.5 is the latest release. Browse NVIDIA AI Enterprise Documentation - Version 3 NVIDIA AI Enterprise version 3.x documentation. Browse NVIDIA AI Enterprise Documentation - Version 2 NVIDIA AI Enterprise version 2.x documentation. Browse NVIDIA AI Enterprise Documentation - Version 1 NVIDIA AI Enterprise version 1.x documentation. Browse NVIDIA AI Enterprise Application Release Branches Production Branch (PB) Release Notes A Production Branch (PB) contains production-ready AI frameworks and SDK branches to provide API stability and a secure environment for building mission-critical AI applications. Browse Feature Branch (FB) Release Notes A Feature Branch (FB) delivers the latest versions of NVIDIA-built and NVIDIA-optimized AI frameworks, NVIDIA NIM microservices, pre-trained models, and SDKs, and provides access to the most recent software features and optimizations. Browse Long-Term Support Branch (LTSB) Release Notes A Long-Term Support Branch (LTSB) contains long-term supported AI frameworks and SDKs to provide 36 months of API stability and a secure environment for highly regulated industries. Browse NVIDIA AI Enterprise Support Lifecycle Policy Lifecycle Policy This Enterprise Software lifecycle reflects the changes in how NVIDIA AI Enterprise is distributed, which were introduced in NVIDIA AI Enterprise 4.0. Starting with NVIDIA AI Enterprise 4.0, AI frameworks and SDKs are decoupled from software for managing and optimizing infrastructure and workloads. Browse Notices End of Life Notices Browse NVIDIA NIM Documentation Part of NVIDIA AI Enterprise, NVIDIA NIM microservices are a set of easy-to-use microservices that accelerate the deployment of foundation models on any cloud or data center and help keep your data secure. NIM microservices have production-grade runtimes, including ongoing security updates. Run your business applications with stable APIs backed by enterprise-grade support. NVIDIA NIM for LLMs Support Matrix The support matrices provide a list of supported GPUs, hardware and software capabilities of LLMs, and a list of supported models. NVIDIA NIM for LLMs Release Notes The release notes describe the key features, enhancements, and improvements for LLMs and identify known issues. Blog: NVIDIA NIM Offers Optimized Inference Microservices for Deploying AI Models at Scale NVIDIA NIM microservices are designed to bridge the gap between the complex world of AI development and the operational needs of enterprise environments, enabling 10-100X more enterprise application developers to contribute to AI transformations of their companies. AI Chatbot with Retrieval Augmented Generation Build Generative AI chatbots that accurately answer domain-specific queries using latest information. Browse Cybersecurity AI Workflows Reduce the time to develop a solution for Digital Fingerprinting to detect cybersecurity threats. Browse Retail Shopping Advisor AI Workflow Develop a RAG application powered by large language models that enables more natural, personalized shopping experiences. Browse Route Optimization AI Workflow The route optimization workflow demonstrates how to use NVIDIA cuOpt to minimize vehicle routing inefficiencies by finding the most optimal route for a fleet of vehicles making deliveries, pickups, dispatching jobs, etc. Browse NVIDIA AI Enterprise Cloud Deployment Guide This document provides guidance for deploying and running NVIDIA AI Enterprise in the Cloud. This resource can be used for understand system pre-requisites, installation and configuration. Browse NVIDIA AI Enterprise VMware vSphere Deployment Guide This document provides insights into deploying NVIDIA AI Enterprise for VMware vSphere and serves as a technical resource for understanding system pre-requisites, installation, and configuration. Browse NVIDIA AI Enterprise Bare Metal Deployment Guide This document provides insights into deploying NVIDIA AI Enterprise on Bare Metal Servers and serves as a technical resource for understanding system pre-requisites, installation, and configuration. Browse NVIDIA AI Enterprise CPU Only Deployment Guide This document provides insights into CPU only deployments of NVIDIA AI Enterprise and serves as a technical resource for understanding system prerequisites, installation, and configuration. Browse NVIDIA AI Enterprise OpenShift on Bare Metal Deployment Guide This document provides insights into deploying NVIDIA AI Enterprise with Red Hat OpenShift on bare metal servers. This technical resource can be used for understanding system pre-requisites, installation, and configuration. Browse NVIDIA AI Enterprise OpenShift on VMware vSphere Deployment Guide This document provides insights into deploying NVIDIA AI Enterprise with Red Hat OpenShift on VMware vSphere. This technical resource can be used for understanding system pre-requisites, installation, and configuration. Browse NVIDIA AI Enterprise Red Hat Enterprise Linux With KVM Deployment Guide This document provides insights into deploying NVIDIA AI Enterprise on Red Hat Enterprise Linux with KVM Virtualization and serves as a technical resource for understanding system prerequisites, installation, and configuration. Browse NVIDIA AI Enterprise with RAPIDS Accelerator Deployment Guide NVIDIA RAPIDS Accelerator for Apache Spark enables data engineers to speed up Apache Spark 3 data science pipelines and AI model training while lowering infrastructure costs. Browse Cloud Native Service Add-on Pack Deployment Guide AI Workflow packaged components for building and deploying AI solutions as microservices. Browse NVIDIA AI Enterprise Multi-Node Deep Learning Training with TensorFlow This guide aims to provide guidance on how to set up a high-performance multi-node cluster as virtual machines. Within this guide, you will become familiar with GPUDirect RDMA and ATS while using Docker as the platform for running high-performance multi-node Deep Learning Training. ATS is a VMware PCIe support enhancement in vSphere 7 Update 2. GPUDirect RDMA benefits from ATS and is certified and supported by NVIDIA AI Enterprise. Browse NVIDIA AI Enterprise Natural Language Processing with Triton Inference Server This solution guide outlines the creation of an AI pipeline on NVIDIA AI Enterprise by leveraging a Natural Language Processing use case example. Browse ClearML & NVIDIA AI Enterprise Deployment Guide ClearML delivers a machine learning solution that maximizes resource utilization and accessibility while minimizing the DevOps workload. It delivers a unified, open source platform for continuous AI. This document serves to provide a validated deployment guide for deploying ClearML Platform on NVIDIA AI Enterprise leveraging a VMware vSphere Tanzu cluster. Browse Domino & NVIDIA AI Enterprise Deployment Guide Domino Data Lab's Enterprise MLOps Platform accelerates research, speeds model deployment, and increases collaboration for code-first data science teams at scale, all in one platform. This document describes the Domino Data Lab’s Enterprise MLOps Platform for NVIDIA AI Enterprise deployed into a Kubernetes cluster hosted by VMware vSphere and using VMware vSAN storage. Browse Run:ai & NVIDIA AI Enterprise Deployment Guide Run:ai’s Atlas Platform enables IT organizations to build their AI infrastructure with cloud-like resource accessibility and management, on any infrastructure, and enable researchers to use any machine learning and data science tools they choose. This document serves to provide a validated deployment guide for deploying Run:ai Atlas Platform on NVIDIA AI Enterprise leveraging a VMware vSphere Tanzu cluster. Browse UbiOps & NVIDIA AI Enterprise Deployment Guide UbiOps MLOps Platform is developed for data scientists and teams who are looking for an easy, flexible and production-ready way to deploy, train, and run Machine Learning and Data Science code. It can also be used to deploy off-the-shelf LLM & GenAI models and run helper functions & other data processing tasks. This document serves to provide a validated deployment guide for deploying UbiOps MLOps Platform leveraging NVIDIA AI Enterprise software stacks. Browse HPE ML Data Management Deployment Guide Learn about the basics of HPE ML Data Management (MLDM) and how to install the platform within a Kubernetes cluster. Browse HPE Machine Learning Development Environment Deployment Guide Uncover hidden insights from your data by helping engineers and data scientists collaborate, build more accurate ML models, and train them faster. Browse NVIDIA AI Enterprise and Canonical Charmed Kubernetes Deployment Guide This document provides a comprehensive guide for installing Charmed Kubernetes with NVIDIA GPU Operator, providing the ideal platform to run NVIDIA AI Enterprise Software. Browse NVIDIA AI Enterprise Security White Paper This white paper details NVIDIA's commitment to securing the NVIDIA AI Enterprise software stack. It outlines the processes and measures NVIDIA takes to ensure container security. Browse NVIDIA AI Enterprise Licensing Guide This guide covers the entitlement, packaging, and licensing of NVIDIA AI Enterprise. It is intended to be a quick reference to understand the product at a high level, with the corresponding SKU information. Browse NVIDIA AI Enterprise Release Branches The goal of this document is to help organizations choose an NVIDIA AI Enterprise Release Branch, as well as provide information on how to move from one branch to another. Browse Accelerate MLOps with NVIDIA and RedHat Instructional Video for AI Enterprise. Browse Accelerating AI Workloads Instructional Video for AI Enterprise. Browse AI-READY ENTERPRISE PLATFORM Now with Red Hat OpenShift Artificial intelligence (AI) is transforming every industry, whether it’s by improvingcustomer relationships in financial services, streamlining manufacturer supply chains,or helping doctors deliver better outcomes for patients. Browse AI-READY ENTERPRISE PLATFORM Solution Overview Artificial intelligence (AI) is transforming every industry, whether it’s by improvingcustomer relationships in financial services, streamlining manufacturer supplychains, or helping doctors deliver better outcomes for patients. Browse Customer Success Story: Cancer Research Advances with NVIDIA AI Enterprise The Netherlands Cancer Institute (NKI) has been at the forefront of cancer research and treatment since 1913. Comprised of an internationally acclaimed research center and a dedicated cancer clinic, NKI puts innovative ideas into action for the benefit of patients. Browse Get Started with Enterprise AI with NVIDIA LaunchPad Instructional Video for AI Enterprise. Browse How To Buy NVIDIA AI Enterprise NVIDIA AI Enterprise is certified to deploy on broadly adopted enterprise platforms, including multi-cloud environments, popular data center platforms from VMware and Red Hat, and NVIDIA-Certified Systems. Browse Load More Infrastructure NVIDIA AI Enterprise Reference Architecture This reference architecture provides an example deployment of NVIDIA AI Enterprise software suite. It showcases a deployment with VMWare vShpere, and provides example workloads to showcase the platform’s capabilities. Topics such as hardware, network, and workload topologies will be discussed. Browse NVIDIA AI Enterprise Sizing Guide This sizing guide is intended to guide customers who want to implement NVIDIA AI Enterprise with NVIDIA-Certified Systems at scale. Browse NVIDIA Enterprise Support and Services User Guide (PDF Format) This document is intended for NVIDIA’s potential and existing enterprise customers. This User Guide is a non-binding document and should be utilized to obtain information for NVIDIA Enterprise branded support and services. Training to enable your team to make the most of AI Enterprise. NVIDIA AI Enterprise Administration Public Training This course covers the platform and solution overview, hardware and software architecture, deployment options, licensing, temporal and spatial GPU partitioning, scaling, comprehensive validation, management, maintenance, monitoring, and troubleshooting. Browse Introduction to AI in the Data Center Explore an introduction to AI, GPU (Graphic Processing Unit) computing, NVIDIA AI software architecture, and how to implement and scale AI workloads in the datacenter. Browse NVIDIA License System NVIDIA License System (NLS) is a new licensing solution to support the continued expansion of the NVIDIA enterprise software portfolio. This course will help you to learn about NLS and how you can move from your existing licensing solution to NLS. Browse"
