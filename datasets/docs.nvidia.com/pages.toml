title = "NVIDIA Documentation Hub - NVIDIA Docs"
description = "Get support for our latest innovations and see how you can bring them into your own work."
full_description = "Browse by Featured Products All Documents Submit Search Most Popular Get support for our latest innovations and see how you can bring them into your own work. NVIDIA NIM Part of NVIDIA AI Enterprise, NVIDIA NIM microservice are a set of easy-to-use microservices for accelerating the deployment of foundation models on any cloud or data center and helps keep your data secure. NIM microservice has production-grade runtimes including on-going security updates. Run your business applications with stable APIs backed by enterprise-grade support. Browse NVIDIA API Documentation Your guide to NVIDIA APIs including NIM and CUDA-X microservices. Browse NVIDIA AI Enterprise NVIDIA AI Enterprise is an end-to-end, cloud-native software platform that accelerates data science pipelines and streamlines development and deployment of production-grade co-pilots and other generative AI applications. Browse NVIDIA Omniverse NVIDIA Omniverse is a cloud-native, multi-GPU, real-time simulation and collaboration platform for 3D production pipelines based on Pixar's Universal Scene Description (USD) and NVIDIA RTX. Browse NVIDIA Virtual GPU (vGPU) Software NVIDIA virtual GPU (vGPU) software is a graphics virtualization platform that extends the power of NVIDIA GPU technology to virtual desktops and apps, offering improved security, productivity, and cost-efficiency. Browse NVIDIA CUDA The NVIDIA® CUDA® Toolkit provides a comprehensive development environment for C and C++ developers building GPU-accelerated applications. Browse NVIDIA DGX Platform Built from the ground up for enterprise AI, the NVIDIA DGX platform incorporates the best of NVIDIA software, infrastructure, and expertise in a modern, unified AI development and training solution. Browse NVIDIA cuDNN The NVIDIA CUDA® Deep Neural Network (cuDNN) is a GPU-accelerated library of primitives for deep neural networks. Browse NVIDIA Jetson The NVIDIA JetPack SDK, which is the most comprehensive solution for building AI applications, along with L4T and L4T Multimedia, provides the Linux kernel, bootloader, NVIDIA drivers, flashing utilities, sample filesystem, and more for the Jetson platform. Browse NVIDIA TensorRT NVIDIA TensorRT is an SDK for high-performance deep learning inference. It is designed to work in a complementary fashion with training frameworks such as TensorFlow, PyTorch, and MXNet. It focuses specifically on running an already-trained network quickly and efficiently on NVIDIA hardware. Browse NVIDIA CUTLASS CUTLASS is a collection of CUDA C++ template abstractions for implementing high-performance matrix-matrix multiplication (GEMM) and related computations at all levels and scales within CUDA. Browse OpenFilters Close filters Filters Selected Filters Clear All Topics AR / VR(4) Computer Vision / Video Analytics(7) Content Creation / Rendering(9) Conversational AI(2) Cybersecurity(2) Data Center / Cloud(28) Data Science(9) Edge Computing(10) Generative AI / LLMs(2) Networking(3) Recommenders / Personalization(3) Robotics(4) Simulation / Modeling / Design(11) See AllSee Less Industry Segments Academia / Higher Education(38) Aerospace(43) Agriculture(39) Architecture / Engineering / Construction(42) Automotive / Transportation(10) Cloud Services(41) Consumer Internet(38) Energy(43) Financial Services(41) Gaming(49) Hardware / Semiconductor(41) Healthcare & Life Sciences(22) HPC / Scientific Computing(49) Manufacturing(41) Media & Entertainment(45) Public Sector(43) Restaurant / Quick-Service(40) Retail / Consumer Packaged Goods(41) Telecommunications(40) See AllSee Less Job Roles Artist / Designer(3) Business Executive(4) Data Scientist(22) Dev / IT Operations(38) Developer / Engineer(59) Research: Academic(6) Research: Non-Academic(6) See AllSee Less APPLY Sort by: Alphabetical - A-Z Newest Documentation Center Cloudera Data Platform (CDP) The integration of NVIDIA RAPIDS into the Cloudera Data Platform (CDP) provides transparent GPU acceleration of data analytics workloads using Apache Spark. This documentation describes the integration and suggested reference architectures for deployment. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Documentation Center GPU Management and Deployment This documentation should be of interest to cluster admins and support personnel of enterprise GPU deployments. It includes monitoring and management tools and application programming interfaces (APIs), in-field diagnostics and health monitoring, and cluster setup and deployment. Documentation Center Megatron Core User Guide Developer documentation for Megatron Core covers API documentation, quickstart guide as well as deep dives into advanced GPU techniques needed to optimize LLM performance at scale. Product NV-Ingest NV-Ingest is a scalable, performance-oriented document content and metadata extraction microservice that uses specialized NVIDIA NIM microservices to find, contextualize, and extract text, tables, charts, and images for use in downstream generative applications. Documentation Center nvCOMP nvCOMP is a high performance GPU enabled data compression library. Includes both open-source and non-OS components. The nvCOMP library provides fast lossless data compression and decompression using a GPU. It features generic compression interfaces to enable developers to use high-performance GPU compressors in their applications. Product NVIDIA AI Aerial NVIDIA AI Aerial™ is a suite of accelerated computing platforms, software, and services for designing, simulating, and operating wireless networks. Aerial contains hardened RAN software libraries for telcos, cloud service providers (CSPs), and enterprises building commercial 5G networks. Academic and industry researchers can access Aerial on cloud or on-premises setups for advanced wireless and AI/machine learning (ML) research for 6G. Edge Computing Telecommunications Product NVIDIA AI Enterprise NVIDIA AI Enterprise is an end-to-end, cloud-native software platform that accelerates data science pipelines and streamlines development and deployment of production-grade co-pilots and other generative AI applications. Easy-to-use microservices provide optimized model performance with enterprise-grade security, support, and stability to ensure a smooth transition from prototype to production for enterprises that run their businesses on AI. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Documentation Center NVIDIA Air A simulation platform that allows users to model data center deployments with full software functionality, creating a digital twin. Transform and streamline network operations by simulating, validating, and automating changes and updates. Documentation Center NVIDIA Ansel NVIDIA Ansel is a revolutionary way to capture in-game shots and share the moment. Compose your screenshots from any position, adjust them with post-process filters, capture HDR images in high-fidelity formats, and share them in 360 degrees using your mobile phone, PC, or VR headset. Documentation Center NVIDIA API Documentation Your guide to NVIDIA APIs including NIM and CUDA-X microservices. Product NVIDIA Attestation The NVIDIA Attestation Suite enhances Confidential Computing by providing robust mechanisms to ensure the integrity and security of devices and platforms. The suite includes NVIDIA Remote Attestation Service (NRAS), the Reference Integrity Manifest (RIM) Service, and the NDIS OCSP Responder. Aerospace Hardware / Semiconductor Architecture / Engineering / Construction Product NVIDIA Base Command Manager NVIDIA Base Command Manager streamlines cluster provisioning, workload management, and infrastructure monitoring. It provides all the tools you need to deploy and manage an AI data center. NVIDIA Base Command Manager Essentials comprises the features of NVIDIA Base Command Manager that are certified for use with NVIDIA AI Enterprise. Data Center / Cloud Technical Overview NVIDIA Base Command Platform NVIDIA Base Command Platform is a world-class infrastructure solution for businesses and their data scientists who need a premium AI development experience. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Product NVIDIA Base OS NVIDIA Base OS implements the stable and fully qualified operating systems for running AI, machine learning, and analytics applications on the DGX platform. It includes system-specific configurations, drivers, and diagnostic and monitoring tools and is available for Ubuntu, Red Hat Enterprise Linux, and Rocky Linux. Data Center / Cloud Documentation Center NVIDIA Bright Cluster Manager NVIDIA Bright Cluster Manager offers fast deployment and end-to-end management for heterogeneous HPC and AI server clusters at the edge, in the data center and in multi/hybrid-cloud environments. It automates provisioning and administration for clusters ranging in size from a single node to hundreds of thousands, supports CPU-based and NVIDIA GPU-accelerated systems, and orchestration with Kubernetes. HPC / Scientific Computing Edge Computing Data Center / Cloud Documentation Center NVIDIA Capture SDK NVIDIA Capture SDK (formerly GRID SDK) enables developers to easily and efficiently capture, and optionally encode, the display content. Documentation Center NVIDIA Certification Programs NVIDIA’s program that enables enterprises to confidently deploy hardware solutions that optimally run accelerated workloads—from desktop to data center to edge. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Product NVIDIA Clara NVIDIA® Clara™ is an open, scalable computing platform that enables developers to build and deploy medical imaging applications into hybrid (embedded, on-premises, or cloud) computing environments to create intelligent instruments and automate healthcare workflows. Healthcare & Life Sciences Computer Vision / Video Analytics Product NVIDIA Cloud Functions Serverless API to deploy and manage AI workloads on GPUs at planetary scale. Product NVIDIA Cloud Native Technologies NVIDIA cloud-native technologies enable developers to build and run GPU-accelerated containers using Docker and Kubernetes. Cloud Services Data Center / Cloud Documentation Center NVIDIA CloudXR SDK CloudXR is NVIDIA's solution for streaming virtual reality (VR), augmented reality (AR), and mixed reality (MR) content from any OpenVR XR application on a remote server--desktop, cloud, data center, or edge. Documentation Center NVIDIA Compute Sanitizer Compute Sanitizer is a functional correctness checking suite included in the CUDA toolkit. This suite contains multiple tools that can perform different type of checks. The memcheck tool is capable of precisely detecting and attributing out of bounds and misaligned memory access errors in CUDA applications. The tool can also report hardware exceptions encountered by the GPU. The racecheck tool can report shared memory data access hazards that can cause data races. The initcheck tool can report cases where the GPU performs uninitialized accesses to global memory. The synccheck tool can report cases where the application is attempting invalid usages of synchronization primitives. This document describes the usage of these tools. Product NVIDIA Cosmos A developer-first world foundation model (WFM) platform designed to help Physical AI developers build their Physical AI systems better and faster. Product NVIDIA CUDA The NVIDIA® CUDA® Toolkit provides a comprehensive development environment for C and C++ developers building GPU-accelerated applications. With the CUDA Toolkit, you can develop, optimize, and deploy your applications on GPU-accelerated embedded systems, desktop workstations, enterprise data centers, cloud-based platforms and HPC supercomputers. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Documentation Center NVIDIA cuDNN The NVIDIA CUDA® Deep Neural Network (cuDNN) is a GPU-accelerated library of primitives for deep neural networks. cuDNN provides highly tuned implementations for standard routines such as forward and backward convolution, attention, matmul, pooling, and normalization. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Product NVIDIA cuOpt NVIDIA cuOpt™ is a GPU-accelerated solver that uses heuristics and metaheuristics to solve complex vehicle routing problem variants with a wide range of constraints. Data Science Robotics Product NVIDIA cuVS NVIDIA cuVS is an open-source library for GPU-accelerated vector search and data clustering that enables higher throughput search, lower latency, and faster index build times. Product NVIDIA DALI The NVIDIA Data Loading Library (DALI) is a collection of highly optimized building blocks, and an execution engine, for accelerating the pre-processing of input data for deep learning applications. DALI provides both the performance and the flexibility for accelerating different data pipelines as a single library. This single library can then be easily integrated into different deep learning training and inference applications. Aerospace Hardware / Semiconductor Architecture / Engineering / Construction Documentation Center NVIDIA Data Center GPU Drivers NVIDIA Data Center GPU drivers are used in Data Center GPU enterprise deployments for AI, HPC, and accelerated computing workloads. Documentation includes release notes, supported platforms, and cluster setup and deployment. Documentation Center NVIDIA Data Center GPU Manager (DCGM) NVIDIA Data Center GPU Manager (DCGM) is a suite of tools for managing and monitoring NVIDIA Data Center GPUs in cluster environments. Aerospace Hardware / Semiconductor Architecture / Engineering / Construction Documentation Center NVIDIA Deep Graph Library (DGL) Deep Graph Library (DGL) is a framework-neutral, easy-to-use, and scalable Python library used for implementing and training Graph Neural Networks (GNN). Being framework-neutral, DGL is easily integrated into an existing PyTorch, TensorFlow, or an Apache MXNet workflow. Documentation Center NVIDIA Deep Learning Performance GPUs accelerate machine learning operations by performing calculations in parallel. Many operations, especially those representable as matrix multipliers will see good acceleration right out of the box. Even better performance can be achieved by tweaking operation parameters to efficiently use GPU resources. The performance documents present the tips that we think are most widely useful. Architecture / Engineering / Construction Media & Entertainment Restaurant / Quick-Service Product NVIDIA DGX Cloud NVIDIA DGX Cloud is an AI platform for enterprise developers, optimized for the demands of generative AI. Product NVIDIA DGX Platform Built from the ground up for enterprise AI, the NVIDIA DGX platform incorporates the best of NVIDIA software, infrastructure, and expertise in a modern, unified AI developmen"
