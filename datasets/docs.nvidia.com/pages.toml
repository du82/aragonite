title = "NVIDIA Cloud Native Technologies - NVIDIA Docs"
description = "NVIDIA cloud-native technologies enable developers to build and run GPU-accelerated containers with Docker, Podman, and Kubernetes."
full_description = "Overview Kubernetes and NVIDIA GPUs Containers and NVIDIA GPUs Reference Architectures About NVIDIA Cloud Native Technologies NVIDIA cloud-native technologies enable developers to build and run GPU-accelerated containers with Docker, Podman, and Kubernetes. NVIDIA GPU Operator Automate the management of all NVIDIA software components needed to provision GPUs in Kubernetes. Browse GPU Operator on Red Hat OpenShift Use NVIDIA GPUs with Red Hat's security-centric and enterprise-grade hardened Kubernetes platform. Browse NVIDIA NIM Operator Operate and manage the lifecycle of the software components and services for running LLM, embedding, and other NIM microservices and models in Kubernetes. Browse NVIDIA Network Operator Provision and manage NVIDIA networking resources in a Kubernetes cluster. The Operator installs host networking software to provide high-speed network connectivity. Browse Partner-Validated Configurations Partners document how to use the NVIDIA GPU Operator with their Kubernetes platforms.End-user support is provided by the partner and not NVIDIA. Browse Multi-Instance GPU Support in Kubernetes Use partitioned GPUs for workloads that do not fully saturate the GPU compute capacity. Browse NVIDIA DCGM Exporter Gather GPU metrics for use with monitoring solutions such as Prometheus. Browse NVIDIA Device Plugin for Kubernetes The NVIDIA device plugin for Kubernetes provides the following features:Exposes the number of GPUs on each node of your cluster.Keeps track of the health of your GPUs.Runs GPU-enabled containers in your Kubernetes cluster. Browse NVIDIA GPU Feature Discovery NVIDIA GPU Feature Discovery for Kubernetes automatically generates labels for the set of GPUs on a node. Browse NVIDIA Container Toolkit Build and run GPU-accelerated containers with the container runtime library and utilities. Browse NVIDIA GPUs with Red Hat Device Edge NVIDIA GPUs bring accelerated computing and artificial intelligence to the edge. Browse NVIDIA GPUs with Google Anthos Use NVIDIA GPUs with Google Anthos in hybrid and multi-cloud environments. Browse NVIDIA Cloud Native Stack Repository NVIDIA Cloud Native Stack is a collection of software to run cloud-native workloads on NVIDIA GPUs. The GitHub repository provides installation guides to get you started. Browse Securing NVIDIA Services with Istio and Keycloak Use a service mesh for service-to-service communication in a microservices architecture. Browse"
