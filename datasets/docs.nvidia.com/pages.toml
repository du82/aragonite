full_description = "NVIDIA Base Command Platform is a world-class infrastructure solution for businesses and their data scientists who need a premium AI development experience. Documentation Workloads References User Guide This document is for users and administrators of NVIDIA Base Command Platform and explains how to use the platform to run AI jobs. Browse Getting Started This document is for users and administrators of NVIDIA Base Command Platform and explains how to get started using the platform to run AI jobs. Browse Release Notes Current status, software versions, and known issues of the NVIDIA Base Command Platform. Browse Running NeMo FW on Base Command Platform Learn how to utilize the NeMo Framework on Base Command Platform. Browse NGC Command-Line Interface (CLI) With NVIDIA GPU Cloud (NGC) CLI, you can perform many of the same operations that are available from the NGC website, such as running jobs, viewing Docker repositories and downloading AI models within your organization and team space. Browse NGC API Documentation The NGC Web API is an interface for querying information from and enacting change in an NGC environment. Browse"
