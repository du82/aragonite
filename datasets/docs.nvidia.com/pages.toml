["https://docs.nvidia.com/cudnn/index.html"]
title = "NVIDIA cuDNN - NVIDIA Docs"
description = "The NVIDIA CUDA® Deep Neural Network (cuDNN) is a GPU-accelerated library of primitives for deep neural networks. cuDNN provides highly tuned implementations for standard routines such as forward and backward convolution, attention, matmul, pooling, and normalization."
full_description = 'The NVIDIA CUDA® Deep Neural Network (cuDNN) is a GPU-accelerated library of primitives for deep neural networks. cuDNN provides highly tuned implementations for standard routines such as forward and backward convolution, attention, matmul, pooling, and normalization. Documentation References Downloads Support Release Notes Current status, software versions, and known issues for NVIDIA cuDNN. Browse Installation Guide This document provides step-by-step instructions on how to install NVIDIA cuDNN. Browse Library API This library is a context-based API that allows for easy multi-threading and (optional) interoperability with CUDA streams. This API lists the data types and API functions per sub-library. Browse Developer Guide This document explains how to use the NVIDIA cuDNN library. While the NVIDIA cuDNN Library API provides per-function API documentation, the Developer Guide gives a more informal end-to-end story about cuDNN’s key capabilities and how to use them. Browse Troubleshooting This document describes the error reporting and API logging utilities for recording the cuDNN API execution and error information. It also helps answer the most commonly asked questions regarding typical use cases. Browse Support Matrix This document lists the supported versions of the OS, NVIDIA CUDA, the CUDA driver, and the hardware for the latest NVIDIA cuDNN release. Browse Software License This document contains specific license terms and conditions for NVIDIA cuDNN. By accepting this agreement, you agree to comply with all the terms and conditions applicable to the specific product(s) included herein. Browse Archives This document provides access to previously released cuDNN documentation versions. Browse cuDNN Library Click on the green buttons that describe your target platform. Only supported platforms will be shown. Browse cuDNN Frontend The cuDNN Frontend (FE) API is a C++ header-only library that wraps the cuDNN C backend API. Both the FE and backend APIs are entry points to the same set of functionality that is commonly referred to as the "graph API". Browse NVIDIA Developer Program Join the NVIDIA Developer Program. Browse cuDNN Forum Explore cuDNN forums. Browse cuDNN Developer Access the latest NVIDIA cuDNN announcements, news, downloads, and training. Browse Technical Blogs Find more news and tutorials. Browse'
