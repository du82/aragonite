title = "NVIDIA Base Command Manager - NVIDIA Docs"
description = 'NVIDIA Base Command Manager streamlines cluster provisioning, workload management, and infrastructure monitoring. It provides all the tools you need to deploy and manage an AI data center. NVIDIA Base Command Manager Essentials comprises the features of NVIDIA Base Command Manager that are <a  href="https://support.brightcomputing.com/feature-matrix/" target="_blank" link-data="{&quot;cms.site.owner&quot;:{&quot;_ref&quot;:&quot;00000183-66b2-dbb3-afcb-6ebe6f520000&quot;,&quot;_type&quot;:&quot;ae3387cc-b875-31b7-b82d-63fd8d758c20&quot;},&quot;cms.content.publishDate&quot;:1696628946136,&quot;cms.content.publishUser&quot;:{&quot;_ref&quot;:&quot;00000186-12fe-dca2-a5c7-b2ff14ea0000&quot;,&quot;_type&quot;:&quot;6aa69ae1-35be-30dc-87e9-410da9e1cdcc&quot;},&quot;cms.content.updateDate&quot;:1696628946136,&quot;cms.content.updateUser&quot;:{&quot;_ref&quot;:&quot;00000186-12fe-dca2-a5c7-b2ff14ea0000&quot;,&quot;_type&quot;:&quot;6aa69ae1-35be-30dc-87e9-410da9e1cdcc&quot;},&quot;link&quot;:{&quot;target&quot;:&quot;NEW&quot;,&quot;attributes&quot;:[],&quot;url&quot;:&quot;https://support.brightcomputing.com/feature-matrix/&quot;,&quot;_id&quot;:&quot;0000018b-06f7-dc6e-a7bb-a6f727530001&quot;,&quot;_type&quot;:&quot;33ac701a-72c1-316a-a3a5-13918cf384df&quot;},&quot;_id&quot;:&quot;0000018b-06f7-dc6e-a7bb-a6f727530000&quot;,&quot;_type&quot;:&quot;02ec1f82-5e56-3b8c-af6e-6fc7c8772266&quot;}">certified for use with NVIDIA AI Enterprise</a>.'
full_description = "Overview Release Notes Product Manuals Deployment Guides Training NVIDIA Base Command Manager streamlines cluster provisioning, workload management, and infrastructure monitoring. It provides all the tools you need to deploy and manage an AI data center. NVIDIA Base Command Manager Essentials comprises the features of NVIDIA Base Command Manager that are certified for use with NVIDIA AI Enterprise. Learn More Base Command Manager 10 Release Notes Base Command Manager 10 Administrator Manual This manual is aimed at helping system administrators install, configure, understand, and manage a cluster running BCM. This manual is not intended for users interested only in interacting with the cluster to run compute jobs. The User Manual is intended to get such users up to speed with the user environment and workload management system. Browse Cloudbursting Manual This manual is aimed at helping cluster administrators install, understand, configure, and manage the cloud capabilities of NVIDIA Base Command Manager. The administrator is expected to be reasonably familiar with the Administrator Manual. Browse Containerization Manual This manual is aimed at helping cluster administrators install, understand, configure, and manage the containeration integration capabilities of NVIDIA Base Command Manager. The administrator is expected to be reasonably familiar with the Administrator Manual. Browse Developer Manual This manual is aimed at helping developers who would like to program the NVIDIA Base Command Manager in order to enhance or alter its functionality. It is not intended for end users who simply wish to submit jobs that run programs to workload managers. Browse Edge Manual This manual is aimed at helping cluster administrators install, understand, configure, and manage the edge computing capabilities of NVIDIA Base Command Manager. The administrator is expected to be reasonably familiar with the Administrator Manual. Browse Installation Manual This manual describes a basic and quick installation of NVIDIA Base Command Manager (BCM) on “bare metal” cluster hardware as a step-by-step process, and gives very little explanation of the steps Browse User Manual This manual is intended for the end users of a cluster running NVIDIA Base Command Manager (BCM, also known as “the cluster manager”) and covers the basics of using BCM’s user environment to run compute jobs on the cluster. Browse Machine Learning Manual This manual is aimed at helping cluster administrators install, understand, configure, and manage basic machine learning capabilities easily using NVIDIA Base Command Manager. The administrator is expected to be reasonably familiar with the Administrator Manual. Browse Bright Cluster Manager NVIDIA Bright Cluster Manager NVIDIA Bright Cluster Manager offers fast deployment and end-to-end management for heterogeneous HPC and AI server clusters at the edge, in the data center and in multi/hybrid-cloud environments. It automates provisioning and administration for clusters ranging in size from a single node to hundreds of thousands, supports CPU-based and NVIDIA GPU-accelerated systems, and orchestration with Kubernetes. Browse NVIDIA DGX SuperPOD Deployment and management guides for NVIDIA DGX SuperPOD, an AI data center infrastructure platform that enables IT to deliver performance—without compromise—for every user and workload. DGX SuperPOD offers leadership-class accelerated infrastructure and agile, scalable performance for the most challenging AI and high-performance computing (HPC) workloads, with industry-proven results. Browse NVIDIA DGX BasePOD Deployment and management guides for DGX BasePOD, which provides a prescriptive AI infrastructure for enterprises, eliminating the design challenges, lengthy deployment cycle, and management complexity traditionally associated with scaling AI infrastructure. Browse Base Command Manager Administration This course provides an overview of the Base Command Manager solution. For those that are going to be managing and working with HPC or AI clusters, this course will give you a head start on understanding a powerful tool for cluster and workload management. Browse Base Command Manager On-site training or Instructor-led remote training sessions via NVIDIA Academy WebEx platform. Both methods include access to hands-on environment. Browse"
year_published = 2025
clearnet = "https://docs.nvidia.com/base-command-manager/index.html"
