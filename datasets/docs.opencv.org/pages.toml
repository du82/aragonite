["https://docs.opencv.org/doc/tutorials/core/table_of_content_core/table_of_content_core.html"]
title = "core module. The Core Functionality — OpenCV 2.4.13.7 documentation"
full_description = "Here you will learn the about the basic building blocks of the library. A must read and know for understanding how to manipulate the images on a pixel level. You’ll find out how to scan images (go through each of the image pixels) with OpenCV. Bonus: time measurement with OpenCV. You’ll find out how to scan images with neighbor access and use the filter2D function to apply kernel filters on images. You will see how to use the FileStorage data structure of OpenCV to write and read data to XML or YAML file format. Did you used OpenCV before its 2.0 version? Do you wanna know what happened with your library with 2.0? Don’t you know how to convert your old OpenCV programs to the new C++ interface? Look here to shed light on all this questions."
year_published = 2025
