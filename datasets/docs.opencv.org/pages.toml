title = "Introduction to OpenCV — OpenCV 2.4.13.7 documentation"
full_description = "Here you can read tutorials about how to set up your computer to work with the OpenCV library. Additionally you can find a few very basic sample source code that will let introduce you to the world of the OpenCV. You will learn what steps you need to perform in order to use the OpenCV library inside a new Microsoft Visual Studio project. Explains how to build and run a simple desktop Java application using Eclipse, Ant or the Simple Build Tool (SBT). If you already have a good grasp on using OpenCV and have made some projects that would be perfect presenting an OpenCV feature not yet part of these tutorials, here it is what you need to know."
