full_description = "Welcome to the official Red Hat Advanced Cluster Security for Kubernetes documentation, where you can learn about Red Hat Advanced Cluster Security for Kubernetes and start exploring its features. To navigate the Red Hat Advanced Cluster Security for Kubernetes documentation, you can use one of the following methods: Installing by using an Operator: Learn how to install Red Hat Advanced Cluster Security for Kubernetes on OpenShift Container Platform by using the Red Hat Advanced Cluster Security for Kubernetes Operator. Installing quickly using Helm charts: Learn how to install Red Hat Advanced Cluster Security for Kubernetes by using Helm charts. Installing quickly by using the roxctl CLI: Learn how to install Red Hat Advanced Cluster Security for Kubernetes by using the roxctl command-line interface (CLI). roxctl is a CLI for running commands on Red Hat Advanced Cluster Security for Kubernetes. Explore various activities you can perform by using Red Hat Advanced Cluster Security for Kubernetes: Viewing the dashboard: Find information about the Red Hat Advanced Cluster Security for Kubernetes real-time interactive dashboard. Learn how to use it to view key metrics from all your hosts, containers, and services. Managing compliance: Understand how to run automated checks and validate compliance based on industry standards, including CIS, NIST, PCI, and HIPAA. Responding to violations: Learn how to view policy violations, drill down to the actual cause of the violation, and take corrective actions. Explore the following typical configuration tasks in Red Hat Advanced Cluster Security for Kubernetes: Adding custom certificates: Learn how to use a custom TLS certificate with Red Hat Advanced Cluster Security for Kubernetes. After you set up a certificate, users and API clients do not have to bypass the certificate security warnings. Backing up Red Hat Advanced Cluster Security for Kubernetes: Learn how to perform manual and automated data backups for Red Hat Advanced Cluster Security for Kubernetes and use these backups for data restoration in the case of an infrastructure disaster or corrupt data."
