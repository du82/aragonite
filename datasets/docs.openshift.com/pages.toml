["https://docs.openshift.com/acs/3.72/welcome/index.html"]
title = "Welcome | About | Red Hat Advanced Cluster Security for Kubernetes 3.72"
full_description = "Welcome to the official Red Hat Advanced Cluster Security for Kubernetes documentation, where you can learn about Red Hat Advanced Cluster Security for Kubernetes and start exploring its features. To navigate the Red Hat Advanced Cluster Security for Kubernetes documentation, you can use one of the following methods: Installation methods for different platforms: Determine the best installation method for your platform. Installing by using an Operator: Learn how to install Red Hat Advanced Cluster Security for Kubernetes on OpenShift Container Platform or a Kubernetes cluster by using the Red Hat Advanced Cluster Security for Kubernetes Operator. This is the recommended installation method for most platforms. Installing using Helm charts: Learn how to install Red Hat Advanced Cluster Security for Kubernetes by using Helm charts. This is the recommended installation method for Amazon Elastic Kubernetes Service (Amazon EKS), Google Kubernetes Engine (Google GKE), and Microsoft Azure Kubernetes Service (Microsoft AKS). Installing by using the roxctl CLI: Learn how to install Red Hat Advanced Cluster Security for Kubernetes by using the roxctl command-line interface (CLI). roxctl is a CLI for running commands on Red Hat Advanced Cluster Security for Kubernetes. Explore various activities you can perform by using Red Hat Advanced Cluster Security for Kubernetes: Viewing the dashboard: Find information about the Red Hat Advanced Cluster Security for Kubernetes real-time interactive dashboard. Learn how to use it to view key metrics from all your hosts, containers, and services. Managing compliance: Understand how to run automated checks and validate compliance based on industry standards, including CIS, NIST, PCI, and HIPAA. Responding to violations: Learn how to view policy violations, drill down to the actual cause of the violation, and take corrective actions. Explore the following typical configuration tasks in Red Hat Advanced Cluster Security for Kubernetes: Adding custom certificates: Learn how to use a custom TLS certificate with Red Hat Advanced Cluster Security for Kubernetes. After you set up a certificate, users and API clients do not have to bypass the certificate security warnings."
