full_description = "Welcome to the official Red Hat Advanced Cluster Security for Kubernetes documentation, where you can learn about Red Hat Advanced Cluster Security for Kubernetes and start exploring its features. To navigate the Red Hat Advanced Cluster Security for Kubernetes documentation, you can use one of the following methods: Installation methods for different platforms: Determine the best installation method for your product and platform. Explore various activities you can perform by using Red Hat Advanced Cluster Security for Kubernetes: Viewing the dashboard: Find information about the Red Hat Advanced Cluster Security for Kubernetes real-time interactive dashboard. Learn how to use it to view key metrics from all your hosts, containers, and services. Managing compliance: Understand how to run automated checks and validate compliance based on industry standards, including CIS, NIST, PCI, and HIPAA. Responding to violations: Learn how to view policy violations, drill down to the actual cause of the violation, and take corrective actions. Explore the following typical configuration tasks in Red Hat Advanced Cluster Security for Kubernetes: Adding custom certificates: Learn how to use a custom TLS certificate with Red Hat Advanced Cluster Security for Kubernetes. After you set up a certificate, users and API clients do not have to bypass the certificate security warnings. Backing up Red Hat Advanced Cluster Security for Kubernetes: Learn how to perform manual and automated data backups for Red Hat Advanced Cluster Security for Kubernetes and use these backups for data restoration in the case of an infrastructure disaster or corrupt data. Configuring automatic upgrades for secured clusters: Stay up to date by automating the upgrade process for each secured cluster. Integrating with PagerDuty: Learn how to integrate with PagerDuty and forward alerts from Red Hat Advanced Cluster Security for Kubernetes to PagerDuty. Integrating with Slack: Learn how to integrate with Slack and forward alerts from Red Hat Advanced Cluster Security for Kubernetes to Slack."
year_published = 2025
clearnet = "https://docs.openshift.com/acs/4.1/welcome/index.html"
