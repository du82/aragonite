["https://docs.openstack.org/api-ref/baremetal"]
title = "Bare Metal API — Ironic API Reference  documentation"
full_description = 'Bare Metal API¶ Show All API versions¶ Concepts¶ In order to bring new features to users over time, the Ironic API supports versioning. There are two kinds of versions in Ironic. ‘’major versions’’, which have dedicated urls. ‘’microversions’’, which can be requested through the use of the X-OpenStack-Ironic-API-Version header or the new standard singular header OpenStack-API-Version: baremetal <version>. The Version APIs work differently from other APIs as they do not require authentication. Upon the Dalmatian release, all API requests support the new standard singular header OpenStack-API-Version: baremetal <version>. If that’s not present, we fall back to the legacy headers. Beginning with the Kilo release, all API requests support the X-OpenStack-Ironic-API-Version header. This header SHOULD be supplied with every request; in the absence of this header, each request is treated as though coming from an older pre-Kilo client. This was done to preserve backwards compatibility as we introduced new features in the server. If you try to use a feature with an API version older than when that feature was introduced the ironic service will respond as would before that feature existed. For example if a new API URL was added, and you try to make a request with an older API version, then you will get a Not Found (404) error, or if a new field was added to an existing API and you request an older API version then you will get an Invalid Parameter response. GET / List API versions detail This fetches all the information about all known major API versions in the deployment. Links to more specific information will be provided for each major API version, as well as information about supported min and max microversions. Normal response codes: 200 Request¶ Response Example¶ Name In Type Description description body string Descriptive text about the Ironic service. versions body array Array of information about currently supported versions. version body string Versioning of this API response, eg. “1.22”. id body string Major API version, eg, “v1” links body array A list of relative links. Includes the self and bookmark links. min_version header string Minimum API microversion supported by this endpoint, eg. “1.1” { "default_version": { "id": "v1", "links": [ { "href": "http://127.0.0.1:6385/v1/", "rel": "self" } ], "min_version": "1.1", "status": "CURRENT", "version": "1.37" }, "description": "Ironic is an OpenStack project which enables the provision and management of baremetal machines.", "name": "OpenStack Ironic API", "versions": [ { "id": "v1", "links": [ { "href": "http://127.0.0.1:6385/v1/", "rel": "self" } ], "min_version": "1.1", "status": "CURRENT", "version": "1.37" } ] } GET /v1/ Show v1 API detail Show all the resources within the Ironic v1 API. Normal response codes: 200 Request¶ Response Example¶ Name In Type Description id body string Major API version, eg, “v1” links body array A list of relative links. Includes the self and bookmark links. openstack-request-id (Optional) header string A unique ID for tracking the request. The request ID associated with the request appears in the log lines for that request. By default, the middleware configuration ensures that the request ID appears in the log files. x-openstack-ironic-api-version header string Specific API microversion used to generate this response. x-openstack-ironic-api-min-version header string Minimum API microversion supported by this endpoint, eg. “1.1” x-openstack-ironic-api-max-version header string Maximum API microversion supported by this endpoint, eg. “1.22” { "chassis": [ { "href": "http://127.0.0.1:6385/v1/chassis/", "rel": "self" }, { "href": "http://127.0.0.1:6385/chassis/", "rel": "bookmark" } ], "drivers": [ { "href": "http://127.0.0.1:6385/v1/drivers/", "rel": "self" }, { "href": "http://127.0.0.1:6385/drivers/", "rel": "bookmark" } ], "heartbeat": [ { "href": "http://127.0.0.1:6385/v1/heartbeat/", "rel": "self" }, { "href": "http://127.0.0.1:6385/heartbeat/", "rel": "bookmark" } ], "id": "v1", "links": [ { "href": "http://127.0.0.1:6385/v1/", "rel": "self" }, { "href": "https://docs.openstack.org/ironic/latest/contributor/webapi.html", "rel": "describedby", "type": "text/html" } ], "lookup": [ { "href": "http://127.0.0.1:6385/v1/lookup/", "rel": "self" }, { "href": "http://127.0.0.1:6385/lookup/", "rel": "bookmark" } ], "media_types": [ { "base": "application/json", "type": "application/vnd.openstack.ironic.v1+json" } ], "nodes": [ { "href": "http://127.0.0.1:6385/v1/nodes/", "rel": "self" }, { "href": "http://127.0.0.1:6385/nodes/", "rel": "bookmark" } ], "portgroups": [ { "href": "http://127.0.0.1:6385/v1/portgroups/", "rel": "self" }, { "href": "http://127.0.0.1:6385/portgroups/", "rel": "bookmark" } ], "ports": [ { "href": "http://127.0.0.1:6385/v1/ports/", "rel": "self" }, { "href": "http://127.0.0.1:6385/ports/", "rel": "bookmark" } ], "volume": [ { "href": "http://127.0.0.1:6385/v1/volume/", "rel": "self" }, { "href": "http://127.0.0.1:6385/volume/", "rel": "bookmark" } ] } Nodes (nodes)¶ List, Searching, Creating, Updating, and Deleting of bare metal Node resources are done through the /v1/nodes resource. There are also several sub-resources, which allow further actions to be performed on a bare metal Node. A Node is the canonical representation of a discretely allocatable server, capable of running an Operating System. Each Node must be associated with a driver; this informs Ironic what protocol to use when managing the Node. Changed in version 1.6: A Node may be referenced both by its UUID and by a unique human-readable “name” in any request. Throughout this documentation, this is referred to as the node_ident. Responses clearly indicate whether a given field is a uuid or a name. Changed in version 1.91: In older API versions, we have a pecan feature enabled that strips .json extensions from the end of a resource reference query and treat it as if it was referenced by just its UUID or node_ident. E.g. 0178-0c2c-9c26-ca69-3011-a9dd.json, is treated as 0178-0c2c-9c26-ca69-3011-a9dd. This feature is now disabled in newer API versions. Depending on the Roles assigned to the authenticated OpenStack User, and upon the configuration of the Bare Metal service, API responses may change. For example, the default value of the “show_password” settings cause all API responses to mask passwords within driver_info with the literal string “******”. POST /v1/nodes Create Node detail Creates a new Node resource. This method requires that a driver be supplied in the request body. Most subresources of a Node (eg, properties, driver_info, etc) may be supplied when the Node is created, or the resource may be updated later. Added in version 1.2: Added available state name, which replaced None as the status of an unprovisioned Node. All clients should be updated to use the new available state name. Nodes in the available state may have workloads provisioned on them; they are “available” for use. Added in version 1.5: Introduced the name field. Added in version 1.7: Introduced the clean_step field. Changed in version 1.11: The default initial state of newly-created Nodes from available to enroll. This provides users a workflow to verify the manageability of a Node and perform necessary operational functions (eg, building a RAID array) before making the Node available for provisioning. Added in version 1.12: Introduced support for the raid_config and target_raid_config fields. Added in version 1.20: Introduced the network_interface field. If this field is not supplied when creating the Node, the default value will be used. Added in version 1.21: Introduced the resource_class field, which may be used to store a resource designation for the proposed OpenStack Placement Engine. This field has no effect within Ironic. Added in version 1.31: Introduced the boot_interface, deploy_interface, management_interface, power_interface, inspect_interface, console_interface, vendor_interface and raid_interface fields. If any of these fields are not supplied when creating the Node, their default value will be used. Changed in version 1.31: If the specified driver is a dynamic driver, then all the interfaces (boot_interface, deploy_interface, etc.) will be set to the default interface for that driver unless another enabled interface is specified in the creation request. Added in version 1.33: Introduced the storage_interface field. If this field is not supplied when creating the Node, the default value will be used. Added in version 1.38: Introduced the rescue_interface field. If this field is not supplied when creating the Node, the default value will be used. Added in version 1.44: Introduced the deploy_step field. Added in version 1.46: Introduced the conductor_group field. Added in version 1.50: Introduced the owner field. Added in version 1.51: Introduced the description field. Added in version 1.52: Introduced the allocation_uuid field. Added in version 1.65: Introduced the lessee field. Added in version 1.82: Introduced the shard field. Normal response codes: 201 Error codes: 400,403,406 Request¶ Name In Type Description boot_interface (Optional) body string The boot interface for a Node, e.g. “pxe”. conductor_group (Optional) body string The conductor group for a node. Case-insensitive string up to 255 characters, containing a-z, 0-9, _, -, and .. console_interface (Optional) body string The console interface for a node, e.g. “no-console”. deploy_interface (Optional) body string The deploy interface for a node, e.g. “iscsi”. disable_power_off (Optional) body boolean If set to true, power off for the node is explicitly disabled, instead, a reboot will be used in place of power on/off. Additionally, when possible, the node will be disabled (i.e., its API agent will be rendered unusable and network configuration will be removed) instead of being powered off. driver_info (Optional) body JSON All the metadata required by the driver to manage this Node. List of fields varies between drivers, and can be retrieved from the /v1/drivers/<DRIVER_NAME>/properties resource. driver body string The name of the driver used to manage this Node. extra (Optional) body object A set of one or more arbitrary metadata key and value pairs. inspect_interface (Optional) body string The interface used for node inspection, e.g. “no-inspect”. management_interface (Optional) body string Interface for out-of-band node management, e.g. “ipmitool”. name (Optional) body string Human-readable identifier for the Node resource. May be undefined. Certain words are reserved. network_interface (Optional) body string Which Network Interface provider to use when plumbing the network connections for this Node. power_interface (Optional) body string Interface used for performing power actions on the node, e.g. “ipmitool”. properties (Optional) body JSON Physical characteristics of this Node. Populated during inspection, if performed. Can be edited via the REST API at any time. raid_interface (Optional) body string Interface used for configuring RAID on this node, e.g. “no-raid”. rescue_interface (Optional) body string The interface used for node rescue, e.g. “no-rescue”. resource_class (Optional) body string A string which can be used by external schedulers to identify this Node as a unit of a specific type of resource. storage_interface (Optional) body string Interface used for attaching and detaching volumes on this node, e.g. “cinder”. uuid (Optional) body string The UUID for the resource. vendor_interface (Optional) body string Interface for vendor-specific functionality on this node, e.g. “no-vendor”. owner (Optional) body string A string or UUID of the tenant who owns the object. description (Optional) body string Informational text about this node. lessee (Optional) body string A string or UUID of the tenant who is leasing the object. shard (Optional) body string A string indicating the shard this node belongs to. automated_clean (Optional) body boolean Indicates whether the node will perform automated clean or not. bios_interface (Optional) body string The bios interface to be used for this node. chassis_uuid (Optional) body string UUID of the chassis associated with this Node. May be empty or None. instance_info (Optional) body JSON Information used to customize the deployed image. May include root partition size, a base 64 encoded config drive, and other metadata. Note that this field is erased automatically when the instance is deleted (this is done by requesting the Node provision state be changed to DELETED). instance_uuid (Optional) body string UUID of the Nova instance associated with this Node. maintenance (Optional) body boolean Whether or not this Node is currently in “maintenance mode”. Setting a Node into maintenance mode removes it from the available resource pool and halts some internal automation. This can happen manually (eg, via an API request) or automatically when Ironic detects a hardware fault that prevents communication with the machine. maintenance_reason (Optional) body string User-settable description of the reason why this Node was placed into maintenance mode network_data (Optional) body JSON Static network configuration in the OpenStack network data format to use during deployment and cleaning. Requires a specially crafted ramdisk, see DHCP-less documentation. parent_node (Optional) body string An optional UUID which can be used to denote the “parent” baremetal node. protected (Optional) body boolean Whether the node is protected from undeploying, rebuilding and deletion. protected_reason (Optional) body string The reason the node is marked as protected. retired (Optional) body boolean Whether the node is retired and can hence no longer be provided, i.e. move from manageable to available, and will end up in manageable after cleaning (rather than available). retired_reason (Optional) body string The reason the node is marked as retired. Example Node creation request with a dynamic driver: { "name": "test_node_dynamic", "driver": "ipmi", "driver_info": { "ipmi_username": "ADMIN", "ipmi_password": "password" }, "power_interface": "ipmitool", "resource_class": "bm-large" } Response¶ The response will contain the complete Node record, with the supplied data, and any defaults added for non-specified fields. Most fields default to “null” or “”. The list and example below are representative of the response as of API microversion 1.95. Name In Type Description uuid body string The UUID for the resource. name (Optional) body string Human-readable identifier for the Node resource. May be undefined. Certain words are reserved. power_state body string The current power state of this Node. Usually, “power on” or “power off”, but may be “None” if Ironic is unable to determine the power state (eg, due to hardware failure). target_power_state body string If a power state transition has been requested, this field represents the requested (ie, “target”) state, either “power on” or “power o'
