["https://docs.openstack.org/api-ref/message"]
title = "Messaging Service API v2 — zaqar  documentation"
full_description = 'Messaging Service API v2¶ This is a reference for the OpenStack Messaging Service API which is provided by the Zaqar project. Show All API Versions¶ The Zaqar API only supports ‘’major versions’’ expressed in request URLs. GET / List major versions detail Gets the home document. This operation gets the home document. The entire API is discoverable from a single starting point, the home document. To explore the entire API, you need to know only this one URI. This document is cacheable. The home document lets you write clients by using relational links, so clients do not have to construct their own URLs. You can click through and view the JSON doc in your browser. For more information about home documents, see http://tools.ietf.org/html/draft-nottingham-json-home-02. Response codes¶ Success¶ Code Reason 300 - Multiple Choices The resource corresponds to more than one representation. Error¶ Code Reason 503 - Service Unavailable The service cannot handle the request right now. Response Parameters¶ Name In Type Description versions body list A list of supported major API versions. Response Example¶ { "versions":[ { "status":"DEPRECATED", "updated":"2014-9-11T17:47:05Z", "media-types":[ { "base":"application/json", "type":"application/vnd.openstack.messaging-v1+json" } ], "id":"1", "links":[ { "href":"/v1/", "rel":"self" } ] }, { "status":"SUPPORTED", "updated":"2014-9-24T04:06:47Z", "media-types":[ { "base":"application/json", "type":"application/vnd.openstack.messaging-v1_1+json" } ], "id":"1.1", "links":[ { "href":"/v1.1/", "rel":"self" } ] }, { "status":"CURRENT", "updated":"2014-9-24T04:06:47Z", "media-types":[ { "base":"application/json", "type":"application/vnd.openstack.messaging-v2+json" } ], "id":"2", "links":[ { "href":"/v2/", "rel":"self" } ] } ] } Queues (queues)¶ Queue is a logical entity that groups messages. Ideally a queue is created per work type. For example, if you want to compress files, you would create a queue dedicated for this job. Any application that reads from this queue would only compress files. Nowadays, queue in Zaqar is most like a topic, it’s created lazily. User can post messages to a queue before creating the queue. Zaqar will create the queue/topic automatically. GET /v2/queues List queues detail Lists queues. A request to list queues when you have no queues in your account returns 204, instead of 200, because there was no information to send back. This operation lists queues for the project. The queues are sorted alphabetically by name. When queue listing , we can add filter in query string parameter to filter queue, like name and metadata. If metadata or name of queue is consistent with the filter,the queue will be listed to the user, otherwise the queue will be filtered. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description limit (Optional) query integer Requests a page size of items. Returns a number of items up to a limit value. Use the limit parameter to make an initial limited request and use the ID of the last-seen item from the response as the marker parameter value in a subsequent limited request. marker (Optional) query string The ID of the last-seen item. Use the limit parameter to make an initial limited request and use the ID of the last-seen item from the response as the marker parameter value in a subsequent limited request. detailed (Optional) query boolean The ‘detailed’ specifies if showing the detailed information when querying queues, flavors and pools. name (Optional) query string The ‘name’ specifies if filter the queues by queue’s name when querying queues. with_count (Optional) query boolean The ‘with_count’ specifies if showing the amount of queues when querying them. Response Parameters¶ Name In Type Description queues body list A list of the queues. links body array Links related to the queues. This is a list of dictionaries, each including keys href and rel. count (Optional) body integer The count attribute specifies how many queus in current project. Response Example¶ { "queues":[ { "href":"/v2/queues/beijing", "name":"beijing" }, { "href":"/v2/queues/london", "name":"london" }, { "href":"/v2/queues/wellington", "name":"wellington" } ], "links":[ { "href":"/v2/queues?marker=wellington", "rel":"next" } ], "count": 3 } PUT /v2/queues/{queue_name} Create queue detail Creates a queue. This operation creates a new queue. The body of the request is empty. queue_name is the name that you give to the queue. The name must not exceed 64 bytes in length, and it is limited to US-ASCII letters, digits, underscores, and hyphens. When create queue, user can specify metadata for the queue. Currently, Zaqar supports below metadata: _flavor, _max_claim_count, _dead_letter_queue, _dead_letter_queue_messages_ttl and _enable_encrypt_messages. In order to support the delayed queues, now add a metadata _default_message_delay. Response codes¶ Success¶ Code Reason 201 - Created Request has been fulfilled and new resource created. 204 - No Content Request fulfilled but service does not return anything. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description queue_name path string The name of the queue. _dead_letter_queue (Optional) body string The target the message will be moved to when the message can’t processed successfully after meet the max claim count. It’s not supported to add queue C as the dead letter queue for queue B where queue B has been set as a dead letter queue for queue A. There is no default value for this attribute. If it’s not set explicitly, then that means there is no dead letter queue for current queue. It is one of the reserved attributes of Zaqar queues. _dead_letter_queue_messages_ttl (Optional) body integer The new TTL setting for messages when moved to dead letter queue. If it’s not set, current TTL will be kept. It is one of the reserved attributes of Zaqar queues. _default_message_delay (Optional) body string The delay of messages defined for a queue. When the messages send to the queue, it will be delayed for some times and means it can not be claimed until the delay expired. And user can define a queue’s level value for delay, also can define a message’s level. The latter has a higher priority. It is one of the reserved attributes of Zaqar queues. _default_message_ttl body integer The default TTL of messages defined for a queue, which will effect for any messages posted to the queue. So when there is no TTL defined for a message, the queue’s _default_message_ttl will be used. By default, the value is the same value defined as ‘’max_message_ttl’’ in zaqar.conf. It is one of the reserved attributes of Zaqar queues. The value will be reverted to the default value after deleting it explicitly. _flavor (Optional) body string The flavor name which can tell Zaqar which storage pool will be used to create the queue. It is one of the reserved attributes of Zaqar queues. _max_claim_count (Optional) body integer The max number the message can be claimed. Generally, it means the message cannot be processed successfully. There is no default value for this attribute. If it’s not set, then that means this feature won’t be enabled for current queue. It is one of the reserved attributes of Zaqar queues. _max_messages_post_size body integer The max post size of messages defined for a queue, which will effect for any messages posted to the queue. So user can define a queue’s level cap for post size which can’t bigger than the max_messages_post_size defined in zaqar.conf. It is one of the reserved attributes of Zaqar queues. The value will be reverted to the default value after deleting it explicitly. _enable_encrypt_messages (Optional) body boolean The switch of encrypting messages for a queue, which will effect for any messages posted to the queue. By default, the value is False. It is one of the reserved attributes of Zaqar queues. Request Example¶ { "_max_messages_post_size": 262144, "_default_message_ttl": 3600, "_default_message_delay": 30, "_dead_letter_queue": "dead_letter", "_dead_letter_queue_messages_ttl": 3600, "_max_claim_count": 10, "_enable_encrypt_messages": true, "description": "Queue for international traffic billing." } This operation does not return a response body. PATCH /v2/queues/{queue_name} Update queue detail Updates a queue. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 404 - Not Found The requested resource could not be found. 409 - Conflict This resource has an action in progress that would conflict with this request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description queue_name path string The name of the queue. When setting the request body of updating queue, the body must be a list which contains a series of json object which follows https://tools.ietf.org/html/draft-ietf-appsawg-json-patch-10. Note The “Content-Type” header should be “application/openstack-messaging-v2.0-json-patch” The ‘’path’’ must start with /metadata, for example, if the key is ‘’ttl’’, then the path should be /metadata/ttl Request Example¶ [ { "op": "replace", "path": "/metadata/max_timeout", "value": 100 } ] Response Example¶ { "max_timeout": 100 } GET /v2/queues/{queue_name} Show queue details detail Shows details for a queue. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description queue_name path string The name of the queue. Response Parameters¶ Name In Type Description _max_messages_post_size body integer The max post size of messages defined for a queue, which will effect for any messages posted to the queue. So user can define a queue’s level cap for post size which can’t bigger than the max_messages_post_size defined in zaqar.conf. It is one of the reserved attributes of Zaqar queues. The value will be reverted to the default value after deleting it explicitly. _default_message_delay body string The delay of messages defined for a queue. When the messages send to the queue, it will be delayed for some times and means it can not be claimed until the delay expired. And user can define a queue’s level value for delay, also can define a message’s level. The latter has a higher priority. It is one of the reserved attributes of Zaqar _default_message_ttl body integer The default TTL of messages defined for a queue, which will effect for any messages posted to the queue. So when there is no TTL defined for a message, the queue’s _default_message_ttl will be used. By default, the value is the same value defined as ‘’max_message_ttl’’ in zaqar.conf. It is one of the reserved attributes of Zaqar queues. The value will be reverted to the default value after deleting it explicitly. _max_claim_count body integer The max number the message can be claimed. Generally, it means the message cannot be processed successfully. There is no default value for this attribute. If it’s not set, then that means this feature won’t be enabled for current queue. It is one of the reserved attributes of Zaqar queues. _dead_letter_queue body string The target the message will be moved to when the message can’t processed successfully after meet the max claim count. It’s not supported to add queue C as the dead letter queue for queue B where queue B has been set as a dead letter queue for queue A. There is no default value for this attribute. If it’s not set explicitly, then that means there is no dead letter queue for current queue. It is one of the reserved attributes _dead_letter_queue_messages_ttl body integer The new TTL setting for messages when moved to dead letter queue. If it’s not set, current TTL will be kept. It is one of the reserved attributes of Zaqar queues. _enable_encrypt_messages (Optional) body boolean The switch of encrypting messages for a queue, which will effect for any messages posted to the queue. By default, the value is False. It is one of the reserved attributes of Zaqar queues. Response Example¶ { "_max_messages_post_size": 262144, "_default_message_ttl": 3600, "description": "Queue used for billing.", "_max_claim_count": 10, "_dead_letter_queue": "dead_letter", "_dead_letter_queue_messages_ttl": 3600, "_enable_encrypt_messages": true } DELETE /v2/queues/{queue_name} Delete queue detail Deletes the specified queue. This operation immediately deletes a queue and all of its existing messages. queue_name is the name that you give to the queue. The name must not exceed 64 bytes in length, and it is limited to US-ASCII letters, digits, underscores, and hyphens. Response codes¶ Success¶ Code Reason 204 - No Content Request fulfilled but service does not return anything. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description queue_name path string The name of the queue. This operation does not accept a request body and does not return a response body. GET /v2/queues/{queue_name}/stats Get queue stats detail Returns statistics for the specified queue. This operation returns queue statistics, including how many messages are in the queue, categorized by status. If the value of the total attribute is 0, then oldest and newest message statistics are not included in the response. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 503 - Service Unavailable The service cannot handle the request right now. Request Parameters¶ Name In Type Description queue_name path string The name of the queue. Response Example¶ { "messages":{ "claimed": 10, "total": 20, "free": 10 } } POST /v2/queues/{queue_name}/share Pre-signed queue detail Create a pre-signed URL for a given queue. Note In the case of pre-signed URLs, the queue cannot be created lazily. This is to prevent cases where queues are deleted and users still have a valid URL. This is not a big issues in cases where there’s just 1 pool. However, if there’s a deployment usi'
