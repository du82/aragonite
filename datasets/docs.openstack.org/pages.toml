title = "OpenStack I18n Guide — I18n Contributor Guide  documentation"
full_description = "[ English | English (United Kingdom) | 한국어 (대한민국) | 中文 (简体, 中国) | Deutsch | Indonesia | 日本語 | русский ] OpenStack I18n Guide¶ Internationalization (I18n) is essential to make OpenStack ubiquitous. The mission of OpenStack I18n team is to make OpenStack ubiquitously accessible to people of all language backgrounds, by enhancing OpenStack software internationalization, providing translation, maintaining a translation platform and managing translation process for better quality of outcomes. This guide provides detailed instructions on the I18n contribution workflow and conventions to be considered by all contributors. Contents¶ Contributing Translations Fixing I18n bugs Translation tools Reporting translation bugs Where can I report a bug? How can I report a bug? Who can help you? Handling translation bugs Translation bugs Bugs in a source project Bugs in tool chains Official OpenStack translator Steps to become a OpenStack translator Active Contributor status in I18n project AC members of I18n project ATC members of I18n project Language Team Roles in a Language Team Managing a Language Team Creating a Language Team I18n SIG Chair Guide Cross Project Liaisons Project Goals And Translation Plan I18n Core Team Launchpad I18n Core Team Release Management Extra-ACs Deadline Daily Work How to check translations Documentation OpenStack Dashboard CLI (command line interface) Server projects Translation tips Where a string is used in source code? Where a string is used in Dashboard UI? Glossary Management Glossary of your language Master glossary Translation Statistics Zanata Stackalytics Tools Zanata CLI Handling documentation projects Handling python projects Handling horizon projects Project maintenance I18n team meeting Meeting agenda Previous meetings IRC web client IRC meeting commands Translation infrastructure Translation jobs Monitoring translation jobs status Translation infrastructure tasks and scripts Debugging job scripts Debugging job scripts