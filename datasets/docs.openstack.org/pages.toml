title = "Large Scale SIG — large-scale 0.0.1.dev37 documentation"
full_description = "Large Scale SIG¶ The aim of the group is to facilitate running OpenStack at large scale, answer questions that OpenStack operators have as they need to scale up and scale out, and help address some of the limitations operators encounter in large OpenStack clusters. The main activities of the SIG are to maintain the Scaling Journey documentation, and produce the Large Scale OpenStack show on Openinfra Live. To join the SIG, you can post on the openstack-discuss mailing-list using the [largescale-sig] prefix. You can also join the Large Scale SIG meeting on OFTC IRC. You can find past meeting logs here. We use this etherpad to propose agenda items for the next meeting. Large-scale journey¶ The Scaling Journey Stage 1: Configure RabbitMQ Database Configuration Guidelines Neutron Configure Stage 2: Monitor FAQ Resources Other SIG work on that stage Stage 3: Scale Up FAQ Resources Other SIG work on that stage Stage 4: Scale Out FAQ Stage 5: Upgrade And Maintain FAQ Large-scale stories¶ Scaling Stories Other¶ Other resources How to make changes to this documentation"
