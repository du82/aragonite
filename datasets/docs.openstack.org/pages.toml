["https://docs.openstack.org/operations-guide"]
title = "OpenStack Operations Guide — operations-guide 2013.2.1.dev1200 documentation"
full_description = "[ English | Indonesia | Deutsch | 日本語 ] OpenStack Operations Guide¶ Important The OpenStack Operations Guide was published in 2014, the last partial update was in 2017. Since then it has seen some minor updates to document newer releases and fix broken links. The guide thus might not apply anymore to current releases. Abstract¶ This guide provides information about operating OpenStack clouds. We recommend that you turn to the Installation Tutorials and Guides, which contains a step-by-step guide on how to manually install the OpenStack packages and dependencies on your cloud. While it is important for an operator to be familiar with the steps involved in deploying OpenStack, we also strongly encourage you to evaluate OpenStack deployment tools and configuration-management tools, such as Puppet or Chef, which can help automate this deployment process. In this guide, we assume that you have successfully deployed an OpenStack cloud and are able to perform basic operations such as adding images, booting instances, and attaching volumes. As your focus turns to stable operations, we recommend that you do skim this guide to get a sense of the content. Some of this content is useful to read in advance so that you can put best practices into effect to simplify your life in the long run. Other content is more useful as a reference that you might turn to when an unexpected event occurs (such as a power failure), or to troubleshoot a particular problem. Contents¶ Acknowledgements Preface Introduction to OpenStack Getting Started with OpenStack Who This Book Is For How This Book Is Organized Why and How We Wrote This Book How to Contribute to This Book Conventions Notices Command prompts Factors affecting OpenStack deployment Security requirements Legal requirements Cloud security architecture Software licensing Planning for deploying and provisioning OpenStack Automated deployment Automated configuration Remote management Other considerations Capacity planni