title = "OpenStack Security Guide — Security Guide  documentation"
full_description = "OpenStack Security Guide¶ Abstract¶ This book provides best practices and conceptual information about securing an OpenStack cloud. Important This guide was last updated during the Train release, documenting the OpenStack Train, Stein, and Rocky releases. It may not apply to EOL releases (for example Newton). We advise that you read this at your own discretion when planning on implementing security measures for your OpenStack cloud. This guide is intended as advice only. The OpenStack Security team is based on voluntary contributions from the OpenStack community. You can contact the security community directly in the #openstack-security channel on OFTC IRC, or by sending mail to the openstack-discuss mailing list with the [security] prefix in the subject header. Contents¶ Conventions Notices Command prompts Introduction Acknowledgements Why and how we wrote this book Introduction to OpenStack Security boundaries and threats Selecting supporting software System documentation System documentation requirements Management Continuous systems management Integrity life-cycle Management interfaces Secure communication Introduction to TLS and SSL TLS proxies and HTTP services Secure reference architectures API endpoints API endpoint configuration recommendations Identity Authentication Authentication methods Authorization Policies Tokens Domains Federated keystone Checklist Dashboard Domain names, dashboard upgrades, and basic web server configuration HTTPS, HSTS, XSS, and SSRF Front-end caching and session back end Static media Passwords Secret key Cookies Cross Origin Resource Sharing (CORS) Debug Checklist Compute Hypervisor selection Hardening the virtualization layers Hardening Compute deployments Vulnerability awareness How to select virtual consoles Checklist Block Storage Volume Wiping Checklist Image Storage Checklist Shared File Systems Introduction Network and security models Security services Share access control Share type access control Policies Checklist Networking Networking architecture Networking services Networking services security best practices Securing OpenStack networking services Checklist Object Storage Network security General service security Securing storage services Securing proxy services Object Storage authentication Other notable items Secrets Management Summary of existing technologies Related Openstack Projects Use Cases Barbican Castellan Frequently Asked Questions Checklist Message queuing Messaging security Data processing Introduction to Data processing Deployment Configuration and hardening Databases Database back end considerations Database access control Database transport security Tenant data privacy Data privacy concerns Data encryption Key management Instance security management Security services for instances Monitoring and logging Forensics and incident response Compliance Compliance overview Understanding the audit process Compliance activities Certification and compliance statements Privacy Security review Architecture page guidance Security Checklist Appendix Community support Glossary"
