["https://docs.openstack.org/api-ref/shared-file-system"]
title = "Shared File Systems API — manila  documentation"
full_description = '''Shared File Systems API¶ This is a reference for version 2 of the OpenStack Shared File Systems API which is provided by the Manila project. Manila provides a RESTful HTTP service through which it offers on-demand, scalable, self-service access to shared file system storage resources. Important Prior to the Wallaby release, Shared File System service required the caller to specify their “project_id” in the API URLs. This requirement has been dropped. The API service now behaves the same way whether or not “project_id” is included in the URLs. If your cloud does not yet support version 2.60, all the resource URLs below will require a project ID. For example: GET /v2/{project_id}/shares Show All API versions¶ Lists information for all Shared File Systems API versions. Concepts¶ In order to bring new features to users over time, the Shared File Systems API supports versioning. There are two kinds of versions in the Shared File Systems API: ‘’major versions’’, which have dedicated URLs ‘’microversions’’, which can be requested through the use of the X-OpenStack-Manila-API-Version header Read more about microversion guidelines that the service adheres to here See A history of the Shared File Systems API versions to view the evolution of the API and pick an appropriate version for API requests. GET / List All Major Versions detail This fetches all the information about all known major API versions in the deployment. Links to more specific information will be provided for each API version, as well as information about supported min and max microversions. Response codes¶ Success¶ Code Reason 300 - Multiple Choices The resource corresponds to more than one representation. Response¶ Name In Type Description versions body array A list of version objects that describe the API versions available. id body string A common name for the version in question. Informative only, it has no real semantic meaning. updated body string A date and time stamp for API versions. This field presents no meaningful information. status body string The status of this API version. This can be one of: CURRENT: this is the preferred version of the API to use SUPPORTED: this is an older, but still supported version of the API DEPRECATED: a deprecated version of the API that is slated for removal links body array Pagination and bookmark links for the resource. media-types body object Media types supported by the API. version body string If this version of the API supports microversions, the maximum microversion that is supported. This will be the empty string if microversions are not supported. min_version body string If this version of the API supports microversions, the minimum microversion that is supported. This will be the empty string if microversions are not supported. Note The updated and media-types parameters in the response are vestigial and provide no useful information. They will probably be deprecated and removed in the future. Response Example¶ This demonstrates the expected response from a bleeding edge server that supports up to the current microversion. When querying OpenStack environments you will typically find the current microversion on the v2.1 API is lower than listed below. { "versions": [ { "status": "DEPRECATED", "updated": "2015-08-27T11:33:21Z", "links": [ { "href": "http://docs.openstack.org/", "type": "text/html", "rel": "describedby" }, { "href": "http://172.18.198.54:8786/v1/", "rel": "self" } ], "min_version": "", "version": "", "media-types": [ { "base": "application/json", "type": "application/vnd.openstack.share+json;version=1" } ], "id": "v1.0" }, { "status": "CURRENT", "updated": "2015-08-27T11:33:21Z", "links": [ { "href": "http://docs.openstack.org/", "type": "text/html", "rel": "describedby" }, { "href": "http://172.18.198.54:8786/v2/", "rel": "self" } ], "min_version": "2.0", "version": "2.15", "media-types": [ { "base": "application/json", "type": "application/vnd.openstack.share+json;version=1" } ], "id": "v2.0" } ] } GET /{api_version}/ Show Details of Specific API Version detail This gets the details of a specific API at it’s root. Nearly all this information exists at the API root, so this is mostly a redundant operation. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Request¶ Name In Type Description api_version path string The API version as returned in the links from the GET / call. Response¶ Name In Type Description version body string The version. id body string A common name for the version in question. Informative only, it has no real semantic meaning. status body string The status of this API version. This can be one of: CURRENT: this is the preferred version of the API to use SUPPORTED: this is an older, but still supported version of the API DEPRECATED: a deprecated version of the API that is slated for removal links body array Pagination and bookmark links for the resource. version body string If this version of the API supports microversions, the maximum microversion that is supported. This will be the empty string if microversions are not supported. updated body string A date and time stamp for API versions. This field presents no meaningful information. min_version body string If this version of the API supports microversions, the minimum microversion that is supported. This will be the empty string if microversions are not supported. media-types body object Media types supported by the API. Note The updated and media-types parameters in the response are vestigial and provide no useful information. They will probably be deprecated and removed in the future. Response Example¶ This is an example of a GET /v2/ on a relatively current server. { "versions": [ { "status": "CURRENT", "updated": "2015-08-27T11:33:21Z", "links": [ { "href": "http://docs.openstack.org/", "type": "text/html", "rel": "describedby" }, { "href": "http://172.18.198.54:8786/v2/", "rel": "self" } ], "min_version": "2.0", "version": "2.15", "media-types": [ { "base": "application/json", "type": "application/vnd.openstack.share+json;version=1" } ], "id": "v2.0" } ] } API extensions¶ Lists available Shared File Systems API extensions. GET /v2/extensions List extensions detail Lists all extensions. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 403 - Forbidden Policy does not allow current user to do this operation. Request¶ Name In Type Description project_id (Optional) path string The project ID of the user or service making the API request. This parameter is optional if the service supports API version 2.60. If the service doesn’t yet support API version 2.60, ensure that the service catalog endpoint obtained for the service has the user’s project_id after the “/v2/” component, for example, the API to retrieve shares is GET /v2/{project_id}/shares. If the service doesn’t yet support API version 2.60, and the project_id is ommitted from the API URL, a Malformed Request error is returned (HTTP 400). Response parameters¶ Name In Type Description name body string The name of the extension. For example, “Fox In Socks.” links body array The extension links. description body string The description of the extension API. alias body string The alias for the extension. For example, “FOXNSOX”, “os-availability-zone”, “os-extended-quotas”, “os- share-unmanage”, or “os-used-limits”. updated body string The date and time stamp when the extension API was last updated. The date and time stamp format is ISO 8601: ::CCYY-MM-DDThh:mm:ss±hh:mm The ±hh:mm value, if included, returns the time zone as an offset from UTC. For example, 2015-08-27T09:49:58-05:00. Response example¶ { "extensions": [ { "alias": "os-extended-quotas", "updated": "2013-06-09T00:00:00+00:00", "name": "ExtendedQuotas", "links": [], "description": "Extend quotas. Adds ability for admins to delete quota and optionally force the update Quota command." }, { "alias": "os-quota-sets", "updated": "2011-08-08T00:00:00+00:00", "name": "Quotas", "links": [], "description": "Quotas management support." }, { "alias": "os-quota-class-sets", "updated": "2012-03-12T00:00:00+00:00", "name": "QuotaClasses", "links": [], "description": "Quota classes management support." }, { "alias": "os-share-unmanage", "updated": "2015-02-17T00:00:00+00:00", "name": "ShareUnmanage", "links": [], "description": "Enable share unmanage operation." }, { "alias": "os-types-manage", "updated": "2011-08-24T00:00:00+00:00", "name": "TypesManage", "links": [], "description": "Types manage support." }, { "alias": "share-actions", "updated": "2012-08-14T00:00:00+00:00", "name": "ShareActions", "links": [], "description": "Enable share actions." }, { "alias": "os-availability-zone", "updated": "2015-07-28T00:00:00+00:00", "name": "AvailabilityZones", "links": [], "description": "Describe Availability Zones." }, { "alias": "os-user-quotas", "updated": "2013-07-18T00:00:00+00:00", "name": "UserQuotas", "links": [], "description": "Project user quota support." }, { "alias": "os-share-type-access", "updated": "2015-03-02T00:00:00Z", "name": "ShareTypeAccess", "links": [], "description": "share type access support." }, { "alias": "os-types-extra-specs", "updated": "2011-08-24T00:00:00+00:00", "name": "TypesExtraSpecs", "links": [], "description": "Type extra specs support." }, { "alias": "os-admin-actions", "updated": "2015-08-03T00:00:00+00:00", "name": "AdminActions", "links": [], "description": "Enable admin actions." }, { "alias": "os-used-limits", "updated": "2014-03-27T00:00:00+00:00", "name": "UsedLimits", "links": [], "description": "Provide data on limited resources that are being used." }, { "alias": "os-services", "updated": "2012-10-28T00:00:00-00:00", "name": "Services", "links": [], "description": "Services support." }, { "alias": "os-share-manage", "updated": "2015-02-17T00:00:00+00:00", "name": "ShareManage", "links": [], "description": "Allows existing share to be 'managed' by Manila." } ] } Limits¶ Limits are the resource limitations that are allowed for each tenant (project). An administrator can configure limits in the manila.conf file. Users can query their rate and absolute limits. The absolute limits contain information about: Total maximum share memory, in GiBs. Number of share-networks. Number of share-snapshots. Number of shares. Shares and total used memory, in GiBs. Snapshots and total used memory, in GiBs. Number of share replicas (since API version 2.53). Share replicas and total used memory, in GiBs (since API version 2.53). Rate limits control the frequency at which users can issue specific API requests. Administrators use rate limiting to configure limits on the type and number of API calls that can be made in a specific time interval. For example, a rate limit can control the number of GET requests that can be processed during a one-minute period. GET /v2/limits List share limits detail Lists share limits. Response codes¶ Success¶ Code Reason 200 - OK Request was successful. Error¶ Code Reason 400 - Bad Request Some content in the request was invalid. 401 - Unauthorized User must authenticate before making a request. 403 - Forbidden Policy does not allow current user to do this operation. Request¶ Name In Type Description project_id (Optional) path string The project ID of the user or service making the API request. This parameter is optional if the service supports API version 2.60. If the service doesn’t yet support API version 2.60, ensure that the service catalog endpoint obtained for the service has the user’s project_id after the “/v2/” component, for example, the API to retrieve shares is GET /v2/{project_id}/shares. If the service doesn’t yet support API version 2.60, and the project_id is ommitted from the API URL, a Malformed Request error is returned (HTTP 400). Response parameters¶ Name In Type Description maxTotalShareGigabytes body integer The total maximum number of share gigabytes that are allowed in a project. You cannot request a share that exceeds the allowed gigabytes quota. maxTotalSnapshotGigabytes body integer The total maximum number of snapshot gigabytes that are allowed in a project. maxTotalShares body integer The total maximum number of shares that are allowed in a project. maxTotalShareSnapshots body integer The total maximum number of share snapshots that are allowed in a project. maxTotalShareNetworks body integer The total maximum number of share-networks that are allowed in a project. maxTotalShareReplicas body integer The maximum number of share replicas that is allowed. New in version 2.53 maxTotalReplicaGigabytes body integer The maximum number of replica gigabytes that are allowed in a project. You cannot create a share, share replica, manage a share or extend a share if it is going to exceed the allowed replica gigabytes quota. New in version 2.53 maxTotalShareBackups body integer The total maximum number of share backups that are allowed in a project. New in version 2.80 maxTotalBackupGigabytes body integer The total maximum number of backup gigabytes that are allowed in a project. New in version 2.80 totalSharesUsed body integer The total number of created shares in a project. totalShareSnapshotsUsed body integer The total number of created share snapshots in a project. totalShareNetworksUsed body integer The total number of created share-networks in a project. totalShareGigabytesUsed body integer The total number of gigabytes used in a project by shares. totalSnapshotGigabytesUsed body integer The total number of gigabytes used in a project by snapshots. totalShareReplicasUsed body integer The total number of created share replicas in a project. totalReplicaGigabytesUsed body integer The total number of replica gigabytes used in a project by share replicas. totalShareBackupsUsed body integer The total number of created share backups in a project. totalBackupGigabytesUsed body integer The total number of gigabytes used in a project by backups. uri (Optional) body string A human-readable URI of a rate limit. regex (Optional) body string An API regular expression. For example, ^/shares for the /shares API URI or .* for any URI. value (Optional) body integer The number of API requests that are allowed during a time interval. Used in conjunction with the unit parameter, expressed as value per unit. For example, 120 requests are allowed per minute. verb (Optional) body string The HTTP method for the API request. For example, GET, POST, DELETE, and so on. remaining (Optional) body integer The remaining number of allowed requests. unit (Optional) body string The time interval during which a number of API requests are allowed. A valid value is SECOND, MINUTE, HOUR, or DAY. Used in conjunction with the value parameter, expressed as value per unit. For example, 120 requests are allowed per minute. next-available (Optional) body string The date and time stamp when next iss'''
