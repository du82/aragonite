["https://docs.openstack.org/api-ref/object-store"]
title = "Object Storage API — swift  documentation"
full_description = 'Object Storage API¶ Show All Discoverability¶ If configured, lists the activated capabilities for this version of the OpenStack Object Storage API. GET /info List activated capabilities detail Lists the activated capabilities for this version of the OpenStack Object Storage API. Most of the information is “public” i.e. visible to all callers. However, some configuration and capability items are reserved for the administrators of the system. To access this data, the swiftinfo_sig and swiftinfo_expires query parameters must be added to the request. Normal response codes: 200 Error response codes: Request¶ Name In Type Description swiftinfo_sig (Optional) query string A hash-based message authentication code (HMAC) that enables access to administrator-only information. To use this parameter, the swiftinfo_expires parameter is also required. swiftinfo_expires (Optional) query integer The time at which swiftinfo_sig expires. The time is in UNIX Epoch time stamp format. Response Example¶ { "swift": { "version": "1.11.0" }, "slo": { "max_manifest_segments": 1000, "max_manifest_size": 2097152, "min_segment_size": 1 }, "staticweb": {}, "tempurl": {} } Accounts¶ Lists containers for an account. Creates, updates, shows, and deletes account metadata. For more information and concepts about accounts see Object Storage API overview. GET /v1/{account} Show account details and list containers detail Shows details for an account and lists containers, sorted by name, in the account. The sort order for the name is based on a binary comparison, a single built-in collating sequence that compares string data by using the SQLite memcmp() function, regardless of text encoding. See Collating Sequences. The response body returns a list of containers. The default response (text/plain) returns one container per line. If you use query parameters to page through a long list of containers, you have reached the end of the list if the number of items in the returned list is less than the request limit value. The list contains more items if the number of items in the returned list equals the limit value. When asking for a list of containers and there are none, the response behavior changes depending on whether the request format is text, JSON, or XML. For a text response, you get a 204 , because there is no content. However, for a JSON or XML response, you get a 200 with content indicating an empty array. Example requests and responses: Show account details and list containers and ask for a JSON response: curl -i $publicURL?format=json -X GET -H "X-Auth-Token: $token" HTTP/1.1 200 OK Content-Length: 96 X-Account-Object-Count: 1 X-Timestamp: 1389453423.35964 X-Account-Meta-Subject: Literature X-Account-Bytes-Used: 14 X-Account-Container-Count: 2 Content-Type: application/json; charset=utf-8 Accept-Ranges: bytes X-Trans-Id: tx274a77a8975c4a66aeb24-0052d95365 X-Openstack-Request-Id: tx274a77a8975c4a66aeb24-0052d95365 Date: Fri, 17 Jan 2014 15:59:33 GMT [ { "count": 0, "bytes": 0, "name": "janeausten", "last_modified": "2013-11-19T20:08:13.283452" }, { "count": 1, "bytes": 14, "name": "marktwain", "last_modified": "2016-04-29T16:23:50.460230" } ] Show account details and list containers and ask for an XML response: curl -i $publicURL?format=xml -X GET -H "X-Auth-Token: $token" HTTP/1.1 200 OK Content-Length: 262 X-Account-Object-Count: 1 X-Timestamp: 1389453423.35964 X-Account-Meta-Subject: Literature X-Account-Bytes-Used: 14 X-Account-Container-Count: 2 Content-Type: application/xml; charset=utf-8 Accept-Ranges: bytes X-Trans-Id: tx69f60bc9f7634a01988e6-0052d9544b X-Openstack-Request-Id: tx69f60bc9f7634a01988e6-0052d9544b Date: Fri, 17 Jan 2014 16:03:23 GMT <?xml version="1.0" encoding="UTF-8"?> <account name="my_account"> <container> <name>janeausten</name> <count>0</count> <bytes>0</bytes> <last_modified>2013-11-19T20:08:13.283452</last_modified> </container> <container> <name>marktwain</name> <count>1</count> <bytes>14</bytes> <last_modified>2016-04-29T16:23:50.460230</last_modified> </container> </account> If the request succeeds, the operation returns one of these status codes: OK (200). Success. The response body lists the containers. No Content (204). Success. The response body shows no containers. Either the account has no containers or you are paging through a long list of names by using the marker, limit, or end_marker query parameter and you have reached the end of the list. Normal response codes: 200 Error response codes:204, Request¶ Name In Type Description account (Optional) path string The unique name for the account. An account is also known as the project or tenant. limit (Optional) query integer For an integer value n , limits the number of results to n . marker (Optional) query string For a string value, x , constrains the list to items whose names are greater than x. end_marker (Optional) query string For a string value, x , constrains the list to items whose names are less than x. format (Optional) query string The response format. Valid values are json, xml, or plain. The default is plain. If you append the format=xml or format=json query parameter to the storage account URL, the response shows extended container information serialized in that format. If you append the format=plain query parameter, the response lists the container names separated by newlines. prefix (Optional) query string Only objects with this prefix will be returned. When combined with a delimiter query, this enables API users to simulate and traverse the objects in a container as if they were in a directory tree. delimiter (Optional) query string The delimiter is a single character used to split object names to present a pseudo-directory hierarchy of objects. When combined with a prefix query, this enables API users to simulate and traverse the objects in a container as if they were in a directory tree. reverse (Optional) query boolean By default, listings are returned sorted by name, ascending. If you include the reverse=true query parameter, the listing will be returned sorted by name, descending. X-Auth-Token (Optional) header string Authentication token. If you omit this header, your request fails unless the account owner has granted you access through an access control list (ACL). X-Service-Token (Optional) header string A service token. See OpenStack Service Using Composite Tokens for more information. X-Newest (Optional) header boolean If set to true , Object Storage queries all replicas to return the most recent one. If you omit this header, Object Storage responds faster after it finds one valid replica. Because setting this header to true is more expensive for the back end, use it only when it is absolutely needed. Accept (Optional) header string Instead of using the format query parameter, set this header to application/json, application/xml, or text/xml. X-Trans-Id-Extra (Optional) header string Extra transaction information. Use the X-Trans-Id-Extra request header to include extra information to help you debug any errors that might occur with large object upload and other Object Storage transactions. The server appends the first 32 characters of the X-Trans-Id-Extra request header value to the transaction ID value in the generated X-Trans-Id response header. You must UTF-8-encode and then URL-encode the extra transaction information before you include it in the X-Trans-Id-Extra request header. For example, you can include extra transaction information when you upload large objects such as images. When you upload each segment and the manifest, include the same value in the X-Trans-Id-Extra request header. If an error occurs, you can find all requests that are related to the large object upload in the Object Storage logs. You can also use X-Trans-Id-Extra strings to help operators debug requests that fail to receive responses. The operator can search for the extra information in the logs. Response Parameters¶ Name In Type Description Content-Length header string If the operation succeeds, the length of the response body in bytes. On error, this is the length of the error text. X-Account-Meta-name (Optional) header string The custom account metadata item, where name is the name of the metadata item. One X-Account-Meta-name response header appears for each metadata item (for each name). X-Account-Meta-Temp-URL-Key (Optional) header string The secret key value for temporary URLs. If not set, this header is not returned in the response. X-Account-Meta-Temp-URL-Key-2 (Optional) header string The second secret key value for temporary URLs. If not set, this header is not returned in the response. X-Timestamp header integer The date and time in UNIX Epoch time stamp format when the account, container, or object was initially created as a current version. For example, 1440619048 is equivalent to Mon, Wed, 26 Aug 2015 19:57:28 GMT. X-Trans-Id header string A unique transaction ID for this request. Your service provider might need this value if you report a problem. X-Openstack-Request-Id header string A unique transaction ID for this request. Your service provider might need this value if you report a problem. (same as X-Trans-Id) Date header string The date and time the system responded to the request, using the preferred format of RFC 7231 as shown in this example Thu, 16 Jun 2016 15:10:38 GMT. The time is always in UTC. X-Account-Bytes-Used header integer The total number of bytes that are stored in Object Storage for the account. X-Account-Container-Count header integer The number of containers. X-Account-Object-Count header integer The number of objects in the account. X-Account-Storage-Policy-name-Bytes-Used header integer The total number of bytes that are stored in in a given storage policy, where name is the name of the storage policy. X-Account-Storage-Policy-name-Container-Count header integer The number of containers in the account that use the given storage policy where name is the name of the storage policy. X-Account-Storage-Policy-name-Object-Count header integer The number of objects in given storage policy where name is the name of the storage policy. X-Account-Meta-Quota-Bytes (Optional) header string If present, this is the limit on the total size in bytes of objects stored in the account. Typically this value is set by an administrator. X-Account-Access-Control (Optional) header string Note: X-Account-Access-Control is not supported by Keystone auth. The account access control list (ACL) that grants access to containers and objects in the account. If there is no ACL, this header is not returned by this operation. See Account ACLs for more information. Content-Type header string If the operation succeeds, this value is the MIME type of the list response. The MIME type is determined by the listing format specified by the request and will be one of text/plain, application/json, application/xml, or text/xml. If the operation fails, this value is the MIME type of the error text in the response body. count body integer The number of objects in the container. bytes body integer The total number of bytes that are stored in Object Storage for the account. name body string The name of the container. POST /v1/{account} Create, update, or delete account metadata detail Creates, updates, or deletes account metadata. To create, update, or delete custom metadata, use the X-Account-Meta-{name} request header, where {name} is the name of the metadata item. Account metadata operations work differently than how object metadata operations work. Depending on the contents of your POST account metadata request, the Object Storage API updates the metadata as shown in the following table: Account metadata operations POST request header contains Result A metadata key without a value. The metadata key already exists for the account. The API removes the metadata item from the account. A metadata key without a value. The metadata key does not already exist for the account. The API ignores the metadata key. A metadata key value. The metadata key already exists for the account. The API updates the metadata key value for the account. A metadata key value. The metadata key does not already exist for the account. The API adds the metadata key and value pair, or item, to the account. One or more account metadata items are omitted. The metadata items already exist for the account. The API does not change the existing metadata items. To delete a metadata header, send an empty value for that header, such as for the X-Account-Meta-Book header. If the tool you use to communicate with Object Storage, such as an older version of cURL, does not support empty headers, send the X-Remove-Account- Meta-{name} header with an arbitrary value. For example, X-Remove-Account-Meta-Book: x. The operation ignores the arbitrary value. Note Metadata keys (the name of the metadata) must be treated as case-insensitive at all times. These keys can contain ASCII 7-bit characters that are not control (0-31) characters, DEL, or a separator character, according to HTTP/1.1 . The underscore character is silently converted to a hyphen. Note The metadata value must be UTF-8-encoded and then URL-encoded before you include it in the header. This is a direct violation of the HTTP/1.1 basic rules. Subsequent requests for the same key and value pair overwrite the existing value. If the container already has other custom metadata items, a request to create, update, or delete metadata does not affect those items. This operation does not accept a request body. Example requests and responses: Create account metadata: curl -i $publicURL -X POST -H "X-Auth-Token: $token" -H "X-Account-Meta-Book: MobyDick" -H "X-Account-Meta-Subject: Literature" HTTP/1.1 204 No Content Content-Length: 0 Content-Type: text/html; charset=UTF-8 X-Trans-Id: tx8c2dd6aee35442a4a5646-0052d954fb X-Openstack-Request-Id: tx8c2dd6aee35442a4a5646-0052d954fb Date: Fri, 17 Jan 2014 16:06:19 GMT Update account metadata: curl -i $publicURL -X POST -H "X-Auth-Token: $token" -H "X-Account-Meta-Subject: AmericanLiterature" HTTP/1.1 204 No Content Content-Length: 0 Content-Type: text/html; charset=UTF-8 X-Trans-Id: tx1439b96137364ab581156-0052d95532 X-Openstack-Request-Id: tx1439b96137364ab581156-0052d95532 Date: Fri, 17 Jan 2014 16:07:14 GMT Delete account metadata: curl -i $publicURL -X POST -H "X-Auth-Token: $token" -H "X-Remove-Account-Meta-Subject: x" HTTP/1.1 204 No Content Content-Length: 0 Content-Type: text/html; charset=UTF-8 X-Trans-Id: tx411cf57701424da99948a-0052d9556f X-Openstack-Request-Id: tx411cf57701424da99948a-0052d9556f Date: Fri, 17 Jan 2014 16:08:15 GMT If the request succeeds, the operation returns the No Content (204) response code. To confirm your changes, issue a show account metadata request. Error response codes:204, Request¶ Name In Type Description account (Optional) path string The unique name for the account. An account is also known as the project or tenant. X-Auth-Token (Optional) header string Authentication tok'
