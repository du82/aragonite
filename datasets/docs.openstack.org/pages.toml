["https://docs.openstack.org/api-ref/database"]
title = "Database API — trove  documentation"
full_description = 'Database API¶ Show All API versions¶ Lists information for all Database Service API versions. GET / List versions detail Lists information about all Database Service API versions. No authentication needed. Normal response codes: 200 Response Example¶ { "versions": [ { "id": "v1.0", "links": [ { "href": "http://127.0.0.1:8779/v1.0/", "rel": "self" } ], "status": "CURRENT", "updated": "2012-08-01T00:00:00Z" } ] } Datastores¶ GET /v1.0/{project_id}/datastores List datastores detail Get all the datastores registered in the system Request¶ Name In Type Description project_id path string The project ID of the instance owner. Response Example¶ { "datastores": [ { "default_version": "9e46a201-e92e-4ae0-af89-4af12a21bb45", "id": "75dc45e0-2c3c-47ee-a5b8-5213288e3fe2", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/75dc45e0-2c3c-47ee-a5b8-5213288e3fe2", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/75dc45e0-2c3c-47ee-a5b8-5213288e3fe2", "rel": "bookmark" } ], "name": "mariadb", "versions": [ { "id": "9e46a201-e92e-4ae0-af89-4af12a21bb45", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/versions/9e46a201-e92e-4ae0-af89-4af12a21bb45", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/9e46a201-e92e-4ae0-af89-4af12a21bb45", "rel": "bookmark" } ], "name": "10.4" } ] }, { "default_version": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "id": "3bf89e46-c3ed-4db6-a423-6e6709ec21ef", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/3bf89e46-c3ed-4db6-a423-6e6709ec21ef", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/3bf89e46-c3ed-4db6-a423-6e6709ec21ef", "rel": "bookmark" } ], "name": "mysql", "versions": [ { "id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/versions/b3d5c099-dbd5-4518-baa3-7c7c195671bf", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/b3d5c099-dbd5-4518-baa3-7c7c195671bf", "rel": "bookmark" } ], "name": "5.7" } ] }, { "id": "cc9ee471-e781-43bf-a796-423c5d549997", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/cc9ee471-e781-43bf-a796-423c5d549997", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/cc9ee471-e781-43bf-a796-423c5d549997", "rel": "bookmark" } ], "name": "postgresql", "versions": [ { "id": "4eb0179d-fe11-4556-9422-5267d2fc7625", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "bookmark" } ], "name": "12" } ] } ] } GET /v1.0/{project_id}/datastores/{datastore} Show datastore details detail Shows datastore details Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. Response Example¶ { "datastore": { "id": "cc9ee471-e781-43bf-a796-423c5d549997", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/cc9ee471-e781-43bf-a796-423c5d549997", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/cc9ee471-e781-43bf-a796-423c5d549997", "rel": "bookmark" } ], "name": "postgresql", "versions": [ { "id": "4eb0179d-fe11-4556-9422-5267d2fc7625", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "bookmark" } ], "name": "12" } ] } } DELETE /v1.0/{project_id}/datastores/{datastore} Delete datastore detail Delete a datastore. Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. Datastore Versions¶ GET /v1.0/{project_id}/datastores/{datastore}/versions List datastore versions detail Get all the registered versions for a given datastore Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. Response Example¶ { "versions": [ { "datastore": "cc9ee471-e781-43bf-a796-423c5d549997", "id": "4eb0179d-fe11-4556-9422-5267d2fc7625", "links": [ { "href": "https://127.0.0.1:8779/v1.0/9f8dd5eacb074c9f87d2d822c9092aa5/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/4eb0179d-fe11-4556-9422-5267d2fc7625", "rel": "bookmark" } ], "name": "12", "version": "5.7.29" } ] } GET /v1.0/{project_id}/datastores/{datastore}/versions/{version} Show datastore version detail Get information for a given datastore version(name or ID) Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. version (Optional) path string Name or ID of the datastore version. If there are multiple datastore versions with the same name but different version numbers, ID is needed. Response Example¶ { "version": { "id": "800774c4-0505-4ae7-8cf9-aae131e065ae", "name": "5.7", "version": "5.7", "links": [ { "href": "https://127.0.0.1:8779/v1.0/0600c20b16444bfa979b879b099805a1/datastores/versions/800774c4-0505-4ae7-8cf9-aae131e065ae", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/800774c4-0505-4ae7-8cf9-aae131e065ae", "rel": "bookmark" } ], "datastore": "3423e828-3355-48ef-9c16-5c41e7c196fb", "active": true, "packages": "", "image": null, "registry_ext": "trove.guestagent.datastore.mysql.manager.Manager", "repl_strategy": "trove.guestagent.strategies.replication.mysql_gtid.MysqlGTIDReplication", "image_tags": [ "trove" ] } } GET /v1.0/{project_id}/datastores/{datastore}/versions/{version}/parameters List datastore version configuration parameters detail Get all the config parameters associated with the specified datastore version Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. version (Optional) path string Name or ID of the datastore version. If there are multiple datastore versions with the same name but different version numbers, ID is needed. Response Example¶ { "configuration-parameters": [ { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 1, "min": 0, "name": "autocommit", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 65535, "min": 1, "name": "auto_increment_increment", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 65535, "min": 1, "name": "auto_increment_offset", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 31536000, "min": 1, "name": "wait_timeout", "restart_required": false, "type": "integer" } ] } GET /v1.0/{project_id}/datastores/{datastore}/versions/{version}/parameters/{parameter_name} Show datastore version configuration parameter detail Get the specified config parameter definition. Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore (Optional) path string Name or ID of the data store. version (Optional) path string Name or ID of the datastore version. If there are multiple datastore versions with the same name but different version numbers, ID is needed. parameter_name (Optional) path string The name of the parameter for which to show details. Response Example¶ { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 31536000, "min": 1, "name": "wait_timeout", "restart_required": false, "type": "integer" } GET /v1.0/{project_id}/datastores/versions/{datastore_version_id} Show datastore version detail Get information for a given datastore version ID. Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. Response Example¶ { "version": { "id": "800774c4-0505-4ae7-8cf9-aae131e065ae", "name": "5.7", "version": "5.7", "links": [ { "href": "https://127.0.0.1:8779/v1.0/0600c20b16444bfa979b879b099805a1/datastores/versions/800774c4-0505-4ae7-8cf9-aae131e065ae", "rel": "self" }, { "href": "https://127.0.0.1:8779/datastores/versions/800774c4-0505-4ae7-8cf9-aae131e065ae", "rel": "bookmark" } ], "datastore": "3423e828-3355-48ef-9c16-5c41e7c196fb", "active": true, "packages": "", "image": null, "registry_ext": "trove.guestagent.datastore.mysql.manager.Manager", "repl_strategy": "trove.guestagent.strategies.replication.mysql_gtid.MysqlGTIDReplication", "image_tags": [ "trove" ] } } GET /v1.0/{project_id}/datastores/versions/{datastore_version_id}/parameters List datastore version configuration parameters detail Get all the config parameters associated with the specified datastore version ID. Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. Response Example¶ { "configuration-parameters": [ { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 1, "min": 0, "name": "autocommit", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 65535, "min": 1, "name": "auto_increment_increment", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 65535, "min": 1, "name": "auto_increment_offset", "restart_required": false, "type": "integer" }, { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 31536000, "min": 1, "name": "wait_timeout", "restart_required": false, "type": "integer" } ] } GET /v1.0/{project_id}/datastores/versions/{datastore_version_id}/parameters/{parameter_name} Show datastore version configuration parameter detail Get the specified config parameter definition. Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. parameter_name (Optional) path string The name of the parameter for which to show details. Response Example¶ { "datastore_version_id": "b3d5c099-dbd5-4518-baa3-7c7c195671bf", "max": 31536000, "min": 1, "name": "wait_timeout", "restart_required": false, "type": "integer" } POST /v1.0/{project_id}/mgmt/datastores/versions/{datastore_version_id}/parameters Create datastore version configuration parameters detail Admin only API. Register a configuration parameter for the specified datastore version. The parameter definition contains the type, minimum and maximum values(if type is integer), and whether you must restart the instance after the parameter value is changed. Normal response codes: 200 Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. Request Example¶ { "configuration-parameter": { "name": "connect_timeout", "data_type": "integer", "min_size": 64, "max_size": 65535, "restart_required": 0 } } Response Example¶ { "configuration-parameters": [ { "datastore_version_id": "4eb0179d-fe11-4556-9422-5267d2fc7625", "max": 65535, "min": 64, "name": "connect_timeout", "restart_required": false, "type": "integer" } ] } PUT /v1.0/{project_id}/mgmt/datastores/versions/{datastore_version_id}/parameters/{parameter_name} Update a datastore version configuration parameter detail Admin only API. Update a configuration parameter for the specified datastore version. Normal response codes: 200 Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. parameter_name (Optional) path string The name of the parameter for which to show details. Request Example¶ { "configuration-parameter": { "name": "connect_timeout", "data_type": "integer", "min_size": 64, "max_size": 65535, "restart_required": 1 } } Response Example¶ { "datastore_version_id": "4eb0179d-fe11-4556-9422-5267d2fc7625", "deleted": 0, "deleted_at": null, "max_size": 65535, "min_size": 64, "name": "connect_timeout", "restart_required": true, "type": "integer" } DELETE /v1.0/{project_id}/mgmt/datastores/versions/{datastore_version_id}/parameters/{parameter_name} Delete a datastore version configuration parameter detail Admin only API. Remove a configuration parameter for the specified datastore version. Normal response codes: 204 Request¶ Name In Type Description project_id path string The project ID of the instance owner. datastore_version_id (Optional) path string The UUID of the data store version. parameter_name (Optional) path string The name of the parameter for which to show details. POST /v1.0/{project_id}/mgmt/datastore-versions Create datastore version detail Admin only API. Register a datastore version, the datastore is created automatically if doesn’t exist. It’s allowed to create datastore versions with the same name but different version numbers, or vice versa. Normal response codes: 202 Request¶ Name In Type Description project_id path string The project ID of the instance owner. name body string The name of the datastore version. Different datastore versions can have the same name. datastore_name body string The name of a datastore. datastore_manager body string The type of a datastore. image (Optional) body string The ID of an image. Either image or image_tags needs to be specified when creating datastore version. image_tags (Optional) body array List of image tags. Either image or image_tags needs to be specified when creating datastore version. If the image ID is not provided, the image can be retrieved by the image tags. The tags are used for filtering as a whole rather than separately. Using image tags is more flexible than ID especially when a new guest image is uploaded to Glance, Trove can pick up the latest image automatically for creating instances. When updating, only specifying image_tags could remove image from the datastore version. active body boolean Whether the database version is enabled. default (Optional) body boolean When true this datastore version is created as the default in the datastore. If not specified, for creating, default is false, for updating, it’s ignored. version (Optional) body string The version number for the database. In container based trove instance deployment, the version number is the same as the container image tag, e.g. for MySQL, a valid version number is 5.7.3'
