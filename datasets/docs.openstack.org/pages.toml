title = "Placement API — Placement API Reference  documentation"
full_description = 'Placement API¶ This is a reference for the OpenStack Placement API. To learn more about OpenStack Placement API concepts, please refer to the Placement Introduction. The Placement API uses JSON for data exchange. As such, the Content-Type header for APIs sending data payloads in the request body (i.e. PUT and POST) must be set to application/json unless otherwise noted. Show All Request IDs¶ All logs on the system, by default, include the global request ID and the local request ID when available. The local request ID is a unique ID locally generated by each service, and thus different for each service (Nova, Cinder, Glance, Neutron, etc.) involved in that operation. The format is req- + UUID (UUID4). The global request ID is a user-specified request ID which is utilized as a common identifier by all services. This request ID is same among all services involved in that operation. The format is req- + UUID (UUID4). This allows an administrator to track the API request processing as it transitions between all the different nova services or between nova and other component services called by Nova during that request. Even if specifying a global request ID in a request, users receive always a local request ID as the response. For more details about request IDs, please reference: Faults (It is not for Placement APIs, but there are some common points.) Request Name In Type Description X-Openstack-Request-Id (Optional) header string The global request ID, which is a unique common ID for tracking each request in OpenStack components. The format of the global request ID must be req- + UUID (UUID4). If not in accordance with the format, it is ignored. It is associated with the request and appears in the log lines for that request. By default, the middleware configuration ensures that the global request ID appears in the log files. Response Name In Type Description X-Openstack-Request-Id header string The local request ID, which is a unique ID generated automatically for tracking each request to placement. It is associated with the request and appears in the log lines for that request. By default, the middleware configuration ensures that the local request ID appears in the log files. Errors¶ When there is an error interacting with the placement API, the response will include a few different signals of what went wrong, include the status header and information in the response body. The structure of the JSON body of an error response is defined by the OpenStack errors guideline. HTTP Status CodeThe Status header of the response will include a code, defined by RFC 7231#section-6 that gives a general overview of the problem. This value also shows up in a status attribute in the body of the response. Detail MessageA textual description of the error condition, in a detail attribute. The value is usually the message associated with whatever exception happened within the service. Error CodeWhen the microversion is >=1.23 responses will also include a code attribute in the JSON body. These are documented below. Where a response does not use a specific code placement.undefined_code is present. Note In some cases, for example when keystone is being used and no authentication information is provided in a request (causing a 401 response), the structure of the error response will not match the above because the error is produced by code other than the placement service. Error Codes¶ The defined errors are: Code Meaning placement.undefined_code The default code used when a specific code has not been defined or is not required. placement.inventory.inuse An attempt has been made to remove or shrink inventory that has capacity in use. placement.concurrent_update Another operation has concurrently made a request that involves one or more of the same resources referenced in this request, changing state. The current state should be retrieved to determine if the desired operation should be retried. placement.duplicate_name A resource of this type already exists with the same name, and duplicate names are not allowed. placement.resource_provider.inuse An attempt was made to remove a resource provider, but there are allocations against its inventory. placement.resource_provider.cannot_delete_parent An attempt was made to remove a resource provider, but it has one or more child providers. They must be removed first in order to remove this provider. placement.resource_provider.not_found A resource provider mentioned in an operation involving multiple resource providers, such as Reshaper, does not exist. placement.query.duplicate_key A request included multiple instances of a query parameter that may only be specified once. placement.query.bad_value A value in a request conformed to the schema, but failed semantic validation. placement.query.missing_value A required query parameter is not present in a request. Resource Provider and Consumer Generations¶ Placement handles concurrent requests against the same entity by maintaining a generation for resource providers and consumers. The generation is an opaque value that is updated every time its entity is successfully changed on the server. At appropriate microversions, the generation is returned in responses involving resource providers and/or consumers (allocations), and must be included in requests which make changes to those entities. The server checks to make sure the generation specified in the request matches the internal value. A mismatch indicates that a different request successfully updated that entity in the interim, thereby changing its generation. This will result in an HTTP 409 Conflict response with error code placement.concurrent_update. Depending on the usage scenario, an appropriate reaction to such an error may be to re-GET the entity in question, re-evaluate and update as appropriate, and resubmit the request with the new payload. The following pseudocode is a simplistic example of how one might ensure that a trait is set on a resource provider. Note This is not production code. Aside from not being valid syntax for any particular programming language, it deliberately glosses over details and good programming practices such as error checking, retry limits, etc. It is purely for illustrative purposes. function _is_concurrent_update(resp) { if(resp.status_code != 409) return False return(resp.json()["errors"][0]["code"] == "placement.concurrent_update") } function ensure_trait_on_provider(provider_uuid, trait) { do { path = "/resource_providers/" + provider_uuid + "/traits" get_resp = placement.GET(path) payload = get_resp.json() if(trait in payload["traits"]) return payload["traits"].append(trait) put_resp = placement.PUT(path, payload) } while _is_concurrent_update(put_resp) } API Versions¶ In order to bring new features to users over time, the Placement API supports microversioning. Microversions allow use of certain features on a per-request basis via the OpenStack-API-Version header. For example, to request microversion 1.10, specify the header: OpenStack-API-Version: placement 1.10 For more details about Microversions, please reference: Microversion Specification Note The maximum microversion supported by each release varies. Please reference: REST API Version History for API microversion history details. GET / List Versions detail Fetch information about all known major versions of the placement API, including information about the minimum and maximum microversions. Note At this time there is only one major version of the placement API: version 1.0. Normal Response Codes: 200 Response¶ Name In Type Description versions body array A list of version objects that describe the API versions available. id body string A common name for the version being described. Informative only. min_version body string The minimum microversion that is supported. max_version body string The maximum microversion that is supported. status body string The status of the version being described. With placement this is “CURRENT”. links body array A list of links related to and describing this version. Response Example¶ { "versions" : [ { "min_version" : "1.0", "id" : "v1.0", "max_version" : "1.28", "status": "CURRENT", "links": [ { "href": "", "rel": "self" } ] } ] } Resource Providers¶ Resource providers are entities which provide consumable inventory of one or more classes of resource (such as disk or memory). They can be listed (with filters), created, updated and deleted. GET /resource_providers List resource providers detail List an optionally filtered collection of resource providers. Normal Response Codes: 200 Error response codes: badRequest(400) A 400 BadRequest response code will be returned if a resource class specified in resources request parameter does not exist. Request¶ Several query parameters are available to filter the returned list of resource providers. If multiple different parameters are provided, the results of all filters are merged with a boolean AND. Name In Type Description name (Optional) query string The name of a resource provider to filter the list. uuid (Optional) query string The uuid of a resource provider. member_of (Optional) query string A string representing an aggregate uuid; or the prefix in: followed by a comma-separated list of strings representing aggregate uuids. The returned resource providers must directly be associated with at least one of the aggregates identified by uuid: member_of=5e08ea53-c4c6-448e-9334-ac4953de3cfa member_of=in:42896e0d-205d-4fe3-bd1e-100924931787,5e08ea53-c4c6-448e-9334-ac4953de3cfa Starting from microversion 1.24 specifying multiple member_of query string parameters is possible. Multiple member_of parameters will result in filtering providers that are associated with aggregates listed in all of the member_of query string values. For example, to get the providers that are associated with aggregate A as well as associated with any of aggregates B or C, the user could issue the following query: member_of=AGGA_UUID&member_of=in:AGGB_UUID,AGGC_UUID Starting from microversion 1.32 specifying forbidden aggregates is supported in the member_of query string parameter. Forbidden aggregates are prefixed with a !. This negative expression can also be used in multiple member_of parameters: member_of=AGGA_UUID&member_of=!AGGB_UUID would translate logically to “Candidate resource providers must be in AGGA and not in AGGB.” We do NOT support ! on the values within in:, but we support !in:. Both of the following two example queries return candidate resource providers that are NOT in AGGA, AGGB, or AGGC: member_of=!in:AGGA_UUID,AGGB_UUID,AGGC_UUID member_of=!AGGA_UUID&member_of=!AGGB_UUID&member_of=!AGGC_UUID We do not check if the same aggregate uuid is in both positive and negative expression to return 400 BadRequest. We still return 200 for such cases. For example: member_of=AGGA_UUID&member_of=!AGGA_UUID would return an empty list for resource_providers, while: member_of=in:AGGA_UUID,AGGB_UUID&member_of=!AGGA_UUID would return resource providers that are NOT in AGGA but in AGGB. New in version 1.3 resources (Optional) query string A comma-separated list of strings indicating an amount of resource of a specified class that a provider must have the capacity and availability to serve: resources=VCPU:4,DISK_GB:64,MEMORY_MB:2048 Note that the amount must be an integer greater than 0. New in version 1.4 in_tree (Optional) query string A UUID of a resource provider. The returned resource providers will be in the same “provider tree” as the specified provider. New in version 1.14 required (Optional) query string A comma-delimited list of string trait names. Results will be filtered to include only resource providers having all the specified traits. Starting from microversion 1.22 traits which are forbidden from any resource provider may be expressed by prefixing a trait with a !. Starting from microversion 1.39 the required query parameter can be repeated. The trait lists from the repeated parameters are ANDed together. So: required=T1,!T2&required=T3 means T1 and not T2 and T3. Also starting from microversion 1.39 the required parameter supports the syntax: required=in:T1,T2,T3 which means T1 or T2 or T3. Mixing forbidden traits into an in: prefixed value is not supported and rejected. But mixing normal trait list and in: trait list in two query params within the same request is supported. So: required=in:T3,T4&required=T1,!T2 is supported and it means T1 and not T2 and (T3 or T4). New in version 1.18 Response¶ Name In Type Description resource_providers body array A list of resource_provider objects. generation body integer A consistent view marker that assists with the management of concurrent resource provider updates. uuid body string The uuid of a resource provider. links body array A list of links associated with one resource provider. Note Aggregates relationship link is available starting from version 1.1. Traits relationship link is available starting from version 1.6. Allocations relationship link is available starting from version 1.11. name body string The name of one resource provider. parent_provider_uuid body string The UUID of the immediate parent of the resource provider. New in version 1.14 root_provider_uuid body string Read-only UUID of the top-most provider in this provider tree. New in version 1.14 Response Example¶ { "resource_providers": [ { "generation": 1, "uuid": "99c09379-6e52-4ef8-9a95-b9ce6f68452e", "links": [ { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e", "rel": "self" }, { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e/aggregates", "rel": "aggregates" }, { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e/inventories", "rel": "inventories" }, { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e/usages", "rel": "usages" }, { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e/traits", "rel": "traits" }, { "href": "/resource_providers/99c09379-6e52-4ef8-9a95-b9ce6f68452e/allocations", "rel": "allocations" } ], "name": "vgr.localdomain", "parent_provider_uuid": "542df8ed-9be2-49b9-b4db-6d3183ff8ec8", "root_provider_uuid": "542df8ed-9be2-49b9-b4db-6d3183ff8ec8" }, { "generation": 2, "uuid": "d0b381e9-8761-42de-8e6c-bba99a96d5f5", "links": [ { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5", "rel": "self" }, { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5/aggregates", "rel": "aggregates" }, { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5/inventories", "rel": "inventories" }, { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5/usages", "rel": "usages" }, { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5/traits", "rel": "traits" }, { "href": "/resource_providers/d0b381e9-8761-42de-8e6c-bba99a96d5f5/allocations", "rel": "allocations" } ], "name": "pony1", "parent_provider_uuid": null, "root_provider_uuid": "d0b381e9-8761-42de-8e6c-bba99a96d5f5" } ] } PO'
