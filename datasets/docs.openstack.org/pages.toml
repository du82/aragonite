title = "OpenStack Docs: Newton"
full_description = "What is OpenStack? OpenStack is a cloud operating system that controls large pools of compute, storage, and networking resources throughout a datacenter, all managed through a dashboard that gives administrators control while empowering their users to provision resources through a web interface. The Newton release of OpenStack is no longer supported by the community. For more information about the release, refer to the releases web site . Minimal documentation is still published here to assist users running this version. For additional documentation, please refer to a newer release. The most recently released version is 2024.2 and the version in development is 2025.1 . The OpenStack project is provided under the Apache 2.0 license. Openstack.org is powered by VEXXHOST ."
