["https://docs.openstack.org/project-team-guide/stable-branches.html"]
title = "Stable Branches — OpenStack Project Team Guide  documentation"
full_description = "Stable Branches¶ The stable branches are intended to be a safe source of fixes for high impact bugs and security issues which have been fixed on master since a given release. Stable branches are cut from the last release of a given deliverable, at the end of the common 6-month development cycle. Maintenance phases¶ Project stable branches will be in one of the following states: State Time frame Summary Maintained Approximately 18 months All bugfixes (that meet the criteria described below) are appropriate. Releases produced. Unmaintained While there is community interest. Only SLURP releases. All bugfixes (that meet the criteria described below) are appropriate. No Releases produced, reduced CI commitment. End of Life (EOL) N/A Branch no longer accepting changes. It is not required that all projects for a given branch transition between phases at the same time. For example it’s quite reasonable for the stable/$series branch of openstack/long-life-project to still be in the Maintained phase while all other projects have transitioned to either Unmaintained or even End of Life. Note How can I tell what state a branch is in? Current development branchThis is the master branch in a repository. The project’s core team (for example, cinder-core) is responsible for merging changes into this branch. Maintained branchesThese are the stable/$series branches in a repository, for example, stable/2023.1. The project’s stable core team (for example, cinder-stable-maint), which may be a subset of the core team, is responsible for merging changes into Maintained branches. A project’s PTL or release team liaison must acknowledge proposed releases from a Maintained branch, which are then subject to approval by the OpenStack Release Management Team. See Stable maintenance teams for details. Unmaintained branchesThese are the unmaintained/$series branches in a repository, for example, unmaintained/xena. There is a global openstack-unmaintained-core team that is responsible for merging changes into Unmaintained branches. Optionally, an individual project may have a $project-unmaintained-core team (for example, ironic-unmaintained-core) that has this responsibility, and which may override the global team’s approval power on Unmaintained branches. Releases are not allowed from Unmaintained branches. Changes to Unmaintained branches are expected to be Appropriate Fixes as described elsewhere in this document. End of LifeThese do not exist as branches in the code repository, but can be recreated by checking out a $series-eol tag, for example, train-eol. Maintained¶ For any project/branch combination that is considered Maintained, OpenStack Infrastructure, OpenStack Vulnerability Management and QE tools are expected to work and be active. Project teams will produce consumable releases and upgrades are tested. During this phase, per Project Stable teams and the Stable Maintainers are responsible for all projects which asserted they follow the stable branch policy. Unmaintained¶ Note Only SLURP branches are eligible for Unmaintained status. After a branch is no longer in Maintained status, the branch is tagged $series-eom, the stable/$series branch is deleted, and an unmaintained/$series branch is created based on the $series-eom tag. Releases are not allowed from Unmaintained branches. By default, only the latest eligible Unmaintained branch is kept open. To prevent an Unmaintained branch from automatically transitioning to End of Life once a newer eligible branch enters the status, the Unmaintained branch liaison must manually opt-in as described below for each branch. Note An Unmaintained liaison may be appointed by the PTL, but there should not be an expectation on the upstream community team to keep the branch open. Members of the community interested in a given branch are encouraged to engage with the appropriate project team early in its life-cycle to ensure this process runs well. In the absence of identified maintainers the branch will automatically transition to End of Life. To opt-in to keep the Unmaintained branch open, the PTL or Unmaintained liaison must -1 the appropriate patch in the openstack/releases repo to EOL the branch. Please contact the PTL or Unmaintained liaison to show interest in helping keep the branch open with backports and reviews. The patch to EOL the Unmaintained branch will be merged no earlier than one month after its proposal. Even if a PTL or liaison has voted +1 to EOL the branch, the patch must remain open for the full grace period to permit other community members the opportunity to volunteer to take it over. To be eligible to opt-in, a branch must have functional CI including unit tests for the published supported python versions for that OpenStack release. Functional CI means all configured tests pass and do not generate errors in Zuul. Additionally, no SLURP branches may be skipped between the oldest unmaintained branch and the current maintained releases. This makes sure operators have an upgrade path from one SLURP to the next all the way to maintained releases. Note For further details about Unmaintained status, please take a look at the OpenStack Technical Committee’s resolution Unmaintained status replaces Extended Maintenance as amended to define the openstack-unmaintained-core Gerrit Group. Warning Tempest and its plugins are branchless and there is no guarantee that Unmaintained branches will continue to be supported by the master version of tempest or its plugins. Note For more information, see the Tempest Stable Branch Support Policy. If Tempest master starts breaking when testing Unmaintained branches, then we need to use the last compatible version of Tempest and its plugins. To make the last compatible version of Tempest and its plugins available for a particular branch, at the time the branch enters Unmaintained status the Tempest maintainers will release a new tag at a master hash with the name $series-last (as well as a new version number). The maintainers of tempest plugins will also release $series-last tags for each of the plugins. This makes it easy for Tempest consumers who want to continue CI testing of an Unmaintained branch (either upstream or in a production cloud) to identify the last compatible versions of Tempest and its plugins for that branch. It is also more reliable than requiring anyone who wishes to use Tempest on an Unmaintained branch to manually try and find the working version. For an example of creating $series-last tags for Tempest and its plugins, take a look at these Gerrit reviews: https://review.opendev.org/q/topic:%22tempest-plugin-stein-last%22+(status:open%20OR%20status:merged) End of Life¶ After a branch is ineligible to remain active as Unmaintained or a team decides to explicitly end support for a branch, it will become End of Life. The HEAD of the appropriate branch will be tagged as $series-eol and the branch deleted. To initiate this transition, either the PTL of the given project or other stable maintainer should: Send an announcement to the openstack-discuss mailing list (in order to give some time for others to step up as maintainers if there are volunteers). Remove any related zuul jobs that are defined in other repositories and not needed anymore. Propose a patch against the given project/repository. (For example, see: https://review.opendev.org/#/c/677478/) After the branch is tagged with $series-eol, request the Release Management team to delete the branch. Appropriate Fixes¶ Only a limited class of changes are appropriate for inclusion on the stable branch. A number of factors must be weighed when considering a change: The risk of regression: even the tiniest changes carry some risk of breaking something and we really want to avoid regressions on the stable branch The user visible benefit: are we fixing something that users might actually notice and, if so, how important is it? How self-contained the fix is: if it fixes a significant issue but also refactors a lot of code, it’s probably worth thinking about what a less risky fix might look like Whether the fix is already on master and all consequent stable branches: a change must be a backport of a change already merged onto master, unless the change simply does not make sense on master. Same applies to N-2 releases, where N is master, in which case both N-1 and N branches should have the patch merged and so on. Note It’s nevertheless allowed to backport fixes for other bugs if their safety can be easily proved. For example, documentation fixes, debug log message typo corrections, test only changes, patches that enhance test coverage, configuration file content fixes can apply to all supported branches. For those types of backports, stable maintainers will decide on case by case basis. Note Some patches may get exception from rule 4 above. These are patches that do not touch production code, like test-only patches, or tox.ini changes that fix major gate breakage, etc.; or security patches that should not take much time to merge once the patches are published. In those cases, stable patches may be pushed into gate without waiting for all consequent branches to be fixed. Warning In case review process reveals issues in the master patch which require rework after stable patches are merged, it’s expected that additional changes are merged into stable branches to avoid unneeded difference between branches. So use the exception with due care. Anyone can propose stable branch backports. See Proposing Fixes for more information on how to do that. Stable maintenance teams¶ Each project team should designate a stable branch cross-project liaison as the main point of contact for all stable branch support issues in the team. If nobody is specifically designated, the PTL will be assumed to cover that duty. Project-specific teams¶ Each project with a stable branch will have a project-specific stable maintenance Gerrit team called PROJECTNAME-stable-maint. This team will have CodeReview+2 and Workflow+1 rights over the stable branches, and be in charge of reviewing backports for a given project, following the rules of the stable branch policy. That group should be the project Stable Branch core (not necessary to be master core) + the stable maintenance core team. That group is managed by the project team like they manage their master branch core team. To manage that group or stable policies, they can consult with the stable maintenance core team. Stable Maintenance Core team¶ The stable maintenance core team is responsible for the definition and enforcement of the Stable Branch policy. It will be granting exceptions for all questionable backports raised by project-specific stable maintenance groups, providing backports reviews help everywhere, maintaining the stable branch policy (and make sure its rules are respected), educating proposed project-specific team members on those rules and adding them to those project-specific teams. Active Maintenance¶ Project-specific teams are expected to be actively maintaining their stable branches which generally includes: Following the Review guidelines. Specifically, not allowing backports of new features, new dependencies, or backward incompatible changes. Hint: if a project version has a cap in stable branch global-requirements in stable/liberty or later, it means there was a backward incompatible change which broke that stable branch. This generally applies to libraries and client projects. Proactively identifying and backporting significant bug fixes from master to stable branches. This means the team is trying to get high impact bugs fixed on stable before anyone hits them and has to report a bug or propose a backport after the fact (after they already hit the issue in their production cloud). There is no rule about how often or how many bugs found and fixed in master should be backported to stable branches. The main idea is to get regressions and other high-impact issues resolved on all appropriate branches quickly. Monitoring the backlog of open backport reviews and actually reviewing them in a timely manner. Releasing frequently enough to get fixes out without overwhelming the release team or consumers. In general, security fixes and other critical bug fixes should be released quickly. Otherwise when there are a reasonable amount of unreleased fixes committed, teams should be looking at doing a release. Milestone boundaries during the master release schedule are also good times to be inspecting the list of unreleased changes to see if a stable point release should happen. Monitoring and resolving issues in the continuous integration ‘gate’ system. This basically means making sure there aren’t things blocking proposed backports from passing tests. These could be project-specific or global in nature and are usually tracked in the stable tracker etherpad. From time to time the Stable Maintenance Core team may also ask for help from individual projects in IRC or the openstack-discuss mailing list and expect a reasonably prompt response. Note Projects which asserted they follow the stable branch policy should be running the periodic-stable-jobs template in their project’s Zuul configuration file, usually .zuul.yaml (example .zuul.yaml) or zuul.d/project.yaml (example zuul.d/project.yaml). The template is defined in zuul.d/project-templates.yaml in the openstack/openstack-zuul-jobs repo and is maintained by the OpenStack QA team. Stable branch cross-project liaisons should be available in the #openstack-stable channel on OFTC IRC to answer questions or be made aware of issues. Unmaintained branch maintenance¶ Unmaintained branches are not the responsibility of individual project teams (though, of course, there is no prohibition against individual project team members working on Unmaintained branches). Instead, there is a global openstack-unmaintained-core team that has access rights to maintain the CI running on Unmaintained branches, and to merge appropriate changes into Unmaintained branches. Additionally, each project may have (but is not required to have) a Gerrit team called PROJECTNAME-unmaintained-core to handle all work on that project’s Unmaintained branches. This group is managed by the PTL or the Unmaintained branch liaison if there is one. The group is created by proposing an appropriate set of permissions to the project’s Gerrit ACLs in the openstack/project-config repository. See https://review.opendev.org/c/openstack/project-config/+/902796 for an example. Note To become a member of the openstack-unmaintained-core team, first the stable policy has to be understood, as it still applies to unmaintained branches as well. Then contact the group itself and signal the interest of becoming a member of the group and the intention to maintain a project (or multiple projects) and its CI, then the team will decide and grant membership. Review guidelines¶ Each project stable review team need to balance the risk of any given patch with the value that it will "
