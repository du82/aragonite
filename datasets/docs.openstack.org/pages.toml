["https://docs.openstack.org/api-ref/compute"]
title = "Compute API — nova  documentation"
full_description = 'Compute API¶ This is a reference for the OpenStack Compute API which is provided by the Nova project. To learn more about the OpenStack Compute API concepts, please refer to the API guide. Show All API Versions¶ In order to bring new features to users over time, the Nova API supports versioning. There are two kinds of versions in Nova. ‘’major versions’’, which have dedicated urls ‘’microversions’’, which can be requested through the use of the X-OpenStack-Nova-API-Version header, or since microversion 2.27 the OpenStack-API-Version header may also be used. For more details about Microversions, please reference: Microversions Note The maximum microversion supported by each release varies. Please reference: API Microversion History for API microversion history details. The Version APIs work differently from other APIs as they do not require authentication. GET / List All Major Versions detail This fetches all the information about all known major API versions in the deployment. Links to more specific information will be provided for each API version, as well as information about supported min and max microversions. Normal Response Codes: 200 Response¶ Name In Type Description versions body array A list of version objects that describe the API versions available. id body string A common name for the version in question. Informative only, it has no real semantic meaning. links body array Links to the resources in question. See API Guide / Links and References for more info. min_version body string If this version of the API supports microversions, the minimum microversion that is supported. This will be the empty string if microversions are not supported. status body string The status of this API version. This can be one of: CURRENT: this is the preferred version of the API to use SUPPORTED: this is an older, but still supported version of the API DEPRECATED: a deprecated version of the API that is slated for removal updated body string This is a fixed string. It is 2011-01-21T11:33:21Z in version 2.0, 2013-07-23T11:33:21Z in version 2.1. Note It is vestigial and provides no useful information. It will be deprecated and removed in the future. version body string If this version of the API supports microversions, the maximum microversion that is supported. This will be the empty string if microversions are not supported. Response Example¶ This demonstrates the expected response from a bleeding edge server that supports up to the current microversion. When querying OpenStack environments you will typically find the current microversion on the v2.1 API is lower than listed below. { "versions": [ { "id": "v2.0", "links": [ { "href": "http://openstack.example.com/v2/", "rel": "self" } ], "status": "SUPPORTED", "version": "", "min_version": "", "updated": "2011-01-21T11:33:21Z" }, { "id": "v2.1", "links": [ { "href": "http://openstack.example.com/v2.1/", "rel": "self" } ], "status": "CURRENT", "version": "2.97", "min_version": "2.1", "updated": "2013-07-23T11:33:21Z" } ] } GET /{api_version}/ Show Details of Specific API Version detail This gets the details of a specific API at its root. Nearly all this information exists at the API root, so this is mostly a redundant operation. Normal Response Codes: 200 Request¶ Name In Type Description api_version path string The API version as returned in the links from the GET / call. Response¶ Name In Type Description version body string The version. id body string A common name for the version in question. Informative only, it has no real semantic meaning. links body array Links to the resources in question. See API Guide / Links and References for more info. media-types body array The media types. It is an array of a fixed dict. Note It is vestigial and provide no useful information. It will be deprecated and removed in the future. min_version body string If this version of the API supports microversions, the minimum microversion that is supported. This will be the empty string if microversions are not supported. status body string The status of this API version. This can be one of: CURRENT: this is the preferred version of the API to use SUPPORTED: this is an older, but still supported version of the API DEPRECATED: a deprecated version of the API that is slated for removal updated body string This is a fixed string. It is 2011-01-21T11:33:21Z in version 2.0, 2013-07-23T11:33:21Z in version 2.1. Note It is vestigial and provides no useful information. It will be deprecated and removed in the future. version body string If this version of the API supports microversions, the maximum microversion that is supported. This will be the empty string if microversions are not supported. Response Example¶ This is an example of a GET /v2.1/ on a relatively current server. { "version": { "id": "v2.1", "links": [ { "href": "http://openstack.example.com/v2.1/", "rel": "self" }, { "href": "http://docs.openstack.org/", "rel": "describedby", "type": "text/html" } ], "media-types": [ { "base": "application/json", "type": "application/vnd.openstack.compute+json;version=2.1" } ], "status": "CURRENT", "version": "2.97", "min_version": "2.1", "updated": "2013-07-23T11:33:21Z" } } Service URLs¶ All API calls described throughout the rest of this document require authentication with the OpenStack Identity service. After authentication, a base service url can be extracted from the Identity token of type compute. This service url will be the root url that every API call uses to build a full path. For instance, if the service url is http://mycompute.pvt/compute/v2.1 then the full API call for /servers is http://mycompute.pvt/compute/v2.1/servers. Depending on the deployment, the Compute service url might be http or https, a custom port, a custom path, and include your tenant id. The only way to know the urls for your deployment is by using the service catalog. The Compute URL should never be hard coded in applications, even if they are only expected to work at a single site. It should always be discovered from the Identity token. As such, for the rest of this document we will be using short hand where GET /servers really means GET {your_compute_service_url}/servers. Request IDs¶ Users can specify the global request ID in the request header. Users can receive the local request ID in the response header. For more details about Request IDs, please reference: Faults Request Name In Type Description X-Openstack-Request-Id (Optional) header string The global request ID, which is a unique common ID for tracking each request in OpenStack components. The format of the global request ID must be req- + UUID (UUID4). If not in accordance with the format, it is ignored. It is associated with the request and appears in the log lines for that request. By default, the middleware configuration ensures that the global request ID appears in the log files. New in version 2.46 Response Name In Type Description X-Compute-Request-Id header string The local request ID, which is a unique ID generated automatically for tracking each request to nova. It is associated with the request and appears in the log lines for that request. By default, the middleware configuration ensures that the local request ID appears in the log files. Note This header exists for backward compatibility. X-Openstack-Request-Id header string The local request ID, which is a unique ID generated automatically for tracking each request to nova. It is associated with the request and appears in the log lines for that request. By default, the middleware configuration ensures that the local request ID appears in the log files. New in version 2.46 Servers (servers)¶ Lists, creates, shows details for, updates, and deletes servers. Passwords When you create a server, you can specify a password through the optional adminPass attribute. The password must meet the complexity requirements set by your OpenStack Compute provider. The server might enter an ERROR state if the complexity requirements are not met. In this case, a client might issue a change password action to reset the server password. If you do not specify a password, the API generates and assigns a random password that it returns in the response object. This password meets the security requirements set by the compute provider. For security reasons, subsequent GET calls do not require this password. Server metadata You can specify custom server metadata at server launch time. The maximum size for each metadata key-value pair is 255 bytes. The compute provider determines the maximum number of key-value pairs for each server. You can query this value through the maxServerMeta absolute limit. Server networks You can specify one or more networks to which the server connects at launch time. Users can also specify a specific port on the network or the fixed IP address to assign to the server interface. Note You can use both IPv4 and IPv6 addresses as access addresses, and you can assign both addresses simultaneously. You can update access addresses after you create a server. Server personality Note The use of personality files is deprecated starting with the 2.57 microversion. Use metadata and user_data to customize a server instance. To customize the personality of a server instance, you can inject data into its file system. For example, you might insert ssh keys, set configuration files, or store data that you want to retrieve from inside the instance. This customization method provides minimal launch-time personalization. If you require significant customization, create a custom image. Follow these guidelines when you inject files: The maximum size of the file path data is 255 bytes. Encode the file contents as a Base64 string. The compute provider determines the maximum size of the file contents. The image that you use to create the server determines this value. Note The maximum limit refers to the number of bytes in the decoded data and not to the number of characters in the encoded data. The maxPersonality absolute limit defines the maximum number of file path and content pairs that you can supply. The compute provider determines this value. The maxPersonalitySize absolute limit is a byte limit that applies to all images in the deployment. Providers can set additional per-image personality limits. The file injection might not occur until after the server builds and boots. After file injection, only system administrators can access personality files. For example, on Linux, all files have root as the owner and the root group as the group owner, and allow only user and group read access (chmod 440). Server access addresses In a hybrid environment, the underlying implementation might not control the IP address of a server. Instead, the access IP address might be part of the dedicated hardware; for example, a router/NAT device. In this case, you cannot use the addresses that the implementation provides to access the server from outside the local LAN. Instead, the API might assign a separate access address at creation time to provide access to the server. This address might not be directly bound to a network interface on the server and might not necessarily appear when you query the server addresses. However, clients should use an access address to access the server directly. GET /servers List Servers detail Lists IDs, names, and links for servers. By default the servers are filtered using the project ID associated with the authenticated request. Servers contain a status attribute that indicates the current server state. You can filter on the server status when you complete a list servers request. The server status is returned in the response body. The possible server status values are: ACTIVE. The server is active. BUILD. The server has not finished the original build process. DELETED. The server is permanently deleted. ERROR. The server is in error. HARD_REBOOT. The server is hard rebooting. This is equivalent to pulling the power plug on a physical server, plugging it back in, and rebooting it. MIGRATING. The server is being migrated to a new host. PASSWORD. The password is being reset on the server. PAUSED. In a paused state, the state of the server is stored in RAM. A paused server continues to run in frozen state. REBOOT. The server is in a soft reboot state. A reboot command was passed to the operating system. REBUILD. The server is currently being rebuilt from an image. RESCUE. The server is in rescue mode. A rescue image is running with the original server image attached. RESIZE. Server is performing the differential copy of data that changed during its initial copy. Server is down for this stage. REVERT_RESIZE. The resize or migration of a server failed for some reason. The destination server is being cleaned up and the original source server is restarting. SHELVED: The server is in shelved state. Depending on the shelve offload time, the server will be automatically shelved offloaded. SHELVED_OFFLOADED: The shelved server is offloaded (removed from the compute host) and it needs unshelved action to be used again. SHUTOFF. The server is powered off and the disk image still persists. SOFT_DELETED. The server is marked as deleted but the disk images are still available to restore. SUSPENDED. The server is suspended, either by request or necessity. When you suspend a server, its state is stored on disk, all memory is written to disk, and the server is stopped. Suspending a server is similar to placing a device in hibernation and its occupied resource will not be freed but rather kept for when the server is resumed. If a server is infrequently used and the occupied resource needs to be freed to create other servers, it should be shelved. UNKNOWN. The state of the server is unknown. Contact your cloud provider. VERIFY_RESIZE. System is awaiting confirmation that the server is operational after a move or resize. There is whitelist for valid filter keys. Any filter key other than from whitelist will be silently ignored. For non-admin users, whitelist is different from admin users whitelist. The valid whitelist can be configured using the os_compute_api:servers:allow_all_filters policy rule. By default, the valid whitelist for non-admin users includes changes-since flavor image ip ip6 (New in version 2.5) name not-tags (New in version 2.26) not-tags-any (New in version 2.26) reservation_id status tags (New in version 2.26) tags-any (New in version 2.26) changes-before (New in version 2.66) locked (New in version 2.73) availability_zone (New in version 2.83) config_drive (New in version 2.83) key_name (New in version 2.83) created_at (New in version 2.83) launched_at (New in version 2.83) terminated_at (New in version 2.83) power_state (New in version 2.83) task_state (New in version 2.83) vm_state (New in version 2.83) progress (New in version 2.83) user_id (New in version 2.83) For admin user, whitelist includes all filter keys mentioned in Request Section. Note Starting with microversion 2.69 if server details '
