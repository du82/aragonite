["https://docs.pi-hole.net/database"]
title = "Databases - Pi-hole documentation"
full_description = "Databases Pi-hole uses the well-known relational database management system SQLite3 both for its long-term storage of query data and for its domain management. In contrast to many other database management solutions, Pi-hole does not need a server database engine as the database engine is directly embedded in FTLDNS. It seems an obvious choice as it is probably the most widely deployed database engine - it is used today by several widespread web browsers, operating systems, and embedded systems (such as mobile phones), among others. Hence, it is rich in supported platforms and offered features. SQLite implements most of the SQL-92 standard for SQL and can be used for high-level queries. Details concerning the databases, their contained tables and exemplary SQL commands allowing even complex requests to Pi-hole's databases are described on the subpages of this category. Query database /etc/pihole/pihole-FTL.db Domain database /etc/pihole/gravity.db September 25, 2024"
year_published = 2024
clearnet = "https://docs.pi-hole.net/database"
tags = ["advanced", "blocking", "clients", "connecting", "contributing", "database", "databases", "debugging", "docker", "documentation"]
