["https://docs.posit.co/connect/news"]
title = "Posit Connect Release Notes – Posit Connect Documentation Version 2025.02.0"
full_description = 'Posit Connect Release Notes Version 2025.02.0 Published February 26, 2025 Introduction This document contains the notes associated with each release of Posit Connect. Please contact Posit customer support (support@posit.co) with questions about the described changes. Posit Connect 2025.02.0 February 26, 2025 New Bookmark items in the content dashboard to find and access them quickly. Bookmarked content will always appear at the top of the content listing (and search results). Additionally, the content search box and API accept is:bookmarked and not:bookmarked filters in the query. (#29789) Search for content by its configured image using the image keyword (e.g., image:"org/content-base:latest"). This feature is only applicable to Connect installations with Off-Host Execution enabled. (#29868) For improved observability, content-name and owner-guid labels are applied to all content jobs by default. The content-name label is populated by the content’s name field and is unset by default. This feature is only applicable to Connect installations with Off-Host Execution enabled. (#29976) Google OAuth integration templates are available for the Viewer authentication type: Google Sheets (#29769) Google Drive (#29781) Google BigQuery (#29743) The environment variable POSIT_PRODUCT is set during content environment restoration and execution. Its value is set to CONNECT and cannot be customized. The RSTUDIO_PRODUCT environment variable is deprecated in favor of POSIT_PRODUCT. (#29426) Fixed Appropriate error response is returned when serving on-disk resources that do not exist. (#29786) The What’s New feed can be disabled, which may be desirable in environments with restricted connectivity. (#29821) Viewers who cannot request access are directed to the location specified by Server.RootRedirect when attempting to visit content they are not authorized to view. (#29903) Updated software components used by Posit Connect, including responses to the following: (#29773, #29857, #30080) CVE-2025-22866 CVE-2025-22868 CVE-2025-22869 Breaking Connect fails to start if not running as root. This change enforces an existing system requirement documented in the Admin Guide. (#29831) The Google OAuth integration is now the BigQuery OAuth integration. Existing OAuth integrations leveraging the Google template have been updated to BigQuery, but there are no changes to existing integration fields outside of template name. Any references to the google template in Connect Server API workflows will need to be updated to bigquery. (#29743) The run period for content execution schedules cannot exceed 100 years. Changes to content schedules cannot be saved until all fields are valid. (#30016) Posit Connect 2025.01.0 January 30, 2025 New Configure Databricks and Salesforce OAuth integrations with a “Service Account” auth type, which supports client credential OAuth flows. With this integration type, publishers can create interactive or rendered content that uses the credential of a service account or service principal to access protected resources external to Posit Connect, instead of relying on the credentials of a logged-in viewer. See the Admin Guide and the User Guide for more details. (#28857, #29414) Microsoft Graph OAuth integrations are supported, allowing the configuration of either Viewer or Service Account based credentials. See the Admin Guide for details on how to configure a Microsoft Graph integration and the Connect Cookbook for examples in R and Python. (#29544, #29679) SharePoint Online OAuth integrations are supported, allowing the configuration of either Viewer or Service Account based credentials. See the Admin Guide for details on how to configure a SharePoint Online integration and the Connect Cookbook for examples in R and Python. (#29544, #29604, #29671) Automatic use of a visiting user’s Connect API key is configurable for interactive content. This enables an application to dynamically retrieve information from the Connect Server API based on the visitor, rather than the publisher. See the Admin Guide and the User Guide for more details. (#28915) Run and preview non-active content bundles from the Source Versions window. See the User Guide for more details. (#29096) OAuth2 and OpenID Connect authentication supports a OAuth2.PermittedLoginGroup configuration setting which allows administrators to reject OAuth user login and automatic user registration if the user is not a member of a permitted group. This setting does not support Google OAuth. Documentation is provided in the Admin Guide. (#29247) Reference architecture documentation for running Posit Connect on a Kubernetes cluster within Azure is provided in the Admin Guide. (#29226) The OAuth credential exchange endpoint returns an expires_in field when possible. This field can be used by content to determine when to request a fresh token from the credential exchange endpoint. The expires_in field is only available if expiry information is provided by the external OAuth application. See the API Reference for the full documentation of this endpoint. (#28771) Fixed For password authentication, as well as PAM and LDAP/AD providers, users are redirected to the configured Server.RootRedirect path (if set) after successful login, rather than the default {Server.Dashboard}/content/listing path. (#29074) Connect logs an audit entry if an OAuth integration is removed from content due to an ACL setting modification. (#29249) OAuth provider: When Authorization.UserRoleMapping is enabled and OAuth2.RoleClaim contains multiple roles, Connect now maps to the most privileged role. If Authorization.UserRoleMappingRestrictive is enabled, it maps to the least privileged role. Previously, Connect did not handle multiple roles properly and always selected the first role in the list when using OAuth2 authentication. (#29279) Resolved a memory leak associated with product logging. This problem was more pronounced when using the LDAP authentication provider. (#29616) The PATCH /v1/content/{guid} endpoint removes a run_as value when a null or empty value is provided. (#29698) Objects returned by the GET /v1/content/{guid}/jobs and GET /v1/content/{guid}/jobs/{key} endpoints now include the parent content item’s GUID in a field named content_guid and its ID in content_id. The old name for content_id, app_id, is still present but deprecated. (#29462) Objects returned by the DELETE /v1/content/{guid}/jobs/{key} endpoint now include content_id and content_guid fields. The previous names for these fields, app_id and app_guid, are present but deprecated. (#29712) Ephemeral API keys belonging to defunct jobs or users are properly removed. (#29670) Configured Git credentials associated with https://bitbucket.com/ are recognized as associated with Bitbucket and made available when installing R packages. Previously, only https://bitbucket.org/ credentials were recognized as associated with Bitbucket. Requires R.RestoreUsesGitCredentials to be enabled. (#29713) When content ownership is transferred from one user to another with the usermanager transfer CLI, active processes associated with the transferred content are stopped so that resources belonging to the previous owner can be cleaned up. (#29670) Updated software components used by Posit Connect, including responses to the following: (#29438, #27776, #29433, #29512) CVE-2024-45339 CVE-2024-45341 CVE-2024-45336 Posit Connect 2024.12.0 December 19, 2024 New Gradio apps can now be deployed to Posit Connect. See the User Guide for more information. (#28401) Azure and Custom OAuth integrations can now be configured with a “Service Account” auth type, which supports client credential OAuth flows. With this integration type, publishers can create interactive or rendered content that uses the credentials of a service account or service principal to access protected resources external to Posit Connect, instead of relying on the credentials of a logged-in viewer. See the Admin Guide and the User Guide for more details. (#28936, #29188) Salesforce OAuth integrations are now supported. See the Admin Guide for details on how to configure a Salesforce integration and the Connect Cookbook for an example with Streamlit. (#28992) Added Python.AllowUv server configuration setting to allow use of uv pip installer during deployments. Use of uv is disabled by default. (#29174, #28956) Added Python.DefaultPackageManager to allow global adoption of uv pip as default preference during deployments. Deployment manifests can now provide a package_manager.allow_uv=true option to request the use of uv for deployments if available. New capabilities added to content search and filter: The content search box and API now accept negated queries. For example, -type:pin will exclude all Pins from the results. (#29141) Content search now matches search terms anywhere in the name, title, or description of a content item, rather than starting only at word boundaries. This also resolves an issue with searching text in languages that do not separate words with spaces. (#28558) Administrators and content owners can view the list of packages installed for each content item in the Runtime tab of the Content Settings panel. (#29041) Added a validation_description key to the v1/oauth/templates endpoint for better error messaging within the Connect dashboard. Previously the validation regular expression string was displayed when conditions for the field were not met. (#28872) Improved authorization flow for Connect content embedded in a third-party website. When properly configured, auth flow occurs at the top level and redirects back to the original app page. See the Admin Guide for server configuration details, and the User Guide for implementation details. (#28274) The Server.SameSite configuration setting now accepts Strict as an option. Using Strict is not a recommended configuration. Navigating to Posit Connect from other sites may result in an unauthenticated session. (#29056) Fixed Improved error handling in the API by returning more informative errors for invalid JSON input. (#29024) Fixed a bug where OAuth integrations were not saved when adding them to a piece of content being switched off the “Anyone - no login required” access setting. (#29097) Address a problem with migrate db which incorrectly targeted the source instrumentation database. (#29300) Updated software components used by Posit Connect, including responses to the following: (#29043, #29195, #29310) CVE-2024-45337 CVE-2024-45338 Breaking The environment variable CONNECT_CONTENT_SESSION_TOKEN is now included in Applications.ProhibitedEnvironment, preventing users from overriding it. (#28728) Scheduler.MaxConnsPerProcess is now required to be greater than 0. (#29007) Deprecated / Removed The minimum supported PostgreSQL version is now 13.0. The final release of PostgreSQL 12.X was on November 21, 2024. (#27397) Posit Connect 2024.11.0 November 13, 2024 New Google OAuth integrations are now supported. See the Admin Guide for details on how to configure a Google OAuth integration, and the Cookbook for a Python example that interacts with Google BigQuery. (#28620) New and existing OAuth integrations use PKCE (Proof Key for Code Exchange) for the authorization code flow by default. PKCE is required in the upcoming OAuth 2.1 specification, and is recommended in all cases. If necessary, PKCE can be disabled in a custom integration, but this is not recommended. (#26895) The Connect dashboard UI which allows publishers to associate OAuth integrations with their content has been expanded and improved. (#28623) Content Search now accepts a package keyword to find content items with specific package dependencies. (#28228) When viewing the Source Versions modal for Git-backed content, additional data is now provided for each version, including (#28036): a link to the repository, a link to the branch, the commit date, and the commit hash with a link to the commit. Connect sets the SF_PARTNER environment variable for all content. This helps Snowflake identify connections from content hosted by Connect. (#24405) Early Access configuration section to provide opt-in early access to specific features. (#28326) Share links are now available as an Early Access feature API endpoints to get information about installed package dependencies for a content item or for all content items. (#28227, #28230) API endpoints to manage API keys. (#28134) Simplified the workflow to create and manage parameterized content. Changes to parameter override values can be saved without first running the document. (#28246, #6086, #8186, #9960) Python package installations now log the packages requested in requirements.txt. (#28730) Fixed Python FastAPI applications now receive a request scope based on the content URL, making them able to generate absolute URLs that point to the path where they are mounted to. FastAPI lifespan events are now also supported (#28727, #26980) Resolved an issue that could result in deployment log entries appearing in runtime logs (#28310) Resolved a problem with Applications.ViewerOnDemandReports where parameterized report viewers were not able to run that document. (#28457) The Connect dashboard allows an environment variable delete followed by an add of the same variable name. Previously, the variable would need to be directly edited or required a save operation between the delete and add. (#28568) Restored the ability to edit a tag name with a mouse click in the Admin Tag Manager (#28527) Python and Quarto processes log their IDs to the content logs. (#22345) Updated software components used to run interactive worker processes. (#28315, #28646, #28638) Updated software components used by Posit Connect. (#28350, #28351, #28373, #28739) Deprecated / Removed Publishing Jupyter Notebooks via rsconnect-jupyter is no longer supported. Use rsconnect-python to publish notebooks from the command-line, or the Posit Publisher to publish notebooks from VS Code. (#28590) The OAuth integrations template API now supports more robust field and option visibility rules through a new response field called visibility_expression. The visibility field is deprecated in favor of visibility_expression. (#28644) Posit Connect 2024.09.0 September 26, 2024 New GitHub OAuth Integrations are now supported. See the Admin Guide for details on how to configure the integration, and the R and Python Cookbooks for code examples that leverage GitHub resources. (#28213) API keys can now have more restricted user roles, for situations where you may not want your normal user rights and permissions to be available. Administrators can create “publisher” API keys, which are not permitted to perform administration activities. A publisher can use a “viewer” API key to call, for example, a hosted Plumber API; that same key cannot publish content. Existing API keys are given the user role of their owner when Connect is upgraded to this version. For more information, see the User G'
