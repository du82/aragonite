full_description = "Getting StartedInstallation Overview Getting Started Overview This section introduces you to the workflow for installing Posit Connect, managing the server, and performing some initial configuration. Connect can be installed locally, or off-host. In Connect’s local execution model, the Connect application service and all published content execute on the same host. Connect also supports an off-host execution model in which environments are built and content is executed in containers using Kubernetes. Installation Local installation options: Server Installation Multi-Server Installation Off-host installation options: Off-Host Execution"
