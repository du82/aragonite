title = "Install Posit Professional Products – Posit Docs"
description = "This page provides various installation options for installing Posit professional products."
full_description = '<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHBDBW7" height="0" width="0" style="display:none;visibility:hidden"></iframe> Getting StartedInstall Posit Professional Products Install Posit Professional Products This page provides various installation options for installing Posit professional products. Requirements for Posit professional products Posit professional products are applications that run on Linux servers and enable data science workflows across teams. They require: Knowledge of Linux systems Root privileges at installation time and runtime A user authentication scheme Access to the R and/or Python programming languages, and An R and/or Python package repositories For more information on the prerequisites, refer to the Posit professional product requirements. For more information on supported operating systems and versions, refer to the Posit Platform Support page. Configuration and sizing recommendations Posit products have relatively small footprints, and the requirements for running Posit professional products depend mostly on the expected workloads of the end users. Posit recommends installing each product on a separate/dedicated server, and that each server has the required resources in place for each product. For more information on planning and sizing your installation of Posit professional products, refer to the overview of configuration and sizing recommendations. Detailed product requirements Workbench Requirements Connect Requirements Package Manager Requirements The links below provide different options for installing Posit professional products. Posit End User License Agreement This page includes instructions for downloading Posit professional products. Download and/or use of these products is governed under the terms of the Posit End User License Agreement. By downloading you agree to the terms posted there. After completing the initial installation using any option, perform additional configurations and integrations to meet your needs. Installation information Privileges Installation requires sudo access. After installation, refer to this support article for details on run privileges. Team install order The recommended installation order is Package Manager, Connect, Workbench. For provided docker images, see the rstudio-docker-products repository. For convenience, Posit makes R binaries and R package binaries available for supported Linux distributions. For more information on installing R and R packages, refer to the Install R page. For Python, refer to the Install Python page. Network ports If you are looking for a consolidated list of ports used by Posit professional products, please see the Networking page. Storage requirements If you are looking for an overview of Posit product storage requirements and recommendations, please see the Storage page. Install on servers or virtual machines Posit provides professional products as system packages (.rpm and .deb packages for Linux) that can be manually installed to servers or virtual machines in your on-premises or cloud-based environment. Team bundle Posit Team is a bundle that includes Posit Workbench, Posit Connect, and Posit Package Manager. To get stared with the Posit Team bundle, refer to the Posit Team documentation. Individual products To install individual Posit professional products, refer to the following installation guides: Installation guide for Workbench Installation guide for Connect Installation guide for Package Manager Install from cloud marketplaces The cloud marketplace offerings for Posit professional products allow you to purchase Posit professional products through your cloud provider. This provides a quick and easy way to get up and running. Using Posit on AWS SageMaker Posit on Amazon SageMaker is a fully managed solution for Workbench without a traditional installation. You can learn how to initially setup and manage this in the AWS documentation. More details are available in the Posit Workbench Administration Guide and the Using RStudio on Amazon SageMaker: Questions from the Community blog post. Install using Docker images Docker images are available from Docker Hub for each product to give you a starting point for a container-based approach to running Posit professional products: Workbench on Docker Hub Connect on Docker Hub Package Manager on Docker Hub The rstudio-docker-products repository provides details about running the Docker images and includes the Docker files that each product uses. Install in Kubernetes using Helm charts Kubernetes installation and configuration documentation using Posit Helm charts is available in each product guide: Workbench Connect Package Manager Please reference the Posit Helm documentation. Additionally, individual Posit product’s Helm charts have their own documentation: Workbench Connect Package Manager Back to top'
year_published = 2025
clearnet = "https://docs.posit.co/getting-started/index.html"
