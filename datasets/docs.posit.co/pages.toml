["https://docs.posit.co/ide/news"]
title = "RStudio & Posit Workbench Release Notes"
full_description = '<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHBDBW7" height="0" width="0" style="display:none;visibility:hidden"></iframe> Introduction This page provides the release notes associated with each release of RStudio and Posit Workbench. Please contact customer support (support@posit.co) for questions about the described changes. RStudio 2024.12.1 “Kousa Dogwood” Date: 2025-02-13 New RStudio The editor line height can now be customized (via Tools -> Global Options… -> Appearance) [Accessibility]. (#3372) Noto Sans is now used as a fallback proportional font (for RStudio UI elements) on Linux systems. (#15547) Posit Workbench The secret key used to sign browser cookies can now be set via the WORKBENCH_ENCRYPTION_KEY environment variable. (rstudio-pro#7169) Added a warning when the server certificate is self-signed but the certificate authority root is not in the system’s CA store. (rstudio-pro#6813) Added an error when the Launcher port or SSL configuration does not match Workbench’s corresponding configuration. (rstudio-pro#6811) Fixed RStudio Fixed an issue where executing Python code from an R Markdown chunk could cause a crash in rare cases. (#rstudio-pro/7322) Fixed an issue where reformatting a document with unsaved changes when using styler for formatting could lose unsaved changes. (#15568) Fixed an issue where double-clicking a source file to start RStudio didn’t always open the file after starting. (#15536, rstudio-pro#7259) Fixed an issue where double-clicking a file to open it in running RStudio didn’t work with zoomed plot windows. (#15457) Fixed an issue where the RStudio UI stopped working if publishing was disabled in Global Options. (#15561) Reverted support for help.htmltoc with R (>= 4.4); support will be re-evaluated in a future release. (#15531) Fixed an issue where Copilot completions were not provided in Quarto documents. (#15539) Fixed an issue where very large character vectors in the R global environment could make RStudio initialize more slowly. (rstudio-pro#7226) Fixed an issue where the .Rproj.user folder was not marked as hidden for new projects on Windows. (#15514) Fixed an issue where the Files pane could inadverently scroll back to top in some cases. (#15502) Fixed an issue with non-ASCII characters in qmd files showing as “unexpected token.” (#15316) Fixed an issue where chunk highlighting in Sweave documents was incorrect. (#15574) Fixed an issue where code diagnostics were incorrectly applied to un-evaluated R code chunks in visual mode. (#15592) Fixed an issue where RStudio could emit a warning when attempting to retrieve help for R objects without a help page. (rstudio-pro#7063) Posit Workbench Fixed images list in the launcher UI not updating immediately on cluster change for multi-cluster configurations with different image lists. (rstudio-pro#7169) Fixed a regression where editors configured with both a default cluster of “Local” and a default image cause a misconfiguration on session launch. (rstudio-pro#7172, rstudio-pro#7178) Fixed resource profile from a non-Local cluster remaining set for Local cluster when launcher is configured without cgroups support, leading to invalid session launch. (rstudio-pro#7253) Fixed issue with proxying websockets over ssl that could lead to intermittent VS Code session errors. (rstudio-pro#7264) Fixed problems using rstudio-server reload to reload configuration with load balancing enabled. (rstudio-pro#7166, rstudio-pro#5600) Fixed Workbench API support for launching Jupyter sessions. (rstudio-pro#7159) Fixed Workbench API get_session call with a session-id filter. (rstudio-pro#7207) Fixed a regression in the behavior of the auth-proxy-user-header-rewrite setting which allowed conditional rewrites of usernames (rstudio-pro#7324) Fixed issue with using encrypted postgresql password when user provisioning is enabled. (rstudio-pro#7305, rstudio-pro#7248) Fixed an issue in VS Code sessions that caused Workbench to attempt to save massive entries to its database that could slow down servers by moving the vscode-logs-store out of browser storage (rstudio-pro#7369) Upgrade Instructions Posit Workbench Dependencies Updated Electron to version 31.7.7 (#15634) Deprecated / Removed Added a warning about the deprecation of publishing to Posit Cloud. More information: https://pos.it/pc-publishing (rstudio-pro#7008) RStudio 2024.12.0 “Kousa Dogwood” Date: 2024-12-16 New RStudio RStudio now supports the inclusion of environment variables when publishing applications to Posit Connect. (#13032) Available environment variables are now provided as completion suggestions within Sys.unsetenv(). (#15215) RStudio now supports new features from the R graphics engine (groups, glyphs) when supported by the underlying device. (#14613) The .Rproj.user folder location can now be customized globally by both users and administrators. (#15098) RStudio now supports code formatting using the ‘styler’ R package, as well as other external applications. (#2563) The RStudio diagnostics system now supports destructuring assignments as implemented in the dotty package. The “Include all function arguments in the completion list” user preference can be used to control whether RStudio includes function arguments that appear to have already been used in the current context. (#13065) RStudio supports usethis.description option values when creating projects via the RStudio New Project wizard. (#15070) Rename in Scope now operates across chunks within R Markdown and Quarto documents. (#4961) RStudio now respects the chunk ‘dpi’ option when generating plots in R Markdown and Quarto documents. (#11649) RStudio now supports the display of an HTML table of contents for R help files when options(help.htmltoc = TRUE) is set. (#14523) RStudio now includes .env files in the fuzzy finder and displays these files in the Files pane. Quarto documents now have a gear icon for editing cell (chunk) options. (#11745) A “Copy RStudio Version” command has been added to the command palette for copying the RStudio version, commit, and build date to the clipboard. RStudio now supports syntax highlighting for Fortran source files. (#10403) The label “Publish” now appears next to the publish icon on the editor toolbar. (#13604) The font size used for the document outline can now be customized [Accessibility]. (#6887) The www-socket option has been added to rserver.conf to enable the server to listen on a Unix domain socket (#14938; Open-Source Server). The “Insert Chunk” button now acts as a menu in both Quarto and R Markdown documents. (#14785) Improved support for highlighting nested chunks in R Markdown and Quarto documents. (#10079) Improved support for variable-width chunk headers and footers in R Markdown and Quarto documents. (#15191) RStudio now provides executed chunk code as a single multi-line entry in the Console history. (#3520) RStudio now provides snippet completions within function calls and subset calls. (#13441) RStudio now supports zooming the IDE via Meta + NumpadAdd and Meta + NumpadSubtract. (#12242) RStudio now uses lobstr::obj_size() when computing object sizes for display in the Environment pane. (#15369) The RStudio IDE User Guide and the RStudio & Posit Workbench Release Notes have versioned URLs in the Guides drop-down menu in the navigation bar. Additionally, the navigation bar links to the Release Notes and Versions URLs have versioned URLs. (#15223) Posit Workbench Added preview support for Positron Pro sessions on RHEL9 and Ubuntu 22/24. Positron Pro sessions must be manually configured by an admin. (rstudio-pro#6861) Added support for saving Positron Pro state across user logout. (rstudio-pro#6820) Added a feature that prevents Positron Pro and VS Code sessions from starting for insecure (non-SSL/TLS) contexts because they require SSL/TLS for full functionality. (rstudio-pro#3741) Added a session-timeout-kill-hours setting to VS Code and Positron Pro sessions, which terminates sessions after being idle for a set number of hours. There is a known issue that prevents this feature from working correctly with a custom www-root-path. (rstudio-pro#5746) Added the Quarto, Posit Shiny, and Posit Publisher extensions to the default vscode.extensions.conf file for fresh installs. These extensions will be installed automatically for users upon VS Code session launch. (rstudio-pro#6388) Added preview support for setting an active timeout, which logs out users after a period of time, regardless of activity. (rstudio-pro#5815) Added a new session init container that copies session components to the session container, allowing updates to components independent of the session image. The session init container can be enabled in Kubernetes sessions by setting launcher-sessions-auto-update=1 in rserver.conf. Additionally, the init container uses a new multi-platform Linux session components package to support session images across different Linux distributions. (rstudio-pro#6821) Added the auth-user-rewrite-rule setting to rserver.conf. When this option is set in environments with Google OAuth, OpenID, SAML, or Proxied Authentication configured, Workbench will rewrite the username from the authentication provider using the provided regex. (rstudio-pro#2502) Added support for HTTP Proxy variables in rserver and rsession to enable managed credentials features in Workbench environments behind a proxy server. (rstudio-pro#5893) Set Posit Public Package Manager (P3M) as the default for R libraries in RStudio Pro sessions, if no other repository is specified. Package Manager will deliver pre-built binary packages when available, which are faster to install than source packages and don’t require most additional build dependencies. (rstudio-pro#5066) Added support to the Workbench API for registering shell scripts as session hooks that can run when a session starts and stops. (rstudio-pro#6428) Extended the Workbench API, adding support for launching jobs, resuming sessions, and retrieving user lists. Additionally, support for passing in environment variables, session hooks, and a file to open on session load has been added to the launch session endpoint. (rstudio-pro#5066) The Posit Workbench Administration Guide, the Posit Workbench User Guide, and the Posit Workbench Licenses Guide have versioned URLs in the Guides drop-down menu in the navigation bar. (rstudio-pro#6151) The Posit Workbench User Guide underwent a reorganization of how the individual IDE guides are presented. Each guide was migrated from the left-hand navigation to the upper (main) navigation bar. Now, when a guide is selected from the navigation bar, only that guide’s contents display in the left-hand navigation. Additionally, the Posit Workbench guide was renamed to “Workbench Setup” in the navigation bar to prevent confusion between the title of the guide and to create more distinction between the home page of the guide and the Posit Workbench Overview. Lastly, the links for the five IDEs were updated to navigate to the corresponding guide within the Posit Workbench User Guide (instead of the IDE’s external site) and are displayed as buttons. (rstudio-pro#6069) Added an FAQ page to the Reference Architectures section of the Posit Workbench Administration Guide. (rstudio-pro#6645) Re-designed the user experience for configuring managed credentials (rstudio-pro#6748) Added support for using Azure delegated credentials to access DevOps repositories (rstudio-pro#6734) Improved the database migration experience with additional feedback to the admin, logging, and potential error handling (rstudio-pro#6674) Increased default values for rsession-proxy-max-wait-secs and www-thread-pool-size (rstudio-pro#6149) Improved diagnostics for the license manager (rstudio-pro#5932) Added support for reloading the Launcher through systemd (rstudio-pro#3749) Added support for a configurable auth (SAML/OpenID) username re-write rule (rstudio-pro#6987) Migrated Snowflake Native App documentation from Posit Workbench Administration Guide to the Posit Partnerships site. Fixed RStudio “Run All” now only executes R chunks when “Chunk Output in Console” is set. (#11995) Fixed an issue where the chunk options popup didn’t recognize chunk labels preceded by a comma. (#15156) Fixed an issue where the chunk options popup was confused by quoted strings containing spaces. (#6829) Fixed an issue where the chunk options popup was confused by spaces around equals signs. (#2673) Fixed the chunk options popup to work in Visual Mode for non-R chunks. (#15312) Fixed issue where collapsed raw chunks were displayed with an incorrect label in the Visual Editor. (#14594) Fixed an issue where an R Markdown chunk label containing dashes was truncated in Visual Editor. (#15162) Fixed issue with highlight of tikz code chunks in R Markdown documents. (#15019) Fixed an issue where ghost text could not be inserted in non-chunk parts of an R Markdown / Quarto document. (#14507) Fixed an issue where the R session could crash on connect while generating console output. (#15330) Fixed an issue where some output from uv could be rendered blurry in the RStudio Console. (#15282) Fixed an issue where right-clicking on the console history did not present Paste as an option. (#14538) RStudio no longer logs warning / error messages related to disabled R actions (e.g., ReadConsole) in forked sessions. (#15221) Fixed an issue where the Console header label was not properly layed out when other tabs (e.g., Terminal) were closed. (#15106) Fixed Windows Desktop Pro so it starts up after using the Choose R dialog. (rstudio-pro#6062) Fixed an issue with the splash screen appearing on top of the Desktop Pro Manage License. (rstudio-pro#6962) Fixed Mac Desktop Pro so it starts on an ARM (Mx) Mac that doesn’t have Rosetta2 installed. (rstudio-pro#3558) RStudio Desktop now forwards LD_LIBRARY_PATH when detecting available R installations. (#15044) Fixed an issue where attempts to publish to a collaborator’s application could fail to update that application. (#15065) Fixed an issue where the Rename File command did not write unsaved changes before performing the rename. (#15242) Fixed being unable to save file after cancelling the “Choose Encoding” window. (#14896) Fixed problems creating new files and projects on a UNC path. (#14963, #14964; Windows Desktop) Fixed an issue where RStudio could autosave files on blur even while a Save As… modal was active. (#15303) Fixed an issue where the IDE could hang when changing the file type of an R Markdown document. (#15313) Fixed an issue where autocompletion results within piped expressions were incorrect in some cases. (#13611) Fixed an issue where completion types for objects with a .DollarNames method were not properly displayed. (#15115) Fixed an issue where quoted variable names were not completed properly in dplyr pipes. (#15161) Fixed an issue with incorrect completions provided in readline() context. (#15238) Fixed issue where certain Py'
