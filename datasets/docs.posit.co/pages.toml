["https://docs.posit.co/ide/user"]
title = "RStudio IDE User Guide – RStudio User Guide"
description = "Revision 33"
full_description = "RStudio IDE User Guide RStudio is an integrated development environment (IDE) designed to support multiple languages, including both R and Python. Revision 33 Published 2025-02-21 RStudio is available in open source and commercial editions and runs on the desktop (Windows 10+, macOS 13+, and Linux) or in a browser connected to RStudio Server or Posit Workbench. Development of the open source and commercial RStudio IDE variants is supported by Posit Software, PBC (formerly named RStudio, PBC). Please review our Blog post/FAQ for additional information about the rebrand. RStudio includes a console, syntax-highlighting editor that supports direct code execution, and a variety of robust tools for plotting, viewing history, debugging and managing your workspace. Please visit the individual product pages for additional information about the open source RStudio IDE or RStudio within Posit Workbench. Some of the functionality that RStudio provides is: Access RStudio locally. Syntax highlighting, code completion, and smart indentation. Execute R code directly from the source editor. Quickly jump to function definitions. View content changes in real-time with the Visual Markdown Editor for RMarkdown or Quarto documents. Easily manage multiple working directories using Projects. Integrated R help and documentation. View Python data, publish and render in Python and share objects with R. Interactive debugger to diagnose and fix errors. Extensive package development tools. Easily publish apps and reports. About this guide The following documentation helps a user understand the core workflows in RStudio. It provides information for navigating the user interface and appearance, managing R and R packages, working with Python, authoring code or text editing, debugging and diagnostics, using the Visual Editor for Quarto and RMarkdown, reading in data from local and remote sources, and integrations with version control systems and the terminal. Intended audience This guide is intended for RStudio IDE users (e.g., data scientists). Note This guide is intended for RStudio IDE users. Posit Workbench users (e.g., data scientists) can reference the Posit Workbench User Guide. Posit Workbench administrators can reference the Posit Workbench Administrator Guide. Commercial Edition Posit Workbench has several features that differentiate it from the open-source RStudio desktop and RStudio Server, which you can read about on the Posit Workbench comparison page. The main advantages of using Posit Workbench are: Enhanced security and authentication, including Single Sign On (SSO). Run multiple-concurrent sessions. Use multiple different versions of R and Python. Support for multiple IDEs such as VSCode and JupyterLab, in addition to RStudio. Collaborate on projects. Easily connect to shared resources such as databases or mounted file systems. Launch jobs into remote or local clusters using Workbench Jobs. The ability to fine-tune the performance of the user experience. The ability to monitor the performance of sessions/users. A commercial license to remove the restrictions of the AGPL license. Install Links Open Source RStudio Desktop download - available for Windows/Mac/Linux RStudio Server download - available for Linux Commercial Posit Workbench - administration guide for installation and configuration RStudio Desktop Pro - available for Windows/Mac/Linux Daily Builds RStudio Daily builds are intended for testing purposes, and are not recommended for general use. For stable builds, please use one of the above links for Open Source or Commercial downloads. Back to top"
year_published = 2025
clearnet = "https://docs.posit.co/ide/user"
