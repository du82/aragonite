title = "Platform Support – Posit Docs"
full_description = '<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHBDBW7" height="0" width="0" style="display:none;visibility:hidden"></iframe> Platform Support New releases of Posit products and packages support operating systems and browsers listed below until either of the following occurs: (1) the vendor no longer supports them; or (2) new releases of the important software dependencies, such R and Python, no longer support them. All Posit products and packages will follow the same platform support strategy, but there are some differences in what is supported where explicitly noted. Server products RStudio Server; Posit Workbench; Shiny Server; Shiny Server Pro; Posit Connect; Posit Package Manager LinuxBrowsers The x86‑64 operating systems listed below are supported by each product: RStudio Server / RStudio Server ProWorkbenchShiny Server / Shiny Server ProConnectPackage Manager Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Debian 11 Not Scheduled Debian 12 Not Scheduled Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Debian 11 Not Scheduled Debian 12 Not Scheduled Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Debian 12 Not Scheduled Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 1 2 The browsers listed below are supported by each product: RStudio Server / RStudio Server ProWorkbenchShiny Server / Shiny Server ProConnect Vendor Browser Vendor End of Support Date Microsoft Edge Not Scheduled Google Chrome Not Scheduled Apple Safari Not Scheduled Mozilla Firefox Not Scheduled Vendor Browser Vendor End of Support Date Microsoft Edge Not Scheduled Google Chrome Not Scheduled Apple Safari Not Scheduled Mozilla Firefox Not Scheduled Vendor Browser Vendor End of Support Date Microsoft Edge Not Scheduled Google Chrome Not Scheduled Apple Safari Not Scheduled Mozilla Firefox Not Scheduled Vendor Browser Vendor End of Support Date Microsoft Edge Not Scheduled Google Chrome Not Scheduled Apple Safari Not Scheduled Mozilla Firefox Not Scheduled Desktop products RStudio Desktop; RStudio Desktop Pro LinuxWindows / Mac The x86‑64 operating systems listed below are supported by each product: RStudio DesktopRStudio Desktop Pro Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Debian 11 Not Scheduled Debian 12 Not Scheduled Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 Ubuntu 24.04 LTS2 30-Apr-2029 SLES 15 SP62 31-Jul-2031 openSUSE 15.62 31-Jul-2031 Debian 11 Not Scheduled Debian 12 Not Scheduled The x86‑64 operating systems listed below are supported only by the following: Vendor Operating System Vendor End of Support Date Windows 10 14-Oct-2025 Windows 11 Not Scheduled macOS 13 (Ventura) Not Scheduled macOS 14 (Sonoma) Not Scheduled macOS 15 (Sequoia) Not Scheduled Hosted products & Cloud marketplace offerings Hosted: shinyapps.io; Posit Cloud; Academy Cloud marketplace offerings: AWS; Azure; Google Cloud Browsers Vendor Browser Vendor End of Support Date Microsoft Edge Not Scheduled Google Chrome Not Scheduled Apple Safari Not Scheduled Mozilla Firefox Not Scheduled Product add-ons Posit Professional Drivers LinuxWindows / Mac The x86‑64 operating systems listed below are supported: Vendor Operating System Vendor End of Support Date RHEL 81 31-May-2029 RHEL 91 31-May-2032 Ubuntu 20.04 LTS 31-May-2025 Ubuntu 22.04 LTS 30-Apr-2027 SLES 15 SP5 31-Jul-2031 openSUSE 15.5 31-Jul-2031 The x86‑64 desktop operating systems listed below are supported: Vendor Operating System Vendor End of Support Date Windows 10 14-Oct-2025 Windows 11 Not Scheduled macOS 13 (Ventura) Not Scheduled macOS 14 (Sonoma) Not Scheduled Supported integrations Kubernetes Posit professional products support integration with supported versions of Kubernetes. Kubernetes provides a stable, backward-compatible API, and Posit Products rely on major features of the API that are unlikely to be removed. New versions of Posit products will remain compatible with previously released versions of Kubernetes that are still supported, and are extremely likely compatible with newer versions as they release. There are multiple managed Kubernetes offerings. Please consult your vendor’s documentation for their list of supported Kubernetes versions. Slurm Posit professional products support integration of the latest supported versions of Slurm. Posit Products leverage major features of the Slurm API that are not anticipated to be removed. Future Posit product versions will remain compatible with previously released versions of Slurm that are still supported, and likely to be compatible with new Slurm releases. FAQs How does Posit define the vendor end of support date? For RHEL / CentOS, it is the end of their maintenance support phase. For Ubuntu, it is the end of their maintenance updates. For SLES / openSUSE, it is the end of their general support for the major release. Does Posit offer support services beyond the vendor end of support date? No, Posit professional products only receive standard support services through our Support Program up to the vendor end of support date. What products and packages follow our platform support strategy? All Posit products and packages will follow the same platform support strategy, but there are some differences in what is supported where explicitly noted. Back to topFootnotes There are multiple distribution options, such as Rocky Linux, which state they are 1:1 binary compatible with RHEL 8 or RHEL 9. These distributions can be used as long as they stay 1:1 binary compatible with RHEL 8 or RHEL 9, but we will only test and reproduce issues on RHEL 8 or RHEL 9. Furthermore, CentOS Stream is not a 1:1 binary-compatible distribution and so is not supported by Posit.↩︎ The Posit Professional Drivers that can be used with these products are still being tested for Ubuntu 24, SLES SP6, and openSUSE 15.6 compatibility.↩︎'
