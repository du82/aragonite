title = "Licensing – Posit Docs"
full_description = '<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHBDBW7" height="0" width="0" style="display:none;visibility:hidden"></iframe> Getting StartedLicensing Licensing Overview Thank you for purchasing a Posit license. We’ve listed the links to the license activation instructions for each product below. License activation methods Currently, the recommended license activation method for products installed in customer-managed servers is to use license files instead of license keys. Activating your license using a license file is a more robust and flexible solution. Read more about license files in the License File Activation for Posit Products white paper. If you want to activate with a license file but currently have a license key, please contact Posit Support. Important Purchasing your product through a marketplace with an offer not explicitly marked Bring Your Own License (BYOL), means licensing differs from products purchased directly through Posit. The current marketplaces include: AWS Marketplace including RStudio on AWS SageMaker Microsoft Azure Marketplace Google Cloud Platform Marketplace Please reference the Posit Cloud Marketplace Offers documentation and the sections related to your marketplace of purchase below for server setup information. BYOL marketplace offerings follow the regular steps for each Posit Team server product. Purchases made for Posit Workbench in Google Cloud Workstations or Azure ML platforms continue to use platform-specific license keys. Posit Team server products Posit Workbench How to activate your license How to install Workbench Note The license activation procedures for Workbench (listed above) also work for RStudio Server Pro. Posit Connect How to activate your license How to install Connect Posit Package Manager How to activate your license How to install Package Manager Other products RStudio Desktop Pro How to activate your license How to install RStudio Desktop Shiny Server Pro Discontinuation of Sales of Shiny Server Pro to new and existing customers Starting April 2024, existing Shiny Server Pro (SSP) customers have one more opportunity for a final one-year renewal (Posit discontinued new sales of SSP). Please see the Shiny Server Pro Overview and consider migrating to Posit Connect. How to activate your license How to install Shiny Server Pro Posit products on hosted platforms The license-activation workflow for Posit hosted platform products differs from the traditional on-premises product license-activation workflow. Use the procedures listed below for Posit products hosted on platforms. Posit Workbench on AzureML How to activate your license and get started in Posit Workbench on AzureML Posit Workbench on Google Cloud Workstations How to activate your license and get started in Posit Workbench on Google Cloud Workstations Marketplace platform products For server setup documentation, please reference the Posit Cloud Marketplace Offers. AWS Marketplace How to activate and manage Posit products purchased from the AWS Marketplace RStudio on AWS SageMaker How to activate your license Getting started with RStudio on Sagemaker Microsoft Azure Marketplace How to activate and manage Posit products purchased from the Microsoft Azure Marketplace Google Cloud Platform Marketplace How to activate and manage Posit products purchased from the Google Cloud Platform Marketplace Posit Cloud invoice plan Your account is active when you receive your licensing email. Please login to Posit Cloud to access your account. For more information on managing your account, reference the Manage Accounts section of the Posit Cloud guide. shinyapps.io professional invoice plan Please follow the activation steps below: Identify your current shinyapps.io account ID or name. You can find the account name at https://www.shinyapps.io/admin/#/account/settings for the account you want to license. If you don’t have a shinyapps.io account, first create an account using the free subscription plan. Forward your license email with your account ID to support@posit.co to create a support ticket. Posit Support coverts the free subscription plan to grant full access to the premium features described on the main shinyapps.io page. Additional resources If you have any questions related to product licensing, please review the Licensing FAQ for answers to common issues. If your issues persist, please reach out to Posit Support by creating a support ticket. Back to top'
