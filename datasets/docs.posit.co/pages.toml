["https://docs.posit.co/cloud-products/index.html"]
title = "Cloud Products – Posit Docs"
full_description = '<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHBDBW7" height="0" width="0" style="display:none;visibility:hidden"></iframe> Cloud Products Posit Cloud Posit Cloud is a cloud-based solution that allows anyone to do, share, teach, and learn data science online. There is nothing to configure and no dedicated hardware to maintain. Users can create an account for free, or purchase flexible, monthly subscriptions to meet their needs. Posit Cloud makes it easy for people to create RStudio IDE and Jupyter Notebook projects in the cloud. Learn more about account creation in Plans & Pricing, and platform functionality in the Posit Cloud documentation. For general questions, please visit the Posit Cloud Community. shinyapps.io shinyapps.io is a hosted platform that makes it easy for you to share your Shiny applications on the web. Many customers use shinyapps.io to prove out some concepts, build out a prototype, or just run it for a short period of time for their own purposes. While others are using it as a core component of their analytical offerings within a larger online property. The service runs in the cloud on shared servers operated by Posit. Each application is self-contained. It operates on either data that uploads with the application or data that the code pulls from third-party data stores. If you are trying to decide between deploying applications to shinyapps.io or running your own Shiny server, please read this checklist. For general questions about how shinyapps.io works or how you can get your apps running on shinyapps.io, post in the shinyapps.io Community. Refer to the shinyapps.io user guide for more information. Back to top'
