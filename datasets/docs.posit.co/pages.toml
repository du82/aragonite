full_description = "Posit Workbench User Guide Posit Workbench is a cloud development environment for data scientists. Revision 480 Published February 21, 2025 Posit Workbench also allows users to: Launch jobs into remote or local clusters using Workbench Jobs. Run multiple-concurrent sessions. Use multiple different versions of R and Python. Collaborate on projects. Easily connect to shared resources such as databases or mounted file systems. Setting up Workbench If you’re new to Workbench, review the Workbench Setup Guide before navigating to any of the IDE guides linked below. Choose your IDE Once Workbench has been configured, users can choose between five different IDEs: Positron Pro, RStudio, VS Code, JupyterLab, and Jupyter Notebook. The following buttons link to each IDE’s Getting Started guide: Positron Pro RStudio VS Code JupyterLab Jupyter Notebook About this guide This guide describes how to utilize Posit Workbench’s functionality once it is configured by your administrator. Intended audience This guide is intended for Posit Workbench users (e.g., data scientists). Note This guide is intended for Posit Workbench users. If you are a Posit Workbench administrator, please refer to the Posit Workbench Administrator Guide. Proceed to Workbench Setup Guide > Getting Started with Posit Workbench Back to top"
