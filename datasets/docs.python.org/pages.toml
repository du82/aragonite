er — Utilities for os tests test.support.import_helper — Utilities for import tests test.support.warnings_helper — Utilities for warnings tests Debugging and Profiling Audit events table bdb — Debugger framework faulthandler — Dump the Python traceback pdb — The Python Debugger The Python Profilers timeit — Measure execution time of small code snippets trace — Trace or track Python statement execution tracemalloc — Trace memory allocations Software Packaging and Distribution ensurepip — Bootstrapping the pip installer venv — Creation of virtual environments zipapp — Manage executable Python zip archives Python Runtime Services sys — System-specific parameters and functions sys.monitoring — Execution event monitoring sysconfig — Provide access to Python’s configuration information builtins — Built-in objects __main__ — Top-level code environment warnings — Warning control dataclasses — Data Classes contextlib — Utilities for with-statement contexts abc — Abstract Base Classes atexit — Exit handlers traceback — Print or retrieve a stack traceback __future__ — Future statement definitions gc — Garbage Collector interface inspect — Inspect live objects site — Site-specific configuration hook Custom Python Interpreters code — Interpreter base classes codeop — Compile Python code Importing Modules zipimport — Import modules from Zip archives pkgutil — Package extension utility modulefinder — Find modules used by a script runpy — Locating and executing Python modules importlib — The implementation of import importlib.resources – Package resource reading, opening and access importlib.resources.abc – Abstract base classes for resources importlib.metadata – Accessing package metadata The initialization of the sys.path module search path Python Language Services ast — Abstract Syntax Trees symtable — Access to the compiler’s symbol tables token — Constants used with Python parse trees keyword — Testing for Python keywords tokenize — Tokenizer for Python source tabnanny — Detection of ambiguous indentation pyclbr — Python module browser support py_compile — Compile Python source files compileall — Byte-compile Python libraries dis — Disassembler for Python bytecode pickletools — Tools for pickle developers MS Windows Specific Services msvcrt — Useful routines from the MS VC++ runtime winreg — Windows registry access winsound — Sound-playing interface for Windows Unix Specific Services posix — The most common POSIX system calls pwd — The password database grp — The group database termios — POSIX style tty control tty — Terminal control functions pty — Pseudo-terminal utilities fcntl — The fcntl and ioctl system calls resource — Resource usage information syslog — Unix syslog library routines Modules command-line interface (CLI) Superseded Modules getopt — C-style parser for command line options Removed Modules Security Considerations"
