cesses. configparser Configuration file parser. contextlib Utilities for with-statement contexts. contextvars Context Variables copy Shallow and deep copy operations. copyreg Register pickle support functions. cProfile cryptDeprecated: Removed in 3.13. csv Write and read tabular data to and from delimited files. ctypes A foreign function library for Python. curses (Unix) An interface to the curses library, providing portable terminal handling. curses.ascii Constants and set-membership functions for ASCII characters. curses.panel A panel stack extension that adds depth to curses windows. curses.textpad Emacs-like input editing in a curses window. d dataclasses Generate special methods on user-defined classes. datetime Basic date and time types. dbm Interfaces to various Unix "database" formats. dbm.dumb Portable implementation of the simple DBM interface. dbm.gnu (Unix) GNU database manager dbm.ndbm (Unix) The New Database Manager dbm.sqlite3 (All) SQLite backend for dbm decimal Implementation of the General Decimal Arithmetic Specification. difflib Helpers for computing differences between objects. dis Disassembler for Python bytecode. distutilsDeprecated: Removed in 3.12. doctest Test pieces of code within docstrings. e email Package supporting the parsing, manipulating, and generating email messages. email.charset Character Sets email.contentmanager Storing and Retrieving Content from MIME Parts email.encoders Encoders for email message payloads. email.errors The exception classes used by the email package. email.generator Generate flat text email messages from a message structure. email.header Representing non-ASCII headers email.headerregistry Automatic Parsing of headers based on the field name email.iterators Iterate over a message object tree. email.message The base class representing email messages. email.mime Build MIME messages. email.mime.application email.mime.audio email.mime.base email.mime.image email.mime.message email.mime.multipart email.mime.nonmultipart email.mime.text email.parser Parse flat text email messages to produce a message object structure. email.policy Controlling the parsing and generating of messages email.utils Miscellaneous email package utilities. encodings encodings.idna Internationalized Domain Names implementation encodings.mbcs Windows ANSI codepage encodings.utf_8_sig UTF-8 codec with BOM signature ensurepip Bootstrapping the "pip" installer into an existing Python installation or virtual environment. enum Implementation of an enumeration class. errno Standard errno system symbols. f faulthandler Dump the Python traceback. fcntl (Unix) The fcntl() and ioctl() system calls. filecmp Compare files efficiently. fileinput Loop over standard input or a list of files. fnmatch Unix shell style filename pattern matching. fractions Rational numbers. ftplib FTP protocol client (requires sockets). functools Higher-order functions and operations on callable objects. g gc Interface to the cycle-detecting garbage collector. getopt Portable parser for command line options; support both short and long option names. getpass Portable reading of passwords and retrieval of the userid. gettext Multilingual internationalization services. glob Unix shell style pathname pattern expansion. graphlib Functionality to operate with graph-like structures grp (Unix) The group database (getgrnam() and friends). gzip Interfaces for gzip compression and decompression using file objects. h hashlib Secure hash and message digest algorithms. heapq Heap queue algorithm (a.k.a. priority queue). hmac Keyed-Hashing for Message Authentication (HMAC) implementation html Helpers for manipulating HTML. html.entities Definitions of HTML general entities. html.parser A simple parser that can handle HTML and XHTML. http HTTP status codes and messages http.client HTTP and HTTPS protocol client (requires sockets). http.cookiejar Classes for automatic handling of HTTP cookies. http.cookies Support for HTTP state management (cookies). http.server HTTP server and request handlers. i idlelib Implementation package for the IDLE shell/editor. imaplib IMAP4 protocol client (requires sockets). imghdrDeprecated: Removed in 3.13. impDeprecated: Removed in 3.12. importlib The implementation of the import machinery. importlib.abc Abstract base classes related to import importlib.machinery Importers and path hooks importlib.metadata Accessing package metadata importlib.resources Package resource reading, opening, and access importlib.resources.abc Abstract base classes for resources importlib.util Utility code for importers inspect Extract information and source code from live objects. io Core tools for working with streams. ipaddress IPv4/IPv6 manipulation library. itertools Functions creating iterators for efficient looping. j json Encode and decode the JSON format. json.tool A command line to validate and pretty-print JSON. k keyword Test whether a string is a keyword in Python. l linecache Provides random access to individual lines from text files. locale Internationalization services. logging Flexible event logging system for applications. logging.config Configuration of the logging module. logging.handlers Handlers for the logging module. lzma A Python wrapper for the liblzma compression library. m mailbox Manipulate mailboxes in various formats mailcapDeprecated: Removed in 3.13. marshal Convert Python objects to streams of bytes and back (with different constraints). math Mathematical functions (sin() etc.). mimetypes Mapping of filename extensions to MIME types. mmap Interface to memory-mapped files for Unix and Windows. modulefinder Find modules used by a script. msilibDeprecated: Removed in 3.13. msvcrt (Windows) Miscellaneous useful routines from the MS VC++ runtime. multiprocessing Process-based parallelism. multiprocessing.connection API for dealing with sockets. multiprocessing.dummy Dumb wrapper around threading. multiprocessing.managers Share data between process with shared objects. multiprocessing.pool Create pools of processes. multiprocessing.shared_memory Provides shared memory for direct access across processes. multiprocessing.sharedctypes Allocate ctypes objects from shared memory. n netrc Loading of .netrc files. nisDeprecated: Removed in 3.13. nntplibDeprecated: Removed in 3.13. numbers Numeric abstract base classes (Complex, Real, Integral, etc.). o operator Functions corresponding to the standard operators. optparse Command-line option parsing library. os Miscellaneous operating system interfaces. os.path Operations on pathnames. ossaudiodevDeprecated: Removed in 3.13. p pathlib Object-oriented filesystem paths pdb The Python debugger for interactive interpreters. pickle Convert Python objects to streams of bytes and back. pickletools Contains extensive comments about the pickle protocols and pickle-machine opcodes, as well as some useful functions. pipesDeprecated: Removed in 3.13. pkgutil Utilities for the import system. platform Retrieves as much platform identifying data as possible. plistlib Generate and parse Apple plist files. poplib POP3 protocol client (requires sockets). posix (Unix) The most common POSIX system calls (normally used via module os). pprint Data pretty printer. profile Python source profiler. pstats Statistics object for use with the profiler. pty (Unix) Pseudo-Terminal Handling for Unix. pwd (Unix) The password database (getpwnam() and friends). py_compile Generate byte-code files from Python source files. pyclbr Supports information extraction for a Python module browser. pydoc Documentation generator and online help system. q queue A synchronized queue class. quopri Encode and decode files using the MIME quoted-printable encoding. r random Generate pseudo-random numbers with various common distributions. re Regular expression operations. readline (Unix) GNU readline support for Python. reprlib Alternate repr() implementation with size limits. resource (Unix) An interface to provide resource usage information on the