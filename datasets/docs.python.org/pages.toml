full_description = "Download Python 3.13 Documentation Last updated on: Feb 28, 2025 (08:46 UTC). To download an archive containing all the documents for this version of Python in one of various formats, follow one of links in this table. Format Packed as .zip Packed as .tar.bz2 PDF Download (ca. 17 MiB) Download (ca. 17 MiB) HTML Download (ca. 13 MiB) Download (ca. 8 MiB) Plain text Download (ca. 4 MiB) Download (ca. 3 MiB) Texinfo Download (ca. 9 MiB) Download (ca. 7 MiB) EPUB Download (ca. 6 MiB) These archives contain all the content in the documentation. Unpacking Unix users should download the .tar.bz2 archives; these are bzipped tar archives and can be handled in the usual way using tar and the bzip2 program. The Info-ZIP unzip program can be used to handle the ZIP archives if desired. The .tar.bz2 archives provide the best compression and fastest download times. Windows users can use the ZIP archives since those are customary on that platform. These are created on Unix using the Info-ZIP zip program. Problems If you have comments or suggestions for the Python documentation, please send email to docs@python.org."
