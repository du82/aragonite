["https://docs.racket-lang.org/anaphoric/index.html"]
title = "Anaphoric macros"
full_description = "This package provides anaphoric versions of if, when, cond, map, and filter. These bind the syntax parameter it to the value produced by the condition expression. In the else clause of acond and in the else branch of aif, the it syntax parameter keeps its value. This means it keeps the value bound by the surrounding conditional, if any. Otherwise it acts exactly as when it is used at the top-level, and raises a syntax error. In the example above, (displayln it) prints 'first. In the example below, (displayln it) raises a syntax error, as it appears in a sequence of else branches: This package also provides the hygienic versions if-let, when-let and cond-let, for which the user needs to specify an identifier instead of using it. Raises a syntax error when used outside of the true-branch of an aif or the body of an awhen or the body of a non-else case in acond. Each condition is evaluated at most once, and evaluation stops at the first false condition. The body is only evaluated when every conditionᵢ is successful. The last two variants are shorthands for using the same identifier in all cases (except the else case). Each conditionᵢ is evaluated at most once, and evaluation stops at the first false condition. The body is only evaluated when every conditionᵢ is successful."
