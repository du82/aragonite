["https://docs.racket-lang.org/pkg/Functions_for_raco_pkg.html"]
title = "7.1 Functions for raco pkg"
full_description = "Each-long form option of the command-line interface is a keyword argument to the functions described below. An argument corresponding to --type, --deps, --format, --scope, or --multi-clone accepts its argument as a symbol, while other flags that take text arguments expect strings, and flags that expect number arguments expect exact integers. An argument corresponding to --scope is also allowed to be a path string, as would be provided to --scope-dir. Options without argument correspond to keyword arguments that accept booleans, where #t is equivalent to the presence of the option. When a flag can be used multiple times, its keyword-argument form can hold a single value, a list of values, or #f to indicate the default implied by zero instances of the flag. The parameters current-pkg-catalogs, current-pkg-scope, current-pkg-scope-version, and current-pkg-error do not to affect command functions, because the functions explicitly configure parameters based on their arguments."
