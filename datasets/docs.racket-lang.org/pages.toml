full_description = "This appendix contains sample definitions for some of the keywords described in this report in terms of simpler forms: The cond keyword (section 11.4.5) could be defined in terms of if, let and begin using syntax-rules as follows: The case keyword (section 11.4.5) could be defined in terms of let, cond, and memv (see library chapter on “List utilities”) using syntax-rules as follows: The letrec keyword (section 11.4.6) could be defined approximately in terms of let and set! using syntax-rules, using a helper to generate the temporary variables needed to hold the values before the assignments are made, as follows: The syntax <undefined> represents an expression that returns something that, when stored in a location, causes an exception with condition type &assertion to be raised if an attempt to read from or write to the location occurs before the assignments generated by the letrec transformation take place. (No such expression is defined in Scheme.) A simpler definition using syntax-case and generate-temporaries is given in library chapter on “syntax-case”. The letrec* keyword could be defined approximately in terms of let and set! using syntax-rules as follows: The following definition of let-values (section 11.4.6) using syntax-rules employs a pair of helpers to create temporary names for the formals."
