["https://docs.racket-lang.org/al2-test-runner/index.html"]
title = "al2-test-runner -- Alternative way of running rackunit test suites"
full_description = "This package provides an alternative way of running rackunit tests, providing better visibility and improved reporting of test results. The run-tests function is a drop-in replacement of the equivalent function from rackunit/textui, providing the following benefits: Results from test runs are reported to the standard output, even if they are successful. This allows better visibility of what tests are actually run, along with their execution time Test results are written to an output file, using JUnit compatible format. This allows test results to be imported into various management tools for analyzing trends such as test durations and failure rates across different builds Tests can be explicitly skipped, and such tests are reported as skipped – this allows better visibility of what tests are not run, when compared to just commenting them out in the source code. The package does not define another testing framework, instead it runs rackunit tests which are organized in test-suites and test-cases. When working on an application or package, you might disable a broken test temporarily, but once you do, there is no longer an indication that the test has been disabled. The test suite passes, and if there is a large number of tests, it is easy to miss that some were disabled: The commented out test might be easy to spot in the previous example, but in a bigger application with many tests, it is easy to miss. The al2-test-runner package provides an alternative: the test can be disabled by adding it to the exclusion list in run-tests. The test is still known to the test system and it is now reported as skipped. In addition, this version of run-tests will print out all the tests that are run along with their pass/fail status and will also write this information to a file, in standard JUnit test format. This file can be imported in various test management systems. package is a string that is used as a package name when results are written to file. JUnit tests are grouped into packages, and the XML file format expects that, but there is no higher construct than a test-suite in rackunit, so the package name needs to be provided as a parameter to run-tests."
year_published = 2025
