["https://docs.racket-lang.org/drracket/buttons.html"]
title = "1.1 Buttons"
full_description = "The left end of the row of buttons in DrRacket contains a miniature button with the current file’s name. Clicking the button opens a menu that shows the file’s full pathname. Selecting one of the menu entries produces an open-file dialog starting in the corresponding directory. Beside the filename button is a (define ...) button for a pop-up menu of names that are defined in the definitions window. Selecting an item from the menu moves the insertion point (blinking caret) to the corresponding definition. The Save button appears whenever the definitions window is modified. Clicking the button saves the contents of the definitions window to a file. The current name of the file appears to the left of the Save button, but a file-selection dialog appears if the file has never been saved before. The Step button—which appears only for the How to Design Programs teaching languages Beginning Student through Intermediate Student with Lambda—starts the Stepper, which shows the evaluation of a program as a series of small steps. Each evaluation step replaces an expression in the program with an equivalent one using the evaluation rules of DrRacket. For example, a step might replace (+ 1 2) with 3. These are the same rules used by DrRacket to evaluate a program. Clicking Step opens a new window that contains the program from the definitions window, plus several new buttons: these buttons allow navigation of the evaluation as a series of steps. The Debug button—which does not appear for the How to Design Programs teaching languages—starts a more conventional stepping debugger. It runs the program in the definitions window like the Run button, but also opens a debugging panel with several other buttons that provide control over the program’s execution. Clicking the Check Syntax button annotates the program text in the definitions window. It adds the following annotations: Syntactic Highlighting: Imported variables and locally defined variables are highlighted with color changes. Documented identifiers are hyperlinked (via a right-click) to the documentation page."
year_published = 2025
