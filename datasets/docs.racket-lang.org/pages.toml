full_description = 'The puzzle relies the fact that within strings, certain single characters — like the backslash \ and double-quote mark " — are described with more than one character. Thus, the question asks us to compare the two lengths. The literal length of the string is trivial — use string-length. The memory length requires interpreting a string as a Racket value, which (as seen in Day 7) simply means using read. This question simply comes down to — do you know how to use the string-formatting functions in your programming language?'
