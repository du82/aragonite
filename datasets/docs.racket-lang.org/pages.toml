["https://docs.racket-lang.org/guide/application.html"]
title = "4.3 Function Calls"
full_description = '''is a function call—also known as a procedure application—when proc-expr is not an identifier that is bound as a syntax transformer (such as if or define). A function call is evaluated by first evaluating the proc-expr and all arg-exprs in order (left to right). Then, if proc-expr produces a function that accepts as many arguments as supplied arg-exprs, the function is called. Otherwise, an exception is raised. Some functions, such as cons, accept a fixed number of arguments. Some functions, such as + or list, accept any number of arguments. Some functions accept a range of argument counts; for example substring accepts either two or three arguments. A function’s arity is the number of arguments that it accepts. Some functions accept keyword arguments in addition to by-position arguments. For that case, an arg can be an arg-keyword arg-expr sequence instead of just a arg-expr: calls the function bound to go with "super.rkt" as a by-position argument, and with 'fast as an argument associated with the #:mode keyword. A keyword is implicitly paired with the expression that follows it. is a syntax error. The #:mode keyword must be followed by an expression to produce an argument value, and #:fast is not an expression. The order of keyword args determines the order in which arg-exprs are evaluated, but a function accepts keyword arguments independent of their position in the argument list. The above call to go can be equivalently written The syntax for function calls supports any number of arguments, but a specific call always specifies a fixed number of arguments. As a result, a function that takes a list of arguments cannot directly apply a function like + to all of the items in a list: The apply function offers a way around this restriction. It takes a function and a list argument, and it applies the function to the values in the list: As a convenience, the apply function accepts additional arguments between the function and the list. The additional arguments are effectively consed onto the argument list:'''
