["https://docs.racket-lang.org/r6rs/r6rs-std/r6rs-Z-H-18.html"]
title = "Revised^6 Report on the Algorithmic Language Scheme"
full_description = "This section describes an example consisting of the (runge-kutta) library, which provides an integrate-system procedure that integrates the system The parameter system-derivative is a function that takes a system state (a vector of values for the state variables y1, ..., yn) and produces a system derivative (the values y1⁄, ..., yn⁄). The parameter initial-state provides an initial system state, and h is an initial guess for the length of the integration step. The runge-kutta-4 procedure takes a function, f, that produces a system derivative from a system state. The runge-kutta-4 procedure produces a function that takes a system state and produces a new system state. The map-streams procedure is analogous to map: it applies its first argument (a procedure) to all the elements of its second argument (a stream). Infinite streams are implemented as pairs whose car holds the first element of the stream and whose cdr holds a procedure that delivers the rest of the stream."
