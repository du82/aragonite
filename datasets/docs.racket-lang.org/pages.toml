["https://docs.racket-lang.org/algebraic/class_core.html"]
title = "3.1 Defining Classes and Instances"
full_description = "Algebraic Racket’s classes are a lot like Haskell’s type classes without the typing constraints. They allow abstract design patterns like monads with do-notation to be expressed simply and in a generic way that makes sense for Racket. The with-instance form can prefix the names it binds so multiple instances of the same class can be used together. The minimal directive, when present, constrains valid instances to only those that provide at least one of the minimal member-id sets. The extends directive, when present, recursively imports the members of the instance-ids and the instances they extend. If any prefix-ids are given, they are prepended to the names of the members defined by the corresponding instance-ids."
