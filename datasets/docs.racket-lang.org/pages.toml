["https://docs.racket-lang.org/pkg/cmdline.html"]
title = "3 Using raco pkg"
full_description = 'raco pkg install ‹option› ... ‹pkg-source› ... — Installs the given package sources (eliminating exact-duplicate ‹pkg-source›s). If a given ‹pkg-source› is auto-installed (to satisfy some other package’s dependency), then it is promoted to explicitly installed. If no ‹pkg-source›s are supplied and the --clone flag is not supplied, the current directory is installed as a link. See the --link flag below for more details. If no ‹pkg-source›s are supplied and the --clone flag is supplied, then the clone directory’s name is used as the only ‹pkg-source› argument. See the --clone flag below for more details. --type ‹type› or -t ‹type› — Specifies an interpretation of the package source, where ‹type› is either file, dir, file-url, dir-url, git, git-url, github, or name. The difference between git and git-url is that a .git suffix is added to a http or https URL for type git, but not for type git-url. The type is normally inferred for each ‹pkg-source›. --name ‹pkg› or -n ‹pkg› — Specifies the name of the package, which makes sense only when a single ‹pkg-source› is provided. The name is normally inferred for each ‹pkg-source›. --checksum ‹checksum› — Specifies a checksum for the package, which normally makes sense only when a single ‹pkg-source› is provided. The use of ‹checksum› depends on ‹pkg-source›: for a Git or GitHub source, ‹checksum› selects a checksum; for a package name, file path, or remote URL as a source, ‹checksum› specifies an expected checksum; for a directory path (including a remote directory URL without a ".CHECKSUM" file) as a source, ‹checksum› assigns a checksum. fail — Cancels the installation if dependencies are uninstalled or version requirements are unmet. This behavior is the default for non-interactive mode. force — Installs the package(s) despite missing dependencies or version requirements. Forcing an installation may leave package content in an inconsistent state. Implied packages via implies or update-implies (see Package Metadata) are not updated, even if --ignore-implies is not specified.'
year_published = 2025
