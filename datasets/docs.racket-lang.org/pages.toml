["https://docs.racket-lang.org/drracket/htdp-langs.html"]
title = "2.3 How to Design Programs Teaching Languages"
full_description = "The Beginning Student language is a small version of Racket that is tailored for beginning computer science students. The Beginning Student with List Abbreviations languages is an extension to Beginning Student that prints lists with list instead of cons, and accepts quasiquoted input. Case-sensitive identifiers and symbols — In a case-sensitive language, the variable names x and X are distinct, and the symbols 'x and 'X are also distinct. In a case-insensitive language, x and X are equivalent and 'x and 'X represent the same value. The teaching languages are case-sensitive by default. Case-sensitivity can be adjusted through the detail section of the language-selection dialog. All numbers are exact unless #i is specified — In the Beginning Student through Intermediate Student with Lambda languages, numbers containing a decimal point are interpreted as exact numbers. This interpretation allows students to use familiar decimal notation without inadvertently triggering inexact arithmetic. Exact numbers with decimal representations are also printed in decimal. Inexact inputs and results are explicitly marked with #i. Procedures must take at least one argument — In the Beginning Student through Intermediate Student languages, defined procedures must consume at least one argument. Since the languages have no side-effects, zero-argument functions are not useful, and rejecting such function definitions helps detect confusing syntactic mistakes. Identifier required at function call position — In the Beginning Student through Intermediate Student languages, procedure calls must be of the form (identifier ...). This restriction helps detect confusing misuses of parentheses, such as (1) or ((+ 3 4)), which is a common mistake among beginners who are used to the optional parentheses of algebra. Top-level required at function call position — In the Beginning Student languages, procedure calls must be of the form (top-level-identifier ...), and the number of actual arguments must match the number of formal arguments if top-level-identifier is defined. This restriction helps detect confusing misuses of parentheses, such as (x) where x is a function argument. DrRacket can detect such mistakes syntactically because Beginning Student does not support higher-order procedures."
year_published = 2025
clearnet = "https://docs.racket-lang.org/drracket/htdp-langs.html"
