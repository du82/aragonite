["https://docs.racket-lang.org/guide/contracts-gotchas.html"]
title = "7.9 Gotchas"
full_description = "As a general rule, adding a contract to a program should either leave the behavior of the program unchanged, or should signal a contract violation. And this is almost true for Racket contracts, with one exception: eq?. The eq? procedure is designed to be fast and does not provide much in the way of guarantees, except that if it returns true, it means that the two values behave identically in all respects. Internally, this is implemented as pointer equality at a low-level so it exposes information about how Racket is implemented (and how contracts are implemented). It exports the make-adder function that is the usual curried addition function, except that it returns Racket’s add1 when its input is 1. would return #t, but it does not. If the contract were changed to any/c (or even (-> number? any/c)), then the eq? call would return #t. The contract boundaries established by define/contract, which creates a nested contract boundary, are sometimes unintuitive. This is especially true when multiple functions or other values with contracts interact. For example, consider these two interacting functions: One might expect that the function g will be blamed for breaking the terms of its contract with f. Blaming g would be right if f and g were directly establishing contracts with each other. They aren’t, however. Instead, the access between f and g is mediated through the top-level of the enclosing module. More precisely, f and the top-level of the module have the (-> integer? integer?) contract mediating their interaction; g and the top-level have (-> string?) mediating their interaction, but there is no contract directly between f and g. This means that the reference to f in the body of g is really the top-level of the module’s responsibility, not g’s. In other words, the function f has been given to g with no contract between g and the top-level and thus the top-level is blamed. If we wanted to add a contract between g and the top-level, we can use define/contract’s #:freevar declaration and see the expected blame:"
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/contracts-gotchas.html"
