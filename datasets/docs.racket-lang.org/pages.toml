title = "2 Booleans and Conditionals"
full_description = "Warning: t happens to be both a boolean and a symbol, so be careful when mixing symbols with booleans. Warning: nil happens to be a boolean, a list, and a symbol, so be careful when mixing lists with booleans, symbols with booleans, or lists with symbols. It evaluates the two branches lazily, meaning it doesn’t evaluate then-expr unless the question really is t, and it doesn’t evaluate else-expr unless the question really is nil. So this division-by-zero expression never gets evaluated. This delay in evaluating the branches is also important for functions that use recursion, so it doesn’t evaluate the recursive call when it should be on the base case. Like if, cond evaluates its answer expressions lazily, which means it can be used to guard against bad data, or to guard recursive calls. Like if and cond, and evaluates its arguments lazily, only when all of the previous arguments have praduced t. So this division by zero expression never gets evaluated: Like if and cond, or evaluates its arguments lazily, only when none of the previous arguments have praduced t. So this division by zero expression never gets evaluated:"
