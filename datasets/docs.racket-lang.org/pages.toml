["https://docs.racket-lang.org/aoc-racket/Day_9.html"]
title = "9 Day 9"
full_description = "The puzzle. Our input consists of a list of distances between fictional cities, e.g., AlphaCentauri to Straylight = 133. This puzzle is a version of the famous traveling-salesman problem. The problem is famous because there’s no reasonable algorithm to solve it for arbitrarily large sets of cities. This version, however, has only eight cities. So it is possible (and easiest) to simply try all the options and see which is shortest. The solution has two parts. First, we’ll parse our input data and put the distances into a mutable hash table. One small wrinkle — the distance between city A and city B is the same whether our path takes us from A to B or B to A. So the keys for our hash will be of the form (list city-a city-b), with the cities always in alphabetical order. In the second part, we’ll loop through every possible path between the cities with in-permutations. We’ll split each path into pairs of cities, look up each distance between pairs, and sum them. This will give us a list of distances, and we can find the smallest with min. The reason the traveling-saleman problem is generally difficult is that the number of permutations of n cities is (factorial (sub1 n)), which gets very large, very quickly."
