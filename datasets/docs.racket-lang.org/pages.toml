["https://docs.racket-lang.org/guide/let.html"]
title = "4.6 Local Binding"
full_description = "Although internal defines can be used for local binding, Racket provides three forms that give the programmer more control over bindings: let, let*, and letrec. A let form binds a set of identifiers, each to the result of some expression, for use in the let body: The ids are bound “in parallel.” That is, no id is bound in the right-hand side expr for any id, but all are available in the body. The ids must be different from each other. The fact that an id’s expr does not see its own binding is often useful for wrappers that must refer back to the old value: Occasionally, the parallel nature of let bindings is convenient for swapping or rearranging a set of bindings: The characterization of let bindings as “parallel” is not meant to imply concurrent evaluation. The exprs are evaluated in order, even though the bindings are delayed until all exprs are evaluated. The difference is that each id is available for use in later exprs, as well as in the body. Furthermore, the ids need not be distinct, and the most recent binding is the visible one. While let makes its bindings available only in the bodys, and let* makes its bindings available to any later binding expr, letrec makes its bindings available to all other exprs—even earlier ones. In other words, letrec bindings are recursive. The exprs in a letrec form are most often lambda forms for recursive and mutually recursive functions: While the exprs of a letrec form are typically lambda expressions, they can be any expression. The expressions are evaluated in order, and after each value is obtained, it is immediately associated with its corresponding id. If an id is referenced before its value is ready, an error is raised, just as for internal definitions. A named let is an iteration and recursion form. It uses the same syntactic keyword let as for local binding, but an identifier after the let (instead of an immediate open parenthesis) triggers a different parsing. That is, a named let binds a function identifier that is visible only in the function’s body, and it implicitly calls the function with the values of some initial expressions."
year_published = 2025
