["https://docs.racket-lang.org/3s/index.html"]
title = "3s: positional audio and mixing"
full_description = "The 3s module provides a system for positional audio and mixing of sound effects. It is intended for interactive applications and integrates with lux. Presently it uses the openal library, but in principle does not require its use. The overall model of 3s is to parameterize sounds over the world state, so that sounds created in the past can be updated (paused, move position, have the content changed, etc) by initially creating them so that they inspect the world state for cues to such updates. The key function, render-sound, is called regularly (i.e., once per tick) and receives the updated world state, along with any additional sounds created during that tick. 3s is designed to integrate with lux through the lux/chaos/3s module, which provides a chaos for sound scapes. The values that word-output should return are four element vectors where the elements correspond to the last four arguments of render-sound: the sound scale, the listener position, the world value, and the list of new sounds."
year_published = 2025
