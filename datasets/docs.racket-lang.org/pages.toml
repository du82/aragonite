["https://docs.racket-lang.org/aoc-racket/Day_6.html"]
title = "6 Day 6"
full_description = "The puzzle. Our input is a list of instructions for turning on (or off) the bulbs in a (* 1000 1000) grid of lights. We need to a) create a data structure to hold our grid of lights, then b) step through the instructions on the list, and then c) count how many lights are lit at the end. When you need random access to a fixed-size set of items, you should think Vectors. (We could do this problem with a hash table, but it would be a lot slower.) The grid-ness of the problem might suggest a two-dimensional vector — e.g., a 1000-unit vector where each slot holds another 1000-unit vector. But this doesn’t buy us any convenience. We’ll just use a single (* 1000 1000)-unit vector, and translate our Cartesian coordinates into linear vector indexes by treating a coordinate like (246, 139) as 246139. Each instruction consists of two pieces. First, an operation: either turn on, turn off, or toggle (meaning, invert the current state of the bulb). Second, a definition of a rectangular segment of the grid that the operation will be applied to (e.g., 333,60 through 748,159). Therefore, a natural way to model each instruction is as a Racket function followed by four numerical arguments. We’ll define our functions for setting and counting the lights separately, since we’ll be able to resuse them for the second part. The second part redefines the meaning of the three instructions, and introduces a notion of “brightness”: This part is the same as the last, except we change the definitions of our bulb functions to match the new rules. Since the only part that changes between the solutions is the bulb functions, we could refactor the solutions to avoid repetition."
