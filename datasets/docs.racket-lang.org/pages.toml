["https://docs.racket-lang.org/guide/set_.html"]
title = "4.9 Assignment: set!"
full_description = "A set! expression evaluates expr and changes id (which must be bound in the enclosing environment) to the resulting value. The result of the set! expression itself is #<void>. Although using set! is sometimes appropriate, Racket style generally discourages the use of set!. The following guidelines may help explain when using set! is appropriate. As in any modern language, assigning to a shared identifier is no substitute for passing an argument to a procedure or getting its result. Using assignment to accumulate results from an iteration is bad style. Accumulating through a loop argument is better. For cases where stateful objects are necessary or appropriate, then implementing the object’s state with set! is fine. All else being equal, a program that uses no assignments or mutation is always preferable to one that uses assignments or mutation. While side effects are to be avoided, however, they should be used if the resulting code is significantly more readable or if it implements a significantly better algorithm. The use of mutable values, such as vectors and hash tables, raises fewer suspicions about the style of a program than using set! directly. Nevertheless, simply replacing set!s in a program with vector-set!s obviously does not improve the style of the program. The set!-values form assigns to multiple variables at once, given an expression that produces an appropriate number of values: This form is equivalent to using let-values to receive multiple results from expr, and then assigning the results individually to the ids using set!."
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/set_.html"
