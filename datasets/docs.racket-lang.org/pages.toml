["https://docs.racket-lang.org/drracket/debugger.html"]
title = "1.8 Graphical Debugging Interface"
full_description = "Tip: Changing the name of a file in the middle of a debugging session will prevent the debugger from working properly on that file. Like the Run button, the Debug button runs the program in the definitions window. However, instead of simply running it from start to finish, it lets users control and observe the program as it executes. The interface includes a panel of buttons above the definitions window, as well as extensions to the definitions window itself. The program starts out paused just before the first expression is executed. This is indicated in the definitions window by the presence of a green triangle over this expression’s left parenthesis. The Go button is enabled whenever the program is paused. It causes the program to resume until it either completes, reaches a breakpoint, or raises an unhandled exception. The Step button is enabled whenever the program is paused. It causes the program to make a single step and then pause again. The Over button is only enabled when execution is paused at the start of an expression that is not in tail position. It sets a one-time breakpoint at the end of the expression (represented by a yellow circle) and causes the program to proceed. When execution reaches the one-time breakpoint, it pauses and removes that breakpoint. The Out button is only enabled when execution is paused within the context of another expression. Like the Over button, it sets a one-time breakpoint and continues execution. In this case, the program stops upon returning to the context or raising an unhandled exception. If the program is running (not paused), then only the Pause button will be enabled. Clicking it will interrupt execution and pause it. In this case, the current expression may only be known approximately, and it will be represented as a gray triangle. The other features described above will still be available. At any time, execution may be interrupted by clicking the Stop button. However, unlike with the Pause button, stopped execution cannot be continued."
year_published = 2025
clearnet = "https://docs.racket-lang.org/drracket/debugger.html"
