["https://docs.racket-lang.org/adjutor/Unstable.html"]
title = "2 Unstable"
full_description = "Unlike the preceding, features documented in this section are experimental and/or under development and are subject to breaking changes without notice. I suggest that before using these features in production code you check with me about their status or, in the worst-case scenario, fork the library. Changed in version 0.3 of package adjutor: Moved experimental things to adjutor/unstable to further clarify intent. Removed struct/derived in anticipation of Racket 7.6 (which will provide a struct/derived from racket/base) and removed the ill-considered delay/thread/eager-errors. Declared environment-variables-set* stable. Specifically, for symbolic links, filesystem change events detect changes on the target of the symbolic link, not on the link itself. In addition to detecting those changes, events created by filesystem/link-change-evt also become ready for synchronization when the link itself is deleted or changed to point to a different target (according to file-or-directory-identity). Like filesystem change events, events created by filesystem/link-change-evt allocate resources at the operating-system level, which are placed in the custody of the current custodian. These resources are released automatically when the event is chosen for synchronization: otherwise, they must be released by shutting down the custodian via custodian-shutdown-all or by explicitly calling filesystem/link-change-evt-cancel. In either case, the event becomes ready for synchronization (if it is not already). Note that these functions remain experimental. In particular, the desired behavior on Windows (where filesystem changes can be tracked only at directory-level resolution) has not been determined. The val-expr is an expression, and each pat is a pattern for match: these are tried against the value of val-expr in the usual way. Each pat must bind every rslt-id, or an unbound identifier error will occur. The values of the sequence are those bound to the rslt-ids (in order) by the first pat which matches successfully."
