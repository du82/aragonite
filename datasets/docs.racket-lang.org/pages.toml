["https://docs.racket-lang.org/guide/regexp-match.html"]
title = "9.2 Matching Regexp Patterns"
full_description = "The regexp-match-positions function takes a regexp pattern and a text string, and it returns a match if the regexp matches (some part of) the text string, or #f if the regexp did not match the string. A successful match produces a list of index pairs. In the second example, the integers 4 and 10 identify the substring that was matched. The 4 is the starting (inclusive) index, and 10 the ending (exclusive) index of the matching substring: In this first example, regexp-match-positions’s return list contains only one index pair, and that pair represents the entire substring matched by the regexp. When we discuss subpatterns later, we will see how a single match operation can yield a list of submatches. The regexp-match-positions function takes optional third and fourth arguments that specify the indices of the text string within which the matching should take place. The regexp-match function is like regexp-match-positions, but instead of returning index pairs, it returns the matching substrings: A byte-string regexp can be applied to a string, and a string regexp can be applied to a byte string. In both cases, the result is a byte string. Internally, all regexp matching is in terms of bytes, and a string regexp is expanded to a regexp that matches UTF-8 encodings of characters. For maximum efficiency, use byte-string matching instead of string, since matching bytes directly avoids UTF-8 encodings. If you have data that is in a port, there’s no need to first read it into a string. Functions like regexp-match can match on the port directly: The regexp-match? function is like regexp-match-positions, but simply returns a boolean indicating whether the match succeeded: The regexp-split function takes two arguments, a regexp pattern and a text string, and it returns a list of substrings of the text string; the pattern identifies the delimiter separating the substrings. If the first argument matches empty strings, then the list of all the single-character substrings is returned."
