["https://docs.racket-lang.org/web-server-internal/Troubleshooting_and_Tips.html"]
title = "6 Troubleshooting and Tips"
full_description = 'You may want to put Apache in front of your Racket Web Server application. Apache can rewrite and proxy requests for a private (or public) Racket Web Server: The first argument to RewriteRule is a match pattern. The second is how to rewrite the URL. The bracketed part contains flags that specify the type of rewrite, in this case the P flag instructs Apache to proxy the request. (If you do not include this, Apache will return an HTTP Redirect response and the client will make a second request to localhost:8080 which will not work on a different machine.) In addition, the NE flag is needed to avoid escaping parts of the URL — without it, a ; is escaped as %3B which will break the proxied request. This requires an SSL certificate and private key. This is very platform specific, but we will provide the details for using OpenSSL on UNIX: The Web Server will start on port 443 (which can be overridden with the -p option) using the "private-key.pem" and "server-cert.pem" we’ve created.'
