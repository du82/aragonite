["https://docs.racket-lang.org/r5rs/r5rs-std/r5rs-Z-H-9.html"]
title = "Revised^5 Report on the Algorithmic Language Scheme"
full_description = "This chapter describes Scheme's built-in procedures. The initial (or ``top level'') Scheme environment starts out with a number of variables bound to locations containing useful values, most of which are primitive procedures that manipulate data. For example, the variable abs is bound to (a location initially containing) a procedure of one argument that computes the absolute value of a number, and the variable + is bound to a procedure that computes sums. Built-in procedures that can easily be written in terms of other built-in procedures are identified as ``library procedures''. A program may use a top-level definition to bind any variable. It may subsequently alter any such binding by an assignment (see 4.1.6). These operations do not modify the behavior of Scheme's built-in procedures. Altering any top-level binding that has not been introduced by a definition has an unspecified effect on the behavior of the built-in procedures. A predicate is a procedure that always returns a boolean value (#t or #f). An equivalence predicate is the computational analogue of a mathematical equivalence relation (it is symmetric, reflexive, and transitive). Of the equivalence predicates described in this section, eq? is the finest or most discriminating, and equal? is the coarsest. Eqv? is slightly less discriminating than eq?. The eqv? procedure defines a useful equivalence relation on objects. Briefly, it returns #t if obj1 and obj2 should normally be regarded as the same object. This relation is left slightly open to interpretation, but the following partial specification of eqv? holds for all implementations of Scheme. obj1 and obj2 are both numbers, are numerically equal (see =, section 6.2), and are either both exact or both inexact. obj1 and obj2 are both characters and are the same character according to the char=? procedure (section 6.3.4). obj1 and obj2 are pairs, vectors, or strings that denote the same locations in the store (section 3.4). obj1 and obj2 are procedures that would behave differently (return different value(s) or have different side effects) for some arguments."
year_published = 2025
clearnet = "https://docs.racket-lang.org/r5rs/r5rs-std/r5rs-Z-H-9.html"
