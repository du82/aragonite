["https://docs.racket-lang.org/pkg/FAQ.html"]
title = "10 FAQ"
full_description = "Most Racket installations are configured to that installing a package installs it for a specific user and a specific version of Racket. That is, the package scope is user- and version-specific. More precisely, it is user-specific and installation-name-specific, where an installation name is typically a Racket version. You can change the default package scope (for a particular Racket installation) with raco pkg config -i --set default-scope installation, in which case package operations apply for all users of a Racket installation. You can also use the -i or --installation flag with a specific raco pkg command, instead of changing the default scope for all uses of raco pkg. Note that an installation-wide package is not exactly version-specific, because the version of an installation can change if it corresponds to a source-code checkout that is periodically updated and rebuilt. If you change the default package scope, you can use the -u or --user flag with a specific raco pkg command to perform the command with user-specific package scope. User-specific and Racket-version-specific packages are in (find-user-pkgs-dir), and installation-wide packages are in (find-pkgs-dir). They are linked as collections (for single-collection packages) or collection roots (for multi-collection packages) with raco link. User-specific packages are checked against installation-wide packages for package-name conflicts and provided-module conflicts. Installation-wide packages are checked against user-specific packages only for provided-module conflicts. Beware that a conflict-free, installation-wide change by one user can create conflicts for a different user. If you have new code for a package, then it should have a new checksum. When package updates are searched for, the checksum of the installed package is compared with the checksum of the source, if they are different, then the source is re-installed. This allows code changes to be distributed. You do not need to declare an update a version number, except to allow other package implementors to indicate a dependency on particular features (where a bug fix might be considered a feature, but it is not usually necessary to consider it that way)."
year_published = 2025
