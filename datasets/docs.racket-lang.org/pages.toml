["https://docs.racket-lang.org/actor/index.html"]
title = "Kill-Safe Actors"
full_description = "This package provides a macro and runtime support for writing kill-safe actors using the techniques described in the “Kill-Safe Synchronization Abstractions”[Flatt04] paper. Each method takes as a first argument the current state, followed by any arguments sent by the sender, and must return two values: the next state and a value to return to the sender. Each actor runs in its own thread/suspend-to-kill and sending an actor a message will resume its thread if it has been killed. Any one actor is guaranteed to only be processing one message at a time. The #:state argument accepts an expression that produces the initial state of the actor. If not provided, the initial state of an actor is #f. The #:event argument accepts a procedure that takes the current state and produces an additional event that the actor should handle (which could be a choice-evt). If selected for synchronization, the synchronization result of the event will be used as the next state of the actor. The #:receive? argument accepts a procedure that takes a state and returns a boolean value representing whether or not the actor should receive new messages. The default value of receive?-proc-expr is a procedure that ignores its argument and always returns #t. The #:stopped? argument accepts a procedure that takes a state and returns a boolean value representing whether or not the actor should stop running its internal event loop. When this procedure returns #t, the actor stops receiving new messages and drains any pending responses to senders before finally applying the on-stop-proc-expr with the final state. The #:on-stop argument accepts a procedure that is called with the final state when the actor stops running its event loop. The default value of the on-stop-proc-expr is void."
year_published = 2025
clearnet = "https://docs.racket-lang.org/actor/index.html"
