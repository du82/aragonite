["https://docs.racket-lang.org/r6rs/r6rs-std/r6rs-Z-H-14.html"]
title = "Revised^6 Report on the Algorithmic Language Scheme"
full_description = "This chapter describes Scheme’s (rnrs base (6))library, which exports many of the procedure and syntax bindings that are traditionally associated with Scheme. Section 11.20 defines the rules that identify tail calls and tail contexts in constructs from the (rnrs base (6)) library. These predicates define the base types boolean, pair, symbol, number, char (or character), string, vector, and procedure. Moreover, the empty list is a special object of its own type. Note that, although there is a separate boolean type, any Scheme value can be used as a boolean value for the purpose of a conditional test; see section 5.7. Definitionsmay appear within a <top-level body> (section 8.1), at the top of a <library body> (section 7.1), or at the top of a <body> (section 11.3). A <definition> may be a variable definition (section 11.2.1) or keyword definition (section 11.2.1). Macro uses that expand into definitions or groups of definitions (packaged in a begin, let-syntax, or letrec-syntax form; see section 11.4.7) may also appear wherever other definitions may appear. The define form described in this section is a <definition>used to create variable bindings and may appear anywhere other definitions may appear. The first from of define binds <variable> to a new location before assigning the value of <expression> to it. Implementation responsibilities: Implementations should detect that the continuation of <expression> is invoked more than once. If the implementation detects this, it must raise an exception with condition type &assertion. In the third form of define, <formals> must be either a sequence of zero or more variables, or a sequence of one or more variables followed by a dot . and another variable (as in a lambda expression, see section 11.4.2). This form is equivalent to The define-syntax form described in this section is a <definition>used to create keyword bindings and may appear anywhere other definitions may appear. Binds <keyword> to the value of <expression>, which must evaluate, at macro-expansion time, to a transformer. Macro transformers can be created using the syntax-rules and identifier-syntax forms described in section 11.19. See library section on “Transformers” for a more complete description of transformers."
