["https://docs.racket-lang.org/aoc-racket/Day_18.html"]
title = "18 Day 18"
full_description = "These rules are equivalent to an implementation of Conway’s Game of Life (recall that we implemented another Conway algorithm in Day 10). To model our lighting grid, we’ll reuse our technique from Day 6 of using a single vector and translating between Cartesian coordinates and vector indexes. A lit bulb will be represented by 1, an unlit bulb by, you guessed it, 0. The heavy lifting is in the iterate-grid function, which steps through each bulb, looks at the eight adjacent bulbs in the previous grid, and determines whether the bulb should be on or off. As we think about that function, we might notice that life will be easier if we don’t have to make special accommodations for bulbs at the edges of the grid, which ordinarily don’t have eight adjacent bulbs. So what we’ll do is add a margin of bulbs around the perimeter, and leave them in the off position. That way, all the bulbs in our original grid will have an eight-bulb neighborhood. So instead of modeling our grid with a 100 × 100 = 10,000 unit vector, we’ll use a 102 × 102 = 10,404 unit vector. After that, it’s just a matter of loading our input data into a grid, running iterate-grid 100 times — a great job for for/fold — and counting the activated bulbs in the resulting grid. Same as above, except we turn on the four corner bulbs after parsing the input, and after every iteration."
year_published = 2025
clearnet = "https://docs.racket-lang.org/aoc-racket/Day_18.html"
