["https://docs.racket-lang.org/algebraic/tut_core.html"]
title = "5.1 The Core Calculus"
full_description = "When a term eventually reduces to a particular value, we say the term evaluates to that value. A term may never reduce to a value if the computation diverges or gets stuck. Some divergent terms are useful as infinite loops. Any stuck term is an error. A pattern (p) is a syntactic form that produces a set of variable bindings (σ) when matched with a compatible term. An application (t t) is a pair of juxtaposed sub-terms. Nested applications are always parenthesized. A sequence (t;t) is a pair of sub-terms separated by a semicolon in the model and prefixed by a dollar sign ($) in code. Sequences combine multiple terms into a single unit. They are used for holding the non-tag elements of a tagged list. A function clause (φp.t) or macro clause (μp.t) is a λ-abstraction with the formal parameter generalized to a pattern. A uniform sequence (t;·) is a right-hand nesting of sequences in which every left-hand side holds the same kind of term and every right-hand side, except perhaps the last, is the same kind of uniform sequence. Uniform sequences combine multiple abstractions into a single unit. A function (φp.t;·) is a function clause or a uniform sequence of them, and a macro (μp.t;·) is one or more macro clauses in sequence. A variable (x) is a name that may be bound to a term in the body of a function clause or macro clause. We say a variable not bound by an abstraction is free. All free variables are stuck. For convenience, constructor names begin with an uppercase letter and variable names begin with a lowercase letter. Finally, the unit (◊) value denotes the presence of a value, as a convenient notation for when the actual value is irrelevant. Abstract syntax drives the interpreter, but it makes a poor surface syntax. We might have to cross-check the code and the model several times, so it would be convenient to have a surface syntax that resembles the formal syntax. The parser’s job is to map s-expressions onto the members of Term. Some terms have a pattern, and patterns are parsed by different rules than terms. Although constructor arities are not encoded in the data declaration, we can anticipate the following:"
