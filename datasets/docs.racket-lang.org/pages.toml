["https://docs.racket-lang.org/pkg/lib.html"]
title = "7.2 Package Management Functions"
full_description = "Use these form to wrap uses of functions from pkg/lib that are documented to require the lock. Other functions from pkg/lib take the lock as needed. The default value uses error with 'pkg as the first argument. The raco pkg command sets this parameter to use raise-user-error with the sub-command name as its first argument. For multiple calls to pkg-directory, supply the same equal?-based mutable hash table (initially empty) as the cache argument. Otherwise, package-installation information must be re-parsed on every call to pkg-directory. The optional path argument is intended for use when type is 'clone, in which case it specifies a directory containing the repository clone (where the repository itself is a directory within path). Changed in version 6.1.1.1 of package base: Added 'git as a type.Changed in version 6.1.1.5: Added 'clone as a type.Changed in version 8.0.0.13: Added 'git-url as a type. If strip is not #f, then files and directories are removed from the prepared directory the same as when creating the corresponding kind of package. A directory that is staged in-place cannot be stripped. If force-strip? is true, then a consistency check (intended to avoid stripping a source package as binary, for example) is skipped. If use-cache? is true, then a local cache is consulted before downloading a particular package with a particular checksum. Note that the default for use-cache? is #f, while the default is #t for other functions that accept #:use-cache?. The result is the package name, the directory containing the unpacked package content, the checksum (if any) for the unpacked package, whether the directory should be removed after the package content is no longer needed, and a list of module paths provided by the package. If from-command-line? is true, error messages may suggest specific command-line flags for raco pkg config. If default-scope-scope is not #f, then it specifies potentially narrower scope than (current-pkg-scope) where 'default-scope is configured. That information may trigger output to warn a user that a 'default-scope setting in a wider scope does not have any effect. See also pkg-config-default-scope-scope."
