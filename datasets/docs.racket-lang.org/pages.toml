["https://docs.racket-lang.org/drracket/prefs-explanation.html"]
title = "3.2 Preferences"
full_description = "DrRacket comes with a number of different color schemes that you can choose from. The Classic and White on Black schemes are actually a matched pair that, under Mac OS and Linux will be chosen based on the operating system’s dark-mode configuration. Similarly for the two Tol’s color-blind safe modes. This section of the preferences configures the default background color and the colors used behind matching parentheses. The Parenthesis color scheme menu also includes options that shade nested parentheses darker and lighter, based on the nesting depth. The remaining panels inside the Colors panel allow the configuration of many different colors that DrRacket uses for specific parts of its interface. This panel controls which keywords DrRacket recognizes for indenting, and how each keyword is treated. To decide how a particular line is indented, DrRacket starts at the beginning of the line and looks for an enclosing s-expression. It finds the first symbol after that open parenthesis, and uses that to determine how to indent the line. If the symbol is not listed in any of the list boxes in the various sections, the contents of the Extra Regexp panel are consulted. They are regular expressions that are matched against the printed representation of the symbol, and if they match, the corresponding indentation style is used. This panel controls which keywords DrRacket uses to determine when to rewrite [ to (. For cond-like keywords, the number in parenthesis indicates how many sub-expressions are skipped before square brackets are started. Wrap words in editor buffers — If checked, DrRacket editors auto-wrap text lines by default. Changing this preference affects new windows only. Enable keybindings in menus — If checked, some DrRacket menu items have keybindings. Otherwise, no menu items have key bindings. This preference is designed for people who are comfortable editing in Emacs and find the standard menu keybindings interfere with the Emacs keybindings. Treat command key as meta — If checked, DrRacket will use the command key for some Emacs-like keybindings, instead of using it for menu shortcuts. This option is only available on Mac OS."
