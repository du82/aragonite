["https://docs.racket-lang.org/guide/lambda.html"]
title = "4.4 Functions: lambda"
full_description = "That is, a lambda expression can have a single rest-id that is not surrounded by parentheses. The resulting function accepts any number of arguments, and the arguments are put into a list bound to rest-id. Functions with a rest-id often use apply to call another function that accepts any number of arguments. The result of this form is a function that requires at least as many arguments as arg-ids, and also accepts any number of additional arguments. A rest-id variable is sometimes called a rest argument, because it accepts the “rest” of the function arguments. A function with a rest argument is sometimes called a variadic function, with elements in the rest argument called variadic arguments. Instead of just an identifier, an argument (other than a rest argument) in a lambda form can be specified with an identifier and a default value: An argument of the form [arg-id default-expr] is optional. When the argument is not supplied in an application, default-expr produces the default value. The default-expr can refer to any preceding arg-id, and every following arg-id must have a default as well. A lambda form can declare an argument to be passed by keyword, instead of position. Keyword arguments can be mixed with by-position arguments, and default-value expressions can be supplied for either kind of argument: An argument specified as arg-keyword arg-id is supplied by an application using the same arg-keyword. The position of the keyword–identifier pair in the argument list does not matter for matching with arguments in an application, because it will be matched to an argument value by keyword instead of by position. An arg-keyword [arg-id default-expr] argument specifies a keyword-based argument with a default value. The lambda form does not directly support the creation of a function that accepts “rest” keywords. To construct a function that accepts all keyword arguments, use make-keyword-procedure. The function supplied to make-keyword-procedure receives keyword arguments through parallel lists in the first two (by-position) arguments, and then all by-position arguments from an application as the remaining by-position arguments."
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/lambda.html"
