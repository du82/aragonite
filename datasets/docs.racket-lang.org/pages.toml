["https://docs.racket-lang.org/pkg/catalog-protocol.html"]
title = "8 Package Catalog Protocol"
full_description = '''In the case of a remote URL or a local directory naming a package catalog, the URL/path is extended as follows to obtain information about packages: pkg and ‹package› path elements, where ‹package› is a package name, plus a version=‹version› query (where ‹version› is a Racket version number) in the case of a remote URL. This URL/path form is used to obtain information about ‹package›. An HTTP request for a remote URL should respond with a read-able hash table, as described below. A path in a local directory formed by adding "pkg" and ‹package› should refer to a file that similarly contains a read-able hash table. 'source (required) — a package source string, typically a remote URL. If this source is a relative URL, then it is treated as relative to the catalog. 'dependencies (optional) — a list of dependencies for the package, in the same shape as a deps "info.rkt" field as described in Package Metadata. 'modules (optional) — a list of module paths for modules that are provided by the package; each module path should be normalized in the sense of collapse-module-path. 'versions (optional) — a hash table mapping version strings and 'default to hash tables, where each version-specific hash table provides mappings to override the ones in the main hash table, and 'default applies to any version not otherwise mapped. Clients of a remote catalog may request information for a specific version, but they should also check for a 'versions entry in a catalog response, in case a catalog with version-specific mappings is implemented as a directory or by a file-serving HTTP server. A 'default mapping, meanwhile, allows the main hash table to provide information that is suitable for clients at version 5.3.6 and earlier (which do not check for 'versions). pkgs path element: Obtains a list of package names that are mapped by the package catalog. An HTTP request for a remote URL should respond with a read-able list of strings. A path in a local directory formed by adding "pkgs" should refer to a file that similarly contains a read-able list of strings.'''
year_published = 2025
