["https://docs.racket-lang.org/algebraic/ref.html"]
title = "1 Algebraic Racket"
full_description = "Algebraic Racket is an extension for #lang racket/base that provides free-form, lexically scoped algebraic data structures along with several forms for creating functions and macros with a uniform and compact destructuring syntax. The destructuring syntax for algebraic data and most other data is the same for all function and macro forms. Algebraic data constructors are like type tags. When applied to an argument list, they produce an instance—a list of unnamed fields with the constructor at its head. They are easy to print and easy to parse, just like prefab structs, except algebraic data is lexically scoped and has a natural ordering. The bindings documented in this section are provided by the algebraic/data and algebraic/racket/base libraries. The data form defines several procedures and syntax transformers for working with named product and sum data structurs. A product identifies a family of structures comprising a list of fields, and a sum is a list of products. Each product name is bound to a constructor function that creates instances of the named product. A product instance is a concrete expression of the product as a tagged tuple of run-time values or expansion-time syntax fragments. To prevent sum and product names from clashing, the sum bindings are defined in their own namespace. Use the sum form to add the appropriate scope to an identifier. sum-id?, for each sum-id; a predicate that returns #t for the sum bound to sum-id, its products or their instances, and #f for any other value. product-id?, for each product-id; a predicate that returns #t for the product constructor bound to product-id or its instances and #f for any other value. To prevent clashes between sums and products with the same name, sum bindings are defined in their own namespace. This form adds a scope to id that represents the sum namespace. A function is a procedure that either deconstructs or rejects a fully-evaluated argument or argument list. Functions are created with the single-argument φ (or phi) and function forms, or the multi-argument variants φ* (or phi*) and function*."
year_published = 2025
