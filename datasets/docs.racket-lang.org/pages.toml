["https://docs.racket-lang.org/asi64/index.html"]
title = "Asi64"
full_description = "The Racket based cross-platform 6502 assembler. Primarily aimed at programming the Commodore 64, with VICE emulator support. The overall philosophy of this project is to take an old idea (a 6502 macro assembler) and supercharge it with Racket’s macro system. The end result is a powerful combination of part assembler, part meta-programming language that lets you combine all the power of Racket with a raw but feature-rich assembler. Since Racket embraces this manner of design, it is quite easy to change, extend, or even build new languages over the top of it. The assembler is primarily aimed at programming the Commodore 64, and includes support for the emulator VICE. It is able to launch the emulator post-compilation, passing along both your breakpoints and labels, resulting in a fast development cycle. The full instruction set is supported, including the illegal opcodes. An assembler is a powerful low-level tool. An overall choice was made to expose all (or almost all) of the internals of the assembler to the programmer. The special assembler syntax provided is, afterall, simply a wrapper around the underlying library, consisting of some macros, functions and read-table modifications. The programmer is able to inspect and modify the assembler internals as they please. This can make it easier to write complex macros that directly program the internals without having to jump through hoops using the provided layers of syntax. The first few lines tell the assembler where to create the output file, whether to start the emulator post-assembly, and the location of the emulator itself. See Emulator Configuration for more information. An asi64 program must contain a single core form C64. Within this form is expected to be a single 6502 block, denoted by { }. If you compile this program, it should assemble the resulting file and start the emulator with it for you to enjoy (hopefully!) Asi64 tries to stay as close to traditional 6502 assembler as possible. However, a few changes had to be made to ensure all of Racket is available."
year_published = 2025
clearnet = "https://docs.racket-lang.org/asi64/index.html"
