["https://docs.racket-lang.org/syntax/More_Keyword_Arguments.html"]
title = "1.2.5 More Keyword Arguments"
full_description = "This section shows how to express the syntax of struct’s optional keyword arguments using syntax-parse patterns. The part of struct’s syntax that is difficult to specify is the sequence of struct options. Let’s get the easy part out of the way first. There are still some problems, though. Without additional help, ~optional does not report particularly good errors. We must give it the language to use, just as we had to give descriptions to sub-patterns via syntax classes. Also, some related options are mutually exclusive, such as #:inspector, #:transparent, and #:prefab. Note that there are other constraints that we have not represented in the pattern. For example, #:prefab is also incompatible with both #:guard and #:property. Repetition constraints cannot express arbitrary incompatibility relations. The best way to handle such constraints is with a side condition using #:fail-when."
