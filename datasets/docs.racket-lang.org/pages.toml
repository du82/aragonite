["https://docs.racket-lang.org/guide/Emacs.html"]
title = "24.2 Emacs"
full_description = "Racket mode provides thorough syntax highlighting and DrRacket-style REPL and buffer execution support for Emacs. Quack is an extension of Emacs’s scheme-mode that provides enhanced support for Racket, including highlighting and indentation of Racket-specific forms, and documentation integration. Quack is included in the Debian and Ubuntu repositories as part of the emacs-goodies-el package. A Gentoo port is also available (under the name app-emacs/quack). Geiser provides a programming environment where the editor is tightly integrated with the Racket REPL. Programmers accustomed to environments such as Slime or Squeak should feel at home using Geiser. Geiser requires GNU Emacs 23.2 or better. Quack and Geiser can be used together, and complement each other nicely. More information is available in the Geiser manual. Debian and Ubuntu packages for Geiser are available under the name geiser. A Gentoo port is also available (under the name app-emacs/geiser). Emacs ships with a major mode for Scheme, scheme-mode, that while not as featureful as the above options, works reasonably well for editing Racket code. However, this mode does not provide support for Racket-specific forms. No Racket program is complete without documentation. Scribble support for Emacs is available with Neil Van Dyke’s Scribble Mode. In addition, texinfo-mode (included with GNU Emacs) and plain text modes work well when editing Scribble documents. The Racket major modes above are not really suited to this task, given how different Scribble’s syntax is from Racket’s. Paredit is a minor mode for pseudo-structurally editing programs in Lisp-like languages. In addition to providing high-level S-expression editing commands, it prevents you from accidentally unbalancing parentheses. Smartparens is a minor mode for editing s-expressions, keeping parentheses balanced, etc. Similar to Paredit. Symex is an intuitive modal (Vim-like) way of editing code with minimum keystrokes, built on top of a DSL providing advanced structural editing features, and runtime integration with Racket Mode."
