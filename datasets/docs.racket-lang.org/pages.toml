["https://docs.racket-lang.org/RifL/index.html"]
title = "RifL: a playing card stack language"
full_description = "Tactile means that RifL can be fully represented with real-world objects: RifL is written in playing cards. You can spread cards out on a table and perform RifL code by hand. Auto-imperative means that RifL code represents a state, and then augments its own state. The cards encode information and can also encode instruction to transform that information. Esoteric means that the language is not meant for practical use. RifL is intended as a educational tool, to teach to students who learn best physically. It is also meant as an affordable method of introducing programming concepts. RifL can help teach computer memory and algorithms. If you wish to run RifL code physically, you will need a bunch of decks of cards (they don’t need to all be the same brand, size, or even complete decks, just make sure you have Jokers), as well as masking tape, a sharpie, a coin or token, and the documentation below. The first chapter, Introduction, teaches you how to read, write, and execute RifL code both physically and on a computer. The second chapter, Data, explains how RifL turns cards into numbers, words, and references. The third chapter, Royal, thoroughly covers how RifL can manipulate that data. The final chapter, Extras, has RifL code examples, past and future development information, and acknowledgements. The best way to start learning RifL is from a top down view. You will need to be familiar with a 52 card deck (along with Jokers), so if you are unfamiliar, go and grab one now and look through it. This chapter overviews how RifL operates, and teaches you to read, write, and execute RifL code both physically and on a computer. To write and read RifL code, a notation system for cards is needed. All cards have a pip value, followed by a suit letter (except for Jokers which have no suit). The pips are: Aces can also be written as 1, and Tens can be written as 0. This documentation will default to using 1 for aces, and 0 for tens, so keep this in mind when reading further. All of the cards we have discussed so far as face-up. Cards in RifL can also be face-down. Face-down cards are written with a F in front."
year_published = 2025
