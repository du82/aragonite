["https://docs.racket-lang.org/syntax/stxparse-patterns.html"]
title = "1.5 Syntax Patterns"
full_description = "When a special form in this manual refers to syntax-pattern (eg, the description of the syntax-parse special form), it means specifically single-term pattern. like ~alt if the pattern occurs directly before ellipses (...) or immediately within another ~alt pattern The context-sensitive interpretation of ~or is a design mistake and a common source of confusion. Use ~alt and ~or* instead. A single-term pattern (abbreviated S-pattern) is a pattern that describes a single term. These are like the traditional patterns used in syntax-rules and syntax-case, but with additional variants that make them more expressive. “Single-term” does not mean “atomic”; a single-term pattern can have complex structure, and it can match terms that have many parts. For example, (17 ...) is a single-term pattern that matches any term that is a proper list of repeated 17 numerals. The list patterns (for “list pattern”) are single-term patterns having a restricted structure that guarantees that they match only terms that are proper lists. If id is the “pattern” name of an entry in the literals list, it is a literal pattern that behaves like (~literal id). If id is of the form pvar-id:syntax-class-id (that is, two names joined by a colon character), it is an annotated pattern variable, and the pattern is equivalent to (~var pvar-id syntax-class-id). Note that an id of the form :syntax-class-id is legal; see the discussion of a ~vars+ form with a zero-length pvar-id. If id is of the form pvar-id:literal-id, where literal-id is in the literals list, then it is equivalent to (~and (~var pvar-id) literal-id). A pattern variable. If pvar-id has no syntax class (by #:convention), the pattern variable matches anything. The pattern variable is bound to the matched subterm, unless the pattern variable is the wildcard (_), in which case no binding occurs. If pvar-id does have an associated syntax class, it behaves like an annotated pattern variable with the implicit syntax class inserted."
year_published = 2025
