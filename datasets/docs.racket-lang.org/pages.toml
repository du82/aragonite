["https://docs.racket-lang.org/guide/racket.html"]
title = "21.1 Running racket and gracket"
full_description = "The gracket executable is the same as racket, but with small adjustments to behave as a GUI application rather than a console application. For example, gracket by default runs in interactive mode with a GUI window instead of a console prompt. GUI applications can be run with plain racket, however. Depending on command-line arguments, racket or gracket runs in interactive mode, module mode, or load mode. When racket is run with no command-line arguments (other than configuration options, like -j), then it starts a REPL with a > prompt: For enhancing your REPL experience, see xrepl; for information on GNU Readline support, see readline. To initialize the REPL’s environment, racket first requires the racket/init module, which provides all of racket, and also installs pretty-print for display results. Finally, racket loads the file reported by (find-system-path 'init-file), if it exists, before starting the REPL. If any command-line arguments are provided (other than configuration options), add -i or --repl to re-enable the REPL. For example, If module-requiring flags appear before -i/--repl, they cancel the automatic requiring of racket/init. This behavior can be used to initialize the REPL’s environment with a different language. For example, starts a REPL using a much smaller initial language (that loads much faster). Beware that most modules do not provide the basic syntax of Racket, including function-call syntax and require. For example, produces a REPL that fails for every expression, because racket/date provides only a few functions, and not the #%top-interaction and #%app bindings that are needed to evaluate top-level function calls in the REPL. If a module-requiring flag appears after -i/--repl instead of before it, then the module is required after racket/init to augment the initial environment. For example, If a file argument is supplied to racket before any command-line switch (other than configuration options), then the file is required as a module, and (unless -i/--repl is specified), no REPL is started. For example,"
