["https://docs.racket-lang.org/br"]
title = "Beautiful Racket"
full_description = "This library provides the #lang br teaching language used in the book, as well as supporting modules that can be used in other programs. This library is designed to smooth over some of the small idiosyncrasies and inconsistencies in Racket, so that those new to Racket are more likely to say “ah, that makes sense” rather than “huh? what?” If you just want the code modules (for instance, for use as a dependency in another project) install the package beautiful-racket-lib. A datum is a literal representation of a single unit of Racket code, also known as an S-expression. Unlike a string, a datum preserves the internal structure of the S-expression. Meaning, if the S-expression is a single value, or list-shaped, or tree-shaped, so is its corresponding datum. When I use “datum” in its specific Racket sense, I use “datums” as its plural rather than “data” because that term has an existing, more generic meaning. Two special cases. First, a string that describes a list of datums is parenthesized so the result is a single datum. Second, an empty string returns void (not #f, because that’s a legitimate datum). This code will run the same way as before. But when it reaches first-condition?, you willl see in current-error-port: You can also add standalone calls to report as a debugging aid at points where the return value will be irrelevant, for instance: But be careful — in the example below, the result of the if expression will be skipped in favor of the last expression, which will be the value of x: If the first argument is a syntax pattern starting with id, then create a syntax transformer for this pattern using result-expr ... as the return value. As usual, result-expr ... needs to return a syntax object or you’ll get an error. The syntax-pattern notation is the same as syntax-case, with one key difference. If a pat-arg has a name written in CAPS, it’s treated as a named wildcard (meaning, it will match any expression in that position, and can be subsequently referred to by that name). Otherwise, pat-arg is treated as a literal (meaning, it will only match the same expression). If pat-arg is a literal identifier, it will only match another identifier with the same name and the same binding (in other words, identifiers are tested with free-identifier=?)."
year_published = 2025
