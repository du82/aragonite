["https://docs.racket-lang.org/aoc-racket/Day_22.html"]
title = "22 Day 22"
full_description = "This solution contributed by guest star Benjamin Greenman, because I had no patience for this puzzle. — MB The rules of the game are different this time. Instead of items, attack power, and defense power, we have mana and spells. The boss still has a fixed attack power, so we’ll use a 3-element struct to model the player and boss. Next, a few constants and helper functions to model spells. The key functions are apply-spell, which represents the actions a player can take during their turn, and apply-effect, which implements the delayed action of the shield, poison, and recharge spells. Both functions are parameterized over the player, boss, and current active spells. These three values represent the game state at any moment. The cost of one Magic Missile, plus the least-mana solution for a player with 50 - M hit points, 500 - 53 mana, and a boss with N - 4 hit points. The cost of one Drain spell, plus the least-mana solution for a player with 50 + 2 hit points, 500 - 73 mana, and a boss with N - 2 hit points. The cost of one Poison spell, plus the least-mana solution for a player with 50 - 7 hit points and 500 - 173 mana and a boss with N - 6 hit points, given that the Poison spell is active for 4 more turns. The cost of one Recharge spell, plus the least-mana solution for a player with 50 - 7 hit points and 500 - 229 + (101 * 2) mana against a boss with N hit points, given that the Recharge spell is active for 3 more turns. On hard mode, the player loses one hit point on their turn. Thanks to the optional keyword argument to win/least-mana, the answer is easy find. The algorithm as written is very slow. Unfortunately, there’s no better way to solve this problem than trying everything, but while the tests are running, think about what kind of caching strategy could improve performance."
year_published = 2025
