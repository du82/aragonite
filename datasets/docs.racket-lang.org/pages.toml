["https://docs.racket-lang.org/drracket/module.html"]
title = "2.1 Language Declared in Source"
full_description = 'The The Racket Language mode in DrRacket is a kind of meta-language, where the program itself specifies its language, usually through a #lang line. More generally, when using this mode, the definitions window must contain a module in some form. Besides #lang, a Racket module can be written as (module ...); aside from comments, the definitions window must contain exactly one module. DrRacket initializes the environment before it starts running the program in ways slightly different than the racket command-line binary does to reflect the extra GUI capabilities that it provides. Using the default settings in the language dialog, it initializes the parameters described in this subsection. Changing the defaults can result in additional parameters changing, as described in the next subsection. convertible values from pict/convert, which are rendered with padding specified by convert-bounds-padding around the bounding box to reduce edge effects numbers that are exact? and real?, but not integer?, which it prints specially to allow showing repeating decimal representations and mixed fractions, and DrRacket initializes the error-display-handler to specially highlight the source locations of the errors and to include icons that provide access to the stacktrace. In the details pane of the language dialog, some of the configuration options correspond to using various libraries and thus can be used without DrRacket. Here’s how, for the ones that are straightforward (the ones not mentioned here require more sophisticated configuration of various libraries). Dynamic Properties: The radio buttons corresond to various uses of the errortrace/errortrace-lib library. The Debugging option means (current-compile (make-errortrace-compile-handler)) as well as adding (build-path "compiled" "errortrace") to use-compiled-file-paths. The Debugging and profiling option means to use errortrace/errortrace-lib library’s profiling-enabled in conjunction with current-eval. The Syntactic test suite coverage option means to use test-coverage-enabled in conjunction with current-eval.'
