["https://docs.racket-lang.org/drracket/editor.html"]
title = "1.3 Editing with Parentheses"
full_description = "DrRacket’s editor provides special support for managing parentheses in a program. When the blinking caret is next to a parenthesis, DrRacket shades the region between the parenthesis and its matching parenthesis. This feature is especially helpful when balancing parentheses to complete an expression. DrRacket also has a highlighting mode that uses shading for nested parentheses, described in Colors. DrRacket also encourages a particular format for code in a language-specific manner. When you type Enter or Return, the editor inserts a new line and automatically indents it. To make DrRacket re-indent an existing line, move the blinking caret to the line and hit the Tab key. (The caret can be anywhere in the line.) You can re-indent an entire region by selecting the region and typing Tab. DrRacket also rewrites parenthesis as you type them, in order to make them match better. If you type a closing parenthesis ), a closing square bracket ], or a closing curly brace }, and if DrRacket can match it back to some earlier opening parenthesis, bracket, or brace, then DrRacket changes what you type to match. DrRacket also rewrites open square brackets, usually to an open parenthesis. There are some exceptions where opening square brackets are not automatically changed to parentheses: If the square bracket is after cond-like keyword, potentially skipping some of the sub-expressions in the cond-like expression (for example, in a case expression, the square brackets start in the second sub-expression). If the square bracket begins a new expression immediately after a local-like keyword. Note that the second expression after a local-like keyword will automatically become an ordinary parenthesis. If the square bracket is in a sequence and the s-expression before in the sequence is a compound expression, DrRacket uses the same kind parenthesis, brace, or bracket as before, or The upshot of DrRacket’s help is that you can always use the (presumably unshifted) square brackets on your keyboard to type parenthesis. For example, when typing"
year_published = 2025
clearnet = "https://docs.racket-lang.org/drracket/editor.html"
