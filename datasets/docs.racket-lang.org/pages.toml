["https://docs.racket-lang.org/syntax/Source_Locations.html"]
title = "9 Source Locations"
full_description = "There are two libraries in this collection for dealing with source locations; one for manipulating representations of them, and the other for quoting the location of a particular piece of source code. This module defines utilities for manipulating representations of source locations, including both srcloc structures and all the values accepted by datum->syntax’s third argument: syntax objects, lists, vectors, and #f. Changed in version 8.1.0.5 of package base: Changed format to separate a line and column with : instead of . Note: The examples below illustrate the use of these macros and the representation of their output. However, due to the mechanism by which they are generated, each example is considered a single character and thus does not have realistic line, column, and character positions. Furthermore, the examples illustrate the use of source location quoting inside macros, and the difference between quoting the source location of the macro definition itself and quoting the source location of the macro’s arguments. You can achieve an effect similar to __FILE__ from Perl or Ruby and __file__ from Python by using quote-source-file. Quote various fields of the source location of form, or of the whole macro application if no form is given. Returns a path, symbol, list, or 'top-level, where 'top-level is produced when used outside of a module. A list corresponds to a submodule in the same format as the result of variable-reference->module-name. Any given submod-path-elements (as in a submod form) are added to form a result submodule path. To produce a name suitable for use in printed messages, apply path->relative-string/library when the result is a path. Builds the result using quote, a path, submod, or 'top-level, where 'top-level is produced when used outside of a module. Any given submod-path-elements (as in a submod form) are added to form a result submodule path."
