["https://docs.racket-lang.org/drracket/extending-drracket.html"]
title = "4 Extending DrRacket"
full_description = "DrRacket supports four forms of extension to the programming environment: keybindings, teachpacks, scripts, and plugins. The Keybindings menu item allows the addition of user defined keybindings. For information on creating user defined keybindings, see Defining Custom Shortcuts. The Scripts menu provided by the Quickscript plugin, makes it easy to extend DrRacket with small Racket scripts that can be used in the definition (or interaction) window, or to graphically interact with the user. For information on creating scripts, see Quickscript, a scripting plugin for DrRacket. A teachpack extends the set of procedures that are built into a language in DrRacket. For example, a teachpack might extend the Beginning Student language with a procedure for playing sounds. Teachpacks are particularly useful in a classroom setting, where an instructor can provide a teachpack that is designed for a specific exercise. To use the teachpack, each student must download the teachpack file and select it through the Language|Add Teachpack... menu item. A plugin extends the set of utilities within the DrRacket environment. For example, DrRacket’s Check Syntax button starts a syntax-checking plugin. For information on creating plugins, see DrRacket Plugins. Customization of the DrRacket environment is available via Preferences menu item, along the the facility to define new color schemes. Existing color-scheme packages are tagged “colorscheme”. Teachpacks are designed to supplement student programs with code that cannot be expressed in a teaching language. For example, to enable students to play hangman, we supply a teachpack that All these tasks are beyond students in the third week and/or impose memorization of currently useless knowledge on students. The essence of the hangman game, however, is not. The use of teachpacks enables the students to implement the interesting part of this exercise and still be able to enjoy today’s graphics without the useless memorization. A single Racket source file defines a teachpack (although the file may access other files via require). The file must contain a module (see Modules). Each exported syntax definition or value definition from the module is provided as a new primitive form or primitive operation to the user, respectively."
year_published = 2025
