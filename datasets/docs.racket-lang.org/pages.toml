["https://docs.racket-lang.org/syntax/Phases_and_Reusable_Syntax_Classes.html"]
title = "1.2.1 Phases and Reusable Syntax Classes"
full_description = "As demonstrated in the Introduction, the simplest place to define a syntax class is within the macro definition that uses it. But that limits the scope of the syntax class to the one client macro, and it makes for very large macro definitions. Creating reusable syntax classes requires some awareness of the Racket phase level separation. A syntax class defined immediately within a module cannot be used by macros in the same module; it is defined at the wrong phase. In the module above, the syntax class foo is defined at phase level 0. The reference to foo within macro, however, is at phase level 1, being the implementation of a macro transformer. (Needing to require syntax/parse twice, once normally and once for-syntax is a common warning sign of phase level incompatibility.) The phase level mismatch is easily remedied by putting the syntax class definition within a begin-for-syntax block: In the revised module above, foo is defined at phase 1, so it can be used in the implementation of the macro. An alternative to begin-for-syntax is to define the syntax class in a separate module and require that module for-syntax. If a syntax class refers to literal identifiers, or if it computes expressions via syntax templates, then the module containing the syntax class must generally require for-template the bindings referred to in the patterns and templates. In 'arith-stxclass-mod, the module 'arith-keywords-mod must be required for-template because the keywords are used in phase-0 expressions. Likewise, the module racket must be required for-template because the syntax class contains syntax templates involving + and * (and, in fact, the implicit #%app syntax). All of these identifiers (the keywords plus and times; the procedures + and *; and the implicit syntax #%app) must be bound at “absolute” phase level 0. Since the module 'arith-stxclass-mod is required with a phase level offset of 1 (that is, for-syntax), it must compensate with a phase level offset of -1, or for-template."
year_published = 2025
clearnet = "https://docs.racket-lang.org/syntax/Phases_and_Reusable_Syntax_Classes.html"
