["https://docs.racket-lang.org/amb-parser/index.html"]
title = "amb-parser: Parser generator for ambiguous grammars"
full_description = "This is a very simple parser generator that mimics brag (and actually its built on top of it). It is designed for parsing English text. Support for tokens that have multiple types attached. For example, the word cook in English may be either a verb or a noun. Note: the parser does not support left-recursion. (Yet Another Parser that Doesn’t Support Left Recursion, yapdslr). You will be provided with the parse function. You can use this function to parse your text. But before, your text should be separated into tokens. In this section we will describe the structure of the parse tree without specifying that the parser returns multiple results and every parser-result contains the rest of tokens. Every expansion rule1 rule2 will be parsed as an association list, where keys and values are organized as list with two elements, keys are rule names and values are the result of parsing the rules. Every terminal terminal will be parsed as (list ’terminal token-str) where token-str is the string of the matched token. If some parsing is failed then the parse returns empty (meaning there is no derivation trees and no parser results). Parser returns a list of all possible derivation trees. The results are organized into parser-result structures. WARNING: There is a bad design desicion. The parse function requires a list of tokens, instead of a lambda function that generates tokens on demand."
