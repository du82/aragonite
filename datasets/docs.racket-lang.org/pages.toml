["https://docs.racket-lang.org/aoc-racket/Day_25.html"]
title = "25 Day 25"
full_description = "The puzzle involves a series of codes in a grid. The first code is 20151125 and subsequent codes are computed by multiplying by 252533 and calculating the remainder after dividing by 33554393. Then the codes are put into a grid in diagonal fashion, in the order shown: | 1 2 3 4 5 6 ++++++++++++++++++++++ 1 | 1 3 6 10 15 21 2 | 2 5 9 14 20 3 | 4 8 13 19 4 | 7 12 18 5 | 11 17 6 | 16 The grid is described as infinite. But this doesn’t play a role in the puzzle, since our job is to find the number at the finite coordinate given in our input. So we need a function for finding the nth code in the series, and a function for finding which n resides at a given grid location. Short & sweet."
