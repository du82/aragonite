["https://docs.racket-lang.org/r6rs/r6rs-std/r6rs-Z-H-12.html"]
title = "Revised^6 Report on the Algorithmic Language Scheme"
full_description = "After the import form within a library form or a top-level program, the forms that constitute the body of the library or the top-level program depend on the libraries that are imported. In particular, imported syntactic keywords determine the available syntactic abstractions and whether each form is a definition or expression. A few form types are always available independent of imported libraries, however, including constant literals, variable references, procedure calls, and macro uses. The entries in this section all describe expressions, which may occur in the place of <expression> syntactic variables. See also section 11.4. An expression consisting of a representation of a number object, a boolean, a character, a string, or a bytevector, evaluates “to itself”. An expression consisting of a variable(section 5.2) is a variable reference if it is not a macro use (see below). The value of the variable reference is the value stored in the location to which the variable is bound. It is a syntax violation to reference an unboundvariable. A procedure call consists of expressions for the procedure to be called and the arguments to be passed to it, with enclosing parentheses. A form in an expression context is a procedure call if <operator> is not an identifier bound as a syntactic keyword (see section 9.2 below). When a procedure call is evaluated, the operator and operand expressions are evaluated (in an unspecified order) and the resulting procedure is passed the resulting arguments. If the value of <operator> is not a procedure, an exception with condition type &assertion is raised. Also, if <operator> does not accept as many arguments as there are <operand>s, an exception with condition type &assertion is raised. Although the order of evaluation is otherwise unspecified, the effect of any concurrent evaluation of the operator and operand expressions is constrained to be consistent with some sequential order of evaluation. The order of evaluation may be chosen differently for each procedure call."
year_published = 2025
