["https://docs.racket-lang.org/guide/regexp-quant.html"]
title = "9.5 Quantifiers"
full_description = "The quantifiers *, +, and ? match respectively: zero or more, one or more, and zero or one instances of the preceding subpattern. In #px syntax, you can use braces to specify much finer-tuned quantification than is possible with *, +, ?: The quantifier {m} matches exactly m instances of the preceding subpattern; m must be a nonnegative integer. The quantifier {m,n} matches at least m and at most n instances. m and n are nonnegative integers with m less or equal to n. You may omit either or both numbers, in which case m defaults to 0 and n to infinity. It is evident that + and ? are abbreviations for {1,} and {0,1} respectively, and * abbreviates {,}, which is the same as {0,}. The quantifiers described so far are all greedy: they match the maximal number of instances that would still lead to an overall match for the full pattern. To make these quantifiers non-greedy, append a ? to them. Non-greedy quantifiers match the minimal number of instances needed to ensure an overall match. The non-greedy quantifiers are *?, +?, ??, {m}?, and {m,n}?, although {m}? is always the same as {m}. Note that the metacharacter ? has two different uses, and both uses are represented in ??."
year_published = 2025
