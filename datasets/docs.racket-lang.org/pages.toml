full_description = "The following functions are intended to provide a very direct style approach for both text attributes and colors. The core functions are with-attribute, text-color and on-background which are then simplified further by attribute- and color-specific functions. In all cases the function will take an optional parameter return-to which will specify an attribute or color to set once the provided string has been formatted. In the case of attributes the value 'auto will use a corresponding code to turn off the attribute. For colors the value 'default will use a specific code for either the default foreground or default background color. As mentioned above the value 'auto for return-to will use the control sequence to turn off attribute. In the following example the return-to value is the attribute 'not-underline. The following example defines a formatting function ~f which formats numbers in an accounting fashion. For the purposes of this example note that negative amounts are rendered in red and totals have an overline, underline, and are bold. As mentioned above the value 'default for return-to will use the control sequence for the default foregound color. As mentioned above the value 'default for return-to will use the control sequence for the default backgound color. This section allows for more complex styling in that styles can be more easily combined and also defined in a reusasable structure, the style?. '(text blue) – Sets the foreground color, note that the first symbol may be also be 'fg or 'foreground. '(on green) – Sets the background color, note that the first symbol may be also be 'bg or 'background."
year_published = 2025
