["https://docs.racket-lang.org/drracket/Menus.html"]
title = "3.1 Menus"
full_description = 'Open Require Path... : Opens a dialog where you can enter in a require-like module path (e.g., racket/base.rkt or data/splay-tree.rkt or "x.rkt") and edit the corresponding files in the definitions window. Reopen Closed Tab : Opens previously closed tabs. If no tabs were closed in current session, files from previous sessions are opened. Install PLT File... : Opens a dialog asking for the location of the ".plt" file (either on the local disk or on the web) and installs the contents of the file. Install Package... : Opens a dialog asking for the name of a package to install. See Package Management in Racket for more information on packages. Revert : Re-loads the file that is currently in the definitions window. All changes since the file was last saved will be lost. Save Definitions : Saves the program in the definitions window. If the program has never been saved before, a save-file dialog appears. Save Definitions As... : Opens a save-file dialog for choosing a destination file to save the program in the definitions window. Subsequent saves write to the newly-selected file. Save Definitions As Text... : Like Save Definitions As..., but the file is saved in plain-text format (see Program Files). Subsequent saves also write in plain-text format. Save Interactions : Saves the contents of the interactions window to a file. If the interaction constants have never been saved before, a save-file dialog appears. Save Interactions As... : Opens a save-file dialog for choosing a destination file to save the contents of the interactions window. Subsequent saves write to the newly-selected file. Save Interactions As Text... : Like Save Interactions As..., but the file is saved in plain-text format (see Program Files). Subsequent saves are write in plain-text format. Log Definitions and Interactions... : Starts a running of log of the text in the interactions and definitions windows, organized by executions. In a directory of your choosing, DrRacket saves files with the names "01-definitions", "01-interactions", "02-definitions", "02-interactions", etc. as you interact with various programs.'
