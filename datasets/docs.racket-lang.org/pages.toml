["https://docs.racket-lang.org/drracket/interactions-window.html"]
title = "1.6 The Interactions Window"
full_description = "The interactions window lets you type an expression after the > prompt for immediate evaluation. You cannot modify any text before the last > prompt. To enter an expression, the blinking caret must appear after the last prompt, and also after the space following the prompt. When you type a complete expression and hit Enter or Return, DrRacket evaluates the expression and prints the result. After printing the result, DrRacket creates a new prompt for another expression. Some expressions return a special “void” value; DrRacket never prints void, but instead produces a new prompt immediately. If the expression following the current prompt is incomplete, then DrRacket will not try to evaluate it. In that case, hitting Enter or Return produces a new, auto-indented line. You can force DrRacket to evaluate the expression by typing Alt-Return or Command-Return (depending on your platform). To copy the previous expression to the current prompt, type ESC-p (i.e., type Escape and then type p). Type ESC-p multiple times to cycle back through old expressions. Type ESC-n to cycle forward through old expressions. There are other keys that have these same functions; see Keyboard Shortcuts and the menu item Show Active Keybindings menu item in the Edit menu. Clicking the Run button evaluates the program in the definitions window and makes the program’s definitions available in the interactions window. Clicking Run also resets the interactions window, erasing all old interactions and removing old definitions from the interaction environment. Although Run erases old > prompts, ESC-p and ESC-n can still retrieve old expressions. Whenever DrRacket encounters an error while evaluating an expression, it prints an error message in the interactions window and highlights the expression that triggered the error. The highlighted expression might be in the definitions window, or it might be after an old prompt in the interactions window. For certain kinds of errors, DrRacket turns a portion of the error message into a hyperlink. Click the hyperlink to get help regarding a function or keyword related to the error."
year_published = 2025
