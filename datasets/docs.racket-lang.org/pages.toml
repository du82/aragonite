["https://docs.racket-lang.org/web-server-internal/dispatch-servlets.html"]
title = "2.14 Serving Servlets"
full_description = "The second return value is a procedure that uses url->path to resolve the URL to a path, then uses path->servlet to resolve that path to a servlet, caching the results in an internal table. Changed in version 1.3 of package web-server-lib: Added optional argument to first return value for list of URLs.Changed in version 1.3: Added optional argument to first return value for servlet finalizer procedure. A different namespace is needed for each servlet, so that if servlet A and servlet B both use a stateful module C, they will be isolated from one another. We see the Web Server as an operating system for servlets, so we inherit the isolation requirement on operating systems. However, there are some modules which must be shared. If they were not, then structures cannot be passed from the Web Server to the servlets, because Racket’s structures are generative. Since, on occasion, a user will actually wanted servlets A and B to interact through module C. A custom make-servlet-namespace can be created, through this procedure, that attaches module C to all servlet namespaces. Through other means (see Dispatchers) different sets of servlets can share different sets of modules."
