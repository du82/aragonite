["https://docs.racket-lang.org/alexis-util/Untyped_Utilities.html"]
title = "1 Untyped Utilities"
full_description = 'Using this function, a set of functions is generated using predicate-base-id as a base identifer to determine the names of the resulting definitions. This macro produces six functions, their names acquired by appending =?, >?, <?, <>?, >=?, and <=? to predicate-base-id. If adapter-expr is provided, then it must evaluate to a function that takes a single parameter and returns a single value. If specified, values will be threaded through adapter-expr before being passed to comparator-expr. This allows values to be mapped to other values before being provided to the comparator for additional processing or parsing. Racket provides hash-set and hash-update as purely functional ways to modify hashtables without mutation. This provides similar functionality for structures. Two functions are generated for each field. Their names are generated by appending -set and -update onto each of the accessor functions, and they are unhygienically introduced with the lexical context of struct-id. Each setter function is of the type (-> struct-id? any/c struct-id?). Each updater function is of the type (-> struct-id? (-> any/c any/c) struct-id?). The generated functions have contracts attached to them which ensure that the proper values are recieved. It’s easy to "wrap" existing procedures in order to extend them with additional functionality. For example, the following wraps + to additionally call add1 on the result: This is much harder to do, however, if the procedure being wrapped can accept keyword arguments, since they are not accepted in the "rest argument" syntax. Instead, make-keyword-procedure and keyword-apply must be used. This module provides some macros to make wrapping these procedures easier.'
