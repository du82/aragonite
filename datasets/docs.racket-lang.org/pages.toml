["https://docs.racket-lang.org/guide/Vim.html"]
title = "24.3 Vim"
full_description = 'Many distributions of Vim ship with support for Scheme, which will mostly work for Racket. Vim also ships with some special support for Racket. There is also support for several raco commands in the form of builtin compiler plugins; see :help compiler for more information. Vim will detect your Racket files as Scheme out of the box. To get the additional features of the Racket filetype, consider installing the vim-racket plugin from benknoble/vim-racket. It enables auto-detection of Racket files on top of enhanced indentation and syntax highlighting. Vim’s default support comes from a subset of this plugin; installing it yourself provides additional features. Many Racket languages still need syntax and indent support. If you create Vim support for other Racket languages, please consider contributing them to benknoble/vim-racket so other Vim users will benefit. If you use Enhanced Racket Support and Vim version 9 or greater, improved indentation for the racket filetype is configured out of the box. Otherwise, you can manually enable indentation for Racket by setting both the lisp and autoindent options in Vim. You will want to customize the buffer-local lispwords option to control how special forms are indented. See :help ’lispwords’. However, using lispwords for indentation can be limited and may not be as complete as what you can get in Emacs. You can also use Dorai Sitaram’s scmindent for better indentation of Racket code. The instructions on how to use the indenter are available on the website. Syntax highlighting for Scheme and Racket is shipped with Vim on many platforms. You will want to use the racket filetype for the best syntax experience; see Enhanced Racket Support for enhanced syntax highlighting for Racket languages. The Slimv plugin has a paredit mode that works like paredit in Emacs. However, the plugin is not aware of Racket. You can either set Vim to treat Racket as Scheme files or you can modify the paredit script to load on ".rkt" files. If you are installing many Vim plugins (not necessary specific to Racket), we recommend using a plugin that will make loading other plugins easier. There are many plugin managers.'
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/Vim.html"
