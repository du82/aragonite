["https://docs.racket-lang.org/aoc-racket/Day_20.html"]
title = "20 Day 20"
full_description = "We’re asked to imagine infinite elves delivering presents to an infinite sequence of houses. (Already I like this puzzle.) The first elf delivers a present to every house equal to 10 times his number (= 10); the second elf, 20 gifts to every second house; the nth elf, 10n gifts to every nth house. Math jocks will notice that the elf behavior roughly describes a Sieve of Eratosthenes. Each house is visited by elf n only if n is a divisor of the house number. (Houses that are primes are therefore only visited by the first elf.) Might there be a Racket function that finds the divisors of a number? Why, yes — it’s called divisors. We can use it to find the numbers of the elves that visit a house, and loop through house numbers till we reach the target. (The 10-gift multiplier is arbitrary.) Going with the math-jock vibe, what this condition means is that the highest-numbered house the nth elf will visit is 50n. So the answer for this question is like the first, but we’ll filter the list of elves using this condition."
