["https://docs.racket-lang.org/SSE/index.html"]
title = "SSE"
full_description = '''Let us start by defining a function that serves a website with a text area that is filled with messages coming from server sent events on port 8122. Now we define the server sent events, serve them on port 8122 and run the servlet for the function above on port 8080. Note that we are not using the function serve/servlet for serving the website. serve does not block the racket REPL. Now open a browser and visit http://localhost:8080. You are going to see a welcome message and an empty textarea. In order to add some text send a data only event as follows: Now open a new tab or window of your browser and go again to localhost:8080. Note that the message "Hello World!" does not appear in this window. This is because we used #:id with value #f (it is the default value). Let us now send one with #:id equal to #t. At this point the two windows that you have open will show the message "Hello World! (again)". This would be the case even with #:id equal to #f. What makes the difference is that if you open now a new tab and connect to localhost:8080, that window will also show this message. Server Sent Events (SSE) connections start with an http request for connection. The SSE standard allows 4 possible responses. The library has a way to represent each of them as shown in the following table. For the two hundred codes, the representation is simply a symbol. For the three hundred codes, it is a list with a symbol and string with the url of the redirection. A predicate to check if something is a proper representation of one of the http responses above. Racket servlets use functions that take an HTTP request and return an HTTP response. Similarly, the function make-sse takes a parameter called the initial request servlet, which takes a request and returns one of the four http responses allowed for SSE. If the response is 'accept, a connection for the event stream is established. Once a sse variable has been created it can be served on a specific port with the sse-serve function and messages can be sent using sse-send-event.'''
