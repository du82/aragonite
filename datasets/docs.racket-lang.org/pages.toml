["https://docs.racket-lang.org/pkg/Future_Plans.html"]
title = "11 Future Plans"
full_description = 'This section lists some short term plans for the package manager. These are important, but didn’t block its release. The package manager will be considered out of beta when these are completed. The official catalog server will divide packages into three categories: ring-0, ring-1, and ring-2. The definitions for these categories are: ring-0 — Must not conflict any package in ring-1 or ring-0. Must have documentation and tests. The author must be responsive about fixing regressions against changes in Racket, etc. Our goal is for all packages to be in ring-1, with ring-2 as a temporary place while the curators work with the authors of conflicting packages to determine how modules should be renamed for unity. However, before curation is complete, each package will be automatically placed in ring-2 or ring-1 depending on its conflicts, with preference being given to older packages. (For example, if a new package B conflicts with an old package A, then A will be in ring-1, but B will be in ring-2.) During curation, however, it is not necessarily the case that older packages have preference. (For example, tic-tac-toe should probably not provide "data/matrix.rkt", but that could be spun off into another package used by both tic-tac-toe and factory-optimize.) In contrast, the ring-0 category will be a special category that authors may apply for. Admission requires a code audit and implies a "stamp of approval" from PLT. In the future, packages in this category will have more benefits, such as automatic regression testing on DrDr, testing during releases, provided binaries, and advertisement during installation. In order to mitigate the costs of external linking vis a vis the inability to understand code in isolation, we will create exception printers that search for providers of modules on the configured package catalogs. For example, if a module requires "data/matrix.rkt", and it is not available, then the catalog will be consulted to discover what packages provide it. Only packages in ring-1 or ring-0 will be returned. (This category restriction ensures that the package to install is unique.)'
year_published = 2025
clearnet = "https://docs.racket-lang.org/pkg/Future_Plans.html"
