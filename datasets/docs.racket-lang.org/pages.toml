["https://docs.racket-lang.org/guide/contracts-examples.html"]
title = "7.7 Additional Examples"
full_description = "This section illustrates the current state of Racket’s contract implementation with a series of examples from Design by Contract, by Example [Mitchell02]. Mitchell and McKim’s principles for design by contract DbC are derived from the 1970s style algebraic specifications. The overall goal of DbC is to specify the constructors of an algebra in terms of its observers. While we reformulate Mitchell and McKim’s terminology and we use a mostly applicative approach, we retain their terminology of “classes” and “objects”: A query returns a result but does not change the observable properties of an object. A command changes the visible properties of an object, but does not return a result. In applicative implementation a command typically returns an new object of the same class. For each derived query, write a post-condition contract that specifies the result in terms of the basic queries. For each command, write a post-condition contract that specifies the changes to the observable properties in terms of the basic queries. Each of the following sections corresponds to a chapter in Mitchell and McKim’s book (but not all chapters show up here). We recommend that you read the contracts first (near the end of the first modules), then the implementation (in the first modules), and then the test module (at the end of each section). Mitchell and McKim use Eiffel as the underlying programming language and employ a conventional imperative programming style. Our long-term goal is to transliterate their examples into applicative Racket, structure-oriented imperative Racket, and Racket’s class system. Note: To mimic Mitchell and McKim’s informal notion of parametericity (parametric polymorphism), we use first-class contracts. At several places, this use of first-class contracts improves on Mitchell and McKim’s design (see comments in interfaces). This first module contains some struct definitions in a separate module in order to better track bugs."
year_published = 2025
