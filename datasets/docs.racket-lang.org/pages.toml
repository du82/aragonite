["https://docs.racket-lang.org/aoc-racket/Day_15.html"]
title = "15 Day 15"
full_description = "The puzzle. Our input is a list of four cookie ingredients. Each ingredient has scores for capacity, durability, flavor, texture, and calories in each teaspoon. This is similar the Day 14 puzzle. Rather than maximizing reindeer distance after 2503 seconds, we’re maximizing the score of a cookie after 100 teaspoons of ingredients. But while our “recipe” for a reindeer race included a full measure of each reindeer, our cookie recipes can have any combination of ingredients, as long as they total 100 teaspoons. Thus, similar to combinatoric problems like Day 9 and Day 13, we have to generate all possible cookie recipes that total 100 teaspoons, and then find the best-scoring recipe. Let’s do the receipe generator first, since that’s the new element. A recipe is a list of teaspoon amounts. A recipe can have any number of teaspoons for each ingredient, as long as they total to 100. This suggests a typical Rackety recursive pattern where we consider the possible amounts for the first ingredient (0–100 tsps) and then recursively generate recipes for the rest of the ingredients. For instance, suppose we have ingredients '(A B C D). If we use 5 tsp of A, we can combine this with every '(B C D) recipe that totals 95 tsps. In turn, if we use 10 tsp of B, we can combine this with every '(C D) recipe that totals 85 tsps. And so on, generating the whole tree of possibilities. As for the scoring. The scoring function is not per-ingredient. Rather, the quantity of each characteristic — other than calories, which appears last in each list of ingredient characteristics — is summed. Negative values are rounded up to zero. Then these characteristic scores are multiplied to get the cookie score. (In this puzzle, the reading comprehension is harder than the coding.) Having surveyed the territory, making ingredient functions from the text descriptions seems a little overblown. It’s just as convenient to represent each ingredient as a list of its characteristic values. So let’s just parse the input into lists of values and store them in a hash."
year_published = 2025
clearnet = "https://docs.racket-lang.org/aoc-racket/Day_15.html"
