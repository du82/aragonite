["https://docs.racket-lang.org/syntax/docprovide.html"]
title = "13 Attaching Documentation to Exports"
full_description = "The doc-label-id identifier is used as a key for accessing the documentation through lookup-documentation. The actual documentation is organized into “rows”, each with a section title. Creates a documentation section whose title is section-string, and provides/documents each name. The type-datum is arbitrary, for use by clients that call lookup-documentation. The doc-strings are also arbitrary documentation information, usually concatenated by clients. Multiple rows with the same section name will be merged in the documentation output. The final order of sections matches the order of the first mention of each section. Merges documentation and provisions from the specified module into the current one; the prefix-id is used to prefix the imports into the current module (so they can be re-exported). If ids are provided, the specified ids are not re-exported and their documentation is not merged."
