["https://docs.racket-lang.org/guide/define.html"]
title = "4.5 Definitions: define"
full_description = 'The function shorthand via define also supports a rest argument (i.e., a final argument to collect extra arguments in a list): Consider the following make-add-suffix function that takes a string and returns another function that takes a string: In a sense, make-add-suffix is a function that takes two arguments, but it takes them one at a time. A function that takes some of its arguments and returns a function to consume more is sometimes called a curried function. This shorthand reflects the shape of the function call (make-add-suffix "!"). The define form further supports a shorthand for defining curried functions that reflects nested function calls: The expansion of this shorthand has one nested lambda form for each head in the definition, where the innermost head corresponds to the outermost lambda. A Racket expression normally produces a single result, but some expressions can produce multiple results. For example, quotient and remainder each produce a single value, but quotient/remainder produces the same two values at once: Multiple-valued functions can be implemented in terms of the values function, which takes any number of values and returns them as the results: The define-values form binds multiple identifiers at once to multiple results produced from a single expression: A define form (that is not a function shorthand) is equivalent to a define-values form with a single id. When the grammar for a syntactic form specifies body, then the corresponding form can be either a definition or an expression. A definition as a body is an internal definition. Expressions and internal definitions in a body sequence can be mixed, as long as the last body is an expression. Internal definitions in a particular body sequence are mutually recursive; that is, any definition can refer to any other definition—as long as the reference isn’t actually evaluated before its definition takes place. If a definition is referenced too early, an error occurs. A sequence of internal definitions using just define is easily translated to an equivalent letrec form (as introduced in the next section). However, other definition forms can appear as a body, including define-values, struct (see Programmer-Defined Datatypes) or define-syntax (see Macros).'
year_published = 2025
