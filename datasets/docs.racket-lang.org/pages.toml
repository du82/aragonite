["https://docs.racket-lang.org/aoc-racket/Day_12.html"]
title = "12 Day 12"
full_description = 'I’ve never liked JavaScript, and spending more time with Racket has only deepened my antipathy. So I apologize if this solution is terse. To parse the file we’ll use the read-json function from Racket’s json library. This function converts the JSON into a JS-expression (see jsexpr?), which is a recursively nested data structure. If we had a simple recursively nested list, we could just flatten it and filter for the numbers. We’ll do something similar here — recursively flatten the JS-expression and pull out the numbers. If you’re new to Racket, notice the recursive descent pattern used in flatten-jsexpr — it’s a very common way of handling recursively structured data. We’ll just update our flattening function to skip over hash tables that have "red" among the values.'
