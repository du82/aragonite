title = "3.2 The Base Classes"
full_description = "The other members have the following default definitions, which may be overridden with equivalent specialized implementations: Some functors support an implementation of liftA2 that is more efficient than the default one. In particular, if fmap is an expensive operation, it is likely better to use liftA2 than to fmap over the structure and then use <*>. This is essentially the same as (>> liftA2 (flip const)), but if the functor instance has an optimized <$, it may be better to use that instead. The function (in this case, +) must be wrapped in one >>* for each applicative argument or <*> will fail. This variant wraps the function with >>*. Unless lazy semantics are desired, make the final operator in the chain eager (e.g., <*>) to evaluate the whole chain by force. The name of this operator is an allusion to $. Whereas $ is function application, <$> is function application lifted over a functor. The method names refer to the monoid of lists under concatenation, but there are many other instances. Some types can be viewed as a monoid in more than one way, e.g. both addition and multiplication on numbers. For most types, the default definition for mconcat will be used, but the function is included in the class definition so that an optimized version can be provided for specific types. Given that this works on a semigroup it is allowed to fail if you request 0 or fewer repetitions, and the default definition wll do so."
