["https://docs.racket-lang.org/guide/match.html"]
title = "12 Pattern Matching"
full_description = "The match form supports pattern matching on arbitrary Racket values, as opposed to functions like regexp-match that compare regular expressions to byte and character sequences (see Regular Expressions). The match form takes the result of target-expr and tries to match each pattern in order. As soon as it finds a match, it evaluates the corresponding expr sequence to obtain the result for the match form. If pattern includes pattern variables, they are treated like wildcards, and each variable is bound in the expr to the input fragments that it matched. Constructors like cons, list, and vector can be used to create patterns that match pairs, lists, and vectors: Unquoted, non-constructor identifiers in a pattern are pattern variables that are bound in the result expressions, except _, which does not bind (and thus is usually used as a catch-all): Note that the identifier else is not a reserved catch-all (like _). If else appears in a pattern then its binding from racket/base may be shadowed, and this can cause problems with cond and case. An ellipsis, written ..., acts like a Kleene star within a list or vector pattern: the preceding sub-pattern can be used to match any number of times for any number of consecutive elements of the list or vector. If a sub-pattern followed by an ellipsis includes a pattern variable, the variable matches multiple times, and it is bound in the result expression to a list of matches: Ellipses can be nested to match nested repetitions, and in that case, pattern variables can be bound to lists of lists of matches: The quasiquote form (see Quasiquoting: quasiquote and ‘ for more about it) can also be used to build patterns. While unquoted portions of a normal quasiquoted form mean regular racket evaluation, here unquoted portions mean go back to regular pattern matching. So, in the example below, the with expression is the pattern and it gets rewritten into the application expression, using quasiquote as a pattern in the first instance and quasiquote to build an expression in the second."
year_published = 2025
