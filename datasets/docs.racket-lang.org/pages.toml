["https://docs.racket-lang.org/acl2s/The_quote_form.html"]
title = "9 The quote form"
full_description = '''A quote form can also be written by putting a single-quote (apostrophe) before an expression. 'datum is equivalent to (quote datum). Quoting a name creates a symbol. Quoting a piece of literal data like a number, boolean, or string produces that same number, boolean, or string. It gets more complicitated when you use it with parentheses. It creates a list, but it also "distributes itself" over everything within it, including to every element of the list. So (quote (datum ...)) is equivalent to (list (quote datum) ...).'''
