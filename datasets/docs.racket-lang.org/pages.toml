["https://docs.racket-lang.org/pkg/implementation.html"]
title = "12 How Package Installation and Distribution Works"
full_description = 'Installation of a package installs collection links, so the package’s collections can be found to compile and load modules that use the package’s modules. If you use raco link -l to view installed links, you will see links that were put in place by the package system. Obviously, you should not directly modify those links. The raco setup tool drives raco make to compile Racket sources to bytecode form. Recompilation is determined by changes to file timestamps, SHA-1 hashes, and dependencies recorded in "dep" files. Since package installations are reflected as collection links, raco setup operations on collections implicitly handle packages. The raco setup tool is “aware” of packages to only a limited extent: it uses functions like path->pkg to print progress information in terms of packages, and it uses similar package-inspection functions to connect modules to package and check actual dependencies against declared package dependencies. The racket-index package, which extends raco setup to drive Scribble for collection-based documentation. The racket-index package implements the documentation-rendering analogue of raco make, detecting changes in documentation declarations and re-rendering documents as needed to pick up cross-reference changes. The racket-index package also implements special documents for the entry point to HTML-rendered documentation (i.e., the listing of all installed documentation), the HTML search page, the local-redirection page (which server-search links to locally installed files), and so on. Each of the three levels accommodate the user and installation package scopes, where the details in each case often differ between the scopes. Generally, references in the installation scope must be implemented as relative, so that an in-place installing of Racket can be moved to a different location. References in the user scope, meanwhile, may refer directly to the installation at some level; most references are collection-relative or installation-relative, so package content can be built in user scope and then assembled into a built package or binary package for installation elsewhere.'
year_published = 2025
clearnet = "https://docs.racket-lang.org/pkg/implementation.html"
