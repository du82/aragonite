["https://docs.racket-lang.org/r6rs/r6rs-std/r6rs-Z-H-10.html"]
title = "Revised^6 Report on the Algorithmic Language Scheme"
full_description = "Libraries are parts of a program that can be distributed independently. The library system supports macro definitions within libraries, macro exports, and distinguishes the phases in which definitions and imports are needed. This chapter defines the notation for libraries and a semantics for library expansion and execution. The export subform specifies a list of exports, which name a subset of the bindings defined within or imported into the library. The import subform specifies the imported bindings as a list of import dependencies, where each dependency specifies: the subset of the library’s exports to make available within the importing library, and the local names to use within the importing library for each of the library’s exports. The <library body> is the library body, consisting of a sequence of definitions followed by a sequence of expressions. The definitions may be both for local (unexported) and exported bindings, and the expressions are initialization expressions to be evaluated for their effects. An identifier can be imported with the same local name from two or more libraries or for two levels from the same library only if the binding exported by each library is the same (i.e., the binding is defined in one library, and it arrives through the imports only by exporting and re-exporting). Otherwise, no identifier can be imported multiple times, defined multiple times, or both defined and imported. No identifiers are visible within a library except for those explicitly imported into the library or defined within the library. A <library name> uniquely identifies a library within an implementation, and is globally visible in the import clauses (see below) of all other libraries within an implementation. A <library name> has the following form: Each <sub-version> must represent an exact nonnegative integer object. An empty <version> is equivalent to (). An <export spec> names a set of imported and locally defined bindings to be exported, possibly with different external names. An <export spec> must have one of the following forms:"
