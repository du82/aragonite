["https://docs.racket-lang.org/aoc-racket/Day_14.html"]
title = "14 Day 14"
full_description = "The puzzle. Our input is a list of flying-reindeer descriptions — in particular, how fast they can fly, and how long they have to rest between flight sessions, e.g., Dancer can fly 27 km/s for 5 seconds, but then must rest for 132 seconds. For each reindeer, we have a description that specifies a) flight speed, b) flight time, and c) rest time. Thus, if we have the total flight time as input — and we do — we can use it to calculate flight distance. In other words, just as we made functions out of wire descriptions on Day 7, now we’ll make functions out of reindeer descriptions. As in Day 7, we’ll use define-syntax to set up the reindeer functions. Each reindeer function will take a time in seconds and then use calc-distance to convert it into meters. After that, all we need to do is map the time over the reindeer and max to get the answer. The new rule is that after each second of travel, the reindeer in the lead gets one point. Thus, the winner after 2503 seconds is not the reindeer that has traveled farthest, but that has gathered the most points — in other words, has been in the lead for the longest time. This question is similar to the last. But instead of simulating one race, we have to simulate 2503 races, each one ending a second later than the last. After each second, we calculate the winning reindeer, and add it to our list of winners. After 2503 seconds, we find out how many times the winningest reindeer appears on the list. To do this, we’ll use the helper function frequency-hash from sugar/list. (You could also do it with for/fold, but managing nine reindeer in parallel is unwieldy. Just ask Santa.)"
