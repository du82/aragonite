["https://docs.racket-lang.org/syntax/Experimental.html"]
title = "1.12 Experimental"
full_description = "A syntax class can be reified into a run-time value, and a reified syntax class can be used in a pattern via the ~reflect and ~splicing-reflect pattern forms. Like ~var, except that the syntax class position is an expression evaluating to a reified syntax object, not a syntax class name, and the attributes bound by the reified syntax class (if any) must be specified explicitly. The parser procedure is given two arguments, the syntax to parse and a failure procedure. To signal a successful parse, the parser procedure returns a list of N+1 elements, where N is the number of attributes declared by the splicing syntax class. The first element is the size of the prefix consumed. The rest of the list contains the values of the attributes. Unlike single-term patterns and head patterns, ellipsis-head patterns cannot be encapsulated by syntax classes, since they describe not only sets of terms but also repetition constraints. This module provides ellipsis-head alternative sets, reusable encapsulations of ellipsis-head patterns. Unlike syntax classes, ellipsis-head alternative sets must be defined before they are referenced, and they do not delimit cuts (use ~delimit-cut instead). Metafunctions are useful for performing transformations in contexts where macro expansion does not occur, such as binding occurrences. For example: If join were defined as a macro, it would not be usable in the context above; instead, let-values would report an invalid binding list."
year_published = 2025
