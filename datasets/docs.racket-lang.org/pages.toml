["https://docs.racket-lang.org/drracket/drracket-files.html"]
title = "3.5 DrRacket Files"
full_description = 'The standard file extension for a Racket program file is ".rkt". The extensions ".ss", ".scm", and ".sch" are also historically popular. Plain-text file format — All text editors can read this format. DrRacket saves a program in plain-text format by default, unless the program contains images or text boxes. (Plain-text format does not preserve images or text boxes.) Plain-text format is platform-specific because different platforms have different newline conventions. However, most tools for moving files across platforms support a “text” transfer mode that adjusts newlines correctly. Multimedia file format — This format is specific to DrRacket, and no other editor recognizes it. DrRacket saves a program in multimedia format by default when the program contains images, text boxes, or formatted text. Multimedia format is platform-independent, and it uses an ASCII encoding (so that different ways of transferring the file are unlikely to corrupt the file). Every 30 seconds, DrRacket checks each open file. If any file is modified and not saved, DrRacket saves the contents of the file in a backup file, just in case there is a power failure or some other catastrophic error. If the original file is later saved, or if the user exits DrRacket and explicitly declines to save the file, the backup file is removed. The backup file is saved in the same directory as the original file, and the back file’s name is generated from the original file’s name: On Unix and Mac OS, a "#" is added to the start and end of the file’s name, then a number is added after the ending "#", and then one more "#" is appended after the number. The number is selected to make the backup filename unique. When DrRacket first starts up, it looks to see if there are any backup files still present and if so, offers to restore the backup files, on the assumption that DrRacket was closed unintentionally. When it restores the files, DrRacket moves the current version of the original file out of the way (adding “autorec” to the name) and the moves the backup file in place of the original file.'
year_published = 2025
