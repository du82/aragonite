["https://docs.racket-lang.org/guide/Looking_Ahead_and_Behind.html"]
title = "9.9 Looking Ahead and Behind"
full_description = 'You can have assertions in your pattern that look ahead or behind to ensure that a subpattern does or does not occur. These “look around” assertions are specified by putting the subpattern checked for in a cluster whose leading characters are: ?= (for positive lookahead), ?! (negative lookahead), ?<= (positive lookbehind), ?<! (negative lookbehind). Note that the subpattern in the assertion does not generate a match in the final result; it merely allows or disallows the rest of the match. The regexp #rx"grey(?=hound)" matches grey, but only if it is followed by hound. Thus, the first grey in the text string is not matched. The regexp #rx"grey(?!hound)" matches grey, but only if it is not followed by hound. Thus the grey just before socks is matched. Positive lookbehind with ?<= checks that its subpattern could match immediately to the left of the current position in the text string. Negative lookbehind with ?<! checks that its subpattern could not possibly match immediately to the left.'
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/Looking_Ahead_and_Behind.html"
