title = "Anarki: Community-Managed Arc Variant"
full_description = 'Specifically, this initializes the Anarki main namespace verbosely, then runs a REPL with current-directory set to the Anarki installation directory and current-namespace set to the Anarki main namespace. It’s equivalent to the following: For the "-in-main-namespace" variants, the namespace initialized is anarki-main-namespace, and the initialization is entirely skipped if either of these variants has been called before. For the other variants, the namespace initialized is (current-namespace), and if the namespace has already been initialized, it’s initialized again. This can even be used to double-initialize anarki-main-namespace. The "-verbose" variants may print messages to (current-error-port) to report on the initialization progress. This does not perform any initialization of the readtable or the namespace before it starts. For that purpose, use one of the variants of anarki-init.'
