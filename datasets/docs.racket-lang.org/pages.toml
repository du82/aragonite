["https://docs.racket-lang.org/aoc-racket/Day_21.html"]
title = "21 Day 21"
full_description = "I hate RPGs. So at first, I prejudicially refused to do this puzzle. But after a second look, I could see how to do it. So I relented. We have 100 hit points. Our enemy has the hit points, damage, and armor given in our input. The Fake Equipment Shop is selling the following items (the columns are cost, damage rating, and armor value): We have to buy a weapon. We can buy armor, or not. And we can buy zero, one, or two rings. On each turn, we inflict damage equal to our attack score minus the boss’s armor, though we always do at least 1 point of damage. Likewise, the boss inflicts damage equal to her attack minus our armor, with a minimum of 1. Repeat. If the boss’s hit points go to zero before ours, we win. Otherwise, not. Thus the question — what’s the cheapest set of equipment that wins? Similar to puzzles we’ve already seen, this is another combinatoric question. If we follow that pattern, we need to generate all possible equipment sets, find out which ones win, and then pick the cheapest. But there’s an easy optimization available here. The cheapness of a set of equipment is independent of whether it wins. So we’ll sort our equipment sets by cost, and try them starting from the cheapest. The first one that wins will be our answer (saving us the trouble of trying them all). The total cost, damage, and armor of the equipment set is just the sum of the individual values. After that, we’ll set up a we-win? function that will simulate the battle of a certain equipment set vs. the boss. It’s a for/fold loop that will alternate attacks until either the player or boss has negative hit points, returning #t if we win, or #f if the boss does. A simple variation of the first answer. Instead, we iterate through the equipment sets starting at the most expensive, and stop when we find the first loser."
year_published = 2025
