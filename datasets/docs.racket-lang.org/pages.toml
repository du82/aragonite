["https://docs.racket-lang.org/aoc-racket/Day_23.html"]
title = "23 Day 23"
full_description = "The puzzle. Our input is a list of instructions representing a program for a two-register virtual machine. Although the virtual machine has the equivalent of functions & variables, the jump instructions add a complication. We can’t just evaluate the instructions top to bottom. We have to maintain a list of all the instructions, and a pointer to where we are, so if we get a jump instruction, we can move to the right place. Because we have to repeatedly update the values of the register, it’ll be more convenient to use a hash table. Overall, the solution follows the general pattern of Day 7. Notice also that we’re encasing the lines of the VM program in thunk*. This creates a function wrapper around each instruction so that its evaluation is delayed until we explicitly ask for it. The inst transformer turns the lines of the program into equivalent operations on our register hash table. All these functions return a number that indicates the offset of the next instruction (if it’s not a jump instruction, then this value is just 1). With the instructions set up as functions, running the program is easy. We start at index 0 and evaluate the first instruction in our list (which will possibly update one of the registers). The result is the offset for the next instruction. We continue until our index exceeds the number of instructions available."
year_published = 2025
clearnet = "https://docs.racket-lang.org/aoc-racket/Day_23.html"
