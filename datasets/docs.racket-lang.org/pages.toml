["https://docs.racket-lang.org/aoc-racket/Day_16.html"]
title = "16 Day 16"
full_description = '''The puzzle. Our input is a list of 500 people named Sue, along with three attribute pairs for each. We’re also provided a set of attribute pairs that identifies one of the Sues: children: 3 cats: 7 samoyeds: 2 pomeranians: 3 akitas: 0 vizslas: 0 goldfish: 5 trees: 3 cars: 2 perfumes: 1 Our input has 10 attribute pairs, but each of our Sues only has three attribute pairs. The other values for each Sue are unknown. Thus, for each Sue in our list, we need to check if the three known attribute pairs are among in our 10 identifying pairs. Assumedly, this will be true for only one Sue, and that will be the answer. We might be tempted to break down the attribute pairs into hash tables. But we don’t even need to work that hard — we can just treat the attribute pairs as a list of strings, and match whole strings like "children: 3". And our Sues can be a list too, each holding a list of strings. Cheap & cheerful. The target Sue has fewer pomeranians and goldfish than indicated. (How many pomeranians does anyone really need?) Now that we’re asked to compare attribute values in a deeper way, our avoidance of a hash table in question 1 looks like a false economy. So let’s compound our laziness with more laziness. Rather than upgrade to a hash table now, let’s convert our strings to datums (as saw in Day 7). Because if we put a string like "children: 3" inside parentheses like so "(children: 3)" and then convert it to a datum (with read) we’ll end up with a list with a key and a value, e.g. '(children: 3). In other words, just what we needed. (I know the plural of datum is data, but datums better connotes “more than one datum, in the Racket sense.”)'''
year_published = 2025
