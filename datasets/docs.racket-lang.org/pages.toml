["https://docs.racket-lang.org/argo/index.html"]
title = "Argo: JSON Schema Adventures"
full_description = "Argo is a JSON Schema validator. Work with your JSON data knowing that it adheres to some sensible constraints. If you have to work with JSON, even if only occasionally, you may want to consider validating it (that is, checking that is satisfies the constraints specified by the schema). Argo can be executed as a command-line tool using raco. This section discusses the five available commands: validate, schema, pp, point, and equal. The validate command takes a JSON Schema file and a JSON file as input and checks that the data adheres to the schema. In case of validation success, seeing “Validation succeeded” is probably enough. In case of failure, “Validation failed” is, admittedly, not the most informative thing you’ve seen today. See also Error reporting. validate accepts only one option, quiet, which, if set, will cause all output to be suppressed. By default, this option is unset. In such a case, the exit code will be your only indication about the validity of your data. Here’s how you can use this option: As discussed in the above concerning exit codes, there are seven conditions that need to be met for validate to exit cleanly. Looking at that list there, another way to think of it is that there are six preconditions that need to be met for validation to even make sense. Even if the quiet flag is set, you will see error output if any of these preconditions is not met. Thus will cause an error message to be printed, despite the –quiet, because this isn’t even a well-formed invocation of validate (notice that the second argument is missing). The schema command takes a JSON file as input and checks that it is a schema. (Recall that “schema” for Argo is “draft 06 schema”.) (Though see below for a way in which the exit code may be non-zero even if all these conditions are met.) schema accepts only one option, quiet, which, if set, will cause all output to be suppressed. By default, this option is unset. In such a case, the exit code will be your only indication about whether your JSON really is a schema."
