["https://docs.racket-lang.org/pkg/getting-started.html"]
title = "1 Getting Started with Packages"
full_description = "Most users access the package manager graphical interface through DrRacket, which provides a Package Manager... item in the File menu. You can also install the gui-pkg-manager package, with provides a Racket Package Manager application (which can be launched as racket-package-manager in a command-line environment). The raco executable launches various Racket command-line tools, and the raco pkg command groups various package-management sub-commands. The different raco pkg sub-commands are documented in Using raco pkg. We’ll use the raco pkg command to describe package-management operations here, but the graphical interface allows the same operations. A package is not something that you refer to directly in your Racket programs. Instead, a package is a set of libraries that fit into the collection hierarchy, and you refer to libraries through their collection-based paths. Libraries that are close in the hierarchy may be provided by different packages, while a single package may provide libraries that are far from each other in the hierarchy (but that are conceptually related, somehow). Racket documentation tells you which package provides a given library. For example, the documentation for the pict/face library says that it is provided by the pict-lib package.If you’re reading this in a web browser, click pict/face to go straight to its documentation. Over time, packages may be refactored so that a library moves to a different package, but the original package should continue to provide the library, too, by declaring a dependency on the new package. More generally, a package is intended to have an interface that only grows in terms of libraries, bindings, and functionality, which provides a basic level of backward compatibility. Incompatible changes should be implemented in a new package. Unless you have an especially minimal Racket installation, you will have packages installed already, probably listed in the “Installation-wide” section. In fact, if you have a typical Racket installation, then raco pkg show will initially show a main-distribution package and a racket-lib package:"
