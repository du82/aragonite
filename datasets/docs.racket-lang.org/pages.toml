["https://docs.racket-lang.org/syntax/Datum_Pattern_Matching.html"]
title = "3 Datum Pattern Matching"
full_description = "For most pattern-matching purposes, racket/match is a better choice than syntax/datum. The syntax/datum library is useful mainly for its template support (i.e., datum) and, to a lesser extent, its direct correspondence to syntax-case patterns. Using datum-case and datum is similar to converting the input to syntax-case using datum->syntax and then wrapping each use of syntax with syntax->datum, but datum-case and datum do not create intermediate syntax objects, and they do not destroy existing syntax objects within the S-expression structure of datum-expr. The datum form also cooperates with syntax pattern variables such as those bound by syntax-case and attributes bound by syntax-parse (see Pattern Variables and Attributes for more information about attributes). As one consequence, datum provides a convenient way of getting the list of syntax objects bound to a syntax pattern variable of depth 1. For example, the following expressions are equivalent, except that the datum version avoids creating and eliminating a superfluous syntax object wrapper: A template can also use multiple syntax or datum pattern variables and datum constants, and it can use the ~@ and ~? template forms: Changed in version 7.8.0.9 of package base: Changed datum to cooperate with syntax-case, syntax-parse, etc."
