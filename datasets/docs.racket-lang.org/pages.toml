["https://docs.racket-lang.org/guide/define-struct.html"]
title = "5 Programmer-Defined Datatypes"
full_description = 'New datatypes are normally created with the struct form, which is the topic of this chapter. The class-based object system, which we defer to Classes and Objects, offers an alternate mechanism for creating new datatypes, but even classes and objects are implemented in terms of structure types. The struct form binds struct-id and a number of identifiers that are built from struct-id and the field-ids: struct-id : a constructor function that takes as many arguments as the number of field-ids, and returns an instance of the structure type. struct-id? : a predicate function that takes a single argument and returns #t if it is an instance of the structure type, #f otherwise. struct-id-field-id : for each field-id, an accessor that extracts the value of the corresponding field from an instance of the structure type. struct:struct-id : a structure type descriptor, which is a value that represents the structure type as a first-class value (with #:super, as discussed later in More Structure Type Options). A struct form places no constraints on the kinds of values that can appear for fields in an instance of the structure type. For example, (posn "apple" #f) produces an instance of posn, even though "apple" and #f are not valid coordinates for the obvious uses of posn instances. Enforcing constraints on field values, such as requiring them to be numbers, is normally the job of a contract, as discussed later in Contracts. The struct-copy form clones a structure and optionally updates specified fields in the clone. This process is sometimes called a functional update, because the result is a structure with updated field values. but the original structure is not modified. The struct-id that appears after struct-copy must be a structure type name bound by struct (i.e., the name that cannot be used directly as an expression). The struct-expr must produce an instance of the structure type. The result is a new instance of the structure type that is like the old one, except that the field indicated by each field-id gets the value of the corresponding expr.'
year_published = 2025
clearnet = "https://docs.racket-lang.org/guide/define-struct.html"
