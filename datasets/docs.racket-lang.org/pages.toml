title = "acmsmall support for Scribble"
full_description = 'The scribble/acmsmall language provides support for the acmsmall paper format, used by various ACM journals. The language provides all of the bindings of scribble/base in addition to additional procedures for supporting acmsmall-specific typesetting. To select which journal to format for, the first expression after the "#lang" line should be the journal identifier. For example, when formatting for TOPLAS, use "#lang scribble/acmsmall acmtoplas". The complete list of identifiers is available in the acmsmall style documentation available through the above link. If using the scriblib/autobib library, ensure that the define-cite form is used with the acmsmall-style setting for #:style. To have the proper bibliography title, use #:sec-title "REFERENCES" when generating the bibliography.'
