["https://docs.racket-lang.org/aoc-racket/Day_10.html"]
title = "10 Day 10"
full_description = "The puzzle asks us to compute the look and say sequence invented by mathematician John Conway. Each iteration of the sequence is the description of the last step if you said it in numbers. So 1 becomes “one 1”, written 11; 11 becomes “two ones”, or 21, then 1211, 111221, and so on. As in Day 1, this puzzle relies on cumulative state, so we’ll loop using for/fold. To generate the new string for each pass of the loop, we’ll use regexp-match* to find every contiguous run of digits. Each digit run is converted into a list with the number of digits and the digit itself. Then all these lists are concatenated into a new string, and the loop repeats. The second part of the puzzle is just going to change the number of iterations. So we’ll make one function that can be used for both parts."
