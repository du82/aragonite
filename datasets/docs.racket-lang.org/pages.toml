title = "7.6 Abstract Contracts using #:exists and #:∃"
full_description = 'The contract system provides existential contracts that can protect abstractions, ensuring that clients of your module cannot depend on the precise representation choices you make for your data structures. You can type #:exists instead of #:∃ if you cannot easily type unicode characters; in DrRacket, typing \exists followed by either alt-\ or control-\ (depending on your platform) will produce ∃. Now, if clients of the data structure try to use car and cdr, they receive an error, rather than mucking about with the internals of the queues.'
