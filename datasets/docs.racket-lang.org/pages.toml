["https://docs.racket-lang.org/Elle/Core_Syntactic_Forms.html"]
title = "1 Core Syntactic Forms"
full_description = "Elle differs from other Lisps in that it uses several delimiters, each having a different meaning. Elle recognizes parentheses (), brackets [], and braces {} as delimiters. A syntactic form may assign arbitrary meaning to the delimiters, but each has an independent meaning, when used as part of a standalone expression: Unlike most (if not all) Lisps, Elle does not have a parenthesized, prefix form for value definitions. Instead, Elle has an unparenthesized, infix form, similar to some languages outside the Lisp family. The second form binds name to a procedure formed by unfolding the proc-header into a “curried λ”. name? is bound to a predicate that returns #true, if the given value is one of the type-cases; #false, otherwise; each tuple-id is bound to static information about the respective tuple case; it is also bound to a match-expander for constructing and destructuring values of the tuple case; for each tuple-id, the name tuple-id? is bound to a predicate that returns #true, if the given value is an instance of tuple-id; #false, otherwise; for each tuple-id, the name tuple-id-field-id is bound to a projection operation (accessor) for the respective field; each record-id is bound to static information about the respective record case; it is also bound to a match-expander for constructing and destructuring values of the record case; for each record-id, the name record-id? is bound to a predicate that returns #true, if the given value is an instance of record-id; #false, otherwise; for each record-id, the name record-id-field-kw is bound to a projection operation (accessor) for the respective field."
