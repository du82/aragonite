["https://docs.racket-lang.org/r6rs/r6rs-std/r6rs-Z-H-19.html"]
title = "Revised^6 Report on the Algorithmic Language Scheme"
full_description = "This chapter describes most of the changes that have been made to Scheme since the “Revised5 Report” [14] was published: Scheme source code now uses the Unicode character set. Specifically, the character set that can be used for identifiers has been greatly expanded. Identifiers and representations of characters, booleans, number objects, and . must be explicitly delimited. The read-syntax abbreviations #’ (for syntax), #‘ (for quasisyntax), #, (for unsyntax), and #,@ (for unsyntax-splicing have been added; see section 4.3.5.) Many of the procedures and syntactic forms of the language are now part of the (rnrs base (6)) library. Some procedures and syntactic forms have been moved to other libraries; see figure 13. The base language has the following new procedures and syntactic forms: letrec*, let-values, let*-values, real-valued?, rational-valued?, integer-valued?, exact, inexact, finite?, infinite?, nan?, div, mod, div-and-mod, div0, mod0, div0-and-mod0, exact-integer-sqrt, boolean=?, symbol=?, string-for-each, vector-map, vector-for-each, error, assertion-violation, assert, call/cc, identifier-syntax. The case-insensitive string comparisons (string-ci=?, string-ci<?, string-ci>?, string-ci<=?, string-ci>=?) operate on the case-folded versions of the strings rather than as the simple lexicographic ordering induced by the corresponding character comparison procedures. Many situations that “were an error” now have defined or constrained behavior. In particular, many are now specified in terms of the exception system. For implementations that support NaNs or infinities, many arithmetic operations have been specified on these values consistently with IEEE 754. For implementations that support a distinct -0.0, the semantics of many arithmetic operations with regard to -0.0 has been specified consistently with IEEE 754. The specification of quasiquote has been extended. Nested quasiquotations work correctly now, and unquote and unquote-splicing have been extended to several operands."
year_published = 2025
