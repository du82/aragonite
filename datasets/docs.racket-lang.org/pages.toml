full_description = "The 'link and 'static-link formats are the same as 'dir in terms of parsing, but they are treated differently for tasks such as package installation. The 'clone and 'git-url formats are similarly the same as 'github or 'git in terms of parsing. Changed in version 6.1.1.1 of package base: Added 'git.Changed in version 6.1.1.5: Added 'clone.Changed in version 8.0.0.13: Added 'git-url. The complain-proc function is applied when source is ill-formed. The arguments to complain-proc are source and an error message. If must-infer-name? is true, then complain-proc is called if a valid name cannot be inferred from source. The package-source->path function is different from string->path in the case that source starts with file://. Also, if type is 'dir, 'link, or 'static-link, then path->directory-path is used to ensure that the result path refers to a directory."
