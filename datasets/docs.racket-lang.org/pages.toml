["https://docs.racket-lang.org/aoc-racket/Day_3.html"]
title = "3 Day 3"
full_description = "The puzzle. Our input is a string made of the characters ^v<> that represent north, south, west, and east. Taken together, the string represents a path through an indefinitely large grid. In the elevator problem, we modeled the parentheses that represented up and down as 1 and -1. We’ll proceed the same way here, but we’ll assign Cartesian coordinates to each possible move — '(0 1) for north, '(-1 0) for west, and so on. For dual-valued data, whether to use pairs or lists is largely a stylistic choice. Ask: what will you do with the data next? That will often suggest the most natural representation. In this case, the way we create each cell in the path is by adding the x and y coordinates of the current cell to the next move. So it ends up being convenient to model these cells as lists rather than pairs, so we can add them with a simple (map + current-cell next-move). (Recall that when you use map with multiple lists, it pulls one element from each list in parallel.) Once the whole cell path is computed, the answer is found by removing duplicate cells and counting how many remain. Rather than use Cartesian coordinates, we could rely on Racket’s built-in support for complex numbers to trace the path in the complex plane. Complex numbers have a real and an imaginary part — e.g, 3+4i — and thus, represent points in a plane just as well as Cartesian coordinates. The advantage is that complex numbers are atomic values, not lists. We can add them normally, without resort to map. (It’s not essential for this problem, but math jocks might remember that complex numbers can be rotated 90 degrees counterclockwise by multiplying by +i.) Again, the problem has nothing to do with complex numbers inherently. Like pairs and lists, they’re just another option for encoding dual-valued data. By “split”, the puzzle envisions two people starting at the origin, with one following the odd-numbered moves, and the other following the even-numbered moves. So there are two paths instead of one. The question remains the same: how many cells are visited by one path or the other?"
year_published = 2025
clearnet = "https://docs.racket-lang.org/aoc-racket/Day_3.html"
