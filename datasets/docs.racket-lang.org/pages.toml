["https://docs.racket-lang.org/aoc-racket/Day_13.html"]
title = "13 Day 13"
full_description = "The puzzle. Our input is a list of descriptions of “happiness units” that would be gained or lost among eight people sitting next to each other at a dinner table. This is a lot like Day 9, where we had to compute the optimal path between cities. In that puzzle, the distance between city A and city B was a single number. In this case, the “happiness score” between person A and person B is the sum of two numbers — A’s happiness being next to B, and B’s happiness being next to A. (Unlike distances, happiness scores can be negative.) Also, whereas a path between cities had a start and end, a seating arrangement is circular. So if we model a seating arrangement as a list of people, we have to compute the happiness between each duo of people, but also between the last and first, to capture the circularity of the arrangement. Those wrinkles noted, we’ll proceed as we did in Day 9. We’ll parse the input data and put the happiness scores into a hash table — the keys will be of the form (list name1 name2) and the values will be the happiness scores for that duo, in that order. Then we’ll loop through all possible seating arrangements with in-permutations and see what the best score is. I’m in a math-jock mood, so let’s make a performance optimization. It’s unnecessary for this problem, but when we use in-permutations — which grows at factorial speed — we should ask how we might prune the options. Notice that because our seating arrangement is circular, our permutations will include a lot of “rotationally equivalent” arrangements — e.g., '(A B C ...) is the same as '(B C ... A), '(C ... A B), etc. If we have n elements, each distinct arrangement will have n rotationally equivalent arrangements. We can save time by only checking one of each set. How? By only looking at arrangements starting with a particular name. Doesn’t matter which. This will work because every name has to appear in every arrangement. To do this, we could generate all the permutations and use a #:when clause to select the ones we want. But it’s even more efficient to only permute (sub1 n) names, and then cons our first-position name onto each partial arrangement, which will produce the same set of arrangements. Thus we only have to generate and score (/ 1 n) of the original permutations."
year_published = 2025
clearnet = "https://docs.racket-lang.org/aoc-racket/Day_13.html"
