["https://docs.rs/aws-sdk-ec2/^1"]
title = "aws_sdk_ec2 - Rust"
description = "You can access the features of Amazon Elastic Compute Cloud (Amazon EC2) programmatically. For more information, see the Amazon EC2 Developer Guide."
full_description = 'Crate aws_sdk_ec2Copy item pathSource Expand descriptionYou can access the features of Amazon Elastic Compute Cloud (Amazon EC2) programmatically. For more information, see the Amazon EC2 Developer Guide. §Getting Started Examples are available for many services and operations, check out the examples folder in GitHub. The SDK provides one crate per AWS service. You must add Tokio as a dependency within your Rust project to execute asynchronous code. To add aws-sdk-ec2 to your project, add the following to your Cargo.toml file: [dependencies] aws-config = { version = "1.1.7", features = ["behavior-version-latest"] } aws-sdk-ec2 = "1.113.0" tokio = { version = "1", features = ["full"] } Then in code, a client can be created with the following: use aws_sdk_ec2 as ec2; #[::tokio::main] async fn main() -> Result<(), ec2::Error> { let config = aws_config::load_from_env().await; let client = aws_sdk_ec2::Client::new(&config); // ... make some calls with the client Ok(()) } See the client documentation for information on what calls can be made, and the inputs and outputs for each of those calls. §Using the SDK Until the SDK is released, we will be adding information about using the SDK to the Developer Guide. Feel free to suggest additional sections for the guide by opening an issue and describing what you are trying to do. §Getting Help GitHub discussions - For ideas, RFCs & general questions GitHub issues - For bug reports & feature requests Generated Docs (latest version) Usage examples §Crate Organization The entry point for most customers will be Client, which exposes one method for each API offered by Amazon Elastic Compute Cloud. The return value of each of these methods is a “fluent builder”, where the different inputs for that API are added by builder-style function call chaining, followed by calling send() to get a Future that will result in either a successful output or a SdkError. Some of these API inputs may be structs or enums to provide more complex structured information. These structs and enums live in types. There are some simpler types for representing data such as date times or binary blobs that live in primitives. All types required to configure a client via the Config struct live in config. The operation module has a submodule for every API, and in each submodule is the input, output, and error type for that API, as well as builders to construct each of those. There is a top-level Error type that encompasses all the errors that the client can return. Any other error type can be converted to this Error type via the From trait. The other modules within this crate are not required for normal usage. Modules§clientClient for calling Amazon Elastic Compute Cloud.configConfiguration for Amazon Elastic Compute Cloud.errorCommon errors and error handling utilities.metaInformation about this crate.operationAll operations that this crate can perform.primitivesPrimitives such as Blob or DateTime used by other types.typesData structures used by operation inputs/outputs.waitersSupporting types for waiters.Structs§ClientClient for Amazon Elastic Compute CloudConfigConfiguration for a aws_sdk_ec2 service client.Enums§ErrorAll possible error types for this service.{"&[u8]":"<h3>Notable traits for <code>&amp;[<a class=\"primitive\" href=\"https://doc.rust-lang.org/nightly/std/primitive.u8.html\">u8</a>]</code></h3><pre><code><div class=\"where\">impl <a class=\"trait\" href=\"https://doc.rust-lang.org/nightly/std/io/trait.Read.html\" title=\"trait std::io::Read\">Read</a> for &amp;[<a class=\"primitive\" href=\"https://doc.rust-lang.org/nightly/std/primitive.u8.html\">u8</a>]</div>","Sleep":"<h3>Notable traits for <code><a class=\"struct\" href=\"config/struct.Sleep.html\" title=\"struct aws_sdk_ec2::config::Sleep\">Sleep</a></code></h3><pre><code><div class=\"where\">impl <a class=\"trait\" href=\"https://doc.rust-lang.org/nightly/core/future/future/trait.Future.html\" title=\"trait core::future::future::Future\">Future</a> for <a class=\"struct\" href=\"config/struct.Sleep.html\" title=\"struct aws_sdk_ec2::config::Sleep\">Sleep</a></div><div class=\"where\"> type <a href=\"https://doc.rust-lang.org/nightly/core/future/future/trait.Future.html#associatedtype.Output\" class=\"associatedtype\">Output</a> = <a class=\"primitive\" href=\"https://doc.rust-lang.org/nightly/std/primitive.unit.html\">()</a>;</div>"}'
