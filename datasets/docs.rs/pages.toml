["https://docs.rs/about/builds"]
title = "Builds"
description = "Docs.rs documentation                                                                                                             About                                                                             Badges                                                                             Builds                                                                             Metadata                                                                             Shorthand URLs                                                                             Download"
full_description = "Docs.rs automatically builds documentation for crates released on crates.io. It may take a while to build your crate, depending on how many crates are in the queue. All crates are built in a sandbox using the nightly release of the Rust compiler. The current version in use is rustc 1.87.0-nightly (8c392966a 2025-03-01). The README of a crate is taken from the readme field defined in Cargo.toml. If this field is not set, no README will be displayed. All targets other than x86_64-unknown-linux-gnu are cross-compiled. For implementation reasons, this is unlikely to change for the foreseeable future. The Docs.rs README describes how to build unpublished crate documentation locally using the same build environment as the Docs.rs build agent. Missing dependencies are a common reason for failed builds. Docs.rs dependencies are managed through crates-build-env. See Forge for how to add a dependency. Most of the sandbox is a read-only file system, including the source directory of your crate and its dependencies. If your build.rs generates files that are relevant for documentation, consider writing to the cargo output directory, passed in the environment variable OUT_DIR. If your build fails because it hit one of these limits, please open an issue to get them increased for your crate. Since our build agent has finite resources, we have to consider each case individually. However, there are a few general policies: If your crate fails to build for a reason not listed here, please file an issue. Some build failures can be fixed by Docs.rs, e.g., by issuing a rebuild after a bug in Docs.rs has been fixed."
