full_description = "Docs.rs is an open source documentation host for crates of the Rust Programming Language. All libraries published to crates.io are documented. If you just published a crate, your crate is likely still in the queue. The source code of Docs.rs is available on GitHub. If you ever encounter an issue, don't hesitate to report it! (And thanks in advance!) JavaScript in support of documentation is allowed but not guaranteed to work on docs.rs. What that means: If you write documentation that inlines some JavaScript (like KaTeX), that's allowed, and will probably work today but may break in the future. However, it's not allowed to put JavaScript or other content in docs published on docs.rs for the purpose of tracking visitors. For instance, adding Google Analytics scripts, tracking pixels, or site verification for services like Google Search Console. Crates that do this will have the relevant versions removed and may be blocked from docs.rs."
