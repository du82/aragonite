title = "aws_config - Rust"
description = "`aws-config` provides implementations of region and credential resolution."
full_description = 'Crate aws_configCopy item pathSource Expand descriptionaws-config provides implementations of region and credential resolution. These implementations can be used either via the default chain implementation from_env/ConfigLoader or ad-hoc individual credential and region providers. ConfigLoader can combine different configuration sources into an AWS shared-config: SdkConfig. SdkConfig can be used configure an AWS service client. §Examples Load default SDK configuration: use aws_config::BehaviorVersion; mod aws_sdk_dynamodb { let config = aws_config::load_defaults(BehaviorVersion::v2023_11_09()).await; let client = aws_sdk_dynamodb::Client::new(&config); Load SDK configuration with a region override: let region_provider = RegionProviderChain::default_provider().or_else("us-east-1"); // Note: requires the `behavior-version-latest` feature enabled let config = aws_config::from_env().region(region_provider).load().await; let client = aws_sdk_dynamodb::Client::new(&config); Override configuration after construction of SdkConfig: let sdk_config = aws_config::load_defaults(aws_config::BehaviorVersion::latest()).await; let custom_credentials_provider = custom_provider(&sdk_config); let dynamo_config = aws_sdk_dynamodb::config::Builder::from(&sdk_config) .credentials_provider(custom_credentials_provider) .build(); let client = aws_sdk_dynamodb::Client::from_conf(dynamo_config); Modules§credential_processcredentials-processCredentials Provider for external processdefault_providerProviders that implement the default AWS provider chainecsEcs Credentials ProviderenvironmentProviders that load configuration from environment variablesidentityTypes for configuring identity caching.imdsIMDSv2 Client, credential, and region providermetaMeta-providers that augment existing providers with new behaviorprofileLoad configuration from AWS Profilesprovider_configConfiguration Options for Credential ProvidersretryRetry configurationssossoSSO Credentials and Token providersstalled_stream_protectionStalled stream protection configurationstsCredential provider augmentation through the AWS Security Token Service (STS).timeoutTimeout configurationweb_identity_tokenLoad Credentials from Web Identity TokensStructs§AppNameApp name that can be configured with an AWS SDK client to become part of the user agent string.BehaviorVersionBehavior version of the clientConfigLoaderLoad default sources for all configuration with override support Load a cross-service SdkConfig from the environmentInvalidAppNameError for when an app name doesn’t meet character requirements.RegionThe region to send requests to.SdkConfigAWS Shared ConfigurationFunctions§defaultsCreate a config loader with the defaults for the given behavior version.from_envbehavior-version-latestCreate a config loader with the latest defaults.load_defaultsLoad default configuration with the given behavior version.load_from_envbehavior-version-latestLoad default configuration with the latest defaults.'
