["https://docs.sigstore.dev/about/bundle"]
title = "Sigstore Bundle Format - Sigstore"
description = "Information about the Sigstore bundle format"
full_description = 'HomeAboutSigstore Bundle FormatSigstore Bundle Format On this page ExpandCollapseBundleVerification MaterialContentExamplesOn this pageBundleVerification MaterialContentExamplesLast updated January 14, 2025Version 0.3.2This document describes the data structure for storing Sigstore signatures generated by tooling working in the context of the Sigstore Public Instance. It includes json examples of serialized bundles of the current bundle format version. It may exclude descriptions of parameters that continue to exist for compatibility reasons or for private use cases. For a full description of the format, the formal schema and information about language library support see sigstore/protobuf-specs.Bundle #A Sigstore bundle is everything required to verify a signature on an artifact. This is satisfied by the Verification Material and signature Content.Verification Material #This is key material used to verify signatures along with supporting metadata like transparency log entries and timestamps. When using short lived Fulcio certificates where verification may occur after the certificate has expired, bundles must include at least one transparency log’s signed entry timestamp or an RFC3161 timestamp to provide proof that signing occured during the ceritificates validity window.Key Material #X.509 certificate #A single X.509 leaf certificate conveying the signing key and containing extensions for identities consumed at verification time. This is the recommended "verificationMaterial" type for use with the public Sigstore infrastructure."verificationMaterial": { "certificate": { "rawBytes": "<Base64(DER bytes)>" } } Public Key Identifier #A hint to identify an out of band delivered key to verify a signature. Like traditional PKI key distribution the format of the hint must be agreed upon out of band by the signer and the verifiers. The key itself is not embedded in the Sigstore bundle."verificationMaterial": { "publicKeyIdentifier": { "hint": "<HINT>" } } Transparency Log Entries #Transparency Log entries can provide proof that a signing event was written to a public log. They are not required by the spec but inclusion of one or more transparency log entries is highly encouraged for bundles subject to public consumption. The embedded signed entry timestamp may be used to validate signing occurred during ceritificate validity."verificationMaterial": { "tlogEntries": [ { "logIndex": "<GLOBAL_LOG_INDEX>", "logId": { "keyId": "<KEY_ID>", }, "kindVersion": { "kind": "(hashrekord | dsse)", "version": "<VERSION>" }, "integratedTime": "<UNIX_TIMESTAMP>", "inclusionPromise": { "signedEntryTimestamp": "<Base64(SET bytes)>" }, "inclusionProof": { "logIndex": "<TREE_INDEX>", "rootHash": "<Base64(HASH)>", "treeSize": "<TREE_SIZE>", "hashes": [ "<Base64(HASH)>", "<Base64(HASH)>", "<Base64(HASH)>" ], "checkpoint": { "envelope": "<TLOG CHECKPOINT SIGNED NOTE>" } }, "canonicalizedBody": "<Base64(JSON)>" }, ] } Timestamp #Zero or more RFC3161 timestamps to validate signing occurred during ceritificate validity."verificationMaterial": { "timestampVerificationData": { "rfc3161Timestamps": [ { "signedTimestamp": "<Base64(RFC3161 TIMESTAMP)>" }, ] } } Content #This is the signature data for which the Verification Material is defined over. It must be one of Message Signature over an artifact hash or a DSSE envelope for attestations.Message Signature #This is a computed signature over a message (typically an arifact hash). It may contain a message_digest for informational purposes, but it must be provided or computed from a provided artifact at verification time."messageSignature": { "messageDigest": { "algorithm": "<HASH ALGORITHM>", "digest": "<Base64(DIGEST)>" }, "signature": "<Base64(SIGNATURE)>" } DSSE #The DSSE envelope in a Sigstore Bundle must conform to the in-toto Envelope layer specification where payloadType is "application/vnd.in-toto+json" and the payload is an in-toto statement. DSSE envelopes in a Sigstore Bundle must also contain only a single signature (the DSSE spec allows multiple)."dsseEnvelope": { { "payload": "<Base64(JSON_IN_TOTO_STATEMENT)>", "payloadType": "application/vnd.in-toto+json", "signatures": [{ "keyid": "<KEY_ID>", "sig": "<Base64(SIGNATURE)>" }] } } Examples #Here are some example bundles from the Sigstore public infrastructure.Message Signature Bundle #Bundle with Message Signature over an artifact (sigstore-java-1.0.0.jar). This example includes a single transparency log entry with a signed entry timestamp for signing time verification.{ "mediaType": "application/vnd.dev.sigstore.bundle.v0.3+json", "verificationMaterial": { "tlogEntries": [{ "logIndex": "125680200", "logId": { "keyId": "wNI9atQGlz+VWfO6LRygH4QUfY/8W4RFwiT5i5WRgB0=" }, "kindVersion": { "kind": "hashedrekord", "version": "0.0.1" }, "integratedTime": "1724870676", "inclusionPromise": { "signedEntryTimestamp": "MEYCIQCAKWrmj0LZ77rfiMXEat9gCCJxX4pgQfZqNc+tvF7gaAIhAJFtyypsWCbLDJ+NAMzPoY1AkQ1inhhQ3pZC5PaBCI8C" }, "inclusionProof": { "logIndex": "3775938", "rootHash": "nEpjeg/gaT1EOcKQAr3q/XGdnuKzLsf4UhgZrwtTU+8=", "treeSize": "3775939", "hashes": ["vNwG4wbIsTeCSn9JageqhtCb6VvgYEKSw3Xro8zMF3s=", "3Cue+tnRytahmzjIHIig4/fKMN9WAQmi/8g4Fdk6+8k=", "2EvX4swCFD/LILwJKa300/8gGp/NrdPRJmS5xD5vTKE=", "7hEYrEVIERVjsDqdu600HLZ8gNcv7a45T2PI6RSmuzQ=", "Uh7WsOJYvurV8PIbjfhlLyW+CP+/HENUKB4tooMfNZo=", "Qs+LtoqLx2sFhSJUuUlbJs13xTJzH7lVPpEKpXBZyvI=", "kM4w7ZLh5iktz4xR9ECXn9elEJIaqockScafEFL7ieY=", "LomN2mlfw+qbbFGvCNfr3vCBrZ4EU/lqnL4TO0yc9Zw=", "22569ZiSqZcajfTf9Ct4LFEWDtLlHeaTpoPCFqeZtWQ=", "QxmVWsbTp4cClxuAkuT51UH2EY7peHMVGKq7+b+cGwQ=", "Q2LAtNzOUh+3PfwfMyNxYb06fTQmF3VeTT6Fr6Upvfc=", "ftwAu6v62WFDoDmcZ1JKfrRPrvuiIw5v3BvRsgQj7N8="], "checkpoint": { "envelope": "rekor.sigstore.dev - 1193050959916656506\n3775939\nnEpjeg/gaT1EOcKQAr3q/XGdnuKzLsf4UhgZrwtTU+8\u003d\n\n— rekor.sigstore.dev wNI9ajBEAiA/TrOctVDd1vjn/IrzCU8Fm7mhUlJ2FN739iGpqMomHgIgRwwqXaijp0RRTgyRxYUsCZ6LFvewTTEyaPmO4vHKqgk\u003d\n" } }, "canonicalizedBody": "" }], "certificate": { "rawBytes": "" } }, "messageSignature": { "messageDigest": { "algorithm": "SHA2_256", "digest": "W+JvF3ejUaL3cOkdvOrgqqP24m6K0hjGrBbKp4Olqg0=" }, "signature": "MEUCIAlVM9GGEFWgWb2st+GEYUUJaMxFev1bW6MTsWdgbK5bAiEAoXXJNQACRF4o68LtWGoTWJeeszDkEveQka8T6+8Xy4A=" } } DSSE Bundle #Bundle with DSSE Envelope over a provenance attestation. This example includes a transparency log entry and an rfc3161 timestamp.{ "mediaType": "application/vnd.dev.sigstore.bundle+json;version=0.2", "verificationMaterial": { "x509CertificateChain": { "certificates": [ { "rawBytes": "'
