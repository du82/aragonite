["https://docs.sigstore.dev/about/api-stability"]
title = "API Stability and Deprecation Policy - Sigstore"
description = "API stability levels and deprecation policy"
full_description = "HomeAboutAPI Stability and Deprecation PolicyAPI Stability and Deprecation Policy On this page ExpandCollapseWhat does this cover?What are the different API stability levels?What is the deprecation policy at each level?On this pageWhat does this cover?What are the different API stability levels?What is the deprecation policy at each level?This document covers API stability and the deprecation policy for Sigstore APIs and client libraries.What does this cover? #The deprecation policy encompasses:The client API for FulcioThe client API for RekorFeatures provided by cosignThe sigstore/sigstore client libraryThe cosign/pkg/oci client libraryWhat are the different API stability levels? #There are three levels of stability and support:ExperimentalFeatures may be shipped with bugsFeature is not yet recommended for production useBetaFeatures will be available for the next few releasesGenerally AvailableThe feature will be available and supportedWhat is the deprecation policy at each level? #Experimental: Features can be changed or deprecated without noticeBeta: Backwards incompatible changes require at least 2 months noticeGenerally Available: Deprecating features requires at least 6 months noticeNote: These guidelines will be followed on a best-effort basis. Since Sigstore is a security project, maintainers reserve the right to break things faster if necessary to address a security issue.A list of features and associated levels will be available in each repository under FEATURES.md. A deprecation table will be available in each repository under DEPRECATIONS.md.Edit this page on GitHub← Sigstore Bundle FormatContributing →"
