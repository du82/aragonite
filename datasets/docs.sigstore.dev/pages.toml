["https://docs.sigstore.dev/cosign/key_management/signing_with_self-managed_keys"]
title = "Signing with Self-Managed Keys - Sigstore"
description = """
To generate a key pair in Cosign, run cosign generate-key-pair. You&rsquo;ll be interactively prompted to provide a password.
$ cosign generate-key-pair Enter password for private key: Enter again: Private key written to cosign.key Public key written to cosign.pub Alternatively, you can use the COSIGN_PASSWORD environment variable to provide one.
Note: Cosign supports RSA, ECDSA, and ED25519 keys. For RSA, Cosign only supports RSA PKCS#1.5 padded keys.
Key generation and management # To generate keys using a KMS provider, you can use the cosign generate-key-pair command with the --kms flag."""
full_description = "HomeCosignKey ManagementSigning with Self-Managed KeysSigning with Self-Managed Keys On this page ExpandCollapseKey generation and managementSigning with a local key pairOn this pageKey generation and managementSigning with a local key pairTo generate a key pair in Cosign, run cosign generate-key-pair. You’ll be interactively prompted to provide a password.$ cosign generate-key-pair Enter password for private key: Enter again: Private key written to cosign.key Public key written to cosign.pub Alternatively, you can use the COSIGN_PASSWORD environment variable to provide one.Note: Cosign supports RSA, ECDSA, and ED25519 keys. For RSA, Cosign only supports RSA PKCS#1.5 padded keys.Key generation and management #To generate keys using a KMS provider, you can use the cosign generate-key-pair command with the --kms flag.cosign generate-key-pair --kms <some provider>://<some key> Read more about this in the key management overview.The public key can be retrieved with:$ cosign public-key --key <some provider>://<some key> -----BEGIN PUBLIC KEY----- MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEXc+DQU8Pb7Xo2RWCjFG/f6qbdABN jnVtSyKZxNzBfNMLLtVxdu8q+AigrGCS2KPmejda9bICTcHQCRUrD5OLGQ== -----END PUBLIC KEY----- Signing with a local key pair #This section shows traditional key signing from a key pair:$ cosign sign --key cosign.key user/demo Enter password for private key: Pushing signature to: index.docker.io/user/demo:sha256-87ef60f558bad79beea6425a3b28989f01dd417164150ab3baab98dcbf04def8.sig Edit this page on GitHub← OverviewImporting Key Pairs →"
