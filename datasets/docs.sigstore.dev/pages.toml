["https://docs.sigstore.dev/cosign/system_config/public_deployment"]
title = "Public Deployment - Sigstore"
description = """
Public-Good Instance # Staging Instance # There is a public staging environment with staging versions of Fulcio, Rekor and an OIDC issuer, with its own roots of trust.
NOTE The staging environment provides neither SLO guarantees nor the same protection of the root key material for TUF. This environment is meant for development and testing only. It is not appropriate to use for production purposes.
The endpoints are as follows:"""
full_description = 'HomeCosignSystem ConfigurationPublic DeploymentPublic Deployment On this page ExpandCollapsePublic-Good InstanceStaging InstanceUsageOn this pagePublic-Good InstanceStaging InstanceUsagePublic-Good Instance #Staging Instance #There is a public staging environment with staging versions of Fulcio, Rekor and an OIDC issuer, with its own roots of trust.NOTE The staging environment provides neither SLO guarantees nor the same protection of the root key material for TUF. This environment is meant for development and testing only. It is not appropriate to use for production purposes.The endpoints are as follows:https://fulcio.sigstage.devhttps://rekor.sigstage.devhttps://oauth2.sigstage.dev/authThese instances are operated and maintained in the same manner as the public production environment for Sigstore.Usage #To use this instance, follow the steps below:rm -r ~/.sigstorecurl -O https://raw.githubusercontent.com/sigstore/root-signing-staging/main/metadata/root_history/1.root.jsoncosign initialize --mirror=https://tuf-repo-cdn.sigstage.dev --root=1.root.jsoncosign sign --oidc-issuer "https://oauth2.sigstage.dev/auth" --fulcio-url "https://fulcio.sigstage.dev" --rekor-url "https://rekor.sigstage.dev" ${IMAGE_DIGEST}cosign verify --rekor-url "https://rekor.sigstage.dev" ${IMAGE} --certificate-identity=name@example.com --certificate-oidc-issuer=https://accounts.example.comSteps 1-3 configure your local environment to use the staging keys and certificates.Step 4 specifies the staging environment with flags needed for signing.Step 5 specifies the staging environment with flags needed for verifying.Revert Back to Production #In order to revert, we need to clear the local TUF root data and re-initialize with the default production TUF root data.rm -r ~/.sigstorecosign initializeEdit this page on GitHub← Configuring Cosign with Custom ComponentsRegistry Support →'
