["https://docs.sigstore.dev/cosign/signing/overview"]
title = "Overview - Sigstore"
description = """
This document explains how identity-based, or &ldquo;keyless&rdquo; signing works in Sigstore.
To learn more about OIDC, please review OIDC Usage in Fulcio.
Keyless signing associates identities, rather than keys, with an artifact signature. Fulcio issues short-lived certificates binding an ephemeral key to an OpenID Connect identity. Signing events are logged in Rekor, a signature transparency log, providing an auditable record of when a signature was created.
See the Fulcio repository and Rekor repository for more information."""
full_description = 'HomeCosignSigningOverviewOverview On this page ExpandCollapseRoot of TrustIdentity TokensLogging in to identity issuersThe signing, witnessing, and verifying processOn Google Cloud PlatformCustom infrastructureCustom roots of trustOn this pageRoot of TrustIdentity TokensLogging in to identity issuersThe signing, witnessing, and verifying processOn Google Cloud PlatformCustom infrastructureCustom roots of trustThis document explains how identity-based, or “keyless” signing works in Sigstore.To learn more about OIDC, please review OIDC Usage in Fulcio.Keyless signing associates identities, rather than keys, with an artifact signature. Fulcio issues short-lived certificates binding an ephemeral key to an OpenID Connect identity. Signing events are logged in Rekor, a signature transparency log, providing an auditable record of when a signature was created.See the Fulcio repository and Rekor repository for more information.Root of Trust #Sigstore’s root of trust, which includes Fulcio’s root CA certificate and Rekor’s public key, are distributed by The Update Framework (TUF). TUF is a framework to provide secure software and file updates. TUF defines a set of protocols to protect against various types of attacks. For more information about how Sigstore uses TUF, see How Sigstore uses TUF.Identity Tokens #Cosign supports two OAuth flows today: the standard flow and the device flow.When there is no terminal attached (non-interactive mode), Cosign will automatically use the device flow where a link is printed to stdout. This link must be opened in a browser to complete the flow.In automated environments, Cosign also supports directly using OIDC Identity Tokens from specific issuers. These can be supplied on the command line with the --identity-token flag. The audiences claim in the token must contain sigstore.Logging in to identity issuers #To log in and set up your OIDC Identity, follow these steps:Follow the link that Cosign provides to the Issuer login page.Log in to one of the supported systems that is shown: Go back to your terminal or other application. Redirection back to Cosign is seamless.Currently, Sigstore supports Microsoft, Google, and GitHub. As an alternative, you can also use the environment variable SIGSTORE_ID_TOKEN to identify yourself by setting its value to that of the identity token. Cosign also has support for detecting some of these automated environments and producing an identity token. Currently this supports Google and GitHub, in addition to other environments. See Cosign’s providers for a complete list.The signing, witnessing, and verifying process #Identity-based signing is the default because managing and distributing keys can be challenging to do securely, and developers are very likely to already have a trusted identity rather than a signing key. When using Sigstore’s defaults for signing and verification, the process of signing is as follows:Verifying identity and signing the artifact #An in-memory public/private keypair is created.The identity token is retrieved.Sigstore’s certificate authority verifies the identity token of the user signing the artifact and issues a certificate attesting to their identity. The identity is bound to the public key. Decrypting with the public key will prove the identity of the private keyholder.For security, the private key is destroyed shortly after and the short-lived identity certificate expires. Users who wish to verify the software will use the transparency log entry, rather than relying on the signer to safely store and manage the private key.Recording signing event #To create the transparency log entry, a Sigstore client creates an object containing information that will allow signature verification without the (destroyed) private key. The object contains the hash of the artifact, the public key, and the signature. Crucially, this object is timestamped. The Rekor transparency log “witnesses” the signing event by entering a timestamped entry into the records that attests that the secure signing process has occurred. Clients upload signing events to the transparency log so that the events are publicly auditable. Artifact owners should monitor the log for their identity to verify each occurrence. The software creator publishes the timestamped object, including the hash of the artifact, public key, and signature.Verifying the signed artifact #When a software consumer wants to verify the software’s signature, Sigstore compares a tuple of signature, key/certificate, and artifact from the timestamped object against the timestamped Rekor entry. If they match, it confirms that the signature is valid because the user knows that the expected software creator, whose identity was certified at the moment of signing, published the software artifact in their possession. The entry in Rekor’s immutable transparency log means that the signer will be monitoring the log for occurrences of their identity and will know if there is an unexpected signing event.On Google Cloud Platform #From a Google Cloud Engine (GCE) virtual machine, you can use the VM’s service account identity to sign an image:$ cosign sign --identity-token=$( gcloud auth print-identity-token \ --audiences=sigstore) \ gcr.io/user-vmtest2/demo From outside a GCE VM, you can impersonate a GCP IAM service account to sign an image:$ cosign sign --identity-token=$( gcloud auth print-identity-token \ --audiences=sigstore \ --include-email \ --impersonate-service-account my-sa@my-project.iam.gserviceaccount.com) \ gcr.io/user-vmtest2/demo In order to impersonate an IAM service account, your account must have the roles/iam.serviceAccountTokenCreator role.Note: On Google Cloud Build, standard identity tokens are not supported through the GCE metadata server. Cosign has a special flow for this case, where you can instruct the Cloud Build service account to impersonate another service account. To configure this flow:Create a service account to use for signatures (the email address will be present in the certificate subject).Grant the Cloud Build service account the roles/iam.serviceAccountTokenCreator role for this target account.Set the GOOGLE_SERVICE_ACCOUNT_NAME environment variable to the name of the target account in your cloudbuild.yamlSign images in GCB, without keys!Custom infrastructure #If you’re running your own sigstore services flags are available to set your own endpoint’s, e.g cosign sign --oidc-issuer "https://oauth2.example.com/auth" \ --fulcio-url "https://fulcio.example.com" \ --rekor-url "https://rekor.example.com" \ ghcr.io/jdoe/somerepo/testcosign Custom roots of trust #For information on custom roots of trust, see Configuring Cosign with Custom Components.Edit this page on GitHubSigning Containers →'
year_published = 2025
clearnet = "https://docs.sigstore.dev/cosign/signing/overview"
