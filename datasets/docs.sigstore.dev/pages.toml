["https://docs.sigstore.dev/language_clients/java"]
title = "Java - Sigstore"
description = """
sigstore-java is a java client for interacting with the Sigstore infrastructure.
Features # Maven and Gradle signing plugins Keyless signing and verifying Java native signing and verifying API Installation # Release information for the Java client is available here. We recommend using the latest version for your install.
Maven # Requires Java 11
&lt;plugin&gt; &lt;groupId&gt;dev.sigstore&lt;/groupId&gt; &lt;artifactId&gt;sigstore-maven-plugin&lt;/artifactId&gt; &lt;version&gt;1.0.0&lt;/version&gt; &lt;executions&gt; &lt;execution&gt; &lt;id&gt;sign&lt;/id&gt; &lt;goals&gt; &lt;goal&gt;sign&lt;/goal&gt; &lt;/goals&gt; &lt;/execution&gt; &lt;/executions&gt; &lt;/plugin&gt; More information on the Maven build plugin is available in the project repository."""
full_description = 'HomeLanguage clientsJavaJava On this page ExpandCollapseFeaturesInstallationMavenGradleAPI Usage ExamplesSigningVerifyingAdditional examplesOn this pageFeaturesInstallationMavenGradleAPI Usage ExamplesSigningVerifyingAdditional examplessigstore-java is a java client for interacting with the Sigstore infrastructure.Features #Maven and Gradle signing pluginsKeyless signing and verifyingJava native signing and verifying APIInstallation #Release information for the Java client is available here. We recommend using the latest version for your install.Maven #Requires Java 11 <plugin> <groupId>dev.sigstore</groupId> <artifactId>sigstore-maven-plugin</artifactId> <version>1.0.0</version> <executions> <execution> <id>sign</id> <goals> <goal>sign</goal> </goals> </execution> </executions> </plugin> More information on the Maven build plugin is available in the project repository.Gradle #Requires Java 11 and Gradle 7.5.plugins { id("dev.sigstore.sign") version "1.0.0" } More information on the Gradle build plugin is available in the project repository.API Usage Examples #Signing #Path testArtifact = Paths.get("path/to/my/file.jar") // sign using the sigstore public instance var signer = KeylessSigner.builder().sigstorePublicDefaults().build(); Bundle result = signer.signFile(testArtifact); // sigstore bundle format (serialized as <artifact>.sigstore.json) String bundleJson = result.toJson(); Verifying #Get artifact and bundle #Path artifact = Paths.get("path/to/my-artifact"); // import a json formatted sigstore bundle Path bundleFile = Paths.get("path/to/my-artifact.sigstore.json"); Bundle bundle = Bundle.from(bundleFile, StandardCharsets.UTF_8); Configure verification options #// add certificate policy to verify the identity of the signer VerificationOptions options = VerificationOptions.builder().addCertificateMatchers( CertificateMatcher.fulcio() .subjectAlternativeName(StringMatcher.string("test@example.com")) .issuer(StringMatcher.string("https://accounts.example.com")) .build()); Do verification #try { // verify using the sigstore public instance var verifier = new KeylessVerifier.builder().sigstorePublicDefaults().build(); verifier.verify(artifact, bundle, verificationOptions); // verification passed! } catch (KeylessVerificationException e) { // verification failed } Additional examples #Additional examples are available in the project repository.Edit this page on GitHub← GoJavaScript →'
