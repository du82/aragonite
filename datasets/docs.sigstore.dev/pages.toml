["https://docs.sigstore.dev/about/tooling"]
title = "Tooling - Sigstore"
description = """
Sigstore combines several different technologies that focus on automatic key management and transparency logs. They can be used independently or as one single process, and together they create a safer chain of custody tracing software back to the source.
Cosign # Tool for signing/verifying containers (and other artifacts) that ties the rest of Sigstore together, making signatures invisible infrastructure. Includes storage in an Open Container Initiative (OCI) registry. Review Cosign&rsquo;s command line interface on GitHub."""
full_description = "HomeAboutToolingTooling On this page ExpandCollapseCosignFulcioRekorOpenID ConnectPolicy ControllerOn this pageCosignFulcioRekorOpenID ConnectPolicy ControllerSigstore combines several different technologies that focus on automatic key management and transparency logs. They can be used independently or as one single process, and together they create a safer chain of custody tracing software back to the source.Cosign #Tool for signing/verifying containers (and other artifacts) that ties the rest of Sigstore together, making signatures invisible infrastructure. Includes storage in an Open Container Initiative (OCI) registry. Review Cosign’s command line interface on GitHub.Fulcio #A free root certification authority, issuing temporary certificates to an authorized identity and publishing them in the Rekor transparency log.Rekor #A built-in transparency and timestamping service, Rekor records signed metadata to a ledger that can be searched, but can’t be tampered with.OpenID Connect #An identity layer that checks if you’re who you say you are. It lets clients request and receive information about authenticated sessions and users.Policy Controller #An admission controller for Kubernetes for enforcing policy on containers allowed to run.Edit this page on GitHub← OverviewSecurity Model →"
