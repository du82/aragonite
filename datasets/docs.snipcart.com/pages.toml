full_description = "REST API basics We built a complete REST e-commerce API that lets you manage your data the way you need. We used HTTP features such as authentication, verbs and response codes to make it easy to use. Our REST API only accepts application/json content type, so you must always specify Accept: application/json header in every request you make. The main API endpoint is https://app.snipcart.com/api If you're new to APIs, consider reading this post. Was this article helpful? Yes No REST API basics We built a complete REST e-commerce API that lets you manage your data the way you need. We used HTTP features such as authentication, verbs and response codes to make it easy to use. Our REST API only accepts application/json content type, so you must always specify Accept: application/json header in every request you make. The main API endpoint is https://app.snipcart.com/api If you're new to APIs, consider reading this post. Was this article helpful? Yes No"
