["https://docs.snipcart.com/v3/custom-payment-gateway"]
title = "Custom payment gateway – Snipcart Documentation"
description = "Snipcart's custom payment gateway feature lets you integrate your online store with any payment method. Read this to get started."
full_description = "Custom payment gateway There are hundreds of online payment gateways. As of now, Snipcart officially supports the following ones: Stripe PayPal Braintree Mollie Square Authorize.net However, we're committed to providing as much development flexibility as possible. If the above don't fit your needs, you can use our custom payment gateway feature to integrate Snipcart with any payment gateway(s). A custom payment gateway can be added on top of any other supported payment gateways connected to your Snipcart account. This includes PayPal Express Checkout. A custom payment gateway can provide an unlimited number of different payment methods—that part is up to you. Disclaimer: using this feature requires web development experience. If this isn't your area of expertise, consider collaborating with developers. Technical overview To enable this functionality, we've created an API that allows customers to complete a purchase on external checkouts. These external checkouts are not hosted by Snipcart and must be created on your end. Custom payment gateway flexibility opens the door to a wide array of payment methods, including but not limited to: Any payment gateway Snipcart doesn't support Gift cards Debit payments Cryptocurrency Pay with a tweet Next up → Merchant dashboard configuration Was this article helpful? Yes No"
year_published = 2025
clearnet = "https://docs.snipcart.com/v3/custom-payment-gateway"
