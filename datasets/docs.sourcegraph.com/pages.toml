full_description = "Sourcegraph is a Code Intelligence platform that deeply understands your code, no matter how large or where it’s hosted, to power modern developer experiences. Cody: Use Cody our AI code assistant to read, write, and understand your entire codebase faster Code search: Search through all of your repositories across all branches and all code hosts Code intelligence: Navigate code, find references, see code owners, trace history, and more Fix & refactor: Roll out and track large-scale changes and migrations across repos at once Quickstart CodyWrite, fix, and maintain code with Sourcegraph’s AI coding assistant, Cody. Code SearchSearch all of your repositories across all branches and all code hosts.Sourcegraph 101Learn how to use Sourcegraph.Sourcegraph TourTake a tour of Sourcegraph’s features using real-world examples and use cases. Main Features Some of the main Sourcegraph features include: FeatureDescriptionCodyCody is a free AI coding assistant that writes, fixes, and maintains your codeCode NavigationJump-to-definition, find references, and other IDE-like code browsing features on any branch, commit, or PR/code reviewCode InsightsReveal high-level information about your codebase at its current state and over time, to track migrations, version usage, vulnerability remediation, ownership, and moreBatch ChangesMake large-scale code changes across many repositories and codehostsIntegrationsWith code hosts, code review tools, editors, web browsers, etc.NotebooksPair code and markdown to create powerful live and persistent documentation What's New Stay in sync and get the latest news on Sourcegraph products, technologies, and culture. Read the blog → Join our Community If you have questions about anything related to Sourcegraph, you're always welcome to ask our in our Sourcegraph community forum, Discord, and X."
