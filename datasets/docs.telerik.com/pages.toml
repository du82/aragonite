title = "Overview - Progress Telerik Test Studio for APIs"
description = """
New to Telerik Test Studio?                                                            Test Studio is a test automation platform for web, WPF, and responsive web applications, supporting UI, functional, load, and RESTful API testing. Sign up for a free 30-day trial!"""
full_description = "Overview The new Test Studio for APIs helps customers verify the integrity and reliability of their APIs in an easy way and incorporate their API testing effort in their continuous testing and delivery process. Test Studio for APIs is used to determine whether APIs return the correct response for a broad range of commonly accepted requests, react properly to edge cases such as failures and unexpected inputs, as well as deliver the responses in an acceptable amount of time. New to Telerik Test Studio? Test Studio is a test automation platform for web, WPF, and responsive web applications, supporting UI, functional, load, and RESTful API testing. Sign up for a free 30-day trial! Download Free Trial Features Codeless API testing with build-in support for Path expressions - a key goal of Test Studio for APIs is to enable customers to test their APIs without writing any code. You can cover various automation scenarios, make verifications and value extractions using XPath and JSONPath expressions. Variable Management - extract values from received http responses and store them in variables on a test or project level to be used for verifications or further http requests. Verifications - use the built-in verifications to assert the results of your requests. Verify the properties of http responses like status code, response time, response body or headers. Compare them against expected values using various codeless text or numeric comparisons. Value conversions - you can transform your extracted variables using the built-in transformations like urlencoding, base64, md5, etc. Execution flow management - Handle complex scenarios with Goto and Wait steps. All test steps support conditions that allow you to control when the steps should be executed or skipped. Recording and Import Record HTTP(S) Traffic - capture HTTP(S) traffic from within Test Studio for APIs. Import http(s) sessions directly as tests. You can make modifications to imported test requests to cover various alternative scenarios. Built-in shortcuts make it easy to make quick verifications for response headers, status or response time. Import SAZ files - you can import SAZ files with already captured Fiddler traffic and import them as tests. CI Server Integration CI Server Integration - the included command line interface allows easy integration with most existing continuous integration servers (any CI server that supports executing command line commands can run Test Studio for APIs). Command-line parameters support allows switching the values of key variables according to the target environment. Test Results - the junit and XML test results support allows collecting and analyzing test results with most CI servers. See Also: Project Explorer HTTP Requests Steps Verifications Working with variables Test Results Record HTTP(S) Traffic Import HTTP(S) Traffic Advanced Topics"
