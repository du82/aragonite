["http://docs.telerik.com/teststudio/index"]
title = "Welcome to Test Studio - Progress Test Studio"
description = """
New to Telerik Test Studio?                                                            Test Studio is a test automation platform for web, WPF, and responsive web applications, supporting UI, functional, load, and RESTful API testing. Sign up for a free 30-day trial!"""
full_description = "Welcome to Test Studio You’ve been always looking for a test automation tool that really works and you’ve never found the right one? Look no further as you’ve come to the right place! Why Test Studio Test Automation Tool? Test Studio is an easy to use tool for functional UI, load/performance and API testing for web and WPF desktop applications. Whether you decide to go codeless or choose to use Test Studio’s code-based automation capabilities, you’ll always ensure optimal app quality and deliver outstanding results. Test Studio provides test automation solutions for the entire team, empowering everyone—from junior testers to senior developers, product managers and QA leads—to achieve maximum productivity in agile software delivery environments. New to Telerik Test Studio? Test Studio is a test automation platform for web, WPF, and responsive web applications, supporting UI, functional, load, and RESTful API testing. Sign up for a free 30-day trial! Download Free Trial Who is Test Studio Designed For? Test Studio is designed to fit your entire team. Test Studio’s visual test recorder is the ideal tool for less experienced QA’s that aim to switch from manual to automated testing. They can start creating automated tests within days without the need to write code. Test Studio’s embedded C# or VB code editor allows more experienced test engineers to go into the tests’ code and create advanced in-code actions. The software engineers on your team on the other hand can take advantage of the built-in Visual Studio extension allowing them to access the same test projects within Visual Studio and collaborate with QA. Testing Framework and Flagship Technology Test Studio is not based on Selenium or other Open Source frameworks but on proprietary technology—the Telerik Testing Framework. It is a .NET based framework backed by Progress that continuously undergoes updates as to support development of new Test Studio functionality. Thanks to the underlying testing framework, writing C# or VB based automated tests is supported inside Test Studio. Supported Testing Methodologies Making sure your application is free from defects requires a testing strategy that integrates several testing methodologies and combines a variety of tests, each of which proves some aspect of your application is ready for deployment. Test Studio supports all kinds of functional UI testing, covering any web technology—the entire .NET stack for web, including legacy and modern technologies like Blazor, WPF desktop as well as Java Script based front-end technologies like Angular, React and jQuery. Automating frequent and repetitive tests with Test Studio not only supports efficient and cost-effective regression testing, but it also enables you to set up tests for all environments you need to test against. Test Studio also supports load and performance testing by allowing you to convert functional into load tests or easily build load tests from scratch, without code and based on Fiddler Everywhere logs. The API testing capabilities in Test Studio let you create verifications against all common RESTful API requests with the possibility to use API tests as steps in automated UI tests. Thanks to Test Studio’s integration capabilities, tests can be scheduled to run as part of any CI/CD setup, in Azure pipelines using Microsoft-hosted agents or even in Docker containers. Features Overview Test Studio functional testing allows you to create, run and automate functional with a variety of productivity features that will save you tons of time. Some of our most prominent features are: Intuitive recorder with cross browser support - with its intuitive click and record functionality, recording steps has never been easier. Major browsers, including Chrome, Edge, Firefox, Headless Chrome for headless test execution, are proactively supported in Test Studio. Intelligent hybrid element detection - by creating automation elements that use both web locators and images, flaky and fragile tests are a thing of the past. Element repository – during test recording elements are added to the centralized Element Repository which allows you to manage these easier and reuse them across tests and projects, eliminating redundancies and making things easier for you. Remote scheduling and concurrent Runs - use out-of-the-box scheduling functionality that allows performing common tasks such as running concurrent tests on multiple remote machines. Executive dashboard - monitor automation results and reports with an easy-to-use web feature. Everyone on your team can access it in the web without the need of having a dedicated Test Studio license Data-driven testing – bind data source to test commands without the need to write and maintain code. Step failure details – use failure reports and intelligent suggestions to easily identify and fix failing tests. Validating PDFs – add PDF validation steps during test recording or whenever you need to during automation. Getting Started Install Test Studio Activate Test Studio License Record Your First Test Analyze the Execution Results Getting Started Videos Getting Started Blogs Latest Version What's new Release notes Send a presale inquiry Tutorials: Test Automation Fundamentals Recording Tests Elements in Test Studio Data Driven Testing Dialog Handling Test Lists Scheduling Test Runs Results Tab Source Control Integration Coded Step API Test as Step Learn and Help Resources Videos Virtual Classroom Community Submit a general feedback Contact support Tutorials: Advanced Test Automation Continuous Integration and Deployment (CI/CD) Coded Samples for Different Scenarios"
