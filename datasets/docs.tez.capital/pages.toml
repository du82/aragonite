["https://docs.tez.capital/tezgov/tutorials/injecting-proposals"]
title = "Injecting Proposals | docs.tez.capital"
description = "TezGov Portal Proposal Injection Tutorial"
full_description = "TezGov TezGov Tutorials Injecting Proposals Injecting Proposals TezGov Portal Proposal Injection Tutorial TezGov Web Portal: https://gov.tez.capital Log into the TezGov portal by using the most secure method available to you. We highly recommend using the direct Ledger login at the top. This method allows you to see the specific details of your vote on your Ledger screen. Use the Remote (signer) method if you have a signer somewhere on your LAN or local computer. This is an option for advanced users. Use the Beacon method if you are using a Beacon enabled wallet like Temple or Kukai. In this case you will not see the exact details of your vote on your Ledger screen and you will instead be asked to sign an arbitrary blob message. This method also works fine but it is inherently less secure than the direct Ledger method. Click New Proposal You have 2 options when submitting a proposal via the TezGov portal. (1) You can submit a proposal published by the Tezos core developers by pasting its hash The true names of the proposals crafted by the collective Tezos core developer teams are posted in https://research-development.nomadic-labs.com/blog.html. Any Tezos baker can submit these proposals to the Tezos blockchain by pasting their hash as shown below. In the example given, the baker is submitting the Nairobi proposal. (2) You can submit a message to the Tezos bakers and community in the form of a Tezos proposal hash Vanity names are names crafted for the sole purpose to send a message to all ecosystem participants. They are not meant to be passed during the exploration or adoption phases. Vanity proposals are meant to be used as a way to communicate with the whole Tezos community as a delegate (i.e. baker) on Tezos. In the example given, the baker is submitting a signal that on-chain funding is something desirable. Vanity proposals can be used for other reasons as well but they are never meant to be pursued all the way through. The scope of vanity proposals does not extend past the proposal round. All bakers must take great care not to vote on these proposals once the governance process enters the exploration phase. We encourage all bakers to use this system only for serious ecosystem governance issues. The governance portal functionality is a two way street. The ability to speak does not absolve a baker from the consequences of the baker’s speech. Any questions/comments/concerns? Please contact the Tez Capital team on Discord or Telegram"
