["https://docs.tez.capital/getting-started"]
title = "Getting Started with Baking | docs.tez.capital"
description = "Documentation"
full_description = "Getting Started with Baking Getting Started with Baking Getting Started with Tezos Baking Baking on Tezos refers to the act of validating and producing blocks on the Tezos blockchain. Baking is suited for individuals at home as well as companies in their on-premise data centers, and cloud providers. At this time the TezBake software focuses on indivudals and companies baking on premise in their homes and own data centers. We do not support baking on cloud providers at this time. We support the most secure on-premise baking method which involves dedicating a small form factor computer to baking with a Ledger Nano S or Nano S Plus hardware wallet as the key storage device. This setup is inexpensive, widely available, and very secure. It does not require a very fast internet connection. It is also very easy to setup and maintain with TezBake. There is never any stake slashing on Tezos in the event of a hardware failure. You will merely not receive rewards for the period of time that the baking computer is down. All blocks that you must bake are scheduled around 5-6 days in advance. You must be operational during the exact times of your block to receive rewards. There is no punishment for missing some of your endorsements as long as you are able to successfully endorse 67% of your endorsements each cycle, every 2.8 days. Getting Started > What is Tezos Baking Tezos Baking Best Practices Tezos Public Baking"
