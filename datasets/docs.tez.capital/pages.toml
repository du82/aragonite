description = "Using TezBake to bake on the Ghostnet Tezos perpetual testnet"
full_description = 'TezBake TezBake Tutorials Baking on Ghostnet Baking on Ghostnet Ghostnet Ghostnet is Tezos’ perpetual testnet. In the context of TezBake, Ghostnet is intended to provide a no-consequences testing environment where you can learn how to properly bake and pay using TezBake and TezPay. It’s highly recommended for all serious bakers to have a Ghostnet setup running, to help test protocol migrations. Preparation Installing TezBake CLI and using it to setup your Tezos baker is very simple. You will need the following tools: Spare computer or existing computer with Linux installed. We recommend Ubuntu Linux. You must have an SSD drive or better & at least 8GB RAM Ledger Nano S hardware wallet with Tezos Wallet & Baker apps installed. It’s necessary to use Ledger Live to install the Tezos Wallet & Baking applications; to install the latter you must enable developer mode in Ledger Live settings Absolutely ensure you have properly configured the Ledger device settings so the device doesn’t lock 10 minutes after inactivity. This is a common issue that can cause your baker to stop baking. Remove the Ledger wallet app from your baking device after you’ve finished setting up your baker. This is a security measure to prevent unauthorized access to your baker. You can always reinstall the app when you need to use the Ledger for baking or other purposes. Installation Download and copy tezbake To begin, run the script below, which will download the latest version of TezBake and copy it to your /usr/sbin directory. This script works with both x86_64 and arm64 architectures. wget -q https://github.com/tez-capital/tezbake/raw/main/install.sh -O /tmp/install.sh && sudo sh /tmp/install.sh # you may be prompted for sudo password Setup Tezos node, signer and install tezbake dependencies tezbake setup -a --node-configuration=https://raw.githubusercontent.com/tez-capital/xtz.configs/main/ghostnet.json # you may be prompted for sudo password Bootstrap Tezos node At this stage, it’s necessary to bootstrap your node, meaning to download a copy of the blockchain so you don’t have to synchronize block-by-block, which takes hours at best. tezbake bootstrap-node <url> <block_hash> # example: tezbake bootstrap-node https://snapshots.eu.tzinit.org/ghostnet/rolling BL8Vq12HX6MJWkB6RLgQAYRKpKZ5fyMoLpWzAoQ6mh55gkKHiQU You can replace eu above with us or asia if you prefer to use a different mirror closer to you. Get the block hash and block level from the snapshot provider’s website: https://snapshots.eu.tzinit.org/ghostnet/rolling.html The <block_hash> argument is optional but encouraged. If you don’t want to borther with this protection, use the second method below which will also be faster. Verify the hash/checksum provided by the snapshot provider to ensure the snapshot is valid. You can find the correct hashes for all blocks on Tezos blockchain explorers such as: https://tzkt.io/blocks https://tzstats.com/ Simply search for the block level in the search field and verify the hash of the block matches the hash provided by the snapshot provider. Start Tezos node After importing the snapshot, you need to start your node and wait until it’s fully synchronized before importing your Ledger key. tezbake start After starting the node, run the following command over and over every few minutes and monitor the “level” displayed. tezbake info Level refers to the latest block number on mainnet. Navigate to https://tzkt.io or https://tzstats.com and observe the latest block. Once the level in your command matches the latest block on your blockchain explorer, your node is in full sync and you can keep following the steps below. Both https://tzkt.io or https://tzstats.com provide Ghostnet and Testnet block explorers as well. Make sure you’re looking at the right explorer. Import Ledger key or soft key and register as baker Now that your node is in full sync, you can proceed with the most important part: (1) your baker parameters import into your baker node and (2) submit your baker registration on the blockchain. You have the option to use the secure Ledger hardware wallet or simply use a local, unencrypted software key (a.k.a. soft key). The secure Ledger hardware wallet is the recommended option for mainnet baking. You will have to first fund your baker address with enough tez (6000 minimum) to cover the bond requirement. You can do this by sending tez from your main account or exchange to the baker address. (Option 1 - RECOMMENDED) Import Ledger key to TezBake signer Using a Ledger hardware wallet is a secure and cost effective way to bake on the Tezos network. The Ledger device is a secure element that stores your private key and signs transactions on the device itself. This means your private key never leaves the device and is never exposed to the internet. In order to get the most out of your Ledger, it’s now recommended to use the P-256 curve (tz3) for baking. This curve is faster than the default ed25519 curve (tz1). If you’re setting up a baker that already exists on the network, you can use the same curve as before. If you’re setting up a new baker, it’s recommended to use the P-256 curve. You can import your Ledger key by running the following command: tezbake setup-ledger --platform --import-key="P-256/0h/0h" --authorize --hwm 1 If you have a custom derivation path, you can specify it as shown: (--import-key="ed25519/0h/0h"; the default is ed25519/0h/0h which works just fine but is not as fast as P-256 or secp256k1. --hwm 1 works great if you’re setting up for the first time. If you’re setting up a device that’s been used to bake before, you want to change this (1) to the current block height on the blockchain for your safety. If you’re importing for the second time after already trying again but failing, you can use --force to force the import. Once imported, you can see your baker address by running tezbake info The ledger will ask you twice to confirm this operation. Make sure the baker you see on the ledger screen matches the one you want to use. If you don’t have this information yet, don’t worry. To get the address of the ledger that’s used by default simply go to https://gov.tez.capital and login with ledger, accepting the default derivation path. Putting the baker on a non-default derivation path provides an additional layer of security for your baker at the cost of extra complexity for you. Make sure your setup is clearly documented for your own records. If your device was used to bake before it might have a “high watermark” aka HWM. If you try to use this device on a testnet, it will not work because the block height on test networks usually starts with 1 while mainnet is up to over a couple of million blocks at the time of writing. If you used to bake on mainnet with the same ledger as you’re trying to use now but it’s been a while, it’s highly recommended to change the 1 above to the current block on the network that will be used for the device going forward. The watermark is simply a record of the lack block number your ledger helped to bake or attest. If you’re setting up a brand new device that’s not been used for baking before, there is no need to alter the default command above. Always make sure you’re not accidentally going to double bake by using your production ledger and/or setup to bake on a testnet. It’s really easy to make this mistake and the only thing preventing it are your personal standard operating procedures, the documentation you keep, and the care you take when setting up your baker. To double bake or attest due to baker setup error means having 2 different bakers with the same key on the same network. This is a serious offense and can lead to loss of bond and other penalties. Always double-check your setup and make sure you’re not accidentally double baking or attesting. (Option 2 - INSECURE) Import Soft key to TezBake signer First, generate the baker key for TezBake signer: tezbake setup-soft-wallet Make sure to backup your key in a secure location and never share it. You can get the secret/private key by running the following command: tezbake signer client show address baker --show-secret Register as baker on the Tezos blockchain Ghostnet For this step your node level must be synced with the latest block on the blockchain explorer. You must also temporarily open your Ledger Tezos Wallet app to register your key as a baker (note: as well as when voting). For all other baker operations, you must use the Tezos Baking app. To secure your XTZ security deposit on Ghostnet you can use the faucet to get some free XTZ. You can find the faucet at https://faucet.ghostnet.teztnets.com/ tezbake register-key Registering is not necessary if this is already an active baker ledger which is being setup on some kind of failover machine or in a situation where it has not been over 2 weeks of baking inactivity. Registering applies to new bakers and to inactive bakers. If you’re setting up a new baker, you must register it. If you’re setting up a baker that’s been inactive for over 2 weeks, you must register it. If you’re setting up a baker that’s been inactive for less than 2 weeks, you don’t need to register it. The best way to find out if you need to register your baker again is to look into your baking rights schedule and see if they stopped coming in. If they did, you need to register your baker again. Stake your baking XTZ security deposit To bake on the Tezos network, you need to stake your XTZ security deposit. This is a slashable security deposit that you will get back when you stop baking. The minimum bond to get baking rights is currently set at 6000 XTZ. You can stake your security deposit by running the following command, after opening your Ledger Tezos Wallet app: tezbake signer client stake 6000 for baker Change 6000 to the amount you want to stake. The minimum is 6000 XTZ. You may start baking with as little as 1000 XTZ but you will need to set your baking over staking multiplier to 5X and secure 5000 XTZ that will stake to your baker to cover the security deposit requirement. You can also secure delegators’ XTZ to your baker to cover the security deposit requirement. Each XTZ delegated to your baker will be counted 0.5 towards the security deposit requirement. For example you can start baking with 1000 XTZ + 5000 XTZ secured from stakers, or you can start baking with 1000 XTZ + 10000 XTZ secured from delegators. You can also start baking with 1000 XTZ + 2000 XTZ secured from stakers + 6000 XTZ secured from delegators. Any questions/comments/concerns? Please contact the Tez Capital team on Discord or Telegram'
