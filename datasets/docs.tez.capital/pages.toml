["https://docs.tez.capital/getting-started/best-practices"]
title = "Tezos Baking Best Practices | docs.tez.capital"
description = "Tezos Baking Best Practices"
full_description = "Getting Started with Baking Tezos Baking Best Practices Tezos Baking Best Practices Baking Best Practices This is the description of the ideal TezBake hardware setup and best practice for someone who wants to perform an excellent job baking on-premise, in their home, office or data center (in person) at a reasonable cost. You can get an idea of what kind of computer needs to be dedicated to Tezos baking by looking at the guide below https://www.fxhash.xyz/article/how-to-setup-your-own-tezos-bakery Recommended Hardware Setup Two computers (see link above) with equal or equivalent hardware specs (one optional) Two Ledger Nano S Plus or Nano X hardware wallets (one optional). The Ledger Nano S works as well but is no longer recommended because it takes up to an extra second (compared to the other ones) for it to sign a block or endorsement. This can cause you to miss a block or endorsement One UPS battery backup (optional) Two computers You will need two computers and both computers will be running TezBake. One computer will be used for baking and the other computer will be used as a backup. A manual failover of the Ledger hardware will be necessary to start baking on the second computer if the first computer fails. The second computer is optional, but it is highly recommended. If you only have one computer, you will need to have a backup plan in place in case the computer fails. Two Ledger Nano S Plus or Nano X While having two computers is somewhat optional, especially for a smaller baker, having two Ledger Nano S Plus or Nano X hardware wallets is very highly recommended. You will need to have two hardware wallets for the following reasons: In the event of Ledger hardware failure To transfer tez to your payment wallet or elsewhere, without interrupting baking To vote on Tezos governance proposals, without interrupting baking Note that you must never simultanerously use two hardware wallets to bake for the same baking address. This will result in a double baking or double endorsing offense and you will be slashed. It’s very easy to avoid by: Not authorizing the second hardware wallet to bake for the same address before it’s needed Not importing your baking wallet into your backup computer before it’s needed Before changing any Ledger connections, always ensuring that only one hardware wallet is baking for the address Not installing TezBake on second computer before it’s needed. If you have a fast internet connection, the entire setup process takes just a few minutes. If you only have one hardware wallet and it fails, you will be down until you get a second one and set it up to bake. One UPS battery backup Having at least one UPS device which has your ISP connection and your baking computer connected to it is highly recommended. This will ensure that your baking computer will not be interrupted in the event of electrical failure up to the amount of time supported by your battery. The bigger the battery, the more time your computer will keep baking when power fails. If your baking computer and your ISP are in different rooms or on different electrical outlets, you need to ensure that each one is independently supplied with UPS power. Bad Practices Using Wi-Fi Using DHCP Using your daily use computer or laptop Not using TezBake Discord or Telegram monitoring bots Using Wi-Fi Wi-Fi is not as realiable as a wired connection and can cause strange and random issues. It is highly recommended that you use a wired connection for your baking computer. Using DHCP DHCP automatically assigns IP addresses to your computer. This can cause issues with your baking computer in the event where DHCP is unable to automatically renew its lease. It is highly recommended that you use a static IP address for your baking computer. Using your daily computer or laptop If you use your daily computer for baking, it’s much more likely to have issues because of accidentally affecting either your baker’s connection to the internet or your Ledger’s connection to your baker. Not using TezBake Discord or Telegram monitoring bots The TezBake Discord and Telegram bots are designed to monitor your baker’s status and alert you if there are any issues. It is highly recommended that you use these bots to monitor your baker. Should your baker go offline, you will be notified immediately and can take action to fix the issue. Any questions/comments/concerns? Please contact the Tez Capital team on Discord or Telegram"
