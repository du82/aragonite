title = "Troubleshooting | docs.tez.capital"
description = "TezBake Troubleshooting Tutorial"
full_description = "TezBake TezBake Tutorials Troubleshooting Troubleshooting Troubleshooting Troubleshooting TezBake mostly comes in during the installation phase, when an error is encountered during the setup process. Installation errors If you encounter an installation issue, run the setup command again with the --log-level=trace option, for example: tezbake setup -a --log-level=trace You can add --log-level=trace regardless of the setup type that’s being attempted, whether it’s on Ghostnet or some other testnet. Blockchain errors Sometimes, you will notice that tezbake info never seems to show that you are able to fully synchronize your node. Upon looking at it you may find that your node is stuck on a certain block. This is usually due to a problem with the Tezos node itself. The Tezos node is a separate process from the TezBake process. If you are having issues with the Tezos node, you can try to restart it with the following command: tezbake restart You may see an error like the one below, which indicates your node needs to be bootstrapped with a fresh copy of the Tezos blockchain. baker@baker-VirtualBox:~$ tezbake node log node -f -- Logs begin at Wed 2022-05-18 14:16:28 CEST. -- mai 20 08:51:31 baker-VirtualBox systemd[1]: Stopped bb-default-node node service. mai 20 08:51:31 baker-VirtualBox systemd[1]: Started bb-default-node node service. mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.414 - node.config.validation: the node configuration has been successfully validated. mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.415 - node.main: read identity file (peer_id = idqueYR61yjX8QfsiLru4FEZFSWi7m) mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.415 - node.main: starting the Tezos node v13.0 (cb9f439e) (chain = TEZOS_MAINNET) mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.415 - node.main: disabled local peer discovery mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.415 - node: shell-node initialization: bootstrapping mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.678 - node: shell-node initialization: p2p_maintain_started mai 20 08:51:32 baker-VirtualBox node[5868]: May 20 08:51:32.678 - external_block_validator: initialized mai 20 08:51:33 baker-VirtualBox node[5868]: May 20 08:51:33.599 - external_block_validator: block validator process started with pid 5874 mai 20 08:51:43 baker-VirtualBox node[5868]: May 20 08:51:43.267 - node.store: the store is in an inconsistent state: mai 20 08:51:43 baker-VirtualBox node[5868]: May 20 08:51:43.267 - node.store: Error: mai 20 08:51:43 baker-VirtualBox node[5868]: May 20 08:51:43.267 - node.store: The block 'current_head' is unexpectedly missing from the store. mai 20 08:51:43 baker-VirtualBox node[5868]: May 20 08:51:43.267 - node.store: mai 20 08:51:43 baker-VirtualBox node[5868]: May 20 08:51:43.267 - node.store: attempting to restore the store's consistency... Any questions/comments/concerns? Please contact the Tez Capital team on Discord or Telegram"
