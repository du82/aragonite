["https://docs.tez.capital/getting-started/what-is-baking"]
title = "> What is Tezos Baking | docs.tez.capital"
description = "What is Tezos Baking?"
full_description = "Getting Started with Baking > What is Tezos Baking > What is Tezos Baking What is Tezos Baking? Fundamentally speaking, “Baking” on Tezos involves 2 things: The creation of blocks every 10 seconds as well as the attestation of the soundness of blocks produced by other bakers. Bakers put their tez at stake in order to be able to bake blocks and attest other bakers’ blocks. The tez put at stake by the bakers is used as deterrent against bakers acting maliciously. If a baker acts maliciously, they will lose their tez at stake. If a baker acts honestly, they will be rewarded with tez from the protocol. To act maliciously, a baker would have to create a block that is invalid or attest to a block that is invalid. Participating in the Tezos proposal governance process. A Tezos proposal is able to change anything about the Tezos protocol rules as well to fund any address with tez from the protocol. Any questions/comments/concerns? Please contact the Tez Capital team on Discord or Telegram"
