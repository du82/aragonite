["https://docs.tokens.studio/token-storage-and-sync/sync-multi-file-remote-storage-folder-pro"]
title = "Multi-file sync (pro) to remote Token Storage – Tokens Studio for Figma"
description = "Tokens Studio for Figma: Plugin Docs"
full_description = "Token Storage and SyncMulti-file sync (pro)Multi-file sync (pro) to remote Token Storage ✦Pro Feature The Multi-file sync to remote storage feature requires a Pro Licence for Tokens Studio. The Multi-file sync feature allows you to sync your Token data to your remote Token storage provider in multiple JSON files, which live within a folder. When you use the Themes (pro) feature in Tokens Studio and your engineers consume your Tokens from GitHub, the transformation process requires Tokens stored in multiple files. → Learn about the Themes (pro) feature in Tokens Studio here. Sync provider settings# To set up Multi-file sync, follow the steps in the guide for your Sync provider's Folder option of Token Storage Location. Azure DevOps Bitbucket GitHub Gitlab When our Tokens are stored in a folder Each Token Set created in the plugin is added to the folder as an individual JSON file. Additional data files generated by the plugin are also added to the folder. For example, Themes configuration. The following image shows the Github sync provider form with examples of the Token storage location as Folder and File paths. Your sync provider form may look different but the concept is the same. Sharing multi-file sync with teammates# The Multi-file sync feature requires a pro Tokens Studio licence, so what happens if other members of your team have a free licence? When they Pull in your Tokens saved in your remote storage in Multi-file sync, they will be limited to read-only access in the plugin. Teammates with pro licences for Tokens Studio will have the same collaborative access you establish with your sync provider. Read only for free licence holders# In read-only access to your Tokens, your teammates can: View Tokens and themes. Theme switch. Apply Tokens. Pull updates from your sync provider. They can not: Edit Tokens or themes. Push to your sync provider. Export styles or variables to Figma or update their values. This can be a great way to limit access to editing your Tokens and keep your team costs down. Resources# Community resources: None yet! 💡 Something to share? Submit it here! Known issues and bugs# Tokens Studio Plugin GitHub - Open issues for View Only Read Only None yet 🐞 If you are experiencing an issue not listed here, please reach out to us on the Troubleshooting channel of our community Slack, or submit it on our feedback tool. Requests, roadmap and changelog# None 💌 Visit https://feedback.Tokens.studio/ to contribute or subscribe to updates.URLRemove sync provider"
