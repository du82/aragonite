["https://docs.tokens.studio/token-types/token-type-font-weight"]
title = "Font Weight Token – Tokens Studio for Figma"
description = "Tokens Studio for Figma: Plugin Docs"
full_description = '''Token TypesFont Weight Font Weight Token Font Weight is not intended to be applied to text elements directly but as a part of a Typography Composite Token ✦Font Weight and Font Family Tokens work as a pair Figma's unique approach to Font Weight combines several text properties and requires an exact match to the Font Family it is paired with. This means you'll need to apply both Font Weight and Font Family Tokens at the same time to interact with Figma's text properties and see a visual change. Design decisions defined by Font Weight Tokens# Font Weight defines the thickness of each character/glyph in the Font Family. Font Weight design decisions are typically used to communicate visual hierarchy or emphasize text elements. In CSS this property is called font-weight. Font Weight in Figma is written differently for each Font Family. It also combines the font-style property. So, for one Font Family, you might see several Font Weights: bold bold-italic bold-wide bold-wide-italic In CSS, font-style and font-weight are defined as independent properties. Figma combines the Font Family property with its Font Weight and some styling properties, which differs from how they are defined in code. It's helpful to think of the Font Family and Font Weight Tokens as a pair and create/apply them together whenever possible. Font Weight Tokens can be attached to String or Number Variables in Figma. → Jump to the Export to Figma overview for more details on Font Weight Tokens as Variables Possible values# The value of a Font Weight Token must be identical to the text string value for Font weight (plus styling) in the Figma design panel due to limitations from Figma (plugin API). When writing your Font Weight Token values, pay close attention to: Spelling Spacing Punctuation Use of capital letters Hard-coded values# To ensure your Font Weight Token values are an exact match to what Figma has, you can: Carefully type it out, paying attention to the syntax in Figma. Save your Font Family and Font Weight pairs as text styles in Figma, then import them into the plugin to see how they appear. Select the value from the Tokens Studio menu (works for Typography composite Tokens only), pictured below. Numeric weights# Text Styles in Figma don't accept a numeric value for Font Weight, only a string value. Text Variables in Figma have limited support for numeric values for Font Weights. To work around this limitation, we've written a conversion into the plug-in, which allows the value of a Font Weight Token to be written in its numerical value, like 400 or 700, and the plugin translates it into a text string that Figma recognizes. You can enter any of these numeric raw values in the table below into the Font Weight Token, and the plugin will convert them to the corresponding resolved value for the Font Family Token they are paired with. Keep in mind that your chosen Font Families may not support all Font Weights. If you enter an incompatible value with your Font Family, the plugin will send an error message when you try to apply the Token or Export as Styles in Figma. Raw ValueResolved Value100Thin Hairline200Extra LightExtraLightUltra LightUltraLightextraleicht300Lightleicht400RegularNormalbuch500Mediumkraeftigkräftig600SemiboldSemiBoldSemi BoldDemiBoldDemi Boldhalbfett700Bolddreiviertelfett800ExtraBoldExtra BoldUltraBoldUltra Boldfett900BlackHeavyextrafett950Extra BlackUltra Black Recall that Figma combines the thickness of letters with other text styling properties, like the slant or posture of the glyphs/characters, to create their unique Font Weight property. This is written differently depending on the Font Family. For example, 600 from the chart above and italic style would appear in Figma's Font Weight property as Inter = Semi Bold Italic Source Sans Pro = SemiBold Italic SF Pro = Semibold Italic This doesn't match the way font weights, font families, and their styles typically work in code. It also means that if you use the numeric value, the plug-in cannot communicate any additional styling properties (like italics) that Figma combines. If your system uses italics or other styling properties that Figma has combined into its Font Family and Font Weight pairing, we suggest using the text string value instead of the numeric value. Values that reference another Token# When trying to reference another Token as the Value for a Font Weight Token, you will see Tokens living in Token Sets that are currently active. In the left menu on the plugin's Tokens page, a checkmark is visible next to the Token Set name. Token Type is compatible: The same = fontWeights number dimension However, like all token types, you can "force" a reference by manually entering the token name between curly brackets. ✦The value will show a broken reference until the originating token set is marked as enabled. → Jump to the Token Values with References guide for more details W3C DTCG Token Format# Font Weight is an official token type in the in the W3C Design Token Community Group specifications.(8.4 Font weight) It is mentioned as a required part of a typography token "The weight of the typography. The value of this property MUST be a valid font weight or a reference to a font weight token." - 9.7. Typography Tokens Studio has approached Font Weight Token differently than how they are defined in the current spec to support the unique way that Figma combines the Font Weight and additional styling properties. When you use Style Dictionary as a part of your design-to-code pipeline, these text string values will be transformed into numeric values which align with the W3C specification and how these properties work in CSS. Token Type syntax# The Font Weight Token has a unique syntax in code which identifies if the token is: An independent property Token Part of a Typography Composite Token Looking at the JSON format, the "type" is written in plural "fontWeights" when the Font Weight Token is defined as an independent property Token. This example shows a Font Weight property Token named font-weight-default with its value as a text string "bold". "font-weight-default": { "value": "Bold", "type": "fontWeights" } This is in contrast to the Typography Composite Token, which has the property "type" written in the singular "fontWeight". This example shows a Typography Composite Token with the Font Weight property Token named font-weight-default referenced as the value. { "paragraph-3": { "value": { "fontFamily": "{font-family-sans}", "fontWeight": "{font-weight-default}", "lineHeight": "{line-height-classic}", "fontSize": "{font-size-small}", "letterSpacing": "{letter-spacing-tight}", "paragraphSpacing": "{paragraphSpacing.none}" "paragraphIndent": "{paragraphIndent.none}" "textCase": "{textCase.none}", "textDecoration": "{textDecoration.none}" }, "type": "typography" } } Transforming Tokens# Engineers typically transform Tokens used in code with Style Dictionary, which is tool-agnostic. Tokens coming from Tokens Studio require an additional step: @Tokens-studio/sd-transforms, an npm package that prepares Tokens for Style Dictionary. When transforming Font Weight Tokens, there are specific configurations to be aware of. Recall that Figma combines the fontStyle and fontWeight properties into a single text string value. If this is true within your tokens, you'll want to look into the optional transform to add a separate fontStyle token to be included in the CSS shorthand. → SD-Transforms Read-Me Doc, alwaysAddFontStyle The preprocessor in the SD-Transforms package will automatically convert the Tokens Studio specific Token Type of fontWeights to align with the DTCG Format Token Type of fontWeight. → SD-Transforms Read-Me Doc, Using the preprocessor Font Weight Token entered as a text string that needs to be converted to its numeric value so it matches CSS. → SD-Transforms Read-Me Doc, Font Weight Font Weight as a part of Typography Composite Tokens require the SD-Transforms option to expand composite Tokens into multiple Tokens. Make sure you look at the generic SD-Transforms package to include this option, which allows you to further customize this transformation further using Style Dictionary. → SD-Transforms Read-Me Doc, Generic - expand composite Tokens ✦"object, object" When you transform your Typography Tokens, and they show "object, object" it means your SD-Transforms configuration needs to be adjusted to include "expand". Resources# Mentioned in this doc: SD-Transforms - Read Me Style Dictionary - https://styledictionary.com/ Design Tokens Community Group - W3C Draft Design Tokens Community Group - 9.7 Typography Design Tokens Community Group - 8.4 Font Weight Figma resources: Design in Figma - Explore Text Properties, Font Weight CSS resources: MDN Web Docs - font-weight MDN Web Docs - font-style Community resources: Font Weight + Font Family Pairs explained by Sam I am Designs It took me 2 years to figure out that Typography in Figma is not how text properties work in code. Import Typography Styles from Figma into Tokens Studio - Video Tutorial by Sam I am Designs 💡 Something to share? Submit it here! Known issues and bugs# Tokens Studio Plugin GitHub - Open issues for Token Type Font Weight None yet 🐞 If you are experiencing an issue not listed here, please reach out to us on the Troubleshooting channel of our community Slack, or submit it on our feedback tool. Requests, roadmap and changelog# None 💌 Visit https://feedback.tokens.studio/ to contribute or subscribe to updates.Last updated on February 24, 2025Font FamilyFont Fallbacks'''
