title = "Azure DevOps sync setup guide – Tokens Studio for Figma"
description = "Tokens Studio for Figma: Plugin Docs"
full_description = "Token Storage and SyncAzure DevOpsAzure DevOps sync setup guide Azure DevOps is a Microsoft-owned suite of development tools and services you can use to create a Git-based source code repository. You can use the Tokens Studio plugin native integration with Azure DevOps (ADO) to sync your Design Tokens to a repository of your choice. We support two-way sync, meaning you can use the plugin to: Push JSON files of Design Tokens to ADO Pull the Tokens stored in ADO into any Figma file This means the Design Tokens living in code are the source of truth for our design decisions, which can be shared between design and development teams. This doc outlines how to set up an ADO repository and add it as a Sync provider in the plugin. →Once set up, you can use the plugin's Push and Pull features to keep your Tokens in sync How it works# Set up a project, repository and personal access token in Azure DevOps Configure Azure DevOps as a sync provider within the Tokens Studio plugin. Use the plugin to sync your Design Tokens between Azure DevOps and Figma design files. Azure DevOps setup instructions# If you haven't already, sign up for an Azure DevOps account at Azure DevOps. 1. Creating a new project# Once you've logged in to your Azure DevOps (ADO) account, navigate to the new project page: Record your ADO Organization URL From the home page of ADO, copy the URL in your web browser window, including the https:// This URL is needed for the plugin configuration. Create a new project dedicated to storing and managing your Design Tokens. Choose a descriptive name for your project that is specific to its purpose and is memorable. Save the Project Name somewhere safe, as it's needed for plugin configuration. Project description is optional Select if you want your project to be: Public anyone can see it Private needs permission to view Your choice doesn't change the plugin's ability to sync with the repository Select Create You are now looking at your new project. Well done! A repo is automatically created in your new project with the same name. Now you'll need to add a README file to your repo as the plugin isn't able to sync to an empty repository. From the left side navigation, select the Files option (under Repos) Scroll to the section called Initialize main branch with a README or gitignore. Ensure Add a README is enabled. Select Initialize to confirm Now you can navigate to your Repo using the left side navigation. You should see a README file has been added in the repository The repo was given a name that matches the project by default, you can change it to something else if you'd like. Save a copy of the Repo name as you need it to configure the plugin later. 2. Generate a personal access token# Not to be confused with anything to do with Design Tokens, a Personal access token is a passcode from Azure DevOps you enter into the plugin that allows the connection to happen. Navigate to your Azure DevOps user settings. Locate the Personal Access Tokens section and Select new token. Add a Name of what the token is for. Example: test-token repo sync to tokens studio Select the Organization you recorded from above. Select an Expiration time frame Select the necessary scopes for this token to authorize: full access or custom defined is a choice made by you and your team Scroll down to the bottom and select Create token Save the generated access token somewhere safe as it's needed for the plugin configuration. You're ready to configure the Tokens Studio plugin in Figma! Plugin settings for Azure DevOps# In Figma, open the Tokens Studio plugin and navigate to the Settings page. Under the Sync Providers section, select the Add New button to see a list of all Token storage providers add Azure DevOps as a sync provider. Add credentials for Azure DevOps# Some of the inputs on the form come from the Azure DevOps steps above, others aren't so obvious as to where the info comes from. ADD ME 1. Organization URL# The URL of your Azure DevOps organization Example https://dev.azure.com/my_organization_name 2. Project Name# The Project name you saved from the steps above. Each ADO project could have many repositories, and you could have the same named repository in many ADO projects, so this credential helps the plugin point the Tokens to the correct location. Example: TokensTesting 3. Personal Access Token# The Personal access token you saved from the steps above. 4. Repository name# The name of the repository that matches the personal access token you entered. Example: test-tokens 5. Branch# Your engineers might tell you what to add as the default repository branch where you will be pushing your Tokens, so if you aren't sure, ask them. Example: main You can create additional branches using the plugin later. 6. Token storage location (file/folder path)# This tells the plugin: How to organize your Token JSON files in ADO. In a folder of multiple files, or a single file. The location of where your Token data is stored. The file or folder's pathway (or name) to sync with. This setting impacts How engineers can work with our Token files during the Token transformation stage of the design-to-development process. May limit edit access of Tokens for other team members using the Tokens Studio plugin. Folder# The folder option syncs Token data from the plugin into a folder that contains multiple JSON files or subfolders of JSON files. This multi-file sync option requires a Pro Tokens Studio licence. We suggest setting your Token storage as the folder option when possible. If you use the Theme feature in Tokens Studio and your engineers are consuming your Tokens from Azure Dev Ops, they require Tokens stored in a folder for the transformation process to work properly. → Learn about the Themes (pro) feature in Tokens Studio here. In the plugin, we enter the pathway of the folder where we want our Token data to be stored, which is the folder name without any extensions. For example: tokens Our Azure Dev Ops repository will have a folder called tokens synced to the Tokens Studio plugin in Figma. Each Token Set created in the plugin is added to the folder as an individual JSON file. Additional data files generated by the plugin are also added to the folder. For example, themes configuration. Recall that storing your Token data in a folder (multi-file sync) is a pro feature. If other team members are working with your Tokens and do not have a Pro Licence for Tokens Studio, your Tokens will be read-only for them. File Path# Setting our Token storage as the file option syncs our Token data from the plugin into a single JSON file in code. Combining Token data into a single file limits engineers' ability to work with Theme information when transforming Design Tokens. → Learn about the Themes (pro) feature in Tokens Studio here. File storage might work for you if: You are using the free version of Tokens Studio. Engineers are not using your Design Tokens in code. In the plugin, we enter the pathway of the JSON file where we want our Token sets to be stored, which is the file name with the .json extension. For example: tokens.json Our Gitlab repository will have a single code file called tokens.json synced to the Tokens Studio plugin in Figma. Each Token Set created in the plugin is combined into this single file in our repository. Save and do the initial sync# Once you Save your credentials, the plugin will compare your Tokens with what's in your repository. You'll see a modal asking you to push or pull to ADO to 'sync' the plugin data with your repository. → Read the Add New Sync Provider guide for more details. Shared source of truth# As you work in the plugin, push and pull indicators remind you to stay in sync with your Azure DevOps repository. → Read the Push and Pull to Sync Provider guide for more details. Once your Token JSON files are synced to your ADO repo, you have a shared source of truth between Designers and Engineers! Engineers typically transform Tokens used in code with Style Dictionary, which is tool-agnostic. Tokens coming from Tokens Studio require an additional step: @Tokens-studio/sd-transforms, an npm package that prepares Tokens for Style Dictionary. The various Token Types supported by Tokens Studio have unique transforms to be aware of. → Jump to the Token Type overview. Resources# Mentioned in this doc: Azure Dev Ops - https://azure.microsoft.com/en-us/products/devops/ SD-Transforms - Read Me Style Dictionary - https://styledictionary.com/ Community resources: None yet! 💡 Something to share? Submit it here! Known issues and bugs# Tokens Studio Plugin GitHub - Open issues for Sync ADO 🐞 If you are experiencing an issue not listed here, please reach out to us on the Troubleshooting channel of our community Slack, or submit it on our feedback tool. Requests, roadmap and changelog# 🧑‍💻 Sync to external token storage enhancements - Feature Request How might we improve the experience of working with sync providers in general? ↕️ Git sync enhancements - push, pull, merge, branching - Feature Request 🔐 Data security info request - Feature Request 💌 Visit https://feedback.tokens.studio/ to contribute or subscribe to updates.Edit a sync provider Bitbucket"
year_published = 2025
