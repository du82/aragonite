["https://docs.tokens.studio/token-storage-and-sync/sync-provider-local-document"]
title = "Local document Token storage – Tokens Studio for Figma"
description = "Tokens Studio for Figma: Plugin Docs"
full_description = "Token Storage and SyncLocal document Token storageLocal document Token storage By default, Tokens Studio will store your Design Tokens locally in the Figma file you are working in. This limits your ability to share your Tokens across multiple Figma files. A sync provider is required for a multi-file workflow in Figma. Once you have added one or more Sync Providers to Tokens Studio, you can temporarily store your tokens locally in the Figma file. Helpful for offline work, saving backups of your Figma files, or prepping a file to share with other people who won't have access to your sync provider. Steps in the plugin for Figma# Open the Tokens Studio plugin and navigate to the settings page. Navigate to the sync provider section. Select the local document option. A confirmation dialog appears asking you to confirm this change If you select cancel The modal will close, and your current sync provider settings will remain. If you select yes Tokens currently in the plugin will be stored in the current Figma file The push and pull actions from the bottom of the plugin won't be available. Changes made to tokens will remain in the current Figma and can't be shared in other Figma files. Your Tokens are now being stored locally# The Local document option will show as active on the plugin's settings page. You can switch back to using a Sync provider at anytime. → Read the Select Sync Provider guide Resources# Community resources: None yet! 💡 Something to share? Submit it here! Known issues and bugs# Tokens Studio Plugin GitHub - Open issues for Sync Local Storage Resources# Community resources: None yet 💡 Something to share? Submit it here! Known issues and bugs# Tokens Studio Plugin GitHub - Open issues for Sync Providers Manage None yet 🐞 If you are experiencing an issue not listed here, please reach out to us on the Troubleshooting channel of our community Slack, or submit it on our feedback tool. Requests, roadmap and changelog# None 💌 Visit https://feedback.tokens.studio/ to contribute or subscribe to updates.) None yet 🐞 If you are experiencing an issue not listed here, please reach out to us on the Troubleshooting channel of our community Slack, or submit it on our feedback tool. Requests, roadmap and changelog# None 💌 Visit https://feedback.tokens.studio/ to contribute or subscribe to updates.Sync your Design Tokens with codeAdd new sync provider"
