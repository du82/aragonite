full_description = '''ContributingContributingContributing If you want to get started contributing to Tokens Studio for Figma read this short guideline that should get you started. Run npm ci to install dependencies. Run npm run start to start webpack in watch mode or npm run build to build once. Open Figma -> Plugins -> Development -> New Plugin... and choose manifest.json file from this repo. Create a Pull request for your branch Known issues# Cannot read property document of undefined# This error can be solved by clearing Figma's cache. To do that follow the steps outlined in this document. Mac Use the Terminal app to clear the cache. Quit the Figma desktop app. Open the Terminal.app and enter the following command: rm -rf "$HOME/Library/Application Support/Figma/"{Desktop,DesktopProfile} Try opening the Figma desktop app again. Dev modeBeta builds'''
