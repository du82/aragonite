title = "Billing Overview - Travis CI"
description = "Billing Overview"
full_description = "Improve this page on GitHub Billing Overview Travis CI Plan Types Key Definitions Concurrency-based Plans Usage-based Plans VM Instance Sizes and Credit Cost GPU VM Instance Sizes and Credit Cost for GPU builds Contact Support Travis CI Plan Types # Travis CI billing system consists of two types of subscriptions: Concurrency (fixed-price) based plans and Usage-based plans. The variety of plans allows you to choose the plan that suits your needs. Usage-based Concurrency based (fixed-price) Credits Used for every build job. Allowance is included in the price and can be auto-refilled or purchased on demand. Used only for Premium VMs; standard jobs are included in the price and free of additional charge. It may be purchased on demand. Users Unlimited / per-user charge. Unlimited / incl. in price Network transfer Unlimited / incl. in price Unlimited / incl. in price Cache storage Unlimited / incl. in price Unlimited / incl. in price Concurrent Jobs Very high, adjustable for valid cases on request as per plan limitation Linux IBM/ARM build environments Available, see more details Available, see more details Premium VM build environment Available, paid in credits. For ‘PremiumVM as default build environment’ contact Travis CI Customer Success Available, paid in credits. For ‘PremiumVM as default build environment’ contact Travis CI Customer Success Subscription Yes, monthly or annual. Yes, monthly or annual. Usage-based billing only Yes, it is a custom option. Please see more details on usage-based plans Not available For most users, a basic usage-based or single concurrency-based plan should be sufficient. However, if you build a lot of minutes per month and concurrency becomes a bottleneck, please consider a Usage-based plan or contact Travis CI for more customized options or high-volume plans. Free Trial Plan # A free ‘Trial’ Plan, which any new user can select upon sign up, is a usage-based plan with an unlimited amount of users, which comes with a pool of 10k trial credits (1k Linux build minutes) to start building right away. Once these credits run out, they are not replenished, and users must subscribe to a higher plan to continue building. Request OSS Credits allowance, or please consider one of our available plans. Trial credits are valid only for 14 days. Due to security reasons and an anti-abuse preventive measure, any new user will be asked to provide valid credit card details while selecting the Free Trial Plan. Then, we will trigger an authorization transaction for $1.00 on the user’s card, which will be released back to the card owner after a few days. This action is meant only to validate legitimate users. Existing users are not affected by this procedure. The Free Trial Plan is available only once and for new users only Key Definitions # Build minute - every build minute of a build job after the build job environment is started (queue time and spinning up the environment time are not deducting credits from the allowance). Unique user triggering the build - every VCS (Version Control System) user whose activity in VCS triggers a build in Travis CI via, e.g., commit or pull request in the source repository. It does not have to be a user who signed up for Travis CI; therefore, it’s important to review and adjust Travis CI Repository settings in which VCS scenarios and users are allowed to trigger the build in Travis CI. The count of unique users triggering builds is tracked and reset every month, regardless of whether the Usage-based plan is marked as monthly or annual. The same unique user-triggering builds within a month consumes a user-license allowance only once in a given month. Build - a build consists of at least 1 and up to n build jobs. Each build is triggered by a unique user. Build job—a build job is where the build and test work happens. It is executed in an ephemeral environment (removed after a single build job is finished) of a container or VM instance at Travis CI infrastructure. The duration of the build job is tracked, and—if required—the relevant cost is covered from the credits pool. Concurrency-based Plans # Concurrency-based plans are similar to what Travis CI has been offering for a long time: the ability to run a build consisting of X concurrent jobs. Concurrency-based Plan Summary # Area Details Payment The subscription is charged automatically in advance at the beginning of each billing period. The optional credits for macOS builds can be purchased anytime and only used when you need them. The charge is applied immediately upon transaction. The subscription price doesn’t depend on the number of unique users running builds. Private/Public repositories You can build over both private and public repositories with a paid subscription. Build job limits As per Plan Concurrency-based Plan Summary # In Travis CI, builds are executed singularly, without exceeding limitations. Therefore, if executing multiple builds simultaneously or executing a build with multiple build jobs, once the concurrency limit is reached, the reminder builds/jobs must wait until a queue capacity is available for processing. If a user on the 2 concurrent jobs plan executes a build with 5 build jobs, only the first 2 build jobs are processed while the remaining 3 of the build jobs wait in line to be processed. If a user/organization subscribes to the 5 concurrent jobs plan and executes 2 builds consisting of 5 jobs each, by default the second build will be sitting in the queue and its jobs waiting to be executed after at least 1 of the 5 build jobs of the first build are done. The price of these plans includes Linux, Windows, and FreeBSD builds. The macOS builds are paid separately on concurrency plans and can be run after purchasing the separate credits add-on. Credits are used to pay for each build job minute on macOS. Purchase only the credits you need and use them until you run out. Please see more in the ‘Usage based’ section. If a user/organization on the 2 concurrent jobs Plan executes build with jobs for os: linux and os: freebsd it will execute as soon as the concurrency capacity is available for particular build jobs. If a user/organization on the same Plan tries to execute a job for os: macOS and has no credits available (see your Plans), this build will not execute. In order to proceed, an add-on must be purchased, e.g., 25k credits. Now the build can be executed, and a pre-defined amount of credits will be charged for each build minute of macOS build job. Subscribe to a Concurrency-based Plan # Sign in to Travis CI with the Version Control System of your choice. Navigate to the Plan tab and select ‘X concurrent jobs Plan’. Enter your billing details. Please note that all prices are provided netto, w/o any VAT or other applicable local taxes. If you are EU based VAT paying company, do not forget to enter your VAT number. Confirm the transaction. Usage-based Plans # If you are running a large number of builds or users each month, please contact Travis CI Customer Success if you’d like to discuss your plan. The Usage-based pricing system charges Travis CI users and Travis CI organizations depending on the number of minutes each builds jobs run on Travis CI infrastructure and unique users triggering builds. Usage-based Plan Summary # Area Details Payment Credits are paid in advance:1. Upon purchasing a Plan, an immediate charge is applied depending on the credits allotment coming with a Plan.2. The additional credit add-ons, if available, can be purchased anytime, and credits are only used when needed. The charge is applied immediately upon transaction.The user license cost exceeding the pool included in the price is either covered using credits (Usage-based Plan with subscription) at the build request or charged automatically in arrears at the end of each billing period (Usage-based Plan w/o subscription). The number of unique users triggering a build is tracked and reset monthly.The Free Trial assigned upon sign-up grants you unlimited users for free. Private/Public repositories With Credits, you can build over both private and public repositories. With OSS Credits, you can build only over public repositories. Build job limits Very high. The Free Plan assigned automatically upon sign-up has a limit of 20 concurrent jobs. The paid usage-based plans start from a 40 concurrent jobs limit. Usage-based Plans Credit Costs # User license cost: by default, credits per each unique user triggering a build or a specific rate charged in arrears at the end of the month. See the Usage - user licenses section for more details. Build job duration costs: For more details, see Usage—Credits. Additional resources (usually extra CPU/RAM) are available as Premium VMs on demand at a certain credit cost. See VM Instance Sizes and Credit Cost for more details. For specific Linux build job environments, GPU builds are available on demand at a specific credit cost. See GPU VM Instance Sizes and Credit Cost for GPU builds for more details. Usage-based with subscription Usage based w/o subscription Users 25 000 credits per userA VCS user triggering build consumes a user license, and such a license is not included in the price or pre-purchased user license package A VCS user triggering build consumes a user license and such a license is not included in the price or pre-purchased user license package. Consumed licenses are charged in arrears at the end of the month as per plan rates or are capped by the allowed number of user licenses. 1 Users incl. in plan price no additional charge no additional charge Users ‘X in the price of 1’ package e.g., 25 000 credits charge upon 1st user triggering build, 0 credits for subsequent users up to the limit of pre-purchased licenses no additional charges and users up to the limit of pre-purchased licenses are covered by the package price, package cost may be charged upfront or in arrears after summarizing user license consumption in a month Build Job: Partner Queues (IBM) 0 credits for Open Source / standard Linux rate for rest 0 credits for Open Source / standard Linux rate for rest Build Job: Standard Linux/FreeBSD 10 credits / minute 10 credits / minute Build Job: Standard Windows 20 credits / minute 20 credits / minute Build Job: macOS - legacy Intel 50 credits / minute 50 credits / minute Build Job: Linux - large VM size 20 credits / min 20 credits / min Build Job: Linux - x-large VM size 40 credits / min 40 credits / min Build Job: Linux - 2x-large VM size 80 credits / min 80 credits / min Build Job: Linux - gpu-medium VM size 230 credits / min 230 credits / min Build Job: Linux - gpu-xlarge VM size 890 credits / min 890 credits / min Subscribe to a Usage-based Plan # Sign in to Travis CI with a Version Control System of your choice. Navigate to the Plans and have your billing and contact details filled in correctly. Select an available Usage-based Plan or contact Travis CI support requesting a Usage-based Plan for larger options. How it works # Usage-based pricing is a model using credits. It may include a user-license allowance and credit pool. Usage-based pricing features very high concurrent build jobs soft limits. In other words, users and organizations can run as many build jobs in Travis CI as they want simultaneously, meaning that all builds are executed as soon as possible. The final cost is flexible and closely related to the actual usage of the system, allowing you to downscale or upscale as per your needs. All credit charges are deducted from a credit pool associated with a Usage-based plan assigned to the Travis CI User or Organization, which is an ‘owner’ of a VCS repository enabled in Travis CI. All unique user triggering build counting is tracked against a Usage-based plan assigned to the Travis CI User or Organization, which is an ‘owner’ of a VCS repository enabled in Travis CI. The Usage-based pricing model bills based on minutes used (via credits) and the number of unique users triggering those builds (via user licenses). Users subscribe to a plan that allocates a pool of credits to be used towards build minutes and pricing for a specific number of user licenses. The credits are deducted from the user’s credit balance as they are used in the Travis CI service. Unique users triggering builds within a billing period will constitute a number of actual user licenses used out of allowed pool. If the user-license pool is exceeded by new unique user triggering build, credits for this extra usage will be deducted from available credit pool. In custom cases, instead of charge in credits, user licenses will be tracked within month and will be charged at the end of the billing period, according to the rates of their selected plan. Plan Usage # Once the Usage-based plan is assigned to the Travis CI user or Travis CI Organization, which ‘owns’ repositories enabled at Travis CI, there will be a credits allowance present. Credits are immediately granted upon: The usage-based subscription´s payment (auto-billing) manual purchase of a credits package auto-refilling credits (see Auto-refill feature feature description) Usage-based plan may come with pre-purchased user-license allowance (expressed as number of users) and credits pool (expressed as number of credits). Every unique user triggering build within a month is consuming one user-license. Please see Usage - user licenses section for more details. Every build job started on standard infrastructure is consuming credits. The exact cost rate depends on the type of build job and its duration. See Usage - Credits, VM Instance Sizes and Credit Cost, and GPU VM Instance Sizes and Credit Cost for GPU builds for more details. Triggering builds is only possible if a user has a positive credit balance. To get more credits, users can use the Auto-refill feature or change to a higher credits plan. If the user has credits after the plan´s renewal, these usually carry over to the new plan. For more information about your plan and validity dates, see the Plan page. Monthly Usage-based Plans # Monthly Usage-based plans are subscriptions, granting a specific credit pool each month and (optionally) user-license allowance included in the price. Once these allowances are depleted, the credits may be refilled via the manual purchase of a credits package or auto-refilled and spent on builds and additional user-licenes. Consumed user-license count is reset each month. If not stated or set otherwise, the Monthly Usage-based plan is renewed automatically. Select a Plan # Subscribe to one of our monthly plans to get your credits and continue building. Once you select a plan, your credits and your bill will be available at the start of the following month. Cancel a Monthly Subscription # Users can cancel their current subscription anytime they like; simply use the Cancel Subscription button on the Plan page. Press the Cancel button to notify support of your desire to cancel your plan, and the Travis Support team will contact you soon with details regarding yo"
