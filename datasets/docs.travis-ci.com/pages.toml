["https://docs.travis-ci.com/user/apps"]
title = "Apps, Clients, and Tools - Travis CI"
description = "Apps, Clients, and Tools"
full_description = "Improve this page on GitHub Apps, Clients, and Tools Full Web Clients Dashboards Tools Android Mobile Applications iOS Mobile Applications Windows Mobile Applications Desktop macOS Linux Cross Platform Command Line Tools - Full Clients Command Line Tools - Build Monitoring Command Line Tools - Generators Google Chrome Plugins Opera Plugins Editor Plugins Other Plugins Libraries There is a wide range of tools you can use to interact with Travis CI: Websites: Full Web Clients, Dashboards, Tools Mobile Applications: Android, iOS, Windows Phone Desktop: macOS, Linux, Cross Platform Command Line Tools: Full Clients, Build Monitoring, Generators Plugins: Google Chrome, Opera, Editors, Other Libraries: Ruby, JavaScript, PHP, Python, Elixir, R, Go And if you don’t find anything that fits your needs, you can also interact with our API directly. However, Travis CI cannot take any responsibility for third-party tools you might use. Full Web Clients # This section shows the full web client apps that are available. Travis CI Web Client # Our official web interface, written in Ember.js travis-ci.com source code Dashboards # This section shows the different available dashboard apps. TravisLight # Online build monitoring tool By William Durand website source code Team Dashboard # Visualize your team’s metrics all in one place By Frederik Dietz website source code CI Status # Travis CI dashboard By Piwik. source code node-build-monitor # Simple and extensible Build Monitor written in Node.js By Marcell Spies website source code CI Dashboard # Travis CI builds dashboard By Ahmed El-Sayed source code buildmonitor.io # Extensible and plugin-based build monitor. By CyanCor website source code Meercode CI Build Dashboard # Meercode is the ultimate monitoring dashboard for your CI/CD builds. By Meercode.io website BuildPulse Flaky Test Dashboard # Automatically detect, track, and rank flaky tests. By Workshop 64 website Tools # This section shows available tools. Travi