title = "Unity - Manual: Unity 6 User Manual"
full_description = "Unity Manual Version: Unity 6Select a different version Language : English English 中文 日本語 한국어 Unity 6 User Manual Unity 6 User Manual Documentation versions Unity 6 User Manual Unity 6 is the long-term supported (previously known as LTS) release of the next generation of the Unity Engine. It combines the latest technologies and tools to deliver high-quality, high-performance experiences for all supported platforms. Unity 6 contains all features, updates, and improvements made in Unity 2023.1 Tech stream, Unity 2023.2 Tech stream, and Unity 6 Preview. New in Unity 6 Upgrade to Unity 6 Unity 2023.3 is now Unity 6 Preview Highlights of Unity 6 These are some main highlights of Unity 6. Boost rendering performance Elevate your scenesA Scene contains the environments and menus of your game. Think of each unique Scene file as a unique level. In each Scene, you place your environments, obstacles, and decorations, essentially designing and building your game in pieces. More infoSee in Glossary with scalable, captivating visuals using the latest advances in rendering, lighting, and visual effects. Multiplayer game creation Simplify multiplayer game creation with Unity’s multiplayer packages and services Expand multiplatform reach Build better experiences for mobile platforms, including a newly optimized runtime for mobile browsers, and get the latest multiplatform advances for all supported platforms. Unlock possibilities with Runtime AI Unlock new possibilities with Runtime AI powered by Sentis, and create dynamic experiences across all Unity-supported platforms. Achieve more engaging visuals Create more engaging visuals with the latest updates to Lighting, Graphics performance and profiling, Shader Graph, and Visual Effect Graph. Enhance productivity and functionality Improve productivity and functionality across your entire Unity development environment with better profiling options, ProBuilder, Cinemachine, and UI Toolkit. Featured content Featured content of the Unity User Manual. Animation Unity’s Animation system for creating complex character animation with animation curvesAllows you to add data to an imported clip so you can animate the timings of other items based on the state of an animator. For example, for a game set in icy conditions, you could use an extra animation curve to control the emission rate of a particle system to show the player’s condensing breath in the cold air. More infoSee in Glossary and blending. Audio Audio in the Unity Editor, including clips, sources, listeners, importing and sound settings. 2D game development Unity Editor’s 2D-specific features including gameplay, spritesA 2D graphic objects. If you are used to working in 3D, Sprites are essentially just standard textures but there are special techniques for combining and managing sprite textures for efficiency and convenience during development. More infoSee in Glossary, and physics. Lighting Set up realistic or stylized lighting to apply for a range of art styles. Multiplayer Multiplayer game development with Unity’s multiplayer packages and services. Physics Simulation of 3D motion, mass, gravity and collisionsA collision occurs when the physics engine detects that the colliders of two GameObjects make contact or overlap, when at least one has a Rigidbody component and is in motion. More infoSee in Glossary. Platform development Information about the platforms that you can build your application for. Rendering Choose a render pipelineA series of operations that take the contents of a Scene, and displays them on a screen. Unity lets you choose from pre-built render pipelines, or write your own. More infoSee in Glossary and add your own rendering and post-processingA process that improves product visuals by applying filters and effects before the image appears on screen. You can use post-processing effects to simulate physical camera and film properties, for example Bloom and Depth of Field. More info post processing, postprocessing, postprocessSee in Glossary. Scripting Program your games by using scripting in the Unity Editor. UI User interface toolkits available in the Unity Editor. Unity services Unity services such as Monetization and Cloud Services, Ads, Cloud Build, and Multiplayer. Visual effects Add and customize particle, lens flareA component that simulates the effect of lights refracting inside a camera lens. Use a Lens Flare to represent very bright lights or add atmosphere to your scene. More infoSee in Glossary, and full-screen effects. XR Develop augmented, mixed, and virtual realityVirtual Reality (VR) immerses users in an artificial 3D world of realistic images and sounds, using a headset and motion tracking. More infoSee in Glossary experiences with the Unity Editor. Additional resources Best practice guides - Best practices from Unity Support engineers. Unity Discussions - A community-driven place where you can search for frequently asked questions and answers. The Unity Knowledge Base - A collection of answers to questions posed to Unity’s Support teams. Tutorials - Step-by-step video and written guides to using the Unity Editor. Asset Store help - Help on Asset StoreA growing library of free and commercial assets created by Unity and members of the community. Offers a wide variety of assets, from textures, models and animations to whole project examples, tutorials and Editor extensions. More infoSee in Glossary content sharing. Unity 6 User Manual Documentation versions Copyright ©2005-2025 Unity Technologies. All rights reserved. Built from 6000.0.42f1 (8467f7a9ab85). Built on: 2025-03-01. TutorialsCommunity AnswersKnowledge BaseForumsAsset StoreTerms of useLegalPrivacy PolicyCookiesDo Not Sell or Share My Personal InformationYour Privacy Choices (Cookie Settings)"
