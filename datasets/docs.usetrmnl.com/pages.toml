["https://docs.usetrmnl.com/go/diy/byod"]
title = "BYOD | TRMNL API"
description = "Bring your own device to TRMNL."
full_description = '''DIY TRMNL (Advanced)BYODBring your own device to TRMNL.Before diving into "how," it's worth mentioning that the investment required to build your own device will be greater than our retail price. Making your own TRMNL from scratch is not an economically rational decision, but rather a labor of love. Our own team learned this the hard fun way while building v1 over 7 months, from Dec 2023 to July 2024.Here's what you can expect to spend per component:Battery, $5 (unnecessary if you prefer plugged in)EPD screen, $65 (see the Waveshare 7.5" on Amazon)Microcontroller, $3-50 (depends if you build/solder yourself or leverage a PCB prototyper)Enclosure/case, $3-20 (design + 3D print yourself or use a print farm)If you know what you're doing and just need some firmware or a server client, here ya go:FW: https://github.com/usetrmnl/firmwareServer (Ruby/Sinatra): https://github.com/usetrmnl/byos_sinatraServer (Elixir/Phoenix): https://github.com/usetrmnl/byos_phoenixServer (Python/Django): https://github.com/usetrmnl/byos_djangoWhen you're ready to build plugins:Buy access to the TRMNL web app + API: https://shop.usetrmnl.com/products/byodActivate a virtual device: https://usetrmnl.com/claim-a-devicePlug your TRMNL API key into your DIY device firmwareStay focusedEmail team@usetrmnl.com if you have any questions.Hardware requirements(Coming Soon)PreviousIntroductionNextBYOD/SLast updated 10 days ago'''
