title = "Getting Started | TRMNL API"
description = "Become a TRMNL Partner."
full_description = '''Partners APIGetting StartedBecome a TRMNL Partner.The TRMNL team manually approves each Partner, which involves the following:basic KYC to ensure our intentions align (customer delight, not bulk discounts)program negotiation (net-30 vs on-demand payment terms, optional quotas, etc)testing the Partner's custom plugin end-to-endKYC includes determining a Partner point of contact, getting some sense of weekly / monthly device provision volume, and possibly a small deposit.Program negotiation is simple and might look like this: "Partner wants to award their customers a TRMNL device for 50% off. Partner can generate TRMNL discount codes for 50% off and will pay TRMNL monthly via invoice for the remaining 50%, less a 10% bulk discount."Testing entails the Partner providing TRMNL a demo user account on the Partner platform, with instructions to set up their custom plugin manually on an existing TRMNL account.PreviousIntroductionNextProvisioning DevicesLast updated 2 months ago'''
