full_description = 'Plugin MarketplacePlugin Installation FlowOAuth installation flow between TRMNL and your web server.PreviousPlugin CreationNextPlugin Management FlowLast updated 2 days ago When the user installs your plugin, TRMNL sends an installation request to installation_url with unique token and installation_callback_url. After receiving the request, Your server using the client_id, client_secret and token from step#1 request the access_token from TRMNL using the following endpoint: After the user has successfully finished installing the plugin, TRMNL sends a success notification to installation_success_webhook_url endpoint. Data is sent in JSON format as follows. Time zone mappings are available here under "Constants:" https://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html The plugin_setting_idis useful for building a redirect URI in your own application, for example to send a user back to usetrmnl.com/plugin_settings/:plugin_setting_id/edit.'
