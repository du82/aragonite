["https://docs.usetrmnl.com/go/how-it-works"]
title = "How it Works | TRMNL API"
description = "Overview of the TRMNL architecture."
full_description = '''How it WorksOverview of the TRMNL architecture.PreviousOverviewNextScreen TemplatingLast updated 7 months ago The TRMNL web server hosts a growing directory of native plugins and API endpoints + templating engine for custom plugins, managed directly by customers. Learn to build a custom plugin here. The TRMNL device is a custom PCB featuring an ESP32-C3 microcontroller, 1800-2500 mAh battery, and 7.5" EPD screen housed in injection-molded ABS soft touch plastic. Customers may disassemble their device, mod their firmware, and retrieve their API keys (or pay a small one-time fee to unlock the Developer add-on) without impacting our Terms of Service. TRMNL firmware supports automatic OTA (over the air) updates to WiFi-connected devices and is open source. Here's how it works: TRMNL web server generates a single-use, 1-bit, bitmap image (800x480 pixels). Response JSON includes a link to this image and timing instructions for the next "refresh" request. * "Displayable content" is the most recently created screen, in order of priority according to the Playlists interface. "N" is a value in minutes, configurable by customers from the Devices > Edit web interface. Most IoT products support SSH-ing directly into peripheral devices. We've heard too many horror stories about how this can go wrong, and decided to invert the paradigm. Each request made to our /api/display endpoint includes only the minimum details needed to support customers -- an API key, device mac address, firmware version, battery voltage, and wifi signal strength. We do not collect any footprint of your location or identity, such as IP address or WiFi configuration. The SSID and password for your local network are stored only on your TRMNL device. When the TRMNL web server responds to a device's request we include only a few fields. These include "update_firmware" (true/false), a direct download link to the firmware's [public] binary package, and whether the device should be reset. Customers may reset their device to transfer ownership or safely destroy data from their web account.'''
year_published = 2025
clearnet = "https://docs.usetrmnl.com/go/how-it-works"
