["https://docs.usetrmnl.com/go/diy/byod-s"]
title = "BYOD/S | TRMNL API"
description = "Bring your own device, and build your own server for the device to ping."
full_description = '''DIY TRMNL (Advanced)BYOD/SBring your own device, and build your own server for the device to ping.In the BYOD/S model, the only TRMNL IP is our open source firmware. Technically we don't owe you any explanation to get up and running, but we'll do it anyway. ;)Device setupSee our BYOD guide for instructions to build a device that's compatible with our firmware.Server quickstartThe TRMNL web server generates bitmap images. When a device pings our web server, the next-in-queue image is shared as an absolute URL inside a JSON response like this:Copy{ "image_url"=>"https://trmnl.s3.us-east-2.amazonaws.com/path-to-img.bmp" }You can demo this process from the command line by installing ImageMagick, then invoking convert:Copyconvert regular_img.png -depth 1 eink_compatible.bmpWith this in mind, building your own server simply necessitates creating an endpoint that responds with links to firmware-compatible Bitmap images.Assuming you've set up a device, simply...change the base URL to your own server or local network from the WiFi Captive Portalmimic the api/setup and api/display endpoints to respond per the firmware readmeprofitOther infrastructureIn the quickstarter above we glossed over a critical element: "next-in-queue" images.At TRMNL we use a Playlists table to manage the ordering of plugin instances, so that users can drag/drop different screen content in any sequence they like.Each item in a device's Playlist is an instance* of a Plugin, something we call a PluginSetting.This keeps our Plugins table immutable, for example our Google Calendar record contains just name, icon, etc. But details about an actual connection to Google Calendar are stored inside a PluginSetting record. Keep this in mind as you build your own server -- do you want to allow multiple connections to the same parent plugin?TRMNL also supports PlaylistGroups. These are parent objects to playlists, and they simply act as buckets to which playlist items should be rendered on a device during any given time period.This is another feature to consider building on your own implementation, but does not need to be considered at the device or firmware level.PreviousBYODNextBYOSLast updated 17 days ago'''
year_published = 2025
