full_description = "Partners APIIntroductionProvision devices and pre-load plugins for your customers.If you're a company with a custom plugin, TRMNL makes it easy to reward customers with free or discounted devices that arrive pre-connected to your platform.Example scenario:Acme SaaS has a subscriber dashboard for their email newsletter tool. Acme builds a custom plugin inside TRMNL to showcase this information.Acme wants to gift a free TRMNL device to their top customers. Acme creates coupon codes with the TRMNL Partners API that their customer can use at checkout for X% off their order.When Acme's customer device is shipped, it is associated to their account on Acme's platform. Upon unboxing + WiFi pairing, Acme's customer will see their Acme native dashboard on TRMNL device without any additional setup.Continue reading to learn how this works with just a single API request, or email partners@usetrmnl.com to get started.PreviousFetch Screen ContentNextGetting StartedLast updated 2 months ago"
