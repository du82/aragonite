["https://docs.volta.sh/advanced/uninstall"]
title = "Uninstalling Volta | Volta"
description = "Uninstalling Volta"
full_description = "Uninstalling Volta If Volta isn’t meeting your needs and you’d like to uninstall it, we’re sorry to see you go! We would greatly appreciate any feedback you may have about what was missing from your experience so that we can improve Volta in the future. We can be reached on Twitter, Discord, or GitHub. Unix Uninstallation There are two steps needed to completely uninstall Volta on Unix systems: Remove the entire ~/.volta directory rm -rf ~/.volta Edit your shell profile scripts to remove the two lines that mention Volta. The profile scripts Volta locates by default are: .bashrc .bash_profile .zshrc .zshenv config.fish .profile NOTE You may need to open a new terminal after making this change, as many shells cache the location of recent commands Windows Uninstallation On Windows, Volta can be uninstalled by selecting it in the list at Start > Settings > Apps and choosing Uninstall. ← Workspaces pnpm Support →"
