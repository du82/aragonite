["https://docs.volta.sh/advanced/pnpm"]
title = "pnpm Support | Volta"
description = "pnpm Support"
full_description = "pnpm Support Support for pnpm is currently experimental. To enable it, ensure that the environment variable VOLTA_FEATURE_PNPM is set to 1. On Windows, this can be added to your user or system environment variables in the System Settings. On Linux/Mac, you can set the value inside of your profile script (e.g. .bash_profile, .zshrc, or similar). As this support is experimental, there may be some outstanding issues. Some of the known limitations are listed below, however if you run into anything while using pnpm with Volta that doesn’t work the way you would expect, please open an issue on our GitHub. Known Limitations Global Installations Currently, global installations (e.g. pnpm install -g) are not supported and will result in an error. Migrating There is no automatic migration at the moment, so if you previously had pnpm installed as a Volta global, you will need to manually re-install it by calling volta install pnpm. Before enabling the support and doing the re-install, you may uninstall the previously installed pnpm package via volta uninstall pnpm. Once you switch to the native pnpm support, you may not remove the isolated old pnpm package by calling the same command because lack of uninstall implementation as of now. ← Uninstalling Volta Contributing Guide →"
