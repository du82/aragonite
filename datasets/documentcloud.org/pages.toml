["https://www.documentcloud.org/help/api"]
title = "API Documentation | DocumentCloud"
full_description = '''The DocumentCloud API All APIs besides the authentication endpoints are served from https://api.www.documentcloud.org/api. If you develop in Python, check out python-documentcloud which is our Python wrapper for the DocumentCloud API and its corresponding documentation. Overview The API end points are generally organized as /api/<resource>/ representing the entirety of the resource, and /api/<resource>/<id>/ representing a single resource identified by its ID. All REST actions are not available on every endpoint, and some resources may have additional endpoints, but the following are how HTTP verbs generally map to REST operations: /api/<resource>/ HTTP Verb REST Operation Parameters GET List the resources May support parameters for filtering POST Create a new resource Must supply all required fields, and may supply all non-read only fields /api/<resource>/<id>/ HTTP Verb REST Operation Parameters GET Display the resource PUT Update the resource Same as for creating - all required fields must be present. For updating resources PATCH is usually preferred, as it allows you to only update the fields needed. PUT support is included for completeness PATCH Partially update the resource Same as for creating, but all fields are optional DELETE Destroy the resources A select few of the resources support some bulk operations on the /api/<resource>/ route: HTTP Verb REST Operation Parameters POST Bulk create A list of objects, where each object is what you would POST for a single object PUT Bulk update A list of objects, where each object is what you would PUT for a single object — except it must also include the ID PATCH Bulk partial update A list of objects, where each object is what you would PATCH for a single object — except it must also include the ID DELETE Bulk destroy Bulk destroys will have a filtering parameter, often required, to specify which resources to delete Responses Lists response will be of the form { "next": <next url if applicable>, "previous": <previous url if applicable>, "results": <list of results> } with a 200 status code. The document search route will also include a count key, with a total count of all documents returned by the search. Getting a single resource, creating and updating will return just the object. Create uses a 201 status code and get and update will return 200. Delete will have an empty response with a 204 status code. Batch updates will contain a list of objects updated with a 200 status code. Specifying invalid parameters will generally return a 400 error code with a JSON object with a single "error" key, whose value will be an error message. Specifying an ID that does not exist or that you do not have access to view will return status 404. Trying to create or update a resource you do not have permission to will return status 403. Pagination All list views accept a per_page parameter, which specifies how many resources to list per page. It is 25 by default and may be set up to 100 for authenticated users. For anonymous users it is restricted to 25. You may register for a free account at https://accounts.muckrock.com/ to use the 100 limit. You may view subsequent pages by using the next URL. Cursor Based Pagination Page offset pagination does not scale well to a large number of pages. For improved performance, DocumentCloud uses a cursor based pagination system. Instead of a page parameter, there is a cursor parameter, which accepts an opaque cursor which specifies the last value seen. To use this system, you must use the next and previous links as returned by the API, as random access is not available. This system also restricts arbitrary ordering of the results, except for the document search route, which will still allow re-ordering with cursor based pagination. If the cursor based pagination breaks your workflow, you may continue to use the old page-offset based pagination system for now. In the future, this will be disabled completely, and you will be forced to use the cursor based pagination. To use the page-offset based pagination, which also has a top level count key with a total count of the objects returned for all list queries, add a version=1.0 query parameter to your API queries. Be aware that this will make your queries less performant, possibly to the point of them being unusable. This should only be used as a stop-gap solution while you update your workflow to use the new cursor based pagination. Please reach out to info@documentcloud.org if you need assistance moving to the new version. Sub Resources Some resources also support sub resources, which is a resource that belongs to another. The general format is: /api/<resource>/<id>/<subresource>/ or /api/<resource>/<id>/<subresource>/<subresource_id>/ It generally works the same as a resource, except scoped to the parent resource. TODO: Examples Filters Filters on list views which have choices generally allow you to specify multiple values, and will filter on all resources that match at least one choices. To specify multiple parameters you may either supply a comma separated list of IDs — ?parameter=1,2 — or by specify the parameter multiple times — ?parameter=1&parameter=2. Rate Limits The DocumentCloud API is rate limited to 10 requests per second. It also allows bursts up to 20 requests. This means if you exceed the the 10 request per second limit, it will serve you up to 20 requests more quickly, while keeping track of your average rate. After the 20 requests are served, additional requests will be rejected with an HTTP status of 503 until you again fall under an average of 10 requests per second. If you use the Python DocumentCloud library, it will automatically throttle your requests to 10 per second to avoid going over the rate limit. If you are writing custom code, please be mindful of the rate limits. There is also a secondary limit of 500 requests per day for anonymous users. If you exceed this limit, you will start receiving errors with an HTTP status of 429. In order to avoid this, please register for a free account at https://aacounts.muckrock.com/. Currently, there are no daily limits of registered accounts, although this may change in the future. Authentication Authentication happens at the MuckRock accounts server located at https://accounts.muckrock.com/. The API provided there will supply you with a JWT access token and refresh token in exchange for your username and password. The access token should be placed in the Authorization header preceded by Bearer - {'Authorization': 'Bearer <access token>'}. The access token is valid for 5 minutes, after which you will receive a 403 forbidden error if you continue trying to use it. At this point you may use the refresh token to obtain a new access token and refresh token. The refresh token is valid for one day. POST /api/token/ Param Type Description username String Your username password String Your password Response {'access': <access token>, 'refresh': <refresh token>} POST /api/refresh/ Param Type Description refresh String Refresh token Response {'access': <access token>, 'refresh': <refresh token>} Documents The documents API allows you to upload, browse and edit documents. To add or remove documents from a project, please see project documents. Fields Field Type Options Description ID Integer Read Only The ID for the document access String Default: private The access level for the document asset_url String Read Only The base URL to load this document's static assets from canonical_url URL Read Only The canonical URL to view this document created_at Date Time Read Only Time stamp when this document was created data JSON Not Required Custom metadata description String Not Required A brief description of the document edit_access Bool Read Only Does the current user have edit access to this document file_hash String Read Only A sha1 hash representation of the raw PDF data as a hexadecimal string. file_url URL Create Only A URL to a publicly accessible document for the URL Upload Flow force_ocr Bool Create Only Force OCR even if the PDF contains embedded text - only include if file_url is set, otherwise should set force_ocr on the call to the processing endpoint. This operation clears underlying metadata about the document like authorship, creation date, etc. If this is a concern, make sure to keep a copy of the original document. language String Default: eng The language the document is in noindex Bool Not required Ask search engines and DocumentCloud search to not index this document ocr_engine string Not required Specifies which OCR engine to use on documents. Use with force_ocr set to True. Accepted values: tess4 for tesseract and textract for Amazon textract (which requires AI credits). organization Integer Read Only The ID for the organization this document belongs to original_extension String Default: pdf The original file extension of the document you are seeking to upload. It must be a supported file type page_count Integer Read Only The number of pages in this document page_spec Integer Read Only The dimensions for all pages in the document pages JSON Write Only Allows you to set page text via the API. See set page text for more information. presigned_url URL Read Only The pre-signed URL to directly PUT the PDF file to projects List:Integer Create Only The IDs of the projects this document belongs to - this may be set on creation, but may not be updated. See project documents publish_at Date Time Not Required A timestamp when to automatically make this document public published_url URL Not Required The URL where this document is embedded related_article URL Not Required The URL for the article about this document revision_control Boolean Not Required Turns revision control on for this document - requires a premium account remaining JSON Read Only The number of pages left for text and image processing - only included if remaining is included as a GET parameter slug String Read Only The slug is a URL safe version of the title source String Not Required The source who produced the document status String Read Only The status for the document title String Required The document's title updated_at Date Time Read Only Time stamp when the document was last updated user Integer Read Only The ID for the user this document belongs to Expandable fields: user, organization, projects, sections, notes, revisions Uploading a Document There are two supported ways to upload documents — directly uploading the file to our storage servers or by providing a URL to a publicly available PDF or other supported file type. To upload another supported file type you will need to include the original_extension field documented above. Direct File Upload Flow POST /api/documents/ To initiate an upload, you will first create the document. You may specify all writable document fields (besides file_url). The response will contain all the fields for the document, with two being of note for this flow: presigned_url and id. If you would like to upload files in bulk, you may POST a list of JSON objects to /api/documents/ instead of a single object. The response will contain a list of document objects. PUT <presigned_url> Next, you will PUT the binary data for the file to the given presigned_url. The presigned URL is valid for 5 minutes. You may obtain a new URL by issuing a GET request to /api/documents/\<id\>/. If you are bulk uploading, you will still need to issue a single PUT to the corresponding presigned_url for each file. POST /api/documents/<id>/process/ Finally, you will begin processing of the document. Note that this endpoint accepts only one optional parameter — force_ocr which, if set to true, will OCR the document even if it contains embedded text. If you are uploading in bulk you can issue a single POST to /api/document/process/ which will begin processing in bulk. You should pass a list of objects containing the document IDs of the documents you would like to being processing. You may optionally specify force_ocr for each document. URL Upload Flow POST /api/documents/ If you set file_url to a URL pointing to a publicly accessible PDF, our servers will fetch the PDF and begin processing it automatically. You may also send a list of document objects with file_url set to bulk upload files using this flow. Endpoints GET /api/documents/ — List documents POST /api/documents/ — Create document PUT /api/documents/ — Bulk update documents PATCH /api/documents/ — Bulk partial update documents DELETE /api/documents/ — Bulk delete documents Bulk delete will not allow you to indiscriminately delete all of your documents. You must specify which document IDs you want to delete using the id__in filter. POST /api/documents/process/ — Bulk process documents This will allow you to process multiple documents with a single API call. Expect parameters: [{"id": 1, "force_ocr": true}, {"id": 2}] It expects a list of objects, where each object contains the ID of the document to process, and an optional boolean, force_ocr, which will OCR the document even if it contains embedded text if set to true GET /api/documents/search/ — Search documents GET /api/documents/<id>/ — Get document PUT /api/documents/<id>/ — Update document PATCH /api/documents/<id>/ — Partial update document DELETE /api/documents/<id>/ — Delete document POST /api/documents/<id>/process/ — Process document This will process a document. It is used after uploading the file in the direct file upload flow or to reprocess a document, which you may want to do in the case of an error. It accepts one optional boolean parameter, force_ocr, which will OCR the document even if it contains embedded text if it is set to true. Note that it is an error to try to process a document that is already processing. DELETE /api/documents/<id>/process/ — Cancel processing document This will cancel the processing of a document. Note that it is an error to try to cancel the processing if the document is not processing. GET /api/documents/<id>/search/ — Search within a document Filters ordering — Sort the results — valid options include: created_at, page_count, title, and source. You may prefix any valid option with - to sort it in reverse order. user — Filter by the ID of the owner of the document. organization — Filter by the ID of the organization of the document. project — Filter by the ID of a project the document is in. access — Filter by the access level. status — Filter by status. created_at__lt, created_at__gt — Filter by documents created either before or after a given date. You may specify both to find documents created between two dates. This may be a date or date time, in the following formats: YYYY-MM-DD or YYYY-MM-DD+HH:MM:SS. page_count, page_count__lt, page_count__gt — Filter by documents with a specified number of pages, or more or less pages then a given amount. id__in — Filter by specific document IDs, passed in as comma separated values. Notes Notes can be left on documents for yourself, or to be shared with other users. They '''
