["https://www.documentcloud.org/help/premium"]
title = "DocumentCloud Premium | DocumentCloud"
full_description = "Back to Help Menu DocumentCloud Premium Features DocumentCloud premium features are available to both paid professional and organizational accounts on MuckRock. DocumentCloud Premium gives you the ability to search annotations across DocumentCloud. Wondering what document you left an important note on to review later? With annotation search, it takes no time to find important notes. Premium accounts also come with AI credits that you can put towards more powerful OCR or other tools. Professional accounts also include 2,000 AI credits per month and organizational accounts come with 5,000 credits per month for the first 5 users, and 500 additional credits for each additional user. If you’re on a premium account and have used all of your available credits, you can contact us to purchase additional credits. AI Credits can be used to run: Amazon Textract, a powerful OCR (optical character recognition) engine. OCR is the process of converting an image of text into a machine-readable text that you can copy, paste, search and edit. By default, DocumentCloud will OCR your documents with Tesseract, which does a decent job, but it isn't nearly as powerful as Textract, especially on noisy documents. Handwriting, embedded images, fuzzy scans, and other non-machine generated text are all hard to convert into text. Amazon Textract OCR performs significantly better than Tesseract on noisy documents. Amazon Textract uses 1 AI credit per page. Textract Table Extractor Extract tables from your documents using Amazon Textract. This Add-On uses 10 AI credits per page. GPT-3.5 Turbo PlayGround Use GPT 3.5 Turbo to help analyze your documents, right within DocumentCloud. Give this Add-On a prompt as well as an optional key for a key/value pair to add information as a tag. GPT-4 Vision Add-On Extract tables from your documents using GPT-4 Vision. This Add-On uses 7 AI credits per page. Azure Document Intelligence OCR uses Azure's Document Intelligence system to OCR documents. Azure uses 1 AI credit per page. Azure Table Extractor Extract tables from your documents using Azure Document Intelligence's Form Analyzer. This Add-On uses 7 AI credits per page. Google Cloud Vision OCR uses Google Cloud Vision OCR engine to OCR documents. GCV uses 1 AI credit per page. Translate Documents allows you to use the Google Translate API to translate documents page by page. To see if a language is supported, visit the Google Translate language code guide. 1 AI credit translates 75 characters of text. That's not all! We're still building. Our DocumentCloud Add-Ons 101 workshop is a great way to learn more about our Add-On ecosystem. Checking your AI Credit Balance & Usage To check your AI credit balance, you can: Click on the name of your organization in the top navigation bar and your monthly allowance will appear there. If you are a freelancer with a professional account, you click on the second drop-down menu (next to your account name) and your balance should appear there as well. Click on a premium Add-On from the Add-On run menu. Your allowance will appear in the run menu. When uploading a document, your AI credit balance also appears as text in the upload menu where you can select which OCR engine you want to use. AI Credit usage is logged. If you want to know how your AI credits were used, contact us."
year_published = 2025
clearnet = "https://www.documentcloud.org/help/premium"
