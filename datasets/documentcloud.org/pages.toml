["https://www.documentcloud.org/help/faq"]
title = "Frequently Asked Questions | DocumentCloud"
full_description = '''Back to Help Menu Frequently Asked Questions General What is DocumentCloud? DocumentCloud is a web-based software platform for organizing, researching, annotating, analyzing, and publishing primary source documents. We offer a set of tools that help you find and tell stories in your documents. How much does it cost? Thanks to generous funding from the Knight Foundation, DocumentCloud since its launch in 2010 has been offered for free exclusively to verified journalism organizations. We are currently developing a paid model to ensure the DocumentCloud platform’s sustainability. Who can have accounts? Anyone may have a DocumentCloud/MuckRock account to view documents, but if you are seeking to upload documents, you need to request account verification. Where can I get help? You can find answers to most questions you have either in this FAQ, one of our other help pages or on our YouTube channel. If you can’t find the answer or if you’re having trouble using DocumentCloud, please email us at info@documentcloud.org Where can I read your Terms of Service? The current Terms of Service for DocumentCloud and MuckRock are viewable on MuckRock's TOS page. Privacy What is DocumentCloud’s privacy policy? Please read our complete Privacy Policy for details. Who can see documents in my account? By default, any document you upload is set to “private” access and is viewable only by you. If you set the access level to “private to [your organization name],” then other DocumentCloud users in your organization can view the document, but not the public. If you set it to "public", then all users whether registered with a DocumentCloud account or not may view your documents. Is metadata about uploaded files preserved? If you are uploading a PDF, then yes, by default the metadata such as authorship, creation date, etc for the document is preserved. However, if you select to perform OCR on the document by selecting "Force OCR" or you redact the document, the document's underlying metadata will be wiped. If this is a concern to you, you may want to keep an original copy of the document(s). You can do so using the PDF Exporter Add-On or downloading documents individually. Files that are not PDFs are converted into PDFs using LibreOffice and therefore do not preserve metadata by default. Accounts Do I have to use my real name for my account? Yes, the DocumentCloud Terms of Service require that accounts use real names and valid email addresses. However, we allow organizations to create one shared account for posting documents and another shared account for use with automation technology or our API. These accounts should have an appropriate name, such as “[Organization name] Documents.” How do I get an account? Sign up for an account at the plan selection plan. To begin uploading documents to DocumentCloud, however, you must request account verification. Can I have more than one account with the same email? No, you cannot have more than one account with the same email. You can have one account with multiple emails and you can have one account that belongs to multiple organizations, however one organization will be the default. We recommend one individual has one account with all of their emails and organizations associated with that singular account. How do I log in and log out? To log in, on the DocumentCloud home page, enter your account email address and password in the login box. To log out, click the “Log Out” link at the top right of the workspace. Note: Always log out when you’re done working if you’re logged in on a shared computer. How do I reset my password? If you’ve forgotten your password, go to our password reset page. If you are not receiving your password reset link, please check your Spam folder. If you are still having trouble resetting your password, email us at info@documentcloud.org and we will send you the password reset link. How do I change my email address associated with my account? To change your email address, visit our e-mail update page I lost access to the email tied to my DocumentCloud account and no longer have the password to login. What can I do? Email us at info@documentcloud.org and let us know the email associated with the DocumentCloud account. We can change the email tied to your DocumentCloud account for you and then you may proceed to reset the password accordingly. Can I delete my account? Accounts cannot be deleted, but they can be disabled by another user within your organization who has administrator-level privileges. We (and the public) value the documents you uploaded and made public and are glad to continue to host them. Organizations How does DocumentCloud organize accounts? Currently, we create accounts under the umbrella of an organization. That is, each user account is tied to at least one organization. This allows, for example, users within that organization to collaborate privately on documents. How do I remove users from my organization? If you're an administrator for the organization, you can manage members by going to the main account management page and clicking on the organization name you want to change. Then, click "Manage Members". What happens to documents uploaded by an individual user when that user leaves an organization? Generally speaking, the organization won't lose access to documents it currently has access to, but the exact changes depend on the published status of the documents. If a user uploaded documents privately (so only they have access to them currently), they and only they will continue to have access to them. If someone uploaded documents and set them to shared them with the organization but they're not fully public, the original uploading users will retain access to those documents, but the rest of the organization will as well and the rest of the organization has the ability to edit, including changing the owner of the documents via the "Edit" menu. If someone uploaded documents and they're made public, the organization has complete control and any user that has left the organization will no longer be able to make "edit" changes to the document, such as changing its status, redacting, adding public notes or re-arranging pages. These changes impact permissions granted via organizational status. Permissions granted because a user is a part of a project folder will still remain active. How do I add users to my organization? If you're an administrator for the organization, the easiest way to add additional users is to send the users the following instructions: Register for a free MuckRock account. Click “Request to Join” from the organization page, which should look something like this: https://accounts.muckrock.com/organizations/daily-bugle/ Note: Some organizations run into a temporary limit of five users — to raise this limit, click “Upgrade,” leave the plan on free, and put in a larger number of users, and then click “Update.” You can still have an unlimited number of users with a free account, and we’re working on improving the flow of adding users in a future update. How can I get accounts for others in my organization? Anyone in your organization who has a DocumentCloud account with administrator privileges can send invite links to add users to a DocumentCloud/MuckRock organization. Check around your organization- if you are not sure who has administrator privileges or the admin has since left the organization, please email us at info@documentcloud.org for additional support. How many user accounts can an organization have under its account? Currently, there is no limit. What happens if my organization closes? Please notify DocumentCloud by email at info@documentcloud.org if your organization is closing, changing its name or experiencing another significant change. We value the documents uploaded and made public by our contributors and ask that you do not delete them. We will be glad to work with you on a transition plan. If the current holder of the documents is not a part of the new organization, you may have to do two transfers where the documents are transferred from User A from Organization A -> User B who is part of Organization A & B -> User C who is a member of Organization B. What happens to my documents if my organization closes? Documents that are owned by an organization can be downloaded locally using the PDF Exporter Add-On that is enabled by default. Organizational administrators may opt to have the ownership of documents be transferred to users within the organization by selecting the documents, clicking "Edit" and then "Change Owner" or using the "Move Account" Add-On to transfer documents to another user or organization. Note: The Move Account Add-On requires that the account transferring the documents over to a new organization must be a member of that organization. What happens to my DocumentCloud account if my organization closes? You retain your DocumentCloud account and can change the email address associated with the account to that of another organization or your personal email address. What happens to my documents and account if I leave my current organization? You are able at any time to download the original documents you uploaded to our service. You may use the PDF Exporter Add-On, which is enabled by default, to download documents locally. Generally, we defer to each organization regarding disposition of the documents you uploaded to DocumentCloud while in their employment. Every organization has its own rules governing ownership of material generated while in their employment or service. Our organization is changing its name. How do we change our name on MuckRock/DocumentCloud? Please email us at info@documentcloud.org and we would be more than happy to change your organization's name in our system. Our organization is being purchased by a larger organization or merged with another team. How do we transfer the ownership of our documents over to the new team? You may transfer documents in batches of 25 at a time by selecting the documents, clicking on "Edit" -> "Change Owner" and selecting the new organization's name as well as a user in that organization to transfer the documents to. You may also use the "Move Account" Add-On to transfer large sets of documents over to the other organization. Note: The Move Account Add-On requires that the account transferring the documents over to a new organization must be a member of that organization. If the current holder of the documents is not a part of the new organization, you may have to do two transfers where the documents are transferred from User A from Organization A -> User B who is part of Organization A & B -> User C who is a member of Organization B. Verification How do I verify my account? If you are part of an organization, you should first check that your organization does not already exist as an entity on MuckRock & DocumentCloud. If you do find your organization, you can click "Request to join" from the left sidebar of the organization or contact an administrator to add you directly. Members of organizations that have already been verified do not need to independently be verified. If your organization does not exist on MuckRock & DocumentCloud services already, you can create an organization. If you are an established freelancer, you can skip searching for your organization or creating an organization on MuckRock and DocumentCloud entirely. If you are a freelancer or part of a new organization that needs verification, you can find the "Request Verification to Upload" button to the right of the Upload button when you log into DocumentCloud. If you have joined a verified organization, you won't see this button as you do not need to be verified individually as a member of a verified organization. DocumentCloud Premium What is DocumentCloud Premium? DocumentCloud premium features are available to both paid professional and organizational accounts on MuckRock. DocumentCloud premium features include access to AI credits to perform advanced analysis on documents, access to Amazon's Textract OCR engine, and a growing feature list. For a full feature list, read more at the DocumentCloud Premium page. Paid professional and organizational accounts on MuckRock also gain access to monthly request credits on MuckRock, the ability to embargo requests, and bulk purchasing rates. Upgrading your account is done by visiting the plan selection page. Search See our in-depth guide to searching DocumentCloud for more detailed support. What can I find in the public catalog? We feature more than a million documents provided by contributors ranging from The New York Times to The Guardian and hundreds of large and small news organizations, freelance journalists and others who report using public documents. Do I need an account to search the public catalog? No, you do not. We are proud to provide a valuable public resource at no cost. Will getting a DocumentCloud account allow me to see more documents? No, whether you have an account or not, the only documents available for viewing are those explicitly shared by the users who upload them. The only exception is if you get added to a DocumentCloud/MuckRock organization that has documents set with permissions "private to your organization" - then you will get access to those documents as well. How can I search documents? Using the search bar in the workspace, type the text you’d like to find in documents or search by attributes including Title, User, Project, Organization, Access, and more. Learn more in our documentation on searching Can I contribute documents to your public catalog? To start contributing, register for an account. You will need to go through account verification to being uploading documents. Uploading What kinds of file types can I upload? The most common file type our users upload is PDF, but DocumentCloud can also convert over 70 file types into PDFs. This includes Word documents, Excel spreadsheets, PowerPoint presentations, HTML and image files. We cannot process video, audio or closed-format files such as Outlook PST files. Is there a limit on the size of a file I can upload? Yes, 500 MB is the largest file you can upload. If your file is larger than 500MB, you can try to use the PDF Compression DocumentCloud Add-On to compress the document before upload. If it is still too large, you will need to split the document up into smaller files. Are there restrictions on the content of documents I can upload? DocumentCloud is intended to be a repository of public documents. Our Terms of Service prohibits uploading copyrighted material that is not yours. How long does it take to process a document? Processing times will vary depending on the size of the file and whether or not it needs to be OCR'd. Small documents are usually processed in a minute or less; larger documents or large sets of documents might take slightly longer. What does DocumentCloud do with the documents I upload? When you upload a document, we save the original file'''
year_published = 2025
clearnet = "https://www.documentcloud.org/help/faq"
