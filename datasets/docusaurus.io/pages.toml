title = "📦 plugin-svgr | Docusaurus"
description = "An SVGR plugin to transform SVG files into React components automatically at build time."
full_description = "Plugins📦 plugin-svgrVersion: 3.7.0On this page📦 plugin-svgr An SVGR plugin to transform SVG files into React components automatically at build time. Installation​ npmYarnpnpmnpm install --save @docusaurus/plugin-svgryarn add @docusaurus/plugin-svgrpnpm add @docusaurus/plugin-svgr tipIf you use the preset @docusaurus/preset-classic, you don't need to install this plugin as a dependency.You can configure this plugin through the preset options. Configuration​ Accepted fields: NameTypeDefaultDescriptionsvgrConfigobject{}The SVGR config options, forwarded as is Example configuration​ You can configure this plugin through plugin options. Preset optionsPlugin optionsIf you use a preset, configure this plugin through the preset options:docusaurus.config.jsmodule.exports = { presets: [ [ '@docusaurus/preset-classic', { svgr: { svgrConfig: { /* SVGR config */ }, }, }, ], ],};If you are using a standalone plugin, provide options directly to the plugin:docusaurus.config.jsmodule.exports = { plugins: [ [ '@docusaurus/plugin-svgr', { svgrConfig: { /* SVGR config */ }, }, ], ],};Edit this pageLast updated on Jan 3, 2025 by Sébastien Lorber"
