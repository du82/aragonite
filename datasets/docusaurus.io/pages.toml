full_description = "Happy 1st Birthday Slash!December 14, 2018 · One min readJoel MarceyCo-creator of Docusaurus Docusaurus went live on December 14, 2017. At the time, we had 8 early adopters. We now have nearly 60 known users of Docusaurus, and probably more that we don't know about. We have 9K GitHub stars and an active community, particularly Yangshun Tay and Endilie Yacop Sucipto, both of whom are the lead maintainers helping keep this project moving forward. Thank you to everyone for your support and use of this project! I am super proud of how far this project has come in just a year. Special thanks to Eric Nakagawa, creator of Slash, for creating this 1-year image of Slash enjoying cake. The Slash brand has been a boon for us! Tags:BirthEdit this pageLast updated on Sep 19, 2024 by Sébastien Lorber"
