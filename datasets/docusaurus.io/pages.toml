full_description = '''🎉 Docusaurus 3.7 is out!️ 🥳Crie sites otimizados rapidamente, foque no seu conteúdoIniciarTry a DemoPowered by MDXEconomize tempo e foco em documentos de texto. Escreva documentação e posts de blogde forma simples com MDX e o Docusaurus transformará-los em HTML estático prontos para servir. Você pode até mesmo incorporar componentes React em seu Markdown graças ao MDX.Construído Usando ReactEstenda e personalize o layout do seu projeto escrevendo componentes React. Aproveite a arquitetura plugável e crie seu próprio site reutilizando os mesmos dados criados por plugins do Docusaurus.Pronto para TraduçõesA localização vem out-of-the-box. Use git, Crowdin ou qualquer outro gerente de tradução para traduzir a sua documentação e implantá-la individualmente.Versionamento de DocumentosApoie os usuários em todas as versões do seu projeto. O versionamento de documentação ajuda você a manter a documentação sincronizada com as versões do projeto.Pesquisa de ConteúdoFacilite para sua comunidade encontrar o que precisa na sua documentação. Nós orgulhosamente suportamos o sistema Algolia de pesquisa de documentação.Confira no vídeo de introduçãoAmado por muitos engenheirosMark Erikson@acemarkeWe've been using Docusaurus for all the Redux org docs sites for the last couple years, and it's great! We've been able to focus on content, customize some presentation and features, and It Just Works.Oct 26, 2021Supabase@supabaseWe've been using V2 since January and it has been great - we spend less time building documentation and more time building 🛳Thanks @docusaurus team 🦖Nov 18, 2020Dr.Electron@Dr_ElectronThe #IOTA wiki is now part of the @docusaurus showcase. We even have the honor of being a favorite. We are really happy that we found this project. It helped us a lot to improve the documentation. And we still have a lot of plans with things like tutorials, versioning and i18n.Oct 11, 2021Maël@arcanisI've used Docusaurus for two websites this year, and I've been very happy about the v2. Looks good, and simple to setup.Jan 20, 2021Paul Armstrong@paularmstrongContinue to be impressed and excited about Docusaurus v2 alpha releases. Already using the sidebar items generator to help monorepo workspace devs create their own doc pages without any configuration needed.Apr 27, 2021Kent C. Dodds@kentcdoddshttps://testing-library.com just got a nice update! We're now on the latest version of @docusaurus thanks to @matanbobi, @TensorNo, and @nickemccurdy 💙My favorite new feature: dark mode!! 🌑/☀️Nov 4, 2020Max Lynch@maxlynchDocusaurus v2 doubles as a really nice little static site generator tool for content-focused sites, love it 👏Mar 25, 2021Debbie O'Brien@debs_obrienBeen doing a lot of work with @docusaurus lately and I have to say it is really fun to work with. A lot of really cool features. I love that you can easily reuse content by creating a markdown file and importing it as a component. 🔥Mar 24, 2021swyx@swyxHappy to share Temporal's first open source sponsorship — of @docusaurus!@temporalio uses it for https://docs.temporal.io, and it has been a huge boon to our docs team. @sebastienlorber is an incredible steward of the project, support it if you can!Jul 23, 2021<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/pt-BR/assets/ideal-img/christopher-chedeau.a975949.200.jpg srcset="/pt-BR/assets/ideal-img/christopher-chedeau.a975949.200.jpg 200w" alt='Christopher "vjeux" Chedeau' width=200 height=200>Christopher "vjeux" ChedeauDesenvolvedor Líder do PrettierEu ajudei na criação de muitos projetos open source no Facebook e cada um deles precisava de um site. Todos tinham as mesmas restrições: a documentação deveria ser escrita em markdown e ser implementada através das páginas do GitHub. Estou muito feliz que o Docusaurus agora exista, assim eu não preciso passar uma semana fazendo isso toda vez.<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/pt-BR/assets/ideal-img/hector-ramos.957d17a.200.jpg srcset="/pt-BR/assets/ideal-img/hector-ramos.957d17a.200.jpg 200w" alt="Hector Ramos" width=200 height=200>Hector RamosDefensor Líder de React NativeContribuições de código aberto para a documentação do React Native dispararam após nossa mudança para o Docusaurus. A documentação agora está hospedada em um pequeno repositório em markdown simples, sem nenhuma da bagunça que um típico gerador de site estático exigiria. Obrigado Slash!<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/pt-BR/assets/ideal-img/ricky-vetter.b237586.200.jpg srcset="/pt-BR/assets/ideal-img/ricky-vetter.b237586.200.jpg 200w" alt="Ricky Vetter" width=200 height=200>Ricky VetterDesenvolvedor ReasonReactO Docusaurus tem sido uma ótima escolha para a família ReasonML de projetos. Ele torna a nossa documentação coerente, i18n-amigável, fácil de manter e amigável para novos colaboradores.'''
