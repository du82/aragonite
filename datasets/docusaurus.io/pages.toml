title = "Construisez rapidement des sites web optimisés, concentrez-vous sur votre contenu | Docusaurus"
description = "An optimized site generator in React. Docusaurus helps you to move fast and write content. Build documentation websites, blogs, marketing pages, and more."
full_description = '''🎉 Docusaurus 3.7 est sorti !️ 🥳Construisez rapidement des sites web optimisés, concentrez-vous sur votre contenuDémarrezEssayer une démoPropulsé par MDXGagnez du temps et concentrez-vous sur les documents texte. Il suffit de rédiger des documents et des articles de blog avec MDX, et Docusaurus les transforme en fichiers HTML statiques prêts à être servis. Vous pouvez même intégrer des composants React dans votre Markdown grâce à MDX.Construit avec ReactÉtendez et personnalisez la mise en page de votre projet en écrivant des composants React. Tirez parti de l'architecture pluggable, et concevez votre propre site tout en réutilisant les mêmes données créées par les plugins Docusaurus.Prêt pour les traductionsLa localisation est prête à l'emploi. Utilisez git, Crowdin, ou tout autre gestionnaire de traduction pour traduire vos docs et les déployer individuellement.Versionnage des documentsAidez les utilisateurs sur toutes les versions de votre projet. Le versionnage de documents vous aide à garder la documentation synchronisée avec les versions du projet.Recherche de contenuFaites en sorte que votre communauté trouve facilement la bonne information. Nous sommes fiers de supporter la recherche de documentation d'Algolia.Découvrez-le dans la vidéo d'introductionAimé par de nombreux ingénieursMark Erikson@acemarkeWe've been using Docusaurus for all the Redux org docs sites for the last couple years, and it's great! We've been able to focus on content, customize some presentation and features, and It Just Works.Oct 26, 2021Supabase@supabaseWe've been using V2 since January and it has been great - we spend less time building documentation and more time building 🛳Thanks @docusaurus team 🦖Nov 18, 2020Dr.Electron@Dr_ElectronThe #IOTA wiki is now part of the @docusaurus showcase. We even have the honor of being a favorite. We are really happy that we found this project. It helped us a lot to improve the documentation. And we still have a lot of plans with things like tutorials, versioning and i18n.Oct 11, 2021Maël@arcanisI've used Docusaurus for two websites this year, and I've been very happy about the v2. Looks good, and simple to setup.Jan 20, 2021Paul Armstrong@paularmstrongContinue to be impressed and excited about Docusaurus v2 alpha releases. Already using the sidebar items generator to help monorepo workspace devs create their own doc pages without any configuration needed.Apr 27, 2021Kent C. Dodds@kentcdoddshttps://testing-library.com just got a nice update! We're now on the latest version of @docusaurus thanks to @matanbobi, @TensorNo, and @nickemccurdy 💙My favorite new feature: dark mode!! 🌑/☀️Nov 4, 2020Max Lynch@maxlynchDocusaurus v2 doubles as a really nice little static site generator tool for content-focused sites, love it 👏Mar 25, 2021Debbie O'Brien@debs_obrienBeen doing a lot of work with @docusaurus lately and I have to say it is really fun to work with. A lot of really cool features. I love that you can easily reuse content by creating a markdown file and importing it as a component. 🔥Mar 24, 2021swyx@swyxHappy to share Temporal's first open source sponsorship — of @docusaurus!@temporalio uses it for https://docs.temporal.io, and it has been a huge boon to our docs team. @sebastienlorber is an incredible steward of the project, support it if you can!Jul 23, 2021<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/fr/assets/ideal-img/christopher-chedeau.a975949.200.jpg srcset="/fr/assets/ideal-img/christopher-chedeau.a975949.200.jpg 200w" alt='Christopher "vjeux" Chedeau' width=200 height=200>Christopher "vjeux" ChedeauDéveloppeur principalJ'ai aidé à open-sourcer de nombreux projets chez Facebook et chacun avait besoin d'un site Web. Ils avaient tous des contraintes très similaires : la documentation devrait être écrite en markdown et être déployée via les pages GitHub. Je suis content que Docusaurus existe, pour que je n’aie pas à perdre une semaine à chaque fois que je créé un nouveau projet.<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/fr/assets/ideal-img/hector-ramos.957d17a.200.jpg srcset="/fr/assets/ideal-img/hector-ramos.957d17a.200.jpg 200w" alt="Hector Ramos" width=200 height=200>Hector RamosResponsable de la promotion de React NativeLes contributions Open Source sur la documentation React Native ont explosé après notre passage sur Docusaurus. La doc est maintenant hébergée sur un petit dépôt en markdown, sans avoir besoin de s'occuper d'un générateur de site statique. Merci Slash !<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/fr/assets/ideal-img/ricky-vetter.b237586.200.jpg srcset="/fr/assets/ideal-img/ricky-vetter.b237586.200.jpg 200w" alt="Ricky Vetter" width=200 height=200>Ricky VetterDéveloppeur ReasonReactDocusaurus a été un excellent choix pour la famille de projets ReasonML. Il rend notre documentation cohérente, facile à entretenir et à traduire, et conviviale pour les nouveaux contributeurs.'''
