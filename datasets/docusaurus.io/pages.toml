title = "Tribute to Endi | Docusaurus"
description = "It is with great sadness to announce that our primary external Docusaurus contributor, Endilie Yacop Sucipto (Endi to those who knew him), passed away over the weekend after an illness associated with his bout with cancer."
full_description = "Tribute to EndiJanuary 7, 2020 · One min readJoel MarceyDeveloper Advocate at MetaIt is with great sadness to announce that our primary external Docusaurus contributor, Endilie Yacop Sucipto (Endi to those who knew him), passed away over the weekend after an illness associated with his bout with cancer. It is impossible to overstate Endi's impact on this project: Docusaurus' top contributor, by far. Lead developer on the nearly complete version 2 of Docusaurus. Overall passionate advocate of the project on X, Discord and other social media Thinking about it now, it is absolutely amazing how much Endi accomplished on Docusaurus given what he was battling with his health. We are working on ways to honor Endi's contributions - a commemorative sticker, possibly - and we are open to ideas. Leave a comment here or tweet if you have a suggestion. The Docusaurus project will not be the same without Endi, and those of us who worked with him will miss him greatly. 😔 Tags:EndiTributeEdit this pageLast updated on Sep 19, 2024 by Sébastien Lorber"
