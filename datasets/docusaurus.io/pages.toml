title = "Support | Docusaurus"
description = "Docusaurus has a community of thousands of developers."
full_description = "SupportOn this pageSupport Docusaurus has a community of thousands of developers. On this page we've listed some Docusaurus-related communities that you can be a part of; see the other pages in this section for additional online and in-person learning materials. Before participating in Docusaurus' communities, please read our Code of Conduct. We have adopted the Contributor Covenant and we expect that all community members adhere to the guidelines within. Stack Overflow​ Stack Overflow is a popular forum to ask code-level questions or if you're stuck with a specific error. Read through the existing questions tagged with docusaurus or ask your own! Discussion forums​ There are many online forums for discussion about best practices and application architecture as well as the future of Docusaurus. If you have an answerable code-level question, Stack Overflow is usually a better fit. Docusaurus online chat #help-and-questions for user help #contributors for contributing help Reddit's Docusaurus community Feature requests​ For new feature requests, you can create a post on our feature requests board (Canny), which is a handy tool for road-mapping and allows for sorting by upvotes, which gives the core team a better indicator of what features are in high demand, as compared to GitHub issues which are harder to triage. Refrain from making a Pull Request for new features (especially large ones) as someone might already be working on it or will be part of our roadmap. Talk to us first! News​ For the latest news about Docusaurus, follow @docusaurus on X and the official Docusaurus blog on this website.Edit this pageLast updated on Sep 19, 2024 by Sébastien Lorber"
