["https://docusaurus.io/docs/migration"]
title = "Upgrading Docusaurus | Docusaurus"
description = "Docusaurus versioning is based on the major.minor.patch scheme and respects Semantic Versioning."
full_description = "UpgradingVersion: 3.7.0On this pageUpgrading Docusaurus Docusaurus versioning is based on the major.minor.patch scheme and respects Semantic Versioning. Breaking changes are only released on major version upgrades, and thoroughly documented in the following upgrade guides. 📄️ To Docusaurus v3This documentation will help you upgrade your site from Docusaurus v2 to Docusaurus v3.🗃️ To Docusaurus v25 items Troubleshooting upgrades​ When upgrading Docusaurus you may experience issues caused by mismatching cached dependencies - there are a few troubleshooting steps you should perform to resolve these common issues before reporting a bug or seeking support. Run the clear command​ This CLI command is used to clear a Docusaurus site's generated assets, caches and build artifacts. npmYarnpnpmnpm run clearyarn clearpnpm run clear Remove node_modules and your lock file(s)​ Remove the node_modules folder and your package manager's lock file using the following: BashPowerShellrm -rf node_modules yarn.lock package-lock.json@('node_modules','yarn.lock','package-lock.json') | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue Then reinstall packages and regenerate the lock file using: npmYarnpnpmnpm installyarn installpnpm installEdit this pageLast updated on Jan 3, 2025 by Sébastien Lorber 📄️ To Docusaurus v3This documentation will help you upgrade your site from Docusaurus v2 to Docusaurus v3."
