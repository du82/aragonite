["https://docusaurus.io"]
title = "Build optimized websites quickly, focus on your content | Docusaurus"
description = "An optimized site generator in React. Docusaurus helps you to move fast and write content. Build documentation websites, blogs, marketing pages, and more."
full_description = '''🎉 Docusaurus 3.7 is out!️ 🥳Build optimized websites quickly, focus on your contentGet StartedTry a DemoPowered by MDXSave time and focus on text documents. Simply write docs and blog posts with MDX, and Docusaurus builds them into static HTML files ready to be served. You can even embed React components in your Markdown thanks to MDX.Built Using ReactExtend and customize your project's layout by writing React components. Leverage the pluggable architecture, and design your own site while reusing the same data created by Docusaurus plugins.Ready for TranslationsLocalization comes out-of-the-box. Use git, Crowdin, or any other translation manager to translate your docs and deploy them individually.Document VersioningSupport users on all versions of your project. Document versioning helps you keep documentation in sync with project releases.Content SearchMake it easy for your community to find what they need in your documentation. We proudly support Algolia documentation search.Check it out in the intro videoLoved by many engineersMark Erikson@acemarkeWe've been using Docusaurus for all the Redux org docs sites for the last couple years, and it's great! We've been able to focus on content, customize some presentation and features, and It Just Works.Oct 26, 2021Supabase@supabaseWe've been using V2 since January and it has been great - we spend less time building documentation and more time building 🛳Thanks @docusaurus team 🦖Nov 18, 2020Dr.Electron@Dr_ElectronThe #IOTA wiki is now part of the @docusaurus showcase. We even have the honor of being a favorite. We are really happy that we found this project. It helped us a lot to improve the documentation. And we still have a lot of plans with things like tutorials, versioning and i18n.Oct 11, 2021Maël@arcanisI've used Docusaurus for two websites this year, and I've been very happy about the v2. Looks good, and simple to setup.Jan 20, 2021Paul Armstrong@paularmstrongContinue to be impressed and excited about Docusaurus v2 alpha releases. Already using the sidebar items generator to help monorepo workspace devs create their own doc pages without any configuration needed.Apr 27, 2021Kent C. Dodds@kentcdoddshttps://testing-library.com just got a nice update! We're now on the latest version of @docusaurus thanks to @matanbobi, @TensorNo, and @nickemccurdy 💙My favorite new feature: dark mode!! 🌑/☀️Nov 4, 2020Max Lynch@maxlynchDocusaurus v2 doubles as a really nice little static site generator tool for content-focused sites, love it 👏Mar 25, 2021Debbie O'Brien@debs_obrienBeen doing a lot of work with @docusaurus lately and I have to say it is really fun to work with. A lot of really cool features. I love that you can easily reuse content by creating a markdown file and importing it as a component. 🔥Mar 24, 2021swyx@swyxHappy to share Temporal's first open source sponsorship — of @docusaurus!@temporalio uses it for https://docs.temporal.io, and it has been a huge boon to our docs team. @sebastienlorber is an incredible steward of the project, support it if you can!Jul 23, 2021<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/christopher-chedeau.a975949.200.jpg srcset="/assets/ideal-img/christopher-chedeau.a975949.200.jpg 200w" alt='Christopher "vjeux" Chedeau' width=200 height=200>Christopher "vjeux" ChedeauLead Prettier DeveloperI've helped open source many projects at Facebook and every one needed a website. They all had very similar constraints: the documentation should be written in markdown and be deployed via GitHub pages. I’m so glad that Docusaurus now exists so that I don’t have to spend a week each time spinning up a new one.<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/hector-ramos.957d17a.200.jpg srcset="/assets/ideal-img/hector-ramos.957d17a.200.jpg 200w" alt="Hector Ramos" width=200 height=200>Hector RamosLead React Native AdvocateOpen source contributions to the React Native docs have skyrocketed after our move to Docusaurus. The docs are now hosted on a small repo in plain markdown, with none of the clutter that a typical static site generator would require. Thanks Slash!<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/ricky-vetter.b237586.200.jpg srcset="/assets/ideal-img/ricky-vetter.b237586.200.jpg 200w" alt="Ricky Vetter" width=200 height=200>Ricky VetterReasonReact DeveloperDocusaurus has been a great choice for the ReasonML family of projects. It makes our documentation consistent, i18n-friendly, easy to maintain, and friendly for new contributors.'''
