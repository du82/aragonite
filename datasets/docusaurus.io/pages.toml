title = "Build optimized websites quickly, focus on your content | Docusaurus"
description = "An optimized site generator in React. Docusaurus helps you to move fast and write content. Build documentation websites, blogs, marketing pages, and more."
full_description = '''🎉 Docusaurus 3.7 이 나왔습니다!️ 🥳여러분의 콘텐츠에 맞추어 최적화된 웹 사이트를 빠르게 빌드합니다.시작하기데모를 체험해보세요Powered by MDX시간을 절약하고 텍스트 문서에 집중하세요. MDX로 문서와 블로그 게시물을 작성하기만 하면 Docusaurus가 이를 제공할 준비가 된 정적 HTML 파일을 만들고 게시합니다. MDX 덕분에 마크다운에 React 컴포넌트를 포함할 수도 있습니다.리액트로 기능 확장하기React 컴포넌트를 작성해 프로젝트 레이아웃을 확장하고 사용자 지정할 수 있습니다. 플러그인 형태의 아키텍처를 활용하고 Docusaurus 플러그인으로 생성된 같은 데이터를 재사용하면서 여러분의 사이트를 설계하세요.손쉽게 번역하기현지화는 기본으로 제공됩니다. 깃, 크라우드인 또는 다른 번역 관리 도구를 사용해 문서를 번역하고 개별적으로 배포합니다.문서 버전 관리여러분의 프로젝트 모든 버전에 대한 사용자를 지원해줄 수 있습니다. 문서 버전 관리를 통해 여러분의 문서를 프로젝트 릴리스와 동기화할 수 있습니다.콘텐츠 검색하기사용자가 문서에서 필요한 것을 쉽게 찾을 수 있습니다. 알골리아 문서 검색을 지원합니다.소개 영상을 확인하세요많은 엔지니어들에게 사랑받는Mark Erikson@acemarkeWe've been using Docusaurus for all the Redux org docs sites for the last couple years, and it's great! We've been able to focus on content, customize some presentation and features, and It Just Works.Oct 26, 2021Supabase@supabaseWe've been using V2 since January and it has been great - we spend less time building documentation and more time building 🛳Thanks @docusaurus team 🦖Nov 18, 2020Dr.Electron@Dr_ElectronThe #IOTA wiki is now part of the @docusaurus showcase. We even have the honor of being a favorite. We are really happy that we found this project. It helped us a lot to improve the documentation. And we still have a lot of plans with things like tutorials, versioning and i18n.Oct 11, 2021Maël@arcanisI've used Docusaurus for two websites this year, and I've been very happy about the v2. Looks good, and simple to setup.Jan 20, 2021Paul Armstrong@paularmstrongContinue to be impressed and excited about Docusaurus v2 alpha releases. Already using the sidebar items generator to help monorepo workspace devs create their own doc pages without any configuration needed.Apr 27, 2021Kent C. Dodds@kentcdoddshttps://testing-library.com just got a nice update! We're now on the latest version of @docusaurus thanks to @matanbobi, @TensorNo, and @nickemccurdy 💙My favorite new feature: dark mode!! 🌑/☀️Nov 4, 2020Max Lynch@maxlynchDocusaurus v2 doubles as a really nice little static site generator tool for content-focused sites, love it 👏Mar 25, 2021Debbie O'Brien@debs_obrienBeen doing a lot of work with @docusaurus lately and I have to say it is really fun to work with. A lot of really cool features. I love that you can easily reuse content by creating a markdown file and importing it as a component. 🔥Mar 24, 2021swyx@swyxHappy to share Temporal's first open source sponsorship — of @docusaurus!@temporalio uses it for https://docs.temporal.io, and it has been a huge boon to our docs team. @sebastienlorber is an incredible steward of the project, support it if you can!Jul 23, 2021<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/ko/assets/ideal-img/christopher-chedeau.a975949.200.jpg srcset="/ko/assets/ideal-img/christopher-chedeau.a975949.200.jpg 200w" alt='Christopher "vjeux" Chedeau' width=200 height=200>Christopher "vjeux" Chedeau프리티어(Prettier) 리드 개발자저는 Facebook에서 많은 프로젝트를 오픈 소스로 참여했고 모든 프로젝트에 웹사이트가 필요했습니다. 대부분 프로젝트는 비슷한 요구사항을 가지고 있었습니다. 문서는 마크다운으로 작성되어야 하고 GitHub 페이지를 통해 배포되어야 합니다. 지금은 Docusaurus 덕분에 새로운 프로젝트를 런칭할 때마다 웹사이트를 만드느라 시간을 허비할 필요가 없어졌습니다.<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/ko/assets/ideal-img/hector-ramos.957d17a.200.jpg srcset="/ko/assets/ideal-img/hector-ramos.957d17a.200.jpg 200w" alt="Hector Ramos" width=200 height=200>Hector Ramos리액트 네이티브 리드 애드보케이트Docusaurus로 문서 플랫폼을 옮긴 후 React Native 문서에 대한 오픈 소스 기여가 급증했습니다. 이제 일반적인 정적 문서 생성 시 필요로 했던 자잘한 항목 없이 마크다운 문서를 바로 작은 규모의 저장소에서 호스팅할 수 있습니다. 고마워요. 슬래시!<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/ko/assets/ideal-img/ricky-vetter.b237586.200.jpg srcset="/ko/assets/ideal-img/ricky-vetter.b237586.200.jpg 200w" alt="Ricky Vetter" width=200 height=200>Ricky VetterReasonReact 개발자도큐사우루스는 ReasonML 프로젝트를 위한 훌륭한 선택이었습니다. 문서를 일관성 있고 i18n 친화적이며 유지 관리하기 쉽게 만들어주며 새로운 기여자가 문서 작업에 쉽게 접근할 수 있습니다.'''
