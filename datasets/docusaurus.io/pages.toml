title = "Announcing Docusaurus 2.0 | Docusaurus"
description = "Today we are extremely happy to finally announce Docusaurus 2.0! 🥳️"
full_description = '''Announcing Docusaurus 2.0August 1, 2022 · 13 min readSébastien LorberDocusaurus maintainer, This Week In React editorJoshua ChenWorking hard on DocusaurusYangshun TayFront End Engineer at MetaAlexey PyltsynOpen-source enthusiastPaul O’ShannessyEngineering Manager at MetaJoel MarceyCo-creator of Docusaurus 1Today we are extremely happy to finally announce Docusaurus 2.0! 🥳️ At Meta Open Source, we believe Docusaurus will help you build the best documentation websites with minimal effort, letting you focus on what really matters: writing the content. After 4 years of work, 75 alphas and 22 betas, the next generation of Docusaurus is ready for prime time. From now on, we now plan to respect Semantic Versioning and will release major versions more frequently. We are on ProductHunt and Hacker News!Now is the best time to show your love for Docusaurus! tipIn a hurry? Check what's new in Docusaurus 2.0! What is Docusaurus exactly?​ Docusaurus is a static site generator that helps you ship beautiful documentation websites in no time. Focus on your content: just write Markdown files. Docusaurus will generate an optimized website for you that's easy to host anywhere. Docusaurus is full-featured and very flexible: we ship with well-designed docs and blog layout, as well as out-of-the-box versioning, search, and internationalization functionalities, with a call to accessibility and search engine optimizations. Its flexible theming system permits to adapt the UI to match your branding so that it integrates nicely with your main website or documentation portal. Its usage of React enables a modern client-side navigation, and the ability to build an interactive documentation. The Docusaurus philosophy is akin to the Pareto principle: you can get 80% of the results for 20% of the effort. This enables you to compete with top-notch documentation sites with minimal effort. Unless you're spinning up a documentation team with engineering resources, you probably want Docusaurus!Rachel NaborsFormer ReactJS & React-Native docs manager Docusaurus aims to be the best documentation tool, but you can use it for other use-cases as well: a blog, a knowledge base, a developer portfolio, a second brain, or even to scaffold landing pages! Using Docusaurus for my tech blog has been a fantastic choice. It looks tremendous out-of-the-box and the awesome DX means I write way moreJohnny ReillyGroup Principal Engineer at Investec tipTry Docusaurus now with our online playgrounds and 5 minutes tutorial ⏱️ The story behind Docusaurus​ Docusaurus was created at Facebook Open Source in 2017 (now Meta Open Source). We had a lot of internal and open source projects to document. It's complicated enough to write good documentation, let alone to create the HTML, CSS, and JavaScript for a good-looking website. We wanted project leaders to be able to focus on the content, and Markdown is great for that. At that time, our solution was to copy/paste a Jekyll template over and over again. This naturally became hard to maintain, so we created a tool to solve our own pain once for all. Docusaurus v1 was born! It quickly built momentum at Facebook and in the frontend ecosystem, adopted by many popular projects such as Prettier, Babel, React-Native, KaTeX, and of course Docusaurus v1 itself. <img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/prettier.0987194.640.png srcset="/assets/ideal-img/prettier.0987194.640.png 640w,/assets/ideal-img/prettier.ac62bde.1030.png 1030w" alt=Prettier width=640 height=355>🔗 Prettier<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/babel.cbc364a.640.png srcset="/assets/ideal-img/babel.cbc364a.640.png 640w,/assets/ideal-img/babel.3669cfa.1030.png 1030w" alt=Babel width=640 height=355>🔗 Babel<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/react-native.e8025ec.640.png srcset="/assets/ideal-img/react-native.e8025ec.640.png 640w,/assets/ideal-img/react-native.8cebf9a.1030.png 1030w" alt=React-Native width=640 height=355>🔗 React-Native<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/katex.2b3ecc9.640.png srcset="/assets/ideal-img/katex.2b3ecc9.640.png 640w,/assets/ideal-img/katex.91ac937.1030.png 1030w" alt=Katex width=640 height=355>🔗 Katex<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/docusaurus.2ad1782.640.png srcset="/assets/ideal-img/docusaurus.2ad1782.640.png 640w,/assets/ideal-img/docusaurus.ba4280f.1030.png 1030w" alt=Docusaurus width=640 height=355>🔗 Docusaurus<> noteNotice that the sample sites above use different colors, but still look quite the same. Toward Docusaurus 2.0​ Docusaurus v1 has been very successful, but we started to question some architectural choices: React was only used as a server-side templating language, and not used on the client Theming system was pretty limited, and apart from changing a few colors with CSS, it was difficult to do more advanced customizations The docs versioning system was confusing, since it was based on a diff algorithm The codebase was monolithic, neither well-tested nor easy to extend Docusaurus v2 was rebuilt from the ground up with a new modular architecture: React is now also used on the client, enabling a modern Single Page Application navigation Plugins empower the community to contribute useful features as third-party packages Theming is more flexible than ever Docs versioning is now based on snapshot copies, much easier to understand We kept everything good from v1: docs, blog, pages, versioning, i18n... We implemented several new features More details in the Docusaurus 2 project announcement and v1 to v2 migration guide Who uses Docusaurus 2.0?​ Despite being in pre-release, it didn't take long for Docusaurus v2 to outgrow Docusaurus v1 in terms of NPM downloads: Our GitHub star trend is very positive, competing with major frameworks: Today, Docusaurus v2 has already been a great success even before its launch: We received so many lovely testimonials Companies like 1Password and Courier are writing down their positive experience Our site showcase references hundreds of sites, and this is only the tip of the iceberg. <img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/tauri.7d284be.640.png srcset="/assets/ideal-img/tauri.7d284be.640.png 640w,/assets/ideal-img/tauri.4852075.1030.png 1030w" alt=Tauri width=640 height=356>🔗 Tauri<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/figma.e023b25.640.png srcset="/assets/ideal-img/figma.e023b25.640.png 640w,/assets/ideal-img/figma.4b79b06.1030.png 1030w" alt=Figma width=640 height=356>🔗 Figma<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/snapchat.5f28663.640.png srcset="/assets/ideal-img/snapchat.5f28663.640.png 640w,/assets/ideal-img/snapchat.39e00a7.1030.png 1030w" alt=Snapchat width=640 height=356>🔗 Snapchat<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/iota.95754da.640.png srcset="/assets/ideal-img/iota.95754da.640.png 640w,/assets/ideal-img/iota.117672c.1030.png 1030w" alt=Iota width=640 height=356>🔗 Iota<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/sap-cloud.f57d7fa.640.png srcset="/assets/ideal-img/sap-cloud.f57d7fa.640.png 640w,/assets/ideal-img/sap-cloud.312bf29.1030.png 1030w" alt="SAP Cloud" width=640 height=356>🔗 SAP Cloud<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/supabase.e96fd5f.640.png srcset="/assets/ideal-img/supabase.e96fd5f.640.png 640w,/assets/ideal-img/supabase.f37ca60.1030.png 1030w" alt=Supabase width=640 height=356>🔗 Supabase<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/stackblitz.3a585ac.640.png srcset="/assets/ideal-img/stackblitz.3a585ac.640.png 640w,/assets/ideal-img/stackblitz.786829d.1030.png 1030w" alt=StackBlitz width=640 height=356>🔗 StackBlitz<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/lacework.dfc8aa5.640.png srcset="/assets/ideal-img/lacework.dfc8aa5.640.png 640w,/assets/ideal-img/lacework.33303f9.1030.png 1030w" alt=Lacework width=640 height=356>🔗 Lacework<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/react-navigation.1b40364.640.png srcset="/assets/ideal-img/react-navigation.1b40364.640.png 640w,/assets/ideal-img/react-navigation.a6b28c6.1030.png 1030w" alt=React-Navigation width=640 height=356>🔗 React-Navigation<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/solana.8bcac78.640.png srcset="/assets/ideal-img/solana.8bcac78.640.png 640w,/assets/ideal-img/solana.e7c1e4f.1030.png 1030w" alt=Solana width=640 height=356>🔗 Solana<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/gulp.645374a.640.png srcset="/assets/ideal-img/gulp.645374a.640.png 640w,/assets/ideal-img/gulp.f298c97.1030.png 1030w" alt=Gulp width=640 height=356>🔗 Gulp<> tipPlease add your site to our site showcase! It only takes a few seconds: just post a comment here. We use Docusaurus everywhere now and love itMax LynchIonic co-founder and CEO We've been using V2 since January and it has been greatSupabaseOpen Source Firebase alternative Docusaurus is next level easy for literally everything you would need for documentation in your project.Gabriel CsapoStaff Software Engineer at LinkedIn Docusaurus is awesome. We use itMatt GreggSenior Front End Developer at Shopify What's New in 2.0?​ It would be difficult to describe every single new feature coming with Docusaurus v2. Let's focus on the features we believe are the most impactful. MDX​ MDX allows you to interleave React components in Markdown. This enables you to build top-notch interactive documentation experiences very easily. A demo is worth a thousand words: docs/my-document.mdx### Give it a try: press that button!import ColorModeToggle from '@theme/ColorModeToggle';<ColorModeToggle/> http://localhost:3000Give it a try: press that button! infoMDX has its own plugin system. You to customize your Markdown authoring experience, and even create your own Markdown syntax. Docusaurus + MDX is great: we were able to implement a beautiful two-pane layout and give the author fine-grained control on the placement of code and corresponding prose.Hamel HusainHead Of Data Science at Outerbounds File system conventions​ Our goal is to make Docusaurus very intuitive to use. We added file system conventions, and adding a doc page is as easy as creating one Markdown file. Using the auto-generated sidebars makes it so simple to just create a page and not worry about any other configuration.Paul ArmstrongPrincipal Engineer at Microsoft Plugins​ Docusaurus now has a modular architecture with a plugin system — our core features like docs, blog, pages, and search are all powered by individual plugins. More importantly, it enables our community to enhance Docusaurus with additional features. Let's highlight some examples: redocusaurus: seamless integration with OpenAPI and Redoc docusaurus-preset-shiki-twoslash: use Shiki code block syntax highlighting with TwoSlash TypeScript compiler hints The plugin API was a breeze to use, and powerful enough that I could port the code sample renderer from the TypeScript website site in a couple of hours.Orta TheroxFormer TypeScript core team at Microsoft docusaurus-search-local: one of the various local search alternatives to the built-in Algolia plugin tipWe have a curated list of outstanding plugins in our community resources page. The plugin system in Docusaurus v2 has made expanding 1Password's developer portal so easy and fun. Super excited to show you what we've got cooking up.Jody HeavenerSenior Developer at 1Password Theming​ Theming is one of the most important features of Docusaurus: we believe a professional documentation site should respect your company's branding and create a consistent experience. Docusaurus theming gives a lot of flexibility on multiple levels: Customize CSS variables to adjust colors, fonts, and more Provide your own CSS stylesheets Implement your own theme from scratch Override any React component provided by our default theme: we call this swizzling I love Docusaurus Swizzling feature. It’s opinionated and flexible at the same time. This is super cool since a framework usually needs to sacrifice one for the other. Hung Viet NguyenCreator of JestPreview This enables users willing to invest a bit more time on customizations to build sites that look different from others. <img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/ionic.7f10b53.640.png srcset="/assets/ideal-img/ionic.7f10b53.640.png 640w,/assets/ideal-img/ionic.cd19b49.1030.png 1030w" alt=Ionic width=640 height=356>🔗 Ionic<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/outerbounds.7fa8be7.640.png srcset="/assets/ideal-img/outerbounds.7fa8be7.640.png 640w,/assets/ideal-img/outerbounds.17abaf6.1030.png 1030w" alt=Outerbounds width=640 height=356>🔗 Outerbounds<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/courier.e9b71f4.640.png srcset="/assets/ideal-img/courier.e9b71f4.640.png 640w,/assets/ideal-img/courier.f8addf0.1030.png 1030w" alt=Courier width=640 height=356>🔗 Courier<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/quickwit.aae4257.640.png srcset="/assets/ideal-img/quickwit.aae4257.640.png 640w,/assets/ideal-img/quickwit.e851c05.1030.png 1030w" alt=Quickwit width=640 height=356>🔗 Quickwit<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/dyte.b411d0a.640.png srcset="/assets/ideal-img/dyte.b411d0a.640.png 640w,/assets/ideal-img/dyte.9d967ec.1030.png 1030w" alt=Dyte width=640 height=356>🔗 Dyte<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/assets/ideal-img/react-native.9ad7a23.640.png srcset="/assets/ideal-img/react-native.9ad7a23.640.png 640w,/assets/ideal-img/react-native.02f5343.1030.png 1030w" alt=React-Native width=640 heigh'''
