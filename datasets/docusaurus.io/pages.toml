title = "Build optimized websites quickly, focus on your content | Docusaurus"
description = "An optimized site generator in React. Docusaurus helps you to move fast and write content. Build documentation websites, blogs, marketing pages, and more."
full_description = '''🎉 Docusaurus 3.7 已发布！ 🥳快速构建以内容为核心的最佳网站入门指南试用一下由 MDX 驱动节约时间并专注于文档本身。只需要以 Markdown/MDX 格式撰写文档/博客，Docusaurus 就能自动构建生成静态 HTML 文件。通过 MDX，甚至可以在 Markdown 中嵌入 React 组件。使用 React 构建通过编写 React 组件来扩展和自定义你的网页布局。利用插件架构，你可以在设计自己的网站的同时，复用 Docusaurus 插件所创建的数据。可翻译开箱即用的本地化。使用 git、Crowdin 或任何其他翻译管理器来翻译你的文档并单独部署。文档版本化为你的用户提供所有版本的项目文档。版本化文档可让你的文档发布与项目发行时间保持一致。内容搜索让你的社区在文档中轻松找到他们需要的内容。我们支持 Algolia 文档搜索。看看介绍视频被许多工程师追捧Mark Erikson@acemarkeWe've been using Docusaurus for all the Redux org docs sites for the last couple years, and it's great! We've been able to focus on content, customize some presentation and features, and It Just Works.Oct 26, 2021Supabase@supabaseWe've been using V2 since January and it has been great - we spend less time building documentation and more time building 🛳Thanks @docusaurus team 🦖Nov 18, 2020Dr.Electron@Dr_ElectronThe #IOTA wiki is now part of the @docusaurus showcase. We even have the honor of being a favorite. We are really happy that we found this project. It helped us a lot to improve the documentation. And we still have a lot of plans with things like tutorials, versioning and i18n.Oct 11, 2021Maël@arcanisI've used Docusaurus for two websites this year, and I've been very happy about the v2. Looks good, and simple to setup.Jan 20, 2021Paul Armstrong@paularmstrongContinue to be impressed and excited about Docusaurus v2 alpha releases. Already using the sidebar items generator to help monorepo workspace devs create their own doc pages without any configuration needed.Apr 27, 2021Kent C. Dodds@kentcdoddshttps://testing-library.com just got a nice update! We're now on the latest version of @docusaurus thanks to @matanbobi, @TensorNo, and @nickemccurdy 💙My favorite new feature: dark mode!! 🌑/☀️Nov 4, 2020Max Lynch@maxlynchDocusaurus v2 doubles as a really nice little static site generator tool for content-focused sites, love it 👏Mar 25, 2021Debbie O'Brien@debs_obrienBeen doing a lot of work with @docusaurus lately and I have to say it is really fun to work with. A lot of really cool features. I love that you can easily reuse content by creating a markdown file and importing it as a component. 🔥Mar 24, 2021swyx@swyxHappy to share Temporal's first open source sponsorship — of @docusaurus!@temporalio uses it for https://docs.temporal.io, and it has been a huge boon to our docs team. @sebastienlorber is an incredible steward of the project, support it if you can!Jul 23, 2021<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/zh-CN/assets/ideal-img/christopher-chedeau.a975949.200.jpg srcset="/zh-CN/assets/ideal-img/christopher-chedeau.a975949.200.jpg 200w" alt='Christopher "vjeux" Chedeau' width=200 height=200>Christopher "vjeux" ChedeauPrettier 首席开发者我为 Facebook 所贡献的每个开源项目都需要一个网站，且它们都有相同的限制：文档使用 Markdown 编写并部署在 GitHub Pages 上。我太感谢 Docusaurus 让我不用每周重复造轮子了。<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/zh-CN/assets/ideal-img/hector-ramos.957d17a.200.jpg srcset="/zh-CN/assets/ideal-img/hector-ramos.957d17a.200.jpg 200w" alt="Hector Ramos" width=200 height=200>Hector RamosReact Native 大使迁移到 Docusaurus 后，React Native 的开源贡献数量直线上升。现在的文档托管于一个小仓库上，仅包含纯 Markdown 内容，完全没有其他的静态网页生成器那么麻烦！感谢 Slash！<img style=width:100%;height:auto;max-width:100%;margin-bottom:-4px;position:absolute;top:0;left:0 src=/zh-CN/assets/ideal-img/ricky-vetter.b237586.200.jpg srcset="/zh-CN/assets/ideal-img/ricky-vetter.b237586.200.jpg 200w" alt="Ricky Vetter" width=200 height=200>Ricky VetterReasonReact 开发者Docusaurus 一直都是 ReasonML 项目组的首选。它能保证我们的文档连贯一致、易于国际化与维护，且对新贡献者友好。'''
