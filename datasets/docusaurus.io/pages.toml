["https://docusaurus.io/blog/page/2"]
title = "Docusaurus blog | Docusaurus"
description = "Read blog posts about Docusaurus from the team"
full_description = "Docusaurus 3.2March 29, 2024 · 4 min readSébastien LorberDocusaurus maintainer, This Week In React editorWe are happy to announce Docusaurus 3.2. The upgrade should be easy: as explained in our release process documentation, minor versions respect Semantic Versioning. Tags:ReleaseRead more Docusaurus 3.1January 5, 2024 · 2 min readSébastien LorberDocusaurus maintainer, This Week In React editorWe are happy to announce Docusaurus 3.1. The upgrade should be easy: as explained in our release process documentation, minor versions respect Semantic Versioning. Tags:ReleaseRead more Announcing Docusaurus 3.0October 31, 2023 · 11 min readSébastien LorberDocusaurus maintainer, This Week In React editorToday, we are happy to announce Docusaurus 3.0! 🥳 At Meta Open Source, we believe Docusaurus will help you build the best documentation websites with minimal effort, letting you focus on what really matters: writing the content. This is a new major version of Docusaurus, coming with new exciting features and upgraded dependencies. In line with the Semantic Versioning principles, this release includes breaking changes we documented thoroughly in the v3 upgrade guide. Breaking changes can be bothersome, but they are necessary to set the ground for a new wave of Docusaurus features we plan to implement. Tags:ReleaseRead more Preparing your site for Docusaurus v3September 29, 2023 · 14 min readSébastien LorberDocusaurus maintainer, This Week In React editorwarningThis blog post was written when Docusaurus v3 was in beta. There are some changes in dependency versions and upgrade steps you should be aware of if upgrading to Docusaurus v3 current stable releases. Use the upgrade guide for the most up-to-date migration steps. Docusaurus v3 is now in beta and the official release is around the corner. This is the perfect time to start preparing your site for this new major version. Docusaurus v3 comes with a few breaking changes, many of which can be handled today under Docusaurus v2. Preparing your site ahead of time can be done incrementally, and will make it easier to upgrade to v3. The main breaking change is the upgrade from MDX v1 to MDX v3. Read the MDX v2 and MDX v3 release notes for details. MDX will now compile your Markdown content more strictly and with subtle differences. This article will mostly focus on how to prepare your content for this new MDX version, and will also list a few other breaking changes that you can handle today. Tags:MaintenanceRead more"
