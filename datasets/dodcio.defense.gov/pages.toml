["https://dodcio.defense.gov/About-DoD-CIO/bios/Vietmeyer"]
title = "Mr. Vietmeyer"
full_description = "Rob Vietmeyer Chief Software Officer for DCIO Information Enterprise for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Mr. Rob Vietmeyer is the Department of Defense Chief Software Officer for the Deputy Chief Information Officer for Information Enterprise (DCIO(IE)). In this position, he is the principal advisor to the DoD CIO for the implementation and evolution of the Department’s Software Modernization Strategy. Mr. Vietmeyer will drive strategy implementation, establishing the foundation to deliver resilient software at speed and scale advocating for the latest software development approaches, cloud services, and process transformation. Through collaboration with other DoD Components, government, industry, and academia partners, he is responsible for advancing the Department’s adoption of DevSecOps practices, agile software development, and cloud native modernization. Prior to his current position, Mr. Vietmeyer served as the Director of Cloud and Software Modernization for the DCIO(IE), leading a diverse team to modernize the way DoD develops software. In that role and in partnership with DoD Components, he led the development of the Department’s DevSecOps guidance, OCONUS Cloud Strategy, cloud Infrastructure as Code (IaC) implementation, and the DoD Software Modernization Strategy and Implementation Plan. He established the DoD Software Modernization Senior Steering Group (SSG) to guide software modernization initiatives and the Department-wide DevSecOps Community of Practice, which brings together stakeholders and subject matter experts across DoD and industry to further modernization progress. He functioned as the Subject Matter Expert (SME) Tri-Chair for the DoD Software Modernization Action Officers Working Group (AOWG), the group responsible for leading implementation of guidance from DoD leadership and the SSG. Prior to joining the Office of the DoD CIO, Mr. Vietmeyer was a SME and lead for agile software development efforts at the Defense Information Systems Agency (DISA). He led delivery of the enterprise collaborative software development environment - Forge.mil and implementation of DISA’s initial cloud computing solutions. Under his leadership, Forge.mil grew to enable 27,000 DoD software developers working on over 1,000 development projects supporting DoD mission critical programs. Additionally, Mr. Vietmeyer led the definition and technical design of the Department’s Net-Centric Enterprise Services (NCES) program, served as Chief Engineer for the Global Combat Support System (GCSS), and Lead Engineer for the Global Command and Control System (GCCS). In his early career, he developed software for DoD command and control data integration, DISA’s acquisition career management systems, and data processing systems for mainframe and minicomputer infrastructure. Mr. Vietmeyer holds an M.S. in Information and Telecommunications Systems from Johns Hopkins University and a B.S. in Physics from Randolph Macon College. He has received numerous recognitions for his work including the Federal CIO Council Leadership Award, the American Council for Technology/Industry Advisory Council Excellence.gov Award, and the Federal 100. Born in the San Francisco Bay Area, Mr. Vietmeyer currently lives in Northern Virginia where he and his wife continue to support their three kids with two in college and one soon to be."
year_published = 2025
