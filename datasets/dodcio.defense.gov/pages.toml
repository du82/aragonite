["https://dodcio.defense.gov/About-DoD-CIO/bios/McKeown"]
title = "Mr. McKeown"
full_description = "David W. McKeown Special Assistant for Cybersecurity Innovation, Office of the Department of Defense (DoD) Chief Information Officer DOWNLOAD HI-RES Mr. David McKeown serves as the Department of Defense Chief Information Officer’s Special Assistant for Cybersecurity Innovation. Mr. McKeown supports the Office of the CIO by providing executive level oversight, planning, and execution on a full spectrum of programs and operations of organizational impact, to include assessment of threats and identification of innovative methods to address them, the development of strategies for maintaining a competitive advantage, and advising on matters related to cybersecurity technology and innovation activities within the DoD, across the federal government, academia, industry and internationally. Prior to assuming this role, Mr. McKeown served as the Deputy DoD CIO for Cybersecurity and DoD Chief Information Security Officer (CISO), responsible for leading the DoD-wide cybersecurity program, associated governance processes, and the development of the cybersecurity investment priorities to secure DoD networks. He was also responsible for DoD’s work with industry to improve cybersecurity and information sharing through the Defense Industrial Base (DIB). Mr. McKeown has over 35 years of experience in the Department of Defense having served 27 years in the Air Force and 8 years as a government civilian. He spent 21 years as an Air Force Cyberspace Operations officer skillfully leading numerous organizations and high-visibility initiatives to include the Air Force Cybersecurity Program as a member of the Air Staff. He served as the Director of Enterprise Information and Mission Assurance for the United States Army Information Technology Agency and as the Cybersecurity Center Chief and Enterprise Services Center Chief for the DISA Joint Service Provider in the Pentagon. He led the Pentagon Computer Incident Response Team (PENTCIRT) providing twenty-four-hour-a-day, seven-days-a-week network security monitoring and intrusion detection, attack sensing and warning, and incident response and handling for the Department of Defense's key leadership and staffs."
