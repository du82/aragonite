["https://dodcio.defense.gov/AboutDoDCIO/Organization/DCIOC3.aspx"]
title = "Chief Information Officer > About DoD CIO > Organization > DCIO C3"
full_description = "DCIO Command, Control, & Communications DCIO C3 focuses on empowering data access through mobile devices and networks and leveraging spectrum resources Leadership Anthony Smith is the Acting Deputy CIO (DCIO) for Command, Control, & Communications (C3). As acting DCIO, Mr. Smith provides technical expertise and broad guidance on policy, programmatic and technical issues relating to C3 to integrate and synchronize defense-wide communications and infrastructure programs. Vernita Harris is the Acting Principal Director (PD DCIO) for Command, Control, & Communications (C3). She provides strategic direction, policy guidance, and oversight to enable the Department to effectively define, prioritize, acquire, govern, manage, and implement C3 capabilities in support of DoD operations. Overview Deputy Chief Information Officer for Command, Control, & Communications (C3) provides expertise and broad guidance on policy, programmatic, and technical issues relating to C3 to integrate and synchronize DoD-wide communications and infrastructure programs and efforts to achieve and maintain information dominance for the Department. DCIO C3 also manages efforts defining DoD policies and strategies for design, architecture, interoperability standards, capability development, and sustainment of critical C2 and communications for nuclear and non-nuclear strategic strike, integrated missile defense, and Defense and National Leadership Command Capabilities. Its sub organizations include Spectrum Policy and Programs; C3, including military and commercial SATCOM and Positioning, Navigation, and Timing; and National Leadership Command Capabilities. This organization focuses on several DoD CIO top priorities, including empowering data access for DoD personnel through mobile devices and networks as well as sharing scarce spectrum resources with partners across industry and government. These efforts are critical to empowering secure, efficient, effective information technology for the Warfighter, because they look toward the future of accessing and utilizing information."
year_published = 2025
