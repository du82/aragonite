["https://dodcio.defense.gov/About-DoD-CIO/Bios/Abernethy"]
title = "Mr. Abernethy"
full_description = "James Abernethy Executive Director for the National Leadership Command Capability Management Office for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Mr. James T. Abernethy, Jr. was appointed in September 2024 as Executive Director for the National Leadership Command Capability (NLCC) Management Office (NMO) for the Department of Defense Chief Information Officer (DoD CIO), where he manages teams of communications, information technology (IT), and precise timing experts responsible for the National Leadership Command, Control, and Communications (C3) System. Since 2019, Mr. Abernethy has been responsible for oversight and management of the nation’s most vital National Leadership communications capabilities, enabling the President of the United States and other National Leadership to execute their essential functions in all environments, regardless of location. In 2022, Mr. Abernethy was recognized as one of FCW magazine’s “Federal 100” award winners. Prior to this appointment, Mr. Abernethy served as Director for Strategic Integration for the DoD CIO, where he advised Senior Leadership on policy and technology issues regarding Global Navigation Satellite Systems (GNSS), alternate PNT systems, and Navigation Warfare (NAVWAR). Mr. Abernethy built and managed collaborative engagement strategies and acquisition programs across the federal government and industry to address the military’s most sensitive national security concerns. During this period, Mr. Abernethy was also appointed as the U.S. Senior National Representative for International NAVWAR activities. Mr. Abernethy also has served as the Deputy Director for Sensitive Information Integration. In this capacity, he leveraged the full spectrum of the Department’s compartmented and sensitive capabilities to develop cross-cutting solutions against the highest-priority national security concerns. At the Defense Intelligence Agency, Mr. Abernethy served as an Operations Division Chief to counter the proliferation of weapons of mass destruction. During this period, Mr. Abernethy executed hundreds of missions with US and Allied Special Operations Forces in the Middle East, Africa, and Asia yielding critical information that received Presidential attention. For his operational achievements in Afghanistan (2001-2002) and Iraq (2003), Mr. Abernethy was awarded the National Intelligence Medal of Achievement by the Director of the Central Intelligence Agency, as well as the National Intelligence Meritorious Unit Award by the Director of DIA. Graduating from the United States Air Force Academy in 1992, Mr. Abernethy served as an active duty and reserve officer in the United States Air Force (USAF), retiring in 2014 after 20 years of combined service. In 1993, Mr. Abernethy earned a Master of Science in Strategic Intelligence from the Joint Military Intelligence College (1997) and a Master of Strategic Studies degree from the U.S. Army War College (2012)."
