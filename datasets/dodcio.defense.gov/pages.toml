["https://dodcio.defense.gov/About-DoD-CIO/bios/condon"]
title = "Ms. Condon"
full_description = "Christine Condon Deputy Chief Information Officer for Resources & Analysis for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Ms. Chris Condon is the Deputy Chief Information Officer for Resources & Analysis within the office of the DoD Chief Information Officer (DoD CIO). Key responsibilities include serving as the DoD CIO focal point for the Planning, Programming, Budgeting and Execution process, Congressional issues and for administration and management. Prior to her current role, Ms. Condon was the Principal Director, Deputy Chief Information Officer (DCIO) for Resources and Analysis. She was responsible for monitoring and analyzing congressional activities and legislation as they affect command and control (C2), communications, frequency spectrum, IT and defensive cybersecurity and related issues and programs. From September 2009 to March 2012, Ms. Condon served as the Principal Director to the Deputy Assistant Secretary of Defense for Resources, within the Office of Assistant Secretary of Defense for Networks and Information Integration / DoD Chief Information Officer (CIO). From January 2004 to September 2009, Ms. Condon served as the Director, NII Congressional Review and Analysis, OASD(NII) / DoD CIO, serving as liaison between NII/CIO and the Assistant Secretary of Defense for Legislative Affairs and the DoD Comptroller for legislative matters affecting NII and CIO activities and issues. From June 1998 to January 2004, Ms. Condon was the Director of Congressional Analysis within the Office of Assistant Secretary of Defense for Command Control Communications and Intelligence (ASD(C3I)). During this period she also served as the Director of Congressional Activities for the newly nominated and appointed Under Secretary of Defense for Intelligence, until that organization was formally staffed and organized. From October 1997 to June 1998, she served as the Executive Assistant to the Acting Assistant Secretary of Defense for C3I (ASD(C3I)). In that capacity she was the C3I focal point for Defense Reform Initiative and assisted in the implementation of the new C3I organizational structure mandated under the Initiative. From July 1990 to October 1997, Ms. Condon and was responsible for oversight of major DoD C2 and information technology systems on behalf of the ASD(C3I) in his role as the Department’s Senior Information Resource Management Official, and later, as the DoD Chief Information Officer. From January 1995 to October 1995, Ms. Condon was a Legislative Fellow on the Senate Subcommittee on Oversight of Government Management and the District of Columbia, chaired by Senator Cohen. During her fellowship she assisted in the development of and negotiations, which led to passage of the Information Technology Management Reform Act, now known as the Clinger-Cohen Act. She started her career in the government as a computer programmer with the Defense Communications Agency, now the Defense Information Systems Agency, in 1983. Ms. Condon graduated from the University of Nebraska at Omaha with Bachelor of Arts degree in Mathematics, Magna Cum Laude; and received a Master of Science in Geography from the University of Nebraska at Omaha in 1999. She is a recipient of the General Services Administration Interagency Committee on Information Technology Resources, Acquisition Innovation Award (1996); Secretary of Defense Career Civilian Service Award and 2007 Presidential Rank Award recipient."
year_published = 2025
