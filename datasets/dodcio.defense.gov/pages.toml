["https://dodcio.defense.gov/Cyber-Workforce/CITEP/For-DoD-Participants"]
title = "CITEP"
full_description = "For DoD Participants Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us More Information For Prospective DoD Participants The DoD CITEP is open to DoD civilian employees who meet the following criteria: Eligible Employees: DoD civilian employees at the General Schedule grade 11 level and above (or equivalent) working in the cybersecurity or IT field. Performance Level: Participants must be currently performing at the “Fully Successful” performance level. Supervisory Endorsement: Participants must have the endorsement of their immediate supervisor. Supervisor endorsements: Verify the availability of funding for the exchange that will be reviewed and approved by the Lending Organization when making participant selection decisions. Confirm the Lending Organization’s interest in participating in the DoD CITEP. While detailed to a private sector organization, a DoD employee remains a federal employee without loss of employee rights and benefits. Length of Detail: An exchange should be no less than three months and no more than one year. An exchange may be extended in three-month increments for a total of no more than one additional year by CITEP DoD Component and private sector points-of-contact. Continued Service Obligation: DoD employees are required to return to their employing Component upon completion of the detail for a time period equal to the length of the detail, plus any extensions. Payment of Salary and Allowances: The lending (or home) organization has full responsibility for payment of all salary and allowances to their employees participating in CITEP. DoD employees participating in CITEP are entitled to all benefits afforded to similar employees of their respective lending organizations, including medical care, according to subscribed plans and Worker’s Compensation for injuries sustained in the line of duty. Business Training and Travel Expenses: The receiving organization (recipient of the CITEP participant) may pay for any business training and travel expenses incurred by the employee while participating in CITEP. The employee shall provide vouchers and all supporting receipts to the receiving organization for review and approval. Prohibition: A private sector organization may not charge the DoD or any agency of the federal government, as direct or indirect costs under a federal contract, for the costs of pay or benefits paid by that organization to an employee assigned to a DoD Component for the period of the detail. Application Process: If you meet the eligibility requirements above and are interested in participating in CITEP, apply on the program website at https://www.dodemergingtech.com/dod-programs/cyber-information-technology-exchange-program-citep/. If you have any questions, please contact the program mailbox at osd.mc-alex.dod-cio.mbx.askcitep@mail.mil."
year_published = 2025
clearnet = "https://dodcio.defense.gov/Cyber-Workforce/CITEP/For-DoD-Participants"
