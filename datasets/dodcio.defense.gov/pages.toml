["https://dodcio.defense.gov/About-DoD-CIO/Bios/Porter"]
title = "Mr. Porter"
full_description = "Carl Porter Principal Director for Information Enterprise Office of the DoD Chief Information Officer DOWNLOAD HI-RES Mr. Carl D. Porter serves as the Principal Director (PD) for the Deputy Chief Information Officer for the Information Enterprise (DCIO-IE). In this role, he assists the DCIO-IE in development and implementation of strategic direction and defense-wide policy guidance to modernize the Department’s digital infrastructure that enables the full range of defense operations. He leads a dynamic team of military, civilian, and contractor personnel to continuously modernize the DoD digital enterprise. Prior to this role, Mr. Porter served as the Director, DoD Information Network (DoDIN) Modernization, DCIO-IE. In that capacity, he led a team responsible for Department wide policy, strategy, and resourcing approaches for network modernization and security, joint Command and Control (JC2), coalition information sharing, end user enterprise services, Information Technology (IT) standards and interoperability, and essential governance and liaison functions. Mr. Porter has served in the DoD CIO since 2006. He has extensive experience in the Department of Defense decision support processes (requirements, acquisition, and resourcing), and expertise in JC2 systems, network security, DoDIN operations, coalition information sharing, and IT governance. Mr. Porter served over 26 years in the United States Army, retiring in the grade of Colonel in 2010. He served in a variety of command and staff positions throughout his Army career. He holds a Master’s degree in Strategic Studies from the U.S. Army War College in Carlisle, PA, and a Master’s degree in Computer and Information Resource Management from Webster University, St. Louis, MO. Mr. Porter is married and has three grown children."
year_published = 2025
