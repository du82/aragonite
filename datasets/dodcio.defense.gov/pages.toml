["https://dodcio.defense.gov/About-DoD-CIO/bios/hadi"]
title = "Dr. Hadi"
full_description = "Diba Hadi Principal Director of the Cyber Academic Engagement Office for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Dr. Diba Azizi Hadi is the Principal Director of the Cyber Academic Engagement Office (CAEO) in the office of the Chief Information Officer (CIO). Key responsibilities include developing and managing cyber-focused educational initiatives and policies, fostering partnerships between academia and key stakeholders across K-12, higher education and post-secondary institutions, ongoing performance evaluations of DoD supported cyber education efforts (scholarships, camps, and collaborative volunteer partnerships), and administering grant and cooperative agreement programs and other budgetary items. Dr. Hadi’s distinguished career spans over three decades in program and systems development, higher education, and organizational leadership. She has exhibited exceptional proficiency in cross-cultural communication and collaboration, working with partners from the US Intelligence Community (USIC), academia, and international alliance. In her role as the Senior Academic and Project Management Advisor at the Federal Bureau of Investigation’s (FBI) Operational Technology Division, Dr. Hadi provided strategic academic guidance, led professional development initiatives, and managed accreditation matters. Dr. Hadi has contributed to educational policies at both the FBI and National Security Agency (NSA) through the development of instructional materials, syllabi, and curricula and professional development. These efforts shaped how technical training programs, such as for Computer Scientists, Digital Operations Specialists, Data Analysts, and Forensic Examiners are structured and delivered. As a policy advisor for NSA's National Center of Academic Excellence in Cybersecurity (NCAE-C) Operations Program, she played a role in ensuring alignment between cybersecurity education programs and the operational needs of agencies like the DoD and the USIC. Dr. Hadi has also served as a professor at various institutions, where she was instrumental in developing and managing curricula, conducting gap analyses, and implementing instructional programs aligned with the Systems Approach to Training and Education. Her executive-level support for the Regional Cultural, Language, and Familiarization program was crucial for its operational success, enhancing the understanding of regional dynamics and cultural integration among U.S. military leadership. As a Regional Director for the University of Nevada, Las Vegas Family Development Division, Dr. Hadi handled compliance across multiple programs, ensuring adherence to federal, state, and local regulations. Her crisis management plan resulted in policy changes aimed at resolving disputes, contract negotiations, and investigations. At the Marine Corps University and the USAJFK Special Warfare Center & School, Dr. Hadi developed and implemented advanced curricula for language, cultural training programs, and regional studies, leading to policy changes that supported the cultural training needs of the DoD’s special operations forces. Dr. Hadi has made significant contributions through service on numerous boards and committees at both the national and state levels, playing a key role in shaping policy and driving strategic planning. Her involvement includes the NCAE-C, NSA Executive Leadership Forum, National Initiative for Cybersecurity Education, Regional Studies Faculty Committee, Community Service Block Grant Advisory Board, CC Licensing Board, Weed and Seed Task Force, Statewide Steering Committees, Executive Committees, IC Community Collaboration Committees, Workforce Development Board, Strategic Planning Committees, Center for Advanced Operational Culture Learning Curriculum Development Committee, Community Relations Committee, and the Association for the Study of the Middle East and Africa. An accomplished author, Dr. Hadi has written extensively on topics including language and educational policies. Her thought leadership in cybersecurity education and program management has been showcased in presentations at high-profile conferences such as national symposiums and executive leadership forums. She is an active member of several professional organizations, and her contributions have been recognized with numerous awards and letters of appreciation from esteemed bodies, including the FBI. Her policy work spans statewide legislative policies, bureau academic frameworks, the Army’s training and education protocols, and cross-cultural communication guidelines. She has actively influenced decisions that impact workforce development, education, and community relations."
year_published = 2025
