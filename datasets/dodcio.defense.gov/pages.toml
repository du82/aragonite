["https://dodcio.defense.gov/Cyber-Workforce/CITEP/For-Industry-Participants"]
title = "CITEP"
full_description = "FOR INDUSTRY PARTICIPANTS Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us More Information For Prospective Industry Participants The DoD CITEP is open to private sector employees who meet the following criteria: Security Clearance: Participants must successfully obtain and maintain the same type, level, and adjudication of the security clearance required to perform the duties of the exchange assignment through the duration of their participation in the CITEP. Experience Level: Participants must possess the experience, knowledge, and skills required for the exchange opportunity and be working in the cybersecurity or IT field. Performance Level: Participants must meet the definition of a high-performing employee in accordance with their organization’s performance standards. Supervisory Endorsement: Participants must have the endorsement of their immediate supervisor. Supervisor endorsements: Verify the availability of funding for the exchange that will be reviewed and approved by the Lending Organization when making participant selection decisions. Confirm the Lending Organization’s interest in participating in the CITEP. While detailed to DoD, a private sector employee is deemed to be an employee of the DoD for certain purposes and is bound by applicable federal and DoD regulations regarding personal conduct, security requirements and ethical behavior. The private sector employee may not have access to any trade secrets or to any other non-public information which is of commercial value to the private sector organization from which such employee originates. The private sector employee may also continue to receive pay and benefits from the private sector organization. Length of Detail: An exchange should be no less than three months and no more than one year. An exchange may be extended in three-month increments for a total of no more than one additional year by CITEP DoD Component and private sector points-of-contact. Payment of Salary and Allowances: The private sector organization has full responsibility for payment of all salary and allowances to their employees participating in CITEP. Private sector employees participating in CITEP are entitled to all benefits afforded to similar employees of their respective lending organizations, including medical care, according to subscribed plans and Worker’s Compensation for injuries sustained in the line of duty. Business Training and Travel Expenses: The receiving organization (recipient of the CITEP participant) may pay for any business training and travel expenses incurred by the employee while participating in CITEP. The employee shall provide vouchers and all supporting receipts to the receiving organization for review and approval. Prohibition: A private sector organization may not charge the DoD or any agency of the federal government, as direct or indirect costs under a federal contract, for the costs of pay or benefits paid by that organization to an employee assigned to a DoD Component for the period of the detail. Application Process: If you meet the eligibility requirements above and are interested in participating in CITEP, apply on the program website at https://www.dodemergingtech.com/dod-programs/cyber-information-technology-exchange-program-citep/. If you have any questions, please contact the program mailbox at osd.mc-alex.dod-cio.mbx.askcitep@mail.mil."
year_published = 2025
