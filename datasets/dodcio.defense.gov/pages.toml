["https://dodcio.defense.gov/Home/PublicUseNotice.aspx"]
title = "Government Website Public Use Notice of Limitations"
full_description = 'Government Website Public Use Notice of Limitations Department of Defense (DoD) motion and still media files, hereafter referred to as Visual Information (VI), are provided on this website as a public service by the DoD consistent with the DoD’s Principles of Information, http://archive.defense.gov/admin/prininfo.aspx. Policy on use of VI containing military persons, places, and things, regardless of its origin, for commercial advertisement, marketing, promotion, solicitation, or fundraising purposes is found at http://www.dimoc.mil/resources/dodInstructions.html. No Representations or Warranties. DoD makes no representations or warranties of any kind regarding the suitability of DoD VI for non-DoD purposes. Use of DoD VI is at the user’s sole risk. Publicity and Privacy Rights. VI postings by the DoD do not waive any publicity or privacy rights of any individuals portrayed. Intellectual Property Restrictions. Military Department and other DoD component names, insignia, seals, symbols and similar marks may be protected as trademarks or service marks and may not be used in commerce without prior written permission. DoD Component Trademark Licensing Office contacts may be found at http://www.defense.gov/Media/trademarks/. In general, DoD VI that are works of authorship prepared by U.S. Government employees as part of their official duties are not eligible for copyright protection in the United States. However, some of the DoD VI available on this publicly accessible website may be subject to copyright or other intellectual property rights owned by non-DoD parties, regardless of whether the VI is marked with a copyright notice or other indication of non-DoD ownership or interests. Any use of this DoD VI other than as expressly authorized in this notice may subject the user to legal liability, including liability to such non-DoD owners of intellectual property or other protectable legal interests. Non-Endorsement Requirements and Disclaimer. DoD VI may not be used in a manner that could imply endorsement of an individual, for-profit business, non-profit organization, or any other non-Federal entity (including DoD contractors), product, or service. This applies to both domestic and international users. Endorsement of a non-Federal entity, event, product, service, or enterprise may be neither stated nor implied. ALL users of DoD VI are requested to display the following non-DoD endorsement disclaimer: "The appearance of U.S. Department of Defense (DoD) visual information does not imply or constitute DoD endorsement." Commercial Use Defined: Use of VI by any individual or entity for advertisements, marketing, promotion, solicitation, or fundraising purposes regardless of whether the user is a for-profit business, business industry organization, or non-profit organization, including an educational institution. Commercial use includes a particular individual posting VI on an internet-based capability that could then be distributed further, regardless of original intent. Commercial use does not include activities described as “Productions Authorized for DoD Assistance” below. Commercial Use Authorized. To the maximum extent practicable, all commercial uses are required to display the non-DoD endorsement disclaimer above. Commercial users are also requested to obscure all distinctive U.S. military markings (e.g., tail or hull number, unit insignia, Service name) and other indicia that could connote DoD endorsement from DoD aircraft, missiles, ships, and other hardware or uniforms that may be used in any marketing or advertising campaign, to include any collateral products. Productions Authorized for DoD Assistance. DoD VI obtained for use in a third-party production (e.g., motion pictures, documentaries, television and video productions) for which the Assistant to the Secretary of Defense for Public Affairs has authorized production assistance is governed under separate authority and project-specific terms pursuant to DoD Instruction 5410.16, and shall not be considered either Commercial Use or Non-Commercial Use, as described and authorized above.'
