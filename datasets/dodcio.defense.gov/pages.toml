["https://dodcio.defense.gov/About-DoD-CIO/bios/dean"]
title = "Mr. Dean"
full_description = "Mike Dean Director, Command, Control and Communications Infrastructure (C3I) Office of the Department of Defense (DoD) Chief Information Officer DOWNLOAD HI-RES Mr. Mike Dean became a member of the Senior Executive Service (SES) in 2024. He currently serves as Director, Command, Control, and Communications Infrastructure (C3I) office of the Department of Defense Chief Information Officer (DoD CIO). In this position, he leads the governance, oversight and policy development of DoD tactical communications, tactical data links, combat identification systems, public safety communications, satellite communications, positioning, navigation and timing, and mobility/5G systems. Previously, Mr. Dean served as Satellite Communications (SATCOM) Division Chief for C3I, providing technical expertise, oversight and broad guidance on policy, programmatic and technical issues relating to DoD SATCOM as well as serving as the DoD CIO’s focal point for international partnership activities in SATCOM to include the NATO SATCOM Services 6th Generation (NSS6G) activities. Before joining federal government service, Mr. Dean served as a career Army Signal Corps and Cyberspace officer for more than 27 years (including multiple command positions and combat deployments within the 82d Airborne Division and finally as the Space Branch Chief in the Joint Staff J6). Following his military career, Mr. Dean served as a defense contractor in multiple roles supporting the DoD CIO in satellite communications and information enterprise management. One of Mr. Dean’s most notable roles in DoD SATCOM was the architectural development and digital modernization of Enterprise SATCOM Management and Control. This enterprise architecture is currently being implemented by a DoD-wide plan endorsed in December 2022 by the principal leadership of the DoD CIO, U.S. Space Command, and the U. S. Space Force. Mr. Dean holds a Bachelor of Science Degree in Information Systems Management from Western International University, a Master of Arts in History from Western Illinois University and he is a 2023 alumni of the Federal Executive Institute’s “Leadership in a Democratic Society” course."
year_published = 2025
