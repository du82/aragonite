["https://dodcio.defense.gov/Cyber-Workforce/CWM.aspx"]
title = "Management"
full_description = "MANAGEMENT Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us Cyberspace Workforce Management The Department of Defense (DoD) must be able to effectively structure, develop, and retain the cyberspace workforce to overcome new and evolving challenges posed by our adversaries. In support of these objectives, the DoD Cyberspace Workforce Strategy (DCWS) was signed by the Deputy Secretary of Defense in 2013. The DCWS provides overarching guidance for transforming the cyberspace workforce of military (active/reserve) and civilian personnel according to six strategic focus areas, which include approaches to recruit, train and retain staff in a competitive national environment. A critical element of Focus Area 1 directs the development of the DoD Cyber Workforce Framework and a cohesive set of associated DoD workforce management issuances. The DoD 8140 policy set unifies the overall cyberspace workforce and establishes specific workforce elements (i.e., cyberspace information technology (IT), cybersecurity, cyberspace effects, intelligence (cyberspace), cyberspace enablers) to align, manage, and standardize cyberspace work roles and baseline qualification requirements. This evolution in cyberspace workforce management will better allow the Department to build and maintain a cyberspace workforce that can respond to dynamic mission needs. The Cyberspace Workforce Elements are defined in DoDD 8140.01 Cyberspace Workforce Management as: Cyberspace IT Workforce: Personnel, who design, build, configure, operate, and maintain IT, networks, and capabilities. This includes actions to prioritize portfolio investments; architect, engineer, acquire, implement, evaluate, and dispose of IT as well as information resource management; and the management, storage, transmission, and display of data and information. Cybersecurity Workforce: Personnel who secure, defend, and preserve data, networks, net-centric capabilities, and other designated systems by ensuring appropriate security controls and measures are in place, and taking internal defense actions. This includes access to system controls, monitoring, administration, and integration of cybersecurity into all aspects of engineering and acquisition of cyberspace capabilities. Cyberspace Effects Workforce: Personnel who plan, support, and execute cyberspace capabilities where the primary purpose is to externally defend or conduct force projection in or through cyberspace. Intelligence Workforce (Cyberspace): Personnel who collect, process, analyze, and disseminate information from all sources of intelligence on foreign actors’ cyber programs, intentions, capabilities, research and development, and operational activities. Cyberspace Enablers: Personnel who support or facilitate the functions of cyberspace IT, cybersecurity, cyberspace effects, and/or intelligence workforce (cyberspace) work roles. For additional information, please visit the DoD (DISA) Cyber Exchange DoD 8140 Home Page at the following links: https://public.cyber.mil/wid/dod8140/ https://cyber.mil/wid/dod8140/"
