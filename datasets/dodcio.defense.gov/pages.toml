["https://dodcio.defense.gov/Cyber-Workforce/CITEP"]
title = "CITEP"
full_description = "CITEP Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us DoD Cyber Information Technology Exchange Program (CITEP) The DoD CITEP authorizes the temporary exchange between GS-11 equivalent or higher DoD civilian and private sector employes who work in the cybersecurity or information technology (IT) fields. These exchanges allow DoD civilian and private sector employees to hone or develop their cybersecurity and IT competencies and technical skills through structured experiences. The DoD CITEP provides a unique opportunity for DoD Components and private sector organizations to share best practices, gain a better understanding of cross-sector information technology operations and challenges, and gain exposure to a different organization’s processes. The DoD CITEP is focused on achieving the following objectives: Enhance the cybersecurity and IT competencies and technical skills of DoD and private sector employees through defined and meaningful experiences; Exchange knowledge, experience, and skills between the DoD and private sector; and Bridge the culture and priority gaps between the DoD and private sector. For more information about the program, or about employee or organization participation please visit: https://www.dodemergingtech.com/dod-programs/cyber-information-technology-exchange-program-citep/ or contact the program mailbox at osd.mc-alex.dod-cio.mbx.askcitep@mail.mil. DoD CITEP Authorizations Section 1110 of the National Defense Authorization Act (NDAA) for Fiscal Year (FY) 2010 authorized the pilot program for the temporary exchange of IT personnel, referred to as the Information Technology Exchange Program. Section 1123 of the NDAA for FY 2017 amended Section 1106 of the NDAA for FY 2014 by adding the term “Cyber and” before “Information”; therefore, renaming the program to the Cyber and Information Technology Exchange Program (CITEP). Section 1112 of the NDAA for FY 2023 extends the CITEP through December 31, 2026. DoD CITEP Participant Interview"
year_published = 2025
