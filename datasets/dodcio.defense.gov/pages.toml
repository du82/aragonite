["https://dodcio.defense.gov/About-DoD-CIO/Organization/DCIO-R-A"]
title = "Chief Information Officer > About DoD CIO > Organization > DCIO R&A"
full_description = "DCIO Resources & Analysis DCIO R&A underpins all of DoD CIO's priority areas by managing and overseeing the DoD IT & Cyberspace budget Leadership Ms. Christine Condon is the Deputy CIO (DCIO) for Resources & Analysis (RA), where she helps the organization serve as the DoD CIO focal point for the PPB&E process, including overseeing the development of the Department’s information technology and cybersecurity budget and associated budget justification materials provided to both the Office of Management and Budget and Congress. She also monitors and analyzes congressional activities and legislation as they affect command and control, communications, spectrum, IT, and defensive cybersecurity, as well as related issues and programs. Mr. Mark Gorak is the Principal Director (PD DCIO) for Resources & Analysis (RA). In this role, he ensures that IT and cyber priorities are appropriately resourced throughout DoD – including by the military Services, the Defense Information Systems Agency (DISA) and within DoD CIO. DCIO(R&A)'s Responsibilities The organization is comprised of four directorates: Administration and Management: Manages a variety of support services for the DoD CIO, to include human capital management (manpower, staffing, evaluations, awards, payroll, timekeeping, etc.); security (personnel, physical, industrial, etc.); facilities (government-owned and leased space); information technology (VTCs, laptops, cell phones, etc.); training; travel; supplies; process improvement, automation; and Morale, Welfare, and Recreation. CIO Statutory Implementation: Dedicated to ensuring the effective implementation of IT-related mandates across key areas to include records management, Section 508 compliance, privacy impact assessments, Freedom of Information Act (FOIA) compliance, knowledge management initiatives, and supporting the Department in Government Accountability Office (GAO) and Department of Defense Inspector General (DoD IG) audit responses. Resources, Program, and Budget (RPB): Oversees DoD CIO’s internal and external PPBE activities, such as managing the DoD IT/CA budget submission to the Office of Management and Budget and Congress; DoD CIO’s statutory budget certification; DoD CIO Capability Programming Guidance; and budget formulation and execution. Workforce Innovation: Implements initiatives to transform the DoD's cyberspace workforce in alignment with U.S. national security priorities. Responsible to deploy an agile, capable and ready cyber workforce. People remain our greatest asset, and by changing the way we identify, recruit, develop, and retain the workforce, we are setting the Department up for the capability to adapt and overcome any challenge that the DoD may face, today, tomorrow, or 10 years from now. Overview The Deputy Chief Information Officer (DCIO) for Resources and Analysis (R&A) enables the Department of Defense Chief Information Officer to effectively manage the Department's information technology (IT), cyberspace activities (CA), and command, control, and communications spending. The focus is on modernization of the Department of Defense’s digital environment to afford the Joint Force a competitive advantage in the modern battlespace. Other key responsibilities include monitoring and analyzing congressional cyber and IT workforce activities and legislation; serving as the focal point for planning, programming, budgeting, and execution (PPBE) processes; human resources administration and management; and responsible for the Departments digital and cyber workforce policy, strategy, and development integrator. DCIO(R&A) ensures the DoD receives the most value from its IT investments and equips warfighters with the necessary tools to accomplish their missions. Strategic Importance By managing and overseeing the DoD's IT/CA budget, DCIO(R&A) underpins all DoD CIO's priority areas. This enables the DoD CIO to provide effective strategy, leadership, and guidance in creating a unified information management and technology vision for the Department. Ultimately, this ensures warfighters have the essential IT/cybersecurity, secure communications equipment, and capabilities they need to successfully execute their missions. Initiatives IT Budget Workforce Records Management Strategy Section 508 Privacy Impact FOIA"
year_published = 2025
clearnet = "https://dodcio.defense.gov/About-DoD-CIO/Organization/DCIO-R-A"
