ernize the DoD Information Enterprise. Among the activities covered are network optimization across Defense Agencies and DoD Field Activities, cloud and software modernization adoption across the Department, and better implementation of collaboration and productivity capabilities across the defense workforce. In partnership with the other DCIOs and DoD Components at large, the efforts of the DCIO IE team are foundational to achieving successful IT outcomes across a diverse range of operational missions and ensures that information remains one of our nation’s greatest sources of power. DCIO IE's directorates include DoD Information Network Modernization, focused on advancing DoD communications capabilities globally; Enterprise Capabilities, focused on driving adoption of proven infrastructure technologies (e.g., cloud and modern software development); and the Cloud Computing Program Office (CCPO), focused on the acquisition and execution of enterprise cloud programs. As digital capabilities become increasingly critical in mission success, the DCIO IE organization will continue to press and act on priorities that ensure the Department’s military edge."
