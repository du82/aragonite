["https://dodcio.defense.gov/AboutDoDCIO/Organization/DCIOCS.aspx"]
title = "Chief Information Officer > About DoD CIO > Organization > DCIO CS"
full_description = '''DCIO Cybersecurity DCIO CS oversees the Department's cybersecurity policies and programs to preserve U.S. Military advantage and defend U.S. interests Leadership Ms. Katherine "Katie" Arrington is the Deputy CIO (DCIO) for Cybersecurity (CS) within the Department of Defense (DoD). Ms. Arrington provides expert policy, technical, program, and Defense-wide oversight on all aspects and matters related to DoD Cybersecurity. She oversees the integration of Defense-wide programs to protect the Department’s critical infrastructure against advanced persistent threats, and assures coordination of cybersecurity standards, policies, and procedures with other federal agencies, coalition partners, and industry. Mr. Gurpreet Bhatia is the Principal Director CIO (PD DCIO) and Acting Chief Information Security Officer (CISO) for Cybersecurity (CS). Mr. Bhatia is responsible for ensuring the department has a well-defined and well-executed $8 billion cybersecurity program. He is responsible for coordinating cybersecurity standards, policies and procedures with other federal agencies, coalition partners and industry. KEY INITIATIVES DoD Cyber Landscape Risk Management Framework Defense Industrial Base Cybersecurity DoD Cyber Landscape and References Overview Deputy Chief Information Officer for Cybersecurity provides expert policy, technical, program, and Defense-wide oversight on all aspects and matters related to DoD Cybersecurity. The office oversees the integration of Defense-wide programs to protect the Department's critical infrastructure against advanced persistent threats, and assures coordination of cybersecurity standards, policies, and procedures with other federal agencies, coalition partners, and industry. The DCIO CS priority is to support the Department's Cyber Strategy and DoD CIO's Vision to deliver an information dominant domain to defeat our Nation's adversaries. Policies and programs are designed to: Ensure the Joint Force can achieve its missions in a contested cyberspace environment Strengthen the Joint Force ability to conduct cyberspace operations that enhance U.S. military advantages Supports the defense of U.S. critical infrastructure from malicious cyber activity that alone, or as part of a campaign, could cause a significant cyber incident Secure DoD information and systems against malicious cyber activity, including DoD information on non-DoD-owned networks Expand DoD cyber cooperation with interagency, industry, and international partners'''
year_published = 2025
