["https://dodcio.defense.gov/About-DoD-CIO/Bios/Dunlap.aspx"]
title = "Mr. Dunlap"
full_description = "William R. Dunlap Jr. Deputy Chief Information Officer for Information Enterprise for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Mr. William (Bill) R. Dunlap, Jr. serves as the Deputy Chief Information Officer for the Information Enterprise (DCIO IE). In this role, he develops and implements strategic direction and defense-wide policy guidance to modernize the Department’s digital infrastructure that enables the full range of defense operations. He leads a dynamic team of military, civilian, and contractor personnel to collaboratively drive toward a state-of-the-art digital experience for the warfighter. Prior to this role, Mr. Dunlap served as the Chief Information Officer and Director, Information Technology Directorate, for the Defense Advanced Research Projects Agency (DARPA). In this capacity, he was responsible for day-to-day operations of DARPA networks at multiple classifications and for IT policies and procedures in the execution of IT requirements. He provided IT portfolio oversight and ensured that DARPA’s IT capabilities aligned with mission requirements and agency operations. Over his 20-year tenure at DARPA, Mr. Dunlap held various roles, to include Chief of Classified IT Operations and DARPA SAP CIO, covering a full range of technology experience from system administration to network operations. He joined DARPA after having served in the Air Force as a Security Forces member. Mr. Dunlap holds a Bachelor of Science in Computer Science from Clemson University, Clemson, SC. Mr. Dunlap is married and has two children, with one currently in college and the other in high school."
