["https://dodcio.defense.gov/About-DoD-CIO/bios/smitha"]
title = "Mr. Smith"
full_description = "Anthony Smith Acting Deputy Chief Information Officer for Command, Control, & Communications, Office of the Secretary of Defense, Chief Information Officer DOWNLOAD HI-RES Mr. Smith currently serves as the Acting Deputy Chief Information Officer for Command, Control, and Communications (C3), Office of the Secretary of Defense, Chief Information Officer. He provides strategic direction, policy guidance, and oversight to enable the Department to effectively define, prioritize, acquire, govern, manage, and implement C3 capabilities in support of DoD operations. As Acting DCIO, Mr. Smith provides policy and guidance to execute Principle Staff Assistant responsibilities for: spectrum; communications systems and networks; C2 and coalition information sharing capabilities; Position, Navigation and Timing (PNT); Tactical Network Management; Waveform Management; and Enterprise Mobility. He leads teams responsible for the horizontal and vertical integration of operational level C2 and strategic command, control and communications, supporting joint and coalition concepts of operations. Previously Mr. Smith served as Director, DOD Information Network (DODIN) Transport Capabilities, where he led the modernization of DOD networks, radio systems, satellite gateways, regional cybersecurity defenses, and airborne intelligence, surveillance and reconnaissance communications and dissemination capabilities. Mr. Smith retired as a Colonel in the United States Air Force, serving from 1983 to 2009. After completing Basic Communications Officer Training at Keesler Air Force Base, he served with the 1st Combat Communications Group at Lindsey Air Station, Germany. He then moved to Hurlburt Field, Florida, as Chief, C4 Architecture and Requirements, Air Force Special Operations Command. During this tour he led Air Force Special Operations communications teams during Desert Shield and Desert Storm. In 1992 he returned to Europe where he was Chief Network Integration and Testing Branch, Headquarters USAFE, Ramstein AB, Germany. In 1996 he attended Air Command and Staff College at Maxwell Air Force Base. In 1997 he transferred to Tinker Air Force Base as Commander of the 32d Combat Communications Squadron. In 1999 he was assigned to United States Special Operations Command as Chief of their C4 Modernization Division. In 2002 he took command of the 21st Space Communications Squadron at Peterson AFB. After graduating from the National War College in 2005 he was assigned to The Joint Staff, serving as Chief, Assured Information Sharing Division, Command, Control, Communications and Computer (C4) Systems Directorate. Following Joint Staff, Col Smith served a one year remote assignment in Djibouti, Africa as the Director of C4 Systems, Combined Joint Task Force, Horn of Africa. Upon retirement from the military, Mr. Smith transitioned to Civilian Service as Deputy, Strategic Engagement Division, The Joint Staff. In 2012, he moved to the C4 Systems Directorate, Assistant Secretary of Defense, for Networks and Information Integration. He received a Bachelor of Science Degree in Manufacturing Engineering Technology in 1984 at Western Washington University, a Master of Science Degree in Management in 1992 at Troy State University, and a Master of Science in National Security Strategy in 2005 at National War College. Mr. Smith was selected as Headquarters USAFE/SC Company Grade Officer of the Year for 1993, the C4 Professionalism Award Winner for USAFE and USAF in 1993, won the 1997 Air Defense University award for excellence in research, and was selected as a 2020 Federal 100 Award Winner, recognizing him as a top IT professional in the Federal Government."
year_published = 2025
