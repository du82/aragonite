["https://dodcio.defense.gov/About-DoD-CIO/bios/vyas"]
title = "Ms. Vyas"
full_description = "Sudha Vyas Chief Cybersecurity Architect for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Ms. Sudha Vyas assumed the position of Chief Cybersecurity Architect, Department of Defense Chief Information Officer for Cybersecurity in December 2020 where she is responsible for the Department’s Cybersecurity Reference Architecture and strengthening the collaboration and partnership across the Government and Industry. Prior to her current position, Ms. Vyas assumed the dual position as the Naval Information Warfare Command (NAVWAR) Acting Assistant Chief Engineer for Mission Architecture and the Assistant Chief Engineer for Mission Assurance and Certification from January to December 2020. During this timeframe, Ms. Vyas also continued her role as the Director for NAVWAR Cybersecurity Division where she led cyber related efforts from cybersecurity transformational initiatives to include leveraging model based systems engineering to conduct cyber risk assessments, instituting cyber data analytics, standards in direct support of the Navy Information Technology and Cybersecurity Technical Authority to ensure warfighting mission success in a cyber-contested environment. Ms. Vyas also led the cyber risk and resiliency initiative for the DON CISO under the DON CIO’s Information Superiority Vision. Prior these assignments, Ms. Vyas was the Deputy Division Director and the NAVWAR Cybersecurity Safety (CYBERSAFE) Program Director from May 2015 to September 2017. In this position, Ms. Vyas led and managed the execution the NAVWAR CYBERSAFE program to provide maximum reasonable assurance of survivability and resilience of mission critical information technology in a cyber-contested environment in order to maintain mission capabilities. Ms. Vyas was also responsible for leading Navy’s first cross-SYSCOM Cyber Platform Risk Assessment. Prior to NAVWAR, Ms. Vyas assumed the position of the Director, Standards and Assessments, Joint Tactical Networking Center (JTNC) in July 2014. In this position, Ms. Vyas led and managed the DoD Waveform Standards and Software Communications Architecture, Small Business Innovative Research (SBIR) program, and Technical Compliance and Certification Assessments of DoD Waveform Information Repository products. Ms. Vyas also served as the Technical Director and the Technology Protection Officer for JTNC. Ms. Vyas also served various technical positions within the Joint Program Executive Office (JPEO) for the Joint Tactical Radio System (JTRS) as the Assistant Executive Director of Enterprise Issue Resolution, Program Protection Officer, and Information Assurance Manager for the Network Enterprise Domain (NED) JTRS. Before serving with the Department of the Navy, Ms. Vyas served in various technical and leadership positions within industry. While at Systems Research Applications, International she was the Access Control Lead for the Federal Deposit Insurance Corporation responsible for ensuring the integrity and availability of over 7,000 institutions. During her assignment with Signals Solutions, Inc., she was Lead Analyst for Commander Operational Test and Evaluation Force responsible for planning, coordinating, and directing U.S. Pacific Command and U.S. Forces Korea in joint and coalition information assurance and interoperability exercises. While working for Raytheon Network Centric Systems she led the information technology managed services for the Transportation Security Agency’s (TSA) security team in implementing an incident response team and reporting and notification process. Additionally, Ms. Vyas served as Security Operations Center (SOC) manager providing strategic vision and leadership for the revolutionary $6.8B Navy/Marine Corps Intranet (NMCI) program designed to consolidate all Naval network and information assurance operations management at three central network secure operations facilities. Ms. Vyas was born in Bethesda, Maryland. She holds a Bachelor of Science in Mechanical Engineering from The Catholic University of America and holds her Defense Acquisition Workforce Improvement Act (DAWIA) Program Management Level III certification and Engineering Level III certification."
year_published = 2025
