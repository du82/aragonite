["https://dodcio.defense.gov/Cyber-Workforce/Cyber-Service-Academy"]
title = "DoD Cyber Service Academy"
full_description = "CYBER SERVICE ACADEMY Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us DoD Cyber Service Academy (DoD CSA) The DoD CSA is both a scholarship program for the DoD, and a capacity building tool for the nation. The program is a result of commitment from DoD and Congress to support higher education as a means to prepare the DoD workforce to deal with threats against the Department’s critical information system and networks. The DoD CSA is authorized by Chapter 112 of U.S.C., Section 2200, designed to encourage the recruitment of the nation’s top cyber talent and the retention of DoD personnel who have skills necessary to meet DoD’s cyber requirements and help secure our nation against threats of information systems and networks. Provide scholarships to students in pursuit of cyber-related degrees at National Centers of Academic Excellence in Cybersecurity (NCAE-C). NCAE-C institutions can be designated in any of three areas: Cyber Defense, Research, or Cyber Operations. For more information please visit: https://public.cyber.mil/wid/csa/"
