["https://dodcio.defense.gov/About-DoD-CIO/bios/franzen"]
title = "Mr. Franzen"
full_description = "Robert Franzen Acting Chief of Staff Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Mr. Robert Franzen, Jr is the Acting Chief of Staff in the Office of the Department of Defense (DoD) Chief Information Officer (CIO). In this role, he manages the legislative, governance, and executive secretariat portfolios. In addition, he manages the public affairs, industry engagements, and international portfolios while overseeing day-to-day operations for the DoD CIO. Prior to joining CIO, Mr. Franzen served as the Director of the Financial Business Planning, Programs, and Analysis Division for the Defense Contract Management Agency (DCMA). Mr. Franzen led the strategic Planning, Programming, Budget, and Execution (PPBE) analysis for DCMA’s annual Program Budget Review (PBR) in compliance with provisions of DoD Directive 7045.14. Mr. Franzen provided oversight of Business Analysis and support activities for Agency-wide financial and resource management activities. He also served as the Agency Risk Management Internal Control Program Manager under the provisions of OMB Circular A-123 and DoDI 5010.40. Mr. Franzen possesses over 37 years of combined military and government civilian experience specializing in both Program and Financial Management. In 1987, he began his United States Air Force career as a Crew Chief on the A-7 Corsair II, followed by the F-16 Fighting Falcon fighter aircraft. In 1998 he transitioned into information technology (IT) and communications, specializing in Voice and Data IT/Communications Installation/Maintenance, Intrusion Detection/Video Information, and IT Program Management, retiring in 2008. Special assignments included serving at the Defense Information Systems Agency (DISA) in support of the White House Communications Agency (WHCA) where he received the Defense Meritorious Service Medal while serving as the project manager over several critical Presidential Communications Upgrade Projects that were the very cornerstone of the Presidential Communications Modernization (PCM). As the Program Management Control Officer for PCM, Mr. Franzen oversaw 40 plus critical IT projects. Mr. Franzen began his DCMA tenure in 2011 in the Earned Value Management Center as the Mission Support Chief. Mr. Franzen later transitioned to the IT Directorate as the Acquisition Insight Portfolio Manager and Defense Business System (DBS) Program Manager for the Earned Value Analytics System. In 2018, Mr. Franzen was assigned to the DCMA Office of the Director, Cooperate Operations Division where he served as the Independent Advisor to the DCMA Director, other Senior Leaders, and the Compliance Verification Team (CVT) Lead for compliance with policy governing IT DBS procurement and system acquisitions. Mr. Franzen also served as the sole Acquisition Review Board IT signatory during this assignment. Under the leadership of Mr. Franzen, the CVT ensured execution, compliance, and best value of the Agency's entire IT acquisition portfolio composed of 150 acquisition efforts. Mr. Franzen received the Meritorious Civilian Service Award for his contributions during this assignment. Mr. Franzen holds two degrees; an Applied Science in Aviation Maintenance Technology and an Applied Science in Electronic Systems Technology. Other certifications include DoD Certified Acquisition Professional Program Management Level III and certified DoD Financial Manager Level III."
year_published = 2025
