["https://dodcio.defense.gov/About-DoD-CIO/Bios/Arrington"]
title = "Ms. Arrington"
full_description = "Katherine Arrington Deputy Chief Information Officer for Cybersecurity for the Department of Defense, Office of the Chief Information Officer DOWNLOAD HI-RES Ms. Katherine “Katie” Arrington serves as the Deputy DoD Chief Information Officer for Cybersecurity (DCIO(CS)). In this role she provides expert policy, technical, program, and defense-wide oversight support to the DoD CIO on all cybersecurity matters. She is responsible for leading the DoD-wide cybersecurity program and associated governance processes. She partners with industry to improve cybersecurity and information sharing through the Defense Industrial Base (DIB) and represents the Secretary of Defense and DoD CIO in international discussions and negotiates cybersecurity topics in both bilateral and multi-lateral (alliance and coalition) channels. She leads the development of the cybersecurity investment priorities for the Department and provides planning guidance to Components. Before assuming her position as DoD DCIO(CS), Ms. Arrington was the Senior Vice President of External Affairs at Exiger, where she mobilized issues of universal consensus, including supply chain visibility, AI and national security. She also ran for election to the U.S. House of Representatives for South Carolina's 1st Congressional District in 2022. A leading expert in policy and technology with extensive experience building relationships and coalitions across the public, private and nonprofit sectors, Ms. Arrington was the first DoD CISO for the Office of the Undersecretary of Defense for Acquisition and Sustainment (OUSD(A&S)). She served as the central hub and integrator within OUSD(A&S) to align acquisition and sustainment cyber strategy and efforts to enhance cyber security within the Defense Industrial Base. She led the White House COVID-19 Supply Chain Task Force for Acceleration as well as the team that created the Cybersecurity Maturity Model Certification (CMMC). Prior to her role as CISO for OUSD(A&S), Ms. Arrington had an extensive career as a legislator and senior cyber executive in private industry. She was a 2018 candidate for the US House of Representatives for South Carolina and served for two terms as a South Carolina State Representative. She has extensive experience in cyber strategy, policy, enablement, and implementation across a wide range of business sectors and governmental levels. She has over 15 years of cyber experience acquired through positions at Booz Allen Hamilton, Centuria Corporation, and Dispersive Networks. These positions have given her a unique experience of supporting and working with the government at large, small, and non-traditional contracting firms."
