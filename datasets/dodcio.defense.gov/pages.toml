["https://dodcio.defense.gov/Cyber-Workforce/CES.aspx"]
title = "Cyber Excepted Service"
full_description = "CYBER EXCEPTED SERVICE Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us DoD Cyber Excepted Service (CES) Personnel System Section 1599f of Title 10, Chapter 81, U.S.C. authorizes the Department of Defense (DoD) to establish the Cyber Excepted Service (CES) personnel system as an Enterprise-wide approach for managing civilian cyber professionals. By providing the needed agility and flexibilities for the recruitment, retention, and development of high quality cyber professionals, the CES will enhance the effectiveness of the Department’s cyber defensive and offensive mission. In partnership with the Principal Cyber Advisor (PCA), the Office of the Under Secretary of Defense for Personnel & Readiness (USD(P&R)), and the Office of the Under Secretary of Defense for Intelligence (USD(I)), the Office of the DoD CIO developed the first four policies for implementing this new personnel system. Upon the Department’s issuance of the personnel policies, CES implementation and hiring will begin with Phase 1 organizations- U.S. Cyber Command, Joint Forces HQ DoD Information Networks, and DoD CIO Cybersecurity. After the conclusion of Phase 1, Phase 2 implementation will occur at the Defense Information Systems Agency (DISA) Headquarters (Ft. Meade) and the Service Cyber Components. Ongoing Department cyber mission assessment activities may identify other organizations for CES in the future and is subject to the fulfillment of collective bargaining obligations as required."
