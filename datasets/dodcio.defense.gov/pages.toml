["https://dodcio.defense.gov/Cyber-Workforce.aspx"]
title = "Overview"
full_description = "OVERVIEW Cyber Workforce Navigation Overview DoD Cyber Workforce Cyber Workforce Strategies DoD Cyber Workforce Framework (DCWF) Cyber Workforce Management Cyber Excepted Service Personnel System (CES) Chief Digital and AI Officer (CDAO) College of Information and Cyberspace (CIC) Cyber Service Academy (CSA) Cyber Information Technology Exchange Program (CITEP) Info For DoD Participants Info For Industry Participants Useful Resources Resources Contact Us Today’s world is fast moving, connected, and highly-contested. In the face of cyberspace warfare by the most capable adversaries, the Department of Defense must ensure dependable mission execution. To offensively and defensively defend our network, our information systems, and our data in order to protect a wide range of critical services, we must have a knowledgeable and skilled DoD Cyberspace Workforce that can adapt to the dynamic cyber environment and adjust resources to meet mission requirements. The DoD Cyber Workforce Framework (DCWF) is helping to transform our workforce focus from solely information assurance to a more inclusive focus comprised of personnel who build, secure, operate, defend, and protect DoD and U.S. cyberspace resources, conduct related intelligence activities, enable future operations, and project power in or through cyberspace. Additionally, specific acquisition, training and education, legal/law enforcement and leadership jobs are now considered part of the DoD Cyber Workforce. The five Cyberspace Workforce Elements are: Cyberspace IT Workforce Cybersecurity Workforce Cyberspace Effects Workforce Intelligence Workforce (Cyberspace) Cyberspace Enablers A qualified DoD cyberspace workforce will be better prepared to defeat highly sophisticated cyberspace adversaries and attract, recruit, and retain the best and brightest individuals by providing opportunities for growth in an environment of unique missions."
year_published = 2025
clearnet = "https://dodcio.defense.gov/Cyber-Workforce.aspx"
