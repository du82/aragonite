["https://dodcio.defense.gov/About-DoD-CIO/bios/Resnick"]
title = "Mr. Resnick"
full_description = "Randy Resnick Senior Advisor, Zero Trust Portfolio Management Office, Department of Defense Chief Information Officer DOWNLOAD HI-RES Mr. Randy Resnick serves as the Director of the newly established Zero Trust Portfolio Management Office within DoD CIO/CS. Mr. Resnick joins us from the National Security Agency (NSA) with over 34 years of experience in offense and defense cybersecurity. In his most recent assignment, Mr. Resnick served as NSA’s Zero Trust Strategic Lead. In that role, Mr. Resnick successfully led and executed numerous ZT activities at the tactical, operational, and strategic levels and also provided NSA leadership during the successful ZT POM 23-27 Issue Paper process. His leadership and technical direction led to the development of the first DoD Zero Trust Reference Architecture, the first NSS Zero Trust Reference Architecture, DoD’s ZT maturity model, DoD’s initial strategy for Zero Trust and the construction of two Zero Trust Innovation testbed labs in collaboration with DISA and USCC. Prior to serving as NSA’s Zero Trust Strategic Lead, Mr. Resnick held positions as their Cybersecurity Innovations Director for the NSA Cybersecurity Directorate, served as Chief of NSA’s Red Team, and served as the Deputy Mission Manager for NC2/NC3/NLCC missions. As the Zero Trust Portfolio Management Office Director, Mr. Resnick’s focus will be to provide strategic guidance, direct alignment of DoD ZT efforts, and prioritize resources to accelerate Zero Trust adoption across the DoD Enterprise while strengthening coordination and collaboration with key partners and stakeholders across the Department, the IC, Interagency, and Industry. A native New Yorker, Mr. Resnick holds a Bachelor of Science degree in Electrical Engineering from Fairleigh Dickenson University and a Master’s Degree in Engineering Management from George Washington University. Mr. Resnick has been married for 25 years and has two daughters, ages 22 and 20, who simultaneously adore him as well as drive him crazy."
year_published = 2025
