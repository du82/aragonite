full_description = "Dojo 1.16 released November 29, 2019UncategorizedDylan Schiemann While the majority of our attention goes into modern Dojo, today we’ve released Dojo Toolkit 1.16.0 which includes a few minor updates contributed over the past few months, as well as patch update releases 1.15.1, 1.14.4, 1.13.5, 1.12.6, and 1.11.8. Implement ES2018 Promise.prototype.finally in dojo/promise/Promise (1.16.0 only, thanks to Roy Tinker) docScroll correction (1.16.0 and backported all the way to 1.8.x, thanks Johannes Hölzl) Updates to handle when a call to obj.getBoundingClientRect() throws an error or returns an empty object (1.16.0, thanks to nmfriesen) request/registry: pass all arguments to matcher (1.16.0, thanks to Mangala Sadhu Sangeet Singh Khalsa) Apply the ViewSource plugin’s filter on the editor’s content (1.16.0 and backported all the way to 1.6.x, thanks to Ed Hager) Fix uglify use with newer node versions (1.16.0, and backported all the way to 1.10.x, thanks to Joerg Sonnenberger) Please let us know if you have any issues with these releases. Enjoy! This Week in Dojo: New Tutorials, Mobile Showcase and more April 4, 2011News, UncategorizediTorrey In the past three weeks SitePen engineers have released a flurry of new tutorials (13 and counting) including two tutorials focused on building Web Apps using Dojo Mobile! Speaking of Dojo Mobile There is now a Dojo Mobile Showcase which shows the various widgets available in Dojo 1.6 and gives a glimpse at what’s coming in Dojo 1.7. Boilerplate Boilerplates are all the rage these days, and sure you can get a sweet HTML5 boilerplate but what about Dojo? Stepping up to the plate is Rebecca Murphy and Colin Snover with their initial release of their Dojo 1.6 boilerplate! View all 4 comments This week in Dojo: 1.6.1, Tutorials and Free Support March 20, 2011UncategorizediTorrey 1.6.1 Released Great news everyone! Dojo 1.6.1 is available for download! While we don’t normally get all excited about a point release, Dojo 1.6.1 brings with it IE9 and Firefox 4 compatibility. We closed 93 tickets to get Dojo working right with IE9 and Firefox 4. Free Dojo Support SitePen is offering Free Dojo Support! If you have a Dojo question you’re just dying to have answered, don’t pass this up. Leave a comment"
