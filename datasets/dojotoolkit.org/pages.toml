full_description = "Dojo 1.16 released November 29, 2019UncategorizedDylan Schiemann While the majority of our attention goes into modern Dojo, today we’ve released Dojo Toolkit 1.16.0 which includes a few minor updates contributed over the past few months, as well as patch update releases 1.15.1, 1.14.4, 1.13.5, 1.12.6, and 1.11.8. Implement ES2018 Promise.prototype.finally in dojo/promise/Promise (1.16.0 only, thanks to Roy Tinker) docScroll correction (1.16.0 and backported all the way to 1.8.x, thanks Johannes Hölzl) Updates to handle when a call to obj.getBoundingClientRect() throws an error or returns an empty object (1.16.0, thanks to nmfriesen) request/registry: pass all arguments to matcher (1.16.0, thanks to Mangala Sadhu Sangeet Singh Khalsa) Apply the ViewSource plugin’s filter on the editor’s content (1.16.0 and backported all the way to 1.6.x, thanks to Ed Hager) Fix uglify use with newer node versions (1.16.0, and backported all the way to 1.10.x, thanks to Joerg Sonnenberger) Please let us know if you have any issues with these releases. Enjoy! About Dylan Schiemann Known for things called Dojo, SitePen, and Comet. View all posts by Dylan Schiemann → Simon says: January 1, 2020 at 1:28 am I think it is amazing how people still care about dojo 1. It shows how great and major the toolkit was (and still is). Fredric Fredricson says: January 11, 2020 at 8:27 am Well, that’s good since with 150kLOC 1.x-code we will not shift to 2.x any time soon. Even if I personally would like to it’s really hard to get a decent ROI on that shift. Dylan Schiemann says: January 11, 2020 at 1:22 pm One of our goals for 2020 is to hopefully find a way to make the transition from 1.x to modern Dojo much easier. Stay tuned! Patrick Gonzalez says: January 4, 2021 at 1:22 pm Is dojo 1.10 still supported? We are trying to determine if we need to move from this release to a newer one. Thanks, Patrick Dylan Schiemann says: January 4, 2021 at 3:06 pm We still provide updates when we can, e.g updates that can get cleanly backported, but the move from 1.10 to anything newer in the 1.x family should be relatively painless as the changes are mostly additive or fixes to bugs."
