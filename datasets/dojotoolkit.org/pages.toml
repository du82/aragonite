title = "Case Studies | The Dojo Toolkit Blog"
full_description = "Case study: Softeco Sismat (TELL ME Project, #2) December 26, 2014Case StudiesDylan Schiemann The large companies that use Dojo are widely known. This series features lesser known users of Dojo, and their stories. Eight months ago, we conducted a case study about the TELL ME project with Stefano Bianchi from Softeco Sismat, an ICT Italian company. Here we have followed with up Stefano to get an update on their progression from desktop web app to mobile with Dojo. TELL ME Mobile UI – login Continue reading Case study: Softeco Sismat (TELL ME Project, #2) → Case study: HPCC Systems July 31, 2014Case StudiesDylan Schiemann The large companies that use Dojo are widely known. This series features lesser known users of Dojo, and their stories. This time, we interview Gordon Smith from HPCC Systems, a subsidiary of LexisNexis RISK Solutions. Q: How did you first learn about Dojo? A: Through Google / Stack Overflow. I suspect my “discovery” of Dojo was a bit different to the norm, as prior to 2013 I had never really done any Web Development. Up until then I was predominantly a C++ Developer, some Java and a smattering of C#. Initially I wanted to knock together a single page proof of concept, consisting of a code editor (CodeMirror), a result view (HTML Table) and an “activity graph” (ActiveX Control) and wanted something that would handle the layout, resizing and ideally something with splitters – after a few searches online I found the Border Container Docs and away I went! Shortly after, I added a Tab Container and switched to using the basic Grid. ECL Playground – How the original POC Looks today Continue reading Case study: HPCC Systems → Case study: FreeNAS June 18, 2014Case StudiesDylan Schiemann The large companies that use Dojo are widely known. This series features lesser known users of Dojo, and their stories. This time, we interview William Grzybowski from iXsystems, a California-based company and creators of FreeNAS. Continue reading Case study: FreeNAS →"
