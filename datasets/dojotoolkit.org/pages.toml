["https://dojotoolkit.org/community/guidelines"]
title = "Community - Dojo Toolkit"
full_description = "Dojo Community Guidelines Community Etiquette We are a community of web development professionals, and conducting ourselves as such raises the community up and moves the project forward with ease. As a contributor to the Toolkit, we ask that you follow these few simple tenets in order to make working with Dojo an enjoyable experience for all: Competence. Contribute when you have the skills, knowledge, and time to do so. Reliability. Show up on time and do what you say you're going to do. Honesty. Tell the truth and be upfront. Integrity. Be consistent in your principles. Respect For Others. Treat people with courtesy and respect. Being Positive. No one likes a constant pessimist. Having an upbeat attitude and trying to be a problem-solver makes a big difference. Supporting Others. Share the spotlight with contributors, take time to show others how to do things properly, and lend an ear when necessary. Goal-Focused. Not letting your personal feelings get in the way of good decisions and spending time on relevant and pragmatic issues. Listening Carefully. People want to be heard, so give people a chance to explain their ideas properly. Rudeness, threats, hostility, and defamation of fellow developers will not be tolerated. Repeat offenders may have their contributor or commiter status revoked if behavior is not corrected upon request. We provide a formal grievance process so that serious issues can be given the consideration they deserve and detrimental effects to the project can be averted. Grievance Process If you have a grievance about something occurring in the community, please follow the OpenJSF Code of Conduct guidelines so that it can be reviewed and addressed. Rudeness, threats, hostility, and defamation of fellow developers are not tolerated, and repeat offenders may be prevented from contributing in the future. Please provide the following information when submitting a complaint: Date Description of grievance Supporting evidence Your name Your email address and/or phone number"
