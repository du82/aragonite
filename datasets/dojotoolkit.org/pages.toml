full_description = "Dojo Winter and Spring 2015 events February 16, 2015EventsDylan Schiemann There are a number of Dojo events this winter and spring. Some of these events are still tentative, so we’ll add links once they are confirmed. We hope to meet you at one of these events. Let us know if there’s an event you would like to host in your area. Dojo Community Day A Dojo community day is planned, but the details are not yet available. Conferences Conferences we’re planning to attend and/or deliver talks. Esri DevSummit, Palm Springs, CA, March 10-13 JSConf, Amelia Island, May 27-29 Esri UK Developer conference, London, May 19 FullStack, London, June 25-26 EdgeConf, London, June 27 Meetups Hong Kong, March 31st Atlanta, TBD Stockholm, May 21st Stuttgart, TBD Copenhagen, TBD Dublin, TBD London, May 18th Ottawa, June 3rd Training Workshops Dojo core and Dojo widgets: The essentials. SitePen. March 9-13, 2015. Online. Paid registration required. Dojo 101 and 201. SitePen. March 16-18. Salt Lake City, UT. Paid registration required. Dojo 101, 201, and 202. SitePen. April 20-24. Chicago, IL. Paid registration required. Dojo 101, 201, and 202. SitePen. April 27 – May 1, 2015. Boston, MA. Paid registration required. Dojo 101, 201, and 202. SitePen. May 18-22, 2015. Amsterdam, NL. Paid registration required. Dojo 101, 201, and 202. SitePen. June 1-5, 2015. Ottawa, ON. Paid registration required. Dojo 101, 201, and 202. SitePen. June 29 – July 3, 2015. London, UK. Paid registration required. Let us know if you’re speaking at an event, and we’ll add you to our listings! About Dylan Schiemann Known for things called Dojo, SitePen, and Comet. View all posts by Dylan Schiemann → Johan Runesson says: February 19, 2015 at 5:38 am I think it would be awesome if you could attend (and speak) on Nordic.js in Stockholm this fall! http://nordicjs.com/ It was an amazing conference last year! Torkil Pedersen says: February 27, 2015 at 1:31 am Hi Dylan, For info is the 15th of May for many in Danmark a forced day off, because we are off alsp teh 14th of May BR Torkil"
