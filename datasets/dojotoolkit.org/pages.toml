["https://dojotoolkit.org/blog/category/announcements"]
title = "Announcements | The Dojo Toolkit Blog"
full_description = "Dojo 1.14 released August 13, 2018AnnouncementsDylan Schiemann While most of our attention recently has gone into the new modern Dojo framework releases, we are still maintaining and updating versions of Dojo 1.x as we receive pull requests and updates. Today we are pleased to announce version 1.14 of the Dojo Toolkit, as well as backported releases 1.13.1, 1.12.4, 1.11.6, and 1.10.10. Note that we will no longer be shipping updated releases prior to 1.10, though you may of course still build your own version from source. Patches are still backported, but the time to push a release for each version is non-trivial. As these releases are smaller in nature, it is fairly easy to look at the commit history to see what has changed. For example, the Dojo package commit history has details about the Dojo package. We did receive two small security related reports. These issues are unlikely to impact most of our users in production, but are worth reviewing: Unescaped string injection in dojox/Grid/DataGrid (CVE-2018-15494), as reported by Moritz Bechler of SySS GmbH DOM Based XSS and JavaScript Injection in DOH reported by B@nSH33!! Updated releases on the Google CDN are forthcoming. Thanks for your help in making this release possible. Please let us know if you have any issues. Note that all bug reports should now be filed on GitHub. Flat theme moves in preparation for Dojo 2 January 15, 2018AnnouncementsDylan Schiemann In preparation for Dojo 2’s themes, we have decided to move dojo/themes to dojo/dijit-themes . The dojo/themes repository will now be used for the new themes in Dojo 2. Dojo 2 beta 4, 1.13, and Discourse December 14, 2017AnnouncementsDylan Schiemann Dojo 2 beta 4 Dojo 2 beta 4 was recently released! Read more about the release on the Dojo 2 beta 4 blog post! The new website for Dojo 2+ also has a number of tutorials and examples to help you get started with Dojo 2. Dojo 1.13 Also note that Dojo 1.13 and point releases to 1.12, 1.11, and 1.10 were also recently released and are now also available on the Google CDN. Dojo Discourse Finally, the Dojo mailing list has been retired. Questions may be asked on our new Dojo Discourse forum, Dojo 1.x Gitter channel, or Stack Overflow."
