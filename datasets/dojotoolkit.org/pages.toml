quired Conferences EdgeConf. September 20, Dylan Schiemann, SitePen. San Francisco. Paid registration required. FullStack. October 23-24, Dylan Schiemann, SitePen. London, UK. Paid registration required Training Workshops Dojo 101, 201, and 202. SitePen. September 22-26, 2014. Ottawa, ON. Paid registration required. Dojo 101, 201, and 202. SitePen. October 6-10, 2014. London, UK. Paid registration required. Dojo 101, 201, and 202. SitePen. October 6-10, 2014. Atlanta, GA. Paid registration required. Dojo 101, 201, and 202. SitePen. January 12-16, 2015. Chandler, AZ. Paid registration required. Dojo 101, 201, and 202. SitePen. February 23-27, 2015. Washington, DC. Paid registration required. Dojo 101, 201, and 202. SitePen. March 2-6, 2015. Amsterdam, NL. Paid registration required. Let us know if you’re speaking at an event, and we’ll add you to our listings!"
