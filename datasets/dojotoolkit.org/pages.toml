full_description = "Flat theme moves in preparation for Dojo 2 January 15, 2018AnnouncementsDylan Schiemann In preparation for Dojo 2’s themes, we have decided to move dojo/themes to dojo/dijit-themes . The dojo/themes repository will now be used for the new themes in Dojo 2. About Dylan Schiemann Known for things called Dojo, SitePen, and Comet. View all posts by Dylan Schiemann → Christoph says: January 15, 2018 at 10:43 am You probably mean https://github.com/dojo/themes/ will now be used for Dojo 2? Rene Rubalcava says: January 17, 2018 at 7:32 am The bower.json of dojo-util needs to be updated to reflect this change as well. https://github.com/dojo/util Dylan Schiemann says: January 17, 2018 at 7:41 am I don’t think it does, as we’ve re-registered dojo-themes to point to the new repo in Bower. It may require clearing your bower registry cache to see the change however. Dylan Schiemann says: October 27, 2018 at 7:08 pm I made this update in the most recent releases. See https://github.com/dojo/util/commit/6cdf77b31a725b5f2b19c0c41fcf3c201a5c1f24 for more detail. meike says: August 8, 2018 at 1:57 am The bower.json of dojo-util needs to be updated to reflect this change as well. https://github.com/dojo/util Dylan Schiemann says: August 8, 2018 at 5:44 pm Fair enough… if you have time to create a PR that would be great, otherwise I’ll get to it shortly."
