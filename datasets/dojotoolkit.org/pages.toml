["https://dojotoolkit.org/community"]
title = "Community - Dojo Toolkit"
full_description = '''Visit dojo.io for documentation, examples, and more on Dojo, the Progressive Framework for Modern Web Apps and successor to the Dojo Toolkit Dojo Community Help & Support Dojo on Discourse #dojo on IRC Dojo on Gitter Dojo on GitHub Stack Overflow Commercial Support Socially Yours Related Projects dstore Manage client-side data using an elegant, expressive data framework providing consistent APIs and multiple default store types. Intern Combines all the best features from various testing tools (and then some!) into a versatile, easy-to-use testing stack for JavaScript. dgrid A next generation grid component that takes full advantage of modern browsers and object stores. Lightweight, modular, and easily extensible. Become a Contributor We are SO excited you want to join us and help build the next generation of Web development tools! The first thing we ask is that you have a Contributor License Agreement (CLA) in place before submitting code. CLA Most forms of contribution aside from providing support to other users requires that you sign and submit a Contributors License Agreement (or "CLA" for short) with the JS Foundation. Sending in a CLA is a one-time thing, and once it's done, you're in the clear to start contributing to all Dojo Foundation projects! The Individual CLA You're working on a JS Foundation project in your spare time, or can clearly claim ownership of copyright in what you'll be submitting In summary, the CLA asserts that when you donate fixes or documentation, you both own the code that you're submitting and that the JS Foundation can in turn license that code to other people. For more on CLAs, read Alex Russell's Why Do I Need to Sign This?. Start Contributing To report vulnerabilities in Dojo Toolkit, please email us: [email protected] Copyright OpenJS Foundation and Dojo Toolkit contributors. All rights reserved. The OpenJS Foundation has registered trademarks and uses trademarks. For a list of trademarks of the OpenJS Foundation, please see our Trademark Policy and Trademark List. Node.js is a trademark of Joyent, Inc. and is used with its permission. Trademarks and logos not indicated on the list of OpenJS Foundation trademarks are trademarks™ or registered® trademarks of their respective holders. Use of them does not imply any affiliation with or endorsement by them. The OpenJS Foundation | Terms of Use | Privacy Policy | OpenJS Foundation Bylaws | Trademark Policy | Trademark List | Cookie Policy | Dojo Toolkit License Information (function (i, s, o, g, r, a, m) { i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () { (i[r].q = i[r].q || []).push(arguments) }, i[r].l = 1 * new Date(); a = s.createElement(o), m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m) })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga'); ga('create', 'UA-22088032-1', 'auto'); ga('send', 'pageview');'''
