full_description = "About the Squarespace purchase of Google Domains registrations On 15 June 2023, Google entered into a definitive agreement with Squarespace, indicating their intent to purchase all domain registrations and related customer accounts from Google Domains. When the transaction between Google and Squarespace closed on 7 September 2023, all Google Domains users became customers of Squarespace. As of 10 July 2024, all domains have migrated to Squarespace. Please contact Squarespace for further help. For migrated Cloud Domains, contact Cloud support. Google About Google Privacy Terms"
