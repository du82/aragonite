["https://dominictarr.com/post/98462042492/social-networks-and-the-legal-hack"]
title = "cyberhoboing with dominic tarr, Social Networks and the Legal Hack"
description = """
There have been a bit of fuss on my twitters about ello.co a hip new social network that is gonna change everything. They are gonna do things right, no ads, and not sell out their users.
They have a..."""
full_description = 'Social Networks and the Legal Hack There have been a bit of fuss on my twitters about ello.co a hip new social network that is gonna change everything. They are gonna do things right, no ads, and not sell out their users.They have a manifesto!People are certainly trying it out, but the general vibe amongst my friends is that while they are ready for change, they are not yet convinced that we are gonna be treated better this time.But here is an idea.Burn their bridges to advertising as a business model, so that they couldn’t take advertising even if they wanted to.How would you do that? Well, the simplest way would be with a terms of service! A terms of service is a contract with your users. Normally, terms of service are designed to protect the rights of the service provider. ToS are likely to include phrases such as “terms may change without notice”.But it doesn’t have to be this way. The open source movement, for example, has performed a legal hack where by they used copyright law to undo copyrights. The right to prevent copying becomes the right for anyone to copy. Instead of reserving rights, open source gives them away!An open source license might say that you are free to redistribute the code, or even to modify and sell it. It might say that the license must not be changed, or it might say that you can relicense the code.This is not a thing that only opensource can do, services like ello.co and other social networks can also create a contract with their users that protects the users instead of the service.just include a paragraph something like thisThe user maintains ownership of the data they put into ello, including but not limited to content they post, replies to other users, and also metadata such as logs created by interacting with the ello user interface. Access to this material is granted to ello for the purposes of running the site, and to other users that have explicitly solicited that information by “following” in the user interface. Users have the right to refuse information “block” other users that have solicited their information. The data may not be passed on or sold to third parties. ello must honestly represent the information solicited by via the user interface, and must not inject spurious information that the user has not specifically solicited, this includes but is not limited to advertising. ello cannot change the terms of service without explicit consent of the users.(Obviously get a real lawyer to write your ToS)Something like that. It lays out clearly what ello is allowed to do with your data and metadata, and it also lays out information ello is to present to you - material created by users you have solicited content from (i.e. followed), and what not to show you, (i.e. advertising)It may be too late for ello.co to do this now, since they may already have obligations to their investors that giving up a potential business model would conflict with.But another social network could certainly do something like this. To my knowledge, such a legal hack has not been executed for a social network, so you might be the first! Posted 10 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
