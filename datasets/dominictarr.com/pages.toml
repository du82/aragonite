["https://dominictarr.com/post/21379037595/have-you-ever-lied-in-a-job-interview"]
title = "cyberhoboing with dominic tarr, Have You Ever Lied in a Job Interview?"
description = """
I just read @karlseguin's blog post, Learning is More Important than Knowing
He says people should interview for the ability to learn, rather than a specific bag of tricks, he's completely right about..."""
full_description = 'Have You Ever Lied in a Job Interview? I just read @karlseguin’s blog post, Learning is More Important than KnowingHe says people should interview for the ability to learn, rather than a specific bag of tricks, he’s completely right about learning being more important.But there is another angle when it comes to job interviews.Because when the interviewer asks ‘do you know X?’ You know what really happens,..The interviewee lies, and then leans it quickly.We’ve all done this, lets just admit it.Your future boss, if they are any good, probably did it as well.This is the natural order of things.Sometimes it’s important not to take things too literally. In Soul of a New Machine (highly recommended) Data General use the production schedule like that. They would ask some new guy; “we need you to do X (some challenging assignment), and we need it in 6 weeks. can you do it?”They knew full-well that doing X in 6 weeks was impossible, they just wanted the guy to “sign up” . They didn’t have the budget to hire experienced engineers, so they hired recent graduates. They had an exciting project, though,half the company had moved off to Southern Carolina to build the new (non-back compatible) 32 bit computer the “Fountainhead” project. The remaining team, who are the subject of the book, where left to build merely the next 16 bit computer in the Eclipse series. But they decided that was too boring, so they secretly also built a 32 bit computer. Except theirs is also backwards compatible.Did I mention that this was an exciting book?Anyway, the point is, they knew the schedule was impossible. What they wanted was to get the designer’s mouths to write a cheque that their ass would have to cash.A job interview is like that, but less awesome. The real question, once you know they are smart, is “How committed is this guy?”Now I reckon, the liar is much more committed than the one who says “well, I don’t know X, but I can learn it, I’m a fast learner”Because the liar will look more foolish if he can’t.Now, this is all just posturing, it’s not really dishonest; because we all know, he’s just gonna learn it… Which brings me to another point, challenge is more important than money.So just remember, not everything is always as it seems. Especially not at job interviews. Posted 12 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
