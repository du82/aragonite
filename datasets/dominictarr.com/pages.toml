["https://dominictarr.com/post/25083602144/distributed-programming-is-easy"]
title = "cyberhoboing with dominic tarr, Distributed Programming is Easy"
description = '''At least, it's as easy as non-distributed ("local") programming. Okay, so programming isn't exactly easy even on a good day. But we still manage to do it anyway.  What I'm trying to say is;...'''
full_description = 'Distributed Programming is Easy At least, it’s as easy as non-distributed (“local”) programming. Okay, so programming isn’t exactly easy even on a good day. But we still manage to do it anyway.What I’m trying to say is; distributed programming is not “TOO HARD”.The problem is that we are resisting the very idea of distributed programming. People are still approaching the arena of distributed programming hoping that something will come along and make it disappear, that someone clever will invent an abstraction that wraps distribution and makes it feel local. Paul Graham even listed it in his list of frighteningly ambitious start up ideas (#6).It’s not gonna happen.Instead of trying the change the universe so that it fits our mental models better, lets just change our mental models.We’ve just got to abandon everything we think we know.I’ve been investigating distributed programming; and I’ve begun to notice a few patterns.Distributed programming has a different foundation to local computing, and different facts become the assumptions that an application is built around. Firstly, be idempotent.Network communication is inherently unreliable. And even if it was, software crashes. You need to be able to resend any message, and not have that apply the same as sending the same message only once.Also see Life beyond Distributed TransactionsSecondly, know the difference between monotonic, and non-monotonic. A logical operation is monotonic if once it becomes true, it becomes true forever. For example: non-virginity. Once you have become not a virgin, you will continue to be so. Non-virginity cannot expire, or be retracted. This is important because things are are monotonic will naturally be eventually consistent. For non-monotonic things (read: delete from a set) you may need to track state carefully, or make sure all nodes know about an update.If you can design your application to maximise monotonic, commutative, idempotent operations, your life will be easy.Also see bloom bloom is a prototype language designed for distributed programming, founded on the CALM (Consistency as Logical Monotonicity) conjecture.A third assumption is that each individual computer is itself unreliable. Disks fail, datacenters catch on fire, and cell phones get dropped into water (remember, a client is just a type of node). A pattern I’ve observed in studying distributed software is that often, distributed means peer to peer. Even if it’s entirely behind a firewall, the architecture of Amazon’s dynamo (or it’s open source clone, Cassandra) is entirely peer to peer, with no master node.A phrase you might have heard is “single point of failure”. A peer to peer architecture avoids that.Each of the techniques described in the Amazon dynamo paper is itself quite simple, but used together they produce a coherent whole that in incrementally scalable, without a single point of failure. Interestingly, dynamo is not itself a actually database. It’s a replication layer. The actual storage of data is achieved via a customizable plugin. It may even be mysql!I have only just begun exploring this area. As more do the same, we’ll figure out new approaches, and build new tools and frameworks that are distributed by default, then distributed programming will be easy. Posted 12 years ago 3 notes • View comments ih2502mk liked this fiction-is-my-escape liked this dominictarr posted this <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
