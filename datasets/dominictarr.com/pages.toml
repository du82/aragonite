title = "cyberhoboing with dominic tarr, This totally blew my mind. This is pretty much the..."
description = """
This totally blew my mind.

This is pretty much the stupidest thing I’ve ever seen and this marvelous sight is
right at LAX (Los Angeles International Airport).

Okay, so some context: LAX is not an..."""
full_description = 'This totally blew my mind.This is pretty much the stupidest thing I’ve ever seen and this marvelous sight isright at LAX (Los Angeles International Airport).Okay, so some context: LAX is not an illustrious architectural feat. no, it’s drab. Itis just a massive version of Hamilton airport. Then, I step outside, of an airport withabsolutely no optional extras, and see this.This thing that I shall now refer to as the “Doggie Pen”. I’m gonna point out somethings in case you don’t realise what you’re seeing. It’s a pen that you can releaseyour dog into for some relief after a long flight. It has everything to make youranimal feel at home. Like astroturf, with a cartoon dog bone shaped cement gap inthe astroturf and a doggie bowl, and a fire hydrant.Now the hydrant doesn’t actually work, and I know that because there is a sign onit which says “fire hydrant does not work”. That is important, because what if thereis a fire and I am a fireman and in a overwhelming moment of panic I try to use thishydrant, but it isn’t hooked up, because its only purpose is to amuse dogs, and LAXburns down … then naturally someone will sue the fire department, and then thefire department will sue whatever amazing genius designed the Doggie Pen.But then his lawyers would say “hey, didn’t you read the sign?” and the firedepartment would lose the case because they exhibited gross negligence in notreading the sign.Dogs probably don’t know or care about that stuff. There are police dogs. But nolawyer dogs. My feeling is that dogs are pretty happy to piss on anything.But this hydrant isn’t for the dogs. It’s for the dog owners. Dog owners who thinkbeing a dog is all about cartoon bones, and pissing on fire hydrants … Andmaybe if you work hard you can become a big success living in a mansion, with aswimming pool shaped like a bone and a gold-plated fire hydrant to piss on.But the truly absurd thing is that in this airport with no extras … why this amazingtribute to dog people?This Doggie Pen sums up a lot about America, or LA at least. Okay, I could writemore … but I’m just gonna stop here. Maybe more later … Posted 13 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
