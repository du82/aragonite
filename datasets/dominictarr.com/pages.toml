["https://dominictarr.com/post/154769946347/fairly-tale-cryptography-2-hashes"]
title = "cyberhoboing with dominic tarr, fairly tale cryptography 2: hashes"
description = '''In "cinderella" a young woman living in unfortunate circumstances who's situation suddenly changes, when a magical entity appears and gives her a make-over, allowing her to attend a fancy ball at...'''
full_description = 'fairly tale cryptography 2: hashes In “cinderella” a young woman living in unfortunate circumstances who’s situation suddenly changes, when a magical entity appears and gives her a make-over, allowing her to attend a fancy ball at where the local prince falls in love with her – but must hastily depart before the magic wears off… and looses a shoe, which happens to be made of glass.The prince doesn’t write to the “missed connections” column, because it’s medieval times and Cinderella is most likely illiterate. Instead he sends out his people to test everyone and find the person whom the shoe fits.In this story, the shoe behaves exactly like a hash. A hash is a small value that reflects the uniqueness of an file, But does not give you any other clues about the file.A hash might usually looks something like this: ebd8581d6cea19558023b851fbdf599a5044b446 Just a seemingly random sequence of numbers and letters. There is nothing obviously indicative of a particular file in the output, yet if the file is changed by even one letter, it will have a completely different hash.If you have that file (“Cinderella”) you can create that hash (a glass shoe that fits her) but you cannot go back the other way (you cannot create a Cinderella from the shoe!). Possessing the shoe also does not tell you where Cinderella is Possesing the shoe does not allow the prince to home in on her location - it does not give clues like “warmer” or “colder”But what the shoe does do, is it allows the prince to know when he has found her. The prince can send someone out to take the shoe to every woman in the kingdom, and test if each one fits the shoe. A hash works exactly like this! If you know the hash, you can check whether any file produces the same hash. But if you only know the hash, and are looking for the file, it may be very hard to find that file.What happens if the shoe fits someone else? In modern times, shoes are made in factories to standard sizes, but in medieval times, your shoes would have been handmade to fit your feet, and then worn in to your feet on top of that. If you imagine it from that perspective, it seems more reasonable that the shoe uniquely fits Cinderella, but indeed it is certainly possible that there is different person with the same feet as cinderella, it’s just extremely unlikely.Again, this is exactly like a hash. The since the hash is often smaller than the file, there are obviously more possible files than hashes, so it’s entirely possible that there are two possible files that have the same hash, but there are already so many possible hashes (given 40+characters) that the chance of ever finding two files with the same hash is so low that it will basically never happen. Not before you and everyone you know is dead, or maybe not before the sun swallows the earth. Basically, with a well designed hash, we have much bigger things to worry about than hashes colliding, and if we are worried, we can just use a longer hash.So there you go, hashes explained via a fairy tale you already know. Also see part 1: rumplestiltskin as bitcoin Posted 8 years ago 5 notes • View comments honeymeew liked this ukucupha-ihlosi said: Bro’ ukucupha-ihlosi liked this dominictarr posted this <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
