title = "cyberhoboing with dominic tarr"
full_description = "death to client-server: let all nodes be created equal! Would you use a hammer to butter your toast?That is what you are doing if you are using a database to create a application to be used by multiple humans. If you want to build an application with lots of problems, make sure you have mismatched geometry. Pick technologies that don’t match the what is really going on.What is a database? Basically, it’s like a book, like a ledger or inventory. You can write things, strike things out, and write new things, and if it’s not on paper it’s not real. Databases are a pretty good match for things like banks, or keeping track of what stock you have, so if you are building an application like that, use a database.On the other hand, if you are building something to be used by humans with humans… then a database is just plain wrong.Humans have a completely different interface. The fundamental assumption in a database is that all communication is request and response. It is not possible for the database to spontaneously inform a client of something. It is not possible for stock to leap of a shelf and spontaneously deliver it self to a customer. Humans, however, are fundamentally peer-to-peer and real-time. There aren’t two types of humans, one that only answers questions, and one that only asks questions. that would be absurd.If you try to use databases for human applications, an awkwardness will pervade your application (unless your application is limited to the subset of human activities that do work like clients and servers). Commerse is like that, anything collaborative, anything “social”, is definately not.What we need, is a new kind of data layer. A data layer where there is no strong distinction between servers and clients - there arn’t clients or servers, just nodes. I don’t mean that a specific node can’t have an important job, like being a leader, but any node should have the potential to initiate communication to any other.What we need is a data layer that is both peer-to-peer and real-time.This line of thought is not well developed, but there are a few projects out there that are working towards this. CouchDB has the _changes feed, and redis has pubsub, but these features are only tacked on, rather than baked in.But there are people working on realtime backends. racer, sharejs, firebase, and my own project crdt If you know of more please let me know. These are still client-server, but my project, crdt, goes one step further and is also peer-to-peer!so start watching these projects, they are all pretty fresh, but this. is. the. future. Posted 12 years ago View comments Have You Ever Lied in a Job Interview? I just read @karlseguin’s blog post, Learning is More Important than KnowingHe says people should interview for the ability to learn, rather than a specific bag of tricks, he’s completely right about learning being more important.But there is another angle when it comes to job interviews.Because when the interviewer asks ‘do you know X?’ You know what really happens,..The interviewee lies, and then leans it quickly.We’ve all done this, lets just admit it.Your future boss, if they are any good, probably did it as well.This is the natural order of things.Sometimes it’s important not to take things too literally. In Soul of a New Machine (highly recommended) Data General use the production schedule like that. They would ask some new guy; “we need you to do X (some challenging assignment), and we need it in 6 weeks. can you do it?”They knew full-well that doing X in 6 weeks was impossible, they just wanted the guy to “sign up” . They didn’t have the budget to hire experienced engineers, so they hired recent graduates. They had an exciting project, though,half the company had moved off to Southern Carolina to build the new (non-back compatible) 32 bit computer the “Fountainhead” project. The remaining team, who are the subject of the book, where left to build merely the next 16 bit computer in the Eclipse series. But they decided that was too boring, so they secretly also built a 32 bit computer. Except theirs is also backwards compatible.Did I mention that this was an exciting book?Anyway, the point is, they knew the schedule was impossible. What they wanted was to get the designer’s mouths to write a cheque that their ass would have to cash.A job interview is like that, but less awesome. The real question, once you know they are smart, is “How committed is this guy?”Now I reckon, the liar is much more committed than the one who says “well, I don’t know X, but I can learn it, I’m a fast learner”Because the liar will look more foolish if he can’t.Now, this is all just posturing, it’s not really dishonest; because we all know, he’s just gonna learn it… Which brings me to another point, challenge is more important than money.So just remember, not everything is always as it seems. Especially not at job interviews. Posted 12 years ago View comments Beyond Semicolons: High Level Style in Javascript » Posted 12 years ago View comments Challenge: Reliable Reputation Graphs? We’ve had reputation systems for sometime, being able to say whether someone followed through with a transaction effectively makes things like ebay workable.However, the implementations we currently have are simplistic and intrinsically gameable.For example, on ebay, you can see who has good feedback, and who has bad. But what is not taken into account is that reputation goes both ways. Reliable people both act and speak honestly. That is, if you are an asshole, you will trade badly, and possibly also give bad feedback to people who don’t deserve it.We observe this is everyday life that the references of highly respectable people count for a lot more than people of ordinary levels of respect.That is not how current systems seem to work, so I think there is an opportunity here.In flat systems like ebay or reddit, every vote counts the same, so it’s possible to create many fake accounts and get them to vouch for a target account.how to game reddit with fake accountsebay works around this problem by making it as hard as possible to create a new account once you have been banned, work around this by resigning up with all new details, this only stops unsophisticated cheats.Advagato.org, an opensource community, has an interesting trust metric that goes some way to avoiding this problem. starting from a trusted seed, of the founders of the site, trust is propagated outwards using a network flow graph calculationThis works quite well, but it’s still possible for a troll to penetrate this system. According to the wikipedia page several have. Also see the comments on this articleThe trouble here, I believe, is about controversy and opinions. Not everyone agrees on who the trolls are. An opinion may be more obnoxious to you but more tolerable to me. Maybe they have some good ideas, but say them in an obnoxious way. One-size-fits-all fits everyone poorly.This is also a problem on Amazon. There are many books which have a lot of 5 star reviews, but also a lot of one star reviews. So, is that a good book or an awful book?Naturally, if I believe in evolution, I’m probably not going to highly rate a book on creationism. but other people will…The question is, what sort of person am I? and who are my opinion-peers? show me the books that they like to read.Flat systems cannot infer this sort of information merely from whether you have voted from something or not, but I believe, it’s all there in the reputation graph.I have managed to find one study that addresses this; Controversial users demand local trust metrics which describes a system trust metric applied to data from epinions.com.The interesting thing in this paper, is that all users are ranked from the point of view of each particular user. by calculating the distances between users on a graph of expressions of agreement. Corners are cut to enable such a calculation to be performed quickly, and I’m not convinced that ranking by the shortest path really maps onto the real-world problem precisely, but I think the idea of a local rank is key.The way forward, I believe is a system that combines the approaches and solves the problems approached by both systems. We need a reliable system that is ungameable, but is also personalised, because the important thing about trust is who you can trust.I agree with @jonbischke that reputation graph is one of the web’s biggest opportunities. But also, if it can detect controversy and cheats… then it has the power to revolutionize society as well. Posted 12 years ago View comments some emus came to visit! Posted 13 years ago View comments Solar panel setup. 80 watts of panel, with charge controller is hooked up to car battery and in inverter, then wifi modem and laptop are plugged into that.This is surely quite inefficient, but are the most easily available components. 80 watts are probably more than I need, and 80 watts was better value because they came with a charge controller.(value of this setup is $250 AUD) Posted 13 years ago View comments the hack-mobile in the early moring light… somewhere in the badlands of northern Victoria… Posted 13 years ago View comments a Tourist Trap and a Bokononist Revelation. Exploring San Francisco I stumble into Pier 39. Possibly one of the world’s mostabsurd places. It’s a bunch of souvenir shops and gimmicky restaurants. Needa fridge magnet to remind you of your trip to San Fran? There are several shopswhich sell nothing but fridge magnets. There is also a key chain shop. Everything isinwards facing.Pier 39 is not about anything, it’s a destination all by itself.I was so curious about the various things I saw there I just had to ask,• Are the magnet shops independent? Do they compete with the other magnetshops?• No. They are all owned by one company.• Can a right-handed person work at the left-handed shop?• Well, only if they are left-handed enough to demonstrate the left-handedproducts.The left-handed shop seems like a reasonable idea. It derides the left-handedcause by having their shop on Pier 39. But investigating its products there are onlytwo that are genuinely useful, a specially padded left-handed pen (prevents youwiping your hand through the ink) and scissors. The rest of the shop is T-shirts andfridge magnets promoting the left-hander’s cause.And best of all, coffee mugs with a hole on the right side so it will spill it on yourselfif you try to drink it right-handed.Wandering around someone asked me a question:• Can you pretend to be my uncle or something so that I can buy a knife?• Of course I can (Bokonon says “peculiar travel suggestions are dancinglessons from God”).The knife shop, also in Pier 39, had an wide assortment of bladed weaponry. Somewere practical or historical, others fantastical, all were indiscriminately mixed. Hebrought ninja stars.I told him about my experience with the fire hydrant in the doggie pen at LAX. Hewas surprised that the hydrant was blue, but told me that there were hydrants whichdidn’t work and they all had signs saying so. Suddenly I realized my mistake. I hadthought the hydrant-with-sign was an exception, because it was in a doggie pen.The hydrant made sense now.Then I thought, maybe Pier 39 makes sense too? Suddenly I got very curious as tohow Pier 39 began – did it begin sensible and then drift into nonsense?Well, a plaque in a forgotten corner answered my question. It started in 1974 all atonce, a whole bunch of restaurants. The developer organising it all paid everyone a$25 per-square-foot bonus to be finished on time. I guess the souvenir shops cameafter that.My favourite restaurant is Bubba Gump Shrimp Company, yes, from Forrest Gump.I saw the sign and thought, was that from before or after Forrest Gump? ForrestGump has those bits where he invents “shit happens” and the smiley face.Was this another reference I wasn’t aware of? I asked.The Matrie d’ was very excited, “No, we where so inspired by all the Bubba-Gumpstuff we started this restaurant!”The walls where lined with Forest Gump quotes and memorabilia. (I was told later itwas a complete rip-off, of course, but has the most profitable (stupid) customers.)I wonder how many other people Forrest Gump inspired like that? Posted 13 years ago View comments This totally blew my mind.This is pretty much the stupidest thing I’ve ever seen and this marvelous sight isright at LAX (Los Angeles International Airport).Okay, so some context: LAX is not an illustrious architectural feat. no, it’s drab. Itis just a massive version of Hamilton airport. Then, I step outside, of an airport withabsolutely no optional extras, and see this.This thing that I shall now refer to as the “Doggie Pen”. I’m gonna point out somethings in case you don’t realise what you’re seeing. It’s a pen that you can releaseyour dog into for some relief after a long flight. It has everything to make youranimal feel at home. Like astroturf, with a cartoon dog bone shaped cement gap inthe astroturf and a doggie bowl, and a fire hydrant.Now the hydrant doesn’t actually work, and I know that because there is a sign onit which says “fire hydrant does not work”. That is important, because what if thereis a fire and I am a fireman and in a overwhelming moment of panic I try to use thishydrant, but it isn’t hooked up, because its only purpose is to amuse dogs, and LAXburns down … then naturally someone will sue the fire department, and then thefire department will sue whatever amazing genius designed the Doggie Pen.But then his lawyers would say “hey, didn’t you read the sign?” and the firedepartment would lose the case because they exhibited gross negligence in notreading the sign.Dogs probably don’t know or care about that stuff. There are police dogs. But nolawyer dogs. My feeling is that dogs are pretty happy to piss on anything.But this hydrant isn’t for the dogs. It’s for the dog owners. Dog owners who thinkbeing a dog is all about cartoon bones, and pissing on fire hydrants … Andmaybe if you work hard you can become a big success living in a mansion, with aswimming pool shaped like a bone and a gold-plated fire hydrant to piss on.But the truly absurd thing is that in this airport with no extras … why this amazingtribute to dog people?This Doggie Pen sums up a lot about America, or LA at least. Okay, I could writemore … but I’m just gonna stop here. Maybe more later … Posted 13 years ago View comments crab fishing off 7th pier buy a crab net from the tackle shop on 6th street,then at night (with beer, net, and a fish for bait) go to pier 7, and talk to the dudes already there… Posted 13 years ago 1 note • View comments ← Previous Next page →"
