["https://dominictarr.com/post/25516279897/why-you-should-never-write-a-package-manager"]
title = "cyberhoboing with dominic tarr, why you should NEVER write a package manager"
description = "If you are writing a package manager today, you are wasting your time.  The problem is already solved. You will probably discover this as you explore the your problem space, maybe it's not obvious to..."
full_description = '''why you should NEVER write a package manager If you are writing a package manager today, you are wasting your time.The problem is already solved. You will probably discover this as you explore the your problem space, maybe it’s not obvious to you yet, but I think it will be.Instead of writing another package manager, just use npm. If you are writing a package manager for a new non-js language, do whatever it takes to get that new language to load modules the way node does. The right way.Many languages have a package manager, but most languages load modules from the $PATH. Anyone who has spent some time using this will know how complicated it can get.The problem with modules, is sooner or later you get a situation where a module A depends on modules B and C, and C depends on B’, a different version of B.If your system uses a global $PATH type variable to list where to look for modules (as in most languages), then you can’t have more than one version of a given module. Welcome to DLL hell.here is a post explaining how ruby’s bundler works. If two different versions of the same package are requested, bundler changes the versions of the other packages, until they agree on a single version for each package.So, if A is only compatible with B, and C is only compatible with B’, then your app is broken.You now need to change someone else’s module, a module that was already working, so that it can work with another module. Another unrelated module. That is like having a toaster that cannot be used in the same kitchen as a mircowave.Microwaves and toasters are completely independent objects and have no right to affect each others behaviour.This is clearly unreasonable, yet, there are many languages and systems that work like this.There is a lot of hype about node, but there isn’t enough hype about node’s module system.When you npm install package it gets installed locally, into ./node_modules/package. When you require('package') it looks for package in ./node_modules, then ../node_modules then ../../node_modules and so on, until it’s found or you have run out of parent directories. It’s so simple you can install modules just by copying files about.In many languages requiring/including a module adds that name to the global scope. In node, require returns a value that you must assign to a variable.By keeping modules out of the global scope, and looking for them locally, you can have different versions of the same named module if you like.This is the right way.If you can make sure your language handles modules in a sensible way (look locally, store locally) then you don’t need a package manager, because you can just use npm.Then your life will be easy. Posted 12 years ago 3 notes • View comments santosh79-blog-blog reblogged this from dominictarr messel-blog reblogged this from dominictarr messel-blog liked this dominictarr posted this <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'''
