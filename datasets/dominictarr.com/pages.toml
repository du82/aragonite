["https://dominictarr.com/post/23936521068/why-your-app-needs-body-language"]
title = "cyberhoboing with dominic tarr, why your app needs body-language"
description = "Travelling always reveals what you take for granted. I'm currently on my first trip to Asia, and one thing that has surprised me, is just how chilled out the driving is. From what I heard; everyone on..."
full_description = 'why your app needs body-language Travelling always reveals what you take for granted. I’m currently on my first trip to Asia, and one thing that has surprised me, is just how chilled out the driving is. From what I heard; everyone on motor-cycles, and no rules; I expected horns blaring, people shouting, total chaos.I was astonished to find road users putting out a vibe way more relaxed than what I’m used to.What I think it is, is that motorcycles have body-language. For the same reason there is no such thing as pedestrian-rage. If someone makes a mistake on the foot path, they can apologise with a gesture. But if someone makes a mistake in a car, you just assume they did it intentionally, because they are an asshole.Everyone knows that communication via the internet is fraught with difficulty, there being no notation for emotional tone. But instead of just complaining that email/chat/comments suck, maybe we can do something about it? maybe we can give the internet body-language?Body-language is interesting because it’s mostly unintentional. Body language doesn’t represent abstract ideas like spoken or written language does, instead it’s the by-product of your emotions and thought processes. And it’s better for that, because people mostly can’t lie with body language.So I’m not talking about a little icon that says “user is angry/happy/joking” but, rather, to let aspects of their non-verbal, non-textual behaviour fall through to give the other users information on what they are thinking.For example, in chat, you don’t really know how busy someone is. Are you interrupting them? Manually set statuses may help, but they must be done intentionally so they are more workload. But what if you could, say, see the mouse pointers of each user currently on the page? you could then see how much (real)time the are spending on the page, and have some idea about what they are doing. Thus you could estimate their current attention budget, and thus know how welcome your interruption may or may not be.This is just one idea, but the value in this approach, I think, is that the information it adds is not created or consumed consciously. It adds no extra perceived work load for the user. I think we need better support for real-time in our application stacks, to pull this off, but we’re working on it. Posted 12 years ago 2 notes • View comments stephenhandley liked this dominictarr posted this <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
