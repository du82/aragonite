["https://dominictarr.com/page/3"]
title = "cyberhoboing with dominic tarr"
full_description = "intro to node.js (classic) streams Posted 11 years ago View comments simple distributed systems Posted 11 years ago View comments streams in node.js Posted 11 years ago View comments part 2: https://www.youtube.com/watch?v=a8rTAIWjIpw Posted 11 years ago View comments Working Around the CAP Theorem with rumours-db If you have been following databases at all recently, you are sure to have heard of the CAP theorem. If not it’s explained very simply here: A plain english introduction to the CAP Theorem.The CAP theorem is about a database design problem when a database is scaled out to multiple nodes. CAP stands for Consistency, Availability, and Partition Tolerance. Like many classic engineering problems, you can pick any two out of the three options. Except, it doesn’t make sense not to pick Partition Tolerance, because then your database wouldn’t be scaled-out. So really, you can pick either Availability, or Consistency, or neither; which would mean your database sucks.The problem is explained very nicely in A plain english introduction to the CAP Theorem. There is something very solid about the CAP theorem. It seems immovable – it’s a theorem, after all.But what if there is another approach? What if, instead of trying to build a better database, we built something that isn’t a database, and so simply avoids the assumptions of the CAP theorem by stepping outside it? But what would this mean? What is a database, really?A database, I think, is like a bookshelf. You can PUT a book on the shelf, and you can GET a book off. If someone has a book currently checked-out (write-lock) then you can’t read from it.So, a distributed database is like a group of libraries with an inter-loan system. Each library has most of the books that the others have, but sometimes a member at one library needs a book that must be borrowed from another library. In another situation, a new edition of a certain book arrives at one library before another.Suppose the libraries are all on different islands, and books and book requests are carried between the islands by brave librarian-sailors. The librarians are brave, but not fearless, and sometimes the inter-loan service is disrupted because of poor weather. At certain times of the year, disruptions are more frequent.When you go to your local library to get a book out, there is always a chance that there is a new edition of that book that the library doesn’t even know about yet. You could check out a book, read it, return it, and then later, a new edition arrives at your library, fixing important errors in the edition that you read.How do you know that you are reading the latest edition of your book? Especially in inclement weather?You can’t. That is what the CAP theorem teaches us.What kind of systems can you build if you don’t ever know if your data is true? Well, not systems you can really trust, at least.So, what do you do if you need to know that the data you got was actually up to date? The best you can do is keep on checking back at the library to see if a new edition has arrived. Naively polling the database – but this multiplies reads and decreases performance!A database-like phone service which has the CAP problem is described in A plain english introduction to the CAP Theorem. In certain scenarios, the clients of the service make a request, which is answered with what turns out to be out-of-date information. This explanation gives us a clue: the clients call the service on their telephones, but the service does not take advantage of the fact that telephones provide two-way communication.If the clients had to keep calling back to check if information had changed, it would be very annoying for both the clients and the service. But if the service had the client’s phone numbers, the service could call back the clients when the information they are interested in changes, instead of hoping that the client will call back in time to make use of the new information.This is my proposal: A “database” with push notifications!This no longer really fits into the library/bookshelf metaphor, but as you can see, works well with the telephone metaphor. Although a client may temporarily have out-of-date data, they will be back up to date as soon as possible. Humans are good at dealing with changing information – why not computers?The idea of a database with push notifications is fairly new. CouchDB has a replication feature, and a realtime changes feed – but it’s not the primary way to interact with the database.We need to start fresh! Or start from simpler building blocks. Enter LevelDB. LevelDB is a lightweight, performant database created by the author of Big Table. It’s used in implementation of IndexedDB in Google Chrome, and has a very interesting node.js binding, LevelUP. Putting these pieces together I am working on a database where the primary way to interact is via registering for push notifications.This is RumoursDB; currently under rapid development, but available for eager users! Posted 11 years ago 3 notes • View comments Tagged: database, cap, cap-theorem, push-notification, push, real-time, node.js, . A talk I gave on Mission Critical Javascript at melb.js Posted 12 years ago View comments Adventure Boat Building Posted 12 years ago View comments why you should NEVER write a package manager If you are writing a package manager today, you are wasting your time.The problem is already solved. You will probably discover this as you explore the your problem space, maybe it’s not obvious to you yet, but I think it will be.Instead of writing another package manager, just use npm. If you are writing a package manager for a new non-js language, do whatever it takes to get that new language to load modules the way node does. The right way.Many languages have a package manager, but most languages load modules from the $PATH. Anyone who has spent some time using this will know how complicated it can get.The problem with modules, is sooner or later you get a situation where a module A depends on modules B and C, and C depends on B’, a different version of B.If your system uses a global $PATH type variable to list where to look for modules (as in most languages), then you can’t have more than one version of a given module. Welcome to DLL hell.here is a post explaining how ruby’s bundler works. If two different versions of the same package are requested, bundler changes the versions of the other packages, until they agree on a single version for each package.So, if A is only compatible with B, and C is only compatible with B’, then your app is broken.You now need to change someone else’s module, a module that was already working, so that it can work with another module. Another unrelated module. That is like having a toaster that cannot be used in the same kitchen as a mircowave.Microwaves and toasters are completely independent objects and have no right to affect each others behaviour.This is clearly unreasonable, yet, there are many languages and systems that work like this.There is a lot of hype about node, but there isn’t enough hype about node’s module system.When you npm install package it gets installed locally, into ./node_modules/package. When you require('package') it looks for package in ./node_modules, then ../node_modules then ../../node_modules and so on, until it’s found or you have run out of parent directories. It’s so simple you can install modules just by copying files about.In many languages requiring/including a module adds that name to the global scope. In node, require returns a value that you must assign to a variable.By keeping modules out of the global scope, and looking for them locally, you can have different versions of the same named module if you like.This is the right way.If you can make sure your language handles modules in a sensible way (look locally, store locally) then you don’t need a package manager, because you can just use npm.Then your life will be easy. Posted 12 years ago 3 notes • View comments Distributed Programming is Easy At least, it’s as easy as non-distributed (“local”) programming. Okay, so programming isn’t exactly easy even on a good day. But we still manage to do it anyway.What I’m trying to say is; distributed programming is not “TOO HARD”.The problem is that we are resisting the very idea of distributed programming. People are still approaching the arena of distributed programming hoping that something will come along and make it disappear, that someone clever will invent an abstraction that wraps distribution and makes it feel local. Paul Graham even listed it in his list of frighteningly ambitious start up ideas (#6).It’s not gonna happen.Instead of trying the change the universe so that it fits our mental models better, lets just change our mental models.We’ve just got to abandon everything we think we know.I’ve been investigating distributed programming; and I’ve begun to notice a few patterns.Distributed programming has a different foundation to local computing, and different facts become the assumptions that an application is built around. Firstly, be idempotent.Network communication is inherently unreliable. And even if it was, software crashes. You need to be able to resend any message, and not have that apply the same as sending the same message only once.Also see Life beyond Distributed TransactionsSecondly, know the difference between monotonic, and non-monotonic. A logical operation is monotonic if once it becomes true, it becomes true forever. For example: non-virginity. Once you have become not a virgin, you will continue to be so. Non-virginity cannot expire, or be retracted. This is important because things are are monotonic will naturally be eventually consistent. For non-monotonic things (read: delete from a set) you may need to track state carefully, or make sure all nodes know about an update.If you can design your application to maximise monotonic, commutative, idempotent operations, your life will be easy.Also see bloom bloom is a prototype language designed for distributed programming, founded on the CALM (Consistency as Logical Monotonicity) conjecture.A third assumption is that each individual computer is itself unreliable. Disks fail, datacenters catch on fire, and cell phones get dropped into water (remember, a client is just a type of node). A pattern I’ve observed in studying distributed software is that often, distributed means peer to peer. Even if it’s entirely behind a firewall, the architecture of Amazon’s dynamo (or it’s open source clone, Cassandra) is entirely peer to peer, with no master node.A phrase you might have heard is “single point of failure”. A peer to peer architecture avoids that.Each of the techniques described in the Amazon dynamo paper is itself quite simple, but used together they produce a coherent whole that in incrementally scalable, without a single point of failure. Interestingly, dynamo is not itself a actually database. It’s a replication layer. The actual storage of data is achieved via a customizable plugin. It may even be mysql!I have only just begun exploring this area. As more do the same, we’ll figure out new approaches, and build new tools and frameworks that are distributed by default, then distributed programming will be easy. Posted 12 years ago 3 notes • View comments why your app needs body-language Travelling always reveals what you take for granted. I’m currently on my first trip to Asia, and one thing that has surprised me, is just how chilled out the driving is. From what I heard; everyone on motor-cycles, and no rules; I expected horns blaring, people shouting, total chaos.I was astonished to find road users putting out a vibe way more relaxed than what I’m used to.What I think it is, is that motorcycles have body-language. For the same reason there is no such thing as pedestrian-rage. If someone makes a mistake on the foot path, they can apologise with a gesture. But if someone makes a mistake in a car, you just assume they did it intentionally, because they are an asshole.Everyone knows that communication via the internet is fraught with difficulty, there being no notation for emotional tone. But instead of just complaining that email/chat/comments suck, maybe we can do something about it? maybe we can give the internet body-language?Body-language is interesting because it’s mostly unintentional. Body language doesn’t represent abstract ideas like spoken or written language does, instead it’s the by-product of your emotions and thought processes. And it’s better for that, because people mostly can’t lie with body language.So I’m not talking about a little icon that says “user is angry/happy/joking” but, rather, to let aspects of their non-verbal, non-textual behaviour fall through to give the other users information on what they are thinking.For example, in chat, you don’t really know how busy someone is. Are you interrupting them? Manually set statuses may help, but they must be done intentionally so they are more workload. But what if you could, say, see the mouse pointers of each user currently on the page? you could then see how much (real)time the are spending on the page, and have some idea about what they are doing. Thus you could estimate their current attention budget, and thus know how welcome your interruption may or may not be.This is just one idea, but the value in this approach, I think, is that the information it adds is not created or consumed consciously. It adds no extra perceived work load for the user. I think we need better support for real-time in our application stacks, to pull this off, but we’re working on it. Posted 12 years ago 2 notes • View comments ← Previous Next page →"
