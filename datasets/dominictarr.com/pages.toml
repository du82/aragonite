title = "cyberhoboing with dominic tarr, a Tourist Trap and a Bokononist Revelation."
description = """
Exploring San Francisco I stumble into Pier 39. Possibly one of the world’s most
absurd places. It’s a bunch of souvenir shops and gimmicky restaurants. Need
a fridge magnet to remind you of your trip..."""
full_description = 'a Tourist Trap and a Bokononist Revelation. Exploring San Francisco I stumble into Pier 39. Possibly one of the world’s mostabsurd places. It’s a bunch of souvenir shops and gimmicky restaurants. Needa fridge magnet to remind you of your trip to San Fran? There are several shopswhich sell nothing but fridge magnets. There is also a key chain shop. Everything isinwards facing.Pier 39 is not about anything, it’s a destination all by itself.I was so curious about the various things I saw there I just had to ask,• Are the magnet shops independent? Do they compete with the other magnetshops?• No. They are all owned by one company.• Can a right-handed person work at the left-handed shop?• Well, only if they are left-handed enough to demonstrate the left-handedproducts.The left-handed shop seems like a reasonable idea. It derides the left-handedcause by having their shop on Pier 39. But investigating its products there are onlytwo that are genuinely useful, a specially padded left-handed pen (prevents youwiping your hand through the ink) and scissors. The rest of the shop is T-shirts andfridge magnets promoting the left-hander’s cause.And best of all, coffee mugs with a hole on the right side so it will spill it on yourselfif you try to drink it right-handed.Wandering around someone asked me a question:• Can you pretend to be my uncle or something so that I can buy a knife?• Of course I can (Bokonon says “peculiar travel suggestions are dancinglessons from God”).The knife shop, also in Pier 39, had an wide assortment of bladed weaponry. Somewere practical or historical, others fantastical, all were indiscriminately mixed. Hebrought ninja stars.I told him about my experience with the fire hydrant in the doggie pen at LAX. Hewas surprised that the hydrant was blue, but told me that there were hydrants whichdidn’t work and they all had signs saying so. Suddenly I realized my mistake. I hadthought the hydrant-with-sign was an exception, because it was in a doggie pen.The hydrant made sense now.Then I thought, maybe Pier 39 makes sense too? Suddenly I got very curious as tohow Pier 39 began – did it begin sensible and then drift into nonsense?Well, a plaque in a forgotten corner answered my question. It started in 1974 all atonce, a whole bunch of restaurants. The developer organising it all paid everyone a$25 per-square-foot bonus to be finished on time. I guess the souvenir shops cameafter that.My favourite restaurant is Bubba Gump Shrimp Company, yes, from Forrest Gump.I saw the sign and thought, was that from before or after Forrest Gump? ForrestGump has those bits where he invents “shit happens” and the smiley face.Was this another reference I wasn’t aware of? I asked.The Matrie d’ was very excited, “No, we where so inspired by all the Bubba-Gumpstuff we started this restaurant!”The walls where lined with Forest Gump quotes and memorabilia. (I was told later itwas a complete rip-off, of course, but has the most profitable (stupid) customers.)I wonder how many other people Forrest Gump inspired like that? Posted 13 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
