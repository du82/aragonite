["http://dominictarr.com/post/23851741941/death-to-client-server-let-all-nodes-be-created-equal"]
title = "cyberhoboing with dominic tarr, death to client-server: let all nodes be created..."
description = "Would you use a hammer to butter your toast?  That is what you are doing if you are using a _database_ to create a  application to be used by multiple humans. If you want to build an application with..."
full_description = 'death to client-server: let all nodes be created equal! Would you use a hammer to butter your toast?That is what you are doing if you are using a database to create a application to be used by multiple humans. If you want to build an application with lots of problems, make sure you have mismatched geometry. Pick technologies that don’t match the what is really going on.What is a database? Basically, it’s like a book, like a ledger or inventory. You can write things, strike things out, and write new things, and if it’s not on paper it’s not real. Databases are a pretty good match for things like banks, or keeping track of what stock you have, so if you are building an application like that, use a database.On the other hand, if you are building something to be used by humans with humans… then a database is just plain wrong.Humans have a completely different interface. The fundamental assumption in a database is that all communication is request and response. It is not possible for the database to spontaneously inform a client of something. It is not possible for stock to leap of a shelf and spontaneously deliver it self to a customer. Humans, however, are fundamentally peer-to-peer and real-time. There aren’t two types of humans, one that only answers questions, and one that only asks questions. that would be absurd.If you try to use databases for human applications, an awkwardness will pervade your application (unless your application is limited to the subset of human activities that do work like clients and servers). Commerse is like that, anything collaborative, anything “social”, is definately not.What we need, is a new kind of data layer. A data layer where there is no strong distinction between servers and clients - there arn’t clients or servers, just nodes. I don’t mean that a specific node can’t have an important job, like being a leader, but any node should have the potential to initiate communication to any other.What we need is a data layer that is both peer-to-peer and real-time.This line of thought is not well developed, but there are a few projects out there that are working towards this. CouchDB has the _changes feed, and redis has pubsub, but these features are only tacked on, rather than baked in.But there are people working on realtime backends. racer, sharejs, firebase, and my own project crdt If you know of more please let me know. These are still client-server, but my project, crdt, goes one step further and is also peer-to-peer!so start watching these projects, they are all pretty fresh, but this. is. the. future. Posted 12 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
