full_description = 'Challenge: Reliable Reputation Graphs? We’ve had reputation systems for sometime, being able to say whether someone followed through with a transaction effectively makes things like ebay workable.However, the implementations we currently have are simplistic and intrinsically gameable.For example, on ebay, you can see who has good feedback, and who has bad. But what is not taken into account is that reputation goes both ways. Reliable people both act and speak honestly. That is, if you are an asshole, you will trade badly, and possibly also give bad feedback to people who don’t deserve it.We observe this is everyday life that the references of highly respectable people count for a lot more than people of ordinary levels of respect.That is not how current systems seem to work, so I think there is an opportunity here.In flat systems like ebay or reddit, every vote counts the same, so it’s possible to create many fake accounts and get them to vouch for a target account.how to game reddit with fake accountsebay works around this problem by making it as hard as possible to create a new account once you have been banned, work around this by resigning up with all new details, this only stops unsophisticated cheats.Advagato.org, an opensource community, has an interesting trust metric that goes some way to avoiding this problem. starting from a trusted seed, of the founders of the site, trust is propagated outwards using a network flow graph calculationThis works quite well, but it’s still possible for a troll to penetrate this system. According to the wikipedia page several have. Also see the comments on this articleThe trouble here, I believe, is about controversy and opinions. Not everyone agrees on who the trolls are. An opinion may be more obnoxious to you but more tolerable to me. Maybe they have some good ideas, but say them in an obnoxious way. One-size-fits-all fits everyone poorly.This is also a problem on Amazon. There are many books which have a lot of 5 star reviews, but also a lot of one star reviews. So, is that a good book or an awful book?Naturally, if I believe in evolution, I’m probably not going to highly rate a book on creationism. but other people will…The question is, what sort of person am I? and who are my opinion-peers? show me the books that they like to read.Flat systems cannot infer this sort of information merely from whether you have voted from something or not, but I believe, it’s all there in the reputation graph.I have managed to find one study that addresses this; Controversial users demand local trust metrics which describes a system trust metric applied to data from epinions.com.The interesting thing in this paper, is that all users are ranked from the point of view of each particular user. by calculating the distances between users on a graph of expressions of agreement. Corners are cut to enable such a calculation to be performed quickly, and I’m not convinced that ranking by the shortest path really maps onto the real-world problem precisely, but I think the idea of a local rank is key.The way forward, I believe is a system that combines the approaches and solves the problems approached by both systems. We need a reliable system that is ungameable, but is also personalised, because the important thing about trust is who you can trust.I agree with @jonbischke that reputation graph is one of the web’s biggest opportunities. But also, if it can detect controversy and cheats… then it has the power to revolutionize society as well. Posted 12 years ago View comments <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
