full_description = 'Which JS crypto library should I use? A friend recently asked me “which js crypto library should I use?” Since this is a question that many people have, I have answered with a blog post.There are basically two schools of crypto library.There is the openssl school - here you get a library that was built the same crypto as TSL, the most accessable one of these is node.js’s crypto module.If you are using browserify, then it also works in the browser.https://www.npmjs.com/package/crypto-browserifyThis was a project that I started, but it was brought to completion by other contributors. It has a massive download count because it’s bundled in browserify - I have no idea how many people are actually using it, but probably lots.That is probably what you should use if you are trying to be backwards compatible with a legacy system. But the problem is that all the standards in TLS have bugs, and you really need to understand those bugs to not use that in an insecure way. (hint: if the crypto standard has a 3 letter acronym, it has a bug you need to know about ;)The other school is NACL. This is what I’d recommend if you are building something new, or just learning. NACL is carefully designed so that it’s primitves are simple and easy to use and don’t have the surprising bugs that openssl school librarys do. Where as TSL has a veritible buffet of options, NACL has only the best option in each category (signing, DH, hashing, authenticated encryption). This is better because you don’t have to risk not selecting the best thing. nacl was written by Daniel Bernstien (“djb”) who is widely revered among crypto hackers. Sometimes a little too revered - he is certainly an influential academic crypto expert - there are quite a few, but I suspect the reason he is so revered is that he actually produces code, and not just papers, making him a lot more useful to the hacker community.nacl links: http://nacl.cr.yp.to/ there is a node binding, http://npm.im/sodium and in the browser you can use https://www.npmjs.com/package/libsodium-wrappers which has been compiled to javascript, and https://www.npmjs.com/package/tweetnacl which has been handwritten. I maintain https://npm.im/chloride which brings together all of these modules with the same api. You can use it to fallback to the small handwritten javascript version, or the large but fast js.There is actually one more option: modern browsers now have built in crypto support - the WebCrypto api. https://developer.mozilla.org/en-US/docs/Web/API/SubtleCrypto This is also a reasonable option for the openssl school. Here is probably the most contraversal part of the advice I’m gonna give here: I don’t really advise using this. It has a weird api, it uses promises for everything - but the only operation that is so slow it needs to be async is generating RSA keys, or using scrypt or pbkdf2 to strengthen user passwords. But worst, the political process of adding new browser apis is very slow and does not generally result in the best designs. Although WebCrypto is modern, it’s already stuck in legacy because it just exposes the openssl style primitives that browsers use to implement TLS. The one argument for this is that it’s faster than JS.However, what I am more optimistic about is another developing browser technology - ASM.js and web assembly. This allows you to, end of the day, run C within JS efficiently. This will mean that you can just use nacl in the browser and it will be about as fast as webcrypto. But, there are a lot more interests who will benefit from C in JS (games etc) vs a tiny crypto community who is pushing for WebCrypto. My prediction is that the forces of C get us good browser crypto before the WebCrypto committee modernizes itself.I’ve talked a lot about speed here - this may or may not be a problem for your application. Encrypting a few messages or verifying a few signatures is not gonna be slow enough to really be noticable - unless you have to do it to many messages in realtime. (exception: performance is critical for scrypt/pbkdf2)That said and done, the most important question is: What is your motivation? security requires a different sort of thinking than ordinary web development. In short, it requires paranoia. But, a healthy paranoia tempered by a rational evaluation of the actual theats you system faces - more like a survialist, and less like a conspiracy theorist.Choosing the right library is merely the first step - but understanding why to make that choice is the most important. To do this you find crypto experts and study why they make the decisions they do.Of course, you can find this every where - and the blogs of things like https://whispersystems.org http://www.tor-project.org/ bitcoin etc are all worth studying, as well as classic papers, such as New Directions in Cryptography http://citeseer.ist.psu.edu/viewdoc/summary?doi=10.1.1.37.9720 (which is much more readable than you might expect! before this paper, cryptography is very different, so they had to explain it simply!) Posted 9 years ago 1 note • View comments ceejbot liked this dominictarr posted this <a href="http://cyberhoboingwithdominic.disqus.com/?url=ref">View the discussion thread</a> Blog comments powered by Disqus'
