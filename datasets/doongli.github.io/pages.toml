title = "Frankie Dong Li"
full_description = "I am looking for a PhD position in perception-aware navigation, 3D geometry, and reconstruction. Feel free to contact me if you or anyone is hiring. I was a Research Assistant from The Intelligent Machine Research Lab (IMRL) in the SKL-IOTSC at the University of Macau, supervised by Prof. Hui Kong. Before that, I received the B. Eng. degree from the School of Computer and Information Engineering, Hefei University of Technology in June 2022. During my undergraduate years, I was a founders of the robotics team of the Hefei University of Technology and participated in RoboMaster Robotics Competition, from 2019 to 2021. I worked as a Research Assistant for one year from June 2022 to June 2023, in the Autonomous and Multi-Agent Systems Research Lab (AMAS-Lab) at the Department of Electronic and Electrical Engineering of Southern University of Science and Technology (SUSTech), supervised by Prof. Zhiyun Lin. When I was studying at Fuyang No.3 High School, I was sponsored as a Pearl Student by the Xin Hua Education Foundation (XHEF). I am extremely grateful to them! I'm broadly interested in the overlap between robotics and computer vision, specifically, my research focuses the on use of Deep learning to solve the real problems of Robotics applications. My current work centers on enabling robots to construct high-precision multimodal semantic maps efficiently. I believe this will establish a strong foundational framework for visual-language navigation tasks. An open-source 4WS-4WD agricultural autonomous navigation robot platform that enhances maneuverability and terrain adaptability using an omni-directional kinematic model. The system integrates GNSS RTK, IMU, and steering angle encoders for high-precision localization and path tracking, validated through simulations and real-world tests. All open-source resources are available in the designated repository. A large-scale reference-based anomaly detection benchmark dataset that captures real-world scenarios. UMAD is applicable for both Change Detection and Anomaly Detection tasks."
