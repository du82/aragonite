title = "UMAD: University of Macau Anomaly Detection Benchmark Dataset"
description = "UMAD: University of Macau Anomaly Detection Benchmark Dataset."
full_description = "In this paper, we propose UMAD, the first benchmark dataset for the anomaly detection with reference in the context of patrol robot scenes. To address the challenge of aligning the reference and query pairs, we propose an adaptive warping method, which allows for accurate comparison between the image pairs. Unlike anomaly detection without reference approaches that face difficulties in handling the diverse range of anomalies, anomaly detection with reference offers an alternative by leveraging the change detection between the reference and query image pairs. By utilizing the UMAD dataset, we have conducted evaluations of several state-of-the-art scene change detection methods to identify anomalies and establish a baseline performance. We intend that UMAD will facilitate the development of more effective anomaly detection with reference methods, thereby bridging the existing gap in this research domain. BibTeX @inproceedings{li2024umad, title={UMAD: University of Macau Anomaly Detection Benchmark Dataset}, author={Li, Dong and Chen, Lineng and Xu, Cheng-Zhong and Kong, Hui}, booktitle={2024 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)}, pages={5836--5843}, year={2024}, organization={IEEE} } Acknowledgements The author thanks Xiangyu Qin, Kaijie Yin, Shenbo Wang, Shuhao Zhai, Beibei Zhou, Xiaonao Li, Hongzhi Cheng for their data annotation."
