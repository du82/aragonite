["https://doteveryone.org.uk/work/responsible-regulation"]
title = "Responsible Regulation – doteveryone"
full_description = "Responsible Regulation Helping decision makers set the terms for tech to be better for everyone Archive projects Responsible Innovation Stronger Society In a democratic society, it’s important that elected policymakers set the terms under which technology operates. That includes creating effective regulation of technology alongside encouraging best practice from business. Our 2018 People Power and Technology research showed the public felt tech companies were not being held to account for the impacts their products have. So later that year we published Regulating for Responsible Technology – practical recommendations to help policymakers ensure the UK has a robust and flexible regulatory system that will thrive now and in the future. That work put Doteveryone at the heart of an increasingly busy tech policy conversation and has helped shape the direction of technology regulation, especially around online harms, facial recognition and procurement. Related Projects Responsible facial recognition technologies The Online Harms White Paper – Doteveryone’s response Responsible procurement – rethinking how the public sector buys tech Regulating for responsible technology Helping people seek redress from digital harms Helping Parliament respond to Brexit with digital solutions Related Posts Buying better tech in government Kapila Perera The Online Resolution Service: a prototype of a shared platform for online complaints Richard Pope To make tech accountable for online harms we need to harness each part of the system Joe Massey Uncovering what people need to seek redress in an online world Joe Massey Seeking redress in the online world – the current challenges Joe Massey Rethinking how the public sector buys tech Jacob Ohrvik-Stott Understanding the landscape for digital redress: Announcing our call for evidence Joe Massey Doteveryone’s made the Legal Access Challenge final! 🎉 Jacob Ohrvik-Stott Doteveryone’s response to the Online Harms White Paper Cath