["https://doteveryone.org.uk/project/techtransformed"]
title = "Practical resources to innovate responsibly – doteveryone"
full_description = "Practical resources to innovate responsibly Doteveryone wants responsible technology to become standard business practice. That’s why Doteveryone has created TechTransformed – new methods and resources that will transform how technology teams create products and services. Although there’s lots of talk about ethics and technology, until now there’s not been much help for innovators to make technology better. Doteveryone has spent a year researching the issues organisations face and exploring what it would take to make responsibility the new normal for business. We have now built a set of practical tools that innovators can use to put responsibility at the heart of their business planning, design thinking and product management. TechTransformed helps boards and product teams map their values, design for consequences and adopt responsible processes. Related Consequence Scanning An agile practice for responsible innovators Related Posts Five reasons not-for-profits can and should have trading arms Lil Patuck Tech for Good startups consider the unintended consequences Lil Patuck Embedding responsible technology practices in businesses Noor Mo'alla Why we haven’t made a trustmark for technology Dr Laura James Consequence Scanning Making Waves Hannah Kitcher Who are the responsible tech advocates? Matt Chorlton 6 things we’ve learned about responsible tech advocates Matt Chorlton An Agile approach to designing for the consequences of technology Sam Brown Start with values: How innovation can be bold, fast and responsible Rachel Coldicutt Finding out what people in UK tech think Sam Brown A model to help tech companies make responsible technology a reality Sam Brown Five ways to engage with responsible technology Sam Brown Related Projects Consequence Scanning – an agile practice for responsible innovators"
