["https://doteveryone.org.uk/project/regulating-for-responsible-technology"]
title = "Regulating for responsible technology – doteveryone"
full_description = "Responsible Technology needs a robust and flexible regulatory system to thrive now and in the future. Our work shows how we can rethink regulation to meet this need and giving policymakers practical steps to achieve this vision. Our recommendations for an independent tech regulator outlined in Regulating for Responsible Technology: Capacity, Evidence and Redress build on the thinking in our Green Paper Making the case for an independent internet regulator, which explored the challenges to the existing regulatory landscape. Our recommendations are based on in-depth research, an open consultation and the generous input of many, many technologists, regulators, policymakers, consumer bodies, civil society groups, academics and ethicists. We are deeply indebted to their generous sharing of thoughts and time. PublicationsCapacity, evidence and redress: a new system for a fairer futureMaking the case for an independent internet regulator On the team:Catherine Miller, Jacob Ohrvik-Stott Related Posts Let’s prove tech companies wrong on regulation Catherine Miller Supporting consumers to seek redress from digital harms David Pilling, Ombudsman Services The Office for Responsible Technology: Supporting people to seek redress Jacob Ohrvik-Stott The Office for Responsible Technology: Informing policymakers and the public Jacob Ohrvik-Stott The Office for Responsible Technology: Empowering Regulators Jacob Ohrvik-Stott Introducing the Office for Responsible Technology Jacob Ohrvik-Stott Regulating for Responsible Technology: Making the case for an Independent Internet Regulator Jacob Ohrvik-Stott Tech regulation is broken and the time to act was yesterday Catherine Miller Accountability in the digital age: Imagining an internet regulator Jacob Ohrvik-Stott How do you solve a problem like technology? A systems approach to digital regulation Rachel Coldicutt Internet regulation is a vital part of innovation Rachel Coldicutt Related Projects Tech policies & issues"
