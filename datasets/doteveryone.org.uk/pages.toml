["https://doteveryone.org.uk/work/stronger-society"]
title = "Stronger Society – doteveryone"
full_description = "Stronger Society Strengthening society - people, communities and organisations - to be able to direct the impacts of technology Archive projects Responsible Innovation Responsible Regulation It’s been vital to Doteveryone’s work to be rooted in how people experience the impacts of technology and to listen to what they want from it. Our first of its kind research revealed a gulf between the perceived positive personal benefits and the negative societal impacts of technology and the ‘techlash’ that has followed. In 2020 we found that despite changes in both technology and policy, the gap between the benefits to individuals and society persists. And although people better understand the ways data is collected and used, tech companies are still not giving them opportunities to control services in line with their own preferences. There’s a widespread feeling of distrust towards tech companies and an appetite for greater regulation – 58% of the public believe the tech sector is regulated too little. This work was all about ensuring the public – everyone – can help direct the impacts of technology. Related Projects Realising better work in the gig economy Data, skills and culture for a better care system Helping people seek redress from digital harms Bringing together the social sector, social sciences & technology People, Power and Technology Helping the public shape the impacts of tech Be a Better Internetter Building a Responsible Tech Community Dispatches from the real world Responsible Digital Leadership 21st Century Libraries Related Posts Join us for the launch of People, Power and Technology: The 2020 Digital Attitudes Report Hannah Kitcher We still need responsible tech for care in a global pandemic Lydia Nicholas Re-designing digital gig work James Barclay Launching Care Data Futures in Scotland Lydia Nicholas Introducing People, Power and Technology: The 2020 Edition Jacob Ohrvik-Stott Ending the app trap: why (and how) we need to reform the 