title = "Responsible Innovation – doteveryone"
full_description = "Responsible Innovation Showing organisations how to build technology that supports the best interests of people, communities and planet. Archive projects Responsible Regulation Stronger Society Our 2019 research of UK tech workers revealed deep concern within the industry about ethical practice. It also showed a clear desire for more time and resources to consider the unintended consequences of the products and services they’re making. To meet this clear demand for practical resources to help tech workers consider the impact of what they make, we developed a set of methods and resources to help businesses put responsibility at the heart of their business planning, design thinking and project management, in TECHTRANSFORMED, which is now run by the Open Data Institute. Find out more: www.tech-transformed.com Related Projects Consequence Scanning – an agile practice for responsible innovators Industry attitudes to responsible technology Supporting a culture for female innovators to thrive Practical resources to innovate responsibly Trustworthy Tech Partners Programme Check Your Tech Fairer Tech Events Responsible Digital Leadership Related Posts Designing for difference: building products and services that foster understanding Natalie Nzeyimana How our values are driving our direction Hannah Kitcher Five reasons not-for-profits can and should have trading arms Lil Patuck Tech for Good startups consider the unintended consequences Lil Patuck Embedding responsible technology practices in businesses Noor Mo'alla Why we haven’t made a trustmark for technology Dr Laura James Consequence Scanning Making Waves Hannah Kitcher Tech workers call time on moving fast and breaking things Catherine Miller Responsible Tech 2019 Hannah Kitcher Who are the responsible tech advocates? Matt Chorlton Doteveryone partnership update Doteveryone 6 things we’ve learned about responsible tech advocates Matt Chorlton An Agile approach to designing for the consequences of tec