["https://dotfiles.github.io/tips"]
title = """
Tips and tricks  - dotfiles.github.io"""
full_description = "GitHub has a great collection of .gitignore templates for a wide range of languages and editors. We recommend Simon Whitaker’s gitignore-boilerplates to help you manage them. You might also consider using gitignore.io to generate .gitignore files simply and easily. A command line tool (gig) is available from the same site. Consider using Git submodules as you start to add 3rd party frameworks, scripts, and plugins. Submodules make managing dotfile dependencies so much easier. If you get fed up with submodules, many people prefer git-subtree, which lets you merge subtrees (other repositories) into one Git repository, and later split and push changes back out. If you use multiple machines that are slightly different, you can have a branch for each one and pull changes between them. For example, you may want to use your text editor configuration on both mac and linux hosts, but need different shells settings on each."
year_published = 2025
clearnet = "https://dotfiles.github.io/tips"
tags = [".gitignore", "boxes", "branches", "different", "don’t", "embrace", "ignore", "submodules", "subtrees", "tips"]
