title = """
GitHub does dotfiles  - dotfiles.github.io"""
full_description = "If you’re just starting out, before you go symlinking everything in ~/*, you might want to check out some tutorials that discuss how you can organize your dotfiles. Next, you could look through the general-purpose dotfiles utilities to find a system you can use to manage your dotfiles. Some tool-specific frameworks could save you time in customizing specific programs like your shell. Prefer to start from a popular base configuration? Check out dotfiles bootstrap repositories. Or just looking for inspiration, to see how others are doing things? Check out other GitHub users’ dotfiles or Reddit’s r/dotfiles subreddit."
