: 'https://img1.doubanio.com/cuphead/loc/legacy/js/lib/jquery.tmpl.js', type: 'js'}); Do.add('dialog-css',{path: 'https://img1.doubanio.com/f/vendors/e8a7261937da62636d22ca4c579efc4a4d759b1b/css/ui/dialog.css',type:'css'}); Do.add('dialog',{path: 'https://img1.doubanio.com/f/vendors/f25ae221544f39046484a823776f3aa01769ee10/js/ui/dialog.js', type:'js',requires:['dialog-css']}); 购票直通车 前往猫眼购票 #link-report img { max-width: 100% } #edesc_s.wr .middle { text-align: center; } 活动详情 √演出/活动时长以现场为准√最低演出曲目以现场为准√主要演员以现场为准√最低演出/活动时长以现场为准√预约说明无需预约√儿童说明一人一票，儿童须购票并持有效证件入场√发票说明该项目支持开具电子发票，发票由第三方主办提供，请在演出结束前通过订单详情页提交发票申请，一般演出结束后1个月左右开具，开票方名称以实际收到的发票为准。√异常购票√禁止携带物品由于安保和版权的原因，大多数演出、展览及比赛场所禁止携带食品、饮料、专业摄录设备、打火机等物品，请您注意现场工作人员和广播的提示，予以配合。√付款时效提醒下单成功后需在指定时间内完成支付，未支付成功的订单，将在下单指定时间后系统自动取消，请及时刷新购票页面进行购买。√特殊提示因市场变化、不可抗力等客观情形以及演出票随订随售的性质，可能会出现演出变更、取消、或正式出票时票品库存不足等情况，该等情形下猫眼客服会及时与您联系并尽快退款。√实名制购票无需实名制购票√限购说明每笔订单最多购买6张，以实际购票情况为准√退换政策票品为有价观演凭证，非普通商品，其背后承载的文化服务具有时效性、唯一性等特征，如非演出变更、演出取消、票品错误的原因，不提供退票品服务，购票时请务必仔细核对并谨慎下单。√入场规则一场邓丽君经典金曲演唱会“小邓丽君”桐瑶帮你追忆那份最初的感动她曾在 “全球邓丽君”选拔赛中获得第一名。她将带我们一起坠入时空隧道重温邓丽君时代邓丽君--华语歌坛上，是一个传奇。她的歌有一种让人忘记痛苦的甜蜜，她的笑容柔得让人窒息。邓丽君在中国流行音乐史上无庸置疑的是承前启后、开宗立派的一代大师，她演唱的歌曲已经成为世界文化遗产的一部分，她以妙不可言的邓式唱腔和完美的演唱技巧，带领人们走进真、善、美的艺术境界里。公认形神最“像”的女歌手“小邓丽君”桐瑶，将变身华语流行乐坛的巨星，形神兼备地引领观众回忆邓丽君时代的经典瞬间。桐瑶嗓音甜美、抒怀感人，具有酷似邓丽君楚楚动人的形象，曾在邓丽君文教基金会邓丽君选拔赛中折桂，被邓丽君恩师庄奴先生赞为“歌似貌酷邓丽君”，得其“婉约、清丽之真传”，重现邓丽君当年风采，令现场观众歌迷如痴如醉，恍若歌后重生，所到之处都受到热烈欢迎。并应邓丽君五弟邓长禧先生之邀赴香港参加纪念邓丽君演唱会，被誉为“小邓丽君”。她还曾多次应邀赴东南亚国家及欧洲巡回演唱，深受欢迎，掀起一股“桐瑶旋风”。桐瑶被广大观众和媒体誉为"小邓丽君"的实力派歌手，她的声音时而醇厚、时而轻婉，她用流畅自如的演唱、成熟大气的台风，征服着现场观众，引来台下如雷般掌声。她容貌与歌喉皆酷似邓丽君，不同曲风的随意切换，桐瑶用她对邓丽君歌曲深入骨髓的理解和扎实的演唱功力，恰到好处地呈现出“经典”应有的样子。为保持邓丽君演唱会原貌，现场伴奏在原有设备配置基础上又添置了一组管乐群，增强了演唱会现场的观赏性。桐瑶将再次以甜美、动情的歌喉现为大家带来《月亮代表我的心》《小城故事》《又见炊烟》《甜蜜蜜》《独上西楼》《何日君再来》《恰似你的温柔》《夜来香》《爱的箴言》《再见我的爱人》等众多经典曲目。2013年，桐瑶受邀在首都体育馆与王菲、羽泉、张靓颖等参加“追梦——纪念邓丽君诞辰60周年群星演唱会”；2015年，在台北小巨蛋与费玉清等歌星同台举办“纪念邓丽君小姐仙逝20周年演唱会”等等。2006年至今，桐瑶已在美国、澳大利亚、新加坡、马来西亚、泰国、西班牙、新西兰、北京、上海、广州、重庆、深圳、宁波、兰州、沈阳 ......举办三百多场邓丽君金曲桐瑶个人演唱会，每次演出结束后，君迷都会激动地对她说：“这就是我们理想中的声音。”曲目：1.空港2.月亮代表我的心3.甜蜜蜜4.海韵5.但愿人长久6.船歌7.又见炊烟8.千言万语9.你怎么说10.我只在乎你11.小城故事12.在水一方13.恰似你的温柔14.爱的箴言15.偿还16.漫步人生路17.独上西楼18.夜来香19.何日君再来20再见.我的爱人（具体曲目及顺序以演出现场为准） 附近热门活动（距离本活动3公里范围内） 【清明、五一、端午】节假日出游，都... 傍晚一场真人版猫抓老鼠的社交游戏，... 寻找内在的平静 我来问主办方 · · · · · · (全部0个 · 提问 ) 还没有人提问 活动讨论区 > 浏览更多话题 温馨提示 本活动信息由发起人自行发布，仅代表其个人意志，与豆瓣网无关，且活动的后续事项由发起人独立安排及负责。豆瓣网仅提供信息展示空间。不能保证活动的真实性、有效性、安全性，请在参加活动前与发起人具体确认核实相关情况，注意人身安全与财产安全。 活动地图 ( 查看大图 ) <div class="map-confirm"> <h2>{%=address%}</h2> <p class="pos-comment"> {% if (comment) { %} {%=comment%} <br> {% } %} {%=drive%} </p> </div> window._event_map_ = { containerId: 'event-map', lat: '39.991089', lng: '116.408531', type: 'small', markerIcon:'', address: '北京剧院 安立路安慧里三区10号楼（近慧忠路）北京剧院一楼', comment: '', drive: '<a href="http://ditu.google.cn/maps?hl=zh-CN&ie=UTF8&dirflg=r&f=d&daddr=北京剧院 安立路安慧里三区10号楼（近慧忠路）北京剧院一楼&date=2025/03/08&time=19:30" target="_blank">驾车/公交路线</a>' }; 活动成员 ( 1人参加 · 0人感兴趣 ) chrissy 要参加 (function (global) { if(!document.getElementsByClassName) { document.getElementsByClassName = function(className) { return this.querySelectorAll("." + className); }; Element.prototype.getElementsByClassName = document.getElementsByClassName; } var articles = global.document.getElementsByClassName('article'), asides = global.document.getElementsByClassName('aside'); if (articles.length > 0 && asides.length > 0 && articles[0].offsetHeight >= asides[0].offsetHeight) { (global.DoubanAdSlots = global.DoubanAdSlots || []).push('dale_event_page_bottom_right'); } })(this); 举报不良信息 $("#page-report").delegate("a", 'click', function(e){ var url = "https://www.douban.com/event/36880116/"; if(window._USER_ABNORMAL) { window.show_abnormal && window.show_abnormal() return } generate_report_dialog({report_url: url}); }) (function (global) { var body = global.document.body, html = global.document.documentElement; var height = Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight); if (height >= 1000) { (global.DoubanAdSlots = global.DoubanAdSlots || []).pus