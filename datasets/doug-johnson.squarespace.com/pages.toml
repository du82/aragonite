full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from April 1, 2018 - April 30, 2018 SaturdayApr282018 It's about time to give up some of these "skills" Saturday, April 28, 2018 at 06:41AM By the time students reach secondary school it is assumed that they will be able to read a clock face, although in reality this is often not the case ... Earlier this year, a senior paediatric doctor warned that children are increasingly finding it hard to hold pens and pencils because of an excessive use of technology. Schools are removing analogue clocks from exam halls as teenagers "cannot tell the time' The Telegraph, April 24, 2018 On reading this, my first reaction was 'I suspect few children today can use an hourglass, sharpen a quill pen, or add with an abacus either. What is the world coming to?" It's easy to identify skills that technology is asking all of us, especially kids, to master. Keyboarding, critical searching, digital safety, video and photo editing, graphic design, ... the list goes on. Advocating for "21st century skills" has become an industry in the education world. What is rarely discussed is what can and should be let go. Why are we even discussing penmanship, reading analog clocks, or driving a car with a manual transmission? How essential are map reading skills when a good GPS gets you there? Land-line telephones, fax machines, and even music and video stored on physical media are disappearing. As technology changes, so do the skills needed to use it. IXL Math apparently still "teaches" analog clock interpretation. OK, I will admit that there may be rare occasions when this ability might come in handy. I can't really think of one right now, but I am sure they exist. The question is, however, how might instructional time be better used in teaching or reinforcing a math skill that gets used on a far more regular basis. A few years ago, one of our state's standardized tests asked questions related to "guide words" on the pages of a dictionary. You remember dictionaries ... those books full of words from before we could simply click on a strange combination of letters and get a definition? Old people, get over it. There are hard learned skills that you indeed to master as a student. But a lot of them kids just don't need anymore. Happy Monday. Image source Doug Johnson | 4 Comments | Share Article SaturdayApr282018 BFTP: The Grandpa Assignment Saturday, April 28, 2018 at 06:00AM Can it really be 10 year ago that I published this? Paul is finishing his junior year of high school! Last weekend I received this from my grandson Paul who is in first grade: Here is the response I would like to write, but the LWW doesn't think it is such a hot idea: Dear Grandson Paul, When I was your age, I was a pioneer child on the prairie in the wilds of northwest Iowa. All 13 of my brothers, all 12 of my sisters, my mom and dad, two second cousins and I lived in the little log cabin that is still in the city park. There are now only me, your great-aunt Becky and great-uncle Jeff left of all my brothers and sisters. Two were carried away in a flood, four were adopted by wolves, a tornado carried away three, a band of robbers captured four, giant rattlesnakes scared away five, one went missing in a blizzard, a great golden eagle swooped down and flew off with one, and we think one just got left someplace and nobody remembers where. We are looking for some of my brothers and sisters to this day. It was a hard life when I was a little boy growing up on the prairie. Most parents always had a few extra children - just to have some spares. We were very, very poor when I was your age. Instead of toys, we only had sticks and dirt clods to play with. The rich kids in the neighborhood had rocks too, but we didn't. Grandma made all our clothes out of tree bark and animal skins - and not very fresh ones, either. We mostly ate mush, field corn and bullheads for supper. For Christmas, sometimes we got a raisin in our stocking. And were we excited! Breakfast and lunch usually were just the berries we could find in the woods. We had to fight over them with the bears. Our TV set only had 13 channels and color was not yet invented. In fact, the entire world was in black and white except for part of the movie The Wizard of Oz. Most of the time we just worked. It was my job to gather eggs from the pigs. Pig eggs are very hard to find and sometimes the pigs got grumpy when they were nesting. You had to be careful or you might get bitten. My sister Lefty, had that happen to her. We tied a rope from the cabin to the barn door so we could follow it during dust storms. Once we had a dust storm that lasted so long we planted potatoes in the air around the cabin. When we harvested the spuds, they were already mashed. Yummmm! I did get to go to school every other year from ages 5 to 27. Like most children, I had to walk to school, five miles each way and both directions were uphill. My teacher was very nice, but very busy with the 837 children in our one room school. Each of us had a laptop computer, however, and when the teacher was busy with other children, we surfed the Internet. I actually got to talk to Miss Snippet (my teacher) twice while I was in school. Both times she told me I was doing a good job. Our library only had seven books and it took a long time to get one to read at home. It was harder to learn to read when I was a little boy since the letters m and r had not yet been invented. They had just discovered the number 7 when I was in 3rd grade so I had to learn my number facts twice. But I was happy growing up since I knew one day I would be a grandpa and have a wonderful grandson like you. And that's a fact. Love, The Grandpa who lives on the lake Original post 3/25/2008 Doug Johnson | 2 Comments | Share Article FridayApr272018 Light-fingered librarians Friday, April 27, 2018 at 05:14AM Ah, spring. The peepers are peeping, the flowers are flowering, and the allergies are acting up. And librarians in schools are starting to prep for the end of the school year by doing inventory and getting back overdue books. Over the past couple of weeks I've quietly listened as a number of library staff members have expressed dismay over "some" students' treatment of books, disregard for our circulation policies, and, of course, the number of books that have gone missing over the past year. Compared to the size of our student body, we have very, very few unhappy incidents. But they tend to be the ones on which we obsess. I listen and say little. Perhaps because I can empathize a bit with the little miscreants. As a student, I took full advantage of my school library fiction collection, but never checked out a book. I had personal copies of all my textbooks in a closet at home as well. Imagine my chagrin when I came home after my first semester at college to find that my mother had returned all my personal collection of the school's books to the school. (She must have done it anonymously since I still was name a "distinguished graduate" many years later.) It's been well documented that librarians themselves are among the worst book thieves. Here is one explanation: Don't dismiss book theft as the work of a few ordinary crooks. Everybody does it. "People who steal books are some of the best people in the world," says Allan Robbins of the Alexandria, Va., library system. Journalists, seminarians, lawyers, doctors, teachers and especially librarians steal books, "which shouldn't come as any surprise -- they use them and value them," says William A. Moffett, head of the Huntington Library...1 Perhaps this explains why I can't get too worked up when books go missing. I remember once having had an adolescent brain that somehow allowed book pilfering as well. I don't get too worked up when someone loses or accidentally damages a computer or phone either, since I have also done both of these thing. Stuff happens. While I certainly believe we should be developing responsible library users, creating a welcoming experience that included empathetic library staff should take precedent. (See Libraries are just fining themselves.) Children and staff should expect gratitude, not scorn, when returning materials to their school library. One day, when all we read are ebooks, the theft and overdue issues will be moot. I live for the day. "Is there a klepto in the stacks?" New York Times, November 18, 1990. "People who steal books," CMJA-JAMC, December 11, 2001, "Protect your library the medieval way, with horrifying book curses" Atlas Obscura, November 9, 2016 Doug Johnson | 2 Comments | Share Article Page 1 2 3 4 5 ... 6 Next 3 Entries »'''
