nture - a bike/boat trip on the Danube this summer! All my photos from the trip can be found here Doug Johnson | 5 Comments | Share Article Email Article to Friend Reader Comments (5) I haven't ever done a road scholar trip but now I need to check it out. It sounded like it was fun! February 12, 2025 | Pat Hensley Hi Pat,From reading your blog and knowing how you like to travel, I think you'd enjoy a Road Scholar trip. My only suggestion would be to carefully read the itineraries since they are quite accurate and may or may not be to your liking. Good luck!Doug February 12, 2025 | Doug Johnson Looks like a great trip with some wonderful scenery. And thanks for posting the photo gallery, Doug. It's nice to live vicariously through other peoples experiences. :)As to RoadScholar, I've done six of their trips in the past decade and am a big fan. They are well organized and offer a wide variety of programs. But as you noted, you have to do the research to find the ones that fit your style. I suppose that's true when buying any kind of packaged travel.Looking forward to following along on your river cruise this summer. February 12, 2025 | Tim Stahmer Wow! I am so impressed that you got to be so close with the cute little penguins! They are my favorite animals; seeing them in their natural habitat is a dream! This looks like a fantastic trip! It's so neat to see how people in other countries live. February 12, 2025 | Mandy Thanks, Tim. I always like reading your travel posts as well. DougHi Mandy,It was a treat to see the penguins. And yes, they had little fear of the humans tromping around on their island - much like the sea lions and iguanas on the Galapagos. Doug February 13, 2025 | Doug Johnson // <![CDATA[ var isAddCommentsVisible = true; function toggleReferenceMode() { if (isAddCommentsVisible) { hideObject(document.getElementById("add-comment-area")); showObject(document.getElementById("add-reference-area")); } else { showObject(document.getElementById("add-comment