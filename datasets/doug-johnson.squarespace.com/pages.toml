full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from August 1, 2010 - August 31, 2010 SaturdayAug282010 Thought leaders in school libraryland Saturday, August 28, 2010 at 03:09PM In response to my post "Age and Change," Alice Yucht suggested: Have you seen this: Who are the thought leaders in educational leadership? [by Jon Becker] I think you and Gary Hartzell need to compile a similar article re: school library leadership! Yeah, get me in trouble, Alice. I just know that I would leave some top notch influencers off the list. But it may be a good idea, especially if a comprehensive and thoughtful list could be moved to the SIGMS wiki or the T-L Ning - where lots o'people who are better read and better informed than I am could add to it. (I am admittedly weak about international school librarians, academics*, and AASL leaders). I often get asked to suggest good writers and presenters about library related topics. This would be a great resource any of us could just point to when asked such a question. Whether through books, articles, editorialships, blogs or organizational leadership, these folks have made sustained, public contributions directly addressing school libraries - and influenced MY thinking about the field. Alice Yucht Amy Oberts Anita Beaman Annette Lamb Barbara Jansen Barbara Stripling Bob Berkowitz Brenda Anderson Brian Kenney Buffy Hamilton Carl Harvey Carol Gordon Carol Kuhlthou Carol Simpson Carolyn Foote Cathy Jo Nelson Chris Harris Clarence Fisher Daniel Callison David Loertscher David Warlick Deb Levitov Deb Logan Debbie Abilock Diane Chen Diane Cordell Dianne McKenzie Donna Baumbach Doug Achterman Doug Johnson (somebody else suggested this) Ernie Cox Fran Bullington Frances Jacobson Harris Gary Hartzell Gail Dickinson Gwyneth Jones Heather Loy Hilda Weisburg Jacquie Henry Jamie LaRue Jamie McKenzie Jane Prestebak Jean Donham Jeri Hurd Jim Randolph John Royce Joyce Valenza Judi Moreillon Judy O'Connell Karen Kliegman Kathy Lemaire Kathy Schrock Keith Curry Lance Ken Haycock Kristin Fontichiaro Larry Johnson Laura Pearle Laurie Conzemius Leigh Ann Jones Lesley Farmer Lisa Perez Marcia Mardis Mary Alice Anderson Mary Ann Bell Mary Ann Fitzgerald Mary Woodard Mike Eisenberg Nancy Everhart Nancy McGriff Nicola McNee Patricia Carmichael Rob Darrow Rob Rubis Ross Todd Sandra Hughes-Hassell Sara Kelly Johns Shannon Miller Shelee King George Stephen Abram Stephen Krashen Susan Sedro Vi Harada Wendy Stephens Please add your own "thought leaders" in a comment. Rather than me replying, I'll just update this post. And I just know I've left people off the list. My apologies in advance. * Becker's article is worth reading since it speaks of a disconnect between academics and practicioners. Also see An Open Letter to New Professors by J.M. Anderson on the Minding the Campus blog. Comments on this post are closed. Please see: Thought leaders in school libraryland - the next step Image source Doug Johnson | 40 Comments | Share Article SaturdayAug282010 BFTB: The Tech Nazi Saturday, August 28, 2010 at 06:00AM A new Saturday Blue Skunk "feature" will be a revision of an old post. I'm calling this BFTP: Blast from the Past. Original post, Sept 1, 2005 I was visiting a small school district not long ago and had a chance to visit with its curriculum director. In passing, she referred to their technology director as the “Tech-Nazi” - a title borrowed from Seinfeld’s character the Soup-Nazi. This is not the first time I’ve heard people in other districts who have a position like mine described in less than endearing terms. One librarian refers to her tech director as “Bob God.” I heard a teacher refer to her district’s technology department as the “Prevention of Education Department.” And of course there are those other names that shouldn’t appear in a blog my mom reads. Tech directors have two strikes against them coming out of the box. First, technology itself is not always been warmly embraced by educators (not to state the obvious or anything). Its complex and often unreliable nature makes it a source of irritation more than delight. Second, techs have an appreciation of the vulnerability of the equipment they are charged with maintaining that normal people simply don’t. We see those viruses, hackers, software conflicts, power-surges, and SUDs (stupid user dysfunctions) that are always surrounding our little fort, waiting for the smallest breach, and then sneaking in and wreaking havoc. I, for one, would be heart-broken if I thought my nickname was Tech-Nazi or Doug God. Good working relations with people are as important to me as the good working order of computers. And I think it is possible to have both if: You listen to and heed both educators’ and technicians’ views before making a technology policy decision. You establish a formal collaborative decision-making body that meets on a regular basis and includes as many types of stakeholders as possible. You take the time to communicate in understandable terms why a technology decision has been made (and have a damn good reason for making it). You support the goals of teachers and students, not separate technology “goals.” You leave the office and visit teachers and librarians to find out how they are really doing with technology. (I call this being a complaint magnet.) You tend to err on the side of convenience and accessibility rather than on the side of security (and pray it doesn't come back to bite you). You always give other people the benefit of the doubt, recognize accidents happen, and truly believe equipment is better worn out than rusted out. Never, ever lie, especially if it is just a CYA move. You get caught once and there will be no trust left. You comply with the law but you don't hyper-comply, always taking the least restrictive path. Most people - most - are pretty reasonable. If a decision, procedure or requirement they don't like is explained to them respectfully, clearly and honestly, they don't hold it against you. You can shake your head together in synchronicity, both of you victims of technology design and the world. I’d love to hear other ideas about improving one’s reputation as well as one’s effectiveness. And other nasty names for tech directors you’d care to share. Image source Doug Johnson | 14 Comments | Share Article FridayAug272010 Age and change Friday, August 27, 2010 at 10:41AM Old age and treachery will always overcome youth and skill. Willie and Waylon Thanks to my friend John Pederson, I got a chance to hear Seth Godin in person yesterday morning in Minneapolis. A lively, well-presented delivery with an excellent Q&A, Godin didn't cover much new ground for those of us who are regular readers of his blog, but he did remind me about the need for innovation and change. As "artists" he says, we need to always be taking risks. Those who don't fail often should be fired. In yesterday's post Senior Management, Seth Godin writes: One thing that happens to management when they get senior is that they get stuck. ([It] isn't about old, it's about how long you've been there). If you've been doing it forever, you discover (but may not realize) that the things that got you this power are no longer dependable. Reliance on the tried and true can backfire. This one struck a little nerve with me. While I am probably not as old as many of you think, I am constantly running into peers who are the age of my daughter (and younger). I am in constant check for "hardening of the opinions." I am starting my 20th year in my current position (I rose to my level of incompetence early and stayed there) and I've been in education since 1976. You do the math. And a guy has to wonder if a younger, more exited, less cyncial skeptical experienced person running the tech department might make a bigger difference in students lives. 'Where could we be by now?" I ask myself. I am gobsmacked by some of the up-and-coming powerful voices in ed tech and libraries. I won't list them because I will leave somebody out - you know who you are. The ideas, enthusiasm, impatience and even anger is moving and exciting. They will cause change to happen. <- Me in about 5 years. What Godin and the young turks don't realize, however, this that we geezers have at least one small advantage - some of us would sort of like to get fired - or at least be encouraged to retire with a nice severance deal. That means we are happy to take some chances. And maybe we have a little better idea of what chances are worth taking ... Oh, Godin didn't look like any spring chicken himself. Image source Doug Johnson | 4 Comments | Share Article Page 1 2 3 4 5 ... 10 Next 3 Entries »'''
