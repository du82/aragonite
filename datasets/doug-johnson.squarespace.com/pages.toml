full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from August 1, 2024 - August 31, 2024 SundayAug252024 Be a good hiking and biking leader Sunday, August 25, 2024 at 02:47PM I generally enjoy group hikes and bicycle rides. New places, good conversations, and longer durations. But some are definitely better than others, often times due to the skills of the event leader. By following a few basic guidelines, you can be a well-regarded organizer and a good role model for those who may lead in the future. These are practices I try to keep in mind. Provide an accurate description. Most hiking and biking clubs and Meetup groups give the organizer of the event the opportunity to describe the activity. How long is the bike ride? How fast is the hiking pace? What will the surfaces be like and will there be hills? Anything special that one needs to bring? Any other activity (bird watching, stopping for ice cream, etc.)? Anticipated length of activity. Oh, and then do your best to conduct the activity as described! Scope out the route. The best organizers hike the trail or ride the route shortly before the group event. No surprises then with closed paths, muddy trails, or large carnivorous plants from which one needs protection. Oh, and it significantly decreases the likelihood of the leader getting lost themselves. Start on time. One of my major complaints about group activities is that there are often those participants who feel being ten minutes late qualifies for being on time. Here in Minnesota, especially in the winter, keeping people just standing around waiting in the cold is cruel. Being on time means not just being present, but being ready to go - tires filled, boots on, pack adjusted, bathroom visit completed. I make it clear that our event’s starting time is our starting time and that I do not wait for those coming late. Text me and I will let you know the route and perhaps you can catch up. Use a sweep. There will always be faster and slower participants in a group hike. There will be those who may wish to stop and take a photo or retie their shoes or just walk/ride slowly. For a group of any more than about half a dozen, a sweep is a good idea. The sweep’s job is to monitor the stragglers and make sure no one gets left behind. If the leader can see the sweep, they know everyone in the group is accounted for. Walkie talkies are a good to use if you have them. Stop at junctions. Our family has a long standing hiking rule: You can go as fast as you want, but you must wait anytime there is a choice of paths or roads to follow. I like to share a map of the ride or hike I am leading, but stopping before others get lost is even more important. I am proud to say I have a participant survival rate of over 80% as a result. Remember that people join group activities to socialize and learn new places to recreate. Most of the group activities in which I participate start with introductions - first name, length of time with the club, etc. A little icebreaker is usually a good idea - Where is your favorite place to bike? What are you looking forward to this fall? What is your favorite dessert? (Stay away from religion and politics.) I suggest a place to gather for lunch after the ride or hike if people would like to eat lunch together. In planning, I also try to select places that may not be terribly well-known. One of things I’ve liked best about the club and Meetup group activities is learning new bike trails and hiking paths myself. I live in a suburb of Minneapolis/St Paul so while I know parks and trails in the south metro area, I am always happy to try something new in the northern part of the metro (or out state) Look for training. Good bike clubs offer, and may require, training to those new to leading rides (partly out of legal responsibility.) Know the rules of the organization (helmets required, for example). Good club rules result in a safer experience for all. Be a sport and lead a hike or ride. Repay the leadership others have shown you in the past. If you mess up, you will find participants quite forgiving. Do your good deed for the day. Doug Johnson | 3 Comments | Share Article TuesdayAug132024 Please don't complain about inflation if... Tuesday, August 13, 2024 at 09:12AM I looked at research by behavioral scientists and an array of personal finance experts. More often than not, they find, that feeling of financial insecurity is the result of lifestyle inflation. ... The more some folks make, the larger they live. Wants turn into needs. Luxuries become necessities. …. If you’re feeling you aren’t earning enough to feel financially secure, do a reality check. “Americans would feel rich if they made this amount of money: Lifestyle inflation may be keeping you from feeling financially secure.” Michelle Singletary, Washington Post, July 3, 2024 Please. If you: Drive a vehicle for which you paid more than $25,000 and gets less than 25 mpg Live in a house with a value of more than $300,000 Drink wine that costs more than $10 a bottle Smoke cigarettes or pot Have a phone that cost more than $300 Eat multiple meals out each week Buy new clothes before the old ones are worn out (or outgrown) Eat junk food Buy books instead of checking them out from a library Own a cabin or a timeshare Send your kids to a high priced private school or college Take out a loan or accumulate credit card debt to take a vacation Attend live concerts and/or sporting events Own a boat, RV, motorcycle, ATV, or ebike Drink coffee at Starbucks Subscribe to multiple streaming services please do not let me hear you complain about inflation. Consider Singletary’s words above and ask yourself if you can’t afford your needs - or can afford your ever increasing wants. Two things especially frustrate this grumpy old man. One is the amount of junk food that fills grocery store shelves. It’s expensive, bad for you, and addictive. If you don’t by the Doritos, you can probably afford that gallon of milk or fresh sweet potatos. The second is sharing the road with giant pickup trucks that seem to have no reason for being driven except to relieve the physical insecurity of the driver. Yes, we all have our spending weaknesses. Yes, there are plenty of people who just squeak by from week to week or month to month. Yes, I am judgemental and lacking empathy. Just don’t bitch about the price of gas when you are only getting 12 mpg. Doug Johnson | Post a Comment | Share Article TuesdayAug062024 Counting one’s blessings - digitally Tuesday, August 6, 2024 at 08:37AM Blue Skunk blog readers know I like photographs. Taking them, scanning them, organizing them, sharing them, I’ve taken photos since I was a kid using a Kodak Instamatic camera back in the 1960s. (Remember flash cubes?) I took slides using a Pentax 35mm camera with a telescopic lens on my travels in the 1980s. I dropped a Canon digital camera in the waters off Abel Tasman park in 2010, ruining the camera but saving the photos on the memory card. And like many of us, I’ve documented my travels, my grandchildren’s growth, and family events using the camera in my smartphone. I have thousands of photos, in print, scanned, and digital from over the years. But it is rare that I take the time to look at them. The physical photos are in albums stored in my second bedroom/office. The digital and digitized shots are on a website in the cloud. Yeah, I have a few prints framed around the house. I have personal photos as screensavers and backgrounds on my computers and phone. And I make the family calendar full of photographs that I glance at now and then. But for the most part, my pictures have been out of sight, and sadly, out of mind. That is until this past week when I received a “digital frame” as a birthday gift. This small monitor is designed to display pictures randomly from a collection uploaded to the manufacturer’s website (or from a flash drive or memory card if so desired). So over the past few days I’ve been carefully selecting photos from the past 60 years to be shown on the frame that distractingly sits beside my television set. (I have lessened the distraction by changing the change rate of photos from one minute to five minutes.) And what a pleasure this task has been. Looking back over childhood snapshots, somewhat faded photos from the 70s and 80s. Converted slides from the 90s. And of course heartwarming pictures of my kids and grandkids as they have grown up, along with good times with friends. Such a visceral way of counting one’s blessings! Looking at my photos I realize just how fortunate I have been to have grown up in a stable household with caring parents and relatives. How it has been possible to get a good, yet affordable education. To have had a rewarding career and professional opportunities. To have been in loving relationships. To have raised responsible and pride-inducing children. And to have had the joy of being part of grandchildren’s growing up. I guess a digital photo frame is just one more blessing to count! Doug Johnson | 3 Comments | Share Article'''
