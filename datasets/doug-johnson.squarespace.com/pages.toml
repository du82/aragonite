full_description = '''_uacct = "UA-103606-2"; urchinTracker(); ThursdayFeb272025 I would make a terrible billionaire Thursday, February 27, 2025 at 09:26AM Image source His servant picked up the spade and dug a grave long enough for Pahom to lie in, and buried him in it. Six feet from his head to his heels was all he needed. “How much land does a man need?” Tolstoy Johnson's Rule for Winning at Life: Be the person in the nursing home with the best stories, not the most money. Why does anyone making millions of dollars a year need a tax break? I sincerely do not understand this. Congress is currently debating whether to extend Trump's tax cuts that are set to expire this year. While all taxpayers might be impacted, the richer you are, the more money you will save. I don’t really care except that this tax cut seems to be coming at the expense of low income people: Medicaid, SNAPS, special needs students, and foreign aid recipients. Way back when I was a high school English teacher, I had my juniors read the short story “How much land does a man need? by Leo Tolstoy. The gist of the story is that by trying to amass a huge amount of land, a peasant dies by over exerting himself. The lesson being that in the end, all the land anyone needs is enough for a grave. The classroom discussions that followed were always interesting, often revealing quite diverse values among the students. Money, service, family, leisure - what is the best thing for us to strive for in our lives. It’s a question that in retirement I don’t need to ask myself much anymore. I long ago decided that enough income on which to live comfortably, not extravagantly, was enough. I’ve never yearned for a mansion, a yacht, a giant pickup truck, or a diamond studded Rolex. I am not envious of those with more money than I have. I value economic security, good health, positive relationships with friends and family, interesting books, and adventurous travel. This is not to say that I don’t in some ways empathize with those who would like the finer things in life and have the money to afford them. People do seem to enjoy their possessions. I like my “things” as well - it’s just that their value lies in the memories they stir, not how much they might bring at auction. But to paraphrase Tolstoy, just how much money does a person need? Here is what really puzzles me. A person with one billion dollars invested in an account that pays just 3% has an annual income of thirty million dollars. Geeze, just enough to scrape by. What this tells me, for these billionaires who are determined to lower their taxes, it isn’t about the money. Or privately redistributing the funds to good causes. It’s about keeping score. It’s about power. It’s about compensating for insecurity. It’s about winning a game. It’s a mental illness. And we seem to have these nut jobs now running the country. PS. On a related subject, I am glad when businesses make good profits since the investments in my IRA tend to do well. So I am not totally lacking in empathy for those who want less regulation, lower business taxes, etc. But I don’t think the health of my mutual funds should come at the price of the health of low income people. PSS. Should I ever win the lottery (slight chance since I never buy tickets), I would take the winnings and create a kind of universal basic income for as many of my relatives and friends as possible. A trust fund that paid out, say, $50,000 a year would, I calculate, keep a person off the streets, but not living so well they are disincentivized to work. And yes, I’d keep a little for myself as well. Doug Johnson | Post a Comment | Share Article FridayFeb142025 Damned pennies Friday, February 14, 2025 at 08:45AM Each day when I was growing up, my grandmother put a coin in a small plastic piggy bank that sat on her kitchen counter. It looked somewhat like the one pictured above. The coins were my college fund. For as long as I can remember, she insisted that I would one day attend college. And this was how she viscerally let know. When the bank was full, I would count out the change and, along with my small black account book, would head to the bank where the coins would be deposited and my balance increase. It was fun seeing the running tally rise over the years. By the time I graduated from high school, I had about $600 in the account - no small amount in 1970 when tuition at a state college was about $140 a trimester. I honored my grandmother’s expectations by getting not just a bachelors degree but a couple years later my masters. I was the first in my family to get a college education. Now Granny did have one rule about adding to the fund each day. The coin deposited had to be silver - it could not be a penny. Even an entire bank full of pennies would not have amounted to much. Even in the 1950s and 60s, pennies were held in low esteem. A penny would buy you a gumball and that was about it. While I am deeply troubled by nearly every action our current president has taken in his first few weeks in office, one initiative I can get behind is his move to stop the production of pennies which take over 3 ½ cents to make. I could get behind the elimination of nickels as well which cost nearly 14 cents to make. Even more than the economic foolishness of continuing to make these small coins, they are simply a nuisance. I don’t remember the last time I put a penny or nickel in my pocket instead of the change or tip jar on a counter. If Trump’s and Musk’s goal is to improve the efficiency and lower the cost of the federal government, I can get behind it. But if your windows leak, you don’t tear down your house; you fix the windows. If bureaucrats lose their jobs, fine. But if humans lose the needed services their departments provide, that’s quite another story. Getting rid of pennies is one thing; getting rid of entire programs that serve those in need is something quite different. I will keep looking for bright spots in the news over the next four years but I am not optimistic. Doug Johnson | Post a Comment | Share Article TuesdayFeb112025 Tangos, glaciers, penguins, and vineyards: a trip to Finis Terrae Tuesday, February 11, 2025 at 04:35PM Tourists blocking the scenery at Torres del Paines National Park Wine is not the answer but it will help you forget the question. - guide at the Vina Santa Rita winery Home yesterday from a two week Road Scholar trip: Finis Terrae: Exploring the Wilds of Southern Patagonia. (Detailed itinerary in the link.) These short remarks about the trip are written as much or more to help me remember the adventure as they are to inform or, hopefully, amuse you. A link to 200+ photos from the trip is at the end of this post. Wine tasting in Buenos Aires This was a guided adventure rated as “Let’s Go” - the most active rating of all Road Scholar trips. And we did our share of walking and hiking, but little outside the comfort zone of the group which was composed of older adults (65-83, I think). We flew to Buenos Aires on an overnight flight and were picked up at the airport by the local guide. Everything on the trip was arranged - accommodations, meals, tours, hikes, and transportation. While there were some things I would probably have skipped or added were I to have planned an independent trip, it was lovely having someone else worry about the details. And our group of 16 people was quite compatible. No trouble makers. Unless I was so identified by the others. In the La Roca neighborhood of Buenos Aires Our two night stay in Buenos Aires included a tango show (Heidi and I were not allowed to dance) and a wine tasting along with tours of neighborhoods, a huge cemetery, and a look at the Pink House governmental center where Eva Peron gave her famous talk. In the Ushuaia prison A 3 tour flight took us to Ushuaia, Argentina's southernmost city. Before boarding our ship the next day, we hiked a regional park (at the end of the Trans American highway) and toured a prison converted to a museum. Oh, and we bought some Dramamine in case the seas were going to be rough. Our cruise ship M/V Ventus Australis A real highlight of the trip for me was the five day cruise from Ushuaia to Puerto Arena though around Cape Horn and through the Strait of Magellan. The boat was smallish with about 150 passengers, 4 decks, and multiple lounges. Some of the best meals I’ve ever eaten and - get this - an open bar. (Alcohol seemed to flow freely with every meal this trip - especially wine and pisco sours.) Our cabin felt spacious and had a great window for watching the glaciers glide past. The crew was great. Zodiac boarding Each day, one or two trips aboard the rubber zodiac rafts were offered. My favorite were to areas near glaciers (Pia, Condor, etc) where we could hear the loud cracking of calving ice and see the splashes on the water. Here, as in the rest of the world, glaciers are receding at a rapid pace. Re-creation of an indigenous people’s shelter near Cape Horn,Tierra del Fuego The trip was loaded with lectures on history, geology, and the economies and politics of Chile and Argentina. The pre-Coumbian peoples had a tough environment in which to live, and sadly, few survived. Pia Glacier in the Beagle Channel We were told to be prepared for rough seas, but I only felt the boat rock once during the cruise, late at night. I suspect I would have slept through it had the door on the in-room safe not been banging back and forth. None of our excursions were canceled due to poor weather conditions. In fact, the weather was good for us the whole two weeks! Didn’t need the Dramamine. Magellanic penguins On the final day of the cruise, we had the chance to take a short walk around the small Magdalena Island, a popular nesting place for hundreds of penguins. Reminiscent of the Galapagos, the birds had no fear of the idiotic tourists who visited. I only hope we were as entertaining to them as they were to us. In Torres del Paines After disembarking, a long afternoon bus drive took us to Torres del Paines (pie’-nays) National Park, just north of Puerto Natales, where we stayed in rather rustic cabins just outside the park entrance. With the exception of some very high winds, the weather was great and the cloud cover did not cover the marvelous peaks in the region, including the three “torres” (towers) from which the park gets its name. Some beautiful hikes over the two days we were there. Hiking in Torres del Paines If I had any criticism of the tour, I would say that I’d have preferred a bit longer hikes with fewer stops for a guides’ often lengthy lectures. But then I have to remind myself that this was a Road Scholar trip. Oh, the roads in the park could have used some work as well - I thought the bus was going to shake apart a few times. Wild guanacos Guanacos (wan-ah'-kos), a species of llama, were plentiful in the park. But then as I alway say, if you've seen guan-aco, you’ve seen them all. (Nobody else on the tour thought that was funny either.) Attacked by a milodon - thankfully they only eat vegetarians On our way to the small airport in Puerto Natales, we stopped at a huge cave where the remains of the megafauna milodon were discovered in the 19th century. Humans had also lived in the cave in ancient times. Small sample of the wines aging in the Vina Santa Rita winery Our last two nights were spent in the Chilean capitol city of Santiago. I had visited the city once before in 2006 to attend a conference, but remembered very little about it. We visited a great archaeological museum, hiked a city park, and had a good time at a winery just south of the city. More wine tasting! Our hotel was very luxurious. A group photo. Christian, our guide, is at the far left. This was probably one of the least stressful, most pleasant trips I have taken. It was active, it was interesting, and it was relaxing. I only hope I can still be traveling like this at age 83, like Mary who is in the middle of the photo above. Next adventure - a bike/boat trip on the Danube this summer! All my photos from the trip can be found here Doug Johnson | 5 Comments | Share Article Page 1 2 3 4 5 ... 1156 Next 3 Entries »'''
