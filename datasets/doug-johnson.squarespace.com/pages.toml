full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from April 1, 2014 - April 30, 2014 WednesdayApr302014 Can educators be replace by robots? Wednesday, April 30, 2014 at 05:02AM We thought being talented would save our asses. We thought working late and on weekends would save our asses. Nope. … In order to navigate the New Realities you have to be creative - not just within your particular profession, but in everything. … this is true for everybody. Janitors, receptionists, and bus drivers, too. The game has just been ratcheted up a notch. Hugh MacLeod, Ignore Everybody. According to the Quartz interactive graphic, "Is your job at risk from robot labor?", educators on the whole don't fare too badly. Based on three factors, the median wage for various jobs; the number of people employed in those positions in the United States; and the likelihood that these jobs will become automated, the chart skews to the low-paying areas. Here are a couple interesting findings in the education category above: Far right dot -at 99% replacement probability? Library technicians At the 66% level - librarians And with an under 20% chance of Robbie taking your paycheck - most categories of classroom teachers. While I could not find a "school technology director" category, all jobs in the "Computer and Mathematical" chart were pretty safe, except for computer support specialists (66%) and mathematical technician specialist (99%). A quick and dirty interpretation of this study is that if you want to stay employed in education, teach. Simple. Doug Johnson | Post a Comment | Share Article TuesdayApr292014 The Flat World Library Corporation, Revisited Tuesday, April 29, 2014 at 05:19AM The post below was written nearly 10 years ago. After spending the morning with a vendor yesterday offering a large collection of e-books, reading metrics, teaching materials, etc., my concern was rekindled that "packaged" libraries will be a temptation for many schools looking for bargains, rather than as supplements to good in-house library programs.... October 7, 2007Superintendent Dennis WormwoodLeft Overshoe Public SchoolsLeft Overshoe, MN 56034Dear Superintendent Wormwood:We at the Flat World Library Corporation can offer you a complete library services at a very attractive price.For considerably less than you currently pay for your K-12 library program, we can provide a full range of library resources AND library expertise – all online.For only pennies a day per student, FWLC will: Provide a full range of reading materials (periodicals, picture books, fiction and non-fiction titles), videos, and reference sources that are tailored to your state standards, your district’s curriculum, and your digital textbook series. These resources are being continuously updated, and are available, of course, in a wide range of lexiles to support your differentiated instruction efforts. Our filters allow you to specify access only to the materials supporting your community’s views on issues ranging from abortion to gay rights to evolution. Select from “university community” to “small town Kansas” in your settings. Provide ready reference services, student research help, readers’ advisory service, and curricular planning advice through our real-time connections (video, chat, or e-mail) to our experts in Bangalore, India. These highly-qualified MLS certified professionals will be available 24/7 to both your staff and students from school or home. (Do you currently get service from your library staff outside of school hours, in the summer, or on weekends?) Allow teachers to submit student work for comment and assessment. Our staff will give each project a grade, check for plagiarism, and provide a report for each child to share with parents about the technology skill level of that student. We can even help your teachers design assignments and assessments so they are free to lecture. Just think of the advantages: No musty books from the 1950’s cluttering your library shelves, driving up your insurance rates. No more lost or missing books. No gum under library desks. No library facilities. Turn that old library space into those badly needed special education classrooms. No annoying librarians who want more money for materials, support staff, and staff development (or a living wage and health insurance). Our highly-skilled Indian workers are delighted with their $5 per hour jobs! Your entire library program can be maintained by a single, semi-competent technician in your district. You can justify your district’s expensive, unpopular 1:1 computer/student initiative. No ugly book “challenges” since all materials have been “tailored” to your parents’ religious views. Please read the attached study (scientifically-based research conducted by FWLC’s very own research department) that empirically demonstrates that the FWLC product can dramatically improve student performance where it counts - on high stakes tests. (FWLC has been approved by the DOE for Title II, III, IV, and IX funding – unlike traditional library materials and librarians.)AND take advantage of our offer by December 31, and we will throw in absolutely free, 50 of MIT’s $100 laptops for families in your district that qualify for FRP meals! Act today! Coming soon – special pricing for regional and state-wide purchases. Sincerely,Bob Screwtape,President and CEOFlat World Library Corporation300 Gates DriveRedmond WA1-800-NO-BOOKSWill you, as a librarian, be prepared when this letter appears in YOUR superintendent’s mailbox in the next couple years?Oh, and please don’t kill the messenger! Doug Johnson | 3 Comments | Share Article SundayApr272014 BFTP: What do our school building say about us? Sunday, April 27, 2014 at 05:28AM A weekend Blue Skunk "feature" will be a revision of an old post. I'm calling this BFTP: Blast from the Past. Original post March 26, 2009. Serving on teams which are planning our new middle school for the district and an addition to a wing to our current 7-8 building, I've been thinking about facility design again. This was a good one review for me. We shape our buildings; and forever afterwards our buildings shape us. - Sir Winston Churchill Architecture is an expression of its time and place. It reflects the values, power, and dominant elites of the prevailing social structure and the relevant position of nation states in the global context. It even demonstrates the attitudes of imperial powers to their subject peoples. Jack Diamond of Diamond and Schmitt Architects To what extent do our school buildings show respect or disrespect for children? Do we adult overlords design spaces that purposely subjugate and control rather than encourage growth and individualism? One of the ugliest buildings both inside and out has to be Minnesota State University's Armstrong Hall of Education. Squat, square, and Spartan both inside and out, it's windowless, right-angled, and utilitarian classrooms couldn't have been exciting even when the building was new in 1964. Might one not expect graduates of this school to think in straight lines and exhibit one-right-answer mentalities? Designers of most educational spaces seem to concentrate on low cost construction, ease of maintenance, security, and visual control. Comfort, aesthetics, and inspiration don't much figure into the design process. Hey, it's just kids that will be in these buildings after all - what do they care? Here are two pictures from projects I've been proud to be a part of designing. Look at the pictures as see if you note anything they have in common: Give up? While it's a little difficult to see, both media centers use curves in their design. The St. Peter media center above has a curved circulation desk that mirrors the curved lines of the greenhouse above it. The Eagle Lake media center has a curved couch (and its unseen story area is curved as well). There are many other ways to show respect for facility users beyond creating interesting lines. Indirect lighting; varying elevations in ceiling heights; real windows and skylights; warmth-creating wood and fabric surfaces; and comfortable work/study/reading areas, both social and private. And of course, a place to display art on either a permanent or rotating basic. Our students are no longer the captive, "subject peoples" they once were. Few students have to attend your school with the growing number of alternative education options like charter schools, home schools, open public school enrollment, online schools, and private schools from which they have to pick. Shouldn't to start designing schools for people with choices? And for children we respect? Doug Johnson | Post a Comment | Share Article Page 1 2 3 4 5 ... 8 Next 3 Entries »'''
