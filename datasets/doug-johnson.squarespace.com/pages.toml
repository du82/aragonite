full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from April 1, 2016 - April 30, 2016 TuesdayApr262016 12 reasons why e-books are inevitable Tuesday, April 26, 2016 at 01:58PM Heathorn, RJ 1980 Learn with Book.In: Hills, Phillip J., ed. The Future of the Printed Word. Greenwood Press. "A new aid to rapid - almost magical - learning has made its appearance. Indications are that if it catches on all the electronic gadgets will be so much junk. The new device is known as Built-in Orderly Organized Knowledge. The makers generally call it by its initials, BOOK. Many advantages are claimed over the old-style learning and teaching aids on which most people are brought up nowadays. It has no wires, no electric circuit to break down, No connection is needed to an electricity power point. It is made entirely without mechanical parts to go wrong or need replacement …" via Stephen Krashen in e-mail to AASL Forum The resisters are plentiful. Scattered research on comprehension is worrisome. Pricing and compatibility and copy protection are problematic. But the future of books, textbooks, and other educational resources is digital, especially in schools, and here are a dozen reasons why... E-books do not get lost or stolen or damaged. E-books can be updated, revised, corrected. E-books can be accessed at any time from any place. E-books do not require physical storage space or labor for shelving. E-books have assistive/adaptive features for readers including built-in dictionaries, text-to-speech, translations, font-size adjustments, etc. E-books do not stigmatize readers by having covers that may indicate reading abilities or tastes. E-books are transportable and always on hand if read on tablets, phones, and other devices that people seem to always have with them. E-books can be supplemented with multi-media resources like video and sound and animations that help illustrate and explain concepts. E-books and digital resources can be easily curated and linked to courses and lessons in learning management systems helping differentiate instruction. E-book highlights and notes can be easily created, found, and exported. E-book completion can be tracked, recorded and analyzed. E-books mean never running out of something to read. I suspect when the automobile was introduced, horse lovers compiled a good number of reasons why these noisy, slow, unreliable, gas-dependent, road-dependent, and uncomfortable machines would never replace Ned and Nellie. History is on the side of e-books. Get over it. See also: http://www.doug-johnson.com/dougwri/future-of-books.html http://www.doug-johnson.com/dougwri/future-of-books-revisited.html http://www.doug-johnson.com/dougwri/turning-the-page-e-books.html http://www.doug-johnson.com/dougwri/the-e-book-non-plan.html http://www.doug-johnson.com/dougwri/managing-digital-resources.html Image source Doug Johnson | 3 Comments | Share Article TuesdayApr262016 Overcoming the crab mentality in education Tuesday, April 26, 2016 at 06:04AM Crab mentality, sometimes referred to as crabs in the bucket, is a way of thinking best described by the phrase, "if I can't have it, neither can you." The metaphor refers to a bucket or pot of crabs. Individually, the crabs could easily escape from the pot, but instead they grab at each other in a useless "king of the hill" competition which prevents any from escaping and ensures their collective demise. The analogy in human behavior is claimed to be that members of a group will attempt to negate or diminish the importance of any member who achieves success beyond the others, out of envy, spite, conspiracy, or competitive feelings, to halt their progress. Wikipedia The topic of educators exhibiting "crabs in a bucket" syndrome was raised at a meeting the other day. Do teachers keep other teachers from shining out of "envy, spite, conspiracy, or competitive feelings" - or, I would add, the culture of a building, district, or profession? Personally, I have rarely experienced this, but perhaps it is because the only teachers I get to know are the ones who don't allow the other teachers to keep them from achieving. These are the true district leaders - those who go above and beyond by directing activities with students or other staff members outside the classroom; those who serve on district leadership committees (in technology, especially); those who are unafraid to help their building administrators set goals, plan initiatives, and face criticism for wanting to move others outside their comfort zones. Those willing to speak to me, to speak out, on behalf of their students and fellow teachers. The crabs at the bottom of the bucket, I guess I just don't see very often since they are, well, at the bottom of the bucket, invisible. Outside the district I also encounter very little crab mentality, not because it doesn't exist, but because those with whom I interact - the bloggers, the tweeters, the article writers, the conference speakers, the professional association leaders - are those who will not be held down. These are practitioners of their crafts - classroom teachers, librarians, building and district administrators, technologists - who share and provoke and envision and challenge me. And provide me the courage to escape my own bucket now and then. I am very happy to report that I have seen new teacher-leaders informally rise in our district. We have brave souls who are creating the kinds of help sheets and guides for our new student information system that the company that produces the code itself cannot or will not provide - those written from the POV of the classroom teacher IN OUR DISTRICT. Similar initiatives are starting for our learning management system, developing a teacher-led support team to improve the ability for all classroom teachers to use the LMS well. Schools can no longer afford, if they ever could, the crab mentality among staff members. Perhaps technology intitiatives' real worth lies not in the power of the technology, the power of bringing people together to use the technology well. Doug Johnson | 2 Comments | Share Article SaturdayApr232016 BFTP: Inventing your technology future Saturday, April 23, 2016 at 05:35AM A section of the final chapter of the book The Classroom Teacher's Technology Survival Guide. I'd love to hear more ideas on this topic. How you can invent the future and take charge of your own technology environment The best way to predict the future is to invent it. Alan Kay The biggest mistake teachers can make in technology use is to simply let the future happen to them rather than be a serious part of creating their future. But how do you do this as a teacher and still teach full time? 1. Have a personal vision of education and how technology should be used in it.One of my favorite recipes for change is the simply stated formula: C = V X D X F > R. Richard Beckhard and David Gleicher posit that Change = Vision X Discontent X First steps > Resistance. Both vision and discontent are plentiful supply in most schools and communities. It’s figuring out how to develop a shared vision and then get the resources needed to make those “first steps” toward making it come true that is lacking. Teachers who invent their own futures take time to reflect and formulate a personal vision of what education ought to look like and the role technology plays in that vision. And then modify what they do – even slightly – to move toward that educational model. 2. Have a voice in school technology policy-making and planning I often hear comments like this from teachers who are upset about the technology policies in their district: "They" are blocking school access to YouTube. "They" make us use PCs when I’d rather have a Mac. "They" won’t let me access my grade book from home. “They” won’t let me use my personal laptop computer on the school’s network. “They” insist we have long and complicated passwords and make us change them all the time. "They" make us teach to the test. The question I have when I hear statements like this is: “Just who is this mysterious ‘they’?” Can you actually name "them"? Or are "they" just a convenient scapegoat for poor policy-making procedures? Can you as a single teacher influence "them?" And are you personally working to change such decisions from being made by a faceless "they" to being made by a known "we?” If not, you should be. It's your professional obligation. By its very nature, policy and rule making is influenced by human values. Nowhere in schools is this more evident than when it comes establishing appropriate policies for the relatively new and often confusing field of educational technology. Larry Cuban suggests such value conflicts present not a solvable problem, but a dilemma that needs ongoing management. In other words, policy-making is an area in which there will always be conflict, no matter how hard we work to resolve issues. Technology use disagreements have at their heart two very different sets values, resulting in two sets of priorities – one set held by the technical staff and one by educators. Technical people have the responsibility for data security, network bandwidth conservation, and the reliable operations of far too many machines. Techs desire rules that will decrease the likelihood of technical problems. Taken to the extreme, this results in a “if they can’t touch it, it won’t break” mentality. Limited access, over-blocking, and long-passwords are the byproduct of prioritizing security, reliability and adequacy. Teachers want as much access and convenience as possible. Security systems requiring multiple log-ins eat into class time and restrictions on what is accessible and from where can discourage technology use and innovative practices. Those for whom access, convenience and ease of use are the primary concerns often seek home access, simple passwords, private computer use, and minimal blocking. Both parties – techs and teachers – have legitimate points of view. And both parties are interdependent. Teachers won’t use the technology unless it works. Technicians are irrelevant if educators don’t use technology. There is no simple resolution to this ongoing dilemma of conflicting priorities, but I know this about making better policy decisions: the best rules and guidelines are those developed collaboratively. District and building technology advisory committees and building technology committees have policy development as a major task. These small groups that meet a few times each year are comprised of a variety of stakeholders – teachers, librarians, administrators, students, parents and community members with our technology personnel serving as ex-officio members. Technology use issues raised are given a full hearing. I often use Edward de Bono’s PMI tool, asking about a proposal “What’s Good, What’s Bad and What’s Interesting” to get a constructive discussion flowing during meetings. It’s a simple activity in which a statement is made – “The district should allow personal computers to access our wireless network.” – and then small groups list the positive (+), negative (-) and interesting (?) potential consequences of the statement, with each group required to have at least one item in each column. Collaborative policy-making can have two results – an agreement is reached that everyone can live with; or an agreement is reached that some members don’t like, but understand why it was made. Either way, such decisions are better than those made unilaterally by a faceless “they.” Don’t let “they” make technology use less productive than it can be for you as a teacher. Find the policy makers in your school and district. If there is a technology committee in place, get on it and contribute. If not lobby your administrators for the creation of one. Turn the “they” into “we.” 3. Experiment. Educational technology use is sufficiently new that there is not a body of “best practices” all educators should be following. The happiest and most effective teachers I know have the confidence to try new approaches to teaching and learning with technology. And they fully expect that not every experiment will work. Survival tip: Let your principal know about your experiment before conducting it, what you are hoping to accomplish, and discuss what worked and what didn’t work afterwards. Successful technology-using teachers “monitor and adjust” during these experiments, learn from them, and then modify or discard the activities that simply are not effective. 4. Look for a mentor, coach or guide. Find someone in the building will to teach you about new technologies. Oh, consider that this might be a student, not an adult. 5. Share information. Professionalism requires that practitioners share their knowledge with other practitioners. This can be done informally with fellow teachers during lunch or afterschool and at staff meetings. Effective practices should be shared formally: during staff and curriculum meetings at in-house staff development workshops at state and national conferences though school and professional publications in personal blogs, “tweets”, and social networking entries Parents also like knowing about how their children are using technology in the classroom. At parent-teacher conferences, in the school newsletter, and through the local media, information about interesting units that are augmented with technology are always greeted with enthusiasm. Survival tip: If your class is doing something interesting and new with technology, call your local newspaper and television station to see if they would be interested in doing a story. The school gets good PR and the practice may encourage others to try something similar. 6. Support others and use a teaching team approach. The movie Butch Cassidy and the Sundance Kid, Butch and Sundance find themselves on the edge of cliff overlooking a river far below with a posse rapidly closing in. It’s only by jumping together that they have the courage to escape. What we might find frightening to try alone, we can often do with a partner. Other teachers and especially your librarian make great partners when attempting to use a new technology or an old technology for the first time. Students can make wonderful partners when give responsibility for figuring out how to use a new technology when given that charge and responsibility. The giant and the ants: How big problems are really solved A tour guide in Nairobi told me this pourquoi story about how the Ngong (Knuckle) Hills just outside the city came into being. A giant once ravished the surrounding land. The animals of the savanna were determined to be rid of it. The big animals went in first: the elephants, the rhinos, the lions. Each in turn were soundly trounced by the giant. That night all the ants gathered and decided each would carry a few clumps of dirt and place them on the giant while he was asleep. They reasoned that they made up for their lack of size by their sheer numbers. By the next morning the giant'''
