full_description = '''_uacct = "UA-103606-2"; urchinTracker(); Entries from April 1, 2023 - April 30, 2023 SundayApr302023 Would AIs make better professionals than humans? Sunday, April 30, 2023 at 01:21PM https://midwest-dental.com/revolutionizing-dentistry-through-artificial-intelligence/ Might AI systems make better… Detectives? Doctors? Fashion designers? Financial advisors? Teachers? I was a bit taken aback when I received the email pictured above from my local dentist. The woman who stabs at my gums twice a year and lectures me about flossing needs the help of AI to do her job well? Should I be concerned? What might (and I emphasize might) AI offer in professional services that mere humans cannot? It probably has access to a larger amount of information and data on which to base decisions. It may be able to make those decisions in a more timely manner. It might be able to more clearly communicate the resulting information and recommendations. Perhaps it has already been done, but a good Sherlockian AI detective that has a human Watson (or a human detective with an AI Watson) might make a very interesting mystery novel. Should police detectives, espionage agents, and forensic accountants all be replaced with these digital geniuses? One quality that AI may put to extremely positive use would be objectivity - a lack of personal biases or prejudices. Properly programmed, my financial advisor AI should not be advising me to invest in areas where the advisor would get the biggest fee, but where I would stand to make the biggest return at the lowest risk. Would my AI dentist or doctor only recommend those procedures and medications that have proven rate of effectiveness not the most kickback from pharmaceutical companies? Would an AI intelligence agent be more likely to uncover double-agents in the office? How might AI improve educational practices? When Learning Management Systems started rolling out in the 2000s, I had the high expectation that they would be the impetus for Individual Education Plans for all students, not just those needing special services. LMSs as they currently are constructed still require a great deal of human input - differentiated learning materials, individual performance measures, and separate learning activities and assessments for each student. What has proven to be too much work for teachers with a big class load. Might, just might, AI step in to help run these LMSs? Knowing an individual student’s skill levels, learning goals, and the range of learning materials available, an AI just might be able to design the most effective IEP possible. As a librarian at heart, I believe that the more information and resources one has available, the better solutions to problems are possible. I believe emotions or personal biases decrease good judgment. Can AI offer heretofore impossible levels of rational recommendations? Or will the biases of the programmers seep into the nature of their AI creations as well? As an optimist at heart, I would like to believe each daily revelation of a new use of AI is taking us to a future filled with C3POs rather than Terminators; Datas not HALs. But I’d not bet any money of the outcome. Doug Johnson | Post a Comment | Share Article SundayApr232023 Smartphones and smarttravel Sunday, April 23, 2023 at 11:19AM Comments on my recent blog post “Tech Skills for Older Adults” emphasized how important competent use of a smartphone is when traveling - a skill many older folks may lack. I would agree. Reflecting on my own recent trips (many international), I would encourage travelers of any age to master these smartphone related tech skills… Basic operation, charging, and security features. Learning how to use a smartphone (or adjusting to a new phone) while on the road is not a good idea. One should know how to turn one’s phone on, unlock its screen, and open and close apps at a minimum. Talking, texting, and accessing other basic features such as email, calendars, and notepads should be second nature before relying on one’s phone away from home. Know what charging cords and plugins your phone needs and the type of plug the countries you are visiting require. For me, understanding security features in a phone is essential while traveling. A stolen phone that is unlocked and contains stored passwords can be catastrophic and reporting such an occurrence is more difficult when away from home without easy access to one’s provider. Gaining data access in other countries. While wifi is often available in hotels and restaurants around the world, I find mobile data access (directly to one’s phone) necessary when traveling. In the US, most data plans are accessible country-wide, but getting mobile access in other countries can be a bit more complicated. There are three basic ways to do this: Subscribe to an international plan with your regular cell phone service. I use T-Mobile and have done this with mixed success. Coverage in Western Europe worked great and was reasonably priced; coverage in SE Asia simply did not work. These plans can be expensive as well. Purchase a local SIM card on arrival at one’s destination. After making sure you have an unlocked phone (critical), one can replace the physical SIM (a small chip that slides into one’s phone) with one purchased in the country where it will be used, along with a specified amount of data. This method is often quite inexpensive and works well. Airports and tourist areas will have plenty of vendors of these products. Hold tight to your original SIM - you will need it again when you come home. (I have sometimes used an older phone just for international travel which is convenient for this.) Purchase an eSIM. This is the latest way to get access to data providers other than one’s own in the U.S. Relatively new, some new phones allow an app to be used in place of a physical SIM card and even allow multiple eSIMs to be used in the same phone. My phone does not support eSIMs so I have no experience with this mode of access, but it looks promising. Using online maps. The primary reason I like mobile data access is so that I can use my phone’s map applications. GoogleMaps is my personal go-to application which I use for driving, bicycling, and walking. A teacher in Tokyo also showed me how it can be used to plan travels on mass transit like subways, buses, and trains (very handy!) Another feature in GoogleMaps I like when driving is the ability to turn on the “Avoid highways” feature when taking a leisurely cross-country trip. (You can also “avoid” toll roads and ferries.) Using language translation. I’ve translated unknown words on signs and menus for many years using simple translation apps on my phone. (Never eat what you can’t translate is one of my travel rules.) More recently, I’ve begun using real time spoken language translation services. In my experience, they are somewhat unreliable and need really good internet connectivity, but can come in handy in some circumstances. They are worth checking out. Converting local currencies into US dollars. Hmmmm, that shirt is P1000 (1000 Philippine Pesos). Is it a deal or not? A conversion app like XE will quickly allow you to see the equivalent amount in US dollars ($18). This also works the other way. Say I want to withdraw $100 US from a cash machine, I can quickly find the approximate amount in the local currency. You too can be a millionaire in certain countries. Tracking flights and storing boarding passes using airline apps. Checking to see when (or if) your flight is scheduled for departure is easy using an airline’s custom app. If your flight is substantially delayed, there is no sense rushing to the airport. (You can also check flight status by simply searching the flight number in Google.) Most airlines allow flyers to check in online (avoiding lines) and to download one’s boarding pass. Knowing time zones using the phone’s clock. While I could probably do the math in my head, knowing one’s home time while traveling around the globe is easy to do with a smartphone’s clock app. I very rarely make voice calls while traveling, but when I do, I try not to call in the middle of the night. Oh, use the phone’s alarm clock feature instead of dragging along a separate alarm clock or relying on wakeup calls from the hotel desk. Using voice calling and texting apps. Skype and GoogleVoice use data to help you make voice calls internationally, either for free or at a low cost. As I said, I don’t use voice calling when traveling internationally very often. Texting can be quite expensive using your cell phone company’s international plan, so think about using Facebook Messenger to send messages. Whatsapp is very popular in many parts of the world to message others. I’ve only used it a couple times with guides who insisted it was their platform of choice. Saving travel information in email folders. You don’t hear “Sir, I don’t seem to have a reservation in your name for tonight.” when you can provide a confirmation number that is stored on your smartphone. To be able to easily locate those car rental, restaurant reservations, or tour booking numbers, know how to create email folders in which to place the confirmation email - labeled with the name of the trip. While your iPhone, Pixel, or Samsung device can certainly be complicated and at times frustrating, it can also be a terrific travel aid when used effectively. But remember, practice before you go! Doug Johnson | Post a Comment | Share Article SaturdayApr152023 Exacerbating hypochondria Saturday, April 15, 2023 at 09:45AM Illness anxiety disorder, sometimes called hypochondriasis or health anxiety, is worrying excessively that you are or may become seriously ill. You may have no physical symptoms. Or you may believe that normal body sensations or minor symptoms are signs of severe illness, even though a thorough medical exam doesn't reveal a serious medical condition. Mayo Clinic It’s difficult to get through a day of email, broadcast news, or social media without becoming just a little bit paranoid about one’s health. In just the past week, the AARP Newsletter shared the following clickbait: 7 Common Foods That Can Cause Belly Bloating Is a Morning Cup of Coffee Good or Bad for Your Eyes? 7 Foods That Don't Mix With Prescription Drugs Quite honestly, I am sick of health advice, regardless of the source. Unless you have some strange condition, most health advice can be boiled down to: Eat a lot of vegetables and don’t overeat Exercise regularly Get plenty of sleep Practice moderation Get a flu shot and have an annual physical Digging into “research” surrounding certain foods, habits, and practices and then using small trial studies to cast a shadow over the entire human race may make for good headlines and a hotter market for expensive pharmaceuticals or medical tests by specialists. But does such reporting also exacerbate hypochondria in the emotionally fragile? And might excessive worry over one’s health actually make one less healthy? Granted, I have been blessed with a pretty healthy body for all of my 70+ years. Good genes account for much of this. But might not worrying also have played a part? I have stopped looking at health related stories regardless of source. I’ve also stopped spending time on investment advice, emotional resilience advice, and fashion tips (but then anyone who know me knows I never looked at guidance on how to dress). Stop reading the click bait. Start living instead. Off for a hike. Doug Johnson | 1 Comment | Share Article Page 1 2 Next 3 Entries »'''
