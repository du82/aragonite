["https://doulos.com/knowhow/fpga/settings-genericsparameters-for-synthesis"]
title = "Settings Generics/Parameters for Synthesis"
full_description = '''VHDL has the powerful feature of generics, while Verilog has the option of defining parameters. Both these techniques allow parameterisable designs, that is designs that can be easily re-used in different situations. Here, the testbench wires up the entity declaration of a parameterised counter in VHDL: This works fine for simulation, but of course if you try to synthesize the counter on its own, the synthesis tool does not know the value of the generics. One way round this is simply to give the generics default values - the synthesis tool will then use those defaults. If you do that, it makes sense to re-write the generic declaration so that each generic can be given a different default value, i.e: To go further than this, and override the generics from a synthesis tool, you'll have use tool specific features. The rest of this page shows some examples. Note that because each tool has to analyze the code first to identify the generics, it is a good plan to put default values as shown above so that the code will definitely synthesize even without overriding the generic values. Now use the menu option Assignments > Settings... and click on Default Parameters. You can now set the generics - see the following screen shot: Lattice ispLever Classic uses Synopsys Synplify Pro® as its synthesis tool, so see the section below about Synopsys Synplify Pro®. In Lattice Diamond, set up your project, import your code, and synthesise it using either Lattice Synthesis Engine (LSE) or Synopsys Synplify Pro®. To add VHDL generics or Verilog compiler directives and parameters, carry out the following steps: Mentor Precision RTL can set generics, but it must be done from a Tcl command. The Tcl command has to set a "list of lists" as follows: Note the use of curly brackets to enclose each list. This command can be typed at the console of the Precision GUI, or put in a Tcl script. Microsemi Libero uses Synopsys Synplify Pro® as its synthesis tool, so see the section below about Synopsys Synplify Pro®'''
