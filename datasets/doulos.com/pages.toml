["https://doulos.com/training/arm-and-embedded-software/android"]
title = "Android Training"
full_description = "Doulos offers Embedded Android™ and Embedded Android for Automotive courses as part of its Embedded Android training portfolio. These courses focus on the Android platform and teach you how to take the source code from the Android Open Source Project (AOSP) and build a custom Android image for a wide range of applications. They are not to be confused with other types of courses that teach you how to write applications for Android. The highly experienced Doulos Embedded team has the knowledge and skills gained from across the international semiconductor industry to deliver the right training and support for you and your organization. Doulos training is unique in that it includes extensive hands-on labs covering all aspects of the design process. Doulos course attendees therefore benefit from a complete learning experience that enables them to test, troubleshoot and consolidate their knowledge before commencing their product development projects. Embedded Android teaches you how to take the source code from the Android Open Source Project (AOSP) and build a custom Android image for a wide range of applications. Typical use cases include test equipment, point of sale, and industrial control terminals. Usually, Android is embedded into the system so that the end user sees only the user interface that controls the device. Embedded Android for Automotive starts with teaching you about the detailed background of Android operating system and goes on to cover how the services and features that are part of Android Automotive OS (AAOS) provide the framework for an In-Vehicle Infotainment (IVI) system. AAOS is not to be confused with Android Auto. Android Auto mirrors your Android phone when connected to the vehicle whereas Android Automotive is integrated with the vehicle and lets you control different settings directly from the vehicle head unit without the need of a phone. Still unsure which training course you need? Please let us help you. Complete an enquiry form to receive expert assistance."
