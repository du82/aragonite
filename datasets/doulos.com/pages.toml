["https://doulos.com/news-pr-events/embedded-software-engineering-kongress-2024"]
title = "Doulos at Embedded Software Engineering Kongress"
full_description = "Doulos is delighted to be presenting for the first time at the Embedded Software Engineering Kongress in Sindelfingen, Germany on December 2 - 5. The ESE Kongress is Germany’s leading congress for the embedded software industry. Every December, about 1,200 professionals get together to catch up on current technologies and methods, to discuss trends and to set the course for the future. A practical introduction to Edge AIDate & time: December 2 at 9:30 - 12:50 Presenter: Loïc Domaigné, Doulos Senior Member Technical Staff What does it mean to use AI in embedded products or edge devices? Are you unsure whether you can successfully manage an AI project and define the requirements and risks? This seminar discusses the steps of an MLOps workflow, from collecting data to executing code on an embedded system. It will explore the risks in project implementation, how ML algorithms are tested and validated, and the pitfalls and benefits of adapting existing solutions. Finally it will provide a demonstration using a model for a practical real-world challenge. Mastering Rust for Embedded Firmware DevelopmentDate & time: December 2 at 9:30am - 12:50pm Presenter: David Cabanis, Doulos Principal Member Technical Staff This seminar is designed to introduce bare-metal Rust (without a standard library) to software engineers, emphasizing how Rust offers an appealing alternative to systems languages such as C or C++ for embedded software development. It will provide a comprehensive understanding of Rust's toolchains and development environment, tailored for specific hardware platforms. It will also cover efficient memory management techniques in a no_std environment, explore Rust’s interoperability with C and assembly, and provide practical advice for using the debugging tools that are essential for embedded systems. Glide through PythonDate & time: December 2 at 13:50 - 17:10 Presenter: Loïc Domaigné, Doulos Senior Member Technical Staff The Python programming language has gained enormous popularity in recent years, and is now often used for embedded product development, for example analyzing and processing signals and sensor data, scripting to control build systems and development workflows, testing and debugging embedded devices and in machine learning."
