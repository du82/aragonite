["https://doulos.com/knowhow/arm-embedded/efficient-byte-swapping-using-armv6-and-armv7-ar-instructions"]
title = "Efficient Byte Swapping using Armv6 and Armv7-A/R instructions"
full_description = "Since the introduction of the Arm11 processor family, the Arm instruction set supports on-the-fly switching of the current endian mode. Natively a little endian architecture, the processor can be put into a big endian mode to process chunks of data in that format. DSPs, network adapters and similar peripherals might return processed data in big endian format. The Armv6 architecture has several instructions to handle data in different byte order. For endian conversion (byte swapping) of single data words it might be a good idea to simply use the REV instruction. If you have larger blocks of data to convert, the method above might not be the quickest way do this. Instead we change the processor endianess between loading and storing data. Combined with the load/store multiple instructions using different addressing modes, this leads to the more efficient function below. Note that the block length must be divisible by 16 for this example to work! Every iteration of this loop processes four data words and memory access may take advantage of burst access on the system bus. It is perhaps worth noticing that the LDM instruction does not update the base register (r12). This way the subsequent STM accesses the same memory location, modifying data in place. Only after the STM has completed, the base register will be updated (incremented by 16) as indicated by the exclamation mark following the register name."
