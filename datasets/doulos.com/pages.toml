["https://doulos.com/knowhow/video-gallery"]
title = "KnowHow Video Gallery"
full_description = '''John Aynsley from Doulos describes some useful, practical features from the VHDL 2008 language standard that are supported by several simulation tool vendors. You can run the examples from this video directly on EDA Playground What is the difference between VHDL and SystemVerilog? John Aynsley from Doulos compares these two language standards. John Aynsley from Doulos answers the question "How Much VHDL Training Do You Need?" by explaining Doulos' VHDL training portfolio, how to choose the right course, and the pitfalls to avoid. Explains how Transaction Level Modeling techniques are used to communicate between components in OVM, the Open Verification Environment. Explains the mechanisms for observing activity in VMM and OVM test benches for the purposes of checking and coverage collection. Useful links: Getting Started with OVM Verification Methodology Manual for SystemVerilog The Guide to SystemVerilog Describes ten things you should know about OVM, the Open Verification Methodology for SystemVerilog. This video gives you a top-level technical overview of OVM without diving down into too much language detail. Describes OVM-SC, the implementation of the Open Verification Methodology within SystemC, which is part of the open-source OVM-ML (Mixed Language) library donated to the OVM community by Cadence. An introduction to version 1.2 of the VMM (Verification Methodology Manual) for SystemVerilog, highlighting the new features of VMM 1.2 and the overall conceptual framework. John Aynsley from Doulos gives a brief overview of UVM, the Universal Verification Methodology for functional verification using SystemVerilog. What is the difference between SystemC and SystemVerilog? This video includes a brief description of these two EDA language standards. Explains how SystemVerilog has become the natural successor to Verilog, and describes some of the features of SystemVerilog borrowed from the C programming language. John Aynsley from Doulos answers the question "How Much SystemVerilog Training Do You Need?" by explaining Doulos' SystemVerilog training portfolio, how to choose the right course, and the pitfalls to avoid.'''
