["https://doulos.com/knowhow/arm-embedded/cplusplus-casting"]
title = "Introduction to C++ Casting Issues"
full_description = "When calling subroutines or assigning results from returns, the situation arises in which types don't match, and strict C++ typing appears to get in the way. Several solutions to this problem include implicit conversions, explicit conversions, and casting. Some of these are more dangerous than others. This article clarifies and guides you to make good decisions. First, good C++ programmers avoid casting whenever possible. Casting often has terrible results, including runtime overhead and incorrect conversions, unless adequately understood. Second, these same programmers rightfully criticize any casting they see during code reviews unless it is justified adequately with comment blocks. Third, be afraid whenever you see or feel the need for casting. Usually, there are better alternatives. Conversions come in two varieties. Implicit conversions include things like int to float and visa versa. Unfortunately, implicit conversions can get you in trouble. For instance, char is considered to be an 8-bit integer. Consider the following legal, but highly likely bug: To avoid this problem, you can use explicit conversions using the target type as an operator function. For instance: When creating classes, you should create needed conversions. Single argument constructors act as conversions to a class, which must also be designated as explicit. You can use operator definitions to define conversions to other classes. With modern C++, you should also require single argument operators to be explicit by adding the explicit keyword. In the following, omit the keyword explicit for operators for C++ before C++11. Sometimes, a conversion does not exist, but you believe you know more than the compiler. In these situations, it may be appropriate to use a cast. For these situations, C++ supplies four types of casting with various levels of safety. C provides a cast of the form (TYPE)VALUE, but this is extremely dangerous! There are two reasons. First, it says, I know more than the compiler. Second, because the syntax is terse (few characters), it is easy to overlook. Consider the following disaster:"
year_published = 2025
