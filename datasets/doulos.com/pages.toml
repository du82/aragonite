["https://doulos.com/knowhow/perl"]
title = "Perl KnowHow"
full_description = "Perl's process, file, and text manipulation facilities make it particularly well-suited for tasks involving automatic code generation, report filtering, netlist patching, generating test vectors and controlling tools. In just just 20 minutes this tutorial shows you the core elements of the powerful Perl language. Start filtering netlists and generating reports straight away. Make time today to learn some Perl. Perl has been used for translating between related languages: VHDL to Verilog, Xilinx Netlist Files to VHDL, VHDL to SystemC, etc. Source files with low originality are prime candidates for automatic generation. VHDL engineers regularly write testbenches. We've written an online demonstration to show you how Perl can do it for you. EDA tools are notorious for creating verbose report files. Many megabytes of text may contain little interesting information. Perl is well matched to extracting key information quickly. EDA tools within design flows never fit together perfectly. Often, really useful features are unsupported. Netlists generated from one tool need modifying before the next tool will read them. Perl is well matched to intelligent search and replace jobs. Perl can apply rules for generating sophisticated test vector patterns: ATM packets, MPEG streams, QAM samples with added noise, etc. Perl is able to call any tool installed on its host computer. Perl can even run Telnet and FTP sessions to control remote computers. Any task involving more than one tool can be automated using a Perl script. A Perl script might run a tool, filter the textual output, then decide whether to: modify constraints and try again, move on to the next tool in the flow or abort and send email notification to a project leader. Many operating systems support Perl. Most importantly ports exist for Linux, Windows and versions of Unix. The standard Perl release is available in source code only. However, hardware engineers don't have time to compile their own and binary distributions are freely available."
year_published = 2025
