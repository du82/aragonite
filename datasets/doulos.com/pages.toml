["https://doulos.com/knowhow/arm-embedded"]
title = "Embedded Software / Arm KnowHow"
full_description = '''Jens Stapelfeldt from Doulos describes the main features of the Arm Cortex-M1 architecture, which is a microcontroller specialized for implementation on FPGA devices. Jens Stapelfeldt from Doulos describes CMSIS, the Arm Cortex Microcontroller Software Interface Standard, which provides an abstraction layer for programming all Cortex M microcontrollers. David Cabanis from Doulos explains how to use the flash patch breakpoint unit of the Arm Cortex-M3 and M4 processors. Dave Cabanis from Doulos explains how to exploit the NEON coprocessor unit found in the ARM Cortex A processor family from your C code. David Cabanis from Doulos explains the basics of creating a CMSIS compliant, Cortex-M3 based project and taking it through the MDK toolchain. David Cabanis from Doulos touches on the topics of semi-hosting and standard C library function retargeting. In addition, the Cortex-M3 Instrumentation Trace Macrocell (ITM) will be put to use as a mean to communicate with a debug host. David Cabanis from Doulos looks at programming the Keil Cortex-M3 evaluation board (MCBSTM32) using a CMSIS compliant approach whilst accessing specific device's peripherals. CMSIS supports developers and vendors in creating reusable software components for Arm® Cortex®-M based systems. This 17-page tutorial (pdf), created by Doulos Arm experts, provides a thorough introduction to the new standard and includes two tutorial examples. Dr David Long, Doulos Principal Member Technical Staff, presents the IoTST Security Tutorial which provides an overview of open-source and free tools that are suitable to use for security testing of IoT edge devices based on a Cortex-M processor. Dr David Long, Doulos Principal Member Technical Staff, looks at how to get started on a "small embedded" system built around a microcontroller and firmware running "Bare Metal" or with a Real Time Operating System (RTOS). Embedded C programming for Cortex-M ProcessorsIn this extended presentation, David Cabanis from Doulos explains the basics of embedded C programming in the context of Cortex-M processors and how to bring a bare metal system to life. Amongst the covered topics you will find: Cortex-Mx startup code and vector tables, linker scripts, CMSIS compliant C code and assembler programming.'''
