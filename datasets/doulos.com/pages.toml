["https://doulos.com/knowhow/systemc/systemc-faq"]
title = "SystemC FAQ"
full_description = "This must be the most often asked question on the SystemC Forums! The basic idea is to create a signal, but using a user defined data type. For instance, I might create a structure, and then use that structure within a signal. A careful reading of the release notes for SystemC reveals that you must create versions of operator =, operator <<, and operator == . Also, if you need to trace your signal, you need to provide an overloaded sc_trace function. The following piece of code shows a complex data type and the appropriate functions. This has all been defined in one place (the class MyType) for convenience, i.e. all the definitions are kept together. We've made a complete example you can download. The files are in UNIX format here, and in DOS format here. The easiest to understand is the first. It's useful for parameterizing modules which need e.g. a different amount of dynamic memory when the module is declared. Another common use is to switch on debugging information. By using default values, it's possible to design the module so that some of the parameters may be left out if not needed. Here is a simple parameterized RAM model. The key is the use of a normal constructor together with the SC_HAS_PROCESS macro, instead of using SC_CTOR. Just copy and paste the code above into your C++ compiler and try compiling it! You'll have to write a testbench to test the ram fully. In the testbench, e.g. in sc_main, you can instance the ram: In this question, we look at making a simple RAM model using a template class. This is potentially more flexible than using constructor parameters, as the template class may be parameterized by type, as well as by value. For instance, we could create a RAM model that could store a particular type of data, as well as specifying the size of the RAM. Here then is a simple parameterized RAM model where we can set both the data type stored in the RAM and the number of elements (the size). It is usual that functions that are part of a template class have to be defined in the header file where the template class is created. This is a limitation of current compilers."
