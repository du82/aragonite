full_description = "Frank Mölendörp, Doulos, 2011 Abstract This paper explains how to use the ARM/NXP mbed prototyping kit with FreeRTOS. We will describe how to combine the best features of both, device abstraction in mbed, and OS functionality in FreeRTOS and forge them into a powerful prototyping device. Can I run FreeRTOS on the mbed? Yes, you can! There is no way to choose the compiler flags when working in the cloud, never mind setting up a linker-script! But there is a very simple way to use FreeRTOS on the mbed. Download the full paper to discover how ...... You will download a paper that is copyright Doulos. You are welcome to use and copy all material for private individual use. For use of any material within a commercial presentation or within a separate document for wider distribution, we request that you give due acknowledgement to Doulos Ltd as the source of that material and the copyright owner. Any mention of specific organisations or their products does not imply an endorsement by Doulos of either the organisation or the product. All third party trademarks acknowledged. Click here to download the full paper in PDF format."
