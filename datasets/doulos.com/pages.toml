["https://doulos.com/knowhow/fpga/fpga-technotes"]
title = "FPGA Technotes"
full_description = '''Doulos Technotes contain in-depth information about a particular aspect of technology; in this case, FPGA technology. Our experts distil knowledge and experience and put it into an easy-to-read form, saving you time. If you are a more advanced user, our Expert VHDL training class offers expert training for FPGA users. This Doulos FPGA Technote gathers into one convenient document all the information you need about how to create memory blocks in FPGAs using VHDL or Verilog. By using VHDL or Verilog HDL to describe synthesizable memory blocks you can make your code easier to read, faster to simulate, and much more portable across tools and devices. Despite these benefits, memory inference is not a "silver bullet" and it's important to understand clearly how your RTL coding choices affect the FPGA hardware implementation. Our aim in creating this Technote has been to provide you with the information you need in a convenient, vendor-independent and accessible form. None of the information in this document is new. It is all available in the documentation supplied by FPGA and synthesis tool vendors, and of course you can easily try out various HDL coding styles for yourself. However, in this Technote you will find it collected together for easy reference regardless of which FPGA vendor, HDL or synthesis tool you choose. The code examples provide templates for your own development, and have been shown to work across a wide variety of synthesis tools and FPGA families. FPGA memory architecture and applications Background - Kinds of embedded memory blocks - Inference or instantiation? - Challenges for successful memory inference in synthesis - Impact of memory size on synthesis results - Upsizing and downsizing FIFOs Portable coding styles for memory synthesisSingle-port memory architectures - RAM with asynchronous read operation - Synchronous RAM, one read-write port Dual-port memory architectures - Synchronous RAM with two ports sharing a common clock - Synchronous RAM with two ports having independent clocksThe Designs The HDL code - Single port RAM with asynchronous read - Design CWAR: synchronous write, asynchronous read - Single port fully synchronous RAM - Design CWR: single port, write-first - Design CRW: single port, read-first - Design CWnR: single port, no change on write - Dual port synchronous RAM with common clock - Design CWR_CWR: write-first on both ports - Design CRW_CRW: read-first on both ports - Design CWnR_CWnR: no-change on both ports - Design CW_CR: one write-only port, one read-only port (FIFO) - Dual port synchronous RAM with independent clocks - Design C0WR_C1WR: write-first on both ports - Design C0RW_C1RW: read-first on both ports - Design C0WnR_C1WnR: no-change on both ports - Design C0W_C1R: one write-only port, one read-only port (FIFO)'''
