title = "Download MariaDB Server - MariaDB.org"
description = 'REST API Reporting Bugs … Continue reading "Download MariaDB Server"'
full_description = "Download MariaDB Server MariaDB Server is one of the world’s most popular open source relational databases and is available in the standard repositories of all major Linux distributions. Look for the package mariadb-server using the package manager of your operating system. Alternatively you can use the following resources: We encourage you to try it out and see whether it will work in your application. You can offer feedback in the form of bug reports, feature requests on JIRA and share use cases on Zulip or the mailing lists. Any will help improve future MariaDB Server versions! MariaDB Server MariaDB Server Repositories Connectors MariaDB Server Version Connector version Display older releases: Operating System Select... Architecture Select... Package Type Select... Init System Select... Feature Select... Download Mirror Thank you, your download will begin shortly. If it fails to start, click here to download directly. If the mirror is down or returns 'file not found', click here to try a different mirror or return to the downloads page and select a new mirror. You will be redirected to the MariaDB Knowledge Base once your download has started. Display signature and checksums Checksums: MariaDB Foundation provides packages for MariaDB versions newer than the version provided by the distribution only. Choose a distribution Choose a MariaDB Server version Select... Mirror Remember to give us a star on GitHub Star REST API To help with automating downloads of MariaDB Server and related files, MariaDB Foundation has exposed a REST API. REST API Documentation Reporting bugs The Reporting Bugs page on the Knowledge Base has details on how to report a bug. The developers are generally happy to help with verifying bugs. If you need help, ask on Zulip, or on the maria-developers mailing list. If the bug is repeatable, it is very helpful if you create a test case for the bug for use with mysql-test-run. See Debugging MariaDB with mysql-test-run for more information. For End of Life releases, MariaDB Foundation will not provide security updates, however outside contributors are welcome to submit security and bug fixes and backports to no-longer maintained versions."
