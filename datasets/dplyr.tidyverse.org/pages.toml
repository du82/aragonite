["https://dplyr.tidyverse.org/articles/dplyr.html"]
title = "Introduction to dplyr • dplyr"
description = "Start here if this is your first time using dplyr. You'll learn the basic    philosophy, the most important data manipulation verbs, and the pipe, `%>%`,  which allows you to combine multiple verbs together to solve real problems."
full_description = 'Introduction to dplyr Source: vignettes/dplyr.Rmd dplyr.Rmd When working with data you must: Figure out what you want to do. Describe those tasks in the form of a computer program. Execute the program. The dplyr package makes these steps fast and easy: By constraining your options, it helps you think about your data manipulation challenges. It provides simple “verbs”, functions that correspond to the most common data manipulation tasks, to help you translate your thoughts into code. It uses efficient backends, so you spend less time waiting for the computer. This document introduces you to dplyr’s basic set of tools, and shows you how to apply them to data frames. dplyr also supports databases via the dbplyr package, once you’ve installed, read vignette("dbplyr") to learn more. Data: starwars To explore the basic data manipulation verbs of dplyr, we’ll use the dataset starwars. This dataset contains 87 characters and comes from the Star Wars API, and is documented in ?starwars dim(starwars) #> [1] 87 14 starwars #> # A tibble: 87 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Luke Skyw… 172 77 blond fair blue 19 male #> 2 C-3PO 167 75 NA gold yellow 112 none #> 3 R2-D2 96 32 NA white, bl… red 33 none #> 4 Darth Vad… 202 136 none white yellow 41.9 male #> # ℹ 83 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Note that starwars is a tibble, a modern reimagining of the data frame. It’s particularly useful for large datasets because it only prints the first few rows. You can learn more about tibbles at https://tibble.tidyverse.org; in particular you can convert data frames to tibbles with as_tibble(). Single table verbs dplyr aims to provide a function for each basic verb of data manipulation. These verbs can be organised into three categories based on the component of the dataset that they work with: Rows: filter() chooses rows based on column values. slice() chooses rows based on location. arrange() changes the order of the rows. Columns: select() changes whether or not a column is included. rename() changes the name of columns. mutate() changes the values of columns and creates new columns. relocate() changes the order of the columns. Groups of rows: summarise() collapses a group into a single row. The pipe All of the dplyr functions take a data frame (or tibble) as the first argument. Rather than forcing the user to either save intermediate objects or nest functions, dplyr provides the %>% operator from magrittr. x %>% f(y) turns into f(x, y) so the result from one step is then “piped” into the next step. You can use the pipe to rewrite multiple operations that you can read left-to-right, top-to-bottom (reading the pipe operator as “then”). Filter rows with filter() filter() allows you to select a subset of rows in a data frame. Like all single verbs, the first argument is the tibble (or data frame). The second and subsequent arguments refer to variables within that data frame, selecting rows where the expression is TRUE. For example, we can select all character with light skin color and brown eyes with: starwars %>% filter(skin_color == "light", eye_color == "brown") #> # A tibble: 7 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Leia Orga… 150 49 brown light brown 19 fema… #> 2 Biggs Dar… 183 84 black light brown 24 male #> 3 Padmé Ami… 185 45 brown light brown 46 fema… #> 4 Cordé 157 NA brown light brown NA NA #> # ℹ 3 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> This is roughly equivalent to this base R code: starwars[starwars$skin_color == "light" & starwars$eye_color == "brown", ] Arrange rows with arrange() arrange() works similarly to filter() except that instead of filtering or selecting rows, it reorders them. It takes a data frame, and a set of column names (or more complicated expressions) to order by. If you provide more than one column name, each additional column will be used to break ties in the values of preceding columns: starwars %>% arrange(height, mass) #> # A tibble: 87 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Yoda 66 17 white green brown 896 male #> 2 Ratts Tye… 79 15 none grey, blue unknown NA male #> 3 Wicket Sy… 88 20 brown brown brown 8 male #> 4 Dud Bolt 94 45 none blue, grey yellow NA male #> # ℹ 83 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Use desc() to order a column in descending order: starwars %>% arrange(desc(height)) #> # A tibble: 87 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Yarael Po… 264 NA none white yellow NA male #> 2 Tarfful 234 136 brown brown blue NA male #> 3 Lama Su 229 88 none grey black NA male #> 4 Chewbacca 228 112 brown unknown blue 200 male #> # ℹ 83 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Choose rows using their position with slice() slice() lets you index rows by their (integer) locations. It allows you to select, remove, and duplicate rows. We can get characters from row numbers 5 through 10. starwars %>% slice(5:10) #> # A tibble: 6 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Leia Orga… 150 49 brown light brown 19 fema… #> 2 Owen Lars 178 120 brown, gr… light blue 52 male #> 3 Beru Whit… 165 75 brown light blue 47 fema… #> 4 R5-D4 97 32 NA white, red red NA none #> # ℹ 2 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> It is accompanied by a number of helpers for common use cases: slice_head() and slice_tail() select the first or last rows. starwars %>% slice_head(n = 3) #> # A tibble: 3 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Luke Skyw… 172 77 blond fair blue 19 male #> 2 C-3PO 167 75 NA gold yellow 112 none #> 3 R2-D2 96 32 NA white, bl… red 33 none #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> slice_sample() randomly selects rows. Use the option prop to choose a certain proportion of the cases. starwars %>% slice_sample(n = 5) #> # A tibble: 5 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Ayla Secu… 178 55 none blue hazel 48 fema… #> 2 Bossk 190 113 none green red 53 male #> 3 San Hill 191 NA none grey gold NA male #> 4 Luminara … 170 56.2 black yellow blue 58 fema… #> # ℹ 1 more row #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> starwars %>% slice_sample(prop = 0.1) #> # A tibble: 8 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Qui-Gon J… 193 89 brown fair blue 92 male #> 2 Jango Fett 183 79 black tan brown 66 male #> 3 Jocasta Nu 167 NA white fair blue NA fema… #> 4 Zam Wesell 168 55 blonde fair, gre… yellow NA fema… #> # ℹ 4 more rows #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Use replace = TRUE to perform a bootstrap sample. If needed, you can weight the sample with the weight argument. slice_min() and slice_max() select rows with highest or lowest values of a variable. Note that we first must choose only the values which are not NA. starwars %>% filter(!is.na(height)) %>% slice_max(height, n = 3) #> # A tibble: 3 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Yarael Po… 264 NA none white yellow NA male #> 2 Tarfful 234 136 brown brown blue NA male #> 3 Lama Su 229 88 none grey black NA male #> # ℹ 6 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Select columns with select() Often you work with large datasets with many columns but only a few are actually of interest to you. select() allows you to rapidly zoom in on a useful subset using operations that usually only work on numeric variable positions: # Select columns by name starwars %>% select(hair_color, skin_color, eye_color) #> # A tibble: 87 × 3 #> hair_color skin_color eye_color #> <chr> <chr> <chr> #> 1 blond fair blue #> 2 NA gold yellow #> 3 NA white, blue red #> 4 none white yellow #> # ℹ 83 more rows # Select all columns between hair_color and eye_color (inclusive) starwars %>% select(hair_color:eye_color) #> # A tibble: 87 × 3 #> hair_color skin_color eye_color #> <chr> <chr> <chr> #> 1 blond fair blue #> 2 NA gold yellow #> 3 NA white, blue red #> 4 none white yellow #> # ℹ 83 more rows # Select all columns except those from hair_color to eye_color (inclusive) starwars %>% select(!(hair_color:eye_color)) #> # A tibble: 87 × 11 #> name height mass birth_year sex gender homeworld species films #> <chr> <int> <dbl> <dbl> <chr> <chr> <chr> <chr> <lis> #> 1 Luke Skywa… 172 77 19 male mascu… Tatooine Human <chr> #> 2 C-3PO 167 75 112 none mascu… Tatooine Droid <chr> #> 3 R2-D2 96 32 33 none mascu… Naboo Droid <chr> #> 4 Darth Vader 202 136 41.9 male mascu… Tatooine Human <chr> #> # ℹ 83 more rows #> # ℹ 2 more variables: vehicles <list>, starships <list> # Select all columns ending with color starwars %>% select(ends_with("color")) #> # A tibble: 87 × 3 #> hair_color skin_color eye_color #> <chr> <chr> <chr> #> 1 blond fair blue #> 2 NA gold yellow #> 3 NA white, blue red #> 4 none white yellow #> # ℹ 83 more rows There are a number of helper functions you can use within select(), like starts_with(), ends_with(), matches() and contains(). These let you quickly match larger blocks of variables that meet some criterion. See ?select for more details. You can rename variables with select() by using named arguments: starwars %>% select(home_world = homeworld) #> # A tibble: 87 × 1 #> home_world #> <chr> #> 1 Tatooine #> 2 Tatooine #> 3 Naboo #> 4 Tatooine #> # ℹ 83 more rows But because select() drops all the variables not explicitly mentioned, it’s not that useful. Instead, use rename(): starwars %>% rename(home_world = homeworld) #> # A tibble: 87 × 14 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Luke Skyw… 172 77 blond fair blue 19 male #> 2 C-3PO 167 75 NA gold yellow 112 none #> 3 R2-D2 96 32 NA white, bl… red 33 none #> 4 Darth Vad… 202 136 none white yellow 41.9 male #> # ℹ 83 more rows #> # ℹ 6 more variables: gender <chr>, home_world <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Add new columns with mutate() Besides selecting sets of existing columns, it’s often useful to add new columns that are functions of existing columns. This is the job of mutate(): starwars %>% mutate(height_m = height / 100) #> # A tibble: 87 × 15 #> name height mass hair_color skin_color eye_color birth_year sex #> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> <chr> #> 1 Luke Skyw… 172 77 blond fair blue 19 male #> 2 C-3PO 167 75 NA gold yellow 112 none #> 3 R2-D2 96 32 NA white, bl… red 33 none #> 4 Darth Vad… 202 136 none white yellow 41.9 male #> # ℹ 83 more rows #> # ℹ 7 more variables: gender <chr>, homeworld <chr>, species <chr>, #> # films <list>, vehicles <list>, starships <list>, height_m <dbl> We can’t see the height in meters we just calculated, but we can fix that using a select command. starwars %>% mutate(height_m = height / 100) %>% select(height_m, height, everything()) #> # A tibble: 87 × 15 #> height_m height name mass hair_color skin_color eye_color birth_year #> <dbl> <int> <chr> <dbl> <chr> <chr> <chr> <dbl> #> 1 1.72 172 Luke S… 77 blond fair blue 19 #> 2 1.67 167 C-3PO 75 NA gold yellow 112 #> 3 0.96 96 R2-D2 32 NA white, bl… red 33 #> 4 2.02 202 Darth … 136 none white yellow 41.9 #> # ℹ 83 more rows #> # ℹ 7 more variables: sex <chr>, gender <chr>, homeworld <chr>, #> # species <chr>, films <list>, vehicles <list>, starships <list> dplyr::mutate() is similar to the base transform(), but allows you to refer to columns that you’ve just created: starwars %>% mutate( height_m = height / 100, BMI = mass / (height_m^2) ) %>% select(BMI, everything()) #> # A tibble: 87 × 16 #> BMI name height mass hair_color skin_color eye_color birth_year #> <dbl> <chr> <int> <dbl> <chr> <chr> <chr> <dbl> #> 1 26.0 Luke Skyw… 172 77 blond fair blue 19 #> 2 26.9 C-3PO 167 75 NA gold yellow 112 #> 3 34.7 R2-D2 96 32 NA white, bl… red 33 #> 4 33.3 Darth Vad… 202 136 none white yellow 41.9 #> # ℹ 83 more rows #> # ℹ 8 more variables: sex <chr>, gender <chr>, homeworld <chr>, #> # species <chr>, films <list>, vehicles <list>, starships <list>, #> # height_m <dbl> If you only want to keep the new variables, use .keep = "none": starwars %>% mutate( height_m = height / 100, BMI = mass / (height_m^2), .keep = "none" ) #> # A tibble: 87 × 2 #> height_m BMI #> <dbl> <dbl> #> 1 1.72 26.0 #> 2 1.67 26.9 #> 3 0.96 34.7 #> 4 2.02 33.3 #> # ℹ 83 more rows Change column order with relocate() Use a similar syntax as select() to move blocks of columns at once starwars %>% relocate(sex:homeworld, .before = height) #> # A tibble: 87 × 14 #> name sex gender homeworld height mass hair_color skin_color #> <chr> <chr> <chr> <chr> <int> <dbl> <chr> <chr> #> 1 Luke Skywalker male mascu… Tatooine 172 77 blond fair #> 2 C-3PO none mascu… Tatooine 167 75 NA gold #> 3 R2-D2 none mascu… Naboo 96 32 NA white, bl… #> 4 Darth Vader male mascu… Tatooine 202 136 none white #> # ℹ 83 more rows #> # ℹ 6 more variables: eye_color <chr>, birth_year <dbl>, species <chr>, #> # films <list>, vehicles <list>, starships <list> Summarise values with summarise() The last verb is summarise(). It collapses a data frame to a single row. starwars %>% summarise(height = mean(height, na.rm = TRUE)) #> # A tibble: 1 × 1 #> height #> <dbl> #> 1 175. It’s not that useful until we learn the group_by() verb below. Commonalities You may have noticed that the syntax and function of all these verbs are very similar: The first argument is a data frame. The subsequent arguments describe what to do with the data frame. You can refer to columns in the data frame directly without using $. The result is a new data frame Together these properties make it easy to chain together multiple simple steps to achieve a complex result. These five functions provide the basis of a language of data manipulation. At '
