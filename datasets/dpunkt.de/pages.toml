description = "Sie erhalten das Print-Buch und das E-Book im Paket. Für den geringen Aufpreis von 5 € auf den jeweiligen Print-Preis können Sie beide Formate flexibel nutzen."
full_description = 'Unsere dpunkt.bundles – Buch & E-Book im PaketGanz gleich, ob im Büro, im Home Office oder on-the-go, wir versorgen Sie mit hochwertigem Fachwissen im Bundle-Format!Für unsere Kund*innen, die jederzeit und von jedem Ort flexibel auf unsere Fachinhalte zugreifen möchten, bieten wir exklusiv in unserem Webshop Bundles an. Als dpunkt.bundle erhältlich sind alle Titel, die seit 2017 in der Print- und Digital-Version erschienen sind. Unsere aktuellen Neuerscheinungen können Sie selbstverständlich ebenso als Bundle erwerben.<img decoding="async" width="300" height="250" class="ugb-img wp-image-514100 ugb-img--shape" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Ueberall.png" alt="Überall lesen" title="" srcset="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Ueberall.png.webp 300w, https://dpunkt.de/wp-content/uploads/2024/07/Icon_Ueberall-200x167.png.webp 200w" sizes="(max-width: 300px) 100vw, 300px" />Überall lesenGanz egal wo, mit unseren Bundles sind Sie flexibel und haben Ihr Fachwissen immer nachschlagebereit dabei.Mehr erfahren<img decoding="async" width="300" height="250" class="ugb-img wp-image-514101 ugb-img--shape" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Webshop.png" alt="Bundle-Preis" title="" srcset="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Webshop.png.webp 300w, https://dpunkt.de/wp-content/uploads/2024/07/Icon_Webshop-200x167.png.webp 200w" sizes="(max-width: 300px) 100vw, 300px" />Bundle-PreisUnsere dpunkt.bundles sind nicht nur praktisch, sondern bieten Ihnen auch einen attraktiven Preisvorteil.Mehr erfahren<img decoding="async" width="300" height="250" class="ugb-img wp-image-514102 ugb-img--shape" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Sofort.png" alt="Sofort verfügbar" title="" srcset="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Sofort.png.webp 300w, https://dpunkt.de/wp-content/uploads/2024/07/Icon_Sofort-200x167.png.webp 200w" sizes="(max-width: 300px) 100vw, 300px" />Sofort verfügbarWarten war gestern – das E-Book im Bundle erhalten Sie sofort nach Ihrer Bestellung, auch ohne Kundenkonto.Mehr erfahrenWas sind dpunkt.bundles?Bei den dpunkt.bundles erhalten Sie das Print-Buch und das E-Book im Paket. Für den geringen Aufpreis von 5 € auf den jeweiligen Print-Preis können Sie beide Formate flexibel nutzen. Während wir Ihnen das gedruckte Buch zusenden, können Sie gleich nach der erfolgreichen Bestellung auf das E-Book zugreifen.Welche Titel sind als dpunkt.bundles verfügbar?Grundsätzlich bieten wir für alle Titel, die seit 2017 erschienen sind, Bundles an. Grundvoraussetzung dafür ist, dass der Titel sowohl als Print-Buch sowie E-Book erschienen ist. Ob ein Titel als dpunkt.bundle verfügbar ist, können Sie daran erkennen, ob Sie auf der Produktseite die Option »Bundle« auswählen können. Zusätzlich finden Sie dort auch die entsprechende Bundle-ISBN.Welche E-Book-Formate erhalte ich beim Kauf eines dpunkt.bundles?Beim Kauf eines Bundles erhalten Sie Links zu allen verfügbaren E-Book-Formaten. In der Regel erscheinen unsere E-Books in den folgenden Formaten: PDF, ePub und MOBI. Von den verfügbaren Formaten können Sie das von Ihnen gewünschte Format auswählen und herunterladen. Weitere Informationen zu unseren E-Books finden Sie in unseren FAQs.Wo kann ich die dpunkt.bundles kaufen?Unsere Bundles erhalten Sie nur im dpunkt.shop unter www.dpunkt.de. Es handelt sich um ein exklusives Angebot direkt für unsere Kund*innen.Hier geht es zu unseren Büchern<img decoding="async" alt="Computing" class="wc-block-featured-category__background-image" src="https://dpunkt.de/wp-content/uploads/2024/04/Computing.jpg" style="object-fit: none;object-position: 50% 50%;" />ComputingJetzt einkaufen<img decoding="async" alt="Fotografie" class="wc-block-featured-category__background-image" src="https://dpunkt.de/wp-content/uploads/2024/04/Fotografie.jpg" style="object-fit: none;object-position: 50% 50%;" />FotografieJetzt einkaufen<img decoding="async" alt="Business &amp; IT" class="wc-block-featured-category__background-image" src="https://dpunkt.de/wp-content/uploads/2024/04/Zeichnen.jpg" style="object-fit: none;object-position: 50% 50%;" />Business & ITJetzt einkaufen<img decoding="async" alt="Technik &amp; Kreatives" class="wc-block-featured-category__background-image" src="https://dpunkt.de/wp-content/uploads/2024/04/Maker.jpg" style="object-fit: none;object-position: 50% 50%;" />Technik & KreativesJetzt einkaufenÜberall lesendpunkt.bücher immer mit dabei! Mit unseren Bundles sind Sie flexibel. Während das gedruckte Buch zu Hause oder im Büro immer nachschlagebereit zur Hand liegt, haben Sie unser Fachwissen mit der digitalen Variante auch unterwegs mit dabei. Dabei können Sie sich aussuchen, ob Sie das E-Book am Laptop, mit dem E-Reader oder auf dem Kindle lesen möchten. Unsere E-Books können Sie zudem beliebig oft herunterladen. Mit unserem Verzicht auf einen DRM-Schutz können Sie die digitale Variante noch unkomplizierter auf (fast) allen Readern lesen.<img decoding="async" class="ugb-feature__image ugb-img wp-image-208341" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Ueberall.png" alt="" height="250" />Bundle-PreisWarum Print-Buch und E-Book einzeln kaufen, wenn Sie für nur 5 € mehr auch ein dpunkt.bundle ergattern können? Mit unseren Bundles erhalten Sie neben der Print-Variante auch das vollwertige E-Book. Sie müssen also keine Abstriche bei der Nutzung unserer Titel machen.<img decoding="async" class="ugb-feature__image ugb-img wp-image-208342" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Webshop.png" alt="" height="250" />Sofort verfügbarBei unseren Bundles erhalten Sie das E-Book sofort nach Ihrer erfolgreichen Bestellung. Während sich das Print-Buch also noch auf dem Weg zu Ihnen befindet, können Sie bereits mit der Lektüre des Titels in der digitalen Variante beginnen. Um unsere E-Books zu nutzen, benötigen Sie übrigens kein Kundenkonto bei uns. Ohne Kundenkonto werden Ihnen die Links einfach per Mail zugesendet. Besitzen Sie ein Kundenkonto finden Sie das Bundle-E-Book – zusammen mit allen anderen bereits lizenzierten E-Books – bei dem Abschnitt »Downloads«.<img decoding="async" class="ugb-feature__image ugb-img wp-image-208343" src="https://dpunkt.de/wp-content/uploads/2024/07/Icon_Sofort.png" alt="" height="250" />'
