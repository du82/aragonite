["https://dpunkt.de/jubilaeum"]
title = "Jubiläum • dpunkt.verlag"
description = "Unser Jubiläumsjahr steht unter dem Motto: „30 Jahre Fachwissen – für gestern, heute und morgen.“ Bleiben Sie informiert über alle Aktionen."
full_description = 'dpunkt.verlag JubiläumJubiläum30 Jahre dpunkt.verlag – ein Grund zum Feiern!Seit drei Jahrzehnten steht der dpunkt.verlag für Expertise, Leidenschaft und Innovation. 1995 gegründet, hat sich der Verlag zu einer unverzichtbaren Adresse für Fachbücher und Ressourcen rund um IT, Softwareentwicklung, Fotografie und viele weitere Themenbereiche entwickelt. Mit einem Fokus auf aktuellen Technologien und den Bedürfnissen seiner Leser hat der dpunkt.verlag immer wieder bewiesen, dass er am Puls der Zeit ist – und manchmal sogar einen Schritt voraus.Dieses Jubiläum ist mehr als nur ein Rückblick auf 30 Jahre Erfolgsgeschichte; es ist eine Hommage an die Menschen, die hinter dem Verlag stehen, die Autor*innen, deren Expertise beeindruckt, und die Leser*innen, die ihre Neugier und Wissbegierde mit uns teilen. Lassen Sie uns gemeinsam auf drei Jahrzehnte Qualität, Innovation und Wissensvermittlung anstoßen – und auf eine spannende Zukunft!Unser Jubiläumsjahr steht unter dem Motto: »30 Jahre Fachwissen – für gestern, heute und morgen«. Dieses Motto begleitet uns durch zahlreiche Aktionen und Veranstaltungen.Wir möchten diese Gelegenheit nutzen, um allen zu danken, die uns auf diesem Weg begleitet haben: unseren kompetenten Autor*innen, unseren treuen Leser*innen und all jenen, die uns mit ihrem Fachwissen und ihrer Begeisterung unterstützt haben. Lassen Sie uns gemeinsam dieses Jubiläumsjahr feiern – ein Jahr, in dem wir stolz auf das Erreichte sind und voller Tatendrang auf die kommenden Jahrzehnte blicken. Danke für 30 Jahre Vertrauen, Inspiration und Zusammenarbeit.Entdecken Sie beim Stöbern auf dieser Seite unseren ersten dpunkt-Katalog, herzliche Glückwünsche von Partner*innen und Autor*innen sowie eine Auswahl der ersten Fachbücher, die wir veröffentlicht haben. Und: Bis zum 16.03. erhalten Sie 30 % Rabatt auf ausgewählte E-Books.Unser erster dpunkt KatalogUnsere E-Book-Aktion<img decoding="async" class="stk-img wp-image-539158" src="https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2.jpg" width="2500" height="1250" srcset="https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2.jpg.webp 2500w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-300x150.jpg.webp 300w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-1024x512.jpg.webp 1024w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-768x384.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-1536x768.jpg.webp 1536w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-2048x1024.jpg.webp 2048w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-400x200.jpg.webp 400w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-200x100.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2025/02/NL_Semesterstart_Sie2-600x300.jpg.webp 600w" sizes="(max-width: 2500px) 100vw, 2500px" />Ihre Glückwünsche an unsWir sind tief berührt von der Wertschätzung und freuen uns riesig über die langjährige, vertrauensvolle und erfolgreiche Zusammenarbeit. Es ist ein tolles Gefühl, mit so großartigen Autor*innen und Partnern an unserer Seite gemeinsam zu wachsen.Unsere ersten Fachbücher<img decoding="async" class="stk-img wp-image-535087" src="https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-scaled.jpg" width="1707" height="2560" alt="Internet-Handbuch für Windows Cover" srcset="https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-scaled.jpg.webp 1707w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-200x300.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-683x1024.jpg.webp 683w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-768x1152.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-1024x1536.jpg.webp 1024w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-1365x2048.jpg.webp 1365w, https://dpunkt.de/wp-content/uploads/2025/01/DSC08647-180x270.jpg.webp 180w, https://dpunkt.d