["https://dpunkt.de/event/scrum-day-2025"]
title = "Scrum Day 2025 • dpunkt.verlag"
description = """
Das Motto für dieses Jahr: “2025 – Wie lösen wir das jetzt?”
Seit 2007 ist der Scrum Day die größte Konferenz über Scrum im deutschsprachigen Raum. Die nächste Ausgabe hält ein paar Änderungen bereit: Statt Vorträgen nehmen wir uns mehr Zeit, um Themen mehr in der Tiefe zu behandeln. In fünfzehn 90-minütigen Workshops setzen wir uns damit auseinander, wie aktuelle Herausforderungen mit Scrum gelöst werden können:
Wie können wir Führungskräften helfen, ihre Teams und Organisationen auf die unmittelbaren Herausforderungen der nächsten Jahre vorzubereiten?
Wie können wir bessere Produkte schneller entwickeln?
Wie müssen sich Organisationen neu aufstellen, um erfolgreich zu sein?
Was können wir tun, damit Teams einfacher liefern können?"""
