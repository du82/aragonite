title = "// heise devSec () Herbst • dpunkt.verlag"
description = """
Sichere Software beginnt vor der ersten Zeile Code…
Die Angriffsvektoren auf Softwareprojekte werden immer ausgefeilter und zielen auf die gesamte Software Supply Chain. Die heise devSec hilft Ihnen, frühzeitig Schwachstellen zu erkennen und zu vermeiden.
Die heise devSec ist seit 2017 das bedeutendste deutschsprachige Fortbildungs- und Networking-Event für Softwareentwickler und Softwarearchitektinnen, die Verantwortung tragen für die Sicherheit der entwickelten Software.
Die heise devSec  findet am 30. September und 1. Oktober in Regensburg statt. Sie bietet aktuelles und umsetzbares Security-Wissen für Softwareentwickler:innen und Softwarearchitekt:innen sowie für Test- und Qualitätsverantwortliche."""
