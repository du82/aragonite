description = """
Die Konferenz für IIoT und Digitalisierung
Beyond IoT ist der Treffpunkt für alle, die Anwendungen im Industrial Internet of Things entwickeln. Sie gibt Einblicke in die neusten Entwicklungen und Best Practices: vom Prototyping über das Deployment on the Edge und der Verbindung zur Cloud bis zum Over-the-Air-Update und -Management der Geräte.
Die Konferenz zeigt, wie das IIoT industrielle Anlagen mit intelligenter Datenverarbeitung verbindet.
Zwei Tage mit zahlreichen praxisorientierten Vorträgen zeigen, wie IIoT-Anwendungen große Datenmengen in Echtzeit verarbeiten und wie Machine Learning und KI bei der Analyse helfen.
Und auch die Datenverarbeitung direkt an der Edge ist Thema auf der Beyond IoT."""
