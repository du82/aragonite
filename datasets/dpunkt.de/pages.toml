kturen, Erfahrungen aus laufenden und abgeschlossenen Softwareentwicklungsprojekten, Security by Design, Security Engineering, Sichere Freie und Open Source Software und deren Entwicklung Website: https://www.heise-devsec.de/index.php Veranstalter iX dpunkt.verlag heise Security « Beyond IoT S2N » Fügen Sie einen Kommentar hinzu Antworten abbrechenSie müssen angemeldet sein, um einen Kommentar abzugeben.'
