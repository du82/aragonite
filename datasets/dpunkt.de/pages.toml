["https://dpunkt.de/event/it-grc-kongress-2025"]
title = "IT GRC Kongress 2025 • dpunkt.verlag"
description = """
Security • Audit • Governance
Riskmanagement • Compliance
Der IT-GRC-Kongress 2025 wird am 26. und 27. Mai in Köln stattfinden. Im Mittelpunkt stehen auch diesmal wieder aktuelle Entwicklungen in den Bereichen Informationssicherheit, IT-Revision, IT-Governance und Compliance sowie Riskmanagement.
Es erwarten Sie u.a. Beiträge aus den ISACA-Fachgruppen zu relevanten und zukunftsbildenden Fachthemen. Daneben bietet das Kongressprogramm Keynotes & Fachbeiträge von ausgewählten Vertretern aus Industrie und Wirtschaft, Banken, Beratungs-/IT-Systemhäusern und (Regulierungs-)Institutionen.
Zeitgleich wird die jährliche Mitgliederversammlung des ISACA Germany Chapters stattfinden."""
