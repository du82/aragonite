["https://dpunkt.de/event/product-owner-days-2"]
title = "Product Owner Days • dpunkt.verlag"
description = """
Produkte sollen Endkundinnen und -kunden begeistern. Product Owner und Produktmanagerinnen stellen sicher, dass die richtigen Produkteigenschaften ausgewählt werden, sodass begeisternde Produkte entstehen. In der agilen Welt stellen sie über kontinuierliches Inspizieren und Adaptieren sicher, dass ihre Produkte tatsächlich die Kundenbedürfnisse befriedigen.








Bei den Product Owner Days im Komed am MediaPark Köln wird es um folgende Themenbereiche gehen:

User Research
Product Discovery, Product Economics
Business Modelling
Planung und Controlling größerer Entwicklungsvorhaben
Product Roadmaps
Produktvisionen, Produktstrategie

Die Konferenz richtet sich an Product Owner und Produktmanagerinnen, die die agilen Grundlagen kennen (z. B. aus CSPO/PSPO I) und bereits Erfahrung in der Rolle mitbringen.






