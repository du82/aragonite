full_description = 'Business & IT Technologie und Geschäftswelt verknüpfen sich fortlaufend: Wir treffen unsere Kolleg*innen online, setzen in nahezu allen Geschäftsbereichen und Aufgabengebieten auf digitale Tools und wissen um den erfolgskritischen Faktor einer leistungsfähigen und sicheren IT-Infrastruktur. Unser Programmbereich »Business & IT« widmet sich mit Themen wie Business Intelligence, IT-Governance, Online-Marketing und agilem Arbeiten genau dieser Schnittstelle. Ganz gleich, ob Sie ein Unternehmen führen, für einzelne Aufgaben wie IT-Administration oder Marketing verantwortlich sind oder sich über innovative Geschäftsstrategien interessieren – unsere praxisnahen Leitfäden geben Ihnen konkretes Handwerkszeug und eröffnen neue Perspektiven. Unsere Highlights On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale Entdecken Sie unser BuchprogrammErfolgreiche Teams und ProjekteAgile MethodenEntdecken Sie die Schlüssel zum erfolgreichen agilen Arbeiten und effektiven Projektmanagement: Unsere Autor*innen vermitteln Ihnen innovative und erprobte Methoden, um Teams zu inspirieren, Prozesse zu optimieren und Ziele zu erreichen. Die Bücher behandeln dabei nicht nur Grundlagen und Methoden, sondern führen auch durch Tools, Frameworks und zahlreiche Beispiele aus der Praxis. Außerdem zeigen sie Ihnen, wie Sie Agilität erfolgreich in Ihrem Team oder Unternehmen umsetzen. zu den Büchern Praxiswissen von SEO bis Social Media Online MarketingSie wollen Ihre Marke stärken, die Reichweite maximieren oder Absätze steigern? In unseren Fachbüchern erfahren Sie, wie Sie mithilfe gezielter Strategien, kreativer Inhalte und effizienter Marketingmaßnahmen Ihr Online-Potenzial voll ausschöpfen – und dabei auch Ihre Kunden begeistern! Unsere Autor*innen führen Sie in SEO und SEA ein, vermitteln die Erfolgsfaktoren von Newslettern und Online-Ads oder lotsen Sie durch die perfekte Social-Media-Strategie für Ihre Marke.zu den BüchernArchitekturen und IT-GovernanceIT im UnternehmenWie lässt sich die technologische Infrastruktur eines Unternehmens optimal gestalten – so, dass sie Wachstum fördert und Risiken mindert? Unsere Fachbücher vermitteln Ihnen die Eckpfeiler erfolgreicher Unternehmens-IT: von effizienten Architekturen bis zum durchdachten Risikomanagement, vom zeitgemäßen Dokumenten-Management bis zur erfolgreich umgesetzten Compliance. zu den Büchern Zeitschrift des ISACA Germany Chapter e.V. IT-GovernanceDie Fachzeitschrift IT-Governance, herausgegeben vom ISACA und publiziert durch unseren Verlag, behandelt regelmäßig aktuelle Fragen der IT in einem Unternehmen – beispielsweise der IT-Sicherheit, der Compliance oder des Risikomanagements und Auditing. Ihr Fokus liegt dabei auf einer nachhaltigen und nachweislich nützlichen Steuerung und Einbettung der IT in die Unternehmensziele und -prozesse. Zur ZeitschriftUnsere aktuellen Bestseller<img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/12508.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/12508.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="450" height="675"><img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/13997.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/13997.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="450" height="675"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2020/07/13505-scaled.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2020/07/13505-scaled.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="Sieroux: Agile Leadership" width="1760" height="2560"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2021/06/13565.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-cont