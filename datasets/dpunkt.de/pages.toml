["https://dpunkt.de/agile"]
title = "Agil arbeiten und führen mit dpunkt • dpunkt.verlag"
description = "Fachbücher für alle, die agil arbeiten oder führen wollen · Know-how für Scrum Master, Product Owner und Agile Coaches."
full_description = 'Agilität ist der Schlüssel zu flexiblen, effizienten Arbeitsweisen und einer erfolgreichen Führung im digitalen Zeitalter. Wir bieten Ihnen die nötigen Impulse, um in dynamischen Arbeitsumfeldern schneller, smarter und zielgerichteter zu agieren. Entdecken Sie praxisnahe Konzepte, innovative Methoden und wertvolle Tools, die Ihnen helfen, Ihre Teams und Projekte agil zu gestalten und nachhaltig erfolgreich zu führen.Unsere Neuerscheinungen im FebruarInnovative agile Teamkonzepte Fluide Teamstrukturen – Abhängigkeiten neu gedacht Ein frischer Blick auf agile Entwicklung geht weit über gängige Skalierungsframeworks hinaus und zeigt, wie Teams dynamisch und effizient organisiert werden können, ohne sich in starren Strukturen zu verlieren. Mit Konzepten wie Floating Teams und dem Agile Descaling Cycle werden echte Lösungen für eine agile Transformation geliefert. Wer nicht nur agil arbeiten, sondern auch agil denken möchte, findet hier die entscheidenden Impulse, um Teams und Prozesse nachhaltig zu optimieren. zum Buch <img decoding="async" width="206" height="300" src="https://dpunkt.de/wp-content/uploads/2024/11/14184-206x300.jpg" alt="" class="wp-image-529833" srcset="https://dpunkt.de/wp-content/uploads/2024/11/14184-206x300.jpg 206w, https://dpunkt.de/wp-content/uploads/2024/11/14184-704x1024.jpg 704w, https://dpunkt.de/wp-content/uploads/2024/11/14184-768x1117.jpg 768w, https://dpunkt.de/wp-content/uploads/2024/11/14184-1056x1536.jpg 1056w, https://dpunkt.de/wp-content/uploads/2024/11/14184-1408x2048.jpg 1408w, https://dpunkt.de/wp-content/uploads/2024/11/14184-186x270.jpg 186w, https://dpunkt.de/wp-content/uploads/2024/11/14184-200x291.jpg 200w, https://dpunkt.de/wp-content/uploads/2024/11/14184-600x873.jpg 600w, https://dpunkt.de/wp-content/uploads/2024/11/14184-scaled.jpg 1760w" sizes="(max-width: 206px) 100vw, 206px" />Agile Teams lösungsfokussiert coachen Lösungsfokussiertes Vorgehen im Coaching und in der Führung Lösungsfokussierte Coaching-Methoden sind weit über den IT-Bereich hinaus anwendbar und bieten sofort umsetzbare Werkzeuge für spürbare Verbesserungen in der Arbeit mit Teams und Einzelpersonen. Mit praxisorientierten Tipps aus der Positiven Psychologie und der Gehirnforschung stellt dieses Werk bewährte Methoden für Teamentwicklung, Konfliktmoderation und effektive Meetings vor. Die 5. Auflage vertieft zudem die Arbeit mit verteilten Teams, erweitert die Konfliktlösungspyramide und bietet wertvolle Online-Tipps für virtuelle Settings. zum Buch <img decoding="async" width="206" height="300" src="https://dpunkt.de/wp-content/uploads/2024/11/14086-206x300.jpg" alt="" class="wp-image-526881" srcset="https://dpunkt.de/wp-content/uploads/2024/11/14086-206x300.jpg 206w, https://dpunkt.de/wp-content/uploads/2024/11/14086-704x1024.jpg 704w, https://dpunkt.de/wp-content/uploads/2024/11/14086-768x1117.jpg 768w, https://dpunkt.de/wp-content/uploads/2024/11/14086-1056x1536.jpg 1056w, https://dpunkt.de/wp-content/uploads/2024/11/14086-1408x2048.jpg 1408w, https://dpunkt.de/wp-content/uploads/2024/11/14086-186x270.jpg 186w, https://dpunkt.de/wp-content/uploads/2024/11/14086-200x291.jpg 200w, https://dpunkt.de/wp-content/uploads/2024/11/14086-600x873.jpg 600w, https://dpunkt.de/wp-content/uploads/2024/11/14086-scaled.jpg 1760w" sizes="(max-width: 206px) 100vw, 206px" />Flight Levels Know-how, um in der Organisation mit Flight Levels abheben und messbare Verbesserungen landen zu können Praxisnahes Know-how für unternehmerische Verbesserungen mit Flight Levels macht dieses Werk zu einer wertvollen Ressource. Im Gegensatz zu starren agilen Skalierungsansätzen setzt es auf ein flexibles Denk- und Gestaltungsmodell, das maßgeschneiderte Lösungen ermöglicht. Mit einem fundierten Überblick über Bausteine, Initiativen und Strategien von Flight Levels liefert es wertvolle Impulse für alle, die echte, messbare Veränderungen in ihrer Organisation anstreben. Die 2. Auflage erweitert das Buch um eine detaillierte Fallstudie, die praxisnahe Einblicke und ein aktuelles Update zur Anwendung der Flight Levels bietet. zum Buch <img decoding="async" width="206" height="300" src="https://dpunkt.de/wp-content/uploads/2024/11/14090-206x300.jpg" alt="" class="wp-image-529821" srcset="https://dpunkt.de/wp-content/uploads/2024/11/14090-206x300.jpg 206w, https://dpunkt.de/wp-content/uploads/2024/11/14090-704x1024.jpg 704w, https://dpunkt.de/wp-content/uploads/2024/11/14090-768x1117.jpg 768w, https://dpunkt.de/wp-content/uploads/2024/11/14090-1056x1536.jpg 1056w, https://dpunkt.de/wp-content/uploads/2024/11/14090-1408x2048.jpg 1408w, https://dpunkt.de/wp-content/uploads/2024/11/14090-186x270.jpg 186w, https://dpunkt.de/wp-content/uploads/2024/11/14090-200x291.jpg 200w, https://dpunkt.de/wp-content/uploads/2024/11/14090-600x873.jpg 600w, https://dpunkt.de/wp-content/uploads/2024/11/14090-scaled.jpg 1760w" sizes="(max-width: 206px) 100vw, 206px" />Aktuelle Konferenzen Kennen Sie unsere On- und Offline-Konferenzen? In den kommenden Wochen bieten wir Ihnen unter anderem drei Online-Konferenzen zu OKR und agiler Softwareentwicklung. Und auf den Product Owner Days in Köln warten nicht nur zwei vollgepackte Konferenztage, sondern am 1. April 2025 auch tiefergehende Workshops auf Sie.<img decoding="async" width="400" height="400" src="https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025.png" alt="" class="wp-image-536770" srcset="https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025.png.webp 400w, https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025-300x300.png.webp 300w, https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025-150x150.png.webp 150w, https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025-270x270.png.webp 270w, https://dpunkt.de/wp-content/uploads/2025/02/OKR_Day_2025-200x200.png.webp 200w" sizes="(max-width: 400px) 100vw, 400px" /> <img decoding="async" width="400" height="400" src="https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025.png" alt="" class="wp-image-536771" srcset="https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025.png.webp 400w, https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025-300x300.png.webp 300w, https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025-150x150.png.webp 150w, https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025-270x270.png.webp 270w, https://dpunkt.de/wp-content/uploads/2025/02/IA_ASU_2025-200x200.png.webp 200w" sizes="(max-width: 400px) 100vw, 400px" /> <img decoding="async" width="400" height="400" src="https://dpunkt.de/wp-content/uploads/2025/02/POD_2025.png" alt="" class="wp-image-536772" srcset="https://dpunkt.de/wp-content/uploads/2025/02/POD_2025.png.webp 400w, https://dpunkt.de/wp-content/uploads/2025/02/POD_2025-300x300.png.webp 300w, https://dpunkt.de/wp-content/uploads/2025/02/POD_2025-150x150.png.webp 150w, https://dpunkt.de/wp-content/uploads/2025/02/POD_2025-270x270.png.webp 270w, https://dpunkt.de/wp-content/uploads/2025/02/POD_2025-200x200.png.webp 200w" sizes="(max-width: 400px) 100vw, 400px" />Von Scrum bis Kanban – Agile Methoden von A bis ZScrum, Kanban oder doch Nexus? Sie stehen am Anfang oder sind schon Experte, wenn es um agile Arbeitsweisen und Tools geht? Unser Buchprogramm zu den agilen Methoden umfasst sowohl Grundlagenbücher für den Einstieg ins agile Arbeiten, als auch Bücher zu speziellen und fortgeschrittenen Themen aus dem agilen Umfeld. On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale weitere Bücher ansehenBuchempfehlungen für Agile LeaderSie wollen agil führen oder stecken mitten im Transformationsprozess Ihrer Organisation? Vom Coaching einzelner agiler Teams über das Führen im agilen Umfeld bis hin zu unternehmensweiten Veränderungen bieten unsere Autorinnen und Autoren kompetente Unterstützung. Lernen Sie die theoretische Grundlagen kennen und profitieren Sie von der Erfahrung unserer Autor*innen. Die vielen praktischen Tipps aus ihrer Berufspraxis zeigen, wie Teams und Organisationen agil gestaltet und geführt werden können. On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale weitere Bücher ansehenAgile Leadership – Ein Überblick Eine agile Organisation entsteht nicht alleine durch eine Ansammlung agiler Teams. Genauso wenig entstehen erfolgreiche agile Teams nur durch das Befolgen der Scrum-Regeln. Unternehmen wollen sich strukturell und kulturell weiterentwickeln, um ihre Kunden und Mitarbeiter begeistern zu können. Diese Broschüre gibt einen Überblick, wie dieser Wandel mittels Agile Leadership gestaltet werden kann.In kompakter Form erhalten Sie einen Einblick in die Konzepte von Agile Leadership wie iterative Organisationsentwicklung, Vision/Nordstern, dezentrale Entscheidungen, Control Cycle und Power Cycle, The Responsibility Process™, Leadership Circle Profile®, agile Organisationsstrukturen, Agile Fluency Model™ und Beta-Kodex. Aus diesem Werkzeugkasten an Methoden, können Sie sich bedienen, um den individuellen Wandel Ihrer Organisation zu begleiten. Broschüre kostenfrei herunterladen (PDF) Das Buch »Agile Leadership: Führungsmodelle, Führungsstile und das richtige Handwerkszeug für die agile Arbeitswelt« ist in Kürze in 2. überarbeiteter und erweiterter Auflage verfügbar. Voraussichtliches Erscheinungsdatum: 25.04.2025 <img decoding="async" width="600" height="831" src="https://dpunkt.de/wp-content/uploads/2021/07/Agile_Leadership_U1.jpg" alt="" class="wp-image-231620" srcset="https://dpunkt.de/wp-content/uploads/2021/07/Agile_Leadership_U1.jpg 600w, https://dpunkt.de/wp-content/uploads/2021/07/Agile_Leadership_U1-217x300.jpg 217w, https://dpunkt.de/wp-content/uploads/2021/07/Agile_Leadership_U1-195x270.jpg 195w, https://dpunkt.de/wp-content/uploads/2021/07/Agile_Leadership_U1-200x277.jpg 200w" sizes="(max-width: 600px) 100vw, 600px" />Wissen in Romanform – unterhaltsam lernenMit unseren Fachbüchern in Romanform lernen Sie ganz nebenbei die Grundlagen agilen Arbeitens und Führens. Spannende und unterhaltsame Storys oder Erfahrungsberichte legen den Fokus ganz klar auf die praktische Anwendung agiler Methoden. On Sale NewsletterVerpassen Sie keine Neuigkeiten. Abonnieren Sie unseren Newsletter und profitieren Sie von regelmäßigem Know-how, inspirierenden Ideen und den neuesten Entwicklungen für agiles Arbeiten und Führen.'
