zusätzlich die Zustimmung des gesetzlichen Vertreters nötig. Die Einverständniserklärung können Sie per E-Mail an mail@dpunkt.de mit Angaben zu Bildtitel und Name einsenden.Die Teilnehmer*innen stellen die dpunkt.verlag Gmbh von Rechten Dritter frei.Teilnahmeberechtigt am »dpunkt.fotopreis« sind alle Fotoamateure. Ausgenommen sind Mitarbeiter*innen des Verlages sowie deren nahe Angehörige. Unter Amateurfotografen*innen verstehen wir all jene, deren Einnahmen aus der Fotografie nicht steuerpflichtig sind. Teilnehmer*innen werden auch dann zu den Amateurfotografen*innen gezählt, wenn sie gelegentlich ihre Fotografien zum Verkauf anbieten oder beispielsweise über eine eigene Foto-Homepage verfügen.Die Teilnahme ist ausschließlich online über diese Wettbewerbsseite bis zum 15. Mai 2025 möglich. Einreichungen auf anderen Wegen werden nicht für den Wettbewerb zugelassen.Mehrere Einsendungen mit mehreren E-Mail-Adressen führen zum Ausschluss vom Wettbewerb.Es ist nicht gestattet, Bilder einzureichen, die bereits bei anderen Fotowettbewerben eine Platzierung erhalten haben.Der Wettbewerb beschränkt sich auf Teilnehmende, die Ihren Wohnsitz im DACH-Raum haben.Formate: Die Bilder müssen im JPG-Format eingereicht werden. Die Dateigröße darf in der Einreichungsphase des Wettbewerbs maximal 5 MB betragen, sollte aber eine Mindestgröße von 1500 Pixel an der längeren Kante haben. Ggf. werden die Bilder dann für eine spätere Verwendung noch einmal in höherer Auflösung angefragt. Hierüber erhalten die Teilnehmer nach der Jurierung eine gesonderte Nachricht.Wir behalten uns das Recht auf Ablehnung ohne Nennung von Gründen von Fotos vor, die Rechte Dritter verletzen, rechtes Gedankengut verbreiten, Menschen diskriminieren oder in anderer Weise gegen geltendes Recht verstoßen oder auch einen Verstoß andeuten.Mit der Teilnahme am Wettbewerb erteilen Sie der dpunkt.verlag GmbH ein unwiderrufliches einfaches unbefristetes Nutzungsrecht, um das eingereichte Foto im Rahmen der Durchführung,