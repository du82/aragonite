title = "bcc API 2025 • dpunkt.verlag"
description = """
APIs – die Basis für moderne IT-Systeme
Online – 15. Mai 2025



In der Softwareentwicklung kommt man nicht mehr um APIs herum: Ob Private oder Public APIs – Software- und Webentwickler:innen müssen schwierige Fragen beantworten: Welche Architekturparadigmen, welche Verfahren, welche Protokolle nutze ich, wann welche besser nicht? Wie gewährleiste ich Qualität, Kompatibilität und Sicherheit?
Die Vorträge der betterCode() API am 15. Mai 2025 bieten Softwareentwickler:innen, Softwarearchitekt:innen sowie API- und Integrationsbeauftragten konzeptuelles Wissen, neueste Trends der API-Entwicklung sowie umsetzbares Praxis-Know-how und Entscheidungshilfen.




Auf der betterCode() API 2025 wird es u.a. um folgende Themen gehen:

Fortgeschrittene Entwurfstechniken
Entwicklungstools
Versionierung
Testen
API Management
Data Contracts
API Sprawl und Great Unbundling"""
