description = "Sie wollen Python lernen oder Ihre Kenntnisse vertiefen? Dann sind Sie hier genau richtig. Wir bieten Ihnen Fachbücher zur Ausbildung, zur Fortbildung und für Ihren Programmier-Alltag. Stöbern Sie in unserem Programm und starten Sie mit Python durch!Python lernen und meisternFür alle, die Python lernen wollen, bieten wir eine Reihe von Büchern, die die Grundlagen der Python-Programmierung erklären. Schritt für Schritt werden systematisch die einzelnen Sprachelemente erklärt und mit vielen Beispielen die praktische Anwendung gezeigt. Dank Code zum Download wird ohne mühevolles Abtippen an der Tastatur gelernt und Sie können neu erlernte Programmierkonzepte gleich ausprobieren. Wenn Sie schon über Python-Kenntnisse verfügen, finden Sie hier passende Bücher zu fortgeschrittenen Techniken wie Slicing, Lambda-Funktionen, reguläre Ausdrücke, Map- und Reduce-Funktionen. Entdecken Sie praktische Python-Tricks, verbessern Sie gezielt Ihren Programmierstil und lernen Patterns für große Python-Projekte kennen. Mit dem Buch »Python Challenge« können Sie Ihr Wissen in über 100 Aufgaben (mit Musterlösungen) unter Beweis stellen."
