["https://dpunkt.de/duchemin"]
title = "Meisterhafte Fotografie • dpunkt.verlag"
description = "David duChemin, Fotograf und Abenteurer. Früher in humanitären Projekten aktiv, heute fokussiert er sich auf die Wildnis."
full_description = 'dpunkt.verlag Meisterhafte FotografieMeisterhafte Fotografie»Es geht nicht nur darum, dass Sie etwas erschaffen, sondern dass Sie etwas erschaffen, wie nur Sie es auf Ihre eigene, einzigartige Weise vermögen.«David duChemin ist ein renommierter Fotograf, Autor und Abenteurer, der sich vor allem durch seine emotionale Herangehensweise an die Fotografie auszeichnet. In seinen Texten fordert er Fotografen dazu auf, über die technischen Aspekte hinauszudenken und sich auf die visuelle Sprache von Licht, Farbe und Form zu konzentrieren, um die Essenz eines Moments festzuhalten. Für duChemin steht die emotionale Verbindung zwischen Bild und Betrachter im Mittelpunkt.DuChemins Bücher bieten wertvolle Einblicke in die Kunst des Geschichtenerzählens mit Bildern und helfen Ihnen dabei, Ihre persönliche Vision zu entwickeln und kreative Techniken zu verfeinern. Entdecken Sie, wie duChemin die komplexe Beziehung zwischen Technik und Emotion in der Fotografie beleuchtet und wertvolle Ratschläge für jeden Fotografen gibt.Licht, Raum und ZeitDavid duChemins neuestes Buch »Licht, Raum und Zeit« ist ein Leitfaden für alle, die Fotografie als kreatives Ausdrucksmittel nutzen wollen. Es lehrt, wie man die Kamera nicht nur technisch beherrscht, sondern auch ihre Sichtweise und Arbeitsweise versteht, um kreative Freiheit zu erlangen. In 20 Essays und mit mehr als 100 Fotografien bietet das Buch wertvolle Einblicke und Inspiration, um Herausforderungen zu meistern und persönliche, ausdrucksstarke Bilder zu schaffen.Zum Buch<img decoding="async" class="stk-img wp-image-523050" src="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-scaled.jpg" width="1440" height="2560" srcset="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-scaled.jpg.webp 1440w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-169x300.jpg.webp 169w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-576x1024.jpg.webp 576w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-768x1365.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-864x1536.jpg.webp 864w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-1152x2048.jpg.webp 1152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-152x270.jpg.webp 152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-200x356.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-01-600x1067.jpg.webp 600w" sizes="(max-width: 1440px) 100vw, 1440px" /><img decoding="async" class="stk-img wp-image-524825" src="https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-scaled.jpg" width="1440" height="2560" srcset="https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-scaled.jpg.webp 1440w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-169x300.jpg.webp 169w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-576x1024.jpg.webp 576w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-768x1365.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-864x1536.jpg.webp 864w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-1152x2048.jpg.webp 1152w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-152x270.jpg.webp 152w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-200x356.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2024/10/Story_duChemin-19-600x1067.jpg.webp 600w" sizes="(max-width: 1440px) 100vw, 1440px" />Das Herz der FotografieIn diesem Buch stellt duChemin gezielte Fragen, die Fotografen helfen, ihre Bilder besser zu verstehen und zu analysieren. Mit Fragen zur Bildgestaltung, Lichtführung und Spannung beleuchtet er den kreativen Prozess, um starke und authentische Bilder zu schaffen. Sein Ansatz unterstützt Fotografen dabei, ihre eigene Arbeit kritisch zu hinterfragen und zu verbessern.Zum BuchDie Seele der KameraIn der Flut der Bilder, die täglich auf uns einströmen, gibt es nur wenige, die uns wirklich berühren. DuChemin betont, dass es die Seele und die Stimmung eines Bildes sind, die es als außergewöhnlich hervorheben. Dieses Buch zeigt, wie Fotograf*innen durch Achtsamkeit, Empathie und Authentizität emotionale und ausdrucksstarke Bilder schaffen können.Zum Buch<img decoding="async" class="stk-img wp-image-523059" src="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-scaled.jpg" width="1440" height="2560" srcset="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-scaled.jpg.webp 1440w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-169x300.jpg.webp 169w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-576x1024.jpg.webp 576w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-768x1365.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-864x1536.jpg.webp 864w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-1152x2048.jpg.webp 1152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-152x270.jpg.webp 152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-200x356.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-02-600x1067.jpg.webp 600w" sizes="(max-width: 1440px) 100vw, 1440px" /><img decoding="async" class="stk-img wp-image-523062" src="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-scaled.jpg" width="1440" height="2560" srcset="https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-scaled.jpg.webp 1440w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-169x300.jpg.webp 169w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-576x1024.jpg.webp 576w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-768x1365.jpg.webp 768w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-864x1536.jpg.webp 864w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-1152x2048.jpg.webp 1152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-152x270.jpg.webp 152w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-200x356.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin_Story-04-600x1067.jpg.webp 600w" sizes="(max-width: 1440px) 100vw, 1440px" />Das Handwerkszeug des FotografenDieses Buch richtet sich an leidenschaftliche Fotograf*innen, die ihre Bilder fortlaufend verbessern möchten. Es enthält 60 Workshops, in denen Sie Ihre handwerklichen Fähigkeiten verfeinern – von der Nutzung natürlichen Lichts bis zur gezielten Bildaufteilung. Jede Übung schließt mit einer Praxisaufgabe ab, die das Erlernte festigt.Zum BuchDer AutorDavid duChemin ist ein Fotograf, Schriftsteller und Abenteurer, der auf Vancouver Island, Kanada, lebt. Früher fotografierte er im Rahmen humanitärer Projekte Menschen in Indien und Afrika, heute widmet er sich der Wildnis und ihren Tieren.Seine Arbeiten finden Sie online auf DavidduChemin.com.<img decoding="async" class="stk-img wp-image-522606" src="https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst.png" width="7170" height="4782" srcset="https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst.png 2560w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-300x200.png 300w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-1024x683.png 1024w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-768x512.png 768w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-1536x1024.png 1536w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-2048x1366.png 2048w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-400x267.png 400w, https://dpunkt.de/wp-content/uploads/2024/09/duChemin-LST-Headshot-Credit-Peter-Holst-200x133.png 200w, h