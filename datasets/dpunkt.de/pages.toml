full_description = "Allgemeine GeschäftsbedingungenAllgemeine Geschäftsbedingungen (AGB) und Widerrufsbelehrung der dpunkt.verlag GmbH1. VertragsparteienDer Vertragspartner des Kunden ist diedpunkt.verlag GmbHWieblinger Weg 17D-69123 HeidelbergGeschäftsführung: S. Effertz, J. Stevens-LemoineAmtsgericht Mannheim HRB 331024UST-Id.: DE 811 845 830Kontakt zum Kundenservice:Vertrieb dpunkt.verlagfon: 06221/1483-40fax: 06221/1483-99e-mail: bestellung(at)dpunkt.deDer Versand der bestellten Printerzeugnisse erfolgt über:Germinal Medienhandlung GmbHSiemensstraße 16D-35463 Fernwald2. GeltungsbereichFür die Geschäftsbeziehung zwischen der dpunkt.verlag GmbH und dem Besteller gelten ausschließlich die hier abgedruckten Allgemeinen Geschäftsbedingungen in ihrer zum Zeitpunkt der Bestellung gültigen Fassung. Mit der kostenpflichtigen Bestellung unserer Ware gelten die Lieferungs- und Zahlungsbedingungen der dpunkt.verlag GmbH als anerkannt.3. BestellungDurch Betätigen der Schaltfläche »zahlungspflichtig bestellen« wird Ihre Bestellung ausgelöst und an uns weitergeleitet. Sie erklären damit verbindlich, die Ware erwerben zu wollen.4. VertragsabschlussBei einer Bestellung schließen Sie einen Vertrag mit der dpunkt.verlag GmbH. Bei elektronischen Bestellungen werden Sie umgehend über den Eingang Ihrer Bestellung per E-Mail informiert. Die Auftragsbestätigung erfolgt automatisch und stellt noch keine Vertragsannahme dar. Gleichzeitig erhalten Sie mit einer separaten E-Mail Ihre Rechnung.Der Vertrag mit der dpunkt.verlag GmbH kommt bei der Bestellung von Printerzeugnissen durch die Zusendung der von Ihnen bestellten Ware zustande.Beim Kauf von digitalen Produkten kommt der Kaufvertrag nach Abschluss des Bezahlvorgangs zustande. Der Nutzer verpflichtet sich, den angegebenen Preis zu bezahlen. Unmittelbar im Anschluss an den Bezahlvorgang erhält der Nutzer die erforderlichen Daten zum Abruf des erworbenen E-Books. Der Download muss innerhalb von 2 Wochen nach Zugang erfolgen. Im Falle von Kreditkartenzahlung wird der Kreditkarteninhaber unverzüglich nach dem erfolgreichen Vertragsabschluss belastet. Die für den Vertragsabschluss zur Verfügung stehende Sprache ist deutsch.5. Vorbehalt der NichtverfügbarkeitWir behalten uns vor, von einer Ausführung Ihrer Bestellung abzusehen, wenn der bestellte Titel nicht vorrätig ist, der nicht vorrätige Titel vergriffen und die bestellte Ware infolgedessen nicht verfügbar ist. In diesem Fall werden wir Sie unverzüglich über die Nichtverfügbarkeit informieren und einen gegebenenfalls von Ihnen bereits bezahlten Kaufpreis unverzüglich rückerstatten.6. PreiseFür bereits erschienene Bücher gelten ausschließlich die Preise, die zum Zeitpunkt Ihrer Bestellung auf den jeweiligen Produktseiten angezeigt werden. Irrtümer sind vorbehalten. Preisangaben zu noch nicht erschienenen Produkten sind ca.-Preise und können sich noch ändern. Alle Preise sind Endverkaufspreise und schließen die jeweilige gesetzliche Mehrwertsteuer ein, jedoch nicht eventuell anfallende Versandkosten. Die Preise für Bücher und E-Books sind in Deutschland und Österreich gesetzlich gebunden.7. VersandkostenInnerhalb Deutschlands sowie nach Österreich, in die Schweiz, Luxemburg und Liechtenstein liefern wir portokostenfrei. In alle anderen europäischen Staaten berechnen wir eine Versandkostenpauschale von EUR 7,00, die Portogebühren ins übrige Ausland betragen EUR 20,00 je Sendung.Die Lieferung erfolgt per Post, DHL oder DPD.8. ZahlungDer Kaufpreis für Printerzeugnisse ist fällig innerhalb von 30 Tagen nach Rechnungsstellung ohne Abzug. Sie können mittels Kreditkarte, Klarna durch Überweisung oder PayPal zahlen. Nach Ablauf der o.g. Frist tritt Verzug ein.Beim Kauf von digitalen Produkten erhalten Sie unmittelbar im Anschluss an den Bezahlvorgang die erforderlichen Daten zum Abruf des erworbenen E-Books. Der Download muss innerhalb von 2 Wochen nach Zugang erfolgen. Im Falle von Kreditkartenzahlung wird der Kreditkarteninhaber unverzüglich nach dem erf