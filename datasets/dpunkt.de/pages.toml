title = "REConf®2025 – Agenda und Anmeldung • dpunkt.verlag"
description = """
Bereits zum 22. Mal trifft sich das „Who is Who“ des Anforderungsmanagements auf der jährlich in München stattfindenden REConf® (Requirements Engineering Conference).
Die REConf ist Europas führende Konferenz mit Schwerpunkt Requirements Engineering.
Hier werden neue Methoden, Trends und Tools in Vorträgen, Diskussionsrunden und Workshops vorgestellt.
Die nächste REConf mit dem Motto „Next Level Requirements Engineering“ findet am 05.-07. Mai 2025 statt.
Zum Programm: www.REConf.de 

