["https://dpunkt.de/event/okr-day-2"]
title = "OKR Day • dpunkt.verlag"
description = """
Entdecke die Welt von OKR – Objectives and Key Results! 
OKR ermöglicht es Unternehmen, klare, fokussierte Ziele (Objectives) mit messbaren Erfolgen (Key Results) zu verbinden. Anders als herkömmliche Ansätze werden OKR nicht von oben diktiert, sondern auf relevanten Unternehmensebenen mit aktiver Mitarbeitendenbeteiligung entwickelt.
Das Ergebnis? Eine starke Identifikation aller Mitarbeitenden mit den strategischen Zielen und eine beeindruckende Energie, wenn alle in dieselbe Richtung ziehen.
Am OKR Day erfährst du nicht nur, wie OKR funktioniert, sondern auch, wie du es in deinem Unternehmen erfolgreich implementieren kannst. Erlebe inspirierende Vorträge, Erkenntnisse und Diskussionen, die dir helfen, dein Unternehmen effizienter zu führen und strategische Ziele erfolgreich umzusetzen.






Die Konferenz richtet sich an agile Coaches, agiles Management und Führungskräfte, Scrum Master, OKR Master sowie an alle, die sich für das Thema OKR vertieft interessieren."""
