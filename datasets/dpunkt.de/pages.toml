title = "Agile Methoden • Fachbücher & eBooks • dpunkt.verlag"
description = "Vom Agilen Manifest zum agilen ArbeitenScrum, Kanban oder ScrumBan? Wie Sie Agilität im Team, in kleinen oder großen Organisationen einführen und leben können, erfahren Sie in unseren Fachbüchern zu den agilen Methoden. Das Themenspektrum reicht von grundlegenden Einführungen in das agile Mindset bis zu Handbüchern zu den einzelnen Methoden und deren Umsetzung in der Praxis. Fachbücher speziell für Scrum Master, Product Owner und Agile Coaches runden unser Buchprogramm ab.Mit Scrum oder Kanban zum ErfolgSchnellere Entwicklung, höhere Qualität, bessere Produkte, glücklichere Mitarbeitende und nicht zuletzt zufriedenere Kund*innen: Um das zu erreichen, ist tiefgehendes Wissen zu den agilen Werten, deren Umsetzung und Methoden wie Scrum oder Kanban notwendig. Hier setzen unsere Bücher an. Erfahren Sie, wie und warum Scrum und Kanban funktionieren. Lernen Sie, wie das Arbeiten in selbstorganisierten Teams zum Erfolg führt. Entwickeln Sie sich selbst und Ihre Arbeitsweise weiter. Unsere Fachbücher sind hilfreiche Begleiter auf Ihren Weg zu mehr Agilität sein."
