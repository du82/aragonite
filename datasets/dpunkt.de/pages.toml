["https://dpunkt.de/event/ia-agile-softwareentwicklung-im-unternehmen"]
title = "iA Agile Softwareentwicklung im Unternehmen • dpunkt.verlag"
description = """
Technische Exzellenz in den Fokus rücken
Auf der Onlinekonferenz am 27. März 2025 beschäftigen Sie sich mit folgenden Themen:

Warum brauche ich technische Exzellenz und wie lerne ich sie?
Welche Programmierpraktiken und Kollaborationsmethoden führen zum Erfolg?
Wie fördere ich die nötigen Skills in meinem Team und in meinem Unternehmen?

Ein Event für alle, die in ihrem Team Verantwortung dafür übernehmen, dass Software nicht nur agil, sondern auch erfolgreich entwickelt wird: für Softwareentwickler:innen, Softwarearchitekt:innen und Teamleads.


… nur mit den richtigen Programmierpraktiken wird agile Softwareentwicklung gelingen.
Viele Unternehmen entwickeln ihre Software agil – mal mehr, mal weniger erfolgreich. Klappt es nicht, steht immer häufiger die agile Vorgehensweise komplett in Frage. Aber agile, kontinuierliche Softwareentwicklung funktioniert – vorausgesetzt, man beachtet die entsprechenden Programmierpraktiken, Kollaborationsmethoden und technischen Fähigkeiten, wie sie die 12 Prinzipien im Agilen Manifest widerspiegeln."""
