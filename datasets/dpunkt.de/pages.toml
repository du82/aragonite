full_description = 'IT-Know-how auf den Punkt gebracht Im Programm Computing finden Sie Bücher aus allen Bereichen der IT: von Programmiersprachen über Softwareentwicklung, Data Science und Business Intelligence sowie IT-Administration bis hin zu Arbeitsmethoden aus der agilen Softwareentwicklung und modernen Unternehmensführung. Für einen hohen Praxisbezug sorgen Beispiele und Use Cases aus dem wahren Leben sowie Code zum Download oder in Repositorys bei GitHub und Co. Überzeugen Sie sich selbst und schnuppern Sie mit umfangreichen Probekapiteln in die Bücher hinein.Unsere Neuerscheinungen On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale On Sale Entdecken Sie unser BuchprogrammScrum, Kanban und Co.Agile MethodenAgiles Arbeiten klingt manchmal sehr einfach, doch in der Praxis tauchen oft unerwartete Stolperfallen auf. Unsere Autor:innen helfen Ihnen dabei, die für Sie passenden Methoden, Tools und Frameworks zu finden. Außerdem zeigen sie Ihnen, wie Sie Agilität erfolgreich in Ihrem Team oder Unternehmen umsetzen. Viele Beispiele aus der Praxis unterstützen dabei, die agilen Werte zu verinnerlichen und im Arbeitsalltag zu verankern.zu den Büchern Für Einsteiger und ProfisMachine Learning & KISie stehen noch am Anfang oder schon mittendrin im Einsatz von Machine Learning, Deep Learning oder neuronalen Netzen? Egal, ob Sie sich mit TensorFlow, pandas, GANs oder PyTorch schon auskennen oder einen Einstieg suchen, unsere Bücher unterstützen Sie dabei, Neues zu lernen oder Bekanntes zu vertiefen. Lernen Sie die Konzepte, Tools und Techiken kennen, um erfolgreich eigene Anwendungen zu entwickeln.zu den BüchernIhr Weg zum Java-ProfiJavaSie möchten Ihr Java-Wissen auf den neuesten Stand bringen? Oder Ihre Programmierkenntnisse endlich erweitern? Oder Ihre Kenntnisse von Java-Tools und -Frameworks verbessern? Dann sind Sie hier genau richtig: Unsere Autoren bringen Ihnen ganz praktisch sowohl die Grundlagen als auch fortgeschrittene Themen näher.zu den Büchern Für Ihre WeiterbildungSoftwarequalität & TestenGut durchdachte und aufgebaute Teststrategien, -methoden und -Tools sind entscheidende Bausteine bei der Entwicklung erfolgreicher Softwareprodukte. Unsere Bücher begleiten Sie auf Ihrer Aus- und Weiterbildung, z.B. im Rahmen der ISTQB-Zertifizierung. Beispiele und Tipps aus der Praxis machen die Bücher auch danach zu einem wichtigen Nachschlagewerk für Ihre tägliche Testpraxis.zu den BüchernUnsere aktuellen Bestseller<img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/13228-scaled.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/13228-scaled.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="1762" height="2560"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/14012.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/14012.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="450" height="742"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/13712.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/13712.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="500" height="727"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/05/14067.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/05/14067.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="450" height="655"> On Sale <img decoding="async" srcset="https://dpunkt.de/wp-content/uploads/2024/03/14024.jpg" class="wpcp-lazyload" data-wpcp_src="https://dpunkt.de/wp-content/uploads/2024/03/14024.jpg" src="https://dpunkt.de/wp-content/plugins/wp-carousel-pro/src/Frontend/css/spinner.svg" alt="" width="4