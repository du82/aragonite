["https://dpunkt.de/faq"]
title = "FAQ • dpunkt.verlag"
description = "Antworten auf die häufigsten Fragen zum E-Book-Kauf und dpunkt.plus"
full_description = 'FAQ<img decoding="async" src="https://dpunkt.de/wp-content/uploads/2020/03/faq_headergrafik_1920-300.svg" alt="" class="wp-image-56221"/>Fragen zum E-BookWas ist ein E-Book?Bei einem E-Book handelt es sich um Publikationen im PDF-, ePub- oder mobi-Format, die es Ihnen erlauben, Inhalte am Bildschirm zu lesen, gezielt nach Informationen darin zu suchen und Seiten daraus auszudrucken.dpunkt.ebooks und oreilly.ebooks können Bücher (oder Teile daraus) sein, die es auch in gedruckter Form gibt (bzw. gab und die inzwischen vergriffen sind). Einen entsprechenden Hinweis auf eine gedruckte Ausgabe finden Sie auf der entsprechenden E-Book-Seite.Es können aber auch Originalpublikationen sein, die es ausschließlich in E-Book-Form gibt. Diese werden mit der gleichen Sorgfalt und in der gleichen Qualität veröffentlicht, die Sie bereits von gedruckten Büchern her kennen.Erscheinen alle Bücher auch als E-Book?Seit 2012 wird ein Großteil der beim dpunkt.verlag und O’Reilly produzierten Titel ebenfalls als E-Book angeboten.Einige Titel können aufgrund Lizenzvereinbarungen nicht in digitaler Form zu Verfügung gestellt werden. Ältere Titel können daher nur vereinzelt aufbereitet werden. Zudem kommt es vor, dass wir uns entscheiden bestimmte Titel nicht als E-Book anzubieten, da das Layout nur unzureichend dargestellt werden kann.Welche Formate erhalte ich beim Kauf eines E-Books?Bei einem Kauf eines E-Books im Shop des dpunkt.verlags erhalten Sie das von Ihnen gewünschte der angezeigten Formate. Dies sind bei den Titeln seit März 2015 die Formate PDF, ePub und Mobi. In welchen Formaten eine Publikation vorliegt, können Sie der Produktseite rechts neben dem Titelbild entnehmen. Die Formate werden bei den ISBNs benannt. Nach dem Kauf eines E-Books erhalten Sie Links mit den jeweils verfügbaren Formaten. Hier können Sie sich das von Ihnen gewählte Format herunterladen.Was ist ein ePub?Das ePub (Electronic Publication) ist ein freier und offener Standard für E-Books, der vom International Digital Publishing Forum (IDPF) entwickelt wurde. E-Books im ePub-Format passen sich der Bildschirmgröße des Lesegeräts an. Texte und Inhalte werden je nach Display anders umbrochen und dargestellt. Ebenfalls kann die Schriftgröße und -art vom Leser individuell eingestellt werden. Sie sind deshalb für mobile E-Book-Lesegeräte (Smartphones, Tablets, E-Reader) besonders gut geeignet.Was ist ein Mobi?Ein Mobi ist ein eine Abwandlung des ePub-Formats von Amazon. Dabei besitzt es dieselben Darstellungseigenschaften wie das ePub. Um eine Datei mit der Endung .mobi lesen zu können, benötigen Sie eine Kindle-App oder -Gerät von Amazon.Was darf ich mit dem E-Book vom dpunkt.verlag tun (DRM, Kopierschutz)?Wir verwenden kein Digital Rights Management (DRM), das bedeutet, die Datei ist nicht kopiergeschützt und kann für den eigenen Bedarf beliebig oft kopiert werden. Es ist jedoch nicht gestattet, die Datei weiterzugeben oder für andere zugänglich in Netzwerke zu stellen. Sie erwerben also eine Ein-Personen-Nutzungslizenz.Bitte beachten Sie, dass die Inhalte der Datei in jedem Fall dem Copyright des Verlages unterliegen.Gibt es Ein- und Mehr-Personen-Nutzungslizenzen?Falls Sie nur ein Exemplar kaufen möchten, können Sie dies wie gewohnt über unseren Shop tun.Bei einer Mehr-Personen-Nutzungslizenz, z. B. für Schulungen oder Firmen, wenden Sie sich bitte an Ciando oder einen ähnlichen Anbieter.Wie kaufe und bezahle ich ein E-Book?Wählen Sie »Digital« aus und legen Sie das E-Book in den Warenkorb und bezahlen Sie bequem per Kreditkarte, Klarna, Überweisung oder PayPal.Bitte beachten Sie: Seit 2015 müssen Unternehmen die Umsatzsteuer für E-Book-Verkäufe an Privatpersonen im EU-Ausland im Land des Empfängers entrichten. Ihre Rechnung weist daher den Mehrwertsteuersatz Ihres Landes auf. Am ausgewiesenen Bruttopreis ändert sich für Sie nichts!Geschäftskunden müssen weiterhin Ihre Umsatzsteuer-Identifikationsnummer eingeben.Wie erhalte ich das gekaufte E-Book?Sobald der Bestell- und Bezahlvorgang abgeschlossen ist, erhalten Sie an die von Ihnen angegebene Adresse eine Bestätigung. Außerdem erhalten Sie von uns eine E-Mail mit einem Link zu einer Webseite, auf der Sie die gekauften Dokumente und eine PDF-Rechnung für die Bestellung zwei Wochen lang herunter laden können. Diese Website erscheint auch unmittelbar nach Abschluss der Bestellung in Ihrem Browser.Falls Sie keine E-Mail von uns erhalten haben, prüfen Sie bitte zunächst den Spam-Ordner Ihres E-Mail-Accounts. Wenn auch dort keine E-Mail von uns zu finden ist, können Sie unter ebooks@dpunkt.de Kontakt zu uns aufnehmen.Kann ich ein Bundle (Buch inklusive E-Book) kaufen?Ja, grundsätzlich bieten wir für alle Titel, die seit 2017 erschienen sind, Bundles an. Grundvoraussetzung dafür ist, dass der Titel sowohl als Print-Buch sowie E-Book erschienen ist. Ob ein Titel als Bundle verfügbar ist, können Sie daran erkennen, ob Sie auf der Produktseite die Option »Bundle« auswählen können. Zusätzlich finden Sie dort auch die entsprechende Bundle-ISBN. Bitte beachten Sie, dass unsere Bundles exklusiv in unserem Shop erhältlich sind. Weitere Informationen rund um das Thema dpunkt.bundle beantworten wir hier.Ich habe ein Buch gekauft, erhalte ich ein E-Book günstiger?Eine Vergünstigung aufgrund einer erworbenen gedruckten Ausgabe können wir aufgrund der Buchpreisbindung leider nicht anbieten.Kann ich die E-Books auch ohne E-Book-Reader lesen?Ja, sie benötigen zum Lesen unserer E-Books nicht zwingend einen E-Book –Reader. Sie können sich die E-Books auf Ihrem Computer, Laptop, Notebook, Tablet oder Smartphone anzeigen lassen. Am besten nutzen Sie hier das PDF- oder alternativ das ePub-Format.Wo finde ich das Zusatzmaterial zu meinen E-Book?Oftmals befindet sich das Zusatzmaterial zu unseren E-Books auf der Produktseite des Titels. Sie können die Dateien dort einfach herunterladen. Sollte das Zusatzmaterial an anderer Stelle zu finden sein, finden Sie den Hinweis dazu im E-Book selbst.Wo finde ich die AGBs bezüglich E-Books?Allgemeine Geschäftsbedingungen (AGB) finden Sie hier und Widerrufsbelehrung für digitale Inhalte der dpunkt.verlag GmbH finden Sie hier.Fragen zu dpunkt.plus | oreilly.plusWas ist dpunkt.plus | oreilly.plus?Bitte beachten Sie, dass unser dpunkt.plus-Angebot eingestellt wurde. Ihre laufende Mitgliedschaft können Sie selbstverständlich bis zum Ende des bezahlten Zeitraums nutzen. Eine Verlängerung ist leider nicht mehr möglich.Kund*innen mit laufender dpunkt.plus-Mitgliedschaft empfehlen wir, die im Mitgliedszeitraum verifizierten Titel über Ihr Kundenkonto herunterzuladen. Nach Ablauf der Mitgliedschaft haben Sie keinen Zugriff mehr auf diese Bücher.Welche Formate erhalte ich innerhalb des plus.angebots?In Ihrem Mitgliedsbereich erhalten Sie ausschließlich ein E-Book in PDF-Format.Zu welchen Büchern erhalten ich ein PDF?Seit 2012 wird der Großteil der beim dpunkt.verlag produzierten Bücher auch als E-Book angeboten. Einige Titel können jedoch aus lizenzrechtlichen Gründen nicht digital angeboten werden und sind somit nicht im dpunkt.plus-Programm erhältlich. Zu welchen Titeln auch das PDF zur Verfügung steht, können Sie in der Regel an dem plus.Zeichen auf der Umschlagrückseite des Print-Buchs erkennen.Hinweis auf der UmschlagrückseiteErhalte ich die aktuelle Auflage, wenn ich nur eine Ältere besitze?Nein, das ist in der Regel nicht möglich.Wie weise ich den Kauf eines Buchs nach?Für den Nachweis müssen Sie das Buch vorliegen haben, wenn Sie sich ein PDF erzeugen möchten. Es gibt eine Abfrage, die Sie nur mit der gedruckten Ausgabe lösen können. Das heißt, einen Kassenbeleg oder ähnliches müssen Sie nicht bei uns einschicken.Gibt es einen Kopierschutz für die PDF?Nein. Sie können das PDF auf mehreren eigenen Geräten gleichzeitig verwenden.Bitte beachten Sie, dass es sich hierbei um eine Einzel-Nutzer-Lizenz handelt. Eine Weitergabe an Dritte ist nicht gestattet.'
year_published = 2025
year_updated = 2024
