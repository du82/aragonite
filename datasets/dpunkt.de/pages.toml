["https://dpunkt.de/dpunkt-fotopreis-2025"]
title = "dpunkt.fotopreis 2025 • dpunkt.verlag"
description = "Erfahren Sie alles über den dpunkt.fotopreis 2025 mit dem Wettbewerbthema: Naturfotografie. Nehmen Sie teil und zeigen Sie Ihr können. 📸"
full_description = 'dpunkt.verlag dpunkt.fotopreis 2025Der WettbewerbWillkommen beim dpunkt.fotopreis! Wandern Sie gern durch unberührte Landschaften? Streifen Sie mit wachem Blick durch dichte Wälder oder über sanfte Hügel? Oder lieben Sie es, das Lichtspiel in nebligen Tälern oder auf glitzernden Wasseroberflächen einzufangen?Wir laden alle Naturbegeisterten und Fotoliebhaber*innen herzlich ein, am dpunkt.fotopreis 2025 teilzunehmen. Nutzen Sie die Gelegenheit, Ihr beeindruckendstes Werk im Genre »Naturfotografie« einem breiten Publikum zu präsentieren und von unserer Fachjury ausgezeichnet zu werden.Naturfotografie ist mehr als das Festhalten schöner Landschaften – sie erzählt von der Stille der Wildnis, der Kraft der Elemente und der filigranen Schönheit des Lebens. Sie eröffnet den Blick für verborgene Details und große Szenerien, für das Zusammenspiel von Licht, Wetter und Jahreszeiten. Ob majestätische Bergketten, geheimnisvolle Wälder oder die zarte Struktur eines Blattes – die Naturfotografie lädt dazu ein, die Welt mit neuen Augen zu sehen.Machen Sie jetzt beim dpunkt.fotopreis 2025 mit. Hier finden Sie unsere Galerie mit allen Einsendungen.Der AblaufDie Einreichungsphase läuft vom 1. März bis 15. Mai 2025.Shortlist und Gewinnerfotos geben wir voraussichtlich Ende Mai 2025 bekannt.Alle eingereichten Bilder werden bis Ende Dezember 2025 mit Titel und Urheber*in in einer Online-Galerie gezeigt.Die JuryBoris Karnikowski<img decoding="async" width="750" height="750" src="https://dpunkt.de/wp-content/uploads/2024/08/Boris_.jpg" alt="" class="wp-image-517749" srcset="https://dpunkt.de/wp-content/uploads/2024/08/Boris_.jpg.webp 750w, https://dpunkt.de/wp-content/uploads/2024/08/Boris_-300x300.jpg.webp 300w, https://dpunkt.de/wp-content/uploads/2024/08/Boris_-150x150.jpg.webp 150w, https://dpunkt.de/wp-content/uploads/2024/08/Boris_-270x270.jpg.webp 270w, https://dpunkt.de/wp-content/uploads/2024/08/Boris_-200x200.jpg.webp 200w, https://dpunkt.de/wp-content/uploads/2024/08/Boris_-600x600.jpg.webp 600w" sizes="(max-width: 750px) 100vw, 750px" />Boris Karnikowski arbeitet als Lektor für dpunkts Fotoprogramm eigentlich hinter den Kulissen, hat aber auch schon als Co-Autor mitgeschrieben. Er fotografiert seit Mitte der 80er vor allem mit Nikon, meistens digital, aber auch immer wieder analog, in Kleinbild- und Mittelformat. Eine Auswahl seiner Bilder finden Sie unter https://500px.com/boriskarnikowski.Die PreiseBücher aus dem Programm des dpunkt.verlagsJahresabo der c’t FotografieHeidelberger Sommerschule der Fotografie Online-WorkshopUnsere Sponsoren<img decoding="async" width="600" height="239" src="https://dpunkt.de/wp-content/uploads/2025/02/Logo-Sommerschule-rgb.jpg" alt="" class="wp-image-536578" srcset="https://dpunkt.de/wp-content/uploads/2025/02/Logo-Sommerschule-rgb.jpg.webp 600w, https://dpunkt.de/wp-content/uploads/2025/02/Logo-Sommerschule-rgb-300x120.jpg.webp 300w, https://dpunkt.de/wp-content/uploads/2025/02/Logo-Sommerschule-rgb-400x159.jpg.webp 400w, https://dpunkt.de/wp-content/uploads/2025/02/Logo-Sommerschule-rgb-200x80.jpg.webp 200w" sizes="(max-width: 600px) 100vw, 600px" /><img decoding="async" width="454" height="142" src="https://dpunkt.de/wp-content/uploads/2024/09/Heise-Medien_RGB.png" alt="" class="wp-image-523428" srcset="https://dpunkt.de/wp-content/uploads/2024/09/Heise-Medien_RGB.png 454w, https://dpunkt.de/wp-content/uploads/2024/09/Heise-Medien_RGB-300x94.png 300w, https://dpunkt.de/wp-content/uploads/2024/09/Heise-Medien_RGB-400x125.png 400w, https://dpunkt.de/wp-content/uploads/2024/09/Heise-Medien_RGB-200x63.png.webp 200w" sizes="(max-width: 454px) 100vw, 454px" />Erscheint im AprilNaturfotografie im Gartenvon Jonathan FieberZum Buch<img decoding="async" class="stk-img wp-image-530431" src="https://dpunkt.de/wp-content/uploads/2024/12/14155-scaled.jpg" width="1920" height="2560" srcset="https://dpunkt.de/wp-content/uploads/2024/12/14155-scaled.jpg 1920w, https://dpunkt.de/wp-content/uploads/2