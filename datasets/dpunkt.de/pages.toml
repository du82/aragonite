["https://dpunkt.de/fotografie"]
title = "Die Welt der Fotografie • Bücher und E-Books von dpunkt"
description = "Alles über Fotografie und Bildbearbeitung · Bücher und E-Books für Fotograf:innen · Fotoschulen, Kamerahandbücher, PocketGuides 📕"
full_description = "Die Welt der Fotografie Tauchen Sie ein in die Welt der Fotografie: Die dpunkt.fotobücher zeigen Ihnen, wie Sie Menschen in Szene setzen, begleiten Sie auf Streifzügen durch die Natur oder entdecken mit Ihnen die Streetfotografie und den Reiz urbaner Landschaften – und sie unterstützen Sie dabei, Ihren eigenen fotografischen Stil zu entwickeln. Sie erhalten Wissen über Bild- und Farbgestaltung, Komposition, Licht und Beleuchtung sowie den Umgang mit Ihrer Kamera und Bildbearbeitungssoftware. Lassen Sie sich von den beeindruckenden Fotos, kreativen Ideen und wertvollen Tipps und Techniken unserer Autorinnen und Autoren begeistern und erweitern Sie Ihr Wissen über die Kunst der Fotografie.Unsere NeuerscheinungenEntdecken Sie unser BuchprogrammFotoschulenFotografieren lernenFotografieren heißt: Sehen lernen, sich inspirieren lassen, Technik kreativ nutzen und immer wieder am eigenen Stil arbeiten. Unsere Fotoschulen helfen Ihnen dabei, ganz gleich, welcher Lerntyp Sie sind oder wie viel oder wenig Vorwissen Sie mitbringen.zu den Büchern NaturfotografieDie Natur entdeckenTiere, Pflanzen, Makro, Landschaften oder Wetter – Naturerlebnisse in Bilder zu fassen kann so dankbar wie herausfordernd sein. Unsere Bücher vermitteln Ihnen von den Grundlagen bis zu kreativen Techniken alles Wichtige, damit Ihnen im richtigen Moment und beim besten Licht großartige Bilder gelingen.zu den Büchern PorträtsMenschen fotografierenPorträts zu fotografieren gilt zurecht als anspruchsvolle Disziplin. Mit unseren Büchern lernen Sie, das passende Licht zu setzen, die richtige Pose zu wählen und für eine Atmosphäre sorgen, in der Ihr Model sich wohlfühlt. Unsere Autor:innen vermitteln Ihnen das handwerkliche Wissen und die kommunikativen Skills, um Ihr Model von seiner besten oder interessantesten Seite zeigen zu können (und das nicht nur, wenn Sie Menschen fotografieren).zu den Büchern Kameras und TechnikDie Kamera im GriffAls dpunkt-Leser:in wissen Sie: gute Bilder entstehen im Kopf. Doch erst der gezielte Einsatz von Kamera und Licht führt zu dem Foto, das Ihnen beim Anblick Ihres Motivs vorschwebt. Unsere Bücher helfen Ihnen, Ihre Kamera intuitiv zu nutzen und exakt mit Tages- oder Blitzlicht zu arbeiten – so dass Sie den Kopf frei haben für die Bilder, die Sie vor sich sehen.zu den Büchern BildbearbeitungLightroom, Photoshop, Luminar und Co.Ob »bloße« RAW-Entwicklung oder ausführliche Retuschen und Montagen: mit unseren Büchern vollenden Sie in der Bildbearbeitung, was Sie im Moment der Aufnahme begonnen haben. Sie lernen, Aufbau und Arbeitsweise von Programmen wie Lightroom, Photoshop, Luminar, Capture One Pro und Darktable zu verstehen und ihre Funktionen effizient und kreativ einzusetzen.zu den Büchern FotoscoutsFotografische WeltreiseUnsere Fotoscouts beantworten die drei wichtigsten Fragen jeder Fotoreise: welche Motive vor Ort sollten Sie fotografieren, zu welcher Tageszeit, und wie kommen Sie dort hin? Unsere Autor:innen kennen die Gegebenheiten vor Ort genau und stellen Ihnen die besten Fotospots – bekannte und unbekannte – zusammen. QR-Codes helfen Ihnen, effizient mit Google Maps zu navigieren, zusätzliche Workshops schließen Wissenslücken, wenn für das eine oder andere Bild besondere Techniken notwendig sind.zu den FotoscoutsAusgezeichnete Bücher von dpunkt Unsere aktuellen BestsellerNeugierig?Werfen Sie einen Blick in unsere Fotografie-Vorschau für die kommenden MonateVorschau"
