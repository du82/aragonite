title = "Agile Leadership Fachbücher & E-Books • dpunkt.verlag"
description = "Braucht Selbstorganisation Führung? Agiles Arbeiten verändert nicht nur die Struktur in den einzelnen Teams und die Arbeitsweise im Unternehmen, sondern stellt auch ganz neue Anforderungen an das Führen. Selbstorganisierte Teams brauchen das richtige Umfeld, um sich zu entwickeln und erfolgreich zu arbeiten. Auch selbstorganisierte Unternehmen kommen nicht ohne eine verbindende Struktur aus. Die Virtualisierung der Teamarbeit in den vergangenen Monaten auf Grund der Pandemie und der Einsatz neuer Kooperationstools stellt Führung ebenfalls vor neue Herausforderungen. Daraus ergeben sich Fragen: Welche Form der Führung brauchen agile Teams und Unternehmen? Und wie kann diese so umgesetzt werden, dass sie Selbstorganisation fördert? Unsere Fachbücher und E-Books zum Thema Agile Leadership bieten praxisorientierte Antworten auf diese Fragen und vermitteln Skills und Methoden, mit denen Führungskräfte das angestrebte agile Umfeld schaffen können.Agile Transformation: Von 0 auf agil Ein Team oder gar eine ganze Organisation werden nicht von heute auf morgen agil. Es gibt keine Abkürzung oder ein Patentrezept. Letztlich führen viele kleine Schritte zum Ziel. Unsere Autorinnen und Autoren beschreiben mit vielen Fallbeispielen, wie sich eine solche Transformation vorbereiten und durchführen lässt. Sie geben Ihnen praktische Anleitungen für alle Aspekte einer agilen Transition an die Hand."
