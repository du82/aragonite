["https://draculatheme.com/contribute"]
title = "Contribute • Dracula Theme"
description = "Dracula is a color scheme for code editors and terminal emulators such as Vim, Notepad++, iTerm, VSCode, Terminal.app, ZSH, and much more."
full_description = '''Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed. ReadmeDracula Theme is an open-source project driven by and for the community. Most apps that support the theme are contributions from our community.As much as the team is responsible for the core theme and wants to support all available applications, we simply don't have the capacity to do it all ourselves.That's why the community is essential for this project to keep evolving. Below are some guidelines, tips, and specifications for those who want to apply the theme to any application.How do I submit a new theme?1Create a new repository based onthis template.You can do it by cloning the repository or just clicking on "Use this template."2Build the theme using theColor Palette below.Edit the template info and upload the file with the theme configs to the repository.3Finally, submit an issuewith a link to your repository.We will move the repo under the Dracula org and give you permissions to maintain it.Color PaletteHexRGBHSLAnsi16Ansi256PaletteCopyColorBackground#282A36Current Line#44475AForeground#F8F8F2Comment#6272A4Cyan#8BE9FDGreen#50FA7BOrange#FFB86CPink#FF79C6Purple#BD93F9Red#FF5555Yellow#F1FA8CFor more details about how to apply these different colors to represent different code symbols, please see the Dracula Specification.Join over 691 contributorsWhether you're maintaining a port, contributing via a pull request, or reporting an issue, the community is the heart and soul of the Dracula Theme.Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed.'''
