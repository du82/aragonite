["https://draculatheme.com/pro"]
title = "Dracula PRO - Be more productive • Dracula Theme"
description = "Dracula PRO is a color scheme and UI theme tailored for programming.Made for terminal emulators, code editors, and syntax highlighters.Designed to be aesthetically pleasing while keeping you focused."
full_description = "Dracula PRO is a color scheme and UI theme tailored for programming.Made for terminal emulators, code editors, and syntax highlighters.Designed to be aesthetically pleasing while keeping you focused. Available EverywhereDracula PRO is built for your favorite apps.Select and see the variants in the appsProBladeBuffyLincolnMorbiusVan HelsingAlucardNew! Why Dracula PROIn 2013, Zeno Rocha's laptop was stolen, forcing him to reconfigure everything. Thousands of themes were out there then, but none appealed to him. So, he decided to create his own.Fast forward to 2020, Dracula is one of the most popular themes in the world. Still, something needed to be added. Zeno would like to help with more than just a theme, so he created Dracula PRO.This package is designed for developers who want to invest in their productivity. The Official Light ThemeFor years, we resisted the idea of a light theme for Dracula. However, we recognize its importance for accessibility and use in bright environments.That's why we created Alucard, a light variant that seamlessly integrates with Dracula PRO. It meets WCAG AA contrast standards, ensuring legibility and inclusivity. Unlike anything you've used beforeCarefully designed down to the last pixel and engineered for relentless precision.Geometric Color PaletteIsaac Newton was one of the first to organize colors geometrically.In 1704, He observed the relationships between different wavelengths of light and arranged them as a Hue circle, identifying different patterns that emerged from this representation. This would become the basis of modern color theory.Dracula's original colors, created in 2013, were based on personal taste. This new PRO version brings a more refined and mathematical approach that normalizes luminosity and saturation.Easy on the EyesDark mode is everywhere, and there's a reason for that. There are many reasons to love it, from improved battery consumption to better visibility in low-light environments.Less Context SwitchHaving the same color scheme across multiple apps reduces the time it takes to switch contexts between tasks. That's why Dracula PRO is available on as many platforms as possible.Precise ContrastBattle-tested with WCAG 2.0 Level AA Specifications, with a Contrast Ratio of at least 4.5:1 for standard text, thus providing the best readability.Hand-picked TypographyWe have carefully selected four monospaced programming fonts that fit perfectly into Dracula PRO.These fonts have built-in ligature support that improves readability. By displaying a shorter glyph instead of 2 or sometimes 3, the human brain spends less energy scanning, analysing and joining multiple characters into one.Don't like ligatures? No problem; you can still use these fonts."
