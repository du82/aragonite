["https://draculatheme.com/blog/11-new-themes-and-updates-for-dracula-pro"]
title = "11 New Themes And Updates For Dracula PRO • Dracula Theme"
description = "Life has been crazy over here, but Dracula continues to evolve and grow."
full_description = "Zeno Rocha|March 2, 202311 New Themes And Updates For Dracula PROI'm writing from San Francisco, California, the place I call home now. Life has been crazy over here, but Dracula continues to evolve and grow. I still can't believe we crossed 300 themes just recently and we're already at 318 themes. This community is the best 💜 ✨ New on Dracula Say hello to 11 new themes that recently joined the clan: aerc: an email client that runs in your terminal; Cli-Visualizer: a command-line visualizer for music; Jabref: an open-source citation and reference management software; Libreddit: an alternative private front-end to Reddit; Makehuman: an open-source tool for creating 3D characters; Misskey: a decentralized social media platform; Newsboat: an RSS/Atom feed reader for the text console; Replugged: a Discord client focused on simplicity and performance; Todoist: a task manager and to-do list app; Uptime Kuma: a self-hosted monitoring tool; Yakuake: a terminal emulator based on the KDE console. 🦇 New on Dracula PRO Our users have long requested Dracula PRO support for Visual Studio, and it is finally here with all variants and as close as possible to its VSCode counterpart. 📰 We also created an RSS Feed for the Changelog; ✅ Adjusted the Background and Selection Color in Notepad++, which were overlapping and not giving the necessary highlight; 🎯 And made a minor tweak to the Sublime Text instructions. 👋🏻 The end Q: Why doesn’t anybody like Dracula? A: Because he has a bat temper. Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed."
