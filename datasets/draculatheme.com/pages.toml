title = "2021 Year in Review • Dracula Theme"
description = "Transparency is a major value for me, so I thought it would be a good idea to gather some interesting numbers about Dracula in 2021."
full_description = "Zeno Rocha|January 3, 20222021 Year in ReviewTransparency is a major value for me, so I thought it would be nice to gather some interesting numbers about Dracula in 2021. High Level Open Source We started the year with 144 themes, and now there are 232 themes! That's 88 new themes in only one year. I'm beyond grateful for this amazing community that keeps building awesome stuff consistently. Website This website is a crucial piece of the entire project. It's where people can read instructions on how to install a theme and also discover new themes. In 2020, 684,155 people visited the website, which generated a total of 1,975,525 pageviews. In 2021, there were 771,936 people visiting the website, generating a total of 2,504,245 pageviews. That's a 12% growth in visitors and 26% growth in pageviews. Revenue To keep this whole engine running, I started to monetize this project. In 2020, it generated $87,683.81 in revenue. In 2021, it generated $134,217.46. That's a 53% increase - more details below. Revenue Dracula PRO was launched on February 11th, 2020, and made $87,683.81 from 1,656 users in its first year. In 2021, it made $114,008.47 from 2,019 users which is mind-blowing. Dracula UI was launched on April 12th, 2021, and made $20,208.99 in revenue. That brings us to $221,901.27 all time revenue across these two projects. Most Viewed These are the most popular themes from 2021 in terms of website views. Code Editors Notepad++: 110,597 views Visual Studio Code: 54,465 views Vim: 49,978 views Terminal Gnome Terminal: 63,734 views Zsh: 58,154 views iTerm: 54,737 views Browsers Chrome: 34,475 views Firefox: 16,962 views Qutebrowser: 2,155 views Visitors And here are some interesting numbers related to the website visitors. Country United States: 137,124 visitors Brazil: 129,088 visitors India: 45,710 visitors Germany: 26,412 visitors United Kingdom: 23,846 visitors Desktop Operating System Windows: 355,372 visitors Macintosh: 172,321 visitors Linux: 145,307 visitors Mobile Operating System Android: 53,130 visitors iOS: 46,244 visitors As with any public report, it's always best not to compare yourself. These numbers took a long time to build, and I hope they can serve as an inspiration for you to create and monetize your open source projects."
author = "Dracula Team"
year_published = 2022
