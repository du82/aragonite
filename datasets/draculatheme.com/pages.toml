full_description = "Zeno Rocha|January 14, 202032 New Dracula Themes For 2020Before I start working like crazy on Dracula PRO, I decided to spend my entire weekend doing some housekeeping on the original Dracula project. The result? Last week there were 53 themes on the site, now there are 85 themes! To make your life easier, here's a compilation of them. Code Editors Arduino IDE CotEditor Editplus GameMaker Studio Geany Wing Notes & Messaging Bear Facebook Messenger LimeChat Mattermost Telegram Android Typora Terminal & Shell Alacritty CMDer Fish Fluent Terminal Gnome Terminal Kitty MobaXterm Termite Termux Windows Terminal Miscellaneous Blender Couscous DuckDuckGo i3 jGrasp Oracle SQL Developer Steam uLauncher Vimium Wordpress Now that the Dracula project is in order, I'll put my heads down to work on Dracula PRO. It's not going to be easy and I'll definitely need your help, so let's stay in touch ;) Talk to you soon! Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed."
