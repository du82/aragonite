full_description = '''Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed. Dracula PRO 2.0 - Our First Light Theme!We're excited to announce the launch of Alucard, the official Dracula light theme & Dracula PRO 2.0Get ready for Dracula Light ModeFor years, we heard the same question, "Are you going to create a light color scheme?" and the answer always was, "Nope. Dracula can't stand the light".Dracula 2023 WrappedThere's a lot to celebrate, but first, I just want to say thank you for making Dracula such a fantastic community to be a part of.Sunsetting Dracula UIWe decided to sunset Dracula UI to have more time for Dracula Theme, Dracula PRO, and some new projects in 2024.Black Friday And 7 New Dracula ThemesIf you have considered upgrading your setup, this is the perfect opportunity.Dracula-o-ween 2023!Is it the spookiest time of the year already? Time truly has wings!Celebrating 10 years of DraculaThis month marks a significant milestone for us — the 10th anniversary of Dracula. What started as one theme for one application, has now become a global movement.13 new themes, email updates, and PRO newsIt's been a while since I don't send these Dracula updates, right? The main reason is that I've been building a new email platform - Resend].Dracula AI, 10 New Themes And Emacs For PROWe couldn't help ourselves, so we introduced 🤖 Dracula AI (on April 1st)!11 New Themes And Updates For Dracula PROLife has been crazy over here, but Dracula continues to evolve and grow.AWS, New Wallpapers And Five New ThemesA couple of days ago, I was configuring some stuff on AWS and noticed that they are using Dracula!Celebrating 300 Themes With The New Winter DropToday we officially crossed 300 Dracula themes! When I started this project back in 2013 with a single commit.Black Friday And 12 New Dracula ThemesDracula PRO is now 40% off! If you are thinking about getting PRO or giving it to a friend, now is the time.Dracula UI Is Now Free And Open SourceWhen Dracula UI was first released, it was a paid product hosted on GitHub as a private repository and a private package.Dracula For CodeSandbox And 9 New ThemesI don't know about you, but I always struggle to find a good syntax highlighter library for showing code on a page.Dracula On CodePen And Open StartupI've always admired this concept of 'open startup' in which people gather all their private metrics and make them public.Interview with Lucas - the new Dracula team memberToday, I'm excited to introduce you to Lucas. He has joined Dracula to help in our mission to create the best theme for developers in the world.Dracula Livestream And 3 New ThemesThe fine folks from Microsoft invited me to talk about how to build your own VS Code theme.Dracula Stickers, StackOverflow and 5 new themesThese past few days have been difficult. I hope you and your family are safe!Dracula On Twitter And 7 New ThemesI joined Twitter in March 2009 (yes, I'm that old), and it has been my favorite place to stay up to date with the tech community since then.Dracula Shop Is Here!There are 12 custom-designed items over there, such as t-shirts, stickers, hoodies, pins, pullovers, hats, and even baby clothing.Dracula On GitHub.com And Some Behind-The-ScenesI got a LOT of responses about doing Dracula merch, so I started ordering some samples to learn more about how can I make the absolute best products.Dracula T-Shirt... A? B? Or C?I'm starting to play around with the idea of having Dracula merch! Now I need your help deciding which designs look better.2021 Year in ReviewTransparency is a major value for me, so I thought it would be a good idea to gather some interesting numbers about Dracula in 2021.Why Is Dracula So Popular?Two weeks ago, Dracula showed up on the front page of Hacker News. The thread had 227 comments, but one comment caught my attention.Keycaps V2 And 4 New ThemesFor those of you who are into mechanical keyboards, today is the last day to get the Dracula GMK Keycaps v2.Bl3ck Fr1d3y And 5 New ThemesDracula PRO and Dracula UI are 40% off. I'm running this Black Friday deal as a way of saying thank you.Dracula Keycaps And 6 New ThemesAfter two years of waiting, the GMK Dracula keycaps finally arrived. If you're into mechanical keyboards, you're going to love this.Little Vampire And 7 New ThemesFor the next few weeks, I'll be out on paternity leave. This means that I'll be slow to respond to emails, Discord messages, and GitHub issues.200 Themes!When I started this project 8 years ago, I never thought it could become so big. I'm beyond grateful for this fantastic developer community.Dracula Community And 6 New ThemesAfter dozens of responses, it's clear that Discord is where the cool kids hang out nowadays, so here it is!Quick Question... Slack Or Discord?I've been thinking about creating a Dracula Community for a long time. But I want to make sure we pick the best platform, that's why I need your help.Dracula On Super Nintendo, Tailwind, And LaTeXI've been working on some really exciting new projects!3D, Physical Book, And 4 New ThemesLast year I wrote an e-book called 14 Habits of Highly Productive Developers. I made this specifically for Dracula PRO.Making a Physical BookI can't believe this is real... My book is now available in hardcover. Building this physical copy has been a really intense process.Audiobook, Insomnia, And 7 New ThemesThe last two weeks have been really busy. I decided to create this page to show Dracula PRO's journey.How I Made $101,578.04 Selling Colors OnlineToday is a special day. Dracula PRO has hit 100K in sales, which is absolutely insane. When I started this thing I never thought this would happen.14 Best Free Fonts for ProgrammingWe spend the entire day using code editors, terminal emulators, and other developer tools. Using a font that feels comfortable to your eyes can make a huge difference and improve your productivity.The Most Popular Dracula Themes in 20202021 is here and its first month is almost over. Still, I decided to take a step back and look at all the data from 2020.Purchasing Parity Power + 4 New ThemesI'm super happy to announce Purchasing Parity Power on Dracula PRO! Why? Because not everyone earns in dollars.GitHub Dark, Big Sur Icons, And 5 New ThemesHere it is... The moment we've all been waiting for - GitHub finally has a Dark Mode! You can enable it in your settings. I know, it's not a Dracula color palette, but it's better than nothing :PIt's Halloween!I'm getting ready for a big announcement next week, but before we talk about that, I want to share a ton of new themes with you.2020 Halloween Costume ContestHalloween is almost here and this year I want to do something different... Introducing the 2020 Halloween Costume Contest!Dark Mode Everywhere And 11 New ThemesI love dark mode and I've been experimenting with different setups lately. One of my favorite tools so far is Night Eye.Dracula UI - Week 3It's been almost two weeks since we last shared an update with you. We have missed you and your feedback.Dracula UI - Week 1Our team of 3 (Netto, Zeno, and Cookie) has been hard at work building what we believe will be the best dark-first collection of UI components and patterns.Dracula UI - Web Or React Native?Most templates are built using light colors and later on adapted to dark colors. The process of building a dark theme shouldn't be an afterthought - it should be a top priority. That's why I decided to invest time in this.6 New Themes And 20 Desktop IconsDo you know Swift, PHP, Ruby, Java, Typescript, Go, or C? I'm trying to standardize all the Dracula screenshots using the same code snippet structure.Free Wallpapers And New Dracula PRO PriceOn February 11th, Dracula PRO was being launched. Today, exactly six months later, more than 1,143 copies have been sold. What started as a simple side project, became something much bigger.3 New Themes And Better Code ScreenshotsLast time we saw each other I was telling you all about this new book I wrote. The launch was amazing, it reachedMake Music With DraculaI'm getting ready for a big announcement next week, but before we talk about that, I want to share a ton of new themes with you.Dracula 100 ThemesToday is a special day. We have hit 100 themes on Dracula! When I started this little project, I never imagined the community would embrace it the way it did. Thank you so much for everyone involved in this.Dracula PRO WallpaperOhhh there is so much exciting news to share that I don't even know where to being. Let's get right to it...Dracula On Reddit + Discourse And Javadoc ThemesIt's been 7 weeks since the launch of Dracula PRO and I've been sharing some of the lessons learned. I'm not a big Reddit user, but I decided to publish there and it went semi-viral.New Dracula Site And LogoThe Dracula site and logo were the same since 2013. I've always wanted to give it a refresh, but I was never able to prioritize it.Podcast About Dracula And Better Windows SupportIt's been a crazy couple of weeks. I have to admit I'm a little bit overwhelmed with all that's happening in the world but, hey, the show must go on.Dracula For Figma, Sketch, And AdobeI'm not a designer, but I'm always amazed by the kind of work these people do. Their ability to create entire screens out of a blank canvas is just incredible.$7,128.57 In Sales In 7 DaysIf you have been following me on Twitter, I'm sharing some lessons learned since the Dracula PRO launch. The response from the community has been insane!Dracula PRO Is Here!The wait is over... Dracula PRO is live! This is a very special moment for me. It's been almost 7 years since I launched Dracula, and I'm super excited about this next step.A Quick Spoiler...I have some exciting news to share! Dracula PRO will be launched in 3 days on February 11th. It's been quite a ride to get here. I've been studying colors like never before.A Vampire Needs Your Help...For the past few weeks, I've been working non-stop to make sure that Dracula, the open source project, is well organized and with fewer issues as possible. We even crossed the number of 90 themes, which is totally insane!32 New Dracula Themes For 2020Before I start working like crazy on Dracula PRO, I decided to spend my entire weekend doing some housekeeping on the original Dracula project.Top Dracula Themes In 2019I thought it would be a good idea to gather the most popular Dracula themes from 2019, in case you missed, so here it is.A new theme is comingIn 2013, I decided to create a theme. At that time there were hundreds of thousands of color schemes out there, but none of them were appealing to me. So I decided to create my own.Join the dark sideBe the first to know about new products, special releases, and much more.Subscribe7,449 people enjoy it!Subscribe to the RSS Feed.'''
