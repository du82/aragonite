["https://draft.blogger.com/go/buzz"]
title = "Official Blogger Blog"
description = "The latest tips and news from the Blogger team"
full_description = '''<div dir="ltr" style="text-align: left;" trbidi="on"> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"></span><br /> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">Since 1999, millions of people have expressed themselves on Blogger. From detailed posts about almost every </span><a href="https://adamapples.blogspot.com/" style="text-decoration-line: none;"><span style="color: #1155cc; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">apple variety</span></a><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"> you could ever imagine to a blog dedicated to </span><a href="https://howtoblog.krishnainfotron.com/" style="text-decoration-line: none;"><span style="color: #1155cc; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">the art of blogging</span></a><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"> itself, the ability to easily share, publish and express oneself on the web is at the core of Blogger&#8217;s mission. As the web constantly evolves, we want to ensure anyone using Blogger has an easy and intuitive experience publishing their content to the web.</span><span style="font-family: arial; font-size: 11pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">&nbsp;&nbsp;</span></span></div> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">That&#8217;s why we&#8217;ve been slowly introducing an improved web experience for Blogger. Give the fresh interface a spin by clicking &#8220;Try the New Blogger&#8221; in the left-hand navigation pane.&nbsp;</span></div><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><span style="border: none; display: inline-block; overflow: hidden;"><img src="https://lh5.googleusercontent.com/kWHfhyDmS0K6WMbTlfDV8Hq9RKq7Cs2sbPVl0otK3zDV5jNDO0SxM5-Ot89Wo3E11QvmNMI7VYMimqP-Vg9li-cz0cimWiGpJM65-uOSCmAvSN5n7M-lGcNWNW2u0cAfA54ZsGhZ" style="margin-left: 0px; margin-top: 0px;" width="508" /></span></span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="color: red; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 9pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">&nbsp;</span><span style="font-family: arial; font-size: 9pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">Click the &#8220;Try the New Blogger&#8221; button to see Blogger&#8217;s refreshed look and feel.</span></div> <br /><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">In addition to a fresh feel, Blogger is now responsive on the web, making it easier to use on mobile devices. By investing in an improved web platform, it allows the potential for new features in the future.&nbsp;</span></div><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><span style="border: none; display: inline-block; height: 299px; overflow: hidden; width: 146px;"><img height="299" src="https://lh4.googleusercontent.com/B-Tx1tl3m3_sH_4HiCg0XxhlTka0IV82jwT2LT4T9kzbXF15nMxjwNGe3NUAz-F42irNGdDINUiw4DM---nX_87Bb0X3OL_s5L19Rlyfhtm6oyEMNR1R4473TzkgsuxWQ3HXOIOV" style="margin-left: 0px; margin-top: 0px;" width="146" /></span></span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 8pt; vertical-align: baseline; white-space: pre-wrap;"><span style="font-size: x-small;"><font size="2">Blogger&#8217;s new responsive design makes it easy to manage your blog on-the-go.</font></span></span></div> <br /><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">Learn more about the page-specific updates we&#8217;ve released to make your Blogger experience even better:&nbsp;</span></div> <br /><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Stats</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">The redesigned Stats page helps you focus on the most important data from your blog by highlighting your most recent post.&nbsp;&nbsp;&nbsp;&nbsp;</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Comments</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">A fresh Comments page helps you connect with readers more easily by surfacing areas that need your attention, like comment moderation.&nbsp;&nbsp;</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Posts</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">We&#8217;ve improved support for </span><a href="https://support.google.com/blogger/answer/9675453?hl=en" style="text-decoration-line: none;"><span style="color: #1155cc; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">Search Operators</span></a><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"> on the Posts page to help you filter your Blogger posts and page search results more easily.&nbsp;</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Editor</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">The newly enhanced Editor page introduces table support, enables better transliteration, and includes an improved image/video upload experience.&nbsp;</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Reading List&nbsp;</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">Even if you don&#8217;t create from your phone, it&#8217;s now easier than ever to read blogs from other creators while you&#8217;re on the go.</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; font-weight: 700; vertical-align: baseline; white-space: pre-wrap;">Settings&nbsp;</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">We&#8217;ve streamlined the Settings page to help you manage all your controls from one place.&nbsp;&nbsp;</span></div> <br /><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">We&#8217;ll be moving everyone to the new interface over the coming months. Starting in late June, many Blogger creators will see the new interface become their default, though they can revert to the old interface by clicking &#8220;Revert to legacy Blogger&#8221; in the left-hand navigation. By late July, creators will no longer be able to revert to the legacy Blogger interface.&nbsp;&nbsp;</span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">We recommend getting ahead of the transition by opting into the experience today. Be sure to let us know what you think about the new design by tapping the Help icon in the top navigation bar. We can&#8217;t wait to see how Blogger creators use the latest updates to share their voice with the world.</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><i><br /></i></span></div><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><i>Posted by Fontaine on behalf of the Blogger team</i></span></div> <div> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div> </span></div> <span itemprop='author' itemscope='itemscope' itemtype='http://schema.org/Person'> <meta content='https://plus.google.com/116899029375914044550' itemprop='url'/> </span> <div dir="ltr" style="text-align: left;" trbidi="on"> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"></span><br /> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">Since 1999, millions of people have expressed themselves on Blogger. From detailed posts about almost every </span><a href="https://adamapples.blogspot.com/" style="text-decoration-line: none;"><span style="color: #1155cc; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">apple variety</span></a><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"> you could ever imagine to a blog dedicated to </span><a href="https://howtoblog.krishnainfotron.com/" style="text-decoration-line: none;"><span style="color: #1155cc; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">the art of blogging</span></a><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"> itself, the ability to easily share, publish and express oneself on the web is at the core of Blogger&#8217;s mission. As the web constantly evolves, we want to ensure anyone using Blogger has an easy and intuitive experience publishing their content to the web.</span><span style="font-family: arial; font-size: 11pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">&nbsp;&nbsp;</span></span></div> <span id="docs-internal-guid-83e698cd-7fff-3537-1fd4-931000cddafb"><br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">That&#8217;s why we&#8217;ve been slowly introducing an improved web experience for Blogger. Give the fresh interface a spin by clicking &#8220;Try the New Blogger&#8221; in the left-hand navigation pane.&nbsp;</span></div><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;"><span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><br /></span></div> <br /><div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;"><span style="border: none; display: inline-block; overflow: hidden;"><img src="https://lh5.googleusercontent.com/kWHfhyDmS0K6WMbTlfDV8Hq9RKq7Cs2sbPVl0otK3zDV5jNDO0SxM5-Ot89Wo3E11QvmNMI7VYMimqP-Vg9li-cz0cimWiGpJM65-uOSCmAvSN5n7M-lGcNWNW2u0cAfA54ZsGhZ" style="margin-left: 0px; margin-top: 0px;" width="508" /></span></span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="color: red; font-family: arial; font-size: 11pt; vertical-align: baseline; white-space: pre-wrap;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></div> <div dir="ltr" style="line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt; text-align: center;"> <span style="font-family: arial; font-size: 9pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">&nbsp;</span><span style="font-family: arial; font-size: 9pt; font-style: italic; vertical-align: baseline; white-space: pre-wrap;">Click the &#8220;Try the New Blogger&#8221; button to see Blogger&#8217;s refreshed look and feel.</span></div> <br /><br /><div dir="ltr" style="line-height'''
