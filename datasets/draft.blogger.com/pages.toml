["https://draft.blogger.com/go/contentpolicy"]
title = "Content Policy"
full_description = "Blogger is a service for self-expression and communication. We believe Blogger increases the availability of information, encourages healthy debate, and makes possible new connections between people. It is our belief that censoring this content is contrary to a service that bases itself on freedom of expression. However, in order to uphold these values, we need to curb abuses that threaten our ability to provide this service and the freedom of expression it encourages. As a result, there are some boundaries on the type of content that can be hosted with Blogger. The boundaries we've defined are those that both comply with legal requirements and that serve to enhance the service as a whole. We rely on blog readers to report content that they find inconsistent with Blogger's Community Guidelines. If you encounter a post that you believe violates Community Guidelines, please report it using the 'Report' link located in the navigation of most blogs. If you are unable to find the link on the blog, you can still report suspected violations here. Our community guidelines play an important role in keeping the open web a welcoming place to create. Please respect these guidelines. We may update our policies from time to time, so please check back here. Note that when applying the policies below, we may make exceptions based on artistic, educational, documentary, or scientific considerations or where there are other substantial benefits to the public from not taking action on the content. We do allow adult content on Blogger, including images or videos that contain nudity or sexual activity. If your blog contains adult content, please mark it as 'adult' in your Blogger settings. We may also mark blogs with adult content where the owners have not. All blogs marked as 'adult' will be placed behind an 'adult content' warning interstitial. If your blog has a warning interstitial, please do not attempt to circumvent or disable the interstitial - it is for everyone’s protection. Do not create, upload, or distribute content that exploits or abuses children. This includes all child sexual abuse materials. To report content on a Google product that may exploit a child, click Report abuse. If you find content elsewhere on the internet, please contact the appropriate agency in your country directly."
year_published = 2025
clearnet = "https://draft.blogger.com/go/contentpolicy"
tags = []
language = "en"
internal-references = ["none"]
external-references = ["accounts.google.com", "blogger.googleblog.com", "buzz.blogger.com", "google.com", "safebrowsing.google.com", "support.google.com"]

["https://draft.blogger.com/go/devapi"]
title = "Introduction  |  Blogger  |  Google for Developers"
description = "Get an overview and get started links for the API that enables client applications to view and update Blogger content."
full_description = "Home Products Blogger Introduction Stay organized with collections Save and categorize content based on your preferences. The Blogger API v3 allows client applications to view and update Blogger content. Your client application can use Blogger API v3 to create new blog posts, edit or delete existing posts, and query for posts that match particular criteria. Here are some of the things you can do with the Blogger API v3: Add a running list of blog posts, pages and comments to a non-Blogger hosted site. Create browser based applications and mobile apps that enable people to create and manage their posts from where ever they are. Create a desktop application or plugin that allows users to create and edit posts from the desktop. How do I start? If you're new to the Blogger API v3, here's how we recommend you get started: Read about getting started with Blogger API v3. Read through using the Blogger API v3. Refer to the Reference Guide as needed."
year_published = 2025
