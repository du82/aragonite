["https://drafts.csswg.org/CONTRIBUTING"]
title = ""
full_description = "Contributions to this repository are intended to become part of Recommendation-track documents governed by the: To make substantive contributions to specifications, you must either participate in the relevant W3C Working Group or make a non-member patent licensing commitment. Issues are where individual reports and Working Group discussions come together such that the eventual consensus can be turned into official specification language. If you are familiar with a GitHub-based pull request contribution workflow, please note that most issues are subject to quite a bit of discussion before they are ready for a pull request with specific wording changes. Please ensure the full problem space of the issue is explored in the discussion, and that consensus has been reached by the participants, before drafting a pull request. The CSS Working Group operates via the consensus of its membership, and discusses all significant matters prior to implementation. The Editors responsible for a particular spec are responsible for triaging their issues on a regular basis; however note that sometimes this can take awhile (anywhere from a few days to a few years) depending on the complexity of the issue and the work schedules of people involved ― this does not mean we are ignoring the issue. When issues need WG discussion or approval, WG members should label the issue 'Agenda+' to bring it to the Working Group's attention. Unfortunately, GitHub doesn't allow labelling permissions without repository write permissions, so if you believe an issue is urgent or discussion has stalled for awhile and the WG's attention is needed to move forward, ask one of the Editors to flag it. In general, you should not directly commit changes to a draft unless you are an Editor of that draft, or have their explicit permission. If you are not an Editor of a draft, but wish to contribute changes, the best practice is to either work directly with an Editor to review proposed text, or file your proposal as a pull request (PR) originating from your own fork. Substantive changes need WG consensus, not merely Editor agreement; typographic error and markup fixes are generally okay to commit, but any substantive changes should have clear WG consensus. Substantial changes or additions to non-normative text should still have clear Editor approval."
year_published = 2025
clearnet = "https://drafts.csswg.org/CONTRIBUTING"
tags = ["and/or", "contributions", "contributor", "disclosure", "discussion", "further", "guidelines", "information", "issue", "issues"]
language = "en"
internal-references = ["none"]
external-references = ["chrisrebert.com", "dbaron.org", "fantasai.inkedblade.net", "florian.rivoal.net", "github.com", "help.github.com", "lea.verou.me", "lists.w3.org", "rachelandrew.co.uk", "speced.github.io", "w3.org", "wiki.csswg.org"]

