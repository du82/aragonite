full_description = "Looking for information of Dragos Forums? Click here. DISC 2025 November 5-6 | Hanover, Maryland, USA Mark your calendar for November 5-6, 2025, for the next Dragos Industrial Security Conference (DISC). This exclusive and free event for practitioners will be 100% live and in-person in Hanover, MD, USA. Due to the sensitivity of information shared, the exclusive content presented will not be publicly available afterward. At DISC 2025, you’ll network with your peers and hear the latest on ICS/OT threats, malware, incidents, and vulnerabilities conducted by our intelligence and threat operations teams. The program is technical, research-oriented, and focuses on: Current and emerging cyber threats targeting industrial infrastructure in a closed-door atmosphere Latest in ICS/ OT security controls, assessment methodologies, and best practices Recently identified ICS vulnerabilities and adversary exploits Technical, practitioner, and case-study focused view of ICS/OT threat operations Insights into incident response cases and lessons learned from the field Register Your Interest Register your interest by submitting your information on the form below. Approved registrants will be notified with additional instructions by email. 100% Live and In-Person DISC is 100% live and in-person at Live! Casino & Hotel Maryland in Hanover, MD. This hotel and venue is located close a few minutes from BWI airport and features great dining, entertainment, and four diamond accommodations. Due to the sensitivity of information shared, the exclusive content presented will not be publicly available afterward. Who Attends? This event is exclusively for industrial infrastructure asset owners or operators in electric, oil & gas, chemicals, food & beverage, government, pharmaceutical, building automation, manufacturing, mining, transportation, water, and more. * This event is 100% free as a thank you to the ICS asset owner and operator community. Thank you for bringing a community together to provide solutions in an environment that requires more defenders. I had a blast, learned a ton, and will be back next year! - DISC attendee feedback"
