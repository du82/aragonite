full_description = "About Dragos Dragos is the Industrial Cybersecurity company on a relentless mission to safeguard civilization In a world of rising cybersecurity threats, Dragos protects the most critical infrastructure — those that provide us with the tenets of modern civilization — from increasingly capable adversaries who wish to do it harm. Devoted to codifying and sharing our in-depth industry knowledge of OT systems, Dragos arms industrial defenders around the world with the knowledge and tools to protect their systems as effectively and efficiently as possible. We're Your Ally Against Industrial Cyber Threats Discover how Dragos is leading the way in enhancing visibility into OT assets, identifying vulnerabilities, and fostering community resilience through initiatives like Neighborhood Keeper. Why Dragos Safeguarding civilization has been our mission since day one. Dragos was founded by experts trusted by the US government and ally nations to investigate and respond to the most significant ICS cyberattacks in history. Our experience speaks for itself. 2015 Investigated and analyzed the first successful cyberattack on a power grid in Ukraine 2016 Analyzed the CRASHOVERRIDE malware responsible for the Ukraine electric grid attack. 2016 Dragos was founded; Dragos Platform, Threat Intelligence, and Professional Services launched 2017 Analyzed the TRISIS malware responsible for the petrochemical facility attack in the Middle East 2018January Dragos ICS training launches based on knowledge gaps seen in the community 2018March Dragos CEO and Founder Robert M. Lee testifies before Congress on the security and resiliency of critical energy infrastructure in the U.S. 2018October Dragos launches Neighborhood Keeper, a global, collaborative threat intelligence sharing program 2019March Dragos Community Tools launches to provide access to free ICS/OT cybersecurity tools to those just starting their cybersecurity journeys 2020April OT Watch launches to fill the gap many organizations have in ICS/OT cybersecurity, reinforcing their defenses, and augmenting their resources Meet the team behind the technology Dragos’ founders have defeated global adversaries for the government and ally nations, now leading the world’s largest team of researchers, hunters, and defenders. Robert M. Lee Chief Executive Officer Right Arrow Jon Lavender Chief Technology Officer Right Arrow Justin Cavinee Chief Data Scientist Right Arrow Prepare for, respond to, and help thwart severe breaches in ICS environments with our other intelligence and professional services. DRAGOS THREAT INTELLIGENCE Get actionable threat intelligence about Global ICS-specific threats through an annually-based subscription SEE HOW DRAGOS PROFESSIONAL SERVICES Proactive and responsive expert guidance to know what’s on your network and how to respond VIEW OFFERINGS We can’t safeguard civilization alone. Here are a few of our key partners who help fulfill our mission. VIEW FULL PARTNER LINEUP Cyber threats don’t wait. Neither should you. To help your mission of protecting your ICS infrastructure, select your most urgent ICS challenge to get started or contact us directly to get in touch with an expert. GET STARTED"
