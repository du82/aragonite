full_description = "Resources Dragos Cybersecurity Community Resources OT-CERT Community Defense Program Advisories Furthering our mission to help build a community to secure industrial control systems (ICS) and operational technology (OT) from cyber threats. Our Place in the OT Cybersecurity Community With Dragos, the industrial community comes first. To strengthen the collective defense, we offer resources to build your knowledge and make OT cybersecurity accessible and achievable for all—especially for those organizations with limited resources and who may find themselves overwhelmed by the idea of providing effective cybersecurity for their industrial assets. Our mission to safeguard civilization means helping to enable these organizations that provide critical services to defend their systems from potentially destructive industrial cyber attacks. Dragos OT-CERT Dragos OT-CERT is an Operational Technology – Cyber Emergency Readiness Team dedicated to addressing the OT resource gap that exists in industrial infrastructure. The gap is especially critical among small and medium-sized businesses that often have limited in-house cybersecurity expertise and lack the financial and technical resources to address ICS/OT cybersecurity risks. Members have free access to OT cybersecurity best practices, cybersecurity maturity assessments, training, workshops, tabletop exercises, webinars, and more. OT-CERT Community Defense Program The Dragos Community Defense Program gives US-based co-ops and utility providers with under $100M in annual revenue access to interworking Dragos products and services that provide a robust, multi-layered foundation for building and growing their OT cybersecurity programs, improving their security postures, and reducing OT risk. Community Defense Dragos Security Advisories Dragos Intelligence conducts hands-on research and testing of ICS/OT software, devices, and protocols to discover and address security vulnerabilities. Our team coordinates with original equipment manufacturers (OEMs) regarding disclosures for vulnerabilities discovered by Dragos, as well as cyber threats detected by the Dragos Platform targeted at the OEMs’ products. We offer a list of advisories to provide insight into the specific vulnerabilities reported. Advisories Quotation As a community-owned utility, we are responsible for the critical services of more than 100,000 customers and households. Building an industrial cybersecurity program to protect the infrastructure this entire community relies on can be challenging at times. With Dragos OT-CERT, we have been able to learn from others and share our experiences in an open and inviting forum. Brad Wynes Supervisor-OT Cybersecurity , City Utilities of Springfield Featured Insights View all tags Solution Brief Close tags Dragos Platform Frontline Perspective Industrial Cyber Risk Management Industrial Cybersecurity Manufacturing OT Cybersecurity Improving Industrial Operations and Productivity with Dragos Learn More View all tags Podcasts Close tags Control Loop Industrial Cyber Risk Management Industrial Cybersecurity Secure remote access Control Loop Podcast Episode 27: Unpacking cyber awareness syndrome. 06.14.23 Listen Now View all tags Whitepapers Close tags Industrial Cyber Risk Management OT Cyber Risk Risk Management Splunk Tomorrow’s SOC: How to Approach Risk Management and the IT-OT Divide Learn More Get Your Cybersecurity Challenges Under Control Wherever you are in your cybersecurity journey we’re here to help. Get Started"
