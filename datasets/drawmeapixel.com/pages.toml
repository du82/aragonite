["https://drawmeapixel.com/articles/meet-the-team-7-duy"]
title = "Meet The Team #7 – Duy :"
description = """
Meet The Team #7 – DuyPosted by Draw Me A Pixel on Nov. 16, 2023 IN Meet The Team, Studio
With Meet The Team, Draw Me A Pixel introduces you to the people behind its games. We promise, no one bites. At least not yet!
  
 
What is your job and can you describe your role within the team?
I’m a gameplay programmer. I implement gameplay features and systems. I also set up scenes and give tools to fine tune the game with the team. And the other part of my job is debugging and testing the game.
 
 
What was your background, before joining Draw Me A Pixel?
I graduated from physics studies but was always fond of creating 3D images and ended up in an animation studio. I was rather technical and generalist which led me to doing tech art and tools development, keeping in my spare time a little of game development. Then I got the chance to enter the gaming industry with Pastagames, Wild Sheep Studio and now Draw Me A Pixel!
 
 
What are the best and worst aspects of your job?
What I enjoy the most is doing lots of different tasks, working with art, animations, SFX and VFX, etc. to put everything together to make it play as intended by the team.
One of the hard parts is when you can’t find a satisfying solution, either by complexity, time or performance or whatever, there will always be a lot of compromises.
 
 
Which chapter from There Is No Game: Wrong Dimension is your favorite?
This is hard to tell, each chapter is full of surprises! I would say I chose the first chapter that hooked me into the game and gives the taste of what the game will be like. I add the credit chapter which was very fun with the music!
 
 
What are your favorite video games besides There Is No Game: Wrong Dimension?
I’ll start with Zelda: A Link to the Past which was one of my first games. I loved playing Final Fantasy games with my sisters, especially the ninth episode. Otherwise, the type of game I love is puzzle games like A Monster Expedition, Chants of Sennar and Outer Wilds. Then I’ll give another few classics that always come to my mind: FTL: Faster Than Light, Journey, Celeste, Hollow Knight, A Short Hike."""
