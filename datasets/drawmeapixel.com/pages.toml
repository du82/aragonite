title = "Meet The Team #8 – Léonard :"
description = """
Meet The Team #8 – LéonardPosted by Draw Me A Pixel on Nov. 08, 2024 IN Meet The Team, StudioWith Meet The Team, Draw Me A Pixel introduces you to the people behind its games. We promise, no one bites. At least not yet!
  
 
What is your job and can you describe your role within the team?
I'm Game Designer. My role is to think about and write gameplay ideas around a game concept and a story. I support Pascal in designing the gameplay, but I'm also there to supervise the different levels I'm working on, ensure the quality of the ‘game feel’ and work closely with the programmers. In short, to set up everything that can be set up so that the player loves using the game's systems.
 
 
What was your background, before joining Draw Me A Pixel?
I worked for two years as a Level Design tutor at a video game school. I had to learn to express myself well in order to share my knowledge with my students. I also spent a lot of time developing games on my own and worked for two years as a secondary school supervisor.
 
 
What are the best and worst aspects of your job?
The best aspects: The moments when a gameplay idea you've spent time thinking about is developed by the programmers and becomes playable. It's always a pleasure to try out an idea of your own that may have taken a long time to develop.The worst: moments of doubt, questioning and hesitation. This is a constant in the game design profession. You can be stuck for a long time finding the right idea.
 
 
Which chapter from There Is No Game: Wrong Dimension is your favorite?
I like a lot of the chapters, but my favourite is the ‘Zelda’ Legend of the Secret section. I think the idea of making a crazy point-and- click adventure game works really well. Especially the 2nd sequence with the Free-To-Play part made me laugh out loud. I also like the fact that it points out the economic systems that can be badly managed.
 
 
What are your favorite video games besides There Is No Game: Wrong Dimension?
My favourite game is Rayman Origins, because I'm a fan of platform games. This game has superb Art Direction, superb music, not to mention its excellent game feel. It's great fun to just move and jump in this game. Otherwise a little Street Fighter 2 is nice too."""
