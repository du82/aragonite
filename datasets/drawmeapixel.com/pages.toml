title = "GAME: There Is No Game: Wrong Dimension"
description = "There is no game. So don't go messing things up by clicking everywhere. You don’t want to be kicked out of your video game world, do you? Of (...)"
full_description = '''There Is No Game: Wrong Dimension is a Point & Click comedy adventure (and Point & Click only!) that will take you on a journey you never asked to go on, through silly and unexpected video game universes. Will you be able to play along with the "Game" to find your way home? We sincerely think NOT. Features A Point&Click comedy adventure. You can go ahead and put your controller back up on the shelf. Incredible 3D graphics that are flat. Completely flat. And very pixelated. Almost fully voiced. (May contain traces of foreign accents here and there.) Solve riddles that require you to think "Outside the box". Hint system included because you can't think "Outside the box"... Shorter than an MMORPG, which leaves you plenty of time to finish some REAL good games. Discover the Top 10 best walls. The fourth one will surprise you! Motion sickness free, which is pretty remarkable for a non-VR experience. Contains tons of bugs... but it’s supposed to be like that. And lots of other surprises! Reviews “This extraordinary game tests you to the limit – even as it insists that it absolutely does not exist.”100 – The Guardian “There Is No Game is very, very good and very clever.”Rock Paper Shotgun “Cramming more surprises and ideas into five hours than many games manage in 50, There Is No Game is a brain-scrambling treat.”80 – Edge Magazine "A hilarious parody of point 'n' click adventures and video games in general, whose jokes are as inspired and imaginative as its puzzles."9 / 10 - Metro GameCentral "A rich story, perfect graphical elements, and frustratingly challenging puzzles make There Is No Game: Wrong Dimension a thoroughly worthwhile game."10 / 10 - The Digital Fix "So what is this interactive story that I've been throwing my thumbs at, attempting to guide its fate while being exposed to cracks in the wall that separates its reality from mine? Is it an absurdly smart commentary of video games, a bonkers adventure to watch unfold, a slice of creativity rarely seen in the industry? Is it an experience that has to be felt to be understood, thanks to its talkative AI and whimsical approach? Whatever it is, one thing is for certain: There is no game."8 / 10 - Critical HitWHERE TO BUY OUR GAMES Steam ShopEpic GamesGOG StoreNintendo StoreApple StoreGoogle Play'''
