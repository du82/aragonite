full_description = "공지사항 진짜 해커들의 진짜 승부, 2025 Dreamhack Invitational ⚔ 참여 방법 Dreamhack 대표 업적 없음 댓글 0 안녕하세요! 드림핵입니다. 드림핵 유저 여러분, 뜨거웠던 2024 닷핵 컨퍼런스와 드림핵 인비테이셔널의 열기를 기억하고 계신가요? 여러분의 많은 성원에 힘입어, 2025년도에도 닷핵 컨퍼런스에서 드림핵 인비테이셔널이 진행됩니다! 2025 드림핵 인비테이셔널은 2025년 4월 8일에 진행될 예정인데요, 이번 공지사항을 통해서 본선 진출 방법 2가지를 소개해 드리고자 합니다. 최고의 사이버 보안 컨퍼런스에서 자신의 실력을 자랑하고 싶으신 분들은 아래 내용을 놓치지 말고 꼭 확인하시길 바랍니다! ⚔ 본선 진출 방법 (1) Dreamhack CTF Season 6 상위 10명 드림핵에서는 매월 첫번째 주, 마지막 주에 CTF를 개최하고 있다는 점, 모두 알고 계시죠? 12월까지 진행되는 Dreamhack CTF Season 6에서 높은 순위를 차지하신 10분께 출전권이 주어집니다! Dreamhack CTF Season 6 랭킹은 여기서 확인할 수 있습니다 이번 Season 6는 이전까지와는 다르게 모든 분이 같은 출발선에서 시작했으니, 지금부터라도 열심히 참여하면 충분히 진출 가능하시다는 점! 남은 라운드, 꼭 참여하실 거죠? 참여 신청하러 가기! 🔗 Dreamhack CTF Season 6 Round #10 (🌱Div2) 🔗 Dreamhack CTF Season 6 Round #11 (🚩Div1) 🔗 Dreamhack CTF Season 6 Round #12 (🌱Div2) 🔗 Dreamhack CTF Season 6 Round #13 (🚩Div1) ⚔ 본선 진출 방법 (2) Dreamhack Invitational Qual 상위 20명 2025년 2월, 드림핵 인비테이셔널 예선전이 개최될 예정입니다! 예선전에서 높은 성적을 거둔 20분께도 출전권이 주어집니다. 또한, Dreamhack CTF Season 6 레이팅 상위 10명 중 드림핵 인비테이셔널 본선 진출을 포기하는 사람이 발생할 경우 그 인원만큼 예선에서 더 선발합니다! (ex: Season 6 레이팅 상위 10명 중 3명이 본선 진출을 포기한 경우, 예선에서 23명을 선발) 주말에 일정이 많아 Dreamhack CTF에 꾸준한 참여가 어렵다면, 예선전에서 확실한 실력 발휘를 통해 본선 진출권을 확보하시길 바랍니다! 드림핵 인비테이셔널 예선전은 2025년 2월 중 개최될 예정이며, 자세한 일정은 추후 공지하겠습니다. 드림핵 공지사항과 공식 디스코드에서 눈을 떼지 마세요! 드림핵 인비테이셔널과 .HACK conference 2025에 대해 더 알고 싶으시다면? 🔗 https://dothack.io/ 아래 SNS를 통해서 최신 소식을 받아보세요! 🔗 Facebook, Linkedin, X 작성자 정보 Dreamhack Dreamhack 관리자 2024.10.17. 14:59 (수정됨) 댓글 0 공지사항 다른 글 전체 보기 제목작성 시간[드림핵 우수 후기 이벤트] 후기만 작성해도 쏟아지는 상품! 🎁 [] 2025.03.05. 2025년 2월의 드림핵 노트 📜 [] 2025.02.11. 2025년 1월의 드림핵 노트 🐍 [4] 2025.01.07. 12월의 드림핵 노트 ❄️ [1] 2024.12.06. 🎉 50000명 이벤트 당첨자 안내! 🎉 [10] 2024.11.29. 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamh