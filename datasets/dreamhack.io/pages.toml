full_description = "공지사항 11월의 드림핵 노트💨 Dreamhack 대표 업적 없음 댓글 1 안녕하세요, 드림핵입니다! 갑작스럽게 날씨가 쌀쌀해지는 11월입니다! 순식간에 지나가는 가을을 놓치지 말고 즐기시길 바랄게요 🍂 11월의 드림핵 노트는 아래의 소식을 담고 있습니다! 드림핵 유저 50,000명 돌파 이벤트 개시! 📌 에어팟, 커피머신 등 호화로운 상품이 여러분을 기다립니다 2025 닷핵 컨퍼런스 예고 📌 컨퍼런스 티켓을 얻을 수 있는, Dreamhack Invitational이 돌아옵니다! 신규 로드맵 3종 공개 📌 Secure Coding(C, React), Linux Kernel Hacking 엔터프라이즈 대상 공개 2024 드림핵 만족도 조사 진행 중 📌 귀중한 의견을 들려주신 분께는 추첨을 통해 상품권을 드려요! 기능 업데이트 및 오탈자 수정도 담고 있으니, 이번 달의 드림핵 노트도 많이 확인해 주시길 바랍니다! ────────────────────────────────────────────────────────── 드림핵 유저 50,000명 돌파 이벤트 개시! 더 안전한 사이버 세상을 위해 드림핵에 모인 인원이 드디어 5만 명을 돌파했습니다! 뜨거운 성원을 보내주시는 여러분께 늘 감사드리며, 조금이라도 사랑을 돌려 드리고자 50000명 기념 이벤트를 준비했습니다. 유저분들이 직접 만든 문제를 풀어볼 수 있는 UCC CTF와, 여러분만의 그림을 선보일 수 있는 드림핵 팬아트 이벤트에 참여하고 커피머신, 마우스 등 선물들도 받아 가세요! UCC CTF 참여하러 가기 팬아트 게시판 가기 닷핵 컨퍼런스 2025 예고 최고의 사이버 보안 컨퍼런스, .HACK 컨퍼런스 가 2025년에도 개최됩니다! 2025 .HACK 컨퍼런스는 4월 8일부터 2일간 코엑스 컨퍼런스룸E에서 진행됩니다. 해커와 보안인들이 모이는 축제의 장에서 여러분들을 기다리고 있겠습니다! 열의 넘치는 보안인들의 현장에서 자신의 실패담과 교훈을 공유해 주실 수 있는 연사분도 찾고 있습니다! 남들과는 다른 특별한 경험이, 또는 꼭 공유하고 싶은 실패담이 있으신 분은 .HACK 연사로 지원해 보세요! 또는 .HACK에서 만나고 싶은 연사가 있다면 저희에게 추천해 주세요! 여러분이 추천한 분이 발표자로 선정되면 컨퍼런스 등록비를 50% 할인해 드립니다! .HACK Conference 연사 지원하기 .HACK Conference 연사 추천하기 물론! 작년과 마찬가지로 올해에도 Dreamhack Invitational이 진행됩니다! 평소 Dreamhack CTF에서 꾸준하게 솜씨를 뽐내주신 유저분들과 예선전에서 빛나는 한방을 보여주신 분들을 모시는 점은 변함없지만, 세세한 부분에서 약간씩 변경사항이 있습니다. Dreamhack Invitational에서 실력을 겨루고 Dreamhack 최고권위자가 되고 싶으신 분은 아래 공지사항을 꼭 확인해 주세요! 진짜 해커들의 진짜 승부, 2025 Dreamhack Invitational ⚔ 참여 방법 신규 로드맵 3종 공개! 2024년 10월 16일, 드림핵에 신규 로드맵이 무려 3개나 출시됐습니다! 이번 Secure Coding - C 로드맵, Secure Coding - Front-End (React) 로드맵, Linux Kernel Hacking Basic 로드맵은 드림핵 엔터프라이즈를 이용하고 있는 기관분들에게 공개되었습니다. 새로 공개된 로드맵들에 대하여 자세히 알고 싶으시다면 저번 공지사항을 참고해 주세요! 앞으로도 드림핵은 최신 보안 트렌드를 담은 워게임과 로드맵을 통해 드림핵을 이용해 주시는 여러분의 보안 역량 함양을 돕도록 하겠습니다. 드림핵에 추가되었으면 하는 로드맵과 실습 문제가 있다면 언제든 댓글로 알려주세요! 2024 드림핵 만족도 조사 진행 중 11월 13일까지 2024 드림핵 만족도 조사가 진행되고 있습니다! 더 나은 드림핵이 되기 위한 과정이니, 여러분의 귀중한 의견을 꼭 들려주시길 바랍니다! 만족도 조사에 참여해 주신 분들 중 추첨을 통해 200분께는 편의점 상품권을, 소중한 의견을 써주신 3분을 선별하여 배달의 민족 모바일 상품권 50,000원권을 드립니다! 여러분의 많은 참여 기다리고 있겠습니다! ▶ 지금 바로 참여하러 가기 ◀ 그 외 업데이트 🎺 Lecture - 일부 강의의 가시성이 보강되었습니다. 🎺 Enterpirse - 커리큘럼 수료증 기능에 수강시간을 표시하는 기능이 추가되었습니다. 🎺 Forum - 드림핵 50,000만명 기념 팬아트 게시판에 gif 형식의 이미지도 업로드 가능하도록 변경되었습니다. 🐛 Enterprise - 수료 퀴즈에 주관식 문제가 출제되지 않던 문제를 수정했습니다. 🐛 Roadmap - 일부 로드맵들의 예상 수강 시간이 정상적으로 출력되지 않던 문제를 수정했습니다. 🐛 Roadmap - 일부 로드맵들의 강의들의 이름이 잘못 출력되던 문제를 수정했습니다. 🐛 Lecture - 일부 강의에서 내용이 포함된 셀이 비정상적으로 표시되던 문제를 수정했습니다. 🐛 Announcemenrt - 공지사항이 검색이 되지 않던 문제를 수정했습니다. 🐛 Forum - 일부 단어가 잘못 번역되고 있던 문제를 수정했습니다. 🐛 Timeline - 일부 단어가 잘못 번역되고 있던 문제를 수정했습니다. 강의 오탈자 제보 <디지털 포렌식이란?> 섹터 -> 센터 <디지털 포렌식이란?> Incident Reponse -> Incident Response <메모리 덤프> 리틀 엔디안 -> 리틀 엔디언 <메모리 덤프> 모든 문자들 다루도록 -> 모든 문자를 다루도록 <동시성> 않은 -> 않는 <동시성> strtok() -> strtok() (코드블록 반영) <Memory Corruption: Format String Bug> 해당 주소에 적힌 읽을 수 -> 해당 주소에 적힌 값을 읽을 수 <DreamBank: 환경 구축> account/acocunt-service/requirements.txt -> account/account-service/requirements.txt <블록암호: AES> 배열를 -> 배열을 <[WHA-S] ExploitTech: File Vulnerability cases> 붙이지 않았을 떄와 과 같습니다. -> 붙이지 않았을 때와 같습니다. <Exercise: Basic TLS Pinning 우회> 리스트를 배열로 -> 배열을 리스트로 <디지털 데이터> 50 45 03 04 -> 50 4B 03 04 ────────────────────────────────────────────────────────── 항상 감사합니다! 드림핵 노트를 통해서 보고 싶은 내용이 있다면 댓글로 알려주세요! 이번 주 토요일에 개최되는 드림핵 CTF도 잊지 말고 꼭 함께해 주세요! 다음 달 드림핵 노트에서 만나요!👋 작성자 정보 Dreamhack Dreamhack 관리자 2024.11.08. 13:08 (수정됨) 댓글 1 dal_hyun 대표 업적 없음 4개월 전 Wow~ 항상 수고가 많으십니다. Translate 공지사항 다른 글 전체 보기 제목작성 시간[드림핵 우수 후기 이벤트] 후기만 작성해도 쏟아지는 상품! 🎁 [] 2025.03.05. 2025년 2월의 드림핵 노트 📜 [] 2025.02.11. 2025년 1월의 드림핵 노트 🐍 [4] 2025.01.07. 12월의 드림핵 노트 ❄️ [1] 2024.12.06. 🎉 50000명 이벤트 당첨자 안내! 🎉 [10] 2024.11.29. 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864