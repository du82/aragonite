description = "이 구역 활동왕이 누구인가?"
full_description = '''HOME 인기글🔥 Q&A 후기 게시판 HOME 인기글🔥 Q&A 후기 게시판 이 구역 활동왕이 누구인가? 커뮤니티 랭킹 보러가기 보상이 걸린 질문 질문에 답변을 달고 보상을 받아가세요! 50 코인 cat: flag: No such file or directory 에러 ❯ python PoC.py [+] Starting local process './basic_exploitation_001': pid 104804 [*] Switching to interactive mode cat: flag: No such file or directory [*] Got EOF while reading in interactive $ [*] Process './basic_exploitation_001' stopped with exit code -11 (SIGSEGV) (pid 104804) [*] Got EOF while sending in interactive 이와 같이 제 로컬 PC에서 스택버퍼오버플로우를 이용해 read_flag 함수를 동작시켰습니다. 그러나, cat: flag: No such file or directory이라는 에러가 발생했습니다. ❯ cat /flag test 하지만 로컬PC에서 임의의 데이터를 삽입한 /flag는 존재하는데, 해당 파일을 못 읽어오는게 의문이 생깁니다. #include <stdio.h> #include <stdlib.h> #include <signal.h> #include <unistd.h> void alarm_handler() { puts("TIME OUT"); exit(-1); } void initialize() { setvbuf(stdin, NULL, _IONBF, 0); setvbuf(stdout, NULL, _IONBF, 0); signal(SIGALRM, alarm_handler); alarm(30); } void read_flag() { system("cat /flag"); } int main(int argc, char *argv[]) { char buf[0x80]; initialize(); gets(buf); read_flag(); return 0; } 그래서 로컬PC의 환경적 요인 때문에 안된다는 생각이 들어, 문제 코드의 main 함수에 read_flag 함수를 호출해봤습니다. ❯ gcc -g -fno-stack-protector -o test test.c test.c: In function ‘main’: test.c:32:5: warning: implicit declaration of function ‘gets’; did you mean ‘fgets’? [-Wimplicit-function-declaration] 32 | gets(buf); | ^ | fgets /usr/bin/ld: /tmp/ccpgL4yb.o: in function `main': /hack/wargame/lv1_basic_exploitation_001/test.c:32:(.text+0xd3): warning: the `gets' function is dangerous and should not be used. ❯ ./test test 컴파일 후 동작을 시켜보면 /flag 파일을 잘 가져오는 것을 확인할 수 있습니다. 왜 문제에서 제공된 basic_exploitation_001에서만 임의의 생성한 /flag 파일을 못 가져오나요?? 파일 권한 및 사용자 권한 ❯ ls -al basic_exploitation_001 test -rwxr-xr-x 1 root root 5912 2월 13 2024 basic_exploitation_001 -rwxr-xr-x 1 root root 19504 2월 28 03:06 test ❯ ls -al /flag -rw-r--r-- 1 root root 5 2월 28 01:17 /flag ❯ id uid=0(root) gid=0(root) groups=0(root) ` basic_exploitation_001 #pwnable 10 코인 화이트햇스쿨 관련 질문! 화이트햇스쿨을 모집기간이 끝나고 알아서 이번에 지원을 못했었는데 다음 모집까지는 많이 남은거 같아서 혹시 비슷한 다른 캠프 같은게 있을까요? 없다면 다음 모집까지 뭐를 공부해야 좋을까요? # 연관 태그 없음 커뮤니티 최신글 드림핵을 이용하기 전 필독!중요 업데이트, 최신 소식을 놓치지 마세요. 공지사항 보러 가기 드림핵 사용자들과 실시간으로 소통하고 싶다면 디스코드 채널에 들어오세요! 드림핵 디스코드 채널로 이동하기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337'''
