full_description = "공지사항 [50000명 이벤트] UCC CTF 참여 방법 안내 Dreamhack 대표 업적 없음 댓글 0 여러분이 만들어가는 CTF!드림핵에서 유저 50,000명 달성을 기념해 UCC CTF를 개최합니다. 여러분이 가지고 계신 아이디어를 마음껏 뽐내고 경품도 받아가세요! 진행 방식 1. 문제 모집 (10/21 ~ 11/05 11:59 (UTC+9), 약 2주) (기간 연장) UCC CTF를 개최하기 위해, 여러분의 독창적인 아이디어로 만든 문제를 모집합니다! 문제 하나 당 응모권 3개가 주어지니 (최대 3회 참여 가능), 적극적으로 참여하여 당첨 확률을 높여보세요! 문제 모집은 다음 과정을 통해 이루어집니다. 여러분들의 독창적인 아이디어가 워게임을 작성해 주세요. 이 때, Dreamhack 50000명 이벤트 UCC CTF 참여용 문제입니다. 박스를 꼭 체크해야 합니다! 워게임 작성과 관련된 가이드는 해당 링크를 확인해주세요. 워게임 작성을 완료했다면, 구글 폼을 통해 문제 링크와 관련 내용들을 전달해주세요. 운영진이 문제를 핸들링하는데 필요한 정보입니다! 제출한 문제는 운영진이 업로드 여부를 결정한 후, CTF에 등록합니다. 만약 신청이 반려될 경우, 문제 사항을 수정한 뒤 다시 제출해 주세요. 문제는 다음 사항을 반드시 포함해야 합니다: 문제의 원본 소스 코드 레퍼런스 솔버 문제가 정상적으로 풀리는지 증명하기 위해서 필요합니다. 솔버가 누락된 문제는 UCC CTF에 등록할 수 없습니다. 풀이를 간단히 메모해서 제출해주신다면 당신은 최고.. 2. CTF 개최 (11/06 ~ 11/09, 4일) Update: 다음 링크에서 CTF에 참여하세요! UCC CTF 링크 다른 분들의 톡톡 튀는 아이디어가 궁금하신가요? UCC CTF에 참여하고 다른 유저가 제작한 문제를 풀어보세요! CTF에 참여하면 기본적으로 응모권 1개가 지급되며, CTF 순위에 따라 추가 응모권이 차등 지급됩니다! CTF는 1주일간 진행됩니다. 대회 운영은 운영진이, 출제 문제 핸들링은 출제자 및 운영진이 담당합니다. 문제 출제자는 CTF 결과 산정에서 제외되는 점 양해 부탁드립니다! CTF 순위에 따른 응모권 부여 개수는 다음과 같습니다! 1등: 5개 2등: 4개 3등: 3개 3. 문제 인기 투표 (11/10 ~ 11/16, 1주) 어떤 문제가 기억에 남나요? 마음에 드는 문제나 아이디어가 있으신가요? 여러분들의 최애 문제에 투표하고 응모권도 1장 받아가세요! 많은 사랑을 받은 문제를 내주신 출제자 분에게는 추가로 드림핵 티셔츠를 드립니다! 작성자 정보 Dreamhack Dreamhack 관리자 2024.11.04. 19:25 (수정됨) 댓글 0 공지사항 다른 글 전체 보기 제목작성 시간[드림핵 우수 후기 이벤트] 후기만 작성해도 쏟아지는 상품! 🎁 [] 2025.03.05. 2025년 2월의 드림핵 노트 📜 [] 2025.02.11. 2025년 1월의 드림핵 노트 🐍 [4] 2025.01.07. 12월의 드림핵 노트 ❄️ [1] 2024.12.06. 🎉 50000명 이벤트 당첨자 안내! 🎉 [10] 2024.11.29. 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
