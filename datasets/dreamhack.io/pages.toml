title = "Enterprise 소개 | Dreamhack Enterprise"
description = "기관들을 향한 사이버 위협의 강도, 빈도, 규모는 매해 폭발적으로 증가하고 있습니다.기업의 보안은 이제 전문가가 혼자, 혹은 보안팀이 전담해서 하는 일이 아닙니다.Dreamhack Enterprise는 기업의 전사적 보안 역량 향상을 위한 솔루션을강의, 워게임, CTF를 통해 제공합니다."
full_description = "보안 역량 강화는 선택이 아닌 필수입니다. 기관들을 향한 사이버 위협의 강도, 빈도, 규모는 매해 폭발적으로 증가하고 있습니다.기업의 보안은 이제 전문가가 혼자, 혹은 보안팀이 전담해서 하는 일이 아닙니다.Dreamhack Enterprise는 기업의 전사적 보안 역량 향상을 위한 솔루션을강의, 워게임, CTF를 통해 제공합니다. 엔터프라이즈 소개서 받기 엔터프라이즈 도입 문의 보안 교육, 바로 시작하기 망설여지시나요? 그간 진행했던 정보 보안 교육은 너무 두루뭉술하고 개념이 어려워요. 보안이 중요한 건 아는데,어떤 분야를 어떻게 가르쳐야 할지 모르겠어요. 보안 교육을 진행해도 구성원들에게효과가 있을지 모르겠어요. 협업에서 바로 적용 가능한 보안 역량을기르고 싶어요. 보안 교육 전후로 구성원들의 변화를확인할 방법이 없어요. 최신 보안 트렌드와 전문 지식으로 귀사의 보안 방어력을 향상시키세요. 기업 보안 진단을 통해 내가 속한 기업의 보안 현황을 자체적으로 진단하고 점수를 도출해보세요.점수를 바탕으로 Dreamhack Enterprise의 난이도와 커리큘럼을 추천 해드립니다. 기업 보안 진단하기 데모 신청하기 Customer Stories LG Electronics 스마트 라이프 솔루션 기업, 보안 교육에서도 선두를 달리다 사례 자세히보기 > 국민대학교 미래혁신단(미래자동차사업단) 자동차 모빌리티 분야 최고 대학, 자동차 사이버보안의 미래를 준비하다 사례 자세히보기 > 대덕소프트웨어마이스터고등학교 국내 최초의 SW마이스터 고등학교 학생들의 도전 사례 자세히보기 > Dreamhack은 기업, 공공기관, 교육기관 등 다양한 분야와 함께하고 있습니다. 최고의 학습 환경을 제공하기 위한 노력 Dreamhack 팀은 학습자 관점에서 생소하고 어려울 수 있는 개념을다양한 매체들을 통해 쉽고 효과적으로 전달하는 강의를 제작하고 있습니다. 강의 자세히 알아보기 > Interactive modules Quizzes Hands-on Exercises CTF 빠르게 변화하는 트렌드에 발맞추는 커리큘럼 사이버 보안의 트렌드는 빠르게 변화하며, 그에 따라 위협도 점차 다각화되고 있습니다.Dreamhack에서 제공하는 콘텐츠들은 항상 최신의 자료를 다루고 있으며,발빠르게 변화하는 사이버 보안 패러다임에 발맞춘 가장 빠르고 효과적인학습 자료를 전달합니다. 176일 평균적으로 강의를 최신화하는 주기 93일 평균적으로 새로운 주제 다루는 커리큘럼 생성 주기 기초부터 응용까지 폭넓은 커리큘럼 정보 보안은 수많은 기초 학문과 큰 연관성이 있습니다.Dreamhack은 가장 핵심이 되는 기초 정보 보안을 다루는 Fundamental 커리큘럼과산업군이 요구하는 응용 커리큘럼들이 발빠르게 출시 되고 있습니다. 기초 커리큘럼 Dream Beginners Web Hacking Reverse Engineering System Hacking 심화 커리큘럼 Cryptography Mobile Hacking Cloud Security Embedded Hacking Browser Hacking 복합 커리큘럼 Secure Coding 콘텐츠 자세히 알아보기 보안 분야를 잘 모르더라도 손쉽게 관리할 수 있어요. 편리하고 직관적인 관리 시스템을 통해 누구나 쉽게 학습자들을 관리할 수 있습니다.학습자들의 학습내역 등을 체계적으로 추적하여 손쉽게 파악할 수 있으며,문제를 자동으로 선정해주는 대회 생성 기능을 통해 학습자들을 평가할 수 있습니다. 관리 기능 자세히 알아보기 > Dreamhack의 모든 관리 기능은누구나 간단히 사용할 수 있습니다. 학습자들의 학습태도를체계적으로 추적합니다. 다양한 평가시스템을 통해 학습자들의순위를 매기거나 평가할 수 있습니다. Dreamhack의 모든 관리 기능은누구나 간단히 사용할 수 있습니다. 학습자들의 학습태도를 체계적으로추적합니다. 다양한 평가시스템을 통해 학습자들의순위를 매기거나 평가할 수 있습니다. Learners stats Dreamhack은 정보 보안을 가장 잘 다루고 이해하고 있는화이트햇 해커들이 만들어 나가고 있기에, 실무와 밀접하면서도 학습자들이만족할 수 있는 강의를 제공합니다. 학습 자료와 실습 과정이 만족스러웠다고 평가 94% 검색을 통한 학습보다 더 유용하고 실무에 즉시 적용 가능한 자료를 포함하고 있다고 평가 88% 가중치 평균. 2022년 2분기 무작위로 선별된 Dreamhack Enterprise 사용자 132명을 대상으로 진행한 설문 조사 응답 기반 Award-winning contents 세계 대회를 수차례 석권한 화이트햇 해커들이 직접 제작한 콘텐츠를만나보세요. 전 세계 최고 수준의 해커들이 모이는 해킹 대회 속에서Dreamhack 팀은 다년간의 우승을 통해 입증 해왔습니다. 콘텐츠 자세히 알아보기 > DEF CON 2022 (DC30) 팀 'MMM' 1위 우승 DEF CON 2019 (DC27) 팀 'PPP' 1위 우승 미국 라스베가스에서 개최되는 DEF CON CTF는 모든 해커들에게꿈의 무대라고 불릴 정도로 그 규모와 상징성이 높은 대회로 알려져 있습니다. Mentors Dreamhack Enterprise 기간 동안 Dreamhack 팀과 학습자가밀접하게 소통합니다. 검증된 실력의 화이트햇 해커로서의 실력과 직접학습자료를 제작한 경험을 토대로, 학습자들의 의문점을 빠르고정확하게 해결하며 역량 향상을 보조합니다. Dreamhack 팀 안녕하세요 meu님! Dreamhack 팀입니다.무엇을 도와드릴까요? 안녕하세요. 시스템 해킹에서 궁금한게있는데요! 프로세스 메모리에서'/bin/sh'의 주소를 어떻게 구하나요? FAQs Dreamhack Enterprise를 도입하려면 어떻게 해야하나요? Dreamhack Enterprise 도입 문의는 페이지 상단의 도입 문의 버튼을 클릭하시거나 dreamhack@dreamhack.io 로 문의해 주시면 안내해 드리고 있습니다.해당 메일로 기관명, 담당자명, 연락처와 전달하고 싶은 내용을 작성하여 발송해 주시면 빠르게 안내해 드리도록 하겠습니다.일반 Dreamhack 유저와 Dreamhack Enterprise를 사용하게 되었을 때의 차이점은 무엇인가요? Dreamhack Enterprise를 이용하시면, 관리자 측면에서 일반 Dreamhack 유저들에게는 제공되지 않는 학습자 관리 기능과 대회 개최 권한 등을 이용하실 수 있게 됩니다.또, 일반 Dreamhack 유저보다 더 빠르게 신규 강의를 만나볼 수 있으며, Enterprise 학습자들에게만 제공되는 다양한 전용 문제들에 접근할 수 있게 됩니다.자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요.보안에 대한 전문적인 지식이 없어도 Dreamhack Enterprise를 잘 이용할 수 있을까요? 알아보기 쉽고 직관적인 지표를 통해, 보안에 대한 전문적인 지식이 없더라도 학습자들을 손쉽게 관리할 수 있습니다.또, 이용 기간동안 Dreamhack 팀 또한 그동안의 노하우를 통해 기관에 적합한 학습 방법을 추천해 드립니다.Dreamhack Enterprise는 기업에서만 사용할 수 있나요? 이용을 원하시는 기관이라면 기업 뿐만 아니라 공공기관, 교육기관 등 어떤 곳이든 서비스를 제공해 드리고 있습니다.Dreamhack Enterprise는 어떤 기관에게 적절한 서비스 인가요? 일회성 보안 교육에 그치지 않고 아니라 전사적, 영구적으로 보안 역량을 끌어올리고 싶은 기관, 보안 역량 향상을 위한 체계적인 시스템을 갖추고 싶은 기관,사내에 보안 학습에 대한 문화를 정착시키고 싶은 기관 등에 적합합니다.Dreamhack Enterprise의 가격 정책은 어떻게 되나요? 이용하시길 원하는 기간과 인원에 따라 상이합니다. 자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요. Dreamhack Enterprise Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요. 엔터프라이즈 소개