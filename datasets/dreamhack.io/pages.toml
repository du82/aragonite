full_description = '''서비스 이용 약관 이용약관 제1장 총칙 제1조 (목적) 주식회사 티오리한국(이하 ‘회사’)가 제공하는 Dreamhack 서비스(이하 ‘서비스')를 이용해 주셔서 감사합니다. 본 이용약관(이하 '본 약관')은 이용자가 본 서비스를 이용하는 데 필요한 권리, 의무 및 책임사항, 이용조건 및 절차 등 기본적인 사항을 규정하고 있으므로 시간을 내서 주의 깊게 읽어주시기 바랍니다. 제2조 (용어의 정의) 본 약관에서 사용하는 용어의 뜻은 다음과 같습니다. 이용자 : 본 약관에 따라 이용계약을 체결하고 회사가 제공하는 서비스를 이용하는 사람을 의미합니다. 유료서비스 : 이용자가 회사에 제공하는 결제 방식을 통해 책정된 유료 요금을 결제하여 구매 후 사용할 수 있는 서비스를 말합니다. 코인 : 회사에서 서비스하는 유료서비스만을 이용하기 위해 구매하는 인터넷상의 결제수단으로 현금 100원당 코인 1개의 비율로 환산되며, 계정을 기준으로 충전, 결제, 환불 등이 가능합니다. 충전 : '코인'을 회사에서 제공하는 결제 방식을 통해 일정 금액 단위로 구입하는 것을 말합니다. 구독 : 특정 서비스를 이용하기 위해 정기적으로 자동 결제하거나 기타 회사가 지정한 방식으로 결제하여 해당 서비스 혹은 해당 서비스의 이용권을 사전에 고지된 기간동안 구입, 이용하는 것을 말합니다. 구독 형식으로 판매되는 콘텐츠의 경우 해당 콘텐츠의 종류, 결제수단, 이용 기간, 가격 등 조건에 대한 세부사항은 구독신청 혹은 이용권 구매 페이지, 결제 페이지 등에 확인하기 쉽게 게시 혹은 안내합니다. 제휴 콘텐츠 : '코인'을 이용하여 회사와 계약을 맺은 업체의 콘텐츠, 상품 등을 회사의 콘텐츠와 동시에 이용하는 콘텐츠를 뜻하며, 제휴 콘텐츠 중 회사가 제공하지 않는 내용에 대하여 별도의 고지가 없는 이상 회사가 자사 이용자에 대한 제공 목적으로 계약관계인 업체로부터 대량으로 구입하여 서비스에 따른 최종 대상자에게 제공 혹은 발송합니다. 유료 콘텐츠 비용 : 이용자가 서비스를 이용하여 코인을 충전 후 콘텐츠를 이용하기 위해 지급한 금액을 말합니다. 서비스 수수료 : 회사가 이용자에게 서비스를 제공하는 대가를 말합니다. 정산금액 : 사용자에 대한 '후원금액' 혹은 '구독 등 유료서비스 이용 금액'에서 서비스 수수료 및 결제대행사 수수료, 기타 세금 등을 차감한 후 회사가 이용자에게 지급하는 금액을 말합니다. 결제기관 : 통신사, 신용카드사, 선불결제수단의 발행기관 등을 말하며, '결제대행사'라 함은 해당 결제기관과 회사 사이에서 결제업무를 대행하는 기관 혹은 회사를 뜻합니다. 제3조 (약관의 효력 및 변경) ① 본 약관의 내용은 서비스의 화면에 게시하거나 기타 여하의 방법으로 공지하고, 본 약관에 동의한 이용자에게 효력이 발생됩니다. ② 회사는 필요한 경우 관련 법령을 위배하지 않는 범위 내에서 본 약관을 변경할 수 있습니다. 본 약관이 변경되는 경우에는 회사는 변경사항을 시행일 십사(14)일 이전부터 본 서비스의 공지사항에서 공지하거나 통지하는것을 원칙으로 하며, 피치못한 이유로 이용자에게 불리한 내용으로 변경되는 경우 그 시행일자 삼십(30)일 전부터 이메일 발송 또는 기타 전자적 수단을 통해 개별적으로 전달하도록 하겠습니다. ③ 회사가 전 항에 따라 공지 또는 통지를 하면서, 공지 또는 통지일로부터 개정약관 시행일 칠(7)일 후까지 거부 의사를 표시하지 아니하면 승인한 것으로 본다는 뜻을 명확하게 고지하였음에도, 이용자의 의사표시가 없는 경우 변경된 약관을 승인한 것으로 봅니다. ④ 이용자는 변경된 약관에 대해 거부의사를 표시함으로써 이용계약의 해지를 선택할 수 있습니다. ⑤ 본 약관은 이용자가 본 약관에 동의한 날로부터 본 약관에 따른 이용계약의 해지 시까지 적용하는 것을 원칙으로 합니다. 단, 본 약관의 일부 조항은 이용계약의 해지 후에도 유효하게 적용될 수 있습니다. 제4조 (약관 외 준칙) 본 약관에 규정되지 않은 사항에 대해서는 관련 법령 또는 서비스를 구성하는 개별 서비스의 운영정책 및 규칙, 개별 서비스 내 세부 하위서비스의 이용약관, 회사의 정책 및 규칙 등(이하 총칭하여 '세부지침')의 규정을 따릅니다. 또한 본 약관과 세부지침의 내용이 충돌할 경우 세부지침에 따릅니다. 제2장 서비스의 이용 제5조 (서비스 이용 계약) ① 서비스를 이용하기 위해서는 회원가입이 필요합니다. ② 서비스 이용계약은 이용자가 본 약관의 내용에 동의한 후 회원가입을 신청하고, 회사가 이용자의 회원가입 신청 내용을 확인한 후 승낙함으로써 체결됩니다. ③ 가입 신청자에게 회사는 원칙적으로 서비스 가입을 승낙합니다. 다만, 회사는 아래 각 호의 경우에는 그 사유가 해소될 때까지 승낙을 유보하거나 승낙하지 않을 수 있습니다. 다른 사람의 명의나 이메일 주소 등 개인정보를 이용하여 서비스에 가입하려고 한 경우 서비스 제공 설비 용량에 현실적인 여유가 없는 경우 서비스 제공을 위한 기술적인 부분에 문제가 있다고 판단되는 경우 기타 회사가 재정적, 기술적으로 필요하다고 인정하는 경우 회사로부터 서비스 이용정지 조치 등을 받은 자가 그 조치기간에 서비스 이용계약을 임의로 해지하고 재가입을 신청하는 경우 가입 신청자가 만 14세 미만인 경우 기타 관련 법령에 위배되거나 세부지침 등 회사가 정한 기준에 반하는 경우 ④ 만약, 이용자가 제3항의 조건에 위반하여 서비스에 가입한 것으로 판명된 때에는 회사는 즉시 이용자의 서비스 이용을 정지시키거나 계정을 삭제하는 등 적절한 제한을 할 수 있습니다. 제6조 (개별서비스 및 하위 서비스의 제공) ① 회사가 제공하는 일부 개별서비스나 세부 하위 서비스의 경우 별도의 이용약관에 동의해야 이용이 가능하며 필요한 추가 정보를 기재하거나, 이메일 주소 승인 또는 문자메시지 인증 등 회사가 정한 추가 인증 절차가 요구될 수 있습니다. ② 이용자는 서비스 가입 후에도 언제든지 하위 서비스의 이용을 종료할 수 있으며, 이용자가 종료 의사표시를 하는 경우 관련 법령에서 정하는 바에 따라 일정기간 보관해야 하는 정보를 제외하고는 해당 서비스 이용기록, 이용자가 작성한 게시물 등 모든 데이터는 지체 없이 삭제 처리됩니다. 다만, 이용자가 작성한 게시물이 제3자에 의하여 스크랩 또는 다른 공유 기능으로 게시되거나, 이용자가 제3자의 게시물에 댓글 등 게시물을 추가하는 등의 경우에는 해당 게시물 및 댓글은 삭제되지 않습니다. 개별 서비스 또는 하위 서비스 이용 종료 시점에 향후 일정기간 해당 서비스의 재이용에 제한이 있을 수 있다는 별도 안내가 있는 경우 해당 안내에 따라 해당 서비스의 재이용에 일정한 시간적 제한을 둘 수 있습니다. ③ 전항에 따른 개별 서비스 또는 세부 하위 서비스의 이용 종료는 해당 개별 서비스 또는 세부 하위 서비스의 이용 종료만을 의미하며, 서비스를 구성하는 다른 서비스의 이용이 종료되지는 않습니다. 이용자가 서비스 전체의 이용을 종료하고 싶은 경우에는 서비스 이용계약을 해지하여야 합니다. 제7조 (서비스의 변경 및 종료) ① 회사는 서비스를 365일, 24시간 제공하기 위하여 노력합니다. 다만, 아래 각 호의 경우 서비스의 전부 또는 일부를 제한하거나 중지할 수 있습니다. 서비스용 설비나 프로그램, 솔루션 등의 유지·보수 등을 위한 정기 또는 임시 점검의 경우 정전, 제반 설비의 장애 또는 이용량의 폭주 등으로 정상적인 서비스 이용에 지장이 있는 경우 관계사와의 계약 종료, 정부의 명령/규제 등 회사의 제반 사정으로 서비스의 전부 또는 일부를 유지할 수 없는 경우 기타 천재지변, 국가비상사태 등 불가항력적 사유가 있는 경우 ② 전항에 의한 서비스 중단의 경우에는 제23조에서 정한 방법으로 이용자에게 안내합니다. 다만, 회사로서도 예측할 수 없거나 통제할 수 없는 사유(회사의 과실이 없는 디스크 내지 서버 장애, 시스템 다운 등)로 인해 사전 통지 내지 공지가 불가능한 경우에는 그러하지 아니합니다. 이러한 경우에도 회사가 상황을 파악하는 지체 없이 빠른 시일 내에 서비스를 복구하도록 노력하겠습니다. 제8조 (게시물의 관리) ① 이용자의 게시물이 정보통신망 이용촉진 및 정보보호 등에 관한 법률(이하 ‘정보통신망법’)및 저작권법 등 관련 법령에 위반되는 내용을 포함하는 경우, 권리자는 회사에 관련 법령이 정한 절차에 따라 해당 게시물의 게시중단 및 삭제 등을 요청할 수 있으며, 회사는 관련 법령에 따라 조치를 취합니다. ② 회사는 권리자의 요청이 없는 경우라도 권리침해가 인정될 만한 사유가 있거나 기타 회사의 정책 및 관련 법령에 위반되는 경우에는 관련 법령에 따라 해당 게시물에 대해 임시조치 등을 취할 수 있습니다. 제9조 (권리의 귀속 및 저작물의 이용) ① 이용자는 사진, 글, 정보, (동)영상, 서비스 또는 회사에 대한 의견이나 제안 등 콘텐츠(이하 ‘게시물’)를 서비스 내에 게시할 수 있으며, 이러한 게시물에 대한 저작권을 포함한 지적재산권은 권리자가 계속하여 보유합니다. ② 이용자가 서비스 내에 게시물을 게시하는 경우, 해당 게시물이 서비스에 포함되는 개별 서비스에 노출될 수 있고 이에 필요한 범위 내에서 사용, 저장, 수정, 복제, 공중송신, 전시, 배포 등의 방식으로 이용할 수 있도록 사용을 허락하는 전 세계적인 라이선스를 회사에게 제공하게 됩니다. 본 라이선스에서 이용자가 회사에게 부여하는 권리는 서비스를 운영, 개선, 홍보하고 새로운 서비스를 개발하기 위한 범위 내에서 사용됩니다. 일부 개별 서비스에서는 이용자가 제공한 콘텐츠에 접근하거나 이를 삭제하는 방법을 제공할 수 있습니다. 또한 일부 서비스에서는 제공된 콘텐츠에 대한 회사의 사용 범위를 제한하는 설정이 있습니다. ③ 이용자는 회사에 제공한 콘텐츠에 대해 회사에 라이선스를 부여하기 위해 필요한 권리를 보유해야 합니다. 이러한 권리를 보유하지 않아 발생하는 모든 문제에 대해서는 게시자가 책임을 부담하게 됩니다. 또한, 이용자는 음란성, 폭력적 또는 기타 공서양속 및 법령에 위반하는 콘텐츠를 공개 또는 게시할 수 없습니다. ④ 회사는 이용자의 콘텐츠가 관련 법령에 위반되거나 음란 또는 청소년에게 유해한 게시물, 차별 갈등을 조장하는 게시물, 도배 · 광고 · 홍보 · 스팸성 게시물, 계정을 양도 또는 거래하는 내용의 게시물, 타인을 사칭하는 게시물 등이라고 판단되는 경우 이를 삭제하거나 게시를 거부할 수 있습니다. 다만 회사가 모든 콘텐츠를 검토할 의무가 있는 것은 아닙니다. 누군가 이용자의 권리를 침해하였다면, 고객센터를 통해 게시중단 요청에 대한 도움을 받으실 수 있습니다. 위와 관련된 구체적인 기준 및 이용제한 절차의 내용은 서비스 운영정책에서 확인하실 수 있습니다. ⑤ 서비스에서는 회사가 보유하지 않은 일부 콘텐츠가 표시될 수 있습니다. 그러한 콘텐츠에 대해서는 콘텐츠를 제공한 주체가 단독으로 모든 책임을 부담하게 됩니다. 이용자가 서비스를 이용하더라도 다른 이용자의 콘텐츠에 대하여 어떠한 권리를 가지게 되는 것은 아닙니다. 이용자가 다른 이용자의 콘텐츠를 사용하기 위해서는 콘텐츠 소유자로부터 별도로 허락을 받아야 합니다. 제10조 (이용자의 의무) ① 이용자는 서비스를 이용함에 있어 다음 각 호의 행위를 하여서는 안 됩니다. 이용 신청 또는 변경 시 허위 사실을 기재하거나, 다른 사람의 서비스계정 및 비밀번호를 도용, 부정하게 사용하거나, 다른 사람의 명의를 도용하는 행위 정상적인 커뮤니티 운영을 방해하거나 공정한 경쟁을 저해하는 경우 회사의 서비스 정보를 이용하여 얻은 정보를 회사의 사전 승낙 없이 복제 또는 유통시키거나 상업적으로 이용하는 행위 타인의 명예를 손상시키거나 타인의 권리를 침해하는 행위 게시판 등에 음란물을 게재하거나 음란사이트를 연결(링크)하는 행위, 공공질서 및 미풍양속에 위반되는 내용의 정보, 문장, 도형, 음성 등을 타인에게 유포하는 행위 회사 또는 제3자의 저작권 등 기타 권리를 침해하는 행위(국내외 제3자의 저작권 등을 침해하는 행위로서 회사가 IP 접속 차단 등 기술적인 조치를 통하여 타인에 대한 권리 침해 방지 조치를 취하였음에도 불구하고 이용자가 고의로 또는 회사를 기망하는 수단과 방법을 통하여 서비스에 접속 하는 등 제3자의 저작권 등을 침해하는 행위를 포함합니다) 서비스와 관련된 설비의 오동작이나 정보 등의 파괴 및 혼란을 유발시키는 악성코드, 광고성 정보를 등록 또는 유포하는 행위 회사 또는 관계사의 직원이나 운영자를 가장하거나 사칭하여 또는 타인의 명의를 도용하여 글을 게시하거나 E-mail, 메시지 등을 발송하는 행위 기타 현행 법령, 본 약관 및 회사가 제공하는 서비스 관련 세부지침을 위반하는 행위 ② 이용자는 서비스에 출제된 워게임에 대한 문제풀이(writeup)를 외부에 공개하여서는 안 됩니다. ③ 본 조에서 정한 사항 및 그 밖에 서비스의 이용에 관한 자세한 사항은 서비스 운영정책 등을 참고해 주시기 바랍니다. 제11조 (서비스 이용 제한) ① 이용자가 관련 법령, 회사의 모든 약관 또는 정책을 준수하지 않을 경우, 회사는 이용자의 위반행위 등을 조사할 수 있고, 해당 게시물 등을 삭제 또는 임시 삭제 할 수 있습니다. 또한 이용자의 서비스 전체 또는 서비스를 구성하는 일부 개별 서비스의 이용을 잠시 또는 계속하여 중단하거나, 서비스 재가입 또는 일부 개별 서비스의 재이용에 제한을 둘 수도 있습니다. ② 이용 제한은 위반 활동의 누적 정도에 따라 한시적 제한에서 영구적 제한으로 단계적 제한하는 것을 원칙으로 하지만, 음란한 내용의 게시와 유포 및 사행성 도박 홍보 등 관련 법령에서 금지하는 명백한 불법행위나 타인의 권리침해로서 긴급한 위험 또는 피해 차단이 요구되는 사안에 대해서는 위반 활동 횟수의 누적 정도와 관계 없이 지체 없이 영구적으로 이용이 제한될 수 있습니다. 제12조 (이용계약 해지) ① 이용자는 언제든지 서비스 내에 제공되는 메뉴를 통해 회원 탈퇴(계정 탈퇴)를 함으로써 서비스 이용계약을 해지할 수 있습니다. ② 제1항의 탈퇴 신청이 있는 경우, 회사는 법령이 정하는 바에 따라 신속히 처리하겠습니다. ③ 서비스 이용계약이 해지되면 관련 법령 및 개인정보 처리방침에 따라 이용자의 일정 정보를 보유하는 경우를 제외하고는 이용자의 정보나 이용자가 작성한 게시물 등 모든 데이터는 삭제됩니다. 다만, 이용자가 작성한 게시물이 제3자에 의하여 스크랩 또는 다른 공유 기능으로 게시되거나, 이용자가 제3자의 게시물에 댓글 등 게시물을 추가하는 등의 경우에는 해당 게시물 및 댓글은 삭제되지 않으므로 반드시 해지 신청 전에 직접 삭제하시기 바랍니다. ④ 전항에 따라 이용자가 삭제하지 않은 게시물은 다른 이용자의 정상적 서비스 이용을 위하여 필요한 범위 내에서 서비스 내에 삭제되지 않고 남아 있게 됩니다. ⑤ 서비스를 구성하는 일부 개별 서비스의 경우 일정기간 동안 해당 개별 서비스를 이용하지 않을 경우 이용자의 정보를 파기하거나 분리 보관할 수 있으며, 또는 해당 개별 서비스 기능의 일부 또는 전부를 이용할 수 없도록 제한할 수 있습니다. 자세한 사항은 개별 서비스의 세부지침에서 확인하실 수 있습니다. ⑥ 서비스 이용계약이 해지된 경우라도 이용자는 다시 회사에 대하여 이용계약의 체결을 신청할 수 있습니다. 제13조 (개인정보의 보호) 회사는 이용자의 개인정보를 개인정보 보호 관련 법령에 따라 안전하게 관리합니다. 회사가 이용자의 개인정보를 안전하게 처리하기 위하여 기울이는 노력이나 기타 자세한 사항은 개인정보처리방침 등을 참고해 주시기 바랍니다. 제3장 코인 제도 및 유료 콘텐츠, 서비스 제14조 (유료 서비스의 제공) ① 별도로 표시된 유료 서비스를 제외한 모든 서비스는 이용자들에게 무료로 제공됩니다. ② 유료 서비스의 이용 요금 및 결제 방식은 해당 서비스에 명시되어 있는 규정에 따릅니다. ③ 이용자가 이용요금(현금 또는 코인) 등 거래에 필요한 내용을 확인하여 이에 승낙하면 거래가 성립된 것으로 간주합니다. 제15조 (코인 제도) ① 코인은 회사의 유료 서비스 이용료를 결제하는데 이용되며, 이용자의 결제 및 이용 내역 등은 홈페이지에서 확인하실 수 있습니다. ② 이용자는 제16조에 따라 코인을 충전할 수 있습니다. ③ 회사는 이벤트 등으로 이용자에게 회사 정책에 따라 무상으로 코인을 부여할 수 있습니다. ④ 제3항에 의하여 무상으로 부여된 코인은 회사 사정으로 인하여 회수(부여 취소)될 수도 있으며, 제3항에 의하여 무상으로 부여된 코인은 환불 대상이 아니며, 회원 탈퇴 시 또는 서비스 이용계약 해지 시 전액 삭제됩니다. ⑤ 회사는 코인에 대한 금융이자 지급 의무가 없습니다. ⑥ 구매하신 코인의 최대 서비스 제공 기간은 5년이며, 구매 후 5년 안에 사용하셔야 합니다. 사용하지 않은 코인은 자동으로 소멸됩니다. 제16조 (코인의 충전) ① 코인 충전은 신용카드, 휴대폰 결제 등 회사에서 제공하는 결제방식을 통해서 가능합니다. 단, 각 결제수단을 운영하는 사업자가 별도로 있는 경우, 이용자는 해당 결제수단을 이용하기 전에 해당 결제수단의 사업자가 제시하는 절차를 이행하여야 합니다. 회사의 서비스 이용요금을 결제할 때에는 해당 결제수단의 사업자가 제시하는 절차 이행 및 이용약관에 동의한 것으로 간주합니다. ② 코인 충전은 회사의 내부 정책에 의해 제공되는 단위로 충전할 수 있으며, 이때 선택된 결제수단별로 충전 단위가 상이할 수 있습니다. ③ 만 19세 미만의 미성년자가 신용카드, 휴대폰 결제, 실시간 계좌이체, 무통장 결제수단 등의 포인트류를 이용하여 코인을 충전할 때에는 법정대리인의 동의를 받아야 하며 결제 시 최대 월 7만 원까지의 요금이 부과될 수 있습니다. 단, 결제수단 운영 회사나 정부의 방침 등에 따라 각 결제수단별로 결제 한도가 부여될 수 있으며, 또한 회사는 특정 결제수단의 결제 한도를 부여할 수 있습니다. ④ 미성년자 결제에 대한 동의를 위해 법정대리인은 회사의 안내에 따라 ‘휴대폰인증’으로 일괄 동의할 수 있으며, 법정대리인의 동의가 완료된 이후 회사는 법정대리인에게 이메일을 통해 결제 동의 사실 및 그 내역에 대해 고지합니다. 미성년자인 이용자가 그 법정대리인의 동의를 받지 않고 요금 결제 등 의무부담 행위를 한 경우, 미성년자인 이용자 또는 그 미성년자의 법정대리인은 관련 법령에 따라 해당 계약을 취소할 수 있습니다. 단, 미성년자의 사술로 인한 경우는 제외됩니다. ⑤ 동의서 유효기간에 대해 미성년자의 법정대리인은 회사의 안내에 따라 "1개월/6개월/1년/3년/5년/탈퇴 시까지"의 유효기간 중 선택할 수 있으며, 회사는 법정대리인이 선택한 동의 유효기간 만료 시점으로부터 [30]일 전에 법정대리인에게 이메일을 통해 통지하여 동의 연장 여부를 확인하며, 이에 대해 법정대리인의 동의 철회 요구 등이 없을 경우 동의 유효기간은 동일한 조건으로 자동 연장됩니다. 단, 법정대리인이 동의 유효기간으로 1개월을 선택한 경우, 회사는 법정대리인에게 그 동의 유효기간 만료 시점 [7]일 전에 고지합니다. ⑥ 회사는 다음의 각 호에 해당하는 결제 신청에 대해서는 승인을 하지 않거나, 추후 해당 승인을 취소할 수 있습니다. 필수적 기재사항을 누락 또는 오기했거나 필수적 절차가 미비한 경우. 이용 요금을 납부하지 않거나 납부자를 확인할 수 없는 경우. 19세 미만의 미성년자가 법정대리인의 동의 없이 신청한 경우. 명의자의 동의나 승낙 없이 결제 수단을 무단 도용하여 이용 요금을 결제한 경우. 그 밖에 이용자의 귀책사유로 승인이 불가능하다고 판단되는 경우. ⑦ 회사는 다음의 각 호에 해당하는 경우에는 당해 사유가 해소될 때까지 승인을 제한할 수 있습니다. 이 경우 회사는 제23조에 따라 이용자에게 사전에 통지하여야 하나, 불가피한 경우 사후에 통지할 수 있습니다. 서비스 설비가 부족하여 만족스러운 서비스를 제공할 수 없다고 판단될 경우 서비스 상의 장애가 발생한 경우 컴퓨터 등 정보통신설비의 보수점검∙교체∙ 및 고장, 통신두절 등 기술적 장애가 발생한 경우 사업종목의 전환, 사업의 포기, 업체 간의 통합 등의 사유로 서비스를 제공할 수 없게 되는 경우 제17조 (코인 환불규정) ① 구입한 코인에 대한 환불은 다음 방법에 의하여 진행합니다. 카드결제를 통하여 코인을 구입한 후 실제 서비스를 이용한 내역이 없는 경우 : 카드결제 취소를 통하여 전체 금액을 환불합니다. 카드결제를 통하여 코인을 구입한 후 일부 이용내역이 있는 경우 : 잔여 코인에 대한 환불을 요청할 수 있습니다(단, 충전당시 회사가 제공한 단위별로 환불이 이루어지며, 환불 요청 이후에 코인을 사용한 이력이 있으면 환불을 받을 수 없습니다). ② 이용자가 무상으로 지급받은 코인이나 이미 사용한 코인은 현금으로 환불을 받을 수 없습니다. ③ 회원 탈퇴 시 또는 서비스 이용계약 해지 시, 이용자는 자신의 ID를 통해 충전한 코인의 잔여액은 전액 환불되는 것을 원칙으로 합니다. 이용자는 환불을 받기 위하여 환불을 위한 계좌번호를 회사에 제공하여야 합니다. 제17조의2 (콘텐츠 환불규정) ① CTF 콘텐츠 등 가분적이지 않은 콘텐츠는 다음 방법에 의하여 환불을 진행합니다. 콘텐츠를 이용하지 않은 상태인 경우 가. 7일 이내 환불을 요청하는 경우 : 결제취소로 전액 환불을 진행합니다. 나. 7일 경과 이후 환불을 요청하는 경우 : 결제액의 90%를 환불합니다. 콘텐츠를 일부라도 이용한 경우 : 환불이 불가능합니다. ② 강의 등 가분적인 콘텐츠는 다음 방법에 의하여 환불을 진행합니다. 콘텐츠를 이용하지 않은 상태에서 결제일로부터 7일 이내 환불을 요청하는 경우 : 결제취소로 전액 환불을 진행합니다. 콘텐츠를 일부라도 이용하였거나 결제일로부터 7일이 경과한 후 환불을 요청하는 경우 가. 수강기간이 1개월 이내일 경우 : (1)수강기간 절반이 경과하기 전에는 미수강분에 해당하는 결제액의 90%를 환불 받을 수 있으며, (2)수강기간 절반이 경과한 후에는 환불이 불가능합니다. 나. 수강기간이 1개월을 초과하는 경우 : 수강기간 만료 전까지 미수강분에 해당하는 결제액의 90%를 환불 받을 수 있습니다. ③ 본 조의 규정에 의하여 환불을 받는 경우, 환불 수단은 다음과 같습니다. 당해 콘텐츠 결제액 전액이 환불되는 경우 : 해당 결제 수단의 결제를 취소하는 방법(카드취소, 결제 코인 재지급 등)으로 환불이 진행됩니다. 당해 콘텐츠 결제액 일부가 환불되는 경우 가. 결제단위가 현금인 경우 : 현금을 계좌로 지급하는 방법으로 환불이 진행됩니다. 나. 결제단위가 코인인 경우 : 코인으로 지급하는 방법으로 환불이 진행됩니다. ④ 회사 서비스의 중대한 하자에 의해 콘텐츠가 손상, 훼손, 삭제되었거나 불량했을 경우 이용자의 선택에 따라 코인의 재충전, 또는 해당 콘텐츠의 복원 등으로 보상 받을 수 있습니다. 제18조 (유료 콘텐츠) ① 유료 콘텐츠란 이용자가 회사가 제공하는 결제 방식을 통해 책정된 유료 요금을 결제하여 구매 후 사용할 수 있는 서비스를 말합니다. ② 이용자는 회사에서 지정한 종류의 본인이 권리를 가지고 있는 저작물을 유료 콘텐츠로서 등록하도록 요청할 수 있습니다. 요청된 저작물은 회사의 판단에 따라 유료 콘텐츠로 등록되거나 등록이 거절될 수 있습니다. ③ 유료 콘텐츠의 경우 회사의 판단에 따라 회사는 유료로 등록된 것을 철회할 수 있습니다. ④ 불법적인 사용에 의한 콘텐츠는 회사가 파악하는 즉시 철회되며 등록자는 관련 법적 책임을 다해야 합니다. 제19조 (정기결제상품) ① 정기결제상품이란 최초 결제일의 일자(이하 “갱신일”) 마다 이용자가 신청한 일정한 결제수단을 통해 유료서비스 이용 요금의 결제를 자동으로 진행하고 해당 유료서비스를 제공하는 상품입니다. ② 특정 월에 존재하지 않는 날짜에 갱신일이 지정된 경우에, 가령 최초 결제일이 1월 31일인 경우 31일이 존재하지 않는 2월에는 최근접 말일인 2월 28일로 갱신일이 자동 지정됩니다. ③ 정기결제상품의 경우 이용자가 정해진 절차에 따른 별도의 해지 신청을 하지 않을 경우, 유료서비스의 실제 이용 여부와 상관없이 다음 갱신일이 도래할 경우 지정된 결제 수단으로 자동 청구 및 결제된 후 유료서비스 이용기간이 자동 갱신됩니다. ④ 등록된 결제 수단이 정상적으로 처리되지 않거나 결제가 실패하는 경우, 결제가 익일 자동으로 재시도됩니다. ⑤ ④와 같이 재시도 된 결제가 실패하는 경우, 정기결제상품의 주기적 결제가 정지됩니다. ⑥ 회사는 매월 갱신일 도래에 따른 요금 청구를 위해 정기결제상품이 해지되기 전까지 이용자의 결제관련정보를 보유할 수 있습니다. ⑦ 이용자는 정기결제를 해지 신청할 수 있으며, 정기 결제가 해지 신청된 상태에서 다음 갱신일이 도래했을 때 결제가 진행되지 않고 해지됩니다. ⑧ ⑦과 같이 해지 신청된 정기결제상품은, 이용자의 해지 신청 철회 요청을 받아 다시 활성화 될 수 있습니다. 갱신일이 도래하기 전에 활성화 된 경우 갱신일이 유지되며, 만약 갱신일이 도래한 후 활성화된 경우 활성화 한 날짜로 갱신일이 지정됩니다. ⑨ 정기결제상품의 이용요금이 갱신된 경우, 해당 정기결제상품을 신청한 이용자의 결제가 보류됩니다. ⑩ ⑨과 같이 보류된 정기결제상품은, 이용자의 재개 요청을 받아 다시 활성화 될 수 있습니다. 갱신일이 도래하기 전에 활성화 된 경우 갱신일이 유지되며, 갱신일이 도래한 후 활성화된 경우 활성화 한 날짜로 갱신일이 지정됩니다. ⑪ 타인의 결제정보를 동의없이 사용할 경우 민・형사상 책임을 지게 되며 관련 법령에 의해 처벌될 수 있습니다. 제20조 (광고성 정보, 맞춤형 정보 제공) ① 회사는 사용자에게 서비스와 관련된 광고성 또는 맞춤형 정보를 제공할 수 있습니다. ② 회사는 사용자에게 광고성 또는 맞춤형 정보를 전자 우편 등의 형식으로 제공할 수 있습니다. 다만, 사전에 광고성 또는 맞춤형 정보 제공에 대한 사용자의 수신 동의가 있는 경우와 같이 법령에 허용된 범위 안에서 제공됩니다. 제21조 (광고게재 및 광고주와의 거래에 관한 면책) ① 이용자는 서비스 이용 시 노출되는 광고게재에 대하여 동의합니다. ② 이용자는 회사는 서비스상의 광고에 게재되어 있는 내용과 서비스를 통한 광고주의 판촉활동은 회사와 무관하다는 사실을 인지하며, 이에 동의합니다. ③ 회사는 이용자가 본조의 광고주와의 거래에 참여하거나 광고주와 교신 또는 거래를 함으로써 발생하는 손실과 손해에 관하여 어떠한 경우에도 책임을 지지 않습니다. 제22조 (손해배상, 책임제한) ① 회사는 무료로 제공되는 서비스 이용과 관련하여 이용자에게 발생한 손해에 관하여는 책임지지 않습니다. 그러나 이용자의 고의 또는 중과실에 의한 경우에는 그러하지 아니합니다. ② 회사는 관련 법령상 허용되는 한도 내에서 서비스와 관련하여 본 약관에 명시되지 않은 어떠한 구체적인 사항에 대한 약정이나 보증을 하지 않습니다. 또한, 회사는 서비스에 게재된 정보, 자료, 사실의 신뢰도, 정확성 등에 대해서는 보증을 하지 않으며, 회사의 과실 없이 발생된 이용자의 손해에 대하여는 책임을 부담하지 아니합니다. ③ 회사는 회사의 과실 없이 발생된 아래와 같은 손해에 대해서는 책임을 부담하지 않습니다. 또한 회사는 법률상 허용되는 한도 내에서 간접 손해, 특별 손해, 결과적 손해, 징계적 손해, 및 징벌적 손해에 대한 책임을 부담하지 않습니다. 천재지변 또는 이에 준하는 불가항력의 상태에서 발생한 손해 이용자의 귀책사유로 서비스 이용에 장애가 발생한 경우 서비스에 접속 또는 이용과정에서 발생하는 개인적인 손해 제3자가 불법적으로 회사의 서버에 접속하거나 서버를 이용함으로써 발생하는 손해 제3자가 회사 서버에 대한 전송 또는 회사 서버로부터의 전송을 방해함으로써 발생하는 손해 제3자가 악성 프로그램을 전송 또는 유포함으로써 발생하는 손해 전송된 데이터의 생략, 누락, 파괴 등으로 발생한 손해, 명예훼손 등 제3자가 서비스를 이용하는 과정에서 발생된 손해 기타 회사의 고의 또는 과실이 없는 사유로 인해 발생한 손해 ④ 회사는 이용자가 서비스를 이용하여 기대하는 수익을 상실한 것에 대하여 책임을 지지 않으며 그 밖에 서비스를 통하여 얻은 자료로 인한 손해 등에 대하여도 책임을 지지 않습니다. ⑤ 회사는 회사의 과실이 없는 한 이용자 상호간 또는 이용자와 제3자 상호간에 서비스를 매개로 발생한 분쟁에 대해서는 개입할 의무가 없으며 이로 인한 손해를 배상할 책임도 없습니다. 제23조 (이용자에 대한 통지) ① 회사가 이용자에게 통지를 하는 경우 이용자의 서비스 계정에 등록된 이메일 주소로 이메일(이메일주소가 없는 경우 서비스 내 전자메시지 발송, 서비스 내 알림 메시지를 띄우는 등 별도의 전자적 수단)으로 할 수 있습니다. ② 회사가 이용자 전체에게 통지를 하는 경우 7일 이상 서비스 공지사항란에 게시함으로써 제1항의 통지에 갈음할 수 있습니다. 제24조 (권리 양도의 제한) 이용자는 서비스의 이용 권한, 기타 이용계약상 지위를 타인에게 양도·증여할 수 없으며, 담보로 제공할 수 없습니다. 제25조 (일부무효) 본 약관의 어느 규정(문장, 문구 또는 그 일부를 포함)이 무효이거나 집행이 불가능하게 되는 경우에도, 그로 인하여 다른 규정의 효력 또는 집행가능성에 영향을 주지 아니하며, 무효, 위법 기타 집행 불가능한 규정들은 당사자들이 별도의 조치를 취하지 않는 경우에도 그 조항의 원래 내용과 취지에 가능한 근접하면서도 무효, 위법 기타 집행 불가능하지 않은 내용으로 대체됩니다. 제26조 (준거법 및 분쟁의 해결) ① 본 약관 또는 서비스는 대한민국 법령에 의하여 규정되고 이행됩니다. ② 서비스 이용과 관련하여 회사와 이용자 간에 분쟁이 발생하면 이의 해결을 위해 성실히 협의할 것입니다. 그럼에도 불구하고 해결되지 않으면 서울중앙지방법원을 제1심 전속관할로 하는 소송절차에 의하여 해결합니다. 공고일자 : 2025년 1월 24일 시행일자 : 2025년 2월 24일 상단으로 이동 이전 서비스 이용 약관 열람하기 2020. 02. 03 서비스 이용 약관 2020. 08. 03 서비스 이용 약관 2021. 08. 16 서비스 이용 약관 2024. 05. 19 서비스 이용 약관 2025. 02. 24 서비스 이용 약관'''
