["https://dreamhack.io/career/positions/2"]
title = "Career | Dreamhack Career"
description = "Hackers' Playground, Dreamhack"
full_description = "공고 목록으로 돌아가기 Theori 공유하기 [Dreamhack] Content Creator Intern Previous slideNext slide 📝 지원하기(인턴) 📌 Dreamhack Content 팀을 소개합니다 사이버 보안은 컴퓨터 과학을 기반으로 하는 '응용 학문' 으로 기술이 가파르게 성장하며 그에 따른 사이버 보안과 해킹에 대한 연구가 등장하는 속도도 굉장히 빨라지게 되었습니다. 학습자가 컴퓨터 구조에 대한 기본 지식을 갖추었다는 전제 하에 교육이 진행되는 경우가 많고, 학습자는 다량의 정보 속 본인에게 필요한 자료를 탐색해 학습에 적용해야 했습니다. 사이버 보안을 처음 접하는 사람들은 굉장히 높은 진입 장벽을 느낄 수 밖에 없죠. 이에 Dreamhack Content팀은 보안 의식의 상향 평준화를 목표로 수준 높은 보안 교육 서비스를 제공해 보안 학습 입문자가 쉽고 효율적으로 컴퓨터 과학에 대한 기본 지식을 익힐 수 있도록 합니다. 또한, 각 학습의 Stage 별로 적합한 자료를 선별해 제시할 수 있는 방안을 연구하여 학습자가 학습에 대한 열정과 동기부여를 잃지 않을 수 있는 환경을 만듭니다. Dreamhack Content 팀 bincat : 사이버 보안을 누구나 쉽고 재밌게 공부할 수 있도록 Dreamhack 인터뷰 : Theori가 선도하는 차세대 보안 교육, Dreamhack 함께 할 업무입니다 Dreamhack에 업로드 되는 강의를 기획 및 작성하고 관리합니다. Dreamhack 학습자가 학습할 수 있도록 Wargame/CTF 문제를 제작하고 운영합니다. Dreamhack 학습자와 지속적으로 소통해 VoC를 수집하거나 시장의 동향을 파악해, 문제 해결에 대한 뾰족한 개선점을 도출합니다. 이런 경험을 가진 분을 찾습니다 컴퓨터 과학의 기본 지식에 대한 이해도를 갖추신 분 사이버 보안 학습 Stage가 어떻게 나뉘는 지 이해하고, 한 분야 이상을 학습해본 경험이 있으신 분 Wargame 플랫폼에서 문제를 제작하거나, CTF에 참여해본 경험이 있으신 분 이런 경험이 있다면 더 좋습니다 단체/동아리 구성원을 대상으로 교육을 진행해본 경험이 있으신 분 다양한 교육 플랫폼 서비스를 이용해본 경험이 있으신 분 비즈니스 영어 Speaking/Writing이 가능하신 분 CTF에 참여한 경험이 있으신 분 Wargame 혹은 CTF에 사용될 문제를 직접 제작해 본 경험이 있으신 분 사이버 보안에 대한 학습 과정을 꾸준히 업로드하는 블로그를 운영한 경험이 있으신 분 티오리 합류 여정 서류 전형 > 스킬 테스트 > 직무 인터뷰 > 컬쳐 인터뷰 > 합류 서류 전형 : 제출한 이력서를 면밀하게 검토합니다. 스킬 테스트 : 후보자님의 경험과 역량을 확인할 수 있는 과제를 부여해 상호간 직무 및 기술적 Fit를 확인합니다. 직무 인터뷰 : 제출 서류를 기반으로 후보자님의 경험과 기술에 대해 이야기합니다. 컬쳐 인터뷰 : 후보자님의 업무 방식과 가치관을 바탕으로 문화적 방향성에 대해 이야기합니다. 인재영입 절차는 포지션 및 고용 형태에 따라 달라질 수 있습니다. 지원 시 유의 사항 해당 포지션은 최소 3개월 함께 근무합니다. 서류 전형부터 최종 합격까지 최소 3주가 소요됩니다. 근무지 : 서울 강남구 테헤란로4길 14 (미림타워 9층) 근무시간 : 주 5일 / 오전 10시 ~ 오후 7시 (1일 8시간, 주 5일 근무, 유연 근무 가능) 인재영입 문의 : withtheori@theori.io 혜택 및 복지 자유롭게 몰두할 수 있는 환경을 만듭니다 자율 출퇴근 운영 유연한 근무 형태 별도 승인 없는 무제한 휴가 근속 3/5/8년마다 유급 리프레시 휴가 업무 장비 및 유료 소프트웨어 구입 지원 간식, 커피, 음료가 제공되는 스낵바 개인과 팀이 함께 성장합니다 해킹 대회, 도서비, 어학 학습 비용 지원 외부 세미나, 컨퍼런스, 교육 비용 지원 매년 자율 연구 기간 운영 사내 스터디 동호회 / 동아리 활동 지원 신규 입사자 대상 멘토링 인재 채용 추천 보상금 지급 건강하고 행복한 삶을 지원합니다 점심 식대 출산 휴가 및 육아 휴직 제공 매월 컬처데이 진행 (영화, 공연 등) 야간 근무 시 식비 및 교통비 지원 매년 건강검진 지원 각종 경조사비 및 경조품 지원 티오리 더 알아가기 Theori Culture Blog : 함께 만들어온, 함께 만들어가는 티오리 Theori TV : 우리가 잘 몰랐던 '진짜 해커들'의 이야기 Theori Newsroom : 티오리 최신 뉴스와 인사이트 회사 정보 Theori 사원수 50~300명 주소 서울 강남구 테헤란로4길 14 설립 연도 2016년 홈페이지 https://theori.io 로그인이 필요합니다. 채용 공고를 올리고 드림핵의 보안 인재를 만나 보세요! 커리어 서비스 시작하기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
