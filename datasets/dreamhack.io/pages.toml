["https://dreamhack.io/enterprise/introduction/manage-details"]
title = "관리 | Dreamhack Enterprise"
description = "편리한 관리 시스템을 통해 학습자의 상태를 파악하고 체계화된 추적을 지원합니다."
full_description = "Management 편리한 관리 시스템을 통해 학습자의 상태를 파악하고 체계화된 추적을 지원합니다. 보안 분야를 잘 모르더라도 손쉽게 관리할 수 있어요. Dreamhack의 모든 관리 기능은누구나 간단히 사용할 수 있습니다. 학습자들의 학습태도를체계적으로 추적합니다. 다양한 평가시스템을 통해 학습자들의순위를 매기거나 평가할 수 있습니다. Dreamhack의 모든 관리 기능은누구나 간단히 사용할 수 있습니다. 학습자들의 학습태도를 체계적으로추적합니다. 다양한 평가시스템을 통해 학습자들의순위를 매기거나 평가할 수 있습니다. 관리자를 위한 커리큘럼 생성 및 관리 기능 대상 수강자가 수강하는 분야와 난이도를 설정하면 커리큘럼을 손쉽게 생성할 수 있습니다. 필요에 따라 커리큘럼 진행 이후 학습 성과 지표를 확인할 수 있는 CTF를 커리큘럼이 수강한 분야와 난이도 및 진도에 맞춰 자동으로 생성합니다. 필요에 따라 별도의 응용 능력을 요구하는 도전 과제를 추가하여 제공된 학습 자료 이상으로 학습할 수 있습니다. 기관의 수업 형태에 따른 커리큘럼 설정 및 진행도 추적 주간 과제 커리큘럼: 정해진 주 단위로 나누어 강의 및 실습 문제를 해결합니다. 통합 과제 커리큘럼: 지정한 종료일까지 모든 강의 및 실습 문제를 해결합니다. 생성된 커리큘럼의 형태에 따라 수강자들은 자동으로 메일을 통해 과제 정보를 주기적으로 전달받습니다. 수강자 학습 부정행위 탐지 기능 수강자의 IP, 가상 환경 생성 기록 등 다양한 측면의 자료를 활용해 부정행위를 탐지합니다. 만약 올바른 경로로 해결하지 못했다면 관리자에게 학습 부정행위 사실을 전달합니다. 관리자를 위한 커리큘럼 생성 및 관리 기능 수강자들의 진행 상황을 한 눈에 확인할 수 있습니다. 기관의 수업 형태에 따른 커리큘럼 설정 및 진행도 추적 주간 과제 커리큘럼, 통합 과제 커리큘럼 등 기관이 희망하는 학습 일정 관리 형태에 따라적절한 진행도 관리 시스템을 제공합니다. 수강자 학습 부정행위 탐지 기능 올바른 학습으로 이어질 수 있도록 수강자들의 기록을 통해 자동으로 검증합니다. FAQs Dreamhack Enterprise를 도입하려면 어떻게 해야하나요? Dreamhack Enterprise 도입 문의는 페이지 상단의 도입 문의 버튼을 클릭하시거나 dreamhack@dreamhack.io 로 문의해 주시면 안내해 드리고 있습니다.해당 메일로 기관명, 담당자명, 연락처와 전달하고 싶은 내용을 작성하여 발송해 주시면 빠르게 안내해 드리도록 하겠습니다.일반 Dreamhack 유저와 Dreamhack Enterprise를 사용하게 되었을 때의 차이점은 무엇인가요? Dreamhack Enterprise를 이용하시면, 관리자 측면에서 일반 Dreamhack 유저들에게는 제공되지 않는 학습자 관리 기능과 대회 개최 권한 등을 이용하실 수 있게 됩니다.또, 일반 Dreamhack 유저보다 더 빠르게 신규 강의를 만나볼 수 있으며, Enterprise 학습자들에게만 제공되는 다양한 전용 문제들에 접근할 수 있게 됩니다.자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요.보안에 대한 전문적인 지식이 없어도 Dreamhack Enterprise를 잘 이용할 수 있을까요? 알아보기 쉽고 직관적인 지표를 통해, 보안에 대한 전문적인 지식이 없더라도 학습자들을 손쉽게 관리할 수 있습니다.또, 이용 기간동안 Dreamhack 팀 또한 그동안의 노하우를 통해 기관에 적합한 학습 방법을 추천해 드립니다.Dreamhack Enterprise는 기업에서만 사용할 수 있나요? 이용을 원하시는 기관이라면 기업 뿐만 아니라 공공기관, 교육기관 등 어떤 곳이든 서비스를 제공해 드리고 있습니다.Dreamhack Enterprise는 어떤 기관에게 적절한 서비스 인가요? 일회성 보안 교육에 그치지 않고 아니라 전사적, 영구적으로 보안 역량을 끌어올리고 싶은 기관, 보안 역량 향상을 위한 체계적인 시스템을 갖추고 싶은 기관,사내에 보안 학습에 대한 문화를 정착시키고 싶은 기관 등에 적합합니다.Dreamhack Enterprise의 가격 정책은 어떻게 되나요? 이용하시길 원하는 기간과 인원에 따라 상이합니다. 자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요. Dreamhack Enterprise Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요. 엔터프라이즈 소개서 받기 엔터프라이즈 도입 문의 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
