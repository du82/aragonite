full_description = '공지사항 2025년 1월의 드림핵 노트 🐍 Dreamhack 대표 업적 없음 댓글 4 안녕하세요! 드림핵입니다👋 2025년 새해가 찾아왔습니다. 여러분에게 2024년은 어떤 해였나요? 2025년은 어떠한 해로 만들고 싶으신가요? 즐거웠던 2024년의 순간과 앞으로 찾아올 2025년의 성취에서 꼭 드림핵이 꼭 함께이길 바랍니다! 2025년 첫 드림핵 노트는 아래의 소식을 담고 있습니다! Dreamhack CTF Season 6️⃣ 결산 📌 Season 7️⃣ 은 바로 이번 주부터 시작합니다 외부 대회 문제 포팅 🆕 📌 카포전, BISC CTF, Warp CTF의 문제들을 드림핵에서 만나보세요 기능 업데이트 및 오탈자 수정도 담고 있으니, 이번 달의 드림핵 노트도 많이 확인해 주시길 바랍니다! ────────────────────────────────────────────────────────── Dreamhack CTF Season 6️⃣ 결산 2024년 7월부터 12월에 걸쳐 진행된 Dreamhack CTF Season 6가 마무리되었습니다! 이번 시즌에서도 많은 분들이 뜨거운 열정과 뛰어난 실력으로 대회에 참여해 주셨습니다. 그 어느 때보다도 흥미진진했던 순간들을 함께 돌아보시죠! 참가 하이라이트 총 참가자 수: 올해 14번의 대회 동안 총 [1,445명]이 참가했습니다. Season 6 개근 참가자: Yu_212,K_J님께 특별한 감사를 드립니다! 두분 모두 Dreamhack CTF Season 6에 총 14번, 즉 모든 CTF에 참여해 주셨습니다. 다시 한번 감사드립니다! 문제 해결 통계 각 분야에서 참가자들이 문제를 해결하며 멋진 도전을 보여주셨습니다. 그 중 가장 많이 풀린 문제 TOP3를 소개합니다! 많은 분들이 해결에 성공한 만큼 꼭 필요한 기초적인 부분을 다루고 있으니, 여러분도 한번 도전해 보시는 건 어떠세요? - TOP 1: simple-phparse From Round #2 (133명 해결) - TOP 2: STREAMer-Prototype From Round #8 (117명 해결) - TOP 3: baby-Case From Round #4 (100명 해결) 한편, 가장 적게 풀린 문제들도 소개합니다. 많은 참가자들을 좌절시킨 강자들을 이번 기회에 쓰러뜨려 보세요! - TOP 1: QWIV:INCEPTION From Round #3 (1명 해결) - TOP 2: Amo-knows-nothing From Round #11 (1명 해결) - TOP 3: Spooky Little Ghost From Round #7 (2명 해결) 여러분의 의견이 중요합니다 이제 여러분의 이야기를 댓글을 통해 들려주세요! 올해 가장 좋았던 대회는 무엇이었나요? 그리고 그 이유는 무엇인가요? 특정 문제, 대회의 컨셉, 도전과 플래그 획득까지의 과정에서 느낀 즐거움 등 어떤 점이 가장 좋았는지 공유해주세요. 해결했거나 해결하지 못했던 문제 중에서 가장 기억에 남는 문제는 무엇이었나요? 대회 운영이나 문제 구성에서 개선되었으면 하는 점이 있다면 무엇인가요? 여러분의 의견은 더 나은 대회를 만드는 데 큰 힘이 됩니다. 2025년 Season 7을 향해 Season 7은 바로 이번주 토요일부터 개최됩니다! 2025년에 치뤄지는 Dreamhack CTF도 잊지말고 꼭 참여해 주세요! 바로 참여하러 가기! 외부 대회 문제 포팅 🆕 드림핵에서는 여러분이 더 다양한 문제를 접하고 도전할 수 있도록 외부 대회 문제를플랫폼에 포팅하고 있습니다. 이번에는 아래 세개 대회 문제들이 드림핵에 추가되었습니다: BISC CTF Warp CTF 포카전 CTF 아쉽게 이 대회들에 참여하지 못하신 분들은 이제 드림핵에서 도전해 보세요! 혹시 드림핵을 통해서 CTF를 개최해보고 싶으신가요? 언제든지 드림핵 이메일을 통해 연락 주세요! 그 외 업데이트 🐛 Enterprise - 수강자 학습 데이터가 비정상적으로 출력되던 문제를 수정했습니다. 🐛 Enterprise - 일부 엔터프라이즈 유저들이 클라우드 로드맵에 접근할 수 없던 문제를 수정했습니다. 🐛 Ranking - CTF 순위가 랭킹 페이지와 마이페이지에서 서로 다르게 출력되던 문제를 수정했습니다. 🐛 Lecture - Exploit Tech: Return to Library 강의에서 ret의 값이 실제 값과 다른 값으로 적혀있던 것을 수정했습니다. 🔧 Lab - 랩 기능의 1차 테스트가 종료되어 개선 및 패치가 진행 중입니다. 패치가 진행되는 동안 랩 기능이 비활성화됩니다. 강의 오탈자 제보 <컴퓨터 과학 기초> 0111 -> 0011 <Exploit Tech: Meet-in-the-middle Attack> 분석하겠습니다암 -> 분석하겠습니다. <레지스트리> [root]\Windows\Users[UserName]\NTUSER.DAT [root]\Windows\Users[UserName]\AppData\Local\Microsoft\Windows\UsrClass.dat -> [root]\Users[UserName]\NTUSER.DAT [root]\Users[UserName]\AppData\Local\Microsoft\Windows\UsrClass.dat <FAT32, NTFS 파일시스템> Turn Offset -> Run Offset ────────────────────────────────────────────────────────── 항상 감사합니다! 드림핵 노트를 통해서 보고 싶은 내용이 있다면 댓글로 알려주세요! 다음달 드림핵 노트에서 만나요!👋 작성자 정보 Dreamhack Dreamhack 관리자 2025.01.08. 16:13 (수정됨) 댓글 4 T43W00 고목 2개월 전 🙌 Translate DA2RIM 리버싱 졸업 2개월 전 😊😊👍👍 Translate 마롱 세계수 2개월 전 🩷 Translate numbbvi 대표 업적 없음 2개월 전 ૮〰.〰ა Translate 공지사항 다른 글 전체 보기 제목작성 시간[드림핵 우수 후기 이벤트] 후기만 작성해도 쏟아지는 상품! 🎁 [] 2025.03.05. 2025년 2월의 드림핵 노트 📜 [] 2025.02.11. 2025년 1월의 드림핵 노트 🐍 [4] 2025.01.07. 12월의 드림핵 노트 ❄️ [1] 2024.12.06. 🎉 50000명 이벤트 당첨자 안내! 🎉 [10] 2024.11.29. 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337'
