full_description = "LG Electronics 스마트 라이프 솔루션 기업, 보안 교육에서도 선두를 달리다 LG전자는 고객의 다양한 공간과 경험을 연결, 확장하는 '스마트 라이프 솔루션' 기업으로, 가전 분야 뿐 아니라 스마트홈, 모빌리티, 로보틱스 등 다양한 분야에서 인공지능과 사물인터넷, 통신 기술 등 최첨단 소프트웨어 기술을 도입해 사람들에게 더 많은 편리함을 제공하고 있습니다. 드림핵 Enterprise 도입 배경 가전제품에 더 많은 소프트웨어 기술이 도입된다는 것은 곧 기업이 관리해야 하는 공격 표면(Attack Surface)이 늘어났음을 의미합니다. 블랙햇 해커(악의적인 공격자)들의 해킹 수단은 점점 더 교묘해지고 있고, 실제로 가전제품에 포함된 사물인터넷을 통한 해킹 사례가 잇달아 발생하며 소비자들에게 피해가 유발되고 있습니다. 또, 견고한 보안 방화벽을 구축해 관리하더라도 내부 인원 한 사람의 실수로 인해 공든 탑이 무너지는 사례가 연달아 발생하면서 기업은 더 많은 공격 표면을 자체적으로 관리할 수 있는 보안 역량이 필요하게 되었습니다. 드림핵을 선택한 이유 LG전자는 임직원들의 보안 역량 강화를 위해 체계적인 교육 시스템 도입이 필요했습니다. 특히, • 구성원들이 자기주도적으로 학습을 이어갈 수 있고, • 개인별 학습 진도율 파악드림핵 Enterprise 도입 배경이 용이하며, • 마지막으로 CTF 개최 시스템을 통해 구성원들의 실질적인 역량 향상 파악이 가능한 '드림핵'을 선택했고,실제 교육 후 유의미한 성과를 체감하며 2년 이상 드림핵 프로그램을 도입하고 있습니다.도입 효과 LG전자는 드림핵의 로드맵을 테마별로 엮은 트랙을 사용해 드림핵을 활용했습니다. 리버싱과 웹해킹을 학습하는 웹 트랙, 리버싱과 시스템해킹을 학습하는 임베디드 트랙, 그리고 리버싱과 웹해킹, 시스템해킹을 모두 학습하는 통합 트랙까지 LG전자가 필요한 부분들을 직접 선택해 교육 트랙을 개설할 수 있었습니다. 또한 학습자들은 각 사업부에서 필요로 하거나 본인이 희망하는 교육 트랙을 자유롭게 선택해 자기주도적 학습을 할 수 있었습니다. 스마트제어연구소, 리빙솔루션 사업부, 소프트웨어 플랫폼 연구소, 소프트웨어 공학연구소 등 다양한 사업조직의 구성원들이 드림핵 프로그램에 참여했고, 베트남 법인의 R&D 인원도 적극 활용했습니다. 사내 해킹대회(CTF)도 만족도 높았던 교육 프로그램 중 하나였습니다. 무엇보다 구성원들의 보안 역량 향상으로 내부 보안이 더욱 견고해질 수 있었습니다. 드림핵 Enterprise 도입 배경 가전제품에 더 많은 소프트웨어 기술이 도입된다는 것은 곧 기업이 관리해야 하는 공격 표면(Attack Surface)이 늘어났음을 의미합니다. 블랙햇 해커(악의적인 공격자)들의 해킹 수단은 점점 더 교묘해지고 있고, 실제로 가전제품에 포함된 사물인터넷을 통한 해킹 사례가 잇달아 발생하며 소비자들에게 피해가 유발되고 있습니다. 또, 견고한 보안 방화벽을 구축해 관리하더라도 내부 인원 한 사람의 실수로 인해 공든 탑이 무너지는 사례가 연달아 발생하면서 기업은 더 많은 공격 표면을 자체적으로 관리할 수 있는 보안 역량이 필요하게 되었습니다.드림핵을 선택한 이유 LG전자는 임직원들의 보안 역량 강화를 위해 체계적인 교육 시스템 도입이 필요했습니다. 특히, • 구성원들이 자기주도적으로 학습을 이어갈 수 있고, • 개인별 학습 진도율 파악드림핵 Enterprise 도입 배경이 용이하며, • 마지막으로 CTF 개최 시스템을 통해 구성원들의 실질적인 역량 향상 파악이 가능한 '드림핵'을 선택했고,실제 교육 후 유의미한 성과를 체감하며 2년 이상 드림핵 프로그램을 도입하고 있습니다.도입 효과 LG전자는 드림핵의 로드맵을 테마별로 엮은 트랙을 사용해 드림핵을 활용했습니다. 리버싱과 웹해킹을 학습하는 웹 트랙, 리버싱과 시스템해킹을 학습하는 임베디드 트랙, 그리고 리버싱과 웹해킹, 시스템해킹을 모두 학습하는 통합 트랙까지 LG전자가 필요한 부분들을 직접 선택해 교육 트랙을 개설할 수 있었습니다. 또한 학습자들은 각 사업부에서