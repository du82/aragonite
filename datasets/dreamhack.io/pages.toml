full_description = "공지사항 12월의 드림핵 노트 ❄️ Dreamhack 대표 업적 없음 댓글 1 안녕하세요! 드림핵입니다! 어느새 12월이 시작되었습니다! 올 한 해도 잘 마무리하시길 바라며, 남은 연말도 드림핵과 함께해 주세요! 12월의 드림핵 노트는 아래의 소식을 담고 있습니다! 50000명 돌파 이벤트 돌아보기 📌 참여해 주신 드림핵 유저 여러분 모두 감사합니다! Dreamspace Coming Soon 📌 어려운 가상환경 설정을 쉽게 Dreamhack CTF Season 6 마무리 예고 📌 남은 2번의 CTF도 함께해 주세요 기능 업데이트 및 오탈자 수정도 담고 있으니, 이번 달의 드림핵 노트도 많이 확인해 주시길 바랍니다! ────────────────────────────────────────────────────────── 50000명 돌파 이벤트 돌아보기 유저 여러분과 함께 만들어간 50000명 이벤트가 무사히 종료되었습니다! 멋진 그림과 훌륭한 워게임을 만들어주신 모든 분들께 이 자리를 빌어 다시 한번 감사드립니다. 팬아트와 워게임 콘테스트, 응모권 이벤트의 당첨 여부는 🎉50000명 이벤트 당첨자 안내!🎉에서 확인할 수 있습니다! 당첨되신 분들께는 모두 메일을 통해 안내해 드렸으니, 메일함의 소식을 놓치지 마세요! Dreamspace Coming Soon 드림핵의 강의 내용들을 학습하기 위해서는 다양한 툴의 사용법을 익혀야 합니다. 이중에서도 VM 설치 및 세팅은 초심자분들이 많이 어려워하셨는데요, 그런 난관을 해소하고자, 드림핵에서는 Dreamspace라는 새로운 서비스를 준비하고 있습니다! Dreamspace를 이용하면 복잡한 VM 설치 및 세팅 과정 없이도 학습에 활용할 수 있는 VM 환경이 생성됩니다. 이를 통해 보안에 막 입문하신 분들의 허들을 크게 낮추고, 동시에 많은 드림핵 유저 여러분의 편의성이 개선되길 기대합니다. Dreamspace는 현재 개발 단계에 있으며, 준비가 되는 대로 여러분에게 선보이도록 하겠습니다. 하루빨리 Beta 버전을 제공할 수 있도록 노력중이니, 조금만 기다려 주세요! Dreamhack CTF Season 6 마무리 예고 24년 하반기를 함께 했던 Dreamhack CTF Season 6도 어느새 막바지를 향해 달려가고 있습니다. 이제 12월의 CTF 2회만 남은 상태인데요. 2025 닷핵 컨퍼런스에서 펼쳐질 Dreamhack Invitational에 관심이 있으신 드림핵 유저분들은 이 마지막 기회를 꼭 놓치지 마시길 바랍니다! Dreamhack CTF Season 6 Round #13 (🚩Div1) 참여신청하러 가기(이번 주 개최!) Dreamhack CTF Season 6 Round #14 (🌱Div2) 참여신청하러 가기 그 외 업데이트 🐛 Quiz - 일부 퀴즈에서 중복된 문제가 출제되던 문제를 수정했습니다. 🐛 Lecture - $LogFile, $UsnJrnl에서 URL이 작동하지 않던 문제를 수정했습니다. 🐛 Lecture - 일부 강의의 난이도가 알 수 없음으로 표기되던 문제를 수정했습니다. 강의 오탈자 제보 <Exercise: Helloworld> *2., 3.* -> 기울임 삭제 <Stored XSS 실습> Stored XSS를 수행해보세요. -> Reflected XSS를 수행해보세요. <[WHA-S] Background: SQL DML> INSERT 구문 -> UPDATE 구문 <Exploit Tech: Meet-in-the-middle Attack> 전체 암호화 기능은 cipher1로 암호화한 후 cipher2로 복호화하는 방식으로 진행됩니다. 복호화 기능은 암호화 기능의 역연산으로, cipher2로 암호화한 후 cipher1로 복호화하는 방식으로 진행됩니다. -> 전체 암호화 기능은 cipher1로 암호화한 후 cipher2로 암호화하는 방식으로 진행됩니다. 복호화 기능은 암호화 기능의 역연산으로, cipher2로 복호화한 후 cipher1로 복호화하는 방식으로 진행됩니다. ─────────────────────────