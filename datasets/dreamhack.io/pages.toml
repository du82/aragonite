title = "Dreamhack | 공지사항 | Dreamhack"
description = "Hackers' Playground, Dreamhack"
full_description = "공지사항 [신규 로드맵] Secure Coding(C, React), Linux Kernel Hacking 엔터프라이즈 대상 공개! Dreamhack 대표 업적 없음 댓글 2 안녕하세요, 드림핵입니다! 항상 드림핵과 함께해 주셔서 감사합니다. 2024년 10월 16일, 새로운 로드맵이 무려 3종이나 공개됩니다! Secure Coding - C Secure Coding - Front-End (React) Linux Kernel Hacking Basic Secure Coding - C 로드맵은 메모리 안전 문제로 발생할 수 있는 보안 취약점을 예방 방법을 학습하는 강의입니다. C 언어의 보안 취약점을 다양한 사례와 실습을 통해 이해하고, 이를 개선하는 방법을 익힐 수 있습니다. 강의는 이론 학습, 퀴즈, 패치 실습으로 구성되어 실제 개발 환경에서 안전하게 코드를 작성할 수 있도록 돕습니다. Secure Coding - Front-End (React) 로드맵은 리액트를 활용하여 프론트엔드 보안 취약점과 그 대응 방안을 학습하는 강의입니다. 프론트엔드에서 발생할 수 있는 다양한 보안 취약점에 대해서 이해하고, 해당 취약점을 실습 문제와 패치 문제를 통해서 복습하는 시간을 가집니다. 해당 강의를 통해서 리액트로 프론트엔드를 개발할 때 안전한 코드를 작성할 수 있도록 돕습니다. Linux Kernel Hacking Basic 로드맵은 시스템 해킹과 심화 과정을 이수한 분들을 대상으로, 리눅스 커널의 보안 취약점을 깊이 있게 다루는 강의입니다. 커널의 구조와 보호 기법, 취약점 유형을 알아보고 이를 우회하여 로컬 권한 상승 방법을 학습합니다. 최종적으로 CVE 악용 실습을 통해 실제 리눅스 커널 공격 방법을 이해할 수 있습니다. 신규 3종 로드맵은 모두 2025년 4월 16일까지 드림핵 엔터프라이즈를 이용해주시고 계신 기관에게만 선제적으로 제공됩니다! 앞으로도 드림핵은 여러분의 보안 역량 향상을 위해 최선을 다하겠습니다. 감사합니다. 드림핵 드림 작성자 정보 Dreamhack Dreamhack 관리자 2024.10.16. 14:00 댓글 2 햄부기 대표 업적 없음 5개월 전 캬... 너무 감사합니다 정말.. Translate vulnbug 대표 업적 없음 3개월 전 2025년 4월 16일 이후에는 일반에도 공개되나요? 엔터프라이즈 회원이 아니라 서럽습니다ㅜㅜ Translate 공지사항 다른 글 전체 보기 제목작성 시간[드림핵 우수 후기 이벤트] 후기만 작성해도 쏟아지는 상품! 🎁 [] 2025.03.05. 2025년 2월의 드림핵 노트 📜 [] 2025.02.11. 2025년 1월의 드림핵 노트 🐍 [4] 2025.01.07. 12월의 드림핵 노트 ❄️ [1] 2024.12.06. 🎉 50000명 이벤트 당첨자 안내! 🎉 [10] 2024.11.29. 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
