full_description = "국민대학교 미래혁신단(미래자동차사업단) 자동차 모빌리티 분야 최고 대학, 자동차 사이버보안의 미래를 준비하다 국민대학교(총장 정승렬)는 자동차 강국인 대한민국 자동차 산업의 위상에 부합하는 자동차 분야 전문인재를 양성하기 위해 정부 및 자동차 산업체의 전폭적인 지원 하에 국내 최초의 자동차 전문 단과대학인 자동차융합대학을 설립하는 등 자동차 분야의 인재를 양성해 내는 데 있어 국내 선두를 달리고 있는 대학교입니다. 또한, 국민대학교 미래혁신단은 첨단분야 혁신융합대학사업을 주관하면서 대학 간, 학과 간 경계를 허물고 학생이라면 누구나 원하는 첨단 분야의 교육을 받을 수 있도록 지원하고 있습니다. 드림핵 Enterprise 도입 배경 2015년 찰리 밀러와 크리스 발라섹의 블랙햇(Black Hat) 컨퍼런스 발표는 자동차 보안의 중요성을 전 세계에 각인시켰습니다. 이 사건은 중형 SUV 차량의 제어권을 해커가 원격으로 탈취하는 데 성공한 사례로, 이는 자동차 모빌리티 분야에서 사이버보안이 중요한 요소임을 명확히 했습니다. 시간이 지나면서 자동차뿐만 아니라 UAM 같은 다양한 모빌리티에 내재된 소프트웨어는 더욱 고도화되고 있으며, 자율주행 시스템을 비롯한 AI가 통합된 복잡한 시스템이 도로와 상공의 모빌리티를 새롭게 정의하고 있습니다. 이러한 배경을 깊이 인식하며, 국민대는 자동차 모빌리티 분야에서 보안 역량이 핵심적인 인재 양성의 중요 요소임을 강조합니다. 따라서 국민대 미래혁신단(미래자동차사업단)은 학생들에게 실질적이고 혁신적인 보안 교육을 제공하기 위해 노력하고 있습니다. 구체적으로, 최신 사이버보안 도전 과제에 대응하는 실습 중심의 교과목 개발, 산업계 전문가와의 워크숍 개최, 그리고 실제 사례 연구를 통한 프로젝트 기반 학습을 포함한 다양한 프로그램을 운영하고 있습니다. 이러한 노력은 학생들이 이론과 실무를 겸비한 보안 전문가로 성장할 수 있는 토대를 마련할 것입니다. 더불어, 국민대는 산업계와의 긴밀한 협력을 통해 실시간으로 변화하는 보안 위협에 대응할 수 있는 연구와 개발에 주력하고 있습니다. 이는 학생들이 최신의 기술과 방법론을 학습할 수 있는 기회를 제공함으로써, 졸업 후에도 지속적으로 산업계의 발전에 기여할 것입니다. 이처럼, 국민대는 자동차 모빌리티 분야에서 사이버보안의 필수성을 인식하고, 학생들의 보안 역량 향상을 위한 고품질의 교육 콘텐츠를 제공하기 위해 다각적으로 노력하고 있습니다. 드림핵을 선택한 이유 드림핵에는 사이버보안 초보자를 위한 '드림 비기너즈' 프로그램부터 자동차 보안의 기초가 되는 시스템 해킹, 리버스 엔지니어링 그리고 실제 하드웨어의 내장된 프로그램을 해킹하는 임베디드 해킹까지 다양한 수준의 커리큘럼이 제공되고 있어, 자동차 사이버보안 분야의 이해와 능력을 효과적으로 키울 수 있으리라 판단했습니다. 또한, 위와 같은 고 품질의 커리큘럼들을 각 학생들의 수준에 맞게 제공해 줄 수 있다는 점도 드림핵과 함께 하게 된 이유입니다.도입 효과 국민대 미래혁신단(미래자동차사업단)은 드림핵 엔터프라이즈 서비스를 활용하기 위해 MOU 및 구독형 라이센스 계약을 체결했습니다. 학생들은 수준별로 드림 비기너즈, 시스템 해킹 기초, 시스템 해킹 심화, 리버스 엔지니어링, 임베디드 해킹 등 총 다섯 가지 과정 중에서 학기 당 최대 세 과정까지 선택하여 학습할 수 있습니다. 또한, 일정 수준 이상의 성과를 거둔 학생들에게는 학점으로 인정받을 수 있는 기회를 제공함으로써, 학생들의 성실한 학습을 독려하고 있습니다. 추가적으로, 학생들이 하드웨어 해킹을 직접 실습할 수 있는 오프라인 실험 공간을 준비 중이고, 해당 공간이 마련되면 하드웨어 해킹 분야의 강의도 신규로 운영할 계획입니다. 이는 학생들이 실제 환경에서의 해킹 실습을 통해 이론과 실습을 병행할 수 있는 더욱 풍부한 학습 기회를 제공하게 될 것입니다. 드림핵 Enterprise 도입 배경 2015년 찰리 밀러와 크리스 발라섹의 블랙햇(Black Hat) 컨퍼런스 발표는 자동차 보안의 중요성을 전 세계에 각인시켰습니다. 이 사건은 중형 SUV 차량의 제어권을 해커가 원격으로 탈취하는 데 성공한 사례로, 이는 자동차 모빌리티 분야에서 사이버보안이 중요한 요소임을 명확히 했습니다. 시간이 지나면서 자동차뿐만 아니라 UAM 같은 다양한 모빌리티에 내재된 소프트웨어는 더욱 고도화되고 있으며, 자율주행 시스템을 비롯한 AI가 통합된 복잡한 시스템이 도로와 상공의 모빌리티를 새롭게 정의하고 있습니다. 이러한 배경을 깊이 인식하며, 국민대는 자동차 모빌리티 분야에서 보안 역량이 핵심적인 인재 양성의 중요 요소임을 강조합니다. 따라서 국민대 미래혁신단(미래자동차사업단)은 학생들에게 실질적이고 혁신적인 보안 교육을 제공하기 위해 노력하고 있습니다. 구체적으로, 최신 사이버보안 도전 과제에 대응하는 실습 중심의 교과목 개발, 산업계 전문가와의 워크숍 개최, 그리고 실제 사례 연구를 통한 프로젝트 기반 학습을 포함한 다양한 프로그램을 운영하고 있습니다. 이러한 노력은 학생들이 이론과 실무를 겸비한 보안 전문가로 성장할 수 있는 토대를 마련할 것입니다. 더불어, 국민대는 산업계와의 긴밀한 협력을 통해 실시간으로 변화하는 보안 위협에 대응할 수 있는 연구와 개발에 주력하고 있습니다. 이는 학생들이 최신의 기술과 방법론을 학습할 수 있는 기회를 제공함으로써, 졸업 후에도 지속적으로 산업계의 발전에 기여할 것입니다. 이처럼, 국민대는 자동차 모빌리티 분야에서 사이버보안의 필수성을 인식하고, 학생들의 보안 역량 향상을 위한 고품질의 교육 콘텐츠를 제공하기 위해 다각적으로 노력하고 있습니다.드림핵을 선택한 이유 드림핵에는 사이버보안 초보자를 위한 '드림 비기너즈' 프로그램부터 자동차 보안의 기초가 되는 시스템 해킹, 리버스 엔지니어링 그리고 실제 하드웨어의 내장된 프로그램을 해킹하는 임베디드 해킹까지 다양한 수준의 커리큘럼이 제공되고 있어, 자동차 사이버보안 분야의 이해와 능력을 효과적으로 키울 수 있으리라 판단했습니다. 또한, 위와 같은 고 품질의 커리큘럼들을 각 학생들의 수준에 맞게 제공해 줄 수 있다는 점도 드림핵과 함께 하게 된 이유입니다.도입 효과 국민대 미래혁신단(미래자동차사업단)은 드림핵 엔터프라이즈 서비스를 활용하기 위해 MOU 및 구독형 라이센스 계약을 체결했습니다. 학생들은 수준별로 드림 비기너즈, 시스템 해킹 기초, 시스템 해킹 심화, 리버스 엔지니어링, 임베디드 해킹 등 총 다섯 가지 과정 중에서 학기 당 최대 세 과정까지 선택하여 학습할 수 있습니다. 또한, 일정 수준 이상의 성과를 거둔 학생들에게는 학점으로 인정받을 수 있는 기회를 제공함으로써, 학생들의 성실한 학습을 독려하고 있습니다. 추가적으로, 학생들이 하드웨어 해킹을 직접 실습할 수 있는 오프라인 실험 공간을 준비 중이고, 해당 공간이 마련되면 하드웨어 해킹 분야의 강의도 신규로 운영할 계획입니다. 이는 학생들이 실제 환경에서의 해킹 실습을 통해 이론과 실습을 병행할 수 있는 더욱 풍부한 학습 기회를 제공하게 될 것입니다. FAQs Dreamhack Enterprise를 도입하려면 어떻게 해야하나요? Dreamhack Enterprise 도입 문의는 페이지 상단의 도입 문의 버튼을 클릭하시거나 dreamhack@dreamhack.io 로 문의해 주시면 안내해 드리고 있습니다.해당 메일로 기관명, 담당자명, 연락처와 전달하고 싶은 내용을 작성하여 발송해 주시면 빠르게 안내해 드리도록 하겠습니다.일반 Dreamhack 유저와 Dreamhack Enterprise를 사용하게 되었을 때의 차이점은 무엇인가요? Dreamhack Enterprise를 이용하시면, 관리자 측면에서 일반 Dreamhack 유저들에게는 제공되지 않는 학습자 관리 기능과 대회 개최 권한 등을 이용하실 수 있게 됩니다.또, 일반 Dreamhack 유저보다 더 빠르게 신규 강의를 만나볼 수 있으며, Enterprise 학습자들에게만 제공되는 다양한 전용 문제들에 접근할 수 있게 됩니다.자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요.보안에 대한 전문적인 지식이 없어도 Dreamhack Enterprise를 잘 이용할 수 있을까요? 알아보기 쉽고 직관적인 지표를 통해, 보안에 대한 전문적인 지식이 없더라도 학습자들을 손쉽게 관리할 수 있습니다.또, 이용 기간동안 Dreamhack 팀 또한 그동안의 노하우를 통해 기관에 적합한 학습 방법을 추천해 드립니다.Dreamhack Enterprise는 기업에서만 사용할 수 있나요? 이용을 원하시는 기관이라면 기업 뿐만 아니라 공공기관, 교육기관 등 어떤 곳이든 서비스를 제공해 드리고 있습니다.Dreamhack Enterprise는 어떤 기관에게 적절한 서비스 인가요? 일회성 보안 교육에 그치지 않고 아니라 전사적, 영구적으로 보안 역량을 끌어올리고 싶은 기관, 보안 역량 향상을 위한 체계적인 시스템을 갖추고 싶은 기관,사내에 보안 학습에 대한 문화를 정착시키고 싶은 기관 등에 적합합니다.Dreamhack Enterprise의 가격 정책은 어떻게 되나요? 이용하시길 원하는 기간과 인원에 따라 상이합니다. 자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요. Dreamhack Enterprise Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요. 엔터프라이즈 소개서 받기 엔터프라이즈 도입 문의 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
