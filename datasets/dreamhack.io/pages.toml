["https://dreamhack.io/services/faq"]
title = "FAQ | Dreamhack"
description = "Hackers' Playground, Dreamhack"
full_description = "자주 묻는 질문 전체 강의 Wargame CTF Forum 계정 코인 / 마일리지 기타 도움말 검색 찾으시는 답변이 없으신가요? 1:1 문의 바로가기 기타 해킹이 처음이에요! Welcome🙌 해커의 세계에 오신 것을 환영합니다! Lecture(강의)를 수강하러 오셨다면 Introduction to Dreamhack을 먼저 수강하신 후, 본인이 흥미를 느끼는 분야의 로드맵부터 학습하시면 됩니다. 정보 보안은 바탕이 되는 컴퓨터 공학/과학, 수학, 프로그래밍 등 기본적인 지식을 습득한 후 공부해야 하는 학문입니다. 따라서 드림핵의 강의는 C, Python 코드를 읽을 줄 아는 것을 최소 기반 지식으로 쓰여 있습니다. 권장 지식은 컴퓨터공학부에서 흔히 배우는 데이터구조, 시스템 프로그래밍, 운영체제, 컴퓨터 구조 등을 포함하여 전공과목에 대한 지식 전반입니다. 처음 입문하셨다면 메모리 구조와 같은 컴퓨터 과학/엔지니어링의 기초 개념 먼저 공부하시길 추천드립니다. (각 전공 분야별 교과 과정과 전문 서적이 방대하기에 사이버 보안을 중점적으로 다루는 드림핵에서 제공하기 어려운 점 양해 부탁드립니다) 드림핵이 여러분의 성장에 함께할 수 있기를 바라며, 즐거운 해킹 공부 되시기 바랍니다.👩‍💻👨‍💻 강의 로드맵, 스테이지, 강의가 뭔가요? 드림핵 Lecture는 로드맵, 스테이지, 강의로 분류되어 있습니다. 강의 ⊂ 스테이지 ⊂ 로드맵 로드맵은 가장 큰 단위입니다. 로드맵으로는 시스템 해킹, 웹 해킹 등이 있으며, 하나의 로드맵은 여러 스테이지로 구성되어 있습니다. 상단 Lecture - 모든 로드맵, 로드맵 탭에서 필요한 로드맵을 수강하실 수 있습니다. 스테이지는 중간 단위입니다. 강의와 학습한 개념을 실습하는 Wargame, 퀴즈로 구성되어 있습니다. 강의는 가장 기본적인 단위로, 난이도, 권장 소요시간, 목표 등이 별도로 표기되어 있습니다. 로드맵 진도와 상관없이 상단 Lecture - 강의 탭에서 필요한 강의를 수강하실 수 있습니다. 강의 강의를 어떻게 듣나요? 드림핵은 영상 형식의 강의가 아닙니다. 원하는 분야의 로드맵을 클릭하여 로드맵 시작하기를 통해 수강하실 수 있습니다. 로드맵은 메인 페이지 상단 Lecture - 로드맵, 모든 로드맵 탭에서 확인하실 수 있습니다. 강의 강의를 모바일로 수강할 수 있나요? 기본적인 강의는 모바일로 수강하실 수 있으며, 일부 강의에 한하여 모바일 수강을 지원하지 않습니다. 내부적으로 우선 개발해야 할 가장 중요한 기능 중 하나라고 생각합니다. 기존 강의 시스템을 개선하면서 동시에 지원할 예정입니다. ※ 작은 화면으로는 정상적인 강의 수강이 어려울 수 있습니다. 큰 화면 수강을 권장합니다. 강의 문제를 풀지 않고 강의만 보고 싶어요 함께 실습, 혼자 실습, 퀴즈 없이 강의 수강만을 원하신다면, 상단 Lecture - 강의 탭에서 수강하실 수 있습니다. 원하는 강의만 골라서 학습할 수 있는 기능은 제공 예정입니다. 123456789"
