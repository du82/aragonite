full_description = "최고의 학습 환경을 제공하기 위한 노력 Dreamhack 팀은 학습자의 관점에서 생소하고 어려운 개념을다양한 매체들을 통해 쉽고 효과적으로 전달하는 강의를 제작하고 있습니다. Interactive modules 어렵고 지루한 배경 지식을 쉽고 빠르게 배워보세요! 정보 보안을 제대로 학습하기 위해선 어렵고 복잡한 배경 지식을 습득해야합니다. 입문자들에게 있어 가장 높은 이 벽을 Dreamhack은 상호작용요소를 통해 해결했습니다. 글로만 이루어진 주입식 교육을 넘어, 학습자가 직접 보안에 필요한 기초 지식과 개념들을 습득하고, 습득한 개념을 응용하는 사고력을 얻을 수 있도록돕는 다양한 상호작용 요소가 강의들에 포함되어 있습니다. Quizzes 강의를 학습한 뒤 배운 개념들을 퀴즈를 통해 복습해 보세요. 강의를 통해 학습한 내용이 잊혀지지 않도록, 각 강의에는 학습한 내용을 복습할 수 있는 퀴즈가 존재합니다.학습자들은 퀴즈를 통해 학습한 내용을 확인하고 잘못 이해한 부분을 바로잡아 다음 학습을 위한 기초 지식을 탄탄히 할 수 있습니다. Hands-on Exercises 배운 개념을 그 자리에서 실습해서 손에 익을 수 있도록 합니다. 올바른 학습이 이루어지기 위해서는 상호작용 요소와 퀴즈를 통해 배운 내용을 토대로 습득한 개념들을 직접 활용, 리뷰해보는 과정이 반드시 필요합니다. Dreamhack은 워게임을 통해 강의에서 다루는 모든 내용들을다양한 난이도와 분야에서 직접 실습해 볼 수 있는 환경을 제공합니다. 400여개가 넘는 워게임 실습 문제 100여개가 넘는 강의와 연계된 실습 문제 별도의 학습자 환경 구성이 필요 없는 가상 환경 24시간 제공 CTF 직접 경험해 보는 해킹방어대회를 통해 정보 보안의 현장감을체험할 수 있습니다. Dreamhack에서는 매달 첫 번째, 네 번째 주 토요일마다 CTF 대회를 개최하고 있습니다.강의와 퀴즈, 워게임에서 습득한 지식과 경험을 바탕으로 실제 대회에 참여하여 공개된 적 없는 워게임에 도전한다는 현장감을 체험할 수 있고, 다른 학습자들과의 경쟁을 통해 학습 의욕을 고취시킬 수 있습니다.또한, Dreamhack Enterprise를 이용하신다면 직접 CTF를 개최하여 구성원들끼리 경쟁하는 것도 가능합니다. FAQs Dreamhack Enterprise를 도입하려면 어떻게 해야하나요? Dreamhack Enterprise 도입 문의는 페이지 상단의 도입 문의 버튼을 클릭하시거나 dreamhack@dreamhack.io 로 문의해 주시면 안내해 드리고 있습니다.해당 메일로 기관명, 담당자명, 연락처와 전달하고 싶은 내용을 작성하여 발송해 주시면 빠르게 안내해 드리도록 하겠습니다.일반 Dreamhack 유저와 Dreamhack Enterprise를 사용하게 되었을 때의 차이점은 무엇인가요? Dreamhack Enterprise를 이용하시면, 관리자 측면에서 일반 Dreamhack 유저들에게는 제공되지 않는 학습자 관리 기능과 대회 개최 권한 등을 이용하실 수 있게 됩니다.또, 일반 Dreamhack 유저보다 더 빠르게 신규 강의를 만나볼 수 있으며, Enterprise 학습자들에게만 제공되는 다양한 전용 문제들에 접근할 수 있게 됩니다.자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요.보안에 대한 전문적인 지식이 없어도 Dreamhack Enterprise를 잘 이용할 수 있을까요? 알아보기 쉽고 직관적인 지표를 통해, 보안에 대한 전문적인 지식이 없더라도 학습자들을 손쉽게 관리할 수 있습니다.또, 이용 기간동안 Dreamhack 팀 또한 그동안의 노하우를 통해 기관에 적합한 학습 방법을 추천해 드립니다.Dreamhack Enterprise는 기업에서만 사용할 수 있나요? 이용을 원하시는 기관이라면 기업 뿐만 아니라 공공기관, 교육기관 등 어떤 곳이든 서비스를 제공해 드리고 있습니다.Dreamhack Enterprise는 어떤 기관에게 적절한 서비스 인가요? 일회성 보안 교육에 그치지 않고 아니라 전사적, 영구적으로 보안 역량을 끌어올리고 싶은 기관, 보안 역량 향상을 위한 체계적인 시스템을 갖추고 싶은 기관,사내에 보안 학습에 대한 문화를 정착시키고 싶은 기관 등에 적합합니다.Dreamhack Enterprise의 가격 정책은 어떻게 되나요? 이용하시길 원하는 기간과 인원에 따라 상이합니다. 자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요. Dreamhack Enterprise Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요. 엔터프라이즈 소개서 받기 엔터프라이즈 도입 문의 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
