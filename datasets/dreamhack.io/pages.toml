title = "적용 사례 | Dreamhack Enterprise"
description = "Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요."
full_description = "대덕소프트웨어마이스터고등학교 국내 최초의 SW마이스터 고등학교 학생들의 도전 대덕소프트웨어마이스터고등학교는 대한민국에서 최초로 소프트웨어 분야 마이스터고등학교로 선정된 고등학교입니다. 소프트웨어, 임베디드 소프트웨어, 정보보안, 인공지능 등 다양한 분야에서 수준 높은 인력을 양성함으로써 매해 90%에 달하는 취업률을 자랑하는 학교입니다. 드림핵 Enterprise 도입 배경 소프트웨어 개발에 있어 보안은 떼어낼 수 없을 정도로 중요한 요소입니다. 또 Web3, 인공지능 등 새로운 분야의 보안이 점점 더 중요해지고 있고, 대덕소프트웨어마이스터고등학교에서도 2024년 인공지능소프트웨어개발학과가 신설됨에 따라 그런 트렌드에 맞는 해킹을 학습할 필요성이 높아지고 있습니다. 하지만 해킹을 시작하기 위해 공부할 수 있는 체계적 교육 환경이 많이 갖춰져 있지 않은 것도 현실입니다. 드림핵은 처음 해킹에 입문하거나 학습을 시작하려는 주니어들이 쉽고 편하게 학습할 수 있는 기회를 주어 이러한 어려움을 해소해 주며, 자가주도적 학습 솔루션까지 마련되어 있어 프로그램 도입을 적극 검토하게 되었습니다. 드림핵을 선택한 이유 대덕소프트웨어마이스터고등학교가 드림핵을 선택한 이유는 크게 3가지입니다. • 수준 높은 강의 • 다양한 난이도의 워게임 • 실제 해커들과 소통 먼저, 드림핵은 드림 비기너즈를 시작으로 보안에 막 입문한 학습자도 쉽게 기초를 쌓을 수 있는 간단한 난이도의 강의부터 점진적으로 역량을 쌓을 수 있는 다양한 수준의 로드맵이 잘 준비되어 있습니다. 또한, 웹해킹, 시스템해킹, 리버스엔지니어링 등 보안의 기본이 되는 분야부터 최근 각광받고 있는 모바일해킹, 클라우드해킹, 기업들이 주목하고 있는 임베디드해킹 등 다양한 분야의 강의들이 준비되어 있습니다. 학생들이 관심 있는 분야의 역량을 키우는 데 매우 최적화된 프로그램입니다. 분야와 일정만 고르면 체계적인 커리큘럼이 자동으로 생성되어 누구나 편리하게 이용할 수도 있습니다. 두 번째, 배운 내용들을 실제로 활용할 수 있는 워게임이 잘 준비되어 있습니다. 이론만 암기하여 쉽게 잊혀지는 학습이 아니라, 배운 내용을 직접 워게임에 적용하여 풀어가며 체화하는 과정을 통해 효과적인 학습을 할 수 있습니다. 난이도 역시도 새싹 난이도부터 실제 실무자도 풀기 어려워하는 고난이도까지 다양하게 준비되어 있다는 점이 매력적입니다. 마지막으로, 드림핵 기관 전용 서비스를 이용하게 되면 드림핵의 콘텐츠를 작성하는 화이트햇 해커들과 직접 소통할 수 있다는 점입니다. 보안이라는 분야의 경우 학습 시 앞에서 이끌어주는 멘토의 유무가 큰 영향을 끼치는데, 이에 대해서 신뢰할 수 있는 질문처를 확보할 수 있다는 점이 학생들에게 매력적이라고 생각합니다. 도입 효과 보안에 많은 관심이 있는 학생들의 주도 하에 해당 프로그램을 운영하고 있습니다. 학생들 스스로 계획을 세워 드림 비기너즈, 웹해킹, 시스템해킹 등 기본적으로 학습해야 하는 내용들을 공통과목 삼아 학습을 진행하고 있습니다. 또 각자 원하는 커리큘럼을 생성하여 공통과목보다 심화된 내용은 자율적으로 학습하고 있습니다. 특히 드림핵 기관 전용 서비스를 이용하는 학습자들에게 선제적으로 제공되는 로드맵들에 대해서 열성적으로 학습을 진행하고 있습니다. FAQs Dreamhack Enterprise를 도입하려면 어떻게 해야하나요? Dreamhack Enterprise 도입 문의는 페이지 상단의 도입 문의 버튼을 클릭하시거나 dreamhack@dreamhack.io 로 문의해 주시면 안내해 드리고 있습니다.해당 메일로 기관명, 담당자명, 연락처와 전달하고 싶은 내용을 작성하여 발송해 주시면 빠르게 안내해 드리도록 하겠습니다.일반 Dreamhack 유저와 Dreamhack Enterprise를 사용하게 되었을 때의 차이점은 무엇인가요? Dreamhack Enterprise를 이용하시면, 관리자 측면에서 일반 Dreamhack 유저들에게는 제공되지 않는 학습자 관리 기능과 대회 개최 권한 등을 이용하실 수 있게 됩니다.또, 일반 Dreamhack 유저보다 더 빠르게 신규 강의를 만나볼 수 있으며, Enterprise 학습자들에게만 제공되는 다양한 전용 문제들에 접근할 수 있게 됩니다.자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요.보안에 대한 전문적인 지식이 없어도 Dreamhack Enterprise를 잘 이용할 수 있을까요? 알아보기 쉽고 직관적인 지표를 통해, 보안에 대한 전문적인 지식이 없더라도 학습자들을 손쉽게 관리할 수 있습니다.또, 이용 기간동안 Dreamhack 팀 또한 그동안의 노하우를 통해 기관에 적합한 학습 방법을 추천해 드립니다.Dreamhack Enterprise는 기업에서만 사용할 수 있나요? 이용을 원하시는 기관이라면 기업 뿐만 아니라 공공기관, 교육기관 등 어떤 곳이든 서비스를 제공해 드리고 있습니다.Dreamhack Enterprise는 어떤 기관에게 적절한 서비스 인가요? 일회성 보안 교육에 그치지 않고 아니라 전사적, 영구적으로 보안 역량을 끌어올리고 싶은 기관, 보안 역량 향상을 위한 체계적인 시스템을 갖추고 싶은 기관,사내에 보안 학습에 대한 문화를 정착시키고 싶은 기관 등에 적합합니다.Dreamhack Enterprise의 가격 정책은 어떻게 되나요? 이용하시길 원하는 기간과 인원에 따라 상이합니다. 자세한 사항은 Dreamhack Enterprise 서비스 소개서 를 참고해 주세요. Dreamhack Enterprise Dreamhack Enterprise는 기업 맞춤형 보안 교육부터평가와 관리까지 종합적인 서비스를 제공하는 플랫폼입니다.100개 이상의 엔터프라이즈 전용 강의와 실습 문제를 통해 기업이 필요로 하는 기술을 학습해 보세요. 엔터프라이즈 소개서 받기 엔터프라이즈 도입 문의 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
