full_description = "공고 목록으로 돌아가기 Theori 공유하기 Program Analysis Platform Researcher Previous slideNext slide 📝 지원하기 📌 Vulnerability Research 팀을 소개합니다 Vulnerability Research 팀은 다양한 국가 과제 등을 수행하며 보안 취약점을 분석하고 연구하고 있습니다. Vulnerability Research 팀이 분석하는 최신 소프트웨어는 크기가 크고 복잡해 사람이 직접 분석하기에는 많은 시간과 노력이 들어가는데요. 이를 해결하기 위해 정적 분석 기술을 기반으로 한 자동화 분석 플랫폼을 개발합니다. 나아가 다양한 분석 기술을 활용할 수 있는 플랫폼으로 발전시켜 더 효율적이고 자동화된 방식으로 취약점을 찾고자 합니다. 새롭게 등장하는 취약점을 탐구하고 알려지지 않은 기술을 연구함으로써 안전한 세상을 만들기 위한 여정에 함께할 분을 기다립니다. 함께 할 업무입니다 취약점 탐지 자동화를 위한 프로그램 분석 플랫폼을 개발합니다. Symbolic Execution, Data-flow Analysis, Taint Analysis와 같은 프로그램 분석 기술을 구현하고 개선합니다. 이런 경험을 가진 분을 찾습니다 컴퓨터 과학 또는 관련 분야에 대한 학사 학위 또는 그에 상응하는 지식을 소지한 분 프로그램 분석과 관련된 지식을 가지고 있는 분 프로그램 분석 플랫폼 개발을 위한 소프트웨어 개발 역량을 갖춘 분 이런 경험이 있다면 더 좋습니다 F#, OCaml과 같은 함수형 언어로 프로그램을 작성해 본 경험이 있으신 분 프로그램 분석기를 구현해 본 경험이 있으신 분 프로그램 분석기를 활용하여 상용 프로그램에서 취약점을 찾은 경험이 있으신 분 해킹 대회 (CTF) 수상 경력이나 버그 바운티 참여 경험이 있으신 분 티오리 합류 여정 서류전형 > 스킬 테스트&직무 인터뷰 > 컬쳐 인터뷰 > 레퍼런스 체크 > 처우 협의 > 합류 서류 전형 : 제출한 이력서를 면밀하게 검토합니다. 스킬 테스트 : 후보자님의 경험과 역량을 확인할 수 있는 과제를 부여해 상호간 직무 및 기술적 Fit를 확인합니다. 직무 인터뷰 : 제출 서류를 기반으로 후보자님의 경험과 기술에 대해 이야기합니다. 컬쳐 인터뷰 : 후보자님의 업무 방식과 가치관을 바탕으로 문화적 방향성에 대해 이야기합니다. 레퍼런스 체크 : 후보자님께서 지정해주신 레퍼리분들을 대상으로 레퍼런스 체크를 진행합니다. 인재영입 절차는 포지션 및 고용 형태에 따라 달라질 수 있습니다. 지원 시 유의 사항 고용 형태는 정규직입니다. 직무적/문화적으로 상호 간 Fit을 맞춰보는 12주의 수습 기간을 가집니다. 해당 포지션은 티오리 강남 오피스에서 함께 근무합니다. 인재영입 문의 : withtheori@theori.io 혜택 및 복지 자유롭게 몰두할 수 있는 환경을 만듭니다 자율 출퇴근 운영 유연한 근무 형태 별도 승인 없는 무제한 휴가 근속 3/5/8년마다 유급 리프레시 휴가 업무 장비 및 유료 소프트웨어 구입 지원 간식, 커피, 음료가 제공되는 스낵바 개인과 팀이 함께 성장합니다 해킹 대회, 도서비, 어학 학습 비용 지원 외부 세미나, 컨퍼런스, 교육 비용 지원 매년 자율 연구 기간 운영 사내 스터디 동호회 / 동아리 활동 지원 신규 입사자 대상 멘토링 인재 채용 추천 보상금 지급 건강하고 행복한 삶을 지원합니다 점심 식대 출산 휴가 및 육아 휴직 제공 매월 컬처데이 진행 (영화, 공연 등) 야간 근무 시 식비 및 교통비 지원 매년 건강검진 지원 각종 경조사비 및 경조품 지원 티오리 더 알아가기 Theori Culture Blog : 함께 만들어온, 함께 만들어가는 티오리 Theori TV : 우리가 잘 몰랐던 '진짜 해커들'의 이야기 Theori Newsroom : 티오리 최신 뉴스와 인사이트 회사 정보 Theori 사원수 50~300명 주소 서울 강남구 테헤란로4길 14 설립 연도 2016년 홈페이지 https://theori.io 로그인이 필요합니다. 채용 공고를 올리고 드림핵의 보안 인재를 만나 보세요! 커리어 서비스 시작하기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
