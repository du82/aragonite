["https://dreamhack.io/lecture/roadmaps/all/mobile-hacking"]
title = "목록 | 로드맵 | Dreamhack"
description = """
모바일 해킹 로드맵은 모바일 애플리케이션 점검 시 필수적으로 사용되는 동적 분석 도구인 프리다(Frida)를 활용하여  안드로이드, iOS 예제 애플리케이션에 적용되어있는 루팅, 프리다, 디버깅 탐지등 과 같은 보호 로직들을 우회하는 과정을 실습합니다.


