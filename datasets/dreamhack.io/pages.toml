description = "Hackers' Playground, Dreamhack"
full_description = "공고 목록으로 돌아가기 Theori 공유하기 [Xint] Security Researcher Intern Previous slideNext slide 📝 지원하기(경력) 📌 Theori(티오리)는 세계 최고 수준의 해커와 보안 전문가들이 모인 오펜시브 사이버 보안 전문 기업입니다. 더 안전한 세상을 만드는 것을 목표로 독보적인 기술과 실력으로 난제급의 사이버 보안 문제를 해결합니다. 설립 이후, 구글, Microsoft, 삼성전자, LG전자, 네이버 등 국내외 주요 100여 개 기업의 보안 컨설팅 프로젝트를 성공적으로 수행했습니다. 매년 국제 해킹 대회에서 우승을 거두며 우리가 가진 전문성을 증명했고, 혁신적인 연구개발과 지식을 세상에 나누며 다음 세대를 육성하고 보안의 기준을 높여왔습니다. Xint는 사이버 보안의 자동화 문제를 해결합니다 보안 제품은 작업자의 일을 줄여주는 도구여야 하지 않을까요? 보안 제품 사용자 대부분이 복잡하고 어려운 보안 툴로 인해 불편함을 느끼고, 의도한 보안 정책이 효과적으로 구현되지 않는 경험을 하고 있습니다. Theori는 우리의 보안 전문성을 자동화한 Digital Risk Management Platform인 Xint(진트)로 기업들이 반복적으로 겪고 있는 보안 문제를 해결합니다. Xint는 복잡하고 빠르게 변화하는 IT 환경의 디지털 리스크를 종합적으로 진단해 기업 전반에 보안 가시성을 제공합니다. Cyber Security Strategist로서 안전한 보안 환경을 구축할 수 있는 최적의 대응 방안도 제시합니다. 궁극적으로 사람들이 보안 작업에 시간을 '덜 쓰고', '더 많은걸' 이룰 수 있는 제품이 되고자 합니다. Xint Website : 바로가기 Xint Blog : 바로가기 Xint 팀 인터뷰 : 사이버 보안 자동화의 꿈을 실현해요 함께 할 업무입니다 새로운 위협과 취약점을 발견하고 탐지 가능성을 연구합니다. 외부의 공격 표면 및 내부의 자산에서 위협이 될 수 있는 문제점을 연구합니다. Theori의 기술적 노하우를 집약해, 취약점 점검 자동화 도구를 제작합니다. 이런 경험을 가진 분을 찾습니다 기본적인 해킹 기법에 대한 이해를 갖추신 분 Python / JS 등 프로그래밍 언어로 PoC/Exploit 을 작성해 본 경험을 보유하신 분 사이버 보안 전문가로서의 책임감과 윤리 의식을 갖추신 분 컴퓨터 과학 또는 관련 분야에 대한 충분한 지식을 갖고 있으신 분 오펜시브 보안 진단에 필요한 기본적인 도구를 사용할 줄 아시는 분 이런 경험이 있다면 더 좋습니다 Major software에 대한 취약점 연구 경험이 있으신 분 버그 바운티 또는 해킹 대회(CTF) 입상 경험이나 Dreamhack 상위권이신 분 클라우드 환경에 대한 이해가 있으신 분 티오리 합류 여정 서류 전형 > 직무 인터뷰 > 컬쳐 인터뷰 > 합류 서류 전형 : 제출한 이력서를 면밀하게 검토합니다. 직무 인터뷰 : 제출 서류를 기반으로 후보자님의 경험과 기술에 대해 이야기합니다. 컬쳐 인터뷰 : 후보자님의 업무 방식과 가치관을 바탕으로 문화적 방향성에 대해 이야기합니다. 인재영입 절차는 포지션 및 고용 형태에 따라 달라질 수 있습니다. 지원 시 유의 사항 해당 포지션은 최소 3개월 함께 근무합니다. 근무지 : 서울 강남구 테헤란로4길 14 (미림타워 9층) 근무시간 : 주 5일 / 오전 10시 ~ 오후 7시 (1일 8시간, 주 5일 근무, 유연 근무 가능) 인재영입 문의 : withtheori@theori.io 혜택 및 복지 자유롭게 몰두할 수 있는 환경을 만듭니다 자율 출퇴근 운영 유연한 근무 형태 별도 승인 없는 무제한 휴가 근속 3/5/8년마다 유급 리프레시 휴가 업무 장비 및 유료 소프트웨어 구입 지원 간식, 커피, 음료가 제공되는 스낵바 개인과 팀이 함께 성장합니다 해킹 대회, 도서비, 어학 학습 비용 지원 외부 세미나, 컨퍼런스, 교육 비용 지원 매년 자율 연구 기간 운영 사내 스터디 동호회 / 동아리 활동 지원 신규 입사자 대상 멘토링 인재 채용 추천 보상금 지급 건강하고 행복한 삶을 지원합니다 점심 식대 출산 휴가 및 육아 휴직 제공 매월 컬처데이 진행 (영화, 공연 등) 야간 근무 시 식비 및 교통비 지원 매년 건강검진 지원 각종 경조사비 및 경조품 지원 티오리 더 알아가기 Theori Culture Blog : 함께 만들어온, 함께 만들어가는 티오리 Theori TV : 우리가 잘 몰랐던 '진짜 해커들'의 이야기 Theori Newsroom : 티오리 최신 뉴스와 인사이트 회사 정보 Theori 사원수 50~300명 주소 서울 강남구 테헤란로4길 14 설립 연도 2016년 홈페이지 https://theori.io 로그인이 필요합니다. 채용 공고를 올리고 드림핵의 보안 인재를 만나 보세요! 커리어 서비스 시작하기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
