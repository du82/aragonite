full_description = "공고 목록으로 돌아가기 Theori 공유하기 Offensive Security Consultant Previous slideNext slide 📝 지원하기 📌 Security Assessment 팀을 소개합니다 Security Assessment팀은 공격자 관점에서 사이버 보안 취약점을 발견해 모의 해킹과 침투 및 전반적인 보안 컨설팅 서비스를 제공하기 위해 노력하고 있으며, 현재는 아래와 같은 문제를 해결하기 위해 고민하고 있습니다. Theori는 더욱 안전한 사이버 세상을 만들기 위해 노력하고 있습니다. 악의적인 공격자들은 짧으면 수 개월, 길면 수 년 간 지속적으로 기업 및 기관을 대상으로 불안전한 상황을 만들어내고 있습니다. 우리는 이러한 환경에서도 모두가 안전할 수 있게 오펜시브 보안 관점에서 공격자보다 한발 앞서 문제점을 식별하고 이를 대응하기 위한 전략을 세우고자 합니다. 단순히 즉각적인 취약점을 해결하는 것 뿐만 아니라, 서비스 내 잠재적 보안 위협까지 예방하기 위한 시스템 설계 그리고 자동화된 취약점 대응 도구를 개발하는 등의 노력도 포함하고 있습니다. 함께 할 업무입니다 공격자 관점에서 소스코드 오디팅과 아키텍쳐 리뷰를 진행합니다. 보안 모범 사례 구축을 위한 인프라스트럭쳐 및 클라우드 시스템 보안 진단을 수행합니다. 공격자 입장에서 타겟 시스템에 침투할 수 있는 경로를 선제적으로 파악하기 위한 모의 침투를 (APT) 진행합니다. 외부의 공격 표면으로부터 위협이 될 수 있는 취약점을 선제적으로 찾아내는 블랙박스 취약점 진단을 수행합니다. 소프트웨어 바이너리를 리버싱하여 분석하거나 익스플로잇 하는 등의 업무를 진행합니다. Theori의 기술적 노하우를 집약해, 취약점 점검 자동화 도구를 제작합니다. 이런 경험을 가진 분을 찾습니다 사이버 보안 전문가로서의 책임감과 윤리 의식을 갖추신 분 컴퓨터 과학 또는 관련 분야에 대한 충분한 지식을 갖고 있으신 분 오펜시브 보안 진단에 필요한 기본적인 도구를 사용할 줄 아시는 분 PoC / Exploit 작성을 위한 프로그래밍이 가능하신 분 이런 경험이 있다면 더 좋습니다 새로운 언어나 프레임워크를 접하였을 때, 부담감이 없이 빠르게 지식 습득이 가능하신 분 해킹 대회 ( CTF ) 수상 경력이나 버그바운티 참여 경험이 있으신 분 기업을 대상으로 오펜시브 보안 컨설팅을 수행한 경험이 있으신 분 드림핵 / 패치데이 상위 랭커에 등재되어 있으신 분 문서 작성 업무에 능숙하신 분 클라우드 환경에 대한 이해가 있으신 분 티오리 합류 여정 서류 전형 > 스킬 테스트 > 직무 인터뷰 > 컬쳐 인터뷰 > 레퍼런스 체크 > 처우 협의 > 합류 서류 전형 : 제출한 이력서를 면밀하게 검토합니다. 스킬 테스트 : 후보자님의 경험과 역량을 확인할 수 있는 과제를 부여해 상호간 직무 및 기술적 Fit를 확인합니다. 직무 인터뷰 : 제출 서류를 기반으로 후보자님의 경험과 기술에 대해 이야기합니다. 컬쳐 인터뷰 : 후보자님의 업무 방식과 가치관을 바탕으로 문화적 방향성에 대해 이야기합니다. 레퍼런스 체크 : 후보자님께서 지정해주신 레퍼리분들을 대상으로 레퍼런스 체크를 진행합니다. 인재영입 절차는 포지션 및 고용 형태에 따라 달라질 수 있습니다. 지원 시 유의 사항 후보자님의 경험 및 역량을 면밀히 검토한 후에 인턴직을 제안드릴 수 있습니다. 서울 근무 가능하신 분만 지원 가능합니다. 고용 형태는 정규직입니다. 직무적/문화적으로 상호 간 Fit을 맞춰보는 12주의 수습 기간을 가집니다. 인재영입 문의 : withtheori@theori.io 혜택 및 복지 자유롭게 몰두할 수 있는 환경을 만듭니다 자율 출퇴근 운영 유연한 근무 형태 별도 승인 없는 무제한 휴가 근속 3/5/8년마다 유급 리프레시 휴가 업무 장비 및 유료 소프트웨어 구입 지원 간식, 커피, 음료가 제공되는 스낵바 개인과 팀이 함께 성장합니다 해킹 대회, 도서비, 어학 학습 비용 지원 외부 세미나, 컨퍼런스, 교육 비용 지원 매년 자율 연구 기간 운영 사내 스터디 동호회 / 동아리 활동 지원 신규 입사자 대상 멘토링 인재 채용 추천 보상금 지급 건강하고 행복한 삶을 지원합니다 점심 식대 출산 휴가 및 육아 휴직 제공 매월 컬처데이 진행 (영화, 공연 등) 야간 근무 시 식비 및 교통비 지원 매년 건강검진 지원 각종 경조사비 및 경조품 지원 티오리 더 알아가기 Theori Culture Blog : 함께 만들어온, 함께 만들어가는 티오리 Theori TV : 우리가 잘 몰랐던 '진짜 해커들'의 이야기 Theori Newsroom : 티오리 최신 뉴스와 인사이트 회사 정보 Theori 사원수 50~300명 주소 서울 강남구 테헤란로4길 14 설립 연도 2016년 홈페이지 https://theori.io 로그인이 필요합니다. 채용 공고를 올리고 드림핵의 보안 인재를 만나 보세요! 커리어 서비스 시작하기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337"
