;로 접근 했는데 flag가 나오지 않아서 value(char(0x61)||char(0x64)||char(0x6d)||char(0x69)||char(x6e))로 풀었는데 이것도 왜 안나오는지 궁금합니다 baby-sqlite #web Last Step I sent this payload to the server in level field. 1//OR//uid=char(0x61)||char(0x64)||char(0x6D)||char(0x69)||char(0x6E) But I coun't get flag. Why? Somebody help me,please! baby-sqlite #web The Hackers’ Playground 해커들의 놀이터, 드림핵 Dreamhack은 해커들의 놀이터입니다. 해킹과 보안을 공부하고 싶은 학생, 보다 안전한 코드를 작성하고 싶은 개발자,가지고 있는 보안 지식과 실력을 한 단계 업그레이드하고 싶은 보안 전문가까지함께 공부하고 연습하며 지식을 나누고 실력을 향상할 수 있는 공간입니다. 드림핵은 다양한 서비스를 제공하고 있어요. 기업, 공공기관, 교육기관 등 다양한 기관과 함께하고 있답니다. 기업을 위한 보안 역량 향상 솔루션 Dreamhack Enterprise 기업의 보안은 이제 전문가가 혼자, 혹은 보안팀만이 하는 일이 아닙니다. Dreamhack Enterprise는 기업의 전사적 보안 역량 향상을 위한 솔루션을 강의, 워게임, CTF를 통해 제공합니다. 더 자세한 내용 보러 가기 교육기관을 위한 보안 교육 솔루션 Dreamhack Education 양질의 보안 기술교육의 부재가 기존 보안 교육의 한계로 꼽히고 있습니다. 드림핵 에듀케이션에서는 전문가들이 만들고 실제 현업에서 쓰이는 내용 위주로 이루어진 양질의 강의를 제공합니다. 드림핵 에듀케이션 소개서 받아보기 채용 전에 지원자의 역량을 파악해 보세요. Dreamhack Hiring CTF Dreamhack Hiring CTF는 세계 대회를 수차례 석권한 화이트햇 해커들이 직접 제작한 CTF 문제를 통해 입사 지원자분들의 보안 실력을 보다 객관적으로 판단하실 수 있도록 도와드립니다. 드림핵 채용 CTF 소개서 받아보기 전체 공지사항 자주 묻는 질문 1:1 문의 이용약관 개인정보 취급방침 학습 모든 로드맵 모든 강의 워게임 모든 워게임 워게임 출제하기 CTF 모든 CTF Blitz CTF 커뮤니티 랭킹 CTF 워게임 커뮤니티 (주)티오리한국 Copyright © 2019 - 2024 Theori Inc. All rights reserved. 사업자등록번호: 263-81-00731 | 대표이사: PAK BRIAN SEJOON | 통신판매업 신고번호: 제2021-서울강남-05520호 | 서울 강남구 테헤란로4길 14 9층 | 이메일: dreamhack@dreamhack.io | 대표 연락처: 070-8864-1337'''
