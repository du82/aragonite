full_description = "Our mission is to provide support at every stage of a creative’s journey; whether that’s learning the craft, showcasing portfolio work and building an audience, or finding freelance or full-time jobs at some of the world’s leading design-forward companies. We are building the platform that helps designers level up their creative careers. Our mission is to provide support at every stage of a creative’s journey; whether that’s learning the craft, showcasing portfolio work and building an audience, or finding freelance or full-time jobs at some of the world’s leading design-forward companies. We are building the platform that helps designers level up their creative careers. Our mission is to provide support at every stage of a creative’s journey; whether that’s learning the craft, showcasing portfolio work and building an audience, or finding freelance or full-time jobs at some of the world’s leading design-forward companies. We are building the platform that helps designers level up their creative careers. Our mission is to provide support at every stage of a creative’s journey; whether that’s learning the craft, showcasing portfolio work and building an audience, or finding freelance or full-time jobs at some of the world’s leading design-forward companies. We are building the platform that helps designers level up their creative careers. We’ve been fully remote since day one, and are building a fully distributed team across North America. We believe that creative collaboration can happen anywhere, and that working remotely shouldn’t have to mean sacrificing a sense of cohesion, community, and connection. We've seen that by combining thoughtful collaboration, frequent communication, and the freedom for people to be their authentic selves, you can do your best work and inspire others to do the same. Our values are part of who we are, what we believe in, what we aspire to be, and they are reflected in our actions. They are our commitment to one another, and the collective personality of our organization. We always strive to lean into the fact that when properly practiced, sometimes our values will push us outside of our comfort zone"
