full_description = "We’re on a mission to build the world’s best community for creatives to share, grow, and get hired. We’re on a mission to build the world’s best community for creatives to share, grow, and get hired. We’re on a mission to build the world’s best community for creatives to share, grow, and get hired. We’re on a mission to build the world’s best community for creatives to share, grow, and get hired. We’re on a mission to build the world’s best community for creatives to share, grow, and get hired. Hundreds of millions of people look for design inspiration and feedback on Dribbble. We help players like you share small screenshots (shots) to show off your current projects, boost your portfolio, and love what you do—no matter what kind of creative professional you are. Founded in 2009, we are a bootstrapped and profitable company helping design talent share, grow, and get hired by over tens of thousands of today’s most innovative brands around the world. Dribbble’s importance for me and my team is that it’s a central place to showcase our work as a Design Team, as individual designers as well.” Dribbble’s importance for me and my team is that it’s a central place to showcase our work as a Design Team, as individual designers as well.” Dribbble’s importance for me and my team is that it’s a central place to showcase our work as a Design Team, as individual designers as well.” Dribbble’s importance for me and my team is that it’s a central place to showcase our work as a Design Team, as individual designers as well.” Dribbble is a 100% remote team. We believe that creative collaboration can happen anywhere and want our team to work where they feel most comfortable and inspired. Since we are a 100% distributed team, you can work from anywhere. No need to move for a job. We are proud of a culture of communication, collaboration, trust and kindness."
