title = "Cookie policy | Dribbble"
description = "Information about our use of cookies and similar technologies."
full_description = "Dribbble Holdings Limited (the “Dribbble Group,” “we,” “our,” or “us”) wants to make sure you understand how cookies and other similar technologies are used by us on our websites dribbble.com, creativemarket.com, fontspring.com, fontsquirrel.com, and any subdomains thereof (which we may refer to as the “Sites”) and by our partners. These technologies have several purposes (including third-party advertising). Our Sites use cookies and similar technologies to distinguish you from other users of our Sites. This helps us to provide you with a good experience when you browse our Sites and also allows us to improve our Sites. By continuing to browse any of our Sites, you are agreeing to our use of cookies and similar technologies as described in this Policy. Cookies: A cookie is a small piece of data (text file) that a website – when visited by a user – asks your browser to store on your device in order to remember information about you, such as your language preference or login information. Those cookies are set by us and called “first-party cookies”. We also use “third-party cookies” – which are cookies originating from a domain different from the domain of the website you are visiting (e.g., one of our Sites) – generally for our advertising and marketing efforts. More specifically, we use cookies and other tracking technologies for the following purposes: to enable our Sites to function and maintain security (for example, shopping cart functionality, security, customer support); to track, measure, and improve performance of our Sites; allow personalization of our Sites; and to target our own ads to prior visitors of our Sites on third party websites (see below on “Why We Use Cookies and Similar Technologies”). A persistent cookie remains on your hard drive after you close your browser. Persistent cookies may be used by your browser on subsequent visits to one of our Sites until you choose to delete them, and otherwise typically delete themselves at expiration. Persistent cookies can be removed by following your web browser's directions."
