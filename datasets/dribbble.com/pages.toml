description = "Jeroen van Eerden | As a freelance visual identity designer based in Groningen, the Netherlands, I am dedicated to creating meaningful and timeless identities for my clients. With over a decade of experience in logo design and storytelling, I am passionate about delivering high-quality results that meet the unique needs of each project. I approach modern logo design with an eye for detail and often incorporate vivid colors and gradients to make each brand stand out. Throughout my career, I have had the privilege of working with major industry players, including Google, Disney, Menzis, Tinder, and Yahoo. I am committed to delivering high-quality results that meet and exceed my client's expectations, and my dedication has earned me a reputation as a trusted and reliable designer. info@jeroenvaneerden.nl www.jeroenvaneerden.nl +31624330707 More Links: https://zaap.bio/jeroen | Connect with them on Dribbble; the global community for designers and creative professionals."
