full_description = '''Dror Poleg is an economic historian and former technology and private equity executive who advises the world's largest investors, companies, and policymakers on the forces reshaping work, cities, and markets. His award-winning book, Rethinking Real Estate, anticipated the current reshuffling of offices, homes, and economic activity in the wake of technological and economic shifts. His insights have been featured in The New York Times, The Wall Street Journal, The Atlantic, Bloomberg, NBC, and other major publications.A sought-after keynote speaker, Dror has briefed executives at Fortune 500 companies, leading financial institutions, and global organizations, including UBS, Bank of America, CBRE, HSBC, and Indeed. His analysis—described as "inspiring and incisive"—is informed by firsthand experience as an investor, startup founder, parliamentary adviser, combat veteran, and dad.Dror holds a Master's degree in Economic History from the London School of Economics and has taught or spoken at institutions including The University of Zurich, The Wharton School, MIT, and Columbia University. His global perspective is shaped by having lived and worked in Beijing, London, Paris, Melbourne, and Tel Aviv. Dror lives in New York with his wife and children. Visit Dror's speaker profile to learn more.Book Dror for your next event Recent Op-Eds, Interviews, and Media MentionsThe Atlantic: Schrödinger’s EconomyCBS News: Amazon Wants Everyone Back at the OfficeBubble Trouble Podcast: How AI Will Reshape The Physical WorldThe Atlantic: The Next Crisis Will Start With Empty Office BuildingsThe Dispatch: Twenty-four Ways to Understand 2024MIT Sloan: Preparing for the Workplace of the FutureThe New York Times: The Winners of Remote WorkThe New York Times: Colleges Snap Up Unused Office SpaceThe Washington Post: To fill empty offices, downtowns get creativeScott Galloway Podcast: The Future of Cities & Maximizing Human CapitalNPR: Hot Desking In A World of Hybrid Work El Tiempo [Spanish]: Cities Have Too Many OfficesRealVision: Rethinking Our Exponential FutureVox: The future of cities, according to the expertsInfinite Loops with Jim O'Shaughnessy: The Future of WorkForbes: As Companies Reduce Remote Work, Tension With Employees PersistsNational Public Radio: Hotdesking is Gaining PopularityThe Compound: Nvidia Breaks OutVox: The “return to the office” won’t save the officeThe Future of Cities & Maximizing Human CapitalBloomberg: Crypto ‘Cleansing’ Reignites Debate Over What Bitcoin Is All AboutWall Street Journal: Adam Neumann and the Future of CryptoForbes: Converting Offices To Residences Can Help Fight Housing ShortageThe Hustle: Developers See Dollar Signs in Abandoned DowntownsTimes of India: How and Why We Built Our Cities So WrongNPR: How remote work is reshaping commercial real estatePlain English with Derek Thompson: Avoiding the Urban Doom LoopReal Vision: Shifting Work PatternsThe Bubble Trouble Podcast: Has Innovation Moved The House?The Times: Creature Comforts Grow in Return to OfficeCity A.M.: The role of VC investors in FTX – too big to fake?Bloomberg: Crypto’s War Test Leaves Future of Money Debate Wide OpenYahoo Finance: Remote Work and Income InequalityTablet: Ukraine Crowdfunds a War With CryptoFortune: The death of offices and the rise of remote work could...Bloomberg: Washing Web3The Financial Times: Matt Damon’s crypto ad is more than just cringeworthySunday Times: WeWork’s ‘grownup in the room’ predicts office revolutionBloomberg: Money Stuff on Web3Bloomberg CityLab: The Death and Life of the Central Business DistrictProf G Podcast: Future of Cities, Work, and Office SpaceNPR Radio: The Future of Work AnywhereThe New York Times: The Future of Work when Employees have a ChoiceBloomberg: Germany’s Banks Start Ditching Offices as Remote SoarsBloomberg: On the Best London Office ThriveThe Wall Street Journal: The Office of TomorrowNBC NY: The Office of the Future?The New Yorker: Has the Pandemic Transform