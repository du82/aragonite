full_description = '''AI and the Physical World Dror Poleg 22 Jan 2025 — 1 min read "There is a mismatch between our economy and the world we build around it: Our cities, our office buildings, and our housing system. But also, in a more figurative sense, our assumptions about work and success and productivity, and the institutions that we built to educate our kids."This is a little nugget from my latest visit to the Bubble Trouble podcast, where I was grilled by Will Page and Richard Kramer about the future of work, the state of cities, the booming demand for energy and data centers, the unsustainable asymmetries of modern warfare, and why AI is a machine that turns electricity into anything people want. Listen to the whole episode on Spotify, Apple Podcasts, Overcast, or wherever you get your pods. There is so much happening in the world, pushing me to post a lot of hot takes about ... the parity between OpenAI's O1 and China's open-source models, the meaning of AGI, the relationship between intelligence, land, and energy, the type of skills that will be rewarded in the age of AI, the record level of office vacancy in the U.S, and how Crypto pyramids have taken over our politics — as I predicted in 2021. I will explore some of these at length in the coming weeks. Best,🎤 Are you looking for a keynote speaker for your next event, corporate offsite, or investor meeting? Every year, I inform and inspire thousands of executives across the world. Visit my speaker profile to learn more and get in touch with my agent. Share on Twitter Share on Facebook Share on LinkedIn Share on Pinterest Share via Email Copy link Dror Poleg Twitter Dror Poleg Newsletter Join the newsletter to receive the latest updates in your inbox. Your email address Subscribe Please check your inbox and click the link to confirm your subscription. Please enter a valid email address! An error occurred, please try again later. Comments'''
