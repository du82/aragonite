full_description = "London Event: AI & The City Dror Poleg 21 Feb 2025 — 1 min read How will artificial intelligence reshape our cities, companies, and careers?​Join some of London’s most innovative investors, founders, and thinkers for drinks, a keynote presentation, and a conversation about navigating an increasingly unpredictable world.​Drawing on insights from my upcoming book, I will explore how AI is exposing the growing mismatch between our industrial-era infrastructure and today’s rapidly evolving economy.​What can the architecture of AI models tell us about the future of our cities, workplaces, and institutions?​Which historical and contemporary examples offer the best lessons for adapting to this shift?​How can we thrive amid extreme uncertainty and rapid change?​Join us for an in-depth discussion on the nonlinear forces reshaping how we live, work, and invest.Date: Tuesday, March 11 at 5:30 PM - 7:30 PM GMT Location: WeWork London HQ, 10 York Rd, London SE1 7ND, UKSchedule:17:30 — Doors Open & Welcome Drinks18:15 — Introduction18:30 — Keynote19:15 — Q&A and DiscussionThis is a free event, hosted by WeWork in London. Seats are limited. Click here to sign up or learn more, or click the button below: Register for Event Feel free to invite any relevant friends and colleagues. I look forward to seeing you in London!Best, Artificial IntelligenceFuture of WorkFuture of Cities Share on Twitter Share on Facebook Share on LinkedIn Share on Pinterest Share via Email Copy link Dror Poleg Twitter Dror Poleg Newsletter Join the newsletter to receive the latest updates in your inbox. Your email address Subscribe Please check your inbox and click the link to confirm your subscription. Please enter a valid email address! An error occurred, please try again later. Comments"
