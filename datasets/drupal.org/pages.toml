title = "Drupal Association Statement of Support for Ukraine | Drupal.org"
description = "The Drupal Association strongly condemns the Russian government’s attack on Ukraine. It is an act of aggression with a real human cost. We stand with all affected populations in Ukraine, and our hearts are with our Drupal Ukraine community."
full_description = "Drupal.org home PlatformDrupal Core Drupal CMS Drupal 11 SolutionsCase studies Fintech Education Retail E-commerce Healthcare High Tech Nonprofit Government Travel Decoupled DevelopLocal Development Guide Drupal user guide Installing Drupal API reference All Documentation DownloadDownload Modules Themes Distributions Issue queues Get SupportDrupal CMS User Guide Drupal user guide Training Drupal Slack Find an Agency Partner Find a Migration partner Find Integrations & Hosting Security Advisories ConnectAbout the Community Community Events Jobs/Careers DrupalCon How to Contribute Drupal in the News Sign up for Drupal News Support DrupalThe Drupal Association Donate Become a Partner Become a Ripple Maker Become an Organization Member Drupal Swag Shop Get StartedDemo online Download Return to content New to DrupalCon? We’ve Got You! Join our meet-ups before the Welcome Reception, Keynotes, and Lunches to connect with fellow attendees and get the most out of your experience. DrupalCon is as amazing as the community that attends—and that includes YOU! We can’t wait to see you at DrupalCon Atlanta 2025 (24-27 March)! Register now By Drupal Association on 24 February 2022 The Drupal Association strongly condemns the Russian government’s attack on Ukraine. The invasion is an act of aggression with a real human cost. We stand with all affected populations in Ukraine, and our hearts are with our Drupal Ukraine community. As individuals, it is often difficult to see how we can make a positive impact during a crisis. As part of a global community, you can take concrete action to help. Here is a list of organizations* accepting donations to help people directly affected by the events in Ukraine: Nova Ukraine, a Ukraine-based nonprofit, provides citizens with basic needs resources. Donate here. United Help Ukraine receives and distributes donations, food, and medical supplies to internally displaced Ukrainians and anyone affected by the war. Donate here. People in Need provides humanitarian aid to over 200,000 people on the ground. Donate here. The Ukrainian Red Cross undertakes humanitarian work, from aiding refugees to training doctors. Donate here. UN Refugees Agency supports refugees. Donate here. UNICEF Ukraine is repairing schools damaged by the bombings and providing emergency responses to children affected by the war. Donate here. In coordination with the Security Working Group, the Drupal Association is taking steps to ensure we are prepared for any cybersecurity implications of the war. If you have concerns about Drupal security, you can reach out to security@drupal.org. As always, our global Drupal community is better together. We stand in solidarity and hope for peace to come soon. *List of resources originally compiled by Global Citizen Editor's note: This post was updated on June 20th 2023 to strengthen the language. It now refers to the attack as an invasion and the conflict as a war."
