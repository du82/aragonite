description = "Drupal is an open source platform for building amazing digital experiences. It's made by a dedicated community. Anyone can use it, and it will always be free."
full_description = '''Create Ambitious Digital Experiences Drupal is a fully composable CMS that allows you to design a digital experience to your vision. Try Drupal CMS Image Still on Drupal 7? Security support for Drupal 7 ended on 5 January 2025. Please visit our Drupal 7 End of Life resources page to review all of your options. We stand with Ukraine 🇺🇦 You can help The wait is over - Drupal CMS is here! Build sophisticated websites with intuitive tools designed for marketers and content teams Learn about Drupal CMS Try Drupal CMS Flexible by design Image User-centric experiences Create compelling content across more devices than ever with tools that build versatile, structured content and integrate seamlessly with a wide range of digital marketing channels. Image Lower cost of ownership With no vendor lock-in and low-code/no-code options available, marketers can independently drive your digital strategy and publishing workflows. Image Limitless flexibility A fully composable, open source, API-first platform that allows you to design around your vision and your user needs. A global network of open source contributors continuously develops and innovates on core features. Image Enterprise-grade tooling The most accessible, secure open source DXP available. It adheres to industry standard privacy and security standards and checks all the boxes for your IT team. "Drupal's flexibility and extensibility allow us to tailor the content management system to fit our university's needs." Jill Moraca — Senior Director, Web Development Services, Office of Information Technology of Princeton University Image Image DDEV is the official local development tool of Drupal. And like Drupal, DDEV depends on the support of the open source community. Learn how to support DDEV See why top universities choose Drupal Image YaleSites brings a new era of digital collaboration and brand unity for the Yale University community. Learn how to scale Drupal Image How Drupal powers knowledge management platforms Image UNICEF provides essential services to children, defends their rights, and empowers them to fulfill their potential worldwide. 190 countries and territories served Learn about UNICEF on Drupal Image Why governments build with Drupal Image The State of Georgia's next-generation platform is powered by Drupal and helps state agencies serve residents better. 10M+ residents served 80 programs and agencies Learn more about the State of Georgia on Drupal Image Start your Drupal journey Drupal CMS empowers marketers and site builders to create stunning websites with ease—no advanced skills required. Ideal for most projects. Start building with Drupal CMS Learn about Drupal CMS Drupal core is the open source foundation you need to build powerful digital experiences. Perfect for developers and advanced users. Try Drupal core Download Drupal core Open Source means no vendor lock-in 100+ Drupal Certified Partners provide global support 10k+ experienced Drupal professionals 400k+ websites using Drupal today'''
