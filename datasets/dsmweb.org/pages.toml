full_description = "DSM Conference The International Design Structure Matrix (DSM) Conference is the annual forum for practitioners, academics and researchers, and software developers of DSM-related tools, to exchange experiences, development results, trends, and develop new ideas to complexity management in all kinds of industries from different perspectives. The DSM Conference has evolved from a series of workshops at the Massachusetts Institute of Technology and the Engineering Design Center at the University of Cambridge, it has turned into a full conference, having made a tour around the world. At all times, it was one of the meeting places for the DSM Community that has continuously grown to about 70 active members, most of whom have been constant participants. The past DSM Workshops and Conferences: 1999Cambridge, MA, USAMassachusetts Institute of Technology (MIT)2000Cambridge, MA, USAMassachusetts Institute of Technology (MIT)2001Cambridge, MA, USAMassachusetts Institute of Technology (MIT)2002Cambridge, MA, USAMassachusetts Institute of Technology (MIT)2003Cambridge, UKCambridge University2004Cambridge, UKCambridge University2005Seattle, WA, USAThe Boeing Company2006Seattle, WA, USAThe Boeing Company2007Munich, GermanyTechnische Universität München (TUM) / BMW Group /Jönköping International Business School (JIBS)2008Stockholm, SwedenJönköping International Business School (JIBS) / Technische Universität München (TUM) /Royal Institute of Technology (KTH)2009Greenville, SC, USAClemson University / Technische Universität München2010Cambridge, UKUniversity of Cambrigde / Technische Universität München2011Cambridge, MA, USAMassachusetts Institute of Technology (MIT)2012Kyoto, JapaniSiD IT Solution Innovator2013Melbourne, AustraliaRapid Invention Pty Ltd2014Paris, FranceEcole Centrale Paris2015Texas, USATexas Christian University2016São Paulo, BrazilUniversity of São Paulo2017Espoo, FinnlandAalto University2018Trieste, ItalyUniversity of Trieste2019Monterey, USAT