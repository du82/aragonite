["https://dsmweb.org/dsm-industry-survey"]
title = "DSM Industry Survey – The Design Structure Matrix (DSM)"
description = "The DSM Survey contains 11 questions about the practitioner's experience with DSM and how they would like the DSMiSIG to help them in using DSM.  If you are working in industry and business and have not yet filled in the 11-question survey, please click on the Survey link and give us your input: DSM in Industry Survey…"
full_description = "DSM Industry Survey The DSM Survey contains 11 questions about the practitioner’s experience with DSM and how they would like the DSMiSIG to help them in using DSM. If you are working in industry and business and have not yet filled in the 11-question survey, please click on the Survey link and give us your input: DSM in Industry Survey We have analyzed the responses as of 7 June 2012. The survey shows some initial results about the barriers to the introduction and use of DSM in industry and what DSM practitioners would like to see done by the DSMiSIG to help and support them in the use of the DSM method and relevant tools.The survey indicated that amongst the 32 respondents there is still limited understanding amongst DSM users about the method and tools that can or should be used for various applications. Respondents fell into two camps, small/very small organisations and large organisations, with almost nobody using DSM in medium sized organisations. Although DSM was used in almost all industry sectors, except retail/wholesale, the most widespread use of DSM was in the manufacturing sector, services/consulting and construction. It is encouraging to see that DSM is applied to all sizes of projects from small to very large and to a wide variety of use cases. The barriers to the use of DSM are substantial. One of the major barriers is the lack of case studies demonstrating value of the methodology. This is especially important, as other barriers such as lack of understanding of the method, the perceived extra work required to achieve benefits and the lack of fit with existing processes and projects mean that current industry users fight an uphill battle in their organisation trying to create better awareness of the value of the method. The question regarding what the respondents wanted from the DSMiSIG indicates that apart from the case studies mentioned above, networking with DSM practitioners, access to resources, training and experts and potentially a blog would be good vehicles to increase acceptance of the method and confidence of users. Currently the ‘scientific’ communication channels and word of mouth appear to be the most commonly cited channels by which respondents gained knowledge or initial awareness of the DSM methodology or tools. Commonly used industry specific communication vehicles are not currently used to gain awareness of DSM, probably as they do not currently contain any information about DSM. If you are interested in seeing the detailed results of the DSM Industry Survey, please join the DSMiSIG by visiting our forum on LinkedIn."
year_published = 2019
year_updated = 2019
