description = "As complexity is an ever-present problem in nearly all branches of science and industry, the DSM Community is an interdisciplinary and international group consisting of researchers, practitioners and tool developers originating from many different disciplines.Over the years, our community has continuously expanded – through the common website, the DSM Conference that originated as a workshop…"
