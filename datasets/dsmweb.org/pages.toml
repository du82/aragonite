title = "Lattix – The Design Structure Matrix (DSM)"
description = "Field of Application Lattix has been primarily used in the field of software/IT systems engineering across many industries, however it has also been applied to a wide variety of complex systems that include software, hardware, activities/processes, and organizations. Users include architects, engineers, and quality/test staff as well as managers.Supported tasks Create a system blueprint by…"
full_description = "Lattix Field of Application Lattix has been primarily used in the field of software/IT systems engineering across many industries, however it has also been applied to a wide variety of complex systems that include software, hardware, activities/processes, and organizations. Users include architects, engineers, and quality/test staff as well as managers.Supported tasks Create a system blueprint by mapping dependencies across the various domains of the systemAnalyze, optimize, and specify the system architecture through the DSM, diagrams, and dependency rulesIdentify dependencies which violate the architectureIdentify and explore opportunities to improve the modularity of the systemMeasure quality with key metrics and track changes to the system architecture over timeAssess the impact and risk of proposed changes to the system Main Features Hierarchical DSM/MDMs created manually or by automated extraction of dependency information from UML/SysML models, software codebases, SQL, databases, files (such as Excel and XML), and other tools.Numerous algorithms and editing features to analyze and re-engineer systems including activities, processes, requirements, software, hardware, tests, resources, and organizations.Rules engine to specify and automatically enforce the system architecture when project updates capture changes across the system.Web-based Repository and command-line utilities enable integration with data sources and enable users to automatically update, measure, track, and communicate the status of their projects.LattixWeb application provides interactive web-based access to the DSM and automated reports of key metrics and trends, as well as providing the ability to generate comparisons of selected versions of the project. Supported use cases Support for the following use cases is provided at each stage of the development lifecycle (forward engineering, reverse engineering, and round-trip engineering for ongoing redesign and system maintenance): Document and enforce the intended architecture, including component/interface corporate standards.Refactor or re-engineer the system to migrate to new technologies or platforms, in addition to improving quality, robustness, and maintainability.Conduct impact analysis across system domains, such as identifying which requirements are affected or which tests must be run when changes are made to the system software or hardware. Contact Address: Lattix Inc. 352 Park Street 203W North Reading MA 01864 USA Phone +1 (978) 664 5050Email sales@lattix.com Internet www.lattix.comDownload www.lattix.com/download"
