description = "The Design Society, Special Interest Group “Managing Structural Complexity” The design society was founded to contribute to a broad and established understanding of development and design, and to promote the use of results and knowledge from research on engineering design for the good of humanity.  As part of this work, the Special Interest Group “Managing Structural Complexity” was…"
full_description = "International Societies The Design Society, Special Interest Group “Managing Structural Complexity” The design society was founded to contribute to a broad and established understanding of development and design, and to promote the use of results and knowledge from research on engineering design for the good of humanity. As part of this work, the Special Interest Group “Managing Structural Complexity” was set up to gain and mediate areas of competence with regard to the structural complexity management in all aspects of product development by consideration of different views onto a system, its elements and interdependencies, and its evolution and dynamics. www.designsociety.org The International Council on Systems Engineering (INCOSE) INCOSE is a not-for-profit membership organization founded to advance the state of the art and practice of systems engineering in industry, academia, and government by promoting interdisciplinary, scaleable approaches to produce technologically appropriate solutions that meet societal needs. www.incose.org The American Society of Mechanical Engineers (ASME) ASME is a not-for-profit professional organization that promotes the art, science and practice of mechanical and multidisciplinary engineering and allied sciences throughout the world. www.asme.org IEEE Originating from the Institute of Electrical and Electronics Engineers, Inc., IEEE is a non-profit organization, seeing its role in supporting the worldwide advancement of technology. www.ieee.org"
