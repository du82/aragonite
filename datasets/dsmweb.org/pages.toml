full_description = "NDepend Field of ApplicationNDepend is a Visual Studio tool to manage complex .NET code and achieve high Code Quality. Supported tasksWith NDepend, software quality can be measured using Code Metrics, visualized using Graphs, Matrix and Treemaps, and enforced using standard and custom Rules. Hence the software design becomes concrete, code reviews are effective, large refactoring are easy and evolution is mastered. NDepend offers Context-Sensitive Help to educate the user about what he sees on DSM. NDepend’s DSM relies on a simple three coloring scheme for DSM cell: Blue, Green and Black. When hovering a row or a column with the mouse, the Context-Sensitive Help explains the meaning of this coloring scheme Main Features Layered CodeDependency CycleHigh Cohesion – Low CouplingSingle Responsibility Principle (SRP)Popular Code ElementsWorks closely with a dependency graph layout Supported use casesNDepend’s DSM comes with numerous options to try: It has numerous facilities to dig into dependency exploration (a parent column/row can be opened, cells can be expanded…)It can deal with squared symmetric DSM and rectangular non-symmetric DSMHorizontal and Vertical headers can be bound, to constantly have a squared symmetric matrixIt comes with the option Indirect usage, where cell shows direct and indirect usageThe vertical header can contains tier code elements Contact Patrick Smacchia Email: support@ndepend.comInternet: http://www.ndepend.com/docs/dependency-structure-matrix-dsmDownload: http://www.ndepend.com/download"
