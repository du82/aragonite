["https://dsmweb.org/banding-a-dsm"]
title = "Banding a DSM – The Design Structure Matrix (DSM)"
description = "Banding is the addition of alternating light and dark bands to a DSM to show independent (i.e. parallel or concurrent) activities (or system elements). Banding is similar to partitioning the DSM using the Reachability Matrix Method when the feedback marks are ignored (a band corresponds to a level). (Compare Grose, D. L.: Reengineering the aircraft design…"
full_description = "Banding a DSM Banding is the addition of alternating light and dark bands to a DSM to show independent (i.e. parallel or concurrent) activities (or system elements). Banding is similar to partitioning the DSM using the Reachability Matrix Method when the feedback marks are ignored (a band corresponds to a level). (Compare Grose, D. L.: Reengineering the aircraft design process, 5th AIAA/USAF/NASA/ISSMO Symposium on Multidisciplinary Analysis and Optimization, Panama City Beach, FL, 1994) The collection of bands or levels within a DSM constitute the critical path of the system or project. Furthermore, one element or activity within each band is the critical or the bottleneck activity. Thus, fewer bands are preferred since they improve the concurrency of the system or project. For example, in the DSM shown below, tasks 4 and 5 do not depend on each other for information; therefore, they belong to the same band. Note that in the banding procedure, as described above, feedback marks are not considered (i.e. they are ignored in the process of determining the bands)."
