["https://dsmweb.org/comercial-tools"]
title = "Commercial Tools – The Design Structure Matrix (DSM)"
description = "ACCLARO DFSS by Axiomatic Design Solutions, Inc. Acclaro DFSS software has a full featured DSM module that implements partitioning, clustering and tearing of DSM matrices.  Exports to Microsoft project for scheduling.  The module is integrated with DFSS quality tools of VOC, axiomatic design, FMEA to validate and risk reduce solutions prior to dependency analysis. Flow by Adept…"
full_description = "Commercial Tools ACCLARO DFSS by Axiomatic Design Solutions, Inc. Acclaro DFSS software has a full featured DSM module that implements partitioning, clustering and tearing of DSM matrices. Exports to Microsoft project for scheduling. The module is integrated with DFSS quality tools of VOC, axiomatic design, FMEA to validate and risk reduce solutions prior to dependency analysis. Flow by Adept Management Ltd. Flow is designed to plan and control complex, iterative, and information driven project processes. It is used to define, streamline, plan and deliver processes, using a work breakdown structure, a DSM approach to interrelate process steps or activities, a Gantt chart visualization and a dynamic checklist to control the process execution. IntelliJ IDEA by JetBrains s.r.o. IntelliJ IDEA is a commercial Java integrated development environment (IDE) offering a number of refactor tools. As one Code Quality Feature, it offers DSM based dependency analysis to reflect the dependencies between classes in a software development project. Lattix by Lattix, Inc Lattix offers a complete system for DSM/MDM analysis and management of complex systems. Lattix pioneered the DSM approach for automated enforcement of software architectures and now supports MDM analysis of enterprise systems including processes, requirements, tests, hardware, infrastructure and organizations, providing powerful visualization and change impact analysis across the entire system. The Lattix System includes many modules, tools, and features to extract dependency information and create DSM/MDMs from UML/SysML models, software codebases, SQL, databases, files (such as Excel and XML), and other tools. Loomeo by Teseon GmbH LOOMEO-Software is based on a generic approach to structure analysis and synthesis. LOOMEO makes use of the principles of matrix and graph theory. On the one hand these enable the comprehensive analysis of cross-linked structures. On the other hand potentials for structure optimization can be highlighted by visualizing different perspectives and realized by applying adequate algorithms. NDepend by NDepend NDepend offers Context-Sensitive Help to educate the user about what he sees on DSM. NDepend’s DSM relies on a simple three coloring scheme for DSM cell: Blue, Green and Black. When hovering a row or a column with the mouse, the Context-Sensitive Help explains the meaning of this coloring scheme BOXARR by BOXARR, Ltd. BOXARR is the leading solution for ‘Complex Inter-dependent Systems Management’. Supporting some of the world’s largest organisations, BOXARR delivers truly scalable applications to solve challenges of complex inter-dependencies across data intelligence aggregation; systems design engineering and integration; supply-chain; process management; mission/program planning; joint operations; and knowledge management & transfer methodology. ProjectDSM by Project DSM Pty Ltd ProjectDSM uses user-friendly wizards to guide project managers through the project planning process from defining the project scope, identifying dependencies and using the Design Structure Matrix to define and analyze the risk and impact of iteration loops on project cost and delivery time. The software provides guidance for plan optimization and allows resourcing and scheduling. It has a number of visualization tools and interfaces with Microsoft applications including Excel, Word and Project. Soley Studio by Soley Soley Studio enables you to create, analyze and visualize large dependency networks. Define your own metamodel, import data from various data sources (Excel, databases), use intuitive modeling tools (graph-based, matrix-based) and create presentation-ready visualizations. Soley Studio uniquely provides the technology to automate analysis workflows including pattern search and graph metrics. Structure 101 by Headway Software Headway Software offers Structure 101, an application that enables code developers to visualize and understand the structure of their code base. Structure101 allows to control structural complexity by measuring the degree to which any item exceeds the limits of predefined values and relating this to the amount of code impacted so that any repair work can be prioritized. The locations of productivity-killing package dependency cycles can be identified and analyzed how best to break them. The program furthermore allows to control architecture by vizualizing howhigh-level components depend on each other and why. This allows to find out immediately when an architecture is accidentally changed by code-level changes at the coal-face, and how the rogue dependencies can best be treated."
