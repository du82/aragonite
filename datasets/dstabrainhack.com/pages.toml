title = "Privacy Statement | DSTA BrainHack 2025"
description = "BrainHack is a unique, hands-on experience into the swiftly evolving world of digital tech. Dive deep into the exciting realms of cybersecurity, artificial intelligence (AI), space technologies, app development, fake news detection, extended reality and more."
full_description = '''FAQabout dstaCONTACT USPRIVACY STATEMENTTERMS OF USE PRIVACY STATEMENT1. This is a website operated by DSTA appointed contractor.2. We may use "cookies", where a small data file is sent to your browser to store and track information about you when you enter our digital service. The cookie is used to track information such as the number of users and their frequency of use, profiles of users and their preferred digital services. While this cookie can tell us when you enter our digital services and which pages you visit, it cannot read data off your hard disk.3. You can choose to accept or decline cookies. Most web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. This may prevent you from taking full advantage of the digital service.FAQGet in touch with us for collaborations, projects, or inquiries. We'd love to hear from you!CONTACT USmore about dstaPRIVACY POLICY © 2025, DSTA SINGAPORETERMS OF USE4. This digital service may contain links to third-party websites whose data protection and privacy practices may differ from ours. We are not responsible for the content and privacy practices of these other digital services and encourage you to consult the privacy notices of those digital services.5. Please contact qsm@dsta.gov.sg if you: (a) have any enquires or feedback on our data protection policies and procedures; (b) need more information on or access to data which you have provided to us in the past.Are there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities, do check the activity key dates above for details.Do I have to bring my own devices for the physical activities of BrainHack 2024? For all events, participants who make it to the physical finals are required to bring their own laptops and accessories (monitors, charging devices etc.). Wired LAN and WiFi will be provided for internet access. ​ XRperience A limited number of XR headset devices will be provided for participants to test and develop their XR applications for the hackathon. Participants may bring their personal headset devices. ​ SpaceCube No prerequisite is required as training will be provided. Participants will need to bring their own laptops for the training. ​ TIL-AI For the virtual qualifiers and hybrid training/workshops, participants are required to use their own laptops. ​ For physical finals, there is no requirement for participants to bring their laptops. I’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as the participants are registering for the same category. Participants from different education levels can still form a team but the team category will be based on the highest education level attained within the team. I am interested to register but am unable to form a team. What should I do? You can register as an individual or a small group, and the organisers will help to form a team with other registrants where possible. What is the difference between early registration and registration? Early registrants will receive confirmation of their registration status around March 2024, before registration opens. As each activity has a limited number of slots, participants who are interested can secure their places earlier if they can commit to the key dates of each activity.I have submitted the application form. Is my participation confirmed? As there are limited slots for each activity, there may be a selection process after registration (or early registration) closes. Confirmed participants will be notified via email. All information with regard to the activity you registered for will be included in the email if you have been selected. Will I be able to take part in more than one activity?As some of the activities are held concurrently, please refer to the activity dates to plan your BrainHack experience according to your interest and availability (e.g. school commitments). Can I participate if I am a pre-enlistee or NSF? Yes, you can! You may participate based on your highest attained qualification.Are post-graduates, part-time university and foreigners/international students allowed to participate? Yes! Each activity has its own eligibility criteria, so please ensure that you check the requirements for the activities you are interested in before registering. Are Singaporeans studying overseas allowed to participate? Most of the events are done virtually so you can participate even though you study overseas. However, if you do manage to qualify for the finals, you are required to attend physically. In addition, please check if the activity you are interested in requires you to be present physically. PRIVACY STATEMENTFAQCONTACT USabout dstaPRIVACY STATEMENT © 2025, DSTA SINGAPORETERMS OF USE1. This is a website operated by DSTA appointed contractor.3. You can choose to accept or decline cookies. Most web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. This may prevent you from taking full advantage of the digital service.2. We may use "cookies", where a small data file is sent to your browser to store and track information about you when you enter our digital service. The cookie is used to track information such as the number of users and their frequency of use, profiles of users and their preferred digital services. While this cookie can tell us when you enter our digital services and which pages you visit, it cannot read data off your hard disk.4. This digital service may contain links to third-party websites whose data protection and privacy practices may differ from ours. We are not responsible for the content and privacy practices of these other digital services and encourage you to consult the privacy notices of those digital services.5. Please contact qsm@dsta.gov.sg if you: (a) have any enquires or feedback on our data protection policies and procedures; (b) need more information on or access to data which you have provided to us in the past.FAQGet in touch with us for collaborations, projects, or inquiries. We'd love to hear from you!more about dstaCONTACT USTERMS OF USEPRIVACY POLICY HOMEBH25 LORESHOWCASE PROGRAMMEREGISTER NOWHOMEBH25 LORESHOWCASE PROGRAMMEREGISTER NOW'''
