title = "Home | DSTA BrainHack 2025"
description = "BrainHack is a unique, hands-on experience into the swiftly evolving world of digital tech. Dive deep into the exciting realms of cybersecurity, artificial intelligence (AI), space technologies, app development, fake news detection, extended reality and more."
full_description = "REGISTER NOW HOMEBH25 LOREREGISTER NOWSHOWCASE PROGRAMMEHOMEBH25 LORESHOWCASE PROGRAMMEREGISTER NOW​BrainHack is your unique hands-on experience into the future of digital technology. Dive into the realms of Cybersecurity, Artificial Intelligence, Space Tech, Software Development, Robotics and many more.KEY DATESTEAM FORMATION TIMELINEACTIVITIESWith three exciting areas – COMPETE, LEARN and EXPERIENCE – there is bound to be something for everyone. Step up your game and compete to win cash prizes in one of the four domains. Learn, build your skills and explore new technologies at the various hands-on workshops. Finally, experience the Tech Showcase, where you can immerse yourself in ​cutting-edge innovations and witness the future of technology in action. Note: Registration is now open for COMPETE and LEARN activities. Students who successfully qualify for the physical finale will automatically have access to the EXPERIENCE activities.COMPETEMORE INFO COMING SOONCYBER DEFENDERS DISCOVERY CAMPCapture The Flag Dive into the world of cybersecurity and uncover what it takes to defend against digital threatsMORE INFO COMING SOONTODAY I LEARNED-AIArtificial Intelligence Challenge Train and deploy AI and autonomous solutions to tackle real-world tasksMORE INFO COMING SOONCODE_EXPMobile Dev Hackathon Learn, Ideate, Code. Experience the mobile app development journeyMORE INFO COMING SOONSPACECUBESpace Tech Challenge Explore space technology and compete to assemble and integrate a CubeSatLEARNMORE INFO COMING SOONSEETRUE WORKSHOPLearn how Generative AI content is used in disinformation and test it against detection toolsMORE INFO COMING SOONCOUNTER DRONE WORKSHOPLearn about the technology used to defend against malicious dronesMORE INFO COMING SOONDRONE WORKSHOPLearn how to program and optimise an algorithm to allow drones to conduct a mission efficientlyEXPERIENCEMORE INFO COMING SOONTECH SHOWCASE AND TECH TALKSGet up close and personal with a diverse rang