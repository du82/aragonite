STERFAQGet in touch with us for collaborations, projects, or inquiries. We'd love to hear from you!CONTACT USmore about dstaPRIVACY POLICY © 2025, DSTA SINGAPORETERMS OF USELEARNSEETRUE WORKSHOPMORE INFO COMING SOON >Learn how Generative AI content is used in disinformation and test it against detection toolsREGISTERDRONE WORKSHOPMORE INFO COMING SOON >Learn how to program and optimise an algorithm to allow drones to conduct a mission efficientlyREGISTERAre there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities, do check the activity key dates above for details.Do I have to bring my own devices for the physical activities of BrainHack 2024? For all events, participants who make it to the physical finals are required to bring their own laptops and accessories (monitors, charging devices etc.). Wired LAN and WiFi will be provided for internet access. ​ XRperience A limited number of XR headset devices will be provided for participants to test and develop their XR applications for the hackathon. Participants may bring their personal headset devices. ​ SpaceCube No prerequisite is required as training will be provided. Participants will need to bring their own laptops for the training. ​ TIL-AI For the virtual qualifiers and hybrid training/workshops, participants are required to use their own laptops. ​ For physical finals, there is no requirement for participants to bring their laptops. I’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as the participants are registering for the same category. Participants from different education levels can still form a team but the team 