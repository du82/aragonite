["https://www.dstabrainhack.com/faq"]
title = "FAQ | DSTA BrainHack 2025"
description = "BrainHack is a unique, hands-on experience into the swiftly evolving world of digital tech. Dive deep into the exciting realms of cybersecurity, artificial intelligence (AI), space technologies, app development, fake news detection, extended reality and more."
full_description = "FREQUENTLY ASKED QUESTIONSAre there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities, do check the activity key dates above for details.Do I have to bring my own devices for the physical activities of BrainHack 2025? For all events, participants who make it to the physical finals are required to bring their own laptops and accessories (monitors, charging devices etc.). Wired LAN and WiFi will be provided for internet access. ​ SpaceCube No prerequisite is required as training will be provided. Participants will need to bring their own laptops for the training. ​ TIL-AI For the virtual qualifiers and hybrid training/workshops, participants are required to use their own laptops. ​ For physical finals, there is no requirement for participants to bring their laptops. I’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as the participants are registering for the same category. Participants from different education levels can still form a team but the team category will be based on the highest education level attained within the team. I am interested to register but am unable to form a team. What should I do? You can register as an individual or a small group, and the organisers will help to form a team with other registrants where possible. What is the difference between early registration and registration? Early registrants will receive confirmation of their registration status around March 2024, before registration opens. As each activity has a limited number of slots, participants who are interested can secure their places earlier if they can commit to the key dates of each activity.I have submitted the application form. Is my participation confirmed? As there are limited slots for each activity, there may be a selection process after registration (or early registration) closes. Confirmed participants will be notified via email. All information with regard to the activity you registered for will be included in the email if you have been selected. Will I be able to take part in more than one activity?As some of the activities are held concurrently, please refer to the activity dates to plan your BrainHack experience according to your interest and availability (e.g. school commitments). Can I participate if I am a pre-enlistee or NSF? Yes, you can! You may participate based on your highest attained qualification.Are post-graduates, part-time university and foreigners/international students allowed to participate? Yes! Each activity has its own eligibility criteria, so please ensure that you check the requirements for the activities you are interested in before registering. Are Singaporeans studying overseas allowed to participate? Most of the events are done virtually so you can participate even though you study overseas. However, if you do manage to qualify for the finals, you are required to attend physically. In addition, please check if the activity you are interested in requires you to be present physically. Are there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities, do check the activity key dates above for details.Do I have to bring my own devices for the physical activities of BrainHack 2025? For all events, participants who make it to the physical finals are required to bring their own laptops and accessories (monitors, charging devices etc.). Wired LAN and WiFi will be provided for internet access. ​ SpaceCube No prerequisite is required as training will be provided. Participants will need to bring their own laptops for the training. ​ TIL-AI For the virtual qualifiers and hybrid training/workshops, participants are required to use their own laptops. ​ For physical finals, there is no requirement for participants to bring their laptops. I’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as the participants are registering for the same category. Participants from different education levels can still form a team but the team category will be based on the highest education level attained within the team. I am interested to register but am unable to form a team. What should I do? You can register as an individual or a small group, and the organisers will help to form a team with other registrants where possible. What is the difference between early registration and registration? Early registrants will receive confirmation of their registration status around March 2024, before registration opens. As each activity has a limited number of slots, participants who are interested can secure their places earlier if they can commit to the key dates of each activity.I have submitted the application form. Is my participation confirmed? As there are limited slots for each activity, there may be a selection process after registration (or early registration) closes. Confirmed participants will be notified via email. All information with regard to the activity you registered for will be included in the email if you have been selected. Will I be able to take part in more than one activity?As some of the activities are held concurrently, please refer to the activity dates to plan your BrainHack experience according to your interest and availability (e.g. school commitments). Can I participate if I am a pre-enlistee or NSF? Yes, you can! You may participate based on your highest attained qualification.Are post-graduates, part-time university and foreigners/international students allowed to participate? Yes! Each activity has its own eligibility criteria, so please ensure that you check the requirements for the activities you are interested in before registering. Are Singaporeans studying overseas allowed to participate? Most of the events are done virtually so you can participate even though you study overseas. However, if you do manage to qualify for the finals, you are required to attend physically. In addition, please check if the activity you are interested in requires you to be present physically. Are there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities. Please check the respective activity's info page for more details. For all COMPETE activities, there will be pre-finale training and/or qualifiers. There will be no pre-finale training and/or qualifiers for all LEARN activities. All workshops will be held as a half-day session during the physical finale.Do I have to bring my own devices for the physical activities of BrainHack 2025? Participants are required to use their own laptops for all pre-finale training and qualifiers under the COMPETE activities. Participants who qualify for the physical finale under the following activities are required to bring their own laptops: - Cyber Defenders Discovery Camp (CDDC) - CODE_EXP - SpaceCube - SeeTrue WorkshopI’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as participants are registering for the same category. Participants from different education levels can still form a team but the team category will be based on the highest education level within the team. I am interested to register but am unable to form a team. What should I do? You can register as an individual or a small group, and the organisers will help to form a team with other registrants where possible. I have submitted the application form. Is my participation confirmed? As there are limited slots for each activity, there may be a selection process after registration closes. Confirmed participants will be notified via email. All information with regard to the activity you registered for will be included in the email if you have been selected. Will I be able to take part in more than one activity?As some of the activities are held concurrently, please refer to the activity dates to plan your BrainHack experience according to your interest and availability (e.g. school commitments). More info on the activities will be available at a later date.Are foreigners/international students allowed to participate?You will need to join a team with a minimum number of Singaporeans. Each activity has its own eligibility criteria, so please ensure that you check the requirements for the activities you are interested in before registering.Can I participate if I am a pre-enlistee or NSF? Yes, you can! You may participate based on your highest qualification.Can I participate if I am a secondary school student or post-graduate student?Unfortunately, no. BrainHack's activities are specially tailored for students from post-secondary to undergraduate level. This is to ensure fairness among participants, minimising the differences in experience and skillset, creating a level playing field for everyone.Can I participate if I am a working professional?Unfortunately, no. BrainHack is specially tailored for students from post-secondary to undergraduate level, and does not have an open category for the general public and working professionals. However, undergraduates who are working part-time, or those who have received a job offer while still completing their degree, are welcome to join.I will graduate before the BrainHack activities commence. Can I still participate?Yes, you can, as long as you are a post-secondary student, up until undergraduate level, at the time of registration for Brainhack.Are Singaporeans studying overseas allowed to participate? Most of the pre-finale events for COMPETE activities are done virtually so you can participate even though you study overseas. However, if you do manage to qualify for the finals, you are required to attend physically. In addition, please check if the activity you are interested in requires you to be present physically. Additionally, LEARN and EXPERIENCE activities are only available physically during the finale on 11-12 Jun.FAQGet in touch with us for collaborations, projects, or inquiries. We'd love to hear from you!more about dstaCONTACT USTERMS OF USEPRIVACY POLICY FAQCONTACT USabout dstaPRIVACY STATEMENT © 2025, DSTA SINGAPORETERMS OF USEFREQUENTLY ASKED QUESTIONSAre there any prerequisites to take part in any of the activities? There are no prerequisites as training will be provided. Which activities are being held virtually/physically?Each activity will have a different set of virtual and physical activities. Please check the respective activity's info page for more details. For all COMPETE activities, there will be pre-finale training and/or qualifiers. There will be no pre-finale training and/or qualifiers for all LEARN activities. All workshops will be held as a half-day session during the physical finale.Do I have to bring my own devices for the physical activities of BrainHack 2025? Participants are required to use their own laptops for all pre-finale training and qualifiers under the COMPETE activities. Participants who qualify for the physical finale under the following activities are required to bring their own laptops: - Cyber Defenders Discovery Camp (CDDC) - CODE_EXP - SpaceCube - SeeTrue WorkshopI’ve taken part in a previous edition of BrainHack. Can I still participate this year? Of course! You are more than welcome to sign up again, as the challenges will be different from past editions. Can students from different schools form a team? Yes, as long as participants are registering for the same category. Participants from different education levels can still form a team but the team category will be based on the highest education level within the team. I am interested to register but am unable to form a team. What should I do? You can register as an individual or a small group, and the organisers will help to form a team with other registrants where possible. I have submitted the application form. Is my participation confirmed? As there are limited slots for each activity, there may be a selection process after registration closes. Confirmed participants will be notified via email. All information with regard to the activity you registered for will be included in the email if you have been selected. Will I be able to take part in more than one activity?As some of the activities are held concurrently, please refer to the activity dates to plan your BrainHack experience according to your interest and availability (e.g. school commitments). More info on the activities will be available at a later date.Are foreigners/international students allowed to participate?You will need to join a team with a minimum number of Singaporeans. Each activity has its own eligibility criteria, so please ensure that you check the requirements for the activities you are interested in before registering.Can I participate if I am a pre-enlistee or NSF? Yes, you can! You may participate based on your highest qualification.Can I participate if I am a secondary school student or post-graduate student?Unfortunately, no. BrainHack's activities are specially tailored for students from post-secondary to undergraduate level. This is to ensure fairness among participants, minimising the differences in experience and skillset, creating a level playing field for everyone.Can I participate if I am a working professional?Unfortunately, no. BrainHack is specially tailored for students from post-secondary to undergraduate level, and does not have an open category for the general public and working professionals. However, undergraduates who are working part-time, or those who have received a job offer while still completing their degree, are welcome to join.I will graduate before the BrainHack activities commence. Can I still participate?Yes, you can, as long as you are a post-secondary student, up until undergraduate level, at the time of registration for Brainhack.Are Singaporeans studying overseas allowed to participate? Most of the pre-finale events for COMPETE activities are done virtually so you can participate even though you study overseas. However, if you do manage to qualify for the finals, you are required to attend ph"
