["https://duasynt.com/blog/cve-2019-2215-android-binder-uaf-s9"]
title = "CVE-2019-2215 Android Binder Use-after-free on Samsung S9 - Michael S"
description = "Binder exploit on Samsung S9 devices"
full_description = '''When the initial technical advisory for CVE-2019-2215 came out last year, Samsung S9 was listed as a vulnerable device. The use-after-free is indeed present in the Samsung kernels on unpatched S9 devices and can be triggered using the original reproducer discovered by syzkaller/syzbot. However, the obtained exploitation primitive is different from the Pixel 2 device demonstrated in the original advisory. This post demonstrates the differences between AOSP/Pixel and S9 kernels. If you're not familiar with the vulnerability details, refer to the P0 blog post for details. Specifically the vulnerable object struct thread_binder gets freed and then accessed (use-after-free) in remove_wait_queue(...). The full UAF path is ep_eventpoll_release → ep_free → ep_unregister_pollwait → ep_remove_wait_queue → remove_wait_queue. The first use-after-free access happens when locking the spinlock in [1]. For those not familiar with the Linux spinlocks implementation, the lock structure is shown below: If owner and next are equal, the lock can be acquired by the execution path. The previously described exploitation technique sets the lock value to 0 (unlocked state). If the refilled object at the lock offset (on Samsung kernels this offset is 0x68) within struct binder_thread is set to a value representing a locked spinlock state, the execution path above will enter a deadlock. However, the value of the spinlock can be any 32-bit integer as long as owner and next members are equal, e.g., 0x10001, 0x20002, etc. (indicating that it is unlocked). In [3] the unlocking procedure simply increments both the ownerand next values by 1. For example, if the original lock value was 0 (before acquiring the lock), after [3] it becomes 0x10001. Code paths in [1] and [3] by themselves represent a very weak exploitation primitive. What really makes this vulnerability exploitable is the code path in [2]. The UAF access on this path overwrites a couple of members of the freed struct binder_thread object with a "self-referencing" pointer when manipulating the linked list. __remove_wait_queue() simply performs the list_del operation on the task_list member the freed struct binder_thread:'''
