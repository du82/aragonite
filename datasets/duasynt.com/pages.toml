["https://duasynt.com/blog/cve-2014-2851-group_info-use-after-free-exploitation"]
title = "CVE-2014-2851 group_info UAF Exploitation - Vitaly Nikolenko"
description = "This is a case study for the use-after-free vulnerability which was assigned CVE-2014-2851 and affected Linux kernels through 3.14.1"
full_description = "This is a case study for the use-after-free vulnerability which was assigned CVE-2014-2851 and affected Linux kernels through 3.14.1. First of all, I'd like to thank Thomas for his help and the original write-upand his GitHub PoC. This bug might not be very practical (it takes a while to overflow a 32-bit integer) but it was an interesting vulnerability from an exploitation point of view. On our test system, the overall runtime to get # was just over 50 minutes :) There is a certain amount of indeterminism caused by RCU callbacks which makes the exploitation more difficult. Our test system was 32-bit Ubuntu 14.04 LTS (3.13.0-24-generic kernel) SMP. First, we will describe the vulnerability and walk through its exploitation. We will then discuss the challenges encountered in exploiting this bug. The vulnerable path shown below is reached when an ICMP socket is created. Note that even though standard users (on most Linux distributions) are not allowed to create ICMP sockets, no root privileges are required to reach the vulnerable code: In [3], the get_group_info() function atomically increments the group_info usage counter which is defined as a signed integer: Every time a new ICMP socket is created, the usage counter is incremented by one in [1]. However, for an unprivileged user, the check at [2] will fail (returning 0). Hence, the usage counter is never decremented in this exit path. We can repeatedly create new ICMP sockets overflowing this signed integer (0xffffffff + 1 = 0). The group_info structure is shared among forked children processes. When the group usage counter becomes 0, there are a number of paths in the kernel that may free it. One such path discovered by Thomas is the faccessat() syscall: In [4], a new struct cred is allocated and its usage counter (not to be confused with group_info->usage) is set to 1 and group_info->usage counter is incremented by 1. The put_cred in [5] then decrements the cred->usage counter and calls __put_cred(): The following shows the put_cred_rcu callback function, which in turn calls put_group_info() in [7] to free the group_info struct when its usage counter becomes 0:"
