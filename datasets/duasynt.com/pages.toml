["https://duasynt.com/blog/vmware-hardware-version-exploit-dev"]
title = "Differences in VMware hardware versions for exploit writers - Vitaly Nikolenko"
description = "VMware hardware versions prior to 9 do not support SMEP even if the CPU supports it"
full_description = "This is related to the previous post regarding the SMEP feature. Personally, I do use a number of solutions for all my kernel debugging work including VirtulBox, VMware, UML (User Mode Linux), and QEMU. There are obviously pros and cons to each of those solutions and I typically would pick one depending on the task at hand. For example, I find the VMware GDB stub to be quite stable and easy to set up. However, I wanted to highlight the differences in VMWare VM hardware versions. Hardware versions prior to 8 do not support SMEP even if the host CPU provides this feature. For example, I'm running VMware Fusion 5.0.3 (on i7 Ivy Bridge with SMEP support) that by default creates vms with hardware version 9: If we'll boot this virtual machine, we'll see that smep is in the list of flags in /proc/cpuinfo. Let's change the virtualHW.version to 8, save the vmx file and boot the virtual machine again:"
