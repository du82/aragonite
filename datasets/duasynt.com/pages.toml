["https://duasynt.com/blog/ubuntu-centos-redhat-privesc"]
title = "CVE-2019-15666 Ubuntu / CentOS / RHEL Linux Kernel 4.4 - 4.18 privilege escalation - Vitaly Nikolenko"
description = "Ubuntu 18.04 16.04 14.04 / CentOS 8 / RHEL 8 kernel local privilege escalation"
full_description = "A 0-day LPE (kernel) in CentOS 8(.1) was finally fixed today (4.18.0-147.3.1.el8_1). CentOS 8 and RHEL 8 kernels up to and including 4.18.0-80.11.2.el8_0 are vulnerable. Red Hat Enterprise Linux 8 on the other hand patched this vulnerability in October last year. Ubuntu 14.04 and 16.04 server distributions running 4.4 kernels were the first to patch this bug in late June last year. Ubuntu 18.04 (4.15.x kernels) patches were backported approximately a month later. The bug itself affects a large range of Linux kernels going back to 3.x kernels. The reason only above distributions are listed as vulnerable is because they allow unprivileged user namespaces required to reach the vulnerable code path. However, the reported out-of-bounds array access is harmless. There exists another execution path leading to use-after-free and reliable privilege escalation. p->index is user-controllable (unsigned 4-byte int), XFRM_POLICY_MAX is set to 3 and valid policy directories (p->dir) are 0, 1 and 2. In [1], the index is folded and checked against the policy directory. For example, index 1006 corresponds to policy directory 2 (XFRM_POLICY_FWD). In [2], xfrm_policy_id2dir now folds the policy index against 7 (not 3!). The same index 1006 would now result in policy directory 6: Then in [3], 6 is used as the index into the policy_count array leading to OOB decrement by one (the size of policy_count array is 6). policy_count is an array of 4-byte integers and OOB by one decrement of the adjacent struct member does not result in any exploitable conditions. We will make our technical report detailing the original UAF vulnerability (leading to privilege escalation) along with the PoC public. We haven't checked all distributions (the bug was initially discovered on Ubuntu 18.04 / 4.15 kernel) and it is possible that there are other distributions that still haven't backported the patch. The rule of thumb: if your kernel build date is earlier than July last year, unprivileged user namespaces are supported then your distribution is probably vulnerable."
