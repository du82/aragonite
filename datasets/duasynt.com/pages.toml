["https://duasynt.com/blog/android-uao-kernel-expl-mitigation"]
title = "UAO (User Access Override) as a mitigation against addr_limit overwrites - Vitaly Nikolenko"
description = "UAO (User Access Override) implementation details in the Linux/Android kernel as mitigation against the addr_limit overwrite kernel exploitation technique"
full_description = "This post describes UAO (User Access Override) implementation details in the Linux/Android kernel and demonstrates its effectiveness against the common addr_limit overwrite kernel exploitation technique. Currently most recently Android devices on the market are based on the ARMv8.2 architecture extension. UAO feature was introduced in the ARMv8.2 extension. It allows unprivileged load and store (ldtr*/sttr*) instructions to behave as standard privileged ldr*/str* instructions. On systems without UAO support, standard privileged ldr*/str* instructions are used when accessing user-space addresses: If PAN (Privileged Access Never) is enabled, these privileged instructions generate faults when reading/writing from/to user-space addresses. Hence, the standard procedure in all user-space accessor functions (copy_to/from_user, get/put_user, memdup_user, etc.) temporarily disable PAN (specifically PSTATE.PAN), perform the user-space data access and then re-enable PAN. Functions uaccess_enable_not_uao and uaccess_disable_not_uao are simply no-ops when UAO is supported by the processor: The above macros ensure that PAN is enabled/disabled on user-space data accesses when there's no UAO support, i.e., when ARM64_ALT_PAN_NOT_UAO is specified. Otherwise, the whole block becomes a nop. For example, in case of copy_to_user, the store instructions above use the uao_user_alternative macro to replace privileged str* instructions with unprivileged sttr* instructions [2] when UAO is enabled and supported by the processor: The key implementation detail is unprivileged load/store instructions (unlike their privileged counterparts) don't generate faults when accessing user-space memory from EL1 (even if PAN is enabled/supported by the processor). This means that on systems with UAO support there's no need to enable and disable PAN when executing user-space accessor functions - PAN is always enabled. The UAO bit then allows control over how these unprivileged load/store instructions operate in EL1. If the UAO bit is 0 (disabled), ldtr*/sttr* don't generate faults on user-space accesses as stated above. However, when this bit is set, ldtr*/sttr* instructions behave as equivalent privileged ldr*/str* instructions."
