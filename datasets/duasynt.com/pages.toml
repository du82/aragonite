["https://duasynt.com/blog/linux-kernel-module-autoloading"]
title = "Linux kernel module autoloading - Michael S"
description = "Brief introduction to the Linux kernel autoloading process which significantly increases the kernel attack surface"
full_description = "Linux kernel module autoloading can often significantly increase the overall attack surface. Depending on the distribution configuration, certain outdated / often unused modules can be loaded by non-privileged users. From the attacker's perspective, module autoloading is obviously useful if the vulnerability is present in the module that can be loaded by a non-privileged user to trigger the bug. It can also be useful as an exploitation technique such as triggering module loading after overwriting the modprobe path with a path to your controlled binary. The following article describes the module autoloading process implemented by the Linux kernel. One of the common uses of this process is network modules when certain protocol implementations are compiled as modules and requested from user space. For example, DCCP (Datagram Congestion Control Protocol) implementation is generally compiled as a module on most mainstream distributions. When a socket is created in user space: the first argument represents the protocol family and the last argument is the actual protocol to be used under the chosen protocol family. The following execution path is triggered on socket creation: The family input argument for the example above is AF_INET. If the entire family is not present, the kernel attempts to autoload the module in [1]. request_moduleis a macro for the following function: In [3], the kernel executes call_modprobe which creates a user-space process with root privileges. modprobe_path is a global variable (char [256]) pointing to /sbin/modprobe by default (and can be set to an arbitrary path via sysctl kernel.modprobe). The argument to modprobe is net-pf-n where n is the numeric value for the address family (i.e. AF_INET in our example). /sbin/modprobe resolves the net-pf-n alias and loads the requested module. All these module aliases are listed in /lib/modules/`uname -r`/modules.alias. Once the network family is loaded (if required), __sock_create() then executes create() in [2] (provided by the address family) function with protocol and socket type parameters passed to sys_socket(). For example, if AF_INET is specified (as in our example above), __sock_create will execute inet_create():"
