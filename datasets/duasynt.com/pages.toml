["https://duasynt.com/blog/samsung-s20-rkp-selinux-disable"]
title = "SELinux RKP misconfiguration on S20 devices - Vitaly Nikolenko"
description = "Samsung S20 RKP misconfiguration allowing trivial SELinux bypass"
full_description = "By now most of the S20(+ 4G/5G) devices based on 4.19 kernels received the Samsung June security update (depending on your country/region) that included a patch for SELinux bypass (SVE-2019-15998). For example, S20 devices in Australia received the July update just recently skipping the June update entirely. S20 Ultra 5G, on the other hand, received the patch back in March. I was curious to see for how long this will go unnoticed / unfixed in S20 devices but apparently the issue was reported to Samsung back in early November 2019: The patch changed ss_initialized and selinux_enforcing to use RKP. These two global (data segment) variables are generally used to disable SELinux through some kernel primitive (e.g., some arbitrary or partial kernel write). On Samsung devices these variables are marked read-only from EL1 after initialisation (this protection is enforced by RKP/KDP). Directly writing into these variables hence leads to a kernel panic / device reset. On S20 devices however, these variables were not protected by RKP (starting from the very first release) and SELinux can be trivially disabled using some kernel write primitive: The June patch now properly marks selinux_enforcing and ss_initialized as __kdp_ro. Furthermore, these two variables are now added to the kdp_init_struct struct: This fix might seem like a non-critical patch given that most other vendors don't bother protecting selinux_enforced / ss_initialized variables at all. However, weak(er) kernel exploitation primitives now might be useful on S20 devices prior to the patch."
