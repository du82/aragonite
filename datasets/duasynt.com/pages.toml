["https://duasynt.com/blog/linux-kernel-heap-feng-shui-2022"]
title = "Linux kernel heap feng shui in 2022 - Michael S, Vitaly Nikolenko"
description = "Linux kernel heap feng shui in 2022"
full_description = "In this article we discuss changes in the Linux kernel slab allocator implementation and exploitation challenges associated with kernel heap-related vulnerabilities. We focus on the SLUB (unqueued slab allocator) implementation in this article since it is the most common allocator enabled by default on most Linux distributions and Android devices. We discuss some major changes in modern kernels that affect exploitability of heap-related vulnerabilities. Some of these changes/features were intentional where others were a side-effect hindering or aiding the exploitation process. Special-purpose caches are generally created for frequently allocated/used objects such as task_struct, cred, inode, sock, etc. There are other flags besides GFP_KERNEL that could make the allocation atomic, request high memory, etc. but GFP_KERNEL indicates a normal kernel allocation and represents the most common case for the allocation of a vulnerable object in UAF / heapovf related vulnerabilities. On a standard Linux system, SLUB general-purpose caches are named as kmalloc-* and start with as small as 8 bytes object caches and go up to 8k, in power of two increments, with an exception of 96- and 192-byte caches: When a new allocation is requested, e.g., kmalloc(24, GFP_KERNEL), this allocation gets rounded up to the next closest cache size. In this case, the requested 24 bytes will get served from the kmalloc-32 general-purpose cache. Objects of the same size (or when rounded up to the next closest general-purpose cache size) allocated via k*alloc API, get allocated in the same cache, assuming they get served by the same core (if SMP). This makes refills / heap sprays trivial if both vulnerable and target / refill objects are allocated via k*alloc. For comparison, on Android/arm64 the smallest general-purpose cache is kmalloc-128. From the exploitation point of view this could be an advantage or a disadvantage. Finally, special-purpose caches / allocations are created using kmem_cache_create/kmem_cache_alloc API. For example, creating a special-purpose cache test_cache for objects of size 86 bytes and requesting a single allocation:"
