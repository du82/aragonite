["https://www.dude.fi/woocommerce-verkkokauppa-mallia-custom-chopper"]
title = "WooCommerce-verkkokauppa mallia Custom Chopper 🏍️"
description = "Nämä verkkokaupat eivät ole pakasta vedettyjä, vaan huolella suunniteltuja räätälöityjä kokonaisuuksia. Lue mitä WooCommercella saa aikaan!"
full_description = "Kirjoittanut Roni Laukkarinen Hyvällä suunnittelulla WooCommercella saa aikaan verkkokaupan, jossa on erinomainen ostokokemus. Olemme Dudella erikoistuneet erityisesti räätälöityihin WooCommerce-toteutuksiin, joissa pyrimme välttämään valmislisäosia ja koodaamaan mahdollisimman paljon itse, mukautettuna asiakkaalle. Pyrimme noudattamaan mahdollisimman pitkälle WordPressin ja WooCommercen tapoja tehdä asioita, näin saamme aikaa kestävää ja toimivaa aikaan. Joskus myös teemme hybridiä, esimerkiksi isompaan jälleenmyyjäkauppakokonaisuuteen otamme pohjalle hyväksi havaitun lisäosan, jota räätälöimme hyödyntämällä koodin tarjoamia hookkeja. Esittelyssä kolme kruununjalokiveämme, mallia “Custom Chopper” Vuodesta 2013 olemme keskittyneet toteuttamaan räätälöityjä verkkosivustoja WordPressille ja räätälöityjä verkkokauppoja WooCommercelle. Ensimmäinen verkkokauppamme vuonna 2014 myi kuulokojeita eri maihin eri veroluokilla Suomen varastoilta (sittemmin kuopattu, yrityksestä vihjattiin 2014 kevään kuulumispostauksessa). WooCommerce mahdollistaa räätälöinnin, joten vain taivas on rajana tuunailussa. Nyt esittelemme kolme toteuttamaamme tuunattua verkkokauppaa. Alpa®-neuleet, joista et luovu Suurin osa Alpan myynnistä tapahtuu verkkokaupassa, joten nettikauppa on tärkeä osa yrityksen myyntiä. Alpa myy laadukkaita alpakanvillaneuleita ja haluamme että spessulaatu näkyy kauas. Alpan “verkkokauppastäkkiä” on hiottu ja hiottu vuosien varrella sellaiseksi, että se palvelee Alpan myyntitavoitteita, mutta ennen kaikkea verkkokaupan ostajia. Alpan ilmeessä näkyy räätälöinti vahvasti, muunmuassa valikot ja tuotelistaukset on räätälöity Alpan tarpeisiin. Navigointi on pyritty pitämään mahdollisimman selkeänä. Alpalle räätälöidyt ominaisuudet WooCommerce-verkkokauppaan Alpan verkkokauppa on toteutettu alunperin alle 20 kilotavun aloitusteemamme air-lightin päälle. Vaikka alkuperäisestä startterista ei ole jäljellä enää kuin sielu ja verkkokauppa on melko turboahdettu, suorituskykyinen jatkokehittäminen on perustusten ansiota. WordPress-verkkosivustolle on räätälöity kymmeniä uudelleenkäytettäviä lohkoja, joilla on kätevä rakentaa laskeutumissivuja markkinointiin, mutta tässä kirjoituksessa keskitymme räätälöityihin WooCommerce-ominaisuuksiin. Katso mitä mieltä Alpa on Dudesta. Optimoitu ostoprosessi ja tuotenäkymät Alpan tuotelistaukset ja ostoprosessi eivät ole ihan natiivia WooCommercea, vaan olemme keskittyneet tuotevariaatioiden valinnoissa ja ostoprosessissa ennen kaikkea selkeyteen. Ostoskori tarjoaa luontevasti asiakkaalle lisätuotteita, kuten huolto- ja pesutuotteita, joiden avulla asiakas saa pidennettyä neuleen käyttöikää. Alpan verkkokaupan tuotenäkymä ei ole perinteistä WooCommercea. Tuotenäkymissä on keskitetty saavutettavuuteen ja helppokäyttöisyyteen ilmeen osalta, mm. kokovalinnat ja värivalinnat on räätälöity tukemaan Alpan tuotteita. Muokkamattomasta WooCommercesta löytyy lähinnä pudotusvalikot eri vaihtoehdoille, tällaisen voit nähdä esimerkiksi vähän pienemmin räätälöimässämme Paahtimo Papun verkkokaupassa. Keskitetty varastonhallinta Tällä hetkellä Alpalla on kolme eri verkkokauppaa; yksi kotimaassa, toinen Ruotsissa ja kolmas joka tähtää kansainvälisille markkinoille. Kaikkia verkkokauppoja palvelee Alpan oma Jyväskylässä sijaitseva varasto, jossa jokainen tilaus myös käsitellään ja pakataan matkaan. Keskitetty varastosaldojenhallinta on avainasemassa asiakaskokemuksen ylläpitämiseksi. Verkkokaupat keskustelevat keskenään ja päivittävät varastosaldoja säännöllisin väliajoin, linkittäen eri kauppojen samat tuotteet toisiinsa SKU-koodien perusteella. Räätälöity verkkokauppa mahdollistaa integraatiot Alpan omiin tarpeisiin Koska verkkokaupassa on rajattomat kehitysmahdollisuudet, sitä voidaan integroida myös tulevaisuuden rajapintoihin. Alpa käyttää esimerkiksi varastossaan jakelurobottia, jolle voidaan syöttää verkkokaupasta tietoa automaattisesti. Lisäksi kehityksessä on jatkuvasti muita tapoja helpottaa alpalaisten elämää automatiikalla ja näitä ideoita voidaan kehittää myös verkkokaupan puolelle. Kattavat integraatiot, lisäosat ja custom-koodit markkinoinnin automaatioon, analytiikkaan ja varastosaldoon Perus-verkkokauppasälän kuten kattavien maksutapojen, kuitti- ja pakkauslistojen lisäksi Alpan verkkokauppa toimii yksiin mm. seuraavien kanssa: Fitle: Kokoapuri, jonka kautta käyttäjä saa selkeän informaation siitä mikä koko hänelle sopisi parhaiten. Stamped: Kattavat tuotearvostelut pilvessä. Alusta toimii kätevästi yhteen myös muiden markkinoinnin automaation työkalujen kanssa. Metorik: Verkkokaupan myynnin analysoimisen työkalu. Matkahuolto ja noutopistehaut: Tuotteiden postituksen pitää olla helppoa, mutta suoraviivaista myös ostajalle. Posti Smartship: Integraatio Postin SmartShipille pakettikorttien tulostamiseksi suoraan verkkokaupasta. PostNord: Integraatio PostNordille pakettikorttien tulostamiseksi suoraan verkkokaupasta. Älykkäät kupongit ja alennuskoodit kamppiksia varten Sivustolla on myös paljon pientä tuunausta ja ehostusta mm. veroluokkiin, sähköpostikuitteihin, Omnibus-hintoihin jne. ja kehitys jatkuu edelleen. Lue referenssi Vieraile sivustolla Jelmu.net, eli Jyväskylän Elävän Musiikin Yhdistys Jelmu ry eli tuttavallisimmin Tanssisali Lutakko, lyhyesti Lutakko Vuonna 2010 Suomen parhaaksi keikkapaikaksi valittu Lutakko on verkkopalvelu, jonka me Dudella olemme halunneet uudistaa jo pidemmän ajan. Allekirjoittanut on menneisyydessään pyörinyt jonkin verran keikoilla ja festareilla metallimusiikkitoimittajan roolissa, joten tietoa skenestä on jonkin verran. Muistan vielä ajat, kun lippu ostettiin maksamalla raha tilille perinteisellä tilinumerolla käyttäen tiettyä numeroa ja keikalle mennessä piti ottaa mukaan tämä viitenumero, jota vastaan pääsi sisään. Ellinoora keikalla, kuva: Tanssisali Lutakko / Historia Vuonna 1989 perustettu Jyväskylän Elävän Musiikin Yhdistys Jelmu ry on järjestänyt keikkoja vuodesta 1990 alkaen Tanssisali Lutakossa Schaumaninkadun (nyk. Lutakonaukio) entisessä leipomorakennuksessa. Jelmun toiminta on alusta saakka ollut voittoatavoittelematonta ja perustunut vapaaehtoistyöhön. Lutakon lippukauppa vuosimallia 2024 on kaikkea muuta kuin hankala. Liput saa keikalle kuin keikalle suoraan ja kätevästi ostamalla verkkokaupasta. Brändi-ilme on räätälöity Lutakolle, mutta myös niin että “pääväriä” voi tarvittaessa vaihtaa, mikä mätsää sesongin brändiin. Launchissa saitilla pyöri myös iso rullaava teksti, mutta ilmettä hieman vieläkin siitä suoraviivaistettiin sittemmin ohjaamaan suoraan lipunmyyntiin. Aikaa säästävä jäsenintegraatio Koska Jyväskylän Elävän Musiikin Yhdistys Jelmu ry on voittoa tavoittelematon ja kulttuuria edistävä yhdistys, se pyörii jäsenyyksien ja vapaaehtoistyön voimin. Lippuja ostaessaan voi tukea toimintaa ja ryhtyä jäseneksi. Jäsenrekisteripuoli on Lutakolle uniikki, sillä jäsenyyksillä saa alennuksia keikkoihin. Toteutimme Jelmulle jäsenrekisteriin integraation, jolla kävijät voivat liittyä jäseneksi samalla kun ostavat lipun keikalle, tai ostaa jo olemassaolevana jäsenenä halvemman lipun keikalle. Jäsenlipun ostaminen on Lutakon lippukaupassa helppoa. Lutakon verkkokauppa on Duden rokkareille uudenlainen sulka hattuun. Lippuostoksille Lutakkoon Rex on yksi maailman johtavista suksivoiteiden valmistajista – verkkokauppa toimii myyjien työkaluna ja mahdollistaa tehokkaan jälleenmyynnin Vuonna 1952 perustettu Rex myy tuotteita mm. pyöräilijöille ja hiihtäjille. Rexin verkkokaupassa on myynnissä satoja tuotteita alan harrastajille ja jälleenmyyjille. Verkkokauppa on toteutettu hyödyntäen kestäviä WordPress Coding Standards -laatukriteeristöjä, eli verkkokaupassa ei ole turhaa koodia (alan kielellä “bloattia”) vaan hallintapaneelia myöten kaikki on puhdasta ja selkeää. Jälleenmyyjäportaali selkeällä käyttöliittymällä Hyvän Dude-laatuisen ilmeen ja verkkosaitin lisäksi toteutimme Rexille laajemman Rex-jälleenmyyjäportaalin, jota kautta jälleenmyyjä voi tehdä ja hallinnoida tilauksiaan suoraan rex.fi-verkkokaupan kautta. Rexin jälleenmyyntikauppa on jälleenmyyjälle selkeä ja suoraviivainen. Jälleenmyyjät voivat valita tuotteet ja tehdä haluamalleen tuotelistalleen kätevästi tilauksia. Taustatekniikassa on myös kiinnitetty huomiota mm. siihen, että jälleenmyyntiportaalin kautta saadaan myös lisämyyntiä varten kiinni esimerkiksi liidit. Integraatio Procountor-laskutusjärjestelmään Rexin verkkokauppa on integroitu Procountor-laskutusjärjestelmään Duden ohjelmoiman custom-lisäosan WooCommerce Procountor Invoice Gatewayn kautta. Integraatio on optimoitu Rexin käyttöön siten, että se säästää arvokasta työaikaa kun laskurivejä ei tarvitse nakutella käsityönä paikoilleen. Enarit luettavina viivakoodeina PDF-tilausvahvistuksiin Verkkokaupassa on paljon Rexin henkilökunnalta aikaa säästävää pientä tuunausta ja EAN-viivakoodit ovat yksi niistä. Näin tuotekoodit on helppo skannata mukaan ilman erillistä numeroiden nakuttelua. Samat tuotekoodit kulkevat Rexin pakkauksissa. Ja paljon muuta… kehitys jatkuu Rexin verkkokauppa kehittyy aktiivisesti eteenpäin ja lisää pelkällä olemassaolollaan Rexin myyntiä. Uusia ominaisuuksia ja parannuskohteita kehitellään tätä kirjoittaessani. Ostoksille Rexiin Vain tuunaamalla saa tarpeisiin 100% sopivaa Nämä esitellyt verkkokaupat eivät ole mitään paketista valmiina vedettyjä, vaan niin käyttöliittymäsuunnitteluun kuin tekniseen kehitykseenkin on käytetty mittava määrä työtunteja. Pakettiratkaisulla ei saa kaikkia yksityiskohtia kuosiin, joten etenkin arvokkaammalle käsityöläistuotteelle verkkokaupan räätälöinti todella kannattaa. Kiinnostaako astetta laadukkaampi WooCommerce-verkkokauppaprojekti? Ota yhteyttä! Verkkopalveluiden kehitys digitoimisto dude oyjelmulippukauppareferenssitrextyönäytteetverkkokauppaverkkokauppa yritykselleverkkosivujen suunnitteluweb-kehityswoocommerce"
