title = "Digitoimisto Dude Oy ruumiinavaus 2016 - Yrityksen talous"
description = "Miten raha-asiat digitoimistossa menee vuonna 2016. Missä on kehitytty, missä menty takapakkia, miltä näyttää tulevaisuus."
full_description = "Kirjoittanut Kristian Hohkavaara Pahoittelut otsikosta, sehän on raflaavuudessaan ilmiselvä klikkiansa. Duden 3-vuotissynttäreiden lähestyessä on kuitenkin aika tehdä reippaalle taaperolle rehellinen läpileikkaus. Emme ole koskaan kirjoittaneet esimerkiksi raha-asioista, vaikka se lienee yrityksen kannalta yksi oleellisimmista asioista. Digitoimiston arki on todellakin muutakin kuin hevosnaamari päässä hölmöilyä. Palvelut Ehdoton ykköspalvelumme on vahvasti räätälöidyt WordPress-verkkosivut, verkkokaupat sekä näihin liittyvät hosting- ja ylläpitopalvelut. Muita palvelujamme ovat yritysilmeiden ja markkinointimateriaalien suunnittelu sekä sosiaalisen median käyttöönottoon liittyvä konsultaatio. Me emme tee juurikaan alihankintaa emmekä tee muutostöitä muiden tekemiin olemassa oleviin sivuihin. Tuotanto ja resurssit Dudessa on kaksi graafikkoa ja kaksi web-kehittäjää. Graafikoista Juha tekee 90% webbiä ja omat työni jakaantuvat 60/40 webin ja printin suhteen. Me graafikot taidamme olla myös aktiivisimmin yrityksen talouden ja asiakasyhteyksien tasalla. Web-kehittäjät Roni ja Timi ovat molemmat kovia WordPress-velhoja. Ronin vahvuus on front-end osaaminen, Timi taas sukeltaa mielummin syvemmälle back-endin saloihin integraatioita ratkoessaan. Tämä on tällä hetkellä oikein hyvä kokoonpano: talon sisällä on tarvittaessa kaksi graafikko/kehittäjä -tiimiä, jota laajennetaan tarvittaessa kahden freelancer web-kehittäjän verran. Tällä kokoonpanolla kuukausitasolla sivustoja pystytään tuottamaan 2-3 kpl hieman projektin koosta riippuen. Asiakkaat Duden asiakkaiden skaala koon ja toimialojen suhteen on iso eikä voida sanoa että meillä olisi vain yhdenlaisia asiakkaita. Monesti asiat menevät niin päin, että asiakkaitamme yhdistävä tekijä on heidän tuotteensa tai palvelunsa, josta me innostumme. Emme lähde mukaan projekteihin, joiden emme usko tuovan tähän maailmaan mitään hyvää. Olemme ehdottomasti itsekin parhaimmillamme silloin, kun asiakkaamme itse uskoo asiaansa ja kun se asia on jotain, joka tekee maailmasta paremman paikan. Jos ainoana tavoitteena näyttää olevan se, että otetaan nopeasti ihmisiltä rahat pois kelvottoman tuotteen tai palvelun avulla, niin en usko että Dudella sellaiseen projektiin juurikaan annettavaa. Myynti ja markkinointi Duden tapa tehdä markkinointia on vahvasti digitaalinen. Tärkein kanava on ehdottomasti oma sivustomme, joka kerää meille tärkeillä hakusanoilla kiitettävästi liikennettä ja syöttää sekä yhteydenottoja että tarjouspyyntöjä. Tämän lisäksi puolet Duden tyypeistä on some-aktiiveja, jolla on myöskin oma osuutensa yrityksemme näkyvyyteen. Toisinaan joku kyselee, miten Dudella toteutetaan myyntiä. Kyseessähän on tarkkaan varjeltu 3-vaiheinen prosessi, jonka aion seuraavaksi paljastaa. Se menee näin: Potentiaalinen asiakas ottaa yhteyttä, jonka jälkeen soitellaan ja sitten kahtellaan. Tämä uniikki konsepti on toiminut tähän asti vähintäänkin loistavasti. Yrityksemme kompaktista koosta johtuen se joka projektin myy, on yleensä sama henkilö joka projektia tulee johtamaan ja joka on myös vahvasti tuotannossa kiinni. Tämä ei ole mikään itsestäänselvyys isommissa yrityksissä, mutta meillä homma on toistaiseksi toiminut hienosti. En usko, että Dudella tulee koskaan olemaan pelkästään myyntiä tekevää ihmistä vaan aina joku, joka on myös tuotannossa kiinni. Talous Reilun puolen vuoden aikana sekä henkilöstö että liikevaihto on tuplaantunut, joten voidaan varmasti sanoa että Dude elää vahvan kasvun keskellä. Nämä eivät välttämättä ole kovia kasvumittareita joillekin, mutta meille tämä on iso juttu. Kasvu on tähän mennessä tullut melko spontaanisti ilman kummempia suunnitelmia, on vain tehty projektia projektin perään niin hyvin kuin mahdollista ja se on johtanut suurempaan kysyntään ja isompiin projekteihin. Duden kuukausittainen liikevaihto on kuluvan tilikauden aikana pyörinyt enimmäkseen 10 000 – 21 000 euron välissä. Noin 75% liikevaihdosta tulee verkkosivuista ja -kaupoista, 20% printtiduuneista ja loput 5% webhosting-/ylläpitosopimuksista. Verkkosivujen ja -kauppojen hintalaput ovat tämän vuoden puolella pyörineet 3 000 – 10 000 euron (+alv) välissä. Duden tilikausi ei ole kalenterivuosi, vaan toukokuusta toukokuuhun. Arvio kuluvan tilikauden liikevaihdosta on 150 000€. Kolmen yrittäjän ja yhden työntekijän osakeyhtiö voi pyöriä aika monenlaisilla kuluilla, mutta Duden tapauksessa se tarkoittaa noin 14 000 euron kuukausittaista rahareikää. Kolme yrittäjää nostaa itselleen 2000 euron kuukausipalkkaa ja työntekijän palkka on 2600 euroa. Tähän kun isketään palkkojen sivukulut niskaan, niin pikkuhiljaa neppaillaan jossain 12 000 euron kieppeillä. Tämän jälkeen tulevat perinteiset menot kuten toimiston vuokra, nettiliittymä, puhelimet, palvelimet, tilitoimisto, vakuutukset jne. Se on kuulkaa hirveä kasa rahaa! Yrityskulttuuri Saamme usein kuulla siitä, että me olemme helposti lähestyttäviä ja että meidän kanssa on helppo asioida ja tehdä töitä. Emme tee asioista vaikeampia kuin mitä ne oikeasti ovat – yritysvideotamme lainatakseni: ”Dude on maalaisjärjellä tekemistä”. Vaikka päivämme ovat gridiä ja devausta, niin silti haluamme puhua asiakkaidemme kanssa suomea ja tulla ymmärretyiksi ja vaikka kyseessä on yritysten välinen liiketoiminta, niin silti sitä tekevät keskenään ihmiset. Ja vaikka kiire on usein melko kova, niin onhan meillä silti usein ihan helvetin hauskaakin. Jokaista dudea yhdistää ainakin halu ylittää itsensä kerta toisensa jälkeen ja tietynlainen käsityöläisyys. Se ei tarkoita meidän tapauksessamme sitä että olisimme omituisesti mumisevia taiteilijoita baskerit päässä ja etsisimme inspiraatiota lootusasennossa kosmisesta ulottuvuudesta, vaan meille se tarkoittaa laadukasta tekemistä, jatkuvaa asiakasdialogia ja uuden opiskelua. Ja hölmöjä ollaan, kato vaikka ite tosta kuvasta. Kehityskohteet Me olemme ihan hyvällä tasolla siinä mitä me teemme, eli osaamme tehdä yrityksille ja organisaatioille hyvännäköisiä, toimivia ja tuottavia WordPress-verkkosivuja ja -kauppoja. Se mitä meidän seuraavaksi pitäisi kehittää on kyky mitata ja esittää tekemiemme verkkosivujen ja -kauppojen liiketaloudellista hyötyä asiakkaille. Kuinka paljon yritys X:n liikevaihto kasvoi sivustouudistuksen tai verkkokaupan lanseerauksen myötä? Eli suomeksi asiakkaan haastattelua ja niiden pohjalta kirjoitettuja asiakastarinoita. Toinen asia missä meillä on kehittymisen varaa liittyy myös omaan markkinointiin ja asiakkaille viestimiseen. Kuten aiemmin kirjoitin, Duden tapa tehdä verkkosivuja/-kauppoja on vahvasti räätälöiden. Markkinoilla on paljon palveluntarjoajia, joiden valikoimiin kustannustehokkaat valmisteemat kuuluvat, mutta se ei ole meidän tapamme tehdä sivustoja. Me emme tarjoa edes pienille asiakkaille minkäänlaista valmista kustannustehokasta sivupohjavaihtoehtoa, joten tämä alkaa rajaamaan meiltä pienemmän budjetin asiakkaita pois. Emme ole enää todellakaan markkinoiden halvin toimija, mutta uskomme että meiltä asiakas saa eniten rahalleen vastinetta. Tästä johtuen me olemme ehdottomasti parhaimmillamme projekteissa, joissa asiakkaalla on halu saada aikaan jotain erilaista ja uniikkia ja toisaalta myös halu saada laadukasta asiakaspalvelua. Tähän me pystymme vastaamaan koko tiimimme osaamisella ja tämä meidän pitäisi pystyä kirjoittamaan auki omaan viestintäämme. Kolmas kehityskohteemme on ajanhallinta. Tällaisella kasvuvauhdilla on tietenkin hintansa eikä ole mitenkään harvinaista että yksi tai useampi dude haahuilee toimiston tiloissa ns. ’pitkät päällä ja kahva edellä’. Nopean kasvun johdosta rentoudesta ollaan toisinaan jouduttu tinkimään, esimerkiksi ihan joka päivä ei ehdi hevosnaamaria vetämään päähän. Mutta hauskasta ei voi liikaa tinkiä, Jack Nicholsonin sanoin:”All work and no play makes Jack a dull boy” (elokuvasta The Shining). Eli kuinka kasvaa isoksi muttei kuitenkaan hitaaksi, tylsäksi ja lihavaksi. Yhteenveto Sorry, ei ole enää paukkuja kirjoittaa mitään – ehkä soitellaan ja kahtellaan? Kiitos kun jaksoit lukea loppuun asti ja anteeksi, jos et. Yritys ajankohtaistadigitoimisto dude oydudejyväskylämainostoimisto jyväskyläpalveluttalousverkkosivutweb-kehityswordpressyrittäminenyritys"
