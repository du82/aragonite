["https://www.dude.fi/10-ilahduttavaa-asiaa-joita-dude-on-tehnyt-nettiin"]
title = "10 ilahduttavaa asiaa, joita Dude on tehnyt nettiin - Digitoimisto Dude, Jyväskylä"
description = 'Netti on täynnä "perusvarmoja" verkkosaitteja. Meillä Dudella tykätään lisätä ilahduttavia yksityiskohtia aina kun mahdollista. Lue lisää!'
full_description = "Kirjoittanut Roni Laukkarinen “Netin rakennusmiehenä” pääsee tekemään kaikenlaista mukavaa Internetiin. Referensseistä ei välttämättä äkkiseltään löydä näitä kivoja pikku yksityiskohtia ihan suoriltaan, joten siksi nyt on tarkoitus esitellä muutamia juttuja vuosien varrelta, joista olemme erityisen ylpeitä. Nämä ilahduttavat nyanssit voivat olla isompia tai pienempiä kokonaisuuksia, joita löytää tekemiemme toteutuksien alta. Musiikkitalon tapahtumakalenteri Musiikkitalon uudistamisessa verkkopalvelun “pihvi” oli ehdottomasti tapahtumakalenteri. Tapahtumia on Musiikkitalossa paljon, joten panostimme projektissa erityisesti tapahtumien selattavuuteen, saavutettavuuteen, löydettävyyteen ja tapahtumakalenterin käytettävyyteen. Tapahtumakalenterissa on kaksi eri näkymää ja se toimii myös nätisti mobiilissa. Kalenteri on koodattu hyödyntäen React.js:ää. Musiikkitalon tapahtumia pääset selaamaan osoitteessa musiikkitalo.fi/konsertit-ja-tapahtumat. Kiinteistölehden lukukerrat ja maksumuuri Olemme tehneet Kiinteistölehden verkkopalveluun monenlaisia ominaisuuksia, mutta maksumuurista tuli harvinaisen tyylikäs. Sivusto seuraa ilmaisia lukukertoja ja maksulliset timanttiartikkelit saa auki vain maksavana lukijana. Nämä toiminnot tukevat upeasti Kiinteistömedian tarpeita ja myyntiä, mutta ovat myös asiakkaalle erittäin miellyttävä käyttää. Tästä projektista löytyy kokonainen työnäyte sivuiltamme. Voit myös selata suoraan Kiinteistölehteä ja sen ominaisuuksia osoitteessa kiinteistolehti.fi. Leirintäoppaan kartta Karavaanarille Leirintäopas on aivan killerityökalu, nimittäin sen avulla saat auki kaikki leirintään liittyvät sijainnit kartalta suoraan kulkupelistä matkan varrella. Ei enää tarvetta fyysiselle tiiliskivelle, vaan paikat löytyvät kätevästi liikkeessä, jos vain kenttää löytyy. Kartalta löytyy sadat huoltoasemat ja leirintäpaikat ympäri Suomen. Reittihaku toimii mobiilista pädeihin ja hakee sijaintisi suoraan hyödyntäen selaimen sijaintitoimintoja. Tämän toteuttamisesta on jo aikaa, mutta edelleen varsin soiva peli! Leirintäoppaan verkkopalvelusta löytyy kaikkea muutakin, mm. somepalvelu, matkapäiväkirja, arviot ja niin edelleen. Työnäytteemme alta voit lukea lisää näistä ja itse karttaa pääset testaamaan suoraan leirintaopas.fi etusivulta. Alpan mobiilikaruselli Karuselleja kannattaa käyttää hyvään tarkoitukseen, esimerkiksi verkkokaupan tuote-esittelyissä. Alpalla karuselliin on erityisesti panostettu, sillä se käyttää niin sanottua “vapaata rullausta” mobiililaitteissa, eli ei tarvitse nytkytellä mitään nuolinappeja, vaan voi swaippailla menemään ilman huolta. Tämäkin on täysin omaa tuotantoa. Tsekkaa työnäyte ja itse sivustot osoitteissa alpa.fi ja alpaknitwear.com. Ylvan vastuuttomuusländäri Somessakin huomiota niittänyt Ylvan Vastuuttomuusraportti 2023 oli erityisen ilahduttava projekti, kun saimme toteutukseen täysin vapaat kädet ja pääsimme revittelemään tyyliin, jollaista ei olla hetkeen netissä nähty. Nettisivut ovat nykyään täynnä suoria jämptejä linjoja, laatikoita ja modernia tasapaksua designia – mikä on hyvä, mutta on silti vähän ikävä sitä flash-aikakauden, 2000-kuvun nettiä jossa mikään saitti ei muistuttanut toistaan mitenkään ja grafiikoissa näkyi erilaisia värejä ja tyylejä. Ländäri löytyy osoitteesta ylva.fi/vastuuttomuusraportti. Atenan kirjahaku Atena Kustannus on julkaissut ison määrän kirjoja, jotka löytyvät sivustolta näppärästi haun ja listauksen kautta. Haku ja suodatus on rakennettu hyödyntäen vue.js:ää. Toiminnallisuudessa erityisen ilahduttavaa ovat pienet asiat, kuten kirjan sivuja kääntävä hakuindikaattori. Kirjasuodatuksessa on montaa erilaista tapaa selata kirjojen kansia. Työnäytteemme alta voi selata lisää ominaisuuksia, mutta sivustoa itsessään pääsee myös selaamaan osoitteesta atena.fi. Probotin robottihero Maailmassa ei ole koskaan liian vähän liikettä. Probotin “herossa” (eli sivuston yläosan lohkossa) pyörii yrityksen oma robottikoira moikkailemassa kävijää. Tsekkaa omin silmin osoitteessa probot.fi. Sivustolla on kivasti muuallakin pientä liikettä. Arkin näköislehti Aikakausilehti Arkkitehti, lyhyesti Ark, on tyylikäs lehti. Olemme rakentaneet lehdelle näköislehtitoiminnallisuuden, jolla lehteä pääsee ikään kuin lukemaan kuin oikeaa lehteä – mutta netissä. Lehteen oli erityisen mukavaa rakentaa lehden sivujen animointi. Näköislehtien lukeminen vaatii maksullisen tunnuksen, mutta alta näet videolta miten se toimii. Harmoonin ruokalistalta näyttävä ruokalista Ravintola Harmooni on yksi pitkäaikaisimpia asiakkaitamme, oikeastaan ihan sieltä Duden ensivuodesta 2013 saakka menossa mukana. Uusimpana uudistuksessa oli erityisen mukavaa päästä jälleen suunnittelemaan Jugend-henkistä vanhaa aikaa huokuvaa verkkosivustoa arvoiselleen ravintolalle. Erityisen hienoa sivustolla on ruokalistalta näyttävä ruokalista. Saitti on visuaalisesti harvinaisen miellyttävä, vaikka itse sanommekin. Näyttävyyden lisäksi sivuston yksityiskohdissa on panostettu erityisesti saavutettavuuteen. Hyvän ravintolan sivusto on oltava yhtä houkuttelevaa kuin itse ruoka. Tsekkaa esimerkiksi sivuston À la carte -lista. Redanredanin custom-fontti Redanredanin sivustolla on Lindan oma käsiala käytössä, eli ns. custom fontti! Tällaista fonttia ei löydy muilta. Ohhoh, 10 ilahduttavaa asiaa tuli täyteen! Lisätään bonuksena vielä yksi, eli VAAOn peukutustoiminto Peukku ylös tai alas on helppo tapa antaa palautetta. Valkeakosken ammattiopiston sivuston alalaidassa pystyt antamaan helposti peukkua sisällön hyödyllisyydestä. Tämä palaute näkyy sitten näppärästi ylläpidossa sivujen listausnäkymässä. Mitäs muuta keksitään? Olemme 11 vuoden aikana tehneet paljon muutakin ilahduttavaa nettiin. Koska tekeleitä riittää, voidaan kirjoittaa tulevaisuudessa toiset 10 ilahduttavaa asiaa. Nettiin on mahdollista tehdä vaikka mitä ja yleensä potentiaalia jää käyttämättä, jos keskitytään vain “perusvarmaan”. Jos sinulla on ideoita sivustosi ilahduttamiseksi, pistä ihmeessä viestiä meille niin katsotaan mitä voitaisiin teille räätälöidä. 😊 Verkkosivujen suunnittelu digitoimistohakumainostoimisto jyväskylämaksumuurimobiiliravintolan sivustoreact.jstapahtumattaustavideoverkkolehtiverkkosivujen ominaisuudetverkkosivujen suunnitteluverkkosivutverkkosivut yrityksellevideoweb-kehitys"
