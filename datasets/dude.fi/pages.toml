title = "Työnäyte: Ylva - Digitoimisto Dude, Jyväskylä"
description = "Ylva halusi uudistaa verkkosivustonsa, jotta se tukisi paremmin heidän strategisia tavoitteitaan ja brändiään. Yhteistyömme tuloksena syntyi tyylikäs ja käyttäjäystävällinen sivusto, joka heijastaa Ylvan sitoutumista kestävään kehitykseen ja tarjoaa vierailijoille sujuvan käyttökokemuksen."
full_description = '.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#fffaf6;--color-brand-reference-text:#3a683d;--color-brand-reference-official:3A683D}.block{--color-background-block:#fff}@media (prefers-color-scheme:light){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#fffaf6;--color-brand-reference-text:#3a683d;--color-brand-reference-official:3A683D}body[data-color-scheme="light"] .block,.block{--color-background-block:#fff}body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#325e34}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#fffaf6;--color-brand-reference-text:#3a683d;--color-brand-reference-official:3A683D}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#3a683d;--color-brand-reference-text:#fff;--color-brand-reference-official:3A683D}}@media (prefers-color-scheme:dark){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#3a683d;--color-brand-reference-text:#fff;--color-brand-reference-official:3A683D}body[data-color-scheme="light"],body[data-color-scheme="light"] .block{--color-background-block:#fff}.block,body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#325e34}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#fffaf6;--color-brand-reference-text:#3a683d;--color-brand-reference-official:3A683D}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#3a683d;--color-brand-reference-text:#fff;--color-brand-reference-official:3A683D}} Ylva Vastuulliset kiinteistöt esiin moderneilla verkkosivuilla Ylva halusi uudistaa verkkosivustonsa tukemaan strategisia tavoitteitaan entistä vahvemmin ja vahvistamaan liiketilojensa näkyvyyttä. Yhteistyön lopputuloksena syntyi tyylikäs ja käyttäjäystävällinen sivusto, joka esittelee Ylvan liiketilat selkeästi ja uskottavasti, tavoitteenaan kasvattaa yhteydenottojen ja konversioiden määrää. Siirry sivustolle Mitä teimme Verkkosivuston ilmeen ja käyttölittymän suunnittelu. Brändi-ilmettä freesattiin osana verkkosivun visuaalista suunnittelutyötä. WordPress-verkkosivujen tekninen toteutus. WordPress Multisite. WordPress-ylläpito. Tavoitteet Esitellä Ylvan omistamat tilat ja asunnot helposti löydettävästi ja selkeästi. Selkeyttää käyttäjäpolkuja, jotka johtavat laadukkaisiin liideihin. Päivittää sivuston ilme vastaamaan Ylvan brändiä, ja kehittää ilmettä modernimmaksi. Helpottaa hallintaa ja parantaa sivuston toiminnallisuuksia. Luoda sivustorakenne, joka mahdollistaa tehokkaamman markkinoinnin. Tuoda esiin vaastuullisuutta ja liiketoiminnan läpinäkyvyyttä. Lopputulos Sivustouudistuksen lopputuloksena syntyi visuaalisesti näyttävät ja selkeät sivut, jotka tukevat tehokkaasti Ylvan kiinteistöliiketoimintaa ja palvelevat vuokrattavia tiloja etsiviä asiakkaita. Liiketilat tuotiin esiin näkyvästi ja helposti navigoitavalla tavalla, jotta asiakkaat löytävät tarvitsemansa tiedot vaivattomasti. Räätälöidyn kohdehaun ansiosta vapaiden tilojen selaaminen on sujuvaa ja intuitiivista. Sivuston ulkoasua kehitettiin Ylvan brändin mukaiseksi lisäämällä uusia graafisia elementtejä ja kustomoituja ikoneita. Samalla Ylvan vastuullisuutta ja liiketoiminnan läpinäkyvyyttä tuotiin selkeästi esiin tukemaan heidän arvojaan ja vahvistamaan luottamusta. Alkuperäinen sivusto julkaistiin vuonna 2023, mutta kehitystyö jatkuu. Ylvan vuokra-asunnot lisättiin sivustolle omalla hakutoiminnollaan, mikä parantaa käyttökokemusta ja mahdollistaa asiakkaiden sujuvan navigoinnin tiloihin ja asuntoihin. Lisäksi toteutimme Ylvalle uutiskirjetyökalun, jonka avulla tilojen ja asuntojen tiedot voidaan poimia suoraan uutiskirjeisiin ilman manuaalista tietojen keräämistä. Duden WordPress-ylläpito ylva.fi pyörii Duden korkean suorituskyvyn WordPress-optimoidulla palvelimella. Dude pitää huolta palvelimesta, nimipalvelusta, WordPress-päivityksistä, WordPressistä, lisäosista ja näiden tietoturvasta. Ylläpitopakettiin kuuluu myös muunmuassa ripeä tekninen tuki ja automaattiset varmuuskopiot. Projektin kohokohdat Asuntojen suodatus Sivustolle toteutettiin helppo kohdeselaus, jonka avulla käyttäjä voi suodattaa kohteita haluamiensa parametrien perusteella. Jokaiselle asunnolle voi antaa yleistietoja, kuvia, pohjapiirustus ja muita olennaisia tietoja, joista avaintiedot ja vapaa/varattu-status näytetään selkeästi listauksessa. Asunnon sivulta on mahdollista ottaa suoraan yhteyttä lomakkeella. Uutiskirjetyökalu Rakensimme Ylvalle uutiskirjetyökalun WordPressin Multisite-ympäristöön, jonka avulla he voivat poimia sivustolla olevien tilojen ja asuntojen tiedot suoraan sivustolta uutiskirjeeseen. Tämän ansiosta tietoja ei tarvitse kerätä ja kirjoittaa manuaalisesti, mikä vähentää työmäärää ja nopeuttaa prosessia. Uutiskirjeen lähettäminen hoituu sujuvasti Mailchimp-integraation kautta. Helppo sisällönhallinta lohkoajattelun avulla Sivusto rakennettiin käyttäen joustaviin, asiakkaalle räätälöityihin Gutenberg-lohkoihin perustuvaa tapaa luoda sisältöjä. Lohkojen ansioista Ylvan henkilökunta voi luoda helposti ja nopeasti uusia sivuja tarpeen mukaan sellaisilla asetteluilla jotka sopivat tarkoitukseen, ilman että sisältöjä tarvitsee sorvata sivuston pakottamiin ”sivupohjiin” tai muihin tiukkoihin raameihin. Lohkoista voi kasata kokonaan uusia ländäreitä tarpeen mukaan. Katso myös nämä Rex – Verkkokauppauudistus suomalaisten urheiluvälineiden asiantuntijalle design verkkokauppa verkkosivut ylläpito Kuntokeskus Alive – Parempaa käyttäjäkokemusta ja asiakaspalvelua design verkkosivut ylläpito Gofore – Luotettavuus ja asiantuntemus yhteistyön perustana integraatio verkkosivut ylläpito Valkeakosken seudun koulutuskuntayhtymä – VAAO on pippurinen osaamisen ykköskumppani design integraatio verkkosivut ylläpito'
