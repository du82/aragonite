["https://www.dude.fi/dude-2020-kahdeksan-vuotta-kasvua"]
title = "Digitoimisto Dude Oy 2020 - kahdeksan vuotta kasvua"
description = "Digitoimisto Dude Oy & talous: Katso uusimmat luvut! Toimarin kooste tilikaudesta summaa vuoden. Jos et muuta lue, niin lue edes tämä."
full_description = "Kirjoittanut Kristian Hohkavaara Tämä artikkeli jatkaa jo perinteeksi muodostunutta artikkelisarjaa, jossa Duden tilikauden tapahtumia käydään retrospektiivisti läpi. Edelliset artikkelit ovat mediassakin ansioituneet Digitoimisto Dude – läpileikkaus 2019, Duden talousvartti – tästä alkaa uusi startti, Duden talouskatsaus 2018, Duden pieni talouskatsaus ja jo klassikon asemaan ehtinyt, Nobelin kirjallisuuspalkinnon arvoinen Digitoimisto Dude: ruumiinavaus 2016. “Ja täällä talouden erikoistoimittaja Hohkavaara raportoi suorana osoitteesta Kauppakatu 14, Jyväskylä. On taas se aika vuodesta kun jyvät erotellaan akanoista ja tarkastelun alla on tälläkin kertaa digitoimisto Duden talous. Ja nyt kaivetaan niitä lukuja, onko niitä lukuja, eli siis missä ne luvut on? Ja tuoltahan tuleekin joku, saattaa olla itse saluunan toimitusjohtaja kyseessä tai vähintäänkin joku yrittäjistä koska näyttää niin nuutuneelta ja ryhtikin on mitä on. Hei sinä siellä, onko niitä lukuja, annapa nyt se kirjekuori niin saadaan luvut pöytään ja pääsee kiireisimmät kissavideoiden pariin.” Lähde: asiakastieto.fi Tilikausi lyhyesti Tilikausi aloitettiin 1.6.2020 koronan merkeissä. Pahimmat sulut oli saatu kesäkuussa raivattua ensimmäisen aallon hiivuttua ja porukka oli täysin valmis tanssimaan kedolla kumbayaa ilman maskeja, mutta liike-elämässä epävarmuus leijui kaiken yllä. Yllättäen kauppaa alkoi kesäkuussa tulla oikein ropinalla, josta sitten leivottiinkin käytännössä koko loppuvuoden tuotantokalenteri täyteen. Ylipäätään kysyntää onkin leimannut koko tilikauden ajan tietty arvaamattomuus; saattaa olla useita viikkoja todella hiljaista ja sitten yhtenä viikkona tehdään puolen vuoden kaupat. Eivätkä nämä aallot noudata normaalia kausivaihtelua, kuten eivät myöskään mukaile kulloinkin voimassa olevia koronarajoituksia. Mekanismi on tuntematon muuttuja, kenties uusi normaali. Tilikauteen on mahtunut jälleen monia hienoja projekteja kuten Koulutuskuntayhtymä Tavastia, Berner Ammattinurmikot, Eepos, Workpower, Tahto, Suomen Kustannusyhdistys, Harmooni, Caravan-lehti, Akva Filter jne. Tammikuussa 2021 Dudella aloitti kautta aikain ensimmäisenä harjoittelijana Tuomas. Mies näytti välittömästi kaapin paikan ja lunasti näytöt tilikauden jälkeen kesäkuussa, jolloin allekirjoitimme työsopimuksen. Tuomas on täten ehta dude. Tilikaudella tapahtui paljon hyvää kehitystä myös tuotannossa. Suunnittelijat yhtenäistivät työkalut ja -tavat, yhteistyö suunnittelijoiden ja kehittäjien välillä on kehittynyt huimasti, projektityökalu Favro ottaa asiakkaan aivan eri lailla projektiin mukaan kuin aiemmat tavat toimia sekä asiakaspalvelu, jossa on sekä halua että kykyä venyä huippusuorituksiin. Ylipäätään koko palveluprosessi asiakkaan suuntaan on nyt huomattavasti osallistavampi kuin aiempina vuosina. Myynnin ja markkinoinnin murros Myynnissä ja markkinoinnissa toteutimme vuosia melko toimivaa mallia, joka perustui siihen että bloggasimme ja teimme asiakasreferenssejä säännöllisesti, minkä Google palkitsi avokätisesti nostamalla sivustomme ylös monellakin eri hakusanalla. Tarjouspyyntöjä ropisi ja me teimme tarjoukset, joista tarvittava prosentti meni aina läpi. Toinen tie asiakkaiden sydämiin oli vanhojen asiakkaiden suositukset. Myynti oli käytännössä tarjousten kirjoittelua ja hommahan tuntui toimivan. Jossain vuoden 2020 aikana huomasimme pelin muuttuneen etenkin Googlen osalta. Emme sijoittuneet enää entiseen malliin hakutuloksissa, koska kilpailijat tekivät paljon enemmän töitä optimoidakseen näkyvyyttä. Erityisen hienosti siinä pelissä pärjäävät kilpailijat, joilla on hakukoneoptimointi ensisijaisena asiakkaille tarjottavana palveluna ja verkkosivut vain palvelu muiden joukossa. Tämä on täysin ymmärrettävää, Google ei nosta hakutulosten kärkeen yrityksiä jotka tekevät parhaita verkkosivuja vaan yrityksiä, jotka tekevät Googlen mielestä parasta verkkosivujen tekemiseen liittyvää sisältöä.Teimme aiemmin verkkosivuja 4 – 15 000€+alv välillä. Tämän kokoluokan tarjouspyyntöjä on hyvin mahdollista saada Googlen kautta pilvin pimein, kuten me saimmekin aikamme. Se ei ollut kuitenkaan enää se projektikoko jossa olimme parhaimmillamme, johon tiimin osaaminen, kokemus ja näkemys soveltuu. Uusi liiga on viimeisen vuoden aikana ollut enimmäkseen 15 – 40 000€+alv. Nämä asiakkuudet tulevat erittäin harvoin Googlen kautta luoksemme. Avaan hieman tarkemmin, miten asiakaskohderyhmämme on muuttunut. Vanha asiakaskohderyhmä (jonka kanssa teimme pitkään töitä)Alle 15 000 euron projekteihin haetaan pääsääntöisesti tekijöitä Googlesta, joko mainoksista tai orgaanisista osumista. Tärkeimmät valintakriteerit ovat hinta, toimitusaika ja mahdollisimman nopea aloitus. Päätöksiä voidaan tehdä nopeasti, usein päivissä tai muutamassa viikossa. Usein koko projekti kilpailutuksesta julkaisuun menee 3 kuukauden sisään. Projektiin lähdetään usein sillä periaatteella, että tehdään kerralla hyvä niin ei tarvitse sitten vuosiin tehdä mitään asian eteen. Verkkosivustoon suhtaudutaan enemmän tuotteena kuin palveluprosessina, mikä luonnollisesti johtaa ihmetykseen miten toimijoilla voi olla erilaiset hinnat. Nykyinen asiakaskohderyhmä (jota tavoittelemme)Verkkosivuston/-palvelun/-kaupan uudistus on 15 – 60 000€+alv projekti. Usein erilaiset verkostot, suositukset, ammattisivustot ja some-alustojen keskusteluryhmät ovat niitä paikkoja, joista haetaan apua luotettavien toimijoiden löytämiseksi. Tärkeimmät valintakriteerit ovat referenssit, suositukset, projektiin osallistuva tiimi, kokemus & näkemys sekä jatkuvuus (käytännössä luotto siihen, että toimittaja ei ole häviämässä maailmankartalta lähivuosina ja myös että toimittaja tarjoaa kattavan asiakas-, ylläpito- ja jatkokehityspalvelun). Hankinnan alkuvaiheessa voidaan käyttää konsulttia projektin määrittelyyn. Tarjouskilpaan osallistuvien toimijoiden valintaan käytetään huomattavan paljon enemmän aikaa ja vaivaa ja toimijoita halutaan usein tavata 1-3 kertaa ennen valintapäätöstä. Pelkästään tutustuminen, kilpailutus ja sopimusvaihe voi kestää kaikkea 1-12 kuukauden väliltä ja projekti 3-6 kuukautta. Projektiin lähdetään usein sillä periaatteella, että aktiivinen jatkokehitys on menestyvän verkkopalvelun edellytys. Meillä kesti jonkin aikaa tajuta kohderyhmien valtava ero myös tavoitettavuuden osalta. Jos Google ei ole enää meille se ykkösjuttu, niin mikä on? Miten markkinoimme Dudea ryhmälle, joka ei etsi toimijoita Googlea rämppäämällä vaan kyselee suosituksia Linkedinin verkostoissa ja yksityisissä kahvipöydissä? Selvää oli ainoastaan, että tie uuden kohderyhmän tietoisuuteen ei ole nopea eikä lyhyt. Se ei myöskään voi enää perustua pelkästään tarjouspyyntöihin vastaamiseen, vaan pitkäjänteisempään ja jopa henkilökohtaisempaan verkostoitumiseen ja myyntityöhön. Tämä lienee juuri se osa-alue, jossa meillä on tällä hetkellä eniten tekemistä. Mutta se työ on onneksi aloitettu. Mihin matka? Liikevaihtomme on kasvanut 8 vuotta putkeen, mikä on upea juttu. Kokonaisuutena jokainen tässä tiimissä voi olla tyytyväinen ja ylpeä, että olemme kulkeneet tähän pisteeseen. Vain puolet yrityksistä ylittää 5 vuoden rajapyykin. 8 vuotta on jo temppu, etenkin ottaen huomioon että tarjontamme ei ole muuttunut mitenkään oleellisesti. Vuonna 2013 kaikki lähti WordPress-verkkosivuista ja ne ovat edelleenkin kaiken keskiössä. Meille on kuitenkin kertynyt sekä osaamista että näkemystä, jotka voisivat laajentaa tarjontaamme. Tulevaisuuden palvelutarjonnan tuotteistuksia voisi olla mm. saavutettavuusauditointi. Totuus on kuitenkin se, että vain harva voi jatkaa loputtomiin menestyksekkäästi täysin samalla konseptilla. Paitsi tietysti Kiss, Coca Cola ja Simpsonit. Onko Dude nyt tai tulevaisuudessa Suomen paras WordPress-digitoimisto? Lyhyt vastaus on, että joillekin on ja joillekin ei. Sama koskee tarkalleen ottaen kaikkia muitakin digitoimistoja. Ensin pitää määritellä parhaan kriteerit. Onko se isoin työntekijöiden lukumäärällä tai liikevaihdolla mitattuna? Vai kenties yritys, joka kasvaa nopeiten tai tekee eniten projekteja? Vai yritys, jolla on tyytyväisimmät asiakkaat? Tai työntekijät?Kun mietimme omaa kasvuamme, mietimme toki näitäkin asioita. Meillä on eräs mittari, mikä meitä kiinnostaa: haluaisimme olla Suomen halutuin WordPress-kumppani. Toimisto, joka hoitaa jokaisen projektin, jatkokehityksen, ylläpidon ja asiakaspalvelun niin hyvin kuin vain mahdollista ja jonka asiakkaat ovat niin tyytyväisiä, että suosittelijoita riittää. Olemme tällä tiellä, mutta kovin työ on kasvaessa pysyä tällaisena. Alkuperäinen kysymys on kuitenkin ainoastaan taidokas klikkiotsikko, yksi ei voi olla missään tapauksessa paras kaikille. Toisaalta jos joku googlaa Suomen parasta digitoimistoa, tämä blogaus saattaa esiintyä osumissa. Tähän joku jämäkkä lopetus Aloitus on tärkeä, mutta myös lopetuksen pitää olla mielenkiintoinen ja kaiken luetun oivaltavasti kiteyttävä, tai muuten lukija poistuu pettyneenä. Taistelen nämä rivit. Nyt olen jo voiton puolella ja sinä luet edelleen, et ole vielä kissavideon kimpussa vaikka hitto vie, onhan ne ihan mahtavia. Mitenkähän tämän kiteyttäisi. Vaikka niin, että… Olen Weetabix-mies. Olen aika yksin tämän piirteeni kanssa. Mutta kyllä niitä joku muukin ostaa, ei niitä pelkästään minua varten kaupan hyllyllä pidettäisi. Yritys digitoimistodigitoimisto dude oykuulumisetmainostoimisto jyväskylätalousverkkosivutweb-kehitysyrittäjyysyrittäminenyritys"
