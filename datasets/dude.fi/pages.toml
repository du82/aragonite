full_description = "Työpaikat Etsitkö paikkaa, jossa voit olla oma itsesi? Siirry työpaikkalistaukseen: Avoimia työpaikkoja Avoimet työpaikat Oletko sinä seuraava dude? Tsekkaa avoimet paikkamme: Avoin hakemus Jyväskylä ja etänä Dude työpaikkana Dudella työskennellään rennosti, mutta tosissaan. Pääasia on, että aamulla ei potuta lähteä töihin. Lue lisää työntekijän handbookista Toimintaamme ohjaavat arvot ovat läpinäkyvyys, laatu, vastuullisuus, rohkeus, kehitys ja välittäminen. Lue lisää Dudesta yrityksenä Olemme aidosti avoimia osallistumalla avoimen lähdekoodin projekteihin ja WordPress-yhteisön toimintaan. Lue lisää yhteisöstä ja koodista"
