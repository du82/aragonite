title = "Työnäyte: Sofioksanen.fi - Digitoimisto Dude, Jyväskylä"
description = "Oksidian päätuote on Eepos-oppilaitoshallinta jota käyttää yli 100 suomalaista taiteen oppilaitosta. Eepos toimii lisäksi kansainvälisesti."
full_description = '.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#fdedea;--color-brand-reference-text:#251234;--color-brand-reference-official:#251234}.block{--color-background-block:#fff}@media (prefers-color-scheme:light){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#fdedea;--color-brand-reference-text:#251234;--color-brand-reference-official:#251234}body[data-color-scheme="light"] .block,.block{--color-background-block:#fff}body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#1c1e26}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#fdedea;--color-brand-reference-text:#251234;--color-brand-reference-official:#251234}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#32144d;--color-brand-reference-text:#d43b57;--color-brand-reference-official:#251234}}@media (prefers-color-scheme:dark){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#32144d;--color-brand-reference-text:#d43b57;--color-brand-reference-official:#251234}body[data-color-scheme="light"],body[data-color-scheme="light"] .block{--color-background-block:#fff}.block,body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#1c1e26}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#fdedea;--color-brand-reference-text:#251234;--color-brand-reference-official:#251234}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#32144d;--color-brand-reference-text:#d43b57;--color-brand-reference-official:#251234}} Sofioksanen.fi Selkeät ja informatiiviset sivut palkitulle kirjailijalle Sofi Oksanen on Suomen menestynein ja kansainvälisesti tunnetuin nykykirjailija. Hän on saanut 20 kirjallisuuspalkintoa, muun muassa Finlandian ja Pohjoismaiden neuvoston kirjallisuuspalkinnon. Hänen teoksiaan on käännetty yli 50 kielialueelle ja myyty maailmanlaajuisesti miljoonia kappaleita. Siirry sivustolle Syntynyt 1977 Jyväskylä Palkinnot 20 Mitä teimme UX/UI suunnittelu Verkkosivut Ylläpito Lähtökohdat Sofin verkkosivut olivat auttamattoman vanhentuneet niin tekniikan kuin ulkoasunkin puolesta. Sivuja oli hankala päivittää ja ne olivat sisällön ja rakenteen puolesta sekavat. Sivustolla oli paljon monipuolista sisältöä, joka ei päässyt oikeuksiinsa monimutkaisen rakenteensa puolesta. Tavoitteet Pikimustasta sivustosta toivottiin ilmeeltään henkilöbrändiä vastaavampi ja rakenteeltaan selkeämpi, kaikin puolin parempi kokonaisuus, jossa tieto olisi keskiössä. Yhteisen keskustelun pohjalta yhdeksi tärkeimmäksi tavoitteeksi hahmottui monipuolisen tuotannon esittely ja tiedon löytyminen, sillä sivustoa käyttää moni tietoa etsivä taho, kuten kirjallisuuden alan opiskelijat. Tästä syystä panostimme mm. toimivaan hakutoiminnallisuuteen, tuotannon esittelyyn, kuvapankkiin ja yhteystietojen selkeään löytymiseen. Ilmeestä toivottiin Sofin tyylistä, väritykseltään violettia ja punaista. Mitä tehtiin Projekti alkoi perinteisesti aloitustyöpajalla, jossa käsittelimme asiakkaan tarpeet, tavoitteet ja toiveet. Toimme esiin myös omia ehdotuksiamme ja asiantuntijuuttamme. Aloitustyöpajassa erityisen hyödyllistä oli vanhan rakenteen räjäyttäminen, koska vanha käyttäjäpolku oli harmillisen sekava. Uuden sivukartan pohjalta oli selkeä lähteä uudistamaan sivuston käyttöliittymää. Pidimme suunnittelun tehokkaana ja esittelimme visuehdotuksia asiakkaalle säännöllisin väliajoin. Valmistelimme sivuston näkymistä klikkailtavan prototyypin Figma-sovellukseen, jossa asiakas pääsi testaamaan sivua jo ennenkuin mitään kehitystyötä oltiin aloitettu. Jatkuvalla avoimella keskustelulla ja läpinäkyvyydellä loimme vahvan luottamussuhteen, joka siivitti meidät projektissa aina maaliin asti, aikataulussa pysyen. Lopputulos Sofin vahva henkilöbrändi kirjailijana sai vihdoin arvoisensa, nopeasti latautuvat verkkosivut, joiden monipuolinen sisältö on helposti saatavilla. Duden kanssa homma sujuikin kuin tanssia vain, ja täysin vailla stressiä. En ollut osannut aavistaa, että kotisivujen uusiminen voisi olla myös kivaa. Sofi Oksanen, kirjailija yrityksestä Sofioksanen.fi Projektin kohokohdat Toimiva ja selkeä hakutoiminnallisuus Koska sivuston pääasiallinen funktio on mahdollisimman helppo tiedonsaanti, päätimme pistää haun heti ensimmäiseksi etusivulle saavuttaessa. Haku käyttää moottorinaan Relevanssi Premiumia, joka hakee kaikesta sivuston sisällöstä, otsikkojen lisäksi myös muusta datasta, kuten tekstistä ja avainsanoista. Haku palauttaa tuloksia kaikista sisältötyypeistä, joita ovat sivut, kirjat, haastattelut, oopperat, näytelmät, elokuvat ja esseet. Huoleton ylläpitopalvelu Sofi Oksanen luotti sivustonsa sofioksanen.fi Duden tarjoamaan kokonaisvaltaisen ylläpitopaketin hellään huomaan. Me huolehdimme sivuston tekniikan toimivuudesta, päivityksistä ja tarjoamme nopeasti reagoivan käyttötuen. Sofin sivut pyörivät vailla huolen häivää, samalla kun käyttötukemme palvelee sivustoon liittyvissä kysymyksissä ja vastaa uskomattoman nopeasti. Asiakkaan palaute Kotisivujen uusiminen on aina ennen aiheuttanut jo etukäteen ahdistusta. Olin valmistautunut siihen henkisesti, mutta Duden kanssa homma sujuikin kuin tanssia vain, ja täysin vailla stressiä. En ollut osannut aavistaa, että kotisivujen uusiminen voisi olla myös kivaa. Sofi Oksanen, kirjailija yrityksestä Sofioksanen.fi Katso myös nämä Eläkeläisten yhdistys-sivustot design multisite verkkopalvelu ylläpito Valkeakosken seudun koulutuskuntayhtymä – VAAO on pippurinen osaamisen ykköskumppani design integraatio verkkosivut ylläpito Vierityspalkki – Blogi verkkopalveluiden uudistajille ja kehittäjille design integraatio multisite verkkosivut ylläpito Ylva – Vastuulliset kiinteistöt esiin moderneilla verkkosivuilla design integraatio multisite verkkosivut ylläpito'
