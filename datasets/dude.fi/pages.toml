["https://dude.fi"]
title = "Digitoimisto Dude - Ole uskottava - Mainostoimisto Jyväskylä"
description = "Mainostoimisto Jyväskylä. Digitoimisto Dude toteuttaa uskottavat verkkosivut yritykselle. 100% laatua ja palvelua."
full_description = "Digitoimisto, joka osaa hommansa WordPress-verkkosivut yhdistävät yrityksen brändin, markkinoinnin ja myynnin. Miksi et tekisi sitä hyvin? Katso showreel Miltäs vaikutti? Puhuttelivatko työnäytteemme? Täältä voit katsoa lisää. Soittele numeroon 0400 443 221 tai lähetä sähköpostia moro@dude.fi, jos haluat uudistaa verkkosivusi tai brändi-ilmeesi. Pikselintarkkaa tekemistä yritystänne ajatellen Asiakkaitamme Katso video Otava Oppimisen palvelut – Neljä sivustoa helposti hallittavaksi kokonaisuudeksi design integraatio multisite verkkosivut ylläpito Gofore – Luotettavuus ja asiantuntemus yhteistyön perustana integraatio verkkosivut ylläpito Työ puhuu puolestaan, mutta mitä sanovat asiakkaat? Nopeaa toimintaa, vahvaa tekemistä, ketterää reagointia ja hurttia huumoria – niistä on yhteistyö Dudelaisten kanssa tehty. Tanja Uusitalo, viestintäpäällikkö yrityksestä Lounais-Hämeen koulutuskuntayhtymä Rakenteen ja ulkoasun suunnittelu oli vaikuttavaa, teknisessä toteutuksessa saimme juuri sitä, mitä toivoimmekin ja vähän ylikin. Kaikki sujui mutkattomasti. Pirjo Hauvala, apulaisrehtori yrityksestä Valkeakosken seudun koulutuskuntayhtymä Timanttisen yhteistyön tuloksena saimme upeat, brändimme mukaiset ja helposti käytettävät sivut. Dude toimittaa! Minna Haarala, markkinointi ja brändi yrityksestä Probot Selkeät ja helppokäyttöiset sivut niin ylläpitäjille kuin käyttäjille. Palautetta tullut sivuston toimivuudesta sekä visuaalisesti näyttävästä ilmeestä. Markku Lahtinen, it-asiantuntija yrityksestä Padasjoen kunta Onnistuimme yhdessä toteuttamaan projektin yhdistämällä palvelusuunnittelun sekä ketterän kehityksen. Jani Ojala, kehitysjohtaja yrityksestä Kiinteistölehti Eepoksen historiassa nettisivujen päivitys ei suoraan sanottuna ole koskaan ollut näin yksinkertaista ja miellyttävää. Tuomas Oksanen, toimitusjohtaja yrityksestä Eepos-oppilaitoshallinta Viides verkkosivuprojekti johon olen osallistunut urani aikana, ja tämä oli niistä paras. Kiitokset siitä kuuluvat osaltanne teille, hyvää duunia! 👍 Arto Nieminen, digital marketing manager yrityksestä Gofore Sivuja on helppo itse päivittää ja ne toimivat erittäin nopeasti. Vahva suositus siis muillekin Duden palveluita harkitseville! Juha Sillanpää, myyntijohtaja yrityksestä Miseva Nettisivu on äärettömän nopea, kävin julkaisun jälkeen kaikki meidän kilpailijat läpi ja kukaan ei pärjännyt meille nopeudessa. Matti Hirvonen, ceo & senior consultant yrityksestä Mediashake Dude toteutti meille freesit ja hyvin toimivat verkkosivut. Sivut ovat ennen kaikkea supernopeat latausnopeudeltaan! Tomi Kokkola, commercial officer yrityksestä UpCloud Tämä on ollut yksi hienoimmista projekteista tähän saakka omalla työurallani. Pekka Hyvärinen, kasvujohtaja yrityksestä Tahto Group Aikataulu piti, budjetissa pysyttiin ja yhteistyö oli ammattimaista ja luontevaa. Lämmin suosituksemme! Ilona Niinikangas, museonjohtaja yrityksestä Helinä Rautavaaran museo Dude pystyi toteuttamaan kaikki sivustouudistukselle asetetut tavoitteet, osan jopa paremmin kuin uskalsimme toivoa. Hanna Väisänen, markkinointipäällikkö yrityksestä Otava Oppimisen palvelut Dudella hommat osataan hoitaa niin, että turha jäykkyys loistaa poissaolollaan, mutta samaan aikaan kaikki on ammattimaista. Joni Rahunen, markkinointi yrityksestä Kata Safety Lopputulos on erittäin käyttäjäystävällinen, näyttää hyvältä ja täyttää ne tavoitteet, jotka uusille verkkosivuillemme alussa asetettiin. Jenni Manninen, viestintä- ja markkinointipäällikkö yrityksestä Koulutuskuntayhtymä Tavastia Sivujen ulkoasu ja tekninen toteutus ylittivät odotuksemme. Maarik Leppä, tuottaja, asiakkuudet yrityksestä Flux Productions Duden porukka onnistui luomaan meille sopivan visuaalisen ilmeen ja pienet sivulausevihjeetkin oli osattu ottaa huomioon. Saila Innanen, myyntipäällikkö yrityksestä Berner ammattinurmikot Dude on suhtautunut asiakkaan lukuisiin toiveisiin ja tarpeisiin kiitettävällä joustavuudella ja järjestelmällisyydellä. Pauli Salokangas, päätoimittaja yrityksestä Caravan-lehti Duden tiimin kanssa kommunikointi oli helppoa ja suoraa, mikä oli meille erityisen tärkeää. Pystyimmekin toteuttamaan projektin huomattavan ketterästi, ennakoiden myös tulevaa. Mika Savela, editor-in-chief yrityksestä Arkkitehti-lehti Rakenteen ja ulkoasun suunnittelu oli ensiluokkaista, teknisessä toteutuksessa saimme enemmän kuin olimme uskaltaneet unelmoida. Hanna-Leena Soisalo, tiedotus- ja markkinointivastaava yrityksestä Atena Dudelaisten kanssa on helppo tehdä yhteistyötä ja projekti sujui todella mallikkaasti alusta loppuun saakka. Tommi Karvinen, head of seo & cro yrityksestä Tulos Uusi saittimme on täynnä näppäriä, selkeitä ja hyvin skaalautuvia ratkaisuja. Letkeässä ja sujuvassa yhteistyössä sivuston rakentaminen oli ilo antaa Duden käsiin. Virpi Blom, web & cms expert, partner yrityksestä North Patrol Yhteistyö sujui mukavasti ja rennosti, ja aikataulu ja budjetti pysyivät hyvin. Sanna-Maaria Tornivaara, viestintäpäällikkö yrityksestä Suomen Kustannusyhdistys Dude ei tyydy vain toteuttamaan asiakkaan toiveita vaan haastaa tätä pohtimaan parhaita ratkaisuja ja tuo toisaalta pöytään myös omia ideoitaan. Pauli Salokangas, editor-in-chief yrityksestä Leirintäopas Rento, mutta asiallinen ja asiantunteva ote sekä työn jälki on vakuuttanut alusta asti. Nopea reagointi ja apu asiassa kuin asiassa ovat myös ehdottomia plussia. Pasi Kokkinen, markkinointi yrityksestä Black Bruin Duden kanssa homma sujuikin kuin tanssia vain, ja täysin vailla stressiä. En ollut osannut aavistaa, että kotisivujen uusiminen voisi olla myös kivaa. Sofi Oksanen, kirjailija yrityksestä Sofioksanen.fi Valitsimme Duden, koska heillä oli selkeästi ymmärrystä modernien ja monipuolisten nettisivujen suunnittelusta. Jaakko Kinnunen, päätoimittaja yrityksestä Jylkkäri Hommat hoidetaan rennolla, mutta ammattimaisella ja jämäkällä otteella. Lilli Mustajärvi, partner and marketing manager yrityksestä CRM-Service Nyt on Redanredan Oy:n sivut kuosissa. Hyvässä, nätissä ja modernissa kuosissa. Linda Saukko-Rauta, yrittäjä yrityksestä Redanredan Kunpa muutkin verkkopalveluihin liittyvät toiminnot saataisiin yhtä jouhevaksi ja selkeäksi kun Duden tyyppien touhut! Riikka Ruunaniemi, markkinointipäällikkö yrityksestä Varjolan tila Omien kiireidemme keskellä Dude ohjasi ja kannusti avaamaan näkemyksiämme vanhasta perinteisestä pois ja olemme erittäin tyytyväisiä uusiin verkkosivuihimme. Katri Paakkari, hotellinjohtaja yrityksestä Hotelli Alba Duden kanssa yhteistyömme on sujunut aina joustavasti. Kun verkkosivustoa suunniteltiin, Dude huomioi ja toteutti visiomme täydellisesti. Sanna Virtanen, markkinointistrategi, tekijä ja kouluttaja yrityksestä Flumenia Avun on saanut heti, jos ongelmia on ilmennyt nettisivujen päivittämisessä tai verkkokauppaan liittyen. Virpi Hyvärinen, yrittäjä yrityksestä Paahtimo Papu Erityiskiitos siitä, että sivun päivittäminen on tehty idioottivarmaksi ja kaikki on tarkasti merkattu, että tiedän mikä teksti tai kuvan vaihtaminen vaikuttaa mihinkin. Emmi Virtanen, yrittäjä yrityksestä By Emmi Lisää työnäytteitä Sofioksanen.fi – Selkeät ja informatiiviset sivut palkitulle kirjailijalle design verkkosivut ylläpito Kiinteistölehti – Verkkolehti tulevaisuuden tarpeisiin design integraatio verkkolehti ylläpito Ylva – Vastuulliset kiinteistöt esiin moderneilla verkkosivuilla design integraatio multisite verkkosivut ylläpito Rex – Verkkokauppauudistus suomalaisten urheiluvälineiden asiantuntijalle design verkkokauppa verkkosivut ylläpito Jutellaanko? Ota rohkeasti yhteyttä! Uskomme että voimme tavalla tai toisella auttaa sinua projektisi alkuvaiheessa. Vastaamme sinulle viimeistään seuraavana arkipäivänä. Pistä viestiä Tuhat muuta toimijaa, miksi valita Dude? Palveluasenne Paljon kiitosta saanut asiakaspalvelumme on pelastajana paikalla, kun tarvitset apua. Emme käytä automaattivastaus-robottia tukisähköposteissamme, eikä meiltä tarvitse odottaa päivätolkulla vastausta viestiisi. Toimiva asiakaspalvelumme palvelee ripeästi, nopeimmillaan jo tuntien sisällä. Lupaukset pidetään Verkkosivuston hankinnassa on mitä suurimmassa määrin kyse luottamuksesta. Toimittaja tekee mitä on sovittu, toimittaa silloin kun on sovittu ja laskuttaa summan joka sovittu. Tämä on meille kunnia-asia, haluamme nukkua yömme rauhassa. Läpinäkyvyys Kun puhumme läpinäkyvyydestä, se ei ole pelkkää lätinää. Olemme oikeasti avoin niin yrityksen toimintamallien kuin koodinkin puolesta. GitHubista löytyy läjäpäin avointa vapaasti käytettävää koodia ja olemme avanneet liiketoiminnan numerot palkkoja myöten blogissamme. Firman digitaalista ohjekirjaa on myös julkaistu 100% julkisena alusta asti osoitteessa handbook.dude.fi. Kehittyminen Koko tiimi seuraa aktiivisesti oman alansa työkalujen ja toimintaympäristön kehitystä. Kehitämme ja jaamme myös omia työkalujamme GitHubissa. Vuosittain matkustamme maailmalle oppimaan WordPressistä WordCamp Europe-tapahtuman merkeissä. Tykkäämme pysyä kehityksen kärjessä, joten emme rajoita työntekijöiden ylimääräiseen kehitykseen tai opetteluun käytettäviä tunteja mitenkään. Rasvattu projektinhallinta Olemme miettineet projektin läpiviennin tarkoin. Räätälöimme teitä varten aloitustyöpajan, jaamme projektin selkeisiin vaiheisiin, kutsumme teidät läpinäkyvään projektityökaluumme ja nimeämme teille jämäkän projektipäällikön. Näiden avulla takaamme onnistuneen projektin. WordPress-edelläkävijä Olemme keskittyneet vuodesta 2013 pelkästään WordPress-verkkopalvelujen toteutuksiin ja olleet mukana kehittämässä itse WordPressiä, sen lisäosia ja yhteisöä. Osallistumme aktiviisesti myös WordPress-yhteisön tapahtumien järjestämiseen. Tunnemme hyvin WordPressin sielunelämän ja osaamme hyödyntää sen koko potentiaalin. Ole mitä olet Dudella arvostetaan erilaisia persoonia ja meillä saa olla juuri sellainen kuin on. Töitä tehdään rennosti, mutta tosissaan. Tutustu Dudeen Luethan ainakin nämä Mitä yhteistä on verkkosivuilla ja sängyllä? Verkkosivut on investointi, joka maksaa itsensä takaisin Verkkosivujen ostaminen Mietityttääkö nettisivut ja niiden hinta? Kokeile kokeellista hintalaskuriamme Verkkosivujen ostaminen Näin uudistettiin Vierityspalkki.fi WordPress-kehitys Viisi saavutettavuutta rampauttavaa tekijää verkkosivuilla Saavutettavuus Siirry blogiin"
