["https://www.dude.fi/miksi-ei-elementoria-wordpressiin"]
title = "10 syytä välttää Elementor WordPress-lisäosaa"
description = "Paljon parjattu Elementor on parjattu syystäkin. Jätä suunnittelu suunnittelijalle ja vältä Elementoria kuin ruttoa. Lue 10 syytä miksi."
full_description = "Kirjoittanut Roni Laukkarinen Elementor on massiviinen WordPress-lisäosa, jonka avulla WordPressin sisään saa ikäänkuin eräänlaisen “kotisivukoneen”. Tällaisia lisäosia sanotaan pagebuildereiksi, eli “sivunrakentimiksi”. Olemme tuoneet monta kertaa esille, että emme tykkää tämäntyyppisestä lähestymistavasta ja sanommekin ei Elementorille, kuten muillekin pagebuilder-lisäosille. Mutta miksi Elementoria ei kannata käyttää? Listaan nyt 10 hyvää syytä miksi ei. Lopussa vielä muutama “syy”, jolloin sitä kannattaa käyttää. 1. WordPress ei ole suunnittelutyökalu Elementor on tarkoitettu siihen, että voit rakentaa kokonaisia verkkosivuja ja laskeutumissivuja itse, siis suunnitella ne fontteja, värejä ja muotoja myöten itse. Jos tämä on tarkoituksena, se on tietenkin varmaan ihan riittävä työkalu. Mutta jos haluat keskittyä lähinnä sisällön, eli kuvien ja tekstien päivittelyyn, menee Elementorilla helposti metsään, sillä muotoiluvaihtoehdot ovat vain tiellä. Ja ne ovat siihen tarkoitukseen myös yllättävän sekavia. Jos haluat suunnitella rakentaa verkkosivusi kokonaan itse ilman teknistä osaamista, miksi tehdä tämä hankalasti WordPressillä? Käyttäisit vaikkapa Squarespacea tai HubSpot CMS:ää, jotka on vähän niin kuin suunniteltu tähän tarkoitukseen. Se, että tilaat kalliit verkkosivut digitoimistolta, mutta käytät Elementoria on vähän sama kuin tilaisit mittatilausvaatteen räätäliltä, mutta kotona ottaisit ompelukoneen ja pistäisi asusteen aivan uusiksi, koska nyt vain tuntuu siltä. 2. Elementor jyrää WordPressin perustoiminnallisuutta WordPressissä on jo Gutenberg-lohkoeditori (täällä voit testata vapaasti). Se on aivan hyvä ja osaavan digitoimiston räätälöinnillä vielä parempi, sinun brändiisi istuva. Elementor korvaa koko roskan härskisti omalla härpäkkeellään. Menetät siis WordPressin arvokkaita ominaisuuksia käyttämällä Elementoria, koska se ei toimi yksiin esimerkiksi Gutenbergin kanssa. Kun Elementorin ensimmäistä kertaa aktivoi, se näyttää tältä (syyskuu 2023). Pyytää vielä jonkin erillisen tunnuksen luontia? Aivan kuin koko sisällönhallintajärjestelmä olisi vaihtunut toiseen. Päälleliimatut, erilliset ominaisuudet hämmentävät. 3. Elementorissa on yhteensopivuusongelmia WordPressin kanssa Siitä lähtien kun ensimmäinen Elementor-versio julkaistiin, siinä on ollut epäyhteensopivuuksia WordPressin ja muiden lisäosien kanssa. Muokkausnäkymä saattaa hajoilla ja sivuston puolella asiat temppuilla. Jos päivitysversiossa on ongelma, lisäosaa ei pysty päivittämään. Tällöin se on alttiina tietoturvaongelmille. 4. Huono tietoturva Pelkästään vuoden 2023 puolella Elementorista on löytynyt neljä haavoittuvuutta. Pahimmat Elementor-haavoittuuvudet ovat päästäneet kenen tahansa kirjautumaan sivustolle ja altistaneet sivuston hakkeroinnille. Ei kovin kiva, jos vaikkapa yrityksesi saitilla aletaankin louhimaan kryptoja sinun siitä mitään tietämättä. 5. Liika valinnanvara lisää epäjohdonmukaisuutta ja pilaa brändiä Oletuksena Elementor sallii liikaa muotoiluja. Sillä on siis hyvin hankala tehdä juuri brändisi näköistä tyyliä “lennosta”. On huono juttu, että fontit ja värit ovat epäjohdonmukaisia ja pahimmillaan epäsaavutettavia. Suunnittelu kannattaa jättää suunnittelijalle, koodi koodaajalle ja itse voit keskittyä oleelliseen, eli liiketoimintasi kannalta tärkeän sisällön tuottamiseen. 6. Elementorilla on helppo rikkoa sivusto Koska Elementorin lohkot eivät ole usein kiinteitä, sinua varten suunniteltuja lohkoja, sivusto on helppo räjäyttää. Eli jos poistat sisältöä, sitä on vaikea saada juuri sellaiseksi takaisin, ellet muista täsmälleen kuinka alue oli tyylitelty. 7. Elementor hidastaa sivustoa Elementor on äärimmäisen raskas WordPress-lisäosa, joka hidastaa sivuston lataamista ja näin ollen heikentää myös hakukonenäkyvyyttä ja käytettävyyttä. Isot lisäosat sisältävät usein bloattia, eli liian monimutkaisesti ja laajasti koodattuja juttuja ja teknistä velkaa. Jokainen turha rivi koodia hidastaa lisäosaa ja sivustoa entisestään. 8. Elementor on hankala työkalu käyttäjälle, kehittäjälle ja ylläpitäjälle Elementoria on hankala käyttää, sillä se ei noudata WordPressin muotokieltä. Se sisältää teemoja, widgettejä, ties mitä kikkareita, jotka eivät ole ollenkaan minkään kanssa linjassa. Tällaisella pitäisi lähteä jotain tekemään? Jos tarvitset ylläpitoa sivustollesi, joka on kehitetty Elementorilla, on uusien ominaisuuksien rakentaminen Elementorin päälle hankalaa, sillä Elementor on suunniteltu “valmispaketiksi”, johon ei tarvitse kehittää juuri lisää. Siksi Elementor on monelle kehittäjälle ja ylläpitäjälle punainen vaate, sillä sitä on vaikea räätälöidä juuri teidän tarpeisiin, sen kanssa joutuu käyttämään hirveästi aikaa muotoiluasioihin, joiden pitäisi olla yksinkertaisia. 9. Ei oletuksena sisällä kaikkea tarvittavaa ja syö aikaasi Elementor on kolmannen osapuolen iso lisäosa, joka myy itse itseään. Ilmaisversiossa ei ole kaikkia ominaisuuksia ja Elementorin Pro-lisenssi maksaa 59 euroa vuodessa. Vaikka lisäosa on edullinen ja sillä saa asioita aikaan, se syö kallisarvoista aikaasi. Sisällön päivittäminen pitäisi olla helppoa ja mutkatonta. Elementorilla se ei sitä ole. 10. On paljon parempia ja kestävämpiä vaihtoehtoja WordPress-sivut kannattaa räätälöityttää digitoimistolla, joka suunnittelee juuri teille mietityt sisältölohkot, joilla voi keskittyä tyylikkään sisällön esittämiseen varsinaisen näpertelyn ja suunnittelun sijaan. On paljon kivempaa, kun on palikat valmiina, kuin että pitää itse suunnitella ne palikat. Milloin käyttää Elementoria? Jos jokin näistä ehdoista täyttyvät, käytä Elementoria: Et halua satsata verkkosivuihin Haluat välttämättä viritellä ja tuhlata aikaasi juuri Elementoriin Tiedät mikä on Elementor, osaat käyttää sitä ja tykkäät siitä Olet suunnittelija, etkä halua maksaa verkkosivuista tai tilata verkkosivujen suunnittelua muualta ja jostain syystä haluat vääntää leiskasi Elementorilla nettiin Kaikissa muissa tapauksissa: Sano ei Elementorille. Jos hyvät verkkosivut kiinnostaa ilman turhia kikkareita, ota ihmeessä yhteyttä meihin! WordPress-kehitys elementorsivuston latausnopeusverkkosivujen suunnitteluverkkosivutweb-kehityswordpresswordpress pagebuilder"
