["https://www.dude.fi/wordpress-ei-takaa-toimittajaloukuttomuutta"]
title = "WordPress ei takaa toimittajaloukuttomuutta"
description = "Ennen tehtiin paljon custom-alustojen päälle. WordPress muutti geimin, mutta poistiko se todella toimittajaloukut? Epäilemme."
full_description = "Kirjoittanut Roni Laukkarinen Sanotaan, että kun valitset maailman suosituimman sisällönhallintajärjestelmän eli WordPressin teknologiaksi, et jää toimittajaloukkuun, koska tekijöitä riittää ja avoimen lähdekoodin voima kantaa pitkälle. Eli teoriassa kun verkkopalvelunne koodaava taho lopettaa hommat, voi aina etsiä uuden tekijän ja hommat jatkuu entisellään. Tämä on kuitenkin vain osa totuutta. Toimittajaloukku on verkkopalvelusi surmanluoti Kun puhun toimittajaloukusta, tarkoitan tilannetta, jossa joko Verkkopalvelulle ei ole uutta tekijää tai osaamista Kukaan ei suostu koskemaan projektiin Verkkopalvelun ratkaisut ovat teknisesti niin huonoja tai vääriä, että se pitää räjäyttää tai palvelun ratkaisut ovat ns. EOL (End of Life) eli palvelun ohjelmistoa ei saada enää pyörimään millään paitsi jos joku keksii aikakoneen ja matkustaa ajassa taaksepäin aikaan, jolloin laitteet tukevat koodia Pahin tilanne on tietenkin silloin, kun kaikki nämä neljä ehtoa täyttyvät ja samaan aikaan verkkopalvelu ei toimi kunnolla. Silloin on hyvin vähän, jos mitään tehtävissä. Paitsi pistää isolla rahalla kaikki uusiksi. Myös WordPressin kanssa voit joutua surman suohon – jos projektin ja toimittajan asiat eivät ole kunnossa Vuonna 2003 perustettu avoimen lähdekoodin WordPress yleistyi kunnolla viimeistään 2010-luvulla, mutta muistan vielä tuolloin alalla olleen eri toimistojen omia sisällönhallintajärjestelmiä ja WordPressin kyljessä kilpaili tiiviisti alustat kuten Drupal ja Joomla, jotka pikkuhiljaa putosivat pois, kun ihmiset tajusivat että WordPress on aika paljon käyttäjäystävällisempi eikä nörteille tehty hirvitys. Itse bloggarina käytin WordPressiä jo vuonna 2005, kun huomasin että se oli huomattavasti vuonna 2002 perustettua cutenewsiä parempi ja monipuolisempi. Ei mennyt kauaa, kun WordPressillä pystyi tekemään blogeja laajempiakin juttuja, jolloin sen suosio räjähti. Dude on tehnyt sivustot vain ja ainoastaan WordPressillä syntyhetkestään, vuodesta 2013. Muistan, että alalla pyöri paljonkin alustoja jo WordPressin kasvettua suositummaksi. Emme ole Dudella koskaan tehneet muulle kuin WordPressille, mutta henkilökohtaisesti vastaan on tullut aiemmassa elämässä samoja alustoja, joita kilpailijat käyttivät, esimerkiksi: Concrete5 (nykyisin Concrete CMS), CMS Made Simple, Plone ja erityisesti bloggareiden suosiossa ollut Textpattern. Nyt kun lähdettiin muistelemaan menneitä, oheiselta statsivideolta näet aika hyvin miten WordPress on vallannut markkinat vuosien varrella. Video on suorastaan terapeuttista katseltavaa. Tekijöitä löytyy hieman vähemmän vanhoille alustoille. Luulisi, että vanhat tai custom-alustat aiheuttaisivat eniten toimittajaloukun riskiä, mutta tosiasiassa toimittajaloukku voi olla täyttä totta myös WordPressin kohdalla. Tekijöitä ja toimintamalleja on alalla jo liiankin paljon. Pelkkä WordPress tai WordPress-toimija ei siis takaa sitä, että et jäisi umpikujaan verkkopalvelusi kanssa. Vältä toimittajaloukku – tee näin verkkosivuja ostaessasi Tarkista nämä, niin vältyt pahimmalta. 1. Selvitä osaako toimisto tai tekijä tehdä WordPressillä WordPressin markkinaosuus on huikeat 63% vuonna 2024 (Lähde: Bluehost), eli sitä käytetään heittämällä eniten CMS (Content Management System)-maailmassa. Tämä tarkoittaa myös sitä, että WordPressille tehdään paljon laidasta laitaan erilaisia toteutuksia aina pikkuisista ilmaisista harrasteblogeista laajempiin järjestelmiin. Skaala on siis hintaluokaltaankin nollasta sataan tonniin. Koska WordPress-toimistoja ja -tekijöitä on paljon, on helppo liputtaa WordPressin nimeen ja vakuuttaa osaamistaan. Kaikki eivät silti osaa. Alalla näkee paljon pelkistä lisäosista kasaavia tekijöitä, jotka eivät ole eläissään koodanneet riviäkään WordPress Coding Standardien mukaista koodia. Aiheesta Mistä tietää hyvän verkkosivujen tekijän? löytyy meiltä kokonainen kirjoitus, joka kannattaa lukea. Mistä tietää hyvän WordPress-tekijän Vakuuttaako tekijä osaamisestaan – onko kokemusta, referenssejä ja näyttöä vastaavista toteutuksista Löytyykö tekijä alan listauksista, kuten Vierityspalkin Toimistot -hakemistosta ja paljonko toimistolta löytyy tähtipisteytyksiä Onko tekijän sivuilla näyttöä esimerkiksi GitHubista, koodiosaamisesta tai onko referensseihin kuvattu millaisia teknisiä ratkaisuja projektissa on tehty. Meillä löytyy myös ihan erillinen Yhteisö & koodi -sivu tätä varten. Mitä firmasta tiedetään, kuinka pitkään olemassa, ketä firmassa on töissä, löytyykö Handbook? (meillä handbook.dude.fi) WordPress on avointa lähdekoodia, onko tekijä tehnyt avointa lähdekoodia WordPressille? Meidän lisäosat ja muu löytyy avoimena osoitteesta github.com/digitoimistodude. Tiedätkö miten sisällönhallinta tulee toimimaan? Onko mukana Elementor, natiivit Gutenberg-lohkot vai ACF? Tekeekö tekijä WordPressillä vai myös muilla alustoilla? Miten iso osa referensseistä on WP-toteutuksia? Onko hinta alakanttiin (alle tonni), yläkanttiin (yli 100 000) vai alan standardien mukainen? Liian halpaa kannattaakin epäillä. Millainen maine tekijällä on? Suositellaanko tekijää/firmaa? Muista, että pelkkä Google-näkyvyys ei kerro mitään. Millaisia asiakkaita tekijällä on? 2. Selvitä millaisia ratkaisuja sivustolle on rakennettu tai ollaan rakentamassa – mielellään ennen ostopäätöstä Sen lisäksi, että tekijän osaamisesta kannattaa vakuuttua, on hyvä ottaa selvää miten kestäviä ratkaisuja toimittaja tekee. Jos WordPress on toteutettu aivan eri tavalla kuin miten sitä yleensä koodataan, kannattaa miettiä kuinka jatkokehitettävissä projekti on. Löytyykö projektille tekninen dokumentaatio, jos ei asiakkaalle jaettuna niin tiimin sisällä? Pohjautuvatko ratkaisut tunnettuihin WordPressin standardeihin, joiden lähdekoodi ja standardisointi on julkinen? Noudattaako toteutus WordPressin ydintä? Onko ohjelmointikieleksi valittu WordPressin omat, eli lähinnä PHP, CSS ja React, vai onko lähdetty sooloilemaan jollakin ihan muulla kuten Headless-toteutukset tai omituiset JavaScript-frameworkit (ensin mainittu oikein) tai custom-templating enginet kuten Twig tai Timber? Käytetäänkö toteutuksessa WordPressin omaa hierarkiaa, vai onko koko verkkosivusto sullottu esimerkiksi Single Page App (SPA) -sovelluskehitystoteutukseen (ensin mainittu oikein)? Kohdan 1 listasta 4-6, eli pohjautuvatko tekijän toteutukset avoimeen lähdekoodiin ja onko näitä julkisesti tai pyydettäessä selattavissa? Saatko sivustosi koodin ja tietokannan talteen helposti? Omistatko datasi? Onko lisäosia käytössä? Pohjautuvatko ratkaisut niihin vai onko mukana customia? Missä suhteessa? Jos sivustosi tila kiinnostaa, kannattaa tilata meiltä WordPress-sivuston tekninen auditointi (sähköpostilla voi tiedustella: roni@dude.fi). 3. Ole suoraan yhteydessä tekijöihin Kommunikointi projektin aikana on tärkeää. Käy läpi tekijän (koodarin) kanssa ratkaisuja, miten ne toimisivat ja ovatko ne tavoitteenne mukaisia. Näin vältytään kompastuskiviltä ennen projektia, sen aikana ja sen jälkeen. Toimittajatahon kanssa kannattaa myös käydä läpi ihan vaan projektin jatkokehitettävyys. Koskaan ei tiedä mitä tapahtuu ja vaikka projektiin olisikin valittu luotettava kumppani, on hyvä miettiä mitä tapahtuu jos tekijä katoaa maan päällä. Millaiset jatkosuunnitelmat teillä on? 4. Testaa, testaa, testaa Testaamista ei voi peräänkuuluttaa tarpeeksi. Tekijän on hyvä testata tekeleensä testiympäristöissä hyvissä ajoin ja säännöllisesti, mutta tämän lisäksi asiakkaankin kannattaa osallistua testaamiseen. Testaaminen järjestyy aina ja sen merkitys on sitä suurempi mitä laajempi toteutus on kyseessä. Rajapinnat olisi erityisen tärkeää testata kunnolla ja isompien toteutusten kokonaisuus olisi hyvä käydä läpi jollakin muullakin kuin vain testidatalla. Loppusanat Vaikka kirjoituksessa olikin vähän doomia & gloomia mukana, toimittajaloukkua pystyy parhaiten välttämään hyvän ja osaavan tekijän valinnalla. Dudella ruksataan kaikki boksit, jotka välttävät toimittajaloukun. Näitä tietenkin ovat vielä kertauksen vuoksi seuraavat: Toimittaja käyttää WordPressiä (aika no brainer, heh) Toimittaja tekee WordPressin käytänteillä (eli ei ole WordPressiä jollakin eilen keksityllä uudella tavalla, WP Headless tai jotain muuta älytöntä) (Lue myös: 4 tapaa tehdä WordPress-verkkosivuista supernopeat) Pitkä historia WordPressin (nimenomaan tekniikan ja koodin, ei pelkästään näppäilyn) parissa (tekijöiden osalta jopa vuodesta 2004, yrityksenä vuodesta 2013 eli 11-20 vuotta) Kannattava yritys, joka on ollut olemassa pidempään kuin pari kuukautta Toteuttaja tekee toteutuksensa räätälöidysti, eikä kasaamalla WordPresissä Elementorilla, pagebuildereilla tai pelkillä WP-lisäosilla. Toimittaja ei käytä valmisteemoja (Lue myös: Nettisivut kannattaa tilata digitoimistolta) Toimittaja tekee toteutuksensa tulevaisuutta ajatellen ja jopa tietää ja suosittelee muita tekijöitä, jotka tekevät standardinmukaista WordPressiä. WordPress-kehitys digitoimisto dude oysisällönhallintajärjestelmätstandardittoimittajaloukkuverkkopalvelun ostaminenverkkosivujen ostaminenweb-kehityswordpresswordpress-bisneswordpress-kehitys"
