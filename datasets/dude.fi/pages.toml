["https://www.dude.fi/duden-talousvartti-tasta-alkaa-uusi-startti"]
title = "Duden talousvartti - tästä alkaa uusi startti - Digitoimisto Dude Oy"
description = "Vuorossa Digitoimisto Dude Oy:n toimitusjohtajan talouskatsaus. Miten meni tilikausi 2017-2018. Katso tulos, numerot ja fiilikset."
full_description = "Kirjoittanut Kristian Hohkavaara Kun syksy saapuu sateineen, aletaan toreilla kuiskimaan. Mummot kerääntyvät yhdessä varjojen alle spekuloimaan, että miten niillä menee. Kuuluu supinaa: ”Joko retkujengi sukeltaa? Onko niin, että viisi miestä istuu pelkääjän paikalla ja ratissa on noppakuutio, onnenkeksi ja globaalin talouden arvaamattomuus?” Yksi katsoo ihmeissään muita ja kysyy: ”Mikä helevatan tute?”Taas on ajettu yksi tilikausi kokonaisvaltaista kehon ja mielen romurallia. On aika ottaa ratti käteen, katsoa peruutuspeiliin ja kääntyä hetkeksi varikolle. Tarkastaa vauriot ja selvittää sijoitus. Luvut Lähde ja grafiikka: Suomen Asiakastieto Oy Tulkinta Positiivista on paljon: vaikka liikevaihdon kasvu onkin varovaista, se on kuitenkin ihan alusta alkaen todellakin kasvanut eikä notkahduksia ole liiketoiminnan tuloksen tavoin matkaan mahtunut. Hyvää on myös omavaraisuusasteemme, joka on todella kovaa tasoa.Liiketoiminnan tulos saatiin miehekkäästi sukeltamaan 37 000 eurosta sukkana 8 000 euroon. Tämähän alkaa olla jo klassikko: kun Dude palkkaa niin Dude sukeltaa, mutta vain ottaakseen loikan kohti uutta kasvua. Edelliseen tilikauteen mahtui toki myös muutto huomattavasti mielekkäämpään toimitilaan, joten sekin huomioiden kiinteitä kustannuksia nostettiin kesken tilikauden noin 5000 eurolla kuukaudessa. Sekä rekrytointi että uusi toimitila ovat kuitenkin tärkeitä investointeja tulevaisuuteen, molemmilla nostettiin sekä tuottavuutta että viihtyvyyttä. Tulevaisuus Dude alkaa saapua yrityksenä jonkinlaiseen risteykseen, jolloin tarvitsee alkaa tehdä päätöksiä tulevaisuuden suhteen. Yrityksen liikeidea on ollut käytännössä muuttumaton aiemmat kuusi vuotta: toteuttaa vahvasti räätälöityjä WordPress verkkosivuja ja -palveluita, tarjota tehdyille toteutuksille myös Duden oma ylläpito/hosting-palvelu sekä suunnitella yritysilmeitä. Vaikka liikeidea on pysynyt muuttumattomana, niin asiakkaiden koko on kasvanut ja projektimallit kehittyneet. Kun alussa Dude teki 1000 – 3000 euron toteutuksia kertaprojekteina, niin nyt pääpaino alkaa olla 5000 – 15 000 euron projekteissa joiden kehitys myös käytännössä jatkuu pian sivuston julkaisun jälkeen. Ehdottomasti parempi toimintamalli etenkin niille asiakkaille, joilla on kovemmat kehittämisen tarpeet ja jotka haluavat ostaa nimen omaan palvelua eivätkä tuotetta.Kun tämä hyväksi havaittu perusakseli on hiottu kuudessa vuodessa melko tiukkaan iskuun, on aika alkaa miettiä seuraavaa askelta. Mitkä ovat kasvun esteet?Tunnistettuja haasteita ovat: Oman myynnin puute. Tähän ei nykyisellä kokoonpanolla ja roolituksella venytä. Reagoidaan sisääntuleviin signaaleihin melko hyvin, mutta aika, voimavarat ja osaaminen eivät riitä miettimään tai toteuttamaan proaktiivista myyntityötä.Asiakkaille tarjottavan sisällöntuotannon ja digitaalisen markkinoinnin puute. Verkkosivuston toiminnallisuus ja visuaalisuus ovat vain puolet kakusta. Näitä puuttuvia osa-alueita on ulkoistettu joko asiakkaalle itselleen tai yhteistyökumppaneille, mutta jatkossa nämäkin voisivat olla osa Duden tarjoamia palveluita. Yllä mainittuihin kohtiin liittyen: Jos koet olevasi tai tunnet jonkun joka saattaisi olla Dude-henkinen, hyvin verkostoitunut sisällöntuotannon ja digitaalisen markkinoinnin ammattilainen, niin ota yhteyttä tai vinkkaa meistä. Siinäpä pohdittavaa jo alkaneeseen tilikauteen. Vettä tulee ja rahaa menee, mutta Timo Jutilan siteeraukseen on aina hyvä lopettaa. Yritys digitoimisto dude oyliiketoimintaliikevaihtomainostoimisto jyväskylätaloustilinpäätösyrittäminenyritykset"
