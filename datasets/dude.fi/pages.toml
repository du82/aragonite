["https://www.dude.fi/toitamme/kiinteistolehti"]
title = "Työnäyte: Kiinteistölehti - Digitoimisto Dude, Jyväskylä"
description = "Uudistimme Suomen Kiinteistölehden verkkolehden moderniksi kokonaisuudeksi jota on miellyttävä lukea ja joka tukee toimituksen prosesseja."
full_description = '.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#f2f1ec;--color-brand-reference-text:#161616;--color-brand-reference-official:#161616}.block{--color-background-block:#fff}@media (prefers-color-scheme:light){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#f2f1ec;--color-brand-reference-text:#161616;--color-brand-reference-official:#161616}body[data-color-scheme="light"] .block,.block{--color-background-block:#fff}body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#080808}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#f2f1ec;--color-brand-reference-text:#161616;--color-brand-reference-official:#161616}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#161616;--color-brand-reference-text:#fff;--color-brand-reference-official:#161616}}@media (prefers-color-scheme:dark){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#161616;--color-brand-reference-text:#fff;--color-brand-reference-official:#161616}body[data-color-scheme="light"],body[data-color-scheme="light"] .block{--color-background-block:#fff}.block,body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#080808}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#f2f1ec;--color-brand-reference-text:#161616;--color-brand-reference-official:#161616}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#161616;--color-brand-reference-text:#fff;--color-brand-reference-official:#161616}} Kiinteistölehti Verkkolehti tulevaisuuden tarpeisiin Kiinteistöliiton julkaisema Suomen Kiinteistölehti välittää alan tuoreimmat uutiset, ilmiöt ja asiantuntija-artikkelit. Uudistimme verkkolehden moderniksi kokonaisuudeksi jota on miellyttävä lukea ja joka tukee toimituksen prosesseja. Siirry sivustolle Perustettu 1925 Kävijöitä 75 000 kuukaudessa Levikki 32 304 painetulla lehdellä Mitä teimme Palvelumuotoilu Verkkolehti UI/UX suunnittelu Maksumuuri SSO-kirjautuminen Sisällön siirto Jatkokehitys Ylläpito Lähtökohdat Maan johtavan taloyhtiöiden asioihin erikoistuneen median, Suomen Kiinteistölehden, sivusto oli kasvanut vuosien aikana tietomäärältään massiiviseksi paketiksi, josta oli hankala löytää kaikkea sisältöä. Myös ulkoasu oli päässyt vanhenemaan, eikä se tehnyt oikeutta artikkeleille. Uutta verkkolehteä lähdettiin toteuttamaan osana laajempaa toimituksen prosessien uudistamista, jossa otettiin käyttöön printin ja digin yhdistävä toimitusjärjestelmä. Tavoitteet Kiinteistölehdellä oli sisäisesti asetettu selkeät tavoitteet, jotka tarkennettiin yhdessä projektin aloitustyöpajassa. Houkuttelevampi ja modernimpi ulkoasu Käytettävyyden ja asiakastyytyväisyyden parantaminen Sisällöllinen uudistaminen ja selkiyttäminen Kävijämäärän sekä mediamyynnin kasvattaminen Tulevaisuuden haasteisiin vastaaminen (printti vs. digi) Mitä tehtiin Projekti aloitettiin klassiseen tapaan aloitustyöpajalla, jossa tehtiin uuden verkkolehden palvelumuotoilua. Kiinteistölehden toimituksen kanssa jäsensimme sisällöt puhtaalta pöydältä selkeäksi kokonaisuudeksi. Palvelumuotoilun alussa lähdettiin hahmottamaan uutta verkkolehteä erilaisten mallikäyttäjien kautta. Lehteä lukee niin eläkeläiset, pariskunnat, taloyhtiön aktiivit kuin alan ammattilaisetkin. Osana suunnittelua mietittiin myös, miten houkutella uutta nuorempaa lukijakuntaa lehden pariin. Tärkeänä osana palvelumuotoilua mietittiin myös erilaisia kävijäpolkuja Kiinteistöliiton jäsenistä sosiaalisen median kautta sivustolle päätyvään lukijaan. Ideoimme uuden verkkolehden maksumuurin toimintaa, kuka pääsee lukemaan mitä sisältöä milläkin tilauksella. Uutta lukijaa ohjataan hienovaraisesti käyttämään aikaa artikkeleiden parissa ja lopulta tilaamaan lukuoikeus. Suunnittelussa kiinnitettiin huomiota mainosten ja kaupallisten sisältöjen luontevuuteen osana sivustoa. Palvelumuotoilussa ja visuaalisessa suunnittelussa käytettiin paljon aikaa käytön sujuvuuden miettimiseen, läpi sivuston toistuvaan lukukokemukseen sekä monipuolisten sisältöjen korostamiseen. Lopputulos Uuden verkkolehden käyttökokemus on saanut paljon kiitosta ja sivustolla käytetty aika on kasvanut huomattavasti. Digijulkaisun sekä printtilehden lukijamäärät ovat kasvaneet tavoitellusti käsi kädessä. Verkkolehden artikkelien aiempaa tasaisempi tahti tukee kymmen kertaa vuodessa julkaistavaa paperista lehteä, korostaen Kiinteistölehden ajantasaisuutta. Myös toimituksen sisäinen työ on helpottunut, ja nykyään aikaa voidaan käyttää enemmän laadukkaan sisällön tuottamiseen teknisen painin sijaan. Projektin kohokohdat Toimituksellinen etusivu Sivuston etusivun suunnittelussa oli huomioitava, että Kiinteistölehdessä julkaistaan viikossa suuri määrä uutta sisältöä. Osaa etusivusta halutaan ohjata toimituksellisesta näkökulmasta, nostaen mielenkiintoisimpia sekä ajankohtaisia sisältöjä isommin esiin. Rakensimme etusivun, jossa uusimmat sisällöt rullaavat huomaamattomasti yhteispelissä toimituksen tekemien nostojen ohella. Etusivun dynaamisuudessa otettiin huomioon myös eri kategorioiden ja artikkelityyppien tasainen suhde, jotta tarjolla olisi kiinnostavaa sisältöä kaikille kohderyhmille. Hyvin rakennettu etusivu mahdollistaa tulevaisuudessa kävijäkohtaisesti personoidun sisällön. Integraatio toimitusjärjestelmään Kiinteistölehden verkkopalvelun uudistaminen oli osa isompaa toimitustyön uudistusta, johon kuului olennaisena osana nykyaikaisen toimitusjärjestelmän käyttöönotto. Suunnittelimme uuden sivuston tietorakenteen artikkelien osalta sellaiseksi, joka tukee sisältöjen siirtämistä sivustolle suoraan toimitusjärjestelmästä. Yhteistyössä toimitusjärjestelmäkumppanin kanssa toteutimme Kiinteistölehden toimitukselle suoraviivaisen tavan hallita kaikkea toimituksellista sisältöä printistä verkkoon samojen prosessien ja työkalujen kautta. Toimitusjärjestelmä keskustelee sivuston kanssa käyttäen WordPressin omaa REST API -rajapintaa, jota on laajennettu. Uudet artikkelit siirtyvät saumattomasti sivuston julkaisujonoon toimitusjärjestelmässä tehtyjen ajatusten mukaisesti. Maksumuuri Osa verkkosisällöistä haluttiin ainoastaan Kiinteistöliiton jäsenten sekä painetun Kiinteistölehden tilaajien saataville. Tätä varten toteutimme sivustolle maksumuurin joka mahdollistaa toimitukselle artikkelien näkyvyyden määrittämisen, näkyvyyden ajastamisen sekä maksumuurin toiminnan säätelyn artikkelin kategorian ja tilaajaprofiilin perusteella. Esimeriksi tähtiartikkeleita pääsee lukemaan trial-tunnuksella ja nettiartikkeleiden vapaata lukemista sallitaan kävijäkohtaisesti vain tietty määrä viikossa, kunnes artikkelit siirtyy maksumuurin taakse ja kävijää ohjataan tilaamaan lukuoikeus. Kirjautuneiden kävijöiden kohdalla maksumuuri tarkistaa lukuoikeuden Kiinteistömedian asiakasrekisteristä. Integraatio jäsenrekisteriin Pääsy- ja lukuoikeus tarkistetaan Kiinteistömedian asiakasrekisteristä, joka on heille räätälöity ulkopuolinen järjestelmä. Toteutimme WordPressin normaaliin kirjautumismekanismiin integraation, joka tarkistaa ensin asiakasrekisteristä saako syötetyillä tunnuksilla kirjautua sisään ja vasta sen jälkeen tarkistaa oikeuden WordPressin omasta käyttäjärekisteristä. Näin sivuston loppukäyttäjät, Kiinteistöliiton jäsenet sekä Kiinteistömedian maksavat asiakkaat, ja sivuston ylläpitäjät voivat käyttää aina samaa osoitetta kirjautumiseen. Kirjautuessa Kiinteistömedian asiakasrekisterissä olevilla tunnuksilla, kyseisen tunnuksen lukuoikeus erityyppisiin sisältöihin. SSO-kirjautuminen Kiinteistölehti on osa Kiinteistöliiton verkkopalvelukokonaisuutta, johon kuuluu useampi erillinen sivusto. Koska kaikkiin kokonaisuuden sivustoihin pääsee kirjautumaan käyttäen samoja jäsen- tai asiakastunnuksia, haluttiin käyttäjien kokemuksesta tehdä saumaton. Tätä varten suunnittelimme sekä toteutimme SSO-kirjautumisen yhdessä Kiinteistömedian asiakasrekisterin järjestelmätoimittajan kanssa. Kirjautumislinkkien ansioista asiakasrekisterissä olevat käyttäjät pääsevät siirtymään verkkopalvelusta toiseen ilman uutta kirjautumista, vaikka eivät olisi koskaan aiemmin käyneet esimerkiksi Kiinteistölehden sivustolla. Erilaiset artikkelityypit Kiinteistölehdessä julkaistaan tavallisia artikkeleita, niin kutsuttuja feature-artikkeleita, lakiartikkeleita, kumppaneiden tuottamaa sisältöä sekä sisältöä jota ei ole ollut lehdessä. Kaikille näille toteutettiin omanlaisensa näkymät tukemaan sisältöä parhaalla mahdollisella tavalla. Erityisesti pitkissä feature-artikkeleissa huolella suunniteltu visuaalinen, suuria kuvapintoja sekä lainauksia hyödyntävä, lukukokemus vie lukijan mukaan sisältöön. Sujuva sisältömigraatio Osana Kiinteistölehden verkkolehden uudistusta siirsimme kaikki vanhat artikkelit, blogikirjoitukset, kommenti sekä mediatiedostot vanhalta sivustolta uudelle. Yli kymmenen tuhatta sisältöä ja tiedostoa siirrettiin uuteen verkkopalveluun, jotta mikään vanha sisältöä ei katoaisi verkosta. Samalla huolehdimme sisältöjen osoiterakenteen säilyttämisestä samanlaisena, taataksemme vanhojen linkkien toimivuuden. Asiakkaan palaute Onnistuimme yhdessä toteuttamaan projektin yhdistämällä palvelusuunnittelun sekä ketterän kehityksen puhtaasti etänä. Projektityöskentelyssä yhteistyömme perustui avoimuuteen ja rehellisyyteen: haastoimme toisiamme, annoimme palautetta ja arvioimme toistemme ideoita niin liiketoiminnan kuin teknisen toteutuksen osalta. Onnistuneiden projektien edellytys on läpinäkyvä kommunikointi ja säännölliset tapaamiset. Jani Ojala, kehitysjohtaja yrityksestä Kiinteistölehti Katso myös nämä Ylva vastuuttomuusraportti – Suoraa puhetta vastuullisuudesta design verkkosivut ylläpito Gofore – Luotettavuus ja asiantuntemus yhteistyön perustana integraatio verkkosivut ylläpito Vierityspalkki – Blogi verkkopalveluiden uudistajille ja kehittäjille design integraatio multisite verkkosivut ylläpito Rex – Verkkokauppauudistus suomalaisten urheiluvälineiden asiantuntijalle design verkkokauppa verkkosivut ylläpito'
