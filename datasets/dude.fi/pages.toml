["https://www.dude.fi/muutoksia-kotisivuille-pienia-korjailuja"]
title = "Muutoksia kotisivuille, pieniä korjailuja, paikkailuja tai freesausta?"
description = "Jos olet hommannut nettisivut muualta ja kaipaat sivustollesi muutoksia, olet väärällä ovella. Lue miksi emme tee mitä tahansa."
full_description = "Kirjoittanut Roni Laukkarinen Koska olemme digitoimisto, joka keskittyy täysillä lähes pelkästään verkkosivujen tuottamiseen, meiltä kysytään usein “Voitteko korjata muutamia ongelmia sivuillani?”, “Tarvitsen apua sivuston X-alueen muokkaamiseen?”, “Haluaisin freesata nykyistä sivustoani brändi-ilmettä olennaisesti muuttamatta, onnistuuko?”. Yleisesti ottaen kysymys on jotakuinkin: “Pystyykö teidän kautta hankkimaan kotisivuille muutoksia, jos sivut on hankittu jostain muualta?”. Tämä voi yllättää, mutta valitettavasti vastaus on ei. Jos olet hommannut sivut muualta, Dudelta ei voi tilata yleistä tukea, korjauspalvelua, freesausta, ylläpitoa tai sivuston hostausta. Ei ole tarkoitus olla negatiivinen, vaan keskiössä on keskittyminen olennaiseen. Sille on muutama selkeä syy miksi yleinen korjauspalvelu ei kuulu palvelurepertuaariimme. Tässä kirjoituksessa avaan nämä syyt auki. Konepellin alta voi löytyä mitä tahansa – arvio työstä menee aina metsään Avasimme jo vuosia sitten kirjoituksessamme Teetä verkkosivut kerralla ja kunnolla (2017) syitä sille miksi emme lähde viemään loppuun jo alkaneita tai osittain tehtyjä projekteja. Nämä syyt ovat aika lähellä tämän kirjoituksen syitä ja asiaa on hyvin avattu otsikon “Suuri tuntematon” alla: Vaikka sivustolle saisi kaikki mahdolliset tunnarit, jo pelkkään selvittelyyn menee aikaa. Ja yrittäjälle aika on rahaa. Verkkosivut tai -palvelut ovat sen verran monimuotoisia kokonaisuuksia, että ei voida suoriltakäsin sanoa mitä sivusto sisältää. Joskus pienenkin ominaisuuden korjaaminen on jättimäinen savotta. Yleensä näissä tapauksissa koko ominaisuus on alunperinkin tehty väärin. Eräässä esimerkissä oli esimerkiksi tehty artikkelilistaus aivan eri tavalla kuin se oikeasti WordPress-teemaan kuuluisi tehdä, jolloin esimerkiksi saavutettavuussääntöjen vaatimaa sivutusta tai linkkejä ei saanut toimimaan ilman koko artikkelilistausnäkymän uudelleenkirjoittamista. Sen verran huijasin, että teemme jonkin verran korjauksia kolmannen osapuolen sivustoille silloin kun meiltä tilataan saavutettavuuteen liittyvää työtä. Esimerkiksi jos asiakkaamme saa saavutettavuusauditointiraportin tai me teemme asiakkaan sivustolle tai toiselle sivustolle saavutettavuusauditoinnin, hoidamme myös korjaustöitä. Työkalut eivät ole kunnossa Joskus toisen sivuston koodia on tehty aivan eri työkalupaketilla. Joskus työkaluja ei ole ollut ollenkaan. Kaikki eivät tee sivustoja duden tavoilla ja se on täysin ymmärrettävää. Asiat eivät välttämättä lähde ajoon testiympäristössämme ja jutut saattaa olla tehty suoraan livesivustolle ilman testaamista. Useimmiten toisen tekijän tekemä saitti joudutaan pystyttämään uudelleen oman testiympäristömme päälle, jotta työstä saadaan tehtyä suoraviivaisempaa oikeanlaisen ympäristön ja työkalujen avulla. Ei riitä aika ja resurssit Seitsenhenkinen digitoimisto on täyden palvelun toimisto, ei sekatavaraliike. Kun kaikki henkilötyöresurssit on käytetty nykyisten asiakkaiden laadukkaaseen palvelutasoon, isojen projektien toteutukseen, pienkehitykseen ja jatkokehitykseen, ei aikaa yksinkertaisesti riitä pienemmille satunnaisille ja yksittäisille liukuhihnahommille. Suomeksi sanottuna kyse on puhtaasti liiketoimintamallista. Kun kysyntää on paljon, yrittäjän tärkein oljenkorsi on sana “ei”. Kieltävän vastauksen saaminen ei ole sen kummempi asia muillakaan aloilla, joilla kysytään “löytyykö asiaa X kattauksesta”. Jos yritys ei palvelua tarjoa, se ei sitä tarjoa, ja on aika siirtyä eteenpäin. Tiedostamme että Internetin sekatyöläisenä riittäisi töitä maailmanloppuun asti, mutta me haluamme asiakkaissamme keskittyä laatuun, eikä määrään. Meille tärkeämpiä ovat isommat, jatkuvammat ja pysyvämmät projektit ja asiakkaat. Maksaa liikaa Koska työmäärää ei voi tietää ennalta katsomatta koodia ja selvittelykin vie aikaa, on myöskin hinta-arvio vaikea antaa. Ilman laajempaa selvittelyä yläkanttiin annettu hinta-arviokaan ei vielä takaa sitä, että työ olisi kannattavaa. Jos työ ei maksa liikaa asiakkaalle, se maksaa liikaa tekijälle. Kaikkea ei kannata korjata, joskus on parempi tehdä alusta asti uusi ja entistä ehompi kokonaisuus Jos perustukset eivät ole kunnossa, sivustoa korjataan hamaan tappiin asti, eikä siitä tule siltikään tarpeeksi hyvä. Se johtuu perustuksista. Purkkaa purkan päälle ei kannata latoa, vaan mieluummin korjata ne perustukset, jolloin puhutaan jo kokonaisen sivuston uudistamisesta. Ennen kuin mietit nopeita korjausliikkeitä, mieti uudelleen jos kotisivusi on esimerkiksi yli kaksi vuotta vanhat. Onko brändisi ajan tasalla? Pitäisikö ehostaa jotain muutakin? Toimiiko kaikki niin hyvin kuin mahdollista? Onko verkkosivuja helppo päivittää? Niinpä. Mieti isompaa kuvaa ensin. Kaikkea ei ole välttämättä edes mahdollista tehdä Voi olla, että nettisivusi pyörivät jonkin SaaS-palvelun (HubSpot, SquareSpace, WordPress.com) päällä, jonne muokkauksia ei pysty tekemään. Tai sitten saattaa olla, että palvelinalustasi rajoittaa joidenkin asioiden tekemistä. Voi olla jokin muu estävä asia, jota emme voi tietää ennen kuin tutkimme. Ja tutkiminen ja selvittelykin vie paljon aikaa, josta kysyjä ei välttämättä ole valmis maksamaan. Kinkkinen tilanne. Väitätte tekevänne verkkosivuja. Mitä te sitten tarjoatte? Duden palvelukattaukseen kuuluu verkkosivujen suunnittelu ja toteutus, mutta teemme myös visuaalista suunnittelua aina brändi-ilmeen toteutuksesta (logot, graafiset ohjeistot yms.) verkkosivujen ulkoasun suunnitteluun asti. Parhaimmillamme olemme kun pääsemme tekemään verkkosivut, verkkopalvelun tai verkkokaupan WordPressillä alusta asti aina ulkoasusta viimeisiin koodiriveihin saakka. Onneksi Internetin rakennusväestä löytyy myös kertakorjaajia Tekijöitä on erilaisia. Me seitsenhenkisenä digitoimistona emme lähde paikkailutyöhön, mutta tiedämme alan tekijät hyvin ja meiltä kysyessä saat aina suosituksen eteenpäin. Kiinnostaisiko kuitenkin pikkupaikkailun sijaan laittaa koko sivut uusiksi? Siinä tapauksessa ota meihin yhteyttä niin kerromme lisää! Verkkopalveluiden kehitysVerkkosivujen ostaminen digitoimisto dude oymuutokset verkkosivuilleverkkosivujen korjausverkkosivutweb-kehitysweb-suunnittelu"
author = "Roni Laukkarinen"
