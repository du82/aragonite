["https://www.dude.fi/wordpress-cms"]
title = "WordPress verkkosivut - Digitoimisto Dude Oy, Jyväskylä"
description = "WordPress on alustana keskeinen osa Duden liiketoimintaa. Mistä WordPress lähti? Lue katsaus WordPressin historiaan tästä kirjoituksesta."
full_description = "Kirjoittanut Roni Laukkarinen Verkkosivujen julkaisussa WordPress alkaa olla alustana sen verran hehkutettu, että hehkutetaan nyt vielä lisää, sillä onhan WordPress myös keskeinen osa Duden liiketoimintaa. Tällä hetkellä WordPress on kaikista suosituin alusta, jolle verkkosivuja julkaistaan (noin neljäsosa kaikista maailman sivustoista). Aina näin ei ole ollut. Joten otetaanpa ensin katsaus historiaan. Mikä WordPress? WordPressin historia lyhyesti Vuonna 2003 vain 18-vuotias ohjelmistoinsinöörin koodaripoika ja bloggaaja Matt Mullenweg huomasi että hänen bloggausalustaansa b2/cafeblogia ei oltu päivitetty kuukausiin ja kehittäjä oli kadonnut kuin tuhka tuuleen, joten hän alkoi etsimään muita vaihtoehtoja. Textpattern näytti kaikelta mitä hän toivoi, mutta sitä ei oltu lisensoitu ihan täysin avoimeksi, joten hän ei siihen ryhtynyt. Sen sijaan hän ajatteli perustaa oman alustan b2:n pohjalle, kunhan saisi kehittäjän kiinni. Näin kävi ja WordPress oli syntynyt. Minä käytin tuolloin tiedostopohjaista cutenewsiä, mutta järjestelmän kehityksen laannuttua 2005-2006 siirsin kaiken WordPressille, vaikka Textpattern oli yksinkertaisuudessaan WP:n selkeä kilpailija. Osa sen aikaiset kolleegani käyttävät Textpatternia yhä. Bloggausalustat olivat vuosi vuodelta enemmän nosteessa ja portaalityyppiset sivustot kukoistivat. Vuonna 2001 perustettu Drupal oli WordPressia hieman suositumpi ja erityisesti vuonna 2005 jälkeen Joomlan suosio lähti kasvamaan. Udemyn infograaffi WordPressin historiasta. Klikkaa isommaksi. WordPress on alusta asti säväyttänyt yksinkertaisella ja helppokäyttöisellä käyttöliittymällään. Aluksi julkaisujärjestelmä keskittyi ainoastaan bloggaamiseen, mutta nykyään alustalla tehdään enemmän normaaleja verkkosivuja kuin blogeja. Kehityspolku on mennyt jotakuinkin järjestyksessä Bloggausalusta → Verkkosivualusta → Verkkopalvelu- ja verkkokauppa-alusta → Appsit (tulevaisuus). WordPressillä saa siis aikaan melkein mitä tahansa nykyään. WordPressin historian merkkipaalut löytyvät myös WordPress Codexista. Miksi WordPress? Alustana WordPress on Helppokäyttöinen ja suoraviivainen – käyttäjäystävällisyyden vuoksi ei tarvitse paljon laajempia käyttökoulutuksia pitää, lyhyt perehdytys riittää Monipuolinen – avoin lähdekoodi mahdollistaa laajemman kehityksen. WordPressillä saa perussivujen lisäksi aikaan varausjärjestelmiä, uutissivustoja, verkkopalveluita, verkkokauppoja, verkkolehtiä, appseja, diaesityksiä ja presentaatioita, infograafeja, laskeutumissivustoja, asiakaspalveluakanavia, introja, mediapankkeja, tuotekatalogeja, ja niin edelleen. Kehittäjäystävällinen – WordPressin ehdottomia valtteja ovat jatkuvuus kehityksessä ja kehittäjien määrä. Koska lähdekoodiin pääsee kuka tahansa tekemään korjauksia, palvelu myös toimii, kehitys on jatkuvaa ja bugit korjataan nopeasti. Jos kehittäjä kuukahtaa, heti on hydran pään tavoin kymmenen tilalla. Pyörää ei tarvitse keksiä uudelleen, eikä projekteissa tarvitse toistaa samoja asioita aina uudestaan ja uudestaan. Ilmainen – WordPress itsessään ei maksa mitään. Kuka tahansa voi asentaa WordPressin omalle palvelimelleen niin halutessan lataamalla WordPressin verkkosivuilta. Ulkoasujen ja lisäosien säätäminen vaatii usein kuitenkin teknistä osaamista. Yhteisö– WordPressin kehittäjiä on paljon, mutta vielä enemmän on käyttäjiä, loppukäyttäjiä ja sivustolla kävijöitä. WordPress-yhteisö on huikea ja myös Suomessa on järjestetty lukuisia WordPress-tapaamisia. Keväällä 2015 järjestettiin Suomen ensimmäinen WordPress-seminaari, josta kirjoitin kokonaisen bloggauksen Toimiva – Hyvä esimerkki Valu Digital Oy:n WordPress-asiantunija Mikko Vireniuksen WordCampissa mainitsema tapaus, jossa liki 10 vuotta vanha WordPress-asennus päivitettiin uusimpaan ilman minkäänlaisia ongelmia sivustolla. Laajennettava – Lisäosia ja valmisteemoja löytyy kattava määrä, mutta WordPressiin saa myös uniikkia tavaraa digitoimistoilta. Yksi työkalu moneen eri käyttöön – On totta että WordPressiä parempia alustoja löytyy eri käyttötarkoituksiin, mutta WordPressillä pystyy toteuttamaan tarvittaessa kaikki palvelut samaan, esimerkiksi asiakasrekisteri, verkkokauppa ja yhteydenottokanava. On helpompaa hallita yhtä sivustoa tai järjestelmää kuin tehdä eri asiat eri palveluissa. Monia muita hyötyjä mitä ei tämän bloggauksen aikana tullut mieleen. WP Enginen infograaffi. Klikkaa isommaksi. Kehittäjän näkökulmasta WordPress on vuosien varrella osoittautunut kivoimmaksi. Montaa muuta järjestelmää kehutaan mm. perusteilla että tulee enemmän “valmiina” ominaisuuksia, mutta kehittäjänä pidän itse enemmän hyvin tehdystä pohjasta, josta voin räätälöidä ja soveltaa uniikin ja upean lopputuloksen. Mieluummin rakentaa valmista kuin karsii valmiista turhaa pois. Tarpeellisen luominen on mukavempaa kuin roskien siivoaminen. Emme liiemmin suosi valmista pullaa, jota muillakin on vaan nimenomaan asiakkaan tarpeisiin räätälöityä kokonaisuutta. Toki avoin lähdekoodi nopeuttaa, koska starttipalikoita ja työkaluja löytyy mittava kirjo. Valmisteemoista räätälöinti ei ole kuitenkaan aina tarkoituksenmukaista, sillä on parempi tilata koko takki alunperinkin räätäliltä kuin väkisin muuttaa valmista jo räätälöityä takkia uuteen muottiin. Suljetut ja eri toimijoiden omat järjestelmät sitovat asiakkaan samaan toimittajaan ja toimittajaloukussa asiakas joutuu ostamaan jatkotarpeet yhdeltä kehittäjältä. Laajentaminen voi käydä kalliiksi, sillä integrointeihin ei ole apuja muualta vaan kaikki tehdään puhtaalta pöydältä. Samat ongelmat ovat myös avoimen lähdekoodin järjestelmissä, joilla sivustoja on tehty vähemmän (esim. MODx, PivotX, CMS Made Simple, NemoCMS, jne.) ja koska kehittäjiä on vähän, on koko sivuston toiminta ja tulevaisuus epävarmaa. Joillekin on käynytkin niin, että sisällönhallintajärjestelmän kehitys on lakkautettu ja sivustot lakanneet toimimasta. Pääasialliseksi sivuston alustaksi en harkitsisi alle 2% käyttöasteen omaavia hallintajärjestelmiä. Räätälöity WordPress-kehitys WordPressiä voi tehdä monella eri tapaa ja erilaiset mainostoimistot ja digitoimistot usein tarjoavatkin WordPress-ratkaisuja. Räätälöity WordPress-kehitys on kuitenkin se omin juttu, koska kokemukseni mukaan valmisteemoissa on hyötyjä enemmän korjailtavaa ja siivoiltavaa. Perussivuihin ne saattavatkin sopia, mutta logoa ja väritystä lukuunottamatta samanlaisia sivustoja samalla teemalla löytyykin netistä sitten pilvin pimein. Jos haluaa erottua, varaa aikaa räätälille. WordPress-sivuston perustaminen WordPress-sivuston tai blogin voi perustaa helposti ja ilmaiseksi ilman minkäänlaista teknistä tietämystä osoitteessa WordPress.com. Toinen suosittu vaihtoehto on asentaa WordPress omaan webhotelliin tai tilata WordPress-sivut boutique-digitoimistolta, jolloin teema ja toiminnot räätälöidään yritykselle sopivaksi. Loppusanat Nykynetissä tulee helposti WordPress-ähky, mutta se ei ole missään nimessä huono asia. Ehkä ainoa kritiikki mihin olen törmännyt, on väite WordPressistä hitaana tai raskaana järjestelmänä, mutta tulevien jatkokehitysten myötä sekin helpottuu (esim. WP Rest API ja SPA-sivustot) ja asia riippuu pitkälti palvelimen asetuksista ja välimuistitusten käytöstä. WordPress ja sivustot muutenkin saa toimimaan paremmin, jos sivuston toteutaja tietää palvelimista ja optimoidusta WordPress-kehityksestä. Jos keksit jotain negatiivista WordPressistä, kerro minullekin. Hyviä kirjoituksia WordPressistä toisaalla: Aucor: Suomen kattavin WordPress-kirjoitus Statement: WordPress on kokonaisvaltainen verkkopalvelualusta Vierityspalkki: WordPress asettaa julkaisujärjestelmien perusstandardin Vierityspalkki: WordPress-toteuttajat Suomessa 2014 Tiistain WordPress-päivitys 4.2.4 inspiroi kirjoittamaan tämän bloggauksen. WordPress pysyy kehityksessä mukana kiitettävästi. WordPress-kehitys julkaisujärjestelmätmainostoimisto jyväskylämainostoimistotsisällönhallintajärjestelmätverkkosivutweb-kehityswordpresswordpress suomiwordpress-kehityswordpress-sivut"
