ri toimintojen tarpeista sivustolla. Lisäksi pörssilistatun yrityksen Gofore Oyj:n bisneskriittisiä teknisiä toiminnallisuuksia ja integraatioita tarkennettiin. Sivuston ulkoasu suunniteltiin Goforella sisäisesti, tiiviissä yhteistyössä Duden suunnittelijan ja kehittäjien kanssa. Avoimella kommunikaatiolla ja ajatustenvaihdolla suunnitteluvaiheessa varmistettiin projektin sujuva eteneminen koodausvaiheessa ja toteutettavien elementtien helppokäyttöisyys sisällöntuotannon näkökulmasta. Monimuotosille sisällöille toteutettiin laaja lohkokirjasto jotka sisältävät pienempiä asetuksia ulkoasun ja asettelun monipuolistamiseksi. Osa lohkojen sisällöistä automatisoitiin kerättäväksi muista lähteistä, vähentäen manuaalista työtä ja helpottaen markkinointitiimin työtä. Sivustolle toteutettiin Recruitee -järjestelmään integraatio, joka hakee avoimet työpaikat, luo hakemuslomakkeen osaksi sivustoa ja jonka kautta työnhakijat voivat lähettää hakemuksen siirtymättä ulkopuoliseen palveluun. Lisäksi taustalla on integraatiot Suomen Tietotoimiston julkiseen tiedoterajapintaan sekä autentikaatiota vaativaan pörssitiedoterajapintaan. Duden tuki & turva Gofore luottaa Duden ylläpitopalveluun, jossa vastaamme palvelinympäristöstä, WordPressin ja sen lisäosien päivityksistä, varmuuskopioista ja yleisesti sivuston luotettavasta toiminnasta. Kehuttu käyttötukemme on jatkuvasti valmiina palvelemaan Goforea, jos sivuston kanssa sattuukin tulemaan haasteita tai sisältöjen päivittäjä on päässyt unohtamaan mistä mitäkin sisältöä muutetaan. Yhteistyö sivuston kehittämisen saralla onkin jatkunut tiiviinä uudistuneen sivusto julkaisun jälkeenkin. Lopputulos Gofore sai sivuston joka ilmentää yrityksen nykyaikaisuutta, asiantuntijuutta, arvoja ja tuo mielenkiintoiset asiakastarinat sekä blogikirjoitukset keskiöön. Sisältöjen päivittäminen on muuttunut helpommaksi ja suoraviivaisemmaksi. Vastuuhenkilöt eivät joudu enää jännittämään ja stressaamaan, tulevatko tiedotteet näkyville oikealla hetkellä. Projektin kohokohdat Toimintavarma integraatio tiedoterajapintoihin Pörssiyhtiöiden tiedotusvelvollisuus on tarkkaan säädeltyä. Esimerkiksi vuosikatsausten julkaisu on aikakriittistä ja niiden on oltava näkyvillä sivustolla viipymättä julkaisun jälkeen. Toteutimme integraation joka hakee STT:n suljetusta rajapinnasta uudet tiedotteet lähes reaaliajassa sivustolle. Osana pörssitiedotteiden siirtymistä tyhjennetään automaattisesti tarvittavat välimuistit, jotta tiedote nousee mm. etusivulle. Pörssitiedotteiden haku on toteutettu tavalla jonka vikaantuminen tai jumiutuminen on lähes mahdotonta – osana integraatiota on kuitenkin ulkopuolinen valvonta joka hälyttää välittömästi virhetilanteista. Pörssitiedotteiden lisäksi sivustolle haetaan normaalit lehdistötiedotteet STT:n avoimesta rajapinnasta. Miellyttävä työnhakukokemus HR-osaston työtä haluttin helpottaa integroimalla käytetty Recruitee-järjestelmä sivustolle. Avoimet työpaikat haetaan kaikkine tietoineen rajapinnasta esitettäväksi sivustolla, jossa niiden suodattaminen on mahdollista toimipisteen ja toimenkuvan perusteella. Jokaiselle avoimelle työpaikalle muodostuu oma sivunsa rekrytointijärjestelmään täytettyjen tietojen pohjalta. Työnhakijoiden kokemuksesta haluttiin tehdä mahdollisimman miellyttävä ja madaltaa hakemuksen lähettämisen kynnystä. Toteutimmekin hakemuslomakkeen suoraan työpaikan sivulle. Lomake koostetaan sivulle automaattisesti Recruiteessa määriteltyjen kysymysten perusteella, mahdollistaen ilmoituskohtaiset spesifit kysymykset. Lopulta hakemukset lähetetään suoraan Recruiteehen, josta HR saa ne helposti käsittelyyn. Pieni hiilijalanjälki Gofore yhdistää toiminnassaan menestyvän liiketoiminnan kokonaisvaltaiseen vastuullisuuteen, ja onkin ollut hiilineutraali vuodesta 2021 lähtien. Uuden sivuston kohdalla vastuullisuus tarkoitti käytännössä sitä, että yksi merkittävä tavoite uudistukselle oli sivuston hiilijalanjäljen pienentäminen. Olimmekin mukana auttamassa tämän kulman huomioimisessa jo suunn