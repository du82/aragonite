["https://www.dude.fi/asiakasesittelyssa-suomen-ulkoministerio"]
title = "Asiakasesittelyssä Suomen ulkoministeriö - Digitoimisto Dude"
description = "Toinen Duden perustajista ja liiketoimintalähtöinen teknologiajohtaja, jolle tärkeintä on että asiakas on tyytyväinen."
full_description = "Kirjoittanut Roni Laukkarinen Artikkelikuva Merikasarmista: Tino Vaittinen Tässä työssä mahtavinta on sen monipuolisuus, sillä hommia saa tehdä kaikenlaisille organisaatioille ja toimijoille. On ollut riemastuttavaa ja monella tapaa arvokasta tehdä hommia Suomen ulkoministeriölle, etenkin saavutettavuusasioiden parissa. Sain kiinni erikoissuunnittelija Lauri Äijälän, joka vastaa ulkoministeriöllä verkkoviestinnästä ja tietojärjestelmistä. Kaivoin edellisen elämäni toimittajanidentiteetin esiin ja kysyin muutaman kiperän kysymyksen yhteistyöstämme. Kuvitteellinen nauhuri esiin ja ei muuta kuin kysymystä pöytään. Kerro vähän ulkoministeriön pyörittämistä verkkosivuista ja hankkeista lukijoillemme, paljonko sivustoja on ja mihin eri tarkoituksiin? “Olemme muistaakseni tilanneet Dudelta aivan aluksi teemapäivät.maailma2030.fi –sivujen toteutuksen. Teemapäivät ovat UM:n kehitysviestinnän ja Rauhankasvatusinstituutin toteuttama YK:n kestävän kehityksen tavoitteiden teemojen monialainen verkko-opas opettajille. Sivusto julkaistiin aivan vuoden 2020 alussa. Tämän jälkeen sana hyvästä toimittajasta kiiri talon sisällä. Dudelta on tämän jälkeen hankittu kehityslehti.fi ja kehityspoliittinentoimikunta.fi –sivustojen uudistukset. Sivustoissa on painottunut kehityspolitiikan ja -yhteistyön viestintä, koska sivujen omistajat ovat keskustelleet keskenään.” Helsingin Merikasarmi. Kuva: Tino Vaittinen Millaisia palveluja tai projekteja olette tilanneet Dudelta? “Yhdet täysin uudet sivut ja muutama vanhojen sivujen uudistaminen. Projekteissa on yleensä ollut mukana kolmas taho, joka on suunnitellut sivujen visua, konseptia ja sisältöjä. Muistaakseni kehityspoliittisen toimikunnan sivujen toteutuksessa Dudella oli kokonaisvaltaisempi rooli myös sivuston konseptoinnissa ja visuaalisessa suunnittelussa. Kehityslehden sivujen osalta on ollut eniten jatkuvasti pieniä kehitys- ja muutostarpeita. Lehti onkin ajassa elävä julkaisu, jossa myös päätoimittaja on vaihtunut muutamaan otteeseen. Uudella päätoimittajalla on yleensä ollut uusia ideoita sivujen suhteen ja halua luoda esim. täysin uusia sisältötyyppejä sivuille. Muissakin sivustoissa on ollut pieniä ylläpitotarpeita. Nämä ovat yleensä onnistuneet mainiosti. Digipalvelulain saavutettavuusvaatimuksien tullessa voimaan, teimme kaikille sivustoillemme saavuttavuusauditoinnin. Myös Duden tekemille sivuille tehtiin tässä kohtaa joitain korjauksia/muutoksia.” Miten Dudelta tilatut hommat ovat teidän mielestä sujuneet? Ollaanko osattu vastata odotuksiin? “Duden kanssa hommat ovat toimineet. Itsellä on paljon kokemusta erikokoisista palveluntarjoajista, joten vertailupohjaa löytyy jonkin verran. Voi myös sanoa, että Dudella hinta-laatusuhde on kohdillaan. Meillä on sikäli haastava WordPress-kokonaisuus, että olemme koonneet eri tahojen toteuttamia WordPress-sivustoja samaan multisiteen, jota operoi toinen palveluntoimittajamme. Tämä on asettanut myös tietyt tekniset kriteerit ympäristöön tuleville toteutuksille. Palveluntoimittajamme myös auditoi muiden toimittajien toteutukset ennen niiden asennusta multisiteen. Eri toimijoiden monitoimittajaympäristössä ei yhteistyön sujuvuus ole ollut aina täysin kitkatonta. Duden eduksi voi sanoa, että monitoimittajaympäristössä toiminen ei ole tuntunut olevan ongelma heille. Ehkä hallinnointipalvelutoimittajamme sekä Duden molempien jyväskyläläisyys on ollut tässä eduksi. Uskoisin, että kyse on kuitenkin enemmän Duden työn joustavuudesta, yleisestä asenteesta ja työn hyvästä laadusta. Sellainen käsitys myös jäi, että teettämissämme saavutettavuusauditoinneissa Duden sivut selvisivät keskimääräistä paremmin ja vaativat hieman vähemmän muutoksia kuin muut hallinnoimamme sivustot.” Miten projektinhallinta mielestäsi toimii Dudella? “Ketterästi ja kevyesti verrattuna isompiin toimijoihin. Ehkä hieman häiritsee se, että projektinhallintaan käytetty alusta on vaihtunut pariinkin otteeseen. Aluksi projektien hallintaan käytössä oli Google Sheets ja Docs, sitten jonkin aikaa Favro ja nyttemmin Height? Ehkä tämä on se ketteryyden kääntöpuoli, että tietty pysyvyys hieman kärsii.” Entä vasteajat, aikataulut, deadlinet? “Tästäkään ei tule mieleen huonoa sanottavaa. Aikataulut ovat pitäneet hyvin. Jos näin ei ole ollut, niin olemme saaneet aina etukäteen tiedon, jos on näyttänyt siltä, ettei aikataulussa tulla pysymään. Tuntuu, että aikatauluongelmat ovat olleet enemmän omalla puolella. Isossa organisaatiossa ja useiden samanaikaisten hankkeiden kanssa toimiessa on välillä vaikea saada henkilöitä tekemään vaadittuja asioita aikataulussa tai saada aikaan päätöksiä. Eli meiltä vaadittujen sisältöjen toimituksessa tai päätöksien tekemisessä ollaan enemminkin asiakkaana jääty jälkeen alun perin yhdessä suunnitelluista aikatauluista.” Sananen saavutettavuudesta. Valtiolla on erittäin tärkeää ottaa verkossa kaikki huomioon. Miten saavutettavuusasiat Duden kanssa ovat toteutuneet? “Toki julkishallinnon toimijana edellytämme sivustoiltamme lainmukaisuutta ja saavutettavuusvaatimuksien täyttämistä. Käytännössä tämä ei kuitenkaan ole helppoa, sillä WCAG-kriteerien täyttäminen ei aina ole ihan niin yksinkertaista ja tulkinnan varaa on paljon. Kaikkien kriteerien kirjaimellinen seuraaminen onkin osoittautunut sellaiseksi, ettei se välttämättä edes palvele täysin tarkoitustaan. Pyrkimys toki on aina ne täyttää täysin. Auditointeja teettäessä ja eri saavutettavuustyökalujakin käyttäessä huomaa, että riippuen hieman auditoijasta tai käytetystä työkalusta, kriteerien tulkinnat ja korjausehdotukset ovat hieman erilaisia. Riippuen toimijasta eri saavutettavuusasioihin kiinnitetään huomiota. Kun mennään yksityiskohtiin, niin kriteerien täyttämisen toteutuksen tulkinta ei ole aina ihan selkeää ja yksinkertaista. Duden kanssa saavutettavuusasioiden hoitaminen on kuitenkin ollut miellyttävää sillä tässäkin asiassa asenne on kohdillaan; tulee tunne, että saavutettavaa sivustoa halutaan tehdä ja se nähdään myös itselle tärkeäksi asiaksi.” Millaista Duden kanssa on tehdä yhteistyötä noin niinkuin yleisesti? “Duden kanssa yhteistyö on ollut helppoa ja rentoa. Toiminnan henki on sellainen, että halutaan tehdä hyvää jälkeä ja palvella asiakasta.” Muuta sanottavaa, sana on vapaa! “Ei muuta kuin kiitos raikkaasta ja intohimoisesta otteesta. ☺” Verkkosivujen ostaminenYritys asiakasasiakasesittelydigitoimisto dude oypienkehitysprojektitsaavutettavuusSuomen ulkoministeriötyönäytteetverkkosivu-uudistusverkkosivut"
author = "Roni Laukkarinen"
