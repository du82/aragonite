["https://www.dude.fi/top-5-duden-tekemaa-wordpress-lisaosaa"]
title = "Top 5 Duden tekemää WordPress-lisäosaa - Digitoimisto Dude, Jyväskylä"
description = "WordPress itsessään on yksinkertainen sisällönhallintajärjestelmä ja sisältää valmiudet sivujen ja artikkelien luomiseen. Ilman lisäosia WordPress on kuitenkin pelkkä tyhjä kuori. Hyvin toteutettujen WordPress-lisäosien avulla käyttökokemuksesta saa taianomaisen. Mitä lisäosia Dude on koodannut itse? Se selviää, kun luet tämän kirjoituksen."
full_description = "Kirjoittanut Roni Laukkarinen WordPressin toiminnallisuutta laajennetaan järkevästi koodatuilla lisäosilla. Dude on toteuttanut muutamia arkea helpottavia WordPress-lisäosia, jotka ovat melko näkymättömiä, mutta merkittäviä. Näiden lisäksi olemme toteuttaneet lukuisia kehittäjälisäosia, kuten muunmuassa mainostyökalun tarjoavan dude-really-simple-adsin ja palikan, joka listaa luetuimmat kirjoitukset esim. verkkolehdessä. Tässä kirjoituksessa on kuitenkin kyse uudemmista “core-lisäosista”, eli laajennoksista, jotka ovat päivittäin käytössä ja monesti oletuksena mukana projektissa. Kirjoitus on kohtalaisen tekninen, mutta toivottavasti pysyt mukana. Asiakkaamme eivät varsinaisesti näe asennettuja lisäosia, koska kyseessä on “konepellin alla” olevia komponentteja, joita ei tarvitse hyvin toteutetulla sivustolla edes miettiä. Ne vain toimivat. “Isossa maailmassa” (tai enemmänkin tee se itse -maailmassa) lisäosia voi luoda ja asentaa itse, jos WordPress-sivuston ylläpitäjältä löytyy teknistä tietämystä. Mutta mitä tahansa lisäosaa ei kannata asentaa suin päin, nimittäin lisäosat ovat kolmannen osapuolen tekijöitä ja voivat laadullisesti vaihdella rajustikin. Haavoittuvuuksien listalta löytyy jatkuvasti uusia lisäosaversioita. Me Dudella käytämme vain hyväksi havaittuja, tietoturva-auditoituja lisäosia. Koska moni lisäosa on kuin ampuisi singolla nuppineulanpäähän, olemme halunneet koodata “täsmäpalikat” itse, jotta hyvä suorituskyky säilyisi. Taustaa yleiskäyttöisistä WordPress-lisäosistamme Koska olemme avoimen lähdekoodin alustalle WordPressille toteuttava yritys, tykkäämme julkaista lisäosamme myös avoimesti koko maailman käyttöön. Tästä syystä vältämme firman nimen tai mainoksen käyttämistä lisäosissa. Lisäosat tai varsinainen koodi eivät ole oikea paikka markkinoida tekemistämme, siksi emme tunge kehittäjädokumentaatiota tai ylläpitonäkymää täyteen Dude-mainoksia, vaan annamme tekeleemme muiden kehittäjien vapaaseen käyttöön. Air-light WordPress-aloitusteemamme on syntynyt näistä lähtökohdista ja siihen pohjaa myös nimi “Air”, “kevyt”. Haluamme, että “tuoteperheen” nimi on jotain ihan muuta kuin “dudea” ja tähtäämme kaiken keveyteen, niin toteutuksen kuin suorituskyvynkin osalta. Air-lightin myötä syntyivät air-lisäosat, koska teemaan ei kannata tunkea laajentavaa tekniikkaa. Nyt on aika esitellä nämä lisäosat, mitä ne ovat ja mitä ne tekevät. Air helper – kehittäjälisäosa, joka tekee WordPressistä minimalistisen “Air-apuri” on lisäosa, joka parantaa WordPressin käyttökokemusta. Vaikka puhutaan “lisäosista”, joiden pitäisi lisätä toiminnallisuutta, Air helper itseasiassa karsii paljon turhaa oletustoiminnallisuutta WordPressistä ennen kuin se tekee mitään muuta. WordPress on aivan mainio sisällönhallintajärjestelmä, mutta jos asentaisit sen tuoreeltaan itse, se sisältää paljon kaikkea turhaa mitä ei tarvita näkyville. Tämä lisäosa ei sisällä minkäänlaista asetussivua, eli näkymää WordPressin hallintapaneelissa, vaan kaikki toiminta tapahtuu kulissien alla. Kyseessä on siis pitkälti kehittäjien lisäosa. Tässä on kyseessä lisäosa, jota ilman Dude-saitti ei ole Dude-laatua. Tällä lisäosalla suurin osa taikuudesta tapahtuu. Mitä Air-apuri sitten oikeasti, varsinaisesti tekee? Siivoaa wp-administa tavaraa, joita ei tarvita (turhia “Tervetuloa WordPressiin” -viestejä tai “WordPressiin on saatavilla päivitys) Siivoilee piiloon eri lisäosien turhia myyntibannereita (Exactmetrics, Yoast, Filebird, Yaymail jne.) Laajentaa aloitusteemamme teknisiä toiminnallisuuksia Luo teknisiä helpotuksia ja edellytyksiä kielikäännöksille ja kieliversioille Lukuisia kehittäjien elämää helpottavia asioita Lisää yläpalkkiin tiedon ympäristöstä, jossa ollaan Siivoilee turhia asioita yläpalkista (tukifoorumit, tekniset WordPress-dokumentaatiot, tietoa WordPressistä, tietoa päivityksistä jne., asiat joita Dude hoitaa eikä asiakkaan tarvitse nähdä aina naamalla) Korjailee käyttöoikeuksia. Lisäosiin ei ole tarvetta päästä muiden kuin kehittäjien ja sama homma esimerkiksi WordPress-päivitysten tai muiden teknisten ominaisuuksien osalta. Lisää helppolinkkejä valikkoon. Esim. oletuksena WordPressissä valikot on “Ulkoasu” -valinnan alla, mutta me olemme vieneet sen suoraan sivuvalikkoon, koska valikkoja tarvitsee päivittää joskus usein. Eipä tarvitse etsiä. Laajentaa WordPressin sisäänrakennettua Health Checkiä Varmistaa että sivuston lomakkeet ja sähköpostit menevät perille Lukuisia tietoturvatoimenpiteitä, kuten robottiliikenteelle kirjautumisenestoja ja enumeroinnin esto Oletus WYSIWYG-editorin paranteluja Oletusnäkymien siivoiluja, emme tarvitse esim. blogikirjoittajanäkymiä, yksittäisten mediatiedostojen esikatselusivuja jne. Hakuakaan ei ole oletuksena päällä, jos hakua ei saitille tule. Nämä pitää kehittäessä näpätä päälle, mutta jos ne ovat oletuksena päällä, ne unohtuvat ja nousevat hajonneina näkyminä Googleen, katso vaikka Sivustoon liittyviä suorituskykyparanteluja, mm. kuvien laiska lataus (engl. lazyload), välimuistitusjuttuja jne. Ja paljon muuta, tässä oli vain pintaraapaisu! Niin pieniä juttuja niin kevyessä lisäosassa, mutta isossa kuvassa paljon enemmän otettu huomioon kuin muilla. Kannattaa katsoa air-helperin GitHub, jos koodi kiinnostaa. Air setting groups – “Irtosisällöt” löytyvät täältä Tämä lisäosa luo uuden sisältötyypin, jonne saa kaiken “irtosisällön”, jota ei voi päivittää mistään muualta (vanhalta nimeltään valikossa lukee “Asetusryhmät”, mutta päätimme vaihtaa tähän nimen helpommin ymmärrettäväksi). Irtosisältöön kuuluvat mm. alatunniste (englanniksi “footer”), irtolinkit (esim. saavutettavuusseloste) ja sen sellaiset. Näiden kenttien alla voi olla myös mm. blogiarkistosivulla näkyviä lohkoja, esim. joka sivun alalaidan toimintakehote (englanniksi “Call to action”). Joukossa voi olla muunmuassa esimerkiksi seuraavaa: Tästä GitHubiin, jos koodi ja dokumentaatio kiinnostaa. Air notifications – Joustavat ilmoitukset asiakkaan muuttuviin tarpeisiin Monesti sivustolle tarvitaan ilmoitusluontoinen palkki, jossa kerrotaan jotain uutta ja hienoa. Tällainen on helppo koodata, mutta kiinteä palkki ei ole kovin dynaaminen. Olemme luoneet muuttuville ilmoittelutarpeille lisäosan, jolla kehittäjämme saa helposti palkin aikaan mutta jota myös asiakas voi itse päivittää. Näin se toimii. Ensin luot ilmoituksen adminissa, valitset sen näkymiseen liittyvät asetukset. Voit valita alkamispäivän, lopetuspäivän, millä sivuilla ilmoitus näkyy jne. Tämän julkaistuasi ilmoitus tulee näkymään välittömästi: Hieno, vaikka itse sanonkin! Katso lisäosan lähdekoodi GitHubista. Air search – Kehittäjälisäosa reaaliaikaisen hakutoiminnon toteuttamiseen Olemme kirjoittaneet aiemmin Relevanssi Premiumin päällä toimivasta hakuratkaisustamme, jota olemme sittemmin laajentaneet siihen pisteeseen, että kyseessä on oma lisäosa. Käytännössä tätä tekniikkaa käytetään muunmuassa Atenan, Rollekinon ja Rexin sivustoilla. Toteutimme Atenan sivustolle reaaliaikaisen haun jossa tulokset on ryhmitelty sisältötyypeittäin. Jatkossa laajennamme tekniikkaa indeksipohjaiseen hakumoottoriin, mutta uudesta hausta saa sitten oman erillisen syväluotaavan kirjoituksensa. Katso Air searchin koodia GitHubissamme. Air reactions – reaktiot artikkeleihin tai sivusisältöihin Vaikka some on poistumassa verkkosivuilta, jonkin verran interaktiivisuutta vielä toivotaan. Air reactions on paketoitu kehittäjälisäosa, jolla saa luotua vaikkapa Linkedinmäiset hymiöreaktiot tai perus peukutukset eri tarpeisiin. Lisäosa logittaa hyödyllisyyttä ja sen avulla voi sorttailla vaikka tykätyimmät tekstit. Samaa ideaa on käytetty esim. omassa amassamme. Esimerkin voi katsoa esimerkiksi Kiinteistölehdestä (vain kirjautuneille) ja VAAOn sivuilta. Tsekkaa Air reactionsin koodi GitHubissa. Lisäosat parantavat käyttökokemusta WordPress-lisäosilla on melkosen huono maine, mutta hyvin koodatut lisäosat itse asiassa toimivat nopeasti ja helpottavat elämää. Duden vakiolisäosat ovat mahdollisimman näkymättömiä tai minimalistisia ja sisältävät ainoastaan tarpeellisia toimintoja. Kiinnostaako vain hyvillä lisäosilla varustettu WordPress-toteutus? Ota yhteyttä! WordPress-kehitys avoin lähdekoodihakureaaliaikainen hakuweb-kehityswordpress-lisäosatwordpress-optimointi"
