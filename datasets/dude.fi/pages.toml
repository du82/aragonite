["https://www.dude.fi/uuteen-valilehteen-aukeavat-linkit"]
title = "Ei pakoteta linkkejä uuteen välilehteen"
description = "Toinen Duden perustajista ja liiketoimintalähtöinen teknologiajohtaja, jolle tärkeintä on että asiakas on tyytyväinen."
full_description = "Kirjoittanut Roni Laukkarinen Otsikko on tarkoituksella samankaltainen kuin 18.1.2022 kirjoitettu Vierityspalkin artikkeli samasta aiheesta. Ei avata niitä linkkejä uuteen ikkunaan. Tykkään alleviivata tätä asiaa. Joskus ihmettelin asiaa ääneen, kun eräällä sivustolla haluttiin, että kaikki ulkoiset linkit avautuvat uuteen ikkunaan. Minulle ilmaistiin hyvin voimakkaasti, että ei haluta että ihmiset poistuvat meidän sivuiltamme. Perustelu herättää hämmennystä, koska emme me voi muihin ihmisiin vaikuttaa. Ruksia voi painaa milloin hyvänsä. If people really want to leave, they will. And if users follow a link to another website and want to return to your website, they will invariably do so by clicking Back, since that’s the most popular way to revisit pages.Jakob Nielsen, “Prioritizing Web Usability”, 2006 Olen sivunnut aihetta muunmuassa vuonna 2020 kirjoituksessani Saavutettavuus ei ole pelkästään sokeita varten – Saavutettavat verkkosivut hyödyttävät kaikkia, ja myös Vierityspalkin edellä mainitussa artikkelissa on läjäpäin materiaalia lähteisiin, joissa aiheesta puhutaan. Tässä artikkelissa listaan siitäkin huolimatta ne tärkeimmät syyt, miksi linkkejä ei kannata laittaa aukemaan uuteen välilehteen koskaan. Vältä näitä WordPressissä. 1. Takaisin-nappi ei enää toimi Erityisesti aistirajoitteiseen vähemmistöön kuuluva netin käyttäjä ei usein välitä visuaalisesta käyttöliittymästä. Esimerkiksi oma vaimoni on kuurosokea ja tunnen sokeita ihmisiä, joille selaimen navigointitoiminnot ja näppäinkomennot helpottavat elämää huomattavasti. Kun linkki pakotetaan uuteen ikkunaan, selainikkuna ikään kuin “nollautuu”. Takaisin-nappi ei enää toimi. Joutuukin sulkemaan ikkunan tai etsimään aiemman välilehden uudestaan, jotta pääsee kohtaan, jossa aiemmin oli. Yleensä selainten takaisin-nappi muistaa jopa rullauskohdan, missä viimeksi oli. Haluatko rampauttaa selainnavigoinnin toiminnan pakottamalla linkin avautumaan eri paikkaan? 2. Linkki kiusaa näkövammaisia tai ruudunlukulaitteita käyttäviä Hieman edelliseen liittyen, käyttökokemus yht’äkkiä vaihtuu kun näkymä muuttuu, eikä pääse takaisin. Käyttäjä hämmentyy, kun selain täyttyy välilehdistä linkkejä klikatessa. Joidenkin käyttäjien voi rajoitteistaan johtuen olla myös vaikea hahmottaa sisältöä muutenkin. 3. Mobiililaitteissa ponnahduslinkit häiritsevät tavallistakin käyttäjää En tiedä sinusta, mutta minua ärsyttää puhelimella selatessa uuteen välilehteen avautuvat linkit, varsinkin kun nykyinen Androidin Chrome-selain lisää välilehtiä “ryhmiin”. Olen sen verran minimalismiin keskittynyt neuroottinen ahdistuja, että en halua säilöä selaimessani turhia välilehtiä. Kun toiminto pakotetaan käyttöön, joutuu jatkuvasti sulkemaan välilehtiä. Mobiililaitteella edellisen välilehden etsiminen on monen täppäyksen takana. 4. Kaikissa selaimissa ja välineissä linkki ei toimi ollenkaan On laitteita ja työkaluja, joilla linkki ei toimi ollenkaan, jos siihen on pakotettu uuteen ikkunaan aukeava toiminnallisuus. Linkki muuttuu tällöin siis käytännössä eri tyyliseksi tekstiksi ja härnää käyttäjiä olemassaolollaan. Certain user agents, like kiosks, are unable to open new windows or tabs.Scara Manga Agency: Do not open links in a new tab or window 5. Uuteen ikkunaan pakotettu linkki ei ole saavutettava Ponnahduslinkeistä kyllä saa saavutettavia (nuoli ja aria-label, selkeys), mutta itsessään se ei ole saavutettavin vaihtoehto. Kaikista paras on unohtaa tämä pakotus ja antaa käyttäjän päättää itse. Aiheesta muualla Vierityspalkki: Ei avata niitä linkkejä uuteen ikkunaan (2022)Web-ostajan opas: Käytettävyysklassikko: Milloin linkin kannattaisi avautua uuteen selainikkunaan? (2021)tempertemper: Opening links in a new tab or window is better avoided (2020)GRR Tech: Why you shouldn’t open links in new tabs (2019)CSS-Tricks: When to use target=”_blank” (2014)Vierityspalkki: Saako linkit pakottaa avautumaan uuteen ikkunaan? (2008) Saavutettavuus käyttöliittymäsuunnittelulinkitlinkkien saavutettavuussaavutettavuusverkkosivujen suunnittelu"
