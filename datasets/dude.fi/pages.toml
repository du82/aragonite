["https://www.dude.fi/duden-tilikauden-numerot"]
title = "Duden tilikauden 2021-2022 numerot"
description = "Toinen Duden perustajista ja liiketoimintalähtöinen teknologiajohtaja, jolle tärkeintä on että asiakas on tyytyväinen."
full_description = "Kirjoittanut Roni Laukkarinen On aika muistella edeltävää tilikautta, Duden yhdeksättä kokonaista vuotta yrityksenä. Tällä kertaa katsauksen suorittaa hallituksen jäsen, toimitusjohtajan pallilta vuosia sitten pois siirtynyt teknologiajohtaja Roni “Rolle” Laukkarinen, jolla on kuitenkin yhä näppinsä pelissä numeroissa. Olemme Dudella onnekkaita, koska olemme saaneet tehdä asioita omalla tavallamme alusta asti, vaikka porukkaa on tullut lisää. On ollut siistiä huomata, että jyväskyläläinen omintakeisuus puree laajemmallekin. Näiden ruumiinavausraporttien on tarkoitus överiavoimesti kertoa siitä miten rakennamme Dudesta kasvavaa ja kannattavaa yritystoimintaa. Tulet näkemään tekstissä numerot niin tuloksesta kuluihin kuin palkkoihinkin asti. Ennen kuin lähdetään uusimman tilikauden madonlukujen pariin, tsekkaa aiemmat alta. Aiemmat talouskirjoitukset: Digitoimisto Dude: ruumiinavaus 2016 (Tilikausi 2015-2016) Duden pieni talouskatsaus (Tilikausi 2016-2017) Duden talouskatsaus 2018 (Tilikausi 2017-2018) Duden talousvartti – tästä alkaa uusi startti (Tilikausi 2018-2019) Digitoimisto Dude – läpileikkaus 2019 (Tilikausi 2019-2020) Dude 2020 – kahdeksan vuotta kasvua (Tilikausi 2020-2021) Tilikausi lyhyesti Tilikautemme loppuu epätyypillisesti toukokuun lopussa (menimme aikoinaan kaupparekisteriin 22.5.2013), joten uusi tilikausi starttaa kesäkuun ensimmäinen päivä. Lähdemme siis joka vuosi altavastaavana lomille uuden kauden alkaessa. Poikkeuksellisesti vuonna 2021 eniten myyntiä teimme heinäkuussa ja joulukuussa, kun syksy oli muuten yllättävän hiljainen. Tilikauden aikana saatiin valmiiksi monta mahtavaa projektia, kuten Kiinteistölehti.fi, Otava Oppimisen palvelut, Alpaknitwear.com, UpCloud, Faktia, Sofioksanen.fi, Rakennustoimisto Alonen, Videotoimisto Flux, muutamia mainitakseni. Loppuvuodesta 2021 Dudella aloitti työharjoittelussa Elias, joka jäi harjoittelun jälkeen Dudelle myös töihin. Eliaksen kokemuksista Dudella löytyy myös täältä blogistamme lisää. Kehitys kehittyy jatkuvasti niin suunnittelu- kuin kehitystiimissäkin. Pikkuhiljaa voi alkaa puhua jo tiimeistä, kun ihmisiä on enemmän kuin kaksi. Suunnittelun prosessit kehittyvät koko ajan paremmaksi ja kehityspuolen kehitystä voit seurata reaaliajassa GitHubista. Uusimpina mullistuksina mainittakoon automatiikka ja lohkokirjasto. Teemme töitä entistä tehokkaammin ja sujuvammin, ja ns. “apinan hommaa” aina vähemmän ja vähemmän kun automatiikka hoitaa loput. Tällä tilikaudella panostimme myös dokumentaatioon, josta lisää myös blogissa: Dokumentointiin panostaminen kannattaa. Julkinen operointimanuaalimme löytyy edelleen osoitteesta handbook.dude.fi, entistä ehompana. Vuoden aikana myös palvelinpuolella tapahtui muutoksia, kun mm. tilannesivun tarjoajaksi vaihtui Better Uptime. Muistathan Duden asiakkaana tilata ilmoitukset sivun status.dude.fi alalaidasta. Projektityökalu vaihtui taas parempaan, mutta siitä blogissa tuonnempana. Aspa toimii edelleen kuin rasvattu, tehokkuudella, joka saa hakea vertaistaan. On todella siisti huomata, että optimoitavaa löytyy vielä näiden vuosien jälkeenkin. Asioista on mukavaa tiristää viimeisetkin tehot irti. Myynti ja markkinointi Viimeisimmän tilikauden aikana (erityisesti vuoden 2022 puolella) olemme tehneet paljon ruuvailuja myynnin saralla. Poikkeukselliseen rooliin nostettakoon ainakin myynnin tehostaminen, sen muuttaminen näkyväksi CRM:n ja omistajaporukan yhteisten kokoontumisen tiuhentamisen kautta (weeklyt) sekä kassavirran entistä tarkempi seuraaminen (jota tosin allekirjoittanut on luonteensa mukaisesti tehnyt vuosia muutenkin, ihan omin päin – dudelaisetkin jo tietävät, onko mitään asiaa mitä Rolle ei seuraisi käppyröiden avulla?). Tiedämme jatkossa enemmän ja tarkemmin myynnin kiemuroista ja pystymme reagoimaan mahdollisuuksiin paremmin. Keväällä otimme myös hetkeksi ulkopuolista näkemystä hallitustyöskentelyyn. Markkinointia olemme tehneet mm. oman vaatemalliston myötä ja luonnollisesti kirjoittamalla näitä bloggauksia sivustollemme. Mitään hurjempaa ei mahtunut tälle tilikaudelle, mutta ehkä seuraavaan… pistä seurantaan. Viime vuoden “Myynnin ja markkinoinnin murros” näkyy edelleen – emme ole Google-hakutuloksissa enää ihan ykkösenä, mutta toisaalta sitä kautta kärkiasiakkuudet eivät ole meille tulleetkaan. Google ei nosta hakutulosten kärkeen yrityksiä jotka tekevät parhaita verkkosivuja vaan yrityksiä, jotka tekevät Googlen mielestä parasta verkkosivujen tekemiseen liittyvää sisältöä. Dude 2020 – kahdeksan vuotta kasvua Top 5 kanavaa ovat näppituntumalla edelleen: Suositukset ja tekemämme työt 50% Joku tuntee jonkun jossain 30% Some, Vierityspalkki ja Google 20% Verkkosivujen projektikoot asettuvat hinnoittelullaan 5-50k € väliin, mutta uusimmalla tilikaudella tähtäimessämme on ollut 20-50k € projekteja, tähän haarukkaan tiimin kokemus, osaaminen ja näkemys soveltuu edelleen parhaiten. Näistä hyviä esimerkkejä Otava Oppimisen palvelut ja Alpaknitwear.com, mutta muitakin isomman kalibeerin kokoluokan projekteja on tulossa referenssiesittelyihin. Mutta sitten taas toisaalta, pystymme hyvinkin tehokkaasti toteuttamaan pienemmille yrityksille 5-10k sivustoja, jos haetaan ehtaa räätälöitävyyttä kuten Fluxin , Sofin tai Eepoksen sivustoille. Meiltä siis uskaltaa kysyä tarjousta pienemmälläkin budjetilla, jos SquareSpace tai Webflow ei ole vaihtoehto! Emme sulje näitä enää pois, mutta osaamme sanoa, jos sinulle toimii jokin toinen ratkaisu paremmin. Numerot ja liiketoiminta Ne luvut! Kassassa on ollut bufferia, kiitos pelonsekaisen mutta menestyksekkään koronavuoden ja tasaisen kasvun siitä lähtien. Uusin tilikauden tulos noudatteli jokseenkin samaa kaavaa kuin edeltäväkin, mutta orgaanisesti on haastavaa kasvaa niin paljon vuosi vuodelta kuin toivoisi. Siksi vuosi jäi vähän alle tavoitteen (400k), kuitenkin tulokseltaan onneksi plussan puolelle. Tilikauden liikevaihto: 399 063,76 €Liikevoitto: +17 788,44 € Tavoitteemme oli kasvaa viime vuodesta (vaihto 403 313,93 €, tulos +32 097,99 €), joten se että tilikauden liikevaihto on 4250,17 € vähemmän ja tulos 14 309,55 € vähemmän kuin viime tilikaudella olivat allekirjoittaneelle iso pettymys. Vaje johtuu loppuvuoden heikosta myynnistä. Vaikka teimme kesällä ja loppuvuonna myyntiä, syksy jäi harmillisen vajaaksi. Ei auta kuin peiliin katsoa. On silti jännä lukea vanhoja hallituksen tapaamisia, esimerkiksi 13.8.2020 palaverimemossa lukee: Rahat riittää hyvin loppuvuonna, mutta tulosta ei tehdä. Kaikki varmaan tietävät miten siinä kävi, tulosta tehtiin. Edeltävällä tilikaudella 2020-2021 tavoitteet olivat siis alunperin pienemmät, mutta ne ylitettiin isosti, kun taas tuoreimmalla tilikaudella 2021-2022 tavoitteet olivat kovemmat ja jäätiin pahaset 936,24 euroa alle 400 000 euron rajapyykin. Mutta takaisin tähän tuoreimpaan tilikauteen. Tammikuussa 12.1.2022 palaverimemoon on kirjoitettu: Syksyn montun vuoksi tilikaudella jäljessä tuloksen ja liikevaihdon suhteen, tasoittuu kevään mittaan Tavallaan siis tiedettiin tilanne jo tuossa kohtaa, kun tilikautta oli enää viisi kuukautta jäljellä, mutta haluttiin olla optimistisia. Kesäkuussa 2021 laadin kannattavuuslaskelman ja otimme laskelmat käyttöön Clockifyyn (aiemmin käytössä oli Harvest, joka ei ihan tukenut tarpeeksi hyvin tätä toimintamallia). Tämän ansiosta aloimme pysymään paremmin projektien sisäisissä budjeteissa ja ennen kaikkea pystyimme näkemään paljonko kaikkien osallisien aika kussakin projektissa maksaa suhteessa laskutettavaan määrään. Yrityksen kulurakenne ja palkat Ei erityisemmin nuukailtu, mutta ei tuhlailtukaan. Yrityksen omistajat nostivat kuukausipalkkaa 3000 € (brutto), harjoittelijat 600 € (brutto), koeaikalaiset 2200 € ja työntekijät 2600-3300 € (brutto). Tulevaisuus Totuus on kuitenkin se, että vain harva voi jatkaa loputtomiin menestyksekkäästi täysin samalla konseptilla. Paitsi tietysti Kiss, Coca Cola ja Simpsonit. …ja Dude? Vuonna 2013 kaikki lähti WordPress-verkkosivuista ja ne ovat edelleenkin kaiken keskiössä. Kymmenettä vuotta juhlitaan 22.5.2023. Tämä on ollut hieno matka ja matka voi vain jatkua. Laiva seilaa eteenpäin omaa kulkuaan. Niin, mites se perinteinen kysymys, “Tässäkö Suomen paras digitoimisto”? Visiomme on, että olisimme Suomen halutuin ja tunnetuin, joka ei vielä suinkaan tarkoita parasta. Parhaamme yritetään ja sen on riitettävä. Paremmuudella on vaikea kilpailla, se kun on subjektiivista. Tärkeintä on, että asiakas saa työllämme merkittävää kilpailuetua ja arvoa. Loppusanat Tähtäämme jatkossakin maanläheisyyteen, hyvään hinta-laatusuhteeseen ja parhaan asiakaskokemuksen tarjoamiseen. Nähdään kymmenvuotisbileissä! Yritys digitoimisto dude oykuulumisetliiketoimintaliikevaihtorahataloustilinpäätösyrittäminenyritys"
