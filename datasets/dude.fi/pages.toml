["https://www.dude.fi/verkkosivut-ja-hankintakonsultti"]
title = "Hankintakonsultti varmistamassa verkkosivuprojektin sujuvuus"
description = "Taloa ei rakenneta ilman pääsuunnittelijaa. Miksi verkkosivuissa ei voisi olla samaan tapaan apuna konsultti?"
full_description = "Kirjoittanut Timi Wahalahti Konsultilla on sanana ehkä hieman ikävä klangi. Monelle tulee varmasti ensimmäisenä mielikuva isoja laskuja lähettävistä hepuista jotka istuvat palavereissa toistelemassa samoja mantroja, itsestäänselvyyksiä tai ympäripyöreyksiä joista ei ole mitään iloa. Tuollaisena ainakin itse näin konsultit joskus. Vuosien varrella mielikuva on kuitenkin haihtunut, kun olen todistanut aitiopaikalta sen, miten hyödyllinen hankintakonsultti voi olla asiakkaalle varsinkin rahallisesti isommissa sekä suurempien organisaatioiden toteuttamissa verkkopalveluprojekteissa. Verkkosivuston uudistamisessa hyvällä suunnittelulla pääsee jo pitkälle, joten siihen kannattaa panostaa ja konsultin apu on tullut tässä usein kultaakin arvokkaammaksi. Jos huomaat palaavasi pohtimaan tai juuttuvasi sivustouudistuksen alkumetreillä seuraaviin asioihin, kannattaa harkita hankintakonsultin ottamista mukaan: Uudistuksen syy ja tavoitteet ei ole ihan kirkkaat edes omassa mielessäEt ole varma mitä ominaisuuksia ja toiminnallisuuksia sivustolla on tällä hetkelläUuden sivuston tarpeet tuntuu hankalilta hahmottaaTarjouspyyntö jää laihaksi sekä ilman konkreettisia vaatimuksistaEpävarmuus siitä, ketä kaikki omasta organisaatioista pitäisi osallistaa uudistukseenPotentiaalisten toimittajien etsiminen, kontaktoiminen tai arviointi kauhistuttaa jo ajatuksenakinOman käytettävissä olevan ajan määrä epäilyttää Onko hankintakonsultti hopealuoti kaikille? Ei konsultin palkkaaminen aina ole hopealuoti kaikille. Organisaatiolla voi olla jo sen verran selkeät ajatukset sekä suuntaviivat uudistuksen tarpeista, kokemusta verkkopalveluprojekteista ja tarpeeksi resursseja käytettävissä sujuvaan läpivientiin kilpailutuksesta jatkokehitykseen saakka. Tuleva sivusto ja projekti voi olla sen verran pieniä, että konsultti haukkaisi karhunosan käytettävissä olevasta budjetista. Edellä mainituissa tilanteissa konsultin käyttämisen sijaan kannattaa valita kumppaniksi sellainen digitoimisto, jolla on prosessit kunnossa ja joka tarjoaa koko paletin näkemyksestä, visuaalisesta suunnnittelusta ja laadukkaasta teknisestä toteutuksesta aina jatkokehitykseen. Jos tiedät jo tässä kohtaa että hankintakonsultti saattaa olla verkkosivustoprojektiisi hieman liikaa, pistä meille viestiä niin käynnistetään seuraavan verkkosivustosi rakentaminen yhdessä. Jos hankintakonsultin projektiin mukanaan tuomat hyödyt kiinnostavat edes hieman, jatka lukemista. Lopusta löydät myös henkilökohtaiset suositukseni konsulteista, joihin ottaa yhteyttä suunnitellessa sivustouudistusta. Hankintakonsultin avulla löytyy piilevätkin tarpeet ja uudistus saadaan tehokkaasti käyntiin Klassinen “uudistetaan sivusto koska edellisestä kerrasta on jo sen verran pitkä aika” voi olla ihan oikea syy sivustouudistukselle. Usein kuitenkin hetken pysähtymisellä ja pienellä pohdinnalla löytyy muitakin syitä ja niiden myötä tavoitteita sekä tarpeita. Näiden ajatusten herättelyssä sekä piiloistaan kaivamisessa asiansa osaava hankintakonsultti on parhaimmillaan. Meillä jokainen projekti käynnistyy aloitustyöpajalla jossa näitä piileviä syitä sekä tarpeita kaivetaan esiin. Tuo osio käydään läpi kaikkien kanssa, ja sen tärkeys korostuu etenkin jos tarjouspyyntövaiheessa ei ole ollut mukana konsulttia. Jos asioita on kuitenkin pureksittu osaavan hankintakonsultin kanssa ennen projektin alkua, voidaan työpajassa keskittyä enemmän konkretiaan, selkeät suuntaviivat syntyvät helpommin ja päästään jopa speksaamaan yksittäisiä toiminnallisuuksia tarkemmin. Hankintakonsultin kanssa käydyt keskustelut tai parhaimmillaan jopa jo vuosia jatkunut yhteistyö auttaa asiakkaan toiminnan luonteen, tarpeiden sekä toiveiden sanoittamisessa. Asiakkaan ei tarvitse stressata kaikkien yksityiskohtien mainitsemisesta, kun konsultti pitää huolen olennaisten asioiden kertomisesta ja toimii tarvittaessa tulkkina tilanteessa jossa asiakas ei osaakaan kuvata tiettyä toivetta kovin tarkkaan. Harmillisen usein kuulee tarinoita uudistuksista, joissa ei ole ollut mukana hankintakonsulttia ja verkkosivuston toteuttaja tekee vain työtä käskettyä haastamatta asiakasta tai kyselemättä tarpeista tarkemmin. Tälläisellä tavalla uudistetut sivustot päätyvät helposti jo parin vuoden päästä roskakoriin, koska toteutetut toiminnallisuudet eivät vastaakaan enää tarpeita tai eivät ehkä ole koskaan vastanneetkaan. Toimivampi tarjouspyyntöprosessi Hyvä hankintakonsultti osaa kirjoittaa selkeän sekä kattavan tarjouspyynnön, jossa on kuvattu verkkopalvelun uudistuksen tavoitteet sekä tulevat toiminnallisuudet ja ominaisuudet tarpeeksi kattavasti. Koska kukaan ei tykkää yllätyksistä laskussa, Duden filosofiaan kuuluu kertoa potentiaaliselle asiakkaalle selkeitä könttähintoja summittaisten työmäärä- tai hinta-arvioiden sijaan. Kun tarjouksessa on määritelty sivuston tarpeita selkeästi, on suhteellisen tarkan hintalapun antaminen jo keskustelujen alkuvaiheilla huomattavasti helpompaa. Hankintakonsultti tuntee myöskin alan ja hänellä on näköalapaikka potentiaalisten toimittajien kentälle. Asiakkaan ei tarvitse olla kymmenien eri firmojen kanssa jutuissa, sillä tyypillisesti konsultti valikoi kokemuksensa perusteella tiiviin paketin projektiin parhaiten soveltuvia toimittajia joista jokainen on hieman erityyppinen yritys. Päätöksenteon hetkellä tarjolla voi olla hankintakonsultin ansiosta paletti laadukkaita tarjouksia joista valita toimittaja, jonka kanssa meiningit osuu parhaiten yksiin. Hän tarjoaa myös puolueetonta näkökulmaa tarjousten tulkitsemiseen ja hankintapäätöksen tueksi. Hankintakonsultti mukana projektissa Edellä on kuvattu pitkälti hankintakonsultin roolia. Tyypillisesti kuitenkin varsinkin isommissa projekteissa konsultti kannattaa pitää mukana koko projektin ajan. Verkkosivustoprojektin aikana konsultin rooli on tyypillisesti varmistaa, että asiat etenevät sovitulla mallilla ja tehdyt ratkaisut ovat sellaisia jotka vievät asiakasta kohti tavoitteitaan. Eli toisin sanoen, hän pitää asiakkaan puolia loppuun saakka. Asiakkaalle konsultti tarjoaa lisävarmuuden siitä, että toteuttajan lisäksi toinen ammattilainen testaa sekä tarkistaa lopullista sivustoa ennen sen julkaisua. Toki konsultti toimii myös oivana välikätenä, jos suhde toteuttajaan ei toimikkaan ihan täydellisesti jostain syystä. Oman kokemuksen perusteella konsulttien ei ole kuitenkaan oikeastaan koskaan tarvinnut pitää asiakkaan puolia, koska meillä toimintakulttuuriin kuuluu asiakkaan kuunteleminen sekä tarkoituksenmukaisten ratkaisujen löytäminen sekä toteuttaminen. Ei lähdetä kikkailemaan turhaan kasvattaaksemme loppulaskua tai menemään siitä mistä aita on matalin kahisevan kiilto silmissä. Koska jokainen projekti on meille yhtä tärkeä ja halutaan, että voidaan olla ylpeitä tehdyistä sivustoista, konsultin rooli meidän kanssa toimiessa on välittää olennaista tietoa, auttaa käynnistämään keskusteluja oikeiden tahojen kanssa esimerkiksi integraatioihin liittyen sekä olla tukena määrittelemässä ja tarkentamassa toiminnallisuuksia kun työ etenee. Kiireinen tai pienillä henkilöresursseilla pelaava asiakas saattaa toisinaan valtuuttaa konsultin tekemään tarvittavia päätöksiä, jotta sovittu aikataulu ei pääsisi venähtämään. Miten tunnistaa osaavan hankintakonsultin? Tykkään ajatella niin, että asiansa osaava hankintakonsultti on tyypillisesti työskennellyt alalla aiemmin toteutuksia tarjoavassa yrityksessä tai ollut useammassa sivustouudistuksen toteuttaneessa organisaatiossa avainasemassa. Kun konsultilla on kattavaa käytännön kokemusta vastapuolella toimimisesta, tietää hän tyypilliset sudenkuopat, tuntee alan toimintatavat sekä termistön ja on kartalla parhaimmista toteuttajista sekä teknologioista. Selvitä ja kysele hankintakonsulttia valitessa, minkälaisella taustalla hän on päätynyt auttamaan muita viemään verkkopalveluprojekteja onnistuneesti läpi. Omat suositukset verkkosivuston uudistuksen läpiviennissä apuja kaipaaville ovat Kukonlaulu, North Patrol sekä Rubic. Mainittujen yritysten tinkimättömästä osaamisesta sekä asiakkaan edun tärkeimpänä asiana pitämisestä uskallan mennä takuuseen. Jatkolukemisena kannattaa kurkata North Patrolin “mitä hankintakonsultilta ostetaan?” kirjoitus. Verkkopalveluiden kehitysVerkkosivujen ostaminenVerkkosivujen suunnittelu digitoimisto dude oyhankintakonsulttikukonlaulunorth patrolrubicsivustouudistusverkkosivu-uudistusverkkosivujen suunnitteluverkkosivutweb-kehityswordpress"
