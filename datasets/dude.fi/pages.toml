["https://www.dude.fi/verkkosivut"]
title = "Verkkosivut yritykselle, Digitoimisto Dude, Jyväskylä"
description = "Verkkosivut yritykselle räätälöidysti WordPressillä, se on se meidän juttu. Jos haluat hyvää palvelua ja nopeat sivut, ota yhteyttä!"
full_description = "Verkkosivut yritykselle Näyttävät, nopeat ja käyttäjäystävälliset verkkosivut Teemme netistä nätimpää ja toimivampaa verkkosivusto kerrallaan. Haluamme yllättää asiakkaamme ja näyttää, että digitoimiston kanssa työskentely voi olla muutakin kuin itkua ja epämääräistä laskutusta. Mitä saat meiltä? Me teemme verkkosivuja yritykselle palveluna. Tämä tarkoittaa sitä, että suunnittelemme, koodaamme ja julkaisemme sivut yhdessä asiakkaan kanssa. Tarjoamme toteutuksen lisäksi verkkosivuille korkean laadun palvelintilan osana maankuulua ylläpitopakettiame. WordPress-verkkosivut WooCommerce-verkkokaupat Verkkopalvelut Verkkolehdet Integraatiot WordPress-lisäosat Saavutettavuusosaaminen Hakukoneoptimointi UI/UX-suunnittelu Jatkokehitys Käyttötuki Ylläpito ja hosting Asiakkaamme kertovat Onnistuimme yhdessä toteuttamaan projektin yhdistämällä palvelusuunnittelun sekä ketterän kehityksen. Jani Ojala, kehitysjohtaja yrityksestä Kiinteistölehti Dude toteutti meille freesit ja hyvin toimivat verkkosivut. Sivut ovat ennen kaikkea supernopeat latausnopeudeltaan! Tomi Kokkola, commercial officer yrityksestä UpCloud Viides verkkosivuprojekti johon olen osallistunut urani aikana, ja tämä oli niistä paras. Kiitokset siitä kuuluvat osaltanne teille, hyvää duunia! 👍 Arto Nieminen, digital marketing manager yrityksestä Gofore Rakenteen ja ulkoasun suunnittelu oli vaikuttavaa, teknisessä toteutuksessa saimme juuri sitä, mitä toivoimmekin ja vähän ylikin. Kaikki sujui mutkattomasti. Pirjo Hauvala, apulaisrehtori yrityksestä Valkeakosken seudun koulutuskuntayhtymä Timanttisen yhteistyön tuloksena saimme upeat, brändimme mukaiset ja helposti käytettävät sivut. Dude toimittaa! Minna Haarala, markkinointi ja brändi yrityksestä Probot Dude pystyi toteuttamaan kaikki sivustouudistukselle asetetut tavoitteet, osan jopa paremmin kuin uskalsimme toivoa. Hanna Väisänen, markkinointipäällikkö yrityksestä Otava Oppimisen palvelut Duden kanssa homma sujuikin kuin tanssia vain, ja täysin vailla stressiä. En ollut osannut aavistaa, että kotisivujen uusiminen voisi olla myös kivaa. Sofi Oksanen, kirjailija yrityksestä Sofioksanen.fi Aikataulu piti, budjetissa pysyttiin ja yhteistyö oli ammattimaista ja luontevaa. Lämmin suosituksemme! Ilona Niinikangas, museonjohtaja yrityksestä Helinä Rautavaaran museo Nettisivu on äärettömän nopea, kävin julkaisun jälkeen kaikki meidän kilpailijat läpi ja kukaan ei pärjännyt meille nopeudessa. Matti Hirvonen, ceo & senior consultant yrityksestä Mediashake Eepoksen historiassa nettisivujen päivitys ei suoraan sanottuna ole koskaan ollut näin yksinkertaista ja miellyttävää. Tuomas Oksanen, toimitusjohtaja yrityksestä Eepos-oppilaitoshallinta Lopputulos on erittäin käyttäjäystävällinen, näyttää hyvältä ja täyttää ne tavoitteet, jotka uusille verkkosivuillemme alussa asetettiin. Jenni Manninen, viestintä- ja markkinointipäällikkö yrityksestä Koulutuskuntayhtymä Tavastia Rakenteen ja ulkoasun suunnittelu oli ensiluokkaista, teknisessä toteutuksessa saimme enemmän kuin olimme uskaltaneet unelmoida. Hanna-Leena Soisalo, tiedotus- ja markkinointivastaava yrityksestä Atena Sivujen ulkoasu ja tekninen toteutus ylittivät odotuksemme. Maarik Leppä, tuottaja, asiakkuudet yrityksestä Flux Productions Uusi saittimme on täynnä näppäriä, selkeitä ja hyvin skaalautuvia ratkaisuja. Letkeässä ja sujuvassa yhteistyössä sivuston rakentaminen oli ilo antaa Duden käsiin. Virpi Blom, web & cms expert, partner yrityksestä North Patrol Duden käsissä uusi ilmeemme taittui näyttäväksi ja käytettäväksi saitiksi, jota on modulaarisuutensa vuoksi helppo pitää ajan tasalla. Jarkko Rytkönen, project leaderi yrityksestä Bitwise Sivuja on helppo itse päivittää ja ne toimivat erittäin nopeasti. Vahva suositus siis muillekin Duden palveluita harkitseville! Juha Sillanpää, myyntijohtaja yrityksestä Miseva Nyt on Redanredan Oy:n sivut kuosissa. Hyvässä, nätissä ja modernissa kuosissa. Linda Saukko-Rauta, yrittäjä yrityksestä Redanredan Hämeen keskiaikafestivaalin uusi sivusto on kerännyt asiakkailtamme rutkasti kehuja – kiitos Duden. Katleena Kortesuo, yhdistyksen puheenjohtaja yrityksestä Hämeen keskiaikafestivaali Erityiskiitos siitä, että sivun päivittäminen on tehty idioottivarmaksi ja kaikki on tarkasti merkattu, että tiedän mikä teksti tai kuvan vaihtaminen vaikuttaa mihinkin. Emmi Virtanen, yrittäjä yrityksestä By Emmi Nopeaa toimintaa, vahvaa tekemistä, ketterää reagointia ja hurttia huumoria – niistä on yhteistyö Dudelaisten kanssa tehty. Tanja Uusitalo, viestintäpäällikkö yrityksestä Lounais-Hämeen koulutuskuntayhtymä Selkeät ja helppokäyttöiset sivut niin ylläpitäjille kuin käyttäjille. Palautetta tullut sivuston toimivuudesta sekä visuaalisesti näyttävästä ilmeestä. Markku Lahtinen, it-asiantuntija yrityksestä Padasjoen kunta Duden tiimin kanssa kommunikointi oli helppoa ja suoraa, mikä oli meille erityisen tärkeää. Pystyimmekin toteuttamaan projektin huomattavan ketterästi, ennakoiden myös tulevaa. Mika Savela, editor-in-chief yrityksestä Arkkitehti-lehti Duden porukka onnistui luomaan meille sopivan visuaalisen ilmeen ja pienet sivulausevihjeetkin oli osattu ottaa huomioon. Saila Innanen, myyntipäällikkö yrityksestä Berner ammattinurmikot Dude on suhtautunut asiakkaan lukuisiin toiveisiin ja tarpeisiin kiitettävällä joustavuudella ja järjestelmällisyydellä. Pauli Salokangas, päätoimittaja yrityksestä Caravan-lehti Dudelaisten kanssa on helppo tehdä yhteistyötä ja projekti sujui todella mallikkaasti alusta loppuun saakka. Tommi Karvinen, head of seo & cro yrityksestä Tulos Yhteistyö sujui mukavasti ja rennosti, ja aikataulu ja budjetti pysyivät hyvin. Sanna-Maaria Tornivaara, viestintäpäällikkö yrityksestä Suomen Kustannusyhdistys Tämä on ollut yksi hienoimmista projekteista tähän saakka omalla työurallani. Pekka Hyvärinen, kasvujohtaja yrityksestä Tahto Group Dude ei tyydy vain toteuttamaan asiakkaan toiveita vaan haastaa tätä pohtimaan parhaita ratkaisuja ja tuo toisaalta pöytään myös omia ideoitaan. Pauli Salokangas, editor-in-chief yrityksestä Leirintäopas Dudella hommat osataan hoitaa niin, että turha jäykkyys loistaa poissaolollaan, mutta samaan aikaan kaikki on ammattimaista. Joni Rahunen, markkinointi yrityksestä Kata Safety Rento, mutta asiallinen ja asiantunteva ote sekä työn jälki on vakuuttanut alusta asti. Nopea reagointi ja apu asiassa kuin asiassa ovat myös ehdottomia plussia. Pasi Kokkinen, markkinointi yrityksestä Black Bruin Miksi valita Dude + WordPress? Lupaukset pidetään Verkkosivuston hankinnassa on mitä suurimmassa määrin kyse luottamuksesta. Toimittaja tekee mitä on sovittu, toimittaa silloin kun on sovittu ja laskuttaa summan joka sovittu. Tämä on meille kunnia-asia, haluamme nukkua yömme rauhassa. Hinta-laatu Projektin hinta pysyy maltillisena ja jatkokehitys on kustannustehokasta, kun koko pyörää ei tarvitse keksiä uudestaan vaan varustelutasoa voidaan kasvattaa helposti myöhemmin. Ympäristöystävällisyys Duden palvelimet pyörivät sertifioidusti 100% tuulivoimalla. Arvomme ovat vihreät, eli emme tuhlaa energiaa. Duden asiakkaana olet ympäristöystävällinen ja tuet suomalaista työtä. Läpinäkyvyys Kun puhumme läpinäkyvyydestä, se ei ole pelkkää lätinää. Olemme oikeasti avoin niin yrityksen toimintamallien kuin koodinkin puolesta. GitHubista löytyy läjäpäin avointa vapaasti käytettävää koodia ja olemme avanneet liiketoiminnan numerot palkkoja myöten blogissamme. Firman digitaalista ohjekirjaa on myös julkaistu 100% julkisena alusta asti osoitteessa handbook.dude.fi. Rasvattu projektinhallinta Olemme miettineet projektin läpiviennin tarkoin. Räätälöimme teitä varten aloitustyöpajan, jaamme projektin selkeisiin vaiheisiin, kutsumme teidät läpinäkyvään projektityökaluumme ja nimeämme teille jämäkän projektipäällikön. Näiden avulla takaamme onnistuneen projektin. WordPress-edelläkävijä Olemme keskittyneet vuodesta 2013 pelkästään WordPress-verkkopalvelujen toteutuksiin ja olleet mukana kehittämässä itse WordPressiä, sen lisäosia ja yhteisöä. Osallistumme aktiviisesti myös WordPress-yhteisön tapahtumien järjestämiseen. Tunnemme hyvin WordPressin sielunelämän ja osaamme hyödyntää sen koko potentiaalin. Kehittyminen Koko tiimi seuraa aktiivisesti oman alansa työkalujen ja toimintaympäristön kehitystä. Kehitämme ja jaamme myös omia työkalujamme GitHubissa. Tykkäämme pysyä kehityksen kärjessä ja se näkyy myös työn laadussa. Helppokäyttöisyys Duden toteuttaman hallintapaneelin opettelu on nopeaa ja käyttö suoraviivaista. Teemme WordPressin ylläpitonäkymästä niin helpon, että mummokin osaa käyttää sitä. Turvallinen ja tuettu alusta WordPressin kehittämiseen osallistuvat sadat avoimen lähdekoodin puolestapuhujat ja myös me olemme osaltamme tekemässä WP:stä entistä parempaa. Olemme paneutuneet erityisesti hyviin käytäntöihin ja tietoturvaan. WordPressiä on meiltä turvallista ostaa. Toteuttamiamme verkkosivuja Koulutuskuntayhtymä Tavastia – Joustava sivustokokonaisuus koulutuskuntayhtymälle design integraatio multisite verkkosivut ylläpito Suomen Kustannusyhdistys – Vanhan ja arvostetun yhdistyksen sivusto nykyaikaiseksi design verkkosivut ylläpito Katso lisää töitämme Projektinne sisältää kaiken tämän 1 Aloitustyöpaja Räätälöimme teitä varten aloitustyöpajan, joka on loistava tapa tutustua yritykseesi ja aloittaa hedelmällinen yhteistyö. Tutustuminen Yhteisten tavoitteiden määrittely Sivukartta Projektin vaiheistaminen ja suuntaviivojen asettaminen Projektityökalun käyttöönotto 2 Suunnittelu Suunnittelemme verkkosivut huolella aina loppukäyttäjä mielessä. Ideointi ja määrittely Verkkosivuston käyttöliittymäsuunnittelu Tarvittavat iteraatiokierrokset 3 Tekninen toteutus Toteutamme kaikki WordPress-sivustomme räätälöidysti noudattaen alan tuoreimpia tekniikoita ja standardeja. WordPress-kehitys paikallisessa kehitysympäristössä Moderni, tehokas ja ketterä kehitysmalli Nykyaikainen front-end suunnittelu WordPress-standardien mukainen back-end-kehitys 4 Sisällönsyöttö ja käyttöönotto-testaus Aloitamme sivuston testaamisen hyvissä ajoin heti kun sivusto on siinä pisteessä, että hallintapaneeliin pääsee kirjautumaan. Väliaikainen testiympäristö Vanhan sisällön siirto Kattava testaus oikeilla sisällöillä Viimeistely ja hiominen julkaisukuntoon 5 Koulutus Sivuston valmistuessa pidämme huolen siitä, että osaatte käyttää verkkosivuja. Näytämme miten sivusto toimii Autamme hallintapaneelin käyttämisessä 6 Julkaisu Kun prosessi on selkeästi mietitty ja tarkistuslistat kunnossa, jokainen julkaisu sujuu kuin tanssi. Verkkotunnukset ja nimipalvelin Tarvittavat uudelleenohjaukset Sivuston optimointi julkaisuversioon 7 Ylläpito ja asiakastuki Duden ylläpidossa verkkopalvelunne saa ansaitsemansa kodin. Pienet muutostyöt WordPress-päivitykset kaksi kertaa viikossa Päivittäinen varmuuskopiointi Tietoturvallinen ja suorituskykyinen WordPress-optimoitu palvelin Tekninen tuki Toimivuuden valvonta 8 Jatkokehitys Pyörivä sivusto ei sammaloidu, varsinkaan silloin kun siitä pitää säännöllisesti huolta. Uudet ominaisuudet toiveiden mukaan Muuttuvat tarpeet ajan saatossa 9 Kuulostaako hyvälle? Onnistuneen verkkosivustoprojektin takaa hyvä suunnittelu, joka lähtee tavoitteiden määrittämisellä. Jos prosessimme miellytti ja haluat kuulla lisää, ole ihmeessä yhteyksissä! Aloitetaan projektisi? Hyvä tietää Paljonko maksaa? Kauanko kestää? Lue ohesta usein kysytyt kysymykset verkkosivuista. Kannattaa katsoa myös vuonna 2021 järjestetty Ask Me Anything kysymyspalsta. Miten toteutatte verkkosivut asiakkaalle? Toteutamme verkkosivut räätälöitynä asiakkaan yksilöllisiin tarpeisiin. Valmisteemat eivät tule kyseeseen, vaan asiakkaamme saavat aina juuri heitä varten suunnitellun visuaalisen ilmeen ja teknisen toteutuksen. Duden toteuttaman sivuston kanssa on helppo elää ja kasvaa vuosia eteenpäin. Sivuston kaikki sisältö kuvia myöten on asiakkaan itse helposti päivitettävissä. Blogista löytyy kosolti lisää tietoa tavoistamme toimia: Nopeasti latautuvat verkkosivut ovat tätä päivää – Latausnopeuden optimointi käytännössä Duden WordPress-hallintapaneelin avulla verkkosivujen päivittäminen sujuu kuin tanssi Sano ei pagebuildereille – katso miltä näyttää Duden räätälöity WordPress-hallintapaneeli Näin toteutetaan nopea ja käyttäjiä palveleva haku WordPress-sivustolle Paremmat verkkosivut jatkuvan kehityksen kautta Millaisia toteutuksia olette tehneet? Takataskusta löytyy muun muassa Kansainvälisten yritysten sivustoja, jossa liidit tippuvat suoraan markkinoinnin automaatioon Tuote-esittelysivustoja monipuolisilla hakutoiminnoilla Markkinointisivustoja Blogeja pienellä twistillä Verkkolehtiä jotka tukevat artikkelien tyyliä Käyttäjän sijaintiin perustuvia karttapalveluita Vuokraus- ja myyntiartikkeleita listaavia palveluita Intranet-toteutuksia järjestöjen sisäiseen viestintään ja julkisten tietojen päivittämiseen Keskisuuria verkkokauppatoteutuksia Mielessä vähän suurempi savotta? Verkkolehti? Verkkokauppa? Kirjautumisen takana olevat sisällöt? Käyttäjien kanssa vuorovaikuttava kokonaisuus? Tai jotain ihan muuta? Onnistuu! WordPress ei ole pelkästään alusta verkkosivuille. Kun tietää mitä tekee, saa sen taipumaan myös isompien projektien tarpeisiin kustannustehokkaasti ja pakettina joka kasvaa näppärästi verkkopalvelun mukana. Kysy lisää! Entä integraatiot verkkosivuille? Jos löytyy rajapinta, sen voi integroida! Useilla yrityksillä on nykyään useampi erillinen järjestelmä, joista ainakin yhden integroiminen on tarpeellista ja viisasta. Saman tiedon kahdessa paikassa ylläpitämisestä päästään eroon ja prosesseista saadaan käyttäjälle yhtenäisempiä kokemuksia. Olemme toteuttaneet lukuisia erilaisia integraatioita ja hieman huonompikin rajapinta taipuu meidän käsissä. Olemme toteuttaneet integraatioita mm. seuraaviin: Likeit, Opintopolku, Vitec Avoine, Procountor, Visma InSchool Primus, HubSpot, STT, Paytrail, MS Graph, Nettix Pro, Recruitee, Salesforce, Autosofta, Tixly, TimeCMS, Doerz, Hellewi. Esimerkkejä toteuttamistamme integraatioista: Sisältöjen (esimerkiksi tuotetietojen) tuonti sekä päivitys ulkopuolisesta järjestelmästä Tietojen lähettäminen ja päivitys ulkopuoliseen järjestelmään (esimerkiksi lomakkeista) Verkkopalvelun oman rajapinnan toteuttaminen, jota muut voivat hyödyntää Kirjautumiset ulkopuolisista järjestelmistä (SSO) Haluamme aina ylittää itsemme sekä yllättää asiakkaamme. Kun asiakas tuntee saaneensa enemmän kuin alun perin tilasikaan, olemme onnistuneet. WordPress ei ole pelkästään alusta verkkosivuille. Kun tietää mitä tekee, saa sen taipumaan myös isompien projektien tarpeisiin kustannustehokkaasti ja pakettina joka kasvaa näppärästi verkkopalvelun mukana. Kysy lisää! Mihin verkkosivujen hinta pohjautuu? Kyllähän tässä työtunneista puhutaan. Mitä enemmän toiveita asiakkaalla, sitä enemmän tunteja meillä menee niiden toteuttamiseen. Tunteja projektiin uppoaa yleensä 100-300 tuntia projektin laajuudesta riippuen. Tunnit sisältävät kaikenkattavan aloitustyöpajan, materiaalin koostamista ja siihen perehtymistä sekä asiakkaaseen, kilpailijoihin ja toimialaan tutus"
