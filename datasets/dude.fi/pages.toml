title = "Duden pieni talouskatsaus 2017 - Talous - Digitoimisto Dude Oy"
description = "Digitoimisto Dude Oy:n toimitusjohtajan näkökulmasta Duden talouden kehitys 2014-2017 ja ajatuksia tulevasta."
full_description = "Kirjoittanut Kristian Hohkavaara Jo klassikoksi muodostunut blogaus Digitoimisto Dude: Ruumiinavaus 2016 aloitti perinteen, jossa avaamme yrityksemme toimintaa perusteellisemmin. Tällä kertaa täytyy rehellisesti myöntää, että joitain kuukausia sitten päättyneen tilikautemme läpikäyntiin ei ole ihan samanlaisia paukkuja. Toisaalta myöskään moni ko. blogauksessa mainittu asia ei ole muuttunut, joten valotetaan tässä tekstissä mennyttä tilikautta ainoastaan talouden osalta. Laitetaanpa alkuun luvut pöytään: Duden talouden kehitys 2014-2017. Lähde: asiakastieto.fi Vaikka saimme liikevaihtoon pientä kasvua, tuloksemme sukelsi Titanicin lailla – perseelleen meni että pätkähti. Konkurssihakemus vetämään, roskiin koko firma? Ehkä ei kuitenkaan Edellinen tilikausi oli ehdottomasti Duden haastavin. Ensimmäisen työntekijän palkkaukseen liittyvät kustannukset yllättivät meidät ja toisaalta emme myöskään tarkastelleet kovin kriittisesti rahasummaa, jonka työntekijä tuo taloon. Vuoteen mahtui myös jonkin verran pitkittyneitä projekteja, jotka söivät miestä mutta myös tulosta. Myös palvelumme Admin Labsin kehitystyö vaati osansa. Kärsimme edellisen tilikauden ensimmäisellä puoliskolla myös siitä, että oma viestintämme oli edelleen suunnattu väärälle asiakassegmentille, koska tiimimme ja osaamisemme oli jo vähän huomaamattakin kasvanut vastaamaan hieman isompien asiakkaiden tarpeita. Tämän ongelman onnistuimme ratkaisemaan uudistamalla omat sivumme, jolloin kirjoitimme myös omaa markkinointiviestiämme kovalla kädellä uusiksi. Niin paljon kuin pienistä yrityksistä pidämmekin, niin palvelumme ja osaamisemme on ehdottomasti paremmassa käytössä isompien kanssa, jotka arvostavat palvelua, jatkuvaa suhdetta ja erittäin räätälöityä lopputulosta. Tämä tilikausi onkin alkanut huomattavasti paremmissa merkeissä ja toivon mukaan pääsemme vuoden päästä esittelemään hieman korkeampia liikevaihto- ja tulospylväitä. Mut hei, tällaista on business. Yritys digitoimisto dude oydudekuulumisetliiketoimintaliikevaihtoläpinäkyvyysmainostoimisto jyväskylätaloustulosyrittäminenyritys"
