["https://www.dude.fi/dude-on-15-osaajan-yritys-vuonna-2024"]
title = "Katsaus liiketoimintaan: Dude on 15 osaajan yritys vuonna 2024"
description = "Toinen Duden perustajista ja liiketoimintalähtöinen teknologiajohtaja, jolle tärkeintä on että asiakas on tyytyväinen."
full_description = "Kirjoittanut Roni Laukkarinen No niin, keitä Moccamaster-pannullinen kahvia. Tämän tekstin lukemiseen ei riitä yksi kuppi tai edes pannu, vaatii toisenkin. Valmista? Hyvä. Ryyst, ja lukemaan. ☕ Jatko-osaa pukkaa, tai siis tekstin jatko-osaa, sillä eihän nämä kaudet ole mihinkään päättymässäkään – päinvastoin. Tämä kirjoitus on suoraa jatkumoa viime vuoden kevään muistelulle (Dude 10 vuotta – Rolle muistelee osa 4: Taival verkkosivujen toteuttamiskumppanina – Feenikslintu nousee tuhkista, 2019-2023), jossa viimeistelimme silloista tilikautta ja valmistauduimme Duden 10-vuotisjuhliin. Koitetaan pitää tässä jonkinlainen kronologinen tolkku! Dude juhli 10-vuotisjuhliaan Jyväskylän upeimmassa tapahtumatilassa PK5:ssa Kankaalla syyskuussa 2023 Kutsuimme asiakkaamme, yhteistyökumppanimme ja tietenkin työntekijämme juhlimaan Duden 10-vuotista taivalta syksyllä 2023. Juhlan aikana oli myös pientä haikeutta ilmassa, koska muistelimme menneitä, aikoja, jolloin meitä oli omistajaporukassakin vielä neljä, kun jatkossa on enää alkuperäinen perustajakaksikko jäljellä. Dude sai arvoisensa juhlat, DJ pyöritti levyä, laadukasta ruokaa ja juomaa nauttiin, kaikilla oli kivaa ja juhlat jatkuivat myöhäiseen aamuun asti… Juhan ja Rollen puheen slidet löytyy muuten netistä julkisena osoitteesta slides.dude.fi, kuten open source hengessä pitääkin. Instagramissa myös muisteluita. Eteenpäin… omaan tyyliin! Hyvin pian viime tilikauden startin ja kymppivuotisjuhlien jälkeen lähdimme heti kehittämään yritystä ja toimintaa. Lähdimme edelisen tilikauden (2022-2023) jälkeen tietoisesti kasvattamaan yrityksen osaajamäärää, koska hommaa oli edelleen enemmän kuin ehti tehdä. Meillä oli hyvin tiedossa, mitä tuleman pitää; Tarvitsimme lisää tekijöitä, jotta yrittäjänä ehtisi keskittyä ja panostaa myyntiin ja ratkaisujen kehittämiseen. Tehtiin seuraavat toimenpiteet: Rekryt auki Markkinointikampanja, Coaster hätiin Projektipäällikön palkkaus (saatiin Henkka, jee!) 2-3 uutta kehittäjää (saatiin Nadya, Otto ja William, jee!) 1 kokenut suunnittelija (saatiin Sanna, jee!) Yrittäjät jalat maassa ja pää kylmänä 🥶 Väkeä lisää Vierityspalkki kirjoitti vuonna 2018: Käsityöläiset kasvoivat isoksi: Digitoimisto Dude, jolloin kahden hengen yhtiöstä oli tullut neljän hengen yritys. Kyllä aika rientää. Nyt meitä on karkeasti neljä kertaa silloinen pääluku. Digitoimisto Dude Oy elää vahvaa muutoksen aikaa. Emme ole enää se sama pikkutoimisto, jollaisena aloitimme, vaan työllistämme 15 osaajaa, joista tällä hetkellä 1 on työharjoittelussa. Matka tuntuu jokseekin uskomattomalta, kun on ollut alusta asti mukana. Startissa olimme kahden yrittäjän “dynaaminen duo” parisen vuotta, sitten 3-4 hengen pieni nyrkkipaja vähän pidempään. Henkilöstön kehitys Omaehtoinen rekrytointikampanja oli menestys Panostimme myös rekrytointiprosessiin aivan eri tavalla kuin aikaisemmin. Olimme rohkeita ja teimme rekryilmoituksen täysin omaan tyyliin. Brainstormasin (allekirjoittanut Roni) Juhan kanssa neukkarissa, Juha käveli ympyrää ja minä kirjoittelin ajatuksia ylös. Juha totesi väliin, “Meidän mielestä ripulit kuuluu pyttyyn, ei VSCodeen”, johon tipahdin aivan totaalisesti. Heti seuraava ajatus idean isällä oli, että “ei tätä voi nettiin laittaa”, johon itse totesin: “Todellakin laitetaan”. Joko legacy kyllästyttää? Masinoimme työpaikkailmoituksen itse. Teksti päätyi sellaisenaan työpaikkailmoitukseen ja sai paljon huomiota ja palautetta. Paskat työkalut? Et pääse vaikuttamaan, vaikka tiedät että asioita voisi tehdä järkevämmin tai tehokkaammin? Suljettua koodia? Spagettia? Myllyttääkö johto, myyjät tai markkinointi ja pöydällesi putoaa ihmeellistä ripulia koodattavaksi oudoilla tekniikoilla ja mahdottomalla aikataululla? Kuulostaako yhtään tutulta? Meidän mielestä ripulit kuuluu pyttyyn, ei VSCodeen. Dudella pääset käyttämään Suomen WordPress-skenen parhaita työkaluja, koodaamaan WordPressin standardin mukaista PHP:ta ja Vanilla JS:ää ilman mitään erikoisia frameworkeja, käyttämään alan huippulaitteita (omppuja!) ja ennen kaikkea kehittämään ja kehittymään mukavassa ja sinut huomioon ottavassa kehitysympäristössä. Kehitimme myös rekryprosessia merkittävästi aiemmasta “soitellaan ja jutellaan” -prosessista. Käyttöön tuli core values -arviointi ja viisiprosessinen vaihe, jolloin saatiin tehokkaasti jyvät erotettua akanoista. Rekrykampanjamme sai hyvää palautetta somessa. Voimme tyytyväisenä sanoa, että rekrykampanja oli menestys. Toteutimme rekrytoinnit täysin omin keinoin ilman ulkoisia rekrytointikanavia. Hakemuksia tuli yhteensä yli 100 kpl ja työhaastatteluun pääsi yli 10 osaajaa. Löysimme jokaiseen hakemaamme positioon osaajan, eli fronttidevaajan, pari bäkkidevaajaa, proikkarin ja suunnittelijaan. Omistajuuspohjan ja hallituksen muutokset Ei ole mikään salaisuus, että Janne “Kassavirta” Jääskeläinen on ollut ulkoisena hallituskumppaninamme jo pidempään (PS. käy lukemassa Jannen uunituore kirja, tämä ei ole maksettu mainos, allekirjoittanut Duden Roni mukana kirjassa). Janne on jeesinyt haastavissa ja uusissa tilanteissa, joita sekä hallituksemme, että yrityksemme on kokenut parin viime vuoden aikana. Kiitos Janne! Omistajia Dudella oli aiemmin neljä, nyt vuodenvaihteessa kaksi. Lopulliset kaupat osakkeista tehtiin alkuvuodesta 2024. Lopputuloksena hallituksen puheenjohtajalle ja teknologiajohtajalle Roni Laukkariselle ja toimitusjohtaja Juha Laitiselle, eli alkuperäisille Duden perustajajäsenille jäi taskuun sama omistussuhde kuin yrityksen alkuvaiheilla, eli 50/50. Tavallaan mielenkiintoista ja hurjaa, miten vuosia aikaisemmin eri kontekstissa mietityt Duden Ouroboros-tematiikat brändimateriaaleissa käyvät toteen, kun kymmenen toimintavuoden jälkeen omistajuussuhteissa palattiin alkujuurille. Talous Liikevaihto Dudella on kasvussa kuten pitääkin, uusimmalla tilikaudella 665 000 €. Edellisen tilikauden tulos oli 80 000 plussalla, mutta uusimman tilikauden tulosta painoi alas muutokset omistajuussuhteissa ja henkilöstön kasvu. Tämä oli kuitenkin hyvin ennakoitu ja tiedostettu juttu. Päivittäisen taloudenpidon ja kassavirtalaskelman myötä kasvukivuista kuitenkin päästiin eteenpäin uudelle tilikaudelle ja homma kehittyy entisestään. Kiikarissa siintää tämän kauden 2024-2025 liikevaihtotavoite, jossa tarkoitus on hypätä lähemmäksi miljoonan liikevaihtoluokkaa ja 10 prosentin tulostavoitetta. Kehityskohteet tulevaisuuteen Yrityksen isojen muutosten ja henkilöstön kasvun myötä olemme panostaneet myös sisäiseen kehitykseen eri tavalla kuin aikaisemmin. Kuvankaappaus henkilöstölle järjestetystä keynotesta Dude Kick Offista 6.9.2024. Kehityspuolella (tech stack) tapahtuu mm. seuraavaa Julkisista koodaustandardeistamme on tulossa uusi versio nettiin Kehitysstackin puolelle (GitHub) on tulossa air-blocksin rinnalle uusi Gutenberg-buildtoolimme (tällä hetkellä julkinen alpha) Muut kruununjalokivemme kuten dudestack, air-light ja devpackages saavat myös uudet versiot, jotka ovat syksyn Roadmapilla Kehitämme asioita bi-weeklyissä eteenpäin koko tiimin voimin (72 tehtävää backlogilla) Firman käytänteet ja dokumentointi kehittyy entisestään päivittäin sisäisessä Internal Development -dokumentaatiopankissa Projektinhallinta ja projektien läpivienti Projektipäällikkömme myötä olemme satsanneet erityisesti parempaan projektinhallintaan, roadmapien kehitykseen ja estimaatteihin. Tehostamme tehtäviä ja viestintää ja koko tiimi on ottanut roiman harppauksen projektinhallinnallisiin kehityskohteisiin. Kasvavassa yrityksessä on haasteensa, mutta jo pienillä parannuksilla on iso vaikutus. Design – suunnittelun virtaviivaistaminen Duden suunnittelutiimiltä löytyy suunnitteluosaamista, joka on ajan hermoilla. Jatkossakin verkkosivujen leiskat ja käyttöliittymäsuunnittelun saa saman katon alta. Olemme panostaneet rautalankojen kehittämiseen ja parempaan suunnitteluun niin mobiili- kuin desktop-versioissakin. Keskitymme jatkossakin entistä paremmin laajempaan prototyyppaamiseen ja käyttäjäpolkujen miettimiseen. Olemme saaneet asiakkailta palautetta, että heitä on kuunneltu suunnittelussa. Kun tällaista palautetta saa, voi olla varma että (ainakaan vielä) tekoäly ei tule viemään meiltä hommia. Duden kehityspäivät asiakkaamme Hotelli Alban kokoustiloissa perjantaina 6.9.2024. Loppusanat Dude tulee jatkamaan WordPressin parissa jatkossakin, kuten edellisten reilun 11 vuoden aikana – ei olla pivottaamassa digimarkkinointiin tai HubSpotiin 😃. Tuntuu, että jatkuvasti on vieläkin tällä alalla kehitettävää ja kehittymistä. Dudella tehdään kovasti töitä sen eteen, että pysytään WordPress-osaajien kärkikahinoissa. Ei haluta eikä voida hyytyä tai jämähtää. Tämä ei ole pikajuoksu, vaan maraton. “Pieniä parannuksia”, sanoisi toimitusjohtaja. Syysterveisin Rolle & Juha Yritys digitoimistodigitoimisto dude oydude10vkuulumisetliiketoimintamainostoimisto jyväskylätalousverkkosivujen suunnitteluweb-kehitysyrittäminen"
