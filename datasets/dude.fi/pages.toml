["https://www.dude.fi/digitoimisto-ja-digimarkkinointitoimisto-erot"]
title = "Mitä eroa on digitoimistolla ja digimarkkinointitoimistolla?"
description = "Toinen Duden perustajista ja liiketoimintalähtöinen teknologiajohtaja, jolle tärkeintä on että asiakas on tyytyväinen."
full_description = "Kirjoittanut Roni Laukkarinen Dude mahdollistaa digimarkkinoinnin laadukkailla verkkosivuilla. Dude on digitoimisto, joka on sanana aivan yhtä hähmäinen kuin entisajan mainostoimisto. Sanahan on muodostunut 2000-luvun IT-kuplan myötä periaatteessa sanayhdistelmähirviöstä “digitaalinen mainostoimisto”, mutta ei sinänsä tarkoita yhtään mitään. Ei me tavallaan mitään mainoksia tehdä, mutta sitten taas tavallaan yrityksen verkkosivut ovat yksi iso moderni mainos. Ehkä merkittävin ero perinteisen mainostoimiston välillä on se, että lähtökohtaisesti keskitytään digitaaliseen maailmaan, eikä esimerkiksi ikkunateippauksiin. Kun digitoimistoalan toimistojen sivustoja katsoo, tarjotaan “digitaalisia ratkaisuja”, “digitaalisia käyttäjäkokemuksia”, “digitaalista kasvumarkkinointia”, mitä se sitten ikinä onkaan (en minä ainakaan tiedä, tiedätkö sinä?). Meiltä on kysytty softaa, mobiilisovelluksia ja digimarkkinointia, mutta emme tee näistä mitään. No mitäs sitten? Sitä mitä tässäkin bloggauksessa näet: Verkkosivuja. Kerron kohta tarkemmin. Ihan ensi alkuun on määriteltävä mitä on digimarkkinointi meidän näkökulmasta. Digimarkkinointi on markkinointia netissä Yrittäjät.fi-sivustolla digimarkkinointi määritellään seuraavasti: Digimarkkinointi on markkinoinnin osa, joka keskittyy digitaalisiin kanaviin. Siihen sisältyvät muun muassa yrityksen verkkosivusto, sähköpostimarkkinointi, hakusanamainonta, display- eli bannerimainonta, hakukoneoptimointi ja sosiaalinen media. On siis tavallaan väärin sanoa, että emme tee ollenkaan digimarkkinointia, koska verkkosivut ovat iso osa sitä. Verkkosivut itsessään ovat kuitenkin vain markkinoinnin alusta, perusta, talo, pohja. Se on se paikka, jossa sitä markkinointia ja mainontaa tehdään. Verkkosivut eivät sellaisenaan tee mitään, ellei niitä laita tekemään asioita. Meidän on toimijana helpompi tehdä tämä jako seuraavasti näiden kahden toimialan välillä: Digimarkkinointitoimisto = Hoitaa mm. seuraavia: Google Tag Manager, Google Tag Manager Data Layer, Meta (Facebook) Pixel, maksettu mainonta, Google Ads, Google AdSense, ActiveCampaign, MailChimp, MailerLite, markkinoinnin automaatiot, sosiaalisen median mainonta, chatbotit, laajempi hakukoneoptimointi, sisältömarkkinointi, sisältömarkkinointi, markkinoinnin strategiat…Digitoimisto = Keskiössä (ainakin meillä WP-digitoimistona): WordPress, verkkosivujen käyttöliittymien ja käyttökokemuksen suunnittelu (UI/UX), konversiopisteiden suunnittelu, verkkopalveluiden kehitys, pienkehitys, palvelimet, WordPress-ylläpito, saavutettavuus, käytettävyys, auditoinnit, nopeuden optimointi, hakukoneoptimointi sivuston ehdoilla, kakki verkkosivuihin liittyvä. On tietysti olemassa digitoimistoja, jotka tekevät myös digimarkkinointia ja digimarkkinointitoimistoja, jotka tekevät myös verkkosivuja. Dudella ollaan kuitenkin haluttu keskittyä puhtaasti siihen mitä parhaiten osaamme, eli koko homman ytimeen: Verkkosivuihin. Me teemme siis lyhyesti ja ytimekkäästi: verkkosivuja, eli niiden (visuaalista) UI/UX-suunnittelua, (teknistä) koodaamista ja ylläpitoa ja muita näihin liittyviä käytännön asioita, kuten saavutettavuusauditointeja. Meidän suunnittelemien ja toteuttamien verkkosivujen avulla yrittäjä, yritys ja digimarkkinointitoimisto saavat parhaan mahdollisen alustan mainonnalle. © Joonas Rinta-Kanto, Fok_It Mutta miksi näin? Eikö digimarkkinointi ole koko homman ydin? On ja ei. Tämä on klassinen muna ja kana-kysymys, eli kumpi tulee ensin, verkkosivut vai mainokset? Meidän maailmassa verkkosivut on se koti, koko homman ydin, jota voi sisustaa digimarkkinoinnilla, eikä toisin päin. Jotkin digimarkkinointitoimistot tekevät myös verkkosivuja, perinteisesti ainakin yrityksillä kuten Slogan ja Suomen Digimarkkinointi Oy on verkkosivujen toteutus olleet myös mukana palvelukattausta. Nykyään kasvuhakkerointi ja digimarkkinointi on myös saanut yrityksiä tekemään verkkosivuja, verkkopalveluita ja verkkokauppoja puhtaasti digimarkkinoinnin ehdoilla niin, että alustaksi valitaan alusta asti esimerkiksi HubSpot tai Shopify eikä esimerkiksi WordPress tai WooCommerce. Näin digimarkkinoinnin alusta ja verkkosivut saadaan saman palvelun alle. Tällä tavoin markkinointi määrittää verkkosivutoteutuksen, eikä toisinpäin. Verkkosivun ja CRM:n yhdistäminen on kuitenkin haastava tehtävä ja pahimmillaan hommassa menettää asioita. Markkinoinnin alusta rajaa esimerkiksi integraatiot, toiminnallisuudet ja muuttuvat tarpeet useimmiten kokonaan ulkopuolelle. Alustaa voi olla hankala tai mahdoton vaihtaa myöhemmin, kun koko markkinoinnin rakentaa sen ympärille. WordPress on avointa lähdekoodia ja sen pystyy tarvittaessa räjäyttämään niin pieniin palasiin kuin haluaa. Sama ei päde suljetun SaaS-palvelun kohdalla. Näistä syistä me uskomme vahvasti, että verkkosivut kannattaa toteuttaa ensin WordPressillä skaalautuuvus ja markkinointi silmälläpitäen, sillä toimivilla ja laadukkailla verkkosivuilla voi tehdä parasta mahdollista markkinointia. Asian voi ajatella niin, että lisääkö lautaselle ensin salaatinkastikkeen ja heittää sitten päälle salaatin, vai kärrääkö pihalle ensin huonekalut ja rakentaa seinät näiden ympärille. Voi olla, että tällä tavalla toimittuna soossia ei pääse maistamaan salaatin alta ja seinistä tulee vänkkyrät kun pitää väistellä sohvaa. Digimarkkinoinnilla on väliä Se että emme tarjoa palvelukattauksessamme maksettua Google-mainontaa, Meta-pikseleiden optimointia, Google Discovery-mainontaa tai muuta höttöä, ei tarkoita ettemme pitäisi tätä tärkeänä. Päinvastoin. Olemme Dudella erikoistuneet maanmainioiden verkkosivujen toteuttamiseen, mutta verkkosivujen markkinointi ja boostaaminen on äärettömän tärkeää, jos haluat yrityksenä tehdä lisää kauppaa. Meillä ydintekeminen ei vain ole tällä puolella, sillä digimarkkinointiin löytyy kumppaneita, jotka hoitavat oman tonttinsa vähintään yhtä hyvin kuin me omamme. Kumppanit apuun Usein vallitsee se kaunis ajatus, että kaikki asiat saisi saman katon alta. Joillakin muilla aloilla tämä on helpompi järjestää, mutta etenkin digitoimistoissa se on usein vain se hieno haavekuva. Kun toimiston palvelukattaus levähtää, prosessit kankeutuvat, eikä kaikkea ole mahdollista tehdä hyvin. Sillä on vissi ero, tekeekö toimittaja 1) priimaa Google-mainontaa ja verkkosivuja siinä sivussa, vai 2) priimat verkkosivut ja Google-mainontaa siinä sivussa. Olemme kokeneet, että kaikkien digipalvelujen tilaaminen samasta paikkaa ei ole välttämättä aina se paras vaihtoehto, sillä usein vallitsee perus multitaskaamisen nyrkkisääntö: Yhtä asiaa hyvin tai useampaa keskinkertaisesti. Digimarkkinointi on niin suuri kokonaisuus, että sitä voi olla hankala ympätä verkkosivujen kehitykseen. Siksi kumppaneiden merkitys kasvaa. Dudella homma menee niin, että Tehdään yritykselle verkkosivut, jotka ovat Suomen kovinta laatua. Verkkosivut ja niihin liittyvä kuten ylläpito tulee näin samasta paikasta priimalaadulla. JA tehdään digimarkkinointia kumppanin kanssa. Omassa digimarkkinoinnissamme ollaan luotettu Coasterin hellään huomaan. Coaster on no-bullshit digimarkkinointitoimisto, joka keskittyy hähmäisten bounce rate-prosenttien sijaan siihen millä on bisneksesi kannalta merkitystä, eli lisäämään merkittävästi myyntiä digimarkkinoinnin keinoin.Takataskusta ja asiakaskunnasta löytyy toki muitakin yhteistyökumppaneita kuten Mediashake, Flumenia ja Tulos Helsinki. Yhdessä nämä toimivat niin, että saat 100% kokonaisuuden, verkkosivut kestävät aikaa ja elävät markkinointitarpeiden muuttuessa. Pistetäänkö verkkosivut ensin kuntoon, digimarkkinointi heti perään? Kiinnostaako kattaus? Onko kiikarissa oikeasti parhaat verkkosivut, joiden avulla saat tehtyä digimarkkinointia mahdollisimman joustavasti, skaalautuvasti ja ennen kaikkea myyntiä lisäävästi? Pistä ihmeessä viestiä moro@dude.fi tai soita toimitusjohtajalle numeroon 0400 443 221! Verkkosivujen ostaminen digimarkkinointidigitoimistodigitoimisto dude oymainontamainostoimisto jyväskylämarkkinointisome-markkinointiverkkosivut"
