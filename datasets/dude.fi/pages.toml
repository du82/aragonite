["https://www.dude.fi/aika-uudistaa-verkkosivut-nain-teet-verkkosivu-uudistuksen-oikein"]
title = "Verkkosivujen uudistus ajankohtainen? Näin teet sen oikein"
description = "Verkkosivujen uudistaminen mielessä? Jos sivut jämähtävät paikalleen, kilpailijat menevät ohi. Kisan voittaa parhaat verkkosivut."
full_description = "Kirjoittanut Roni Laukkarinen Netti elää koko ajan. Verkkosivuilta täytyy löytyä tiedot yrityksestä, yhteystiedot ja mielellään jotain mukavaa luettavaa. Kun viimeksi selasit nettisivuja, todennäköisesti viivyit siellä pidempään, mistä sait vastauksen kysymykseesi. Ei ole mikään ihme, että YouTuben ja Wikipedian poistumisprosentit ovat matalia, sivuilla viihdytään sisällön vuoksi. Digitaalisen maailman eläessä ja muuttuessa verkkosivujenkin pitäisi mukautua. Jos sivut jämähtävät paikalleen, kilpailijat menevät kehityksessä ohi. Kisan voittaa tiuhimpaan päivittyvät ja mielenkiintoisimmalta vaikuttavat verkkosivut. Verkkosivuilla on iso rooli brändimielikuvan rakentamisessa, asiakaskokemuksessa ja palvelun tasossa, vaikka sitä ei itse tiedostaisikaan. Firman uskottavuutta syö pelkästään se, että verkkosivut eivät päivity tarpeeksi. Mistä tietää, milloin sivut pitää laittaa uusiksi? Milloin sivustoasi freesattiin viimeksi (pikkupäivityksiä ei lasketa)? Milloin viimeksi sivuston kautta tuli uutta kauppaa? Onko sivuston ilmeen uusimisesta yli kolme vuotta aikaa? Alkaako sivustolla olla teknistä velkaa, löytyykö bugeja enemmän kuin ehditään korjata? Olisiko jo uusia ajatuksia mitä sivustolle voisi keksiä? Onko sivustosi saavutettava, eli kaikki tasavertaisesti huomioon ottava, pystyykö sivustoanne käyttämään sokeat, värisokeat, tarkkaavaisuushäiriöiset? Väheneekö sivustolla liike, jos on henkilökohtaisissa asetuksissa päällä liikkeen rajoittaminen? Noudattaako sivuston värimaailma WCAG-saavutettavuusstandardeja? Onko valikko selattavissa näppäimistön avulla, sulkeutuuko valikot Esc-näppäimellä? Jos jokin näistä pisti miettimään, saattaa olla aika uudistaa verkkosivut! Totuus on se, että nettimaailmassa tapahtuu asioita nopealla syklillä. En väitä, että juuri uudistamasi verkkosivut olisivat vanhentuneet jo alkuunsa, mutta ellei digitoimisto ja verkkosivujen omistaja ole tarkkana, saattaa sivusto rapista yllättävänkin nopeasti. Parin vuoden sisällä on tullut mm. tietosuojasäädökset ja saavutettavuuslaki, jotka yllättivät nettikansan. Web-tekniikka on kehittynyt myös huomattavasti WordPressin saavuttaessa version 5.5, Microsoftin lakkauttaessa Internet Explorerin pysyvästi, JavaScriptin siirtyessä mitä uudempiin tekniikoihin ja selainten ottaessa testiin visuaaliseen tyylittelyyn liittyviä huikeita parannuksia. Valitse hyvä tekijä Netissä on verkkosivuston tekijöitä laidasta laitaan, halvoista ja hyvistä kalliisiin ja huonoihin. Hinta ei ihan heti kerro laadusta. Löytyy parista sadasta tonniin veloittavia yhden miehen tai naisen freelancereita, tuhansista kymppintonniin laskuttavia muutaman hengen digitoimistoja ja kymppitonnista aina sataan tuhanteen euroon pyytäviä keskikokoisia tai isompia yhtiöitä. “Mistä verkkosivut yritykselle?” on ikuisuuskysymys, johon on yhtä paljon vastauksia kuin kysyjiäkin. Olemme aiemmin vastanneet tähän hieman pidemmästi, mutta summataan vielä: Hyvien verkkosivujen toteuttaja: Toteuttaa sivut luotetulle ja suositulle alustalle, kuten WordPressille. Näin voit tehdä paljon itse, tukea löytyy integraatioille, etkä jää loukkuun sivuston kanssa jos asiantuntijayritys syystä tai toisesta ei pääse auttelemaan Osaa hommansa ja se näkyy toteuttajayrityksen omilta sivuilta. Verkkosivujen toteuttajan omat sivut ovat vakuuttavat, sivustolta ei löydy silminnähden bugeja, ne näyttävät hyvältä ja toimivat hyvin ja nopeasti. Kauneus on katsojan silmissä ja joskus suutarin lapsella ei ole kenkiä, mutta yleensä mitä paremmin verkkosivujen tekijätaho on panostanut omiin sivuihinsa, sitä parempi tekijä on kyseessä. Ei ole liian halpa. Vaikka hinta ei suoranaisesti kerro laadusta, väittäisin silti että halvalla ei saa hyvää verkkosivujen maailmassa. Ellet halua heti olla korjauttamassa tai tilaamassa uusia. On proaktiivinen jo heti yhteydenottovaiheessa. Hyvän tekijän tunnistaa siitä, että se vastaa nopeasti ja oikeisiin kysymyksiin, kysyy oikeita kysymykysiä ja antaa jo alkuvaiheessa rahanarvoista tietoa siitä miten kannattaa projektin suhteen edetä. Omaa laadukkaita ja suhteessa toisiinsa erilaisia referenssejä eikä pelkää esitellä vielä uudempia ja alallesi sopivia työnäytteitä, joita ei sivuilta välttämättä löydy. Viimeisimpänä, mutta ei vähäisimpänä hyvän tekijän valinnassa kannattaa plärätä tekijän sivuja, fiilistellä yritystä ja miettiä resonoiko yrityksen meininki ja arvot omaan hommaan. Valmistaudu heittämään vanha sivusto romukoppaan Useimmiten on helpompaa uudistaa koko sivusto kuin kehittää vanhaa, etenkin silloin kun sivuston toteutuksesta on pitkä aika. Vanha sivusto on hyvä olla pohjalla esimerkiksi sisällön suunnittelussa ja uuden sivuston tavoitteiden miettimisessä, mutta esimerkiksi visuaalisiin tai teknisiin ratkaisuihin ei kannata tukeutua liikaa. Usein vanhan sivuston hyvä ominaisuus tai toiminnallisuus saatetaan rakentaa vielä paremmin uusiksi uudelle sivustolle. Liian usein ajatellaan, että päästään vähemmällä vaivalla ja kustannuksilla kun vähän freesataan ja korjataan. Useimmiten se on kuitenkin päinvastoin, sillä tekniikka ja ajatukset elävät ajan mukaan ja silloiseen muottiin pakotettu kokonaisuus ei ehkä ihan taivukaan kaikkeen niin helposti kuin piti. Silloin rupeama syö niin kukkaroa kuin kaikkien motivaatiotakin. Aseta uudistukselle tavoitteet Mitään ei kannata tehdä ilman kunnon tavoitteita. Mieti siis miksi olet uudistamassa verkkosivustoasi. Tavoitteet kannattaa olla realistisia. Vaikka juuri pääsin sanomasta, että vanhan sivuston voisi heittää roskiin, mieti voisitko jatkokehityttää nykyisestä sivustostasi paremman esimerkiksi jonkun tietyn ominaisuuden selkeän miettimisen myötä. Tällaisia voivat olla esimerkiksi toteutusvaiheessa esille tulleet ideat ja ajatukset, joita ei ehditty julkaisuun ottaa mukaan. Rauhassa liikenteeseen Toimiva uudistus ei koskaan tapahdu kiireellä. Varaa verkkosivu-uudistukseen kuukausia aikaa. Aikaa vie todennäköisesti eniten sisällöntuotanto. Jos olet pulassa tekstien ja kuvien kanssa, varmista että sinulla on kumppani, joka auttelee sisällöntuotannossa ja valokuvauksessa, jos digitoimistosi ei sitä tee. Tarjouksia kannattaa pyytää useampi kuukausi ennen sivustouudistusta, jotta kaikilla on aikaa speksata, määritellä, suunnitella, iteroida ja jalostaa ajatuksistasi timangia. Sivustouudistuksen tarpeessa? Ensimmäisissä sivuissa vaaditaan enemmän kokeellisuutta, sillä oikeasti toimivat asiat löytyy ainoastaan kokeilemalla ja testaamalla kun minkäänlaista pohjaa ei entuudestaan löydy. Siksi Dude tykkää sivustouudistuksista, koska hommat eivät lähde ihan täysin tyhjästä. Uutta on mahtavaa luoda kun perustukset on jo rakennettu. Vanhalta sivulta saa dataa ulos myös mm. Hotjarin avulla, joka seuraa kävijän hiiren liikkeitä sivustolla. Voi myös olla, että brändisi ei ole edukseen verkossa niin hyvin mitä kentällä tai apuja tarvittaisiin vanhan ilmeen tuomisessa nykypäivään. Myös vanhojen sivujen kautta saa jalostettua vaivattomasti uutta kun tietää mitä on jo kokeiltu ja mikä ei toiminut, saa perspektiiviä ja oppii aivan eri tavalla kuin tyhjästä uuden luomisessa. Välillä voi rohkeastikin ottaa aivan eri suuntaa kuin koskaan aikaisemmin. Jos sivustouudistus tai vaikkapa kokonaan uuden sivuston perustaminen on ajatuksena, ota rohkeasti yhteyttä! Dudella suunnittelusta vastaa kaksi maailmanluokan suunnittelijaa ja devitiimissä on kolme uraauurtanutta kehittäjää valmiina tekemään sivustostasi seuraava mestariteos. Meille voi soitella numeroon 0400 443 221, pistää projekti käyntiin lomakkeen kautta tai viestitellä meilitse moro@dude.fi. SaavutettavuusVerkkosivujen ostaminenVerkkosivujen suunnittelu digitoimistokotisivujen suunnittelu ja toteutuskotisivut yrityksellesaavutettavuusverkkosivu-uudistusverkkosivujen ostaminenverkkosivujen päivityksetwcag"
