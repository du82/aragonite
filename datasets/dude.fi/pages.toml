["https://www.dude.fi/yritys"]
title = "Digitoimisto Dude Oy, Jyväskylä - Tietoa yrityksestä"
description = "Dude on vuonna 2013 perustettu jyväskyläläinen WordPress-digitoimisto. Tiimimme koostuu kehittäjistä ja suunnittelijoista."
full_description = 'Yritys Rennosti, mutta tosissaan. Dudelle tärkeintä on laatu ja rehellisyys, jotka ohjaavat kaikkea toimintaamme. Mutkaton digitoimisto Olemme WordPress-digitoimisto, jossa yhdistyy pikselintarkka suunnittelu ja rautainen tekninen WordPress-erityisosaaminen. Olemme päättäneet alusta asti keskittyä ainoastaan vahvuuksiimme, joita ovat räätälöityjen WordPress-verkkosivujen suunnittelu ja toteutus sekä brändi-ilmeiden suunnittelu. Et tule saamaan meiltä mitään puolivillaista, koska nämä ovat tarkkaan vaalitut leipälajimme. Dudelle tärkeintä on asiakas ja heti sen perässä kulkee läpinäkyvyys ja rehellisyys, jotka ohjaavat kaikkea toimintaamme. Olemme keskittyneet avoimuuteen niin lähdekoodissa kuin asenteessammekin alusta asti. Sisäänkirjoitettuna mukana kulkee niinsanottu “Dude-henki”, joka näkyy rentona ammattimaisuutena. Missio ja visio Missiomme Suunnittelemme ja toteutamme laadukkaita verkkopalveluja, joiden avulla asiakkaidemme liikevaihto, tulos ja brändin tunnettuus kasvavat. Visiomme Haluamme kasvaa hallitusti Suomen halutuimmaksi ja tunnetuimmaksi WordPress-sivustojen ja verkkopalveluiden suunnittelijaksi ja toteuttajaksi. Läpinäkyvä kaikkiin suuntiin Läpinäkyvyys on kiinteä osa Dude-kulttuuria. Jokainen ihminen ja yritys on erilainen. Uskomme erilaisuuden voimaan ja aidot persoonat ovat rikkaus, jota haluamme vaalia. Aina helppoa? Ei, mutta aina sen arvoista. Epävirallisena iskulauseenamme kulkee yhä Vierityspalkista tuttu “Ole mitä olet”. Meille on tärkeää, ettei yhtenäkään aamuna potuta lähteä töihin. Koska viihdymme työssämme, saamme paljon hyvää aikaan jokaisella rintamalla. Läpinäkyvyys on firmamme ydinarvoja ja se näkyy aina avoimista palkkatiedoista julkaisuihimme GitHubissa. Joko luit operointimanuaalimme? Osa yhteisöä WordPress on avoimen lähdekoodin julkaisujärjestelmä, jota kehitetään yhteisön vapaaehtoistyön voimin. Dude on ollut alusta asti vahvasti mukana WordPressin yhteisön toiminnassa ei ainoastaan koodipuolella, mutta myös esimerkiksi järjestämässä virallisia WordPress Meetuppeja ja WordCampeja Suomessa. Lue lisää koodista ja yhteisöstä Toimintaamme ohjaavat arvot Läpinäkyvyys Teemme tarkkoja, kiinteitä tarjouksia ja tarjoamme vain toteutuksia, jotka tiedämme tekevämme hyvin. Teemme sen minkä lupaamme ja kerromme avoimesti, jos emme ole johonkin toteutuksiiin oikea kumppani. Rehellisyys näkyy toiminnassamme työkaverilta toiselle ja työntekijältä asiakkaalle. Läpinäkyvyys näkyy myös tavassamme tehdä koodia. Laatu Meille laatu tarkoittaa sitä, että jokaiseen uuteen asiakkaaseen tutustutaan huolella. Verkkosivustolle tai -kaupalle suunnitellaan ulkoasu, joka on parempi kuin yhdenkään samalla toimialalla toimivan kilpailijan. Teemme verkkosivut ilman valmisteemoja ja suhtaudumme kunnianhimoisesti koodiin. Myös ripeä asiakaspalvelu ja WordPress-käyttöön räätälöity palvelinratkaisu ovat meille tärkeä osa Dude-laatua. Vastuullisuus Lähdemme mukaan projekteihin, joihin uskomme ja jotka tuovat mielestämme jotain hyvää maailmaan. Olemme ehdottomasti itsekin parhaimmillamme silloin, kun asiakkaamme itse uskoo asiaansa ja kun se asia on jotain, joka tekee maailmasta paremman paikan. Rohkeus Joskus se on sitä että ehdotetaan asiakkaalle jotain mitä hän ei ole pyytänyt, toisinaan taas sitä että kerromme että jotain ei kannata mielestämme tehdä. Jokaisella työntekijällä rohkeus olla mitä on ja yrityksenä rohkeus olla osiensa summa. Välittäminen Katsellaan vähän mitä ympärillä tapahtuu ja joskus on hyvä kysyä kanssaeläjiltä että ”kuinka voit?”. Projekteissa tavoitteenamme on huikea visuaalisuus ja moitteeton koodi, mutta haluamme myös koko palvelukokemuksen olevan korkealla tasolla aina ensimmäisestä yhteydenotosta lähtien. Jokainen ihmisen kirjoittama viesti tai puhelu ansaitsee tulla vastatuksi. Kehittyminen Kehitymme jatkuvasti. Koko tiimi seuraa aktiivisesti työkalujen, tekniikoiden ja toimintaympäristön kehitystä. Projekti ja tiimi hyötyy siitä, että jotain uutta kehitetään jopa projektin aikana. Tästä hyvä esimerkki on talon kruununjalokivi, avoimen lähdekoodin WordPress-kehittäjäteema Air-light, joka tiheimmillään päivittyy jopa päivittäin. Duden tarina 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 Alussa meitä oli vain kaksi ja vermeetkin oli lainavehkeitä. Ensimmäinen toimisto vanhan työnantajan tiloissa. 2013 Roni ja Juha perustavat yrityksen keväällä 2013 puolivahingossa kun alihankintasoppari ja omat asiakkuudet vaikuttavat tilaisuudelta, jota ei voi olla käyttämättä. Pitkiä päiviä sekä opettelua yrittäjyyden ihmeelliseen maailmaan. Blogissa lisää ajan kuvaa: Ensimmäinen bloggaus: Firma pärähti pystyyn Vuosi 2013 paketissa – Dude toivottaa hyvää joulua! 2014 Dynamic duon (Roni & Juha) toinen vuosi käyntiin yrittäjinä. Paljon opettelua, uusia projekteja ja henkilökohtaista kehittymistä. Lukemista vuodelta 2014: Vierityspalkki: “Käsityöläismeiningillä webbisivuja” – Digitoimisto Dude Pikakelaus Duden kevääseen Vuosi paketissa ja fiiliksiä tulevasta Miehet kuin veistokset Laajavuoren kukkulalla. Kuva myös herona sivuilla back in the day 2015. 2015 Pitkän linjan yrittäjä Kristian Hohkavaara ja Digitoimisto Dude Oy yhdistyvät. Roni on mukana aloittamassa ensimmäisiä WordPress Meetuppeja Jyväskylässä. Vuoden 2015 kohokohdat blogissa: Digitoimisto Dude Oy ja Hohkavaara yhdistyivät WordPress-tapaamiset alkoivat Jyväskylässä Vuoden 2015 ensimmäisen puoliskon työnäytteitä Dudet aamupalaverissa toukokuussa 2016. Timi muutti muuten Jyväskylään Helsingistä asti. 2016 Timi tulee mukaan völjyyn yrityksen ensimmäisenä työntekijänä sekä back-end-kehittäjänä. Isompia ja vaativampia projekteja saadaan kotiutettua sekä kappas kummaa, myös tehtyä. Vuoden 2016 kohokohdat blogissa: Neljäs Dude remmiin Digitoimisto Dude: ruumiinavaus 2016 Roni "Rolle" Laukkarinen toimi toimitusjohtajana kaudella 2013-2017. Tämän jälkeen Kristian Hohkavaara sai ylennyksen. 2017 Dude muutti Gummeruksenkadun kulmaan ja remontoi toimiston näköisekseen, ikkunnassa lukee “Bittivirtojen tukkijätkät palveluksessasi”. Kristianista tulee toimitusjohtaja ja hommat kehittyy. Blogissa lisää ajan kuvaa: Tältä näyttää Duden kulma – muuttokuulumiset Jyväskylän ytimestä Vuosi 2017 numeroina Talouskatsaus Eräänä kesäisenä päivänä päätettiin hypätä Lillijunaan. Ja sepä olikin yllättävän kivaa! 2018 Liikevaihto ylittää 200 000 ja soitetaan sen kunniaksi Get Lucky! – se on kappale, joka pistetään soimaan aina kun tulee kauppaa kotiin, tämä on yksi Duden omintakeisista perinteistä. Muutetaan isompiin tiloihin Kauppakadulle aivan keskustan tuntumiin. Timi järjestää ensimmäisen WordPress-seminaarin WordCampin Jyväskylään. Henri aloittaa Dudella. Paljon tapahtuu. Vuoden 2018 kohokohdat blogissa: Duden talousvartti – tästä alkaa uusi startti Dude nosti tasoa kerroksella – esittelyssä uusi Kauppakadun toimisto WordCamp Jyväskylä 2018 kokosi WordPress-kehittäjät yhteen Aamupalaverit vietetään joka maanantai. Kauppakatu 14 tiloissa on tilaa useammallekin ihmiselle. 2019 Timistä tulee osakas. Suunnittelumaailman supertähti Kari saapuu taloon. Aloitamme hahmottelemaan brändiuudistusta. Käymme jälleen WordCamp Europessa, tällä kertaa Saksassa. Vuoden 2019 kohokohdat blogissa: Digitoimisto Dude – läpileikkaus 2019 New dude on the block! Toimiston lounge uudistui ja porukkaa viihdyttää jatkossa arcade sekä darts-taulu. 2020 Kehittäjätiimi saa Nikusta vahvistuksen, nyt meitä on kuusi. Karista tulee luova johtaja. Uusi brändi julkaistaan. Rekry tulilla taas ja Duden tarina saa pian uutta jatkoa. Vuoden kohokohdat blogissa: Dude uudistui – Ensimmäinen perusteellinen brändiuudistus sitten perustamisen Dude 2020 – kahdeksan vuotta kasvua Toimistolla on hyvä meininki, kuten aina. 2021 Kehittäjätiimi kasvaa nelihenkiseksi, kun porukkaan tulee mukaan Tuomas ja loppuvuodesta vielä Elias, molemmat JAMKin harjoittelun kautta. Yhteensä seitsenhenkisellä tiimillä on kelpo tehdä hommia. Liikevaihto ylittää 400 000 ja tehdään taloudellisesti paras vuosi tähän asti. Vuoden kohokohdat blogissa: Tuomas aloitti Dudella alkuvuodesta – Millaista on olla Dudella työharjoittelussa? Yhdeksäs toimintavuosi purkissa – Digitoimisto Duden perinteinen ruumiinavaus kaudelta 2021-2022 2022 Elias ja Tuomas vakiinnuttavat asemansa dev-tiimissä. Jenni aloittaa työharjoittelun back-end koodarina. Julkaisemme seitsemännet verkkosivut, joiden etusivua koristaa showreel-video. Kehitys kehittyy ja tarina jatkuu… 2023 Dude täytti 10 vuotta, ja synttäreitä juhlittiin asiaankuuluvalla arvokkuudella yhteistyökumppaneiden, asiakkaiden ja työntekijöiden kesken. Juhasta tuli toimitusjohtaja, ja väkeä palkattiin lisää niin koodi-, kuin suunnittelupuolellekin. 2023 oli kasvun ja suurten muutosten vuosi. Blogissa löydät aiheesta lisää: Duden uusi aikakausi osa I: Kaupungissa on uusi sheriffi – Juhasta toimitusjohtaja Dude 10 v -arkisto Uusi asiakkuus- ja projektipäällikkö Henri Tammenniemi aloitti Dudella 2024 Dude jatkoi kasvuaan 15 osaajan toimistoksi! Projekteja tehtiin, toimintatapoja hiottiin ja hommat rullaa. Katsaus uuteen kauteen: 11. tuotantokausi avattu – Digitoimisto Dude Oy on 15 osaajan yritys vuonna 2024 Vuosi toimarina – Miten meni noin niinku omasta mielestä? Tutustu tyyppeihin Jokainen ihminen ja yritys on erilainen. Uskomme erilaisuuden voimaan ja aidot persoonat ovat rikkaus, jota haluamme vaalia. Aina helppoa? Ei, mutta aina sen arvoista. Ole mitä olet. Juha Laitinen Toimitusjohtaja juha@dude.fi Instagram Roni Laukkarinen Teknologiajohtaja roni@dude.fi Twitter Mastodon Instagram GitHub LinkedIn Last.fm Henri Tammenniemi Asiakkuus- ja projektipäällikkö henri@dude.fi 040 766 2725 LinkedIn Arto Toivanen Vanhempi kehittäjä arto@dude.fi GitHub Tuomas Marttila Kehittäjä tuomas@dude.fi GitHub Elias Kautto Vanhempi kehittäjä elias@dude.fi GitHub Sanna Sillanpää Suunnittelija sanna@dude.fi LinkedIn Joni Mononen Suunnittelija joni@dude.fi LinkedIn Jenni Tahvanainen Kehittäjä jenni@dude.fi GitHub Miska Laitila Kehittäjä miska@dude.fi GitHub Luka Airassalo Kehittäjä luka@dude.fi GitHub Maria Hult Kehittäjä maria@dude.fi GitHub Instagram LinkedIn Nadya Häkkinen Kehittäjä nadya@dude.fi GitHub LinkedIn Last.fm Otto Tiitinen Kehittäjä otto@dude.fi'
