["https://www.dude.fi/yhteiso-ja-koodi"]
title = "Yhteisö & Koodi - Duden osallistuminen WordPress-yhteisön toimintaan"
description = "Tietoa Digitoimisto Duden käyttämistä tekniikoista ja kontribuutioista WordPress-maailmaan niin koodin kuin tapahtumienkin osalta."
full_description = "Yhteisö & koodi Avoin lähdekoodi ei ole Dudella sanahelinää Dudelle tärkeää on avoimuus myös koodin puolella. Tällä sivulla esittelemme osallistumistamme WordPress-yhteisöön, yhteisön hyväksi tekemiämme avoimen lähdekoodin tuotoksia sekä käyttämiämme työkaluja, joista olemme erityisen ylpeitä. Selaa GitHubiamme Duden osallistuminen WordPress-yhteisön toimintaan WordPress on avoimen lähdekoodin julkaisujärjestelmä, jota kehitetään yhteisön vapaaehtoistyön voimin. Dude on ollut WordPressin yhteisön toiminnassa mukana alusta asti ei ainoastaan koodipuolella, mutta myös esimerkiksi järjestämässä WordPress Meetuppeja ja WordCampeja Suomessa. WordPressin ohjelmiston ja yhteisön kehittämiseen voi tutustua lisää esimerkiksi WordPressin suomenkielisillä sivuilla. Lue kirjoituksiamme WordPress-yhteisöstä Saamamme viralliset ansiomerkit WordPress-kontribuutioistamme Dude on ansainnut seuraavat WordPress-maailman viralliset ansiomerkit WordPress-kontribuutioistaan. Ansiomerkkejä saa automaattisesti tai WordPress-yhteisön myöntämänä. Duden käyttäjäprofiilit löytyvät julkisesti WordPress.orgista mm. seuraavien tilien alta: digitoimistodude, rolle, sippis. Theme Developer Plugin Developer Translation Contributor Translation Editor WordCamp Speaker Community Contributor Community Team Core Contributor Meta Contributor WordCamp Organizer Meetup Organizer Photo Contributor BuddyPress Contributor Käytämme työssämme mm. seuraavia työkaluja ja tekniikoita Avoin lähdekoodi intohimona Dudelle on perustamishetkestä lähtien ollut tärkeää tuottaa laadukasta koodia, käyttää elämää helpottavia tekniikoita ja kehittyä koko ajan paremmaksi. Käyttämällä moderneja tekniikoita saa aikaan myös moderneja verkkosivuja, eikä aikaa tarvitse tuhlata toistuviin, puuduttaviin ja hitaisiin toimenpiteisiin. Käytämme työssämme mm. seuraavia työkaluja ja tekniikoita: SASS/SCSS, Capistrano, HTML, Gulp, NPM, jQuery, JavaScript, Git, NGINX, Vue.js, SVG, Composer, PHP, Mithril.js. Alla muutamia ylpeyden aiheitamme. Lisää voit selata GitHubimme alta. air-light WordPress starter theme – designed to be minimal, lightweight and easy for all kinds of WordPress projects. Language:CSS Stars:626 Forks:91 air-blocks A Gutenberg ACF Block library for Air-light WordPress starter theme. Language:CSS Stars:5 air-helper Air helper brings our preferences to Air-light based themes and extends with many ways like adding WooCommerce support. Language:PHP Stars:32 Forks:5 dudestack A toolkit for creating a new professional WordPress project with deployments. Originally based on Roots/bedrock. Language:Shell Stars:81 Forks:16 macos-lemp-setup Installation script for enabling macOS baked-in LEMP stack. Language:Shell Stars:52 Forks:21 devpackages Development packages for web and WordPress theme development. Language:JavaScript Stars:14 Forks:2"
