["https://www.dude.fi/duden-talouskatsaus-2018"]
title = "Duden talouskatsaus 2018 - Digitoimisto Dude, Jyväskylä"
description = "Muistutettakoon, että Duden tilikausi ei ole kalenterivuosi vaan kesäkuun ensimmäisestä päivästä toukokuun viimeiseen päivään."
full_description = "Kirjoittanut Kristian Hohkavaara Jatkakaamme klassista blogausten sarjaa jossa esittelemme Duden taloutta edellisen tilikauden osalta. Perinne alkoi laajasta artikkelista Digitoimisto Dude: Ruumiinavaus 2016, jossa esiteltiin lukujen lisäksi myös firman toimintaa ja resursseja laajemminkin. Vuonna 2017, apinakvartetin kippariksi siirryttyäni tyydyin lyömään vain madonluvut tiskiin artikkelissa Duden pieni talouskatsaus ja muu jälkipeli käytiin peilin edessä. Vuoden 2018 tilikausi antaa jälleen aihetta pienimuotoiseen henkseleiden paukutteluun ja voidaankin todeta että boys are doing alright! Ennen varsinaiseen asiaan menoa muistutettakoon, että tilikautemme ei ole kalenterivuosi vaan meidän rytmimme on kesäkuun ensimmäisestä päivästä toukokuun viimeiseen päivään. Olemme toisinaan miettineet tilikauden ruuvaamista kalenterivuoden mukaiseksi, jolloin eläisimme paremmin symbioosissa ympäröivän todellisuuden kanssa. Käytännössä operaatio on näin viiden toimintavuoden jälkeen jo sen verran suuri, että tyydymme kohtaloomme ja rämistelemme menemään valitsemallamme tiellä. Pidemmittä puheitta, luvut olkaa hyvä: Lähde: asiakastieto.fi Kuinka kurssi käännettiin? Vuoden 2017 tuloksen sukellukseen oli pari isompaa selitystä, jotka kerrottiinkin lyhyesti edellisessä talouskatsauksessa. Tähän tiivistettynä: Olimme keltanokkia ensimmäisen työntekijän palkkauksen suhteen, emmekä tajunneet myydä työntekijälle tarpeeksi laskutettavaa, jotta olisi voinut puhua kannattavasta toiminnasta. Myös projektinhallintamme oli löysää ja kuritonta, jonka johdosta jotkut projektit venyivät kohtuuttoman pitkiksi ja katteet sulivat käsille. Juurikin yllämainittuihin asioihin puuttumalla käänsimme päättäväisesti kurssia. Liikevaihdon ja tuloksen suotuisaa kehitystä vahvisti myös alihankkijoiden panos sekä hosting-/ylläpitosopimusten määrän kasvu. Tulevaisuus Duden tulevaisuus näyttää valoisalta eikä suuriin korjausliikkeisiin ole aihetta – tulemme varmasti jatkamaan valitsemallamme tiellä 5 – 15 000€ hintaisten WordPress -sivustojen ja -kauppojen toteuttajana. Tulevan syksyn haasteina ovat uuden toimitilan sekä työntekijän etsintä, joka on osoittautunut yllättävän haastavaksi. Eli rekry on edelleen päällä, ilmoituksemme löydät täältä (saa jakaa!). Tilinpäätöksen vahvistuksen jälkeen saimme myös postia Suomen Asiakastiedolta, jonka mukaan olemme oikeutettuja Suomen Vahvimmat -sertifikaattiin ja meillä on tämän myötä mahdollisuus ostaa erilaista sertifikaattituotetta mm. nettisivuille tai miksei jopa viiri kahvipöytää piristämään. Arvaapa ostetaanko? Tämä bloggaus ja Asiakastiedon sivuilta löytyvät tiedot olkoot riittävä sertifikaatti bittivirtojen tukkijätkille. Ugh. Yritys digitoimisto dude oyjyväskyläliiketoimintarekrytointitalousverkkosivut"
