light"]{--color-brand-reference-bg:#f7f7f7;--color-brand-reference-text:#222;--color-brand-reference-official:#2f2f2f}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#1d1d1d;--color-brand-reference-text:#fff;--color-brand-reference-official:#2f2f2f}}.block-image+.block-references>.container{padding-top:var(--padding-container-vertical)!important} Rex Verkkokauppauudistus suomalaisten urheiluvälineiden asiantuntijalle Dude uudisti Rexin B2B-verkkokaupan vastaamaan brändin kasvua ja modernin verkkokaupan tarpeita. Suunnittelun tavoitteena oli selkeä, käyttäjäystävällinen ja houkutteleva sivusto, joka palvelee jälleenmyyjiien ja urheilukauppiaiden lisäksi myös tiedonjanoisia hiihto- ja pyöräilyharrastajia. Siirry sivustolle Mitä teimme Käyttöliittymäsuunnittelu WordPress-verkkosivut WooCommerce-verkkokauppa WordPress-ylläpito Tavoitteet Brändiä vahvistava ja selkeä, intuitiivinen käyttöliittymä. Oikean tuotteen löytämisen ja ostotapahtuman helppous. Helppo verkkokaupan hallinta. Mitä tehtiin Sivuston ilme ja rakenne luotiin tukemaan Rexin asiantuntijaroolia sekä tavoittamaan laajempi käyttäjäkunta erityisesti aktiiviharrastajien ja jälleenmyyjien parista. Sivustolle toteutettiin erilaisia hakutoimintoja, joiden avulla käyttäjät voivat löytää nopeasti sopivat tuotteet, kuten oikean suksivoiteen lumityypin ja lämpötilan mukaan. Verkkokaupan avulla markkinoinnin automaatioita ja asiakaspolkuja optimoitiin niin, että asiakaskokemus on selkeä ja joustava. Verkkokaupan hallintaa helpotettiin monipuolisilla lohkoratkaisuilla, ja jälleenmyyjille luotiin mahdollisuus rakentaa tuotepaketteja ja tehdä ennakkotilauksia suoraan verkkosivustolta. Näin vähennettiin merkittävästi manuaalista työtä ja tehostettiin tilausten käsittelyä. Lopputulos Rexin B2B-verkkokauppa tarjoaa käyttäjäystävällisen, visuaalisesti vaikuttavan ja tehokkaasti hallittavan ostokokemuksen, joka palvelee niin aktiivisia hiihto- ja pyöräilyharrastajia kuin jälleenmyyjiä ja myyntitiimiä. Räätäidyssä Rex-jälleenmyyjäportaalissa voi tehdä ja hallinnoida tilauksia suoraan verkkosivujen kautta. Verkkokauppa tukee Rexin uusia kasvutavoitteita pyöräilytuotteissa kansainvälisesti ja vahvistaa brändin asiantuntija-asemaa kaikilla kohdemarkkinoilla. Duden ylläpitopalvelut varmistavat sivuston toimintavarmuuden ja tukevat Rexin jatkuvaa kasvua. Duden WordPress-ylläpito rex.fi pyörii Duden korkean suorituskyvyn WordPress-optimoidulla palvelimella. Dude pitää huolta palvelimesta, nimipalvelusta, WordPress-päivityksistä, WordPressistä, lisäosista ja näiden tietoturvasta. Ylläpitopakettiin kuuluu myös muunmuassa ripeä tekninen tuki ja automaattiset varmuuskopiot. Katso myös nämä Kuntokeskus Alive – Parempaa käyttäjäkokemusta ja asiakaspalvelua design verkkosivut ylläpito Lounais-Hämeen koulutuskuntayhtymä – Useammat verkkosivut samassa paketissa design integraatio multisite verkkosivut ylläpito Vierityspalkki – Blogi verkkopalveluiden uudistajille ja kehittäjille design integraatio multisite verkkosivut ylläpito Arkkitehtuurin Finlandia – Laadukkuutta huokuva palkintosivusto design verkkosivut ylläpito'
