description = '"Dude pystyi toteuttamaan kaikki sivustouudistukselle asetetut tavoitteet, osan jopa paremmin kuin uskalsimme toivoa."'
full_description = '.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#f1f1ee;--color-brand-reference-text:#232323;--color-brand-reference-official:#e7450f}.block{--color-background-block:#fff}@media (prefers-color-scheme:light){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#f1f1ee;--color-brand-reference-text:#232323;--color-brand-reference-official:#e7450f}body[data-color-scheme="light"] .block,.block{--color-background-block:#fff}body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#191919}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#f1f1ee;--color-brand-reference-text:#232323;--color-brand-reference-official:#e7450f}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#232323;--color-brand-reference-text:#fafafa;--color-brand-reference-official:#e7450f}}@media (prefers-color-scheme:dark){.block-reference-quote-short,.block-reference-quote-short span,.block-background-reference,body{--color-brand-reference-bg:#232323;--color-brand-reference-text:#fafafa;--color-brand-reference-official:#e7450f}body[data-color-scheme="light"],body[data-color-scheme="light"] .block{--color-background-block:#fff}.block,body[data-color-scheme="dark"],body[data-color-scheme="dark"] .block{--color-background-block:#191919}body[data-color-scheme="light"] .block-reference-quote-short,body[data-color-scheme="light"] .block-reference-quote-short span,body[data-color-scheme="light"] .block-background-reference,body[data-color-scheme="light"]{--color-brand-reference-bg:#f1f1ee;--color-brand-reference-text:#232323;--color-brand-reference-official:#e7450f}body[data-color-scheme="dark"] .block-reference-quote-short,body[data-color-scheme="dark"] .block-reference-quote-short span,body[data-color-scheme="dark"] .block-background-reference,body[data-color-scheme="dark"]{--color-brand-reference-bg:#232323;--color-brand-reference-text:#fafafa;--color-brand-reference-official:#e7450f}}.editor-styles-wrapper .block-title-content-columns.has-style-alt .container,.editor-styles-wrapper .block-title-content-columns.has-style-alt .site-main .block.is-skip-link,.site-main .block-title-content-columns.has-style-alt .block.is-skip-link,.site-main .block-title-content-columns.has-style-alt .container{padding-top: calc(var(--padding-container-vertical) / 2) !important} Otava Oppimisen palvelut Neljä sivustoa helposti hallittavaksi kokonaisuudeksi Otava Oppimisen palvelut on oppimateriaalien yleiskustantaja ja oppimisen asiantuntija, joka tuottaa digitaalisia ja painettuja oppimateriaaleja, sisältöjä ja palveluja esiopetuksesta aikuiskoulutukseen sekä valmentaa kouluja toimintaympäristön muutoksiin. Siirry sivustolle Referenssivideo Sivustoja 4 Digimateriaalin käyttäjiä 360 000 Mitä teimme Aloitustyöpaja Palvelumuotoilu Kävijäpolkujen määrittäminen UI/UX suunnittelu Verkkosivut Integraatiot WordPress Multisite Ylläpito, jatkokehitys Lähtötilanne ja tavoitteet Eri liiketoiminta-alueiden, Otavan Oppimisen Palveluiden, Otava Utbildningin, Otava Learningin ja Finn Lecturan tarpeet olivat muuttuneet, eikä vanhat sivustot enää täysin vastanneet näihin tarpeisiin. Lisäksi kaikki sivustot haluttiin yhdistää samaan WordPress-multisite alustaan ja yhtenäistää niiden ilmettä, säilyttäen kuitenkin Oppimisen palveluiden sekä Finn Lecturan omat brändi-identiteetit. Uudistuksella haluttiin parantaa käyttökokemusta asiakaslähtöisemmäksi ja tehdä ylläpidosta joustavampaa mahdollistamalla monipuolisempia osakokonaisuuksia. Tavoitteena oli sisällön selkeämpi järjestäminen ja hakukonenäkyvyyden parantaminen optimoimalla sisältöä. Erityisen tärkeää oli lakisääteisten saavutettavuuskriteerien täyttäminen ja integraatioiden rakentaminen muihin käytössä oleviin järjestelmiin. Dude pystyi toteuttamaan kaikki sivustouudistukselle asetetut tavoitteet, osan jopa paremmin kuin uskalsimme toivoa. Hanna Väisänen, markkinointipäällikkö yrityksestä Otava Oppimisen palvelut Toimivat käyttäjäpolut suunnittelun pohjana Työpajoilla ymmärrys tarpeista Eri liiketoiminta-alueiden alla on suuri määrä tuotteita ja tuotesarjoja sekä erilaista lisäsisältöä kuten ohjeita ja webinaareja. Jotta isosta kokonaisuudesta saatiin täysi käsitys, projekti aloitettiin useamalla työpajalla. Ensimmäisessä työpajassa asiakas briiffasi Otava Oppimisen palveluiden, Otava Utbildningin, Otava Learningin sekä Finn Lecturan liiketoimintaa, jotta saisimme parhaimman mahdollisen kuvan siitä kenelle sivustokokonaisuutta ollaan tekemässä. Seuraavissa työpajoissa hahmotettiin eri brändien tarpeita, lähdettiin rakentamaan sivustokarttaa ja paneuduttiin tuotetietointegraation yksityiskohtien suunnitteluun. Toimivat käyttäjäpolut suunnittelun pohjana Työpajojen avulla liiketoiminta-alueiden tarpeet ja toiveet saatiin hyvin selville. Otava Oppimisen palveluiden, Otava Utbildning ja Otava Learning -sivustoja lähdettiin suunnittelemaan Oppimisen palveluiden brändi-ilmeen mukaiseksi ja Finn Lecturan sivusto oman brändi-ilmeensä mukaan. Erityisesti tuotetiedon helppoon löydettävyyteen ja selkeään esittämiseen kiinnitettiin huomiota, sillä asiakas oli painottanut näiden tärkeyttä työpajoissa sekä myös suunnittelun edetessä. Otava Oppimisen palveluiden sivustolla jokaiselle kouluasteelle päätettiin oma värisävy, joka toistuu läpi sivuston. Näin kävijä hahmottaa selkeästi mitä oppimateriaaleja hän on milloinkin selaamassa. Suunnittelussa mietittiin myös mahdollisimman selkeät polut kävijälle ottaa yhteyttä sekä löytää itselleen relevanttia sisältöä. Tuotetiedon käsittely ja integraatiot Otava Oppimisen palveluilla on tuhansia tuotteita ja nämä tuotteet kansikuvineen haluttiin tuoda jatkossa automaattisesti sivustolle manuaalisen syöttämisen sijaan. Toteutimme räätälöityjä integraatioita, joiden avulla tuotetiedot haetaan automaattisesti tuotejärjestelmästä ja niihin yhdistetään mediapankista tulevat kansikuvat sekä muualta tulevat verkkokauppalinkit. Kaikki tuotetietojen käsittely suoritetaan taustalla ja tallennetaan välimuistiin, sivuston nopeuden varmistamiseksi. Tuotetiedon käsittely ja integraatiot Integraatio tuotejärjestelmään Toteutimme Otavan tuotejärjestelmään integraation joka päivittää kaikki tuotteet eräajona sivustoille. Eräajon yhteydessä tuodaan uudet tuotteet, päivitetään jo tuotuihin muuttuneet tiedot ja poistetaan mahdollisesti järjestelmästä poistuneet tuotteet näkyviltä. Jokaiseen tuotteeseen liittyy useita kymmeniä metatietoja jotka tuodaan käytettäväksi sivustolla. Tuotteiden ja niiden metatietojen suuren määrän vuoksi eräajo suoritetaan suoraan palvelimella hyödyntäen WP-CLI -työkalua ja jokaisen tuotteen tuonnin jälkeen tuotetiedoista tallennetaan tiiviste. Seuraavalla ajolla tuotteen tiiviste tarkistetaan uusia tuotetietoja vasten ja tuotetiedot päivitetään vain jos tiiviste on muuttunut. Tuotteiden metatieto tallennetaan omaan tietokantatauluunsa, jolloin niiden massa ei ole hidastamassa sivuston muiden sisältöjen käyttöä. Tämän toimintalogiikan ansioista sisällönsyöttäjillä on myös mahdollisuus ylikirjoittaa tuotejärjestelmästä tuotuja metatietoja menettämättä niiden koskemattomuutta, sillä manuaalisesti syötetyt metatiedot tallentuvat WordPressin normaaliin metatietokantatauluun. Tuotetietojen välimuistitus Tuotteiden ja niiden suuren metatietomäärän takia sivuston suorituskykyyn tuli kiinnittää erityistä huomiota. Tuotetiedot ovat luonteeltaan suhteellisen staattisia, joten lähdimme ratkaisemaan tätä raskaalla välimuistituksella. Jokaisen tuotteen julkisesti esitettävät tiedot rakennetaan Object Cacheen, eli palvelimen muistissa olevaan nopeaan tietokantaan, josta ne haetaan esitettäväksi julkiselle sivustolle lukuisten tietokantaan suoraan tehtävien kutsujen sijaan. Välimuistia uudistetaan tiheästi osa-ajoina palvelintasolla hyödyntäen WP-CLI työkalua. Vanhimmat, tuotejärjestelmästä juuri päivittyneet tai sivuston sisällönsyöttäjien ylikirjoittamat tuotetiedot priorisoidaan osa-ajoissa, jotta ajantaisaiset tiedot päivittyvät sivustolle nopeasti raskaasta välimuistituksesta huolimatta. Kansikuvien tuonti mediapankista Sivustolla näkyvät tuotteiden kansikuvat tallennetaan Aste Helsingin Otavalle toteuttamaan mediapankkiin. Tarkistamme jokaisen tuotteen kohdalla mediapankin rajapinnasta tuotteen ISBN-koodin perusteella onko kansikuvaa viety mediapankkiin ja käytämme tarvittaessa sivuston puolella määritettyä placeholderia, eli paikkaa pitävää oletuskuvaa. Haku mediapankista on myös mahdollista ohittaa syöttämällä kansikuva tuotteen tietoihin suoraan sivustojen hallintapaneelista. Automaattiset verkkokauppalinkit Otavan Oppimisen palveluilla on oma verkkokauppa, johon haluttiin linkata vaivattomasti sivuston tuotesivuilta. Myös tähän rakensimme integraation. Sivusto tarkistaa säännöllisin väliajoin tuotteen ISBN-koodin perusteella onko se saatavilla verkkokaupasta ja lisää verkkokauppalinkin automaattisesti mikäli tuote löytyy verkkokaupasta. Tuotesarjojen helppo koostaminen Koko tuotemassaa ei esitetä sivustolla kävijälle sellaisenaan, vaan tuotesarjoina ja sen alla olevina tuotekortteina joihin voi linkittyä esimeriksi kolme erityyppistä lisenssiä. Tuotesarjojen koostamisesta tehtiin helppoa, jotta sisältöjen ylläpitäjien työ olisi mahdollisimman mukavaa. Parhaimmillaan tarvitsee syöttää vain sarjan perustiedot ja valita tuotteet jotka kuuluvat kyseiseen sarjaan. Näiden tuotevalintojen perusteella kävijälle esitetään sarjaan liittyvät tuotekortit, jotka on jaoteltu automaattisesti kohderyhmittäin. Tarvittaessa tuotekortteihin voi asettaa lukuisia lisätietoja, kuten linkkejä lisämateriaaleihin, ylikirjoittaa tuotteen tietoja ja valita päätuotteeseen liittyvät muut tuotteet kuten erilaiset lisenssityypit. Koostetuille tuotesarjoille valitaan kouluaste sekä oppiaine, joiden perusteella muodostetaan automaattisesti kouluaste- sekä oppiainekohtaiset listaukset saatavilla olevista tuotesarjoista. Toteuttamamme helppokäyttöisen työkalun avulla asiakas voi muokata kouluastekohtaisesti arkistonäkymässä listattujen oppiaineiden järjestystä, sekä vielä yksittäisen oppiaineen sisällä tuotesarjojen keskinäistä järjestystä. Näin saadaan varmistettua olennaisimpien sekä uusimpien tuotesarjojen helppo löydettävyys. Sivuston ominaisuudet Neljä sivustoa hallittavissa yhdestä paikasta Otava Oppimisen palveluille, Otava Utbilgingille, Otava Learningille ja Finn Lecturalle toteutettiin omat sivustonsa hyödyntäen WordPressin Multisite Network -toiminnallisuutta. Tämän ansioista sivustojen sisältöjä pääsee päivittämään keskitetystä paikasta yhdellä kirjautumisella ja kokonaisuuden tekninen toimintavarmuus on suurempi, kun samankaltaiset sivustot käyttävät yhteistä koodipohjaa. Kaikki sivustot toimivat kuitenkin omassa verkkotunnuksessaan ja näkyvät kävijälle ulkoisesti toisistaan erillisinä sivustoina. Tapahtumat Eventillasta Tapahtumat tuodaan sivustolle automaattisesti Eventillasta ja esitetään sivustolla selkeästi siten, että niitä on mahdollista suodattaa kouluasteen sekä paikkakunnan mukaan. Itse tapahtumaan ilmoittautuminen ohjataan Eventillan palveluun. Toteutimme integraation hyödyntäen Eventillan valmista WordPress-lisäosaa, jota kehitimme yhteistyössä Eventillan kanssa projektin aikana. Uudelleenohjaukset kuntoon Vanhoilla sivustoilla oli roppakaupalla sisältöä. Emme halunneet Otavan menettävän paikkaansa hakutuloksissa ja tiettyjä linkkejä viikoittain käyttävien opettajien sekä oppilaiden päätyvän umpikujaan. Kiinnitimmekin erityistä huomiota siihen, että uusien sivustojen osoiterakenne olisi mahdollisimman yhdenmukainen vanhojen sivustojen kanssa tai vanhat osoitteet vähintään ohjaisivat kävijän oikeaan paikkaan. Tämän takaamiseksi taoimme satoja uudelleenohjauksia paikalleen ennen sivuston julkaisua. Onnistuimme työssä erinomaisesti – kokonaisuuden laajuuden huomioon ottaen vain harva kävijä näkee 404-virhesivun! Evästeiden hallinta Kokonaisuuden kaikilla sivustoilla on käytössä Duden kehittämä evästeiden hallintatyökalu. Evästeiden hallinnan ansioista sivustot ovat yhteensopivat EU:n tietosuojadirektiivin ja GDPR-lakien kanssa, eikä niillä ei lataudu materiaaleja ulkopuolisista lähteistä, ennen kuin kävijä on erikseen hyväksynyt evästeet. Ulkopuoliset palvelut on jaettu useampaan kategoriaan, joista kävijä voi sallia esimerkiksi vain upotteet ja jättää seurantaa varten tarkoitetut palvelut hyväksymättä. Eri kieliversiot on otettu luonnollisesti huomioon asiaankuuluvalla tavalla. Yhteydenotot CRM:ään Sivuston lomakkeilla jätetyt yhteydenottopyynnöt välittyvät rakentamamme integraation avulla suoraan Otavan Dynamics CRM:ään. Sivuston sisällön ylläpitäjät voivat luoda lomakkeita ja asettaa kenttien lähetykset CRM:ään täysin omatoimisesti. Asiakkaan palaute Verkkosivujemme uudistusprojekti oli erittäin laaja ja sisälsi useita eri integraatioita. Dude pystyi toteuttamaan kaikki sivustouudistukselle asetetut tavoitteet, osan jopa paremmin kuin uskalsimme toivoa. Yhteistyö Duden kanssa oli antoisaa, mutkatonta, sujuvaa ja myös inspiroivaa! Dudelaiset ovat huippuammattilaisia ja he kuuntelevat aidosti asiakasta ja toimivat joustavasti ja ketterästi. Olemme erittäin tyytyväisiä uusiin sivuihimme ja yhteistyö Duden kanssa jatkuu tulevaisuudessakin. Hanna Väisänen, markkinointipäällikkö yrityksestä Otava Oppimisen palvelut Katso myös nämä Rex – Verkkokauppauudistus suomalaisten urheiluvälineiden asiantuntijalle design verkkokauppa verkkosivut ylläpito GROOM – Parturipalvelut ja verkkokauppa uudelle tasolle design verkkokauppa verkkosivut ylläpito Turun AKK – Tehokkuutta, käytettävyyttä ja saavutettavuutta design integraatio verkkosivut ylläpito Valkeakosken seudun koulutuskuntayhtymä – VAAO on pippurinen osaamisen ykköskumppani design integraatio verkkosivut ylläpito'
