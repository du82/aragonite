["https://www.dude.fi/tekoaly-apuna-wordpress-verkkosivujen-rakentamisessa"]
title = "GitHub Copilot ja ChatGPT - Tekoälykaveri WordPress-verkkosivujen rakentamisessa - Digitoimisto Dude, Jyväskylä"
description = "Puolet tästä on tekoälyn tuottamaa sisältöä. Kenties jopa tämä lause. Mistä tiedät? Niinpä. Lue miten Dudella hyödynnetään tekoälyä!"
full_description = "Kirjoittanut Roni Laukkarinen Nykypäivänä on yhä suositumpaa käyttää jonkinlaista tekoälymoottoria koodin oppimisessa ja verkkosivujen kehittämisessä. Digitoimisto Dude Oy on Suomen johtavia WordPress-digitoimistoja ja olemme huomanneet tekoälyn olevan erittäin hyödyllinen apuväline koodaajille. Tekoäly hoitaa koodin automaattisen generoinnin, koodin analysoinnin ja optimoinnin. Tämä tarkoittaa sitä, että tekoälyn avulla koodaajat voivat keskittyä koodin ydintoiminnallisuuteen ja suorituskykyyn, kun tekoäly hoitaa rutiininomaiset ja aikaa vievät tehtävät. Tekoäly myös auttaa koodaajia löytämään koodistaan virheitä ja bugeja. Virheenkorjauksen ja koodinvarmistuksen työkalut etsivät koodista mahdollisia ongelmakohtia ja voivat tarjota vinkkejä niiden korjaamiseen, mutta tekoäly luo kokonaan uutta koodia. Kaikki tämä takaa sen, että koodi on mahdollisimman laadukasta ja luotettavaa. Keinoäly on myös erityisen hyödyllinen apuväline koodin dokumentaation ja kommentoinnin kirjoittamisessa. Koodin kommentointi on tärkeää, koska se helpottaa koodin ymmärtämistä ja ylläpitoa tulevaisuudessa. Kokonaisuudessaan tekoäly on erittäin hyödyllinen apuväline koodaajille, joka auttaa heitä keskittymään koodin toiminnallisuuteen ja tehokkuuteen sekä vähentämään virheiden ja bugien riskiä. Me Digitoimisto Dude Oy:lla käytämme tekoälyä aktiivisesti WordPress-projekteissamme ja olemme huomanneet sen olevan erittäin hyödyllinen työkalu koodin oppimisessa ja kehittämisessä. Vai mitä? Tähän asti luulit varmaan lukevasi minun, Roni “Rolle” Laukkarisen kirjoittamaa bloggausta tekoälystä. Tästä ylöspäin tekstin on kuitenkin kirjoittanut tekoäly. Annoin ChatGPT:lle ohjeistukseksi: “Kirjoita ensimmäiset 200 sanaa blogiartikkeliin aiheesta “Tekoäly koodin oppimisen apuna” Suomen kovimman WordPress-digitoimiston Digitoimisto Dude Oy:n näkökulmasta” ja hän (voiko sanoa “hän”?) sai aikaan moisen tekstin, joka on itse asiassa naulan kantaan ja täyttä asiaa. Huh. “Robotti tulee ja vie meidän kaikkien työt!” Tokko kuitenkaan? Skynet ei tullut, mutta tekoäly elää, kehittyy ja voi hyvin. Naureskelin jo vuosia sitten tekoälyn toteuttamalle Euroviisu-kappaleelle, kuuntele tästä alkupalaksi biisi vuodelta 2019: Olen itse kokeillut aikoinaan tekoälyn avulla lähinnä chatbotteja IRCissä, taannoin vuonna 1996 kehitetyllä MegaHAL-moduulilla, joka ei koskaan oppinut suomen kieltä. MegaHAL alkoi keksimään omia sijamuotojaan, jolloin vastauksista tuli hauskoja, mutta sekopäisiä. Esim. “tänäänstä” tai “jonnekinme” eivät ole sanoja. Mitäs osaa vain amerikan englantia… Nykyään niinsanotut “chatterbotit” ovat kuitenkin edistyneempää ja sisältävät “aitoa” älyä, toisin kuin tuon ajan enempää satunnaisgeneroijaa muistuttavat simulointikoneet. Esimerkiksi vuonna 2015 perustetun OpenAI Incin marraskuussa 2022 launchaama ChatGPT-tekoälymoottori mullisti koko kielellisen tekoälyilmaisun. Midjourneyn näkemyksiä Dudesta. Kuva ja taide on edennyt tekoälyn osalta niin pitkälle, että ihmiset pelkäävät oman taiteensa puolesta. New Yorkissa myytiin syyskuussa tekoälyn tekemä taulu yli 420 000 dollarilla. Midjourneylla, Lensa.ai:lla ja DripMe.ai:lla saa aikaan jo melko uskottavia kuvia itsestään visionäärinä tai supersankarina. Rolle vaihtoehtoisista todellisuuksista. Instagramissa lisää. Kuvat ovat jo niin edistyksillisiä, että niistä ei enää spottaa kovin montaa “virhettä”, josta huomaisi tekoälyn olemassaolon. Tekoälyn myötä niin tekstin, äänen kuin kuvankin osalta on herännyt keskustelu eettisyydestä ja tekijänoikeuksista; Jos tekoälyllä on käytännössä koko Internet käytettävissään “inspiraation lähteenä”, voiko matkaan tarttua taiteilijoiden vaivalla kyhäämiä töitä, joista botti modailee uusia teoksia omin lupineen ja onko se sallittua? Se on pidempi pohdinta, johon emme ota kantaa täällä Duden blogissa. Tekoäly on ystävä, joka on tullut jäädäkseen Vuosi 2022 oli tekoälyn kulta-aikaa. GitHubin tekoälyllä varustettu GitHub Copilot avautui auki kaiken kansan saataville, jonka jälkeen koodarin arki ei ole ollut entisensä. Tätä ennen samankaltaista työkalua tarjosi Visual Studio Code AI Assistant Tabnine. Tekoäly eli keinoäly tai AI (englannin sanoista artificial intelligence) on tietokone tai tietokoneohjelma, joka kykenee tekemään älykkäinä pidettäviä toimintoja. Wikipedia Tekoäly vuonna 2023 tarkoittaa käytännössä sitä, että sinulla on vieressä guru insinööri, jolta voit kysyä ihan mitä tahansa. Annat gurulle pienen pätkän koodia ja kysyt mitä koodilla tekee, miten sitä voi jatkojalostaa ja miten sillä saa aikaan jotain hienoa. Tekoäly selittää parhaansa mukaan ja yleensä osuu 100% oikeaan. Esimerkki, jossa tekoäly opettaa koodaamaan ja oppii virheestään. Kuva: Urho Laukkarinen Mutta sitten taas on myös olemassa kääntöpuoli, joskin suhteellisen harmiton: Esimerkiksi vaimoni pyysi tekoälyltä teevinkkejä, joissa oli jotain hämärää. Teelaatua nimittäin ei ollut olemassakaan. ChatGPT väitti kivenkovaan, että kyseessä on “kalenteritee”, vaikka kaikki ominaisuudet viittasivat kamomillateheen. Kamomillatee oli tekoälyn mielestä kokonaan toinen lajike. Miten tekoäly näkyy Dudella? Dudella käytetään GitHub Copilotia koodin oppimisen apuna. Se toimii näin: “Huijausta!”. Tavallaan kyllä, jos ei ole valmis oppimaan samalla. Mutta meillä tekoälyä hyödynnetään lähinnä älykkäänä autotäydennyksenä. Kaikissa tilanteissa Copilotista ei ole apua tai se ei osaa auttaa. Lähtökohta on se, että pitää ymmärtää mitä koodin taustalla on, eikä sokeasti luottaa siihen mitä tekoäly tuottaa. Osa koodista saattaa olla aivan pseudoa, eli robotin keksimiä määritelmiä ei ole alunperin olemassakaan. Siksi ihmistä tarvitaan aina. Tekoälystä on hyötyä Näkisin niin, että tekoäly ei tule korvaamaan ihmistä kokonaan. Naamat tulevat vielä pitkään näyttämään tekoälyn muodostamissa valokuvissa epämuodostuneilta ja tekstuaalinen äly tulee edelleen väittämään asioita, jotka ovat olemassa vain tekoälyn mielikuvituksessa. “Ihmisen kosketus” ja tietynlainen omaperäisyys on se, mikä erottaa meidät koneista. Tämä kaikki on kuitenkin äärettömän mielenkiintoista kehitystä. En olisi voinut vielä kymmenen vuotta sitten kuvitellakaan, että hyödynnämme digitoimistossamme tekoälyä. Tuotamme koodimme jatkossakin itse, mutta väleissä osa siitä työstä, jonka me olisimme muutenkin tehneet, on tekoälyn tuottamaa. Tekoälyllä parhaimmillaan säästämme rutosti aikaa samoilta toimenpiteiltä. Kyseessä on ikään kuin edistyksellisempi automaatio, johon olemme muutenkin keskittyneet tuotekehityksessämme vuosien varrella erityisellä pieteetillä. No, miten on? Kiinnostaako paremmat verkkosivut! Ole ihmeessä yhteyksissä ja kysy lisää! Disclaimer: Tämän artikkelin artikkelikuva on tekoälyn (Midjourney) näkemys vuosikymmeniä vanhasta Dude-yrityksestä, visio siitä mitä Dude on 50 vuoden päästä. Toteutettu iteroitu ja jalostettu komennolla: /imagine decades of old Finnish digital web agency company called Dude, group photo of full of old people coding stuff. Saanko esitellä, Digitoimisto Dude Oy vuosimallia 2073: Verkkopalveluiden kehitysWordPress-kehitys chatgptdigitoimistogithubgithub copilotkoodaaminenopenaitekoälyweb-kehitys"
