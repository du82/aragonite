["https://www.dude.fi/dudet/roni"]
title = "Roni Laukkarinen - Teknologiajohtaja - Digitoimisto Dude Oy, Jyväskylä"
description = "Ura yrittäjänä ponnahti käyntiin kun Roni perusti Duden Juhan kanssa 2013. Firman kehittäminen on Ronille toiseksi tärkeintä elämässä."
full_description = "Teknologiajohtaja Roni Laukkarinen Roni (tuttujen kesken Rolle) on Duden teknologiajohtaja ja perustajajäsen. Ura yrittäjänä ponnahti käyntiin kun Roni perusti Duden Juhan kanssa vuonna 2013. Mies toimi Duden neljä ensimmäistä tilikautta toimitusjohtajana ja firman kehittäminen onkin Ronille tärkeintä elämässä heti perheen jälkeen. Tekeminen webin, avoimen lähdekoodin ja koodin parissa on sisäsyntyistä, sillä Roni teki ensimmäiset nettisivut kymmenvuotiaana ja samalla innolla on painettu siitä lähtien. Erityisesti saavutettavuus on lähellä Rollen sydäntä, hyvänä benchmarkkina toimii kuurosokea puoliso. Verkkosivujen on vain toimittava kaikille. Roni on myös pitkän linjan palvelinexpertti ja Duden palvelininfrastruktuurin taustalla. Rollen olet saattanut bongata Internetistä ja somesta, kuten Twitteristä tai Mastodonista. Vapaalla aika kuluu monipuolisten harrastusten parissa, joihin lukeutuu muunmuassa elokuvat, Overwatch-videopelin pelaaminen, lukeminen, kirjoittaminen, koodaaminen, elektronisen syntikkamusiikin tekeminen, black metal ja kausittaisesti milloin mistäkin innostuminen. Henkilökohtaisen elämän edesottamuksia voit lukea lisää Rollemaassa. Avainsanat: #opensource #avoimuus #teknologia #css #frontend #wpfi #a11y roni@dude.fi 0451271611 Twitter Mastodon Instagram GitHub LinkedIn Last.fm Teknologiajohtaja Otto Tiitinen Kehittäjä otto@dude.fi Nadya Häkkinen Kehittäjä nadya@dude.fi GitHub LinkedIn Last.fm Sanna Sillanpää Suunnittelija sanna@dude.fi LinkedIn Henri Tammenniemi Asiakkuus- ja projektipäällikkö henri@dude.fi LinkedIn Maria Hult Kehittäjä maria@dude.fi GitHub Instagram LinkedIn Arto Toivanen Vanhempi kehittäjä arto@dude.fi GitHub Joni Mononen Suunnittelija joni@dude.fi LinkedIn Luka Airassalo Kehittäjä luka@dude.fi GitHub Miska Laitila Kehittäjä miska@dude.fi GitHub Elias Kautto Vanhempi kehittäjä elias@dude.fi GitHub Jenni Tahvanainen Kehittäjä jenni@dude.fi GitHub Tuomas Marttila Kehittäjä tuomas@dude.fi GitHub Juha Laitinen T