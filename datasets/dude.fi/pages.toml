["https://www.dude.fi/dude-lapileikkaus-2019"]
title = "Digitoimisto Dude Oy, talous 2019 ja toimitusjohtajan tervehdys"
description = "Dude ja korona. Miten koronavirus vaikutti digitoimiston tilikauteen? Lue toimitusjohtajan kevään 2019 mietteet aiheesta."
full_description = "Kirjoittanut Kristian Hohkavaara Tämä artikkeli jatkaa jo perinteeksi muodostunutta artikkelisarjaa, jossa Duden tilikautta ja taloutta käydään retrospektiivisti läpi. Edelliset artikkelit ovat Duden talousvartti – tästä alkaa uusi startti, Duden talouskatsaus 2018, Duden pieni talouskatsaus ja jo klassikon asemaan ehtinyt, Nobelin kirjallisuuspalkinnon arvoinen Digitoimisto Dude: ruumiinavaus 2016. Tämän artikkelin kimppuun olen aina pelolla hypännyt, mutta tällä kertaa se tuntuu vielä edellisiäkin kertoja haastavammalta. Toukokuussa päättynyt tilikautemme oli meillä suurimmaksi osaksi normaalin kaltainen, mutta viimeisen neljänneksen aikana maailma muuttui. Tilikausi oli kaiken kaikkiaan erittäin tapahtumarikas: tehtiin monia upeita toteutuksia (mm. Atena, Mediashake, Tulos, Suomen Tuulivoimayhdistys), koettiin ensimmäistä kertaa kuinka joku poistuu Duden riveistä ja vastaavasti teimme kaksi uutta rekryä todella lyhyen ajan sisällä, kun palkkasimme jo ennestään ansioituneeseen tiimiimme maailmanluokan talentit Karin ja Nikun. Loppuvuodesta jätin itse tuotannon ja siirryin täysipäiväiseksi toimitusjohtajaksi ja mikä tärkeintä, myyntihessuksi. Alkuvuodesta teimmekin erittäin paljon sekä myyntityötä että kehitystyötä oman brändimme suhteen. Ja maaliskuussa otimmekin jo kunnolla selkäämme myyntirintamalla, löylyttäjänä toimi COVID-19 -merkkinen veijari. Dude ja korona Omat muistikuvani maalis-huhtikuulta ovat todella hämäriä. Onneksi muistin herättelyssä auttaa huhtikuun alussa kirjoittamani blogausluonnos, jota ei kuitenkaan koskaan julkaistu. Leivotaan tähän väliin pieni ote, joka kuvaa hyvin silloisia tuntemuksia. “Mitä tapahtuu? Tuntuu, että koko maailma pysähtyy. Eletään yrittäjän ja myyntimiehen painajaista. Kaikki alkuvuonna tehty työ kauppojen eteen tuntuu valuvan hiekkana sormien välistä. Kun kyselee matkaan laitettujen tarjousten perään, niin 100% asiakkaista ilmoittaa että päätöksiä ei nyt tehdä ja kaikki investoinnit ovat jäissä. Se mikä yritysmaailmassa oli vielä kuukausi sitten kiireinen ykkösprioriteetti, ei ole sitä enää. Nyt ykkösenä on pikaisten säästöjen etsiminen. Myyntimies ymmärtää, kiittää ja sulkee puhelimen. Tämä on huonoin mahdollinen hetki lamaantua. Mutta siinä ei ole mitään uutta, että ihmisen pitäisi pystyä huippusuoritukseen juuri silloin kun olosuhteet ovat kaikkea onnistumista vastaan. Tuntuu kuin ei olisi mitään rajaa niille käytännön asioille mitä pitäisi hoitaa. Minuutti sitten otin selvää lomautuksista ja seuraavaksi siirryn puheluun potentiaalisen asiakasehdokkaan kanssa – rentona, iloisena ja levänneenä? Ei, vaan erittäin stressaantuneena, mailaa liian kovaa puristaen, vaikka tiedän että juuri siinä tilassa kaupat eivät synny. Yritän silti kovasti, liikaakin, vaikken edes tiedä onko tulevalle projektille tekijöitä jos henkilöstö joudutaan lomauttamaan. Etätyö Hiihtelen toimistolla itsekseni, kaikki muut tekevät etänä. Meillä etätyö on melko toimivaksi testattu malli ja toimii erittäin hyvin silloin, kun kyseessä on normiarki ja oma valinta. Nyt kun näin ei ole, niin huomaan toimivuudessa paljonkin yksilökohtaisia eroja. Jotkut selviävät kuten aiemminkin, toisilla tekee tiukkaa. Haluaisin uskoa monien muiden tavoin, että tällä ei olisi vaikutusta tehokkuuteen, mutta kyllä tällä on. Pelkästään se, ettei näe tämän ajan taakse, vaikuttaa joillain ratkaisevasti työtehoon ja motivaatioon. Jollain huoli ja pelko omasta tai läheisen työpaikasta lamaannuttaa, toisella taas kotona vallitseva kaaos kun eri sukupolvet yrittävät yhdistää työ-, opiskelu- ja perhearjen. Raskainta näissä päivissä on ollut se, että ajan käsite tuntuu muuttuneen. Yleensä asiat jakautuvat aika nätisti esimerkiksi kuukauden ajalle ja kaikille kokonaisuuksille löytyy sopiva hetki, niin nyt kaikki pitää tehdä HETI. Maksujärjestelyt pitää tehdä heti, lainalykkäyshakemukset heti, erilaiset rahoitushakemukset heti, lomautusilmoitukset työntekijöille heti, työntekijöiden huolet ja murheet kuunnella heti, potentiaalisten asiakkaiden tapaamiset ja tarjouspyynnöt heti. Kaikki, heti. Jumalauta, eihän tämä näin voi mennä. Nyt on nöyrtymisen paikka. Tätä en voi hallita tai korjata, voin ainoastaan päättää miten tähän suhtaudun ja miten toimin tämän keskellä. Olisi todella helppo tehdä liikaa, väsyttää itsensä ja hukkua tähän möykkyyn. Mutta minä riitän. Ja sinä riität. Ja sen on riitettävä.” Tuntuu kummalliselta lukea ylempää tekstiä nyt. Todellisuudessa pian noiden viikkojen jälkeen saimme ennätysmäärän uusia yhteydenottoja ja touko-kesäkuussa teimme Duden historian myyntiennätykset myymällä koko kuluvan loppuvuoden täyteen projekteja, joita siis edelleenkin teemme. Rallilla oli tietenkin hintansa. Toukokuussa työntekijät sitten jouduttiin lomauttamaan 30 päiväksi ja samaan aikaan yrittäjät painoivat palkatta hommia. Kesä-heinäkuussa puskettiin jälleen koko miehistöllä jumalatonta projektimöykkyä eteenpäin ja ne lomailivat, joilla siihen oli mahdollisuus. Itse kullekin tuli lommoja pintaan, henkilökohtaisesti makselen edelleen kevään ja kesän hintaa erilaisten univaikeuksien muodossa. Mutta suunta on ylöspäin, kaikilla mittareilla. Dude ja talous Hyvät naiset ja herrat – käppyrät, olkaa hyvä. Lähde: Asiakastieto.fi Oli huojentavaa huomata, että korona ei muuttanut radikaalisti liikevaihtomme suuntaa, ainoastaan hieman hidasti kasvuamme. Kannattavuuden kanssa meillä oli hieman parannettavaa jo ennen kevättä, mutta sekään ei tullut yllätyksenä kahden peräkkäisen rekryn jälkeen. Meillä tunnetusti kestää hetki, ennen kuin uusi dude alkaa kiikuttamaan tilipussinsa verran riihikuivaa sisään. Kaiken kaikkiaan luvut ovat olosuhteet huomioiden tyydyttäviä, jotain minkä varaan voi rakentaa uutta, räjähtävää ponnistusta. Dude ja tulevaisuus 7 vuotta on jo aika hyvä ikä yritykselle, mutta meidän kohdalla tunnen että alamme vasta päästä vauhtiin. Projektien määrä ei enää kasva eksponentiaalisesti eikä ole tarkoitustaan, nyt kasvun suunta on isommat asiakkuudet ja vaativammat projektit. Nousemme teknisestä verkkosivujen toteuttajasta enemmän kohti kokonaisvaltaisempaa ja pitkäkestoisempaa brändinrakentajakumppania ja mukaan tulevat myös vaativammat tekniset toteutukset, joihin tiimimme alkaa hienosti soveltua. Tuomme entistä enemmän näkyviin erinomaista suunnitteluosaamistamme. Olemme päässeet myös hyvään vauhtiin työkalujemme ja workflown kehittämisessä, joten sillä tiellä jatketaan. Haasteita? Niitähän riittää, päällimmäisenä mielessä kenties koronan toinen tuleminen. Keskitytään silti asioihin joihin voimme vahvemmin vaikuttaa. Niistä suurimpina mainittakoon, että kuinka ylläpidämme erinomaista Dude-laatua sekä uusien projektien että jatkokehitysprojektien ristipaineessa ja toisaalta, kuinka astumme jälleen kertaluokkaa isompaan asiakassegmenttiin uskottavasti. Jos jaksoit lukea tänne asti, niin suuri kiitos! 25 kirjoitusta nopeiten kommentoinutta sai halutessaan lunastaa itselleen ilmaiseksi Dude t-paidat. Ne on nyt pakattu ja postitettu, kiitos kommenteista. Erittäin hyvää loppuvuotta kaikille! Yritys covid-19digitoimistodigitoimisto dude oydigitoimisto jyväskyläkoronakoronavirustalousverkkopalvelutverkkosivutyrittäjyys"
