["https://www.dude.fi/dude-uudistui-ensimmainen-perusteellinen-brandiuudistus-sitten-perustamisen"]
title = "Digitoimisto Dude Oy:n brändi uudistui perusteellisesti"
description = "Digitoimisto Duden brändiuudistus alkoi jo marraskuussa 2019, kun otimme puheeksi yrityksen tuomisen 2020-luvulle."
full_description = "Kirjoittanut Kari Kaponen Oli marraskuu 2019, kun otimme puheeksi Duden oman brändin – olisiko aika tuoda yritys 2020-luvulle? Projektien kokoluokka oli vakaasti kasvamaan päin, mutta halusimme enemmän. Halusimme olla alan kovalla kilpailukentällä näkyvämpiä, uskottavampia ja asiantuntevampia. Halusimme haastaa itseämme jatkuvasti. Meillä oli hienoja ideoita kuinka kehittää toimintaa, mutta se vaati meiltä nimenomaan päätöksiä. Ja päätöksiähän me teimme. Perustimme brändityöryhmän, joka kokoontui kerran-pari viikossa ideoimaan ja hahmottamaan ensimmäisiä toimenpiteitä. Ryhmään kuuluu allekirjoittanut, Roni Laukkarinen sekä Juha Laitinen. Lähtökohta oli, että huonoja ideoita ei ole. Kaikki ajatukset käsitellään läpi ja puristetaan timanteiksi, jos vain kestävät painetta. Lisäksi halusimme ulkopuolista näkökulmaa asialle, joten toteutimme tunnettuuskyselyn. Toteutimme joulukuussa 2019 tunnettuuskyselyn, jolla saimme arvokasta palautetta aikaisemmasta brändistämme. Tunnettuuskysely ja sen tulokset Jaoimme kyselyn sosiaalisessa mediassa, johon saimmekin 144 vastausta. Jokaisesta vastauksesta lahjoitimme euron hyväntekeväisyyteen. Kiitos vielä vastanneille! Luimme joka ikisen vastauksen sekä keräsimme kattavan listan plussista ja miinuksista, jolloin hyppäsimme ns. syvään päätyyn brändiryhmän voimin. Tuloksista kävi ilmi paljon positiivisia asioita, joista olemmekin ehdottoman ylpeitä. Muutama mainitakseni; laadukas, asiantunteva ja rehellinen sekä helposti lähestyttävä. Saimme toki myös arvokasta rakentavaa palautetta, jotka meidän piti ehdottomasti priorisoida uudistuksessa korkealle saavuttaaksemme tällä uudistuksella jotain. Näitä ovat mm. näkyvä tasa-arvoisuus ja uskottavuuden parantaminen sekä tone of voicen kehittäminen. Oli siis aika tehdä pieni korjausliike. Miksi toteutimme brändiuudistuksen? Asiakkaidemme kokoluokka on vuosien varrella kasvanut ja ennestään hyvä jälki on muuttunut erinomaiseksi. Kasvu on tuottanut kulurakennetta, kulurakenne vaatii suurempia asiakkuuksia, suurempien asiakkaiden kotiuttamiset vaativat uskottavuutta. On totta, että nimemme Dude tuo monelle assosiaation miehiseen olemukseen. Olemme saaneet toisinaan palautetta rekryjen ja tunnettuuskyselyn aikaan, että “eikö meille voi tulla naiset töihin?” On siis äärettömän tärkeää muuttaa tämä harhakäsitys, sillä meille on aivan siis merkityksetöntä mitä sukupuolta edustat, minkä ikäinen olet tai mikä etninen taustasi on. Dude on meille neutraali termi. Dudelle kaikki ovat tervetulleita töihin, jos osaat työsi ja teet sen kaikkia muita työntekijöitä kunnioittaen ja olet ennen kaikkea hyvä tyyppi. Rekrytoinnin osaamisvaatimukset pidämme melko korkealla tuotannollisista syistä. Suunnitteluosaamisen vahvuutta toiminnassamme halusimme korostaa entisestään, sillä koimme, että se puoli osaamisestamme on jäänyt hieman web-kehityksen varjoon. Meillä on talossa tällä hetkellä kaksi maailmanluokan suunnittelijaa, jotka osaavat niin ilme-, käyttöliittymä-, kuin käyttökokemussuunnittelunkin salat saavutettavuusseikkoja unohtamatta. Ilmeemme oli kieltämättä hieman myös jämähtänyt ja kaipasi rohkeita uusia ideoita; Erottuvuutta ja väriä, pitäen silti Duden rouhean meiningin taustalla. Kuinka uudistus sitten tapahtui? Aloimme käsittelemään nykyisen sivustomme sisältöä ja heijastimme niitä palautteeseen. Sisältöjä tuottaessa mietimme kuinka sen rouhean, mutta ehkä hieman tökerösti kuvatun asian voisi kertoa samalla sielulla, mutta hieman järkevämmin puhutellakseen eri kohderyhmiä samoin. Rakensimme sosiaalisen median preesensimme uusiksi, ja teimme linjauksia sisällölle sekä sen laadulle. Kuvitustyylimme somessa täytyi olla jatkossa enemmän johdonmukaista. Yhtenäistä, erottuvaa ja erilaista kuin muilla. Toimmekin niihin mukaan härskiä 3D-fiilistä. Kuvituksessa olemme jo vuosia luottaneet By Emmin ammattitaitoon, emmekä näe mitään syytä olla luottamatta jatkossakaan. Huikea ammattivalokuvaaja, jonka jälki ei petä koskaan! Suosittelemme häntä aina myös asiakkaillemme. Lopuksi halusimme varmistaa, että jokainen Dudella muodostaa konsensuksen brändistä. Pidimme kaikille esittelytilaisuuden, jossa jokainen kertoi seisovansa uuden brändin takana ylpeänä ja itsevarmana. Tämähän lupasi ehdottomasti hyvää tulevaa julkistusta ajatellen. Brändiuudistus tarkoittaa toki myös muutoksia muuhunkin toimintaan ja strategiaan, joita avaamme myöhemmin lisää. Visuaalinen identiteetti Uuden ilmeemme halusimme olevan erottuva ja selkeä, sekä ehdottomasti sellainen, että sen käytössä ei tule saavutettavuusongelmia. Väreille haettiin monia variaatioita ennen kuin lopullinen väripaletti lyötiin lukkoon; Väreiksi valikoitui “midnight blue”, raikas minttu sekä harvakseltaan käytetty “cobalt blue”. Ilmeessämme ja logossamme esiintyvää typografiaa säädettiin ja hierottiin myös runsaasti hakien niihin sopivaa tasapainoa. Logon Termina-fonttia on kustomoitu runsaalla kädellä mm. paksuuden, muotojen ja kirjainvälistyksen osalta. Ja rohkenen sanoa, että tämä logo ei ole todellakaan se ensimmäinen versio. Muussa ilmeessä on käytetty Circular Std -fonttia, joka on moderni ja selkeälukuinen, eikä myöskään liian “ylikäytetty”. Jos ilmettä ja logoa pitäisi kuvailla kolmella sanalla, ne olisivat: Jämäkkä, uskottava ja rohkea. Millaisia ajatuksia brändiuudistuksemme sinussa herätti? Alkoiko ajatus omasta brändiuudistuksesta kutkuttelemaan? Siinä tapauksessa ota yhteyttä lomakkeella tai soita numeroon 0400 443 221, niin jutellaan lisää! SaavutettavuusVerkkosivujen suunnitteluYritys brändibrändi-identiteettilogotunnettuuskysely"
