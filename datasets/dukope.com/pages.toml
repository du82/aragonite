["https://dukope.com"]
title = "Games by Lucas Pope"
full_description = '''OFF-COLONY COMMUNITY SUPPORT CENTER Tonight's session / 01:00AM - 05:00AM / "Cyclops anger management" Qualified martians only. In 1802, the merchant ship Obra Dinn set out from London for the Orient with over 200 tons of trade goods. Six months later it hadn't met its rendezvous point at the Cape of Good Hope and was declared lost at sea. Early this morning of October 14th, 1807, the Obra Dinn drifted into port at Falmouth with damaged sails and no visible crew. As insurance investigator for the East India Company's London Office, dispatch immediately to Falmouth, find means to board the ship, and prepare an assessment of damages. Return of the Obra Dinn is a first-person mystery adventure based on exploration and logical deduction. The communist state of Arstotzka has ended a 6-year war with neighboring Kolechia and reclaimed its rightful half of the border town, Grestin. Your job as immigration inspector is to control the flow of people entering the Arstotzkan side of Grestin from Kolechia. Among the throngs of immigrants and visitors looking for work are hidden smugglers, spies, and terrorists. Using only the documents provided by travelers and the Ministry of Admission's primitive inspect, search, and fingerprint systems you must decide who can enter Arstotzka and who will be turned away or arrested. We have gathered intelligence that implicates the Clockmaker as the mastermind behind the attack. However, the Gambler was seen placing the bomb at the rally. We believe the Clockmaker does not personally know the Gambler. There is a network of saboteurs disguised among groups of innocent citizens. Bomb instructions were passed between multiple pairs of saboteur acquaintances. You've just been assigned the editor-in-chief position at The Republia Times in the glorious and free nation of Republia. You must use your influence to print positive articles that paint Republia in a good light.'''
