of the rare languages with its creation story on record — who made it, for whom, why, and how. Hangeul, the Korean alphabet, was developed in 1443 by King Sejong, who is revered as Korea’s most respected king, pretty much an icon in Korean history. His motivation behind creating Hangeul was to devise a written system that the commoners could easily master. Thanks to King Sejong’s pragmatism and his determination to empower the people, Korean readers and writers have a readily learnable language. View Cheat Sheet Botany Botany For Dummies Cheat Sheet Cheat Sheet / Updated 11-13-2024 Botany is the study of plants. Plants are very similar to people in a lot of ways, but they also have some differences that can be hard to wrap your brain around. And, like any science class, botany can get a little overwhelming at times. So, here are a few items to help you grasp some of the big ideas in botany. View Cheat Sheet American History Women's Suffrage: Fighting for the Right to Vote Article / Updated 10-28-2024 Women's suffrage was a controversial subject as women's roles developed in society. By the time the twentieth century arrived, American feminists had been seeking the right to vote for more than 50 years. The suffrage movement was fanned even hotter in 1869, when African American males were given the right to vote through the Sixteenth Amendment, while women of all races were still excluded. One place where women were increasingly included was in the workplace. As the country shifted away from a rural, agrarian society to an industrial, urban one, more and more women had jobs — eight million by 1910. Moreover, they were getting better jobs. In 1870, 60 percent of working women were in domestic service. By 1920, it was only 20 percent, and women made up 13 percent of the professional ranks. Women were getting out of the house for more than just jobs, too. In 1892, membership in women’s clubs was about 100,000. By 1917, it was more than one million. And women’s increasing independence was reflected in the fact that the divorce rate rose from 1 in every 21 marriages in 1880 to 1 in 9 by 1916. Because women had always had nontraditional roles in the West, it wasn’t surprising that Western states and territories were the first to give females the right to vote: Wyoming in 1869, Utah in 1870, Washington in 1883, Colorado in 1893, and Idaho in 1896. By 1914, all the Western states except New Mexico had extended the voting franchise to women. By 1917, the suffrage movement was building momentum. In July of that year, a score of suffragists tried to storm the White House. They were arrested and taken to the county workhouse. President Woodrow Wilson was not amused, but sympathetic, and pardoned them. The next year, a constitutional amendment — the Nineteenth — was submitted to the states. When ratified in 1920, it gave women the right to vote in every state. Despite the significance of the Nineteenth Amendment, many leaders of the women’s movement recognized that the vote alone wouldn’t give women equal standing with men when it came to educational, economic, or legal rights. “Men are saying, perhaps, ‘thank God this everlasting women’s fight is over,’” said feminist leader Crystal Eastman after the Nineteenth Amendment was ratified. “But women, if I know them, are saying, ‘now at last we can begin.’” View Article Writing Writing a Dissertation For Dummies Cheat Sheet (UK Edition) Cheat Sheet / Updated 09-30-2024 Writing a dissertation shouldn’t mean panicking. If you plan ahead and know how to structure your work, you’ll achieve fantastic results. And guess what? You might even enjoy yourself; writing a dissertation can be a highly rewarding experience. Follow this guide to producing the best possible dissertation. View Cheat Sheet Polish Polish For Dummies Cheat Sheet Cheat Sheet / Updated 09-16-2024 Polish is a unique and immensely rewarding language to learn. This Cheat Sheet gives you a quick run-down of the Polish alphabet, Polish numbers, and handy Polish phrases to make you feel more confident speaking Polish in no time. View Cheat Sheet Armed Services Multiplying and Reducing Fractions on the ASVAB Math Knowledge Test Article / Updated 09-11-2024 Some questions on the ASVAB Mathematics Knowledge subtest may involve multiplying fractions. As you solve an equation, you may need to perform the extra step of reducing the fraction to make it easier to find the right answer. Multiplying fractions is easy. You just multiply the numerators and then multiply the denominators. Look at the following equation: You multiply 1 × 3 × 3 × 3 = 9 (the numerators) and then 2 × 4 × 5 = 40 (the denominators) to result in 9/40. Occasionally, when you multiply fractions, you end up with an extremely large fraction that can be simplified or reduced. To express a fraction in its lowest terms means to put it in such a way that you can’t evenly divide the numerator and the denominator by the same number (other than 1). A number that you can divide into both"
