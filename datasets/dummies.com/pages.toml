nduring super hero. Produced in partnership with Marvel Comics and featuring full-color art taken directly from the comic books, this fun and friendly guide helps you understand how Captain America gained his powers and evolved over the years. Order your copy today!", "link": "https://www.dummies.com/marvel", "image": "https://cdn.prod.website-files.com/6634a8f8dd9b2a63c9e6be83/67576a3fb2d0ed84475b3b8d_captain-america-for-dummies-9781394299447.webp" }); Personal Boundaries For Dummies booksArray.push({ "id": "personal-boundaries-for-dummies", "title": "Personal Boundaries For Dummies", "description": "Learn how to create healthy personal and relationship boundaries. Personal Boundaries For Dummies gives you all the basics on what boundaries look like , along with step-by-step instructions for figuring out what your boundaries are and communicating them with others. ", "link": "https://www.dummies.com/book/body-mind-spirit/emotional-health-psychology/emotional-health/general-emotional-health/personal-boundar'''
