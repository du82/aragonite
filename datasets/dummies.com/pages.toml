oding For Dummies Cheat Sheet Cheat Sheet / Updated 11-13-2024 Working as a medical biller and coder is a challenging and rewarding job that takes you right into the heart of the medical industry. You are the touchpoint for everyone involved in the healthcare experience, from the patient and front office staff to providers and payers. To succeed, you'll need to know how to file an error-free claim, important acronyms, and what to look for in a payer contract. View Cheat Sheet Mediterranean Diet Mediterranean Diet For Dummies Cheat Sheet Cheat Sheet / Updated 10-17-2024 Because of the health benefits associated with the Mediterranean diet and the recent studies that have highlighted the diet’s ability to reduce heart disease, decrease the risk of some cancers, prevent or mitigate the effects of diabetes, and more, many have embraced the Mediterranean diet’s key guidelines. Although this plant-based diet devotes the largest portion of a plate to fruits, vegetables, and whole grains, healthy fats, like those you get from olive oil and nuts, lean animal proteins, and red wine also take key roles. View Cheat Sheet General Addiction Sobriety For Dummies Cheat Sheet Cheat Sheet / Updated 09-30-2024 Want some tips for your sobriety journey? This Cheat Sheet helps you challenge beliefs and societal pressures, break free from sobriety stigmas, understand your willpower’s role, and dispel conceptions about happiness. View Cheat Sheet Sex & Gender Sex For Dummies Cheat Sheet Cheat Sheet / Updated 09-25-2024 Although I’m against cheating on your partner, there’s nothing wrong with cheating Father Time with this condensed information about how to have a great sex life. Though I’m all for the occasional quickie, to have terrrrific sex, you need to read a lot more of Sex For Dummies than just this Cheat Sheet. View Cheat Sheet Hepatitis C Reciting the Hepatitis ABCs Article / Updated 09-11-2024 The term hepatitis simply means inflammation of the liver. But when you're talking about hepatitis C, you're talking about viral hepatitis, and hep C isn't the only form of hepatitis caused by a virus. So far, five different viruses have been found that cause hepatitis, and they're named with letters: Hepatitis Avirus causes hepatitis A; hepatitis B virus causes hepatitis B; hepatitis C virus causes hepatitis C; and hepatitis E virus causes hepatitis E. Hepatitis D virus is a special case, because it can't infect you unless you also have hepatitis B virus. The different types of viral hepatitis have similar features but also important differences. Depending on the hepatitis virus, the disease may be temporary — an acute form, which lasts less than a year. With hepatitis B or C, though, infection can become chronic and last for decades, or life, unless you undergo successful treatment against the virus. Hepatitis A virus Hepatitis A (also called infectious hepatitis) was identified in 1973. Hepatitis A spreads through food or water that has been contaminated with infected feces. You can get hepatitis A from: Not washing your hands after exposure to feces: Examples include not washing your hands after using the bathroom or changing a diaper. Eating contaminated food: This situation can occur with uncooked food and food prepared by someone who didn't wash his hands after using the toilet. Drinking contaminated water: Dealing with contaminated water could be a problem when traveling. Sexual contact with someone who's infected: Practice safer sex and especially take care if you have anal or oral–anal sex. Hepatitis A causes an acute infection. In the United States, 200,000 cases of hepatitis A are reported yearly, and a third of all people have already been exposed to hepatitis A virus at some point in their lives but may not have known it. If you've been exposed to hepatitis A in the past or gotten a vaccine, you'll be immune, or protected from future hepatitis A infection. Hepatitis B virus The hepatitis B virus (serum hepatitis) was found in 1963 and spreads through contact with infected body fluids (including saliva, vaginal fluid, and semen) and blood. You can get hepatitis B from Injection drug use Unprotected sex Transmission from mother to child during birth The razor or toothbrush of an infected person Occupational exposure of healthcare workers or emergency personnel to infected blood or body fluids Hepatitis B can cause an acute or chronic infection, but chronic infection occurs in only approximately 5 percent of cases. A hepatitis B vaccine protects against hepatitis B (and hepatitis D). Hepatitis C virus The hepatitis C virus was discovered in 1989. For decades before that, it was called "non-A non-B" hepatitis because researchers knew that it wasn't caused by the other known hepatitis viruses at the time. Hep C is transmitted through blood, and 75 to 85 percent of people infected will have a chronic infection, which puts them at risk for cirrhosis, liver cancer, and liver failure over many decades of infection. No vaccine is available for hepatitis C, so prevention is the key to avoiding infection. Hep C infection can last a lifetime, so you need to take good care of yourself physically, emotionally, and financially. Medical research is ongoing to develop more effective drugs with fewer side effects. Currently, combination therapy with two drugs — pegylated interferon and ribavirin — is the best treatment, but it doesn't work for everyone. Hepatitis D virus Hepatitis D was discovered in 1977 and is an incomplete virus thatcan't infect you on its own; it has to tag along with hepatitis B virus. When it does, it can produce more-severe hepatitis B disease. Transmission of hepatitis D is the same as for hepatitis B. Vaccination against hepatitis B prevents hepatitis D infection, too. Hepatitis E virus The hepatitis E virus was discovered in 1983 as another hepatitis virus that's transmitted through contamination of water with feces. Outbreaks of hepatitis E occur primarily in developing countries in Africa, Asia, and Central America due to unsanitary water supplies. Hepatitis E is rare in Canada, the United States, and other developed countries. Hepatitis E is an acute infection. For some as-yet-unexplained reason, pregnant women appear to be at risk of a more severe disease when infected with hepatitis E. Other hepatitis viruses Researchers believe that most people with viral hepatitis have one of the hepatitis viruses from A to E. But scientists are always on the lookout for new viruses that can cause disease. The viruses called hepatitis G virus (HGV), TTV (transfusion transmitted virus), and sentinel viruses (SEN) have all been discovered in the blood of people with hepatitis. But it's not absolutely clear that these viruses actually cause hepatitis. Hepatitis F is a name for a virus that's no longer thought to cause hepatitis. View Article Diabetes Diabetes For Dummies Cheat Sheet Cheat Sheet / Updated 06-24-2024 Diabetes, which is excessive glucose in your blood, leads to serious health problems if left untreated. You should follow the American Diabetes Association screening guidelines to get tested for diabetes at the earliest possible time. If you have diabetes, this Cheat Sheet is a handy reference to screening guidelines, rules for living with diabetes, and continuing your diabetes care to better control the disease. View Cheat Sheet Emotional Health & Psychology Give Your Mind Some Peace for Mental Health Awareness Month Article / Updated 05-22-2024 With household names like Ryan Reynolds, Dwayne "The Rock" Johnson, and Megan Thee Stallion going public about their struggles with anxiety and depression in recent years, mental health is finally becoming less taboo. It wasn’t long ago that any deviation from the norm was treated like a shameful secret: Mental health conditions were ignored, waved away, or handled in private — and often inhumane — ways (think lobotomies). The ongoing lack of visibility into these struggles served to perpetuate the myth that mental health issues were pretty rare — and that the few people who did struggle were somehow to blame for their condition. Today, we know mental health conditions are actually incredibly common: According to the National Alliance on Mental Illness (NAMI), 1 in 5 U.S. adults experience a mental illness. And that number is growing: the stress, fear, grief, isolation, and uncertainty of the global pandemic led to an increase in mental health issues — particularly among young adults — according to the CDC. Of course, that’s a conservative picture: In cultures, professions, and communities where mental illness stigma remains alive and well, addressing your own struggles has consequences — anything from social ostracization to losing your job. Meanwhile, a lack of access to affordable health care and unbiased information creates additional barriers for those most in need of support. And, when left untreated and unacknowledged, one person’s poor mental health can create a ripple effect that impacts their loved ones.'''
