full_description = '''Op de N11, afslag Bodegraven. Gevarenlichten aangedaan en geblokkeerd voordat hij nog 200m op een actieve rijbaan naar achteren reed. Bowling is een sport waarbij de speler door middel van een bowlingbal moet proberen om alle tien de pins omver te gooien. Bowling is ontstaan uit het aloude spel kegelen. Proost! Dag iedereeeeen! Ook deze week gaan we weer de grens over. We gaan namelijk bij Koen Crucke/Albert Vermeersch/Alberto Vermicelli/MC Spaghetti op bezoek! De aflevering staat vol met Belgische klassiekers, Nederlandse weektoppers, een Gina, René en gewoon wat random filmpjes. Veel kijkplezierrrrr Bowling is een sport waarbij de speler door middel van een bowlingbal moet proberen om alle tien de pins omver te gooien. Bowling is ontstaan uit het aloude spel kegelen. Proost! Dag iedereeeeen! Ook deze week gaan we weer de grens over. We gaan namelijk bij Koen Crucke/Albert Vermeersch/Alberto Vermicelli/MC Spaghetti op bezoek! De aflevering staat vol met Belgische klassiekers, Nederlandse weektoppers, een Gina, René en gewoon wat random filmpjes. Veel kijkplezierrrrr Omdat René deze week toch lekker bezig is met z'n Engels doen we het nog een keer met comedian Russell Howard! Bekend van DEZE en DEZE classics en natuurlijk van zijn vorige optreden in DumpertReeten.Russell is deze week in Nederland en staat vanavond in Rotterdam en later deze week in Amsterdam. Er zijn nog wat kaarten, dus CHECK ZIJN WEBSITE! Wil jij ook een dashcam van Viofo? Gebruik de kortingscode "DUMPERT" op viofo.nl voor 10% korting op ALLES!Niet alleen scootertokkies knallen door rood deze Dumpert Dashcam compilatie... Wielrenners zijn hun leven niet zeker! Jullie zijn egoïstisch in bed, allemaal. Beetje alleen maar aan je eigen klabanus denken en dan je partner de tyfus laten krijgen. Waarom denk je dat die satisfyers zo populair zijn? Omdat jullie er geen reet van bakken dus. Nou ging Gina ging de straat op in Utereg en bevroeg de mensen naar hun kloof. Kijk af en misschien leer je nog wat.'''
