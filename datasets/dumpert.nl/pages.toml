title = "DUMPERT"
description = "De plek voor je dagelijkse entertainment. Met de leukste filmpjes en foto's voor als je even geen zin hebt in werk, studie of menselijk contact. Hoofdsponsor van Nederlandse zolderkamers."
full_description = "Op de N11, afslag Bodegraven. Gevarenlichten aangedaan en geblokkeerd voordat hij nog 200m op een actieve rijbaan naar achteren reed. Bowling is een sport waarbij de speler door middel van een bowlingbal moet proberen om alle tien de pins omver te gooien. Bowling is ontstaan uit het aloude spel kegelen. Proost! Dag iedereeeeen! Ook deze week gaan we weer de grens over. We gaan namelijk bij Koen Crucke/Albert Vermeersch/Alberto Vermicelli/MC Spaghetti op bezoek! De aflevering staat vol met Belgische klassiekers, Nederlandse weektoppers, een Gina, René en gewoon wat random filmpjes. Veel kijkplezierrrrr Dronken gek rijdt met hoge snelheid achteruit door het centrum van Noordwijkerhout. Biertje teveel op. Op de N11, afslag Bodegraven. Gevarenlichten aangedaan en geblokkeerd voordat hij nog 200m op een actieve rijbaan naar achteren reed. Nadat kabouter plop de hele dag kinderen heeft moeten vermaken was het nu even tijd om wat stoom af te blazen in de kroeg. En dan moet je hem niet voor de voeten lopen."
