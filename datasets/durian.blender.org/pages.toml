full_description = "« New team member! F12-time » Scene 01 Layout on January 31st, 2010, by Colin Levy Over the past few weeks I’ve started doing “Layout” work for Sintel. Layout is the stage where we figure out the basic character blocking (in this case choreography), camera angles and movement, as well as the timing and rhythm of the edit. At this point the sets and environments are also roughed out in low-poly form. The design of the environments greatly influence blocking, as well as composition/shot design. Much of these decisions have already been sketched out in storyboards, but layout makes the parameters of sequences much more concrete. Here is what the opening scene currently looks like: Much is subject to change. (Especially the first shot.) Predub sound by Jan Morgenstern. I welcome your feedback! –Colin This entry was posted on Sunday, January 31st, 2010 at 5:10 pm and is filed under First Minute, Production, Videos. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 148 Responses to “Scene 01 Layout” Gwilwileth Says: January 31st, 2010 at 5:20 pm First ! Awesome work !! =D Keep it on ! epsilorn Says: January 31st, 2010 at 5:21 pm I find difficult to judge from something this raw. It seems really good to me, the only shot I don’t get the meaning of is when guard feet are filmed for such a long time. Ankit Pruthi Says: January 31st, 2010 at 5:25 pm Everything looks great so far. But i have one critic – Is it just me or the action is quite slow and could have been faster?? Alexander Carby Says: January 31st, 2010 at 5:26 pm This animating/layout really does draw me in as a movie (despite it’s appearance) I can imagine why it’s helpful to make all those creative decisions at the early stages. Terrific stuff Colin (and co!). Nothing kills the process and morale more than rendering something for the third time because it wasn’t thought out right Kintaro Says: January 31st, 2010 at 5:28 pm at 1:03 since you enhanced the walking towards Sintel, it would be cool if instead of throwing a rock, she did some kind of leg sweep to spin jump standing up and then while he was falling impale him into the ground. But it also depends on the emotion you want to carry there I suppose, as an act of desperation or one of focus and determination. MuMu33 Says: January 31st, 2010 at 5:30 pm Howaa! Very violent for a cartoon movie. 😀 For a first layout, it’s great. Month3d Says: January 31st, 2010 at 5:38 pm awesomeness 🙂 really looking forward how this turns out in the end 🙂 bautz Says: January 31st, 2010 at 5:38 pm Wow, wonderful work! But the action seems quite slow also for me, especially at time 0:37-0:41 ITrAB Says: January 31st, 2010 at 5:40 pm Ooohh, i can’t wait for detailed renders of this! Detailed eye shot when Sintel is getting nervous xD It must be epic! If not, I don’t buy it 😛 @Ankit slow first scene = epic ending 😀 @MuMu33 you’re not watching anime right? xD Consideringthepickle Says: January 31st, 2010 at 5:56 pm The rhythm seems pretty good. The choreography is really cool. There all on a flat plane though. It’s not a very dimensional fight in terms of high ground and low ground so it doesn’t necessarily give off a big epic feel. It seems more a grueling struggling fight at the bottom of this valley… which is perhaps what you’re aiming for anyway, just a little unexpected for a big epic movie opening. The opening shot seems cool, but its really slow, and its sort of screaming Hey, I’m an establishing shot, look at me! It sort of sizes the entire scene up right from the getgo too. This may sound absurd if you’ve done a lot of work on the mountains already but sometimes not establishing the scene will make it more exciting and epic… To do the entire scene from ground level behind Sintel would really put us into the action and create a sense of What’s hiding and waiting beyond those mountains? rather than oh we’ve already seen the entire mountain range and she’s in the middle of nowhere fighting 3 guys. I just saw JAWS for the first time this week. It’s not really a movie you’d think to look for inspiration from for this type of project but the cinematography and the way the story unfolds is done brilliantly with a stroke of genius, and the shark isn’t actually seen until like 2/3rds of the way through so it really creates an ominous sense of buildup to what’s underneath that water and I think some of that technique could be adapted here for Sintel in some ways to make it even more epic. Anyways, just some suggestions. It’s looking pretty cool. I like the part where the guy eats it over the cliff and the way she takes out the last guardian, although it seems like she loses her weapon a little too easily and then the guardian seems to approach her way too slowly… Maybe you could speed that up and possibly have him actually jab the ground as she’s rolling to dodge him a couple times before she manages to hit him with the rock. It would make it more believable and exciting, and it’d be kinda cool if its so fast you don’t quite know what just happened, you just know it was awesome and you have to go back and watch it again after the movie’s over. I think it’ll look really great with like snow flying and facial expressions and everything. Quick close-ups on faces would be really cool in the middle of this. Although zombie Sintel is pretty creepy awesome lol Great choreography and nice pass! Roy Says: January 31st, 2010 at 5:56 pm The opening shot is great and draws you not only into the environment but the action as well. But I agree with Ankit Pruthi that the fight looks a bit slow. For instance in 0:52 the red guy does nothing instead of attacking Sintel from behind. Moreover, it’s not clear why she loses conscoiusness at the end. She wasn’t hurt in the fight – at least not obviously. And where is the fourth guard? But maybe the latter two points will be revealed later in the story. Sympodius Says: January 31st, 2010 at 6:03 pm Whoa. That looks intense and intriguing. I think that’s the exact right feel for the opening. pb Says: January 31st, 2010 at 6:04 pm Looking good Colin. Looks like you have it mostly in check but one thing to keep an eye on is the ‘waiting around’ of the other characters not immediately involved in the fight. That can be annoying and unbelievable in some action movies – “Hey, I see my buddy getting the crap hammered out out of him… anyway, I’ll just stand around, wait for a bit and I’ll only engage in fighting once my buddy’s stunned or dead.” Realistically, they would probably all attack her at the same time to increase their chances of succeeding. Not being seen ‘on camera’ or being preoccupied with something else (picking themselves off the ground, for example) are ways around this. Once place I’d expect them to react quicker is when the first bad guy gets killed – the reaction of his companions seems a bit slow. That said, this is just the layout stage so maybe facial expressions, etc. may lend more to how this eventually plays out. For example, in the opening close-up of the fught, facial expressions could indicate to the viewer that the bad guys are thinking, “Hey, this is only one puny little girl – only one of us could take her.” Once the first guy bites the dust, the other two change their facial expression to think, “Oh oh, this isn’t going to be so easy – she’s a tougher cookie than we expected!” MuMu33 Says: January 31st, 2010 at 6:10 pm @ITrAB: I’ve seen a lot of anime movies but I wanted to say that the design of this one is so cute (I speak about the main character) for violent anime. PS: I don’t know why but whenI clicked on my RSS flux the inputs text were already completed by the data of another person named rebecca. Be careful!!! erik90mx Says: January 31st, 2010 at 6:32 pm God!! is realy great, and only one question… there will be blood in this film? because honestly I did not expect this (although it is true that blood is now calling the attention of many young people)I sincerely have no problem but my little brother and other children are very “special” with these things (more the parents) Is a good job that are you doing here, I hope everything goes great!! Greetings Etienne Says: January 31st, 2010 at 6:39 pm Pretty cool. I will restate comments I already read: 1) Faster. We should watch the fight seen and have to go back and rewatch it again to grasp all was happening. Watch the movie the Last Samourai for a nice fight (the one with Tom Cruise near the end of the movie). 2) May be keep the surprise and don’t show right away that Sintel is fighting near the edge of a ravine. We should discover that while the bad guy go down. 3) Sintel is too easily disarmed. Should be more epic. Other than that, it’s really good and look promising! Keep up the good work! Sorry for my English! 🙂 gh Says: January 31st, 2010 at 7:02 pm Thanks for keep sharing the workflow, the steps of the production. Very educative! MeshWeaver Says: January 31st, 2010 at 7:19 pm pretty interesting 🙂 i remember seeing the storyboards, and not really understanding what was going on…lol “Here is what the opening scene currently looks like” – you mean, it might change again? 🙂 GO DURIAN TEAM!!! Riboshom Says: January 31st, 2010 at 7:26 pm “Sintel is too easily disarmed. Should be more epic.” Maybe that’s explainable by the facts that this is 4vs1, that sintel is not used to fighting in cold climates, that the guardians are supposed to be the bests of the bests? Outside of that, that would make a good scene! Riboshom Says: January 31st, 2010 at 7:28 pm Also, since this scene is 1:45 long (1:30 excluding the intro), how long do you plan the movie to be? Fredszaq Says: January 31st, 2010 at 7:41 pm Cool ! But, as it has been said before, it is a bit long and not enough active sometimes. a few remarks : – at 0:52 , the red guy is just behind sintel and not doing anything whereas he could easily kill her as she don’t see him. – I think it would be interesting to add fighting sounds at the end of the first shot (aprox at 0:15 when we see for the first time the the place of the fight, and gradually increase the sound) and, as Etienne said, sorry for my English^^ Revolt_Randy Says: January 31st, 2010 at 7:42 pm I’ve skimmed through most of the comments, and obviously watched the video. I think it’s looking really good so far. Bear in mind, this is just a rough draft, they are just blocking things in right now. Yes, maybe it is lacking some really fast actions that happen faster than the eye can see, but it’s also lacking other things. For instance, everyone appears to be sliding around, no one walks. So I am assume there is alot more to be added after the inital blocking is done. Then again, maybe I’m wrong and this a ‘Disney on Ice’ production, LMFAO…. Keep up the good work!!! Randy Buttons Says: January 31st, 2010 at 7:48 pm What is the purpose of the short squares sticking out of the ground? Like some sort of visual coordinate system? Jacob Valenta Says: January 31st, 2010 at 8:37 pm Thank you so much Collin! BTW i am satisfied 🙂 love the progress that is going on over there at the blender institute 🙂 Paulo Bardes Says: January 31st, 2010 at 8:42 pm I didn’t read all the comments so sorry if I’m saying something repeated… -The first shoot is good, but the camera isn’t moving organically, maybe it needs more rotation, it can looks like it’s been held by a helicopter or something like this. -The fight can be a little bit faster, and in 1:15 why does she roll over the guy? -Congratulations all the rest is awesome, especially the camera angles. Good lucky guys an sorry if I made any English mistake. (I’m from Brazil) wo262 Says: January 31st, 2010 at 8:45 pm hahahha. suzzane to him face. i would be nice see some easter eggs in final movie DwarvenFury Says: January 31st, 2010 at 8:46 pm I agree that it seems a bit slow, at the moment. Also, instead of the rock, couldn’t she just throw snow, like Indiana Jones does with sand in Raiders of the Lost Ark, to disorient the guardian? That might make it seem less serendipitous in that she just so happened to end up with a loose rock within arms length and instead highlight her resourcefulness. Just a thought. 😉 Peter G. Kovacs Says: January 31st, 2010 at 8:50 pm I can’t say anything about the timing or about the easy disarming, I just not understand the violence what you hold in your movies. I thought you made one with the bunny, and you an go forward with new theme. Sorry, but I can’t understand this tech-demo with this content. Sorry for my bad English wo262 Says: January 31st, 2010 at 8:57 pm are you going to animate the slashing through cloth and flesh ? anonymus Says: January 31st, 2010 at 9:19 pm Needs more epic. Knut Holmberg Says: January 31st, 2010 at 9:26 pm It reminded me a bit of Yojimbo, and it doesn’t get much more epic than that. I suppose that the poses of the guardians will make it more realistic, showing how hard it is for them, to all attack that one person at the same time. And they are standing on ice, are they not, slipping about? Making it hard for them to do anything coordinated. And that’s why it is so slow too? I thought that Sintels neutral, dead, face was rather effectfull. A girl with bigger problems than those guys. It works as an opener. It catches one’s attention, making you wonder: What will come next? Good luck with the rest! Knut Holmberg Says: January 31st, 2010 at 9:40 pm Only one thing more… If it is on a frozen surface, where did the stone come from? Icelump perhaps? Beacause it is a very handy prop lying just where it is needed, and wasn’t that lucky? And if you are looking for inspiration: “The Four Musketeers”, (1974) has a intresting fight on a frozen lake. (Though it is a bit more on the funny side.) Kinhe Says: January 31st, 2010 at 9:48 pm Great Work!! 😀 Keep it on ! tin2tin Says: January 31st, 2010 at 9:48 pm Looks really good! People, you have to be aware that there is a difference between blocking and editing. Two things I noticed one is the opening shot. If you want to establish the area/mountains try to merge it with the action – like a fast paced chase ending up at the edge. This will allow you to cut round the action and establish the mountains. Anyway I’m happy to see that the similarities with the opening shot of Blade Runner isn’t that obvious now as in the animatic. Another thing is when Sintel falls that it is less dramatic when she falls parallel with the edge instead of towards the edge. That would leave her with no escape route. One more idea – if the landscape is snowy Sintel could grab a icicle hanging from the edge and throw it as a spear in the face of the attacker. Anyway, great work! Paulo Bardes Says: January 31st, 2010 at 9:54 pm @anonymus Ton’s accent is awesome Danny Piccirillo Says: January 31st, 2010 at 9:58 pm Those first shots should be more sweeping and not so much at one steady pace Richard Says: January 31st, 2010 at 10:13 pm Re-watching it, the red "
