full_description = "« Durian Rigging 01 Modeling Dragons & Production Schedule » 1st Minute – Animatic on December 4th, 2009, by Colin Levy So. In a continuation of our “1st Minute” series, here is the current state of our Animatic! Keep in mind that this is *very* rough. The fight is literally a bunch of random drawings that look like a fight– there is no choreography and very little visual continuity between drawings. (This will be filled in later once we work out the fight with the kung fu guys!) The scratch dialogue has, uhhh… room for improvement. But check it out: Forgive the patchy drawings– unfortunately David left before he could get to work on the boards, so these were done by me. Rough sound design was done in like an hour by Jan Morgenstern. It totally makes it work! And guess who did the voices? Laters! –Colin This entry was posted on Friday, December 4th, 2009 at 2:40 am and is filed under First Minute, News, Videos. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 97 Responses to “1st Minute – Animatic” D Says: December 4th, 2009 at 2:44 am FIRST! And then, I’m going to read the post. 😀 So excited! :DDD kernond Says: December 4th, 2009 at 2:48 am Very nice, and thanks for sharing so much information about the progress of the project! Joe Says: December 4th, 2009 at 2:49 am I see the studio is already feeling the pain of David being gone. 😉 Storyboards are rarely glamorous though. This is very exciting to see and I can’t wait till we see some rendered frames!!! Keep up the great work guys!!! lsccpp Says: December 4th, 2009 at 2:51 am this are my guesses: Nathan and Angela Virgilio Says: December 4th, 2009 at 2:54 am It’s great to see how things evolve in this first minute. 🙂 It’s also amazing to see (or listen, heh) how important the sound design is. Even in this rough way it totally takes us into the film’s mood. moley Says: December 4th, 2009 at 2:57 am nice! the pacing seems alright, the sound really helps to bring together the animatic. loved the title graphic, looking forward to more! Shiretoko Says: December 4th, 2009 at 3:12 am @Colin: What happened to the small dragon falling from the sky into the city? was it replaced with the gatekeepers fight? Thomas Says: December 4th, 2009 at 3:14 am nice character introduction! It’s great u guys keep the community in the loop. Very entertaining and educational to see this project evolve ! keep up the goord work ! panzi Says: December 4th, 2009 at 3:16 am Quite nice. But I don’t think she should say this (“a dragon”) that early. She should say just “no” and be all mysterious and stuff. Or maybe in a movie as short as this, this won’t work and she indeed has to say it that early. I don’t know. Mano Says: December 4th, 2009 at 3:16 am Great job, guys, keep it up. And I’m looking forward to see the final dragon concept and model 😉 Eibriel Says: December 4th, 2009 at 3:20 am I like the male voice. The pronunciation. And the female too haha. D Says: December 4th, 2009 at 3:31 am Took me a while to calm down. The animatic is taking shape, and awaits a choreography. 🙂 Still imagined her falling over after the shaman told her that many had fallen to the Gatekeepers, though. But the voices! Angela as Sintel! 😀 I can’t quite put my finger on the shaman… I should know, he just sounds familiar, but not really… Can’t be Nathan or Colin, right? Maybe as the Gatekeepers in pitched-down form, but the shaman…!? Hmmm… Lee…?! Ben…!?! With the right mic, anything is possible. 😀 But seriously, now, I wonder if you are going for a quasi-British accent for all characters or just the shaman? Maybe it hasn’t been decided. Whatever, it’s good! I look forward to continue seeing this first minute improve, come into form and solidify. Meanwhile, I guess we’ll also continue reminding you, Colin, for the next Directorial Address. 🙂 BLIND_apprentice Says: December 4th, 2009 at 3:32 am NICE, I actually really like rough feel of these storyboards, it gives it a more hand-crafted visual style. Obviously it won’t look anything like the sketches, but I’d love it if that type of feel carried through into the final aesthetic. Also nice voice acting Colin and… Angela? Good stuff. tyrant monkey Says: December 4th, 2009 at 3:52 am this is a much nicer first minute than the first one and seems more economical and to the point and ends in a cliff hanger that makes me want to see more. great stuff guys Josh Says: December 4th, 2009 at 4:07 am was that a duduk at 1:22 ? if so I hope you guys integrate a duduk somewhere into the soundtrack (only if it is appropriate of course). loving the constant updates, I check back more than once a day just in case I missed one. Agus Says: December 4th, 2009 at 4:42 am Ahahahahahaaa dronix Says: December 4th, 2009 at 4:47 am Have we found two voice actors already? They actually fit the two characters pretty well! Thanks for the update, keep up the good work. Rob Cozzens Says: December 4th, 2009 at 5:14 am Very cool. As long as the team gets enough from the storyboards to follow your vision, they are fine. No need to make the movie twice! D Says: December 4th, 2009 at 5:14 am @Josh, Speaking of sounds we want to hear, I want to hear a Wilhelm scream in Sintel. http://www.freesound.org/samplesViewSingle.php?id=64940 I do think an ethnic instrument like a duduk is a great way to ground mythology into an action epic movie, as long as Jan is capable of wielding it, of course. 🙂 Phoinx Says: December 4th, 2009 at 5:26 am Ooh! It could be a trailer already! It’s lovely! Very exciting indeed! Nichod Says: December 4th, 2009 at 5:56 am I feel your pain. I’ve done storyboards for a few projects and after the first 100 boards it gets a little repetitive and tiring. But placed together with a score and animated in sequence it definitely is an amazing tool. In the first few boards it’s difficult to understand what is going on. Maybe make the wind movements more noticeable and add in some snow? The snow following the movement of the swirls of wind. Don’t forget the breath from the characters in the snow and the heat waves that their bodies will give off in cold weather! Anon Says: December 4th, 2009 at 8:29 am Hey guys, great work! Out of curiosity, why YouTube rather than Vimeo today and Tuesday? RH2 Says: December 4th, 2009 at 8:43 am Seems David is already missed 🙂 Paul Hastings Says: December 4th, 2009 at 7:43 am Wow, I like it. Keep up the hard work guys! -Paul ben Says: December 4th, 2009 at 9:10 am David is a lot of fun to work with on top of being ridiculously passionate and talented. Naturally we miss him. As it was pointed out though, storyboards are rarely glamorous and as a team, we know the script so Colin’s storyboarding works well enough to give us a visual picture of what goes where. Voices – Angela was Sintel, but Nathan wasn’t the shaman. Keep guessing… Nathan did do a hilarious take for both voices though. Think ‘my spoon is too big’ and you are most of the way there. 🙂 Title graphic was just a bit of fun because I wanted to do some painting after watching the animatic. Some ideas floating around, but we haven’t really put much thought yet into the title – ie how it looks, how it reveals, etc. Lots of things to try, but plenty of other gear to get on with for now. Finally, youtube seems to work as a service for a wider range of people. We need to get better at including ogg videos as a team, but I’m guessing Colin was up pretty late getting it finished and posted seeing as he was still working on it when I left. Also – multiple indirect lighting bounces are in Blender now as part of AAO, ie quick! Whee! Phoenix Says: December 4th, 2009 at 9:45 am Man-Lung Tang as shaman? Aligorith Says: December 4th, 2009 at 10:44 am Soenke as the shaman? taniwha Says: December 4th, 2009 at 11:36 am The voice acting for “I’m searching for someone I love.” wasn’t very convincing, nor “A dragon”. The problem is mostly the pacing, and a bit in the intonation (both lines sounded more like questions with their rising intonation). For the pacing, I think “I’m searching… for someone I love.”, with falling intonation, would work better. I have to wonder if Angela has watched a lot of dubbed anime. However, Angela’s voice itself is good. Keep her as Sintel 🙂 Also, I think the title graphic as it is works quite nicely. Stephen Says: December 4th, 2009 at 11:44 am when she’s drinking, her hair looks wet… is this a hair effect we can look forward to? the incredibles springs to mind 😀 Ton Says: December 4th, 2009 at 11:48 am Blender Foundation has a partnership approved by Youtube, we now can upload unlimited length high quality video, even without advertisement overlays. 🙂 I’ve contacted Vimeo several times to help us with something similar (to host our free and open content work), but they rejected. Their commercial offering would cost us 1000s of dollars per year… Axel Says: December 4th, 2009 at 11:50 am Of course I might be mistaken, but I would bet that Bassam was the shaman. irve Says: December 4th, 2009 at 12:06 pm When Sintel falls, there has to be a longer pause for the viewers to realize that she has fallen. It has to sink in. Then voiceover, then cut to inside. Please try stretching it 🙂 MD Says: December 4th, 2009 at 12:11 pm I actually think it sounds like Colin. Great work so far! Shinobi Says: December 4th, 2009 at 12:14 pm “Also – multiple indirect lighting bounces are in Blender now as part of AAO, ie quick! Whee!” Are you serious?!? Truly?!?!?!? AHAAAAAAHAHHAHAAAAAAAA!!!!!!!!! yagraph Says: December 4th, 2009 at 12:19 pm It bet It’s Colin 😉 Great animatic ! We perceive the lot of conception work you’ve done so far, and intro is so important ! Cheers 😉 Elubie Says: December 4th, 2009 at 1:07 pm Great animatic, the sound really does add to the atmosphere. After watching it three times, I think a different timing in two places, might work too. First when Sintel falls, the voiceover starts a bit too early for me. Since the viewer only sees Sintel, he’s still with her and the voice seems strange. Maybe start shortly after everything goes black since this makes the change of location plausible and the Shaman speaks these words in his hut. The other way would be more complicated, make the shaman enter the scene and find Sintel, speaking the words as he finds her. The second place has also been mentioned in another post – when Sintel reveals that she is searching for a Dragon, I feel that a pause where she hesitates a bit would add to the drama. For the fight, it took me a bit to get the feeling of danger that Sintel is in, but I think that is because I had trouble to decipher the fight choreography from the storyboards when viewing first. Anyway, for the first animatic it’s shaping up great! Andrea Tomas Says: December 4th, 2009 at 1:11 pm So far this is looking great! As some have mentioned Sintel coming right out and saying she is looking for “a dragon” seems too quick. Maybe she could say “a friend” or “someone I have lost” or just reply with “perhaps….” or some such to make it a bit more suspenseful. The progress is awesome and thanks for keeping us all informed. It really is great to see how a project like this evolves. poin Says: December 4th, 2009 at 1:29 pm Shiversssss…… Is amazing how good sound FX, voices and soundtrack makes even an animatic make you shiver. It will add a *lot* to the final film. (As a cold marketing thought: those will be emotions related to Blender). I’m really glad with the quality of sound you’re aiming. Are those sounds Creatice Commons? (I’m 100% sure the voice of the guy is Ton, he’s just hidding his dutch accent) ben Says: December 4th, 2009 at 1:57 pm @Shinobi – the indirect bounces are in Blender 2.5 trunk, doing some examples for a blog post now Mark Says: December 4th, 2009 at 3:10 pm Very Nice, getting very excited! With the script though, it sounds strange how the shaman says “a lover?” after Sintel says “someone I love”. The repeated word distracted me… Looking very cool, keep it up! D Says: December 4th, 2009 at 3:20 pm Multiple bounce AAO… GI! 😀 Shaman is… Brecht! Come on, it has to be! asanchezr Says: December 4th, 2009 at 3:30 pm Where’s the giant snail??? 🙁 🙁 🙁 🙁 I like it a lot!! Great job guys! You keep my soul inspired!! (and I bet not only mine) Giant snail giant snail!!! 😀 😀 😀 riccardo covino Says: December 4th, 2009 at 3:50 pm way better than before! that’s the correct choice for a short movie. you don’t have time to let the user enter progressively in the story, so the only solution is to put him right in the middle of it! after 20 seconds i was already totally immersed in it, forgetting the world outside and trying to understand what was going on (althought i knew since the bconf..), and the dialogue is really captivating, with the love’s ambiguity and the subsequent tension (a dragon? this is really a mistery!). i guess you can go on even without flash backs (or very short ones, 1-2 secs), letting us understand what happened before just by hints. anyway, first minute now has much more meaning, presenting the chars and the goal perfectly. lastly, you can’t introduce multiple bounces as a side note! this is really awesome, compiling right now… HARDHEAD11 Says: December 4th, 2009 at 3:59 pm I thought it was pretty obvious that Colin did the voice. grafixsuz Says: December 4th, 2009 at 4:00 pm Not bad, I feel the timing could be improved for the part where she falls in the snow as well. Great work though guys. I thought that Angela was Sintel, and not a bad voice neither. For the other one, I am leaning towards Brecht, I mean who else would it be? Lee? Soenke? Ben? Come on that has to be our hero Brecht. D Says: December 4th, 2009 at 4:13 pm Okay, so I did a little research. “My spoon is too big” -> Rejected -> Don Hertzfeldt So Don was in town?! Sverro Says: December 4th, 2009 at 4:36 pm Voice actor of shaman = Soenke! Realley nice work! I like it. kram1032 Says: December 4th, 2009 at 4:57 pm This is great! It really makes you wanna see more! Lasse R. Bruntse Says: December 4th, 2009 at 5:08 pm No no, the Shaman is Lee! Listen, he says ‘Soo’ in a very Lee-ish way! Btw. PLEASE put in the Wilhelm Scream somewhere like D said! Its the best insider-joke ever. Stephen Says: December 4th, 2009 at 5:18 pm “the Wilhelm Scream” someone been watching QI? 😀 jeff Says: December 4th, 2009 at 5:20 pm Will Sintel be mixed in surround (5.1) sound? It would really be awesome for immersing the audience into the blender studio’s best movie yet 🙂 I hope this will be the case and that I will be able to enjoy my DVDs on my home theater’s sound system! Gwilwileth Says: December 4th, 2009 at 5:41 pm I really like this intro ! One thing : If the 4 gatekeepers are still alive when we zoom on them, it would say that sintel kill’s them in a few 20 sec… I don’t know if it’s very realistic… and be carefull that you can place all the great choregraphy ! =D I bet for Colins voice ? ^^ Great acting Angela t"
