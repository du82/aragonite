full_description = "« Production updates Sintel full studio svn online » Jan Morgenstern nominated for Goldsmith awards on June 17th, 2011, by Ton Both the Sintel score and the Sintel credit song “I move On” have been nominated for a Jerry Goldsmith Award at the prestigious International Film Music Festival: http://festival.bsospirit.com/index.php/en/news/100-festival-07/265-vi-premios-jerry-goldsmith-los-nominados Great milestone for Jan Morgenstern, for the team and of course everyone who helped making Sintel possible! The festival awards will be announced July 22nd. Stay tuned, -Ton- This entry was posted on Friday, June 17th, 2011 at 2:25 pm and is filed under News, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 11 Responses to “Jan Morgenstern nominated for Goldsmith awards” Damian Says: June 17th, 2011 at 3:23 pm Oh Yeah! LPeti Says: June 17th, 2011 at 5:16 pm Happy to hear this Mitch Says: June 17th, 2011 at 7:01 pm Congratulations! D Says: June 17th, 2011 at 8:12 pm Congratulations, Jan! I hope you win! 😀 Michel Says: June 17th, 2011 at 8:56 pm Großartig! Hat mich wirklich gefreut. Jetzt nur noch gewinnen (beide)!!1! dave62 Says: June 18th, 2011 at 8:53 pm congratulations! nice to hear. ftw ..good luck jan! Nori Cartwright Says: June 23rd, 2011 at 10:40 pm I have begun work on a novelization of Sintel, which turns out to be a chapbook. If you have free time, stop by and read Part one and two (which is short). I hope I got everything right. Part 1: http://thesocietyondarun.wordpress.com/2011/06/06/sintel-the-novel-part-1/ Part 2: http://thesocietyondarun.wordpress.com/2011/06/21/sintel-the-novelization-part-two/ Please reply 🙂 Nori Cartwright Says: June 23rd, 2011 at 10:42 pm One last thing, I’d like to include an article about Sintel and a screenshot from the movie in my upcoming chapbook-zine, if that is okay. I’m sure it is, since Sintel is CC BY SA. Joeri Says: June 24th, 2011 at 10:08 pm Very cool. Le@ndro Says: June 26th, 2011 at 5:01 pm Wow!!! So everyone is having fun and recognition… so glad! Matahari Says: July 1st, 2011 at 5:38 pm Congratulations. I like the the song too."
