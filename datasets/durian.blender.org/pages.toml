full_description = "« Sintel hits a million views on YouTube DVD masters sent to printer » Opportunity: stereoscopic Sintel on October 7th, 2010, by Ton Although Sintel has been released, we will still continue to work on re-rendering the film in 4k format (3840 pixels wide, for digital projection or screens). This is being sponsored by the Amsterdam Cinegrid consortium, and will be available (tentatively) end of 2010. As last and ultimate target we also would love to be able to deliver the film in stereoscopic format. We believe that an open and free accessible ‘stereo 3d’ film has a great potential to become a worldwide test and evaluation standard. It’s currently even open to deliver this in stereo-4k! Blender Institute intends to produce this with the highest quality possible, which means that all shots in the film will be carefully (re)designed by an experienced stereographer assisted by experienced Blender artists. We also want to spend considerable time on optimizing and implementing an efficient stereographic editing workflow in Blender (camera tools, integrated render, compositing). You can e-mail Ton Roosendaal to get further information about this sponsoring opportunity. -Ton- This entry was posted on Thursday, October 7th, 2010 at 1:23 pm and is filed under Development, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 69 Responses to “Opportunity: stereoscopic Sintel” Pablo Vazquez Says: October 7th, 2010 at 2:03 pm Come on Sponsors, get a free as in freedom stereo movie to test, and as a side effect we get improvements on Blender itself! 🙂 zikzak Says: October 7th, 2010 at 2:08 pm That sounds very good ! kakapo Says: October 7th, 2010 at 2:17 pm isn’t it important to avoid too fast cuts for 3d? would the movie be recut then? wouldn’t that also require changes to the sound track? Ton Says: October 7th, 2010 at 2:32 pm It’s not about fast cuts, but about not moving your focus points around too fast. It takes about half a second to adjust from a close to a distant focus. Limvot Says: October 7th, 2010 at 2:39 pm I’m really excited about this, it would be great to implement some sort of official feature or script to do this. Have you considered adding the ability to render with multiple cameras in one scene? It seems to me that that would make stereoscopic renderings much easier while still retaining the flexibility of a do-it-yourself approach and would have a multitude of applications beyond stereoscopic rendering. Thanks for all you guys do! D Says: October 7th, 2010 at 2:52 pm Man, this could be great! 😀 Do your best, Ton and team! mza Says: October 7th, 2010 at 3:07 pm For some reason the answer of this thread aren’t displayed 🙁 Simone Says: October 7th, 2010 at 3:32 pm Blender will be unbeatable!!! Next step take over the world!!!! panji_alam Says: October 7th, 2010 at 3:35 pm Then, it will not surprise when some company will use Sintel to demo their 3D TV/monitor in near future. revolt_randy Says: October 7th, 2010 at 3:37 pm I think it’s a great idea!! I am curious as I have been reading up on steroscopic techniques. Would this be done in the anaglyph style (red/cyan colors) or the newer polarized techniques used in modern movies? young_voter Says: October 7th, 2010 at 3:56 pm Maybe we should also have Sintel The Redux Edition, rerendering with new lighting and textures. W Says: October 7th, 2010 at 4:04 pm An excellent thought! With stereo being all the new rage, an open 3D movie would be huge, far more than BBB! Just imagine going to an electronics store and seing ten different 3D screens standing in an aisle, all running Sintel. dusty Says: October 7th, 2010 at 4:43 pm I think I may have just wet myself at the potential of this!!! tyrant monkey Says: October 7th, 2010 at 4:49 pm This sounds very cool, I hope some sponsors step up to the plate. I am curious would some of the effects have to be redone. Perharps I don’t look carefully enough but when Scales breathed fire in the cave some of her flames looked very flat and not really volumetric. This wouldn’t really work for 3d or is there a way around this. Shane S. Says: October 7th, 2010 at 5:53 pm What formats would the ‘stereo 3d’ be released in? Would it only work on 3D capable screens, or would there be a red/cyan glasses version? (even though you lose color quality with red/cyan glasses, it would still be nice) Also, small typo: “stereographer assisted by experiended Blender artists.” should be experienced 😉 Dan Says: October 7th, 2010 at 6:05 pm That’s simply great! I’m sure that your’re absolutely right when you consider Sintel 3d 4k as an worldwide test and evaluation standard. I wonder that this is doable with your budget, but I’m very glad to see now that stereoscopic Sintel will be realised. Have luck! David Jordan Says: October 7th, 2010 at 6:11 pm Why is it being rendered at 3840 (with horizontal height of 1634 I presume)? That seems significantly smaller than the 4k DCP standard, since it leaves extra pixels unused both horizontally and vertically as opposed to the scope or flat standards. 3840 is exactly double 1920, but wouldn’t proper scaling from 4096 work just fine too, since you have all of that resolution to scale from anyway? @Shane: It would make sense to me that they just render it normally with two cameras and tint or polarize the images later. That way they can provide either as needed. 3dementia Says: October 7th, 2010 at 6:13 pm This is a wonderful move. I am very interested in what technology you will be using. (btw: experienced- typo) Dan Says: October 7th, 2010 at 6:14 pm I can submit comments and on start page there’s written about 16 comments or so, but I cannot see one of them! WHERE ARE THOSE COMMENTS GONE?! Dan Says: October 7th, 2010 at 6:28 pm when i open http://www.sintel.org/production/opportunity-stereoscopic-sintel/ then I cannot see any comment 🙁 Only when I open pages like http://www.sintel.org/production/opportunity-stereoscopic-sintel/comment-page-2/#comment-22632 or http://www.sintel.org/production/opportunity-stereoscopic-sintel/comment-page-1/#comment-22627; Only then I can see the comments ?!? What’s wrong ?!? LOGAN Says: October 7th, 2010 at 8:33 pm Having an Stereographic open movie would be great, hardware and software vendors can use it to show off their tech, great for Blu-Ray 3D and various other things. This will also be great to have Blender support stereographic rendering. Who knows, that next project you dream about… integrating CGI into a stereographic life action movie would be an option. This is a great opportunity on many levels. dusty Says: October 7th, 2010 at 10:39 pm This would be the most amazing thing to come out of Blender yet if you pulled this off!!! Bao2 Says: October 7th, 2010 at 10:48 pm What about a new camera type in Blender that renders 3D. It can have a target empty that is where the two cameras are focusing. In the camera parameters we can enter the distance between the two cameras (around 7 centimeters to mimic our vision, or we can change this value to make things look like miniature or so). This camera would render frames in side by side with all the options you can see in youtube 3D videos (left image is left eye, left image is right eye,… and so) CoyHot Says: October 7th, 2010 at 11:10 pm I wrote more than 20 pages for “Blender Art Mag” issue 28 on Stereoscpic rendering using Blender. I talked about stereoscopic theory in general and how to create it with Blender 2.5. I don’t know if you already read it, but it may help .. ;o) I recently make 2 stereoscopic jingles for the “Canal+ Group” only using Blender (HD and 3D). After that, i wrote this article to help the community to produce 3D content using Blender. Those jingles was created for the last Soccer World Cup and have been broadcasted all other the world. ;o) Thank you Blender ! PolygoneUK Says: October 8th, 2010 at 12:09 am With regards to which ‘format’ it should be produced in, I’d prefer it if the Blender Foundation rendered each eye (Left and Right) at full 4K resolution rather than creating a pre-mixed anayglyph, or a half-resolution side-by-side/over-under image. I’d also like to see the result devoid of any “3D floating windows” used to mask the parallax difference. Align the convergence points and crop accordingly to retain the 4K frame. I would also prefer parallel stereoscopic cameras rather than convergent ones (toeing in), as convergent cameras usually introduce keystone distortion at the frame edges. If they create the left and right eyes separately they can then let the end user choose how they wish to use the eyes: Be it anaglyph, Colorcode(©), twin-eye polarised cinema playback aka RealD etc… JaydenB Says: October 8th, 2010 at 12:15 am If the 3d format is created, it would be made by rendering the left and the right eyeimage separately, but there would be a pre-mixed version as well, for whatever systems Ton chooses. jorge moonito Says: October 8th, 2010 at 12:46 am beotiful work congratulations i love de art direction Elcrapocrew Says: October 8th, 2010 at 3:46 am I think I remember this being brought up before when the durian project first started getting underway, but what about setting up some kind of distributed rendering service. Something like BOINC could work nicely. If I remember correctly one of the reasons this was not done initially was the in house render farm that was being built. However, you are now talking about rendering the movie twice @ 4k res. That is going to seriously up the total render time! A distributed render system could potentially tap into MILLIONS of computers world wide. I know there are technological hurdles that would need to be overcome, but there were problems to solve in the making of Sintel too and a small team of dedicated blender heroes showed it could be done. It seems to me to be an idea with merit that deserves some serious thought. ChrisV Says: October 8th, 2010 at 4:57 am oh in 3D?! woah..that’s cool! Cheers for Ton & the Team 🙂 ChrisV Says: October 8th, 2010 at 4:59 am wow in 3D?That’s awesome! cheers from Indonesia! ejnersan Says: October 8th, 2010 at 5:36 am I’m admittedly not a big fan of S3D, but I am glad to see that the Institute will use an experienced stereographer, and not just render out a parallel/converged/off-axis 2. camera. Really makes or breaks the experience. Really happy to see that some work will go into the camera! Exciting times 🙂 Neoranga Says: October 8th, 2010 at 6:27 am Can’t wait to see it on youtube => “sintel yt3d enabled true”, cross view mode XD belich Says: October 8th, 2010 at 6:33 am You people never get tired of work, dont you? Lets see how it will look, ill have my red-cyan glasses readdy =^.^= Richard Says: October 8th, 2010 at 6:53 am I know I for one, would love to see Sintel in 3D. Hopefully someone will come to your assistance. Wolfgang 'datenwolf' Draxinger Says: October 8th, 2010 at 1:48 pm Some of you may have read it: I’m currently re-rendering ED in stereoscopic 3D. It may very well by, that the workflow I created for this may influence the Sintel 3D version. If you wonder how Elephants Dream looks in 3D, take a look here: http://www.youtube.com/watch?v=T8wNk6vVjK4 (I strongly suggest to use the Dubois method if watching with Red-/Cyan glasses) D Says: October 8th, 2010 at 2:59 pm That 3D-ED sneak peak would look so nice on an IMAX sized screen than on my little netbook. 😛 How about a greater camera separation for mini-sized web versions? Dan Says: October 8th, 2010 at 10:35 pm Ah! I can see the comments again! what went wrong? Donna Says: October 8th, 2010 at 11:44 pm This animation is horrible and ugly. It is not beautiful. It is disgusting. You could do so much with technology and yet you waste your time with ugliness. Josh Says: October 9th, 2010 at 12:52 am Love it! I had this idea earlier for the team but was put aside due to re-rendering issues 🙁 Now they have sponsors I guess its a Green Light 🙂 I would help but currently I got BBB and Elephants Dream being re-done in Anaglyph and polarized (Same thing really! Only needs one re-render and the rest is done in the compositor 🙂 ) I will have to talk to ton about what he thinks!! JD Joey Says: October 9th, 2010 at 8:44 am This is pretty cool Josh Says: October 9th, 2010 at 11:10 am @Donna No its not the movie is GREAT noeol Says: October 9th, 2010 at 3:56 pm For those who wants to try an Off-Axis Stereo Camera, here is a simple Python script for Blender 2.54 beta: http://noeol.de/s3d/BStereoOffAxisCamera_0_5_5.py And here is the video tutorial for this script: http://vimeo.com/15671492 Info to Off-Axis (parallel camera rig): instead to setup a ‘toe-in’ camera rig (which always produces vertical parallax) it’s possible to shift the virtual ‘back pane’ of the camera in Blender via the ShiftX value. The script calculates this shifting in pixel, depending on the camera separation; angle and distance to the zero parallax. The most professional stereo-3d movies these days, are using this technology instead of ‘toeing-in’ cameras. Wolfgang 'datenwolf' Draxinger Says: October 9th, 2010 at 5:12 pm @noeol: Funny fact, James Camera fusion camera system uses toe-in optics but uses postprocessing to backdistort the picture into one like it was shot with a off axis + lens shift. JaydenB Says: October 10th, 2010 at 1:24 am @noeol: I’ve been using your scripts for a while, and they are very useful, very high quality, good results. Only thing is, is it possible to keyframe where the plane is, would I have to keyframe the value and then would the plane animate or not? (I said plane mainly because I forgot what it was called, was it called the convergence point or something along those lines?) Josh Says: October 10th, 2010 at 1:54 am @JaydenB I believe it is called the ‘Zero Parallax’. And yes I have been using his scripts for a while but have also edited them for my own use. For example I have directly inserted his code into the blender camera panel using blenders python API so that every time I open blender it is there and I don’t have to run it again. Secondly I have set it up so as it is a new type of camera and not 2 cameras parented and shifted around another one. For example if you select the existing camera and tick the ‘Stereoscopic Camera’ box it then turns it into a stereoscope camera but it is still ONE object in the screen. Thirdly I have added a few new options to the node editor: (1). I added a new ‘Input’ node that takes an input from a CAMERA. When rendered if it has two camera inputs the renderer automatically renders from both cameras and composites it. (2). I added a ‘Stereoscope’ node to the ‘Filters’ menu that has two inputs and one output which basically takes in the two cameras/images etc. and outputs them as 1 of 2 different options. There is a drop-down box in that node that allows for a) Anaglyph and b) Side-by-Side output. Last but not least (3). Instead of having to key-frame"
