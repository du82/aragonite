title = "Sintel, the Durian Open Movie Project  » Blog Archive   » Background Character Sprint: Details"
description = "Sintel, the Durian Open Movie Project"
full_description = "« Community Sprint: Background Characters! Guardian Overhaul » Background Character Sprint: Details on March 27th, 2010, by Colin Levy For the sake of clarity, I thought we’d just post all the sprint-related info to the blog. First, to answer some questions. The sprint will be taking place this weekend. We will be sporadically available throughout all of Saturday and Sunday. This is the time when we will be monitoring progress, giving feedback and direction, assigning tasks (if necessary) and hopefully maintaining a live stream on ustream! However, we know this work takes time to do well, and we will be accepting submissions all throughout this week, ending at the end of next weekend, on the 5th of April. An important instruction for everyone: When you start working on something, please add your name and what you’re working on to this wiki page: http://wiki.blender.org/index.php/Org:Institute/Open_projects/Durian/Sprint/Assetlist2 This helps everyone keep track of what everyone else is doing. Also feel free to link to WIP images/animation next to your name. Also, for now we’re holding off on animating kids, because we don’t have a rig for it yet. So please stick to animation of adults. Keeping the modeling focus on adult characters is also a good idea. If there are kids in the market, they will be in the minority. Background info A little background info about the world our movie takes place in to get your minds going: The world of the film is sortof a medieval fantasy. So technology-wise, we’re talking 1600’s or earlier. Dragons, obviously, exist in the world, as do other fantasy creatures. But these creatures primarily exist in legend. The city is populated only by humans. The city of Ishtar is decaying. It used to be grand and rich, with a prosperous population, but it was destroyed by religious war and drought and the following famine. Apart from the wealthy few, most people who live there struggle to survive. They are a hardy bunch, a bit possessive and curt. Character Modeling Lets start with some model sheets! We need city background characters modeled! A bit of common details in David’s character designs: Crossed belts/leather, patched clothing. Only basic jewelry. Simple tools, simple weapons for defense. Uncut hair and tattoos are common. Character List: – Market Vendor/Seller – young or old, boots/leather equipment/armor okay. Like Sintel’s design. – Loud and busy. – Commonfolk – young or old, maybe primarily women doing the buying – simple clothing – Ishtar guard. Man of authority. – Religious man. ========== Instructions: 1. Download simple biped adult rig for proportion and size reference. If you like, you can also download a couple of our character files as a starting point (links provided below). 2. Hop on IRC #blenderdurian on freenode.net. 3. Look at the example concept art and reference 4. Create your model based roughly on the size and proportions of the simple adult rig, and based roughly on the concept art. Variation is strongly encouraged, but try to keep the size and proportions within the “adult” range, and keep the pose similar to the simple rig. 5. Post progress to the IRC channel. Pasteall.org is a great site for uploading your images. 6. When you’re finished, rename your blend file “description-name_for_credits.blend” Replace “description” with a simple 1-3 word description of the model, and “name_for_credits” with the name you want us to use to credit you in the movie if we use your model. 7. Upload the file to blendswap.com under the Durian Category (IMPORTANT!). Note that by uploading to the Durian category, you are licensing your model under a Creative Commons Attributeion “By” 3.0 License. Other: Don’t worry about fitting your character to the rig. We’ll be building custom rigs for the characters we use. Just use the rig size as a reference point. Where possible, minimize multi-layered flowing clothing (skirts, dresses, capes) as this is tricky to deal with on our side for animation. If you add hair, do it with particle strand hair. Model Downloads for Reference and Reshaping: Final Sintel Model: sintel_model.blend.zip Ishtarian Woman (by Jonathan Williamson): ishtarian_woman_01.blend.zip Tanner (by Jonathan Williamson): tanner.blend.zip Simple Biped Adult Rig: simple_adult.blend.zip Character Animation What we need: Walk cycles: – Adult – Elderly – Kids (lower priority) Misc market place stuff, for example: – Person browsing at a market stand – Person tending a market stand – Person paying a vendor – People sitting on boxes, resting their legs – Two people bartering – Anything else you can think of Specific shots: – Person pulling a cart, coming to stop (cart model provided below) – Person startled by Sintel run/dodging around them (video clip provided below) ========== Animation instructions: 1. Download simple adult rig (link provided below) 2. Hop on IRC #blenderdurian on freenode.net. 3. Look at the list of animation tasks/ideas (listed above) 4a. Pick one and work on it. You can ask one of us if there are any items that we don’t have enough of yet. 4b. If you pick a “specific shot” (above), please ask for further instruction. The requirements for these are… specific. 5. Animate the character directly in the rig file. Please *no* NLA. Work within a single action (NLA is difficult for us to transfer to other blend files). If you don’t know what any of that means, you’re probably fine. Just animate. 🙂 6. Post progress to the IRC channel. You can upload videos to youtube or vimeo, or upload video files to our public ftp (information below). 7. When you’re finished, rename your blend file “AN_description-name_for_credits.blend” Replace “description” with a simple 1-3 word description of the animation, and “name_for_credits” with the name you want us to use to credit you in the movie if we use your animation. 8. Upload the file to blendswap.com under the Durian *and* Animation categories (IMPORTANT!). Note that by uploading to the Durian category, you are licensing your animation under a Creative Commons Attribution “By” 3.0 License. Other: Walk cycles can either be animate in place or moving forward. We don’t really care. We can use it just as well either way. All animation should be 24 frames per second. Non-looping animation should be 3-4 seconds long (our longest shot in these scenes is 4 seconds). Files Simple Biped Adult Rig: simple_adult.blend.zip and video tutorial on youtube and as ogg Cart Model: person_cart.blend.zip cart_pull.jpg And here’s a short clip from the market scene. Each of these shots should be pretty much filled with people. 🙂 market.mov Alt: market.ogv (Spoiler alert. But it’s really not bad. You won’t have any idea what’s going on. :P) Public ftp info ftp to: download.blender.org user: anonymous password: your email address When logged in, go to the directory “incoming”. What you put there is visible here: http://download.blender.org/ftp/incoming/ Please keep files to reasonably small file sizes. OKAY, I think that pretty much does it!! Let’s do this thing! –Colin & Nathan This entry was posted on Saturday, March 27th, 2010 at 2:45 am and is filed under Concept-art, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 42 Responses to “Background Character Sprint: Details” Eibriel Says: March 27th, 2010 at 2:58 am All the characters are soooo cool 😛 Jayden Says: March 27th, 2010 at 3:12 am Yeah. lets get started now! toontje Says: March 27th, 2010 at 3:18 am Don’t forget the handicapped townsfolk too, the leper, the guy with crotches, a legless old soldier in a low kart and such for texture…. Jayden Says: March 27th, 2010 at 3:22 am Do we need to rig the characters we model? Danielonson Says: March 27th, 2010 at 3:31 am Hi im so happy with this sprint , it would be helpful get a layer reference to the rigging , to know where is everything, because i can’t find the fingers drivers D Says: March 27th, 2010 at 3:55 am Great! 😀 For reference to the cart pulling animation, if I am not mistaken, it is more ergonomic and efficient to pull with your elbows to your side and forearms ahead, and definitely NOT by dragging your arms behind you. Videos of rickshaw pulling make good reference and demonstrate this. http://www.youtube.com/watch?v=XEeTmWA1ALI Unfortunately the height of the cart doesn’t lend itself too well to that. What to do? Small animation critique on the market scene! 😀 The way Sintel stopped on second 4 isn’t right. She should have taken an additional step to the side she was moving in so she could push better on the ground and stop in the manner depicted. Otherwise, the majority of her deceleration was when her leg was practically perpendicular to the ground, which normally is impossible and means she will topple over. Please fix it? 🙂 Model sheets for the win. This sprint will be amazing. 😀 MTracer Says: March 27th, 2010 at 4:37 am Which version of Blender do we use? Educonter Says: March 27th, 2010 at 6:11 am Hey guy’s nice work i have been following you guys from the start and it’s so great to see such astonishing work of yours all open for us. Frank_robernson Says: March 27th, 2010 at 6:13 am Okay question why not make us a simple character using Sin-tel then we can all change things like hair color eye colors and clothes etc…weapons as long as we have a base I think we can all do our part, its more simple for yous and simple for us I think, I’m free to do something. Wasa Says: March 27th, 2010 at 8:11 am @ Frank That works to some degree, but meshes and topology need to be character based. They have supplied models for those that wish to make edits only. Just as a for instance, when you see a piece that uses a poser model. For most it’s the first thing they notice. N.A. Says: March 27th, 2010 at 9:09 am I´m not very good at charactermodeling and animation. Are there any only-modeling-tasks in this sprint? I really like the timing of the sintel-scene! tin2tin Says: March 27th, 2010 at 9:43 am Just looked at the animatic. I had to run it several times, before I realised why the camera tilts up in the end of the first shot. Simply because the eye focuses on the part of the image with most motion. So I keep looking at Sintel even though the camera tries to force me to look elsewhere. You could consider a reverse shot (in “birds view”) instead of the tilt. That way the biggest moving part of that shot will be, what the tilt tries to tell us. (trying on to spoil) 😉 Another thing is the theory of cutting on “eye scan”, meaning when you make a cut the eye will be looking at the same spot the action was in the previous shot even though takes place somewhere else in the next shot. If you want a smooth cut you want to place the focus point in the same area before and after the cut. To be a bit more speciffic the if Sintel stopped in the right side of the 2. shot the cut to the 3. shot would be more easy on the eye. Actually I would cut to a close up of Sintel before cutting to the over-shoulder shot. A c.u. leads better to a p.o.v. or o.s. shots than wideshots. I guess it’s like saying ‘this person…’ ‘sees this…’ BTW. the theory of eye-scan editing doesn’t comply to dialog scenes, because it mimics that in real life you would look from one person to the other natually(like a tennis match), and therefore it properly feels more correct if the characters are placed in each side of the frame with most space in front of the face. Mike Says: March 27th, 2010 at 10:35 am Are you going to have any Dogs or Cats or birds etc hanging around too? Walking through a market there’s always a lanky dog and a yappy little ankle biter hanging about the stalls. Seagulls hang around nagging for food also….. Just a thought. Mike. Carsten Says: March 27th, 2010 at 12:43 pm I see little pink dragons now everywhere… dd Says: March 27th, 2010 at 12:45 pm it’s interesting 🙂 Jayden Says: March 27th, 2010 at 1:58 pm yes. Very interesting. 🙂 futar Says: March 27th, 2010 at 2:02 pm I can’t get the ‘torso’ bone in the ‘simple_adult.blend’ to do anything. It seems to be locked or something. How do you get it to rotate and twist the upper body? Also, how are you supposed to bend/curl the fingers? Jayden Says: March 27th, 2010 at 2:51 pm for the fingers, search throught eh bone layers. It is bone layer 4 I think. For the torso, update blender, by goign to graphicall and downloading the latest realease for your os. P@ddy_anim Says: March 27th, 2010 at 2:58 pm i get the following when i type /join #blender Not connected. Try /server [] how did i find get and give that info to x-chat? P@ddy_anim Says: March 27th, 2010 at 2:59 pm sorry, that should read i get the following when i type /join #blender Not connected. Try /server [ []] how did i find get and give that info to x-chat? N.A. Says: March 27th, 2010 at 4:14 pm its #blenderdurian jpbouza Says: March 27th, 2010 at 6:08 pm Here is another human base model in case someone wants to reshape it. http://www.pasteall.org/pic/2154 It may be a little too highpoly, but you could delete some loops there. Here is the link to the model: http://dl.dropbox.com/u/1716042/blenrig%20model.blend jhoolmans Says: March 27th, 2010 at 8:17 pm The fingers are hidden by default. you can unhide them with the Hands button with the other IK/FK switches in the side bar. How long will the sprint go on? cuz i really want to join, i really love Sintels movement! really natural, good job! Rod Naugler Says: March 27th, 2010 at 9:08 pm @toontje – I think you mean crutches. Crutches are padded supports meant to go under your arms to aid in walking. Crotches are where your legs meet below your hips. If you have more than one crotch, you have more than two legs. 🙂 futar Says: March 27th, 2010 at 10:22 pm I still can’t get the torso bone to do anything. I’m using blender 2.5 alpha 2 r27793 on an Intel iMac running OSX 10.5.8 The only way I can move the upper body is to show the ‘Body Extra’ bone layers and use the bones there. But surely that torso bone should work too. What am I doing wrong? erik90mx Says: March 27th, 2010 at 10:42 pm ooo that is great!! Only one question… we can use Make Human for the extras? I think that with a little work the result model can be very acceptable for a background character 😉 Greetings illwieckz Says: March 28th, 2010 at 12:26 am On the market clip, is it the bird from Peach project ? MTracer Says: March 28th, 2010 at 3:00 am What “Animation” category? Alfoncio Says: March 28th, 2010 at 5:33 am David Revoy, what a beast… Insane character design and one with most probably a story too, for instance I see a lot of Man A. in Kid B. It’s these subtle connections which he orchestrates that make this project even more intriguing… I really want to know these characters back stories now… It’s annoying how good he really is. Sockie Says: March 28th, 2010 at 5:23 pm I love them all, but, really, do people get angrier when they get older? taniwha Says: March 29th, 2010 at 2:41 "
