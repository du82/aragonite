full_description = "« Sintel pre-premiere Directorial Address – July 30th, 2010 » Three 4k posters on July 23rd, 2010, by Ton Here’s a zip with original un-touched 4k renders. One shot (cave) even has bad AA, but that’s because it was accidentally rendered without FSA. 🙂 Have fun with them, they’re CC-attribute, as all other content here! As prints on the wall they’re awesome, and really make me look forward to seeing the whole film in 4k too. As expectations now are, we might well have the 4k version by the Blender Conference. A 4k screening then would be a great highlight! download.blender.org/durian/posters-sintel.zip -Ton- (BTW: studio is nice quiet now! Colin, Brecht and Soenke are still here though, working on the final finals!) This entry was posted on Friday, July 23rd, 2010 at 5:15 pm and is filed under Development, Goodies. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 98 Responses to “Three 4k posters” wo262 Says: July 23rd, 2010 at 5:16 pm :O yohuuuuu! Thomas Says: July 23rd, 2010 at 5:22 pm 25KB/s 😛 TheDymo Says: July 23rd, 2010 at 5:26 pm will be a movie download? J. Says: July 23rd, 2010 at 5:30 pm Slow download… Dusty Says: July 23rd, 2010 at 5:52 pm Nice one, can’t wait to see the movie!!!! Thomas Says: July 23rd, 2010 at 5:53 pm I’m sure you guys already know, but there’s a little glitch here: http://image.bayimg.com/fanhgaacn.jpg Awesome renders btw!! I can’t wait to see the final movie 😀 jirms Says: July 23rd, 2010 at 5:55 pm Thank you Ton, and congratulations. 4k rendering is a huge breakthrough for blender, for your studio and especially for open projects. mastafrog Says: July 23rd, 2010 at 6:02 pm According to the download speed I would say It would be nice to get a torrent version for this download. D Says: July 23rd, 2010 at 6:07 pm 7 KB/s 😀 ochacon Says: July 23rd, 2010 at 6:14 pm thank you Shane S. Says: July 23rd, 2010 at 6:36 pm Wow… long download, but the result was worth it. I’ve uploaded a mirror of the zip file to my Public folder in Dropbox; feel free to use it. http://dl.dropbox.com/u/839888/Hosting/Durian/posters-sintel.zip I can’t wait for the final movie! ST Says: July 23rd, 2010 at 6:40 pm Download is at 12.5 for me, but I guess there are still lots of people downloading the beta! 🙂 mart Says: July 23rd, 2010 at 6:45 pm Thanks Shane for the link and thanks Ton for the renders Pulp3 Says: July 23rd, 2010 at 6:47 pm Thx for Dropbox 🙂 D Says: July 23rd, 2010 at 6:53 pm Thanks, Shane! 4K wooo!!! 😀 Limvot Says: July 23rd, 2010 at 7:18 pm Thanks Ton! (Oh, and thanks Shane for the mirror, over 20 times as fast 🙂 elio Says: July 23rd, 2010 at 7:55 pm 22.5 Oxben Says: July 23rd, 2010 at 8:21 pm Very impressive! The level of details is stunning. Anacleto Says: July 23rd, 2010 at 8:29 pm slow download, but I have no hurry!!!!! 😛 Andre Says: July 23rd, 2010 at 8:56 pm Question: So what does Ton do now that the studio is all quiet? Michael Says: July 23rd, 2010 at 8:59 pm I am a new blender noob and I would love one of you guys if you give me a tutorial for blender 2.50 alpha 2 that includes animation rigging modeling and that u know. Michael Says: July 23rd, 2010 at 9:06 pm OOOOOOOOO Brilliant work u guys of sintel you rock,wish I where half as good you J. Says: July 23rd, 2010 at 9:08 pm Ehhhhh… don’t know, maybe thinking about the sense of life, cleaning the sticky desks of who left, cleaning the toilets (especially the floor, as some steer into the wrong direction 😛 ), dreaming of being nominated for the Oscar for best animated short… ehmmm, Ton, maybe you can tell it yourself? 😉 speaker_mute Says: July 23rd, 2010 at 9:20 pm i can´t wait to have the durian project in my hands….i hope this could be soon Todd McCullough Says: July 23rd, 2010 at 9:23 pm Thanks Shane S for the mirror. I was about ready to pull my teeth out! anonymous Says: July 23rd, 2010 at 9:38 pm What the heck are the gray blocks in Sintel’s eyes? http://i31.tinyp