full_description = "Archive for the ‘Concept-art’ Category « Older Entries Concept-art : Dragons Wednesday, June 16th, 2010 Hi, As I promised last week I’m back with new digital painting and drawing done during the concept-art period. This week : Dragons ! Here you ‘ll find a mix of studies ( al.chemy , mypaint, gimp-painter or … watercolor ) … And as you suggested me last post ( in comments ), I created them in a friendly resolution and size for using them as wallpaper. More soon ! – David (more…) Posted in Concept-art, Goodies | 49 Comments » Concept art Speedpainting Tuesday, June 8th, 2010 Hello, I kept a lot of concept-art hidden since the pre-production in autumn to maintain few secrets and surprises about environments and creatures you will meet on the final movie. But I realized -after the launching on Internet of the trailer- that few concept-art are not ‘top-secret’ anymore. So, it’s now the perfect time to reveal old ‘new’ concept-art. I will show more in few weeks. – David (more…) Posted in Concept-art | 36 Comments » Make us a backpack! Monday, April 12th, 2010 Yo! We’re stretched to the limit and we need to get a crucial prop for the film modeled and textured: Sintel’s backpack. Instead of figuring out who on the team can spare a half a day to work on this, we thought we’d just open it up to the community! So, what we’re talking about here is the backpack– which includes the pack, the straps, the leathery mesh containerything, as well as the rolled-up quilt. You’ve got THREE DAYS to bring this as final as you can. Show us what you’ve got! (more…) Posted in Concept-art, Production | 38 Comments » Background Character Sprint: Details Saturday, March 27th, 2010 For the sake of clarity, I thought we’d just post all the sprint-related info to the blog. First, to answer some questions. The sprint will be taking place this weekend. We will be sporadically available throughout all of Saturday and Sunday. This is the time when we will be monitoring progress, giving feedback and direction, assigning tasks (if necessary) and hopefully maintaining a live stream on ustream! However, we know this work takes time to do well, and we will be accepting submissions all throughout this week, ending at the end of next weekend, on the 5th of April. (more…) Posted in Concept-art, Production | 42 Comments » Sintel’s Cabin, featuring Indirect Lighting! Sunday, March 14th, 2010 Yo! Pablo (venomgfx) here, on my debut as Durian Blogposter (sounds cool uh? 😀 ) The past week was awesome!, not only because it was my first one here :P, but also because David came all the way from Toulouse, to help out, and he was a huge help. Sintel Cabin’s Progress, more detail needed! Even though its not finished, blogposting wont hurt (hope so!). On this scene, my work was supposed to be design-model, then light/compo this shot, but since this was my first week, I’ve been told “No need to be completely productive the first few weeks”, great! relief.. so I took some time to learn the workflow and pipeline here, luckily is really similar to how I use to work before and on my personal projects nowadays. (more…) Tags: cabin, GI, indirect, lighting, render, sintel Posted in Concept-art, Production | 50 Comments » News about Chaos & Evolutions Friday, March 12th, 2010 Hello, My week in the Durian team is almost finished here, and I couldn’t leave the Blender Institute without posting on the blog. Apart for Sintel , I came to the Blender Institute with the prefinal videos of my DVD “Chaos& Evolutions” . And after some corrections, I decided to release the third video today about Alchemy ( edit: free, multi-platform and open source, download it here ) . (more…) Posted in Concept-art, Goodies, News, Tutorials, Videos | 53 Comments » Chaos & Evolutions; David Revoy painting course Thursday, February 18th, 2010 Another cool announcement for today: the long awaiting dvd from David is shaping up well! Those who attented his – already legendary – courses on the Blender Conference saw a glimpse of what to expect. For everyone else; get this awesome digital painting course (GIMP!) now! Oh, and yes… all Creative Commons, so it’ll be online and downloadable in no time as well. Getting a dvd will help us forward though! 🙂 Expected delivery is mid march. If you like to help us advertising this product? Check the banners preview, or download them all as a zip. And then visit the Blender store here! -Ton- Posted in Concept-art, Goodies, News | 38 Comments » « Older Entries"
