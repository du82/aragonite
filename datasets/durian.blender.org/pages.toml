full_description = "« Durian Finals Party Durian – the final rush » System Benchmarks on July 1st, 2010, by ideasman42 In the studio we have a variety of systems: Maqina Xeon workstations, Dell Xeon blades, off the shelf Intel I7’s, older workstations from Big Buck Bunny and our Justa-Cluster i7 render nodes so we thought it would be interesting to compare render times. The tests below are not as comprehensive as they might be, but since we also use these systems on the farm and as artists workstations we decided to keep it simple. Testing Here is a complete scene from the movie bundled up so you may test blender on your own systems and compare render times with our studio systems. Being a final shot this includes everything: sintel, bamboo environment, animation, textures, compositing etc. Download test scene (147mb) Open 5.2b_comp.blend and press render. Or on the command line… blender --background ./scene_05.2b_bundle/05.2b_comp.blend --render-frame 65 This blend file will only render correctly in the render branch of blender which can be found on graphicall, these tests were made with svn revision 29834 of blender. Quick Render Included times for one of our test renders. This file is not available for download. The Scene shows a checken flying: 1024×4380, Full simples (5), raytracing, environment lighting & compositing. Operating Systems We are using 64bit Linux – Debian Squeeze for the Justa-Cluster & Ubuntu 10.04 for everything else. I like to keep configurations similar to avoid glitches & incompatibilities. Compiler Debian’s gcc-4.4.4 I did some quick tests with clang (llvm based C/C++ compiler) and found if anything it’s slightly slower then GCC, however my tests were only with ~3 different test renders and roughly equivalent compiler flags. I attempted to install Intel C++ compiler but didn’t manage to get the redhat packages installed on Ubuntu (needed 32bit stdc++ libs for 64bit compiler at which point I gave up). C/C++ flags Typically Blender developers discourage using any optimization known to be risky. For Big Buck Bunny we were more conservative because we wanted blender to run with minimal problems but for Durian Brecht and I agreed to try more aggressive optimization flags. There have been some occasions when we hit bugs in the optimized builds that were not in debug build but often these are caused by very very big numbers or NAN’s where the result isn’t useful anyway. Here are the flags we use to build blender. -O2 -mtune=native -fomit-frame-pointer -msse -msse2 -msse3 -ftree-vectorize -finline-functions -funswitch-loops -pipe --fast-math I have to admit to being a bit of a ricer when it comes to setting up the compiler flags, Ideally we’d test how each flag effects performance however this is time consuming to set up. Results Maqina X5550QC 3D Workstation (2x Quad Xeon’s X5550 @ 2.67GHz, 8 cores total, 24gig ram) Render Time 16 threads (hyper thread): 27min, 03sec Quick Render: Render Time 16 threads (hyper thread): 2min, 4sec Dell Power Edge r410 (2x Quad Xeon’s L5520 @ 2.27GHz, 8 cores total, 24gig ram) Render Time 16 threads (hyper thread) 27min, 47sec Render Time 2 Blender’s running at once, 16 threads each 44min, 32sec, (amounts to 22min, 16sec per frame) Render Time 2 Blender’s running at once, 8 threads each 41min, 10sec, (amounts to 20min, 35sec per frame) Quick Render: Render Time 16 threads (hyper thread): 2min, 45sec Justa-Cluster (1x Intel i7 930 2.80GHz, 4 cores total, 6gig ram) Render Time 8 threads (hyper thread): 33min, 36sec Quick Render: Render Time 8 threads (hyper thread): 2min, 24sec No-Brand System (1x Intel i7 920 @ 2.67GHz, 4 cores total, 12gig ram) Render Time 8 threads (hyper thread): 34min, 35sec Render Time 4 threads: 42min, 12sec Quick Render: Render Time 8 threads (hyper thread) 2min, 35sec Maqina C6850DC 3D Workstation (Quad Core2 Q6700 @ 2.66GHz, 8gig ram) Render Time 4 threads: 54min, 03sec Quick Render: Render Time 4 threads: 3min, 35sec older system used for Big Buck Bunny Notes: for the test file you might not be able to render with less then 4 gig of ram. the render farm software is not currently released but it will be released with all the other scripts and utilities with the production files. Ton was interested in seeing times for quick test renders so I ran one of our fastest test files on all the systems so I have included times above. – campbell This entry was posted on Thursday, July 1st, 2010 at 12:07 am and is filed under Development. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 82 Responses to “System Benchmarks” James Says: July 1st, 2010 at 12:18 am Half the links are currently broken.. Lucas Says: July 1st, 2010 at 12:25 am Well, for me the rendering has to wait till tomorrow morning, as it’s getting late already. I expect my machine to work on this scene for 2 hours (Core2 duo E8400 with 4GB of memory) Jayden Says: July 1st, 2010 at 12:27 am /wp-content/uploads/scene_05.2b_bundle.tar.bz2 Fixed link. Dylan McCall Says: July 1st, 2010 at 12:27 am So are those measure times measured in hours or minutes? Slightly different note: I want Maqina’s computer! :b ExE Says: July 1st, 2010 at 12:33 am Is it possible to download a render farm software like you used for Durian. I got 3 older pcs here (Intel Core2Duo ~2,6 Ghz, 3GB RAM). How could I setup something like you with such a nice webinterface? Render Time will be posted tomorrow with my main PC. ELF Says: July 1st, 2010 at 12:51 am ExE: it’s not a software on its own. It’s just a script distributing and gathering renders and statistics. ideasman42 Says: July 1st, 2010 at 12:52 am Sorry about the missing links, for some reason wordpress made the links relative :S, @Dylan McCall, min, sec – updated post. Dylan McCall Says: July 1st, 2010 at 12:53 am Sorry for double posting: Where did you get that _awesome_ thumbnailer for Blender files? J. Says: July 1st, 2010 at 1:05 am Just a question: Why are there loose network cables connected to a few justa-nodes? Are some of the built-in yellow cables broken? (just wondering) And a little request: Could one of you make a few high-res photos of the Justacluster? I would very appreciate it! 😀 Anthony Says: July 1st, 2010 at 1:11 am Hi, which do you think would render faster, 1.) Intel CORE i7-930, 2.8GHz/ 8MB Cache 2.) Intel XEON W3530, 2.8GHz/ 8MB Cache 3.) Intel XEON E5620, 2.4GHz/ 12MB Cache – 4 CORES I’m building a 3D workstation and I’m not sure which is better, more cores, higher speeds or bigger caches? PS:Thanks for the great post. jay Says: July 1st, 2010 at 1:12 am Campbell you are awesome the geek out factor. Thanks a lot jay Says: July 1st, 2010 at 1:13 am eh “for posting” ^ heh too much going atm 🙂 LetterRip Says: July 1st, 2010 at 1:30 am Campbell, there is software that will find the optimal flag settings automagically by doing permutations http://coyotegulch.com/products/acovea/ Stijn Says: July 1st, 2010 at 2:21 am Just finished a test with the build from graphical Dell XPS 16 laptop with i7 i720 @ 1.60Ghz / 6GB ram Render time : 1h08m36s Considering the competion in those screenshot’s, that’s good portable power!! NB-DanTE Says: July 1st, 2010 at 3:03 am guys you’re awesome, I like what are doing and I like your render farm so much it’s original pablo Says: July 1st, 2010 at 3:16 am how do this? —> /wp-content/uploads/2010/07/scene_52b_files.png pablo Says: July 1st, 2010 at 3:18 am i talk about thumbail Trevin Says: July 1st, 2010 at 6:04 am Intel i7 860 @ 2.80GHz, 8GB RAM: 33:25.64. I hadn’t looked at the render branch for a while. You guys have done some fantastic work! FishB8 Says: July 1st, 2010 at 8:03 am I’ve found that the Graphite loop optimizations can help optimize nested loops quite a bit (gcc needs to be built with graphite enabled) -floop-block -floop-strip-mine -floop-interchange I’ve also found that the C++ “-fvisibility=hidden” flag helps strip out a bunch of un-needed symbols to significantly reduce the size by several megs and helps it load quicker. The “-Wl,–as-needed” also helps if there are libraries included that aren’t actually used, also helping reduce load time and memory. ideasman42 Says: July 1st, 2010 at 8:12 am @J, some of the cables didn’t work reliably so we had to run bypasses. I’ll see if our video camera is high res enough :). @LetterRip, At some point Id like to try this tool so added a link to http://wiki.blender.org/index.php/Dev:Ref/Software_Resources#Other would be interested to know what kind of performance improvements you’d get with optimal flags, if its significant @Dylan McCall & Pablo, blender 2.5 now embeds 128×128 RGBA thumbnails in the header of the blend, these can be extracted for display quickly without loading the blend file. Blender uses the freedesktop standard for icon display so once blender has cached the icons some file managed can view them without special blender support. young_voter Says: July 1st, 2010 at 8:21 am How come these renders look like they are a game environment instead of a cinematic animation? Does anyone have the same feeling? leodp Says: July 1st, 2010 at 9:12 am Interesting. One note though, in sync with young_voter. In the bamboo forest frame it seems the bamboos stick out of a flat ground level. It is very ‘gamey’, not really realistic, even if inside of a moving video it will be much more difficult to notice it. I would add some small shrubs/grass to hide the foot of the bamboos. But maybe it’s too intensive to implement/render. Anyhow, I’m looking forward to have my DVDs! Everything looks so fantastic. Ciao, Leo milkita Says: July 1st, 2010 at 9:15 am is that the render time for one frame only? also i notice in the far right there’s some jagged shadow on bamboo tree, however that’s not bother me. i’m happy with the result so far. i hope the blender thumbnail thingy will works on windows too. it’s just too awesome ^_^ can’t wait for DVD N.A. Says: July 1st, 2010 at 9:32 am That thumbnail thing is quite good 🙂 Are there any steps to be done to make Windows use this thumbnails? Like just pressing some “Register Blenderthumbnails”-Button? nawabz Says: July 1st, 2010 at 10:41 am interesting work guys, keep it up Chainz Says: July 1st, 2010 at 11:07 am I just wonder when you gonna create a nice picture that might be used as a wallpaper? They all great renders but nothing good to put on a desktop 🙁 endi Says: July 1st, 2010 at 12:40 pm I love this new image, I love plants and greens. 🙂 A small note: there are some antialiasing error on the bamboos, and a strange bug on the butterfly’s wing. patrox Says: July 1st, 2010 at 12:47 pm @Chainz: they’ve got some concept art under gallery which can be used as wallpaper, check it out. Maya Says: July 1st, 2010 at 2:21 pm Ha, My pc also has that cooler master body ideasman42 Says: July 1st, 2010 at 2:35 pm @FishB8, thanks for the tip, I tested with -fvisibility=hidden, your right it cut 2mb off our binary size, added to the build script. I tested the linking suggestion you made but id didnt make any difference to the output of ‘ldd ./blender’ or ‘objdump ./blender -x | grep NEEDED’ , probably because of how we have cmake setup it only links libs that we need. @young_voter, rather let artists respond to this kind of feedback, they are discussing now 🙂 @milkita, short answer is no, however it should be very easy to write a shell extension for windows which extracts thumbnail’s, this could be distributed with blender, See thumbs_blend.c:IMB_loadblend_thumb ~90 lines of code to extract the image from the blend file. dd Says: July 1st, 2010 at 3:04 pm where is picture? /news/wp-content/uploads/2010/07/0158.png Error 404 – Not Found fahr Says: July 1st, 2010 at 4:15 pm What are the minimum RAM requirements to render this scene? It crashes in 32-bit. J. Says: July 1st, 2010 at 4:32 pm I have the same question. J. Says: July 1st, 2010 at 4:44 pm I mean the question of ”dd”. spacetug Says: July 1st, 2010 at 4:46 pm @ ram requirements, the post says probably at least 4GB. their minimum is 6GB, on a 64-bit machine. I’m not even going to try on my 5-year-old laptop, with 1×1.73GHZ CPU and 512 MB RAM (32-bit windows xp home edition) acro Says: July 1st, 2010 at 5:02 pm Cool new shot revelation! 😀 Hmm, that butterfly looks awfully familiar… And the thumbnail tech is phenomenal. I’m off to read up on shell extensions. Shinobi Says: July 1st, 2010 at 5:02 pm It’s written: “Notes: * for the test file you might not be able to render with less then 4 gig of ram.” Very nice to see you guys manage such an incredible amount of hardware in that good way 😉 @ young_voter: well, actually it puzzles me a bit too, I mean, that plain_plane_ground seems gone out from Tomb Raider 2/3 more than from a 2010 CG movie… mmmhh… DanielWray Says: July 1st, 2010 at 5:31 pm The lighting in that scene needs work, that’s the only reason why you say it looks like a ‘game enviroment’. The lighting is quite flat over most of the image. Nothing a little compositing or small lighting tweaks couldn’t solve; Personally I think it could do with some blacks to better help focus the over all shot, which should converge towards the main action, which is Sintel running through the bamboo forest. Of course the light wouldn’t follow her, but the light could be used to show the path of the character, making use of the god rays would be very nice for this. Also using a stronger depth of field looks in order. Just my personal opinion though 🙂 DanielWray Says: July 1st, 2010 at 5:42 pm Couldn’t resist editing the image XD Yes I understand that the image posted won’t be final, but I don’t see any harm in uploading an edited version of it 🙂 http://img291.imageshack.us/f/40544204.jpg/ David Says: July 1st, 2010 at 5:56 pm Nice. I will see how this renders on my laptop latter. BTW any chance of adding build support for the new 64 bit MinGW for windows someday? http://sourceforge.net/projects/mingw-w64/ It already has some of the external lib files prebuilt. jdcooke2010 Says: July 1st, 2010 at 6:04 pm Hey, that looks nice DanielWray. See folks, just like you would record audio “flat” in a studio so you can add or enhance it in post preduction, so too with a computer render – after which you would add grading, lens distortion, film grain and other imperfections to make it look more “real” It’s gamey ’cause it’s raw. 🙂 Thanks for the scene Durian Devs,… Take care J. Says: July 1st, 2010 at 6:11 pm Plus: Rendering happens in OpenEXR, so you’ve complete freedom for grading. maddes Says: July 1st, 2010 at 6:47 pm I’ve been able at last to OPEN the scene in my Laptop with 1.5 GB RAM, 1.7 GHZ Pentium M. Just tried out to render at lower resolution to see if anything happens … it crashed at 640 x 360 😀 Trevin Says: July 1st, 2010 at 7:25 pm @David: I’ve thought about trying to compile it using MinGW-w64. I haven’t looked to see how difficult this would be to set up. I might take a look at it tonight. It would be a fun learning experience at the ver"
