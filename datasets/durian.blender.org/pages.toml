full_description = "World’s first baby named after an open movie character on December 7th, 2013, by Pablo Vazquez Now this is an achievement! When characters go beyond the screen right inside our lives. This blog post is not about the movie itself, is about a new little person… Welcome to the world, Xareni Sintel Ordonez! Some days ago, Daniel Ordonez (a Mexican Blenderhead living in Chicago), sent me an email. But this was no ordinary email, it was about how together with friends and family, they picked the name Sintel for his daughter.Exciting! But we wanted proof 🙂 And Daniel delivered. If some years from now you’re reading this, Sintel, be proud! You’re in the news from the moment you were born. Enjoy the world and don’t stop looking for your dragon. Posted in News | Comments Off on World’s first baby named after an open movie character Sintel 4k, DCP and .mov file on December 16th, 2011, by Ton Jonathan Jensen created a 4k (4096 wide) DCP package; the digital standard for cinema: http://blender-mirror.kino3d.org/DCPs/ Thanks to Gianluca “Kino3d” Faletti for hosting it! (27 GB) There’s also a 4k UltraHD (3840 wide) H264 encoded version available now: http://download.blender.org/durian/movies/ (NOTE: Posting comments now has been disabled for this website). Posted in News | Comments Off on Sintel 4k, DCP and .mov file Jan Morgenstern wins two Jerry Goldsmith awards on July 23rd, 2011, by Ton Both the Sintel score and the Sintel credit song “I move On” have won the Jerry Goldsmith Award at the prestigious International Film Music Festival. Here’s the announcement on the official web with pictures. Great milestone for composer Jan Morgenstern and lyrics writer Esther Wouda, for the entire team, for open source movies and Creative Commons, and of course everyone who helped making Sintel possible! Jan Morgenstern website -Ton- Posted in Production | 20 Comments » Sintel blu-ray .iso download on July 14th, 2011, by Ton Here you can find an updated (fixed!) Blu-ray .iso. Special thanks to Mathias Linden for the service! http://download.blender.org/durian/movies/ Posted in News | 7 Comments » Sintel full studio svn online on July 9th, 2011, by Ton As requested by Tim Chen, a Taiwan University researcher who created a great non-linear image revision system with a GIMP prototype: http://www.youtube.com/watch?v=RBL1cVzIQik the full studio svn database for Sintel has been put online as well. Tim needs this data to investigate how a studio workflow for CG animation film goes in practice, and to check on the feasibility to develop a similar revision system for .blend files. If you check the video, this would certainly provide a revolutionary workflow for teams on films! For anyone interested to investigate studio workflows in general, our svn is available for download here: http://download.blender.org/durian/svn/ There’s also an md5 for the files. The .tar files have been created like this: tar -cvf - ./svnroot/durian | split -a 4 -d -b 256m - /tmp/usb/durian.tar Files that have been uploaded should be 268435456 bytes each, which exception for the last file which is 153933824 bytes. Total size of the svn data is about 114 GB. Tips for how to merge it all and untar I found on this page. -Ton- Posted in Development, News, Production | 6 Comments » Jan Morgenstern nominated for Goldsmith awards on June 17th, 2011, by Ton Both the Sintel score and the Sintel credit song “I move On” have been nominated for a Jerry Goldsmith Award at the prestigious International Film Music Festival: http://festival.bsospirit.com/index.php/en/news/100-festival-07/265-vi-premios-jerry-goldsmith-los-nominados Great milestone for Jan Morgenstern, for the team and of course everyone who helped making Sintel possible! The festival awards will be announced July 22nd. Stay tuned, -Ton- Posted in News, Production | 11 Comments » Production updates on June 10th, 2011, by Ton Lots of things keep happening all the time with Sintel and the crew! Here’s a list of bullet points with highlights. Sintel selected for Siggraph Animation Festival. Out of over 1000 submissions, 60 entries were honoured. It’s for our open movie projects a first timer, both ED and BBB didn’t make it… 🙂 Blender Foundation booth at Siggraph tradeshow At least Colin, Nathan and me will be there. I hope we can afford to fly in other team members… t.b.a. Note we also have a Birds of a Feather event at Siggraph with Sintel presentation. New download page Pablo re-edited the download section, it also has newly encoded versions based on the downsized 4k 16 bits color files made Mathias Linden (thanks!). You can also find all 40 subtitle languages there now. Blu-ray ISO and 4k mkv file available Mathias Linden also encoded us these versions, test these here: http://download.blender.org/durian/movies/ Festival screenings I do my best to keep the agenda updated, Sintel remains popular at many festivals world wide! Read the rest of this entry » Posted in Production | 25 Comments » « Older Entries"
