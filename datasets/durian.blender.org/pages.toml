full_description = "« Sintel blu-ray .iso download Sintel 4k, DCP and .mov file » Jan Morgenstern wins two Jerry Goldsmith awards on July 23rd, 2011, by Ton Both the Sintel score and the Sintel credit song “I move On” have won the Jerry Goldsmith Award at the prestigious International Film Music Festival. Here’s the announcement on the official web with pictures. Great milestone for composer Jan Morgenstern and lyrics writer Esther Wouda, for the entire team, for open source movies and Creative Commons, and of course everyone who helped making Sintel possible! Jan Morgenstern website -Ton- This entry was posted on Saturday, July 23rd, 2011 at 12:11 pm and is filed under Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 20 Responses to “Jan Morgenstern wins two Jerry Goldsmith awards” Anonymous Says: July 23rd, 2011 at 3:26 pm Congratz! Peter Rehley Says: July 23rd, 2011 at 5:37 pm Awesome. Congratulations! MarcoA Says: July 23rd, 2011 at 6:31 pm Congratulations! A great music for a great shortfilm. And “I move on” is really a gem! D Says: July 23rd, 2011 at 8:40 pm That’s awesome! Congratulations, Jan and all! 😀 Acceptance speech? Sago Says: July 24th, 2011 at 2:42 am Congrats! Now give this guy a Wikipedia page!! Shader Says: July 25th, 2011 at 12:42 pm Brilliant song for diamond short! NoriMori Says: July 26th, 2011 at 4:20 am Fantastic and 120% deserved. “I Move On” is such an amazing song, both lyrically and musically. JeroenM Says: July 26th, 2011 at 10:08 am Congrats! Raimon Says: July 26th, 2011 at 3:25 pm mmmm… I think the singer deserves some credit too, even more than the Sintel crew, isn’t? Raimon Klip Says: July 26th, 2011 at 3:28 pm Wooooow, congratz to Jan, Eshter and the whole team! YUuuuuu! jan Says: July 26th, 2011 at 6:32 pm Allow me to quote my own tweet, as I’m not sure how to put it differently: More rewarding than the awards themselves were reactions from friends, followers, and people from the Blender community. THANK YOU. <3 Alberto Says: July 28th, 2011 at 11:49 pm ¡Buenísimo felicidades! 😀 It’s very good, congratulations! 😀 rueben Says: August 2nd, 2011 at 1:53 am la peli como la musica tienen gran calidad sigan asi muchachos Felipe Says: August 11th, 2011 at 10:44 pm (I know it has nothing to do that, but he read = /) Damn I saw, gave us much anxiety and wanted to cry at the end, I fikei very angry, it never leaves my head to our final one of these? They could have done a happy ending, but I do not care, I thought the script for the second movie, do it, even little old lady, not so old, she took care of small small dragon that was saved in the end, you invented a story to 2 film, and in the end, the Dragon of it, which “died” appears, cured with an expression I came back, I lost, then they 3 will happy = D Or a story in which she and the baby dragon that was saved in the end, go into something to resurrect the dragon it = D but for God’s sake, do the second movie with a happy ending, but the dragon died, come back or appear again, at least to talk to forgive her, just so my Awareness will be left alone, please = ( My soul demands it = / please ROMIOIN Says: August 19th, 2011 at 6:02 am Please add the arabic subtitle here it is …. http://ubuntuone.com/p/IPw Alvaro Says: September 12th, 2011 at 11:35 pm Jan Morgenstern = talent Manuel Uribe Says: October 21st, 2011 at 9:57 pm A-mazing! Parallels to so many questions. Y’guys outdid yourselves. Pardon if I’m pointing everyone on my FB to this film, some are film grads (UCLA and UCD) and I’m a drummer myself (which might not make sense to you guys, but Sintel and your production vids on ‘Tube do to me). Thank you. Nori/Narcissus Says: October 27th, 2011 at 10:03 pm Hi. I know Sintel is licensed as CC BY, but I wanted to ask to be sure. Can I put the Sintel novel remake I made with my collected book of dragon poems? It’ll be on Lulu but I had to ask to be sure (even though sintel is cc by. I know I can but I wanted to ask) Bob Forsman Says: November 17th, 2011 at 10:22 pm I can’t find a better place to mention this: I tried to reencode the 1080p downloadable version of the movie using ffmpeg 0.7.6. I got an av_interleaved_write_frame(): Operation not permitted which seems to often be caused by duplicate timestamps. I don’t know if it’s a bug in ffmpeg, or perhaps a bug in the software used to compress the video. If you have anyone with the skills to inspect your own video, it might be worthwhile to check for timestamp oddities. thoth@farafra /homes5/thoth/charles $ sum Sintel.2010.1080p.mkv 59877 1144950 Loria Lisenbee Says: December 3rd, 2011 at 11:21 am Holy tin foil hat Batman! No wonder this bunch is working so hard to proactively throw dirt at the Sheriff’s department psychologist. Last thing these conspiracy nuts want is a psychologist that has previously evaluated them going on record."
