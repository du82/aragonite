full_description = "« Progress on Snow Landscape Sintel’s Cabin, featuring Indirect Lighting! » News about Chaos & Evolutions on March 12th, 2010, by Deevad Hello, My week in the Durian team is almost finished here, and I couldn’t leave the Blender Institute without posting on the blog. Apart for Sintel , I came to the Blender Institute with the prefinal videos of my DVD “Chaos& Evolutions” . And after some corrections, I decided to release the third video today about Alchemy ( edit: free, multi-platform and open source, download it here ) . Youtube version above, with high definitions options. You can also download the OGV Theora file as it will be on the DVD here : download.blender.org/durian/03-alchemy.ogv I still have some video editing to do with Kdenlive before delivering the final DVD to the Blender Institute, but I prefer to take time to finish it properly and spend time on Sintel art direction. Thanks for the patience of people that already pre-order it, and thanks for people that will pre-order it. By the way, It shouldn’t be too long to finish, and during this will extend of some weeks the pre-order discount of 10% on the Blender E-shop. A propos Sintel art direction , I spent my week time here to do paint-over and matte-painting. It was good to connect again with the team, and meet Beorn. But sorry ; no picture of my recent work for Sintel at the moment, 3D artist will show the result soon. -David This entry was posted on Friday, March 12th, 2010 at 1:47 am and is filed under Concept-art, Goodies, News, Tutorials, Videos. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 53 Responses to “News about Chaos & Evolutions” Terry Wallwork Says: March 12th, 2010 at 1:54 am Video looks amazing, really looking forward to getting my dvd, awesome work sir. Pablo Vazquez Says: March 12th, 2010 at 1:54 am pure awesomeness! 😀 thanks for all the incredible help here! About the DVD, this will be of a great value, can’t wait to get my copy! Quentin.G Says: March 12th, 2010 at 1:54 am on peut plus l’attendre, ce DVD 😀 we can’t wait for this DVD anymore 😀 Achim Luebbeke Says: March 12th, 2010 at 2:16 am Same here! Thank you very much for sharing your knowledge, and for letting us participate in these magnificent processes of painting! 🙂 Daniel Wray Says: March 12th, 2010 at 2:48 am Incredible footage David, I’m really interested in ordering the DVD now. I haven’t seen any 2D instructional DVD’s like this, so definitely a one which I will buy 🙂 Sephiroth the Bimbo Master Says: March 12th, 2010 at 3:18 am Damn that is aweasome!!, but I don’t have money to pre-order my copy, hope next month Achim Luebbeke Says: March 12th, 2010 at 3:31 am Wow, thanks for the link! I only found one with a linux version, and I tried to use it with Cygwin – without success! While trying that, I wondered whether blender couldn’t at least support the mirrored painting! You can mirror the editing and sculpting, why not the painting as well? 🙂 Markus Says: March 12th, 2010 at 5:30 am Great job! I didn’t plan to order this DVD, but after watching the video I had to order one. I like to watch you how you put those great open source tools to work, it’s just like watching Bob Ross 🙂 I’m not sure if you planed to put a little information on the hardware on the DVD what you use at the time… do you use a mouse at all or just a tablet? Do you use one screen or two? Any other device? For example in Alchemy, do you have one hand on the keyboard at all times to press x? Thanks, Markus Paul Says: March 12th, 2010 at 5:48 am wow…what can I say…so awesome. I’m putting Alchemy on my list of things to learn to use. I do a lot of character desinging (mostly cartoon), so now I can’t wait to throw some new, and use full, tools into the mix. Can’t wait to start ramping up my drawing mind and get drawing again. Great video, very inspirational. Robbie Losee Says: March 12th, 2010 at 7:13 am I’d been putting it off, but just ordered one. The old timelapse from a while back of David drawing Sintel and the dragon was enough to convince me. PS – My screen is 1440 x 900, so this will be a perfect fit. Thanks David! Dundee Says: March 12th, 2010 at 9:28 am better than expected! but those “censored” bars were redundant and i hope the real video is without them. KLLo Says: March 12th, 2010 at 9:28 am Invalueable!… The Blender Fundation is teaching art to the world, and giving the tools to do it. A gift to humanity. Loolarge Says: March 12th, 2010 at 11:22 am I allready pre-ordered weeks ago! I hope it can be shipped soon 🙂 This video is pure awesomeness, exceeding my expectations! David, thank you very much for sharing your knowledge! I am so excited, but i will try not not think about it until i got the DVD 😉 rogper Says: March 12th, 2010 at 11:36 am I’m already feeling a better artist 😀 Adrian Says: March 12th, 2010 at 1:08 pm Thats amazing work, from an amazing artist! I’m just gonna break into my piggy bank! 🙂 mutze Says: March 12th, 2010 at 1:37 pm Really cool to watch you work. However, beeing a student with not to mutch money and no tablet, I will not buy the dvd. But since I will probably download it, I donated 7 € (not much, but thats what I can afford). So to everybody else that will download it, donate what you can afford and think it is worth. The donate button is on the support page 😉 mutze Says: March 12th, 2010 at 1:40 pm * The donation button is on the sponsors page I mean. Koxi Says: March 12th, 2010 at 1:48 pm Really great. I also didn’t plan to order one. But the order is now placed. I hope it will be released soon. Jiri Says: March 12th, 2010 at 2:13 pm Excelent! Nik Says: March 12th, 2010 at 2:42 pm Heh, “to setup a figure that looks like an human” 😀 Phlip Says: March 12th, 2010 at 3:02 pm Wow, this is looking fantastic, even better than I thought, can’t wait for the DVD! Your art has already given me the final nudge to switch to gimp, now going to give alchemy a go. Thanks David! acro Says: March 12th, 2010 at 3:34 pm Very inspiring, and a revelation, just like when David introduced me and many others to alchemy (and mypaint) in that original concept art post. I’m definitely preordering this now! Nicolas Says: March 12th, 2010 at 3:51 pm it’s super interesting, you always made us discover a lot of stuff. Thanks David:) Deevad Says: March 12th, 2010 at 5:35 pm Thanks a lot for the warm welcome you made to this first video, it’s will give me energy to finish this DVD the sooner I can. Now, some general answer : Alchemy is free and open source. Documentation for instaling it to your system : *OSX Doc : http://en.flossmanuals.net/Alchemy/InstallingOSX *Linux http://en.flossmanuals.net/Alchemy/InstallingLinux *Windows http://en.flossmanuals.net/Alchemy/InstallingWindows @Markus about device : The DVD have a small intro about this. But here are the main informations ; I use a Wacom Bamboo Fun A5, and a Intuos 3 A4. Not simultaneously, the little is for travelling, the big for home. I’m actually planning to switch to a Wacom Intuos 4 A5; for both house and traveling with the same device. I like little surface, but the Bamboo Fun A5 have too low resolution for being really confortable with a HD screen ( 1920×1080 ). Anyway, during this week at this institute I took the Wacom Bamboo Fun A5 and worked a 6K matte painting one a 1920×1080 screen connected in HDMI to my laptop. Worked fine ; Mypaint and Gimp got good behavior even with this high-res, just miss a bit of precision If I would like to do some lineart or thin drawing. And about keyboard, ‘yes’ I have constantly a hand on it while drawing, and I’m always happy to learn new keyboard shortcuts. @Dundee about the censored bars : I had a discution about nudity on Blenderartist forum at the first launching of the DVD presales. Actually this system protect and respect the sensitivity of users that have problem watching nudity. So, I will keep “censored” warning in the final versions. As a Creative Commons video , feel free to crop it to your taste if you have to use it in a class room, or in a public place. @Achim Luebbeke : Actually you can paint in mirror using Blender ( if you like the painting engine of Blender). Just a trick of 2 plane with a simple UV mapping. @Mutze: Cool for your informations about the donation button, I appreciate this way of supporting the Blender Foundation. Psy-Fi Says: March 12th, 2010 at 5:37 pm I hate you, hate you, hate you…. Very, very well done! Emili Sancha Says: March 12th, 2010 at 6:09 pm WOW !!! Alchemy is magic in your hands !!! You are a magician !!! Bravo David !!! TheTinyToon Says: March 12th, 2010 at 6:15 pm Very nice video, especially a very good balance between realtime painting to get the concept and fast-forward to deepen the lesson. What it does miss is voiceover accompanying the notes in the video, which you really really should do in the final version, explaining more in detail and using the notes just to point out the main parts of what you like to teach. LetsAllPretend Says: March 12th, 2010 at 9:04 pm I just wanted to say your video explanation with comic texts was great. Good pacing for readability, helpful notices when you speed up and slow down the time-lapse, and love the review of proportions at the beginning. My interest in this DVD went up a lot seeing this. Thanks David, for the DVD, and the awesome contribution to the Durian Project! kenden Says: March 12th, 2010 at 9:37 pm Wow, that was very impressive. I like the ambient music for the background, it makes really ‘zen’ just watching the video. Maybe a voice over would spoil that. Corniger Says: March 12th, 2010 at 9:53 pm I also preordered weeks ago. Proud pre-owner! Nothing more to say that hasn’t been said before, I feel like a kid before Christmas, although I already spent thousands on CS4. One thing: be WARY about the Intuos 4. I own an L since half a year, and I imagine in your hands/with your degree of usage, you’ll need a replacement surface just after that much time. The nibs wear off within hours, thus scratching everything up. If you order one, at least wait until they have decent replacement. There is a petition running concerning the decline in qUality and reliability and some other issues that remain unsolved since more than 7 months. If you like the Intuos 3, get one of those – that’s what some say. wray bowling Says: March 12th, 2010 at 10:42 pm It’s so smooth! Achim Luebbeke Says: March 12th, 2010 at 10:57 pm David, thank you for the tip with the planes. Actually, I thought about painting the skin of a mirrored model, with the chance to switch between mirrored painting and not mirrored painting f.i. on the skin of a modeled head. Your tip could work even for that purpose when the planes and the uv of the head share the same pic in a sophisticated way, although it is slightly less intuitiv. Just a simple test: http://www.puppenheim.org/mirrored_face_painting.blend Nezumi Says: March 13th, 2010 at 1:08 am Man, you did a good job releasing that video. I am REALLY gratefull for opening my eyes and showing me Alchemy. What a GREAT piece of software! Mirror is just what I was always praying for! Now, all I need is whole DVD – youre a hell of an artist. I enjoy it SO MUCH. Greetings from Mexico! Nezumi Says: March 13th, 2010 at 3:51 am As for the “nudity” – come on! Bunch of people need to understand that learning to draw anatomy is crucial and we cant learn on figures wrapped in cloth. If someone is so sensitive maybe he suppose to draw Smurfs, Mickey Mouse and Pluto? Drawing NAKED (yes, N A K E D) figures is natural, normal and perfectly OK. How would I know where to place nipples if breast would be covered with a HUGE “censored” sign? Same with genital area (Yes, people have NIPPLES and GENITALS, we are not Ken and Barbie). So do not be a slave to bunch of hypocrits and prudes that trying to stop ARTISTS from LEARNING (frankly, I dont even see other use for that kind of semi-manga nudity…). Lets be free in all extension – human body is also open source, it is NOT tabu subject to any NORMAL person. Anyone who thinks this is bad thing in art oriented dvd will probably see bunch of pubic hairs when exposed to Rorschach test… Poore perverts. Robbie Losee Says: March 13th, 2010 at 5:21 am @ Nezumi – I am an artist and a “prude” as you say. I bought the DVD. There are valid reasons for warnings – and as a not-so-normal person, I appreciate David’s consideration of people like me. I like being warned and being able to make a decision. It is a matter of courtesy, not forced censorship. Nezumi Says: March 13th, 2010 at 7:00 am Don’t get me wrong – warning is perfectly OK as long as I will have an option to get rid of all stripes and letters from an ART. Being prude (or whatever you want to name it) AND an artist is hell of a challenge I guess. There is now way you can learn draw good characters without discovering that shocking truth hidden under cloth. Learning history of an art must be pain as well as tons of sculptures and paintings are exposing innocent soul for a view of human body as it was created. Even this little, perverted cupid do not care much about covering his body. Explain me then – how you want to deal with this? Do you think Louvre should place warnings about nudity at entrance? You think other museums full of art containing BEAUTY of human body should do it? Would you forbid your kid going to expositions because he may see naked body? But as I say – as long as it will be an OPTION they may do few versions. For muslim fundamentalists it may have CENSORED on face in example – to respect their sensitivity. For Jewish Orthodox we can place hairs in other layer with an option to hide it. And so on. WAKE UP! You want to learn how to draw human – you have to deal with nudity. Otherwise you may just as well start learning painting environments, as you will never master human figure without knowing how it looks like. BTW, I remember time when people wasnt all so sensitive, walking around like a bunch of sissys, feeling offended just by ANYTHING, feeling verbaly abused every second word they hear, feeling abused by what they see and so on. And then we have movies like “300” where Spartans all of sudden are wearing some funny panties… Jeez… Robbie Losee Says: March 13th, 2010 at 8:01 am I didn’t mean that to sound harsh – I understand where you are coming from. There is very much to be learned from the study of anatomy for the artist/animator. I greatly respect the beauty of the human body in all its glory. And I do not shun studying it. 🙂 Much of what I said was reactionary (“I am a prude”). I debated for quite a while over getting this DVD, but decided it was worth it because of the value of learning the art. The aspect of drawing human characters was not my primary interest so much as learning the software, but it will be of value to me nonetheless. Anyway, peace! Maybe some day we can visit the Sistine chapel together 🙂 Nezumi Says: March "
