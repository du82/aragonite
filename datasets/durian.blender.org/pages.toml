full_description = "« Colin makes a home movie Greetings from the audio trenches! » Concept art Speedpainting on June 8th, 2010, by Deevad Hello, I kept a lot of concept-art hidden since the pre-production in autumn to maintain few secrets and surprises about environments and creatures you will meet on the final movie. But I realized -after the launching on Internet of the trailer- that few concept-art are not ‘top-secret’ anymore. So, it’s now the perfect time to reveal old ‘new’ concept-art. I will show more in few weeks. – David This entry was posted on Tuesday, June 8th, 2010 at 12:29 pm and is filed under Concept-art. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 36 Responses to “Concept art Speedpainting” sir.tooby Says: June 8th, 2010 at 12:34 pm Thanx! Cool art 🙂 really liked the last one with the action. Best Regards Davis Says: June 8th, 2010 at 12:39 pm These are impressive, don’t know what else to say. Alex Says: June 8th, 2010 at 12:40 pm Nice art. Continue the “fine work”… iCandy Says: June 8th, 2010 at 12:41 pm looks really good! too bad they are too small to use as a wallpaper 🙁 iCandy Says: June 8th, 2010 at 12:42 pm *never mind they fit perfectly ^^ Kinhe Says: June 8th, 2010 at 12:45 pm Really nice 😀 panzi Says: June 8th, 2010 at 12:47 pm I love speed paintings! I’d like to see a whole movie in this style with constant 25fps. Davis Says: June 8th, 2010 at 1:04 pm Unrelated, but I’m sure I’m not the only one who would like to see an update from Jan. MiikaH Says: June 8th, 2010 at 1:12 pm Nice concepts. And more Sintel related stuff plox! Keep us updated. 🙂 Lasse R. Bruntse Says: June 8th, 2010 at 1:24 pm Great! Thanks. Anereton Says: June 8th, 2010 at 1:54 pm Hi guys, Great jog, amazing pics, i was wondering the absurd quality of the film, and a question… the time frame of premiere, any news? Christian Lehmann Says: June 8th, 2010 at 2:02 pm These pictures are so great. I know how to build some stuff with 3D but never really managed to “paint / sketch” anything more than flow diagrams. D Says: June 8th, 2010 at 2:02 pm Awesome, David! 😀 I know it’s old, but it’s new! 😀 I don’t know how you come up with your city compositions, but I love the living vitality you give to the streets by way of framing. Well, maybe they’re all just cliches and I’m just not that well learned in depictions of cities. 😛 patrox Says: June 8th, 2010 at 2:28 pm Awesome! kram1032 Says: June 8th, 2010 at 2:49 pm Those look great 😀 Nice old new update 😀 Or is it new old? kingcreole Says: June 8th, 2010 at 3:23 pm coool i want to see the renders ^^ Achim Luebbeke Says: June 8th, 2010 at 3:44 pm Thanks for sharing these nice pieces! Did you build up some of the houses in blender before you draw it as you’ve shown in one of your painting examples, or did you draw all of them from scratch? Maybe, you can show more of them until the release of the final movie… 🙂 Greetings to the team! Wish you a good progress! John R. Nyquist Says: June 8th, 2010 at 4:13 pm Very nice! I especially like that last one! Omar_Ramirez Says: June 8th, 2010 at 7:14 pm Really great art! dark blast Says: June 8th, 2010 at 7:41 pm Whiw! Can’t wait to see the movie! you have good skills on environment and creatures! keep it up good job man! Love the chicken run scene! haha Benjamin Bailey (Banor) Says: June 8th, 2010 at 9:50 pm Cool. Nice work! 🙂 Benjamin Bailey (Banor) Says: June 8th, 2010 at 9:51 pm Great work on the baby dragon concept. FishB8 Says: June 8th, 2010 at 10:51 pm I love this type of stylized look almost more than 3D. Perhaps once freestyle is incorporated, the BF might consider taking on a 2.5D animation project for a more stylized look using NPR and painted textures. I would love to see this type of look animated. yoff Says: June 8th, 2010 at 11:54 pm Great art as always from you 🙂 Davis, I second that, an update from Jan would be most interesting… Laura Lyle Says: June 9th, 2010 at 12:00 am Wonderful work. I’m looking forward to seeing how everything comes together. Artwork is something I love doing, and while totally a novice, I recognize through my aspirations of learning, all the work that’s involved in producing work like this. To everyone on the project,… thanks. The effort serves as inspiration, and of course I look forward to seeing the finished film. nawabz Says: June 9th, 2010 at 11:25 am thanks guys for all your encouraging comments. i am flattered. i have given the best of my attension for durian and i think it deservs much more attension and i will be posting more work, keep your comments comming in (B!) originalbbb Says: June 9th, 2010 at 1:34 pm Speed painting? It would take me hours!!! Eemo Says: June 9th, 2010 at 3:32 pm Wow Oo Toujours aussi impressionnant ^^ Another Fellow Says: June 9th, 2010 at 10:56 pm @nawabz what now XD chimericidol Says: June 10th, 2010 at 4:35 pm Great job. I love that they look like really good film shots. My favourite is the one that we can see Sintel from the top. jirms Says: June 11th, 2010 at 5:34 pm Thank you David! I especially like the ziggurat. It seems to have elements of both ancient Mesopotamia and Machu Picchu. neo22 Says: June 12th, 2010 at 9:04 pm Nice one !!! Riboshom Says: June 13th, 2010 at 4:57 am The third picture is just spoiling to me… “The big dragon is scales’ mother. It’s just too obvious! Luis Felipe Says: June 13th, 2010 at 7:13 pm Excellent travaille David! j’aime beaucoup les deux dernières images. On voit comment le “mood” dans tes images est aussi dans le film, très intéressant Me Says: June 23rd, 2010 at 5:54 pm Speed painting. :…( Ariel Says: September 10th, 2010 at 9:41 pm I can’t wait to see the movie!!! Thanks"
