full_description = "« Jan Morgenstern nominated for Goldsmith awards Sintel blu-ray .iso download » Sintel full studio svn online on July 9th, 2011, by Ton As requested by Tim Chen, a Taiwan University researcher who created a great non-linear image revision system with a GIMP prototype: http://www.youtube.com/watch?v=RBL1cVzIQik the full studio svn database for Sintel has been put online as well. Tim needs this data to investigate how a studio workflow for CG animation film goes in practice, and to check on the feasibility to develop a similar revision system for .blend files. If you check the video, this would certainly provide a revolutionary workflow for teams on films! For anyone interested to investigate studio workflows in general, our svn is available for download here: http://download.blender.org/durian/svn/ There’s also an md5 for the files. The .tar files have been created like this: tar -cvf - ./svnroot/durian | split -a 4 -d -b 256m - /tmp/usb/durian.tar Files that have been uploaded should be 268435456 bytes each, which exception for the last file which is 153933824 bytes. Total size of the svn data is about 114 GB. Tips for how to merge it all and untar I found on this page. -Ton- This entry was posted on Saturday, July 9th, 2011 at 4:07 pm and is filed under Development, News, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 6 Responses to “Sintel full studio svn online” Satish 'iluvblender' Goda Says: July 10th, 2011 at 10:00 am Epic! 🙂 D Says: July 10th, 2011 at 12:45 pm Oh boy! >_< Kemeros Says: July 13th, 2011 at 1:11 am Impressive stuff! Markus Says: July 19th, 2011 at 5:23 pm Hm, nice, but I don’t want to download 114GB, that would take a week.. Can you make the durian SVN directly accessible or just the production files? Shaun Says: September 20th, 2011 at 3:02 pm Guys I can’t download 114 GB and I want to download the scales baby dragon model. Please can someone of you help me out here? Thanks Josh Says: September 25th, 2011 at 9:22 am I’ll smack up a torrent with all the individual files in it, then in uTorrent you can choose which ones you wanna download, alternativley I am working on uploading and indexing all the files on my website. Links for both will be posted here soon! -Josh"
