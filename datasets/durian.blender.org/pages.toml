ppears, cured with an expression I came back, I lost, then they 3 will happy = D Or a story in which she and the baby dragon that was saved in the end, go into something to resurrect the dragon it = D but for God’s sake, do the second movie with a happy ending, but the dragon died, come back or appear again, at least to talk to forgive her, just so my Awareness will be left alone, please = ( My soul demands it = / pleaseeeee. tria Says: August 21st, 2011 at 10:37 pm Any plans for releasing a stereoscopic version of the movie (3D version). Maybe side-by-side or sequential. Given the fact it is made by Blender it will be easier to do as all what is needed is a second rendering view, not to mention it will be great! Cyrox Says: November 8th, 2011 at 3:49 am Hmmm… I downloaded and burned the blu-ray .iso to a BD-R using Nero Burning Essentials. I played it in my PS3, but no video, only sound. Why? saeed Says: November 19th, 2011 at 10:57 pm salam"
