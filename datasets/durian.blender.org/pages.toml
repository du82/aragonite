description = "Sintel, the Durian Open Movie Project"
full_description = '''« News about Chaos & Evolutions Render gallery update » Sintel’s Cabin, featuring Indirect Lighting! on March 14th, 2010, by Pablo Vazquez Yo! Pablo (venomgfx) here, on my debut as Durian Blogposter (sounds cool uh? 😀 ) The past week was awesome!, not only because it was my first one here :P, but also because David came all the way from Toulouse, to help out, and he was a huge help. Sintel Cabin’s Progress, more detail needed! Even though its not finished, blogposting wont hurt (hope so!). On this scene, my work was supposed to be design-model, then light/compo this shot, but since this was my first week, I’ve been told “No need to be completely productive the first few weeks”, great! relief.. so I took some time to learn the workflow and pipeline here, luckily is really similar to how I use to work before and on my personal projects nowadays. So, Monday was mostly settling down and playing with the file I found first, which was pure proxies (top-left frame on the screenshot >> ), needed to design! but luckily for me that day David arrived, so I quickly set up basic lighting on a file Soenke worked before (adding the stuff shown at the top-right frame on the screenie), for Tuesday I got a *beautifully* made paint-over my render, even in 2 flavors! sort-of-day, and night. Sintel’s Cabin paint-over by David Revoy Then Wednesday went about modeling all the small details everywhere, with such a great reference this task was relatively easy, just a matter of time.. Thursday!, until this day I used Approximate Ambient Occlusion’s Indirect Lighting for this scene, which gave me nice results overall, I felt I was in the right path, probably would need a lot more tweakings for faking stuff (bounces, shadows mostly), until I saw some experiments Soenke was doing with Raytraced IL, “wow! gotta try that!” <- along with a O.O’ face, OK render times went up a bit, but the results (and less work on fine tuning/faking stuff) deserved it. Below is the render with Raytracing IL and Approximate respectively, not really fair comparison though since the Raytraced one has some minor changes to lights , basically because the bouncing was too strong making everything too bright, this also demanded some changes to the materials.. so I spent most of Thursday on tweaking the shading/lighting, some modeling as well but not as much as was needed. Sintel’s Cabin Work in Progress, Indirect Lighting tests. It’s Friday! (..I’m in love! ♪, recalling The Cure, but actually I had a crush on Indirect Lighting 😛 ) Was time for my first weekly! and to show what I’ve been working on the whole week, even when I think I could have done much more this week, I also believe I learned a *lot*, specially on the rendering side, it’s been very productive to me and I’m glad I still have a week more scheduled for this scene, so I can catch up with what I have left to do (more models/cloth!), and also because that scene is not only a bed/wood/medievalish stuff, characters are missing in there! Lighting setup at the left, how it bounces at the right. Before wrapping up I want you to see a small screenshot that shows how much magic goes behind Indirect Lighting, on the left is the setup showing I only used 1 Spot lamp for the “Sun”, then a Halo light for the beam light, and the rest is all bouncing (plus a big blue emitting material plane as sky), at the right is sort of how the light bounces to lit the scene 🙂 , a whole new world for me at lighting, love it! 😀 Ouch already Sunday morning here :/ gotta get some sleep to kickoff the week tomorrow. That’s all folks! 🙂 Pablo Tags: cabin, GI, indirect, lighting, render, sintel This entry was posted on Sunday, March 14th, 2010 at 11:41 am and is filed under Concept-art, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 50 Responses to “Sintel’s Cabin, featuring Indirect Lighting!” Gallardo Says: March 14th, 2010 at 11:52 am Whoa, first 🙂 Those renders really look awesome. Love the mood of the render! Sintel is going to be brilliant, i can feel it. Great work guys! NooBPoWeR Says: March 14th, 2010 at 11:58 am Awesome! just AWESOME! Pablo Vazquez Says: March 14th, 2010 at 12:06 pm Thanks a bunch! By the way, this week the whole Durian team switched to the Render Branch, which is the one I used for the renders above. We will be using this branch for now, but the merge with Trunk is going to happen very soon anyways, so we’ll be back to Trunk. Satish 'iluvblender' Goda Says: March 14th, 2010 at 12:17 pm Just Beautiful… I have been playing around with Environment lighting myself.. and Indirect lighting too.. Keep up the good work folks.. Cheers from India, Satish. horace Says: March 14th, 2010 at 12:18 pm nice renders! did anyone test already how this new indirect lighting works with animation? does it flicker? are you sure already that you will use it for final rendering? nawabz Says: March 14th, 2010 at 12:38 pm coool nice renders indeed. AWSOMEEEE kaZoo Says: March 14th, 2010 at 1:05 pm …,amazing,…you guys are great,i can’t imagine how much work is going in this,but i can tell you need a little sleep :D,…anyway I was wondering what’s with the roof on that bed,I just don’t get it, looks weird :S kram1032 Says: March 14th, 2010 at 1:09 pm Great results 😀 tyrant monkey Says: March 14th, 2010 at 1:09 pm that looks really good, damn that just made my day top notch stuff Pablo Shiretoko Says: March 14th, 2010 at 1:12 pm Wow, my favorite guy VenomGFX Pablo! YAY!!!!! Absolutely stellar stuff, great work. Update again next week too. Thanks for sharing. Shinobi Says: March 14th, 2010 at 1:16 pm This post shows clearly and unmistakably why the entire community was taking his breath waiting and hoping for a great GI implementation coming in Blender, now that day has finally come and Blender could produce a totally new render quality level, matching what CG really asks for. Good GI is a must for a modern renderer, I really can’t understand people referring to this as “whistle and bells”…. mad… Anyway, this is totally awesome, Pablo, and I’m happy to hear the team switched to the render25 branch! @ horace: have you read Render development update Blog post? The whole hard work Brecht put in this astonishing GI solution is aimed at producing great quality, at a good speed and… … flicker free in an animation wise environment! 😉 That’s even more astonishing to see at it under this point of view. @ Pablo, are those cabin log/trunk rendered with tile subdivision? The displacemente level of detail is incredible…. Shinobi Says: March 14th, 2010 at 1:22 pm There is no reason left to still with Approximate Ambient occlusion now, the only one I can spot is (render time apart) a better bump handling (you can spot this in comparison screenshot), but I think Brecht is working hard on implementing this in the render25 branch for Raytrace Indirect Lighting too, soooooo…… go Brecht, go team, and wait for final results! 🙂 wayne Says: March 14th, 2010 at 1:29 pm stunning! good job guys, love the visual style of the renders. paintovers are pretty too 🙂 wayne Says: March 14th, 2010 at 1:33 pm could we get hi-res renders / paint-overs? would love to use them as 1080p wallpapers 🙂 KLLo Says: March 14th, 2010 at 1:48 pm Very impressive. David’s talent is a blessing in this project. Well done Pablo! the raytraced IL looks really well. I can image those fabrics swinging with the wind. You said Soenke was doing some experiments that made you think: I got to try “that”. Was “that” the raytraced IL itself, or some other tricks? do tell pls. Another Fellow Says: March 14th, 2010 at 2:11 pm I love you pablo XD That’s some great work. I also like the whole Durian team XD Maya Says: March 14th, 2010 at 2:34 pm Pablo, use the Mortar and Pestle thats on blendswap:) Its on davids drawing but it’s not in the render 🙂 KLLo Says: March 14th, 2010 at 2:50 pm I keep watching the cabin render with raytraced Indirect Light and looks really well. But just getting nitpicking I was wondering if you’re planning to use Image Based Lighting to add that subtle variations of light that make things even more realistic. rickyblender Says: March 14th, 2010 at 3:01 pm very nice render for this scene any site where we can get more news about this new render branch? also tried to play with this new indirect light now anyway to get control which faces emit light may be with reflection map or several mat with diffe spec an diffuse values ? very interesting work guys keep up the good work – can’t wait to play with the advance version! happy 2.5 Pablo lizardo Says: March 14th, 2010 at 3:32 pm Wow pablito awesome work!!! And only in a week! I’m looking forward for more news! Big hug from a tocayo! Del McOmie Says: March 14th, 2010 at 5:38 pm Je pense qu’il devrait laisser Rob Russell a continué comme le leader de la tribu. En fin de compte, aura pour tenter de les amener à voter contre lui au large à une grande menace, puis Russell pouvez cliquer Slide duude o awsome Says: March 14th, 2010 at 6:01 pm PABLO I WANT YOUR BABIES Sjoerd van Kampen Says: March 14th, 2010 at 6:03 pm PLEASE make a tutorial on this AlphaSite Says: March 14th, 2010 at 6:17 pm Hey, anyone else notice the “i <3 Drag" in the corner? 🙂 Hehe Bao Says: March 14th, 2010 at 10:16 pm Great work. I love the style of the renders. And 2D artists are not dead in a 3D world. They are creators and 3D artists need the creators. David must be on the team texturing or whatever while he is not correcting/creating. Don’t let him fly again to Toulouse, use some rope!!! RNS Says: March 14th, 2010 at 10:20 pm This feature will be excellent for my Sea Fleet under water scene.please finish the alpha series testing. JustinBarrett Says: March 14th, 2010 at 10:44 pm Yeah, saw the I love drag in the first image….ROFL. Victor Says: March 14th, 2010 at 11:42 pm am I crazy? or I can see the image divided in blocks/cells in the rendered image with GI(gathering), look at the cloths, I mean during composition… there are glitches. I’ve seen this happening when I was rendering your last work, Pablo, from your website on blender-alpha-2. A centered block with a darker tone. Linkeltje Says: March 14th, 2010 at 11:50 pm Wow excellent post! Very bright, the information on the light 🙂 I’ve got to love those paint-overs, I can see they helped a lot to build to those renders. Speaking of… they are already beyond my expectations. It just looks fantastic! Aoti Says: March 15th, 2010 at 12:29 am Fantastic renders! Keep up the excellent work. Tea Monster Says: March 15th, 2010 at 12:38 am Wow, I love it, I can’t believe how far the renderer has come in just a few months!!! Oh, and is that a ‘God Ray’ over the bed in the IL test shot? Eibriel Says: March 15th, 2010 at 1:26 am Wow!! Great to see a fellow working on something so good! Greetings from Argentina! D Says: March 15th, 2010 at 2:30 am Thank you, Plablo! 😀 Even though you can see that the raytraced IL is a lot more blotchy compared to AAO, the lighting on the rolled up pillow for example is infinitely more natural! O, what the final product by June might be like. 😀 Bmud Says: March 15th, 2010 at 3:38 am Keep on rocking it, Pablo. Coloring and lighting is where I really like to do my damage too, so any posts you put up like this one gives me that warm fuzzy feeling 🙂 eeean Says: March 15th, 2010 at 6:16 am @Victor: This happens in the Render preview window, so I suspect that the image on the left came from a screenshot of that window. If you save the image properly it does not happen. Shinobi Says: March 15th, 2010 at 11:51 am Victor said: “am I crazy? or I can see the image divided in blocks/cells in the rendered image with GI(gathering), look at the cloths, I mean during composition… there are glitches. I’ve seen this happening when I was rendering your last work, Pablo, from your website on blender-alpha-2. A centered block with a darker tone.” Victor and eeean, that is a rendered image, not preview render. Then, why those blotches? http://e.imagehost.org/0483/too_low.png Because of a very low amount of samples in that raytrace indirect lighting test, consider it is only a quick render test (it has to render fast), 12 samples is waaay to low for a decent blotches-free image, but enough to show IL effect and something good to the community. I did some test myself and I can say in my scene I have to reach something like 36/48 samples to get good results. Pablo Vazquez Says: March 15th, 2010 at 12:27 pm @ horace: Rendering with enough samples should give you non-flickering results, it is what we’re going to use for the end product, so! @ kaZoo: yes I still need to work on the thickness of the logs, they are much smallers on the drawing, they should give a feeling of protection to Sintel (which now they don’t, is more like a feeling of “this is going to hurt if it falls” 😛 @ Shiretoko: Next scene I’ll work on I will try to blogpost as soon as its in a level I like (not final but somewhere there, like the shot on this post), thanks! @ Shinobi: Actually it’s not displacement!, just a NormalMap with good 2.5’s filtering 😀 , I made some experiments with displacement and its awesome mostly now than Brecht fixed some mapping stuff, so is definitely something I’m using soon. @ wayne: Wait for Sintel to be there! will look so much better 🙂 @ KLLo: He was working on the Shaman’s scene, and lighting the whole place with just two main sources of light, the rest was all bouncing, so I wanted to try that with this scene, I bet we will see some of this renders here soon 😀 @ Maya: Will try to add them, they’re a bit lowres but I think pushing the bump mapping of it could work 🙂 , I already took a candle for this scene from BlendSwap !, there are many files on queue to be added and I always check for new ones 😀 @: KLLo: At the moment I’m using SkyColor for Ambient Occlusion, no SkyTexture, but yes I could try.. at least for AO, since is not possible to do it for Environment Lighting yet, don’t know what the plans are to add this but haven’t heard news from it. @ rickyblender: I guess you can control via a texture affecting the Emit values, on this shot there is only one object using Emit (the big blue plane on the back), the rest is all bounce of light coming from the Spot Lamp. @ Sjoerd van Kampen: Sure! About what specially? could save it for Venom’s Lab Volume 2! 😛 @ Bao: yeah would be awesome to have him fulltime 🙁 but he is flying again in two weeks! 😀 @ AlphaSite: sshhh!! Spoiler alert! 😛 (hehe I love to add this little messages/thingies everywhere) @ Victor: You mean Johann van Grosso? Because that one was RayTracing free, just ShadowBuffers and Approximate Ambient Occlusion, should not give this gather artifacts, the ones on this scene are because I used just 12 samples, when I should be using more than 48 at least. @ Tea Monster: God Ray? that’s just the sun going through the little holes on the ceiling! 😛 None of all the Gods have nothing to do'''
