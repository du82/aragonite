full_description = "« Merry Christmas ! Sintel, the HD version (scaled from 4k) » Production updates on January 13th, 2011, by Ton The blog is quiet, but there’s still work on Sintel being done here. In the past two-and-a-half months we worked on getting the film fully re-rendered in 4k, in a resolution of 4096×1744 pixels. When Pablo left back home to Patagonia mid December, Dolf took over his job for the final-final tweaks and solving some render errors. Yesterday he sent the last tweaks to the farm, and we might have today a working version! Last week I watched with Dolf the full re-render in 1920 wide downscaled png playback, and the detail in the images is just amazing! It also pointed me to the fact our mp4 files here are quite heavily compressed… we should replace them with 800M versions or so. In the next days (within a week) we aim at publishing the 1920 (“HD”) wide pngs online, so people can play around with compression setups. Please post links to movie files here (ogg, mp4) if you have good ones, then we update it on our mirrors too! We will also output an original 4k version in 3×16 bits DPX format. That’s been sent on USB drive to our sponsors first, but I know they won’t mind us sharing it. Still would be awesome to have a couple of public screenings of the 4k version announced. Stay tuned! I do know that on NAB Las Vegas Sintel (in 4k) will get prominently covered. 🙂 Another update: Jan Morgenstern made a soundtrack without voices, for dubbing pleasure: http://download.blender.org/durian/movies/sintel-m+e-st.flac (71 MB FLAC, 48 kHz 16 bit Stereo) Laters, -Ton- This entry was posted on Thursday, January 13th, 2011 at 2:49 pm and is filed under Development, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 26 Responses to “Production updates” Satish 'ILuvBlender' Goda Says: January 13th, 2011 at 3:52 pm Great news Ton 🙂 We will definitely watch it in our Studio’s screening room as well. -Satish. zsl Says: January 13th, 2011 at 5:22 pm What will be the next Blender Foundation project? You mentioned incorporating live actors. Will it be finished in 2011? creek23 Says: January 13th, 2011 at 5:40 pm a minus-one soundtrack? cool! (/me will now enter voice-acting lessons ^^) Programador 3d Says: January 13th, 2011 at 8:25 pm Thank you so much by the soundtrack. Now we can try do the brazilian portuguese version. Franck Says: January 13th, 2011 at 8:56 pm Don’t forget to update the gallery when the 4K version’s done ! 😉 mitras2 Says: January 13th, 2011 at 10:28 pm Quiet nice to see that work on Sintel is still going on. Thanks for the great job (also to Jan M.) What’s about a 3D Version on Sintel – Are there still plans to makt this possible or has this idea been cancelled ? (Will there be a possibility for the community to donate directly for the Sintel3D-Project ?) -mitras2 Jon Says: January 13th, 2011 at 10:28 pm Any word on when (or if) the 5.1 flac files will be available? J. Says: January 14th, 2011 at 12:25 am Same question, 24 bit, please! What’s the status of the DCP version? (I know Fox did some tests but based on the 8 bit PNG version) It’s great that the 4K DPX version becomes available, but for a DCP you actually also need the cinema audio mix made at Konken Studios. (instead of making a Dolby MO disc you just convert them to WAV files which later get packed as MXF in the DCP) Btw, it’s possible now to make DCPs with open source software, so you can also do it in-house. Otherwise ask Wolfgang Draxinger, who also made DCPs of Elephants Dream 3D. D Says: January 14th, 2011 at 4:04 am It’s good to read an update. 🙂 Thanks Jan for the voiceless audio! Now for the musicless one! 😀 Mathias Says: January 14th, 2011 at 3:56 pm Nice you finally realized the old encodes suck quality wise. I hope someone gets them right this time. And I really wonder if you managed to get rid of the banding in the pngs. Would be interesting to see a png from for example the opening fade-in. The banding was most pronounced there. androvsky Says: January 14th, 2011 at 8:31 pm Wow, you’re posting the 16-bit per color DPXs… awesome! I’m really looking forward to seeing this in all of its 4k glory. 🙂 Anonymous Says: January 15th, 2011 at 12:39 pm @Ton: Awesome! @Jon: http://media.xiph.org/sintel/ ? Jon Says: January 15th, 2011 at 7:15 pm I have the Xiph site bookmarked 🙂 Jan has released the 5.1 Dolby Digital mix, but I was asking about the uncompressed 5.1 flac files, which to this point have not been released (not sure why). I’m trying to create my own DVD of the blender films. To do this Ihave to have a media stream of 23.976 FPS. The Dolby track is at 24 FPS. So I have to decompress, edit, and recompress an already compressed audio track. It end up sounding pretty flat and pinched. With the other Blender films this wasn’t an issue since the 5.1 flacs were available. I could do all my editing on pristine audio and then compress it once when done. Anonymous Says: January 20th, 2011 at 8:09 pm High quality version of Sintel open movie from Blender Foundation, in 1080p, H.264 and AAC 5.1. http://www.demonoid.me/files/details/2523891/01041214292/ http://thepiratebay.org/torrent/6114242/Sintel.1080p.h264.AAC 🙂 Nanobug Says: January 24th, 2011 at 4:57 am @mitras2 – Absolutely, everyone showed a lot of interest in the 3D version, as can be seen by all the comments at http://www.sintel.org/production/opportunity-stereoscopic-sintel/ I am sure the community is large enough that we would be able to raise sufficient to finance the 3D version, and especially the update of Blender to have 3D capability built-in. If you can’t get outside sponsors for this Ton, let us know how much money we need to raise. Karoly Says: January 26th, 2011 at 5:42 pm Truly wonderful work and I can’t wait for the follow-up projects to come. When you publish frames next time, would it be possible to also provide a single-file archive instead of just tens of thousands of frames separately (like you did for the trailer)? erik90mx Says: January 26th, 2011 at 8:39 pm that is perfect! i have a little question… when we can dowload de models, sounds, .blends files of Sintel? sorry for the english Greetings Nanobug Says: January 27th, 2011 at 3:28 am @Erik90mx – just buy the Sintel DVD set of disks from this site – they have all the source Blend files, and textures, plus lots of tutorials and other goodies. Am having lots of fun going through it all – they are great! 🙂 JamesMR Says: January 28th, 2011 at 1:26 am If I have the time, I’ll dub sintel in broad scots erik90mx Says: February 1st, 2011 at 4:27 am I see them advertised on the page! I want to buy it but I’m from Mexico … How long you think It would arrive? Anything for Blender!! 🙂 Greetings PeterF Says: February 4th, 2011 at 4:21 am Wow, amazing movie. Stop making me cry! :,c Teddl Says: February 5th, 2011 at 11:30 pm I was quite a bit dissapointed after watching the film I downloaded here. Thanks for the opportunity to make a better looking One for everybody! 800MB 1080p x264 7000kbits video and the ac3 master 51 audio. torrent http://www.btghost.com/link/60909518/ I think this is a good one: png http://media.xiph.org/sintel/sintel-2k-png/00016906.png compressed http://www.imgbox.de/users/public/images/8Ng2gEpsIO.png Teddl Says: February 5th, 2011 at 11:37 pm I was quite a bit dissapointed after watching the film I downloaded here. Thanks for the opportunity to make a better looking One for everybody! 800MB 1080p x264 7000kbits video and the ac3 master 51 audio. torrent http://www.btghost.com/link/60909518/ Dan Says: February 9th, 2011 at 4:10 pm Great work, Although absolutely horrible story, not sure the point of this at all. Just too sad. Ton Says: February 10th, 2011 at 8:10 pm Jon: check the new post, the uncompressed soundtrack in 5.1 is now available Erik90mx: Mexico can take 2-3 weeks to arrive, depends on where you live too Dj Garfield Says: February 11th, 2011 at 9:26 pm What a Nice Work , pretty Sad story , but a lot of Emotion , I had Try blender few years ago and I can imagine how many times spend to reach this level !!! Very Very Good Work !! I Buy The 4 DVD Box Today …"
