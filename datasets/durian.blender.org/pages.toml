title = "Sintel, the Durian Open Movie Project  » Blog Archive   » Snow Environment Design"
description = "Sintel, the Durian Open Movie Project"
full_description = "« Fight!!! Rigify Auto-Rigging System » Snow Environment Design on December 15th, 2009, by ben David didn’t have enough time to do much design on the snowy environment before he left, which gave me a chance to do it. Now that the fight choreography is well underway I have been doing sketches, talking with Colin and the others and working out a an environment design that looks cool and fits the requirements of the fight. It almost goes without saying, but for the sake of those who are newer to 3D and Blender – the more fleshed out the concept art is the easier the rest of the process becomes. It’s something that took me a while to fully appreciate while I was starting out so I thought I’d just mention it anyway. Same deal as usual, click to enlarge: 1. Concept painting 2. Flat render of the proxy environment WIP 3. Paintover of the proxy environment WIP, just to help everyone visibly check it’s still heading in the right direction. Can’t have everything stuck in the back of my head because I’d much rather make changes we are all clear on now than after a week or two of solid work. Through rounds of feedback there will be changes to the structure, look, feel and so on but for now the file is over to Colin to start moving cameras and character blocking for the layout. The background mountains can obviously be changed around a lot but you will notice that within the space of a day the horizon is already very different to my first painting. This way it feels more like a part of an epic landscape, rather than having the fight conveniently take place at the pinnacle of an epic landscape. Decisions, decisions… Software was Gimp for anything painting related, Blender 2.5 for the little bit of modelling so far. The concept art was all done in Gimp, blending some photo reference into painting. Also to re-iterate, the environment model is simply blocking in the forms for Colin to plan the shots. Then based largely on the shot placement, the actual set will be modelled. – Ben This entry was posted on Tuesday, December 15th, 2009 at 9:20 pm and is filed under Concept-art, First Minute, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 45 Responses to “Snow Environment Design” Gu4r@ Says: December 15th, 2009 at 9:36 pm Good! looks promising. radek Says: December 15th, 2009 at 9:48 pm David is missing … Bart Robinson Says: December 15th, 2009 at 9:54 pm Very nice looking. Will distant parts of the environment be matte painting? Blendipel Says: December 15th, 2009 at 10:15 pm The model looks promising, the painting looks great. In my opinion, the painting’s still a lot better than the 3D version but I’m sure you get the model to this level, too. 🙂 Alexander Carby Says: December 15th, 2009 at 10:16 pm Looks athmospheric, shouldn’t this article be signed with a name like the others? I like seeing names 😛 Rickyblender Says: December 15th, 2009 at 10:16 pm looking nice Is this only a painted image or computer generated? and done with which soft ? may be new volume feature in 2.5 ? happy 2.5 wo262 Says: December 15th, 2009 at 10:22 pm the ice “spikes” and other shapes shoud go in the same direction. the wind sculpted them with the years. more inspiration http://i.neoseeker.com/ca/unreal_tournament_2007_conceptart_TKkdb.jpg notice the shape ben Says: December 15th, 2009 at 10:36 pm @Bart Robinson – Probably a mix of matte painting and model / texture for the surrounding mountains and background. Depends a lot on how we enter the scene. Colin might want to pan over some mountains and so on. @Alexander Carby and Rickyblender – updated the post a bit. Was trying to finish quick so I could get home a little earlier than usual. @wo262 – Interesting point, it’s heading towards a stylised film, but Colin and Nathan in particular like to think in terms of what would make sense in the scene and why. Will look into it. A prime example of why the various iterations, checking and planning are important. 🙂 MrNoodle Says: December 15th, 2009 at 10:41 pm http://www.blender.org/development/release-logs/blender-242/blender-material-nodes/ You might find the ice node-material by Andy useful 😉 MeshWeaver Says: December 15th, 2009 at 10:53 pm really AWESOME 😀 wish i could make good stuff like that… …i think i need to practice sketching, i’m gonna need to do stuff like this 😀 really awesome 😀 alalo Says: December 15th, 2009 at 11:00 pm Looks very nice. The dead looking paisage in the third image makes me wonder.. What kind of infra-structure is behind that gate? hmm.. The place is hostile, the keepers are hostile. I am definitely curious 🙂 But this is a WIP. I also wonder if there will be more visible rocks/colours and few signs of previous visitors/civilizations. I shall have to wait for the final piece 😀 be200fx Says: December 15th, 2009 at 11:09 pm Real landscapes don’t look like that. Outcrops should all be aligned. google for jagged rocks: http://images.google.com/images?hl=en&um=1&q=jagged+rocks Tim Sormin Says: December 15th, 2009 at 11:44 pm Cool work. I love the initial concept and I think it is much more successful at feeling “epic” than the later iterations. I can understand the reasoning for wanting the sequence to take place within an epic landscape instead of just on top of, or in front of one, but I think it would feel that way if the first image was the establishing shot and the fight actually took place among the outcroppings on the right. Then, if the biggest outcropping was the same scale as the mountain you used for the later 3D proxy images then the sequence would feel both epic and intimate at the same time. Shiretoko Says: December 16th, 2009 at 12:20 am Horrible concept, spiky landscape and no snow particles + vector blur. Please use this as your concept and reference: http://www.youtube.com/watch?v=WrkXHW3L7Nc&feature=player_embedded Sévérino Says: December 15th, 2009 at 11:37 pm Hello everybody, Excuse me, but