full_description = "Archive for the ‘Goodies’ Category « Older Entries Sintel ‘Lite’ – Character file for testing / learning. Sunday, February 27th, 2011 PLEASE NOTE: With the version uploaded to Blendswap.com I somehow left out the textures. The other links are fine. http://cdupload.com/files/164326_afujl/sintel_lite_textures.zip – about 1mb NEW: http://vimeo.com/20972435 – quick video tour. This zip file contains the textures needed to use/render Sintel Lite. Extract to the same folder as the .blend and it should automatically create a folder called ‘textures’ with all the image files in it. All should work as normal from there. http://www.blendswap.com/3D-models/characters/sintel-lite/ – .blend only, about 26mb (more…) Posted in Goodies, News | 32 Comments » Sintel 4k, 3×16 bits available too Friday, February 25th, 2011 After almost 10 days of uploading, the 650 GB of 16 bits TIF files arrived safely at xiph.org. Ralph from Xiph converted these to 16 bits PNG and mentioned it was actually 165 GB less data 😉 Both TIF and PNG are available there now. http://media.xiph.org/sintel/ Hopefully they can manage the bandwidth. Thanks for hosting it xiph.org! We’re very interested to host and link to brand new superior encoded HD Sintel versions. Post urls here! Posted in Goodies, News, Production | 36 Comments » Complete score available for download Wednesday, October 20th, 2010 Hey folks! Jan here. It has taken me a bit longer than expected, but I finally got everything together for the traditional mini-album release of the film score. This time, the bundle even contains a few additional goodies, which I really hope you’ll like. But first things first: The score This 9-track EP contains every bit of music from the film, including the trailer cue, the DVD menu music, and of course the credits song. Since a lot of people wished for a lossless format, I’ve prepared both 192 kbit MP3 and CD-quality FLAC packages this time. Grab ’em while they’re hot: Complete score, 192 kbit VBR MP3, 14.5 MB ZIP Complete score, FLAC, 54 MB ZIP The cover was done by Nick Bueltge (thanks!). Click on it to see the full-res version. The music is distributed under a CC-BY-NC-ND 3.0 license. (more…) Posted in Goodies, News | 83 Comments » Movie posters printed & for sale Thursday, October 14th, 2010 About 250 Sintel posters have been delivered to our office now. They are beautiful quality offset-printed, in original movie poster size: 27 by 40 inches (approx. 70 x 100 cm). Deserves to get a decent spotlight on your wall! Posters will be sent in a strong cardboard shipping tube. Due to the non-standard size, shipping costs are relatively high though. This is why we will only charge shipping costs once, also when you order more posters. More information here in the Blender Store! -Ton- Posted in Goodies, Production | 18 Comments » Sintel on 3D World’s October issue! Tuesday, September 7th, 2010 Hoi! (now you know how to wave in Dutch!) Sintel Cover So! exciting times here at the Blender Institute, today is our very-really-thistimeforsure last rendering day, next to some color grade we need to do still, but then is time to grab those big .EXR files and convert them into friendly DPX’s for the guys at Cineco to do magic with it and turn them into 21312 stills of 35mm chemical glory. That means we’re getting close to our (real!) Premiere, so in order to help us make some noise, 3D World is widely covering Blender topics on October’s issue, Sintel will be on cover + interview time with Ton (Producer), Colin (Director), and William (Animator), and even BBB got a column in “A list of the all the Best CG shorts out there” 🙂 (more…) Posted in Goodies, News, Production | 83 Comments » Three 4k posters Friday, July 23rd, 2010 Here’s a zip with original un-touched 4k renders. One shot (cave) even has bad AA, but that’s because it was accidentally rendered without FSA. 🙂 (more…) Posted in Development, Goodies | 98 Comments » Concept-art : Dragons Wednesday, June 16th, 2010 Hi, As I promised last week I’m back with new digital painting and drawing done during the concept-art period. This week : Dragons ! Here you ‘ll find a mix of studies ( al.chemy , mypaint, gimp-painter or … watercolor ) … And as you suggested me last post ( in comments ), I created them in a friendly resolution and size for using them as wallpaper. More soon ! – David (more…) Posted in Concept-art, Goodies | 49 Comments » « Older Entries"
