full_description = "Archive for the ‘Videos’ Category « Older Entries Sintel at SIFF, with Colin, Nathan, and Ian Hubert Friday, June 3rd, 2011 Sintel was in the Seattle International Film Festival. This was quite convenient for me, since I live in Seattle, but not so convenient for Colin who lives on the other side of the USA. Despite that inconvenience, he still flew across the country to visit and attend SIFF. It was a lot of fun! Unfortunately, it did not occur to us to film anything until the last day he was here, which was after Sintel had already screened. But with the footage Colin shot on that last day, I edited together a short video. Also, we met with Ian Hubert of Project London fame, who also lives in Seattle! Enjoy! Ogg Theora: siff_with_colin.ogv – Nathan Posted in News, Videos | 5 Comments » Sintel, the HD version (scaled from 4k) Thursday, February 10th, 2011 Since the previous post we just couldn’t stop trying to fix yet another few errors. 🙂 It’s still not totally flawless, some of the textures & material settings were too complex to easily debug or fix. The 4k files are being copied to USB drives to be shipped to our sponsors. The 16 bits 4k frames are 650 GB in total… not fun for a mirror, nor for uploading either. Need to solve this still, but maybe xiph.org wants to try to host it. Will keep you updated on it. The 4k film will at least show prominently on NAB Las Vegas this year. (more…) Posted in Production, Videos | 38 Comments » Merry Christmas ! Saturday, December 25th, 2010 1st present I wanted to offer in this special evening a little gift , for your help and your support around Sintel and Chaos&Evolutions during this year 2010. Thanks again , and here is a timelapse commented of my watercolor technic with Mypaint and Gimp-painter. Digital Watercolor with Mypaint 0.9 and Gimp-painter from David REVOY on Vimeo. (more…) Posted in News, Tutorials, Videos | 19 Comments » Directorial Address – July 30th, 2010 Friday, July 30th, 2010 Why hello! This past week has been a bit strange with a nearly empty studio. Nobody’s here to tell me how to feel! In keeping with the tradition of dull and infrequent ‘directorial addresses’, here’s an update from headquarters. ￼ Thanks for watching. 😀 Music by Jan Morgenstern. –Colin Posted in Directorial Address, Production, Videos | 63 Comments » Colin makes a home movie Saturday, June 5th, 2010 Hello folks! Okay, there’s been a lot going on the past few weeks. Sorry it’s taken so long to get a blogpost up! Things are really heating up here and I’m happy to report that we’re all beginning to see the light at the end of the tunnel! There’s a LOT of work left but it seems *almost* doable! So although we do have some stuff to show ya, I thought I’d let you know what I’ve been up to recently– I just got back from the States! Just had a short, sorely needed trip to Savannah, Georgia and back. I was nervous the project would totally collapse without me (who am I kidding?)– but seriously, it was nice to not have to scream at Blender for a short while! 😛 Ton asked me to give everyone a full report, so I hastily put together a home-movie-style video of the trip. (Should be entertaining enough, though I beg you not to screencapture my face onto anything else. I feel like I’m handing you some serious ammunition.) (more…) Posted in Directorial Address, News, Videos | 65 Comments » First Minute Update Friday, March 19th, 2010 Okay okay, should’ve probably updated you on this stuff earlier. The first minute has gone through some radical changes since the last time I posted about it, and I think it’s much improved! To bring you up to speed, the first thing I did was try an alternate ending for the bandit fight, partially based on the comments I received on the blog. I restructured things a bit to give it more of a frantic quality, and to better introduce the Shaman character. I can upload this version if you’re interested. But a few weeks ago we decided replace the scene with another section of the fight scene that was originally placed later in the film. I think this change really streamlined the film and made it feel much more cohesive. An unavoidable biproduct of this choice is that we’ve completely scrapped three of the four guardian characters. (!) (more…) Tags: final animation, layout Posted in First Minute, Videos | 135 Comments » News about Chaos & Evolutions Friday, March 12th, 2010 Hello, My week in the Durian team is almost finished here, and I couldn’t leave the Blender Institute without posting on the blog. Apart for Sintel , I came to the Blender Institute with the prefinal videos of my DVD “Chaos& Evolutions” . And after some corrections, I decided to release the third video today about Alchemy ( edit: free, multi-platform and open source, download it here ) . (more…) Posted in Concept-art, Goodies, News, Tutorials, Videos | 53 Comments » « Older Entries"
