title = "Sintel, the Durian Open Movie Project  » Blog Archive   » Make us a backpack!"
description = "Sintel, the Durian Open Movie Project"
full_description = "« Crash, stress, fatigue, welcome Joe! Memory & JeMalloc » Make us a backpack! on April 12th, 2010, by Colin Levy Yo! We’re stretched to the limit and we need to get a crucial prop for the film modeled and textured: Sintel’s backpack. Instead of figuring out who on the team can spare a half a day to work on this, we thought we’d just open it up to the community! So, what we’re talking about here is the backpack– which includes the pack, the straps, the leathery mesh containerything, as well as the rolled-up quilt. You’ve got THREE DAYS to bring this as final as you can. Show us what you’ve got! Download the Sintel.blend to model off of. No more than 5mb of textures please, and it’s gotta be riggable. So if you use lots of curve modifiers or something, give us an applied version of the geometry on a separate layer. You know the drill. Upload to BlendSwap when you’re done! 😛 We’ll go through the submissions. If one person has done some amazing stitching on the pack but their rolled pad thing isn’t stellar, we may frankenstein a few of the models together to form the version in the film. But we’d prefer not to have to do a lick of work. 😛 So make the whole thing awesome. May the best backpack win! By the way, thanks to everyone who participated in the Extras Modeling and Animation sprint. We’ve sifted through all the work and we’re just now in the process of placing extras in the scene. Hopefully we’ll have an update for you in a week or two. But there was some great work done! –Colin This entry was posted on Monday, April 12th, 2010 at 6:20 pm and is filed under Concept-art, Production. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 38 Responses to “Make us a backpack!” wo262 Says: April 12th, 2010 at 6:29 pm another challenge from Durian Team Blendiac Says: April 12th, 2010 at 6:40 pm So, is anyone on this? I’d be happy to work on something like this, but there’s not much point in having 20 different backpacks done by different people when we could all be working on different things… Ton Says: April 12th, 2010 at 6:53 pm We can put the unused backpacks in a market scene in the film, there’s enough stands! J. Says: April 12th, 2010 at 7:11 pm Sorry, can’t leave it: 😀 http://www.youtube.com/watch?v=BlK9c3FQp8M (Dutch spoken, but the video speaks for itself. 😉 ) Succes, everyone! Still Says: April 12th, 2010 at 7:13 pm Ton; I agree. This will be more effective and we all be happy. 🙂 []’s, Still LetterRip Says: April 12th, 2010 at 7:33 pm Any other back pack concept art? Particularly I’d like to see the front of the strap and the side. Looks like a purse strap style. But would be good to be certain that is what you want. Another Fellow Says: April 12th, 2010 at 7:57 pm I was looking on the Krita user gallery and what did I see: http://forum.kde.org/viewtopic.php?f=138&t=85867&sid=8cca5574d9d5942a92f04e6169e1ff2b I know it’s an old sketch, but still XD Zafio Says: April 12th, 2010 at 8:15 pm What LetterRip said + Are you open to new designs? A.J. Fulcher Says: April 12th, 2010 at 10:00 pm Does the rolled up quilt need to be able to unroll? Also, what kind of material is the pack made of? Thiago Sul Says: April 12th, 2010 at 11:04 pm I’d love try doing it… unfortunately i’ve begun studying blender 1 month ago… D Says: April 13th, 2010 at 3:12 am It’s really hard to find information on medieval backpacks on the internet! Good luck to all contestants. 😀 Great illustration, David! Pablo Lizardo Says: April 13th, 2010 at 3:31 am Hey guys!, nice challenge! i have been working today on that! it’s still a WIP and need a lot of details and more objetcs too, but tell me what do you think! I think tomorrow i will finish it. 🙂 http://www.pablolizardo.com.ar/tmp/mochila_mochila.png bye! Blendiac Says: April 13th, 2010 at 4:02 am That’s looking great Pablo! jeff Says: April 13th, 2010 at 4:47 am 1. Start collecting Sintel backpacks 2. ??? 3. PROFIT !!! John R. Nyquist Says: April 13th, 2010 at 5:27 am Is there a place we can get the PNGs that the Sintel.blend references? Christopher Webber Says: April 13th, 2010 at 5:58 am Pablo, that backpack looks *awesome*! – cwebb Anonymous Says: April 13th, 2010 at 1:54 pm @Pablo Lizardo Very cool! <3 🙂 paddy_anim Says: April 13th, 2010 at 3:14 pm @pablo Lizardo Really good. Detail in the leather strapping and then age it. I’ve always thought of the roll up quilt as a patchwork made by elders to tell her story. The satchel for the bag? i dunno. nice modelling. v. clean and informative. J. Says: April 13th, 2010 at 3:34 pm Pablo, the link seems dead to me! Can somebody put it also on Imageshack? (or something like that) -nw- Says: April 14th, 2010 at 1:55 am @J. The link is dead for me as well 🙁 Pablo Lizardo Says: April 14th, 2010 at 2:56 am Uhh that’s weird, the link works for me :/ anyway, here’s an updated of the mesh. Thanks for the comments 🙂 http://twitpic.com/1ffap4 Deevad Says: April 14th, 2010 at 3:12 am @Pablo Lizardo: Many tanks, you totally have an awesome result. You surely know how to transmit it to the durian team. @LetterRip & Zafio: other concept art = I can’t ; I spent my Durian time actually in matte-paintings. But you can take references with medieval bags, if you want to help modeling bags for shops in the market. @A.J. Fulcher :No, it’s not needed to be unrolled, the bag is in leather mainly. @D : Thanks 😉 it’s true backpacks are not really medieval , but Sintel have to… travel ! @John R. Nyquist: If you still need it, I can upload the early ( a bit outdated) modelsheet of Sintel. But the best is to adapt it on the Sintel model. ( even the low one ) @Christopher Webber : Thanks ! ^^ J. Says: April 14th, 2010 at 3:22 am More worse, I can’t even reach your site at all! The only thing that (sort of) works is pinging on IP adres. And btw, I’m living in Holland, so no China-like censorship or something… 😉 On-topic: Very nice, can’t wait to see the final result! And just put your pics on twitpic from now on, that site works like a charm! 😀 JustinBarrett Says: April 14th, 2010 at 5:27 am Twitter??? Why not pasteall.org? Anyway….the winner will recieve a free version of blender! 😉 Dawidh Says: April 14th, 2010 at 8:46 am Hi guys, when the contest ends? What time exactly? Thanks Jan - 2 Says: April 14th, 2010 at 3:42 pm I hope you don’t mind me interrupting. It is Youth Week here in Lee’s home city of Adelaide, Australia and The Youth Recognition Awards were held tonight in our area. Lee was recognized for his outstanding personal qualities. They recognized that he continued to bounce back from whatever life threw at him and triumphd in the face of adversity. Congratulations Lee, we, your mum and dad are so proud of you. Mark Says: April 14th, 2010 at 5:57 pm Hey, what does everyone think so far? I hope I will have it done by tonight. http://www.facebook.com/nysomin#!/photo.php?pid=161735&id=100000322777681 A.J. Fulcher Says: April 14th, 2010 at 6:44 pm Is there perhaps anything else that needs to be modelled? I’ve ha no luck with the backpack but I’ like to help… Pablo Lizardo Says: April 15th, 2010 at 1:24 am Hey thanks for the comments, very glad again that you like it! I made a little update in the backpack for sintel. I think it’s finish http://twitpic.com/1fn0bc Now I have to convert all the remaining curves into mesh and upload to blenderswap. And then cross fingers! 🙂 Bao2 Says: April 15th, 2010 at 10:06 am Amazing Pablo. Now Sintel can go everywhere they want. Jayden Says: April 15th, 2010 at 10:27 am oh. no more time. well, I hope my cart animation or walking animation got chosen! I hope we have another sprint, just one more to finish i all off. Shinobi Says: April 15th, 2010 at 12:01 pm The bunch of Suzanne itself is worth the entire backpack 😉 Have you added textures too? kingcreole Says: April 15th, 2010 at 3:14 pm -.- damn gotta read more news just noticed this today. anyway next time i’ll try too xD Colin Levy Says: April 15th, 2010 at 4:19 pm Hey guys, the minisprint is over! Everyone upload your models asap! Thanks everyone for participating. Already some good stuff on Blendswap. 🙂 Pablo Lizardo Says: April 15th, 2010 at 11:59 pm I Just upload the model in blenderswap, sorry by the delay, it has the UV unwrap for the mesh (Thanks to @Jarrhead) but no textures on it. Sorry about that. http://twitpic.com/1fn0bc/full Good works on blenderswap! Crossing fingersssss! Jarred Says: April 19th, 2010 at 2:52 am Here is a textured version of Pablo’s model, if it’ll still help in saving time with this process! http://www.pasteall.org/pic/show.php?id=2792. It should be on blendswap. D Says: April 19th, 2010 at 3:05 am That pack is just awesome! 😀 Finally, leather that looks like leather. The buckle doesn’t look like a buckle, yet, but great textures, Jarred! Jarred Says: April 19th, 2010 at 5:57 pm Thanks D, yeah the buckles were neglected as I was running out of time 🙁"
