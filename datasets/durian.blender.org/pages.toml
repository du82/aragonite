full_description = "Archive for the ‘News’ Category « Older Entries World’s first baby named after an open movie character Saturday, December 7th, 2013 Now this is an achievement! When characters go beyond the screen right inside our lives. This blog post is not about the movie itself, is about a new little person… Welcome to the world, Xareni Sintel Ordonez! Some days ago, Daniel Ordonez (a Mexican Blenderhead living in Chicago), sent me an email. But this was no ordinary email, it was about how together with friends and family, they picked the name Sintel for his daughter.Exciting! But we wanted proof 🙂 And Daniel delivered. If some years from now you’re reading this, Sintel, be proud! You’re in the news from the moment you were born. Enjoy the world and don’t stop looking for your dragon. Posted in News | Comments Off on World’s first baby named after an open movie character Sintel 4k, DCP and .mov file Friday, December 16th, 2011 Jonathan Jensen created a 4k (4096 wide) DCP package; the digital standard for cinema: http://blender-mirror.kino3d.org/DCPs/ Thanks to Gianluca “Kino3d” Faletti for hosting it! (27 GB) There’s also a 4k UltraHD (3840 wide) H264 encoded version available now: http://download.blender.org/durian/movies/ (NOTE: Posting comments now has been disabled for this website). Posted in News | Comments Off on Sintel 4k, DCP and .mov file Sintel blu-ray .iso download Thursday, July 14th, 2011 Here you can find an updated (fixed!) Blu-ray .iso. Special thanks to Mathias Linden for the service! http://download.blender.org/durian/movies/ Posted in News | 7 Comments » Sintel full studio svn online Saturday, July 9th, 2011 As requested by Tim Chen, a Taiwan University researcher who created a great non-linear image revision system with a GIMP prototype: http://www.youtube.com/watch?v=RBL1cVzIQik the full studio svn database for Sintel has been put online as well. Tim needs this data to investigate how a studio workflow for CG animation film goes in practice, and to check on the feasibility to develop a similar revision system for .blend files. If you check the video, this would certainly provide a revolutionary workflow for teams on films! For anyone interested to investigate studio workflows in general, our svn is available for download here: http://download.blender.org/durian/svn/ There’s also an md5 for the files. The .tar files have been created like this: tar -cvf - ./svnroot/durian | split -a 4 -d -b 256m - /tmp/usb/durian.tar Files that have been uploaded should be 268435456 bytes each, which exception for the last file which is 153933824 bytes. Total size of the svn data is about 114 GB. Tips for how to merge it all and untar I found on this page. -Ton- Posted in Development, News, Production | 6 Comments » Jan Morgenstern nominated for Goldsmith awards Friday, June 17th, 2011 Both the Sintel score and the Sintel credit song “I move On” have been nominated for a Jerry Goldsmith Award at the prestigious International Film Music Festival: http://festival.bsospirit.com/index.php/en/news/100-festival-07/265-vi-premios-jerry-goldsmith-los-nominados Great milestone for Jan Morgenstern, for the team and of course everyone who helped making Sintel possible! The festival awards will be announced July 22nd. Stay tuned, -Ton- Posted in News, Production | 11 Comments » Sintel at SIFF, with Colin, Nathan, and Ian Hubert Friday, June 3rd, 2011 Sintel was in the Seattle International Film Festival. This was quite convenient for me, since I live in Seattle, but not so convenient for Colin who lives on the other side of the USA. Despite that inconvenience, he still flew across the country to visit and attend SIFF. It was a lot of fun! Unfortunately, it did not occur to us to film anything until the last day he was here, which was after Sintel had already screened. But with the footage Colin shot on that last day, I edited together a short video. Also, we met with Ian Hubert of Project London fame, who also lives in Seattle! Enjoy! Ogg Theora: siff_with_colin.ogv – Nathan Posted in News, Videos | 5 Comments » Sintel ‘Lite’ – 2.57b Update Monday, May 9th, 2011 Download here: http://www.blendswap.com/3D-models/characters/sintel-lite-2-57b/ Hi all, The file pretty much speaks for itself given the previous Sintel Lite post. Beorn should probably get more of the credit for this one seeing as he chased the script changes down this time and a glitch of some sort with the proxy head mesh. On my part, I updated the composite and render setup a little bit to work nicer with Approximate Indirect Lighting, so now you can use mesh based lights. That won’t light hair, cast shadows, create specular or bump details. Basically it just gives diffuse light and bounced light. Ideally you use it in combination with the usual spotlights and so forth. However, with Cycles on the planned horizon that doesn’t seem to matter much anyway in the long run. This file still doesn’t use ray tracing though and I set the Indirect Lighting to one bounce so it still renders quick. The file also loads and renders off a net-book, just doesn’t render nearly as quick. Obviously. I’m still aware that due to the nature of Blender being very accessible, not every Blender user out there has a beast of a machine to use so I thought I’d test it out. Textures should be included this time, although they haven’t really changed since last time. Questions will probably get answered quicker at the forum thread: http://blenderartists.org/forum/showthread.php?206875 or on the Blendswap page: http://www.blendswap.com/3D-models/characters/sintel-lite-2-57b/ Posted in News | 3 Comments » « Older Entries"
