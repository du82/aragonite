full_description = "« Fight Choreography Experiment clouds » 1st minute – Concept arts updates on November 23rd, 2009, by Deevad click to enlarge Here some of the concept art concerning the first minute of the movie. Shaman changed to the definitive one after some Al.chemy research, the shaman hut got some drawings too, and the guardian “Jack” got a portrait to help modelling I painted some weapons : the knife of Sintel, and the blades of the guardians. And to finish my period at the institute in beauty ; I wrote especially for the community a tutorial about my speedpainting process, as you asked me in the previous “1st minute concept art” post. I’m back to Toulouse (France) tomorrow , but I will surely keep blog posting sometimes as I will continue to work remotely on the Durian. I hope you will enjoy ! -David – The tutorial – click to enlarge This entry was posted on Monday, November 23rd, 2009 at 8:26 pm and is filed under Concept-art, First Minute, Tutorials. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 35 Responses to “1st minute – Concept arts updates” Virgilio Says: November 23rd, 2009 at 8:40 pm Great artwork, as usual, David. And thanks for the tutorial! 🙂 Eemo Says: November 23rd, 2009 at 8:57 pm Very good job, as always 😉 I really like it. NooBPoWeR Says: November 23rd, 2009 at 8:58 pm AWESOME! just awesome… Wahooney Says: November 23rd, 2009 at 9:06 pm I must say, I’m in awe of you speed painter types. Thumbs up 🙂 And have a good flight home. Satish 'iluvblender' Goda Says: November 23rd, 2009 at 9:46 pm Very very cool… As someone who is just foraying into MyPaint/GIMP, this post and tutorial is very invaluable Thank You David. ChicOrtiz Says: November 23rd, 2009 at 10:29 pm Jack is just awesome. Loved the closeup expression make me feel curious about his personality! To bad that David needs to leave Amsterdam… :I rogper Says: November 23rd, 2009 at 10:39 pm Inspiring 🙂 Thanks a bunch for the tutorial! Blendipel Says: November 23rd, 2009 at 10:48 pm Thanks a lot, great tutorial and great concepts too! I’m really asking myself how you get your alchemy drawings that defined but I guess that’s just the missing of a tablet on my side 🙂 n-pigeon Says: November 23rd, 2009 at 10:52 pm Just fantastic 😀 Create3D Says: November 23rd, 2009 at 11:39 pm What happened to MyPaint for creating concept art? Jack*RED Says: November 23rd, 2009 at 11:48 pm Thx David for the tutorial 😀 The pictures seems great, I especially like the knife design 😐 gaalgergely Says: November 24th, 2009 at 12:05 am david, thank you for taking the time to explain your workflow. reading your posts is always educational, fun, and inspiring. congrats for the 2.5 alpha 0 splash! Tweakingknobs Says: November 24th, 2009 at 12:07 am man i love the shaman part i hope this comes in, keep it up !!! ;D Christiaan Bakker (AniCator) Says: November 24th, 2009 at 12:09 am Great drawings, David. (h) It’s great to see this project progress. Thanks for posting this, – AniCator Dennis Says: November 24th, 2009 at 12:17 am Love the new shaman design. Hope you use it because I’m very excited to see how you will be able to tackle his huge bread. Keep it up! Gwilwileth Says: November 24th, 2009 at 12:36 am Awesome atworks ! I really Luke this shaman ! Exactly how I imaginated it ^^ The other speed paints a great too ! Bon retour chez toi ! =D Keep it up ! Nixon Says: November 24th, 2009 at 3:45 am yay thx for the tutorial :)…too bad your not gonna be with the durian team anymore at the premises:(…think it would of been great to still have you around as counselor and concept artist in general..theres some awesome stuff that we got to see here and i bet theres lots of more wich still is kept secret due to the 1st min restriction…so anyway great artworks and ideas… hope you enjoyed that project as much as we enjoy seeing it evolve:) best regards!!! D Says: November 24th, 2009 at 4:40 am So much good stuff, David. 🙂 It inspires awe. So, the guardians were the gatekeepers, after all. It’s fun to be able to see more of the non-character designs as well, since they are basically the other half of the movie. I really love the design at the base of the guardians’ blades; it’s a dragon and a tree! Or a mushroom. 😀 The blades themselves seem to be going for an angular look rather than a curved one; I wonder if they work also in real life? The exterior of the Shaman’s home perhaps doesn’t look mysterious enough? 😀 Maybe it looks a little too simple; what if it was made of smaller rocks? Anyway, you have fun on your flight back home, and don’t be slacking off any time soon! xD It ain’t over till its over. Avenger Says: November 24th, 2009 at 4:51 am Are you sure that knife is a drawing? it looks amazing! Man, you really are going to make it hard on the modelling and texturing. Keep up the awesome work though! Arnaud Says: November 24th, 2009 at 5:14 am Oh no, David is leaving already!!! Please keep us informed with great pictures and tutorials. Hey David, why not join CG Cookie, and start a new “Painting” section, or a “Concept Art” section?? That would be great. 🙂 Tono Says: November 24th, 2009 at 5:29 am Well done David! Very impressive 0_o Yorik Says: November 24th, 2009 at 2:47 pm Wow, a deviantart-like tutorial! Awesome! Thanks David! bestgirls.com.ua Says: November 24th, 2009 at 3:58 pm I’m tempted to say “what a load of crap!” just for the sake of irony, but I’ll refrain Chad Says: November 24th, 2009 at 4:20 pm I agree with D on the guardian blades, they look fantastic. I also like the circle theme with the shaman especially the detail of the circle that he sleeps on. Disney_SL Says: November 24th, 2009 at 7:06 pm Amazing stuff! Booboo Says: November 24th, 2009 at 8:35 pm @D there are plenty of old designs with weird shapes, so they must have worked http://www.earmi.it/armi/glossario/glossario01.htm (scroll, and try other pages too) and at worst they can be used in the kitchen http://www.sushitrainer.com/JapaneseKnives/aritsugu.php kram1032 Says: November 24th, 2009 at 11:15 pm Great stuff 😀 I like a lot, how they look 🙂 (Though, I miss the four-armed shaman xD) Nah, the new one is great too and works perfectly fine 🙂 – Actually I couldn’t decide between the two… demohero Says: November 25th, 2009 at 1:08 am In two words: Excellent, perfect. 🙂 Riboshom Says: November 25th, 2009 at 3:11 am “Tu va nous manquer Devaad!” ^^ Jon Nordby Says: November 25th, 2009 at 3:51 pm “Create3D Says: November 23rd, 2009 at 23:39 What happened to MyPaint for creating concept art?” No texture brush, dodge or multiply layer mode. Essential tools in the first part of the workflow shown here. Thanks for sharing David, inspirational as always! Btw, new Devin Townsend album out last week. Its called “Addicted”. Quite different from Infinity tho. Booboo Says: November 26th, 2009 at 2:10 am @D the weapons would work, there was been rarer weapons and tools. Yesterday I posted a couple of links about such blades… but it seems this blog hates the posts I write with links (and they appear after I mention the fact). Narfzilla Says: November 27th, 2009 at 5:17 am The shaman shiukd have dread locks! 😀 sebih Says: November 30th, 2009 at 1:33 am Nice Painting tutorial! Concerning the knife: What about some Damascus steel for a nice pattern on the blade. Would probably look great together with that knife-knob. Cloud_GL Says: December 8th, 2009 at 5:22 am Hi, I’ve been trying to find Gimp Painter and I can only get it from a japanese site, so far I know it’s being made by a japanese, but isn’t there any version on english? Cloud_GL Says: December 8th, 2009 at 6:19 am Nevermind me, I figured it out myself ^^."
