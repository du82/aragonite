ise the same wind that is keeping the rest of the overhang smooth would have destroyed the icicles. Perhaps a hummock or large bolder in front of it, creating a lee? Along with the same prevailing wind pattern, the mountain peak in the top right should have a steeper decent on the right edge, accounting for the drifting of snow. Snow drifts are caused by the sudden decrease in velocity as the wind passes beyond an object. The drop in velocity causes it to drop a portion of whatever it is carrying causing the deposition of snow on the leeward side of objects. Most of the snow deposition will occur at the boundry between fast and slow moving air. When painting/modeling your wind driven snow, you might also want to create ‘tails’ of snow over the crests of peaks. I think it looks great, BTW. Solid foundation to dress up. 🙂 mmz Says: December 16th, 2009 at 3:40 pm it feels lonely and cold. it feels hostile (at least for humans). can’t wait to see sintel in that scene. Rudiger Says: December 16th, 2009 at 3:44 pm I too prefer the initial concept painting. I think it’s because everything appears to be too flat instead of being rocky and jagged in the render. Would you guys consider doing an open call for concept art for some of these scenes. Commercial projects often have dozens of artists coming up with possible concepts for the same scene so the Director has the chance to pick the best one. You have a whole world of potential concept artists out there. Why not make use of them? If you still want it to be a surprise you wouldn’t have to publically announce which concepts were chosen. Guybrush Threepwood Says: December 16th, 2009 at 4:33 pm @tyrant monkey Thanks for the hint that there is a making of the Wrath of the litch king. Here is the link http://www.cgchannel.com/news/viewfeature.jsp?newsid=8144 Great article talking about exactly the same issues the Blender Team faces in the next weeks and months. They talk on page 2 about the matte painting and that they started 