full_description = "Posts Tagged ‘layout’ First Minute Update Friday, March 19th, 2010 Okay okay, should’ve probably updated you on this stuff earlier. The first minute has gone through some radical changes since the last time I posted about it, and I think it’s much improved! To bring you up to speed, the first thing I did was try an alternate ending for the bandit fight, partially based on the comments I received on the blog. I restructured things a bit to give it more of a frantic quality, and to better introduce the Shaman character. I can upload this version if you’re interested. But a few weeks ago we decided replace the scene with another section of the fight scene that was originally placed later in the film. I think this change really streamlined the film and made it feel much more cohesive. An unavoidable biproduct of this choice is that we’ve completely scrapped three of the four guardian characters. (!) (more…) Tags: final animation, layout Posted in First Minute, Videos | 135 Comments »"
