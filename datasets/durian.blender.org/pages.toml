["https://durian.blender.org/goodies/concept-art-dragons"]
title = "Sintel, the Durian Open Movie Project  » Blog Archive   » Concept-art : Dragons"
description = "Sintel, the Durian Open Movie Project"
full_description = "« Render previews Render farm tour » Concept-art : Dragons on June 16th, 2010, by Deevad Hi, As I promised last week I’m back with new digital painting and drawing done during the concept-art period. This week : Dragons ! Here you ‘ll find a mix of studies ( al.chemy , mypaint, gimp-painter or … watercolor ) … And as you suggested me last post ( in comments ), I created them in a friendly resolution and size for using them as wallpaper. More soon ! – David #gallery-1 { margin: auto; } #gallery-1 .gallery-item { float: left; margin-top: 10px; text-align: center; width: 50%; } #gallery-1 img { border: 2px solid #cfcfcf; } #gallery-1 .gallery-caption { margin-left: 0; } /* see gallery_shortcode() in wp-includes/media.php */ This entry was posted on Wednesday, June 16th, 2010 at 2:39 pm and is filed under Concept-art, Goodies. You can follow any responses to this entry through the RSS 2.0 feed. Both comments and pings are currently closed. 49 Responses to “Concept-art : Dragons” Anonymous Says: June 16th, 2010 at 2:41 pm First picture is SO CUTE! ^__^ wo262 Says: June 16th, 2010 at 3:00 pm so final dragon have hair 🙂 iCandy Says: June 16th, 2010 at 3:01 pm the expressions of the baby dragon in picture 3 are fantastic xD iCandy Says: June 16th, 2010 at 3:01 pm oh and thanks for uploading them in such a high resolution ^^ Deevad Says: June 16th, 2010 at 3:11 pm @Anonymous: Thanks! @wo262 : The final dragon in the movie don’t have hair, some of those concept-art are olds and not used for the movie. But during long time in the pre-production I designed them with hair, as you can see on most of those pictures. Mainly to try to be original in this ‘ yet another original dragon design’ concept-art games. The final for the movie never had a fancy 2D digital-painting concept art, but only a model-sheet ( 2nd row / 2nd column ) and paint-overs. @iCandy : Thanks ! acro Says: June 16th, 2010 at 3:14 pm the alchemy studies are brilliant – I’m surprised at how much variance comes through just from the ideas from animal head-body proportions. I really like the bull one with the low head, and the horse, long-necked one. Thanks so much for sharing! Skofo Says: June 16th, 2010 at 3:14 pm That’s awesome! I’d love to see what would have come out of the style in the first pic, but it is better that you guys went for something more mature to contrast Big Buck Bunny. julius666 Says: June 16th, 2010 at 3:16 pm the first one is superb! The others too, but the first one is definitely the best. Codexus Says: June 16th, 2010 at 3:23 pm Trop bien! J’aime particulièrement la page en noir blanc avec les différentes proportions. 🙂 dd Says: June 16th, 2010 at 3:31 pm i like dragon hair rogper Says: June 16th, 2010 at 3:31 pm My favourite is without doubt the Flame hair, Lava walker one on the 8th image. The very first one could easily be included on the Dragon Ball Series and I like it allot also 🙂 Great work on all of them! JGL Says: June 16th, 2010 at 3:32 pm Hi, Excellent concept art !! I see you had many concept ideas for Sintel AND the dragons 😉 Will the concepts that were not used eventually also be released under a CC license ? I’d love to blend something from the fire-haired balrog-like dragon .. Can’t wait to see the final movie !! Cheers ! ______ JG John Fraser Says: June 16th, 2010 at 3:47 pm Haha! Oh, man, if you didn’t choose the current concept for project durian, that first picture would be my next choice–terrific-looking. abhifx Says: June 16th, 2010 at 3:50 pm brilliant as always. i was never a 2D fan and never indulged in it. thanks to you i am trying them big time. the dragon with hair takes the cake for me. but the final dragon in the movie is unique and very awesome indeed. P.S. the girl (assuming sintel) looks so cute 🙂 Cardin Says: June 16th, 2010 at 4:02 pm I like the first picture! It would have fit Sintel’s image well, since she’s basically looking for her pet dragon, which is certain levels of cute and touching. The current Sintel is: Too anorexic Too sharp face features She looks so skinny and weak, yet she can defend herself so well, a very weird combination. I would rather she have some more muscle on her, heck, she can turn into a Hulk and it’ll be a nicer movie. She’s just too anorexic right now… Malcolm Zaloon Says: June 16th, 2010 at 4:19 pm David… wow! Malcolm Zaloon Says: June 16th, 2010 at 4:21 pm it will be wallpaper for my nexus one… thanks man. alalo Says: June 16th, 2010 at 4:40 pm Really awesome stuff, David. Thank you for sharing these and for opening my eyes for alchemy. That is certainly one creativity boost. Now I can not avoid wondering if there ever were a plan to show Sintel as a child with her pet. 🙂 And wow.. That first fat dragon is one big cute dinosaur 😀 heheheh These show that backstage is as fascinating as the spectacle. Cheers. Jirms Says: June 16th, 2010 at 5:30 pm Thank you David! I usually get my backgrounds off of apod (NASA website), but these are great! Joooo Says: June 16th, 2010 at 5:31 pm It was the right decision to make sintel exactly how she looks now – Do you remember: http://dotsub.com/view/a363406a-4d9a-4ca0-9af8-ca767ef52d18 at 5:00: (English translation) “So you see lots of animated porn made with it? That’s what people will do with it, right…” Franck Says: June 16th, 2010 at 5:47 pm J’adore ces concepts-art. J’ai d’ailleurs l’avant dernière image en fond d’écran, elle avait déjà été publiée. J’aurais bien craquée pour celle de dessus, mais elle a malheureusement un défaut qui m’embête, c’est la taille de ses ailes : depuis qu’un commentateur a fait cette remarque sur ce blog, maintenant ça me choque effectivement de voir des ailes si petites. (Partial translation : I love this concept-arts but the wings of the burning dragon are too small) D Says: June 16th, 2010 at 5:58 pm I can finally have that chibi Sintel concept at last! 😀 Thanks, David. So many great ideas there. @JGL, the concept artwork are already CC (check the fineprint near the borders). Ugly Anchorwoman Says: June 16th, 2010 at 6:02 pm The dragons looks fake. Not like reals dragons at all. I have pet dragon. He eats the everythings! Not true? Shinobi Says: June 16th, 2010 at 6:35 pm Oh no!!! You should had choosen the fire haired one for the final model! 😉 It’s astonishing and really original! Thank you David, very beautiful concept. Blendiac Says: June 16th, 2010 at 6:35 pm I’m especially loving the blue, sintel+dragon image that’s third from the end after seeing the “final” render of this scene in Ton’s last post (with the dragon and blue crystals in the cave). Great to see the progression from concept to final 3d! Deevad Says: June 16th, 2010 at 7:45 pm @acro: Thanks , yep for the animal ; that was the key of this design. Thanks for the comment for the bull one, that was one of my favorite too but too much incompatible with the fly scene. The team choosed with me the ‘bat’ shape ( the one with long arms ). @Skofo: About the first pict, ( the chibi Sintel ) this one made a big step in the concept art ; I drew it during a meeting with Colin and Esther, and I’m still happy with it and the relationship in this picture that was an inspirationnal picture for Esther during the script writing. At this moment of the drawing, the team wanted a scene of the Sintel childhood, it was removed with the next script versions. @julius666: Thanks ! @Codexus: Merci ! Differents proportion are mainly made with playing with Iwarp ( filter>Deform>Iwarp with Gimp-painter ) and some painting. @dd : Me too about hair, but I must admit they have difficulties to look like lizard, and tend to have lion head. @rogper: The Dragon Ball series is a huge compliment to me 🙂 Flame hair was a concept in relation of the emotion of dragons, when they turn angry or mad ; but we targeted to something more simple visually, and less complicated to show to the viewer… plus this kind of effect could really distract the viewer from the main story. @JGL : Yep they are all in CC-By license , normally each picture have the terms written on it 🙂 Feel free to use those concept art to your project , I would be happy those dragons can have a 3D life too. And for the ‘balrog’ word ; you nailed it 🙂 A big inspiration from the Balrog of tolkien, and the Ifrit of Final Fantasy series @John Fraser : Thanks 🙂 @abhifx : That’s a huge compliment thanks a lot ! @Cardin : Sintel is very skinny and weak, but that’s a part of the story, we couldn’t design her more fat without having trouble with some scene. ( I can’t be more explicit to keep few secrets of the story ) But I undertsand your POV, thanks for the first pict comment. @Malcolm Zaloon: Thanks ! @alalo : I’m happy if you like Al.chemy, that’s a great piece of software. For the answer about the Sintel child in the final movie ; read the answer to Skofo. Thanks for your comment , more ‘backstage’ concept art soon. @Jirms: Thanks ! I’m happy to make concurrence to the Nasa this first time , they got awesome pict, I’m fan too. @Joooo : Thanks for the link, I remember to was a bit affraid about this and Sintel during the pre-production, true. I was less worried about the John the BBB , Frankie, Emo or Proog 🙂 But Sintel …. She kinda became the daughter of the Blender Foundation , now. I would feel hurted sincerely to see animated porn with her design, even if the author can do it legally with the licence. @Franck ( Fr) : La taille des ailes est effectivement problématique. Je crois que le design a été crée à la base sans ailes, et que ces ailes un peu jouets ont été rajouté après. Mais c’est sur que vue la bête leur taille est ridicule 😉 sorry. Merci pour le commentaire. @Shinobi : Thanks to like the originality of the hairy dragon , Shinobi ! I will maybe re-use the idea in the future for one of my personnal project. @Blendiac: The blue one illustration got a bit of color chroma today to fit the palette of actual renders; the originals colors were blue too , but not that dark. ( a bit flashy colors ) So I kinda tricked the effect to have a match in consistency between the last renders and this concept-art about the cave. But I think it’s still fair ; if I don’t hide it 🙂 Thanks for the comment ! nawabz Says: June 16th, 2010 at 8:31 pm fantastic. keep therm coming Falconblade Says: June 16th, 2010 at 8:42 pm Gorgeous work! I’m an amateur concept artist myself – I hope someday I’ll be able to do stuff like this! Keep it up! =D jay Says: June 16th, 2010 at 8:47 pm Looks like you had a lot of fun making these! The creative process in the beginning must have been quite a rush. Arco Says: June 16th, 2010 at 10:16 pm And this is just more than awesome! 😀 Alchemy pictures: Amazing! J. Says: June 17th, 2010 at 1:41 am When I saw the first drawing, inmediately an image came up in my head of little cute Sintel stabbing such a big gatekeeper. 😀 Nice drawings and good scanning! Maybe it’s an idea to show that particular drawing in the Powerpoint presentation at the premiere? ”Initially Sintel looked like this, but when I got nightmares of my little niece dangerously playing with a spear, I inmediately smacked this kind of morbid fantasy off the table” 😀 😀 😀 Laura Lyle Says: June 17th, 2010 at 5:17 am Wonderful to see this work! Behind the scenes stuff is as interesting to me as the movies themselves, so I’ve been watching this site like some people watch the stock market. Very interesting to see the progression of the character designs.. the baby in particular. Thank you for posting! (wondering now when the first fan art will be seen XD ) Reyn Says: June 17th, 2010 at 6:59 am Very very verrrrrrry cute, indeeeeeeeed! ^_^’ Way to go! =) -Reyn ralmon Says: June 17th, 2010 at 7:14 am Wow. Nice to see them. I’m practising my 2d skills myself and I find these inspiring. ogee Says: June 17th, 2010 at 8:44 am perfect. love it. Max Puliero Says: June 17th, 2010 at 9:45 am Well done 🙂 Achim Luebbeke Says: June 17th, 2010 at 12:13 pm Thank you for the pics. I always enjoy to see this stations of a winding road until the final design is reached! tmaes Says: June 17th, 2010 at 2:55 pm Salut, Beautiful drawings David, I’ve always been jealous of your talent, and it’s not gonna stop… I think that your concept art will give a real plus to this BF movie (I also liked the other ones btw) Vive la suite!!! Roberto Says: June 17th, 2010 at 8:51 pm The 2nd picture (Alchemy?) is really impressive! Great work! Bitetti Says: June 17th, 2010 at 9:58 pm Oh! Very beautifull dragons! Magic_Man_3d Says: June 18th, 2010 at 6:59 pm I’m in love with these drawings. The fire dragon would have been epic. The first one is definitely my favorite. belich Says: June 19th, 2010 at 12:57 am inspiring work! Blitz Says: June 19th, 2010 at 11:58 pm Call these images “doodles” rather than design, please. Mrfixit1170 Says: June 20th, 2010 at 7:18 pm Great work guy’s……I can’t wait to see the finished movie…..I really am getting into the whole blender thing and like the community that goes with it all. I saw the render farm video last night and was wondering where does all the completed clip get stored. I can see that the render farm takes the files and puts them all together in the farm but where does it output the finished pic? I am only asking because I am working on my own setup at home and would like to get information on how to structure the file storage. I don’t think that everything is spit out onto a external hard drive somewhere? I would think that the a NASbox or SAN would be set up but that is what I am leaning towards anyway….any suggestions? Shane Newville Says: June 22nd, 2010 at 7:16 pm these are beautiful kopi Says: June 24th, 2010 at 8:49 pm Great stuff, bought the DVD! Spell Says: June 29th, 2010 at 12:09 am I’ve made an alternative colorization of the uni-tone one because the color didn’t fit into my desctop. Wide (orginal) format: http://imagebin.ca/view/lkEKpPV.html Cropped to 1280×1024: http://imagebin.ca/view/gk6eGP.html Brian Fisher Says: October 5th, 2010 at 12:40 am This is some awesome concept art work you have. I have a question about the type of modeling program you used to for all the animation/modeling effects? I am currently studying 3d max at school for the game design and animation class. so I thought I would ask. Sincerely Brian Fisher Corthal Says: August 10th, 2011 at 10:32 am I am in school atm and trying to model a 3-d dragon although my drawing skills are probably sub par. I was wondering if you would be able to sketch me out a top, side and front view of a dragon. Nothing spectacular like I have seen but just something simple so I can model it. Dragons have always been my dream and I have read, sketched, watched anything with dragons in it. Although dragon wars did so much injustice to them. If you do send me a model sheet and like my model you are free to use it whenever. I just want to model a great a dragon and give them the respect they deserve. Thank you"
