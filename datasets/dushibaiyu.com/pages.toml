["https://www.dushibaiyu.com/2014/02/meng-ziqi-qiren.html"]
title = "梦、自欺、欺人 | 渡世白玉"
description = "如果有个机会，你可以选择 ： 1）回到过去你记忆力的某个时刻，保留当前记忆来从重新来过。 2）看到未来某个时刻，你的状态和生活的最大可能性。 3）回到过去完全重新开始（即没有过去那点之后的记忆）。 如果是你，你会怎么选择呢？"
full_description = "梦、自欺、欺人、而已 睡不着，找了个电影看：《私人订制》，看完却不困了。郁闷、、就起来写此胡言乱语，记下胡思乱想。 私人订制，成全别人，恶心自己，帮你圆梦，但是圆梦真的那么好吗？想起一句话：人生不过自欺、欺人而已。 范伟，好好司机，看不惯领导那些肮脏，感觉自己一定可以，就来满足下过把瘾，只是，现实不是想象。他做到他的清官梦了吗？只是越来越喜欢官话了，以前看不惯的倒是可以接受了，人在现实，和想象总是那么的、、唉、、、你眼里的别人那么不给力，可能换做你自己还不一定有他给力呢、、、、 高雅，是需要来自内心的、、不是金钱的狂砸就能得到的，人生毕竟有些东西金钱还是买不到的、、只是盲目追求，看似得到，何尝不是别人口中一笑谈？ 有钱，最现实的梦想了、、、只是抓人的何尝不是句句在理？什么是伟大？轰轰烈烈是？万人之上是？其实很多时候只不过是平平凡凡，清清白白而已。看似最简单的却往往是最难做到的，人生何尝不是矛盾，不是谬论？ 想起当初刚看《平凡的世界》的时候，起初只是为了无聊打发时间而已，几个人的简单生活，自己也有，有什么好看的，还是很多人推崇的书，只是当看到一般的时候却感觉这本书的确很伟大，很是喜欢，但是书中的确是平平凡凡，毫无亮点的，人只是平凡的人，事只是平凡的事，感觉却是那么的不平凡、、、其实呢？我们每个人都何尝不是伟大的，只是自己的忙忙碌碌，别人的幸幸福福，几人能看到，看清自己的呢？认识自己，几人认识呢？ “如果你有一百万, 你会全捐给别人吗?” “会。” “如果你有一千万, 你会全捐给别人吗?” “会。” “如果你有一个亿, 你会全捐给别人吗?” “十个亿我都捐。” “如果你有一辆汽车, 你会捐给别人吗?” “不会。” “为什么呢?” “因为我真有一辆汽车” 这是笑言，何尝又不是在打脸？每个人都没那么高尚的。想起什么天灾人祸，大家都在比这，关注着神马企业，什么名人的捐款，其实你有何权利呢？你可能会说，如果我的话，我会怎样怎样，其实那是因为你没有，你有了，你就不一样了、、、每个人都一样，都是苟且生着的一蝼蚁而已、、 如果有个机会，你可以选择 ： 1）回到过去你记忆力的某个时刻，保留当前记忆来从重新来过。 2）看到未来某个时刻，你的状态和生活的最大可能性。 3）回到过去完全重新开始（即没有过去那点之后的记忆）。 如果是你，你会怎么选择呢？ 我想如果是我的话，我会放弃选择。不是我多么的大度，而是我是多么的懦弱，不敢面对选择的代价而已。选1，人生多么美好，给自己改写历史的机会，只是完全的称心如意有吗？相比较看着却无能为力的那种感觉，我更愿意无知的潇洒着。选2，可以知祸福，从而避凶选吉，多好啊、、虽然我也偶尔看下生肖星座运势类的，但是真有机会却是不敢去看的。是幸福也罢，给自己信息，最坏也只是懒惰下，可能达不到看到的幸福。如果是不幸呢？改变？蝴蝶效应，结果同样是未知，而且还让人生因此增添诸多心理负担。选3呢？白选，重新无知的在走一遍老路而已、、、、、、、、、 命运，时常在想是否真的存在。人生是一个个选择的组成，选择其实就决定着命运呢、、其实我相信命运是存在，存在每个人的手中，只是我手中只是握着我的一点点而你，其他的是别人的命运。我的一个选择是在改变我自己的命运，但何尝不是在改变别人的命运？如果选择是一个点，人生就是一条线，而命运是这一个立体的容器，装着大家的人生。每个人的人生都穿梭着很多面，也在构建着这个立体，同样在交互着，包含着，冲撞着其他的线、、、唉、、有也罢，几人能缕情？ “一举功成万骨枯！” 灵智道：“恨之一物，起源于求不得。故而说一个人梦想越大，越容易落空，心里的恨意也越深。相反的，一个人梦越小，越易醒来。”灭里喃喃地道：“能从梦里醒来，那……那不是很好吗？” 灵智道：“灭里将军，你若完成今生梦想，从此了无遗憾，你下一步想做什么？”灭里怔了半晌，道：“是……是退隐么？”灵智摇头道：“想也别想。你为圆一己之梦，已然好人杀尽、坏事做绝、想你满身罪孽，还有脸活在世上么？” 摘自《英雄志》的一段话，只是在魔刀下是旁骛杂念，不择手段的去追梦。人生难免其他其他琐事，只是梦成了真的是自己当初想要的吗？能当领导了真的就能清廉了吗？能装高雅了就是真的高雅了吗？人生逐梦，可能只是梦醒皆空、、 道曰无为，佛曰轮回、、 山是山，水是水。只是几人眼中的山是山，水是水呢？ 人生也罢，梦想也罢，不过自欺、欺人而已。 本文亦不过胡言乱语而已、、、 Author 渡世白玉Posted on 2014年2月16日2015年8月21日Categories 文字飘香, 随笔Tags 胡言乱语, 自欺欺人"
