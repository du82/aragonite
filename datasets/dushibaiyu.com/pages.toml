title = "Linux常用命令总结 | 渡世白玉"
description = "-----------Liunx帮助命令-------- #help pwd #help -s pwd 只显示命令的格式信息 #touch --help #man ls #info ls -----Liunx文件和目录操作命令----- #ls , ls -l , ll 列目录命令 #cd /root, cd ..目录更改命令"
full_description = "Linux常用命令总结 ———–Liunx帮助命令——– #help pwd #help -s pwd 只显示命令的格式信息 #touch –help #man ls #info ls —–Liunx文件和目录操作命令—– #ls , ls -l , ll 列目录命令 #cd /root, cd ..目录更改命令 #mkdir directory1 directory2 …… 创建目录 #rmdir 删除空目录 #file /etc/passwd 查看文件类型 #touch file1 file2……创建文件 #cp file1 file2 ，cp /file1 /file2/ 复制文件 #rm file ， rm file -rf 删除整个目录树 #mv file1 file2，mv file1 /root/ 删除文件或目录树 #find . -name file*, find . -name file? ; find . -user teacher 查找文件 #cat，more，less /etc/passwd 目录文件查看命令 #head -n /etc/passwd 查看前n行 #tail -n /etc/passwd 查看后n行 df du ——————在Liunx下使用光盘和U盘—————– #mount -t iso9660 /dev/cdrom /media/cdrom 挂载光盘 #umount /dev/cdrom /media/cdrom 卸载光盘 #eject 弹出光盘 #eject -t 收回光盘 #cp /dev/cdrom /rhel4-1.iso 制作光盘镜像 #mount -o loop -t iso9660 rhel4-1.iso /media/cdrom/ 挂载光盘镜像 #umount /media/cdrom 卸载光盘镜像 #fdisk -l 查看系统所有存储设备 #mount -t vfat /dev/sda1 /mnt/ 挂载FAT格式U盘 #mount -t ntft /dev/sda1 /mnt/ 挂载NTFS格式U盘 #umount /dev/sda1 卸载U盘 ————-Linux用户，组管理命令———— #/etc/password 所有用户账户的保存位置 #/etc/shadow 所有用户账户口令保存位置 #/home/ 所有用户的宿主目录 #adduser username 添加用户 #passwd username 管理员初始化用户口令 #password 用户更改自己的口令 #userdel -r username 删除用户，-r删除用户和宿主目录 #usermod -L -U username -L 禁用系统中的用户账户（/etc/shadow下对于的用户有叹号） -U 启用系统中被禁用的用户账户 #usermod -e YYYY-MM-DD username 设置账户的有效期限 #ls -la /etc/skel/ 所有用户配置文件的模板 #ls -la /home/username 显示某一用户的模板 #/etc/group 所有组的文件 #groupadd group1 添加组 #adduser -g group1 username 建立用户时直接添加到group1中 #groupdel group1 删除组group1 #usermod -g group1 username 更改用户组账户 ————-Linux文件权限设定—————– #ls -l file1 查看文件权限 例如 drwxr-xr-x 第一位代表文件或目录（d代表目录，-代表文件），rwx三位代表文件所有者具备的权限，r -x代表文件属组所具备的权限，r-x代表其它所有者所具备的权限。r代表读，w代表写，x代表执行。 #chmod [ugoa] [+-=] [rwx] file1==chmod *** file1 更改文件权限 *代表1、2、4的组合（1代表读，2代表写，4代表执行） #chown user1 file1 单独设置文件的属主 #chown :group1 file1 单独设置文件的属组 #chown user1:group1 file1 同时设置文件的属组和属主 #system-config-users 在图形界面使用，可以更改用户一些属性 ————-Linux程序进程管理—————– #jobs [-lrs]觀察目前的背景工作狀態 #fg %jobnumber將背景工作拿到前景來處理 #kill -l #kill -signal %jobnumber #top動態觀察程序的變化 #ps將某個時間點的程序運作情況擷取下來 Author 渡世白玉Posted on 2012年3月25日Categories LinuxTags linux, 命令"
