["https://www.dushibaiyu.com/2013/12/%e5%ad%a9%e5%ad%90%e7%9a%84%e5%ad%a6%e4%b9%a0%e6%88%90%e7%bb%a9%e6%9c%89%e5%a4%9a%e5%a4%a7%e4%bb%b7%e5%80%bc%ef%bc%9f.html"]
title = "孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思! | 渡世白玉"
description = "PS：教育的最终目的不应是知识，而是修养！知识是教育的内容，而修养才是教育的最终产物！我们学习知识是一个由技入道的过程！犹如剑客的终极不是剑法达到巅峰而是进入剑道的境界！沉溺于那些成绩排名何尝不是沉溺于那些花俏的招式，而与真正的高手无缘、、 正文： 在大多数中父母的眼里，孩子的学习成绩似乎比任何其他都系都重要，但学习成绩真的如此重要吗？本文来自一个麻省理工学院毕业生对中国教育的反思，值得中国父母去关注深思。 朋 友的女儿在十多年前考上了麻省理工学院，当时在周围中国人圈子里轰动一时。毕业后她到硅谷发展，一边工作一边又修了个MBA学位，现在在一个世界顶级的 IT公司里工作，亲朋好友都觉得她很能干。每当华人家长当着她的面表示要让自家孩子以她为榜样时，她都露出哭笑不得的表情，一再说自己很普通，就是个高级 打工仔而已，千万不要向她学。 现在她自己的女儿也快到了上学的年龄，回来看望父母时，大家见到她就半开玩地问她，以后要把孩子培养进哪所常春藤大学，她却很坚决地摆手说：“我不培养， 她能上哪儿就上哪儿。”据她妈妈讲她真的不管孩子的学习，在家里什么也不教，也不送孩子去任何特长班，她妈一提起来就愁，说她对待自己孩子像是放羊一样， 极其不负责任。 有一次过节聚会，当大家的话题又转到孩子的教育上时，她讲了她自己对于子女教育的一些反思。 她说从小学到高中，无论在中国还是在美国，她的学业成绩排名都是全校第一，在麻省理工学院时她的学习成绩也是处于上游。但是工作以后，她是同学中最不起眼 的一个，属于在事业上没有什么成绩可言的人。毕业十年她去参加同学会，同学中有后来进了法学院当上大牌律师的，有从政已经是某个州众议员的，有在公司做已 经成了CEO的。有个同学毕业后就冒险加入一个才组建的小公司，公司后来上市，他坐拥原始股一夜之间成为百万富翁。如果觉得这个同学在财富上比较成功的 话，那么另外一个参加小公司的同学后来变成了公司合伙人，公司上市后他直接就进入千万富翁的行列。可是这个人还不算牛，有个同学自己创业自组公司，公司上 市后给卖掉了，又建了一个公司又卖掉，现在正在搞第三家公司，已是亿万富翁。 单纯从财富上看，他们这些打工的人在同学里不值一提。但是最潇洒的却不是上面那些“成功”人士，而是一个大学期间学习很好的男同学。他自从有了孩子，就辞 掉工作在家里做起了家庭主夫，因为他发现自己特别喜欢照顾孩子的感觉，喜欢相妻教子的生活方式，在孩子上学前他都不打算去上班了。他太太也做IT行业，收 入足够家庭开销，而太太不喜欢做家务，所以他们夫妇两人正好互补。这个同学还有个兴趣是旅游，他们全家一有空就满世界去玩，已到过七十多个国家，以后打算 把地球上的每一个角落都走走。同学里面属他没有压力最轻松自在，让生活节奏很紧张的上班一族们羡慕不已。 同学中有几个华裔孩子，父母来自中国的大陆、台湾、香港等地，这些同学都是规规矩矩的打工族，就职于大公司，说起彼此的工作都乏善可陈。 他们几个华裔孩子在校时学业优异，努力踏实，智力超群，可大学毕业以后，后续的事业发展却普遍不如美国同学。 反思自己的成长过程，她认为，我们的文化中对孩子的培养有误区。 在中国父母眼里，教育的目的就是培养孩子上大学，没有把教育看成是一件为孩子的一生打基础的事儿，光以为把孩子送进了名牌大学父母就大功告成了。为了达到 这个目的，家长的注意力都集中在孩子的学习成绩上，还有和进名校相关的活动中，而子女教育的其他重要方面，很多不能被量化的方面被忽视了。比如，孩子的自 我认同感、自信心、冒险精神、不畏失败百折不挠的精神和勇气、享受生活的能力等，这些都是她和同学相比之后感觉自己所缺乏的。人的一生更像马拉松比赛，一 个人若想取得成功，性格的培养非常重要，超过了上名校。事业都是在大学以后建立的，名校的招牌在刚毕业的头一两年找工作时还有点用处，后来很快就会被工作 经历所取代。 因为父母在她很小的时候就看重她的学习成绩，所以，她也把取得好成绩看得极重，不想看到父母失望不满的眼神。每次考试她都特别紧张，特别怕出错，这种情形 后来就发展成了谨小慎微的性格，做事求完美而缺乏冒险精神，没有安全感，就怕把事情搞砸了，有时明知搞砸了也没有多大关系，可是自己心理上就是接受不了。 她举了一个自己的例子。刚毕业的时候，她曾到谷歌公司应聘，当时它成立时间不长，急需人才，公司创始人之一面试她，还和她一起吃了午饭，特别希望她能留下 来。可是硅谷的小公司多如牛毛，谁也不知道这家公司的命运如何，会大放异彩还是像成千上万新创业的公司一样倒闭？虽然她敏锐地感觉到了搜索领域的前景，但 是求稳的心态让她最终还是选择了另外一家已闯出名牌的大公司。她的同在硅谷工作的美国同学当时极力劝她选择谷歌，说如果以后这家公司不行了就再找工作好 了，实在不行她那么会读书还可以回学校读个硕士，有什么好怕的？可她就是没敢冒这个险。现在谷歌的成就有目共睹，如果她当初选择留下来，公司上市以后她已 变成了千万富翁。 她说实际上他们家现在的收入在工薪阶层里也算挺高的，但是她有了钱自己也不会花，搞点娱乐活动心里隐隐地就会有罪恶感，觉得只有工作才是正经事，其他的都 是浪费时间。这就是小时候形成的只有学习才是正经事的观念的后遗症。她没有什么兴趣爱好，作为一个人，她觉得自己的生活太单薄了、太谨小慎微了、太没有色 彩了，她绝对不要自己的孩子再像自己一样。 她说她就让孩子尽情地玩，孩子将来有兴趣有能力上名校就上，没有兴趣就不上，重要的是孩子要快乐、身心健康，对自己有自信、对生活有热情，将来他们自己想干什么就干什么去。 文章来自互联网。 教育，唉、、、转到：是谁教他说谎？"
