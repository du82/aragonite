title = "不如D：1)开篇说明 | 渡世白玉"
description = "想写个D的系列介绍和用法的想法有很长时间了，但是由于个人比较懒惰，而且写作不及格，一直迟迟没有动手。今天在知乎上又看到rust和kotlin的专栏了，就决定必须动手了。 这两年用D语言，也算入门了，应该不会出现误人子弟的错误，自己写作向来没有条理，也希望能组织出来条理，也希望普及下D语言，国内毕竟D语言的知名度和圈子都太小了。个人力量有限，希望有D语言爱好者一起进步，一起扩大D的影响力，现在国内相对活跃的D语言群好像也就 Expert D (D语言 Dlang)（531010036） 了。 下面还是说D吧，先说下D语言介绍吧： 由沃尔特·布莱特和安德烈·亚历山德雷斯库所开发，起源自C++ 2007年开始设计D2， 于2010年发布稳定版本 高效率的编译型现在语言 具有C++的高效率，但是又向python， C# 和java那样易用 C 语言abi直接兼容 带GC，也支持完全手动管理内存。 具有几种编译器： DMD，LDC，GDC 下面是来自维基百科的介绍： D语言 D語言是一种程式語言，具备多範型，例如物件導向、指令式。由沃尔特·布莱特和安德烈·亞歷山德雷斯庫所開發，起源自C++，深受C++的影響，然而其不是C++的变种，而是重新设计来自C++的部分特性，并受到其它程式語言觀念的影響，如Java、C#以及Eiffel。 Walter Bright本身是Symantec C++ 編譯器的作者;另一名作者Andrei Alexandrescu是Facebook的研究科学家，他与一个团队用D语言重写一些Facebook的重要操作。 D语言现在2.x版本被成为D2， 很多特性进行了重新设计，原来1.x版本，被成为D1。 D1和D2是不兼容的，类似于py2和py3， 现在D1已经不在更新和维护了。本系列也是只针对D2。 先来个个hello world的代码表示系列开始吧： import std.stdio : writeln; // 引入 标准输入输出 模块的 writeln函数 int main(string[] args) // main 函数，完整的写法，同样支持： int main() 或 void main() {"
full_description = '不如D：1)开篇说明 想写个D的系列介绍和用法的想法有很长时间了，但是由于个人比较懒惰，而且写作不及格，一直迟迟没有动手。今天在知乎上又看到rust和kotlin的专栏了，就决定必须动手了。 这两年用D语言，也算入门了，应该不会出现误人子弟的错误，自己写作向来没有条理，也希望能组织出来条理，也希望普及下D语言，国内毕竟D语言的知名度和圈子都太小了。个人力量有限，希望有D语言爱好者一起进步，一起扩大D的影响力，现在国内相对活跃的D语言群好像也就 Expert D (D语言 Dlang)（531010036） 了。 下面还是说D吧，先说下D语言介绍吧： 由沃尔特·布莱特和安德烈·亚历山德雷斯库所开发，起源自C++ 2007年开始设计D2， 于2010年发布稳定版本 高效率的编译型现在语言 具有C++的高效率，但是又向python， C# 和java那样易用 C 语言abi直接兼容 带GC，也支持完全手动管理内存。 具有几种编译器： DMD，LDC，GDC 下面是来自维基百科的介绍： D语言 D語言是一种程式語言，具备多範型，例如物件導向、指令式。由沃尔特·布莱特和安德烈·亞歷山德雷斯庫所開發，起源自C++，深受C++的影響，然而其不是C++的变种，而是重新设计来自C++的部分特性，并受到其它程式語言觀念的影響，如Java、C#以及Eiffel。 Walter Bright本身是Symantec C++ 編譯器的作者;另一名作者Andrei Alexandrescu是Facebook的研究科学家，他与一个团队用D语言重写一些Facebook的重要操作。 D语言现在2.x版本被成为D2， 很多特性进行了重新设计，原来1.x版本，被成为D1。 D1和D2是不兼容的，类似于py2和py3， 现在D1已经不在更新和维护了。本系列也是只针对D2。 先来个个hello world的代码表示系列开始吧： import std.stdio : writeln; // 引入 标准输入输出 模块的 writeln函数 int main(string[] args) // main 函数，完整的写法，同样支持： int main() 或 void main() { writeln("Hello world!"); // 输出 Hello world 到控制台 return 0; } 介绍就到这里吧，下篇我们就看看一个官方的例子去感受下D语言的强大。 下面开始贴地址： 官网：https://dlang.org/ Github: https://github.com/dlang/ 论坛：https://forum.dlang.org/ D语言基金会：http://dlang.org/foundation.html 包管理：http://code.dlang.org/ Author 渡世白玉Posted on 2017年6月18日2017年6月20日Categories D, 不如D, 编程设计Tags D语言, 一起来用D, 不如D'
