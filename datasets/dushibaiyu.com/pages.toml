title = "为什么我们缺少特立独行的人生态度 | 渡世白玉"
description = "一个不能宽容特立独行人生的态度的民族是很难产生天才的。天才就是那些具有常人所没有的思想与行事方式的人们，他们对于社会的意义在于，他们 以全部的心思投入到自己的事业中去，并经由这种超越来达到常人难以达到的境界。只有在那种境界中，才有可能发现常人难以发现的事物的本质。可以说当下读哲 学系的人中，很少有人像这位高中生那样具有真正的哲学家的禀赋。这一件事令人深思，它也许在一定程度上说明了为什么我们这个民族为什么创造力不发达，为什 么我们社会缺乏人文科学的人才，为什么我们的生活没有丰富的色彩。"
full_description = "为什么我们缺少特立独行的人生态度 Ps：任何在无条件下有绝对是非观的事或书都是洗脑·····国人几人没被洗脑呢？ 一、 不久以前，我们去看一位从美国回上海探亲的朋友。这位和我从小一起长大的朋友二十年前赴美国留学，他谈到多年以来在美国生活，感触最深的是，在美国的中国 人的生活追求，与西方人相比，有一个相当大的区别，那就是旅美中国人无论事业成功与否，无论属于哪一个阶层，似乎都非常重视物质生活方面的追求，只要中国 人在一起，无论是台湾人、香港人、大陆人还是多年旅居美国的华侨，都非常实际，讲求生活的享受与安乐，中国人平时谈话的内容不外乎是房子、汽车，在世俗生 活的享受方面似乎有很强的从众心理，不像西方人在人生追求方面那么多元化。在西方，确实有不少人只关心自己的物质生活，但也确实有为数不少的人在追求其他 东西，例如有的人喜欢冒险，而在日常物质享受方面则相当随便，有的人成了事业上的亿万富佬，但生活却十分朴素，始终开一部普通的车子。钱赚得再多也不会想 到买什么高级轿车。他们对于别人以何种方式生活，追求什么，物质生活得如何好，可以完全不在乎。每个人都以自我为中心，追求自己觉得值得追求的价值。换言 之，中国人的人生追求相对而言则十分单一，而且很在乎别人如何看自己，既然社会上以物质生活为中心，在从众心理的支配下，人们也就自然会去摆阔，以此来显 示自己的成功。西方人的生活追求则比较多元化。甚至连日本人也比中国人生活价值的多元化追求方面要丰富得多。 这位朋友提出的问题，实际上是一个文化问题，我觉得非常有意思。在人生目标追求上中西文化所表现出来的反差，我过去也隐约感觉到了。就拿我所接 触到的文科研究生与大学生来说，就我多年教学所知而言，其中相当强烈地出于对本专业由衷的热爱而选择这一专业的学生实在并不多。 前不久我见到的一位来上海开会的美国女教授。十八年以前，我在南京大学读研究生时，就与这位研究中国历史的留学生成为好朋友。她现在在美国新英 格兰地区一所不太有名的大学任教，她说，她希望的是提早退休，这样，她就可以有足够多的时间来自由地研究中国文化与历史，因为她现在上课太忙了，最缺少的 是自由支配的时间。 她还说，她生活很简朴，只要再积一些钱，提前退休以后的生活不会有问题。 这种把学术视为生活中最重要的价值追求的生活态度，在美国并非少见。在美国大学里，人文学科的助理教职的收入并不那么有吸引力，然而往往会有数 十个博士或博士后宁愿不要去公司赚大钱，而要前来应聘，大学教职竞争非常激烈。我曾向一位美国朋友提出这样一个问题，既然获得一个大学文科教职是如此困 难，为什么在美国还是会有那么多人选择去读文科学位呢？这位朋友告诉我，这是因为他们确实有志于哲学、历史、文学与艺术专业，确实以此种学科当作为自己由 衷的爱好，他们才会做出这种选择。 当下中国人的价值追求的单一化、同质化，我在日常生活中就有深切的体会。记得有一天晚上，我的自行车坏了，正在车摊修车时，放在车架上的一本 《西方哲学史》的书名给一位路旁休息的中年人看到了，他好像是突然发现外星人似的惊讶地看着我，并自言自语地说：“哈！哲学！现在是什么时代了，居然还有 人在读哲学！” 这件事至少可以说明两点，一是这位市民周围确实长期以来没有人对于纯粹属于人文领域的事物有兴趣，否则他不会把我看成异类，并如此真切地感到惊 讶。其次，他非常自然地认为，所有的人都理应追求与他所追求的同样的价值。他无法理解别人追求一种与他不同的价值是合理的、自然的。他的表现正是他的人生 态度的一种最自然的反应。我用这个例子只想以此来说明，中国人在人生价值方面，确实相当普遍地存在着一元化、、板块化、同质化现象，中国人的价值观分化程度很低。用这个例子可以从反面来说明，什么是“特立独行”的生活态度。 另一个例子是，去年有一天，我的一个发了小财的初中同学请我和其他几位同学吃饭，在开往一家大饭店的出租车上，他突然大发感叹，说我们当中最可 怜的就是笔者本人了，他说这是因为笔者现在还在拼命读书。在他看来，在当今中国读历史书又能赚多少钱？对此我一时语塞。不知如何回答才好，我确实找不到合 适的语言来对他的想法提出反驳，因为这实在不是一个简单的常识问题，而是一个不同的生活价值态度问题。 这个例子之所以特别有意义，是因为这位朋友在中学时期是全校最杰出的优等生，他的作文常常被语文教师当作全校高中生的范文印出来让大家欣赏。而 现在他却非常真切地把金钱与享受，作为人生唯一值得的追求的价值来确认，并相当自然地认为，可以以此作为唯一的尺度，对别人幸福与否或可怜与否来进行评 价，丝毫不觉得这样做有什么不妥。至少这个例子可以说明，这种一元论的拜金主义、功利主义、世俗化的价值观如同潮水一样已经渗透在我们活着的一代人中。以 至于这种价值优势已经取得可以指点江山、臧否人物的霸权地位了。 再有一个例子是，去年七月我在旧金山硅谷参加了一个中国新侨民举办的家庭聚会。我满以为这些旅居海外的朋友会由于我这位刚从国内的老乡的到来， 而问及有关中国的一些话题。然而在整个聚会中，人们谈的只是各自如何赚钱，刚买不久的房子又涨价了，附近什么地方的托儿所最便宜，等等。人们几乎完全没有 注意到一位中国大陆来客的存在。也根本没有想到问问自己的故乡有什么新鲜有趣的事情，中国有什么变化，中国有什么问题，未来会怎么样。回来的路上，我对此 十分感叹，询问带我来参加这次聚会的朋友，这是为什么，我的朋友一时也回答不上来，只是说，“这里大多数中国人圈子谈的都是这些。不谈这些他们还有什么可 谈的？” 二、 为什么会这样？是由于中国人的国民性中缺乏超越性的价值追求？是由于中国文化中有问题？还是是一时的、过渡性的现象？ 有人说，这是由于中国人长期以来太穷了，穷怕了。所以会以十倍的努力来追求自己从来没有真正享有过的东西。因为人毕竟是有欲求的动物。从古北新 区访友返回家后，我通过电话向我当年的一位中学老师谈及这个问题，这位老师用杰克伦敦的一部小说里的情节来说明这一点：当一个落水者在海水中被救起时，这 个被救者会不自觉地把船上的水与食品偷偷藏到怀里去。因为他在海水中实在渴怕了。正因为如此，这位老师认为，将来中国人富了以后，一切都会变的。人们的追 求会多元化的。 但这种解释却不能说明，为什么那些已经相当富裕的海外中国新侨民中产阶层仍然如此强烈地追求实惠，在他们身上，似乎丝毫看不出有什么新的价值观 出现的迹象。就拿越来越富有的台湾来说，金钱至上潮流，已经发展到越演越烈的地步。就拿香港来说，我在香港作了三个月的访问学者，使我最惊异的一大发现 是，号称为世界上第一自由港的香港，拥有六百万高素质人口的特大都市，除了香港中文大学办了一份《二十一世纪》外，居然找不到一本本地人办的纯人文刊物。 这是不是表明，香港的中国人比日本人更像是经济动物呢？ 有人说这与中国文化中缺乏宗教因素有关，这样的解释也有一定的道理。因为宗教对来世，对超越性的彼岸世界的追求与信仰，往往能培育人们超越功利的价值观。 中国人与其他民族相比，宗教心理确实是相对淡漠的。佛教并不是中国的国教，本土的道教与其他宗教相比其实也相当功利化，自古以来，包括历史代帝王在内的相 当多人们信此教的目的，也只是追求现世的长生，对来世与彼岸世界并没有兴趣。在中国，人们即使信佛，也往往是怀着某种相当具体的功利的目的来求神拜佛的。 一个结婚几年没有生儿子的中国人去观世音象前烧几柱香，与其说是出于对超然世界的追求，不如说是一种对神灵的贿赂，体现的恰恰是最功利的态度。一个缺乏彼 岸观念的国度里，讲求实惠、注重于现世的生活，务实而少幻想，便成为我们中国人的民族性品格。如今又处于一个商品世俗化成为潮流的时代，那么，走向全民性 的物质财富的追求也就自然而然了。 有人说中国人的价值同质化这种现象与大一统的儒家价值有关，因为儒家文化与其他文化相比，例如与伊斯兰文化、东正教文化与西方基督教文化相比， 由于没有宗教作为自己的形而上的存在基础，儒家缺乏强烈的宗教情怀，缺乏超越功利的价值。深受儒家影响的中国文明，因而与其他文明相比，无疑是一种世俗化 程度最高的文化。 然而，当我们追溯到孔子的思想中去时，却会发现孔子恰恰是一个具有特立独行的人生态度的人。孔子本人是有强烈的超越功利的价值追求的。例如孔子说“朝闻 道，夕死可矣”，在儒家先贤那里，对形而上的道的信仰与追求是相当执着而且强烈的。“一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。”一个像颜回那 样的有精神信仰的君子，会生活得相当充实并具有人格力量。孔子从来对超功利的艺术与精神领域的追求看得远比物质上的收获更重要，他说过“饭疏食饮水，曲肱 而枕之，乐亦在其中矣。”他还意识到，“知之者不如好之者，好之者不如乐之者。”在他看来，贵在自得之乐，一个人的追求才具有真正的动力。他对音乐的热爱 可以使他“三月不知肉味”的地步。在《论语》中，人们可以找到这方面的许多言论。 另一方面，孔子对“道”的追求又并没有使他成为禁欲主义者，他从来没有单纯地拒绝过物质上的享受。他并没有像后世的佛教徒那样，一般意义上反对 “富且贵”。他只是说“不义而富且贵，于我如浮云。”无宁说，他主张在现世生活中，在追求崇高的超越性的“道”同时，仍然保持着一种有节制的世俗物质生 活。这是一种相当乐观的、积极向上的、既有精神追求又有物质享受的人生图画。一个以原典意义上的儒家作为安身立命的基础的君子，他希求的是在精神与物质方 面达到的平衡和谐状态。 这使我想到了我的祖父。直到六十代年初期过世，可以说他属于中国最后一代的受儒家影响的老式读书人。根据家人的回忆与我小时候对他的依稀的记 忆，他是一个乐天的老人，自命为“谑翁”，喜欢喝酒，喝得过量也会发酒疯，对人非常善良。读书甚勤，拥有万卷藏书，购书成为生活中最大的爱好。每次发薪水 就用来购书，购书之后往往是身无半文。反过来还要向子孙辈“借钱”。吃的则基本上是粗茶淡饭。高兴时会眼泪纵橫。对子女又非常宽容，早在上世纪二、三十年 代他就鼓励自己的女儿（即我的姑妈）去读易卜生的《傀儡家庭》，去追求自由恋爱，他从来不以自己的意志要求他人。朋友很多，见到别人有难总会尽力相助。 记得我小时候，哥哥笑话祖父填写表格时把“宗教信仰”一栏填写为“信仰儒教”，哥哥说，“儒家怎么能算是宗教呢！”现在想来，祖父正是在精神上 最接近于孔子原本意义上的那种儒者了。他对他所理解的“道”的诚挚信仰，与对现世生活的热爱、对现世价值的享受有机地结合到一起，并达到和谐的地步。他从 来没有压抑自己的个性，用“发舒”这两个字来形容这位谑翁是最合适不过的了。他的这种自由舒展的个性与他的人生意义的追求结合到一起，形成一种乐天的生活 态度与生活方式。这种生活态度的意义就在于，对天道的尊崇，使一个人可以摆脱那种单纯的物质金钱的追求，而对现世人生的热爱与乐天的态度，又使人不至于变 成 “道”的殉葬者而不自知。我想，这种和谐的生活，可以产生一种真正意义上的自由的人格，一种不是刻意包裹与修饰自己，以迎合世俗生活的人生风格。一种有着 丰富的精神追求的，达到“乐以忘忧，不知老之将至”的人生境界。可惜这一种类型的儒者与我们之间已经出现无法接合的断层。 现在想来，人们从五四反封建的文学作品中见到的近代以来的士绅形象已经脸谱化了：中国的儒家士绅阶层是专制的，不开化的，僵化而封闭的，生于儒 家士绅统治家族社会，只有打倒它或者离家出走一途。巴金《家》里的那个士绅老家长的形象实际上是被高度符号化了，自五四以来，几乎就成为中国旧家长制度的 象征。其实，中国士绅阶层本身在在外部文化的冲击下也处于转化过程中，分化出不同的类型。士绅中的专制家长当然不在少数，但并不是没有其他类型，至少在我 们家里，就出现了从传统士绅中转化出来的一种新类型。在一定的条件下，儒家文化在与外部文明的融合中未必不能衍化出一种能够容纳超功利的精神价值追求的、 容纳特立独行的人格的、通达发舒的新类型。可惜的是，这种自然的转化由于种种因素而在中国没有实现。二十世纪以来，士绅文化终于彻底消亡了，取而代之的是 一种带了革命特色的农民文化。而农民不得不为稻梁谋的生活处境，使这种文化注定具有相当实用性与功利性特质。当然，这一点肯定不能解释我们提出的问题的全 部，但也许可以解释部分。 三、 当然，从总体上来看，中国的儒家主要的历史趋势不是走向发舒，而是走向“律则化”。我们自五四以来批判的，实际上是意识形态化的儒家，即把儒家 的 “道”变成官学化的政治意识形态，变成为统治者的工具，变成一种硬化了的“君尊臣卑”的纲常伦理。其结果就是儒家自身的异化。这种由于政治化而异化的最典 型例子是东汉时期的“二十四孝”，一个为了使双亲有饭吃而把儿子活埋的孝子，成为中国文化中的典范与英雄，这无疑是一种为了某种被阉割了的“道”而牺牲人 性的文化，这是一种失去了人性与道之间的和谐平衡的文化，这种“道”又如何对子孙后代具有吸引力呢？人们又如何会在对这种意识形态化的“道”的精神向往 中，感受到人生的价值与意义呢？一旦这种“道”对人们的强制与约束力瓦解了，失去精神追求的人们又怎么可能不走向极端世俗化呢？ 一种重发舒的、通达而多少富有人性味的原典儒家，如何在西汉以后演变为“重一道同风”的、以律则化的方式来限制人的自由发展的官学化的儒家？这 可以说自五四以来就是中国知识分子最感兴趣的问题。我想可能有两个关键点。虽然这两点也许都是老生常谈。首先，在孔子那里，作为社会人伦的“道”，被历朝 统治者解释为“上尊下卑”的等级秩序的“道”，从而失去了原典中的道的本性。其次，把人欲追求与对道统的尊顺不是有机地结合，而是完全对立起来。在《礼 记》中有一段话最为清楚地表明了这种对立：“儒有不宝金玉而忠信以为宝，不祈土地，而立义以为土地。不祈多积，多文以为富。”这种思维方式与价值判断，把 忠信、立义视为与世俗欲求完全对立的东西来遵顺，无疑是把儒家变成禁欲主义，而这种禁欲主义并不是为了实现超功利的审美追求，而是要实现一种现世政治目 标，即实现统治秩序的机械般的稳定。这种禁欲甚至还及不上西方禁欲主义宗教中的“彼岸世界”对人性的吸引力。很难想象这种官学化的儒家，怎么能使人们获得 一种发舒的自由的生活。 于是，中国文化的周期变动就显示出这样的特点，禁欲式的“律则化”对人性的压抑，形成机械式的人格特质。这种格式瓦解后，则呈现为不受精神力量 制约与节制的逐利趋势。在乱世时代，这种物质追逐表现为没有章法的不开化的利己主义，在一个商品化的世俗承平时代，则表现为“天下攘攘，皆为利往，天下熙 熙，皆为利来。”而无论在禁欲主义的格式化约束力有效的时期，还是在其失效的时期，无论在乱世还是承平时期，国民人格的表现都体现为同质化，中国有的是贤 臣、烈妇，营利之徒或官学化的儒生，但就是没有特立独行的自由人格。当今中国，是一个可以让人们自由逐利的时代，其人格特征更多地是表现为后一种类型。 在当今时代，一个没有被超越性的宗教终极关怀浸润的民族，一个缺乏精神自主性价值的民族，一个长期受僵化甚至异化了的制度与律则支配，而并不理 解自由主体性的民族，在市场化、电视文化的影响下，从意识形态的教义中脱逸出来的思想解放的冲动消失以后，只能导致人文精神的缺乏，对超然的、超越功利的 审美追求的缺乏，务实的传统品格传承下来，也只有逐利一途。 文化的解释是以一个民族长期生存过程中形成的深层结构为基础的。这种深层结构在意义在于，人们不自觉地受一种约定俗成的思维习惯与价值态度的支 配而不自知。正如人们说话时，对支配这种语言的内在的语法结构的存在并不自觉一样。一个民族很难摆脱长期形成的深层思维方式与价值观念。 其实，我们现代中国人中并不是没有特立独行的人，每一个民族的文化中总有一些超越性价值的因子。（这些超越性价值未必只有知识分子精英们才能理解，并去身体力行的。）只是我们没有去发掘它们。 我们历史中有过屈原的浩渺无涯的想象力，有过《史记》中的豫让那种充满悲剧性格的俠义英雄，有过竹林七贤的真潇洒，有过李白的真浪漫。只是这些 文化因子在宋元以后逐渐消失了，消失在金榜题名与洞房花烛的世俗追求之中了，或者说逐渐处于休眠状态了。难道到了今天，我们芸芸众生注定只能把坐在沙发上 看电视机视为唯一的生存方式？ 我们当代很多人至少在理论上对价值多元化还是肯定的，但这也许主要还是受惠于西方文化中的那些“超越性价值”的影响与启发，而不是来源于对自己 文化中被我们已经遗忘了的文化基因的回归。希腊文化中的普罗米修斯，西方人的那种“无止境的追求”的浮士德精神，爱因斯坦推崇的“热爱是最好的老师”以及 那种 “孩子般的”“对宇宙秩序超功利的好奇心”，约翰克利斯朵夫式的英雄主义，美国小说中的海鸥乔纳森利文斯顿，对“飞得尽善尽美就是天堂”的那种人生理解， 都曾在不同时期给我们中国知识分子以超越功利的审美主义与浪漫主义的人生启示。 中国人什么都不缺，智慧、毅力、勤勉、奋发、这些东西都有，缺少的就是一种对人生的浪漫主义态度，我们应该感谢西方文明在这些超功利的价值方面 给予我们的激刺与启迪。如果我们能从原典儒家的思想精华中汲取更多的养份，并把它与我们从西方文明中撷取的超功利的价值精华结合起来。我们也许可望获得一 种更为丰富、更富有激情、更具有色彩的生活。 事实上，特立独行的人生态度乃是创造之母。而有没有这种多元化的生活态度与人生哲学，有没有对生活本身的富于诗情的理解，在很大程度上将决定我 们生活方式的丰度与深度，决定这个民族对人类的文明是否能提供更多的具有原创性的东西。决定我们的生命有没有一种立体感，一个终日在电视机旁的看“会动的 图画” 的两脚动物是不会有原创性的。 附记： 不久前，看电视中的《亲情》节目，说的是一个湖南成绩优良的高中生，性格内向，喜欢哲学而不愿听从家长的意旨去考大学建筑系，他放弃了考到一半 的高考，回家后老师与同学，心理医生都说他有精神病，七年前离家出走，至今未归。母亲在电视上述说着自己对儿子的思念，希望这位失踪的儿子能与她联系，并 保证再也不会干预儿子以后的生活选择。 这一事件确实发人深思，喜欢哲学而不愿考大学，这件事如果发生在前面提到的西方国家，决不会有人认为是精神不正常。而在中国，文化价值是如此的 一元化，凡是与这种占统治地位的人生价值态度不吻合的，人们就会把这种价值态度视为异类。人们无法理解：这个学生成绩那么好，放掉大学不考，不是精神病是 什么？这种一元价值观，在文革时期是如此，在世俗化的今天同样是如此。不同的只是价值观的具体内容前后时代有所不同而己。这种情况似乎自古就是如此。记得 多年以前读研究生时，我读到过一部明代县志，其中记载，在元代中期，由于多年不行科举取士，以至当地儒家的礼仪皆已失传，而当地却有一个乡村绅士，事事处 处依古礼行事，在当地传为笑谈。由于可见，在中国古代，也是一元的价值态度占统治地位。 一个不能宽容特立独行人生的态度的民族是很难产生天才的。天才就是那些具有常人所没有的思想与行事方式的人们，他们对于社会的意义在于，他们 以全部的心思投入到自己的事业中去，并经由这种超越来达到常人难以达到的境界。只有在那种境界中，才有可能发现常人难以发现的事物的本质。可以说当下读哲 学系的人中，很少有人像这位高中生那样具有真正的哲学家的禀赋。这一件事令人深思，它也许在一定程度上说明了为什么我们这个民族为什么创造力不发达，为什 么我们社会缺乏人文科学的人才，为什么我们的生活没有丰富的色彩。 （文/萧功秦） Author 渡世白玉Posted on 2014年3月9日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 态度, 独立"
