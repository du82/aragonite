["https://www.dushibaiyu.com/2014/08/wuti-wujie.html"]
title = "无题，无解 | 渡世白玉"
description = "人都是自私的，谁都不例外。我们都趋利避害，只是我们在逐利的过程中不要只看到我们能用眼睛看到，不要忽略了那些眼睛看不到的，幸福感不是来自眼睛能看到的东西，而是来自那些看不到的。"
full_description = "无题，无解 “比《活着》更绝望、比《兄弟》更荒诞”。余华《第七天》的口号，但是在读的过程中，很多荒诞确实那么的不荒诞，我们都太熟悉了，一个天朝人民，即使再不关注世事也必有耳闻。绝望吗？不知道，这些荒诞的故事早就让我们麻木了。此书也在网上褒贬不一，书失败吗？个人以为还是很好的一部书，只是写的是现代，大家太熟悉了，书中的荒诞和绝望与一些现实比起来却显得微不足道，太正常了。希望某天我们人民能对这本说，这描写的什么，这些事件也太荒诞，太扯了、、 作者只是记录，对与否是读者来判断。《第七天》也只是记录，记录现在。 人都是自私的，谁都不例外。我们都趋利避害，只是我们在逐利的过程中不要只看到我们能用眼睛看到，不要忽略了那些眼睛看不到的，幸福感不是来自眼睛能看到的东西，而是来自那些看不到的。《追风筝的人》，这儿有一个让你再次成为好人的机会，让一切回到小的时候来审视作者的每一段过去。每个人的经历都是一个传奇，即使多么平凡。作者只是姗姗到来自己的经历而已，但是给我确实很多感动，很多无法言表的东西，可能还是我境界太低了，很多东西只是模糊的感觉到而已，却不能准确的把握去描述。 每一本书都有一种感动，每一个人都能看到自己的部分。 想想自己也读过不少书了，很多书连书名都忘了，里面人物更是都不记得了，却偶尔能记住某个片段。有的书看过不止一遍，但是每读到一些地方还是一如当初的感动和心痛，为人物也为自己。作者思想，人物的思想，个人的思想，有时在激烈的搏斗，有时确实和谐的统一，读书是学习，是发掘，学习经历，发掘自己。 当年曾出狂言说读书有三重境界：隔岸观火，身临其境，置身事外。 现在感觉亦是若此。初读若隔岸观火，为事情悲哀，为人物叹息，为情景着急，为不争而怒，只是毕竟你在远岸，能看到发展却终是无奈，伟大的计划终是谈谈。深之若身在其境，自己就在故事中，明其无奈，知其缘何不争，知世事皆无奈，终能得其之情感，其之经历，扩充人生之经历，只是你仍在故事中，你可能化身为其，终被其限制。蓦然回首，那人却在灯火阑珊处。当局着迷，旁观着清。关心则乱，无情审视方得真，有情其中终是偏。置身事外，方明缘何若此，方得升华，方得真见。 Author 渡世白玉Posted on 2014年8月27日2015年8月21日Categories 文字飘香, 随笔Tags 感动, 活着, 读书"
