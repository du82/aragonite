title = "安同OS 之我所见 | 渡世白玉"
description = "作为一个linux爱好者（ 菜鸟级的爱好者 ），听说国产又出新的发行版绝对要前排支持下、、、而且还是基于opensuse的，我乃yast忠实粉丝，更要大声叫好！！！ 但是我自己简单试用下之后，却有很多地方想说下： 我对安同的印象首先是没有任何特色。（如果有的话，那就是十分不成熟）。 1.桌面来说上下两个面板，占用了太多显示空间、、、而且下边面板起的作用也太、、、 2.导航菜单在中间，这算是个创意，但是菜单也太简单了吧？ 3.汉化，还有没有完成的地方、、opensue已经做得不错了，剩下的其实也所剩无几了、、、 桌面上的时钟做的的确给力、、、 其他应用没有一一打开，打开几个和原声程序一样、、、想看下yast呢，但是没有root密码，着实郁闷、、、 然后看了下桌面的发行注记，我忽然间有一丝担心、、为这个发行版担心，你们现在刚起步，需要做的太多了、、、应该的时脚踏实地、、、而且对你们的开发路线也不敢苟同、、、 我想在此说下我的想法： 1.首先，应该找清楚系统的定位，为什么用户开发的、、、毕竟你们既然准备做，就不要做着玩，自己在窝里意淫了、、、 2.清楚自己定位后，在确定开发路线吧、、、其实现在定位大致也就桌面，服务器、、、既然是基于opensuse的，就应该利用好巨人的肩膀、、、opensuse已经是一个很好的发行版了，你完全可以尽情发挥自己的创意，但是既然是站在巨人的肩膀上，就要用好opensuse的优势、、、 3.你们发行注记上在招开发者，这是必须的，但是看了你们的目标，要开发有一个桌面环境？基础库的选择呢？开发后维护呢？现在linux桌面环境是不少，但是成气候的呢？（可能是我太保守了吧？）定制自己的linux内核？我感觉这个没那么必要，现在各个发行版对内核的优化都做得很优秀了，现在在桌面领域上，主要是x11在有时不太给力，和应用问题、、、如果定位桌面的话，我感觉最好的老师应该是deepin发行版，他们做的用户体验的确不错、、、如果想从头构建一个自己特色的发行版的话，我感觉没必要、、、 其实，我感觉现在你们有两个发行版的路线可以走： 1.走类似deepin的路线， 把精力放在应用质量和用户体验上，在桌面上为linux提供足够大助力。opensuse现在对桌面的优化很不错了，应该的提高下应用质量，把用户常见的问题解决了、、、、把用户体验坐到极致，在桌面上一争高下、、、 2.类似Centos的路线，suse最牛X的是sled和sles，可以下来源码，基于此版本定制，但是这几个版本的升级维护较opensuse比较麻烦、、、 Ps:现在安同OS已经基于ubuntu开发了，由于个人喜好比较偏向rpm系列，所以也已不在关注了、、、"
