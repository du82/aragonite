title = "《关于学校》－以前无聊所做，没啥价值，仅仅纪念（多首） | 渡世白玉"
description = "江城子 考试 数年学习模糊糊,不惧考,心却慌.盼日慢逝, 无奈上考场.纵使心慌又何用.静等待,盼时过. 夜来幽梦遇奇迹.主席台,正颁奖.实现无望, 惟有梦里想.料得试试过之后,家长训,老师教! 少 年 游 发试卷 欲知又惧心慌慌，战友尽猜果。班级之内，讲课台上。分如雨点下。 结果已定无可动，何故空叹气。努力奋发，力改恶习，定改今日局。 鹧鸪 天 考 试 所 感 开学至今多次战，次次排榜总在末。他人榜首人人赞，我居榜末无人问。 心不甘，欲前排，心空不甘力不足。我欲长别此排榜，无奈事多不由己！ 青门引 我校食堂 方圆几厘大, 仅有数千同学. 门外几里不透风! 饭在咫尺, 有远在天涯. 奋不顾身终得饭, 回头已无路. 他人吃饭充能, 吾们则为饭尽能! 减 字 木 兰 花 早 起 上 学 天还未亮，无奈铃声惊人醒。欲回梦中，压力逼人与梦别！ 泪别周公，挥泪起身整衣装。洗漱已毕，双眼路上蒙蒙胧！ 蝶恋花 - 赞吾校 吾校，本地之骄也，几校之首也，名牌之多也。特为其赞！ 吾校之生皆精英，早起晚睡，不闻窗外事。吾校之生团结好，同桌路遇不相识。 吾校目标很是高，直盯分数，所向是名牌。吾校发展向素质，日喊夜唱仍应试！"
