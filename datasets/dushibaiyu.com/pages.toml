full_description = "孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思! PS：教育的最终目的不应是知识，而是修养！知识是教育的内容，而修养才是教育的最终产物！我们学习知识是一个由技入道的过程！犹如剑客的终极不是剑法达到巅峰而是进入剑道的境界！沉溺于那些成绩排名何尝不是沉溺于那些花俏的招式，而与真正的高手无缘、、 正文： 在大多数中父母的眼里，孩子的学习成绩似乎比任何其他都系都重要，但学习成绩真的如此重要吗？本文来自一个麻省理工学院毕业生对中国教育的反思，值得中国父母去关注深思。 Continue reading “孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思!” Author 渡世白玉Posted on 2013年12月8日2015年8月21日Categories 分享文字, 文字飘香Tags 孩子, 成绩, 教育, 重点1 Comment on 孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思!"
