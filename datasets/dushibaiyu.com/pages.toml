full_description = "我是水瓶座怎么呢？ 【我是水瓶座怎么呢？】1.有点抗拒别人接近；2.爱纠结，不达目的过十年都不甘心；3.爱的纯粹，不想保留；4.讨厌束缚，喜欢自由；5.极其讨厌虚伪、欺骗；6.铁齿有主见，比较相信眼见为实；7.有时候说话很毒；8.偏执、敏感、隐忍；9. 耐心只表现在非常喜欢的人或物上。 【你不知道的水瓶座】常暗恋，有事情不敢大胆说出来，不自信，讨厌跟人打交道，多愁善感，小小事情纠结N久，笑起来是个孩子，冷起来是个谜，超懒，爱发呆，擅长装傻，热心，易被感动，爱讲道理，常独处，爱一个劲的吃东西，自尊心暴强，常年宅在家。 【水瓶座 之最】水瓶座最会关心人，水瓶座最会在朋友需要帮助时出现，水瓶座最细心，水瓶座最有洞察力，水瓶座最少说话，但语出惊人，水瓶座眼泪最多，但流出眼眶的最少，水瓶座最敏感，水瓶座最没有安全感，水瓶座最喜欢说话的时候盯对方的眼睛，水瓶座最注意小细节，水瓶座最认真。 【水瓶座的五大缺点】 Continue reading “我是水瓶座怎么呢？” Author 渡世白玉Posted on 2012年10月6日Categories 分享文字, 文字飘香Tags 水瓶座1 Comment on 我是水瓶座怎么呢？"
