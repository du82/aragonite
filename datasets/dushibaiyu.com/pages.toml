full_description = "垃圾回收介绍与D语言内存管理 此文是个ppt的分享，主要内容是： GC 算法的基本介绍 D语言的GC的介绍 D语言内存管理的方法 混合管理字节的经验 相信见ppt： GC和D语言垃圾回收 PPT 内容顺序： 一、 GC 相关概念与基本算法 先介绍三种基本GC算法： 引用计数算法 标记-清除算法 —插入：保守式GC和精确式GC的概念。因为下面的算法需要精确式GC才能进行。 GC复制算法 标记-压缩算法： 标记清除 和 复制算法 的结合 —插入： 写屏障概念。 因为下面高级GC算法都需要写屏障。 分代垃圾回收 增量回收 并行回收 二、 D语言的GC 主要说现在GC的实现和简单的优化。 还有现在一些其他实现。 和个人对D语言GC发展的展望。 三、D语言内存管理 自动管理介绍 手动管理介绍 混合管理，自己总结的几个用法。 THE END——2017.03 Author 渡世白玉Posted on 2017年3月21日2017年4月24日Categories D, 编程设计Tags D语言, GC, 内存管理, 垃圾回收 yihuanghou says: 2017年4月18日 at am8:33 世事无常，但这个博客定能永保辉煌！ Reply"
