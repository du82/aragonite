title = "一些名人提出的顶级思维 | 渡世白玉"
description = "托利得定理：测验一个人的智力是否属于上乘，只看脑子里能否同时容纳两种相反的思想而无碍于其处世行事。 提出者：法国社会心理学家h.m.托利得。 点评：思可相反，得须相成。 2、统御 刺猬理论：刺猬在天冷时彼此靠拢取暖，但保持一定距离，以免互相刺伤。 点评：保持亲密的重要方法，乃是保持适当的距离。"
full_description = "一些名人提出的顶级思维 1、素养 蓝斯登原则：在你往上爬的时候，一定要保持梯子的整洁，否则你下来时可能会滑倒。 提出者：美国管理学家蓝斯登。 点评：进退有度，才不至进退维谷；宠辱皆忘，方可以宠辱不惊。 卢维斯定理：谦虚不是把自己想得很糟，而是完全不想自己。 提出者：美国心理学家h.卢维斯。 点评：如果把自己想得太好，就很容易将别人想得很糟。 托利得定理：测验一个人的智力是否属于上乘，只看脑子里能否同时容纳两种相反的思想而无碍于其处世行事。 提出者：法国社会心理学家h.m.托利得。 点评：思可相反，得须相成。 2、统御 刺猬理论：刺猬在天冷时彼此靠拢取暖，但保持一定距离，以免互相刺伤。 点评：保持亲密的重要方法，乃是保持适当的距离。 鲦鱼效应：鲦鱼因个体弱小而常常群居，并以强健者为自然首领。将这条首领鲦鱼脑后控制行为的部分割除后，此鱼便失去自制力，行动也发生紊乱，但其他鲦鱼却仍像从前一样盲目追随。 提出者:德国动物学家霍斯特。 点评: 1、下属的悲剧总是领导一手造成的。 2、下属觉得最没劲的事，是他们跟着一位最差劲的领导。 雷鲍夫法则：在你着手建立合作和信任时要牢记我们语言中: 1、最重要的八个字是:我承认我犯过错误。 2、最重要的七个字是:你干了一件好事! 3、最重要的六个字是:你的看法如何? 4、最重要的五个字是:咱们一起干! 5、最重要的四个字是:不妨试试! 6、最重要的三个字是:谢谢您! 7、最重要的两个字是:咱们。 8、最重要的一个字是:您。 提出者:美国管理学家雷鲍夫。 点评:记住经常使用，它会让你事半功倍。 洛伯定理：对于一个经理人来说，最要紧的不是你在场时的情况，而是你不在场时发生了什么。 提出者:美国管理学家r.洛伯。 点评:如果只想让下属听你的，那么当你不在身边时他们就不知道应该听谁的了。 3、沟通 斯坦纳定理：在哪里说得愈少，在那里听到的就愈多。 提出者:美国心理学家s.t.斯坦纳。 点评:只有很好听取别人的，才能更好说出自己的。 费斯诺定理：人两只耳朵却只有一张嘴巴，这意味着人应该多听少讲。 提出者:英国联合航空公司总裁兼总经理l.费斯诺。 点评:说得过多了，说的就会成为做的障碍。 牢骚效应：凡是公司中有对工作发牢骚的人，那家公司或老板一定比没有这种人或有这种人而把牢骚埋在肚子里公司要成功得多。 提出者:美国密歇根大学社会研究院 1、牢骚是改变不合理现状的催化剂。 2、牢骚虽不总是正确的，但认真对待牢骚却总是正确的。 避雷针效应：在高大建筑物顶端安装一个金属棒，用金属线与埋在地下的一块金属板连接起来，利用金属棒的尖端放电，使云层所带的电和地上的电逐渐中和，从而保护建筑物等避免雷击。 点评:善疏则通，能导必安。 4、协调 氨基酸组合效应:组成人体蛋白的8种氨基酸，只要有一种含量不足，其他7种就无法合成蛋白质。 点评:当缺一不可时，一就是一切。 米格-25效应:前苏联研制的米格-25喷气式战斗机的许多零部件与美国的相比都落后，但因设计者考虑了整体性能，故能在升降、速度、应急反应等方面成为当时世界一流。 点评:所谓最佳整体，乃是个体的最佳组合。 磨合效应:新组装的机器，通过一定时期的使用，把磨擦面上的加工痕迹磨光而变得更加密合。 点评:要想达到完整的契合，须双方都做出必要的割舍。 5、指导 波特定理:当遭受许多批评时，下级往往只记住开头的一些，其余就不听了，因为他们忙于思索论据来反驳开头的批评。 提出者:英国行为学家l.w.波特 点评:总盯着下属的失误，是一个领导者的最大失误。 蓝斯登定律:跟一位朋友一起工作，远较在父亲之下工作有趣得多。 提出者:美国管理学家蓝斯登 点评:可敬不可亲，终难敬;有权没有威，常失权。 吉尔伯特法则:工作危机最确凿的信号，是没有人跟你说该怎样做。 提出者:英国人力培训专家b.吉尔伯特 点评:真正危险的事，是没人跟你谈危险。 权威暗示效应:一化学家称，他将测验一瓶臭气的传播速度，他打开瓶盖15秒后，前排学生即举手，称自己闻到臭气，而后排的人则陆续举手，纷纷称自己也已闻到，其实瓶中什么也没有。 点评:迷信则轻信，盲目必盲从。 6、组织 奥尼尔定理:所有的政治都是地方的。 提出者:美国前众议院院长奥尼尔 点评:只有能切身体会到的，群众才认为那是真实的。 定位效应:社会心理学家曾作过一个试验:在召开会议时先让人们自由选择位子，之后到室外休息片刻再进入室内入座，如此五至六次，发现大多数人都选择他们第一次坐过的位子。 点评:凡是自己认定的，人们大都不想轻易改变它。 艾奇布恩定理:如果你遇见员工而不认得，或忘了他的名字，那你的公司就太大了点。 提出者:英国史蒂芬。约瑟剧院导演亚伦。 艾奇布恩点评:摊子一旦铺得过大，你就很难把它照顾周全。 7、培养 吉格勒定理:除了生命本身，没有任何才能不需要后天的锻炼。 提出者:美国培训专家吉格·吉格勒 点评:水无积无辽阔，人不养不成才。 犬獒效应:当年幼的藏犬长出牙齿并能撕咬时，主人就把它们放到一个没有食物和水的封闭环境里让这些幼犬自相撕咬，最后剩下一只活着的犬，这只犬称为獒。据说十只犬才能产生一只獒。 点评:困境是造就强者的学校。 8、选拔 近因效应:最近或最后的印象对人的认知有强烈的影响。 提出者:美国社会心理学家洛钦斯。 点评:结果往往会被视为过程的总结。 酒井法则:在招工时用尽浑身解数，使出各种方法，不如使自身成为一个好公司，这样人才自然而然会汇集而来。 提出者:日本企业管理顾问酒井正敬。 点评:不能吸引人才，已有的人才也留不住 美即好效应:对一个外表英俊漂亮的人，人们很容易误认为他或她的其他方面也很不错。 提出者:美国心理学家丹尼尔·麦克尼尔。 点评:印象一旦以情绪为基础，这一印象常会偏离事实。 9、任用 奥格尔维法则:如果我们每个人都雇用比我们自己都更强的人，我们就能成为巨人公司。 提出者:美国奥格尔维。马瑟公司总裁奥格尔维。 点评:如果你所用的人都比你差，那么他们就只能做出比你更差的事情。 皮尔卡丹定理:用人方面一加一不等于二，搞不好等于零。 提出者:法国著名企业家皮尔·卡丹。 点评:组合失当，常失整体优势，安排得宜，才成最佳配置。 10、激励 马蝇效应:再懒惰的马，只要身上有马蝇叮咬，它也会精神抖擞，飞快奔跑。 点评:有正确的刺激，才会有正确的反应。 倒u形假说:当一个人处于轻度兴奋时，能把工作做得最好。当一个人一点儿兴奋都没有时，也就没有做好工作的动力了;相应地，当一个人处于极度兴奋时，随之而来的压力可能会使他完不成本该完成的工作。 世界网坛名将贝克尔之所以被称为常胜将军，其秘诀之一即是在比赛中自始至终防止过度兴奋，而保持半兴奋状态。所以有人也将倒u形假说称为“贝克尔境界”。 提出者:英国心理学家罗伯特·耶基斯和多德林。 点评: 1、激情过热，激情就会把理智烧光。 2、热情中的冷静让人清醒，冷静中的热情使人执着。 11、调研 特伯论断:在数字中找不到安全。 提出者:美国经济学家w.s.特伯。 点评:数字是死的，情况是活的。 摩斯科定理:你得到的第一个回答，不一定是最好的回答。 提出者:美国管理学家r.摩斯科。 点评:刨根得根，问底知底。 12、预测 罗杰斯论断:成功的公司不会等待外界的影响来决定自己的命运，而是始终向前看。 提出者:美国IBM公司前总裁p.罗杰斯。 点评:只想随波逐流，难有理想彼岸。 萨盖定律:戴一块手表的人知道准确的时间，戴两块手表的人便不敢确定几点了。 提出者:英国心理学家p.萨盖。 点评:若选错误参照，必无正确比较。 隧道视野效应:一个人若身处隧道，他看到的就只是前后非常狭窄的视野。 点评: 1、不拓心路，难开视野。 2、视野不宽，脚下的路也会愈走愈窄。 13、目标 巴菲特定律:在其他人都投了资的地方去投资，你是不会发财的。 提出者:美国股神巴菲特。 点评: 1、善于走自己的路，才可能走别人没走过的路。 2、特色不特，优势无优。 古特雷定理:每一处出口都是另一处的入口。 提出者:美国管理学家w.古特雷。 点评:上一个目标是下一个目标的基础，下一个目标是上一个目标的延续。 14、计划 列文定理:那些犹豫着迟迟不能作出计划的人，通常是因为对自己的能力没有把握。 提出者:法国管理学家p.列文。 点评:如果没有能力去筹划，就只有时间去后悔了。 弗洛斯特法则:在筑墙之前应该知道把什么圈出去，把什么圈进来。 提出者:美国思想家w.p.弗洛斯特. 点评:开始就明确了界限，最终就不会作出超越界限的事来。 15、参谋 波克定理:只有在争辩中，才可能诞生最好的主意和最好的决定。 提出者:美国庄臣公司总经理詹姆士·波克。 点评:无磨擦便无磨合，有争论才有高论。 韦奇定理:即使你已有了主见，但如果有十个朋友看法和你相反，你就很难不动遥 提出者:美国洛杉矶加州大学经济学家伊渥·韦奇。 点评: 1、未听之时不应有成见，既听之后不可无主见。 2、不怕开始众说纷纭，只怕最后莫衷一是。 16、决策 福克兰定律:没有必要作出决定时，就有必要不作决定。 提出者:法国管理学家d.l.福克兰。 点评:当不知如何行动时，最好的行动就是不采取任何行动。 王安论断:犹豫不决固然可以免去一些做错事的机会，但也失去了成功的机遇。 提出者:美籍华裔企业家王安博士。 点评:寡断能使好事由好变坏，果断可将危机转危为安。 17、执行 格瑞斯特定理:杰出的策略必须加上杰出的执行才能奏效。 提出者:美国企业家h.格瑞斯特。 点评:好事干实更好，实事办好愈实。 吉德林法则:把难题清清楚楚地写出来，便已经解决了一半。 提出者:美国通用汽车公司管理顾问查尔斯·吉德林。 点评:杂乱无章的思维，不可能产生有条有理的行动。 18、信息 沃尔森法则:把信息和情报放在第一位，金钱就会滚滚而来。 提出者:美国企业家s.m.沃尔森。 点评:你能得到多少，往往取决于你能知道多少。 塔马拉效应:塔马拉是捷克雷达专家弗。佩赫发明的一种雷达，它与其他雷达的最大不同是不发射信号而只接收信号，故不会被敌方反雷达装置发现。 点评:善藏者人不可知，能知者人无以藏。 19、监督 小池定理:越是沉醉，就越是抓住眼前的东西不放。 提出者:日本管理学家小池敬。 点评:自我陶醉不易清醒，自以为是不喜批评。 赫勒法则:当人们知道自己的工作成绩有人检查的时候会加倍努力。 提出者:英国管理学家h.赫勒。 点评:只有在相互信任的情况下，监督才会成为动力。 （来自：微奇生活） Author 渡世白玉Posted on 2014年7月14日2015年8月21日Categories 其它Tags 思维, 效应"
