title = "看《虹猫蓝兔火凤凰》 | 渡世白玉"
description = "《虹猫蓝兔火凤凰》，一个动漫电影。 “每个人都是一个奇迹！”这句话是我看后印象最深的一句话，也是整部电影的主题。影片的名字是“虹猫蓝兔火凤凰” ，但主人公却不是其中任何一个，而是一个名字叫“小黎”的魔术师。 影片讲虹猫被困，小黎施展魔术变成虹猫的样子假装虹猫。虹猫是一时少侠，而小黎只是一个街头卖艺的小魔术师，而他要代替虹猫去完成一份使命，和七侠其他六个把凤凰蛋孵化成凤凰。结果是把凤凰孵化成了乌鸡···· 小黎很是郁闷，也有些自我埋怨，差点一蹶不振，但在他的一个忠实粉丝帮助下，无意中明白了一个至理，也想到了把乌鸡变凤凰的方法····· 他明白了，自己就是自己，一个魔术师！不是什么虹猫，不是少侠，也成为不了虹猫！他明白自己存在的道理就是做最好的自己，不是去做别人！他由此也找回了自信，找到了魔术的巅峰，成为利一个魔术宗师！ 这个片子虽只是一动漫却在告诉们：每个人都是一个奇迹！都是独立的自己，你永远是你自己，你成不了别人，你的唯一使命就是做你自己，做最好的自己！！！ 附：在线观看地址：http://tv.sohu.com/20100302/n270530428.shtml"
