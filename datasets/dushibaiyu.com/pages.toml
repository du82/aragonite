title = "编程设计 | 渡世白玉"
description = "渡世清明，温润如玉"
full_description = "不如D：D语言GC暂停时间简单测试 注：测试不严谨，只是为了了解下D语言GC不同堆下暂停情况，目的是为了根据实际项目使用部分@nogc进行堆大小控制。实际情况下堆中一般还有string，ubyte[]等一些可以块跳过扫描的，理论上暂停会更小 D 语言默认GC算法 D语言默认是保守式扫描清除算法。默认执行时期为 新分配内存，GC堆中可用内存不足时才触发（也就是如果欲分配堆够大，并且手动归还GC内存，GC堆中一直有可分配内存就不出触发GC）。D的GC使用的算法比较简单，GC耗时主要在标记和清除两个阶段。其中标记是GC增加的耗时，清除是不可避免的耗时，只是清除是把原来手动管理散点式，集中起来一起执行（RC可能出现集中清除产生的短暂暂停）。GC标记时程序会STOP THE WORLD（暂停程序所有线程执行），这个耗时也就是大家常说的GC暂停时间。GC清除时间只会占用启动GC的线程。GC标记的时间受堆大小与存活对象数量相关，GC清除与不存活对象数目相关。 触发GC的执行工作流程： 停止除了分配内存的当前线程外的所有受GC管理的线程（core.thread新建的线程，以及thread_attachThis的线程）（STOP THE WORLD开始）。 劫持当前线程开始GC工作（分配逻辑转而调用GC收集工作）。 Continue reading “不如D：D语言GC暂停时间简单测试” Author 渡世白玉Posted on 2023年10月18日2023年10月18日Categories D, 不如D, 编程设计 不如D：Dlang（D语言）下ARM嵌入式板子开发 最近自己开发一个板子上的数据处理与转发。无需UI，本来都是基于Qt/C++进行板子开发的。但是不同型号和板子基本都是靠厂商的虚拟机开发。于是想到之前用Dlang支持交叉编译的，于是测试了下Dlang下ARM嵌入式开发，结果让人惊喜。十分愉快。 Dlang进行ARM开发基于LDC，可以选择完全betterC或完整D语言。本次小项目考虑周边的库，就采用的完整D语言开发的方案。至于GC，作为一个安全的内存池使用。 开发依赖： Linux 主机，因为基本ARM交叉编译GCC都是linux运行的，我是在 openSUSE-Tumbleweed下 LDC 编译器，dmd不支持arm，需要使用LDC arm-gcc 交叉编译器（开发板厂家会提供，只需要C语言编译器就行。） 开发步骤： 交叉编译 DRuntime 和 Phobos 配置LDC交叉编译的依赖库和链接器（GCC） 使用D语言编写程序（注意依赖，如果依赖需要C库，相应库也需要交叉编译） 进行交叉编译程序（dub build –compiler=ldc2 –arch=你的交叉编译配置） Continue reading “不如D：Dlang（D语言）下ARM嵌入式板子开发” Author 渡世白玉Posted on 2023年9月16日2023年9月16日Categories D, 不如D, 编程设计1 Comment on 不如D：Dlang（D语言）下ARM嵌入式板子开发"
