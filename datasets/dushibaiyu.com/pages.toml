title = "老男孩，生而彷徨 | 渡世白玉"
description = "“只是路无尽头，都是路过。”人生也只是一段旅途而已，都是经历。不管梦想也罢，幻想也罢，经历才是真，其他皆虚，活着，去经历自己的经历就是人生，你的经历就是命运。"
full_description = "老男孩，生而彷徨 5年前两个老男孩让你哭，5年后他们陪你笑。结果，我其看完，却想哭。 最后肖大宝，不玩音乐了，王小利也醒悟了，梦想？只要十分渴望，全宇宙都会给你让路。只是最后呢？ 梦想？没有梦想的人生是不完整的，没为梦想付出过的人是白活的！只是，没有自知之明的飞蛾扑火也是对的吗？ 想起几首歌，一个成长历程。“我要飞得更高飞得更高”—->“我想要怒放的生命”—->“因为像我们这样的人，生来彷徨”。成长是无情的，所谓成长就应该是向最后所说的，认清自己而已、、不断的成长就是不断的发现自己而已，你的梦想，那也是你的梦想，自己还是在前，一个不应该是你的梦想，你还只是苦苦坚持努力，那也只是你的幻想而已、、、人生可能本来就是生而悲哀的、、事情也不是努力就能得到的、、 “天才，百分之一是灵感，百分之九十九是汗水。但那百分之一的灵感是最重要的，甚至比那百分之九十九的汗水都要重要。”所有努力应该都是在那1%灵感之上的，没了那1%，就是100%的努力，你也达不到你想要的，只是你付出的呢？ 道曰无为，顺其自然，天命自定。佛曰轮回，缘起缘灭，一切随缘。基督言罪，生而有罪，活为赎之。宗教整体还是乐观的，只是却是在悲观之上。是不是人生本为悲？ 看手相，生命线，感情线，事业线，都在手掌之内。握紧手掌，命运也就握在了自己手中。只是，你握住多少呢？它们大多是一端在掌心，有的甚至两端都延伸出掌心，只是你知道延伸出去多少吗？在你掌心的又是多少分之一呢？你的命运在自己手中，同样也在别人手中的、、 “只是路无尽头，都是路过。”人生也只是一段旅途而已，都是经历。不管梦想也罢，幻想也罢，经历才是真，其他皆虚，活着，去经历自己的经历就是人生，你的经历就是命运。 “谁也没规定这个年龄一定要怎样，就当我们刚毕业吧！”这么大年龄依旧一事无成，毕业这么多年依然那么落魄，这又怎样？人生只是经历，自己经历才是真，你的经历就是你的财富的。知道了，明白了，今天又何尝不是刚毕业，都是一段经历的结束，一段新的经历的开始。你有何必在意是那段经历的结束，只是你在意又有何用？结束就是结束，就是重新开始，那也是一个新的开始，不是原来的呢，还是好好过好当下经历吧、、就当我么刚毕业吧！ PS：博主偶尔神志混乱下，轻喷、、 Author 渡世白玉Posted on 2014年7月13日2015年8月21日Categories 文字飘香, 随笔Tags 人生, 梦想"
