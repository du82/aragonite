full_description = "不如D：D语言GC暂停时间简单测试 注：测试不严谨，只是为了了解下D语言GC不同堆下暂停情况，目的是为了根据实际项目使用部分@nogc进行堆大小控制。实际情况下堆中一般还有string，ubyte[]等一些可以块跳过扫描的，理论上暂停会更小 D 语言默认GC算法 D语言默认是保守式扫描清除算法。默认执行时期为 新分配内存，GC堆中可用内存不足时才触发（也就是如果欲分配堆够大，并且手动归还GC内存，GC堆中一直有可分配内存就不出触发GC）。D的GC使用的算法比较简单，GC耗时主要在标记和清除两个阶段。其中标记是GC增加的耗时，清除是不可避免的耗时，只是清除是把原来手动管理散点式，集中起来一起执行（RC可能出现集中清除产生的短暂暂停）。GC标记时程序会STOP THE WORLD（暂停程序所有线程执行），这个耗时也就是大家常说的GC暂停时间。GC清除时间只会占用启动GC的线程。GC标记的时间受堆大小与存活对象数量相关，GC清除与不存活对象数目相关。 触发GC的执行工作流程： 停止除了分配内存的当前线程外的所有受GC管理的线程（core.thread新建的线程，以及thread_attachThis的线程）（STOP THE WORLD开始）。 劫持当前线程开始GC工作（分配逻辑转而调用GC收集工作）。 Continue reading “不如D：D语言GC暂停时间简单测试” Author 渡世白玉Posted on 2023年10月18日2023年10月18日Categories D, 不如D, 编程设计"
