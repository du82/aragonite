description = "“天，我是说你们一直抱怨这个地方，但是你们却没有勇气走出这里？你们以为你们是疯子吗？不，你们不是！你们跟街上的混蛋没有什么两样！”"
full_description = "我们都需要飞越疯人院 “天，我是说你们一直抱怨这个地方，但是你们却没有勇气走出这里？你们以为你们是疯子吗？不，你们不是！你们跟街上的混蛋没有什么两样！” 这是72分钟的时候，主人公的一段话、、 我们大多数人不是如此吗？当看到这儿，而里面很多人是自愿的，你不震惊吗？但是仔细想一想，我们很多时候不也是在做如此的事吗？ 我们整天骂着这个，抱怨着那个，我们自己呢？在自我的枷锁中，一直在抱怨，一直还在努力的维持、、、可能只到了那一天，被无情的打破了，我们就像老布那样，无法适应了、、、 我们都太聪明，太知道世界多大了，太知道世界的样子了，所以自己的样子丢了，所以阿甘很少、、、人生，要么忙着生，要么忙着死、、、 人生，多少不是自为的呢？ 毕力自杀了，刚起来时那个自信的毕力呢？是谁杀死了他？是护士吗？是他自己！！！自己的恐惧！！！多少人同样在类似的自杀呢？ “我试过了，至少，我试过了”，多少人连试试的勇气都没了、、、是你老了吗？是你聪明吗？还是你在体质中已经麻木了？已经变为一个模子了？ 还记得那破晓的黎明，酋长带着主人公的飞奔、、、、、 生命就是不断的在新生，在打破，如果人生如行尸走肉，生有何意？ 人生只有自己才能超越、、、 Ps：胡言乱语而已、、 Author 渡世白玉Posted on 2013年11月19日2015年8月21日Categories 文字飘香, 随笔Tags 电影, 疯人院, 疯子, 肖申克, 阿甘"
