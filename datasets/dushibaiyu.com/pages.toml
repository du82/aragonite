full_description = "怎样做到不惑、不忧、不惧？ 梁启超在清华大学的演讲，历久弥香。 【一】 问诸君“为什么进学校？”我想人人都会众口一辞的答道：“为的是求学问。”再问：“你为什么要求学问？”“你想学些什么？”恐怕各人的答案就很不相同，或者竟自答不出来了。诸君啊！我请替你们总答一句罢：“为的是学做人。” Continue reading “怎样做到不惑、不忧、不惧？” Author 渡世白玉Posted on 2014年9月15日2015年8月21日Categories 分享文字, 文字飘香Tags 不忧, 不惑, 不惧, 仁者, 做人, 勇者13 Comments on 怎样做到不惑、不忧、不惧？"
