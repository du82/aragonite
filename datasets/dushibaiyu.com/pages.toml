title = "早晚有一天，我们都会成为自己当初讨厌的人 | 渡世白玉"
description = "我们每个人都有讨厌的人和事情。比如对喜欢给员工穿小鞋的领导的鄙视，对公司里那些三八妇女的不屑，对投机倒把的奸商的痛恨，对喜欢溜须拍马的同事的厌恶。可有一天你突然发现，你经常鄙视的那些人大多数都闷声发大财的成功了。更可怕的是，你也变得越来越像自己曾经讨厌的人了。你也变得刻薄，变得抠门，变得爱吹牛逼。你鄙视那些喜欢给明星捧臭脚的脑残粉，你去破口大骂，之后你突然发觉，无论是因为爱还是因为讨厌而产生的这些极端行为，性质上都是一样的，你不知不觉的也变成了你最初所鄙视的人。"
full_description = "早晚有一天，我们都会成为自己当初讨厌的人 原文地址：http://www.timetimetime.net/yuedu/13686.html 作者：留一手 我们每个人都有讨厌的人和事情。比如对喜欢给员工穿小鞋的领导的鄙视，对公司里那些三八妇女的不屑，对投机倒把的奸商的痛恨，对喜欢溜须拍马的同事的厌恶。可有一天你突然发现，你经常鄙视的那些人大多数都闷声发大财的成功了。更可怕的是，你也变得越来越像自己曾经讨厌的人了。你也变得刻薄，变得抠门，变得爱吹牛逼。你鄙视那些喜欢给明星捧臭脚的脑残粉，你去破口大骂，之后你突然发觉，无论是因为爱还是因为讨厌而产生的这些极端行为，性质上都是一样的，你不知不觉的也变成了你最初所鄙视的人。 在这个叫做社会的大染缸里，仿佛有一条看不到的轨迹，无论你如何选择岔路，我们大多数人最终都会走到这条轨迹上，逃都逃不掉。 刚毕业的时候，你是个愤青，看什么都不顺眼。讨厌职场上的尔虞我诈、勾心斗角、虚情假意。你觉得领导只会溜须拍马，就会弄个PPT吹牛逼，翻来覆去三个词：cooperation，efficiency，passion。逼大点事儿，也发个邮件，一张嘴就像英汉字典一样，自由切换。几年过去了，你从一块生铁也变成了公司这个大机器上运转的一颗螺丝，不符合规格的螺丝，都成为废品淘汰了。每个游戏都有它的游戏规则，职场的游戏规则就是你要学会少说多看，学会阿谀奉承、学会察言观色，学会跟身边的人看起来同一条流水线上的产品。当你学会并且习惯了这一切，才算得上合格，才会有更大的升职空间。当然，那时候，你早已经成了自己当初所讨厌的人： 一个连前列腺都黑透了的职场腹黑男。拍张总马屁，舔李总脚丫子，提着个淘宝买来的狗皮公文包，把自己捯饬得油头粉面，穿西服打领带，吃窝头就咸菜，整天抱着手机，“哎呀刘姐是您呐！瞧您说的，balabala….”“啊呀马总您好您好，最近身体可好呀？我们公司最近又有新产品了，balabala…”。经常在兰州拉面馆点最便宜的小碗拉面，边吃边给家里打电话：“亲爱的，我那个case非常urgent，还没有给出最后的solution，今晚上就不回家supper了。”“你个败家老爷们儿还会说人话不？！…”被你媳妇骂得狗血喷头、满地找牙。 上学的时候，你的爱情观充满浪漫主义的色彩。什么花前柳下，细雨微风，什么你织布来我耕田，你倒水来我浇园；不说希腊巴黎爱琴海，也得是丽江乌镇鼓浪屿。最鄙视的就是社会上鼓吹的爱情观，什么处女情结，什么月薪两万，什么门当户对，什么腰缠万贯。与其说那是爱情，不如说是一场交易。你下定决心要坚持住自己的爱情观，信守住自己吹牛逼许下的诺言。可是爱情不是过家家，社会太残酷，当你为了生活和租房发愁时，当你看到别人家的媳妇穿着貂绒皮草，而你却只能穿一件市场上淘来的大棉袄时，当别人家开车拉着女朋友出去郊游，而你却只能坐在家里看电视时，你屈服了。大多数人成了那个自己当初讨厌的人： 一个把感情当作交易的人。一年参加几百次相亲，一个一个的，从你眼前蹭蹭地过。高的矮的胖的瘦的，美的丑的老的少的，离过婚的，有孩子的。女孩儿会拐弯抹角地问你：“你们小区停车位多少钱？”你会拐弯抹角地问女孩儿：“之前的男朋友有伤害过你么？”什么？！没房？！什么？！伤害过？！接下来是长时间的寒暄和沉默。结束时，你心里骂道：“X，被这么多男人骑过还出来相亲！”。她心里骂道：“连个车都没有，村炮穷逼也有脸相亲！” 你当初看见别人炫富就恨得牙根直痒痒，嘴上骂骂咧咧：“有点臭钱有什么了不起，就知道显摆，显摆NMLGB！”未来的某一天，你这个穷逼发达了，马上就去买了一条二十厘米粗的纯金狗链子挂在自己脖子上，再整它二十块金表，一个胳膊上套十块，H型皮腰带来他二十条，从脚脖子一直缠到胳肢窝。这时你才发现，其实自己骨子里也是一个热衷炫富的人，只是当初的自己穷得响叮当，吃了上顿没下顿的，没有那个实力罢了。 你当初看见装文艺的人就恨不得打断他的狗腿，不是单反相机，就是小娴陆琪，今天迷失在波多黎各，明天沉沦在马尔代夫。时而明媚，时而忧伤。你也永远猜不透，这帮文艺B到底是从哪里搜集到的这么多催人尿下的语言，什么“如果爱，请深爱”“把你的名字写在烟上，吸进肺里，那离心脏最近的地方”“巴黎的阳光洒满了东京的街道”……直到有一天，你发现你也会不经意间甩上几句这些话，你也会每到一个地方就摆个姿势拍张照片调个lomo发个微博，还不忘了“好吃到爆”“美到想哭”，这时你才发现，其实自己骨子里也是有浓浓的文艺气息的，挡都挡不住。 愤怒大多来源于恐惧，厌恶大多来源于嫉妒。如果有一天，你成了你讨厌的那类人：刻薄的上司、爱吹牛逼的客户、炫富的土包子、裤腰带提到胸口的领导、有着无数脑残粉的盲流子明星。那么，你就成功了。这就是所谓的“中国式成功”。 ps：唉、、、繁杂的社会，谁人能独善其身？ Author 渡世白玉Posted on 2013年8月15日2015年8月21日Categories 分享文字, 文字飘香Tags 成长, 我们, 讨厌"
