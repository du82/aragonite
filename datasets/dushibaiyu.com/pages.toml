full_description = "12种编程语言类比12星座女 PS：这篇博文是一个技术群的码农写的，这哥们真有才，根据我对星座的看法，比喻得很靠谱，特转如下： 计算机语言的实质其实是为了让人类能够更好与计算机打交道，最终结果都是通过编译成二进制代码或通过解释器转译成二进制代码的形式，由计算机来执行。而二进制就是0和1，假设1代表男人，0代表女人，那么瞬间就可以发现世界就变成了一台大“计算机”。而爱情和情爱也可以看成是1和0组成的二进制机器码。 假如女人是一种编程语言，也许每个男人心中都有自己最喜欢的那一个吧？我认为女人可分两类，“面向过程”和“面向对象”。“面向对象”的女人以寻找终身伴侣为目标，而“面向过程”的，则以经历难以忘怀的爱情时光为己任。各位程序猿当然也要按需选择最适合自己的“编程语言”，不要因为时髦而盲目追求“面向对象“，有时候过程可能比结果更重要。 Continue reading “12种编程语言类比12星座女” Author 渡世白玉Posted on 2012年11月19日2015年8月21日Categories 编程设计Tags 星座, 编程, 语言Leave a comment on 12种编程语言类比12星座女"
