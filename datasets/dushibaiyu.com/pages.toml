["https://www.dushibaiyu.com/2013/06/%e9%b2%8d%e9%b9%8f%e5%b1%b1%e6%96%b0%e8%af%b4%e3%80%8a%e6%b0%b4%e6%b5%92%e3%80%8b%e7%bb%8f%e5%85%b8%e8%af%ad%e5%bd%95%e7%b2%be%e9%80%89%e4%b9%8b%e6%9d%8e%e9%80%b5.html"]
title = "鲍鹏山新说《水浒》经典语录精选之李逵 | 渡世白玉"
description = "① 初见宋江 303、《水浒》中，真有性情、气质、形状和声口的，大概也就十来个人。这已经很不简单，足以使《水浒传》成为伟大的小说。而在这十来个人中，李逵是其中一个，而且非常独特。他是这个成人世界里的孩子。举凡孩子的天真、单纯以及胡闹闯祸、没准头、欠缺是非判断力，他都有。 304、李逵心中，有天赋的质朴的是非观，但是，他欠缺鲁智深那样的悲悯情怀，那是成人才有的，李逵实际上一直没有长大。 305、梁山好汉就其与事的关系而言，有几种类型。有些人是“人遇事”。如鲁智深。有些人是“事找人”。如林冲。有些人是“人找事”。而“人找事”的，典型代表是李逵。他好像总要找点事，生点事，他是梁山第一盏不省油的灯，梁山好汉，谁都怕和李逵一起出差。盖他随时可以做出来，惹是生非，无事生非，防不胜防，与他在一起，提心吊胆，有擦不完的屁股。 306、李逵一出场就是闹事。而且，半天的工夫，就闹了五场，简直闹得我们应接不暇，眼花缭乱，又心烦意乱。 307、什么叫口无遮拦？就是心口如一。口无遮拦，实际上是心无遮拦。李逵的可爱，主要就得益于这种个性。我们见到的人，绝大多数都是说话经过斟酌的，猛然见到李逵这样的说话不经过大脑的，有一种清新的感觉，还有一种轻松的感觉，在他面前，我们无须设防。 308、按社会世俗观念，说话时，称呼对方时，赋予对方社会性的身份或头衔，就叫说话文明。相反，按照生理特征，直接说出对方的个体性特点，就叫粗鲁，不尊重人。 309、知道不知道在语言上尊重人，这中间有很大的差别，既是修养的表现，也体现一个人的世界观。但是，从另一个方面看，这种文明的说话方式，实际上包含着客观上的虚假和主观上的虚伪。而所谓粗鲁的说话方式，不过是直指真相而已。 310、李逵这样的人，在表现出粗鲁和缺乏教养之外，也显示出质朴和真实的一面。而这一点，又是非常可贵的品格。 311、李逵是教不好的。从另一角度看，他是教不坏的。 312、幽默需要三个条件：一、智慧。能在瞬间化严肃为轻松，逆来顺受，并将对方的锋芒化解于无形，必要智慧；二、自信。能自嘲者必有自信；三、心态。自由放松。宋江当然不乏智慧，他也又足够的自信。但他一直缺少这样的放松。是李逵给了他。李逵为什么能让人放松？因为他自己完全敞开，毫无城府，令人有安全感。 313、演对手戏，只要有李逵在，其他人必黯然失色，让李逵一人独占风光。连宋江、燕青这样出色的人也不例外。就因为他是纯本色的，而且是毫无心机的，偶有一点小算盘，也愚拙得可笑，让人一眼看穿。 314、李逵自己毫无艺术细胞，毫无艺术欣赏的意识和能力，但是，出人意料的是，他自己的一举一动，则是极好的艺术。为什么呢？因为他完全出于自然，美丑妍媸，全在天性，全无意识。全凭最初一念之本心，完全符合李贽对艺术的最高定义：童心。所以，李贽也特别喜欢他。 315、拿银子买人心，是宋江的专长。宋江专用银子笼络人，李逵偏偏在缺银子时碰见宋江。这不是李逵运气好，而是宋江运气好，总是碰到缺衣少食的好汉，然后很便宜就买到好汉的忠心了。 ② 银子奴隶 316、笑声大，口气大。笑声大，让周围的人听，显示自己。口气大，是要把自己说得很有身份。 317、宋江凭十两银子，就买到了自己的主导地位，买到了自己的心理优势。同样，李逵也因为这十两银子，就丢掉了自己的身份。烫手的山芋，还可以吃。烫手的银子，万万接不得。多少英雄，贫贱不能移，威武不能屈。但是，富贵可以淫。人，忍受苦难易，拒绝诱惑难。 318、如果一个人有自尊心，有平等意识，如此被人在人前埋汰挤兑，一定很不高兴，但李逵却毫不知觉。他可能甚至还觉得很温暖：有人罩着他了。人是多么容易成为奴隶啊。 319、我们知道，笼络小人，很容易，给点好处就行。笼络英雄，光靠银子，不行。你至少还得做到三点：第一，你得欣赏他，至少你得让他感觉你欣赏他；第二，你得尊重他，至少你得让他感觉你尊重他；第三，你得宽容他，英雄有个性，对这种个性，哪怕你不喜欢，但你得容忍，而且还要让他不觉得。一句话，英雄需要尊重。而这几点，宋江都做到了。 320、一个人，道德高不高，看大事。气质好不好，看小事。 321、事实上，能够赏识李逵，能否看出此人的价值，认识到此人粗鲁背后的可贵与可爱，确实需要眼光。这个眼光戴宗没有，宋江才有。作者把这三个人放到一起写，让李逵尽情表演，让宋江和戴宗两个观众观看，然后，通过他们的不容反应，鉴定他们的境界高低。李逵就像是一个秤砣，称出了宋江和戴宗的不同斤两。 322、他马上感受到了自己和他人的差距。他有一种被冷落、被抛弃的愤怒。甚至，我们说，这是一种嫉妒，一种吃醋。 323、同样面对楚楚可怜的女子，李逵出手相伤，鲁达出手相救，这就是李逵和鲁达的差别。鲁达的内心，有极高贵的东西。李逵的个性，有极自然的东西。 324、开口是你哥哥，闭口是哥哥。开口提醒你哥哥者，是提醒李逵，这个可是你的哥哥，你不照顾，谁照顾？你不上心，谁上心？闭口是哥哥者，这也是我的哥哥，你不照看好，我也要你好看。一句话，戴宗不放心李逵。 325、我常常感慨，无论是对历史，还是对现实，那些真正的有见识之言，一针见血之语，直揭真相之论，往往不是出自饱学的学究，出自拿着项目经费做项目的学者，而是出自乡野草民，出自那些没有什么文化，斗大字不识一箩的粗野之人。 326、我们可以想见，他是多么寂寞，多么无助，多么恐惧，多么绝望！但是，他没有逃走，没有旁观，没有犹豫，他就凭着他的一腔血性，一腔忠诚，杀出来了！一个人，一副板斧，他要挑战江州五七千军马！他一定知道他断断不会成功。但是，此时，他求的，不是成功，是成仁！这是知其不可为而为之的精神。 327、什么是勇的本质？就是不顾后果，不量敌之众寡，一句话，不能有算计之心。真正的勇敢，不能考虑胜败。因为，有必胜的把握，懦夫也敢出手。而真的勇士，没有必胜的把握，也敢出手。勇分两种：一、血性之勇；二、义理之勇。血性之勇往往出于性格。义理之勇只能出于品格。明知必败，只要大义所在，也毫不犹豫地出手，这就是义理上的勇敢。这种义理上的勇敢，就是一种高贵的精神。李逵，此时体现的，就不仅仅是勇敢，而是一种精神。 328、他不会算计，他不知道什么叫无谓的牺牲，他只知道，此时，只有牺牲，才是好汉的勾当！ 329、我们常说，逼上梁山。对林冲而言，是别人逼他上山。对李逵而言，是他逼别人上山。从此，李逵就上了梁山。可以说，他是在上梁山前最为顺利的一个，也是最心甘情愿的一个。别人上山，都经过了一番磨难，都有一番曲折，一番思想上的斗争。在万不得以时，才走上这条路。一句话，都要抛弃很多东西，损失很多东西，包括抛弃此前的做人原则。而李逵，在这两点上，他都没有顾虑。他是一个流氓无产者，没有物质的东西可以损失。上梁山，对他而言，丢掉的只是锁链，得到的却是无法无天快活的生活。更重要的是，他也没有什么造反有罪、落草丢人的观念，所以，也不会有思想上的障碍。 330、革命者与一般的反叛者的一个大区别在于：一般的反叛者，其反叛，可能出于自然的欲望，出于某种现实中的不得已。革命者的革命，其要革命，则是出于社会的理想，出于一种理想上的追求。而李逵，显然，自然的生理上的追求享乐的欲望，才是他行为的动力。 331、李逵的行事，主要遵循的就是快活原则。杀人不是为了复仇，不是出于战阵厮杀的需要，而竟仅仅是为了快活！真造反，假革命。 ③ 真假李逵 332、必须指出的是，李逵是很会撒娇的人，他常常很乖巧地撒娇。可以说，李逵的撒娇，与他的板斧一样有威力。板斧与撒娇，是李逵的两大法宝；板斧对付敌人，撒娇征服朋友。 333、人们为什么对撒娇不计较，反而很受用呢？因为，撒娇不光是一种对对方说话表达的方式，更是一种对话表达的态度：撒娇者总是主动地把自己放在依附的位置上，通过一种人格上的屈尊来换取对方的恩宠。达到的是自己的目的，却满足了对方的心理需求。 334、我们知道，陶渊明晚上不吃酒，睡不着；早上不吃酒，起不来。李白呢？不吃酒，写不出诗。现在，李逵是不吃酒，走不动路，三者同是极高境界。都算是酒中圣人。 335、不吃酒，走不动路；吃了酒，连觉也不用睡，吃到四更，五更便行。这样的精力，简直令人咋舌。 336、“我却怕甚鸟！”一个“我”字，特别有精神。人生在世，“不怕”是个宝。不怕，是实力的体现，也是精神的体现。有了“不怕”的精神，才能有“不悔”的人生。 337、那汉是喝，李逵是大喝。这被劫的竟然比打劫的还要有气势。狭路相逢，勇者胜。 338、什么叫滑稽？什么样的行为让我们感到滑稽？形式和内容不相称。愿望和能力不相称。行为和目的不相称。屎壳郎过马路，不滑稽。但是，它如果冒充吉普车，就滑稽了。所以，李逵本来也不滑稽，但是，当他冒充李逵时，尤其是在李逵面前冒充李逵时，就滑稽了。 339、这世界上，总有一些人，要不做大老爷，要不做龟孙子，在比他弱的人面前，他做大老爷；碰到比他狠的，强的，他马上甘愿做龟孙子。假如一个社会，还是权力以及所谓的实力等等决定一切，这种人就不会改良，人类的这种丑陋人性就会继续存在下去。 340、你要和他讲道理，小心他一斧头把我们也劈了。我们一定要记住他的名言：“前打后商量。”梁山好汉，很多人都奉行强盗逻辑。宋江主政以后的梁山，也常常是强盗逻辑。这逻辑的基本原则就是，一切以是否有利于我为中心。有利于我的，是朋友；不利于我的，是敌人。 341、“孝子不匮，永锡尔类。”意思是说，孝子的孝，不仅到自己为止，还要把这种孝心推广到自己的同类那里去。这李逵，还真做到了。 342、这李逵，哪里是什么坏人？他不但不是坏人，他还劝坏人向善。但你要说，李逵是一个在道德上非常自觉的善人，那又不一定。为什么呢？因为他有时候好得很，有时候又坏得很。怎么会有这样的人呢？实际上，道德的境界有三层，自在的境界、自为的境界、自觉的境界。自在的境界，就是无善恶观，没有道德意识。自为的境界，有着出于本性的自然的善。自觉的境界，有着出于理性的自觉的善。这是道德的最高境界。那么，李逵在哪一个境界呢？在第二个境界，即他是“自然的善”，还不是“自觉的善”。正因为他是自然的善，所以，那种淳朴、本然，出自内心的真诚，非常能够感动人。但又正因为他还不是自觉的善，所以，当他的本心被其他念头遮蔽了时，也就不免于恶。 343、梁山好汉，张口闭口都是鸟的人很多，但以李逵为最，他几乎到了句句不离鸟的境界，好像他就长了一张鸟嘴，张口闭口，全是鸟字，假如我们和李逵做个试验，叫他说话不带鸟字，我相信，他一定不会说话了，鸟已经成为他的万能词。以至于他只能讲鸟话。 344、小人不就是这样么？小人总是把高尚当愚蠢，把奸诈当聪明。 ④ 天降杀星 345、一句话也没有就杀了。不用说了。已经听明白了。不能说了。一说又是鬼话。 346、古代中国的民间，实际上出于长期的压抑状态，人人内心都积压着太多的怨气。我把这种生存状态称之为“带气生存”，在大多数人的生存状态都是“带气生存”的情况下，全社会都充斥着一股可怕的暴戾之气。所以，《水浒》中一再出现的吃人肉情节，是作者内心压抑的表现，更是全社会压抑心理的非理性释放。专制使人变态，《水浒》的这种描写，是《水浒》作者以及更为广泛的读者集体变态心理的表现。 347、专制政体及其对人性的兽性化改造，是《水浒传》中人的兽性大发作的根本原因。 348、《水浒》“野蛮美学”的代表人物，就是李逵。 349、在封建社会，只有两种人：良民（顺民）和暴民。在武松家里，武大是良民，武松是暴民。在李逵家里，李逵是暴民，李逵母亲和大哥李达是良民。问题在于，良民在这个社会里，得到了什么？武大被害了。李逵母亲穷愁潦倒，眼睛哭瞎了，最后还被老虎吃了。李达呢？帮人打长工，受尽欺压。暴民乃是良民变的，是什么力量让良民变成了暴民？这是我们今天读《水浒传》需要思考的。"
full_description = "鲍鹏山新说《水浒》经典语录精选之李逵 ① 初见宋江 303、《水浒》中，真有性情、气质、形状和声口的，大概也就十来个人。这已经很不简单，足以使《水浒传》成为伟大的小说。而在这十来个人中，李逵是其中一个，而且非常独特。他是这个成人世界里的孩子。举凡孩子的天真、单纯以及胡闹闯祸、没准头、欠缺是非判断力，他都有。 304、李逵心中，有天赋的质朴的是非观，但是，他欠缺鲁智深那样的悲悯情怀，那是成人才有的，李逵实际上一直没有长大。 305、梁山好汉就其与事的关系而言，有几种类型。有些人是“人遇事”。如鲁智深。有些人是“事找人”。如林冲。有些人是“人找事”。而“人找事”的，典型代表是李逵。他好像总要找点事，生点事，他是梁山第一盏不省油的灯，梁山好汉，谁都怕和李逵一起出差。盖他随时可以做出来，惹是生非，无事生非，防不胜防，与他在一起，提心吊胆，有擦不完的屁股。 306、李逵一出场就是闹事。而且，半天的工夫，就闹了五场，简直闹得我们应接不暇，眼花缭乱，又心烦意乱。 307、什么叫口无遮拦？就是心口如一。口无遮拦，实际上是心无遮拦。李逵的可爱，主要就得益于这种个性。我们见到的人，绝大多数都是说话经过斟酌的，猛然见到李逵这样的说话不经过大脑的，有一种清新的感觉，还有一种轻松的感觉，在他面前，我们无须设防。 308、按社会世俗观念，说话时，称呼对方时，赋予对方社会性的身份或头衔，就叫说话文明。相反，按照生理特征，直接说出对方的个体性特点，就叫粗鲁，不尊重人。 309、知道不知道在语言上尊重人，这中间有很大的差别，既是修养的表现，也体现一个人的世界观。但是，从另一个方面看，这种文明的说话方式，实际上包含着客观上的虚假和主观上的虚伪。而所谓粗鲁的说话方式，不过是直指真相而已。 310、李逵这样的人，在表现出粗鲁和缺乏教养之外，也显示出质朴和真实的一面。而这一点，又是非常可贵的品格。 311、李逵是教不好的。从另一角度看，他是教不坏的。 312、幽默需要三个条件：一、智慧。能在瞬间化严肃为轻松，逆来顺受，并将对方的锋芒化解于无形，必要智慧；二、自信。能自嘲者必有自信；三、心态。自由放松。宋江当然不乏智慧，他也又足够的自信。但他一直缺少这样的放松。是李逵给了他。李逵为什么能让人放松？因为他自己完全敞开，毫无城府，令人有安全感。 313、演对手戏，只要有李逵在，其他人必黯然失色，让李逵一人独占风光。连宋江、燕青这样出色的人也不例外。就因为他是纯本色的，而且是毫无心机的，偶有一点小算盘，也愚拙得可笑，让人一眼看穿。 314、李逵自己毫无艺术细胞，毫无艺术欣赏的意识和能力，但是，出人意料的是，他自己的一举一动，则是极好的艺术。为什么呢？因为他完全出于自然，美丑妍媸，全在天性，全无意识。全凭最初一念之本心，完全符合李贽对艺术的最高定义：童心。所以，李贽也特别喜欢他。 315、拿银子买人心，是宋江的专长。宋江专用银子笼络人，李逵偏偏在缺银子时碰见宋江。这不是李逵运气好，而是宋江运气好，总是碰到缺衣少食的好汉，然后很便宜就买到好汉的忠心了。 ② 银子奴隶 316、笑声大，口气大。笑声大，让周围的人听，显示自己。口气大，是要把自己说得很有身份。 317、宋江凭十两银子，就买到了自己的主导地位，买到了自己的心理优势。同样，李逵也因为这十两银子，就丢掉了自己的身份。烫手的山芋，还可以吃。烫手的银子，万万接不得。多少英雄，贫贱不能移，威武不能屈。但是，富贵可以淫。人，忍受苦难易，拒绝诱惑难。 318、如果一个人有自尊心，有平等意识，如此被人在人前埋汰挤兑，一定很不高兴，但李逵却毫不知觉。他可能甚至还觉得很温暖：有人罩着他了。人是多么容易成为奴隶啊。 319、我们知道，笼络小人，很容易，给点好处就行。笼络英雄，光靠银子，不行。你至少还得做到三点：第一，你得欣赏他，至少你得让他感觉你欣赏他；第二，你得尊重他，至少你得让他感觉你尊重他；第三，你得宽容他，英雄有个性，对这种个性，哪怕你不喜欢，但你得容忍，而且还要让他不觉得。一句话，英雄需要尊重。而这几点，宋江都做到了。 320、一个人，道德高不高，看大事。气质好不好，看小事。 321、事实上，能够赏识李逵，能否看出此人的价值，认识到此人粗鲁背后的可贵与可爱，确实需要眼光。这个眼光戴宗没有，宋江才有。作者把这三个人放到一起写，让李逵尽情表演，让宋江和戴宗两个观众观看，然后，通过他们的不容反应，鉴定他们的境界高低。李逵就像是一个秤砣，称出了宋江和戴宗的不同斤两。 322、他马上感受到了自己和他人的差距。他有一种被冷落、被抛弃的愤怒。甚至，我们说，这是一种嫉妒，一种吃醋。 323、同样面对楚楚可怜的女子，李逵出手相伤，鲁达出手相救，这就是李逵和鲁达的差别。鲁达的内心，有极高贵的东西。李逵的个性，有极自然的东西。 324、开口是你哥哥，闭口是哥哥。开口提醒你哥哥者，是提醒李逵，这个可是你的哥哥，你不照顾，谁照顾？你不上心，谁上心？闭口是哥哥者，这也是我的哥哥，你不照看好，我也要你好看。一句话，戴宗不放心李逵。 325、我常常感慨，无论是对历史，还是对现实，那些真正的有见识之言，一针见血之语，直揭真相之论，往往不是出自饱学的学究，出自拿着项目经费做项目的学者，而是出自乡野草民，出自那些没有什么文化，斗大字不识一箩的粗野之人。 326、我们可以想见，他是多么寂寞，多么无助，多么恐惧，多么绝望！但是，他没有逃走，没有旁观，没有犹豫，他就凭着他的一腔血性，一腔忠诚，杀出来了！一个人，一副板斧，他要挑战江州五七千军马！他一定知道他断断不会成功。但是，此时，他求的，不是成功，是成仁！这是知其不可为而为之的精神。 327、什么是勇的本质？就是不顾后果，不量敌之众寡，一句话，不能有算计之心。真正的勇敢，不能考虑胜败。因为，有必胜的把握，懦夫也敢出手。而真的勇士，没有必胜的把握，也敢出手。勇分两种：一、血性之勇；二、义理之勇。血性之勇往往出于性格。义理之勇只能出于品格。明知必败，只要大义所在，也毫不犹豫地出手，这就是义理上的勇敢。这种义理上的勇敢，就是一种高贵的精神。李逵，此时体现的，就不仅仅是勇敢，而是一种精神。 328、他不会算计，他不知道什么叫无谓的牺牲，他只知道，此时，只有牺牲，才是好汉的勾当！ 329、我们常说，逼上梁山。对林冲而言，是别人逼他上山。对李逵而言，是他逼别人上山。从此，李逵就上了梁山。可以说，他是在上梁山前最为顺利的一个，也是最心甘情愿的一个。别人上山，都经过了一番磨难，都有一番曲折，一番思想上的斗争。在万不得以时，才走上这条路。一句话，都要抛弃很多东西，损失很多东西，包括抛弃此前的做人原则。而李逵，在这两点上，他都没有顾虑。他是一个流氓无产者，没有物质的东西可以损失。上梁山，对他而言，丢掉的只是锁链，得到的却是无法无天快活的生活。更重要的是，他也没有什么造反有罪、落草丢人的观念，所以，也不会有思想上的障碍。 330、革命者与一般的反叛者的一个大区别在于：一般的反叛者，其反叛，可能出于自然的欲望，出于某种现实中的不得已。革命者的革命，其要革命，则是出于社会的理想，出于一种理想上的追求。而李逵，显然，自然的生理上的追求享乐的欲望，才是他行为的动力。 331、李逵的行事，主要遵循的就是快活原则。杀人不是为了复仇，不是出于战阵厮杀的需要，而竟仅仅是为了快活！真造反，假革命。 ③ 真假李逵 332、必须指出的是，李逵是很会撒娇的人，他常常很乖巧地撒娇。可以说，李逵的撒娇，与他的板斧一样有威力。板斧与撒娇，是李逵的两大法宝；板斧对付敌人，撒娇征服朋友。 333、人们为什么对撒娇不计较，反而很受用呢？因为，撒娇不光是一种对对方说话表达的方式，更是一种对话表达的态度：撒娇者总是主动地把自己放在依附的位置上，通过一种人格上的屈尊来换取对方的恩宠。达到的是自己的目的，却满足了对方的心理需求。 334、我们知道，陶渊明晚上不吃酒，睡不着；早上不吃酒，起不来。李白呢？不吃酒，写不出诗。现在，李逵是不吃酒，走不动路，三者同是极高境界。都算是酒中圣人。 335、不吃酒，走不动路；吃了酒，连觉也不用睡，吃到四更，五更便行。这样的精力，简直令人咋舌。 336、“我却怕甚鸟！”一个“我”字，特别有精神。人生在世，“不怕”是个宝。不怕，是实力的体现，也是精神的体现。有了“不怕”的精神，才能有“不悔”的人生。 337、那汉是喝，李逵是大喝。这被劫的竟然比打劫的还要有气势。狭路相逢，勇者胜。 338、什么叫滑稽？什么样的行为让我们感到滑稽？形式和内容不相称。愿望和能力不相称。行为和目的不相称。屎壳郎过马路，不滑稽。但是，它如果冒充吉普车，就滑稽了。所以，李逵本来也不滑稽，但是，当他冒充李逵时，尤其是在李逵面前冒充李逵时，就滑稽了。 339、这世界上，总有一些人，要不做大老爷，要不做龟孙子，在比他弱的人面前，他做大老爷；碰到比他狠的，强的，他马上甘愿做龟孙子。假如一个社会，还是权力以及所谓的实力等等决定一切，这种人就不会改良，人类的这种丑陋人性就会继续存在下去。 340、你要和他讲道理，小心他一斧头把我们也劈了。我们一定要记住他的名言：“前打后商量。”梁山好汉，很多人都奉行强盗逻辑。宋江主政以后的梁山，也常常是强盗逻辑。这逻辑的基本原则就是，一切以是否有利于我为中心。有利于我的，是朋友；不利于我的，是敌人。 341、“孝子不匮，永锡尔类。”意思是说，孝子的孝，不仅到自己为止，还要把这种孝心推广到自己的同类那里去。这李逵，还真做到了。 342、这李逵，哪里是什么坏人？他不但不是坏人，他还劝坏人向善。但你要说，李逵是一个在道德上非常自觉的善人，那又不一定。为什么呢？因为他有时候好得很，有时候又坏得很。怎么会有这样的人呢？实际上，道德的境界有三层，自在的境界、自为的境界、自觉的境界。自在的境界，就是无善恶观，没有道德意识。自为的境界，有着出于本性的自然的善。自觉的境界，有着出于理性的自觉的善。这是道德的最高境界。那么，李逵在哪一个境界呢？在第二个境界，即他是“自然的善”，还不是“自觉的善”。正因为他是自然的善，所以，那种淳朴、本然，出自内心的真诚，非常能够感动人。但又正因为他还不是自觉的善，所以，当他的本心被其他念头遮蔽了时，也就不免于恶。 343、梁山好汉，张口闭口都是鸟的人很多，但以李逵为最，他几乎到了句句不离鸟的境界，好像他就长了一张鸟嘴，张口闭口，全是鸟字，假如我们和李逵做个试验，叫他说话不带鸟字，我相信，他一定不会说话了，鸟已经成为他的万能词。以至于他只能讲鸟话。 344、小人不就是这样么？小人总是把高尚当愚蠢，把奸诈当聪明。 ④ 天降杀星 345、一句话也没有就杀了。不用说了。已经听明白了。不能说了。一说又是鬼话。 346、古代中国的民间，实际上出于长期的压抑状态，人人内心都积压着太多的怨气。我把这种生存状态称之为“带气生存”，在大多数人的生存状态都是“带气生存”的情况下，全社会都充斥着一股可怕的暴戾之气。所以，《水浒》中一再出现的吃人肉情节，是作者内心压抑的表现，更是全社会压抑心理的非理性释放。专制使人变态，《水浒》的这种描写，是《水浒》作者以及更为广泛的读者集体变态心理的表现。 347、专制政体及其对人性的兽性化改造，是《水浒传》中人的兽性大发作的根本原因。 348、《水浒》“野蛮美学”的代表人物，就是李逵。 349、在封建社会，只有两种人：良民（顺民）和暴民。在武松家里，武大是良民，武松是暴民。在李逵家里，李逵是暴民，李逵母亲和大哥李达是良民。问题在于，良民在这个社会里，得到了什么？武大被害了。李逵母亲穷愁潦倒，眼睛哭瞎了，最后还被老虎吃了。李达呢？帮人打长工，受尽欺压。暴民乃是良民变的，是什么力量让良民变成了暴民？这是我们今天读《水浒传》需要思考的。 350、李逵杀人，有六大特点：第一，杀得快；第二，杀得多；第三，谁挡我路我杀谁；第四，多杀无辜；第五，毫不歉疚；第六，手段残忍。 351、为了自己的目的，不惜杀人，谁挡自己的路，就杀掉谁，李逵的这种个性，真是非常糟糕。问题是，这也是宋江主政以后梁山的政策和策略。 352、实际上，他根本不知道为什么要打仗，他根本不知道打仗的目的是什么。在他看来，打仗就是杀人，就是杀人的狂欢；可以肆无忌惮地杀人，可以合法合理地杀人，不受约束地杀人，不受惩罚地杀人。不仅杀对立的一方，甚至，只要是在现场的人，一律都是杀人狂欢的材料。 353、《水浒传》的作者和很多读者，包括金圣叹，都是有严重的心理变态的。 354、如果要在《水浒传》中选最下流的人，我选董平。要选最残忍最无人性的人，我一定选李逵！ 355、我们可以说，李逵是一个缺少良知的人。他是一个自然人，所以，他有时候很可爱，因为他自然，毫无做作，毫无心机，简直是赤子之心。这样的时候，他的魅力几乎不可抗拒，我们对他的喜欢简直无以复加，这也是金圣叹、李贽这样的大家也极力称赞他，成为他的铁杆粉丝的原因。但是，我们千万不要忘了，有时候他又非常可恨，非常可怖。 356、如果要我在梁山好汉中选一个最为正派、正气而为人厚道的人，我一定选朱仝。《水浒》中救人最多的，是朱仝；明明白白地用毁掉自己的方式去救人的，也是朱仝。《水浒》是歌颂义气的，而论讲义气，首屈一指之人，非朱仝莫属。 357、大概作者也觉得朱仝是在委屈，所以，特别安排了一个光明的结果：在宋江、吴用、雷横、李逵俱不得善终以后，独独朱仝在保定府管军有功，后随刘光世破了大金，直做到太平军节度使。这个人生结局，迥异于梁山大多数人的凄凉结局。这是施耐庵对朱仝的补偿，也是对我们读者的一个安慰。 ⑤ 人心李逵 358、假如一个社会，总是出于一种无序的状态，总是有人压迫人，人剥削人，总是强者暴弱，众者欺寡，总是强者制定规则，弱者被动接受，强者通吃，弱者无告，那么，弱者在无法反抗的情况下，也就只能压抑着怒火，带着满腔的怒气，很压抑地生存。这就是我说的“带气生存”。问题是，一个社会，“带气生存”的人多了，“带气生存”的时间长了，这个社会就危险了。因为，这么多压抑的气，总有爆发的一天。《水浒传》所反映的，就是这样的社会。 359、开门七件事，柴米油盐酱醋茶，生而为人类，衣食住行老病死，处处得求人，时时在受气。堂堂大宋，堂堂华夏，皇帝欺压我们。贪官污吏欺压我们。流氓地痞欺压我们。甚至，身边的人，枕边人，也欺压我们！而我们，却叫天天不应，叫地地不灵。我们又不能气得一头撞死，只能百般忍耐，带着满腔的怨，满腔的恨，满腔的气，满腔的愤，满腔的不平，满腔的无奈，隐忍生存，带气生存。有了这么多的气积压在心头，年长日久，越积越多，我们的心理健康也就自然受到严重影响。以至于全社会都充满火气，充满一股可怕的暴戾之气。而这样的暴戾之气，是需要释放、需要发泄的。有镇关西，我们就盼着有鲁提辖；有镇关西的欺男霸女，我们就会盼望鲁提辖的三拳头。有西门庆与潘金莲之杀武大郎，我们就会快意于武二郎杀嫂杀西门庆；有毛太公父子的陷害，我们就会盼望着顾大嫂夫妻的搭救。有牛二的欺人太甚，我们就心里急吼吼地盼着杨志抽刀宰了他。在不知不觉中，我们全都赞成以暴制暴，全都倾向于暴力解决问题。《水浒传》作者，如此成功地使我们全都成了暴力崇尚者。 360、你别看殷天锡只是一个小流氓，但是，他可是一个手眼通天的小流氓，因为，他的上面，有着中流氓高廉，大流氓高太尉。 361、目无王法，是个人的问题。不信王法，一定是社会的问题。 362、李逵有时候、能说出特别针砭时弊的话，而且一针见血，特别深刻，而专家学者则往往欠缺这样深刻明晰的认识。不是李逵聪明，而是专家学者太迂腐：他们往往在所谓“学术”的圈子里绕来绕去，最后把自己绕糊涂了，绕成了上海话说的“戆大”。其实，很多判断不需要太多的学问，而仅仅需要一些尽人皆知的常识。李逵不是有什么过人之处，他只不过做到了两点：第一，不回避现实；第二，有真实感受，并敢于说出真话。而这两点，恰恰是很多人，尤其是学者专家往往欠缺的。 363、条例为什么依不得了？因为条例之上有权力。只要权力大于条例，条例等等，就永远是一纸空文。而条例依不得了，社会也就失序了，天下也就乱了。所以，是什么乱了天下？是权力。权力是一切动乱的根源。 364、在《水浒传》中，讲到林冲，我们要思考的问题是：一个人，为什么如此懦弱？是什么让人如此惧怕以至于交出尊严？而讲李逵，我们要思考的问题是：一个人，为什么如此暴力？是什么让人如此残暴以至于兽性发作？实际上，这些问题的答案，就在《水浒传》中。需要我们做的，就是把它找出来。比如，李逵为什么如此崇尚暴力？李逵自己就告诉了我们：那就是因为对条例的失望。作为一个底层的民众，他从来没有感受到国家法律、条例对他的保护，他看到的就是谁有权力，谁就可以胡作非为。而没有权力的人，只能任人宰割。所以，像李逵这样的人，是不道德的，但是，他的出现，却偏偏有着十分道德的起因。因为他是对国家暴力的反抗。 365、对李逵的评价非常矛盾：有人说他好。有人说他坏。我说，李逵确实坏。从道德角度看，他是一个草菅人命的恶人。从法律角度看，他是一个践踏法律的罪人。从个人品性上说，他毫无怜悯心，是个极端残忍的人物。从社会秩序上说，他目无法纪，是个极端危险的人物。但是，这种人，是在什么样的土壤中成长出来的？为什么他又让几百年来的读者喜欢？因为，他是一种恶，但是，他是作为另外一种更大的恶的对立面出现在我们面前的。这种更大的恶，就是封建专制制度及其塑造的权力社会。简单地说，就是权力。 366、有了权力，他就是吃人的老虎。没有权力，这样的人连纸老虎都算不上，就是一张纸，一张卫生纸。 367、平时仗势欺人，语言蛮横，和柴进说话，何等张狂，似乎天地都比他小。而在李逵的拳脚面前，竟然死得连一声呻吟都没有。甚至，我怀疑，他至死都没有看清是谁在打他。这世界上，确实有一些人，只认得拳头。这世界上，确实有一些人，只要李逵这样一个粗人的拳头，就可以称出他的斤两。就这样一副经不起三拳两脚的臭皮囊，一旦背靠权力，竟然可以不可一世，欺压天下人。反过来，就这样不可一世的癫狂小儿，要打出他的原形，让我们看出他不过就是一堆烂肉，需要的，不过就是李逵的三拳两脚！不受约束的权力，最后招来的，一定是暴力。 368、为什么我们喜欢李逵？就是因为这世界上太多殷天锡这样的人，太多完全不可理喻、只可拳打脚踢的人。他们自己在这个世界上横行霸道，靠的是强权，是暴力，所以，他们也只认识强权和暴力，只服从强权和暴力。我们说，世上的事物，往往是成对出现的：有殷天锡，就一定有李逵。有殷天锡，就必须有李逵。我们为什么喜欢李逵？因为这个世界常有殷天锡。 369、无论是佛家的忍、道家的柔，还是儒家的让，碰到殷天锡，碰到有权力的殷天锡，全都干瞪眼！全都抓了瞎！这个时候需要的，是侠！所以，我们看，中国古代的老百姓，有信佛的，有崇道的，有尊儒的，但是，大家又都向往侠！喜爱侠！在被压迫得喘不过气来的时候，盼望侠！ 370、正如李逵说的，活佛也有忍不得的时候，活佛忍不得的时候，就成了侠。大家熟悉的，中国老百姓特别喜欢的一个活佛，就是济公，济公就是佛侠。老子说：“民不畏死，奈何以死惧之？！”老子不畏死的时候，老子也就是侠，老子是道侠。儒家的圣人孔子也有忍不得的时候，孔子说：“是可忍，孰不可忍？！”当孔子不忍的时候，他也就是侠，孔子是儒侠。孟子说：“予不得己也！”孟子不得已的时候，他也就是一个侠，儒侠。老子、孔子、孟子不仅是侠，而且是侠之大者，他们为人民向为非作歹的统治者讨还公道。如此说来，济公也好，老子也好，孔子也好，孟子也好，他们的心中，不都有一个李逵？我们喜欢《水浒传》，是因为，我们心中，都有侠。我们喜欢李逵，是因为我们心中，都有一个李逵。 ⑥ 人间正气 371、王伦在被林冲火并时，大叫：“我的心腹在哪里？”他没有心腹，因此，下场很惨。卢俊义称呼燕青是“我的那个人”，因为有了燕青这个心腹，卢俊义虽九死而终于一生。那么，宋江有没有心腹人？当然有。宋江的心腹人，就是李逵。 372、宋江不会敬重他，但是却亲近他，宋江知道他忠心而无头脑心计，更无自己的野心。这样的人，是最好的手下。宋江在骨子里，对李逵是缺少敬重的。 373、李逵的可爱可敬之处，恰恰在于，他自己并不妄自菲薄，他并不把自己摆在奴仆的位置上。有一个现象我们需要指出，《水浒传》中的众多英雄，在没上梁山之前，都是活色生香，生龙活虎，个性鲜明，栩栩如生。但是，一上梁山，加入梁山大集体，马上就淹没在集体之中，不再有突出的个性和个人表现。这个现象非常值得我们思考：这些极具反抗性的人物，为什么在新的组织里，就不再反抗，恰恰相反，表示出的，是极端的服从？这些在原来的生活里，不受一点欺压和委屈的人，为什么在梁山，个个都委曲求全，唯命是从？事实上，当一个集体声称是道德的化身，是我们自己的集体，代表我们的利益，保护我们的利益，尤其是声称保护我们最终的长远的利益时，我们就会对这样的集体失去警惕，我们在得到集体给我们安全与保护的同时，也放弃了我们的权利，取消了我们的个性，用服从换来接纳。 374、李逵是在集体之中，却又不被集体同化，顽强地保持自我个性的人物。他是一个很难被体制化的人物。这并不是因为李逵比其他的人更富有自我意识，而是因为，李逵是一个社会化不完全的人，就是我们前面说到的，他还是一个很大程度上的自然人。在一个组织严密、纪律严明的集体里，有一个完全不理解社会规则的自然人，是很有趣的，一定会发生很多有趣的事。实际上，《水浒传》后半部，一大半的可读性都来自于李逵。在《水浒传》后半部沉闷的集体宏大叙事里，李逵的出场，是我们读者的节日。只要李大哥出来了，他一举手，一投足，一说话，马上就会让我们开心一笑。 375、我发现，头脑简单的人，往往在男女之事上特别敏感，并且特别反感。李逵就特别关注宋江的男女之事。实际上，如果李逵懂事一些，领导的这点爱好，不但不会见怪，反而要帮忙才对。为领导拉皮条，是懂事的下属的基本素质。 376、敢于怀疑山寨最高领导不是好人，这种精神和勇气，梁山没有第二个。不但敢于怀疑，还敢于说出来。不但敢于说出来，他还敢于做出来。 377、一个人有无道德感，如何检验？我提出一个方法：就是看他会不会生气。面对黑暗、邪恶，一句话，面对社会上的一切不平和不公，你还生不生气？生气，并且很生气，道德感就强。不很生气，甚至不生气，那就后果很严重，因为，几乎可以断定：你的道德感已经麻木了，甚至同流合污了。一个民族有无生气，如何判断？我也提出一个方法：就看这个民族还有多少人在生气。对邪恶不公还有很多生气的人，这个民族就还有生气。生气的人少了，民族的生气也就少了。所以，能生气的人，是有生气的人。能生气的民族，是有生气的民族。反过来，要戕害一个民族的生气，最阴险也最有效的办法，就是去迫害那些还能生气的人。生气的人多了，社会就有救了。 378、金圣叹确实发现了李逵身上的非常可贵的一面，那就是，他只讲道理，不讲情面。如果你不是好人了，哪怕你是宋江，我也要拿板斧砍你。无碍吾兄，但，我更爱正义。爱到此处，方为大爱。 379、谁能管教李逵？李贽说：张顺的水，戴宗的腿，罗真人的云里鬼。我还要加两项：燕青的跌，宋江的药。唯宋江的药，一了百了，彻底解决。 380、李逵不负宋江，宋江不负朝廷，可是，朝廷，却负尽天下人。 原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/709124224 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香"
