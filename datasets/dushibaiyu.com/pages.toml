定会渐渐陷沉下去，就算还能活下去，也和死相差无几。 人在回忆中，时间往往会过得很快的，所以有些孤独的老人只有生活在回忆里，才能度过漫长寂寞的晚年。 一个人变得自言自语的时候，就说明他已老了。 想象永远比实际更美得多的。 只有笑声才是对付困难和不幸的最好武器。平静就是幸福。 幸福也不是绝对的。你眼中的幸福，在别人眼中也许是不幸。人生中还有什么事比“忘 记”更困难。 不幸的是，人类最大的悲哀，就是人们常常会想一些自己不该想起的人和不该想起的事。 “超越”决不是件简单的事，更不容易，无论你要超越什么，都一定要付出代价。 人与人之间，为什么会有如此大的距离？为什么有的人生活得如此卑贱？为什么有些人要那么骄做？ 一个人为什么要活下去宁是不是因为他还想做一些自己认为应该做的事？如果一个人自 己认为应该做的事却不能做，他活着还有什么意思？ 每个人将死的时候，都会变得比平时善良些的。 只要能活着，每个人都应该活下去，好好地活下去。 只要还能笑，一个人的确应该多笑。 一个人只要还能笑，就表示他还有勇气！只要还有勇气，就能活下去！ 一个人只要还能笑，日子总是比较容易打发的。 “死”的本身并不痛苦，痛苦的只是临死前那一段等待的时候。 这个世界上有很多的事都是连一点点都不能差的、就算差一点点都不行。 天下的事就是这样子的，你要它破的时候，它偏偏不破；你不要它破的时候，它反而破了。 这世上无可奈何的事本来就很多，所以做人又何必太认真呢？ 这个世界上，还有什么事比死更真实的？ 这个世界上，还有什么事比死更有魅力？ 这个世界上，除了“死”之外，还有什么事能让人去自杀？——生命如此可贵，要让人 去自杀是一件多么困难的事？——如果“死”里没有一种魅力，怎么能让人去死？死的魅力，是不是一种忘记？是的。 ——忘记是一件多么困难的事，除了“死”之外，还有什么事能让人完全忘记。 ——不但是忘记，而且是没有了，什么都没有了。生命也没有了，死也没有了，快乐也没有了，痛苦也没有了。这是一种多么痛快的解脱。 无论什么事都有结束的时候。 越冗长复杂的事，往往结束得越突然。 因为它的发展本已到了尽头，而别人却没有看出来。 你虽觉得它突然，其实它并不突然。 沉默，有时固然比任何语言都值得珍惜；静寂，有时也比任何声音都可怕。 到了聪明人都无法可施时，笨人想出来的法子一定最有用。 每个人都有自己的秘密，谁也无权干扰。 无论多么深的悲哀和痛苦，日久也会淡忘的。忘记，本就是人类所以能生存的本能之一。 无论谁要改变自己的命运，都只有靠自己。 一个人若只为了片刻的欢乐才活着，这悲痛又是多么深邃。世上虽没有永恒的黑暗，却也没有永恒的光明，所以人间总有着很多悲惨的故事，产生了许多许多哀艳的诗赋，凄凉的歌曲。 死，并不如想象中那么容易，尤其是当一个人被痛苦折磨得太久时，反而不会死亡。 因为他们连勇气都已被折磨得麻木，也太疲倦了，疲倦得什么都不想做，疲倦得连死都懒得去死。 人若无信心，和行尸走肉又有何异？ 一个人只要还活着，就难免做些自己本来并不愿意做的事；每个人一生中都要做一些他本来不愿做的事，他的生命才有意思。 一个活在世上，有时也势必要做一些自己不愿做的事。造化之弄人，命运之安排，无论多么大的英雄豪杰也无可奈何的。 问话有时也是种教训。 因为你自己回答出的话，总是会比别人强迫要你记住的话更不易忘记。 从经验中得到的教训，总是特别不容易忘记。 就在最温柔、最美丽的阳光下，也常常会发生一切最丑陋、最可怕的事。 世界上的事有时的确很奇妙，你认为最不可能发生的事，却往往偏偏就会发生。 人的思想很奇特。有时你脑中很久很久都在想着同一件事，但有时你却会在一刹那间想起很多事。 两柄孤交绝世的剑，两个孤交绝世的人，又怎么不惺惺相惜。两个孤交绝世的剑客，就像是两颗流星，若是相遇了，就一定要撞击出惊天动地的火花。这火花虽然在一瞬间就将消失，却已光照千古！ 无论是剑法，是棋琴，还是别的艺术，真正能达到绝顶巅峰的，一定是他们这种人——一种你也许会不喜欢，却不能不佩服的人！一种已接近“神”的人。因为艺术这种事，本就是要一个人献出他自己全部生命的。 你救了一个人后，永远也想不到他会在什么时候报答你。这虽然并不是救人的最大乐趣，至少也是乐趣之一。 报恩有时实比报仇还困难得多。 结局永远都不会是可爱的，永远不会。 无论多开心多欢乐多可笑的事，到了结局的时候，就不开心不可爱了。 生命是开心的，多么丰富，多么热闹，就算有些人的生命中没有那种丰富的欢乐，也会有一点淡淡的恬适的享乐。可是生命的结局是什么呢？是死。 无论什么样的人，他的生命的结局都是死的。什么是死？ 如果你曾经仔细想过这个问题，你就会明白人生是一个多么大的悲剧了，如果你明白这一点，你对很多事也许都会看得淡点：看得淡一点并不是消极，也不是放弃，而是一种让你胸襟比较宽大一点的态度。 无论什么事都一样，你要求是完美，就得先对它有一种狂热的爱好。 艰苦的经验，并非总是能使人生更充足，更丰富。 要想得到真正的快乐欢愉，岂非总是要先付出艰苦的代价。为什么人类总是要被自己的欲望折磨？ 对金钱的欲望，对权力的欲望，对声名的欲望，对性的欲望！人类所有的苦难和灾祸， 岂非都是因为这些欲望而起的？一个人的内心深处，往往会有些秘密是自己都不知道的——也许并不是真的不知道，只不过是不敢去把它发掘出来而已。 天下的每一事每一物都不可能是完全的永恒。但凡事物的转换都要假借外力，受环境影响。 这个世界上有很多故事都是以成功和快乐做为结局的。艰辛奋斗者必获成功，有情人终成眷属。 只可惜这种结局并不是一种结局，而是一个暂停的符号。到了终结时，还是一样的。 一个人如果要做一件事，最好就不要问它的结局）只该问这件事，是不是应该去做。是不是值得去做，：在做这件事的时候，是不是能够让别人快乐，自己振奋！因为生命只不过是一段过程而已。 一个人如果能够明白这一点，他的生命就是快乐的了，他的这一生也可以算设有白活的。 可是这个世界上无论什么事都还是要有结局的，有了开始，就要有结局，无论什么事都能例外。 没有结局是不是比较快乐呢？ 不是。 没有结局本身就是一种结局。 也正是这一点才是最悲哀的。 自古以来，无论是谁想站在群山最高处，就得先学会如何忍受寂寞。 心可以沉，也可以死，人却不可以。 心死只不过悲伤麻木而已，还可复生。生死之间，却别无选择的余地，也绝无第二次机会。 一个人活着，他才会哭，会笑，会高兴，会悲伤，也会害怕，要不，就没有意思。 我虽然看不见，却能领略得到，所以我总觉得只有那些虽然有眼睛，却不肯看的人，才是真正的瞎子。 只要你肯去领略，就会发现人生本是多么可爱，每个季节里都有很多足以让你忘记所有烦恼的赏心乐事。 有火焰在燃烧，才有光明。这种燃烧过程，又是多么悲壮，多么美。 肌肉的跃动，生命的节奏，这岂非正是人生中完美的境界。一个懂得享受人生的人，又怎肯放过欣赏“美”的机会。这么强的人，生命竟如此脆弱。那么，生命的本身，岂非就是个悲剧？ 死亡是公平的，在死亡面前，最伟大的人也变会得很平凡。一个人若活到连他的仇人都认为不值得杀的时候，他活着还有什么意思？ 别人要拿冰塞入你脖子时，你会觉得很害怕，但等到冰雪已流在你的身上，你反而会觉得有一种残酷的愉快之感，仿佛得到了一种解脱，因为你们害怕的事，终于已经过去了。 只因为人们所真正惧怕的，通常都不是事物的本身，而只不过对那件事的想象而已。 人们畏惧死亡，也只是因为没有了解死亡之神秘，所以才会对“死亡”这件事出生许可怕的想象。 一天中最黑暗的时候，也正是最接近光明的时候。 人生也一样。只要你能把这段艰苦黑暗时光挨过去，你的生命立刻就会充满了光明和希望。 无论谁都难免被人冤枉的，同样也难免有冤枉别人的时候。一个人到了将死的时候，就会回忆起他一生中的所做所为，这种时候还能心安理得，问心无愧的人，世上并不多。 人都会变的，有的从赤贫变成豪宫，从君子变成了小人，从英雄变成了狗熊，也有从豪富变成了赤贫，从小人变成了君子，从狗熊变成了英雄。 我想的事很多，有时我想做皇帝，又怕寂寞，有时我想当宰相，又怕事多，有时我想发财，又怕人偷，有时我想要老婆，又怕罗嗦，有时我想烧肉吃，又怕洗锅，有时我甚至还想打你一巴掌，又怕惹祸。 每个人活在世上，好像都是想得多，做得少。 一个人只要活在世界上，就一定要受到某种约束。假如每个人都把自己想做的事做了出来，这世界还成什么样子？若看到一朵鲜花在你手里枯萎，心里总难免会觉得很惋惜，甚至会觉得有种说不出的愁闷。 就算你并不是个多愁善感的人，你也会不禁为之叹息。美丽的生命为什么总是如此短促？ 只有看不见的危险，才是最可怕的。 每个人都难免要被人愚弄，每个人都难免要死亡的。 一个人若是永远无法知道自己最切身的秘密，这岂非是世上最残忍，最悲惨的事。 死，岂非是最好的休息？ 一个人若已觉得活得很无趣时，就该不会再有奋斗求生的勇气。这时他就会觉得很疲倦 ，疲倦得情愿放弃一切，来换取片刻的休息。 无论谁一生中，都难免偶尔会有这种感觉的。 世上愚蠢的人永远比聪明的人多得多。 有种人天生出就是仿佛应当骄做的，他纵然将傲气藏在心里，他纵觉骄做不对，但别人 却觉得他骄做乃是天经地义，理所当然的。 一个人若只有聪明，而没有本事，那有什么用？ 对一个人了解最深的，常常是他最大的仇人。 世上没有可怕的秘密，世上所有的秘密都是有趣的。 Author 渡世白玉Posted on 2012年4月26日Categories 分享文字, 文字飘香Tags 人生, 古龙, 妙论, 经典, 语录"
