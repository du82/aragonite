["https://www.dushibaiyu.com/2013/12/%e7%94%9f%e6%b4%bb%e4%b8%8d%e8%bf%87%e6%98%af%e6%b5%81%e7%9d%80%e7%9c%bc%e6%b3%aa%e5%90%83%e7%9d%80%e8%82%89.html"]
title = "生活不过是流着眼泪吃着肉 | 渡世白玉"
description = "7月中旬大学毕业后，我来到望京工作，离家不算远，坐一个小时的地铁，但下了地铁到单位还有将近五公里的步行距离，好在望京这一片有非常发达的三蹦 子市场，北京俗称蹦子，就是那种烧油的三轮车，经常在路上和汽车彪，毫不示弱，还总是一蹦一蹦的，坐在里面总有种随时翻车的刺激感，从地铁口到公司十块 钱，价钱合理，又能享受到飞起来的感觉，坐三蹦子就这样成为了我每天生活必不可少的一件乐事。 三蹦子由于车身不稳，油门难以控制， 又没有避震系统，所以翻车的几率较高，有很大的安全隐患，City God们，也就是城管，每周都会做一次三蹦子大扫荡，连车带人一块压走，再加重罚款。基本上望京这一带干三蹦子生意的都是外地来京的底层打工人员，没钱没 文化，没人脉没技能，但凡有一点路子的都不会干这门差事，白天在地铁口趴活，一边拉客一边调动全身感官提防城管，晚上住在400元一月的地下室里，他们和 三蹦子一样，每天拼尽全力不停的飞奔，但随时要做好翻车倒地，就此告别这片土地的准备。这些都是一位优秀三蹦子驾驶员讲给我的。 他 让我叫他小六，来北京打工第三年，今年二十二，和我一样大，但坚持叫我大哥，他说坐他车的都是大哥，不是因为我有大哥的范，请我不要再拒绝。我们的相识缘 自我常坐他的蹦子，后来慢慢熟悉，从老顾客成为了蹦友，每天清晨我走出地铁的时候他都会在路边叼根红梅等着我，这个时间点如果出现别的顾客他都会道歉谢 绝，死心塌地的等我。小六是我所体验过的最优秀的三蹦子驾驶员，他常用的招牌驾驶姿势是下身翘着二郎腿，就这样炫酷的姿势却能把车骑的极稳，实在天赋秉 异，不过他有一点不太好，总喜欢在路上和我聊天，我倒不是担心他会因此分心，而是他娘的他总是喜欢回过头来和我聊天，用后脑勺目视前方。 小 六每天都会乐着给我讲点生活趣事，昨天哪个竞争对手翻车了，也不称称自己几斤几两，以为三蹦子是谁都能开的吗！前天哪个哥们一不留神撞到了城管，当场就义 愤填膺的抄起随时备好的钳子卸下了一个轱辘，死活咬定这不是三个轮的。还有他千里之外的家里事，他三代单传，去年媳妇给他生了个儿子，一家人高兴的不得 了，只是造化弄人，小儿子半年前得了怪病，呼吸常出现困难，方圆百里看了一遍，还是没治好。“不过不要紧，山里的孩子都命硬，我再攒个半年钱就把儿子带到 大北京的医院来，咱首都还能治不好？”讲这些时小六依然乐呵着，并且，还是他娘的非要把头扭过来看着我讲。 我喜欢小六，因为他总是两眼眯成一条线，乐呵呵的，每天早上看到他，我都觉得阳光暖的可以融化掉北京的雾霾。 9月中旬的一个早晨，我继续坐着小六的三蹦子藐视所有我们一路超过的汽车，那天小六没要我钱，他说他要回趟老家估计月末才能回来，这段时间送不了我了，给我推荐了两个同行好哥们，叫我以后做他们的车并告诉我他们是这一带排名第二和第三的三蹦子驾驶员。 第二天，小六的身影便没有再出现在地铁门口，生活还要继续，我依然坐着三蹦子去公司。不过第一天没有小六的日子，我乘坐的三蹦子就为了抢路和同样目空一切的马路霸主——公交车，蹭上了 险些侧翻，我很怀念小六。 终有一天你会明白，如果你遇见了一个优秀的三蹦子驾驶员之后，其他蹦子都会变成将就。 一 个星期后，小六提前回来了，在地铁门口看到他时我蹦蹦跳跳的就过去上了他的车，他依然眼睛眯成一条细线，乐呵呵的，只是眼角的皱纹比走那天深了一些。我开 心的不得了，过去乘蹦奔腾，策蹦驰骋的日子又回来了，我又可以在小六的蹦子上觊觎一切豪车了。小六的技术丝毫没有退步，驾起车来反而更加迅猛，像一头压抑 许久的野兽，向这个世界怒吼着冲向公司。 那天到公司的时间较已往早了几分钟，下车时我想起还一直没问他之前突然回老家的原因，“六子，那会怎么突然说走就走了，家里没出啥事吧？” “没事大哥，儿子病情严重了，媳妇和我娘着急，让我回去看看。” “那现在好些了吧，看你没到月末就回来了。” “死了，喘不上气，眼看着死的，小脸都憋紫了。” 我一时怔住，嗓子里像卡进了玻璃碎片，再说不出任何话语，连唾液都忘了该如何吞咽。 “死就死了吧，这娃命苦，生下来就受这活罪，我没出息，实在没法治好他，早点投胎去个好人家，千万别再给我当儿子。” 没有悲愤，没有凄凉，甚至连情绪的变化都没有，小六就这样平静的讲述着一个好像与他毫无关系的孩童的死去。 可他眼角下那在一周里好像被锥子凿刻了的皱纹，没能藏住他内心的悲痛。 秋日清晨的暖阳照射到小六的脸上，他的眼睛又重新眯了起来，嘴角再次咧出弧度 “大哥，你快去上班吧，我回去趴活了，明见。” 就像春的生机盎然，夏的浪漫浮华，冬的安宁沉静，秋天，就像一位历经人间百态，谙熟命途多舛的中年男子，已经走过了盎然，穿过了浪漫，为了那最终的安宁，只得坚强到沧桑满面。 或许每个人，都逃不过这命里的秋天吧。 9 月末，一位过去要好的舞友阿飞来找我和其他两个哥们吃饭，每个人都西装革领，人模人样的，再也不是曾经那个放荡不羁一边走路一边塞着耳机做Pop的街舞少 年。饭桌上，我们聊起了过去舞蹈带给彼此的快乐，聊起拿过的奖项，创下的辉煌，还有台下姑娘们的尖叫。只是谁都逃脱不了岁月这把刻刀，青春里的光鲜和华美 都会被它悉数刻进眼角的鱼尾纹，埋藏在当年勇的话题里。 阿飞说，刚毕业那会，身边跳舞的朋友还都在坚持，每周都会找个舞室聚一下，现在都找不到人了，就剩他自个每晚洗完澡在浴室的镜子前翩翩起舞了。 阿飞是东北人，我对阿飞的了解其实只限于舞蹈，四年前他来我家这边念大学横扫了本土街舞圈的所有人，他是我认识的跳舞朋友里练舞时最专注的，也是唯一一个把爱好坚持进生命里的人。不过后来被我反超了，让我抢回来了本土第一的宝座，没办法，我就是受不了别人比我帅。 除 此之外，我还知道阿飞很喜欢笑，四年，我几乎从来没有听他讲过一件不开心的事，永远笑嘻嘻，永远生活太美好。有一次他丢了钱包，钱包里除了各种卡之外还有 刚取的两千人民币，但他的第一反应是立马找出一根笔和一张纸，埋头写了半小时，然后咧着嘴对我们说“哈哈哈 卧槽 终于可以狠宰你们一顿了”，这才发现纸上写的是下个月要蹭饭的人名单和详细的时间安排… 饭间阿飞出去接了个电话，回来后眼圈就红了，要了一瓶白酒和六瓶啤酒，他从来不喝酒，他总说他喝这玩意就是毒药，每喝一口都得少活两天。另一个哥们前阵子刚因为中美异地和四年的恋人分手，一直嚷嚷着要喝两杯，看到阿一现在舍命陪君子，大家的酒兴都被点燃了。 借着酒劲，你一言我一语的开始诉说起各自最近生活的不如意，但觥筹交错间没有任何安慰的话语，只有嘻嘻哈哈，互相指着鼻子嘲讽着对方的苦痛，很多事情，还真的是笑笑就过去了。 阿飞一直没有说话，还是笑，只是笑。 他用迷离的眼神看着我“你知道为什么我对舞蹈这么坚持吗？” 旁边的大宇说“豪哥"
full_description = "生活不过是流着眼泪吃着肉 7月中旬大学毕业后，我来到望京工作，离家不算远，坐一个小时的地铁，但下了地铁到单位还有将近五公里的步行距离，好在望京这一片有非常发达的三蹦 子市场，北京俗称蹦子，就是那种烧油的三轮车，经常在路上和汽车彪，毫不示弱，还总是一蹦一蹦的，坐在里面总有种随时翻车的刺激感，从地铁口到公司十块 钱，价钱合理，又能享受到飞起来的感觉，坐三蹦子就这样成为了我每天生活必不可少的一件乐事。 三蹦子由于车身不稳，油门难以控制， 又没有避震系统，所以翻车的几率较高，有很大的安全隐患，City God们，也就是城管，每周都会做一次三蹦子大扫荡，连车带人一块压走，再加重罚款。基本上望京这一带干三蹦子生意的都是外地来京的底层打工人员，没钱没 文化，没人脉没技能，但凡有一点路子的都不会干这门差事，白天在地铁口趴活，一边拉客一边调动全身感官提防城管，晚上住在400元一月的地下室里，他们和 三蹦子一样，每天拼尽全力不停的飞奔，但随时要做好翻车倒地，就此告别这片土地的准备。这些都是一位优秀三蹦子驾驶员讲给我的。 他 让我叫他小六，来北京打工第三年，今年二十二，和我一样大，但坚持叫我大哥，他说坐他车的都是大哥，不是因为我有大哥的范，请我不要再拒绝。我们的相识缘 自我常坐他的蹦子，后来慢慢熟悉，从老顾客成为了蹦友，每天清晨我走出地铁的时候他都会在路边叼根红梅等着我，这个时间点如果出现别的顾客他都会道歉谢 绝，死心塌地的等我。小六是我所体验过的最优秀的三蹦子驾驶员，他常用的招牌驾驶姿势是下身翘着二郎腿，就这样炫酷的姿势却能把车骑的极稳，实在天赋秉 异，不过他有一点不太好，总喜欢在路上和我聊天，我倒不是担心他会因此分心，而是他娘的他总是喜欢回过头来和我聊天，用后脑勺目视前方。 小 六每天都会乐着给我讲点生活趣事，昨天哪个竞争对手翻车了，也不称称自己几斤几两，以为三蹦子是谁都能开的吗！前天哪个哥们一不留神撞到了城管，当场就义 愤填膺的抄起随时备好的钳子卸下了一个轱辘，死活咬定这不是三个轮的。还有他千里之外的家里事，他三代单传，去年媳妇给他生了个儿子，一家人高兴的不得 了，只是造化弄人，小儿子半年前得了怪病，呼吸常出现困难，方圆百里看了一遍，还是没治好。“不过不要紧，山里的孩子都命硬，我再攒个半年钱就把儿子带到 大北京的医院来，咱首都还能治不好？”讲这些时小六依然乐呵着，并且，还是他娘的非要把头扭过来看着我讲。 我喜欢小六，因为他总是两眼眯成一条线，乐呵呵的，每天早上看到他，我都觉得阳光暖的可以融化掉北京的雾霾。 9月中旬的一个早晨，我继续坐着小六的三蹦子藐视所有我们一路超过的汽车，那天小六没要我钱，他说他要回趟老家估计月末才能回来，这段时间送不了我了，给我推荐了两个同行好哥们，叫我以后做他们的车并告诉我他们是这一带排名第二和第三的三蹦子驾驶员。 第二天，小六的身影便没有再出现在地铁门口，生活还要继续，我依然坐着三蹦子去公司。不过第一天没有小六的日子，我乘坐的三蹦子就为了抢路和同样目空一切的马路霸主——公交车，蹭上了 险些侧翻，我很怀念小六。 终有一天你会明白，如果你遇见了一个优秀的三蹦子驾驶员之后，其他蹦子都会变成将就。 一 个星期后，小六提前回来了，在地铁门口看到他时我蹦蹦跳跳的就过去上了他的车，他依然眼睛眯成一条细线，乐呵呵的，只是眼角的皱纹比走那天深了一些。我开 心的不得了，过去乘蹦奔腾，策蹦驰骋的日子又回来了，我又可以在小六的蹦子上觊觎一切豪车了。小六的技术丝毫没有退步，驾起车来反而更加迅猛，像一头压抑 许久的野兽，向这个世界怒吼着冲向公司。 那天到公司的时间较已往早了几分钟，下车时我想起还一直没问他之前突然回老家的原因，“六子，那会怎么突然说走就走了，家里没出啥事吧？” “没事大哥，儿子病情严重了，媳妇和我娘着急，让我回去看看。” “那现在好些了吧，看你没到月末就回来了。” “死了，喘不上气，眼看着死的，小脸都憋紫了。” 我一时怔住，嗓子里像卡进了玻璃碎片，再说不出任何话语，连唾液都忘了该如何吞咽。 “死就死了吧，这娃命苦，生下来就受这活罪，我没出息，实在没法治好他，早点投胎去个好人家，千万别再给我当儿子。” 没有悲愤，没有凄凉，甚至连情绪的变化都没有，小六就这样平静的讲述着一个好像与他毫无关系的孩童的死去。 可他眼角下那在一周里好像被锥子凿刻了的皱纹，没能藏住他内心的悲痛。 秋日清晨的暖阳照射到小六的脸上，他的眼睛又重新眯了起来，嘴角再次咧出弧度 “大哥，你快去上班吧，我回去趴活了，明见。” 就像春的生机盎然，夏的浪漫浮华，冬的安宁沉静，秋天，就像一位历经人间百态，谙熟命途多舛的中年男子，已经走过了盎然，穿过了浪漫，为了那最终的安宁，只得坚强到沧桑满面。 或许每个人，都逃不过这命里的秋天吧。 9 月末，一位过去要好的舞友阿飞来找我和其他两个哥们吃饭，每个人都西装革领，人模人样的，再也不是曾经那个放荡不羁一边走路一边塞着耳机做Pop的街舞少 年。饭桌上，我们聊起了过去舞蹈带给彼此的快乐，聊起拿过的奖项，创下的辉煌，还有台下姑娘们的尖叫。只是谁都逃脱不了岁月这把刻刀，青春里的光鲜和华美 都会被它悉数刻进眼角的鱼尾纹，埋藏在当年勇的话题里。 阿飞说，刚毕业那会，身边跳舞的朋友还都在坚持，每周都会找个舞室聚一下，现在都找不到人了，就剩他自个每晚洗完澡在浴室的镜子前翩翩起舞了。 阿飞是东北人，我对阿飞的了解其实只限于舞蹈，四年前他来我家这边念大学横扫了本土街舞圈的所有人，他是我认识的跳舞朋友里练舞时最专注的，也是唯一一个把爱好坚持进生命里的人。不过后来被我反超了，让我抢回来了本土第一的宝座，没办法，我就是受不了别人比我帅。 除 此之外，我还知道阿飞很喜欢笑，四年，我几乎从来没有听他讲过一件不开心的事，永远笑嘻嘻，永远生活太美好。有一次他丢了钱包，钱包里除了各种卡之外还有 刚取的两千人民币，但他的第一反应是立马找出一根笔和一张纸，埋头写了半小时，然后咧着嘴对我们说“哈哈哈 卧槽 终于可以狠宰你们一顿了”，这才发现纸上写的是下个月要蹭饭的人名单和详细的时间安排… 饭间阿飞出去接了个电话，回来后眼圈就红了，要了一瓶白酒和六瓶啤酒，他从来不喝酒，他总说他喝这玩意就是毒药，每喝一口都得少活两天。另一个哥们前阵子刚因为中美异地和四年的恋人分手，一直嚷嚷着要喝两杯，看到阿一现在舍命陪君子，大家的酒兴都被点燃了。 借着酒劲，你一言我一语的开始诉说起各自最近生活的不如意，但觥筹交错间没有任何安慰的话语，只有嘻嘻哈哈，互相指着鼻子嘲讽着对方的苦痛，很多事情，还真的是笑笑就过去了。 阿飞一直没有说话，还是笑，只是笑。 他用迷离的眼神看着我“你知道为什么我对舞蹈这么坚持吗？” 旁边的大宇说“豪哥 我跟你说 阿飞可是有故事的人，你们以前没深聊过，绝对够你写篇文章的” 我知道他有故事，一直都知道。 这些年我认识或遇见过不少像阿飞一样的人，每天都没心没肺的，恨不得把把嘴角咧到耳根，简直觉得他们是在郭德纲的相声里长大的孩子。 可是越是这样的人，越是总隐约觉得他们的心里并没有那么多明亮，就像那句听起来很矫情的话，笑的最开心的人往往也是哭的最伤心的人，这话其实还挺对的。 越是拼尽全力的向阳生长，越是在为了甩开身体里的阴影。 那些似乎从来没有灰暗情绪的，始终不愿提及悲苦故事的人，心里都不知道藏了多少疤。我们避而不谈的，往往像极了我们自己。 这 是认识阿飞这些年，他第一次主动讲述自己，“年幼的时候父母离婚，没过两年，妈就去世了，因为先天的遗传疾病。从小到大我都是在姥姥身边长大的，她是我这 世上最亲的人，也是唯一的。上学后，由于家庭原因，基本上都在四处转学漂泊，我从来就没有过什么朋友，妈的病也遗传到了我身上，身体一直很差，其实能活多 久我自己也不知道，好在后来接触了街舞，跳舞对我来说远不只是爱好，是我生命的一部分，说句夸张的，它是我的精神寄托。而且让人开心的是，因为跳舞我认识 了不少朋友，我对人生没什么想法，没有奢求也没有梦想，我就觉得能活着就很好了。现在每天早上游泳晚上跑步，尽量维持身体健康，使劲活，能和朋友们跳跳 舞，偶尔像现在一样破戒喝两口酒就够了。” 阿飞平淡的讲完这段话，只是讲述，没有任何对苦痛的倾诉和怨愤。大家什么也没说，一起干了杯中酒。 “人活着必须他妈的坚强，除了坚强，一切都没有意义。”这是那天酒桌上阿飞的结束语。 走 出饭店时夜幕已深，哥几个一时兴起想跳会舞，于是我们走到一个路灯下围成一圈，用手机放起音乐，一人一段轮流跳了起来，没有舞台，没有追光灯，没有音响， 没有观众，只有我们自己。9月末的北京已经很凉，但大家都跳到大汗淋漓，坐在马路牙子上，你看着我我看着你，哈哈哈的笑了起来。 能吃肉的时候就大口吃肉，想喝酒的时候就喝个痛快。挫折、苦难，悲伤、失落，迷茫、彷徨，离别、孤单，这不过是一个个两字词语，被它们击倒的人，不过是不想再站起来的人。 那晚阿飞接到的那个让他忽然红了眼眶的电话内容，是他姥姥去世的消息。从小带他长大的姥姥，他这辈子最亲的人。我们告别时他告诉大家的。 “每一个不曾起舞的日子，都是对过往生命的辜负。”我想起了狂人尼采的这句话。 10月中旬的清晨，我继续坐着六子的三蹦子来到公司，下车离开时六子叫住了我 “大哥，晚上有空吗，想请你吃个饭” “有啊，五点下班，楼下等我” “对了，给咱这座驾洗个澡，晚上咱去点上档次的饭店，就开着它去”小六笑着眯起眼睛，爽快的答道“好嘞” 我也眯起了眼睛。 下班后，小六如约而至，还真给三蹦子洗了个澡，那铁皮锃亮锃亮的，我当时想着如果下一部变形金刚里能出现一辆三蹦子，那绝对亮瞎中国观众。我上车给他指着路，小六继续翘着二郎腿，老样子，一边向前开一边回过头和我聊着天，在一家朝鲜烤串城前我们停下了。 小六下了车和我一起上楼，这是从七月相识至今，我第一次看到离开三蹦子的小六，我终于明白为什么他一直要要撬着一条二郎腿炫酷的开车，他的左腿是瘸的。 我把店里所有的招牌烤串点了一遍，满满一桌子的肉，然后要了一箱啤酒。 “先说好了，今这顿饭我结账。”我对小六说。 “不行不行，凭啥啊，都说了我请你！” “行，那咱就看谁最后能清醒着出门，这会说的再潇洒，一会喝的连爹妈都不知道叫啥了也是抽自个嘴巴” “哈哈哈， 大哥，你可别逞能啊，我每天早上起了都喝两盅才出去趴活的，你能看出我酒驾吗？”小六冲我扬了扬下巴，一脸的傲娇。 “我操你爹” 我要了两个大碗，一碗差不多是半瓶啤酒，我俩谁也不服谁，比着大口吃肉，比着举起碗就一饮而尽。 我 记着半箱下肚的时候，旁边桌两个韩国人，估计是被我们大碗喝酒的架势所震慑，倒了一杯啤的过来敬酒，用蹩脚的汉语说“中国人 厉害！”小六直接抄起一瓶，用牙咬开，“我们是你们爹”低头思绪了两秒钟，“思密达！”然后咕嘟咕嘟就干了。还没等我来得及去解释两句，那两个韩国人就结 账穿衣服走了，耸的令人很无奈。 基本上这就是当晚喝酒的前两个小时中，小六所说的唯一一句话。 我确实喝不过小六，七瓶下肚之后，酒就卡到嗓子眼了，再喝一口，我就有可能像喷泉一样吐小六一脸，他也多了，看刚才的豪侠之气，我真怕万一吐到他身上他会抄起酒瓶子揍我。 他继续大口吃肉大碗喝酒，我抽着烟，养精蓄锐，等着……结账。 在我彻底甘拜下风的一小时后，小六继续神勇着。我拿起根烟点燃后送到他嘴里时，他突然就像狼嚎一样开始哇哇大哭，我被吓了一个激灵，赶忙拿纸巾递给他，小六挥挥手，继续狠狠的吃肉，就那么泪流满面的大口吃着肉。 “大哥，我以后送不了你了，家里媳妇跟别人跑了，我怪不了她，我没出息，出来打工三年多也没能混个人样，儿子的死对她打击也很大，我知道她恨我，恨我没能治好儿子。” “我俩从小在山里长大，真是青梅竹马的，她可是我们村里的村花，好看着呢！跟了我真是委屈，你说我有啥值得她跟的？听说她现在跟的那个人是我们那片最有钱的人家，好事啊！” “我娘年纪大了，一下给气病了，我得回去陪她，让她好起来。我再没出息，我也得让我娘好起来，你说是不是？” “是” 我干了一碗。 小六笑了，“大哥原来你还能喝啊，能不能实在点”小六的眼泪一直在淌，这是我第一次在眼前看着一个人，边哭边笑，还他妈一边大口的吃肉。 后 来小六再也没提这些事，他开始跟我唠嗑扯淡，他讲了很多他们三蹦子兄弟的故事，讲他们为了能给家里多汇钱三个人挤在十平米的底下室里，讲他们离家多年，半 年集体攒钱装回大款，去燕郊找小姐的经历。讲他们为了生活，做的那些偶尔有失道德的疯狂事，讲他们每晚睡觉前都会一起唱首家乡的歌。 我听的津津有味，沉浸在他的话语里，比起平常朋友和同事讲的那些前天谁赚大钱升职了，昨天谁终于历经艰辛实现梦想，今天谁多么励志多么辉煌，更有趣。有趣的不是小六的讲述方式，而是他讲的每一句话，都太过真实，真实的更像生活，真实的，这才是人生。 生活真的有那么多光鲜和靓丽吗，生活真的可以一如海面升起的太阳让人向往和着迷吗，生活真的是有那么多苦尽甘来的实现和获得吗。 与其说人生是为了实现和获得，不如坦诚的说，人生不过是不断地失去和承受。 生活就是这样，不如诗。 那晚我背着小六离开饭店，我走的兢兢战战，努力平稳脚步，真怕一个震荡他就吐我一头的啤酒加肉。小六好样的，一直没吐，就是一边撕着我的耳朵一边喊驾，我突然想到，他不过和我一个年纪，大学刚毕业的年龄，还是一个大男孩啊。 背他回去的路上，小六一直在笑，笑的酣畅淋漓，我问他，你到底在笑个蛋，“想让我哭？去你娘的吧！”然后又是一阵大笑。 那笑声震耳欲聋，在夜晚的空气中肆意飘荡，简直和战场上斩杀百敌的英雄一样荡气回肠。 对，小六是个英雄，生活里的真英雄。 愿他永远把酒当歌，以笑代哭，愿他永远这般倔强藐视人生一切的不如意。 小六走后，我在公司附近租了房子，再也不坐三蹦子了，以此纪念我的小六。题外话 爷爷的妈妈，我的太奶奶，今年99岁，前年我回老家看望她时，她老远就兴奋的喊我“是豪豪吗，豪豪回来看我了”我跑过去像对待一个小女孩一样把她搂进怀里。 一个大半身埋进土里的人，一个全身刻满皱纹像一棵枯朽老树的人，却依然耳聪目明头脑清晰，饿了的时候能用一口假牙啃半只烧鸡，太奶奶才是我的女神。 爷爷和我说，太奶奶是个了不起的人，她和在那个裹脚年代长大的人并无二异，了不起的是她一直活到了今天。她经历了那个时代每个人都要经历过的饥荒、混乱、文革，经历了这个世上每一个人都要经历的苦难、不如意、病痛、离别，和生活与岁月带给每个人的摧枯拉朽与孤单寂寥。 她至今依然站立在这片土地上，她没有成功和荣耀，没有策马红尘的青春，没有为了人生理想的一路奋战。但她从来没有被生活打败过，她没能从岁月那里获得些什么，可岁月也从未能从她身上剥夺摧毁掉什么。 她是一个真实的，平凡的，像这个世界上被无数人所鄙夷的又和无数人一样的为了活着而生活的人。 可她是个了不起的人，是我心里的女神。 太奶奶没有所谓的人生哲学和长寿秘诀，活了将近百岁走过了一个世纪的人，每一句对生命的感慨都是经过时间验证的深刻，但她一如过去从不言感悟也不语遗恨。我从来无法从她那里获得些指点或和经验之谈，我俩一块的时候干的最多的事就是一起吃烧鸡。 关于她的人生过往，我从爷爷那里听到过一二。太爷爷在世时是那个年代的财主，生意做的很大，家里有两辆马车，大土豪。这当然一定是要被革命的，被大伙深恶痛 绝的。嫁鸡随鸡嫁狗随狗，太奶奶只是命运的跟随者。命运弄人，太爷爷不到四十就离世了，不到三十的太奶奶成为了对丈夫阶级仇恨的转移者，批判的承载者。唾 弃、咒骂、侮辱，这些基本上构成了她的后半生。她并没有悲愤和怨恨，像一块钟表一样继续生活，只是在每一年太爷爷的祭日时，她都会做上一锅肉，无论贫穷或 富裕，然后一个人端起一碗肉坐在家里的门前，一边流泪痛哭，一边大口吃肉。 “流着眼泪也要吃下肉。”这就是太奶奶的这一辈子的人生哲学吧。 10月末，我失恋了，一失还是七年的恋，一时间整个人像被掏空了一样的空白，你说伤心和难过吧，也还真一时没切肤感受到，只是无论走到哪，做什么事，心里都像被挖了个窟窿。 接着，由于失恋引起的一系列失眠、情绪失控、精神涣散，在工作中处处挨骂，被领导提出辞职的邀请。 伤心 痛苦 委屈吗？当然，每天晚上都要把自己灌醉才能入睡。 可是这些又真的算事吗？ 我们每个人都像漂浮在海面上的一叶孤舟，被大浪翻滚，被海水吞没，难得的风平浪静，还要苦闷与孤单无助。可这片汪洋上，着实漂泊着太多和你我一样的孤舟破船。 就像老水手会嘲笑新水手的惊愕和慌乱，有一天，你也会因想起过去自己的不知所措而谈笑风生。 你我他都明白，每往前走一步，每长大或苍老一岁，那些得到的，其实永远无法抵消所失去的。人也许真的会在某一岁开始停止前进，不再变的更聪明，更靓丽，不再变的更睿智，更才学。但是有一件事，是这世上的每一个人都在永远、不断、直到死去也在成长和变强的，那就是承受力。 在每一个光景和年岁前，你回想过去的自己，过去五年、一年、半年前，你都会觉得那时的自己真是幼稚、软弱、不堪一击，和傻逼。可是如果今天可以时光轮回，让 过去的那一幕幕重蹈覆辙，你一定不会再像当初了，不会再像当初那般撕心裂肺，那般苦痛挣扎，那般的以为自己活不下去了。 人的心脏，永远在变大，心里装的回忆和故事永远在丰盈，心房的厚度永远在增加，心窝里那个曾经最脆弱，恨不得一针致命的地方，其实也在越来越坚硬。 你哭、你醉、你厌世，你迷茫、你堕落、你绝望，可你否认不了一点，你就是在变的越来越坚强。 那些过去能打倒你的再也无法打倒你，那些未来能击倒你的，有一天也会对你束手无策，毫发无伤。 有时就觉得吧，哪有那么多的辉煌和荣耀，快乐对于人来说总是短暂的，悲痛才是永久的，才是让人铭记的。永远在受挫，在告别，在彷徨，在孤单。 你说人活着是为了实现和获得吗？ 不是，人在世上每活一天都是在失去和承受。 你说人是靠理想和憧憬活着吗？不是，人是靠坚强活着。 明明懂得很多大道理可当自己深陷其中时又迷茫脆弱的像个孩童，生活周遭的一切就是如此，发生在别人身上时你总会感到太过残酷和无情。 可当它落到你头上时，无论如何，你也会走下去。 就像吃到美味的食物总找不出恰到的语言来描述，在真实的生活面前，再多语言也是苍白和无力的。 你，我，他，无论此刻在经历着什么，无论过去遭遇过什么。 承受一切，然后活到最后，那就足够闪耀，那就是荡气回肠的真英雄。 伟大的人都有着相同的伟大，可平凡的人，一定都有着不同的伟大。 生活啊，不过如此，流着眼泪也要吃下肉。（文/陈亚豪） 原文地址：http://www.timetimetime.net/yuedu/22569.html Author 渡世白玉Posted on 2013年12月5日2015年8月21日Categories 分享文字, 文字飘香Tags 失去, 得到, 理想, 生活"
