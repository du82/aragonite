full_description = "当我每敲击一行代码时，我会想到的（稍微夸张了一些） 当我们埋头赶项目时，当你忙忙碌碌写代码时，你是否想到了？ 当你每敲击一行代码时，你最好能想到一下事宜。 如有不妥之处，请大家指正。 您若是在程序员岗位，或者从事与程序相关的工作，请你仔细阅读以下内容。 Continue reading “当我每敲击一行代码时，我会想到的（稍微夸张了一些）” Author 渡世白玉Posted on 2013年11月21日2015年8月21日Categories 编程设计Tags 代码, 程序员Leave a comment on 当我每敲击一行代码时，我会想到的（稍微夸张了一些） 从假装在腾讯，到真的360 —— 一个应届准PM的独白（面经干货） 原文地址：http://andy360.blog.51cto.com/8208325/1325411 作者：RandyChenJunBin 磕磕碰碰，从大三第二学期开始找实习到现在签下360，已时过半年。改版过的10几份简历，多少可以铭记这段岁月的点滴痕迹。我从不敢说自己是大神，但一直在假装。如今，尘埃落定，我想把自己的的点滴心得写出来，与大家分享，权当共同学习，一起进步。（PS：一路走来，我只投产品岗位，所以本文所谈难免有所局限，技术大神请选择性跳读。谢谢。） Continue reading “从假装在腾讯，到真的360 —— 一个应届准PM的独白（面经干货）” Author 渡世白玉Posted on 2013年11月21日2015年8月21日Categories 其它, 分享文字Tags IT经历, 工作, 简历, 面试Leave a comment on 从假装在腾讯，到真的360 —— 一个应届准PM的独白（面经干货）"
