title = "To Me，To You | 渡世白玉"
description = "很多时候，我们或许觉得经历过流年似水，人生聚散匆匆，自己已经有足够的勇气去承担岁月留给我们的沧桑，可是唯独忘了，我们都是岁月的奴，信誓旦旦的诺言也会被时光的泪水打湿。"
full_description = "To Me，To You 流年分明安然无恙，岁月亦是静然流淌。但生命中总会有那么一个人，愿意用他的深爱，承受沧海桑田的等待，只为今生与你相见，为你低眉含笑，为你屈尊做一切不可能的事，陪你走到天荒地老的尽头。 慢一些，你想要的你想遇见的，岁月都会赠予你。 清风明月相伴，一个人行走在红尘陌上，想必是极好的，只是，前方的路还有多远，前面又有怎样的人把你等待，总是未知的，但是，你只有走下去，才会知道人生是公平的，你所失去的一切，命运终将会补偿。 从来，爱不知道自己的深度。直到别离的时刻。 很多时候，我们或许觉得经历过流年似水，人生聚散匆匆，自己已经有足够的勇气去承担岁月留给我们的沧桑，可是唯独忘了，我们都是岁月的奴，信誓旦旦的诺言也会被时光的泪水打湿。 我 现在在等一个人，他会比我理智，比我爱我，比我懂我，他不会对我说甜言蜜语，可他会有责备的语气，他不会说海誓山盟，可他会把心给我，那种我能看到的真实 的心，他不会解释，他做的每件事都不需要解释，他会软弱，只在我面前软弱，软弱到让我心疼，他会抱怨我爱多想，这个人便是我爱人，而我还在等他。 如果别人是真的想给你，直接会塞你手里，根本不会问你要不要。 每个人都在奋不顾身，都在加倍努力，你没有理由一边委屈一边抱怨人世寒冷。给自己多一点疼爱，对生活多一点信心。只要今天比昨天好，就是前行路上最大的幸运。 青春是你奋斗的资本，年轻不是你堕落的理由。 期望太大，常常会失望；告诉自己不要有期望，反而会有惊喜。于是渐渐学懂了，对别人，尤其是所爱的人，并不是不要抱有任何期望，而是不要去执着任何期望。所有的期望终归是一厢情愿的，却往往闹得两败俱伤。 很 久了，我们不说话，已很久了。不说，那就不说吧！我知道这样的开始，就已意味着什么了。没有放不下的东西，伤心了自然会放下。等到某月某日，你我变成陌生 人，那就什么都没有了。那时候我会对你说 ：祝你幸福！这或许很乏味，却是我对你感情的全部倾注。你带着这句话，离开吧。 低头不是认输，是要看清自己的路。 仰头不是骄傲，是想看看自己的天空。 一个人最好的模样大概是平静一点，坦然接受自己所有的弱点，不再因为别人过得好而焦虑，在没有人看得到你的时候依旧能保持节奏。这样或许会走得很慢，但会走的比谁都坚实，不用害怕一脚踩空，也不用害怕走到别人的轨道上去。 世界上最动人的承诺，不是“我爱你”，而是在你需要的时候,Ta说 “I have always been with you” 。 就 算全世界都否定你，你也要相信你自己。不去想别人的看法，旁人的话不过是阳光里的尘埃，下一秒就被风吹走。这是你的生活，没有人能插足，除了你自己，谁都 不重要。悲伤，尽情哭得狼狈，泪干后，仰头笑得仍然灿烂。一往直前，激发生命所有的热情。年轻不怕跌倒，永远地，让自己活的很漂亮! 时间夺去了我们轻狂的眼神，却给了我们嘴角上扬的资本。 在一回首间，才忽然发现，原来，我一生的种种努力，不过只为了周遭的人对我满意而已。为了博得他人的称许与微笑，我战战兢兢地将自己套入所有的模式所有的桎梏。走到途中才忽然发现，我只剩下一副模糊的面目，和一条不能回头的路。 一个人在家看电视并不算寂寞，苍白地坐在话不投机人群之中，才真正凄清。 不 管，你有多么真诚，遇到怀疑你的人，你就是谎言。不管，你有多么单纯，遇到复杂的人，你就是有心计。不管，你有多么的天真，遇到现实的人，你就是笑话。不 管，你多么专业，遇到不懂的人，你就是空白。所以，不要太在乎别人对你的评价，你需要的只是，做最好的自己。我就是我！独一无二！ 可进可出，若即若离，可爱可怨，可聚而不会散，才是最天长地久的一种好朋友。 曾 经认为，沧海桑田，总会有人相随，我不会孤单，不要寂寞。直到，花不语，水空流，年年拼得为花愁。直到，物是人非事事休，欲语泪先流，却载不动那许多愁。 我独上高楼，望尽天涯路。没有你在身旁，阳光依在，只是少了那份温暖。天空本是种风景，可是遇见你之后，它变成了一种心情。 Author 渡世白玉Posted on 2014年6月16日2015年8月21日Categories 分享文字, 文字飘香Tags 时光, 自己"
