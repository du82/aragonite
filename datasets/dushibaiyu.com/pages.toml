full_description = 'Qt信号槽的一些事 注：此文是站在Qt5的角度说的，对于Qt4部分是不适用的。 1.先说Qt信号槽的几种连接方式和执行方式。 1）Qt信号槽给出了五种连接方式： Qt::AutoConnection 0 自动连接：默认的方式。信号发出的线程和糟的对象在一个线程的时候相当于：DirectConnection， 如果是在不同线程，则相当于QueuedConnection Qt::DirectConnection 1 直接连接：相当于直接调用槽函数，但是当信号发出的线程和槽的对象不再一个线程的时候，则槽函数是在发出的信号中执行的。 Qt::QueuedConnection 2 队列连接：内部通过postEvent实现的。不是实时调用的，槽函数永远在槽函数对象所在的线程中执行。如果信号参数是引用类型，则会另外复制一份的。线程安全的。 Qt::BlockingQueuedConnection 3 阻塞连接：此连接方式只能用于信号发出的线程（一般是先好对象的线程） 和 槽函数的对象不再一个线程中才能用。通过信号量+postEvent实现的。不是实时调用的，槽函数永远在槽函数对象所在的线程中执行。但是发出信号后，当前线程会阻塞，等待槽函数执行完毕后才继续执行。 Qt::UniqueConnection 0x80 防止重复连接。如果当前信号和槽已经连接过了，就不再连接了。 Continue reading “Qt信号槽的一些事” Author 渡世白玉Posted on 2015年7月29日2015年8月21日Categories C/C++, Qt, 编程设计Tags qt, 信号槽, 同步, 异步, 线程25 Comments on Qt信号槽的一些事 C/C++取出变量的每一位的值 以前写程序最多也只是字节级别操作，用char和memcpy进行一系列内存操作。此次一个sdk，其状态值直接是每位一个标示，所以需要取出每位进行操作。当然CPP也有丰富的位运算操作，但是虽然也学过，知道意思，但是实际却几乎没用过。这次只能动用它了。 第一种方法：思路就是全部用位与，这样就能取出来每一位是否为1。直接上代码吧，反正看了也就理解了。 uint j = 1; for (uint k = 0;k < sizeof(uint) * 8;(j = j<<1),k++){ std::cout << "The " << k << " bit is :" << (i&j) << std::endl; } 这是取一个无符号整数的， Continue reading “C/C++取出变量的每一位的值” Author 渡世白玉Posted on 2015年7月20日2015年8月21日Categories C/C++, 编程设计Tags 位运算, 取值4 Comments on C/C++取出变量的每一位的值'
