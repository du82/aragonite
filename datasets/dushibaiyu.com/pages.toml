full_description = "为QNetworkAccessManager添加超时提醒 在做更新，在测试异常的时候，在下载过程中，发现如果直接系统禁用了网络，会报错误，可以捕获。但是如果是第三方软件限制程序联网，问题来了。 程序会一直在那里等待，没有异常，也不发送QNetworkAccessManager::finsh和QNetworkReply::error和QNetworkReply::finsh信号。 所以动念头为下载加个超时，但是QNetworkAccessManager，QNetworkReply和QNetworkRequest都没有相关的设置函数。其实仔细想一下，也没有办法直接提供超时，因为下载的文件有大有小，网络有快有慢，什么才算超时呢。 Continue reading “为QNetworkAccessManager添加超时提醒” Author 渡世白玉Posted on 2014年10月27日2015年8月21日Categories C/C++, Qt, 编程设计Tags QNetworkAccessManager, TimeOut, 下载, 超时25 Comments on 为QNetworkAccessManager添加超时提醒 QRunInfo: Qt 系统运行信息获取的一些简单封装 QRunInfo是从Qt-Installer-Framework中提取的一些系统验证和运行信息获取的一些Qt封装。我只是为部分接口整理和组织下代码。代码基于LGPL2.1和LGPL3.0协议。 QRunInfo 地址：https://github.com/dushibaiyu/QRunInfo 其中涉及Qt的core模块，gui和widget模块（主要是AdminAuthorization）有用QWidget。 Continue reading “QRunInfo: Qt 系统运行信息获取的一些简单封装” Author 渡世白玉Posted on 2014年10月24日2015年8月21日Categories C/C++, Qt, 编程设计Tags QRunInfo, qt, 系统信息9 Comments on QRunInfo: Qt 系统运行信息获取的一些简单封装 我害怕找不到一种自己喜欢的方式度过人生 Ps：人最难的就是直面人生，直面生活。有时看似简单，人人可做，却又恰恰是最难，谁也几乎都没做到。我也一直在探索，也曾豪情万丈，也曾想不存在也是最好，只是一直未曾找到结果。我一直还没认清自己的生活，有时，不！是大多数时候也在逃避自己的生活。至于热爱生活，更是做不到的。为什么活着，你活着所之为何，你也曾探寻，但未曾找到答案。也曾逃避不想，但是静下面对自己却又避无可避。今日，精读上看到此文，认真读了几遍，若有所得，却有因本人愚钝，无法言语描清，遂全文转载过来。 下面正文： Continue reading “我害怕找不到一种自己喜欢的方式度过人生” Author 渡世白玉Posted on 2014年10月22日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 意义, 生活7 Comments on 我害怕找不到一种自己喜欢的方式度过人生"
