title = "鲍鹏山新说《水浒》经典语录精选之鲁智深 | 渡世白玉"
description = "① 搭救金翠莲 381、既然《水浒传》的作者不认真，我们又何苦那么认真，他就是一部小说，只要其中的人物、事件符合艺术真实，不影响我们欣赏，就可以了。 382、鲁达是有法眼的，能一眼识出英雄。 383、鲁达有很多优秀品质，对人作判断和评价时，不看外在的东西，不势利，不看体制中的地位，注重内在的品质和才华，这是鲁达众多优秀品质中的一种。要知道，大多数人做不到这一点啊。 384、性格上，鲁达、史进是属于一个大类：遇事敢作，作后敢当；遇好人敢救，遇坏蛋敢杀；粗糙爽利，勇直英雄。 385、古人说，唯大英雄能本色，是真名士自风流。我也模仿一句：小人计较庸人贪，是大英雄真舍得。 386、嗨，人生在世，江湖也好，官场也好，人家给面子，就一定要这个面子，不能给你脸你不要脸。 387、英雄也可以失路，好汉也可以落魄。但是，人可以穷困，但不可以潦倒。穷困，可能有各种客观原因，有命运；潦倒，就是主观上的败落了。一个人潦倒了，就是精神溃散了，就是气质委琐了。 388、唉，多少英雄，被衣饭所困！被衣饭逼成了庸庸碌碌的凡夫俗子！读这样的文字，真让人下泪！多少英雄齐下泪，一生困死衣饭中！ 389、毛泽东说，不打破坛坛罐罐，就不能干革命。不冲破衣饭的牢笼，我们就终身是个衣饭囚徒，就是一个移动的饭碗！ 390、事实上，一种生活态度，往往决定了一种生活态度，一种生活态度，也就塑造出一种性格。整天锱铢必较，分毫必争，一丝难舍，实足以坏掉一个人的境界，坏掉一个人的气质。 391、本事可以有大小。大问题在于境界的高低。如果我们让一种生活状态限定了我们的境界，那就很糟糕了。 392、一个整天操心自己的衣饭的人，怎么可能有境界呢？怎么可能是英雄，是好汉呢？ 393、如果说心地厚实，体格宽大的鲁达，从里到外都体现一个“大”字，他李忠就是从言语到行为，从思想到气质，典型的一个“小”字。 394、鲁达，遇到事了。他遇到了不平事。鲁达，遇到人了。他遇到了这样的人：受尽屈辱与压迫的可怜人和不明道德欺压良善的可恨人。他将如何对待呢？当然，这是别人的事。他完全可以袖手旁观。——实际上，观都不必，他可以闭上眼，做他的提辖，每日到茶馆品他的茶，到酒楼喝他的酒，和他的新朋老友，较量枪法，谈天说地，说些大快人心的事。大多数人不都这样做的吗？ 395、在鲁达眼里，这种人，一刻也不该活在世上，这种事，一刻也不该存在！正派正直的人，绝不能和这样的人、这样的事和平共处！ 396、鲁达是舒张的，所以他看不惯缩手缩脚不爽利的人；鲁达是慷慨的，所以，他看不惯悭吝小气的人；鲁达甚至也是善解人意的人。 397、就是一件小事，不同的人，被分别出来。史进十两，李忠二两，这个区别，就是境界的斤两。鲁达收下了史进的银子，就是接受了史进，鲁达丢还了李忠的二两银子，也就拒绝了他的人。他的二两银子没有与鲁达的五两、史进的十两凑数，他本人也就被鲁达排斥在他的兄弟之外。所以，我们不能老是要别人理解自己，假如像李忠那样，悭吝小气，却又希望别人理解，但是，当别人理解你时，也就看扁你了，至少是看轻了自己，又哪里值得呢？所以，做人，应该是这样：给予别人的，尽量多理解；从别人那里获得的，应该敬重。 ② 拳打镇关西 398、大踏步，地动山摇，大踏步，堂堂正正，大踏步，体格宽大，大踏步，心地厚实！大踏步，自大自信！大踏步走来的这个人，让恶人心惊！大踏步走来的这个人，让好人心安！ 399、鲁达为人时，何等用心啊，因为用心了，所以才有此细心和耐心。为他筹款，帮他离开，等他走远，这是鲁达救人的三步曲。——救人救彻！ 400、但是他生气了。很生气，我们知道，鲁达一生气，后果很严重。一个人不会生气怎么行啊。不生气就没有生气啊。人人都不生气，一个民族就没有生气。就是任人宰割的奴隶之邦。这种愤怒，就是我们常常说的道德愤怒。具有道德愤怒的人，是高贵的人，具有高贵的品格。有了这种愤怒，邪恶就不会高枕无忧，就不会再肆虐之后，毫无顾忌！ 401、什么叫喜剧？喜剧就是把丑陋的东西撕破给人们看。这有些像安徒生的童话《皇帝的新装》。当所有的人都对事实视而不见，并对并不存在的所谓皇帝的新装大加赞赏时，只有一个内心中无所畏惧无所惭愧的孩子，说出了真相：“可是他什么衣服也没有穿呀！”当真相被大家一起掩盖时，这个世界是可悲的，因为，这个世界一定是被暴力统治着。这种暴力或者来自皇帝，或者来自郑屠这样的市井恶霸。而当假象被撕破时，这个世界就会爆发出大笑：就像一首诗写的：“魔鬼的宫殿在笑声中动摇。”是的，有时候，笑声就是最好的武器。 402、他有身份啦，他要自立一套体制，然后自居最高端。这样的人，有机会的话，一定会制造一件龙袍，自己穿上的。权力欲几乎可以说是人性中最丑陋的部分，也是给人类带来最多伤害和悲剧的东西。而且，往往越是邪恶的人，越有权力欲。 ③ 英雄做和尚 403、什么是真正的英雄好汉？就是把别人的不幸当作自己的不幸的人。就是把别人的仇人当作自己的仇人的人，就是把这个世道的不平当作自己的不平的人！正义会迟到，但正义最终会赶到。报应会晚到，但报应终会到。鲁达的拳头，就是正义，就是报应，到了！ 404、实际上，《水浒传》的创作，从社会心理上讲，就是一种压抑的发泄，是社会被长期压抑后的一种文学发泄，是人民苦闷的象征。从这一角度，我们可以理解，为什么《水浒传》的某些场景写得那么血腥，那么残忍，这是人民对封建统治的仇恨造成的。 405、鲁达的拳头，让我们看出了水浒英雄的真面目，真性情，真道德。鲁达的拳头，不仅打杀了仇人，而且几乎是我们心灵的按摩！他的拳头，打出了我们的快意，打出了我们心中的恨，心中的怨，心中的冤，心中的仇。打出了正义的力量，道德的力量，让我们相信，这个世界，还不全是黑暗，恶人也不是全无报应，好人也能等到公正。这个世界，只要有郑屠，就必须有鲁达的拳头！ 406、实际上，镇关西这样的人，在我们的生活中，是对我们生存环境的毒害，是对我们良心的蔑视，是对正义的亵渎，是对道德的嘲弄，还是对法律的调戏。生活中有没有这种人，不用怕，可怕的是，我们的容忍与沉默。我们若是容忍了他，就是降低了我们的人格，我们若是和这样的人和平共处，就是我们自身的耻辱。 407、这个时候，如果有人问，这个世界上最可爱的人是谁？我们一定会说，是鲁达。如果有人问，这个世界上，最可爱的东西是什么？我们一定会说：鲁达的拳头！着就是世道人心！着就是一切良善终获公正，一切邪恶终受报应的最终原因和保障！而文学，就是唤起我们的良知。 408、他哪里是能周密地考虑一件事的方方面面的人呢？他只是率性而动，说白了，他也就是一个莽撞人。但这个世界上，少不了莽撞人。都是算得准把得牢的精细人精明人，这世界上的好多事就没人做了。是莽撞人，做了很多人想做又不敢做不愿做的事。 409、损害自己，成全所为的正义之事，做自己不愿意的事，救济他人的急难。这就是侠义之士的侠义行为。鲁达，就是这样的侠义之士。 410、什么叫讨出身？就是在体制内找一份有发展前途的工作。相当于在计划经济时代，找一个全民所有制的事业单位的工作，当干部。什么叫讨生活？相当于在计划经济时代，丢掉了工作，不用说当干部了，就连大集体合同制工人的身份都没有了，自己谋生去。一个是待业青年，一个是无业游民。现在，一出场的鲁达，就碰到了这两个不同类型的人。这两个人却又恰恰代表了人生中的一些无奈，一些尴尬，一些艰辛，一些窘迫。 411、鲁达从来没有考虑过自己的生计，他自己的事，由命运定，他只定别人的命运。他关心别人的生活，却不想自己的生活。他为了别人的生活，往往毁了自己的生活。 412、鲁达的可贵就在这里：这世界，人人要讨生活，如李忠；人人想讨出身，如史进。他呢？有了不错的生活，有了体面的出身，但他并不因此而沾沾自喜，并不因此而志骄意满，甚至并不因此而小心翼翼，只求保住这样的舒适体面的生活，甚至不惜委曲求全同流合污。 413、有一种人，他没得到职位时，生怕得不到，就孜孜以求，甚至不择手段。已经得到后，又生怕失掉，就小心翼翼，人格委琐。假如一个人老怕失掉职位，那就无论什么事都干出来了。事实上呢，人生往往就处于这样的两个阶段：患得阶段与患失阶段。 414、梁山好汉有几个干净人？只有一个人，那是真正的干干净净，清清白白，他就是鲁达。首先他从来没有龌龊地生活过，没有忍气吞声过，没有唯唯诺诺过。他不是愿意委屈自己，恰恰相反，他为了伸张正义，往往把自己弄得十分委屈。他只是不愿意看到正义被委屈，他认为这个世界应该有正道，应该有直道，他要做一个正人，做一个直人，以保护正道，保护直道。 415、过日子需要的就是这种精细的、实用的、一丝不苟的周到与计划，而鲁达则往往不耐烦于这些琐碎的考量于算计，往往率意而行。 416、在中国，常常有一些人因为走投无路而做和尚，或一败涂地，无可收拾，万念俱灰而做和尚。所以，我们对鲁达由提辖而做了和尚，总有一种心有戚戚的感受。但鲁达倒未必有这样的想法，当时做提辖，现在做和尚，不都是在做人么？变的是外在的身份，不变的是为人的赤子之心，做提辖时，鲁达未必有自豪感，尤其是一定无沾沾自喜感，所以，他决无患得患失的心态；现在做和尚，他何尝有今不如昔之感？在他看来，做提辖也好，做和尚也好，快活就好。 ④ 另类和尚 417、说白了，若说坎坷，人生何处不坎坷？哪一条道儿不艰难？若说顺畅，那也是条条大路通罗马，行行都能出状元，和尚也是人做的，并且往往是好人做的。玄奘不就是好人么？和尚还往往是一些猛人做的，朱元璋不就做过和尚么？可见，做和尚，不仅可以成佛成祖，还可以成王成帝。明白了这个道理，也就是智慧。鲁达鲁达，粗鲁通达，虽然粗鲁，然而通达。什么叫达？达就是大路朝天，就是四通八达，无有阻碍。明白这个道理的，往往不是精细人、算计人，恰恰是鲁莽人，是粗心大意人。所以，“鲁达”这个名字好，暗含着深刻的道理和智慧。送这么一个好名字给他，作者施耐庵是真的喜欢他笔下的这个人物，或者说，就是用这个任务来表达他对生活的认识和领悟吧。鲁达对自己的人生，无那么多孜孜以求，无那么多的欲望，所以，他天机深，人又智慧，且天机深厚，可不就是智深么？鲁达就是智深，愚鲁通达就是智慧深厚。鲁达的人生告诉我们一个道理，有一种智慧来自性格，有一种性格即是智慧。所以，养性即是养智，养智就要养性。 418、这个世界上，干什么事，即要有一个什么样子却是一般俗人的见解，这种见解害了多少真英雄，真才子？多少人就是因为缺了一个模样而被弃掷在一边被排挤在圈子之外？着模样，有些时候就是长相，有些时候就是规矩、风格，有些时候，则体现为诸如文凭啦，职位啦，头衔啦等等。 419、你看，同一个人，在不同的眼光中，长相的差距有多大啊。可见，面试时，外在形象多么重要啊。 420、鲁智深的个性里，确实有一种魅力，使人几乎无条件地喜欢他、欣赏他。大思想家李贽，大批评家金圣叹，都被他迷倒了，成为他的骨灰级的粉丝。 421、鲁达的这一举动，使我们感慨下泪，也使我们会心而笑——下泪在于感慨命运之磨难英雄，微笑在于英雄调侃命运。 422、无聊的生活需要有趣的人物，清净枯淡的禅修之地需要鲁智深这样的热闹绚烂之人。 423、鲁达生平哪受过此等拘束与苦楚？哪里这样夹着尾巴做过人？他一直是托大的，从来没有这样装小过。 ⑤ 露出本相 424、这个老实人，既不能反抗鲁智深，也不能得罪真长老，为了衣饭不得不忍气吞声。为了衣饭，忍气吞声的，岂止他一个？茫茫人世，芸芸众生，哪个不要这样？ 425、醉酒的人无数，醉酒的原因也多种多样，其中有这样两种醉酒：借酒浇愁与借酒释放。匹夫匹妇，凡夫俗子，往往借酒浇愁。英雄豪杰，侠客义士，往往借酒释放。鲁智深不会有什么萦怀于心的东西，有了，当下就做了，做了，当下就放了，他不会隐忍，所以，也无需什么酒来浇愁，他只需要酒来助兴，帮助他释放心胸，解放自我。辛弃疾说，闲愁最苦，四五个月闲下来，鲁智深心中定也有那一份苦，那一份闷，需要酒来消解，更何况他还有那一种浩荡的意气也需要酒来点燃！"
full_description = "鲍鹏山新说《水浒》经典语录精选之鲁智深 ① 搭救金翠莲 381、既然《水浒传》的作者不认真，我们又何苦那么认真，他就是一部小说，只要其中的人物、事件符合艺术真实，不影响我们欣赏，就可以了。 382、鲁达是有法眼的，能一眼识出英雄。 383、鲁达有很多优秀品质，对人作判断和评价时，不看外在的东西，不势利，不看体制中的地位，注重内在的品质和才华，这是鲁达众多优秀品质中的一种。要知道，大多数人做不到这一点啊。 384、性格上，鲁达、史进是属于一个大类：遇事敢作，作后敢当；遇好人敢救，遇坏蛋敢杀；粗糙爽利，勇直英雄。 385、古人说，唯大英雄能本色，是真名士自风流。我也模仿一句：小人计较庸人贪，是大英雄真舍得。 386、嗨，人生在世，江湖也好，官场也好，人家给面子，就一定要这个面子，不能给你脸你不要脸。 387、英雄也可以失路，好汉也可以落魄。但是，人可以穷困，但不可以潦倒。穷困，可能有各种客观原因，有命运；潦倒，就是主观上的败落了。一个人潦倒了，就是精神溃散了，就是气质委琐了。 388、唉，多少英雄，被衣饭所困！被衣饭逼成了庸庸碌碌的凡夫俗子！读这样的文字，真让人下泪！多少英雄齐下泪，一生困死衣饭中！ 389、毛泽东说，不打破坛坛罐罐，就不能干革命。不冲破衣饭的牢笼，我们就终身是个衣饭囚徒，就是一个移动的饭碗！ 390、事实上，一种生活态度，往往决定了一种生活态度，一种生活态度，也就塑造出一种性格。整天锱铢必较，分毫必争，一丝难舍，实足以坏掉一个人的境界，坏掉一个人的气质。 391、本事可以有大小。大问题在于境界的高低。如果我们让一种生活状态限定了我们的境界，那就很糟糕了。 392、一个整天操心自己的衣饭的人，怎么可能有境界呢？怎么可能是英雄，是好汉呢？ 393、如果说心地厚实，体格宽大的鲁达，从里到外都体现一个“大”字，他李忠就是从言语到行为，从思想到气质，典型的一个“小”字。 394、鲁达，遇到事了。他遇到了不平事。鲁达，遇到人了。他遇到了这样的人：受尽屈辱与压迫的可怜人和不明道德欺压良善的可恨人。他将如何对待呢？当然，这是别人的事。他完全可以袖手旁观。——实际上，观都不必，他可以闭上眼，做他的提辖，每日到茶馆品他的茶，到酒楼喝他的酒，和他的新朋老友，较量枪法，谈天说地，说些大快人心的事。大多数人不都这样做的吗？ 395、在鲁达眼里，这种人，一刻也不该活在世上，这种事，一刻也不该存在！正派正直的人，绝不能和这样的人、这样的事和平共处！ 396、鲁达是舒张的，所以他看不惯缩手缩脚不爽利的人；鲁达是慷慨的，所以，他看不惯悭吝小气的人；鲁达甚至也是善解人意的人。 397、就是一件小事，不同的人，被分别出来。史进十两，李忠二两，这个区别，就是境界的斤两。鲁达收下了史进的银子，就是接受了史进，鲁达丢还了李忠的二两银子，也就拒绝了他的人。他的二两银子没有与鲁达的五两、史进的十两凑数，他本人也就被鲁达排斥在他的兄弟之外。所以，我们不能老是要别人理解自己，假如像李忠那样，悭吝小气，却又希望别人理解，但是，当别人理解你时，也就看扁你了，至少是看轻了自己，又哪里值得呢？所以，做人，应该是这样：给予别人的，尽量多理解；从别人那里获得的，应该敬重。 ② 拳打镇关西 398、大踏步，地动山摇，大踏步，堂堂正正，大踏步，体格宽大，大踏步，心地厚实！大踏步，自大自信！大踏步走来的这个人，让恶人心惊！大踏步走来的这个人，让好人心安！ 399、鲁达为人时，何等用心啊，因为用心了，所以才有此细心和耐心。为他筹款，帮他离开，等他走远，这是鲁达救人的三步曲。——救人救彻！ 400、但是他生气了。很生气，我们知道，鲁达一生气，后果很严重。一个人不会生气怎么行啊。不生气就没有生气啊。人人都不生气，一个民族就没有生气。就是任人宰割的奴隶之邦。这种愤怒，就是我们常常说的道德愤怒。具有道德愤怒的人，是高贵的人，具有高贵的品格。有了这种愤怒，邪恶就不会高枕无忧，就不会再肆虐之后，毫无顾忌！ 401、什么叫喜剧？喜剧就是把丑陋的东西撕破给人们看。这有些像安徒生的童话《皇帝的新装》。当所有的人都对事实视而不见，并对并不存在的所谓皇帝的新装大加赞赏时，只有一个内心中无所畏惧无所惭愧的孩子，说出了真相：“可是他什么衣服也没有穿呀！”当真相被大家一起掩盖时，这个世界是可悲的，因为，这个世界一定是被暴力统治着。这种暴力或者来自皇帝，或者来自郑屠这样的市井恶霸。而当假象被撕破时，这个世界就会爆发出大笑：就像一首诗写的：“魔鬼的宫殿在笑声中动摇。”是的，有时候，笑声就是最好的武器。 402、他有身份啦，他要自立一套体制，然后自居最高端。这样的人，有机会的话，一定会制造一件龙袍，自己穿上的。权力欲几乎可以说是人性中最丑陋的部分，也是给人类带来最多伤害和悲剧的东西。而且，往往越是邪恶的人，越有权力欲。 ③ 英雄做和尚 403、什么是真正的英雄好汉？就是把别人的不幸当作自己的不幸的人。就是把别人的仇人当作自己的仇人的人，就是把这个世道的不平当作自己的不平的人！正义会迟到，但正义最终会赶到。报应会晚到，但报应终会到。鲁达的拳头，就是正义，就是报应，到了！ 404、实际上，《水浒传》的创作，从社会心理上讲，就是一种压抑的发泄，是社会被长期压抑后的一种文学发泄，是人民苦闷的象征。从这一角度，我们可以理解，为什么《水浒传》的某些场景写得那么血腥，那么残忍，这是人民对封建统治的仇恨造成的。 405、鲁达的拳头，让我们看出了水浒英雄的真面目，真性情，真道德。鲁达的拳头，不仅打杀了仇人，而且几乎是我们心灵的按摩！他的拳头，打出了我们的快意，打出了我们心中的恨，心中的怨，心中的冤，心中的仇。打出了正义的力量，道德的力量，让我们相信，这个世界，还不全是黑暗，恶人也不是全无报应，好人也能等到公正。这个世界，只要有郑屠，就必须有鲁达的拳头！ 406、实际上，镇关西这样的人，在我们的生活中，是对我们生存环境的毒害，是对我们良心的蔑视，是对正义的亵渎，是对道德的嘲弄，还是对法律的调戏。生活中有没有这种人，不用怕，可怕的是，我们的容忍与沉默。我们若是容忍了他，就是降低了我们的人格，我们若是和这样的人和平共处，就是我们自身的耻辱。 407、这个时候，如果有人问，这个世界上最可爱的人是谁？我们一定会说，是鲁达。如果有人问，这个世界上，最可爱的东西是什么？我们一定会说：鲁达的拳头！着就是世道人心！着就是一切良善终获公正，一切邪恶终受报应的最终原因和保障！而文学，就是唤起我们的良知。 408、他哪里是能周密地考虑一件事的方方面面的人呢？他只是率性而动，说白了，他也就是一个莽撞人。但这个世界上，少不了莽撞人。都是算得准把得牢的精细人精明人，这世界上的好多事就没人做了。是莽撞人，做了很多人想做又不敢做不愿做的事。 409、损害自己，成全所为的正义之事，做自己不愿意的事，救济他人的急难。这就是侠义之士的侠义行为。鲁达，就是这样的侠义之士。 410、什么叫讨出身？就是在体制内找一份有发展前途的工作。相当于在计划经济时代，找一个全民所有制的事业单位的工作，当干部。什么叫讨生活？相当于在计划经济时代，丢掉了工作，不用说当干部了，就连大集体合同制工人的身份都没有了，自己谋生去。一个是待业青年，一个是无业游民。现在，一出场的鲁达，就碰到了这两个不同类型的人。这两个人却又恰恰代表了人生中的一些无奈，一些尴尬，一些艰辛，一些窘迫。 411、鲁达从来没有考虑过自己的生计，他自己的事，由命运定，他只定别人的命运。他关心别人的生活，却不想自己的生活。他为了别人的生活，往往毁了自己的生活。 412、鲁达的可贵就在这里：这世界，人人要讨生活，如李忠；人人想讨出身，如史进。他呢？有了不错的生活，有了体面的出身，但他并不因此而沾沾自喜，并不因此而志骄意满，甚至并不因此而小心翼翼，只求保住这样的舒适体面的生活，甚至不惜委曲求全同流合污。 413、有一种人，他没得到职位时，生怕得不到，就孜孜以求，甚至不择手段。已经得到后，又生怕失掉，就小心翼翼，人格委琐。假如一个人老怕失掉职位，那就无论什么事都干出来了。事实上呢，人生往往就处于这样的两个阶段：患得阶段与患失阶段。 414、梁山好汉有几个干净人？只有一个人，那是真正的干干净净，清清白白，他就是鲁达。首先他从来没有龌龊地生活过，没有忍气吞声过，没有唯唯诺诺过。他不是愿意委屈自己，恰恰相反，他为了伸张正义，往往把自己弄得十分委屈。他只是不愿意看到正义被委屈，他认为这个世界应该有正道，应该有直道，他要做一个正人，做一个直人，以保护正道，保护直道。 415、过日子需要的就是这种精细的、实用的、一丝不苟的周到与计划，而鲁达则往往不耐烦于这些琐碎的考量于算计，往往率意而行。 416、在中国，常常有一些人因为走投无路而做和尚，或一败涂地，无可收拾，万念俱灰而做和尚。所以，我们对鲁达由提辖而做了和尚，总有一种心有戚戚的感受。但鲁达倒未必有这样的想法，当时做提辖，现在做和尚，不都是在做人么？变的是外在的身份，不变的是为人的赤子之心，做提辖时，鲁达未必有自豪感，尤其是一定无沾沾自喜感，所以，他决无患得患失的心态；现在做和尚，他何尝有今不如昔之感？在他看来，做提辖也好，做和尚也好，快活就好。 ④ 另类和尚 417、说白了，若说坎坷，人生何处不坎坷？哪一条道儿不艰难？若说顺畅，那也是条条大路通罗马，行行都能出状元，和尚也是人做的，并且往往是好人做的。玄奘不就是好人么？和尚还往往是一些猛人做的，朱元璋不就做过和尚么？可见，做和尚，不仅可以成佛成祖，还可以成王成帝。明白了这个道理，也就是智慧。鲁达鲁达，粗鲁通达，虽然粗鲁，然而通达。什么叫达？达就是大路朝天，就是四通八达，无有阻碍。明白这个道理的，往往不是精细人、算计人，恰恰是鲁莽人，是粗心大意人。所以，“鲁达”这个名字好，暗含着深刻的道理和智慧。送这么一个好名字给他，作者施耐庵是真的喜欢他笔下的这个人物，或者说，就是用这个任务来表达他对生活的认识和领悟吧。鲁达对自己的人生，无那么多孜孜以求，无那么多的欲望，所以，他天机深，人又智慧，且天机深厚，可不就是智深么？鲁达就是智深，愚鲁通达就是智慧深厚。鲁达的人生告诉我们一个道理，有一种智慧来自性格，有一种性格即是智慧。所以，养性即是养智，养智就要养性。 418、这个世界上，干什么事，即要有一个什么样子却是一般俗人的见解，这种见解害了多少真英雄，真才子？多少人就是因为缺了一个模样而被弃掷在一边被排挤在圈子之外？着模样，有些时候就是长相，有些时候就是规矩、风格，有些时候，则体现为诸如文凭啦，职位啦，头衔啦等等。 419、你看，同一个人，在不同的眼光中，长相的差距有多大啊。可见，面试时，外在形象多么重要啊。 420、鲁智深的个性里，确实有一种魅力，使人几乎无条件地喜欢他、欣赏他。大思想家李贽，大批评家金圣叹，都被他迷倒了，成为他的骨灰级的粉丝。 421、鲁达的这一举动，使我们感慨下泪，也使我们会心而笑——下泪在于感慨命运之磨难英雄，微笑在于英雄调侃命运。 422、无聊的生活需要有趣的人物，清净枯淡的禅修之地需要鲁智深这样的热闹绚烂之人。 423、鲁达生平哪受过此等拘束与苦楚？哪里这样夹着尾巴做过人？他一直是托大的，从来没有这样装小过。 ⑤ 露出本相 424、这个老实人，既不能反抗鲁智深，也不能得罪真长老，为了衣饭不得不忍气吞声。为了衣饭，忍气吞声的，岂止他一个？茫茫人世，芸芸众生，哪个不要这样？ 425、醉酒的人无数，醉酒的原因也多种多样，其中有这样两种醉酒：借酒浇愁与借酒释放。匹夫匹妇，凡夫俗子，往往借酒浇愁。英雄豪杰，侠客义士，往往借酒释放。鲁智深不会有什么萦怀于心的东西，有了，当下就做了，做了，当下就放了，他不会隐忍，所以，也无需什么酒来浇愁，他只需要酒来助兴，帮助他释放心胸，解放自我。辛弃疾说，闲愁最苦，四五个月闲下来，鲁智深心中定也有那一份苦，那一份闷，需要酒来消解，更何况他还有那一种浩荡的意气也需要酒来点燃！ 426、小人往往在酒后露出本心，豪杰往往在酒后露出本相。 427、寂寞有时候不在于我们没有同伴，而在于我们失去本色；不在于我们不被人群接纳，而在于我们在人群中不敢以本相示人；不在于我们和别人不一样，而在于我们和别人太一样了。 428、跟醉人讲道理，比对牛弹琴还要傻。牛不懂琴声，但牛至少不会胡搅蛮缠。醉人的胡搅蛮缠谁受得了啊。 429、对，长老实际上是慧眼识人，他从鲁达的行为中看出了他心性的淳朴与刚直。谁能从他的凶猛中看出他的刚直？谁能从他的莽撞中看出他的爽快？谁能从他的粗野中看出他的高贵？长老。鲁智深一生知己，就是这个长老，所以，他也一生服膺长老，不论多醉，一看长老，必然醒来；不论多凶，一看长老，必然服软；不论多狂，一看长老，必然谦恭。 430、他觉得做人做事没有那么多的复杂，没有那么多的问题，对他而言，他的人生，只是一切率性而动，一切顺意而为，一切随缘而来，一切见机而行。着几乎歪打正着地符合了达摩大师的“直指人心，见性成佛”的思路。不是智深懂佛法，而是佛法就是要让我们都有一颗自然而然的心，而修行的目标，也就是回归最初一念的本心，童心，赤子之心。 431、鲁智深的心胸，是开放的，他的内心世界与外部世界是息息相关的，互动的。哪里是一般俗肠蠢货，于人于是，毫无触动，心如木石，如死水古井？金圣叹说他是上上人物，这样刚直爽快的性情，偏偏又配上这样敏感的心灵，不成上上人物，也难！ ⑥ 醉打山门 432、英雄酒后见本相，名士酒后见本色，小人酒后见本心，庸人酒后见本性。英雄在人群中，需藏起本相，免得吓着人，所以常常不见本相；名士在人群中，需要装扮风度，故也常常不见本色；小人心机阴险黑暗，只能藏起，所以往往在酒后一失控，本心乍现；庸人为生活所迫，不得不夹着尾巴做人，戴着面具做事，所以往往藏起本性，也是在酒后才能解脱他的种种束缚。 433、莎士比亚说，跳舞是和音乐做爱，鲁智深在五台山山道上一步一跌，是和酒精跳舞！和酒的精灵跳舞！ 酒是奇怪的东西，它使一些人醉后可厌，也使一些人醉后可爱。本性差的，它出他的丑，使其可厌；本性好的，它扬他的美，使其可爱。所以，可爱人喝酒，越醉越可爱，可厌人喝酒，越醉越可厌。酒是有精神的、有生命的、有好恶的精灵。 我们真用得着罗丹的一句话：这世界不是缺少美，而是缺少发现美得眼睛。我还得引申一下：这世界不是缺少美好的人性，而是缺少对人性的由衷的欣赏和爱。 这话骂得好啊，何曾见那些金刚帮过人？何曾见那些泥塑金身帮过我们敲开人生成功之门幸福之门？只见他拿着拳头吓唬我们。大多数人怕吓，一吓就乖了，就跪下磕头了，但鲁智深却大喝道：俺须不怕你！这醉中的话，是无法无天的话，是彻底戳穿真相的话，是何等英雄豪杰，才能说得出的话啊。 智深今天，不但自己现了本相，他还要这泥塑的金刚也现出本相，你我彼此真相相对，赤诚相见了，你看见了我，我也看见了你。我就是一个粗鲁人，贪酒好斗。你装模作样威风凛凛，原来也不过是泥巴和颜料啊。 佛教的最大特色，就是破除我们心中的“执”，我们有“执”，就会执迷不悟。对佛祖的崇拜，也是一种“执”，也要破除。打杀佛祖，就是要破除我们心中最后的“执”，天下从此太平，我们的心灵从此解放。 酒是这样一种东西，从瓶口闻，香；从人口闻，臭。装在瓶子里，香，以至于透瓶十里香，驼酒千里醉；装在人肚子里，臭。可见佛教说人是臭皮囊，是是屎溺桶，一点也不假。所以，人喝酒，不是酒糟践人，是人糟践酒。美酒千钟，入于人这个臭皮囊，立刻丑闻一室，人要积德，少喝酒。 ⑦ 命犯桃花 这荡荡乾坤，纷纷市井，茫茫大地，滚滚红尘，怎地就总是没有他们的安身立命之处？ 我们看了鲁智深两番酒后大闹五台山，不要以为鲁智深惯常酗酒闹事。其实不然。如果是这样，他就不可爱而可厌了。事实上，鲁智深固然爱酒，以至于遇酒便吃，但是他并不闹事。在上五台山前，他吃酒而不闹事，在五台山后，他也吃酒而不闹事，独在五台山闹事者，主要是英雄寂寞，被命运捉弄，而英雄以酒使气，与命运作一玩笑。从文学角度说，是以热闹写寂寞，以撒野写苦闷。 施耐庵是一个特别有幽默感的人，他时不时地要调侃一下。甚至不惜让人物说出不符合自己习惯和身份的话来。这是《水浒传》语言中的一个很有意思的特色。 443、按一般而言，这样的干扰时不应该的，因为它使小说情节不够真实，但在《水浒传》中，这种故意的干扰则不但获得了读者或听众的原谅，甚至获得了他们的喝彩，因为这样一写，还真的就更好看。施大爷如果在今天，一定是一个一流的导演。他知道怎样才有最佳的效果。 ⑧ 大闹桃花村 444、烦恼，是因为有了一个既定的不好的结果。害怕，是不知道会是什么结果，或者好一些，或者更糟。 445、实际上，强盗和暴发户历来都是一路货色。强盗是暴发户的一种，而且暴发户往往也是强盗的一种，他们还有一点特别相同，那就是他们多的是钱财，少的是文化。多的是钱财，素以就不惜工本往自己身上堆金砌银；少的是文化，堆来砌去，堆砌成了一个大笑柄，大活宝，一个假冒伪劣工程，冒充体面人。 446、这种勇敢，不仅仅是血性之勇，不仅仅是他对自己武功的自信。更多的，更值得我们敬仰的，是道义之勇。鲁智深的骨子里，有着血性，有着我们民族内在的道德勇气，这是他最为可贵的地方！ 447、这句话里，还真有因缘，这因缘就是对人情的体谅，对人的苦衷的感受。只是，这因缘，不是佛家的因果报应之说，而是儒家的恻隐之心、不忍之心、是非之心。真能说道理，他的心里，还真的藏着为人处世的道理！是啊，没有这样的道理，没有这样的是非，没有这样的恻隐之心，他当初怎么会搭救金翠莲，打死镇关西呢！ 448、鲁智深有没有“道理”啊？还真是好道理，但是，这道理必须是鲁智深说才有分量，才是道理，要让刘太公说，就不是道理。有实力的人才有资格跟人讲道理。 449、这周通的名字也与鲁达一样的好。通即是达，达即是通。不通何能达，能达必然通。周字也是周行不殆的意思。所以，鲁达一说因缘，周通这边就通。周通对鲁达，一对好名字。 450、鲁智深的善，是自为的善，是自然的善，还不是自觉的善。所以，他有时很善，善行出自天性，出自本真，毫无其他念头，是绝假纯真最初一念的本心中的善，是未经世俗污染的赤子之心，所以，特别感人。但是，正因为他还不是自觉地善，所以，当他的本心被其他念头遮蔽了时，也就不免于恶。比如，想喝酒时，他不免抢人的酒，还打人。酒后，还要闹事，还要打人。在寺庙中，随地大小便，对他人的感受毫不关心，等等。因为他还没有自觉地道德意识。体现在禅修上，他也是这样的境界。而在明代，李贽特别提倡在道德领域里的“童心”以及在宗教中的“狂禅”，在他看来，在道德和禅修上的最高境界，都不是经过自觉修炼而达到的自觉境界，而是人类未经世俗文化和社会污染的最初本心，鲁达恰恰完全符合他的理论，所以，他特别推崇鲁智深。 ⑨ 火烧瓦官寺 451、“照顾到后来好见面，做人处事千古名言。”这实际上就是中国人常说的做事不要做绝了，做到不能转回的境地，兵法上还说“穷寇勿追”呢，逼急了，没有退路了，只好回过头来与你拼命。留下一些空间，留下一些分寸，天地便会宽广。 452、我们看看桃花山上的大头领比起晁盖、宋江、吴用等等，他们虽然也是占山为王，但是档次上就差一个境界了，正如桃花山比起梁山，还差一个境界一样。梁山能做大，能海纳百川，能藏污纳垢，能让天下的江湖豪杰翘首仰望并归之如细流入海，而桃花山做不大，最终只能归顺梁山大寨。一个人能不能成大器、成大业，关键还不在于本领大小、专业技能大小，而在于胸襟的大小、眼界的大小、气度的大小；一个集团的前途大小，也在于这个集团有无打目标、大理想、大境界。 453、“僻”字有什么含义呢？僻者，偏也，偏居一隅，不识宇宙之大叫作僻；僻者，片也，眼界狭小，不知万物之富叫作僻；僻者，癖也，性情偏执，兴趣爱好单一叫作僻。一般而言，一直呆在一个地方，或者，一直处于一种环境，或者，长期生活于一种状态，一直沉湎于一种爱好，常有此僻。像李忠，就属于长期处于一种衣食不保的生活状态中，在那种状态中欠缺的东西——钱财，就会成为一种伤痕记忆、焦虑记忆、深入心灵身处，从而成为一种癖好。但这种人，正因为守旧、固执，不知变通，不愿变通，所以又显得靠得住，忠诚，厚道。 464、《三国》所写的人，都是社会上层人物，他们操纵别人的命运；《水浒》所写，都是社会中下层人物，他们的命运被别人操纵。所以他们要结义，从而使自己更有力量，在遭到迫害时，能有人出手相救。事实上，《三国》中也有结交的例子，典型的就是桃园三结义。但是，我们注意到，当刘、关、张结义时，他们恰恰是身处下层。后来诸葛亮加入刘备集团，刘备与他情好日密，感觉得到孔明有如鱼得到了水，但是，他们却没有结交，他们不可能再是兄弟，而只能是君臣。可见，结交兄弟，一般都是下层人民的习惯，而这个习惯，乃是由于他们缺乏安全感造成的。 465、这段时间里，谁把他当人？只是陷害、蹂躏、折磨、侮辱。此时一声兄弟，怎不令人热泪横飞？ 466、鲁智深要杀两个公人，林冲劝阻了他。至此，公人、林冲、鲁智深，三者之间构成了四种关系：公人要杀林冲，智深要救林冲，智深要杀公人，林冲要救公人。如果鲁智深不出现，就只有一种关系：公人杀林冲。——世道黑暗，看不到希望。鲁智深出现了，就出现了两种关系：智深救林冲。——这世道固然黑暗，但尚有生机，有仁慈。智深杀公人。——这世道尚有正义。作恶者尚不会全无顾忌，而正义也将最终出现。被救下的林冲又阻止了鲁智深杀公人：林冲救公人。——世间也有慈悲，也有宽恕。可见，假如如公人的愿，林冲被杀，则没有人救公人，公人也将被杀。公人杀林冲，等同自杀。而鲁智深救了林冲，林冲才可以救公人。可见，是鲁智深堵住了死门，并打开了生门。没有鲁智深，这世道只有黑暗。鲁智深这样的人出现了，这世道于是有了——生机，正义，仁慈，宽恕。这就是鲁智深这个文学形象的价值。 467、我们以前说过，林冲一生，只是一个怕字，而鲁智深一生，只是不怕。怕便局促，怕便委屈，怕便小心，怕便萎缩，甚至怕便屈辱，怕便委琐，怕到最后若不能爆发，便是万劫不复的奴才，怕到最后若爆发出来，又特别地狠毒。总之，让人怕的社会，整个地造成了全社会的心理变态。而鲁智深不怕，不怕便舒展，不怕便痛快，不怕便无奴颜媚骨，不怕便堂堂正正，体体面面，铁骨铮铮。《水浒传》把鲁智深写得体格宽大，心地厚实，这种气质，就来自于他的不怕，来自于他的这种正大阳刚的气质。不怕是鲁智深的最大性格特点，也是最能代表梁山好汉整体特点的地方。在封建专制社会那样专门让人怕的社会里，不怕，是最可贵的精神。 468、他担心鲁智深又撇下他，一个武功盖世的大英雄，此时像一个婴儿，眼神中全是对这个世界的恐惧，对鲁智深的依赖。大英雄的这种无助、无奈、无力，令人坠泪。 469、人有这样的兄弟，人便有了活路，天地有这样的人，天地便能生人。 470、是的，“放不下”三字，可作鲁智深一生之评。不过，说鲁智深的“放不下”三字，还要说道他的另外三个字。哪三个字呢？这三个字是：“放不过”。他放不下什么，又放不过什么呢？原来，这个世界上，总有两种人，两种他不得不管的人。一种是被恶人欺负而又忍气吞声无力反抗的可怜人。一种是欺压良善又无人制止的不明道德的可恨人。可怜人与可恨人，是他命运中纠缠不清的两种人。他几乎就是为这两种人而生来世上。所以，他与生俱来的，又有两颗心：慈悲心与杀伐心。他特别有慈悲心，对这些可怜人，他放不下，他要出来救助，施以援手。他特别有杀伐心，对那些可恨人，他放不过，他要出来制止，饱以老拳。一方面放不下，一方面放不过，耿耿于怀，如蝇在食，如鲠在喉，吐之为快；如眼中钉，如肉中刺，拔之为急。所以，鲁达碰上这样的事，这样的人，他只能丢下一切，先做了这事这人再说。 471、就做事而言，鲁智深又两个特点：一、做前三不：不惹事，不生事，不怕事。二、做后三不：不悔，不怨，不惜。不悔已做的，不怨受惠的，不惜失去的。 472、他有一句格言：杀人须见血，救人须救彻。所以，他做事坚决、干净、彻底，不瞻前顾后，不犹豫不决，不三思而行。没有那么多的算计，更没有自身利益的考虑。所以，他常常因此把自己的生活毁了。但即使这样，他也不思量，不后悔，对自己被毁掉的生活毫不留恋，并且，以后如何，也毫不在意。 473、鲁智深是个粗莽人，但此人偏一往情深，内心中特别深情。他不光有“义”，还有“情”。梁山英雄中，大多数是“忠义”，而鲁智深的突出特点则是“情义”。为人尽力叫作“忠”，感同身受叫作“情”。为人尽力，梁山好汉大多能做到，感同身受地去体会别人的感受，设身处地地为别人着想，这种曲折委婉的“情”，正是梁山众多英雄中比较缺乏的，而鲁智深这样一个粗鲁的人，偏偏有这样的情怀。 474、对着一个男人说无日不念你的老婆，这样的话也只有鲁智深才能说得出来，而且说得一腔深情，却又冰清玉洁。 475、又是一个“无一日不在心上”的人！有多少人在他心上？有多少人无一日不在他的心上？他这颗粗莽的心，竟然时时刻刻牵挂着这么多人和事？ 476、这个贺太守种下了那么多恶因，总要给他一个恶果，既已种因，终当结果么。“结果了那厮”，这人世间，多少恶贯满盈仍不住手的这厮那厮，只欠一个结果？而若我们不给他一个结果，他的作恶便也永不会停止！只有结果的那一天，才是他住手的那一天。所以，“结果”就相当于“超度”。真正的佛法，就是对恶人恶行的超度。恶人在恶行中而不自觉，深陷恶行中而不能自拔，就是业障，就需要超度！ 477、率性和分寸是一对矛盾，要处理好，很难。率性可爱，有分寸可敬。李逵比鲁智深更率性，所以有时候比他更可爱。但李逵往往没分寸，让人害怕，所以没有鲁智深可敬。武松分寸感极强，所以很可敬。但不够率性，所以不如鲁智深可爱。既可敬又可爱，这正是他高于李逵、武松等人的地方。 478、这世界有时候还真不缺少精细人，遇事也还真不缺少细商的人，不缺少哈姆雷特式的犹犹豫豫的人，就缺少莽撞人。面对事情，那些细商的人最后往往不了了之，即便后来做了也往往效果大打折扣。这个世界上的很多大事要事偏偏是莽撞人做的。莽撞人往往干成了大事，干了大家都希望有人干而又自己不敢干的事，干了大家希望有人干而自己算计得失后不愿干的事。而且干得不折不扣，斩绝痛快。他们往往是真君子，真汉子。历史上多少大事是莽撞人干的啊，历史上有多少伟大的莽撞人啊。陈胜、吴广是不是莽撞人？折木为兵，揭竿为旗，没有一点莽撞精神，干不出来。项羽是不是莽撞人？破釜沉舟，决战巨鹿，非莽撞人干不出来。刘邦是不是莽撞人？释放囚徒，挺身自任其罪，非莽撞人干不出来。正是这四个莽撞人，推翻了暴秦。《水浒》中最让我们快意的人，往往也是莽撞人，最让我们快意的事，也是莽撞人干的莽撞事。 ⑫ 独闯虎穴 479、英雄会在挺身而出时遭遇失败，但不会因为怕遭遇失败而畏首畏尾。实际上，综观鲁智深一生，他是一个不求成功、只求成仁的人，这与武松做事务求成功形成鲜明对比。 480、武松让人觉得英雄让人放心，只要他出手，就能搞定一切。但鲁智深让人觉得英雄让人动心，只要有需要，他一定会出手。武松不打无把握之仗。鲁智深却相反，只要是该打的仗，无把握也要打。抛头颅洒热血，心甘情愿；上刀山下火海，在所不辞。这是什么？这是一种精神，是一种高贵，是一种令人心仪的气质。这是《水浒传》这部小说给我们树立的一种人格精神坐标。 481、我们常常说，文学是塑造人物形象的，但文学更是塑造精神气质的。文学为什么要刻画人物形象？实际上，文学要建立一种人格坐标，使我们相信人类自己，相信我们自身的高贵，从而使我们虽然身处不完美的现在，但相信未来。可以这样说，在《水浒传》中，不同的任务故事体现出不同的文学意义。鲁智深这个人物形象的文学意义，就是让我们知道，在这个不完美甚至丑陋的世界上，还有高贵。在小人麋集的世界上，还有这样高贵的人。我们还可以拥有一种尊贵的人生。 482、英雄好面子胜过好性命，好死胜过赖活着，宁愿站着死，不愿跪着生。什么是英雄？这个问题可能又无数个答案，但是，我们至少可以这样说：英雄是这样的人，在他们看来，总有一些东西比生命重要。从某种意义上说，一个人的价值观里，比生命重要的东西越多，他的品性越是高贵，这些东西增加了他品性中高贵的东西的比重。反之亦然。 483、他作为一个强盗，作为一个被正统道德观念彻底否定的强盗，却一丝自卑都没有，一点惭愧都没有，为什么？因为，他知道，对方虽然表面上士身披官服的体面的官员，实际上却是一个害民贪色的贼！这才是真正的贼！而鲁智深自己，虽然有一个强盗的身份，却是一直行侠仗义、打抱不平、除暴安良的义士！ 484、鲁智深面对着当时的“众官做官却做贼”的事实，在这样的“官贼”面前，他这样的行侠仗义的所谓强盗，他们之间，不是官和盗的关系，而是“官贼”的侠盗、义盗的关系。那他有什么好自卑惭愧的呢？真正需要惭愧的，是那些披着官服的“官贼”啊！ 485、既无禅杖，又无法案，他凭什么和贺太守这样说话？凭正义！这是道德的优势、人格的优势，这就是孟子所说的浩然之气！义这个字，非常有意思。义者，宜也。义者，刈也。义就是适宜的、合理的，不合理不适宜的，怎么办？刈！杀！所以，在中国传统道德概念中，仁是爱，是维护，是怜惜，是同情；义士恨，是杀伐，是修建，是斫削。问题是，义，竟然不在朝廷，而在江湖；不在朝廷命官，而在山林强盗。 486、这一次，被缴了贼、被绑了手脚的鲁智深，照样取得了绝对的胜利。只不过，此次，他凭借的不是武力，不是双拳、禅杖、戒刀，而是他的言辞，因为义正，所以辞严。一句话，此处杀人的，不是刀锋，而是词锋。 487、在儒家圣人那里，如果说孔子更侧重于讲仁，孟子就更强调义，孔曰成仁，孟曰取义，仁是偏重柔性的力量，义士偏重刚性的力量。所以，孟子是阳刚的，是中华民族浩然正气和阳刚气质的主要精神资源。《水浒传》中普遍存在的阳刚之气，整体上像《孟子》的风格，而鲁智深骨子里有和孟子气质很相近的地方。 488、他以前骂的，比如郑屠，都是一些孤立的不道德的人和不道德的事。而这次他骂的，就不仅仅是一个贺太守，而是对整个封建官僚体系及其道德现状，在基于一个更高的理念和传统的价值观的立场上，对之进行严厉的道德批判。他体现了广大人民对封建官僚制度的整体性不满和反抗，以及社会精英阶层对这种制度的反思。 489、在死亡的考验面前，我们终于可以给鲁智深打一个满分，这真的是一个铮铮铁骨的好汉！货真价实的纯种英雄！在任何情况下都没有可怜相，都能保有自己尊严的豪杰之士！ ⑬ 大圆满 490、金玉金玉，乃宝贵之物，宝贵之物正遭受玷污、蹂躏，需要有大英雄不惜犯大难、冒大险而救之。 491、王义就是王之义、先王之义、圣王之义，现在，王之义已经被贪官们发配流放，被他们彻底抛弃了，我们在朝廷在官场已经找不到义了，义哪里去了？被强盗们救上山林中去了。这里面实际上就是一个很深刻、很悲痛的一个政治寓言：义已被官家流放，义已不在朝廷，不在官家，而在江湖；不在朝廷命官，而在江湖强盗。这是多么深刻的政治寓言！这又是多么沉痛的文学艺术！ 492、王道去了，霸道来了，王道沦落江湖了，江湖也就进入正史了。这样，我们来看看《水浒传》的寓意：高俅来了，王进去了，王进去了，史进来了，一百零八人来了。 493、三国津津乐道的是权谋、是机巧、是奸诈，而水浒虽然不能说没有智谋，却不大喜欢说这些，水浒喜欢说的是正义、是是非、是对错。所以我个人喜欢水浒胜过喜欢三国，就是因为，我认为，一个健康的社会、一个幸福的人生，更多的需要的是正义、是非，而不是权谋与机巧。所以，《水浒传》中的英雄，大多数是无谋的，不，正确的说法是“不谋”，他们做事，只是出于一种看起来比较简单的价值判断，如同李贽说的，最初一念之本心，也就是童心，也是善心。对的，就去做，错的，就不做；善的，就去扶持，恶的，就去消灭。他们是见义勇为，而不是反反复复的算计。我想，天堂一定是由这些简简单单的人物组成的，《三国》中的人只能组成地狱。鲁智深就是一个不谋的典型。他的不谋，由于两个原因。一、他不怕，所以，别人还在琢磨、犹豫，他已挺身而出了。二、他不躲。有些事，你碰上了，就是你的命，你就要迎上去，金圣叹说他“遇弱便扶，遇强便打”，你看，遇到弱，他还谋什么？扶就是了；遇到强，你还谋什么？打就是了。鲁智深就是这样一个简单的人，他的魅力，就来自于他的这种简单，我们就爱他的这份简单、单纯，他几乎是随遇而安，坦然接受命运。 原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/751583307 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香"
