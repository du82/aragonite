full_description = "格局，经历与读书 格局 格局是一个人的上限。就如你人生的容量，如果格局太小，就是在多的财富，在多的福气，你也接受不了的，会很快散尽的。 犹若水桶，你就一个1L的水桶，一下给你10L的水（运来），也只是从你这不断的溢出而已，等注入结束（运去）你最多也就剩下1L而已，而一般这样的大水流（大运）是冲击较大的，等去了，你其实1L也不会满的。 当然你有足够的格局，也可能没有足够的运的，你可能会说：我就是桶在大，没水（财富，名气一类外在的）也是白搭。是的，有困惑很正常的，只是如果你有此困惑，你就是 “以小人之腹度君子之心” 了，说明你格局还是没有打开，甚至没有发现。 只是，格局是上限，怎么去发现自己的格局和扩展自己的格局呢？ 经历！ 经历 发现和扩充自己的格局，只有自己去经历，去体验！ 现在有各种的讲座，有各种的LIve， 有各种的培训。这些是不是能更快去认识自己，去提升自己？不是！“听过很多道理，依然过不好这一生！” 现在人道理和格言获取太容易了，知道道理太容易了，知道的道理也太多了，可以说大多数人比很多有名的古人知道的道理都多 。 但 “纸上得来终觉浅，绝知此事要躬行。” 因为知道，记住，能侃， 能剖析，能随口出优缺点，也只是你的知识，不是你的道理！ 你的道理是你自己经历后的沉淀，经历后所悟，经历后的刻骨铭心。 只是人生不过短短几十年，3万余日而已，而且还局限于自己的生活环境，怎么可能经历那么多，去总结出许多自己的道理，轻易发展扩展自己的格局呢？别人的人生，别人的世界！ 读书 读书是你去经历去体验别人的人生和世界的最容易方法！ 每一本好书都是一个世界，有的世界我们熟悉，有的世界我们知道，有的世界我们新奇······我们看他们的爱恨情仇，去体会他们的酸甜苦辣，几十，几百或几千页书，可以让我们去看到好多个人生，如果能做到身临其境，我们何尝不是活了好几生？如果进一步能置身事外，何尝不是打破你们人生的格局？ 多余的碎碎叨 身临其境也是不容易做到的。 自己人生自己是第一人称，只是你有没有想过，其实你对于你的人生也是第三人称，只是置身其中无法自拔了？ 其实只要留意和能代入（身临其境）其他角色，其实很多地方可以去顺便体验别人的人生和世界的。 悔于事无关，与人无关，只与己有关。憾反之。 以上都是个人拙见，请酌情相信。 结语 人生就是不断发现自己，面对自己，接纳自己和成为自己的过程。 Author 渡世白玉Posted on 2017年10月10日2017年10月20日Categories 文字飘香, 随笔Tags 格局, 经历, 读书, 道理"
