description = "原文地址：http://andy360.blog.51cto.com/8208325/1325411 作者：RandyChenJunBin 磕磕碰碰，从大三第二学期开始找实习到现在签下360，已时过半年。改版过的10几份简历，多少可以铭记这段岁月的点滴痕迹。我从不敢说自己是大神，但一直在假装。如今，尘埃落定，我想把自己的的点滴心得写出来，与大家分享，权当共同学习，一起进步。（PS：一路走来，我只投产品岗位，所以本文所谈难免有所局限，技术大神请选择性跳读。谢谢。） 一、关于“假装在腾讯” 了解我的人，大概都知道，我脸皮不是一般的厚。自从5月31日带着《让QQ空间更好成为QQ网购入口的想法——许愿墙》的PPT到深圳回来后，我就开始假装在腾讯。如果讲兴趣是最好的老师，那目标就是最好的校长。在这一天天可以有饭吃的日子里，若能专注于兴趣，奋斗于目标，那他肯定是个很幸福的人。而我，自认就是那个他。 二、关于为何选择产品岗 9月份校招开始，可以讲，哪里有产品，哪里就有我。来来回回，也就总是可以遇到那几张熟悉的面孔，比如keith，moom，比如振龙。见惯了人山人海的产品笔试面试，但也深感压力，群面分分钟就被搞死，还不知道是怎么死的。但每到有机会专业面时，总难免被问到，为何选择产品岗？这个问题，已然不是什么偏题，相信大家也都会遇到，也总会在1、我目标如何明确；2、我朝目标付诸了哪些行动；3、我具有较强的执行力，是这样体现的；4、我具有哪些有别于他人的特质等这样的套路中完美收工。 重点：除了简历，能否多做点什么？去明确，自己是否真的喜欢产品，而非口头讲讲，抑或逃避技术。 三、关于简历 由于大学期间胡乱干过的事情有点多，有点杂。拿过三年奖学金，当过班长、辅导员助理、党支部书记，创过2次团队，工作室搞过开发，微博运营过，产品实习过。那是现在看来的情况，一句话可以带出，可大三开始找实习的第一份简历，简直无法直视，奖学金、学生干部经历占比最大，产品那时还没实习.....回头来看，做简历时难免会落入自我感觉良好的俗套，还傻傻分不清，抓不住重点，屁颠屁颠地一打印就是10张，以为，跑招聘会就是要这般模样。不知现在的你，是否也曾，抑或正在犯着这样的二？ 秉着将简历当成一款产品来用心打造的心态，每次面试回来都会回顾面试官对哪块经历感兴趣，哪块连问都没问。累计几次后，将多次被问到的经历的比重提升，总是被忽略的降低或者从简历中剔除，搬上其他经历。经过10几次简历的改版，终于有了目前这份被几家大公司面试官夸过的简历。以下是我对简历的一些看法，仅供交流。 （一）简历模板，真不是最重要的，越简单越好，别喧宾夺主 相信许多同学和我一样，一开始做简历时，总是到处找模板，而关于简历写什么内容却迟迟不见动工。如今，我认为，模板的作用仅是让自己了解下简历的框架，大概需要写些什么内容，而非越花哨越好。相反，简历越简洁，内容才能越突出。再说，HR阅简历无数，90%的模板她都有见过，别苦苦追求模板了，多点心思放在经历的描述上会好得很多。 （二）怎样从零开始做一份具有产品味道的简历 抛开简历，回想大学以来干过的各种大小事并一一列在纸上，哪怕再小也要写出。比如专注洗厕所3周年。 率先了解产品经理所需要具备的能力或者潜质。以下是我认为的：快速学习的能力；沟通表达能力；分析能力；执行力；逻辑思维；同理心；抗压能力；对互联网的敏感度和热爱度等，欢迎补充。 在了解了产品经理需要的能力或者潜质后，将自己的各种经历按最能体现、能体现、无关这样的次序来个重要性排序，排在前面的就可以往简历上放。另外，同样的经历，描述不同，体现突出的能力和重点就不同，在描述经历时，尽量从事件中提炼出能体现以上潜质的细节来写，而非苍白乏味的叙事性描述。 整体结构要做到张弛有度，比如我，做过的事情有点多和杂，如果全部往上放，肯定无法突出重点。我是这样解决的：互联网相关的实习经历详写，并放在上半页，而太过大众化的经历一笔带过，比如：班长、辅导员助理、党支部书记，详细见我简历。 要多使用短句，分点描写，避免口语化描述，避免主观化叙述，侧重可量化、数据化描写。比如“我组织了。。。”“我从中学到了与人沟通的技巧”等等这样的语句尽量不要或少出现。 一般以我参与了哪件事，主要负责/做了什么，结果是怎么样的，这样的结构来描写。 简历中的细节也要用心推敲，比如，之前我的简历中，将创建的“广东省柒鼎创业团队”标记为：实践经历。发觉这样从未被问到。在听完360的宣讲会了解到360很喜欢自称创业公司，创业心态也是公司的价值理念之一。在去面试之前，我对简历做了小修改：将“实践经历”改为“创业经历”，果然，一二面面试官都挺乐意去了解，去和我谈这段经历。 获得荣誉分类写，而非按时间顺序写。 对于自我认为可以的经历，不要自我感觉很牛叉，因为在面试官的眼中，这都不是事。可以小提，留下提问点，但不要详细写。比如，我带PPT到深圳腾讯的经历，我本想表达和体现的是我的执行力，而非我的想法是否被采纳。之前我是详写的，那时面UC极客班时，面试官竟没按我预想的问，因为他们已经知道我描写的经历，所以侧重点偏到了结果，直接问：你这想法后来被采纳了吗？直接说结果。我顿时慌了，所以回来后，我把它撤掉了，换成了他人评价我的执行力很强。后面的面试，每次问到：他人为何评价你的执行力强时，我才搬出那段经历，效果就不一样了。 10、总之，对于简历，永远不要陷入自我感觉良好的怪圈，要时刻总结和修改，用心打磨，多挖点与众不同的亮点，而非大众化。 四、关于面试 本想在面试之前写一下关于笔试的内容，但是我略感自己的笔试不咋地，因为在曾经最高峰的时期，我2天参加了5家公司的笔试，没有一个通过的，当时相当郁闷，这几个公司有：多益网络、百度、YY、金山WPS，UC校园招聘.....这里就不提那伤心事了。直接面试。 （一）自我介绍 校招开始后，面过的大公司不多，有腾讯、UC极客班、金山毒霸（内推）、360、金山手机助手（内推）等。面试总免不了要自我介绍，群面时候，我留意到许多同学的自我介绍都是一大段的大学所做过的事情的复述，简历中一般都已有所描写。在我看来，苍白的复述简历中的经历，没多大亮点。我是这样自我介绍的：1、个人基本信息；2、我的目标怎么样明确，我为何选择产品岗；3、我为这个目标做了哪些准备，简单罗列经历；4、我有一个明显的特质：执行力强，是这样体现的。 这里我想讲的是，自我介绍时，就要体现出自己的逻辑和条理性，以及自己的亮点是什么。我这样的自我介绍，是不是会除了条理，还有体现一个特点：结果导向型。所以说，处处用心去打磨，去提炼，我就是要与众不同。这样也更容易根据给定自我介绍的时间来调整到底介绍几点，每一点介绍的深度如何，比如1分钟、2分钟或3分钟的介绍是不一样的，能够有这样的一个框架，到时就可以轻松应对。 （二）群面 我参加的群面不多，总共3次，分别是UC极客班、优蜜和酷狗音乐，俩次通过，酷狗音乐Game Over.经验不算多，我也就厚着脸皮扯俩句。 首先自我介绍一般都有，按上面的介绍就完了，酷狗的群面比较好玩点，真的。群面真的很看RP，遇到你熟悉的话题或者说是案例，你分分钟可以搞定，比如UC的群面。但还是有原则的：1、积极参与那是肯定要的，但话不在多，在精。2、不能慌，保证讲的话都能有一定的逻辑性且不要重复陈述同一句话，一般都会有同学这样语无伦次。3、能够在关键时刻提出有建设性的建议或者观点会加分不少。4、全程认真记录下大家的观点，尽量争取当上总结的那个人。 咳咳，相信很多人看过群面面经，都会提到这几点，道理谁都懂，还是要自己多去经历，不断调整节奏，才能真正领会个中要领。"
full_description = "从假装在腾讯，到真的360 —— 一个应届准PM的独白（面经干货） 原文地址：http://andy360.blog.51cto.com/8208325/1325411 作者：RandyChenJunBin 磕磕碰碰，从大三第二学期开始找实习到现在签下360，已时过半年。改版过的10几份简历，多少可以铭记这段岁月的点滴痕迹。我从不敢说自己是大神，但一直在假装。如今，尘埃落定，我想把自己的的点滴心得写出来，与大家分享，权当共同学习，一起进步。（PS：一路走来，我只投产品岗位，所以本文所谈难免有所局限，技术大神请选择性跳读。谢谢。） 一、关于“假装在腾讯” 了解我的人，大概都知道，我脸皮不是一般的厚。自从5月31日带着《让QQ空间更好成为QQ网购入口的想法——许愿墙》的PPT到深圳回来后，我就开始假装在腾讯。如果讲兴趣是最好的老师，那目标就是最好的校长。在这一天天可以有饭吃的日子里，若能专注于兴趣，奋斗于目标，那他肯定是个很幸福的人。而我，自认就是那个他。 二、关于为何选择产品岗 9月份校招开始，可以讲，哪里有产品，哪里就有我。来来回回，也就总是可以遇到那几张熟悉的面孔，比如keith，moom，比如振龙。见惯了人山人海的产品笔试面试，但也深感压力，群面分分钟就被搞死，还不知道是怎么死的。但每到有机会专业面时，总难免被问到，为何选择产品岗？这个问题，已然不是什么偏题，相信大家也都会遇到，也总会在1、我目标如何明确；2、我朝目标付诸了哪些行动；3、我具有较强的执行力，是这样体现的；4、我具有哪些有别于他人的特质等这样的套路中完美收工。 重点：除了简历，能否多做点什么？去明确，自己是否真的喜欢产品，而非口头讲讲，抑或逃避技术。 三、关于简历 由于大学期间胡乱干过的事情有点多，有点杂。拿过三年奖学金，当过班长、辅导员助理、党支部书记，创过2次团队，工作室搞过开发，微博运营过，产品实习过。那是现在看来的情况，一句话可以带出，可大三开始找实习的第一份简历，简直无法直视，奖学金、学生干部经历占比最大，产品那时还没实习…..回头来看，做简历时难免会落入自我感觉良好的俗套，还傻傻分不清，抓不住重点，屁颠屁颠地一打印就是10张，以为，跑招聘会就是要这般模样。不知现在的你，是否也曾，抑或正在犯着这样的二？ 秉着将简历当成一款产品来用心打造的心态，每次面试回来都会回顾面试官对哪块经历感兴趣，哪块连问都没问。累计几次后，将多次被问到的经历的比重提升，总是被忽略的降低或者从简历中剔除，搬上其他经历。经过10几次简历的改版，终于有了目前这份被几家大公司面试官夸过的简历。以下是我对简历的一些看法，仅供交流。 （一）简历模板，真不是最重要的，越简单越好，别喧宾夺主 相信许多同学和我一样，一开始做简历时，总是到处找模板，而关于简历写什么内容却迟迟不见动工。如今，我认为，模板的作用仅是让自己了解下简历的框架，大概需要写些什么内容，而非越花哨越好。相反，简历越简洁，内容才能越突出。再说，HR阅简历无数，90%的模板她都有见过，别苦苦追求模板了，多点心思放在经历的描述上会好得很多。 （二）怎样从零开始做一份具有产品味道的简历 抛开简历，回想大学以来干过的各种大小事并一一列在纸上，哪怕再小也要写出。比如专注洗厕所3周年。 率先了解产品经理所需要具备的能力或者潜质。以下是我认为的：快速学习的能力；沟通表达能力；分析能力；执行力；逻辑思维；同理心；抗压能力；对互联网的敏感度和热爱度等，欢迎补充。 在了解了产品经理需要的能力或者潜质后，将自己的各种经历按最能体现、能体现、无关这样的次序来个重要性排序，排在前面的就可以往简历上放。另外，同样的经历，描述不同，体现突出的能力和重点就不同，在描述经历时，尽量从事件中提炼出能体现以上潜质的细节来写，而非苍白乏味的叙事性描述。 整体结构要做到张弛有度，比如我，做过的事情有点多和杂，如果全部往上放，肯定无法突出重点。我是这样解决的：互联网相关的实习经历详写，并放在上半页，而太过大众化的经历一笔带过，比如：班长、辅导员助理、党支部书记，详细见我简历。 要多使用短句，分点描写，避免口语化描述，避免主观化叙述，侧重可量化、数据化描写。比如“我组织了。。。”“我从中学到了与人沟通的技巧”等等这样的语句尽量不要或少出现。 一般以我参与了哪件事，主要负责/做了什么，结果是怎么样的，这样的结构来描写。 简历中的细节也要用心推敲，比如，之前我的简历中，将创建的“广东省柒鼎创业团队”标记为：实践经历。发觉这样从未被问到。在听完360的宣讲会了解到360很喜欢自称创业公司，创业心态也是公司的价值理念之一。在去面试之前，我对简历做了小修改：将“实践经历”改为“创业经历”，果然，一二面面试官都挺乐意去了解，去和我谈这段经历。 获得荣誉分类写，而非按时间顺序写。 对于自我认为可以的经历，不要自我感觉很牛叉，因为在面试官的眼中，这都不是事。可以小提，留下提问点，但不要详细写。比如，我带PPT到深圳腾讯的经历，我本想表达和体现的是我的执行力，而非我的想法是否被采纳。之前我是详写的，那时面UC极客班时，面试官竟没按我预想的问，因为他们已经知道我描写的经历，所以侧重点偏到了结果，直接问：你这想法后来被采纳了吗？直接说结果。我顿时慌了，所以回来后，我把它撤掉了，换成了他人评价我的执行力很强。后面的面试，每次问到：他人为何评价你的执行力强时，我才搬出那段经历，效果就不一样了。 10、总之，对于简历，永远不要陷入自我感觉良好的怪圈，要时刻总结和修改，用心打磨，多挖点与众不同的亮点，而非大众化。 四、关于面试 本想在面试之前写一下关于笔试的内容，但是我略感自己的笔试不咋地，因为在曾经最高峰的时期，我2天参加了5家公司的笔试，没有一个通过的，当时相当郁闷，这几个公司有：多益网络、百度、YY、金山WPS，UC校园招聘…..这里就不提那伤心事了。直接面试。 （一）自我介绍 校招开始后，面过的大公司不多，有腾讯、UC极客班、金山毒霸（内推）、360、金山手机助手（内推）等。面试总免不了要自我介绍，群面时候，我留意到许多同学的自我介绍都是一大段的大学所做过的事情的复述，简历中一般都已有所描写。在我看来，苍白的复述简历中的经历，没多大亮点。我是这样自我介绍的：1、个人基本信息；2、我的目标怎么样明确，我为何选择产品岗；3、我为这个目标做了哪些准备，简单罗列经历；4、我有一个明显的特质：执行力强，是这样体现的。 这里我想讲的是，自我介绍时，就要体现出自己的逻辑和条理性，以及自己的亮点是什么。我这样的自我介绍，是不是会除了条理，还有体现一个特点：结果导向型。所以说，处处用心去打磨，去提炼，我就是要与众不同。这样也更容易根据给定自我介绍的时间来调整到底介绍几点，每一点介绍的深度如何，比如1分钟、2分钟或3分钟的介绍是不一样的，能够有这样的一个框架，到时就可以轻松应对。 （二）群面 我参加的群面不多，总共3次，分别是UC极客班、优蜜和酷狗音乐，俩次通过，酷狗音乐Game Over.经验不算多，我也就厚着脸皮扯俩句。 首先自我介绍一般都有，按上面的介绍就完了，酷狗的群面比较好玩点，真的。群面真的很看RP，遇到你熟悉的话题或者说是案例，你分分钟可以搞定，比如UC的群面。但还是有原则的：1、积极参与那是肯定要的，但话不在多，在精。2、不能慌，保证讲的话都能有一定的逻辑性且不要重复陈述同一句话，一般都会有同学这样语无伦次。3、能够在关键时刻提出有建设性的建议或者观点会加分不少。4、全程认真记录下大家的观点，尽量争取当上总结的那个人。 咳咳，相信很多人看过群面面经，都会提到这几点，道理谁都懂，还是要自己多去经历，不断调整节奏，才能真正领会个中要领。 （三）专业面 产品的专业面，一般考察的分为2部分，一部分是自己的简历中的经历，面试官希望通过经历来挖掘他希望了解的点，也就是前面提到的那些能力。另一部分是对产品经理职位的了解及对互联网产品的敏感度和分析能力即产品感觉。 我是这样准备的： 简历部分：按（1）我的这段经历具体是什么样的；（2）在这件事中，我主要负责了什么；（3）这个过程中，遇到什么困难或问题；（4）我是通过什么方式如何解决的；（5）如果让我继续改进，我将会怎样改。这样的套路来梳理自己的每一段经历。 产品感觉部分： （1）关注最近的互联网大事，并对此事从多角度去分析及阐述自己的看法； （2）对2至3款应用及其竞品做具体的竞品分析，并精炼概括，能在面试时候1、2、3这样表达出来；另外，对某款应用有意见时，不能只停留在吐槽的层面，而应多去思考人家为何这样设计而不是那样设计，并给出自己的解决方案。 （3）这是重点，有自己想做的产品或者想法，并能够付诸行动去把它具体化，去做调研、画原型，做PPT等，梳理清楚自己的需求来源、解决的是目标用户的哪些问题、打算如何推广等问题。并在面试时候带去，演示给面试官看（我一直都是这样做的，并不断地汲取每位面试官对自己想法的具体看法或建议，在下次面试时候能够演示、解说的更好，事实证明，这也是最有效的）。虽然受限于自己的见识及水平，自己的PPT每次都会被吐槽，但，那又怎样呢？面试官看重的是你去思考、去执行的过程，而非这款产品或想法到底多牛叉。 （四）专业压力面 相信面试过产品的同学，都会遇到过这样的情况：面试过程中，面试官从头至尾对于你的回答都没半点回应、或打断你的回答，立马进入下一题，或低头看你简历、或面对电脑不断的敲键盘、或不时拿出手机来看看，就是没正眼看过你。这就对了，压力面。我遇到过2次，第一次是UC极客班，当时我就慌了，节奏完全被带乱，并且是2对1的面试，20分钟内总共回答了接近20个问题，出来感觉脑子严重缺氧，也就基本知道结果是悲催的了。 那次之后，我跟HR老姐聊了下，她说，这是压力面，主要考察的是你的抗压及抗干扰能力，如果能够保持有条理、逻辑清晰、不慌乱的回答他的问题，胜算会大很多。并给我支了一招：“你现在已经知道这是压力面，知道他想考察的重点，那你就把他当你师兄或者工作室的老师，淡定的跟他聊就好了。他们都是假装的，平时跟你身边人差不多。并且，如果你慌，不要直视他眼睛，可以尝试看他鼻子那的正三角或者眼睛那的倒三角，这样给他们的感觉也好。这招在哪一轮面试都管用。” 360的二面就是压力面，从我进去开始到我出来，他没正眼看过我。这要是放以前，肯定要挂掉。但那次表现的超常淡定，尽管他故意想要制造冷场，后来还是让我成功掰回。所有的阐述都能有个1、2、3，并能够自我感觉还可以的回应了他的几乎所有追问。 重点：要想自我掌控节奏，有一个技巧是很好用的，就是：在他问完问题后，多通过提问互动，将面试官引导到自己的轨道上来。比如说，他问说说你对互联网的看法。这问题很大也很主观。那我一般会这样来：“我想通过谈谈我对微信和易信的看法来回答这个问题，可以吗？”真的是屡试不爽，这样就能够回到自己的轨道上来，也避开了大空白的瞎扯没实质性的东西。 （五）你还有什么问题要问我的吗？ 一般面试最后都会有一个问题：“你还有什么问题要问我的吗？”很多人可能会问培训体系、待遇这些，老姐说，最好不要问这些，因为大公司的这些福利待遇都是固定的。一般我都问2个问题。我是这样问的：“虽说很多公司都在招产品岗位，但是，据我了解，进去不同公司，实际从事的工作内容和性质都是有很大区别的，我想了解下咱们公司的产品岗的工作内容或者说我进去是负责哪块的？”虽说问的也没啥水平，但屡试不爽。第二个问题是：“我想了解下，如果这轮面试通过，大概什么时候可以收到通知？” 如果是HR面问到这个问题，我一般也是2个问题，最后一个没变。第一个改为：“假如您平时使用公司的产品遇到问题，都有哪些渠道可以去跟负责这款产品的部门反馈？您有试过吗？”这个问题我在面360时候一抛出，完全打开了HR姐姐的话闸，就这个问题就跟我聊了好多，还扯到了QQ，不得不说，360真的是人人都是产品经理哈。很赞。此刻，聊什么内容已经不是重点了，重点是，我知道这问题问对了。哈哈。 五、关于心态 许多同学，或许是因为经历的面试不多，所以感觉总是担心这担心那。比如，人家要名企实习经历、我不是中大的、好多华工研究生啊等等，而左顾右盼，简历都不敢投，或者是抱着打打酱油的心态。每次我遇到这样的同学，都会很反感。这说白了就是信心不足，自认屌丝。 名企实习怎么了？为何要自认屌丝？主动权在自己手中时，为何不能给自己一个机会？连自己都看不起自己的人，企业为何要招你？列出条件，想刷的就是你这样的人！ 一个例子：UC极客班招聘时，海报中列出6个条件，我一条都不符合，但我还是去笔试了。没想到笔试还过了。完了就是去群面，当时去到公司，在休息区等候时，大家互相介绍，12个人中，有中大、华工本科研究生、有腾讯实习生等等听起来都很吓人，只有我，广工本科小公司实习屌丝男。在最后分成2组每组6人群面中，我们组刷掉4个人，2人进入专业面，1个华工研究生，另外1个是本屌。在这里不是想炫耀我自己多牛叉，说实在的就是命好，遇到自己熟悉的案例。认识的同为广工的土豪，还就是进了UC极客班，条件真不是硬性的。 所以说，只要你是真的想要去做产品，就不要在意那些条件，盯准目标，去做，就好了。机会都是自己给的。 另外，不要总是问到底招多少人。这很没意义，少了是给自己泄气，多了又能怎样？ 另一个例子：360最终在广东的产品岗位只招了一个我，本科生总共招了2个，另外一个是中大技术的。不是说本屌产品有多牛叉，而是本屌有那口气在，一口逆袭的气。 再者，无论前面一轮面试的感觉如何，在等候下轮面试时，都不要再去想答的好或者不好。抓紧清空心态，准备下一轮的面试。时刻清空，才能更好。回家再总结。 最后，我想说说为何我可以进360. （1）许多产品大牛都不愿意去北京，所以少了不少强劲对手； （2）我就一打满鸡血对产品专注有热情和激情的复合体，符合360的口味； （3）我结果导向，目标坚定，执行力强，关键是宣讲会拿到了360公仔和随身WIFI，嘿嘿。 （4）还有几个潜在的Offer,就不扯出来丢人了。 （5）以上都是瞎扯的，别太当真。 我最想讲的： 1、做产品靠的是长期的积累和专注，而非突击，你所看到的只是经历校园招聘后我的点滴总结。我说的再多也还只是我的，只有自己去做，去经历才是王道。 2、无论是找工作或是做产品，我认为，都不要自我大众化，而是要差异化。找到自己的亮点和卖点，才能更早的找到出路。 3、是结束，更是开始，我知道自己几斤几两，我会继续加油，争取能够跟上帝都各种大神的节奏。我爱360！！！ 4、感谢一路来老姐及家人朋友的支持、廖老师、文胜哥、keith、大虫师姐、实习公司、金山斌哥、伊懋、朝潮师兄及各位大神在技能上及精神上的支持及引导。有你们，真好，祝都好。 作者：RandyChenJunBin Author 渡世白玉Posted on 2013年11月21日2015年8月21日Categories 其它, 分享文字Tags IT经历, 工作, 简历, 面试"
