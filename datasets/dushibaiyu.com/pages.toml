description = "作者：tonghuix 提前声明：以下内容可能会导致身体或精神不适，若如此请自行阅读《人民日报》或观看《新闻联播》来调节。笔者不对读者的此类不适反应负责。 看标题可能以为我是标题党，不过在经历过一些事情以后，也可能有类似我这样的想法出现，很多以前热衷开源的人之所以都“叛逃”到了封闭中去了，很大程度与下面分析的一些事情有关，我想以更理性的方式评价中国的开源进程，而不是盲目的吐槽，我也希望更多的引起共鸣和讨论，请不要借题发挥的吐槽下去，没有意义。 开源产生和发展的背景 在展开对中国开源的讨论之前，先来简单看看世界上开源的产生发展的背景。众所周知，开源首先从1984年Richard Stallman的GNU宣言开始的，到1991年Linux产生以后发展成形，1998年开源促进会成立完成整个“开放源代码”的整个产生过程，而大幅度的发展一直从1991年以后至今的20几年时间里。当然在这之前已经有几十年“黑客伦理”出现了，如果看《黑客——计算机革命的英雄》一书，可以发现黑客伦理和开源理念是如此的一脉相承。 从时间上就可以很容易发现开源的产生，除了有强大的计算机科学技术的发展，更有极其强大的人文背景，这里简单分析一下相关政治、经济、文化背景。 20世纪最后十年是巨变的十年，苏东巨变和社会主义阵营瓦解，世界刚刚从冷战格局中走出来，独裁专政被民主政权推翻，人们迫切需要在计算机行业里实现一种自由、民主的氛围，此时GNU与开源以及互联网的出现，大幅度满足了人们的这一政治诉求。 经济上，1992开始年美国出现了前所未有的经济泡沫和经济下滑，带动世界经济也跟着下滑，包括已经半只脚迈进经济全球化的中国也出现了通货膨胀的风险。此时开源的低成本和高可靠性正好符合此时人们的需要，正如现在中国产品在世界热销一样。 从人文角度说，经过启蒙运动几百年以后的世界，特别是工业革命直到冷战以后，人民的思维更加趋向理性和开放，野蛮残暴和封闭垄断的“丛林法则”已经越来越失去市场，世界主要发达国家都有了完善的公民社会，以及民主法制的公民意识，公民意识提供了开源必需的创新力、奉献精神、分享精神和开放的心态。此时人们对软件行业的开源思潮也就呼之欲出了。 总结一句话——开源是国家的科技发展水平、公民意识、软件产业发展水平，三者共同发展到一定程度以后的必然产物。 开源虽然产生自美国，而一旦这个国家具备了以上的条件，接受和发展开源也就是很正常的了。从这个网站 KPS 可以看到相关国家给Linux Kernel提交Patch的排名，除了美国以外，英国德国都排名很高。特别要说明的是这里的Chinese不仅包括大陆华人还包括港澳台同胞以及马来西亚、新加坡等地的华侨，还有在外国工作的华裔侨民，因此实际上由大陆同胞提交的Patch就少之又少了。 经过上面的简要分析可以看到中国（特指大陆地区）目前之所以不适合发展开源，正是因为不满足上述这些条件。下面分别从个人、企业、政府三个层面上简要分析： 个人——缺少公民社会意识 从前段时间反日***中人们不理性的打砸抢行为就可以看出，中国人的公民意识和建立公民社会还有很长的路要走。因为中国在历史上没有经历过类似西方那样的启蒙运动（如果先秦的“百家争鸣”可以看作是中国的“启蒙运动”的话，也最终被集权统治所毁灭了），而两千多年的集权统治，将人塑造成了蒙昧与无知，自卑与猜忌，愚蠢与短视的所谓“良民”与“顺民”。缺乏普遍的民主意识（中国现在的所谓“民主”意识也大多是均贫富和直接民主那样的平均主义或者民粹主义，而不是理性的民主意识）导致中国在宣传开源的时候遇到了很大的接受难度。 个人法律意识淡漠，现代社会冲击下的中国，由于缺少法制精神不懂也不尊重知识产权，再加之没有信仰而信仰“一切向钱看”的实用主义，所以会产生盗版横行，抑制创新。缺少法律意识也就不会尊重开源的各种许可协议，将开源简单理解为“免费”也就情理之中了。 同时也要看到，创新依赖人们的信任中国缺少的不是创新而是信任，现在中国信任却成为了稀缺产品，处处冷漠的面孔和剑拔弩张的紧张人际关系，阻碍了创新的同时也将人的奉献精神消灭殆尽了，这些都制约了开源在中国的发展。 企业——扼杀创新不懂保护知识产权 企业同样也缺少信任，因此首先是扼杀了创新，所以山寨横行。除此之外，沉重的赋税让企业为了盈利必须采取更加稳妥的经营策略，规避创新产生的风险。由趋利导向的企业势必会选择开源的低成本。这也就导致很多中国主导开源开发的公司都以“免费”来替代自由，以低成本社区来替代开放，忽略了软件行业的服务。 企业宣传开源的时候往往也是利用中国的实用主义思维，从免费或低成本，高性能或高可靠性，社区免费的服务等来作为其推广噱头，而这样的推广噱头本身就是在自损，不仅损失了可靠的社区支持，更让自己掉价了。建议相关企业更应该宣传开源的自由和开放，显然这样宣传起来非常有困难。 扼杀创新的结果之一就是流氓公司横行，一旦有小公司创新，这些流氓公司就利用手里的资源进行外包开发以最快的时间山寨产品或挖人才，利用自己数量众多的用户抢夺小公司创新产生的用户市场，将很多创新扼杀在襁褓中。 中国的软件行业还是比较初级和原始的，在亚洲与日本韩国差距巨大，甚至与印度以及东南亚小国的都有不小的差距。开源是软件产业发展到一定阶段的必然产物，开源软件可以与其他软件在产业链条中形成互补性优势，开源软件发展越强，整个软件产业越健壮。因此中国现在接受开源软件无异于揠苗助长，势必会产生各种畸形。 政府——人家一开源咱们就自主创新 首先是有政府背景的企业或者央企，没有创新意识也没有尊重知识产权的意识，从前几天微软指责中国邮政、中国航空等多家国企央企超过80%的盗版软件利用率上就可以可见一斑。而从另一个方面来说，获得政府资助（政府招标采购）的企业或者项目往往也是缺乏创新机制的，用别人已经开源的产品稍作汉化、美化就称之为“自主创新”。比较知名的有以前的Redoffice项目使用OpenOffice之后封闭代码，并伪装成“自主创新”获取“核高基”资金；还有前段时间的“3D动力”使用开源Blender代码，宣称“自主创新”的例子。 政策层面，政府对开源的支持最多仅限于开源项目（名义上的），或者是类似的开源应用，更看重开源软件的免费和社区服务，而没有接受开源背后的文化和意识形态。 当然了，众所周知，开源思想与早期的“黑客伦理”是一脉相承的，推行分权的民主体系、自由开放的心态和按能力分配的人才制度，这些意识形态都与现政府相左。 好消息是，政府目前虽然没有大力发展，也没有打压开源！ 脆弱的希望之光 从北京721大雨中人人互帮互助，以及反日***中那些理性的瞬间，似乎可以看到中国人的公民意识在快速的觉醒和发展，同时互联网的发展更将西方几百年启蒙运动成果快速灌输到中国人内心中。一些企业也和国外的开源企业合作推出自己的开源产品，放弃了“自主创新”的噱头，转而吸引了很多的社区用户，可以说是一个很好的开始，是一个黑暗中的一个小光点！ 刚才前面说过，开源是社会公民意识、科技发展水平、软件产业发展水平到一定程度以后必然的产物，中国在这三方面的条件都非常初级，更何况近期民粹主义有抬头的趋势，社会整体有“向左转”的倾向，企业依然受困于经济下滑的压力，此时推行开源软件势必会产生一堆揠苗助长之后的畸形产物，从一开始就种下了畸形开源的种子。 所以再次重复标题“中国不适合发展开源”，当然这个结论不是一成不变的，当中国日后有更先进的科技发展水平，更健全的公民社会意识以后再考虑引入开源吧，那时候将是一次极其顺利的进程。所以应该准确说——中国“现阶段”不适合发展开源。 对于那些如你我这样开源的积极倡导者，自己使用并贡献开源项目就好了，对于公民意识比较强的行业朋友可以引导进来，不要意图利用开源改变社会，改变现实。认清“国情”，做一个隐士：达则兼济天下，穷则独善其身！ 原文地址：http://tonghuix.blog.51cto.com/2169773/1165781 作者声明：本文出自 “爱开源未来” 博客，请务必保留此出处http://tonghuix.blog.51cto.com/2169773/1165781"
full_description = "中国不适合发展开源——对中国开源发展的思考 作者：tonghuix 提前声明：以下内容可能会导致身体或精神不适，若如此请自行阅读《人民日报》或观看《新闻联播》来调节。笔者不对读者的此类不适反应负责。 看标题可能以为我是标题党，不过在经历过一些事情以后，也可能有类似我这样的想法出现，很多以前热衷开源的人之所以都“叛逃”到了封闭中去了，很大程度与下面分析的一些事情有关，我想以更理性的方式评价中国的开源进程，而不是盲目的吐槽，我也希望更多的引起共鸣和讨论，请不要借题发挥的吐槽下去，没有意义。 开源产生和发展的背景 在展开对中国开源的讨论之前，先来简单看看世界上开源的产生发展的背景。众所周知，开源首先从1984年Richard Stallman的GNU宣言开始的，到1991年Linux产生以后发展成形，1998年开源促进会成立完成整个“开放源代码”的整个产生过程，而大幅度的发展一直从1991年以后至今的20几年时间里。当然在这之前已经有几十年“黑客伦理”出现了，如果看《黑客——计算机革命的英雄》一书，可以发现黑客伦理和开源理念是如此的一脉相承。 从时间上就可以很容易发现开源的产生，除了有强大的计算机科学技术的发展，更有极其强大的人文背景，这里简单分析一下相关政治、经济、文化背景。 20世纪最后十年是巨变的十年，苏东巨变和社会主义阵营瓦解，世界刚刚从冷战格局中走出来，独裁专政被民主政权推翻，人们迫切需要在计算机行业里实现一种自由、民主的氛围，此时GNU与开源以及互联网的出现，大幅度满足了人们的这一政治诉求。 经济上，1992开始年美国出现了前所未有的经济泡沫和经济下滑，带动世界经济也跟着下滑，包括已经半只脚迈进经济全球化的中国也出现了通货膨胀的风险。此时开源的低成本和高可靠性正好符合此时人们的需要，正如现在中国产品在世界热销一样。 从人文角度说，经过启蒙运动几百年以后的世界，特别是工业革命直到冷战以后，人民的思维更加趋向理性和开放，野蛮残暴和封闭垄断的“丛林法则”已经越来越失去市场，世界主要发达国家都有了完善的公民社会，以及民主法制的公民意识，公民意识提供了开源必需的创新力、奉献精神、分享精神和开放的心态。此时人们对软件行业的开源思潮也就呼之欲出了。 总结一句话——开源是国家的科技发展水平、公民意识、软件产业发展水平，三者共同发展到一定程度以后的必然产物。 开源虽然产生自美国，而一旦这个国家具备了以上的条件，接受和发展开源也就是很正常的了。从这个网站 KPS 可以看到相关国家给Linux Kernel提交Patch的排名，除了美国以外，英国德国都排名很高。特别要说明的是这里的Chinese不仅包括大陆华人还包括港澳台同胞以及马来西亚、新加坡等地的华侨，还有在外国工作的华裔侨民，因此实际上由大陆同胞提交的Patch就少之又少了。 经过上面的简要分析可以看到中国（特指大陆地区）目前之所以不适合发展开源，正是因为不满足上述这些条件。下面分别从个人、企业、政府三个层面上简要分析： 个人——缺少公民社会意识 从前段时间反日***中人们不理性的打砸抢行为就可以看出，中国人的公民意识和建立公民社会还有很长的路要走。因为中国在历史上没有经历过类似西方那样的启蒙运动（如果先秦的“百家争鸣”可以看作是中国的“启蒙运动”的话，也最终被集权统治所毁灭了），而两千多年的集权统治，将人塑造成了蒙昧与无知，自卑与猜忌，愚蠢与短视的所谓“良民”与“顺民”。缺乏普遍的民主意识（中国现在的所谓“民主”意识也大多是均贫富和直接民主那样的平均主义或者民粹主义，而不是理性的民主意识）导致中国在宣传开源的时候遇到了很大的接受难度。 个人法律意识淡漠，现代社会冲击下的中国，由于缺少法制精神不懂也不尊重知识产权，再加之没有信仰而信仰“一切向钱看”的实用主义，所以会产生盗版横行，抑制创新。缺少法律意识也就不会尊重开源的各种许可协议，将开源简单理解为“免费”也就情理之中了。 同时也要看到，创新依赖人们的信任中国缺少的不是创新而是信任，现在中国信任却成为了稀缺产品，处处冷漠的面孔和剑拔弩张的紧张人际关系，阻碍了创新的同时也将人的奉献精神消灭殆尽了，这些都制约了开源在中国的发展。 企业——扼杀创新不懂保护知识产权 企业同样也缺少信任，因此首先是扼杀了创新，所以山寨横行。除此之外，沉重的赋税让企业为了盈利必须采取更加稳妥的经营策略，规避创新产生的风险。由趋利导向的企业势必会选择开源的低成本。这也就导致很多中国主导开源开发的公司都以“免费”来替代自由，以低成本社区来替代开放，忽略了软件行业的服务。 企业宣传开源的时候往往也是利用中国的实用主义思维，从免费或低成本，高性能或高可靠性，社区免费的服务等来作为其推广噱头，而这样的推广噱头本身就是在自损，不仅损失了可靠的社区支持，更让自己掉价了。建议相关企业更应该宣传开源的自由和开放，显然这样宣传起来非常有困难。 扼杀创新的结果之一就是流氓公司横行，一旦有小公司创新，这些流氓公司就利用手里的资源进行外包开发以最快的时间山寨产品或挖人才，利用自己数量众多的用户抢夺小公司创新产生的用户市场，将很多创新扼杀在襁褓中。 中国的软件行业还是比较初级和原始的，在亚洲与日本韩国差距巨大，甚至与印度以及东南亚小国的都有不小的差距。开源是软件产业发展到一定阶段的必然产物，开源软件可以与其他软件在产业链条中形成互补性优势，开源软件发展越强，整个软件产业越健壮。因此中国现在接受开源软件无异于揠苗助长，势必会产生各种畸形。 政府——人家一开源咱们就自主创新 首先是有政府背景的企业或者央企，没有创新意识也没有尊重知识产权的意识，从前几天微软指责中国邮政、中国航空等多家国企央企超过80%的盗版软件利用率上就可以可见一斑。而从另一个方面来说，获得政府资助（政府招标采购）的企业或者项目往往也是缺乏创新机制的，用别人已经开源的产品稍作汉化、美化就称之为“自主创新”。比较知名的有以前的Redoffice项目使用OpenOffice之后封闭代码，并伪装成“自主创新”获取“核高基”资金；还有前段时间的“3D动力”使用开源Blender代码，宣称“自主创新”的例子。 政策层面，政府对开源的支持最多仅限于开源项目（名义上的），或者是类似的开源应用，更看重开源软件的免费和社区服务，而没有接受开源背后的文化和意识形态。 当然了，众所周知，开源思想与早期的“黑客伦理”是一脉相承的，推行分权的民主体系、自由开放的心态和按能力分配的人才制度，这些意识形态都与现政府相左。 好消息是，政府目前虽然没有大力发展，也没有打压开源！ 脆弱的希望之光 从北京721大雨中人人互帮互助，以及反日***中那些理性的瞬间，似乎可以看到中国人的公民意识在快速的觉醒和发展，同时互联网的发展更将西方几百年启蒙运动成果快速灌输到中国人内心中。一些企业也和国外的开源企业合作推出自己的开源产品，放弃了“自主创新”的噱头，转而吸引了很多的社区用户，可以说是一个很好的开始，是一个黑暗中的一个小光点！ 刚才前面说过，开源是社会公民意识、科技发展水平、软件产业发展水平到一定程度以后必然的产物，中国在这三方面的条件都非常初级，更何况近期民粹主义有抬头的趋势，社会整体有“向左转”的倾向，企业依然受困于经济下滑的压力，此时推行开源软件势必会产生一堆揠苗助长之后的畸形产物，从一开始就种下了畸形开源的种子。 所以再次重复标题“中国不适合发展开源”，当然这个结论不是一成不变的，当中国日后有更先进的科技发展水平，更健全的公民社会意识以后再考虑引入开源吧，那时候将是一次极其顺利的进程。所以应该准确说——中国“现阶段”不适合发展开源。 对于那些如你我这样开源的积极倡导者，自己使用并贡献开源项目就好了，对于公民意识比较强的行业朋友可以引导进来，不要意图利用开源改变社会，改变现实。认清“国情”，做一个隐士：达则兼济天下，穷则独善其身！ 原文地址：http://tonghuix.blog.51cto.com/2169773/1165781 作者声明：本文出自 “爱开源未来” 博客，请务必保留此出处http://tonghuix.blog.51cto.com/2169773/1165781 Author 渡世白玉Posted on 2013年11月10日2015年8月21日Categories 其它Tags 中国, 公民, 开源"
