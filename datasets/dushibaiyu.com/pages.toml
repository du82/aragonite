full_description = "是谁教他说谎？ 总是教他说谎的坏处，但有时还说谎，WHY!!! <一> 一次，家长指着地上的碎碗问： “这是谁弄的？” 孩子在一旁低头答: “我。。。。” “你干什么的，这碗。。。*&%￥&……。” <二> 又一次，家长指着地上碎玻璃问： “这是怎么回事？” 孩子低头不语。 “是不是你?” 孩子没答。 “是不是你！” Continue reading “是谁教他说谎？” Author 渡世白玉Posted on 2012年3月24日Categories 文字飘香, 随笔Tags 孩子, 家长, 教育, 说谎3 Comments on 是谁教他说谎？ 我是一颗树——以前无聊所做，没啥价值，仅仅纪念 我是一颗树 却被种在花盆中 我有充足的水分去吸收 却无处供我延伸根须 我有充足的营养 却无处供我壮大身躯 我是一棵树 Continue reading “我是一颗树——以前无聊所做，没啥价值，仅仅纪念” Author 渡世白玉Posted on 2012年3月24日Categories 文字飘香, 随笔Tags 一棵树1 Comment on 我是一颗树——以前无聊所做，没啥价值，仅仅纪念 风云第一刀，失落的泪水——以前无聊所做，没啥价值，仅仅纪念 失落的泪水——悲伤的至高境界 笑， 狂笑又非笑； 泪， 笑中如雨下； 心， 片片地碎裂； 痛， 心碎中消逝！ 莞溪沙 读<<风云第一刀>>有感 Continue reading “风云第一刀，失落的泪水——以前无聊所做，没啥价值，仅仅纪念” Author 渡世白玉Posted on 2012年3月24日Categories 文字飘香, 随笔1 Comment on 风云第一刀，失落的泪水——以前无聊所做，没啥价值，仅仅纪念 现实？梦？——以前无聊所做，没啥价值，仅仅纪念 现实？梦？——雨霏铃 微风轻吹， 暖阳斜照， 鸟语如歌。 行间平坦大道， 抬首处， 杨柳招手。 驻足慢品细尝， 竟为梦中境。 忆昔日。 努力拼搏， 今朝运来梦终成！ 人生自古无定数。 享受间， 风怒云涌， 鸟飞杨柳怒摆。 Continue reading “现实？梦？——以前无聊所做，没啥价值，仅仅纪念” Author 渡世白玉Posted on 2012年3月24日Categories 文字飘香, 随笔1 Comment on 现实？梦？——以前无聊所做，没啥价值，仅仅纪念"
