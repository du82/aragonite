title = "鲍鹏山新说《水浒》经典语录精选之林冲 | 渡世白玉"
description = "① 泼皮太尉 13、《水浒》的作者只不过是借高俅这个人物来表现当时朝廷昏聩、流氓当政的现实而已。 14、“仁义礼智”，才是一个人的本质素养。一个人的素质，决不仅仅在于是否身怀诸多技能以及脑袋中知识总量的多少，还在于他是否有是非心、羞耻心、恭敬心与辞让心。可悲的是，我们今天绝大多数人对素质教育的理解正是高俅式的教育，这是我不得不指出的。 15、特别看重吹弹歌舞、刺枪使棒、相扑玩耍、诗书词赋，把这当成了素质教育，而严重忽略人格教育，忽略仁义礼智的品德教育，忽略是非判断力的培育，不正是今天很多家长的通病？我真担心这样的教育只会培养出高俅式的人物！ 16、生铁王员外的儿子是王员外的儿子，宋徽宗是谁的儿子呢？是天子，也就是天的儿子。王员外会管自己的不肖儿子，天却不管他的人间的这个混账儿子。于是，这个混账儿子就把天下弄成了一本混乱账簿。 17、正是这个世界上讲原则的人太少，讲苟且讲权宜自保的人太多，才让高俅这样的小人步步为营，并且往往最终还一步登天。 18、中国古代封建统治阶级玩这种大赦天下的把戏，一方面伪装自己的仁慈，一方面却是对法律公正的严重破坏。这种大赦对罪犯却是是一种恩典，但对受害者，岂不是一种嘲弄和严重的不公！ 19、这是一个很有寓意的细节。它暗示我们：是朝廷的政令，解禁了高俅这类邪恶人物，使他有机会飞黄腾达，然后坏家坏国坏民。 20、作善恶是非判断的是君子，作利害判断并把利害置于是非之上，就是小人了。 21、他们从自身利害出发的考虑压倒了是非判断，个人的小算盘压倒了做人的大原则，小占了上风，大不见了，大人也就成了小人了。人，也就从打个人小算盘开始，从大人变成小人的！ ② 灾星当头 22、《水浒》是一部英雄传奇小说，与《三国演义》不一样，《三国演义》是历史演义，七分史实，三分虚构，史实占了重头，并且必须基本符合事实。所以，要讲《三国演义》必讲历史，而《水浒》则仅仅借了历史上一些人物的名头和大致事迹，主要都是作者凭空设想结撰出来的。就大的背景言，当然是反映了那个时代，但就具体人物、事件而言，则可以也应该完全抛开历史不论。 23、一个小衙内就能让顺者昌来逆者亡。顺者昌，逆者亡，是权力的基本特征，在这样情形之下，剩下的自然都是顺民。所以，鲁迅先生曾说：中国古代的封建社会培养的是奴才，是顺民，是看客。甚至当我们亡国之后，我们留给占领者的，除了子女玉帛，还有听话的顺民，让他们统治起来很顺心。 24、中国古代特重男女大防，调戏有夫之妇，是大罪，所以林冲大喝此一声时，是义正辞严的，是有所依仗的，他依仗的，就是法律，就是法律背后更强大的中国传统道德。 25、林冲凭借的是道德与法律，不用说是他自己的老婆，即使是他不认识的人，他也有权对高衙内的行为予以制止。但高衙内气势汹汹质问林冲，也有他的凭借。他的凭借就是他那大堂兄兼养父高俅的权势。所以，这一场冲突非常有寓意。 26、弗洛伊德说，那些总是和女人扎堆的男人，实际上是借此躲避男人，因为他们害怕真正的竞争。从弗洛伊德的心理学上讲，他实际上是对男人的世界深怀恐惧，并且毫无竞争的能力与意愿。 27、这个小混混、小白脸、小流氓是高太尉的养子！他自己一钱不值，就是个人渣，但是，他的背后，是权势！而背靠道德法律的林冲一见到背靠高太尉的权势的小衙内，他的手先就软了。什么才是硬的？权势！但这个世界如果都是这样怕权势，这世界多么令人气闷，多么令人绝望？ 28、我们说，林冲一生，只是一个怕字，鲁智深一生，只是一个不怕。 29、在权力社会里，它几乎是所有人的性格、所有人的悲剧。所以，就文学形象言，如果鲁智深的形象是一个类型，而林冲的形象就是一个典型，他是所有这一阶层的典型代表。林冲的形象比鲁智深的形象更有社会深度 30、马克思说，专制政治就是侮辱人，不把人当人。当权力决定一切的时候，一切都会堕落，当权力决定我们命运的时候，如果我们不能逃离，像王进那样；或者脱离体制，像鲁智深那样，我们只有以人格堕落和个人尊严的丧失为代价才能获得可怜的生存权。在林冲身上，我们看到了很多人的人生与性格，甚至，看到了我们自己内心深处深藏的惧怕与懦弱。 31、圆满的生活应该有两个条件：第一，现状是安逸的、从容的；第二，还有更大的发展空间。也就是说，圆满的生活不光包括现在的圆满，而且还包括未来更大的圆满。 32、越是没有安全感，越是要小心翼翼，而越是小心翼翼，便越是没有安全感，人们几乎生活在一个悖论之中，生活在一个恶性循环之中不能自拔，这是真实的轮回。林冲总想委曲求全，但委曲就能求全吗？委曲的结果往往使自己的空间越来越小，能腾挪的自由就越来越少，反抗与自卫的能力就越来越弱，而与此相应的，是社会对你的压迫越来越肆无忌惮。 33、当权力因素加进来以后，一切都失去了重量：因为权力是绝对的重量。在权力面前，强大的林冲不堪一击；有权力撑腰，被酒色掏空的衙内却战无不胜。没权的老虎，不过一个病猫；有权的老鼠，顶得上一头狮子。林冲是老虎，但那又怎样？他无权，轻则刺配了他，重则要了他性命。 34、在绝对权力面前，人的生存权都不会存在，更不用说其他的权利。中国现在又不少人很向往皇权时代，他们根本不知道那是一个连生存权都被皇帝老儿及其各级爪牙捏在手里的时代。看不到这一点，就看不出今昔的差别，就看不出我们今天的进步。 35、把权力这一社会性的因素一加进去，林冲拥有的那一切，瞬间就变得毫无分量，化为乌有，他的优势几乎一下子就蒸发了，而高衙内，却可以得意地奸笑着，为所欲为。 36、读《水浒》，要有道德的眼光，更要有穿越道德的眼光。对人对事，要有道德的判断，更要有超越道德的判断。要明白，很多问题，是人的道德问题；更要明白，很多问题，不仅仅是道德问题。 37、君子尊重权力，而小人利用权力。 38、办法总比困难多，而办法总是人想的，下流的办法是下流人想的。只要你身边有下流人，就不愁找不到下流的办法。 ③ 漫天过海 39、有权力的地方，一定有小人。 40、小人往往比君子更能判断人性，从而利用人性的弱点来达成自己的目的。 41、一部《水浒》，就是写这样的混沌世界、不清平世界，因为这世界不清平，才有三十六天罡星、七十二地煞星，才有他们跑到水浒，跑到梁山泊。好好的世界为什么不待，偏偏要去那水浒？就是因为这世界已不清平。 42、人性有弱点，但人性也有优点。小人之所以常常成功，很多时候，是因为他们特别能利用人的弱点。但小人也成不了大事，并最终失败，那是因为人性中还有优点。 ④ 冲冠不怒 43、在很多人看来，面子是最重要的，里子倒次之。 44、怎么个自欺欺人呢？欺人，我没看见，我没听见。自欺，安慰自己的良心。 45、林冲一家走在这样的大街上，是否会感受到彻骨的寒意？这是大宋的东京城，物华天宝、人杰地灵之处吗？这是四方辐辏、人物繁盛之区吗？这是泱泱华夏的首都吗？为何如此荒凉，如此寒冷，如此苍白？这是世道的荒凉，是人心的寒冷，是道义的苍白！而这，才是东京的真相！是大宋的真相！ 46、能装糊涂的人，一定是最清醒的人，一定是最冷静的人。但是，林冲的这种清醒和冷静，实在不可爱，反而非常可怕。 47、林冲，有时可怜，有时又有些可怕，甚至有些可厌。可怜之人，往往有可厌之处。 48、我忍了，我要吃饭，我要前途，这个人我得罪不起，希望你也理解我。 49、作为一个像在官场往上混的人，有鲁智深这样的朋友，在他看来，既不体面，更会给他带来麻烦。 50、背后捅刀子，是一切小人的拿手绝活。而林冲，偏偏就是一个不知道看看自己背后的人。他很想试庄子嘲笑过的那种人：专注于自己的眼前所得，却忘记自己背后的危险。 ⑤ 磨刀霍霍 51、这堂堂国家的太尉府，里面我藏着的都是一些什么东西啊！从里面走出来的，一个个都衣冠楚楚，一个个看起来都人五人六、冠冕堂皇，好像都是国之栋梁，原来却尽是衣冠禽兽！这是我们想象的庄严肃穆的国家军事机关吗？这是虎窟狼窝！ 52、高太尉干这样缺得得事，是太多了，太容易了。高太尉自从当上太尉，不就一直在干缺得事吗？干缺德事是他的专业，是他的爱好，他做这样缺德的事，不仅毫无法律上的阻碍，毫无道德上的阻碍，甚至毫无心理上的阻碍，他本来就是狼心狗肺！ 53、这高俅真的是恬不知耻，这样的事，他几乎连一丝做作都没有，一点儿虚伪都没有，直接出面，与下属商量这样的阴谋。所以我说他不仅没有良心，连一点儿羞耻心、自尊心都没有。如果他尚有一些自尊心，哪怕他要害林冲，他也可暗示下面的人去做，总不至于自己出面吧！ 54、小人我们见过，但像高俅这样毫无羞耻地赤裸裸地做小人，少见；坏人、恶人我们见过，但像高俅这样好不掩饰地作恶，少见。这小子从小爹妈大概就没教过他是非好歹，后来又没有读过什么书，既无家教又无圣教，从而成为一个彻头彻尾的禽兽。 55、我们知道，我们在平辈面前，在一般同学、朋友面前，往往可以放言无惮，开玩笑，说怪话，嬉笑怒骂，甚至胡说八道，但是，一旦旁边有了师长辈，有了领导，我们就会很注意自己的言语，至少不会再胡说八道。这就是对师长辈或领导的尊重。 56、敬重人、尊重人，就要把他当作君子，而不能把他当作小人，就要和他说正经话，做正派事，而不是拉他下水，和他一起做下流事。 57、一个有道德自尊的人，即使是在对不合礼之事的看和听中，也会强烈地感受到对自己道德品性的侮辱。"
full_description = "鲍鹏山新说《水浒》经典语录精选之林冲 ① 泼皮太尉 13、《水浒》的作者只不过是借高俅这个人物来表现当时朝廷昏聩、流氓当政的现实而已。 14、“仁义礼智”，才是一个人的本质素养。一个人的素质，决不仅仅在于是否身怀诸多技能以及脑袋中知识总量的多少，还在于他是否有是非心、羞耻心、恭敬心与辞让心。可悲的是，我们今天绝大多数人对素质教育的理解正是高俅式的教育，这是我不得不指出的。 15、特别看重吹弹歌舞、刺枪使棒、相扑玩耍、诗书词赋，把这当成了素质教育，而严重忽略人格教育，忽略仁义礼智的品德教育，忽略是非判断力的培育，不正是今天很多家长的通病？我真担心这样的教育只会培养出高俅式的人物！ 16、生铁王员外的儿子是王员外的儿子，宋徽宗是谁的儿子呢？是天子，也就是天的儿子。王员外会管自己的不肖儿子，天却不管他的人间的这个混账儿子。于是，这个混账儿子就把天下弄成了一本混乱账簿。 17、正是这个世界上讲原则的人太少，讲苟且讲权宜自保的人太多，才让高俅这样的小人步步为营，并且往往最终还一步登天。 18、中国古代封建统治阶级玩这种大赦天下的把戏，一方面伪装自己的仁慈，一方面却是对法律公正的严重破坏。这种大赦对罪犯却是是一种恩典，但对受害者，岂不是一种嘲弄和严重的不公！ 19、这是一个很有寓意的细节。它暗示我们：是朝廷的政令，解禁了高俅这类邪恶人物，使他有机会飞黄腾达，然后坏家坏国坏民。 20、作善恶是非判断的是君子，作利害判断并把利害置于是非之上，就是小人了。 21、他们从自身利害出发的考虑压倒了是非判断，个人的小算盘压倒了做人的大原则，小占了上风，大不见了，大人也就成了小人了。人，也就从打个人小算盘开始，从大人变成小人的！ ② 灾星当头 22、《水浒》是一部英雄传奇小说，与《三国演义》不一样，《三国演义》是历史演义，七分史实，三分虚构，史实占了重头，并且必须基本符合事实。所以，要讲《三国演义》必讲历史，而《水浒》则仅仅借了历史上一些人物的名头和大致事迹，主要都是作者凭空设想结撰出来的。就大的背景言，当然是反映了那个时代，但就具体人物、事件而言，则可以也应该完全抛开历史不论。 23、一个小衙内就能让顺者昌来逆者亡。顺者昌，逆者亡，是权力的基本特征，在这样情形之下，剩下的自然都是顺民。所以，鲁迅先生曾说：中国古代的封建社会培养的是奴才，是顺民，是看客。甚至当我们亡国之后，我们留给占领者的，除了子女玉帛，还有听话的顺民，让他们统治起来很顺心。 24、中国古代特重男女大防，调戏有夫之妇，是大罪，所以林冲大喝此一声时，是义正辞严的，是有所依仗的，他依仗的，就是法律，就是法律背后更强大的中国传统道德。 25、林冲凭借的是道德与法律，不用说是他自己的老婆，即使是他不认识的人，他也有权对高衙内的行为予以制止。但高衙内气势汹汹质问林冲，也有他的凭借。他的凭借就是他那大堂兄兼养父高俅的权势。所以，这一场冲突非常有寓意。 26、弗洛伊德说，那些总是和女人扎堆的男人，实际上是借此躲避男人，因为他们害怕真正的竞争。从弗洛伊德的心理学上讲，他实际上是对男人的世界深怀恐惧，并且毫无竞争的能力与意愿。 27、这个小混混、小白脸、小流氓是高太尉的养子！他自己一钱不值，就是个人渣，但是，他的背后，是权势！而背靠道德法律的林冲一见到背靠高太尉的权势的小衙内，他的手先就软了。什么才是硬的？权势！但这个世界如果都是这样怕权势，这世界多么令人气闷，多么令人绝望？ 28、我们说，林冲一生，只是一个怕字，鲁智深一生，只是一个不怕。 29、在权力社会里，它几乎是所有人的性格、所有人的悲剧。所以，就文学形象言，如果鲁智深的形象是一个类型，而林冲的形象就是一个典型，他是所有这一阶层的典型代表。林冲的形象比鲁智深的形象更有社会深度 30、马克思说，专制政治就是侮辱人，不把人当人。当权力决定一切的时候，一切都会堕落，当权力决定我们命运的时候，如果我们不能逃离，像王进那样；或者脱离体制，像鲁智深那样，我们只有以人格堕落和个人尊严的丧失为代价才能获得可怜的生存权。在林冲身上，我们看到了很多人的人生与性格，甚至，看到了我们自己内心深处深藏的惧怕与懦弱。 31、圆满的生活应该有两个条件：第一，现状是安逸的、从容的；第二，还有更大的发展空间。也就是说，圆满的生活不光包括现在的圆满，而且还包括未来更大的圆满。 32、越是没有安全感，越是要小心翼翼，而越是小心翼翼，便越是没有安全感，人们几乎生活在一个悖论之中，生活在一个恶性循环之中不能自拔，这是真实的轮回。林冲总想委曲求全，但委曲就能求全吗？委曲的结果往往使自己的空间越来越小，能腾挪的自由就越来越少，反抗与自卫的能力就越来越弱，而与此相应的，是社会对你的压迫越来越肆无忌惮。 33、当权力因素加进来以后，一切都失去了重量：因为权力是绝对的重量。在权力面前，强大的林冲不堪一击；有权力撑腰，被酒色掏空的衙内却战无不胜。没权的老虎，不过一个病猫；有权的老鼠，顶得上一头狮子。林冲是老虎，但那又怎样？他无权，轻则刺配了他，重则要了他性命。 34、在绝对权力面前，人的生存权都不会存在，更不用说其他的权利。中国现在又不少人很向往皇权时代，他们根本不知道那是一个连生存权都被皇帝老儿及其各级爪牙捏在手里的时代。看不到这一点，就看不出今昔的差别，就看不出我们今天的进步。 35、把权力这一社会性的因素一加进去，林冲拥有的那一切，瞬间就变得毫无分量，化为乌有，他的优势几乎一下子就蒸发了，而高衙内，却可以得意地奸笑着，为所欲为。 36、读《水浒》，要有道德的眼光，更要有穿越道德的眼光。对人对事，要有道德的判断，更要有超越道德的判断。要明白，很多问题，是人的道德问题；更要明白，很多问题，不仅仅是道德问题。 37、君子尊重权力，而小人利用权力。 38、办法总比困难多，而办法总是人想的，下流的办法是下流人想的。只要你身边有下流人，就不愁找不到下流的办法。 ③ 漫天过海 39、有权力的地方，一定有小人。 40、小人往往比君子更能判断人性，从而利用人性的弱点来达成自己的目的。 41、一部《水浒》，就是写这样的混沌世界、不清平世界，因为这世界不清平，才有三十六天罡星、七十二地煞星，才有他们跑到水浒，跑到梁山泊。好好的世界为什么不待，偏偏要去那水浒？就是因为这世界已不清平。 42、人性有弱点，但人性也有优点。小人之所以常常成功，很多时候，是因为他们特别能利用人的弱点。但小人也成不了大事，并最终失败，那是因为人性中还有优点。 ④ 冲冠不怒 43、在很多人看来，面子是最重要的，里子倒次之。 44、怎么个自欺欺人呢？欺人，我没看见，我没听见。自欺，安慰自己的良心。 45、林冲一家走在这样的大街上，是否会感受到彻骨的寒意？这是大宋的东京城，物华天宝、人杰地灵之处吗？这是四方辐辏、人物繁盛之区吗？这是泱泱华夏的首都吗？为何如此荒凉，如此寒冷，如此苍白？这是世道的荒凉，是人心的寒冷，是道义的苍白！而这，才是东京的真相！是大宋的真相！ 46、能装糊涂的人，一定是最清醒的人，一定是最冷静的人。但是，林冲的这种清醒和冷静，实在不可爱，反而非常可怕。 47、林冲，有时可怜，有时又有些可怕，甚至有些可厌。可怜之人，往往有可厌之处。 48、我忍了，我要吃饭，我要前途，这个人我得罪不起，希望你也理解我。 49、作为一个像在官场往上混的人，有鲁智深这样的朋友，在他看来，既不体面，更会给他带来麻烦。 50、背后捅刀子，是一切小人的拿手绝活。而林冲，偏偏就是一个不知道看看自己背后的人。他很想试庄子嘲笑过的那种人：专注于自己的眼前所得，却忘记自己背后的危险。 ⑤ 磨刀霍霍 51、这堂堂国家的太尉府，里面我藏着的都是一些什么东西啊！从里面走出来的，一个个都衣冠楚楚，一个个看起来都人五人六、冠冕堂皇，好像都是国之栋梁，原来却尽是衣冠禽兽！这是我们想象的庄严肃穆的国家军事机关吗？这是虎窟狼窝！ 52、高太尉干这样缺得得事，是太多了，太容易了。高太尉自从当上太尉，不就一直在干缺得事吗？干缺德事是他的专业，是他的爱好，他做这样缺德的事，不仅毫无法律上的阻碍，毫无道德上的阻碍，甚至毫无心理上的阻碍，他本来就是狼心狗肺！ 53、这高俅真的是恬不知耻，这样的事，他几乎连一丝做作都没有，一点儿虚伪都没有，直接出面，与下属商量这样的阴谋。所以我说他不仅没有良心，连一点儿羞耻心、自尊心都没有。如果他尚有一些自尊心，哪怕他要害林冲，他也可暗示下面的人去做，总不至于自己出面吧！ 54、小人我们见过，但像高俅这样毫无羞耻地赤裸裸地做小人，少见；坏人、恶人我们见过，但像高俅这样好不掩饰地作恶，少见。这小子从小爹妈大概就没教过他是非好歹，后来又没有读过什么书，既无家教又无圣教，从而成为一个彻头彻尾的禽兽。 55、我们知道，我们在平辈面前，在一般同学、朋友面前，往往可以放言无惮，开玩笑，说怪话，嬉笑怒骂，甚至胡说八道，但是，一旦旁边有了师长辈，有了领导，我们就会很注意自己的言语，至少不会再胡说八道。这就是对师长辈或领导的尊重。 56、敬重人、尊重人，就要把他当作君子，而不能把他当作小人，就要和他说正经话，做正派事，而不是拉他下水，和他一起做下流事。 57、一个有道德自尊的人，即使是在对不合礼之事的看和听中，也会强烈地感受到对自己道德品性的侮辱。 58、君子大意，小人小心。君子为什么又叫大人？就是因为他老是大意；小人为什么叫小人，因为他总是怀揣着那一颗小心！ 59、人有爱好，便有破绽，便有弱点，而小人正善于利用你的喜好，攻其所好，最后打败你。 ⑥ 命悬一线 60、我们可以想象，在太尉府里，在白虎节堂，只要高太尉喜欢，只要高太尉吩咐，那里还有什么人讲什么良心，讲什么是非，讲什么礼义廉耻，这里，一切都听从高太尉权力魔杖只会，在高太尉的权利魔杖指挥之下，这些人都成了魔鬼！ 61、孙定这番话，虽然不多，但却字字有震撼，句句有刺痛。它不仅提醒了滕府尹自己的职责所在，甚至提醒了滕府尹自己的自尊所在，从某种意义上说，还激起了滕府尹对高太尉的怨恨愤懑：我也是一个堂堂的朝廷命官，为什么你总是把我当成你的走狗？你要杀人，为什么要我执刀？你害人得利，为什么让我替你做恶人？ 62、做个好人，不仅要有意愿，而且还要有能力，有做好人的方法。 63、我们看惯了权势的战无不胜，我们终于看到，正义也不是全无用处、全无作为，正义也有自己的力量，只要时机到了，正义也有自己的胜算。 64、实际上，一部《水浒传》都是如此：坏人玩弄法律以害人，好人玩弄法律以救人。法律在《水浒传》中只是一个儿戏。更严重的问题是，我们看到坏人玩弄法律以害人时，我们只恨坏人阴险奸诈，只从道德角度给他一个判决，而对其玩弄法律违法乱纪并不十分在意。而当好人玩弄法律以救人时，我们更是拍手叫好，连连称快，而对法律之被践踏之被篡改之被糊弄，不但不惋惜，反而很高兴。 65、当法律被权势者作为玩偶时，全社会都不会认真地把法律当回事，奉公守法的就是傻子，信任法律依靠法律的，更是天真。社会到了这一步，当然是上层实行强权政治，下层横行的全是流氓！而这，不就是《水浒传》描写的宋代的社会现实吗？！ ⑦ 流血之途 66、什么是英雄？在人民需要的时候挺身而出才是英雄；在邪恶横行时敢于斗争才是英雄，像林冲这样，高衙内在他眼皮底下作恶多年，他不敢制止，普通百姓被高衙内侵害多年，他没能保护，只是希望这灾星不要降临到他头上，并且自以为凭自己的身份，这份灾祸不会落到自己头上，这哪里能算是英雄呢？真正的英雄，一定是这样的：他不仅反抗加之于自己的不公，他还反抗加之于别人的不公。他不仅为自己争取正义，他还为他人主持正义。比如说，鲁智深，就是这样的人。他是天生的英雄，天赋他一颗正义之心、包天之胆、绝世武功，他一出场，就是英雄，他一出手，就是精彩。而林冲，乃是人间打造的英雄，是逼成的英雄，他本来真的不是英雄，也不想做英雄，只想做官。他已经被这个体制，被这个社会揉捏得无骨骼、无胆气、无血性，甚至连正义感都没了。他有英雄的材质，却无做英雄的愿望；有做英雄的能力，却无做英雄的勇气。因为他有英雄的材质和能力，我们就误以为他是英雄，其实他早已经被体制奴化了，只要灾祸不降临到他头上，他永远都是顺民。如同在深夜，强盗杀进了屋子，挨着床杀过来，只要还没杀到他头上，他就假装睡着了，决不会出头，出手。 67、只有反抗施加于一切人身上的奴役与迫害，才能最终保护自己不受奴役与迫害。 68、不允许有人奴役别人，才能最终避免自己被人奴役的命运。鲁智深身上的优点，或者说，那种英雄的气质，在林冲身上，是比较缺乏的。 69、正像鲁迅先生后来沉痛地揭示的一样，在这样的国度，只有两种人：示众材料和麻木的看客。只是，他以前是麻木的看客，冷漠地看着示众材料；现在自己成了示众材料，眼前都是麻木的看客。 70、林冲是《水浒》一百零八人中内心最苦的人、最郁闷的人、最黑暗的人。 71、当一种恶强大到我们无法推翻，或反抗的代价超过忍受的代价时，人们就可能选择忍受与妥协，并在心理上倾向于把这种恶看成是自己的宿命而加以接受。长期下去，习惯成自然，恶就变成一种客观的并且合理的存在了。 72、在受到不公时，在被欺凌侮辱时，只怨天不尤人，是一切弱者的基本思维方式，同时，我们要看到在一个体制无所不在地强大，在一个权力无孔不入地主控社会一切活动时，充斥于社会的，都是这种弱者。个别的强者，只能逃到王土之外，去水浒，不做王臣，去做强盗。 73、当我们对坏人的怕压倒了根，畏惧压倒了愤怒，我们不就只有屈服一途？ 74、一个人，一旦被对方彻底打败，被对方彻底控制，对对方无比恐惧，对方越是压迫他，他越是要表现出忠心耿耿的样子，甚至帮着对方出主意，保护对方。这种现象，现代心理学把它称之为“斯德哥尔摩情结”或“斯德哥尔摩综合症”。所谓斯德哥尔摩综合症或情结，是指犯罪事件的被害者对于犯罪者产生情感，甚至反过来帮助犯罪者的一种情结。 75、斯德哥尔摩情结的本质在于：在加害者处于完全优势的情况下，被害者不能逃离加害者圈定的博弈母系统。加害者行为在本质上的不正当性就被忽略，而生存第一的首要目标就会导致被害者产生合作的行动。 76、在权力社会里，权力拥有者处于绝对的优势，被权力侵害的人无法摆脱权力这个母系统，于是，权力拥有者行为的不正当性就被忽略。而为了生存，为了不至于招致更大的迫害，受害者就会产生与施害者合作的冲动，并对施害者没有采取更极端的伤害心存感激。 77、林冲自始至终，他都只担心自己：先是担心自己的名誉受损；后是担心自己的前程被毁；现在是担心自己的性命被害。 78、他不是不向林冲屈服，恰恰相反，他这样做事在为林冲着想，是在为林冲维护他的生活，维护他的家庭，维护他的世界，他是不向这个邪恶的世道屈服，不向高太尉、高衙内屈服！ ⑧ 心腹大人 79、林冲的很多做法不符合人之常情，他的很多想法更是非常扭曲，是什么扭曲他了呢？是体制！ 80、就文学形象而言，林冲这个人物形象要比鲁智深这个形象更有内涵，更有价值，更有一种认知上的意义，因为他更加典型。在权力社会里，大多数人都可以在他身上找到自己一些影子，从人性的缺点这方面来看，大多数人都是部分的林冲、全部的林冲，甚至比林冲还要林冲！大多数人极可能没有鲁智深的优点，但一定或多或少地有着和林冲一样的缺点。因为，大家处在相同的处境里，有相同的遭遇。 81、在封建集权时代，王权所到之处，只有奴隶和奴才！林冲哪里是英雄！他只不过是想做奴才而不得罢了！ 82、不认识人没问题，只要认识金子。黑眼珠见不得白银子，何况是金子？这世上的人，还就是认人的不多，认金子的多。 83、在人治时代，“心腹人”是最吃香的，也是最重要的，当官的要有心腹人，才有抬轿子的，才有鹰犬爪牙；而只有成为权豪势要的“心腹人”，才能吃香的喝辣的，狐假虎威以压迫他人，攀龙附凤以鸡犬升天。 84、薛霸这个小人，他非常明白两点：第一，只要是做高太尉要你做的事，杀人放火都没有问题。第二，如果不做高太尉要你做的事，那倒真的会有大问题。 85、当权力可以这样控制人和社会时，在这样理念下建立的制度与社会运作秩序，实际上就是对全民的绑架！这多么可怕！它彻底扭曲了人心、人格！ 100、培根说：“嫉妒是人类一切情欲中最顽强、最持久的，是一种卑劣下贱的情欲，是恶魔的素质。”嫉妒恰恰比较密集地发生在亲近而又有共同利益竞争者这里。诸如同学、同事、同行、甚至同乡，都是嫉妒的高发人群。 101、嫉妒有三个原因，我们可以把它称为“嫉妒三定律”：一、不能容忍别人拥有自己没有的东西——优先性。二、不能容忍别人夺走原由自己占有的东西——私有性。三、不能容忍别人分享原由自己独占的东西——排他性。 102、一朝之忿，是可以摧残一个人的判断力与自制力的。 103、康德曾经说：“生命是拿别人的缺点惩罚自己。”那么，我要说，嫉妒是拿别人的优点惩罚自己。拿别人的缺点惩罚自己的，往往使君子。而拿别人的优点惩罚自己的，一定是小人。君子生气，可能止于生气。小人嫉妒，虽然他先惩罚了自己，使自己在嫉妒的烈火中煎熬，但他最后的目的，一定是毁灭别人。 ⑪ 钱可使鬼 104、在中国，在元明之际，《水浒传》的作者就塑造出了差拨这一变色龙的形象，而且似乎更精炼、更突出，而且更真实、更可信、更自然！ 105、中国有一个词，叫“值钱”。一个东西好不好，怎么判断？拿钱来衡量。不值钱，就没人看重了。 106、大家一起做戏，一起看。大家都是演员，又都是观众。这是什么文化呢？这是做戏文化。只要演了戏了，程序就有了。程序有了，就算数了。这是典型的自欺欺人的文化。 107、《水浒》中的林冲故事有两大看点：一是权，二是钱。在权力的播弄下，在金钱的魔力下，林冲委曲求全却仍避免不了最后家破人亡的厄运。 108、金子出手，良心可买；金钱到手，良心可卖，岂不可叹！ 109、这规矩就是有金子就可以害人，拿了钱就可以帮人杀人，这世道有这样的规矩，不是太可怕吗？不是让人拍案惊叹吗！ 110、“酒食钱财便是福”，这出自普通庄客之口，但正是因为出自普通人之口，才可见这种观念如何普及，才可见钱财在一般人心目中的地位，才可见世道人心。 111、银子面前，国家法度也不堪一击。 112、银子可乱人心，银子可夺人志。 113、君子也好，小人也罢，银子面前，都会动心。 114、千古以来，对人物的甄别鉴定，有时一个月就变了，有时一天就变了，以前说好的，变成不好了，以前说歹的，变成好的了。为什么变了呢？因为银子！ 115、下级对上级，都如此昧了对方的银子，有银子处，哪有可以信赖的关系呢？ 116、人的名声，往往借银子而成就。 117、银子可以让人死，也可以让人生，生生死死，都关乎银子，岂不可叹！ 118、女子守志，是传统道德的楷模，但这楷模，却还要银子支持，失节固然事大，但是若守志而不免于饿死，则守节之人也往往守不住，可见道德也要银子支持。 119、可怜之人，未免更大迫害，亦只能以银子讨人欢心。 120、兄弟相爱，亦少不得银子。 121、英雄无奈之时，不得不屈就小人，可为一叹！而英雄之屈就小人，亦只能以银子表示，又是一叹！ ⑫ 委曲求全 122、他此时心里盘算的，不是逃离，不是反抗，而是如何将就，如何安顿。真令人放声一哭！这间破草屋简直可以看成是这个残破世界的象征，这破世界让林冲如何过得一生？而且这破世界又哪里容得林冲修理？那背后的大阴谋正要修理林冲呢！让林冲过不完一冬的，哪里是这摇撼得动的草屋？一会儿，这草屋将和他一起化为灰烬。他兀自不知，还在想着委曲求全，还在想着将就着在这寒冷的世界寻些温暖——这不就是一般人的生存现状与生存哲学？ 123、酒是我们和这世界妥协的又一理由和条件。酒调动的是我们自身的体温，却让我们感谢世界的温暖。有多少人在酒中消磨了自己，消磨了雄心。 124、在现实生活中，以酒亡国者倒不多，以酒亡身者却比比皆是。这亡身，也不一定是死亡之亡，而是在酒中麻醉、麻木、沉沦。酒壮懦夫胆，酒消英雄志啊！ 125、林冲不是一个具有强烈反抗精神的人。甚至可以说，他不是一个忧国忧民的人。在自己遭到高俅迫害之前，他压根儿就没觉得高俅式奸贼，他一直和高俅保持着良好的关系，甚至想和你套近乎。总之，林冲只是一个温顺的良民，一个尽职的专业人员，一个听话的下僚。 126、实际上，林冲此时的心态，没有多少怨，没有多少恨，没有多少激愤，没有多少不平，他只有一丝惶恐，一丝自怜，外加随遇而安将就着过的心态。他当然不喜欢现状，但他不是要用反抗的手段打破现状，他要的是，老实服刑，乖乖听话，慢慢磨出头。所以，我们读风雪山神庙中的林冲，也只是觉得他可怜，一个大英雄，或者说，一个有着一流英雄素质的人，在这样的状态下，也能将就，也能委屈，而且还没有什么怨恨，他让我们心里有一种绝大的反差，绝大的遗憾，绝大的感慨。在这种反差中，我们为他不平，为他愤怒，为他洒一把同情之泪。 127、女性读者，在梁山好汉里，一定最爱林冲：林冲的软弱和不幸可以激发她们母性的同情心；林冲的英武和豪杰又能引起她们的爱慕心；林冲的超强自制力和冷静的判断力又给她们极大的安全感。 128、会看小说的人，一定要看细节，不要光看情节。一般而言，细节描写有两个目的：一、为下文埋下伏笔。二、暗示人物心理，体现人物性格。 129、我们从这些有条不紊的动作里，可以看出：一、林冲有力量。二、林冲无反心。即使在这样的狼狈和仓惶里，林冲仍然有条有理，仍然从容不迫，沉得住气，耐得住性子，稳得住，把得牢，有定性。心不烦，意未乱，仍从容。林冲，有一种深藏不露的力量。 130、在这个世界上，几乎已经一无所有的林冲，还如此珍惜并牢牢守住他此时拥有的破烂。 131、林冲是一个有着强烈庸人气息的大英雄，也是一个具有英雄素质的庸人。问题在于，这个世界，是要他做一个温驯的安分守己的庸人，还是逼着他去做一个叛逆的刀刀见血的英雄？ 132、林冲，此时就像是一个鬼，在黑暗的古庙里，独饮，让我们在想象中，毛骨悚然。是高俅父子，让他变成了鬼。但，这是一个索债的厉鬼！ ⑬ 快意恩仇 133、柴进的书信，也就只值一锭金子，而高太尉出的价高过了一锭金子，高太尉还能让他做大官。当然，他还明白的是：得罪了柴进，没有什么关系，得罪了高太尉，就只有死路一条了。 134、林冲为何不抱怨？就是因为林冲害怕有更大的灾难在某处潜伏。林冲已不奢望这世界变得稍好，只祈愿它不要变得更坏。对这个世界的道德品质，林冲已经完全没有了信心。 135、他将最后证明：自己到底是一个真正的英雄，还是一个万劫不复的懦夫？反抗，还是再次屈服，这是一个问题！ 136、至此，林冲才明白，一切退让忍受、委曲求全都无济于事，都换不来他们的善心，都不能让他们放过自己，哪怕什么都让他们拿走，他们还是要取他的性命。 137、林冲，终于幡然猛醒，他的血性，他的勇气，他的杀气，一齐爆发出来，一个那么愿意妥协的人，那么愿意认输的人，终于被逼成了一个血腥的杀手！他曾经的胆怯，曾经的懦弱，曾经的无能，都焕然冰释，在人生的绝境上，摇身一变，他成了一个真正的英雄！ 138、中国有句成语，叫“恶贯满盈”，那意思就是，当你造恶造到满盈之时，也就是报应到来之日。 139、不给别人活路，自己也就没有活路。 140、人之上，还有天！人在做，天在看！ 141、杀人者将被杀，被杀者将杀人。 142、高俅之所以能如此为所欲为，又是因为他有可以控制、挟制他人的权力。很多表面上的道德问题，其实都是权力问题，是权力运作中的问题。 143、像陆虞候、富安、差拨这样恶贯满盈之辈，不杀不足以平民愤，不杀不足以明道德，不杀不足以护法律，所以，绝无宽宥之道，他们只有死路一条。 144、林冲心中了无牵挂，身外一丝不挂，身如飘蓬，心如死灰，曾经的小心在意，曾经的委曲求全，曾经的逆来顺受，都灰飞烟灭。 145、“被与葫芦”，是安寝与享受，这两样象征他与这个世界和谐共处的东西被丢弃；“提了枪”，“枪”是冲突与决杀，这一样象征他与这个世界决绝、为仇的东西却被握在手中。从此，花枪上挑着的，就不再是酒葫芦，而是人头了。 146、小家庭如花美眷的温柔乡住不成了，住到牢城营的天王堂，天王堂住不成了，住到草料场，草料场住不成了，住到荒郊古庙，只要还能下有立锥之地，上有片瓦遮身，林冲都会妥协。但是，现在什么也没有了，厚地高天，茫茫大宋，就是没有林冲的安居之所！既然这样，他也就只能人在路途，漂泊江湖，浪迹天涯了。 147、这个世界不是对林冲关上了门，而是这个世界根本就没了门。林冲要做的事，不是去找一把钥匙，然后紧紧捏住它，像握住自己的命运，然后试着打开某扇门。林冲要做的事，是在这个世界之外，找一片天地，然后安身立命。这个地方，不在“率土之滨”，不在“溥天之下”，而在“水浒”，在王化之外，在现有的体制之外。 148、林冲觉今是而昨非，他没有了幻想，没有了希望，在绝望中，一个最忠心耿耿又小心翼翼的人，成了反叛者。一个最无做英雄愿望的人，就这样被逼成了英雄。 ⑭ 逼上梁山 149、它体现了逼上梁山的主题，从而揭示出乱自上作的社会现实。 150、梁山泊，就是作为王土的对立面而存在的。水浒，也就是王化之外；而《水浒传》，也就是这些被王权抛弃、迫害、追杀的族群的传记！ 151、这不是《水浒》的作者故意批评赵员外和柴进，而是《水浒》作者的黑色幽默。他让我们在笑中有泪，泪中又有笑。 152、林冲已经无路可走，他只有上梁山。这，就叫逼上梁山。 153、在朝廷，被陷害。在江湖，也无路。做好人，做不了；做强盗，也如此难！八个字：报国无门，叛国无路！ 154、国家国家，人所赖以托身的地方，现在，对林冲而言，都没了。 155、仗义、朴忠，确实是林冲的两个基本的优点。仗义，有时候需要大打出手，比如鲁智深，需要明火执仗，需要剑拔弩张。但有些时候，偃旗息鼓也是仗义的一种，容忍退让、拱手作揖，也是仗义，这就是林冲式的仗义。这个朴忠，还有愚忠的味道，不到万不得已，绝不反抗。而他的身世确实如浮梗，在惊涛骇浪中沉沉浮浮。功名就更不用说了，不用说现在，就是当初，也不过一个教练而已，从来无根无据如同随风飘荡的蓬草，根本就没有得到过用武之地。但是，最后两句，却显示出他的英雄气概：他还有志，他更有威，缺少的，只是时机而已！ 156、我们常常说，天无绝人之路。但是，人生的路，常常面临绝境。因为，总有人，要绝别人的路。人类社会自从有了阶级，有了国家这种一个阶级压迫另一个阶级的工具以来，总有一些制度，以绝别人的路为目的。人创造出体制，又反过来受体制的压迫，这是人生荒谬的根源之一。封建的国家是压迫人的体制。梁山一旦成为一种组织，也就是一种体制。 157、朝廷理当重用而不用，推英雄入江湖，使英雄怨望，使江湖势大。这样的朝廷，不亡何待？ 158、显然，他对林冲毫无同情心，毫不关心，这样一个自身也颇有坎坷的人，对他人的苦难毫无怜悯，这种人，如果占据江湖，岂不是让江湖也变成朝廷，变成官场，变成冷酷无情、尔虞我诈的所在？ 159、我们一般人的思想里，总觉得自身的弱点会影响自己的成功。但是，在很多的时候，让我们栽跟头、受排挤、遭打击的，恰恰是因为我们自身的优点。 160、庄子说：“人皆知有用之用，而不知无用之用。”其实这句话也正包含着愤懑与不平！ 161、去处不小，是他的心眼儿小，志向小，眼界小。梁山在晁盖手下，就大了。到宋江手下，更大了。没有小地方，只有小人物。 162、有常识，未必能做大事，成大业，但是，至少可以做个过得去的人。什么叫过得去的人呢？能让别人过得去，自己也就能过得去。 163、做人简单一些。什么叫简单一些呢？该做的，就做，不要想得太复杂；不该做的，就不做，也不要想得太复杂。一段时间过后，检点一下自己的所作所为，我们发现，该做的，我们都做了，不该做的，我们都没做。这就是成功。反过来，那些把事情做得复杂的人，是怎么样的呢？该做的，想了想，不做了。不该做的，想了想，做了。看起来，他比别人考虑得多，似乎聪明，但是，一段时间过后，检点一下自己的人生，该做的，很多没做；不该做的，倒做了不少。到底谁是真正的聪明人？ ⑮ 笑傲江湖 164、做官，不行。做强盗，竟然也不行。做官，要缺德；做强盗，竟然也要缺德。 165、王伦笑了。这是小人得意的笑，是一个豪无心肝的笑，是一个该死的笑！能对一个如此不幸的人这样笑的人，他确实该死了，就快要死了。王伦也是一个不得志的，是个不及第的秀才，因鸟气合着杜迁来这里落草。当初也是无处安身的，一旦他有了一个地盘，他同样毫不怜悯走投无路的人！这王伦，如果他真的及了第，做了官，还不是又一个高俅？ 166、林冲原来在高俅那里受气，现在在王伦这里受气。改变的只是场合。要改变林冲的命运，还得等机会。而机会终会来。 167、也许第一次伤害，人能忍了，认了，但是，当你再去揭他的伤疤时，让他重新面对他曾经的伤痛时，他的反应比当初在他身上留下创伤时还要激烈——揭疤之痛胜过初创之痛。 168、林冲是一个非常依赖外在强权的人。 169、自己小家子气的人，也往往倾向于用小家子的方法去对待他人。当初拿银子打发林冲，如果说是侮辱英雄；今天又用银子打发晁盖等人，就只能显示他自己的可笑。 170、有常识就是过得去的人，王伦小聪明太多，忘了常识，放人不过，今天报应不爽，别人放他不过了。 171、一个人，还在喘气，但是，他已经死了。这个人还在梦中。梦中的王伦，可怜的秀才，喘气的死人。《水浒》写人，常常写得一个人极其可恨可恶之后，又不知不觉写出他们的可怜来。这当然是作者手段的高强。可不也是生活的本来样子？正如可怜之人往往有可恨之处，可恨之人更常常是可怜之辈。 172、“这梁山泊便是你的”，只要遵循同样的逻辑，我们也可以对皇帝说：这天下便是你的！敢反诘“这梁山泊便是你的”，便可以杀王伦，便可以做林冲。林冲让梁山焕然一新。敢反诘“这天下便是你的”，便可以推翻帝制，便可以做孙中山。孙中山让中国走出了二千多年的黑暗。林冲的这句话之所以振聋发聩，就在于，在那样的时代，天下还真的就是皇帝老儿的。所以，才会有水浒，才会有英雄好汉无处安身而去安身水浒，才会有《水浒传》！ 173、这是林冲一生最为辉煌的时刻，这个一直被动、被别人主宰的人，这个性格一直比较沉闷、不显山露水的人，这时却主宰了梁山的命运，改变了梁山的历史，而他自己，也一时间痛快淋漓，头角峥嵘，大英雄的风范在瞬间得到充分展示。 174、林冲娘子是《水浒传》中唯一可爱的有女人味的女性，美丽贤惠，善解人意，忠贞坚定。林冲不能保全她，她没有埋怨；林冲要杀陆谦，她担心丈夫惹祸，反而宽慰丈夫。可是，丈夫一纸休书，把她推给高衙内，从此以后，她几乎独自对抗高衙内，不但没有了丈夫的保护，而且没有了拒绝高衙内的理由。她的自缢而死，既是对高衙内的抗争，也是对林冲的怨恨绝望。她的悲剧的一生，碰到两个男人：一个懦弱的男人，一个淫邪的男人，这两个男人，就是她的命运。林冲潸然而下的泪、晁盖等的怅然嗟叹，是《水浒》全书中所有男性唯一一次为女性流泪和嗟叹。 175、我们讲林冲，经常把他和鲁智深作比较。鲁智深是一个把复杂的事情弄简单的人，林冲是一个把简单的事搞复杂的人。鲁智深是怎样把事情弄简单的呢？简单地说，他只对人和事作是非判断。有了是非判断后，他马上付诸行动。林冲是怎样把事情弄复杂的呢？复杂在于，他在是非判断之后，还要进行特别复杂繁琐的利害判断。在鲁智深眼里，人生无坏事，天下无大事。无论什么事，反正不怕事。而在林冲眼里，人生太多事，天下皆难事。无论什么事，都是烦恼事。鲁智深是个莽撞人，林冲是个精细人。但是，偏偏这个莽撞人最终获得了圆满，精细人却终身遗憾。 原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/709124224 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Tags 林冲"
