title = "人生，关于人生——古龙妙论精选（经典语句） | 渡世白玉"
description = "人生的风景， 该以怎样的笔墨去形容， 又该以怎样的目光去审视， 以怎样的灵魂去容纳？ 人生并不是永远都像想象中那般美好的：生命中本就有许多无可奈何的悲哀和痛苦。 路本是同样的路，只在乎你怎么样去走而已。人生的路也是这样子的。 生命本身就是场战争，大大小小，各式各样的战争。 无论什么样的门，都能推得开的，也看你肯不肯去推，看你上不上去推而已。 生在帝之家，有时也并不是件幸运的事。“愿生生世世莫再生于帝王家”，这句话的辛酸也不是普通人能体会得到的。棋局就是人生，只要一着走错，就非错不可。 人生岂非也正如一局棋，输赢又何必太认真呢？ 生命本来就是无可奈何的，生不由己，死也不能由己。 人在江湖，就好像花开枝头一样，要开要落，要聚要散，往往都是身不由己的。 为什么在生命中流动得最美的一些韵律，总是不能长久？ 能够飞是件多么美妙的事，像鸟一样自由自在的飞来飞去，飞过一重重山峦，飞过一重重屋脊，飞过手里总是拿着把戒尺的私塾先生的家，飞过那条拼了命也游不过去的小河。醒来时虽然还是软绵绵的躺在床上，那种会飞的感觉却还是像刚吃了糖一样甜甜的留在心里。 世界上有很多事都是这样子的，生命中本来就有很多不如意不好玩的事会发生，谁都无法避免。可是，一个真正懂得享受生命的人，总会想法子去改变它。健康，本也就是“美”的一种。 一个人如果大有名了，就难免会有很多不必要的烦恼，如果他要完全摆脱这种烦恼，最彻底的一种方法就是“死”。世界上本没有绝对的事情，但“时间”是不是例外呢？在有些人的感觉中，一天的时间，仿佛很快就已过去。因为他们快乐，勤奋，他们懂得享受工作的乐趣，也懂得利用闲暇，所以他们永远不会觉得时间难以打发。在另一些人的感觉中，一天的时间，过得就好像永远过不完一样。因为他们悲哀愁苦，因为他们无所事事，所以才觉得度日如年，但无论人们怎么样感觉，一·天就是一天，一个月就是一个月。 一个人只要能时常想开些，他活得就会比别人开心了。 世上只有时间不会因为任何人、任何事而改变的。但时间却可以改变很多事，甚至可以改变一切。 有种人只有在帮助别人的时候，生活才会变得有乐趣，有意义，否则他自己的生命也会变得全无价值。 只要你的心宁静快乐，人间也有天堂，而且就在你眼前，就在你心里。 心怀愤恨的人，是永远看不见天堂的。 只要是人，就是平等的人。谁也没有权利剥夺别人的尊严和生命。 绝代名侠，其实也和普通人一样，也有他的烦恼和不幸，只不过这些事都已被他耀目的光辉所掩。人们只能看到他的光彩，却忘了有光的地方必有阴影。 不管怎样，一个人能被称为“大侠”，都不是件简单的事。 冥冥中仿佛真的有种神秘的力量，在主宰着人类的命运，绝没有任何一个应该受惩罚的人，能逃过“它”的制裁。 这种力量虽然是看不见，摸不到的，但是每个人都随时可以感觉到它的存在。 无可奈何这四字看来虽平淡，其实却是人生中最大的悲哀，最大的痛苦。 既然到头来迟早总要幻梦成空，又何必太辛苦挣扎奋斗？但生命的意义，本就在奋斗。 你并不一定要等着享受奋斗的果实，奋斗的本身就是快乐，就是种享受，那已足够补偿一切。 所以你耕耘时用不着期待收获，只要你看到那些被你犁平了的土地，被你铲除了的乱石和莠草，你就会觉得汗并不是白流的。你就会觉得有种说不出的满足。 只要你能证明你自己并不是个没有用的人，你无论流多少汗，都已值得。 这就是生命的意义，只有懂得这意义的人，才能真正享受生命，才能活得快乐。 世界上本就有很多事，看来仿佛是巧合，其实你若仔细去想一想，就会发觉那其中一定早已种下了“前因”。 高手中永远还有高手，一个人若是做了天下第一高手，死得也许反而比别人快些。 一个人活在世上，做的事若是他想做的，他岂非就已应该很满足。 一个人无论活多久：，只要他的确有些事值得回忆，就不算白活。 只可惜人生不如意事十常八九，老天做的事通常都不会尽如人愿。 得失之间，本就没有绝对的规则，所以一个人也最好不必把它看得太认真； 一个人若要往上爬，就得要吃苦，要流汗，可是等他爬上去以后，就会发觉他无论吃多 少苦，无论流多少汗，都是值得的。 若要往下跳，就容易多了。 无论从哪里往下跳都很容易，而且往下坠落时的那种感觉，通常都带着种罪恶的愉快。 直到他落下去之后，他才会后悔，因为下面很可能是个泥沼，是个陷阱，甚至是个火坑。那时他非但要吃更多苦，流更多汗，有时甚至要流血。 一个已经拥有一切的人，还有什么乐趣？这个世界上还有什么值得他去奋斗争取的事？ 那么他活着是为了什么呢？难道只不过是为了“活”而活？一个人生命中一定要有一些值得他去奋斗争取的目标，这个人的生命才有意义。 生命中本来就有很多事的价值是无法估计的，还有很多事甚至无价。 一个人若是生活在一个完全不发挥他能力和才干的地方，他一定会渐渐陷沉下去，就算还能活下去，也和死相差无几。 人在回忆中，时间往往会过得很快的，所以有些孤独的老人只有生活在回忆里，才能度过漫长寂寞的晚年。 一个人变得自言自语的时候，就说明他已老了。 想象永远比实际更美得多的。 只有笑声才是对付困难和不幸的最好武器。平静就是幸福。 幸福也不是绝对的。你眼中的幸福，在别人眼中也许是不幸。人生中还有什么事比“忘 记”更困难。 不幸的是，人类最大的悲哀，就是人们常常会想一些自己不该想起的人和不该想起的事。 “超越”决不是件简单的事，更不容易，无论你要超越什么，都一定要付出代价。"
