full_description = "QLib7z：Qt对7z格式解压的封装 QLib7z还是上次做一个项目的时候需要压缩和解压文件，考虑过7z，和QRunInfo一起从从Qt-Installer-Framework中提取的。继承提取源的协议：LGPL。后来上面决定用的是zip格式，也就没用到这个，我也就仅仅写个例子放在那里了。 前两天有人群里问7z解压，我就随口推荐了这个，使用中有的api他没有弄清楚，我就又拉去过来从源码里翻了翻api， Continue reading “QLib7z：Qt对7z格式解压的封装” Author 渡世白玉Posted on 2015年3月19日2015年8月21日Categories C/C++, Qt, 编程设计Tags 7z, qt, 压缩, 解压25 Comments on QLib7z：Qt对7z格式解压的封装 人生意义的解答 来自知乎知识社区。一共摘自三个问题的四个答案，希望您看到后有所得，第一个是常见的困惑，第二个一幅图的解说，第三个是重量级的，循环渐进 帮你分析。顺便说下余华的《活着》也很值得一度，活着仅仅只是为了活着。 1.问题：如果活着就是为了给别人打工，那活着有什么意义？ （这个有详细问题描述，请进链接查看，我就不转了。） Continue reading “人生意义的解答” Author 渡世白玉Posted on 2015年3月14日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 意义, 活着18 Comments on 人生意义的解答 你害怕人工智能么？——也许你应该害怕 “人工智能很可能导致人类的永生或者灭绝，而这一切很可能在我们的有生之年发生。” 上面这句话不是危言耸听。本篇三万五千字的长文由谢熊猫君翻译，InfoQ经授权转载，略有删节。我转自InfoQ的公共微信，本文较长，希望你能够耐心读完，读完后也许你的世界观都会被改变。 变革边缘 我们正站在变革的边缘，而这次变革将和人类的出现一般意义重大 – Vernor Vinge 如果你站在这里，你会是什么感觉？ Continue reading “你害怕人工智能么？——也许你应该害怕” Author 渡世白玉Posted on 2015年3月13日2015年3月14日Categories 其它, 分享文字Tags 人工智能, 智能爆炸, 永生, 灭绝2 Comments on 你害怕人工智能么？——也许你应该害怕"
