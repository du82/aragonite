full_description = "OpenSUSE源的刷新和下载 用OpenSUSE我是喜欢直接默认官方源，下载速度是刚刚的，但是软件源的刷新倒是爱出问题，最常见的是刷新时需要下载几K到几十K的的东东很慢而且爱断，下载几十M到几百M的包却是速度能达到网络的正常或者最大速度，今天在论坛看到marguerite女王的解答才了解原因，附上： 总有人在各种场合问这个。所以统一做一下解答。 Continue reading “OpenSUSE源的刷新和下载” Author 渡世白玉Posted on 2014年2月15日2015年8月21日Categories LinuxTags opensuse, 源刷新, 速度2 Comments on OpenSUSE源的刷新和下载 关于openSUSE长期版本和openSUSE是否适合做服务器答疑 ps：内容有点长，摘自openSUSE中文社区，点击访问原帖。 首先：关于版本号可以看这里 https://en.openSUSE.org/openSUSE:Versioning_scheme 支持周期在这里 https://en.openSUSE.org/Lifetime 1.关于长期版维护： 《 Continue reading “关于openSUSE长期版本和openSUSE是否适合做服务器答疑” Author 渡世白玉Posted on 2014年1月19日2015年8月21日Categories LinuxTags opensuse, 支持, 服务器, 版本, 长期13 Comments on 关于openSUSE长期版本和openSUSE是否适合做服务器答疑 vim常用命令笔记 一、打开文件、保存、关闭文件(vi命令模式下使用) vi filename //打开filename文件 :w //保存文件 :w vpser.net //保存至vpser.net文件 :q //退出编辑器，如果文件已修改请使用下面的命令 :q! //退出编辑器，且不保存 :wq //退出编辑器，且保存文件 Continue reading “vim常用命令笔记” Author 渡世白玉Posted on 2013年12月19日2015年8月21日Categories LinuxTags linux, vim, 命令11 Comments on vim常用命令笔记 安同OS 之我所见 作为一个linux爱好者（ 菜鸟级的爱好者 ），听说国产又出新的发行版绝对要前排支持下、、、而且还是基于opensuse的，我乃yast忠实粉丝，更要大声叫好！！！ 但是我自己简单试用下之后，却有很多地方想说下： 我对安同的印象首先是没有任何特色。（如果有的话，那就是十分不成熟）。 1.桌面来说上下两个面板，占用了太多显示空间、、、而且下边面板起的作用也太、、、 2.导航菜单在中间，这算是个创意，但是菜单也太简单了吧？ 3.汉化，还有没有完成的地方、、opensue已经做得不错了，剩下的其实也所剩无几了、、、 桌面上的时钟做的的确给力、、、 其他应用没有一一打开，打开几个和原声程序一样、、、想看下yast呢，但是没有root密码，着实郁闷、、、 Continue reading “安同OS 之我所见” Author 渡世白玉Posted on 2012年10月13日Categories LinuxTags anthon, deepin, linux, opensuse, suse, 安同 os1 Comment on 安同OS 之我所见"
