title = "平淡的境界 | 渡世白玉"
description = '作者：周国平 来自：随便看看吧 一 很想写好的散文，一篇篇写，有一天突然发现竟积了厚厚一摞。这样过日子，倒是很惬意的。至于散文怎么算好，想来想去，还是归于"平淡"二字。 以平淡为散文的极境，这当然不是什么新鲜的见解。苏东坡早就说过"寄至味于淡泊"一类的话。今人的散文，我喜欢梁实秋的，读起来真是非常舒服，他追求的也是"绚烂之极归于平淡"的境界。不过，要达到这境界谈何容易。"作诗无古今，惟造平淡难。"之所以难，我想除了在文字上要下千锤百炼的功夫外，还因为这不是单单文字功夫能奏效的。平淡不但是一种文字的境界。更是一种胸怀，一种人生的境界。 仍是苏东坡说的："大凡为文，当使气象峥嵘，五色绚烂，渐老渐熟，乃造平淡。"所谓老熟，想来不光指文字，也包含年龄阅历。人年轻时很难平淡，譬如正走在上山的路上，多的是野心和幻想。直到攀上绝顶，领略过了天地的苍茫和人生的限度，才会生出一种散淡的心境，不想再匆匆赶往某个目标，也不必再担心错过什么，下山就从容多了。所以，好的散文大抵出在中年之后，无非是散淡人写的散淡文。 当然，年龄不能担保平淡，多少人一辈子蝇营狗苟，死不觉悟。说到文人，最难戒的却是卖弄，包括我自己在内。写文章一点不卖弄殊不容易，而一有卖弄之心，这颗心就已经不平淡了。举凡名声、地位、学问、经历，还有那一副多愁善感的心肠，都可以拿来卖弄。不知哪里吹来一股风，散文中开出了许多顾影自怜的小花朵。读有的作品，你可以活脱看到作者多么知道自己多愁善感，并且被自己的多愁善感所感动，于是愈发多愁善感了。戏演得愈真诚，愈需要观众。他确实在想像中看到了读者的眼泪，自己禁不住也流泪，泪眼朦胧地在稿子上签下了自己的名字。 好的散文家是旅人，他只是如实记下自己的人生境遇和感触。这境遇也许很平凡，这感触也许很普通，然而是他自己的，他舍不得丢失。他写时没有想到读者，更没有想到流传千古。他知道自己是易朽的，自己的文字也是易朽的，不过他不在乎。这个世界已经有太多的文化，用不着他再来添加点什么。另一方面呢，他相信人生最本质的东西终归是单纯的，因而不会永远消失。他今天所拣到的贝壳，在他之前一定有许多人拣到过，在他之后一定还会有许多人拣到。想到这一点，他感到很放心。 有一年我到云南大理，坐在洱海的岸上，看白云在蓝天缓缓移动，白帆在蓝湖缓缓移动，心中异常宁静。这景色和这感觉千古如斯，毫不独特，却很好。那时就想，刻意求独特，其实也是一种文人的做作。 活到今天，我觉得自己已经基本上(不是完全)看淡了功名富贵，如果再放下那一份"语不惊人死不休"的虚荣心，我想我一定会活得更自在，那么也许就具备了写散文的初步条件。 二 当然，要写好散文，不能光靠精神涵养，文字上的功夫也是缺不了的。 散文最讲究味。一个人写散文，是因为他品尝到了某种人生滋味，想把它说出来。散文无论叙事、抒情、议论，或记游、写景、咏物，目的都是说出这个味来。说不出一个味，就不配叫散文。譬如说，游记写得无味，就只好算导游指南。再也没有比无味的散文和有学问的诗更让我厌烦的了。 平淡而要有味，这就难了。酸甜麻辣，靠的是作料。平淡之为味，是以原味取胜，前提是东西本身要好。林语堂有一妙比：只有鲜鱼才可清蒸。袁中郎云："凡物酿之得甘，炙之得苦，唯淡也不可造，不可造，是文之真性灵也。"平淡是真性灵的流露，是本色的自然呈现，不能刻意求得。庸僧谈禅，与平淡沾不上边儿。 说到这里，似乎说的都是内容问题，其实，文字功夫的道理已经蕴含在其中了。 如何做到文字平淡有味呢? 第一，家无鲜鱼，就不要宴客。心中无真感受，就不要作文。不要无病呻吟，不要附庸风雅，不要敷衍文债，不要没话找话。尊重文字，不用文字骗人骗己，乃是学好文字功夫的第一步。 第二，有了鲜鱼，就得讲究烹调了，目标只有一个，即保持原味。但怎样才能保持原味，却是说不清的，要说也只能从反面来说，就是千万不要用不必要的作料损坏了原味。作文也是如此。林语堂说行文要"来得轻松自然，发自天籁，宛如天地间本有此一句话，只是被你说出而已"。话说得极漂亮，可惜做起来只有会心者知道，硬学是学不来的。我们能做到的是谨防自然的反面，即不要做作，不要着意雕琢，不要堆积辞藻，不要故弄玄虚，不要故作高深，等等，由此也许可以逐渐接近一种自然的文风了。爱护文字，保持语言在日常生活中的天然健康，不让它被印刷物上的流行疾患侵染和扭曲，乃是文字上的养身功夫。 第三，只有一条鲜鱼，就不要用它熬一大锅汤，冲淡了原味。文字贵在凝练，不但在一篇文章中要尽量少说和不说废话，而且在一个句子里也要尽量少用和不用可有可无的字。文字的平淡得力于自然质朴，有味则得力于凝聚和简练了。因为是原味，所以淡，因为水分少，密度大，所以又是很浓的原味。事实上，所谓文字功夫，基本上就是一种删除废话废字的功夫。陀思妥耶夫斯基在谈到普希金的诗作时说："这些小诗之所以看起来好像是一气呵成的，正是因为普希金把它们修改得太久了的缘故。"梁实秋也是一个极知道割爱的人，所以他的散文具有一种简练之美。世上有一挥而就的佳作，但一定没有未曾下过锤炼功夫的文豪。灵感是石头中的美，不知要凿去多少废料，才能最终把它捕捉住。 如此看来，散文的艺术似乎主要是否定性的。这倒不奇怪，因为前提是有好的感受，剩下的事情就只是不要把它损坏和冲淡。换一种比方，有了真性灵和真体验，就像是有了良种和肥土，这都是文字之前的功夫，而所谓文字功夫无非就是对长出的花木施以防虫和剪枝的护理罢了。 原文地址： http://www.sbkk8.cn/mingjiasanwen/zhouguoping/76739.html'
