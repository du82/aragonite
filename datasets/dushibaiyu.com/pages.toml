title = "关于保卫钓鱼岛、、、 | 渡世白玉"
description = "日本人让我们在钓鱼岛问题上国耻，但是我认为更可耻的是国民的打杂抢烧！！！！ 微薄上一句对联我认为很经典：上联：吃地沟油的命，操中南海的心。下联：生日本人的气，砸中国人的车。横批：一群傻B 的确，政府都还没发话的事你彩信又有何用？？？ 你去游行，是你爱国···但是多少事真的，真心的爱国？如果当年日侵华那时的情形，多少人能保证不当汉奸？大多数人去游行失去凑热闹去了吧、、甚至还有些心怀不轨的人，去煽动，去制造混乱，去砸车，去抢东西！！！你是爱国吗？你是去抢去了吧！！！ 抵制日货，没错！！！但是国产的那么不给里，那么的、、、你让我们凭什么抵制日货？ 佳能工厂关闭了，索尼的也开始的、、但是仅仅只是日本受损失吗？他们只是营收下滑，但是有成千，甚至上万的中国人呢？会没有收入，他们的家庭呢？谁去养他们啊！！！你行吗？ 如果国产的能有些良心，质量上去了，谁还会傻了吧唧的去买日货，韩货，美国货？ 又想起一个选择题：如果你有一个孩子，但是只有两种奶粉能让你选择：A：国产奶粉 B：日本奶粉 你会选择哪个？不要说，母乳，你那是不敢面对自己，是逃避！！！ 很多事情是我们不得不相信的，自己弱小了，有能力你可以反抗，没能力你就忍着。自己在窝里斗，这算能耐吗？"
