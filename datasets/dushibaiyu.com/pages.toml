full_description = "记一个QSharedPointer 和 QTcpsocket一起使用的断开连接导致段错误问题 记一个QSharedPointer 和 QTcpsocket一起使用的断开连接导致段错误问题 写了一个简易的TCPserver，需要很多回调需要socket再回调内写数据，就需要保证回调执行的时候，socket不能被删除，所以采用智能指针老保证QTcpSocket 类的生命周期，加上本地管理，写了如下代码： Continue reading “记一个QSharedPointer 和 QTcpsocket一起使用的断开连接导致段错误问题” Author 渡世白玉Posted on 2022年9月26日2022年9月26日Categories C/C++, Qt, 编程设计 Qt信号槽的一些事 注：此文是站在Qt5的角度说的，对于Qt4部分是不适用的。 1.先说Qt信号槽的几种连接方式和执行方式。 1）Qt信号槽给出了五种连接方式： Qt::AutoConnection 0 自动连接：默认的方式。信号发出的线程和糟的对象在一个线程的时候相当于：DirectConnection， 如果是在不同线程，则相当于QueuedConnection Qt::DirectConnection 1 直接连接：相当于直接调用槽函数，但是当信号发出的线程和槽的对象不再一个线程的时候，则槽函数是在发出的信号中执行的。 Qt::QueuedConnection 2 队列连接：内部通过postEvent实现的。不是实时调用的，槽函数永远在槽函数对象所在的线程中执行。如果信号参数是引用类型，则会另外复制一份的。线程安全的。 Qt::BlockingQueuedConnection 3 阻塞连接：此连接方式只能用于信号发出的线程（一般是先好对象的线程） 和 槽函数的对象不再一个线程中才能用。通过信号量+postEvent实现的。不是实时调用的，槽函数永远在槽函数对象所在的线程中执行。但是发出信号后，当前线程会阻塞，等待槽函数执行完毕后才继续执行。 Qt::UniqueConnection 0x80 防止重复连接。如果当前信号和槽已经连接过了，就不再连接了。 Continue reading “Qt信号槽的一些事” Author 渡世白玉Posted on 2015年7月29日2015年8月21日Categories C/C++, Qt, 编程设计Tags qt, 信号槽, 同步, 异步, 线程25 Comments on Qt信号槽的一些事"
