full_description = "关于 HTML5 的七个传说 来自：开源中国 正如 Opera 的布道者 Bruce Lawson 讲的那样，“每个人都在谈论 HTML5”，它被传的很神，很玄。事实上有很多人所说的 HTML5 实际上只是古老的 DHTML 或者 Ajax。把所有的信息混在一起就是一堆错误信息。 HTML5 简单的说就是一组新的标准，语法和规则用来创建网页，可以利用一些新的浏览器的“本地”功能，例如离线存储，多媒体播放和其他的交互等等。我们所看到的很 多很酷的 HTML5 网站实际上跟 HTML5 无关，而是由 CSS3 和 jQuery 生成的。CSS3 和 jQuery 是和 HTML5 一样的新技术，它们和 HTML5 是平行的概念。 这篇文章讲了关于 HTML5 的7个传说，也就是误解 ：） Continue reading “关于 HTML5 的七个传说” Author 渡世白玉Posted on 2012年3月29日Categories 编程设计Tags css, flash, html5, 神话Leave a comment on 关于 HTML5 的七个传说 平淡的境界 作者：周国平 来自：随便看看吧 一 很想写好的散文，一篇篇写，有一天突然发现竟积了厚厚一摞。这样过日子，倒是很惬意的。至于散文怎么算好，想来想去，还是归于”平淡”二字。 以平淡为散文的极境，这当然不是什么新鲜的见解。苏东坡早就说过”寄至味于淡泊”一类的话。今人的散文，我喜欢梁实秋的，读起来真是非常舒服，他追求的也是”绚烂之极归于平淡”的境界。不过，要达到这境界谈何容易。”作诗无古今，惟造平淡难。”之所以难，我想除了在文字上要下千锤百炼的功夫外，还因为这不是单单文字功夫能奏效的。平淡不但是一种文字的境界。更是一种胸怀，一种人生的境界。 Continue reading “平淡的境界” Author 渡世白玉Posted on 2012年3月26日Categories 分享文字, 文字飘香Tags 伟大, 周国平, 境界, 平淡, 思考1 Comment on 平淡的境界 Linux常用命令总结 ———–Liunx帮助命令——– #help pwd #help -s pwd 只显示命令的格式信息 #touch –help #man ls #info ls —–Liunx文件和目录操作命令—– #ls , ls -l , ll 列目录命令 #cd /root, cd ..目录更改命令 Continue reading “Linux常用命令总结” Author 渡世白玉Posted on 2012年3月25日Categories LinuxTags linux, 命令Leave a comment on Linux常用命令总结"
