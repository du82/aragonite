["https://www.dushibaiyu.com/2014/10/rensheng.html"]
title = "我害怕找不到一种自己喜欢的方式度过人生 | 渡世白玉"
description = "人， 必须选择一种生活方式并有勇气坚持下去。 与其说我害怕成为普通人，还不如说我害怕生活，害怕找不到一种自己喜欢的方式去度过人生，害怕不知道什么才是我想要的生活。 “只有一种英雄主义，就是在认清生活真相之后依然热爱生活。”"
full_description = "我害怕找不到一种自己喜欢的方式度过人生 Ps：人最难的就是直面人生，直面生活。有时看似简单，人人可做，却又恰恰是最难，谁也几乎都没做到。我也一直在探索，也曾豪情万丈，也曾想不存在也是最好，只是一直未曾找到结果。我一直还没认清自己的生活，有时，不！是大多数时候也在逃避自己的生活。至于热爱生活，更是做不到的。为什么活着，你活着所之为何，你也曾探寻，但未曾找到答案。也曾逃避不想，但是静下面对自己却又避无可避。今日，精读上看到此文，认真读了几遍，若有所得，却有因本人愚钝，无法言语描清，遂全文转载过来。 下面正文： 原文作者：meiya ；来自：精读 一、有钱还是一样要过普通人的生活 有一回，去外地 出差，是一个开发商请我们去做活动，安排住在超五星的酒店，那个酒店的大堂用八个字来形容就是：“金碧辉煌，宛若宫殿”。我一个人住一间豪华大床房，床头 柜上摆着一个精致的花瓶，中间插着一支新鲜的马蹄莲。卫生间的马桶圈是时刻保持体温的，还有好几个按钮，可调节冲洗的水量大小，还有烘干功能。还好我之前 在《刺猬的优雅》一书看到过更奢华的马桶介绍（按钮冲洗的时候头顶还有个环绕立体声会给你播放音乐）不然我这种屌丝，估计会被那些功能吓得便秘。我站在房 间中央，忍不住演绎了一把电影《茉莉花开》（剧本改编自苏童的小说《妇女生活》）中的国际章夸张又别扭的台词：“啊呀，这样好的房间，这样高级的马桶间， 还有这样柔软的眠床，啊……” 这一天我兴奋得要命，不单单是体验了一把奢华，还隐约找到了人生目标：“如果我这辈子能住在这样的地方，我一定会很幸福啊，嗯，我要为这个目标奋斗，这就是我想要的人生！” 我带着找到人生方向和目标的兴奋感睡着了，第二天一早醒来，掀开被子，我发现那么大张的床我只睡了很小的一部分，只弄皱了五分之一的床单，另外五分之四的白色床单还是平整崭新的，我矫情地用手抚摸一下，然后决定在没睡过地方再躺一会（屌丝气质顿时如滔滔长江水倾泻而出）。 那天的自助早餐标价是288元，琳琅满目，什么都有，我跟自己在家吃的一样：一碗白粥、两个小肉包，几小截油条，一碟咸菜，还有一杯酸奶。 那 一整天我都在考虑一个问题：就算有一天，我真的成为有钱人，我真的会比现在更幸福吗？我还是只睡那么大点的地方，吃那些简单的早餐。我的需要好像不会变 多，其实我需要的真的很少，除了这些，我还要什么呢？你看，只一天的时间，我又陷入迷茫之中，从目标明确的人生到又不知道自己到底要什么了。 去 年我认识一个女老板。首先她长得很美，35岁，容貌清丽，脸上的皮肤光滑紧致，吹弹可破，胸前四两肉一点也没下垂，腰围长年维持在24，一身华服，气质出 众；其次她的家庭很美满，开了好几个公司的丈夫很爱她，对她温柔又大方，每到节日都会送她礼物，还有一个念幼儿园，长得非常萌的女儿；最后她自己还事业有 成，经营一家年盈利一千多万的百人公司。在外人看来她真的很幸福，人人都会羡慕她的生活，她就是众人羡慕嫉妒恨的对象，可是有一天她居然在网络上跟我说这 样一句话：“我经常觉得生活很绝望，真的很令人绝望。” 我朋友的朋友张先生是一个台湾大老板，他父亲创立了一个大公 司，他算子承父业的富二代，身家过亿。今年50岁的他每一个月都要在台湾、中国大陆、越南、新加坡等地的工厂飞来飞去，出差的同时也顺便旅游，吃吃喝喝玩 玩，看起来过得非常潇洒。某一次朋友请吃饭，席间聊天，他说觉得自己很迷茫很疲惫，不知道自己接下来要干什么。做事业的激情已经褪去很多，再也找不回年轻 时候拼命工作的激情了。然后又说起他一次旅行的经历。有一次他在阳朔旅行，遇到一个打着非洲鼓的流浪艺人，他看对方表演了很久，然后两个人聊天，他知道这 个流浪汉非常自由，去过很多地方，他非常羡慕对方，特别想放下工作和他一起流浪，他觉得这才是他想过的人生。他第二次到阳朔，又去那条街上找那个流浪艺 人，再也没有遇见，心里怅然若失。 二、只有一种英雄主义，就是在认清生活真相之后依然热爱生活 最 近我很认真地看了一本书——坎宁安的《时时刻刻》，讲了三个女人的故事：弗吉尼亚•伍尔夫，二十世纪二十年代伦敦的天才作家；布朗太太，二战后住在加州的 家庭主妇；克拉丽莎，二十世纪九十年代纽约的出版编辑。小说的结构无疑很创新，用“达洛维夫人”这一关联性将三个不同年代，不同家庭的女人放在同一时间维 度里，用平行叙述的方式，一章讲诉一个女人，错落有致，充满韵律美。但是在我看来形式并不是最重要，书的内容才是，很多人说讲了女性主义、女性价值、女同 性恋之类的，我觉得它的主题并不局限在女性这一群体上，而是更为宏大，讲人生，讲生活的本质，以及在认清生活本质之后你如何去热爱它。 伍尔夫给丈夫留下一封遗书：“我确信自己又要精神失常了：我感到我们无法再一次经受这样可怕的时刻……”离开家后，她在厚重的大衣口袋里装满了石头，走向了河心。她的尸体随着水流而下，最终被一座桥的桥桩挡住，她背对着河，脸贴着石头，然后一对母子从桥上经过。 劳 拉•布朗刚刚给丈夫买好了生日礼物，并和三岁的儿子一起烤了生日蛋糕，她的腹内还孕育着另一条小生命。趁着丈夫还没有回来之前，她将儿子托给邻居照顾，一 个人驾车出去，带着忐忑不安在旅馆租了一间单人房， 然后躺在床上阅读《达洛维夫人》，想着原来死亡是如此容易，就像在旅馆订上一间单人房。 克拉丽莎为罹患了艾滋病的前男友——诗人托马斯举办了一场晚会，庆祝他拿到一项重要的诗歌大奖，当晚却目睹了托马斯跳楼自杀，然后看着他的尸体不知如何处置。 从表面上看来他们自杀的原因是：伍尔夫得了抑郁症，之前她崩溃过几次，这一次觉得无法再承受；劳拉•布朗受困于家庭主妇的角色，家庭生活让她感到窒息；托马斯得了绝症，无法尽展自己的才华。实际真正让他们自杀的原因是：受困于生活，对生感到厌倦。 我 关注的友邻里面有几位专栏作家，其中有一位我时常会在《上海一周》上看到他写得妙趣横生的小文。有一天他发了一条广播：“如今我过上了天天想死的生活”有 豆友劝他好好休息一下，他补充了一句：“完全是一种对人生的，深深的，深深的倦意……”我特别能理解这种情绪，我自认为算得上积极乐观的人，但是还是会时 不时生出那种对生活无边厌弃的情绪来，说白了就是活腻了，实在过厌的感觉。我想其他人也一样吧，有从来就没有对生活厌倦的人吗？我认为当一个人活腻的时候 就需要小死一次，这段时期很痛苦，如果熬过去了就继续活下去，如果熬不过去就会自杀。两千年前的古罗马哲学家塞内加说：“人生不断学习生存，人生也不断学习死亡。”你需要一次次看透生活的本质，一次次学习死亡，才能好好生存下去。 在 过去的很长时间里，我一直以为当有一天我变得不普通了，比如拥有大把的财富，拥有令人艳羡的名望，我就不再需要面对普通的生活，就像《时时刻刻》里克拉丽 莎在街上遇到电影大明星，渴望自己可以跟明星一样不平凡，过耀眼的生活。到那时，我将不再受困于生活的琐碎、无聊、恶心、龌龊、疲惫、压力、厌倦、忧伤、 痛苦、虚无……我的生活一定充满光鲜、快乐、愉悦、舒服、安宁、幸福…… 可是我现在已然明白，无论我怎么努力，即便 我名利双收，依然不能脱离普通的生活，只要我生而为人，我就受困于生活，甚至受困于幸福的生活，比如我认识的那位美女老板。事实上我们所有的人都受困于生 活，受苦于这有限的时间和很快不再青春的肉身，受困于大大小小一切形式的责任，受困于来自方方面面的压力，受困于生活中那些琐碎、无聊、恶心、龌龊…… 与其说我害怕成为普通人，还不如说我害怕生活，害怕找不到一种自己喜欢的方式去度过人生，害怕不知道什么才是我想要的生活。 当我必须面对物质生活上那些恼人的小事时，当我需要承担工作责任又想逃避时，当我不得不面对不喜欢的人又要假装热情时，我总是不停地在心里告诉自己：“这就是生活，你不要害怕生活！” 《时时刻刻》中引用了莎翁的诗歌：“不要再怕炎炎骄阳，也不要畏惧寒冬的肆虐。”我理解为不要畏惧生活中的一切，无论好的还是不好的统统都接受。如果我们不畏惧生活，我们将不畏惧一切，包括死亡，因为死亡也是生活的一部分。 伍尔夫说：“亲爱的雷纳德，要直面人生，永远直面人生，了解它的真谛，永远的了解，爱它的本质，然后，放弃它。” 梭罗说：“生命并没有价值，除非你选择并赋予它价值。没有哪一个地方有幸福，除非你为自己带来幸福。”我以前觉得追求幸福、快乐才是人生的第一要义，后来才渐渐懂得幸福、快乐并不是人生最最重要的东西，意义才是。寻求和建立意义，为意义而活，它可以帮助你去走完人生，度过一个有意义的人生，尤其是在现在这样一个信息更新快速，充满选择和诱惑的时代。 罗曼•罗兰说：“只有一种英雄主义，就是在认清生活真相之后依然热爱生活。”但是这世间最难做到的就是“热爱生活”这四个字。 三、人，必须选择一种生活方式并有勇气坚持下去。 写到这里我想起一个捕鱼人的故事： 有 一个美国商人坐在墨西哥海边一个小渔村的码头上，看着一个墨西哥渔夫划着一艘小船靠岸，小船上有好几尾大黄鳍鲔鱼。这个美国商人对墨西哥渔夫能抓这么高档 的鱼恭维了一番，并问道，“要多少时间才能抓这么多？”墨西哥渔夫说，“才一会儿功夫就抓到了。”美国人再问，“你为什么不待久一点，好多抓一些鱼？”墨 西哥渔夫觉得不以为然：“这些鱼已经足够我一家人生活所需啦！ ” 美国人又问：“那么你一天剩下那么多时间都在干什么？ ” 墨西哥渔夫解释：“我呀？我每天睡到自然醒，出海抓几条鱼，回来后跟孩子们玩一玩；再跟老婆睡个午觉，黄昏时晃到村子里喝点小酒，跟哥儿们玩玩吉他。我的日子可过得充满又忙碌呢！ ” 美 国人不以为然，帮他出主意，他说：“我是美国哈佛大学企管硕士，我倒是可以帮你忙！你应该每天多花一些时间去抓鱼，到时候你就有钱去买条大一点的船。自然 你就可以抓更多鱼，再买更多渔船。然后你就可以拥有一个渔船队。到时候你就不必把鱼卖给鱼贩子，而是直接卖给加工厂。然后你可以自己开一家罐头工厂。如此 你就可以控制整个生产、加工处理和行销。然后你可以离开这个小渔村，搬到墨西哥城，再搬到洛杉矶，最后到纽约，在那经营你不断扩充的企业。 ” 墨西哥渔夫问：“这又花多少时间呢？” 美国人回答：“十五到二十年。” 墨西哥渔夫问：“然后呢？ ” 美国人大笑着说：“然后你就可以在家当皇帝啦！时机一到，你就可以宣布股票上市，把你的公司股份卖给投资大众，到时候你就发啦！你可以几亿几亿地赚！” “然后呢？” 美国人说：“到那个时候你就可以退休啦！你可以搬到海边的小渔村去住。每天睡到自然醒，出海随便抓几条鱼，跟孩子们玩一玩，再跟老婆睡个午觉，黄昏时，晃到村子里喝点小酒，跟哥儿们玩玩吉他。” 墨西哥渔夫疑惑的说：“我现在不就是这样了吗？” 先 抛开马斯洛的五大需求层次理论来说（人的生理、安全需求满足后要发展更高层次的需求，一直到追求最高层次的自我实现）这个故事中没有谁的选择是对，谁的选 择是错的问题，只是不同选择，不同人生罢了。虽然看起来终点都一样——在海边的小渔村过悠哉的生活，但是过程却完全不一样。如果你觉得安于现状是你想要 的，那选择安于现状的生活就会让你幸福和满足，如果你不甘平庸，选择一条改变、进取和奋斗的道路，在这个追求的过程中你也一样会感到快乐。所谓的成功，也 许就是按照自己想要的生活方式生活。最糟糕的状态莫过于当你想选择一条不甘平庸，改变、进取和奋斗的道路时却以一种安于现状的方式生活，最后抱怨自己没有 得到自己想要的人生！ 人， 必须选择一种生活方式并有勇气坚持下去。 但是，你懂得自己想要是什么吗？你说得清，道得明吗？ Author 渡世白玉Posted on 2014年10月22日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 意义, 生活"
