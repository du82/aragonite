full_description = "不喧哗，自有声 世界无边尘绕绕，众生无尽业茫茫。 01 今年的生日，我是在工作中度过的，上午在公司加班开会商讨新的广告案，中午赶往 电台录下一周的六档节目，傍晚又回到公司改文章、做最终企划，等到忙完才注意时间已经过了凌晨，打开手机看到许多未接来电和信息，很多朋友发来生日的祝 福，这时我才察觉，这一年的生日就在这样与平日无异的忙碌中，过去了。 Continue reading “不喧哗，自有声” Author 渡世白玉Posted on 2014年4月26日2015年8月21日Categories 分享文字, 文字飘香Tags 内心, 喧哗, 谦逊42 Comments on 不喧哗，自有声 zermq简单使用 原本项目用的ICE中间件，但是ICE的异步和回调稍显繁琐，而且ICE强大的地方还都用不到，所以我提出用socket代替Ice通讯，头头担心我们自己从socket构建的话很多地方考虑不到，异常断开，数据连包，大包接受不全、、、等等。还是倾向与完善的通讯，于是就提出用0mq、、所以就研究了两天zmq，初步实现了一个需要的初步框架，先探讨下zmq、、 Continue reading “zermq简单使用” Author 渡世白玉Posted on 2014年4月11日2015年8月21日Categories C/C++, Qt, 编程设计Tags zermq, 异步, 插件26 Comments on zermq简单使用 乱语胡言 人越是长大，心越小，梦越小。是我们成熟了，现实了？还是懦弱了，害怕了呢？ 道曰无为，佛曰轮回，基督救赎，只是这些宗教怎么都有一丝悲观的色彩？世间本质是否就是悲观的？只是他们也都强调积极乐观的活着，我们何尝不是应该以积极去面对世间的悲观，只是不要忘记本质是悲哀的、、、 任何无条件下的是非观念都是洗脑！“度”，任何事情，任何真理都是有适用范围的，善恶亦然、、、 Continue reading “乱语胡言” Author 渡世白玉Posted on 2014年4月1日2015年8月21日Categories 文字飘香, 随笔24 Comments on 乱语胡言"
