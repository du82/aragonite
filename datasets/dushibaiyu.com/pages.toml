title = "鲍鹏山新说《水浒》经典语录精选之武松 | 渡世白玉"
description = "① 怒虎神人 176、武松的一大特点，就是好吹牛，好显摆，好炫耀，好逞能。 177、走夜路的人，往往吹口哨，不是不怕，恰恰是因为怕。 178、一个人要鼓励自己有所作为、有所建树，最好的办法就是欣赏自己，肯定自己。但是，一个人要让自己做傻事、蠢事，闯祸，最好的办法也是欣赏自己，肯定自己。 179、这个世界上，什么是蠢事，什么是傻事，还真难说。一件聪明的事，如果有始无终，最后就变成了傻事。相反，一件傻事，如果你坚持做下去，最后竟然让你做成了，那就变成了好事、大事，甚至变成了大事业。 180、一个自信和骄傲的人，往往也是最重要面子的人。 181、好汉是不能被人耻笑的。被人耻笑了，就做不得好汉了。 182、好面子是可爱的，好面子是可贵的。好面子源于一种骄傲的个性。骄傲的个性，相比较卑贱的个性，是高贵的、可贵的、珍贵的。至今，好面子的人，不会太下流。好面子，就是有耻。而有耻，是中国传统文化对人的基本要求。孔子讲，一个得到很好治理的国家，一个有着精神文明的国家，其人民一定是“有耻且格”——有羞耻心且行为举止体面。而一个有着自我品格的人，也要“行己有耻”——自己的品行和行为，都要有羞耻心。所以，有羞耻心，对于一个人来说，太重要了。 183、好面子，还有一个好处，那就是，往往逼着自己做一些有难度的事。做成了，自然就有了成功。很多大事，都是一步一步做出来的，都是逼着做出来的，都是自己逼着自己勉为其难做出来的。人有时要逼自己，逼出自己的潜能。不逼，你哪里知道你能做多大的事呢？ 184、在孔子看来，临事而惧，不但不会损害英雄形象，恰恰是真正勇者的行为和心理。真正的英雄，往往需要真正的对手，面对真实的有实力的对手，心存敬畏，心存戒惧，小心应付，恰恰是英雄的必备素质。 185、武松对虎，不想打，不敢打，也不会打。只因为他好面子，好自负，好逞能，逼得自己没了退路，只好打了。打了，也就真的打死了。逞英雄，也就真的成了英雄。世界上的好多事，往往也就是这样。 ② 赖汉娇娘 186、在夫妻这样绝对私人私密的空间，如果双方毫无感情，义也就无法存在。 187、犯罪原因不能成为犯罪理由，犯罪不能因为有了原因就可以被豁免。这一点，当代那些为潘金莲翻案的人可能没有很好地加以区别。 188、武松是个很自我欣赏、以自我为中心的人，这样的人，往往会忽略对周边环境和周边人物及其相互关系的观察和判断。 189、这样的男人，兄弟看着，觉得可怜。这样的男人，要让女人爱，确实为难女人。 ③ 骨肉为仇 190、内心的情爱欲念与社会的道德伦理发生严重冲突，一句话，情和理的冲突。 191、不见好，是对自己严格。不见怪，是对别人宽容。不见好，是对道德的坚持。不见怪，是对人性的理解。所以，不见怪，是更高的境界。 192、此时武松的不见怪，实际上就是武松根本不知道如何应对，只好装傻装糊涂，他的政策是鸵鸟政策：把头藏起来，假装没看见没听见，糊弄一天是一天。 193、一个男人不能接受一个女人的爱情，又想和她保持比较好的关系，不愿意伤害她，最好的办法就是装糊涂。一个男人不能接受一个女人的爱情，又想和她保持比较好的关系，不愿意伤害她，最坏的办法也是装糊涂。 194、暧昧语言的特点是：进可攻，退可守，你若认了，我的目的就达到了，你若不认，我又好像什么都没说。 195、痴心人必然妄想，而妄想人必然偏执：他们只接受对他们有利的信息，而对他们不利的信息，他们往往熟视无睹，视而不见。所以，对于执着的人而言，装糊涂不行。对于痴情者而言，暗示不行。 196、为什么不做声？因为说不过对方。为什么焦躁？既是因为对方的无礼，也是因为自己的无力。 197、爱情可以升华，也可以转化。处理得好，爱情可以转化为一种持久恒定的互相之间的默契和关心，转化为近乎于亲情的情感。而处理不好，则会因爱生恨，转化为刻骨的仇恨。 198、对他人进行道德批判，很容易声音洪亮，慷慨激昂，但未必使人心服口服。我们要知道，“明于知礼义，陋于知人心”是我们传统文化的毛病之一，本来，知礼义不难，难在知人心。 199、如果我们在使用道德伦理这样的武器时，结果不是让人信服道德伦理，反而使之更加决绝地破坏道德，难道能说我们胜利了吗？ ④ 谋杀亲夫 200、以色事人或以色邀宠，正是女人的不幸，而不是她们的不德。对此，我们要给予的，是同情的泪水，而不是责骂的口水。 201、在这个世界上，有一些爱情我们不能接受；但是，没有什么爱情我们不能理解。有一些爱情我们不能报以爱情；但是，没有什么爱情我们不能报以温情。有一些爱情我们必须拒绝；但是，没有任何爱情我们可以嘲弄。 202、看住一个水性杨花的女人，比看住一万个跳蚤还难。 203、拉回一个倒向他人的女人，就像推开一面倒向自己的墙。 204、在封建社会，普通百姓最怕的，就是这两样东西：流氓和贪官。 205、事实上，一般的情况下，人们对利害的考虑总是压过对是非的考虑，这是一般人性。但是，假如他们得不到保护，独自主持是非的成本太高，高到他们无法承受，他们只能选择沉默，并且，在沉默中成为罪行和恶人的同谋。 206、当人们主持正义却要砸了饭碗时，人们往往选择的是饭碗而丢弃正义。这不但不被看做低下，反而被视为聪明。 207、我们知道，在非公民社会，在大多数情况下，芸芸众生既不具备保护自己的能力，更不具备保护他人、维护正义的能力。在看到邪恶肆虐时，普通人就是鲁迅先生所沉痛揭示的两种人：一、遭到蹂贱伤害的示众材料；二、沉默不语的旁观者、看客。 208、在整个《水浒传》故事里，举凡弱者被欺凌的地方，必有沉默的大多数，站在一旁，沉默不语。实际上，只要大多数不再沉默，我们本来无需英雄。我们可以自己救自己。 209、什么是英雄？英雄就是在他人都沉默时候，他爆发出来。什么是英雄？英雄就是大家都不敢出来时，他站出来。这话反过来说，就是：英雄爆发的时候，正是大多数人沉默的时候。英雄挺身而出的时候，正是大众不敢出头的时候。因此，有梁山英雄的地方，一定不是一个好时代；孽生英雄侠客的世道，也一定不是一个好世道。因为，有一个英雄，必有一群懦夫。但愿我们的生活中，永远无需英雄侠客。我们自己是自己的英雄。我们自己建立一种制度，用制度保护我们自己。 ⑤ 太岁归来 210、现在，武松无须再顾忌什么，在这个世界上，他再也没有什么放不下的牵挂，一点儿爱被扼杀，一点儿情被割断，现在，只剩下一腔仇，一腔恨。护佑使者摇身一变，成了复仇天使。 211、唯其不贪，才保全了性命。有一条优点，就有一条生路。而王婆，正因为贪，才置自己于必死的境地。有一条缺点，也就可能多一条死路。王婆和何九，两人都是精细人。但最后何九胜出。胜在德而不是胜在才。 212、吃官司却是玩耍，既是孩子口吻，也是老于世故的口吻。 213、在市井讨生活，大人个个精明，小孩儿个个早熟。《水浒》写市井，异样好。 214、武松也不是一般平民百姓。他的身份还是很特殊的。这样的人，尚且不能得到法律的保护，不能得到官府的公正对待，一般普通百姓，在这样的社会得到的待遇，也就可想而知了！ 215、官腔的可怕处，在于它句句在理，你无法反驳。两种最有代表性的官腔：政治官腔和专业官腔。政治官腔使用者一般为有一定权力和地位的官僚。其用途在于确立自己的政治优势，显示自己的政治正确。政治正确者便有了政治优势，你再纠缠就属于闹事了。官腔的第二种是专业官腔。使用者一般为某些利益集团的御用学者和专家。其用途在于确立自己的专业优势。既然你摸不着头脑，也就无法反驳他，他马上就占有了有利的专业优势。他既然有了专业的优势，你再纠缠就属于不懂事了。 216、从某种意义上说，什么叫圣人？就是常常被人利用的人。 217、简单地说，官腔既是一种说话方式，更是一种话语权。老百姓，没有话语权，只能忍气吞声。 218、对付官腔的最好武器，就是良知和常识。不跟着官腔绕弯弯，跟着官腔绕，会把你绕得一点儿道理都没有，一点儿脾气都没有，一点儿头脑都没有。所以，最好的办法是：随你说千道万，我就坚持一点：良知和常识。最简单的思路，有时恰恰是最正确的死路。 219、协商不能解决的，用法。法度不能解决的，用刀。可见，官府不作为，会造成极大地社会问题：自己无力解决问题的，成了无依无靠的顺民。自己有力解决问题的，成了无法无天的暴民。暴民不是国家的力量，而是国家的祸害。顺民呢？同样糟糕：顺民不是国家的财富，而是国家的累赘。一个强大的国家和民族，既不要暴民，也不要顺民，要的是公民。 ⑥"
full_description = "鲍鹏山新说《水浒》经典语录精选之武松 ① 怒虎神人 176、武松的一大特点，就是好吹牛，好显摆，好炫耀，好逞能。 177、走夜路的人，往往吹口哨，不是不怕，恰恰是因为怕。 178、一个人要鼓励自己有所作为、有所建树，最好的办法就是欣赏自己，肯定自己。但是，一个人要让自己做傻事、蠢事，闯祸，最好的办法也是欣赏自己，肯定自己。 179、这个世界上，什么是蠢事，什么是傻事，还真难说。一件聪明的事，如果有始无终，最后就变成了傻事。相反，一件傻事，如果你坚持做下去，最后竟然让你做成了，那就变成了好事、大事，甚至变成了大事业。 180、一个自信和骄傲的人，往往也是最重要面子的人。 181、好汉是不能被人耻笑的。被人耻笑了，就做不得好汉了。 182、好面子是可爱的，好面子是可贵的。好面子源于一种骄傲的个性。骄傲的个性，相比较卑贱的个性，是高贵的、可贵的、珍贵的。至今，好面子的人，不会太下流。好面子，就是有耻。而有耻，是中国传统文化对人的基本要求。孔子讲，一个得到很好治理的国家，一个有着精神文明的国家，其人民一定是“有耻且格”——有羞耻心且行为举止体面。而一个有着自我品格的人，也要“行己有耻”——自己的品行和行为，都要有羞耻心。所以，有羞耻心，对于一个人来说，太重要了。 183、好面子，还有一个好处，那就是，往往逼着自己做一些有难度的事。做成了，自然就有了成功。很多大事，都是一步一步做出来的，都是逼着做出来的，都是自己逼着自己勉为其难做出来的。人有时要逼自己，逼出自己的潜能。不逼，你哪里知道你能做多大的事呢？ 184、在孔子看来，临事而惧，不但不会损害英雄形象，恰恰是真正勇者的行为和心理。真正的英雄，往往需要真正的对手，面对真实的有实力的对手，心存敬畏，心存戒惧，小心应付，恰恰是英雄的必备素质。 185、武松对虎，不想打，不敢打，也不会打。只因为他好面子，好自负，好逞能，逼得自己没了退路，只好打了。打了，也就真的打死了。逞英雄，也就真的成了英雄。世界上的好多事，往往也就是这样。 ② 赖汉娇娘 186、在夫妻这样绝对私人私密的空间，如果双方毫无感情，义也就无法存在。 187、犯罪原因不能成为犯罪理由，犯罪不能因为有了原因就可以被豁免。这一点，当代那些为潘金莲翻案的人可能没有很好地加以区别。 188、武松是个很自我欣赏、以自我为中心的人，这样的人，往往会忽略对周边环境和周边人物及其相互关系的观察和判断。 189、这样的男人，兄弟看着，觉得可怜。这样的男人，要让女人爱，确实为难女人。 ③ 骨肉为仇 190、内心的情爱欲念与社会的道德伦理发生严重冲突，一句话，情和理的冲突。 191、不见好，是对自己严格。不见怪，是对别人宽容。不见好，是对道德的坚持。不见怪，是对人性的理解。所以，不见怪，是更高的境界。 192、此时武松的不见怪，实际上就是武松根本不知道如何应对，只好装傻装糊涂，他的政策是鸵鸟政策：把头藏起来，假装没看见没听见，糊弄一天是一天。 193、一个男人不能接受一个女人的爱情，又想和她保持比较好的关系，不愿意伤害她，最好的办法就是装糊涂。一个男人不能接受一个女人的爱情，又想和她保持比较好的关系，不愿意伤害她，最坏的办法也是装糊涂。 194、暧昧语言的特点是：进可攻，退可守，你若认了，我的目的就达到了，你若不认，我又好像什么都没说。 195、痴心人必然妄想，而妄想人必然偏执：他们只接受对他们有利的信息，而对他们不利的信息，他们往往熟视无睹，视而不见。所以，对于执着的人而言，装糊涂不行。对于痴情者而言，暗示不行。 196、为什么不做声？因为说不过对方。为什么焦躁？既是因为对方的无礼，也是因为自己的无力。 197、爱情可以升华，也可以转化。处理得好，爱情可以转化为一种持久恒定的互相之间的默契和关心，转化为近乎于亲情的情感。而处理不好，则会因爱生恨，转化为刻骨的仇恨。 198、对他人进行道德批判，很容易声音洪亮，慷慨激昂，但未必使人心服口服。我们要知道，“明于知礼义，陋于知人心”是我们传统文化的毛病之一，本来，知礼义不难，难在知人心。 199、如果我们在使用道德伦理这样的武器时，结果不是让人信服道德伦理，反而使之更加决绝地破坏道德，难道能说我们胜利了吗？ ④ 谋杀亲夫 200、以色事人或以色邀宠，正是女人的不幸，而不是她们的不德。对此，我们要给予的，是同情的泪水，而不是责骂的口水。 201、在这个世界上，有一些爱情我们不能接受；但是，没有什么爱情我们不能理解。有一些爱情我们不能报以爱情；但是，没有什么爱情我们不能报以温情。有一些爱情我们必须拒绝；但是，没有任何爱情我们可以嘲弄。 202、看住一个水性杨花的女人，比看住一万个跳蚤还难。 203、拉回一个倒向他人的女人，就像推开一面倒向自己的墙。 204、在封建社会，普通百姓最怕的，就是这两样东西：流氓和贪官。 205、事实上，一般的情况下，人们对利害的考虑总是压过对是非的考虑，这是一般人性。但是，假如他们得不到保护，独自主持是非的成本太高，高到他们无法承受，他们只能选择沉默，并且，在沉默中成为罪行和恶人的同谋。 206、当人们主持正义却要砸了饭碗时，人们往往选择的是饭碗而丢弃正义。这不但不被看做低下，反而被视为聪明。 207、我们知道，在非公民社会，在大多数情况下，芸芸众生既不具备保护自己的能力，更不具备保护他人、维护正义的能力。在看到邪恶肆虐时，普通人就是鲁迅先生所沉痛揭示的两种人：一、遭到蹂贱伤害的示众材料；二、沉默不语的旁观者、看客。 208、在整个《水浒传》故事里，举凡弱者被欺凌的地方，必有沉默的大多数，站在一旁，沉默不语。实际上，只要大多数不再沉默，我们本来无需英雄。我们可以自己救自己。 209、什么是英雄？英雄就是在他人都沉默时候，他爆发出来。什么是英雄？英雄就是大家都不敢出来时，他站出来。这话反过来说，就是：英雄爆发的时候，正是大多数人沉默的时候。英雄挺身而出的时候，正是大众不敢出头的时候。因此，有梁山英雄的地方，一定不是一个好时代；孽生英雄侠客的世道，也一定不是一个好世道。因为，有一个英雄，必有一群懦夫。但愿我们的生活中，永远无需英雄侠客。我们自己是自己的英雄。我们自己建立一种制度，用制度保护我们自己。 ⑤ 太岁归来 210、现在，武松无须再顾忌什么，在这个世界上，他再也没有什么放不下的牵挂，一点儿爱被扼杀，一点儿情被割断，现在，只剩下一腔仇，一腔恨。护佑使者摇身一变，成了复仇天使。 211、唯其不贪，才保全了性命。有一条优点，就有一条生路。而王婆，正因为贪，才置自己于必死的境地。有一条缺点，也就可能多一条死路。王婆和何九，两人都是精细人。但最后何九胜出。胜在德而不是胜在才。 212、吃官司却是玩耍，既是孩子口吻，也是老于世故的口吻。 213、在市井讨生活，大人个个精明，小孩儿个个早熟。《水浒》写市井，异样好。 214、武松也不是一般平民百姓。他的身份还是很特殊的。这样的人，尚且不能得到法律的保护，不能得到官府的公正对待，一般普通百姓，在这样的社会得到的待遇，也就可想而知了！ 215、官腔的可怕处，在于它句句在理，你无法反驳。两种最有代表性的官腔：政治官腔和专业官腔。政治官腔使用者一般为有一定权力和地位的官僚。其用途在于确立自己的政治优势，显示自己的政治正确。政治正确者便有了政治优势，你再纠缠就属于闹事了。官腔的第二种是专业官腔。使用者一般为某些利益集团的御用学者和专家。其用途在于确立自己的专业优势。既然你摸不着头脑，也就无法反驳他，他马上就占有了有利的专业优势。他既然有了专业的优势，你再纠缠就属于不懂事了。 216、从某种意义上说，什么叫圣人？就是常常被人利用的人。 217、简单地说，官腔既是一种说话方式，更是一种话语权。老百姓，没有话语权，只能忍气吞声。 218、对付官腔的最好武器，就是良知和常识。不跟着官腔绕弯弯，跟着官腔绕，会把你绕得一点儿道理都没有，一点儿脾气都没有，一点儿头脑都没有。所以，最好的办法是：随你说千道万，我就坚持一点：良知和常识。最简单的思路，有时恰恰是最正确的死路。 219、协商不能解决的，用法。法度不能解决的，用刀。可见，官府不作为，会造成极大地社会问题：自己无力解决问题的，成了无依无靠的顺民。自己有力解决问题的，成了无法无天的暴民。暴民不是国家的力量，而是国家的祸害。顺民呢？同样糟糕：顺民不是国家的财富，而是国家的累赘。一个强大的国家和民族，既不要暴民，也不要顺民，要的是公民。 ⑥ 复仇之刀 220、培根认为，就对法律的破坏程度而言，对犯罪的报复，胜过犯罪本身，因为“犯罪是破坏法律，复仇是对法律取而代之”。非常可惜的是，这种清晰而理性的认识，在中国古代法律理论中，很是缺乏。恰恰相反，我们的传统文化倾向于肯定复仇。复仇事件时时发生，总能赢得喝彩，到处传扬。复仇人物常常出现，总能得到同情，甚至歌颂。也就是说，在古代中国，文化肯定复仇，文学歌颂复仇。《水浒》就是歌颂复仇之作。 221、实际上，在中国古代文学作品中，大量的对复仇事件津津乐道的描写，对复仇人物热烈的情感倾注，其中隐藏着一个极深刻的社会心理：那就是，全社会对封建法律的无信任，并通过文学作品表现出来。文学违背法律，是中国古代文学的一个普遍现象。当法律不能主持正义时，代表着社会良心的文学必然表现出对法律的失望和鄙视。 222、当法律不能及时有效地制止或惩罚这种对法律的破坏时，结果只有两个：第一，人们不再寄希望于法律，不再肯定法律，从而也就不会遵守和自觉维护法律。第二，个别的强梁会自行解决问题，用个人复仇来讨得被侵犯的公道。此时，正如培根所说，法律就已经被彻底取而代之。这是对法律的更大的破坏。而且，这样的破坏，还获得了道德的赞许。 223、胸中一团杀气，脸上却一团和气，满腹杀机却毫不露声色，武松做得出，鲁达、李逵做不出，林冲也做不出。与鲁智深、李逵相比，武松是最有心数的，做事时心中是最有规划的。像鲁智深、李逵，往往都是率性而动，事前并不谋划，临事全凭感觉，结果也往往没有预料。这样的人，可爱，但没有什么准头。而武松，在不动声色中，心中早已盘算好了一切，每一个步骤，每一个目标，每一个方式方法，每一个结果，都了然于心。看他做事，当时不一定明白，但事后一看，环环相扣，丝丝入扣，天衣无缝，一切都在计划之中。这样的人，令人佩服！有时也让人害怕！ 224、潘金莲的怨，潘金莲的恨，潘金莲的恶，潘金莲的罪……一切都结束了。这一把刀子，彻底清算了潘金莲的一生，也清算了叔嫂之间的爱恨情仇。 225、武松是《水浒》好汉中最酷的，又是最喜欢耍酷的。这一连串的举动，一定看得众位邻居心惊肉跳。这里既有武松的从容镇定，又有他的冷酷无情。酷，就是冷酷。 226、一个大型杀戳的人，偏偏礼数周到。最可怕的，就是这样的人。 227、武松，从此成了孤儿。这茫茫世界，再也没有了他的骨肉亲人。 228、武松很自恋。他自己觉得这事干得漂亮，他需要接受群众的欢呼。他知道，当官府惩罚他时，群众会为他欢呼。当法律判他有罪时，道德会给他加冕。他需要这样的道德冠冕。 ⑦ 再得兄嫂 229、对武松的道德肯定代替了、抹杀了对武松的法律判断。也正是从《水浒》作者到《水浒》读者共同的心理和选择。 230、在我们的观念里，道德大于法律。 231、武松的精细，不仅和鲁智深、李逵的莽撞形成鲜明的对比，而且，比起小心谨慎、算计精密的林冲，他也更胜一筹；林冲老是被别人算计，武松却是一直算计别人。 232、武松杀虎，赢在膂力。武松杀嫂，赢在智力。武松制服孙二娘，赢在眼力。 233、这就是中国传统文化中不好的一面。人人都特别看重体制之内的位置，把这些看成是自我的最高价值。还是一个小小的体制内的职衔，才为人们承认！这样的文化，就是御用文化，就是奴才文化。 234、虽然有这样的英雄事迹，武松还不足够自信，必须要有一个体制内的职位，方才觉得有面子。这种文化，拘束了多少英雄，又扼杀了多少英雄！ 235、公家人，是体制之内的人。 236、要不把你当牛肉，要不把你当领导。当领导，就把你供在主席椅上递烟敬酒。当牛肉，就把你放到剥人凳上开膛破肚。中国古代的受压迫、受剥削的民众，对公人，就给予这样的两种待遇，区别只在于场合。 237、《水浒》好汉们的所谓义气，大多数只局限于所谓的“兄弟”之间。认你做兄弟了，咱们义气；不认你做兄弟了，只有晦气——该麻翻还是麻翻，该开剥还是开剥。他从杀气到义气，就看你是晦气还是运气：他认不认你做兄弟。 238、如果张青归得早些，头陀就成了鲁智深；如果张青归得晚些，鲁智深就成了头陀。 239、武松的豪爽，比鲁智深不同，比林冲也不同。他的豪爽，似乎更彻底，但也因此不够本色，似乎有些做的成分。 ⑧ 施恩图报 240、武松还是天真，一个人，一旦做了差拨，哪里还会说好听话呢？狗嘴里吐不出象牙，差拨嘴里说不出人话。再说，差拨收钱，哪里还要开口讨呢？ 241、我们常常说人要懂事，但含义不一样：小时候，父母和老师让我们懂事，是让我们做一个好孩子，将来做一个好人。但是，待到我们长大了，常常被人告诫要懂事，那意思是什么呢？是让我们懂得一些潜规则，按潜规则办事。不懂潜规则，不按潜规则办事，那就叫不懂事。问题是，真正的好人、正人君子、质朴厚道之人，往往是对潜规则缺少悟性并不会按照潜规则办事的人，这样的人，就被大家认为是不懂事了！就要处处碰壁了！最后，在这个世界上，春风得意的，一定是“懂事”——懂得并且奉行潜规则——的机灵人。 242、武松不仅拳头厉害，他的嘴巴也厉害。他的拳头可以杀人，他的嘴巴也能杀人。 243、我们此前看过差拨骂林冲，刚刚又看过差拨骂武松。觉得天下的差拨，总是在骂人，而且骂得特别有水平，好像他们生来就是骂人的，我们生来就是挨骂的。我们很郁闷。现在，武松横空出世，嘴皮子一张，骂尽天下差拨，骂得他们一佛出世，二佛升天。解恨啊！读这样的文章，不亦快哉！ 244、差拨哪有不骂人的呢？天下乌鸦一般黑，天下差拨都骂人。 245、你不骂他，他不骂你。你若骂他，他必骂你。武松毕竟在官场上时间短，还有自尊，还不能容忍别人对他的人格侮辱。 246、武松是否太自信，我们暂且不说，但是武松这里表现出来的决不向邪恶势力低头的精神，则正是梁山精神的重要组成部分，也是梁山精神中值得肯定的方面。 247、也许，他们的谦卑，非常适合他们身处的环境，并且可以使他们和环境的冲突尽量缓和，从而符合生存原则，但是，我们仍然非常景仰武松式的自找苦吃甚至自寻死路，因为，这里面有一种我们的文化里，我们的现实里十分缺乏的东西：那就是高贵和绝不屈服，或者说，绝不因为求生或求稍好一点儿的境遇，就放弃自尊。 248、像差拨这样几乎急不可待的贪婪者，他也没有自尊。因为一个自尊自爱的人，决不会允许自己堕落到这等贪鄙。一个有羞耻心的人，哪怕就是这样贪鄙，至少绝不这样赤裸裸，至少要掩盖一下自己的丑陋。所以，差拨这种人，就是孟子所说的“无耻之人”，是完全自暴自弃、不可救药的下贱之人。 249、武松是一个特别善于自我欣赏的人，甚至有些自恋。自恋的人往往偏执到忘记环境，忘记自己的真实处境。但是，他不要命了。那他要什么呢？他要自尊，要显示自己的威风。于是，他把别人对他的“杀威棒”，变成了自己对别人的“扬威棒”。 250、一般情况下，为了捞钱，也为了杀鸡给猴看，以儆效尤，牢城营的管营，对于不孝敬银子的囚犯，这一百杀威棒，那是有条件要打，没有条件创造条件也要打。这样，才能使牢城营的犯人人人自危，个个惶惶不可终日，培育一心讨好差拨、管营的“良好狱风”。而今天，情况完全颠倒过来了：是，有条件不打，没有条件创造条件也不打。 251、武松吃软不吃硬，可以恩结。以恩结，乃知恩图报之人。在这个恩将仇报的社会里，这是很难得的境界了。然而，还不是最好境界。最高境界乃是以义结：度义而动，见得思义，一切唯义是从，不可屈服，不可收买，不可诱惑，不可恐吓。这样的人，才是富贵不淫、贫贱不移、威武不屈的真好汉。 252、梁山有没有以义结的真好汉？有。谁呢？鲁智深。鲁智深一生，虽然莽撞率性，却大节不亏，终成善果。一生不做亏心事，靠的不是性格，而是品格；一生能得善终，关键不在小心，而在大义。 253、知恩图报和施恩图报，一字之差，境界不大一样。知恩图报是懂得人情冷暖，是以德报德，是对别人给予自己的帮助、照顾的回报，是人类的可贵品德。而施恩图报则是一种投资行为，甚至是一种笼络和约束行为，是对人的利用。他施出的一点儿投资，是要加倍收回的。 254、武松是底层人，所以，特别需要别人的承认，需要别人的恭维，需要别人的看重。一旦有人看重他，他就肝脑涂地以报，而不问什么是非。 ⑨ 黑帮老大 255、一个欺负到妓女头上的人，当然不是英雄。施恩也没有想过做什么英雄，在做人境界上，他比张青还低一个档次。他骨子里就是一个黑社会的老大。其人生目标不过就是追求快活而已。 256、当时，有很多人活得不快活。所以，人们才近乎疯狂地追求快活，甚至为此不惜违背道德，触犯法律。一个社会如果让很多人都活得不快活，那这个社会也就快要活到头了。 257、梁山一百零八人，大多数根本没有什么理想，多数不过就是追求“快活”而已。我们不必拔高他们。当然，也不必为此贬低他们，毕竟，追求快乐是人的权力。 258、蒋门神和施恩之间的斗争没有正义与非正义的区别，就是黑吃黑，大黑把小黑吃了。 259、黑社会人的口吻、黑社会人的心态，又黑，又狠，又歹，又毒。 260、这常常是非常缺乏头脑的好冲突的小青年的思维方式。很多小青年闯祸，就是因为这种忽略遗忘关键问题、越过关键问题的思维缺陷。 261、从某种意义上说，蒋门神的出现，太及时了。他出现在武松生命的黯淡时刻，出现在武松自己最需要发出光彩的时刻，出现在武松最需要向别人展示自己的时刻。一句话，到了一个新地方的武松，需要有一个扬名立万的机会。 262、心中有虚，怕人看出，便先行掩饰。正如和人说话时，眼睛不敢对视，常下意识遮住嘴巴，都是言不由衷的表现。 263、武松的表现，也有墨子所批评的“恶勇”的毛病，自己是勇士豪杰，希望天下的人都是懦夫软蛋，雌伏在自己脚下。这是非常糟糕的心态，秦始皇等专制君主，就是这样的心态。其实，有这种思想的武松一旦当权，也一定希望天下都是顺民，都是奴才。 264、武松自恋，武松还自负，武松更自信。 265、鲁智深是仗义型正义派打法。他总是在别人需要的时候出现，在仇恨难消的时候他来消，在冤屈难解的时候他来解，所以，他打架，必是痛快淋漓、场面血腥，因为不这样，就不足以解恨消冤。他的兵器，是禅杖。禅家的手杖，就是解脱的法门：超度那些作恶多端的，解救那些苦难深重的。林冲是技术型实力派打法。他赢别人，是赢在技术上，他是一个职业军人，用自己的武艺，为梁山服务，后来又为朝廷服务。李逵是效益型无赖派打法。他只要杀得快杀得多，贪多务得，细大不捐，杀得性起时，不管眼前是谁，是男是女，是老是少，是好人坏人，一并砍了，越多越好。所以，他的兵器，都是板斧，板斧是所有兵器中造型上最缺乏艺术元素的，正如李逵自己是梁山好汉中最无艺术细胞的。武松呢？他又不同，他是炫耀型潇洒派打法。无论打前，打中，打后，他都有极强的表演欲。他一定要有观众，至少他想象中有观众。观众能激发他的灵感，让你兴奋，面对观众，他往往激情四射，特别有想象力，从而打得特别有创意，有看头。所以，我们也可以称他是激情型的演技派。 266、武松打人也好，杀虎也好，好看。 ⑩ 重霸江湖 267、义愤和气愤，一字之差。一是出于义，一是因为气。义是大义，大义所在，君父可以不从。所以，大义可以灭亲。气是小气，小气所使，是非往往不顾。所以，小气可以殒身。 268、他要一种形式，一种激情洋溢的形式，一种让别人觉得他帅呆了、酷毙了的形式，让他充分展示他的激情，展示他的魅力，展示他的个性。 269、世事大抵如此：有一潇洒人，必有众多不能潇洒的人。一个单位，有一个潇洒的员工，必有至少一个以上不潇洒的勤勉忠厚的员工，为他承担，为他擦屁股。一个家庭，有一个潇洒的老公，必有一个不潇洒的辛苦的老婆。反之必然。有一个潇洒的儿子，必有一双俯首甘为孺子牛的父母，苦死苦活。 270、潇洒之人必有自私之处。 271、一丝超脱，一丝颓废，一双看穿世俗名利的冷眼，一副不屑一顾的面孔。《水浒》的作者，写《水浒》时，何等放松，何等自由，何等自在！ 272、要闹事，有时也不容易。做流氓，也要有专长。 273、为什么流氓在市井几乎百战百胜？因为，流氓没有底线。当他把自己降到底线以下，无所不用其极，你只能有两种选择：第一，你置之不理，那你将被他糟践得体无完肤，毫无尊严。第二，你与他理论，那你将与他纠缠在底线之下，毫无体面。 274、鲁智深总是搭救女人，武松总是欺负女人。 275、武松很傻很天真，武松很黑很暴力。但是，不得不承认，他也确实很棒很能干。 ⑪ 英雄大意 276、暴力是权力的极端形式。 277、梁山就是一种体制外的权利，或者说是一些人权力欲在体制外的实现。梁山的建立，就是在体制外再建权利体系，实现一些人的权力欲。 278、武松有着睥睨天下英雄的气度，这种骨子里的自信自尊自负自大，他是要时时表现出来的。 279、快活快活，就是很快就要过去的生活。 280、武松是个大人，是个英雄，是个豪杰，是个好汉。但是，他经常会暴出他的“小样”：有些谄笑，有些讨好，有些巴结，有些奴颜，有些媚骨……说得好听一些，他吃软不吃硬，知道感恩戴德。说得难听一些，一遇到权势，一遇到权势给他一点儿颜色，他马上感激涕零，恨不能肝脑涂地以报。 281、无论你是多么大的英雄，只要你无有官职，不论你碰到多么小的芝麻粒大的官，你马上就泄气了，马上就吃瘪了，英雄马上就成了狗熊……这是另一种形式的“苛政猛于虎”！ 282、司马迁曾经感慨万端地说，“士方其危苦之时，易与耳！”意思是说，当一个人，在他落难的时候，很容易的就可以结交到他。因为这样的时候，他最需要关心，最需要尊重，并且，要求的不多不高，一点点的关照和恩惠，就可以获得他的感激，从而获得他的友谊，获得他的忠诚。 283、小人确实常常得志，但是，小人永远不会得到福气。 284、小人的脸啊，就是六月的天，说变就变。 285、为什么不容分说？因为，无须分说。因为你要说的，大家都知道。大家都知道的事实，还要你说吗？大家要你说的是：大家要你说的。为什么对你又是打又是骂？就是教导你明白这个道理。就是让你说出大家要你说的。 ⑫ 逃出生天 286、在专制时代，好人，是黑暗亡国的一线光明，是被侮辱、被伤害人们的一线生机。多一个好人，这世界就多一条生路。 287、为什么哭？第一，不快活。第二，除了哭，没别的法子。 288、这世界，多少人为了快活，最后闹得不快活。不快活往往因为太想快活，想过分快活。 289、权力是暴力的最基本形式；暴力是权力的最极端形式。一个社会，只要是权力控制一切，那它和黑社会就没有本质区别。 290、武松是一个快意恩仇的人。你如何对我，我便如何对你，你是好人还是坏人，他倒不大计较。 291、心中对人一有恶念，自己即成恶人。什么叫恶人？有恶念，即是恶人。心中对人一有仇恨，自己即成仇人。什么是仇人？有仇恨，即成仇人。白刀子还没进去，红刀子已经出来了。一旦存心你死我活，你未死，我却已然不活。 292、世界上就是常常有这样的人，他们论其秉性，不配做朋友。论其能力，不配做对手。可是这种人偏偏选择与人为仇。生活中碰到这类人，就如同一只癞蛤蟆跳到脚背上：它也伤害不了你，但是它恶心你。 293、人谋阴险，岂料天公在上，天意更为难测！正所谓，人心惟危，道心惟微。那微妙的天意，随时会让他们的如意算盘落空。 ⑬ 虎头狗尾 294、物以类聚，人以群分。这不仅仅是眼光问题，更是自身境界问题。 295、在武松的思想里，大概也是宁可错杀一千，决不放过一个。更何况，在那样的形势下，他也无法先甄别善恶，有罪无罪，再行下手。 296、武松有义气，却没有是非。这也是梁山好汉共同的特征。 297、梁山好汉，特别讲究男女之大防。但凡看见男女之事，便陡生道德之心，一定要清洁世道。事实上，思想越单纯的人，道德意识往往越强。越倾向于从道德角度给人贴标签，对人下判断。梁山好汉，有知识有文化的极少，整体的思维水平相当低。他们的为人处世，往往只是凭借他们淳朴的道德直觉，对事情的判断，也只是依赖他们简陋的知识体系提供的判断是非的简陋方法和标准。他们对人对事的判断，好像就是简单的“好”与“坏”。更糟糕的是，这“好”与“坏”，又并非有一个贯穿始终的原则性的东西，而是情随事迁，以我为主。 298、武松是一个很霸道的人，崇拜武力，并且老子天下第一，甚至，老子天下唯一。他自己崇拜自己，他也要别人崇拜自己，他要别人永远把他摆在第一的位置上，如若不然，他就会觉得伤了自尊，他就会动武。 299、一个英雄大汉，却和黄狗为敌！一个打虎英雄，却被一只黄狗羞辱！这是不是作者故意在奚落武松？你太强了，你太要强了，最后，你连狗都嫌，连狗都嫌你。连狗都嫌你，你会死得很惨。 300、他的一生，以打虎始，以打狗终。以打虎取胜始，以大狗落败终。他的一生，真是虎头狗尾，令读者废书而叹。 301、他是天伤星，一生伤人无数，于是，天也要伤他。人伤人，乃是出于恨，是为了伤害；天伤人，乃是出于爱，是为了拯救。人伤人，是为了杀，是为了毁灭人；天伤人，是为了生，是为了成就人。 302、武松最终的形象，定格在断臂上。这很容易让人联想到断臂维纳斯，想到“缺憾就是圆满”。或许，人生就是这样：只有丢掉了，才能圆满。恰如武松，丢掉了一条胳膊，最终也才获得了生命的小圆满。 原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/709124224 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香"
