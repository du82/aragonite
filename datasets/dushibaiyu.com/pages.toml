full_description = "《玄机变》 一个很老的视频。天下2的跨年宣传大片，我也因为此片玩了很久天下3、、 最喜欢玉机子7分中左右说的有一段话： “如果神灵真的代表真理 那么为何世道如此不公 卑劣的人为所欲为 让真正纯洁善良的人受到侮辱和伤害 如果大荒生灵终其一生 都只能注定成为神魔的棋子 那么这神灵的存在 又意义何在？” 视频： http://v.youku.com/v_show/id_XMjUwNDAwNTYw.html 附上视频的全部对白： 永远都不要否认自己存在的意义和价值 因为 你是自由的 永远都不要放弃对力量和信念的追求和渴望 因为 你是神圣的 真龙已死 雏儿不足为惧 我们靠自己的力量一起征服天下吧 我们将和幽都的力量一起 横扫这个腐朽而又堕落的凡间 把真正的自由和力量散布到整个大荒 天下 我来了 天地万物 皆有灵魂和力量 世间的一切灵魂和力量 应该都可以被完美保存 与妖魔为伍 偷偷投到太古铜门后面的那股力量 这可是逆天弑神的事情 什么大荒将士 王朝兴衰 什么幽都和东海的争斗 根本就不在我的考虑之内 玉玑子国师你到底想干什么 陛下想成为龙 而我想成为神 只有控制了凡间之龙 我才能成为众生之神 我想念你师傅 真正最高的武学不在江湖 不在邪道 而在名门正派的高塔之中 在正统权利的巅峰之上 师傅 你为什么要做魔女呢 你对邪影和力量本身都没什么兴趣呢 我不满这个天下 但我的力量却丝毫无法撼动这个污浊的世界 取下我的头颅 去投奔太虚观吧 那里 有所有邪影的真传 许多年后 我终于知道 那个邪影小孩其实是另一个自我 莫非云师傅 我要跟随你 告诉我得到力量的方法吧 我愿意付出任何代价 真是个有趣的孩子 从不否认自己存在的意义 君生我未生我生君已老 无论今后我能得到多少权利 改变多少世界的规则 我未来的天下你都不会看到 所以 我未来的世界 将永远沉静在黑暗之中 因为只有这样 才能感受到你的存在 师傅 你虽然没有力量 却有一颗凡人的心 一颗比神魔更坚定勇敢的心 你们是我心中最依恋的人 我未来的天下 应该有你们才圆满 我很高兴 你长大了 也许有一天你真的会成为这个天下 新主人 我不叫凡人 我的名字叫“玉肌子” 我相信总有一天 所有的凡人都能够找到属于自己的力量 都能够拥有和天地神魔对抗的力量 永远都不会在受到任何势力的压迫和制约 无论是东海还是幽都甚至创世主神 都会尊重真正属于我们的自由 如果神灵真的代表真理 那么为何世道如此不公 卑劣的人为所欲为让真正纯洁善良的人受到侮辱和伤害 如果大荒生灵终其一生 都只能注定成为神魔的棋子 那么这神灵的存在 又意义何在 如果连这最初的愿望也无法实现 那么 就逆天吧 和我一起走到大荒和人类权利的顶峰吧 一定能发现神的秘密 然后和你我的影子一起摧毁这个由神灵设下的腐朽秩序 创造一个崭新的世界 因为 我 就是 天下 Author 渡世白玉Posted on 2013年10月18日2015年8月21日Categories 其它Tags 大荒, 天下, 棋子, 玄玑变, 真理, 神灵, 逆天"
