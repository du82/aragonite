title = "我就是我，我就是渡世白玉 | 渡世白玉"
description = "PS：个人自省记录，无关技术，无关他人，酌情阅读，浪费汝等时间勿怪吾、、 先摘抄两段来自洛水的《知北游》的几段话，以前看过多次，虽为龙蝶悲哀，被林飞震撼，只是一直未能领悟，今得恍然大悟，自己何尝不曾失败，不曾失去本心。 < 龙蝶突然问道：“走到今天这一步，你后悔吗？” 我想了很久，才道：“你问今天的我，是否会为昨天的我而后悔，这个问题本身就是一个错误。” 龙蝶眼露出疑惑之色，我淡淡一笑：“昨天的我，自有昨天的执着，怎能因为今天的失败，就否定了过去的我？若是如此，人生永远只剩下后悔。后悔当时没有多一点勇气，后悔当时没有努力修炼，后悔当时错过了唾手可得的选择” “一个人慢慢成长，从婴儿变成少年，逐渐成熟衰老。每一个我都汲取了过去的我所有的经验、体会，得以不断蜕变。没有过去的我，哪来今天的我？又何来我的后悔？这其，我做出的每一个选择，哪怕再幼稚、再愚蠢、再错误，也是当时的本心做出的选择。既然出于本心，何来后悔之说？” “若是林飞从未改变，那么我这几十年，岂不是白活了？” “龙蝶，从吞噬的角度而言，你确实赢了。但就本心而论，你输得彻底。因为你的本心早已死了，死在前世一次次的失败，死在对自己的质疑。从你将我分裂出来的那一刻，龙蝶就已经死了。” “因为那一刻，你将自己的命运，交给了林飞。” > < 我盯着龙蝶明灭不定的眼神，望着那两团黑夜的篝火时而暴涨，时而黯淡，想象着他将我分裂出来时的绝望。 意气奋发、自命不凡的龙蝶，在北境闯荡一生，最终虚耗光阴，一事无成，只能将希望寄托于另一个重新开始的我。 “但生命不需要重新开始。”我平静地道，“龙蝶，为什么不能自己坚持下去？你害怕不断地面临失败？你累了，绝望了，你两手空空，最后剩下的只有等待，等待别人来给你希望。” “龙蝶，你也是抱柱而死的尾生啊。”我坚定地摇摇头，“你看，我们是不同的。” > < “为什么？”我隐隐听到后方的龙蝶在问，他就像一座衰败的坟墓，发出空寂的叹息。 “龙蝶，你知道你我之间，最大的不同是什么吗？” “从我施展寂眠力的那时起，我就没指望过别人来将我唤醒！” “这一生，我从不等别人来将我唤醒！” “我会唤醒我自己！” “这就是道啊！” 龙蝶怔怔地望着我，仿佛僵住了。许久，他仰天爆发出震耳欲聋的狂笑声。 > 以我本心，以抗天命。当初你看此小说的，也认同此句话，你也不知看过一遍此书，只是知道和领悟毕竟还是有距离的。 只有面对，才能解决，才能明了天命，明了本心。在龙蝶选择转世分离出林飞时，把自己的命运即算交给了自己，也算放弃了自己的命运。毕竟部分的自己不是自己啊！！只有完整的自己才是自己啊！！ 你也曾说：渡世白玉就是你，但你不是渡世白玉，犹如正方形是菱形，而菱形不是正方形一样。你也想重生靠一个也是自己的别人去拯救你吗？只有正视自己，才能拯救自己啊！好的那面是你，坏的那面也是你啊，积极自信的那面是你，消极懦弱的那面也是你啊！接受完全的自己才是接受自己，只接受好的那面，坏的那面也不会消失的，越是你看重你好的那面，你也越摆脱不了坏的那面。好坏相随。你接受你坏的那面，你才能去提高它，去转变它，逃避只会让其欲演欲烈的。 从你07年下半年取得此昵称，至此也已有些年头了，你却到今天才算完全接受它。何其之悲哀啊！你自己呢？成长二十余载，懂事也已十余載，今日才算是成为一个人。一个人连自己都逃避的人，怎会去正视他人，正视困难？ 以我本心，以抗天命。今日始正视本心，正视自己。何其不幸，又何其幸运。"
