full_description = "怎样做到不惑、不忧、不惧？ 梁启超在清华大学的演讲，历久弥香。 【一】 问诸君“为什么进学校？”我想人人都会众口一辞的答道：“为的是求学问。”再问：“你为什么要求学问？”“你想学些什么？”恐怕各人的答案就很不相同，或者竟自答不出来了。诸君啊！我请替你们总答一句罢：“为的是学做人。” Continue reading “怎样做到不惑、不忧、不惧？” Author 渡世白玉Posted on 2014年9月15日2015年8月21日Categories 分享文字, 文字飘香Tags 不忧, 不惑, 不惧, 仁者, 做人, 勇者13 Comments on 怎样做到不惑、不忧、不惧？ 和什么样的人在一起，就会有什么样的人生 和优秀的人在一起真的很重要，跟什么样的人就成为什么样的人！ 1、普通人的圈子，谈论的是闲事，赚的是工资，想的是明天。 2、生意人的圈子，谈论的是项目，赚的是利润，想的是下一年。 Continue reading “和什么样的人在一起，就会有什么样的人生” Author 渡世白玉Posted on 2014年9月12日2015年8月21日Categories 分享文字, 文字飘香Tags 优秀, 朋友8 Comments on 和什么样的人在一起，就会有什么样的人生"
