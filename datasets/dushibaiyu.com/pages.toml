title = "乱语胡言 | 渡世白玉"
description = "对于大多数东西，只要你努力就能够得到、、、只是二十岁能买得起十岁十分想要的玩具，得到了，意义呢？有人说：享受的是追逐的过程，而不是结果。说这句话是不是对于结果失望的一种自我安慰？ 很多时候，有些事一直想都可能不会明白的，但是那天不经意间就会豁然明白了、、、但是有些事当你明白后才发现，其实糊涂着比明白要好、、、"
full_description = "乱语胡言 人越是长大，心越小，梦越小。是我们成熟了，现实了？还是懦弱了，害怕了呢？ 道曰无为，佛曰轮回，基督救赎，只是这些宗教怎么都有一丝悲观的色彩？世间本质是否就是悲观的？只是他们也都强调积极乐观的活着，我们何尝不是应该以积极去面对世间的悲观，只是不要忘记本质是悲哀的、、、 任何无条件下的是非观念都是洗脑！“度”，任何事情，任何真理都是有适用范围的，善恶亦然、、、 不记得在那听到或看到的这句话：“思想越简单的人，道德是非观念越重。”，是的，任何事情都不会是孤立的，善也罢，恶也好，可能都不是你看到的那样，越是知道背后，越是无法下结论，唉、、人生简单才快乐、、虽然可能有些事情不是那么对吧、、、 越是深入的事物，越会发现自己的无知，也就越是谦逊，所以狂妄自大的往往都是无知者，真正的智慧的都会知道自己的无知的，都会是谦逊的、、 任何事情都是有代价的，失也罢，得也好。得到往往也就意味着失去，人生就是不断的交换，不断的失去和得到，只是到底是得还是失，皆由一心、、、 世人却往往喜欢别人来代替他们思考，来直接告诉他们答案是什么，应该做什么，不应该做什么。 人生贵在问心无愧！只是几人能做到？一个连自己都不能完全面对的人，可能完全以诚待人吗？反之，一个连自己都毫不畏惧面对的人，还会在意别人吗？还会在哪儿遮遮掩掩吗？ 很“机巧之械必使人生技巧之心”，“其耆欲深者，其天机浅”。 对于大多数东西，只要你努力就能够得到、、、只是二十岁能买得起十岁十分想要的玩具，得到了，意义呢？有人说：享受的是追逐的过程，而不是结果。说这句话是不是对于结果失望的一种自我安慰？ 很多时候，有些事一直想都可能不会明白的，但是那天不经意间就会豁然明白了、、、但是有些事当你明白后才发现，其实糊涂着比明白要好、、、 能改变环境就改变环境，不能改变环境就改变自己，如果不值得改变自己，那就换个环境、、、 Author 渡世白玉Posted on 2014年4月1日2015年8月21日Categories 文字飘香, 随笔"
