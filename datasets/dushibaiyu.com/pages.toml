title = "我是一颗树——以前无聊所做，没啥价值，仅仅纪念 | 渡世白玉"
description = "我是一颗树 却被种在花盆中 我有充足的水分去吸收 却无处供我延伸根须 我有充足的营养 却无处供我壮大身躯 我是一棵树 却生长在温室中 我不必害怕风雨的摧残 却不知微风细雨的温柔 我不必担心烈日的灼伤 但也不知阳光的温暖 我是一棵树 希望能跃出花盆 即使没有充足的水分 我也能伸长根须找足 即使没有充足的营养 我也能自己创造，去成长 我是一棵树 希望能走出温室 即使遭受风雨的摧残 我也能生出新芽 即使被烈日灼干 我也不悔， 至少奋斗过！！！！！！！！！！"
