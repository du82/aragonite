full_description = "平淡的境界 作者：周国平 来自：随便看看吧 一 很想写好的散文，一篇篇写，有一天突然发现竟积了厚厚一摞。这样过日子，倒是很惬意的。至于散文怎么算好，想来想去，还是归于”平淡”二字。 以平淡为散文的极境，这当然不是什么新鲜的见解。苏东坡早就说过”寄至味于淡泊”一类的话。今人的散文，我喜欢梁实秋的，读起来真是非常舒服，他追求的也是”绚烂之极归于平淡”的境界。不过，要达到这境界谈何容易。”作诗无古今，惟造平淡难。”之所以难，我想除了在文字上要下千锤百炼的功夫外，还因为这不是单单文字功夫能奏效的。平淡不但是一种文字的境界。更是一种胸怀，一种人生的境界。 Continue reading “平淡的境界” Author 渡世白玉Posted on 2012年3月26日Categories 分享文字, 文字飘香Tags 伟大, 周国平, 境界, 平淡, 思考1 Comment on 平淡的境界"
