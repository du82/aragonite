title = "鲍鹏山新说《水浒》经典语录精选之序 | 渡世白玉"
description = "奇文水浒 安能不读——（《鲍鹏山新说》） 1、其实，乐土往往不在王道所在的地方，恰恰在那王道不及的遥远的水浒！ 2、天下最凶险之地，乃是官场。体制之内，几乎是死门；而生门所在，恰是体制之外的江湖。 3、《水浒》的字里行间布满了作者的情思：在苦难中，有浪漫；在泪光中，有笑容；在现实中，有理想。《水浒》不仅写了英雄的可怜，更写了英雄的可敬；不仅写出了人世的寒凉，也写出了这寒凉中的一丝暖意。"
full_description = "鲍鹏山新说《水浒》经典语录精选之序 本文系互联网转载，原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/709124224 原作者声明：“《鲍鹏山新说<水浒>》精彩语录”由leyang114228从《鲍鹏山新说<水浒>》两册书中花大量时间精选编辑而成，共六系列。 正文：奇文水浒 安能不读——（《鲍鹏山新说<水浒>》） 1、其实，乐土往往不在王道所在的地方，恰恰在那王道不及的遥远的水浒！ 2、天下最凶险之地，乃是官场。体制之内，几乎是死门；而生门所在，恰是体制之外的江湖。 3、《水浒》的字里行间布满了作者的情思：在苦难中，有浪漫；在泪光中，有笑容；在现实中，有理想。《水浒》不仅写了英雄的可怜，更写了英雄的可敬；不仅写出了人世的寒凉，也写出了这寒凉中的一丝暖意。 4、一百零八人，其社会身份，不过是强盗。其可贵者，其为人所首肯、心仪者，正是他们洒向人间的那一丝温暖。 5、《水浒》告诉我们，这世界虽然被封建统治者霸占着，但仍有出路，供无路可走之人奔逸，这就是水泊梁山。而梁山，就是这样一个平等理想的世界。 6、王法没了，清官没了，但是，只要兄弟还在，就还有活路！ 7、“兄弟”一词，在《水浒传》里熠熠生辉！这个词的分量，从没有像在《水浒》中那么重，那么引人唏嘘。 8、这个社会正常的合法的生活，他们已经无法分享；这个社会的正常体制，他们已无法进入；这个社会的体面的餐桌边，已经没有了他们的位子和餐具，他们都是被抛弃的人、被迫害的人，但是最终他们没有自暴自弃，自甘堕落，他们没有被逼成侏儒，没有被逼成奴才，没有被逼成废物，恰恰相反，他们被逼成了英雄。 9、官府不能保障的，只好靠民间；公权不能维护的，只好靠私力。 10、《水浒》中的侠客义士，不是从天而降的，他们原来就是细民，就是芸芸众生，就是被人欺压而无处诉说的苦人。他们在黑暗势力的压迫欺凌下，一忍再忍，一退再退，最后无处可退，五路可走，于是上演绝地反击，由任人宰割的细民，变成横行江湖的英雄。他们不但掌握了自己的命运，还能在相当程度上影响他人的命运，甚至国家的命运。 11、《水浒》中那些真英雄们，体现了我们民族的阳刚气质，体现了我们民族的英雄精神。他们的行为和性格，展现了我们民族的血性与生气。 12、说他们，也就是说时代，说文化，说社会，说人生。从他们那里，我们看到的，不仅是他们，也是我们。 关于鲍鹏山请见百度百科：http://baike.baidu.cn/view/904900.htm 鲍鹏山博客：http://blog.sina.com.cn/u/1369229445 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Tags 鲍鹏山"
