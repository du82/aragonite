["https://www.dushibaiyu.com/2013/12/vim%e5%b8%b8%e7%94%a8%e5%91%bd%e4%bb%a4%e7%ac%94%e8%ae%b0.html"]
title = "vim常用命令笔记 | 渡世白玉"
description = "一、打开文件、保存、关闭文件(vi命令模式下使用) vi filename //打开filename文件 :w //保存文件 :w vpser.net //保存至vpser.net文件 :q //退出编辑器，如果文件已修改请使用下面的命令 :q! //退出编辑器，且不保存 :wq"
full_description = "vim常用命令笔记 一、打开文件、保存、关闭文件(vi命令模式下使用) vi filename //打开filename文件 :w //保存文件 :w vpser.net //保存至vpser.net文件 :q //退出编辑器，如果文件已修改请使用下面的命令 :q! //退出编辑器，且不保存 :wq //退出编辑器，且保存文件 二、插入文本或行(vi命令模式下使用，执行下面命令后将进入插入模式，按ESC键可退出插入模式) a //在当前光标位置的右边添加文本 i //在当前光标位置的左边添加文本 A //在当前行的末尾位置添加文本 I //在当前行的开始处添加文本(非空字符的行首) O //在当前行的上面新建一行 o //在当前行的下面新建一行 R //替换(覆盖)当前光标位置及后面的若干文本 J //合并光标所在行及下一行为一行(依然在命令模式) 三、移动光标(vi命令模式下使用) 1、使用上下左右方向键 2、命令模式下： h/Backspace //向左 j //向下 k //向上 l/空格键 //向右 Enter //移动到下一行首 – //移动到上一行首 Ctrl + f //上一页 Ctrl + b //下一页 W/w //跳到下个单词开始，大写忽略标点 E/e //跳到单词结束，下个单词结束，大写忽略标点 ^ //跳到行首 $ //跳到行尾 gg //跳到文档开始 G //跳到文档结束 n+ //向下跳转n行 四、删除、撤销、重做、复制、粘贴(vi命令模式下使用) x //删除当前字符（光标） X //删除光标前一个字符 nx //删除从光标开始的n个字符 dd //删除当前行 ndd //向下删除当前行在内的n行 u //撤销上一步操作 U //撤销对当前行的所有操作 Ctrl + r //恢复上一步操作 yy //复制当前行 yw //复制当前单词 p //粘贴 . //重复上一条命令 五、查找和替换(vi命令模式下使用) /vpser //向光标下搜索vpser字符串 ?vpser //向光标上搜索vpser字符串 n //向下搜索前一个搜素动作 N //向上搜索前一个搜索动作 :s/old/new //用new替换行中首次出现的old :s/old/new/g //用new替换行中所有的old :n,m s/old/new/g //用new替换从n到m行里所有的old :%s/old/new/g //用new替换当前文件里所有的old 六、显示隐藏行号 :set nu //显示行号 :set nonu //隐藏行号 七、窗口操作 :split //水平方向分割出一个窗口 :vsplit //垂直方向分割出一个窗口 :close //关闭窗口 :e otherfilename //编辑文件名为otherfilename的文件。 八、执行 shell 命令 在 Vim 中也可以执行 shell 的命令。在命令模式下，指令: :!command // command 是 shell 命令。 例如 :指令 :!date 会把目前的时间和日期显示到萤幕上。 :r !command //把 shell 命令的结果放到文件中。 比如 :r !date 会把现在的时间放到光标所在的行的下一行。 :nr !command //把 shell 命令的结果放到文件第n行中 例如 :20r !date 会把现在的时间放到第二十行。 也可以选择档案中的文字作为 shell 命令的输入。输出的结果会把替换掉你输入的文字。 例如 :2,5!sort 会把第二列到第五列的文字依序排列，而原来的文字就会被覆盖。 Author 渡世白玉Posted on 2013年12月19日2015年8月21日Categories LinuxTags linux, vim, 命令"
