full_description = "这些年，你过得怎么样——《我们如何走到这一步》序言 这些年，你过得怎么样 我曾经想过，如果能时光穿梭，遇见从前的自己，是否可以和她做朋友。但我审慎的不敢发表意见。因为从前的自己是多么无知、狂妄，这件事是很清楚的。就算怀着再复杂的爱去回望，没准儿也能气个半死，看着她在那条傻乎乎的路上跌跌撞撞前行，忍不住开口相劝，搞不好还会被她厌弃。你看天下的事情往往都是一厢情愿。 Continue reading “这些年，你过得怎么样——《我们如何走到这一步》序言” Author 渡世白玉Posted on 2013年12月26日2015年8月21日Categories 分享文字, 文字飘香Tags 我们, 时光倒流, 未来2 Comments on 这些年，你过得怎么样——《我们如何走到这一步》序言 vim常用命令笔记 一、打开文件、保存、关闭文件(vi命令模式下使用) vi filename //打开filename文件 :w //保存文件 :w vpser.net //保存至vpser.net文件 :q //退出编辑器，如果文件已修改请使用下面的命令 :q! //退出编辑器，且不保存 :wq //退出编辑器，且保存文件 Continue reading “vim常用命令笔记” Author 渡世白玉Posted on 2013年12月19日2015年8月21日Categories LinuxTags linux, vim, 命令11 Comments on vim常用命令笔记 孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思! PS：教育的最终目的不应是知识，而是修养！知识是教育的内容，而修养才是教育的最终产物！我们学习知识是一个由技入道的过程！犹如剑客的终极不是剑法达到巅峰而是进入剑道的境界！沉溺于那些成绩排名何尝不是沉溺于那些花俏的招式，而与真正的高手无缘、、 正文： 在大多数中父母的眼里，孩子的学习成绩似乎比任何其他都系都重要，但学习成绩真的如此重要吗？本文来自一个麻省理工学院毕业生对中国教育的反思，值得中国父母去关注深思。 Continue reading “孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思!” Author 渡世白玉Posted on 2013年12月8日2015年8月21日Categories 分享文字, 文字飘香Tags 孩子, 成绩, 教育, 重点1 Comment on 孩子的学习成绩有多大价值?一位麻省理工毕业生的惊人反思!"
