title = "True Love Kiss——真爱之吻 | 渡世白玉"
description = "《沉睡魔咒》，两个True Love Kiss，整个故事，一个悲剧，一个喜剧。 第一个：Maleficent 和 那个偷东西的小贼，后来的国王。 第二个：王子和公主，打破诅咒的True Love"
full_description = "True Love Kiss——真爱之吻 《沉睡魔咒》，两个True Love Kiss，整个故事，一个悲剧，一个喜剧。 第一个：Maleficent 和 那个偷东西的小贼，后来的国王。 我这么说，很多人可能会嗤之以鼻，这个渣男会有Love？我认为是有的，真的是True Love。只是生活毕竟不是童话，爱情并不能满足一个人全部的，可能刚开始那几天被激情沖昏头脑才会以为有爱情就有了全部吧。越是灿烂，冷静后越是寂寥，当时光慢慢过，你总还要去面对生活，面对你的追求，面对你的欲望，面对·····毕竟人类不是精灵，不是都能放下，不是都能无忧无虑。但是，不能因为以后的变故就否认以前存在的东西。 世上没有不变的东西、、每一件东西在每个人心中的价值也是不一样的、、一个从小在谷仓长大的孤儿，他的内心该是多么匮乏，多么需要认同，对物质是多么缺乏，你能想想得到吗？我是想象不到，但是我理解。他去森林偷宝石，走时还对女主说早知你扔了，还不如我拿回去呢。他追求的是住进城堡的，是人们的认同，是物质的丰盛。从一开始所在的世界和追求的都是不一样，但是谁错了吗？没，都没错的、、 一直努力的追求，却只还是一个仆人，还是一个被人呼来呵去的下等人，甘心吗？但是，命运谁也说不定的，一个直接翻身的底牌出来了，谁能报仇，谁就是继承人！这是何等的诱惑，国王啊！古来为了帝王，兄弟相残，父子相残，少吗？几人在这诱惑之下能抽身而退？何况还是一个对地位，对物质十分追去的人？是你，你能吗？至少我是不敢直接说我能抽身的，虽然最近在看老庄之道。在这等诱惑之下，爱情只是牺牲品了、、他两次想直接杀了，但是还是不忍，最后只是割了翅膀回去换取了富贵。在他执政到有女儿之间，一次也没去侵犯过森林，虽然老国王一直想要除掉森林的。女主就乌鸦的那块，乌鸦讨厌变成人，女主说是为了救你的生命。我想他在割翅膀的时候应该也想过，这样既可以让我富贵，也可以保你姓名，最好不过了。 第二个：王子和公主，打破诅咒的True Love 先说下诅咒，爱恨往往只在一线之间，爱越深，恨越切。欲望能使我们迷失自我，恨亦然。女主恨之切，所以也就不再是精灵的美好了，所以有了你当国王威风，我同样也能威风，我做女王！而且，你拿走了我的翅膀，我让你失去亲人，让你欢喜成悲。所以在公主举行典礼的时候下了一个诅咒，只是爱一个人容易，恨一个人同样容易，放下对一个人的爱容易啊？让你求饶是为了满足自己，为了给你惩罚，同样是对你还有一丝情谊、、国王求饶，我想不单单只是为了女儿，也是为了自己，为了自己的一丝良心，求饶也不仅仅是为了女儿。只是爱难断，恨亦难！一个真爱之吻的妥协，何尝不是一种证明？ 愤怒的时候永远不要做决定，恨亦然，恨欲切，你的确定越是让你明悟时悔。保持一个真正的自我不容易。自己下的诅咒，自己去解时却无能为力，怪自己当初lost，做的太绝。 对于一个面子爱好者来说，折了他所谓的尊严，你就是万恶不赦的，其他的都是浮云的，即使一直错都在他。国王就是！ 王子之吻，当初未醒，女王忏悔后一吻，居然醒了。我说是王子的吻是True Love，可能也是和上面一样被人嗤之以鼻。只是，那个诅咒和其厉害，本来都毁坏的，而且深藏的织布机都自动浮现，女主也丢了意识，只是去履行诅咒、、那个沉睡需要多么的深入，怎么能说醒就醒？而且公主在去王城之前刚为女主诅咒她而愤然的，当然是听到女主的忏悔而尽释前嫌，女主一吻也把它从朦胧状态拉回现实而已。 后言： 笔者是相信爱情的，可能你以为我这些和剧情其实一点都不配套的，我也不反对的。每个人有每个人的看法，一千个读者一千个哈姆雷特的、、我承认你的是对的，但是我也不会承认我是错的的、、 Ps：一个糊涂的愚昧着的喃喃自语而已、、 Author 渡世白玉Posted on 2014年6月22日2015年8月21日Categories 文字飘香, 随笔Tags 爱情, 真爱"
