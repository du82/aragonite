title = "Linus Torvalds 的十条佳句 | 渡世白玉"
description = "在正在举行的 LinuxCon Europe 期间，来自 Intel 的 Dirk Hohndel 对 Linus Torvalds 进行了采访，Linus 对提问进行了回答，其中部分读来颇为有趣。 Linus 对于当下三个月的发布周期感到满意，这个时间段既可以给开发者充足的时间进行功能开发，若是不幸错过也不必等太久。"
full_description = "Linus Torvalds 的十条佳句 在正在举行的 LinuxCon Europe 期间，来自 Intel 的 Dirk Hohndel 对 Linus Torvalds 进行了采访，Linus 对提问进行了回答，其中部分读来颇为有趣。 Linus 对于当下三个月的发布周期感到满意，这个时间段既可以给开发者充足的时间进行功能开发，若是不幸错过也不必等太久。 “Don’t hurry your code. Make sure it works well and is well designed. Don’t worry about timing.” “不要赶代码。确保工作正常且设计合理。别太担心时间。” 这种快节奏的变化也允许开发者很快的完成代码合并并着手下一项工作。 “Developers have the attention spans of slightly moronic woodland creatures.” “开发者的注意力跟森林里略显愚钝的小动物们差不多。” 年轻的开发者很难成为维护者，因为需要一段相当长的时间来使得取得社区的信任并证明你的确会在此停留。另一方面，一旦取得了社区的信任，成为维护者也很简单：这是一项艰巨的任务，必须保持时刻关注。 “One of the most important things for a maintainer isn’t that he’s a super engineer. It’s that you’re responsive and people can rely on you being there 24/7, 52 weeks a year.” “对于一个维护者来说最重要的不是他技术超牛，而是具有责任心，从而使人们可以放心的认为你会全年 52 周每周 7 天每天 24 小时的坚守岗位。” Linus 通常不会因为 Bug 或者技术问题而熬夜。 “The thing with technology is if you do something stupid you can fix it.” “技术上的事情，哪怕你做了蠢事，你也可以修复它。” 真正让 Linus 熬夜的是社区沟通和以及开发流程相关的事情。 “When tempers flare it can be really stressful for a few days. I have flare-ups and that works fine for me… Other people tend to mull over things. It eats at them for weeks on end, and those issues tend to be the painful ones.” “有时候火气上来了可能会导致好几天都觉得有压力。我有时会发火，至少个人感觉不错。其他人则倾向于仔细思考。最后这些问题可能会困扰他们数周，而这通常都是些令人头疼的问题。” Linus 对于劝说公司贡献内核代码或者使用开源软件持有一种进化论似的观点。它们不是看到了开源的好处，就是在经济上遇到了问题。 “I do open source because it’s fun and it works… Companies who work with the kernel community will waste less time and they’ll just work better.” “我从事开源是因为它有趣且可行。和内核社区合作的公司将浪费更少的时间并取得更佳的结果。” “If you’re a company that thinks your tiny change to the kernel is what gives you a competitive edge, you’ll probably be facing economic problems. You’d be much better off worrying about making the best damn hardware for the lowest price.” “如果你的公司认为对内核的微小改善可以带来具有竞争力的优势，你的公司恐怕正在面临经济问题。你最好去想想怎么样以最低的价格提供最好的硬件。” Linus 对于当前桌面 Linux 的发展有句话要说： “I started Linux because I wanted to see it on the desktop… I wish people would work together better … and make a really nice login screen.” “我开始设计 Linux 的时候就是想看到他能运行在桌面上。我希望人们能更好的合作，及设计一个真正好看的登录界面。” 他认为 Valve 的 Steam for Linux 对于桌面 Linux 来说是个绝佳的机会，可以为 Linux 发行版构建有利于推广的游戏平台标准。 “It’s the best model for standardization. Standards should not be people sitting in a smoky room… and writing papers. It’s being successful enough to drive the market.” “这是标准化的最好模式。标准不应该是人们坐在烟雾缭绕的房间里写草案。它应该是足够成功从而能推动市场。” 在多元化方面，Linus 希望内核社区能有更多女性的参与，也希望看到能有来自更多地区的贡献者。 “We have very few women. But I’m not very worried. We used to have this discussion about not having enough Japanese developers. We can solve this but it will take time.” “我们只有很少的女性开发者。但是我并不太担心这个。我们曾经开会讨论过日本开发者偏少的问题。我们有信心解决这些问题不过这需要时间。” 消息原文：Linux.com/LinuxToy Author 渡世白玉Posted on 2013年10月25日2015年8月21日Categories 其它Tags Linus Torvalds, linux, 代码, 佳句, 设计"
