description = "① 侠义江湖 501、说到《水浒传》，最难评价的是宋江。因为，他是一个非常矛盾的人：你说他真心待人，他却又时时显示虚伪做作；你说他义薄云天，他却又心机重重城府极深；你说他处心积虑谋反，他却又对朝廷肝脑涂地；你说他为人仁厚，他却又时时做下凶残之事…… 502、人为什么要说假话呢？因为说假话有用。 503、这就是宋江的心机了。这样的心机，鲁智深、李逵、武松没有，连林冲也不会。鲁智深、李逵、武松没有，是因为他们心太直。林冲不会，是因为心太正。心太直就没有了算计。心太正就有了顾忌，就会有所不为。草莽式的率直和贵族式的正直，都做不出这样的举动。所以，在中国历史上，草莽英雄成不了大事，贵族做派的人也成不了事。成得了事的，常常就是刘邦、朱元璋这样的无所顾忌、无所不为而有心机的人。宋江离他们不远了。 504、宋江这样对待一个如此信任他的人，算不算过分？一个如此心机重重的人，玩弄一个如此老实的人，我们读者读到这里，有没有为何涛抱一回不平呢？ 505、林冲总是被别人牵着走，一步一步走向深渊。武松是被自己骄傲的内心牵着走，直到走到景阳冈上，差点被老虎吃了。李逵是被自己躁动的本能牵着走，一举一动，看似全由自己做主，实际上，用弗洛伊德心理学的观点来看，他是毫不自觉，完全被潜意识里的欲望带着走，糊里糊涂走了一辈子。宋江呢？他牵着别人走。本来，他只是郓城县的一个小吏，他要接受县令的支配。何涛是上级衙门来的，他也要接受何涛的支派。但是，我们看到的，却是完全相反的情形：他暗中控制了局面，把这两个人掌控在自己的手心里，牵着他们，按照他指定的路径走。 506、义气是这样的一种东西：义气永远不可能对其做单纯的评价。当甲对乙讲义气时，往往会牵涉到他人，比如牵涉到了丙，甚至损害了丙，我们如何评价这样的义气？当我们不问是非，为朋友两肋插刀、大打出手时，我们如何面对来自对方的评价？ 507、你是贼，我是警察，警察抓贼，是职责所在。你既选择做贼，你可以怕警察，但你不能恨警察，不能视警察为仇人。 508、以小人之心度君子之腹，委屈的是别人。以君子之心度小人之腹，伤害的是自己。 509、江湖义气的致命问题，即在于不问是非，只问兄弟。所以，这样的江湖义气，与孔子、孟子所说的人生大义，是有极大的区别的。孔孟的“义”，乃是“正义”，关键在于一个“正”字。而江湖义气，顾名思义，致命处在于一个“气”字。气，就有正气和邪气的区别了。只问兄弟，不问是非，结果往往就是沆瀣一气。沆瀣一气了，当然是“邪气”。于是，江湖侠义，往往变为江湖“狭义”——很狭隘的，对局外人极其不公的“义气”。 510、宋江办的这件事，从不同的角度，我们会得到不同的评价。从晁盖的立场上看，那真是义薄云天。但是，换一个角度，情况就大不相同。私放晁盖，藐视国法，蒙蔽上官，不忠；欺骗何涛，致人残废，不义。 ② 人为财死 511、像小张三这样专讨女人好的小白脸，却定是男人的败类、女人的灾星。男人有两种：大男人和小男人。大男人盯着五光十色的世界，小男人盯着花花绿绿的女人。不好女色的未必是大男人，但专爱在女人堆里混的，专好女色的，一定是小男人。 512、能忍人所不能忍，不是扶不起的懦夫，就是打不败的英雄。 513、读小说，要善于分清哪些是作者的问题，哪些是人物的问题。作者的问题越少，人物的问题越多，小说越好。 514、这一对母女，一个要爱情，一个要钱包；一个浪漫，一个实在。 515、生姜是老的辣，眼光也是老的辣。 516、钱的用处，就在于叫人欢喜。什么叫用处？就是所用之处。钱只有去了所用之处，才有用处。懂得用钱来叫人欢喜了，就懂得用钱了。善于用钱来让人欢喜的，就是善于用钱了。常常拿钱来让人欢喜，就到了用钱的最高境界了。但是，世界上的很多人，却总是在钱上叫人不欢喜。能否挣钱，显示的是能力。会否花钱，体现的是境界。 517、宋江就是天下善使银子者，他的绰号，所谓的“及时雨”，就是“及时银子”。——我的话里，有讽刺，却也有肯定。善使银子，必能使人。 518、我们看看宋江对银子的态度：第一，不贪。第二，不吝。把得出银子，方做得出大事。生活中，多少人在蝇头小利上用心思，一分一毫，务求为我所有。为此一分一毫，输掉一生一世。 519、知道自己要什么，是聪明。但是，知道自己什么不该要，才是智慧。知道自己怎么要，是聪明。但是，知道自己不该怎么要，才是智慧。智慧与聪明的最大区别在于：智慧是一种境界，包含着德性。阎婆惜足够聪明，却没有智慧，因为她欠缺德性。这样的缺少境界和德性的聪明，在给人局部和暂时的成功的同时，却也给人最终的失败：聪明反被聪明误。我们见过笨人、愚拙的人成大事。我们没见过耍小聪明的人成大事。 520、我们相信宋江，是因为我们知道事情的真相。阎婆惜不相信，是因为她知道官场真相。宋江被委屈了。但是，宋江冤，也不冤。因为，宋江身处的官场，却是像阎婆惜所说，没有什么干净的公人。宋江平时是否也贪婪？这是个说不清的问题。有人就说宋江一定贪婪，不然，凭着他那一点收入，以及他家中的几口薄田，他哪有那么多的银子去资助江湖上、市井中的各色人等呢？即使宋江不会主动索贿，但是，官场潜规则、惯例等等，也会给他带来滚滚财源。但是，也正是这些，在给官场上的公人带来滚滚财源的同时，也带来了负面的社会形象和社会评价。所以，我们说，阎婆惜这样挤兑宋江，宋江冤，也不冤。谁让你持身不谨，混迹于肮脏的官场呢？ 521、以小人之心度一两个君子之腹，还不算太糟糕。糟糕的是以小人之心度天下人之腹。这样的人不是不再相信人，而是根本就不再相信道德。哀莫大于心死，这样的人，心死了。这样的人多了，社会就死了。小人总是无法理解君子。君子如果做小人，做小人之事，小人能理解；君子做君子，行君子之事，小人反而不能理解。岂但不能理解，反而要妄加曲解，曲解得君子比小人还小人。更糟糕的是，君子的优点，常常被小人当成弱点，甚至当成欺负君子的切入点。 522、威胁威胁，就是用威势来胁迫，逼对方就范。它带给人双重的伤害和侮辱：一、它胁迫人就范，违背了人的意志；二、它还严重伤害了人的自尊心，带给人深深地耻辱感、屈辱感。所以，威胁他人，是下流人使用的下流手段。一般有自尊心的人，绝忍受不了别人的威胁。 ③ 谁识法度 523、一桩人命大案，就这样摆平了。是什么东西帮宋江摆平的呢？两个东西：第一，银子；第二，人情。这个案子从头至尾，我们来看看，没有一个遵纪守法的。 524、不会做人情是不好的。会做人情才是做人的基本准则。而不是恪尽职守。 525、从晁保正，到宋押司，到朱都头，这些地方上到县级的治安人员，都玩忽职守，官匪勾结、警匪勾结。更糟糕的是，他们这样做，并不觉得自己是错的，反而觉得自己够哥们，够义气，是好汉。如果从梁山事业上来看，没有宋江，没有朱仝，就没有晁盖等人上梁山，没有晁盖等人上梁山，就不会有后来梁山的事业。所以，站在梁山的立场上，我们也可以说，宋江确实是梁山的始作俑者，是梁山事业的开创者。梁山事业从此蒸蒸日上，红红火火，这是谁之功？答案是：宋江，朱仝。换一个角度，梁山从此成为国家的心腹大患，这是谁之罪？答案也是：宋江，朱仝。 526、试问，堂堂大宋，谁还在信任法律，谁还在遵守法律，谁还在依法办事？这个国家怎么了？这个朝廷怎么了？为什么总是轻易地就让人放弃了对他的忠诚？事实上，当朝廷被蔡京、高俅一伙把持的时候，朝廷就在天下人面前失去了道德的高度。一个没有了道德高度的朝廷，无法维持人们对它的基本忠诚。而当人们因为蔡京、高俅而迁怒于朝廷的时候，国家的权威就承受了巨大的损害。而国家权威的丧失，人们对法律权威的漠视，又反过来损害了所有国民的利益。这是一个怪圈。这很糟。但还有更糟的，因为这种情况不仅仅一个宋朝。整个封建社会都是如此。《水浒传》反映的，是古代中国的普遍情形。但这还不是最糟的，还有更糟的，那就是，不守法度的不仅仅是我们上面列举到的小说中的种种人。《水浒传》作者也是这样的观念。他对这些不守法度的人和不守法度的现象，不是批判，而是赞赏！也就是说，我们的文学，也失去了基本的判断力！但这还不是最糟的，还有更糟的。不仅《水浒传》作者是这样，《水浒传》读者也是这样！从古至今的广大的《水浒传》读者，对这些不守法度的人和不守法度的现象，不是否定，而是赞赏！在这个问题上，几乎是，没有最糟，只有更糟！ 527、中国是世界上最早的具有比较完备的刑法和民法的国家。但是，我们从《水浒传》及其衍生的种种文化现象中悲哀地发现，如此漫长的法制历史，却没有培养出国民对于法律的基本信仰。为什么？因为权力。在中国古代，权力才是中国封建社会真正的操控者。是权力决定百姓的生死，决定官员的升迁，决定官司的输赢。而不是规则，不是法律。于是，大家一致崇拜权力，服从权力，依照潜规则办事！ 528、法律是可以规避的，就看你是否付得起为了逃避法律而付出的各类成本。比如用来打点和行贿的钱财，人际关系成本等等。在这样的情形之下，就会出现两个问题：一、你付得起这个代价，你就无须在乎法律。这就是为什么，在这样的社会里，总有人无法无天，因为他们有权、有势、有关系、有钱。二、法律成为法门。什么法门？相关人员敛财的方便法门。既有人拿钱买法，相关人员就可以卖法。这就是为什么，在这样的社会里，总有人以权谋私，权力寻租。结果是，一件案子，涉及的三方——受害者、加害者、执法者，变成了这样的三方——受害者、付钱者、收钱者。我们发现，法律没有了。法律哪里去了？帮收钱的执法者数钱去了。受害者怨沉大海。加害者付了钱逍遥法外。执法者收了钱中饱私囊。 ④ 行走江湖 529、柴进两次笑，笑什么？笑王法！笑朝廷！按说人家杀了忍，人命在身，逃在江湖，总该有些沉重。但柴进没事似的，十分轻松。我们在上一讲里讲到了那么多的目无王法之人，这儿又出来一个！而且如果说前面那些人都是无法，这一个简直就是无天！他如此胆大，简直不把朝廷放在眼里！柴进的这番话，赤裸裸地表达了他对朝廷的蔑视，对王法的嘲弄。 530、其实，接济接济他人，不难，难就难在终日追陪，并无厌倦这八个字。俗话说，一顿饭是朋友，十顿饭是仇人。为什么？因为，吃到十顿饭了，朋友还赖着，你就没有耐心了，你没有耐心了，哪怕你不赶他走，他也能感觉到你的态度“很不够朋友”了，于是，他会带着对你的失望而离开，从此以后，你们的友谊也终结了。 531、实际上，当你对别人足够好，而对方心安理得地长时间地接受你的好时，你只有一种结果：不是天使，就是魔鬼。你是天使还是魔鬼，就看你有没有足够的耐心：他一直呆下去，你一直终日追陪，并无厌倦，你就是天使；你厌倦的那一天，你就成了魔鬼。可是，你也只是个人，要做天使，要一直做天使，何等难！但是，你已经没有了做一般人的机会，哪怕你比一般人做得好得多，但是，只要你一日厌倦，你便是人们眼中的魔鬼！ 532、俗眼只能看相貌，慧眼才能穿越相貌看到那种隐含的英雄气象。慧眼、慧眼，慧不在眼，在心胸。 533、宋江对江湖英雄，有一种天然的笼络的欲望。这是领袖人物的最重要的素质。这世界上，有人爱人，有人爱财。爱财的人，常常卖人以求财。爱人的人，常常散财以笼人。 534、一个人能走多远，要看他能摆脱多少诱惑。要看看还有多少东西能够诱惑他。 535、一个人，无论是要做大人，还是要做大事，都先要有一颗小心。这个小心，就是谦卑心，恭敬心，敬畏心，责任心，细心，爱心，诚心。按说，宋江较之武松，岁数比他大，江湖名声比他大，他完全可以在武松面前充大。但他不，他是伏小。 536、宋江对人，一个最大优点，就是用心。你说他工于心计也好，你说他有心机有城府也好，你怎么评价是一回事，事实上他确实是用心了。有了这个用心，他才能买到武松的心。 537、也怪，人和人在一起，往往不用多少时间，马上就自然形成了主导与被主导、支配与被支配的关系。决定这种主导者身份的，有时是原先的社会地位，有时是名望，有时是教养，有时是年龄，有时候，就是一种气质。 538、宋江有名望。宋江有教养，有文化。宋江有年龄优势。宋江能宽容。宋江能小心。更重要的是，宋江有一种领袖的气质，一种领袖心态。我们现在说智商、情商、财商等等，还有一种人，天然具有领袖商。宋江就是具有领袖商的人。 ⑤ 枭雄本色 539、《西游记》写的是妖怪，《水浒传》写的是人类。其实，《西游记》中的妖怪，就是人类；《水浒传》中的人类，往往也就是妖怪。 540、鲁智深只要讲一个“理”字，所以，正大光明。宋江则还要讲一个“情”字，所以，人情练达。鲁达可以成仁，可以成圣，可以成佛，可以成仙。宋江则可以成功，可以成名，可以成霸业。一句话，鲁达可以成人，宋江可以成事。 541、所谓的江湖义气，追寻到最后，往往恰恰是极端自我中心，极端自私！ 542、一个人，没头脑，还可以原谅；没心肝，简直是畜生。 ⑥ 江湖串联 543、从中国的传统文化观念上讲，“孝”、“义”有不同的价值取向，有时甚至是互相冲突的。孝直接延伸到忠。一个在家庭里懂得孝悌的人，不可能犯上作乱。所以，我们古话常常说“求忠臣必于孝子之门”。一般人，只要想到孝，必然想到忠。孝心萌动之时，忠心也就占了上风。那么，义呢？义往往延伸到侠。而侠却往往会导致对国家法度的触犯。忠也好，孝也好，是垂直上下的关系。是天命，是无可逃于天地之间，是不容怀疑与推脱的，甚至极端到不管是什么样的父母，你都得孝；不管是什么样的君主，你都得忠。所以，忠、孝需要的是无条件服从，而无须思考和判断。但是，义却不然，义很多时候是横向的平等关系。义者宜也。是否适宜，就要判断，判断以后，才能决定是否施行。所以，义的核心，恰恰是判断。孔子说，见得思义，义是要思考的。忠、孝和侠、义往往使人成为气质不同的人。忠、孝可以让人变成温顺的良民。而侠、义却常常使人成为豪杰。因为“忠、孝”是服从他者，而侠、义却是显示自我。"
full_description = "鲍鹏山新说《水浒》经典语录精选之宋江 ① 侠义江湖 501、说到《水浒传》，最难评价的是宋江。因为，他是一个非常矛盾的人：你说他真心待人，他却又时时显示虚伪做作；你说他义薄云天，他却又心机重重城府极深；你说他处心积虑谋反，他却又对朝廷肝脑涂地；你说他为人仁厚，他却又时时做下凶残之事…… 502、人为什么要说假话呢？因为说假话有用。 503、这就是宋江的心机了。这样的心机，鲁智深、李逵、武松没有，连林冲也不会。鲁智深、李逵、武松没有，是因为他们心太直。林冲不会，是因为心太正。心太直就没有了算计。心太正就有了顾忌，就会有所不为。草莽式的率直和贵族式的正直，都做不出这样的举动。所以，在中国历史上，草莽英雄成不了大事，贵族做派的人也成不了事。成得了事的，常常就是刘邦、朱元璋这样的无所顾忌、无所不为而有心机的人。宋江离他们不远了。 504、宋江这样对待一个如此信任他的人，算不算过分？一个如此心机重重的人，玩弄一个如此老实的人，我们读者读到这里，有没有为何涛抱一回不平呢？ 505、林冲总是被别人牵着走，一步一步走向深渊。武松是被自己骄傲的内心牵着走，直到走到景阳冈上，差点被老虎吃了。李逵是被自己躁动的本能牵着走，一举一动，看似全由自己做主，实际上，用弗洛伊德心理学的观点来看，他是毫不自觉，完全被潜意识里的欲望带着走，糊里糊涂走了一辈子。宋江呢？他牵着别人走。本来，他只是郓城县的一个小吏，他要接受县令的支配。何涛是上级衙门来的，他也要接受何涛的支派。但是，我们看到的，却是完全相反的情形：他暗中控制了局面，把这两个人掌控在自己的手心里，牵着他们，按照他指定的路径走。 506、义气是这样的一种东西：义气永远不可能对其做单纯的评价。当甲对乙讲义气时，往往会牵涉到他人，比如牵涉到了丙，甚至损害了丙，我们如何评价这样的义气？当我们不问是非，为朋友两肋插刀、大打出手时，我们如何面对来自对方的评价？ 507、你是贼，我是警察，警察抓贼，是职责所在。你既选择做贼，你可以怕警察，但你不能恨警察，不能视警察为仇人。 508、以小人之心度君子之腹，委屈的是别人。以君子之心度小人之腹，伤害的是自己。 509、江湖义气的致命问题，即在于不问是非，只问兄弟。所以，这样的江湖义气，与孔子、孟子所说的人生大义，是有极大的区别的。孔孟的“义”，乃是“正义”，关键在于一个“正”字。而江湖义气，顾名思义，致命处在于一个“气”字。气，就有正气和邪气的区别了。只问兄弟，不问是非，结果往往就是沆瀣一气。沆瀣一气了，当然是“邪气”。于是，江湖侠义，往往变为江湖“狭义”——很狭隘的，对局外人极其不公的“义气”。 510、宋江办的这件事，从不同的角度，我们会得到不同的评价。从晁盖的立场上看，那真是义薄云天。但是，换一个角度，情况就大不相同。私放晁盖，藐视国法，蒙蔽上官，不忠；欺骗何涛，致人残废，不义。 ② 人为财死 511、像小张三这样专讨女人好的小白脸，却定是男人的败类、女人的灾星。男人有两种：大男人和小男人。大男人盯着五光十色的世界，小男人盯着花花绿绿的女人。不好女色的未必是大男人，但专爱在女人堆里混的，专好女色的，一定是小男人。 512、能忍人所不能忍，不是扶不起的懦夫，就是打不败的英雄。 513、读小说，要善于分清哪些是作者的问题，哪些是人物的问题。作者的问题越少，人物的问题越多，小说越好。 514、这一对母女，一个要爱情，一个要钱包；一个浪漫，一个实在。 515、生姜是老的辣，眼光也是老的辣。 516、钱的用处，就在于叫人欢喜。什么叫用处？就是所用之处。钱只有去了所用之处，才有用处。懂得用钱来叫人欢喜了，就懂得用钱了。善于用钱来让人欢喜的，就是善于用钱了。常常拿钱来让人欢喜，就到了用钱的最高境界了。但是，世界上的很多人，却总是在钱上叫人不欢喜。能否挣钱，显示的是能力。会否花钱，体现的是境界。 517、宋江就是天下善使银子者，他的绰号，所谓的“及时雨”，就是“及时银子”。——我的话里，有讽刺，却也有肯定。善使银子，必能使人。 518、我们看看宋江对银子的态度：第一，不贪。第二，不吝。把得出银子，方做得出大事。生活中，多少人在蝇头小利上用心思，一分一毫，务求为我所有。为此一分一毫，输掉一生一世。 519、知道自己要什么，是聪明。但是，知道自己什么不该要，才是智慧。知道自己怎么要，是聪明。但是，知道自己不该怎么要，才是智慧。智慧与聪明的最大区别在于：智慧是一种境界，包含着德性。阎婆惜足够聪明，却没有智慧，因为她欠缺德性。这样的缺少境界和德性的聪明，在给人局部和暂时的成功的同时，却也给人最终的失败：聪明反被聪明误。我们见过笨人、愚拙的人成大事。我们没见过耍小聪明的人成大事。 520、我们相信宋江，是因为我们知道事情的真相。阎婆惜不相信，是因为她知道官场真相。宋江被委屈了。但是，宋江冤，也不冤。因为，宋江身处的官场，却是像阎婆惜所说，没有什么干净的公人。宋江平时是否也贪婪？这是个说不清的问题。有人就说宋江一定贪婪，不然，凭着他那一点收入，以及他家中的几口薄田，他哪有那么多的银子去资助江湖上、市井中的各色人等呢？即使宋江不会主动索贿，但是，官场潜规则、惯例等等，也会给他带来滚滚财源。但是，也正是这些，在给官场上的公人带来滚滚财源的同时，也带来了负面的社会形象和社会评价。所以，我们说，阎婆惜这样挤兑宋江，宋江冤，也不冤。谁让你持身不谨，混迹于肮脏的官场呢？ 521、以小人之心度一两个君子之腹，还不算太糟糕。糟糕的是以小人之心度天下人之腹。这样的人不是不再相信人，而是根本就不再相信道德。哀莫大于心死，这样的人，心死了。这样的人多了，社会就死了。小人总是无法理解君子。君子如果做小人，做小人之事，小人能理解；君子做君子，行君子之事，小人反而不能理解。岂但不能理解，反而要妄加曲解，曲解得君子比小人还小人。更糟糕的是，君子的优点，常常被小人当成弱点，甚至当成欺负君子的切入点。 522、威胁威胁，就是用威势来胁迫，逼对方就范。它带给人双重的伤害和侮辱：一、它胁迫人就范，违背了人的意志；二、它还严重伤害了人的自尊心，带给人深深地耻辱感、屈辱感。所以，威胁他人，是下流人使用的下流手段。一般有自尊心的人，绝忍受不了别人的威胁。 ③ 谁识法度 523、一桩人命大案，就这样摆平了。是什么东西帮宋江摆平的呢？两个东西：第一，银子；第二，人情。这个案子从头至尾，我们来看看，没有一个遵纪守法的。 524、不会做人情是不好的。会做人情才是做人的基本准则。而不是恪尽职守。 525、从晁保正，到宋押司，到朱都头，这些地方上到县级的治安人员，都玩忽职守，官匪勾结、警匪勾结。更糟糕的是，他们这样做，并不觉得自己是错的，反而觉得自己够哥们，够义气，是好汉。如果从梁山事业上来看，没有宋江，没有朱仝，就没有晁盖等人上梁山，没有晁盖等人上梁山，就不会有后来梁山的事业。所以，站在梁山的立场上，我们也可以说，宋江确实是梁山的始作俑者，是梁山事业的开创者。梁山事业从此蒸蒸日上，红红火火，这是谁之功？答案是：宋江，朱仝。换一个角度，梁山从此成为国家的心腹大患，这是谁之罪？答案也是：宋江，朱仝。 526、试问，堂堂大宋，谁还在信任法律，谁还在遵守法律，谁还在依法办事？这个国家怎么了？这个朝廷怎么了？为什么总是轻易地就让人放弃了对他的忠诚？事实上，当朝廷被蔡京、高俅一伙把持的时候，朝廷就在天下人面前失去了道德的高度。一个没有了道德高度的朝廷，无法维持人们对它的基本忠诚。而当人们因为蔡京、高俅而迁怒于朝廷的时候，国家的权威就承受了巨大的损害。而国家权威的丧失，人们对法律权威的漠视，又反过来损害了所有国民的利益。这是一个怪圈。这很糟。但还有更糟的，因为这种情况不仅仅一个宋朝。整个封建社会都是如此。《水浒传》反映的，是古代中国的普遍情形。但这还不是最糟的，还有更糟的，那就是，不守法度的不仅仅是我们上面列举到的小说中的种种人。《水浒传》作者也是这样的观念。他对这些不守法度的人和不守法度的现象，不是批判，而是赞赏！也就是说，我们的文学，也失去了基本的判断力！但这还不是最糟的，还有更糟的。不仅《水浒传》作者是这样，《水浒传》读者也是这样！从古至今的广大的《水浒传》读者，对这些不守法度的人和不守法度的现象，不是否定，而是赞赏！在这个问题上，几乎是，没有最糟，只有更糟！ 527、中国是世界上最早的具有比较完备的刑法和民法的国家。但是，我们从《水浒传》及其衍生的种种文化现象中悲哀地发现，如此漫长的法制历史，却没有培养出国民对于法律的基本信仰。为什么？因为权力。在中国古代，权力才是中国封建社会真正的操控者。是权力决定百姓的生死，决定官员的升迁，决定官司的输赢。而不是规则，不是法律。于是，大家一致崇拜权力，服从权力，依照潜规则办事！ 528、法律是可以规避的，就看你是否付得起为了逃避法律而付出的各类成本。比如用来打点和行贿的钱财，人际关系成本等等。在这样的情形之下，就会出现两个问题：一、你付得起这个代价，你就无须在乎法律。这就是为什么，在这样的社会里，总有人无法无天，因为他们有权、有势、有关系、有钱。二、法律成为法门。什么法门？相关人员敛财的方便法门。既有人拿钱买法，相关人员就可以卖法。这就是为什么，在这样的社会里，总有人以权谋私，权力寻租。结果是，一件案子，涉及的三方——受害者、加害者、执法者，变成了这样的三方——受害者、付钱者、收钱者。我们发现，法律没有了。法律哪里去了？帮收钱的执法者数钱去了。受害者怨沉大海。加害者付了钱逍遥法外。执法者收了钱中饱私囊。 ④ 行走江湖 529、柴进两次笑，笑什么？笑王法！笑朝廷！按说人家杀了忍，人命在身，逃在江湖，总该有些沉重。但柴进没事似的，十分轻松。我们在上一讲里讲到了那么多的目无王法之人，这儿又出来一个！而且如果说前面那些人都是无法，这一个简直就是无天！他如此胆大，简直不把朝廷放在眼里！柴进的这番话，赤裸裸地表达了他对朝廷的蔑视，对王法的嘲弄。 530、其实，接济接济他人，不难，难就难在终日追陪，并无厌倦这八个字。俗话说，一顿饭是朋友，十顿饭是仇人。为什么？因为，吃到十顿饭了，朋友还赖着，你就没有耐心了，你没有耐心了，哪怕你不赶他走，他也能感觉到你的态度“很不够朋友”了，于是，他会带着对你的失望而离开，从此以后，你们的友谊也终结了。 531、实际上，当你对别人足够好，而对方心安理得地长时间地接受你的好时，你只有一种结果：不是天使，就是魔鬼。你是天使还是魔鬼，就看你有没有足够的耐心：他一直呆下去，你一直终日追陪，并无厌倦，你就是天使；你厌倦的那一天，你就成了魔鬼。可是，你也只是个人，要做天使，要一直做天使，何等难！但是，你已经没有了做一般人的机会，哪怕你比一般人做得好得多，但是，只要你一日厌倦，你便是人们眼中的魔鬼！ 532、俗眼只能看相貌，慧眼才能穿越相貌看到那种隐含的英雄气象。慧眼、慧眼，慧不在眼，在心胸。 533、宋江对江湖英雄，有一种天然的笼络的欲望。这是领袖人物的最重要的素质。这世界上，有人爱人，有人爱财。爱财的人，常常卖人以求财。爱人的人，常常散财以笼人。 534、一个人能走多远，要看他能摆脱多少诱惑。要看看还有多少东西能够诱惑他。 535、一个人，无论是要做大人，还是要做大事，都先要有一颗小心。这个小心，就是谦卑心，恭敬心，敬畏心，责任心，细心，爱心，诚心。按说，宋江较之武松，岁数比他大，江湖名声比他大，他完全可以在武松面前充大。但他不，他是伏小。 536、宋江对人，一个最大优点，就是用心。你说他工于心计也好，你说他有心机有城府也好，你怎么评价是一回事，事实上他确实是用心了。有了这个用心，他才能买到武松的心。 537、也怪，人和人在一起，往往不用多少时间，马上就自然形成了主导与被主导、支配与被支配的关系。决定这种主导者身份的，有时是原先的社会地位，有时是名望，有时是教养，有时是年龄，有时候，就是一种气质。 538、宋江有名望。宋江有教养，有文化。宋江有年龄优势。宋江能宽容。宋江能小心。更重要的是，宋江有一种领袖的气质，一种领袖心态。我们现在说智商、情商、财商等等，还有一种人，天然具有领袖商。宋江就是具有领袖商的人。 ⑤ 枭雄本色 539、《西游记》写的是妖怪，《水浒传》写的是人类。其实，《西游记》中的妖怪，就是人类；《水浒传》中的人类，往往也就是妖怪。 540、鲁智深只要讲一个“理”字，所以，正大光明。宋江则还要讲一个“情”字，所以，人情练达。鲁达可以成仁，可以成圣，可以成佛，可以成仙。宋江则可以成功，可以成名，可以成霸业。一句话，鲁达可以成人，宋江可以成事。 541、所谓的江湖义气，追寻到最后，往往恰恰是极端自我中心，极端自私！ 542、一个人，没头脑，还可以原谅；没心肝，简直是畜生。 ⑥ 江湖串联 543、从中国的传统文化观念上讲，“孝”、“义”有不同的价值取向，有时甚至是互相冲突的。孝直接延伸到忠。一个在家庭里懂得孝悌的人，不可能犯上作乱。所以，我们古话常常说“求忠臣必于孝子之门”。一般人，只要想到孝，必然想到忠。孝心萌动之时，忠心也就占了上风。那么，义呢？义往往延伸到侠。而侠却往往会导致对国家法度的触犯。忠也好，孝也好，是垂直上下的关系。是天命，是无可逃于天地之间，是不容怀疑与推脱的，甚至极端到不管是什么样的父母，你都得孝；不管是什么样的君主，你都得忠。所以，忠、孝需要的是无条件服从，而无须思考和判断。但是，义却不然，义很多时候是横向的平等关系。义者宜也。是否适宜，就要判断，判断以后，才能决定是否施行。所以，义的核心，恰恰是判断。孔子说，见得思义，义是要思考的。忠、孝和侠、义往往使人成为气质不同的人。忠、孝可以让人变成温顺的良民。而侠、义却常常使人成为豪杰。因为“忠、孝”是服从他者，而侠、义却是显示自我。 544、“见义勇为”这个词，就说明，“义”可以让人勇于作为。所以，胸中有义气在的人，往往有着强烈的自我肯定、自我欣赏，往往有着强烈的自我实现的欲望。 545、人们一再强调的，往往就是人们最为担心的；人们最为担心的，往往就是最有可能出现的。 546、是的，宋江确实虚伪。但问题是，“虚伪”一词，本来没有什么贬义，它指做出某种姿态。 547、有一些糊涂大意，是因为善良，总把别人想得和自己一样真诚。有一些精明小心，是因为阴暗，总把别人想得和自己一样险恶。 548、我们知道，梁山好汉不少人都经历过流放。林冲的流放之途是受难，武松的流放之途像旅游。宋江呢？宋江的流放之途是大串联。宋江就像一个雪球，在他滚过的地方，都会有更多的雪粘附到他身上。以至于他越滚越大，大成了气候，大成了真正的江湖老大。 549、就是这样一个毫无人性的家伙，宋江还向李俊问道：“这位好汉是谁？”竟然还说他是好汉！这就是《水浒》中的好汉！这就是宋江眼里的好汉！这就是被宋江笼络，在宋江手下，帮他打天下的好汉！ ⑦ 潜伏爪牙 550、他们哪有什么是非，只看你是否兄弟。 551、有人缺德，有人缺心眼。他呢，又缺德又缺心眼，却又能到江州做知府，这也很正常，官场上这类人最多，《水浒》中出现的各级官员，几个不是这样的？何况他还是蔡京的儿子。江州是个钱粮浩大的去处，人广物盈，是个肥缺。肥水不流外人田，这样的好地方，当然是给自家的儿子。可是，这就苦了当地的百姓了。 552、牢城营里，是有潜规则的，这个潜规则的核心，就是银子。林冲道牢城营，经人指点，马上准备送银子；武松到牢城营，经人指点，马上表示不送银子。宋江呢？宋江根本不需要他人指点。他是吏员出身啊，什么潜规则他不懂？这种事不知别人对他干过多少。实际上，在官场混，谁不是受贿和行贿的专业户？ 553、武松是经人指点仍不开窍，林冲是一经指点就开窍，宋江是不用指点窍早就开了。武松是英雄汉，林冲是老实人，宋江是心机深。三人的境界由此可知，三人的生活经历也在此中。既然宋江如此懂事，一百杀威棒自然就免打了。 554、现在，总有人动不动就羡慕、鼓吹什么康乾盛世，他们为什么就不看看小民在那时代如何被人蹂躏？我根本就不相信在中国封建时代，还有什么时代是小民的盛世。说是康乾盛世也对，是康熙皇帝、乾隆皇帝的盛世，不是小民的盛世。小民在那样的时代，只不过是权势者手里的“行货”罢了。 555、实际上，有两个戴宗：兄弟戴宗和节级戴宗。兄弟戴宗确实仗义疏财，而节级戴宗确实丑陋无耻。所以，一个人，是好人还是坏人，往往看他在什么环境里，处于什么关系中。 556、有形资本是有数的，而名声、威望等等无形资产是无限的。 557、中国有一句古话，叫“白纸黑字”，这就是做文人的不好。如果不会写字，像李逵，哪怕整天想着造反，也不会留下证据。心里想的，没人知道，嘴上说的，一风吹了。可是，假如你会写字，一不小心写下来了，那就是铁证如山。当然，文人倒霉，往往恰是文人造成的。白纸黑字，文人写；白纸黑字，也得要文人读。而且，还要读得懂，会解释。 558、有人有文化，却无权谋。有人满腹权谋，却无文化。宋江二者都有。 559、连孔子都说过，牢中的未必是坏人。我们还可以补充一句：牢外的未必是好人。 560、历史上，揭竿而起，哗众叛乱的，多是自我生活失败之人。因为不甘心失败，所以，孤注一掷，铤而走险，黄巢、李自成、张献忠、洪秀全都是这样的人。宋江也是这样的人。 561、实际上，宋江的仇人不是具体的人，而是社会。不是具体的事件，而是制度。宋江不是要向一两个人报复，他是要报复一种压抑人的社会及其制度。一个社会，如果在制度上压抑了人，那么，它可能就会成为很多人的仇人。它直接造就了很多仇视社会的人。 562、他们不是在哪里跌倒，就在哪里爬起来，而是恰恰相反，他们是在这里跌倒，到那里爬起来。既然社会的游戏规则对我不利，我就不再玩这个游戏，我玩别的。 ⑧ 反上梁山 563、生活中，我们就要特别提防那些特别细致的人，特别要小心那些非常关注细节的人。 564、施耐庵施大爷，你要置晁盖于何地？是你眼中无晁盖，还是你在暗示我们，宋江眼里无晁盖？而且，在好汉眼里，也无晁盖！自从晁盖反对打无为军说了一句话，被宋江驳斥之后，晁盖至此，一句话都没得说。是施耐庵不让他说，还是施耐庵有什么暗示？此时无声胜有声啊。 ⑨ 谁是领袖 565、一个是高兴自己赚了银两，一个是高兴自己结识了人物。为什么有些人是大人？为什么有些人是小人？这两句话，给我们一个答案。 566、我们要记住，晁盖很性直，很坦诚，很忠厚，但是，晁盖并不笨。何况，欺负忠厚人，是不应该的，是有报应的。 567、双方都不真心，双方都是高手，两个高手打太极，表面上看，一团和气，其实，在比试内功，互相较劲呢。 568、如果说，宋江曾经救过晁盖一次命，晁盖就救了他两次命了。并且，这第二次，还是宋江多次伤害晁盖，给他难堪以后。所以，论待人忠诚，论为人仗义，晁盖真是令人感动。 569、梁山的三代领导人，王伦、晁盖、宋江，就对梁山的未来筹划而言：王伦是小格局。晁盖是没格局。王伦是小算盘。晁盖是没算盘。就做人而言：王伦是小心眼。晁盖是没心眼。小心眼，总是算计别人，算来算去算自己，被人杀了。无心眼，总是毫无心机，糊里糊涂对他人，被人架空了。所以，王伦不是一个好人。而晁盖不是一个好领袖。晁盖是一个好人没问题，他为人特别是在，特别有正义感，是一个真正的好汉。但是，他好像没有什么事业心。王伦主政梁山的时候，是把梁山看成了自己的自留地，承包地，他只要做一个小财主，小富即安，他不要别的。就相当于今天的一些小企业主，只是把企业当成一个取钱的地方，没想到要做成事业。这样的思路，和他的拒绝天下英雄加盟的做法，是对应的。晁盖主政梁山的时候，他确实是敞开大门，欢迎各路英雄进来，但是，进来以后，大家干什么呢？他好像没有想过。他的思想是：这份家业，大家有福同享、有难同当。天天大碗喝酒，大块吃肉，岂不快哉！所以，他是一个够格的好朋友，但是，他还不能说是好领路人。因为他没有对未来的筹划。宋江和他们相比，显然高出很多：他有大算盘，他有大格局，他有筹划，有步骤。他一直在想着，如何把梁山做大，如何让兄弟们有个归宿。 ⑩ 做大梁山 570、要发展，就不能太保守，要主动出击。 571、这里，有这里的规矩，有这里的道理。在这个强盗世界里，有强盗世界的道，盗亦有道，不遵循这样的道，就不能立足于这样的世界。 572、简单地说，对于梁山，晁盖要做正，宋江要做大。 573、山上只要有宋江，就一定有李逵，有宋江这样的头领，就一定不缺李逵这样不折不扣执行命令的人。 574、宋江改变了梁山的作风，在很大的程度上，降低了梁山的道德境界。 ⑪ 遗言危机 575、为人不可以太过分。尤其不可以过分对待一个忠厚人。这是宋江的教训。 576、对于权力来说，至少要符合三个条件：第一，合法性。第二，合理性。第三，合德性。合法性就是指权力的来源，比如古代的帝王，权力的合法性来自于天，来自于继承，来自于血统。今天的西方社会，来自于公民选举，合乎于程序等等。合理性，指的是权力对于社会的必要性。比如，黑社会就不具备合理性，因为它不是社会运作的必要环节，反而是有害环节。合德性，指的是权力的道德属性。任何权力都要有一个道德支撑，要有一个道德目标。 577、今天冒充老师的更多，冒充大师的都有几个，没有真本事的多的是。 578、没有程序公正的权力，是不能服众的，是时时刻刻都要面对质疑甚至挑战的。 579、梁山之上，一人之身，兼有英和雄两种素质与气质的，当然是宋江。这样的人，才能役使英与雄。而能役使英雄，才能成就大业。 580、抹去旧的痕迹，添上新的色彩，这是一切继任者向别人宣布自己时代到来的常用手法。 581、由于没有什么文化，他自然就缺乏一种文化意义上的目标和境界。我们看看历史，我们会发现，从来没有一个没文化的造反者会取得最后成功。 582、人生要有一个奔头，才有意义。有想头，才是一个有出息的人。给人一个想头，才是一个有前途的组织。 ⑫ 牢笼英雄 583、说宋江改“聚义厅”为“忠义堂”是背叛了晁盖的革命路线，不对。但是，必须承认的是，宋江确实是想借正式命名来体现一种政治追求。而这种政治追求也确实以忠于皇帝为核心。 584、梁山，由此就由一个盗匪集团变成了一个政治集团。梁山至此，就做大了，做强了，做出了千古的美名，做出了忠义大业。 585、事物还是那些事物，但事实已经不是那些事实。改变了事实，就改变了世界。 586、尽管我对宋江的很多行为并不欣赏，但是，宋江改“聚义厅”为“忠义堂”，却是一件必须肯定的事。 ⑬ 老大归位 587、卢俊义的前半生，太顺遂了。太顺遂的人，往往太自信太自负，甚至狂妄自大，不知天高地厚。卢俊义的后半生，太坎坷了。这一怪宋江、吴用，二怪自己。一为他人陷害，一为咎由自取。前半生太顺遂，如同人生的超支。超支了，总要还的。 588、小人虽然聪明绝顶，虽然看起来处处得手，但最终是难逃身败名裂的下场。 589、一切都一样！为什么《水浒》作者不怕重复？是《水浒》作者写不出新意吗？不是，是《水浒》作者要写出小人还是小人，小人不知改悔，小人还是那个样！小人不知改悔，作者就不必改写。小人不知改悔，害人手法一点不差；苍天公道仁慈，因果报应一丝不爽。 590、他是在官场呆过的，见到比他出身高贵的，自然就贱骨头发痒。 591、宋江果然厉害。晁盖遗言的难题终于解决了。这个解决的方法，就是把晁盖的遗言丢弃到一边，另外确立一个合法性程序。这相当于通过修改宪法，来修改法律程序，实现自己的目的。 ⑭ 大结局 592、这个认识是非常深刻的，说明他对朝廷根本不报希望。宋江说我们要改邪归正，在鲁智深看来，是朝廷要改邪归正，而且，这个黑暗腐朽的朝廷根本不可能改邪归正。招安以后，梁山好汉包括宋江，在朝廷上根本没有任何力量削弱高俅、童贯、蔡京等奸邪小人的势力，反而在处处委曲求全后，落了个彻底覆灭的下场。这血的事实，证明了鲁智深的远见卓识。但是，鲁智深也好，李逵也好，武松也好，他们反对宋江的招安路线，却不能提出他自己的主张。这不是他们的问题，而是，在那样的时代，这些行侠仗义的好汉们，本来就没有一个安身立命的地方。再扩而大之，人生在世，哪里有这样的地方呢？套用尼采的一句话，人站在哪里不是深渊呢？ 593、《水浒传》的主题，有人说是“义”，有人说是“侠”，有人说是农民起义，要我说，就四个字：安身立命。 594、官场之上，黑幕重重，尔虞我诈，互相倾轧，哪有真正的快乐与幸福？ 595、一个新生力量要攫取国家政权，一定要有道德的积累。一个新生力量要获得执政权，一定要有政治上的主张和目标。一个新生力量要行使国家权力，一定要有相应的文化能力和文化愿景。 596、任何一个生命，从植物到动物，到社会组织，都不会再某种不变的状态下长期生存，水放长了会臭，空气隔绝久了会浊，木头放久了会蛀。万物都只有在变化发展中才能生存下去。 597、借用犯罪学上“洗钱”的概念，招安就是“洗人”，使强盗变为合法的人。 598、宋江的招安思想里，还有一层幻想：那就是进入体质以后通过自身的力量改变体制现状，清除小人，这是由体制外的反贪官变为体制内的反贪官。 599、宋江知道，他输了。他殚精竭虑，要为自己和兄弟们谋一个前程，谋一个出身，谋一个身份。但是，他输了。现在，他知道，他和他的那些已经死去的众多兄弟一样，只剩下一个虚名。如果李逵造反，朝廷一定会追夺已经给予兄弟们的那些虚名。那样，他们可真的是输得干干净净了。他毒死李逵，就是要保住这最后的虚名。 600、天罡地煞，散了，死了，埋了，都没了；谗臣贼子，一个一个还在朝廷作奸作恶，作威作福。替天行道，替天行道，这样的天，到底有没有道？ 原整理者：leyang114228，转自百度贴吧，原地址：http://tieba.baidu.com/p/777366835 Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香"
