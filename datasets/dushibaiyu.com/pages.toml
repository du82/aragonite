description = "来自知乎知识社区。一共摘自三个问题的四个答案，希望您看到后有所得，第一个是常见的困惑，第二个一幅图的解说，第三个是重量级的，循环渐进 帮你分析。顺便说下余华的《活着》也很值得一度，活着仅仅只是为了活着。 1.问题：如果活着就是为了给别人打工，那活着有什么意义？ （这个有详细问题描述，请进链接查看，我就不转了。） 答案来自张佳玮： 谢邀。 身为一个一天班都没上过的自由职业者，我没觉得我周围上班过日子的朋友，比我过得没意义或者屈辱。 我觉得，可以这么想： 人生于世，不过是高级动物。 如果有本事，可以不依赖任何人，摄取足够的养料来生活下去，当然自由自在。 但人是脆弱的。会饿，会渴，会需要满足性欲，会冷，会热。这些会让身体不舒服，程度重了还会丧命。 所以就需要一些物质资料来满足身体所需。 所以就需要工作来换取物质资料。 所谓给别人打工，也不过就是如此。大家付出劳动，换取物质资料，以图活下去罢了。 觉得不开心，可以啊，不干就是了，只要自己一个人不依靠谁能够活得下去。 没有谁规定一辈子开开心心才有意义。 我一个自由职业者，我父亲一个上班的，我妈妈一个做车辆销售的，都是投入时间，换取金钱罢了。当然我可以自欺欺人说：我有自己的事业，我妈也有自己的事业——其实归根结底，还不是投入时间换取物质资料？只是做的事儿自己喜欢，会更有归属感，做起来心情会好些罢了。 至于人生的意义，从来就不是做一些什么“属于自己的事儿”。人生一世，没什么是属于你的，只是暂且让你有“这些都属于我”的幻觉罢了。属于你的只有记忆、心情和身体。 自己给自己的人生强加许多意义，那真是太高看人类这种动物了。 答案来自mu peng： 活着不是为了打工，打工是为了活着。 如果有更好的方式维持生活，就不一定要打工了。 有的人，时间换钱，有的人，钱换时间。有钱或有时间，都算富有，真正的贫穷是，自己有时间，却没人愿意和你交换。 活着，本身就是意义。 2.问题：人生的终极的目的是什么？ 答案来自莫大先生： 是时候放出这张图片了！ 3.问题：若一辈子没有赚大钱，当大官，和自己爱的人在一起（哪怕一次），活着能算有意义吗？ 答案来自瘾小明： 我今天可以一次性地解决题主的这个问题。 只是解决的方式恐怕和题主期待的不一样。题主期待的解决方式是有个人来告诉题主人生有什么意义。而我提供的答案是： 我可以告诉你怎么摆脱这个问题的困扰。 摆脱这个问题的困扰其实不需要回答这个问题。 关于人生的意义，有这三种可能性。 1. 人生有意义，意义就是赚大钱，当大官，和相爱的人在一起。 2. 人生有意义，意义是某个1里面没提到的东西。 3. 人生无意义。 已经没有其他可能性了。那么这三个里面必然有一个是正确的。 那么什么样的东西才能叫做意义？意义就是能够让你觉得我活了这一辈子，因为有了“它”，所以没白活。有了它之后，我的人生达到了真正的满足，即使死去也毫无遗憾，它是我毕生追求的东西，是我一切行为的终极方向。 听上去有点像“信仰”。但是意义和信仰不同，信仰是一种你必须去追求的才能达到的东西，而意义是本来就存在的东西。是本来就有的状态。 假如1是真的。 那么假如有一天你真的赚到了大钱，成为了一名企业家，比如说刘强东那样，有钱，有奶茶，出任ceo，迎娶白富美，走向人生巅峰。那么你的人生就是有意义的了。那么你这一辈子就没白活，那么你死而无憾。那我让你马上就死，你会死吗？ 你会说： 你这不是坑爹吗！好不容易有钱了，好不容易有奶茶了，你至少先让我爽一阵子吧。你要是现在就让我死了，那我赚这些钱还有什么意义？ 所以说你想要的并不仅仅是钱而已，你想要的是有钱之后的那种爽。 那你想爽多久？我觉得多久你都不会嫌久。。。 基本上所有成功学类的书都可以归为这第一类。 成功学一般来说一整本书主要讲两件事：1.坚持梦想。2.努力。 成 功学的书会不断暗示你最后的成功是你人生唯一的目的和意义。但是它只敢暗示，不敢挑明了写出来。因为成功的概率太低了，低于1%。而且成功学的书会暗示"
full_description = "人生意义的解答 来自知乎知识社区。一共摘自三个问题的四个答案，希望您看到后有所得，第一个是常见的困惑，第二个一幅图的解说，第三个是重量级的，循环渐进 帮你分析。顺便说下余华的《活着》也很值得一度，活着仅仅只是为了活着。 1.问题：如果活着就是为了给别人打工，那活着有什么意义？ （这个有详细问题描述，请进链接查看，我就不转了。） 答案来自张佳玮： 谢邀。 身为一个一天班都没上过的自由职业者，我没觉得我周围上班过日子的朋友，比我过得没意义或者屈辱。 我觉得，可以这么想： 人生于世，不过是高级动物。 如果有本事，可以不依赖任何人，摄取足够的养料来生活下去，当然自由自在。 但人是脆弱的。会饿，会渴，会需要满足性欲，会冷，会热。这些会让身体不舒服，程度重了还会丧命。 所以就需要一些物质资料来满足身体所需。 所以就需要工作来换取物质资料。 所谓给别人打工，也不过就是如此。大家付出劳动，换取物质资料，以图活下去罢了。 觉得不开心，可以啊，不干就是了，只要自己一个人不依靠谁能够活得下去。 没有谁规定一辈子开开心心才有意义。 我一个自由职业者，我父亲一个上班的，我妈妈一个做车辆销售的，都是投入时间，换取金钱罢了。当然我可以自欺欺人说：我有自己的事业，我妈也有自己的事业——其实归根结底，还不是投入时间换取物质资料？只是做的事儿自己喜欢，会更有归属感，做起来心情会好些罢了。 至于人生的意义，从来就不是做一些什么“属于自己的事儿”。人生一世，没什么是属于你的，只是暂且让你有“这些都属于我”的幻觉罢了。属于你的只有记忆、心情和身体。 自己给自己的人生强加许多意义，那真是太高看人类这种动物了。 答案来自mu peng： 活着不是为了打工，打工是为了活着。 如果有更好的方式维持生活，就不一定要打工了。 有的人，时间换钱，有的人，钱换时间。有钱或有时间，都算富有，真正的贫穷是，自己有时间，却没人愿意和你交换。 活着，本身就是意义。 2.问题：人生的终极的目的是什么？ 答案来自莫大先生： 是时候放出这张图片了！ 3.问题：若一辈子没有赚大钱，当大官，和自己爱的人在一起（哪怕一次），活着能算有意义吗？ 答案来自瘾小明： 我今天可以一次性地解决题主的这个问题。 只是解决的方式恐怕和题主期待的不一样。题主期待的解决方式是有个人来告诉题主人生有什么意义。而我提供的答案是： 我可以告诉你怎么摆脱这个问题的困扰。 摆脱这个问题的困扰其实不需要回答这个问题。 关于人生的意义，有这三种可能性。 1. 人生有意义，意义就是赚大钱，当大官，和相爱的人在一起。 2. 人生有意义，意义是某个1里面没提到的东西。 3. 人生无意义。 已经没有其他可能性了。那么这三个里面必然有一个是正确的。 那么什么样的东西才能叫做意义？意义就是能够让你觉得我活了这一辈子，因为有了“它”，所以没白活。有了它之后，我的人生达到了真正的满足，即使死去也毫无遗憾，它是我毕生追求的东西，是我一切行为的终极方向。 听上去有点像“信仰”。但是意义和信仰不同，信仰是一种你必须去追求的才能达到的东西，而意义是本来就存在的东西。是本来就有的状态。 假如1是真的。 那么假如有一天你真的赚到了大钱，成为了一名企业家，比如说刘强东那样，有钱，有奶茶，出任ceo，迎娶白富美，走向人生巅峰。那么你的人生就是有意义的了。那么你这一辈子就没白活，那么你死而无憾。那我让你马上就死，你会死吗？ 你会说： 你这不是坑爹吗！好不容易有钱了，好不容易有奶茶了，你至少先让我爽一阵子吧。你要是现在就让我死了，那我赚这些钱还有什么意义？ 所以说你想要的并不仅仅是钱而已，你想要的是有钱之后的那种爽。 那你想爽多久？我觉得多久你都不会嫌久。。。 基本上所有成功学类的书都可以归为这第一类。 成功学一般来说一整本书主要讲两件事：1.坚持梦想。2.努力。 成 功学的书会不断暗示你最后的成功是你人生唯一的目的和意义。但是它只敢暗示，不敢挑明了写出来。因为成功的概率太低了，低于1%。而且成功学的书会暗示 你，假如你没成功，怪你自己不够努力，或者没有坚持住自己的梦想。于是就把责任推得一干二净。然而正常人的常识告诉我们努力和成功（至少是成功学里描述的 成功）并没有必然联系，成功的希望太渺茫了。那一个一辈子都没希望成功的人活着又有什么意义？没有意义活着又和死了有什么区别？ 由于这个希望太渺茫，与其活在害怕人生没有意义的恐惧之中，不如干脆就不把这个当成意义，我们可以找一些更容易达到的目标当做意义，来获得内心的平静。这就引出了选项2。 假如2是真的。 人生有意义，意义是某个其他的东西。是什么东西呢？ 基本上所有鸡汤心理学书籍都可以归为这一类。这些书里面对人生的意义大致可以分为两大类： 1. 爱，尤其是给予爱。 2. 旅途沿路的风景。 然后鸡汤书还会配上这样一张图。。。 比如我们从另外一个热门问题人终会消失，人生有何意义？为什么要活着？里面最高票GayScript的答案，列举了很多人生中美好的东西。我整理如下： 1. 好吃的，比如鸭脖、扯面、麻辣香锅。 2. 好听的音乐，比如young and beautiful等 3. 好看的小说，比如《白夜行》等 4. 好看的电视，比如《甄嬛传》 第二高票陈粒的答案，整理如下： 1. 明白些道理——理性思考 2. 遇见有趣的事——乐观心态 第三高票唐棣的答案，整理如下： 1. 像吃蛋糕和甜甜圈一样，在于吃的过程。 Gayscript的答案，好吃的好听的好看的，都是美好体验的一部分，也就是人生旅途的一部分。而陈粒的答案，思考和心态，也是人生的一个过程。唐棣的答案，就更加明显了，用吃的过程比喻人生的过程，强调享受这个过程。 这是一件很矛盾的事情。一方面整个社会都在吹捧有钱有地位还有真爱（主要还是前两项）的人，而另一方面鸡汤心理学的书籍都非要把读者的视线从金钱地位这种功利的东西上面拉回来。为什么要拉回来呢？就是因为这些其他的小事情更容易做到啊，也不会让你陷入害怕努力一辈子也没成功而找不到活着的意义的恐惧中。 那题主看到这里想必会嘀咕：就因为选项1太难达到，所以就告诉自己“那我就不要选项1了，我从简单的东西里面找意义”这不是自欺欺人吗！ ——别忘了，选项1真正吸引你的，不是金钱和地位，而是那种爽的感觉。 题主可能又会说：是啊，但那种爽只有金钱和地位还有深爱的人才能带来啊，你吃点东西看点电视怎么可能和有钱的爽相提并论！ 其实。。。还有更爽的。。。你信吗？ 而且这种爽都不用你努力赚钱成功。 以大脑分泌的多巴胺的含量多少来量化爽的话，（多巴胺：传递快乐、兴奋情绪的功能，又被称作快乐物质。多巴胺） 美食，可以提升多巴胺到150%。这就是世界上那么多吃货的原因。 性，可以提升多巴胺到200%。日常生活中你基本找不到比性高潮更爽的时刻了。 天天吃喝玩乐，天天打炮的生活，你有兴趣吗？ 你既然到知乎来提问题了，你多半会觉得，那种生活毫无目标，没有过的价值。 是因为不够爽吗？ 我们还有更爽的东西。 可卡因，可以提升350%的多巴胺。 冰毒，可以提升1200%。 把你记忆中最爽的那次性高潮，快感乘以10倍，都达不到冰毒带给你的体验。 你会觉得你在世界之颠，你是世界上最快乐的人，你精力无限，你能力无限，你可以飞起来。 在药物面前，一切生活中的爽都变得苍白无力。 那假如我给你提供足量的冰毒，让你不间断地吸，一直爽到死，你愿意吗？ 你愿意这样活吗？ 恐怕你想到那种生活脑子里就只有恐惧了吧。 因为你想要的，不仅仅是爽而已。 你会觉得只有爽的人生过于低俗了，你想要一个高大上的意义。 如果我跟你说，你要为了你爱的人和爱你的人而活着。你可能会问：凭什么？我多累啊？ 如果我跟你说，你要为了造福社会，为社会作贡献，为人类作贡献而活着，比如比尔盖茨做慈善，比如甘地和曼德拉为了和平，比如奥巴马为了全美国人的幸福。你可能会说：那都太远了，我自己还没活明白呢，哪有心情管别人。 你说：有没有不那么“道貌岸然”，又很高大上的理由？我要一个真正神圣而终极的意义，不要和这些俗事俗人扯在一起。 这个问题我思考过超过10年。我既然为了一种东西活着，那这种东西必须是永恒的，超俗的，才值得我付出一辈子。后来我发现，真正永恒的，超越了生死的，超越了自身肉体局限的终极意义，所有想脱离平凡而向往最终的伟大的进化，最后都指向了同一个归宿——宗教。 只有神，才能给你一个终极的意义。（对这一点有疑问请阅读文末FAQ第4问） 你说：。。。。。。我是无神论，你给我来点实际的。 好。 无神论者，最后的终极意义，也就是进化的终极意义，是推动人类向往更高级的文明，更高级的秩序发展，而我们一生也许只是帮助推动这个历史进程往前走短短一步而已。（理论支持：《非零年代》） 你说：。。。。。。这是人类的意义，我根本活不到那天，太虚了，有没有接地气一点的，你就不能把注意力放在我身上，别总扯全人类什么的。 我说：。。。。。。我弄死你。你现在为什么不马上去死？阻止你死的原因就是你活着的意义。 你说：我就是不想死啊，没什么特别原因。这不能算是意义吧？而且我感觉我还没活明白，没找到意义，我死也死得不明不白啊。这也不算是意义吧？ 对方辩友你赢了。。。 我已经没有更好的回答了。 到目前为止出现过的所有备选答案： 1. 成功，成为人上人 2. 好吃的，好听的，好看的 3. 明白些道理，遇见有趣的事 4. 像吃蛋糕和甜甜圈一样，在于吃的过程。 5. 纯粹为了快感而嗑药。 6. 为了我爱的人和爱我的人。 7. 为社会和他人作贡献。 8. 为神服务。 9. 推动人类进化。 每一个都可以作为活着的意义，但是如果你真的要问为什么，我活着就为了吃吗？我活着就为了那点快感吗？我为什么要累死累活地赚大钱？我为什么要学习新事物有什么意义？我为什么要为了别人活着？我为什么要奉献自己给全人类？我就不能自己好好活着吗？ 如果你愿意，你可以为其中任何一项而活着；如果你不想，哪一项也没有足够的说服力让你非为这个活不可。 即使是神圣如宗教和进化，也不是那么100%有说服力。（关于这两点的更多探讨请见文末FAQ第3问和第8问） 那最终答案是什么？ 如果你已经问到这里了，就只剩最后一个可能性了。 人活着没有任何意义。 你必须搞清楚这个先后顺序，你是先存在于这个世界上，然后才开始寻找意义的。 你不是因为有意义才活着。 你是因为活着才去寻找意义。 你跟所有物体，石头，树木，动物一样，都只是存在。他们的存在没有意义，你的存在也没有意义。 但是作为人类，你有思维，你有自我察觉，你有价值判断，所以你觉得自己应该有一个意义。（理论支持：斯蒂芬·霍金《The Grand Design》） 而且，你发现周围的人得过且过，而自己需要一个真正的意义，你觉得自己很特别。实际上你确实很特别，但不是你想的那种特别。你的特别之处仅仅在于——可能你目前的多巴胺水平比他们低而已。 多巴胺，大脑中的激素，决定了你怎么思考。 当多巴胺偏低的时候，人就开始思考生命的意义，生活的意义。试图用一种理智的东西来说服自己忍受不快乐的生活。 如果多巴胺水平更低，就会陷入抑郁情绪。如果你接触抑郁症患者，你会发现他们经常说的一句就是：那又有什么意义？活着又有什么意义？ 如果你多巴胺再低一点，变成重症抑郁，那时你就开始想要自杀了，因为你觉得活着没意义。 而如果你的多巴胺和大多数人水平一样，你基本就会和大多数人一样，觉得就这样活着挺好啊。生活中这么多美好的事情，就像gayscript列举的那样，有好吃的好玩的好看的，这样的生活不是挺好吗？ 如果你再高一点，你就会觉得生活简直太美好了，根本不需要什么意义，活着本身就已经是最大的幸运。阳光照着你你很开心，走在草地上你很开心，恋人的一个笑，那就是你生命的全部意义。 但是题主不要急，多巴胺的水平不是固定的，是可以随时调整的。往往我们成长的每个阶段会有不同的想法，有时两个想法截然相反。比如小学时候你很积极学习，初中时候你很厌学这类的，有可能会是多巴胺的原因。（也有可能是别的原因） 为什么所有鸡汤心理学都告诉你在怀疑人生的时候，要体验旅途，要爱别人？ 因为这么做了之后，你的多巴胺水平就会升高啊！然后你就不会纠结到底有什么意义了！ 如果你说：那不是自欺欺人吗？只是把问题拖到后面了而已。 不，事实是，问题根本就不存在！ 你之前为什么会觉得钱和地位是意义？只不过是你对钱和地位有需求而已。 我又要拿出万能的马斯洛了。。。 你需要钱和地位和爱情，来满足你（从下往上）第二层到第四层的需求。只是因为你有这种需求，你就会以为这就是你的意义。 也就是说，意义只不过是心理需求的一种体现而已。 事实上当我几年前发现真正神圣而终极的意义只有宗教的时候，我开始明白意义不是一个固定的东西，它是一个可变的东西，在不同的人生阶段代表不同的东西。后来的学习研究也证实了我的观点，它真的是随着需求而变的。 正确的顺序是：先存在=>因为活着而有需求=>把需求当做意义。 首先你要接受一个事实，而不是逃避这个事实，那就是你活着。只有当你真正接受了这个事实，才会开始想： 既然现在我活着，我可以做点什么？ 为什么一定要接受这个事实？就像心理学上的接纳不完美的自己一样，接纳自己不完美的生活，接纳自己不需要意义的存在。你不是因为什么意义才出生的，你就这么突然地活着了，你坚持活下去的原因就是你不想死而已。无论你这一生的意义是什么，你活着的这一生所做的选择都是根据短期长期快感决定的，而且在不久的将来，你也会突然地死去。整个人类的进化也许有意义，但是这个视角太大了基本上和你没什么关系。你就这么活着，就这么存在着，也将会就这么死去。你没有别的选择，这是事实。你就是你，你活着就是活着。 举个最简单的例子，你不会因为2+2=4而苦恼，你不会想2+2为什么等于4。因为为2+2=4而苦恼是没有意义的，因为你接受了2+2=4。（理论来源：耶鲁公开课《死亡》） 没有意义会让你变空虚了吗？ 不，一旦接受了这个设定，你就从意义中解放了出来。没有了意义的束缚，你应该更自由，因为你可以做自己想做的事情而不是意义让你做的事情，你可以真正掌控自己的生活，让它按照你设想的方式发展。 所以不是先找到意义然后再活着，而是先努力生活，然后你自然会给自己赋予一个自己满意的意义。 认真赚钱，认真去爱，认真体验生命的美好，认真学习，认真见识新世界。你想让你的人生在哪方面拓展就在哪方面加油。 这就是热爱生活。 然后你就会明白为什么活着。 这就是真正完全摆脱这种问题的困扰的方法，那就是积极，乐观，阳光地去拥抱生活！ ————————–全文完———————————- FAQ （常见问题解答） 1.我就是觉得赚大钱当大官才叫真的爽，吸毒的那种爽怎么能和这个爽比？ 你 觉得赚大钱更爽，完全没有问题，说明你没有这方面人生的困惑，也就不用读这篇文章。本文只是为了解答另一部分还没找到意义的，或者是觉得赚大钱不是他们最 终想要的同学的疑惑。理论上来说，如果纯按快感的话，当赚大钱当大官真的没有多爽。不过如果你一定要觉得这才是最爽的当然没问题，千金难买你愿意嘛。本来 意义这个东西呢就不是必须有的，你知道你就想这么过，那就加油吧！ 2.冰毒真的有那个效果吗？ 冰毒真的有那么爽。但是！这 只是一个思想实验，也就是说，能让你吸冰毒到死的情况是不存在的。就算你有那么多货（比如说前几年查获了10吨冰毒什么的，肯定够你吸了），长期吸食，不 间断地吸食，其实并不爽。多巴胺冲顶的感觉如果玩多了，就会导致精神分裂，时间一长，你开始疑神疑鬼，被害妄想，记忆力退化，看谁都像害你，情绪失控，心 率失控，肾功能衰竭，性能力退化，而且药效过后，多巴胺水平会降到比原来更低，你会感觉极度抑郁，必须再吸才能复原。那时，控制你去吸的就是后脑了（后脑 是负责控制呼吸这种无意识功能的）。彻底戒毒后可能要2年才能让大脑恢复正常功能。不要说你觉得自己有意志力，想想自己“减肥”“学英语”“戒烟”“这学 期一定好好学习”这些事情上下过了几次决心，你就对自己意志力有了正确的评估了。那么看到这里你该明白为什么全世界都要禁掉它了吧？ 至于我 为什么要把这个作为例子，是因为这只是个思想实验，思想实验的目的是帮你理清自己大脑中的思路，分清优先级的。我也完全可以换成另一个例子，黑客帝国的例 子。假如可以让你插上几根电线，沉睡一辈子不会醒来，通过刺激你的大脑，让你像做梦一样做一辈子的梦，而且做的全部是美梦，梦里你赚大钱，当大官，泡美女 /帅哥，成为人上人，永远不会醒来，就这么爽一辈子，你愿意吗？评论里面有人说愿意。不管你愿不愿意，都没关系，因为这就是你的选择。还是那句话，意义这 个东西不是必须有的，你不需要意义，你就这么活一辈子，确实也很爽啊。 当然也有可能你不愿意，那么本文是为你而写的：） 3.难道哲学家们都是多巴胺低吗？傻子也不思考人生的意义啊？你是怎么得知多巴胺高低和思不思考意义的关系的？ 这个，一句话来说，如果你真的抑郁过，你就会明白我所说的。如果你不明白，那说明你其实是很幸运的，没抑郁过。 如 果一定要我解释的话，我们可以把这个看成是以个人来参考，进行纵向比较。个人的多巴胺水平是会有波动的，也许你这段时期水平高一点，就会开心，活力四射， 过几个月可能会低一点（也可能因为遇到什么打击），就会抑郁一些。低的时候是倾向于思考意义的。如果横向比较的话，目前没有研究来研究这个，但是我可以提 供一些证据。比如说要研究抑郁的人是不是会更倾向于思考意义，我搜索了百度贴吧“抑郁”吧里面所有帖子中“意义”两字出现的频率，发现是0.55%。百度 “抑郁症”吧，“意义”的频率为0.28%。而百度最大的综合性贴吧李毅吧，“意义”出现的频率是0.1%。前两个贴吧的频率都远远大于第三个贴吧 （5.5倍和2.8倍） 最后，多巴胺和智商真的没关系……傻子有高多巴胺，哲学家有低多巴胺难道很奇怪吗？你为什么不觉得正因为低多巴胺所 以他们才有了独特的天赋能看透呢？这种多巴胺的高低，没有褒贬的，都是中性的，就像左右撇子一样，都是生物的多样性，而如果你能够好好运用起来自己的优 势，你就能让它更大的发挥作用改善你的生活。 4.为什么说“真正超俗的终极意义，所有想脱离平凡而向往最终的伟大的进化，最后都指向了同一个归宿——宗教”？ 找 不到意义的人就是有这么一个特点，就是别人说生命的意义是什么的时候，ta一定会想：可是为什么就一定要这样呢？我为什么一定要为了这个活着呢？上面列举 的所有，都逃不过这最终一问。我为什么要赚钱？生不带来死不带去？我为什么要嘻嘻哈哈浑浑噩噩地过完一生？我为什么要学新东西，累不累？我为什么要为了别 人活着？而这些人在问这些为什么的时候，心里找寻的是一个真正永恒的，超越了生死的，超越了自身肉体局限的东西。只有这种东西才能被叫做意义。我既然为了 一种东西活着，那这种东西必须是永恒的，才值得我付出一辈子。那么，这种永恒的东西，只有宗教才能提供，没有任何其他的东西可以提供。并且，宗教也正是为 了满足自古以来人们的这个对于永恒意义的需求而产生的。 而这种思维，就正是意义先于存在的思维。你觉得意义是独立于你的生命和灵魂之外的。 如果你寻找并且只寻找那么一个终极的目标，那么你唯一的选择就是宗教。在这个角度上，宗教超越了俗世的所有执着，因为它超越了生死。如果你真的觉得自己是 无神论，那么进化也许可以成为宗教的替代版，关于进化的详情请见后面第8问。 5.答主前面写得很好，到结尾就又成为鸡汤了，结局删掉就好了。 首先谢谢你对于我前面部分的肯定。在读到结尾之前你可能会有一种血淋淋的快感，读到结尾处可能会觉得被调戏了“草，说了半天又变成鸡汤了！”嗯这种心情我非常理解……因为我以前也是这样的，看到和鸡汤沾边的东西会产生生理上的反感。 一 般来说成长的三个阶段，第一个阶段是看什么美好的都愿意相信，第二个阶段是被现实打击次数太多，再看到美好的或者装作世界很美好的，就觉得假，觉得你装什 么啊？这个阶段是很有诱惑力的，它给了人一种看破一切的优越感，一种置身事外的超脱感，一种俯视众生的上帝视角。后来我发现……我的人生并没有因为看破一 切而真正变好。本质上我仍然痛苦，我告诉自己我其实不想要俗世的认可，实际上只是因为我不想要为那些认可付出努力而已。我心中最理想的事情就是我什么努力 也不用，但是被俗世所有人认可，然后我还可以高冷地鄙视他们说：哼，你们真俗。 呵呵，这不是公主病吗！点到为止，说多了就像说教了。 6.说了一堆大道理，那我应该怎么做呢？怎么提升幸福感？怎么提升多巴胺？ 这 个问题问得非常好，要说清楚会比现在写下来的这些文字都要长。现在我没有时间和精力详细地写这个（毕竟也没人给我稿费是吧）。但我可以推荐一些东西给你 们，比如哈佛公开课《幸福课》，这种积极心理学的立论基础就是，人们发现，人们过于关注对抑郁症的治疗，但是却没有关注怎么让普通人过得更好。而让普通人 过得更好却正是预防抑郁的关键。20世纪的医学已经告诉我们预防是成本最小也最有效的疾病控制方式。所以这个公开课可以看作是整个学科的入门。如果有兴趣 可以看一下。如果没兴趣，哈哈，那就关注我以后的回答吧。 7.上面第5个问题不是说有三个阶段吗？你怎么只说了两个？第三个呢？ 第一个阶段可以说是只看到世界美好的一面。 第二个阶段是看到丑恶的一面之后觉得以前看到的美好的一面全是假的，进而相信世界终究是丑恶的。 第三个阶段是明白了美好，又接受了丑恶，最终发现美好和丑恶是可以转换的，而自己的努力则直接能让自己变得更美好。 分成三个阶段只是一个简化的分级，类似于看山是山，看山不是山，看山还是山的意思，便于理解。实际上不能说只有这简单的三个阶段，因为每个阶段之间有相当长的过渡期，还有反复期，中间的过程要复杂得多。 8.看到宗教那段我眼睛都湿了，似乎道出了真理，可你还是回归了逻辑理性，你说服不了我，怎么办？ 继续在宗教和进化这个话题上探讨一下。 如果你说，没有证据证明上帝真的存在，所以宗教无法说服你，而你又想找一个独立于存在之外的意义，那你只有相信进化论了。但是进化是一个完美的答案吗？ 从 最早的现代人类出现到今天，人类经历了十几万年，而你只会活几十年。进化这个东西，它的视角是如此宏伟，而你这一生，存在的时间是如此之短，你又是无数个 生命体中的一粒尘埃。假如有一个上帝站在电脑屏幕前，随机勾选了地球上一亿个人，一点删除，就全部蒸发了。地球上少了一亿人口（平均分布于全世界），地球 上的人口大概从70亿变成69亿，和原来毫无区别，剩下的69亿可以毫不被影响地继续人类的进化进程。是的，进化多你一个不多，少你一个不少。多一亿个你 都不多，少一亿个你都不少，它太宏大了，你根本影响不了它。就算把70亿都删光了也没关系，因为进化甚至和人类就没什么关系。进化已经宏大到多人类不多， 少人类不少的境界。地球存在了46亿年，现代人类只存在了十几万年，而恐龙都存在了1.6亿年，要说进化的时间长短，你们人类在恐龙面前就是蚂蚁的一生。 就算人类发展出了文明，对地球和宇宙的影响远超爬行动物，但是在茫茫宇宙中，地球又算个什么？太阳系都不算什么。假如我是上帝，我又站在屏幕前，手指在太 阳系上一划，这个小得不起眼的恒星以及周围的几个行星都蒸发了，宇宙会有什么变化？什么变化也没有。我这么说你可能还没有直观的感受，我们不如来看一看这 张著名的图。（图比较大请耐心等待） 整个宇宙137亿年的历史，人类只有十几万年，也许有无数文明存在于人类出现之前，无数文明诞生于人类灭亡之后，无数我们所无法想象的文明，比如霍 金说外星人可能住在恒星中心，或者就漂浮在星云里，超越了最野蛮的想象力的存在。甚至你在上面图上看到的所有的亮点加起来，不过是整个宇宙的4.9%。在 宇宙中，可见的物质只占4.9%，其余95.1%的东西中有68.3%是暗能量，26.8%是暗物质，我们看不见的东西是我们看得见的东西的19倍。什么 叫做看不见？就是用现有的科学水平根本探测不到，但是经过观测和计算又确定它们存在的东西，它们可能存在于更高维度，比如四维空间（这仅仅是猜测）。 而 你们人类，目前去过最远的地方是月球，连去火星的时间都无法预测到，更不用说出太阳系，出银河系，到130亿光年之外的那个比银河系大8倍的星系去玩了。 你们人类影响宇宙的能力真是微乎其微，闹翻天了也就是把地球毁了而已，宇宙根本不care你们是死是活。宇宙真的多你们一个人类不多，少你们一个人类不 少。 此时再问你，你为什么要为了进化而活着？最主要的是，进化tm和你有个屁关系啊？ 但是你又一定要找到一个超越你生死的东西。宇宙把你吓回来了，怎么办？只有宗教了，宗教看上去还有那么一点温情。 如 果你能接受宗教，你可以去信宗教，如果你觉得不行我就是无法相信这种没有证据的存在，那我只能说，真的，所有的可能性都已经探讨过了。如果你不能接受，那 就必须推翻“意义独立于存在之外”这个前提了。也就是说：意义是在存在之后的，人活着本身并不带有任何意义，所有的意义都是你自己赋予自己的。读到这里， 为了巩固，你可以再拉回到原文从“人活着没有任何意义。”这句往后再读一遍。 Author 渡世白玉Posted on 2015年3月14日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 意义, 活着"
