full_description = "一些名人提出的顶级思维 1、素养 蓝斯登原则：在你往上爬的时候，一定要保持梯子的整洁，否则你下来时可能会滑倒。 提出者：美国管理学家蓝斯登。 点评：进退有度，才不至进退维谷；宠辱皆忘，方可以宠辱不惊。 Continue reading “一些名人提出的顶级思维” Author 渡世白玉Posted on 2014年7月14日2015年8月21日Categories 其它Tags 思维, 效应34 Comments on 一些名人提出的顶级思维 QSsh之android版编译 今天看到有人在Qtcn.org给我留言问我QSsh的botan在android和ios 的arm下编译不通过，我就去测试了下，果然是（如果哪位哥们看到，我道个歉，前天发的，今天才看到）。以前只在win和linux下，果然arm有问题。我就去差了下原因是Botan不同平台，比同cpu和编译器的配置不同的。 所以我就去看了下QSsh用的botan的用法，他是把botan的配置那么多宏在botan.pri下根据平台和编译器进行很多定义的。仔细看了看那么多的宏和判断，而且加上我对botan不是十分的熟悉，就不敢妄自更改他的配置。我也就想了个偷懒的方法，去替换掉QSsh用的Botan，直接用自己官方下载的Botan替换掉QSsh里的Botan。 Continue reading “QSsh之android版编译” Author 渡世白玉Posted on 2014年7月14日2015年8月21日Categories C/C++, Qt, 编程设计Tags android, 编译4 Comments on QSsh之android版编译"
