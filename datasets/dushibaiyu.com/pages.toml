full_description = "[翻译]理解Qt容器：STL VS QTL（二）——迭代器 接上文翻译，说明在上文：理解Qt容器：STL VS QTL（一）——特性总览 迭代器： 在Qt关联容器中的迭代器默认指向的是关联容器的value元素，不同于STL的关联容器的迭代器默认指向一个pair<key,value>的键值相对应的pair结构。这样就取代了STL取值用的it->second这个不美观的写法，STL的接口反倒是一种象牙塔的写法。 Continue reading “[翻译]理解Qt容器：STL VS QTL（二）——迭代器” Author 渡世白玉Posted on 2014年11月26日2015年8月21日Categories C/C++, Qt, 编程设计Tags QTL, STL, 容器, 迭代器, 遍历13 Comments on [翻译]理解Qt容器：STL VS QTL（二）——迭代器 [翻译]理解Qt容器：STL VS QTL（一）——特性总览 注：此文为翻译大牛的文章，原文地址：http://marcmutz.wordpress.com/effective-qt/containers/ (需翻墙)，原文较长，我E文不是很好，而且个人时间安排，我就分段翻译发出了，这是第一篇，余下的我会慢慢补齐的。 容器类是面向对象编程的一个重要的部分，是一个而非常重要的，帮助我们去管理内存的工具。 Qt有它自己实现的容器类，十分像STL，但是还是有些差异的，一些是Qt做的补充，还有一些不能对应。作为一个Qt开发者，是非常重要的去理解什么时候去使用哪一个Qt容器类，和一些时候，你去用STL去替换QTL。 Continue reading “[翻译]理解Qt容器：STL VS QTL（一）——特性总览” Author 渡世白玉Posted on 2014年11月15日2015年8月21日Categories C/C++, Qt, 编程设计Tags QTL, STL, 容器14 Comments on [翻译]理解Qt容器：STL VS QTL（一）——特性总览"
