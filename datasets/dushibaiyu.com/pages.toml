title = "让电脑成为热点：开启windows 7和2008的虚拟WiFi和SoftAP（即虚拟无线AP） | 渡世白玉"
description = "适用范围： 1.WIN7和server2008R2平台电脑 2.笔记本或带有WIFI模块的台式电脑 生成wifi网络属性： 1.WLAN是802.11g标准 2.带宽为54Mbps 生成的网络相当于一个无线路由器的功能，可以供手机和电脑连接。 具体做法： 先进入命令提示符。 开始->附件->命令提示符。或者 运行（win+r）输入cmd，确定 然后开通功能： 输入命令： netsh wlan set hostednetwork mode=allow ssid=tingxueting key=dushibaiyu 注意： 下面参数可以自由变换 mode：是否启用虚拟WiFi网卡，改为disallow则为禁用。 ssid：无线网名称，最好用英文(以tingxueting为例)。 key：无线网密码，八个以上字符(以dushibaiyu为例)。 以上三个参数可以单独使用。 例如 netsh wlan set hostednetwork mode=disallow可以直接禁用虚拟Wifi netsh wlan set hostednetwork ssid=dsby 是把ssid设置为dsby（ssid就是你用手机或电脑搜到的那个网络名） netsh"
full_description = "让电脑成为热点：开启windows 7和2008的虚拟WiFi和SoftAP（即虚拟无线AP） 适用范围： 1.WIN7和server2008R2平台电脑 2.笔记本或带有WIFI模块的台式电脑 生成wifi网络属性： 1.WLAN是802.11g标准 2.带宽为54Mbps 生成的网络相当于一个无线路由器的功能，可以供手机和电脑连接。 具体做法： 先进入命令提示符。 开始->附件->命令提示符。或者 运行（win+r）输入cmd，确定 然后开通功能： 输入命令： netsh wlan set hostednetwork mode=allow ssid=tingxueting key=dushibaiyu 注意： 下面参数可以自由变换 mode：是否启用虚拟WiFi网卡，改为disallow则为禁用。 ssid：无线网名称，最好用英文(以tingxueting为例)。 key：无线网密码，八个以上字符(以dushibaiyu为例)。 以上三个参数可以单独使用。 例如 netsh wlan set hostednetwork mode=disallow可以直接禁用虚拟Wifi netsh wlan set hostednetwork ssid=dsby 是把ssid设置为dsby（ssid就是你用手机或电脑搜到的那个网络名） netsh wlan set hostednetwork key=123456789 是把密码设置为123456789 开启成功后，网络连接中会多出一个网卡为“Microsoft Virtual WiFi Miniport Adapter”的无线连接2。你可以为了方便给他改个名，右键->重命名。例如改为“听雪亭”。 设置Internet连接共享： 在“网络连接”窗口中，右键单击已连接到Internet的网络连接，选择“属性”→“共享”，勾上“允许其他••••••连接(N)”并选择你所重命名的连接。上文我们重命名为“听雪亭”我们就选择“听雪亭”。如果没有重命名那就应该是： 无线连接2 开启无线网络 继续在命令提示符中运行：netsh wlan start hostednetwork 这是会提示已启用承载网络。这样你就开启了网络。 其他 显示无线网络信息命令：netsh wlan show hostednetwork 关闭无线网络命令： netsh wlan stop hostednetwork Author 渡世白玉Posted on 2012年5月4日Categories 网络工程Tags windows, 共享, 无线网络, 系统应用"
