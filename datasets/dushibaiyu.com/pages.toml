full_description = "关于openSUSE长期版本和openSUSE是否适合做服务器答疑 ps：内容有点长，摘自openSUSE中文社区，点击访问原帖。 首先：关于版本号可以看这里 https://en.openSUSE.org/openSUSE:Versioning_scheme 支持周期在这里 https://en.openSUSE.org/Lifetime 1.关于长期版维护： 《 Continue reading “关于openSUSE长期版本和openSUSE是否适合做服务器答疑” Author 渡世白玉Posted on 2014年1月19日2015年8月21日Categories LinuxTags opensuse, 支持, 服务器, 版本, 长期13 Comments on 关于openSUSE长期版本和openSUSE是否适合做服务器答疑 两个基于C++/Qt的开源WEB框架 1.tufao 项目地址： https://github.com/vinipsmaker/tufao 主页： http://vinipsmaker.github.io/tufao/ 介绍： Tufão is a web framework for C++ that makes use of Qt’s object communication system (signals & slots). Tufão是一个C + +的Web框架，使用Qt的对象的通信系统（信号与槽）。 Features: 特性 High performance standalone server 高性能独立服务器 Cross-plataform support 跨平台支持 Good documentation 良好的文档 Support modern HTTP features 支持现代的HTTP特性 Persistent streams 持续流 Chunked entities 分块实体 100-continue status WebSocket HTTPS support 支持HTPPS Flexible request router 灵活的路由请求 Static file server with support for conditional requests, partial download and automatic mime detection 静态文件服务器与条件请求支持，部分下载和自动检测 Plugin-based server to allow change the running code without restart the application 服务器基于插件机制，支持更改运行代码（？）而不用重启程序。 Flexible and secure session support 灵活和安全的会话支持 QtCreator’s plugin to allow create new applications rapidly QtCreator的插件，以便快速创建新的应用程序 Lots of tests 经过了大量的测试 Timeout support 超时支持 C++11 It uses Ryan Dahl’s HTTP parser to provide good performance. 采用Ryan Dahl’s HTTP分析器以提供更好的性能 You can generate documentation from the source code using Doxygen. The documentation will be put on the doc folder in the html and tex formats. There is also experimental support for Qt compressed help files. 您可以使用Doxygen的源代码生成文档。该文件将在html和tex的格式被提上doc文件夹。也有对Qt的压缩帮助文件的实验性支持。 Continue reading “两个基于C++/Qt的开源WEB框架” Author 渡世白玉Posted on 2014年1月12日2015年8月21日Categories C/C++, Qt, 编程设计Tags qt, web, 开源, 框架2 Comments on 两个基于C++/Qt的开源WEB框架"
