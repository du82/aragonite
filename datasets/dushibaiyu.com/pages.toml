title = "我是水瓶座怎么呢？ | 渡世白玉"
description = "【我是水瓶座怎么呢？】1.有点抗拒别人接近；2.爱纠结，不达目的过十年都不甘心；3.爱的纯粹，不想保留；4.讨厌束缚，喜欢自由；5.极其讨厌虚伪、欺骗；6.铁齿有主见，比较相信眼见为实；7.有时候说话很毒；8.偏执、敏感、隐忍；9. 耐心只表现在非常喜欢的人或物上。 【你不知道的水瓶座】常暗恋，有事情不敢大胆说出来，不自信，讨厌跟人打交道，多愁善感，小小事情纠结N久，笑起来是个孩子，冷起来是个谜，超懒，爱发呆，擅长装傻，热心，易被感动，爱讲道理，常独处，爱一个劲的吃东西，自尊心暴强，常年宅在家。 【水瓶座 之最】水瓶座最会关心人，水瓶座最会在朋友需要帮助时出现，水瓶座最细心，水瓶座最有洞察力，水瓶座最少说话，但语出惊人，水瓶座眼泪最多，但流出眼眶的最少，水瓶座最敏感，水瓶座最没有安全感，水瓶座最喜欢说话的时候盯对方的眼睛，水瓶座最注意小细节，水瓶座最认真。 【水瓶座的五大缺点】No.1、胆子太小害怕恋爱；No.2、杞人忧天胡思乱想；No.3、唯唯诺诺没有自信；No.4、喜欢吃醋容易嫉妒；No.5、情绪化又容易歇斯底里； 【水瓶之爱】与水瓶座交往，你会经常无法确定，水瓶到底爱不爱你。与水瓶交往越久，你越会觉得，水瓶座爱国爱家爱社会，爱花爱狗爱大便，就是不爱你！也许还是爱的，可你能感觉到的却少之又少，少到你需要费力去想、去猜、去挖掘Ta的爱。这便是水瓶座最最恶之所极的一条：不屑表现自己的爱。 【水瓶座特质】⒈吃软不吃硬。⒉乐观又悲观。安全感不多。⒊朋友求助常有求必应，所以易被骗。⒋害怕受伤。⒌故作坚强，其实很软弱。总为小事纠结。⒍自尊心暴强有点不自信。常年宅在家。⒎超懒，最爱睡觉和发呆。⒏喜欢钱但不在乎。讨厌干没有意义的事。⒐喜欢故意让人抓狂。 【水瓶座特质】1、喜欢简单。2、健忘不记仇。3、有斗志爱拼搏。4、别人对他好定加倍奉还的代表。5、天生的统筹规划专家，计划性强。 6、固执。明知是错也要往前走。7、讨厌做决定。8、爱笑，一点小事就笑逐颜开。9、爱憎分明，不给自己不喜欢的人丝毫机会，对自己喜欢的人超级纵容。 【水瓶座特质】⒈替他人着想。常试图改变自己迎合对方 ⒉外表亲切热情，内心追求安逸的环境 ⒊对最亲爱的人容易暴走脾气，对外人和善常被说人好 ⒋爱睡觉，自我，忽冷忽热。⒌超懒散。⒍刀子嘴豆腐心。⒎珍惜友谊。⒏什么事都放在心里自己承受。⒐不爱争抢，认为属于自己的别人怎么抢也抢不走。 【水瓶座性格分析】1、用情专一，人不负我，我必不负人。2、脾气倔强，喜欢较真。3、不甘愿一辈子平淡，有时喜欢刺激，爱冒险。4、喜欢美食，容易犯困，爱吃火锅，特别上瘾。5、双重性格，情绪多变，有苦不说，有泪肚咽。6、极度缺乏安全感。7、一般不与人争，要争必争到底。 【水瓶座终极完美分析】外表温和，偶尔孩子气，内心有狂野的一面，喜欢旅游但也恋家，不算太宅。容易陷入自己的想象世界不能自拔。高度的细腻敏感（对于自己在意的东西），高度的冷漠绝情（对于不入眼的东西）情感强烈而绵长，习惯虐人虐己。对待回忆郑重而感性，无比怀旧，自我保护意识强。 【水瓶座秘密】1、水瓶座天生克双子；2、容易心软；3、水瓶座很爱逞强； 4、坚强下的脆弱，把一切的辛酸眼泪全留给自己；5、自尊心强；6、没耐心； 7、受过的伤比谁都痛；8、率真，往往伤害到的不是别人，而是自己；9、宽容大度； 10、水瓶天生异性缘好，特别重视朋友；11、对于感情爱憎分明。 【水瓶座小特点】★偏好低调，喜欢安静 ★借钱找水瓶成功率较高 ★理性的可怕 ★不爱吵架，只会扭头走人 ★善辩却不爱解释 ★对朋友绝对够义气 ★不爱打听别人私事 ★对于过去，很少追究 ★有条不紊，不会情绪失控 ★甩掉水瓶很容易。 【水瓶座的缺点】1、很懒，没事几乎不出门；2、爱发呆；3、擅长装傻，其实心里都明白，只是不愿意说出来；4、与老友只想念不联系；5、很情绪化；6、双重人格；7、有自己的一套原则，我行我素；8、有时很糊涂，反应慢半拍；9、特别敏感，脆弱；10、对自己不感兴趣的人很冷漠，毫不掩饰。 水瓶座的弱点是犹犹豫豫，做事不理智容易投入感情，同情心和母爱容易泛滥，同时水瓶也是伪装高手，如果他没有把你当作亲近的人，那么你完全看不出他内心的波涛汹涌，他对所有人都一样好。但是你走不进他的心里，他设计了几十道的阻碍来考验你，如果你看到了水瓶的眼泪，恭喜你已经住进他心里了 我庆幸自己是水瓶座。虽然懒得出骨，但很坚强有自己的一套己见与原则，不爱按别人的决定做事却也会征询下别人的意见，不做讨人厌的事。很多时候看的很明白很清楚，只是不愿意多说。不爱掩饰，不喜欢一个人，对那人的感觉会直接写在脸上。如果爱一个人，却会藏在心里，爱情永远是水瓶的致命伤。 水瓶座需要慢慢相处，因为水瓶是个被动的星座，慢热的星座，放不开的星座，认识时间越久对你越好。如果只是你喜欢水瓶，水瓶却不喜欢你，频频接触的结果则是会对你越来越冷淡。水瓶喜欢和自己喜欢的人斗斗嘴，却不会大声吵架或者说根本不会吵架。你想吵，可以，水瓶只会转头走人。。 水瓶是孤独的，从来不喜欢和别人抢东西，希望在身边的人都是心甘情愿的留下来。人来人往中，要水瓶对一个人上心不容易，初接触水瓶的人都被他那种不冷不热的态度吓走了。但真正走进水瓶心里的人，就会发现水瓶对人好起来是没有底线的。那些错过水瓶的人，损失哦。 水瓶座吃软不吃硬；经常口是心非；很乐观又很悲观；安全感不多；有点感性；有些话即使害怕错过也不说；常常被人骗；小敏感；小洁癖；小心软；害怕受伤；总说自己不孤单,其实很寂寞；对陌生人冷冷的,熟悉后就嘻嘻哈哈.总表现的很坚强,其实很软弱,总被人误解,却不愿解释. 瓶子很能“装”：如果你的身边有水瓶座 ，请珍惜TA，珍惜一个几乎连说谎都不会， 做事直白的水瓶座 。请不要伤害TA们，TA们会伪装，装坚强，装得无坚不摧。以至于TA们的内心在快要垮的时候，你依然无法察觉。水瓶是一群善良的孩子，请珍惜朋友的TA，爱人的TA！ 水瓶座不爱发短信，也不爱打电话，懒蛋一个。对特别的人会例外。自尊心很强！强过金钱，强过事业，也强过爱情。水瓶座需要慢慢相处，因为水瓶是个被动的星座，慢热的星座，放不开的星座，一见钟情很难发生在水瓶座身上，水瓶座的爱需要时间。会喜欢很多人，却很难爱上一个人。 水瓶，有着长不大的心，偏偏带着无法掩饰的理智，永远坚强得让人心疼，总爱用文字诉说些所以然，但是永远还没进入大家的眼帘中，就在她的修饰下变得面目全非，不是想刻意掩饰什么，只是习惯让别人放心，不是不想简单的笑着哭着生活着，只是已经被压抑得太多。 水瓶座最大的魅力是他的矛盾所在，没有人知道他们想什么。除了他们自己。他们一时间可以是天使，一时间又可以是恶魔。水瓶座愤怒的底线太低，但是真的伤到他了，他会变得跟撒旦一样凶残冷漠。 我总觉得，任何人都是不了解水瓶座的。因为水瓶座是真正的矛盾体. 水瓶，拥有双重性格的水瓶，一个在世人面前乐天、快乐，在孤独夜晚独自伤悲的水瓶。 我想，接触过水瓶的人都知道，他们是很会搞气氛的星座，只要有水瓶出现的地方就绝对不会缺少快乐。这就是水瓶：自信、乐天、率直、忧郁。 水瓶其实是一个很恋旧的人，例如一首喜欢的歌曲也可以重复的听了好几年。别看水瓶座平时笑嘻嘻看似无忧无虑，当Ta们一个人独处的时候却又显得很容易感伤。水瓶害怕独处害怕孤单，泪腺发达却只会夜深人静的时间躲在角落偷偷流泪，擦干眼泪又是笑脸嘻嘻的面对。水瓶都是善良又不记恨往事的孩子。 你没有看到过水瓶的眼泪，是因为他从来不会在人面前哭，除非你真的把他们的真心夺走了。和水瓶在一起会感到很随和，因为他会包容你的一切。对于水瓶真正喜欢的东西，它是会执着的让人害怕的。水瓶座的人不会放弃世界，却会放弃自己，去成全别人，他们懂得原谅和理解. 水瓶座最毒的地方就是那张一天到晚呼个没完没了的嘴，话多起来停都停不下来，沉默起来谁都不理。水瓶爱的狂热起来连呼吸都忘了，冷淡起来对方的存在都可以忽略不计。水瓶幼稚起来可以去读幼儿园 ，深沉起来可以媲美哲学家。水瓶疯狂起来可以把天捣塌下来，安静起来可以消失在空气中。 水瓶不喜欢做决定，小事情随便怎么都行，大事情很喜欢听朋友的意见。如果你是水瓶可以信赖的人，他们会问你的意见，你需要做的只是分析，水瓶会自己来做决定。觉得你分析的有道理，会在心里琢磨采纳。如果水瓶有了自己的想法，一旦下了决定，就算全天下反对，几乎没有改变的可能。 大多数的人觉得水瓶座无主见，摇摆不定，其实水瓶座心中早有定论，只不过Ta习惯性迁就别人。水瓶座不是有大原则性的星座，但有很强烈的底线不容越界。Ta不说，别以为是Ta没要求，不要拿水瓶座的宽容当作你任性妄为的资本，一旦过了Ta的底线，就别怪水瓶座对你冷漠了。 。 水瓶座不喜欢勾心斗角，不喜欢被算计，不喜欢假假的友情；水瓶座喜欢简单的人，简单的事，傻傻的，每天嘻嘻哈哈过日子；水瓶座知道谁是真心喜欢TA，谁只是面儿上对TA；水瓶座没别人想的那么聪明，但是，很多事，水瓶都看得明白，只是不想说，TA没说破，没翻脸，只是因为TA不想尴尬罢了。 水瓶座沉默？滚你丫的沉默的！水瓶要是沉默世界都毁灭了。水瓶在熟人面前疯起来谁都拉不住，比狮子还要疯，这是完全能够证明的。每个水瓶都是天生的演技派，成熟和幼稚的混合，天使和恶魔的杂交！"
full_description = "我是水瓶座怎么呢？ 【我是水瓶座怎么呢？】1.有点抗拒别人接近；2.爱纠结，不达目的过十年都不甘心；3.爱的纯粹，不想保留；4.讨厌束缚，喜欢自由；5.极其讨厌虚伪、欺骗；6.铁齿有主见，比较相信眼见为实；7.有时候说话很毒；8.偏执、敏感、隐忍；9. 耐心只表现在非常喜欢的人或物上。 【你不知道的水瓶座】常暗恋，有事情不敢大胆说出来，不自信，讨厌跟人打交道，多愁善感，小小事情纠结N久，笑起来是个孩子，冷起来是个谜，超懒，爱发呆，擅长装傻，热心，易被感动，爱讲道理，常独处，爱一个劲的吃东西，自尊心暴强，常年宅在家。 【水瓶座 之最】水瓶座最会关心人，水瓶座最会在朋友需要帮助时出现，水瓶座最细心，水瓶座最有洞察力，水瓶座最少说话，但语出惊人，水瓶座眼泪最多，但流出眼眶的最少，水瓶座最敏感，水瓶座最没有安全感，水瓶座最喜欢说话的时候盯对方的眼睛，水瓶座最注意小细节，水瓶座最认真。 【水瓶座的五大缺点】No.1、胆子太小害怕恋爱；No.2、杞人忧天胡思乱想；No.3、唯唯诺诺没有自信；No.4、喜欢吃醋容易嫉妒；No.5、情绪化又容易歇斯底里； 【水瓶之爱】与水瓶座交往，你会经常无法确定，水瓶到底爱不爱你。与水瓶交往越久，你越会觉得，水瓶座爱国爱家爱社会，爱花爱狗爱大便，就是不爱你！也许还是爱的，可你能感觉到的却少之又少，少到你需要费力去想、去猜、去挖掘Ta的爱。这便是水瓶座最最恶之所极的一条：不屑表现自己的爱。 【水瓶座特质】⒈吃软不吃硬。⒉乐观又悲观。安全感不多。⒊朋友求助常有求必应，所以易被骗。⒋害怕受伤。⒌故作坚强，其实很软弱。总为小事纠结。⒍自尊心暴强有点不自信。常年宅在家。⒎超懒，最爱睡觉和发呆。⒏喜欢钱但不在乎。讨厌干没有意义的事。⒐喜欢故意让人抓狂。 【水瓶座特质】1、喜欢简单。2、健忘不记仇。3、有斗志爱拼搏。4、别人对他好定加倍奉还的代表。5、天生的统筹规划专家，计划性强。 6、固执。明知是错也要往前走。7、讨厌做决定。8、爱笑，一点小事就笑逐颜开。9、爱憎分明，不给自己不喜欢的人丝毫机会，对自己喜欢的人超级纵容。 【水瓶座特质】⒈替他人着想。常试图改变自己迎合对方 ⒉外表亲切热情，内心追求安逸的环境 ⒊对最亲爱的人容易暴走脾气，对外人和善常被说人好 ⒋爱睡觉，自我，忽冷忽热。⒌超懒散。⒍刀子嘴豆腐心。⒎珍惜友谊。⒏什么事都放在心里自己承受。⒐不爱争抢，认为属于自己的别人怎么抢也抢不走。 【水瓶座性格分析】1、用情专一，人不负我，我必不负人。2、脾气倔强，喜欢较真。3、不甘愿一辈子平淡，有时喜欢刺激，爱冒险。4、喜欢美食，容易犯困，爱吃火锅，特别上瘾。5、双重性格，情绪多变，有苦不说，有泪肚咽。6、极度缺乏安全感。7、一般不与人争，要争必争到底。 【水瓶座终极完美分析】外表温和，偶尔孩子气，内心有狂野的一面，喜欢旅游但也恋家，不算太宅。容易陷入自己的想象世界不能自拔。高度的细腻敏感（对于自己在意的东西），高度的冷漠绝情（对于不入眼的东西）情感强烈而绵长，习惯虐人虐己。对待回忆郑重而感性，无比怀旧，自我保护意识强。 【水瓶座秘密】1、水瓶座天生克双子；2、容易心软；3、水瓶座很爱逞强； 4、坚强下的脆弱，把一切的辛酸眼泪全留给自己；5、自尊心强；6、没耐心； 7、受过的伤比谁都痛；8、率真，往往伤害到的不是别人，而是自己；9、宽容大度； 10、水瓶天生异性缘好，特别重视朋友；11、对于感情爱憎分明。 【水瓶座小特点】★偏好低调，喜欢安静 ★借钱找水瓶成功率较高 ★理性的可怕 ★不爱吵架，只会扭头走人 ★善辩却不爱解释 ★对朋友绝对够义气 ★不爱打听别人私事 ★对于过去，很少追究 ★有条不紊，不会情绪失控 ★甩掉水瓶很容易。 【水瓶座的缺点】1、很懒，没事几乎不出门；2、爱发呆；3、擅长装傻，其实心里都明白，只是不愿意说出来；4、与老友只想念不联系；5、很情绪化；6、双重人格；7、有自己的一套原则，我行我素；8、有时很糊涂，反应慢半拍；9、特别敏感，脆弱；10、对自己不感兴趣的人很冷漠，毫不掩饰。 水瓶座的弱点是犹犹豫豫，做事不理智容易投入感情，同情心和母爱容易泛滥，同时水瓶也是伪装高手，如果他没有把你当作亲近的人，那么你完全看不出他内心的波涛汹涌，他对所有人都一样好。但是你走不进他的心里，他设计了几十道的阻碍来考验你，如果你看到了水瓶的眼泪，恭喜你已经住进他心里了 我庆幸自己是水瓶座。虽然懒得出骨，但很坚强有自己的一套己见与原则，不爱按别人的决定做事却也会征询下别人的意见，不做讨人厌的事。很多时候看的很明白很清楚，只是不愿意多说。不爱掩饰，不喜欢一个人，对那人的感觉会直接写在脸上。如果爱一个人，却会藏在心里，爱情永远是水瓶的致命伤。 水瓶座需要慢慢相处，因为水瓶是个被动的星座