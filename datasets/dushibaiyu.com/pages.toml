title = "不如D：3)从输出hello说起 | 渡世白玉"
description = '此篇开始不如D系列正式开始D语言的一系列教程。本系列非系统性教程，对于一些基本概念和约定很多都不会介绍，而且地方会与其他语言对比。笔者设想的思路是从例子入手，面向有编程基础的人士，一篇处理一个例子，在解释例子的同时，引入D语言的一些特性介绍和使用教程。这就注定不会有完全整体的教程顺序和很详细的基础介绍。如果想完整的学习D语言，可以先把《D语言程序设计》(百度网盘下载) 这本书过一下（注：D语言发展很快，书中有的细节在最新编译器下已经有不适用的地方了。此书也比较基础，D的高级用法很多都未提及）。由于笔者没有经验和角度已经不完全新手新手，可能行文的顺序和侧重点比较乱。有不足之处还请评论指出。 Hello World 说到编程语言，开篇地一个教程例子，非hello world莫属。我们也就先学习和分析D中的hello world。 import std.stdio; int main() { writeln("Hello world!"); // 输出 Hello world 到控制台 return 0; } D 语言是基于模块的，所以第一句是先引入标准输入输出的模块。在书中的第11章，273页。官方文档链接：点我，点我 D语言是根据文件区分模块的。 对于模块的引用使用：import 关键字。默认是引入模块中所有有访问权限的模块，当然你也可以只引入个别符号，例如： import std.stdio : writeln; // 只引入writeln 函数， hello world 这个程序太简单了，我们就先了解下模块的概念。本文也就先写这么多吧。剩下我们根据特性，一个例子一个例子的去说明吧。 另外，中文版的D tour启动了翻译，希望有兴趣的可以去贡献： https://github.com/ExpertD/D-tour-Chinese 国内翻译群也在陆陆续续的翻译另外一本D的书，也欢迎贡献： https://github.com/DlangRen/Programming-in-D'
