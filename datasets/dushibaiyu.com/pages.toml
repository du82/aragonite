title = "和什么样的人在一起，就会有什么样的人生 | 渡世白玉"
description = "和勤奋的人在一起，您不会懒惰；和积极的人在一起，您不会消沉；与智者同行，你会不同凡响；与高人为伍，您能登上巅峰。 积极的人像太阳，照到哪里哪里亮；消极的人像月亮，初一十五都一样。 态度决定一切。有什么态度，就有什么样的未来；性格决定命运。有怎样的性格，就有怎样的人生。 生活中最不幸的是：由于您身边缺乏积极进取的人，缺少远见卓识的人，使您的人生变得平平庸庸，黯然失色。 如果您想聪明，那您就要和聪明的人在一起，您才会更加睿智；如果您想优秀，那您就要和优秀的人在一起，您才会出类拔萃。"
full_description = "和什么样的人在一起，就会有什么样的人生 和优秀的人在一起真的很重要，跟什么样的人就成为什么样的人！ 1、普通人的圈子，谈论的是闲事，赚的是工资，想的是明天。 2、生意人的圈子，谈论的是项目，赚的是利润，想的是下一年。 3、事业人的圈子，谈论的是机会，赚的是财富，想到的是未来和保障。 4、智慧人的圈子，谈论是给予，交流是的奉献，遵道而行，一切将会自然富足。 在现实生活中，您和谁在一起的确很重要，甚至能改变您的成长轨迹，决定您的人生成败。 和什么样的人在一起，就会有什么样的人生。 和勤奋的人在一起，您不会懒惰；和积极的人在一起，您不会消沉；与智者同行，你会不同凡响；与高人为伍，您能登上巅峰。 积极的人像太阳，照到哪里哪里亮；消极的人像月亮，初一十五都一样。 态度决定一切。有什么态度，就有什么样的未来；性格决定命运。有怎样的性格，就有怎样的人生。 生活中最不幸的是：由于您身边缺乏积极进取的人，缺少远见卓识的人，使您的人生变得平平庸庸，黯然失色。 如果您想聪明，那您就要和聪明的人在一起，您才会更加睿智；如果您想优秀，那您就要和优秀的人在一起，您才会出类拔萃。 读好书，交高人，乃人生两大幸事。 一个人的身份的高低，是由他周围围的朋友决定的。 朋友越多，意味着您的价值越高，对您的事业帮助越大。 朋友是您一生不可缺的宝贵财富。因为朋友的激励和相助，您才会战无不胜，一往无前。 人生的奥妙之处就在于与人相处，携手同行。 生活的美好之处则在于送人玫瑰，手留余香。 凡人六悟 1、心甘情愿吃亏的人，终究吃不了亏，能吃亏的人，人缘必然好，人缘好的人机会自然多，人的一生能抓住一两次关键机会，足矣！ 2、爱占便宜的人，终究占不了便宜，捡到一棵草，失去一片森林，你看那些一到买单就上厕所或钱包半天掏不出来的聪明人，基本上都没啥特别成就。 3、心眼小的人，天地大不了。朋友聚会时，三句话不离自己和自家的人，是蜗牛转世，内心空虚、自私。心里只有自家的事，其他的事慢慢也就与他无关。 4、只有惜缘才能续缘。在人生的路上我们会遇到很多人，其实：有缘才能相聚，亲人多半是前世的好友，好友多半是前世的亲人，给你带来烦恼的多半是你前世伤害过的。所以，一定要善待身边的亲人，关心身边的朋友，宽恕那些伤害你的人。也许，这就是因果。 5、心中无缺叫富，被人需要叫贵。快乐不是一种性格，而是一种能力。 6、笑看风云淡，坐看云起时，不争就是慈悲，不辩就是智慧，不闻就是清净，不看就是自在，原谅就是解脱，知足就是放下。 （来自/互联网，原作者不详） Author 渡世白玉Posted on 2014年9月12日2015年8月21日Categories 分享文字, 文字飘香Tags 优秀, 朋友"
