["https://www.dushibaiyu.com/2013/12/%e8%bf%99%e4%ba%9b%e5%b9%b4%ef%bc%8c%e4%bd%a0%e8%bf%87%e5%be%97%e6%80%8e%e4%b9%88%e6%a0%b7.html"]
title = "这些年，你过得怎么样——《我们如何走到这一步》序言 | 渡世白玉"
description = "我曾经想过，如果能时光穿梭，遇见从前的自己，是否可以和她做朋友。但我审慎的不敢发表意见。因为从前的自己是多么无知、狂妄，这件事是很清楚的。就算怀着再复杂的爱去回望，没准儿也能气个半死，看着她在那条傻乎乎的路上跌跌撞撞前行，忍不住开口相劝，搞不好还会被她厌弃。你看天下的事情往往都是一厢情愿。"
full_description = "这些年，你过得怎么样——《我们如何走到这一步》序言 这些年，你过得怎么样 我曾经想过，如果能时光穿梭，遇见从前的自己，是否可以和她做朋友。但我审慎的不敢发表意见。因为从前的自己是多么无知、狂妄，这件事是很清楚的。就算怀着再复杂的爱去回望，没准儿也能气个半死，看着她在那条傻乎乎的路上跌跌撞撞前行，忍不住开口相劝，搞不好还会被她厌弃。你看天下的事情往往都是一厢情愿。当然我也忍住了各种吐槽，人总是要给自己留余地的，因为还有一种可能是，未来的自己回望现在，看见的还是一个傻逼。好在现在不敢轻易放狠话了，所以总算显得比年轻的时候还有一分从容。 但不管什么时候的你，都是你。这时间轴上反复上演的就是打怪兽的过程。过去困扰你的事情，现在已可轻易解决，但往往还有更大的boss在前面等你。“人怎么可能没有烦恼呢。”无论是你初中毕业的那个午后，或者多年后功成名就那一天，总有不同忧伤涌上心头；有些烦恼是钱可以解决的，而更伤悲的是有些烦恼是钱解决不了的。我们曾经在年少时想象的“等到什么什么的时候就一切都好起来了”根本就是个谬论。所以，只能咬着牙继续朝前走吧。 我想说的是，到了一定年纪，很多事都会有变化。比如说，曾经的我，以为爱情真是天大的事儿，如今却觉得，要规划每件事在人生中的比例。和事业、亲情、自由比起来，它只占生命中一定的份额。这个份额内可以作生作死，但不应该浓度超标。比如说，我以前觉得爱情真是缠绵悱恻可以大书特书，并且在写了足够多的情感专栏之后认为自己也算看清楚了些什么，但现在我以时间给的历练认为这是件完全不可理喻的事儿，没有任何人敢说自己通透明白，在这件事前无论年纪或经历，都有可能分分钟打回原形变得幼稚茫然。还有，我不再相信“人应该如何如何”的这种话，一个人是不必坚持某种观点或原则的，尤其是在生活层面。因为昨天的你不是今天的你，夏天的你不是冬天的你，现在的你并不是多年前的你，一切都随着时间有变化，你怎么可以要求自己的一生一直按照某种不合时宜的需要展开呢。 所以人生命题从“怎么会这样”慢慢变成了“为什么会这样”——这是个看似相同的句子，但却是从无意识茫然的追问，变成了有意识冷静的剖析。举个例子，如果遇见了一段狗血的感情故事，以前我们都会冲上去劝当事人“这人是个混蛋，跟他分手”，如今却也能冷静的和朋友说“你要知道一件事的根源是什么，有何解决方案，然后根据你自己的感觉来决定”。听起来貌似更无聊的，但只有具备寻找事物本质的能力，才能让自己真的好过起来。而这其中最重要的一点就是：你必须要接受生命中的各种不完美。 我在这本书的封面上写了一句话：一想到人生如何走得这一步，水就从脚下涨了起来。有时回望来时路，也会心里一惊，大抵也就是这么一种感觉：我也曾是充满梦想好青年，如今是如何一步一步走进庸常人生变成面目模糊的现实主义者。有那么多无奈、妥协。不知不觉中，我们如何走到了当下这一步，是在哪个时刻遇见的拐点呢？这想起来真是让人心情激荡。所以，我现在感兴趣的，往往不是这一件事，那一件事，而是这件事发生的契机、因果、根源。就好像看星星已经不再是星星，你若仔细，可以看见天空中的轨迹。 关于爱情、美学、生活，我有很多话要说。值得庆幸的是，我感兴趣的事情越来越多，因此觉得这个世界还满好玩的。所以当这些年过去，我走到这一步再回头看，以前不明白的事越发清楚，而同样一件狗血故事能带来更多启发。所以我依然还在谈论着爱情、美、生活，只不过我希望是另一种眼光，另一种态度。人从来就不应该惧怕自己推翻自己，也许在未来的若干年，人生态度还能再次翻转也说不定。我的希望总是很渺小却难度很高的那种。比如说，当人问起你“这些年，你过得怎么样”的时候，能轻松的回答“还不错，蛮有意思的”。 写上一本书的时候，我曾在扉页上写“我们要学着和这个世界和解”。现在看来也是口气大了，这一生，我们先学会跟自己握手言和吧。想想，虽然未必肯和从前的自己做朋友，起码别让未来的自己太讨厌现在的你。 作者：庄雅婷 ：http://weibo.com/lome Author 渡世白玉Posted on 2013年12月26日2015年8月21日Categories 分享文字, 文字飘香Tags 我们, 时光倒流, 未来"
