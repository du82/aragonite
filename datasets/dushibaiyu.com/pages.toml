full_description = "关于 HTML5 的七个传说 来自：开源中国 正如 Opera 的布道者 Bruce Lawson 讲的那样，“每个人都在谈论 HTML5”，它被传的很神，很玄。事实上有很多人所说的 HTML5 实际上只是古老的 DHTML 或者 Ajax。把所有的信息混在一起就是一堆错误信息。 HTML5 简单的说就是一组新的标准，语法和规则用来创建网页，可以利用一些新的浏览器的“本地”功能，例如离线存储，多媒体播放和其他的交互等等。我们所看到的很 多很酷的 HTML5 网站实际上跟 HTML5 无关，而是由 CSS3 和 jQuery 生成的。CSS3 和 jQuery 是和 HTML5 一样的新技术，它们和 HTML5 是平行的概念。 这篇文章讲了关于 HTML5 的7个传说，也就是误解 ：） Continue reading “关于 HTML5 的七个传说” Author 渡世白玉Posted on 2012年3月29日Categories 编程设计Tags css, flash, html5, 神话Leave a comment on 关于 HTML5 的七个传说"
