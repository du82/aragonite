title = "不喧哗，自有声 | 渡世白玉"
description = "这个世界，什么都可以安排，唯独你的心。这个世界失去谁都不可怕不要紧，唯独失去了你自己。以后还有很漫长很漫长的道路，都要一个人走完，都是靠自己。凭借自己的能力去完成，这条道路，故事是昨天的瞬间，沿着长长的路，恍然如梦，到永远。"
full_description = "不喧哗，自有声 世界无边尘绕绕，众生无尽业茫茫。 01 今年的生日，我是在工作中度过的，上午在公司加班开会商讨新的广告案，中午赶往 电台录下一周的六档节目，傍晚又回到公司改文章、做最终企划，等到忙完才注意时间已经过了凌晨，打开手机看到许多未接来电和信息，很多朋友发来生日的祝 福，这时我才察觉，这一年的生日就在这样与平日无异的忙碌中，过去了。 公司空荡荡的没有人，只有我办公室的灯还亮着，长时间坐在电脑前肩膀酸疼，站起来的时候浑身骨头嘎嘣嘎嘣响，没有吃晚饭也不觉得饿，倒一杯水，站在办公室21层的落地窗前向下望。这个时候，自己的心里不同往日般的平静。 整 座城市都睡了，窗外远处的霓虹灯已经熄灭，只剩下星星点点的路灯在照亮夜归人的道路，世界安静得像是没有小朋友的幼儿园，但依然有人隐藏在这寂静的深处， 放肆地哭，放肆地笑，也有人会和我一样，在浓雾一般的夜色里，平静地望着这个仿佛与自己无关的世界，心里有一片化不开的深情。 人是很奇怪的动物，会随着周围的环境或是天气变化，比如晴天时会觉得开心，阴天会容易伤感，有阳光时会活泼好动乐此不疲，在夜晚时就会感觉孤独寂寞冷冷清清。 我 就是如此，有时在周末的上午慢慢醒来，如果阳光通过厚重的窗帘透出来，心里就会有希望，愉快地起床，清扫家里，写文字看书。但如果是阴天，就会懊恼地继续 把被子拉过头顶，一整天都可能赖在床上。这些在我们看来平常的事情，仿佛是内心的小把戏，用来蒙蔽自己，或是为一些行为找到一个适当的理由。 就 像此时此刻，夜晚中的路灯将黑暗戳出一个口子，照亮很小的范围，有人顺着光走去，但不久就会重新陷入黑暗中，我看着那些反反复复的光影，不禁哑然失笑，这 种矫情的细微察觉，像极了我们心情的起伏。那些黑暗，只有在遇到了下一个路灯，或者偶尔有一阵风吹来，才会漂浮不定，起起伏伏。 在生日已 经 过去的这个凌晨，我有一种豁然开朗的感觉，独自站在办公室俯视黑夜中的这座城市，和白天是完全不同的感觉。白天会觉得城市在脚下，或者无法融入这里，而到 了夜晚，更多的是感觉是城市就在心里，它犹如鬼魅一般刺破阻碍，伴着你生，伴着你死，伴着你到来，伴着你消失。 我曾经想象自己像现在这样站在这里，但此情此景，我却没有想象中那般的骄傲或是激动，因为我知道，无论在梦里在路上，总有一个时刻要醒来，也总有黎明在等待。 无论是一片坦途的光明，还是绝望寂静的黑暗，人总是不断向前走，你想到达到明天，那么此刻就不要停下脚步。 02 前几日在群里和几位朋友聊天，说到一些内心的话题，大家打趣说：远近就是一副心理医生的做派啊，内心好强大。我在电脑这头笑了，这个世界上哪里生来就强大的人，一切的一切不过是成长之后的领悟。我开玩笑告诉他们，没办法啊，这都是让社会逼出来的。大家深以为然。 曾 经我也做过许多荒唐的事情，为了让别人记住，为了和别人不一样，穿奇装异服，染奇怪颜色的头发，写不是自己想说但很特殊的文章，我一次又一次塑造着并非本 意但却不同的自己。如今我才懂得，真正改变自己的，或是所谓与别人不同的，并非是那些刻意为之的做作，而是这个世界给予自己的艰难。 初中 做 社会实践课，被安排在街头卖报纸，隆冬时节骑车去郊外的工厂搬运，然后拉到街头叫卖，一块钱一份，买三份送一包牛奶。已经忘记摔了多少跟头，也忘记那时到 底有多少辛苦，只记得那些来往行人异样的目光，还有就算是厚重大衣也无法遮住的寒冷，通红的鼻子和裂开的手背。晚上回家冷得说不出话，写实践日记时忍住不 让眼泪流下来。 大二时参加各种兼职，做了许多工作，各种各样奇怪的工种我都愿意尝试，在电器城外推销冰箱，举着旗子顺着街道展示新款手 机， 在各个路口给行人塞广告传单，很多同学都诧异我为什么要做这样辛苦的工作，赚不到多少钱，也没有实际的工作经验，我都只是笑笑说，提早感受一下生活的艰 难，才能知道以后的路要怎么走才会轻松。 大三开始在一家著名的传媒公司做兼职策划，现在电视上非常火热的一档娱乐节目，就是我曾经策划的雏 形，熬夜写栏目策划，安排通告，做各种的琐事，给正式的员工跑腿买东西，领导夸我办事认真又勤奋，我最初得意洋洋，但渐渐地我闻到了空气里变质的气味，而 当我最终被排挤离开公司时，我清晰地听到了身后放肆夸张的笑声，也清晰地听到了自己咬牙切齿的声音。 也曾经给一个摄影师做第二助理，深冬 的 夜晚陪他去酒店参加酒会，我穿着当时最好的衣服，却被他嫌弃丢在酒店门口不让进去，我就在寒风中最显眼的位置等了四个小时，没有带钱，穿的单薄，冷的浑身 发抖。后来同行的第一助理看我可怜，花了十三块给我买了一份牛腩盖饭，叮嘱我趁热吃。我蹲在酒店旁边的花池旁，就着冷风一口一口吃光了已经变凉的那顿晚 饭。 毕业时有一份很好的工作机会，在一家杂志社做市场执行，起薪5000元，在我的同学还没有找到工作或者薪资只有2000元时，我已经 把 他们甩在了后面。我把它看做是对这几年大学辛苦兼职的报答，一路过关斩将过了三试，人事部已经通知我周一上班，我在前一天高兴地请同学吃饭，就在大家觥筹 交错间我接到电话，通知我不用来了，已经有人替代了我。那个时候我清晰地听到了心里“咯噔”一声。 那时我百思不得其解，匆匆赶往公司，求 着 见随便一个负责人都好，可是前台的姐姐正眼都不看我就把我哄了出来。市场部的总监不忍心偷偷出来见我，在建外SOHO楼下请我咖啡，跟我说了很多事情，包 括我的工作，最后她说，你还是太年轻了，不谙世事，替代你的是公司最大投资老板的女儿，你又怎么能扛得过她？那时的自己听到这样的话，痛恨自己的无能，痛 恨这个世界的不公平。 工作一年后的我被上海的一家传媒公司挖去跳槽，工作顺利，人际关系也不错，但后来主编却找我谈话，说愿意给我机会让 我 去更大的地方发展。我当时信以为真，可后来我才知道主编已经在人前人后说尽了我的坏话，说我欺瞒公司接私活，说我随便要求涨薪资，说了那么多我从未做过的 事情。当时许多共同的好友从此和我断绝了来往，有部分人后来和我化解了误会，而有一些，却带着这样深深的误解，从此远离了我的生活。 还有很多，还有难以启齿的往事，那些都是我几乎不再提及的过往，在这样一个初春的子夜时分，在这个瞬间，在这座城市都隐秘在黑暗中时，他们仿佛死而复生，点燃了我心里最后的一点不堪。 我 曾经不断安慰自己，那些我们所经受的痛，都来源于我们深深的爱。有人感谢苦难伴随前行，因为它让你成长，让你变得坚强。但是，曾经的艰难却更多得让我不断 看清自己，有些事你当时遇到，未必会明白它的含义，但有些事在心里长久发酵后，才会呈现出不同的模样，一再地提醒自己。 我们的一天天，就 是 这么矛盾而复杂地过来了。曾经父亲对我说，你的人生可以选择，世界的一切也要接受，但你的内心不能改变。于是我学会了不去选择而去接受，在尚且年幼的时光 里，我把它叫做世界或者是天地，而在经历世事蜕变之后，当那些艰难让自己变得坚不可摧之后，我叫它——人间。 所谓的人间烟火，就是这样一个可以时而温暖时而冷漠的词语，所谓的人间，就是这样时而光明时而黑暗的时刻。 是的。它们附着在我们身体的周围，缱绻而来。 03 有朋友曾经忿忿地问我，有人误解你为什么不去解释？本属于你的东西被别人夺走为什么不去抢回来？你是傻子吗？也有朋友问我，为什么我努力了那么多，却没有人知道？为什么我做了那么多事情，却总有人不满意，我到底是哪里做得不够好？ 曾经我也是这样，我也羡慕别人的拥有，我也觉得自己不被理解，我也在乎别人的眼光和评价，我也尝试去报复和怨恨。我也会对自己说他算个什么东西，我也会用尽全力去证明我也可以。 有 人诋毁我就言辞激烈去辩驳，有人误解我就气急败坏去解释，有人不喜欢我就去质问到底为什么，有人辱骂我就用更加恶毒的语言去回敬。我也有许多黑暗的心里和 情绪，也曾在心里记恨一个人，也会恶毒诅咒这个社会，也会在面对高压力下无力。我的确做过许多现在看来无法理解的事情。 没错，我曾经活生生把自己变成了最讨厌的那种人。 这没有什么不敢承认的，我只有承认了过去不完美的自己，才能走向更加好的自我。一位前辈后来告诉我，不要这么着急，去学学心理学，看看佛经，读读古书，让自己平和下来，带着锋芒去行走，会刺痛到别人和自己，只有收敛起自己，才能发光。 在不断的学习和往内心探寻和自省之后，我终于明白，这个世界不会因为你的付出就必须给予回报，也不会因为你以怎样的方式对待别人，就要求他人同等对待你。人活在这世上，最难的就是保持一份谦卑和平和，而这份谦卑，来源于内心的真诚和踏实的努力。 所以，不要试图去解释这个世界上任何的误解和扭曲，存在的都是真理，任何人的成功，都不是虚头，他们一定付出了你没有想到的努力和代价，才华、机遇、运气、努力、外貌，甚至是不光彩的事情，都是存在，没什么值得怀疑。 每 个人都不是你所看到的那个样子，他们都是一边是长着翅膀纯洁善良的天使，一边是拿着夜叉面目狰狞的恶魔。他们心中的脆弱和胆小，他们不想承认的虚荣和懦 弱，都躲在了那些光鲜之下。他们也有潦倒的时候，他们也看过人间的疾苦，他们也会在选择前犹豫，他们也曾愚蠢地放弃机会，他们也在对自己的下属横眉冷对 时，突然想起曾经也有人这样对待过自己。 这么多年过去了，当我过上了自己想要的生活，在别人看来已经春风得意的自己，更要承认自我的卑微和浅薄，更要直面曾经自己的不堪，只有当你看到黑暗，努力冲破他它，才会进入新天新地，发现不一样的自己。 这个世界本就邋遢，所以没有什么可怕，每个人都有无法发泄的苦涩，都有无力排解的抑郁，而生活在这里的我们，哪一个不是拼尽全力，甚至不择手段地活着。 这 些年，我已经逐渐学会接受，接受意外，接受变故，接受误解，接受努力却暂时得不到回报，接受这个世界的残忍，接受我们身上的那些残缺。我们无法改变这个世 界，但依然选择不妥协，我还是让自己努力去爱，去为自己心中所想不顾一切。因为只有这样，我才能感觉真实，会快乐一些。 如果生命把本属于 我 的东西拿走，一定是认为我还没有足够的资格拥有它，如果有人会因为流言蜚语误解和诽谤自己，那么这样的人远离也是好事。是我的，终归是我的，不是我的，再 去争取也会灰飞烟灭。何必呢，还是默默在角落做好一个旁观者，顺其自然，随遇而安，好好过自己的生活。 如果生活伤害了你，也不要灰心，人生必经的道路必定是多磨难，但我们依然要按照自己的方式去经历、去感受、去接纳，为它曾经给予我们的那份优厚，为它曾经给予的泪水和温暖。 《开头与结尾》里写，真实人生中，我们往往在大势底定无可更改时才迟迟进场，却又在胜败未分的浑沌中提早离席。是啊，一切尚未尘埃落定成败不明，你又为什么心甘情愿做那个放弃的迷失者。 曾经我怀疑过，痛苦过，犹豫过。而现在，我选择原谅曾经，原谅了过去的自己，我学会把这一切，当做了成长。 懂的人始终都会懂，不懂的始终都会误会。这是我对朋友最后说的话。 04 当走过了曾经隐忍的年月再回首时，我才发现，曾经觉得难以启齿的往事，都不过是沧海一粟，生命给予我的，不是那些艰难，而是成长，是学会举重若轻，是将曾经无法释怀的那些过往，统统放下。 你要相信，你生命里遇到的每个人每件事，都有它的价值和意义，有些人教会你爱，有些事教会你成长，哪怕只是浅浅在你的路途中留下印记，也是一笔难能可贵的财富。至少在曾经某个时刻，你明白了生活，你懂得了自己。 这个世界如此热闹，网络上无数的人轮番轰炸，有人爱发图，有人爱段子，有人爱吐槽，有人爱自拍，他们活得热闹光彩，但也会有人和我一样，顺着自己生命的姿态在默默成长，他们或许与这个世界格格不入，他们或许不再接受关注，但请你记住，他们和你一样，都拥有向上的力量。 在 我不同的成长阶段，我对努力所到达到的高峰有不同的答案，现在我觉得，我们通过努力，是让被人真切感受到你的真诚，并且给予这份真诚一个默许的认可，而更 为重要的是通过努力，不让这个世界改变你的初心，人越长大，初心就显得格外珍贵，此时此刻，做这个世界里一个背光的人，是我想做的。 有人说要做一道光，有人说要面对光，但我却想做一个背光的人。自己如果发光，会照亮他人，但也会不小心迷失自己。如果面光而行，会灿烂光明，但也会因为耀眼看不清前方的道路。只有背对着光，才能够看清这个世界，才能把得失成败看透，才能看懂自己真正想要的是什么。 我想起现在很火热的一句话：这样的努力，是因为不想和大多数人一样。这样的正能量凸显出个体的存在和特别。但我却不是这样的看法。我对朋友说，我之所以今天努力，是为了和曾经的自己一样。 曾经的自己拼尽全力在路上，为了自己心中的梦想而活，曾经的自己咬紧牙关勇敢坚强，为了自己所想的生活而活。而我今天的继续远行，是为了不辜负曾经的自己，是为了做和曾经一样努力的自己，是为了对得起曾经的那份隐忍和坚持。 这个世界，什么都可以安排，唯独你的心。这个世界失去谁都不可怕不要紧，唯独失去了你自己。以后还有很漫长很漫长的道路，都要一个人走完，都是靠自己。凭借自己的能力去完成，这条道路，故事是昨天的瞬间，沿着长长的路，恍然如梦，到永远。 如果开始没有认真考虑如何走下去，那么就继续顺着内心的道路，做那个对自己慷慨义无反顾的流浪者，让每一个想扮演自己的人，都尽兴。 这座城市已经渐渐苏醒，白光占据了城市里每一个角落，没有人会想到在曾经的黑暗里，有人写下一些话语，告别了曾经的时光，也有人在无人的黑暗中满怀一颗感恩的心。这个世界，总有人以你没有想过的方式活着，也总有人为了自我的成长背光而行。 一 个难得晴朗的清晨，工作了一夜的我开车前往回家的路上，无数人正在上班的途中。他们和曾经的我无异，也和现在的我相同，他们上班的路那么拥堵，而我背道而 驰，却难得的顺畅。我挤过人群，留下空白，我为自己的未来填补出不同的色彩，我在自己生日的第二天，在新的纪年里，默默告诉自己，要做一个依然有担当的 人。 这份担当在今日又化为了空白的信笺，要写下什么，留下什么，请自便，请随意，但别忘记。别把一切想的都特别的不得了，别以为所有的目光都聚在你身上，别用你的尺子去衡量这世界，这样你会觉得生活也挺好。 我想起了曾经一个广告中的文案，在最后送给看到这里的你，永远不要忘记自己出发时的决心，也不要忘记曾经这时节里的每一个自己，要做不忘初心内心安静的自己—— 这个时代，每个人都在大声说话，每个人都在争分夺秒。我们用最快的速度站上高度，但是也在瞬间失去态度，当喇叭声遮盖了引擎声，我们早已忘记，谦谦之道才是君子之道。你问我这个时代需要什么，在别人喧嚣的时候安静，在众人安静的时候发声。 不喧哗，自有声。 （文/这么远那么近；来自/阅读时间） Author 渡世白玉Posted on 2014年4月26日2015年8月21日Categories 分享文字, 文字飘香Tags 内心, 喧哗, 谦逊"
