full_description = "观《蝴蝶效应》 纵使微小如蝴蝶鼓翼，在千里之外也会形成飓风！ 今天没事看了《蝴蝶效应》这部电影，很好的一部影片值得一看！ 看后思想久久不可平静，特写此博文记下思想的碎片···· 1.纵使微小如蝴蝶鼓翼，在千里之外也会形成飓风！——开始的一句话 “差之毫厘，失之千里”！提醒我们防微杜渐，看似一些极微小的事情却有可能造成集体内部的分崩离析。 2.影片中的凯丽和儿子汤米从小就生活在一种压抑的环境中，性格扭曲，特别是汤米，基本就是个魔鬼。 一个人的环境决定其性格啊，性格确定命运，一个良好的成长环境是多么重要啊！ 3.埃文几次回到过去，都又重新选择回去。 后悔是一个人的一生中很大的错误！主人公欲借回到过去去挽回自己现在的悔恨，多次的回去都又造成新的悔恨。我们呢？我们没有所谓的回到过去重来的能力，我们后悔自己曾做错的事，想着要是当时选择哪个该多好。如果让我们能重新选择呢？我们还会造成新的悔恨！所以我认为后悔是一种心态，不是必然的！如果我们能释怀，就没有后悔！！！ 4.主人公最后明白了，选择回到开端，结束了自己的生命！ 不后悔需要一种明慧，一种放下。主人公再几次的穿越中没有做到，就选择了没有这个生命的存在！ 人生是不可能尽善尽美的，我们要有豁达的心胸，放开的心态去面对，这样才能幸福的生活。否则你会活在无尽的不满，自责，责他的怨恨的世界中····· ······ Author 渡世白玉Posted on 2012年3月24日Categories 文字飘香, 随笔Tags 放下, 蝴蝶效应, 过去"
