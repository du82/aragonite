full_description = "鲍鹏山新说《水浒》经典语录精选之宋江 ① 侠义江湖 501、说到《水浒传》，最难评价的是宋江。因为，他是一个非常矛盾的人：你说他真心待人，他却又时时显示虚伪做作；你说他义薄云天，他却又心机重重城府极深；你说他处心积虑谋反， Continue reading “鲍鹏山新说《水浒》经典语录精选之宋江” Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Leave a comment on 鲍鹏山新说《水浒》经典语录精选之宋江 鲍鹏山新说《水浒》经典语录精选之鲁智深 ① 搭救金翠莲 381、既然《水浒传》的作者不认真，我们又何苦那么认真，他就是一部小说，只要其中的人物、事件符合艺术真实，不影响我们欣赏，就可以了。 Continue reading “鲍鹏山新说《水浒》经典语录精选之鲁智深” Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Leave a comment on 鲍鹏山新说《水浒》经典语录精选之鲁智深 鲍鹏山新说《水浒》经典语录精选之李逵 ① 初见宋江 303、《水浒》中，真有性情、气质、形状和声口的，大概也就十来个人。这已经很不简单，足以使《水浒传》成为伟大的小说。而在这十来个人中，李逵是其中一个，而且非常独特。他是这个成人世界里的孩子。举凡孩子的天真、单纯以及胡闹闯祸、没准头、欠缺是非判断力，他都有。 Continue reading “鲍鹏山新说《水浒》经典语录精选之李逵” Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Leave a comment on 鲍鹏山新说《水浒》经典语录精选之李逵 鲍鹏山新说《水浒》经典语录精选之武松 ① 怒虎神人 176、武松的一大特点，就是好吹牛，好显摆，好炫耀，好逞能。 177、走夜路的人，往往吹口哨，不是不怕，恰恰是因为怕。 178、一个人要鼓励自己有所作为、有所建树， Continue reading “鲍鹏山新说《水浒》经典语录精选之武松” Author 渡世白玉Posted on 2013年6月3日2015年8月21日Categories 分享文字, 文字飘香Leave a comment on 鲍鹏山新说《水浒》经典语录精选之武松"
