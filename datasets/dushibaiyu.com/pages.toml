description = "所有的 RPM 包都是从镜像获得的，所有的 metadata（元数据）都是从主镜像（位于德国）获得的（感谢 zenzhong8383 的火力侦察），所以你源刷新的慢，只能证明你被我们光荣伟大的放火长城拖住了，而不能证明 openSUSE 项目有错，也代表不了你下载 RPM 包时的速度。"
full_description = "OpenSUSE源的刷新和下载 用OpenSUSE我是喜欢直接默认官方源，下载速度是刚刚的，但是软件源的刷新倒是爱出问题，最常见的是刷新时需要下载几K到几十K的的东东很慢而且爱断，下载几十M到几百M的包却是速度能达到网络的正常或者最大速度，今天在论坛看到marguerite女王的解答才了解原因，附上： 总有人在各种场合问这个。所以统一做一下解答。 我们官方的态度是不鼓励直接使用镜像的。 因为比起「其它」发行版（好吧，我又在破坏 Linux 中文圈的安定团结、秀优越感了，但事实如此），我们 openSUSE 的技术力量比较强（或者说我们吃饱了没事干的人太多），开发了两个东西。 一个叫做 Metalink，意思是这个格式（BT、Megalink 磁力链一样的格式）可以自动从 BT/FTP/HTTP 同时下载。http://en.opensuse.org/SDB:Metalink 另一个叫做 MirrorBrain，意思是我把所有的镜像地址隐藏起来，只暴露出一个中央服务器，所有人只需使用这个中央服务器（download.opensuse.org），它会根据你的 IP 地理位置为你分配一个离你最近的镜像，但是在你那边显示的依旧是来自 download.opensuse.org。而如何分配是根据镜像管理员和中央服务器管理员当初的协定来确定的，比如镜像每月能够承受的流量、所愿意扮演的角色（是区域中心、地标式的镜像比如北交大、中科大，还是小镜像）等。 如果你是一名光荣的 Qt 开发者，那你应该早就有所感觉了，因为 Qt 项目的下载就是用的我们开发的 MirrorBrain 技术。 https://zh.opensuse.org/MirrorBrain 而根据 openSUSE 软件源的构造，所有的 RPM 包都是从镜像获得的，所有的 metadata（元数据）都是从主镜像（位于德国）获得的（感谢 zenzhong8383 的火力侦察），所以你源刷新的慢，只能证明你被我们光荣伟大的放火长城拖住了，而不能证明 openSUSE 项目有错，也代表不了你下载 RPM 包时的速度。 所以你可以选择： 0. 常见的科学上网手法。但是这样做比较浪费，因为我墙是大小姐脾气，时撞时不撞。 1. 关掉自动刷新，用 cron 定时刷新或 sudo zypper ref 手动刷新，这样就避免了「越着急越装不上软件」的窘境（具体教学论坛里就有，多搜索），因为这时的流量都是来自国内。 2. 使用镜像，这样完全不添加 download.opensuse.org 就不会从德国下东西了。具体选择哪一种就看你究竟是刷新慢还是下载慢了。使用镜像也不是没有缺点的：1. 镜像有延迟，6 个小时; 2. 镜像不能面面俱到，比如你添加 home:opensuse_zh 源，OBS home 源是很少有镜像的，单一源慢一样让你改用了镜像都感觉不出来快。3. 这个帖子让我意识到，有些人是镜像源也加，主源也加，完全不知道镜像是什么意思（它们的内容是相同的），所以加了镜像刷新依然不会快，因为你主源还开着。所以特意说明下，使用镜像这种方法是非黑即白的，你要用镜像所有启用了刷新的源都要用镜像，不然没有意义。4. 镜像是没有容错能力的，也就是说比如你用北交大镜像，每次开十几大他们学校都会封外网，那你隔几年的三月份就无法使用一次。 另外前面说过了，自动根据 IP 地理位置分配的原理一是 IP 的真实地理位置，你挂 VPS 慢了别怪别人; 二是人家有协定。所以有时候你下载 RPM 慢非常有可能是你被中转到了地理位置较远的服务器，但理论上这恰好证明了离你较近的镜像现在没有能力服务你（过载了或无法访问）。 但在国内这个情况很乱：把自己申报为官方镜像的镜像太少，只有：北交、中科大、搜狐、华中科大。地下源太多了，比如清华、网易、浙大这些都没有申报官方镜像。所以明明有近的给你中转到远的非常正常，因为中央服务器不知道有近的。 为了排除镜像管理员不知道如何申报自己为官方镜像的问题，做一下说明（如果你的镜像就是比如服务 20 个人左右的校内小镜像，那么请不要申报为官方镜像，也不要在这里公开，我们针对的是准备好成为官方注册镜像的镜像）： 请看： http://zh.opensuse.org/openSUSE:%E9%95% … 3%E6%9E%84 http://zh.opensuse.org/Category:%E9%95%9C%E5%83%8F 来了解 openSUSE 镜像。 成为官方注册镜像的好处是，你能够从预演服务器上同步而不用从其它镜像同步（你是二级镜像而不是一级镜像），从主镜像同步也不会有限制（只提供 50 个连接，超过自动断开）。 解答来自OpenSUSE中文社区，点击访问原帖 ，marguerite女王解答 Author 渡世白玉Posted on 2014年2月15日2015年8月21日Categories LinuxTags opensuse, 源刷新, 速度"
