full_description = "我害怕找不到一种自己喜欢的方式度过人生 Ps：人最难的就是直面人生，直面生活。有时看似简单，人人可做，却又恰恰是最难，谁也几乎都没做到。我也一直在探索，也曾豪情万丈，也曾想不存在也是最好，只是一直未曾找到结果。我一直还没认清自己的生活，有时，不！是大多数时候也在逃避自己的生活。至于热爱生活，更是做不到的。为什么活着，你活着所之为何，你也曾探寻，但未曾找到答案。也曾逃避不想，但是静下面对自己却又避无可避。今日，精读上看到此文，认真读了几遍，若有所得，却有因本人愚钝，无法言语描清，遂全文转载过来。 下面正文： Continue reading “我害怕找不到一种自己喜欢的方式度过人生” Author 渡世白玉Posted on 2014年10月22日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 意义, 生活7 Comments on 我害怕找不到一种自己喜欢的方式度过人生"
