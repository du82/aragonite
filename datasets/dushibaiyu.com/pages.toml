full_description = "为什么我们缺少特立独行的人生态度 Ps：任何在无条件下有绝对是非观的事或书都是洗脑·····国人几人没被洗脑呢？ 一、 不久以前，我们去看一位从美国回上海探亲的朋友。这位和我从小一起长大的朋友二十年前赴美国留学，他谈到多年以来在美国生活，感触最深的是，在美国的中国 人的生活追求，与西方人相比，有一个相当大的区别，那就是旅美中国人无论事业成功与否，无论属于哪一个阶层，似乎都非常重视物质生活方面的追求，只要中国 人在一起，无论是台湾人、香港人、大陆人还是多年旅居美国的华侨， Continue reading “为什么我们缺少特立独行的人生态度” Author 渡世白玉Posted on 2014年3月9日2015年8月21日Categories 分享文字, 文字飘香Tags 人生, 态度, 独立11 Comments on 为什么我们缺少特立独行的人生态度"
