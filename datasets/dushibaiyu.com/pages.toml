full_description = "为QNetworkAccessManager添加超时提醒 在做更新，在测试异常的时候，在下载过程中，发现如果直接系统禁用了网络，会报错误，可以捕获。但是如果是第三方软件限制程序联网，问题来了。 程序会一直在那里等待，没有异常，也不发送QNetworkAccessManager::finsh和QNetworkReply::error和QNetworkReply::finsh信号。 所以动念头为下载加个超时，但是QNetworkAccessManager，QNetworkReply和QNetworkRequest都没有相关的设置函数。其实仔细想一下，也没有办法直接提供超时，因为下载的文件有大有小，网络有快有慢，什么才算超时呢。 Continue reading “为QNetworkAccessManager添加超时提醒” Author 渡世白玉Posted on 2014年10月27日2015年8月21日Categories C/C++, Qt, 编程设计Tags QNetworkAccessManager, TimeOut, 下载, 超时25 Comments on 为QNetworkAccessManager添加超时提醒"
