full_description = "Linux是老婆，Windows是妓女 1.首先，linux是免费的，和老婆上床当然不用要钱，妓女和windows都是要money的啊。 2.linux入门比较难，就象你当初追你老婆的那些日子，痛并快乐着。windows？傻子都会用，就象妓女，给钱就可以了，即使你阳痿她还可以用嘴哦，当然你得多付钱才可以。 3.linux稳定，几乎不会传染病毒给你，windows么？还要带安全套－－防毒软件才可以。 4.虽然linux可以帮你完成绝大部分事情，但偶尔你想happy一下的时候还得找windows。linux下的游戏似乎差一些，就象你偶尔想找点儿刺激的话，只好花钱找小姐了。 如果你实在不愿意找小姐，又想享受刺激的话可以用wine，酒精会让你老婆更激情，但感觉似乎还是不如职业小姐。让你老婆喝这么多酒也不是一件容易的事，wine的配置很麻烦哦。 5.一些新奇硬件软件都是最先支持windows的，但如果真的是好东东的话，最终linux也会支持。世面上比较新的器械和流行的体位都是妓女们的卖点，随着时代的发展，夫妻之间也会慢慢接受这些的。 转自：互联网 Author 渡世白玉Posted on 2012年4月13日Categories LinuxTags linux, windows18 Comments on Linux是老婆，Windows是妓女"
