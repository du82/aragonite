["http://dvclub.org/about-dvclub"]
title = "Design Verification Club"
full_description = "DVClub was founded by Eric Hennenhoefer, with financial support from Cadence in 2005. Today Eric is VP R&D at ARM. ARM is a Diamond level Sponsor of DVClub in North America. In the summer of 2014, key members of Paradigm Works, Michael Hoyt, CEO, Jim Crocker VP Engineering, and Kelly Larson, Chief Verification Technologist volunteered to head up DVClub in North America. Eric agreed to let the Paradigm Works folks take the lead, and our community has continued to thrive ever since. DVClub is designed to provide regular meeting opportunities, geographically dispersed, for technical education, in the domain of functional verification and design. DVClub membership is free and is open to all non-service provider semiconductor professionals. Most members work in verification, but there are also plenty of entrepreneurs, professors, students, managers, investors, and even design engineers who attend. Participation by service providers (solicitors) is limited to event sponsors, who supply the funds for DVClub events. DVClub events are free to attend, thanks to the financial support of our Sponsors. The large majority of attendees are professional verification engineers wanting to stay up to date on the latest verification and design technology and methodologies, while networking with their peers. DVClub is also regularly frequented by design engineers, engineering managers, entrepreneurs, students and faculty, and Sponsor personnel. Attendance at events in cities like Portland, Fort Collins, and RTP typically have 35-50 attendees, Boston double that, while Austin and San Jose enjoy audiences of 130-185 people on a regular basis.. Kelly Larson, who gave a technical presentation at the very first DVClub event in Austin, Texas, and is now an Autopilot Verification Engineer at Tesla, continues to emcee our flagship event in Austin, and also in Fort Collins. Michael Hoyt heads up all the other event location from San Jose, Boston, RTP, Portland, to Toronto, and other upcoming locations. Jim Crocker directs communications, and operations. Helen Cressy is DVClub administrator, supporting venue management, bookings, and registration. DVClub also greatly benefits from the support of volunteers in each of the geographies. Our volunteers help promote the DVClub charter, spread the word about upcoming events, and help enlist members who present technical papers at our events."
year_published = 2025
clearnet = "http://dvclub.org/about-dvclub"
