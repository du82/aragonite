title = "Design Verification Club"
full_description = "Paradigm Works® is an industry recognized provider of Chip Development Consulting Services, VIP, and EDA Free Open Source Software (EDA FOSS). Paradigm Works Services, VIP, and EDA FOSS help to reduce development costs, quicken time-to-revenue, and minimize schedule risk for leading semiconductor and electronic systems companies worldwide. Paradigm Works is headquartered in North Andover, Massachusetts with offices in Austin, San Jose, and Mumbai."
