["https://dvcon.org/hotel-travel/avoid-hotel-fraud"]
title = "Avoid Hotel Fraud | DVCON 2025"
description = "The Design & Verification Conference & Exhibition (DVCON 2025) is the premier conference on the application of languages, tools, methodologies and standards for the design and verification of electronic systems and integrated circuits."
full_description = "Hotel fraud can take various forms, from fake bookings to hidden charges. Scammers target exhibitors and attendees to solicit bookings at unauthorized hotels. Unscrupulous third parties are increasingly trying to defraud conference participants. Exhibitors and attendees can fall prey to accommodation offers from fraudulent companies.The good news is scammers often follow the same patterns and use similar tactics. There are ways to protect yourself from these frauds, and the first step is knowing how to identify them.Read below for tips on how to identify fraudulent offers and common scams. Fraudulent companies repeatedly contact (either by phone or email) our event participants with room offers for the week of March 4. Their website, calls, and/or emails mention DVCon U.S., and may even include our logo in the hopes of looking like an official or legitimate provider.Be advised that no legitimate representative of DVCon U.S. will ever solicit your credit card information via phone, email, or any other form of communication to secure hotel reservations.These third-party groups promote attractive deals with local accommodation providers, but once payment has been received, the company disappears and can no longer be contacted by phone or email. Once the attendee contacts the hotel directly about their room, they realize the hotel has no record of them or their stay. Not only is their money gone, but they must also then scramble to find last-minute accommodation, which is rarely convenient to the venue.This practice takes money directly from our participants and negatively impacts their DVCon U.S. experience. If the offer is too good to be true, it probably is. Scammers often lure participants with incredibly low rates that are far below the market price, beware.Book through our recommended/official hotel. We work to deliver consistently good hotel options for our participants.Do not only rely on the presence of the DVCon U.S. name and logo on accommodation providers’ websites, as our name and logo are being used unlawfully. The only accommodation company recommended by DVCon U.S. is allowed to use our name and logo.If using another supplier, thoroughly investigate all documentation regarding the company making the offer. Check carefully online to make sure they’re a reputable supplier with a history of satisfied, actual customers before sending any funds.Use credit cards to guarantee your rooms, rather than wire transfers. If your supplier turns out to be fraudulent, credit cards typically offer some form of consumer protection, whereas wire transfers do not."
author = "Conference Catalysts, LLC."
year_published = 2024
year_updated = 2024
