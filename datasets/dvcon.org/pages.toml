["https://dvcon.org/authors/call-for-extended-abstracts"]
title = "Call for Extended Abstracts | DVCON 2025"
description = "The Design & Verification Conference & Exhibition (DVCON 2025) is the premier conference on the application of languages, tools, methodologies and standards for the design and verification of electronic systems and integrated circuits."
full_description = "The Design & Verification Conference is looking for submissions for the in-person 2025 Conference and Exhibition. This conference focuses on the practical aspects of design and verification of electronic systems and integrated circuits. This could be applications of languages, tools, methodologies, and/or standards. This could be your chance to help the industry we are all a part of. Please see below for more details.DVCon honors the Sutherland Best Paper and Best Poster submissions. The awards will be selected by the attendees at DVCon, based on the quality of both the paper and the presentation. Extensions will not be provided at any point during the submission process. If the guidelines/deadlines are not followed, DVCon will remove your submission.By submitting this proposal, you are committing to personally attend the conference and deliver the material if it is accepted. Should you be unable to attend in person, it is required that you give a minimum of 4 weeks’ notice before the conference begins to enable the technical committee time to arrange a replacement. Failure to provide adequate notice will result in your inability to propose a paper for the next two years.Click Track 1 to submit an extended abstract! SubmissionsALL submissions must be made online from this website.Email submissions will NOT be accepted.If you need to edit any author information or resubmit your abstract, it may be done up until the submission deadline.Document Specifications Use our templates to meet the formatting requirements below. Your abstract must comply with the following specifications:Abstract Length: a minimum of 600 words, a maximum of 1200 words (approximately 2 pages, not including diagrams, figures, or tables)Full Paper Length: 6-8 pages Paper Size: US Letter (8.5″ x 11″)Fonts: Embed ALL fonts in your PDF file. Avoid the use of Type 3 fonts.File Format: Adobe PDF (.pdf)Allowed File Size: 5.0MBDo NOT page number your abstractDo NOT apply security settings to your PDF file.Note: Deviations from the above abstract specifications could impede the review of your abstract and result in rejection.For your convenience, the paper templates are available through the following links:Abstract Submission Template Do NOT include author information MS Word Template fileClick here to download the MS Word Template file.Click here to download the PDF Template file.Font Embedding:It is strongly recommended that you EMBED ALL FONTS (including system fonts) when producing your PDF file. By default, most programs that create a PDF will not embed system fonts, unless you specifically configure it to do so."
