["https://dvcon.org/authors/speaker-resources-and-guidelines"]
title = "Speaker Resources and Guidelines | DVCON 2025"
description = "The Design & Verification Conference & Exhibition (DVCON 2025) is the premier conference on the application of languages, tools, methodologies and standards for the design and verification of electronic systems and integrated circuits."
full_description = "Full Paper GuidelinesUse our templates to meet the formatting requirements below. Your paper must comply with the following specifications:Paper Length: Approximately 8 pagesPaper Size: US Letter (8.5″ x 11″)Fonts: Embed ALL fonts in your PDF file. Avoid the use of Type 3 fonts.File Format: Adobe PDF (.pdf)Allowed File Size: 5.0MBDo NOT page number your paperDo NOT apply security settings to your PDF file.Note: Deviations from the above paper specifications could impede the review of your paper and result in rejection. Presentation TemplatesPlease use the following templates to prepare your presentation for DVCon U.S.Templates are required for accepted authors (Lecture/Poster).Templates are optional for accepted workshop/tutorial presentations.If speakers use the DVCon U.S. template, please embed your corporate logo on each slide. If speakers use a corporate template, the DVCon U.S. logo must be embedded on each slide. Guidelines For Paper PresentationsDVCon U.S. template should be used for all presentations (see template link above)Supported formats are .pdf, .ppt, .pptx or .mp4Please do not change the footer text except for the page number.Company/ or university name and/or logo may only appear on the title (first slide) page.Offer your slides in the format of a pre-recorded presentation, including embedded voice-over and slide show timings.Guidelines For PostersDVCon U.S. template should be used for all posters (see template link above)The recommended poster format is portrait A0 (84.1 cm wide x 118.9 cm height). Double-sided adhesive tape and/or pins will be available in the poster area to put the posters on the panels. Authors are required to print their own poster and are responsible for hanging up their poster before the start of the session and of removing them after the session end.Please do not change the header and footer text.Company/ or university name and/or logo may only appear at the bottom of the poster.Offer your poster in the format of a pre-recorded presentation, including an embedded voice-over.Presentation Time AllotmentThe presentation format (oral or poster) will be announced on January 21st. Please note that specific sessions and time slots can not be guaranteed. Accepted Paper (Lecture)20-25 minutes (+5 min live Q&A)Accepted Paper (Poster)Full Length of Session (recordings will be 5 minutes)Accepted Tutorial3 hour Session Accepted Workshop1.5 hour SessionPre-recorded PresentationsAll authors at DVCon U.S. should deliver the slides as pre-recorded sessions.NOTE:Please contact the chair of your session (i.e. technical program chair, tutorial chair, or poster chair) on the exact length of your recording and deadline for the submission.Speaker PolicyAll speakers are expected to present in person.If the presenter can’t present in person, the speaker is responsible for finding an alternative speaker that can present in person (should be a co-author).If no co-authors can present in person and thus an alternative speaker can not be found, then it is up to the committee to determine if the presentation will remain in the program.Consequences for withdrawing an accepted paper may include, but are not limited to, a ban on submissions to DVCon U.S. for a period of three (3) years from the date of withdrawal. The presentation format (oral or poster) will be announced on January 17th. Please note that specific sessions and time slots can not be guaranteed.Pre-recorded videos will NOT be played onsite. The pre-recorded videos are for quality assurance purposes, for the Accellera archives, and/or in the case that DVCon U.S. moves virtual.Pre-recorded videos are required for all authors.Pre-recorded videos are optional for tutorials, workshops, and panel speakers."
