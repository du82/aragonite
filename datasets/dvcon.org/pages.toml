["https://dvcon.org/authors/tutorial-workshop-submissions"]
title = "Call for Tutorials/Workshops | DVCON 2025"
description = "The Design & Verification Conference & Exhibition (DVCON 2025) is the premier conference on the application of languages, tools, methodologies and standards for the design and verification of electronic systems and integrated circuits."
full_description = "DVCon is the premier conference on the application of languages, tools, and methodologies for the design and verification of electronic systems and integrated circuits. The focus of the conference is the usage of specialized design and verification languages such as SystemVerilog, Verilog, VHDL, PSS, SystemC, and e, as well as general-purpose languages such as C, C++, Python, PERL, and Tcl. Tools and methodologies include the use of machine learning, open-source software, hardware and architecture, testbench automation, hardware-assisted verification, hardware/software co-verification, formal verification, functional safety and security, transaction-level system design, high-level synthesis, low-power design techniques, 3D chip designs, IP-based SoC design methods, reference flows, and AMS design and verification. DVCon offers short workshops and tutorials to encourage greater sponsorship participation from companies and exhibitors, especially smaller organizations at an affordable level. DVCon is a highly targeted venue for engineers addressing major design and verification issues. Submit proposals by the extended deadline of September 20th. Submit Now! Submission ALL submissions must be made online from this website.Email submissions will NOT be accepted.If you need to edit any author information or resubmit your abstract, it may be done up until the submission deadline.Submission Specifications Input your submission title for the proposed tutorial/workshopUpload a summary of your submission (50-1000 words). This is typically the introductory paragraph from your submission.Input the Speaker(s) information including name, organization, email, etc. Copyright FormTo publish your paper in the proceedings, we must receive your copyright form NO LATER THAN: January 6, 2025, 23:59 (GMT -0700)Upload a scanned copy (PDF format) of the completed copyright form using the Upload File link on the submission page.PDF Copyright FormFill in the TITLE of the paper.Fill in ALL author names.NOTE: Please input the Title, Author & Paper ID info directly in Acrobat BEFORE printing the form.SIGN the form.Remember, without the copyright form we can NOT include your paper in the proceedings!Speaker PolicyAll speakers are expected to present in person.If the presenter can’t present in person, the speaker is responsible for finding an alternative speaker who can present in person (should be a co-author).If no co-authors can present in person and thus an alternative speaker can not be found, then it is up to the committee to determine if the presentation will remain in the program.Pre-recorded videos will NOT be played onsite. The pre-recorded videos are for quality assurance purposes, for the Accellera archives, and/or in the case that DVCon U.S. moves virtual.Pre-recorded videos are required for all authors.Pre-recorded videos are optional for tutorials, workshops, and panel speakers."
