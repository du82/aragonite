title = "DWARF Issue: Allow DW_FORM_strp_sup in .debug_line vendor defined content descriptions"
full_description = "Issue 180426.1: Allow DW_FORM_strp_sup in .debug_line vendor defined content descriptions Author: Mark Wielaard Champion: Mark Wielaard Date submitted: 2018-04-26 Date revised: Date closed: 2021-10-04 Type: Ambiguity Status: Accepted DWARF version: 6 Section 6.2.4.2, pg 159 Add DW_FORM_strp_sup to the list of allowed form in section 6.2.4.2 on page 159. Section 6.2.4.1 allows DW_LNCT_path to be paired with DW_FORM_strp_sup, but DW_FORM_strp_sup is not in the list of allowed forms for vendor defined line descriptions in 6.2.4.2. This seems inconsistent. It is also inconsistent with the forms allowed to be used for vendor defined macro descriptions (the list of forms is identical, except for DW_FORM_strp_sup). -- 2021-10-04: Accepted."
