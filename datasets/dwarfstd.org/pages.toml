full_description = "Issue 181223.2: Adopt Microsoft's Symbol Server Key concept for elf and sym files Author: Jordan Frost Champion: Michael Eager Date submitted: 2018-12-23 Date revised: Date closed: 2022-10-31 Type: Enhancement Status: Rejected DWARF version: 6 Section , pg Microsoft has a symbol server protocol that is trivial to implement and they have published a specification for ELF files and their sym files as well. Please look here. https://github.com/dotnet/symstore/blob/master/docs/specs/SSQP_Key_Conventions.md#elf-buildid This will allow debuggers to download the ELF and SYM files based on the buildid. If GCC implements this we will bring modern development and debugging to the Linux platform as well. -- 2022-10-31: Rejected Issues related to object or executable files (eg., ELF files) are out of scope for the DWARF standard."
