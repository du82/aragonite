title = "DWARF Public Comments"
full_description = "Public Comments The DWARF Committee invites comments from the public about the DWARF Version 5 Standard. Comments may range from grammatical or editorial notes, to requests for clarification, to suggestions for modifications to the standard. Please send comments to the dwarf-discuss mailing list. Please provide the section number, page number, and type of comment in your email. The type of comment can be: Editorial — comments about typos, grammar, wording, etc. Error — comments about anything which appears to be incorrect. Ambiguity — parts of the standard which appear inconsisent. Improvement — suggestions for better ways to describe DWARF. Clarification — requests or proposals for clarification about the standard. Enhancement — suggestions or proposals for future support in DWARF. Other — anything else. Guidelines for Writing Proposals Please keep in mind the following guidelines when submitting proposals: Each proposal should be about a single topic. Please do not combine unrelated changes in a single proposal. (Changes are unrelated if they have no interactions or dependencies.) The title of the proposal should be specific and descriptive. Avoid vague language such as “Extensions,” “Improvements,” or “Clarifications.” Keep proposals as short as possible. (Of the current proposals, only two are over two hundred lines and the overwhelming majority are under one hundred lines.) Please see the sample template for proposals that reflects some of the best practices we have observed. Following this template will help the committee understand your proposal. Proposals for a change to the DWARF Standard will be assigned an issue number, and will be reviewed by the committee. The proposal may be assigned a champion on the committee who may contact the original author for additional information or background. When the committee has decided to accept or reject the proposal, we will report the decision to the original author, and it will be listed on the Current Issues page. For more information about the life of a proposal, see the Procedures page. Terms and Conditions In submitting a comment or a proposal to the committee, you agree to the following terms and conditions: You retain copyright to the contents of your submission, but agree to license it according to the terms of the Creative Commons Attribution 4.0 International License, as noted at the bottom of this page. The DWARF Committee (and any successor) is granted the right to copy, modify, or adapt the submission for inclusion in the DWARF Standard, or on the web site or wiki, without limitation or additional notice. You grant to the DWARF Committee, and any other party who may obtain the submission from the DWARF Standards Committee, all rights to any proprietary interest you may have in the submission that is necessary to implement it in whole or part, whether the submission is incorporated into the Standard or not. All submissions are without any guarantee or warranty by the author or the DWARF Committee. Neither the author nor the DWARF Committee accept liability for use of the submission in any form, or for reliance upon the accuracy or completeness of the submission."
