title = "DWARF Issue: Typo - Regression since DWARF3 standard"
full_description = 'Issue 171130.1: Typo - Regression since DWARF3 standard Author: Ben Dunbobbin Champion: Ron Brender Date submitted: 2017-11-30 Date revised: Date closed: 2021-02-22 Type: Editorial Status: Accepted DWARF version: 6 Section E.3.2, pg 388 dwarf 5 text reads: References to other .debug_infosections follow the approach suggested above, but the naming rule is slightly different in that the <file-designator> should be interpreted as a <file-designator>. It should read the same as in the dwarf4 and dwarf3 spec: References to other .debug_info sections follow the approach suggested above, but the naming rule might be slightly different in that the <file-designator> should be interpreted as a <function-designator>. Probably just a simple copy and paste error led to <file-designator> being repeated twice. RESOLUTION This is a typo as surmised in the Issue report. In line 24, replace "<file-designator>" with "<function-designator>". 02/22/21 -- Accepted View Markdown Source'
