["https://dwarfstd.org/issues/190225.1.html"]
title = "DWARF Issue: DW_AT_segment_attribute"
full_description = "Issue 190225.1: DW_AT_segment_attribute Author: James Harding Champion: Zoran Zaric Date submitted: 2019-02-25 Date revised: Date closed: 2022-03-21 Type: Clarification Status: Closed DWARF version: 6 Section 2.12, pg 48 I have a question about the DW_AT_segment attribute. In section 2.12 of the DWARF 5 specification, it says that if an entry has no DW_AT_segment attribute then it is inherited from its parent entry. Access to entries via a reference would go directly to the entry and bypass any parent entries. How would one find the parent in such a situation? Or is the case that there should never be a reference to a DIE that may have a segment attribute? I am not intending to support the segment attribute in what I am doing. I only wish to better understand DWARF. -- 2022-03-21: Closed. The standard provides a method to find the parent, even if inefficient."
