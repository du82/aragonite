["https://dwheeler.com/essays/add-multiply.html"]
title = "When Adding and Multiplying are the Same"
full_description = '''A bit of thinking will help you realize that {x,y} = {2,2} and {0,0} are two solutions to the problem, because: So, there are an infinite number of real number solutions; to find a given y, just compute y = 1/(x-1)+1 (as long as x is not equal to 1; there's no real number solution in that case). For example, the pair {1.5,3} works, because: Now, let's narrow the question - are there any other real number solutions where x=y, other than 0 and 2? It turns out the answer is no, and here's why, starting with the equation above and changing it since now x=y: Now, instead of limiting ourselves to x=y, let's allow any value of x and y, but only if they are both integers. Given that variation, are there any other integer pair solutions? The short answer is no - if you limit yourself to integers, 0 and 2 are all that's possible. Here's why. Since integers are a subset of the real numbers, the equation given above applies: Bottom line: there are an infinite number of real number pairs where adding and multiplying the pair will give the same answer. But if you require the pair to have the same value, or to both be integers, there are only two answers: {0,0} and {2,2}. It turns out this isn't hard to show; just start with "(x-1)(y-1)" and multiply it out. These are two trivial expressions; you can just multiply them out the same way you'd multiply multiple-digit numbers: So (x-1)(y-1) is almost the same as xy-x-y, except that it has an extra "+1". No problem, just subtract one, and you have it. That means that: Now, to be honest, I instantly recognized "xy-x-y" as easily rewritten as "(x-1)(y-1)-1"; I didn't have to "figure it out". But if you haven't seen that before, hopefully this will convince you.'''
year_published = 2025
