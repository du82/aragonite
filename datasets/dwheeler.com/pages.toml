["https://dwheeler.com/essays/Fischer_Random_Chess.html"]
title = "Fischer Random Chess / Chess960 / FullChess"
full_description = '''There are many procedures for creating this starting position. Hans L. Bodlaender has proposed the following procedure using one six-sided die to create an initial position; typically this is done just before the game commences: This procedure generates any of the 960 possible initial positions of Fischer Random Chess with an equal chance; on average, this particular procedure uses 6.7 die rolls. Note that one of these initial positions is the standard chess position, at which point a standard chess game begins. It's also possible use this procedure to see why there are exactly 960 possible initial positions. Each bishop can take one of 4 positions, the Queen one of 6, and the two knights can have 5 or 4 possible positions, respectively. This means that there are 4*4*6*5*4 = 1920 possible positions if the two knights were different in some way. However, the two knights are indistinguishable during play; if they were swapped, there would be no difference. This means that the number of distinguishable positions is half of 1920, or 1920/2 = 960 possible distinguishable positions. Once the starting position is set up, the rules for play are the same as standard chess. In particular, pieces and pawns have their normal moves, and each player's objective is to checkmate their opponent's king. Fischer random chess allows each player to castle once per game, a move by potentially both the king and rook in a single move. However, a few interpretations of standard chess games rules are needed for castling, because the standard rules presume initial locations of the rook and king that are often untrue in Fischer Random Chess games. After castling, the rook and king's final positions are exactly the same positions as they would be in standard chess. Thus, after a-side castling (notated as O-O-O and known as queen-side castling in orthodox chess), the King is on c (c1 for White and c8 for Black) and the Rook is on d (d1 for White and d8 for Black). After h-side castling (notated as O-O and known as king-side castling in orthodox chess), the King is on g and the Rook is on f. It is recommended that a player state "I am about to castle" before castling, to eliminate potential misunderstanding.'''
year_published = 2025
