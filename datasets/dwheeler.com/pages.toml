["https://dwheeler.com/contactme.html"]
title = "Contacting David A. Wheeler"
full_description = "You can contact me at my email address, in fact, I gladly welcome personal email intended specifically for me! Kudos, questions, & corrections are all welcome. Please read below for how to contact me, with caveats. Please create and publish hypertext (URL) links to anything on my site — the more the better! Please don’t bother me by asking for my permission; you already have my permission. In fact, please don’t bother anyone asking for permission to link to their material, because you can link to any legal material you want to. In April 2000, Federal Judge Harry L. Hupp’s ruling on deep linking Ticketmaster vs. Tickets.com, Inc, 2000 U.S. Dist LEXIS 12987 (D. Cal. 2000) stated that, “hyperlinking does not itself involve a violation of the Copyright Act... since no copying is involved”. When there were only a few people on the Internet, asking for permission was pointless but harmless. But nowadays, useless requests for permission have become a serious waste of everyone’s time. If you want to link to my site, and your attorneys tell you that permission is required, please try to replace them with competent attorneys. If you cannot replace them, then please contact me. I can sign papers if you really need it, but I expect to be compensated for my time. If the agreement is short and clear, my usual fee for signing a link permission request for a commercial organization is $50. Do not send me a resumé; I will delete it unopened. If you want a job with my employer, send your resumé there. As long as you aren’t sending me spam, my email address is “dwheeler”, followed by the “at” sign, followed by “dwheeler.com”, and please include my current ham password (email password) somewhere in the subject line. My current ham password is: I often keep private email private, as a courtesy to the sender, but I don’t think I’m legally obligated to do so. Please let me know (in the email) if you really want me to keep something private; I get a lot of email, and if you can’t take the time to tell me “please keep this private”, please don’t expect me to take the time to keep it private either. I simply don’t have the time to constantly email back to everyone who sends me an email, just to find out if I can post it. Courts and government agencies typically work the same way; they typically require senders to mark stuff that’s private / confidential / whatever when it’s sent, because it’s too hard to handle things otherwise."
