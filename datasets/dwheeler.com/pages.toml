["https://dwheeler.com/adventure"]
title = "Adventure"
description = "David A. Wheeler's Page on Adventure"
full_description = '''You can download many different versions of Adventure at no charge. One nice one is Advent.z5 (12-Jun-2006), Adventure aka Colossal Cave. This is the original 350 points version ported to Inform by Graham Nelson, based on Dave Baggett's TADS reconstruction "Colossal Cave Revisited". (This is Release 9 / Serial number 060321.) To play this, you need a Z-machine player. There are lots of Z-machine players out there, including Frotz for Windows, Zoom for MacOS, and Frobnitz for PalmOS. If you're interested in the history of Adventure, a lot of background on the original Adventure game (and the cave it's based on) is discussed in "Somewhere Nearby is Colossal Cave: Examining Will Crowther's Original 'Adventure' in Code and in Kentucky" by Dennis G. Jerz of Seton Hill University (Digital Humanities Quarterly, Summer 2007, Volume 1 Number 2) For a long time the original code had been lost, but the original Fortran source code of Adventure has been found, showing that Will Crowther's original version was a game - Crowther's original version included magic words, dwarves, and so on. Almost instantly after the source code was available, someone ported it and got it running (here is the original Adventure, runnable).'''
