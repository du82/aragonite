["https://dwheeler.com/blog/2011"]
title = "David A. Wheeler's Blog"
full_description = "The U.S. Department of Defense (DoD) has changed one of its key software development documents, making it even clearer that it’s okay to use open source software (OSS) in the DoD. This is good news beyond the DoD; if the US DoD can widely accept OSS, then maybe other organizations (that you deal with) can too. That key document has the long title “Application Security & Development (AppDev) Security Technical Implementation Guide (STIG),” aka the AppDev STIG. The AppDev STIG includes some guidelines for how to write secure software, and a checklist for use before you can deploy custom software in certain cases. In the past, many people thought that using OSS in the DoD required special permission, because they misunderstood some of DoD’s policies, and this misunderstanding had crept into the AppDev STIG. The good news is that this has been fixed. Open source software (OSS) is software where anyone can read, modify, and redistribute the source code (its “blueprints”) in original or modified form. OSS is widely used and developed in industry; some popular OSS includes the Linux kernel (the basis of Google’s Android), the Firefox web browser, and Apache (the world’s most popular web server). You can get quantitative numbers about OSS at http://www.dwheeler.com/oss_fs_why.html. There is a lot of high-quality OSS, and OSS is often very inexpensive even when you include installation, training, and so on. Unfortunately, previous versions of the AppDev STIG were often interpreted as saying that using OSS required special permission. This document matters; DoD Directive (DoDD) 8500.01E requires that “all IA and IA-enabled IT products incorporated into DoD information systems shall be configured in accordance with DoD-approved security configuration guidelines” and tasks DISA to develop the STIGs. It’s often difficult to get systems fielded unless they meet the STIGs. (APP2090.1: CAT II) “The Program Manager will obtain DAA acceptance of risk for all open source, public domain, shareware, freeware, and other software products/libraries with no warranty and no source code review capability, but are required for mission accomplishment.”"
