["https://dwheeler.com/chess-openings"]
title = "A Beginner's Garden of Chess Openings"
full_description = '''The first moves of a chess game are termed the "opening" or "opening moves". A good opening will provide better protection of the King, control over an area of the board (particularly the center), greater mobility for pieces, and possibly opportunities to capture opposing pawns and pieces. The possible opening moves of chess have been extensively studied for hundreds of years, and many of these sequences have been given names to simplify discussion of a game. This document briefly lists a few of the more well-known chess openings, so that when you see the first few moves you can at least say "Ah! That's the X!", where X is some well-known opening. Many books and encyclopedias give "how to play" information on each opening; here, we'll concentrate on at least knowing some common approaches to starting chess. This is a small subset of well-known openings; many others are not covered here. Before you play a particular opening, you'd be wise to study it in more depth than given here. Pictures show the opening position; selecting the picture will show the opening moves animated one move at a time if you have a PGN viewer installed. In all openings there is a struggle for key territory, in particular the center squares, and an effort to deploy pieces and pawns in useful positions. Some are direct, while others are more subtle and indirect approaches toward these goals. The Ruy Lopez is an old opening; it is named after Ruy Lopez, a 16th Century Spanish clergyman and chess enthusiast. He made a systematic study of this and other chess openings, which he recorded in a 150 page book. However, although it is named after him, this particular opening was known earlier; it is included in the Gottengen manuscript, which dates from 1490. Popular use of the Ruy Lopez opening did not develop, however, until the mid 1800's when Jaenisch, a Russian theoretician, "rediscovered" its potential. The opening is still in active use; it is a favorite of Gary Kasparov and Bobby Fischer. In it, White creates a potential pin of the d-pawn or Knight and starts an attack immediately, while simultaneously preparing to castle.'''
