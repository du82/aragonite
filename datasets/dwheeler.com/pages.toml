["https://dwheeler.com/essays/automating-destdir.html"]
title = "Automating DESTDIR for Packaging"
description = "Notes on how to automate DESTDIR"
full_description = "Today’s users of Linux and Unix systems don’t want to follow complicated instructions to install programs — they want to click on one button, and have everything installed as necessary. Ideally, they should be able to install programs using their native package format and download tools, such as deb (used by Debian and Ubuntu) and RPM (used by Fedora, Red Hat, and SuSE/Novell). But that means that someone has to create those packages. Alternatively, they should be able to use a program that can automatically download, compile, and install from source code, perhaps with some program like GNU stow that can place each package in its own separate directory while appearing to all be in one place. Whether you are creating native packages, or automatically installing source packages, it’s often vital to be able to compile the program so that it will run in some directory X, but install the program in some other directory $DESTDIR/Y. There is a standard way to do this: Have the source package support the DESTDIR convention. Unfortunately, many software source packages fail to support the DESTDIR convention, and it’s sometimes a real pain to add DESTDIR support. The build programs (e.g., Makefiles) can be large, complex, and multilayered... so it can be painful for a packager to modify the build scripts to add DESTDIR support. A packager can send DESTDIR patches upstream, but they may be ignored or improperly maintained... which means that the packager may need to keep re-modifying the build system, every time the program is updated. Ugh. All too often, packaging can be completely automated except for the lack of DESTDIR support. It’d be much better if the equivalent of DESTDIR could be automated, without requiring application programs to add DESTDIR support to their installers. After all, almost any “real” Unix/Linux program with source code available supports “make install” (or equivalent) for installation. A “make install” process presumes that it is writing the files to the “real” filesystem. Ideally, there’d be a way to reroute writes to the “real” filesystem to some other directory tree, so that they could be packaged or used with programs like GNU stow. This shouldn’t be that hard - “make install” may invoke many programs and do a lot of recursive directory descending to figure out what to install, but the commands that actually do the installing are usually simple ones like “install” and “cp”."
year_published = 2009
year_updated = 2009
