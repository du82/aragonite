["https://dwheeler.com/essays/adult-patrol-chant.html"]
title = "Adult Patrol Chant"
full_description = '''My son's Boy Scout troop has chants for each patrol - and they wanted the adult patrol to have one too. Here's my try (capital letters indicate stress): If you've never been involved in Boy Scouts, perhaps some explanation is in order. The adults generally know how to camp, but we also like creature comforts. So it's not surprising to find the adults gathered with coffee pots, a cobbler dessert at night (peach cobbler is great, and dutch ovens are great for making them), and easy chairs. But we're really there for the scouts, whose motto is "be prepared". Feel free to see my home page at https://dwheeler.com. You may also want to look at my paper Why OSS/FS? Look at the Numbers! and my book on how to develop secure programs. (C) Copyright 2017 David A. Wheeler. Released under Creative Commons Attribution-ShareAlike version 3.0 or later (CC-BY-SA-3.0+).'''
