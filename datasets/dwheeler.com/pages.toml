["https://dwheeler.com/essays/dod-oss-qa.html"]
title = 'Questions and Answers for 2008 "Open Source Software and DoD" Webinar, 2008'
description = "This answers questions about open source software (OSS) and the U.S. Department of Defense (DoD)"
full_description = '''These are my best efforts to answer the questions sent during the webinar (conference) on February 11, 2008. These are not legal advice, and I am not a lawyer; for legal advice, see your counsel, after making sure that he or she understands open source software legal issues (most do not). But I hope these answers will help you in some way. In some areas the answers are simple and well-known, yet hard to find. In other areas, the answers are not simple or are unknown. Some are difficult issues where there doesn't seem to be a consistent or generally-accepted Government position or interpretation. I'll try to explain what the issues are, give my best understanding, and (where I can suggest it!) how to stay away from the unknowns. Some of these questions raise interesting points that I think need to be officially answered; I hope this will be a start. I've grouped the questions into these areas: Here, "OSS" means "open source software", which is the usual DoD term for Free-Libre / Open Source Software (FLOSS). OSS is software that meets OSI's "Open Source Definition" or the FSF's "Free Software Definition" (and typically meets both definitions). See my slides for more information. If there are errors, please contact me so I can correct them. Please note that my later article “Publicly Releasing Open Source Software Developed for the U.S. Government” gives a lot more information on when the government and its contractors can release, as OSS, software developed using government funds. Check out my FLOSS license slide at https://dwheeler.com/essays/floss-license-slide.html. If you want more detail, you might look at the FSF's document "Various Licenses and Comments about Them" and the Fedora Licensing page. Free-libre or Free/Libre. So FLOSS stands for "Free-Libre / Open Source Software" or "Free / Libre / Open Source Software". There's a story behind this terminology, so I may as well tell it. An older and still widely-used term for open source software is "Free software". Unfortunately, in English the word "free" is very ambiguous. Many languages have (at least) two different words that translate to English "free": one to indicate "no cost" (such as Spanish/Portuguese/Dutch "gratis") and one that means "freedom of control by another" (such as Spanish/French "libre"). The intended meaning of "Free software" is the "libre" sense, as in "free speech" or "free market". But many people thought that "Free software" meant "no cost software" (gratis), which was expressly not intended; after all, people sell Free software! One solution is to append "-libre" to the word "free", to make it clearer which sense is meant; another is to just use a word like libre instead ("libre software").'''
year_published = 2008
year_updated = 2008
