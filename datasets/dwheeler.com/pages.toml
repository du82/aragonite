["https://dwheeler.com/essays/ask-not-holds-copyright.html"]
title = "Ask not who holds the copyrights"
description = "This essay explains why you need to focus on the rights to intellectual works (including software and documents), not on who holds the copyright"
full_description = "Asking “who has the copyright?” for intellectual works (like software, documents, and data) is almost always the wrong question to ask. Instead, ask “what rights do I have (or can I get)?” and “do those rights let me do what I want to do?”. In a vast number of situations, those are the right questions to ask instead. Even people who should know better can fall into this subtle trap! For example, are you asking, “who holds the copyright on this Wikipedia article”? If so, you’re probably making a mistake. You probably just want to know “what may I do with the article?”. In that case, Wikipedia makes it very easy to find out what its license is, and what its terms are. In the case of Wikipedia, the license is the Creative Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Unported License and also, unless otherwise noted, the GNU Free Documentation License. The Creative Commons licenses are especially common; if you don’t know what they say, now is the time to find out. Trying to find out who holds the copyright on a Wikipedia article is often an exercise in futility; often there are dozens of authors of an article, and it might be hard to contact them. In most cases, trying to get this information is an unnecessary hardship; just look at the license, which tells you what rights you have, and you are done. Are you asking, “who holds the copyright on the Linux kernel”? If so, you’re almost certainly making a mistake. The Linux kernel has an absolutely massive number of authors. Instead, you probably just want to know “what may I do with it”, and they embed the license text that answers that question already. In the case of the Linux kernel, this is the GNU General Public License (GPL) version 2 (GPLv2). The GPL is a really common software license, so if you use software (we all do), read it so you can learn what your rights are. Many times it is all somewhat obvious. Often you either have the rights you need, or you can can easily find out how to get the rights you need. You just need to look. If someone legitimately gives you a right (say through a license), or will legitimately sell that right to you, and those rights are all you need, then that’s that! The license might require payment (common for proprietary software). Free/libre/open source software (FLOSS) often doesn’t require payment, but the U.S. District Court found, in Jacobsen v. Katzer, that that FLOSS licenses were enforceable too (see the JMRI summary for more). Also, if you want to do something that clearly meets the legal exceptions to copyright protections, such as the US “fair use” exceptions or your country’s equivalent, the law already gives you those rights."
year_published = 2011
clearnet = "https://dwheeler.com/essays/ask-not-holds-copyright.html"
