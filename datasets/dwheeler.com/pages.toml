["https://dwheeler.com/essays/dewitt-clause.html"]
title = "The DeWitt clause’s censorship should be illegal"
description = "The Dewitt clause should be illegal, here is why"
full_description = "If you plan to pay for software, you often can’t find published comparative evaluations that have serious benchmarks on performance, accuracy, and so on. Why is that? The answer is a censorship regime that you’ve probably never heard of. The DeWitt Clause is a common end-user license agreement provision for proprietary software that prevents anyone (such as researchers and scientists) from publishing information about their products (like benchmarks) that name the software unless its supplier approves it. Real benchmarks typically show the weaknesses of systems, so unsurprisingly, suppliers often don’t approve the publication of thorough research. In fact, many researchers won’t even start this kind of analysis, because they know they won’t be able to publish the results. The clause was originally created to squelch database research being performed by Dr. David DeWitt. Larry Ellison, co-founder of Oracle, was displeased with a benchmark study done by David DeWitt in 1982, which showed that Oracle's system had poor performance. Instead of simply fixing the problems, Oracle (at Larry Ellison's behest) established the original DeWitt clause to censor any benchmark results that the vendor had not sanctioned. It had the intended effect; Oracle has a long reputation of having a huge legal department, so most people avoid publishing benchmarks about software products with a DeWitt clause. Over time these DeWitt clauses have become widespread in the software industry, making it nearly impossible to get unbiased published benchmarks about a variety of software products. “The Devil’s in the DeWitt Clause” by Brian Moran (SQL Server Pro, Apr 2, 2003) discusses some of the arguments that vendors give to justify the DeWitt clause. As he summarizes later in “DeWitt Clauses: Serving the Wrong Master”, they are: In the end, though, Moran states that “I don’t believe that DeWitt clauses serve customers’ best interest”. Indeed, I will go further and say that they directly opppose society’s interests. If vendors continue to be able to legally censor information, then society has no way to get or debate the information. The problem isn’t deception; we already have laws against deception. It’s true that evaluations can be misunderstood, but the solution there is to let other people try to repeat the findings and publish their own results. And let’s be honest: the DeWitt clause has nothing to do with preventing publication of misleading or grossly inaccurate results. The clause is named after efforts to squelch Dr. DeWitt’s research, and no one argues that Dr. DeWitt was clueless or deceptive. Indeed, Dr. David DeWitt is the winner of many awards specifically in the area of databases (the area he was benchmarking), including a pair of very prestigious awards: the ACM Software System Award and the IEEE Emanuel R. Piore Award. These DeWitt clauses are purely government-enabled censorship - and they are government-enabled censorship, because companies are using government courts to go after people who dare to publish truth."
year_published = 2022
year_updated = 2022
