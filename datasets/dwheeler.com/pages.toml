["https://dwheeler.com/blog/2010"]
title = "David A. Wheeler's Blog"
full_description = "I’ve now posted an HTML version of my PhD dissertation, “Fully Countering Trusting Trust through Diverse Double-Compiling”. This has been available as a PDF for some time, but in some cases an HTML version is more convenient (e.g., for small devices like cell phones or browsers that don’t have PDF readers). This dissertation describes an effective countermeasure for the nasty trusting trust attack; see my page about countering trusting trust or the dissertation itself for more information. The HTML is very simple HTML that should be acceptable nearly universally. If you’re curious, I generated the HTML from OpenOffice.org, ran HTML tidy, and cleaned up the results a little further (via a simple script I created for the purpose and by hand). I eliminated all forced font names, for example. The goal was to create simple HTML that pretty much any web browser can display reasonably well, both today and into the future. For example, even browsers that can’t handle CSS or <div> should produce reasonable results. People should even be able to read the HTML directly, if they want to, without too much trouble. This is all part of my effort to make sure that anyone who wants this information can get it, either now or in the future. The HTML almost passes the W3C HTML Validator, but I drew the line at the “absmiddle” value for the “align” attribute. The official HTML4 specification does not not include align=absmiddle, but this is widely implemented by all major browsers, so I view its omission as an error in the HTML spec. I do use in-line <center>, <b>, and <i>; some people may whine about that, but it’s completely standard and universally supported, while alternatives are not universally supported. I tested on a variety of browsers, and it seems to come out well. The Wii web browser (based on Opera 9) doesn’t seem to handle certain entities that are part of the Unicode and ISO 10646 specification, and shows rectangles instead. But since these are standard characters, I view this as a problem with the browser:"
year_published = 2025
