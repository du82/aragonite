["https://dwheeler.com/blog/2004"]
title = "David A. Wheeler's Blog"
full_description = "The latest article in my “Secure Programmer” series is now available! This series is a developerWorks series on secure development for Linux/Unix. Article #7 is Secure programmer: Call Components Safely. The posted date is 16 December 2004, but it’s only been available since around 23 December 2004. So, I’ve posted on my website information on how to secure your Microsoft Windows system. It’s basically a checklist of things you can do to make things better. The Federal Trade Commission (FTC) and National Institute of Standards and Technology (NIST) are considering their options for email authentication as a technique to partially counter spam. I recommend that they make two fundamental decisions. First, FTC and NIST should urge lawmakers to make spam illegal, so that technological measures will have legal standing. Authentication has little anti-spam value without it. Second, FTC and NIST should insist that any anti-spam technical standard must be implementable by all suppliers of email infrastructure, both proprietary and open source software. This essay responded to a Federal Register request supporting the “Email Authentication Summit” of November 9-10, 2004. I sent the original version of this essay on September 27, 2004. Although it was publicly posted, and quoted in places such as Groklaw’s FTC Email Authentication Summit article, it had various formatting problems, a few minor grammatical mistakes, and it mentioned only NIST and not the FTC. This version is much easier to read since I converted it to HTML and had these minor problems fixed. So, for those of you who wanted a nicer copy of this essay — enjoy! It’s here, at: Comments on Email Authentication for Countering Spam Linus Torvalds (lead developer of the Linux kernel), Michael Widenius (lead for MySQL) and Rasmus Lerdorf (lead for PHP) have written an appeal to the EU Council against software patents in Europe. This letter is useful as yet another ray of sunlight into a sea of deceptive practices. Here’s what the letter reveals: “The draft directive in question is deceptive because it leads laymen, and even those legal professionals who are not familiar with the intricacies of patent law, to falsely believe that it would exclude software from patentability. However, it is actually a compilation of the entirety of the excuses with which the patent system has, for many years, been circumventing article 52 of the European Patent Convention in order to grant patents on software ideas.”"
