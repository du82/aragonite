["https://dwheeler.com/essays/dc-in-maryland.html"]
title = "Treat Washington, DC as Part of Maryland for Congressional Elections"
full_description = '''Today's Washington, DC license plates have an odd slogan: "Taxation without Representation." The slogan has a good point. Washington, DC residents cannot vote for Congressional representation the way other U.S. citizens can, yet they pay taxes, provide military personnel, and in all other ways are U.S. citizens. That's a serious flaw in U.S. democracy. The current unfair (and undemocratic) situation is all based on an 1801 law interpreting the U.S. Constitution. Article I, section 8, clause 17 of the Constitution gives the Congress the power "to exercise exclusive legislation in all cases whatsoever over such capital district." The Constitution was written in 1787; the site of the District of Columbia (DC) was chosen later, in 1790. The U.S. Constitution doesn't expressly forbid voting by residents, and in 1793-1794, Uriah Forrest (who lived in DC) represented Maryland in the U.S. House of Representatives. Up until 1801, people who lived in DC voted just like any other U.S. citizen (voting in either Virginia or Maryland, depending on where the DC land came from). However, the "Organic Act" passed by Congress in 1801 stripped DC residents of their rights to vote in Federal elections. In 1801 this didn't affect many people, but this 1801 law now affects hundreds of thousands of people. There have been several attempts to fix this, through a variety of ways. Most recently there have been several prominent drives to admit the District of Columbia as a new state. This effort to turn DC into a state is called "DC statehood," and it's a plausible way to allow DC residents to finally vote for Congressional representation. Indeed, DC is already considered a state for purposes of presidential elections, thanks to the 23rd amendment passed in 1961. A petition to admit DC as a new state was filed in Congress in 1983, but failed, and a similar measure failed in November 1993 in the U.S. House of Representatives (by the wide margin of 277 to 153). I'm skeptical that these DC statehood bills will ever pass, and it's frankly not at all clear that DC should be a state. Here are some of the problems with DC statehood:'''
year_published = 2004
clearnet = "https://dwheeler.com/essays/dc-in-maryland.html"
tags = ["april", "congressional", "david", "david a. wheeler", "david wheeler", "dc statehood", "district of columbia", "elections", "maryland", "part"]
