["https://dwheeler.com/essays/allsome.html"]
title = "The Allsome Quantifier"
description = "This essay proposes the allsome quantifier, aka all some quantifier, to make it easier to formally express some statements and avoiding various errors."
full_description = "It is easy to mistranslate informal statements into formal logic, and these errors can cause serious problems (potentially including property damage, maiming, and loss of life). For example, in formal logic, “All Martians are green” would often be represented as ∀x (φ→ψ), while “All Martians are not green” would often be represented as ∀x (φ→¬ψ). In formal logic both statements are simultaneously true if there are no Martians. However, informal statements with this format often embed the assumption that there is at least one case where the antecedent is true (that is, that there is at least one Martian). This essay proposes a new formal logic quantifier called “allsome” (aka “all some”) that is designed to make some of these mistranslations less likely. The allsome quantifier, abbreviated ∀!, simultaneously expresses for all (∀) and there exists (∃) in a way that models many informal statements. It has two syntactic forms, formally defined as follows: ∀! x (φ→ψ) ≡ ∀ x (φ→ψ) ∧ ∃ x φ and ∀! x∈A φ ≡ (∀ x∈A φ) ∧ ∃ x x∈A. We have implemented this construct in the Metamath proof system and formally proven that it counters this well-known problem. We also compare this approach to alternative countermeasures in PVS and SPARK. We hope that this new quantifier will help reduce the risk of mistranslations of informal statements into formal expressions, and that others will eventually agree that allsome is awesome. Modern formal logic notation can represent many statements with great precision. This is very valuable, because formal logic can be verified by computers to ensure that certain claims can be proven from other claims, including those that can prevent loss of life. Unfortunately, it is easy to mistranslate informal statements into current formal logic notation, resulting in “proofs” that in fact do not prove anything important. That could be a disaster, because sometimes proofs are used to model systems to ensure that they do not damage property, maim, or kill. Even in pure mathematics we would like to ensure that what was proved is what we thought was proved. We should prefer notations that are unlikely to misunderstood, yet today some common constructs are easy to get wrong. This is especially true when material implication (→) is combined with the for-all quantifier (∀)."
year_published = 2020
