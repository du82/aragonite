["https://dwheeler.com/essays/all-men-are-mortal.html"]
title = "The Origin of All Men are Mortal"
description = "Many books and articles use the following example of logic: All men are mortal; Socrates is a man; Therefore, Socrates is mortal. But where did this example come from?  It's not from Aristotle. Here I track down the origin of this example as best I can."
full_description = '''Some people think this example comes from Aristotle, but Aristotle did not say anything like this example. Aristotle created the field of logic, because he was the first person to study and write about logic independent of any particular argument. So it is true that he discussed this form of argument. But there is no evidence that Aristotle wrote this particular example. Just look at Aristotle Organon And Other Works by Aristotle (translated under the editorship of W.D. Ross), which includes the six books collectively called the Organon as well as Rhetoric. Aristotle mentions Socrates often, as well as the terms mortal and immortal, but he never uses them exactly this way (you can verify this yourself by searching for "Socrates"). The earliest document I can find with this specific example is from 1843, specifically A System of Logic: Ratiocinative and Inductive, Presenting a Connected View of the Principles of Evidence and the Methods of Scientific Investigation by John Stuart Mill, 1843 (first edition), Book II Chapter 3 page 245. On that page we see: Mill's A System of Logic... went through a large number of revisions over many years. For example, its 8th edition was released in 1872. Unsurprisingly, these revisions moved material around, For example, the 3rd edition was published in 1851, and it first mentions the "Socrates is a man" example in Book II, Chapter II, Of Ratiocination, or Syllogism, p. 190. A discussion of Mill's writing of the original first edition, and the changes it went through afterward, is contained in The Collected Works of John Stuart Mill, Volume VII - A System of Logic Part I. Since we are focused on its first use, and its first edition includes the example, that appears to be its first full use. This makes sense; this book was extremely popular in its time (for its kind of work), as witnessed by its many editions. As I already noted, Aristotle created the field of logic, because he was the first person to study and write about logic independent of any particular argument. You can see many of his works in Aristotle Organon And Other Works by Aristotle (translated under the editorship of W.D. Ross). But nothing exactly like this is said.'''
year_published = 2023
clearnet = "https://dwheeler.com/essays/all-men-are-mortal.html"
tags = ["2023-02-01", "after?", "all", "answer", "aristotle", "before?", "came", "conclusion", "david", "examples"]
