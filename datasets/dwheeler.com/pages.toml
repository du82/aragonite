["https://dwheeler.com/essays/commercial-floss.html"]
title = "Free-Libre / Open Source Software (FLOSS) is Commercial Software"
full_description = "When I talk with with other people about Free-Libre / Open Source Software (FLOSS), I still hear a lot of people mistakenly use the term “commercial software” as if it had the opposite meaning of FLOSS (aka open source software, Free-Libre Software, or OSS/FS). That’s in spite of (1) the rise in commercial development and support for FLOSS, (2) most FLOSS projects’ goal to incorporate improvements (which are actually a form of financial gain), (3) official definitions of “commercial item” that include FLOSS, and (4) FLOSS licenses and projects that clearly approve of commercial support. Terms like “proprietary software” or “closed source” are plausible antonyms of FLOSS, but “commercial” is absurd as an antonym. Nearly all FLOSS projects are commercial. In this essay I’ll explain why it’s so important to understand that FLOSS software is almost always commercial, and then give examples of each of those four points (listed above) to justify the claim that FLOSS is commercial. The essay then notes that many do not make this mistake, briefly notes some alternative terms, and ends with some conclusions. It’s important to not confuse “FLOSS” and “non-commercial”. To see why, let’s first define our key terms, “FLOSS” and “commercial”: As FLOSS has become more prominent in the computer industry, many speakers have tried to differentiate FLOSS from software released under other license terms. That’s fine, but some people have unfortunately been trying to use the term “commercial” as something distinct from FLOSS. This confusion -- that FLOSS and commercial software are opposites -- is a dreadful mistake. Speakers who differentiate between FLOSS and commercial products, as if they were opposites, are simply unable to understand what is happening in the software industry. And if you cannot understand something, you cannot make good decisions -- or even create good advice -- about it. Some concepts aren’t important, but software controls every important device on the planet. If you wish to understand the 21st century (and beyond), you need to understand the basics of what controls software... because software controls everything else. It is no longer acceptable to make such a terrible mistake."
year_published = 2006
year_updated = 2006
