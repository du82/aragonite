["https://dwheeler.com/advmath"]
title = "Sovereign Grace Church (SGC) Co-op Saxon Advanced Math / Pre-Calculus - Notes and Help, by David A. Wheeler"
description = "David A. Wheeler's Page for teaching Saxon Advanced Math (Pre-Calculus) at the Sovereign Grace Church Homeschool Co-op"
full_description = '''I offer these notes to anyone who is using this textbook, in the hope that they will be helpful. I am delighted that others are finding these notes helpful - so if you find them helpful, let me know! Here's what one happy reader said: "I have been using your notes (for circular permutations [lesson 55] they were a big help). We live in a remote area of Florida and I don't know any others in this area that are working on Advanced Math." [MFurey]. One of the main reasons I teach the class is because I believe it is important for people to learn the basics of math... I cannot teach everyone, but this is a small way I can help. Sadly, if you're not in my class (or at least SGC), please don't send me math questions - I'd like to help, but I simply can't answer math questions sent from everyone in the world (sorry!). The co-op is a service provided by SGC to church members; Sovereign Grace Church (SGC) Home Ed Blog (HEA) and HEA Blog co-op documents have the latest info. A word about data formats: I normally edit my class notes in OpenDocument format (ODF), which is the international open standard for office documents (ISO/IEC 26300:2006). Files ending in ".odt" are OpenDocument text (e.g., word processing format). There are many programs that can read and write this format; two good free ones are LibreOffice and OpenOffice.org, both of which are available for MS Windows, Apple Macintosh, Linuxes, *BSDs, and Unix. (I'm told that Microsoft Office can also read them, but I have not checked.) If you just want to read the notes, you can read the PDF version (PDF is also internationally standardized); there are lots of PDF readers, many free. As a general rule I strongly encourage the use of open data standards (formats that aren't controlled by any one vendor), such as ODF, PDF, and HTML. I also use the international standard format for dates (ISO 8601), YYYY-MM-DD, which helps to avoid confusion in international communication - and it sorts well too. Mathematics: What & Why [PDF] | Mathematics: What & Why [ODF] (What Math? is a nice additional essay.)'''
