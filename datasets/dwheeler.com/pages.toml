["https://dwheeler.com/essays/bases.html"]
title = "Way Off Base"
full_description = '''Most people use base 10 for their number system. Computer people often find base 2, 8, or 16 convenient. But surely, we're missing out.. why not try some really bizarre bases?! First, a quick definition: in a base B, each position to the left has its digit multiplied by one greater power of B, while each position to the right of the decimal point is multiplied by one less power of B. With that in mind, let's look at a few bases: You could even cheat further by using two symbols ("0" and "1" standing for zero and one), but this kind of cheating wouldn't help you. Since one to any power is still only one, adding zeros as a placeholder won't help you. For example, "10", "100", and "1000" would all have the same value (one). xkcd has cartoon about the marvelous powers of 1, which will only make sense if you've seen Charles and Ray Eames' "Powers of Ten" documentary (spoofed by the Simpsons). Do things get better if the lone symbol represents i? To keep things clear, let's use the symbol "i".. and it turns out the answer is that it doesn't help: One approach to solving this problem is to use the other cheating approach we mentioned in the discussion about base 1. Basically, let's permit two symbols ("0" and "1", with their traditional meaning). This helps quite a bit; now we can count one, two, three as "1", "10001", "100010001" (using the "1" means one system). Now at least we can represent all whole numbers - though it's not pleasant. One odd thing about this approach is that there are now many ways to represent a number - "10001" and "100000001" both represent the value two. You can even represent a few complex numbers quite easily - traditional "2+i" becomes "10011". Another solution, which avoids this kind of cheating, is to use a larger absolute value, but still a complex number, for the base. We can, for example, choose 10i as a base. Doing this has truly baroque impacts that are hard to characterize, and you can do even more interesting things by writing "complex" numbers and adding them with "complex" numbers multiplied by i. Multiplying such numbers in particular is bizarre. You could use symbols such as "1", "2", as representing their traditional value, or use them to represent 1i, 2i, and so on; either way they're bizarre.'''
year_published = 2025
clearnet = "https://dwheeler.com/essays/bases.html"
