rk again. Seems like highlighted search terms would be really nice... 03/07/15Dave CerfRe: above library bookshelf I love the Ken Perlin prototype. (As an aside, I am also appreciating Ken’s other... 0:43 Chapter columns. Switcher. Hypercard in the World (2015) was motivated by watching to do the switcher better. 0:370:43 Lasering the book itself. 05/25/15Bret VictorRe: above library bookshelf Somewhat on a whim, I wanted to see a layout of all the pages of the Whole Earth... 05/26/15Chaim GingoldRe: above library bookshelf Magic... the registration looks surprisingly good! On May 25, 2015, at 9:22 PM,... 0:43'''
