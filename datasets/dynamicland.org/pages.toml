["https://dynamicland.org/archive/2014/CDG"]
title = "CDG - Dynamicland archive"
full_description = "February 2014CDG The Communications Design Group (CDG) was a research lab, set up within (but largely independent from) SAP. The group was instigated by Alan Kay and Vishal Sikka. Sanjay Rajagopalan made it happen. CDG had offices in San Francisco and Los Angeles. The San Francisco space was located at 2 South Park (see CDG buildout) and the PIs were Bret Victor, Dan Ingalls, and Vi Hart. The lab officially opened in February 2014 with the Lab-warming party (2014). In May 2016, the lab members moved to a newly-formed nonprofit organization called HARC. Some vague early press from Fast Company and Bloomberg, but we tried to avoid that stuff. This website collects projects from Bret's group (the “Dynamic Medium” group), which evolved into Dynamicland. 0:550:35 Photos taken shortly before vacating the space in 2016:"
