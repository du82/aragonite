["https://dynamicland.org/2021/Progress_report"]
title = "Progress report 2021"
full_description = '''Dear pals, Here's an update from Dynamicland. This letter is a year late, at least, because I thought it needed to cover everything, fully, and there is just so much everything. I just want you to understand, everything, fully. I want everyone to understand everything. That's literally all I want in life. It makes it difficult to report the "news". (As Alan might scare-quote it.) It's also why there's no public presentation of Dynamicland yet. This thing is beyond my ability to present it. Presenting a "vision" is easy, you ask David for some drawings and then yearn at a camera for an hour. But once you actually manage to emigrate and go native... now what? The thought of mailing a tourist brochure back to the old country feels almost sickening. I mean, we will anyway at some point, because the progress of science is driven by tourist brochures. But what you really want to do is start an immersion program, bring people over to study abroad, let it sink into their bones. And that's in the works — slowly, but it'll happen. I'm getting ahead of myself. This letter means that the Dynamicland Foundation is a 501(c)(3) non-profit public charity that actually exists. After seven years of ill-fitting corporate embeddings, Dynamicland is finally its own legit organization, and will continue to exist as long as Delaware does. Our application for non-profit status is not a bad description of Dynamicland and its goals, at least filtered for the sensibilities of an IRS examiner. After years of getting to this point, the IRS sent back their approval almost immediately. Josh suggested that they were impressed by how inconceivable it would be for us to profit. I know it's just a name and a pile of legal forms, but it feels very comforting to have a Foundation. I'd like to keep the size small and the dreams impossible. This is Realtalk-2020, the main project for the last two years. And good timing too, given the state of in-person community engagement. But even from the beginning, this work has alternated between periods of building a platform and periods of exploring it. These alternations have also served as points for participants to come and go. Due to current conditions, goings haven't been balanced with comings, so this phase has mostly been just me and Luke. In some ways, it's been a bit lonely, especially with the absurdity of working on Realtalk from home. But it's also given us an extended quiet time to concentrate, which actually suits us both well. We used that time to rebuild Realtalk, completely, from the ground up. And it's ABSOLUTELY AMAZING. Like I said, there no concise way to explain it, every attempt has ended in paralysis, so I'm just going to gush. The new Realtalk is so real. The system is finally 100% real objects in real space. Nothing intangible, no files, directories, githubs, laptops. You stand within the poster gallery and see literally everything. Point to anything, grab it, hold it in your hand, spread it out, swap it in and out, rip it up, edit it live, all the way down. Even virtual state is visible, pinned to real objects — you can...'''
year_published = 2025
clearnet = "https://dynamicland.org/2021/Progress_report"
