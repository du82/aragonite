["https://dynamicland.org/2022/Progress_report"]
title = "Progress report 2022"
full_description = "Dear pals — We went into 2022 with the aim of bringing the spirit of Dynamicland to the science lab. In July, we gave a demo at a small conference, where we showed a series of prototypes around a real-world project at UCSF. Here we’re designing proteins together on the table. Here we’re designing a DNA nanostructure by snapping together physical blocks to form a 3D scale model. Here we’re carrying out an experiment in the wet lab. The test tubes show us what’s inside them, and where they want to go next. Here we’re making an analysis pipeline for simulated microscope images, by pinning up programs on the wall. (When we first tried this one, Shawn stopped and said, “I’m getting a bit emotional”. Apparently he could have saved a couple years on the last project if he had been able to do it this way.) The implementation of this whole set of tools is just four posters of Realtalk pages. We wrote the pages right on the table among the proteins and test tubes. For anyone from Dynamicland, the principles in play here are all pretty familiar. And yet, at least for me, the way they transformed the experience of the science lab was deeply moving. When Shawn described his idea for a structure with two binding sites, I didn't understand it at all. When he showed it to me out on the table, mixing computational models with scratch-paper sketches, not only did I get it immediately, we both started proposing and playing with further ideas with our hands. I never really understood the geometry of DNA crossovers until we started building structures with our origami blocks, and I could examine them as they snapped together and trace the helices with my fingers. These models were not pedagogical toys — they were our materials for designing real molecules. Wet lab experiments felt like “blindly manipulating liquids”. It was like lifting a blindfold to see what was in every test tube at all times, and see their concentrations change with each pipette transfer. A visitor asked about a feature in our simulated micrographs, and in a few seconds, I live-edited the electron microscopy simulation to emphasize it. We designed molecules and planned experiments by “thinking with our hands”... So much of computational biology is about being “trapped in an app”. It’s a whole different world to improvise computational tools as needed, and poke them at anything on the table. ... picking up virtual molecules into physical test tubes... ... transforming them with handheld programs... ... placing them onto racks and grids like playing a board game... ... arranging programs around ourselves in real space like decorating a room. {height=false} In retrospect, it all feels so... obvious? Why shouldn’t our molecules be lying out on the table? Why shouldn’t we casually play with them and reprogram them as we walk by? Dave once called this feeling “ordinary magic”... An immediate purpose of this work is to prototype a new lab for Shawn, as a model for how science could be done by scientists. But beyond that — I also see a model for how the invisible systems of our world could be made visible, tangible, playable, inhabitable for all people. Can we make molecules — and the mathematics by which we infer them and simulate them — as ordinary and familiar as chairs and coffee cups? Can we make science ordinary? As ordinary as reading and writing? For everyone?"
year_published = 2025
clearnet = "https://dynamicland.org/2022/Progress_report"
