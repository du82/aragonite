["https://dynamicland.org/2014/The_Humane_Representation_of_Thought"]
title = "The Humane Representation of Thought"
description = "The long-term vision of a spatial dynamic medium. Presented at UIST 2014 and SPLASH 2014. [more]"
full_description = '''Chapters — Intro — Representations, Ascent, Inhumane, Capabilities — Technology — Conversing, Presenting, Reading, Browsing, Writing, Thinking — Conclusion Since this is SPLASH, this is a programming conference, I want to start by reassuring you that this talk is, in fact, about creating programs. I'm not going to be talking about writing code, I'm not going to be talking about building software in the way we normally think about it. But this is very deeply about creating programs. Kind of in the same way that we create sounds when we talk, and we create letters when we write. This is about creating programs as a means of person-to-person communication, as a means of representing thought. This is a personal talk in certain ways, and so I wanted to start out with just a little bit of personal background, so you can kind of see where I'm coming from. I got my start, like many people, making games and apps and whatnot. I think found my stride designing creative tools, and made a number of musical instruments, visual design tools, that sort of thing. [more] That started getting me interested in UI design. And after studying that, I went to Apple, inventing and prototyping UI concepts for experimental projects, which ended up influencing these things and perhaps other things yet to come. I was also very interested in information design. I helped Al Gore make a book app about climate change. I designed a series of interactive information graphics, to enable readers to understand things in ways that would be difficult to understand in text. [more] Among other things, designing new kinds of reading material, where it's not the author lecturing at the reader, but the author is guiding the reader through exploring dynamic models, simulations that the author has provided. The reader has the agency to try different things out, to say "what if", to critique the model, to be more active, be a participating reader. [1] [2] [3] So, making these things, and then also prototyping these different creative tool environments for dynamic things.'''
year_published = 2025
