title = "Dynamicland front shelf"
description = "Incubating a humane dynamic medium."
full_description = "6-minute intro, 2024 Video, 6 min Dynamicland is a prototype of a humane dynamic medium. Here is a quick overview. Dynamicland, 2018 Presentation, 45 min Dynamicland is a computer that is a place, where people work together in the real world. This talk introduces the Dynamicland spirit. Bootstrapping Research, 2019 Presentation, 30 min Dynamicland is a bootstrapping research lab. The lab itself is the experiment. This talk introduces this uniquely effective approach. Nonprofit narrative, 2020 Essay, 5 pages Dynamicland is nonprofit. Here is why this technology cannot be a product, but must be a form of education and community practice. Progress report 2014-2019 Photo-comic, 8 pages Concise history of the lab’s first five years, and the origins of Realtalk and Dynamicland. Progress report 2020 Video, 20 min Informal tour of the lab, shortly after the start of the pandemic, showing progress on the new Realtalk. Progress report 2021 Handwritten letter, 8 pages Informal letter to the community, describing progress through the pandemic and future plans. Progress report 2022 Photo-comic, 10 pages Progress in 2022, centering around work in the science lab. The Humane Representation of Thought, 2014 Poster, 10 ft. Presentation, 55 min Founding document for the lab. The long-term vision of a spatial dynamic medium. Dynamicland zine, 2017 Zine, 16 pages Founding document for the Dynamicland community space, depicting the vision, principles, and progress. The Library, 2019 Fiction, 2 pages One component of the long-term vision for the dynamic medium. The communal science lab, 2024 Booklet, 24 pages Founding document for the bionanotechnology lab, depicting the vision of communal science. Publications Selected articles, reports, and presentations. Archive All projects, big and small. People Who did this. FAQ Questions and answers."
