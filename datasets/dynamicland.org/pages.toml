["https://dynamicland.org/publications"]
title = "Dynamicland publications"
full_description = "Dynamicland presentations, reports, articles, &c Dynamicland website 2024: Online real-world collection of the lab’s decade of work, with a cross-referenced archive of all projects. The communal science lab: Founding document for a Realtalk-based science lab, in collaboration with Shawn Douglas, depicting the vision of communal science. Improvising cellular playgrounds in Realtalk: The first scientific presentation using Realtalk as the medium. 15 minute summary + 1 hour presentation. Progress report 2022: Photo-comic of our work in 2022, with reflections on what’s been accomplished and what’s still needed. Radical Decentralization, Radical Empowerment, and Dynamicland: A Dynamicland perspective on the decentralized web. Biomolecular design in Realtalk: Video demonstration of Realtalk in the science lab, showing nanostructure design, wet lab work, and data analysis. 10 minutes. Progress report 2021: Handwritten letter to the community, describing progress through the pandemic and future plans. gentle, a personal history: Robert reflects on the creation and future of his transcript alignment tool. Dynamicland Foundation narrative of activities: Dynamicland’s mission and philosophy as an educational institution, written for our nonprofit application. Progress report 2020: Informal video tour of the lab, demonstrating early progress on Realtalk 2020, with an emphasis on extreme visibility. 20 minutes. Bootstrapping Research & Dynamicland: Bret’s talk on the history of “bootstrapping research”, and how Dynamicland continues this almost-extinct tradition. 30 minutes. At Dynamicland, The Building Is The Computer: Carl Tashian’s investigation into the history and meanings of Dynamicland. The Research Gallery: Extensive report on designing Dynamicland’s dynamic project gallery. Progress report 2014-2019: Photo-comic covering the lab’s first five years of work, and the origins of Realtalk and Dynamicland. TTI/V talk: Luke’s notes for an executive talk on Dynamicland’s principles and aspirations. The Library: Bret’s vision of a dynamic library. Community Learning at Dynamicland: Paula introduces Dynamicland in the context of equity. Students at Dynamicland: A report on student field trips, university residencies, and other engagements with the education community Notes from Dynamicland: Programming Raspberry Pis: Omar’s adventures in integrating electronics into Realtalk. Dynamicland & me: Andrés Cuervo demonstrates his Realtalk projects. The Next Big Thing is a Room: Steve Krouse’s overview and impressions of Dynamicland. Notes from Dynamicland: Geokit: Omar’s report on his Realtalk-based mapping toolkit. Dynamicland at Eyeo: Isaac Cohen’s experience of growing with the Dynamicland community, with an introduction from Paula and Josh. 50 minutes. Dynamicland: A New Direction for Immersive Simulations: Eli Kosminsky describes his Realtalk-based educational simulation kit. La Tabla at the Experimental Gameplay Workshop: Chaim and Luke present their tangible play environment. 8 minutes. Dynamicland at Harvard: Bret presents the community’s Realtalk projects and the principles behind Dynamicland. 45 minutes. The Social Dynamics of Programming Together in Dynamicland: Toby’s note on collaboration and remixing at Dynamicland."
