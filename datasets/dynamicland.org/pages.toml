["https://dynamicland.org/2018/Dynamicland_at_Eyeo"]
title = "Dynamicland at Eyeo"
description = "Isaac’s experience of growing with the Dynamicland community, with an introduction from Paula and Josh. Presented at Eyeo 2018. See also Dynamicland at Harvard."
full_description = "Isaac’s experience of growing with the Dynamicland community, with an introduction from Paula and Josh. Presented at Eyeo 2018. See also Dynamicland at Harvard. Chapters — Intro, Mission, Place — My third place, Journey, Realtalk, Agency, But what if? — Computers are so young, Begin again, Make the ball, Superfluid Isaac’s experience of growing with the Dynamicland community, with an introduction from Paula and Josh. Presented at Eyeo 2018. See also Dynamicland at Harvard. Hello, Eyeo. We are so honored and so excited to be speaking here. Thanks for letting us here to tell you all about Dynamicland. Dynamicland is the convergence of so many different ideas, different people, different possibilities. They all fit together in a really magic way. And sometimes it can be disorienting to hear about it from a distance, because each person's experience with Dynamicland is so unique. So I could give my perspective, my angle, Paula could give hers, but tonight we've decided to let Isaac Cohen, Dynamicland's first artist in residence, tell his story. Some of you may have seen small peeks at what Dynamicland is from Twitter posts or bootleg copies of our zine. But our hope is that once you've heard Isaac's story, these puzzle pieces will fit together a little better. [1] [2] Before we let Isaac loose, it's important for Paula and I to set the stage, and describe Dynamicland's mission in big abstract terms. Get ready, because the terms are going to be big, and they're going to be abstract, and they're going to come fast. So, Josh and I are researchers at the Dynamic Medium Group, a nonprofit research lab in Oakland, California. That's us. Our group's mission is to incubate a humane, dynamic medium whose full power is accessible to all people. This is a long-term research project. We're trying to think 15, 20, 50 years down the line. The project we're presenting today is an experimental step towards this larger mission, not an end in itself. Well, what it means is that we want to find a way to get computing to occupy a role in society similar to the role that writing plays today, as a medium for expression, for communication, and for understanding the world around us."
year_published = 2025
clearnet = "https://dynamicland.org/2018/Dynamicland_at_Eyeo"
