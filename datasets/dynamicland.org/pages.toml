["https://dynamicland.org/archive/2015/Hypercard_in_the_World"]
title = "Hypercard in the World - Dynamicland archive"
full_description = '''March 2015Hypercard in the Worldby Bret Victor, Robert M Ochshorn A live programming environment for the real world. The successor to Room OS (2015), and predecessor of Realtalk (2017). For a full explanation, see the annotated video Hypercard in the World (2016). Projects made in the system are listed in the sidebar to the right. A key point here is that there is no longer code in a "filesystem", no Finder windows, no directories to "ls". All code and data is attached to spatially-located objects, which you can read casually by walking by and looking, and edit by laser-pointing while in the Inspector. I was able to create this program by thinking about it as code attached to a physical object, operating on a physical object, instead of virtual files in a virtual filesystem drawing to a virtual window. Making of. 03/17/15Bret VictorHypercard In The World [plan / design spec] This email describes a new layer to the room system that I'll... 03/17/15Bret VictorRe: Hypercard In The World For reference, here are the "Button Info" dialog boxes for HyperCard. newer... 04/21/15Bret VictorRe: Hypercard In The World [progress report] I should have been documenting the progress more frequently.... 07/15/15Bret VictorRe: Hypercard In The World The system now can track multiple lasers in a single camera. This will make... 01/17/16Bret VictorRe: [journal] organizing state Nagle suggested a "post-mortem" on Hypercard in the World as it currently is, to... "Backend" processes ran in separate windows on a laptop. Daemons are iframes in the lower-left window. An outline of the system, as presented at the meeting described in A computing system for dynamic spatial media (2015). To-do lists.'''
