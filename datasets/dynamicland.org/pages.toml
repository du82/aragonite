["https://dynamicland.org/2019/Progress_report"]
title = "Progress report 2014-2019"
full_description = "If humanity is to have a future, we must become able to see, understand, and discuss the vast invisible systems that shape our world. And if we do become able — to see, touch, and say what is now invisible, intangible, and inexpressible — what a future that could be. We've done this kind of thing before. Written language, mathematical notation, data graphics, interactive computing — each of these inventions enabled humanity to think and communicate in ways that were previously inconceivable. They affected everything, forever. Now we need to do it again, and fast. We need a new medium that enables us to collectively grasp and grapple with the complex systems surrounding us — technical systems, environmental systems, societal systems — that now feel so out of sight, out of reach, out of control. This report outlines Dynamicland’s progress towards inventing this new medium, and incubating a culture that is literate in it. While every year has brought major technical advances, they are merely the backdrop for the series of realizations — glimpses of the future — which have driven the progress. In this report, we hope to share a glimpse of our glimpses. July 2013: YEAR ZERO FOUNDING A LAB. In 2013, we started a new research organization from scratch. Alan Kay suggested the theme “Engelbart in the 21st century“. To us, continuing Engelbart’s trajectory meant: augmentation — inventing new computing systems to support fundamentally new ways of thinking and communicating bootstrapping — inventing new computing systems and committing to live within them We articulated a 40-year vision, recruited a world-class team of dynamic media inventors, built out a space, and set the context with a library and representation gallery. By mid-2014, the initial team was hired and ready to go. July 2014: YEAR ONE EXPLORING THE DYNAMIC MEDIUM. In our first year, we published screen-based projects demonstrating new forms of “reading” and “writing”, designed around the most powerful dynamic techniques we knew — immersive context, direct manipulation, explorable models... A book can be a series of playable dynamic models... We can manipulate functions with our hands instead of symbols... Time-based media needn’t be trapped in time... Media can surround us with context and invite active exploration... We also continued to articulate the long-term vision. Could we design systems in a physical environment with everything visible? Could a humane dynamic medium be grounded in the physical world? DISCOVERING SPATIAL MEDIA. We were supposedly doing computing research, but more and more, we couldn’t achieve what we sought within the bounds of a computer screen. To get real immersive context and direct manipulation, we found ourselves designing posters, dioramas, physical models, board games... We can see context and connections! We can see the shape of the whole! We can think with our hands and bodies! Could a poster be interactive? The yearning to interact with our posters led directly to our first-generation spatial computing systems, most notably “Hypercard in the World”, in which authors program by pointing directly to physical objects in the real world. We can explore details and context at the same time! Dynamic media can live in our shared physical reality! Programs can be real things! We can use the whole space to dynamically show context! The building is the computer! NASA launched the space shuttles from a control room, surrounded by views of everything that was going on. new medium must likewise exist in physical space, where complex concepts can be shown in their entirety."
year_published = 2025
