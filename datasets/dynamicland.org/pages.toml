["https://dynamicland.org/2019/Bootstrapping_Research"]
title = "Bootstrapping Research & Dynamicland"
description = "A history of “bootstrapping research”, and how Dynamicland continues this almost-extinct tradition. Presented at Stripe."
full_description = '''A history of “bootstrapping research”, and how Dynamicland continues this almost-extinct tradition. Presented at Stripe. Chapters — Intro — Research, Bootstrapping, Dynamicland's research, Dynamicland as bootstrapping — An experiment in lifting humanity A history of “bootstrapping research”, and how Dynamicland continues this almost-extinct tradition. Presented at Stripe. I was asked to say a few words about the thread of research that my group and I have been involved in for several years. It actually extends from a thread of research going back 60 years. And it's kind of hard to fit 60 years into a 30-minute talk. So hopefully I'll be able to hit some of the main themes. Everybody here is familiar with the processes of commercial product development. But I've found that there tends to be less widespread understanding about just what research is and what it's for. So I want to talk a bit about that. And also, in particular, a special form of research called "bootstrapping", which has been unusually fruitful in creating everything that we do every day. And then I'll talk a little bit about what my research group has been up to, and how we fit in with that tradition. My research group is called Dynamicland. We're a nonprofit. We are four people at the moment. And we and some friends have set up a little exhibit in the hallway down there if you want to take a peek afterwards. You can select it with a pointing device. That's a pretty cool idea. You can copy and paste it. Those are pretty incredible ideas. These are literally world-changing ideas exhibited here in this interface. This was designed at Stripe, of course, but they're in every interface I've ever designed, and every interface that all of us use every day. But somebody did. And those somebodies were researchers working in research labs. So, to call out a few of my personal favorites... Here's Ivan Sutherland in the early 60s, inventing interacting with dynamic graphics on a screen. [more] And in the late 60s, we have Doug Engelbart's project at Stanford Research Institute, where he's inventing working with large amounts of textual information on a screen, selecting with a pointing device. He invented the pointing device. Sharing that with other people who have their own screens. Clicking on links. It all came out of NLS. [more]'''
year_published = 2025
clearnet = "https://dynamicland.org/2019/Bootstrapping_Research"
