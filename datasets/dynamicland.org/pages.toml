["https://dynamicland.org/2017/Zine"]
title = "Dynamicland zine"
full_description = '''Dynamicland is a place for all people to build, study, play, speak, learn, in fundamentally new ways. (Also it's a new kind of computer.) We are a non-profit, long-term research group in the spirit of Doug Engelbart and Xerox PARC. We are inventing a new computational medium where people work together with real objects in physical space, not alone with virtual objects on a screen. We are constructing a community workspace at 9th and Broadway in Oakland. The entire building is the computer. First, some context. Dynamicland is about TOOLS TO THINK NEW THOUGHTS. Clay tokens (8000 BC) were the precursors of both writing and mathematics. Each shape stood for a different commodity. These physical objects enabled people to compute by arranging, rearranging, and grouping them, to communicate these computations, and to store accounts. The alphabet (800 BC) physicalized speech. Intangible, ephemeral sounds became physical marks that could be seen, studied, played with, and preserved. Alphabetic writing has been credited with the “Greek miracle” of philosophy, art, and literature around 400 BC. The printing press (1450 AD) gave ideas a physical form that was portable and replicable. Print made possible mass literacy and the democratization of knowledge. The invention of journals, citations, and data graphics ushered in the scientific revolution. The personal computer (1970 AD) enabled dynamic media. Doug Engelbart saw it as a tool to augment the intellect of knowledge workers, and enable humanity to solve the world’s complex problems. Seymour Papert saw it as a generator of microworlds, where one could learn math in “Mathland” like learning French in France. Alan Kay saw it as a medium for reading and writing with systems and simulations, as opposed to stories and arguments, giving humans a new lens to understand the world. These inventors of the personal computer envisioned it as a medium to empower humanity and lift up civilization. It has that potential. But as long as the computer is a closed box, it only truly empowers the select few with keys to the box. Like scribes before the printing press. And as long as computation resides in intangible virtual worlds, it leaves untapped the vast range of human capabilities for working with thoughts as things. Things that can be seen with the eyes, manipulated with the hands, and placed in physical space. Dynamicland is a computer with no box. People walk around inside it. Computer-stuff is not made of fleeting, ephemeral images on a screen, but real physical things that enable people to think with their whole selves. (Film editor Walter Murch surrounds himself with reference photos. "The photos are vinegar and I'm a cucumber - the goal is to get pickled by them.") (Mathematician and Flelds medalist Maryam Mirzakhani works out her ideas as pictures on large sheets of paper.) (Eyes and brains are only found in animals that move. The sea squirt swims around until it settles into a permanent home, then digests its brain. Brains evolved for movement.)'''
