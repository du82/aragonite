["https://dynamicland.org/2024/Intro"]
title = "Dynamicland intro"
description = "6-minute introduction to communal computing. For more, see the front shelf or FAQ."
full_description = "Chapters — Intro — Real world, Communal computer, Authoring — Realtalk, Dynamicland, Communal science — Agency, Literacy What that means is a way for real people in the real world to explore ideas together, not just with words and pictures, but with computation. It means working out in the real world with physical materials. Putting computational programs onto ordinary physical objects. So, it's computation like electric lighting. Wherever people need to be, whatever stuff they need to work with. [more] This typically makes use of projectors and cameras up above, although you're free to use any means of sensing and affecting the physical world. [1] [2] It means everyone's work is out in the open, where everyone can see it. So, everyone's learning from everyone else all the time, and collaborations happen spontaneously. It means having discussions where facts and data are on the table, so the discussion can be grounded in reality. [more] And computational models are on the table. Everyone can use the full power of computation to see what they're talking about. [more] So, instead of a personal computer, this is a communal computer, designed for entire communities to work together in person. [more] It means everyone making all this for themselves, for their own needs, and their own situations. [more] A program can be in language, or it could be an arrangement of components. Or it could be a hand-drawn diagram. [more] Programs tend to be very simple and small, because a lot of the work happens out in the real world. [1] [2] Because, in this environment, people are surrounded by programs. They're constantly handling them and remixing them. [more] And they're surrounded by other people, working out in the open with everything visible, everyone learning from everyone else all the time. Whatever it is, everyone can see the whole thing, and anyone can change anything at any time. It's just part of the space. [1] [2] For years, we've done all of our day-to-day work in Realtalk. It's a complete self-hosted computing system. [1] [2]"
year_published = 2025
clearnet = "https://dynamicland.org/2024/Intro"
