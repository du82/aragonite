["https://dynamicland.org/2018/Dynamicland"]
title = "Dynamicland at Harvard"
description = "An introduction to the principles behind Dynamicland, and projects from the Dynamicland community. Presented at Harvard GSD. See also Dynamicland at Eyeo."
full_description = "An introduction to the principles behind Dynamicland, and projects from the Dynamicland community. Presented at Harvard GSD. See also Dynamicland at Eyeo. Chapters — Intro, This not that, Place — Visibility, Composibility, Physicality, Facts, Authoring — A communal computer, Agency not apps, The whole human An introduction to the principles behind Dynamicland, and projects from the Dynamicland community. Presented at Harvard GSD. See also Dynamicland at Eyeo. Dynamicland is, among other things, a new kind of computer. It's a new kind of computing environment. And so I think, in the context of this conference, it's interesting as a case study of what it would be like to reinvent computing from the ground up around a very explicit set of design principles. And in particular, a set of design principles that aren't really available to most designers that are working within status quo technology. So, Dynamicland is a computer. It's also a place. We have a building. You can walk up to it and ring the doorbell and come in. And those aren't separate things. The building is the computer, the computer is the building. Specifically, we're trying to make a community space. So, in the long term, aspiring to something that has the presence of a public library, or a museum, one of these respected public institutions. So, it's a community space. And it's also our research lab. And again, there isn't really that much of a distinction between the two of these things. The community is participating in the research. And what they do there is folded into the research. And in particular, we're trying to design a medium around the needs that are demonstrated by the community that's using it, as opposed to our own needs, or personas, or whatever. As far as community, we're based in Oakland, California, which -- I don't know if is, but was at one point -- named the most diverse city in America, of its size, of a particular set of diversity metrics. And so that means that the community that we have access to is a wide cross section of people, which was deliberate."
year_published = 2025
