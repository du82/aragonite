full_description = "August 2017Particle binderby Toby Schachman, Josh Horowitz Iterations of a particle simulation, collected into a binder. One of the first instances of pages demonstrating dynamic behavior on themselves, and on objects around them. 0:560:200:52 Composing effects. Pages within pages. 0:340:230:11 With Dragglebot (2017) and Spring joystick (2017). The joystick-controlled dot is seen as a planet with an attractive field. 0:19 With Scrub number on page (2017). 0:160:290:17 One of the first instances of pages demonstrating dynamic behavior on themselves, and on objects around them. With Dragglebot (2017) and Spring joystick (2017). The joystick-controlled dot is seen as a planet with an attractive field. Controlling a video by flipping physical pages began with Robert's Video binder (2015) and Blue Book / Silver Book (2015). In Toby's Video binder (2016), videos play on the page itself, and the pages can be moved and removed. Realtalk made it trivial to put together dynamic books, such as Toby's Particle binder (2017) or Isaac’s The Owl's Surprise (2017). Once Luke added video support, video pages were one line of code. Examples include Virginia's Fun Times At Dynamicland (2017) and Bret's Meme Kit (2017)."
