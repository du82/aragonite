["https://dynamicland.org/archive/2015/Serengeti"]
title = "Serengeti - Dynamicland archive"
full_description = '''June 2015Serengetiby May-Li Khoe, Bret Victor, everyone A HyperCard-like dynamic diorama. Laser an animal to hear its sound. 0:24 Because this was created in a shared physical space, it naturally attracted collaborators, who worked together side-by-side. Over time, everyone in the group put at least one object into the scene, some simple and some with advanced behavior. 0:39 Explanation excerpted from the annotated video Hypercard in the World (2016). 3:41 See also Laser painting (2015). Drawing the animals. Making the diorama. Adding the backdrop. Blessing the dog. This is how the animals are brought to life. 1:06 The sun dances. 0:04 The raincloud toggles on and off. 0:190:07 The frog catches the laser pointer with its tongue. 0:140:22 The unicorn sparkles. 0:06 You can put your face on the bunny. 0:040:110:09 The wall audio player contains the program that plays the sounds. 0:220:270:13 The email thread. Nagle and May-Li were accustomed to "write code on the computer, then run it", and I had to make them do the opposite -- put the unicorn/anglerfish into the scene, bless it, and then write code on the animal itself. 06/17/15Bret Victorserengeti Yesterday, we started making a "dynamic diorama". video: [IMG_7878.m4v]... 06/17/15Glen ChiacchieriRe: serengeti I am super excited about both this diorama and how demonstrative it is! It feels... 06/17/15Bret VictorRe: serengeti Here is a frog. [IMG_7887.mov]... 06/17/15Bret VictorRe: serengeti Here is the "wall audio player". [IMG_7891.mov] It's a little silly (the whole... 07/02/15Bret VictorRe: serengeti I added a bunny to the diorama. You can put your face on the bunny.... 07/02/15Robert M OchshornRe: serengeti > On Jul 2, 2015, at 9:33 PM, Bret Victor < **************** > wrote: > I'm... 06/21/16May-Li KhoeSerengeti footage Download full resolution images Available until Jul 21, 2016 … that... More photos. 0:250:25'''
