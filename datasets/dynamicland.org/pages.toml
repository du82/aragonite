["https://dynamicland.org/2024/FAQ"]
title = "Dynamicland FAQ"
full_description = "An independent nonprofit research lab, whose mission is to enable universal literacy in a humane dynamic medium. This involves inventing a humane form of computing, and developing educational and community-based institutions in which a culture can grow. [more] A computing environment (operating system, programming languages, philosophy) invented by Dynamicland researchers to enable us to prototype a new medium. In Realtalk, people work together side-by-side in the real world, using their hands to create and explore computational models made of physical materials. Realtalk is made in Realtalk itself, and we do all of our day-to-day work in it. [more] From 2017 to Covid, Dynamicland was a community workspace in Oakland, California. Through ongoing community hours, open houses, workshops, and residencies, a thousand participants created hundreds of projects that could not have existed anywhere else, and helped define what communal computing looks like. Documentation of what we’re hoping to achieve, what we’ve accomplished so far, and the steps along the way. We are reporting our progress, not selling or promoting anything. The entire website is made in Realtalk, which means that everything on it physically exists. (Even this sentence.) It’s not a rendering of a virtual space — it’s a real place. [more] A small staff of full-time researchers over the last decade, supported by a community of volunteers and collaborators. [more] You sure can. The Dynamicland Foundation is an independent 501(c)(3) nonprofit, supported entirely by donations and an occasional grant. Donations are fully tax-deductable, and go entirely to the research. We might be able to make good use of your services, equipment, or real estate, and donations of assets are tax-deductable. Please get in touch. If you represent a hardware vendor — computers, cameras, projectors, printers, CNC, robotics, motion-control systems, scientific instruments, anything that physically exists — we’d love to discuss a sponsorship."
year_published = 2025
clearnet = "https://dynamicland.org/2024/FAQ"
