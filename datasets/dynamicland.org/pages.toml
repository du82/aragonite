["https://dynamicland.org/2020/Progress_report"]
title = "Progress report 2020"
description = "Informal video tour of the lab, demonstrating early progress on Realtalk 2020, with an emphasis on extreme visibility."
full_description = "Informal video tour of the lab, demonstrating early progress on Realtalk 2020, with an emphasis on extreme visibility. Informal video tour of the lab, demonstrating early progress on Realtalk 2020, with an emphasis on extreme visibility. It's been a while since you visited, so I thought it was about time to catch you up on what we've been up to. I wish I could invite you over, but that's not really possible right now, so I thought I'd try a video tour. The four of us have been working from home, which is not ideal for Dynamicland, but it's actually possible because we all have dynalamps in our homes right now, and I'll talk about what that means. That's really exciting. We wanted the entire system, top to bottom, to be visible and tangible and gather-aroundable and get-your-hands-on-able, and basically to be the most accessible, visible operating system there's ever been. Instead of having isolated islands of computation, we want to be able to make activities that span as much space as they need, even taking up whole buildings, and allow you to light up whatever space you need to make the thing that you want to make. Which is really about being able to make dynamic material out of any physical material that you need, instead of just using pieces of paper. And to be able to express your ideas, not just in text, but in any kind of form. I think the last time you visited, we were doing some very low-level stuff with the timeline here. There was the mutexes locking and unlocking, and all that. [more] That was when we were building up the very low levels of the system, and felt that, like everything else, we needed to be able to see what was going on as we were doing this. [more] What you're seeing here is compiling a very simple process that does nothing but sleep. But even as a simple process, it has an address space. [more] And we can see what's in the process image, and we can see the dynamic libraries that were loaded in. And here's the heap, and here's the stack, and here's the symbols. [more]"
year_published = 2025
clearnet = "https://dynamicland.org/2020/Progress_report"
