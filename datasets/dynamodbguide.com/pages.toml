["https://dynamodbguide.com/hierarchical-data"]
title = "Hierarchical Data | DynamoDB, explained."
description = "Walkthrough example of modeling hierarchical data with DynamoDB"
full_description = '''In this example, we'll show how to model hierarchical data using DynamoDB. We'll insert a real dataset of 25,000 Starbucks locations into DynamoDB. You can follow along with some real example code from the examples directory in this site's repository. Hierarchical data is a common relational data pattern for representing tree-like data structures, such as an organizational structure, a project breakdown list, or even a family tree. In a relational database, it often uses quite a few JOINs to get your answer. Here, we'll see how we can model this data using a single table to enable fast, precise lookups. This example is inspired by Rick Houlihan's talk at reInvent 2017. Check here for the relevant section. Imagine we are Starbucks, a multi-national corporation with locations all around the globe. We want to keep our store locations in DynamoDB, and we have five main access patterns: The first query pattern is straight-forward -- that's a 1:1 relationship using a simple key structure. The next four are more difficult. It could require four different global secondary indexes on each of those distinct attributes. Alternatively, we could make use of filtering to narrow down to our desired query, but this would consume more read capacity than is necessary. Instead, we can leverage the hierarchical nature of the location data to answer all four "gather" queries using a single global secondary index 💥 ! Amazingly, there is a Kaggle dataset with all of the Starbucks locations worldwide -- over 25,000 locations! This means we can actually load the data into a DynamoDB table and test it for ourselves. To run this example, you'll need to download the Starbucks locations dataset from Kaggle. Unzip it, and move the CSV file into your working directory as directory.csv. You'll also need Python and Boto3, the AWS SDK for Python. You can install boto3 with pip via pip install boto3. If you don't have Python or pip, you'll need to do some Googling to find it. Finally, some of the examples use Click, which is a Python tool for quickly making CLI interfaces. You can install it with pip install click.'''
