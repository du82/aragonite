["https://dynamodbguide.com/secondary-indexes"]
title = "Secondary Indexes | DynamoDB, explained."
description = "Learn about secondary indexes with AWS DynamoDB."
full_description = "Up to this point, most read operations have used a table's primary key directly, either through the GetItem call or the Query call. Using a table's primary key is the most efficient way to retrieve Items and avoids using the slow Scan operation. However, the requirement of using a primary key limits the access patterns of a table. In our Query example, we saw that we could include the order date in our RANGE key to enable fast lookups of a customer's orders by date. Yet this means we don't have a fast way of accessing customer orders by the amount of the order, which is a non-key attribute. To retrieve a subset of a customer's orders based on amount, we would need to use a filter which is only applied after all the customer's orders are retrieved. Fortunately, DynamoDB has a concept of secondary indexes. Secondary indexes allow you to specify alternate key structures which can be used in Query or Scan operations (but not GetItem operations). In this lesson, we'll discuss the two types of secondary indexes, and we'll cover some basic rules for working with secondary indexes. Local secondary indexes can be used on a table with a composite primary key to specify an index with the same HASH key but a different RANGE key for a table. This is useful for the scenario mentioned in the intro above -- we still want to partition our data by Username, but we want to retrieve Items by a different attribute (Amount). Global secondary indexes can be used to specify a completely different key structure for a table. If you had a table with a composite primary key, you could have a global secondary index with a simple key. Or, you could add a global secondary index with a completely different HASH key and RANGE key. If your table has a simple primary key, you could add a global secondary index with a composite key structure. No uniqueness requirement. Recall that for a table's primary key, every item is uniquely identified by its primary key. Thus, you can't have two Items with the same key in a table."
year_published = 2025
clearnet = "https://dynamodbguide.com/secondary-indexes"
