["https://dynamodbguide.com/local-secondary-indexes"]
title = "Local Secondary Indexes | DynamoDB, explained."
description = "Learn about local secondary indexes with AWS DynamoDB"
full_description = "In the previous lesson, we learned some basics about secondary indexes. In this lesson, we'll dive deeper into local secondary indexes. First we'll cover some basics about local secondary indexes, then we'll walk through an example. You can only add local secondary indexes on tables with composite primary keys. A local secondary index maintains the same HASH key as the underlying table while allowing for a different RANGE key. Must be specified at table creation. You cannot add a local secondary index to an existing table. It must be provided at creation. This is different than global secondary indexes. 10GB limit per HASH key. For a given HASH key, you may only store 10GB of data. This includes the size of the items in the base table plus the combined size of the items in all local secondary indexes. This is a tricky one and is a good reason for being judicious with your projected attributes. Consistency options. For local secondary indexes, you may choose between strong consistency and eventual consistency, just like on the underlying table. Strong consistency will consume more read capacity but can be the right choice in some situations. Shares throughput with underlying table. All local secondary indexes use the read and write capacity units of the underlying table. Let's see a local secondary index in action. Remember that it can only be used on a table with a composite primary key, so that rules out our Users table from earlier. Let's apply it to our UserOrdersTable instead. Recall that we did an example in the filtering lesson about searching for a particular User's Orders that exceeded a given amount. Because Amount wasn't a part of the primary key, we had to first retrieve all Orders for a User, then apply the filter to return only those beyond a certain amount. This query could be inefficient if we were paging through a large number of Orders for a User -- we might have to make multiple requests to find the small number of Orders over a given amount. Instead, we'll add a local secondary index using the Amount as a sort key. This will enable fast, specific lookups using the Amount column."
year_published = 2025
clearnet = "https://dynamodbguide.com/local-secondary-indexes"
