["https://dynamodbguide.com/querying"]
title = "Querying | DynamoDB, explained."
description = "Learn how to retrieve multiple items with the Query operation with AWS DynamoDB"
full_description = '''Querying is a very powerful operation in DynamoDB. It allows you to select multiple Items that have the same partition ("HASH") key but different sort ("RANGE") keys. In our previous chapter, we looked at working with individual Items at a time. That can be useful in some scenarios, such as working with Users. We're usually manipulating a single User at a time, whether retrieving a User's profile or changing a User's name. It's less helpful in other situations, such as working with Orders. Occasionally we want to grab a specific Order, but we also may want to display all the Orders for a particular User. It would be inefficient to store the different partition keys for each User's Orders and query those Items separately. Let's see how we can satisfy the latter request using the Query API call. First, we'll retrieve all of the Orders for our daffyduck User. The --key-condition-expression option is the important thing to view here. It's how we define which items to select. This is really useful. On an Orders overview page, we could show all of a User's Orders with the ability to drill into a particular Order if the User desired. When querying to return Items, you might want to further limit the Items returned rather than returning all Items with a particular HASH key. Give me all of the OrderIds for a particular Username where the Order was placed in the last 6 months. There are two different ways we can handle this further segmentation. The ideal way is to build the element we want to query into the RANGE key. This allows us to use Key Expressions to query our data, allowing DynamoDB to quickly find the Items that satisfy our Query. A second way to handle this is with filtering based on non-key attributes. This is less efficient than Key Expressions but can still be helpful in the right situations. In this section, we'll see how to use Key Expressions to narrow our results. We've already used the --key-condition-expression option to indicate the HASH key we want to use with our Query. We can also include a RANGE key value or an expression to operate on that RANGE key.'''
year_published = 2025
