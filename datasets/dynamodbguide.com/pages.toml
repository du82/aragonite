["https://dynamodbguide.com/working-with-multiple-items"]
title = "Working with Multiple Items | DynamoDB, explained."
description = "Learn how to create a table with a composite primary key and insert multiple items with AWS DynamoDB"
full_description = '''In the previous chapter, we worked with a single Item at a time -- inserting, retrieving, updating, and deleting. In this chapter, we're going to work with multiple items at a time. We'll explore this in the context of a DynamoDB table that's using a composite primary key. A composite primary key is useful for using DynamoDB as more than a simple key-value store. It allows you to work with a group of related items with a single query and enables some powerful use cases. In this lesson, we'll create a table with a composite primary key. Then, we'll seed it with some data using the BatchWriteItem API call. In the next lessons, we'll work with this data using the Query and Scan API calls. Creating a table with a composite primary key is similar to creating a table with a simple primary key. You define the attributes and your key schema when creating the table. The main difference is that you'll need to define two attributes rather than one. You then have to specify which attribute is your HASH key and which is your RANGE key. The HASH key is how your data is partitioned, while the RANGE key is how that data is sorted within a particular HASH key. The HASH key is particularly important -- you can only grab data for a single HASH key in a Query operation. The HASH and RANGE keys allow for a one-to-many like structure -- for a single HASH key, there can be multiple RANGE keys. When thinking about how to set up our data structure, think how you would fill in the blanks for the following query: The element you put in the first blank should be your RANGE key, while the element you put in the second blank should be your HASH key. In our example, we're going to make an Orders table. Each Order is placed by a User and is given a specific OrderId. Using our question from above, we would ask "Give me all of the OrderIds for a particular Username", but we wouldn't ask "Give me all of the Usernames for a particular OrderId", as an Order is placed by a particular User. Given that, Username is our HASH key and OrderId is our RANGE key.'''
year_published = 2025
clearnet = "https://dynamodbguide.com/working-with-multiple-items"
