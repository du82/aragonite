["https://dynamodbguide.com/global-secondary-indexes"]
title = "Global Secondary Indexes | DynamoDB, explained."
description = "Learn about global secondary indexes with AWS DynamoDB."
full_description = "In this example, we'll learn about global secondary indexes. Just like the last lesson, we'll cover the basics first before diving into an example using some tables we've already created. Unlike local secondary indexes, you can add global secondary indexes to tables with either simple primary keys or composite primary keys. Further, you're not limited to creating a composite key schema for your index -- you can create a simple key schema. Separate throughput. You provision read and write capacity units for a global secondary index separate than those units for the underlying table. This may add complexity and cost but also gives you flexibility to tailor the capacity to different workloads. Eventual consistency. When writing an Item to a table, it is asynchronously replicated to global secondary indexes. This means you may get different results when querying a table and a global secondary index at the same time. You do not have the ability to specify strong consistency. No partition key size limits. Partition keys are limited to 10GB between the table Items and all local secondary indexes. Global secondary indexes are not counted in these limits. Use on any table. Local secondary indexes may only be used on tables with composite primary keys. Global secondary indexes do not have this restriction -- you can use them on tables with simple or composite primary keys. Use with any key schema. When specifying the key schema for your global secondary index, you can use either a simple or a composite key schema. The last two points can be confusing. The first refers to the primary key schema of the underlying table, while the second refers to the key schema of the secondary index you're creating. Like local secondary indexes, you may specify a global secondary index when you initially create a table. However, you may also add a global secondary index after a table is already created. DynamoDB will backfill the global secondary index based on the existing data in the table. In this example, let's show how we might use a sparse index for our global secondary index. A sparse index is when not every Item contains the attribute you're indexing. Only Items with the attribute(s) matching the key schema for your index will be copied into the index, so you may end up with fewer Items in the index than in the underlying table."
year_published = 2025
clearnet = "https://dynamodbguide.com/global-secondary-indexes"
