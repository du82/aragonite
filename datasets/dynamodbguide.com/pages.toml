["https://dynamodbguide.com/leaderboard-write-sharding"]
title = "Leaderboard & Write Sharding | DynamoDB, explained."
description = "Walkthrough example of maintaining a global leaderboard with DynamoDB. The example uses write sharding and a scatter-gather pattern to alleviate throttling issues."
full_description = "In this example, we'll show how to maintain a global leaderboard with a dataset in DynamoDB. A leaderboard is a common need for data applications. Imagine that you're saving information on individual items that you need for individual lookups, but you also want to be able to find the Top N Items as ranked by a particular attribute. The guiding example for this is a website that hosts a number of images -- think Unsplash. In addition to retrieving the details on any given image, we also want to find the top-viewed items to show to users. In this walkthrough you will understand how to use write sharding combined with a scatter-gather query to satisfy the leaderboard use case. Hat tip to Chris Shenton for initially discussing this use case with me. Also, AWS provides a leaderboard example using game scores in the DynamoDB docs. However, that example uses leaderboards within multiple different games, rather than a global leaderboard as we have here. In this example, we're a photo sharing website. People can upload photos to our site, and other users can view those photos. Additionally, we want to have a discovery mechanism where we show the 'top' photos based on number of views. The first three access patterns are straight-forward. These are key-based operations, which are perfect fits for DynamoDB. The fourth access pattern is the tricky one. Recall that DynamoDB is designed for specific, key-based operations. But finding the top score means we need knowledge of the entire DynamoDB key space. This sounds like it requires a scan, which we know we should never do. Fortunately, we have a better answer. We're going to use a combination of global secondary indexes, write sharding, and scatter-gather queries to implement this without running a full table scan. Now, let's start with the nitty-gritty of designing and using our table. We will start with the three core use cases. Recall that our three core use cases (create, read, and update an image) are all key-based lookups for a particular image. Each image will have a URL path in the form of images/<id>.jpg. This path is a unique identifier for the image, so we'll use it for the table's primary key."
year_published = 2025
clearnet = "https://dynamodbguide.com/leaderboard-write-sharding"
