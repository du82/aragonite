["https://dynamodbguide.com/filtering"]
title = "Filtering | DynamoDB, explained."
description = "Learn how to filter your DynamoDB queries"
full_description = "In previous sections, we've covered key expressions, condition expressions, projection expressions, and update expressions. This lesson discusses the final kind of expression -- filter expressions. Filter expressions are used to apply server-side filters on Item attributes before they are returned to the client making the call. Before we dig too deeply into filters, let's first understand what's happening during a Query or Scan API call. For the DynamoDB Query and Scan operations, there are three separate steps happening on the DynamoDB server: Retrieve the requested data. This step looks at Starting Token (if provided) for both types of operations, and the Key Expression in a Query operation. (Optionally) Filter the data retrieved in step 1. This includes applying filters as described in this section or projection expressions as discussed in previous lessons. An important note is that any limitations on reads are applied in Step 1, before a filter or projection expression is applied. If you retrieve 100KB of data in Step 1 but filter it down to 1KB of data in Step 2, you will consume the Read Capacity Units for 100KB of data, not the 1KB that it was filtered to. Further, there is a 1MB limit that is applied to all operations, regardless of the read capacity units on a table. Filtering and projection expressions aren't a magic bullet - they won't make it easy to quickly query your data in additional ways. However, they can save network transfer time by limiting the number and size of items transferred back to your network. They can also simplify application complexity by pre-filtering your results rather than requiring application-side filtering. For more on filter expressions and when to use them, check out this post on When to use (and when not to use) DynamoDB Filter Expressions. Filter expressions are just like key expressions on Queries -- you specify an attribute to operate on and an expression to apply. Let's reuse our previous Query to find Daffy Duck's orders. This time, we're looking for the big ticket orders, so we'll add a filter expression to return Orders with Amounts over $100:"
year_published = 2025
clearnet = "https://dynamodbguide.com/filtering"
