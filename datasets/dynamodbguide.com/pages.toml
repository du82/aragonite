["https://dynamodbguide.com/inserting-retrieving-items"]
title = "Inserting & Retrieving Items | DynamoDB, explained."
description = "Learn how to create a table, insert items, and retrieve items with AWS DynamoDB."
full_description = '''Items are the key building block in DynamoDB. In this lesson, we're going to learn the basics of inserting and retrieving items with DynamoDB. We'll create a Users table with a simple primary key of Username. Then, we'll explore two basic API calls: PutItem and GetItem. This lesson will only cover the basics of using these API calls. The next lesson will explain using expressions in these API calls for advanced functionality. Then we'll move on to updating and deleting items in the following lesson. To follow along with the examples in this lesson, make sure you have your environment set up properly. Note that I'm appending a $LOCAL variable to the end of every command to facilitate those using DynamoDB Local. The first step is to create our table that we'll use throughout this example. We want to create a table to hold Users that will use a simple primary key of "Username", which is a string. When creating a table, you will need to provide AttributeDefinitions for each attribute you need to define. An attribute definition includes the name and type of the attribute. For us, this means we have an attribute with the name "Username" and of type "S", for String. You only need to define attributes which are used in your primary key or are used in secondary indexes. You'll then need to provide the KeySchema of your table. This is where you define your primary key, including a HASH key and an optional RANGE key. In this example, we're using a simple primary key so we're just using Username as a HASH key. Finally, you'll need to specify a TableName and the ProvisionedThroughput for your table. We'll keep the Read and Write Capacity Units at 1 since this is just an example. Now that we have a table, let's throw some data into it. We'll be using the PutItem API call to DynamoDB. With the PutItem call, you provide an entire Item to be placed into your DynamoDB table. This action will create a new Item if no Item with the given primary key exists, or it will overwrite an existing Item if an Item with that primary key already exists.'''
