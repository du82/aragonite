["https://dynomight.net/colonoscopies"]
title = "You’re Invited to a Colonoscopy!"
description = "thoughts on tubes"
full_description = "This is the first part of an article that just appeared in Asterisk magazine. You can read the whole thing here. One of the first things internet writing teaches you is that you don’t get to choose what other people like. But this article represents, I don’t know, 40 or 50 grugs of effort? Plus more from Asterisk’s fabulous editors and fact-checkers? So if you wanted to try to like it… Colonoscopies are the first-line method for preventing colorectal cancer in America —and almost nowhere else. But do they work? We finally have a comprehensive trial, but it’s left gastroenterologists with more questions than answers. Colorectal cancer is the second-most deadly cancer, killing over 1 million people per year around the world — 1.7% of all deaths. In the United States, where colorectal cancer causes 50,000 deaths per year, the foundation of the fight against it is the colonoscopy. Getting one periodically is recommended for everyone over the age of 45. Colonoscopies are rarely used for screening elsewhere but have been standard in the U.S. for decades. There are many reasons to think that they should work. But they are also expensive, invasive, unpleasant, and rarely — but not that rarely — have serious side effects. Are they worth it? Until recently we didn’t have any randomized controlled trials that directly tested how well colonoscopies work. We finally just got one and the results were — how can I describe them? Confusing? Ambiguous? Frenzy-inducing? Let’s try to understand what to make of this trial, and why American gastroenterologists were so quick to criticize it. After you swallow food, your body uses rhythmic waves of contractions to send it on a 4-meter (13-foot) journey through your esophagus, stomach, and small intestine. These extract most of the food’s nutrients and render it into a pulpy acidic fluid called chyme. The chyme then travels through your colon, a 1.5-meter (5-foot) tube that reabsorbs water and electrolytes, creating a solid mass that is then moved to your rectum for storage and eventual disposal. Yay!"
