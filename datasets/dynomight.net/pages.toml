["https://dynomight.net/happiness"]
title = "Nobody optimizes happiness"
description = "People don’t seem to try very hard to make themselves happier. Why not?"
full_description = "Everyone I know is scheming for the future. They’ve got big goals and get up every day and work like mad to try to achieve them. I’ve always found something odd about that: Despite all this effort, people don’t seem to think too much about the specifics of what would happen after their goal is achieved. Like—say your startup goes public and you become a billionaire. What now? What will you buy, where will you live, what will you eat for lunch? Don’t worry, I won’t tell you to abandon your goals and detach yourself from desire. I’m just observing that even if you achieved your goals, you’d need to make a huge number of decisions to convert them into a “life” and then (hopefully) happiness. And people don’t seem to think much about those decisions. My favorite evidence comes from the FIRE (financial independence / retire early) community. There are tons of people who work hard, minimize expenses, and retire young. Some people who do this are totally happy. But there are also a lot of reports like: I retired at 39. It sucked after about 6 months. I went back to college for a bit and eventually went back to work in a new career. Boredom was the worst. Been FIRE for 10 months and it’s been extremely challenging for me. I’ve lost my drive to do activities, learn, etc. and I simply feel unfilled. When I was working, I felt mostly satisfied so this is a departure. The typical advice the FIRE community gives these people is to become more intentional about how you structure your life—to the point of having spreadsheets and weekly status reports. Nobody is just “automatically” happy after retirement, you have to build a life. What does this mean? I think it shows that we didn’t choose our goals to maximize our happiness. You could imagine someone sitting down and considering all the possible world-states in the future, and scoring each by how happy they would be. Then, they could choose actions to increase the expected value. It seems to me that most of us spend our days chasing after goals that weren’t chosen that way at all."
