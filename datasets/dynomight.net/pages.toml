["https://dynomight.net/statins"]
title = "How many extra days of life do you get from taking statins?"
description = "How much do statins extend lifespan? An analysis based on a meta-analysis of six peer-reviewed papers."
full_description = "It’s hard to say how much running increases lifespan. To test it, you should take thousands of people, tell half to run, and then follow everyone for years while making sure they follow their instructions. That’s not easy, and even if you did it, you still have to worry: Did the running itself make people healthier? Or did people get more sunlight while outside or make friends at the park or get a placebo effect from the belief that running is healthy? The easiest place to find effect sizes should be small-molecule drugs: There’s no interaction with lifestyle, you can control for placebo effects with placebo pills, and these experiments are what the medical system, in its grace, loves to spend money on. And in terms of small-molecule drugs, what should be easiest? I chose statins, the drugs that 200 million people around the world take to control cholesterol. These are old, cheap, commonly used, and thought to have huge effects, so we have lots of big studies. As an aside, statins have an interesting mechanism of action: They bottleneck the body’s pipeline to make cholesterol. They are designed to sort of get stuck on the HMG-CoA reductase enzyme where HMG-CoA is supposed to go. This means that the enzyme can’t make mevalonic acid, which is needed to make cholesterol. Anyway, there are many meta-analyses for statins out there, but they typically work on risk ratios, i.e. the relative chance that someone will suffer a heart attack or die during a given period. These are great, but they aren’t particularly actionable: If I don’t have a great sense for what my odds of dying are (which I don’t) then it’s hard to say how much I should care if those numbers get multiplied by a given constant. So, being a fan of simple-minded “number of days of life” effect sizes, I was excited to find the paper, The effect of statins on average survival in randomised trials, an analysis of end point postponement by Kristensen et al. They try to do exactly what we want:"
