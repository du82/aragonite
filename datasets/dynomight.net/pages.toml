["https://dynomight.net/bad"]
title = "Attitudes one can take towards people who have behaved badly"
description = "humans and social punishment"
full_description = "Have you ever noticed that reality has some properties that are quite annoying? For example, have you noticed that some people do bad things? And yet those same people sometimes have interesting ideas? Occasionally, I’ll bring up an idea in conversation and someone will gently remind me that the person who came up with the idea is bad. I’ve never been sure what to do with that information. I stress that I am open to this idea! For example, I’ve long felt that we should pay less attention to the personal story of school shooters. So, should we avoid talking about bad people? In the extreme, this would mean we try to pretend they never existed, neither the person nor their ideas. For example, take Ronald Fisher. He basically created modern statistics and led biology’s modern synthesis of natural selection, genetic variation, and Mendelian inheritance. By some measures, he is the most influential scientist of all time. But he also had now-disfavored views on race and eugenics and used his immense influence to argue that tobacco was harmless, tainting my cherished “correlation doesn’t imply causation” arguments forever. You may or may not think Fisher is bad given his historical context. I may or may not think that. The point I’m trying to make is that it’s impossible to delete him from history. He invented p-values and variance. By now, all of science depends on his ideas. If that doesn’t work, should we do the opposite? The other extreme would be to never cancel anyone. If someone is bad, let them be punished (or not) by the legal system. But regardless of what happens there, we keep talking about their ideas, and in fact keep being friends with them. Social punishment is a core part of how our species works. If you think back to pre-historical times when we all wandered around in tribal bands, “gossip” was the primary way that we enforced the social contract on each other. Now, in modernity, we have laws and police and human resource departments and ethical review boards and home owners associations. All these things mean that gossip doesn’t have as large a role to play. But it seems crazy to think that our formal institutions cover all situations, that good-old gossip has no role anymore."
