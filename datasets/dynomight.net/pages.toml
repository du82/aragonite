["https://dynomight.net/arguments"]
title = "Things to argue about over the holidays instead of politics"
description = "Report back on how it goes"
full_description = "Bragging about material possessions is low-status in much of the West, forcing people to jostle through subtle wealth cues (travel, education, hobbies, food). But then why isn’t there another level where people embrace explicit materialism again to show that they are above such things? (Or is there, and it’s just invisible to me?) Say that if everyone voluntarily waited a bit longer to reproduce then after a hundred generations human life expectancy would increase by 25 years (edit: by providing selection pressure for genes that code for longevity, nothing to do with parenting). Would we be morally obligated to do that? Those lists of regrets people make at the end of life—how seriously should we take them? Profound wisdom or just how one version of yourself feels on one day? Generally speaking, is human progress more limited by our ability to build/orchestrate (1) technological systems or (2) social systems? What should we take from the existence of acquired tastes like spicy food or whiskey? Are they “fake”? Why aren’t we more intentional about which ones we acquire? If you take an octopus with most of its neurons in its arms and you cut one of the arms off and wait three months for it to regrow, what happened to the memories in those neurons? Did you destroy arm-specific memories or make all memories vaguer or is there some redundant coding scheme where the memories will be re-cached as the arm regrows? (Considered unsporting to use the scientific literature that no doubt exists in your argument although please send it to me.) Is there any way to opt out of the signaling/counter-signaling game? If you could do it, should you, or is that pointless neuroticism? Is utility one-dimensional? That is, is there just one kind of goodness/badness in subjective experience that comes mixed with neutral flavors, or can you feel immense pain and pleasure at the same time? How many attractors does the utility function landscape have? Like, say you are an AI and you can reprogram yourself at will with any CIRCUMSTANCE→REWARD mapping. Depending on the mapping, you may or may not decide to change your mapping again. Where do you stop? Are the attractors always “good” ones, or might you end up miserable but dead-set against changing?"
