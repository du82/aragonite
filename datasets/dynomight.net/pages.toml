["https://dynomight.net/feelings"]
title = "The hard problem of feelings"
description = "Or: Why you like burrritos"
full_description = "The hard problem of consciousness is why it feels like something to be alive. Physics does a good job of explaining everything that happens in terms of fields and atoms and whatnot—you’re eating a burrito because moments after the big bang, matter formed, and then planets, and then life forms, which started eating each other, and then there was an arms race that led to your brain trying to put certain nutrients into your body so you can propagate your genes. That’s neat, but why does it feel like something to be you? There seems to be no need for consciousness. Physics wouldn’t care if we were all “zombies”. Why aren’t we? Answer 1: Evolution made consciousness on purpose because consciousness is useful. Maybe evolution noticed that if it created the right proteins, then we would have little “souls” in our brains that would have consciousness and help make better decisions. The problem with this answer is that it’s… absurd? How could a soul change your behavior? Does it have a magical wand to push atoms around or stimulate neurons? Physics seems to prohibit this. Answer 2: Something else made consciousness on purpose. Maybe God just decided that it would be fun to give everyone little souls. Or maybe we’re all living in a simulation and after 10 billion years the Simulator got back from their coffee break and turned on the “consciousness” switch. Answer 3: It was an accident. Maybe evolution doesn’t “know” about consciousness. It made brains because they are good at telling muscles what to do so you get food and stay warm and don’t die. When those brains become powerful enough then integrated information something emergent phenomena something irreducible cause-effect structure—consciousness! I’ll just admit it—I don’t understand this. We think biology “emerges” from physics because all of biology could in principle be explained in terms of physics. But for consciousness—how can the goings-on of one kind of thing create an entirely different category of thing? Isn’t that like saying a cruise ship is an emergent phenomenon of your sense of humor?"
