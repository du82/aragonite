["https://dynomight.net/traitorous"]
title = "Why is it traitorous to understand the people you disagree with? Six models"
description = "Reflections on a phenomena that’s unique to culture-war topics"
full_description = "There’s a certain phenomenon I often wonder about, one that only seems to occur with culture war topics. I usually try to avoid culture war, but it’s impossible to discuss this phenomenon without an example and I don’t see the point of tiptoeing around. So, abortion. For better or for worse, the vast majority of people I know favor Roe v. Wade. Still, I think I understand the view of people on the other side. The question before the court in Roe v. Wade was not “Would the world be better if abortion were legal?” The question was, “Does the US Constitution prohibit states from making abortion illegal?” The decision basically goes like this: Is this a ridiculous opinion? I don’t think so. But I can see why someone might disagree with it. For one, what’s the “privacy” thing? When Roe v. Wade was decided in 1973, most states still made it a felony to have consensual sex with an adult in your own home—if that adult happened to have the same sex as you. The Supreme Court heard a challenge to these laws in 1986 and confirmed that yup, they were fine. But then, in 2003, they decided these laws were unconstitutional because of the 5th and 14th amendments. I probably don’t need to tell you that I think these laws were wrong. And I know that many people see the constitution as a living document that is constantly transformed by changing circumstances et cetera. I can see that. But I can also see how someone might think this looks like the people on the Supreme Court making stuff up as they go. The second reason I can see for opposing Roe v. Wade is that it expresses a particular view on personhood. Or, more exactly, it refuses to accept the view that life begins at conception. Personally, I don’t accept that view either. But, then, I have some unusual ideas about this kind of thing. The fact is, many people do think life begins at conception. Given this disagreement, it’s not entirely obvious to me that we should resolve it through the Supreme Court rather than having people debate with each other and vote for legislators who will pass laws that reflect their views."
