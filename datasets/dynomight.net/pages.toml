["https://dynomight.net/prediction-market-causation"]
title = "Prediction market does not imply causation"
description = "Unless you’re careful, conditional prediction markets have all the same problems as observational studies."
full_description = "[Note: If you’re already familiar with prediction markets, you might want to skip to section 3 or maybe even section 6.] We all want to make good decisions. But it’s hard because we aren’t sure what’s going to happen. Like, say you want to know if CO₂ emissions will go up in 10 years. One of our best ideas is to have people bet. For example, I might wager my $4 that emissions will go up against your $1 that they will go down. If lots of people bet in a market, the final prices combine everyone’s wisdom and information. If bets stabilize at a 4:1 ratio, that suggests that emissions are 4 times more likely to go up than to go down, i.e. But when you want to make decisions, you often need more information. Say someone suggests a treaty to reduce CO₂ emissions. If you want to know if the treaty will work, you can have people make conditional bets. For example, I might bet my $9 against your $1 with these rules: If lots of people bet in a market and prices settle at a 9:1 ratio, that suggests that emissions go up in 90% of the worlds where the treaty gets signed, i.e. You can run a second market to get the odds of emissions going up, conditional on there not being a treaty. So here’s our question: Say you do that and the market thinks that emissions are more likely to go up with the treaty than without, i.e. P[emissions up | treaty] > P[emissions up | no treaty]. Does that mean that the market thinks that signing the treaty will cause emissions to go up? People worry about prediction markets for lots of reasons. Maybe someone will manipulate prices for political reasons. Maybe fees will distort prices. Maybe you’ll go Dr. Evil and bet that emissions will go up and then go emit a gazillion tons of CO₂ to ensure that you win. Valid concerns, but let’s ignore them and assume markets output “true” probabilities. Now, why would emissions be more likely to go up with the treaty? The obvious explanation is that the market thinks the treaty will cause emissions to go up:"
