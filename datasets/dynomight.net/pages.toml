["https://dynomight.net/2021/01/25/how-to-run-without-all-the-agonizing-pain"]
title = "How to run without all the pesky agonizing pain"
description = "Why you shouldn’t torture yourself when training to run."
full_description = "I used to think the people I saw running were insane. They were confused about life. Whatever the benefits of running, nothing could justify that much suffering. Runners were cut from a different cloth. They had a strength of will I lacked. I would never be one of them. Now I run regularly. Not because I developed stronger willpower, or because I feel an obligation to my health. I run because I like it. Somehow, I became one of them. Untrained runners typically have this experience: You resolve to start running. The first session, you take off at a fast pace. After a minute or two, your heart and lungs are struggling to keep up, and soon your entire body is in pain. This is terrible. You don’t have the willpower to run through that suffering day after day, so you quit after a few sessions. For some reason, people don’t tell you an important fact: That horrible feeling almost completely disappears within a few weeks of training. Your cardiovascular system develops quickly. Instead, you run until your legs get tired — an infinitely more pleasurable experience. The secret of all those “crazy people” on the street is that they aren’t suffering (or at least, not much). But even this is misleading. It suggests you need to “break through” to the second stage, and only then running becomes easy. It suggests you must summon ultimate willpower for a few weeks in order to level up. No! You don’t need ultimate willpower, even at the beginning. That’s the second thing people don’t tell you: You don’t need to suffer to get through to the second stage. You just need consistency. You should think as follows: You are starting a habit you will keep for decades. It doesn’t matter how hard you run today. What matters is (1) that you do run, and (2) that you enjoy it enough that you’ll run again tomorrow. That’s it. Are there people who run three times a week for 5 years and still suck at running, however little their willpower is in each session? No! Just go, take it easy, and let time do the work."
