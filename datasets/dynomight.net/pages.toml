["https://dynomight.net/llms"]
title = "Historical analogies for large language models"
description = "ice, chess, tractors, railroads, swords, sword fighting, mass production, pre-fab homes, photography, Segways, scissor doors, pornography, calculators"
full_description = "No one knows. With such uncertainty, a good exercise is to look for historical analogies—to think about other technologies and ask what would happen if LLMs played out the same way. I like to keep things concrete, so I’ll discuss the impact of LLMs on writing. But most of this would also apply to the impact of LLMs on other fields, as well as other AI technologies like AI art/music/video/code. We used to harvest huge amounts of natural ice and ship them long distances. The first machines to make ice were dangerous and expensive and made lousy ice. Then the machines became good and nobody harvests natural ice anymore. In this analogy, LLMs are bad at first and don’t have much impact. Then they improve to match and then exceed human performance and human writing mostly disappears. In this analogy, LLMs become better than humans at writing. But so what? We like human writing. Text isn’t interesting if it’s not part of a (para)social relationship. Browser makers build in LLM detectors to warn people if something wasn’t written by a human. Authors do use LLMs to train at writing, and sometimes there’s lots of intrigue when authors accuse each other of cheating using LLMs. (By the way: In case you’re worried, there is no “written using LLMs lol” rug-pull coming at the end of this post. I wouldn’t endanger our parasocial relationship like that.) In 1800, half of the people in rich countries were farmers. After technology made farmers more productive, we weren’t interested in eating 50× more food per capita (and we weren’t that interested in expensive ingredients and eating white truffle saffron wagyu caviar burgers for every meal) so today only 1-4% of people are farmers. In this analogy, LLMs act as a tool to allow one “writer” to produce vastly more output. But we don’t want to read 50× more stuff and don’t particularly care about “better” writing, so most writers have to shift to other jobs to make supply match demand. At first, trains increased demand for horses, because vastly more stuff was moving around over land, and horses were still needed to get stuff to and from train stations."
