["https://dynomight.net/2020/10/30/temperature-conversion-for-the-lazy-and-simple-minded"]
title = "The simplest possible way to convert Celsius and Fahrenheit"
description = "If you can switch the order of two numbers, you can convert temperatures."
full_description = "This is a new way to convert temperatures between Celsius and Fahrenheit. It’s not the most accurate method, but it’s surely the easiest. It’s a coincidence that these conversion points exist—I found them by writing a program and searching for all the cases where this happen. It’s an very fortunate coincidence that they divide the range of temperatures in a convenient way. As an example, suppose you are familiar with Celsius and don’t know how to interpret 71°F. Since this is around halfway between 61°F and 82°F you know it is also about halfway between 16°C and 28°C. Question: Isn’t this a bad system for me, smart person who can easily calculate F=(9/5)C + 32 and C=(5/9)(F - 32) in my head? Answer: You can mentally interpolate: For example, 7°C is ¼ of the way from 4°C to 16°C, so it converts to around 45°F, ¼ of the way from 40°F and 61°F. People make fun of techie/rationalist/effective-altruist types for many weird obsessions, like stimulants or meditation or polyamory or psychedelics or seed oils or air quality or re-deriving all of philosophy from scratch. Some of these seem... Hi there. It’s me, the person who stares very hard at the numbers in the papers you write. I’ve brought you here today to ask a favor. Say you wrote something like this: There were... Of all the cognitive tools our ancestors left us, what’s best? Society seems to think pretty highly of arithmetic. It’s one of the first things we learn as children. So I think it’s weird that... It's October 1962. The Cuban missile crisis just happened, thankfully without apocalyptic nuclear war. But still: Apocalyptic nuclear war easily could have happened. Crises as serious as the Cuban missile crisis clearly aren't *that* rare,... Say you want to plot some data. You could just plot it by itself. Or you could put lines on the left and bottom. Or you could put lines everywhere. Or you could be weird.... Unless you're careful, conditional prediction markets have all the same problems as observational studies."
