["https://dynomight.net/2020/09/14/what-happens-if-you-drink-acetone"]
title = "What happens if you drink acetone?"
description = "How dangerous is it to drink acetone or nail-polish remover? Here’s the key scientific facts, compared to ethanol."
full_description = "But, out of interest, what if you did? This question is asked repeatedly on the web, with with many answers smugly stating that even tiny amounts of acetone will instantly kill you, you idiot. But they provide no evidence. Acetone occurs naturally in plants. Your liver produces acetone when metabolizing fat. If you fast, have diabetes, or exercise very hard, you produce more acetone. You also produce more if you follow a ketogenic diet. (Acetone is a “ketone”!) Small amounts of acetone are naturally present in your blood and urine, the latter being how you get rid of it. Insulin is needed to break down glucose and provide energy to cells. Diabetics have trouble either producing or using insulin. Thus, their bodies may burn fat instead. Burning lots of fat produces lots of acetone, enough to impact the breath. (This is a serious problem if it occurs.) Ingestion: May cause gastrointestinal irritation with nausea, vomiting and diarrhea. May cause systemic toxicity with acidosis. May cause central nervous system depression, characterized by excitement, followed by headache, dizziness, drowsiness, and nausea. Advanced stages may cause collapse, unconsciousness, coma and possible death due to respiratory failure. Sounds serious! Except, oh wait, I made a “mistake”. That was the list of effects for ethanol. Here are the effects for acetone: Ingestion: May cause irritation of the digestive tract. May cause central nervous system depression, characterized by excitement, followed by headache, dizziness, drowsiness, and nausea. Advanced stages may cause collapse, unconsciousness, coma and possible death due to respiratory failure. Aspiration of material into the lungs may cause chemical pneumonitis, which may be fatal. In animals, the Oral LD50 for acetone ranges from 3 g/kg in mice to 5.8 g/kg in rats. For ethanol it is around 7.3 g/kg for both mice and rats. This suggests you’d need to drink something like an entire bottle of nail-polish remover to be at risk of dying: If the mice numbers translate to humans, someone who weighs 80kg (180lb) would need to drink 240g of acetone to have a 50% chance of death. Standard nail-polish remover bottles contain around 200ml and are 98% acetone."
