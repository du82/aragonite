["https://dynomight.net/axes"]
title = "Using axis lines for good or evil"
description = "add them only if they mean something"
full_description = "Which is right? Many people treat this as an aesthetic choice. But I’d like to suggest an unambiguous rule. First, try to accept that all axis lines are optional. I promise that readers will recognize a plot even without lines around it. Which is better? I claim this depends on what you’re plotting. To answer, mentally picture these arrows: Now, ask yourself, are the lengths of these arrows meaningful? When you draw that horizontal line, you invite people to compare those lengths. You use the same principle for deciding if you should draw a y-axis line. Ask yourself if people should be comparing the lengths: Suppose your data is how the GDP of some country changed over time, so the x-axis is years and the y-axis is GDP. GDP is an absolute quantity. If GDP doubles, then that means something. So readers should be thinking about the distance between the curve and the x-axis. But 1980 is arbitrary. When comparing 2020 to 2000, all that matters is that they’re 20 years apart. No one cares that “2020 is twice as far from 1980 as 2000” because time did not start in 1980. Say you have years and GDP again, except all the GDP numbers are much larger—instead of varying between 0 and $3T, they vary between $50T and $53T. Sometimes you need to start the y-axis at $50T. That’s fine. (As long as you’re not using a bar chart.) But then, the right answer changes. The difference is that $50T isn’t a meaningful baseline. You don’t want people comparing things like (GDP in 1980 - $50T) vs. (GDP in 2000 - $50T) because that ratio doesn’t mean anything. If the temperature is in Fahrenheit, then no. No one cares about the difference between the current temperature and the freezing point of some brine that Daniel Fahrenheit may or may not have made. If the temperature is in Celsius, then maybe. Do it if the difference from the freezing point of water is important. Of course, if the freezing point of water is critical and you’re using Fahrenheit, then draw a line at 32°F. Zero and one are the most common useful baselines, but use whatever is meaningful."
