["https://dynomight.net/advice"]
title = "Why doesn't advice work?"
description = "(or at least work better)"
full_description = "In ancient India, there was a long-running feud between the Pandavas and the Kauravas. Duryodhana, leader of the Kauravas, planned a huge war to end things forever. Krishna warned that this would lead to the total destruction of both sides and made every effort to forge a peace. Duryodhana refused to listen and launched his war. There were 4 million warriors at the start. After 18 days, all but 11 were dead. It’s unclear if Duryodhana knew Krishna was a god. Duryodhana may have been an atheist, despite having seen Krishna in his extremely multi-armed/multi-headed Vishvarupa form. But Krishna had certainly proven himself to be a master tactician and strategist—also he was blue. It seems like this happens a lot. Someone has a problem, they ask you for advice, and you give it to them. Your advice is impeccable, pragmatic, human, wise. But they ignore you and suffer the predictable consequences. All they had to do is listen. So why didn’t they? Maybe your advice is terrible and if people followed it, they’d do even worse. Or maybe your advice is good for the situation as you understand it, but not for the real world because of details you don’t know about. I’m sure there’s lots of this. The median nutrition advice is appalling. In 1962, President Kennedy’s Joint Chiefs of Staff all advised air strikes on Soviet missile installations in Cuba. Internet people seem to think you should divorce your spouse for misdeeds as minor as forgetting to buy shampoo. But I’m still convinced that lots of good advice gets ignored. Because—people sometimes ask me for advice, ignore it, struggle, and then finally come back and explain my advice to me as if it were novel. (Presumably I do the same thing.) When I was learning to climb, everyone said things like, “if in doubt, move your feet up” or “don’t pull yourself up with your arms, push yourself up with your legs”. These people were much better than me, and I could see them moving their feet up. I knew their advice was good and I tried to follow it, but I couldn’t understand how."
