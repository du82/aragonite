["https://dynomight.net/nonpersons"]
title = "Reasons after nonpersons"
description = "AI will make some old-school philosophical thought experiments seem much more relevant"
full_description = "The year is 2029 and you’ve finally done it. You’ve written the first AI program that is so good—so damn good—that no one can deny that it thinks and has subjective experiences. Surprisingly, the world doesn’t end. Everything seems fine. Except—all those bongcloud philosophy 101 thought experiments people have done for generations suddenly seem much less hypothetical. But also, kind of tedious? Bongcloud 101: When Vader froze Han in carbonite, did he, like, die? And did he get reincarnated later? If he was never unfrozen, then when did he die? Bongcloud 101: A thousand years from now, you discover a mineshaft with 500 cryogenically frozen bodies. If you don’t revive them, is that murder? You 2029: You’re walking down the street and find a thumb drive with a bunch of AI programs on it. Are you ethically obligated to start them? Bongcloud 101: I have severe epilepsy, which you treat by cutting my corpus callosum so my two cortical hemispheres can’t directly communicate. After, I say I’m fine and I seem fine, but sometimes my two arms try to do contradictory things. And if you block the light going into the left half of my eyes, I can’t tell you what’s in front of me—even though my left arm still immediately captures any available burritos. Are there two people in my head? You 2029: You take your AI and split it into two modules with limited communication. Is there now a second consciousness? Bongcloud 101: You and me, we love each other. So much that mere marriage won’t do. To honor our bond, what we need is high-bandwidth interconnect between all four of our cortical hemispheres. So we design a, like, interpersonal love-callosum. After installation, we’re confused at first, but a few weeks later, we act as one and report that we are a single sentience. Did one of us die? Bongcloud 101: Bored one night, you sneak into my bedroom and recode my neurons so I have the memories and personality of Napoleon. When I wake up, I’m less interested in philosophical rambling on the internet, and much more interested in taking over the world. Am I still me?"
