["https://dynomight.net/gratitude"]
title = "Does gratitude increase happiness?"
description = "After decades of research, we now have a huge body of studies and meta-reviews to summarize it. What do they say?"
full_description = "I was wrong about gratitude. I thought it was a guaranteed way to become happier and went around proclaiming we should be thankful because: Hokey, unfashionable techniques like practicing gratitude turn out to have strong scientific evidence behind them. Sorry about that. In my defense, the internet is rife with articles from seemingly credible places that say things like this: Is it true that you can become healthier and happier by practicing gratitude? The short answer is yes. Gratitude is strongly and consistently associated with greater happiness. Gratitude helps people feel more positive emotions, relish good experiences, improve their health, deal with adversity, and build strong relationships. Even spending just a few minutes a day practicing gratitude can facilitate better sleep and lower blood pressure, according to research. Who am I to argue with research, I thought? But of course, I hadn’t read the original papers. I recently did that, and… I think the scientific evidence for gratitude is mostly a mirage. It’s not just unsupported, it verges on disproven. Now, this isn’t a criticism of the papers, which seem mostly OK. The problem is that things are being grossly misinterpreted and oversold in secondary sources. (Albeit, secondary sources that sometimes have loose quotes from the authors of the papers.) This also isn’t to say that gratitude exercises don’t work. If you do them and you think they help you, that’s great and you should keep doing them. (And also… perhaps stop reading now?) The problem with gratitude exercises is that everything works. In research, they’ve been compared to acts of kindness, visualizing your ideal self, keeping a mood diary, progressive muscle relaxation, and many other things. They all work. Even seemingly neutral things like listing your daily activities may work. Why everything seems to work is a difficult question. But regardless of the answer, I think we have mistakenly fixated on the magical properties of gratitude when it’s really the magical properties of pretty much any damn positive-sounding activity you might make up."
