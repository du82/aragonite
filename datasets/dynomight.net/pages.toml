["https://dynomight.net/2020/12/09/sales-tax-creates-more-unnecessary-pain-than-value-added-tax"]
title = "Sales tax creates more unnecessary pain than value added tax"
description = "Explains through a model of selling coconuts while value added taxes distort the economy less than sales taxes."
full_description = "It turns out that sales tax has a huge, gigantic, terrible flaw: It punishes specialized businesses. A value added tax (VAT) has no such problems. Maybe it’s not the most important issue in the world, but it’s just so clear. Sales tax is dumb and VAT is better. Many people apparently believe that in the US today, sales tax is only paid by final consumers. THIS IS FALSE. It varies hugely by state, but the current situation is a hybrid between a “pure final retail consumer only” sales tax and what the toy model below describes. You can debate if it’s “sales tax” or “gross receipts tax” or whatever, but it’s a fact that businesses pay tax on business inputs all the time. You can find proof of this here or here or here or here. I emphasize that the explanation below is a toy, intended to illustrate in the simplest possible way how specialization gets punished when transfers are taxed in proportion to their values. The current reality not nearly this bad due to many complex exemptions, as I discuss at the end. But the flaw described does exist and does punish specialization. You’re good at painting coconuts. You find a friend who is good at picking them, and another who’s good at making coconut paint. You find a third friend who’s a genius with applying finishing lacquer and a fourth who runs a store. You buy coconuts and paint, apply the paint, then sell to the finisher. He applies lacquer and sells to a retailer. After negotiating prices, you settle on $1 for a raw coconut, $1 for a coconut’s worth of paint, $3 for a painted coconut, $4 for a finished coconut, and $5 retail. This works out to everyone making $1 of profit. For a while, everything runs beautifully. Every day you wake eager to help capture more beauty in coconut form — and then the government announces a 20% sales tax. Whenever you sell something, you need to pay 20% of the sale price to the government. You talk it over. Everyone feels they still deserve to make the same $1 profit as before. Since you now pay $1.20 for a raw coconut and $1.20 for paint, you need to mark up to $3.40 before tax, and $4.08 after."
author = "dynomight"
year_published = 2020
