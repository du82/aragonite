["https://dynomight.net/2020/10/19/its-hard-to-use-utility-maximization-to-justify-creating-new-sentient-beings"]
title = "It's hard to use utility maximization to justify creating new sentient beings"
description = "The ethical theory of Utilitarianism applies to many situations, but runs into problems when choices might create new beings."
full_description = "Cedric and Bertrand want to see a movie. Bertrand wants to see Muscled Duded Blow Stuff Up. Cedric wants to see Quiet Remembrances: Time as Allegory. There’s also Middlebrow Space Fantasy. They are rational but not selfish - they care about the other’s happiness as much as their own. What should they see? A few months later, they are walking in the park and run into their neighbor Maria. She has an insanely cute dog. Cedric admits it’s adorable, but Bertrand completely loses his mind. As he rolls around on the ground with the dog, they have the following conversation: Maria: “I was just going to have her sterilized. But if you want I can have her bred and give you the puppy.” A few hours later, Bertrand has recovered his sanity, and they decide to use the same strategy they used to chose a movie. They both quantify the pleasure the dog will provide them and subtract the pain of taking care of it. Bertrand would see a big improvement, while Cedric a small negative. Based on this, they decide to get the dog. They invite Maria over and proudly show her the calculations. Maria: “So will the dog be happy here? Shouldn’t you include the dog’s utility in your calculations?” They all agree the dog should be included, and would be moderately happy in their apartment. They add a new column to their table, but aren’t sure what number to put for the dog in the scenario where it doesn’t exist. Maria: “But you can’t just add a 0 for the scenario where the dog doesn’t exist. As it is now, your average happiness is 10. If you add the dog, the average happiness drops to 9.” You’re a rat. You move onto a pristine island with your gorgeous and adoring rat-spouse. You relax on the beach, read poetry and eat coconuts. You are about to make love when you are struck by a vision: What happens when you keep breeding? As the population grows, resources will be exhausted. Cultural and genetic evolution will favor ruthlessness, and gradually prune away any focus on kindness or beauty. 100 generations from now, the island will be an overcrowded hellscape of inbreeding and cannibalism. Their lives will be worse than death. Should you go ahead and procreate?"
