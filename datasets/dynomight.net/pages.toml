["https://dynomight.net/speakers"]
title = "Social dynamics of bluetooth speakers"
description = "A mathematical model of who turns on their bluetooth speaker at the beach."
full_description = "Say you’re at a park or a beach. How many people will have bluetooth speakers on? It seems to me there are three types of people: There are different reasons normies might behave this way. Some might like to listen to music but—bless them—worry that it’s rude, so they won’t do it unless others have normalized the behavior. Some might not want to listen to music, but at some point, they’ll turn on a speaker defensively so they can listen to their own music instead of yours. Say we throw all these people together into a silent park. What will they do? Well, a fraction A will immediately turn their speakers on. That will induce more people to turn theirs on, and so on. But how does it end? If we had started with everyone having speakers on, would we get the same result? For the sake of illustration, assume A=0.1 and B=0.2. Then the distribution of thresholds (quantized to intervals of 0.05) looks like this: This plot is intuitive, but it’s not very helpful to understand the dynamics of the model. Instead, we need to introduce a slightly different object: Technically F(t)=p(T≤t) is a “cumulative distribution function” but never mind. Here’s what it looks like: Since 10% of people always turn on their speakers, F(0)=0.10. And since 20% of people never turn on their speakers, F(1)=0.80. Between that, it’s a straight line. OK! Let’s try this model out. Assume that people are in a park, and 90% are initially using speakers. What happens next? Well, if everyone sees 90% of people using speakers, how many will use one themselves? The calculation we need is that F(0.90)=0.73. We can picture this as a horizontal line in the following graph. (This also shows the identity curve t=t, which will soon be relevant.) So, after everyone’s had a chance to look around and decide what to do (in the next “time step”) 17% of the people will turn off their speakers. Geometrically, this is what we get if we “bounce” the above horizontal line off the t=t curve."
