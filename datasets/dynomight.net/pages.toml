["https://dynomight.net/buy-purifiers"]
title = "What if you just bought everyone air purifiers?"
description = "amazing or nah"
full_description = "I haven’t written about air quality in a while. Ominously, sometimes people ask me if I still care about it. So, lest anyone think I have some kind of dreadful healthy mental balance, I thought I should do some Fermi estimates. Say you’re one of the five humans who have $100 billion. You could, in principle, buy 1.3 billion IKEA air purifiers. That’s enough for one for every household in China, India, the US, Indonesia, Brazil, Russia, Japan, Nigeria, and Germany. How good of an idea would that be? I estimate that for an average person in the United States, putting air purifiers in their house and running them for one year extends their life by 0.0033 disability-adjusted life years (DALYs), or a bit over a day. I also estimate that if you add up the purifiers, the filters, and the electricity, this costs around $109 per year. So: If you go buying air purifiers for random Americans, you can extend life expectancy at a cost of around $33k / DALY. (That’s $109 / 0.0033 DALY.) Is that good? Well, back in the golden days when GiveWell used to score interventions in terms of dollars per DALY, they found that artemisinin combination therapy for malaria could extend lifespan at a cost of $150 / DALY. That’s… substantially lower. But maybe air purifiers would work better in other countries? In India, there’s more air pollution, electricity is cheaper, and people have less living space, all of which help purifiers. There, I estimate a cost of $1.6k / DALY. Much better, but still 10× higher than malaria drugs. Or maybe you don’t want to compare to hyper-efficient interventions like malaria drugs? OK, then how about normal healthcare? In countries with very high human development—like the US—healthcare saves one DALY for around each $70k spent. In countries with low development—like India—saving one DALY only costs around $1k. Both of those are fairly close to what you’d get from buying random air purifiers. So this wouldn’t be a terrible way to spend money, but it’s probably not something you’d want to pursue philanthropically. At least, assuming you’re the kind of person who is ruthlessly focused on efficiency."
