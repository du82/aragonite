["https://dynomight.net/diet-coke-nootropic"]
title = "Diet Coke probably isn't a cognitive performance enhancer"
description = "Investigating the (aspartame → phenylalanine → dopamine) theory"
full_description = "“Very ambitious and successful and competitive and rich person loves Diet Coke” has been in the news recently, and friend of the blog Aaron Bergman proposes a theory as to why. Spelled out in more detail, it goes like this: ASPARTAME ↓ PHENYLALANINE ↓ DOPAMINE OR PHENETHYLAMINE OR SOMETHING THIS PART ISN’T TOTALLY CLEAR ↓ STIMULATION I want to believe, but there are two problems. For one, this theory is weird and disturbing, and most things that are weird and disturbing aren’t true. More concretely, phenylalanine is in all sorts of foods like eggs, chicken, milk, soybeans, and breast milk. Remember how phenylalanine is an essential amino acid? And remember how you’re reading this right now and not dead? From these facts, we may conclude that you consume phenylalanine all the time. A can of Diet Coke contains 184 mg of aspartame, which metabolizes into around 103 mg of phenylalanine. (Because one molecule of aspartame is metabolized into 1 molecule of phenylalanine and the molecular weights of phenylalanine and aspartame are 165.19 and 294.3, respectively.) If phenylalanine was a stimulant, then wouldn’t an egg/milk/soybean diet turn you into even more of an optimized productivity god than Diet Coke does? Aaron is aware of this, and he has an answer: The difference is that aspartame gives you isolated phenylalanine, whereas these other foods deliver it together with lots of other amino acids. This could potentially make a big difference in the physiological effects. Some people already supplement phenylalanine. There are many placebo enthusiasts brave self-experimenters at r/nootropics who claim great results. The consensus there seems to be that you’d need a minimum of 500 mg to have any perceptible effect. That’s what you’d get from five Diet Cokes, which isn’t out of the question. But how do we know this isn’t pure placebo? Is it at all plausible that phenylalanine does anything? After a little searching through the literature, the answers to these questions are yes, and yes. Humphries et al. (2008) confirm that phenylalanine crosses the BBB. Also, the liver converts lots of phenylalanine into tyrosine, which can also cross the BBB. Once in the brain, tyrosine gets converted into DOPA and then into dopamine."
author = "dynomight"
year_published = 2022
year_updated = 2022
