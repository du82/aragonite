["https://dynomight.net/alcohol"]
title = "Alcohol, health, and the ruthless logic of the Asian flush"
description = "Why did the Asian flush evolve? What does this say about alcoholism? What does this have to do with Odysseus?"
full_description = "Say you’re an evil scientist. One day at work you discover a protein that crosses the blood-brain barrier and causes crippling migraine headaches if someone’s attention drifts while driving. Despite being evil, you’re a loving parent with a kid learning to drive. Like everyone else, your kid is completely addicted to their phone, and keeps refreshing their feeds while driving. Your suggestions that the latest squirrel memes be enjoyed later at home are repeatedly rejected. Then you realize: You could just sneak into your kid’s room at night, anesthetize them, and bring them to your lair! One of your goons could then extract their bone marrow and use CRISPR to recode the stem-cells for an enzyme to make the migraine protein. Sure, the headache itself might distract them, but they’ll probably just stop using their phone while driving. Wouldn’t you be at least tempted? This is an analogy for something about alcoholism, East Asians, Odysseus, evolution, tensions between different kinds of freedoms, and an idea I thought was good but apparently isn’t. This is a surprise to no one, but let’s look at some numbers. Here’s data from a meta review on the relative risk of various health conditions as a function of the number of US standard drinks (14g of alcohol) someone has in a day: The three small dots show that having 10 drinks a day is associated with a 9x risk of getting lip/oral cancer, a 3x risk of epilepsy, and a 1.5x risk of diabetes, as compared with not drinking at all. These are all associations, controlling only for age, sex, and drinking history. This makes the little dip around 1-2 drinks for heart disease and diabetes controversial. Still, the causal link is pretty clear in many cases, and for our purposes, all that matters is that heavy drinking is not good. But who averages 10 drinks per day, you ask? The answer is an astonishing number of people. Half of Americans drink almost nothing, but the top 10% average more than 10 drinks per day. They’re responsible for around 75% of all alcohol consumption."
