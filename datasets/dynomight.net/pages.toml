["https://dynomight.net/olympics"]
title = "It's probably just money: Why hosts do well at the Olympics"
description = "sometimes it’s boycotts"
full_description = "Esprit de corps. Maybe athletes feel lifted up by the local crowd and try harder or feel more confident or something. More bites at the apple. Hosting countries are automatically able to place athletes into many events even if they wouldn’t ordinarily qualify. Money. Maybe when countries decide to spend billions of dollars hosting Olympics, they also spend more on finding talented athletes, giving them time to train, facilities, coaches, etc. Let’s start with the data. Here are the results for all countries that have hosted the Summer Olympics since 1940. Hosting years are marked in red. A lot of people take data like this and start screwing around with statistics. But I think it’s more informative to sweat the details a bit. They often do! But not always. Qualitatively, I see little to no bump for: Brazil, Canada, Finland, the United States (1996), and West Germany. But that means that there are bumps for the other 14/19 games. Why? If the explanation was purely jetlag, or esprit de corps, or biased local judges, or getting to enter more athletes, or getting to pick new sports, then this wouldn’t happen. Something else is causing all those lines to go up before countries host the games. (And, often, stay up after.) One very noticeable spike in medals is for the USSR at the 1980 Olympics in Moscow. They won 195 medals, the highest total won by any country ever: This was due to none of the causes listed above. It happened because the Soviets invaded Afghanistan and almost 70 countries boycotted the 1980s Olympics in protest, including the United States, Canada, Japan, South Korea, and West Germany. All the medals those countries didn’t win had to be won by someone. The biggest beneficiary, naturally, was the strongest country participating. Aside: To make plots for Russia, I combined the results for the USSR before 1992, the USSR-minus-Baltics “United Team” for 1992, Russia for 1996-2014 and assorted supposedly-not-Russia-but-who-are-we-kidding teams for 2016, 2018, 2020, and 2022."
