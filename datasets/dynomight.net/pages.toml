["https://dynomight.net/weight"]
title = "Numbers without which it's impossible to talk about weight loss"
description = "You lose glycogen before fat. Glycogen is heavy."
full_description = "We lose weight when we burn more calories than we eat. But how much weight do you lose for a given caloric deficit? This isn’t complicated. But it’s not trivial either, because the body has two forms of energy reserves: Glycogen is the other form of storage. It’s stored in your liver and muscle cells and is the primary form of short-term energy storage. The issue is: Glycogen is 10 times heavier than body fat per stored calorie. This means that changes in diet produce sharp swings in body weight that are easy to misinterpret if you don’t think about glycogen. So do think about glycogen. Use these four numbers: Day 1. You’re an average adult and you stop eating for a day, creating a 2000-calorie per day deficit. What happens? Day 2. You continue not eating. Since all your glycogen is gone, your body needs to burn fat. To make 2000 calories, it burns 0.26kg (0.57lb) of bodyfat. Days 3-6. You continue not eating (don’t do this) and after 6 days you’ve lost 2.25kg of glycogen and 1.3kg of fat for a total of 3.55kg. Now you’re only down 1.15kg, rather than 3.55kg like you were before the cheat day. But do you panic? No, you do not panic because you remember your good friend dynomight telling you that (a) fluctuations always happen when you begin or end of a diet because glycogen is heavy and (b) huge deficits are needed to lose any significant amount of fat. Note: In reality, things aren’t quite this simple: Your body burns a mixture of fat and glycogen where the glycogen decreases over time. But it does appear to deplete pretty quickly. Second, how much body fat do you need to store 1000 calories? Well, that corresponds to 1000/9=111g of pure fat. However, the body fat or “adipose tissue” in your body is only 87% fat. (You can’t just store blobs of pure fat; you still need vascular cells and whatnot.) So you need 111/0.87 = 128g of adipose tissue: Third, how much glycogen do you need to store 1000 calories? Well, glucose is a carbohydrate so you’d need 1000/4=250g of pure glucose. But to store it, your body bundles together lots of glucose molecules into the polymer called glycogen and then stores it in a hydrated form with around 3.5g of water for each gram of glucose (plus a tiny bit of potassium). So you store 250×4.5=1125g of hydrated glycogen."
