["https://dynomight.net/beliefs"]
title = "Effectiveness beats accuracy"
description = "We believe stuff because it benefits us to believe it, not necessarily because it is true."
full_description = "We believe stuff because it benefits us to believe it, not necessarily because it is true. Phrased that way, it seems like an obvious point—of course evolution made us like that, what else could it have done? But this has surprising explanatory power. Go talk with your roommate about who washes more of the dishes. Almost certainly, you’ll both think you do more of them than the other person thinks you do. Why? Probably because having a distorted view makes you a more convincing negotiator and gets you a better bargain in the future. Say you and some friends would like to start a business in a line of work with lots of opportunities for theft. If you all happen to believe there’s an omnipotent power that rewards good behavior after you die, and you’re in a close-knit community where betrayals have huge social costs, then you can all trust each other. Without the need to spend resources policing each other, you will outcompete all the non-religious groups. (See: The diamond trade in Antwerp, long dominated by devout Orthodox Jews and now dominated by devout Indian Jains.) Say that you look around and you sense that it would be beneficial to align yourself with a group of people who have certain political views. Now think about the game theory: Your vote has a tiny influence on what policies actually take place, but your stated views have a big influence on your social position and status. And the best way to look like you believe something is to genuinely believe it. You’ll soon find that it’s easy to convince yourself that the group’s positions are correct and anyone who disagrees is an evil idiot. You might feel like even listening to the other side is a betrayal. (See: Basically the entire modern world? See also: Why understanding can be traitorous.) Maybe right and wrong don’t “really” exist. But it’s tough out there and you don’t want people to hurt you. So you loudly advertise that if anyone defects against you, you’ll go out of your way to punish them—even “irrationally” hurting yourself if that’s necessary to get revenge. To make this threat maximally credible, you adopt as core beliefs that right and wrong do exist and that defectors are wrong."
