["https://dynomight.net/travel"]
title = "Obvious travel advice"
description = "Not entirely about food"
full_description = "After seeing each other for a few months, many new couples take a short trip, which often ends in an apocalyptic, relationship-destroying fight. My theory is that’s the trip working as designed—couples do these trips out of an instinctual desire to stress-test their relationships. Some people have a weird anxiety about tourism— “I’m a traveller, not a tourist” or whatever. Don’t be like that. Cultures vary in lots of arbitrary ways—how loud to talk, how (or if) to wait in line, how close to stand to other people, how to behave when you walk into a shop, how to smell, when you can blow your nose, etc. It’s good to be aware of these both as a producer of behavior (not offending others) and a consumer of behavior (not being offended when you’re not “supposed” to be). Different places have different “rules” like if you’re supposed to order drinks before or after food, when you can drink which kinds of coffee, or if you’re allowed (or encouraged) to slurp when eating noodles. After seeing all these variations, it’s hard not to see them as silly, but life is short and I suggest you mostly just conform. When there’s a language barrier, non-verbal information (tone, gestures, body language, clothes) plays an increased role in others’ judgements of you. Some places sell “travel” clothes, e.g. “travel” pants made of quick-drying nylon with zippers so the pants can convert to shorts. While I maintain you should fly your flag high, I also really, really, really think you might be more comfortable if you weren’t wearing these. A restaurant in some out-of-the-way neighborhood will likely pursue a make customers happy strategy. But a cafe across the street from the Colosseum will probably use a get people in the door strategy—no matter how good the food is, most people will never come back, so resources invested in making them happy after they’ve committed to pay are “wasted”. Don’t blame them, blame the remorseless market forces they’re trying to survive under."
