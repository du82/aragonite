["https://dynomight.net/grandma"]
title = "Why it's bad to kill Grandma"
description = "Commonsense morality is an OK-ish utilitarianism"
full_description = "In college, I had a friend who was into debate competitions. One weekend, the debate club funded him to go to a nearby city for a tournament. When I asked him how it went, he said: Oh, I didn’t have enough time to prepare, so I just skipped the tournament and partied with some friends who live there. I probably looked a little shocked—I was very idealistic in those days—so he reminded me of our earlier conversations about consequentialism: This was the right thing to do. There was no way I could participate in the tournament, and they’d already paid for everything. This way I’m happy and they’re happy. Everyone wins! I got a bit squinty-eyed, but I couldn’t see a flaw. We both agreed it was wrong that he didn’t prepare. But once that was done, was it right to skip the tournament, if consequences are all that matter? Recently, Arjun Panickssery wrote Just Say No to Utilitarianism, channeling ideas from Brian Caplan, Dan Moller, and Fake Nous. The basis of these articles are thought experiments like this one from Moller: Grandma is a kindly soul who has saved up tens of thousands of dollars in cash over the years. One fine day you see her stashing it away under her mattress, and come to think that with just a little nudge you could cause her to fall and most probably die. You could then take her money, which others don’t know about, and redistribute it to those more worthy, saving many lives in the process. No one will ever know. Left to her own devices, Grandma would probably live a few more years, and her money would be discovered by her unworthy heirs who would blow it on fancy cars and vacations. Liberated from primitive deontic impulses by a recent college philosophy course, you silently say your goodbyes and prepare to send Grandma into the beyond. Say you’re a surgeon. You have 5 patients who need organ transplants, plus 1 healthy patient who is compatible with the other 5. Should you murder the healthy patient so you can distribute his organs, thus saving 5 lives?"
