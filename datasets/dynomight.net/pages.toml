["https://dynomight.net/sloth"]
title = "Sloth was not the right answer"
description = "You can have a wrong favorite animal"
full_description = "OK, self, what you’ve got here is a totally safe question. There are no “right” or “wrong” animals and no need to worry about any consequences. Let your heart soar! At school recently, I had seen a video of a sloth in the jungle. In its slow movement and creepy perma-smile, I saw something zen, something that I wanted for myself. Looking back, I’m pretty sure my parents did intend for this to be a fun innocent question. So they were probably surprised to find themselves infuriated by my answer. I knew immediately that I had erred. But I wasn’t sure how. I could only manage, “I… like sloths?” My parents kept badgering me for a justification. But, being 12, I was unable to articulate that sloths gave me a sense of existential calm. So I struggled to answer. And as we went back and forth, I gradually came to realize that: I kept protesting that I just thought sloths were “nice”. My parents seemed torn between (a) thinking I was lying and (b) thinking that only a very lazy person could think anything positive about sloths. Finally, it seemed to dawn on them that I wasn’t going to change my story, and they couldn’t actually punish me for picking the wrong animal. So they left the room—still angry—and I was off the hook. Which is good because even without punishment, if you ask a 12 year old what their favorite animal is and then get extremely angry about their answer, that’s the kind of thing they might complain about on the internet many years later. I think of this often when I interact with children today. Suppose there’s an idea. Thinking about it makes you unhappy. But once you’ve learned the Idea, it’s hard to get it out of your mind. Slowly, you sink in deeper and deeper, seeking out more information and constantly bringing it up in conversation. You filter all other information through the Idea. The Idea is so important to you that you even cut ties with some loved ones who disagree with you about it. One of my strongest beliefs is that way too many people allow politics to play way too large a role in their emotional lives. Of course, elections matter. The world could be better and most potential improvements intersect with politics somehow. But the way we spend our energy on politics is poorly optimized for improving the world and well-optimized for sucking up all our time and making us miserable."
