["https://dynomight.net/datasets"]
title = "Datasets that change the odds you exist"
description = "Stats for dangerous situations"
full_description = "It’s October 1962. The Cuban missile crisis just happened, thankfully without apocalyptic nuclear war. But still: You estimate (like President Kennedy) that there was a 25% chance the Cuban missile crisis could have escalated to nuclear war. And you estimate that there’s a 4% chance of an equally severe crisis happening each year (around 4 per century). Put together, these numbers suggest there’s a 1% chance that each year might bring nuclear war. Small but terrifying. But then 62 years tick by without nuclear war. If a button has a 1% chance of activating and you press it 62 times, the odds are almost 50/50 that it would activate. So should you revise your estimate to something lower than 1%? So after 62 years, higher values of W are less plausible than they were before, and lower values more plausible. So you should lower your best estimate of W. Say there’s a universe. In this universe, there are lots of planets. On each planet there’s some probability that life will evolve and become conscious and notice that it exists. You’re not sure what that probability is, but your best guess is that it’s really small. But hey, wait a second, you’re a life-form on a planet with conscious life! Given that you exist, should you increase your guess for how likely conscious life is to evolve on a random planet? Again, you have two schools of thought. One says yes, you have data, increase your guess, while the other says no, don’t increase, if there wasn’t life you wouldn’t be here, anthropic principle—anthropic principle! After many years of being confused by these questions, I think I now understand what’s happening. These questions are confusing because they’re actually about a sort of narrow technical question, and only appear to be about to the fact that you might not exist. One day you wake up at my house. As you groggily look around, I explain that you’ve been invited to Dynomight family dinner! And that the way that DFD works is: After you’ve eaten, I bring out a box containing a bunch of identical revolvers. Half have no bullets in them, while the other half have bullets in all six chambers. You pick one revolver at random, put it to your head, and pull the trigger. (To refuse would be a huge faux pas.)"
