["https://dynomight.net/procrastination"]
title = "Taxonomy of procrastination"
description = "There’s a little accountant named Jim that lives in my head"
full_description = "Nobody gets everything they want in life. That’s OK. If everyone was a sportscaster-rockstar-scientist-model-author-influencer-billionaire, we still wouldn’t be happy because everyone else would be too busy to be impressed. But still, it’s a little sad when you don’t at least try to get what you want. My mental model is: Inside my head there’s a guy named Jim. When I decide I want to do something, Jim does a calculation: If Jim thinks the reward on effort is too low, he puts a “tax” on that activity. It’s still possible to do it, but it requires a lot of willpower. (Something glucose executive function dopamine something ego depletion norepinephrine.) Empirically, I don’t do those things. Jim wins. So, when I procrastinate, I try to rephrase the problem as: How do I get Jim to lower the tax? This is hard because Jim is stubborn and opinionated and skeptical and illogical. You wanted to dig a gigantic hole in the ground, but instead you spent all day eating pie and playing World of Warcraft. Why? Probably a combination of: Note that it’s the gap that matters. Jim doesn’t object to you doing unpleasant things—he just hates it when you have better alternatives. Sub-taxum A: You don’t think you have the ability. I’ve long wanted to be able to paint. I just want to achieve a mediocre amateur level so I can make Bob Ross jokes, but every time I try, my creations are haunting and Jim howls to stop the insanity. So I don’t paint much. Sub-taxum B: You don’t think you have a good plan. Sometimes I want to write and it’s impossible. I’ve come to think that’s often because Jim is smarter than me. He recognizes that I haven’t organized my thoughts and I need to do more research or make an outline. It’s annoying that Jim doesn’t make constructive suggestions. He just tyrannically imposes taxes and refuses to elaborate, which makes these cases hard to recognize. But that’s Jim for you. Sub-taxum A: You think no one else will care. This reduces the number of essays I write about Utilitarianism by 90%, thank God."
