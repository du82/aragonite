["https://dynomight.net/2020/10/12/police-violence-the-veil-of-darkness"]
title = "The veil of darkness"
description = "Explores some natural experiments that try to measure police violence."
full_description = "Measuring police bias using simple ratios doesn’t work. You can never cleanly separate the impact of race from other associated factors. But imagine we had augmented-reality goggles that made race invisible. Suppose we ran the following experiment: The police with invisibility goggles would not have equal statistics with respect to race. That’s because race is correlated with many things other than how people look. However, the only difference between the two groups of police is if they can see race. Thus, their difference would reveals exactly the impact of police bias. We haven’t done this experiment, of course. But we’ve done a kind of low-tech approximation. Instead of augmented reality goggles, we use the geometry of the earth and sun. Here’s the idea: Take all cars stopped by police in some around around 7:15. It will be light in summer, but dark in winter, meaning it’s harder to tell the race of the driver. So we ask: does the racial mix of stopped drivers change throughout the year? This was first studied in Grogger and Ridgeway in 2006 with a small and unreliable dataset. A heroic follow-up was done by Pierson et al. in 2020. They filed public records requests with 50 states and over 100 municipal police departments. (You do not, it appears, screw around with Pierson et al.) They ended up with a database of around 95 million stops from 21 state patrol agencies and 35 municipal police departments. Sure enough, they find that the fraction of stopped drivers who are black is lower when it’s dark. Their results (eyeballing a graph) are: This is around a 12% drop, which might seem small. But I think it suggests a larger bias: Reduced light has a modest effect on officers’ ability to see race. Often, it changes nothing, either because race was already invisible in daylight, or remained visible despite darkness. Roughly speaking there are four cases: Case A might happen near bright streetlights. Case B might happen if the driver is far away from the officer. The measured effect is coming only from case C (and partially cancelled by case D). Imagine switching from a regime where officers always saw race to one where they never saw race. Then the effect – if real – would probably be much larger."
author = "dynomight"
year_published = 2020
year_updated = 2021
