["https://dynomight.net/2020/10/29/pragmatic-reasons-to-believe-in-formal-ethics"]
title = "Pragmatic reasons to believe in formal ethics"
description = "Some situations where formal ethics are really needed for practical problems in real life."
full_description = "Ethics isn’t going to save the world. We don’t need more “calculations” about the right thing to do. We need people to stop doing obviously wrong stuff. Ethics is boring and irrelevant to everyday life. Stop the obsessive navel-gazing and go engage with the real world. There’s a lot that’s right about this: In practice our decisions aren’t usually influenced by ethics, but by habits and incentives. Say you’re walking across a park and you consider a shortcut. You ask: Will you hurt the grass? Are there insects? Will you hurt them? What’s the moral weight of an insect’s life? How does it compare against a small convenience for you? Will other people follow you? Are you responsible if they do? Living like this would be paralyzing. Almost all the time, we use habits or heuristics to make decisions, not ethics. Even when people do use ethics, we often spend it on problems that just aren’t that important. I mourn the hours I’ve spent on which plastics are recyclable. (It turns out: none!) It’s easy to get sucked into an argument about how some corporation named a product. And of course, lots of people are jerks and just don’t care about ethics. Most of the time, ethics don’t much influence behavior. What matters is incentives. We are bad at reasoning, but good at taking care of ourselves. That’s because it doesn’t hurt when you get ethics wrong. If you want to solve climate change or animal welfare or whatever, don’t preach at people – make it so no one needs to think about ethics. Apply a tax, put up a fence, create legal penalties. Let everyone follow the scent of what’s good for us instead of futilely hoping people will both figure out what’s best and then actually do it. Everyone knows that flights emit a lot of carbon. It’s also obvious that business seats take up more space than economy seats. A study took the emissions of an Airbus A380 flight from Abu-Dhabi to London and assigned them to passengers in proportion to the area of their seats. They got these numbers:"
author = "dynomight"
year_published = 2020
year_updated = 2021
