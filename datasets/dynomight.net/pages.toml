["https://dynomight.net/midwit-home"]
title = "The midwit home"
description = "Less automation and less agony"
full_description = "Reading a book one night, you decide to turn on the lights. And suddenly it’s obvious. Hauling your body across the room just to flip a switch is absurd. So you decide to get smart lights. Two hours later, your world is pain: The hell? But people seem to think that Home Assistant is good. (Something about subscription fees and invasive apps and forced obsolescence?) So you search for “how to get a Home Assistant”. This reveals a recursive landscape of terror: In desperation you go to a smart home forum and make a post titled “smart lights no agony please help dear god”. The first response is: Just get a Qetzl hub, a OTOROXv3.2 bridge, and any MongoChopper compatible bulbs. After matroid paring, you can connect xmpf12 beacons and trigger them with plain-old SkyDust switches. Are you trying to make this complicated? MongoChopper only works in reticulated mode, which newer Qetzl hubs don’t support. Easier to just make a custom Hellfire demarkation loop. Eventually you admit you’ve already suffered more than a lifetime of flipping switches and go to bed, mournful of your four lost hours of reading. You dream of a giant planetary light switch, glowing in brutal simplicity. So. Many people feel this way. Dumb homes are fine, but require flipping switches. Smart homes should be better, but in practice the cost of administering a new home IT nightmare outweighs the benefits. But perhaps there’s a third way. What if you try to achieve the goals of a smart home, but you rule out anything that involves getting two computers to talk to each other? So apps, phones, and hubs are out. But doorbells are good. Garage door openers are good. Dishwashers and smoke alarms are great. What else is there like that? I have “no club that would have me” relationship with links for things you can buy: They’re convenient, but it’s hard to be sure of the motivations of anyone who provides them. So no links here, affiliate or otherwise. They wouldn’t be very useful anyway since most of this stuff is sold by brands like ELFPUFF that disappear after two weeks."
