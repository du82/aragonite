["https://dynomight.net/culture-war-island-hopping"]
title = "Statistical nihilism and culture-war island hopping"
description = "If culture war is intractable, what should we do instead?"
full_description = "The Guadalcanal campaign was the first major offensive operation by the Allies in the Pacific theater of World War 2. This nightmarish battle ran for six months and—while an Allied victory—involved losses so high the US Navy refused to release casualty figures for years afterward. When this campaign ended in 1943, Japan’s major forward base in the South Pacific was Rabaul, a town Japan had seized from Australia in 1942 and fortified with aircraft, ships, structural defenses, and over 100,000 troops. General MacArthur wanted a direct attack on Rabaul. However, the US joint chiefs would not shift resources away from the war in Europe and likely feared horrendous losses. Eventually, the Allies settled on a strategy of island-hopping: With air and naval supremacy, it was decided to simply avoid heavily fortified areas like Rabaul. Instead, the Allies took only the fewest and most weakly defended points necessary to establish supply lines towards the Japanese mainland. So, here’s a theory: If you want to make the world better, culture-war debates are often like attacking Rabaul. There are lots of ratio arguments about police bias. Some claim the number of people killed per capita proves the police are racially biased. The problem is that in current society, races vary in basically every dimension: Age, income, where they live, etc. These would produce racial discrepancies, even if race itself were invisible. Other people claim the number of people killed per violent crime arrest proves police aren’t biased. This doesn’t work either because the number of arrests could itself be biased. Some claim that standardized tests are useless for predicting success in college. The argument is that if you already know grades, test scores aren’t predictive of finishing a college degree. The problem is that this is based on a regression that conditions on if a student goes to college at all and what college they enroll in. But those colleges—at least when the data was collected—used test scores to decide which students to accept! And more selective colleges have higher completion rates. Here are two possible causal chains:"
