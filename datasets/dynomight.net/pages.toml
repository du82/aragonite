["https://dynomight.net/reasons-and-persons"]
title = "Reasons and Persons: Watch theories eat themselves"
description = "A review of the thought experiments in Reasons and Persons by Derek Parfit (part one)"
full_description = "You live with a group of utterly rational and self-interested people on an island, gathering coconuts to survive. Tired of working so hard, Alice builds a machine and implants it in her brain. This machine leaves her rational except when it comes to fulfilling threats, which she always does regardless of the damage to herself. She announces to the group, “I will gather no more coconuts. Either you do it for me, or I burn the coconut trees and we all starve.” You regretfully conclude that your best choice is to capitulate. But every night as you gather coconuts for Alice, you wonder, where did you go wrong? Eventually, you realize: Upon arrival on the island, your first task should have been to implant a machine in your brain and promise, “If anyone else installs any machines in their brains, then I will burn the coconut trees.” I’ve long been fascinated by Derek Parfit’s Reasons and Persons, often called one of the most influential philosophy books of the 20th century. How can you not love something that tries to answer these questions: We are particular people. I have my life to live, you have yours. What do these facts involve? What makes me the same person throughout my life, and a different person from you? And what is the importance of these facts? Those who hold a Constructivist view may question my division of a moral theory. (R1) revises what I call our Ideal Act Theory. Constructivists may see no need for this part of a moral theory. But they cannot object to my proposal that we should ask what we should all do, simply on the assumptions that we shall all try, and all succeed. Answering this question is at worst unnecessary. If a Constructivist asks what we should all ideally do, his answer cannot be some version of Common-Sense Morality. If he accepts some version of this morality, he must move to the corresponding version of (R1), the revised version of his morality that would not be directly collectively self-defeating. And, since he should accept (R1), he should also accept (R2) and (R3). He should revise his Practical Act Theory, the part that used to be his whole theory."
