["https://dynomight.net/conspiratorial-monty-hall"]
title = "The conspiratorial Monty Hall problem"
description = "What if you and Monty decide to cheat?"
full_description = "The Monty Hall problem has now been a pox on humanity for two generations, diverting perfectly good brains away from productive uses. Hoping to exacerbate this problem, some time ago I announced a new and more pernicious variant: What if you and Monty try to cheat? Since then, many people have sent arguments. (Thank you!) Here, I’ll review the problem and then go over all the arguments people sent in. In our variant, Monty is corrupt. The night before the game, you show up at his house with a suitcase of cash. He agrees that he will follow whatever algorithm you want when choosing the door to open. (Of course, he still can’t open a door with a car.) The naive solution would be to play as if there was no conspiracy: Monty would just pick a random door, and you would always switch. This would get you the car ⅔ of the time. The question is: Can you do better? Thanks to the dozens of people who sent in different arguments. (And my apologies for being so criminally slow in responding.) I read all of them in detail, tried to “cluster” similar proofs together, and then gave everything a consistent notation. (Because of this, many proofs are changed a fair bit from what folks originally sent in.) The position of the car is randomized, so it doesn’t matter (on average) which door you choose at the start. To keep things simple, say you always choose door #1. Now, there are three cases: Monty only has freedom when the car is behind door #1. Suppose without loss of generality that he always chooses to open door #2 in this case. Now, what happens? ℙ[Win] = ℙ[Monty=2] ℙ[Win | Monty=2] + ℙ[Monty=3] ℙ[Win | Monty=3] = ⅔ × ½ + ⅓ × 1 = ⅔. Why you might not like this argument: It assumes that Monty always does the same thing in the same situation. Maybe you could do better if he used a randomized strategy? If you had no information at all, your odds would be ⅓. But when Monty opens a door, he has only two options, so can convey at most one bit of information. But one bit of information can at most double your odds. So you can’t do better than ⅔."
author = "dynomight"
year_published = 2022
year_updated = 2022
