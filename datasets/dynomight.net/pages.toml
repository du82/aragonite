["https://dynomight.net/humans"]
title = "My heuristics for interacting with humans"
description = "On game trees and reasonableness"
full_description = "I don’t sense that I’m viewed as particularly skilled at human interaction. Still, some poor fools sometimes ask me for advice, and I find myself repeating the same little speech. Alice keeps stealing all the credit at work. She never lies, exactly. But somehow she always manages to be the one sending the final email to the CEO and “forgets” to invite you to important meetings. You grind your teeth when you hear people complimenting her for your work. But if you talk to her maybe she’ll just brush you off? And if you tell other people “No, I did that!” maybe you’ll just look petty? You’re about to get married. You have an uncle that lives far away and complains of ambiguous health issues. Before picking a date, you call him, but he only says, “Oh ho ho, don’t worry about me!” But you sense ill-intent. He’s waiting for you to choose a date so he can say it doesn’t work for him and badmouth you to the rest of your family. You submit a paper to a journal. Reviewer #1 is positive, Reviewer #2 is confused, and Reviewer #3 is hysterical that you didn’t mention the seminal works of Lai (1997) and Lai and Cummings (1998) and Lai (2002) and Lai et al. (2004). These are all irrelevant, but if you say that, maybe you’ll anger Reviewer #3, whoever that could possibly be? But if you don’t say it, then maybe the other reviewers will think the complaint is valid? You write things on the internet. Every time you do, a few people on forums say, “trololololol, stopped reading after [misinterpretation of irrelevant point]”. Slowly, these people seem to burrow into your mind. As you write, you find yourself defensively adding clarifications everywhere. But this makes your writing long and confusing and boring. To win at a game like chess, you need to anticipate all possible reactions of your opponent: “If I do this, then they will do that, after which I can do this.” It’s helpful to think in terms of a “game tree”. This is a graph of all the board states connected with arrows for each possible move. Here’s what this looks like for tic-tac toe:"
