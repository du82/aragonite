["https://dynomight.net/2021/02/07/writing-as-a-craft"]
title = "What I learned from reading about writing"
description = "Have a consistent ruleset. Titles are a black art. Have empathy for the brain’s parser. It’s impossible to follow all the conventions. Write a thesis statement even if you hate it"
full_description = "Have a consistent ruleset. Titles are a black art. Have empathy for the brain’s parser. It’s impossible to follow all the conventions. Write a thesis statement even if you hate it Here’s how he writes well: He lets the characters do what they want. He warns against plot. If a rigid set of events must happen, characters become unreal and robotic. Let them breathe and accept things might stray from your original vision. There’s an analogy to science fiction, where the cardinal sin is unclear rulesets. Good science fiction states the rules of the game and then follows them. It’s OK to have faster-than-light travel or telepathic aliens, but explain what’s possible and stick with it. There are no stakes if the characters are always rescued by their robot butler revealing some previously unknown superpower. Both King’s formula and good science fiction are based on the same principle: Set up a system with a ruleset and then let it go. The fun is in watching how things evolve from the initial conditions. He stresses: Unless you’re famous, the title and introduction are what determine if anyone reads you. For introductions he says to give a surprising personality or action so the reader will hunger for more. Here are some great first sentences. There’s no formula. The takeaway is that these choices are important, some people are good at making them, Stein Sol is one of those people, and all the authors who refused to listen to him did so at their peril. The view that beating a third-rate Serbian military that for the third time in a decade is brutally targeting civilians is hardly worth the effort is not based on a lack of understanding of what is occurring on the ground. It’s not a lack of understanding of what is occurring on the ground that creates the view that it’s hardly worth the effort to beat a third-rate Serbian military that is brutally targeting civilians for the third time in a decade. You may suspect a simple trick. But look at the transformation. We’ve permuted chunks ABCDE into EDABC."
