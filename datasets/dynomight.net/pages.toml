["https://dynomight.net/better-DIY-air-purifier.html"]
title = "The Cuboid: A DIY air purifier that's better than a box-fan"
description = "Designs for a quieter, more energy efficient purifier, and data proving it really works."
full_description = "I love box-fan based air purifiers. They are cheap, trivial to build, and people around the world have done experiments to show they actually work. Still, box-fan purifiers have two downsides: They create a lot of noise, and they consume a fair amount of electricity. I’ve done some experiments comparing this to a box-fan based purifier, using the same filters. Here’s a summary. Less is better for everything except the clean air delivery rate (CADR). The half-life is calculated in a 31 m³ room. Electricity costs assume operation 24 hours/day at 1 kWh = $0.13. As you can see, the cuboid gives major improvements in noise and electricity consumption, with small regressions in cost, difficulty of construction, and IED resemblance. Particularly on low, the cuboid is very quiet and energy-efficient. Somewhat accidentally, it’s also better at removing particles. Air purifiers push air through filters. If you’ve ever built a box-fan-based air purifier, you noticed that once you attach HEPA filters, throughput decreases dramatically. If you use a weak fan, it will barely push any air at all. If we want to be quiet and energy-efficient, the choice is clear: Use a relatively weak fan, but with a large filter surface area. Using more filters has a higher upfront cost — filters aren’t free. However, that extra cost disappears over time. If each filter can remove a fixed amount of particulates before it needs to be replaced, then doubling the number of filters means also doubling the replacement interval. Inline duct booster fans are fairly weak fans often used to help with grow rooms or range hoods. An inline duct fan would probably perform even better (see the discussion) but at a higher cost. The one I bought is rated to push around 12 m³ of air per minute. You can use filters and fans of different sizes if you want. All that matters is that the fan has a smaller diameter than the filters (20.32 cm < 22 cm). The pieces of foam also need to be at least as large as the matching dimension of the filter. I just used the foam that my fan was shipped in."
