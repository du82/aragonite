["https://dynomight.net/2020/09/29/doing-discourse-better-stuff-i-wish-i-knew"]
title = "Doing discourse better: Stuff I wish I knew"
description = "What do we know about how to communicate effectively and find the truth?"
full_description = "Nick and Maria want to talk about sugar. Does it reduce lifespan? They disagree, but are honest and principled. They want to find the truth and agree on it. How should they talk? Take turns? Try hard to be polite and respectful? Allow interruptions? Search for origins of disagreement? Areas of agreement? Make bets? Get a moderator? Or maybe Nick and Maria want to talk about tax-exemption for churches. It might be hard to get consensus, since this is a matter of opinion. Still, they’d like to reduce their disagreement to different underlying values. What should they do? Repeat the other’s argument? Tell personal stories? Run ideological Turing tests? Do conversations have known best practices? How much do they improve the odds of landing on the truth? In East Africa 70,000 years ago, humans made their first steps towards language. This didn’t happen for truth, it happened to increase reproductive fitness. Overly open-minded people were probably easy to manipulate. Scrupulously honest people were probably bad at manipulating. Many false beliefs still enhanced reproductive fitness (typically by improving cooperation). So, one might argue, of course we are terrible at finding truth via conversation! Why are we surprised that our instincts are bad at something we never evolved to be good at? Doing some research, Maria finds the work of Robert Cialdini, who says we are persuaded by reciprocity, scarcity, authority, consistency, liking, and consensus. But these don’t seems useful to Maria. They are mostly “dark patterns” of persuasion, that work for anything regardless of its truth. Instead, are there “non-dark” patterns of persuasion, that work well for true stuff but not for false stuff? Over a few months, Nick and Maria have a dozen of these conversations. The results are exactly what you’d expect: No one ever changes their mind about anything. Maria has a feeling she can’t be right about everything. But try as she might, she can’t find a case where Nick’s arguments convince her."
