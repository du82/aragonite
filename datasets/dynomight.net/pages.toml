["https://dynomight.net/2020/12/03/why-im-skeptical-of-UBI"]
title = "Why I'm skeptical of universal basic income"
description = "Common arguments for universal basic income are about liberty or automation of jobs. The “real” argument is much more mundane."
full_description = "Universal basic income (UBI) is an odd duck. Proponents range from futurists to libertarians to social democrats. Why this weird range of people? There are different versions of UBI, with different motivations. People don’t get how contradictory these are. Libertarians and social democrats might both support a fuzzy idea of “UBI” but they are unlikely to agree on specifics. I don’t think it matters though. I’m skeptical of these interesting versions of UBI. The only realistic option is another, boring version. Why isn’t it discussed more? The more you think about it, the more of a riddle that is. The government is stupid and inefficient. There’s medicare, medicaid, social security, food stamps, “other food stamps”, welfare, “other welfare”, and unemployment benefits, each with a bureaucracy. Did you know that each item in a supermarket has been classified as buyable with food stamps or not? (Energy drinks are usually OK, toothpaste is not.) And there’s a different classification for the “other” food stamps? (No spices or drinkable yogurt.) And that if you lose your job you need to provide evidence each month that you spent 80 hours looking for a new one? These expensive programs are often miserable for the people they’re supposed to help. Let’s stop micromanaging people’s lives, cut the fat, and just give people money. I see the appeal, and if you want to reorganize cash transfers like social security and call them “UBI”, that’s fine with me! But it’s unlikely UBI can replace medicaid. To see why, consider schools. Sometimes the government runs them. Sometimes the government merely pays for privately run “charter” schools. Sometimes the government pays for “vouchers” that subsidize a fraction of expensive private schools. Why do things this way? Why not give parents (or kids?) the money and let them spend it however they want? The answer is obvious, even if we don’t usually say it explicitly: We don’t trust people and we want to control them. Educating kids is an investment that benefits everyone in the future. If we just gave parents cash, I’m sure many would arrange for a better education than the government does now. But I’m also sure many would spend it on wacky religious schools, or crystal healing seminars, or beer."
