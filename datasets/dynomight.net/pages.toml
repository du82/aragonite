["https://dynomight.net/analogies"]
title = "How to use analogies for good not evil"
description = "Five proposed rules to make sure you’re using analogies for good"
full_description = "People in the West often think of ramen as a defining Japanese food, but that’s not how the Japanese see it. Ramen only arrived in Japan in 1910 when a shop in Tokyo opened with 12 Cantonese cooks. It’s still common to refer to ramen as chūka soba (“Chinese soba”). Rather than trying to classify it as “Japanese food” or “Chinese food”, a better way to think about ramen is like Chicago-style pizza. It’s adapted to local tastes but derived from an import that’s still central in people’s minds. In the early 1970s, a group of 150 young couples in Washington DC formed a baby-sitting cooperative. Everyone got some coupons they could trade for one hour of babysitting time, after which whoever got the coupons could re-use them. At first, this didn’t work. Couples wanted to keep a reserve of coupons and so were hesitant to use theirs before they earned some from others. But others were thinking the same thing, so no one traded anything. They eventually solved the problem by issuing more coupons until people started using them and everyone lived happily ever after. This is analogous to how recessions happen in the real economy: If everyone gets scared about their future, they’ll slow down spending until they have a cushion of savings. But since everyone else is thinking the same thing, it’s hard to earn money, and economic activity slows even though everyone would like to both earn more and spend more. If the money supply is expanded, the economy can pick up. Evolution tuned single-celled organisms to KILL CONSUME MULTIPLY CONQUER and then those cells assembled into multicellular life for mutual benefit but single cells still have the same incentives so they sometimes defect—cancer. This is analogous to how evolution tuned animals to KILL CONSUME MULTIPLY CONQUER and then those animals assembled into packs/herds/villages for mutual benefit but individual animals still have the same incentives so they sometimes defect—steal food, kill other people in the village, etc."
