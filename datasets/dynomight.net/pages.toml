["https://dynomight.net/automated"]
title = "Thoughts while watching myself be automated"
description = "(Excluding “please stop”)"
full_description = "An old friend visited me a few weeks ago. And we soon got to chatting about—what else—how long will it be before all human intellectual work is automated. My position was: I dunno, because things are moving fast right now but what if we run out of data or scaling laws break and algorithmic progress stalls? His position was: Soon. Then he started asking about this blog. What were the most popular posts? This was slightly ominous given his regrettable tendency not to consume most Dynomight internet content. But I told him probably Underrated Reasons to be Thankful and its sequels, and that seemed to be the end of it. But then a week later, he texted to ask if I had any other short-form writing. And then he sent me a list of previous Reasons I’d written and asked me to rank them by quality. And gradually it dawned on me that he had decided it was time to automate me. Soon he started sending new AI-generated Reasons. Which weren’t great. But then he tuned his prompt and they got better. And then he switched models and increased the scale by 1000x and added a secondary scoring AI and tuned the scoring AI prompt and the Reasons got better and better and better and better. And as I watched all this happen, I couldn’t help but reflect: In old science fiction, people imagined robots that were totally precise and accurate and rational but couldn’t fathom the messy “soul” of humanity. Modern AI is exactly the opposite. It could easily copy my writing style after a small number of examples. The biggest challenge was to get the damned facts right. That if you somehow took the 33,000 nuclear warheads on the planet and got them to a white dwarf star […] then the resulting explosion would be visible from 1,000 light years away with a magnitude of 7.6, comparable to the supernova of Betelgeuse, so we’re not total lightweights. Looking back, perhaps the old science fiction robots were a projection of our fantasies. I want my style and voice to be precious and uncopyable. I want an AI assistant that will tirelessly hunt down facts while I provide creativity and panache and magic. But that’s not how it is. So we should remember: In a scenario where AI is useful but humans retain some comparative advantage, we might not like where that comparative advantage lies."
