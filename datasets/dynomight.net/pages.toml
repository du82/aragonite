["https://dynomight.net/2020/09/17/making-the-monty-hall-problem-weirder-but-obvious"]
title = "Making the Monty Hall problem weirder but obvious"
description = "It’s this simple: Do you want what’s behind one door or the other nine?"
full_description = "Many people guess it doesn’t matter if you switch. But in reality, switching gets you the car 2/3 of the time. This post claims that these problems are really just disguised versions of each other. We’ll start with the Obvious Problem, apply a series of small changes that clearly don’t change the solution, and end up at the Monty Hall problem. There’s nothing mysterious here. You should choose option B. There’s only a 10% chance you picked the right door, so there’s a 90% chance the car is behind one of the others. Monty’s statement changes nothing. You don’t need to rely on his trustworthy looks. You already knew there were at least 8 goats! Option B still gets you the car 90% of the time. The key insight is this: When Monty shows you that 8 of the 9 other doors contain goats, you haven’t learned anything relevant to your decision. You already knew there were at least 8 goats behind the other doors! So this is just like game 2. Option B still gets you the car 90% of the time. Want more intuition? Suppose you picked door 3. Imagine Monty walking past the doors, opening doors 1, 2, 4, 5, 6, skipping 7, then opening 8, 9, and 10. Doesn’t door 7 seem special? The only difference with Game 3 is that option B doesn’t get you the 8 visible goats. Since you don’t care about goats, this makes no difference. This is still just like game 3. You get the car 90% of the time by switching. Of course, you still want to choose option B. The chance of success is now 2/3 instead of 9/10. This game is exactly Monty Hall, so we’re done. The “best” way to think about the Monty Hall problem is simple: There’s a 2/3 chance at the beginning that you picked a door with a goat behind it, and nothing that happens after changes that. The only purpose of the extra steps above is to give more intuition for why the extra information you get from opening a door doesn’t change the probabilities. It’s important that Monty looked behind the doors before choosing which to open. This is where people’s intuition usually fails. If he had chosen a door at random — in a way that he risked possibly exposing a car, then the situation would be different. (In that case, there’s no advantage or harm in switching.) But he doesn’t choose the door at random. He deliberately chooses to show you goats. Since this is always possible, it tells you nothing. I think this is the crux of what makes this problem unintuitive: If the host had picked a random door, the intuition that it doesn’t matter if you switch would be correct!"
author = "dynomight"
year_published = 2020
year_updated = 2021
