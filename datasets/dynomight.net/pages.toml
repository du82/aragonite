["https://dynomight.net/no-self"]
title = "Reasons and Persons: The case against the self"
description = "A review of the thought experiments in Reasons and Persons by Derek Parfit (part three)"
full_description = "You want to go to Mars. There’s a machine that will scan and destroy all the matter in your body, send the locations of every atom to Mars, and then recreate it. You worry: Does this transport you, or does it kill you and make a new copy? Still, your friends use the machine and they seem fine. And you figure you’re a pattern of atoms, not the atoms themselves, so you decide to take the machine. After you press the button to start it, you’re surprised to find that you’re still on Earth. You ask the technician, “Did the machine fail?” “No, no”, he responds, “Did we not tell you? The new scanner records your blueprint without destroying your body. Not to worry, we’ve already transmitted the information to Mars. This body will be destroyed in a few minutes.” You’ve probably heard some version of this thought experiment before. It originally comes from Derek Parfit’s 1984 book Reasons and Persons. He claims to answer if you’re being transported or killed, and then reflects on how to think about your future self, abortion, the morality of prisons, and your own mortality. You’re going to have a painful surgery, for which you must be awake. But before the surgery, a doctor will use a machine to make your neurons fire so that your personality and memories are completely replaced with those of Napoleon. Does this mean it will be Napoleon who suffers during the surgery, rather than you? Or, suppose there is a dial: At one end it does nothing, while at the other end it replaces all your memories with Napoleon’s. At what intermediate position do you stop being you? Scientists are going to subject you to another machine with a dial: At one end, nothing happens. At the other end, 100% of your cells will be destroyed and replaced with exact duplicates. Before the machine starts, you wonder, “Am I about to die?” Would that be true if 1% of your cells were replaced? What about 30% or 90%? There’s another machine with a dial. At one end, nothing happens. At the other end, 100% of your cells will be destroyed and replaced with those of Greta Garbo. At intermediate positions, the resulting body, memories, and personality will be a mixture. At what position at which you stop being you and start being Garbo?"
