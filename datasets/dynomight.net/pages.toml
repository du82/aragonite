["https://dynomight.net/copies"]
title = "Buy more copies"
description = "Sometimes weirdness does pay"
full_description = "I’ve always wanted to believe that you could get enormous advantage in life just by willing to be weirder than other people. And when I read about people like Amos Tversky (leave movies early! go jogging in your underwear! throw away your mail unopened!) it almost seems true. But sadly, I’ve come to accept that weirdness rarely pays large dividends. But sometimes weirdness does pay. And when it does we must celebrate it. So here’s a humble case: When you buy something, I think you’d often be better off buying multiple copies of that thing. For example: Say you’re at the supermarket, and something you often eat is on sale. What to do? Most people buy a bit more. But if the food isn’t perishable why not buy a lot more? (There was a time when something was on sale I might buy the entire available stock. But there were a couple incidents where friends saw me do this and reacted with horror. I couldn’t make out if that was because they saw it as a defection against other shoppers or if it was just the strangeness of buying 23 cans of cannellini beans. Either way, I’m less aggressive now.) Or even if something isn’t on sale—if you need to buy fuel for your car, you likely fill the entire tank. That way you don’t need to buy it as often, and you have less risk of running out. But doesn’t the same logic apply to mustard? Restaurants. I’m a big fan of sharing food. Even if dish A is better than dish B, a mixture of A and B might be better than A alone. But many people don’t like to share, but still avoid ordering the same thing as others. Why? Or even with sharing—I often go to a pizza place where one type is vastly better than all others. Depending on who I go with, there’s often a sentiment when ordering that we can’t just get multiple copies of the same pizza. So we get some other variety, and after the food comes all the good pizza disappears immediately and we spend the next hour gazing sadly at the inferior pizza. Clothes. Say you find a shirt that looks great and fits you perfectly. Clothes don’t last forever! When it’s gone, it might not even be available anymore. Having redundant copies also allows you to wear the same shirt twice as many times without doing laundry. Especially if you dislike shopping, getting multiple copies of exactly the same shirt is a gift to your future self."
