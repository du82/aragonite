["https://dynomight.net/arguments-2"]
title = "Things to argue about over the holidays instead of politics II"
description = "Report back on how it goes"
full_description = "Why doesn’t basketball have height classes, like boxing has weight classes? Would a height cap for the NBA increase the mean level of athletic talent? Would it make games more or less fun to watch? In the early 2010s, it looked like online courses might overturn higher education. Why didn’t that happen? Was the fate of online courses predictable at the time from the history of Open University, which offered remote education since the 1970s by mailing people chemistry kits and broadcasting (often excellent) lectures on air at night? Research suggests that tutoring might boost performance by two standard deviations over typical classes, yet only a small fraction of parents who could pay for tutoring do so. Is that because they don’t know, don’t believe, or don’t value performance that highly? To what degree are nonfiction books written (a) to convey information, (b) to try to make the author’s life historically significant, (c) as an excuse for a book tour, (d) to look good on a bookshelf, (e) as bait for overly-aspirational buyers, or (f) to serve as meaningful-seeming gifts? How many fewer books would exist without (b)-(f) as implicit subsidies? Could a sufficiently-capable AI be as good at tutoring as a human, or is the magic in how we respond to sitting across the table from a meat-based intelligence? If a strand of your girlfriend’s hair touched you food, how much does the grossness depend on if it was still attached to her head at the time? While that ranking is not subject to debate, why are so many languages, instead of moving up the ladder, going down to smart double quotes? Why do popular restaurants book up months ahead instead of charging market-clearing prices on Saturday night? And why do coffeeshops combat laptop captains with covered power outlets and passive-aggressive glares rather than charging by the hour? What recipes have the highest return on invested effort? (I vote for Tuscan beans with tomatoes: Fry garlic in olive oil, add white beans, cook, add tomatoes, cook. In emergencies refer to as Fagioli all’Uccelletto.) Is low ROI why so few restaurants offer risotto?"
