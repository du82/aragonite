["https://dynomight.net/control"]
title = "Why ‟controlling for a variable” doesn't (usually) work"
description = "It’s just adding a variable to a regression."
full_description = "I’ve always seen cathedrals as presenting a kind of implicit argument to atheists. Something like: God must exist, because otherwise it would have been insane for people to build this: This is how I feel about the idea of “controlling” for stuff in statistics. You read things like this all the time: These analyses are everywhere in contexts where what we care about is if X causes Y. Everyone knows correlation doesn’t imply causation. But here we controlled for Z. So maybe it’s OK? Everyone seems to act like it’s OK. If these analyses didn’t work, then everybody would be crazy. So they’ve got to work, right? What does it mean to “control” for something? Papers love to use scary terms like Cox Proportional-Hazards Model and Linear Structural Causal Equations. These hide the embarrassing reality that all it means to control for something is to add a variable to a regression. Say you want to know if drinking alcohol makes people fatter. So you go find some people and measure how much they weigh and how much they drink. (Of course, you can’t conclude anything from just five data points—I’m just trying to keep things simple.) If you squint, the trend seems to be that heavier drinkers are a bit lighter. You can confirm this by fitting a regression: You look for constants a and b such that You want the best approximation, i.e. the constants that minimize the average squared error. If you do this for the above dataset, you get a fit of The naive interpretation of this would be that drinking makes you thinner. Which would be very weird if true. But then you have an idea: It could be that the same people who drink less also tend to eat more. So you call up everyone and ask how much they eat in a day: That’s it. You “controlled” for calories. In almost all cases, this is what it means to control for something. The details vary a bit depending on the analysis, but it’s ultimately just sticking a new variable into a linear approximation somewhere."
