["https://dynomight.net/stoves"]
title = "A summary of the research on gas stoves and health"
description = "How much nitrogen dioxide do stoves make and how much does it hurt you?"
full_description = "the concentration of harmful nitrogen oxides – a byproduct of burning natural gas – can reach or surpass a healthy limit within minutes, especially in homes with small kitchens. Gas stoves are a threat to health and have larger climate impact than previously known, study shows (CNN) the evidence against gas stoves is damning. […] Homes with gas stoves can contain approximately 50 to 400 percent higher concentrations of NO2 than homes with electric stoves compelling evidence that gas appliances can produce levels of air pollution inside homes that would be illegal outdoors in the United States Let’s agree that gas stoves affect health, but how much? After all, someone who loves gas cooking might rationally view some level of harm as an acceptable tradeoff. Now, gas stoves appear to increase the odds of asthma in children, perhaps by around 40%. This is important, but I wanted to know something else: What do gas stoves do to life expectancy? I couldn’t find any concrete estimates. So I made one. My best guess is that if you use a gas stove for your entire life instead of an electric stove and change nothing else, that shortens your life expectancy by around 53 days on average. That’s assuming you have a well-maintained stove with an electronic ignition. If you have a pilot light instead, you should increase it to 88 days. If the stove is broken, it could be worse again. They create various kinds of indoor air pollution. The most important difference from electric stoves is that they create more nitrogen dioxide (NO2). This hurts you because it has an extra unpaired electron so that after it gets into your respiratory system it reacts with many random molecules, causing problems like inflammation. If someone is exposed to an additional 1 μg/m3 of NO2 for their entire life our best estimate is that decreases their life expectancy by around 7.3 days. This number comes from looking at mortality statistics for large groups of people and relating them to outdoor NO2 levels."
