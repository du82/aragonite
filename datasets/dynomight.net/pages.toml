["https://dynomight.net/espionage"]
title = "Everything is espionage: Things I learned researching Assange"
description = "(espissange? asspionage?)"
full_description = "Who is this Julian Assange guy? Is he good or bad? Did he do espionage? Why is the US so obsessed with getting its hands on him? At dynomight.net we don’t like to answer questions. Instead, we prefer to replace them with more abstract questions that we also don’t answer. You work for the CIA. You’re a sweaty/greedy type and decide you want a Bugatti so you sell a list of CIA spies to Russia. You work for the CIA. You decide the US is an evil empire so you give a list of CIA spies to Russia for free. You work for the CIA. At a cafe, a barista is mean to you and in your grief you forget a list of CIA spies on a table. Russian agents later pick it up. You work for the CIA. You find some documents that prove the CIA is doing illegal stuff and give them to the New York Times. You work for the New York Times. You give a friend at the CIA some tips on how to steal some documents that prove the CIA is doing illegal stuff. The documents also contain a list of CIA spies, but whatever, you publish them anyway. You work for the New York Time. Unprompted by you, a friend at the CIA gives you some documents that prove the CIA is doing illegal stuff. There’s also a list of CIA spies, but whatever, you publish them anyway. You work for the New York Times. Unprompted by you, a friend at the CIA gives you documents that prove the CIA is doing illegal stuff. You redact any sensitive information and publish them. You have a blog. One day, you’re messing around with some publicly available datasets and realize that they prove the CIA is doing illegal stuff. You publish your findings. You have a blog. You don’t live in the US. You’re not political. One day, you get interested in, like, how much US natural gas production depends on machine tools imported from China, so you do some research and publish a post on that. Which is right? When I started looking into this, I expected the answer to be found in an examination of what Assange did. And, sure, that matters. But I quickly learned that I had no idea how the law actually works, and the reality is really weird. So let’s start there."
