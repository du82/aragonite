["https://dynomight.net/copypasta"]
title = "A model for journalistic copypasta"
description = "Why are prestigious outlets often so mediocre, and why do we read them anyway?"
full_description = "Erik Hoel recently bemoaned that high prestige outlets like the Guardian somehow get away with this kind of “copypasta”, as well as dark patterns like deliberately making it hard to find the original scientific paper. He also suggested that if independent authors tried any of this nonsense, they’d be crucified, so maybe everyone should follow more independent authors. I mostly agree, but I’m pessimistic. We should think more about why this happens. Because, unfortunately, I’d bet against any huge changes coming soon. Why? Trust. Despite their mediocrity, people trust places like the Guardian, and—I claim—this is not a mistake. The world is full of outright lies, it’s hard to know who you can trust. The Guardian provides a consistent bare-minimum level of quality across a wide range of topics, which is not easy. So I suspect the market is reasonably efficient: The fancy places provide real value, even when serving up journalistic mush, and readers are making reasonable decisions when they pay attention to them. Unless the distribution of writing changes somehow to upset that dynamic, I suspect the copypasta will continue. I’d even go a little further: For complicated subjects, prestigious places are rarely the best sources. To pick an example close to my heart, take air purifiers. There are lots on the market, but to know if they truly work, we need to test them. This isn’t terrible, but it’s not very good. You’re only taking two measurements, so any noise will screw up the final ratio. This leads to them doing things like publishing two different tests of the same air purifier that imply clean air delivery rates that vary by a factor of 2.4. Meanwhile, Internet People like Smart Air or Jeff Kaufman do tests that show the entire trace of particles over time. Here’s one from me: Now, there’s no special brilliance needed to come up with this kind of test. Frankly, it’s pretty obvious and I’m sure the Wirecutter knows they could do it. They just don’t."
