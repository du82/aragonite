["https://dynomight.net/aliens"]
title = "I still think it's very unlikely we're observing alien aircraft"
description = "They’d have to be messing with us."
full_description = "A priori, there’s no reason there shouldn’t be alien aircraft. Earth is 4.54 billion years old, but the universe is 13.7 billion years old, and within a billion light years of Earth there are something like 5 × 10¹⁴ stars. Most of those stars have planets, and if an alien civilization arose anywhere and built a von Neumann probe, those probes would spread everywhere. We have tons of observations that would be more likely if there were alien aircraft around than if there weren’t. These include: None of these things are individually conclusive. But they’d be more likely to happen if there were aliens, right? then don’t we have to conclude that the posterior probability P[aliens | everything] is pretty high? Okay, say there’s a universe with at least 10²⁴ stars, and most stars have planets, and on one planet somewhere life has evolved and started sending stuff to other planets and has an ever-accelerating pace of technological development. Then I would agree—the odds that there would be alien aircraft on my planet seem good. It seems like we—or our artificial descendants—might well send aircraft to other planets. So why shouldn’t alien aircraft be here, now? Second, it takes eyewitness reports seriously. There are a huge number of reports by pilots seeing objects accelerating at insane rates with no obvious wings, control surfaces, or signs of propulsion. It’s a mistake to dismiss these as a product of diseased minds or attention-seeking. There are just too many reports—both civilian and military—sometimes from pilots in different planes at the same time, sometimes invisible to radar and sometimes confirmed by radar from multiple sources. Usually, these people make little effort to draw attention to themselves—we only hear about their observations secondhand. They seem serious and well-intentioned. (I hesitate to mention this, but I even have family members that report seeing something very strange years ago. I respect their intelligence and I don’t think they have an agenda—they barely talk about it and don’t consider it very important. The story goes that I myself saw it, but I was very young and remember nothing.)"
