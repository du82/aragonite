["https://dynomight.net/ikea-purifier"]
title = "Contra Wirecutter on the IKEA air purifier"
description = "The Wirecutter’s review of the IKEA air purifier is a mishmash of scientific errors, shoddy testing, and self-contradictory logic."
full_description = "They allow that this purifier is inexpensive and pretty. But still, it’s terrible and you should instead buy a different purifier that totally coincidentally happens to pay affiliate marketing commissions. When reading this review, I couldn’t help but notice that it’s rife with factual errors, misleading statements, and self-contradictory experiments. I also noticed that this stems from an ignorance of basic science, air filtration standards, IKEA’s public specs, and the same common-sense logic the Wirecutter uses elsewhere for other purifiers. They make a big deal about this, which is weird since “true-HEPA” has no legal or scientific meaning. Meanwhile, they refer to the IKEA purifier as using a “PM2.5 filter” which also isn’t a thing. What is the filter that the IKEA purifier uses? Well, perhaps we should, I don’t know, read the IKEA website? From these details, we can quickly figure out that there is a European HEPA filter standard, with various classes: The IKEA purifier uses a filter of class E12, whereas the one the Wirecutter recommends instead uses a filter of class H13—one level stricter. So it seems Wirecutter is using “true-HEPA” to mean “H13”. Except—what’s the logic here? This difference is core to Wirecutter’s dismissal of the IKEA purifier. But we are never given a reason why H13 is good enough, but E12 isn’t. Surely it’s not just that higher numbers are better? Because then why not insist on a level 17 filter? They never once recognize the IKEA filter is of class E12, instead using the misleading term “PM2.5 filter” and saying things like: It’s designed to capture PM2.5—that is, particles 2.5 microns in diameter and above, in contrast to the 0.3-micron HEPA standard. If you’re looking to improve your indoor air quality, a true-HEPA [is] exceptionally good at capturing ultrafine smoke particles, down to at least 0.01 micron in diameter. [The IKEA purifier is] optimized for larger airborne particles, such as pollen and mold spores, rather than for very fine particulates like wildfire smoke, as HEPA filters are."
