["https://dynomight.net/balkans"]
title = "Notes on the Balkans"
description = "Sixteen observations on Albania, Montenegro, and Macedonia"
full_description = "People say the cafes in Albania are great. This is true. They are similar to Italy but with environments that are more laid-back and… better? Standards are remarkably high even at roadside cafes next to petrol stations. People say people in Albania are relaxed and friendly. True. So true that for this reason alone the country will forever have a place in my heart. Essentially every interaction we had with an Albanian was positive, even when we did idiotic things. Once we walked into a construction site in the mountains and asked a guy, “Is this a hiking trail?” Confused, he said “No, this is a private house… But you’re welcome to walk around!” I don’t get it—don’t Albanians have bad days? And what about all those theories where Communism makes everyone cold and pitiless? Across the border to the North there was a sharp cultural change. People were totally fine, on par with large cities in North America or Western Europe. It’s just that the reassuring smile you get from every Albanian every time was gone. We once thought this pattern was broken by a friendly waiter, but after examining his name tag realized he had an Albanian name. Like everyone, I sometimes fantasize about quitting it all and living an idyllic rural lifestyle. But when I actually see rural life, it seems to involve a lot of truck stops. In the Balkans, the rural lifestyle up close still looked damned idyllic. Albanian history is a long series of different regimes—Greeks, Italians, Ottomans, Communists—none of which are described in museums or historical sites with particular reverence. Though people seemed OK with the general direction of things since the 1991 end of Communism, one driver called it “democracy”. Anyway, being used to the past being distorted to give neat lessons for modern ideological battles, I found this kind of refreshing. The term “Macedonia” is controversial. After the breakup of Yugoslavia in 1991, the Republic of Macedonia became an independent country. But the region historically known as Macedonia also includes a big chunk of Northern Greece and a bit of Southwest Bulgaria. Greece was upset about another country using this name, as many Greeks see themselves as ethnic Macedonians, and feel they are the rightful heirs of the history of Alexander, etc. The Republic of Macedonia wanted to join NATO and the EU, but Greece promised to veto this unless the naming dispute was resolved. They started negotiations in 1995 and finished 23 years later with the Republic of Macedonia renaming itself North Macedonia."
