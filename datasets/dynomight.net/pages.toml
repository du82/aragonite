["https://dynomight.net/2020/11/23/police-violence-why-fairness-is-basically-unobservable"]
title = "Why fairness is basically unobservable"
description = "Why it’s basically impossible to determine fairness from observational data."
full_description = "We want to know if things are fair. Do some groups of people tend to get a raw deal in company hiring or university admissions or court sentences? There seems to be an obvious way to answer such questions: Get some data and “check” for bias. But different people often get different results, even when looking at the same data. What’s going on? What’s going on is the whole strategy is doomed. It’s counterintuitive, but you usually can’t determine bias this way. The problem boils down to that in order to “check” for bias you must do something to your data called stratification. This can totally change the results, and there’s no single best way to do it. Let’s do a thought experiment. You live in a city inhabited by blue people and red people. There are constant debates about if police are biased against either of these groups. Eventually, you decide to take action. You find 1024 blue men and 1024 red men, give each a suspicious looking stack of $20 bills and tell them to jog outside for an hour while holding the stack. Finally, you count the number that are arrested in each group. (You have a very good relationship with your local IRB.) You show your data to a friend. She notices that the blue men in your population were more often old (over 35) while the red men were more often young (35 or less). In particular, your data has these demographics: Now this suggests a bias against blue men. The police arrest young blue men more often than young red men, and similarly for the old. The reason the previous analysis suggested a bias against red men is that more of them are young. Your friend pokes at the data some more. She points out that reds are more likely to live in Riverview, while blues are more likely to live in Pineway. Specifically, you have these demographics: In each age-location group, reds were more often arrested than blues. The difference from the previous analysis is that blues tend to live in Pineway, and police more often arrest people in Pineway."
author = "dynomight"
year_published = 2020
year_updated = 2021
