["https://dynomight.net/humidifiers"]
title = "The case against ultrasonic humidifiers"
description = "Why it’s better not to use an ultrasonic humidifier"
full_description = "Absolutely true! However, as typically used, ultrasonic humidifiers might cause health problems. This is supported by an abundance of peer-reviewed research papers. It’s also the quiet opinion of many different government agencies. The good news is that the problem is trivial to solve: Steam and evaporative humidifiers don’t have the same issue. The evidence for this is strong. Outdoor particle levels vary throughout the world and statistics link these levels to health problems including heart disease, strokes, kidney disease, respiratory infections, and lung cancer. The mechanism appears to be that tiny particles make their way through the lungs into the bloodstream. These particles then activate the immune system causing all sorts of havoc. The idea that particles cause health problems is widely accepted (Wu et al, 2021). A good heuristic is that an increase of 33.3 PM2.5 μg/m³ costs around 1 disability-adjusted life year. Correia et al. (2013) estimated something close to this from different counties in the US, and more recent data from many different countries confirm this. The most polluted cities in the world have levels around 100 PM2.5 μg/m³. Ultrasonic humidifiers create tiny droplets of water, including any dissolved solids. The water quickly evaporates, leaving the solids in the air. Ultrasonic humidifiers […] create tiny droplets consisting of water and its impurities. Once the water evaporates, the impurities can remain suspended as airborne particles. One of the primary concerns for household humidifiers is their ability to aerosolize pathogenic microbes. […] This white dust was associated with respiratory distress in children if inhaled Ultrasonic humidifiers were found to have a substantial impact on home indoor concentrations and personal exposures for SO42- as well as PM2.5, likely as the result of aerosolization of sulfates and other dissolved minerals present in the water. For the two subjects with ultrasonic humidifiers, personal SO42- and PM exposures were approximately two and five times greater, respectively, than corresponding ambient concentrations."
author = "dynomight"
year_published = 2021
year_updated = 2021
