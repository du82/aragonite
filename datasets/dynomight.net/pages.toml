["https://dynomight.net/blocked-persons"]
title = "Blocked persons and letters of marque"
description = "What are letters of marque and reprisal, and who is on the US’s list of Block Persons?"
full_description = "The Congress shall have Power to declare War, grant Letters of Marque and Reprisal, and make Rules concerning Captures on Land and Water; Essentially: Permission for private citizens to carry out acts of war. If you could convince the government to write one for you, then you were a “privateer” and you could go searching the seas for plunder. The last time these letters were used was during the War of 1812 wherein the Prince de Neufchatel—that’s an American Ship, not a French vampire—was authorized to hunt British vessels. The last time they were considered was during Andrew Jackson’s administration of 1829-1837. Surprisingly enough, this practice led to abuses, like people getting letters from the governments on both sides in a war, or pirates bribing corrupt governments to give their activities a veneer of legitimacy. Thus, the practice was mostly banned by the Paris Declaration of 1856. The US refused to sign that declaration on the grounds that it had a puny formal navy. This position caused some difficulty during the Civil War of 1861-1865. While the Union had around 42 warships at the time, the Confederacy had almost none. Thus, the Confederacy turned to letters of marque, which disrupted Union shipping in the Caribbean. This put Lincoln in a difficult position: He could have issued his own letters, but this would have angered Britain, which Lincoln hoped to get help from. He tried to belatedly join the Paris Declaration, but Europe felt that this was tantamount to taking a side in the conflict. In the end, the Union had to abstain from using letters of marque while the Confederacy did use them. Legally, the Union did not regard the Confederacy as a legitimate party in a war. Thus, they tried captured privateers as ordinary pirates, under the theory that Confederate letters of marque were meaningless. This would have subjected those privateers to the death penalty. After Confederate President Jefferson Davis promised to execute captured Union officers in response, the Union backtracked."
