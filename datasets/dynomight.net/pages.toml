["https://dynomight.net/nukes"]
title = "So you want to invent a nuclear weapon"
description = "From atoms to big boom."
full_description = "You’re in the mood for destruction. One day, you hear about this phenomenon of “radiation” where matter gives off energy. You think—perhaps you can harness this property of nature to make a big boom. Apparently matter is made of discrete objects called atoms, which have nuclei made up of protons and neutrons. To say that an atom is “radioactive” is to say that it sometimes randomly does things like: How often these things happen depends on how many protons and neutrons are in the nucleus. Of the above, fission releases the most energy by far so you decide to use fission to make your boom. Unfortunately, it’s hard to find atoms that do much spontaneous fission. A plutonium-240 atom decays on average after 6569 years, and when that happens, there’s only a 0.0005% probability of fission, rather than α decay or whatever. And even if you somehow assembled a big pile of atoms that wanted to undergo spontaneous fission, they would…undergo spontaneous fission, and start being different atoms. You need to build something you can trigger. In search of a trigger, you eventually try shooting neutrons and protons at atoms. The protons get repelled by electrical charges, but neutrons sometimes get absorbed into the nucleus. Often, the effects of neutron absorption are mundane. Hitting cobalt-59 with a neutron produces cobalt-60, but all cobalt-60 does is slowly decay (via β-decay, with a half-life of 5.27 years) into nickel-60. But if you hit a nucleus with a fast-moving neutron, that can induce fission. With enough kinetic energy, you can make basically any heavy atom undergo fission in this way, generating energy in the process. To make a weapon, you need to suddenly, on demand, fire astronomical neutrons at all your atoms. How are you going to do that? What you need is some kind of chain reaction—that the neutrons that are emitted by the fission of one atom can also cause fission in other atoms. Usually, this doesn’t happen. A high-energy neutron can cause fission in uranium-238, but the neutrons it puts out don’t have enough energy to break up other uranium-238 atoms in the same way."
author = "dynomight"
year_published = 2022
year_updated = 2022
