["https://dynomight.net/moderate"]
title = "The anxiety of the moderate"
description = "Wouldn’t it be quite a coincidence for this to be the moment public opinion got it right?"
full_description = "It’s tempting for the moderate to strut. Isn’t it enlightened to see truth in both sides? To calmly rise above the squabbling? But there’s a strong argument against moderation: Public opinion has been evolving for hundreds of years. Many things that are moderate today were “extreme” very recently. Isn’t it quite a coincidence that right now happens to be the time in history when public opinion got it right? I guess that’s possible. But isn’t it more likely that moderates are being swept along by history—positioning themselves near the middle of public opinion and then rationalizing it afterward? As a moderate-ish person, this worries me. Yet, I can’t shake the idea that moderation is good, and the world would be better with more moderates, and that moderation often is more enlightened. Note: It’s easy to defend “heterodox” people who have a mixture of views from different parts of the political spectrum. But I want to make a more difficult argument—I want to defend people who really are “in the middle”. One argument for moderation is that the right and the left are better at understanding different things. Right-leaning people are better at seeing humanity’s flaws. They better appreciate how existing systems (family, the church, social taboos) have been formed by those flaws and better sense the dangers of fooling with those systems. They are better at seeing how seemingly harsh policies (competition, markets) may ultimately serve the greater good. Left-leaning people are better at seeing how systems can chew people up and be cruel with little real purpose. They are better at seeing that harsh policies are… harsh. They have a more expansive sense of what is possible and are more willing to entertain that things could be different. Is any of this in conflict? Not really. But when two teams spend their time practicing with different mental models, they end up better at different stuff. Both sides have weaknesses, too. The left’s classic mistakes include “X is expensive, therefore let us subsidize X” and an eagerness to tear down Chesterton’s fence first and worry about the consequences later. The right tends to see the current social order as fundamentally true and just and natural, rather than as an accumulation of hacks and compromises that emerged from game theory over the generations and tends to defend that social order even when conditions have changed."
