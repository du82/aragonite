["https://dynomight.net/2020/12/22/what-i-learned-about-covid-19-from-pestering-a-bunch-of-biologists"]
title = "Napoleon's failure in Russia as an analogy for T-cell based viral immunity"
description = "How the immune system’s memory cells are like the Russian strategy for resisting Napoleon’s invasion."
full_description = "In June of 1812 Napoleon assembled the largest European army in history and invaded Russia. After months of bloody fighting, the French finally arrived in Moscow in September, surprised to find the city mostly abandoned. That night, remaining Russians set fires across the city, eventually burning most of it to the ground. After camping in the ruins for a month, Napoleon realized that the Russians had no intention to sue for peace, supplies were dwindling, and their prospects over the winter were bleak without a living city to sustain them. In October, the French retreated, eventually leaving Russia in defeat in December. You’ve probably heard that T-cells are important for immunity to COVID-19. But what exactly do T-cells do? How do you get immunity? What’s the difference in what happens after exposure to the virus when someone is immune? It’s debated if the Russians intended to completely destroy Moscow, but never mind. Imagine you wanted to implement “destroy your cities ahead of the French” as a deliberate strategy. If so, you’d want to be very careful that the French were actually coming before burning one down. Scouts can be unreliable, and who knows what the French army really looks like? (It’s 1812, photography hasn’t really been invented yet.) You’d probably require the city authorities vote unanimously before going ahead. It’s better to risk the French capturing a city than to risk burning one down unnecessarily. But suppose you have a unit that fought the French for a month and captured some uniforms and equipment. You could distribute these soldiers and detritus to different cities, with orders that cities be immediately burned when they say so. Since they are familiar with the French, false alarms are much less likely. That’s kind of how the immune system works. All our cells are built with a self-destruct mechanism called apoptosis built in. When there is a viral infection, our T-cells activate this mechanism on all the nearby cells to deny the virus any place to replicate. But the body doesn’t want this to happen by mistake—that’s how you get autoimmune disease. Thus, T-cells require a lot of signal that there’s an invasion before they activate, meaning a long ramp-up period. However, once activated, some T-cells will store specific patterns from the virus, and become “memory” T-cells. These move around the body and are programmed to activate very quickly, but only when they see the specific pattern they have stored."
