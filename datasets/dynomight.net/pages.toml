["https://dynomight.net/heritability"]
title = "It’s perfectly valid for a trait to be more than 100% heritable"
description = "What heritability really is: A fluid statistic that changes whenever society changes."
full_description = "All psychological traits are heritable. This is the best replicated finding in all of behavioral genetics. Some recent numbers include: I used to have a mental model something like this: Each person has some number of “religiosity points” that come from genes and some number that come from the environment. If religiosity was 40% genetic, I pictured there being 10 total points, 4 of which come from genes and 6 of which come from the environment: The problem with this picture—aside from being completely wrong—is that it suggests heritability is an immutable constant, like the number of chromosomes in a cell or the fine structure constant. This is totally incorrect. So what is heritability? It’s the ratio of the genetic variance of a trait with the total variance, including all causes. This post will explore this definition. We’ll see that it leads to several puzzles: The only math we’ll use is the concept of variance. If you’re not familiar with that, just think of it as “how variable” something is. Humans have high variance in how much we like folk music, but low variance in our number of fingers. One note on terminology: Biologists use “phenotype” to refer to what actually happens, including all genetic or environmental causes. The phenotypic length of your foot is, thrillingly, the actual length of your foot. Say that people’s height depends on only one gene, which can be either short or tall. The genetic contribution to height is 2m if they get the short gene, and 4m if they get the tall gene. (The math is easier if we make everyone giants.) The only thing that matters in the environment is food. At birth, people are assigned either to diet or to feast. If on a diet, they lose 1m of height compared to their genetic baseline. If on a feast, they gain 1m of height. A person’s height is the sum of their genetic and environmental values. Using P for phenotypic, write the final height as With all these assumptions, can we calculate heritability? Not yet! We need the population distribution, i.e., what fraction of people have each combination of genes and environments. Assume for now that half of people have each gene, and half of people have each environment, and that these are independent."
