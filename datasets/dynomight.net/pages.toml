["https://dynomight.net/2020/11/21/police-violence-policy-proposals-and-what-we-dont-know-about-them"]
title = "Policy proposals and what we don't know about them"
description = "There’s many suggested policies to address police violence. What do we know about if they actually work?"
full_description = "You can’t measure police bias using simple population ratios. A better idea is to check if police behave differently when it’s dark, but this doesn’t give any firm conclusions either. What else can we do? Well, there are lots of policy proposals floating around that are suggested to reduce bias in policing, and many police departments have already adopted some of them. Maybe we can look at what effect these have had. Many police departments have added police body cameras in the last few years. What effects do these have, and can they tell us something about police bias? Surveys show that police increasingly favor body cameras, seeing them as protection from the public and as evidence collection. Police sometimes complain about the hassle of dealing with cameras, and the reduction in discretion. Police with cameras get fewer complaints, either because the cameras cause police to behave differently, cause citizens to behave differently, or discourage frivolous complaints. Effects of cameras on police use of force overall suggest a minimal effect. A popular study in Rialto, California with a total of 115 frontline officers randomly assigned the entire police force on duty to either use or not use cameras for 12 hours at a time (Ariel et al. 2014). They found that incidents of use of force dropped by half when cameras were worn. While this study is often cited, a follow-up repeated the experiment with 10 cities and a total of 2122 frontline officers (Ariel et al. 2016). They found no effect. (In fact, they found slightly more use of force with cameras, but this was not statistically significant.) There’s some suggestion that officers use more force when they have discretion over when to turn the cameras on. Cameras show no clear effect on arrests or citations. This is important! One of the biggest concerns raised before cameras were introduced was that police would be too afraid to make legitimate arrests. This fear is not realized. Do cameras affect the racial composition of police use of force? There seem to be no studies on this at all. This is often misrepresented as proof that cameras do not affect the racial composition of police violence. That’s incorrect. There’s no evidence either way. (But remember we haven’t found much effect on use of force in general.)"
