["https://dynomight.net/homeless"]
title = "Is there a homeless crisis?"
description = "A look at the data."
full_description = "A few years ago, I took a look at the data on homelessness in the United States. We now have new data (and a new reality) so let’s revisit things, this time in superior list format. Here is the percentage of the population that was homeless between 2011 and 2023 (the last year we have data for): There was a clear uptick after 2022. But this just brought things back to where they stood in 2011, which hardly seems like cause to panic. All these numbers are the most recent data collected by the OECD. Take these numbers with a grain of salt—each country uses different methodology. I suspect this is particularly true for the “temp shelter” numbers (and thus also the totals). This suggests the United States is indeed on on the higher end. Do things look more crisis-y if we look at certain states or cities? Or is the “type” of homelessness perhaps getting worse, with fewer people staying in a shelter for a few weeks while they find a new job, and more mentally ill people lingering for years on the streets? First though, you might ask if the increase at the end of the above graph is real. Where are the error bars? The answer—at least in principle—is that there are no error bars, because we aren’t using an estimate of the number of homeless. It’s a full count. Let’s back up. Every year in January, the US counts its homeless. Roughly speaking, how this works is that the Department of Housing and Urban Development (HUD) tells hundreds of nonprofits and local government organizations across the country: You there! Some night during the last 10 days of January, you must count every single homeless person in your area. If you don’t, then you don’t get any more money. How you accomplish this is your problem. Have fun! HUD publishes the data and some vizualizations, but their $72 billion budget doesn’t provide for visualizations that are very good, so fine—I’ll do it. Here’s the percentage of the population in each state that was homeless in January 2023. (The January 2024 count has already been done, but it takes HUD 11 months to publish the data.)"
