["https://dynomight.net/gdp"]
title = "Do economies tend to converge or diverge?"
description = "History suggests that poor countries have the same growth as rich countries on average, just with much higher variance."
full_description = "Rich countries are at the technological frontier, so they have to do both of these things at the same time. Since figuring things out is hard, they can’t grow too quickly. But poorer countries can grow faster by just adopting the best ideas from elsewhere. This seems to explain how places like Japan and South Korea grew quickly and gradually slowed as they caught up with rich countries. Except… this can’t possibly be right. If it was, how did rich countries get rich in the first place? We need a better model. Usually, you need more than an idea to do stuff, you need other stuff, like machinery, buildings, roads, electrical grids, legal systems, or skilled people. Maybe you can copy an idea, but you need to make that other stuff. Rich countries have expensive labor but lots of capital. So they innovate by finding ways of throwing ever-larger amounts of capital around to squeeze ever-higher productivity out of their workforce. But poorer countries have little capital and cheap labor, meaning these innovations aren’t always useful to them. I got interested in these questions after reading Global Economic History by Robert Allen. He offers this graph of the growth of different regions of the world between 1820 and 2008: The two special regions with high growth are Japan (black triangle) and Taiwan + South Korea (Gray triangle). The other regions, shown as dots, are: Sure, Allen concedes, Japan and South Korea grew quickly and caught up, and maybe China is doing the same now. But those are just exceptions—the overall trend is that rich countries grew faster. Writing in 2011 he says: At first, I was skeptical of this. At a minimum, doesn’t it violate the concept of comparative advantage? Well, no. In this theory, the poorer countries do tend to grow, they just do it slower, so the gap with rich countries tends to increase. Allen suggests that unless the local industry is protected by tariffs, comparative advantage will push them towards low-capital activities. This means they can’t get off the ground and start building capital and adopting more advanced technologies."
