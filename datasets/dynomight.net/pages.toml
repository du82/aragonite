["https://dynomight.net/2020/12/15/some-real-data-on-a-DIY-box-fan-air-purifier"]
title = "Experiments on a $50 DIY air purifier you can make in 30s"
description = "You can make a DIY air purifier in 30s. To test if it works, I generated smoke, and measured how well it removes tiny particles."
full_description = "Bad air is bad for you. The air purifier market, though, is a mess. Every purifier uses incompatible proprietary filters, presumably to lock you into buying replacements. How do we know these actually work? Few seem to publish lab tests. And why does it cost $100-$300 for a big plastic box with a fan and a filter inside? It’s common to build DIY air purifiers by basically strapping a filter to a fan. I like the idea of these, but again, it’s hard to be confident they really work. There’s a few experiments out there, but not enough to make me comfortable. So I decided to do some experimenting of my own. I made a purifier, generated smoke, and measured how well it removes tiny particles. If you’re in a hurry, this post says that if you strap two HEPA filters to a box fan, it will clear the air of basically all the particles we can measure, and it will do it faster than a commercial filter that costs twice as much. My DIY purifier was very simple. (I don’t want to promote any particular brands here. Contact me if you want the exact products.) Assembly takes about 30s. You put the filters on the intake side of the fan and strap them on with the bungie cord. Here’s a picture: Timeless elegance and grace, it is not. I get the shakes just looking at that bit of crinkled filter. As a comparison, I got a $100 air purifier from a well-known brand that’s intended for small rooms. It uses uses a single HEPA filter that’s about 25cm x 12cm and 4cm thick. Replacement filters currently cost around $25. It’s surprisingly hard to repeatedly generate a consistent amount of smoke. I tried burning various things (paper, cardboard) and found that the number of particles generated can vary by an order of magnitude, depending on the burn pattern. This is difficult to control and effectively random. Ideally, I’d have liked to burn some food product like oil, since the kitchen is usually the biggest source of indoor air pollution. I couldn’t figure out a good way of doing this, either: You’d need to have the same amount of oil distributed in the same way and heated to the same temperature."
