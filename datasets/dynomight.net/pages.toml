["https://dynomight.net/hot-water"]
title = "A modest proposal: For preventing the heat in bathwater in Britain"
description = "FROM BEING A WASTE TO THE BATHER AND COUNTRY, AND FOR MAKING IT BENEFICIAL TO THE PUBLICK"
full_description = "Europe is in an energy crisis. There are lots of things that might be done, but most are slow or expensive or painful or don’t accomplish much. But here’s a little daydream: This is fast and free and easy-ish. But is it significant? I get triggered by the phrase “every bit helps”, which somehow manages to turn a tautology into an implied call to forsake reason. The only way to know if this matters is to do the arithmetic. So I decided to do it. I focused on the UK, because a fair number of UK-ians read this blog and because there’s good data available (in English). I tried to answer two questions: If everyone in the UK let their bathwater heat up their home before throwing it away, what fraction of total UK energy could be saved? Below, I’ll estimate that, in winter: Domestic lighting consumes 3.8% of the UK’s energy. If being careful when leaving the room reduced the amount of energy people use by a third, then that would be 1.3% of national energy. The same page suggests that a leaky hot water tap could waste enough hot water to fill half a bath after a week. That’s not huge, and also I suspect that much of the heat that dribbles out of a tap would escape into the air or basin before the water goes down the drain. David MacKay estimated that idle phone chargers consume 0.01% of UK energy. The second question is: Of all the energy you use to heat water when showering, what fraction could you recover by letting the water accumulate and cool down? This follows from four numbers. A reasonable estimate is that taking a full (80 liter) bath uses around 2.7 kWh of energy, while a shower might use around 0.33 kWh per minute. If you take an (average) 8-minute shower and use a (typical) 10 liters per minute, that would be a similar amount of water and a similar amount of energy. As of October, the price cap in the UK is £0.104 per kWh for natural gas. So if you have a gas water heater (as most people in the UK do), a full bath or shower costs around £0.104 × 2.7= £0.28. Scavenging the heat could save 48% of that, or £0.13. If you’re on electricity, the cap is £0.34/kWh, meaning that a full bath or shower costs around £0.34×2.7=£0.92. Again, scavenging the heat could save 48% of that, or £0.44."
