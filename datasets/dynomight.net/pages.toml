["https://dynomight.net/abortion"]
title = "What I learned trying to classify abortion access across the rich world"
description = "Rich countries are not monolithic. However, outside the US and a few microstates, they vary in a limited range."
full_description = "With abortion in flux in the US, I realized I didn’t have a clear picture of how things looked in the rest of the rich world. When I searched, I found lots of maps, like the following from Politico and Wikipedia: These are helpful, but they’re very high level. If you read about individual countries, you’ll find that things are more complicated than these—or any—maps can convey. I wanted to know: When is abortion available for what reasons? So I researched the policies in 27 countries, came up with a classification scheme, classified each week in each country, and then tried to visualize everything in a single graphic. The colors show “access scores” between 0 (no access for any reason) and 8 (available on-demand). Between those two extremes, there’s one point if abortion is allowed for each of the following reasons: The country/time regions are labeled by policy. If abortion is on-demand, there’s no label. Otherwise, r, i, f, and + indicate when various reasons are allowed, while L indicates the (rare) cases when abortion is not permitted to save the woman’s life. I think this gives a richer picture, but it’s still missing a lot of nuance. Honestly, I’ve begun to doubt if a truly fair visual summary is even possible. There are two basic problems: (Also, with 8 binary attributes, 32 regions, and 38 weeks I essentially had to determine if 9,728 different things were true or false. So, there are surely some errors—let me know if you see any.) Still, I learned a lot from all this, so I’ve tried to distill the biggest lessons below. I’d also like to tell my tale of woe, why classifying these things is hard. Canada is often seen as the country with the strongest abortion rights in the world. That’s true in some sense: Legally, abortion is not a criminal offense in Canada at any stage of pregnancy, for any reason. But just because abortions are not illegal doesn’t mean they are available. Provinces can set regulatory limits on abortion, and all of them do:"
