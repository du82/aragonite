["https://dynomight.net/2020/09/11/comparative-advantage-and-when-to-blow-up-your-island"]
title = "Comparative advantage and when to blow up your island"
description = "Explains comparative advantage through trades of coconuts and bananas. Also, why it might be smart to blow up your island."
full_description = "Economists say free trade is good because of “comparative advantage”. But what is comparative advantage? Why is it good? This is sometimes considered an arcane part of economics. (Wikipedia defines it using “autarky”.) But it’s really a very simple idea. Anyone can use it to understand the world and make decisions. Each week you gather and eat 10 coconuts and 10 bananas. It takes you five minutes to gather a coconut, and 10 minutes for a banana. Thus, you work 150 minutes per week. Just like you I eat 10 coconuts and 10 bananas per day. But unlike you, I’m terrible at everything. We are both peaceful. We will not coerce each other, but are otherwise completely selfish. What will happen? Intuitively, you value bananas more, while I value coconuts more. So it’s natural to trade my bananas for your coconuts. We agree as follows: Each week, you gather 20 coconuts, and I gather 20 bananas. Then, I trade 10 of my bananas for 10 your coconuts. It’s easy to check that this will make both of us better off. In one sense, it’s obvious that trade makes us both better off. If it didn’t we wouldn’t both agree to it! But comparative advantage explains how. You have an advantage at everything. But I have a comparative advantage at bananas, because my ratio (banana time) / (coconut time) is lower than yours. And if we both concentrate our efforts on the thing we have a comparative advantage at, we are both better off. This is why economists like free trade. If different producers have different relative abilities, everyone can benefit from specializing. This is true even if one producer is better at everything. Beyond trade, this is an important lesson for life. Choosing your career path? Dividing up chores with your partner? Think about comparative advantage! More sophisticated models can deal with these complications. The math gets more complex, but more or less the same conclusion arises. There is one complication that’s a bit special: In this case, introducing trade can make individual people worse off: Suppose you live with me on an island, but you’re incapable of gathering bananas. Since you need them to live, I can demand a huge number of coconuts for one banana. When a bridge opens up to another island, you might get a better trade. This will help you, but actually hurt me. Still, introducing free trade still makes people better off “on the whole”."
