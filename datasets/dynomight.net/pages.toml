["https://dynomight.net/arithmetic"]
title = "Arithmetic is an underrated world-modeling technology"
description = "if you keep units"
full_description = "Of all the cognitive tools our ancestors left us, what’s best? Society seems to think pretty highly of arithmetic. It’s one of the first things we learn as children. So I think it’s weird that only a tiny percentage of people seem to know how to actually use arithmetic. Or maybe even understand what arithmetic is for. Why? I think the problem is the idea that arithmetic is about “calculating”. No! Arithmetic is a world-modeling technology. Arguably, it’s the best world-modeling technology: It’s simple, it’s intuitive, and it applies to everything. It allows you to trespass into scientific domains where you don’t belong. It even has an amazing error-catching mechanism built in. One hundred years ago, maybe it was important to learn long division. But the point of long division was to enable you to do world-modeling. Computers don’t make arithmetic obsolete. If anything, they do the opposite. Without arithmetic, you simply can’t access a huge fraction of the most important facts about the world. It’s amazing how much we don’t know about nutrition. For example, would you live longer if you ate less salt? How much longer? We can guess, but we don’t really know. To really be sure, we’d need to take two groups of people, get them to eat different amounts of salt, and then see how long they live. This is expensive, ethically fraught, and runs into the problem that when you tell people to eat differently, they usually ignore you. So I’ve often wondered: Why don’t we do these experiments on animals? Why not get two big groups of chimpanzees, and feed them different amounts of salt? Chimps aren’t people, but it would tell us something, right? Let’s do these. First, how long do chimps live? In captivity the average seems to be around 36.3 years. (Incidentally, female chimps seem to live 25% longer than males—imagine human women lived until 90 while men died at 71.) Second, how much does it cost to maintain a chimp? Capaldo et al. looked at the average costs in various research facilities in the US in 2009. They estimate around $75/day (in 2024 dollars)."
