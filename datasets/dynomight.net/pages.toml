["https://dynomight.net/better-personalities"]
title = "Are some personalities just better?"
description = "People with the same big five personality types tend to be more happy, successful, intelligent, creative, and popular. Why aren’t there more tradeoffs?"
full_description = "I don’t know if you like parties. I don’t know if you’re organized or punctual. But I bet you don’t like rotting smells or long swims in freezing water. That is to say: People are different, but only in certain ways. What’s the difference? Hypothermia enthusiasts have few kids, so their genes tend to disappear. If introverts were worse at breeding than extraverts, then the same thing would have happened. Since extraversion varies widely, we can infer that we’re at an equilibrium point with no real advantage either way. (Personality traits are around 40% genetic.) So, no personality is better than any other. Instead, there must be intricate tradeoffs, with each personality occupying a different kind of niche. This shows correlations between the Big Five personality traits and various personal characteristics. Blue shows positive correlations, while red shows negative. For example, the blue upper-left cell shows that extraversion is associated with life satisfaction, whereas the red lower-left cell shows that extraversion is negatively associated with autism. So, uhh, where are the tradeoffs? People who are extroverted, agreeable, conscientious, emotionally stable, and open seem to do better at basically everything. Let’s call these people all-blues. Broadly speaking, they are more happy, successful, intelligent, creative, and popular. They have fewer addictions and less of every mental disorder. The only real tradeoffs are agreeableness against income/intelligence and extraversion/conscientiousness against math scores. I’d like to give a list of famous all-blues as examples, but this doesn’t seem to exist. As a proxy, we can look to Myers-Briggs, where all-blues are similar to emotionally stable ENFJs. The internet claims that examples of ENFJs are Michael Jordan, Oprah, Pope John Paul II, Martin Luther King Jr., Pericles, and Barack Obama. For the opposite type, famous ISTPs supposedly include the Dalai Lama, Ernest Hemingway, Snoop Dogg, Melania Trump, and Vladimir Putin. (Personally, I assume the Dalai Lama has high emotional stability, but judge for thyself.)"
