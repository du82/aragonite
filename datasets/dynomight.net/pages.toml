["https://dynomight.net/aspartame"]
title = "Aspartame: Once more unto the breach"
description = "Like it or not, there’s a clear scientific consensus"
full_description = "Look, I get it. Diet Coke tastes sweet because it has aspartame in it. Aspartame is a weird synthetic molecule that’s 200 times sweeter than sucrose. Half of the world’s aspartame is made by Ajinomoto of Tokyo—the same company that first brought us MSG back in 1909. If you look on Wikipedia, you’ll see that aspartame is a methyl ester of the aspartic acid phenylalanine dipeptide, which isn’t, like, comforting. It’s normal to have a prior that aspartame might be bad for you. Certainly, that was my prior. Without looking at any evidence, any reasonable person would think like this: This makes the decision theory pretty simple: Consuming aspartame has little upside, but substantial downside. The thing is, we do have evidence. We have a lot of evidence. The FDA calls aspartame “one of the most exhaustively studied substances in the human food supply”. The other thing is, the alternative to aspartame often isn’t no aspartame but rather sugar or corn syrup or even perhaps even alcohol. I don’t want to convince anyone to consume aspartame. But if we’re choosing between aspartame and other risky things, we should evaluate the relative risks. Let’s forget about safety for a second, and just look at the causal chain. Say you drink a Diet Coke. What happens next? After you drink a Diet Coke, the aspartame goes to your guts. After that, it’s very quickly broken down into 50% phenylalanine, 40% aspartic acid, and 10% methanol. For example, a can of Diet Coke contains 184 mg of aspartame. This becomes: The European Food Safety Authority Report (EFSA) report: Scientific Opinion on the re-evaluation of aspartame as a food additive gives this figure (slightly modified): We recently talked about phenylalanine. It is an essential amino acid. If you didn’t consume any of it then when your body tried to make certain proteins those proteins would get truncated, and then they wouldn’t do what they are supposed to do, and then you would die. Fortunately, that’s almost impossible. From 2% to 5% of all protein in food is phenylalanine. The recommended dietary allowance for a 70 kg (154 lb) person is at least 2130 mg. Meat-eating men in the UK average 3500 mg per day, while vegetarians and vegans get slightly less."
