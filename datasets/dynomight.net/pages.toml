["https://dynomight.net/split-brain"]
title = "A review of early split-brain experiments"
description = "What happens if you cut your brain in half?"
full_description = "What happens if you cut your cortex in half? When this was first tried on animals, the answer seemed to be not much. But starting in the late 1950s, a series of experiments found that very weird things happen under careful testing. These experiments are fascinating for their implications into the mind, consciousness, and selfhood. Existing presentations of these experiments have a lot of philosophical rambling interpretive narrative. This is dangerous. When I actually read the original papers, I was shocked how much they diverged from what I’d read before. If you have a story for what’s happening, it’s way too easy to explain away inconvenient results everywhere. These experiments are just so weird, and their implications so fascinating, that the only way to make sure you’re getting an accurate picture is to focus on the facts: What was actually done, and what was observed? Here I’ll review early animal experiments, particularly those that set the stage for Roger Sperry’s later research on humans. The other layer of the brain is the cortex, key for attention, perception, memory, vision, and language. The cortex has two hemispheres which communicate mainly via the corpus callosum. They also communicate via the subcortical brain and indirectly through the body. Light from both eyes first goes to the optic chiasm. This relays the signal from the left side of both eyes to one hemisphere of the cortex, and the signal from the right side of both eyes to the other hemisphere. It appears that one side of the body is primarily but not completely controlled by one half of the cortex. WHAT THEY WANTED TO TEST. Say you do surgery so one half of the brain only gets visual information from one eye. Then, you train cats to do some task using only one eye. Will they also be able to do it using the other eye, which never got any direct visual information about the task? WHAT THEY DID. They took 9 cats, and cut the optic chiasm, so that light from one eye now only goes to one half of the cortex. They then covered one eye with a patch, and put two doors in front of the cat with different shapes on them, e.g., a square and a circle. One shape always led to food, the other to an electric buzzer."
