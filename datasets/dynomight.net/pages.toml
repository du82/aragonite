["https://dynomight.net/aspartame-brouhaha"]
title = "WHO aspartame brouhaha"
description = "the territory under dispute"
full_description = "On July 14, two different arms of the WHO released their findings on aspartame. One designated it “possibly carcinogenic to humans”, while the other concluded that “dietary exposure to aspartame does not pose a health concern”. The FDA took the unusual step of issuing a statement saying that it disagreed with the first group. This might look like a huge controversy. But the territory under dispute is smaller than it might seem. Aspartame at above-recommended levels causes cancer, but we don’t know if the effect is large enough to matter. It is possible that aspartame might hypothetically be capable of causing cancer in some circumstances. We don’t know if this is real or significant, but it merits further research. Position 1 would place aspartame in the same category as alcohol. No one claims #1. No one claims #2. No one claims #3. The scope of debate is somewhere between #4 and #5. After you consume aspartame, it’s fully broken down in your guts into phenylalanine, aspartic acid, and methanol. No aspartame touches any other part of your body, and these three metabolites are present in much larger amounts in normal food. Even the maximum recommended level of ~10 Diet Cokes per day produces only trivial fluctuations in the plasma concentrations of these metabolites. Available information indicates that the metabolism of aspartame is similar in humans and experimental systems; aspartame is hydrolysed to aspartic acid, to the essential amino acid phenylalanine, and to methanol. How did we end up with two different WHO groups seeming to release contradictory conclusions on the same day? The WHO thought you might wonder about that, so they released a statement that manages to make it sound sort of logical. The International Agency for Research on Cancer (IARC) focuses on hazard identification. Their job is to classify stuff according to if a substance has the potential to cause cancer. The Joint FAO/WHO Expert Committee on Food Additives (JECFA) focuses on health impacts and risk assessment. Their job is to classify stuff according to how much it can harm human health (by any means, not just cancer)."
