["https://dynomight.net/arguments-3"]
title = "Things to argue about over the holidays instead of politics III"
description = "report back on how it goes"
full_description = "How much should a couple talk if they are having dinner in a restaurant, after being together for one month/year/decade? If it’s safer to face backwards in vehicles, then what is it that’s shared by infants in cars and soldiers on military planes but no one else? Among rock bands with > 250 million albums sold, 5/6 are from the UK vs. 1/6 from the US. (Or 6/8 vs. 2/8 if you count Elton John and Michael Jackson). Why? If you swim in public pools, is that because you reject the research suggesting that most contain 30-80 liters of urine, or because you don’t mind? Is declining fertility destined to be reversed through growth of high-fertility subcultures, or could there be competing low-fertility cultures that peel people away so effectively that population declines forever? Does postapocalyptic fiction represent a yearning for the life and death of pre-history? If so, why is there so little fiction based on ordinary pre-history life? What is the best Brassica? I collect here the most common for readers negligent in their Brassica studies: Does it matter to you, emotionally, that only nigra, oleracea, and rapa are diploid species, and the others are lame tetraploids that just add together the ancestral genomes (carinata=nigra+oleracea, napus=rapa+oleracea, juncea=nigra+rapa) as first proposed in 1935 in Woo Jang-choon’s Triangle of U theory? Choose two yes/no opinion questions. Around 50% of the population should say yes to each. What do you choose to get the smallest possible intersection? Do you think you could cultivate a taste in types of music you don’t currently like if you tried? If yes, why don’t you? What percentage of young people’s increased propensity to explore new music is driven by social taste competition? Say you were born in China/America/India (assuming you weren’t) but you are still “you”. What’s the biggest difference? What are the odds that consciousness isn’t unified and that there isn’t just a single “you” in your head experiencing the world?"
