["https://dynomight.net/managed"]
title = "Advice on being managed"
description = "Some obvious-in-retrospect thoughts"
full_description = "When you shift from being managed to also sometimes managing others, you have a predictable shift in perspective and a lot of obvious-in-retrospect insights. In the spirit of “saying obvious things is good” here are a few. Since you’re a fallible human, you will screw things up. And when you do, you’ll be tempted to mislead and cast blame elsewhere. Resist. Say you were supposed to get some specs from the Halifax team but you forgot and now they’re all on vacation for a week. You could make up some story about some technical snafu like emails getting lost, and this might work. But: Of course, sometimes you really will hit weird issues, and when you do you should explain them. But your manager knows the base rate. They know that people who are “unlucky” a lot tend to be “unlucky” in the future. Say you recently worked on a project with Alice, during which Alice was annoying and incompetent and stole all the credit for your work. Now, your manager assigns you to work on another project with Alice. What should you do? People often try to look for clever “schemes” for these kinds of situations. My advice is: Don’t scheme. Be diplomatic, but just ask for what you want and give the real reason that you want it. Perhaps, “I’d prefer not to work with Alice again. There’s a bit of a personality clash and I had trouble getting proper credit.” Why? Well, what would you want if you were a manager? You’d want to have full information so you can make a fully-informed decision. If you present a problem other than the real one, then most likely it won’t make sense and your manager will be confused. And even if they accept it, it’s likely to have some solution that doesn’t address your real problem. Just ask for what you want. A good manager will appreciate you not making them to waste their time trying to read your mind. Of course, you may not always get what you want. When this happens, it’s a good opportunity to show your character by staying positive."
