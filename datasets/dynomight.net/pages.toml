["https://dynomight.net/2021/01/28/are-ethics-all-a-lie"]
title = "Are ethics all a lie?"
description = "If we only believe in ethics because of evolution, does that mean ethics are a lie?"
full_description = "Ethics are an illusion. There’s no “right and wrong” written in the fabric of the universe. It’s all a fiction that exists because it improves reproductive fitness. If someone hits you, it feels OK to hit them back. Why? Because if you always get revenge, it’s unwise to mess with you. “Morality” is just a hack evolution came up with to win at the remorseless game of reproduction. First this was genetic evolution, now cultural evolution. Either way, beliefs that aid reproduction get transmitted more. Stare reality in the face, and look at ethics for what they are: A thin veneer on top of game theory. In terms of where our sense of justice comes from, this is correct. Right and wrong don’t “really” exist. When we talk about them, we’re talking about our preferences. We have those preferences because we’re programmed to have them. We’re programmed that way because they were effective for our (genetic and cultural) ancestors. Here’s what the skeptic is missing: Explaining where our preferences came from doesn’t mean those preferences disappear. I want things. I want sentient life to continue to exist. I want people to be happy rather than miserable. I want people to someday figure out the Meaning of Things. Do I want these things because of my human biology and the culture I’m part of? Sure! But still, I really do want them. If you think you’re different, consider: Would you hurt a child to make some money? No? What if you could take a pill so you wouldn’t mind hurting kids. Would you take it? Still, what if you did rise above your intuitive sense that right and wrong exist. It sounds bad now, but maybe if did it, you’d be happy afterwards? The problem is, there’s nothing up there. Say you eliminate all your arbitrary preferences. Now what? Why get up in the morning? Why do anything? Pure cold rationality cannot tell you what to want. We get pleasure/happiness/utility from the “utility function” that’s programmed into us. That function might be arbitrary, but the utility is real."
author = "dynomight"
year_published = 2021
year_updated = 2021
