["https://dynomight.net/p2p-meth"]
title = "The main thing about P2P meth is that there's so much of it"
description = "Since around 2009, methamphetamines have been made with phenylacetone (P2P). Is there a chemical different causing schizophrenia?"
full_description = "Sam Quinones was recently on Econtalk and in the Atlantic talking about methamphetamines and homelessness. He points out that “old” meth was made from ephedrine and that “new” meth is made from a chemical called Phenylacetone or P2P. He suggests that new meth might be chemically different in a way that caused people to go crazy, starting around 2017: Ephedrine meth was like a party drug. […] You could normally kind of more or less hang onto your life. You had a house, you had a job. […] P2P meth was nothing like that. It was a very sinister drug. It brought you inside. You didn’t want to be around other people. You wanted to just kind of be alone with whatever bizarre thoughts your mind was now cooking up, and conspiracies. I was curious about this. What do we know about the difference between old meth and P2P meth? What evidence is there that these have a chemical difference? In the before times, meth was made with ephedrine or pseudoephedrine. However, in 2006, the US banned over-the-counter sales of pseudoephedrine, and in 2008 Mexico banned almost all sales. In response to this, meth makers switched to a synthesis based on P2P, which can be made from many different, widely available, source chemicals. The Drug Enforcement Agency tests the meth they seize to see how it was made. Here’s their data starting in 2009, where you can see that P2P synthesis (in red) rapidly displaces the older ephedrine-based synthesis (in blue). How could P2P meth be different? There are two ways: Either it could be a different type of meth, or the meth could be contaminated with some other chemicals. For many complex molecules, you can take the atoms, and “flip” them to get another stable version of the same molecule, called an isomer or (more specifically) an enantiomer. These different versions of the molecule can have very different effects on the body. Methamphetamine happens to be one of those molecules. The one that produces the effects we call “meth” is d-methamphetamine (d-meth). That’s the one that increases dopamine in the brain, causing euphoria. (It’s also the one that is sold at pharmacies in the US to treat ADHD and obesity.) On the other hand, l-methamphetamine (l-meth) has no effects on dopamine and presumably isn’t nearly as much fun."
