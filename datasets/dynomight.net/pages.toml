["https://dynomight.net/arguing"]
title = "Arguing without warning"
description = "We should encourage more public disagreement."
full_description = "Probably most social norms are like that—even if we disagree with them, they’re too entrenched to change. That’s why it’s important to watch for critical points where norms could go either way. Here’s one such case: Say someone wrote something. You think they’re wrong, so you write a manifesto arguing that they’re wrong. Are you supposed to: Of course, in modern social media, the prevailing attitude is no quarter asked or given. If that’s what you’re used to, you probably think it’s adorable that I imagine any of this is open to debate. But in the genteel corridors of long-form internet writing, people really do seem to have varying expectations about this stuff. Just personally, I often wonder what rules I’m supposed to follow. Brian Caplan points out that no one cared about the spreadsheets he published to support his argument that education is about signaling rather than learning. This is true even though his book got lots of attention, and even though his conclusion is at odds with the popular consensus. Why? Caplan suggests it’s because no one believes quantitative social science is meaningful. Maybe, but I suspect the explanation is simpler: There’s not much glory in checking someone else’s work. Say you pored over Caplan’s spreadsheets and you found some technical error. Would that buy you some significant reward or attention? Unless you already have a high profile, probably no one would understand or listen to you. The same pattern holds elsewhere. While many say peer-reviewed research is the gold standard of reliable truth, I think this trust is mostly delusional. Reviewers are anonymous and—aside from altruism—have little incentive to go digging for mistakes. They might be very eager to reject a paper, yes, but it’s easier to do that for superficial reasons rather than finding a mistake in the depths of some proof or experimental design. Or… OK, that’s not true—there’s disagreement everywhere but it’s superficial and unfair and sarcastic and mean. So how about: The world needs more high-quality disagreement."
