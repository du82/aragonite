["https://dynomight.net/potato-diet"]
title = "Thoughts on the potato diet"
description = "Nine observations about what happens when you eat only potatoes"
full_description = "I thought this sounded delightfully absurd so I tried it for a few weeks. Here are some observations. Say you’ve had a huge meal and couldn’t eat another bite. But then—someone offers you iced cream. You might think: Can I exploit this phenomenon in reverse to lose weight? The obvious thing would be to ban iced cream. But if that helps, maybe you should ban more stuff. If you went really ban-crazy, you’d eventually get to a single food, hopefully something filling and healthy. Voilà: Potato diet. My biggest surprise was how the diet felt. Previously I had a mental model that hunger is the difference between your caloric needs and the total calories you’ve eaten. If the only foods are corn tofu and potatoes, then my old model was For contrast, imagine that hunger is the difference between your caloric needs and the maximum calories you’ve eaten of a single food: Now, I’m not crazy—I’m sure this second model is wrong and indeed worse than the first one. But I suspect it’s partially right, that the truth is somewhere between the two. The horizontal axis is how much food you eat and the vertical axis is how satisfied you are. There are different curves for diets with different amounts of variety. Hunger is essentially the desire to move to the right on this graph. I always ate as many potatoes as I wanted, so I never felt “hunger”. But I felt something—I wanted to eat other foods, to jump onto a higher curve on the above graph. I don’t think this feeling has a good name, but it’s basically what you feel when you have trouble turning down that after-meal iced cream. There’s a chance this is important. Suppose your steady-state caloric intake is 2500 per day and you’d like to lose 1 lb (0.45 kg) per week. Then some simple math shows that you should get 2000 calories per day, which corresponds to around 18 medium golden potatoes. This does become a hassle. However, I have a conspiracy theory that maybe this is a feature in the sense that laziness plus the tedium of preparing all those potatoes leads to eating less."
