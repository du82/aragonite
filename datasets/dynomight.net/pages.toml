["https://dynomight.net/homeless-crisis"]
title = "A breakdown of the data on the homeless crisis across the U.S."
description = "Many people see a homelessness crisis, but what does the data say? We examine different locations, rates of change, types of homelessness, and mental health and substance abuse issues."
full_description = "Is the US in the midst of a homelessness crisis? Many people think so, but that’s largely based on based on anecdotes. What does the data say? At a glance, this doesn’t look very crisisy. Since 2015, things have gone up by less than three percent. Still, I think there is a crisis, we just have to work harder to see it. We need to look at different locations, rates of change, different types of homelessness, and mental health and substance abuse issues. Let’s do that. The rate of homelessness varies hugely between different states. Here’s the percentage of the population in each state that was homeless in 2020. In Mississippi it is 1 in 2500 (0.04%), while in New York State it is 1 in 210 (0.47%). That’s a huge difference. Now, when we talk about a crisis, there’s an implication that things are getting worse. (You don’t hear much about the everyone you love will die and be forgotten “crisis”…) We already saw that things are pretty stable at the national level. How are things changing in individual states? The general pattern is increases close to California and decreases close to Florida. The exceptions are the random huge decreases in Nevada and North Dakota (maybe because of the end of the fracking boom?), and the confusing mess in the Northeast. This is a relatively simple story so far, but I don’t think it fully captures what’s going on. We have to go deeper. Some people run out of money, get evicted, and stay at a shelter for a few weeks before moving in with family and eventually getting back on their feet. Other people have mental health issues and stay on the street for years. When we talk about a “homelessness crisis”, we should try to distinguish these different situations. Let’s back up. Where is all this data coming from? Well, every year during the last 10 days of January, the US tries to count every homeless person. This is done by hundreds of local government organizations and nonprofits that cover almost the entire country. They must participate in the counting or they won’t get any funding from the US Department of Housing and Urban Development (HUD), which collects all the data."
