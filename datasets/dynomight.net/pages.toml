["https://dynomight.net/scans"]
title = "How much does a CT scan affect life expectancy?"
description = "If you get a CT scan (or an X-ray or a nuclear medicine scan) is it worth worrying about the radiation?"
full_description = "You’re probably aware that if you get a CT scan, that exposes you to a fair amount of radiation. But I’ve always wondered—how much should I care about that? So here’s an attempt at a rough estimate. As always, I think the right way to quantify things is in terms of the impact on life expectancy since this allows us to compare all the different possible life interventions. (Cost of 1mSv) = (Extra cancer risk) × (Life expectancy change from eliminating all cancer) = (0.05 / 1000) × 2.66 years = 1.16 hours. Now, we can take estimates of the amount of radiation from different types of scans (again from Lin (2010)) and convert them into changes in life expectancy. Overall… you probably don’t want to do these things on a lark. In some hypothetical future where we’re all 1000x richer and have nuclear medicine equipment sitting around in the basement, you wouldn’t want to do weekly bone scans “just in case”. But if you’re a normal person today and a doctor ordered one of these tests, it seems very likely that the value of information gained by the test would outweigh the costs of the test itself. Of course, these estimates are noisy. The starting numbers could be off, the math uses a linear approximation, and this assumes—surely incorrectly—that radiation is equally harmful on any part of the body. Still, these numbers are small enough that I can’t help but further discount one of the standard justifications given for the strange anti-diagnostic movement in modern medicine. GLP-1 drugs are a miracle for diabetes and obesity. There are rumors that they might also be a miracle for addiction to alcohol, drugs, nicotine, and gambling. That would be good. We like miracles. But... Some of my favorite internet people sometimes organize little community experiments. Like, let’s eat potatoes and see if we lose weight. Or, let’s take some supplements and see if anxiety goes down. I’ve toyed with... If you ask the internet if breastfeeding is good, you will soon learn that YOU MUST BREASTFEED because BREAST MILK = OPTIMAL FOOD FOR BABY. But if you look for evidence, you'll discover two disturbing..."
