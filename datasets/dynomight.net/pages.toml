["https://dynomight.net/air"]
title = "Better air quality is the easiest way not to die"
description = "Why the air you breathe matters, and what to do about it."
full_description = "While most things that clearly improve health are well known, one is insanely underrated: Fixing your air. I suspect this is often the most effective health intervention, period. Nothing else is so important while also being so easy to address. Let’s do a sanity check: Take the four biggest countries in the world and compare how many people died from various causes in 2019. It’s hard to prioritize health advice. I’m told I should limit salt and eat cruciferous vegetables and do cardio and sleep well and limit alcohol and reduce stress and go for regular checkups. But how much do each of these matter? If you’re a fallible hairless ape, what should you do first? To answer this, we need numbers. Below, I’ve estimated how much various things impact life through air quality. By all means, control your body-mass, eat well, and start running. Those are important, but they’re also kind of hard. You might fail to lose weight, but if you try to fix your air, you’ll succeed. You should put the stuff with the highest return on effort first, and that’s air. If you don’t want to read this long, looooooong article (I’m sorry) just do these things in this order: We measure particles in terms of PM2.5. To understand what these numbers mean, here’s how you could, in theory, measure them: For reference, human hair is around 70 microns wide, bacteria are 1 to 10 and viruses are 0.02 to 0.4. The EPA gives a helpful visualization: You might ask: Does it matter what the actual particles are? Is 50 μg/m³ created by burning coal or manufacturing cement or natural dust equally harmful? The answer is no (heard of asbestos?) but we don’t really know how much these differences matter in practice. A better measure than deaths is disability-adjusted life years or DALYs. This is the number of years of life lost plus an adjustment for non-lethal conditions that make life worse. For example, schizophrenia is pretty bad, so this measure counts someone who becomes schizophrenic for a year as losing half a DALY. Looking at DALYs lost to different causes gives a similar picture to deaths:"
