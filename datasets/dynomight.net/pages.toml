["https://dynomight.net/bigger-nukes"]
title = "Why nuclear weapons aren't getting bigger"
description = "Nations could build nuclear warheads much more powerful than they have now. But they have no interest in doing so. Why is that?"
full_description = "The Little Boy bomb detonated over Hiroshima in 1945 was a fission weapon where a critical mass of uranium-235 created a chain reaction of atoms splitting into lighter atoms, releasing energy and neutrons. While such weapons are very destructive, they are “inefficient” in that as the bomb starts to explode, it pushes the uranium-235 atoms away from each other. This quickly eliminates the critical mass, meaning most of the atoms never undergo fission at all. Thermonuclear weapons use another principle: If deuterium and tritium (isotopes of hydrogen with extra neutrons) are put together at very high temperatures, they will fuse into helium, generating energy in the process. Roughly speaking, fusion bombs wrap a layer of deuterium and tritium around a fission bomb. The outer fusion reaction creates a huge number of neutrons that make the inner fission reaction much more complete. The first demonstration of this principle was Ivy Mike in 1952, an explosion 500 times more powerful than Little Boy. Other detonations quickly followed. In 1961, Tsar Bomba was the largest man-made explosion in history, 2,500 times more powerful than Little Boy. Yet today, almost all deployed nuclear warheads are smaller, and there’s little interest in making them bigger. The largest American bomb (the B83) is eight times less powerful than Ivy Mike. The warheads on ballistic missiles (e.g. the W76, W78, or W80) are only 5-20x more powerful than Little Boy. The Russian arsenal is similar. Tsar Bomba was a normal-looking bomb. But it was large (8 meters long and 2.1 meters wide) and very heavy (26 tonnes). For comparison, a modern 737 freighter has a total payload of around 18 tonnes. The bomb required a 1.6 km2 parachute, and a specially modified plane to carry and drop it. Even with a special paint to reflect heat, it was estimated that the flight crew only had a 50% chance of survival. (They did survive—the shock wave caught the plane and it dropped 1 km in the sky but then recovered.)"
author = "dynomight"
year_published = 2022
year_updated = 2022
