["https://dynomight.net/2021/01/15/eeo"]
title = "What happens if you don't fill out that ethnicity form?"
description = "Why do you have to fill out an ethnicity form to get a job in the US? What happens if you refuse?"
full_description = "If you ever joined a large organization in the US, you filled out an ethnicity form. Here’s a typical one: ☐ American Indian or Alaska Native ☐ Asian ☐ Black or African American ☐ Hispanic or Latino ☐ Native Hawaiian or Other Pacific Islander ☐ White ☐ Two or More Races The employer is subject to certain governmental recordkeeping and reporting requirements for the administration of civil rights laws and regulations. In order to comply with these laws, the employer invites employees to voluntarily self-identify their race or ethnicity. Submission of this information is voluntary and refusal to provide it will not subject you to any adverse treatment. The information obtained will be kept confidential and may only be used in accordance with the provisions of applicable laws, executive orders, and regulations, including those that require the information to be summarized and reported to the federal government for civil rights enforcement. When reported, data will not identify any specific individual. If you choose not to self-identify, your gender and ethnicity will be recorded by a representative based on visual observation. The Civil Right Act was passed in 1964 and amended by the Equal Employment Opportunity Act in 1973. Title VI of this created the US Equal Employment Opportunity Commission (EEOC) and gave them the power to issue regulations. The current regulations are found in Title 29, Volume 4, Chapter XIV, Part 1602 of the federal code of regulations. These state: Employers are required to attempt to allow employees to use self-identification to complete the EEO-1 report As an aside: The EEO is at pains to emphasize that hispanic/latino is not an ethnicity, while also behaving exactly as if it were. Technically, each person has an ethnicity (hispanic or not) and then race (white, etc.) is only reported for non-hispanics. Some places do explain what happens if you don’t disclose. If you get a job at the FDIC, their form says: In the instance of missing information, your employing agency will attempt to identify your race and ethnicity by visual observation."
