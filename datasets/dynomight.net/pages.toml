["https://dynomight.net/alcohol-trial"]
title = "The big alcohol study that didn't happen: My primal scream of rage"
description = "Why did a huge alcohol RCT get cancelled? A strange story of science, academia, bureaucratic maneuvering, ambition, politics, capitalism, the deep state, secret emails, and slippery ethical slopes."
full_description = "Someone who averages 10 drinks per day is 50x more likely to get cirrhosis than someone who doesn’t drink at all (controlling for age, sex, and drinking history). This looks bad, but there are two caveats. First, it doesn’t establish causality. It could be—if all you had was this figure—that cirrhosis causes hormonal changes that in turn create the urge to drink more. But we do know that heavy drinking is bad. That’s partly because we know how alcohol causes problems. It causes cirrhosis by destroying liver cells. It causes cancer by getting converted to acetaldehyde and then damaging DNA. There are also randomized controlled trials (RCTs) that take heavy drinkers and get them to drink less. These inevitably show improved health (either health outcomes or biomarkers like blood pressure). The second caveat is the little dip for diabetes and heart disease around 1-2 drinks. Some people think alcohol is causing this dip. Lots of mechanisms have been proposed: Maybe it reduces inflammation. Or maybe it impairs the cells that build up plaques in arteries. Or maybe it creates a hormonal imbalance that changes blood pressure regulation. Or maybe it increases HDL-cholesterol or insulin sensitivity or adiponectin levels. Or, maybe alcohol doesn’t help diabetes and heart disease at all. Mathews et al. (2015) try to model how alcohol affects the heart, ending up with this terrifying figure: Alcohol does a lot of different things and interacts with a lot of other factors. It’s great to try to unravel all this, but I don’t trust anyone who says they understand everything with confidence. If alcohol doesn’t improve heart health, then why the dip? Well, it could just be that the same people who drink moderately also tend to exercise and eat well. So we don’t know if moderate drinking is bad for you. It almost certainly causes harms like cancer, but it might help heart disease enough to offset those harms. In the US, around 20% of adults drink 1-2 drinks per day. Even if the effects are modest, the collective impact is huge. Second perhaps to caffeine, alcohol is humanity’s favorite drug. We need to know what it does."
author = "dynomight"
year_published = 2021
year_updated = 2021
