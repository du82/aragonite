["https://dynomight.net/polarization-sample-bias"]
title = "Political polarization is partly a sample bias illusion"
description = "How polarized are we? An overview of what people of different political parties, education levels, races, and political engagement think about politics."
full_description = "We’re here on Earth for such a short time. So, I often wonder—what do people spend their days thinking about? Judging from the ever-increasing amount of screaming everywhere, the answer would seem to be politics. But is that right? What opinions do normal people really have? Asking my friends won’t help. They’re a biased subpopulation—otherwise, we’d have, like, universal pet insurance funded by a land-value tax. (Or at least lower particle levels in subways.) The solution is to find lots of random people, and ask them all a battery of questions. That is, polling. To better understand what people think, I found the 2020 Cooperative Election Study Common Content survey, which is a representative sample of 61,000 American adults. (They’ve helpfully made it impossible to link directly, but you can get a description by going here and clicking on “Access File”). It asks boring questions like if people approve of Trump or Congress or whatever. But it also asks if people approve of a ton of different policies. I picked seven that I thought were representative. Here they are, along with their exact wording: We have every answer from each person, along with their political party, education level, race, income, and so on. Here’s a first visualization. This shows the percentage of people that support each policy, broken down into various groups. Here’s a chart that breaks people up in other ways that turn out to be less impactful: If they are an immigrant, their family income, where they live in the US, and if they used social media in the last 24 hours: There are a few subtleties: The pattern reverses for the rich on abortion and the police. There’s no pattern between if someone uses social media and how they feel about assault weapons or abortion. Naturalized citizens (but not non-citizens) favor increasing the number of police. Some other ways you can break things up that seem interesting, but turn out to be kind of dumb. For example, here’s what you get if you break things down by how people think the economy changed over the last year."
