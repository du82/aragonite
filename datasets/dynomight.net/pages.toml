["https://dynomight.net/paths"]
title = "Things you're doing but don't want to be doing"
description = "An analogy between coat racks, desire paths, arguing, vacuuming, reading, social media, drinking, vacations, and colonoscopies."
full_description = "You learn a lot about people from their bedrooms. Some have TVs or books or laptops. Some have blackout curtains or stuffed animals or bottles of pills. But, vast as human experience is, one thing is consistent: Everyone has once-worn clothes strewn on the furniture. Why? In one sense, it’s obvious. The clothes are clean enough to wear again, but it feels wrong to put them back with the freshly washed ones. Since there’s no designated place for worn-but-clean clothes, we improvise. But in a deeper sense, it’s mystifying. Why is there no dedicated place? No one is happy with clothes everywhere. Why isn’t there a standard solution? I don’t know. Many people think that you’re supposed to wash every garment every time you wear it and some (nutcases) actually do this. Otherwise people don’t think about it aside from feeling vaguely guilty. You can put a coat rack in your bedroom. Or put up some hooks. Or reserve an area of your closet. Whatever you do, put your once-worn clothes there without guilt and watch a tiny percentage of the stress in your life disappear. Yes, the benefit of this is small, but the cost is very small, which makes this the kind of thing that’s worth doing. Are there analogous solutions—“coat racks” for other problems in life? Sometimes, but not always. There is an analogy here, but it’s at the level of the problem, not the solution. These are desire paths. Many colleges have a story that when they were first built, the designers left grass everywhere at first and just paved over the footpaths that were organically created. As far as I can tell this never actually happened. (Would you open a brand-new campus and let people tramp around in the mud?) But whatever. Much the same thing happened gradually over time. Here’s what Michigan State University looks like from the air today. For our purposes, what matters is the analogy: A desire path is a sign that the way things are currently set up, the easiest thing to do isn’t the “right” or intended thing."
