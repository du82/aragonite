["https://dynomight.net/litter"]
title = "Litter and circles of internalization"
description = "Why not tax businesses for the misdeeds of their customers?"
full_description = "This is obvious, but it’s clearly no magic bullet since everyone’s already done it and yet littering hasn’t perished from the earth. Why? Primarily because it’s hard to catch people. You could put police everywhere, but this would cost more than it’s worth. In some places, dropping trash on the street will result in someone picking it up and running up to helpfully return the object you “accidentally dropped”. A strong social norm like this is very effective and largely self-enforcing. But say your citizens don’t have a norm. You can run a bunch of ads to try to change the norm, like the US did this the 1970s using this charismatic Native-American Italian-American actor: Probably this helps. I think these ads shifted the norm away from everyone littering all the time for no reason. But it wasn’t enough to get people to punish defectors, so some people still litter. If your citizens are rational, all you need to do to stop littering is make this expected cost larger than the benefit/convenience of littering. If it’s hard to increase the chance of catching people, the other option is to increase the penalty. For example, if people get $1 of value from littering and get caught 0.1% of the time, then the penalty needs to be at least $1000. This idea traces back to Becker in 1968, but it’s rarely used. Some people doubt if people are “rational” in this way. I’m sure it’s not a perfect model but come on—in Singapore you can get a $3600 SGD fine and 12 hours of coercive labor for discarding a single cigarette butt. Guess how much litter Singapore has? (In many US states you can theoretically get hefty fines for littering, but this is seldom enforced—in many places you can throw trash on the ground in front of police with impunity.) The bigger objection to this policy seems to be that people are repelled by random huge penalties getting handed out for minor misdeeds. That objection doesn’t particularly resonate with me. Life is kind of tragic and high variance by nature—stock markets are uncertain, you could have a brain aneurysm at any time, and we accept firefighters risking death for the greater good. If we had 100 policies that each increase average welfare but add a bit of variance, implementing all of them would make almost everyone better off. And you don’t have to litter."
