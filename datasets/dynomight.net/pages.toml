["https://dynomight.net/consciousness"]
title = "Consciousness will slip through our fingers"
description = "Can technology explain subjective experience?"
full_description = "I guess life makes sense: For some reason there’s a universe and that universe has lots of atoms bouncing around and sometimes they bounce into patterns that copy themselves and then those patterns go to war for billions of years and voilà—you. But consciousness is weird. Why should those patterns feel like anything? We understand life in the sense that we’ve worked out the ruleset for how atoms bounce. The ruleset that produces consciousness is a mystery. Increasingly accurate measurements of internal brain states. (Via technologies with fun names like magnetoencephalography.) Better models and simulations of neurons and brains. (The Human Brain Project didn’t simulate a human brain, but they tried!) And soon we will have even cooler stuff! In a few hundred years, we’ll plausibly have real-time brain scanners and near-perfect brain simulators and AIs that are far smarter than any human. So: How will all this future technology change how we think about consciousness? Can we predict anything? This will sound stupid, but when I started this blog, I thought consciousness would be the main subject. Early on, I read about early split-brain experiments. (Overstated!) And I read about experiments testing if animals can recognize themselves in mirrors. (Interesting but end in minutia—do gorillas fail because they’re too dumb or because they’re too aggressive and attack the mirror before getting a chance to think?) And I read a bunch of philosophy. This convinced me that selfhood does not exist, which isn’t nothing. But slowly, I came to feel that philosophy of consciousness is mostly an exercise in taxonomy, in mapping out ever-more specific sub-sub-subcategories of possible theories. I look forward to the day that panpsychist property dualism is recognized as the one true theory, but I don’t expect that day soon. And then… I noticed that I didn’t have much to contribute. Any time I had a new consciousness-related idea, a little searching would reveal it wasn’t remotely new. Interesting problems attract smart people and consciousness is very interesting."
