["https://dynomight.net/cola"]
title = "Two conspiracy theories about cola"
description = "Does cola contain a drug to prevent you from throwing up from the sugar? And is Mexican Coke somehow better than American Coke?"
full_description = "“Cola has so much sugar in it that you’d throw up from drinking it, except they add an anti-vomiting drug to stop that from happening.” My first thought when I saw this was that, OK, cola has phosphoric acid. But surely it has much less than the drugs. Well… The drugs contain 64.6 mg of phosphoric acid in a small dose and twice that in a large dose. This is easy to calculate given the information on the label above and the fact that the recommended dose is 15-30 mL. Cola probably contains something like 200 mg per can. This isn’t trivial to figure out. I estimated it in two ways, which I trust only because they give similar answers: Interestingly, even the ratio of phosphoric acid to sugar is almost the same (around 5.5 mg phosphoric acid / g sugar). What’s the catch? If Emetrol is just a more expensive and worse-tasting cola, why does every pharmacy everywhere sell it? Well, if you think that’s disturbing, keep reading. You can just try it. A can of cola has 39 grams of sugar (10 teaspoons), and around 350 ml of water. I measured these out into two glasses, which looked like this: After mixing these up, the result was very sweet, but all members of House Dynomight—sometimes after a lot of encouragement—drank some without feeling the slightest bit ill. Apple juice has just as much sugar as cola. Non-cola soft drinks have citric acid instead of phosphoric acid. (As do some diet colas.) Obviously, people drink these without vomiting. Root beer, it turns out, has neither phosphoric nor citric acid. For this reason root beer has a higher pH than other soft drinks and probably isn’t as bad for your teeth. The Mayo Clinic simply states that the combination of sugar and phosphoric acid “has not been proven to be effective”. DISCLAIMER: This drug has not been found by FDA to be safe and effective, and this labeling has not been approved by FDA. For further information about unapproved drugs, click here. Don’t click there, it’s useless. But here’s the history: The FDA was created in 1906, but only gained the authority to approve drugs with the 1938 Federal Food, Drug and Cosmetic Act. However, this only gave authority to approve new drugs, and only said that they needed to be tested for safety. It wasn’t until 1962 that the law was amended to require that new drugs be tested for effectiveness."
