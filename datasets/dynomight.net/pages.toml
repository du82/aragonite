["https://dynomight.net/breastfeeding"]
title = "Nursing doubts: Is breastfeeding good?"
description = "(how good? how do we know?)"
full_description = "If you ask the internet if breastfeeding is good, you will soon learn that YOU MUST BREASTFEED because BREAST MILK = OPTIMAL FOOD FOR BABY. But if you look for evidence, you’ll discover two disturbing facts. First, there’s no consensus about why breastfeeding is good. I’ve seen experts suggest at least eight possible mechanisms: Second, the evidence for breastfeeding is overwhelmingly observational: It’s not based on experiments, but rather looking at the existing population and “observing” that breastfeeding is correlated with having mildly fewer infections (of many kinds) and slightly lower obesity. It may also be correlated with better outcomes in terms of allergies, diabetes, lymphoma, colitis, Crohn’s disease, or later IQ. Observational evidence is disturbing because correlations are bad. Even if breastfeeding did nothing, people think it’s good, so the same parents who breastfeed more tend to have higher socioeconomic status and provide lots of other goodies too. Babies that wear baby Rolex watches are probably healthier on average. But that’s because their parents are rich, not because Rolexes are good for you. Could breastfeeding be like that? Of course, experts are aware of this issue. They try to compensate for it by “controlling” for upstream variables. The most-cited meta-analysis on breastfeeding and IQ collected 18 papers that each controlled for different things, like parental education, social status, or how much social interaction the baby got. The control variables seemed to matter a lot: But what about paternal IQ? Might smarter dads convince mothers to breastfeed more? What if you forgot to control for something, or your data was noisy, or the relationship is nonlinear? (What if smarter babies manipulate their mothers into breastfeeding more?) If any of that happens, then correlations will probably exaggerate the causal impact of breastfeeding. So there’s been a small movement in recent years to push back against Big Nurse, to argue that, despite the public health messaging, there is no clear evidence that breastfeeding is beneficial. (See Stuart Richie at Science Fictions or Emily Oster at Five Thirty Eight or The Guardian for good versions of this argument.)"
