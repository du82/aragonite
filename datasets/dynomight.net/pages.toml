["https://dynomight.net/simpsons-paradox"]
title = "Simpson's paradox all the way down"
description = "Visualizes Simpson’s paradox, and shows how it’s a deeper problem than many people realize."
full_description = "It’s hard to get into Oxford. Is it easier if your parents are rich? In 2013, The Guardian showed noticed something disturbing: Students from (expensive) independent schools were accepted more often that students from state schools. Of course, a natural question to ask is, did students from independent schools have stronger applications? To check this, you can limit things to just students with strong grades (three A* grades at A-level). If you do that, the difference shrinks but doesn’t disappear. The Conversation later noticed two important facts: First, it’s much easier to get into Oxford if you apply to classics (45% accepted) rather than medicine (21%). Second, students from independent schools are much more likely to apply to classics. Even if all department admitted students at equal rates, you’d still get an appearance of overall bias if state students apply more often to more competitive majors like medicine. This kind of situation—where the data seems to tell a different story depending on how it’s analyzed—is typically known as “Simpson’s paradox”. Typically these situations are seen as odd little curiosities, or perhaps cautionary tales about the “correct” way to interpret data. But I think this underrates Simpson’s paradox. It’s not a little quirk. Really, it’s just the first layer of a deeper issue that may not have a solution. It’s better to think of it as a limit on what questions data can answer. So here’s a little parable about that. You’re a mortal shepherd living near Olympus with a flock of sheep and goats. Your neighbor Zeus has grown weary of transforming into animals to seduce love interests and, in his boredom, has taken to shooting lighting bolts at your flock. You wonder: Is He biased in terms of shooting goats or sheep more often? You keep records for a year. At the end of the year, Zeus shot 12 of your 25 sheep and 13 of your 25 goats, suggesting a bias against goats. (If you’re worried about having a small sample, multiply all the numbers by a million.)"
author = "dynomight"
year_published = 2020
year_updated = 2022
