["https://dynomight.net/tires"]
title = "Conspiracy theory: Electric cars make more air pollution than gas cars"
description = "tires + battery + heavy"
full_description = "Claim: Per kilometer driven down the road, electric cars create more particulate air pollution than gas cars. That’s ignoring all other emissions and anything that happens at a power plant or during manufacturing. (You can get some version of this argument in The Atlantic, The Washington Post, The Guardian, or by asking my dad.) First, how much do cars emit through exhaust? After 30 minutes with US regulations, I learned only that those regulations are very confusing and I hate them. But many (mostly coastal) states follow California’s more stringent rules. These are simple: A car’s exhaust can put at most 1.9 mg of particulate matter into the air for each kilometer driven down. EU rules are slightly looser at 4.5 mg/km. Could brakes come close to that? Well, depending on the vehicle, disc brake pads have 100 to 400g of friction material. Perhaps 80% of that material is worn away before replacement, which happens after something like 65,000 km. Assuming 200 g of friction material, that suggests an average of of material lost from brakes. That’s more than California or EU exhaust limits. So it’s at least physically possible that brakes could make more particulate pollution. What about tires? They weigh around 10 kg. By the time tires are replaced, around 10% of that mass is lost. This happens after 80,000 km or so. That suggests an average of of mass lost from tires. Again, that’s more than exhaust rules allow. Our theory survives first contact with reality. But… not all material that’s lost becomes airborne. And not everything that goes airborne will be the small particles that hang around in the air the longest and do the most damage to health. To measure small particles, we typically consider only those smaller than 10 microns (“PM₁₀”) or 2.5 microns (“PM₂.₅”). They are still measured in grams, just after screening out larger particles. So how much of brake/tire emissions end up as these small particles? Here’s a review based on Grigoratos and Martini."
