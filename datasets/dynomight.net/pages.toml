["https://dynomight.net/internet-writing"]
title = "So you're thinking about writing on the internet"
description = "Observations on the dynamics of writing and commenting."
full_description = "I’m not famous or successful, so why should you care what I think? Well, I have some observations about the dynamics of writing on the internet that I think my even more non-famous and non-successful self would have benefited from. The idea of writing is crazy: You have some pattern in your brain-meat, which you try to encode into a linear series of words. Then someone else reads those words and tries to reconstruct the pattern in their brain-meat. In this dance, how much work is being done by the words versus the lifetime of associations each person has built up around them? Rather than a full blueprint for an idea, writing is often more like saying “Hey look at concept #23827! Now look at concept #821! Now look at concept #112234! Are your neurons tingling in the way mine are? I hope so because there’s no way to check, bye!” We have different personalities and spend our lives doing different things and getting exposed to different information. What concept #821 triggers for you may be vastly different from what it triggers for me. I suspect that even when writing works, readers often take quite a “different trip” than the writer intended. Personally, I figure that’s fine. It’s better to just let people take their own trip, rather than going to insane lengths in a hopeless quest to make everything precise. So: No matter what you do, sometimes your writing will fail. It’s impossible to predict all the ways it will fail. Really, it’s amazing that it works at all. I wrote an article suggesting ultrasonic humidifiers might put particulates into the air and harm health. The median response was something like: Please stop polluting the internet with speculation. If you can’t support your argument with peer-reviewed research papers you shouldn’t write it at all. This was… puzzling, because I had dozens of citations starting very early in the article. But many people in different forums independently said things like this. I wrote an article about gas stoves and nitrogen dioxide where I stated in the overview that a typical range hood might fix things. A top comment was that a high-quality hood would obviously solve the problem and the fact that I claimed wouldn’t showed I was biased and bad (so bad)."
