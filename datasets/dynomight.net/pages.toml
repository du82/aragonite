["https://dynomight.net/effective-selfishness"]
title = "Effective selfishness"
description = "We could be a lot better at taking care of ourselves."
full_description = "You get the point: We have lots of choices in modern life. They collectively have a big impact on how happy/healthy/productive we are but they are hard and evolution hasn’t given us good instincts for making them. These questions are also hard, basically too hard for a single person to answer. So, when you look at which philanthropic organizations thrive, these questions traditionally haven’t mattered very much. The organizations that endure tend to be the ones that make their supporters feel good. This isn’t anyone’s fault! It’s not Alex’s fault for not doing this basically-impossible research, and it’s not an organization’s fault for being good at the one thing they must be good at to not be outcompeted by an organization that is good at it. It’s just another case where nature imposes a fitness function that isn’t aligned with our interests. Broadly speaking, effective altruism tries to tie impact with how good things feel. The basic strategy is to (1) get people excited about impact in general, (2) figure out what has impact, and (3) promote high-impact stuff to impact enthusiasts. Research shows that different strategies can be much more cost-effective than others for the same problem. Jamison et al. (2006) estimated that how much it could cost to save a disability-adjusted life year (DALY) for someone at risk of HIV/AIDS. Surgical treatment of Kaposi’s sarcoma cost $30k, antiretroviral therapy cost $1k, condom distribution cost $100, and peer education cost only $20. Calculations like these allow you to compare not just strategies, but also problems. If you care equally about polar bears and girls’ education in Eastern Europe but one dollar can do much more for the girls, that’s probably where you’ll want to concentrate. The effective altruism community also considers personal actions. For example, if you care about orangutans, you could fly to Sumatra and go to the rainforest and then, like… help? But it’s probably more effective to get a job and donate some money to an orangutan sanctuary. It also suggests that some things might be counterintuitively ineffective—e.g. if you can land a competitive job at a famous nonprofit, maybe you’ll just displace someone else who would have done a great job anyway."
