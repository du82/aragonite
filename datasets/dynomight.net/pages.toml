["https://dynomight.net/audiobooks"]
title = "Against dystopian views of high-speed audiobook listening"
description = "The sound and the worry"
full_description = "There was recently a thread on r/slatestarcodex about “What life hacks are actually life changing”. One of the examples given was: Bbb: Audio books help people consume many more books than they otherwise would, and listening to them in place of podcasts on commutes or during the types of workouts where listening is feasible is generally a good thing. Though there are certainly some fun podcasts. Ccc: But you retain far less information. So it’s just so your mind is busy with something and doesn’t have to deal with existential crisis You think you’re giving out helpful tips for internet friends? Haha, no, you’re inviting a review of your intelligence and philosophical outlook! It’s like a cute little bunny prancing through the forest until a piano suddenly falls from the sky. Of course, “person on internet is mean” isn’t much of a story. (Ask me about my emails after I suggested that maybe Julian Assange isn’t the most admirable human being ever.) And anyway, everyone was fine other than Aaa. I too must admit Ccc has a point. Certainly, it’s human nature to do things that make us feel better. And for many of us, that includes doing things to prevent experiencing existential crises. “Getting good sleep and regular exercise just means that your mind is full of happy chemicals and doesn’t have to deal with existential crisis.” “Having kids just means that your mind is busy taking care of new life and experiencing ‘joy’ and doesn’t have to deal with existential crisis.” “Hiking up to mountain vistas just means your mind is distracted by beauty and doesn’t have to deal with existential crisis.” “Having deep relationships just satisfies ancient instincts designed to help you access resources and trigger a feeling of ‘meaning’ in your mind so it doesn’t have to deal with existential crisis.” I think most people believe that. As evidence, I’ll point to a weird norm our culture has that most people don’t seem to notice. You’re not supposed to talk about existential crises. Personally, I think my baseline instinctual angstiness would place me somewhere near the 90th percentile of the population. (I mean, I have a blog…) But don’t whine about it because I don’t want to be a lame edgelord."
