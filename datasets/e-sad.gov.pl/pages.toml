i od kosztów sądowych w EPUKonieczne elementy uzasadnienia pozwu w EPUEPU - Najczęściej zadawane pytaniaEPU - dane kontaktoweLista kadry orzekającej w VI Wydziale Cywilnym (e-Sąd)E-court basic informationE-Gericht Information auf DeutschEPU - Informacje ogólneEPU - Informacja dla pozwanych i ich pełnomocnikówEPU - Informacja dla powodówEPU - informacja prawnaRegulamin płatności elektronicznych dokonywanych za pomocą strony internetowejInformacje dla sądówUzyskanie nr PESEL pozwanegoInstrukcja użytkownika FrontOfficeUsługa sieciowa e-SądDeklaracja dostępności serwisu internetowego www.e-sad.gov.pl Panel logowania Nazwa użytkownika: Hasło: Zapomniałem hasła Dodatkowa możliwość logowania do EPU poprzez Moduł Tożsamość przy użyciu następujacych metod autoryzacji użytkownika: Krajowy Węzeł Identyfikacji Elektronicznej (login.gov.pl) lub kwalifikowany podpis elektroniczny. Dowiedz się więcej Aktualności 25 luty 2025r. Szanowni Państwo, w dniu dzisiejszym (25.02.2025 r.) w godzinach od 18:00 do 21:00 mogą występować przerwy w działaniu system... więcej 20 luty 2025r. Szanowni Państwo, w związku z informacją umieszczoną na stronie więcej 17 luty 2025r. Szanowni Państwo, uprzejmie informujemy, że w dniu 18 lutego 2025 roku (wtorek) od godz. 07:30 do godz. 08:15, system telein... więcej Trwa logowanie Proszę czekać... Powiązanie konta użytkownika EPU z kontem w Module Tożsamość Pomyślnie zalogowano się do Modułu Tożsamość, jednak nie udało nam się zidentyfikować Twojego konta w systemie EPU. Konieczna jest jednorazowa czynność powiązania konta w systemie EPU z kontem w Module Tożsamość. W tym celu należy zalogować się do systemu EPU przy użyciu dotychczasowych poświadczeń. Jeśli posiadasz kilka kont w systemie EPU, to w tym oknie możesz dokonać powiązania tylko jednego konta użytkownika EPU z kontem w Module Tożsamość. Operację powiązania drugiego i kolejnego konta możesz wykonać po zalogowaniu do systemu EPU z użyciem dotychczasowych poświadczeń EPU w zakładce Administracja konta -> Dane użytkownika. Nazwa użytkownika: Hasło: LUB Możesz wykonać tę operację później na swoim koncie użytkownika w systemie EPU w zakładce Administracja konta -> Dane użytkownika. Dowiedz się więcej Trwa logowanie Proszę czekać... Wybór profilu konta w systemie EPU Z Twoim kontem w Module Tożsamość skojarzono kilka profili w systemie EPU. Wybierz użytkownika, na konto którego chcesz sie zalogować. Mapa serwisu • BIP • Polityka prywatności • Pomoc • Kontakt • Deklaracja dostępności • O nas Portal jest nadzorowany przez Ministra Sprawiedliwości Zamówienie współfinansowane ze środków Unii Europejskiej w ramach Europejskiego Funduszu Społecznego wersja 1.101.26.007/Serwer produkcyjny 3 Ta strona wykorzystuje ciasteczka (cookie) Więcej //<![CDATA[ var Page_Validators = new Array(document.getElementById("ctl00_ContentPlaceHolder1_UserNameRequired"), document.getElementById("ctl00_ContentPlaceHolder1_PassReq"), document.getElementById("ctl00_ContentPlaceHolder1_PopupUserNameRequired"), document.getElementById("ctl00_ContentPlaceHolder1_PopupPassReq")); //]]> //<![CDATA[ var ctl00_ContentPlaceHolder1_UserNameRequired = document.all ? document.all["ctl00_ContentPlaceHolder1_UserNameRequired"] : document.getElementById("ctl00_ContentPlaceHolder1_UserNameRequired"); ctl00_ContentPlaceHolder1_UserNameRequired.controltovalidate = "ctl00_ContentPlaceHolder1_UserName"; ctl00_ContentPlaceHolder1_UserNameRequired.errormessage = "Proszę wprowadzić nazwę użytkownika"; ctl00_ContentPlaceHolder1_UserNameRequired.display = "None"; ctl00_ContentPlaceHolder1_UserNameRequired.validationGroup = "LoginPanel1"; ctl00_ContentPlaceHolder1_UserNameRequired.evaluationfunction = "RequiredFieldValidatorEvaluateIsValid"; ctl00_ContentPlaceHolder1_UserNameRequired.initialvalue = ""; var ctl00_ContentPlaceHolder1_PassReq = document.all ? document.all["ctl00_ContentPlaceHolder1_PassReq"] : document.getElementById("ctl00_ContentPlaceHolder1_PassReq"); ctl00_ContentPlaceHolder1_PassReq.controltoval