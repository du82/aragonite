["https://e-voting-moratorium.ch/initiativtext"]
title = "Initiativtext | E-Voting-Moratorium │ Volksinitiative"
full_description = "InitiativtextEidgenössische Volksinitiative «Für eine sichere und vertrauenswürdige Demokratie (E-Voting-Moratorium)»Die Bundesverfassung[1] wird wie folgt geändert:Art. 39 Abs. 1bis 1bis Die Verwendung elektronischer Verfahren zur Stimmabgabe ist verboten.Art. 197 Ziff. 12[2]12. Übergangsbestimmung zu Art. 39 Abs. 1bis (Verwendung elektronischer Verfahren zur Stimmabgabe) 1 Artikel 39 Absatz 1bis tritt mit der Annahme durch Volk und Stände in Kraft; mit der Annahme sind sämtliche Bestimmungen des kantonalen Rechts und des Bundesrechts über elektronische Verfahren zur Stimmabgabe nicht mehr anwendbar.2 Die Bundesversammlung kann das Verbot durch Bundesgesetz aufheben, wenn gewährleistet ist, dass mindestens die gleiche Sicherheit gegen Manipulationshandlungen wie bei der handschriftlichen Stimmabgabe besteht, namentlich wenn unter Wahrung des Stimmgeheimnisses:die wesentlichen Schritte der elektronischen Stimmabgabe von den Stimmberechtigten ohne besondere Sachkenntnis überprüft werden können;sämtliche Stimmen so gezählt werden, wie sie gemäss dem freien und wirklichen Willen der Stimmberechtigten und von aussen unbeeinflusst abgegeben wurden; unddie Teilergebnisse der elektronischen Stimmabgabe eindeutig und unverfälscht ermittelt sowie nötigenfalls in Nachzählungen ohne besondere Sachkenntnis zuverlässig überprüft werden können, sodass ausgeschlossen ist, dass Teilergebnisse anerkannt werden, die nicht den Anforderungen nach den Buchstaben a und b entsprechen.3 Die Bundesversammlung kann das Verbot frühestens fünf Jahre nach dessen Inkrafttreten aufheben.[1] SR 101[2] Die endgültige Ziffer dieser Übergangsbestimmung wird nach der Volksabstimmung von der Bundeskanzlei festgelegt."
