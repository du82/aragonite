["https://e-voting-moratorium.ch/millionen-fuer-unsicheres-e-voting-verschleudert-geschaeftspruefungskommission-gpk-muss-die-rolle-der-post-untersuchen"]
title = "Millionen für unsicheres E-Voting verschleudert: Geschäftsprüfungskommission GPK muss die Rolle der Post untersuchen | E-Voting-Moratorium │ Volksinitiative"
full_description = "Millionen für unsicheres E-Voting verschleudert: Geschäftsprüfungskommission GPK muss die Rolle der Post untersuchenMai 23, 2020 | Aktuelles DEDie schweizerische Post hat für ihr E-Voting-Abenteuer bereits über 20 Millionen Franken verschleudert – plus jährliche Kosten von 3 Millionen Franken. Hinzu kommen horrende Kosten für die Wissens- und Infrastruktur-Transfers ihres insolventen spanischen E-Voting-Partners Scytl, über die sich der Staatskonzern ausschweigt. Nationalrat Franz Grüter fordert die GPK des Schweizer Parlaments auf, sich diese fragwürdigen Umstände genauer anzuschauen und Transparenz zu schaffen.Die schweizerische Post hat für ihr E-Voting-System unter Einrechnung der jährlichen Betriebskosten bis anhin 35 Millionen Franken verbraten. Dies notabene für ein System, dem IT-Experten gravierende Sicherheitsmängel und Manipulationsanfälligkeit nachgewiesen haben.Nun da der umstrittene Konzern Scytl, der diese Infrastruktur für die Post entwickelt hat und im Übrigen mit seinen Systemen weltweit für diverse Wahldebakel verantwortlich ist, in Konkurs ist, will die Post offenbar noch mehr Geld in dieses Abenteuer reinbuttern. Sie hat Scytl das E-Voting-System abgekauft und will auf eigene Faust darauf hinarbeiten, dass die elektronische Stimmabgabe hierzulande bald wieder im Einsatz ist. Und dies, obwohl die Skepsis gegenüber einem zu schnellen Vorgehen, das die Sicherheit und Transparenz vernachlässigt, in der Bevölkerung ständig wächst.Wo man nur schon über die Motive dieses festgefahrenen Handelns den Kopf schütteln kann, ist vor allem die intransparente Kommunikationspolitik der Post stossend. Dass die Post die Öffentlichkeit über die genauen Kosten der Scytl-Übernahme im Dunkeln tappen lässt, heizt das Misstrauen weiter an. Es kann nicht sein, dass sich die Öffentlichkeit durch oberflächliche und gefilterte Informationen, die nur ausgewählten Journalisten im Rahmen sogenannter «Hintergrundgespräche» zugänglich gemacht werden, abspeisen lassen muss.Die Bevölkerung hat ein Anrecht zu erfahren, welche Beweggründe hinter dem teuren E-Voting-Abenteuer der Post stecken und ob die horrenden Ausgaben gerechtfertigt sind. Aus diesem Grund fordern wir die GPK der Bundesversammlung auf, diese Vorgänge genauer unter die Lupe zu nehmen und der Öffentlichkeit Bericht zu erstatten.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
