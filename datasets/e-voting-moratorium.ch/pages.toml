title = "Jugendsession unterstützt E-Voting-Moratoriums-Initiative | E-Voting-Moratorium │ Volksinitiative"
full_description = "Jugendsession unterstützt E-Voting-Moratoriums-InitiativeNov 12, 2019 | Aktuelles DEWenn das kein Beweis ist, dass der Wind gekehrt hat: Die Jugendsession, die grosse politische Plattform für Schweizer Jugendliche, hat in ihrem Plenum beschlossen, die Volksinitiative für ein E-Voting-Moratorium offiziell zu unterstützen. Die technikaffinen und digitalsensibilisierten Jugendlichen blicken offenbar durch und erkennen, dass E-Voting nicht mit Fortschrittsdenken verwechselt werden darf. Gerade, wer sich für eine nachhaltige Digitalisierung stark macht, unterstützt ein E-Voting-Moratorium.Rund 200 Jugendliche aus der ganzen Schweiz haben sich am vergangenen Wochenende im Bundeshaus versammelt, um über aktuelle, die Jugend betreffende politische Fragen zu debattieren. Die Jungen haben sich auch intensiv mit E-Government und E-Voting beschäftigt. Sie sehen die heutigen E-Voting-Systeme kritisch – gerade aus finanziellen, sowie demokratie- und sicherheitspolitischen Gründen.Ein Entscheid, der Mut macht: Bravo und danke, liebe Jugendsession!Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
