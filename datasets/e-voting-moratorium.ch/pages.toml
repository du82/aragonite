["https://e-voting-moratorium.ch/erfolg-der-initiative-bund-anerkennt-komplexitaet-von-e-voting-und-will-lehren-aus-der-vergangenheit-ziehen"]
title = "Erfolg der Initiative: Bund anerkennt Komplexität von E-Voting und will Lehren aus der Vergangenheit ziehen | E-Voting-Moratorium │ Volksinitiative"
full_description = "Erfolg der Initiative: Bund anerkennt Komplexität von E-Voting und will Lehren aus der Vergangenheit ziehenJun 23, 2020 | Aktuelles DEDie Bundeskanzlei hat angekündigt, den Versuchsbetrieb für E-Voting neu auszurichten und darauf wertzulegen, dass E-Voting-Systeme «höchsten Sicherheitsanforderungen genügen» müssten. Das Initiativkomitee begrüsst die Absichten der Bundeskanzlei, aus der mit Pleiten, Pech und Pannen begleiteten Versuchsphase der letzten Jahre die Lehren zu ziehen.Es ist ein massgebliches Verdienst unserer Volksinitiative, dass ein nachhaltiges öffentliches Bewusstsein für transparente Wahl- und Abstimmungsverfahren geschaffen wurde. Die Volksinitiative konnte erwirken, dass die Wissenschaftlichkeit Einzug in die Evaluation auf Bundesebene findet.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
