title = "E-Voting und die Auslandschweizer-Problematik | E-Voting-Moratorium │ Volksinitiative"
full_description = "E-Voting und die Auslandschweizer-ProblematikFeb 4, 2019ProblemstellungASO setzt auf die Dematieralisierung, die nicht realistisch ist Die Auslandschweizer-Organisation (ASO) gehört zu den lautesten Befürworterinnen von E-Voting. Ihr Hauptmotiv: In vielen Ländern gibt es Probleme mit der Post, weswegen das Abstimmungsmaterial aus der Schweiz oft verspätet eintrifft und die Teilnahme an Wahlen und Abstimmungen so teilweise nicht möglich ist.Viele Auslandschweizer plädieren deshalb für ein «papierloses, dematerialisiertes E-Voting-System[1]», ähnlich der Lösung, wie sie in Estland verfolgt wird. Das würde eine Abkehr des Schweizer E-Votings bedeuten, welches ja nach wie vor auf Postversänden basiert.Die Schweizerische E-Voting-Lösung sieht bekanntlich vor, dass den Abstimmenden per Post Verifikationscodes zugestellt werden, mit denen sie sich am Computer einloggen müssen. Das heisst: In einem Land ohne funktionierendes Postsystem brächte also auch E-Voting keine Verbesserung.Man könnte einzig ins Feld führen, dass der Postversand mit E-Voting nur noch einmal erfolgt: Bei der Zustellung der Abstimmungsunterlagen durch den Bund (und nicht mehr beim Zurücksenden).Weder die Staatskanzlei Genf noch Forscher der Berner Fachhochschule (BFH) unterstützen solch ein «dematerialisiertes E-Voting»: die Angriffe würden dann noch günstiger und es könnten auch skalierend Stimmen manipuliert werden – durch Schadsoftware à la Hacking-Team.Das BFH-Team E-Voting selber hat die Unsicherheit sowohl des norwegischen als auch estnischen Systems bereits angeprangert: beide waren / sind stark darauf fokussiert, dematerialisiert zu sein.Im Expertenbericht der BK[2] wird darauf hingewiesen, dass es zurzeit keine Lösung für die vollständige Dematerialisierung von E-Voting gibt.Lösungsansatz «Realistische Verbesserungsmöglichkeiten»Konkreter VorgangWas sich für das Papierwahlsystem nicht erschliesst, ist, wieso Auslandschweizer Briefe erhalten und wieder zurückschicken müssen. Eine sinnvolle Lösung wäre:Auslandschweizerinnen und Auslandschweizer erhalten Zugangscodes.Sie loggen sich damit auf einer E-Government-Plattform ein.Sie drucken die Unterlagen und unterschreiben den Stimmrechtsausweis.Sie stimmen damit lokal (Konsulat / Botschaft) in der Umgebung ab: Entweder per Brief- oder Urnenwahl.Sie könnten an der Auszählung lokal partizipieren.Die Ergebnisse werden getrennt an die Gemeinden / Kantone gemeldet – zum Beispiel über verschlüsselte E-Mails (nach geprüfter Identität), per Telefon oder eine E-Government-Plattform mit digitalen Unterschriften dafür; das liesse sich auch systematisch automatisieren.Transparenz und Nachvollziehbarkeit der ErgebnisseWichtig ist, dass vor Ort (Konsulat/Botschaft) genügend Leute die Ergebnisse je Gemeinde registriert haben und eine Wahlniederschrift erfolgt – ähnlich wie dies Deutschland macht. Damit können die Ergebnisse mit den online verfügbar gemachten Ergebnissen verglichen und andernfalls diskutiert werden – eine Nachzählung des weiterhin vorhandenen Papiers in den Aussenstellen bleibt möglich.In keinem Fall soll es nötig sein, die Unterlagen zwei Mal per Postweg verzögern zu lassen.Authentifizierung der StimmbürgerFalls man bei einer Gemeinde einen öffentlichen Schlüssel für Messaging hinterlegt und mit der Gemeinde verifiziert (wenn man in der Schweiz ist), kann man zukünftige Zugangscodes zur E-Government-Plattform – z. B. bei Änderung – via verschlüsselte Textnachricht erhalten. Bei Revokation: beim nächsten Mal, wenn man vor Ort ist oder halt Briefpost. Solche Zugangscodes können zumindest ein Jahr lang gültig sein, bis sie wieder erneuert werden sollten.Wer jetzt sagt, man kann die E-Government-Plattform fälschen: den Stimmrechtsausweis muss man noch immer «händisch» – mit der Unterschrift – fälschen, falls man es mit Briefwahl macht; analog Briefwahl im Inland. Bei der Urnenwahl ist der Ausweis vorzulegen. Die Komplexität des Angriffs unter Idealbedingungen zuletzt zur Stimmabgabe ist linear; wie bei der Papierwahl allgemein.Dafür muss das Konsulat oder die Botschaft im Ausland auch die Chance haben, die Unterschrift vergleichen zu können – für den Verdachtsfall. Einen Kontakt zu hinterlassen für eine Kontrolle im Verdachtsfall oder eine systematische Stichprobe mit zufälligen Abstimmenden zuzulassen – per Nachfrage, schafft hier mehr Sicherheit.ErgebnisIn keinem Fall soll es nötig sein, jedes Mal Unterlagen zwei Mal per Postweg verzögern zu lassen. Natürlich macht das die Prozesse für Auslandschweizer teurer. Doch bei der Demokratie ist es das Wichtigste, dass die Abstimmungs- und Wahlfreiheit der Bürger gewahrt wird.Vergleich zu anderen LändernAndere Länder setzen auch diplomatische Post ein, um die Stimmzettel in die zuständigen Gemeinden zu befördern und auszuzählen. In Ländern ohne Konsulat oder Botschaft und mit schlecht funktionierendem Post-System wäre sich zu überlegen, eine oder mehrere (temporäre) Vertretungen aufzubauen, wo Stimmen empfangen und öffentlich – für alle interessierten Bürgerinnen und Bürger – ausgezählt werden können.[1] Geschäft NR 16.4078:Papierloses E-Voting ermöglichen https://www.parlament.ch/de/ratsbetrieb/suche-curia-vista/geschaeft?AffairId=20164078[2] Expertenbericht der BK: https://www.bk.admin.ch/dam/bk/de/dokumente/pore/Schlussbericht%20EXVE.pdf.download.pdf/Schlussbericht_EXVE_DE.pdf Neue E-Voting Bewilligung – Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetztAug 16, 2023Neue E-Voting Bewilligung für die nationalen Wahlen 2023 - Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetzt Der Bund hat heute den Einsatz von E-Voting an den Nationalratswahlen 2023 bewilligt. Zahlreiche Initianten der «Volksinitiative für...mehr lesenErfolg der Initiative: Bund anerkennt Komplexität von E-Voting und will Lehren aus der Vergangenheit ziehenJun 23, 2020Die Bundeskanzlei hat angekündigt, den Versuchsbetrieb für E-Voting neu auszurichten und darauf wertzulegen, dass E-Voting-Systeme «höchsten Sicherheitsanforderungen genügen» müssten. Das Initiativkomitee begrüsst die Absichten der Bundeskanzlei, aus der mit Pleiten,...mehr lesenVolksinitiative für ein E-Voting Moratorium: Lockdown erzwingt Abbruch der SammelaktivitätenJun 22, 2020Infolge des neuen Corona-Virus beschloss der Bundesrat diverse Massnahmen, die neben Gewerbebetrieben auch Initiativkomitees direkt betrafen. Abstandsregeln, Hygienevorschriften und Veranstaltungsverbote verunmöglichten das Sammeln von Unterschriften. Auch wenn die...mehr lesen"
