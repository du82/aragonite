["https://e-voting-moratorium.ch/volksinitiative-fuer-ein-e-voting-moratorium-lockdown-erzwingt-abbruch-der-sammelaktivitaeten"]
title = "Volksinitiative für ein E-Voting Moratorium: Lockdown erzwingt Abbruch der Sammelaktivitäten | E-Voting-Moratorium │ Volksinitiative"
full_description = "Volksinitiative für ein E-Voting Moratorium: Lockdown erzwingt Abbruch der SammelaktivitätenJun 22, 2020 | Aktuelles DEInfolge des neuen Corona-Virus beschloss der Bundesrat diverse Massnahmen, die neben Gewerbebetrieben auch Initiativkomitees direkt betrafen. Abstandsregeln, Hygienevorschriften und Veranstaltungsverbote verunmöglichten das Sammeln von Unterschriften. Auch wenn die Einschränkungen nun schrittweise gelockert werden, sind Unterschriftensammlungen faktisch nach wie vor nicht möglich. Aus diesem Grund – aber auch vor dem Hintergrund, dass wichtige Zwischenziele erreicht sind – entschied das Initiativkomitee für ein E-Voting-Moratorium, die Unterschriftensammlung abzubrechen.Vom 21. März bis zum 31. Mai 2020 galt ein Fristenstillstand für Volksinitiativen: Das Sammeln für Unterschriften war in dieser Zeit verboten. Seit dem 1. Juni dürfte man theoretisch wieder sammeln. Allerdings erweist sich das Schutzkonzept der Bundeskanzlei als wenig praxistauglich, wie auch die Staatspolitische Kommission des Nationalrats feststellen musste (vgl. Communiqué vom 29.5.2020).Nachdem bereits die Hälfte der Unterschriften für die Initiative «für eine sichere und vertrauenswürdige Demokratie» gesammelt war, musste die Unterschriftensammlung infolge des Lockdowns unterbrochen werden. Ein Zustandekommen der Volksinitiative in der verbleibenden Zeit und mit den erforderlichen Schutzkonzepten ist nur mit unverhältnismässigem Aufwand möglich und damit in Frage gestellt. Darum beschloss das Initiativkomitee, die Unterschriftensammlung einzustellen.E-Voting-Moratorium ist zwingend Seitens der Bundesverwaltung, aber auch gewisser Kantone wird seit einigen Jahren angestrebt, die Stimmabgabe auch via E-Voting zu ermöglichen. Die zur Verfügung stehenden Systeme führten immer wieder zu Pannen und damit auch zu Diskussionen über die Tauglichkeit des Versuchsbetriebs. Lange Zeit wurden die berechtigten Bedenken, dass die Systeme nicht fälschungssicher sind, nicht ernst genommen. Vor diesem Hintergrund entschloss sich das Initiativkomitee für ein E-Voting-Moratorium, die genannte Initiative zu lancieren.Besteht nicht absolute Sicherheit, darf kein E-Voting eingeführt werden, da sonst das Vertrauen in die Abstimmungsergebnisse und damit die direkte Demokratie nicht mehr vorhanden wäre. Mittlerweile haben die Behörden diese Schwachstellen glücklicherweise erkannt und selber ein Moratorium beschlossen. Damit sind wichtige Zwischenziele des Initiativkomitee erreicht.Zwischenziele sind erreicht Mit parlamentarischen Vorstössen und politischem Druck gelang es den Vertretern des Initiativkomitees, in den vergangenen Monaten etliche Entscheide zu bewirken. Folgende Punkte sind festzuhalten:Die Pannenanfälligkeit und Fehlerhaftigkeit von E-Voting-Abstimmungen ist mittlerweile breit anerkannt. Verschiedene Versuche sind mittlerweile eingestellt worden. An seiner Sitzung vom 26. Juni 2019 hat der Bundesrat entschieden, vorläufig auf die Überführung der elektronischen Stimmabgabe in den ordentlichen Betrieb zu verzichten (vgl. Communiqué der Bundeskanzlei vom 27.6.2019).Die Versuche haben gezeigt, dass Abstimmungen via E-Voting für die Stimmbürger weder einfacher sind noch zu einer Erhöhung der Stimmbeteiligung führen. Auch vor diesem Hintergrund tun die Behörden gut daran, die Rahmenbedingungen für den Versuchsbetrieb noch einmal zu überdenken.Am 9. Dezember 2019 hat der Nationalrat der Parlamentarischen Initiative Zanetti (18.468) für einen Marschhalt beim E-Voting Folge gegeben. Damit bekräftigte auch die Mehrheit des Nationalrats, dass das E-Voting noch einmal grundsätzlich zu überdenken ist. Der Vorstoss liegt derzeit beim Ständerat.Initiativkomitee behält sich Neulancierung vor Sollte der Versuchsbetrieb neu aufgenommen werden und sich die Systeme nach wie vor als nicht fälschungssicher erweisen, behält sich das Initiativkomitee vor, die Initiative neu zu lancieren. Sichere Volksabstimmungen und Wahlen, deren Resultate korrekt, fälschungsfrei und damit vertrauenswürdig sind, sind für die direkte Demokratie der Schweiz eine zwingende Voraussetzung.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
