["https://e-voting-moratorium.ch/e-voting-aus-schaffen-sie-transparenz-liebe-post"]
title = "E-Voting-Aus: Schaffen Sie Transparenz, liebe Post! | E-Voting-Moratorium │ Volksinitiative"
full_description = "E-Voting-Aus: Schaffen Sie Transparenz, liebe Post!Jul 9, 2019 | Aktuelles DENachdem der Kanton Genf vor Kurzem den vorzeitigen, sofortigen Rückzug seines E-Voting-Systems bekannt gab, hat vor einigen Tagen die Schweizerische Post nachgezogen: Sie zieht ihrem E-Voting-System per sofort den Stecker, kündigt aber sogleich an, an einem neuen System zu arbeiten. Die Art und Weise, wie die Post ihren Rückzug kommuniziert, wirft Fragen auf und sät Misstrauen.Eine Institution, die mit ihrem E-Voting-System einen demokratischen Stimmkanal vertrauenswürdig betreiben will, muss höchsten Anforderungen genügen. Vertrauen ist die wichtigste Voraussetzung, die ein sog. «Demokratie-Dienstleister» erfüllen muss. Wie kann sich dann ein CEO der Post zitieren lassen, er selbst habe über die Einstellung des aktuellen Systems entschieden, wo doch die NZZ am Sonntag vom 7. Juli berichtet, dass dieses laut Bundeskanzlei «die bundesrechtlichen Anforderungen derzeit nicht erfüllt?»Wie kann die Post so unverfroren sein, mit ihrer Medienkommunikation den Eindruck zu vermitteln, der E-Voting-Rückzug sei freiwillig geschehen? Wo doch bereits etliche Sicherheitslücken aufgedeckt worden sind und selbst die Bundeskanzlei ihre Zweifel nicht mehr verbergen kann? Wenn eine Institution, die mit ihrem E-Voting-System einen demokratischen Stimmkanal vertrauenswürdig betreiben will, nicht ehrlich und transparent informieren kann, ist sie dafür unqualifiziert. Die erneut schleierhafte Kommunikation der Schweizerischen Post verstärkt die Unsicherheit der Bevölkerung noch mehr.Absolut unhaltbar ist auch, dass die Post die Zusammenarbeit mit der höchst umstrittenen Firma Scytl fortsetzen will und in völlig irrationaler Weise sämtliche berechtigte Kritik an diesem US-amerikanisch-spanischen Konzern zu ignorieren scheint. Wenn die Post das Vertrauen nicht gänzlich verspielen will, ist jetzt umfassende Transparenz nötig. Die Bundeskanzlei fordern wir auf, sämtliche Untersuchungsberichte (Audit) zum E-Voting-System der Post zu veröffentlichen.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2019
