["https://e-voting-moratorium.ch/die-post-taeuscht-die-oeffentlichkeit-erneut"]
title = "Die Post täuscht die Öffentlichkeit erneut | E-Voting-Moratorium │ Volksinitiative"
full_description = "Die Post täuscht die Öffentlichkeit erneutAug 23, 2019 | Aktuelles DEDie direkte Demokratie lebt von unserem Vertrauen. Doch erneut täuscht die Post die Öffentlichkeit und beweist damit endgültig, dass sie das Vertrauen der Bürgerinnen und Bürger nicht verdient.Laut einer Meldung von Keystone-SDA habe die Post den Kantonen bereits eine neue Lösung vorgeschlagen, wie ihr E-Voting-System in Zukunft wieder zum Einsatz kommen könne. «Die Kantone wollen eine schnelle Lösung», so Post-CEO Cirillo. Ebenso ist erneut zu lesen, dass die Post ihr System im Juli aus eigener Entscheidung gestoppt habe.Die Post suggeriert, sie habe in weniger als drei Monaten ein neues System aufgebaut. Dies zu behaupten ist schlicht unmöglich, unglaubwürdig und unseriös. Es existiert kein «neues System». Dieses System ist dasselbe, in welchem kritische Fehler gefunden wurden. Zudem: Das bisherige System der Post wurde auch nicht aus eigener Entscheidung gestoppt. Es ist vielmehr beim Test der Bundeskanzlei durchgefallen, woraufhin diese den Einsatz dieses Systems untersagte.«Mit dieser abermals irreführenden Kommunikation spielt die Post weiterhin mit dem Vertrauen der Bevölkerung und untergräbt jenes endgültig», so SVP-Nationalrat Franz Grüter.Sichere E-Voting-Systeme sind auf dem heutigen Stand der Technik ein Ding der Unmöglichkeit. Wir fordern nach wie vor, dass sich die Post ihrer Verantwortung gegenüber der Demokratie bewusst wird, diese wahrnimmt und endlich vollständig transparent, ehrlich und offen kommuniziert und handelt. Die Zusammenarbeit mit dem spanischen Software-Lieferanten Scytl ist per sofort zu beenden.«Das Totalversagen der Post in Sachen E-Voting soll nun durch Fake News kaschiert werden. Das Verhalten der Post ist unserer Demokratie nicht würdig», so Kampagnenleiter Nicolas A. Rimoldi.Die historisch breite Allianz, die das ganze politische Spektrum abdeckt, kämpft weiterhin für eine sichere und vertrauenswürdige Demokratie. Die Unterschriftensammlung wird mit Hochdruck fortgesetzt.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2019
