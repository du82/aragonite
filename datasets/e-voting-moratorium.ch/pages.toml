["https://e-voting-moratorium.ch"]
title = "E-Voting-Moratorium │ Volksinitiative | Für eine sichere und vertrauenswürdige Demokratie"
description = "«Erfahrungen aus vielen Ländern zeigen, dass E-Voting-Systeme interessante Angriffsziele für Hacker und Grossmächte sind. Werden Wahlen und Abstimmungen manipuliert, so gefährdet dies das Vertrauen in unsere Demokratie.» Franz GrüterNationalrat / Unternehmer (LU)"
full_description = "Volksinitiative für ein E-Voting MoratoriumLockdown erzwingt Abbruch der SammelaktivitätenWichtige Zwischenziele bereits erreichtBern, 22. Juni 2020Infolge des neuen Corona-Virus beschloss der Bundesrat diverse Massnahmen, die neben Gewerbebetrieben auch Initiativkomitees direkt betrafen. Abstandsregeln, Hygienevorschriften und Veranstaltungsverbote verunmöglichten das Sammeln von Unterschriften. Auch wenn die Einschränkungen nun schrittweise gelockert werden, sind Unterschriftensammlungen faktisch nach wie vor nicht möglich. Aus diesem Grund – aber auch vor dem Hintergrund, dass wichtige Zwischenziele erreicht sind – entschied das Initiativkomitee für ein E-Voting-Moratorium, die Unterschriftensammlung abzubrechen.>> Zur Medienmitteilung.testimon { opacity: 0; position: absolute; visibility: hidden; width: 100%; } .testimon p { -ms-hyphens: auto; -webkit-hyphens: auto; hyphens: auto; } .testimonOff { position: absolute !important; opacity: 0; visibility: hidden; transition: all 1s ease-in-out; } .testimonOn { position: relative !important; visibility: visible; opacity: 10; transition: all 1s ease-in-out; } .testimon .et_pb_testimonial_description_inner { min-height: 200px; } @media all and (min-width: 480px) { .testimon .et_pb_testimonial_description_inner { min-height: 180px; } } @media all and (min-width: 768px) { .testimon .et_pb_testimonial_description_inner { min-height: 500px; } } @media all and (min-width: 980px) { .testimon .et_pb_testimonial_description_inner { min-height: 360px; } } @media all and (min-width: 1350px) { .testimon .et_pb_testimonial_description_inner { min-height: 260px; } } .testimon .et_pb_testimonial_description { margin-left: 0 !important; } «Erfahrungen aus vielen Ländern zeigen, dass E-Voting-Systeme interessante Angriffsziele für Hacker und Grossmächte sind. Werden Wahlen und Abstimmungen manipuliert, so gefährdet dies das Vertrauen in unsere Demokratie.» Franz GrüterNationalrat / Unternehmer (LU) «E-Voting gefährdet unnötigerweise die Sicherheit unserer einzigartigen Demokratie. Nur unsere Initiative ermöglicht den Bürgerinnen und Bürgern zu entscheiden, ob sie das Risiko E-Voting überhaupt wollen.» Nicolas A. RimoldiStudent / Mitglied Jungfreisinnige (LU) «Hacking bedroht unsere Daten, unsere Abstimmungen und unsere Demokratie. E-Voting muss gestoppt werden, bis es irgendwann sicher genug sein wird.» Prisca KollerKantonsrätin / Volkswirtin (ZH) «E-Voting gefährdet das Vertrauen der StimmbürgerInnen. Denn sie sind gezwungen, die Kontrolle über den Ablauf von Wahlen und Abstimmungen sowie die Auszählung an Experten und Privatunternehmen zu delegieren.» Jean Christophe SchwaabGemeinderat / alt Nationalrat (VD) «Abstimmungen müssen nicht nur den Gewinner ermitteln. Ebenso wichtig ist, dass das Resultat von den Verlierern akzeptiert wird. Die Zweifel, welche durch E-Voting geschürt werden, rütteln an diesem Fundament der Demokratie.» Balthasar GlättliNationalrat / Fraktionschef (ZH) «E-Voting muss genauso sicher und überprüfbar sein wie das traditionelle Abstimmen an der Urne. Wir dürfen unsere direkte Demokratie nicht gefährden, bloss weil E-Voting bequem und modern wirkt.» Martin SteigerRechtsanwalt (ZH) «E-Voting gefährdet das Vertrauen in die Demokratie, denn es erlaubt, Misstrauen in Endergebnisse einfach und günstig zu streuen.» Claudio LuckChaos Computer Club (TI)«Die Vorkommnisse in Genf sowie die Scytl-Erfahrungen zeigen: E-Voting ist mitnichten so sicher wie die schriftliche Urnenabstimmung. Nicht nur wegen Hacking-Gefahren. Auch die zentrale, IT-basierte Organisation (statt dezentraler Urnen in jedem Wahlkreis) birgt Risiken, die das Vertrauen in die direkte Demokratie kaum fördern. Daher ist E-Voting der Stecker zu ziehen, um die freie Demokratie zu retten!» Artur TerekhovJSVP ZH / Inh. AT Recht Steuern (ZH)«Die Sicherheit unserer Demokratie ist seit Jahren nicht gewährleistet. Nachweislich unsichere E-Voting-Systeme sind im Einsatz. Das ist fahrlässig und fordert uns zum Handeln auf.» Nik GuggerNationalrat EVP (ZH)«Das Vertrauen in die Demokratie und die Abstimmungskanäle sind ein zentraler Punkt für die politische Stabilität der Schweiz. Niemand zweifelt Abstimmungen oder Wahlen auf Grund von infrage gestellten Stimmabläufen an und dies muss für die Schweiz auch so bleiben.» Remo ZuberbühlerPräsident Junge BDP Schweiz«E-Voting klingt zwar toll und fortschrittlich. Doch die Gefahren dahinter bedrohen den Kern unserer wertvollen direkten Demokratie.» Dominic TäubertCo-Präsident Junge EVP Schweiz«Ich wehre mich gegen gefährliche Experimente mit unserer Demokratie. Wir brauchen ein Moratorium, solange E-Voting keine sicheren Abstimmungen garantieren kann.» Ronja JansenPräsidentin Juso Schweiz«Ich habe nichts gegen E-Voting. Aber wir sind bezüglich Sicherheit einfach noch nicht dort wo wir sein sollen.» David TrachselPräsident Junge SVP Schweiz"
year_published = 2025
