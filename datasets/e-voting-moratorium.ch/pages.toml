["https://e-voting-moratorium.ch/neue-e-voting-bewilligung-die-initianten-der-volksinitiative-fuer-ein-e-voting-moratorium-sind-entsetzt"]
title = "Neue E-Voting Bewilligung – Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetzt | E-Voting-Moratorium │ Volksinitiative"
full_description = "Neue E-Voting Bewilligung – Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetztAug 16, 2023 | Aktuelles DENeue E-Voting Bewilligung für die nationalen Wahlen 2023 – Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetztDer Bund hat heute den Einsatz von E-Voting an den Nationalratswahlen 2023 bewilligt. Zahlreiche Initianten der «Volksinitiative für ein E-Voting Moratorium» sind entsetzt über diesen Entscheid. Die Risikoeinschätzung der Bundeskanzlei und die Argumentarien des Bundesrats können nicht nachvollzogen werden. Eine Neu-Lancierung der Initiative wird deshalb geprüft.An den Hauptargumenten gegen E-Voting hat sich in den letzten Jahren nichts geändert:E-Voting muss genauso sicher und überprüfbar sein wie das traditionelle Abstimmen an der Urne. Doch überprüfbar ist für den gewöhnlichen Bürger nichts mehr, denn weder die Kryptografie noch Programmcodes sind allgemein verständlich.Unsere direkte Demokratie wird gefährdet, denn die Resultate sind nur so vertrauenswürdig wie irgendwelche Systeme und Lieferanten.Das Abstimmen und Wählen wird weder einfacher, noch effizienter, noch günstiger. Aktuell wird mindestens beim Preis eine Dumpingpolitik der Post betrieben, um den «Markt» zu penetrieren.Einige Zitate von Komiteemitgliedern der «Volksinitiative für ein E-Voting Moratorium» zur freien Verwendung:Jorgo Ananiadis, Präsident der Piratenpartei Schweiz: «Die Multimillionen an Steuergeldern die mit E-Voting verbraten werden, wären bei anderen Digitalisierungsprojekten viel effizienter und sinnvoller eingesetzt.»Nicolas A. Rimoldi, Kampagnenleiter der Initiative: «Das Vertrauen der Bevölkerung in die Demokratie darf nie durch unsichere E-Voting-Systeme riskiert werden.»Jean Christophe Schwaab: «E-Voting gefährdet das Vertrauen der StimmbürgerInnen. Denn sie sind gezwungen, die Kontrolle über den Ablauf von Wahlen und Abstimmungen sowie die Auszählung an Experten und Privatunternehmen zu delegieren.»Philippe (Pipo) Burger, Vize-Präsident Piratenpartei Schweiz: «Dieses Experiment an unserer Demokratie ist unnötig, teuer und wird das Vertrauen in die Demokratie untergraben.»"
year_published = 2023
