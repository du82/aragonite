["https://e-voting-moratorium.ch/durchbruch-nationalrat-will-e-voting-versuchsbetrieb-stoppen"]
title = "Durchbruch: Nationalrat will E-Voting-Versuchsbetrieb stoppen | E-Voting-Moratorium │ Volksinitiative"
full_description = "Durchbruch: Nationalrat will E-Voting-Versuchsbetrieb stoppenDez 10, 2019 | Aktuelles DEGrosser Durchbruch für die historisch breite Allianz, die in der Schweiz ein E-Voting-Moratorium erreichen will: Der Nationalrat stimmte einem Vorstoss von Claudio Zanetti deutlich zu und sprach sich für einen Abbruch von E-Voting-Versuchsbetrieben aus. Das Initiativkomitee für ein E-Voting-Moratorium wird den Druck mit der Volksinitiative aufrechterhalten und zählt nun auf den Ständerat, unsicheren und nicht vertrauenswürdigen E-Voting-Systemen ebenfalls den Stecker zu ziehen.Erfreut stellen wir fest, dass die Argumente unseres Initiativkomitees im neugewählten Nationalrat von immer mehr Volksvertretern geteilt werden. Es macht Mut, dass sich die Ansicht durchsetzt, dass unsere einzigartige direkte Demokratie keinen Experimenten ausgesetzt werden darf.«Bevor der E-Voting-Testbetrieb fortgesetzt wird, muss der Bundesrat zuerst nachweisen, dass die bestehenden Sicherheitsprobleme gelöst sind», sagt Nationalrat Franz Grüter, der das Initiativkomitee für ein E-Voting-Moratorium präsidiert.Nicolas A. Rimoldi, Kampagnenleiter des Initiativkomitees, zum Entscheid des Nationalrats: «Das Vertrauen der Bevölkerung in die Demokratie darf nie wieder durch unsichere E-Voting-Systeme riskiert werden.»Bedenklich ist nach wie vor das Gebaren der schweizerischen Post. Trotz anhaltender Kritik will die Post an nachweislich unsicheren Systemen festhalten. Umso notwendiger ist es, die Unterschriftensammlung mit vollem Elan voranzutreiben. Letztlich bietet die Volksinitiative für ein E-Voting-Moratorium die beste Garantie, dass keine unsicheren und intransparenten E-Voting-Systeme das Vertrauen der Bevölkerung in die Demokratie gefährden können.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2019
