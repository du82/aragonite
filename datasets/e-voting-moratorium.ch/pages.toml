["https://e-voting-moratorium.ch/e-versand-statt-e-voting-spk-s-verpasst-klares-signal"]
title = "E-Versand statt E-Voting: SPK-S verpasst klares Signal | E-Voting-Moratorium │ Volksinitiative"
full_description = "E-Versand statt E-Voting: SPK-S verpasst klares SignalFeb 1, 2020 | Aktuelles DEDie Staatspolitische Kommission des Ständerats (SPK-S) lehnt die Motion Zanetti «E-Versand statt E-Voting» einstimmig ab. Dieser Entscheid ist unverständlich, steht er doch in diametralem Widerspruch zur Haltung des Nationalrats, welcher der Motion im Juni 2019 mit 115 zu 68 Stimmen klar zugestimmt hatte. Die Motion hätte einer überfälligen und gleichzeitig praktikablen Lösung, damit Auslandschweizer besser an demokratischen Prozessen teilnehmen können, das Feld geebnet.Speziell die Begründung der Kommission, die «Sicherheit des elektronischen Versandes» von Abstimmungsmaterial an Auslandschweizer sei «nicht ausreichend gewährleistet», erstaunt – suggeriert diese Formulierung doch, dass E-Voting im Gegensatz sicher sei. Die Erkenntnis, dass jene E-Voting-Systeme, die in der Schweiz bisher im Einsatz gestanden sind, beträchtliche Sicherheitslücken aufweisen, wird mittlerweile quer durch alle Parteien geteilt. Der Handlungsbedarf, dass der Devise «Sicherheit vor Tempo» am besten Rechnung getragen wird, wenn die bestehenden Testphasen beendet werden, wird breitestens anerkannt. Deshalb steht der Entscheid der SPK-S völlig quer in der Landschaft.Nicolas A. Rimoldi, Kampagnenleiter des Initiativkomitees, zum Entscheid der SPK-S: «Es ist sehr enttäuschend, verweigert die SPK-S, den Auslandsschweizern eine sichere und funktionierende Alternative zum nachweislich nicht vertrauenswürdigen E-Voting.»Die E-Voting-Moratoriums-Initianten bieten Hand für ein E-Voting-System, das sicher vor Manipulationsangriffen ist. Die erste Voraussetzung ist aber, sichere Alternativen für Auslandschweizer anzubieten und die bestehenden E-Voting-Systeme zu beerdigen. Der Rückschlag durch die SPK-S zeigt auf, dass es nun umso notwendiger ist, die Unterschriftensammlung mit vollem Elan voranzutreiben. Letztlich bietet die Volksinitiative für ein E-Voting-Moratorium die beste Garantie, dass keine unsicheren und intransparenten E-Voting-Systeme die Demokratie gefährden können.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2020
