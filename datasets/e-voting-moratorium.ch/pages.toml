["https://e-voting-moratorium.ch/e-voting-im-vergleich-zur-brief-und-urnenabstimmung"]
title = "E-Voting im Vergleich zur Brief- und Urnenabstimmung | E-Voting-Moratorium │ Volksinitiative"
full_description = "E-Voting im Vergleich zur Brief- und UrnenabstimmungFeb 4, 2019In der öffentlichen Auseinandersetzung wurde die Volksinitiative «Für eine sichere und vertrauenswürdige Demokratie (E-Voting-Moratorium)» wie folgt kritisiert: Wer fordert, dass «die gleiche Sicherheit gegen Manipulationshandlungen wie bei der handschriftlichen persönlichen Stimmabgabe an der Urne» zu gewährleisten sei, müsste korrekterweise auch das briefliche Abstimmen verbieten. Dieses bietet nachgewiesenermassen nicht die gleiche Sicherheit wie die persönliche Stimmabgabe. Sind sich die Initianten dieser (logischen) Konsequenz bewusst? Und würden sie das wollen? Gerne nehmen wir dazu Stellung:Dieser Vergleich hinkt: Brief- und Urnenwahl unterscheiden sich in der Schweiz ausser bei der Übermittlung des Stimmzettels nicht wesentlich. Die Briefwahl erlaubt es jedoch, zeitlich flexibel abzustimmen. Beide Stimmkanäle haben miteinander gemein, dass das Wahlbüro und gewählte Stimmenzähler für den korrekten Ablauf der Auszählung sorgen, nachdem das Stimmcouvert bei den Gemeinden angekommen ist. Sie überwachen die Meldung des ermittelten Resultats sowie die Versiegelung der Stimmzettel und Stimmrechtsausweise für eine allfällige Nachzählung.Für eine Manipulation müssten sich alle beteiligten Personen verbünden. Die paritätische Zusammensetzung dieser Gruppe, die die Vielfalt des Politspektrums widerspiegelt, verhindert einen solchen Betrug. Durch die dezentralen Auszählungen in den Gemeinden blieben die verfälschenden Auswirkungen zudem beschränkt. Bei E-Voting hingegen geschieht der Auszählungsvorgang zentral. Aktuell sind in der Schweiz nur zwei Systeme im Einsatz: das vom Kanton Genf entwickelte CHVote (in den Kantonen Genf, Basel-Stadt, Bern, Luzern, St. Gallen und Aargau) sowie das System der Post, entwickelt vom spanischen Hersteller Scytl (Freiburg und Neuenburg). Das Genfer System wird per 2020 eingestellt.Im Unterschied zur Urnen- oder Briefwahl gibt es beim E-Voting keine Stimmenzähler, Wahlbeobachterinnen oder «Experten», die einen korrekten Ablauf und eine Nachzählung – unter Wahrung des Stimmgeheimnisses – gewährleisten könnten. Aus diesem Grund kann und muss die abstimmende Person überprüfen können, ob ihre Stimme korrekt im Schlussresultat berücksichtigt ist. Es muss zudem auch möglich sein, sicherzustellen, dass niemand ausser den Wahlberechtigten abgestimmt hat.Demokratische Entscheidungen haben eine sehr hohe Akzeptanz, weil alle sich an der Entscheidung beteiligen können und das Entscheidungsverfahren nachvollziehbar ist. Diese beiden Elemente zusammen garantieren, dass selbst kontroverse Entscheidungen von den Gewinnern und Verlierern akzeptiert werden.Wie bei der Urnen- oder Briefwahl ist dies beim eVoting nur dann gegeben, wenn alle den Ablauf verstehen. Dies bedeutet konkret, dass eine per E-Voting abstimmende/wählende Person – und nur sie – einfach und selber nachvollziehen können muss, dass ihr Stimm-/Wahlentscheid korrekt im Schlussresultat berücksichtigt worden ist. Dadurch bleibt das Stimmgeheimnis gewahrt und das korrekte Funktionieren der Wahlplattform kann von den BürgerInnen selbst festgestellt werden. Dies ist wichtig, da im Gegensatz zur Wahl an der Urne oder per Post die Stimmcouverts und Wahlzettel von der Öffnung und Auszählung bis zur Versiegelung (für eine allfällige Nachzählung) nicht von Stimmenzählern und Wahlbeobachtern verfolgt werden können. Die Auszählung findet nicht mehr in den Gemeinden, sondern in zentralen Systemen statt. Ein Fehler oder eine Manipulation hätte deutlich weitreichendere Folgen.Neue E-Voting Bewilligung – Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetztAug 16, 2023Neue E-Voting Bewilligung für die nationalen Wahlen 2023 - Die Initianten der Volksinitiative für ein E-Voting Moratorium sind entsetzt Der Bund hat heute den Einsatz von E-Voting an den Nationalratswahlen 2023 bewilligt. Zahlreiche Initianten der «Volksinitiative für...mehr lesenErfolg der Initiative: Bund anerkennt Komplexität von E-Voting und will Lehren aus der Vergangenheit ziehenJun 23, 2020Die Bundeskanzlei hat angekündigt, den Versuchsbetrieb für E-Voting neu auszurichten und darauf wertzulegen, dass E-Voting-Systeme «höchsten Sicherheitsanforderungen genügen» müssten. Das Initiativkomitee begrüsst die Absichten der Bundeskanzlei, aus der mit Pleiten,...mehr lesenVolksinitiative für ein E-Voting Moratorium: Lockdown erzwingt Abbruch der SammelaktivitätenJun 22, 2020Infolge des neuen Corona-Virus beschloss der Bundesrat diverse Massnahmen, die neben Gewerbebetrieben auch Initiativkomitees direkt betrafen. Abstandsregeln, Hygienevorschriften und Veranstaltungsverbote verunmöglichten das Sammeln von Unterschriften. Auch wenn die...mehr lesen"
