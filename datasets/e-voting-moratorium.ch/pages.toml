title = "Post-Debakel: Nur E-Voting-Moratorium schafft Sicherheit | E-Voting-Moratorium │ Volksinitiative"
full_description = "Post-Debakel: Nur E-Voting-Moratorium schafft SicherheitMrz 29, 2019 | Aktuelles DEDie folgenschweren Enthüllungen zeigen endlich Wirkung: Die Schweizerische Post kündigt an, ihr E-Voting-System «befristet auszusetzen». Das Initiativkomitee für ein E-Voting-Moratorium begrüsst, dass bei der Post langsam aber sicher die Einsicht einkehrt, dass ihr System gravierende Fehler enthält. Gleichzeitig kritisieren wir, dass die Missstände weiterhin verharmlost werden und die elektronische Stimmabgabe nicht ganz eingestellt wird.Medienmitteilung im PDF herunterladenDass die Schweizerische Post anerkennt, dass die Integrität von Abstimmungen und Wahlen für sie «oberste Priorität» hat und ihr E-Voting-System deshalb für die eidgenössische Volksabstimmung vom 19. Mai 2019 «aus dem Verkehr» zieht, ist ihr hoch anzurechnen. Es darf aber nicht vergessen werden: Es brauchte gewaltigen Druck und wasserdichte Enthüllungen namhafter Sicherheitsexperten, bis die Post zur Einsicht kam.Etliche brisante Fragen bleiben offen: Wie würde die Post wohl heute kommunizieren, hätte es den Druck aus der IT-Szene und durch die Volksinitiative für ein E-Voting-Moratorium nicht gegeben? Weshalb zieht die Post ihr System vorübergehend zurück, während sie gleichzeitig behauptet, Manipulationen könnten ausgeschlossen werden und es seien im Intrusionstest nur kleinere Fehler («Best Practices») gefunden worden? Die Post wurde nie müde zu beteuern, dass ihre Systeme sicher seien. Jetzt zeigt sich überdeutlich, dass dies klare Falschaussagen waren.Dass die Post den Intrusionstest unter diesen Umständen als Erfolg verkauft, ist ein Hohn – wurden die gravierenden Fehler doch ausserhalb dieses Tests aufgedeckt. Eine fragwürdige Rolle spielt dabei auch die KPMG, welche das E-Voting-System der Post zertifiziert hatte. Dienten ihre Zertifizierungen bloss als Feigenblatt? Um Transparenz zu schaffen, verlangen wir die Offenlegung der unter Verschluss gehaltenen Zertifizierungsberichte.Eine befristete Aussetzung von E-Voting genügt nicht. Nur ein in der Bundesverfassung verankertes E-Voting-Moratorium würde die Grundlagen schaffen, an einer absolut sicheren E-Voting-Lösung zu forschen. Die Sicherheit der direkten Demokratie muss wieder hergestellt werden.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2019
