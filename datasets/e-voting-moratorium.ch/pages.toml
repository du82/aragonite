["https://e-voting-moratorium.ch/alle-oeffentlichen-sammelaktivitaeten-per-sofort-pausiert"]
title = "Alle öffentlichen Sammelaktivitäten per sofort pausiert | E-Voting-Moratorium │ Volksinitiative"
full_description = "Alle öffentlichen Sammelaktivitäten per sofort pausiertMrz 16, 2020 | Aktuelles DEMedienmitteilung: Das Initiativkomitee «für eine sichere und vertrauenswürdige Demokratie (E-Voting-Moratorium)» folgt den Empfehlungen des Bundesrats und des Bundesamts für Gesundheit und beschliesst, umgehend alle öffentlichen Sammelaktivitäten bis auf Weiteres einzustellen.Um die Sicherheit der Bevölkerung nicht einem weiteren gesundheitlichen Risiko auszusetzen, werden jegliche öffentliche Sammelaktivitäten (Standaktionen, Unterschriftensammlungen an öffentlich zugänglichen Orten) bis Ende April 2020 vollumfänglich eingestellt. Obschon durch diese drastische Massnahme die Zielerreichung, bis am 12. September 2020 die Unterschriftensammlung erfolgreich abzuschliessen, gefährdet ist, erachten wir diesen Entscheid als die einzig richtige Massnahme, um unseren Beitrag zur Eindämmung der Pandemie zu leisten.Zudem fordern wir den Bundesrat eindringlich auf, die Sammelfrist für alle laufenden Initiativen und Referenden zu verlängern, damit die demokratischen Grundrechte der Schweizerinnen und Schweizer keinen Schaden nehmen.Das Initiativkomitee wird zu einem späteren Zeitpunkt entscheiden, welche Massnahmen notwendig sind, die Volksinitiative erfolgreich zustande zu bringen. Der Entscheid, die Sammelaktivitäten stillzulegen, fällt uns alles andere als leicht. Er ist jedoch notwendig – die Sammelaktivität fortzusetzen wäre nicht zu verantworten.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
