title = "Argumente | E-Voting-Moratorium │ Volksinitiative"
full_description = "ArgumenteTrotz Sicherheitslücken und Warnungen von Experten will der Bundesrat E-Voting flächendeckend einführen. Dabei ist die elektronische Stimmabgabe zurzeit eine grosse Gefahr für die direkte Demokratie: Die Schweiz wird ein interessantes Angriffsziel für staatliche und nicht staatliche Hacker. Und ist das Vertrauen in unsere Abstimmungs- und Wahlsysteme einmal gebrochen, gibt es kein Zurück mehr. Darum ziehen wir jetzt gemeinsam die Notbremse. Argumentarium herunterladen (PDF, 9 Seiten)E-Voting: Worum geht es?E-Voting (elektronische Stimmabgabe oder «Vote électronique») bedeutet, dass die Stimmbürgerinnen und Stimmbürger übers Internet abstimmen können. Die elektronische Teilnahme an Wahlen spielte hierzulande bislang nur eine untergeordnete Rolle. In der Schweiz treiben Bund und Kantone Projekte zur Einführung von E-Voting seit dem Jahr 2000 voran. 2004 kam E-Voting erstmals bei einer eidgenössischen Abstimmung versuchsweise zum Einsatz. Als Pionier-Kanton profilierte sich Genf, das ein eigenes E-Voting-System entwickelte und beherbergt (es aber per 2020 «aus Kostengründen» aufgibt), dem sich verschiedene andere Kantone angeschlossen haben. Das zweite, von mehreren Kantonen genutzte System wird von der Schweizerischen Post getragen (welche ihr Kernsystem bei einer ausländischen Firma einkaufte). Per Anfang 2019 waren es 14 Kantone, die E-Voting in irgendeiner Form getestet haben.Zur «Chronik E-Voting in der Schweiz» (Bundeskanzlei)Wie funktioniert E-Voting?Diejenigen Stimmberechtigten, die elektronisch abstimmen können, erhalten zusätzlich zu den ordentlichen Abstimmungsunterlagen in einem Couvert mehrere Zugangscodes auf Papier. Je nach Kanton müssen sich die Stimmberechtigten allenfalls vorgängig festlegen, mit welchem Kanal sie abstimmen wollen. Mit einem ersten Code können sie sich im Internet ins Abstimmungssystem einloggen. Hat man sich erfolgreich eingeloggt, kann man dort zur jeweils aktuellen Abstimmungsvorlage seine Stimme per Mausklick abgeben. Nach der Stimmabgabe kann verifiziert werden, ob die abgegebene Ja- oder Nein-Stimme richtig ans System übermittelt wurde. Zum Schluss wird die Registrierung der abgegebenen Stimme mit einem «Finalisierungscode» bestätigt.Das Abstimmen wird nicht einfacherSie sehen: Der Abstimmungsprozess bei E-Voting ist nicht etwa einfacher, günstiger oder zeitsparender. Die Unterlagen müssen nach wie vor per Post verschickt werden und der Stimmberechtigte muss sich die Zeit nehmen, das Couvert zu öffnen und sich mit den Codes am Computer einzuloggen. E-Voting ist womöglich für viele Bürger um Einiges komplizierter als die briefliche Stimmabgabe. Der einzige objektive Vorteil besteht darin, seine Stimme bei einer Abstimmung orts- und zeitunabhängig abgeben zu können.Wer kann E-Voting nutzen?Die Kantone legen selber fest, von wem E-Voting genutzt wird. In der Hälfte jener 10 Kantone, die E-Voting gegenwärtig anbieten, steht diese Möglichkeit zurzeit ausschliesslich den Auslandschweizern offen. Je nach Kanton steht E-Voting auch ausgewählten Gemeinden offen. Dabei ist die Zahl der E-Voting-Teilnehmer gesetzlich (noch) begrenzt: Nicht mehr als 30 Prozent (System des Kantons Genf) beziehungsweise 50 Prozent (System der Post) der gesamten Stimmberechtigten eines Kantons dürfen E-Voting bei einer Volksabstimmung nutzen.Bund drückt aufs TempoDer Bund gibt vor, bei E-Voting die Devise «Sicherheit vor Tempo» zu vertreten. Seit bald 20 Jahren in der Testphase, will der Bund dieses Tempo nun drastisch erhöhen. So hat der Bundesrat im Dezember 2018 beschlossen, E-Voting als dritten ordentlichen Stimmkanal verankern zu wollen (nebst der Brief- und Urnen-Abstimmung). Obwohl es in der Testphase zu zahlreichen Ungereimtheiten gekommen ist, habe sich E-Voting bewährt und könne als «sicher und vertrauenswürdig» erachtet werden. Schon 2017 verkündete die Bundeskanzlei deshalb ihr Ziel, dass E-Voting bis zu den eidgenössischen Wahlen 2019 in zwei Dritteln der Kantone zum Einsatz kommen soll. Die dafür nötigen gesetzlichen Grundlagen sind allerdings erst seit Ende 2018 in der Vernehmlassung, nachdem die «E-Voting-Moratoriums-Initiative» angekündigt wurde.Das Initiativkomitee zeigt sich äusserst beunruhigt darüber, mit welcher Naivität und Blauäuigkeit eidgenössische und kantonale Behörden aller berechtigter Opposition zum Trotz stur an der Einführung von E-Voting festhalten wollen.Bund ignoriert SchwachstellenImmer mehr Politiker und Computer-Experten – aber vor allem auch gewöhnliche Bürger, die den technologischen Fortschritt ansonsten begrüssen – hinterfragen den Nutzen von E-Voting. Zu gross sind die Sicherheitsbedenken. Zu gross die Demokratie- und Vertrauensdefizite. Dieses Misstrauen erreichte seinen Höhepunkt, als Hacker des Chaos Computer Clubs im November 2018 eine Sicherheitslücke im Genfer E-Voting-System aufgedeckt hatten. Schon zuvor wurden Pannen publik. Der Kanton Genf kommunizierte in der Folge Ende November, dass er sein System 2020 einstampfen werde. Der vorgebliche Grund: Diejenigen Kantone, die das Genfer System genutzt haben, hätten sich nicht finanziell stärker beteiligen wollen. Wie es mit E-Voting in diesen Kantonen weiter geht, ist noch offen. Traurige Gewissheit aber ist, dass die Promotoren der elektronischen Stimmabgabe trotz der genannten Rückschläge unvermindert auf das Gaspedal drücken.Warum eine Initiative?Auf parlamentarischem Weg wurden 2018 zwei Vorstösse behandelt, die einen Marschhalt erwirken bzw. die Einführung von E-Voting an Bedingungen koppeln wollten: Die parlamentarische Initiative von Grünen-Nationalrat Balthasar Glättli forderte, dass alle wesentlichen Schritte zur Durchführung von Wahlen und Abstimmungen der öffentlichen Überprüfbarkeit unterliegen müssten. SVP-Nationalrat Franz Grüter forderte, dass Versuche zur elektronischen Stimmabgabe für mindestens vier Jahre ausgesetzt werden sollten – bis E-Voting dereinst sicher und bedenkenlos einsetzbar wäre. Beide Vorstösse wurden in der Herbstsession 2018 abgelehnt.Da der parlamentarische Weg nicht von Erfolg gekrönt war, entschloss sich ein überparteiliches Komitee, eine eidgenössische Volksinitiative für ein E-Voting-Moratorium zu lancieren.Warum ein Moratorium?«Moratorium» bedeutet einen gesetzlich angeordneten Aufschub (etwas für eine bestimmte Zeit auszusetzen, nicht tun zu dürfen). Die Initiative für ein E-Voting-Moratorium strebt an, dass die elektronische Stimmabgabe solange verboten bleibt (mindestens aber fünf Jahre), bis die im Initiativtext formulierten Bedingungen erfüllt sind:die wesentlichen Schritte der elektronischen Stimmabgabe müssen von den Stimmberechtigten ohne besondere Sachkenntnis überprüft werden können.sämtliche Stimmen müssen so gezählt werden, wie sie gemäss dem freien und wirklichen Willen der Stimmberechtigten von aussen unbeeinflusst abgegeben wurden.die Teilergebnisse der elektronischen Stimmabgabe müssen eindeutig und unverfälscht ermittelt sowie nötigenfalls in Nachzählungen ohne besondere Sachkenntnis zuverlässig überprüft werden können.Bei E-Voting müssen die gleichen Sicherheitsbestimmungen gegen Manipulationshandlungen gelten wie bei der Stimmabgabe per Brief oder Urne.–> Mehr Infos: E-Voting im Vergleich zur Brief- und UrnenabstimmungWeshalb ein fünfjähriges Moratorium?Weshalb ist im Initiativtext von einem fünfjährigen Moratorium die Rede – und nicht von fünf Monaten oder 50 Jahren? Das Initiativkomitee ist der Ansicht, dass diese Zeitspanne realistisch ist, um danach erstmals neue Lösungen zu prüfen, die allenfalls sicheres und vertrauenswürdiges E-Voting ermöglichen. Eine mathematische Formel, was nun die richtige Dauer für ein Moratorium wäre, gibt es natürlich nicht. Am wichtigsten sind ohnehin die Kriterien, die erfüllt sein müssen, bis E-Voting eingeführt werden könnte.Sind Testversuche während des Moratoriums ausgeschlossen?Einige Kritiker befürchten, dass während des Moratoriums sämtliche Testversuche für ein sicheres und vertrauenswürdiges E-Voting ausgeschlossen wären. Aus Sicht des Initiativkomitees trifft dies keinesfalls zu. Hochschulen oder Private dürfen weiterhin an besseren E-Voting-Lösungen tüfteln und forschen – verboten sind die «Live-Tests», bei denen E-Voting in echten kantonalen und eidgenössischen Wahlen und Abstimmungen eingesetzt werden. Das Verbot soll nur solange gelten, bis die Kriterien des Initiativtexts erfüllt sind. Danach kann das eidgenössische Parlament das Moratorium aufheben und Testversuche in Wahlen und Abstimmen anordnen.Wir sind keine TechnologieverhindererDas Initiativkomitee besteht aus zahlreichen Personen, die den technologischen Fortschritt unterstützen und sich auch beruflich in der IT-Branche bewegen. Es ist aber kein Zufall, dass gerade IT-affine Kreise besonders sensibilisiert sind, wenn es darum geht, computergestützte Systeme in demokratischen Prozessen zu nutzen. Niemand von uns will E-Voting aus technologiefeindlichen Gründen für immer verbieten. E-Voting kann in der Schweiz aber erst dann glaubwürdig und breit akzeptiert zum Einsatz kommen, wenn eine absolut sichere Lösung entwickelt worden ist und die Abstimmungsresultate transparent und ohne besondere Sachkenntnis nachprüfbar sind.Der Chaos Computer Club, der die vermutlich weltbesten Hacker vereinigt, brachte diese kritische Einstellung passend auf den Punkt: «Wir wissen zu viel über Computer, um ihnen die letzten Reste der Demokratie anzuvertrauen.»Demokratie braucht VertrauenGeht eine Volksabstimmung sehr knapp aus – was durchaus keine Seltenheit ist –, können die brieflich oder an der Urne abgegebenen Stimmzettel, die in physischer Form bei den Gemeinden versiegelt und gelagert werden, jederzeit in wohldefinierten Verfahren nachgezählt werden. Dieses bewährte System schafft Vertrauen, ist transparent und für jede Stimmbürgerin und jeden Stimmbürger verständlich. Bei elektronisch abgegebenen Stimmen (E-Voting) versinkt die Stimme in einem digitalen Speichermeer von Bytes und Bits – nur ein paar wenige Spezialisten verstehen, wie die Stimmen ausgezählt werden. Der Souverän kann die Abläufe gar nicht verstehen, das Vertrauen geht verloren.Dabei ist das Vertrauen in demokratisch gefällte Entscheide zentral für ein friedliches Zusammenleben in unserer Gesellschaft. Darum sagen wir: Keine Experimente mit der direkten Demokratie – mit den Volksrechten spielt man nicht.Stimmenauszählung muss verständlich bleibenIm Gegensatz zur brieflichen Stimmabgabe ist bei E-Voting die Möglichkeit zur transparenten, einfach verständlichen Auszählkontrolle nicht gewährleistet. Während brieflich eingegangene Stimmen von schweizweit mehreren zehntausend Urnenbüromitgliedern ausgezählt werden, die sich gegenseitig auf die Finger schauen, ist die Auszählung der Stimmen bei E-Voting gegen aussen intransparent und kann nur von einzelnen IT-Spezialisten und Mathematikern verstanden werden – und sich zumeist auch gar nicht vor Ort befinden. Nur ein transparentes Auszählverfahren stärkt das Vertrauen, dass Wahlfälschungen nicht vorkommen können – oder, käme es zu versuchten Manipulationen, dass diese aufgedeckt werden.«Wahlen dienen zwei Zwecken. Der erste und offensichtliche Zweck ist es, den Gewinner richtig auszuwählen. Aber der zweite ist ebenso wichtig: den Verlierer zu überzeugen.» Bruce Schneier, Kryptographie- und IT-Sicherheits-Experte (zitiert von Balthasar Glättli)E-Voting bringt keine erhöhte StimmbeteiligungDie Testphase in den Kantonen hat gezeigt: E-Voting hat keine Erhöhung der Stimmbeteiligung gebracht – obwohl von E-Voting-Befürwortern gerne ins Feld geführt wird, damit mehr Junge zum Abstimmen bringen zu wollen. Die Realität ist aber eine andere: Weder ist E-Voting für Junge attraktiver zu handhaben noch resultiert daraus ein Zeitgewinn. Mittlerweile hat sogar die Bundeskanzlei bekannt gegeben, dass eine erhöhte Stimmbeteiligung nicht mehr «das primäre Ziel» darstelle. Der Bundesrat warnt gar vor zu hohen Erwartungen mit Blick auf die Partizipation. Er schreibt: «Es ist die Vorlage an sich, die über eine Teilnahme, respektive Nicht-Teilnahme, an einer Abstimmung entscheidet und nicht der Stimmkanal.»Man muss sich fragen: Wenn E-Voting nicht dazu beiträgt, dass mehr Stimmberechtigte abstimmen gehen – welchen Nutzen kann die Gefährdung der sicheren Stimmabgabe dann noch rechtfertigen?Nicht gerechtfertigte KostenZwischen 400 und 620 Millionen Franken würde eine flächendeckende Einführung von E-Voting die öffentliche Hand in den ersten zehn Jahren kosten, errechnete der Bund in einem Machbarkeitsbericht von 2002. In Tat und Wahrheit dürften die realen Kosten um ein einiges höher liegen, wie die Erfahrungen etlicher anderer IT-Projekte des Bundes veranschaulicht haben. Im Jahr 2011 gab der Kanton Zürich bekannt, dass jede einzelne elektronisch abgegebene Stimme eines Inlandschweizers 50, diejenige eines Auslandschweizers 150 Franken kostete. In einer Antwort auf eine SVP-Anfrage im Kantonsrat, bestätigte 2013 auch der Luzerner Regierungsrat, dass eine elektronisch abgegebene Stimme über 50 Prozent teurer ist als eine brieflich erfolgte Stimme. Wie hoch die Kosten für E-Voting-Projekte in der Schweiz aktuell ausfallen, ist (noch) nicht bekannt. Um die genauen Kosten zu erfahren, reichte SVP-Nationalrat Claudio Zanetti im Dezember 2018 eine Anfrage ein. Die Beantwortung seitens der Parlamentsdienste steht noch aus.Nicht mit E-Banking vergleichbarWer auf den ersten Blick mit E-Voting sympathisiert, argumentiert häufig, dass sich E-Banking im Zahlungsverkehr als stabile, sichere Online-Lösung bewährt habe. Wieso soll in der Demokratie nicht möglich sein, was bei Geldüberweisungen längst Realität ist? Die Antwort ist relativ simpel: Die Abläufe unterscheiden sich grundlegend! Im Unterschied zu E-Banking, bei dem der Kunde eindeutig identifiziert werden muss, darf genau das bei E-Voting nicht geschehen. Es muss schliesslich ausgeschlossen werden, dass registriert wird, ob jemand zu einer Abstimmungs-Vorlage mit Ja oder mit Nein gestimmt hat. Das macht die ganze Entwicklung wesentlich komplexer.Unsicher vor Hacker-AngriffenFührende Computer-Experten warnen: In Zeiten des «Cyber Wars», der Wirtschaftskriege und gestiegener Hacker-Gefahren ist es brandgefährlich, an heutigen E-Voting-Systemen festzuhalten. Beispiele aus dem Ausland – aber auch aus der Schweiz! – haben gezeigt, dass E-Voting-Infrastrukturen manipuliert werden können. Anlässlich der «Def Con», einer der grössten Veranstaltungen für Hacker weltweit, demonstrierten Hacker beispielhaft, dass sie in E-Voting-Systeme, die in den USA und anderen Ländern zum Einsatz kommen, teilweise in weniger als zwei Stunden eindringen konnten. Alles Systeme, bei denen behauptet wurde, sie seien absolut sicher.Gefahr von Abstimmungs-Manipulationen ist realEs wäre naiv zu glauben, dass kriminelle Akteure vor Attacken zurückschrecken würden, wo doch Hacker schon in mit beträchtlichem Sicherheitsaufwand geschützte Computer von Grossfirmen, staatlichen Verwaltungen und des Militärs eindringen konnten. So warnen Fachleute zu Recht "
