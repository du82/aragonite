["https://e-voting-moratorium.ch/testimonials"]
title = "Testimonials | E-Voting-Moratorium │ Volksinitiative"
description = "«Erfahrungen aus vielen Ländern zeigen, dass E-Voting-Systeme interessante Angriffsziele für Hacker und Grossmächte sind. Werden Wahlen und Abstimmungen manipuliert, so gefährdet dies das Vertrauen in unsere Demokratie.» Franz GrüterNationalrat / Unternehmer (LU)"
full_description = "TestimonialsFolgende Persönlichkeiten unterstützen die Volksinitiative «Für eine sichere und vertrauenswürdige Demokratie (E-Voting-Moratorium)»«Erfahrungen aus vielen Ländern zeigen, dass E-Voting-Systeme interessante Angriffsziele für Hacker und Grossmächte sind. Werden Wahlen und Abstimmungen manipuliert, so gefährdet dies das Vertrauen in unsere Demokratie.» Franz GrüterNationalrat / Unternehmer (LU)«E-Voting gefährdet unnötigerweise die Sicherheit unserer einzigartigen Demokratie. Nur unsere Initiative ermöglicht den Bürgerinnen und Bürgern zu entscheiden, ob sie das Risiko E-Voting überhaupt wollen.» Nicolas A. RimoldiStudent / Mitglied Jungfreisinnige (LU)«Hacking bedroht unsere Daten, unsere Abstimmungen und unsere Demokratie. E-Voting muss gestoppt werden, bis es irgendwann sicher genug sein wird.» Prisca Kollerehem. Kantonsrätin / Volkswirtin (ZH)«E-Voting gefährdet das Vertrauen der StimmbürgerInnen. Denn sie sind gezwungen, die Kontrolle über den Ablauf von Wahlen und Abstimmungen sowie die Auszählung an Experten und Privatunternehmen zu delegieren.» Jean Christophe SchwaabGemeinderat / alt Nationalrat (VD)«Abstimmungen müssen nicht nur den Gewinner ermitteln. Ebenso wichtig ist, dass das Resultat von den Verlierern akzeptiert wird. Die Zweifel, welche durch E-Voting geschürt werden, rütteln an diesem Fundament der Demokratie.» Balthasar GlättliNationalrat / Fraktionschef (ZH)«E-Voting muss genauso sicher und überprüfbar sein wie das traditionelle Abstimmen an der Urne. Wir dürfen unsere direkte Demokratie nicht gefährden, bloss weil E-Voting bequem und modern wirkt.» Martin SteigerRechtsanwalt (ZH)«E-Voting gefährdet das Vertrauen in die Demokratie, denn es erlaubt, Misstrauen in Endergebnisse einfach und günstig zu streuen.» Claudio LuckChaos Computer Club (TI)«Die Vorkommnisse in Genf sowie die Scytl-Erfahrungen zeigen: E-Voting ist mitnichten so sicher wie die schriftliche Urnenabstimmung. Nicht nur wegen Hacking-Gefahren. Auch die zentrale, IT-basierte Organisation (statt dezentraler Urnen in jedem Wahlkreis) birgt Risiken, die das Vertrauen in die direkte Demokratie kaum fördern. Daher ist E-Voting der Stecker zu ziehen, um die freie Demokratie zu retten!» Artur TerekhovJSVP ZH / Inh. AT Recht Steuern (ZH)«Die Sicherheit unserer Demokratie ist seit Jahren nicht gewährleistet. Nachweislich unsichere E-Voting-Systeme sind im Einsatz. Das ist fahrlässig und fordert uns zum Handeln auf.» Nik GuggerNationalrat EVP (ZH)«Das Vertrauen in die Demokratie und die Abstimmungskanäle sind ein zentraler Punkt für die politische Stabilität der Schweiz. Niemand zweifelt Abstimmungen oder Wahlen auf Grund von infrage gestellten Stimmabläufen an und dies muss für die Schweiz auch so bleiben.» Remo ZuberbühlerPräsident Junge BDP Schweiz«E-Voting klingt zwar toll und fortschrittlich. Doch die Gefahren dahinter bedrohen den Kern unserer wertvollen direkten Demokratie.» Dominic TäubertCo-Präsident Junge EVP Schweiz«Ich wehre mich gegen gefährliche Experimente mit unserer Demokratie. Wir brauchen ein Moratorium, solange E-Voting keine sicheren Abstimmungen garantieren kann.» Ronja JansenPräsidentin Juso Schweiz«Vertrauen ist für eine funktionierende Demokratie entscheidend, darum muss das Abstimmungsverfahren sicher und nachvollziehbar sein sowie das Stimmgeheimnis jederzeit gewährleisten.» Benjamin FischerKantonsrat SVP (ZH) / Präsident Junge SVP Schweiz«Das Vertrauen in die Korrektheit der Auszählung von Wahlen und Abstimmungen ist Voraussetzung für unsere Demokratie. Deshalb bin ich gegen die Einführung von elektronischen Abstimmungssystem, und unterstütze die Volksinitiative für ein E-Voting Moratorium. Tun auch Sie es!» Dr. Christoph Blochera. Bundesrat«Für Hacker und Unterwanderung bietet das System eine breite Möglichkeit und wird in anderen Ländern schamlos ausgenutzt. Die Überprüfung von Wahl- und Stimmabläufen muss weiterhin transparent und für längere Zeit möglich bleiben.» Hans MoserPräsident EDU Schweiz«Die Risiken der elektronischen Stimmabgabe überwiegen den potentiellen Nutzen überdeutlich. Es ist fahrlässig, wie die Verantwortlichen die Einführung eines nachweislich höchst unsicheren E-Voting-Systems weiterhin forcieren. Ich unterstütze das Moratorium – für unsere Demokratie.» Daniel C. RohrPolitikberater, Dozent und Autor (Bern und Padua)«Unsere Demokratie kann nicht durch ein unsicheres System in Frage gestellt werden, welches E-Voting heute repräsentiert. Es ist Sache des Schweizer Volkes, sich gegen ausländische Akteure zu entscheiden.» Isabelle ChevalleyNationalrätin GLP (VD)«Neben der Trivialisierung des Aktes der Stimmabgabe und der daraus resultierenden Hauptprobleme birgt die elektronische Stimmabgabe nicht hinnehmbare Sicherheitsrisiken und erlaubt keine demokratische Kontrolle über die Nachzählung von Stimmabgaben. Das Vertrauen in unsere Demokratie wäre bedroht.» Dylan KarlenStadtrat von Villeneuve VD«Unseren politischen Institutionen basieren auf Vertrauen. Mit unsicheren E-Voting-Systemen gefährden wir das Fundament unserer halbdirekten Demokratie.» Luzian FranziniCo-Präsident Junge Grüne Schweiz«E-Voting ist gegenwärtig noch zu wenig sicher. Ein Marschhalt ist deshalb angebracht. Die Jungfreisinnigen unterstützen das Moratorium.» Matthias MüllerPräsident Jungfreisinnige Schweiz«Ich habe nichts gegen E-Voting. Aber wir sind bezüglich Sicherheit einfach noch nicht dort wo wir sein sollen.» David TrachselPräsident Junge SVP Schweiz"
