title = "E-Voting-Moratorium: Unterschriftensammlung gestartet | E-Voting-Moratorium │ Volksinitiative"
full_description = "E-Voting-Moratorium: Unterschriftensammlung gestartetMrz 16, 2019 | Aktuelles DEMit einer Auftakt-Veranstaltung in Luzern hat ein breit abgestütztes Komitee offiziell die Unterschriftensammlung für die eidgenössische Volksinitiative für ein E-Voting-Moratorium eröffnet. Das überparteiliche Initiativkomitee zeigte beispielhaft auf, dass heutige E-Voting-Systeme unsicher, manipulationsanfällig und viel zu teuer sind. Die Zeit ist reif: Ab sofort werden in der ganzen Schweiz Unterschriften gesammelt, um E-Voting den Stecker zu ziehen.Vertrauen wiederherstellenDas Initiativkomitee kritisiert, dass die vom Bund übereifrig vorangetriebenen E-Voting-Projekte keinen konkreten Nutzen bringen. Gerade die jüngsten Ereignisse, bei denen international renommierte IT Sicherheitsexperten enorme Schwachstellen aufzeigen konnten, zeigen deutlich auf, dass den Beteuerungen, E-Voting-Systeme seien sicher, nicht getraut werden kann. Weder erwirken sie eine erhöhte Stimmbeteiligung noch wird die Stimmabgabe vereinfacht. Dafür stellt E-Voting eine grosse Gefahr für die direkte Demokratie dar: Die Schweiz wird zu einem interessanten Angriffsziel für staatliche und nicht staatliche Hacker – das Vertrauen in unsere Wahl- und Abstimmungssysteme wird nachhaltig beschädigt.Das Initiativkomitee hält fest, dass sie «keine Technologieverhinderer» seien. Im Gegenteil: Das Komitee setzt sich durchwegs aus IT-affinen Persönlichkeiten zusammen, viele arbeiten auch beruflich in der IT-Industrie. Sollte es dereinst möglich sein, ohne Risiko elektronisch abzustimmen, so werden sie die Ersten sein, die der Einführung des elektronischen Stimmkanals positiv gegenüberstehen werden. Dazu müssen aber klare Voraussetzungen erfüllt sein, welche die Initiative für ein E-Voting-Moratorium genau festlegt.Der Initiativtext wurde am 12. März 2019 im Bundesblatt publiziert. Die Initianten haben nun 18 Monate Zeit, um mindestens 100‘000 beglaubigte Unterschriften zu sammeln.Nähere Infos:Unterschriftenbogen Deutsch: e-voting-moratorium.ch/bogen-downloadUnterschriftenbogen Französisch: moratoire-e-vote.ch/telechargerInitiativkomitee: e-voting-moratorium.ch/initiativkomiteeArgumente: e-voting-moratorium.ch/argumenteInitiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2019
