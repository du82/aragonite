["https://e-voting-moratorium.ch/meilensteine-2"]
title = "Wichtige Meilensteine | E-Voting-Moratorium │ Volksinitiative"
full_description = "Wichtige Meilensteine02.06.2020: Nationalrat Grüter reicht Interpellation zu Ungereimtheiten beim E-Voting-System der schweizerischen Post einNationalrat Franz Grüter, Präsident des Initiativkomitees für ein E-Voting-Moratorium hat am 2. Juni 2020 mit Mitunterzeichnern die Interpellation «Abhängigkeiten und Ungereimtheiten beim E-Voting-System der Post» eingereicht. Grüter stellt darin kritische Fragen, unter anderem zur intransparenten Kommunikation seitens der Post und zum fragwürdigen Verhältnis zur inzwischen insolventen Firma Scytl.18.05.2020: Scytl-Konzern vor Konkurs: Post hält weiter an E-Voting festDie schweizerische Post wird vom bevorstehenden Konkurs des umstrittenen Scytl-Konzerns überrumpelt. Früher als geplant muss sie kommunizieren, dass sie alleinigen Rechte am E-Voting-Quellcode ihres spanischen Technologie-Zulieferers erworben hat. Die E-Voting-Kritiker nehmen die Entwicklung zum Anlass für Grundsatzkritik. Das System von Scytl sei «von Grund auf nicht vertrauenswürdig», wird Nicolas A. Rimoldi, Kampagnenleiter der Initiative «Ja zum E-Voting-Moratorium» in der «Aargauer Zeitung» zitiert. «Die Post hat einen Schrotthaufen gekauft und reitet weiterhin ein totes Pferd.» Beim Hacking-Test seien «ganz kritische Systemfehler» entdeckt worden: «Stimmen konnten unbemerkt manipuliert werden.»Franz Grüter verlangt GPK Untersuchung gegen die Post, die jährlich Millionen für dieses E-Voting ausgibt22.04.2020: Basel-Stadt: Nur noch knappe Mehrheit offen für E-VotingGemäss einer von der Staatskanzlei in Auftrag gegebenen Umfrage zeigen sich noch rund 56 Prozent der Befragten gegenüber E-Voting «vorsichtig offen». Dieser Wert ist im Vergleich zu früheren Umfragen gesunken: In allen Alterskategorien bestehen beträchtliche Sicherheitsbedenken.01.03.2020: Die Evangelische Volkspartei (EVP) unterstützt die Volksinitiative für ein E-Voting-MoratoriumDie Partei wird sich aktiv an der Unterschriftensammlung beteiligen.12.02.2020: Der Crypto-Skandal erschüttert die Schweiz. Was kann man für E-Voting daraus folgern?(1) Kryptologie ist kein hinreichendes Argument für Sicherheit.(2) Geheimdienste können ALLE IT-Manipulationsmöglichkeiten nutzen, um ihre Ziele zu erreichen.(3) Auf einem Gerät, wo CH drauf steht, ist nicht nur CH drin.10.12.2019: Nationalrat will Versuchsbetrieb von E-Voting einstellen Der neue Nationalrat hat nun eine Mehrheit von E-Voting Gegnern/Skeptikern12.11.2019: Auszählungspanne in Fribourg bei den Ständerats-Nachwahlen zeigt die Empfindlichkeit der Bevölkerung bei IT -Pannen.Die Panne in FR war ja an sich eine harmlose und gut beherrschbare Unregelmässigkeit. Aber auch hier führen IT Probleme schnell zu Unsicherheit und Vertrauensverlust. Die Nachzählungsfähigkeit ist entscheidend, auch dann, wenn man auf sie im Einzelfall verzichtet.Der abtretende SPS Chef Levrat findet auch, dass nach diesen Erfahrungen E-Voting keine Chance mehr habe24.10.2019: Studie der Uni ZH beschreibt einen Einbruch der Zustimmungsrate von E-Voting in der Bevölkerung.Gemäss der Studie Internet und Politik wünschen sich nur noch 51% der Bevölkerung E-Voting. Dass dieses einen Nutzen hätte ist keine Mehrheitsmeinung (mehr).9.9.2019: Die Junge BDP unterstützt unsere Initiative !Die Jungpolitiker verstehen etwas von Politik UND von IT. Da haben offenbar etwelche ihren bestandenen Repräsentanten etwas voraus. Damit jetzt auch eine Partei der bürgerlichen Mitte in unserem ‹Portfolio›.23.8.2019: Post kündigt ein «neues» E-Voting System anIn Rekordzeit nach 8 Wochen zaubert die Post ein komplexes System aus dem Ärmel: Der Aargau will sogleich aufspringen: Unbelehrbare Aargauer Regierung delegiert die Verantwortung für die Sicherheit an den Bund. Bemerkenswert: Der Bund wollte mit seinem Gesetz die Verantwortung an die Kantone abschieben. Fachleute wissen: Es gibt keine Sicherheit! Die sog. «vollständige Verifizierbarkeit» ist ein schlechter Witz ! 6.7.2019: Post zieht das bisherige System zurück – Wahlen 2019 ohne E-VotingDas bisherige System genügt den Anforderungen der Bundeskanzlei offenbar noch weniger als das neue, welches beim Intrusion Test die kritischen Fehler zeigte. Einige Kantone sind erbost. Es wird von möglichen Schadenersatzforderungen an die Post gemunkelt.27.6.2019: Der Bundesrat krebst zurückDie flächendeckende Einführung von E-Voting ist vorerst vom Tisch. Der Testbetrieb soll modernisiert werden. Wie, ist aber noch unklar.24.6.2019: Der Kanton ZH beschliesst ein E-Voting Moratorium bis 2022Die E-Voting Versuche sollen erst wieder zugelassen werden, wenn sich das System als sicher erwiesen hat. CVP und FDP reden von «Denkverbot» und «Technikverbot». Die übrigen Parteien wollen zuerst eine Garantie für die Sicherheit bekommen, damit das Vertrauen in die korrekte und nachvollziehbare Stimmabgabe nicht verloren geht.19.6.2019: Vorzeitiger Rückzug von CH-Vote. Der Kt. GE stoppt sein E-Voting per sofort.Weil die Bundeskanzlei offenbar geplant hatte, den Quellcode auch bei CHVote noch vor den eidg. Wahlen zu überprüfen, hat der Kt. GE entschieden, den geplanten Endtermin von 2020/02 vor zu verschieben und hört mit CHVote per sofort auf.18.6.2019: Nationalrat stimmt Alternativkanal zu E-Voting zuDie Motion Zanetti 19.3294 für einen elektronischen Versand der Abstimmunterlagen an die Auslandschweizer wird vom Nationalrat angenommen mit 115:69 Stimmen. Der bundesrätlichen Argumentation, dass dies wegen der Sicherheit nicht möglich sei, wird nicht gefolgt. Damit entfällt ein guter Anteil des Druckes, E-Voting einzuführen. Neben der SVP, der GPS und der GLP unterstützt auch die SP mehrheitlich diese Motion.30.4.2019: Ende der Vernehmlassungsfrist für die Gesetzesrevision GPolRKdK äussert sich mit Kt. AI, FR, GR, LU,TI positiv, Kt SO und ICT-swi, swico möchten die Überführung in den ordentlichen Betrieb verschieben und Kt SZ und economiesuisse ist auf der Argumentationslinie der E-Voting Gegner: Abbruch der Übung. Kt UR, VD und GL haben vom Parlament kein grünes Licht für E-Voting. Kt OW und Kt ZG begrüssen vor allem die kantonale Hoheit für die Einführung von E-Voting. Vorerst sind keine weiteren kantonalen Stellungnahmen bekannt. Zu den absoluten Gegnern zählen ausserdem: der CCC CH, die Piratenpartei und Grundrechte.ch sowie die ‹Digitale Gesellschaft CH›. Auch die Parteien haben ihre Vernehmlassung abgegeben. Weitere Links16.4.2019: ICT Switzerland wendet sich gegen die Überführung von E-Voting in den ordentlichen Betrieb. Er ist für die Weiterführung der Testphase.Nach 18 Jahren pröbeln mit untauglichen Mitteln und unterdessen 3 Systemprojekten als Leichen: Wie lange denn noch? Müsste man nicht zuerst einmal ein durchdachtes und umsetzbares Konzept haben?08.4.2019: Der Kantonsrat ZH unterstützt eine parlamentarische Initiative, die in die gleiche Richtung geht wie unsere Volksinitiative.Die Überprüfbarkeit der Wahl- und Abstimmungsresultate durch die Öffentlichkeit ist das Kriterium.31.3.2019: Das Initiativkomitee sendet die ausführliche Vernehmlassungsantwort (update) an die Bundeskanzlei. 5 Hauptgründe werden erläutert, warum das E-Voting System und dessen gesetzliche Grundlagen den effektiven Anforderungen für eine sichere Demokratie nicht genügt.29.3.2019: Bundeskanzlei nimmt Standortbestimmung vorWas sind die KPMG Zertifikate wert? Was die neuen Gesetze und Verordnungen? Was der Schlussbericht der Expertengruppe?29.3.2019: Post zieht ihr E-Voting System (vorläufig) zurückDer Entscheid ist konsequent im Angesicht der Medienschelte. Aber er ist nicht konsistent mit den bisherigen Beteuerungen.27.3.2019: NZZ fordert einen Neustart für das E-Voting ProjektAber welcher Hersteller will all die Risiken übernehmen ? Oder wird ein nationales Sicherheitsprojekt geplant, gemäss den Vorstellungen der Berner Fachhochschule?26.3.2019: Freiwillige Forscher aus Übersee finden insgesamt 3 kritische Sicherheitslücken im E-Voting der PostWeder die POST, noch die 2700 Hackers waren in der Lage, diese zu finden. Die mächtigsten Geheimdienste der Welt hätten diese Fähigkeit wohl gehabt, aber wieso sollten diese beim Intrusion Test mitmachen?22.3.2019: Der Kt VD lehnt den Vorentwurf des Gesetzes über E-Voting abZitat Parl. VD: «Da es hier um die Ausübung demokratischer Rechte geht, sollte ein solches System ausschliesslich in schweizerischer öffentlicher Hand sein.»17.3.2019: Die JFDP spricht sich für die Initiative des E-Voting Moratoriums ausDamit grenzt sie sich von der Mutterpartei, die noch gespalten ist, in dieser Frage ab.16.3.2019: Die Unterschriftensammlung für die Volksinitiative beginntIn Luzern initialisiert das Komitee öffentlich die Initiative «Für eine sichere und vertrauenswürdige Demokratie (E-Voting Moratorium).»12.3.2019: Interpellation 19.5153 von NR Franz Grüter, SVP, LU «Wann erfolgt ein Marschhalt bei der Einführung des unsicheren Post / Scytl E-Voting Systems?»Der Bundesrat antwortet am 18.3.2019, dass die festgestellten Mängel ein Grund sind, keine definitive Betriebsbewilligung zu erteilen und stellt eine Überprüfung der Betriebsbewilligungspraxis in Aussicht.25.2.2019: Der Intrusion Test mit dem E-Voting-System der Post beginnt: Eine Farce ?Die meisten der gängigsten Hackarten sind verboten! Die Hacker müssen sich alle registrieren lassen. Man kann getrost davon ausgehen, dass die wirklich Bösen nicht dabei sind!20.2.2019: Quellcode E-Voting POST/Scytl geleaktLange war unklar, ob der Quellcode überhaupt zur Veröffentlichung freigegeben wird. Jetzt ist er irgendwie an die Öffentlichkeit gelangt. Die Post macht gute Miene zum bösen Spiel.20.2.2019: Kantonsparlament BS blockiert das Budget für E-Voting5.6 Mio Fr. sind denn dem Parlament denn doch zuviel angesichts der unsicheren Lage über Zukunft dieses E-Voting-Systems.20.2.2019: Die Bundeskanzlei hat nach gut 4 Monaten die Vorprüfung der Initiative abgeschlossen und diese damit zugelassen mit Start am 12.3.2019Einige Zeit lang war der Text im Detail den behördlichen Verständnisanforderungen nicht vollumfänglich entsprechend.31.1.2019: ‹Die Republik› deckt die dubiose Hintergründe zur Firma Scytl auf, welche die Herstellerin des E-Voting Systems der Post ist.Die Vertrauenswürdigkeit wird aufgrund der angebotenen Transparenz und aufgrund von Machenschaften in der Vergangenheit stark angezweifelt.25.1.2019: Die Initiative «Für eine sichere und vertrauenswürdige Demokratie (E-Voting Moratorium) wird an einer PK lanciert.» Das Motto: «Den Stecker ziehen!»Sie startet mit einer WeCollect Kampagne bei der sich insgesamt über 5700 Bürger verpflichten, je 5 Stimmen zu sammeln.17.1.2019: US-Softwareriese DXC kauft Zuger IT-Firma LuxoftDamit begibt sich eine potentielle künftige Zuger E-Voting Lösung unter die Fittiche der amerikanischen Regierung.29.12.2018: Die Bundeskanzlei veröffentlicht den Text der Gesetzesrevision und eröffnet die Vernehmlassung.Nach 14 Jahren Testbetrieb erscheint endlich die Gesetzesgrundlage, die für einen ordentlichen Betrieb, welcher vor 1 1/2 Jahren angekündigt wurde, unabdingbar ist. 19.12.2018: Das Parlament des Kt. JU lehnt die Einführung des E-Votings ab. Les députés ont débattu pour la deuxième fois de la modification de la loi sur les droits politiques. Ils ont fait volte-face et ont ainsi décidé de ne pas introduire le vote électronique dans le canton.14.12.2018: Landrat BL will nichts wissen vom E-VotingDie Baselbieter sind klug und warten erst mal ab10.12.2018: Interpellation 18.1083 von NR Claudio Zanetti, SVP, ZH mit der Anfrage zu den Kosten des gesamten E-Voting Projektes.Der Bundesrat antwortet am 20.2.2019, dass der Hauptteil der Kosten bei den Kantonen anfallen würden und dies ausserhalb der Kontrolle der Bundeskanzlei läge.09.12.2018: Die JUSO beschliessen an ihrer DV die Unterstützung unserer Initiative mit nur 1 Gegenstimme. Die JUSO wird auch ins Initiativkomitee aufgenommen. 28.11.2018: Der Kt. GE gibt nach dem Hackervorfall anfangs Monat seine E-Voting Plattform per 2020 auf.Kostengründe werden angegeben. Das ist glaubhaft, aber es sind Kosten wegen der Aufarbeitung der mangelnden Sicherheitsvorkehrungen.02.11.2018: Hacker finden Schwachstelle im grössten Schweizer E-Voting SystemMit einer einfachen Man-in-the-middle Attacke ist es dem CCC gelungen, das E-Voting des Kt.Genf (CHVote) zu hacken, d.h. den Datenstrom zu entschlüsseln und für Dritte sichtbar zu machen. 22.3.2018: Urner Landrat will kein E-VotingDas Kantons-Parlament spricht sich gegen eine Änderung des Wahlgesetzes aus. Dieses hätte für Uri das E-Voting gebracht. 02.6.2018: Eine Kerngruppe des Initiativ-Komitees konstituiert sich.Die wichtigsten Aufgaben sind: Der genaue Initiativtext, und die Suche nach politisch breiter Unterstützung26.02.2018: Die Idee einer Volksinitiative wird in der NZZ zum ersten Mal öffentlich Das Grundlagendokument ist «E-Voting: Das Ende der Demokratie» vom Ex-Militär Droz"
