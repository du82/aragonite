["https://e-voting-moratorium.ch/avenir-suisse-zu-e-voting-die-direkte-demokratie-aufs-spiel-setzend"]
title = "Avenir Suisse zu E-Voting: Die direkte Demokratie aufs Spiel setzend! | E-Voting-Moratorium │ Volksinitiative"
full_description = "Avenir Suisse zu E-Voting: Die direkte Demokratie aufs Spiel setzend!Jul 30, 2019 | Aktuelles DEAvenir Suisse publizierte heute ihre Einschätzungen zu E-Voting. Analysiert man diese, muss man leider zum Schluss kommen, dass der sog. Think-Tank weder mit der momentanen Debatte um die elektronische Stimmabgabe noch mit der Materie an sich vertraut ist. Nur so lässt sich erklären, dass Avenir Suissse behauptet, E-Voting habe «Vorteile und Chancen». Dabei haben nicht zuletzt die Enthüllungen um die Sicherheitslecks bestehender E-Voting-Systeme gezeigt, dass E-Voting keinen Nutzen bringt.Weder wird mit E-Voting die Stimmbeteiligung erhöht, noch gehen mehr Junge abstimmen. Der Grossteil der Auslandsschweizer lebt in Ländern, in welchen die Abstimmung per Post funktioniert. Gerne wird vergessen, dass die E-Voting-Codes per Post ins Ausland verschickt werden müssen. Ebenso ist zu erwähnen, dass der Nationalrat die Motion von Nationalrat Claudio Zanetti «E-Versand statt E-Voting» angenommen hat. E-Voting für Auslandsschweizer hat keine Zukunft. E-Voting erfüllt momentan die sicherheitsrelevanten Ansprüche des Bundes nicht, weswegen das System der Post von der Bundeskanzlei gestoppt wurde.Die Überführung in den ordentlichen Betrieb ist nicht zu verantworten. Abschliessend ist fest zu halten, dass unsere Volksinitiative Bedingungen an die Forschung und Entwicklung eines würdigen E-Voting-Systems stellen. Ein Grundpfeiler der Demokratie ist es, dass alle Bürger die Prozesse kennen und verstehen. Dies ist mit dem gegenwärtigen, von Scytl entwickelten E-Voting-System nicht möglich. Für uns ist es absolut unverständlich, dass Avenir Suisse E-Voting in den ordentlichen Betrieb überführen und dadurch die Sicherheit unserer Demokratie gefährden will.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
