["https://e-voting-moratorium.ch/sammelfristen-auf-eis-gelegt-temporaerer-sammelstopp-der-volksinitiative-fuer-ein-e-voting-moratorium"]
title = "Sammelfristen auf Eis gelegt: Temporärer Sammelstopp der Volksinitiative für ein E-Voting-Moratorium | E-Voting-Moratorium │ Volksinitiative"
full_description = "Sammelfristen auf Eis gelegt: Temporärer Sammelstopp der Volksinitiative für ein E-Voting-MoratoriumMrz 20, 2020 | Aktuelles DEMedienmitteilung: Der Bundesrat hat entschieden, die Sammel- und Behandlungsfristen eidgenössischer Volksinitiativen und Referenden für eine bestimmte Zeit einzufrieren. Das bedeutet, dass sämtliche Sammelaktivitäten für die Volksinitiative für ein E-Voting-Moratorium befristet eingestellt werden.Das Initiativkomitee trägt diesen Entscheid vorbehaltlos mit und bittet die Bevölkerung, sich strikte an diese Vorgabe zu halten und keine Unterschriften zu sammeln, bis die «Auf Eis-Legung» durch den Bund wieder aufgehoben worden ist. Diese Massnahmen bedeuten konkret, dass auch Unterschriftensammlungen, die online erfolgen, bis auf Weiteres untersagt sind. So haben wir die Download-Möglichkeit auf unserer Website deaktiviert und allen digitalen Sammelplattformen angeordnet, den Unterschriftenbogen vorübergehend vom Netz zu entfernen.Der Entscheid des Bundesrates soll insbesondere dem Umstand Rechnung tragen, dass derzeit aufgrund der zur Eindämmung des Corona-Virus nötigen Einschränkungen der Versammlungs- und Bewegungsfreiheit kaum mehr Möglichkeiten zur Unterschriftensammlung im öffentlichen Raum bestehen. Wir unternehmen alle erdenklichen Massnahmen, um dem Bundesratsentscheid gerecht zu werden und rufen in diesem Zusammenhang alle Bürgerinnen und Bürger auf, sich an die Massnahmen des Bundes zu halten.Initiativkomitee «Für eine sichere und vertrauenswürdige Demokratie»"
year_published = 2020
