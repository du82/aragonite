["https://e-voting.bfh.ch/events/past-events/phd-days-2013"]
title = "Events - E-Voting Group"
description = "November 14–15, 2013 Schloss Münchenwiler, Switzerland"
full_description = "This workshop continues the tradition of PhD workshops on e-voting that started in German-speaking countries. This edition is explicitly internationally oriented, and knowledge of German is therefore not necessary. The goal of the workshop is to foster understanding and collaboration between the various disciplines working on e-voting. To this end, the program allows ample space for discussion and initiating collaboration, in addition to the presentations by attendees. What makes this workshop series special, is that it is truly interdisciplinary, where PhD students from legal backgrounds are joined by PhD students with computer science and cryptography backgrounds and by social scientists. Note that the workshop is open to young researchers not working on a PhD right now. People who have just finished a PhD or who are planning to do a PhD are welcome to particiapate. Proposals for presentations will be considered if possible. The Schloss Münchenwiler (Schloss = castle) is a beautiful conference hotel near the Medieval town of Murten, which is close to Berne. Murten can be reached by train in two hours from the airports in Zürich, Basel, or Geneva. From the Murten train station, Münchenwiler can be reached in 5 minutes by taxi (20 minutes walk). The workshop starts on Thursday at 14:00. This should allow some of you to travel to Münchenwiler on Thursday morning (at Zürich airport, you must be able to catch the 11:43 train). See timetable of the Swiss Railway. For the accomodation, we arranged a special deal with the Hotel. And we also sponsor the event to offer you a very affordable price (Switzerland is one of the most expensive in the world...). In the following prices, everything is included: the workshop, the hotel room, the food, the coffee breaks: If you can't affort the trip, you can request an additional sponsoring from the Swiss E-Voting Competence Center (max. 2-3 participants)."
year_published = 2025
clearnet = "https://e-voting.bfh.ch/events/past-events/phd-days-2013"
