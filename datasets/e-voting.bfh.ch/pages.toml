["https://e-voting.bfh.ch/j/privacy"]
title = "Privacy Policy - E-Voting Group"
description = "... to the web site of the E-Voting Group (EVG). We are located in the city of Biel in Switzerland. We are part of ICE, the Institute for Cybersecurity and Engineering. Our institute belongs to the Department of Engineering and Information Technology of the Bern University of Applied Sciences (BFH-TI)."
full_description = "We have implemented Google reCAPTCHA in forms on our website to check whether the data entered in the forms comes from human visitors or from machines or automated programs, also known as “bots”. This tool automatically analyzes the behavior of website visitors as soon as they interact with the website using various information like IP address, length of stay, and mouse movements. The data processed includes usage data such as the website accessed, date and time of access, and mouse movements, as well as communication data like IP addresses, browser type, and operating system. This processing is targeted at website visitors and users of online services. The primary purpose of this processing is to prevent the misuse of our contact form, thereby enhancing security. The legal basis for this is our legitimate interest according to Art. 6 para. 1 p. 1 lit. f. GDPR. The data recipients include Google Ireland Ltd, based at Google Building Gordon House, Barrow St, Dublin 4, Ireland, (https://policies.google.com/privacy) and our website hosting provider. While your personal data is processed within the EU, the retention time for the processed data is determined by Google Ireland Limited. Additional information can be found in the Google reCAPTCHA privacy policy: https://policies.google.com/privacy"
year_published = 2025
clearnet = "https://e-voting.bfh.ch/j/privacy"
