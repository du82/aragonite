["https://e-voting.bfh.ch/events/phd-days-2014"]
title = "Events - E-Voting Group"
description = "12th International"
full_description = "This PhD colloquium continues the tradition of PhD workshops on e-­‐voting that started in 2006 and took place in various locations in Germany, Austria, Switzerland and Luxembourg . As this time it is part of the well-­established EVOTE conference taking place in the renaissance castle Hofen in Bregenz in Vorarlberg, the western­‐most part of Austria, it is explicitly internationally oriented, and knowledge of German is therefore not necessary. The goal of the colloquium is to foster understanding and collaboration between Ph.D students from various disciplines working on e-­‐voting. To this end, the program allows plenty of space for discussion and initiating collaboration based on presentations by attendees. What makes this colloquium special, is that it is truly interdisciplinary, where PhD students from legal backgrounds are joined by PhD students with computer science and cryptography backgrounds and by social scientists. Each interested participant should submit his/her research proposal (or alternatively ideas for papers, open problems, or other issues where feedback from colleagues would be helpful etc.) of some two pages length using the conference platform provided at https://www.easychair.org/conferences/?conf=evote2014phd. The PhD chairs will facilitate feedback which will be available ahead of the event in order to improve the submission before presentation. The conference will be held in the beautiful Renaissance castle of Hofen at Lochau/Bregenz on the shores of Lake Constance in Austria. The colloquium will begin at 9:00 on October 28 and last until 17:00 which should give ample room for presentation and discussion of the contributions. In general the presentations should be of some 15-­‐20min length. Participation in the colloquium will cost 120€. If the colloquium is attended together with the conference a reduced fee of 90€ applies. This fee includes lunch and drinks during the colloquium as well as participation in the EVOTE welcome reception in the evening of that day (see also www.e-­voting.cc/2014 for more information)."
year_published = 2025
clearnet = "https://e-voting.bfh.ch/events/phd-days-2014"
