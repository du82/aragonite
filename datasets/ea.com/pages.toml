title = "Electronic Arts’ Environmental, Social, and Governance Commitments – Electronic Arts"
description = "Electronic Arts’ environmental, social, and governance approach guided by our, mission, purpose, beliefs, and stakeholder expectations."
full_description = '''Our Commitment to Lasting Impact Download Now "Connecting with growing global communities through new and innovative forms of entertainment fuels the passion and creativity of everyone at Electronic Arts (EA). With our games and experiences at the heart of community, fandom, and cultural celebration, we design bigger worlds, tell bolder stories, and build more welcoming online communities. It is through this commitment to fans that we strive to create worlds of play without limitations." — Andrew Wilson, Chief Executive Officer Read The Full Letter Connecting with growing global communities through new and innovative forms of entertainment fuels the passion and creativity of everyone at Electronic Arts (EA). With our games and experiences at the heart of community, fandom, and cultural celebration, we design bigger worlds, tell bolder stories, and build more welcoming online communities. It is through this commitment to fans that we strive to create worlds of play without limitations. Rich backgrounds, experiences and perspectives across our global workforce are the foundation of a culture of learning and openness at EA. It is through this important lens that our people create stories and deliver amazing experiences that resonate with audiences around the world and make an impact in the communities where we live, work and play. We believe the excitement, engagement, and connection of play is for everyone. Our living, growing franchises, like Apex Legends, The Sims, EA SPORTS FC, College Football and Madden NFL, reflect our commitment to inclusivity, community-driven play, and expanding authentic representation in our games. We are constantly challenging the status quo to shape the future of entertainment through programs like our accessibility patent pledge. Making gaming more accessible and inspiring others in our industry to do the same is central to who we are, what we do, and how we show up for players and fans. Delivering next-level entertainment at the intersection of technology, arts, and culture, inspires us to empower future inventors and artists with next-gen skills across many career paths. We invest resources and volunteer hours to support initiatives where we can make a difference — particularly in partnerships that focus on STEAM education. A world of creativity, connection, and belonging for present and future generations depends upon sustainable practices today. We are on track to becoming carbon neutral by 2027, while expanding our renewable electricity use and engaging with organizations to protect and preserve our local ecosystems. Our values as a global company continue to drive us to create a welcoming workplace, foster inclusive communities, invest in the next generation of innovators and artists, and progress our environmental initiatives. I am inspired by the entertainment and impact we are helping deliver, as we continue to deepen this work across our communities. Sincerely, Andrew Wilson Our People & Inclusive Culture We foster an inclusive workplace to make games for everyone. We aim to ensure that everyone feels represented—in our games and in how we work; it’s ingrained in the very culture of our company. EA is a proud host company with the Hiring Our Heroes (HOH) program, which helps bridge the gap between the civilian-military divide within the business community. Read the Story Learn More about Our People & Inclusive Culture Positive Play We create worlds and experiences where everyone is welcome. Collaboration is a key part of our company commitment to ensuring a safe and inclusive experience for young players. This is why EA is proud to have joined two organizations helping shape and support the online world to make it safer for kids and their families–Tech Coalition and the Family Online Safety Institute (FOSI). Read the Story Learn More about Positive Play Social Impact We create access and opportunity in the communities where we live, work and play. Using the power of play in and beyond our games, we are driving positive impact and creating opportunities for more people to unlock their potential. Discover how we’re changing lives and inspiring youth through investments in community-level football globally. Read the Story Learn More about Social Impact Environmental Sustainability We are committed to actions that preserve a world where all can play. We are exploring strategies and technologies we can use to reduce our climate impact while continuing to add value to the player experience. Known Version Patching is a revolutionary piece of engineering that reduces the size and time needed for game updates, lowers costs, and supports EA's climate commitments. Read the Story Learn More about Environmental Sustainability More News Electronic Arts Outlines Long-Term Growth Strategy at Investor Day Electronic Arts Inc. Sep 17, 2024 EA is driving the future of entertainment, connecting more players across more platforms, no matter where they live. Read More EA anticheat is leveling the playing field Electronic Arts Inc. Aug 22, 2024 EA anticheat is keeping games fair, fun, and secure for millions of players worldwide. Read More FC FUTURES: Opening the beautiful game to the world Electronic Arts Inc. Jul 25, 2024 EA FC FUTURES has opened football to more than 170,000 people around the globe, refurbished pitches, handed out supplies, and more. Read More Load More Our Impact Report tells our always-on story of how incredibly talented, values-driven teams, all across EA are continuously working to help foster lasting impact to lead the future of entertainment. Read about our progress in our annual impact report.* *PDF in English Only Summary Full Report Reports & Statements Additional information, policies, reports, and statements, can be found on our Investor Relations Website. Read Our Past Impact Reports 2023 | 2022 | 2021 .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { width: 90%; margin: 0 auto; padding: 3rem 0; } @media screen and (min-width: 768px) { ea-section ea-section-column.eapl-section-column-50 { align-self: center; margin: 0; width: 50%; overflow: hidden; } .copy-copy ea-section ea-section-column.eapl-section-column-50 { align-self: start; } .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { padding: 0 2rem; margin: 0; width: 50%; } .dx-video-asset ea-media ea-html5-video { margin-bottom: -10px; } } @media screen and (min-width: 1024px) { .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { padding: 0 6rem; } } ea-section-column.eapl-section-column-100 img,ea-section-column.eapl-section-column-50 img,ea-section-column.eapl-section-column-66 img { max-width: 100%; } .dx__anchor-nav { display: flex; align-items: stretch; justify-content: center; align-content: center; list-style-type: none; margin: 0; padding: 0; } .dx__anchor-nav__link { display: flex; align-items: center; font-family: var(--ea-theme-secondary-font-family); text-transform: uppercase; font-size: 1.2rem; line-height: 1.1; font-weight: bold; text-align: center; padding: 0 2rem; margin: 0; border-right: 1px solid var(--dx-anchor-nav-separator-color); white-space: nowrap; } .dx__anchor-nav__link::before { content: ""; } .dx__anchor-nav__link:last-child { border: none; } .dx__anchor-nav__link a { text-decoration: none; line-height: 1; transition: linear all 0.25s; webkit-transition: all .25s linear; moz-transition: all .25s linear; ms-transition: all .25s linear; o-transition: all .25s linear; color: var(--dx-anchor-nav-color); } .dx__anchor-nav__link a:hover { transform: translatey(-2px); color: var(--dx-anchor-nav-hover-color); } @media only screen and (max-width: 1158px) { .dx__anchor-nav__link { font-size: 1rem; padding: 0 1.5rem; } } @media only screen an