description = "Download the EA app to connect with friends and play the latest RPGs, shooters, Sports video games, and more."
full_description = '''.gameStreamDesktop { display: none; } @media only screen and (min-width: 768px) { .gameStreamDesktop { display: initial; } .gameStreamMobile { display: none; } } The EA app Powering EA's next generation of PC & Mac gaming Download the EA app Learn about Origin Designed for speed The fast, optimized platform makes it easier than ever to download and play. So jumping into your game takes less time and fewer clicks. Built to connect Link your EA Account with your favorite gaming platforms to import friends lists and play together. Discovery at your fingertips See what your friends are playing, find EA’s newest releases, and add them to your collection within a few clicks. Discover new games & play old favorites Discover new games & play old favorites Explore a huge, evolving library of titles ranging from indie darlings to triple-A hits. See now Download the EA app Installing the EA app will remove Origin from your device. Windows macOS Playing on macOS Mojave or older? Download Origin for Mac. FAQ What is the EA app? The EA app for Windows is Electronic Arts’ all-new, enhanced platform, where you can easily play your favorite games. The app provides a streamlined and optimized user interface that gets you into your games faster than ever before. Who can download the EA app? The EA app for Windows is available to all players on a (minimum) 64-bit PC system, running Windows 7, 8, 10, and 11. The EA app for Mac is available to players on macOS Catalina or newer. What’s the difference between the EA app and Origin? The EA app is our latest platform. Origin for Mac continues to serve players on macOS Mojave and older. Has the EA app replaced Origin on PC and Mac? For Windows, yes, the EA app has replaced Origin. For macOS, we'll be supporting the EA app as our primary gaming destination, but Origin for Mac will continue to be available for Mac players on macOS Mojave and older. I’ve been asked to download the EA app, what should I expect? When you accept the invitation, the EA app download process will begin. Origin will be uninstalled automatically once the EA app launches — this ensures you will not experience any conflicts or errors related to having both clients installed on your computer simultaneously. Once you complete the process, your games and content will be ready for play. What will happen to the games I currently own on Origin for Mac? Games you’ve purchased will automatically transfer over. Contact us if anything appears to be missing from your library. Will I have to re-download my Origin games on the EA app? No. The games you’ve downloaded through Origin should be ready to launch through the EA app. If you find any of your games, DLC or other content missing from the EA app, please contact us so we can help resolve the issue. How do I log in to the EA app? Your EA Account is what you use today to log into Origin - just use the same credentials to log in to the EA app. What will happen to my data, purchases, and friends list? Your information (achievements, friends list, cloud data, purchases, in-game hours, & more) carries over when you log in to the EA app. If I play my EA games on Steam or Epic, do I need to download the EA app? The EA app is required in order to play EA games on PC. When you launch an EA title on Steam or Epic, we’ll provide guidance for installing the EA app (and uninstalling Origin if applicable) to ensure you can access & play your EA games. I need some more help. Who can I contact? You can contact us here. .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { width: 90%; margin: 0 auto; padding: 3rem 0; } @media screen and (min-width: 768px) { ea-section ea-section-column.eapl-section-column-50 { align-self: center; margin: 0; width: 50%; overflow: hidden; } .copy-copy ea-section ea-section-column.eapl-section-column-50 { align-self: start; } .asset-first .eapl-section-column-50:nth-of-