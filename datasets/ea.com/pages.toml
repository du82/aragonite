title = "About EA - Electronic Arts"
description = "Discover more about Electronic Arts, the engagements of the company, its purpose and beliefs."
full_description = '''About EA EA is a global leader in digital interactive entertainment. We are focused on building games and experiences that grow the global online communities around our key franchises and intellectual property, while deepening engagement through interactive storytelling. We develop and deliver games, content and online services for Internet-connected consoles, mobile devices and personal computers. Headquartered in Redwood City, California, we are recognized for a portfolio of critically acclaimed, high-quality brands such as EA SPORTS FC™, Battlefield™, Apex Legends™, The Sims™, EA SPORTS™ Madden NFL, Need for Speed™, Titanfall™, Plants vs. Zombies™ and EA SPORTS F1®. Our Products Discover Our Games → Discover Our Games Explore Our Subscriptions → Explore Our Subscriptions Learn About Our Technologies → Learn About Our Technologies Our People Creating next-level entertainment experiences that inspire players and fans requires people with a shared passion and unique perspectives. That's why we nurture environments where our teams can always bring their best to what they do. At Electronic Arts, everyone is part of the story. Part of a community that connects across the globe. A place where creativity thrives, new perspectives are invited, and ideas matter. A team where everyone makes play happen. At Electronic Arts, everyone is part of the story. Explore Careers People & Culture Executives Board of Directors Our Practices We create stories and deliver amazing experiences that resonate with audiences around the world and make an impact in the communities where we live, work and play. Our values and vision as a global company continue to drive us to create a welcoming workplace, foster inclusive communities, invest in the next generation of innovators and artists, and progress our environmental initiatives. You can follow our efforts through EA's annual Impact Report. Commitments Positive Play Player and Parental Tools Impact Report Social Impact Environment Our ongoing values Creativity Striving to bring imagination, original ideas, and excitement to everything we do. Pioneering Acting with the curiosity and courage that it takes to experiment, innovate, and lead. Passion We are at our best when we pursue what we love, and have fun doing it. Determination Bringing focus, drive, and conviction to our actions. Thriving on the journey, and being motivated to achieve excellence. Learning Listening, having humility, being open to new ways of thinking, and looking with a lens of inclusion. Challenging ourselves to grow and change as a company. Teamwork Committed to each other, and to the accountability and integrity it takes to be a successful diverse team. Latest EA News Our Ongoing Commitment to Positive Play and Welcoming, Safe Communities Electronic Arts Inc. Feb 28, 2025 Detailing EA’s efforts to create the best, most positive experiences for our players. Read More How new tech is empowering Madden, College Football Electronic Arts Inc. Feb 27, 2025 EA SPORTS Madden NFL 25 and College Football 25 feature the latest and greatest leaps in technology. Read More Madden Bowl’s crown jewel may be its music Electronic Arts Inc. Feb 7, 2025 EA SPORTS Presents Madden Bowl features Jelly Roll, Chris Stapleton, Shaboozey, Tucker Wetmore, and more. Read More Load More Key Information Founded 1982 Ownership Public Global Headquarters Redwood City, California Address Electronic Arts Inc. 209 Redwood Shores Parkway Redwood City, CA 94065 Consumer Purchases Residents in the United States, Canada or Japan contract with Electronic Arts Inc., 209 Redwood Shores Parkway, Redwood City, CA 94065, USA. Residents in any other country, then this Agreement is between you and EA Swiss Sàrl, Place du Molard 8, 1204, Geneva, Switzerland (CH-660-2328005-8). .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { width: 90%; margin: 0 auto; padding: 3re