title = "Dragon Age™: The Veilguard - EA Official Site"
description = "Dragon Age™: The Veilguard is available now. Learn more about the game and buy your copy today."
full_description = '''Learn More Unite the Veilguard and defy the gods in an immersive single-player RPG. Buy* Now Watch Latest Trailer Download Now Dragon Age: Vows & Vengeance Podcast In this immersive series a pair of heroes brought together by fate embark on a journey of revenge, redemption and love. Hear their story now RISE AS ROOK Be who you want to be and play how you want to play as you fight back and lead your team of seven companions, each with their own rich story. Together, you will become the Veilguard. Discover More KEY FEATURES Rise as Rook, Dragon Age’s newest hero. Be who you want to be and play how you want to play as you fight back and lead your team of seven companions, each with their own rich story. Together, you will become the Veilguard. Save a Battered World Thedas is home to storied factions like the heroic Grey Wardens and Tevinter's rebelious Shadow Dragons. Learn More Unite the Veilguard Unite a team of seven companions, each with rich lives, deep backstories, and their own expertise and unique abilities. Learn More Become the Leader Others Believe In Select from different races and combat classes, customize your appearance, and choose your character's backstory. Learn More LATEST DRAGON AGE™: THE VEILGUARD NEWS Dragon Age™: The Veilguard – Patch 5 Release Notes Jan 23, 2025 The release notes for Dragon Age™: The Veilguard’s fifth patch update. Learn More Journal #14 - New Trial with EA Play Dec 10, 2024 Try out Dragon Age: The Veilguard’s new demo Learn More Journal #13 - Dragon Age Day 2024 Dec 4, 2024 Thank you for joining us for DA Day 2024 Learn More # Join EA Play BUY DRAGON AGE™: THE VEILGUARD Unite the Veilguard and defy the gods in Dragon Age™: The Veilguard, an immersive single player RPG. Buy* Now FOLLOW US Sign-up for our newsletter to receive the latest products, events, news and promotions from Dragon Age™: The Veilguard and EA by email consistent with EA’s Privacy and Cookie Policy. Get your Rook's Coffer at the BioWare G