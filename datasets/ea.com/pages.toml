["https://ea.com/commitments/positive-play/player-and-parental-tools"]
title = "EA - Player and Parental Tools - Electronic Arts Official Site"
description = "We believe in the power of positive play. We want to give players and parents simple solutions to shape how they play."
full_description = '''Take control of your play Positive playing experiences and player tools go hand-in-hand. We believe in the power of positive play. Everyone should feel welcome, safe, and in control of their gaming experience. There are different ways to enhance and manage your and your family’s experience when playing games online. Check out our guidance on: Account and Platform Tools Game Tools Game Ratings Stay Safe Online Account and Platform Tools Account and Platform Tools When using EA’s online services, you can play, chat and, in some cases, share other content with players including friends. The first step in ensuring you, and your family, have a positive and safe experience when playing is understanding the tools available on your game platforms. Learn more about child and teen accounts and their default settings. How you can help keep your and your family’s EA accounts secure. Most major gaming platforms have player and family or parental controls that make it easy to create and manage family accounts. Choose the guide for your platform(s) here: EA app cta Apple parental controls Epic parental controls Google Play parental controls Nintendo Switch parental controls PlayStation parental controls Steam parental controls Xbox parental controls Game Tools Understanding In-Game Tools. At Electronic Arts, we want to empower our players and parents to make informed decisions about gameplay. FC Playtime was designed to help FC players understand and control how they play. Use it to get an overview of how much time you spend playing, the FUT packs opened, the FC Points purchased as well as to set limits to manage your engagement. Learn about FC Playtime Game Ratings Video Game Ratings Systems We know it’s important to understand and be comfortable with the video games you and your children are playing. Video game rating systems are designed to help players and parents make informed decisions about the games they choose for themselves or their children. All EA games are labeled with a rating that suggests an age for which the content may be most suitable, like you would see on a movie poster or streaming service. Ratings systems also give additional information on features, like in-game purchasing. Game ratings and content descriptors can vary by country. ESRB ESRB ratings have three parts: Rating Categories: The recommended age for players (E for Everyone, T for Teen, M for Mature) Content Descriptors:Information on whether the game contains violence, gore, drug and alcohol use, or swearing, for example. Interactive Elements: A heads-up on whether there is online chat, or in-game purchases. The ESRB’s primary mission is to help parents make informed decisions about the video games and apps their children play. Learn more about ESRB Electronic Arts Games & Ratings E for Everyone Content is generally suitable for all ages. May contain minimal cartoon, fantasy or mild violence and/or infrequent use of mild language. Browse Games Everyone 10+ Content is generally suitable for ages 10 and up. May contain more cartoon, fantasy or mild violence, mild language and/or minimal suggestive themes. Browse Games T for Teen Content is generally suitable for ages 13 and up. May contain violence, suggestive themes, crude humor, minimal blood, simulated gambling and/or infrequent use of strong language. Browse Games M for Mature Content is generally suitable for ages 17 and up. May contain intense violence, blood and gore, sexual content and/or strong language. Browse Games Stay Safe Online Stay Safe Online Be Discreet Consider carefully who you share your information with. Avoid sharing personal or private information online, including when creating your EA ID. Never share anything that could be used to locate you or another person in real life, such as a full name, email address, home address or phone number. People may act differently IRL than they do online. If you want to meet someone IRL that you’ve been talking to online, always let a friend, parent or guardian know. Be Secure Ensure your system is up-to-date and protected by using security software (such as virus and malware scanners). Do not open, reply to or forward an email or attachment unless you know the person who sent it to you, and you’ve checked it for viruses. The content could contain damaging software (such as spyware or viruses) or it might be offensive. Be Positive Treat others with respect and don’t be afraid to call out bad behavior. Learn more about our Positive Play Charter and how to report players. We're Commited to Positive Play Keeping Things Fair with EA anticheat System for PC Accessibility Sep 13, 2022 EA anticheat for PC, a new technology, lets us keep the game fair and protect you from other gamers using exploits. Číst dál Strengthening Our Commitments to Accessibility and Inclusion Accessibility Oct 27, 2021 To inspire the world to play, we must design stories, characters, experiences and services that resonate with all players. Číst dál Using our patents to drive positive play Accessibility Aug 25, 2021 Announcing a new patent pledge aimed at sharing some of our most innovative technology. Číst dál More Positive Play Stories .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { width: 90%; margin: 0 auto; padding: 3rem 0; } @media screen and (min-width: 768px) { ea-section ea-section-column.eapl-section-column-50 { align-self: center; margin: 0; width: 50%; overflow: hidden; } .copy-copy ea-section ea-section-column.eapl-section-column-50 { align-self: start; } .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { padding: 0 2rem; margin: 0; width: 50%; } .dx-video-asset ea-media ea-html5-video { margin-bottom: -10px; } } @media screen and (min-width: 1024px) { .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section