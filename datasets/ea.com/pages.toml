["https://ea.com/careers"]
title = "Careers at Electronic Arts - Start your Job Search - Official EA Site"
description = "Join EA and let's make play happen. Search for the latest job openings at Electronic Arts."
full_description = '''At Electronic Arts, everyone makes play happen. We create next-level entertainment experiences that inspire players and fans around the world. Here, everyone is part of the story. Part of a community that connects across the globe. A place where creativity thrives, new perspectives are invited, and ideas matter. A team where everyone makes play happen. Explore opportunities Meet your future team. <b>EA Studios</b> We are among the largest video game development organizations, with over 8,000 game makers. We work in a huge variety of fields from art, storytelling, game direction, audio, script, programming, and design. Learn more <b>Technology</b> Our Technology teams are the innovative backbone behind every endeavor at EA. They connect, protect, and enable all our orgs to power play. Learn more <b>Marketing, Brand & Publishing</b> Our Experiences Org drives meaningful fan relationships and business impact through Publishing, optimizes customer journeys with Fan Growth, harnesses community power with Ventures, crafts compelling narratives with EA Brand Communications & Impact, and ensures operational excellence through the Office of the CXO. Learn more <b>Customer Experience</b> Our Customer Experience team, also called Fan Care, helps the world play by offering support in 13+ languages across the world from EA Help. See open roles <b>Quality Verification & Standards</b> Quality Verification & Standards (QVS) is driven by our vision to build games better. Our strategy starts with driving quality upstream and guiding game teams, unlocking our ability to focus on experiential quality through stable software. See open roles <b>People Experience</b> At EA, our people matter more than anything. People Experience help find, promote, support, and build spaces for the incredible people who inspire the world to play. See open roles <b>Finance</b> EA’s Finance team provides invaluable support and guidance across all organizations to drive EA’s digital transformation. See open roles <b>Legal & Player Policy</b> Our Legal team delivers practical risk-management solutions, enabling our teams to focus on enhancing gaming experiences, while our Player Policy, Safety, and Inclusion team ensures our games remain welcoming and safe for all players through expert guidance and best practices. See open roles Where you can find us. <b>All Locations</b> Learn more <b>The Americas</b> See locations <b>Asia-Pacific</b> See locations <b>Europe</b> See locations Get ready for your interview with EA. We know the process can be intimidating, but we're here to help you get in the game. What to expect Start your story with us. Learn more about early careers Why EA? We nurture an inclusive environment where our teams can always bring their best to what they do. Learn more Equal Opportunities EA is an equal opportunity employer. All employment decisions are made without regard to race, color, national origin, ancestry, sex, gender, gender identity or expression, sexual orientation, age, genetic information, religion, disability, medical condition, pregnancy, marital status, family status, veteran status, or any other characteristic protected by law. We will also consider for employment qualified applicants with criminal records in accordance with applicable law. EA also makes workplace accommodations for qualified individuals with disabilities as required by applicable law. Accessibility EA has taken efforts to ensure that our on-line application system is accessible to individuals with disabilities and disabled veterans. Applicants with disabilities may contact us by sending an email to accessibility@ea.com for assistance accessing our careers.ea.com website. In your email, please include your name and preferred method of contact, and EA will respond as soon as possible. Important Recruitment Scam Alert Learn More Recruitment Scam Alert We are aware that individuals claiming to be either Electronic Arts (EA) employees or companies authorized to speak on our behalf have been fraudulently contacting prospective candidates with fictitious job opportunities and soliciting personal information directly through email or via third-party online platforms, including LinkedIn and Telegram. We take this fraud very seriously and are working with third-party platforms to investigate and remove fake profiles. Please read below for ways to check the authenticity of communications and protect yourself from these scams. There are a number of signs that a recruitment communication is fraudulent, including requests for money or funds (such as for visa fees, taxes, travel expenses) and requests for personal information (such as passport information, bank account information, credit card numbers, social security numbers). EA employees will never ask you for money or to provide personal financial information during our recruiting process. All EA employment offers will come only from someone using an official EA email address with one of the following domain names: ea.com (including contractor.ea.com and europe.ea.com) dice.se bioware.com respawn.com criteriongames.com frostbite.com popcap.com maxis.com codemasters.com glu.com metalheadsoftware.com playdemic.com avature.net If you believe you’ve received unauthorized or fraudulent communications, we recommend that you do not respond. If you suspect but are unsure, you can confirm the email address of the person contacting you and know that anyone contacting you claiming to work for EA must have an official EA email address using one of the above domain names. You will not receive an offer or employment contract from EA without first being in contact with an EA representative from one of the above email addresses. You can also review the LinkedIn profile of the individual – many of our EA recruiters use the verification feature to confirm they are with EA; however, the best way to verify the communication is legitimate is to ensure the email address contains one of the domain names above. Please notify us of any fraudulent representation by sending an email to RecruitmentFraudReports@ea.com. .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { width: 90%; margin: 0 auto; padding: 3rem 0; } @media screen and (min-width: 768px) { ea-section ea-section-column.eapl-section-column-50 { align-self: center; margin: 0; width: 50%; overflow: hidden; } .copy-copy ea-section ea-section-column.eapl-section-column-50 { align-self: start; } .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { padding: 0 2rem; margin: 0; width: 50%; } .dx-video-asset ea-media ea-html5-video { margin-bottom: -10px; } } @media screen and (min-width: 1024px) { .asset-first .eapl-section-column-50:nth-of-type(2), .copy-first .eapl-section-column-50:nth-of-type(1), .copy-copy .eapl-section-column-50 { padding: 0 6rem; } } ea-section-column.eapl-section-column-100 img,ea-section-column.eapl-section-column-50 img,ea-section-column.eapl-section-column-66 img { max-width: 100%; } .dx__anchor-nav { display: flex; align-items: stretch; justify-content: center; align-content: center; list-style-type: none; margin: 0; padding: 0; } .dx__anchor-nav__link { display: flex; align-items: center; font-family: var(--ea-theme-secondary-font-family); text-transform: uppercase; font-size: 1.2rem; line-height: 1.1; font-weight: bold; text-align: center; padding: 0 2rem; margin: 0; border-right: 1px solid var(--dx-anchor-nav-separator-color); white-space: nowrap; } .dx__anchor-nav__link::before { content: ""; } .dx__anchor-nav__link:last-child { border: none; } .dx__anchor-nav__link a { text-decoration: none; line-height: 1; transition: linear all 0.25s; webkit-transition: all .25s linear; moz-transition: all .25s linear; ms-transition: all .25s linear; o-transition: all .25s linear; color: var(--dx-anchor-nav-color); } .dx__anchor-nav__link a:hover { transform: translatey(-2px); color: var(--dx-anchor-nav-hover-color); } @media only screen and (max-width: 1158px) { .dx__anchor-nav__link { font-size: 1rem; padding: 0 1.5rem; } } @media only screen and (max-width: 960px) { .dx__anchor-nav__link { font-size: 1rem; padding: 0 1rem; } } @media only screen and (max-width: 846px) { .dx__anchor-nav__link { font-size: 0.8rem; padding: 0 1rem; } } @media only screen and (max-width: 767px) { .dx__anchor-nav { flex-direction: column; } .dx__anchor-nav__link { display: block; text-transform: uppercase; font-size: 1.125rem; letter-spacing: 0.05rem; text-align: center; padding: 14px 0; border: none; border-bottom: 1px solid var(--dx-anchor-nav-separator-color); } } window.addEventListener('load', () => { function scrollToAnchorAfterLoad() { const { hash } = document.location; if (hash) { const element = document.querySelector(hash) || document.querySelector('iron-pages div.iron-selected'); element.scrollIntoView({ behavior: 'smooth' }); } } setTimeout(scrollToAnchorAfterLoad, 500); }); .ea-play-section { background: rgb(13,16,66); background: linear-gradient(60deg, rgba(13,16,66,1) 0%, rgba(13,16,66,1) 50%, rgba(255,71,71,1) 100%); border: 3px solid rgb(255, 255, 255); border-radius: 3rem; width: 98%; margin: 3rem auto; padding: 0; position: relative; overflow: hidden; }'''
