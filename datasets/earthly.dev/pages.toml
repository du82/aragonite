["https://earthly.dev/earthfile/satellites/pricing"]
title = "Pricing - Better SDLC"
description = "Achieve engineering excellence that is out of this world. Earthly Lunar helps you take control of your complex diverse tech stack with a rich ecosystem of plugins and custom guardrails you define to ensure quality throughout the development lifecycle."
full_description = '''Build at the Speed of Light Ship CodeFaster Leverage automatic caching and parallelism to accelerate builds by 2-20x compared to traditional CI/CD platforms. EffortlessConfiguration Earthly Satellites automatically cache every step in your Earthfile—no need for custom configurations, special build tooling, or costly cache downloads from container registries. Secure,In Your Environment Choose Self-Hosted or BYOC (Bring Your Own Cloud) plans to ensure your builds remain secure, with all data staying within your infrastructure. MaximizeProductivity Earthly Satellites focus on developer efficiency. For a 30-person team, a 2.8x speed boost in CI/CD delivers productivity gains equivalent to adding two full-time engineers—without the overhead. Earthly Satellites Pricing Self-Hosted BYOC Self-Hosted Earthly Satellites managed by you in your own infrastructure. Deploy in your own VMs or Kubernetes cluster. Free For hobby projects and small teams Get Started Free Up to 5 users Satellites x86 and arm64 Managed TLS Log Sharing Earthly Cloud Secrets Integrated Github Actions runner Enterprise For large teams with security requirements Contact Us Everything in Free plus: Unlimited users Managed TLS with automatic key rotation Unlimited log retention Coming soon Third-Party Secrets Integrations Coming soon Export build analytics 24/7 support and a dedicated Slack channel BYOC Earthly Satellites fully managed by us in your own AWS account. Enterprise A convenient cloud-like experience, with a fully secure on-prem deployment. Contact Us Unlimited users Fully-managed, single-tenant satellite fleet Auto-sleep cost-saving features x86 and arm64 xsmall to 3xlarge size instances Custom satellite specs Managed TLS with automatic key rotation Integrated Github Actions runner Unlimited log retention Coming soon Third-Party Secrets Integration Coming soon Export build analytics 24/7 support and a dedicated Slack channel Frequently Asked Questions What are Satellites? Satellites are remote build runners that speed up builds with Earthly’s caching and parallelization. Available via BYOC or Self-Hosted, they integrate with CI systems and local workflows to:Enhance CI with caching and parallelism.Share compute and cache across the team.Enable cross-platform builds (e.g., x86 on ARM). What is BYOC? BYOC stands for “Bring Your Own Cloud,” a service model that combines the benefits of on-premises deployment with the convenience of vendor management for a cloud-like experience. With our BYOC plan, you provide Earthly with access to your AWS account using a strict IAM role that you own. Is BYOC as secure as Self-Hosted? The IAM role you grant us allows Earthly to create and manage EC2 instances within a specific VPC. However, this role does not grant Earthly connection access to the instances themselves or to their internal cache data. For more details, refer to our BYOC documentation. That said, organizations with strict compliance requirements may prefer the Self-Hosted option, which ensures that satellites are fully controlled by your team alone. How are users tracked? The number of users is tracked by monitoring who triggered a Satellite build at least three times during a month. Builds may be triggered either directly by the user in their terminal, or indirectly by pushing code to a repository, and that push being picked up by a CI that uses Earthly Satellites to perform the build. In the latter case, the triggering user is inferred via commit metadata. The triggering user does not have to be a user registered with Earthly. In some cases, if the triggering user cannot be inferred from commit metadata, then the user logged into Earthly CLI in the CI run is used as the triggering user. If you would like to estimate the number of users that a project has according to how we track users, please check out the github.com/earthly/lib/billing+active-users target. How does the Auto-Sleep feature save costs? In the BYOC plan, Satellites will automatically enter a sleep state when they have been inactive for at least 30 minutes. This state is shown in the Earthly CLI when you list or connect to your satellites. If a build is started while a Satellite is in a sleep state, the Earthly backend will automatically wake the instance back up before allowing the build to start. Note that this feature is unavailable in the Self-Hosted plans. How many Satellites do I need? The number of satellites you need depends on the workload they need to handle. For maximum performance, you can create a different satellite for each CI pipeline. This may be overkill for some setups though, where CI pipelines are small. The best method to determine the number of satellites you need is to start with one or two and add more as needed. Earthly prints information on build startup about how loaded the Satellite is currently. This can be used as a guide to determine if more Satellites are needed. You can read more about tuning your satellites in our best-practices guide. How do I deploy a Self-Hosted Satellite? Self-Hosted satellites are deployed using our official Docker image. You can run this image as a container in your own infrastructure, such as on a dedicated VM or as a Pod in a Kubernetes cluster. See our Self-Hosted Satellites documentation for more details. document.addEventListener('DOMContentLoaded', function () { scrollToFAQ(window.location.hash.substring(1)) }) function scrollToFAQ(id) { let element = document.querySelector(`[data-id="${id}"]`) if (element) { toggleFAQ(element.parentElement.parentElement) window.scrollTo({ top: element.getBoundingClientRect().top - 200 }) } } function toggleFAQ(elem) { if (elem.parentElement.classList.contains('open')) { elem.parentElement.classList.remove('open') } else { elem.parentElement.classList.add('open') } } const selfHosted = document.getElementById("self-hosted") const byoc = document.getElementById("byoc") function handleCheckboxChange(checkbox) { const selfHostedLabel = checkbox.parentElement.previousSibling.previousSibling const byocLabel = checkbox.parentElement.nextSibling.nextSibling if (checkbox.checked) { selfHostedLabel.classList.replace("text-gray-900", "text-[#9CA3AF]") byocLabel.classList.replace("text-[#9CA3AF]", "text-gray-900") selfHosted.classList.add("hidden") byoc.classList.remove("hidden") } else { selfHostedLabel.classList.replace("text-[#9CA3AF]", "text-gray-900") byocLabel.classList.replace("text-gray-900", "text-[#9CA3AF]") selfHosted.classList.remove("hidden") byoc.classList.add("hidden") } } document.querySelectorAll("#toggle-switch").forEach(checkbox => { checkbox.addEventListener("change", () => handleCheckboxChange(checkbox)) })'''
