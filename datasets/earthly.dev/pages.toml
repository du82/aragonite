full_description = "Earthly Privacy Policy 2020-12-01 Earthly Technologies Inc. (“Earthly,” “we,” “our,” and/or “us”) values the privacy of individuals who use our websites (including https://earthly.dev), applications, or services that link to this Privacy Policy (collectively, our “Services”). This privacy policy (the “Privacy Policy”) explains how we collect, use, and disclose personal information from users of our Services. By using our Services, you agree to the collection, use, and disclosure of your personal information as described in this Privacy Policy. Beyond this Privacy Policy, your use of our Services is also subject to our Terms of Service. Information We Collect We may collect a variety of personal information from or about you or your devices from various sources, as described below. A. Information You Provide to Us Registration. When you register for an account to use our Services, we ask you for your personal information, including your name, and email address. Communications. If you contact us directly, we may receive additional personal information about you. For example, when you contact us for support, we may receive your name, email address, and the contents of your message. If you subscribe to our newsletter or signup for our waitlist, we will receive your name and email address. Making a Purchase. When you upgrade to an Earthly Cloud Paid Tier account with our Services, your credit card information, billing information, and any other financial information necessary to complete your purchase (“Payment Information”) is processed by our third-party payment processor, and we do not collect, store, or process your Payment Information. For more information, please see the “Payment Processing” section below. Careers. If you decide to apply for a job with us, you may submit your contact information and your resume online. We will collect the personal information you choose to provide on your resume, such as your education and employment experience. If you apply for a job with us through a third-party platform (such as AngelList or LinkedIn), we will collect the personal information you make available to us through such third-party platform. B. Information We Collect When You Use Our Services Location Information. When you use our Services, we may receive your precise location information. We also infer your general location information (for example, your IP address may indicate your general geographic region). Device Information. We receive information about the device and software you use to access our Services, including internet protocol (IP) address, web browser type, install ID, and operating system version. Usage Information. To help us understand how you use our Services and to help us improve them, we automatically receive information about your interactions with them, such as the length of time you spend on a page, objects such as hyperlinks you click on, the dates and times of your visits, the actions you perform using the Earthly command-line interface (CLI), a hashed version of the Git repository remote URL that you are using, and the dates and times of the actions. Information from Cookies and Similar Technologies. We and our third-party partners may collect information using cookies, pixel tags, or similar technologies. Our third-party partners, such as analytics and advertising partners, may use these technologies to collect information about your online activities over time and across different services. Cookies are small text files containing a string of alphanumeric characters. We may use both session cookies and persistent cookies. A session cookie disappears after you close your browser. A persistent cookie remains after you close your browser and may be used by your browser on subsequent visits to our Services. Please review your web browser’s “Help” file to learn the proper way to modify your cookie settings. Please note that if you delete or choose not to accept cookies from the Services, you may not be able to utilize the features of the Services to their fullest potential. C. Personal Information We Receive from Third Parties Partners. We may receive personal information about you from third parties such as data or marketing partners and combine it with other personal information we have about you. D. Payment Processing When you purchase products through our Services, your payment is processed by a third-party payment processor such as Stripe (“Payment Processor”). This Payment Processor may collect personal information from you, including your name, email address, billing address and Payment Information in connection with your purchase. The use of your personal information by the Payment Processor is governed by its terms and conditions and privacy policy, and personal information we receive about you from our Payment Processor is governed by this Privacy Policy. How We Use the Personal Information We Collect We use the personal information we collect: To provide, maintain, debug, improve, and enhance our products and the Services; To understand and analyze how you use our Services, and develop new products, services, features, and functionality; To understand and analyze usage patterns; To communicate with you, provide you with updates and other information relating to our Services, provide information that you request, respond to comments and questions, and otherwise provide customer support; To facilitate transactions and payments; For marketing purposes, such as developing and providing promotional and advertising materials that may be useful, relevant, valuable, or otherwise of interest to you; To find and prevent fraud, and respond to trust and safety issues that may arise; For compliance purposes, including enforcing our Terms of Service or other legal rights, or as may be required by applicable laws and regulations or requested by any judicial process or governmental agency; and For other purposes for which we provide specific notice at the time the personal information is collected. How We Share the Personal Information We Collect We do not share or otherwise disclose personal information we collect from or about you except as described below or otherwise disclosed to you at the time of the collection. Affiliates. We may share personal information we receive with our affiliates for any of the purposes described in this Privacy Policy. Vendors and Service Providers. We may share any personal information we receive with vendors and service providers retained in connection with the provision of our Services. Marketing. We do not rent, sell, or share personal information about you with nonaffiliated companies for their direct marketing purposes unless we have your permission. Analytics Partners. We may use analytics services such as Google Analytics and Segment to collect and process certain analytics data. These services may also collect information about your use of other websites, apps, and online resources. You can learn about Google’s practices by going to https://www.google.com/policies/privacy/partners/, and opt-out of them by downloading the Google Analytics opt-out browser add-on, available at https://tools.google.com/dlpage/gaoptout. Social Networks and Other Online Services. Our Services allow you to, upon your direction, share personal information with social networking services, such as Twitter and Github. You understand and agree that the use of your personal information by any social networking websites will be governed by the privacy policies of these third-party platforms and your settings on that platform. We encourage you to review their privacy policies before sharing your personal information with them. As Required by Law and Similar Disclosures. We may access, preserve, and disclose your personal information if we believe doing so is required or appropriate to: (a) comply with law enforcement requests and legal process, such as a court order or subpoena; (b) respond to your requests; or (c) protect your, our, or others’ rights, property, or safety. Merger, Sale, or Other Asset Transfers. We may transfer your personal information to service providers, advisors, potential transactional partners, or other third parties in connection with the consideration, negotiation, or completion of a corporate transaction in which we are acquired by or merged with another company or we sell, liquidate, or transfer all or a portion of our assets. Consent. We may also disclose your personal information with your permission. Your Choices Marketing Communications. You can unsubscribe from our promotional emails via the link provided in the emails. Even if you opt-out of receiving promotional messages from us, you will continue to receive administrative messages from us. Location Information. You can prevent your device from sharing precise location information at any time through your device’s operating system settings. However, location information may be core to our Services and without it, you may not be able to successfully use our Services. Usage Information. You can opt-out of certain behavioral tracking of the Earthly command-line interface (CLI) via the tracking opt-out configuration parameters. Do Not Track. There is no accepted standard on how to respond to Do Not Track signals, and we do not respond to such signals. Third Parties Our Services may contain links to other websites, products, or services that we do not own or operate. We are not responsible for the privacy and advertising practices of these third parties. Please be aware that this Privacy Policy does not apply to your activities on these third-party services or any personal information you disclose to these third parties. We encourage you to read their privacy policies before providing any personal information to them. Security We make reasonable efforts to protect your personal information by using physical and electronic safeguards designed to improve the security of the personal information we maintain. However, as no electronic transmission or storage of personal information can be entirely secure, we can make no guarantees as to the security or privacy of your personal information. International Visitors Our Services are hosted in the United States and intended for visitors located within the United States. If you choose to use our Services from the European Union or other regions of the world with laws governing data collection and use that may differ from U.S. law, then please note that you are transferring your personal information outside of those regions to the United States for storage and processing. Also, we may transfer your data from the U.S. to other countries or regions in connection with storage and processing of data, fulfilling your requests, and operating the Services. By providing any information, including personal information, on or to our Services, you consent to such transfer, storage, and processing. Children’s Privacy We do not knowingly collect, maintain, or use personal information from children under 13 years of age, and no parts of our Services are directed to children. If you learn that a child has provided us with personal information in violation of this Privacy Policy, then you may alert us at support@earthly.dev. Pose a Question If you have questions about your privacy on the Services or this Privacy Policy, please contact us at support@earthly.dev. Changes to this Privacy Policy We will post any adjustments to the Privacy Policy on this page, and the revised version will be effective when it is posted. If we materially change the ways in which we use or share personal information previously collected from you through our Services, we will attempt to notify you through our Services, by email, or other means. Contact Information Earthly is responsible for processing your information. If you have any questions, comments, or concerns about our processing activities, please email us at support@earthly.dev or write to us at: Earthly Technologies Inc. 548 Market St PMB 46629 San Francisco, California 94104-5401 US"
