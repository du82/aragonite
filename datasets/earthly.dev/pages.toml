full_description = "Blog / Series / Big Builds Table of contents Bazel Build?HistoryOpen SourcingWhen To UseWhen to Use Bazel - Oscar’s OpinionWhen to Use Bazel - Jason’s OpinionBazel Case StudiesCase Study: Netflix RecommendationsBazel Build Time Expectations - TweagBazel Case Study: Open SystemsBazel Migration TipsBazel Case Study: TinkBazel Migration TipsMigration Challenge: JavaMigration Challenge: JavaScriptMigration Tip: C++Migration Warning: OverheadMigration Challenge: Writing And Maintaining Build FilesMigration Helper: GazelleThe Future of BazelConclusion Related ‣ Monorepo with Bazel ‣ Pants and Bazel's History ‣ Build Java Projects In this Series Bazel When to use Bazel? Building a Monorepo with Bazel Using Bazel to Improve Your Automated Test Suite Pushing Docker Images With Bazel Using Bazel Bazel and Python Bazel and Rust Bazel and Node.js Bazel and GoLang Bazel and TypeScript Large Scale Builds Monorepo Build Tools Pants for Python - Interview Learn More About Earthly Earthly makes builds super simple. Learn More When to use Bazel? 49 minute read Updated: July 11, 2023 Adam Gordon Bell In this Series In this Series Bazel When to use Bazel? Building a Monorepo with Bazel Using Bazel to Improve Your Automated Test Suite Pushing Docker Images With Bazel Using Bazel Bazel and Python Bazel and Rust Bazel and Node.js Bazel and GoLang Bazel and TypeScript Large Scale Builds Monorepo Build Tools Pants for Python - Interview Table of Contents Bazel Build?HistoryOpen SourcingWhen To UseWhen to Use Bazel - Oscar’s OpinionWhen to Use Bazel - Jason’s OpinionBazel Case StudiesCase Study: Netflix RecommendationsBazel Build Time Expectations - TweagBazel Case Study: Open SystemsBazel Migration TipsBazel Case Study: TinkBazel Migration TipsMigration Challenge: JavaMigration Challenge: JavaScriptMigration Tip: C++Migration Warning: OverheadMigration Challenge: Writing And Maintaining Build FilesMigration Helper: GazelleThe Future of BazelConclusion The article provides an in-depth analysis of the Bazel build system’s complexities. Earthly streamlines the build process, presenting a straightforward alternative to Bazel’s complex configuration. Learn more about Earthly. Bazel Build? Here at Earthly, we care a lot about builds and talk to many people about their struggles with builds and CI. A frequent topic of conversation, especially if an organization has a monorepo and more than 500 developers, is Bazel, Google’s open-sourced monorepo build system. I’ve never worked at Google or anywhere using Bazel to drive their builds, and so while I can walk through a Bazel tutorial, I felt like I was missing the sense of what using Bazel was like, both the day-to-day and migrating to Bazel. So I interviewed 6 Bazel experts1 and asked them what they like about Bazel, when they would use it, and what to expect or consider before doing a Bazel migration. Read this if you are considering Bazel and also if you’d like to read gory details of several Bazel migrations, including the level of effort and the results. The experts all have experience moving to Bazel and using it day-to-day., including two people who do Bazel migrations for a living, at least one Bazel contributor, and one person, Oscar Boykin, who has been on Bazel projects at Twitter, Stripe, and Netflix. It’s a long read, and I promise, it’s worth it. The short version is: Bazel can solve large monorepo build problems very well, but it has a steep adoption curve. History Bazel is based on some simple but powerful ideas. Here is Oscar Boykin2 explaining: The idea of Bazel is we’re gonna actually build things correctly. Your build is a pure function. There’s sources that come in, and then the artifacts go out. And if the sources are the same, the artifacts that pop out the other side will be bit-for-bit identical. That’s really cool. And so the pitch of Bazel is that we will be fast by being correct. At Google scale, they can’t afford not to cache. And the only way caching is safe is if it’s correct. So the idea is speed-through-correctness. Whereas a lot of people viewed them in tension with one another. Every programmer has the experience of saying, ‘oh the build, broke! Let’s just clean it.’ It’s like the reboot of like builds. It’s awful. Why should you have to reboot your build? So with Bazel, you don’t have to do that. You really can build without cleaning. That’s amazing. I mean, it’s sad that that’s the bar, but it’s real, and so Bazel really delivers on that. Back in the early days of Google, Bazel was designed to replace a giant makefile. A long time ago, Google built its software using large, generated Makefiles. These led to slow and unreliable builds, which began to interfere with our developers’ productivity and the company’s agility. Bazel was a way to solve these problems. Google needed Bazel at the time because they had a large monorepo that contained large amounts of C++, and Java code, and they wanted a uniform, correct and performant way to build and test all this code. Son Luong Ngoc3, a scalable build consultant at Qarik Group, says many larger companies are starting to hit these problems. So your backend might be in Go or Java, right? There’s a front end in react JS. And oh, those data science guys are using Python and Scala, right? And here, these infra people are using Go, Rust, C, C++, and Lua, right? How do you glue all that together to create a cohesive developer experience? A lot of enterprises in recent years start reaching this scale. So previously, nobody was reaching this scale before, except mostly Google and Facebook. They were about eight to 10 years ahead of the rest of the market. So they actually care about this kind of problem. But now everybody [else] is catching up. As people left Google and worked at places with large monorepos, they ended up writing ports of Bazel. Pants was a Bazel clone used at Twitter and Foursquare. Buck was a Bazel clone built at Facebook. Others like Alibaba or Netflix, who didn’t have a monorepo or as many languages in use, built their own solutions that tackled problems differently. Son: So yes, folks actually built their own, but these are very expensive. Like you, you need a team the size of a small startup to build this kind of platform. Nobody’s got the money or time for that, right? They want to focus on the business objective. Open Sourcing Then Bazel was open-sourced. That’s when Son saw this idea spread: Dropbox becomes one of the very first adopters of Bazel and then BMW. And then, slowly, slowly, the ecosystem starts to converge around Bazel. It’s not just multi-language changes that force large companies onto Bazel. It’s also a monorepo with many services in it. Son hit this at Booking.com with one of their monorepos: We started with every push going directly into trunk, which is our main branch of the monorepo, and each was creating about 120 CI jobs, and I was the guy who was told to take all those 120 jobs and try to make something reasonable out of them using a dynamic CI pipeline. And I also managed a whole fleet of GitLab runners and our setup for artifactory. So I was the person who was on call when our CI system got DDoS by our developers [ committing too fast] or when our CI system was DDoSing our GitLab instance because every single push was creating hundreds of containers [for testing] and just fetching the code took down our GitLab storage layer. How do we scale that up? So eventually, we were like: Hey, maybe capturing dependency information from production in our CI is not the way to go. Maybe we should do declarative dependencies within our code base of this monorepo, and Bazel became a perfect fit. When To Use When to Use Bazel - Oscar’s Opinion Oscar’s a Bazel contributor who’s been involved in Bazel projects at Twitter, Stripe, and Netflix. He got involved with Bazel in an fascinating way: So I joined Twitter in 2011. And so I saw Pants kind of grow up. And then, in 2015, Bazel was open-sourced. And so we asked the question should we adopt Bazel? And because I wasn’t that vested in the Pants side, I was like part of the crew that investigated Bazel. And that’s when I became very impressed with Bazel. I thought it had really great design and all the principles were really good. And so I actually wrote the first Scala rules. And then those became what’s called the rules_scala, and pretty much I think most everybody who’s using Bazel with Scala uses those rules. And we used those [rules] in production at Stripe, I joined Stripe in very early 2016, and we’re using them at Netflix, so I’ve got a lot of experience with [Bazel]. Bazel is a very specific tool. Oscar thinks it would be a mistake to adopt it if you don’t really need it. Would I recommend [Bazel]? I would not. You know that scene in the fellowship of the ring [where] they’re saying should they go under a mountain, and [Gandalf] is like, no, I would not take that route unless there was no other opportunity? Basically, Bazel is that: don’t use it unless you have to. So if you’re only working in one language and you have a relatively small amount of code, let’s say like less than a hundred thousand lines, I almost certainly would not use Bazel if it were me. If I were working on an open-source library, I almost certainly wouldn’t use it because Bazel’s not so great at publishing reusable libraries for others. You can publish deployable artifacts fairly easily, but it’s not great right now, maybe won’t ever be great, at publishing reusable libraries. When would I definitely use it? I would definitely, unfortunately, use it when I had a million lines of code or more. If you have multiple languages that you have dependencies between – like in our [Netflix] case, we’re doing a lot of machine learning, but we do data processing in Scala, but we then package up some apps that have like Python for model scoring or model training – so there are dependencies because these systems pass data between one another, maybe then you want to consider Bazel. Each of these would be like maybe-Bazel? And if you accumulate enough of them, you give Bazel a try. I think once you get over like 5 million lines of code, I really wouldn’t do anything other than Bazel. It’s almost the only game in town. When to Use Bazel - Jason’s Opinion Not everyone would wait for millions of lines to use Bazel, though. Jason Steving4, an ML Compiler Engineer on the TensorFlow team at Google, has a different take: Always. Always use Bazel. So I come with a super biased opinion on that that I think that building a monorepo only has benefits for code reuse. Whereas the alternative is difficult to work with. Here’s where I’m gonna struggle to give you any like good counter advice is like, I haven’t really used other build systems that much. I left Google a year ago, and I worked at Amazon for like eight months, and I did use their build system there. And I have since come back to Google because honestly, one of the big portions I hated [was] the build system. Amazon, at least Prime Video, they absolutely do not reuse code. Everyone rewrites the same thing, no matter how trivial the code is. It’s such a bad practice. Like for very simple things like, oh, this is gonna customize my login, and everyone needs to do it - everyone writes that code. Literally, they will copy-paste it. That grated against my soul! And that happens because they were using this build system that like was built around this idea of copying files. And you had to tell it where a file is. So you had to then end up duplicating their build file because they would copy all their files, and then whatever thing they did to generate code, you need to also do in yours to generate code. Whereas in Bazel, if you generate code, there’s a target for it. You just depend on the target, and you get the generated code. So, in my experience, if your project gets significant, beyond a few files, I think you’re already ready for Bazel. Like if you have more than one package of code, like a Java package, and especially if you do code gen, then you are ready for Bazel. I don’t think Jason’s opinion is rare within Google. Bazel, as Blaze, was created to solve the challenges of Google’s code base, so it’s no surprise that it works well there and that people who’ve spent a lot of time using it make a strong case for everyone using it. But other places seem to do well without Bazel, Son says: I’ve been through multiple organizations over the past few years. Alibaba was a multi-repo shop [and] they can succeed with a multi-repo setup. They don’t need something like Bazel [because] they completely survive [using] Maven and Spring Java. So it’s very clear to me that Bazel is not the key to success. There are startups out there that only use one language or one software stack, and that’s very easy to build. It’s a trade-off between costs and [the] return on investment, and the organization needs to make that call. I have seen a range of customers who arrive at different answers in terms of addressing problems of scale. Bazel Case Studies Case Study: Netflix Recommendations Netflix is a multi-repo company where Java code predominates. But as Oscar shares, even in a multi-repo organization, certain code bases can start getting pretty big and slow to build. I work at Netflix, and Netflix mostly has a multi-repo style. They are very famous for the kind of freedom and responsibility culture. So each team pretty much can do what it wants. I work on the recommendations algorithms, and the team I’m on, somewhat recently, merged several different algorithms that are part of the whole recommendations product into one team and one repo. And so it’s not all of Netflix, but it has a kind of monorepo feel about it because several unrelated projects got jammed into one repo and the build performance was pretty bad. So I had used Bazel previously, and I was like, you know what, I don’t wanna mess with this. I’ll just keep working, you know, we’ll just keep using it, and I just won’t get involved – I won’t get pulled into this again. But the CI times were so long. I mean, we were like maybe 250,000 lines of code, maybe 300,000 lines of code in this repo. It’s not a gargantuan amount of code. And the CI times are like 45 minutes in some cases, sometimes an hour, and it was really affecting productivity. And so then we are faced with this question that a lot of people don’t think about if they’re working in small orgs or [in] small repos. The problem Oscar’s team was having was conflicting code getting merged in. Your PR can be green, and my PR can be green. But if you merge both of them, that will break the build, right? Because like they actually conflict. And that was hitting us more and more frequently that someone would make an incompatible change in their PR. the CI would be green, and the other one would be green. Now it’s like 45 minutes. They don’t really want to fool with it. They go ahead and merge it. And we detect failures later because we also run a"
