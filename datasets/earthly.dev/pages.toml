title = "With $6.5M in New Funding, Earthly Introduces Fast, Repeatable & Easy-to-Use SaaS CI/CD Platform - Better SDLC"
description = "Achieve engineering excellence that is out of this world. Earthly Lunar helps you take control of your complex diverse tech stack with a rich ecosystem of plugins and custom guardrails you define to ensure quality throughout the development lifecycle."
full_description = 'Newsroom February 23, 2023 - Business Wire With $6.5M in New Funding, Earthly Introduces Fast, Repeatable & Easy-to-Use SaaS CI/CD Platform Round Led by Innovation Endeavors, New Platform Streamlines Debugging & Iteration by Letting Developers Build & Test CI Pipelines Locally SAN FRANCISCO–(BUSINESS WIRE)–Earthly Technologies, the company behind the popular open source developer tool Earthly – the super simple CI/CD framework with repeatable builds that you write once and run anywhere, announces today the general availability of its software-as-a-service CI/CD platform, Earthly CI, and a new $6.5 million seed+ funding round. Innovation Endeavors led this latest round with participation from existing investors 468 Capital and Uncorrelated Ventures. Our partnership with Davis and the team at Innovation Endeavors has been a fantastic experience, and this new capital allows us to continue investing in our products to make CI/CD simpler for developers at more projects and companies. Traditional CI/CD platforms can be a challenge for today’s software engineers. They were built in a different time and can struggle with the complexities of containers, monorepos, and diverse tech stacks, making the CI/CD process slow, complex, and frustrating. Earthly CI offers a better solution, built for the needs of modern software engineers. With Earthly CI, pipelines are consistent and repeatable. It isolates execution from the computer it’s running on by executing all CI pipelines in containers. This means that if a pipeline runs on a developer’s laptop, it’ll run the same way in CI. Earthly CI’s build runners, called Earthly Satellites, are designed to make pipelines fast and efficient, thanks to an automatic and instantly available build cache. All CI pipelines are defined in Earthfiles – using Earthly’s simple, instantly recognizable syntax – and stored in the project repository, making Earthly CI easy for developers to learn and use in their projects. “Earthly CI’s killer feature is that it allows developers to run CI/CD pipelines on their local machines, making the process of iteration dramatically more efficient. Executing the pipeline in the cloud is also ridiculously fast - usually twice as fast as a traditional CI - thanks to the completely novel caching and parallelization techniques that just work, automatically, for everyone, with no configuration required,” said Vlad A. Ionescu, founder and CEO of Earthly Technologies. “Our partnership with Davis and the team at Innovation Endeavors has been a fantastic experience, and this new capital allows us to continue investing in our products to make CI/CD simpler for developers at more projects and companies.” Earthly Technologies’ new funding follows a $2.1 million round in October 2020, led by 468 Capital with participation from Uncorrelated Ventures, Bessemer Venture Partners, and several founders of high-profile developer platforms. The new funding brings the company’s total funding raised to $8.6M. The company will use this investment to improve and add more enterprise-friendly features to its open source product, Earthly, and its subscription SaaS products, Earthly CI and Earthly Satellites. “Earthly’s approach to CI/CD is a game changer that streamlines the build and test process. It tackles some of the biggest CI-related problems development teams have, such as a lack of caching, poor support for monorepos, and complexity that makes CI/CD pipelines a nightmare to maintain,” said Davis Treybig, Principal at Innovation Endeavors. “Earthly is building the future of CI and is the only platform that lets developers build and test pipelines locally with confidence. Vlad and his team have created something special and I’m excited to collaborate as part of the Innovation Endeavors portfolio.” “Earthly CI has made our build process significantly faster and more streamlined compared to other CI/CD platforms we’ve tried. It reduced our average build time from twenty minutes to three minutes and was quick and straightforward to set up and use,” said Brian Bugh, CTO at Table Needs. Get started with Earthly CI at https://earthly.dev/signup/earthly-ci. For more information, read the Earthly CI launch blog, check out its docs, and visit earthly.dev. About Earthly Technologies Earthly makes CI/CD super simple. Its products include the open source Earthly – the instantly familiar CI/CD framework with repeatable builds that you write once and run anywhere; Earthly CI – the fast, repeatable CI/CD platform; and Earthly Satellites – the fast remote build runner that works with any CI. For more information, visit earthly.dev. About Innovation Endeavors Innovation Endeavors is an early-stage venture capital firm that invests in mission-driven founders, transformational technologies, and emergent ecosystems. The firm’s central investment thesis, the Super Evolution, combines data, leading-edge computation, and advanced engineering to transform a range of industries including agriculture, supply chain, the life sciences, cities, transportation, infrastructure and industrial, and more. Its investments include AlphaSense, Astra, Color, Blue River Technology, Eikon Therapeutics, Fabric, Homelight, Kong, Formlabs, Freenome, Planet, Rebellion, Replica, SoFi, Uber, Upstart, Vicarious Surgical, and more. For more information, visit www.InnovationEndeavors.com. Get Started with Earthly Cloud now! Consistent, Fast Builds in the Cloud Get Started Free function bottomCtaGetStartedFreeClick() { analytics.track("bottom-cta-get-started-free-click", { category: "Get Started Free Click", label: "bottom-cta-get-started-free-click", }); }'
