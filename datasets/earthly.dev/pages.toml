full_description = '''Get a Demo Start your journey to engineering excellence today. Supporting infinitely diverse CI/CD setups is overwhelming.Take control of your development lifecycle with Earthly Lunar. Define custom engineering guardrails Gain full visibility into your SDLC Track owners of components and domains Shift compliance to the left with feedback in developer PRs First name* This field cannot be empty Last name* This field cannot be empty Company email* This field cannot be empty Company name* This field cannot be empty Engineering team size* 1-10 10-50 50-200 200-500 500-1000 1000-5000 5000+ This field cannot be empty What is your role?* I manage CI/CD I am an application developer I’m an engineering leader I’m a security leader I manage compliance I’m in charge of GRC I’m a DevOps leader I’m a Platform Engineer Something else This field cannot be empty (Optional) What are you trying to solve with Earthly Lunar? Book now Something went wrong. Please try again. Request Sent We'll be in touch soon! window.addEventListener('click', e => { const teamSizeOptions = document.getElementsByClassName('options')[0] const roleOptions = document.getElementsByClassName('options')[1] if (!teamSizeOptions.parentElement.contains(e.target) && !teamSizeOptions.classList.contains('hidden')) { teamSizeOptions.classList.add('hidden') } if (!roleOptions.parentElement.contains(e.target) && !roleOptions.classList.contains('hidden')) { roleOptions.classList.add('hidden') } }) const handleKeyUp = e => { if (e.value.trim()) { if (e.name === 'email' && !/^[a-zA-Z0-9._]+@(?:[a-zA-Z0-9]+\.)+[A-Za-z]+$/.test(e.value.trim())) { return (document.querySelector(`input[name="${e.name}"]`).parentElement.nextSibling.nextSibling.innerText = 'Please enter a valid email address') } document.querySelector(`input[name="${e.name}"]`).parentElement.classList.remove('error') } } const toggleOptions = e => { const options = e.getElementsByClassName('options')[0] if (options.classList.contains('hidden')) options.classList.remove('hidden') else options.classList.add('hidden') } const selectOption = (field, e) => { const element = document.querySelector(`input[name="${field}"]`) element.value = e.innerText element.parentElement.classList.remove('error') } const submitForm = async () => { const form = document.getElementById('earthly-lunar-form') const errorCommon = document.getElementsByClassName('error-common')[0] const thankYou = document.getElementById('thank-you') errorCommon.classList.add('hidden') const formData = new FormData(form) const fields = ['first_name', 'last_name', 'email', 'company', 'team_size', 'role'] let errorFound = false fields.forEach(field => { const element = document.querySelector(`input[name="${field}"]`).parentElement if (!formData.get(field).trim()) { element.classList.add('error') errorFound = true } if (field === 'email') { if (!formData.get(field).trim()) { element.nextSibling.nextSibling.innerText = 'This field cannot be empty' } else if (!/^[a-zA-Z0-9._]+@(?:[a-zA-Z0-9]+\.)+[A-Za-z]+$/.test(formData.get(field).trim())) { element.nextSibling.nextSibling.innerText = 'Please enter a valid email address' element.classList.add('error') errorFound = true } } }) if (errorFound) return fetch('https://hooks.zapier.com/hooks/catch/21357277/2k11b51/', { headers: { 'Content-Type': `application-json` }, body: JSON.stringify({ first_name: formData.get('first_name'), last_name: formData.get('last_name'), email: formData.get('email'), company: formData.get('company'), team_size: formData.get('team_size'), role: formData.get('role'), problem: formData.get('problem') }), method: 'POST', mode: 'no-cors' }) .then(async response => { form.classList.add('hidden') thankYou.classList.remove('hidden') form.parentElement.classList.remove('items-center') form.parentElement.classList.replace('pt-10', 'pt-20') }) .catch(error => errorCommon.classList.remove('hidden')) var formEmail = document.getElementById('earthly-lunar-form-email').value analytics.identify(formEmail) analytics.track('earthly-lunar-form-submit', { category: 'Form Submission', label: 'earthly-lunar-form-submit' }) }'''
