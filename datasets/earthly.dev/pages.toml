["https://earthly.dev/blog/ci-comparison"]
title = "CI Free Tier Showdown - Earthly Blog"
description = "In this article, we compare the free tiers of four popular CI/CD platforms - Github Actions, GitLab CI, Circle CI, and Travis CI. We evaluate their..."
full_description = "Blog / Builds Table of contents How Much Can You Get For Free?DocumentationGithub ActionsCircle CITravis CIGitLabCompute PowerAvailable Disk SpaceBuild MinutesSpeed TestWith EarthlyConclusion Related ‣ Travis CI Alternatives ‣ Earthly Cloud Introduction ‣ Earthly + Github Actions Popular Posts ‣ GitHub Actions for Docker ‣ GitHub Actions Secrets ‣ GitHub Actions Artifacts Learn More About Earthly Earthly makes builds super simple. Learn More CI Free Tier Showdown 10 minute read Updated: July 19, 2023 Josh Alletto Table of Contents How Much Can You Get For Free?DocumentationGithub ActionsCircle CITravis CIGitLabCompute PowerAvailable Disk SpaceBuild MinutesSpeed TestWith EarthlyConclusion This article compares various CI/CD platforms. Earthly enhances Github Actions by ensuring build reproducibility and consistency. Check it out. How Much Can You Get For Free? Here at Earthly, we care about your CI/CD dollar. That’s why we decided to pit the free tiers of four of the top CI/CD platforms against each other to find out which one provides the most bang for no bucks. In this post we’ll compare Github Actions vs GitLab CI vs Circle CI vs Travis CI using the following criteria: Quality of Documentation Compute Power Available Disk Space Free Build Minutes Speed and Performance Documentation Github Actions Github Actions is the newcomer among the group, but it’s grown quickly since its launch in 2018. Unlike Travis CI or Circle CI, which both allow you to connect projects from GitLab and Bitbucket, Github Actions requires that your code be hosted on Github. Once your code is on Github, though, there’s no additional sign-in or service you need to include. Having our pull requests and CI in one place was convenient when debugging and removed some of the frustration that can come with jumping back and forth from the code to another service that holds the build logs. Similar to Circle CI, the docs were extremely easy to use and offered in-depth code examples, screenshots, and charts that made learning to use the service quick and easy. Circle CI Getting set up and running with Circle Ci’s free tier was pretty straightforward. Create an account and link it to your Github, Bitbucket, or GitLab account. After that, all it took was adding a .circleci/config.yml file to our project repo and we were up and running. The docs were among the best we looked at. Information was well organized and it was easy to find answers when we encountered issues. Best of all, nearly every page of the docs included code examples, usually entire example files. Travis CI Like Circle CI, Travis CI also supports Github, Bitbucket, and GitLab. Once signed in, we were able to connect a repo with a few button clicks, add a travis.yml to the root of the project, and we were good to go. The documentation was informative and we could usually find what we were looking for, but sometimes not without a great deal of digging. Pages are dense with text, which can be helpful, but code examples were usually limited to a few lines, and it was sometimes unclear where the code fit into the larger config file. GitLab GitLab, like Github, is an online git repository that offers CI/CD services. Also, like Github, you’ll need to have your code hosted on GitLab to create pipelines. Once you have a repo set up, getting started with GitLab CI was just as easy as the rest: add your config file and you’re ready to go. We found the GitLab documentation challenging to use when our primary focus was their SaaS offering. GitLab seems to be putting most of its efforts toward being a self-hosted solution, either on-prem or in the cloud. As a result, a lot of the tutorials and documentation are written for users who are hosting their own GitLab runners. The first step in their getting started section tells you to install and register a runner before you can start building, but these steps are not necessary if you want to use runners hosted by GitLab, and there’s little information on the getting started page about this option. It took a little more digging and some outside sources to get started without having to host our own runner. Compute Power CPU and RAM breakdown. When it came down to available hardware Circle CI was way ahead of the others. It was also the only service that offered multiple resource sizes ranging from 1vCPU / 2GB of RAM to 4 vCPU / 8GB of RAM. Available Disk Space Shows disk space available at the time the job ran. For this metric, we simply ran df -h as part of our builds and noted the available space. Here Circle CI won out again. Not only did it offer the most available space, but it also offered the highest percentage with 94% of the disk available for our job. Compare that to Github Actions which showed 32GB available of 84GB totally, or 38% of total disk space. Gitlab’s measly 15.6GB was not enough to accommodate our build or our benchmark run. More on that in below. Build Minutes How much can you build for free? With one exception, all the services we looked at limited usage by allotting a certain amount of build minutes per month. Run out of build minutes and you’ll be forced to pay for more. Again Circle CI won out by offering three times the build minutes as Github Actions, which came in second. Travis does not use the concept of build minutes. Instead, it offers build credits. The amount of credits you use for each build depends on several factors, but we saw about 10 credits deducted per run when conducting our benchmark tests. It’s hard to say just how exactly this compares to build minutes offered, but since you have to use your free 10,000 credits within the first month of signing up for Travis CI, we considered it to be last when it comes to value. Travis’s free tier was the only one that expired. One month after sign-up there is no way to use Travis for free. Speed Test Average total run times for our benchmark test. To test the performance of each service, we needed something to build. We wanted something open source that also showcased a variety of programming languages. With those criteria in mind, we landed on this open-source benchmarks project. This repo contains a handful of different benchmark tests that run on over two dozen languages and frameworks. Some of the tests can take a long time to run, so in order to keep the test manageable, we decided to just use the Base64 encoding/decoding benchmark. You can check out our fork to see how we set up the config files for each pipeline. This is how we ran the test on each platform. Build the project with Docker (This builds every test, not just the Base64). Push the image to Docker Hub. In a new job, pull the image. Run the Base64 benchmark. We repeated this 5 times to get a sense of how much variation you might expect. For each service, you’ll see three sets of data. Build: The amount of time it took to build all the benchmark tests from the included Dockerfile. Base64: The amount of time it took to pull and run the base64 benchmark for all languages. Total Time: How long did the entire process take including the time it took to spin up the environment. Circle CI Benchmark Test Results Github Actions Benchmark Test Results Travis CI Benchmark Test Results Where Is GitLab? GitLab CI’s free tier was the weakest of the bunch across the board. As a result, we were unable to build the benchmarks nor run the Base64 test without encountering an out of disk space error. If you’d like to get some idea of how GitLab performs, we were able to get it to run the Earthly examples in the next section. With Earthly At Earthly, our goal has always been to create better builds. We build Earthly so it can run anywhere, so naturally, we were curious to see how it would perform on each service’s free tier. The Earthly repo contains dozens of examples in Python, Go, Ruby, react, C, and many more. You can checkout this fork if you want to see how we set up our config files for each pipeline. This is how we ran the test on each platform. Download Earthly. Build every example with earthly -P +examples. Even though it came in second in our benchmark test, Github ended up running Earthly the fastest. In this case, Github Actions had a slight advantage over Circle CI. GitLab CI was able to run the job to completion, but it came in dead last, nearly doubling the time of our second runner-up, Travis CI. Conclusion A summary of the results Overall, if speed is your primary concern and you’re on a budget, then Circle CI is the clear choice. If you’re not looking to run a ton of builds each month and your code is already in Github, then Github Actions can offer similar performance with the added convenience of having everything under one service. Even though we liked Travis better, our main criteria was value, and since you can’t use Travis for free after the first month, GitLab was able to grab the third slot, despite it being weaker in almost every other category. Remember, we only looked at the free tiers offered by these services. As your project grows, performance may vary. Also, each service scales differently so even though you may like the convenience of Github Actions, you may find that Travis CI becomes more cost-effective as you run larger and more complicated pipelines. And if you’re looking to simplify your build automation further, you might want to give Earthly a spin. It’s designed to play nice with your CI/CD platform of choice, so you can switch around as various free plans change. Earthly Cloud: Consistent, Fast Builds, Any CI Consistent, repeatable builds across all environments. Advanced caching for faster builds. Easy integration with any CI. 6,000 build minutes per month included. Get Started Free function blogHomepageCTAClick1() { analytics.track('blog-bottom-cta-click', { category: 'Get Started Free', label: 'blog-bottom-cta-click' }); } Josh Alletto Josh is a writer and former devops engineer. He's passionate about coding, learning, and sharing knowledge. ✉Email Josh✉ Updated: July 19, 2023 Published: May 4, 2022 Get notified about new articles! We won't send you spam. Unsubscribe at any time. Subscribe to the Newsletter Subscribe const form = document.getElementById('embedded-newsletter-form'); form.addEventListener('submit', function (event) { var formEmail = document.getElementById('embedded-newsletter-form-email').value; analytics.identify(formEmail); analytics.track('embedded-newsletter-form', { category: 'Form Submission', label: 'embedded-newsletter-form' }); });"
