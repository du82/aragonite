full_description = '''Introducing Earthly Lunar Monitoring for your SDLC Achieve engineering excellence that is out of this world Get a demo Applications CI/CD Guardrails function lunarGetADemoClick() { analytics.track('lunar-get-a-demo-click', { category: 'Get a demo Click', label: 'lunar-get-a-demo-click' }) } Every Service Is A Unique Snowflake Supporting infinitely diverse CI/CD setups is overwhelming Monitor Your SDLC via CI/CD Agent Powered by a lightweight CI/CD agent, Earthly Lunar is easily inserted in your existing developer infrastructure, and no changes to individual CI workflows are needed. Take Control Of The Development Lifecycle CI/CD Workflows Build Metadata Node version is greater than 20.18.1 Test coverage is greater than 75% SBOM file exists Repo access controls are configured No critical vulnerabilities Policies Continuous Compliance Visibility Developer Feedback Automated Guardrails Enable consistent and safe engineering practices across your entire org through custom guardrails that you define. Boost DevOps Maturity Reduce reliance on tribal knowledge and guide your teams to DevOps excellence with automatic feedback throughout the development lifecycle. Visibility for Engineering Leaders Understand engineering quality with rich insights and drive improvements with custom scorecards tailored to your organizational goals. Eliminate Mass PRs Make changes across any number of CI pipelines centrally. No more manual YAML edits and stale PRs that linger forever. Continuous Compliance Shift compliance to the left by inserting custom security checks across your projects effortlessly from a central location. Ownership Tracking Make sense of the diverse components within your product. Track owners and ensure incidents are handled with domain rollups. Governance-As-Code Define custom policies with a few lines of Python policies: - name: "Should have unit tests" runPython: |- import lunar hasTests = lunar.get("hasTests") lunar.assertTrue(hasTests) collectors: - runBash: lunar collect "hasTests" true hook: type: before-command patterns: - ^go test.* - ^npm test.* - ^python -m .unittest.* Policy Passed Missing Metadata Policy Failed Policy Passed CI/CD Metadata CI/CD Instrumentation Engine Queryable Data Model Policy Engine CI/CD Metadata Queryable Data Model Policy Passed Missing Metadata Policy Failed Policy Passed CI/CD Instrumentation Engine collectors: - runBash: lunar collect "hasTests" true hook: type: before-command patterns: - ^go test.* - ^npm test.* - ^python -m .unittest.* Policy Engine policies: - name: "Should have unit tests" runPython: |- import lunar hasTests = lunar.get("hasTests") lunar.assertTrue(hasTests) CI/CD Metadata Metadata across SDLC activities, including CI/CD builds, are gathered using custom collectors and plugins. CI/CD Instrumentation Engine This example collector uses a small bash script to report the value "true" anytime unit tests are run in CI/CD. The collector automatically triggers whenever a build tool like Go, NPM, or Python is detected with unit test parameters. Queryable Data Model The results of all collectors are stored in Lunar and can be used for policy evaluation or queried via SQL for monitoring. Policy Engine This example policy ensures that unit tests are run in CI/CD pipelines. It uses a simple Python script and the Lunar SDK to check that the value previously gathered by the collector was set to "true". Policy Evaluations The resulting policy evaluations are shown to developers directly in their PRs. In this case, if their CI/CD pipeline doesn’t have unit tests, the developer will be notified of the missing requirement. /** * Copying text from SVGs removes the indentation. * This workaround gets the selected text and adds the necessary line breaks and indentation. */ const getIndicesFromOriginalText = (text, copiedText) => { const textArr = text.split('') const copiedArr = copiedText.split('') let startIndex = 0 let endIndex = -1 const checkSubsequentChars = startIndex => { let lineBreaks = 0 for (let i = 0; i < copiedArr.length; i++) { const currentChar = textArr[startIndex + i + lineBreaks] if ( !currentChar || currentChar === copiedArr[i] || (currentChar === ' ' && new DOMParser().parseFromString(copiedArr[i], 'text/html').body.innerHTML === '&nbsp;') ) { // If the characters match, continue continue } else if (currentChar === '\n') { // If current character is a line break, increase lineBreaks count lineBreaks++ } else { // If characters don't match, return new start index return textArr.indexOf(copiedArr[0], startIndex + 1) } } // If subsequent characters match, set endIndex endIndex = startIndex + copiedArr.length + lineBreaks return startIndex } if (checkSubsequentChars(startIndex)) { while (endIndex === -1) { startIndex = checkSubsequentChars(startIndex) } } return { startIndex, endIndex } } document.querySelectorAll('#code-collectors').forEach(x => { x.addEventListener('copy', e => { // This text should have the exact text and spacing as in the SVG file. const text = 'collectors:\n - runBash: lunar collect "hasTests" true\n hook:\n type: before-command\n patterns:\n - ^go test.*\n - ^npm test.*\n - ^python -m .unittest.*' const { startIndex, endIndex } = getIndicesFromOriginalText(text, document.getSelection().toString()) event.clipboardData.setData('text/plain', text.substring(startIndex, endIndex)) event.preventDefault() }) }) document.querySelectorAll('#code-policies').forEach(x => { x.addEventListener('copy', e => { // This text should have the exact text and spacing as in the SVG file. const text = 'policies:\n - name: "Should have unit tests"\n runPython: |-\n import lunar\n hasTests = lunar.get("hasTests")\n lunar.assertTrue(hasTests)' const { startIndex, endIndex } = getIndicesFromOriginalText(text, document.getSelection().toString()) event.clipboardData.setData('text/plain', text.substring(startIndex, endIndex)) event.preventDefault() }) }) const handleHover = (elem, index) => { const { left, top, width } = elem.querySelector('path').getBoundingClientRect() const tooltip = document.getElementsByClassName('info-tooltip')[index].style tooltip.display = 'block' tooltip.top = top - 24 + window.scrollY + 'px' tooltip.left = left + width / 2 + window.scrollX + (window.innerWidth > 1023 && window.innerWidth < 1480 && index === 4 ? -40 : 0) + 'px' if (window.innerWidth > 1023 && index === 4) { const arrow = document.getElementsByClassName('info-tooltip')[index].querySelector('svg').style if (window.innerWidth < 1180) arrow.transform = 'translate(133px, 22px)' else if (window.innerWidth < 1480) arrow.transform = 'translate(152px, 22px)' } } const handleLeave = (elem, index) => { document.getElementsByClassName('info-tooltip')[index].style.display = 'none' } Works With Your Diverse Tech Stack With a rich ecosystem of plugins and the ability to write your own, Earthly Lunar empowers dev teams to build with the tools they need—while ensuring compliance with company standards and policies. Earthly is Backed By Alumni Shanku Niyogi Former PM of VScode, GitHub Actions, Codespace & Copilot David Cramer Founder Sentry Mirko Novakovic Founder Instana Florian Leibert Cofounder Mesosphere Jeff Dean Chief Scientist, Google DeepMind, Google Fellow Olivier Pomel CEO Datadog Cosmin Nicolaescu CTO Brex Wes McKinney Creator of Pandas, Python Software Foundation Fellow Ben Hindman Creator of Mesos José Valim Creator of Elixir Spencer Kimball CEO Cockroach Labs Charlie Marsh Creator of Ruff & UV David Aronchick Former PM of Kubernetes, Creator of KubeFlow Mitch Wainer Cofounder DigitalOcean Dan Barak Head of Product at Netlify = Alumni Shanku Niyogi Former PM of VScode, GitHub Actions, Codespace & Copilot David Cramer Founder Sentry Florian Leibert Cofounder Mesosphere Jeff Dean Chief Scientist, Google DeepMind, Google Fellow Olivier Pomel CEO Datadog Cosmin Nicolaescu CTO Brex Wes McKinney Creator of Pandas, Python Software Foundation Fellow José Valim Creator of Elixir Mirko Novakovic Founder Ins