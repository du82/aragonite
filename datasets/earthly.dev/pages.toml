title = "Using Azure Functions to Build Your First Serverless Application - Earthly Blog"
description = "This tutorial explains how to build a serverless application using Azure Functions. It covers setting up a serverless architecture deployment on Az..."
full_description = '''Blog / Cloud Table of contents PrerequisitesBuild a Serverless ApplicationAdd Game Session Creation Capability to Your FunctionDefine a Function for Fetching a Game SessionAdd State Management to Your FunctionJoin a Game SessionUse Cosmos DB Input Binding to Listen to Change EventsFetch a Game SessionDeploy Your Functions Using CI/CD and GitHubDeploy Your Functions Using the Azure Function Core ToolsDeploy Your Functions Using CI/CD on GitHubSet Up Logging and MonitoringMonitor Function ExecutionsQuery Logs and MetricsSecure the FunctionUsing Function Keys to Secure Your FunctionsSecure Your Functions Using CORSConclusion Related ‣ Azure Functions Deployment ‣ Netlify Cloud Functions ‣ AWS Lambda Deployment Popular Posts ‣ GitHub Actions Secrets ‣ GitHub Actions for Docker ‣ TypeScript Monorepo Setup Learn More About Earthly Earthly makes builds super simple. Learn More Using Azure Functions to Build Your First Serverless Application 72 minute read Updated: October 6, 2023 Osinachi Chukwujama Table of Contents PrerequisitesBuild a Serverless ApplicationAdd Game Session Creation Capability to Your FunctionDefine a Function for Fetching a Game SessionAdd State Management to Your FunctionJoin a Game SessionUse Cosmos DB Input Binding to Listen to Change EventsFetch a Game SessionDeploy Your Functions Using CI/CD and GitHubDeploy Your Functions Using the Azure Function Core ToolsDeploy Your Functions Using CI/CD on GitHubSet Up Logging and MonitoringMonitor Function ExecutionsQuery Logs and MetricsSecure the FunctionUsing Function Keys to Secure Your FunctionsSecure Your Functions Using CORSConclusion This tutorial explains how to build a serverless application using Azure Functions. After reading it take a look at Earthly. Earthly provides indispensable build tools for your next project. Learn more about Earthly. Serverless architecture simplifies the process of building and deploying applications by removing the need to manage servers. You just need to write your application’s business logic in different functions. These functions are only executed when they’re triggered, and they’re billed based on total running time. You only write and deploy the functions you need. Compare this function-as-a-service (FaaS) concept with infrastructure as a service (IaaS), which requires you to set up a full-fledged virtual machine, or platform as a service (PaaS), which requires you to set up the project, configure continuous integration, continuous delivery (CI/CD) from source control, and be in charge of the whole build process. In this article, you’ll learn how to set up a serverless architecture deployment on Azure using Azure Functions. You’ll use the Azure Functions Node.js runtime to build a serverless coin flip application. The app manages the state using Azure Cosmos DB and monitors with Azure Application Insights. Prerequisites Before you dive into the tutorial, make sure you have a few prerequisites in order: An Azure account. Create a free account and get $200 USD in free credits. A UNIX environment where you can use the Azure CLI and the Azure Functions core tools. You can use WSL if you’re on Windows. The Azure CLI for deploying your function. The Azure Functions core tools. You’ll use these core tools to initialize, run, and deploy your functions. The README.md file on the official GitHub repo has installation instructions for all platforms. Node.js version 16 or higher. Install Node.js from the official website or install using Node Version Manager (NVM). Build a Serverless Application This tutorial utilizes the approach of progressing from local development to a cloud environment to help minimize cloud costs that are typically involved in building and testing serverless functions. To begin, clone this GitHub repository that contains the frontend application code. Once you’ve cloned the repo, you’ll create the different serverless functions that handle the different functionalities of the application. Run the following command to clone the repo: git clone https://github.com/vicradon/coin-flip.git cd coin-flip The coin flip application has the following functionalities: A way to create a game session. The serverless function that handles this creates a game entry in Cosmos DB and a shareable gamecode. A way for a second player to join a game session. A way to trigger a coin flip when both players have joined the game session. This is handled by a Cosmos DB trigger Azure function. A way to fetch the current game session from the server. Get started by creating a folder for your serverless functions. The folder should be located at the root of the coin-flip directory. Run this command to initialize a folder using the Azure Functions core tools: func init serverless-functions --worker-runtime node \ --language typescript --model V4 This command sets the functions runtime as Node.js and the common language as TypeScript. Note that this code uses version 4 of the core tools, which is in public preview as of the time of writing. It offers improved developer experience for Node.js developers, such as an immediate npm install after project initialization. If the command works as expected, your output looks like this: The new Node.js programming model is in public preview. Learn more at https://aka.ms/AzFuncNodeV4 Writing package.json Writing .funcignore Writing tsconfig.json Writing .gitignore Writing host.json Writing local.settings.json Writing /workspace/coin-flip/serverless-functions/.vscode/extensions.json Running 'npm install'... Navigate into your newly created serverless-functions directory and create your first function: cd serverless-functions && func new --name CreateGameSession \ --template HTTPTrigger --authlevel anonymous This command creates a new file, CreateGameSession.ts, under the serverless-functions/src/functions directory. This serverless function uses the HTTP trigger template, which simply means it’s triggered by an HTTP request. Setting the authLevel as anonymous allows the function to be invoked without an API key. This security setting is ideal for local development or prototyping but might be risky in production. You can learn more about this in the “Secure the Function” section. The content of the CreateGameSession file is boilerplate code that displays hello world when called with a query parameter or a request body. You can immediately test this function by starting the local development server using this command: npm start The functions server starts on port 7071 with the CreateGameSession function open to receiving a GET or POST request. You can test out this function by pasting this URL on your browser: http://localhost:7071/api/CreateGameSession?name=Barry. You should get a greeting like this: Hello, Barry! Add Game Session Creation Capability to Your Function The first function in your serverless application serves as an initializer, creating a game session that two players can participate. Each game session is identified by a gamecode—a unique ID generated using the custom-uuid npm package. The function should return a JSON output with a response message and the gamecode. Paste the following snippet into your CreateGameSession.ts to enable this functionality: import { app, HttpRequest, HttpResponseInit, InvocationContext, } from "@azure/functions"; import { generateCustomUuid } from "custom-uuid"; export async function CreateGameSession( request: HttpRequest, context: InvocationContext ): Promise<HttpResponseInit> { context.log(`Http function processed request for url "${request.url}"`); const requestBody = await request.json(); const gamecode = generateCustomUuid("abcdef12345", 5); return { jsonBody: { message: "Created game session", gamecode, }, }; } app.http("CreateGameSession", { methods: ["POST"], authLevel: "anonymous", extraOutputs: [], handler: CreateGameSession, }); The package for generating the shareable gamecode, custom-uuid, has to be installed at this point. Install it using the following command: cd serverless-functions && npm i custom-uuid Define a Function for Fetching a Game Session Next up, you need to define a function to fetch game sessions so that the second player can see the details of the coin flip they’re getting themselves into. Define a new function using the following command: func new --name FetchGameSession --template HTTPTrigger \ --authlevel anonymous Now that you’ve defined the function, there’s no way to retrieve the gamecode created by the CreateGameSession function. You have to add a storage mechanism or state management to enable this functionality. In the next section, you’ll add a way to store your game session object on the Azure Cosmos DB NoSQL database. Add State Management to Your Function To add state management to your function, define a Cosmos DB resource on Azure. Cosmos DB is a NoSQL database that offers different ways to manipulate data through multiple APIs. This tutorial uses the SQL API to store, read, and update documents. To create a Cosmos DB database, you’ll make use of the Azure CLI. You’ll need to create several resources on Azure. Create a new script in the serverless-functions directory called create-resources.sh and paste the following snippet in it: resourceGroup=coinflip-rg location=eastus storageAccount="coinflipstorage$RANDOM" functionApp="coinflip$RANDOM" databaseAccount="coinflipdbacc$RANDOM" database=coin-flip-db databaseContainer=coin-flip-sessions keyvault="coinflipkeyvault$RANDOM" # Create the resource group az group create --name $resourceGroup --location $location # Create the storage account az storage account create --name $storageAccount --location $location \ --resource-group $resourceGroup --sku Standard_LRS # Create the functions app az functionapp create --name $functionApp --resource-group $resourceGroup \ --storage-account $storageAccount --consumption-plan-location $location \ --functions-version 4 –worker-runtime node –os-type Linux –runtime-version 16 # Create the database account az cosmosdb create --name $databaseAccount --resource-group $resourceGroup \ --default-consistency-level Eventual --locations regionName="East US" \ failoverPriority=0 isZoneRedundant=False # Create the Cosmos DB database az cosmosdb sql database create --account-name $databaseAccount --name \ $database --resource-group $resourceGroup # Create a container within the database az cosmosdb sql container create --account-name $databaseAccount \ --resource-group $resourceGroup --database-name $database --name \ $databaseContainer --partition-key-path "/gamecode" --throughput 400 # Query the endpoint and key of their database account endpoint=$(az cosmosdb show --name $databaseAccount --resource-group \ $resourceGroup --query documentEndpoint --output tsv) key=$(az cosmosdb keys list --name $databaseAccount --resource-group \ $resourceGroup --query primaryMasterKey --output tsv) echo $endpoint echo $key You need to authenticate the CLI before you can use it. Run the following command to set up the authentication flow for the CLI: az login Follow the resulting link to log into your Azure account. If you’re having trouble logging in, use the device code flow by running: az login --use-device-code After successfully authenticating the CLI, run the script to create resources using the following command: bash create-resources.sh The last two lines of the output are similar to this: https://coinflipdbacc13692.documents.azure.com/ VBw1tYml83KE7kxNMVD6KpkLQhobIT5oGKhAtxqucJW5rOgyS8mBRKbGbh4eSoMouBzHtNAdVk7FACDblC8sZA== This first line is the endpoint of the Cosmos DB database account where the coin-flip-db database lives. The second is the key that acts like a password for connecting to this database account. The functionality for connecting to the database is defined in a new file, getDBContainer.ts, which you’ll create in a serverless-functions/src/utils directory. Create this directory and the required file by running the following command: mkdir serverless-functions/src/utils && touch \ serverless-functions/src/utils/getDBContainer.ts Then paste the following code into the file: import { Container, CosmosClient } from "@azure/cosmos"; export default async function getDbContainer( containerId: string ): Promise<Container> { const client = new CosmosClient({ endpoint: "https://coinflipdbacc13692.documents.azure.com:443/", key: "VBw1tYml83KE7kxNMVD6KpkLQhobIT5oGKhAtxqucJW5rOgyS8mBRKbGbh4eSoMouBzHtNAdVk7FACDblC8sZA==", }); const database = client.database("coin-flip-db"); const container = database.container(containerId); return container; } Replace the values of endpoint and key with the corresponding values of your database account. This snippet exposes a container object that can be used to create or query data from a Cosmos DB container. With the object returned from this file, you can effectively manage the state of your application. It requires the @azure/cosmos package, so you can install it in the serverless-functions directory using this command: cd serverless-functions && npm i @azure/cosmos Now, import the getDbContainer function from the serverless-functions/utils/ into the CreateGameSession.ts file. Next, initialize a dbContainer object and create a game session on the Cosmos DB database using the additions in the following snippet: import getDbContainer from "../utils/getDBContainer"; import { generateCustomUuid } from "custom-uuid"; … const requestBody = await request.json(); const gamecode = generateCustomUuid("abcdef12345", 5); const dbContainer = await getDbContainer("coin-flip-sessions"); await dbContainer.items.create({ gamecode, username: requestBody["username"], flip_reason: requestBody["flip_reason"], }); return { jsonBody: { message: "Created game session", gamecode, }, … Restart your functions app server and make a POST request to the /api/CreateGameSession endpoint with the following request body: { "username": "Marv", "flip_reason": "Who will walk the dog" } After making the request, you should have a response similar to this: { "message": "Created game session", "gamecode": "f2ae1" } You can set your functions app to reload every time you make a change by running npm run watch in another terminal within the serverless-functions directory. Join a Game Session A second player can join a game session by simply registering their username in the game session object. Because Cosmos DB is a nonrelational database, you don’t have to define a player2Username field beforehand. This approach makes it easy to prototype new applications. Create a new file in the serverless-functions/src/functions directory called JoinGameSession.ts, and then add the following to it: import { app, HttpRequest, HttpResponseInit, InvocationContext, } from "@azure/functions"; import getDbContainer from "../utils/getDBContainer"; export async function JoinGameSession( request: HttpRequest, context: InvocationContext ): Promise<HttpResponseInit> { context.log(`Http function processed request for url "${request.url}"`); const requestBody = await'''
