full_description = "Get started with Earthly Earthly is Better Logged In A better, interactive version of this installation guide is available in Earthly Cloud. Earthly Cloud gives you consistent builds, ridiculous speed, a next-gen developer experience, and it works with any CI. It's your Earthly builds in the cloud. Get 6,000 minutes/month for free by visiting the sign up page. Install Earthly CLI Select your OS: Linux Terminal sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64 -O /usr/local/bin/earthly && chmod +x /usr/local/bin/earthly && /usr/local/bin/earthly bootstrap --with-autocomplete' Copy Pre-requisites Docker or Podman Git sudo is used for: placing the earthly binary in /usr/local/bin/ and marking it as executable installing auto-completion for your shell For Podman: Rootless Podman is not officially supported. Run podman with sudo Mac Terminal brew install earthly && earthly bootstrap Copy Pre-requisites Homebrew for Mac Docker for Mac or Podman Git For shell auto-completion: Homebrew may require additional configuration in your profile For Podman: Ensure Podman Machine is running before running bootstrap Rootless Podman is not officially supported. Learn how to switch to rootful mode Windows ( WSL 2 ) Under wsl, run the following to install earthly. Terminal sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64 -O /usr/local/bin/earthly && chmod +x /usr/local/bin/earthly && /usr/local/bin/earthly bootstrap --with-autocomplete' Copy Pre-requisites WSL 2 Docker Desktop with WSL2 backend or Podman with WSL2 backend Git sudo is used for: placing the earthly binary in /usr/local/bin/ and marking it as executable installing auto-completion for your shell For Podman: Rootless Podman is not officially supported. Run podman with sudo For alternative installation options see the alternative installation page in the Earthly docs. To install Earthly from source, see the contributing page in GitHub Verify Installation Terminal earthly github.com/earthly/hello-world+hello Copy This command executes the target hello from the repository github.com/earthly/hello-world. Add Syntax Highlighting Select your IDE: VS Code Add Earthfile Syntax Highlighting to VS Code. ext install earthly.earthfile-syntax-highlighting Vim Visit earthly.vim on GitHub for details. Emacs If you are using use-package: (use-package earthfile-mode :ensure t) Alternatively, install via package-install: M-x package-install RET earthfile-mode RET Sublime Text Add the Earthly Earthfile package via Package Control: Press Ctrl+Shift+P (or Cmd+Shift+P on Mac) to bring up the Command Palette, and select Install Package control (if you haven’t already installed Package Control). Press Ctrl+Shift+P (or Cmd+Shift+P on Mac) again, select “Package Control: Install Package” and select Earthly Earthfile to install. IntelliJ Earthly plugin available in the IntelliJ Marketplace. Next Steps Learn more about Earthly through docs and examples and how to use Earthly with your existing CI Learn Earthly To learn how to use Earthly, try: The getting started guide An introductory video The full documentation Example projects Need some inspiration to get started with your project? Check out examples on GitHub Run Earthly in CI See the CI integration guide to use Earthly in GitHub Actions, Circle CI, Jenkins, GitLab CI, and others. You can also use Earthly Satellites (part of Earthly Cloud) in your CI system. Satellites are remote build runners that make builds fast, are super simple to use, and work seamlessly with any CI. See the Earthly Satellites docs for more information. function linuxCopyClick() { analytics.track('get-earthly-linux-copy-click', { category: 'Copy Click', label: 'get-earthly-linux-copy-click' }); } function macCopyClick() { analytics.track('get-earthly-mac-copy-click', { category: 'Copy Click', label: 'get-earthly-mac-copy-click' }); } function windowsCopyClick() { 