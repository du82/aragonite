ument.getElementsByClassName('milestone-details')[0].classList.remove('md:flex-row') document.querySelector('.milestone-details > div').classList.remove('md:mt-0') document.querySelector('.milestone-details > div:last-child').classList.remove('md:w-7/12', 'md:pl-10') document.getElementsByClassName('milestone-details')[1].classList.remove('hidden') } else { document.getElementsByClassName('milestone-details')[0].classList.add('md:flex-row') document.querySelector('.milestone-details > div').classList.add('md:mt-0') document.querySelector('.milestone-details > div:last-child').classList.add('md:w-7/12', 'md:pl-10') document.getElementsByClassName('milestone-details')[1].classList.add('hidden') } } else { element.classList.remove("active-milestone") } }) if (index === 1) { previousButtonPath.style.fill = "#ccc" previousButton.classList.remove('cursor-pointer') } else { previousButtonPath.style.fill = "#2d7e5d" previousButton.classList.add('cursor-pointer') } if (index === MILESTONES.length) { nextButtonPath.style.fill = "#ccc" nextButton.classList.remove('cursor-pointer') } else { nextButtonPath.style.fill = "#2d7e5d" nextButton.classList.add('cursor-pointer') } currentMilestone = index } function nextMilestone() { if (currentMilestone < MILESTONES.length) toggleMilestone(currentMilestone + 1) } function previousMilestone() { if (currentMilestone > 1) toggleMilestone(currentMilestone - 1) } Meet Vlad, Earthly’s Founder & CEO Vlad founded Earthly in 2020. He is repeat entrepreneur with an extensive background in cloud computing. Vlad co-founded Qwiet AI (formerly ShiftLeft), the application security platform; created Lever OS, the first open-source serverless/lambda implementation; and co-authored the RabbitMQ Erlang client. Vlad was previously a software engineer at Google (2x) and VMWare. Interested in Joining Earthly? Benefits include: Fully-remote (Earthly always has been) Stock options Health, dental, and vision insurance premiums covered 80% for yourself and depe