title = "Comparison: Flux vs Argo CD - Earthly Blog"
description = "In this article, the author compares two popular GitOps tools, Flux and Argo CD. They discuss various aspects such as reconciliation, source tracki..."
full_description = 'Blog / Deployment Table of contents What Is GitOps?Introducing the Two ContendersKubernetes Cluster ReconciliationManual SyncArgo CDFluxGitOps Source TrackingCluster Drift Reconciliation (Self Heal)Garbage Collection (Pruning)Sync WindowsSelective SyncHooksSummaryKustomizeConfigurationSummaryHelmConfigurationHelm valuesKustomize Helm ReleasesSource TrackingHelm Charts in Helm RegistriesHelm Charts in GitChart DependenciesSummaryScaling OutRecursionDependency OrderingPermissions and Access ControlEverything Is A CRDPolyrepo SupportMulti-Cluster DeploymentSummaryConclusion Related ‣ GitOps with FluxCD ‣ ArgoCD Deployments ‣ Container Orchestration Opt... Popular Posts ‣ Canary Deployments in Kuber... ‣ Manage Kubernetes Resources ‣ Building Docker Images with... Learn More About Earthly Earthly makes builds super simple. Learn More Comparison: Flux vs Argo CD 34 minute read Updated: August 17, 2023 David Szakallas Table of Contents What Is GitOps?Introducing the Two ContendersKubernetes Cluster ReconciliationManual SyncArgo CDFluxGitOps Source TrackingCluster Drift Reconciliation (Self Heal)Garbage Collection (Pruning)Sync WindowsSelective SyncHooksSummaryKustomizeConfigurationSummaryHelmConfigurationHelm valuesKustomize Helm ReleasesSource TrackingHelm Charts in Helm RegistriesHelm Charts in GitChart DependenciesSummaryScaling OutRecursionDependency OrderingPermissions and Access ControlEverything Is A CRDPolyrepo SupportMulti-Cluster DeploymentSummaryConclusion The article compares Flux and Argo CD. Earthly enhances CI/CD security with isolated build environments, unlike Argo CD. Check it out. Since February we have been working on adopting Kubernetes and cloud-native technologies for our cell simulation platform at Turbine.ai. Part of my job entailed figuring out how to onboard developers who didn’t practice DevOps before. Companies I’ve worked at during the past 7 years have all used Kubernetes in some way; and the last one, Turbine.ai, adopted it with my lead. It’s been quite a journey for me since I first encountered the technology in 2015, not long after securing my first full time role as a software engineer at a SaaS startup. Back in those days, the only cloud vendor that had a managed public K8s offering was Google Cloud Platform (GKE). The tech was fresh and all backend engineers at our company were pretty hyped about migrating to GKE from Heroku. Later that year, I moved to a role more aligned with my aspirations of working on distributed data processing pipelines with Apache Spark and had little exposure to K8s for over a year and a half. My path eventually lead back to the container orchestrator when I started working with the machine learning team, running ML workflows in our cloud environment. I recall manually installing and upgrading Apache Airflow (which was the only service I operated) with Helm, all from my development laptop. If the templates rendered the release was good to go. Fast-forward to my next role where we operated an internal data platform with a more mature development lifecycle. I encountered GitOps for the first time here, as backend teams were using Argo CD to deploy their applications. It was a radical quality of life improvement over what I’d been practicing previously. Automatic change detection, a nice GUI, alerts on failures and a unified delivery approach for all applications instead of pile of deployment scripts. What’s not to love? Then, I was hired by Turbine.ai, which is a cool biotech startup. In the simulation team, we decided to move our workflow orchestrator to K8s, with expectations that other services will follow suit gradually. However, there was a problem. Backend developers weren’t generally practicing DevOps in the company, and even a simple configuration change in a web app deployment often involved a sysadmin in the loop. Moving to K8s can be daunting for such newcomers, as they have to learn how to rebuild their existing applications according to cloud native application development principles such as 12 factor app; learn the fundamentals of K8s alongside with its limitations and idiosynchronicities, pick up new tools and infrastructure components, etc. Moreover, the cloud native landscape is vast and rapidly changing, so the best way to do X might be completely different than it was two years ago. So, long story short, I was afraid that if we didn’t offer a smooth developer experience, DevOps would be too much pain to do, which would lead to backlash. GitOps is a method that can largely simplify infrastructure operations for developers, and I managed to convince our team that we should deliver it as part of the milestone marking k8s general availability for the rest of the teams. But what is GitOps and how can it help? What Is GitOps? The term was coined by Weaveworks with the following definition found on gitops.tech: GitOps is a way of implementing Continuous Deployment for cloud native applications. It focuses on a developer-centric experience when operating infrastructure, by using tools developers are already familiar with, including Git and Continuous Deployment tools. The core idea of GitOps is having a Git repository that always contains declarative descriptions of the infrastructure currently desired in the production environment and an automated process to make the production environment match the described state in the repository. If you want to deploy a new application or update an existing one, you only need to update the repository - the automated process handles everything else. It’s like having cruise control for managing your applications in production. Making git the single source of truth for cluster state has many benefits. Without completeness: Offers observability and time-travel with the full change history recorded. This simplifies rollbacks and helps developers move with confidence. Enables modifying the application’s configuration and source code with a unified approach (even in a single changeset) Simplifies the sharing and reuse of common configuration patterns (eg. with ordinary file editing / templating tools) Enables the adoption of already existing DevOps/CI practices to infrastructure, such as static validation, tests, manual approvals, automated vulnerability scans, etc. Git is the industry standard for source control, everyone should use it already After this short introduction, now it’s time to get on with our topic: comparing Argo CD and Flux, two popular GitOps tools. If you are completely new to GitOps, you’ll certainly want to learn more before going ahead. If this is the case, gitops.tech is a good place to continue. You can also find plenty of videos on YouTube. Introducing the Two Contenders initial release Flux2: Jun 25, 2020Flux (succeeded): Jun 27, 2017 Mar 18, 2018 license maturity CNCF Incubating ProjectLF ProjectCNCF End User Tech Radar Continuous Delivery, June 2020: Adopt CNCF Incubating ProjectLF ProjectCNCF End User Tech Radar DevSecOps, September 2021: Adopt enterprise offering Weave GitOps Enterprise Akuity Both Flux and Argo CD are very popular with an active community. Flux defines itself as “a set of continuous and progressive delivery solutions for Kubernetes that are open and extensible”, whereas Argo CD is “a declarative, GitOps continuous delivery tool for Kubernetes”. Based exclusively on this, one might conclude that there’s no clear distinction in their mission statement, however as we dive deeper, we will see that they take a different approach and offer a slightly different feature set. Argo CD is part of Argo, an umbrella project comprising of multiple productivity focused tools, and is currently incubating under the CNCF. Jesse Suen, creator of the Argo project, told in Kubernetes Podcast #172 about the origins of Argo CD: “we needed to build a delivery tool for developer teams (at Intuit - ed) and we heavily focused on things like the user experience and the UI, and GitOps happened to be the mechanism we chose to do the delivery aspect of it”. He claims that Argo CD is more developer-experience-centric, whereas Flux is more operator centric. There has been an attempt to merge the two projects, but in the end the Flux team went with a different approach which became the GitOps Toolkit (Flux2). Flux predates Argo CD and has been around since 2017. I explore the second major version of Flux, which resolves many shortcomings, offers better observability, ease of integrating, composability, and extensibility over the first, which is now in maintenance mode. Flux 2 is comprised of GitOps Toolkit components, k8s operators that reconcile GitOps resources of different kinds. For example, the source controller is responsible for source repositories, the helm controller - Helm releases, etc. This article follows with the comparison of the two frameworks organized by core aspects, such as how they carry out reconciliaton, what tools they support, etc. Bear in mind that I do not attempt a full comparison, for the sake of conciseness and because of my limited research, covering the core functionalities and our use cases. I still believe that it could prove useful for many. Kubernetes Cluster Reconciliation Reconciliation or synchronization (sync) is the act of modifying the cluster state to match the description stored in git. Both platforms support automated sync, i.e they can reconcile the cluster state automatically after a change in GitOps; and manual sync where the action is triggered directly by a human or some external service agent. As it was previously mentioned, Flux is componentized. Reconciliation specifics may vary between components. I am using Kustomization in the examples here, but the concepts should work similarly for all sync-able GitOps resources. Caveats will be discussed in detail in the tool-specific sections later. Manual Sync Argo CD With Argo CD, you declaratively specify manual sync by setting syncPolicy: {} on the Application GitOps resource. This way, Argo CD will detect changes, show them on the UI, etc, but will not take action to reconcile them. Instead, synchronization can be manually triggered on the web UI (which is very straightforward for beginners) or the CLI with argocd app sync. Flux Using Flux, automatic reconciliation is the norm, but you can opt-out of it by ‘suspending’ the GitOps resource. This can be done declaratively by setting suspend: true. To do manual sync on-demand on a suspended GitOps resource, set the reconcile.fluxcd.io/requestedAt annotation to the current time: kubectl annotate --field-manager=flux-client-side-apply --overwrite \ kustomization/podinfo reconcile.fluxcd.io/requestedAt="$(date +%s)" It’s worth noting that running flux reconcile against a suspended resource will not trigger the reconciliation. Requiring a manual edit to the cluster state for this override was an intentional design choice. Essentially, on-demand, manual synchronization doesn’t have a declarative setting, so Flux doesn’t wish to support it via its CLI either. Another way to trigger reconciliation is to temporarily flux resume the resource. One can argue that this is an imperative action too. The difference is that suspend has a declarative setting, so the command effectively edits an in-cluster resource, similarly to e.g kubectl scale deployment. Admittedly, this still hurts auditability, since the GitOps state is overridden (at least until the next reconciliation). GitOps Source Tracking Source tracking controls how changes are detected in the GitOps resource. Both Argo CD and Flux can be configured to track a branch, a tag pattern, or a fixed commit hash in git. Cluster Drift Reconciliation (Self Heal) With source tracking the cluster will follow the desired state in git, but what if someone carries out a manual edit to the cluster? Cluster drift reconciliation (self heal in Argo lingo) entails resyncing the cluster state after a change outside GitOps control, e.g a manual edit with kubectl. It can ensure that the cluster adheres to the declared state (eventually). Both Argo CD and Flux support this feature with caveats. Argo CD provides this as an optional feature, which requires automatic sync to be enabled, and it disables rollbacks. In Flux, support varies by GitOps resource kind. For Kustomizations, cluster drift is reconciled by default, and the only way to opt-out is to annotate individual resources. On the other hand, Flux does not support this feature for Helm releases at all. (We’ll see more on these in the Helm section.) Flux does not distinguish by trigger cause, consequently ‘self-heal’ won’t be carried out if the resource is ignored or the owning GitOps resource is suspended. Garbage Collection (Pruning) Garbage collection controls what happens to resources getting untracked in source control. Both tools take a similar approach, exposing a setting whether they should be deleted or kept. You can also prevent garbage collection of specific resources with an annotation (Argo, Flux). Sync Windows There are cases when you don’t want to allow resource updates, only during a specific maintenance window. Using Argo CD, this can be achieved with sync windows. Using sync windows, automatic or all syncs can be denied except for a certain time frame. Flux doesn’t offer this feature, although a design has already been proposed. Currently, it can be achieved with a CronJob that resumes the resource for the duration of the maintenance window. Selective Sync Argo CD supports selective (or partial) syncs, i.e only selected resources get synced. Similarly to an ordinary manual sync, this can be done from the web UI or the CLI. However, selected syncs are not recorded in history and hooks are not run. In Flux there’s no mechanism for this, however if your only use case is to ignore certain resources during reconciliation you can label them (Flux). Hooks Argo CD sync behavior can be customized with hooks. If you are familiar with Helm hooks, this is the same thing in essence, e.g allows you to deploy resources in a specific order, run a job (such as a database migration) or trigger a notification after the deployment. Argo CD also understands Helm hooks. Flux doesn’t provide hooks in general, but an individual tool (such as Helm) might provide their own. Summary Flux Argo CD Automated sync ✅ ✅ Manual sync ✅ ✅ Cluster drift reconciliation (Self heal) ⚠️ ✅ Garbage collection (Pruning) ✅ ✅ Sync windows ⛔ ✅ Selective reconciliation ⛔ ✅ Sync hooks ⚠️ Helm support ✅ Kustomize Kustomize is a utility for customizing application configuration in a template-free way, and is a core K8s tool shipping with kubectl. Both Argo CD and Flux supports Kustomize. Argo CD relies on a tool detection mechanism, which checks the directory contents and uses kustomize if it finds a kustomization.yaml, kustomization.yml, or Kustomization. Bear in mind that tool-specific settings will override the implicit behavior, which can be surprising at first. apiVersion: argoproj.io/v1alpha1 kind: Applic'
