title = """
About EasyEDA -    EasyEDA"""
description = """
Pro Edition                                                                                                        Brand new interactions and interfaces.                                                                                                            Smooth support for design sizes of over 3Wdevices or 10W pads.                                                                                                        More rigorous design constraints, more standardized processes                                                                                                        For enterprises, more professional users."""
full_description = "Pro Edition Brand new interactions and interfaces. Smooth support for design sizes of over 3Wdevices or 10W pads. More rigorous design constraints, more standardized processes For enterprises, more professional users. Std Edition Easy to use and quick to get started. The process supports design scales of 300devices or 1000 pads. Supports simple circuit simulation. For students, teachers, creators. EasyEDA is an easier and powerful online PCB design tool that allows electronics engineers, educators, students, makers, and enthusiasts to design and share their projects. This is a design tool integrated LCSC components catalog and JLCPCB PCB service that helps users to save time to make their ideas into real products. We are makers, hackers and engineers. When we wanted to design and build some hardware stuff seven years ago, we spent weeks trying to find the right tools. We needed schematic capture, spice simulation and PCB layout but we wanted it to not be Windows only and we didn't like the idea of having to pay lots of money to buy a huge software suite and then spend weeks learning how to use it. But we didn't found it. Then we decided to develop a new PCB design tool named EasyEDA, we want it is a powerful, easier, and free EDA tool. And EasyEDA is keep updating now. In short, EasyEDA will bring you an easier EDA experience, letting you enjoy more of the journey from an idea to a product."
