["https://www.ebay.co.uk/adchoice"]
title = "AdChoice - eBay advertising preferences"
description = "In order to show customised ads we think you'll find interesting on and off our affiliated properties, we may use information you make available to us when you interact with our sites, content or services. You have the ability to opt out of these customised ads at any time. Please keep in mind if you opt out, you'll still see ads, but they won't be tailored to your interests based on your eBay activity."
full_description = "Confirm Opt InAre you sure you want to opt back in?CancelConfirmAdChoice - eBay advertising preferencesWhat is AdChoice?In order to show customised ads we think you'll find interesting on and off our affiliated properties, we may use information you make available to us when you interact with our sites, content or services. You have the ability to opt out of these customised ads at any time. Please keep in mind if you opt out, you'll still see ads, but they won't be tailored to your interests based on your eBay activity.Error: We were unable to complete your request. Please try again.May we use your eBay activity to show you customised ads?YesNoYou have opted out of AdChoice for this browser.You will no longer see customised ads in this browser based on your eBay activity. It may take a few hours for these changes to take effect. Please note you'll still see ads, but they may not be as relevant. If you use other browsers and devices to access the internet, you'll need to opt out on those browsers and devices as well. Learn more For a more consistent AdChoice experience, please sign into your account and set your AdChoice preferences there. Sign in How we bring these ads to youWhat information we haveWhen you use a website or service provided by a member of the eBay corporate family, or interact with our content or services in other ways, we have access to certain information, like the search terms you enter and the content on the pages you view. We may also have access to or can assume things like demographics (where you live, your age range, or gender) or financial preferences (such as whether you usually pay with credit cards or PayPal). Click here for more information about the types of information that we gather.How we use the informationWe use that information to help us figure out what you might be interested in seeing. This lets us tailor and improve your online experience – both on websites of the eBay corporate family and elsewhere on the web.Who we work withWe may work with other companies, like websites or ad networks, to show customised ads to you. These partners may have access to your information in order to assist us in providing you with customised ads. Advertisers and other third parties (e.g. advertising platforms and service providers they may use) may assume that users who interact with a targeted ad are part of the group that the ad is directed toward. Also, some third parties may provide us with information about you (e.g. demographic information) from offline and online sources that we may use to provide you with more relevant advertising. Read more about our policies on sharing information with other companies in our Privacy Notice.How you can control your informationBut you can tell us not to use your eBay activity to customise advertising we show you, whether on eBay or anywhere else on the web. Whenever you see the About or Adchoice link next to or in one of the ads we serve, or in the footer of one of our websites, click it to check and change your advertising preferences. Also, we support the Self-Regulatory Principles for Online Behavioural Advertising developed by the Digital Advertising Alliance (DAA), and have integrated our opt-out platform with the DAA choice tool available here. Remember, when you opt out, you'll still see ads, but they won't be tailored to your interests based on your eBay activity."
year_published = 2025
clearnet = "https://www.ebay.co.uk/adchoice"
tags = ["activity", "adchoice", "adchoice?", "ads?", "advertising", "again.", "bring", "category", "complete", "confirm"]
language = "en"
