title = "Draco Concordans"
full_description = "The Dragon Waiting is a fantasy, an alternate history, a tragedy, and a game of stories. John M. Ford juggles his works -- historians' views, Shakespeare's plays, legends, mysteries, secrets -- in a way that looks effortless; until you look up, and see all the other pieces flying through the air, sparkling and reflecting off each other. This means a lot of documentation. Much of it will be, for any given reader, unnecessary. If you find that many (or most) of the topics here explain the obvious, I hope you'll forgive them for the sake of the shiny bits around the edges. Like any discussion of art, this documentation constitutes an opinion. That opinion, and the interpretations herein, are my own. I have gathered as many as I could in forming them; if I have disregarded yours, please write and tell me. Documentation also means spoilers. I make no attempt to preserve the narrative tension or pacing of revelation that John M. Ford intended. If you haven't read The Dragon Waiting, for the gods' sakes, put this aside and go read it first. Draco Concordans has two parts: a set of page-by-page notes, and an index of topics which appear in the text. I have tried to cross-link and cross-reference everything fluidly. All page numbers are from the 1985 Avon paperback edition, because that's what I have. Names are in the most commonly-used form. Have I missed things in The Dragon Waiting? Yes; yes, I have. (Some things I missed.) Do you know what they are? Please let me know! Corrections, emendations, redactions, connections, historical references, bad jokes, and trivia are all welcome. Email to erkyrath@eblong.com. All quotations from The Dragon Waiting are copyright 1983 by John M. Ford. I reproduce them for scholarship. The rest of Draco Concordans is copyright 2007 by Andrew Plotkin. These pages were designed and edited by Andrew Plotkin. The information within was contributed by many, starting with the aforementioned Plotkin guy, and also including: Gunther Schmidl (German), Emily Short (Latin and Greek), Paul Mazaitis (Italian), Christopher Tate, Elise Matthesen, Charlene Ahn, TexAnne."
