["https://eblong.com/infocom"]
title = "The Obsessively Complete Infocom Catalog"
full_description = '''This site is my attempt to collect every single version of each Infocom game, both source code and compiled game files. I have labelled each package with release and serial number information where possible. (Infocom serial numbers were a timestamp of the compilation date, which is very useful for reconstructing the development sequence.) IF fans of the modern era have used this source code to recompile the Infocom games. Some have taken the opportunity to fix bugs or modify the games. This collection does not include these modern recompilations and updates. (I have no quarrel with them, but I'm not going to keep track.) This collection does include a few fan-modified game files that date from the 1980s. (The modifications only extend to the serial and release numbers.) I include these because they were contemporary with Infocom and thus have some historical interest. Also, they were collected in the early 90s and wound up in the game file lists of the nascent Internet IF community. Jason Scott began this process in April of 2019, when he posted a large collection of Infocom source code on GitHub. Source code and compiled files, in fact. This was tremendously exciting to fans and scholars of old-school text adventures. This material was known to be out there in private collections, but it had never been publicly available in this form. Jason's collections are excellent, but they are an edited extract from one source: the so-called "Infocom Drive". They omit some published variations, beta-tests, and so on. I figure it's good to have every Infocom game file variation in one place. Nonetheless, let me be clear: this site would not exist without Jason Scott's efforts. Thank you, Jason! Also thanks to Beaux Hemmer for maintaining the patch collection. Thanks to Torbjörn Andersson and Alessandro Giassi for enthusiastic help tracking down more versions and info on them. And, of course, thanks to the Implementors who created these games in the first place. If you want to download everything in one go, grab allgamefiles.zip, allsources.zip, allinterpreters.zip, and allother.zip.'''
