["https://eblong.com/if"]
title = "Interactive Fiction"
full_description = "Interactive fiction was the first great computer-game craze. Through the early 1980s, the most sophisticated, complex, involving games available were the text adventures. Everyone agreed. Go look up up old videogame rating charts; Infocom was always on the list — with several games. Of course, advancing graphics eventually washed away IF’s supremacy. By 1990, all the text game companies were closed, or about to be. But... the games didn’t go away. And a community of IF fans — still interested in sophisticated, complex, involving, literate gameplay — continued to create them. You can play my games freely (and for free). All of the games on this page run right in your web browser. These are not demos or previews. They’re complete stories. Everyone’s heard that IF is hard to play. You have to type exactly the right command or you fail, right? Well — no. Modern IF games are pretty easy! They understand a good range of commands, as long as you stick to a familiar pattern. There are variations, but not too many. Furthermore, most situations in every game are amenable to a handful of common commands. I’ve drawn up this handy reference card. It shows all the common commands, and a selection of others, to give you a feel for the overall pattern. (Click for PDF version, HTML version, print-quality bitmap, or others. Card design by Lea Albaugh; text by me; CC-BY-SA) If you still feel overwhelmed, I recommend you start with The Dreamhold, listed below. I wrote it specifically as an IF tutorial game. It will introduce the common IF commands and conventions, step by step, as you play. I launched this game as a Kickstarter project in 2010. It took longer than I expected. It’s done now. Hadean Lands is my first fully commercial text-parser game. Purchase it for iOS, MacOS, Windows, or Linux. Now available on Steam! Won the XYZZY Awards for Best Puzzles, Best Setting, Best Implementation, and Best Use of Innovation for 2014. Not a puzzle game. Explore my (real-life!) library and see what you find. I’d call it a walking simulator, or maybe a browsing simulator."
