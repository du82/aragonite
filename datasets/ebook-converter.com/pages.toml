full_description = 'When you borrow a ebook from public Library, what you are really downloading is an .acsm file. There is a lot of confusion about this file type as the .acsm is not your actual eBook. It is just a link to your eBook that allows a program like Digital Editions to download the actual book, The idea that you could convert an .acsm file to a .pdf file is based on the assumption that the .acsm file contains all the text of a book, and that it’s just in the wrong format. That might be true if it was a .doc file, or any other text-based file. That is not what an .acsm file is. There is no need for you to do any conversion. If you have Adobe Digital Editions installed, then all you have to do is open the .acsm file with that program. Then, the ebook download will continue. When the download is finished, you will have your PDF file. When Digital Editions sees the .acsm file it will automatically download the PDF or ePUB file, which is the actual eBook, so you only remove drm from epub/pdf file, not from .acsm file, This is how to remove drm from epub/pdf file. 2). Open .acsm file in digital editions, When Digital Editions sees the .acsm file it will automatically download the PDF or ePUB file, which is the actual eBook, and then unlock the file’s DRM so that it becomes readable. At this point you should be able to read the library book in Digital Editions. 4). Run PDF ePub DRM Removal, it is easy to use, select ebook file to decrypt, click “Digital editions” button to import ebook files. user also click “Open” button to open digital editions folder, drag drop epub file into converter window. normally for ebook download in digital editions, it is in “My documents\My Digital editons” for windows, for Mac, it is “~/documents/Digital editons” for ebook download in Sony Library, it is in “My documents\My Books\Reader Library\” for Mac, it is in “~/documents/My Books/Reader Library/” 5) When you’re ready to removal DRM protection , click “Removal DRM” button. After a few seconds, you’ll have an ePub/PDF book in output folder.'
