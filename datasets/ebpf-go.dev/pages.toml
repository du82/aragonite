full_description = "Home .md-content .md-typeset h1 { display: none; } The eBPF Library for Go .st0{opacity:0.1;fill:#B2B2B2;} .st1{fill:#F5F6F2;} .st2{fill:#353535;} .st3{fill:#6AD7E5;enable-background:new ;} .st4{fill:#5AC4CC;enable-background:new ;} .st5{fill:#F6D2A2;enable-background:new ;} .st6{fill:#FFFFFF;} .st7{opacity:0.4;fill:#3FA9F5;} .st8{fill:#EAEAEA;} .st9{fill:#3FA9F5;} .st10{fill:#C98A71;} .st11{fill:#B57D64;} .st12{fill:url(#honey-fill_00000101798613600514606140000011368602082329766333_);} .st13{fill:#ED9514;} .st14{fill:#FFAE0B;} .st15{fill:#FBD528;} .st16{fill:#FDC924;} .st17{fill:#FFBE08;} .st18{fill:url(#SVGID_1_);} .st19{fill:url(#SVGID_00000007423551361776189650000009934159544166434735_);} .st20{fill:url(#SVGID_00000132090399014271612000000010518347531147743116_);} .st21{fill:url(#SVGID_00000021113494249328171120000007420835429852217779_);} .st22{fill:url(#SVGID_00000012451459481747628830000006062085529015241888_);} .st23{fill:url(#SVGID_00000137818892375816345860000011238910615435968696_);} .st24{fill:url(#SVGID_00000173851542895903703270000011585150673817013935_);} .st25{fill:url(#SVGID_00000144316360201033580730000014127708888900534919_);} .st26{fill:url(#SVGID_00000166678051755908134460000007859676170076012463_);} .st27{fill:url(#SVGID_00000075164632730769758230000016084742018761887872_);} .st28{fill:url(#SVGID_00000075847131253733953210000012917981349229494939_);} .st29{fill:url(#SVGID_00000041288506758200299280000011340763228136250760_);} .st30{fill:url(#SVGID_00000173862831202021333970000000167051998426845097_);} .st31{fill:url(#SVGID_00000044140724902089375840000006502687802885978037_);} .st32{fill:#E0712E;} .st33{enable-background:new ;} .st34{fill:#FFC200;} .st35{fill:#D9F1FD;enable-background:new ;} .st36{fill:#00AEEF;enable-background:new ;} .st37{opacity:0.3;fill:#FCFCFC;} .st38{opacity:0.2;fill:#FCFCFC;} .st39{fill:#DBDBDB;} .st40{fill:#FDC024;} .st41{fill:#F2A711;} .st42{fill:#D8D8D8;} ebpf-go is a Go library for working with .st0{fill:#FFE100;} .st1{fill:#D9F1FD;} .st2{fill:#00AEEF;} eBPF. It does not depend on C, libbpf, or any other Go libraries other than the standard library, making it an excellent choice for writing self-contained, portable tools that run on a variety of architectures. This documentation aims to provide a central resource for learning how to build Go applications that use eBPF. Installing¶ To add ebpf-go as a dependency to an existing Go module, run this from within the module's directory: go get github.com/cilium/ebpf Target Audience¶ This documentation assumes familiarity with the basic concepts and terminology of eBPF, as well as a basic understanding of the Go toolchain and how to write idiomatic Go code. For a high-level understanding of what eBPF is and how it works, please see the eBPF introduction at .st0{fill:#FFE100;} .st1{fill:#D9F1FD;} .st2{fill:#00AEEF;} ebpf.io. Examples¶ Discover projects using ebpf-go here. The repository contains an examples/ directory with minimal demo applications that can be tested on any supported Linux machine. Last updated 2023-10-04"
