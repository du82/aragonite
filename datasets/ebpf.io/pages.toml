title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "効率的なネットワーキング・オブザーバビリティ・トレーシング・セキュリティのためのカーネル拡張手法プロジェクト概要eBPFとは？プログラムは安全性を検証された上で実行されますカーネル内のあらゆる処理をフックして動作を変更できますJITコンパイラによりネイティブコードに近い速度で実行されます動作中のオペレーティングシステムに機能を追加できますeBPF をプロダクション環境で活用している様々な分野の組織GoogleGoogle は eBPF をセキュリティ監査やパケット処理、パフォーマンス監視に活用しています動画発表NetflixNetflix は eBPF を大規模なネットワーク監視のために活用しています。ブログ動画AndroidAndroid は eBPF を通信量やバッテリー、メモリのプロファイルに活用しています。ドキュメントS&P GlobalS&P Global は eBPF を Cilium を用いて複数のクラウドとオンプレミス間のネットワーキングに活用しています。動画ShopifyShopify は eBPF を Falco を用いた侵入検知に活用しています。動画CloudflareCloudflare は eBPF をネットワークセキュリティやパフォーマンス監視、ネットワークオブザーバビリティに活用しています。ブログ発表他の事例なぜ eBPF なのか？eBPFとは？パフォーマンスeBPF は JIT コンパイルとカーネル内での直接実行によって、処理性能を劇的に向上させます。セキュリティeBPF プログラムはカーネルをクラッシュさせないか検証され、特権ユーザだけが変更できます。柔軟性カーネルの再起動やパッチの適用なしに、機能の追加や動作の変更ができます。eBPFとは？PremiereUnlocking the KerneleBPFの起源を深く掘り下げ、業界に変革をもたらしたこの技術のこれまでの物語や困難、成果をまとめたドキュメンタリーです。Meta・Intel・Isovalent・Google・RedHat・NetflixといったeBPFの成功と普及を牽引した素晴らしい技術者たちの声を聞くことができます。eBPF ドキュメンタリー WebサイトeBPF は問題を簡単に診断し、開発を加速させ、オペレーティングシステムの機能拡張を可能にする新世代のツールを開発者にもたらしました。Mark Russinovich — Chief Technology Officer at Microsoft Azure, 2021eBPF で何ができるか？ネットワーキングカーネル空間を離れることなくパケット処理を高速化します。新しくプロトコルパーサを追加したり、変化する要件に合わせて転送ロジックを容易にプログラムできます。オブザーバビリティカスタムメトリクスをカーネル内で収集、集計し、イベントやさまざまなデータ構造の形で出力できます。オーバーヘッドの大きいサンプル出力は必要ありません。トレース & プロファイリングeBPF プログラムをカーネルやユーザーアプリケーションの probe ポイントにアタッチすることで、システム内部の詳細な観測や、性能問題の解決のための情報が得られます。セキュリティ全てのシステムコールを検知・把握し、全ての通信パケットとソケットレベルの観測結果を組み合わせることで、より多くのコンテキストを持ち、より多くをコントロールできるセキュリティシステムを構築できます。eBPF コミュニティによるトーク"
year_published = 2025
