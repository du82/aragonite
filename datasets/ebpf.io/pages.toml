["https://ebpf.io/it-it"]
title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "Programma dinamicamente il kernel per networking efficiente, osservabilità, tracciamento e sicurezzaPanorama dei ProgettiCos’è eBPFI programmi sono verificati per essere eseguiti in sicurezzaAgganciali ovunque nel kernel per modificarne la funzionalitàCompilatore JIT per una velocità d’esecuzione quasi nativaAggiungi funzionalità del sistema operativo in fase di esecuzioneLe organizzazioni di ogni settore usano eBPF in produzioneGoogleGoogle usa eBPF per l’auditing di sicurezza, l’elaborazione dei pacchetti di rete, e il monitoraggio delle performance.Video 1Video 2Talk 1Talk 2NetflixNetflix usa eBPF su larga scala per ottenere informazioni sulla rete.BlogAndroidAndroid usa eBPF per il monitoraggio dell’uso della rete, dell’energia e la profilazione della memoria.DocsS&P GlobalS&P Global usa eBPF attraverso Cilium per il networking su molteplici cloud e on-prem.VideoShopifyShopify usa eBPF attraverso Falco per il rilevamento delle intrusioni.VideoCloudflareCloudflare usa eBPF per la sicurezza di rete, monitoraggio delle prestazioni e l’osservabilità della rete.BlogTalkAltri casi di studioPerché eBPF?Cos’è eBPFPrestazionieBPF migliora drasticamente l’elaborazione essendo compilato JIT ed eseguito direttamente nel kernel.SicurezzaI programmi eBPF sono verificati per evitare il crash del kernel e possono essere modificati solo da utenti privilegiati.FlessibilitàModificare o aggiungere una funzionalità e casi d’uso al kernel senza doverlo riavviare o applicare una patch.Cos’è eBPFPremiereUnlocking the KernelThe eBPF Documentary provides an in-depth exploration on the origins of eBPF and showcases the stories, challenges, and rewards of this industry changing technology. You will hear from the best and brightest in the open source world, including key stakeholders from Meta, Intel, Isovalent, Google, Red Hat, and Netflix, who helped shape and build the tools that drove the success and adoption of eBPF.eBPF Documentary WebsiteeBPF ha dato vita a una nuova generazione di strumenti che permettono agli sviluppatori di diagnosticare i problemi facilmente, innovare velocemente ed estendere le funzionalità del sistema operativo.Mark Russinovich — Chief Technology Officer at Microsoft Azure, 2021Cosa è possibile fare con eBPF?ReteElaborazione veloce dei pacchetti di rete senza lasciare lo spazio kernel. Aggiungere ulteriori parser di protocollo e programmare facilmente logiche di inoltro per soddisfare requisiti in continua evoluzioneOsservabilitàRaccolta e aggregazione delle metriche personalizzate in-kernel con generazione di eventi di visibilità e strutture dati da un’ampia gamma di possibili fonti senza dover esportare campioni.Tracciamento e ProfilazioneCollega i programmi eBPF ai punti di tracciamento e ai punti sonda del kernel e delle applicazioni utente, e sfrutta potenti capacità di introspezione e approfondimenti unici per la risoluzione dei problemi di prestazioni del sistema.SicurezzaCombina la visione e la comprensione di tutte le chiamate di sistema con una osservabilità a livello di pacchetto e di socket di tutto il networking per creare sistemi di sicurezza che operano in un contesto più ampio e con un migliore livello di controllo.Talks della community eBPF"
year_published = 2025
