title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "eBPF案例研究以下是一些在生產環境中使用 eBPF 的組織。 如果您正在使用 eBPF 而不在此清單中，請提交一個 pull request 給我們，謝謝。GoogleGoogle 在安全審計、資料包處理和效能監控方面使用eBPF。影片演講NetflixNetflix 在網絡洞察領域大規模使用 eBPF。部落格影片AndroidAndroid 在監控網路使用率、電力情況和內存分析中使用eBPF。文檔S&P GlobalS&P Global 透過 Cilium 組件中的 eBPF 實現兼容多個雲端和本地化部署的網絡架構。影片ShopifyShopify 透過 Falco 中的 eBPF 進行入侵偵測。影片CloudflareCloudflare 在網路安全、效能監控和網路可觀察性中使用eBPF。部落格演講MicrosoftMicrosot 使用 eBPF 增強 Kubernetes 內進程的可觀察性和洞察能力演講SamsungSamsung 在他們的 Android 裝置中使用 eBPF 進行網路連接演講IkeaIkea 在私有雲中透過 Cilium 使用 eBPF 進行網路實現和負載平衡影片AppleApple 透過 Falco 使用 eBPF 進行核心安全監控影片MetaMeta 在資料中心中使用 eBPF 對每一個資料封包進行傳輸和負載平衡影片部落格演講DoorDashDoorDash 透過 BPFAgent 使用 eBPF 進行核心級監控部落格DatadogDatadog 在其 SaaS 產品中使用 eBPF 實現網路和安全影片部落格演講AlibabaAlibaba 透過 Cilium 使用 eBPF 在雲端提供網路部落格演講Red HatRed Hat 在他們的私有雲中大規模使用 eBPF 進行負載平衡和追蹤演講SeznamSeznam 使用 eBPF 進行負載平衡部落格演講Trip.comTrip.com 使用 eBPF 進行負載平衡部落格演講BellBell Canada uses eBPF to moderize telco networking with SRv6演讲Wildlife StudiosWildlife Studios uses eBPF through Cilium for high performance game networking部落格TalkCapital OneCapital One uses eBPF to secure their cloud infrastructureTalkSkySky uses eBPF through Cilium for cloud networkingTalkWalmartWalmart uses eBPF for edge cloud load balancingTalk部落格PalantirPalantir uses eBPF to debug networking problemsVideoCruiseCruise uses eBPF to monitor GPU performanceVideoDigital OceanDigital Ocean uses eBPF to monitor GPU performanceTalkYahooYahoo uses eBPF for load balancing and performance analysisVideoTalkBytedanceBytedance uses eBPF for system tracing部落格F5F5 BIG-IP integration with Cilium VTEP featureVideoGuideLinkedInLinkedIn uses eBPF for Infrastructure Observability部落格The New York TimesThe New York Times uses eBPF for networkingVideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real time.部落格Aqua SecurityAqua Security uses eBPF to handle runtime detection and forensics部落格AkitaAkita uses eBPF at scale for API observabilityDocsLine CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloudTalkExeinExein uses eBPF in their open source runtime security framework for IoTTalkAnt GroupAnt Group uses eBPF in their cloud native security platform for vulnerability live-patching, and system anomaly detectionTalkSysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from the kernelTalk部落格KodemKodem uses eBPF for application visibilty and runtime intelligence部落格CycodeCycode uses eBPF for CI/CD securityTalk部落格WizWiz uses eBPF to provide real-time threat detection and monitoring within cloud workloads部落格Core TechCore Tech 使用 eBPF 過濾掉不需要的流量並緩解 DDoS 攻擊部落格FlowSecurityFlow Security 使用 eBPF 技術分析動態數據，以進行數據發現、分類、風險管理以及數據違規檢測和回應部落格HeliosHelios 在他們的運行時分析工具中使用 eBPF 以實現可觀察性和安全性部落格Qpoint.qpoint_inline_svg__cls-1{fill:#895ae8}Qpoint 使用 eBPF 監控並保護到外部供應商 API 的出站流量部落格Attribute.attribute_inline_svg__s0{fill:#004742}Attribute uses eBPF to provide real time, no tagging cloud cost visibility and attribution for dynamic environments部落格Protect AIProtect AI 利用 eBPF 在生產環境的執行階段保護 LLM 應用程式，為進階威脅偵測與回應能力提供可視性部落格"
