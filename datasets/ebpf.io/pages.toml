full_description = "Estudos de Caso eBPFAqui estão algumas das organizações que estão usando o eBPF na produção. Se você estiver usando eBPF e não estiver nesta lista, envie uma solicitação pull.GoogleO Google usa eBPF para auditoria de segurança, processamento de pacotes e monitoramento de desempenho.VideoTalkNetflixA Netflix usa eBPF em escala para obter insights de rede.BlogVideoAndroidO Android usa eBPF para monitorar o uso da rede, energia e perfil de memória.DocsS&P GlobalS&P Global usa eBPF por meio do Cilium para rede em múltiplas nuvens e no local.VideoShopifyShopify usa eBPF por meio do Falco para deteção de intrusões.VideoCloudflareCloudflare usa eBPF para segurança de rede, monitoramento de desempenho e observabilidade de rede.BlogTalkMicrosoftMicrosot uses eBPF to enhance the observability and inspection of processes within KubernetesTalkSamsungSamsung uses eBPF in their android devices for networkingTalkIkeaIkea uses eBPF through Cilium for networking and load balancing in their private cloudVideoAppleApple uses eBPF through Falco for kernel security monitoringVideoMetaMeta uses eBPF to process and load balance every packet coming into their data centersVideoBlogTalkDoorDashDoorDash uses eBPF through BPFAgent for kernel level monitoringBlogDatadogDatadog uses eBPF for networking and security in their SaaS productVideoBlogTalkAlibabaAlibaba uses eBPF through Cilium to provide networking in their cloudBlogTalkRed HatRed Hat uses eBPF at scale for load balancing and tracing in their private cloudTalkIsovalenteBPF is the technlogy that powers Isovalent's enterpise networking, observability and security solutionsTalkBlogSeznamSeznam uses eBPF for load balancingBlogTalkTrip.comTrip.com uses eBPF for load balancingBlogTalkBellBell Canada uses eBPF to moderize telco networking with SRv6TalkWildlife StudiosWildlife Studios uses eBPF through Cilium for high performance game networkingBlogTalkCapital OneCapital One uses eBPF to secure their cloud infrastructureTalkSkySky uses eBPF through Cilium for cloud networkingTalkWalmartWalmart uses eBPF for edge cloud load balancingTalkBlogPalantirPalantir uses eBPF to debug networking problemsVideoCruiseCruise uses eBPF to monitor GPU performanceVideoDigital OceanDigital Ocean uses eBPF to monitor GPU performanceTalkYahooYahoo uses eBPF for load balancing and performance analysisVideoTalkBytedanceBytedance uses eBPF for system tracingBlogF5F5 BIG-IP integration with Cilium VTEP featureVideoGuideLinkedInLinkedIn uses eBPF for Infrastructure ObservabilityBlogThe New York TimesThe New York Times uses eBPF for networkingVideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real time.BlogAqua SecurityAqua Security uses eBPF to handle runtime detection and forensicsBlogOligo SecurityOligo Security uses eBPF for application security observability and protectionBlogAkitaAkita uses eBPF at scale for API observabilityDocsLine CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloudTalkExeinExein uses eBPF in their open source runtime security framework for IoTTalkAnt GroupAnt Group uses eBPF in their cloud native security platform for vulnerability live-patching, and system anomaly detectionTalkSysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from the kernelTalkBlogKodemKodem uses eBPF for application visibilty and runtime intelligenceBlogCycodeCycode uses eBPF for CI/CD securityTalkBlogWizWiz uses eBPF to provide real-time threat detection and monitoring within cloud workloadsBlogCore TechCore Tech uses eBPF to filter out unwanted traffic and mitigate DDoS attacks BlogFlowSecurityFlow Security uses eBPF technology to analyze data in motion for data discovery, classification, risk management, and data violation detection and responseBlogHeliosHelios uses eBPF in their runtime analysis tool for observability and securityBlogThreatXThreatX uses eBPF for securing their runtime environment and delivering real-time blocking for runtime threatsBlogLevoLevo uses eBPF for API discovery and documentationDocsTraceableTraceable uses eBPF for enhanced data collectionBlogQpoint.qpoint_inline_svg__cls-1{fill:#895ae8}Qpoint utiliza eBPF para monitorar e proteger o tráfego de saída para as suas APIs de fornecedores externosBlogAttribute.attribute_inline_svg__s0{fill:#004742}Attribute uses eBPF to provide real time, no tagging cloud cost visibility and attribution for dynamic environmentsBlogProtect AIProtect AI utiliza eBPF para proteger aplicações LLM em produção durante a sua execução, proporcionando visibilidade para capacidades avançadas de deteção e resposta a ameaçasBlog"
