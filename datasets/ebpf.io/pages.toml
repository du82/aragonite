title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "eBPF 案例研究下面是一些在生产环境中使用 eBPF 的公司或组织。如果你的公司或组织正在使用 eBPF 还不在这个列表里，请提交一个 pull request 给我们，谢谢。GoogleGoogle 在网络安全审计、网络数据包传输以及性能监控上应用了 eBPF。视频演讲NetflixNetflix 在网络洞察领域大规模应用 eBPF。博客视频AndroidAndroid 在网络使用率，电力情况以及内存分析中使用 eBPF。文档S&P GlobalS&P Global 通过 Cilium 组件中的 eBPF 实现兼容多个云厂商和自建机房的网络架构。视频ShopifyShopify 通过 Falco 中的 eBPF 进行网络流量的入侵检测。视频CloudflareCloudflare 在网络安全、性能监控和网络观测中应用了 eBPF博客演讲MicrosoftMicrosot 使用 eBPF 增强了 Kubernetes 内部的可观测性和洞察能力演讲SamsungSamsung 在他们的安卓设备网络中使用了 eBPF演讲IkeaIkea 在私有云中通过使用 Cilium 进行网络实现和负载均衡应用了 eBPF视频AppleApple 通过使用 Falco 监控内核安全性应用了 eBPF视频MetaMeta 在数据中心中使用 eBPF 对每个数据包传输和负载均衡视频博客演讲DoorDashDoorDash 通过使用 BPFAgent 实现了内核级别监控应用了 eBPF博客DatadogDatadog 在他们的 SaaS 产品的网络和安全功能中使用了 eBPF视频博客演讲AlibabaAlibaba 在云中使用 Cilium 实现网络功能应用了 eBPF博客演讲Red HatRed Hat 在他们的私有云中大规模使用 eBPF 进行负载均衡和追踪演讲SeznamSeznam 使用 eBPF 进行负载均衡博客演讲Trip.comTrip.com 使用 eBPF 进行负载均衡博客演讲BellBell Canada uses eBPF to moderize telco networking with SRv6演讲Wildlife StudiosWildlife Studios uses eBPF through Cilium for high performance game networking博客TalkCapital OneCapital One uses eBPF to secure their cloud infrastructureTalkSkySky uses eBPF through Cilium for cloud networkingTalkWalmartWalmart uses eBPF for edge cloud load balancingTalk博客PalantirPalantir uses eBPF to debug networking problemsVideoCruiseCruise uses eBPF to monitor GPU performanceVideoDigital OceanDigital Ocean uses eBPF to monitor GPU performanceTalkYahooYahoo uses eBPF for load balancing and performance analysisVideoTalkBytedanceBytedance uses eBPF for system tracing博客F5F5 BIG-IP integration with Cilium VTEP featureVideoGuideLinkedInLinkedIn uses eBPF for Infrastructure Observability博客The New York TimesThe New York Times uses eBPF for networkingVideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real time.博客Aqua SecurityAqua Security uses eBPF to handle runtime detection and forensics博客AkitaAkita uses eBPF at scale for API observabilityDocsLine CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloudTalkExeinExein uses eBPF in their open source runtime security framework for IoTTalkAnt GroupAnt Group uses eBPF in their cloud native security platform for vulnerability live-patching, and system anomaly detectionTalkSysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from the kernelTalk博客KodemKodem uses eBPF for application visibilty and runtime intelligence博客CycodeCycode uses eBPF for CI/CD securityTalk博客WizWiz uses eBPF to provide real-time threat detection and monitoring within cloud workloads博客Core TechCore Tech 使用 eBPF 过滤不需要的流量和缓解 DDoS 攻击博客FlowSecurityFlow Security 使用 eBPF 技术分析动态数据，用于数据发现、分类、风险管理以及数据违规检测和响应博客HeliosHelios 在他们的运行时分析工具可观测性和安全性功能中应用了 eBPF博客ThreatXThreatX uses eBPF for securing their runtime environment and delivering real-time blocking for runtime threats博客LevoLevo uses eBPF for API discovery and documentationDocsTraceableTraceable uses eBPF for enhanced data collection博客Qpoint.qpoint_inline_svg__cls-1{fill:#895ae8}Qpoint 使用 eBPF 监控并保护到外部供应商 API 的出站流量博客Attribute.attribute_inline_svg__s0{fill:#004742}Attribute uses eBPF to provide real time, no tagging cloud cost visibility and attribution for dynamic environments博客Protect AIProtect AI 利用 eBPF 在生产环境的运行时保护 LLM 应用，为高级威胁检测和响应能力提供可见性博客"
