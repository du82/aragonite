title = "Come contribuire a eBPF"
description = "Vuoi sapere come contribuire a eBPF? Impara come iniziare a contribuire ai progetti eBPF."
full_description = 'Come contribuire a eBPFeBPF è costituito da molte community tra cui il runtime eBPF nel kernel Linux, vari SDK e librerie di sviluppo, una serie di progetti di grandi dimensioni che utilizzano eBPF e un’ampia serie di progetti e strumenti più piccoli. Esistono quindi molti modi per contribuire alla comunità eBPF ed essere coinvolti. Il seguente elenco di idee può servire come punto di partenza su come puoi essere coinvolto e contribuire alla comunità.<picture><source type="image/webp" srcSet="/static/d8527cbd6131769de174953924771175/58e8a/contribute-hero.webp 148w,/static/d8527cbd6131769de174953924771175/75d56/contribute-hero.webp 296w,/static/d8527cbd6131769de174953924771175/7ab43/contribute-hero.webp 592w" sizes="(min-width: 592px) 592px, 100vw"/><img data-gatsby-image-ssr="" class="rounded-l-lg lg:rounded-t-lg lg:rounded-bl-none" data-main-image="" style="object-position:20% 20%;opacity:0" sizes="(min-width: 592px) 592px, 100vw" decoding="async" loading="eager" src="/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg" srcSet="/static/d8527cbd6131769de174953924771175/abeaa/contribute-hero.jpg 148w,/static/d8527cbd6131769de174953924771175/ff0e2/contribute-hero.jpg 296w,/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg 592w" alt="Maintainers of the eBPF runtime in the Linux kernel"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Contribuisci al runtime eBPF nel kernel LinuxLa community del kernel Linux mantiene alberature Git separate per il sottosistema eBPF per gestire tutti i contributi degli sviluppatori. Queste alberature sono mantenute da:Alexei Starovoitov, FacebookDaniel Borkmann, Cilium/IsovalentLavorare sul runtime eBPF può essere incredibilmente gratificante poiché crea le basi per la scrittura di software che può essere eseguito su milioni di sistemi e dispositivi. Il lavoro include un’ampia gamma di argomenti, dall’aggiunta del supporto a hook aggiuntivi, l’aggiunta di nuovi tipi di programmi, miglioramenti al verificatore eBPF, l’aggiunta del supporto JIT per architetture CPU aggiuntive, l’estensione del set di helper BPF, l’aggiunta di nuovi casi di test all’infrastruttura di test di BPF o miglioramenti a bpftool e libbpf.Alberature GitLinux kernel eBPF runtimeContribuisci a un progetto eBPFLa lista dei progetti basati su eBPF è lunga e in crescita costante. Sarà semplice individuare un progetto che susciti interesse. Dai un’occhiata per avere una panoramica dei progetti basati su eBPF.Molti dei progetti basati su eBPF elencati mantengono un elenco di attività etichettate come "good-first-issue" che hanno lo scopo di non richiedere una conoscenza approfondita specifica del progetto e di fornire una grande opportunità per cominciare rapidamente a metterci le mani.Panorama eBPFContribuisci alla toolchain di sviluppo eBPFNonostante il kernel di Linux fornisca librerie e API minimali per usare eBPF direttamente, la maggioranza dei progetti sfrutta una toolchain di sviluppo eBPF per semplificare l’uso di eBPF e condividere codice comune con altri progetti.Consulta la toolchain di sviluppo eBPF per una lista di progetti che viene frequentemente aggiornata in questo spazio. Troverai informazioni su come partecipare direttamente sul sito web di ciascun progetto.Toolchain di sviluppo eBPFContribuire a ebpf.ioRitieni di aver talento per la scrittura? Sai creare diagrammi? Il contenuto del sito ebpf.io è concesso in licenza con una licenza internazionale Creative Commons Attribution 4.0. Se vuoi essere coinvolto visita il repository GitHub. Assicurati di unirti anche al canale Slack del sito web #ebpf per entrare in contatto con il team che lavora sulla documentazione. Condividi ciò che hai imparato migliorando la documentazione o scrivendo tutorial aggiuntivi.LicenzaRepository GitHubSlack'
