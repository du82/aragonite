title = "Cómo contribuir a eBPF"
description = "¿Quieres aprender cómo contribuir a eBPF? Aprenda cómo empezar a contribuir a los proyectos de eBPF"
full_description = 'Cómo contribuir a eBPFeBPF está formado por muchas comunidades, incluido el tiempo de ejecución de eBPF en el kernel de Linux, varios SDK y bibliotecas de desarrollo, una serie de grandes proyectos que utilizan eBPF y un amplio conjunto de proyectos y herramientas más pequeños. Por tanto, hay muchas formas de contribuir a la comunidad eBPF y participar en ella. La siguiente lista de ideas puede servir como punto de partida sobre cómo participar y contribuir a la comunidad.<picture><source type="image/webp" srcSet="/static/d8527cbd6131769de174953924771175/58e8a/contribute-hero.webp 148w,/static/d8527cbd6131769de174953924771175/75d56/contribute-hero.webp 296w,/static/d8527cbd6131769de174953924771175/7ab43/contribute-hero.webp 592w" sizes="(min-width: 592px) 592px, 100vw"/><img data-gatsby-image-ssr="" class="rounded-l-lg lg:rounded-t-lg lg:rounded-bl-none" data-main-image="" style="object-position:20% 20%;opacity:0" sizes="(min-width: 592px) 592px, 100vw" decoding="async" loading="eager" src="/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg" srcSet="/static/d8527cbd6131769de174953924771175/abeaa/contribute-hero.jpg 148w,/static/d8527cbd6131769de174953924771175/ff0e2/contribute-hero.jpg 296w,/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg 592w" alt="Maintainers of the eBPF runtime in the Linux kernel"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Contribuir al tiempo de ejecución de eBPF en el núcleo de LinuxLa comunidad del núcleo Linux mantiene repositorios Git separados para el subsistema eBPF con el fin de gestionar todas las contribuciones de los desarrolladores. Los repositorios son mantenidos por:Alexei Starovoitov, FacebookDaniel Borkmann, Cilium/IsovalentTrabajar en el tiempo de ejecución de eBPF puede ser increíblemente gratificante, ya que sienta las bases para escribir software que se ejecuta en millones de sistemas y dispositivos. El trabajo incluye una amplia gama de temas, desde añadir soporte a hooks adicionales, añadir nuevos tipos de programas, mejoras en el verificador de eBPF, añadir soporte JIT para arquitecturas de CPU adicionales, ampliar el conjunto de ayudantes de BPF, añadir nuevos casos de prueba a la infraestructura de pruebas de BPF o mejoras en bpftool y libbpf.Git treesLinux kernel eBPF runtimeContribuya a un proyecto eBPFLa lista de proyectos basados en eBPF es larga y sigue creciendo.Le resultará fácil encontrar un proyecto que despierte su interés.Consulte el panorama de eBPF para ver un resumen de los proyectos basados en eBPF.Muchos de los proyectos basados en eBPF que figuran en la lista mantienen una lista de tareas con una buena etiqueta de primer tema, cuyo alcance no requiere amplios conocimientos específicos del proyecto y ofrece una gran oportunidad para ponerse manos a la obra rápidamente.PANORAMA EBPFContribuir a las cadenas de herramientas de desarrollo de eBPFAunque el núcleo de Linux proporciona bibliotecas y API mínimas para utilizar eBPF directamente, la mayoría de los proyectos aprovechan una cadena de herramientas de desarrollo de eBPF para simplificar el uso de eBPF y compartir código común entre otros proyectos.Consulte eBPF development toolchains para obtener una lista actualizada de proyectos en este espacio. Encontrará información sobre cómo participar directamente en el sitio web de cada proyecto.CADENAS DE HERRAMIENTAS DE DESARROLLO EBPFContribuya a ebpf.io¿Tiene talento para escribir? ¿Se le dan bien los diagramas? El contenido del sitio web ebpf.io está sujeto a una licencia internacional Creative Commons Attribution 4.0. Si quieres participar, visita el repositorio de GitHub. Asegúrate también de unirte al canal de Slack #ebpf-website para ponerte en contacto con el equipo que trabaja en la documentación. Comparte lo que has aprendido mejorando la documentación o escribiendo tutoriales adicionales.LICENCIAREPOSITORIO GITHUBSlack'
year_published = 2025
clearnet = "https://ebpf.io/es/contribute"
