title = "Mandhari ya Matumizi ya eBPF"
description = "Orodha ya programu za chanzo wazi zinazotumia eBPF"
full_description = '''MatumiziMatumiziMiundombinuMatumizi MakubwabccToolkit and library for efficient BPF-based kernel tracingBCC is a toolkit for creating efficient kernel tracing and manipulation programs built upon eBPF, and includes several useful command-line tools and examples. BCC eases writing of eBPF programs for kernel instrumentation in C, includes a wrapper around LLVM, and front-ends in Python and Lua. It also provides a high-level library for direct integration into applications.GitHubCiliumeBPF-based Networking, Security, and ObservabilityCilium is an open source project that provides eBPF-powered networking, security and observability. It has been specifically designed from the ground up to bring the advantages of eBPF to the world of Kubernetes and to address the new scalability, security and visibility requirements of container workloads.GitHubWebsite<picture><source type="image/webp" srcSet="/static/f7bee64babafd98d2bb3f5d5bc0e8482/5229c/bpftrace.webp 29w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/66ec8/bpftrace.webp 58w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/61cab/bpftrace.webp 116w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/e05f2/bpftrace.webp 232w" sizes="(min-width: 116px) 116px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 116px) 116px, 100vw" decoding="async" loading="lazy" src="/static/f7bee64babafd98d2bb3f5d5bc0e8482/6fd36/bpftrace.png" srcSet="/static/f7bee64babafd98d2bb3f5d5bc0e8482/48acf/bpftrace.png 29w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/d18df/bpftrace.png 58w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/6fd36/bpftrace.png 116w,/static/f7bee64babafd98d2bb3f5d5bc0e8482/ea610/bpftrace.png 232w" alt="bpftrace"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}bpftraceHigh-level tracing language for Linux eBPFbpftrace is a high-level tracing language for Linux eBPF. Its language is inspired by awk and C, and predecessor tracers such as DTrace and SystemTap. bpftrace uses LLVM as a backend to compile scripts to eBPF bytecode and makes use of BCC as a library for interacting with the Linux eBPF subsystem as well as existing Linux tracing capabilities and attachment points.GitHubWebsiteFalcoCloud Native Runtime SecurityFalco is a behavioral activity monitor designed to detect anomalous activity in applications. Falco audits a system at the Linux kernel layer with the help of eBPF. It enriches gathered data with other input streams such as container runtime metrics and Kubernetes metrics, and allows to continuously monitor and detect container, application, host, and network activity.GitHubWebsitePixieScriptable observability for KubernetesPixie is an open source observability tool for Kubernetes applications. Pixie uses eBPF to automatically capture telemetry data without the need for manual instrumentation. Developers can use Pixie to view the high-level state of their cluster (service maps, cluster resources, application traffic) and also drill down into more detailed views (pod state, flame graphs, individual full body application requests).GitHubWebsiteCalicoPluggable eBPF-based networking and security for containers and KubernetesCalico Open Source is designed to simplify, scale, and secure container and Kubernetes networks. Calico's eBPF dataplane utilizes the power, speed, and efficiency of eBPF programs to deliver networking, load-balancing, and in-kernel security enforcement for your environment.GitHubWebsiteKatranA high performance layer 4 load balancerKatran is a C++ library and eBPF program to build a high-performance layer 4 load balancing forwarding plane. Katran leverages the XDP infrastructure from the Linux kernel to provide an in-kernel facility for fast packet processing. Its performance scales linearly with the number of NIC's receive queues and it uses RSS friendly encapsulation for forwarding to L7 load balancers.GitHubWebsiteParcaContinuous Profiling PlatformTrack memory, CPU, I/O bottlenecks broken down by method name, class name, and line number over time. Without complex overhead, in any language or framework. Using Parca's UI the data can be globally explored and analyzed using various visualizations to quickly and efficiently identify bottlenecks in code. Parca uses eBPF to collect profiling data and uses libbpf-go to interact with the kernel.GitHubWebsite<picture><source type="image/webp" srcSet="/static/0600a4b87871b8c45b94d6f3c0ea85d1/5229c/tetragon.webp 29w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/66ec8/tetragon.webp 58w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/61cab/tetragon.webp 116w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/e05f2/tetragon.webp 232w" sizes="(min-width: 116px) 116px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 116px) 116px, 100vw" decoding="async" loading="lazy" src="/static/0600a4b87871b8c45b94d6f3c0ea85d1/b81ce/tetragon.svg" srcSet="/static/0600a4b87871b8c45b94d6f3c0ea85d1/7a8be/tetragon.svg 29w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/5c6a3/tetragon.svg 58w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/b81ce/tetragon.svg 116w,/static/0600a4b87871b8c45b94d6f3c0ea85d1/a8d4a/tetragon.svg 232w" alt="Tetragon"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}TetragoneBPF-based Security Observability & Runtime EnforcementTetragon provides eBPF-based transparent security observability combined with real-time runtime enforcement. The deep visibility is achieved without requiring application changes and is provided at low overhead thanks to smart Linux in-kernel filtering and aggregation logic built directly into the eBPF-based kernel-level collector. The embedded runtime enforcement layer is capable of performing access control on kernel functions, system calls and at other enforcement levels.GitHubWebsiteInayojitokezaPyroscopeContinuous Profiling PlatformPyroscope is an open source project centered around continuous profiling, particularly in a Kubernetes context. It leverages eBPF as its core technology along with a custom storage engine to offer system-wide continuous profiling with minimal overhead as well as efficient storage and querying capabilities. We support Linux 4.9 and up thanks to CO-RE and libbpf. GitHubWebsiteeCaptureSSL/TLS capture tool using eBPFeCapture is a Go language-written tool that can capture HTTPS/TLS plaintext without a CA certificate. It supports TLS encryption libraries such as openssl, boringssl, gnutls, and nspr. It can run on x86_64 CPU architectures with Linux kernel 4.18 or higher, and aarch64 CPU architectures with Linux/Android kernel 5.5 or higher, supporting both CO-RE and non-CO-RE modes without BTF.GitHubWebsitecorootZero-instrumentation observabilityCoroot is an open-source eBPF-based observability tool that turns telemetry data into actionable insights, helping you identify and resolve application issues quickly.GitHubWebsiteHubbleNetwork, Service & Security Observability for Kubernetes using eBPFHubble is a fully distributed networking and security observability platform for cloud native workloads. It is built on top of Cilium and eBPF to enable deep visibility into the communication and behavior of services as well as the networking infrastructure in a completely transparent manner.GitHubWebsiteTraceeLinux Runtime Security and Forensics using eBPFTracee uses eBPF technology to detect and filter operating system events, helping you expose security insights, detect suspicious behavior, and capture forensic indicators.GitHub<picture><source type="image/webp" srcSet="/static/d04a2a56b4f032f376d089ee505a48a5/5229c/odigos.webp 29w,/static/d04a2a56b4f032f376d089ee505a48a5/66ec8/odigos.webp 58w,/static/d04a2a56b4f032f376d089ee505a48a5/61cab/odigos.webp 116w,/static/d04a2a56b4f032f376d089ee505a48a5/e05f2/odigos.webp 232w" sizes="(min-width: 116px) 116px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 116px) 116px, 100vw" decoding="async" loading="lazy" src="/static/d04a2a56b4f032f376d089ee505a48a5/6fd36/odigos.png" srcSet="/static/d04a2a56b4f032f376d089ee505a48a5/48acf/odigos.png 29w,/static/d04a2a56b4f032f376d089ee505a48a5/d18df/odigos.png 58w,/static/d04a2a56b4f032f376d089ee505a48a5/6fd36/odigos.png 116w,/static/d04a2a56b4f032f376d089ee505a48a5/ea610/odigos.png 232w" alt="Odigos"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}OdigosZero-code distributed tracing via eBPFOdigos is a zero-code distributed tracing solution that uses eBPF to automatically instrument any application, including automatic context propagation. Traces are produced in OpenTelemetry format and can be delivered to any compatible backend.GitHubWebsite<picture><source type="image/webp" srcSet="/static/c4de6f34fa02e0418e87f5c32c62126c/5229c/pwru.webp 29w,/static/c4de6f34fa02e0418e87f5c32c62126c/66ec8/pwru.webp 58w,/static/c4de6f34fa02e0418e87f5c32c62126c/61cab/pwru.webp 116w,/static/c4de6f34fa02e0418e87f5c32c62126c/e05f2/pwru.webp 232w" sizes="(min-width: 116px) 116px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 116px) 116px, 100vw" decoding="async" loading="lazy" src="/static/c4de6f34fa02e0418e87f5c32c62126c/6fd36/pwru.png" srcSet="/static/c4de6f34fa02e0418e87f5c32c62126c/48acf/pwru.png 29w,/static/c4de6f34fa02e0418e87f5c32c62126c/d18df/pwru.png 58w,/static/c4de6f34fa02e0418e87f5c32c62126c/6fd36/pwru.png 116w,/static/c4de6f34fa02e0418e87f5c32c62126c/ea610/pwru.png 232w" alt="pwru"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}pwrueBPF-based Linux kernel network packet tracerpwru is an eBPF-based tool for tracing network packets in the Linux kernel with advanced filtering capabilities. It allows fine-grained introspection of kernel state to facilitate debugging network connectivity issues.GitHub<picture><source type="image/webp" srcSet="/static/c02b4fef1cb257f9f9a9ec2317564618/5229c/deepflow.webp 29w,/static/c02b4fef1cb257f9f9a9ec2317564618/66ec8/deepflow.webp 58w,/static/c02b4fef1cb257f9f9a9ec2317564618/61cab/deepflow.webp 116w,/static/c02b4fef1cb257f9f9a9ec2317564618/e05f2/deepflow.webp 232w" sizes="(min-width: 116px) 116px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 116px) 116px, 100vw" decoding="async" loading="lazy" src="/static/c02b4fef1cb257f9f9a9ec2317564618/6fd36/deepflow.png" srcSet="/static/c02b4fef1cb257f9f9a9ec2317564618/48acf/deepflow.png 29w,/static/c02b4fef1cb257f9f9a9ec2317564618/d18df/deepflow.png 58w,/static/c02b4fef1cb257f9f9a9ec2317564618/6fd36/deepflow.png 116w,/static/c02b4fef1cb257f9f9a9ec2317564618/ea610/deepflow.png 232w" alt="DeepFlow"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}DeepFlowHighly Automated Observability Platform powered by eBPFDeepFlow is a highly automated observability platform built for cloud native developers. Based on eBPF, DeepFlow innovatively implements an automated distributed tracing mechanism: AutoTracing. Microservice processes, service mesh sidecars, and network interfaces along the way are included as tracing spans, for every distributed transaction, without any code instrumentation. DeepFlow can automatically generate golden RED metrics for any process in cloud native environment.GitHubWebsitekubectl traceSchedule bpftrace programs on your Kubernetes clusterkubectl-trace is a kubectl plugin that allows for scheduling the execution of bpftrace(8) programs in Kubernetes clusters. kubectl-trace does not require installation of any components directly onto a Kubernetes cluster in order to execute bpftrace programs. When pointed to a cluster, it schedules a temporary job called trace-runner that executes bpftrace.GitHubdaeLinux high-performance transparent proxy solutiondae, means goose, is a high-performance transparent proxy solution. To enhance traffic split performance as much as possible, dae employs the transparent proxy and traffic split suite within the Linux kernel using eBPF. As a result, dae can enable direct traffic to bypass the proxy application's forwarding, facilitating genuine direct traffic passage. Through this remarkable feat, there is minimal performance loss and negligible additional resource consumption for direct traffic.GitHubRetinaeBPF dist'''
