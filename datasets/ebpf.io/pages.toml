 eBPF to secure their cloud infrastructureTalkSkySky uses eBPF through Cilium for cloud networkingTalkWalmartWalmart uses eBPF for edge cloud load balancingTalkBlogPalantirPalantir uses eBPF to debug networking problemsVideoCruiseCruise uses eBPF to monitor GPU performanceVideoDigital OceanDigital Ocean uses eBPF to monitor GPU performanceTalkYahooYahoo uses eBPF for load balancing and performance analysisVideoTalkBytedanceBytedance uses eBPF for system tracingBlogF5F5 BIG-IP integration with Cilium VTEP featureVideoGuideLinkedInLinkedIn uses eBPF for Infrastructure ObservabilityBlogThe New York TimesThe New York Times uses eBPF for networkingVideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real time.BlogAqua SecurityAqua Security uses eBPF to handle runtime detection and forensicsBlogOligo SecurityOligo Security uses eBPF for application security observability and protectionBlogAkitaAkita uses eBPF at scale for API observabilityDocsgroundcovergroundcover uses eBPF to instantly monitor application performance in cloud native environments, at any scale.ProductDocsVideoLine CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloudTalkExeinExein uses eBPF in their open source runtime security framework for IoTTalkAnt GroupAnt Group uses eBPF in their cloud native security platform for vulnerability live-patching, and system anomaly detectionTalkSysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from