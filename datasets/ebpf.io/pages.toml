["https://ebpf.io/get-started"]
title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = '''Get Started with eBPFTry the LabBorrowing the opensnoop example from Liz Rice’s report, this lab teaches you to handle an eBPF tool, watch it loading its components, and even add your own tracing into the source eBPF code.Try the LabRead the BooksRead the “What is eBPF?” and “Learning eBPF” O’Reilly Books by Liz Rice or BPF Performance Tools by Brendan Gregg to get started. Throughout the books, you will learn what eBPF and why it is so powerful, the capabilities it provides.Read the BooksWatch the videoDive into the history of eBPF with this talk from John Fastabend. Starting in the “early days” of 2014, it covers the main projects, companies, and players that influenced the landscape of Linux networking at the time and how they enabled the creation of eBPF.Watch the videoRead the Documentation to learn more about eBPFWikipediaWikipedia article on eBPFWikipedia article on eBPFeBPF StackoverflowAsk questions and read answersAsk questions and read answerseBPF community on RedditDiscuss the eBPF kernel subsystemDiscuss the eBPF kernel subsystemBPF & XDP Reference GuideLearn BPF internals and programmingLearn BPF internals and programmingBPF DocumentationBPF Documentation in the Linux KernelBPF Documentation in the Linux KernelBPF Design Q&AFAQ for kernel-related eBPF questionsFAQ for kernel-related eBPF questionsSubscribe to bi-weekly eCHO NewsKeep up on the latest news and information from the eBPF and CiliumSubscribeSubscribeExplore books on eBPF from the industry experts<picture><source type="image/webp" srcSet="/static/585e45e42e26e47d181eb5aa70df10a7/a82b2/what-is-ebpf.webp 54w,/static/585e45e42e26e47d181eb5aa70df10a7/cee9b/what-is-ebpf.webp 108w,/static/585e45e42e26e47d181eb5aa70df10a7/8aa29/what-is-ebpf.webp 216w,/static/585e45e42e26e47d181eb5aa70df10a7/78f30/what-is-ebpf.webp 432w" sizes="(min-width: 216px) 216px, 100vw"/><img data-gatsby-image-ssr="" class="w-full" data-main-image="" style="opacity:0" sizes="(min-width: 216px) 216px, 100