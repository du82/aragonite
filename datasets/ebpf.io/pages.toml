title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "Programmation dynamique du noyau pour un trafic réseau, une observabilité, une trace et une sécurité efficacesPaysage du projetQu’est-ce qu’eBPFVérification des programmes pour une exécution sécuriséeBranchement n’importe où dans le noyau pour une modification des fonctionnalitésCompilateur JIT pour une vitesse d’exécution quasi nativeAccès au fonctions bas niveau du systèmeDes entreprises de tous type d’industries utilisent eBPF en productionGoogleGoogle utilise eBPF pour des audits sécurité, du traitement de paquets ainsi que le monitoring de performanceVideoTalkNetflixNetflix utilise eBPF à grande échelle pour obtenir des informations sur le réseauBlogAndroidAndroid utilise eBPF pour surveiller l’utilisation du réseau, pour l’alimentation et le profilage de la mémoireDocsS&P GlobalS&P Global utilise eBPF via Cilium pour la mise en réseau à travers plusieurs clouds et sur site.VideoShopifyShopify utilise eBPF via Falco pour la détection des intrusionsVideoCloudflareCloudflare utilise eBPF pour la sécurisation du réseau, la surveillance des performances et l’observabilité du réseauBlogTalkPlus d’études de casPourquoi eBPF?Qu’est-ce qu’eBPFPerformanceeBPF accélère considérablement l’exécution en étant compilé JIT et en s’exécutant directement dans le noyau.SécuritéLes programmes eBPF sont vérifiés pour ne pas planter le noyau et ne peuvent être modifiés que par des utilisateurs privilégiés.FlexibilitéModification ou ajout de fonctionnalités au noyau, sans le patcher ou le redémarrer.Qu’est-ce qu’eBPFPremiereUnlocking the KernelThe eBPF Documentary provides an in-depth exploration on the origins of eBPF and showcases the stories, challenges, and rewards of this industry changing technology. You will hear from the best and brightest in the open source world, including key stakeholders from Meta, Intel, Isovalent, Google, Red Hat, and Netflix, who helped shape and build the tools that drove the success and adoption of eBPF.eBPF Documentary WebsiteeBPF a donné naissance à une nouvelle génération d’outils permettant aux développeurs de diagnostiquer facilement les problèmes, d’innover rapidement et d’étendre les fonctionnalités du système d’exploitation.Mark Russinovich — Chief Technology Officer at Microsoft Azure, 2021Que peut-on faire avec eBPF?RéseauAccélérer le traitement des paquets sans même quitter l’espace noyau. Ajouter des parseurs de protocole supplémentaires et programmer facilement n’importe quelle logique de routage pour répondre à des exigences sans cesse en évolution.ObservabilitéCollecter et agréger des métriques personnalisées dans le noyau en générant des événements de visibilité et en accédant à des structures de données à partir d’un large éventail de sources possibles sans avoir à exporter des échantillons.Traçabilité et profilageAttacher des programmes eBPF aux points de sonde au niveau kernel mais aussi de l’application utilisateur afin d’offrir de puissantes capacités d’introspection et des informations uniques pour résoudre les problèmes de performances du système.SécuritéAssocier la visualisation et la compréhension de tous les appels système au niveau des paquets et des sockets de l’ensemble du réseau pour créer des solutions de sécurité fonctionnant sur un contexte plus large avec un meilleur niveau de contrôle.Présentations de la communauté eBPF"
year_published = 2025
