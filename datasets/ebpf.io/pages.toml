["https://ebpf.io/pt-br"]
title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "Programar dinamicamente o kernel para networking eficiente, observabilidade, rastreamento e segurançaLandscape do ProjetoO que é o eBPFProgramas são verificados para execução seguraGancho em qualquer lugar no kernel para modificar a funcionalidadeCompilador JIT para velocidade de execução quase nativaAdicionar capacidades do sistema operacional em tempo de execuçãoOrganizações em todas as indústrias usam o eBPF em produçãoGoogleO Google usa o eBPF para auditoria de segurança, processamento de pacotes e monitoramento de desempenho.Video 1Video 2Talk 1Talk 2NetflixA Netflix usa o eBPF em escala para insights de rede.BlogAndroidO Android usa o eBPF para monitorar o uso de rede, consumo de energia e perfil de memória.DocsS&P GlobalA S&P Global usa o eBPF através do Cilium para redes em várias nuvens e localmente.VideoShopifyO Shopify usa o eBPF através do Falco para detecção de intrusões.VideoCloudflareA Cloudflare utiliza o eBPF para segurança de rede, monitoramento de desempenho e observabilidade de rede.BlogTalkMais estudos de casoPor que o eBPF?O que é o eBPFDesempenhoO eBPF melhora drasticamente o processamento ao ser compilado JIT e executado diretamente no kernel.SegurançaProgramas eBPF são verificados para não causar falhas no kernel e só podem ser modificados por usuários privilegiados.FlexibilidadeModificar ou adicionar funcionalidades e casos de uso ao kernel sem a necessidade de reiniciá-lo ou aplicar patches.O que é o eBPFPremiereUnlocking the KernelThe eBPF Documentary provides an in-depth exploration on the origins of eBPF and showcases the stories, challenges, and rewards of this industry changing technology. You will hear from the best and brightest in the open source world, including key stakeholders from Meta, Intel, Isovalent, Google, Red Hat, and Netflix, who helped shape and build the tools that drove the success and adoption of eBPF.eBPF Documentary WebsiteO eBPF resultou em uma nova geração de ferramentas que permitem que os desenvolvedores diagnostiquem problemas com facilidade, inovem rapidamente e estendam a funcionalidade do sistema operacional.Mark Russinovich — Chief Technology Officer at Microsoft Azure, 2021O que é possível com o eBPF?RedeAcelere o processamento de pacotes sem sair do espaço do kernel. Adicione analisadores de protocolo adicionais e programe facilmente qualquer lógica de encaminhamento para atender a requisitos em constante mudança.ObservabilidadeCombine a visualização e compreensão de todas as chamadas do sistema com uma visão de nível de pacote e socket de toda a rede para criar sistemas de segurança que operam com mais contexto e um melhor nível de controle.Rastreamento e ProfilingAnexe programas eBPF a pontos de rastreamento, bem como pontos de sondagem de aplicativos do kernel e do usuário, oferecendo poderosas habilidades de introspecção e insights únicos para solucionar problemas de desempenho do sistema.SegurançaCombine a visualização e compreensão de todas as chamadas do sistema com uma visão de nível de pacote e socket de toda a rede para criar sistemas de segurança que operam com mais contexto e um melhor nível de controle.Palestras da Comunidade do eBPF"
