full_description = "Casi di studio eBPFEcco alcune delle organizzazioni che impiegano eBPF in produzione. Se anche tu stai usando eBPF e non ti trovi elencato, invia una richiesta di pull.GoogleGoogle usa eBPF per l’auditing di sicurezza, l’elaborazione dei pacchetti di rete, e il monitoraggio delle performance.Video 1Video 2Talk 1Talk 2NetflixNetflix usa eBPF su larga scala per ottenere informazioni sulla rete.BlogAndroidAndroid usa eBPF per il monitoraggio dell’uso della rete, dell’energia e la profilazione della memoria.DocsS&P GlobalS&P Global usa eBPF attraverso Cilium per il networking su molteplici cloud e on-prem.VideoShopifyShopify usa eBPF attraverso Falco per il rilevamento delle intrusioni.VideoCloudflareCloudflare usa eBPF per la sicurezza di rete, monitoraggio delle prestazioni e l’osservabilità della rete.BlogTalkIkeaIkea usa eBPF attraverso Cilium per il networking e il bilanciamento del carico nel proprio cloud privato.VideoAppleApple usa eBPF attraverso Falco per monitorare la sicurezza del kernel.VideoMetaMeta usa eBPF per elaborare e bilanciare il carico di ogni pacchetto di rete che arriva nei loro data centerVideoBlog 1Blog 2Talk 1Talk 2DatadogDatadog usa eBPF per la rete e la sicurezza del proprio prodotto SaaSVideoAlibabaAlibaba usa eBPF attraverso Cilium per fornire la rete nel proprio cloudBlogRed HatRed Hat uses eBPF at scale for load balancing and tracing in their private cloudTalkIsovalenteBPF is the technlogy that powers Isovalent's enterpise networking, observability and security solutionsTalkBlogSeznamSeznam usa eBPF per il bilanciamento del caricoBlogTrip.comTrip.com usa eBPF per il bilanciamento del caricoBlogBellBell Canada usa eBPF per modernizzare la rete telco con SRv6Video 1Video 2Wildlife StudiosWildlife Studios usa eBPF attraverso Cilium per il high performance game networkingBlogCapital OneCapital One usa eBPF per proteggere la propria infrastruttura cloudVideoSkySky usa eBPF tramite Cilium per la rete del cloudVideoWalmartWalmart usa eBPF per il bilanciamento del carico dell’edge cloudVideo 1Video 2PalantirPalantir usa eBPF per il debug dei problemi di reteVideoCruiseCruise usa eBPF per monitorare le prestazioni della GPUVideoDigital OceanDigital Ocean usa eBPF per monitorare le prestazioni della GPUVideoYahooYahoo usa eBPF per il bilanciamento del carico e l’analisi delle prestazioniVideo 1Video 2BytedanceBytedance usa eBPF per il tracciamento del sistemaBlogF5F5 integra BIG-IP con la funzione VTEP di CiliumVideoGuideLinkedInLinkedIn usa eBPF per l’osservabilità dell’infrastrutturaBlogThe New York TimesThe New York Times usa eBPF per la rete.VideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne usa eBPF per rilevare e rispondere in tempo reale a minacce runtime come ransomware e zero-day exploits.BlogAkitaAkita usa eBPF su larga scala per l’osservabilità delle API.Docsgroundcovergroundcover uses eBPF to instantly monitor application performance in cloud native environments, at any scale.ProductDocsVideoCore TechCore Tech uses eBPF to filter out unwanted traffic and mitigate DDoS attacks BlogFlowSecurityFlow Security uses eBPF technology to analyze data in motion for data discovery, classification, risk management, and data violation detection and responseBlogHeliosHelios uses eBPF in their runtime analysis tool for observability and securityBlogThreatXThreatX uses eBPF for securing their runtime environment and delivering real-time blocking for runtime threatsBlogLevoLevo uses eBPF for API discovery and documentationDocsTraceableTraceable uses eBPF for enhanced data collectionBlogQpoint.qpoint_inline_svg__cls-1{fill:#895ae8}Qpoint eBPF per monitorare e proteggere il traffico in uscita verso le tue API di fornitori esterniBlogProtect AIProtect AI utilizza eBPF per proteggere le applicazioni LLM in produzione durante il runtime, garantendo visibilità per avanzate capacità di rilevamento e risposta alle minacceBlog"
