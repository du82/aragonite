alancing and performance analysis動画発表BytedanceBytedance uses eBPF for system tracingブログF5F5 BIG-IP integration with Cilium VTEP feature動画GuideLinkedInLinkedIn uses eBPF for Infrastructure ObservabilityブログThe New York TimesThe New York Times uses eBPF for networking動画SentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real time.ブログAqua SecurityAqua Security uses eBPF to handle runtime detection and forensicsブログOligo SecurityOligo Security uses eBPF for application security observability and protectionブログAkitaAkita uses eBPF at scale for API observabilityドキュメントgroundcovergroundcover uses eBPF to instantly monitor application performance in cloud native environments, at any scale.Productドキュメント動画Line CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloud発表ExeinExein uses eBPF in their open source runtime security framework for IoT発表Ant GroupAnt Group uses eBPF in their cloud native security platform for vulnerability live-patching, and system anomaly detection発表Sysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from the kernel発表ブログKodemKodem uses eBPF for application visibilty and runtime intelligenceブログCycodeCycode uses eBPF for CI/CD security発表ブログWizWiz uses eBPF to provide real-time threat detection and monitoring within cloud workloadsブログCore TechCore Tech uses eBPF to filter out unwanted traffic and mitigate DDoS attacks ブログFlowSecurityFlow Security uses eBPF technology to analyze data in motion for 