full_description = "Études de cas eBPFVoici quelques-unes des organisations qui utilisent eBPF en production. Si vous utilisez eBPF et que vous ne figurez pas sur cette liste, veuillez soumettre une pull request.GoogleGoogle utilise eBPF pour des audits sécurité, du traitement de paquets ainsi que le monitoring de performanceVideoTalkNetflixNetflix utilise eBPF à grande échelle pour obtenir des informations sur le réseauBlogAndroidAndroid utilise eBPF pour surveiller l’utilisation du réseau, pour l’alimentation et le profilage de la mémoireDocsS&P GlobalS&P Global utilise eBPF via Cilium pour la mise en réseau à travers plusieurs clouds et sur site.VideoShopifyShopify utilise eBPF via Falco pour la détection des intrusionsVideoCloudflareCloudflare utilise eBPF pour la sécurisation du réseau, la surveillance des performances et l’observabilité du réseauBlogTalkMicrosoftMicrosot uses eBPF to enhance the observability and inspection of processes within KubernetesTalkSamsungSamsung uses eBPF in their android devices for networkingTalkIkeaIkea uses eBPF through Cilium for networking and load balancing in their private cloudVideoAppleApple uses eBPF through Falco for kernel security monitoringVideoDoorDashDoorDash uses eBPF through BPFAgent for kernel level monitoringBlogMetaMeta uses eBPF to process and load balance every packet coming into their data centersVideoBlogTalkDatadogDatadog uses eBPF for networking and security in their SaaS productVideoBlogTalkAlibabaAlibaba uses eBPF through Cilium to provide networking in their cloudBlogTalkRed HatRed Hat uses eBPF at scale for load balancing and tracing in their private cloudTalkIsovalenteBPF is the technlogy that powers Isovalent's enterpise networking, observability and security solutionsTalkBlogSeznamSeznam uses eBPF for load balancingBlogTalkTrip.comTrip.com uses eBPF for load balancingBlogTalkBellBell Canada uses eBPF to moderize telco networking with SRv6TalkWildlife StudiosWildlife Studios uses eBPF through Cilium for high performance game networkingBlogTalkCapital OneCapital One uses eBPF to secure their cloud infrastructureTalkSkySky uses eBPF through Cilium for cloud networkingTalkWalmartWalmart uses eBPF for edge cloud load balancingTalkBlogPalantirPalantir uses eBPF to debug networking problemsVideoCruiseCruise uses eBPF to monitor GPU performanceVideoDigital OceanDigital Ocean uses eBPF to monitor GPU performanceTalkYahooYahoo uses eBPF for load balancing and performance analysisVideoTalkBytedanceBytedance uses eBPF for system tracingBlogF5F5 BIG-IP integration with Cilium VTEP featureVideoGuideLinkedInLinkedIn uses eBPF for Infrastructure ObservabilityBlogThe New York TimesThe New York Times uses eBPF for networkingVideoSentinelOne.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-2{fill:#231f20}.sentinelone_inline_svg__cls-1,.sentinelone_inline_svg__cls-4{fill-rule:evenodd}.sentinelone_inline_svg__cls-4{fill:#6b0aea}SentinelOne uses eBPF to detect and to respond to runtime threats like ransomware and zero-day exploits in real timeBlogAqua SecurityAqua Security uses eBPF to handle runtime detection and forensicsTalkAkitaAkita uses eBPF at scale for API observability.Docsgroundcovergroundcover uses eBPF to instantly monitor application performance in cloud native environments, at any scale.ProductDocsVideoLine CoporationLine Corporation uses eBPF at scale for load balancing and tracing in their private cloudTalkExeinExein uses eBPF in their open source runtime security framework for IoTTalkAnt GroupAnt Group uses eBPF in their cloud native security paltform for vulnerability live-patching, and system anomaly detectionTalkSysdig.sysdig_inline_svg__f04ca906-1e69-4f27-8621-a7ab0851ca11{fill:#55565b}.sysdig_inline_svg__e330b834-161b-487c-bb13-8bca561e66de{fill:#00abc7}Sysdig uses eBPF to enable high-performance system call tracing, facilitate container-aware troubleshooting, conduct security auditing, and provide rich insights and data from the kernelTalkBlogKodemKodem uses eBPF for application visibilty and runtime intelligenceBlogCycodeCycode uses eBPF for CI/CD securityTalkBlogWizWiz uses eBPF to provide real-time threat detection and monitoring within cloud workloadsBlogCore TechCore Tech uses eBPF to filter out unwanted traffic and mitigate DDoS attacks BlogFlowSecurityFlow Security uses eBPF technology to analyze data in motion for data discovery, classification, risk management, and data violation detection and responseBlogHeliosHelios uses eBPF in their runtime analysis tool for observability and securityBlogThreatXThreatX uses eBPF for securing their runtime environment and delivering real-time blocking for runtime threatsBlogLevoLevo uses eBPF for API discovery and documentationDocsTraceableTraceable uses eBPF for enhanced data collectionBlogQpoint.qpoint_inline_svg__cls-1{fill:#895ae8}Qpoint utilise eBPF pour surveiller et sécuriser le trafic sortant vers vos API de fournisseurs externesBlogAttribute.attribute_inline_svg__s0{fill:#004742}Attribute uses eBPF to provide real time, no tagging cloud cost visibility and attribution for dynamic environmentsBlogProtect AIProtect AI utilise eBPF pour sécuriser les applications LLM en production et en temps réel, offrant une visibilité permettant une détection et une réponse avancées aux menacesBlog"
