title = "eBPF - Introduction, Tutorials & Community Resources"
description = "eBPF is a revolutionary technology that can run sandboxed programs in the Linux kernel without changing kernel source code or loading a kernel module."
full_description = "Dynamically program the kernel for efficient networking, observability, tracing, and securityProject LandscapeWhat is eBPFPrograms are verified to safely executeHook anywhere in the kernel to modify functionalityJIT compiler for near native execution speedAdd OS capabilities at runtimeOrganizations in every industry use eBPF in productionGoogleGoogle uses eBPF for security auditing, packet processing, and performance monitoringVideoTalkNetflixNetflix uses eBPF at scale for network insightsBlogVideoAndroidAndroid uses eBPF to monitor network usage, power, and memory profilingDocsS&P GlobalS&P Global uses eBPF through Cilium for networking across multiple clouds and on-premVideoShopifyShopify uses eBPF through Falco for intrusion detectionVideoCloudflareCloudflare uses eBPF for network security, performance monitoring, and network observabilityBlogTalkMore case studiesWhy eBPF?What is eBPFPerformanceeBPF drastically improves processing by being JIT compiled and running directly in the kernel.SecurityeBPF programs are verified to not crash the kernel and can only be modified by privileged users.FlexibilityModify or add functionality and use cases to the kernel without having to restart or patch it.What is eBPFPremiereUnlocking the KernelThe eBPF Documentary provides an in-depth exploration on the origins of eBPF and showcases the stories, challenges, and rewards of this industry changing technology. You will hear from the best and brightest in the open source world, including key stakeholders from Meta, Intel, Isovalent, Google, Red Hat, and Netflix, who helped shape and build the tools that drove the success and adoption of eBPF.eBPF Documentary WebsiteeBPF has resulted in a new generation of tooling that allows developers to easily diagnose problems, innovate quickly, and extend operating system functionality.Mark Russinovich — Chief Technology Officer at Microsoft Azure, 2021What’s possible with eBPF?NetworkingSpeed packet processing without leaving kernel space. Add additional protocol parsers and easily program any forwarding logic to meet changing requirements.ObservabilityCollection and in-kernel aggregation of custom metrics with generation of visibility events and data structures from a wide range of possible sources without having to export samples.Tracing & ProfilingAttach eBPF programs to trace points as well as kernel and user application probe points giving powerful introspection abilities and unique insights to troubleshoot system performance problems.SecurityCombine seeing and understanding all system calls with a packet and socket-level view of all networking to create security systems operating on more context with a better level of control.eBPF Community Talks"
