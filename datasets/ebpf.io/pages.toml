["https://ebpf.io/fr-fr/contribute"]
title = "Comment contribuer à l’eBPF"
description = "Vous voulez savoir comment contribuer à eBPF ? Découvrez comment commencer à contribuer aux projets eBPF."
full_description = 'Comment contribuer à eBPFeBPF rassemble de nombreuses communautés, notamment l’environnement d’exécution eBPF dans le noyau Linux, divers SDK et bibliothèques de développement, de grands projets utilisant eBPF ainsi qu’un large éventail de projets et d’outils plus petits. Il existe donc de nombreuses façons de contribuer et de s’impliquer auprès de la communauté eBPF. La liste d’idées qui suit peut vous servir de point de départ.<picture><source type="image/webp" srcSet="/static/d8527cbd6131769de174953924771175/58e8a/contribute-hero.webp 148w,/static/d8527cbd6131769de174953924771175/75d56/contribute-hero.webp 296w,/static/d8527cbd6131769de174953924771175/7ab43/contribute-hero.webp 592w" sizes="(min-width: 592px) 592px, 100vw"/><img data-gatsby-image-ssr="" class="rounded-l-lg lg:rounded-t-lg lg:rounded-bl-none" data-main-image="" style="object-position:20% 20%;opacity:0" sizes="(min-width: 592px) 592px, 100vw" decoding="async" loading="eager" src="/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg" srcSet="/static/d8527cbd6131769de174953924771175/abeaa/contribute-hero.jpg 148w,/static/d8527cbd6131769de174953924771175/ff0e2/contribute-hero.jpg 296w,/static/d8527cbd6131769de174953924771175/0cbf5/contribute-hero.jpg 592w" alt="Maintainers of the eBPF runtime in the Linux kernel"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Contribuer au runtime eBPF dans le noyau LinuxLa communauté du noyau Linux maintient des arbres Git distincts pour le sous-système eBPF afin de gérer toutes les contributions des développeurs. Les arbres sont entretenus par :Alexeï Starovoitov, FacebookDaniel Borkmann, Cilium/IsovalentTravailler sur l’environnement d’exécution eBPF peut être extrêmement gratifiant car il s’agit de contribuer à un logiciel qui s’exécute sur des millions de systèmes et d’appareils. Le travail comprend un large éventail de sujets couvrant l’ajout de la prise en charge de points d’attache supplémentaires, l’ajout de nouveaux types de programmes, des améliorations au vérificateur eBPF, l’ajout de la prise en charge JIT pour des architectures CPU supplémentaires, l’extension de l’ensemble des fonctions noyau mises à disposition des programmes BPF, l’ajout de nouveaux cas de test à l’infrastructure de test de BPF, ou des améliorations de bpftool et libbpf.Git treesLinux kernel eBPF runtimeContribuer à un projet eBPFLes projets basés sur eBPF sont nombreux, et la liste ne cesse de s’allonger. Il n’y a que l’embarras du choix ! Consultez le paysage eBPF pour un aperçu des différents projets.De nombreux projets basés sur eBPF maintiennent une liste de tâches dénotées en tant que « good first issues », des portes d’entrée ne nécessitant pas de connaissances approfondies spécifiques au projet et qui offrent une excellente occasion de se familiariser rapidement avec le sujet.eBPF landscapeContribuer aux chaînes d’outils de développement eBPFMême si le noyau Linux fournit un minimum de bibliothèques et d’API pour utiliser directement eBPF, la majorité des projets exploitent une chaîne d’outils de développement plus haut niveau pour simplifier l’utilisation d’eBPF et mettre en commun l’implémentation de certaines fonctionnalités avec d’autres projets.Consultez la liste des chaînes d’outils de développement eBPF, fréquemment mise à jour. Si vous souhaitez vous impliquer sur l’un d’entre eux, vous trouverez des informations sur le site web associé.eBPF development toolchainsContribuer à ebpf.ioAvez-vous un talent d’écriture? Êtes-vous doué(e) avec les diagrammes? Le contenu du site web ebpf.io est sous licence Creative Commons Attribution 4.0 International. Si vous souhaitez vous impliquer, visitez le dépôt GitHub. Assurez-vous également de rejoindre le canal Slack #ebpf-website pour entrer en contact avec l’équipe travaillant sur la documentation. Partagez ce que vous avez appris en améliorant la documentation ou écrivez des tutoriels supplémentaires.LicenseGitHub repositorySlack'
