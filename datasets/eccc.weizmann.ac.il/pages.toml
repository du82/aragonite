full_description = "Detecting the relevant attributes of an unknown target conceptis an important and well studied problem in algorithmic learning.Simple greedy strategies have been proposed that seem to perform reasonablywell in practice if a sufficiently large random subset of examples of the target concept is provided. Given a set of monomials, the Minimum AND-Circuit problem asks for acircuit that computes these monomials using AND-gates of fan-in two andbeing of minimum size. We prove that the problem is not polynomial timeapproximable within a factor of less than 1.0051 unless P = NP, even ifmore >>> The combination of two major challenges in machine learning is investigated: dealing with large amounts of irrelevant information and learning from noisy data. It is shown that large classes of Boolean concepts that depend on a small number of variables---so-called juntas---can be learned efficiently from random examples corrupted by random ... more >>> We study deterministic one-way communication complexity of functions with Hankel communication matrices. Some structural properties of such matrices are establishedand applied to the one-way two-party communication complexity of symmetric Boolean functions.It is shown that the number of required communication bits does not depend on ... more >>>"
