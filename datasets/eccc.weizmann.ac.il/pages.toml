title = "ECCC - TR02-063"
full_description = "Zero-knowledge proofs are proofs that are both convincing and yetyield nothing beyond the validity of the assertion being proven.Since their introduction about twenty years ago,zero-knowledge proofs have attracted a lot of attentionand have, in turn, contributed to the development of otherareas of cryptography and complexity theory. We survey the main definitions and results regardingzero-knowledge proofs. Specifically, we present the basic definitional approachand its variants, results regarding the power of zero-knowledge proofs as well as recent results regarding questions such asthe composeability of zero-knowledge proofs and the use of the adversary's programwithin the proof of security (i.e., non-black-box simulation)."
