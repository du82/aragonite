["https://eccc.weizmann.ac.il/static/colloquium/how_to_use"]
title = "ECCC - About the Colloquium"
full_description = 'You can either register for the ECCC newsletter or for submission of reports you want to be published on ECCC. For newsletter subscription just follow the link on the right side of the main navigation panel. You will have to submit your e-mail address and wait for an activation link. For author registration click the "Register"-Link in the top right corner (just below the search input) and follow the instructions on screen. You will have to submit some data (name, e-mail address, affiliation) and choose a password. ECCC will send you an activation e-mail to verify your account data. If you have already submitted papers to ECCC you will be asked to assign those to your account after registration. Those papers will be available in the "My papers"-section after login and you can submit comments or revisions in a convenient manner. For report submission you will have to register as an author (see above note). After login, click on the large "Submit paper"-button in the top right corner and follow the instructions on screen. You will have to enter title, abstract, authors and keywords for your work. If you have formulas within your abstract, you will be able to use LaTeX-style formulas that will be rendered as MathML automatically. You can later log in to ECCC to see if your work is just being screened or to submit revisions and comments to a published report. Submitting revisions is done from the "My Papers" Section. Go to the paper you want to revise and click the "Add Revision" Button right to it. The following form is almost identical to the paper submission form. Additionally it is prefilled with the title and abstract and you have an extra field to clarify the changes to the previous version. Unfortunately, mistakes do happen and at such times authors may wish to withdraw posted reports. However, once a report has been posted on ECCC its record cannot be removed. Still, the authors may withdraw its claims by posting a revision with the adequate contents. It is recommended to write a short description that details which parts of the original report are withdrawn and which remain valid, and the reasons for the withdrawal.'
year_published = 2025
clearnet = "https://eccc.weizmann.ac.il/static/colloquium/how_to_use"
