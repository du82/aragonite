["https://eccc.weizmann.ac.il/report/1999/006"]
title = "ECCC - TR99-006"
full_description = "We survey some recent developments in the study ofthe complexity of lattice problems. After a discussion of someproblems on lattices which can be algorithmically solvedefficiently, our main focus is the recent progress on complexityresults of intractability. We will discuss Ajtai's worst-case/average-case connections, NP-hardness and non-NP-hardness,transference theorems between primal and dual lattices, and theAjtai-Dwork cryptosystem."
