["https://eccc.weizmann.ac.il/report/1998/067"]
title = "ECCC - TR98-067"
full_description = "Proof complexity, the study of the lengths of proofs inpropositional logic, is an area of study that is fundamentally connectedboth to major open questions of computational complexity theory andto practical properties of automated theorem provers. In the lastdecade, there have been a number of significant advances in proofcomplexity lower bounds. Moreover, new connections between proofcomplexity and circuit complexity have been uncovered, and the interplaybetween these two areas has become quite rich. In addition, attemptsto extend existing lower bounds to ever stronger proof systems of proofhave spurred the introduction of new and interesting proof systems,adding both to the practical aspects of proof complexity as well asto a rich theory. This note attempts to survey these developmentsand to lay out some of the open problems in the area.This is an updated version of our article appearing inthe Computational Complexity Column of the Bulletin of the EATCS, 1998."
