title = "ECCC - Hasan Abasi"
full_description = 'An $r$-simple $k$-path is a {path} in the graph of length $k$ thatpasses through each vertex at most $r$ times. The \simpath{r}{k}problem, given a graph $G$ as input, asks whether there exists an$r$-simple $k$-path in $G$. We first show that this problem isNP-Complete. We then show ... more >>> We develop a new algebraic technique that gives a simple randomized algorithm for the simple $k$-path problem with the same complexity $O^*(1.657^k)$ as in [A. Bj\"orklund. Determinant Sums for Undirected Hamiltonicity. FOCS 2010, pp. 173--182, (2010). A. Bj\"orklund, T. Husfeldt, P. Kaski, M. Koivisto. Narrow sieves for parameterized paths and ... more >>>'
