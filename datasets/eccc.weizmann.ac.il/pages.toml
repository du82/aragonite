["https://eccc.weizmann.ac.il/report/1995/050"]
title = "ECCC - TR95-050"
full_description = '''Since the first publication of this survey, Yao's XOR Lemma has been the subject of intensive research. The current revision contains a short review of this research (see Section 7), but the main text (i.e., Sections 1-6) is not updated according to these subsequent discoveries. The current version also include a new appendix (Appendix B), which discusses a variant of the XOR Lemma, called the Selective XOR Lemma. A fundamental Lemma of Yao states that computationalweak-unpredictabilityof functions gets amplified if the results of several independentinstances are XOR together.We survey two known proofs of Yao's Lemma and presenta third alternative proof. The third proof proceeds by first proving that a function constructedby {\em concatenating} the values of the functionon several independent instances is much more unpredictable,with respect to specified complexity bounds,than the original function.This statement turns out to be easier to prove than the XOR-Lemma.Using a result of Goldreich and Levinand some elementary observation, we derive the XOR-Lemma. We correct some typos in the proof of Lemma 12.Specifically, the probability bound in Claim 12.3 should be $(1/2)+2\epsilon$ (rather than $(1/2)+(\epsilon/2)$)and the last line in the bound on the expectationof $\sum_{x\in C}\zeta_xw_x$ should be $\rho(n)\cdot[(1/2)+\epsilon]$(rather than $\rho(n)\cdot[(1/2)-\epsilon]$).'''
