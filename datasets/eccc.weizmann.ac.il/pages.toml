["https://eccc.weizmann.ac.il/colloquium/call_for_papers"]
title = "ECCC - Call for Papers"
full_description = "Indeed, the main focus of computational complexity and ECCC is on understanding the limits of what algorithms can do. Thus, typically, algorithmic improvements are not in scope of ECCC, except in cases where either the improved complexity bounds are closely related to a conjectured lower bound or the techniques are of natural interest to complexity-theoretic studies. Note that while many areas in computer science (e.g., cryptography) are closely related to complexity theory, this does not mean that every work in these areas is in the scope of ECCC. In such cases, determining whether a submission is in scope depends on how dominant its complexity-theoretic aspects are. Submissions claiming to resolve a grand challenge, such as the P vs. NP problem, may be rejected without further consideration. Publication in ECCC enables the feature of an ongoing public scientific discussion. Corrections, improvements, remarks etc. concerning an existing ECCC Report may be submitted by either author or reader and are kept with the original submission, thus being accessible to all. Submission to ECCC does not prevent future submission to any conference or journal: the submissions that appear in the archive have the status of technical reports. ECCC activity is supervised by a scientific board, which makes sure that ECCC Reports meet the minimal standards described above. As soon as a submission arrives, several board members with expertise in its declared area are notified, and once a week all board members are sent the list of pending submissions. Board members may screen a submission at their own discretion, and make the decision whether or not to accept it. An accepted submission is posted as a report immediately. A submission is automatically rejected after two months if no board member accepted it. This may indicate that the submission is not of sufficient interest to the complexity community."
year_published = 2025
clearnet = "https://eccc.weizmann.ac.il/colloquium/call_for_papers"
tags = ["board", "call", "chief:", "colloquium", "deadlines", "editor", "features", "limits", "papers:", "scientific"]
language = "en"
