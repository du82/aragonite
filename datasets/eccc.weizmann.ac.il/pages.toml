title = "ECCC - Luis Antunes"
full_description = "Antunes, Fortnow, van Melkebeek and Vinodchandran captured thenotion of non-random information by computational depth, thedifference between the polynomial-time-bounded Kolmogorovcomplexity and traditional Kolmogorov complexity We show how tofind satisfying assignments for formulas that have at least oneassignment of logarithmic depth. The converse holds under astandard ... more >>> We show that under a reasonable hardness assumptions, the time-bounded Kolmogorov distribution is a universal samplable distribution. Under the same assumption we exactly characterize the worst-case running time of languages that are in average polynomial-time over all P-samplable distributions."
