["https://eccc.weizmann.ac.il/report/2025/022"]
title = "ECCC - TR25-022"
full_description = 'We study the communication complexity of multiplying $k\times t$elements from the group $H=\text{SL}(2,q)$ in the number-on-foreheadmodel with $k$ parties. We prove a lower bound of $(t\log H)/c^{k}$.This is an exponential improvement over previous work, and matchesthe state-of-the-art in the area. Relatedly, we show that the convolution of $k^{c}$ independent copiesof a 3-uniform distribution over $H^{m}$ is close to a $k$-uniformdistribution. This is again an exponential improvement over previouswork which needed $c^{k}$ copies. We also show that for any group $H$, any distribution over $H^{m}$whose weight-$k$ Fourier coefficients are small is close to a $k$-uniformdistribution. This generalizes previous work in the Abelian setting,and the proof is simpler.'
year_published = 2025
clearnet = "https://eccc.weizmann.ac.il/report/2025/022"
