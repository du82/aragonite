["https://eccc.weizmann.ac.il/report/2005/098"]
title = "ECCC - TR05-098"
full_description = "We highlight a common theme in four relatively recent worksthat establish remarkable results by an iterative approach.Starting from a trivial construct, each of these works applies an ingeniously designed sequence of iterations that yields the desired result,which is highly non-trivial. Furthermore, in each iteration,the construct is modified in a relatively moderate manner.The four works we refer to are1) the polynomial-time approximation of the permanent of non-negative matrices (by Jerrum, Sinclair, and Vigoda, 33rd STOC, 2001);2) the iterative (Zig-Zag) construction of expander graphs (by Reingold, Vadhan, and Wigderson, 41st FOCS, 2000);3) the log-space algorithm for undirected connectivity (by Reingold, 37th STOC, 2005);4) and, the alternative proof of the PCP Theorem (by Dinur, ECCC, TR05-046, 2005)."
