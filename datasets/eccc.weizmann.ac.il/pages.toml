["https://eccc.weizmann.ac.il/report/1995/056"]
title = "ECCC - TR95-056"
full_description = "We provide an exposition of three Lemmas which relategeneral properties of distributions with the exclusive-or of certain bit locations. The first XOR-Lemma, commonly attributed to U.V. Vazirani,relates the statistical distance of a distribution from uniformto the maximum bias of the xor of certain bit positions.The second XOR-Lemma, due to U.V. Vazirani and V.V. Vazirani,is a computational analogue of the first.It relates the pseudorandomness of a distribution with thedifficulty of predicting the xor of bits in particular orrandom positions.The third Lemma, due to Goldreich and Levin,relates the difficulty of retrieving a stringand the unpredictability of the xor of random bit positions.The most notable XOR Lemma~-- that is the so-called Yao XOR Lemmais not discussed here. The proofs presented here differ from the proofs presentedin the original works. Furthermore, these proofs are believedto be simpler, of wider applicability and yield somewhat better results. Credits for these improved proofs and their presentationare only partially due to author, and are mainly due to several"
