title = "Electrical & Computer Engineering | The University of New Mexico"
full_description = "ECE Associate Professor Eirini Eleni Tsiropoulou was recently awarded a National Science Foundation grant for a project that addresses the area of public safety systems. ECE Distinguished Professors, Edl Schamiloglu and Christos Christodoulou, are part of one of the eight Microelectronics Commons innovation hubs recently announced by the Department of Defense as part of President Biden’s CHIPS and Science Act. ECE associate professor Eirini Eleni Tsiropoulou is leading a Department of Energy (DOE) project that will make significant strides toward revolutionizing the realms of renewable energy and wireless communications. Milad Marvian, an assistant professor in the Department of Electrical and Computer Engineering and a member of the Center for Quantum Information and Control (CQuIC) has been selected as a recipient of the Department of Energy's Exploratory Research in Extreme-Scale Science program. Starting this August, ECE Professor Sudharman K. Jayaweera joined the US National Science Foundation (NSF) as a Program Director. Three students from the PROTON Lab, led by ECE Asst. Prof. Eirini Eleni Tsiropoulou have won awards from the IEEE Albuquerque Section recently. The awards were presented by the IEEE Albuquerque Section leadership ceremony on May 15 in Albuquerque. ECE Prof. Eirini Eleni Tsiropoulou will chair the Economics in Future Networking Symposium at the IEEE Future Networks World Forum 2023 in Baltimore, Maryland, November 13-15, 2023. The Lobo Food Pantry has a goal to eliminate hunger as a barrier to UNM student success: They want students to focus their best energy on their educational experience, not on finding their next meal. ECE Professors Xiang Sun and Sudharman K. Jayaweera will be serving as organizing chairs at the 1st Workshop on Aerial and Space Networks for the Internet of Things to be held in Aveiro, Portugal 12-27 October 2023. The Air Force Research Labs just announced that it is accepting applications for multiple AFRL sites. Here's your opportunity to get a foot in the door!"
