full_description = '''Breadcrumbs HomeAbout UsThe Open Innovation Community The Eclipse Foundation provides a proven governance framework and processes for entrepreneurial collaboration on sustainable, commercializable open source software that benefits developers, companies, and users alike. Join Us Why The Eclipse Foundation? Our approach to open innovation offers companies the opportunity to serve customers better, increase business agility and extend value creation beyond traditional organizational boundaries by participating in an ecosystem of projects and communities. Download Download Download Success Stories Businesses of all sizes in various industries are benefiting from open source projects hosted at the Eclipse Foundation and participation in Eclipse Foundation working groups. Discover how companies are leveraging the business value of open source: Industry Expert Testimonials Learn what industry experts have to say about how the Eclipse Foundation is helping businesses accelerate innovation, drive industry adoption, and grow community. More Resources White Papers Survey Reports Additional Case Studies Podcast // Expand and show Survery Reports section, // if user comes here by clicking "Survey reports" links in org/services/marketing/ page document.addEventListener('DOMContentLoaded', goToSurveryReports) function goToSurveryReports() { const currentLocation = window.location.href const surveyReportsIdExists = currentLocation.includes('#surveyReportsCtn') if (surveyReportsIdExists) { const moreResourcesCotent = document.getElementById('moreResources') moreResourcesCotent.classList.add('in') const surveyReportsContent = document.getElementById('surveyReports') surveyReportsContent.classList.add('in') const surveyReportsCtn = document.getElementById('surveyReportsCtn') surveyReportsCtn.scrollIntoView(); } }'''
