description = "The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and business-friendly environment for open source …"
full_description = "HomeEclipse Foundation Legal ResourcesEclipse Foundation Website Privacy PolicyEclipse Foundation Website Privacy Policy15 February 2024This Privacy Policy explains how the Eclipse Group (“Us”, “Our”, or “We”, as further identified below in section “Who We Are. Data Controllers and Our contact data”) collects and processes Personal Information (as defined below) from website visitors (“you” or “your”). All references to the “Website” in this Privacy Policy are deemed to refer to any Eclipse Group website or online resource that contains a reference or link to this Privacy Policy, including in the first place the Website at https://www.eclipse.org/ as well as any other Website of the Eclipse Group.The Eclipse Group acts as the steward of Our open source projects, industry collaborations including working groups and interest groups, community, and ecosystem. We are committed to respecting your rights to privacy within Our global ecosystem. We promise to transparently share all aspects of how Eclipse Group projects and Websites work in regards to privacy, terms, and Personal Information, and We are in full support of efforts to ensure your protection online, regardless of what laws are applicable and what your location may be. We recognize that different laws apply to protect your privacy, including but not limited to the laws of the United States, Canada, European Union, and We will aim to apply the same standards of privacy and protection of Personal Information to all individuals.The Personal Information We collect about you and whyWe collect and process your Personal Information only for the purposes set out in this Privacy Policy. As a platform for open source innovation and collaboration, your Personal Information can be submitted to Us, or collected by Us, in different ways.“Personal Information” is any information or data that relates to an individual which would enable that individual to be directly or indirectly identified. We may handle, notably, the following Personal Information about you:Contact/identification details (e.g. name, e-mail address, picture);Technical data (e.g. IP address, user behavior, web cookies); andRecords of your contributions to Our open source projects and/or industry collaborations under the applicable specific agreements with Us.We may collect, store and use your Personal Information above for the following purpose(s):To send you newsletters or other direct marketing communications that you have requested;To improve the Website and services;To deliver the content of the Website, to ensure the functionality of Our IT systems, and to improve the optimization of the Website;To contact you for reasons related to the service you have signed up for or to provide information you have requested;To provide you with the services that you requested;To enable you to store the data you request Us to store on Eclipse Group servers through services, including but not limited to, the Eclipse User Storage Service (USS);To provide access to the Website and services offered on the Website;To enable collaborative open source software development (e.g., to validate and maintain permanent records of authorship related to your contributions);To record your contributions to public communication channels that We manage or host (e.g., postings to a forum or a mailing list); andTo prevent the misuse of the Website and the services and to detect fraudulent activities.When we collect, store and use your Personal Information for those purpose(s), it is and will remain in connection with and subject to, either (a) your acceptance, (b) the performance of Our services to you as a member or employee of a member or (c) the pursuance of Our own interests or the service to Our community.In some cases, We may not be able to provide Our services if you fail to provide to us with some Personal Information.How We share your Personal Information and who We share it withWe will not sell your Personal Information to any third party.We will not disclose your Personal Information, except as described in this Privacy Policy.Firstly, your Personal Information may be shared among the Eclipse entities within the Eclipse Group.Secondly, We rely on contractually bound third party companies and external service providers (referred to as “Processors”) in order to provide Our services, and to improve the Website and Our services. In such cases, Personal Information may be shared with these Processors in order to allow them to continue providing their services. The Processors are permitted to use the Personal Information only for the purposes specified by Us. Furthermore, they are contractually obligated to handle your Personal Information exclusively in accordance with this Privacy Policy and in line with the applicable data protection laws. For example, your Personal Information may be disclosed to:Data analytics providers;Communication services providers;IT service providers for the provision of hardware and software and for the implementation of maintenance work;Third-party contractors and consultants employed by Us who act as part of Our staff in conjunction with Our fulltime and part time employeesIf you are employed by, or a consultant of an Eclipse Member Company and have interacted with Eclipse Group or Our projects, We may provide your name and/or email address to your employer.Thirdly, We may disclose your Personal Information where:We are required to do so by applicable law, by a governmental body or by a law enforcement agency;To establish or exercise Our legal rights or defend against legal claims; andTo investigate, prevent or take actions against illegal activities, suspected fraud, situations involving potential threats to the physical safety of any person, violations of Our terms of use, or as otherwise required by law.Who We Are. Data controllers and Our contact dataThe Eclipse Group is comprised of our four corporate entities, namely Eclipse Foundation AISBL, Eclipse Foundation Europe GmbH, Eclipse.org Foundation, Inc. and Eclipse Foundation Canada, which together are jointly responsible as joint data controllers within the meaning of data protection legislation (the “Eclipse Group”). The Eclipse Group has a joint controllership agreement in place among the four corporate entities to document how the respective tasks and responsibilities in the processing of Personal Information are structured and who fulfills which data protection obligations. For more information about the joint controllership agreement in place, please contact Us at privacy@eclipse.org.Eclipse Foundation AISBL is your contact point. You may contact us either via postal mail to “Eclipse Foundation AISBL, Rond Point Schuman 11, 1040 Brussels, Belgium” or via e-mail to privacy@eclipse.org. Contact details of all four companies may be found here. For more information about these companies, please contact emo@eclipse.org.You can also assert your rights with regard to the processing of your Personal Information in joint controllership vis-à-vis Us as jointly responsible. In case you contact Us, We will coordinate in accordance with Our joint controllership agreement in order to respond to your inquiry and to guarantee your rights as a data subject.How long We keep your Personal InformationUnless We are subject to other obligations such as legally mandated retention periods or ongoing court proceedings, We store your Personal Information only as long as necessary to carry out a service you have requested or to which you have given your consent, or as necessary to fulfill Our responsibilities as an open source foundation. As examples, We will store your Personal Information to enable you to access and use the Website and services as long as you have a registered ID account, and We will store your Personal Information related to your behavior on the Website, including your IP address, for up to 90 days in Our active files, and in Our log files used for security and system integrity purposes for as long as one year.International TransfersTo enable Us to conform to GDPR, note that your Personal Information may be processed in countries both inside and outside the European Union (“EU”) or European Economic Area (“EEA”), including areas which may be regarded as having a lower level of data protection than the EU. In such cases, We ensure that a consistent level of protection for your Personal Information is guaranteed, including, under applicable EU rules, via the existence of an adequacy decision or the use of appropriate data transfer tools, for example, entering into the standard contractual clauses issued by the European Commission with other entities of the Eclipse Group or with Our Processors, all in order to ensure that they provide a sufficient level of protection for your Personal Information.Our Commitment to YouWe commit to providing you with the following rights in accordance with applicable laws:to provide you with access to Personal Information that We hold about you;to update or correct any out-of-date or incorrect Personal Information that We hold about you;where the processing is based on your consent, the ability to withdraw consent at any given time, without affecting the lawfulness of processing based on consent before its withdrawal;to have your Personal Information erased by Us, unless it cannot be done due to Our requirement to fulfill Our responsibilities, including those as an open source foundation;to restrict processing where the conditions of article 18 of the EU’s GDPR have been met;to support your request with respect to data portability;to respond to objections by you with respect to Our processing of your Personal Information; andto opt out of any direct marketing communications that We (with your consent) may send you.You can exercise these rights at any given time. We will respond within 30 days to your requests. Please contact privacy@eclipse.org to make such a request.If you are a resident of the European Union, you have the right to lodge a complaint, under EU data privacy rules, with the Data Protection Authority, by post to 35 Rue de la Presse, B-1000 Brussels, by e-mail to contact@apd-gba.be, or by telephone at +32 2 274 48 00.Information Security and QualityWe protect the integrity of your Personal Information with appropriate technical and organizational measures, such as using encryption for transmission of certain forms of information, to help keep it secure, accurate, current, and complete.Your Personal Information may be stored in Canada, Switzerland, the European Union and the United States, always with Our same high security standards.It must be noted that the following Personal Information will be publicly available in unencrypted form and without access restriction:Any Personal Information collected by virtue of your contributions, including but not limited to your contributions to Our forums, public mailing lists, source code repositories, etc., which are subject to specific agreements you must enter into with Us (for example, the Eclipse Contributor Agreement (ECA)) prior to you contributing;Any data you store with Eclipse Group through Our services including, but not limited to, the User Storage Service (USS). We strongly advise you to not use these services to store passwords, any Personal Information, any confidential business information, or anything else that you do not want publicly available.Should you identify yourself as working for an Eclipse Member when you create your Eclipse account with Us, then we may disclose to the Member Representative of your organisation (as that term is defined in our Bylaws) any Personal Information collected by virtue of your contributions.CookiesWe make use of cookies when you visit the Website, including both cookies we create as well as third party cookies including but not limited to Hubspot, Twitter, YouTube, and Google Analytics. These cookies are placed on your computer or other device and perform various functions. Some of these cookies are necessary for the operation of the Website. Other cookies are subject to your permission and they can help distinguish you from other visitors to Our websites, improve the user experience, measure traffic, collect and measure certain statistics, and deliver relevant ads.Business RelationshipsThis Website contains links to other websites controlled or operated by parties other than the Eclipse Group. We are not responsible for the privacy practices or the content of such websites.Notification of ChangesThis Privacy Policy was last updated on 15 February 2024. A notice will be posted on www.eclipse.org for thirty (30) days whenever this Privacy Policy is changed.Questions Regarding This PolicyQuestions regarding this Privacy Policy should be directed to: privacy@eclipse.org.Related LinksLegal resourcesGuide to legal documentsLegalECA AboutSignValidation ToolEPL-2.0 AboutPlain HTMLPlain TextPDFFAQEPL-1.0 AboutPlain HTMLPlain TextFAQLicenses Approved 3rd PartyNon ApprovedFile HeadersDocs & ExamplesSpecifications Specifications ProcessSpecifications OperationsSpecification LicenseTCK License"
