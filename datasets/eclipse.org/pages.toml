["https://eclipse.org/research"]
title = "Research @ Eclipse Foundation | Research | The Eclipse Foundation"
description = "Business-friendly open source and open innovation underpins exploitation, community building and dissemination strategy for European projects."
full_description = '''The world's leading open source foundation forpublicly funded research projects.Since 2013, we have participated in 30 research projects in collaboration with over 730 partners, with 15 active projects currently underway across key technology domains including AI, security, cloud, data spaces, software-defined vehicles, embedded, IoT, and open hardware.We welcome the opportunity to collaborate on new industry research projects.Contact us Funding organisationsThe Eclipse Foundation collaborates with leading national and international research funding organisations. We specialise in transforming research outcomes into sustainable open source software platforms, ensuring they are accessible for both commercial and public benefit. What we offer A path to sustainability Guidance on transforming research into long-term, impactful open source platforms. Open collaboration guidance Benefit from trusted governance models, robust IP management, and commercial-friendly licensing practices, backed by the Eclipse Foundation's globally recognised expertise and deep European roots. Open source project lifecycle support Expertise in managing the entire lifecycle of open source projects, from creation to long-term maintenance. Expertise in community building Proven strategies to build and grow diverse communities of contributors, adopters, and collaborators to your project. Access to the Eclipse Foundation ecosystem Leverage a global network of developers, tools, and open source technologies, with the Eclipse Foundation’s leadership in connecting European research initiatives to global innovation.Transform your research into open sourcewith global impactPartner with the Eclipse Foundation to create sustainable open source platforms that amplify your project's global reach and ensure lasting value.Contact usMeet the teamCairo Caplan, PhDTesting EngineerAndré Gomes, PhDResearch Project ManagerMarco Jahn, PhDSenior Research Project ManagerPhilippe Krief, PhDDirector, Research RelationsBabasile Daniel Oladele-Emmanuel, PhDResearch Project ManagerDavid RemonResearch Project ManagerRosaria Rossini, PhDResearch Project ManagerSupported by 70+Eclipse Foundationstaff globallyOSS bridges the gapbetween researchers,industry, and SMEsLarge industrial organisations contribute concrete requirements through real-world use cases.Researchers develop innovative prototypes to address these requirements.Small and medium-sized software vendors industrialise these innovations, building sustainable business models around products and services adopted by industry.Research translation made simpleBy adhering to the open collaboration best practices, development processes, and intellectual property management practices, researchers gain confidence that their innovations are secure, open, and ready for commercial use.All contributions are licensed under a business-friendly open source license.The Eclipse Foundation empowers research teams to:Develop, evolve, and sustain open source projects that encapsulate research outcomes.Use proven governance and IP management frameworks to ensure code is always ready for research or commercial translation.Disseminate research findings effectively through open source, fostering adoption and impact.Explore our impactDiscover our ongoing and completed partnerships, showcasing the transformative power of open source in research:Groups we supportResourcesStay connectedWe welcome opportunities to work with new industry research projects. If you would like more information, please contact us at research@eclipse.org.To follow our activities, please subscribe to our mailing list research-ec@eclipse.org or follow us on social media @ResearchEclipse. Eclipse Foundation's LinkedIn Profile Eclipse Foundation Research's X Profile Eclipse Foundation's YouTube Channel hbspt.forms.create({portalId:"5413615",formId:"81c7873e-8407-4046-9801-39c6f70a3e22"}) <ul class="featured-projects-list featured-projects-list-cards research-projects-row"> {{#projects}} <li class="featured-project"> <div class="featured-projects-item tpl-projects-research"> <div class="featured-projects-item-category category labels">{{ name }}</div> <div class="featured-projects-item-content"> <a href="{{ websiteUrl }}" class="link"> <img class="featured-projects-item-img img-responsive logo logo_alt" alt="{{ name }}" src="{{ logo }}" height="40"> </a> <div class="featured-projects-item-text"> <p class="description">{{ summary }}</p> </div> </div> <div class="details"> <div class="featured-projects-website-url"> <a href="{{ websiteUrl }}">Read More</a> </div> <div> <hr> {{#projectTopic}} <p>Main Topic: <strong>{{ projectTopic }}</strong></p> {{/projectTopic}} </div> </div> </div> </li> {{/projects}} <li class="featured-project"> <a class="featured-projects-item view-all-card" href="/research/projects/" target="_blank"> <i class="fa-solid fa-external-link" aria-hidden="true"></i> <p>View All</p> </a> </li> </ul>'''
