full_description = "Breadcrumbs HomeSponsorSponsor the Eclipse IDE Sponsor the Eclipse IDE The Eclipse IDE is the leading open source platform for professional developers, used by millions of people every day, and 100% free and open source. By contributing, you'll help ensure it stays that way and contribute toward its future development. Invest Your Time Help answer questions rather than just asking them. Share your knowledge, experience, and expertise. If you don't already have an Eclipse Account, register now. The Newcomer Forum is a great place to help others. Help fix bugs and help implement enhancements rather than just reporting problems and requesting features. Not only will you personally benefit, giving back to the commons makes everything better for everyone. If you don't already have an Eclipse Account, register now. If you haven't already signed your Eclipse Contributor Agreement, sign now. You'll need to set up a development environment with the workspace provisioned to include the Git repositories of the projects to which you wish to contribute. The Eclipse Installer makes this super easy. Many projects have Oomph project setups to automate the setup process. Use the Eclipse Installer's Advanced Mode menu item to switch to advanced mode and choose the project on the second page of the wizard. Some projects make it even easier to get started by providing a setup configuration: Contribute to the Eclipse Platform. Contribute to Oomph. Contribute to the Eclipse Modeling Framework. How often would you like to sponsor? One Time Monthly Select the amount you'd like to give: € 250 € 130 € 80 € 40 € 25 € 12 € EUR CAD USD How would you like to pay? Credit PayPal Problems sponsoring? Sponsorship FAQ"
