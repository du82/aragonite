["https://eclipse.org/membership"]
title = "Eclipse Membership | The Eclipse Foundation"
description = "The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and business-friendly environment for open source …"
full_description = "HomeEclipse MembershipBenefits and ServicesMembership LevelsMembership FeesBecome a MemberResourcesMember PortalWhy become a Member of the Eclipse Foundation?Take an active role in supporting sustainable, commercialisable open source technologies that benefit all.Participate in a thriving developer communityand provide contributions to Eclipse projects and Industry Collaborations.Protect your strategic investmentsby signaling your support for advancing technologies your business relies upon.Share costs and innovationwhile focusing resources on rapidly building differentiated features that customers value most.Benefit from strong governancesolid intellectual property management, and inclusive open source community development.Prosper by sharingopen source commercialisation best practices with industry peers.Promote accomplishmentsand good corporate citizenship through contributions to open source projects.Key Services of the Eclipse FoundationMembers can take advantage of the following key services provided by the Eclipse Foundation.Development ProcessThe Eclipse community has a well-earned reputation for providing high-quality software, reliably and predictably. The Eclipse Foundation provides services and support to help projects consistently achieve their goals. Our staff assists new projects in implementing the Eclipse development process, a set of procedures and rules that form our best practices.IP ManagementWe focus on enabling the use of open source technology in commercial software products and services. All Eclipse projects are licensed under an OSI approved license including the Eclipse Public License (EPL). In addition, the Eclipse Foundation due diligence process helps to validate the pedigree of the intellectual property contained in Eclipse projects.Ecosystem Development and MarketingThe Eclipse Foundation's vendor-neutral marketing programs promote Eclipse community growth and engagement, drive awareness and discoverability of projects and collaborations and increase the commercial adoption of Eclipse technologies. The Foundation coordinates and implements a variety of activities, including content creation, press and analyst relations, community conferences and events, advertising, social media management, and other programs to promote the entire Eclipse community and increase engagement.IT InfrastructureThe Eclipse Foundation provides vendor-neutral, reliable and scalable services for Eclipse technology developers and users. IT infrastructure services delivered to the Eclipse community include source code repositories, build infrastructure, development-oriented mailing lists and newsgroups, a downloads site, and project and working group websites.Contact Us About Membership Membership Levels Membership at the Eclipse FoundationThe Foundation offers four levels of membership: Strategic, Contributing, Associate, and Committer.Strategic MembersStrategic Members play an integral role in the Eclipse Foundation ecosystem. Strategic members are organizations that view participation in Eclipse projects as strategic to their business and are investing significant developer and other resources to further drive Eclipse Foundation technology. Typically, Strategic Members lead one or more top-level projects. Strategic membership benefits include:A seat on Board of Directors of Eclipse FoundationA seat on Foundation Architecture CouncilThe opportunity to attend and vote at all meetings of the General AssemblyAccess to a number of Strategic Members-Only Programs such as banner and logo promotion on eclipse.org and eclipse.org/downloadsAd hoc Intellectual Property analysis and reportingHelp to launch open source initiative(s)Direct influence through board voting rights on key aspects of the Eclipse ecosystem, including licensing, governing policy development, and amendments to Membership Agreement and bylawsDiscounts towards sponsorship and attendance of Eclipse Foundation eventsAccess to Eclipse Foundation marketing and advertising programsOpportunity to lead in the establishment of Eclipse Working GroupsOpportunity to join and participate on all Eclipse Foundation public mailing listsOpportunity to show support for the Eclipse Foundation by displaying the Eclipse Foundation member logoView Existing Strategic MembersContributing Members (formerly referred to as Solutions Members)Contributing Members are organizations that view Eclipse Foundation technologies as important to their corporate and product strategy and offer products and services based on, or with, Eclipse Foundation technologies. These organizations want to participate in the development of the broad Eclipse Foundation ecosystem. Most members join initially as Contributing Members. Contributing membership benefits include:Contributing Members are represented on the Board of Directors, and thus have influence over decisions relating to licensing, governing policy development, and amendments to Membership Agreement and bylawsOpportunity to stand for election as the representative of all Contributing Members on the Board of Directors. Elections are held annually in the first quarterThe opportunity to attend and vote at all meetings of the General AssemblyDiscounts towards sponsorship and attendance of Eclipse Foundation run eventsAccess to Eclipse Foundation marketing and advertising programsOpportunity to participate in Eclipse Working Groups, including as a Strategic Member of those working groupsOpportunity to join and participate on all Eclipse Foundation public mailing listsOpportunity to show support for the Eclipse Foundation by displaying the Eclipse Foundation Member logoView Existing Contributing MembersAssociate MembersAssociate Members are organizations that participate in and want to show support for the Eclipse Foundation ecosystem. Many research and educational institutions choose to join as an Associate Member. Associate membership benefits include:Opportunity to join and participate on all Eclipse public mailing lists, and to attend Members meetingsAbility to join select Eclipse Working Groups as a Guest MemberThe opportunity to attend all meetings of the General AssemblyOpportunity to show support for the Eclipse Foundation by displaying the Eclipse Foundation Member logoView Existing Associate MembersCommitter MembersThe Eclipse Foundation’s governance model provides individual committers with the ability to become full members and includes representation on the Eclipse Board of Directors. Committer Members are individuals that are the core developers of the Eclipse projects and can commit changes to project source code.Committer membership benefits include:Committer Members are represented on the Board of Directors, and thus have influence over decisions relating to licensing, governing policy development, and amendments to Membership Agreement and bylawsOpportunity to stand for election as the representative of all Committer Members on the Board of Directors. Elections are held annually in the first quarterThe opportunity to attend all meetings of the General AssemblyLearn more about Committer membership. Benefits and Services Contact Us About Membership Membership Fees Membership FeesThe Membership Annual Fee Comparison Chart based on membership levels is provided below for illustration purposes only. Please see the Eclipse Foundation Membership Agreement for full details. Note that Eclipse Working Group Membership fees are separate and in addition to general Eclipse Foundation Membership fees.Annual Corporate RevenueAnnual Eclipse Foundation Membership Fees*StrategicContributingAssociate> €1 billion€300 000€25 000€25 000€100 million - €1 billion€180 000€17 500€17 500€50 million - €100 million€125 000€12 500€12 500€10 million - €50 million€60 000€9 000€9 000< €10 million€30 000€6 000€6 000< €1 million < 10 employees€30 000€1 500€1 500Govt, Govt agencies, Research Organizations, NGOs, etc.€30 000€6 000€0Academic, Publishing Organizations, User Groups, etc.€30 000€1 000€0* There is no cost to being a Committer member of the Foundation Membership Levels Contact Us About Membership Become a Member How to Become a MemberIn order for your organisation to become a member, you must complete and sign the following documents through our Member Enrolment Portal:Membership Application Form (you will need to indicate which class of membership you are joining. Most organisations join as Contributing members.)Membership AgreementMember Committer and Contributor Agreement (optional, but recommended)If you would prefer, you may instead download, complete, and sign the documents and email to us for processing.Note: Membership in an Eclipse Working Group requires the execution of the respective Working Group’s Participation Agreement. For more information, review the list of the current Eclipse Working Groups and their respective Participation Agreement.What is the Member Enrolment Portal?The simplest way to complete and sign the documents is by creating an Eclipse account (if you don't already have one) and using our Membership Enrolment Portal. This portal will walk you through the documents above and ensure you provide all the necessary information. Once complete, our staff will review the submission and send you the appropriate agreements for electronic signature.What if I have questions?Our governance page lists all of our key governance documents, including the Eclipse Foundation Bylaws, IP Policy, Antitrust Policy, Affiliates Guidelines, etc.And feel free to email us with any additional questions you have.For Committer MembersIf you are a Committer who is not already a Member by virtue of your employer being a Member, you are welcome to join as an individual Committer Member. The steps involved in becoming a committer are described here; individual Committer Members should download and email us the Membership Agreement.Eclipse Foundation AISBLIn January 2021, the Eclipse Foundation created a new Belgian-based organisation, Eclipse Foundation AISBL. All new members are strongly encouraged to join this Eclipse Foundation AISBL organisation and do so using the above application and agreements.Prior to January 2021, Eclipse Foundation membership was based on Eclipse Foundation, Inc., a Delaware-based organisation, and this organisation still exists. The membership benefits for both organisations are identical, and members are expected to join only one. Any new member of Eclipse Foundation who believes they have reason to join the Delaware-based organisation may contact membership@eclipse.org for the appropriate versions of the Membership Agreement and Membership Application. Membership Fees Contact Us About Membership Resources ResourcesMembership ProspectusLearn about Eclipse Foundation membership, and how you can become a member.View Prospectus Download PDFOverview PresentationA presentation of the Eclipse Foundation and Eclipse community for new and prospective members.DownloadKeeping Members ConnectedServing our community is the number one priority of the Eclipse Foundation.To keep our community connected, we send out a monthly newsletter to member companies and member committers. Check out some past issues of our member newsletter. Become a Member Contact Us About Membership Portal Member PortalThe Eclipse Foundation member portal provides Member organizations with insights into their participation in the Eclipse community. Find out about industry collaborations and projects your organization is involved in and access resources curated for Members.Additionally, this portal allows members to update key data related to their membership, including their logo, corporate description, and key contacts. Resources Go to the Member PortalPDF form and agreementsComplete and sign the membership application form pdfComplete and sign the membership agreementComplete and sign the member committer and contributor agreement (optional, but recommended)Email us the signed documents, including the membership application form, the membership agreement, and optionally, the member committer and contributor agreement.Close"
