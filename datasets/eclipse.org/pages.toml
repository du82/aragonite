full_description = "HomeSponsorSponsor a CollaborationSponsor a CollaborationIf you are looking to support a working group, without committing to membership, you can become a sponsor! As a sponsor, you can donate on a one-time or recurring annual basis to support working group initiatives that matter to your organisation.Anyone can contribute funds to the Eclipse Foundation:Sponsor as an OrganisationComplete the sponsorship agreement form, to sponsor any of the Eclipse Foundation Working Groups.Sponsor as an IndividualIndividuals can also sponsor to the Eclipse Foundation.All sponsored funds will be included in the working group’s annual budget, which is under the direction of the working group’s steering committee. Sponsors are encouraged but not required to indicate their non-binding commitment to future sponsorships to promote the stability of the working group, and to allow the steering committee to plan for multi-year initiatives.If you have questions about sponsorship, reach out to sponsor@eclipse.org."
