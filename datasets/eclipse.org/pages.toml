title = "Explore our Industry Collaborations | The Eclipse Foundation"
description = "The Eclipse Foundation - home to a global community, the Eclipse IDE, Jakarta EE and over 415 open source projects, including runtimes, tools and frameworks."
full_description = "Breadcrumbs HomeAbout UsEclipse Working GroupsExplore our Industry Collaborations Jump to Section Working Groups Interest Groups Working Groups Loading... Interest Groups Eclipse Cloud Status: Active The Eclipse Cloud Interest Group aims to empower individual cloud providers, cloud users, and cloud industry vendors to explore and assess ways to independently build, manage, operate, and consume the cloud services of their choice, from the providers of their choice. This includes fostering: Freedom from vendor lock-in Scalability, resilience, and flexibility in cloud environments, whether public, private, or hybrid Interoperable, adaptable, and easy to manage systems Operational independence and resilience, reducing reliance on any single cloud provider and enhancing the overall security and performance of cloud services Diverse markets across cloud services and service providers Learn more Not an Eclipse Member? Eclipse Member ready to join now Status: Active Java will continue to be a mission critical language for organizations of all sizes well into the future. This interest group is intended to bring together people from inside and outside of Java related working groups, influencers, and other interested parties. It will take on the role of ideation, research, and presentation of recommendations, working closely with Jakarta EE and MicroProfile working groups to ensure the ideas are scoped, prioritized, and understood. Recommendations from this interest group are non-binding on the working groups and are intended to provide insights and ideas that working groups do not have time to consider. Learn more Not an Eclipse Member? Eclipse Member ready to join now Status: Active Sharing practices for privacy engineering based on models. This interest group focuses on the sharing of practices for privacy engineering based on the use of models. Learn more Not an Eclipse Member? Eclipse Member ready to join now Status: Active The openMobility Interest Group drives the evolution and broad adoption of mobility modelling and simulation technologies. Learn more Not an Eclipse Member? Eclipse Member ready to join now Toolchain Modernization Strategy Status: Active The Toolchain Modernization Strategy Interest Group is focused on sharing expertise and collaboratively developing strategies for modernizing, migrating, and transforming technology stacks. This group will address the challenges of evolving both desktop-based and cloud-based products towards more modern, scalable solutions. It will also consider emerging technologies, such as the integration of artificial intelligence and machine learning or in general new technologies, as an aspect of modernization. Learn more Not an Eclipse Member? Eclipse Member ready to join now @media all and (-ms-high-contrast:none) { div.bordered-box { height: auto; } } .collaboration-card-header { min-height: 8rem; }"
