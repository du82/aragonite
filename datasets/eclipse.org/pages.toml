["https://www.eclipse.org/legal"]
title = "Eclipse Foundation Legal Resources | The Eclipse Foundation"
description = "The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and business-friendly environment for open source …"
full_description = "HomeEclipse Foundation Legal ResourcesEclipse Foundation Legal ResourcesLegal resource page for the Eclipse Foundation.Getting StartedAgreement and LicensesPrivacy and TrademarksCommitter AgreementsCommitter ResourcesGetting StartedThe Guide to the Legal Documents provides an in-depth look at the many legal documents related to the Eclipse open source community. This content is of value to committers, contributors, redistributors of Eclipse content, developers of Eclipse-based products and users of Eclipse technologies;Unless otherwise noted in the project documentation, the Eclipse Public License (EPL) is the default license for Eclipse Foundation projects (please see the Eclipse Public License Frequently Asked Questions);The Eclipse Foundation Legal Frequently Asked Questions answers some of the commonly asked questions about Eclipse.org licensing, contributions, working as a committer, and cryptography;Third Party Content Licenses provides a list of licenses that are approved for third party content used by Eclipse projects; orFor other questions, email: license@eclipse-foundation.org.Agreements and LicensesWeb Site Terms of Use: By accessing, browsing or using this web site, you acknowledge that you have read, understood, and agree to be bound by the terms and conditions contained in this agreement.Eclipse Public License (EPL): The default license for Eclipse Foundation projects.Eclipse Distribution License (EDL): The BSD license used by some Eclipse Foundation projects which implement permissive dual-licensing along with the EPL. Other than for example code or build scripts.Eclipse Contributor Agreement: If you are contributing code or documentation to Eclipse Foundation projects you are required to complete this agreement.Developer Certificate of Origin: If you are contributing code or documentation to Eclipse Foundation projects, and using the git signed-off-by mechanism, you are agreeing to this certificate.Copyright Agent: Contact information for the Eclipse Foundation’s Copyright Agent.Eclipse Foundation Software User Agreement: By downloading binaries or accessing Eclipse Foundation source code repositories, you acknowledge that you have read, understood, and agree to be bound by the terms and conditions contained in this agreement.Approved Licenses for Non-Code, Example, and Other Content: The Board of Directors has approved the use of certain licenses for specific types of content on eclipse.org.Eclipse Foundation Adoptium Marketplace Publisher Agreement: The license agreement Adoptium Working Group Members must agree to before publishing links in the Adoptium Marketplace from which publisher makes Java SE distributions in binary form.Eclipse Foundation Open VSX Publisher Agreement: The license agreement Eclipse Open VSX Registry publishers must agree to before publishing extensions for VS Code compatible editors on open-vsx.org. You may read the Open VSX Registry FAQ here.Eclipse Foundation Specification License: The license used by Eclipse Foundation specifications created under the Eclipse Foundation Specification Process.Eclipse Foundation TCK License: The binary license used by Technology Compatibility Kits to demonstrate compatibility with their corresponding Specifications.Eclipse Foundation Quality Verification Suite License: The license that governs the use and redistribution of the Eclipse Quality Verification Suite (QVS) in binary form.Eclipse Foundation User Group Trademark License Agreement: Guidelines and agreements for user groups that are based on Eclipse Foundation projects and/or working groups.Privacy and TrademarksPrivacy Policy: Your privacy is important to us. This statement discloses the information practices for this web site, including what type of information is gathered and tracked, how the information is used, and with whom the information is shared.Eclipse Foundation Trademark Usage Guidelines: Guidelines on permissable use of Eclipse logos and trademarks.Trademark and Domain Name Assignment Agreement: Pre-existing projects which move to the Eclipse Foundation will be required to execute this agreement to ensure that the Eclipse Foundation has rights to any trademarks associated with the project name. Send the completed agreement to trademarks@eclipse-foundation.org.Eclipse Foundation Trademarks: The list of trademarks claimed by the Eclipse Foundation.Trademark Attributions: Content on this web site may make reference to trademarks requiring attribution.Committer AgreementsFor Eclipse projects (and the open source world in general), committers are the ones who hold the keys. Committers decide what code goes into the code base, they decide how a project builds, and they ultimately decide what gets delivered to the adopter community. Committer status is assigned following a demonstration of merit (generally a record of high-quality contribution to a project) and a successful committer election.The specific agreements required depends on the nature of the project. For committers on an open source software project (i.e., most Eclipse Foundation projects), the traditional agreements are required. For committers on an open source specification project, additional working group agreements are required.Committer status is assigned on a project-by-project basis. That is, individuals have committer rights only on those projects for which they hold committer status. For all other projects, they are contributors.Our committer provisioning process is automated: new committers will—following their successful election—be contacted by email to engage in our agreement workflow (also referred to as our paperwork process), which guides them through signing those agreements that they need. The agreements are provided below for convenience.Member Committer and Contributor Agreement: The Member Committer and Contributor Agreement (MCCA) is used by organizations that are members of the Eclipse Foundation to cover all of their employees who participate in Eclipse Foundation open source projects as committers and contributors. This agreement allows employees of our member organizations to participate in Eclipse Foundation projects without any additional paperwork.Individual Committer Agreement: This agreement is used by committers participating in Eclipse open source projects whose employers are either not members of the Eclipse Foundation or are members that have not signed the Member Committer and Contributor Agreement.Employer Consent Agreement for Eclipse Foundation Specification Projects: The Employer Consent Agreement for Eclipse Foundation Specification Projects (“Employer Consent Agreement”) is to be completed by the employer of a committer who is seeking Individual Committer status on an Eclipse Foundation Specification Project operating under the purview of an Eclipse Foundation Working Group. Note that this form is only required when the employer is not a participant of the corresponding working group.Resources for CommittersA committer is a person that has been granted commit rights to systems on the Eclipse servers such as Git repositories, web pages, download servers, mailing lists and so forth. In addition to writing project content, committers play a critical role is other aspects of managing an open source project.Eclipse Project Handbook: This Eclipse Project Handbook is a reference guide for working as a committer on an Eclipse open source project.Intellectual Property Due Diligence: At least in some cases, the Eclipse Foundation’s IP Team needs to be engaged to review third-party content, or contributions of project content from non-committers. Committers have an important role to play in this process.Eclipse Committer Due Diligence Guidelines: This document outlines the issues to be aware of and the processes one should follow when working as a committer on Eclipse projects.Project Content: Project Content is content that is managed by the project team. This includes content that is produced by project committers, along with content that is contributed to the project by outside contributors.Third-party Content: The Eclipse Foundation IP Due Dilience Process defines three different types: Prerequisite, Exempt Prerequisite, and Works With Dependency.IP Logs: An IP Log is a record of the intellectual property contributions to a project. This includes such as a list of all committers, past and present, that have worked on the code and (especially) those who have made contributions to the current code base.Legal Documentation: This provides templates for NOTICE, CONTRIBUTING, LICENSE and other files that accompany project source code and distributions.Committer Elections: Contributors may become committers via committer election.LegalECA AboutSignValidation ToolEPL-2.0 AboutPlain HTMLPlain TextPDFFAQEPL-1.0 AboutPlain HTMLPlain TextFAQLicenses Approved 3rd PartyNon ApprovedFile HeadersDocs & ExamplesSpecifications Specifications ProcessSpecifications OperationsSpecification LicenseTCK License"
