full_description = "HomeCareersWhy you should join the teamJoin a collaborative team built around the core values of service, respect, professionalism, and collegiality. We work together to make a difference for our members and open source communities.The Eclipse Foundation is global and offers fully remote positions, with staff located in Europe, Canada, and the United States.We understand the importance of work-life balance and support this with many worker-based programs, including Friday flex-time, a right-to-disconnect policy, and “Corporate Recharge” days. And of course, we offer highly competitive compensation along with a comprehensive benefits package.What we do at the Eclipse FoundationOpen source is one of the key drivers of innovation today. It touches all sectors of the economy and has a major impact on the software systems that each of us interact with every day.As a Belgian international nonprofit association, the Eclipse Foundation is one of the largest open source foundations in the world and acts as a steward for some of the most interesting and important projects in a wide range of technology areas. Each of our team members plays a direct and proactive role in the success of Eclipse and its projects and initiatives, and as our team is “dynamic, challenging, and impactful”. Come be a part of our highly motivated and effective team!Current PositionsHear it from our TeamWorking at the Eclipse Foundation has given me a better understanding of how open source projects and communities work. It is also a safe and comfortable work environment that aligns with my values and helps me achieve work-life balance.Carmen Delgado, Community ManagerThe collaborative environment here is not just about technology, but also about making a positive impact. It's fulfilling to be with an organisation that values progress and diverse ideas.Christopher Guindon, Senior Manager, Web DevelopmentThe Eclipse Foundation is a progressive global organisation where employees from 