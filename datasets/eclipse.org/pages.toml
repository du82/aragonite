t moderating issues. Please note that no such out-of-court settlement bodies have been certified by the competent authorities yet. We will update these Terms of Use once more information becomes available.User Data Services (“UDS”)As a service to you, Eclipse.org services or Eclipse software may offer functionality whereby you can store or share certain information on Eclipse Foundation’s computer systems, so that it is accessible to you from various devices that you use. Examples include, but are not limited to, Eclipse IoT sandbox servers and the User Storage Service. PLEASE BE AWARE THAT ALL INFORMATION THAT YOU STORE OR SHARE WITH ECLIPSE WILL BE PUBLICLY ACCESSIBLE ON THE INTERNET IN UNENCRYPTED FORM AND WITHOUT ANY ACCESS RESTRICTIONS. Do not store or share passwords, any personally identifiable information (“PII”), any confidential business information, or anything else that you do not want to be generally and publicly available. By using this functionality, any information that you store or share (the “Stored Information”) will be subject to the CC0 1.0 Creative Commons licence, where, for purposes of that licence, the Stored Information shall constitute the “Work” and you shall be the “Affirmer”. What that means is that anybody who accesses your information on the Internet has a worldwide, unrestricted, royalty free, irrevocable, perpetual, non-exclusive licence to use, make, reproduce, prepare derivative works of, publicly display, publicly perform, transmit, sell, distribute, sublicense or otherwise transfer the Stored Information without any obligation to you, including any obligation of attribution.The Eclipse Foundation reserves the right to discontinue these services at any time or to remove any specific Stored Information from owned or controlled computer systems at any time, and Eclipse Foundation does not commit to making Stored Information available at all times in the future.LicensesExcept for Content available through the UDS, and except as otherwise stated herein, the Content provided on this Website is provided under the terms and conditions of the Eclipse Foundation Software User Agreement and those additional terms, conditions and notices referenced therein.If Content is licensed to you under the terms and conditions of a version of the Eclipse Public License ("EPL"), with respect to such Content, the term “Contributions” as used herein shall have the meaning provided in the EPL, and any such Contributions uploaded, submitted, or otherwise made available by you to the Eclipse Foundation and/or the Members and/or users of this Website shall be governed by the terms and conditions of the EPL and can be made available to others under the terms of the EPL.If Content is licensed to you under licence terms and conditions other than the EPL (“Other Licence”) with respect to such Content the term “Contributions” as used herein shall mean any modifications, enhancements and/or other code and/or documentation related to such Content uploaded, submitted, or otherwise made available by you to the Eclipse Foundation and/or the Members and/or users of this Website, and such Contributions shall be subject to and governed by the terms and conditions of the Other License. In addition, with regard to such Contributions, you agree to provide the Contributions under the terms and conditions of the Other License, provided however that the Eclipse Foundation shall have the right to reject any Contributions if the acceptance by the Eclipse Foundation would be in any way inconsistent with the Eclipse Foundation’s Intellectual Property Policy.In addition to the licences granted above, you grant a non-exclusive, worldwide, perpetual, royalty-free licence of all necessary rights under your copyright in and to your Contributions (the “Specification Grant”): (a) for the Eclipse Foundation (and its contributors solely as a part of Eclipse Foundation projects) to create, reproduce, prepare derivative works of, publicly display, publ