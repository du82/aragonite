["https://eclipse.org/org/workinggroups/about.php"]
title = "About Working Groups | The Eclipse Foundation"
description = "The Eclipse Foundation - home to a global community, the Eclipse IDE, Jakarta EE and over 415 open source projects, including runtimes, tools and frameworks."
full_description = "Breadcrumbs HomeAbout UsEclipse Working GroupsAbout Working Groups About Working Groups Fostering open industry collaboration to develop new industry platforms Companies, organizations, and individuals looking to drive innovation and efficiencies within industry are increasingly looking to external sources to advance new ideas. Commonly referred to as “open innovation,” this paradigm encourages collaboration across organizational boundaries, and is often practiced in the open source community. Working groups allow organizations to combine the best practices of open source development with a set of services required for open innovation, enabling organizations to foster industry collaborations. At the Eclipse Foundation, working groups provide a vendor-neutral governance structure that allows members of the foundation to collaborate on solving industry problems and to drive shared innovation through the related Eclipse Foundation open source projects. The collaboration promotes and augments Eclipse technologies to meet the needs of specific industries and communities, including through the development and implementation of joint marketing programs to increase awareness, adoption, and contributions. Find out more about the relationship between working groups and projects. Through working groups, member organizations can collaborate to: help improve the supply chain of software development tools, frameworks, and runtimes in a particular industry develop specifications in open source create new technology platforms that increases interoperability among organizations and technologies drive the industry adoption and support of strategic open source projects and technologies, including developer advocacy, marketing outreach, brand promotion, compatibility program, etc. Participation in a working group is only open to Eclipse Foundation members. Services for Working Groups The Eclipse Foundation provides working groups with vendor-neutral governance , ecosystem development and marketing services, collaborative management, specification development and branding and compatibility. The foundation also provides intellectual property management and licensing, shared IT infrastructure, and development processes for the projects complemented and promoted by the working groups. Vendor-Neutral Governance Good governance controlling how decisions are made, policies are set and disputes resolved is important for any successful collaboration. The Eclipse Foundation, a not-for-profit corporation, is governed by a set of Bylaws, agreements, and policies, including antitrust and intellectual property management policies, that ensure a vendor-neutral governance model for working group collaborations. All entities in a working group participate based strictly on their contributions and merit. Working groups are able to define rights based on membership within a working group. This ensures that no one individual or organization has any special status or veto. Ecosystem Development and Marketing Working groups are most effective when a diverse group of organizations get involved and collaborate. The Eclipse Foundation provides marketing expertise, processes, and platforms to enable working group members to jointly grow the awareness of and participation in working groups and their projects. Our team of marketing professionals support working groups with brand development, press and analyst relations, content creation (e.g. white papers, case studies, eBooks), event coordination, advertising, social media management, and other working group-specific activities. Find out more about the marketing services provided by the Foundation. Collaborative management There is a tight coupling between working groups and open source projects hosted at the Eclipse Foundation that is very valuable to the open source community. Working groups can help coordinate the efforts of otherwise separate open source projects by providing things like shared vision and a roadmap; and determine how to leverage working group resources to best serve the open source community. The Foundation helps set up shared responsibilities, manages budgets and provides governance for these shared initiatives. The Eclipse Marketplace and OpenVSX registry are concrete examples of cross-project initiatives that working groups have built with the collaborative management offered by the Eclipse Foundation. Specification Development A specification provides definitions, descriptions of semantic behavior, data formats, protocols, and/or other referenced specifications, along with technical artifacts, intended to enable the development and verify compatibility of independent implementations. The Eclipse Foundation Specification Process (EFSP) defines a general framework for the development of specifications in open source at the Eclipse Foundation. All specification development occurs under the purview of a working group that — through their designated specification committee — plays a critical role in the general governance, and management of the intellectual property flows that are particular to specifications. Branding and Compatibility Working groups can build on the value of their specifications and develop a trusted ecosystem of implementers and consumers, by creating a branding and compatibility program. . Products that implement specifications and pass the corresponding Technology Compatibility Kit (TCK) can be branded as compatible implementations. Consumers can trust that branded products are truly compatible. Join a Working Group Explore our working groups to learn more about their vision and scope, and how to join. Eclipse Working Groups Explore Working Groups About Working Groups 5 Reasons to Collaborate Related Links Working Group Process Working Group Operations Working Group Development Effort Guidelines Member Funded Initiatives"
author = "Christopher Guindon"
year_published = 2025
