full_description = "HomeResourcesMarketplacesMarketplacesFind the open source extensions you need through one of our marketplaces.Eclipse IDE MarketplaceOpen VSX RegistryAdoptium Marketplace The Eclipse Foundation is home to the Eclipse IDE, Jakarta EE, and hundreds of open source projects, including runtimes, tools, specifications, and frameworks for cloud and edge applications, IoT, AI, automotive, systems engineering, open processor designs, and many others. The Eclipse Foundation is an international non-profit association supported by our members, including industry leaders who value open source as a key enabler for their business strategies. Whether you intend on contributing to Eclipse technologies that are important to your product strategy, or simply want to explore a specific innovation area with like-minded organisations, the Eclipse Foundation is the open source home for industry collaboration. The Eclipse community consists of individual developers and organisations spanning many industries. Stay up to date on our open source community and find resources to support your journey. The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and vendor-neutral environment for open source software collaboration and innovation."
