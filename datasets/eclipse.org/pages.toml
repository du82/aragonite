["https://eclipse.org/collaborations/interest-groups"]
title = "About Interest Groups | The Eclipse Foundation"
description = "The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and business-friendly environment for open source …"
full_description = "HomeIndustry CollaborationsAbout Interest GroupsAbout Interest GroupsInterest groups are a light-weight, low-cost way for Eclipse Foundation members to collaborate on a common interest or domain in a vendor neutral manner based on the Eclipse Foundation’s governance structure, including its antitrust policy.Find out more about interest groups, with these frequently asked questions:What are Eclipse Foundation Interest Groups?Does Eclipse now offer two options for industry collaborations?What are the major differences between these collaborations and which one is right for my initiative?How do I propose a new Interest Group?How many members are required to create an Eclipse Interest Group?Are there any fees associated with Interest Groups?How to join an existing Interest Group?What is the governance structure of Interest Groups?How do Interest Groups make decisions?Is there a relationship between Interest Groups and Eclipse Projects?Can Interest Groups create specifications and/or develop software?Are Interest Groups a pre-req to becoming a Working Group?Can Interest Groups graduate to Working Groups?Are Interest Groups the same as Special Interest Groups?I’m interested, how do I find out more about the Eclipse Foundation industry collaborations?1. What are Eclipse Foundation Interest Groups?Eclipse Foundation Interest Groups facilitate the collaboration between participating Eclipse Member organisations to drive shared innovation. Eclipse Interest Groups are a light-weight association of a subset of Members that can come together to share a common interest in a topic or domain in a vendor-neutral manner based on the Eclipse Foundation’s overall governance structure including its antitrust policy.2. Does this mean Eclipse offers two mechanisms by which it supports industry collaborations?Yes, the Eclipse Foundation now offers two mechanisms to foster open industry collaboration to develop and drive new industry platforms and initiatives. Like Eclipse Working Groups, Eclipse Interest Groups can also collaborate across organizational boundaries in a vendor-neutral structure to solve industry problems and to drive shared innovation.3. What are the major differences between Interest Groups and Working Groups? How do I choose which is right for my initiative?Interest Groups, while modeled after Working Groups, are a very light-weight/self-governed group. Participation in Interest Groups is self managed by Member organisations, and there are no formal participation agreements, budgets, or committees. In short, they provide a simpler mechanism for Member organisations to collaborate in a collegial, vendor-neutral manner on initiatives of shared interest.Working Groups are intended for industry collaborative initiatives that have the intent to invest in the collective initiative, typically via participation fees. The intent is for working groups to address such additional objectives as developing and promoting a joint brand, developing open source specifications, contributing resources to drive common roadmaps and/or platforms, etc.From a pragmatic point of view, Working Groups leverage the Eclipse Foundation Working Group Process to manage and drive the collaboration, and have Participation Agreements, Working Group Fees, Charters,Committees, Program Plans, Budgets, and so on. Interest Groups, on the other hand, due to their lighter-weight structure, have none of these.4. How can I propose to create an Eclipse Interest Group?Existing members may propose to create an Interest Group by starting the process here. If your organisation is not already a member, you must first join the Eclipse Foundation, and then follow the same process. Note that all participating member organisations must have also executed the Eclipse Member Committer and Contributor Agreement.5. How many members are required in order to create an Interest Group?There must be at least three Member organisations participating. Each Interest Group must designate one or more Interest Group Leads.6. Are there any fees associated with Interest Groups?No, Interest Groups do not require Members to pay any additional fees to participate. However, you must be a Member of the Eclipse Foundation to participate. For more information, please visit our Membership Page.7. How can I participate in an existing Interest Group?Existing members with an executed Eclipse Member Committer and Contributor Agreement may participate in any Interest Group of interest. Members may participate by declaring participation via the Interest Group’s mailing list.8. What is the governance structure of an Interest Group?The governance structure for Interest Groups is intentionally lightweight. Eclipse Interest Groups inherit and rely upon the Eclipse Foundation’s overall governance, sufficient to enable individuals from Member organisations to collaborate effectively while conforming to all Eclipse processes and policies, including the Eclipse Foundation Intellectual Property and Antitrust Policies. See the Interest Group Process for a full overview of applicable related governance documents.All Interest Groups must produce agendas and minutes of all meetings and disseminate to the Interest Group’s mailing list.9. How do Interest Groups make decisions?Most actions taken by Interest Groups should be done so collegially by participants and based on lazy consensus. However, the Eclipse Foundation Interest Group Process does include a means for decisions to be formalized, should the participants believe it is valuable to do so.10. What relationship do Interest Groups have to Projects?Interest Groups may declare interest in any Eclipse project or projects, and may carry out activities that are in support of the success of those Eclipse project(s).11. Can Interest Groups create specifications and/or develop software?No, Interest Groups cannot create specifications nor develop software. Interest Groups may, at their discretion, produce artifacts such as documents, whitepapers, architectures, blueprints, diagrams, presentation and the like; however, they must not develop software, software documentation, or specifications.12. Are Interest Groups a Prerequisite to becoming a Working Group?No, Interest Groups are not a prerequisite to becoming a Working Group. It is possible, however, for the members of an Interest Group to decide to create a new Working Group.13. Can Interest Groups graduate to Working Groups?There is no direct correlation between Interest Groups and Working Groups, and thus no notion of graduation. Rather, all Eclipse industry collaborations, be they Interest Groups or Working Groups, will persist for however long they serve the collective purpose of their Members. It is possible that, over time, the Members of a particular Interest Group may deem that it would be more useful to be constituted as a Working Group, and vice versa. Should this be the case, it is possible under the guidance of the Foundation’s staff to make such a change.14. Are Interest Groups the same as Special Interest Groups (SIGs)?While similar, they are different. Special Interest Groups are a collaborative governance structure that allows Members of a working group to collaborate on specific, focused aspects of the broader working group’s scope. As such, Members of a SIG must also be participants of the Working Group which has formed the SIG.15. How do I find out more about Interest Groups and Working Groups?Please contact us via collaborations@eclipse-foundation.org.Industry CollaborationsAbout Interest GroupsInterest Group ProcessExplore our Interest Groups"
