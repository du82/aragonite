title = "Specifications | The Eclipse Foundation"
description = "The Eclipse Foundation provides our global community of individuals and organisations with a mature, scalable, and business-friendly environment for open source …"
full_description = "HomeSpecificationsSpecificationsThe Eclipse Foundation facilitates the development of code-first, open specifications that enable the compatibility, interoperability, and sustainability of both proprietary and open source independent implementations.Specifications at the Eclipse Foundation are developed through the Eclipse Foundation Specification Process (EFSP). The EFSP provides a defined, structured, and trusted legal framework and governance process for the development of royalty-free open specifications based on mature open source processes. The EFSP allows the community to develop specifications in a vendor neutral, community-driven way.All specifications produced under the EFSP are designed to enable independent implementations in any open source or commercial application.A Proven ApproachCommunity DrivenOur specification process is designed to be inclusive of everyone from the largest corporations to motivated individuals. FlexibleSpecifications allow implementations to have the highest degree of flexibility and interchangeability for adjustments, enhancements, replacements, and upgrades.Ecosystem EnablementOur specification processes enable independent implementations under both proprietary and open source licensing models.Investment ProtectionSpecifications reduce the risk of vendor lock-in by ensuring implementations meet compatibility and interoperability requirements.Vendor NeutralOpen and transparent development processes allow individuals and organizations to collaborate on specifications. Well-documented governance policies and processes ensure that the results are developed and delivered in a vendor neutral manner.Open SourceThe EFSP complies with the Open Standards Requirement for Software established by the Open Source Initiative, ensuring that all Eclipse Foundation specifications can be implemented in open source.ProvenThe EFSP is built on more than 17 years of open source stewardship and used by multi-billion-dollar ecosystems. Compatibility and BrandingThe EFSP allows for the development of a compatibility brand. Established compatibility brands clearly identify the compatibility, interoperability, and sustainability of production-ready open source and commercial implementations.Find out moreCurrent InitiativesJakarta EEThe industry-leading specification for developing enterprise and cloud native java applications.MicroProfileAn open forum to optimize Enterprise Java for a microservices architecture.AsciiDocSpecifications for the AsciiDoc language and the APIs processing it.SparkplugProvides MQTT clients the framework to seamlessly integrate industrial machine data from their applications, sensors, devices, and gateways within the MQTT Infrastructure.OSGiSpecifications that enable development, deployment, and management of embedded, server-side, and cloud native applications."
