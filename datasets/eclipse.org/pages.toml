["https://eclipse.org/org/services"]
title = "Services | The Eclipse Foundation"
description = "The Eclipse Foundation - home to a global community, the Eclipse IDE, Jakarta EE and over 415 open source projects, including runtimes, tools and frameworks."
full_description = "Breadcrumbs HomeAbout UsServices Services The Eclipse Foundation provides four key services to the Eclipse community: 1) IP Management, 2) Ecosystem Development and Marketing, 3) Development Process, and 4) IT Infrastructure. Full-time staff are associated with each of these areas and work with the greater Eclipse community to assist in meeting the needs of stakeholders. Intellectual Property (IP) Management An important aspect of the Eclipse Foundation is the focus on enabling the use of open source technology in commercial software products and services. We consciously promote and encourage software vendors to use Eclipse technology for building their commercial software products and services. This is made possible by the fact that all Eclipse projects are licensed under a commercial-friendly OSI-approved license. The Eclipse Foundation also undertakes a number of steps to attempt to ensure the pedigree of the intellectual property contained within Eclipse projects. The first step in the due diligence process is to ensure that all contributions are made by the rightful copyright holder and under the project license. All committers are required to either sign the Individual Committer Agreement that stipulates all of their contributions are their original work and are being contributed under the project license; or work on behalf of an Eclipse Member organization that has signed a Member Committer and Contributor Agreement to ensure the intellectual property rights of the organization are contributed under the project license. The second step is that the source code related to all contributions which are developed outside of the Eclipse Foundation Development Process is vetted through the Eclipse Foundation third-party content due diligence process. This process includes analyzing selected code contributions to ascertain license compatibility with the project license. Contributions that contain code licensed under licenses that are not compatible with the project license are screened out through this approval process and thus not added to an Eclipse project. The end result is a level of confidence that Eclipse open source projects release technology that can be safely distributed in commercial products. Ecosystem Development and Marketing The Eclipse Foundation's vendor-neutral ecosystem development and marketing programs promote community and membership growth, drive awareness and discoverability of projects and working groups, and increase the commercial adoption of Eclipse technologies. The Eclipse Foundation coordinates and implements a variety of activities, including content creation, press and analyst relations, community conferences and events, advertising, social media management, and other programs to promote the entire Eclipse community and increase engagement. Find out more about the marketing services provided by the Foundation. Development Community Support The Eclipse community has a well-earned reputation for providing quality software in a reliable and predictable fashion. This is due to the commitment of the committers and organizations contributing to the open source projects. The Eclipse Foundation also provides services and support for the projects to help them achieve these goals. The Foundation staff help open source project teams implement the Eclipse Foundation's intellectual property due diligence process, the Eclipse Foundation Development Process and—for those projects that are building specifications—the Eclipse Foundation Specification Process. These processes assist new project startup and ensure that all Eclipse projects are run in an open, transparent, and meritocratic manner. As part of this process, the Foundation organizes member community reviews for projects to ensure consistent interaction between the projects and the broader membership. IT Infrastructure The Eclipse Foundation manages the IT infrastructure for the Eclipse open source community, including Git code repositories and code review tools, bug trackers, Jenkins build farm, development-oriented mailing lists and forums, download site and website. The infrastructure is designed to provide reliable and scalable service for the committers developing the Eclipse technology and the consumers who use the technology. About Us Foundation Members & Supporters Our Members Corporate Sponsors In-Kind Supporters Services IP Management Ecosystem Development Development Process IT Infrastructure Marketing Services Our Team Eclipse Foundation Staff Contact Us Careers Governance Board of Directors Board of Directors Elections Councils Annual Report Governance Documents Meeting Minutes Our Brand Logos and Artwork Eclipse Foundation Brand Guidelines Trademark Usage Guidelines Writing Style Guide Announcements Press Releases PR Guidelines 2006 Archive 2001-2005 Archive"
