full_description = "Back to TC49TC49-TG2C#ScopeActivitiesScope: To standardize the syntax and semantics of a modern, component-based, general purpose, object oriented, and type-safe programming language called C# (pronounced C sharp). Programme of work: To develop C# language standards. Upon completion of item 1, to investigate the future direction of C# standards, and to evaluate and consider proposals for complementary or additional technology. To establish and maintain liaison with other Ecma TCs and with other Standards Development Organisations (SDOs) as appropriate to facilitate and promulgate the work of the TG. Microsoft Visual C# Version Corresponding Ecma Standard Corresponding ISO/IEC Standard V1 ECMA-334:2003 ISO/IEC 23270:2003 V2 ECMA-334:2006 ISO/IEC 23270:2006 V3 none none V4 none none V5 ECMA-334:2017 ISO/IEC 23270:2018 V6 ECMA-334:2022 none V7 ECMA-334:2023 ISO/IEC 20619:2023 (which includes by reference the latest edition of ECMA-334) Contacts: Convenor: Jon Skeet (Google) Secretaries: Rex Jaeschke (Microsoft) and Patrick Luthi (Ecma International)"
