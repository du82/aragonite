title = "Dr Istvan Sebestyen, Past Secretary General of Ecma, participated in a panel discussion and presented on the role of standards in Open Source at the Workshop about Open Source beyond 2020 - Ecma International"
description = "Geneva, 19 November 2019 Dr Istvan Sebestyen, Past Secretary General of Ecma, participated in a panel discussion and presented on the role of standards in Open Source at the Workshop about Open Source beyond 2020 – Powering a digital Europe. On 14-15 November 2019 in Brussels, the European Commission organized this workshop to analyse the […]"
full_description = "Back to the listDr Istvan Sebestyen, Past Secretary General of Ecma, participated in a panel discussion and presented on the role of standards in Open Source at the Workshop about Open Source beyond 202019.11.2019Geneva, 19 November 2019 Dr Istvan Sebestyen, Past Secretary General of Ecma, participated in a panel discussion and presented on the role of standards in Open Source at the Workshop about Open Source beyond 2020 – Powering a digital Europe. On 14-15 November 2019 in Brussels, the European Commission organized this workshop to analyse the future of Open Source Software and hardware. The workshop brought stakeholders together to discuss current challenges, opportunities, research & innovation and also economic and policy-making issues. The following questions were discussed during this workshop: Is Open Source development the next stage to be adopted by SDOs? To what extent a closer collaboration between standards and open source software development could increase efficiency of both? How can intellectual property regimes – applied by SDOs – influence the ability and motivation of open source communities to cooperate with them? Should there be a role for policy setting at EU level? What actions of the European Commission could maximize the positive impact of Open Source in the European economy? The answers are available in this presentation. For more information: please contact Patrick Luthi, Secretary General of Ecma International at media@ecma-international.org."
