["https://ecma-international.org/publications-and-standards/standards/ecma-109"]
title = "ECMA-109 - Ecma International"
description = "Declared noise emission values of information technology and telecommunications equipment"
full_description = "Back to the listECMA-109Declared noise emission values of information technology and telecommunications equipment10th edition, December 2020This Ecma Standard applies to information technology and telecommunications equipment. This Ecma Standard specifies: a) for a batch of equipment, the method for determining the following values: the declared mean A-weighted sound power level, LWA,m; the declared mean A-weighted emission sound pressure level, LpA,m; the statistical adder for verification, Kv; the statistical upper limit A-weighted sound power level, LWA,c; b) how acoustical and product information is to be published electronically or in hard-copy format in technical documents or other product literature supplied to users by the manufacturer or declarer; c) the method for verifying the noise emission values that are declared by the manufacturers or declarer. NOTE – The terms “manufacturer” and “declarer” are used in this Ecma standard to represent any entity that provides product noise emission information. For instance, a product supplier or importer who does not manufacture the hardware, but offers noise emissions information, is also referred to a manufacturer or a declarer as applicable, in Ecma Standard. The uniform methods in this Standard use the noise emission data obtained in accordance with ECMA‑74, and the declaration and verification procedures detailed in ISO 4871 and ISO 7574-4. The basic noise emission values to be declared are the declared mean A-weighted sound power level, LWA,m. Optionally, the declared mean A-weighted emission sound pressure level at the operator or bystander positions, LpA,m can be declared. These are arithmetic mean values based upon measurements on a random sample taken from the batch of equipment, in accordance with ECMA‑74. For verification purposes, an additional quantity is required to be declared: the statistical adder for verification, Kv. This is a quantity that is added to the declared mean A-weighted sound power level, LWA,m and used in the verification section of this Standard to provide a consistent and predictable probability of acceptance for the batch of equipment. The declared mean A-weighted sound power level for the batch of equipment permits comparison of noise emissions between different products and permits predictions of installation or work-place noise immission levels, as described in ECMA TR/27. Although the most useful quantity for calculating immission levels due to one or more sound sources is the A‑weighted sound power level of the individual source(s), the A‑weighted emission sound pressure level may also be useful in estimating the immission level in the immediate vicinity of an isolated piece of equipment. To avoid confusion between sound power levels and emission sound pressure levels, the declared mean A‑weighted sound power level, LWA,m is expressed in bels (B) and the declared mean A‑weighted emission sound pressure level, LpA,m is expressed in decibels (dB). Download this standardClassificationCategoryAcoustical emissionsSubcategoryNot availableTechnical CommitteeTC26ISO number9296ArchivesECMA-109, 1st edition, December 1985DownloadECMA-109, 2nd edition, December 1987DownloadECMA-109, 3rd edition, December 1992DownloadECMA-109, 4th edition, December 1996DownloadECMA-109, 5th edition, December 2010DownloadECMA-109, 6th edition, December 2012DownloadECMA-109, 7th edition, December 2016DownloadECMA-109, 8th edition, June 2019DownloadECMA-109, 9th edition, December 2019Download"
