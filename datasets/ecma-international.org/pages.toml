description = "Ecma International and Moddable are co-hosting a meetup on building Internet of Things products in JavaScript Geneva, 3 December 2019 Moddable and Ecma International are hosting a Scripts & Things meetup at DMM.make Akiba the evening of December 11. The meetup will feature demonstrations of many embedded system projects developed using standard JavaScript. The meetup […]"
full_description = "Back to the listA meetup by Ecma TC53 and Moddable on Wednesday 11 December 2019 Tokyo, Japan03.12.2019Ecma International and Moddable are co-hosting a meetup on building Internet of Things products in JavaScript Geneva, 3 December 2019 Moddable and Ecma International are hosting a Scripts & Things meetup at DMM.make Akiba the evening of December 11. The meetup will feature demonstrations of many embedded system projects developed using standard JavaScript. The meetup is for makers, developers, and hobbyists interested in learning about using JavaScript in their products and projects. The meetup is free to attend, but pre-registration is requested. Please see the invitation page for details. Ecma International is also hosting a seminar titled “A Modern Approach to Embedded Software” the morning of December 11 in Shinagawa. The seminar will introduce the work to standardize JavaScript for embedded systems. The seminar is for professional software developers, engineering managers, and product planners from companies building IoT products. The seminar is free to attend, but pre-registration is required."
