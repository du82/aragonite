["https://ecma-international.org/join-ecma"]
title = "Join Ecma - Ecma International"
description = "To participate regularly in Ecma TCs, organizations must join Ecma as a member (ordinary, associate, SME, SPC or NFP member)."
full_description = "Join Ecma All information about the Association, Technical Committees, publications, membership, etc. can be found in this website. Join Ecma All information about the Association, Technical Committees, publications, membership, etc. can be found in this website. Participation in Ecma groups by experts from non-member companies is possible at the invitation of the Ecma Secretary General, e.g. to become familiar with the working style. To participate regularly, organizations must join Ecma as a member. Ordinary members Organizations which have interest and experience in matters related to one or more Technical Committees of the Association : With the right to vote at the General Assembly Exert other exclusive rights defined in the By-laws and Rules Annual fee CHF 70’000.- Download the application document (.docx) Associate members Organizations which have interest and experience in matters related to one or more Technical Committees of the Association : Without the right to vote at the General Assembly Annual fee CHF 35’000.- Download the application document (.docx) SME members Small and Medium sized Enterprises which have similar interests as an associate member : Annual, global turnover of less than one hundred million Swiss Francs Annual fee CHF 17’500.- Download the application document (.docx) SPC members Small Private Companies or other legal for-profit organizations : No more than 25 employees Annual, global turnover of less than ten million Swiss Francs Annual fee CHF 3’500.- Download the application document (.docx) NFP members Non-profit-making (NFP) organizations can apply to become NFP members. Annual fee CHF 0.- Download the application document (.docx) How to apply Send your application letter to: Ecma International The Secretary General Rue du Rhône 114 CH-1204 Geneva Switzerland The application will then be submitted for vote to the nearest General Assembly meeting (June or December). In the meantime, during which the application is pending, representatives of the company may attend meetings of the TCs and TGs as guests. As soon as a formal application is received, the list of the forthcoming meetings of all Ecma TCs and TGs is provided. At the same time if you can indicate the names, address, phone numbers and email address of your experts, their names will be entered in the corresponding mailing lists. Technical Committees of Ecma and their Task Groups usually meet between twice and six to eight times a year depending on the nature and urgency of their subjects. Further information can be obtained by e-mail (helpdesk@ecma-international.org) or to Samina Husain, the Ecma Secretary General)."
