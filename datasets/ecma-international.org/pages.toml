["https://ecma-international.org/news/at-the-june-17-2015-ecma-general-assembly-in-montreux-ecma-408-3rd-edition-the-dart-programming-language-specification-has-been-adopted"]
title = "At the June 17, 2015 Ecma General Assembly in Montreux, ECMA-408 3rd edition - the Dart programming language specification - has been adopted - Ecma International"
description = "Geneva, 26 June 2015 Dart is an open-source programming language for building web, server, and mobile apps. On June 17, 2015 the 109th Ecma General Assembly approved the Standard ECMA-408 3rd edition “Dart Programming Language Specification”. This is the third edition of the Standard since work in Ecma’s TC52 started in early 2014 and we […]"
full_description = "Back to the listAt the June 17, 2015 Ecma General Assembly in Montreux, ECMA-408 3rd edition – the Dart programming language specification – has been adopted26.06.2015Geneva, 26 June 2015 Dart is an open-source programming language for building web, server, and mobile apps. On June 17, 2015 the 109th Ecma General Assembly approved the Standard ECMA-408 3rd edition “Dart Programming Language Specification”. This is the third edition of the Standard since work in Ecma’s TC52 started in early 2014 and we expect Dart to continue to evolve at this rapid pace. Mr. Anders Sandholm, the TC52 Chair, explained the new features to the Standard: “As for the third edition, the main additions are null-aware operators and generalized tear-offs. Null-aware operators potentially shortens syntax. E.g., we have introduced the “safe navigation” operator ?., which for o?.m returns null if o evaluates to null and returns o.m otherwise. With generalized tear-offs we have added explicit syntax (#) to allow closurization of not just methods but also constructors, operators, getters and setters.” ECMA-408 (Dart) is one of the Ecma Standards that has been developed under the new Royalty-Free (RF) patent policy regime. ECMA-408 is also a Standard that so far has been updated every 6 months. Such rapid development and approval are aiming to meet the marked demand of this popular web scripting language. For more information: please contact Dr. Istvan Sebestyen, Secretary General of Ecma International. Email: istvan@ecma-international.org."
