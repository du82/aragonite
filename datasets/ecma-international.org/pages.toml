["https://ecma-international.org/policies/by-ipr/ecma-text-copyright-policy"]
title = "Ecma text copyright policy - Ecma International"
full_description = "Ecma text copyright policy Version 2 (approved in March 2022) Purpose Ecma publishes specifications which must be covered by an Ecma copyright notice. An Ecma Technical Committee must use, for publishing their specifications, either the default Ecma copyright notice, or the Ecma alternative copyright notice and license after having requested and obtained GA approval to do so. Default copyright notice COPYRIGHT NOTICE © Ecma International By obtaining and/or copying this work, you (the licensee) agree that you have read, understood, and will comply with the following terms and conditions. This document may be copied, published and distributed to others, and certain derivative works of it may be prepared, copied, published, and distributed, in whole or in part, provided that the above copyright notice and this Copyright License and Disclaimer are included on all such copies and derivative works. The only derivative works that are permissible under this Copyright License and Disclaimer are: (i) works which incorporate all or portion of this document for the purpose of providing commentary or explanation (such as an annotated version of the document), (ii) works which incorporate all or portion of this document for the purpose of incorporating features that provide accessibility, (iii) translations of this document into languages other than English and into different formats and (iv) works by making use of this specification in standard conformant products by implementing (e.g. by copy and paste wholly or partly) the functionality therein. However, the content of this document itself may not be modified in any way, including by removing the copyright notice or references to Ecma International, except as required to translate it into languages other than English or into a different format. The official version of an Ecma International document is the English language version on the Ecma International website. In the event of discrepancies between a translated version and the official version, the official version shall govern. The limited permissions granted above are perpetual and will not be revoked by Ecma International or its successors or assigns. This document and the information contained herein is provided on an “AS IS” basis and ECMA INTERNATIONAL DISCLAIMS ALL WARRANTIES, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO ANY WARRANTY THAT THE USE OF THE INFORMATION HEREIN WILL NOT INFRINGE ANY OWNERSHIP RIGHTS OR ANY IMPLIED WARRANTIES OF MERCHANTABILITY OR FITNESS FOR A PARTICULAR PURPOSE. Alternative copyright notice ALTERNATIVE COPYRIGHT NOTICE AND COPYRIGHT LICENSE © Ecma International By obtaining and/or copying this work, you (the licensee) agree that you have read, understood, and will comply with the following terms and conditions. Permission under Ecma’s copyright to copy, modify, prepare derivative works of, and distribute this work, with or without modification, for any purpose and without fee or royalty is hereby granted, provided that you include the following on ALL copies of the work or portions thereof, including modifications: (i) The full text of this COPYRIGHT NOTICE AND COPYRIGHT LICENSE in a location viewable to users of the redistributed or derivative work. (ii) Any pre-existing intellectual property disclaimers, notices, or terms and conditions. If none exist, the Ecma alternative copyright notice should be included. (iii) Notice of any changes or modifications, through a copyright statement on the document such as “This document includes material copied from or derived from [title and URI of the Ecma document]. Copyright © Ecma International.” Disclaimers THIS WORK IS PROVIDED “AS IS,” AND COPYRIGHT HOLDERS MAKE NO REPRESENTATIONS OR WARRANTIES, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO, WARRANTIES OF MERCHANTABILITY OR FITNESS FOR ANY PARTICULAR PURPOSE OR THAT THE USE OF THE DOCUMENT WILL NOT INFRINGE ANY THIRD PARTY PATENTS, COPYRIGHTS, TRADEMARKS OR OTHER RIGHTS. COPYRIGHT HOLDERS WILL NOT BE LIABLE FOR ANY DIRECT, INDIRECT, SPECIAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF ANY USE OF THE DOCUMENT. The name and trademarks of copyright holders may NOT be used in advertising or publicity pertaining to the work without specific, written prior permission. Title to copyright in this work will at all times remain with copyright holders. Text copyright policy FAQ Where do these copyright texts come from? The Ecma default copyright notice is a typical copyright text that standardization organizations use, similar to those used by ISO, ITU, OASIS etc. When drafting this text it has been slightly adapted to Ecma’s requirements. This copyright notice has been included into every new Ecma standard and Technical report since 2009. However, we have not retrospectively inserted this copyright notice in the older standards. But in practice the same principle also applies to them. Standards produced by an Ecma Technical Committee also have the option to use the Ecma alternative text copyright notice and license, which is derived with modifications from the W3C Software and Document Notice and License. How much income does Ecma generate from its copyrights? Zero. Ecma International is a not-for-profit organization registered in Switzerland (since 1961). As such its income comes exclusively from membership fees. Also from the very beginning members have felt that the free of charge distribution of Ecma deliverables is an excellent promotion for its Standards and Technical Reports and allows better market penetration of its standards. What is the main objective of the Ecma text copyright policy (and the copyright notice(s))? Generally, it is important for Ecma that a standard has the option to remain stable,and to prevent forking of its content (i.e. changing it by a third party in a way that makes it believe that after the change it is still an Ecma standard). In this case, it would use the Ecma default copyright notice. Ecma may also choose to publish standards under an alternative copyright notice and license where, for example, doing so would facilitate alignment with the policies governing related third-party standards. Where can I get an Ecma Standard or Technical Report? You can get them free of charge at the Ecma Website. Can I republish the Ecma deliverables? Yes, but for deliverables published under the Ecma default copyright notice it is required that they are published unchanged, and up to date. However, in practice Ecma prefers if the Ecma standards are downloaded, free of charge, from the Ecma website. That is always the authentic copy of the standard, and the download figures help Ecma to follow how many standards were downloaded and where from. For deliverables published under the Ecma alternative copyright notice and license, any republication must comply with the terms and conditions as described in the alternative copyright notice and license. Does Ecma store any information on those who download Ecma standards? No. Privacy of the users of the Ecma standard is very important to Ecma. The only statistics we are getting – with the help of Google Analytics – are about how often a Standard or Technical Report has been downloaded and from which country or region. This allows Ecma to get a kind of feedback about how many Ecma standards are downloaded (so e.g. how popular they are) and where these requests come from. Can I copy text from an Ecma International standard and put in as “comment” in my software implementation? Yes, you can under the terms of for both Ecma default and alternative copyright text notices. Ecma regards this as “fair use”, though it understands that “fair use” might be understood differently in different countries. In such case you just insert the text unchanged and you reference the precise source (where this text has been taken from, e.g., Standard reference or number, version, URL.). Note that when appropriate, the copyright page of recent Ecma standards also includes a BSD software license that covers all parts of the standard that are software source code or pseudo-code. Those portions of such standards may be copied under the terms of that license, just like any other BSD licensed software. Can I copy text from an Ecma International standard and put e.g. in a book on the history of a certain standardization? Yes, you can under the terms of for both Ecma default and alternative copyright text notices. Ecma regards this also as a “fair use” case, though it understands that “fair use” might be understood differently in different countries. There might be many other “fair use” cases, not covered here. In case of doubt, it is best to ask the Ecma Secretariat. Does Ecma International lose its copyrights on an Ecma Standard if it submits it to another SDO for approval (such as “fast-track to ISO/IEC JTC 1)? No. In such a case Ecma does not lose its copyright while the other SDO establishes its copyright: the copyright is not transferred to the other SDO. In such a case Ecma keeps its own copyright, but permits the other SDO to establish its own copyright on the submitted and approved standard as well. In order to avoid any confusion in the market, when maintaining or further developing the standard, both standards (the Ecma one and the SDO one) have to be kept in synchronization. This is the general practice, and happens very frequently. Does a contributor to an Ecma standard lose its copyrights if its contribution gets fully or partly incorporated into an Ecma Standard? No. In such a case, in a manner similar to the case above, the contributor does not lose its copyright while Ecma establishes its own copyright: the copyright is not transferred to Ecma. In such a case the original contributor keeps its own copyright (and can do whatever else it wants to do with his contribution), but permits Ecma to use the contribution in the standardization process and eventually also in the approved standard, where Ecma establishes its own copyright to the Standard as a whole. My question was not answered (fully or partly) by this FAQ. Where can I get more information? It is best to contact the Ecma Secretariat: Ecma International Rue du Rhône 114 Ch-1204 Geneva Switzerland Email: helpdesk@ecma-international.org The previous Ecma International text copyright policy (June 2009) is available in PDF file. Geneva, 24 March 2022"
year_published = 2025
year_updated = 2024
