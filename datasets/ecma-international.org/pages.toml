description = "File structure and labelling of magnetic tapes for the interchange of information between users of information processing systems"
full_description = "Back to the listECMA-13File structure and labelling of magnetic tapes for information interchange4th edition, December 1985This Ecma Standard specifies the file structure and the labelling of magnetic tapes for the interchange of information between users of information processing systems. This Ecma Standard specifies the volume and file structure, and the basic characteristics of the blocks containing the records constituting the file. It also specifies the recorded labels to identify files, file sections and volume of magnetic tapes. It also specifies four nested levels of interchange. Furthermore, this Ecma Standard specifies requirements for the processes which are provided within information processing systems, to enable information to be interchanged between different systems, utilizing recorded magnetic tape as the medium of interchange. For this purpose it specifies the functions to be provided within systems which are intended to originate or receive magnetic tape volumes which conform to this Ecma Standard. Download this standardClassificationCategoryData presentationSubcategoryLabelling, volume and file structureTechnical CommitteeTC15 (this TC is no longer active)ISO number1001ArchivesECMA-13, 1st edition, November 1967DownloadECMA-13, 2nd edition, August 1973DownloadECMA-13, 3rd edition, January 1978Download"
