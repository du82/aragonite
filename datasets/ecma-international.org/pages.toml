title = "ECMA-119 - Ecma International"
description = "Volume and file structure of CDROM for information interchange - Interchange of information between users of information processing systems"
full_description = "Back to the listECMA-119Volume and file structure of CDROM for information interchange5th edition, December 2024This Ecma standard specifies the volume and file structure of compact disc read-only memory (CD-ROM) for the interchange of information between users of information processing systems. This standard specifies: the attributes of the volume and the descriptors recorded on it; the relationship among volumes of a volume set; the placement of the files; the attributes of the files; record structures intended for use in the input or output data streams of an application program when such data streams are required to be organized as sets of records; three nested levels of medium interchange; two nested levels of implementation; requirements for the processes which are provided within information processing systems, to enable information to be interchanged between different systems, utilizing recorded CD-ROM as the medium of interchange; for this purpose, this Ecma Standard specifies the functions to be provided within systems which are intended to originate or receive CD-ROM which conform to this Ecma Standard. Download this standardClassificationCategoryData presentationSubcategoryLabelling, volume and file structureTechnical CommitteeTC31ISO number9660ArchivesECMA-119, 1st edition, December 1986DownloadECMA-119, 2nd edition, December 1987DownloadECMA-119, 3rd edition, December 2017DownloadECMA-119, 4th edition, June 2019Download"
