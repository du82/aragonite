description = "To develop and maintain standards and technical reports for acoustic instrumentation. Acoustic instrumentation includes but is not limited to data acquisition (DAQ) modules, which record digital acoustic signals, may read information from microphones, along with other capabilities, and are distinct from sound level meters."
full_description = "Back to TC26TC26-TG5Modular acoustic data acquisition systemsScopeScope: To develop and maintain standards and technical reports for acoustic instrumentation. Acoustic instrumentation includes but is not limited to data acquisition (DAQ) modules, which record digital acoustic signals, may read information from microphones, along with other capabilities, and are distinct from sound level meters. Programme of work: To consider data acquisition, microphone, and related sensor technologies. To stay abreast of related standards including but not limited to sound level meters (such as IEC 61672 and IEC 61183), octave-band and fractional-octave-band (such as IEC 61260), and measurement microphones (such as IEC 61094). To maintain liaison with ISO TC 43/SC 1 “Noise”. To monitor technological developments in acoustic instrumentation including data acquisition modules. To develop recommendations, e.g. standards on acoustic instrumentation including data acquisition modules. Contacts: Convenor: vacant Secretary: Charles Oppenheimer (Ecma International)"
