["https://www.ecma-international.org/about-ecma/areas-of-work"]
title = "Areas of work - Ecma International"
description = "Ecma International areas of work such as hardware, software, IoT, programming languages, media storage and environmental subjects"
full_description = "Areas of work Development and publication of Standards and Technical Reports for Information & Communication Technology and Consumer Electronics. Broad scope of standardization topics including hardware, software, communications, consumer electronics, IoT, programming languages, media storage and environmental subjects. Areas of work Development and publication of Standards and Technical Reports for Information & Communication Technology and Consumer Electronics. Broad scope of standardization topics including hardware, software, communications, consumer electronics, IoT, programming languages, media storage and environmental subjects. Languages A programming language is a vocabulary and set of grammatical rules for instructing a computer or computing device to perform specific tasks. Languages are developed by TC39 (ECMAScript®), TC49 (C#, CLI, Eiffel, etc.) and TC52 (Dart). Presentation of ECMAScript® Presentation on C# Presentation on CLI Near field communication Near Field Communication (NFC) is a short-range wireless connectivity standard (ECMA-340, ISO/IEC 18092) that uses magnetic field induction to enable communication between devices when they’re touched together, or brought within a few centimeters of each other. Presentation White paper Office open XML formats Office Open XML (also informally known as OOXML or Microsoft Open XML (MOX)) is a XML-based file format developed by Microsoft for representing spreadsheets, charts, presentations and word processing documents. A standard based on OOXML was developed by TC45 to foster interoperability across office productivity applications. Presentation White paper Multimedia coding and communications Standards in the field of multimedia coding and communications such as architecture, service, protocol, interface, compatibility, management, media coding and applications aspects. Standards developed by TC32 include Computer Supported Telecommunications Applications (CSTA), architecture, service and protocol aspects of narrowband and broadband Private Integrated Services Networks (PISNs), IP-based multimedia communications in a business environment, including interoperability of narrowband and broadband PISNs with IP networks, and scalable spatial audio (S5-Coding). Presentation Standards for VoIP in the enterprise"
