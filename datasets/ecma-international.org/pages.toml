["https://ecma-international.org/technical-committees/tc56"]
title = "TC56 - Ecma International"
description = "Natural language interaction protocol for communication with Artificial Intelligence (AI) agents"
full_description = "Back to the list TC56Natural language interaction protocol for communication with Artificial Intelligence (AI) agentsGeneralActivitiesScope: The TC specifies a common protocol, framework and interfaces for interactions between AI agents using natural language while supporting multiple modalities. The framework for communication will include non-AI systems (e.g. clients on phones or hand-held devices without access to Large Language Models (LLMs)) talking to AI-agents (using generative AI, LLMs or traditional AI models), as well as interaction between two or more AI agents. The framework will specify conventions and best practices for end-points to enable secure and efficient implementations of the protocol. To aid in achieving these objective, TC56 operates under the Royalty-Free Patent Policy. Programme of work: To develop and maintain Standards and Technical Reports for a protocol for inter-agent communication. To develop and maintain best practices for end-point implementations of the protocol. To monitor related standardization activities to avoid duplication, to promote synergies and to promote complementary efforts via internal and external liaisons with – and contribute to – the work of international SDOs. Contacts: Chair: Dinesh Verma (IBM) Vice-Chair: Elisa Bertino (Purdue University) Secretaries: Patrick Luthi (Ecma International) and Luyi Xing (Indiana University)"
