["https://ecma-international.org/policies/by-ipr/ecma-international-policy-on-submission-inclusion-and-licensing-of-software"]
title = "Ecma International policy on submission, inclusion and licensing of software - Ecma International"
full_description = "Ecma International policy on submission, inclusion and licensing of software This Ecma International policy on submission, inclusion and licensing of software (“policy”) has been implemented first on an experimental basis to address specific issues which have arisen and are arising in TC39. After five years of positive experience this policy is extended to Ecma International as a whole. Ecma International policy on submission, inclusion and licensing of software This Ecma International policy on submission, inclusion and licensing of software (“policy”) has been implemented first on an experimental basis to address specific issues which have arisen and are arising in TC39. After five years of positive experience this policy is extended to Ecma International as a whole. Purpose The purpose of this policy is to provide guidance, rules and procedures relating to the submission, inclusion and licensing of software that is proposed to be part of an Ecma International Standard.[1] Software in standards may require different copyright licenses than descriptive text in standards. Ecma International owns and licenses the copyright in its Standards via the Ecma International copyright disclaimer (“copyright disclaimer”). While the copyright disclaimer permits anyone to copy a Standard, it does not permit others to modify the Standard (except in limited circumstances) or extract portions of the Standard. Therefore, if a Standard includes software alone or in combination with descriptive text, the permissions granted by the copyright disclaimer may be inadequate. For example, the copyright disclaimer does not include a grant which would allow the copying and modification of example software from the remainder of a Standard in order to run the example on an actual implementation of the Standard. Individual and collaboratively developed submissions The guidance, rules and procedures described herein are applicable to both submissions of software by individual submitters and submissions of software that is developed collaboratively by two or more submitters. Policy 1.1 Definitions For purposes of the policy “software” means imperative or declarative programming instructions in a formally defined language that can be processed by hardware that manipulates data according to such programming instructions. Pseudo code (defined below) is also considered software under this policy.[2] Software may be normative or non-normative. Software is normative software where it is required to be implemented in products or services which implement the Standard. Software is non-normative software where it is not required to be implemented in products or services which implement the Standard. Non-normative software may include example implementations, software for diagnostic or conformance testing, etc. Pseudo code or descriptive code means code that is human readable and similar to programming languages but that cannot be directly processed by hardware that manipulates data according to instructions. 1.2 Guidelines and rules Ecma International strongly believes that an Ecma International Standard should define requirements and not mandate any specific implementation. This gives implementers the opportunity to differentiate their implementations which, in turn, encourages innovation. Since normative software may, in effect, mandate an implementation, the use of normative software in Ecma International Standards should be limited to situations where it is necessary to enable interoperability. Ecma International has no objection to the inclusion of non-normative software in Ecma International Standards. Text contributions included in an Ecma International Standard or Technical Report are licensed by the contributor to Ecma International. The contributor of the text contribution continues to own the copyright in its contribution and Ecma International owns the copyright in the collective work. Software contributions included in an Ecma International Standard or Technical Report are treated the same way. Contributors of the software continue to own the copyrights in their software contributions and Ecma International owns, and has the right to enforce, the copyright in the collective work (e.g., the Ecma International Standard that incorporates all text and software contributions). Accordingly, if software is included in an Ecma International Standard, copyrights in such software must be licensed to Ecma International (at the time the Standard in which it is incorporated becomes a final Ecma International Standard) under a broad license which shall give Ecma International the right to make the software available pursuant to the copyright license set forth on exhibit A (“license”). Patent claims on the software that are required to implement the Standard are subject to the Ecma International Code of Conduct in patent matters. See the Ecma Code of Conduct in patent matters for information regarding the licensing of patent claims that are required to implement Ecma International standards. 1.3 Procedures In the event a TC desires to include software in an Ecma International Standard, the following procedure shall apply. (1) Software submissions are accepted only when submitted with a properly completed software submitter contribution form (see exhibit B) or its equivalent presented on an Ecma International authorized website (including, but not limited to the Ecma International own website). Only one software submitter contribution form is required to be completed by each software submitter for each Standard to which a software submitter makes a software submission and applies to all subsequent software submissions to that Standard (even if the software submitter makes multiple software submissions with respect to that Standard). Each party to a joint software submission must complete a software submitter contribution form (2) Ecma will provide a license to the software pursuant to the software license set forth on exhibit A if the software is incorporated in an Ecma International Standard. (3) The following legend or notice, together with the license, will be prominently displayed on any Ecma International Standard in which software is included: “SOFTWARE, AS DEFINED IN THE ECMA INTERNATIONAL POLICY ON SUBMISSION, INCLUSION AND LICENSING OF SOFTWARE AVAILABLE AT [https://www.ecma-international.org/ipr] (“POLICY”), WHICH IS INCLUDED IN AN ECMA INTERNATIONAL STANDARD SHALL BE MADE AVAILABLE PURSUANT TO THE LICENSE SET FORTH IN EXHIBIT A (“LICENSE”) OF THE POLICY. EXHIBIT A The <> is protected by copyright and is being made available under the “BSD license”, included below. No patent license is granted, nor is a patent license commitment made, by implication, estoppel or otherwise by Ecma International or any member of Ecma International. This software may also be subject to third party rights (rights from parties other than Ecma International or Ecma International members), including patent rights, and no licenses under such third party rights are granted. SEE THE ECMA CODE OF CONDUCT IN PATENT MATTERS AVAILABLE AT [https://www.ecma-international.org/ipr] FOR INFORMATION REGARDING THE LICENSING OF PATENT CLAIMS OWNED BY ECMA INTERNATIONAL MEMBERS THAT ARE REQUIRED TO IMPLEMENT ECMA INTERNATIONAL STANDARDS.* Copyright © <> <> All rights reserved. Redistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met: 1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer. 2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution. 3. Neither the name of the authors nor Ecma International may be used to endorse or promote products derived from this software without specific prior written p