full_description = "Mission Ecma develops and publishes international standards for the information and communication industry. Mission Ecma develops and publishes international standards for the information and communication industry. 60 plus years of standardization Since 1961 and continuing in full force today, Ecma International facilitates the timely creation of a wide range of global Information and Communications Technology (ICT) and Consumer Electronics (CE) standards. More about our history Link to: OrganisationA non-profit organisation Ecma International is a Swiss based not-for-profit association officially established on 17 May 1961. It is headquartered in Geneva to be near the headquarters of other standards developing organizations such as the International Electrotechnical Commission (IEC), the International Organization for Standardization (ISO) and the International Telecommunication Union (ITU). More about our organisation Link to: MembersDriven by industry Ecma brings together industry and technology experts from around the world to work together in the development of standards in a contribution-driven, consensus-based approach. More about our members Link to: Areas of workA large scope of activities Broad scope of standardization topics including hardware, software, communications, consumer electronics, IoT, programming languages, media storage, environmental subjects, etc. More about our activities Download the Ecma International presentation This presentation describes the standardization process at Ecma, its membership, the relation with other standards development organizations and more. Standardization at Ecma"
