["https://ecma-international.org/policies/rules"]
title = "Ecma Rules - Ecma International"
description = "These regulations describe the structure of the Association, the operating procedures, memberships and collaboration liaison relationships."
full_description = "Ecma Rules (August 2024) These regulations describe the structure of the Association, the operating procedures, memberships and collaboration liaison relationships. Ecma Rules (August 2024) These regulations describe the structure of the Association, the operating procedures, memberships and collaboration liaison relationships. Download in PDF Art 1. Language The English language, as written in the United Kingdom, shall be the official language of the Association. Art 2. System of measurement The metric system of measurement according to ISO 1000 and the International System of Units (SI) according to ISO 31 shall be used. Art 3. Representation of company members Each company member shall appoint one of its officers or executives who shall represent this member in General Assemblies and who shall have full authority to commit the member on all matters listed in the agenda of the General Assembly. Company members shall notify the Association of any changes in their representation. Each company member may appoint one alternate representative. Art 4. Communication with the members and use of electronic means 4.1 Communications between Ecma and its members may be made by letter, email or any other suitable electronic means. 4.2 The meetings of the different Ecma committees other than the General Assembly, may be held through electronic means. For due conduct of virtual or hybrid meetings the following criteria shall be met: Access to the meeting platform is available to the participants and operational; The identity of the participants is clearly established; The oral contributions of each participant are directly transmitted; Each participant can participate in the debate; Technical or procedural means are used to ensure that the votes, if any, cannot be falsified. The participants bear the risk of a technical issue occurring at their own premises, such as hardware or software problems or problems with the internet connection. 4.3 The different Ecma committees other than the General Assembly may also discuss matters and take decisions by circular emails or by any other suitable electronic means, provided that all members of that committee duly take part to the discussions and have sufficient time to express their position before a decision is taken. 4.4 If a technical issue arises during one of these virtual or hybrid meetings with the result that the meeting cannot be duly conducted to its end , the decisions that have been taken before the technical issue remain valid. The remaining part of the meeting and votes, if any, may take place through an exchange of emails or any other suitable electronic means, provided that all participants can sufficiently express their opinion before a decision is taken, and unless a member requires that another meeting is held for the remaining part of the discussions."
