title = "Members - Ecma International"
description = "The Association consists of Company members, (i.e., ordinary, associate, SME, SPC members) and not-for-profit (NFP) members."
full_description = "Members The Association consists of Company members, (i.e., ordinary, associate, SME, SPC members) and not-for-profit (NFP) members. Members The Association consists of Company members, (i.e., ordinary, associate, SME, SPC members) and not-for-profit (NFP) members. Ordinary members Ordinary members are companies which have interest and experience in matters related to one or more Technical Committees of the Association, and which wish to exert the right to vote at the General Assembly and to exert other exclusive rights defined in the By-laws and Rules. Associate members Associate members are companies which have interest and experience in matters related to one or more of the Technical Committees of the Association but without the right to vote in the General Assembly. SME Members Small and Medium-sized Enterprise are companies which have similar interests as an associate member and a global, annual, turnover of less than Swiss Francs 100’000’000.-. SPC members Small Private Companies are companies or other legal for-profit organizations with no more than 25 employees and a global, annual, turnover of less than Swiss Francs 10’000’000.-. NFP members NFP members are non-profit-making organizations. If an NFP is an organization with several organizations as members, then normally it can only become an NFP member in Ecma if its members do not qualify for Company membership in Ecma."
