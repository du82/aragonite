nd protocol aspects of narrowband and broadband Private Integrated Services Networks (PISNs), IP-based multimedia communications in a business environment, including interoperability of narrowband and broadband PISNs with IP networks, and scalable spatial audio (S5-Coding). Presentation Standards for VoIP in the enterprise"
