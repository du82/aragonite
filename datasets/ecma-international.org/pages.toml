full_description = "Back to the list TC12Product safetyGeneralActivitiesPublished StandardsScope: To consider national and international safety regulations to establish appropriate safety standards for information technology equipment so that they are intrinsically safe and safe for operating and maintenance personnel. Programme of work: To survey existing national and international standards and recommendations concerned with safety requirements. To study the safety requirements associated with power control and distribution and establish recommendations where appropriate. To consider short circuit and overcurrent protection, earthing, voltage exposure limits, mechanical design, etc., and establish recommendations where appropriate. To develop principles and guidance to identify safeguards. To investigate functional safety aspects. TC20 handles EMF, which is a safety subject, because of their electromagnetic expertise. To assume responsibility for the maintenance of Ecma Standards prepared by TC12. To establish and maintain liaison with other standards organizations in order to present Ecma proposals to them and to make comments on their proposals. Contacts: Chair: vacant Secretary: Patrick Luthi (Ecma International)"
