title = "ECMA-106 - Ecma International"
description = "Private Telecommunication Networks (PTN) - Signalling protocol at the S reference point - Circuit mode basic services (SSIG-BC)"
full_description = "Back to the listECMA-106Private Telecommunication Networks (PTN) - Signalling protocol at the S reference point - Circuit mode basic services (SSIG-BC)3rd edition, December 1993This Standard defines the Layer 3 protocol for signalling for the support of circuit-mode bearer services (used either on their own or in support of teleservices) at an interface at the S reference point between a Terminal Equipment (TE) and a Private Telecommunication Network (PTN). The S reference point is defined in ENV 41004. This Standard is based upon ETS 300 102-1, which defines the equivalent protocol for the T and coincident T and S reference points between a user and a public ISDN. Many of the clauses of ETS 300 102-1 are incorporated by reference. Any reference in the text of ETS 300 102-1 to annex D of that document are not applicable to this Standard. Annex F contains information on terminal interchangeability between PTNs and public ISDNs. This Standard is applicable to basic and primary rate accesses of PTNXs and to TEs that are intended for connection to such accesses. The conveyance of non-standardized (e.g. manufacturer-specific) information in messages is outside the scope of this Standard. Download this standardClassificationCategoryData communication – PISNSubcategoryPISNTechnical CommitteeTC32ETSI numberETS 300 192 ArchivesECMA-106, 1st edition, September 1985DownloadECMA-106, 2nd edition, June 1991Download"
