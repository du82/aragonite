["https://ecma-international.org/news/call-for-participation-royalty-free-animated-jpeg-standardization-proposal"]
title = "Call for participation Royalty-Free Animated JPEG Standardization Proposal - Ecma International"
description = "Call for participation Royalty-Free Animated JPEG Standardization Proposal The Ecma International is planning to launch a standardization project on animated JPEG-1 pictures. This standard will be an extension to the popular standard of JPEG (ITU-T T.81¦ISO/IEC 10918-1) on the analogy of animated GIFs. At present JPEG-1 does not offer that functionality yet, which is particularly […]"
full_description = "Back to the listCall for participation Royalty-Free Animated JPEG Standardization Proposal04.05.2018Call for participation Royalty-Free Animated JPEG Standardization Proposal The Ecma International is planning to launch a standardization project on animated JPEG-1 pictures. This standard will be an extension to the popular standard of JPEG (ITU-T T.81¦ISO/IEC 10918-1) on the analogy of animated GIFs. At present JPEG-1 does not offer that functionality yet, which is particularly popular on pictures taken by smart mobile phones. The proposed topic and architecture was originally presented to the JPEG Committee in 2016. Though it has received general support for the idea, due to resource problems the work could not be carried out there. Therefore it is proposed here to create a joint independent group called “aJPEG Alliance” of Ecma, ISO/IEC and ITU experts that would work as a Royalty Free Task Group (RFTG) with the Ecma working methods and rules under an Ecma TC. The so developed specification can be picked up then by any of the above SDOs for formal approval as their own standard. More about the project Call for participation Royalty-Free Animated JPEG Standardization Proposal. For more information: please contact Dr. Istvan Sebestyen, Secretary General of Ecma International. Email: istvan@ecma-international.org."
