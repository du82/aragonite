full_description = "Privacy policy This privacy policy describes the procedures of how we collect, use, protect or otherwise handle your personal data. Privacy policy This privacy policy describes the procedures of how we collect, use, protect or otherwise handle your personal data. Collection of information We only collect personally identifiable information that is required for the purposes pursued. Your personal data is processed in the context of providing our services and website functionalities. Such information may be directly communicated by you (e.g. when you use the forms on our site, take part in our activities or contact us) or automatically received from your device, such as your IP address, your browser type, your browser version, the page you request and other diagnostic data. Use of information Any information we collect from you may be used to: Personalise your experience and meet your individual needs Improve our site Improve the user experience Contact you by email Confidentiality of information Your personal information will not be sold, exchanged, transferred, or given to another company for any reason, without your consent. When you contact Ecma International by means of an electronic form, the data you transmit will be kept solely for the purpose of processing your request. Disclosure to third parties We do not sell, trade, or otherwise transfer your personally identifiable information to third parties. This does not include trusted third parties who assist us in operating our website or conducting our business, as long as those parties agree to keep this information private and secure. Protection of information We implement a variety of security measures to safeguard the security of your personal information. We use encryption to protect sensitive information transmitted online. We also protect your information offline. Computers and servers used to store personally identifiable information are kept in a secure environment. Contact us If you 