full_description = "Back to the listECMA-108Determination of high-frequency sound power levels emitted by information technology and telecommunications equipment6th edition, December 2016This Standard ECMA‑108 specifies four methods for the determination of the sound power levels of high-frequency noise emitted by information technology and telecommunications equipment in the frequency range covered by the octave band centred at 16 kHz, which includes frequencies between 11,2 kHz and 22,4 kHz. They are complementary to the methods described in Standard ECMA‑74, ISO 3741 and ISO 3744. The first three methods are based on the reverberation test room technique. The fourth method makes use of a free field over a reflecting plane. The test conditions which prescribe the installation and operation of the equipment are those specified in ECMA-74. Download this standardClassificationCategoryAcoustical emissionsSubcategoryNot availableTechnical CommitteeTC26ISO number9295ArchivesECMA-108, 1st edition, December 1985DownloadECMA-108, 2nd edition, June 1989DownloadECMA-108, 3rd edition, December 1996DownloadECMA-108, 4th edition, December 2008DownloadECMA-108, 5th edition, December 2010Download"
