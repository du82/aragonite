["https://ecma-international.org/news/at-the-17-june-2015-ecma-general-assembly-in-montreux-ecma-published-1st-edition-of-access-systems-standards"]
title = "At the 17 June 2015 Ecma General Assembly in Montreux, Ecma published 1st edition of Access Systems standards - Ecma International"
description = "Geneva, 18 August 2015 On 17 June 2015, the 109th Ecma General Assembly approved the 1st edition of the ECMA-412 Standard on Access Systems. ECMA-412 specifies: an ID triggered modular access system, the functions of the modules and the messages they exchange, and the sequence of messages, i.e. transitions of the transaction; the system responsibility […]"
full_description = "Back to the listAt the 17 June 2015 Ecma General Assembly in Montreux, Ecma published 1st edition of Access Systems standards18.08.2015Geneva, 18 August 2015 On 17 June 2015, the 109th Ecma General Assembly approved the 1st edition of the ECMA-412 Standard on Access Systems. ECMA-412 specifies: an ID triggered modular access system, the functions of the modules and the messages they exchange, and the sequence of messages, i.e. transitions of the transaction; the system responsibility from receiving an access request until sending the result. i.e. a complete transaction; the responsibilities of the modules, including time stamping and responding to the requests they received; and the sequence and semantics of the messages and their elements. Technology for real-time access control is widely used for many situations such as entrance gate of facilities and service access control systems. Membership and settlement services also benefit from real-time access control systems connected via networks and using database information. Sophisticated cloud, virtualisation, database, networking technology and services and the evolution of authentication technology such as biometrics, NFC, QR codes used in distributed and modular access control systems enable previously underserved users and operators to innovate around new use cases. “This standard defines a common module architecture and the message exchanges between each module for various cloud, virtualization and other services,” said Kei Yamashita, Chairman of Ecma TC51 on Access Systems and General Manager of Optical Appliance Systems Research for Hitachi. “To apply this standard to such access systems, the expectation is that current access systems for particular services can easily expand their services to wider areas and also easily collaborate with various other service systems.” The plan is to submit the new ECMA-412 standard to ISO/IEC JTC 1 for approval as international standards under the ISO/IEC fast-track procedure."
year_published = 2015
