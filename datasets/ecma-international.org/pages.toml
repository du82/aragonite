["https://ecma-international.org/ecma-fellow-awards-and-ecma-recognition-awards"]
title = "Awards - Ecma International"
description = "The Ecma Fellow award honoured Donald Baines for his significant contributions to the development of Ecma acoustics standards. Donald Baines became the first Chair of TC26 when it was formed in 1980 and he served as either Chair or Vice-Chair for each of the 17 years he was a member of TC26 until his retirement in 1996. He was a co-author or significant contributor and editor or co-editor of every TC26 standard and technical report from 1980 to 1996. Donald Baines designed and then managed the ICL Acoustics Laboratory in Manchester, England from 1970s until his retirement in 1996."
full_description = "Awards The Ecma award program was established to recognize contributions by individuals to the development of standards and the benefit of the ICT and consumer electronics industries. The awards include the Ecma Fellow award and the Ecma recognition award. Awards The Ecma award program was established to recognize contributions by individuals to the development of standards and the benefit of the ICT and consumer electronics industries. The awards include the Ecma Fellow award and the Ecma recognition award. Ecma awards The awards include the Ecma Fellow award and the Ecma recognition award. Awards are granted by the Ecma General Assembly. Ecma Technical Committees may submit nominations to the General Assembly at any suitable time. Ecma Fellow award The Ecma Fellow award recognizes selected Ecma individuals who have served Ecma for a long time in an exceptionally outstanding fashion. Ecma grants those individuals the status of Ecma Fellow who, if they choose to, would be able at no cost continue to participate in Ecma work as Emeritus members. Awarded in 2019 Donald BainesThe Ecma Fellow award honoured Donald Baines for his significant contributions to the development of Ecma acoustics standards. Donald Baines became the first Chair of TC26 when it was formed in 1980 and he served as either Chair or Vice-Chair for each of the 17 years he was a member of TC26 until his retirement in 1996. He was a co-author or significant contributor and editor or co-editor of every TC26 standard and technical report from 1980 to 1996. Donald Baines designed and then managed the ICL Acoustics Laboratory in Manchester, England from 1970s until his retirement in 1996. Ecma InternationalKei YamashitaThe Ecma Fellow award honoured Kei Yamashita for his leadership and outstanding contributions to the development of Ecma standards. At Ecma, Kei Yamashita has a long and active participation in the work of TC17, TC31, TC38, TC44 and TC51, but also in the GA, CC (ExeCom), as a member of the management and as Chairman of several TCs. He made major contributions to the development of magnetic tape, optical disk and access systems standardization. He was President of Ecma between 2015 and 2017. His participation spread over 30 years. Today, he continues to participate and serves as Vice-President, Treasurer and Chairman of TC51. Kei Yamashita joined Hitachi’s Consumer Electronics Research Center in 1972 and progressed through several technical roles to the R&D Group Chief Architect Office when he retired in 2019. Kei Yamashita is a graduate of Keio University in Tokyo and received the prize of the Japanese Minister of Economy, Trade and Industry at the industrial standard awards ceremony in 2016. Ecma International"
