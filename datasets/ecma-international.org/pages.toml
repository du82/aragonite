full_description = "Back to the listECMA-1148-bit single-byte coded graphic character sets - Latin/Arabic alphabet2nd edition, December 2000This Ecma Standard specifies a set of 146 characters identified as the Arabic-Latin Alphabet and the coded representation of each of these characters by means of a single 8-bit byte. The implementation of this Standard will require the use of specific control functions due to the fact that languages using the Latin script are written from left to right and Arabic is written from right to left. In addition, statements expressed with one of the scripts may have to be included in text using the other script. Also the insertion of numerical values may require a specific treatment. The specification of the control functions to be used with the set of graphic characters of this Standard is outside the scope of this Standard. Download this standardClassificationCategoryData presentationSubcategoryCharacter sets and codingTechnical CommitteeTC1 (this TC is no longer active)ISO number8859-6ArchivesECMA-114, 1st edition, June 1986Download"
