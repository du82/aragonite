["https://ecma-international.org/publications-and-standards/standards/ecma-418"]
title = "ECMA-418 - Ecma International"
description = "Psychoacoustic metrics for ITT equipment – Part 1 (prominent discrete tones) and Part 2 (methods for describing human perception based on the Sottek Hearing Model)"
full_description = "Back to the listECMA-418Psychoacoustic metrics for ITT equipment3rd edition, December 2024This document describes two procedures for determining whether or not noise emissions contain prominent discrete tones: the tone-to-noise ratio method and the prominence ratio method (part 1). This standard describes a hearing model and psychoacoustic metrics dependent on the hearing model (part 2). Part 1 (prominent discrete tones) This Standard, ECMA-418-1 specifies two procedures for determining whether noise emissions of ITT equipment (see 4.1.1) under test contain prominent discrete tones: the tone-to-noise ratio method and the prominence ratio method. Discrete tones occurring at any frequency within the frequency range of interest (see 4.1.2) can be evaluated by the procedures in this Standard. All of the requirements of the test environment of ECMA-74:2022, 8.3 apply. However, for the purposes of this Standard, corrections neither for background noise, , nor for test environment, apply (see ECMA-74:2022, 8.7.1). NOTE 1 Since some ITT equipment emit discrete tones (see 4.2.2) in the 16 kHz octave band, the tone-to-noise ratio or the prominence ratio can be computed for these tones in accordance with the procedures in this Standard in an attempt to quantify their relative levels. However, the prominence criteria in either 11.5 or 12.6 cannot be applied, since there is no supporting psychoacoustical data on such high-frequency discrete tones. Declaration of product noise emissions in accordance with ECMA-109[1] offers the option of stating whether there are prominent discrete tones in the noise emissions of a product, as determined by ECMA-418-1. Other standards, or other noise test codes (see 4.1.3) relating to products besides ITT equipment, can also refer to ECMA-418-1 for the declaration of prominent discrete tones. For the purposes of such declarations, either the tone-to-noise ratio method or the prominence ratio method may be used, unless otherwise specified in the standard or noise test code (see 4.1.4, referencing document). NOTE 2 The tone-to-noise ratio method can prove to be more accurate for multiple tones in adjacent critical bands, for example when strong harmonics exist. The prominence ratio method can be more effective for multiple tones within the same critical band and is more readily automated to handle such cases. Part 2 (methods for describing human perception based on the Sottek Hearing Model) This standard describes the Sottek Hearing Model and psychoacoustic metrics dependent on the hearing model. The input to the hearing model are sound signals recorded using the procedures of ECMA-74. The hearing model expresses specific loudness [1]. Psychoacoustic models use the specific loudness to express the strength of any tonalities or roughness in the sound generated by Information Technology and Telecommunications (ITT) equipment. While developed for ITT equipment, the psychoacoustic methods of this standard may be relevant to other applications like automobiles, consumer appliances, etc. The tonality metric of this standard uses the auto-correlation function to describe causes of perceived tonality such as individual or multiple steady or time-varying discrete tones, individual or multiple spectrally elevated bands or slopes of noise, and combinations of these phenomena. A similar approach was published in 1998 to determine “pitch salience” [2]. The roughness metric presented in this standard uses a spectrum of the sound signal envelope, refined by a quadratic fit estimator, to describe roughness arising from sound signal envelope variations within a critical band at modulation rates between 20 and around 300 Hz. For steady sounds, roughness perception peaks at modulation rates of 70 Hz. The loudness metric of this standard uses a nonlinear combination of tonal and noise loudness calculated as intermediate results of the tonality algorithm to achieve a very good match of perceived loudness, especially for sounds with a subcritical bandwidth (sounds containing tonal and noise components). The two parts of the Standard are the following: Part 1 “Prominent discrete tones”, 3rd edition, December 2024 Part 2 “Methods for describing human perception based on the Sottek Hearing Model”, 3rd edition, December 2024 Download part 1 Download part 2ClassificationCategoryAcoustical emissionsSubcategoryNot availableTechnical CommitteeTC26ArchivesECMA-418-1, 1st edition, December 2020DownloadECMA-418-2, 1st edition, December 2020DownloadECMA-418-1, 2nd edition, December 2022DownloadECMA-418-2, 2nd edition, December 2022Download"
