full_description = "Back to the listEcma International has published its annual yearbook Ecma Memento 201726.01.2017Geneva, 26 January 2017 The Ecma International Secretariat is happy to announce that it has published its annual yearbook called Ecma Memento 2017. About the Ecma Mementos The Ecma Mementos are the Annual Report of Ecma International. They aim to provide comprehensive overview about the work of Ecma International, its working rules, its membership and so on. The first Ecma Memento was published as early as in 1962. Since then every year a new Ecma Memento has been published. The current and old Ecma Mementos can be downloaded here. Please note that three versions of the Memento exist. The version to be downloaded here is targeting the general public. That version does not include personal type of information, such as address information of technical experts. Ecma Members can access the full version of the Memento under the Pydio application (access here). In addition Ecma has published a few printed versions of the full version that is available on request from the Ecma Secretariat. For more information: please contact Dr. Istvan Sebestyen, Secretary General of Ecma International. Email: istvan@ecma-international.org."
