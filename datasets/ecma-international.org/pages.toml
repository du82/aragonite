["https://ecma-international.org/news/ecma-423_holographic_data_storage_disk"]
title = "Ecma new standard ECMA-423 on physical, optical and mechanical characteristics of a holographic data storage disk - Ecma International"
description = "Ecma published ECMA-423 on physical, optical and mechanical characteristics of a Holographic Data Storage Disk (HDSD)"
full_description = "Back to the listEcma new standard ECMA-423 on physical, optical and mechanical characteristics of a holographic data storage disk05.07.2023Ecma published on 27 June 2023 a new standard that specifies the physical, optical and mechanical characteristics of a Holographic Data Storage Disk (HDSD) that employs holographic recording to enable data interchange between disks. HDSD is 120 mm diameter holographic disk has a nominal capacity of 1 Tbyte. The holographic disk consists of a recording layer, a track for positioning at data recording and reading, a reflective layer, and a substrate arranged above and below to physically protect these layers. Two-dimensional digital data is recorded as a hologram with refractive index change (holographic fringe) in the volume of the recording layer of the disk by the interference between a signal beam modulated in two dimensions by a digital mirror device and a spherical reference beam. The recorded holograms are read by a spherical reference beam as data reading beam using the diffraction effect from the holograms. With the growing data usage, generated by large volumes of data in various fields and increasing communication speed, the market for digital data storage is rapidly expanding, including large-scale industrial data centers for IoT, big data, and cloud services, as well as cloud storage for personal use and personally managed storage. The market for data backup and archiving is also expanding. With a new hologram recording method, HDSD enables an efficient use of hologram recording resulting in a significant increase in storage and archiving capacity. ECMA-423 (Holographic Data Storage Disk (HDSD) – Capacity: 1 Tbyte per disk) was developed by Ecma Technical Committee 31 and is available free of charge from the Ecma International website. For more information: please contact Patrick Luthi, Secretary of Ecma TC31 at media@ecma-international.org."
year_published = 2023
year_updated = 2023
