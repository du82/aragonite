["https://ecma-international.org/publications-and-standards/standards/ecma-130"]
title = "ECMA-130 - Ecma International"
description = "Data interchange on read-only 120 mm optical data disks (CD-ROM) - For information interchange between information processing systems"
full_description = "Back to the listECMA-130Data interchange on read-only 120 mm optical data disks (CD-ROM)2nd edition, June 1996This Ecma Standard specifies the characteristics of 120 mm optical disks for information interchange between information processing systems and for information storage, called CD-ROM. The optical disk specified by this Standard is of the type in which the information is recorded before delivery to the user and can only be read from the disk. This Standard specifies: some definitions, the environments in which the characteristics of the disk shall be tested and the environments in which it shall be used and stored, the mechanical, physical and dimensional characteristics of the disk, the recording characteristics, the format of the tracks, the error-detecting and the error-correcting characters, and the coding of the information, the optical characteristics for reading the information. These characteristics are specified for tracks recorded with digital data. According to this Standard, a disk may also contain one or more tracks recorded with digital audio data. Such tracks shall be recorded according to IEC Publication 908. Download this standardClassificationCategoryData interchange – optical disks and cartridgesSubcategoryOptical disks and cartridgesTechnical CommitteeTC31ISO/IEC number10149ArchivesECMA-130, 1st edition, July 1988Download"
