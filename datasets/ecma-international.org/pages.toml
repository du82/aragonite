["https://ecma-international.org/technical-committees/tc45"]
title = "TC45 - Ecma International"
description = "Office Open XML formats"
full_description = "Back to the list TC45Office Open XML formatsGeneralActivitiesPublished StandardsScope: The initial goal of the Technical Committee was to produce a formal standard for office productivity applications within the Ecma International standards process, which is fully compatible with the Office Open XML Formats. The aim was to enable the implementation of the Office Open XML Formats by a wide set of tools and platforms in order to foster interoperability across office productivity applications and with line-of-business systems. Now that ISO/IEC JTC 1/SC 34/WG 4 has taken over the management of the Office Open XML work, the Technical Committee is responsible for assisting WG 4 with the ongoing maintenance and evolution of the standard. Programme of work: To Produce a formal Standard for office productivity documents which is fully compatible with the Office Open XML Formats This includes: Produce a standard which is fully compatible with the Office Open XML Formats, including full and comprehensive documentation of those formats in the style of an international standard, with particular attention given to enabling the implementation of the Office Open XML Formats by a wide set of tools and platforms in order to foster interoperability across office productivity applications and with line-of-business systems. Produce a comprehensive set of W3C XML Schemas for the Office Open XML Formats, with particular attention given to self documentation of the schemas and testing of the XSDs for validation using a wide variety of XSD tools of the market and cross platform. To contribute the Ecma Office Open XML Formats standards to ISO/IEC JTC 1 for approval and adoption by ISO and IEC. Upon completion of the previous Items, the role of the Technical Committee will be: To assume responsibility for maintaining the Ecma Office Open XML standard To evaluate and consider proposals for complementary or additional technology To assume responsibility for the evolution of the Ecma standard while ensuring backward compatibility with the previous versions to guarantee continuity in the use of the current and future formats To establish and maintain liaison with other Ecma TCs and with other Standards Development Organizations (SDOs) as appropriate to facilitate and promulgate the work of the TC. Contacts: Chair: John Haug (Microsoft) Vice-Chair: vacant Secretary: Patrick Luthi (Ecma International)"
