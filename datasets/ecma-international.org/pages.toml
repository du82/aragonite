["https://ecma-international.org/policies/by-laws"]
title = "Ecma By-laws - Ecma International"
description = "Ecma By-laws. These regulations aim to guide the work of the organization and the members of Ecma International."
full_description = "Ecma By-laws (August 2024) These regulations aim to guide the work of the organization and the members. Ecma By-laws (August 2024) These regulations aim to guide the work of the organization and the members. Download in PDF Art. 1 Constitution and Head Office 1.1 Ecma International – further called Ecma – is an international industry association based in Europe, and has been constituted according to these By-laws and Articles 60 et seq. of the Swiss Civil Code. 1.2 The Headquarters of the Association is in Geneva. Art. 2 Purpose 2.1 The purpose of the Association is to develop, in co-operation with the appropriate national, European and international organizations as a scientific endeavour and in the general interest standards and technical reports in the fields of information and communications technologies and to publish them free of charge. 2.2 The Association shall be a non-profit-making organization and shall devote itself to no commercial activity whatsoever. Art. 3 Membership 3.1 The Association shall consist of the following classes of Ecma members: a) Companies – ordinary members – associate members – Small and Medium sized Enterprises members (SME) – Small Private Companies members (SPC) b) Not-For-Profit organizations members (NFP) Any other class of members shall be determined by the General Assembly with a two thirds majority of all ordinary members. 3.2 a) For non-SPC members: A proposed company member shall not be accepted if it holds at least 50 per cent of the capital of an existing company member nor if at least 50 per cent of its capital is held by an existing company member. b) For SPC members: A proposed SPC member shall not be accepted if it holds at least 50 per cent of the capital of an existing company member nor if at least 35 per cent of its capital is held by an existing company member. 3.3 a) For non-SPC members: No two or more companies where at least 50 per cent of whose capital is held by the same company, which is not a company member itself, may be company members but shall be represented by one of these companies only. b) For SPC members: No two or more SPCs where at least 35 per cent of whose capital is held by the same company, which is not a company member itself, may be SPC members but shall be represented by one of these SPCs only. 3.4 Additional classes of Ecma members established according to Article 3.1 shall have such qualifications and be entitled to such rights and privileges and have such obligations as shall be determined by the General Assembly with a two thirds majority of all the ordinary members. 3.5 Companies shall be admitted to any class of company membership in accordance with Art. 4. 3.6 Membership fees for all classes of company membership are decided by the General Assembly with a two thirds majority of all ordinary members. 3.7 Ecma membership shall be terminated in the cases set out in Art. 5. 3.8 Ordinary members 3.8.1 Ordinary membership may be applied for by a company which has interest and experience in matters related to one or more Technical Committees of the Association, and which wishes to exert the right to vote at the General Assembly and to exert other exclusive rights defined in the By-laws and Rules, such as serving on the Executive Committee and as Chair of a Technical Committee. 3.8.2 The principal representative of each ordinary member, or in the principal representative’s absence, its alternate representative, will have one vote in the General Assembly. Voting rights may be exerted with effect from the first full month upon admission as Ecma member. 3.9 Associate members 3.9.1 Associate membership may be applied for by a company which has interest and experience in matters related to one or more Technical Committees of the Association but without the right to vote in the General Assembly. 3.9.2 An associate member is fully entitled to participate in the work of Technical Committees and obtain all relevant papers. 3.9.3 Representatives of the associate members shall have the right to take part in the discussions of the General Assembly. 3.10 SME members 3.10.1 SME membership may be applied for by a company the annual turnover of which is less than Swiss Francs 100’000’000.-. 3.10.2 The rights of SME members are identical with those of associate members as specified in Art. 3.9. 3.11 SPC members 3.11.1 SPC membership may be applied for by an organization – a company or other legal for-profit organization – with no more than 25 employees and a global annual turnover of less than Swiss Francs 10’000’000.-. 3.11.2 The rights of SPC members are identical with those of associate members as specified in Art. 3.9, with the exception that an SPC member is only entitled to participate in one TC. 3.12 NFP members 3.12.1 Annual NFP membership may be applied for by a non-profit-making organization. Further yearly extensions of an NFP membership are possible, via application to the Secretary General by November of each year for the following year. 3.12.2 An NFP member is entitled to participate in the work of Technical Committees and may observe the discussion at the General Assembly."
year_published = 2025
year_updated = 2024
