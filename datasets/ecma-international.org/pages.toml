full_description = "Organisation The General Assembly consists of the Ecma ordinary members and is the highest authority of the Association. It controls the Association, its Management and its Secretariat. Organisation The General Assembly consists of the Ecma ordinary members and is the highest authority of the Association. It controls the Association, its Management and its Secretariat. General Assembly The General Assembly consists of the Ecma ordinary members and is the highest authority of the Association. It controls the Association, its Management and its Secretariat. Executive Commitee The Executive Committee makes recommendations to the General Assembly regarding business, legal and managerial matters and regarding the formation, activities, reorganization or dissolution of Technical Committees. It consists of individuals elected annually by the General Assembly. Technical Committees and Task Groups Technical work is carried out by Technical Committees (TCs) and Task Groups (TGs). A Technical Committee or a Task Group addresses a particular area or topic. Ecma members are encouraged to participate in the work of TCs and TGs. See dedicated section Related Organizations Ecma has co-operation arrangements or liaisons with several Related Organizations, or parts thereof. For example: Ecma has a Category A liaison with ISO/IEC JTC 1."
