title = "ECMA-125 - Ecma International"
description = "Data interchange on 90 mm flexible disk cartridges using MFM recording at 15 916 ftprad on 80 tracks on each side - ISO type 302"
full_description = "Back to the listECMA-125Data interchange on 90 mm flexible disk cartridges using MFM recording at 15 916 ftprad on 80 tracks on each side - ISO type 3021st edition, December 1987This Ecma Standard specifies the characteristics of 90 mm flexible disk cartridges recorded at 15 916 ftprad using modified frequency modulation recording, on 80 tracks on each side – ISO Type 302. It specifies the mechanical, physical and magnetic characteristics of the cartridge, so as to provide physical interchangeability between data processing systems. It also specifies the method of recording, the quality of the recorded signals, the track layout and the track format. Together with the labelling scheme of Standard ECMA-107, this Standard provides for full data interchange between data processing systems. Download this standardClassificationCategoryData interchange and archiving by physical mediaSubcategoryFlexible disk cartridgesTechnical CommitteeTC19 (this TC is no longer active)ISO number9529"
