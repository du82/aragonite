["https://ecma-international.org/publications-and-standards/standards/ecma-74"]
title = "ECMA-74 - Ecma International"
description = "Measurement of airborne noise emitted by information technology and telecommunications equipment - A Standard for measuring and reporting noise emission"
full_description = "Back to the listECMA-74Measurement of Airborne Noise emitted by Information Technology and Telecommunications Equipment20th edition, December 2022This Ecma Standard specifies procedures for measuring and reporting the noise emission of information technology and telecommunications equipment. NOTE 1 This Standard is considered part of a noise test code (see 3.1.2) for this type of equipment, and is based on basic noise emission standards (see 3.1.1) ISO 3741, ISO 3744, ISO 3745 and ISO 11201. The basic emission quantity is the A‑weighted sound power level which can be used for comparing equipment of the same type but from different manufacturers, or for comparing different equipment. Three basic noise emission standards for determination of the sound power levels are specified in this Ecma Standard in order to avoid undue restriction on existing facilities and experience. ISO 3741 specifies comparison measurements in a reverberation test room; ISO 3744 and ISO 3745 specify measurements in an essentially free field over a reflecting plane. Any one of these three basic noise emission standards can be selected and used exclusively in accordance with this Standard when determining sound power levels of a machine. The A‑weighted sound power level is supplemented by the A‑weighted emission sound pressure level determined at the operator position or the bystander positions, based on the basic noise emission standard ISO 11201. This sound pressure level is not a worker’s noise immission at a work station (see 3.2.12), but it can assist in identifying any potential problems that could cause annoyance, activity interference or hearing damage to operators and bystanders. Method for determination of whether the noise emission includes prominent discrete tones is specified in Annex D. Annexes G and H reference psychoacoustic methods described in ECMA-418-2 on the identification and evaluation of prominent tonalities and prominent roughness generated by information technology and telecommunications equipment This Standard is suitable for type tests and provides methods for manufacturers and testing laboratories to obtain comparable results. The methods specified in this Standard allow the determination of noise emission levels for a functional unit (see 3.1.4) tested individually. The procedures apply to equipment which emits broad-band noise, narrow-band noise and noise which contains discrete-frequency components, or impulsive noise. The sound power levels and emission sound pressure levels obtained can serve noise emission declaration and comparison purposes (see ECMA‑109). NOTE 2 The sound power levels and emission sound pressure levels obtained are not intended to be considered as installation noise immission levels; however they can be used for installation planning (see ECMA TR/27). If sound power levels obtained are determined for a number of functional units of the same production series, they can be used to determine a statistical value for that production series (see ECMA‑109). Download this standardClassificationCategoryAcoustical emissionsSubcategoryNot availableTechnical CommitteeTC26ISO number7779ArchivesECMA-74, 1st edition, September 1981No file availableECMA-74, 2nd edition, December 1987DownloadECMA-74, 3rd edition, December 1992DownloadECMA-74, 4th edition, December 1996DownloadECMA-74, 5th edition, December 1997DownloadECMA-74, 6th edition, December 1999DownloadECMA-74, 7th edition, December 2002DownloadECMA-74, 8th edition, December 2003DownloadECMA-74, 9th edition, December 2005DownloadECMA-74, 10th edition, December 2008DownloadECMA-74, 11th edition, December 2010DownloadECMA-74, 12th edition, December 2012DownloadECMA-74, 13th edition, June 2015DownloadECMA-74, 14th edition, December 2017DownloadECMA-74, 15th edition, June 2018DownloadECMA-74, 16th edition, June 2019DownloadECMA-74, 17th edition, December 2019DownloadECMA-74, 18th edition, June 2021DownloadECMA-74, 19th edition, December 2021Download"
