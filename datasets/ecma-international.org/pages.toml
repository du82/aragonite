["https://ecma-international.org/technical-committees/tc46"]
title = "TC46 - Ecma International"
description = "Open XML Paper Specification (OpenXPS®)"
full_description = "Back to the list TC46Open XML Paper Specification (OpenXPS®)GeneralActivitiesPublished StandardsIntroduction: TC46 was set up in June of 2007 to develop a standard based on the Open XML Paper Specification (OpenXPS). Scope: The goal of the Technical Committee is to produce a formal standard for an XML-based electronic paper format and XML-based page description language which is consistent with existing implementations of the format called the Open XML Paper Specification (OpenXPS). The Technical Committee will use the format called the Open XML Paper Specification (OpenXPS) as a starting point with the aim to provide a standard, secure, and highly trustworthy format that enables a wide set of applications, devices, tools and platforms to implement compatible paginated-document workflows. An additional goal will be to enable the interoperability of independently created software and hardware systems that produce, consume or otherwise process XPS content. The Technical Committee will be responsible for the ongoing maintenance and evolution of the standard. Programme of work: Produce a formal standard for an XML-based electronic paper format and XML-based page description language which is consistent with existing implementations of the format called the Open XML Paper Specification, including: Produce a fully documented and unambiguous standard for an XML-based electronic paper format and page description language. Produce appropriate W3C XML Schemas to enable automatic verification of files written to the standard. Enable interoperability between existing industry implementations of applications, devices, tools and platforms. Assume responsibility for the ongoing maintenance and evolution of this Ecma International standard. Support backwards compatibility with implementations targeted to prior versions of the standard. Evaluate and consider proposal for complementary or related additional technologies. Establish and maintain liaison with other Ecma TCs and with other Standards Setting Organizations (SSOs) as appropriate to facilitate and promulgate the work of the TC. Evaluate and consider contributing the Ecma standard to an ISO and/or IEC TC for approval and adoption. Contacts: Chair: vacant Vice-Chair: vacant Secretary: Patrick Luthi (Ecma International) OpenXPS® is the registered trademark of Ecma International."
