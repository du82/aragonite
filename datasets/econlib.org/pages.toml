description = """
The Kids Are… Different
\t\t\t\t\t\tBy Arnold Kling
\t\t\t\t\t\tAlong with the direct impacts of technology, individualism and a slower life trajectory are the key trends that define the generations of the 20th and 21st centuries. ——Jean M. Twenge, Generations,1 p. 8 Jean Twenge has assembled a wealth of information about how the attitudes, behaviors, health, and economic circumstances of Americans have changed over .. MORE"""
full_description = "From the dawn of civilization, societies have wrestled with the balance between order and liberty. Nations rise and fall based on how they manage power—whether through the centralized control of empires or the dispersed authority of free markets and individual rights. The United States was founded on the radical idea that the government exists to .. MORE For the same reason we don't call a sales tax a tariff, despite those resulting in people sometimes crossing county borders to get a cheaper deal. A VAT, like a sales tax, applies for everything.. President Trump recently proposed a “gold card” aimed at high net worth immigrants, which would sell for $5 million. Tyler Cowen has an article in Bloomberg that discusses the pros and cons of this proposal: It’s a good idea, both from the standpoint of government revenue and for wealthy prospective immigrants. But the US would .. MORE According to the International Property Rights Index, prepared by the Property Rights Alliance, Colombia ranks 80th out of 125 countries. While this result reflects some progress in the protection of property rights compared to nations with less institutional development, it also highlights significant challenges. Factors such as corruption, legal insecurity, and weak protection of intellectual .. MORE In a recent interview with Canadian psychologist Jordan B. Peterson, Conservative Party leader Pierre Poilievre noted some important facts about Canadian oil. The whole 11-minute interview is worth watching. Some highlights: 4:10: The nature of the Canadian trade surplus. “Yes, it is a ripoff. Canada is ripping itself off.” 4:25: Canada’s entire trade surplus .. MORE Two years ago, a bright-eyed student stepped off a plane from Melbourne after a 17-hour flight to the United States, excited to begin a college journey in a new country. He had never been to the USA before and was ready to deal with whatever tribulations studying in a foreign country had in store. However, .. MORE Consider the market for aluminum and the general tariff of 25% that the US administration has planned to impose on all American importers of this metal starting March 12 (compared to a current tariff of 10% that hits fewer aluminum products and exempts some countries including Canada and Mexico). A very good starting point for .. MORE"
