full_description = "Compound Rates of Growth In the modern version of an old legend, an investment banker asks to be paid by placing one penny on the first square of a chessboard, two pennies on the second square, four on the third, etc. If the banker had asked that only the white squares be used, the initial […] The Library of Economics and Liberty carries the popular Concise Encyclopedia of Economics, edited by David R. Henderson. This highly acclaimed economics encyclopedia was first published in 1993 under the title The Fortune Encyclopedia of Economics. It features easy-to-read articles by over 150 top economists, including Nobel Prize winners, over 80 biographies of famous economists, and many tables and charts illustrating economics in action. With David R. Henderson’s permission and encouragement, the Econlib edition of this work includes links, additions, and corrections. Economic analysis of advertising dates to the 1930s and 1940s, when critics attacked it as a monopolistic and wasteful practice. Defenders soon emerged who argued that advertising promotes competition and lowers the costs of providing information to consumers and distributing goods. Today, most economists side with the defenders most of the time. Advertising comes in […] The U.S. welfare system would be an unlikely model for anyone designing a welfare system from scratch. The dozens of programs that make up the “system” have different (sometimes competing) goals, inconsistent rules, and over-lapping groups of beneficiaries. Responsibility for administering the various programs is spread throughout the executive branch of the federal government and […] From 1989 to 1991, communism foundered throughout the former Soviet bloc in Europe and Asia. From Prague to Vladivostok, twenty-eight countries in the former Soviet Union and Eastern Europe abandoned similar political and economic systems.1 The Collapse of the Socialist System At the end of communism, all these countries were experiencing great economic problems. The […]"
