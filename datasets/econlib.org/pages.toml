full_description = "Capitalism, Government, and the Good Society 0 Categories: Symposia and Panel Discussions , SHARE POST: On April 10, 2013, Liberty Fund and Butler University sponsored a symposium, “Capitalism, Government, and the Good Society.” The evening began with solo presentations by the three participants–Michael Munger of Duke University, Robert Skidelsky of the University of Warwick, and Richard Epstein of New York University. (Travel complications forced the fourth invited participant, James Galbraith of the University of Texas, to cancel.) Each speaker gave his own interpretation of the appropriate role for government in the economy and in our lives. This was followed by a lively conversation on the topic moderated by Russ Roberts of Stanford University, host of the weekly podcast, EconTalk. Additional materials, including an audio file, transcript, and links for further reading, are available at http://www.econtalk.org/archives/2013/09/capitalism_gove.html RELATED CONTENT Russ Roberts and Michael Munger on How Adam Smith Can Change Your Life EconTalk host Russ Roberts is interviewed by long-time EconTalk guest Michael Munger about Russ's new book, How Adam Smith Can Change Your Life: An Unexpected Guide to Human Nature and Happiness. Topics discussed include how economists view human motivation and consumer behavior, the role of conscience and self-interest in acts of kindness, and the costs and benefits of judging others. The conversation closes with a discussion of how Smith can help us understand villains in movies. Read This Article RELATED CONTENT Russ Roberts and Michael Munger on How Adam Smith Can Change Your Life EconTalk host Russ Roberts is interviewed by long-time EconTalk guest Michael Munger about Russ's new book, How Adam Smith Can Change Your Life: An Unexpected Guide to Human Nature and Happiness. Topics discussed include how economists view human motivation and consumer behavior, the role of conscience and self-interest in acts of kindness, and the costs and benefits of judging others. The conversation closes with a discussion of how Smith can help us understand villains in movies. Read This Article"
