full_description = "“For Minogue, the fundamental source of freedom is individual moral responsibility.” The Servile Mind: How Democracy Erodes the Moral Life,1 the last book by the late Kenneth Minogue, examines libertarian issues from a pessimistic, conservative perspective. Elsewhere, I have suggested that libertarians focus on freedom versus coercion, while conservatives focus on civilization versus barbarism.2 Minogue .. MORE Features Editor Russell Roberts recently spoke with N. Greg Mankiw of Harvard University who just finished a two year stint as head of President’s Council of Economic Advisers. Here is the text of the interview. “If you’ve watched the TV show the “West Wing” you get the sense that all important decisions are made as .. MORE The result of the Brexit referendum held on June 23, 2016, whereby the United Kingdom voted to leave the European Union, took most pundits by surprise. This was not so with me, I must say, perhaps because I am an old hand at British affairs. I even bet on the result and made some little .. MORE Under what conditions does technology improve prosperity? Mass unemployment and deepening inequality are not new concerns, but the emergence of artificial intelligence has prompted great thinkers like Daron Acemoglu to suggest norms of engagement to optimize and equalize the benefits from technological change. On the other hand, Russ Roberts questions whether these conditions are necessary .. MORE Author and economist Branko Milanovic of CUNY talks about the big questions in economics with EconTalk host Russ Roberts. Milanovic argues that the Nobel Prize Committee is missing an opportunity to encourage more ambitious work by awarding the prize to economists tackling questions like the rise of China’s economy and other challenging but crucial areas .. MORE For the last 20 years that I taught at the Naval Postgraduate School, I always covered, in every course I taught, Friedrich Hayek’s famous 1945 article “The Use of Knowledge and Society,” American Economic Review, September 1945. It’s well worth reading. Russ Roberts’s recent EconTalk interview of Peter Boettke, “Who Won the Socialist Calculation Debate?,” .. MORE"
