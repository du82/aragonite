full_description = "Big Government on the Cheap: A Possible Lesson from the DCA Tragedy 0 Thomas Firey .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-avatar img { width: 80px !important; height: 80px !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-avatar img { border-radius: 50% !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-meta a { background-color: #655997 !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-meta a { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-meta a:hover { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_email-profile-data { background-color: #655997 !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_email-profile-data { border-radius: 100% !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_email-profile-data { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_email-profile-data:hover { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_url-profile-data { background-color: #655997 !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_url-profile-data { border-radius: 100% !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_url-profile-data { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-user_url-profile-data:hover { color: #ffffff !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-recent-posts-title { border-bottom-style: dotted !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-author-boxes-recent-posts-item { text-align: left !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-multiple-authors-boxes-li { border-style: none !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-multiple-authors-boxes-li { color: #3c434a !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .pp-multiple-authors-boxes-li { border-radius: px !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-category-wrap .ppma-category-group { margin-bottom: px !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-category-wrap .ppma-category-group { margin-right: px !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-category-wrap { font-size: px !important; } .pp-multiple-authors-boxes-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode .ppma-author-category-wrap .ppma-category-group-title { font-weight: !important; } .pp-multiple-authors-layout-inline ul.pp-multiple-authors-boxes-ul { display: flex; } .pp-multiple-authors-layout-inline ul.pp-multiple-authors-boxes-ul li { margin-right: 10px }.pp-multiple-authors-boxes-wrapper.pp-multiple-authors-wrapper.pp-multiple-authors-layout-inline.multiple-authors-target-shortcode.box-post-id-69046.box-instance-id-1.ppma_boxes_69046 ul li > div:nth-child(1) {flex: 1 !important;} Categories: Government Growth Politics and Economics By Thomas Firey, Feb 27 2025 SHARE POST: Last month’s horrifying aircraft collision at Reagan National Airport (DCA) has focused attention on air traffic control (ATC) staffing. According to press reports, the controller responsible for monitoring helicopter traffic had gone home that night, leaving that responsibility to a second controller responsible for “local traffic.” That apparently was not the only short-staffing in the DCA tower; at the time the passenger jet and helicopter collided, two controllers were doing the work of a team of four. Another bit of news: The previous night, a different passenger jet aborted landing at DCA because a helicopter was in its flight path, and there have been other recent incidents. That news will likely become more fodder in the Blue Team – Red Team fight, with Democrats criticizing the Trump administration for “strangling” the federal workforce and Republicans responding, Weren’t you just in charge of air traffic control and the rest of that workforce? They’ll both miss an important insight from the tragedy: the peril of Big Government on the cheap. If the double-duty controllers story proves correct (Christian Britschgi offers some reasons to be skeptical), then more controllers are needed—at the very least at Reagan National, if not more broadly.) But should they continue to be federal employees? And is danger higher if they are? After all, plenty of first-world countries have private air traffic control and airports with great safety and service records. That should gnaw at both Blue and Red Teams. Democrats typically want bigger government that provides more services, while Republicans—ostensibly—want smaller government at lower taxpayer cost. What we often get is government that tries to do a lot of stuff at low current tax rates—or, put another way, Big Government on the cheap (and with big deficits). Problem is, cheap often means poor quality. From ATC, to our soon-to-be-insolvent public pension system, to the tinderbox of public lands, and many more examples, plenty of America’s policy issues are at least partly the product of Big Government on the cheap. This isn’t the result of some twisted Red–Blue compromise. Lawmakers in both parties have considerable incentive to offer constituents plenty of services but then hold down (or hide) expenditures. The result is government that does lots of stuff, but often not well. DCA is a microcosm of this. For those who live outside the Beltway and are unfamiliar with the airport, it operates almost like a private airport for the political class. Despite its small size and congested location (which may also have contributed to the collision), it handles flights to an astounding number of places so that lawmakers can get themselves, their staffers, and special interests to and from their districts conveniently. The Wichita route that last week’s plane was flying had been added just last year at the behest of Kansas lawmakers. The result of all these politically motivated flights is a highly burdened government operation—Big Government on the cheap. This should give the Trump administration serious pause. Before the collision, the big news stories of that week were a pair of self-inflicted controversies over an Office of Management and Budget memo trying to freeze large portions of federal spending and an OMB email offering federal workers several months’ pay in exchange for their “deferred resignations.” (A similar email went out from OMB specifically to air traffic controllers the night after the collision.) Both are exercises in Big Government on the cheap: cutting money for responsibilities the federal government has taken on. If the administration truly wanted smaller government, it should be working with the (Republican-controlled) Congress to statutorily pare back federal responsibilities. Such policymaking is hard and requires political capital and consensus-building. It’s also something Trump—whatever his rhetoric—did not pursue in his first presidency. There is little reason to think that will change in his second. So, there will likely be more failures from Big Government on the cheap in the future. Hopefully, they will not be as tragic as last month. RELATED CONTENT By Fred L. Smith, Jr. and Braden Cox Airline Deregulation The 1978 Airline Deregulation Act partially shifted control over air travel from the political to the market sphere. The Civil Aeronautics Board (CAB), which had previously controlled entry, exit, and the pricing of airline services, as well as intercarrier agreements, mergers, and consumer issues, was phased out under the CAB Sunset Act and expired officially on December 31, 1984. The economic liberalization of air travel was part of a series of “deregulation” moves based on the growing rea... Read This Article"
