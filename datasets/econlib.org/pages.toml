ion has planned to impose on all American importers of this metal starting March 12 (compared to a current tariff of 10% that hits fewer aluminum products and exempts some countries including Canada and Mexico). A very good starting point for .. MORE Fiscal Policy What money? By Scott Sumner | Feb 27, 2025 I see a lot of discussion about what the government should do with the $1 trillion dollars that DOGE intends to save by reducing wasteful government spending. In fact, this is not a meaningful question, as even in the unlikely scenario where DOGE achieves $1 trillion in saving, there would be no money available to .. MORE Government Growth Big Government on the Cheap: A Possible Lesson from the DCA Tragedy By Thomas Firey | Feb 27, 2025 Last month’s horrifying aircraft collision at Reagan National Airport (DCA) has focused attention on air traffic control (ATC) staffing. According to press reports, the controller responsible for monitoring helicopter traffic had gone home that night, leaving that responsibility to a second controller responsible for “local traffic.” That apparently was not the only short-staffing in the .. MORE Austrian Economics Russ and Pete’s Excellent Adventure into the Socialist Calculation Debate By David Henderson | Feb 26, 2025 For the last 20 years that I taught at the Naval Postgraduate School, I always covered, in every course I taught, Friedrich Hayek’s famous 1945 article “The Use of Knowledge and Society,” American Economic Review, September 1945. It’s well worth reading. Russ Roberts’s recent EconTalk interview of Peter Boettke, “Who Won the Socialist Calculation Debate?,” .. MORE Labor Mobility, Immigration, Outsourcing The New York Times Pivots on Immigration By Scott Sumner | Feb 26, 2025 The New York Times has a very long piece on the issue of immigration. Here’s my version of a TLDR: Denmark has shown that an enlightened progressive government can preserve its welfare state by adopting fairly restrictive policies on immigration