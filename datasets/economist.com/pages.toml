ty—which is under surveillance by domestic spooks for suspected extremism—doubled its vote share from the previous election and received more votes than any hard-right group in the country since 1933. Not so long ago this would have been unthinkable in a stable, wealthy and moderate democracy in the heart of Europe. But over the past 15 years hard-right parties have made substantial gains across the region. Drawing on the work of political scientists, our analysis shows that they now make up Europe’s most popular family of political parties by vote share, beating out the conservative and social-democratic blocs for the first time in modern European history (see chart 1)..css-1h7zq19{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-align-items:flex-start;-webkit-box-align:flex-start;-ms-flex-align:flex-start;align-items:flex-start;margin:1.3125rem 0 2.1875rem 0;gap:var(--mb-spacing-sm);}@media (mi"
