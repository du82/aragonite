full_description = "Listen to Podcasts+Engaging conversations about global issues, business, China, American politics, technology and more. Get started with Economist Podcasts+.Daily and weeklyGlobal news | DAILYThe IntelligenceGain a fresh perspective on the events and trends shaping your world with our daily podcast.China | WEEKLYDrum TowerExplore the stories and issues at the heart of China with our correspondents.Business and finance | WEEKLYMoney TalksMake sense of the biggest stories in business, economics and the markets.US politics | WEEKLYChecks and BalanceStay ahead on American politics with in-depth discussions from our correspondents.Science and technology | WEEKLYBabbageLearn about the latest innovations and discoveries in science and technology.Global news | DAILYEditor’s PicksEnjoy a selection of articles read aloud from this week's issue of The Economist.Global news | DAILYThe World in BriefUnderstand what's on the global agenda with this daily news briefing.Special seriesBusiness | SERIESScam IncUncover a predatory, multi-billion-dollar industry emerging from the shadows.US politics | SERIESBoom!Discover how the generation born in the era of the bomb blew up American politics.India | SERIESThe Modi RajFind out how the world's most successful elected leader rose to power and how he is remaking India.Business | SERIESBoss ClassLearn how to be a better manager from CEOs who got to the top and experts who've studied them.China | SERIESThe PrinceUncover the real story of China's leader and his rise to the top in this eight-episode series.Russia | SERIESNext Year in MoscowUnderstand why the war in Ukraine began, how it might end and what the future holds for Russia.The archiveScience and technology | SERIESGamechangersJoin us to explore the people and stories behind game-changing ideas and innovations.Future | SERIESThe World AheadCatch a glimpse of the future as we examine an assortment of challenges facing the world.Future | SERIESFuturewatchGo behind the scenes of the future and meet the people who are building tomorrow's world.Covid | ARCHIVEDThe JabAnalysis of the science, data and politics behind the covid-19 jab as it happened.Science and technology | ARCHIVEDTo a Lesser DegreeA clear-eyed look at the technologies, the adaptation and the politics needed to address extreme climate change.Global news | ARCHIVEDThe Economist AsksOne question posed to a high-profile newsmaker, followed up with lively debate."
