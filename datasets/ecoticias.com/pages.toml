["https://www.ecoticias.com/co2/impunidad-quema-neumaticos-2015-rmd"]
title = "Impunidad por la ‘quema de 12.000 toneladas de neumáticos’ en 2015 por parte de RMD"
description = "Desde la plataforma Ecologistas en Acción han dejado muy claro que no comparten la absolución de la empresa Recuperación Materiales Diversos S.A., más"
full_description = "CO2 Instan a usar ‘inhaladores’ con ‘baja huella de carbono’ para reducir su impacto medioambiental 20 de febrero de 2025 CO2 El ‘Hospital de Manises’ implementa medidas de ‘eficiencia energética’ 18 de febrero de 2025 CO2 Proyecto MODHEATECH: acelerar la ‘descarbonización’ en la producción de acero 13 de febrero de 2025 De hecho, al respecto han declarado que lamentan que la jueza que llevó el caso y zanjó la cuestión absolviendo a RMD no haya tenido la sensibilidad que requiere la protección del medio ambiente y recuerdan que está científicamente comprobado el daño que este tipo de eventos puede ocasionar. Ardieron impunemente 12.000 toneladas de neumáticos Dice la jueza que no se ha probado que la contaminación producida supusiera un riesgo para el equilibrio del Medio Ambiente (MA). Sin embargo, la Audiencia Provincial dijo que no es necesario probar el daño, sino que basta con que el hecho valorado tenga la capacidad, “hipotética o potencialmente”, de someter a grave riesgo al medio natural. La combustión de neumáticos está ampliamente tipificada por organismos internacionales, como el Convenio de Basilea, la EPA (Agencia Americana del MA), que declaran que en ella se emiten dioxinas, furanos, bencenos, PCBs, etc., sustancias muy dañinas para las personas y el medio ambiente (cancerígenas, mutágenas…); con una agravante: que los daños al MA son muy difíciles de probar, pues sus efectos pueden aparecer a medio/largo plazo, siendo casi imposible, a posteriori, relacionar ciertas afecciones patológicas, en las personas, con el evento contaminante. Ello no supone que no se hayan producido. Caeríamos en la aberración de creer que lo que no se ve no existe. Pero, si la combustión al aire libre de 12.000 toneladas de neumáticos no afecta al Medio Ambiente, entonces… ¿a qué eventos más graves podríamos aplicar esa doctrina jurídica? Aunque no sea necesario probar el daño concreto, se aportó la analítica realizada por la Universidad de A Coruña, que constataba que la uva se había contaminado por PCBs efecto dioxina, muy tóxica; no ligeramente, como dijo la Junta, sino con 0,70 pg/gr, en la uva, multiplicando por 7 el “umbral de intervención” (0,10 pg/gr) que estipula la Recomendación 2013/711/UE de la Comisión Europea, y 1,4 pg/gr en la hierba (que pastan las ovejas), que lo multiplicaba por 14. Gravísimo. La Junta, por cierto, no aportó al sumario esta analítica de la Universidad de A Coruña. Se incorporó a petición de esta parte. ¿Ignorancia o mala fe? RMD dice, por ignorancia, o mala fe, que los mismos valores que se encontraron en el entorno de RMD en los días posteriores al incendio, “se hallaron en las mismas cantidades en zonas que no fueron afectadas por el accidente, por lo que no podían ser consecuencia de este”. Absolutamente falso. El muestreo que hizo la Junta en segunda instancia, cuarenta días después del primero, para ver si ya habían bajado los niveles, tanto en Calzada del Coto (hecho allí por primera vez), como cerca de la fábrica (repetición) constató que ambos ya daban niveles normales en la uva y la hierba (menos de 0,10 pg/gr). Los primeros, en agosto, al lado de la fábrica, son los que arrojaron niveles en extremo alarmantes. Y no podía ser contaminación de fondo (habitual en la zona) porque tales niveles, elevadísimos, hubieran sido una bomba ambiental, que no tenía ninguna causa de estar allí, salvo por el incendio. De hecho, según la Recomendación de la UE, que la Junta dice haber seguido, si se detecta contaminación superior a 0,10 pc/gr en PCBs efecto dioxina, “Los Estados Miembro deben investigar su procedencia y reducir esa contaminación”. La junta no investigó, y nada hizo, evidentemente porque dedujo que el causante de esa colosal elevación era el incendio, lo que la motivó a tomar nuevas muestras, obteniendo ya niveles más bajos, y dio por concluidas las actuaciones. Porque no había otras fuentes contaminantes, más que el propio incendio. Se valoraron informes sobre calidad del aire (RD 102/2011) aportados por Junta, y empresa, que no eran aplicables para este tipo de incendio, pues solo miden sustancias simples típicas del medio urbano, pero no las emanadas de un gran incendio de neumáticos, muy peligrosas, como reconoció en el juicio el propio Jaime Fernández Orcajo, Jefe del Servicio de Prevención Ambiental de la Junta. Necesitando el Decreto la superación de los índices en más de 35 ocasiones, por ejemplo, para declarar contaminación, y habiendo durado el incendio 18 días, se concluía que el aire emanado del incendio era de “calidad”. Además, dichos informes presentaban notables deficiencias metodológicas, como poner los medidores a barlovento (por donde llega el viento), como en Ardoncino o Antimio de Arriba, o colocar el medidor de bencenos el mismo día en que se extinguió el incendio, y midiendo 13 días tras el apagado, concluyen, artificiosamente, que no hubo emisión de ellas; lógico, sin combustión. Y otros anticientíficos. Aunque en el juicio fueron desvirtuadas por la Acusación (Ecologistas), fueron dados por válidos. La jueza se hace eco de una falsedad recogida en el Informe de la Junta: que toda el agua de extinción se recogió en dos tanques: una barbaridad. El Seprona declaró, y así lo recoge en sus Conclusiones: “Se constata que se ha originado un vertido al arroyo de Antimio procedente de las instalaciones de RMD como consecuencia de la utilización de agua para sofocar el fuego, la cual lleva incorporada diversas materias procedentes de la combustión de los neumáticos”. La jueza tampoco valora que la CHD sancionó a RMD por la contaminación de esas aguas, y obligó a RMD a limpiar casi 2 km de acequias de material sólido arrastrado. Todo esto, incluso vídeos, está incorporado en el Sumario, infructuosamente. La afección al Medio Ambiente es tan real como el incendio que la ocasionó En conclusión, y lo más determinante, circunscribir la posible afectación al Medio Ambiente, y las mediciones, solo al entorno de la fábrica, y valorar esa parte por el todo, es de necios. El penacho de humo, el día del incendio, ascendió unos 200 m y luego viajó en dirección este, dejando atrás la ciudad de León (hay fotos). Y así durante 18 días. Esos efluentes pueden haber viajado cientos de kilómetros y ejercer allí su efecto patógeno. Y eso es también Medio Ambiente, no solo el entorno de la fábrica. Luego, no puede aventurar la jueza que no hubo afectación a los recursos naturales; ¿de dónde? En otro orden, la Sentencia da como “hechos probados” que RMD vulneraba el Decreto 1619/2005 sobre almacenaje de neumáticos: apilamientos que superaban los 3 m permitidos (entre 4 y 7 m), y dos grandes montañas que excedían por mucho el volumen admitido (1000 m³), y al lado, una montaña (de 30x30x8m) de colchones, plásticos, cartones, textiles, aerosoles…, fácilmente inflamables, prohibido por dicho Decreto, donde con toda probabilidad se inició el fuego. Una precisión: La jueza no ha dicho que el incendio no fuera provocado, sino que “no se ha podido determinar las causas, pudiendo ser fortuito”. Al respecto, la Audiencia Provincial dice que la provocación del incendio no consiste solo en aplicar la cerilla, sino en crear las condiciones idóneas para que este se inicie y propague; fue el caso de RMD, al situar, al lado de los neumáticos, materiales de fácil inflamación. RMD es claramente responsable. Si hubiera cumplido la ley, no hubiera habido incendio de los neumáticos. Incluso lo dice el R. Decreto: “El titular de la instalación es responsable de los riesgos inducidos por aquella, entre los que, al menos, estarán incluidos los de incendio y vandalismo”. Pero no ha habido reproche penal alguno, ni por el delito de incendio ni contra el medio ambiente. Si para darse el de Incendio requiere que se ponga en peligro la integridad de las personas, a tal efecto, podría considerarse el “potencial” daño al medio ambiente (incluyendo a las personas) causado por las ingentes emisiones producidas, muy tóxicas, derivadas de una imprudencia grave: el almacenamiento ilegal, por el que se originó el incendio. A la vista de estas consideraciones, los Ecologistas valorarán si presenta Recurso de Apelación."
year_published = 2025
year_updated = 2025
