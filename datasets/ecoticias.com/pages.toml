tas conexiones externas no implicará ningún tipo de asociación, fusión o participación con las entidades conectadas. No obstante lo anterior, si AZOR PARTNERS SL tuviera conocimiento efectivo de que la actividad o la información a la se remite o recomienda es ilícita, o de que lesiona bienes o derechos de un tercero susceptibles de indemnización, se suprimirán dichos datos o se inutilizará el enlace correspondiente. 9. DERECHOS DE EXCLUSIÓN El Titular se reserva el derecho a denegar o retirar el acceso al portal y/o los servicios ofrecidos sin necesidad de advertencia previa, a instancia propia o de un tercero, a aquellos usuarios que incumplan el contenido de este aviso legal. 10. GENERALIDADES El Titular perseguirá el incumplimiento de las presentes condiciones así como cualquier utilización indebida de su portal ejerciendo todas las acciones civiles y penales que le puedan corresponder en derecho. 11. LEGISLACIÓN APLICABLE Y JURISDICCIÓN La relación entre el Titular y el Usuario se regirá por la normativa española vigente. Todas las disputas y reclamaciones derivadas de este aviso legal se resolverán por los juzgados y tribunales españoles del consumidor y usuario que resulten competentes. 12. MENORES DE EDAD Esta web dirige sus servicios a usuarios mayores de 18 años. Los menores de esta edad no están autorizados a utilizar nuestros servicios y no deberán, por tanto, enviarnos sus datos personales. Informamos de que si se da tal circunstancia, el Titular no se hace responsable de las posibles consecuencias que pudieran derivarse del incumplimiento del aviso que en esta misma cláusula se establece. 13. MEDIDAS DE SEGURIDAD – SSL El Titular ha contratado para su sitio web un certificado SSL («Secure Sockets Layer»). Dicho certificado SSL permite proteger toda la información personal y confidencial que se pueda manejar en un sitio web, independientemente de la información que se esté transmitiendo, como por ejemplo, desde cualquiera de los formularios de contacto del sitio web hasta el servidor o los datos introducidos para la suscripción de boletines de noticias, accesos a las áreas protegidas, etc. La dirección del sitio web aparecerá en color verde, activándose el protocolo “https” que permite conexiones seguras desde un servidor web al navegador del usuario. Última revisión 25 de Junio de 2024"
