["https://www.ecoticias.com/co2/rebuild-2025-madera-descarbonizacion"]
title = "REBUILD 2025: madera, el material que impulsa la 'descarbonización'"
description = "El carbono en la atmósfera es almacenado por los árboles o incluso en los suelos forestales a través de la fotosíntesis, transformando la energía luminosa en"
full_description = "CO2 Instan a usar ‘inhaladores’ con ‘baja huella de carbono’ para reducir su impacto medioambiental 20 de febrero de 2025 CO2 El ‘Hospital de Manises’ implementa medidas de ‘eficiencia energética’ 18 de febrero de 2025 CO2 Impunidad por la ‘quema de 12.000 toneladas de neumáticos’ en 2015 por parte de RMD 18 de febrero de 2025 CO2 Proyecto MODHEATECH: acelerar la ‘descarbonización’ en la producción de acero 13 de febrero de 2025 El carbono en la atmósfera es almacenado por los árboles o incluso en los suelos forestales a través de la fotosíntesis, transformando la energía luminosa en energía química que permitirá al árbol crecer a partir del agua y la materia orgánica que extrae del suelo. Esta reacción almacenará carbono en la madera y liberará oxígeno. (adsbygoogle = window.adsbygoogle || []).push({}); La madera puede ser explotada ya sea industrialmente, como materia prima o para obtener energía. La ecuación es entonces simple: si la superficie forestal aumenta, hay más almacenamiento de carbono debido al crecimiento del bosque, que liberación de carbono a través de la explotación de la madera. Estamos entonces en un círculo virtuoso. Madera sostenible para descarbonizar la economía La edificación se encuentra en el epicentro del debate público. El desafío de la falta de vivienda, junto con el apoyo reciente por parte de la administración de la construcción industrializada, están marcando las agendas a día de hoy. A ello, se le suman las iniciativas que están entrando en vigor para que el territorio comunitario sea cero emisiones en 2050, tal y como reza el Pacto Verde Europeo. En este contexto, se celebrará REBUILD 2025, el evento de referencia que trajo en España la industrialización de la edificación, que tendrá lugar del 23 al 25 de abril en IFEMA Madrid. Entre los aspectos que se tratarán, serán objeto de análisis los materiales circulares que se pueden incorporar en el modelo off site y que, del mismo modo, contribuyen significativamente a la descarbonización. Este es el caso de la madera, uno de los pocos materiales de construcción renovables y reciclables, que se ha convertido en el gran protagonista de la sostenibilidad. En este sentido, la madera puede absorber CO2 y su industrialización genera menos gases de efecto invernadero que otros materiales. De la misma manera, es una opción que contribuye a la eficiencia energética por su capacidad de conducción del calor, lo que la convierte en un aislante más efectivo y, en consecuencia, aporta más confort a los usuarios. Además, el material permite aumentar la velocidad de construcción al posibilitar el trabajo en seco, hecho que igualmente resulta más seguro para los trabajadores que la manipulan. Ante las posibilidades que se erigen de su uso en la edificación, España parte de una posición privilegiada por su vasta superficie forestal, con aproximadamente 26.300.000 hectáreas, siendo el segundo país de la Unión Europea con más área arbolada. Esto da pie a la aparición de un círculo virtuoso que aprovecha la oportunidad del material a escala nacional y la necesidad generalizada de más vivienda, y que sea menos contaminante. Para debatir las acciones que deben de estimular la construcción circular, REBUILD 2025 contará con expertos como Toni Escudé, arquitecto especializado en impacto ambiental; Xavier Aguiló, Director General Internacional de SOCOTEC; o Susana Martínez, Directora General del Grupo Siero, líderes en Europa en la fabricación de madera de castaño. Asimismo, Gonzalo Anguita, Director Ejecutivo en FSC España; Ana Belén Noriega, Directora General de PEFC España, organización que promueve y divulga la Gestión Forestal Sostenible; y Genoveva Canals, coordinadora de la Unión Empresarial de Madera y el Mueble de España, ahondarán en las estrategias que se pueden seguir para garantizar tanto el suministro como la protección de los bosques. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); Tags: CO2descarbonizaciónmaderaREBUILD 2025sostenibilidad"
