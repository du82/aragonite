["https://www.ecoticias.com/co2/rebuild-2025-parque-inmobiliario-cero-emisiones"]
title = "REBUILD 2025: un parque inmobiliario 'cero emisiones'"
description = "Uno de los retos que se barajarán en la próxima edición de REBUILD 2025 tiene que ver con el urbanismo sostenible. La idea es conseguir que el parque"
full_description = "CO2 Instan a usar ‘inhaladores’ con ‘baja huella de carbono’ para reducir su impacto medioambiental 20 de febrero de 2025 CO2 El ‘Hospital de Manises’ implementa medidas de ‘eficiencia energética’ 18 de febrero de 2025 CO2 Impunidad por la ‘quema de 12.000 toneladas de neumáticos’ en 2015 por parte de RMD 18 de febrero de 2025 CO2 Proyecto MODHEATECH: acelerar la ‘descarbonización’ en la producción de acero 13 de febrero de 2025 Uno de los retos que se barajarán en la próxima edición de REBUILD 2025 tiene que ver con el urbanismo sostenible. La idea es conseguir que el parque inmobiliario de España sea «cero emisiones». (adsbygoogle = window.adsbygoogle || []).push({}); La cumbre REBUILD tendrá lugar del 23 al 25 de abril y se celebrará en IFEMA Madrid. En el correr de la misma se analizarán las iniciativas europeas y nacionales que se estudian y se están implementando con el fin de que el sector sea climáticamente neutro en 2050. REBUILD en IFEMA Madrid La edificación está inmersa en un momento de transformación con el objetivo de dar respuesta a los grandes desafíos que tiene actualmente Europa. Uno de ellos, que se alza como máxima prioridad para las administraciones comunitarias, es la necesidad de ser cero emisiones para 2050, algo que se tiene que conseguir con el apoyo institucional, pero también privado por parte de los actores de las principales actividades económicas. Para ello, la Comisión Europea recientemente ha sacado adelante iniciativas con las que mitigar la huella de carbono en diferentes industrias, como la construcción. En este sentido, en el marco del Pacto Verde Europeo, el órgano ejecutivo de la UE ha impulsado la nueva Directiva de Eficiencia Energética (EPDB, por sus siglas en inglés), con la que busca reducir el impacto de CO2 con hitos temporales que empiezan a partir de 2026, cuando los edificios nuevos ocupados o gestionados por autoridades públicas tendrán que ser climáticamente neutros. Otra de las acciones que ha llevado a cabo es el nuevo Reglamento de Productos de Construcción, que entró en vigor este enero, y que tiene el objetivo de establecer unas normas sólidas para la comercialización de suministros para la edificación alineándose con el futuro circular del sector. El reglamento introduce el papel del pasaporte digital de producto, herramienta que facilita el acceso a información detallada sobre las características, rendimiento y conformidad de cada bien. Con este contexto, REBUILD 2025, el evento que trajo la edificación industrializada en España, y que tendrá lugar del 23 al 25 de marzo en IFEMA Madrid, será el espacio en el que se abordará la revolución sostenible que vive la construcción, cuestión que, igualmente, es uno de los ejes de la cumbre. Al respecto, más de 700 expertos se citarán en el Congreso Nacional de Arquitectura Avanzada y Construcción 4.0, el mayor foro de tendencias del sector que albergará REBUILD, los cuales ahondarán en las claves para convertir la industria, y su parque edificado, en activos neutros. ECOticias.com es Media Partner Oficial de REBUILD 2025. (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); Tags: 2025cero emisionesCO2parque inmobiliarioREBUILD"
