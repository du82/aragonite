["https://www.ecoticias.com/co2/inhaladores-baja-huella-carbono-impacto-medioambiental"]
title = "Instan a usar ‘inhaladores’ con ‘baja huella de carbono’ para reducir su impacto medioambiental"
description = "El Ministerio de Sanidad recomienda usar inhaladores con baja huella de carbono para reducir el impacto medioambiental. Inhaladores de polvo seco, de niebla"
full_description = "CO2 El ‘Hospital de Manises’ implementa medidas de ‘eficiencia energética’ 18 de febrero de 2025 CO2 Impunidad por la ‘quema de 12.000 toneladas de neumáticos’ en 2015 por parte de RMD 18 de febrero de 2025 CO2 Proyecto MODHEATECH: acelerar la ‘descarbonización’ en la producción de acero 13 de febrero de 2025 Todas las actividades humanas contaminan de una forma u otra el medio ambiente, generando emisiones de gases de efecto invernadero y otros contaminantes, por lo que cada producto que empleamos tiene su propia huella de carbono. (adsbygoogle = window.adsbygoogle || []).push({}); Entre los medicamentos también encontramos que cada uno tiene una huella de carbono determinada y el Ministerio de Sanidad recomienda, que, en lo posible se elijan aquellos que son menos perjudiciales para el medio ambiente. Inhaladores con baja huella de carbono El Ministerio de Sanidad recomienda usar inhaladores con baja huella de carbono para reducir el impacto medioambiental. Inhaladores de polvo seco, de niebla fina y otros dispositivos nuevos pueden ser efectivos en casos de nuevos diagnósticos respiratorios, cambios de inhalador por razones clínicas o preferencias del paciente. Todo esto debe hacerse sin poner en riesgo el control de la patología, siempre que las características del paciente lo permitan y se mantengan los síntomas controlados. (adsbygoogle = window.adsbygoogle || []).push({}); El secretario de Estado de Sanidad, Javier Padilla, y el responsable de Salud y Cambio Climático en el Gabinete de la ministra de Sanidad, Héctor Tejero, han presentado una guía sobre la prescripción sostenible de inhaladores y han recordado que el cambio climático es una de las principales amenazas para la salud de la población del siglo XXI. Esta crisis tiene impactos negativos para la salud, especialmente para aquellas personas con patologías respiratorias como el asma o la EPOC. Padilla ha recordado que, desde que comenzó la legislatura, se insiste en que uno de los grandes retos son los efectos del cambio climático sobre la salud. Por eso, se ha confeccionado una guía de recomendaciones sobre uso sostenible de inhaladores, ya que los pacientes con patologías respiratorias son más vulnerables. (adsbygoogle = window.adsbygoogle || []).push({}); También ha dicho que “debemos tener una transición ecológica del sistema sanitario, pero centrada en los pacientes” y que la recomendación de usar inhaladores con menor impacto ambiental se produzca siempre en el momento de nuevo diagnóstico o cambio de inhalador. Sostenibilidad del Sistema Nacional de Salud Héctor Tejero ha destacado también la necesidad de avanzar en un Sistema Nacional de Salud sostenible ya que el uso del medicamento supone cerca del 30% del impacto ambiental y los inhaladores casi el 10%.El fin de este documento es informar a profesionales y pacientes para avanzar hacia la prescripción más sostenible, pero Tejero ha recalcado que, si la huella de carbono es importante, aún lo es más el paciente. Hay que evitar, en su opinión, un sobrediagnóstico, pero también infradiagnósticos, y “controlar adecuadamente la enfermedad”, llevando siempre a cabo una prescripción individualizada y de acuerdo con el paciente. También se debe mejorar su uso con educación terapéutica y concienciar a todos los actores sobre el reciclaje, que tiene un alto impacto ambiental. La adherencia al tratamiento y el uso correcto de la técnica inhalatoria son esenciales para el control de las enfermedades respiratorias. Una correcta utilización de los inhaladores contribuye indirectamente a reducir su impacto ambiental, optimizando su efectividad y promoviendo un uso más sostenible. Por ello, promover la educación terapéutica es otra herramienta para optimizar el uso de los inhaladores y minimizar su huella de carbono. Por esa razón, han recalcado que las instituciones deben avanzar hacia sistemas sanitarios con baja huella de carbono que sean sostenibles con el planeta, garantizando al mismo tiempo el cuidado de la salud y la seguridad de los pacientes. Uno de los grupos de medicamentos con una importante huella de carbono, en términos proporcionales, es el de los inhaladores presurizados. La decisión de uso o de cambio de un inhalador, en todo caso, y según se ha repetido, debe siempre priorizar la seguridad del paciente, teniendo en cuenta las características clínicas del mismo y el control adecuado de la enfermedad. En todo caso, el impacto medioambiental de una enfermedad respiratoria mal controlada aumenta debido a un mayor uso de recursos sanitarios asociados a la descompensación de la enfermedad. Impacto medioambiental de los inhaladores Por tanto, dicha decisión, han recordado Padilla y Tejero, no debe hacerse exclusivamente por motivos medioambientales cuando la seguridad del paciente y el control clínico de su patología puedan ponerse en riesgo. Cualquier decisión para reducir el impacto medioambiental de los inhaladores utilizados debe hacerse de forma individualizada y consensuada con el paciente, priorizando siempre el criterio clínico y el óptimo control de la enfermedad por encima de la huella de carbono individual del inhalador En este sentido, la educación terapéutica es fundamental, ya que no solo mejora la adherencia al tratamiento, sino que también optimiza la técnica de inhalación. Esto contribuye a un mejor control de las enfermedades respiratorias, promueve un uso más eficiente de los inhaladores y fomenta un correcto reciclaje de estos, contribuyendo a la sostenibilidad ambiental del sistema sanitario y favoreciendo un uso más eficiente de los recursos disponibles. Además, es necesario fomentar el reciclaje y la correcta gestión medioambiental de los inhaladores gastados, caducados o no utilizados, depositándolos en el punto convenido del sistema integrado de gestión y recogida de envases (SIGRE) en las oficinas de farmacia. Tags: baja huella de carbonocambio climáticoimpacto medioambientalinhaladoressostenibilidad"
