["https://www.ecoticias.com/co2/hospital-manises-eficiencia-energetica"]
title = "El ‘Hospital de Manises’ implementa medidas de ‘eficiencia energética’"
description = "En los hospitales se consume energía durante todos los días del año. Se usa energía eléctrica y combustible como gasoil o propano y la mayor parte de dicha"
full_description = "CO2 Instan a usar ‘inhaladores’ con ‘baja huella de carbono’ para reducir su impacto medioambiental 20 de febrero de 2025 CO2 Impunidad por la ‘quema de 12.000 toneladas de neumáticos’ en 2015 por parte de RMD 18 de febrero de 2025 CO2 Proyecto MODHEATECH: acelerar la ‘descarbonización’ en la producción de acero 13 de febrero de 2025 En los hospitales se consume energía durante todos los días del año. Se usa energía eléctrica y combustible como gasoil o propano y la mayor parte de dicha energía se dedica a la climatización, ventilación, iluminación y suministro de agua caliente. (adsbygoogle = window.adsbygoogle || []).push({}); Al aumentar la eficiencia energética en el funcionamiento global de un hospital, tomando medidas eficientes y funcionales, no solo se logra un ahorro del tipo económico, sino que también se evita la emisión de GEI y se disminuye la huella ecológica de la institución. El Hospital de Manises reduce su huella de carbono El Hospital de Manises consolida su liderazgo en sostenibilidad al lograr una reducción del 65 % en su huella de carbono desde 2013, centrándose en los alcances 1 y 2, es decir, en las emisiones que se generan por la actividad propia del hospital. Este resultado responde a su compromiso con el medio ambiente y los Objetivos de Desarrollo Sostenible (ODS), con la implementación de acciones como el uso de energías renovables y la mejora continua de la eficiencia energética. (adsbygoogle = window.adsbygoogle || []).push({}); En 2023, las emisiones totales (alcance 1, 2 y 3) alcanzaron las 51.474,22 toneladas de CO2 equivalente (emisiones directas: 1.040,88 tCO2e y emisiones indirectas: 50.778,17 tCO2e). Estas cifras se han logrado gracias a medidas dirigidas a la optimización del uso y rendimiento de las calderas, de los gases medicinales y anestésicos y a un control operativo riguroso de todas las fuentes que emiten gases de efecto invernadero. Según la gerente del departamento de salud de Manises, Beatriz Gómez, “el compromiso con el medio ambiente siempre ha sido una constante. Es fundamental seguir este camino en beneficio de la salud de las personas”. El Hospital de Manises dispone de un sistema de gestión energética certificado bajo los estándares internacionales de la norma ISO 50001:2018 y ha sido reconocido por su labor y contribución al cuidado del planeta con premios de reconocido prestigio como Most Sustainable Company in the Healthcare Industry (World Finance Sustainability Awards; 2022), Premio Ingeniería en Acción categoría Emergencia Climática (Asociación Española de Ingeniería Hospitalaria; 2021) y como uno de los 10 hospitales de España en los Premios de Sanidad por el Clima (2022), distinciones que avalan su posición como departamento de salud de referencia en sostenibilidad ambiental. (adsbygoogle = window.adsbygoogle || []).push({}); El Departamento de Salud de Manises da cobertura y asistencia sanitaria, tanto ambulatoria como domiciliaria a más de 216.000 personas de 14 localidades a través del Hospital de Manises, 9 centros de salud, 11 consultorios auxiliares, 2 centros de especialidades, 1 centro de salud integrado, el Hospital de Agudos de Manises y el Hospital de Crónicos de Mislata. Tags: eficiencia energéticaHospital de Maniseshuella ecológica"
year_published = 2025
year_updated = 2025
