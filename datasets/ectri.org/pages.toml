["https://ectri.org/about-ectri/members/become-a-member"]
title = "Become a member – ECTRI"
full_description = "Become a member Who should join ECTRI? Research establishments (e.g. research centres/institutes or universities) with the following key characteristics: head offices in Europe; full legal status and identity; tasked with activities of public interest in the field of transport research; conducting considerable research activities in transport (multimodal perspective); is well recognized in its field in its country. Interested in becoming a member? Please download the key information and conditions where you will find information on the criteria for membership, benefits and duties, membership selection procedure and annual fee structure. Application procedure If you feel that your organisation fulfils the membership criteria, then complete the application form (word version) (pdf version) and send it back together with an accompanying letter to the ECTRI office via post (Rue du Trône 98, B-1050 Brussels, BELGIUM) or e-mail. If download of word document is blocked, please try another browser."
year_published = 2025
clearnet = "https://ectri.org/about-ectri/members/become-a-member"
