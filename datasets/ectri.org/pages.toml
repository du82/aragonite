tive, July 2017 ECTRI suggestions for the third Work Programme (2018-2020), in the field of “TRAFFIC MANAGEMENT”, November 2016 ECTRI answer to the EC Public Consultation on the European C-ITS Initiative – September 2016 ECTRI Input on MMTIS – ITS Directive, November 2015 Participation in conferences NEARCTIS Workshop, November 13, 2009 “The young European Arena of Researchers 2010 – Year 2010″, Caroline Alméras, ECTRI Project Officer"
