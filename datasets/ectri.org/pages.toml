 of the Forum into working groups, September 2015 ECTRI suggestions for the second Work Programme (2016-2017) in the field of “FREIGHT & LOGISTICS”, December 2014 Answer to e-Freight EC consultation, January 2013 Suggestions for first Horizon 2020 Work-Programmes, May 2013 Contribution to ERTRAC Roadmap on Urban Freight, June 2013 Reply to the EC Consultation on ‘Effective reduction of noise generated by rail freight wagons in the European Union’, October 2013 Input to FP7 Work-programme updates, May 2009 Participation in European Advisory Group Participation in ALICE TP Working Groups Participation in conferences Invited Session TRA 2022 on “Improving interfaces between long haul and short haul freight transport as key towards sustainability” Lisbon, November 2022 (organised by Verena Ehrler – Université Gustave Eiffel, Saskia Seidel – DLR, Matthias Prandstetter – AIT, and Elpida Xenou, – CERTH-HIT Invited Session TRA 2014 on “How to deal with the variety of stakeholders and scales for freight transport? The interest of a systems approach”, Paris, April 2014 CAPOEIRA project final workshop, Oct. 2008 “Research offer: The point of view of public researchers in freight transport”, George Haralampous, HIT EU funded projects COFRET (2011-2013)"
