full_description = "A quick note for anybody using libnids on a 64-bit machine (AMD64), you will need to compile with -fno-strict-aliasing if you use optimisation at -O2 or above. Without it libnids will silently fail to provide you any data. Today I wanted to quickly calculate a truth table for a simple boolean equation. Whilst this can be done very simply on paper it becomes tedious with lots of inputs. A quick Google search found “Logic Friday”, available at sontrak.com. Boolean operations can be described using logic gates, truth tables or an equation. Today I removed clamav from my VPS, which was built into the mail service I run. There are a small number of users and a few thousand messages a week - I liked that I was probably offering some small protection to those people. However all have endpoint anti-virus and most are wise enough to know about malicious email attachments."
