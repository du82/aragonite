title = "Hand SMD assembly and frying pan reflow | edeca.net"
description = "People often ask how I assemble SMD boards, the video below is sped up to 20x and demonstrates the process. It takes a few minutes to dab some solder paste on each pad, then parts are placed using anti-magnetic tweezers."
full_description = "Hand SMD assembly and frying pan reflow David Cannings Apr 22, 2013 1 min read Electronics People often ask how I assemble SMD boards, the video below is sped up to 20x and demonstrates the process. It takes a few minutes to dab some solder paste on each pad, then parts are placed using anti-magnetic tweezers. Finally the whole lot is carefully put into a frying pan and heated quickly over a gas hob. Don’t share the frying pan with anything else - you don’t want to be mixing solder and your sausages! Pcb Reflow Smd David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
