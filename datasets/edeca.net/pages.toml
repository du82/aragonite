["https://edeca.net/post/2010-07-10-o2-iphone-ios4-provisioning-bug"]
title = "O2 iPhone (iOS4) provisioning bug | edeca.net"
description = "I finally upgraded my old iPhone 3GS to iOS4, but it wasn’t a smooth process. It seems O2 have a problem with their provisioning process because, after the upgrade, all of the carrier settings had disappeared."
full_description = "O2 iPhone (iOS4) provisioning bug David Cannings Jul 10, 2010 2 min read General I finally upgraded my old iPhone 3GS to iOS4, but it wasn’t a smooth process. It seems O2 have a problem with their provisioning process because, after the upgrade, all of the carrier settings had disappeared. There was no way to setup Visual Voicemail in the menu and no internet services worked when I wasn’t on wifi. Every time the phone was plugged into the computer iTunes would say that there was an update for the carrier settings, but it never applied and the menu entries remained blank. O2 support were only slightly helpful, taking me through the settings which appear on their website but not fixing the Visual Voicemail issues or the prompt in iTunes. There are threads on the O2 site here and here and a useful one on AVForums which gives the fix. Unfortunately the fix is to completely reset the iPhone and start from scratch. Restoring from a backup simply brings the old (broken) settings back. I couldn’t find a way to only synchronise contacts back to the phone, though iTunes suggests it is possible. Follow these steps to repair it: erase the phone from the menu: Settings -> General -> Reset -> Erase All Content and Settings connect the phone to iTunes and restore iOS4 set the device up as a new phone, not from a backup! Browsing through the carrier settings menu should now show the correct values for APN (idata.o2.co.uk). Importantly, the Visual Voicemail settings should also be in the menu. Now to setup all my apps, account sand contacts from scratch.. Bugs David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
