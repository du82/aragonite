title = "Computing | edeca.net"
description = "The personal website of David Cannings."
full_description = "In a slightly crazed moment today I decided to write some documentation. Having used Docbook before for my UML Bridging Tutorial, I thought I’d pay it another visit. So Windows 7 is here. This blog post is rather outdated as far as that is concerned. What’s missing still is becoming more of a frustration though, as neither the HP P1006 or Canon laser printer I have are currently supported. I’ve been using Remember The Milk for a few days now and I am really impressed. One thing that is missing is the ability to show what tasks are due on a certain day when browsing the calendar, because Apple haven’t opened up the calendar API. However, it is incredibly easy to add this feature. Extended ACLs on Linux can be incredibly useful. Permissions can actually be more secure whilst allowing a number of users or daemons access to a file, no longer are unwieldy groups necessary to allow reading or writing. But for some reason, I noticed that these extended ACLs disappeared when a file was edited in vim. A small network I manage uses Squid and today I decided to enable proxy authentication to improve security a little. This was fairly trivial, I ended up using HTTP “basic” authentication and an existing htpasswd style password file."
