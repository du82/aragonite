["https://edeca.net/post/2010-04-08-obtaining-dns-servers-automatically-on-cisco-adsl-routers"]
title = "Obtaining DNS servers automatically on Cisco ADSL routers | edeca.net"
description = "I noticed tonight that my Cisco 837 was using hard-coded DNS servers which were no longer valid, hence breaking my internets. In order to keep them updated automatically, I added the following to the appropriate dialer configuration (interface Dialer0 on an 8xx):"
full_description = "Obtaining DNS servers automatically on Cisco ADSL routers David Cannings Apr 8, 2010 1 min read Computing I noticed tonight that my Cisco 837 was using hard-coded DNS servers which were no longer valid, hence breaking my internets. In order to keep them updated automatically, I added the following to the appropriate dialer configuration (interface Dialer0 on an 8xx): ppp ipcp dns request This causes the router to request DNS server addresses when the PPP session is negotiated (when it “dials up” to ADSL). After reconnecting the PPP session (either reload or shutdown the interface and then bring it back) it is possible to check that DNS servers have been obtained using sh host: router#sh host Default domain is not set Name/address lookup uses domain service Name servers are 62.69.62.6, 62.69.62.7 If the router is running a DNS server it is possible to direct DHCP clients at the router IP instead, forcing them to use these same settings. Cisco Dns David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
