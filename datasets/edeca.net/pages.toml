set nocompatible set bs=2 Reload vim and voila, insert mode behaves as I’d expect it to."""
full_description = "Fixing vim from macports David Cannings Dec 3, 2011 1 min read Computing After installing vim from MacPorts I noticed that neither the arrow keys or backspace work as expected. The solution is simple, create a ~/.vimrc file with the following contents: set nocompatible set bs=2 Reload vim and voila, insert mode behaves as I’d expect it to. Note that you don’t really need to set nocompatible, simply having a .vimrc file in your home directory does this automatically. I’ve left it in to remember the solution in future. Thanks to the linux-journal blog and the vim tips wiki for the answers. Macbook Ports David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
