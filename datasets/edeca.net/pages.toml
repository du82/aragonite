full_description = "Image credit: pixabay PCB0001 - 18F breakout Oct 6, 2012 This wasn’t the first PCB I produced but I had to start numbering somewhere.. The board was designed by my friend Howard, all I did was tidy up the silkscreen and send it off for manufacture. I now have a selection with varying 18F PICs on and it is probably my most used PCB for breadboarding new designs. Any 28 pin SOIC 18F series chip can be used, all pins are broken out onto the header. The two pins which are swapped on the package are broken out in the correct order on the PCB! MCLR is pulled high and an optional LED shows power status. This can be made at home more easily than most of my boards as it is possible to build without plated through holes. Download Download board (ZIP) - Eagle files License This work is made available under the Creative Commons Attribution-NonCommercial-ShareAlike (CC BY-NC-SA) license. Electronics Pcbs David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
