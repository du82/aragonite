["https://edeca.net/category/computing/page/4"]
title = "Computing | edeca.net"
description = "The personal website of David Cannings."
full_description = "In a previous message I spoke about training dspam automatically. The script I posted there works, but it’s not brilliant so I started looking for other ways of achieving spam training from the client. Recently I have installed and configured dspam on my mailserver. It seems to work nicely but needs occasional training. I wanted to integrate this with Thunderbird so that users could automatically train dspam from their mail client. Much of the code I have written as part of my day job uses the rather excellent libnids. However, there are a few bugs in version 1.23 relating to packets with radiotap headers or code which tries to read from multiple pcap files in sequence. I thought I would share my experience of submitting a module to CPAN for the first time. In summary: it’s stupidly easy and if I can do it, so can you. Since I’d had my iPhone I’ve wanted to be able to sync my contacts with my Horde Webmail install. This post is about setting up the Funambol application in order to do so. I have recently started using the Funambol iPhone app to keep my contacts in sync with my webmail addressbook. However, some fields aren’t included in Turba by default and need adding. This post is for system administrators rather than users, so if you don’t run your own webmail then point your friendly geek at this post. Tired of seeing repeated attempts to login to a Linux server you run? There are a number of options, all with their own benefits and disadvantages. The easiest way is to move the port that the SSH server runs on, perhaps to 2222 instead of 22. However. this can be annoying behind some firewalls and means that you need to specify the port each time you SSH to a host. This post looks at denyhosts, a viable alternative."
