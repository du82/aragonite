full_description = "Today I wanted to quickly calculate a truth table for a simple boolean equation. Whilst this can be done very simply on paper it becomes tedious with lots of inputs. A quick Google search found “Logic Friday”, available at sontrak.com. Boolean operations can be described using logic gates, truth tables or an equation. Today I removed clamav from my VPS, which was built into the mail service I run. There are a small number of users and a few thousand messages a week - I liked that I was probably offering some small protection to those people. However all have endpoint anti-virus and most are wise enough to know about malicious email attachments. After some recent discussions with two friends Rich & Dave I have been playing with WebSDR, decoding all sorts of transmissions using MultiPSK. I have never been particularly interested in amateur or “ham” radio but receiving and decoding signals from around the world is a fun way to pass a cold evening. There is lots to find: weather information, humorous IRC style chat, worldwide operators trying to reach as far as possible and even digitally coded pictures."
