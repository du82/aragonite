full_description = "Image credit: pixabay Nautical signal flags Jul 18, 2009 This is a set of free graphics illustrating the alphabet in nautical flags (from alpha to zulu, no numbers) which I originally created to use in an educational game. All SVG, PNG and ICO format flag graphics are licensed under the Creative Commons Attribution ShareAlike 2.0 license. Please feel free to use them, but it would be nice if you could email me to tell me what you have done. Previous uses include business cards, a wedding and a promotional campaign for a company. The flags were once used on the International maritime signal flags page at Wikipedia, until a wikifiddler came along and “trumped them with his own set”. Download Download SVG format - suitable for resizing Download PNG format - 100px by 100px Download Windows ICO format - 32px by 32px Graphics David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
