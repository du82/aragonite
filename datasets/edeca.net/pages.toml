full_description = "Net::LibNIDS 0.1 released David Cannings Jun 30, 2010 1 min read Computing The other day I pushed a new version of Net::LibNIDS to CPAN. It interfaces with the C library libnids in order to provide TCP stream reassembly and returns the data to your Perl callback. The API for the Perl module is still nasty but a bunch of bugs have been fixed which make it quite usable. I plan on uploading some other modules in the coming months which make utilise Net::LibNIDS to do their work. If you use it, make sure you use the latest version of libnids (currently v1.24) as it fixes a bunch of important bugs. This currently isn’t in Debian/Ubuntu and the maintainer has disappeared, so compile from source for now. Red Hat based distributions get it easy it seems, as somebody has already compiled it for RHEL4 or later. Perl David Cannings Cyber Security My interests include computer security, digital electronics and writing tools to help analysis of cyber attacks."
