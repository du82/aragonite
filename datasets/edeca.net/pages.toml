["https://edeca.net/post/page/2"]
title = "Posts | edeca.net"
description = "The personal website of David Cannings."
full_description = "This post is entirely based on my opinions. If you don’t want to read a post about my opinions there are plenty of excellent videos on YouTube. You have been warned. Banks and financial institutions are constantly giving out advice about email safety, helping customers to avoid phishing scams. Make sure the email is genuine, don’t click on links, never give your personal information away online. Sensible advice, unless the financial institution doesn’t make it easy to actually verify their emails. In short: SiteWizard are dirty annoying spammers who try random email addresses to send their silly SEO spam. They need to stop doing this. A quick note for anybody using libnids on a 64-bit machine (AMD64), you will need to compile with -fno-strict-aliasing if you use optimisation at -O2 or above. Without it libnids will silently fail to provide you any data. I have recently started to use Proteus ARES for PCB layout. I regularly order boards from OSH Park but there is a fixed file naming convention for uploaded ZIP files."
