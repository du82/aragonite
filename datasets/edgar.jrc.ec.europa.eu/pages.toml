["https://edgar.jrc.ec.europa.eu/methodology"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = 'This site is managed by:Directorate-General for "Joint Research Centre"'
full_description = "The Emissions Database for Global Atmospheric Research (EDGAR) provides global past and present day anthropogenic emissions of greenhouse gases and air pollutants by country and on spatial grid. This section presents the general principles of EDGAR such as emissions calculation per source categories with a generic approach consistently applied for all world countries and with geographic distribution to the place of emission. Main characteristics of EDGAR are: Crippa, M., Guizzardi, D., Muntean, M., Schaaf, E., Dentener, F., van Aardenne, J. A., Monni, S., Doering, U., Olivier, J. G. J., Pagliari, V., and Janssens-Maenhout, G.: Gridded emissions of air pollutants for the period 1970–2012 within EDGAR v4.3.2, Earth Syst. Sci. Data, 10, 1987–2013, doi:10.5194/essd-10-1987-2018, 2018. Janssens-Maenhout, G., Crippa, M., Guizzardi, D., Muntean, M., Schaaf, E., Dentener, F., Bergamaschi, P., Pagliari, V., Olivier, J. G. J., Peters, J. A. H. W., van Aardenne, J. A., Monni, S., Doering, U., Petrescu, A. M. R., Solazzo, E., and Oreggioni, G. D.: EDGAR v4.3.2 Global Atlas of the three major greenhouse gas emissions for the period 1970–2012, Earth Syst. Sci. Data, 11, 959–1002, doi:10.5194/essd-11-959-2019, 2019. Muntean, M., Janssens-Maenhout, G., Song, S., Giang, A., Selin, E.N., Zhong, H., Zhao, Y., Olivier, J.G.J., Guizzardi, D., Crippa, M., Schaaf, E., Dentener, F.: Evaluating EDGARv4.tox2 speciated mercury emissions ex-post scenarios and their impacts on modelled global and regional wet deposition patterns, Atmospheric Environment, Volume 184, 2018, Pages 56-68, ISSN 1352-2310, doi:10.1016/j.atmosenv.2018.04.017. (http://www.sciencedirect.com/science/article/pii/S1352231018302425)."
