["https://edgar.jrc.ec.europa.eu/dataset_tox81"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
full_description = "EDGARv8.1 provides emissions not only for the greenhouse gases and air pollutants per sector and country but also for toxic pollutants such as mercury. Emissions from large scale biomass burning with Savannah burning, forest fires, and sources and sinks from land-use, land-use change and forestry (LULUCF) are excluded. For the energy related sectors the activity data are primarily based on IEA data from IEA (2022) World Energy Balances, (www.iea.org), all rights reserved, as modified by Joint Research Centre, European Commission, whereas the activity data for the agricultural sectors originate primarily from FAO (2022) (https://www.fao.org/faostat). United States Geological Survey (USGS), UNFCCC and World Steel Association (worldsteel) recent statistics are also used for activity data. The emissions from Artisanal Small Scale Gold Mining (ASGM) sector were updated based on information from publicly available reports and scientific literature; it is foreseen a refinement of these emissions based on the information from official national reporting to the Minamata Convention on Mercury in the framework of the First Effectiveness Evaluation. Additional information can be found in Muntean et al. (2025, in preparation). For each substance, emission timeseries (1970-2022) by sector and country are provided in an overview table (.xls). Notes: Emission country totals are expressed in kt substance / year. The IPCC 1996 and 2006 codes are used for specification of the sectors. The MINAMATA worksheet provides the aggregation of emissions with specification of the sectors based on the recommendations of Minamata Convention. For each substance, monthly emission timeseries (2000-2022) by sector and country are provided in an overview table (.xls). Notes: Emission country totals are expressed in kt substance / year. The IPCC 1996 and 2006 codes are used for specification of the sectors. Notes: Emission gridmaps are expressed in t substance / 0.1degree x 0.1degree / year for the emi .txt and .nc files and in kg substance /m2 /s for the fluxes .nc files."
year_published = 2025
