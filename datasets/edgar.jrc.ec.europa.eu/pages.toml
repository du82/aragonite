["https://edgar.jrc.ec.europa.eu/report_2020"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "2020 report"
full_description = "The global GHG emissions trend has increased since the beginning of the 21st century in comparison to the three previous decades, mainly due to the increase in CO2 emissions from China and the other emerging economies. As a result, the atmospheric concentrations of greenhouse gases substantially increased enhancing the natural greenhouse effect, which may negatively affect the life on the Earth. These issues are internationally addressed in the framework of UNFCCC; countries are developing national emissions inventories and propose/implement actions to mitigate GHG emissions. CO2 emissions, which are the main responsible for global warming are still increasing at world level despite climate change mitigation agreements. EDGAR provides an independent estimate of greenhouse gases for each world country, based on a robust and consistent methodology stemming from the latest IPCC guidelines and most recent activity data. Following the latest update released in September 2020, emission data are now available for fossil CO2 for each country for the time period 1970-2019 while national emissions for other GHGs are available for 1970-2015. Global CO2 emissions from fossil fuels combustion and processes further increased by 0.9% in 2019, about half of the previous annual growth rate (+1.9% in 2018), reaching a total of 38.0 Gt CO2. In 2019, China, the United States, India, the EU27+UK, Russia and Japan - the world’s largest CO2 emitters - together accounted for 51% of the population, 62.5% of global Gross Domestic Product, 62% of total global fossil fuel consumption and emitted 67% of total global fossil CO2. Emissions from these five countries and the EU28 show different changes in 2019 compared to 2018: the largest relative increase is found for China (+3.4%), followed by India (+1.6%). On the contrary, the EU27+UK (-3.8%), the United States (-2.6%), Japan (-2.1%) and Russia (-0.8%) reduced their fossil CO2 emissions. Global fossil CO2 emissions per unit of GDP continued their decreasing trend (-1.7% in 2019 and -33.8% between 2019 and 1990) reaching the average value of 0.298 tCO2/kUSD/yr, while per capita emissions remained substantially stable in 2019 to 4.93 tCO2/capita/yr, confirming a 15.9% increase from 1990."
year_published = 2025
clearnet = "https://edgar.jrc.ec.europa.eu/report_2020"
