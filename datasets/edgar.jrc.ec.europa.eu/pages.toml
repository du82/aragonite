["https://edgar.jrc.ec.europa.eu/dataset_ap81"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
full_description = "EDGARv8.1 provides emissions not only for the greenhouse gases per sector and country but also for the air pollutants: Emissions from large scale biomass burning with Savannah burning, forest fires, and sources and sinks from land-use, land-use change and forestry (LULUCF) are excluded. For the energy related sectors the activity data are primarily based on IEA data (2022) World Energy Balances, (www.iea.org), all rights reserved, as modified by Joint Research Centre, European Commission, whereas the activity data for the agricultural sectors originate primarily from FAO (2022) (www.fao.org/faostat). Users of the data are obliged to acknowledge the source of the data with a reference to the EDGARv8.1 air pollutant website (link). Co-authorship and involvement of the EDGAR Team in the emission data analysis is highly appreciated. User's comments and requests can be sent via email to the authors. For each substance, emission time series (1970-2022) by sector and country are provided in an overview table (.xls). Notes: Emission country totals are expressed in kt substance/year. Note that OC emissions are expressed in kton C / month. The IPCC 1996 and 2006 codes are used for specification of the sectors. For each substance, monthly emission time series (2000-2022) by sector and country are provided in an overview table (.xls). Notes: Emission country totals are expressed in kt substance/year. Note that OC emissions are expressed in kton C / month. The IPCC 1996 and 2006 codes are used for specification of the sectors. Notes: Emission gridmaps are expressed in ton substance / 0.1degree x 0.1degree / year for the .txt and .nc files. Emission fluxes are expressed in kg substance /m2 /s for the .nc files. Note that OC emission and fluxes are expressed in amount of C. Notes: Emission gridmaps are expressed in ton substance / 0.1degree x 0.1degree / year for the .txt and .nc files. Emission fluxes are expressed in kg substance /m2 /s for the .nc files. Note that OC emission and fluxes are expressed in amount of C. The IPCC 1996 and 2006 codes are used for specification of the sectors."
