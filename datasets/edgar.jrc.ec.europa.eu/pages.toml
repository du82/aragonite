["https://edgar.jrc.ec.europa.eu/dataset_ap432_VOC_spec"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "EDGAR v4.3.2_VOC_spec (January 2017)"
full_description = "Non-methane volatile organic compounds (NMVOC) include a large number of chemical species differing for their chemical composition and properties. The disaggregation of total NMVOC emissions into species is thus required to better model ozone and secondary organic aerosols formation. Region- and sector-specific NMVOC speciation profiles are here developed and applied to the EDGARv4.3.2 database, with the same sector resolution as the total NMVOC. The complete documentation on the speciation profiles and on the methodology used can be found in Huang et al. (ACP, 2017), while the list of 25 individual species or species groups used for the speciation is reported below. The NMVOC EDGARv4.3.2 database includes all anthropogenic emissions with the exception of large scale biomass burning. As such, the following sectors are covered in the NMVOC dataset of EDGARv4.3.2: power generation (ENE), combustion for manufacturing industry (IND), energy for buildings (RCO), road transportation including evaporative emissions for gasoline related fuels (TRO), transformation industry (TRF), fugitive emissions from fuel exploitation (PRO), process emissions during production and application including production of chemicals, paper/food/iron and steel production/ solvent use (PPA), oil refineries (REF), agricultural waste burning (AWB), shipping including both domestic and international shipping (SHIP), railways/ pipelines and off-road transport (TNR_OTH), fossil fuel fires (FFF), waste solid and wastewater (SWD), aviation differentiating among climbing and descent (TNR_AVI_CDS), cruise (TNR_AVI_CRS), landing and take-off (TNR_AVI_LTO) and supersonic (TNR_AVI_SPS). For each NMVOC species emissions timeseries (1970-2012) by sector and country are provided in an overview table (.xls). Notes:Emission country totals are expressed in kton substance / year. The IPCC 1996 code is used for specification of the sectors (as done before for v4.2). For each NMVOC species annual total gridmaps (1970,1980,1990,2000-2012) are provided as .txt and .netCDF files with spatial resolution of 0.1degree x 0.1degree."
