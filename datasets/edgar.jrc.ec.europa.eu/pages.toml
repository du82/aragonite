["https://edgar.jrc.ec.europa.eu/dataset_ghg60"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
full_description = "EDGARv6.0 provides emissions of the three main greenhouse gases (CO2, CH4, N2O) and fluorinated gases per sector and country. CO2 emissions are provided separately for CO2_excl_short-cycle_org_C and CO2_short-cycle_org_C. Emissions of CO2_excl_short-cycle_org_C include all fossil CO2 sources, such as fossil fuel combustion, non-metallic mineral processes (e.g. cement production), metal (ferrous and non-ferrous) production processes, urea production, agricultural liming and solvents use. Large scale biomass burning with Savannah burning, forest fires, and sources and sinks from land-use, land-use change and forestry (LULUCF) are excluded. Emissions of fluorinated gases have been derived by multiple sources, most notably from country reporting where available. When not the case, activity data statistics have been derived by UNEP data, from scierntific literature and expert judgment. For the energy related sectors the activity data are primarily based on IEA data from IEA (2019) World Energy Balances, (Internet: link), All rights reserved, as modified by Joint Research Centre, European Commission, whereas the activity data for the agricultural sectors originate primarily from FAO (2020) (Internet: link). United States Geological Survey (USGS), International Fertiliser Association (IFA), Gas Flaring Reduction Partnership (GGFR)/U.S. National Oceanic and Atmospheric Administration (NOAA), UNFCCC and World Steel Association (worldsteel) recent statistics are also used for activity data. Additional information can be found in Crippa et al. (2021). Users of the data are obliged to acknowledge the source of the data with a reference to the EDGARv6.0 website (link) to Crippa et al. (2021) and to the DOI (link). Co-authorship and involvement of the EDGAR Team in the emission data analysis is highly appreciated. User’s comments and requests can be sent via email to the authors. For each substance emission time series (1970-2018) by sector and country are provided in an overview table (.xls)."
