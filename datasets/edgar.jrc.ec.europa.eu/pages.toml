["https://edgar.jrc.ec.europa.eu/report_2021"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "2021 report"
full_description = "Since the beginning of 21st century and until 2019, global GHG emissions had followed an increasing trend mainly due to the increase in CO2 emissions from China and the other emerging economies. As a result, the atmospheric concentrations of greenhouse gases substantially increased enhancing the natural greenhouse effect, which may negatively affect the life on the Earth. Regardless the slowing down of global emissions in 2020 caused by the global COVID-19 pandemic, climate change remains an issue. That is internationally addressed in the framework of UNFCCC; countries are developing national emissions inventories and propose/implement actions to mitigate GHG emissions. CO2 emissions, which are the main responsible for global warming are still increasing at world level despite climate change mitigation agreements. EDGAR provides an independent estimate of greenhouse gases for each world country, based on a robust and consistent methodology stemming from the latest IPCC guidelines and most recent activity data. Following the latest update released in October 2021, emission data are now available for fossil CO2 for each country for the time period 1970-2020 while national emissions for other GHGs are available for 1970-2018. Global CO2 emissions from fossil fuels combustion and processes decreased by 5.1% in 2020 ( they had increased by 0.9% in 2019), at 36.0 Gt CO2, just below the 36.2 Gt CO2 emission level registered in 2013. In 2020, China, the United States, the EU27, India, Russia and Japan remained the world’s largest CO2 emitters - together they accounting for 49.5% of the population, 61.8% of global Gross Domestic Product, 65.2% of total global fossil fuel consumption and 66.7% of total global fossil CO2 Among these top six world emitters, only China has shown an increase in emissions in 2020 (+1.5%) while all others have decreased their emissions by different amounts: EU27 by 10.6%, United States by 9.9%, Japan by 6.8%, India by 5.9% and Russiaby 5.8%. Regardless the important decrease of GDP observed in the majority of world countries global fossil CO2 emissions per unit of GDP continued their decreasing trend (-5.4% in 2020 and -35% between 2020 and 1990) reaching the average value of 0.282 tCO2/kUSD/yr. Per capita emissions also decreased in 2020, by 6.5% to a value of 4.62 tCO2/capita/yr, leading to a 8.2% increase from 1990."
