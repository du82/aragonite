["https://edgar.jrc.ec.europa.eu/dataset_4tox2"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "EDGARv4.tox2 (November 2017)"
full_description = "The EDGAR Team updated the global mercury emission inventory, which is included in EDGARv4.tox2; three different forms of mercury have been distinguished: gaseous elemental mercury, gaseous oxidized mercury and particle bound mercury. The paper “Evaluating EDGARv4.tox2 speciated mercury emissions ex-post scenarios and their impacts on modelled global and regional wet deposition patterns” published open access in Science of the Total Environment (link), describes the emissions inventory (see section A). Three retrospective emissions scenarios were also developed and evaluated with the GEOS-Chem 3-D mercury model in order to explore the influence of speciation shifts, to reactive mercury forms in particular, on regional wet deposition patterns (see section B). EDGARv4.tox2 mercury emissions are disaggregated by sector and gridded emission data files are provided in two formats: netCDF (in kg/m2/s) and .txt (in t/cell). The EDGARv4.tox2 contains 0.1degx0.1deg emission gridmaps of total mercury and mercury species from 1970-2012. The emissions of total mercury (Hg), gaseous elemental mercury (Hg_G), gaseous oxidized mercury (Hg_D) and particle bound mercury (Hg_P) by sector are aggregated as following: The EDGARv4.tox2 emissions are calculated based on the energy balance statistics of IEA (2014) (Internet: link) Notes: Emission gridmaps are expressed in ton substance/0.1degree x 0.1degree/year for the .txt files and in kg substance/m2/s for the .nc files. The IPCC 1996 code is used for specification of the sectors (as done before for v4.2). 1full description in the paper “Evaluating EDGARv4.tox2 speciated mercury emissions ex-post scenarios and their impacts on modelled global and regional wet deposition patterns” (Muntean et al., 2018) In the reference scenario (EDGARv4.tox2_S1), speciation factors from the Arctic Monitoring and Assessment Programme (AMAP) are applied to all world countries. In the “EPA_power” scenario, speciation factors from EPA’s Information Collection Request (ICR) are applied to all world countries."
