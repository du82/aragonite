["https://edgar.jrc.ec.europa.eu/edgar_food"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "A global emission inventory of GHGs and air pollutants from the food systems"
full_description = "The global food system involves all economic sectors and makes a significant contribution to total anthropogenic greenhouse gas (GHGs) and air pollutant emissions. Understanding the various components is a necessary precursor to the design and implementation of actionable and efficient mitigation measures for the system. Food systems' GHG emissions are far more than emissions from the land-based sector (agriculture and food-relevant emissions from land use and land use change). Food needs to be farmed, harvested or caught, transported, processed, packaged, distributed and cooked, and the residuals disposed of. The energy required for all those processes needs to be produced and made available at the right time and location (see Fig.1). EDGAR-FOOD has been developed to aid the understanding of the activities underlying the energy demand and use, agriculture and land use change emissions associated with the production, distribution, consumption and disposal of food through the various stages and sectors of the composite global food system. These data were complemented with data from the FAOSTAT database on GHG emissions from land use related to agriculture (FAO, 2020). EDGAR-FOOD represents the first database consistently covering each stage of the food chain for all countries with yearly frequency for the period 1990-2015. Details regarding the methodology applied are available in Crippa et al. (2021). EDGAR-FOOD provides a picture of how an evolving world food system has responded to the evolution of world population in the last 25 years, together with changes in dietary habits and food related technology. At the global level, decoupling between population growth and food-related emissions is visible with emissions growing at a lower rate compared to population growth. Nevertheless, the regional view is more diverse, with some areas rapidly increasing emissions either due to domestic demand for food or for export. Unlike overall GHGs emissions, the food production sector is not overwhelmingly dominated by CO2 emissions from fossil fuels; land-based emissions are particularly relevant. Nevertheless, in line with the ongoing socio-economic development trends, food emissions are being increasingly determined by energy use, industrial activities and waste management."
year_published = 2025
