["https://edgar.jrc.ec.europa.eu/report_2024"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "2024 report"
full_description = "Since the beginning of 21st century, global greenhouse gas (GHG) emissions had followed an increasing trend mainly due to the increase in emissions from China and the other emerging economies. As a result, the atmospheric concentrations of greenhouse gases substantially increased enhancing the natural greenhouse effect, which may negatively affect the life on the Earth. According to the latest data, global GHG emissions in 2023 reached 53.0 Gt CO2eq (without Land Use, land Use Change and Forestry). The 2023 data represent the highest level recorded and experienced an increase of 1.9% or 994 Mt CO2eq compared to the levels in 2022. In the framework of UNFCCC, countries are developing national emissions inventories and propose/implement actions to mitigate GHG emissions. Fossil CO2 emissions, which are the main contributors to global GHG emissions are still increasing at world level despite climate change mitigation agreements. In this context, EDGAR provides an independent estimate of greenhouse gases for all world countries, based on a robust and consistent methodology stemming from the latest IPCC guidelines and most recent activity data. Following the latest update released in September 2024, this report presents GHG emission time series up to 2023, including emissions from all anthropogenic sectors and Land Use, Land Use Change and Forestry (LULUCF). China, the United States, India, the EU27, Russia and Brazil were the world’s largest GHG emitters in 2023. Together they account for 49.8% of global population, 63.2% of global gross domestic product, 64.2% of global fossil fuel consumption and 62.7% of global GHG emissions. Among these top emitters, in 2023 China, India, Russia and Brazil increased their emissions compared to 2022, with India having the largest increase in relative terms (+ 6.1%) and China the largest absolute increase by 784 Mt CO2eq. With only two exceptions, 2009 (global financial crisis) and 2020 (COVID-19), global GHG emissions have grown steadily since the beginning of the 21st century, mainly due to the increase in fossil CO2 emissions by China, India, and other emerging economies. Based on the emission estimates for 2023 provided by EDGAR, global GHG emissions increased by 1.9% compared to 2022, reaching 53.0 Gt CO2eq."
year_published = 2025
