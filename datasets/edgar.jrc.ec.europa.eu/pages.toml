["https://edgar.jrc.ec.europa.eu/dataset_htap_v3"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "An emission inventory in support to Hemisperic Transport of Air Pollution"
full_description = "The HTAP_v3 mosaic has been developed in the context of the UNECE Air Convention (UNECE Convention on Long-range Transboundary Air Pollution, link: https://unece.org/page404/env-lrtap) as a community effort to improve the scientific knowledge of the intercontinental transport of air pollution over the Northern Hemisphere (http://htap.org/). It consists of a global mosaic of monthly air pollutant (SO2, NOx, CO, NMVOCs, NH3, PM10, PM2.5, BC, OC) emission gridmaps at 0.1x0.1 degree resolution covering the time series 2000-2018 and all anthropogenic emission sectors, with the exception of Land Use, Land Use Change and Forestry. Emission gridmaps have been collected from officially reported data, and specifically from EMEP for Europe (CAMS-REG-v5.1), from the US Environmental Protection Agency (US EPA), Environment and Climate Change Canada (ECCC), REAS for most of the Asian domain, from Japan and CAPPS-KU for Korea. All remaining countries in the world have been covered using EDGARv6.1 air pollutant emission gridmaps. Furthermore, the EDGAR data have been used to complement the officially reported data as gapfilling source in case of missing data for certain sectors, pollutants and years. Compared to the previous HTAP mosaics (HTAPv1, HTAPv2.2), HTAP_v3 aims at extending the temporal coverage of the air pollutant emissions, their sectoral breakdown and the geographical coverage of the official data. The overall purpose is to provide the scientific inventory and modelling communities a comprehensive tool to develop trend analysis, study the transboundary transport of air pollutants, and help policy makers in addressing and mitigating emissions for relevant sectors. To facilitate data access and use, gridmaps at 0.5x0.5 degree resolution are also made available following the abovementioned specifications of the higher spatial resolution data (0.1x0.1 degree). NMVOC speciation profiles are developed for the HTAP_v3 mosaic in support of chemical mechanisms modelling. The HTAP_v3 speciation is developed for 25 GEIA NMVOC species and it is based on the work developed by Huang et al. (2017), as described in v4.3.2_VOC_spec NMVOC speciated 1970-2012. All details are included in the .xls file."
