["https://edgar.jrc.ec.europa.eu/dataset_ghg80"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
full_description = "EDGARv8.0 is the second product of the new EDGAR Community GHG emissions database, which is the outcome of an agreement between JRC and IEA to work more closely to gather and provide consistent harmonised CO2 emissions from fossil fuel combustion. EDGARv8.0 provides estimates for emissions of the three main greenhouse gases (CO2, CH4, N2O) and fluorinated gases per sector and country. CO2 emissions are provided separately for the fossil and bio components. Emissions of fossil CO2 (also named CO2_excl_short-cycle_org_C) include all fossil CO2 sources, such as fossil fuel combustion, non-metallic mineral processes (e.g. cement production), metal (ferrous and non-ferrous) production processes, urea production, agricultural liming and solvents use. To harmonise global fossil CO2 emission estimates, we incorporate IEA CO2 emissions from fossil fuel combustion sources (2022b), in the joint IEA-EDGAR CO2 emission dataset (v2). Emissions of bio CO2 (also named CO2_short-cycle_org_C) include emissions from the combustion of biofuels (e.g. primary solid biomass, liquid biofuels, etc.). Large scale biomass burning with Savannah burning, forest fires, and sources and sinks from land-use, land-use change and forestry (LULUCF) are excluded. Preliminary estimates of wild fires and LULUCF emissions up to 2022 can be found at: https://edgar.jrc.ec.europa.eu/report_2023. Emissions of fluorinated gases have been derived by multiple sources, most notably from country reporting where available. When not the case, activity data statistics have been derived by UNEP data, from scientific literature and expert judgment. For the energy related sectors the activity data for non-CO2 emissions are primarily based on IEA data (2022a) World Energy Balances, (www.iea.org), all rights reserved, as modified by Joint Research Centre, European Commission, whereas the activity data for the agricultural sectors originate primarily from FAO (2022) (https://www.fao.org/faostat). United States Geological Survey (USGS), International Fertiliser Association (IFA), Gas Flaring Reduction Partnership (GGFR)/U.S. National Oceanic and Atmospheric Administration (NOAA), UNFCCC and World Steel Association (worldsteel) recent statistics are also used for activity data. Additional information can be found in Crippa et al. (2023)."
