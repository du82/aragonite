["https://edgar.jrc.ec.europa.eu/report_2023"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "2023 report"
full_description = "Since the beginning of 21st century and until 2019, global Greenhous gas (GHG) emissions had followed an increasing trend mainly due to the increase in emissions from China and the other emerging economies. As a result, the atmospheric concentrations of greenhouse gases substantially increased enhancing the natural greenhouse effect, which may negatively affect the life on the Earth. Because of the COVID-19 pandemic, global emissions decreased by 3.7% in 2020 compared to 2019 levels, interrupting a more than ten-year continuously increasing trend. Nevertheless, global GHG emissions restarted to grow just after the peak of the pandemic, reaching in 2022 the level of 53.8 Gt CO2eq , which is 2.3% higher than 2019 and 1.4% higher than 2021. In the framework of UNFCCC, countries are developing national emissions inventories and propose/implement actions to mitigate GHG emissions. CO2 emissions, which are the main contributors to global GHG emissions are still increasing at world level despite climate change mitigation agreements. In this context, EDGAR provides an independent estimate of greenhouse gases for each world country, based on a robust and consistent methodology stemming from the latest IPCC guidelines and most recent activity data. Following the latest update released in September 2023, GHG emission data are now available for all IPCC sectors for each country for the time period 1970-2022. China, the United States, India, the EU27, Russia and Brazil were the six world largest GHG emitters in 2022. Together they account for 50.1% of global population, 61.2% of global Gross Domestic Product (GDP), 63.4% of global fossil fuel consumption and 61.6% of global GHG emissions. Among these top emitters, in 2022 China, the United States and India increased their emissions compared to 2021, with India having the largest increase in relative terms (5%). On the contrary, the other three top emitters decreased their emissions in 2022, with Russia showing the largest decrease (-2.4%)."
