["https://edgar.jrc.ec.europa.eu/report_2022"]
title = "EDGAR - The Emissions Database for Global Atmospheric Research"
description = "2022 report"
full_description = "Since the beginning of 21st century and until 2019, global GHG emissions had followed an increasing trend mainly due to the increase in CO2 emissions from China and the other emerging economies. As a result, the atmospheric concentrations of greenhouse gases substantially increased enhancing the natural greenhouse effect, which may negatively affect the life on the Earth. In 2020 global fossil CO2 emissions decreased by 5.3% in comparison to 2019, mainly because of the COVID-19 pandemic. However, in 2021, global emissions bounced back almost to the level of 2019, reaching 37.9 Gt, just 0.36% lower than in 2019, with the world getting back to pre-pandemic CO2 emission levels. In the framework of UNFCCC, countries are developing national emissions inventories and propose/implement actions to mitigate GHG emissions. CO2 emissions, which are the main responsible for global warming are still increasing at world level despite climate change mitigation agreements. In this context, EDGAR provides an independent estimate of greenhouse gases for each world country, based on a robust and consistent methodology stemming from the latest IPCC guidelines and most recent activity data. Following the latest update released in September 2022, emission data are now available for fossil CO2 for each country for the time period 1970-2021 while national emissions for other GHGs are available for 1970-2018. EDGARv7.0 launches the community GHG emissions database, changing to IEA CO2 data to harmonise CO2 emission estimates and beginning a process of recognising the essential role of the providers of the underlying international statistics to EDGAR. In 2021, China, the United States, the EU27, India, Russia and Japan remained the world’s largest CO2 emitters. Together they account for 49.2% of global population, 62.4% of global Gross Domestic Product, 66.4% of global fossil fuel consumption and 67.8% of global fossil CO2 emissions. All six increased their fossil CO2 emissions in 2021 compared to 2020, with India and Russia having the largest increases in relative terms (10.5% and 8.1%, respectively)."
