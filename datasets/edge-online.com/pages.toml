ame has 38,000 of them By Alex Raisbeck published 7 December 24 News "The answer, of course, was to simply add more." News OG FF7 director says thanks to the remake "half of Final Fantasy 7 [...] is now owned by the fans" By Alex Raisbeck published 7 December 24 News "It belongs to them as well as us" News Final Fantasy 7 Remake director had to swap his inspirations from The Last of Us to The Witcher 3 to make Rebirth's open world By Kaan Serin published 7 December 24 News Director Naoki Hamaguchi played CD Projekt Red's beloved open-world game to learn a few lessons News Final Fantasy 7 Rebirth's director says he rejects the idea of design by committee: "If there are too many people inputting, [...] the work can easily lose its character." By Alex Raisbeck last updated 2 December 24 News "I am a strong believe in the idea that too many cooks spoil the broth" News Civ 7 director thought the new Ages system might not work, but says it does fix the "number-one issue" - players not getting to the end of their games By Alex Raisbeck published 1 December 24 News "I'm getting so many more reports of people playing all the way to finishing a game" News Obsidian's Josh Sawyer thought Pillars of Eternity's Kickstarter had a 50% chance of failing, only for the RPG to be fully funded within 27 hours By Kaan Serin published 30 November 24 News "Other people at the studio were also like 'are we really not going to do this?'" News As the Final Fantasy 7 Remake saga nears its end, OG FF7 director says he's glad "we didn't mess it up" By Alessandro Fillari published 29 November 24 News They're going all in on the upcoming third installment News One of our most-anticipated JRPGs for 2025 was being made "just for fun in the beginning" and "everybody was working for free" By Iain Harris published 23 November 24 News Clair Obscur: Expedition 33 has scrappy origins News Golden Joystick Awards 2024: Catch up with the event here By Dan Dawkins last updated 21 November 24 Vote Now Final Fantasy VII Rebirth, Helldivers 2, Balatro, Astro Bot and Black Myth: Wukong win big Vote Now Fallout: New Vegas director Josh Sawyer knew the Fallout 3 comparisons were coming, but also knew that what made his RPG special were the things that you couldn’t find in one playthrough By Alex Raisbeck last updated 11 November 24 News "You always have to prioritise things." News Fallout: New Vegas director on the “blessing” of working on the RPG: “I never thought I’d get a chance to work on Fallout [again]” By Alex Raisbeck published 2 November 24 News A blessing for Fallout too, as it turned out. News The voice of Assassin's Creed 4: Black Flag's most treacherous pirate wishes "more video game companies would use mocap, because I think the performance stuff in Black Flag is brilliant" By Issy van der Velde published 27 October 24 News His son has some choice words about how the series has progressed since News Your choices in Avowed matter, and Obsidian promises to give players "moment-to-moment opportunities to express and explore where they're leaning" By Issy van der Velde published 27 October 24 News But what choices have been seen so far? News Despite its first-person combat, Avowed doesn't want you to get stabbed in the back: "You have to make sure you're giving players full awareness of the area around them" By Issy van der Velde published 25 October 24 News Don't expect a bar brawl News Indiana Jones and the Great Circle overcomes God of War Ragnarok's overeager tip-giver issue with a simple camera trick By Jesse Vitelli published 8 September 24 News A modern day fix for a modern day problem News Indiana Jones and the Great Circle devs put a focus on the "danger level" of using guns because "Indy doesn't have superpowers" By Jesse Vitelli published 7 September 24 News Back to basics News <a href="" rel="nofollow" class="article-link" aria-label="SPONSORED_HEADLINE" target=_self> <article aria-label="Search result: SPONSORED_HEADLINE" class="search-result search-res