title = "Dash Wallet - Edge"
description = "Edge's Dash Wallet will hold all your digital and crypto assets in a safe, secure, and easily accessible account."
full_description = "Automatic client-side encryption ensures bitcoin keys are always encrypted and protected from malware. HD address rotation, decentralized access, & zero-knowledge encryption make Edge the #1 most private cross-platform account. Connectivity to multiple public bitcoin nodes ensures wallets function even if Edge servers are down. Edge Login, plugins, and the Edge SDK connect the mobile wallet to a suite of other blockchain applications. Automatic client-side encryption ensures bitcoin keys are always encrypted and protected from malware. HD address rotation, decentralized access, & zero-knowledge encryption make Edge the #1 most private cross-platform account. Connectivity to multiple public bitcoin nodes ensures wallets function even if Edge servers are down. Edge Login, plugins, and the Edge SDK connect the mobile wallet to a suite of other blockchain applications. Dash was born in January 2013 out of a desire to make cryptocurrency more private and fungible. Although Dash is a fork of Bitcoin, it differs from Bitcoin substantially with its unique governance model and additional features such as InstantSend (faster confirmation times) and PrivateSend (privacy). An important pillar of Dash governance are special servers called Master Nodes. Master Nodes provide special services to users such as the aforementioned InstantSend and PrivateSend. In addition, operators of these special servers are allowed to vote on proposals related to the governance and development of the Dash network. We’re proud to support Dash in the Edge Wallet and look forward the network’s continued development."
