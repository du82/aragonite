title = "Litecoin Wallet - Edge"
description = "Edge's Litecoin Wallet will hold all your digital and crypto assets in a safe, secure, and easily accessible account."
full_description = "Automatic client-side encryption ensures bitcoin keys are always encrypted and protected from malware. HD address rotation, decentralized access, & zero-knowledge encryption make Edge the #1 most private cross-platform account. Connectivity to multiple public bitcoin nodes ensures wallets function even if Edge servers are down. Edge Login, plugins, and the Edge SDK connect the mobile wallet to a suite of other blockchain applications. Automatic client-side encryption ensures bitcoin keys are always encrypted and protected from malware. HD address rotation, decentralized access, & zero-knowledge encryption make Edge the #1 most private cross-platform account. Connectivity to multiple public bitcoin nodes ensures wallets function even if Edge servers are down. Edge Login, plugins, and the Edge SDK connect the mobile wallet to a suite of other blockchain applications. Litecoin was born on October 13, 2011 and is a fork of the Bitcoin source code with just a few alterations, namely a new hashing algorithm for mining, faster block generation times, and a greater potential supply of coins than Bitcoin. Litecoin has always branded itself as the digital silver to Bitcoin’s digital gold. Bitcoin has been seen by the Litecoin community as the dominant, most secure blockchain, with a rarer supply used for long-term value storage and large economic transactions while Litecoin would be of great use for smaller, faster payments. We’re proud to support Litecoin in the Edge Wallet and look forward to the network’s continued development as digital silver."
