["https://edgeconf.com/2014-sf"]
title = "Edge Conference"
full_description = "A day of group discussion and debate on advanced web technologies for developers and browser vendors, raising funds for Hack the Hood. Adobe's warehouse-style event space in San Francisco's SOMA district is the venue for the fourth Edge conference. Edge has no conventional talks. Instead, we run two types of session: highly structured panel debates with pre-curated questions, which use tools to surface the most relevant opinions in real time, and more intimate breakouts where everyone sits together and works through a topic in more depth. We care about creating a good environment for productive debate and discussion, rather than presenting the experiences of a single speaker or unpredictable Q&A. Sessions last an hour. Every person present, whether in the audience or on the panel, has a chance to speak and present an opinion. Edge can be a challenging environment for introverts, so we also have session-specific group chat channels available if you want to participate in writing instead of by speaking up. Everyone with something to share is welcome, and we aim to create the most collaborative environment possible. All profits from Edge ticket sales are donated to a charity that promotes education of the next generation of engineers who will look after the web. For Edge San Francisco 2014, we are supporting Hack the Hood. A 2014 Finalist for The Bay Area Google Impact Challenge, Hack the Hood is a nonprofit organization working to introduce young people from very low-income communities to careers in technology, marketing, and digital media. Launched in October 2012, Hack the Hood helps women, people of color, and LGBTQ young people become part of the tech community through training and hands-on experience building websites for local small businesses. Participants are mentored, develop professional portfolios and visit tech companies to learn about careers. Join us after the conference for drinks and delicious local food, generously hosted by our friends at Akamai. The lovely Akamai offices are a ten minute cab ride or a 30 minute walk depending on the weather. Join us and our after party hosts for food, drink, music and a chance to continue conversations begun during the day."
