["https://edgeconf.com/2015-london/index.html"]
title = "Edge Conference"
full_description = "A day of group discussion and debate on advanced web technologies for developers and browser vendors, raising funds for CodeClub. Facebook hosted the very first Edge conference, and we're delighted to be back for Edge 5, this time in the new Facebook London office in Euston, moments from five tube lines and Euston Square and Warren Steet stations. Edge has no conventional talks. Instead, we run two types of session: highly structured panel debates with pre-curated questions, which use tools to surface the most relevant opinions in real time, and more intimate breakouts where everyone sits together and works through a topic in more depth. We care about creating a good environment for productive debate and discussion, rather than presenting the experiences of a single speaker or unpredictable Q&A. Sessions last an hour. Every person present, whether in the audience or on the panel, has a chance to speak and present an opinion. Edge can be a challenging environment for introverts, so we also have session-specific group chat channels available if you want to participate in writing instead of by speaking up. Everyone with something to share is welcome, and we aim to create the most collaborative environment possible. All leftover revenue from Edge ticket sales is donated to a charity that promotes education of the next generation of engineers who will look after the web. For Edge London 2015, we are supporting CodeClub. Code Club is a UK-wide network of free volunteer-led after-school coding clubs for children aged 9-11. It creates projects for volunteers to teach at school clubs or at non-school venues such as libraries. The projects teach children how to program by showing them how to make computer games, animations and websites. Volunteers go to their local club for an hour a week and teach one project a week. After the conference, we'll be hosting a canalside BBQ at the Rotunda Bar. Join us from 7pm to 11pm to continue the conversations you started at the conference over food and drinks."
year_published = 2025
