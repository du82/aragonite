["https://edgeconf.com/2014-london/index.html"]
title = "Edge Conference"
full_description = "A day of group discussion and debate on advanced web technologies for developers and browser vendors, raising funds for CodeClub. This time around Edge is being kindly hosted by Microsoft in their rather swanky London office near Victoria Station. Edge has no conventional talks. Instead, we run two types of session: highly structured panel debates with pre-curated questions, which use tools to surface the most relevant opinions in real time, and more intimate breakouts where everyone sits together and works through a topic in more depth. We care about creating a good environment for productive debate and discussion, rather than presenting the experiences of a single speaker or unpredictable Q&A. Sessions last an hour. Every person present, whether in the audience or on the panel, has a chance to speak and present an opinion. Edge can be a challenging environment for introverts, so we also have session-specific group chat channels available if you want to participate in writing instead of by speaking up. Everyone with something to share is welcome, and we aim to create the most collaborative environment possible. All leftover revenue from Edge ticket sales is donated to a charity that promotes education of the next generation of engineers who will look after the web. For Edge London 2014, we are supporting CodeClub. Code Club is a UK-wide network of free volunteer-led after-school coding clubs for children aged 9-11. It creates projects for volunteers to teach at school clubs or at non-school venues such as libraries. The projects teach children how to program by showing them how to make computer games, animations and websites. Volunteers go to their local club for an hour a week and teach one project a week. Exclusively for Edge participants the Royal Institution is yours to explore for the evening, with food, drinks and full access to the museum and collections, sponsored by the Financial Times. The RI has been at the forefront of scientific thought in Britain since 1799. It has produced fifteen Nobel laureates, and discovered ten chemical elements, along with the wave theory of light, electro-magnetism, lasers and the greenhouse effect. Today the RI has a substantial public science programme, holding over one hundred events per year, including the world famous RI Christmas lectures, and is currently hosting a programme of lectures celebrating women in science."
