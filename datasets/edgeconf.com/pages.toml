["https://edgeconf.com/2013-nyc"]
title = "Edge Conference"
full_description = "A day of group discussion and debate on advanced web technologies for developers and browser vendors, raising funds for Girls Who Code. Edge has no conventional talks. Instead, we run two types of session: highly structured panel debates with pre-curated questions, which use tools to surface the most relevant opinions in real time, and more intimate breakouts where everyone sits together and works through a topic in more depth. We care about creating a good environment for productive debate and discussion, rather than presenting the experiences of a single speaker or unpredictable Q&A. Sessions last an hour. Every person present, whether in the audience or on the panel, has a chance to speak and present an opinion. Edge can be a challenging environment for introverts, so we also have session-specific group chat channels available if you want to participate in writing instead of by speaking up. Everyone with something to share is welcome, and we aim to create the most collaborative environment possible. We're happy to announce that the majority of revenue from Edge ticket sales is donated to a charity that promotes education of the next generation of engineers who will look after the web. For this event, we will be supporting Girls who Code. Launched in Spring 2012, Girls Who Code is a nonprofit organization working throughout the United States to close the gender gap in the technology and engineering sectors. With support from public and private partners, Girls Who Code works to educate, inspire, and equip high school girls with the skills and resources to pursue opportunities in computing fields. © Edge contributors. Site designed by Pixelbots, developed by Andrew Betts and licensed under a Creative Commons License."
