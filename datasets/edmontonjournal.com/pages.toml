title = "Capital Power says newly retooled Alberta plant poised for data centre opportunities | Edmonton Journal"
description = "Alberta's technology minister has said Alberta hopes to see $100 billion worth of AI data centres under construction in the next few years."
full_description = '''Share this Story : Capital Power says newly retooled Alberta plant poised for data centre opportunities Copy Link Email X Reddit Pinterest LinkedIn Tumblr Breadcrumb Trail LinksBusinessCapital Power says newly retooled Alberta plant poised for data centre opportunitiesAuthor of the article:The Canadian PressPublished Feb 27, 2025 • 3 minute read Join the conversation You can save this article by registering for free here. Or sign-in if you have an account.The Genesee Generating Station operated by Capital Power in Genesee Alberta. SuppliedArticle contentEDMONTON — Electricity producer Capital Power Corp. says its recently retooled Genesee Generating Station positions the company well to seize data centre opportunities in Alberta.Article contentWe apologize, but this video has failed to load.Try refreshing your browser, ortap here to see other videos from our team.Capital Power says newly retooled Alberta plant poised for data centre opportunities Back to video Article contentThe power plant southwest of Edmonton now runs entirely on natural gas instead of coal after a $1.6-billion multi-year project, allowing it to boost its capacity by around 60 per cent while cutting greenhouse gas emissions by 40 per cent.Advertisement 2Story continues belowThis advertisement has not loaded yet, but your article continues below.THIS CONTENT IS RESERVED FOR SUBSCRIBERS ONLYSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.SUBSCRIBE TO UNLOCK MORE ARTICLESSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.REGISTER / SIGN IN TO UNLOCK MORE ARTICLESCreate an account or sign in to continue with your reading experience.Access articles from across Canada with one account.Share your thoughts and join the conversation in the comments.Enjoy additional articles per month.Get email updates from your favourite authors.THIS ARTICLE IS FREE TO READ REGISTER TO UNLOCK.Create an account or sign in to continue with your reading experience.Access articles from across Canada with one accountShare your thoughts and join the conversation in the commentsEnjoy additional articles per monthGet email updates from your favourite authorsSign In or Create an AccountEmail AddressContinueor <button type="button" class="button button--icon-reverse button__social-login button__social-login--icon-left-aligned" onclick="window.location.assign('<#= Endpoint #>');"> <span class="button__text button__text--<#=Name.toLowerCase()#>"><#= (Name.toLowerCase() === 'live' ) ? 'Microsoft' : Name #></span> <span class="button__icon button__icon--<#=Name.toLowerCase()#>" aria-hidden="true"></span> </button> View more offersIf you are a Home delivery print subscriber, online access is included in your subscription. Activate your Online Access NowArticle contentChief executive Avik Dey urged analysts on a quarterly earnings conference call to be patient as they await details on a potential data centre project drawing power from Genesee.“I can appreciate that many of you are wondering when we will have a formal announcement on this front,” Dey said Wednesday.“Navigating the size and complexity of these projects takes time, but we continue to progress.”Alberta’s technology minister has said the province hopes to see $100 billion worth of artificial intelligence data centres under construction in the next five years. The massive operations require an immense amount of electricity to run and cool off computer servers.In December, the province announced a “concierge program” for major tech firms looking to navigate the regulatory process and set up shop in Alberta. Technology Minister Nate Glubish said at the time that the province is an ideal spot because its deregulated electricity market allows power generators to strike deals to supply private companies directly.Glubish said anything that compromises the reliability and affordability of Alberta’s grid would be a “no-go zone.”Headline NewsGet the latest headlines, breaking news and columns.There was an error, please provide a valid email address.Sign UpBy signing up you consent to receive the above newsletter from Postmedia Network Inc.Thanks for signing up!A welcome email is on its way. If you don't see it, please check your junk folder.The next issue of Headline News will soon be in your inbox.We encountered an issue signing you up. Please try againArticle contentAdvertisement 3Story continues belowThis advertisement has not loaded yet, but your article continues below.Article contentA December report from the Royal Bank of Canada’s Climate Action Institute found if all data centre projects currently going through the regulatory approval process across the country were approved, they would account for 14 per cent of Canada’s power needs by 2030.“Canadian regulators are reviewing data centre applications with an estimated combined capacity of 15 gigawatts — enough to power seven out of 10 homes nationwide,” the report reads, adding Alberta-based projects represent 6.5 gigawatts of capacity.Dey said Alberta has a lot of things going for it when it comes to data centres, including a surplus of land, temperate climate, supportive regulatory backdrop and excess power supply.A project of 1.5 gigawatts — comparable to the daily power usage of the entire City of Calgary — or larger is “achievable” for Capital Power, Dey said, but it would have to be undertaken in phases.“The Genesee Generating station is extremely well positioned for the opportunity we are pursuing.”He later added in a question-and-answer session with analysts that it used to be that the United States had a more developed data centre market than Alberta, but that’s been shifting.Advertisement 4Story continues belowThis advertisement has not loaded yet, but your article continues below.Article content“Only in the last six months have hyperscalers and data centre providers really expanded their aperture to start looking at Alberta,” Dey said.On potential U.S. tariffs, Dey said his company shouldn’t see much of a hit.“Our business is largely insulated from the impact of potential U.S. tariffs, with fuel purchased and power sold to local markets,” he said.“Our Canadian and U.S. businesses operate independently, with separate, high-quality counterparties in each country. Our long-term contracts and hedges not only stabilize our cash flow, but who we sell our product to over time.”For the last three months of 2024, Edmonton-based Capital Power brought in $240 million in net income attributable to shareholders, or $1.75 per diluted share, up from $97 million, or 74 cents per diluted share in the same period a year earlier.Revenues and other income for the quarter decreased to $853 million from $984 million during the fourth quarter of 2023.For all of 2024, Capital Power had net income attributable to company shareholders of $699 million, or $5.15 per diluted share, down from $744 million, or $6.04 per share in 2023.Annual revenues in 2024 were $3.78 billion, down from $4.28 billion.Adjusted funds from operations — a measure the company uses for its ability to generate cash from operating activities to fund capital expenditures, debt repayment and dividends — were $182 million for the last three months of 2024, or $1.38 per share. A year earlier, it brought in $162 million, or $1.38 per share.For all of 2024, adjusted funds from operations were $817 million, or $6.34 per share, down from $819 million, or $6.99 per share.Article contentShare this article in your social network Share this Story : Capital Power says newly retooled Alberta plant poised for data centre opportunities Copy Link Email X Reddit Pinterest LinkedIn Tumblr CommentsYou must be logged in to join the discussion or read more comments.Create an AccountSign in Join the Conversation Postmedia is committed to maintaining a lively but civil forum for discussion. Please keep comments relevant and respectful. Comments may take up to an hour to appear on the site. You will receive an email if there is a reply to your comment, an update to a thread you follow or if a user you follow comments. Visit our Community Guidelines for more information.window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbnails-a', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' });Trending Player grades: Have Edmonton Oilers finally found the solution? Beat Canes 3-1 Cult of Hockey Finally! Hockey boss gives clarity to Evander Kane's injury situation Cult of Hockey Edmonton Oilers end season's longest losing skid at five games Edmonton Oilers Victim of Downtown Edmonton swarming attack has long road to recovery, friend says Local News Edmonton Oilers can now trade veteran power forward. Will they? Should they? Cult of Hockey Read Next Latest National StoriesFeatured Local Savings'''
