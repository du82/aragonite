full_description = "Player grades: Have Edmonton Oilers finally found the solution? Beat Canes 3-1 Trending Cult of Hockey Victim of Downtown Edmonton swarming attack has long road to recovery, friend says Trending Local News Edmonton's 1910 Union Bank building soon home to business, fine dining The plan includes the relocation of Union Financial Corporation's headquarters to the upper floors, and the opening of Roca by Sabor, a new fine dining establishment on the main floor. 8 Comments Local News Edmonton investors snatch up 12 local buildings Over the past 18 months, 12 office buildings were bought by local private investors, dropping a combined $135 million into the Edmonton market. 9 Comments August 12, 2024 Business You can save this article by registering for free here. Or sign-in if you have an account. Advertisement 2Stories continue belowThis advertisement has not loaded yet, but your article continues below. Edmonton retail rental rates hold amid national rise, survey finds Edmonton’s retail rental rate is bucking the national trend by holding steady in a few key categories, while retail rents rise across the country. August 11, 2024 News You can save this article by registering for free here. Or sign-in if you have an account. Ode to Edmonton cinephiles: Rediscovering a Clareview time capsule 'The point of a capsule is supposed to bring people together, and you know, look back at where we were.' May 25, 2024 Local News You can save this article by registering for free here. Or sign-in if you have an account. Downtown Edmonton building sold, slated for residential redevelopment The Phipps-McKinnon Building gets new owners and is slated for partial redevelopment 30 Comments April 22, 2024 Business You can save this article by registering for free here. Or sign-in if you have an account. Edmonton on track for continued population and employment growth in 2025 Edmonton is forecasting rising population and employment growth into 2025, said the city’s chief economist — but some warn affordability cannot be the only driver to the province’s capital. Felicia Mutheardy, the city’s chief economist, said Edmonton’s labour market remained “resilient” in 2023 despite historically strong population growth at Wednesday’s Edmonton Economic Forecast forum. Edmonton has the second highest working age population growth across major census metropolitan areas. “What we’re forecasting for the Edmonton region seems more moderate than the rates of growth that we were estimating for 2022. But generally speaking our outlook for Edmonton is bright in looking at a growing economy and supported by population growth that’s going to support overall demand,” Mutheardy said. Mutheardy said while there are many positives, one of the challenges the city’s economy is facing is the environment. Generally, price pressures have eased and the economy is coming off a prolonged period of high inflation which has left Edmonton with high prices on top of higher interest rates, but a growing population is somewhat offsetting that. The continued worry is how this will strain the forecasted growth outlook and is dependent on how households and businesses are adjusting. While population growth is largely being attributed to the city’s affordability, Dave Young, with CBRE Edmonton, a commercial real estate service, said affordability cannot be the only driver for new residents and Edmonton needs to become a municipality that can retain newcomers in the long haul. He said while the city has done some good work it needs to “move quicker” and think about what can be done immediately to make the city “investment ready.” “It can’t just all be about affordability. We’ve got to talk about the emerging universities, the jobs. We’ve got a lot of work ahead of us to regain the position,” Young said. Leveraging the city’s universities and colleges will also help attract new residents to the city while also working to retain the workforce graduating from the programs. Young said he believes there’s an opportunity for real estate in offices, citing people are buying Downtown towers and market values are back up. “I think the office market has come through the worst four years in the history of office buildings,” Young said. Efforts to revitalize the Downtown core following high vacancy rates due to the COVID-19 pandemic have not gone unnoticed. According to global real estate adviser Avison Young Canada, Edmonton’s industrial market is seeing a steady increase in positive absorption and more properties being put on the market causing vacancy rates to slightly jump — but in a positive way. On Wednesday, Prime Minister Justin Trudeau announced the federal government will be providing Edmonton with $175 million in funding through the housing accelerator program to create 5,200 units over the next three years. Anand Pye, CEO of NAIOP, the Commercial Real Estate Development Association, said the announcement is welcome and coming at a time when housing real estate is in high demand and needs to match the city’s growing population. February 22, 2024 Commercial Real Estate You can save this article by registering for free here. Or sign-in if you have an account."
