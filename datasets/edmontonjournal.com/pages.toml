title = "Pembina Pipeline announces stake in Alberta power plant that could supply data centre | Edmonton Journal"
description = "The province could potentially see $100 billion worth of artificial intelligence data centres under construction in the next five years."
full_description = '''Share this Story : Pembina Pipeline announces stake in Alberta power plant that could supply data centre Copy Link Email X Reddit Pinterest LinkedIn Tumblr Breadcrumb Trail LinksBusinessNewsLocal NewsPembina Pipeline announces stake in Alberta power plant that could supply data centreAuthor of the article:The Canadian PressLauren KrugelPublished Feb 28, 2025 • 2 minute read Join the conversation You can save this article by registering for free here. Or sign-in if you have an account.Pembina Pipeline Corp. name outside Eighth Avenue Place was photographed on Tuesday, June 1, 2021. Photo by Azin Ghaffari /PostmediaArticle contentCALGARY — Pembina Pipeline Corp. announced it’s investing in a proposed Edmonton-area natural gas power plant that could supply a massive data centre complex, as it reported a dip in quarterly earnings and a boost in pipeline volumes.Article contentWe apologize, but this video has failed to load.Try refreshing your browser, ortap here to see other videos from our team.Pembina Pipeline announces stake in Alberta power plant that could supply data centre Back to video Article contentIt said Thursday it has entered into agreements for a 50 per cent stake in the Greenlight Electricity Limited Partnership, which aims to build an up to 1,800-megawatt power generation facility in Alberta’s Industrial Heartland. Its partner would be Kineticor Holdings LP, a subsidiary of pension manager OPTrust.Advertisement 2Story continues belowThis advertisement has not loaded yet, but your article continues below.THIS CONTENT IS RESERVED FOR SUBSCRIBERS ONLYSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.SUBSCRIBE TO UNLOCK MORE ARTICLESSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.REGISTER / SIGN IN TO UNLOCK MORE ARTICLESCreate an account or sign in to continue with your reading experience.Access articles from across Canada with one account.Share your thoughts and join the conversation in the comments.Enjoy additional articles per month.Get email updates from your favourite authors.THIS ARTICLE IS FREE TO READ REGISTER TO UNLOCK.Create an account or sign in to continue with your reading experience.Access articles from across Canada with one accountShare your thoughts and join the conversation in the commentsEnjoy additional articles per monthGet email updates from your favourite authorsSign In or Create an AccountEmail AddressContinueor <button type="button" class="button button--icon-reverse button__social-login button__social-login--icon-left-aligned" onclick="window.location.assign('<#= Endpoint #>');"> <span class="button__text button__text--<#=Name.toLowerCase()#>"><#= (Name.toLowerCase() === 'live' ) ? 'Microsoft' : Name #></span> <span class="button__icon button__icon--<#=Name.toLowerCase()#>" aria-hidden="true"></span> </button> View more offersIf you are a Home delivery print subscriber, online access is included in your subscription. Activate your Online Access NowArticle contentThe Greenlight Electricity Centre could include carbon capture, and it has enough land to accommodate a data centre complex with the same energy use as the plant’s output.“We are excited to be partnering with Kineticor and for the opportunity to further extend our value chain to provide power to a promising new Alberta-based data centre industry,” said Stu Taylor, Pembina’s senior vice president and corporate development officer.Kineticor said the centre would be on land already zoned for industrial use.“Alberta’s Industrial Heartland is one of the best locations in the province to facilitate a project of this magnitude given the large land base, robust grid infrastructure, and potential for decarbonization solutions over time,” said Kineticor CEO Andrew Plaunt.“By partnering with Pembina, we can leverage and combine our individual strengths and experience in major infrastructure projects to bring all the pieces together to develop a world-class facility.”Alberta’s technology minister has said the province hopes to see $100 billion worth of artificial intelligence data centres under construction in the next five years. The massive operations require an immense amount of electricity to run and cool off computer servers.Also Thursday, Pembina said it earned $572 million in its fourth quarter, down from $698 million a year earlier.The Calgary-based company says revenues for the quarter ended Dec. 31 were $2.15 billion, up from $1.84 billion during the same quarter in 2023.Earnings per diluted common share were 92 cents, down from $1.21 a year earlier.Pembina’s earnings and revenues for the full financial year rose from 2023.Pipeline volumes rose during the quarter and the full financial year.Article contentShare this article in your social network Share this Story : Pembina Pipeline announces stake in Alberta power plant that could supply data centre Copy Link Email X Reddit Pinterest LinkedIn Tumblr CommentsYou must be logged in to join the discussion or read more comments.Create an AccountSign in Join the Conversation Postmedia is committed to maintaining a lively