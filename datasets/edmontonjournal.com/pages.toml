["https://edmontonjournal.com/business/alberta-agriculture-groups-see-some-light-in-provincial-budget"]
title = "Alberta agriculture groups see some light in provincial budget | Edmonton Journal"
description = '''"We understand the provincial government's focus and key needs right now. What we'd love to see is more delineation of how those funds can be accessed for producers,"'''
full_description = '''Share this Story : Alberta agriculture groups see some light in provincial budget Copy Link Email X Reddit Pinterest LinkedIn Tumblr Breadcrumb Trail LinksBusinessLocal BusinessAlberta agriculture groups see some light in provincial budgetAuthor of the article: Zac Delaney Published Feb 28, 2025 • Last updated 1 day ago • 3 minute read Join the conversation You can save this article by registering for free here. Or sign-in if you have an account.A new report says a third of all agriculture jobs in Canada could be automated within the next decade. A farmer drives a combine to harvest a wheat crop near Cremona, Alta., Monday, Sept. 18, 2023. Photo by Jeff McIntosh /The Canadian PressArticle contentJust a day after its release, the Alberta Federation of Agriculture (AFA) says its initial read of the Alberta government’s financial road map for the year to come shows promise in some areas for the industry, but still leaves some questions.Article contentWe apologize, but this video has failed to load.Try refreshing your browser, ortap here to see other videos from our team.Alberta agriculture groups see some light in provincial budget Back to video Article content“We are going to want to always see more for the producer groups and whatnot. I think this is balanced in its short-term and longer-term outlook, making sure we have enough water and we’re looking after rural communities and some of the protections, while still being fiscally prudent,” said AFA executive director Aaron Stein.Advertisement 2Story continues belowThis advertisement has not loaded yet, but your article continues below.THIS CONTENT IS RESERVED FOR SUBSCRIBERS ONLYSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.SUBSCRIBE TO UNLOCK MORE ARTICLESSubscribe now to read the latest news in your city and across Canada.Exclusive articles by David Staples, Keith Gerein and others, Oilers news from Cult of Hockey, Ask EJ Anything features, the Noon News Roundup and Under the Dome newsletters.Unlimited online access to Edmonton Journal and 15 news sites with one account.Edmonton Journal ePaper, an electronic replica of the print edition to view on any device, share and comment on.Daily puzzles, including the New York Times Crossword.Support local journalism.REGISTER / SIGN IN TO UNLOCK MORE ARTICLESCreate an account or sign in to continue with your reading experience.Access articles from across Canada with one account.Share your thoughts and join the conversation in the comments.Enjoy additional articles per month.Get email updates from your favourite authors.THIS ARTICLE IS FREE TO READ REGISTER TO UNLOCK.Create an account or sign in to continue with your reading experience.Access articles from across Canada with one accountShare your thoughts and join the conversation in the commentsEnjoy additional articles per monthGet email updates from your favourite authorsSign In or Create an AccountEmail AddressContinueor <button type="button" class="button button--icon-reverse button__social-login button__social-login--icon-left-aligned" onclick="window.location.assign('<#= Endpoint #>');"> <span class="button__text button__text--<#=Name.toLowerCase()#>"><#= (Name.toLowerCase() === 'live' ) ? 'Microsoft' : Name #></span> <span class="button__icon button__icon--<#=Name.toLowerCase()#>" aria-hidden="true"></span> </button> View more offersIf you are a Home delivery print subscriber, online access is included in your subscription. Activate your Online Access NowArticle contentThe 2025 Alberta budget was tabled Thursday by Finance Minister Nate Horner. The budget brought forward an election promise of a tax cut, but was coupled with the less-sweet pill of deficits for the next three years. With significant investment in health care and education, Stein said he was happy for the investment in those key areas that needed it, including some investments that will aid the agriculture industry.“At first glance, there are some things to be very positive about,” said Stein.He highlighted investments in irrigation rehabilitation programs, which the province pledged $19 million towards for the next three years, as an important factor for the industry.“The agricultural industry has come under a lot of pressure in the last few years from climate change, drought, some of the big hailstorms. We see irrigation as being one of the top keys in supporting our (agriculture) societies, whether you be rancher or crop producer, oil seed, grains … whomever, water is one of the keys. And the investment that has been put forward is consistent with the support of that initiative,” he said.Headline NewsGet the latest headlines, breaking news and columns.There was an error, please provide a valid email address.Sign UpBy signing up you consent to receive the above newsletter from Postmedia Network Inc.Thanks for signing up!A welcome email is on its way. If you don't see it, please check your junk folder.The next issue of Headline News will soon be in your inbox.We encountered an issue signing you up. Please try againArticle contentAdvertisement 3Story continues belowThis advertisement has not loaded yet, but your article continues below.Article contentRehabilitation programs weren’t the only investments from the province for irrigation. The budget also earmarked $152 million over the next three years for irrigation projects.Stein lauded the province for its investment in agricultural societies infrastructure revitalization, which is slated to get a combined $8 million over the next three years. He also said as a general farm organization, the group was heartened to see more than $35 million going towards general and specialized physicians in rural communities.After back-to-back years of tough climate conditions, Stein said the disaster assistance fund for the agriculture industry has taken a beating.“There’s been significant withdrawals from that fund after we had severe drought in 2021, ’23, ’24,” he said, adding insurance premiums will have to go up to restore those funds. “And that’s that’s a negative for the farm community.”On top of facing higher premiums, he said the industry is also staring down the barrel of tariff concerns that add even more problems.“Like everyone, they’re being pressured and pinched on all sides,” he said.Advertisement 4Story continues belowThis advertisement has not loaded yet, but your article continues below.Article content“The challenges to (agriculture) producers have been extensive. They’re some of the most resilient, creative, dynamic of Alberta’s workforce. They’re getting hit very, very hard. And we’ve seen a lot of development in diversification of export markets, I think that needs to be continually invested upon at a federal and provincial level.”As tariffs continue to threaten the industry, coupled with regular climate uncertainty, Stein said the AFA was comforted by growth in the province’s contingency and emergency funding, but is seeking more clarity on how producers can take advantage of the money.“We understand the provincial government’s focus and key needs right now. What we’d love to see is more delineation of how those funds can be accessed for producers,” said Stein.For its part, the Alberta Beef Producers (ABP) also expressed its appreciation to the Alberta government through an emailed statement from ABP chairman Brodie Haugan.“Support for key industry initiatives such as Western Crop Innovations, Results Driven Agriculture Research, the Diagnostic Services Unit at the University of Calgary, and the foot and mouth disease vaccine bank are welcomed and will help to ensure producer competitiveness and resiliency,” said Haugan.Advertisement 5Story continues belowThis advertisement has not loaded yet, but your article continues below.Article contentRecommended from Editorial Albertans to get promised tax cut in Budget 2025 — here's what it means 'Difficult decision': Alberta Budget 2025 delivers $1.2 billion tax cut but also $5.2 billion deficit Bookmark our website and support our journalism: Don’t miss the news you need to know — add EdmontonJournal.com and EdmontonSun.com to your bookmarks and sign up for our newsletters here.You can also support our journalism by becoming a digital subscriber. Subscribers gain unlimited access to The Edmonton Journal, Edmonton Sun, National Post and 13 other Canadian news sites. Support us by subscribing today: The Edmonton Journal | The Edmonton Sun.Article contentShare this article in your social network Share this Story : Alberta agriculture groups see some light in provincial budget Copy Link Email X Reddit Pinterest LinkedIn Tumblr CommentsYou must be logged in to join the discussion or read more comments.Create an AccountSign in Join the Conversation Postmedia is committed to maintaining a lively but civil forum for discussion. Please keep comments relevant and respectful. Comments may take up to an hour to appear on the site. You will receive an email if there is a reply to your comment, an update to a thread you follow or if a user you follow comments. Visit our Community Guidelines for more information.window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbnails-a', container: 'taboola-below-article-thumbnails', placement: 'Below Article Thumbnails', target_type: 'mix' });Trending Player grades: Have Edmonton Oilers finally found the solution? Beat Canes 3-1 Cult of Hockey Finally! Hockey boss gives clarity to Evander Kane's injury situation Cult of Hockey Edmonton Oilers end season's longest losing skid at fi