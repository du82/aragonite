title = "1.5. Dissociation (The Gray Area) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "XRneeve on November 1, 2024 at 5:05 am Hello! Good cheer to all on this beautiful day!!!!! Good luck 🙂 1.5. Dissociation (The Gray Area) Radio Play, The Gray Area by edMay 2, 2017 Greg Sutton, a fidgety young man who is a little too fixated on selling himself, sees his psychiatrist for the first time in months, hoping to find answers about his lost childhood and how to get back the woman he loves. But his own quick fix solution to his problems is not quite what the psychiatrist had in mind. (Running time: 5 minutes) Written and directed by Edward Champion CAST: Greg: Charlie Harrington Emma: Colette Thomas Edited by Edward Champion Foley: Edward Champion Art: id-iom (CC) Special thanks to Sacha Arnold, Austin Beach, Jason Boog, Christopher Byrd, Claudia Berenice Garza, Jen Halbert, Gabriella Jiminez, Pete Lutz, John Osborne, Rina Patel, Michael Saldate, Paul Sating, Marc Stein, Georgette Thompson, Jack Ward, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this episode. http://traffic.libsyn.com/grayareapod/dissociation.mp3Listen: Play in new window | Download (Running Time: 4:47 — 7.2MB) audio dramacharlie harringtoncolette thomasdissociationedward championradio playthe gray area Post navigation 1. Hello (The Gray Area)2. Brand Awareness (The Gray Area) 1 Comment XRneeve on November 1, 2024 at 5:05 am Hello! Good cheer to all on this beautiful day!!!!! Good luck 🙂 Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
