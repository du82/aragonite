title = "The Gray Area – Season One Trailer – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "The Gray Area – Season One Trailer The Gray Area by edMarch 23, 2017March 23, 2017 Strange voices, agitated psychiatrists, giant rats, magical couriers, mysterious women, and loud and disheveled men. This 90 second trailer serves as a teaser for the first season of The Gray Area, a new audio drama project that will be premiering very soon. http://traffic.libsyn.com/grayareapod/s1trailer.mp3Listen: Play in new window | Download (Running Time: 1:29 — 1.4MB) Post navigation Loser: A Report from the Trump Tower Protests0. Prologue (The Gray Area) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
