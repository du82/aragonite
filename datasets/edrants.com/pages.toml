full_description = "October 31, 2004 by DrMabuse The Ultimate Justification for Why You Should Not Vote for Nader Uncategorized (via MeFi) October 29, 2004 by DrMabuse Inside the Lit Blogger’s Studio Uncategorized 2 Comments We were never asked to participate, but Emerging Writers Forum has an interview with the bloggers up. Go check it out. October 29, 2004 by DrMabuse With Polls Locked in Dead Heat, Kerry Asks Helping Hands for Aid in Swing States Uncategorized October 29, 2004 by DrMabuse Happy Halloween Uncategorized [Forrest J. Ackerman] [Clive Barker] [Jessica Barone] [Charles Beaumont] [Ambrose Bierce] [Algernon Blackwood] [Robert Bloch] [Poppy Z. Brite] [Grimm Brothers] [Ramsey Campbell] [Hugh B. Cave] [Thomas Disch] [Edward Gorey] [Shirley Jackson] [M.R. James] [Jack Ketchum] [Stephen King] [Joe R. Lansdale] [Richard Laymon] [Thomas Ligotti] [Bentley Little] [H.P. Lovecraft] [Robert McCammon] [George R.R. Martin] [Richard Matheson] [Yvonne Navarro] [Joyce Carol Oates][Edgar Allen Poe] [Tim Powers] [Ray Russell] [Mary Shelley] [Joseph Sheridan le Fanu] [Dan Simmons] [Bram Stoker] [Peter Straub] [J.N. Williamson] and to anyone else I might have missed. October 29, 2004 by DrMabuse Insomnia-Charged Roundup Uncategorized 2 Comments Audrey Niffenegger confesses that she wrote the sex scenes in The Time Traveler’s Wife last. Niffenegger is also penning a a writing book called You’ll Only Finish Your Novel If You Save the Best for Last. Thomas Harris has finished yet another Hannibal novel, which will not only describe how Lecter developed his appetite for evil, but include a metafictional subplot involving how Harris developed his appetite for beating a dead horse. Ten writers have won Whiting Writers’ Awards, including Dan Chiasson, Alison Glock, A. Van Jordan and Tracey Scott Wilson. Each will receive $35,000, a Tijuana vacation for two, and the keys to Tina Brown’s Beamer for one weekend. J.M. Coetzee tackles Philip Roth. Susanna Clarke has nothing on Lula Parsons. Parsons took 50 years to write her novel. She’s 92. Frank Darabont’s script for Indiana Jones 4 was rejected by Lucas. Now it’s Jeff (The Terminal) Nathanson on hand and an almost certain temple of doom. The Flaming Lips are publishing a photo book. Michiko’s verdict on Charlotte Simmons? A flat-footed new novel. The Sun also calls it “Wolfe’s worst novel.” This does not augur well."
