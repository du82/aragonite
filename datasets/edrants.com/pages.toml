description = "Okay, I fully confess (the dropoff in stats and Blogllines subscribers doesn't lie!) that I've been biting the big one lately and that my posts these days leave much to be desired.  (Hell, I can't even find time for the Tanenhaus Brownie Watch.)  There are reasons for this -- namely, other projects and things that I'm working on,"
full_description = "June 28, 2005August 7, 2006 by DrMabuse I Need a Vacation Personal 5 Comments Okay, I fully confess (the dropoff in stats and Blogllines subscribers doesn’t lie!) that I’ve been biting the big one lately and that my posts these days leave much to be desired. (Hell, I can’t even find time for the Tanenhaus Brownie Watch.) There are reasons for this — namely, other projects and things that I’m working on, which are whittling away my wit faster than you can say summer camp. So I’ve decided to throw in the towel for about a week or so and come back to this blog when I can offer half-decent posts again. A man’s got to know his limitations. And frankly I’m too tired and exhausted these days to offer anything intelligible about the literary world. But I’ll be back. Do visit the fine folks on the left in the meantime. [ENTIRELY UNRELATED: In other news, it looks like Pearlstine is casting pearls before swine. Not pretty at all. About as cowardly a move as Elia Kazan, if you ask me.] Technorati Tags: vacation, hiatus, debauchery June 28, 2005August 7, 2006 by DrMabuse RIP Shelby Foote Obits As noted elsewhere, Shelby Foote has passed on. Technorati Tags: Shelby Foote June 28, 2005August 7, 2006 by DrMabuse Author Commencement Speeches Speeches 4 Comments Bill Clinton: 1998 Hilary Rodham Clinton: 1969 (as Hilary Rodham) 1992 Richard Fenyman: 1974 Doris Kearns Goodwin: 1998 John Grisham: 1992 Lyndon B. Johnson: 1965 Nora Ephron: 1996 Erica Jong: [Booed this year; anyone have a transcript?] John F. Kennedy: 1962 Stephen King: 2001 2005 Wally Lamb: 2003 Madeline L’Engle: 1991 Ursula K. LeGuin: 1983 Frank McCourt: 1999 David McCullough: 1986 Toni Morrison: 2004 Conan O’Brien: 2000 Anna Quindlen: 1999 2002 Salman Rushdie: 1996 Richard Russo: 2004 Alexander Solzhenitsyn: 1978 (controversy) Gloria Steinem: 1993 Jon Stewart: 2004 Kurt Vonnegut: 1997 (falsely attributed to Vonnegut — Kofi Annan actually spoke at MIT that year) 2004 David Foster Wallace: 2005 Willia