title = "December, 2005 - Reluctant Habits"
description = "In an effort to protest the United States government's recognition of Uzbekistan, a nation that specializes in torturing prisoners to death with boiling water (their names were Elena Urlaeva and Larissa Vdovna) as well as torturing children in front of their parents, I mirror the following documents,  as per the viral stratagems of Blairwatch, in an effort to draw"
full_description = "December 31, 2005December 31, 2005 by Edward Champion Uzbekistan: The United States’ Dirty Little Secret Politics, Torture Leave a comment In an effort to protest the United States government’s recognition of Uzbekistan, a nation that specializes in torturing prisoners to death with boiling water (their names were Elena Urlaeva and Larissa Vdovna) as well as torturing children in front of their parents, I mirror the following documents, as per the viral stratagems of Blairwatch, in an effort to draw attention to Craig Murray‘s memos, information that the UK government is currently trying to oppress: Series of telegrams sent by Craig Murray to UK Foreign Office Copy of legal advice the UK Foreign Office sought Despite all this, the United States has remained one of Uzbekistan’s largest trade partners. We’re talking half a billion dollars (largely weapons) in 2003 and 2004, and some $2.383 billion in investment projects involving American companies and financial institutions. December 31, 2005August 7, 2006 by Edward Champion Of Course, It Helps Not to Be as Humorless as Otto Penzler Keeler, Harry Stephen, Uncategorized Leave a comment Jenny D notes that Harry Stephen Keeler is far from the worst writer in the world. December 30, 2005December 30, 2005 by Edward Champion Meanwhile, Sam Tanenhaus Wastes Column Inches on Another Bitter Joe Queenan Review Book Reviewing Leave a comment Now this is the sort of comparative review that is quite helpful. Sylvia offers a thorough breakdown of four different versions of Jane Eyre. Her verdict? The Norton Critical Edition. (And I should note that I have a thing for the intricately detailed Oxford World Classics.) December 30, 2005 by Edward Champion Of Course, It Could Also Be That Midlist Literary Writers Need Something on the Mantle to Justify Their Poverty Awards Leave a comment Louis Menand offers this interesting overview of book award circlejerks-cum-review of James English’s The Economy of Prestige: “What makes them valuable is the recognition that they are valuable. This recognition is not automatic and intuitive; it has to be constructed. A work of art has to circulate through a sub-economy of exchange operated by a large and growing class of middlemen: publishers, curators, producers, publicists, philanthropists, foundation officers, critics, professors, and so on. The prize system, with its own cadre of career administrators and judges, is one of the ways in which value gets ‘added on’ to a work. Of course, we like to think that the recognition of artistic excellence is intuitive. We don’t like to think of cultural value as something that requires middlemen—people who are not artists themselves—in order to emerge. We prefer to believe that truly good literature or music or film announces itself. Which is another reason that we need prizes: so that we can insist that we don’t really need them. “"
