title = "May, 2007 - Reluctant Habits"
description = "On April 23, the Save the Blogs Campaign turned a new corner.  It decided to jump the shark and then jump it again.  It decided that there were no limits to the number of times that a shark could be jumped over.  Because, quite frankly, in Terre Haute, sharks were hard to find, while maggots were in"
full_description = "May 31, 2007 by Edward Champion “Save the Blogs!” Progress Report Uncategorized 2 Comments On April 23, the Save the Blogs Campaign turned a new corner. It decided to jump the shark and then jump it again. It decided that there were no limits to the number of times that a shark could be jumped over. Because, quite frankly, in Terre Haute, sharks were hard to find, while maggots were in plentiful supply. Here is a list of notable developments over the past few weeks: *I’m in Terre Haute, Motherfucker posted a disturbing JPEG of Richard Schickel in the nude. Geeks are currently attempting to confirm whether the dick in question matches up with Schickel’s. *Maggot, Proud Maggot cut its staff of contributors to the bone. The one man contributing to the blog has been sacked and has been replaced with a logarithm fond of scratching its belly. There are no longer any human contributors at MPM. *The Save the Blogs campaign has discovered YouTube five years after everybody else has. Great plans are afoot. *Fan fiction involving Shannon Byrne, maggots and a naughty episode involving thermal underwear has been uploaded to Usenet. *The Indiana State University has initiated a special journalism class concerning car parts. Dan Wickett is scheduled to guest lecture in November. We will report more pedantic episodes as they come in. We never leave the house. May 31, 2007 by Edward Champion The “Waiting for the Phone Guy” Roundup Uncategorized 1 Comment Wi-fi is in rather abundant supply in the new pad. Alas, I dare not leave for coffee. Phone guys are rather finicky. They give you a three hour block. You leave for two minutes. They never come back. Haggis is excerpting A.M. Homes. On a similar note (and capsule still forthcoming), don’t miss this revealing A.M. Homes interview on Segundo. While it’s certainly true that writing sometimes pays at sweatshop levels, was there any need to turn it into an export processing zone? As Bill Peschel reveals, this selfsame exploiter also trumpets her own achievements as a freelancer. Or is that freeloader? The difference between bullshit and humbug. (via Books Inq.) Litbloggers found in school library. (via Bookshelves of Doom) Stephen Dixon profiled. The Encyclopedia Britannica? Maggots, all of them. (via Scott) Massacres at the Chron. David Ulin has details on Jim Crace’s Useless America. “How to Talk Mean and Influence People” (via Kenyon Review) “Transitory Cities” — the winner of the Boston Review short story contest. (via Laila) Phone guy’s here. More later."
