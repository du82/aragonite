["https://www.edrants.com/2006/11"]
title = "November, 2006 - Reluctant Habits"
description = """
Condition of Mr. Segundo: Feeling triumphant over hepatitis.

Author: Mary Gaitskill

Subjects Discussed: Emotional mood and writing, Marin County, horticultural details, decomposition and decay, dichotomous characters and the gray areas of life, unusual character relationships, the conscious design of Veronica's environments, office environments, the modeling world, maintaining a consistent vision over ten years, rumination vs. urgency in the writing process, Gaitskill's placid"""
full_description = "November 30, 2006November 30, 2006 by Edward Champion BSS #81: Mary Gaitskill Bat Segundo Leave a comment Condition of Mr. Segundo: Feeling triumphant over hepatitis. Author: Mary Gaitskill Subjects Discussed: Emotional mood and writing, Marin County, horticultural details, decomposition and decay, dichotomous characters and the gray areas of life, unusual character relationships, the conscious design of Veronica‘s environments, office environments, the modeling world, maintaining a consistent vision over ten years, rumination vs. urgency in the writing process, Gaitskill’s placid demeanor, distractions, word processors, Francine Prose’s review, ordinary vs. extraordinary narrative, sympathy and didacticism, the text as sympathetic medium between writer and reader, responding to Benjamin Strong’s assertion that Gaitskill isn’t interested in the novel as social or political commentary, ideology, ambiguity, Ayn Rand, favoritism towards optimistic novels, shock value in literature vs. shock value in television, misfits, Irini Spanidou’s championing of truth, and auctorial perception. EXCERPT FROM SHOW: Gaitskill: When I’m reading another writer, even if I feel they’re technically accomplished, if I feel they have an ordinary mind, I am often — I wouldn’t say I totally lose interest. But it’s something that I don’t like to see in a writer. It’s almost like you can write about anything in an extraordinary way, not in a showy way. But to write about something extraordinary, I think, is usually to see it clearly. November 30, 2006December 4, 2006 by Edward Champion Easy Dinero for a Good Cause Eggers, Dave 8 Comments The Rake has called for Eggers to offer an explanation for his critical flip-flop on Infinite Jest and, having failed to hear back from Pynchon for $49, he’s pledged to send a $49 check to 826 Valencia if Eggers responds (the check is pictured below). In fact, I’ll go one step further. I’m in San Francisco. Eggers is in San Francisco. I will be happy to facilitate Mr. Eggers for an appearance on The Bat Segundo Show to talk about his book, What is the What, for a polite and civil conversation. Except on one point. At the end of the interview, he must respond on audio to the DFW question and he must respond to any followup questions by me, however tough and challenging, relating to this subject. Come on, Mr. Eggers, this is easy money for a good cause. All you have to do is explain yourself. Or are litbloggers beneath your munificence? [UPDATE: Matthew Tiffany has pledged another $49. That’s $98, Mr. Eggers, and an opportunity to promote your book. All for an explanation!] [UPDATE 2: The Rake has upped his sum to $109. Hell, this is starting to feel a bit like Jerry Lewis.] [UPDATE 3: Dave Eggers has declined to appear on The Bat Segundo Show.]"
