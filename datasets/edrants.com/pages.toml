["http://www.edrants.com/jeff-vandermeer-is-a-toxic-and-entitled-bully-the-receipts"]
title = "Jeff VanderMeer is a Toxic and Entitled Bully: The Receipts - Reluctant Habits"
description = "Jeff VanderMeer is the Donald Trump of speculative fiction. He is a toxic and narcissistic bully who will harass you if he doesn't get his way. And he will lie through his opportunistic teeth to get what he feels is entitled to him. This essay, which includes a toxic exchange that Jeff perpetuated near the end of 2010, documents the awful relationship I had with Jeff VanderMeeer. And I urge everyone to not have anything to do with this monomaniacal narcissist."
full_description = "December 29, 2024 by Edward Champion Jeff VanderMeer is a Toxic and Entitled Bully: The Receipts Jeff VanderMeer is the Donald Trump of speculative fiction. He is a toxic and narcissistic bully who will harass you if he doesn’t get his way. And he will lie through his opportunistic teeth to get what he feels is entitled to him. This essay, which includes a toxic exchange that Jeff perpetuated near the end of 2010, documents the awful relationship I had with Jeff VanderMeeer. And I urge everyone to not have anything to do with this monomaniacal narcissist. Bullies, Toxic, vandermeer-jeff buly, jeff vandermeer, narcissist, toxic 2 Comments Jeff VanderMeer has had an incredibly toxic and unhealthy obsession with me for nearly twenty years. He has delighted in leading smear campaigns against me — without a shred of evidence — on his blog and on social media. The source of this monomaniacal animus goes back to the fall of 2009. You are about to learn exactly what kind of an abusive and insanely retaliatory maniac Jeff VanderMeer truly is. You are going to learn that, if you cross Jeff, he will declare you an enemy for life and that he will devote any and all resources to impugning you — until either you or him drop dead. And, call me crazy, that ain’t exactly the healthiest relationship you should have with an audience, to say the least. Jeff VanderMeer clearly doesn’t understand that no artist can ever please everyone. But if he shows you exactly how he deals with people who don’t genuflect every ounce of their free will to him, he will be more than happy to weaponize the Internet against them. This is what’s commonly referred to as megalomania. And I think it’s safe to say that Jeff VanderMeer is the Donald Trump of speculative fiction. Four people have informed me that they have also been recipients of Jeff’s deranged zeal and his private backchannel gaslighting, but, as Jeff has had increased success as a writer (particularly after the Alex Garland film adaptation of Annihilation, which dramatically improved the clunky and poorly written novel), his toxic qualities have only grown worse. His hubris has burgeoned to staggering levels and his talent has atrophied. These four people have feared going on the public record and “crossing” him. And I will protect their privacy. Because I don’t want so see anyone harassed by a pathetic 56-year-old bully. But I have no such qualms revealing my own dealings with the disordered basket case known as Jeff VanderMeer. (And, believe me, there are far more emails — worse emails — than what I’ve published below.) I am sick and tired of Jeff VanderMeer constantly manufacturing artificial drama about me. Particularly when I have the receipts about what he did to damage our relationship. I have resisted publishing these emails until now. But I feel that I now have to. Because Jeff VanderMeer is a wanton thug and I don’t want other people to be hit with the same ridiculous abuse. And also because Jeff simply will not stop. And because he will not stop, he has forced my hand. You are going to read the messages of a man who lashed out at me when I was being kind, sensitive, and honest. You are going to see the only writer in 553 episodes who ever felt entitled to another interview on my old literary podcast, The Bat Segundo Show, and who falsely accused me of not being truthful, even though he did not arrange for his books to be sent to me with enough reading time and refused to respect my benevolent honesty. (I did arrange for another interviewer to interview him. Because that’s the kind of guy I am. I also agreed to hang out with him in a diner when he rolled through New York. And we did — at the Westway Diner on November 21, 2009, according to my records — only for Jeff to spend a lot of his time huffing and puffing in his seat, his arms permanently crossed as if he were stopping himself from punching some perceived enemy, occasionally sneering at me, and interrogating me about my podcast.) When I gently told him that I was overbooked and that I didn’t have the time to read his books (as I did with every author) and conduct a proper interview, particularly since I had not even been sent copies in time, he threw a stupendous temper tantrum by email and called me a liar. (I forwarded this exchange to a mutual contact, who informed me that Jeff was prone to this sort of volatile communication style. If only I had known earlier, I would never have booked him.) Jeff made a series of increasingly insane accusations against me. Throughout this entire volley, I did my best to play it cool. But Jeff was emailing me four emails for every one I sent, with some new emails contradicting the previous ones. In January 2022, when I was unemployed and had only about fifty dollars to my name, I received a colossal tax bill that I had no way of paying and went on a binge drinking tear. I’m not proud of my slip. I completely lost my cool, to say the least. Jeff VanderMeer seized the moment and intercepted a draft blog post that I had accidentally published and swiftly deleted in my stupid inebriation to whip up a social media campaign against me. I ignored all the vitriol he had spawned and spent my time cleaning up my act. I spent 150 days sober (not so much as a drop of beer or wine), composed a Western soundtrack for a friend’s audio drama, managed to land a job (and some financial help from friends; everyone was paid back within months, including the tax man), and now only drink modestly on the weekends. My only slip from this quasi-sober regimen was shortly after the devastating election results back in November, in which I fell off the wagon and downed a great deal of Black Label. Again, I’m not proud of that. Fortunately, I swiftly course-corrected and was soon sober and writing again and rallying the troops against fascism. (Nobody’s perfect, although Jeff, who will never admit a mistake, will probably tell you that he’s the exception. This is, after all, the way that toxic narcissists roll.) And these circumstances represented the “bullshit” that Jeff was to “call me out” on. Because he really wants everyone — including the barista who undertoasted his bagel; how dare she! — to worship his “genius.” An elitist sociopathic pig like Jeff couldn’t give two shits about anyone who makes under $50,000/year. He is, in short, one of the bad ones. A few weeks ago, a friend asked me what happened between Jeff VanderMeer and me. And I told him over the phone. The memories reminded me what an abusive asshole Jeff had been to me. And I read Absolution, Jeff’s latest book, on Friday out of morbid curiosity. I was completely stunned and taken aback by how poorly written it was — particularly the third part, in which every sentence contained a “fuck” or two — and it was completely unconvincing. So I wrote a satirical review in the same preposterous and badly written form. (Yes, I was egged on by a few people who thought the results were hilarious.) Jeff, who doesn’t possess a sense of humor and who is used to people kissing his ass, obviously wasn’t pleased. On December 28, 2024, at 11:33 AM — a mere eight hours after the review had been published (do I live in his head rent-free or is he more interested in practicing a literary form of the autocratic gaslighting dominance described by Ruth Ben-Ghiat in her excellent book Strongmen?) — VanderMeer claimed — falsely, as it turns out — that he would not read what I had written. His aim, of course, was to whip up hatred and present himself as the aggrieved “victim.” Any normal author — hell, any well-adjusted human being — would have laughed it off. But, you see, Jeff has always lived for the attention. He loves being the leader in his own cult of acolytes who will never question his “genius.” Seeing that everybody had piled onto his BlueSky post, while I was out and about having a fun time, Jeff spent late Saturday night doubling down on this. Typical behavior. For a guy who doesn’t care about anything I have to say, he certainly seems to have a lot of spare time on his hands doing precisely that! * * * I was initially fond of Jeff. In the summer of 2006, he had sent me a package containing his Ambergris stories. His writing voice back then was quirky, endearing, and filled with a sense of humanism. This was obviously a wacky original who wasn’t getting mainstream press coverage. So, of course, I happily set up a Bat Segundo interview, which aired on August 28, 2006. We proceeded to correspond every so often with each other. I’d often receive a tortured message from him over some bad review. I have literally never known any author who cared so much about his press more than Jeff VanderMeer. And I replied, as I would (and have) to any writer, gently telling him to ignore the bastards. Then, on October 10, 2009, Jeff told me that he was going to be in town and that he wanted to either get together with a small group or do a “no holds barred” Bat Segundo interview. It was an extremely weird email that made me feel uncomfortable. At the time, I had already booked too many author interviews and was considering ending the show because I was burned out. And I politely informed him that I couldn’t do the second option, but that I was amenable to the first. I never wanted any guest to feel cheated. I gave my A game to everyone. This meetup was the Westway Diner meeting I have already mentioned. But sometime in December 2009 — in a post that Jeff has conveniently deleted and that cannot be found through the Wayback Machine — Jeff posted an unsettling post on “leverage” dripping with unbridled resentment for anyone who had spurned him. I had reason to be concerned. For Jeff had written about me in Booklife, viewing me in crassly mercantile terms that made me feel deeply uncomfortable. Thus began a correspondence in which Jeff lost his mind, which can be read in full below. Pay attention to the unhinged accusations that come out of nowhere and Jeff constantly monitoring my Twitter feed for any perceived sleight. (There was none.) Pay further attention to the extremely demented way in which Jeff demands fealty and puts forth conditional terms and the way he sees “threats” when none are there. This man was not well then, by any means. And I don’t think he’s improved in the intervening years. And also observe how understanding I was as Jeff was losing his shit and going well out of his way to find any new means of insulting me. Then again, for all I know, he was feigning an act of madness to manipulate me. That would certainly be on brand. Nobody, after all, ever questions the mad “genius.” Date: December 29, 2009 5:49 PM To: Jeff VanderMeer From: Edward Champion Jeff: While I can certainly see where you are coming from, there are significant problems with your approach to leverage, displayed in your post and (to some degree) in Booklife. While I didn’t find your stance as creepy as Jessa Crispin did, what I read is this: You are essentially viewing readers, advocates, and fellow people in the community as Bernaysian tools, completely ignoring the fact that they have inner souls. Yes, people can be advocates for your work. But they are often MORE than advocates. Discounting the rabid fanboys who wish to take up every spare whit of your time, well-adjusted people have thoughts and feelings and may not always be in the position to give you what you hope for. Their perceived failure may not necessarily be miserly and, as you point out in the comments, it may not simply be part of their personalities. But connections among people shouldn’t involve some permanent ledger in which you are constantly keeping a tally, which is how it’s coming across to me in your post. That’s just not a healthy way to carry on with people, either personally or professionally. I’m sure you know that, but I bring this up because it simply isn’t reflected in your blog post. If someone decides not to give you the press or the attention that you feel you deserve, there may be other extenuating circumstances existing outside the ones you’re speculating upon. Most of the time, simply ASKING the other person what’s up will clarify things. Direct communication, as we all know, is far healthier than idle speculation about a person’s motives. That way lies paranoia and crazy one million word diaries. To present my own circumstances during your last tour: After doing anywhere from five to eight shows a month almost nonstop for four years, I was understandably burned out. There were many other contributing factors (being in a very shaky financial position, having a particularly humiliating stint with _______, and overcoming these considerable difficulties to continue work on the novel-in-progress, which has proven to be more fun and more challenging than I could have anticipated: thankfully, all this has been rectified in recent months). All this was going on in October (which was when you emailed me about it) and November. This is why I did not interview you for Segundo. I don’t wish to subject any author to a stale interlocutory approach or give any author a subpar experience because of any personal distractions. It isn’t fair to them. It isn’t fair to the listeners. (Segundo is now a weekly affair starting in 2010, which is one of my community services. I had to figure out a way to keep it going, because I know that it’s needed. Particularly since Silverblatt, despite remaining optimistic, has informed me that Bookworm is on thin ice.) The interview I told you about in person had actually been set up a few days before we met. Additionally, I would have gladly attended your New York appearance with Jeffrey Ford (for I dig both of you guys), had not __________, an individual who has gone out of his way to spread false and inaccurate information about me, been at the helm. Removing myself from the situation was a way for me to avoid any unpleasantness that might have infringed upon the undoubtedly pleasant proceedings, which were certainly not about me. I was also never sent copies of FINCH or BOOKLIFE, although I did manage to intercept the copy of FINCH that you sent Sarah. (KOSHER actually arrived a few days ago, and I look forward to reading this.) Given these multiple circumstances, there were understandable hiccups that had little to do with you. Best I could do was a friendly meetup. And, in fact, I canvassed Eric on interviewing you before he was in touch with Matt. I drum all this up in the unlikely event that you may be obliquely corralling me within your category of miserly people, but also to inform you of the practicalities, limitations, and efforts of one person to deliver coverage to numerous people under dire conditions. When you make unspecified accusations (without citing a single example) about people being miserly with their leverage, I find this to be an inconsiderate position — possibly one that you didn’t intend. The fact that it is buttressed by the call for more people to take honest and c"
