title = "June, 2004 - Reluctant Habits"
description = "To the foolish fop who dared to defend my honor at Maud's, let it be known that I am a proud crank, a consummate dunce, and run such a fever that neither a team of doctors nor infinite cases of quinine can stop me from babbling like a raving loon.  There's no honor denying these silly misinterpretations.  I"
full_description = "June 30, 2004 by DrMabuse A Proud Crank Uncategorized 4 Comments To the foolish fop who dared to defend my honor at Maud’s, let it be known that I am a proud crank, a consummate dunce, and run such a fever that neither a team of doctors nor infinite cases of quinine can stop me from babbling like a raving loon. There’s no honor denying these silly misinterpretations. I get enough of the jejune (nod to Birnbaum) PC shit when I visit Berkeley. So please: I urge all able Reluctant readers to flurry epithets posthaste! Back to my temporary Bastille. June 28, 2004 by DrMabuse Why Walter Kirn Should Take a Vacation Uncategorized 2 Comments Exhibit: Kirn’s review of David Foster Wallace’s Oblivion. Number of words in review: 1,399. Number of words quoted from book in review: 186 Percentage of quoted excerpts as part of review: 13% Approximate fair use percentage under dispute in the infamous Gerald Ford/Nation dust-up: 13.3% Number of times “anxious” or “anxiety” is mentioned: 2. Number of parenthetical asides: 6 Number of onerous Tom Swify adverbs (not counting quotes): 17 Number of prefix-laden non-words: 7 (“maladapts,” “decontextualized,” “hyperfocused,” “microtextures,” “superbrain,””hyperarticulate,” “overstimulated”) The Pain Reliver Commercial Homage Award: “Data-dazed. Cybernetic. Overstimulated.” Back to hiatus. June 24, 2004 by DrMabuse Hiatus Uncategorized 3 Comments Due to life circumstances, we’re pretty much done here until the 4th. We’re also still behind on our email. So apologies to all on that score. We’ll get back to all of you when the DSL kicks in at the new place. (In fact, we’ve already started on the replies.) In the meantime, check out this latest John Barth interview and feel free to visit some of the fine folks on the left. [UPDATE: And before I poof away completely for a week or so, I’d be remiss if I didn’t mention Terry’s self-reflective essay on living day(s) with nothing to do, an existential state that the Reluctant hungers for, but that seems a far off day to dream about.] [ANOTHER UPDATE: Since people apparently want to know, my take on Fahrenheit 9/11 is this: It doesn’t present a solution. If you’ve been following the news, it doesn’t present much in the way of new information. The marine recruiters are creepy. The singular trooper governing Oregon is sad. It makes great satirical use of found footage, but if it’s meant to serve as agitprop, then why doesn’t the film have the conviction to lobby for Kerry? I found the story of the conservative Democrat who lost her son to be heartbreaking, but I felt as if this interesting side story was lost within Moore’s deliberate pandering. Three stars. Joe Bob says check it out, regardless.]"
