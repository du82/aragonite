title = "August, 2005 - Reluctant Habits"
description = """
Okay, we're doing our best to balance the tragic with the comic (one of the reasons we extended the photo contest).  Apologies for the inconsistency in tone, but it keeps us sane.  So here's the latest rundown.


Blog transforms into first-person account of what's happening in New Orleans.  Sounds like the police infrastructure has turned into Rio Bravo."""
full_description = "August 31, 2005August 31, 2005 by Edward Champion Katrina Headlines XXII Katrina 2 Comments Okay, we’re doing our best to balance the tragic with the comic (one of the reasons we extended the photo contest). Apologies for the inconsistency in tone, but it keeps us sane. So here’s the latest rundown. Blog transforms into first-person account of what’s happening in New Orleans. Sounds like the police infrastructure has turned into Rio Bravo. (via MeFi) Multiple telethons prepared to raise funds for Katrina victims. NOLA: Looters getting closer to heavily populated areas. Radio used to inform people of horrors. Thousands now belived drowned; martial law in effect. WWL blog is reporting that buses are arriving early at Astrodome, some of them renegade. Craig’s List New Orleans flooded with housing offers. Horrific reports from within the Superdome: people sleeping in urine and peeing on the floor. T-Mobile offers free wi-fi. New York Times: “Waiting for a Leader.” Storm Digest reminds us that typhoid and cholera are next. Engineers struggle to find ways of “unwater” New Orleans (via < Brendan Loy, who is doing a great job). Democratic Senator Frank Lautenberg has started the fight about the Bush Administration’s late response. Maud points to this article of New Orleans literary landmarks. 500 complaints of gas gouging in IL. In Florida, thieves are posing as FPL workers and stealing cash from widows. New York Yankees and NFL gives $1 million to aid. Jack Shafer wants to know why race and class haven’t been mentioned. August 31, 2005August 31, 2005 by Edward Champion Naughty Reading Contest Deadline Extended to Sept. 2 Naughty Reading Leave a comment Because you folks have been sending us some fantastic photos and because we (among several others) await an entry from a certain literary hunk in Oakland (there have in fact been private requests sent to us!), we’ve decided to extend the Naughty Reading Photo Contest until this Friday. In particular, we’d like to see more men submit photos to even the gender playing field (as well as provide polymorphous opportunities for folks of varying levels of naughtiness). So have at it, shutterbugs! You’ve got two more days after tonight and then you, the readers, will get to vote among the three finalists. Who will be the lucky person to win the $20 Powell’s Gift Card? Could it be you? To see all entries submitted thus far, we’ve categorized them all under “Naughty Reading” for you."
