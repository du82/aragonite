["https://www.edrants.com/2003/12/page/2"]
title = "December, 2003 - Reluctant Habits - Page 2"
description = "a cultural forum in ever-shifting standing"
full_description = "December 19, 2003August 9, 2005 by DrMabuse Sometimes, Bright Blue is Just Bright Blue Film, New Yorker Anthony Lane on internal practice: “I tend to send my copy in on deadline, which by New Yorker standards is tacky. It has to go through three or four proofs. The fact-checkers proof; the grammarians proof. And it is amazing. Someone does go to see the film, to make sure I’m not lying. If I’m reviewing a Tim Burton film and I say that Ewan McGregor’s wearing a bright blue shirt, they’ll say to me, ‘It’s more like bright turquoise’. But you should get it right, especially if you’re going to have some fun with it. Otherwise it’s cheating. The New Yorker is the only place in the world where you can pull a piece to change a comma to a semi-colon. It’s a haven for the pedant. I love it.”” December 18, 2003August 9, 2005 by DrMabuse Quick Links Publishing Industry, Roundup, Writing Apparently, self-publishing at the office pays off. Bruno Perara wrote a novel called Little Murders Among Partners. The book portrayed his co-workers for what they were. The firm fired him. But a mediation court ruled that Perara was unfairly dismissed and awarded him £50,000. So if you can’t get that lucrative advance, I suppose there’s always the unexpected rewards of the middleman. Mao’s little red books still bear influence. Edwin Abbott’s Flatland has been mined once again for inspiration (after Rudy Rucker’s Spaceland) — this time, for VAS: An Opera in Flatland, which takes a biogenetic approach. For those interested in the original Flatland, public domain has effected its availability. Fun stuff, if you never read it. (via The Complete Review) B&N fiction buyer Sessalee Hensley is drunk with power, albeit unknowingly. Even worse, all thrillers are inexplicably held up to a Barbara Kingsolver litmus test. And, apparently, writing is good for your well-being. Too bad that your life expectancy is slim if you want to be a full-time professional. Go figure. (via Moorish)"
