["http://www.edrants.com/segundo/archive"]
title = "The Bat Segundo Archive – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "Manuka Honey on February 15, 2025 at 9:07 am At this time I am going away to do my breakfast, afterward having my breakfast coming over again to read other news.| The Bat Segundo Archive by edDecember 10, 2007September 26, 2020 Notes from a Brooklyn Bunker: In the summer of 2020, while editing The Gray Area, Edward Champion re-emerged from podcasting retirement to begin a series of ten to twenty minute improvised riffs during the pandemic on a variety of topics. There were thirty-four episodes in all that aired through September 2020. These wre removed on the morning of September 26, 2020. The Bat Segundo Show Except as otherwise noted, all interviews are conducted by Our Correspondent, an intrepid and sometimes excitable journalist sometimes answering to the name “Ed” who often asks unusual, detailed, and highly specific questions of authors. The interviews are all conducted in person. Books are read in full before talking with each author. Shows from 2014 551. Merritt Tierce: There are 2.4 million waiters and waitresses now working in America. Why have our narratives failed to confront the realities of working in a restaurant? Merritt Pierce, author of Love Me Back, joins us to discuss working-class narratives, the male gaze, abortion, and women as second-class citizens. This show also includes a strong critique of 2 BROKE GIRLS and one of the most startling on-air gaffes in Bat Segundo’s history. (MP3) 550. The Cultural Redemption of Stefan Zweig: Anthea Bell and George Prochnik: This special two hour episode of The Bat Segundo Show details the life and work of Stefan Zweig in considerable detail. It may be the most epic radio program ever devoted to Stefan Zweig. It includes interviews with translator Anthea Bell and George Prochnik, author of The Impossible Exile. (MP3) 549. Amanda Vaill: Martha Gellhorn and Ernest Hemingway headed to Spain to help the Loyalists during the Civil War. Gellhorn was to transform into one of the 20th century’s best war correspondents. Hemingway needed to have his romanticism crushed to write a masterpiece. They are two figures in Amanda Vaill’s Hotel Florida. This conversation examines how the Civil War changed not only the trajectory of Spain, but the future of world culture. (MP3) 548. Mimi Pond : Cartoonist Mimi Pond spent a good chunk of 1978 working as a dishwasher and a waitress in an Oakland diner. Thirty-six years later, she’s collected her experiences in the graphic novel, Over Easy. This 40 minute conversation examines that experience, looking into the difficulties of accurately portraying that era in a politically correct age and how a crisp glimpse into working-class life is generally more reliable than nostalgia. (MP3) 547. Joanna Rakoff: Joanna Rakoff spent 1996 working as an assistant for the Harold Ober Associates, overhearing the likes of J.D. Salinger and Judy Blame talking shop. This 75 minute conversation, which discusses Rakoff’s memoir My Salinger Year, gets into some of the underlying privilege and protective family dynamics which led Rakoff to get a later start as an adult. (MP3) 546. Paula Bomer III: Author Paula Bomer has dedicated her fiction career to staring inside the abyss and seeking the human. We discuss her new short story collection, Inside Madeleine, and discuss everything from Flannery O’Connor’s notion of the grotesque, how sex defines relationships, boarding schools, how modest surrealism can reveal urban identity, and scatological moments in high literature. (The episode’s introduction includes some thoughts on the recent passing of Maya Angelou.) (MP3) 545. Porochista Khakpour II: In this wide-ranging 79 minute conversation, Porochista Khakpour discusses how she fused the romantic with the grotesque for her second novel, The Last Illusion, birds as an inevitable cultural symbol, growing up as an Iranian immigrant, quirky and pragmatic attitudes to death, Kafka and Kierkegaard, and academics who misinterpret authenticity, (MP3) 544. Nikil Saval: Was there ever an age in which the office provided reasonable security for the worker? Is it possible for the office worker to be given respect and adequate compensation in the 21st century? We talk with Nikil Saval, author of Cubed, to figure out how a system designed to pit office workers against each other went wrong. It turns out that misguided philosophy, austere architectural developments, and a carefully manufactured belief culture against organized labor are all part of a very complicated narrative we all take for granted. (MP3) 543. Evie Wyld: Evie Wyld is the John Llewellyn Rhys Prize-winning and Granta 20 author of All the Birds, Singing — a novel that is arguably more alive than most of the dull literary books about flatware and chalices at pretentious dinner parties. Our conversation gets into how work defines even the natural landscape, the relationship between insects and humans, and why kangaroos are quite dangerous. (MP3) 542. Yiyun Li II: In this vivacious chat with MacArthur fellow Yiyun Li (and on the occasion of her latest novel Kinder Than Solitude), we discuss nothing less than the mysteries that humans impose upon the universe, Li’s secret life as an accordion player, why poison is the most passive-aggressive murder technique, how Americans are exacting more care in discussing the uncomfortable, and how storytelling can encourage people to talk about the truth. (MP3) 541. Ben Tarnoff: More than a century after his death, Mark Twain is often portrayed as a jolly and avuncular figure. Yet the truth is that Twain was a savage wit and an incendiary figure, and it took this free-spirited iconoclasm to push expression forward. We talk with Ben Tarnoff, author of The Bohemians, to discuss how California writers (including Twain, Bret Harte, Charles Warren Stoddard, and Ina Coolbrith) defied the East and reinvented American literature during the 1860s. (MP3) 540. Islamophobia, Extremism, and the War on Terror: Arun Kundnani: Twelve and a half years after 9/11, Islamophobia remains alive and well. Where did it come from? Why does it perpetuate in American and British culture? And what effect does it have on our democratic values? To get some answers to these questions, we talked with Arun Kundnani, author of The Muslims Are Coming. It turns out that prominently positioned people continue to reinforce Muslim stereotypes, encouraging law enforcement agencies to adopt flawed radicalization models that are not predicated upon reality. These prejudicial policies have caused innocent Americans, whose only crime is to practice Islam, to be harassed, needlessly harangued by authorities, and falsely imprisoned. This 67 minute conversation investigates these issues at length. (MP3) 539. Dinaw Mengestu: MacArthur Fellow Dinaw Mengestu’s novels have been needlessly categorized as “immigrant fiction” when his work is about so much more. On the publication of his third novel, ALL OUR NAMES, Mengestu unpacks these issues with us, discussing how journalism helped him to peer into revolutionary turmoil, writing about quiet African immigrants, the American perspectives that are often overlooked, the depths of emotional trauma, and contemporary fiction’s relationship with the postcolonial. (MP3) 538. Dorthe Nors, Save NYPL, and Blake Bailey: In this triple-decker edition of Bat Segundo, we talk with author Dorthe Nors about Denmark, emotional connections to animals, the dangers of self-destruction and how folks songs fused with Swedish existentialism can produce an original voice, investigate Mayor Bill de Blasio’s silence on saving New York libraries and report on a protest, and talk with Blake Bailey about switching from literary biography to memoir. (MP3) 537. Julia Angwin: Why are we so consumed with providing every moment of our lives to a faceless corporation who will share this data with other companies without our consent? What makes the NSA worse than the Stasi? And to what extent are we determined to become enslaved by convenience? We talk with journalist Julia Angwin, author of Dragnet Nation, about these dilemmas, the inevitability of mutually assured disinformation, and why the black helicopter lifestyle is becoming more legitimate. (MP3) 536. Dave Itzkoff and Translated Literature: Mad as Hell: This one hour program looks into two “mad as hell” scenarios. We talk with journalist Dave Itzkoff about Mad as Hell, the making of Network, Paddy Chayefsky’s colorful personality, and why something that seemed so absurd forty years ago became so real. We also investigate a controversy at Open Letter Books which may reveal an emerging ecosystem in translated literature of smaller publishers being abused by agents on the make. That segment features Open Letter’s publisher Chad Post, Scott Esposito, and Michael Orthofer. (MP3) 535. Sarah Churchwell: Nearly ninety years after its publication, The Great Gatsby remains a fluid and endurable masterpiece. In Careless People, Sarah Churchwell tackles F. Scott Fitzgerald’s great novel with an approach somewhere between an avid reader and a obsessive scholar. This vivacious and jampacked conversation, which covers everything from old menus to famous murders to the interplay between Scott and Zelda, reveals that Gatsby is so rich that just about any literary interpretation is possible. (MP3) 534. Jenny Offill: If we leave out a few words, how does the story change? How are human instincts for speculation encouraged by a minor elision? Who really knows the story? Jenny Offill explores these ideas and more in her new novel, Dept. of Speculation. We discuss the virtues of twisted quotes, the narrative frameworks that can be extracted from poetry, the risks of self-consciousness, and the importance of a contrarian impulse. (MP3) 533. Diane Johnson: Diane Johnson is best known for her comic novels centered around France: Le Mariage and Le Divorce. But before all this, many years before, she wrote a darker novel called The Shadow Knows that attracted Stanley Kubrick’s notice. Johnson has published a new memoir, Flyover Lives, that details her thoughts on her ancestors, growing up in the Midwest, her life, and her work. Our vivacious and variegated chat gets into the current state of Franco-American relations, forgotten writers, the Methodist practice of being frightened into being good, America’s migratory impulse, the demise of the American rail system, foodies, California history, and the considerable references and ideas that Johnson and Kubrick consulted for their work on The Shining. (MP3) 532. Okey Ndibe: Nigerian fiction writing is stronger than ever. But how does Nigeria’s protean identity, often described as “stranger than fiction,” affect contemporary fiction? In this one hour conversation, we hash out these questions with Okey Ndibe, author of Foreign Gods, Inc., discussing Nigeria’s census problems, its many religions and languages, and how all of these fascinating complexities are often overlooked by Americans. (MP3) Shows from 2013 531. Victoria Wilson: Barbara Stanwyck was one of the most legendary Hollywood stars that the 20th century has ever known. Veteran editor Victoria Wilson, author of a very large biography on Stanwyck, reveals Stanwyck’s remarkable work ethic, her toughness, her shyness, how Zeppo Marx encouraged her to go into comedy, the moralistic assault on unmarried couples living together, and nude appearances at surprise birthday parties. (MP3) 530. Blake Bailey II: Literary biographer Blake Bailey and Our Correspondent may be the only two people in the United States who have read everything Charles Jackson has published. Who was he? Well, in 1944, Jackson wrote The Lost Weekend — a pioneering masterpiece that was among the first to depict the devastating effects of alcoholism in fiction. But seven decades later, Jackson has been largely forgotten, outshadowed by the Billy Wilder movie. We spend 73 minutes pinpointing Jackson’s forgotten legacy and considering the risks of waning literary posterity. We also talk about Bailey’s work on the Philip Roth bio, as well as his forthcoming memoir, The Splendid Things We Planned. (MP3) 529. Alissa Nutting: Alissa Nutting’s Tampa was one of the most controversial books of 2013. It is also one of the best books of the year. In this bold and variegated 76 minute conversation, we reveal how Celeste Price was created, the torment it brought Nutting in life and after publication, and why America remains needlessly hostile to fictitious viewpoints which dare to reveal the truth about human aberration. (MP3) 528. Elissa Wald: What happens when you meet somebody and all of your assumptions proved to be wrong? That’s precisely what happened with this conversation with Elissa Wald, author of The Secret Lives of Married Women. She’s a novelist who wrote a noir novel without reading any noir and who depicted class violence without being conscious of it. The result is one of the strangest conversations we’ve ever aired, a chat that absolutely fails (which is entirely our fault) before hobbling back to an unanticipated grace. (MP3) 527. Simon Winchester II: In 2007, we aired an infamous program with Simon Winchester, in which he argued with us over the finer points of local history. His new book, The Men Who United the States, shifts the action to a bigger stage, taking on the entire United States. With greater historical stakes, the affable Englishman returns for a conversational rematch six years later. This program features an affably argumentative and cheerfully divergent chat between two wildly energized men united by the common belief that history is always worth returning to. (MP3) 526. Wendy Lower: More than seven decades after World War II, we’re still deeply uncomfortable about the idea that women under the Nazi regime committed barbaric acts. We talk with Holocaust scholar (and National Book Award finalist) Wendy Lower about the realities she confronts in her new book, Hitler’s Furies. How much are the women who were socialized under Nazi policies to blame? Why did the postwar courts allow these women, some of whom massacred children, to return to society without consequence? (MP3) 525. Terry Teachout II: Duke Ellington was a composer who ranked alongside George Gershwin, influencing everyone from Jimi Hendrix to Thelonious Monk. We talk with biographer Terry Teachout about Duke’s legacy, his sexiness, his philandering, his politics, the way in which he exploited poor Billy Strayhorn, and his indelible hold on American music. (MP3) 524. Eleanor Catton: What if a 900 page novel incorporated Zeno’s dichotomy paradox, the golden ratio, set its action in 1865 and 1866 while aligning character temperament to astrological signs and planets, and incorporated massive strands of storytelling? Well, The Luminaries does just this. In this wide-ranging 71 minute conversation, we talk with Booker Award-winning novelist Eleanor Catton about the benefits of an overly planned structure, considering reader inten"
