title = "April, 2006 - Reluctant Habits"
description = "a cultural forum in ever-shifting standing"
full_description = "April 28, 2006April 28, 2006 by Edward Champion Excerpt from Upcoming “Atlas Shrugged” Script Literary Adaptations 2 Comments Starpulse: “After years of delays, Ayn Rand’s famous novel ‘Atlas Shrugged’ is being made into a feature film starring Brad Pitt and Angelina Jolie, according to media reports. Lionsgate Films bought the rights to the film version of the 1957 novel, considered in many polls to be one of the most influential books in history. According to Hollywood trade paper Variety, the Mr. And Mrs. Smith co-stars, who are both fans of the Russian novelist, would play the lead roles of Dagny Taggart and John Gault. [sic]” Return of the Reluctant has obtained an exclusive excerpt of the upcoming Atlas Shrugged script, which was reportedly written by Brad Pitt and Angelina Jolie themselves. INT. TAGGART TRANSCONTINENTAL OFFICE — DAY Taggart is bent over the desk. Galt is behind her. GALT Your name is neither Jen nor Aniston. She is not selfish enough. TAGGART That’s why you came to me. It is the natural way of things. GALT If you do not give into your latent selfish desires, I will impregnate you again. Say it! Say it! TAGGART Who is John Galt? GALT That is quite a witticism. Again! Galt handcuffs Taggart’s wrists. GALT I can’t hear you. If you do not have a response, I must ask you to whimper. I am an intense man, Dagny. Do not test me. TAGGART Who is John Galt? GALT Do you feel pain? TAGGART Yes. Pain is the best thing for America. Pain is the best thing for me, and therefore for America. We can build railroads. We can accumulate capital. GALT I am satisfied that you have come to terms with this concept. We can do more. This is a battle of wills. Who’s your daddy, Dagny? TAGGART John Galt! (via Bookdwarf) April 28, 2006 by Edward Champion Equivocation: Are These Folks Really Aware? Language Leave a comment Terry Teachout offers some interesting thoughts about the way politicians. publicists, and people for the most part fail to state what’s really on their mind, tying it all in to one of my favorite Orwell essays. I’ll agree that this is a peculiar problem and I’ll be the first to confess that I sometimes fall prey, in an altogether different way, to the manic possibilities of language. Often, something I should probably utter in a sentence is somehow stretched into three. Thus, despite repeat readings, Orwell’s valuable suggestions fail to latch into my noggin. I would differ slightly with Teachout that these tendencies are “anti-human” or even unknowing. While it is true that politics, office or otherwise, often transform adept conversationalists into utter bores, it is, nevertheless, a very human impulse to seek approval by speaking with a sanctioned tongue. The results may be machine-like and the level of inventiveness may be slim to none — particularly with gerund-happy passive voice. But I think it’s a mistake to underestimate the way that speakers of the Time spokesperson variety, having mastered this dreaded equivocal-speak through careful practice, then go on to speak this way without effort or awareness. That’s the truly frightening thing here. Which is why I’m happy to raise my hand as a rambler aware of his problem. So should we all. Guilty as charged, m’lord. And I’ve been looking for a twelve-step program for many years where I can weep in front of other elocutionary flunkies and declare that I (and they!) can beat the rap."
