title = "3. Fuel to the Fire (The Gray Area) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "3. Fuel to the Fire (The Gray Area) Radio Play, The Gray Area by edJune 6, 2017 An artisanal mustard retailer from Astoria finds herself in a strange realm with the ability to set things on fire. Meanwhile, Ed Champion continues his investigation into Miss Gaskell’s disappearance, meeting a woman in mourning who may hold the answer to his own strange curse. (Running time: 19 minutes) Written and directed by Edward Champion CAST: Maya: Noelle Lake Fire: Samantha Cooper The Knight in Several Universes: Austin Beach The Disgraced Villager: Pete Lutz The Vengeful Field Hand: Sarah Golding Villagers: John Xavier Miller III, Michael Charles Foote, Hans Detle Sierck, Tao Yang, Jim Kampfil, Tim Torre, and Kilgore Lehrer Ed Champion/Johnny: Edward Champion Edited by Edward Champion Foley Sources: Edward Champion, the_toilet_guy (CC), Snapper4298 (CC), CGEffex (CC), soundmary (CC), Dynamicell (CC), Huggy13ear ()CC), YleArkisto (CC) Music: “The Long March Home” by Tim Juliano (licensed through NeoSounds) and “Local Forecast – Elevator Music” by Kevin MacLeod (CC.) Art: Kyle Nishloka (CC) Special thanks to Sacha Arnold, Matthew Boudreau, Jason Boog, Richard Brooks, Christopher Byrd, Claudia Berenice Garza, Jen Elyse Feldman, Pam Getchell, Jen Halbert, Gabriella Jiminez, John Osborne, Rina Patel, Scott Phillips, Michael Saldate, Marc Anthony Stein, Fiona Thraille, That Podcast Girl, Georgette Thompson, Jack Ward, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this episode. Please be sure to also listen to LucyD Podcast, a new supernatural audio drama, and Rick Coste’s The Fiona Potts Interview if you enjoy audio dramas about interdimensional portals. http://traffic.libsyn.com/grayareapod/fueltothefire.mp3Listen: Play in new window | Download (Running Time: 19:15 — 22.8MB) artisanal mustardastoriaaudio dramadancingfantasyfiregermangodhistorianmourningmustardwar Post navigation 2. Brand Awareness (The Gray Area)4. Loopholes (The Gray Area) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
