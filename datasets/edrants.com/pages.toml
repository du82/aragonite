["https://www.edrants.com/2006/09"]
title = "September, 2006 - Reluctant Habits"
description = "I am having fun in Wisconsin.  Or am I?  You make the call."
full_description = "September 30, 2006 by Edward Champion For the Record… Uncategorized Leave a comment I am having fun in Wisconsin. Or am I? You make the call. September 30, 2006September 30, 2006 by Edward Champion Enemy Combatants Uncategorized 4 Comments Because I am a loyal American, I took the following pictures of individuals who I believe are “enemy combatants.” While I have no proof as to their terrorist potential, I did observe these shady characters squawking by a lake, and I believe that they intend to fly south and take down America during migration season. One can never be too sure of terrorists in this climate, even though it is relatively calm here in Wisconsin and the people are nice. (Why are they so nice here in Madison? Could it be that they are hiding something?) I have reported these suspects to the Pentagon, who I understand will arrest these suspects without habeas corpus for the safety of America. I also understand, now that the United States disregards the Geneva Conventions, that these suspects will be tortured. I look forward to enjoying them at a forthcoming dinner I have scheduled next week with Donald Rumsfeld. September 30, 2006September 30, 2006 by Edward Champion How to Meet Laura Lippman Uncategorized Leave a comment One would think that flying out 2,000 miles would have been good for at least a little more than hello. However, having a Y chormosome and somehow being in attendance at Laura Lippman‘s bachelorette party (along with other men), I’m sure there were extenuating circumstances. Upon entering the party, several ellipitical layers of people were seated and standing around a circle of couches. I was, I suppose, an unexpected mosquito planting himself on the outer epidermis, with Ms. Lippman herself protected by a group of loyal queen bees quaffing swank beverages. Undaunted, I wrote a note to Ms. Lippman, expressing my congratulations, with at least one adept witticism and the hope that I might engage in a brief chit-chat of no more than two minutes. The note was conveyed from one hand to another to another, and eventually Ms. Lippman read the note and cocked her head left and right for this mysterious “Ed Champion.” I offered a broad smile and an inaccurate though heartfelt form of semaphore. But this, however, was not enough. Ms. Lippman soon became deeply embroiled in a conversation that caused her to raise her forehad in excitement. And very soon, I was contriving a strategy with a few mystery authors on how to deliver ourselves into the inner circle. I gave up rather quickly on this exercise. I was not, after all, at a cotillion dance. And the mystery writers abandoned me without notice. And not long after, the snappy dirty martini I had imbibed had reached the micturition phase. I fled to the restroom and, while waiting in line, the one and only Laura Lippman and friend had reached a similar stage. And I was able to throw myself forward and make Ms. Lippman’s acquaintance, while considering the vagaries of her bladder. Upon our respective descents from the bathroom, there then began a rather fey descant and pretty soon I was being steered into the inner circle, where I was being urged to meet everybody, heaven knows why. I am not a person to boast, but I could not let this fast-track delivery into the inner circle go unobserved by the mystery authors who had abandoned me without notice. But I decided instead to take the high road that evening, thinking of the disreputable long-term path I could follow in the morning by mentioning all this on my blog. But let this tale serve as a parable. The public restroom cannot be underestimated. Indeed, one might declare it the great social equalizer."
