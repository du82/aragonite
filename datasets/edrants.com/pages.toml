full_description = "5. Compassion Fatigue (The Gray Area) Radio Play, The Gray Area by edAugust 1, 2017 Emma is a top-notch psychiatrist who can change the lives of the most difficult patients imaginable. But there’s a great personal cost to her formidable talents that she’s not telling anyone about, an internal torment eating away at her inner life that she’s hiding from her patients and her professional peers and that a quiet survivor of an abusive relationship may just have the answer for. (Running time: 25 minutes) (This story contains intense and emotionally disturbing scenes that may unsettle some listeners. Listener discretion is advised.) Written and directed by Edward Champion CAST: Emma: Colette Thomas Jenna: Devony DiMattia Jack: Jack Womack Gordon: Michael Saldate Receptionist: Zachary Michael Subway Preacher: Albert Hastler Music by Thomas Ragsdale Houston Person, “As Time Goes By” (courtesy of Free Music Archive, CC) Sound Design and Editing by Edward Champion Foley Sources: Edward Champion and nofeedbak (CC). Subway Sounds Recorded on Location in Brooklyn, New York Special thanks to Sacha Arnold, Austin Beach, Christopher Byrd, Claudia Berenice Garza, Pam Getchell, Jen Halbert, Gabriella Jiminez, Argyria Kehagias, Pete Lutz, Lauren Nelson, John Osborne, Rina Patel, Marc Anthony Stein, That Podcast Girl, Tim Torre, Georgette Thompson, Jack Ward, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this episode. I would also like to thank the psychiatrists and compassion fatigue experts who I spoke with on conditions of anonymity for their considerable assistance with this story. Thanks for listening! http://traffic.libsyn.com/grayareapod/compassionfatigue.mp3Listen: Play in new window | Download (Running Time: 25:15 — 34.8MB) audio dramacolette thomascompassion fatiguedevony dimattiagriefjack womackmichael saldatepsychiatristptsdrelationshipstraumazachary mic