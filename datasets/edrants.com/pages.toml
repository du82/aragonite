["http://www.edrants.com/reluctant/000546.html"]
title = "Edward Champion's Return of the Reluctant: Olivia Goldsmith -- Gone"
description = '"often bitterly funny" -- Newsday'
full_description = "Olivia Goldsmith has passed away. And I'm angry. This did not have to happen. Goldsmith was only 54. Fifty-four. One of the first female partners at Booz Allen Hamilton. And then a not-too-shabby fiction career. But the circumstances of her death were this: she was about to undergo plastic surgery. But she felt (or was it her editors or her agent?) that she had to live up to some pinnacle of perfection. She needed a flawless face, a mug devoid of wrinkles for the photographers, an image devoid of any signs that, hey, she was 54. The great irony was that she had skewered this kind of thinking in her novel, The First Wives Club. But to hell with the merits of her writing, to hell with the fact that she had no problem savaging mid-lifers in her books. No, the important thing was the plastic surgery. There was the real world and the world within her fiction. And for Goldsmith, the real world was far crueler. Just as she was about to go under, she had a violent reaction to the anesthesia, which incapacitated her. And now she's dead. All because of an image, all because of a stinkin' author photo, all because we still judge books by their back covers rather than their innards, and all because civilization cannot stop pestering, whether deliberately or subconsiously, the older, the fatter, the more wrinkled, the more infirm, the non-Caucasian, and anybody else who doesn't fall into the harsh physical virtues dictated by Vanity Fair and People. Olivia Goldsmith's death isn't just a terribly premature end for a writer who was fun. It also shows that ideals have spiraled completely out of control. Or perhaps it just confirms them. Goldsmith's death did not have to happen. And yet it did. And the publishing industry, with concerns of gloss and glamour, won't stop perpetuating these shameful conditions. It will continue defaulting to the purty lil gals (Nell Freudenberger) or the hot young things (Zoe Trope), rather than the magic of the offerings. This is nothing less than a goddam tragedy. Because we lose authors like Goldsmith in the process."
