full_description = "January 17, 2005August 11, 2005 by DrMabuse MP3s Removed Racism Because of bandwidth I cannot afford, I have had to remove all MP3 files. If you’re looking for the Star & Buc Wild file (or any of the other MP3s generated), you’ll have to go elsewhere. This site itself may have to disappear for several months. Thank you, India Times. January 15, 2005August 11, 2005 by DrMabuse Ain’t No Room for Culture in the New I-Rack War The United States is now rivaling those who burned the Great Library of Alexandria as cultural destroyers. Having deliberately built a base upon Babylon, a new report from the British Museum notes: damage to the dragons decorating the Ishtar Gate, one of the world’s most famous monuments, from attempts to prise out the relief-moulded bricks broken bricks inscribed with the name of Nebuchadnezzar lying in spoil heaps the original brick surface of the great processional route through the gate crushed by military vehicles fuel seeping from tanks into archaeological layers acres of the site levelled, covered with imported gravel – which Dr Curtis said would be impossible to remove without causing further damage – and sprayed with chemicals which are also seeping into the unexcavated buried deposits thousands of tonnes of archaeological material used to fill sandbags and mesh crates, and equally damaging, when that practice stopped, thousands more tonnes of material imported from outside the site, contaminating the site for archaeologists forever. Dr. John Curtis, the writer of the report, noted that his charges “should not be seen as exhaustive, but is indicative of the types of damage caused.” January 15, 2005August 11, 2005 by DrMabuse In Defense of Conversational Adverbs Language 2 Comments Apparently, some folks are taking offense to using “actually” in conversation. Actually, there’s something very nice about using adverbs in regular conversation. Realistically, it beats the tongue-tied swagger or the awkward pauses because, actually, the brain gets an extra second as the beads of sweat form hideous spoors on your forehead while hot lights, cameras and an audience are upon you and you hope to hell that you’re coming across as articulately as the perfectionist producers demand (yes, even on CSPAN!). Actually, it’s not quite like that at all. But having been on camera, it’s close. Inadvertently, in print, adverbs stick out long sore thumbs but, actually, adverbs announce a moment of discovery, a sense that one is discovering a point or a thesis in the process of response and, actually, if someone has a problem with this, well then we suspect that they may not have many ideas to contribute to the world, save complaints over very minute things. Actually."
