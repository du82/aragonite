title = "Jeff VanderMeer (BSS #59) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "Jeff VanderMeer (BSS #59) Fiction by edAugust 28, 2006December 4, 2010 Author: Jeff VanderMeer Condition of Mr. Segundo: Coming to terms with troubling generalizations. Subjects Discussed: Mushrooms as inspiration, writing “Dradin in Love” while suffering from mono, Steve Erickson, the writer as sadistic god, on being perceived as “difficult,” genre as revitilization device, the New Weird, China MiÃ©ville, the value of taxonomies, the use of parentheses for voice, reinventing the Ambergris mythology, scholarly discourse in fiction, underground scholars, Gormenghast, Nabokov, cities, Beirut, Albumeth Boulevard’s inspirations, ephemera, balancing experimentalism and absurdism, objections to playful prose, the Dan Green dust-up, Shriek: the movie, The Church, the Shriek parties, balancing the day job and the writing life, and the importance of physical exercise for writers. [INTERVIEW NOTES: The interview was conducted by telephone.] http://www.edrants.com/_mp3/segundo59.mp3Listen: Play in new window | Download (45.4MB) Post navigation A.M. Homes (BSS #58)Robert Birnbaum (BSS #60) 3 Comments Pingback: The Forbidden Planet International Blog Log » Jeff goes Bats Pingback: Evil Genius Chronicles » Around the Podosphere Pingback: Jeff goes Bats - Forbidden Planet Blog Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
