title = "July, 2005 - Reluctant Habits"
description = "As others have pointed out, the NYTBR is once again an embarassment.  It's the same old song.  Richard Posner's essay is not so much a book review but an excuse to whine about the blogosphere.  The writers remain, for the most part, male, offering dull and uninteresting coverage for dull and uninteresting books.  The insufferable Joe"
full_description = "July 31, 2005August 15, 2005 by Edward Champion Brownie Watch on Hiatus New York Times, Tanenhaus, Sam 2 Comments As others have pointed out, the NYTBR is once again an embarassment. It’s the same old song. Richard Posner’s essay is not so much a book review but an excuse to whine about the blogosphere. The writers remain, for the most part, male, offering dull and uninteresting coverage for dull and uninteresting books. The insufferable Joe Queennan continues to earn a paycheck. We’re so disheartened by the NYTBR now that we must temporarily take leave of the Tanenhaus Brownie Watch if we are to remain emotionally and mentally stable. Too many of our Sunday newspapers have soaked up our tears. It is only the crossword now that gives us comfort. We cry for Tanenhaus’ choice. The adjective “Faustian” comes to mind. We sob over the dismal state of current book coverage. But most of all, since we have enjoyed delivering brownies to him (yes, they have actually been delivered) on the rare occasions that Tanenhaus has cut the mustard (with, of course, not a single thank you note or email from the man), we firmly believe that Sam Tanenhaus cannot and defiantly will not produce a weekly book review section worth reading. Thus, Tanenhaus himself has ensured that no brownies can be delivered and the onus comes back to us in the end. So we’ve put our little experiment on hiatus. The point has been demonstrated time and time again. We’ve kenneled the little doggy away. And oh does he whimper! But one day, when Mr. Tanenhaus least expects it and we have talked out this book review contretemps over with our therapist, the brownies will, once again, be rightfully denied. July 31, 2005August 18, 2005 by Edward Champion Runners In My Hood Personal, San Francisco Leave a comment On Sunday morning, I woke to the sounds of strange huzzahs. Turns out it was the San Francisco Marathon running through my hood. The cheers came from a throng gathered at the southeastern corner of Stanyan and Haight Streets. There was a very large speaker providing music. Weird 1980s stuff like the Smiths, with a little funk thrown in for good measure. How this mix pertained to running was anyone’s guess. But I supposed it gave the runners hope, urging them to press on. I joined the folks frozen in place, cups of coffee clenched in their hands, joining in with cries of “You’re doing a great job!” and “I’m an out-of-shape bastard! You are more glorious than me!” The above-mentioned corner crowd can be seen on the right-hand side of the frame. They were apparently gathered there for “Lorie,” but they let out enthusiasm for several people who weren’t named Lorie. It was good to see the Marathon people providing arrows. I’m sure it helped the runners. But for a spectator such as myself, I took the sign’s advice, looked up, and saw merely a foggy sky. Whoever organized the biker-runner escort service was very kind. They were there by regular bicycle.. …and by motorcycle. Strangely enough, this is one of the few times I’ve paid attention to the Milkbar during the day. The minute that this colorful gentleman ran by, a flurry of activity occurred among some kids at the corner that involved the transaction of green pieces of paper for a green substance I couldn’t quite identify housed carefully in a plastic bag. A typical assembly of frozen spectators in place. I hadn’t seen so many frozen standing people since last standing up for the Star-Spangled Banner at a ball game. These bikers were prepared to step in if anyone did anything. I trusted them more than the cops. This guy’s going to have a major backache tomorrow. Aside from the cheering crowd, this gentleman raised his bear at anyone who passed by. Unfortunately, nobody paid too much attention to him, which was a shame. I suppose applause is a steadier measure than a hapless teddy."
