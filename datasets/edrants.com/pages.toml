["http://www.edrants.com/segundo/4-loopholes-the-gray-area"]
title = "4. Loopholes (The Gray Area) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "4. Loopholes (The Gray Area) Radio Play, The Gray Area by edJuly 3, 2017 As a thriving empire faces war with ferocious barbarians, a mischievous scholar named Minerva hopes to bring law and civilization to a great realm populated by talking birds, giant rats, gregarious knights, elemental gods, and menacing malasanders. An unanticipated dispute among the knights gives Minerva an opportunity to uphold the doctrine of moral principles, but Minerva finds herself testing her loyalty to her aide-de-camp while helping others to learn what honor, empathy, and identity really mean. (Running time: 32 minutes) Written and directed by Edward Champion CAST: Minerva: Rori Nogee Eris: Gerrard Lobo Henrietta: Monica Ammerman Fire: Samantha Cooper Watson: Christopher Akpobiyeri Boleyn: Rachel Baird The Magister: Sarah Golding Talking Birds: Alan Barrows Knights: Michael Charles Foote, Jim Kampfil, Matt Leong, Pete Lutz, Tanja Milojevic, John Xavier Miller III, Julia Morizawa, Hans Detlef Sierck, Fiona Thraille, Richard H. Thorndyke, Jack Ward, Tao Yang. Sound Design and Editing by Edward Champion Foley Sources: Edward Champion, jobro (CC), _def (CC), Taira Komori (CC), avakas (CC), Martin-Eero Kõressaar (CC), the_toilet_guy (CC), the_toilet_guy (CC), Shanay Groen (CC), jason130178 (CC), baryy (CC), huggy13ear (CC), HDM2013 (CC). Music: “The Long March Home” by Tim Juliano (licensed through NeoSounds) Art: Rushen (CC) Special thanks to Sacha Arnold, Austin Beach, Matthew Boudreau, Jason Boog, Christopher Byrd, Jen Elyse Feldman, Claudia Berenice Garza, Pam Getchell, Jen Halbert, Gabriella Jiminez, Argyria Kehagias, John Osborne, Tom Parsons, Rina Patel, Michael Saldate, Marc Anthony Stein, Marjorie Stein, That Podcast Girl, Georgette Thompson, Neil Varma, Jo Anna Van Thuyne, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this episode. We are especially indebted to Robert Cudmore, Matthew McLean, and Steve Schneider, whose collective insight, inspiration, unfathomable generosity, and encouragement were vital during the development of this highly ambitious story. Please be sure to also listen to A Scottish Podcast, which is run by many of the fine people who made this program possible, Lost in Williamsburg, whose work with overlapping dialogue has served as partial editing inspiration, and Tom Parson’s forthcoming Organism. We also recently launched Inside the Gray Area, a behind-the-scenes podcast available for Patreon subscribers who contribute at the $5/month level. Become a Patreon member and enjoy access to this, along with our annotated scripts, which contain many key references that will help unravel the bigger story. Thanks for listening! http://traffic.libsyn.com/grayareapod/loopholes.mp3Listen: Play in new window | Download (Running Time: 31:23 — 43.5MB) audio dramacomicfantasy Post navigation 3. Fuel to the Fire (The Gray Area)4.5. The Waiting Room (The Gray Area) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
