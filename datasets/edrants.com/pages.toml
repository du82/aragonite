title = "March, 2004 - Reluctant Habits"
description = """
More journalistic endeavors later.  For now, the NYT book coverage has me very concerned.  Eurotrash is the NYT takedown queen, but I knows bad grammar whens I sees it.

From this Michael Kazin review:"""
full_description = "March 31, 2004January 30, 2007 by DrMabuse Chip’s Asleep at the Wheel New York Times 5 Comments More journalistic endeavors later. For now, the NYT book coverage has me very concerned. Eurotrash is the NYT takedown queen, but I knows bad grammar whens I sees it. From this Michael Kazin review: “Susan Jacoby regrets in her new book” — Is that the only way Jacoby regrets? Through tomes? “zealous Protestants secured laws to ban the sale of alcohol, erotic literature and diaphragms” — As opposed to executing them? I secure my pants and the Xmas tree on top of the car, thank you very much. “the teaching of Darwinian theory in public schools” — Christ, why not just “teaching Darwinism in public schools?” “Ms. Jacoby concludes her book with a shudder” — Too bad she didn’t conclude with a docey doe or a pirouette. That would have been something. “Her title was shrewdly chosen.” Thank you, Tom Swifty. “But parochial schools were originally established to provide an alternative to public ones where students routinely learned only the virtues of the Reformation and recited from the King James Version of the Bible, commissioned by a Protestant monarch.” Two icky adverb-verb combos in one sentence? WTF, Chip? “religion is just a stew of unprovable myths.” Well, start cutting up those potatoes. Kazin, incidentally, is writing a biography of William Jennings Bryan. A match made in heaven if you ask me. Katie Zezima fares better, but not by much. “A bar by the railroad tracks is named Casey’s” — Active voice? “The 289 residents of Mudville” — Again, a voice that is more active? “What is true is that Thayer” — What is true is that you don’t need anything before “Thayer.” “Thayer went but soon returned to Worcester and wrote” — Well, make up your mind, Thayer. Three past tense verbs in nine words? “A stadium is planned for the site where Casey is said to have played.” — A copy editor is planned for the essay that Katie is said to have written. Where the hell’s Tanenhaus?"
