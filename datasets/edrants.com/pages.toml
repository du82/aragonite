["http://edrants.com/reluctant/000545.html"]
title = "Edward Champion's Return of the Reluctant: The Case Against First Person Plural"
description = '"often bitterly funny" -- Newsday'
full_description = '''I've been very annoyed by the rise of first person plural. The use of "we" is an unfortunate component of McSweeney's house style that shows no signs of waning. Several sharp, witty people use it -- indeed, cannot refrain from stopping -- and I shake my head in sorrow. Unless you're a schizophrenic or you're writing on behalf of a group of people (academics, a committee, or some giddy ensemble of lunatics), or you're relaying an anecdote with another person in the room, there just isn't a damn compelling reason to use "we" in place of "I." "We" implies one of two possibilities: either that the reader and the writer are one (a legitimate use in small doses), or the writer is duking it out with several voices inside her head. But what sane mind can relate to the latter in a tete-a-tete? "We" implies familiarity, but then it's a bit like some server killing a good restaurant conversation by announcing, "So how we doing?" The server is likely hustling for tips, but in the worst possible way. The "we" label, accentuated by a perky smile that only digs the blade in deeper, is enough to transform highly rational people into near-barbarians. No one appreciates this stroke of familiarity before even so much as a "Hello," but this doesn't stop marketing zealots from communicating this way at conferences and seminars. Here's the opening pargraph to James M. Cain's The Postman Always Ring Twice -- in my view, one of the finest examples of first-person clarity: Great clean stuff, ain't it? You're immediately hooked into Frank's world. You know that he's a drifter, that he has some experience on the road, and that he's rumbled a bit. Infuriating from the first sentence, no? It comes across as consummate bullshit, rather than the authenticity we saw in first person singular. From the get-go, the reader has nothing to relate to. Because the narrator feels the need to be a pushy wiseacre. The passage fails because the reader isn't invited to become part of an adventure. He's forced.'''
