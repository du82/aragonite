description = "a cultural forum in ever-shifting standing"
full_description = "January 31, 2004August 18, 2005 by DrMabuse Edwards Delivers Stump Speech At Auction; Blows Campaign Funds on Ming Vase Photo Headlines January 31, 2004August 18, 2005 by DrMabuse Quick Juice Roundup Dennis Quaid thanks Crowe for humiliating him. (via Amy) The scoop behind Churchill’s Nobel Lit Prize win (via Moorish). And Lizzie has convinced me to wear a thong. Maybe just after pre-op, I’ll take the camisole too. January 31, 2004September 8, 2005 by DrMabuse Ad Hom to Ad Hom Author Publicity, Peck, Dale 12 Comments Dale Peck isn’t just a bitch, but he’s an hubric mofo who compares his Moody blues to both Edmund Wilson and Virginia Woolf. (And, of course, the standard Coleridge line.) Judy Blume is on the defensive. Her book, Deenie, deals in part with masturbation. But Hernando County elementary schools are pulling the book from their shelves. Chica has a nice roundup of author photos. Me? I’m still squirming over Max Barry’s photo on Jennifer Government (see right). The book, which was so bad that I gave up on it (and I rarely do this), is terrible enough with its amateurish prose and failure to live up its central idea. But Barry himself looks instinctively like a new fraternity pledge who barely made it into the house. And I’d say the photo has helped me to hate the book more. Which isn’t good. Because I’d prefer to just erase the book out of my mind and reclaim the time I invested. January 31, 2004September 8, 2005 by DrMabuse NYT vs. Blogs Blogging, New York Times Wired: “So Withers decided to start the Wilgoren Watch, dedicated to deconstructing The New York Times’ coverage of Howard Dean’s campaign. Within weeks, the site had a prominent visitor: Wilgoren herself. The reporter has mixed feelings about the site. ” Slate: “For his labors, Radosh earned an ugly set of threats from Landesman. And though apologies were eventually extended to Radosh by Landesman and the Times Magazine for Landesman’s behavior, the writer still reserves the right to punish the blogger in court for what he wrote.” OpEdNews.com: “David Brooks, who joined the New York Times op-ed page with a reputation as one of the few neocons with intellectual integrity, has seen his reputation dwindle rapidly under the scrutiny of the blogosphere.”"
