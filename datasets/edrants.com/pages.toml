full_description = "May 31, 2006 by Edward Champion Reluctant Visualized Uncategorized Leave a comment Start here (via Jeff) May 31, 2006 by Edward Champion For Dave Itzkoff and Other Last-Minute Crammers, This Link Has Your Name on It Speculative Fiction Leave a comment Why didn’t I know about this earlier? The Science Fiction and Fantasy Research Database (via Scribbling Woman) May 31, 2006May 31, 2006 by Edward Champion Cambridge Cache Unearthed Libraries Leave a comment Approximately 170,000 volumes and papers have been discovered in the Cambridge University library tower. Some people believed that this stash of tomes represented little more than the 19th century equivalent of the now classic 20th century pornographic confessional Fist Me Hard! Fist Me Fast! But as it turns out, this cache yielded first editions of several 19th century authors, a collection of penny dreadfuls, and the bulk of it remains untouched. And by “untouched,” keep your dirty minds out of the gutter, folks. You know what I mean. Thanks to some cash from the late philanthropist Andrew Mellon, these books (and an online catalog of these books) should be available to the public roughly around 2010. May 31, 2006 by Edward Champion Multimillion Dollar Book Deals? Not Good Enough for Barbara Walters. Uncategorized Leave a comment In a development that should infuriate all midlisters starving and shivering in hovels right now, the Book Standard is now reporting that Barbara Walters walked away from a $6 million advance on her memoir. Walters was in a contract with Miramax Books, only to ditch the contract in question. Now she’s shopping around for a sum closer to Alan Greenspan’s $8.5 million advance. Of course, seeing as how Greenspan’s advance was contingent upon writing about some kinky moments with Ayn Rand, it remains to be seen what Walters could possibly pen to top Greenspan. Unless, of course, the two memoirs were to become illicitly involved, eventually morphing into one extremely salacious memoir to hit the stores later in the year."
