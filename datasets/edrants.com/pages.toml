["http://www.edrants.com/2007/09"]
title = "September, 2007 - Reluctant Habits"
description = "a cultural forum in ever-shifting standing"
full_description = "September 30, 2007 by Edward Champion ADD Test? Video Games Leave a comment This is one sadistic Flash game. September 30, 2007September 30, 2007 by Edward Champion So What Just Happened Here? Facebook, Franzen, Jonathan 1 Comment One can only assume that Franzen decided against friending me after nearly choking on his lunch. September 30, 2007September 30, 2007 by Edward Champion Shea Swaps Book Pick Baseball, New York Mets 6 Comments Two days ago, Mr. Bryant thought to mock the good Mets fans within the litblogosphere. Oh, but what a difference a few days make! In light of the 13-0 win over the Marlins and the — *ahem* — LOSS of the Phillies against the Nationals yesterday, I’d say we have ourselves an interesting situation here. A very interesting situation indeed. As a result, Flushing Meadows has changed its book club selection: [UPDATE: As of 2:00 PM on Sunday, things aren’t looking very well. The Marlins are leading 7-1 against the Mets. The Nationals are losing 0-1 to the Phillies.] September 28, 2007September 28, 2007 by Edward Champion Hell Hath Frozen Over! Facebook 3 Comments Jonathan Franzen has accepted my Facebook friend request! My work here is done. I shall now direct my attentions to Dwight Garner, who has yet to accept my Facebook friend request. [UPDATE: Correction. Franzen is not my Facebook friend. It appears that he added me and then, moments later, he removed me. I had thought that there was some kernel of bonhomie within Franzen’s disposition. But apparently, this is not the case.] September 28, 2007 by Edward Champion Who Needs an Independent Mind When There’s Google? Uncategorized 3 Comments If one must have an “opinion on Ed Champion,” a phrase that places me in an extremely bizarre position of importance, I’d hope that one would go to the trouble of forming an original opinion about me, yay or nay, rather than consulting Google. September 28, 2007 by Edward Champion Is There Any Purpose? Poetry 4 Comments The Guardian‘s James Buchan has asked the question, in all seriousness, “Is there any purpose in translating poetry?” Which is akin to asking the following questions: Is there any purpose in listening to someone outside my socioeconomic strata? Is there any purpose in venturing outside Manhattan? After all, New York is the center of the universe. Is there any purpose in sampling different food when I am comfortable with the bland meals I eat at home? Is there any purpose in trying out another sexual position besides missionary? (In case it wasn’t clear, the answer to all these questions is a resounding YES!) (via Bookninja)"
