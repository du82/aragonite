["http://www.edrants.com/2007/07"]
title = "July, 2007 - Reluctant Habits"
description = "And here's Part Two and Part Three.  They don't make television like this anymore.  Name a single interviewer today who would openly call a mass murderer as dangerous as Manson a"
full_description = "July 31, 2007 by Edward Champion Tom Snyder vs. Charles Manson Uncategorized 3 Comments And here’s Part Two and Part Three. They don’t make television like this anymore. Name a single interviewer today who would openly call a mass murderer as dangerous as Manson a “coward” or invite him to beat the shit out of him on national television. If anything, this incredible interview again demonstrates what we have lost in television journalism and why it is necessary for journalists of all stripes to up their game, remaining as fearless as possible in their pursuit of the truth. July 31, 2007July 31, 2007 by Edward Champion Light Tuesday Uncategorized Leave a comment Well, I thought I’d get the third and final Alternative Press Expo podcast up today, but other things — namely, lower back pain caused by accidentally throwing my back out of alignment last night — prevent me from industrious blogging. But I hope to return tomorrow. July 31, 2007 by Edward Champion RIP Michelangelo Antonioni Film, Obits 1 Comment “Bergman still lives!” What a horrible two days for cinema. July 30, 2007August 4, 2007 by Edward Champion BSS #125: Alternative Press Expo 2007, Part Two Bat Segundo, Comics Leave a comment CONDITION OF MR. SEGUNDO: Longing for phone numbers and fistfights. GUESTS: Julia Wertz, Julie Walker, Levni R. Yilmaz, Bill Morse, Neil Fitzpatrick, Brandon Bird, Ming Doyle, John Rivera, Steve Fuson, Zack Corzine, Christopher Perguidi and Keith Knight SUBJECTS DISCUSSED: Comics inspired from Craig’s List Missed Connections, unusual underwear, tactile animation, web comics vs. minicomics, an update on the Neil Jam universe, the practice of appropriating every known cultural construct, mullets, a comic book adaptation of a rock opera, family-friendly gnomes, using all five senses to experience a narrative, cannibal cooks, standing out among zombie comics, meticulously placed exclamation marks within comic book titles, grammar and comics, and how to work on comics in Los Angeles. EXCERPT FROM SHOW: Correspondent: So I was passing by a booth and I found some very unusual underwear designed by someone here. Maybe you can identify yourself and explain what the purpose of this underwear is, why it exists, and why it is being offered to the public at large. Walker: Um, my name is Julie Walker and I really wanted to put weenies onto underwear. Because it seemed like a good idea."
