title = "December, 2003 - Reluctant Habits"
description = "I never thought I'd see the day when the Atlantic advocated racist generalizations.  Actually, it's the white guys who never seem to wash their hands in the bathroom.  Generally the Caucasians about to broker a deal, the suits fond of the handshake.  People like Cullen Murphy.  Scary shit really, but all it takes is hanging out"
full_description = "December 31, 2003August 8, 2005 by DrMabuse The John Birch Monthly Racism I never thought I’d see the day when the Atlantic advocated racist generalizations. Actually, it’s the white guys who never seem to wash their hands in the bathroom. Generally the Caucasians about to broker a deal, the suits fond of the handshake. People like Cullen Murphy. Scary shit really, but all it takes is hanging out in a fancy-schmancy men’s room for an hour and keeping track of who doesn’t wash their hands. Oh, and Happy New Year! [8/8/05 UPDATE: Now of course, these things don’t come as much of a surprise to me anymore. But I’m still very much annoyed that highbrow to middlebrow magazines still use language to voice casual generalizations.] December 31, 2003August 8, 2005 by DrMabuse Your Brain’s Guide to a Safe New Year Satire Today, please adjust the settings in your mind, as follows: 4:00 PM: Yearly Self-Diagnostic. Run defrag program. Check for viruses. Finish organizing and prioritizing memories of 2003 events. 5:17 PM: Finish Kith and Kin Telephonic Check-In program. 7:22 PM: Register 2004 New Year Resolutions with CPU. 8:42 PM: Determine whether Body Unit intends to drink. If blood-alcohol levels = unmanagable, then capitulate keys to Sober Mind Obligated to Protect Other Body Units. 9:06 PM: Kiss Long-Term Companion Unit, listen to L-TCU’s last thoughts and resolutions. 10:34 PM: If 2003 New Year Resolution = Program Not Executed in 2003, Then 2003 New Year Resolution = 2004 New Year Resolution. Don’t worry. Other Body Units and CPUS will probably forget, particularly OBU (Quite Inebriated) types. 11:22 PM: Exchange 2004 New Year Resolutions with OBUs and L-TCU. 11:46 PM: Obtain champagne. 11:50 PM: Last-minute Kith and Kin Telephonic Check-Ins. 11:54 PM: Find L-TCU or L-TCU (Potential). 11:56 PM: If L-TCU (Current) or L-TCU (Potential) Does Not = Hand (Champagne), then obtain champagne. L-TCU (Not Champagne) = L-TCU (Champagne). 12:00 AM: If one second before Turn of the Year Announcer = Mouth (“One”), then when Turn of the Year Announcer = Mouth (Null) or Turn of the Year Announcer = Mouth (“Happy New Year”), Your Mouth (“Happy New Year”). Kiss with L-TCU optional, though with obvious advantages for both CPUs. General Program Notes: If L-TCU = Unavailable, don’t worry. This is the result of Propaganda (New Year’s) running in several OPU’s CPUs. Propaganda (New Year’s) was a virus authored long ago by some bored fifteen year old punk. Disregard all conversational facets pertaining to this and be sure that CPU = Happy, if L-TCU = Unavailable. See General L-TCU Maxim for more information (i.e., CPU = Not Happy continues L-TCU=Unavailable condition, CPU=Happy, and CPU=Confident and Listening, improves likelihood of L-TCU=Available condition, though timing of new variable impossible to predict)."
