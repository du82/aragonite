full_description = "Segundo Advertising by edJuly 10, 2008July 10, 2008 Rates A minimum of five episodes of The Bat Segundo Show are released each month, although there are often considerably more. We offer sponsorship packages in sets of ten. We ask all sponsors to commit to a ten show minimum commitment. But we are happy to schedule your sponsorship in advance, should you have a seasonal or time-specific campaign. Our base advertising rate is $600 per episode. We have one sole sponsor for each show. This sponsorship approach permits your product to stand out in a way that is uniquely exclusive. Features Hyperlinked sponsor logo within the podcast capsule. This image and link will appear within the podcast capsule on The Bat Segundo Show and remain in our archive. We will require a graphic from you. 15-second advertisement before the podcast. Your advertisement will be featured at the beginning of the podcast, recorded by our professional voice talent. (Please tell us whether you prefer a male or female announcer.) Alternatively, if you have an in-house audio spot, we can make arrangements to include this in the podcast. What We Need From You 1. Advertising copy Please provide us with 15 seconds of written copy for our talent. (Alternatively, if you have an in-house audio spot, we can make arrangements to include this in the podcast.) 2. Voice preference Our voice talent will record your audio spot. Just tell us whether you prefer a male or female voice. 3. Image We will require a GIF (although we can convert other image formats to GIF) that should be sent to us in the following dimensions: 120 x 120 pixels (size), 72dpi (resolution), 50K (maximum file size), RGB. Your image should be static. 4. URL Please provide a specific URL that you wish us to link to. If you wish to plug this URL in the accompanying 15 second audio spot, we recommend a short one. Payment To initiate advertising or set up a package, please contact Edward Champion. Upon approval of your materials, we will then establish a schedule and inform you of the shows that you are scheduled for. For each ten episode package, we ask that payment be received in advance. Payment can be made through PayPal. Ten episode advertising package: Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
