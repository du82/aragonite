title = "About The Bat Segundo Show – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "mark smith on January 20, 2015 at 3:17 pm Hi We are excited about reaching out to you Our new book “One Last Hurrah” allows the reader to experience a story of inspiration, inject their own experiences, unlike other books, so that the reader documents their own life story. This is, not only, our story about a former professional wrestler overcoming loss, but his journey in finding purpose and peace. The book, “One Last Hurrah” , documents medical miracles, overcoming abuse and experiences with drug addiction. Mark and Brenda , both, come from broken homes and have found their calling in life working with youth/children for over 15 years. Having come from divorce, Mark and Brenda had to decide if they were going to break the family cycles of abuse. They dedicated themselves to helping abused and abandoned children. We feel we can relate to a large audience who feel lost and discouraged. — Mark Smith Brenda Smith (903)263-8067 (903)263-8070 Robert Lampros on April 16, 2016 at 8:46 am Hello, The Bat Segundo Show Staff, I recently finished a novel, Last Year’s Resolution, and I believe it is a great book. It’s definitely the best book that I have written in many ways. Digital copies are available as a free download on my blog, robertlampros.wordpress.com, as well as through Goodreads. Please read and consider it for review at your convenience. Thank you and God bless. – Robert PDF Link: https://drive.google.com/file/d/0B2Z6slaYlGJWRmEwdGhmc2ZWaXc/view Summary: Last Year’s Resolution is a novel about Edmund Stovender, a famous author who falls in love with Marie, a journalist who calls him for an interview just before the performance of his hit play. Their lives accelerate through an epic adventure testing their faith, strength, and love for each other, as they discover that their story might pivotally influence the fate of the world. Bio: Robert Lampros is an author of Christian poetry, essays, and fiction who lives in St. Louis. He earned a Bachelor’s degree in English Literature from Washington University in St. Louis. His books include Fits of Tranquility, Illuminating Sidewalks, Om-Bork, Afternoon, Eleven Floors, and What Is Sacred. His latest novel, Last Year’s Resolution, is currently available as an e-book and is set to be released in paperback in Fall 2016. Title: Last Year’s Resolution Author: Robert Lampros Publisher: Robert Lampros/CreateSpace E-Book: 04/13/2016 Paperback: 09/2016 Book: Literature and Fiction Length: 170 pages"
