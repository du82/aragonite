full_description = "December 30, 2006December 31, 2006 by Edward Champion BSS #89: Nina Hartley Bat Segundo 1 Comment Condition of Mr. Segundo: Harried and henpecked. Author: Nina Hartley Subjects Discussed: The meaning of “total sex,” vanilla vs. “alternative” sex, basics vs. options, self-acceptance, foreplay, the relationship between sexual realities and porn film fantasies, the “three position” proclivity, swinging, sexual alienation, responding to Naomi Wolf’s 2003 article, Hooters, extreme porn, porn as education, Jocelyn Elders, Caitlin Flanagan, “death and babies ay-yi-yi!,” spontaneous sex vs. technical know-how, intrapersonal relationships, acceptance, insecurity, and polyamory. EXCERPT FROM SHOW: Hartley: I call it “total sex” because it encompasses the mainstay of most sexual practices. It touches on most things pretty well and it leaves plenty of room for exploration of the more esoteric things. I’m a very wide-ranging sexual creature, but I do know that most people are — many people are a little less broad-ranging than I. And so I do try to make it able to speak to the so-called regular person, who is not identified as a quote unquote kinky or freaky or pervert individual, but the regular person who would like to be more comfortable with sex and to get more pleasure out of it in his or her life. December 30, 2006December 31, 2006 by Edward Champion BSS #88: Amy Sedaris Bat Segundo 1 Comment Condition of Mr. Segundo: Ready to party in the Biblical sense. Author: Amy Sedaris Subjects Discussed: The lost art of hospitality, Martha Stewart, party theme taxonomy, entertaining old people, profiting from party guests, having a first date in your apartment, how to manage shy people, unexpected guests, remembering guests and logging menus, working with artists, Sedaris’s fear of computers, homemade art, children’s books, opposition to brunch, observing party hosts, the safety of counters, hosting vs. guesting, hosting vs. performing, Jonathan Rauch’s “Caring for Your Introvert,” ruminating vs. writing, communication difficulties, solutions for potheads with bad cases of the munchies, on being misinterpreted, shaking off the Jerri Blank persona, hosting for everyday people, indices, organizing cerebral chaos, being in control vs. delegating, on having too many ideas, the atmosphere within Sedaris’s apartment, and operating by instinct. EXCERPT FROM SHOW: Sedaris: I don’t normally have gimmicks and I don’t normally have themes for my parties, but, for the book, I came up with what I thought would be challenging for hostess. Like a hot lunch. And I thought who eats hot lunches? Lumberjacks and grips. So I thought, oh, I’ll have a lumberjack for lunch. Or, you know, if you have a bunch of old people over, just what the hostess has to think about. Or children. Or someone grieving or a depressed person."
