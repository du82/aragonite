["http://www.edrants.com/segundo/the-bat-segundo-show-60-robert-birnbaum"]
title = "Robert Birnbaum (BSS #60) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "Robert Birnbaum (BSS #60) Fiction by edAugust 28, 2006December 4, 2010 Author: Robert Birnbaum Condition of Mr. Segundo: Detached but amused by the pair-up. Subjects Discussed: The value of conducting interviews at a cemetery, Ed Champion’s arrest, the current state of the literary world, literary feuds, Richard Ford and Colson Whitehead, Stanley Crouch, Nicholson Baker, Leon Wieseltier, Anthony Burgess, US vs. UK journalism, Cynthia Ozick, the literary blogosphere, Birnbaum’s participation at the Oscar blog, West Coast vs. East Coast weather, reading and page limits, the “importance” of the New York Times Book Review, Gilbert Sorrentino, Sam Tanenhaus, Thomas McGuane‘s Nothing But Blue Skies book tour cancellation, Laura Miller, an attempt to stop the interview by a Mt. Auburn employee, examining a Mt. Auburn Cemetery leaflet of rules, John Updike, Joan Didion, comparisons with the publishing and the music industry, the NYTBR contemporary fiction coverage, list-making, classic vs. contemporary literature, Paul Collins, small presses vs. large presses, the onslaught of galleys, BEA, Birnbaum as editor, party pictures, celebrity culture, visionary magazines, Henry Luce, artistry vs. Photoshop, California fruit labels, the advertising world, who Birnbaum will talk with, Nicole Richie, authors having emotional breakdowns, the current state of literary journalism, and staying humble. http://www.edrants.com/_mp3/segundo60.mp3Listen: Play in new window | Download (63.8MB) Post navigation Jeff VanderMeer (BSS #59)Hillary Carlip & Annabelle Gurwitch (BSS #61) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
