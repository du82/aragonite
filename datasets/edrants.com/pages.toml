full_description = "A.M. Homes (BSS #58) Fiction by edAugust 25, 2006December 4, 2010 Author: A.M. Homes Condition of Mr. Segundo: Trying to remember last night’s conquest, relying upon Jorge’s import/export skills. Subjects Discussed: Taking on the “male menopause novel,” idioms appropriated by corporations, Kurt Vonnegut, vernacular, throwing the reader off guard, the dropping of letters, character names, donuts vs. bagels, burgers, on being provocative, novelists as ethicists, maintaining an “apocalyptic yet uplifting” tone, Katrina, Michiko Kakutani’s review, Stephen King’s plaudits and the mixed reviews, writing vulnerable male heroes, sensationalistic material, muted realism and decorum, research in Los Angeles, the ass as the great gender equalizer, charlatans and quacks, explaining life within novels, cliches, interconnectedness, Crash, Nathaniel West’s The Day of the Locust, money, and the relative nature of class within fiction. http://www.edrants.com/_mp3/segundo58.mp3Listen: Play in new window | Download (42.3MB) Post navigation Jonathan Safran Foer (BSS #57)Jeff VanderMeer (BSS #59) 1 Comment Pingback: Edward Champion’s Return of the Reluctant Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
