["https://www.edrants.com/2004/08"]
title = "August, 2004 - Reluctant Habits"
description = """
In lieu of email responses:

I've now been awake for almost twenty-one hours straight, and I just got back from Chicago (public apology to OGIC: the flight got delayed, I wrote down your number wrong, and I plan to plunge my head in a vat of boiling water when either an abundance of spare time or inveterate idiocy comes my way)."""
full_description = "August 31, 2004 by DrMabuse Alive Uncategorized 1 Comment In lieu of email responses: I’ve now been awake for almost twenty-one hours straight, and I just got back from Chicago (public apology to OGIC: the flight got delayed, I wrote down your number wrong, and I plan to plunge my head in a vat of boiling water when either an abundance of spare time or inveterate idiocy comes my way). Managed to squeeze in a Ferris Bueller moment at the top of the Sears Tower (which involved suffering through a Chicago propaganda film before getting access to the elevator) and salivated like crazy over all the incredible art deco in the limited time I had. And, damn, those grand el platforms are something. There were also two fantastic modular towers that resembled lint rollers from above right by the Sun-Times building. Looking at the grid, I now understand more fully what Jane Jacobs was talking about. Also, Lake Michigan is a bigass lake. That much is ostensible from all known topographical diagrams, but once you’re standing on the edge of the East Side as the sun comes up, this majestic body of water becomes suitably imposing — more so than Lake Tahoe’s pristine beauty. Must return to Chicago soon with more time to check out the town. It’s a gorgeous city. The people are nice. I only encountered one angry person at O’Hare when I purchased a postcard. Thanks all for the kind emails, which I’ll try to reply to, but I’ve got a deadline for yet another review tomorrow. As the less-than-two-weeks-before-opening clock ticks down, work on Wrestling continues. But we’re in damn good shape. I understand from our stage manager that the postcards have come in and they look fab. Haven’t seen them yet, but I have a limited supply to mail. If you’re interested, drop me an email. Will try to check in before our first show, but looking doubtful. Thanks to all the amazing Superfriends for filling in. August 30, 2004 by CAAF Bonus points for squeezing in a mention of �The Breast� Uncategorized Superfriend CAAF here, to say, as one might of the dearly departed, �Ed would want this mentioned.� In this weekend�s NYTBR, Tom Bissell writes a wonderfully smart review of David Mitchell�s Cloud Atlas. It is not unheard of for a novelist of exceptional talent to write a deliberately difficult book. This urge does not necessarily result in novels with nameless characters, mutating typography or unpunctuated attempts to explore the aphotic realm of human consciousness. It is also not an urge unique to modernism or experimentalism. Some novelists just seem to say, What the hell. John Updike’s odd (and wonderful) early novel ”The Centaur” seems to have been written from this impulse, as do Philip Roth’s equally bizarre novel ”The Breast,” Norman Mailer’s ”Why Are We in Vietnam?” and Kazuo Ishiguro’s ”Unconsoled.” Among this crowd, the young British novelist David Mitchell stands out. Deliberately difficult novels are the only novels he seems to be interested in writing. This is to the good; the tree of literature drops its best fruit after being shaken with conviction and intelligence. Mitchell is neither abstrusely arch nor a wizard of scenic dislocation. One does not sense that — unlike, say, William Gaddis, Carole Maso or Walter Abish — Mitchell is trying to chop down the tree of literature in order to replace it with something treelike. On the contrary, his prose is straightforward and, quite often, magnificent. Mitchell is as good at aphorism (”Faith, the least exclusive club on earth, has the craftiest doorman”) as he is at description (”Now and then goldfish splish and gleam like new pennies dropped in water”). The difficulty comes in how Mitchell chooses to construct his novels — or rather, how he does not choose to construct his novels. Related: Some of Bissell�s points figure in Emma Garman�s manifesto on the merits of snark over at Maud�s."
