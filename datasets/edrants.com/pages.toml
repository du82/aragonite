title = "September, 2004 - Reluctant Habits"
description = "As widely reported, Bitch Novelist will fuck your shit up."
full_description = "September 30, 2004August 12, 2005 by DrMabuse And She’s Back in Heat Blogging As widely reported, Bitch Novelist will fuck your shit up. September 30, 2004August 12, 2005 by DrMabuse Secret Agent Blogging No mention of SPECTRE’s presence within slush piles or the ridiculous signing demands of Elder Statesmen (accompanied by their egos), but Secret Agent has launched over at Maud’s. And it’s good stuff. We just hope the Agent will squirt Norman Mailer in the eye with one of Q’s gadgets just before his appearance on Gilmore Girls. September 30, 2004August 12, 2005 by DrMabuse Material Girls, Zola’s Game Theory, Tipping Points Roth, Philip, Roundup, Stephenson, Neal 1 Comment Edinburgh hopes to add a walking tour to the Royal Mile. Three refurbished Truman Capote volumes have been released in time for Capote’s 80th birthday. Unemployed doctoral students may want to consider analyzing Zola. Apparently, it ties into current French politics. David Halberstam sinks his teeth into Rathergate. Neal Stephenson has shaved his head. And apparently his audience has grown older. Andrea Dworkin has written a followup book about the infamous drug-rape. The new stamps for 2005: Greta Garbo (check), Henry Fonda (check), The Muppets (check), Richard Fenyman (double check), Arthur Ashe (check) and *sigh* Ronald Reagan. Newsday talks with Philip Roth. The big surprise? Apparently, tenderness. Richard B. Wright: a literary career forged on endless awards? Nympho Bride: Ashcroft’s idea of terrorism. The New Yorker still has faith in Tipping Point Segmentation technology. What’s Gladwell’s cut? Madonna studying literature at Oxford? September 30, 2004August 12, 2005 by DrMabuse Personally, We Hear Little Voices Encouraging Us to Become an Insurance Adjuster Poetry It was missed yesterday, but Today in Literatue celebrated the work of William McGonagall, who was, without a doubt, the Bulwer-Lytton of poetry. Here’s McGonagall on the collapse of the Tay Railway Bridge: …Oh! ill-fated Bridge of the Silv’ry Tay, I must now conclude my lay By telling the world fearlessly without least dismay, That your central girders would not have given way, At least many sensible men do say, Had they been supported on each side with buttresses, At least many sensible men confesses, For the stronger we our houses do build, The less chance we have of being killed. If you’ve got a hankering for more, there’s McGonagall Online, which includes McGonagall recounting the first man who threw peas at him, as well as his complete autobiography, where he describes his inspiration: “I wondered what could be the matter with me, and I began to walk backwards and forwards in a great fit of excitement, saying to myself– ‘I know nothing about poetry.’ But still the voice kept ringing in my ears – ‘Write, write,’ until at last, being overcome with a desire to write poetry, I found paper, pen, and ink, and in a state of frenzy, sat me down to think what would be my first subject for a, poem.”"
