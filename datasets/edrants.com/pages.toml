title = "December, 2004 - Reluctant Habits"
description = "Well, that's it for us.  Apologies for the political drivel, but we had to get in our yearly quota before midnight.  Regularly literary coverage will continue when we pull ourselves off the floor, determine how we lost our boxers, come to terms with the arsenal of alcohol in the kitchen, check our credit card statements, cry, politely escort"
full_description = "December 31, 2004August 11, 2005 by DrMabuse Happy New Year Awards 2 Comments Well, that’s it for us. Apologies for the political drivel, but we had to get in our yearly quota before midnight. Regularly literary coverage will continue when we pull ourselves off the floor, determine how we lost our boxers, come to terms with the arsenal of alcohol in the kitchen, check our credit card statements, cry, politely escort people out of our home, and try to begin living up to our barely realistic New Year’s resolutions. If you plan to drink, please don’t drive. Be sure to drink lots of water. (And tomorrow morning will go down better with a bloody Mary.) If you’re not drunk, you probably are. If you don’t have a gym membership, you’ll probably have one next week. Also, 2004 was better than you remember it. And 2005 is going to kick some serious ass for you, but only if you make it that way. Now get out there and kiss somebody. Cheers, Dr. Mabuse December 31, 2004August 11, 2005 by DrMabuse Powell Ponders How Kofi Annan Escaped Being Bush’s Bitch, Vows Serious Envy at Home Photo Headlines December 31, 2004January 30, 2007 by DrMabuse What We Do Now Politics I was very interested to see that Melville House has assembled a collection entitled What We Do Now. The book is a collection of essay from assorted people: Steve Almond on getting tough, Maud Newton on tax law, and Greg Palast on voting fraud are just some of the interesting people who turn up. But what impresses me about the collection is how it’s collated several disparate responses in reaction to the current political clime. More importantly, with only a few hours left in 2004, flipping through the book has provoked me into thinking about the same subject. Because What We Do Now‘s very unity and provocative smorgasbord structure has had me thinking about what currently ails the Left. Dennis Loy Johnson and Valerie Merians may be able boosters on the publishing front, but it’s a pity that this approach can’t extend to the Left’s everyday actions. It may seem an obvious point, but unity has eluded progressives of radical and centrist stripes over the past decade. The Left is either unwilling or unable to cast off its idealistic dregs, all too eager to engage in useless in-fighting over petty details. Instead of campaigning and pulling together for the pragmatic choice (i.e., the candidate or the goals that will get us closer to the marvelous possibilities of representative government), the Left is all too willing to quibble. I can’t support Kerry because he’s part of the Democratic machine. I’m for the death penalty. And while I agree with everything else the Green Party stands for, I can’t abide by that point. These sentiments aren’t the problems of the people who express them, but the mark of an ideology that is inflexible and non-inclusive. Because the truth of the matter is that we need those centrists, if only to call us on our shit from time to time and perpetuate a unifying yet inclusive dialectic. They’d respect us more if we actually stood proudly on our two feet. The problem isn’t one of politics, but confidence. We need an image, a mentality and a demonstrated series of actions that is confidently and uncompromisingly progressive, but that is simultaneously open to many political stripes. Here in San Francisco, we had a series of political rallies in 2003. Before they escalated into a war against the police and fulfilled the psuedo-Kent State fantasies of priapic reactionaries, everyday Americans and their families went to these rallies in droves. I know. Because I was there and I talked with more than a few. Some of them had attended these rallies for the first time. And oh how they were disappointed! Let us not forget that before the rallies were driven by mob mentality, despite the insufferable pamphlet-slinging of pro-Palestine supporters and enraged Wobblies, the rallies were places that appealed to a meaty faction of everyday people. They brought people together and had the potential to be a forum for mobilization and a long-term commitment that could extend well into November. Politiical demonstrations might make twentysomething Free Mumia supporters feel better, but I would argue that, so long as they adhere to a general message without a realistic effort to change government (and most of them do), they are useless. For some, the endless dirge of insensible rhetoric and uninformed opinions might boost egos. But that mentality belongs elsewhere: say, an Elks Lodge meeting. Until rallies are purged of their splinter opportunism and they appeal to the people at large, they will not have much use to anyone outside of cranks and militant nihilists. This may not be what the Left wants to hear, but the unity problem is so hopelessly embedded that even populist poster boys like Michael Moore are incapable of flexibility. In an interview with Playboy, Moore described an early meeting with Howard Dean: My wife and I went to meet him with the idea of supporting him. We brought our checkbook. But we weren’t in the room with him five minutes when we thought, Geez, this guy is kind of a prick. We didn’t write the check. I was not surprised the night of the Iowa caucus. He had spent the better part of two years in Iowa, letting people meet him. To meet him is to be turned off by him, so I wasn’t surprised that he lost. The concept of Dean was incredible. The movement behind him was a revolution. It was exciting to see, but Dean imploding was no surprise. Well, if you ask me, Michael Moore’s kind of a prick for failing to identify politics as a business that involves the occasional tango with snakes for a long-term solution. Moore failed to use his base or his films to pull for John Kerry early in the year. While he quite wisely hit upon a winning formula to get a message out to the people (the mass medium of cinema), his inability to offer a game plan or even some scintilla of hope made his efforts useless. Meanwhile, the Religious Right, having honed their organizational abilities through the so-called “Republican revolution” in ’94, have taken their battle directly to the American people. They have used a mobilized drive of bigotry and fear to convince the heartland that Bush is the man for the job. The unfortunate reality is that they wanted it more than we did. The time has come for us to want it more than they do. We have two years of mobilization in store for the midterm elections in 2006. And we must never underestimate that our everyday actions, whether it involves a kind gesture, building up connections with political officials at the local and state levels, or our purchasing decisions, all contribute more effectively to winning than we can possibly measure. We can be bold and accessible at the same time. The only thing stopping us is hopelessness, inaction, and giving up. And that’s silly. Because from where I’m sitting, we’re only just getting started."
