full_description = "October 31, 2006 by Edward Champion Damon Albarn Starts New Band… Music 1 Comment …and it’s called The Good, The Bad and the Queen. Of course, with the way he starts new bands, he’ll have another one next month. October 31, 2006 by Edward Champion Your Tax Dollars Telling You What to Do as Adults Fundamentalism, Sex Leave a comment USA Today: “Now the government is targeting unmarried adults up to age 29 as part of its abstinence-only programs, which include millions of dollars in federal money that will be available to the states under revised federal grant guidelines for 2007. The government says the change is a clarification. But critics say it’s a clear signal of a more directed policy targeting the sexual behavior of adults.” October 31, 2006October 31, 2006 by Edward Champion Deiter from Sprockets Comes to Mind murakami-haruki 2 Comments If you’ve ever wondered what Murakami translator Alfred Birnbaum looks like, now you know. (via Rake) October 31, 2006 by Edward Champion Franzen is Funny Franzen, Jonathan Leave a comment Two “funnies” anyway from Lorrie Moore. Of course, at the New Yorker, every contributor is funny. Particularly when you’re contributing too. October 31, 2006 by Edward Champion Yeah, Last Time I Checked, That New Pynchon Novel is 120 Pages With a Three Act Structure Uncategorized Leave a comment Seattle Times: “‘We’re looking into publishing books, too,’ reveals [Starbucks Chairman Howard] Schultz. ‘There’s so much talent out there, and they can’t find a publisher. It’d be a great service for emerging authors. Even as we speak, we have someone at William Morris [Literary Agency] who is reading scripts and treatments. It’s more than an idea. It’s something we’re serious about.'” October 31, 2006 by Edward Champion They’re Blaming Ted Hughes For the Delay of This One Too Poetry Leave a comment Washington Post: “An unpublished sonnet that Sylvia Plath wrote in college while pondering themes in F. Scott Fitzgerald’s novel ‘The Great Gatsby’ will appear Wednesday in a Virginia online literary journal.”"
