description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "1. Hello (The Gray Area) Radio Play, The Gray Area by edApril 18, 2017 A man wakes up in his apartment with a hazy memory of the night before. He’s greeted in bed by a mysterious woman who keeps saying, “Hello.” But she seems to know far more about his life than he ever could have told her in one night. And as the rats gnaw mercilessly from within the walls, she has a few bold and shocking answers as to why he’s so afraid. (Running time: 22 minutes) Written and directed by Edward Champion CAST: He: Tim Torre She: Emily Carding Gordon: Michael Saldate Edited by Edward Champion The Gray Area Theme by Alex Khaskin (licensed through NeoSounds) Foley Sources: Edward Champion and erpe (CC license, slight changes). Cover Image: Jason Lander (CC) Special thanks to Sacha Arnold, Austin Beach, Jason Boog, Christopher Byrd, Chris Fletcher, Claudia Berenice Garza, Sarah Golding, Jen Halbert, Gabriella Jiminez, Pete Lutz, John Osborne, Rina Patel, Paul Sating, Marc Stein, Georgette Thompson, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this emotionally revealing episode. http://traffic.libsyn.com/grayareapod/hello.mp3Listen: Play in new window | Download (Running Time: 21:52 — 25.1MB) Post navigation 0. Prologue (The Gray Area)1.5. Dissociation (The Gray Area) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
