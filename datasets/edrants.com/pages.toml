title = "Loser: A Report from the Trump Tower Protests – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "Loser: A Report from the Trump Tower Protests Follow Your Ears by edNovember 11, 2016 http://www.edrants.com/_mp3/loser.mp3Listen: Play in new window | Download (Running Time: 32:05 — 29.4MB) On Thursday, November 10, 2016, I attended the protests that had unfolded across the street from Trump Tower after Donald Trump had been elected the 45th President of the United States. I talked with anti-Trump activists, people who voted for Gary Johnson, people who voted for Trump, and people who didn’t vote at all in an attempt to understand how these unfathomable election results happened. http://www.edrants.com/_mp3/loser.mp3Listen: Play in new window | Download (Running Time: 32:05 — 29.4MB) 2016 electiongary johnsonhillary clintonlosertrumptrump tower Post navigation Disappearing ActThe Gray Area – Season One Trailer Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
