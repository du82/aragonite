description = "John Updike takes on the new Gabriel García Márquez novel.  He decries the book's narrator for not considering"
full_description = "October 31, 2005 by Edward Champion Leave It to Updike to Pop Those Cherries New Yorker, Updike, John Leave a comment John Updike takes on the new Gabriel García Márquez novel. He decries the book’s narrator for not considering “the atavistic barbarism of buying girls in order to crack their hymens.” But more interestingly, he offers one of the oddest sentences ever seen in the New Yorker‘s history: “The narrator’s asshole, we are told more than once, burns.” October 31, 2005 by Edward Champion Sufjan Stevens: The Kieslowski of Indie Pop? Music 3 Comments Bookish reports that singer-songwriter Sufjan Stevens is now writing 50 songs for 50 states. October 31, 2005 by Edward Champion Men Who Read Magazines: Easily Bored or More Complicated? Literary Magazines, Reading 1 Comment BusinessWeek reports that men aren’t reading magazines the way they used to. I’m going to suggest something radical: Could it be that men are more complicated than the current lad magazine world gives them credit for? Of course, with this decline comes one thankful development: “Maxim and the laddie titles it spawned are hardly in danger of disappearing, but their newsstand sales are far off their previous peaks. Meanwhile, ad categories that gravitate toward men’s titles, such as domestic automotive and technology, are down this year.” October 31, 2005 by Edward Champion Shorter and Shorter Personal 1 Comment During a particularly harsh bout of insomnia that involved carrying on a colloquy with my skull, I buzzed down my hair to the shortest length that it has ever been. Now it was pretty short to begin with, but this time, I used a #1, dammit. I shaved the pesky fuzz down mercilessly. Not Max Barry length, but pretty damn short. My hair is tantamount to a Chia Pet in the early stages of growth. The early reports are in: OPINION: “You look more like a dude.” ANALYSIS: Was I not masculine enough before? Or do some women require a je ne sais quoi Mr. Clean makeover in order to remain convinced that said dude does indeed possess a Y chromosome and maintain an unabated ardor for mammaries? OPINION: “Did you get a haircut?” ANALYSIS: No, I didn’t actually. I woke up and my hair grew magically shorter. Glad you noticed. OPINION: “Wow, you’re going bald.” ANALYSIS: Thank you. I wasn’t aware of this. I am very close to doing without hair altogether."
