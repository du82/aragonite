["http://www.edrants.com/segundo/2-brand-awareness-the-gray-area"]
title = "2. Brand Awareness (The Gray Area) – The Bat Segundo Show & Follow Your Ears"
description = "The Bat Segundo Show was a long-running cultural radio program devoted to quirky and very thorough long-form interviews with contemporary authors, idiosyncratic thinkers, and other assorted artists.  Guests included David Lynch, Octavia Butler, John Waters, John Updike, Stephen Fry, Marilynne Robinson, Karen Russell, Weird Al Yankovic, Robert A. Caro, and more than 500 others.   There was also a program called Follow Your Ears, which was a thematic investigative counterpart, in which I pursued a specific subject through several angles. The entire archive of what I did from 2005 to 2014 is included here."
full_description = "2. Brand Awareness (The Gray Area) Radio Play, The Gray Area by edMay 16, 2017 Joanna loves Eclipse Ale. It’s the best beer in the world. She has boxes of Eclipse memorabilia. She regularly wears Eclipse baseball caps. But on one rainy night, Joanna discovers that this happy relationship (along with the relationship with her boyfriend) is not what it seems. Why can’t she remember what her boyfriend gave her on their second anniversary? And why doesn’t anybody know about Eclipse Ale? (Running time: 28 minutes) Written and directed by Edward Champion CAST: Joanna: Eileen Hanley Greg: Charlie Harrington DJ: Peter Coleman Sam: Marc Eliot Stein Ignacio: Kilgore Lehrer Receptionist: Zachary Michael Leslie Stevens: Lauren Shippen Bar Background: Hans Detlef Sierck, Jan Jensen, Sam Lowry Edited by Edward Champion Foley Sources: Edward Champion, PlooQ (CC), lebcraftlp (CC), Sandermotions (CC), Leandros Ntounis (CC), LG (CC), magnus589 ()CC), GowlerMusic (CC) Theme Song: Pachyderm, “Never Knew Me at All” (licensed through CC, found at Free Music Archive) Music: Milton Arias, “Gracias,” Valery & The Greedies, “She-Wolf,” Jahzaar, “Scenes from the Zoo,” Ben Sound, and Kevin MacLeod, “Carpe Diem,” Ben Sound, “Funky Element” (all licensed through CC, found at Free Music Archive, Ben Sound, and Incompetech) Art: Claudio Sepúlveda Geoffroy (CC) Special thanks to Sacha Arnold, Austin Beach, Matthew Boudreau, Jason Boog, Christopher Byrd, Kate C., Christian Caminiti, Claudia Berenice Garza, Pam Getchell, Jon Grilz, Jen Halbert, Gabriella Jiminez, Pete Lutz, Philip Merritt, Pacific Obadiah, John Osborne, Rina Patel, Michael Saldate, Raia Savage, Alex Schawrtzberg, That Podcast Girl, Georgette Thompson, Jack Ward, and many others I may have inadvertently forgotten for their invaluable help, feedback, kindness, inspiration, and support during the production of this episode. Please be sure to also listen to Philip Merritt’s Lost in Williamsburg, which gave me a major editing idea that completely altered the bar scene, Jon Grilz’s Creepy, and Pacific Obadiah’s Lake Clarity. http://traffic.libsyn.com/grayareapod/brandawareness.mp3Listen: Play in new window | Download (Running Time: 27:33 — 31.5MB) Post navigation 1.5. Dissociation (The Gray Area)3. Fuel to the Fire (The Gray Area) Leave a Reply Cancel replyCommentName Email Website Save my name, email, and website in this browser for the next time I comment."
