title = "Inside an Effort to Build an AI Assistant for Designing Course Materials | EdSurge News"
description = "AI INSTRUCTIONAL DESIGNER?: Over the past few months, a group of educators has been designing and testing a system that uses ChatGPT to serve as an ..."
full_description = "Inside an Effort to Build an AI Assistant for Designing Course MaterialsTweetShareSign up for our newsletter×TweetShareLike this article?Sign up for our newsletter →×EdSurge Podcast Inside an Effort to Build an AI Assistant for Designing Course MaterialsBy Jeffrey R. Young Oct 1, 2024 Nichcha / ShutterstockTweetShareEmailTweetShareEmailgoogletag.cmd.push(function() { googletag.display('div-gpt-ad-1547941141764-0'); });googletag.cmd.push(function() { googletag.display('div-gpt-ad-1547940997815-0'); });This article is part of the collection: The EdSurge Podcast.There’s a push among AI developers to create an AI tutor, and some see that as a key use case for tools like ChatGPT. But one longtime edtech expert sees an even better fit for new AI chatbots in education: helping educators design course materials for their students.So all year Michael Feldstein has been leading a project to build an AI assistant that’s focused on learning design. After all, these days colleges and other education institutions are hiring a growing number of human instructional designers to help create or improve teaching materials — especially as colleges have developed more online classes and programs. And people in those roles follow a playbook for helping subject-matter experts (the teachers they work with) organize their material into a series of compelling learning activities that will get students the required knowledge and skills on a given subject. Feldstein thinks new AI chatbots might be uniquely suited to guiding instructors through the early stages of that learning-design process.He calls his system the AI Learning Design Assistant, or ALDA. And for months he has been leading a series of workshops through which more than 70 educators have tried versions of the tool and given feedback. He says he’s built a new version of the system about every month for the past five months incorporating the input he’s received. He argues that if AI could serve as an effective instructional design assistant, it could help colleges significantly reduce the time it takes to create courses.Feldstein is not completely convinced it will work, though, so he says he has invited plenty of people to test it who are skeptical of the idea. “The question is, can AI do that?” he says. “Can we create an AI learning design assistant that interviews the human educator, asks the questions and gathers the information that the educator has in their heads about the important elements of the teaching interaction and then generates a first draft?”EdSurge has been checking in with Feldstein over the past few months as he’s gone through this design process. And he’s shared what has gone well — and where early ideas fell flat. You can hear highlights of those conversations on this week’s EdSurge Podcast.Even if it turns out that AI isn’t a fit to help build courses, Feldstein says the project is yielding lessons about where generative AI tools can help educators do their jobs better. Check it out on Spotify, Apple Podcasts, or on the player below.Jeffrey R. Young (@jryoung) is an editor and reporter at EdSurge and host of the EdSurge Podcast. He can be reached at jeff [at] edsurge [dot] comEdSurge Podcast Teaching and Learning Technology Trends Instructional TrendsLearn more about EdSurge operations, ethics and policies here. Learn more about EdSurge supporters here.Next Up The EdSurge PodcastEdSurge PodcastTo Address the ‘Homework Gap,’ Is It Time to Revamp Federal Connectivity Programs?By Jeffrey R. YoungEdSurge PodcastHow Rising Higher Ed Costs Change Student Attitudes About CollegeBy Jeffrey R. YoungEdSurge PodcastHow a Returning College Student Advocated to Improve a Fledgling Online ProgramBy Jeffrey R. YoungEdSurge PodcastAI Chatbots Reflect Cultural Biases. Can They Become Tools to Alleviate Them?By Jeffrey R. YoungMore from EdSurge AssessmentsLouisiana’s NAEP Score — A Victory for the Science of Reading?By Daniel MollenkampSponsoredUsing Technology to Build a Culture of Authentic Student EngagementBy Nina BerlerSponsoredA Reading Expert’s Case for Rethinking FluencyBy Abbie MishaDiversity and EquityLaws Against Black Literacy in Pre-Civil War South Still Haunt Education, Expert SaysBy Mary-Liz Shaw"
