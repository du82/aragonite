full_description = "eduroam and GÉANT Supporting Global Research and Education eduroam and GÉANT Supporting Global Research and Education eduroam and GÉANT eduroam was pioneered by the GÉANT research and education networking community in Europe. The GÉANT Project works with relevant industry and standardisation groups to find and share solutions related to eduroam technology and security. The registered trademark for eduroam® in Europe is held by the GÉANT organisation, which also helps to promote the deployment of the service. eduroam in Europe The European eduroam service is a large-scale collaboration between hundreds of institutions, the majority of which own and operate the service’s infrastructure. The national and international coordination of this infrastructure is undertaken by the Roaming Operators (ROs) and a central eduroam Operational Team that is funded by the GÉANT Project. The GÉANT project is co-funded by Europe's NRENs and the EU."
