full_description = "Case Studies • News South African students can now access high-speed WiFi in city of Cape Town’s libraries July 17, 2019 Case Studies • News Ukrainian NREN, URAN, implements eduroam managed IdP to support research institutions July 16, 2019 Case Studies • News 4,000th public building joins the govroam network, providing roaming service for public sector workers May 17, 2019 Case Studies • News eduroam now available at 12 train stations across the Czech Republic December 18, 2018 eduroam Case Studies Get connected, wherever you are eduroam Case Studies Get connected, wherever you are eduroam - supporting Research and Education around the globe Since its inception in 2003, eduroam has been a major success story for Research and Education. Starting in Europe it has rapidly spread across the world and now students and researchers from over 100 countries can benefit from free, secure, reliable wifi access wherever they are travelling or studying. eduroam supports over 5 million access authentications every day with over 500,000 international authentications daily. eduroam is truly supporting the vision of a global village for Research and Education. eduroam service case study eduroam NHS Beyond the Campus Sustainable Training eduroam news from around the world Case Studies • News South African students can now access high-speed WiFi in city of Cape Town’s libraries July 17, 2019 Case Studies • News Ukrainian NREN, URAN, implements eduroam managed IdP to support research institutions July 16, 2019 Case Studies • News 4,000th public building joins the govroam network, providing roaming service for public sector workers May 17, 2019 Case Studies • News eduroam now available at 12 train stations across the Czech Republic December 18, 2018"
