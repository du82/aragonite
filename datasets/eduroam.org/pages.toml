["https://eduroam.org/configuration-assistant-tool-cat"]
title = "Configuration Assistant Tool (CAT) - eduroam.org"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = 'Configuration Assistant Tool (CAT) Get connected, wherever you are Configuration Assistant Tool (CAT) Get connected, wherever you are Configuration Assistant Tool (CAT) The eduroam Configuration Assistant Tool (CAT) has been developed to help organisations offering their users eduroam access. The tool builds customised installers for a range of popular PC and smartphone platforms and enhances the security for the end user. The tool ensures that users are protected against rogue wi-fi hotspots accessing usernames and passwords. The tool builds a specific configuration for each participating organisation and so users should ensure they are downloading the correct installer. If your organisation is not listed on the CAT website then please contact your institutions IT department for advice. To see the list of supported devices, go to https://cat.eduroam.org and click on "About CAT" CAT Website https://cat.eduroam.org/ If your organisation does not have a profile on CAT ask your IT department to set one up - it is quick and easy to do. Technical Resources For source code and documentation for developers https://github.com/GEANT/CAT'
