["https://eduroam.org/about/connect-yourself"]
title = "Connect Yourself - eduroam.org"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = '''eduroam for students, researchers and educators Get connected, wherever you are eduroam for students, researchers and educators Get connected, wherever you are Where can I use eduroam? Whether you're moving across campus or spending time studying or working at another research and education institution, eduroam gives you seamless internet connectivity. More than 10,000 eduroam hotspots are available at universities, research centres, academies, many schools, and other research and education institutions in more than 100 territories around the world. As eduroam grows, more and more hotspots are appearing in additional places such as libraries, museums and public spaces such as railway stations and coffee shops. Wherever you see 'eduroam' appear in your list of Wi-Fi networks, you can get online. See the interactive map. How does it work? With eduroam installed on your laptop, mobile phone or other device there's no need to request special accounts or borrow other people's IDs - just activate your device and you should be online. eduroam's secure and privacy-preserving technology means that there is no need to enter usernames and passwords through insecure web browser forms. Your device will identify a valid eduroam access point and log-in automatically. Your password is never shared with any of the access points. Your password for your online identity is provided to you by your 'home' institution - where you are enrolled in study or are employed. Get Started Visit the eduroam Configuration Assistant Tool (CAT) and click the large blue button that says "eduroam user: download your eduroam installer", then select your home institution. If your institution is not included in the list, please lobby your IT department and institution managers to provide the service! What Does it Cost? Thanks to global agreement, the eduroam Wi-Fi roaming service is free-of-charge to users.'''
