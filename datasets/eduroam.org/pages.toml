title = "eduroam’s Unmyama helps raise over £140,000 for charity - eduroam.org"
description = "After the hugely successful #StandingTall giraffe trail in Cambridge where eduroam sponsored a specially designed giraffe outside the iconic Cambridge University Library all the sculptures were auctioned off with proceeds going to the Break Charity. eduroam is proud to support Break which works to provide care-leavers, often the most vulnerable young adults, to have the"
full_description = "eduroam’s Unmyama helps raise over £140,000 for charity 8 months ago Karl Meyer Share This! FacebookXPinterestLinkedIn After the hugely successful #StandingTall giraffe trail in Cambridge where eduroam sponsored a specially designed giraffe outside the iconic Cambridge University Library all the sculptures were auctioned off with proceeds going to the Break Charity. eduroam is proud to support Break which works to provide care-leavers, often the most vulnerable young adults, to have the best possible work and education opportunities and so we are thrilled to have sponsored a giraffe in the “Standing Tall” sculpture trail around Cambridge. Over the 10 weeks of the trail over 200,000 people took part tracking down the 31 large and 62 smaller giraffes across the city in Cambridge’s first African safari! The eduroam giraffe was created by Lisa Todd who lived in South Africa and collaborates with local crafters and is inspired by the Ubuntu theme which represents the power of community. This design was chosen because eduroam relies on the community of universities around the world coming together to support each other and make eduroam such a global success. In total the auction raised £142,600 to support their work and we are glad to have played a part in this fantastic project. To find out more about Break visit https://www.break-charity.org/cambridge-standing-tall/ You may also like News Klaas Wierenga – Founder of eduroam is speaking at the Radius Conference 12,13 March 2025 2 weeks ago News eduroam hits a new record – 8.4 billion authentications in 2024 4 weeks ago News eduroam Luxembourg further expands in partnership with CFL 2 months ago About the authorView All Posts Karl Meyer RENAM expands eduroam service in Moldova: now available in Taraclia Introducing extending eduroam: learning beyond the campus Share This! FacebookXPinterestLinkedIn News Klaas Wierenga – Founder of eduroam is speaking at the Radius Conference 12,13 March 2025 2 weeks ago"
