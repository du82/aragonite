["https://eduroam.org/eduroam-luxembourg-further-expands-in-partnership-with-cfl"]
title = "eduroam Luxembourg further expands in partnership with CFL - eduroam.org"
description = "The start of 2025 is off to a flying start for eduroam users. With new hotspots are progressively activated across Luxembourg, and CFL being added as an additional eduroam service provider. In addition, eduroam.lu website gets a new and modern facelift. CFL and Restena offer a secure WiFi access to the research and education community"
full_description = "eduroam Luxembourg further expands in partnership with CFL 2 months ago Karl Meyer Share This! FacebookXPinterestLinkedIn The start of 2025 is off to a flying start for eduroam users. With new hotspots are progressively activated across Luxembourg, and CFL being added as an additional eduroam service provider. In addition, eduroam.lu website gets a new and modern facelift. CFL and Restena offer a secure WiFi access to the research and education community Based on the ‘CFL Free WiFi’ infrastructure set up by the CFL Infrastructure Manager, a new collaboration has just been established between the CFL and the Restena Foundation . Interconnecting and delivering essential network and security services to actors in research and education, health, culture and public administration in Luxembourg, Restena notably coordinates eduroam in Luxembourg, a service delivered on a global scale. As such, Restena offers its community of users a secure and automatic WiFi connection available in Luxembourg and in over a hundred other countries. The objective of CFL and Restena is to progressively make the eduroam network service available via WiFi terminals located throughout CFL’s railway stations, railway stops and buses. eduroam is used as secure Internet access by a large proportion of daily train users. Thus, secondary school pupils, secondary school teachers, students, university professors and research institute staff, also foreign users visiting Luxembourg on an occasional basis, will automatically connect to eduroam when visiting a station where the eduroam signal is available. “This collaboration enhances our WiFi infrastructure and opens up a new high value-added market.” Marc Hoffmann, Infrastructure Management Director at CFL “Connectivity services contribute greatly to the travel comfort and connectivity of the educational and research community in Luxembourg, which is among the regular customers of our trains!” Marc Wengler, Chief Executive Officer at CFL Find out more here. You may also like News Klaas Wierenga – Founder of eduroam is speaking at the Radius Conference 12,13 March 2025 2 weeks ago News eduroam’s Unmyama helps raise over £140,000 for charity 8 months ago News Introducing extending eduroam: learning beyond the campus 10 months ago About the authorView All Posts Karl Meyer eduroam hits a new record – 8.4 billion authentications in 2024 RENAM expands eduroam service in Moldova: now available in Taraclia Share This! FacebookXPinterestLinkedIn"
