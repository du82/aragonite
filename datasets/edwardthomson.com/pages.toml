full_description = "I'm Edward Thomson. I build developer tools.I'm a Product Manager in the developer tools space — I'm currently at Stacklok, working at the intersection of developer tools and software supply chain security. Prior to that, I led a team of Product Managers, and before moving into Product Management, I was a software Engineer. I built version control tools at SourceGear, Microsoft, and GitHub, CI/CD tools at GitHub, and the Frontend Cloud at Vercel.I wrote the code that merges your pull requests, helped introduce GitHub Actions to the world, helped acquire then lead npmjs.com, and introduced many of Vercel's compute, storage, and network products. I've helped acquire companies, and helped build a company that was acquired. I've written books, spoken at conferences, and recorded podcasts. I remain active in open source software development and in volunteering.Contact"
