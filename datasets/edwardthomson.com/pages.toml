full_description = "I'm Edward Thomson.I build developer tools.I'm an entrepeneurial, highly technical product manager, but I started my career as a software engineer. I first worked on systems and network software, but I found my passion in the developer tools space. I went on to build version control tools at SourceGear, Microsoft, and GitHub. Whether you call them Pull Requests or Merge Requests, I wrote the code that merges them.I moved into Product Management 5 years ago. Since then, I've helped introduce GitHub Actions to the world, helped acquire then lead npmjs.com, and introduced many of Vercel's Compute, Storage, and Network products.Now I work at Stacklok, helping secure the software supply chain. I also provide consulting services around version control, speak at developer events, and advise developer tools organizations at various stages of maturity.Interested in working together? Get in touch."
