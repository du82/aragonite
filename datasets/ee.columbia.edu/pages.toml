["https://ee.columbia.edu/content/asaf-cidon"]
title = "Asaf Cidon | Electrical Engineering"
full_description = "Asaf Cidon Research Interest Computer Engineering and Computer Systems Networking and Communications Asaf's research interests are in software systems, storage, systems for large scale machine learning and cybersecurity. He completed his PhD at Stanford University. His research on distributed storage systems was adopted in commercial storage systems of several companies, including Facebook, Tibco, Hortonworks and Rubrik. Before joining Columbia, he was the Senior Vice President of Email Protection at Barracuda Network, where he was the co-GM of the $200M email security and archiving business, with a team of 100 engineers and product managers. He joined Barracuda via the acquisition of Sookasa, where he was the CEO and co-founder. Asaf obtained his PhD and MS in Electrical Engineering from Stanford and my BS in Computer and Software Engineering from the Technion."
