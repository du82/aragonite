title = "Charles A. Zukowski | Electrical Engineering"
full_description = 'Charles A. Zukowski Research Interest Integrated Circuits and Systems Computer Engineering and Computer Systems Charles A. Zukowski joined the EE faculty in 1985. He received a Presidential Young Investigator Award in the field of VLSI CAD, and is the author of the book "The Bounding Approach to VLSI Circuit Simulation." His research topics have also included low-energy CMOS design techniques, circuit design for communications networks, and special-purpose processors for biological simulation. He has regularly taught courses in circuit analysis and digital VLSI design. Since 1996 he has also been very active in EE Dept. administration, serving as either Dept. Chair or Vice Chair.'
