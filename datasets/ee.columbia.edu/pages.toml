full_description = "Nanoscale Structures and Integrated Devices The area of Nanoscale Structures and Integrated Devices applies fundamental physical principles to develop revolutionary new electronic, photonic, and optical devices made from conventional and emerging materials, including graphene, 2D semiconductors, and organic semiconductors. Research includes nanofabrication, characterization, and electromagnetic design of quantum device structures and complex silicon photonic circuits that impact numerous fields from Lidar and optogenetics to low-energy computation and flexible electronics. Affiliated Faculty photo of Keren Bergman Faculty Keren Bergman Charles Batchelor Professor of Electrical Engineering; Scientific Director, Center for Integrated Science and Engineering, Dept of Electrical Engineering Research Interest Computer Engineering and Computer Systems Networking and Communications Nanoscale Structures and Integrated Devices photo of Paul Diament Emeritus Faculty Paul Diament Research Interest Nanoscale Structures and Integrated Devices photo of Savannah Eisner Faculty Savannah Eisner Assistant Professor of Electrical Engineering, Dept of Electrical Engineering Research Interest Nanoscale Structures and Integrated Devices photo of Ioannis (John) Kymissis Faculty Ioannis (John) Kymissis Kenneth Brayer Professor of Electrical Engineering; Vice Dean of Infrastructure and Innovation of SEAS Research Interest Nanoscale Structures and Integrated Devices photo of Michal Lipson Faculty Michal Lipson Eugene Higgins Professor of Electrical Engineering and Professor of Applied Physics, Dept of Electrical Engineering Research Interest Nanoscale Structures and Integrated Devices photo of Xiang Meng Faculty Xiang Meng Associate Professor of Profesional Practice in the Department of Electrical Engineering Research Interest Nanoscale Structures and Integrated Devices Networking and Communications photo of Richard M. Osgood Jr In Memoriam Richard M. Osgood Jr Higgins Pr