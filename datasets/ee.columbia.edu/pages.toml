full_description = "Prospective PhD Open House Date: November 1, 2024 (9:00 am-1:00 pm EST) Location: Zoom (https://columbiauniversity.zoom.us/j/99579464260) Department of Electrical Engineering Pre-Admission Recruiting Event Columbia University Columbia University's Electrical Engineering Department has world-class faculty involved in cutting-edge research. The Department’s small size allows individualized attention to our Ph.D. students. Our compact campus fosters interdisciplinary interactions unmatched by anyone. The Department invites college seniors from select undergraduate institutions to a pre-admission recruiting virtual open house. You will have the opportunity to meet our faculty and graduate students and learn about the exciting opportunities Columbia EE offers. To register, please click here. RSVP by October 27, 2024. If you have any questions, please contact us at [email protected]. Please join us on Zoom (https://columbiauniversity.zoom.us/j/99579464260). Preliminary Schedule 9:00 – 9:45 AM Office Hours with Faculty 10:00 – 11:30 AM Department Overview & Faculty Research Presentations 11:30 – 12:15 PM Student Panel 12:15 – 1:00 PM Office Hours with Faculty"
