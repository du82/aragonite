["https://ee.columbia.edu/faculty-positions"]
title = "Faculty Positions | Electrical Engineering"
full_description = "Faculty Positions Assistant or Associate Professor in Electrical Engineering Columbia Engineering is pleased to invite applications for a tenure-track faculty position at the rank of Assistant Professor or Associate Professor (without tenure, but on tenure-track), in the Department of Electrical Engineering at Columbia University in the City of New York, starting on July 1, 2025. Expand all Collapse all Position Description Columbia Engineering is pleased to invite applications for a tenure-track faculty position at the rank of Assistant Professor or Associate Professor (without tenure, but on tenure-track), in the Department of Electrical Engineering at Columbia University in the City of New York, starting on July 1, 2025. The department welcomes applications in all areas of electrical and computer engineering, with emphases on circuit design, on systems for artificial intelligence and machine learning, and on the school-wide strategic priority area of quantum computing and technology. Outstanding candidates in other areas will also be considered and are encouraged to apply. Qualifications Candidates must have a Ph.D. or its professional equivalent by the starting date of the appointment. Applicants for this position must demonstrate the potential to do pioneering research and to teach effectively. The Department is especially interested in qualified candidates who will contribute, through their research, teaching, and/or service, to the diversity and excellence of the academic community. The successful candidate is expected to contribute to the advancement of their field and the department by developing an original and leading externally funded research program, and by contributing to the undergraduate and graduate educational mission of the Department. Columbia fosters multidisciplinary research and encourages collaborations with academic departments and units across Columbia University. The Department actively participates in the school-wide Engineering for Humanity initiatives that relate to engineering and medicine, autonomous systems, quantum computing and technology, and sustainability. Application Instructions For additional information and to apply, please see: http://engineering.columbia.edu/faculty-job-opportunities. Applications should be submitted electronically to http://apply.interfolio.com/156905 and include the following: a curriculum vitae including a publication list, a research statement including a description of research accomplishments, a statement of teaching interests and plans, three letters of recommendation, and up to three pre/reprints of scholarly work. Applicants are also encouraged to provide a statement addressing past and/or potential contributions to diversity and inclusion through teaching, professional activity, and/or service. All applications received by December 1, 2024 will receive priority consideration, and applications received by January 15, 2025 will receive full consideration. Applicants can consult http://www.ee.columbia.edu for more information about the department. Applicants who are also interested in Columbia Engineering’s school-wide cluster search in quantum computing should submit an additional application to the quantum search, by accessing the job posting at http://engineering.columbia.edu/faculty-job-opportunities."
