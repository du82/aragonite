["https://ee.columbia.edu/content/keren-bergman"]
title = "Keren Bergman | Electrical Engineering"
full_description = "Keren Bergman Research Interest Computer Engineering and Computer Systems Networking and Communications Nanoscale Structures and Integrated Devices Keren Bergman is the Charles Batchelor Professor of Electrical Engineering at Columbia University where she also serves as the Faculty Director of the Columbia Nano Initiative. Prof. Bergman received the B.S. from Bucknell University in 1988, and the M.S. in 1991 and Ph.D. in 1994 from M.I.T. all in Electrical Engineering. At Columbia, Bergman leads the Lightwave Research Laboratory encompassing multiple cross-disciplinary programs at the intersection of computing and photonics. Bergman is the recipient of the 2016 IEEE Photonics Engineering Award and is a Fellow of Optica (Optical Society of America) and IEEE. Other Research Areas Large-Scale Optical Switching Fabrics, Optical Interconnection Networks for High-Performance Computing, Optical Interconnection Networks for Data Center Computing Systems, Integrable Interconnection Network Systems and Subsystems, Inter-Chip Multi-Processor Interconnection Networks, and Intra-Chip Multi-Processor Interconnection Networks."
