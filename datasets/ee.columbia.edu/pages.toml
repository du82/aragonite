["https://ee.columbia.edu/content/armstrong-memorial-lectures"]
title = "Armstrong Memorial Lectures | Electrical Engineering"
full_description = "Armstrong Memorial Lectures Expand all Collapse all About This series of lectures offered by the Department of Electrical Engineering at Columbia University in New York is named in honor of Edwin Howard Armstrong, 1890-1954, to remind our students of the landmark contributions of his inventive genius, and of the fact that he spent his entire career in the department. Born in New York on December 18, 1890, Edwin Howard Armstrong entered Columbia in 1909. While still an undergraduate in Electrical Engineering, he discovered the regenerative detector circuit whereby the feeble radio impulses received through the air could be “fed back” and built up manyfold in strength. By replacing the crude crystal detector of earlier days, he vastly extended the range of radio reception. This regenerative circuit was universally used throughout the field of electrical communications and electronics. Graduating in 1913 with a degree in E.E., the young engineer began under the guidance of another outstanding Columbia scientist, inventor and engineer – Professor Michael Idvorsky Pupin – the fundamental studies and investigations on which his later inventions were based. It was during his service with the United States Army Signal Corps in World War I that he developed the superheterodyne receiver (1917), providing not only further amplification but also resulting in greater selectivity of radio reception. Major Armstrong, as he was most widely known, carried out his work from 1914 on in the Marcellus Hartley Research Laboratory, which was located in the Philosophy Building on the Columbia campus. From 1934 to the end of his life, he was Professor of Electrical Engineering at Columbia. In the late twenties, he undertook to solve the problem of eliminating the static disturbances that were the plague of radio communication when employing amplitude modulation (AM); that is, by then standard method in which the audio signal is carried by radio waves. By 1933, he had perfected the new technique of wide-band frequency modulation (FM), eliminating static and giving the world high fidelity radio reception. Just a few months before his death he published his fifth important contribution to the art to which he devoted his life: multiple transmission and reception of radio waves by frequency modulation, which makes possible the simultaneous use of a single FM radio channel for more than one message. Thus, his entire career from undergraduate to pre-eminence in his field was marked by continued progress and successive improvements in his beloved specialty. The gift of a single outstanding invention has been granted to few men, but seldom has one man successively made five such advances. Armstrong is considered by many to be America’s greatest electronics genius. Yet he was one of the most modest of men. In discussing improvements in the field of his endeavor, he always emphasized what others had done to further these developments and said very little of his own work. The many honors, although deeply appreciated, never influenced his bearing or disturbed his equilibrium. But, to his more intimate friends, there was another, a less recognized, heroic element of his life. His late years were unfortunately clouded with a battle to secure for his inventions the full opportunity to serve mankind. Frequency modulation, in particular, involved a fundamental change in radio broadcasting, and its introduction was resisted by the older, already established “amplitude” interests. Few men in making their inventions available to their fellow men have ever been called upon to exercise the patience, and determination exerted by Major Armstrong. Long and exhausting labor was unhappily diverted to a struggle to secure a chance to live for the products of his ever-active mind. He met this challenge with unflagging determination. The lecture series is co-sponsored by the Armstrong Memorial Research Foundation. Past Lectures 2024-10-17. EE Armstrong Memorial Lecture: 'CHIPS: Execute for Success' by Mung Chiang 2021-11-18. Shaping the Future of Work by David Autor 2020-11-20. Climate Change and Innovative Paths to a Sustainable Future by Steven Chu 2019-10-15. Digital Wireless: Origins, Evolution and Challenges by Andrew Viterbi 2018-09-25. The Process of Making Breakthroughs in Engineering by Thomas Kailath 2017-12-08. High-Capacity Optical and Millimeter-Wave Wireless Communications using Multiplexing of Multiple Orbital-Angular-Momentum Beams by Alan Willner 2017-04-14. An expanding and expansive view of computing by Jim Kurose 2016-10-25. From Armstrong, Through Shannon, to Massive MIMO: 100 Years of Wireless Technological Progress by Thomas L. Marzetta 2013-03-15. How Armstrong's Circuits Made the Radio Receiver Part of Our Lives by Asad A. Abidi 2012-02-01. Technology and Business Innovations at Qualcomm with Impact on a World of Nearly Six Billion Cellular Subscribers by Irwin Mark Jacobs 2011-01-20. The Smart Grid: Power for the 21st Century by George Arnold 2010-01-29. Wireless: Revolution and Evolution by H. Vincent Poor 2008-11-07. A Wildly Nonlinear History of Wireless by T. Lee 2007-03-26. Reflections on the VLSI Design Revolution by Lynn Conway 2006-10-30. The Changing Nature of Innovation by Paul M. Horn 2005-09-19. Unbreakable Secret Key Distribution? Quantum Cryptography and Optical Networks by Matthew S. Goodman 2003-03-26. Sociology and Surprise in Science and Technology by Charles H. Townes 1990-04-02. Micromechanics and Microdynamics by Richard S. Muller 1980-02-29. The Changing Television Industry by Leonard S. Golding 1980-02-01. Computational Complexity by Joseph F. Traub 1979-12-07. Infrared Electronics by Steven E. Schwartz 1979-11-09. Magnetic Fields of the Human Brain by Samuel J. Williamson 1978-03-31. The Electronics Revolution by Jerome J. Suran 1977-12-09. The Advances in Charge-Coupled Devices (CCD's) and Applications by Walter F. Kosonocky 1977-10-28. Satellite Communications - Technology and Trends by Burton I. Edelson 1977-04-22. Computer Mediated Communication by Robert M. Fano 1975-11-07. The Social Position of the Engineer in 1975 - An Agenda by Arthur P. Stern 1975-04-25. Man, Computers, and Creativity: the Dialogue Problem by Robert Spence 1975-04-04. Directions in Computer Communication Architecture by Paul E. Green, Jr. 1975-03-07. Computers that Talk and Listen: Man-Machine Communication by Voice by James L. Flanagan"
