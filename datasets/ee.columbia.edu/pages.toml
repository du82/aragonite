full_description = "Contact Electrical Engineering Department Fu Foundation School of Engineering and Applied Science Our Address Columbia University The Department of Electrical Engineering 1300 S. W. Mudd Building, MC 4712 500 W. 120th Street New York, NY 10027 phone icon 212-854-3105 fax icon 212-932-9421 envelope icon Contact Us Visit Us Navigating the Campus The Electrical Engineering Department is located on the 13th floor of the S.W. Mudd Building on the southwest corner of 120th Street and Amsterdam Avenue. If you are coming from the campus level, you will enter on the 4th floor. If you enter the building from 120th Street, you will be on the first floor. Many faculty offices, department labs, and seminar locations (e.g., Interschool Lab on the 7th floor and Davis Auditorium on the 4th floor) are in the Schapiro Center for Engineering and Physical Science Research (CEPSR) building next door to Mudd. CEPSR is connected to Mudd through a bridge that is on the 10th floor of Mudd and the 9th floor of CEPSR. Printable Maps"
