full_description = "EE Computing Lab Remote Access Lab computers, from cadpc01.ee.columbia.edu to cadpc42.ee.columbia.edu, and micro01.ee.columbia.edu to micro36.ee.columbia.edu, are currently accessible using the method outlined below. You can check the remote lab workstation status page to help you find available machines. To access the labs remotely, you need an active EE Computer Lab System account and an active UNI to access Columbia CUIT VPN. Once connected to CUIT VPN, you'll use a NoMachine Enterprise Client to create/connect to a virtual desktop running on lab workstations. NoMachine Enterprise Client is compatible with Windows, Mac OS X, and Linux, and connections are established via SSH protocol. For detailed instructions on installing and configuring NoMachine Enterprise Client and connecting to lab workstations, Please refer to the Remote Access User Guide."
