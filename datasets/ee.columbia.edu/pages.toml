["https://ee.columbia.edu/content/mingoo-seok"]
title = "Mingoo Seok | Electrical Engineering"
full_description = "Mingoo Seok Research Interest Integrated Circuits and Systems Computer Engineering and Computer Systems Mingoo Seok is an associate professor in the Department of Electrical Engineering, School of Engineering and Applied Science at Columbia University since 2012. He received the BS (with summa cum laude) in electrical engineering from Seoul National University, South Korea, in 2005, and the MS and PhD degree from University of Michigan in 2007 and 2011, respectively, all in electrical engineering. He has spent about a year as a member of technical staff in the Systems and Applications R&D Center of Texas Instruments, Dallas, Texas. He has a research interest in energy-efficient and high performance VLSI circuit and system design, cyber physical systems, ubiquitous sensing and computing, and system on chip design. He received 1999 Distinguished Undergraduate Scholarship from the Korea Foundation for Advanced Studies, 2005 Doctoral Fellowship from the same organization, and 2008 Rackham Pre-Doctoral Fellowship from University of Michigan, Ann Arbor. He also won 2009 AMD/CICC Scholarship Award for picowatt voltage reference work and 2009 DAC/ISSCC Design Contest for the 35pW sensor platform design (a.k.a. Phoenix Processor). He holds one pending international patent."
