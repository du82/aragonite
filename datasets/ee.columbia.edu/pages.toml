["https://ee.columbia.edu/content/gil-zussman"]
title = "Gil Zussman | Electrical Engineering"
full_description = "Gil Zussman Research Interest Networking and Communications Smart Electric Energy Computer Engineering and Computer Systems Gil Zussman received the B.Sc. degree in Industrial Engineering and Management and the B.A. degree in Economics (both summa cum laude) from the Technion – Israel Institute of Technology in 1995. He received the M.Sc. degree (summa cum laude) in Operations Research from Tel-Aviv University in 1999 and the Ph.D. degree in Electrical Engineering from the Technion – Israel Institute of Technology in 2004. Between 1995 and 1998, he served as an engineer in the Israel Defense Forces. Between 2004 and 2007 he was a Postdoctoral Associate in LIDS and CNRG at MIT. Since 2007 he has been with Columbia University where he is now a Professor of Electrical Engineering and Computer Science (affiliated faculty), and member of the Data Science Institute. Between 2014 and 2016 he was a Visiting Scientist in the School of Computer Science in Tel Aviv University. His research interests are in the area of networking, and in particular in the areas of wireless, mobile, and resilient networks. He has been an associate editor of IEEE/ACM Transactions on Networking, IEEE Transactions on Control of Network Systems, IEEE Transactions on Wireless Communications, and Ad Hoc Networks, the Technical Program Committee (TPC) co-chair of IEEE INFOCOM’23, ACM MobiHoc’15, and IFIP Performance 2011, and a member of a number of TPCs (including the INFOCOM, MobiCom, SIGMETRICS, and MobiHoc committees). Gil received the Knesset (Israeli Parliament) award for distinguished students, the Marie Curie Outgoing International Fellowship, the Fulbright Fellowship, the DTRA Young Investigator Award, the NSF CAREER Award, and the Marie Curie International Incoming Fellowship. He was the PI of a team that won the 1st place in the 2009 Vodafone Americas Foundation Wireless Innovation Project competition and is the Columbia PI of the NSF PAWR COSMOS testbed. He is an IEEE Fellow and a co-recipient of seven best paper awards, including the ACM SIGMETRICS / IFIP Performance’06 Best Paper Award, the 2011 IEEE Communications Society Award for Advances in Communication, and the ACM CoNEXT’16 Best Paper Award."
