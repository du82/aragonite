full_description = "Main navigation Welcome from the Chair Fast Facts EE Degrees Conferred (data table) Student Life and Culture History EE125 Administration Work Here Contact Us Chair Mark HorowitzPackard 175chair@ee.stanford.edu(650) 723-5782 Departmental policy and programs, Chair of Department Executive Committee. Assistant to the Chair Marsha DillonPackard 174 marshad@stanford.edu(650) 723-6471 Department chair’s administrative support. Associate Chair of Undergraduate Education Dustin Schroederdustin.m.schroeder@stanford.edu Undergraduate curriculum, TAs, Student Advising. Associate Chair of Graduate Education Brad OsgoodPackard 271osgood@stanford.edu Graduate curriculum, TAs, Quals, Student progress, Curricular Practical Training (CPT). Associate Chair of Admissions Howard ZebkerPackard 334zebker@ee.stanford.edu Admissions Director of Finance and Operations Mary K. McMahonPackard 174mkmcmahon@ee.stanford.edu(650) 723-4607 Department administration, financial management, personnel, facilities. Financial Officer Lisa SickorezPackard 176lsickorez@stanford.edu(650) 723-2877 Administers operating budget, gift funds; faculty and staff payroll, and other financial forms. Faculty & Staff Affairs Manager Chet FrostPackard 170cffrost@stanford.edu(650) 724-7630 Responsible for faculty searches, appointments/reappointments/promotions, and staff appointments. Serves as the primary staffing contact. Faculty Affairs & Staffing Administrator Samer DabitPackard 170sdabit@stanford.edu(650) 725-9319 Processes short-term faculty appointments, organizes distinguished lectures, and assists with faculty searches. Admissions & Student Services Director of Student & Academic Services Meo KittiwanichPackard 165meok@stanford.edu(650) 723-6539 Manage administration of student services: admissions, degree progress, course scheduling and financial aid. Evaluation of graduate applications and financial aid awards. Degree Progress Officer Laura WuethrichPackard 165lwuet72@stanford.edu(650) 723-3194 Monitor degree progress for graduate and undergraduate students. Advise graduate and undergraduate students on department and university policies and procedures relating to degree progress. Approve academic forms. Management of PhD oral exam committees and reading committees. Responsible for the department's Commencement events. Graduate Admissions Officer Patty RamirezPackard 163pram88@stanford.edu(650) 736-2070 Manage graduate admissions and fellowship appointments; including graduate authorization petitions, honor cooperative program (HCP) program, and non-degree option (NDO) program. Administer and implement University and Department policies and procedures concerning graduate admissions and financial aid. Graduate Admissions Specialist & Student Life Coordinator Zerreen KaziPackard 163zerreen@stanford.edu(650) 736-1772 Administer and implement University and Department policies and procedures concerning graduate admissions and financial aid. Responsible for New Student Orientation, Visit Day, and student life events. Reception of EE prospective graduate students. Academic Affairs & Programs Administrator Jill PasewarkPackard 164jmp2@stanford.edu(650) 725-9327 Manages and coordinates courses and curriculum for Graduate and Undergraduate courses. Manages teaching assistant and course grader appointments as well as the Research Experience for Undergraduates (REU) Program. Student Financial Officer Jam KiattinantPackard 164jamster@stanford.edu(650) 736-8171 Primary contact for graduate student financial inquiries. Process and monitor the department's student financial appointments. Visiting Student Researcher (VSR) and Postdoctoral Appointments point person for EE administrative staff for the processing of VSR and Postdoctoral forms and appointments. Research IT & Web Services Contact action@ee.stanford.edu for support and inquiries. Thanks! Faculty Director Mark HorowitzPackard 175horowitz@ee.stanford.edu Web Content Manager Rachelle MozeleskiPackard 176rachelle@ee.stanford.edu(650) 724-1080 Internal and external department web content creation, management and strategy. IT Manager Joe LittleGates 456jlittle@ee.stanford.edu(650) 725-6115 EE IT Manager, Manager of the Gates Building EE networks & computer facilities, and developer of administrative applications. System Administrator/Developer Thomas CarlsonAllen 214tec@stanford.edu(650) 725-3645 Department network and system administrator for the Allen Building. Systems and Network Manager John DeSilvaPackard 168desilva@stanford.edu(650) 736-0460 EE Manager of the Packard Building networks and computer facilities. Web and System Administrator/Developer Eric WheelerPackard 176reric@stanford.edu(650) 721-2413 EE department web developer and system administrator. Facilities Facilities and Health & Safety Kenny GreenPackard 115kennygee@stanford.edu(650) 724-3310 Packard and Allen buildings facilities services manager, health & safety and space inventory coordinator. Instructional Labs Manager Aria RashidiPackard 168ariar@stanford.edu(650) 723-1660 Manages the facilities and scheduling for the department's teaching labs. Maker Space Lab Manager Jeff StriblingPackard 168stribs@stanford.edu(650) 736-1664 Manages the facilities and scheduling for the department's maker space labs."
