title = "Contact Us"
full_description = "Main navigation Welcome from the Chair Fast Facts EE Degrees Conferred (data table) Student Life and Culture History EE125 Administration Work Here Contact Us Main Department Address Department of Electrical Engineering David Packard Building (Map) 350 Jane Stanford Way Stanford, CA 94305-9505 Mail Code: 9505 info@ee.stanford.edu Phone: (650) 723-3931 Admissions Department of Electrical Engineering Attention: Admissions Office 350 Jane Stanford Way Stanford, CA 94305-9505 admissions@ee.stanford.edu General Map & Directions Parking The parking garages closest to the Packard building are the Via Ortega Garage and the Roble Field Garage. Both have Visitor Parking spaces. Paid parking is enforced until 4pm* Monday-Friday, and physical pay machines are not available. Payment options include the ParkMobile app or text “Park” to 77223 or Pay-By-Phone at (877) 727-5718. Via Ortega Garage: Zone number 7202 Roble Field Garage: Zone number 7210 After 4 pm* on weekdays, and on weekends, there is no charge for parking, and you may also park in “A” or “C” parking spaces. * Parking enforcement hours may change, so always check posted signs in any parking area. How to purchase visitor parking, Stanford transportation website: transportation.stanford.edu/how-purchase-visitor-parking More information, including airport, public transportation, and campus eatery information, is available at Stanford's main visitor website."
