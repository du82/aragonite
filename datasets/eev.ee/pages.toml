title = "Updates / Blog / fuzzy notepad"
full_description = "Tue Dec 03, 2024 Fresh start I hit a point where I just didn’t like this website any more. It was too… stuffy. Posts kept getting longer, more elaborate, more time-consuming to write. I didn’t recognize the tone any more, and when I look back at older posts, those are way snarkier than they need to be. I think I was trying to be taken seriously-but-not-too-seriously, and the voice that developed as a result was just really weird. I kept looking at this blog and thinking… who is this? Who wrote this? And who is supposed to write more of this? So I’ve changed everything. Keep reading (about 5 min.) Mon Nov 30, 2020 Cherry Kisses, on Steam 🔗 Steam release 🔗 itch release Whoops! I meant to write about this when it originally came out, in April, but never quite got around to collecting my thoughts. Here is a very rushed subset of them. The game is extremely NSFW, but the commentary below is not. Keep reading (about 13 min.) Sat Sep 26, 2020 Lexy’s Labyrinth 🔗 Lexy’s Labyrinth 🔗 Source code on GitHub 🔗 itch.io later Here is Lexy’s Labyrinth, a web-based Chip’s Challenge emulator. It’s easy to get into and mostly speaks for itself, so here is a story. Keep reading (about 8 min.) Sun May 10, 2020 Star Anise Chronicles: Oh No Wheres Twig?? 🔗 Play it on itch.io 🔗 Play it on the PICO-8 BBS (where you can also download the cart and view the source code) (I originally drafted this just after publishing the game, but then decided to start a whole series about its development and wasn’t sure what to do with this! But it’s solid and serves a different purpose, so here it is.) It’s been a while, but I made another PICO-8 game! It’s a little platformer with light puzzling, where you help Star Anise find his best friend Branch Commander Twig. It’s only half an hour long at worst, and it’s even playable on a phone! This is the one-and-a-halfth entry in the Star Anise Chronicles series, which after several false starts, finally kicked off over Christmas with a… uh… interactive fiction game. Expect the series to continue with even more whiplash-inducing theme shifts. More technical considerations will go in the “gamedev from scratch” series, but read on for some overall thoughts on the design. Both contain spoilers, of course, so I do urge you to play the game first. Keep reading (about 11 min.)"
