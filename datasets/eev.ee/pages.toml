full_description = "Tue Aug 04, 2020 fox flux, three years later I’m working on a video game! Like, a serious one. Keep reading (about 12 min.) Wed Oct 02, 2019 Weekly roundup: Somewhere I would not say I’ve been having a great time. fox flux: I fixed some bugs with pushing on flat ground, and did a bunch of math. Sun Sep 22, 2019 Weekly roundup: Foglights Hello!! This is just the year of endless interruptions. I switched medication and I’m functional, but I think I have withdrawal from going off the old stuff, so I’ve been a little spacey for about a week. Hoping it passes soon! Also some other distractions happened. But in the meantime I’ve been drawing a lot. art: I’ve been joining Ash’s commission streams for the past week or so and mostly doodling porn, but after doing that for a while, I decided I should try coloring stuff again, so now I’m doing that also. Definitely need the practice, but really enjoying seeing myself produce more finished work again. I guess I could go put some of that work in the canonical place, too. blog: I did a whole bunch of work on a blog post which is going to be preposterously long, but hey, what a way to come back. Hoping to finish it by the end of the month, if I can get my brain working again. alice: Still writing for this… Thu Sep 12, 2019 Weekly roundup: All that glistens fox flux: I’ve been kind of taking a break from physics, but I did have some ideas about how extrinsic velocity could work, got them working for a conveyor belt, and then extended the same concept to a rough rework of pushing. It works surprisingly well given how little time I spent on it, so that’s very promising. gleam: I put together the first production VN with it, and although I had to cheat and hand-edit a bit, GLEAM grew a bunch of useful stubs of features along the way! It’s getting there. Also I discovered a fascinating edge case in Firefox when you have 800 images visible but all but one of them have zero opacity. Thu Sep 05, 2019 Weekly roundup: Waste not, want not Wee bit late, but I’ve been busy. fox flux: I wrote some push physics tests, now that it’s possible to do that. Removed some old obsolete garbage I’ve hated for like a year, hooray. And then I got stuck in a horrible loop of coming up with a new idea for how to do pushing, realizing it won’t work in some case, making a thousand notes, rinse and repeat. I can’t even fall back to spriting, because my tablet broke! Argh. doom: I made WasteNot, a ridiculous ZDoom mod that tracks how much ammo/health/armor you lose by grabbing items when you’re close to the max amount you can carry. Also I put some Doom stuff on Itch and the landing page here. Very exciting week. I spent a lot of it exhausted, after rushing to invert my sleep schedule in not very much time."
