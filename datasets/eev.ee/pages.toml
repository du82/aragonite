full_description = "Fri Jan 17, 2025 Eevee gained 4,219 experience points… Eevee grew to level 38! It’s been a few years since I did one of these. My birthday in 2022 was kind of overshadowed by the loss of our darling cat Pearl. But I think I’d like to get back into it, to christen the redone website. Keep reading (about 12 min.) 💰 free 🕹️ web (mobile OK) 🎲 sokoban-like ⏰ nearly endless Free reimplementation of Chip's Challenge and its lesser-known sequel. Tons of built-in community levels; nearly unlimited rewind and undo; a whole level editor; and support for loading just about anything. Plus some more obscure extras. 💰 free 🕹️ pico-8 / web (mobile OK) 🎲 puzzle-platformer ⏰ half an hour Star Anise takes a short but heartfelt romp across the surface of the imaginary moon, in search of his super best friend Twig and also all the stuff he lost. 💰 free demo 🕹️ löve / any desktop OS 🎲 puzzle-platformer ⏰ hour or two Play as Lexy the squishy fox and traverse a variety of puzzle levels by being turned to slime, inflated like a balloon, and who knows what else. A work in progress, but you can play the first bit for free, and patrons get occasional new builds. 💰 $6.90 🕹️ löve / any desktop OS 🎲 conversation sim ⏰ several hours Run a sex shop and get spicy with your customers, in an illustrated... talking simulator? with an optional narrative meta-puzzle that I'm very pleased with. We made this for Strawberry Jam 3, ran late, finished it anyway, and put it on Steam."
