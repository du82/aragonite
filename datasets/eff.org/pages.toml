["https://eff.org/about/staff/sophia-cope"]
title = "Sophia Cope | Electronic Frontier Foundation"
description = "Sophia Cope is a Senior Staff Attorney on the Electronic Frontier Foundation's civil liberties team, working on a variety of free speech and privacy issues. Key topics include border searches of electronic devices, surveillance and human rights, the right to record the police, Section 230, and..."
full_description = '''Sophia Cope Senior Staff AttorneySophia Cope is a Senior Staff Attorney on the Electronic Frontier Foundation's civil liberties team, working on a variety of free speech and privacy issues. Key topics include border searches of electronic devices, surveillance and human rights, the right to record the police, Section 230, and student speech and student privacy online. She has been a civil liberties attorney for two decades and has experience in both litigation and policy advocacy. Her writing has appeared in the New York Times, Guardian, Slate, and Huffington Post. Prior to joining EFF, Sophia spent eight years in Washington, D.C. She worked at the Newspaper Association of America (now the News Media Alliance) on freedom of the press and digital media issues, with a focus on protecting journalists' confidential sources. She advocated for a federal shield law, a warrant-for-content requirement under the Electronic Communications Privacy Act, and improvements to the Freedom of Information Act. She also wrote a chapter for a book published by the American Bar Association entitled "Whistleblowers, Leaks and the Media: The First Amendment and National Security" and spoke out against NSA surveillance. Prior to NAA, Sophia worked at the Center for Democracy & Technology on a variety of civil liberties and human rights issues related to the Internet and technology, including the regulation of content on the Internet and broadcast television, and the privacy implications of government identification programs. She also worked on the development and launch of the Global Network Initiative. Before moving to Washington, D.C., Sophia litigated at the First Amendment Project in Oakland, California, where she defended an environmental activist against a frivolous lawsuit and a video journalist against a federal subpoena seeking his unpublished footage. She also counseled clients on how to obtain greater access to public records and public meetings. Sophia was an adjunct professor of media law for nearly four years, teaching Washington, D.C.-area undergraduate communication and journalism students. She is on the board of the Public Participation Project and on the advisory board for Open Vallejo. She is a graduate of Santa Clara University and University of California College of the Law, San Francisco (UC Law SF, formerly UC Hastings). She is proud to be a native Californian. Email Address: sophia@eff.orgPhone: +1 415 436 9333 x155PGP Key: sophia_cope_pub.ascX handle: @scopeseticAdditional High Res Photos: Download sophia_cope_highres.jpg (1.4 MB)'''
year_published = 2014
