["https://eff.org/about/staff/andrew-crocker"]
title = "Andrew Crocker | Electronic Frontier Foundation"
description = "Andrew’s work focuses on surveillance, privacy, and cybersecurity. As Surveillance Litigation Director, he leads EFF's legal work on issues at the intersection of technology and privacy through lawsuits and amicus briefs in state and federal courts, including the U.S. Supreme Court. He also leads..."
full_description = "Andrew Crocker Surveillance Litigation DirectorAndrew’s work focuses on surveillance, privacy, and cybersecurity. As Surveillance Litigation Director, he leads EFF's legal work on issues at the intersection of technology and privacy through lawsuits and amicus briefs in state and federal courts, including the U.S. Supreme Court. He also leads EFF’s Coders' Rights Project, which provides representation for security researchers, journalists, and hackers, who often face unwarranted legal threats and scrutiny for their work. Representative cases include challenging the constitutionality of national security letters (NSLs); working to establish that the Fifth Amendment privilege against self-incrimination protects against the compelled decryption of electronic devices; and limiting overbroad anti-hacking laws such as the Computer Fraud and Abuse Act (CFAA). He also writes and speaks about EFF’s legislative and advocacy priorities including FISA Section 702, anti-encryption proposals, location tracking and other novel surveillance techniques. He received his undergraduate and law degrees from Harvard University. Email Address: andrew@eff.orgPhone: +1 415 436 9333 x139 Deeplinks Blog by Thorin Klosowski, Andrew Crocker | February 21, 2025 Cornered by the UK’s Demand for an Encryption Backdoor, Apple Turns Off Its Strongest Security Setting Today, in response to the U.K.’s demands for a backdoor, Apple has stopped offering users in the U.K. Advanced Data Protection, an optional feature in iCloud that turns on end-to-end encryption for files, backups, and more. Had Apple complied with the U.K.’s original demands, they would have... Read more about Cornered by the UK’s Demand for an Encryption Backdoor, Apple Turns Off Its Strongest Security Setting Deeplinks Blog by Andrew Crocker, Matthew Guariglia | January 22, 2025 VICTORY! Federal Court (Finally) Rules Backdoor Searches of 702 Data Unconstitutional Español In a landmark ruling, a federal district court held that backdoor searches of databases full of Americans’ private communications collected under Section 702 ordinarily require a warrant. Congress should uphold its responsibility to protect civil rights and civil liberties by refusing to renew Section 702 absent a number of necessary reforms. Read more about VICTORY! Federal Court (Finally) Rules Backdoor Searches of 702 Data Unconstitutional"
year_published = 2013
year_updated = 2023
