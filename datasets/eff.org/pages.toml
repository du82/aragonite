["https://eff.org/about"]
title = "About EFF | Electronic Frontier Foundation"
description = "The Electronic Frontier Foundation is the leading nonprofit organization defending civil liberties in the digital world. Founded in 1990, EFF champions user privacy, free expression, and innovation through impact litigation, policy analysis, grassroots activism, and technology development. EFF's..."
full_description = "العربية 简体中文 Português Español The Electronic Frontier Foundation is the leading nonprofit organization defending civil liberties in the digital world. Founded in 1990, EFF champions user privacy, free expression, and innovation through impact litigation, policy analysis, grassroots activism, and technology development. EFF's mission is to ensure that technology supports freedom, justice, and innovation for all people of the world. EFF's mission is to ensure that technology supports freedom, justice, and innovation for all people of the world. Even in the fledgling days of the Internet, EFF understood that protecting access to technology was central to advancing freedom for all. In the years that followed, EFF used our fiercely independent voice to clear the way for open source software, encryption, security research, file sharing tools, and a world of emerging technologies. Today, EFF uses the unique expertise of leading technologists, activists, and attorneys in our efforts to defend free speech online, fight illegal surveillance, advocate for users and innovators, and support freedom-enhancing technologies. Together, we forged a vast network of concerned members and partner organizations spanning the globe. EFF advises policymakers and educates the press and the public through comprehensive analysis, educational guides, activist workshops, and more. EFF empowers hundreds of thousands of individuals through our Action Center and has become a leading voice in online rights debates. EFF is a donor-funded U.S. 501(c)(3) nonprofit organization that depends on your support to continue fighting for users. Additional information: Become an EFF Member Annual Reports & Financial Information Historic EFF Court Victories Why EFF Is Sometimes Quiet About Important Cases EFF's Founding"
