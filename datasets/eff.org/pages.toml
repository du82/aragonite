full_description = '''Donate to the Electronic Frontier Foundation and support the mission to defend civil liberties and human rights online. You can help EFF’s attorneys, activists, and technologists protect privacy, free expression, and digital creativity at a time when the world needs it most. For organizations, please join here. EFF is celebrating ten years of top ratings from the nonprofit watchdog Charity Navigator! Your donation is tax-deductible as allowed by law. This checkbox makes you an official EFF member this year! There are no additional requirements or fees, you'll get one email about your benefits, and your membership status is confidential. We are currently unable to ship items to India and Russia and there may be significant delays to China. See the U.S. Postal Service for more information. White sticker sheet features the classic EFF logo; Code Is Speech; EFF issues: Activism, Technology, Litigation; and various EFF catchphrases. Support creativity & freedom with EFF. Fresh in the public domain, we see the famed mouse defying manufacturers with DIY determination. These heather grey polycotton t-shirts come in roomy Classic Fit, stretchy Slim Fit, or Youth sizes for all bodies. Youth shirts are also available in our store! Stay shaded, stylish, and ready to stand up for user rights with this low-profile cotton twill dad cap! It's made of 100% cotton with a 6-panel, unstructured, low-profile design, and an antique brass slide closure. One size fits most. Features EFF's mission in metallic gold with glow-in-the-dark details. "Stay Golden" is a tribute to our resilience and power together through darkness, Heavier-weight 20/80 polycotton with minimal shrinkage, raglan sleeves, and gunmetal zipper. This roomy fit looks great on all bodies. Size Chart. Support creativity & freedom with EFF. Fresh in the public domain, we see the famed mouse defying manufacturers with DIY determination. These heather grey polycotton t-shirts come in roomy Classic Fit, stretchy Slim Fit, or Youth sizes for all bodies. Youth shirts are also available in our store! Combo includes a Multisticker Sheet and an EFF Grey Hat.'''
