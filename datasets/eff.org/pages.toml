full_description = "Aaron Mackey Free Speech and Transparency Litigation DirectorAaron litigates free speech, anonymity, privacy, government surveillance and transparency cases. Before joining EFF in 2015, Aaron was in Washington, D.C. where he worked on speech, privacy, and freedom of information issues at the Reporters Committee for Freedom of the Press and the Institute for Public Representation at Georgetown Law. Aaron graduated from Berkeley Law, where he worked for EFF while a student in the Samuelson Law, Technology & Public Policy Clinic. He also holds an LLM from Georgetown Law. Prior to law school, Aaron was a journalist at the Arizona Daily Star in Tucson, Arizona. He received his undergraduate degree in journalism and English from the University of Arizona, where he met his amazing wife, Ashley. They have two children. Email Address: amackey@eff.orgPhone: +1 415 436 9333 x167X handle: @aaron_d_mackey Deeplinks Blog by Sophia Cope, Aaron Mackey | February 27, 2025 Ninth Circuit Correctly Rules That Dating App Isn’t Liable for Matching Users The U.S. Court of Appeals for the Ninth Circuit correctly held that Grindr, a popular dating app, can’t be held responsible for matching users and enabling them to exchange messages that led to real-world harm. EFF and the Woodhull Freedom Foundation filed an amicus brief in the Ninth... Read more about Ninth Circuit Correctly Rules That Dating App Isn’t Liable for Matching Users Deeplinks Blog by Aaron Mackey | February 13, 2025 First Trump DOJ Assembled “Tiger Team” To Rewrite Key Law Protecting Online Speech As President Donald Trump issued an Executive Order in 2020 to retaliate against online services that fact-checked him, a team within the Department of Justice (DOJ) was finalizing a proposal to substantially weaken a key law that protects internet users’ speech.Documents released to EFF as part of a Freedom... Read more about First Trump DOJ Assembled “Tiger Team” To Rewrite Key Law Protecting Online Speech Deeplinks Blog by Sophia Cope, Aaron Mackey, David Greene | December 24, 2024 The U.S. Supreme Court Continues its Foray into Free Speech and Tech: 2024 in Review As we said last year, the U.S. Supreme Court has taken an unusually active interest in internet free speech issues over the past couple years.All five pending cases at the end of last year, covering three issues, were decided this year, with varying degrees of First Amendment guidance for... Read more about The U.S. Supreme Court Continues its Foray into Free Speech and Tech: 2024 in Review"
