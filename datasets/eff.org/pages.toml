["https://eff.org/pages/membership-faq"]
title = "Membership FAQ | Electronic Frontier Foundation"
description = "TABLE OF CONTENTSUPDATE MY INFORMATIONSHOP ORDERSDONATIONSOTHER WAYS TO GIVEDONOR POLICYOUTREACH AND EVENTSORGANIZATIONAL MEMBERSHIPMEMBER BENEFITSUPDATE MY INFORMATIONHow do I change my mailing address?If you need to update or correct your mailing address, contact membership@eff.org with the..."
full_description = '''TABLE OF CONTENTS UPDATE MY INFORMATION SHOP ORDERS DONATIONS OTHER WAYS TO GIVE DONOR POLICY OUTREACH AND EVENTS ORGANIZATIONAL MEMBERSHIP MEMBER BENEFITS UPDATE MY INFORMATION How do I change my mailing address? If you need to update or correct your mailing address, contact membership@eff.org with the information you'd like changed and we'll update it in our systems. How do I change my email address on file with EFF? Contact membership@eff.org and we'll update your email address in our systems. How do I update my billing information for recurring donations? PayPal: Log in to your PayPal account and adjust your monthly donations as needed. Credit Card at eff.org: Update your billing information at https://supporters.eff.org/recurring. Feel free to contact the EFF Membership Department at (415)436-9333 x212 for questions or to update your card information. You can also send inquiries to membership@eff.org. How do I update my email preferences? Visit https://supporters.eff.org/account to update your email preferences. SHOP ORDERS When will my shop order ship? Smaller items such as sticker packs are mailed directly from our offices via US Postal Service and can take up to 2-4 weeks for shipping. Our apparel items such as hoodies and t-shirts are sent from our fulfillment center and can take up to 3 weeks for delivery within the US. For international orders, please allow up to 6 weeks for delivery. For questions about your shop order, contact membership@eff.org. How do I return or exchange a purchase? If for any reason you are not completely satisfied with your purchase, please let us know and we will gladly replace or refund your purchase. Any items that have been laundered or altered in any way cannot be accepted for exchange or credit. The item I purchased is out of stock! We make every effort to maintain our inventory and mark items “out-of-stock" or remove the item on our website. On occasion however, we may have fewer items in stock than what you order or the item may have just have become "out-of-stock" from a previous order. Should this happen, we will be in contact directly with you via e-mail to discuss your order. Your options will include: Selecting an alternate product Cancelling your order for that product or products Cancelling your full order DONATIONS Can I have a PDF copy of my receipt? Yes! Please email us at membership@eff.org and confirm your contact information and donation details, and we'll email over a PDF copy of your tax receipt. When do you mail out tax receipts for my recurring donations? Donors who have donated using our monthly or annual recurring donation options will receive an email confirmation when their contributions are successfully processed. At the start of the calendar year, EFF sends out cumulative receipts to all monthly or annual recurring donors totaling their contributions for the previous year. These receipts include all pertinent tax information like EFF's EIN (04-3091431), the fair market value of premiums, our contact information for any issues, and more. We send these receipts out in the regular US Mail. If you'd like a PDF copy of your cumulative receipt, email us at membership@eff.org. I'm a recurring donor. How can I get my annual member gift? All EFF monthly or annual recurring donors are due for a new member gift every 12 months! Please contact us at membership@eff.org to request your annual member gift. Our current member gift offerings are listed on our donate page at https://eff.org/join I keep getting an error message when I try and make a donation online. What should I do? Sorry our donate form is giving you trouble! Please feel free to email us at membership@eff.org with some details about what happened so that we can resolve any issue. If you'd rather speak to someone on the phone to make sure that your donation went through, or for help processing a donation that didn't, please call us between 9am and 5pm PST weekdays at 415-436-9333 and choose the "membership" option in the menu. I donated recently, but I'm getting renewal messages. Why is that happening, and can you help me stop that? We're sorry that you're getting renewal messages at the wrong time! This sometimes happen when we've got more than one contact record for you in our database. Please email us at membership@eff.org so we can sort that out for you. Are donations used for lobbying work or to support political campaigns? As a U.S. 501(c)(3) nonprofit organization, EFF does relatively little lobbying of any kind. EFF limits all lobbying efforts to well within the legal allowances of a 501(c)(3) nonprofit organization. EFF does not engage in any electioneering practices, endorse candidates for elections, nor does EFF make political contributions. How do I give a gift membership? An EFF membership is a great gift for friends or family who support online rights. You can order a gift of membership in our online store, and we'll send out a redeemable gift certificate to your loved one. There's more information about Gifts of Membership in our online store. I'm interested in leaving a bequest to EFF. How would I do that? Information about planned giving and bequests can be found here. If you'd like more information, please reach out to Jocelyn Wicker at jocelyn@eff.org. How do I donate in honor of someone? Donating to EFF is a wonderful way to pay tribute to people you care for while protecting digital rights. EFF accepts donations as tributes to friends or family through our online form at eff.org/tribute. There, you can decide who the donation is in honor of and if you would like to send someone a gift based on your donation. Feel free to email us at membership@eff.org or call +1-415-436-9333 x117 if you have any questions. I'd like to direct people to donate to EFF in honor of a loved one. How can I set that up? If you'd like to set up an online form to allow donations in honor of a loved one or a life event, please email us at membership@eff.org, and we can set up a custom donate page for you. Note that we cannot share information about donors, but we can include information on how donors who visit that page can send you a message about their gift. I want to donate to EFF in person. Will you be at an event near me soon? Check out EFF’s event calendar at https://www.eff.org/events or sign up for our email list to find out more about where we plan to be. OTHER WAYS TO GIVE What kinds of donations do you take? You can give through EFF’s online form—and even become an official EFF member!—by using any major credit card, PayPal, Google Pay, Apple Pay, or cryptocurrency via BitPay. As of this writing, you can use BitPay to donate Bitcoin (BTC), Bitcoin Cash (BCH), Ethereum (ETH), Wrapped Bitcoin (WBTC), Dogecoin (DOGE), Litecoin (LTC), and 5 USD-pegged stablecoins (GUSD, USDC, USDP, DAI, and BUSD).You can donate by check or money order payable to EFF by using our mail-in form. Send it to EFF at 815 Eddy Street, San Francisco, CA 94109 USA.EFF accepts other types of donations including stock, car donations, several cryptocurrencies, employer matching gifts, and more. If you're interested in donating to EFF another way, or can't find the information you're looking for on this page, please reach out to us at membership@eff.org. What information do you need to accept a stock gift? We will need to know the amount and type of shares. Please let us know in advance if you are transmitting securities by contacting Daniel de Zeeuw at ddz@eff.org. You can find more information on how to make a stock transfer here. I made a stock gift but never got a receipt. Where is it? Please reach out to Daniel de Zeeuw at ddz@eff.org to receive a receipt for a stock gift. We request that donors let us know in advance when they’re making a stock donation. Our broker’s stock confirmation reports do not relay donor details. As a result, we can only confirm your gift and provide a receipt, if you reach out to us and inform us of the amount and type of shares you transferred. How can I volunteer? There are several ways to volunteer with EFF. Learn more here: https://www.eff.org/about/opportunities/volunteer DONOR POLICY A note to our donors Because we seek to represent the public good, and the rights of technology users from all backgrounds, we always act independently from the sources of our funding. That means that donors do not set or influence our agenda or our positions. We believe this is critical not just for EFF, but for our donors, too. Read more. Gift return policy / Donation return policy For information on how to exchange/cancel a gift, please see our Shop Orders section. If you have made an error in making your donation or change your mind about contributing to the Electronic Frontier Foundation, we will honor your request for a full or partial refund made within three months of your donation. If you received a donation premium or product with your contribution, it may be neccessary to return this item during the refund process. To request a refund or cancel a donation, please email membership@eff.org or call +1 (415) 436-9333 x212. Refunds are returned using the original method of payment. If you made your donation by credit card, your refund will be credited to that same credit card. If you did not make your donation using the eff.org website, please contact the EFF Membership Team with further details. Do you sell, exchange, or give out my donor information? EFF takes our donor's privacy seriously. Please see our privacy policy here: https://www.eff.org/policy If I sign up for EFFector, will I start getting mail from other non-profits? Please see the section "Information Gathered by EFF's Site" in our privacy policy: https://www.eff.org/policy GDPR Information For information about EFF and the GDPR (General Data Protection Regulation), please see the section "Third-Party Service Providers to EFF in our privacy policy: https://www.eff.org/policy Does EFF do lobbying, and if so what kind? EFF champions user privacy, free expression, and innovation through impact litigation, policy analysis, grassroots activism, and technology development. EFF limits all lobbying efforts to within the legal allowances of a 501(c)(3) nonprofit organization. EFF does not engage in any electioneering practices. OUTREACH AND EVENTS What is EFFector? How do I sign up for EFFector? How often will I get it? EFFector is EFF's email newsletter. To sign up, enter your email address at https://eff.org/EFFector. Include your postal code to get information—including event invitations and Action Alerts—specific to your community. On our email list, you will receive information about EFF’s work, events, campaigns, and ways to support digital freedom. You can expect our newsletter EFFector approximately twice each month. How can I get notified about upcoming events? Check out EFF’s event calendar at https://www.eff.org/events or sign up for our email list at https://www.eff.org/EFFector. Include your postal code to get information, including event invitations and Action Alerts, specific to your community. On our email list, you will receive information about EFF’s work, events, campaigns, and ways to support digital freedom. Does EFF ever do events in my town? If not, can you start? Check out EFF’s event calendar at https://www.eff.org/events or sign up for our email list at https://www.eff.org/EFFector to find out where we will be next. EFF holds regional Speakeasy meet-ups all around the world. These are designed to coincide with our traveling staff members. Become a member at https://www.eff.org/join to stay in the loop. If you would like to request a speaker from EFF, submit your request at https://www.eff.org/request-EFF-speaker-details. You might also consider looking for an affinity group in the the Electronic Frontier Alliance, a grassroots network of community and campus organizations across the United States working to educate our neighbors about the importance of digital rights. Or, if you would like to create your own affinity group and draw online rights supporters together in your community with some guidance from EFF, consider joining the Electronic Frontier Alliance. Find out more at https://www.eff.org/efa. How do I invite someone from EFF to speak in my community or at my event? We love reaching out to new audiences! Submit your request at https://www.eff.org/request-EFF-speaker-details. I have an idea for an EFF fundraiser or I'm going to throw an EFF fundraiser. Who can I talk to? Thank you for wanting to support EFF's work! We aren't able to offer resources to help you throw your fundraiser, though we are grateful for donations that you might want to make. Make sure to tag us when you mention your fundraiser on social media, as we can, in some instances, re-share fundraisers. We're @EFF on Twitter, @efforg on Instagram, and @EFF on Facebook. I'm in town and would like to stop by your office for a visit. Do you offer tours of the EFF offices? Thank you for your interest in visiting. Unfortunately, our offices aren’t open to visitors for security and safety reasons. ORGANIZATIONAL MEMBERSHIPS What is an organizational membership? Organizational membership is open to any company, private foundation, or organization that donates at least $5,000 per year (or $2,000 per year for organizations with less than $5M revenue per year) and agrees to EFF's org member pledge (below). Membership includes a range of benefits that vary by level. While EFF does not endorse private companies or their products, we're grateful for their contributions. Since we're a 501(c)(3) nonprofit, the donation is tax deductible. Organizational Member Pledge: By supporting EFF, we share in EFF’s commitment to help create a world in which technology supports freedom, justice, and innovation for all the people of the world, without discrimination on the basis of race, religion, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, or age. We also understand that EFF does not endorse private companies or their products or services, regardless of organizational membership status. We will not use the EFF org member badge in any manner that identifies EFF as a “partner,” “sponsor,” or otherwise implies that EFF has endorsed our organization. How do I become an organizational member? Learn more about the organizational membership program's levels, benefits, and how to donate here. How are organizational members recognized? Organizational member recognition varies by member level, but members that choose to be recognized publicly are included on our org member page, as well as other opportunities including shout outs in our EFFector e-mails, social media platforms, at EFF events, and our annual report. See the organizational member page for logos of current members, as well as member benefits, including recognition. Organizational member links i'''
year_published = 2019
year_updated = 2025
