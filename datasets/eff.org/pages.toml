full_description = "Issues Reclaim Invention When universities invent, those inventions should benefit everyone. Unfortunately, they sometimes end up in the hands of patent trolls, companies that serve no purpose but to amass patents and demand money from other innovators and inventors. We’re asking universities around the country to protect their inventions from patent trolls... Deeplinks Blog | February 24, 2017 Copyright Law Versus Internet Culture Throughout human history, culture has been made by people telling one another stories, building on what has come before, and making it their own. Every generation, every storyteller puts their own spin on old tales to reflect their own values and changing times. This creative remixing happens today and... Deeplinks Blog | April 8, 2017 Ninth Circuit Sends a Message to Platforms: Use a Moderator, Go to Trial After almost two decades of litigation, you’d think the contours of the Digital Millennium Copyright Act (DMCA) safe harbors would be settled. But the cases just keep coming, and while the overall trend is pretty favorable, the latest ruling takes an unfortunate turn (PDF). The... Deeplinks Blog | November 21, 2011 Free Speech is Only as Strong as the Weakest Link From Mubarak knocking a country offline by pressuring local ISPs to PayPal caving to political pressure to cut off funding to WikiLeaks, this year has brought us sobering examples of how online speech can be endangered. And it’s not only political speech that is threatened – in the United... Banner Graphic: Link Online Censorship Description: Onlinecensorship.org seeks to encourage social media companies to operate with greater transparency and accountability toward their users as they make decisions that regulate speech. We’re collecting reports from users in an effort to shine a light on what content is taken down, why companies make certain decisions about content, and... Issues Section 230 47 U.S.C. § 230The Internet allows people everywhere to connect, share ideas, and advocate for change without needing immense resources or technical expertise. Our unprecedented ability to communicate online—on blogs, social media platforms, and educational and cultural platforms like Wikipedia and the Internet Archive—is not an accident. Congress recognized that..."
