full_description = "F. Mario Trujillo Staff AttorneyF. Mario Trujillo is a Staff Attorney on the Electronic Frontier Foundation's civil liberties team, where he focuses on the Fourth Amendment and privacy rights. He is also part of the Coders' Rights Project. Prior to joining EFF, Mario was an attorney at the privacy law firm ZwillGen and clerked for a federal magistrate judge on the southern border. Before law school, Mario worked as a technology policy reporter at The Hill newspaper. Mario holds a J.D. from Georgetown University Law Center and graduated from the University of New Mexico with degrees in journalism and philosophy. Email Address: mario@eff.org Deeplinks Blog by Mario Trujillo | February 26, 2025 EFF to California's Supreme Court: Protect the Privacy of Internet Users' Communications The Stored Communications Act is built on the principle that users have a reasonable expectation of privacy that companies like Snap and Meta will not disclose your communications to third parties. Read more about EFF to California's Supreme Court: Protect the Privacy of Internet Users' Communications Deeplinks Blog by Mario Trujillo, Beryl Lipton | January 6, 2025 EFF Goes to Court to Uncover Police Surveillance Tech in California The private company Pen-Link sued the San Joaquin Sheriff’s Office to block the agency from disclosing to EFF the unredacted contracts between them, claiming the information is a trade secret. We are going to court to make sure the public gets access to these records. Read more about EFF Goes to Court to Uncover Police Surveillance Tech in California Deeplinks Blog by Thorin Klosowski, Lena Cohen, Cooper Quintin, Paige Collings, Christian Romero, Jason Kelley, Mario Trujillo, Joe Mullin, Bill Budington, Guest Author | December 19, 2024 The Breachies 2024: The Worst, Weirdest, Most Impactful Data Breaches of the Year Español Privacy isn’t dead. While some information about you is almost certainly out there, that’s no reason for despair. In fact, it’s a good reason to take action. Read more about The Breachies 2024: The Worst, Weirdest, Most Impactful Data Breaches of the Year"
