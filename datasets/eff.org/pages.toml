["https://www.eff.org/issues/digital-rights-and-black-led-movement-against-police-violence"]
title = "Digital Rights and the Black-led Movement Against Police Violence | Electronic Frontier Foundation"
description = """
Black lives matter on the streets. Black lives matter on the Internet. 
EFF stands with the communities mourning the victims of police homicide. We stand with the protesters who are plowed down by patrol cars. We stand with the journalists placed in handcuffs or fired upon while reporting these atrocities. And we stand with all those using their cameras, phones and digital tools to make sure we cannot turn away from the truth.
There is no doubt that we are in deeply troubled times. From lockdown in our homes, many of us are watching with heart-stopping horror as the cellphone footage of extreme police violence washes down our feeds. Others feel compelled to join the protests in person and to bear witness and document it for the rest of us over the digital networks that connect us all. The president is sowing chaos through incendiary, authoritarian orders and pressure toward more violence, sometimes through official channels, more often on Twitter. The build-up of even more sophisticated mass and targeted surveillance tools in the hands of American law enforcement, and the erosion of local control and protections against misuse, have all been normalized over the past two decades. Now the pandemic management technology being pushed by some tech companies and governments over the last few months is primed to be deployed as a massive new surveillance and control apparatus."""
full_description = '''Deeplinks Blog by Tori Noble | July 15, 2024 Detroit Takes Important Step in Curbing the Harms of Face Recognition Technology In a first-of-its-kind agreement, the Detroit Police Department recently agreed to adopt strict limits on its officers’ use of face recognition technology as part of a settlement in a lawsuit brought by a victim of this faulty technology. Robert Williams, a Black resident of a Detroit suburb, filed... Read more about Detroit Takes Important Step in Curbing the Harms of Face Recognition Technology Deeplinks Blog by Dave Maass, Cara Gagliano | May 25, 2023 Victory in California! Police Instructors Can’t Claim Copyright Protections to Block Release of Use-of-Force and Other Training Materials After a two-year legal battle, the state agency that certifies police officers in California has agreed to EFF's demand that it stop using copyright concerns as a predicate to withhold law enforcement training materials from public scrutiny. The immediate impact of this victory for transparency is the public will be... Read more about Victory in California! Police Instructors Can’t Claim Copyright Protections to Block Release of Use-of-Force and Other Training Materials Deeplinks Blog by Matthew Guariglia | May 23, 2023 SFPD Obtained Live Access to Business Camera Network in Anticipation of Tyre Nichols Protest New documents EFF received through public records requests have revealed that the San Francisco Police Department (SFPD) received live access to the hundreds of surveillance cameras that comprise the Union Square Business Improvement District’s (USBID) camera network in anticipation of potential protests following the police killing of Tyre Nichols in... Read more about SFPD Obtained Live Access to Business Camera Network in Anticipation of Tyre Nichols Protest Deeplinks Blog by Electronic Frontier Foundation | March 2, 2023 Coded Resistance, the Comic! In collaboration with The Nib and illustrator Chelsea Saunders, we've adapted "Coded Resistance" into comic form. Explore the stories of slave revolts, the coded songs of Harriet Tubman, civil rights era strategies for circumventing "Ma Bell," and the use of modern day technology to document police abuse. Read more about Coded Resistance, the Comic!'''
year_published = 2024
