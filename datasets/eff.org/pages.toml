title = "Legal Cases | Electronic Frontier Foundation"
description = "The Electronic Frontier Foundation’s impact litigation has set important precedents for the treatment of rights in cyberspace. Our attorneys work to defend free speech online, fight illegal surveillance, advocate for users and innovators, protect privacy, and support freedom-enhancing technologies...."
full_description = "The Electronic Frontier Foundation’s impact litigation has set important precedents for the treatment of rights in cyberspace. Our attorneys work to defend free speech online, fight illegal surveillance, advocate for users and innovators, protect privacy, and support freedom-enhancing technologies. EFF has taken on the federal government, the FCC, the world's largest entertainment companies, and major electronics companies, among others. We work with advocates worldwide to create a global digital environment that upholds human rights and we continue to take on cutting-edge legal cases to protect and enhance user rights. To read more about our work, visit our Legal Victories page. Legal Case NetChoice Must-Carry Litigation The Supreme Court is considering the validity of two state laws that allows the government to dictate what speech and viewpoints online social media service must publish. The laws enacted by Texas and Florida violate the First Amendment and will lead to greater censorship of users' speech and the loss... Read more about NetChoice Must-Carry Litigation Legal Case A.B.O Comix, et al. v. San Mateo County In 2021, San Mateo County banned anyone incarcerated in its jails from receiving any physical mail other than attorney communications. Under this new policy, the senders of mail must route their letters to Smart Communications, a private for-profit company, which scans and then destroys the physical copy. The digital copy... Read more about A.B.O Comix, et al. v. San Mateo County Legal Case Asian American Liberation Network v. SMUD, et al. Sacramento’s public-owned utility and police are searching entire zip codes’ worth of people’s private data without any legal authorization or a specific investigation, creating a mass surveillance program that invades the privacy of entire communities.The Sacramento Municipal Utility District’s (SMUD) data sharing with the Sacramento Police Department violates people’s right... Read more about Asian American Liberation Network v. SMUD, et al."
