["https://eff.org/about/staff/adam-schwartz"]
title = "Adam Schwartz | Electronic Frontier Foundation"
description = "Adam joined EFF in 2015. He advocates before courts and legislatures against surveillance, censorship, and discrimination.He has represented travelers subjected to warrantless smartphone searches by border officers, protesters against police violence subjected to camera network surveillance,..."
full_description = 'Adam Schwartz Privacy Litigation DirectorAdam joined EFF in 2015. He advocates before courts and legislatures against surveillance, censorship, and discrimination. He has represented travelers subjected to warrantless smartphone searches by border officers, protesters against police violence subjected to camera network surveillance, immigrant advocates opposed to their local sheriff sending license plate location data to ICE, electricity customers subjected to dragnet police smart meter surveillance, dissidents censored in government social media, and customers of phone companies that unlawfully sold location data. He has filed amicus briefs addressing the right to record on-duty police, face surveillance by corporations of consumers, internet banishment and perpetual location-tracking of court-involved people, anonymous online speech, overbroad "cyber-stalking" laws, and expungement of FBI records. He has enforced public records requests for prison data on parolee race (which EFF’s clients used to develop an AI tool to identify improper parole denials), and the Hemisphere phone surveillance program. He advocates for privacy legislation to limit data surveillance by government and by corporations. Previously, Adam worked at the ACLU of Illinois for 19 years, and clerked for Judge Betty B. Fletcher of the U.S. Court of Appeals for the Ninth Circuit. He earned a J.D. from Howard University and a B.A. from Cornell University, and attended Deep Springs College. Email Address: adam@eff.orgPhone: 415-436-9333 x176 Deeplinks Blog by Adam Schwartz | January 23, 2025 Face Scans to Estimate Our Age: Harmful and Creepy AF Español Government must stop restricting website access with laws requiring age verification.Some advocates of these censorship schemes argue we can nerd our way out of the many harms they cause to speech, equity, privacy, and infosec. Their silver bullet?... Read more about Face Scans to Estimate Our Age: Harmful and Creepy AF Deeplinks Blog by Adam Schwartz | November 1, 2024 The Human Toll of ALPR Errors This post was written by Gowri Nayar, an EFF legal intern. Imagine driving to get your nails done with your family and all of a sudden, you are pulled over by police officers for allegedly driving a stolen car. You are dragged out of the car and detained at gun... Read more about The Human Toll of ALPR Errors'
