full_description = "India McKinney Director of Federal AffairsAs a former Capitol Hill staffer with over 10 years experience as a legislative staffer, India’s main job is to make sure that the laws of the land don't suck the life out of the internet. India’s passion has always been for good public policy, and she’s excited to be using skills developed during past legislative and appropriations battles to fight for encryption, for consumer privacy, and civil liberties in the digital realm. Email Address: india@eff.orgPhone: 415-436-9333 ext 175X handle: @imck82Mastodon: https://mstdn.party/@indiamckinney Deeplinks Blog by India McKinney | February 25, 2025 The Senate Passed The TAKE IT DOWN Act, Threatening Free Expression and Due Process Earlier this month, the Senate passed the TAKE IT DOWN Act (S. 146), by a voice vote. The bill is meant to speed up the removal of non-consensual intimate imagery, or NCII, including videos that imitate real people, a technology sometimes called “deepfakes.” Protecting victims of these heinous privacy... Read more about The Senate Passed The TAKE IT DOWN Act, Threatening Free Expression and Due Process Deeplinks Blog by India McKinney, Maddie Daly | January 21, 2025 EFF's Digital Rights Priorities for New White House Administration One of the key ways EFF works to promote and protect rights, freedoms, and innovation is by engaging with and informing elected officials at the local, state, and federal levels. On Monday, as the Trump administration officially began its term, EFF provided administration officials and the recently sworn-in members of... Read more about EFF's Digital Rights Priorities for New White House Administration Deeplinks Blog by Hayley Tsukayama, India McKinney | June 24, 2024 EFF Opposes the American Privacy Rights Act Español Protecting people's privacy is the first step we should take to create meaningful online regulation. That's why EFF has previously expressed concerns about the American Privacy Rights Act (APRA) which freezes consumer data privacy protections in place and would prevent states from creating stronger protections in the future. Read more about EFF Opposes the American Privacy Rights Act"
