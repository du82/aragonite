full_description = '''Senior Legislative Associate Chao is a senior legislative associate at the Electronic Frontier Foundation. He assists in EFF's advocacy for a free, open, and accessible internet in state legislatures and Congress. He has a B.A. from U.C. Berkeley. Email Address: chao@eff.orgPhone: +1 (415) 436-9333 x171 Deeplinks Blog by Chao Liu, Katharine Trendacosta | January 7, 2025 Sixth Circuit Rules Against Net Neutrality; EFF Will Continue to Fight Last week, the Sixth U.S. Circuit Court of Appeals ruled against the FCC, rejecting its authority to classify broadband as a Title II “telecommunications service.” In doing so, the court removed net neutrality protections for all Americans and took away the FCC’s ability to meaningfully regulate internet service providers.This... Read more about Sixth Circuit Rules Against Net Neutrality; EFF Will Continue to Fight Deeplinks Blog by Chao Liu | May 13, 2024 Victory! FCC Closes Loopholes and Restores Net Neutrality Thanks to weeks of the public speaking up and taking action the FCC has recognized the flaw in their proposed net neutrality rules. The FCC’s final adopted order on net neutrality restores bright line rules against all forms of throttling, once again creating strong federal protections for all Americans. Read more about Victory! FCC Closes Loopholes and Restores Net Neutrality Deeplinks Blog by Chao Liu, Cooper Quintin | April 19, 2024 Internet Service Providers Plan to Subvert Net Neutrality. Don’t Let Them In the absence of strong net neutrality protections, internet service providers (ISPs) have made all sorts of plans that would allow them to capitalize on something called "network slicing." While this technology has all sorts of promise, what the ISPs have planned would subvert net neutrality—the principle that all data... Read more about Internet Service Providers Plan to Subvert Net Neutrality. Don’t Let Them Deeplinks Blog by Chao Liu, Kit Walsh | April 16, 2024 Tell the FCC It Must Clarify Its Rules to Prevent Loopholes That Will Swallow Net Neutrality Whole The Federal Communications Commission (FCC) has released draft rules to reinstate net neutrality, with a vote on adopting the rules to come on the 25th of April. The FCC needs to close some loopholes in the draft rules before then. Proposed Rules on Throttling and Prioritization Allow for... Read more about Tell the FCC It Must Clarify Its Rules to Prevent Loopholes That Will Swallow Net Neutrality Whole'''
