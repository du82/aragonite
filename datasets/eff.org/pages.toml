["https://eff.org/issues/transparency"]
title = "Transparency | Electronic Frontier Foundation"
description = """
Knowing “what the government is up to” is often the first step in ensuring that the government respects the civil liberties of its citizens. Transparency is especially important given the government’s increasingly secretive use of new technologies for law enforcement and national security purposes. From cell phone location tracking, the use of surveillance drones, secret interpretations of electronic surveillance law, and the expanding use of biometrics, EFF wants to hold the government accountable and uphold your digital rights.
To that aim, EFF’s transparency work is dedicated to using federal and state freedom of information laws, the courtroom, and our megaphone to shine light on government activities. 
One of the major tools we use is the Freedom of Information Act (FOIA), a federal law that gives people the right to request information kept by federal government agencies. Our team of FOIA lawyers also submit requests on a variety of digital civil liberties issues and often take cases to court when we believe the government is unduly withholding information. But anyone can make a request under FOIA, and you can go here to learn how you can submit your own.
While emerging technologies give the government new tools that threaten citizen civil liberties, technology also has the potential to create a more democratic relationship between public institutions and the citizens they serve. Today, a broad range of new tools are allowing the public to more closely examine government and corporate entities and to hold them accountable for deception, censorship, and corruption. In addition to using freedom of information laws to shed light on government actions, EFF also wants to highlight technologies that help the transparency process —whether it’s making it easier to file and track FOIA requests, websites dedicated to whistleblowing, or open government initiatives that can improve access to information."""
full_description = "Legal Case FISC Orders on Illegal Government Surveillance EFF has sued the Department of Justice (DOJ), demanding answers about illegal email and telephone call surveillance at the National Security Agency (NSA). The FISA Amendments Act (FAA) of 2008 gave the NSA expansive power to spy on Americans’ international email and telephone calls. However, last month, a government... Deeplinks Blog | March 11, 2018 The Foilies 2018 Recognizing the Year’s Worst in Government TransparencyGovernment transparency laws like the Freedom of Information Act exist to enforce the public’s right to inspect records so we can all figure out what the heck is being done in our name and with our tax dollars. But when a public agency ignores,... Legal Case Automated License Plate Readers- ACLU of Southern California & EFF v. LAPD & LASD EFF and the ACLU of Southern California each sent California Public Records Act requests to the Los Angeles Police Department and the Los Angeles County Sheriff’s Department seeking documents about each agency's use of Automated License Plate Reader (ALPR) systems—sophisticated cameras mounted on squad cars and street poles that read... Legal Case Pen-Link v. County of San Joaquin Sheriff’s Office As part of EFF’s transparency mission, we sent public records requests to California law enforcement agencies—including the San Joaquin Sheriff’s Office—seeking information about law enforcements’ use of technology sold by two companies: Pen-Link and its subsidiary, Cobwebs Technologies. We went to court to make sure the public gets access to... Deeplinks Blog by Mario Trujillo, Beryl Lipton | January 6, 2025 EFF Goes to Court to Uncover Police Surveillance Tech in California The private company Pen-Link sued the San Joaquin Sheriff’s Office to block the agency from disclosing to EFF the unredacted contracts between them, claiming the information is a trade secret. We are going to court to make sure the public gets access to these records. Deeplinks Blog by Karen Gullo | October 10, 2024 New IPANDETEC Report Shows Panama’s ISPs Still Lag in Protecting User Data Telecom and internet service providers in Panama are entrusted with the personal data of millions of users. Digital rights organization IPANDETEC has evaluated how well companies have lived up to their responsibilities in ¿Quien Defiende Tus Datos? (“Who Defends Your Data?”) reports."
