title = "Christoph Schmon | Electronic Frontier Foundation"
description = "Christoph Schmon is EFF’s International Policy Director. He bridges EFF’s domestic priorities with the organization’s international policy strategy and helps to make sure that digital rights are respected and enforced beyond the United States borders. Christoph has deep expertise in EU policy-..."
full_description = "Christoph Schmon International Policy DirectorChristoph Schmon is EFF’s International Policy Director. He bridges EFF’s domestic priorities with the organization’s international policy strategy and helps to make sure that digital rights are respected and enforced beyond the United States borders. Christoph has deep expertise in EU policy-making and he represents EFF’s advocacy for a free internet and online privacy before European lawmakers in Brussels. Christoph specializes in tech-policy and explores the tension between liability frameworks for digital platforms and user rights, including freedom of expression and privacy. His recent work focuses on digital markets legislation and platform regulatory trends around the globe. Christoph is active within expert groups to the EU Commission in Brussels and is a lecturer at universities. Prior to working for EFF, he led the Consumer Rights Team at the EU Consumer Organisation (BEUC) and worked at a researcher at several universities. Christoph has extensive litigation experience and holds a Ph.D in law. Email Address: christoph@eff.orgX handle: @https://twitter.com/cSchmonMastodon: https://eupolicy.social/@tylium Deeplinks Blog by Christoph Schmon, Cory Doctorow | December 26, 2024 EU Tech Regulation—Good Intentions, Unclear Consequences: 2024 in Review For a decade, the EU has served as the regulatory frontrunner for online services and new technology. Over the past two EU mandates (terms), the EU Commission brought down many regulations covering all sectors, but Big Tech has been the center of their focus. As the EU seeks to regulate... Read more about EU Tech Regulation—Good Intentions, Unclear Consequences: 2024 in Review Deeplinks Blog by Christoph Schmon, Svea Windwehr | December 10, 2024 A Fundamental-Rights Centered EU Digital Policy: EFF’s Recommendations 2024-2029 The European Union (EU) is a hotbed for tech regulation that often has ramifications for users globally. The focus of our work in Europe is to ensure that EU tech policy is made responsibly and lives up to its potential to protect users everywhere. As the new mandate of the... Read more about A Fundamental-Rights Centered EU Digital Policy: EFF’s Recommendations 2024-2029"
