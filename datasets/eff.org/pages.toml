["https://eff.org/legal-victories"]
title = "Legal Victories | Electronic Frontier Foundation"
full_description = '''EFF established that computer code is speech and shielded the developers of privacy-protecting software from government censorship. In 1995, researcher Dan Bernstein planned to distribute an encryption program he had written that could help prevent strangers from snooping on online communications, discovering passwords, and stealing credit card numbers. But draconian federal laws restricted the publication of his program, treating privacy protection as a potential threat to national security. EFF successfully sued the government on behalf of Bernstein, and a federal court affirmed, for the first time, that software code deserves First Amendment protection. EFF defended the right of innovators to build new technologies without begging Hollywood's permission first. Hollywood has hoped to control innovation by overturning the "Betamax doctrine" - the bedrock principle that the developer of a technology with substantial legal uses cannot be held liable for users' copyright violations. In the Grokster case, 28 of the world's largest entertainment companies sued the distributors of peer-to-peer (P2P) file-sharing software. EFF defended one of the software companies all the way to the U.S. Supreme Court, which refused to overturn the Betamax doctrine or to force technology companies to redesign multipurpose technologies. Meanwhile, EFF helped block the INDUCE Act, a bill that would have severely undermined the Betamax doctrine. EFF set one of the first precedents protecting computer communications from unwarranted government invasion. In 1990, the Secret Service seized the computers of a small company out of Austin, Texas, called Steve Jackson Games. The computers included the company's electronic bulletin board system, a precursor the Internet for exchanging private email. This case was the first to establish that it is illegal for law enforcement to access and read private electronic mail without a warrant. EFF extended free speech protections online, successfully challenging the constitutionality of Internet censorship laws.'''
year_published = 2025
