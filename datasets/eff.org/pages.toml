["https://eff.org/about/special-counsel"]
title = "EFF Special Counsel & Special Advisors | Electronic Frontier Foundation"
full_description = "Michael Barclay specializes in the fields of patent, copyright, trade secret, and trademark litigation and client counseling, with a particular focus on electronics-related areas. He formerly was a partner at Wilson Sonsini Goodrich & Rosati in Palo Alto, California. Among other cases, Michael worked on the successful First Circuit and Supreme Court appeals in Lotus v. Borland. Before entering the legal field, Michael was an engineer at Hughes Aircraft and at Intel Corporation. Michael received his J.D. degree from the UCLA School of Law in 1979, and A.B. (Physics) and M.S.E.E. degrees from the University of California, Berkeley. Since joining EFF in 2010, Michael has worked on amicus briefs in many important copyright and patent cases. Examples include: Oracle v. Google, Viacom v. YouTube, Alice Corp. v. CLS Bank, Brownmark Films v. Comedy Partners, UMG v. Veoh (Shelter Capital), and Authors Guild v. Google. Marta Belcher is president and chair of the Filecoin Foundation as well as the Filecoin Foundation for the Decentralized Web, and general counsel and head of policy at Protocol Labs. Marta also serves on the Boards of the Zcash Foundation and the Blockchain Association, and is a member of Paradigm’s Policy Council. Marta is a pioneer in blockchain law and policy, and has testified in Congress and state legislatures as well as speaking in European Parliament. Marta has submitted briefs in the U.S. Supreme Court and U.S. appellate courts for high-profile public interest organizations, including EFF, the Center for Democracy & Technology, Public Knowledge, the Cato Institute, the National Consumers' League, Project Gutenberg, and the Blockchain Association. Marta has been recognized by the Financial Times Innovative Lawyer awards, by Law360’s list of Top Attorneys Under 40, by CryptoWeekly’s list of Most Influential Women in Crypto, and as Business Intelligence Group’s Woman of the Year. Bennett is a former member of our public interest technology team. He works with a variety of teams across EFF, focusing on consumer privacy, competition, and state legislation."
