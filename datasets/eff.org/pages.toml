["https://eff.org/pages/effs-diversity-statement"]
title = "EFF's Commitment to Diversity, Equity, and Inclusion | Electronic Frontier Foundation"
description = "Today’s Internet is more global and diverse than ever before.As the Internet evolves, so does EFF.As an advocacy organization, EFF is committed to being part of a diverse community. Diversity of life experiences makes a big difference in how we identify and litigate cases, design privacy-enhancing..."
full_description = "Today’s Internet is more global and diverse than ever before. As the Internet evolves, so does EFF. As an advocacy organization, EFF is committed to being part of a diverse community. Diversity of life experiences makes a big difference in how we identify and litigate cases, design privacy-enhancing software, and organize our activism. To that end, we have a committee dedicated to ensuring Diversity, Equity, and Inclusion are core to EFF’s work and culture. We deliberately seek applicants with different perspectives, identities, and experiences to build an inclusive workplace and inform our advocacy and defense of freedom in our digital world. EFF is an equal opportunity employer and encourages people of all races, genders, ages, abilities, orientations, ethnicities, and national origins to apply. Diversity The Internet is a tool that reaches many corners of the world and allows many to have a voice. We strive to help protect all those voices, and to ensure that the tools of censorship and surveillance aren’t turned against marginalized communities. Representing these voices, experiences and points of view requires a commitment to ensuring that our organization reflects the communities affected by our work. Equity Not everyone comes from the same background, nor has had the same privileges. Equity means creating systems that result in fair opportunities and outcomes for everyone, even those who have been marginalized or disempowered. We consider our work and our internal policies through the lens of equity, and seek to evolve as we learn more about systemic inequality and its impact on both technology users generally and our own staff. Inclusion For diversity to flourish, the environment needs to be inclusive. To be inclusive means that we value our diversity and everyone feels welcomed. We seek to make EFF a place where people feel comfortable to be their whole selves. It means that the work does not stop with opening a door, but offering a welcoming place inside it where people can grow."
year_published = 2020
year_updated = 2021
