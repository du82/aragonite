["https://eff.org/about/opportunities/volunteer"]
title = "Volunteer | Electronic Frontier Foundation"
description = "Contribute your skills to EFF's work"
full_description = '''Coding with EFF EFF has a team of staff technologists who spend a good portion of their time developing and maintaining software projects designed to defend civil liberties and enhance privacy and security online. We are looking for passionate individuals to volunteer their technological skills to support these software projects, and contribute to EFF's mission. To learn more and to get involved, please see our Coding with EFF page. You can view some of our Volunteer Technologists. View Translating with EFF For information on how to get involved with translations at EFF, check out our Translating with EFF page. View EFF Cooperating Techs Announce List EFF is often contacted by attorneys or members of the general public who have a need for technical assistance. The Cooperating Techs list is a low volume mailing list that connects these people with technologists who have the expertise and the desire to assist. We will post a note to the list with a basic description of the project or need; if you are qualified and interested, you respond to the call, and we'll connect you to the attorney. EFF won't investigate or vouch for either side so it is up to both parties to negotiate the work arrangements. We'll simply provide the connection. Subscribe EFF Cooperating Attorneys List EFF receives many requests for legal assistance. In order to try to find help for as many people as possible, we maintain a post-only email list that attorneys can join called the Cooperating Attorneys list. The list receives anonymized requests for help, both directly on EFF cases and on cases where the EFF cannot offer assistance. If you are an attorney who is interested in joining the list, please contact the Legal Intake Coordinator at info@eff.org with the subject line, "Cooperating Attorney List Inquiry". More general information about the list can be found on our Legal Assistance page. Subscribe Research with EFF We are always looking for volunteers to do small U.S.-targeted research tasks to help build out the Atlas of Surveillance dataset. Whether you’ve got a few minutes or a few hours to contribute, please email us at aos@eff.org. (February 13, 2025 update: We've received an enormous uptick in volunteer inquiries, so we may be delayed in responding to your email. Please also note that these research tasks are self-managed, do not require any specialized skills, and are not intended for long-term or even part-time volunteers. If you are someone with advanced skills or experience, you may want to consider some of our other opportunities.) Designing with EFF EFF has a team of staff designers who create the stunning artwork we use on our sites and in our campaigns. Thanks to the talent we have on staff, we don't generally have much immediate need for volunteer design help, but there are still some ways that artists, designers, photographers and other visual thinkers can contribute. Designers with expertise in UI and UX may wish to contribute to one of our many open source projects. See our Coding with EFF page, which has information on how to contribute to our Open Source Design Repository on Github. Artists, illustrators, photographers, and poster or meme designers may wish to share their work through the online Commons. We encourage the use of a Creative Commons Attribution license for visual works; if you can post it to a public online forum, and then alert our design team to its existence, we would be happy to consider using it. We especially appreciate images that reflect all sorts of Internet users in the world; particular projects we are especially inspired by include WOC in Tech Stock Photos and Safersisters Gifs. While we cannot promise immediate use of everything you share, we welcome your creative contributions to the Commons, and we feel it is likely that others will value your work as well. Photographers & Illustrators: we are always looking for good stock images on a CC-Attribution license featuring diverse users engaging with technologies. Hands on keyboards, hackers busy coding, protestors holding up phones; these are some examples of photographic images we have looked for and found in the online Commons. Positive images of technology's potential are particularly welcome; dystopian images are also great, but easier to find. Icon and logo designers: images that take a novel approach to representing abstract concepts such as justice, technological freedom, innovation, privacy, censorship, and political activism are particularly useful. Online forums which enable CC licensing include, but are not limited to: Wikimedia Commons; Deviant Art; Flickr. Please do send us a note; we would love to hear from you! email design@eff.org'''
year_published = 2007
year_updated = 2025
clearnet = "https://eff.org/about/opportunities/volunteer"
