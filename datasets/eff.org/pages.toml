["https://eff.org/pages/tools"]
title = "Tools from EFF's Tech Team | Electronic Frontier Foundation"
description = "EFF’s team of technologists and computer scientists engineers solutions to the problems of sneaky tracking, inconsistent encryption, and more. Where users face threats to their privacy and security online, EFF’s technology tools are there to defend them.For those with design, programming, and/or..."
full_description = "Banner Graphic: Resource Digital Rights Bytes Description: Get honest answers to the questions that have been bugging you about technology. Banner Graphic: Link Certbot Description: Certbot is a free, open source software tool for automatically using Let’s Encrypt certificates on manually-administered websites to enable HTTPS. Banner Graphic: Link Privacy Badger Description: Privacy Badger is an install-and-forget browser add-on that stops advertisers and trackers from secretly tracking where you go and what pages you look at on the web. Banner Graphic: Link Cover Your Tracks Description: Cover Your Tracks analyzes how well your browser and add-ons protect you against online tracking techniques. Banner Graphic: Resource Surveillance Self-Defense Description: Surveillance Self-Defense is EFF's online guide to defending yourself and your friends from surveillance by using secure technology and developing careful practices. Banner Graphic: Link Atlas of Surveillance Description: The Atlas of Surveillance is a searchable database and map that reveals which technologies, such as drones and automated license plate readers, are used by domestic law enforcement agencies across the United States. Banner Graphic: Link Street Level Surveillance Description: A project on the surveillance technologies that law enforcement agencies routinely deploy in our communities."
