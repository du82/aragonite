["https://eff.org/about/opportunities/legal-fellows"]
title = "Legal Fellow Opportunities | Electronic Frontier Foundation"
description = 'Post-Law School Fellowships (Externally Funded) EFF typically has the capacity to host no more than two externally funded, post-law school fellows (roughly September-September) on our litigation team. By "externally funded," we refer to those fellowships funded by some entity other than EFF and to...'
full_description = '''Post-Law School Fellowships (Externally Funded) EFF typically has the capacity to host no more than two externally funded, post-law school fellows (roughly September-September) on our litigation team. By "externally funded," we refer to those fellowships funded by some entity other than EFF and to which the candidates must apply directly and must sometimes do so having identified a host organization. (Should EFF have its own funding for a fellowship, that position will be posted as an EFF job opening.) We invite inquiries from law students interested in pursuing such opportunities. Please note, EFF does not currently have the capacity to sponsor H-1B visas or other U.S. immigrant or non-immigrant visas. We are unable to initiate the process of petitioning for these visas for potential or current EFF employees, and cannot sponsor post-grad fellows living in the United States on previously-awarded visas. Before reaching out, please review the following guidelines: All fellowships will be litigation-focused, rather than policy or research-focused. For that reason, we require that an applicant plan to take a bar exam prior to starting the fellowship, though applicants need not have yet received their results or have passed a bar exam. Interested applicants should investigate external funding opportunities and contact EFF only after they have identified a likely funding source. Unfortunately, EFF is not able to assist applicants in identifying a funding source. Our very strong preference is for fellowships that do not limit the cases or matters the fellow may work on at EFF rather than fellowships that require a project or special focus. As a result, we will consider project-based fellowships in only exceptional situations. If the applicant wants to pursue a fellowship that requires a project or a special focus, the applicant should present a fairly well-developed proposal for us to consider. We do not maintain our own list of potential fellowship proposals and are not able to brainstorm from scratch with a potential applicant about proposals. We recommend reviewing EFF's litigation docket and blogposts for ideas. Once an applicant has worked up a fairly detailed and specific concept, EFF will review it let the applicant know if EFF might be interested. All fellows must work out of EFF’s San Francisco office. We cannot host remote fellowships. We are currently reviewing applications on a rolling basis. We will indicate in this webpage when all hosting opportunities have been filled. To apply, please submit the following materials to EFF's Civil Liberties Director, David Greene: A cover letter or email detailing your specific interest in being a fellow at EFF and our litigation docket. We love cover letters! They are a great way for us to learn about you and assess your writing skills. So please write it yourself and forgo templates or automated assistance. Details and other information about the funding source you have identified, including the funding amount, any applicable deadlines, and a link to or copy of the host agreement. This information may be submitted as part of the cover letter or separately. A brief litigation writing sample. A resume that highlights your relevant experience and interests. An academic, clinical, or internship-related letter of recommendation may also be submitted, but is not required. Please direct any questions to David Greene.'''
year_published = 2023
year_updated = 2025
