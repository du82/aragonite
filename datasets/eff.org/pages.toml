["https://eff.org/about/staff/rindala-alajaji"]
title = "Rindala Alajaji | Electronic Frontier Foundation"
description = 'Rindala "Rin" Alajaji (she/her) is a Legislative Activist at the Electronic Frontier Foundation, primarily focused on state legislation impacting digital privacy, reproductive rights, and free expression. Prior to joining EFF, Rin worked to advance and defend civil rights and education justice...'
full_description = '''Rindala Alajaji Legislative ActivistRindala "Rin" Alajaji (she/her) is a Legislative Activist at the Electronic Frontier Foundation, primarily focused on state legislation impacting digital privacy, reproductive rights, and free expression. Prior to joining EFF, Rin worked to advance and defend civil rights and education justice policies in state legislatures as GLSEN's State and Local Policy Manager and Equality Florida's Public Policy Manager. She is a graduate of Columbia University's Human Rights Studies M.A. program, and holds a B.S. in Applied Psychology and Global Public Health from New York University. Email Address: rin@eff.org Deeplinks Blog by Rindala Alajaji | February 25, 2025 New Yorkers Deserve Stronger Health Data Protections Now—Governor Hochul Can Make It Happen With the rise of digital surveillance, securing our health data is no longer just a privacy issue—it's a matter of personal safety. In the wake of the Supreme Court's reversal of Roe v. Wade and the growing restrictions on abortion and gender-affirming care, protecting our personal health data has never... Read more about New Yorkers Deserve Stronger Health Data Protections Now—Governor Hochul Can Make It Happen Deeplinks Blog by Rindala Alajaji | February 19, 2025 Stop Censoring Abortion: The Fight for Reproductive Rights in the Digital Age We are collecting stories from individuals and organizations who have faced censorship on social media platforms to expose the true scale of abortion censorship. Our goal is to demand greater transparency in tech companies' moderation practices and ensure that their actions do not silence critical conversations about reproductive rights. Read more about Stop Censoring Abortion: The Fight for Reproductive Rights in the Digital Age Deeplinks Blog by Rindala Alajaji | February 3, 2025 Key Issues Shaping State-Level Tech Policy We’re taking a moment to reflect on the 2024 state legislative session and what it means for the future of digital rights at the state level. Informed by insights from the State of State Technology Policy 2024 report by NYU’s Center on Technology Policy and EFF’s own advocacy... Read more about Key Issues Shaping State-Level Tech Policy'''
