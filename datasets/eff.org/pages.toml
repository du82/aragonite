on Android Deeplinks Blog by Alexis Hancock | September 25, 2024 Digital ID Isn't for Everybody, and That's Okay How many times do you pull out your driver’s license a week? Maybe two to four times to purchase age restricted items, pick up prescriptions, or go to a bar. If you get a mobile driver’s license (mDL) or other forms of digital identification (ID) being offered in Google and... Read more about Digital ID Isn't for Everybody, and That's Okay"
