description = "Cara’s practice focuses on trademark, copyright, and free speech issues, especially helping fight attempts to use IP law to silence activists, artists, and critics. She also works on EFF’s Coders’ Rights Project, assisting programmers, developers, and researchers who are helping to build a safer..."
full_description = "Cara Gagliano Senior Staff AttorneyCara’s practice focuses on trademark, copyright, and free speech issues, especially helping fight attempts to use IP law to silence activists, artists, and critics. She also works on EFF’s Coders’ Rights Project, assisting programmers, developers, and researchers who are helping to build a safer future for us all. Across her work, Cara takes a particular interest in cases supporting the rights of incarcerated people. Cara came to EFF from O’Melveny & Myers LLP, where she focused on trademark litigation and a pro bono docket centered on constitutional rights. Cara holds a J.D. from New York University, where she’s an alumna of the Arthur Garfield Hays Civil Liberties Program, and a B.A. in linguistics from Northwestern University. Email Address: cara@eff.orgPhone: +1 415 436 9333 x205 Deeplinks Blog by Dave Maass, Cara Gagliano | February 26, 2025 Anti-Surveillance Mapmaker Refuses Flock Safety's Cease and Desist Demand Flock Safety loves to crow about the thousands of local law enforcement agencies around the United States that have adopted its avian-themed automated license plate readers (ALPRs). But when a privacy activist launched a website to map out the exact locations of these pole-mounted devices, the company... Read more about Anti-Surveillance Mapmaker Refuses Flock Safety's Cease and Desist Demand Deeplinks Blog by Cara Gagliano | October 30, 2024 Sorry, Gas Companies - Parody Isn't Infringement (Even If It Creeps You Out) Español Activism comes in many forms. You might hold a rally, write to Congress, or fly a blimp over the NSA. Or you might use a darkly hilarious parody to make your point, like our client Modest Proposals recently did. Modest Proposals is an activist collective that... Read more about Sorry, Gas Companies - Parody Isn't Infringement (Even If It Creeps You Out) Deeplinks Blog by Cara Gagliano | August 7, 2024 EFF Tells Yet Another Court to Ensure Everyone Has Access to the Law and Reject Private Gatekeepers Our laws belong to all of us, and we should be able to find, read, and comment on them free of registration requirements, fees, and other roadblocks. That means private organizations shouldn’t be able to control who can read and share the law, or where and how we can do... Read more about EFF Tells Yet Another Court to Ensure Everyone Has Access to the Law and Reject Private Gatekeepers"
