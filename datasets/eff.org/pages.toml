full_description = '''Christian Romero Senior Membership AdvocateAs the senior membership advocate, Christian helps and leads many aspects of EFF's membership program. From finding new opportunities to connect with EFF's members to ensuring that they are kept up-to-date with EFF's work, he plans to make membership the best it can be. When not hanging out with supporters, Christian enjoys consuming all things Spider-Man, loving on his cats and dogs, and diving into various video games. Email Address: christian@eff.orgPhone: +1-415-436-9333 x117X handle: @axoromeroMastodon: https://mstdn.social/@axoromero Deeplinks Blog by Christian Romero | February 26, 2025 Fresh Threats to Privacy Around the Globe | EFFector 37.2 EFF is here to keep you up-to-date with the latest news in the world of civil liberties and human rights online with our EFFector newsletter!This edition of the newsletter covers Apple's recent decision to turn off Advanced Data Protection for users in the U.K., our how-to guide for... Read more about Fresh Threats to Privacy Around the Globe | EFFector 37.2 Deeplinks Blog by Christian Romero | January 15, 2025 Digital Rights and the New Administration | EFFector 37.1 It's a new year and EFF is here to help you keep up with your New Year's resolution to stay up-to-date on the latest digital rights news with our EFFector newsletter!This edition of the newsletter covers our tongue-in-cheek "awards" for some of the worst data breaches in 2024, The... Read more about Digital Rights and the New Administration | EFFector 37.1 Deeplinks Blog by Christian Romero | January 7, 2025 Last Call: The Combined Federal Campaign Pledge Period Closes on January 15! The pledge period for the Combined Federal Campaign (CFC) closes on Wednesday, January 15! If you're a U.S. federal employee or retiree, now is the time to make your pledge and support EFF’s work to protect your rights online. If you haven’t before, giving to EFF through the CFC... Read more about Last Call: The Combined Federal Campaign Pledge Period Closes on January 15!'''
