description = "Can EFF represent me?Maybe. Find out about EFF's Legal Assistance Services here.Can EFF address an event in my community?Maybe. Submit a request for a speaker here and we'll get back to you soon.For all other inquiries, please contact us via the appropriate e-mail address below, or by mail, fax or..."
full_description = '''Can EFF represent me? Maybe. Find out about EFF's Legal Assistance Services here. Can EFF address an event in my community? Maybe. Submit a request for a speaker here and we'll get back to you soon. For all other inquiries, please contact us via the appropriate e-mail address below, or by mail, fax or phone. Legal Assistance and General Information For legal assistance requests, general questions, or miscellaneous queries:info@eff.orginfo@eff.org PGP public keyGPG Key Fingerprint: F2F2 1BB8 531E 9DC3 0D40 F68B 11A1 A9C8 4B18 732FSignal Number (text only): +1-510-243-8020. To verify it's us, you can check the safety numbers for the conversation. Either the first half or the second half of the safety numbers should read one of the following:35593 90536 26981 58470 03363 72867 or 38948 48795 16727 63104 76636 96731. (For legal assistance- please see our Legal Assistance Guidelines before contacting us) Press For media inquiries (please put“Media Request”in the email subject line):press@eff.org 415-436-9333 x177 Both email and voice messages forward to the entire media team Membership For membership, donations, shop orders, corporate giving, or matching gifts information, check out our FAQ page: https://www.eff.org/pages/membership-faq. If you can't find the answer you're looking for there, reach out to: membership@eff.orgmembership@eff.org PGP public key+1 (415) 436-9333 x212GPG Key Fingerprint: 392E 3160 B160 16B3 451D F3FC 57E7 C603 694A EE9B Action For issues or problems relating to Action Center or Action Alerts:action@eff.org Security Vulnerabilities For reporting security vulnerabilities ONLY in EFF software or systems (for more information, see EFF’s Security Vulnerability Disclosure Program):vulnerabilities@eff.org GPG Key Fingerprint: 48A5 8A7D 6758 B523 9D4A F563 1B1E 85FA 96BC 4486 Browser Extensions For contacting us about our browser add-ons, HTTPS Everywhere and Privacy Badger:extension-devs@eff.org GPG Key Fingerprint: 4F6C 8B44 9347 A3C2 665E FDC3 176B D05F 2A9B 47F4 Employment VerificationTo verify employment please email hr@eff.org with the person's full name, approximate dates of employment and title or department. AccessibilityThank you for visiting our website! We strive to design EFF tools and websites so they are accessible to all users, including those with disabilities. If you have feedback on how we could improve your user experience, please let us know by sending a message to info@eff.org with “Accessibility feedback” included in the subject line. The more specific the feedback, the better! Since our accessibility efforts are ongoing, we may not be able to respond to and/or implement all requests, but we welcome your comments and will take them into consideration as we iterate on our websites. San Francisco HeadquartersElectronic Frontier Foundation 815 Eddy Street San Francisco, CA 94109 USA Phone: +1-415-436-9333 Fax: +1-415-436-9993 Send a DonationGive to EFF online or by postal mail. Make checks or money orders payable to "EFF" and send to the Electronic Frontier Foundation at 815 Eddy Street, San Francisco, CA 94109 USA.'''
