description = "Join our email list for EFF news, events, campaigns, and ways to support digital freedom."
full_description = "Banner Graphic: Resource Surveillance Self-Defense Description: Surveillance Self-Defense is EFF's online guide to defending yourself and your friends from surveillance by using secure technology and developing careful practices. Issues Reproductive Justice ترتبط العدالة الإنتاجية والوصول الآمن للإجهاض، كالعديد من الجوانب الأخرى لإدارة رعايتنا الصحية، مرتبطة بشكل أساسي بحياتنا الرقمية. مع قرار دوبز ڤي جاكسون بإلغاء الحماية التي وفرها روي ڤي وايد للأشخاص الذين يسعون للحصول على الرعاية الصحية المتعلقة بالإجهاض، والتي كانت من المعلومات الحميدة قبلا، أصبحت اليوم دليلًا جنائيًا محتملًا. هذا التهديد الموسع للحقوق الرقمية خطير بشكل خاص على الأشخاص السود، السكان الأصليون/ات وذوي البشرة الملونة، وذوي الدخل المنخفض، والمهاجرين/ات، وأفراد مجتمع الميم – عين وغيرهم من المجتمعات المهمشة تقليديًا، ومقدمي الرعاية الصحية الذين يخدمون هذه المجتمعات.في هذه الصفحة، قمنا بتجميع أدلة خصوصية البيانات لأي شخص من المحتمل أن يتأثر: أولئك الذين يسعون للحصول على الرعاية الصحية والعيادات والمهنيين/ات الصحيين/ات المتعلقة بالإجهاض، وكذلك أولئك المشاركين/ات في حركات مناصرة الوصول إلى الإجهاض الآمن. ترتبط هذه الصفحة أيضًا بمساعي وتوصيات منظمة الجبهة الالكترونية إلى الهيئات التشريعية والشركات من أجل حماية أفضل للحقوق الرقمية للأشخاص الذين يحتاجون ويقدمون الرعاية الصحية الإنجابية.شاهد هذا الفيديو القصير حول الأمن الرقمي لحركة الوصول الآمن للإجهاض:"
