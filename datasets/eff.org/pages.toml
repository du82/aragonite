description = "Aaron directs grassroots outreach for EFF's Development Team. He started in nonprofit development by managing membership at the New England Aquarium in Boston, and in donor operations at the Perkins School for the Blind. Upon returning to wonderful California, Aaron had the privilege of growing EFF..."
full_description = '''Aaron Jue Director of Member EngagementAaron directs grassroots outreach for EFF's Development Team. He started in nonprofit development by managing membership at the New England Aquarium in Boston, and in donor operations at the Perkins School for the Blind. Upon returning to wonderful California, Aaron had the privilege of growing EFF's membership program for over eight years before becoming the team director. Aaron's interest in human rights and civil liberties crystallised during his years working with visitors at the Japanese American National Museum in Los Angeles' Little Toyko, which educates the public about the unconstitutional incarceration of Japanese Americans during WWII. He still carries the spirit of "gaman" perseverance everywhere he goes. He enjoys 70s and/or artsy foreign horror, cake sculpting, and generally making things out of other things. Email Address: aaron@eff.orgPhone: +1 415 436 9333 x120PGP Key: aaron_jue.txtX handle: @aaronjue Deeplinks Blog by Aaron Jue | December 19, 2024 We're Creating a Better Future for the Internet 🧑‍🏭 FINAL HOURS: Keep EFF fighting into 2025 and you’ll help unlock bonus grants! There are challenges ahead for online privacy and free speech, but we’re ready for them with your support. Read more about We're Creating a Better Future for the Internet 🧑‍🏭 Deeplinks Blog by Aaron Jue | December 3, 2024 🍿 Today’s Double Feature: Privacy and Free Speech *Ending December 10!* That indescribable feeling you get when the lights begin to dim and you’ve supported civil liberties and human rights online. Give today and your donation will go twice as far with an instant match. Read more about 🍿 Today’s Double Feature: Privacy and Free Speech Deeplinks Blog by Aaron Jue | August 6, 2024 Support Justice for Digital Creators and Tech Users EFF takes tough stances and tackles complicated problems for tech creators and users because it’s the right thing to do. You can help us defend online privacy and free speech for everyone. Read more about Support Justice for Digital Creators and Tech Users'''
