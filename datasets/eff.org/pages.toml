["https://eff.org/about/staff/cooper-quintin"]
title = "Cooper Quintin | Electronic Frontier Foundation"
description = "Cooper Quintin is a security researcher and senior public interest technologist with the EFF Threat Lab. and board member of Open Archive. He has worked on projects including Privacy Badger, Canary Watch, and analysis of state sponsored malware campaigns such as Dark Caracal. Cooper has given talks..."
full_description = 'Cooper Quintin Senior Staff TechnologistCooper Quintin is a security researcher and senior public interest technologist with the EFF Threat Lab. and board member of Open Archive. He has worked on projects including Privacy Badger, Canary Watch, and analysis of state sponsored malware campaigns such as Dark Caracal. Cooper has given talks about security research at prestigious security conferences including Black Hat, DEFCON, Enigma Conference, and ReCon about issues ranging from IMSI Catcher detection to fem tech privacy issues to newly discovered APTs. He has also been published or quoted in publications including: The New York Times, Reuters, NPR, CNN, and Al Jazeera. Cooper has given security trainings for activists, non profit workers, and vulnerable populations around the world. He previously worked building websites for nonprofits, including Greenpeace, Adbusters, and the Chelsea Manning Support Network. Cooper was also an editor and contributor to the hacktivist journal, "Hack this Zine." In his spare time he enjoys making music, visualizing a solar-punk communitarian future, and playing with his kids. Email Address: cooperq@eff.orgX handle: @cooperqMastodon: https://infosec.exchange/@cooperqAdditional High Res Photos: Download dsc_4081.jpg (10.51 MB) Deeplinks Blog by Cooper Quintin | February 18, 2025 Crimson Memo: Analyzing the Privacy Impact of Xiaohongshu AKA Red Note Early in January 2025 it seemed like TikTok was on the verge of being banned by the U.S. government. In reaction to this imminent ban, several million people in the United States signed up for a different China-based social network known in the U.S. as RedNote, and in China... Read more about Crimson Memo: Analyzing the Privacy Impact of Xiaohongshu AKA Red Note Deeplinks Blog by Thorin Klosowski, Lena Cohen, Cooper Quintin, Paige Collings, Christian Romero, Jason Kelley, Mario Trujillo, Joe Mullin, Bill Budington, Guest Author | December 19, 2024 The Breachies 2024: The Worst, Weirdest, Most Impactful Data Breaches of the Year Español Privacy isn’t dead. While some information about you is almost certainly out there, that’s no reason for despair. In fact, it’s a good reason to take action. Read more about The Breachies 2024: The Worst, Weirdest, Most Impactful Data Breaches of the Year'
