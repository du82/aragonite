["https://eff.org/about/staff/beryl-lipton"]
title = "Beryl Lipton | Electronic Frontier Foundation"
description = "Beryl Lipton, Senior Investigative Researcher, focuses her work on government transparency, law enforcement surveillance technology, and other uses of technology by government actors. She has extensive experience using Freedom of Information laws and large-scale public records campaigns in her..."
full_description = "Beryl Lipton Senior Investigative ResearcherBeryl Lipton, Senior Investigative Researcher, focuses her work on government transparency, law enforcement surveillance technology, and other uses of technology by government actors. She has extensive experience using Freedom of Information laws and large-scale public records campaigns in her research. At EFF, Beryl supports the Atlas of Surveillance, The Foilies, The Catalog of Carceral Surveillance, among other projects. She enjoys teaching others about the strengths and limitations of public records laws and discussing the potential and real harms of the surveillance state. Prior to her work with EFF in 2020, she spent seven years as a projects editor at MuckRock, where she focused on prison privatization and other public-private partnerships. She is a board member for Spare Change News, the Boston area street newspaper, and contributes to Gannett New York, where she has spearheaded the collection and release of police misconduct records throughout New York state. Photo credit: CC BY-NC-SA Cato Institute Email Address: beryl@eff.org Deeplinks Blog by Beryl Lipton, Dave Maass | January 28, 2025 California Law Enforcement Misused State Databases More Than 7,000 Times in 2023 The Los Angeles County Sheriff’s Department (LACSD) committed wholesale abuse of sensitive criminal justice databases in 2023, violating a specific rule against searching the data to run background checks for concealed carry firearm permits.The sheriff’s department’s 6,789 abuses made up a majority of the record 7,275 violations across California that... Read more about California Law Enforcement Misused State Databases More Than 7,000 Times in 2023 Deeplinks Blog by Mario Trujillo, Beryl Lipton | January 6, 2025 EFF Goes to Court to Uncover Police Surveillance Tech in California The private company Pen-Link sued the San Joaquin Sheriff’s Office to block the agency from disclosing to EFF the unredacted contracts between them, claiming the information is a trade secret. We are going to court to make sure the public gets access to these records. Read more about EFF Goes to Court to Uncover Police Surveillance Tech in California"
