["https://eff.org/pages/trademark-and-brand-usage-policy"]
title = "Trademark and Brand Usage Policy | Electronic Frontier Foundation"
description = "Welcome to the Electronic Frontier Foundation (“EFF”) Trademark and Brand Usage Policy. This policy is designed to answer the most common questions we receive regarding use of our EFF trademarks, to provide our community with clear guidance, and to enable you to make certain uses of our EFF..."
full_description = 'Welcome to the Electronic Frontier Foundation (“EFF”) Trademark and Brand Usage Policy. This policy is designed to answer the most common questions we receive regarding use of our EFF trademarks, to provide our community with clear guidance, and to enable you to make certain uses of our EFF trademarks without the need to seek our individual, written permission in each instance. EFF has, on many occasions, demanded that companies and other organizations tolerate legal, fair uses of their trademarks, including those uses that parody or criticize the organization in question. Nothing in this Policy is intended to limit any right you may have to use EFF’s trademarks in a manner that is otherwise allowed by law, including to criticize EFF or to parody our organization or our work. What are Trademarks? Trademarks are best thought of as a type of consumer protection law: they help those seeking goods and services efficiently differentiate one supplier from another. The term “trademark” includes any word, name, symbol, or device – or any combination of those – that is used by a person or entity to identify and distinguish their goods and services from those offered by others, and to indicate the source or origin of their goods and services. So, for example, you can tell if your computer operating system originated in Redmond or in Cupertino by referencing the operating system’s trademark and branding; and neither Microsoft nor Apple can adopt the brands of the other, because such use would typically cause confusion among consumers. In the U.S., and in many other jurisdictions, it is not required to register a trademark with the government before claiming rights in the mark. What are EFF Trademarks? The EFF trademarks (collectively, the “EFF Marks”) are all trademarks owned or used by EFF, including but not limited to: our ELECTRONIC FRONTIER FOUNDATION® trademark our EFF® trademark our PRIVACY BADGER® trademark our CERTBOT® trademark our "EFF Logo" Design trademark our “EFF Meatball” Design® trademark our “Certbot” Design trademark This list may be updated as other trademarks are created or registered. In Which Situations May I Use the EFF Marks? To Truthfully Identify EFF and Our Products and Services Consistent with our position favoring the free exchange of ideas and information, and favoring limitations on the ability of trademark owners to stifle speech with which they disagree, nothing in this Policy is intended to limit any rights you may have to use EFF’s Marks in a manner that is otherwise allowed by law. For example, trademark law (including pursuant to the “nominative fair use” doctrine) allows you to make non-trademark use of the EFF Marks to truthfully refer to or identify the EFF and its products and services. So, you don’t need our permission to write about why you love (or hate) our advocacy work, to inform others of the origin of our Certbot software, or the like. Your intended use may be a nominative fair use if: it’s not easy to identify the product or company without using a mark (e.g., using the term “Chicago Bulls” instead of “the basketball team that plays in Chicago” is acceptable); only so much is used as is necessary to identify the product or company and to accomplish your purpose; and you do nothing to suggest the mark-owner has endorsed or sponsored your use. Personal, Non-Commercial Uses on Affinity Products You may use the EFF Marks without asking our permission on products like t-shirts and stickers that express your affinity for our organization, provided that: (1) your use is non-commercial in nature and you give the products away for free; (2) your use is not misleading and not likely to cause confusion as to whether EFF sponsored, endorsed, or was otherwise involved in creating or offering your products; and (3) if you are offering more than 50 units, you do not advertise or offer the products online. If you want to sell affinity products (even if you’re just charging a nominal fee to cover your costs), want to give away more than 50 units online, or want to make any other uses not specifically permitted here, you must obtain our written permission first. In Which Situations May I NOT Use the EFF Marks? In any situation not specifically listed above, and where you are not otherwise legally permitted to do so, you must ask us for permission before using our trademarks. For example, you may not use our EFF Marks in the following situations: Uses that are Confusing, False, or Misleading You may not use any EFF Mark in a manner that is false or misleading, or in a manner likely to confuse consumers or the public about the source or origin of your products or services. Confusing uses include uses that may cause people to think your products or services are EFF’s products or services, or vice versa, or that may imply a formal affiliation between you and EFF where none exists. Unless we have done so in writing, EFF has not officially sponsored or endorsed your product or service, and you should not imply that we have. You may not use the EFF Marks in, or as a part of, any trade name, trademark, domain name, or internet account name that is likely to cause confusion. So, the business name or trademark “EFF Activist Tool,” or the Twitter handle “@EFFActivistTool,” are not permitted, because folks who see those uses are likely to assume that they are official EFF services or accounts, or to assume that their owner is officially sponsored or endorsed by EFF. By the same token, the domain name “EFF-Activist-Tools.com,” or the Facebook group “EFF Activist Tools,” would also be likely to cause confusion. That said, the purpose of trademark law is to address confusion, and uses that misleadingly suggest affiliation where none exists: not to silence legitimate criticism, commentary, or parody. For example, if you were to use an @EFF_sucks Twitter account to voice criticism of our organization, that is probably not something the public would view as an official EFF account, and no permission would be required for a use of that nature. Uses of EFF Marks in Connection with Derivative Software EFF offers a few software products to the community on a free and open source basis (our “Open Source Products”), which means that you can alter and modify the source code of e.g., our Certbot project to better suit your needs. We encourage you to do so! And, nothing in this policy is intended to limit your ability to tinker with, improve, and modify our open source software in any manner. However, from a trademark point of view, software that you have modified is different from the software that originates from EFF, and you may not brand any derivative software with an EFF Mark, even if you make only minor changes to it, except as provided below (repackaging). For example, if you modify our Certbot software, you are free to distribute that modification broadly, but you may not distribute the Derivative Software under the Certbot brand, or under any brand that is confusingly similar to “Certbot” or to any other EFF Mark, unless your modification constitutes a repackaging as defined below. For example, use of “Certbot for Plan 9” or “EFF Certbot Fork” as trademarks or in advertising your Derivative Software is otherwise expressly prohibited. You can, however, use the EFF Marks to truthfully describe your own products or services in a descriptive, non-trademark sense. For example, if you offer a software product that adds features to one of our Open Source Products, you may use an EFF trademark like “Certbot” to describe the fact that your software is based on Certbot. So, statements like “based on Certbot,” “forked from Certbot,” or “derived from Certbot,” would be permitted to the extent they’re accurate. However, using EFF’s logos or designs, or otherwise making a trademark-type use of the EFF Marks would not be permitted. If you produce a plugin that is compatible with one of our Open Source Products, you may use the Open Source Product’s trademark as part of the filename for your plugin, though we ask that you also include your own name in the filename (for example, “certbot-yournamehere-s3front”), to avoid confusion with official EFF plugins. We also ask that you provide appropriate attribution to EFF as the source of the original Open Source Product in any NOTICE, README, LICENSE, or similar file in your distribution, and as appropriate elsewhere in your source code. Uses of EFF Marks in Connection with New Software Packages “Packaging” software, or creating a new software package, refers to the process of modifying the original source code of software solely for the purpose of enabling that software to function in a different operating system environment (e.g., modifying its libraries, dependencies, etc.), made without modifying the functionality and/or objectives of the original software product. As noted above, you are generally not permitted to use our EFF Marks in connection with software derived from our Open Source Products. But, if you are only creating a new package of an Open Source Product, like Certbot or Privacy Badger, for use on a particular operating system, we grant you permission to use the Marks, provided that you do each of the following: You may use the mark only when packaging the particular Open Source Product it refers to. For example, if you are creating a Certbot package for a new operating system, you may use only the Certbot trademark in connection with that package; nothing in this section is intended to give you additional rights or licenses to use the EFF word mark or the “EFF Meatball” Design. You may only use the word mark (e.g., Certbot) and not any design marks, logos, or the like, that may be associated with the Open Source Product you are packaging. For example, you may not use our Certbot Design trademark, shown above, in connection with packaging Certbot software. You may use the mark only in connection with packaging an Open Source Product for use with the particular operating system specified in your request (as explained below), and only where you are making no significant or functional change to the software. If you’d like to make significant or functional changes to the software, and would like to offer your software under an EFF Mark, please contact us, as described below (see What If I Want Permission For A Use Not Allowed By This Policy?). This process allows us to work with developers who are planning new features and ensures we can catch any quality, security or compatibility issues that may arise from planned functional changes. Any package you create using an EFF Mark must be of high quality, and in particular must meet any standards of quality that we establish, and as we may change from time to time. We reserve the right to request changes if your software deviates from our quality standards, and your continued use of all EFF Marks is expressly conditioned on your prompt implementation of such changes. EFF has the right to audit any software whose trademark you use pursuant to the permission granted in this section. In particular, upon EFF’s request you must provide us with a link to the project source code e.g., at GitHub, and/or any advertising associated with the product, so that we can audit it periodically to ensure its quality, compatibility with the upstream version, etc. If you decide to cease active development of your package, you agree to let us know about that too. Please keep us updated on the status of your package going forward, and let us know if the person maintaining the project changes. Consistent with the other elements of this policy, please don’t do anything to imply a greater level of sponsorship by or affiliation with EFF than actually exists. Before using any EFF Mark in connection with any package, we ask that you please first contact EFF at packaging[@]eff.org to provide (1) the name of the software you are packaging, and the operating system(s) you are packaging it for; (2) your contact information; (3) a link to your project’s source code and, if you have one, project website; and (4) a description of how you intend to use the EFF Marks in connection with your package. This is requested, but not required if you are simply using the EFF software as is, or if you are using your own name for your software project, and only using the EFF Mark to to truthfully describe your own products or services in a descriptive, non-trademark sense (i.e. statements like “based on Certbot” or “forked from Certbot”). Even when we require advance notice, you need not wait for a response from us before starting to use the EFF Mark in connection with your project, but as noted above we reserve the right to control the quality of projects that use an EFF Mark, so we may follow up with specific requests. To be clear, this policy is simply about ensuring that software named with an EFF Mark meets high quality standards, it does not require you to do anything to take advantage of our open software licenses under your own branding. Repackagers help us get our products out to as many people as possible, and we value your service to the community. Thank you! What If I Want Permission For A Use Not Allowed By This Policy? If you wish to use any of the EFF Marks in a manner that is not expressly permitted by this policy, or otherwise permitted by a trademark law exception such as fair use, please contact us directly at info[at]eff.org. We will be happy to consider your request. For most efficient processing of your request, your email should: provide plenty of detail regarding the requested use (e.g., “I’d like to sell 100 hoodies at an upcoming technology meetup occurring on April 5, 2063”); contain a mockup of the use you plan to make, so that we can review it (e.g., “enclosed is a .png version of the design that I’d like to use on the back of the hoodies I plan to offer”); be clear as to timing and when you require approval (e.g., “I need to order the garments no later than February 5, 2063”); and let us know whether the goods you plan to produce will be given away for free, or how you anticipate pricing them, if applicable. We ask that you submit any such requests to us at least four (4) weeks before you require approval. If you plan to make a profit on your use – for example, if you’ll be charging more for your hoodies than they cost to produce – we’ll likely ask you to agree to donate any profits you end up with (if any) to EFF. If I Have Permission to Use an EFF Mark, What Are the Usage Restrictions for That Trademark? Use the Exact Mark. EFF’s trademarks should be used in their exact, most up-to-date form. They should neither be abbreviated nor combined with other words. Mark the Mark. The first or most prominent use of an EFF Mark should be accompanied by a “tm” symbol (“™”), to indicate that it is a trademark; you may also use the “r in a circle” symbol (“®”), if the trademark in question is a registered trademark. If you aren’t sure, using the “tm” '
