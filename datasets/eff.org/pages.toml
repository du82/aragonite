["https://eff.org/about/staff/jillian-york"]
title = "Jillian C. York | Electronic Frontier Foundation"
description = "Jillian C. York is EFF's Director for International Freedom of Expression and is based in Berlin, Germany. Her work examines state and corporate censorship and its impact on culture and human rights, with a focus on historically marginalized communities. At EFF, she leads coalitions, writes about..."
full_description = "Jillian C. York Director for International Freedom of ExpressionJillian C. York is EFF's Director for International Freedom of Expression and is based in Berlin, Germany. Her work examines state and corporate censorship and its impact on culture and human rights, with a focus on historically marginalized communities. At EFF, she leads coalitions, writes about state and corporate censorship, and contributes to various other areas of the organization's work. Jillian is the author of Silicon Values: The Future of Free Speech Under Surveillance Capitalism (Verso, 2021) and has written for Motherboard, MIT Technology Review, and WIRED, among others. She is a visiting professor at the College of Europe Natolin in Warsaw. She is also a regular speaker at global events. Prior to joining EFF, Jillian worked at Harvard's Berkman Klein Center for Internet & Society, where she coordinated the work of the OpenNet Initiative and contributed to other projects including Herdict and research into DDoS attacks. She has also worked in fundraising and grant writing, as an EFL teacher, and as a travel writer. Jillian is a fellow at the Centre for Internet & Human Rights in Berlin and a founding member of the Deep Lab collective. She currently serves on the board of Digital Rights Advocacy Uganda, the Open Tech Fund Advisory Council, and the Open Rights Group Advisory Council, and previously served on the IFEX Council and the board of directors of Global Voices. Jillian holds a BA in Sociology from Binghamton University, where—like a surprisingly large number of individuals in her field—she also studied theatre. Email Address: jillian@eff.org Deeplinks Blog by Jillian C. York | February 25, 2025 EFF to UK PM Starmer: Call Sisi to Free Alaa and Save Laila UK Prime Minister Keir Starmer made a public commitment on February 14 to Laila Soueif, the mother of Alaa Abd El Fattah, stating “I will do all that I can to secure the release of her son Alaa Abd el-Fattah and reunite him with his family.” While that... Read more about EFF to UK PM Starmer: Call Sisi to Free Alaa and Save Laila"
