full_description = "Thorin Klosowski Security and Privacy ActivistThorin is the Security and Privacy Activist at EFF, where he focuses on providing practical advice to protecting online security, including handling much of Surveillance Self-Defense. Before joining EFF, Thorin covered privacy and security for Wirecutter and occasionally at The New York Times, writing the bulk of Wirecutter's security how-tos, explainers, and guides. Email Address: thorin@eff.org Deeplinks Blog by Thorin Klosowski, Andrew Crocker | February 21, 2025 Cornered by the UK’s Demand for an Encryption Backdoor, Apple Turns Off Its Strongest Security Setting Today, in response to the U.K.’s demands for a backdoor, Apple has stopped offering users in the U.K. Advanced Data Protection, an optional feature in iCloud that turns on end-to-end encryption for files, backups, and more. Had Apple complied with the U.K.’s original demands, they would have... Read more about Cornered by the UK’s Demand for an Encryption Backdoor, Apple Turns Off Its Strongest Security Setting Deeplinks Blog by Thorin Klosowski, Matthew Guariglia | February 12, 2025 When Platforms and the Government Unite, Remember What’s Private and What Isn’t For years now, there has been some concern about the coziness between technology companies and the government. Whether a company complies with casual government requests for data, requires a warrant, or even fights overly-broad warrants has been a canary in the digital coal mine during an era where companies... Read more about When Platforms and the Government Unite, Remember What’s Private and What Isn’t Deeplinks Blog by Thorin Klosowski | February 7, 2025 The UK's Demands for Apple to Break Encryption Is an Emergency for Us All The Washington Post reported that the United Kingdom is demanding that Apple create an encryption backdoor to give the government access to end-to-end encrypted data in iCloud. Encryption is one of the best ways we have to reclaim our privacy and security in a digital world filled with cyberattacks... Read more about The UK's Demands for Apple to Break Encryption Is an Emergency for Us All"
