["https://eff.org/about/advisoryboard"]
title = "Advisory Board | Electronic Frontier Foundation"
description = "Note: If you have general questions or concerns or are not sure to whom your message should be addressed, please write to info@eff.org rather than emailing multiple staff, board members, or advisory board members. Our full time intake coordinator will be happy to get back to you promptly and make..."
full_description = "Note: If you have general questions or concerns or are not sure to whom your message should be addressed, please write to info@eff.org rather than emailing multiple staff, board members, or advisory board members. Our full time intake coordinator will be happy to get back to you promptly and make sure your message reaches the appropriate person. For media requests, please note that advisory board members and fellows are generally speaking in their personal capacity, rather than representing EFF. If you'd like to reach a staff member at EFF for comment, please email press@eff.org. If you have questions about how to describe an advisory board member or fellow's relationship to EFF, please email press@eff.org. Joseph Bonneau is an Assistant Professor of Computer Science at NYU. His research focuses on new applications of cryptography and security technology, including cryptocurrencies, verifiable lotteries and cryptographic transparency systems. Ren Bucholz is a lawyer at Paliare Roland Barristers in Toronto, where he focuses on technology and intellectual property litigation, as well as public and constitutional law. Ren has published academic and popular articles on intellectual property, file sharing, and electronic voting. Ren held a variety of activism and international policy positions at EFF from 2001-2007. He rejoined EFF in 2008 as a Google Policy Fellow before returning to Canada to practice law. Jon Callas is a cryptographer, software engineer, user experience designer, and entrepreneur. He is also a former director of EFF’s Public Interest Technology team and a former special technology advisor to the organization. Jon is the co-author of many crypto and security systems including OpenPGP, DKIM, ZRTP, Skein, and Threefish. Jon has co-founded several startups including PGP, Silent Circle, and Blackphone. Jon has worked on security, user experience, and encryption for Apple, Kroll-O'Gara, Counterpane, and Entrust. Jon also was a technologist in the ACLU's Speech, Privacy, and Technology Project on issues including surveillance, encryption, machine learning, end-user security, and privacy. Ryan Calo is a law professor at the University of Washington and a former director at the Stanford Center for Internet and Society. You can find his published work on SSRN and follow his thoughts on privacy, robotics, and other topics on Twitter (@rcalo). A. Michael Froomkin is a professor of law at University of Miami School of Law and an expert in Technology Law (AI, robots, internet, privacy) and Administrative Law. He maintains a personal site at http://law.tm, and is the founder and Editor-in-Chief of JOTWELL - the Journal of Things We Like (Lots). Michael Geist is a law professor at the University of Ottawa where he holds the Canada Research Chair in Internet and E-commerce Law. He is active on copyright, privacy, and Internet issues and was a founder of the Canadian Internet Policy and Public Interest Clinic. He blogs at michaelgeist.ca. James Gosling is the chief software architect at Liquid Robotics, where he spends his time writing software for the Waveglider, an autonomous ocean-going robot. He spent many years as a VP & Fellow at Sun Microsystems, where he did the original design of the Java programming language and implemented its original compiler and virtual machine. He has been a contributor to the Real-Time Specification for Java and researched software development tools at Sun labs while serving as Chief Technology Officer of Sun's Developer Products Group and the CTO of Sun's Client Software Group. He briefly worked for Oracle after the acquisition of Sun and spent some time at Google. Joseph Gratz is a partner at Durie Tangri LLP, a law firm in San Francisco. Joe's practice is focused on litigating Internet-related copyright and trademark cases. Megan Gray is a lawyer focused on Information, Internet, Innovation, and Intangibles. Within those fields, she has worked as corporate counsel, litigator, and lobbyist for startups, established companies, non-profit organizations, individuals, and trade associations. In the privacy and free speech arena, Megan has been a key player in a number of precedential matters, including the first case alleging violation of a FTC Consumer Privacy Consent Order (Google/Safari, $22.5 million settlement), the first lawsuit against a leading Internet portal for privacy violations (AquaCool v. Yahoo!), the first FTC enforcement action against online distribution of identification templates (FTC v. InfoWorld), and the first motion to quash a subpoena seeking the identity of an anonymous Internet poster (Xircom v. Doe). Jim Griffin is based in Northern Virginia and works on IP Law and Policy for Pex. Jim co-founded the Pho List, a listserve where thousands converse daily on digital media topics with a focus on music. David Hayes is a partner in the Intellectual Property Group at Fenwick & West LLP and is an expert on copyright law and digital media, software patents, open source issues, and technology transactions. He has served as counsel for a number of precedent-setting software copyright infringement cases, including Apple v. Microsoft and the Napster case. Gwen Hinze works on international intellectual property and internet policy issues. She's an International Copyright Fellow at the Samuelson Law, Technology and Public Policy Clinic at U.C. Berkeley Law School. From 2002-2012 she served variously as EFF’s International Director, International IP Director, and Staff Attorney, where she focused on educating global policy-makers about the need for balanced intellectual property regimes that protect creators, promote access to knowledge, foster technological innovation, and empower digital consumers. She has testified before the U.S. Copyright Office for consumer exemptions to the U.S. Digital Millennium Copyright Act, and been involved in litigating various cases involving the impact of copyright law on innovation, privacy and freedom of expression online. Before EFF, she practiced at international law firm Allens, and worked for the Australian government in public policy and litigation. Gwen is a member of the State Bar of California and holds honors degrees in law and philosophy from Monash University, Australia. Jeff Jonas is founder and CEO of Senzing, the creators of real-time entity resolution solutions. Jeff is also a three-time entrepreneur, acclaimed data scientist and advocate for privacy and civil liberties. Over the course of his career, he has been at the forefront of solving some of the world’s most complex big data problems for companies and governments. Jeff has taken on many high-profile challenges, including identifying potential terrorists, detecting fraudulent behavior in casinos, connecting loved ones after a natural disaster, and modernizing voter registration systems. In a National Geographic profile, Jeff was recognized as the Wizard of Big Data. Birgitta Jónsdóttir is a Poetician. She co-founded the political movements the Civic Movement in 2009 and the Pirate Party in 2013 and served both as a parliamentarian in the Icelandic Parliament, the latter polling as the largest party in Iceland for a full year. In 2010 her parliamentary resolution tasking the government with transforming Iceland into a Digital Save Haven inspired by a lecture in Iceland in 2008 by the late John Parry Barlow was unanimously adopted in the parliament. She simultaneously founded and served as a chairman for IMMI (International Modern Media Institute). The creation of the IMMI laws is ongoing as the current Prime Minister of Iceland has pledged to fulfill the aims of the resolution. Birgitta inspired the Icelandic Parliament to put together a Committee for the Future and served at the IPU (international Parliamentary Union) in the committee for human rights for parliamentarians. Birgitta co-produced Collateral Murder and worked closely with WikiLeaks during the Chelsea Manning era. Birgitta specializes is 21st century policymaking with focus on direct democracy, freedom of expression, information and digital privacy. Mitch Kapor is one of EFF's founders as well as the founder of the Lotus Development Corporation. He’s the co-Chair of the Kapor Center for Social Impact and an active impact investor. Sina Khanifar is a technologist and advocate for better technology policy. He led the campaign to legalize cell phone unlocking, which culminated in action by both the FCC and Congress in 2014. Sina spearheaded the development of EFF’s open source activism toolset and has contributed to multiple EFF campaigns relating to copyright, net neutrality, and privacy. He continues to work actively on DMCA reform as a board member of Repair.org. He was formerly co-founder of OpenSignal and currently runs Waveform.Mark Lemley is the William H. Neukom Professor at Stanford Law School and is director of the Stanford Center for Law, Science and Technology. He is the author of several books and over 190 articles and has testified before Congress and the FTC on patent, antitrust, and constitutional law matters. He is a partner at Durie Tangri. Christopher Lewis is President and CEO at Public Knowledge, a digital rights nonprofit organization whose mission is to promote free expression online, an open internet, and affordable access to communications technology and creative works. Prior to being elevated to President and CEO, Chris served as PK’s Vice President from 2012 to 2019 where he led the organization’s day-to-day advocacy and political strategy on Capitol Hill and at government agencies. During that time he also served as a local elected official, serving two terms on the Alexandria City Public School Board. Before joining Public Knowledge, Chris worked in the Federal Communications Commission Office of Legislative Affairs, including as its Deputy Director. He is a former U.S. Senate staffer and has almost two decades of political organizing, campaign, and advocacy experience. Chris graduated from Harvard University with a Bachelors degree in Government and lives in Alexandria, VA. Eben Moglen is Executive Director of the Software Freedom Law Center and Professor of Law and Legal History at Columbia University Law School. Professor Moglen has represented many of the world's leading free software developers. Professor Moglen earned his PhD in History and law degree at Yale University during what he sometimes calls his “long, dark period” in New Haven. After law school he clerked for Judge Edward Weinfeld of the United States District Court in New York City and for Justice Thurgood Marshall of the United States Supreme Court. He has taught at Columbia Law School since 1987 and has held visiting appointments at Harvard University, Tel Aviv University and the University of Virginia. In 2003 he was given the Electronic Frontier Foundation's Pioneer Award for efforts on behalf of freedom in the electronic society. Professor Moglen is admitted to practice in the State of New York and before the United States Supreme Court. Thomas E. Moore III has practiced law in Palo Alto continuously since 1984, representing individuals and start-up to mid-size technology companies in intellectual property and commercial litigation matters. Tom is a member of Royse Law Firm, PC, which provides sophisticated, yet affordable, legal services to a variety of Silicon Valley clients. Tom has collaborated with EFF on a variety of projects beginning in January 2000 with the DVD Copy Control Association’s case against Andrew Bunner. Since then, he has defended the rights of on-line journalists, argued that famous trademarks do not hold a monopoly on ordinary English words and helped to explain how IP addresses can reveal important information about person’s movements and associations. Most recently, Tom has joined EFF in its efforts to curtail the government’s mass surveillance of the American public. He is a graduate of Stanford, and he received his law degree from U.C. Berkeley. Alex Moss is the executive director of the Public Interest Patent Law Institute (PIPLI), a nonprofit organization dedicated to ensuring the patent system promotes innovation for the public’s benefit. Prior to founding the PIPLA, she was a Staff Attorney on EFF’s intellectual property team and the Mark Cuban Chair to Eliminate Stupid Patents. Before dedicating her practice to public interest work, she was an attorney at Sullivan & Cromwell LLP in New York and Durie Tangri LLP in San Francisco, where she represented clients in intellectual property, contract, and antitrust matters, and a judicial clerk to the Honorable Timothy B. Dyk of the U.S. Court of Appeals for the Federal Circuit. She has spoken about patent law at the National Academy of Sciences and in testimony before the U.S. Senate Judiciary Committee. Before law school, Alex worked for independent record label Rough Trade. Deirdre Mulligan is an Assistant Professor at the UC Berkeley School of Information. Professor Mulligan’s current research agenda focuses on information privacy and security. She was previously a clinical professor of law and the director of the Samuelson Law, Technology & Public Policy Clinic. Jumana Musa is a human rights attorney and racial justice activist. She is currently the Director of the Fourth Amendment Center at the National Association of Criminal Defense Lawyers. As director, Ms. Musa oversees NACDL's initiative to build a new, more durable Fourth Amendment legal doctrine for the digital age. The Fourth Amendment Center educates the defense bar on privacy challenges in the digital age, provides a dynamic toolkit of resources to help lawyers identify opportunities to challenge government surveillance, and establishes a tactical litigation support network to assist in key cases. Ms. Musa previously served as NACDL's Sr. Privacy and National Security Counsel. Prior to joining NACDL, Ms. Musa served as a policy consultant for the Southern Border Communities Coalition, a coalition of over 60 groups across the southwest that address militarization and brutality by U.S. Customs and Border Protection agents in border communities. Previously, she served as Deputy Director for the Rights Working Group, a national coalition of civil rights, civil liberties, human rights, and immigrant rights advocates where she coordinated the “Face the Truth” campaign against racial profiling. She was also the Advocacy Director for Domestic Human Rights and International Justice at Amnesty International USA, where she addressed the domestic and international impact of U.S. counterterrorism efforts on human rights. She was one of the first human rights attorneys allowed to travel to the naval base at Guantanamo Bay, Cuba, and served as Amnesty International's legal observer at military commission proceedings on the base. Yomna N is a research engineer whose focus is cell network security. She was previously a core contributor to Certbot, a research fellow at the Berkman Klein "
