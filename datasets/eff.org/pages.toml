["https://eff.org/about/board"]
title = "EFF's Board of Directors | Electronic Frontier Foundation"
full_description = "Learn about John Perry Barlow, a co-founder of EFF and a member of the Board of Directors from 1990 until his death in 2018. Erica is the Head of Technology at Parkwood Entertainment and advocate for diversity, equity, and inclusion in tech, as well as expanding access to tech exposure and education. Erica's career began over 20 years ago as a System Administrator at the University of Alaska, before she began working at Google in 2006. After nearly a decade at Google, Erica joined Slack in 2015, building their Native Client Build and Release infrastructure. Her scope quickly grew as a Senior Engineering Manager at Patreon, followed by roles as Principal Group Engineering Manager at Microsoft, and Director of Engineering at Github, finally landing as Chief Technology Officer at the DCCC (Democratic Congressional Campaign Committee).Erica has been on the advisory Boards for Atipica and Hack the Hood, the Code.org Diversity Council, the Barbie Global Advisory Board, and has been a Tech Mentor for Black Girls Code. Erica is a founding member of Project Include, was the 2015 Level Playing Field Institute Lux Award winner, a nominee for the 2016 TechCrunch Crunchies Include Diversity Award, and was included in WIRED Magazine's 2016 Next List and Essence Magazine's 2017 Woke 100. Erica is currently based in Oakland, California. Brian Behlendorf has been a fan of the EFF since the early 90's, when he first discovered the Internet as an undergrad at UC Berkeley, and saw both how essential and how fragile digital civil liberties were about to become. He carried that sense of purpose with him as he set up Wired Magazine's first web site in 1993, and then engineered the launch of Hotwired in 1994. In the same spirit of open standards and open source code that built the Net, Brian and 8 other individuals co-founded the Apache Group (and later the Apache Software Foundation), the team that built and gave away the popular Apache HTTP (Web) Server. Simultaneously he launched CollabNet, which brought the principles and tools used by the open source software community to large enterprises."
