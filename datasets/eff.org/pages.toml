["https://eff.org/givingsociety"]
title = "EFF Giving Societies | Electronic Frontier Foundation"
description = "EFF Giving Societies are a community of major donors and key supporters who contribute $1,000 or more annually or who have named EFF in their estate planning.Generous support at this level ensures that technology users everywhere can rely on EFF's unique expertise whenever threats to civil..."
full_description = "EFF Giving Societies are a community of major donors and key supporters who contribute $1,000 or more annually or who have named EFF in their estate planning. Generous support at this level ensures that technology users everywhere can rely on EFF's unique expertise whenever threats to civil liberties arise, now and for decades to come. With your help, we have the ability to build a better future for human rights for all. Thank you for joining this movement. The Guardians The Guardians are EFF supporters whose annual donations are between $1,000 and $9,999. Guardians stand with EFF on the front lines in the battle for digital rights, joining with us to win lawsuits, write policy, and build technology. Together, we become a global force for an Internet that continues to connect, inspire, and uplift all of us. Learn more. MXM Society The MXM Society is a community of EFF supporters who make an annual contribution of $10,000 or more, or have given more than $100,000 in their lifetime. EFF was founded in 1990 to fight against injustice and stand for freedom. For thirty years, we’ve been standing tall to defend these ideals. The MXM Society celebrates this legacy while working to ensure that EFF remains strong for decades to come. Learn more. Lighthouse Society The Lighthouse Society is a community of EFF supporters who are including EFF in their planned giving. By including EFF in your estate planning, you leave a legacy that ensures EFF is here to stay in perpetuity, shining as an ever-brighter beacon for all. Learn more."
