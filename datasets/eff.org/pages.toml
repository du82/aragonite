title = "EFF's Volunteer Technologists | Electronic Frontier Foundation"
full_description = '''Paul is a freelance developer based in Mexico City. He is a strong believer in the EFF's mission, and is passionate about creating software that helps others and improves society. Aaron graduated in 2014 from Ohio State University with a B.S. in Physics and Mathematics, and spends most of his free time developing and maintaining a map renderer and other tools for Minecraft, written in Python and C. James is an EFF Technology Fellow working on the Let's Encrypt project and also a PhD student in the Computer Science and Engineering Department at the University of Michigan. His research is in computer security and is particularly interested in creating practical security solutions. He is a STIET fellow and am advised by Professor J. Alex Halderman. He did his undergraduate work at Vanderbilt University, where he received a B.A. double majoring in Economics and Computer Science. While there, he was a three-year letter winner in cross country. In his free time, he enjoys flying and running semi-competitively. Darrick is a self-employed contract developer and a passionate digital privacy advocate. He got involved with creating the EFF activism center "because when you get the opportunity to help an organization that has done so much for digital privacy rights, you don't pass it up." He saw it as a chance to do something real to support a cause he strongly believes in. Lucas Myers is a web developer, homebrewer, and dad in Santa Barbara, CA. He is a senior software engineer at Citrix, organizer of Santa Barbara JavaScript, and the founder of Triangle JavaScript. When not coding, he might be brewing, playing Minecraft or building cool LEGO stuff with his kids, or just hanging out with his wife. Moiz is a designer and coder, with an interest in interaction and information design. He likes making things that support activism and social change. He works at the Wikimedia Foundation.'''
