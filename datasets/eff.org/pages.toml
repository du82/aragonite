full_description = "Brad Warren Senior Software ArchitectBrad Warren is a Senior Software Architect at EFF working primarily on Certbot, a tool for obtaining certificates and automatically configuring SSL/TLS. As one of the core developers of the project, Brad is interested in making security products more usable as we work towards a more private, secure, and encrypted web. Deeplinks Blog by Brad Warren | July 30, 2024 Certbot Is Now on 4 Million Servers, Maintaining Over 31 Million Websites EFF’s Certbot is now installed on over 4 million web servers, where it’s used to maintain HTTPS certificates for more than 31 million websites. The recent achievement of these milestones helps show the success of the project and the important role it plays in the infrastructure of a secure... Read more about Certbot Is Now on 4 Million Servers, Maintaining Over 31 Million Websites Deeplinks Blog by Brad Warren | March 7, 2024 Should Caddy and Traefik Replace Certbot? Can free and open source software projects like Caddy and Traefik eventually replace EFF’s Certbot? Although Certbot continues to be developed, we think tools like these help offer a promising path forward in the further development of a secure and encrypted web. For some users, tools like... Read more about Should Caddy and Traefik Replace Certbot? Deeplinks Blog by Brad Warren | December 5, 2019 Certbot Leaves Beta with the Release of 1.0 Earlier this week EFF released Certbot 1.0, the latest version of our free, open source tool that helps websites encrypt their traffic. The release of 1.0 is a significant milestone for the project and is the culmination of the work done over the past few years by EFF and... Read more about Certbot Leaves Beta with the Release of 1.0 Deeplinks Blog by Brad Warren | May 12, 2016 Announcing Certbot: EFF's Client for Let's Encrypt EFF is proud to introduce Certbot, a powerful tool to help websites encrypt their traffic. Certbot is the next iteration of the Let's Encrypt Client; it obtains TLS/SSL certificates and can automatically configure HTTPS encryption on your server. It's still in beta for now, but we plan... Read more about Announcing Certbot: EFF's Client for Let's Encrypt"
