["https://eff.org/about/staff"]
title = "EFF's Staff and Contributors | Electronic Frontier Foundation"
full_description = '''Please be respectful of the time of our attorneys. Direct all legal inquiries, not to the individual attorney, but to info@eff.org. All inquiries will be routed to info@eff.org. For expedited responses to media inquiries, please email press@eff.org. Molly holds a degree in Computer Science from MIT and is committed to fighting for privacy and security online for all users. Aside from keeping EFF sites running, she is passionate about machine learning and standing against the irresponsible deployment of it for civil control. Rindala "Rin" Alajaji (she/her) is a Legislative Activist at the Electronic Frontier Foundation, primarily focused on state legislation impacting digital privacy, reproductive rights, and free expression. Prior to joining EFF, Rin worked to advance and defend civil rights and education justice policies in state legislatures as GLSEN's State and Local Policy Manager and Equality Florida's Public Policy Manager. She is a graduate of Columbia University's Human Rights Studies M.A. program, and holds a B.S. in Applied Psychology and Global Public Health from New York University. Veridiana coordinates EFF's activities with local organizations and activists in Latin America, where we work together to reinforce the defense of digital and human rights. Veridiana has been involved with telecommunications, media, Internet and human rights issues since 2009. She has been a member of Brazilian Internet Steering Committee (CGI.br) as one of the civil society representatives (2010-2013) and worked in Brazilian civil organizations such as Idec and Intervozes. Veridiana is a lawyer, has a Ph.D in Human Rights from the University of São Paulo Law School, and holds a Masters degree in Economic Law from the same institution. Matthew is the Accounting Director at EFF. He has been a finance leader for several Bay Area nonprofits and brings his passion for civil liberties to EFF. Matthew enjoys spending time on the Russian River and hanging out with his partner and cat.'''
