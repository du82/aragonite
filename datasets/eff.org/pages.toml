["https://eff.org/security"]
title = "Security Vulnerability Disclosure Program | Electronic Frontier Foundation"
description = "Also check out our EFF Security Hall of Fame to see the heroes that have already reported security vulnerabilities to us!OverviewEFF is committed to protecting the privacy and security of users of our software tools. Our Vulnerability Disclosure Program is intended to minimize the impact any..."
full_description = "Also check out our EFF Security Hall of Fame to see the heroes that have already reported security vulnerabilities to us! EFF is committed to protecting the privacy and security of users of our software tools. Our Vulnerability Disclosure Program is intended to minimize the impact any security flaws have on our tools or their users. EFF's Vulnerability Disclosure Program covers select software partially or primarily written by EFF. EFF's Vulnerability Disclosure Program applies to security vulnerabilities discovered in any of the following software: In order to qualify, the vulnerability must exist in the latest public release (including officially released public betas) of the software. Only security vulnerabilities will qualify. We would love it if people reported other bugs via the appropriate channels, but since the purpose of this program is to fix security vulnerabilities, only bugs that lead to security vulnerabilities will be eligible for rewards. Other bugs will be accepted at our discretion. Please adhere to the following guidelines in order to be eligible for rewards under this disclosure program: In addition, please allow EFF at least 90 days to fix the vulnerability before publicly discussing or blogging about it. EFF believes that security researchers have a First Amendment right to report their research and that disclosure is highly beneficial, and understands that it is a highly subjective question of when and how to hold back details to mitigate the risk that vulnerability information will be misused. If you believe that earlier disclosure is necessary, please let us know so that we can begin a conversation. Just as important as discovering security flaws is reporting the findings so that users can protect themselves and vendors can repair their products. Public disclosure of security information enables informed consumer choice and inspires vendors to be truthful about flaws, repair vulnerabilities, and build more secure products. Disclosure and peer review advances the state of the art in security. Researchers can figure out where new technologies need to be developed, and the information can help policymakers understand where problems tend to occur."
year_published = 2015
year_updated = 2024
clearnet = "https://eff.org/security"
