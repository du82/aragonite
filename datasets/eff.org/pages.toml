["https://eff.org/about/in-memoriam"]
title = "In Memoriam | Electronic Frontier Foundation"
full_description = 'This page collects information on EFF Staffers and board members who are no longer among the living. We cherish their memories, and continue their struggle for a better world. John Perry Barlow, a poet and internet philosopher, was a co-founder of the Electronic Frontier Foundation and a member of our Board of Directors from 1990 until his death in 2018. It is no exaggeration to say that major parts of the Internet we all know and love today exist and thrive because of Barlow’s vision and leadership. While Barlow knew that new technology could create and empower evil as much as it could create and empower good, he made a conscious decision to focus on the latter. His "Declaration of the Independence of Cyberspace" was just one of the many places he articulated the vision of the internet that has become his legacy: as a fundamental place of freedom and connection where voices long-silenced can find an audience. Peter Eckersley joined EFF as a staff technologist in 2006, and worked at EFF for over a dozen years, eventually holding the role of EFF’s Chief Computer Scientist. Peter was instrumental in implementing the vision of what a public interest technologist could be—not only as an advisor that ensured EFF’s legal and activist work was technically smart and correct, but as a builder of technologies that spur more security and freedom online, while ensuring that the internet serves everyone. Peter played a central role in many groundbreaking projects to create free, open source tools that protect the privacy of users’ internet experience by encrypting communications between web servers and users. Peter’s work at EFF included privacy and security projects such as Panopticlick, HTTPS Everywhere, Switzerland, Certbot, Privacy Badger, the SSL Observatory, and Let’s Encrypt. Let’s Encrypt fostered the web’s transition from non-secure HTTP connections to the more secure HTTPS, so websites could offer secure connections to their users and protect them from network-based threats. By 2017 it had issued 100 million certificates; by 2021, about 90% of all web page visits use HTTPS. As of today it has issued over a billion certificates to over 280 million websites. Peter left EFF in 2018 and founded AI Objectives Institute, to focus on studying and calling attention to the malicious use of artificial intelligence and machine learning.'
year_published = 2025
