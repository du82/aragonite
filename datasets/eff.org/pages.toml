description = "There are many ways to support your rights online! Take a look here and contact us at membership@eff.org for questions."
full_description = '''JOIN EFF or RENEW YOUR MEMBERSHIPJoin EFF online or join via mail-in donation! Thanks for supporting digital privacy and free expression for all.Learn more and find assistance with donations on our Membership FAQ or contact us at membership@eff.org.OTHER WAYS TO GIVE Car DonationsCombined Federal CampaignCryptocoin Donations (Updated November 26, 2024)Donor-Advised Funds (DAFs)Employee Giving and Matching GiftsFoundation GrantsHardware DonationsLegacy GivingOnline Purchases: eBay, No Starch PressOrganizational MembershipStock DonationsTribute Donations: Give in Honor of Family and FriendsVolunteer: Donate Your TimeBUY EFF GEAREFF SHOPShow support and start a conversation!Get EFF stickers, apparel, and more.Car DonationsDonate a car, truck, motorcycle, trailer, camper, RV or even a boat to the Electronic Frontier Foundation (EFF) and support the leading organization defending civil liberties in the digital world.Go to TopCombined Federal CampaignEFF is one of several, carefully selected Human and Civil Rights Organizations across the country that federal, some state and local employees can donate through payroll deductions. We are proud that so many government employees decide to support digital civil liberties as part of the annual Combined Federal Campaign, and would be happy to provide you with more information about how you can contribute, or visit their site at http://www.hcr.org/our-members.html.EFF’s CFC Code is 10437.Even if you’re not a government employee, you can participate by representing EFF at local campaign events and fairs. Please contact EFF’s Membership Advocate Christian Romero at christian@eff.org for training and informational materials to distribute at an event near your hometown.Go to Top Cryptocoin Donations (Updated November 26, 2024)Thank you for supporting the Electronic Frontier Foundation! Your donation helps sustain crucial legal work, activism, and technology development to protect online freedom for all. Below you will find addresses that you may use to donate to EFF. We're working on different donation options for the future:AlgorandBinanceBitcoin—Join EFF with BTC!CardanoDashDogecoinEthereumFilecoinLitecoinRippleSolanaTetherZcashYour support means a lot to us! Please note that due to current administrative challenges and the nature of cryptocurrency transactions, EFF is unable to offer donor gifts, acknowledgments for tax purposes, or official membership to donors who give using the addresses below.If you would like to become an EFF member with benefits and swag included, please visit eff.org/join and donate using traditional currency, Bitcoin, and a few other cryptocoins via BitPay. Thanks!Algorand AddressIEYKR7QHWDDCLY3W4HLFA2GR2UFVMKHGWOUKJ2GMEIHJMSITM6M7FBVZVA ALGO Address QR Code Binance Address0x375d784041BD851D68Ddd7719646e52C80c6F496 BUSD Address QR Code Bitcoin Address—Join EFF with BTC! Click to support EFF officially and receive new member gear.3LTu6uavQ4A3kgDauZipyGqcHQEUSVe2so BTC Address QR Code Cardano Addressaddr1v9le5y243j6hkkune6kg72a9fgpgs74fdf2fpcqzqz9ve4qn2jnjf ADA Address QR Code Dash AddressXj8Y2ifwyACRVjB1Pm7GxToD6sW63rqWYH DASH Address QR Code Dogecoin AddressD9piDskTbNPs7KescxvX8AKbvBFbFArgUK Dogecoin Address QR Code Ethereum Address0x1ca9EB2a5C213d417269134b80111F57e1644105 ETH Address QR Code Filecoin Addressf1if2rkcbplwheviedp4jerl27rcj4tfmsmt7otya FIL Address QR Code Litecoin AddressM89Uu7mUUyMgvkcuL47AqRJGimqKxPbpYiLTC Address QR Code Ripple AddressrwnYLUsoBQX3ECa1A5bSKLdbPoHKnqf63J:::ucl:::3986530980XRP Address QR Code Solana Address7q6i7ohv1hkXTMk4maUSFkyBFTNivyQtvBxCEQnPR821SOL Address QR Code Tether Address0xB0feF0b8CCD3f094dE458472F5313F937893c40eUSDT Address QR Code Zcash Addresst1JwfTH8KCsUvt2nCu5quAk2VbdWsfxbQTMZEC Address QR Code Go to Top Donor-Advised Funds (DAFs) As a 501(c)(3) organization, EFF can receive distributions through your Donor Advised Fund (DAF), including one-time gifts or recurring donations. Simply inform your DAF provider you would like to make a gift to: Electronic Frontier Foundation (EIN 04-3091431) 815 Eddy Street San Francisco, CA 94109 Please note that many DAF providers do not provide the donor’s name to the recipient organization. If you would like to be recognized for your gift, email Daniel de Zeeuw at ddz@eff.org and let him know the amount of the gift and the fund name. Additionally, due to IRS regulations, we may not be able to provide a thank you gift in line with your giving level. The DAF provider is responsible for your tax receipt. Please email Daniel if you have any questions.Go to TopEmployee Giving and Matching GiftsMany workplaces match their employees’ charitable gifts, meaning EFF will receive anywhere from 50% to 200% in additional contributions, as long as you report the donation to your employer. There are usually three steps to the process:Make your donation to EFFObtain and fill out a matching gifts formSubmit the form to the human resources or philanthropy departmentEFF will take it from there. If you want to help your colleagues, please add a description of the matching gifts procedure at your company and links to any forms available online at https://eff.org/match.Go to Top Hardware DonationsEFF is always grateful to receive donations of computing equipment and related hardware, which can be of great benefit to our organization's work. However, our needs are specific, and we cannot accept unsolicited equipment.We are not currently accepting hardware donations. We will update this page as our needs change. Thank you for your interest.EFF is a 501(c)(3) tax-exempt organization (FEIN 04-3091431) as recognized by the Internal Revenue Service. No goods or services, in whole or in part, were received in exchange for this contribution, therefore, the full fair-market value of your contribution is deductible for income tax purposes in accordance with Internal Revenue Service rules and regulations.Go to Top Legacy GivingCreate a Legacy through the Electronic Frontier Foundation's Long-Term Investment Fund for Digital Civil LibertiesThere are many ways you can make a significant gift to EFF that will provide you with tax savings and other benefits. Depending upon your unique financial planning objectives, you can be a major supporter of EFF using any or all of the giving methods described below. It is important, regardless of the size of your estate, to have a properly executed plan to ensure that you, not the courts, determine who will receive your property upon your death. When you create a will or living trust with a qualified advisor, attorney, accountant and/or financial planner, you ensure that your intentions are carried out. You are also ensuring that the needs of the people and organizations you care about will be met. The Development Team is prepared to work closely with you and your financial advisors to explain the benefits of each gift category. We encourage you to consult with your tax advisor for specific information about your own estate and financial planning goals.BequestsThe amount of a bequest gift is fully deductible for estate tax purposes. Gifts of securities, real property, and business interests may be made as bequests. Some sample language you can use to include EFF in your estate plan: "I bequeath to the Electronic Frontier Foundation, 815 Eddy Street, San Francisco, California 94109, the sum of ______________ ($) dollars for its general purposes."Gifts of Life InsuranceBy naming EFF the owner and beneficiary of an existing policy, you receive a tax deduction for the cash surrender value. You may also decide to make EFF the beneficiary of a life insurance policy. If you make gifts to EFF in the amount of the policy's premiums, you can take a charitable income tax deduction (provided EFF is not obligated to use the payments to cover the policy's premium).Retirement PlansYou can name EFF as a beneficiary of an Individual Retirement Account (IRA), 401 (k) Plan, 403 (b) Plan, Qualified Pension Plan, or Qualified Profit-Sharing Plan. Transferring these assets to a family member at the death of the plan participant may trigger two potential federal taxes: estate tax and income tax. When a beneficiary is someone other than a spouse, the combination of these taxes could consume most of the assets intended for transfer. Since EFF is a tax-exempt organization, we do not have to pay taxes on the income from the plan. Your plan administrator can provide you with a beneficiary form.Financial AccountsBy including EFF as a beneficiary of a bank account, brokerage account, mutual fund account, or an asset such as a certificate of deposit (CD), you can provide a legacy gift to support our work. Your estate would receive a charitable deduction equal to the amount of the gift. Simply fill out a beneficiary designation form obtained from the institution holding your account.Specific language for a bequestOrganization name: Electronic Frontier FoundationAddress: 815 Eddy Street, San Francisco, CA 94109Tax identification number: 04-3091431Organization type: Nonprofit organization with 501(c)(3) statusLegal Language: Electronic Frontier Foundation, Inc., a nonprofit corporation, organized and existing under the laws of The Commonwealth of Massachusetts, and with the principal business address of 815 Eddy Street, San Francisco, CA 94109.For more information on legacy giving to EFF, please contact Jocelyn Wicker at jocelyn@eff.org.Go to TopOnline Purchases: eBay, No Starch PressBenefit EFF with your online transactions.Go to Top Organizational MembershipDonations from businesses and other organizations allow EFF to address challenges to digital freedom wherever we are needed most. While EFF does not endorse private companies or their products, we're grateful for their contributions in support of our digital rights work. Learn more about organizational membership here.Go to Top Stock DonationsA gift of appreciated stock generally offers a twofold tax savings. First, you avoid paying any capital gains tax on the increase in the value of the stock. Second, you receive a charitable income tax deduction for the fair market value of the stock on the date it is transferred. Make sure you have owned the stock for a "long-term" period (more than 12 months) to qualify for these tax advantages. Gifts of appreciated stock are fully deductible--up to a maximum of 30% of your adjusted gross income. Please check with your accountant or tax advisor regarding your particular tax status.To facilitate the transfer of securities, please use the following information:Brokerage Firm: Morgan StanleyAccount Name: Electronic Frontier FoundationContact: Douglas Ingham: 650-926-7621E-mail: Douglas.J.Ingham@morganstanley.comEFF Account #: 233-055606-950DTC #: 0015Tax ID #: 04-3091431Please let us know in advance if you are transferring securities by contacting Daniel de Zeeuw at ddz@eff.org. We’ll need to know the amount and type of shares that you will be donating in order to provide a tax receipt.Go to Top Volunteer: Donate Your TimeEFF relies on financial support from supporters like you, but you can also engage with digital rights issues by becoming a volunteer or spreading the word with the Electronic Frontier Alliance. Go to Top'''
year_published = 2019
year_updated = 2025
