full_description = "Melissa Srago Event CoordinatorAs the event coordinator, Melissa develops and leads membership events for the EFF. Prior to EFF she’s worked with events of all sizes from backyards to convention centers in personal, corporate, and non-profit settings. She thrives on the effort it takes to make an event both successful and memorable, always dreaming up what could be next for EFF event attendees. When not at the office you will find her planning her next trip, trying a new restaurant, or at home with her husband, pets, and many, many plants. Email Address: melissa@eff.org Deeplinks Blog by Melissa Srago | February 27, 2025 EFF In Conversation With Ron Deibert on Chasing Shadows Join EFF's Cindy Cohn and Eva Galperin in conversation with Ron Deibert of the University of Toronto’s Citizen Lab, to discuss Ron’s latest book: Chasing Shadows: Cyber Espionage, Subversion and the Global Fight for Democracy. Read more about EFF In Conversation With Ron Deibert on Chasing Shadows Deeplinks Blog by Melissa Srago | January 14, 2025 EFFecting Change: Digital Rights & the New Administration Please join EFF for the next segment of EFFecting Change, our livestream series covering digital privacy and free speech. What direction will your digital rights take under Trump and the 119th Congress? Find out about the topics EFF is watching and the effect they might have on you. Join our... Read more about EFFecting Change: Digital Rights & the New Administration Deeplinks Blog by Melissa Srago | August 13, 2024 EFFecting Change: Reproductive Justice in the Digital Age Watch live on Wednesday, August 28 at eff.org/livestream! It's the second segment of EFFecting Change, EFF's new livestream series, diving into topics near and dear to our hearts. Read more about EFFecting Change: Reproductive Justice in the Digital Age Deeplinks Blog by Melissa Srago | June 28, 2024 Betting on Your Digital Rights: EFF Benefit Poker Tournament at DEF CON 32 Hacker Summer Camp is almost here... and with it comes the Third Annual EFF Benefit Poker Tournament at DEF CON 32 hosted by security expert Tarah Wheeler.Please join us at the same place and time as last year: Friday, August 9th, at high noon at the... Read more about Betting on Your Digital Rights: EFF Benefit Poker Tournament at DEF CON 32"
