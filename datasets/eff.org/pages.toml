["https://eff.org/about/staff/babette-ngene"]
title = "Babette Ngene | Electronic Frontier Foundation"
description = "Babette Ngene is the Director of the Public Interest Technology team at EFF. She provides strategic oversight for EFF's technological initiatives, ranging from cybersecurity to the development and deployment of open-source technologies dedicated to safeguarding and defending rights in the digital..."
full_description = "Babette Ngene Public Interest Technology Director Babette Ngene is the Director of the Public Interest Technology team at EFF. She provides strategic oversight for EFF's technological initiatives, ranging from cybersecurity to the development and deployment of open-source technologies dedicated to safeguarding and defending rights in the digital space. Before joining EFF, Babette drew from her extensive experience in both the private and public sectors, where she focused on overseeing digital rights and digital safety initiatives in over 50 countries across the globe. She is an expert in leading and managing initiatives that foster diversity and inclusion in the digital rights sphere by engaging new representatives and organizations from the global majority. She has also played a pivotal role in introducing and implementing digital rights programs across four regions spanning more than 20 countries, with a primary focus on defending and protecting the rights of at-risk communities. Babette is an active speaker at digital rights forums, including IGF, RightsCon, DRIFT, and FIFAFRICA. Babette holds a master's degree in international law from American University and hails from Yaounde, Cameroon. Deeplinks Blog by Cooper Quintin, Babette Ngene | July 15, 2024 EFF to FCC: SS7 is Vulnerable, and Telecoms Must Acknowledge That It’s unlikely you’ve heard of Signaling System 7 (SS7), but every phone network in the world is connected to it, and if you have ever roamed networks internationally or sent an SMS message overseas you have used it. SS7 is a set of telecommunication protocols that cellular network operators... Read more about EFF to FCC: SS7 is Vulnerable, and Telecoms Must Acknowledge That Deeplinks Blog by Paige Collings, Jillian C. York, Babette Ngene | May 28, 2024 EFF Submission to the Oversight Board on Posts That Include “From the River to the Sea” العربية As part of the Oversight Board’s consultation on the moderation of social media posts that include reference to the phrase “From the river to the sea, Palestine will be free,” EFF recently submitted comments highlighting that moderation decisions must be made on an individualized basis because the phrase... Read more about EFF Submission to the Oversight Board on Posts That Include “From the River to the Sea”"
