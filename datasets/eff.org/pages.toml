["https://eff.org/taxonomy/term/11579"]
title = "How to Fix the Internet: Podcast | Electronic Frontier Foundation"
description = '''
It seems like everywhere we turn we see dystopian stories about technology’s impact on our lives and our futures — from tracking-based surveillance capitalism to street level government surveillance to the dominance of a few large platforms choking innovation to the growing pressure by authoritarian governments to control what we see and say — the landscape can feel bleak. Exposing and articulating these problems is important, but so is envisioning and then building a better future. That’s where our podcast comes in. Click below to listen to the show now, or choose your podcast player:

  
%3Ciframe%20scrolling%3D%22no%22%20seamless%3D%22%22%20src%3D%22https%3A%2F%2Fplayer.simplecast.com%2F1c515ea8-cb6d-4f72-8d17-bc9b7a566869%3Fdark%3Dfalse%26amp%3Bshow%3Dtrue%22%20width%3D%22100%25%22%20height%3D%22480px%22%20frameborder%3D%22no%22%20allow%3D%22autoplay%22%3E%3C%2Fiframe%3E
  
  Privacy info.This embed will serve content from simplecast.com
  



   
Or get our YouTube playlist! Or, listen to the episodes on the Internet Archive!
EFF's How to Fix the Internet podcast offers a better way forward. Through curious conversations with some of the leading minds in law and technology, we explore creative solutions to some of today’s biggest tech challenges. Listen today to become deeply informed on vital technology issues and join the movement working to build a better technological future.
Share your listener feedback here!
Find the podcast via RSS, Stitcher, TuneIn, Apple Podcasts, and Spotify. You can find an MP3 archive of all our episodes at the Internet Archive. The pilot season (episodes 1-6) of "How to Fix the Internet" was produced by EFF with help from Stuga Studios; the following seasons were produced by EFF in collaboration with Pacific Content. Theme music by Nat Keefe of BeatMower.
EFF is deeply grateful for the support of the Alfred P. Sloan Foundation's Program in Public Understanding of Science and Technology, without whom this podcast would not be possible.

anthem_awards.png
  

  

"How to Fix the Internet" was honored in November 2024 with a Bronze Award in the Responsible Technology/Podcast or Audio category of the 4th annual Anthem Awards, presented by the International Academy of Digital Arts & Sciences. By amplifying  the voices that spark global change, the Anthem Awards seek to inspire others to take action in their own community. Our podcast won a Silver Award in the same category a year earlier.



2024_signal_awards.png
  

  


"How to Fix the Internet" was honored in October 2024 with both a Gold Award and a Listener’s Choice Award in the Technology Shows category of the 2024 Signal Awards, which set a standard for editorial excellence by honoring the organizations, artists, mavericks and brands who shape the podcast industry and the storytelling medium. Each year, The Signal Awards present Gold, Silver and Bronze Award Winners – as determined by The Signal Awards Judging Academy, an esteemed collective made up of the architects, instigators and trailblazers of the medium – while the listening public votes for their favorite finalists to take home the additional honor of Listener’s Choice Award in each category. Garnering more than 170,000 public votes in just two weeks from nearly 75,000 fans around the world, the 2024 Listener’s Choice Awards drew the largest voting body in The Signal Awards’ three-history.


w3 Awards 2024 Silver
  

  


“How to Fix the Internet” was honored in October 2024 with a Silver Award in the General Series-Science & Technology category of the w3 Awards. The w3 Awards celebrate the best digital experiences, content, and creativity in websites, online marketing, web video, mobile sites and apps, social media, podcasts, and emerging tech from companies, agencies, and nonprofits of all sizes. 


award_of_excellence.jpg
  

  

"How to Fix the Internet" was honored in May 2024 with an Award of Excellence in the Technology Podcast Series category of the 30th Annual Communicator Awards. The Communicator Awards is dedicated to recognizing excellence, effectiveness, and innovation across all areas of communication; the Award of Excellence is given to those entrants whose ability to communicate positions them as the best in the field.

 

This work is licensed under a Creative Commons Attribution 4.0 International License.'''
full_description = '''Deeplinks Blog by Allison Morris | December 29, 2024 EFF’s 2023 Annual Report Highlights a Year of Victories: 2024 in Review Every fall, EFF releases its annual report, and 2023 was the year of Privacy First. Our annual report dives into our groundbreaking whitepaper along with victories in freeing the law, right to repair, and more. It’s a great, easy-to-read summary of the year’s work, and it contains interesting tidbits about... Read more about EFF’s 2023 Annual Report Highlights a Year of Victories: 2024 in Review Deeplinks Blog by Josh Richman | October 11, 2024 Podcast Episode Rerelease: So You Think You’re A Critical Thinker This episode was first released in March 2023.With this year’s election just weeks away, concerns about disinformation and conspiracy theories are on the rise. We covered this issue in a really enlightening talk in March 2023 with Alice Marwick, the director of research at Data &... Read more about Podcast Episode Rerelease: So You Think You’re A Critical Thinker Deeplinks Blog by Josh Richman | October 2, 2024 Vote for EFF’s 'How to Fix the Internet’ Podcast in the Signal Awards! We’re thrilled to announce that EFF’s “How to Fix the Internet” podcast is a finalist in the Signal Awards 3rd Annual Listener's Choice competition. Now we need your vote to put us over the top!Vote now!We’re barraged by dystopian stories about technology’s impact on our... Read more about Vote for EFF’s 'How to Fix the Internet’ Podcast in the Signal Awards! Deeplinks Blog by Josh Richman | July 2, 2024 Podcast Episode: Fighting Enshittification The early internet had a lot of “technological self-determination" — you could opt out of things, protect your privacy, control your experience. The problem was that it took a fair amount of technical skill to exercise that self-determination. But what if it didn’t? What if the benefits of online privacy,... Read more about Podcast Episode: Fighting Enshittification Deeplinks Blog by Josh Richman |