full_description = '''Cookie NoticeLast Updated: July 4, 2023 The Centre for Effective Altruism ("CEA", "we" or "us") is a project of the Effective Ventures group — the umbrella term for Effective Ventures Foundation and Effective Ventures Foundation USA, Inc., which are two separate legal entities that work together. Under UK law, the Effective Ventures Foundation is the “data controller” for the personal data that we collect and process. We use cookies on effectivealtruism.org. This cookie notice applies only to effectivealtruism.org. You may access and change your cookie preferences at any time by clicking here. This cookie notice is different to the cookie notice that covers other Effective Ventures Foundation websites. You can see the Effective Ventures Foundation cookie notice here. What are cookies? A cookie is a very small text document, which often includes a unique identifier. Cookies are created when your browser loads a particular website. The website sends information to the browser which then creates a text file. Every time you go back to the same website, the browser retrieves and sends this file to the website's server. Find out more about the use of cookies on www.allaboutcookies.org. We also use other forms of technology (such as pixels and web beacons and, in apps, software development kits (usually referred to as SDKs)) which serve a similar purpose to cookies and which allow us to monitor and improve our Platforms and email communications. When we talk about cookies in this notice, this term includes these similar technologies. Your use of our Platforms may result in some cookies being stored that are not controlled by us. This may occur when the part of the Platform you are visiting makes use of a third party analytics or marketing automation/management tool or includes content displayed from a third party website, for example, YouTube or Facebook. You should review the privacy and cookie policies of these services to find out how these third parties use cookies and whether your cookie data will be transferred to a third country. We’ve set out below which third party cookies we use. What cookies do we use and what information do they collect? Analytics and performance cookies: these cookies help us improve or optimise the experience we provide. They allow us to measure how visitors interact with our Platforms and we use this information to improve the user experience and performance of our Platforms. These cookies are used to collect technical information such as the last visited Platform, the number of pages visited, whether or not email communications are opened, which parts of our website or email communication are clicked on and the length of time between clicks. They may also collect information to provide helpful features and e.g. be used to remember your preferences (such as your language preference), your interests and the presentation of the website (such as the font size). These cookies expire after 24 months. The third party cookies that we use in this category are: Google analytics Marketing and social media cookies: we use these cookies to collect information about your browsing habits in order to make advertising more relevant to you and your interests. They are also used to limit the number of times you see an advert as well as help measure the effectiveness of an advertising campaign. We may share this information with other parties who help manage online advertising. Some of these cookies may be used when you share information using a social media sharing button or "like" button on our Platforms, or when you engage with our content on or through a social site such as Facebook or Twitter. These cookies collect information about your social media interaction with our Platforms, such as whether or not you have an account with the social media site and whether you are logged into it when you interact with content on our Platforms. This information may be linked to targeting/advertising activities. These cookies expire after 24 months. The third party cookies that we use in this category are: Facebook pixel Who are we and how can you get in touch? The Effective Ventures Foundation (England and Wales registered charity number 1149828 and registered company number 07962181) has a registered office at Trajan House, Mill Street, Oxford, Oxfordshire, OX2 0DJ. If you have questions in relation to this notice or on how we use your personal information, please contact us at: info@ev.org.'''
