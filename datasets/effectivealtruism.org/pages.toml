sten now Replacing GuiltNate SoaresThis is the official audio version of Replacing Guilt, a book in which Nate Soares (the director of Machine Intelligence Research Institute) articulates a framework for seeing the world as it is and taking effective action — without putting half your work into beating yourself up.Listen now"
