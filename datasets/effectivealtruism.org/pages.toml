title = "Resources | Effective Altruism"
full_description = '''ResourcesRecommended introductory resources on effective altruism, including videos, books, podcasts and articles.videosbookspodcastsarticlesRecommended introductory reading covering key ideas in effective altruism and related topics.On caringNate SoaresCan we really feel or fully fathom the difference between the suffering of a million people versus a billion?Read more New IdeasThe world is awful. The world is much better. The world can be much better.Max RoserIt is wrong to think that these three statements contradict each other. We need to see that they are all true to see that a better world is possible.Read more Four ideas you already agree withSam DeereHere are four ideas that you probably already agree with. Three are about your values, and one is an observation about the world. Individually, they each might seem a bit trite or self-evident. But taken together, they have significant implications for how we think about doing good in the world.Read more The big idea: how can we live ethically in a world in crisis?William MacAskillAs global events spin us into anxious helplessness, effective altruism offers a solution.Read more This can't go onHolden KarnofskyFrom a historical perspective, we are living at a very remarkable moment in time: growth has been accelerating; it's near its historical high point; and it's faster than it can be for all that much longer. What does that mean for the future?Read more The case for reducing existential risksBenjamin ToddHumanity had entered a new age, in which we faced not only existential risks from our natural environment, but also the possibility that we might be able to extinguish ourselves.Read more New IdeasThe moral imperative towards cost-effectivenessToby OrdThis essay explores the moral relevance of cost-effectiveness, a major tool for capturing the relationship between resources and outcomes, by illustrating what is lost when cost-effectiveness is ignored.Read more Radical empathyHolden KarnofskyThe question, “Who deserves empathy and moral concern?” is a critical question to consider. Unfortunately, history has too many cases where entire populations were dismissed, mistreated and deprived of basic rights based on "conventional wisdom" which today looks indefensible.Read more Why experts are terrified of a human-made pandemic, and what we can do to stop itKelsey PiperAs biology gets better, biosecurity gets harder. Here’s what the world can do to prepare.Read more The case for taking AI seriously as a threat to humanityKelsey PiperStephen Hawking has said, “The development of full artificial intelligence could spell the end of the human race.” Elon Musk claims that AI is humanity’s “biggest existential threat.” If that has you asking: "Wait, what?", then read on.Read more'''
