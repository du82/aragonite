["https://effectivealtruism.org/articles/introduction-to-effective-altruism"]
title = "What is effective altruism? | Effective Altruism"
description = """
Effective altruism is a project that aims to find the best ways to help others, and put them into practice.

It’s partly a research field, which aims to identify the world’s most pressing problems and"""
full_description = '''Articles\\What is effective altruism?What is effective altruism?Contents Introduction What are some examples of effective altruism in practice? Preventing the next pandemic Providing basic medical supplies in poor countries Helping to create the field of AI alignment research Ending factory farming Improving decision-making What principles unite effective altruism? How can you take action? FAQ What are some common objections to effective altruism? What’s next? Introduction Introduction Effective altruism is a project that aims to find the best ways to help others, and put them into practice. It’s both a research field, which aims to identify the world’s most pressing problems and the best solutions to them, and a practical community that aims to use those findings to do good. This project matters because, while many attempts to do good fail, some are enormously effective. For instance, some charities help 100 or even 1,000 times as many people as others, when given the same amount of resources. This means that by thinking carefully about the best ways to help, we can do far more to tackle the world’s biggest problems. Effective altruism was formalized by scholars at Oxford University, but has now spread around the world, and is being applied by tens of thousands of people in more than 70 countries.1 People inspired by effective altruism have worked on projects that range from funding the distribution of 200 million malaria nets, to academic research on the future of AI, to campaigning for policies to prevent the next pandemic. They’re not united by any particular solution to the world’s problems, but by a way of thinking. They try to find unusually good ways of helping, such that a given amount of effort goes an unusually long way. Here are some examples of what they've done so far, followed by the values that unite them: What are some examples of effective altruism in practice? Preventing the next pandemic Why this issue? People in effective altruism typically try to identify issues that are big in scale, tractable, and unfairly neglected.2 The aim is to find the biggest gaps in current efforts, in order to find where an additional person can have the greatest impact. One issue that seems to match those criteria is preventing pandemics. Researchers in effective altruism argued as early as 2014 that, given the history of near-misses, there was a good chance that a large pandemic would happen in our lifetimes. But preparing for the next pandemic was, and remains, hugely underfunded compared to other global issues. For instance, the US invests around $8bn per year preventing pandemics, compared to around $280bn per year spent on counterterrorism over the last decade.3 Preventing terror attacks is certainly important. But the scale of the issue seems smaller. For instance, just to focus on the number of deaths, in the last 50 years, around 500,000 people have been killed by terrorism. But over 21 million people were killed by COVID-19 alone4 – or consider the 40 million killed by HIV/AIDS.5 Not to mention, a future pandemic could easily be much worse than COVID-19: there’s nothing to rule out a disease that’s more infectious than the Omicron variant, but that’s as deadly as smallpox. (See more on the comparison in footnote 4.) In effective altruism, once a big and neglected problem has been identified, the community then looks for solutions that have a chance of making a big contribution to solving the problem, and are neglected by others working on that issue, which brings us to... Some examples of what’s been done In 2016 Open Philanthropy – a foundation inspired by effective altruism – became the largest funder of the Johns Hopkins Center for Health Security, which is one of the few groups doing research to identify better policy responses to pandemics, and was an important group in the response to COVID-19.6 When COVID-19 broke out, members of the community founded 1DaySooner, a non-profit that advocates for human challenge trials. In this type of vaccine trial, healthy volunteers are deliberately infected with the disease, enabling near-instant testing of the vaccine. As one of the only advocates for this intervention, 1DaySooner has signed up over 30,000 volunteers,7 and played an important role in starting the world’s first COVID-19 human challenge trial. This model can be repeated when we face the next pandemic. Members of the effective altruism community helped to create the Apollo Programme for Biodefense, a multibillion dollar policy proposal designed to prevent the next pandemic. Providing basic medical supplies in poor countries Why this issue? It’s common to say that charity begins at home, but in effective altruism, charity begins where we can help the most. And this often means focusing on the people who are most neglected by the current system – which is often those who are more distant from us. Over 700 million people live on less than $1.90 per day.8 In contrast, an American living near the poverty line lives on 20 times as much, and the average American college graduate lives on about 107 times as much. This places them in the top 1.3% of income, globally speaking.9 (These amounts are already adjusted for the fact that money goes further in poor countries.) Global inequality is extreme. Because of this, transferring resources to the very poorest people in the world can do a huge amount of good. In richer countries like the US and UK, governments are typically willing to spend over $1 million to save a life.10 This is well worth doing, but in the world’s poorest countries, the cost of saving a life is far lower. GiveWell is an organization that does in-depth research to find the most evidence-backed and cost-effective health and development projects. It discovered that while many aid interventions don’t work, some, like providing insecticide-treated bednets, can save a child’s life for about $5,500 on average. That's 180 times less.11 These basic medical interventions are so cheap and effective that even the most prominent aid sceptics agree they’re worthwhile. Some examples of what’s been done Over 110,000 individual donors have used GiveWell’s research to contribute more than $1 billion to its recommended charities, supporting organisations like the Against Malaria Foundation, which has distributed over 200 million insecticide-treated bednets. Collectively these efforts are estimated to have saved 159,000 lives.12 In addition to charity, it’s possible to help the world’s poorest people through business. Wave is a technology company founded by members of the effective altruism community, which allows people to transfer money to several African countries faster and several times more cheaply than existing services. It’s especially helpful for migrants sending money home to their families, and has been used by over 800,000 people in countries like Kenya, Uganda and Senegal. In Senegal alone, Wave has saved its users hundreds of millions of dollars in transfer fees – around 1% of the country’s GDP.13 Helping to create the field of AI alignment research Why this issue? People in effective altruism often end up focusing on issues that seem counterintuitive, obscure or exaggerated. But this is because it’s more impactful to work on the issues that are neglected by others (all else equal), and these issues are (almost by definition) going to be unconventional ones. One example is the AI alignment problem. Artificial intelligence (AI) is progressing rapidly. The leading AI systems are now able to engage in limited conversation, solve college-level maths problems, explain jokes, generate extremely realistic images from text, and do basic coding.14 None of this was possible just ten years ago. The ultimate goal of the leading AI labs is to develop AI that is as good as, or better than, human beings on all tasks. It’s extremely hard to predict the future of technology, but various arguments and expert surveys suggest that this achievement is more likely than not this century. And according to standard economic models, once general AI can perform at human level, technological progress could dramatically accelerate. The result would be an enormous transformation, perhaps of a significance similar to or greater than the industrial revolution in the 1800s. If handled well, this transformation could bring about abundance and prosperity for everyone. If handled poorly, it could result in an extreme concentration of power in the hands of a tiny elite. In the worst case, we could lose control of the AI systems themselves. Unable to govern beings with capabilities far greater than our own, we would find ourselves with as little control over our future as chimpanzees have control over theirs. This means this issue could not only have a dramatic impact on the present generation, but also on all future generations. This makes it especially pressing from a “longtermist” perspective, a school of thinking which holds that improving the long-term future is a key moral priority of our time. How to ensure AI systems continue to further human values, even as they become equal (or superior) to humans in their capabilities, is called the AI alignment problem, and solving it requires advances in computer science. Despite its potentially historical importance, only a couple of hundred researchers work on this problem, compared to tens of thousands working to make AI systems more powerful.15 It’s hard to sum up the case for the issue in a few paragraphs, so if you’d like to explore more, we’d recommend starting here, here and here. Some examples of what’s been done One priority is to simply tell more people about the issue. The book Superintelligence was published in 2014, making the case for the importance of AI alignment, and became a New York Times best-seller. Another priority is to build a research field focused on this problem. For instance, AI pioneer Stuart Russell, and others inspired by effective altruism, founded The Center for Human-Compatible AI at UC Berkeley. This research institute aims to develop a new paradigm of AI development, in which the act of furthering human values is central. Others have helped to start teams focused on AI alignment at major AI labs such as DeepMind and OpenAI, and outline research agendas for AI alignment, in works such as Concrete Problems in AI Safety. Ending factory farming Why this issue? People in effective altruism try to extend their circle of concern – not only to those living in distant countries or future generations, but also to non-human animals. Nearly 10 billion animals live and die in factory farms in the US every year16 – often unable to physically turn around their entire lives, or castrated without anaesthetic. Lots of people agree we shouldn’t make animals suffer needlessly, but most of this attention goes towards pet shelters. In the US, about 1,400 times more animals pass through factory farms than pet shelters.17 Despite this, pet shelters receive around $5 billion per year in the US, compared to only $97 million on advocacy to end factory farming.18 Some examples of what’s been done One strategy is advocacy. The Open Wing Alliance, which received significant funding from funders inspired by effective altruism, developed a campaign to encourage large companies to commit to stop buying eggs from caged chickens. To date, they have won over 2,200 commitments, and as a result over 100 million birds have been spared from cages.19 Another strategy is to create alternative proteins, which if made cheaper and tastier than factory farmed meat, could make demand disappear, ending factory farming. The Good Food Institute is working to kick-start this industry, helping to create companies like Dao Foods in China and Good Catch in the US, encouraging big business to enter the industry (including JBS, the world’s largest meat company) and securing tens of millions of dollars of government support.20 Open Philanthropy was an early investor in Impossible Foods, which created the Impossible Burger – an entirely vegan burger that tastes much more like meat, and is now sold in Burger King. Improving decision-making Why this issue? People who want to do good often prefer to directly tackle problems, since it’s more motivating to see the tangible effects of their actions. But what matters is that the world gets better, not that you do it with your own two hands. So people applying effective altruism often try to help indirectly, by empowering others. One example of this is by improving decision-making. Namely: if key actors — such as politicians, private and third sector leaders, or grantmakers at funding bodies — were generally better at making decisions, society would be in a better position to deal with a whole range of future global problems, whatever they turn out to be. So, if we can find new, neglected ways to improve the decision-making of important actors, that could be a route to having a big impact. And it seems like there are some promising solutions that could achieve this. Some examples of what’s been done Many global problems are exacerbated by a lack of trustworthy information. Metaculus is a forecasting technology platform that identifies important questions (such as the chance of Russia invading Ukraine), aggregates forecasts made by hundreds of forecasters, and weighs them by their past accuracy. Metaculus gave a probability of a Russian invasion of Ukraine of 47% by mid January 2022, and 80% shortly before the invasion on the 24th of February21 – a time when many pundits, journalists and experts were saying it definitely wouldn’t happen. The Global Priorities Institute at the University of Oxford does foundational research at the intersection of philosophy and economics into how key decision-makers can identify the world’s most pressing problems. It has helped to create a new academic field of global priorities research, creating a research agenda, publishing tens of papers, and helping to inspire relevant research at Harvard, NYU, UT Austin, Yale, Princeton and elsewhere. What principles unite effective altruism? Effective altruism isn't defined by the projects above, and what it focuses on could easily change. What defines effective altruism are the principles that underpin its search for the best ways of helping others: Prioritization: Our intuitions about doing good don't usually take into account the scale of the outcomes — helping 100 people often makes us feel as satisfied as helping 1000. But since some ways of doing good also achieve dramatically more than others, it’s vital to attempt to use numbers to roughly weigh how much different actions help. The goal is to find the best ways to help, rather than just working to make any difference at all. Impartial altruism: It's normal and reasonable to have special concern for one's own family, friends or nation. But, when trying to do as much good as possible, we aim to give everyone's interests equal weight, no'''
year_published = 2025
