full_description = '''The Introductory EA ProgramLearn the core ideas of Effective AltruismThrough this online course, you'll learn the key ideas of EA with a small group of like-minded people.Guided by a facilitator, you'll gain access to curated materials and practical exercises to help you have a greater impact.8 weeksNo fees 28 April - 22 June 2025 OnlineGlobal Time ZoneApply here by Sunday, April 6th! Apply here by Sunday, April 6th!Improve the lives of othersIncrease your impactLearn new concepts, frameworks and counter intuitive ideas to help you have more impact in your career, donations and other projects.Connect with people focused on impactMeet like-minded peopleDiscuss a curated curriculum with other people who care deeply about improving the lives of others in the most effective ways they can.How it worksThe Introductory EA Program is a free online program open for anyone around the world to join.8 week program4-8 participantsYou'll have weekly 1.5-hour discussions with a cohort of 4-8 participants and one facilitator.1400 alumni in online groupAccess a slack group with others who care about maximising their impact.3.5 hours per week2 hours prepBefore attending each discussion, you’ll spend roughly 2 hours completing a set of readings, podcasts or videos (and sometimes a brief written exercise).1.5 hour discussionsDiscuss the ideas you've read with your seminar and facilitator over video call.Topics CoveredQuestions You'll ExploreWho should we care about helping?How much better are the best options to do good?What can we do to prevent the next pandemic?How can we make better decisions together?How does climate change compare to other risks?CurriculumWeek 1The Effectiveness MindsetWe’ll explore why it's important to think carefully about how you spend your time and money to help others, and why a "scout mindset" is critical to finding the best opportunities.Week 2Differences in ImpactSome efforts to help appear to be much more effective than others. We'll share a tool for estimating impact, and look into one promising focus area: reducing global poverty.Week 3Radical EmpathyShould we care about the suffering of non-human animals, as well as humans? Alongside this question, we'll explain the ideas of expected value and impartial altruism.View full syllabusThe Introductory EA ProgramLearn the core ideas of Effective Altruism8 weeksNo fees 28 April - 22 June 2025 OnlineGlobal Time ZoneApply here by Sunday, April 6th! Apply here by Sunday, April 6th!AlumniSee how people around the world are taking action after learning more about Effective Altruism.Luca, Founder & Content Creator at School Of ThinkingReceived grant to build longtermist community in ItalyReceived a grant to leave management consultant job and work as a content creator full time with his project: School of Thinking.Vlad, Robotics Mechanical Engineer at NASAStarted a workplace group at NASAFounded an EA group at NASA to help colleagues have more impact through donations, volunteering, and project choices.Denisse, Software Engineer at Meta in Zurich, SwitzerlandVolunteered for ‘Effective Institutions’Earning to give at Meta, organized “Giving Month” project raising more than $40k. Also volunteering opportunity with “Effective Institutions Project.”Sydney, Stanford junior studying biomedical computationLaunched workshops on longtermismSydney started a summer program to find talented high school students and help them tackle existential risks.Michael, Stanford studying CS and Earth SystemsFounded the Stanford Alternative Protein ProjectMichael founded a student group dedicated to advancing products with the potential to make factory farming obsolete.Buhle, University of Cape Town graduate and intern at VodafoneAdvocated to improve food fortification in South AfricaOrganised various EA events and began an advocacy project to improve food fortification in South Africa (in collaboration with FFI).Other ProgramsIn-Depth EA ProgramThis program is ideal for graduates of the introductory program or those with a similar level of experience, who want to dive deeper into more complex EA ideas and examine their key uncertainties about how to best improve the world. The Precipice Reading GroupIn this reading group, you will read and engage in structured discussions of Toby Ord’s The Precipice, a book about existential risks and safeguarding the future of humanity.View full syllabusKeep up to date with the latest news, podcasts, videos, and opportunities in our monthly newsletterRead past editionsThe Introductory EA ProgramLearn the core ideas of Effective Altruism8 weeksNo fees 28 April - 22 June 2025 OnlineGlobal Time ZoneApply here by Sunday, April 6th! Apply here by Sunday, April 6th!Join a globalnetwork1000+Learners50+Countries'''
