["https://www.efficios.com/blog/page4"]
title = """
Blog
   - EfficiOS"""
full_description = "Tracing is a powerful tool to help solve problems in high-performance multi-threaded applications. There are success stories of custom application tracers deployed in large distributed environments, but we almost never see a low-level system tracer deployed in such environments. With the features introduced in LTTng during the last year, we can now extract remotely and in real-time relevant informations about running production servers efficiently. We will demonstrate how LTTng can be deployed in a cloud infrastructure (0penStack) to extract high-precision metrics remotely, how to enable/disable kernel and user-space events dynamically, and how to extract traces on crashes. This presentation will give system administrators a new perspective on how to monitor and debug production servers in large-scale data-centers. Desnoyers, Mathieu, Proving the Correctness of Nonblocking Data Structures. ACM Queue, 11 (5): 30-43 (2013). In the past, much effort has been invested in high performance kernel tracing tools, but now focus in the tracing community seems to be shifting over to efficient user space application tracing. By providing joint kernel and user space tracing, developers can have deeper insights in their applications latencies. This presentation covers the ongoing efforts within the LTTng project to enhance system-wide tracing at the user space level. It discusses instrumentation sources such as Tracepoints, Uprobes, and SystemTAP SDT providers, along with their integration with LTTng. A brief overview of the latest and upcoming features of the user space tracer is presented. It also discusses ongoing efforts in the area of trace format and control protocol standardisation. Finally, our presentation includes challenging glibc-related issues encountered during LTTng-UST development, opening the discussion on how to improve and collaborate on user-space instrumentation. The targeted audience is user space and kernel developers, those interested in tracing infrastructure, shared system libraries, and application instrumentation."
