["https://www.efficios.com/blog/page3"]
title = """
Blog
   - EfficiOS"""
full_description = "For a numbers of years, silicon vendors have been providing hardware tracing facilities to embedded developers. By using these, developers can resolve performance and latency issues more quickly, resulting in shorter time to market. In this talk, we will cover the hardware based tracing facilities offered by various manufacturers and see how they differ from their software counterparts with respect to their instrumentation capabilities, transport mechanisms, output formats, etc. We will also show how joint hardware and software tracing can be used by developers to gain deeper insights in their applications’ behaviour. Finally, we will outline the on-going work within the Linux Trace Toolkit next generation (LTTng) project to enhance hardware tracing support and tracing data visualization. The latest developments in LTTng include features relevant for use-cases ranging from Linux distribution bug report data collection to cloud monitoring. Amongst those features, we notably find the live streaming of traces over the network, which allows analysis of live traces as the are being gathered. We also find flight recorder tracing, with non-stop snapshot feature, which allows augmenting distribution bug reports with a trace of events that precede each bug. Those features will be presented, along with discussion of the project roadmap. EfficiOS co-organized the Tracing Summit 2013 event co-located with the Linux Foundation LinuxCon Europe 2013 in Edinburgh, UK held last October. The main target of this one day conference was to provide room for discussion between people in the various areas that benefit from tracing, namely parallel, distributed and/or real-time systems, as well as kernel development. As the number of cores in systems steadily increases, you may find that the good old mutual exclusion synchronization is not sufficient to let your application use more cores not only for heat generation, but primarily for effective computing. The Userspace RCU library (http://lttng.org/urcu) implements Read-Copy Update (RCU) synchronization and various lock-free data structures that allow user-space applications to leverage very lightweight synchronization across cores. It allows a broad range of demanding applications to scale to large numbers of cores. This library is released under LGPL v2.1, so it can be used by all applications. This tutorial will walk the audience through the basics of Read-Copy Update, and then through the synchronization and data structure APIs exposed by Userspace RCU."
year_published = 2013
