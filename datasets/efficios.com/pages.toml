["https://efficios.com/fr"]
title = "EfficiOS"
full_description = "Nous développons des outils et bibliothèques à code source ouvert pour vous aider à adapter vos applications à des systèmes multi-cœurs massifs, à répondre à des contraintes temps réel et à identifier les défectuosités. LTTng (Linux Trace Toolkit: next generation) est un traceur noyau et applicatif pour Linux. Il collige des informations sur les applications et les événements système pertinents afin de faciliter la détection des mauvais emplois des applications, des bibliothèques et du système d'exploitation. Nous contribuons au et assurons la maintenance de certaines parties du noyau Linux, notamment son interface de traçage et les appels systèmes membarrier(2) et rseq(2) (Séquences Redémarrables). Le Common Trace Format (CTF) se veut un format répondant aux exigences des communautés des systèmes embarqués, des télécoms, des systèmes haute performance, et des noyaux de systèmes d'exploitation. barectf (des termes bare metal et CTF) est un générateur de traceurs (ANSI C) produisant des flux de données au format CTF. Babeltrace est un moteur de manipulation de traces. Il s'agit de l'implémentation de référence du format CTF. Rendue disponible sous licence LGPL, la bibliothèque Userspace RCU (liburcu) offre des primitives de synchronisation des lecteurs à faible coût dont l'extensibilité est linéaire. Pour cela, elle s'appuie sur les techniques RCU (Read Copy Update) et des algorithmes sans verrous. Notre principal objectif est de réduire le temps que nos clients passent à identifier les défaillances de leurs systèmes. Nous les aidons à adapter leurs applications à des systèmes multi-cœurs massifs et à répondre aux contraintes temps réel. Pour cela, nous mettons à leur disposition nos outils et bibliothèques à code source ouvert et nous contribuons au noyau Linux. Nous offrons des services de développement, d'assistance technique et de formation centrés sur nos projets. Nous aidons nos clients à adapter nos logiciels sur mesure grâce à nos services de développement."
year_published = 2025
clearnet = "https://efficios.com/fr"
