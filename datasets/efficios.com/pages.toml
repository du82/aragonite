["https://www.efficios.com/blog/2024/06/06/lpc24-tracing-perf-events-microconf"]
title = """
Linux Plumbers Conference 2024 - Tracing / Perf Events Microconf
   - EfficiOS"""
full_description = "This year we have the pleasure to co-organize the Tracing / Perf Events Microconference at Linux Plumbers Conference 2024 which will be held in Vienna this September. If you'd like to join us there in person or virtually, registrations are open and if you would like to propose a topic for the microconference, have a look at the CFP. The Linux kernel has grown in complexity over the years. Complete understanding of how it works via code inspection has become virtually impossible. Today, tracing is used to follow the kernel as it performs its complex tasks. Tracing is used today for much more than simply debugging. Its framework has become the way for other parts of the Linux kernel to enhance and even make possible new features. Live kernel patching is based on the infrastructure of function tracing, as well as BPF. It is now even possible to model the behavior and correctness of the system via runtime verification which attaches to trace points. There is still much more that is happening in this space, and this microconference will be the forum to explore current and new ideas. Perf events are a mechanism for presenting performance counters and software events that occur running Linux to users. There are kernel and userland components to perf events, with the kernel presenting or extending APIs and the perf tool presenting this to users You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
