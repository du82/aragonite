["https://efficios.com/blog/2011/09/09/lpc11-lttng-2-application-library-kernel-tracing"]
title = """
Linux Plumbers Conference 2011: LTTng 2.0: Application, Library and Kernel tracing within your Linux distribution.
   - EfficiOS"""
full_description = 'This presentation introduces LTTng 2.0, detailing the new features it provides. Amongst these, the most welcome will likely be the ability to use it on vanilla and distribution kernels, as well as the ability to hook on Tracepoints, Kprobes, Ftrace function tracing and Perf PMU counters. The new integrated command line interface for both the kernel and user-space tracers (LTTng and UST) is presented. In an overview of the new LTTng 2.0 ABI, the new Common Trace Format (CTF) natively produced by LTTng 2.0 will be described, along with the tracer control ABI. The way LTTng 2.0 allows augmenting event data with optional "context" information (process ID, thread ID, nice level, priority, as well as branch, cache misses, and other performance counters) is described. You may consent to allowing analytics supplied by Google. See our privacy policy for more information.'
