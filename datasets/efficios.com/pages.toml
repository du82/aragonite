Tracing Summit 2012: Interoperability Between Tracing Tools with the Common Trace Format (CTF)
   - EfficiOS"""
full_description = "This presentation introduces new technologies and a common format allowing tracing of Linux systems at the software (hypervisor, kernel, user-space), and hardware levels. One major building block of CTF is the Trace Stream Description Language (TSDL) which flexibility enables description of various binary trace stream layouts. It enables tracing of Linux deployed on multi-core CPUs, interacting with DSPs, where each of these components exports its own trace streams. This presentation covers work on the the Common Trace Format (CTF) specification and its reference implementations: the Babeltrace trace converter, the LTTng 2.0 kernel tracer, and the LTTng-UST 2.0 (user-space tracer). This work has been realized in collaboration with Ericsson, the Multi-Core Association Tool Infrastructure Workgroup and the Linux Foundation Consumer Electronics Linux Forum (CELF) Workgroup. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
