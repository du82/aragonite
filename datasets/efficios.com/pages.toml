["https://efficios.com/blog/page2"]
title = """
Blog
   - EfficiOS"""
full_description = "Concurrency control algorithms, paired with per-CPU data, are integral to ensuring low-level libraries and high-performance applications scale properly on today's hardware. These algorithms guarantee that user-space data structures are kept consistent in the face of simultaneous accesses, and that modifications are done wholly so that threads see either the before or after state, but not in between. The LTTng kernel and user-space tracer were designed for traditional Linux hosts but can also be used in a container environment. While we currently lack high-level functions and integration with container technologies, the raw data can be gathered and analysed by the seasoned lttng user. This talk will detail what is currently available, what we would like to add and hopefully what the community would expect from a container aware version of LTTng. The LTTng kernel and user-space tracer can help solve a wide variety of problems (especially those hard to reproduce ones). There are four main ways of extracting and processing an LTTng trace, and each of them addresses a different use-case. In this presentation we will demonstrate these modes and present real-world situations where they can be used. If you already know how to use LTTng you will learn new ways this tool can help you, and if you don't, you will probably discover a new way to address these complex problems. In the past, a lot of effort has been invested in high performance kernel tracing tools, but now the focus of the tracing community seems to be shifting over to efficient user space application tracing. By providing joint kernel and user space tracing, developers now have deeper insights into their applications. Furthermore, system administrators can now put in place a new way to monitor and debug systems using a low intrusiveness tracing system, LTTng. Mathieu Desnoyers is co-author of a series of articles on Userspace RCU published on Linux Weekly News. These introduce the Userspace RCU library, which brings RCU and efficient data structures to user-space."
year_published = 2019
clearnet = "https://efficios.com/blog/page2"
