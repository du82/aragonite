["https://efficios.com/blog/page6"]
title = """
Blog
   - EfficiOS"""
full_description = 'This presentation introduces LTTng 2.0, detailing its new features. Amongst these, the most welcome are be the ability to use it on vanilla and distribution kernels, as well as the ability to hook on Tracepoints, Kprobes, Ftrace function tracing and Perf PMU counters. The new integrated command line interface for both the kernel and user-space tracers (LTTng and UST) will be presented. The new Common Trace Format (CTF) natively produced by LTTng 2.0 will be described. Conditional tracing within LTTng and UST will also be discussed. Tracing use-cases by distribution power-users, telecom, and open source projects (MariaDB, Qemu/KVM) will be presented. This talk will also cover trace analysis tools to handle many GB of trace data, trace data visualization such as statistics, event distribution, sequence diagram, correlation with GDB tracepoint and integration of text based logs with a text parser wizard. Target audience: anyone understanding performance issues on multi-core systems. This presentation introduces LTTng 2.0, detailing the new features it provides. Amongst these, the most welcome will likely be the ability to use it on vanilla and distribution kernels, as well as the ability to hook on Tracepoints, Kprobes, Ftrace function tracing and Perf PMU counters. The new integrated command line interface for both the kernel and user-space tracers (LTTng and UST) is presented. In an overview of the new LTTng 2.0 ABI, the new Common Trace Format (CTF) natively produced by LTTng 2.0 will be described, along with the tracer control ABI. The way LTTng 2.0 allows augmenting event data with optional "context" information (process ID, thread ID, nice level, priority, as well as branch, cache misses, and other performance counters) is described. This presentation introduces the Userspace RCU library, a highly-scalable LGPL synchronization library providing very low-overhead and linearly scalable read-side synchronization, as well as lock-free data containers such as queues and stacks. This is followed by a presentation of ongoing work on a RCU red-black tree and a lock-free RCU hash table. Finally, the topic of efficient user-space wake-up management (both in terms of overhead and power-consumption) is discussed.'
year_published = 2011
