["https://efficios.com/blog"]
title = """
Blog
   - EfficiOS"""
full_description = "This year we have the pleasure to co-organize the Tracing / Perf Events Microconference at Linux Plumbers Conference 2024 which will be held in Vienna this September. If you'd like to join us there in person or virtually, registrations are open and if you would like to propose a topic for the microconference, have a look at the CFP. Restartable Sequences, a system call speeding up user-space operations on per-CPU data, made its way into the 4.18 Linux kernel. The Restartable Sequences system call introduced in Linux 4.18 has limitations which can be solved by introducing a bytecode interpreter running in inter-processor interrupt context which accesses user-space data. Babeltrace started out as the reference implementation of a Common Trace Format (CTF) reader. As the project evolved, many trace manipulation use-cases (merging, trimming, filtering, conversion, analysis, etc.) emerged and were implemented either as part of the Babeltrace project, on top of its APIs or through custom tools. There is no shortage of great tools to monitor distributed applications. However, most of them focus on monitoring overall performance metrics and error rates, giving only a general idea of the health of an infrastructure. Unfortunately, rarely occurring issues are often hidden by general trends making it difficult to completely understand infrequent, yet sometimes catastrophic, problems. Tracers are great at tracking down sporadic problems in production environments, but the amount of data they generate can be hard to manage in the wild. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
