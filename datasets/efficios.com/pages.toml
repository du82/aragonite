["https://www.efficios.com/blog/page7"]
title = """
Blog
   - EfficiOS"""
full_description = "Mathieu Desnoyers presented a short LTTng tutorial at UDS 2010, showing how to narrow down the source of bugs and performance issues in a distribution. This talk presents the steps taken to move towards a consensus about a trace model and format to gather system-wide traces in a way that respects the embedded, telecommunication and high-performance computing industry requirements. It presents some use-cases gathered from the industry, the requirements imposed by the embedded, telecommunication, and high-performance computing Linux users and discusses the reaction of the kernel community towards these requirements. It finally presents a trace format proposal that aims at fulfilling these requirements. The Lockless Ring Buffer library is proposed as a response to both Linux community unification and industry high-performance requirements. This is a major step in tracer infrastructure unification, providing flexibility, high-throughput, reliability and real-time awareness to both tracers and kernel drivers through a simple API. This presentation will discuss the latest additions done to the LTTng project: the UST user-space tracer, the Eclipse Linux Tools Project LTTng integration, and user-space static tracepoints integration with gdb. An update on the latest LTTng roadmap will also be presented. The LTTng move from GPLv2 to dual LGPLv2.1/GPLv2 licensing will be explained. This session is a hands-on tutorial on how to use the LTTng tracer. It presents the steps required to record a trace in the various operation modes of the tracer. The performance overhead trade-offs will be discussed. Navigation in a trace with the LTTV trace analyzer, including tips and tricks on how to best use the LTTV plugins will be demonstrated. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
year_published = 2010
