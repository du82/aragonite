["https://efficios.com/blog/2018/02/03/fosdem18-lttng-approaches"]
title = """
FOSDEM 2018 - The LTTng approaches to solving complex problems
   - EfficiOS"""
full_description = "The LTTng kernel and user-space tracer can help solve a wide variety of problems (especially those hard to reproduce ones). There are four main ways of extracting and processing an LTTng trace, and each of them addresses a different use-case. In this presentation we will demonstrate these modes and present real-world situations where they can be used. If you already know how to use LTTng you will learn new ways this tool can help you, and if you don't, you will probably discover a new way to address these complex problems. The modes we will demonstrate are: post-processing mode (default), snapshot mode, live mode and the new rotation mode. All of these modes have their pros and cons in a context of monitoring and cloud and we will be happy to discuss with the crowd to see how to address their particular use-cases and help them gain a full-system insight. The intended audience is devops engineers having to deal with complex problems and look for a way to scale their monitoring and debugging method on a small or large fleet of servers. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
