full_description = "This presentation introduces LTTng 2.0, detailing its new features. Amongst these, the most welcome are be the ability to use it on vanilla and distribution kernels, as well as the ability to hook on Tracepoints, Kprobes, Ftrace function tracing and Perf PMU counters. The new integrated command line interface for both the kernel and user-space tracers (LTTng and UST) will be presented. The new Common Trace Format (CTF) natively produced by LTTng 2.0 will be described. Conditional tracing within LTTng and UST will also be discussed. Tracing use-cases by distribution power-users, telecom, and open source projects (MariaDB, Qemu/KVM) will be presented. This talk will also cover trace analysis tools to handle many GB of trace data, trace data visualization such as statistics, event distribution, sequence diagram, correlation with GDB tracepoint and integration of text based logs with a text parser wizard. Target audience: anyone understanding performance issues on multi-core systems. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
