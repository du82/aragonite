["https://www.efficios.com/blog/page5"]
title = """
Blog
   - EfficiOS"""
full_description = "This presentation introduces new technologies and a common format allowing tracing of Linux systems at the software (hypervisor, kernel, user-space), and hardware levels. One major building block of CTF is the Trace Stream Description Language (TSDL) which flexibility enables description of various binary trace stream layouts. It enables tracing of Linux deployed on multi-core CPUs, interacting with DSPs, where each of these components exports its own trace streams. This presentation covers work on the the Common Trace Format (CTF) specification and its reference implementations: the Babeltrace trace converter, the LTTng 2.0 kernel tracer, and the LTTng-UST 2.0 (user-space tracer). This work has been realized in collaboration with Ericsson, the Multi-Core Association Tool Infrastructure Workgroup and the Linux Foundation Consumer Electronics Linux Forum (CELF) Workgroup. In the past year, the RCU lock-free hash table has been polished and made production-ready within the Userspace RCU project. It performs and scales really well for updates, key lookups and traversals in no particular key order, but does not fulfill ordered key traversal use-cases. This talk is presenting ongoing work on an ordered data structure that supports RCU reads: a cache-efficient, compact, fast, and scalable trie, inspired by Judy Arrays. The Linux Plumbers scaling micro-conference focus on scaling both upwards (many cores) and downwards (low footprint, energy efficiency) at all layers of the software stack. Our intent is to bring together application, libraries and kernel developers to discuss the scalability issues they currently face, and get exposure for the ongoing work on scalability infrastructure. It was held in August 29-31, in San Diego, California. LTTng 2.0 can be used with various tools which help digging through large amount of trace data, from high-level perspectives down to the details. This presentation will focus on the usability of LTTng, showing how the combined user-space and kernel tracers, high-level summary views such as LTTngTop, graphical analysis tools such as the Eclipse Linux Tools LTTng plugin, can be used to solve hard software problems."
