title = """
Linux Foundation Collaboration Summit 2011: User-space Tracing with UST
   - EfficiOS"""
full_description = "This presentation shows a quick overview of the features provided by the Userspace Tracer (UST), part of the LTTng project. It discusses the new LTTng and UST interface unification. It discusses the availability of the TRACE EVENT API to user-space applications in order to get feeback from the community. It concludes with a presentation of the UST roadmap. We are targeting the Linux tracing community and any user-space project that can benefit from this very low impact tracer which is entirely based on the Linux ABI available in user-space. In a collaboration perspective, an experienced developer audience is targeted in order to get feeback on the tracing infrastructure we are proposing and the TRACE EVENT API. We hope to get UST increasingly mainstream and bound with the Linux community. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
