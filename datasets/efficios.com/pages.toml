["https://www.efficios.com/blog/2013/10/21/lce13-lttng-monitoring"]
title = """
LinuxCon Europe 2013: LTTng as a new monitoring tool
   - EfficiOS"""
full_description = "In the past, much effort has been invested in high performance kernel tracing tools, but now focus in the tracing community seems to be shifting over to efficient user space application tracing. By providing joint kernel and user space tracing, developers now have deeper insights in their applications. Furthermore, system administrators can now put in place a new way to monitor and debug systems using a low instrusivness tracing system, LTTng. This presentation explains how LTTng can be used as a powerful monitoring tool for an entire farm of servers taking advantage of this year exciting new features such as network streaming and snapshot. This shows hands on how to leverage tracing in a production environment to monitor and debug system by showing use cases of real system using such a tools for monitoring. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
