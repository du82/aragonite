["https://www.efficios.com"]
title = "EfficiOS"
full_description = "We write open source tools and libraries to help you scale your application on massive multi-core systems, meet real-time constraints and identify faults. LTTng (Linux Trace Toolkit: next generation) is a kernel and application tracer for Linux. It gathers information about applications and important system events to help diagnose application, library and operating system misuses. We contribute to and maintain parts of the Linux kernel, namely the tracepoint instrumentation API, the membarrier(2) system call, and we actively work on the rseq(2) (Restartable Sequences) system call. The Common Trace Format (CTF) is proposed as a trace format that suits the needs of the embedded, telecom, high performance, and kernel communities. barectf (from bare metal and CTF) is a generator of tracers (ANSI C) which produce Common Trace Format data streams. Babeltrace is a trace reader and converter engine. It is a reference implementation of the Common Trace Format (CTF). The Userspace RCU library (liburcu) is a highly scalable LGPL synchronization library providing very low overhead and linearly scalable read-side synchronization, as well as efficient data structures based on RCU and lock-free algorithms. At EfficiOS, our main goal is diminishing the amount of time our customers spend identifying faults. We also enable our customers's applications to scale on massive multi-core systems, and to meet real-time constraints. We do so by implementing open-source tools, libraries, and by contributing to the Linux kernel. We help our customers tailor our open-source software to their needs through our development services. We offer training to help customers configure our software according to their deployment constraints. Contact us if we can help by improving our software, or by providing advice about its configuration and use. You may consent to allowing analytics supplied by Google. See our privacy policy for more information."
