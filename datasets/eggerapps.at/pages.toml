["https://eggerapps.at/postico2"]
title = "Postico 2"
description = "The native Mac app for PostgreSQL"
full_description = '''Postico 2 is a database app with a very strong focus on its core audience: people who use databases. Our customers range from researchers and analysts to app developers and students. Whether you want to enter data, search data, or perform SQL queries, Postico has you covered. Postico 2 is the next major version coming after Postico 1.5. If you'd like to know more about Postico 1.5, click here. Click a table in the sidebar, and see the data instantly. Add rows, edit them, or filter them. Powerful features like the foreign key picker or the row detail sidebar make editing all kinds of tables a breeze. Postico has a powerful graphical structure editor for creating and altering tables. Add a column, edit data types, set a default value. Columns, indexes and constraints are unified in a single editor, so you see everything at once. Postico now updates silently in the background. We know that you have more important things on your mind than dealing with software updates. So unless you disable automatic updates, Postico will never interrupt you with an update notification again. You can choose whether you want stable releases or development builds straight from our continuous integration system. The streamlined interface means that your servers are never more than two clicks away. Connection management in Postico 2 has been optimized for everyone, whether you use a single server, or hundreds of them: Postico tries to support all PostgreSQL-compatible databases. In addition to PostgreSQL, we have first class support for Amazon Redshift, Greenplum, and CockroachDB. Some databases like Vertica are supported only in a limited way: executing SQL is possible, but other features do not work. Postico now has a dedicated "Feedback" button in the toolbar to send feedback or to request support. Postico will include relevant version numbers automatically, and optionally even include a screenshot of the current window. You can send feedback anonymously, or you can include your email address if you want us to get back to you.'''
