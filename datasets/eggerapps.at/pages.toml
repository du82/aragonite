["https://eggerapps.at/jetread"]
title = "jetread"
full_description = 'jetread is a simple command line tool for macOS that allows you to read MDB and ACCDB databases from the command line. Download jetread.zip Usage jetread is a single executable. Just unzip it somewhere and execute it: ./jetread This will print basic usage instructions, which may or may not be accurate. To list tables in a database file, use the following command: ./jetread database.mdb list-tables To read a table use the following command: ./jetread database.mdb export TABLENAME You can also specify an export format: ./jetread database.mdb export TABLENAME -fmt csv >output-file.csv To export all tables, for example in JSON format, just skip the table name: ./jetread database.mdb export -fmt json >output-file.json Supported formats are csv, json, sqlite, mysql, postgresql For batch processing files, use xargs or a shell script like this: for mdbfile in *.mdb do ./jetread "$mdbfile" export TABLENAME -fmt csv > "${mdbfile%.mdb}.csv" done License etc. jetread is completely free to use, but you may not redistribute it without my permission. jetread is based on my proprietary library for reading MDB files. I made it for my personal use, and put it online because people keep asking for a tool like this. jetread comes with no warranty whatsoever. Use at your own risk! Questions? If you have questions or comments regarding jetread, feel free to email me: jakob@eggerapps.at Recent Changes Dec 18, 2024 Fixed a creash when exporting JSON Added support for UUID Modern quoting style for PostgreSQL export Oct 9, 2021 Universal build Improved support for arabic and some other code pages Fixed crash for some databases'
