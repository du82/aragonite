title = "MDB/ACCDB Viewer for Mac"
full_description = '''★★★★★ Easy! Highly recommended for light data. Thanks! Bykemut review for Version 2.2.5 from Mac App Store Malaysia ★★★★★ Works Great Works Great! Product description is accurate, program is clean, fast, and easy to use. 4 stars because it’s rather pricey. It’s a viewer, not an editor... ByGingy22 review for Version 2.2.5 from Mac App Store Canada ★★★★★ хорошо сделана Единственная программа, которая позаолила выгрузить данные в SQLite без ошибок и корректно распознав типы полей. Стояла задача выгрузить данные из древней базы MS Access в которой поля бы ли именованы по-русски, таблиц около 30, с данными 5-15 тысяч в каждой. Программа справилась на отлично. Еще отмечу, что работает быстро (пробовал некоторые другие). Ставлю 4 звездочки, не 5 потому что хотелось бы гибкой настройки выгружаемых полей. ByElOtro review for Version 2.2.5 from Mac App Store Russia ★★★★★ Indispensable pour récuperer sous Mac les fichiers Mdb Remarquable tout simplement : J’ai pu sans problème récupérer un gros travail fait en 2000, sous Access, dans l’environnement Windows XP !! Tout est passé sous Excel sans anicroche et en toute simplicité. Pour info : je suis sous environnement El Capitan, en bêta de surcroit, et je travaille avec Office 2016. Donc impeccable. Ne pas tenir compte de l’avis indiquant que la récupération des vieux fichiers Mdb ne se fait pas. Manifestement, la nouvelle version a corrigé cela. Excellent rapport qualité / prix donc, vu l’ampleur du travail récupéré. Merci au développeur. ByAloévera review for Version 2.2.5 from Mac App Store France ★★★★★ Fantastic App! As one may imagine, there aren't a lot of reasons a mac user would be looking to actively work with MDB files. However, I have a client who wanted a legacy Access database converted to a MySQL based web application. It was an "old version of Access" - the client had no idea, and the current version of Access wouldn't open it up. I downloaded this app to see if I could at least view the data. I saw the "export as SQL" feature but honestly I haven't had much luck with those in the past - especially from MS applications. Well, I can say this was worth probably twice what it costs. It opened the 150MB .mdb file in about two seconds, and exported it to a full MySQL dump in about 3 minutes. I imported the resulting SQL file into MySQL with no errors, no data loss, and from what I can tell all data types/keys in place. Well done! Kmulf review for Version 2.2.5 from Mac App Store United States ★★★★★ Perfect Just perfect, did EXACTLY what it said it would and better yet, exactly what I needed it to. Thanks Jharder22 review for Version 2.2.5 from Mac App Store United States ★★★★★ Good A database with filename extension “accdb” was converted into SQLite successfully by MDB ACCDB Viewer. I believe it deserves its price. Magic Kyle review for Version 2.2.5 from Mac App Store China ★★★★★ Super Produkt Schnelle Konvertierung und auch bei mehr als 65’000 Zeilen in einer Tabelle, bei mir problemlos möglich. WYK65 review for Version 2.2.5 from Mac App Store Switzerland ★★★★★ Did what I needed it to do. I don't have access, but needed to read, sort and search an access database file. I bought the program and within five minutes of installing it had used it to open the Access database, save it as an Excel worksheet, then opened the Excel worksheet with Filemaker Pro 12. FMP instantly converted it into a FMP data base, and I sorted it by date (the date conventions worked) and found what I needed. It was worth the $18 to me on a Saturday night at 11pm! I wish I had a more complete solution to work with Access datafiles on the Mac, but you take what you can get. My thanks to the developers of MDB ACCDB Viewer. AvroClunk review for Version 2.2.5 from Mac App Store Canada ★★★★★ Don't waste time with cheap imitations THANK YOU. This app is a VIEWER, and helped me export my files to a more friendly format since I don't use Access anymore. I tried a cheaper app, but didn't work. This app was lightening fast and all of my data came through beautifully. I don't really know that I will use the app frequently, but since it did exactly what I needed it to do, I am able to enthusiastically recommend it. Gadget Novice 148 review for Version 2.2.5 from Mac App Store United States ★★★★★ This app is a God send... From time to time I get the request to convert an Access database to a web application. It's always been a royal pain to keep an Access license handy + Windows license so I can run Virtualbox or Parallels to get at it. Then, pulling the data out and transferring it was equally time consuming. None of it was rocket science but given that I'm not a fan of Access to begin with, I JUST WANT THE DATA OUT. This app does exactly what I needed…gives me the database tables and lets me export them in several formats. Loving it. Also, had one issue with the export of a table. Contacted the developer and had a response same day. Turned out that the exact issue had been addressed by the 2.2.5 update and I was running 2.2.4. Thankful for the quick response and that my problem was already addressed. I'm a fan. Keenehockey review for Version 2.2.5 from Mac App Store United States ★★★★★ 同種アプリの中で、Unicodeの扱いが最もまとも 他のアプリも色々と試したが、日本語や中国語を含むAccessデータをきちんと表示できたのは、これだけだった。比較的高めの値段ではあるが、それだけの価値は十分にあると思う。また、ファイルコンバータとしての機能もシンプルで使いやすい。あとは、ビューワとしての使い勝手をもう少し向上させてくれたら完璧。 Astral_flakes review for Version 2.2.5 from Mac App Store Japan ★★★★★ MySQL Export Works great for viewing data, however when it comes to exporting into MySQL it's rather lacking. It produces chunk inserts (where it inserts the entire contents of a table in one insert as opposed to many), however there is no way to control this. It's all-or-nothing and in all of my uses I could not load the resulting SQL file into MySQL due to max_allowed_packet being exceeded. Increasing this value is not an option so the ability to control this prior to export would be the only way to make it useful. If it weren't for this, I would give the app 5 stars. App Addicted2 review for Version 2.2.5 from Mac App Store United States ★★★★★ Works as advertised. No issues. Installed to view large .mdb files with 20+ tabes of up to 4,000 rows each. Program displays well, search and export functions all work well. JSConsult review for Version 2.2.3 from Mac App Store United States ★★★★★ Works perfectly! Obviously if you have a VM with Windows Access and need to view / select / edit Access files, then you don't need this tool. But if you have a Mac and simply need to view Access data, and/or need to convert Access data to another database format quickly and easily, this tool is it. And the price couldn't be better. Out of the blue I had to convert a fairly large Access db to SQLite. I toyed with the idea of writing a quick converter, but decided to check online first. Found this gem and had it converted in minutes. It saved me time and was well worth the cost. DTaylor714 review for Version 2.2.3 from Mac App Store United States ★★★★★ It ok in a pinch but not a tool to depend on. Has potential. Be nice to query select data (joins) and see table schemas (type/lengths). If you need to simply view the contents of a table, then this works fine. Price vs value a bit off but my opinion is based on only 5 minutes of usage. The time it takes to export to a file and do analysis is the same as loading my vmware copy of Windows/Access and hit the data directly. LouieAvila review for Version 2.2.3 from Mac App Store United States ★★★★★ Great App A client has an ancient website that uses classic ASP and a local Access database, and since I've moved to Mac I used to have to fire up my old laptop to view any of the data. I had been flapping about how to send him a table export this morning, but after a quick search this looked to be just the ticket. A quick install later, and within 2 minutes I had exported a CSV, converted this in Google Docs and sent it to him as an XLSX doc. Superb! RJK1974 review for Version 2.2.3 from Mac App Store Great Britain ★★★★★ Great Customer Service I have been using this product to migrate a variety of Access dbs to .csv files. When I hit a 'problem' database (which turned out to be in the ancient Access 2.0 format) the developer very quickly converted it for me. Great customer service. Howard Fraser review for Version 2.2.3 from Mac App Store Australia ★★★★★ Did what I needed it to do Worked like a charm, otherwise would have needed to recreate 377 records of data. Jalh3 review for Version 2.2 from Mac App Store United States ★★★★★ Fa quel che deve e lo fa bene... Come molti mi ritrovo spesso a manipolare file di Access, ovviamente per portarli verso altri formati, lontani da quel dinosauro che un tempo era un database ed oggi è uno zombie ;) Dopo aver provato altre soluzioni simili, sempre con qualche problema, ho trovato in questa ciò che cercavo, una semplice e pulita accessibilità ai dati e la possibilità di portarli in formati più utili e maneggevoli. Da notare che apre benissimo anche archivi che nelle intenzioni di chi li ha creati avrebbero dovuto essere protetti da combinazioni di accesso vincolate e che in ambiente Win costringerebbero a modifiche dell'origine dati o altri espedienti, qui invece semplicemente si aprono… in questo modo mi sono liberato dell'odiosa macchina virtuale Win che mi serviva solo per accedere a database Access. Sarei disposto a pagare anche di più se una futura release avesse la possibilità di vedere almeno un minimo di struttura tra tabelle ed eseguire almeno una semplice query precedente all'esportazione. Roberto MDA review for Version 2.2 from Mac App Store Italy ★★★★★ Excellent tool This tool is excellent and most suitable for those who have to work with MS-Access files from their Mac. It does not only offers you to view MS-Access tables but also to convert them into SQL (PostgreSQL, MySQL, SQLite). This saves you from starting MS-Access on a Windows PC and helps you to transfer the data to professional databases systems. I bought an early version and keep it up-to-date because it saves me lot of time. Andrejjh review for Version 2.2 from Mac App Store Belgium ★★★★★ İyi bir uygulama Hata vermeden tabloları görüntüleyebiliyor. Bu bile büyük bir kazanç. Keşke kendi içinde query yapabilen uygulamalar da olabilse. İlişkili tablolar olduğunda bir tablodan öbürüne koşup durmak gerekiyor. Zynxth review for Version 2.1 from Mac App Store Turkey ★★★★★ Very useful app +++ ….YES! Multiple table exports are now supported. Does the job very well. Excellent speed on large db's >1g...! Also great support….!!! Zr0s review for Version 2.1 from Mac App Store Canada ★★★★★ Easy conversion Perfect if you are given an Access file from someone who doesn't know how to save it in any other format, and you need to import the data into a program on a Mac. Once open for viewing, the data can be exported in a variety of formats. Njwalrus review for Version 2.0.4 from Mac App Store United States ★★★★★ Would really like to modify Great app. But warning: it's only a VIEWER. You can't MODIFY or INSERT data. I was hoping to edit Access files for a project for school. I was able to view it, which was great, but I could not do the assignment so I dropped $19 for nothing. Maybe you guys can make the update that will modify accdb files for Mac? Ycontrol500 review for Version 2.0.4 from Mac App Store United States Unfortunately modifying ACCDB files is very difficult to implement. Please contact Apple for a refund if MDB Viewer does not meet your expectations. – Jakob Egger ★★★★★ Good ! It is work well. The speed is fast. And really easy to use that just drop MDB into it. thanks! Tangdaoyan review for Version 2.0.4 from Mac App Store China ★★★★★ Perfect for my needs. Excellent software as well as quick and friendly customer support! I purchased this with some hesitation due to the price. However the reviews were great so I took the plunge. In reality, the price is not bad for this type of software. MS Access was the last piece of software I needed to dump before I could lose Parallels and Windows on my iMac. I run R for statistical analysis and needed a Mac-friendly way to export MS Access files to CSV for import to R. This software is extremely fast and reliable for doing just that. The other exports work seamlessly as well. The CSV export allows you to export each table in your MDB separately (not currently all at once). The Excel export will give you one workbook with different sheets for each of the tables in your MDB. I havent messed with the other export options yet. The only issue I had was not at all related to the software but the issues inherent in CSV files (quoted strings and commas in text fields), which caused my columns to be messed up on export to CSV. Again, this is not an issue with the software, just with my data and the CSV file type. I emailed Jakob to see what was up with this and he responded within a half an hour with a friendly and helpful response. For the time being, any tables I have that have quoted strings are getting exported to Excel, I remove the quotes with a find/replace, and save as CSV. I had to do this exporting directly from Access anyway, so it is still a huge time saver. Bye bye windows! Lepromatous review for Version 2.0.3 from Mac App Store United States ★★★★★ So easy even I could use it A client sent me an Access database file and since I don't have Access I could not open it. Found this app and decided to take a chance. It worked perfectly and easily. I was able to a) view the file using the viewer, and b) export it to Excel. In seconds. I'm not an Access user or dBase expert, but this app did what I wanted it to do. Staceybai review for Version 2.0.3 from Mac App Store United States ★★★★★ Fantastic Utility I've been one of likely many folks who have lamented the lack of a good Access DB conversion tool for mac. This is exactly what I've needed for the past year. Excellent app. Simple and straightforward. It's best feature is the ability to export to SQL or SQLlite. If I could give it 6 stars+ I would. Josh Lehman review for Version 2.0.3 from Mac App Store United States ★★★★★ E un pacco Legge solo gli oggetti tabella all'interno del file .mdb A cosa serve un file Access in cui non si possono eseguire query?? 15 euro buttati. Grrr... review for Version 2.0.3 from Mac App Store Italy ★★★★★ Fait ce qu'on attend de lui J'avais une base Access d'un client dont je devais récupérer les contenus des tables pour import dans un autre outil. En moins d'une minute j'ai pu exporter (en format Excel en l'occurrence) la dizaine de tables sans problème. Antoine Comiti review for Version 2.0.3 from Mac App Store France ★★★★★ Great app! This is a great App. I got a 2GB Access DB, and this app was able to convert it to csv and SQLite without a problem and in few minutes. I strongly recommend it!!! GvT76 review for Version 2.0.3 from Mac App Store Mexico ★★★★★ Export options to SQL and SQLite makes this a must have I had to open up an '''
