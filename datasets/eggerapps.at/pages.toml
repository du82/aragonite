["https://eggerapps.at/postico/v1.php"]
title = "Postico – a modern PostgreSQL client for the Mac"
full_description = "Postico requires macOS 10.10 or later. Version 1.5.22 was released on Mar 21, 2023. Read the Changelist. Also available on the Mac App Store. We also offer Legacy Downloads for older versions of macOS. PostgreSQL is an absurdly powerful database, but there's no reason why using it should require an advanced degree in relational theory. Postico provides an easy to use interface, making Postgres more accessible for newcomers and specialists alike. Postico will look familiar to anyone who has used a Mac before. Just connect to a database and begin working with tables and views. Start with the basics and learn about advanced features of PostgreSQL as you go along. Postico is an intuitive app for looking at data. Filter rows, sort them, rearrange columns. You can examine long text or images conveniently in the sidebar. Even related rows from referenced tables are shown. Edit rows directly, or use the sidebar — a great choice for long text. You can even change multiple rows at once. Batch saving (with SQL preview) lets you commit changes to multiple rows in a single transaction. Add and remove columns, rename them, change types. Modify tables and views without having to remember the ALTER TABLE syntax. The unified structure editor displays everything you need to know about a table. Comments and constraints are shown right next to the columns. When you need hard questions answered, PostgreSQL offers many advanced tools for data analysis: Common table expressions, recursive queries, filter aggregates, window functions. To access these tools, Postico sports a powerful query view with support for multiple result sets. The editor has all the standard features you expect, like syntax highlighting and automatic indentation. Native Experience Native Cocoa controls ensure consistency. Keyboard shortcuts follow platform conventions. Commands like undo/redo or copy/paste work just as you'd expect. And of course, Postico plays nice with other apps and services you use every day. Vibrant Design Postico was designed from the ground up with Apple's modern design language in mind. Its high resolution artwork looks great on Retina displays."
