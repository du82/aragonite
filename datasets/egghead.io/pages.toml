full_description = "The difficulty of managing state is one of the primary reasons our applications become so complex. We try and manage this complexity with a lot of booleans, somewhat semantic variables like isLoading, wasFetched, and hasError, and over-engineered systems that are still full of bugs. Surely, there's a better way. State machines formalize how we define and transition through the states of our application and give us ultimate control of the most complex parts of our apps. In this course, we will explore the problems state machines purport to solve, like boolean explosion. We'll try to solve it our own way first, get so far, and then demonstrate how state machines get us all the way. After that, we'll dive into the XState library, JavaScript's premiere state machine library, to learn its API and how to use it to solve our problems. By the time you're done taking this course, you should have a solid education about state machines and be able to start applying them. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public."
