ary. And here, we would provide lodash dot is equal. Now let's [01:59] see this in action. Let's copy the initial value of the item signal and let's replace it within the clear items method. And when we will call the clear items, we're basically going to reset the signal's value into the initial value. Now remember that the item signal is [02:18] being used within the console effect within the components. So whenever we change the value of the item signal, the effect should run and that would be reflected by the console log. So when equal is set to compare only the values of the signal but not the reference and [02:38] we clear the items which basically replaces the underlying items value we can see that the console log hasn't been executed. However, if we comment out the equality function and that would go back to the object dot is which compares the reference and we would clear the [02:58] items, we can see that the console log, the effect of our signal has been executed as many times as we have run the clear items function, which changes the reference."
