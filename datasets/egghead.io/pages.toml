title = "Build a Real-Time Data Syncing Chat Application with Supabase and Next.js | egghead.io"
description = "Supabase is an open-source tool for rapidly building application backends with real-time data and authentication. In this course, you'll learn the funda..."
full_description = '''Supabase is an open-source tool for rapidly building application backends with real-time data and authentication. In this course, you'll learn the fundamentals of Supabase. You'll learn how to model complex data using PostgreSQL and SQL, build authentication flows with Oauth, and add real-time data to a Next.js application to build a fully-featured chat application, similar to Discord. The chat app will have different "channels," which will be powered by data inside of Supabase. Users can visit these channels and write messages, which will be sent in real-time to other current users of the platform. After this course, you will be able to model real-world scenarios in actual relational databases, understand how to manage real-time data, and leverage key functionality provided by Supabase, such as authentication, instant APIs, and real-time subscriptions. Whether you are just starting out with frontend engineering or you are a seasoned veteran, this course will provide a strong understanding of Supabase. This course uses @supabase/supabase-js": "^1.4.2". This course will help you gain exposure to a timeless technology: relational databases, via Supabase's PostgreSQL support. To effectively use Supabase, you need to understand the basics of SQL or Structured Query Language, and how it can be used to work with relational databases. In this talk, we'll look at the basics of SQL — how to query for data, how to insert and remove data, and how structured databases are organized using tables, rows, and columns. After completing this course, you’ll be ready to tackle more challenging SQL topics like proper data modeling, normalizing data, and exploring different database types. The course starts with a fresh CRA and then moves forward to setting up & consuming the GraphQL subscription. In this course, we're going to learn how to harness the power of Next.js + TypeScript and how to work with Netlify in order to deploy our site for others to enjoy! After completing this course, you’ll be ready to tackle more challenging SQL topics like proper data modeling, normalizing data, and exploring different database types.'''
