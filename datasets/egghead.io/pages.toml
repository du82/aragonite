["https://egghead.io/podcasts/jason-lengstorf-on-gatsbyjs"]
title = "Jason Lengstorf on GatsbyJS | egghead.io"
description = "Today’s guest is Jason Lengstorf, a developer on the GatsbyJS team. Today Jason discusses his career path, what Gatsby accomplishes, how Gatsby compares with other static site generators, what's coming up in Gatsby 2, and what it's like to manage a large open source repo."
full_description = "Jason didn't start his career even remotely in the tech field. He was a musician.Jason's band didn't have much money, so he learned design to make merch, learned some markup to edit their myspace, eventually learned to build a website for them, then learned backend so his bandmates could upload images and post things. Jason talks about Gatsby's plans to compete with the more seamless WordPress model. He also talks about gatsby's differences from WordPress and the use cases for each service.One of Gatsby's strengths is how good it is for learning Javascript and React, you can quickly go from the command line to getting stuff on the screen in two minutes, much like create-react-app, the differences is that with Gatsby you get a data layer and a good deployment story. Finally, they talk about what it's like to manage a repo that has 964 contributors, 5500 commits, and 936 issues. It was more chaotic in the early days, but they have brought on some people who are helping manage it and are defining better processes. If you are interested in learning Gatsby, they have recently put much work into revamping their official tutorials.Check them out here John Lindquist: Alright, I'm here with Jason today. Jason, why don't you go ahead and introduce yourself. Jason Lengstorf: Sure. Yeah, my name is Jason Lengstorf. I am a developer on the Gatsby.js open source framework. And I've been doing a lot of work on the developer relations part of things. John Lindquist: Awesome. So, tell me a bit about your history as a developer and how ... What's your path from knowing nothing to, now, working with Gatsby? Jason Lengstorf: I started out wishing that I was a musician, right? I wanted to be a rockstar. So, I dropped out of college to be a full-time musician. And because we were a band, we didn't have any money. Jason Lengstorf: So, I learned design so that we could have merch and posters. And then, I learned web design a little bit so that I could customize our Myspace page. And then, I learned how to do a full website."
