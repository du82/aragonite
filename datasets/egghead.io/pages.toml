["https://egghead.io/bulk-fixing-ai-generated-code-errors-with-reasoning-models-and-cursor-composer~yb1h5"]
title = "Bulk Fixing AI-Generated Code Errors with Reasoning Models and Cursor Composer | egghead.io"
description = "expert led courses for front-end web developers and teams that want to level up through straightforward and concise lessons on the most useful tools available."
full_description = '''AI-generated code often comes riddled with errors, especially TypeScript errors. Trying to fix these one by one with in-editor AI tools (like Cursor's "Fix with AI") can be slow, frustrating, and sometimes even introduce new problems. The fixes can be too localized, missing the bigger picture. This lesson demonstrates a more efficient workflow: leveraging the power of reasoning models (like those found in AI Studio or advanced ChatGPT models) to fix errors in bulk. Here's the process: Identify All Errors: Use the "Problems" panel in your editor to get a comprehensive list of all errors in the file. Don't try to fix them individually yet! (Use Cmd/Ctrl + Shift + P, then type "problems".) Gather Context: Copy the entire file's code. Copy the entire list of errors from the Problems panel. Prompt the Reasoning Model: Paste both the code and the error list into a reasoning model. Your prompt should be something like: "Please fix all of these errors and rewrite the entire file with the corrections." The key is to give the AI the full context. Wrap your code with XML tags to help the AI recognize it. Iterate (if needed): Copy the corrected code back into your editor. If a few errors remain, now it's time to use in-editor AI tools (like Cursor's Composer or "Fix with AI") for the final cleanup. These tools are better suited for small, isolated issues. Provide Additional Context (for Stubborn Errors): If a specific error persists (e.g., related to a library like yargs), provide even more context to the AI: Include links to the library's documentation (NPM page, official docs). Use Cursor's @ feature to add specific files or documentation to the context. Make sure to test! Run npm test or whichever testing command you're using for this project. Why this works: Holistic Understanding: Reasoning models excel at understanding the relationships between different parts of the code. They can see how a change in one place affects others, leading to more consistent and correct fixes. Efficiency: Fixing multiple errors in a single pass is much faster than addressing them individually. Reduced "Whack-a-Mole": Fixing one error often reveals another. Bulk fixing with a reasoning model minimizes this frustrating cycle. This lesson teaches you a practical, powerful technique to tame AI-generated code and get it working quickly, even when it arrives full of errors. By combining the strengths of reasoning models and in-editor AI, you'll become a more efficient and confident developer.'''
year_published = 2025
