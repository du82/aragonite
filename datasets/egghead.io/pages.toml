["https://egghead.io/courses/apply-redux-to-a-modern-react-hooks-application-8a37"]
title = "Apply Redux to a Modern React Hooks Application | egghead.io"
description = "Redux was announced back in 2015 and immediately took off as the de-facto state management solution for React. As it gained widespread traction, it also..."
full_description = "Redux was announced back in 2015 and immediately took off as the de-facto state management solution for React. As it gained widespread traction, it also became clear that in many cases it was brought into applications prematurely. The community in some ways started to push back on its use and recommended the built-in setState method as an alternative. Several other state libraries also started popping up around this time. Finally, as React Hooks were announced with a built-in useReducer method it appeared that Redux's time was up. However, these claims have proven to be premature. Redux is not dead and instead remains React's most popular state management library*. Recent updates to redux exposing a hooks-based API address some of its most serious drawbacks and make it even more appealing. This course will show you how to apply redux to a modern react hooks application. I hope you leave this course with a continued appreciation for React Hooks and renewed enthusiasm for Redux. Redux is still a very popular and effective way of managing state in React. If you used Redux in the past and maybe found it too difficult to work with and too complicated, I don't think you'll feel that way after trying it with Hooks. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. We start by defining our state transitions using the State ADT, starting with simple transactions and using them to create the complex transitions typical of any game. In this course, Dan Abramov will show you the fundamentals of Redux, so that you can start using it to simplify your applications. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. We start by defining our state transitions using the State ADT, starting with simple transactions and using them to create the complex transitions typical of any game. In this course, Dan Abramov will show you the fundamentals of Redux, so that you can start using it to simplify your applications."
