full_description = "Signal values can be updated using the set or update methods. When updating signal values, it's crucial to follow immutable practices. [00:00] You can update the signal value in one of 2 ways via the set method and the update method. You want to allow the user to change the name filter signal value. So let's provide update name filter method on the component class, and let's create the value of type string parameter. Now this [00:19] dot name filter dot set will replace the old value with whatever is the new value and this dot name filter dot update will accept a callback which injects the previous value and here we could create a new value on top of the old one. Now in [00:39] case of just a primitive value, which is a string, we can just use the set method. So we'll just drop this one and we'll replace it with the value parameter. We of course need to create an input to make it editable so let's do a typeText input. [00:59] Let's provide what the value is for this one and it's going to be basically the current value of the name filter and let's listen to the input DOM event and here we would call the update name filter method passing it what the dom event is. However, [01:19] due to the mismatch of types, let's update that the event is going to be of type event And now let's update that. We're going to take the event dot target. Let's assert that it is an HTML input element and that we want [01:39] to access the value attribute on top of that. So right now, if we filter the value like a, we can instantly see that the value of name filter signal has been updated and it caused the filter items computed to reevaluate and finally display Andy and Charlie on the screen. Now [01:59] let's update the value of the item signal. Let's create clear items method which is going to run this dot items, signal and set. It's important to know that whenever you want to update an object value, you should do it an immutable manner that is by passing a new reference to a new created object [02:19] and, of course, an array is an object. Otherwise, if you mutated the value of an object, Angular would not reflect the change for instance. It would not update the template that is using the signal value. So in this case, if you want to clear, let's just provide a new array. If you want to reflect the change, we should also [02:39] create a button that would invoke the method and that would be clear items for the on click and clear items as the button label. Now we might get a type error over here. And we can see cannot read properties of undefined reading name and that's because right now we have an empty array and [02:58] typescript didn't figure out that last item could actually be undefined. So we will put the optional chaining over here. So right now when we run clear items we actually get an empty list because we have updated the item's signal value. Now the signal will notify its direct dependent, [03:18] the filter items computed, which in turn will notify its direct dependent, the visible items computed, and that will cause the template to refresh. Now let's create a way to add a new element to the array. So let's create an append method which accepts a name parameter of type string. And we'll call [03:38] this dot items dot update because in this case, we want to rely on what the previous value of the signal was, and we will return a new array because we don't want to mutate the existing object. So let's spread the previous array value, and let's put a new object. Now TypeScript is throwing a [03:58] compilation error saying that the new empty object is obviously missing the expected ID and name properties. And that's because the items signal has the type which is a writable signal, meaning that we can run either the set or update method. Each signal is a writable signal [04:17] unless it's a computed or unless it's a read only signal. But the value is expected to be an array and the value of the array is expected to be an