ms, no HTML page is generated for authors, and so these pages don't exist. If [02:00] we look at the log for the Vercel deployment, you can see that the slug pages here marked with this black bullet, which is pre rendered static HTML. The first and second post were created, whereas for the authors, this is a dynamic server rendered page. And so if the author page is server rendered, why are the authors not found? Well, [02:20] let's try to visit the key static admin UI on the deployed site. And whoops, you can see that we have 0 posts and 0 authors. The key static config is still red and the content types are found, but the content directory, which is our file system locally, doesn't exist on the deployment. And so key static cannot [02:40] find any posts. Right now, key static is set up to use the local storage strategy, which means that it's reading and writing directly on the file system. And the content directory, which is where we've been storing our content locally, well, this directory does not exist on the Vercel deployment instance. And so we [03:00] have two ways of fixing this. The first one is to change key static storage strategy from local to something like cloud or GitHub so that our content reads and writes can be operated directly on the GitHub repo. And the other option, if you ever only want to change content locally and not change modes to GitHub or cloud, is to use generate static [03:20] params on the author's slug page to make sure that each single author is statically generated just like it's the case for the posts. And we'll be covering these two options in the next segments."
