full_description = "Almost every React application needs to fetch data from a server and cache the result between renders. Traditionally, in-memory API Caching is something that has been done in React applications either on a per-component-level, which lead to application state running out of sync, or using a global state like Redux, which required a lot of hand-written code. RTK Query is part of the official Redux Toolkit and provides an application-global API cache that abstracts most of that hand-written code away, leading to a lot more readable code bases. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. Learn how Redux Toolkit simplifies the process of setting up and maintaining your redux application when building slices, reducers, selectors, and thunks. In this course, Dan Abramov will show you the fundamentals of Redux, so that you can start using it to simplify your applications. Best practices for testing redux applications have changed dramatically over time. This course aims to be a comprehensive resource for those seeking to test their redux apps. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. Learn how Redux Toolkit simplifies the process of setting up and maintaining your redux application when building slices, reducers, selectors, and thunks. In this course, Dan Abramov will show you the fundamentals of Redux, so that you can start using it to simplify your applications. Best practices for testing redux applications have changed dramatically over time. This course aims to be a comprehensive resource for those seeking to test their redux apps."
