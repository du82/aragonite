["https://egghead.io/podcasts/12-factor-javascript-applications-using-docker-with-mark-shust"]
title = "12-factor Javascript Applications using Docker with Mark Shust | egghead.io"
description = "John Lindquist has a conversation with the Mark Shust, an expert with Git and Docker. They talk about the 12-factor style of building an application and why devs should have a standard method."
full_description = '''John Lindquist has a conversation with the Mark Shust, an expert with Git and Docker. They talk about the 12-factor style of building an application and why devs should have a standard method. Often developers don’t have a standard process with git. Mark talks about the gitflow workflow, a way of working with features and managing how that feature gets merged into the code base. Though due to working with so many branches gitflow has its complexities. So, Mark trimmed it down and created a new workflow he calls git ship, which is gitflow without the development and hotfix branches. Before Docker, Mark was running through a dependency hell. Though with Docker Mark was just able to deploy an image and not have to worry about anything. Docker is like a VM but without all the memory overhead! You can even deploy as many images as you want at a time. You can run Postgres, Node servers, and also use entirely different languages in each image! Check out Mark’s course which covers all mentioned topics, Build a Twelve-Factor Node.js App with Docker John Lindquist: All right, I'm here with Mark Shust. Mark, why don't you go ahead and introduce yourself? Mark Shust: Sure. I am a full stack developer. Mainly have a background in PHP and e-commerce. Yeah, I work a lot with Node, and Git, and Docker. Mark Shust: But I work on, actually, a side project that runs with Meteor, React, and Node, so some experience there. John Lindquist: That's an interesting stack. I just wanna say first off that I absolutely love your 12 Factor course that you're releasing, or that was released I guess. It's just like the perfect, for me, for someone who's a front end JavaScript developer, and who's not very confident in the whole Docker. I use Git, just the basic Git push stuff. I don't follow really a lot of the guidelines, but just to have something really laid out for me like, "here are the best principles". Then you go and show it, like that just ... Anyway, thank you for making this. Mark Shust: Sure, yeah. I've always been a big thumper of best practices. I think they really help streamline and guide you in how to do things.'''
