title = "Work with Zod Literals and Enums Effectively | egghead.io"
description = "In this lesson we make string-based schemas more specific using Zod in TypeScript. We focus on defining allowed values for a room type, showing how to u..."
full_description = '''In this lesson we make string-based schemas more specific using Zod in TypeScript. We focus on defining allowed values for a room type, showing how to use literals and enums effectively. Zod's z.literal method allows us to specify a single allowed value for a string schema. For example, if we want to define a room type as "premium" and make it backward-type-safe in TypeScript, we can use z.literal("premium") to ensure that only this value is valid. z.enum lets us define a set of allowed string values. This is useful when we have multiple options for room types, like "standard", "premium" or "childrenFriendly". z.enum creates a union of TypeScript-compatible string literals, making it easy to validate against multiple values. Zod enums can be used to extract or exclude specific values from the enum. Finally, zod's z.nativeEnum a native enum creates an equivalent of TypeScript's native enum ("real enums", we could say). [00:00] Sometimes we want to make our string-based schema more specific, but not by running a custom function invocation in runtime, but just by providing what are the allowed values within a string schema. So here we've got a room type which has a premium value and we will see the literals, enums and native enums in action. So let's first run this file against ts-node to see that here everything is valid since The value is premium and currently our room type is just a string schema. So first one is going to be a literal. So this is Z.literal and here since our value is a premium, then we're just going to put the premium over here and let's see what is going to be the inferred TypeScript type. [00:51] So this is going to be z.infer of type of whatever the schema is. And here what we can see that it's not just any string, but it's the premium value. So let's also put this standard room literal over here. So this is going to be this one. Let's save the file. [01:11] Let's run the validation and we will see that everything is valid over here. So z.literal is being used when we have a single literal. So this is important. It's not for providing a whole set of literal, but just a single one. So let's now use a whole set of literal values.'''
