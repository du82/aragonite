full_description = "In this video, you'll connect your project with Keystatic Cloud, so that content can be created and edited directly from the deployed URL. [00:00] Let's enable remote collaboration on our KeyStonec site and allow people to log in the deployed URL here and allow team members to create or edit content without setting up the site locally. Their changes are going to interface directly with the GitHub repository. In this video, we're going to connect our project with KeyStatic Cloud, which is the easiest way to get set up. [00:20] I'll visit keystatic.cloud, and you can see that here I'm already logged in with my account. But the first time you visit KeyStatic Cloud, let me visit it incognito. You'll be invited to create an account with your GitHub account or email and password. Creating an account is free. And once you're set up, you'll be taken to your dashboard where you can add and manage teams within [00:40] which you can add and manage projects. So pretending I have a fresh new account, I will add a team. I'll call this team Simon Swiss and add the team. And you can see that it has 1 user, myself, and 0 projects at this point. And here, I will add a project so that we can connect our website. The first time you connect [00:59] KeyStatic to a GitHub repo, you'll likely need to install the GitHub app. This is going to take you to a GitHub account. So I wanna connect this to Simon Swiss. And then you can select what repos you would like to authorize. So you can authorize all repos, but if you wanna be a bit more defensive, you can say, hey. I only want this egghead key static next JS [01:19] plug project, which is the one we want to connect. And then install and authorize. And excuse me while I verify the authentication. There you go. I've done it from my phone. So now I am redirected back to KeyStatic Cloud. And you can see my organization or user account is available here. Nice. And because I've only allowed the GitHub app to [01:39] have access 