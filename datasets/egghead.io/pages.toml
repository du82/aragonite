full_description = "In this free collection on Facebook's new state management library, we'll get started using Recoil in our React applications and then delve into various common use cases that we may encounter in the field. We'll start with the basics of state management in Recoil: the Atoms and Selectors. Then we'll dive further into the Selector API, an important part of the library. Along the way we'll learn different strategies for handling synchronous and asynchronous Selectors. An efficient and practical course to learning Recoil. The Recoil version used in this course is ^0.0.10, and the latest version is 0.3.1, yet this is still a great introduction to understanding the core functionality of Recoil. As of 0.3.1, there are no major breaking changes. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. In this collection, you'll create a simple game with React using Recoil, to explore how you can share and update state across an app. This is a series of videos where you'll find part interview and part screen share with experts. They focus on React, but the underlying principles are valid for UI work in general. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. In this collection, you'll create a simple game with React using Recoil, to explore how you can share and update state across an app. This is a series of videos where you'll find part interview and part screen share with experts. They focus on React, but the underlying principles are valid for UI work in general."
