nd so now inside my content folder and authors, I also have Gina. Alright. So we set up locally, but now we need to make our deployed Vercel instance aware and enabled [04:18] for this GitHub mode. Before I do, we do not want to commit our dot env. This is a local thing we're gonna copy over. So in the git ignore file, I will add dot env. And so now I will commit the changes that changed the mode to GitHub. Make sure the dotenv file is not part of your changes. [04:39] And let's push that. That's going to trigger another build in Vercel and oops, you can see we have an error. What's going on? So if we check the logs, you can see that we're missing required config and it's telling us to copy the environment variables. And that's actually exactly what we should expect. And [04:59] so like I said, we did not commit the dotenv file to GitHub, but in Vercel, in settings and environment variables, we will copy and paste our values from the dotenv file created locally. So this is great UX by Vercel. You can copy the entire dotenv file and paste it all in [05:18] the first field and it's going to create the individual key value pairs as needed. I'll save this. The variables have been added successfully. And so I need to go back to deployments and we're going to trigger a new build. So redeploy. And hopefully this time, because of [05:38] the environment variables in place, the build will succeed. Alright. Nice. The deployment has completed. You can see we have Gina as a new static HTML page. And let's go visit the production site and verify that we also have Gina as an author and the page works. Perfect. And let's visit the key [05:58] static admin UI in production. This is the first time I visited on the deployed site. So again, I have to log in with GitHub. You won't have to do this after the first time. And here we are in GitHub mode in production. So this time, I will do changes directly to main. I'll create a new post called YOLO [06:18] from prod, shipping to prod fro