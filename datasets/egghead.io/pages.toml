title = "Henry Zhu, Maintainer of Babel | egghead.io"
description = "Today, Henry Zhu, the lead maintainer of Babel, discusses what it's like to work on a large and important open source project. Henry gets into how Babel receives funding, how corporations are involved in open source, stewardship of an open source project, mental and physical health, and not compromising his values."
full_description = '''Henry Zhu is currently a steward for Babel, and today he'll be discussing the management and lifestyle side of working on an open source project full-time. The financial side to open source is interesting. Henry talks about where he gets his money and how he can be financially independent while still working on open source full time. Most of the money comes from donations through Open Collective and Patreon. A lot of the donations come from users, but corporations do donate as well. Henry also discusses the stability of it, and how the NPR model of asking for donations can lead to uncertainty about the next month. Henry says he's enjoying the management and marketing side of being a steward about as much as he enjoys coding. It's a side that people don't often think about with open source. This side of it includes a lot of marketing and interacting with the greater community, as well as the other maintainers and contributors to babel. How does Henry handle all this responsibility when there is no one above him telling him when to take a break, or when to go on vacation? Henry and Joel talk about having a positive "selfishness", and taking care of yourself so that the project can prosper. If you want to be doing it for years you have to make sure that you don't burn out. Joel Hooks: I have a list. I went and internet stalked you a little bit, like in listen to all your podcasts and went back ... Obviously, Babel comes up a lot and people want to talk about that kind of stuff. Joel Hooks: Which is interesting technically, but personally I've been interested in what you've been doing lately in terms of ... this idea that I can do open source and I can get myself funded. As an independent, I can go out and get myself funded. Because so much of open source that I see, is it says corporate funded. Joel Hooks: It's either being funded by a global ad network or being funded by everybody's favorite, binge watching of television service or what have you. But what's this idea that we can go out and we can do good work and do open source but then also fund it which is a pretty significant problem, right? How do I do that as an independent person? That's been really interesting to me to watch as you kind of make that leap from working at a corporation to working open source full time. I'm really curious how that's going for you and the sustainability and stability of that process and the future of it.'''
