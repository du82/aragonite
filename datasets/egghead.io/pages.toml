["https://egghead.io/lessons/apply-schema-custom-refinement-with-zod~116jm"]
title = "Apply Schema Custom Refinement with Zod | egghead.io"
description = """
In this lesson, we dive into the Zod's refine utility, allowing defining more complex schema validation on top of existing schemas and utilities.

Somet..."""
full_description = "In this lesson, we dive into the Zod's refine utility, allowing defining more complex schema validation on top of existing schemas and utilities. Sometimes, we need special validation rules for our applications to work correctly. The refine utility lets developers create their own validation rules. This method's uses a callback to check if the input is valid. We also create meaningful messages when something doesn’t meet the validation rules. We use a practical example involving a room booking schemawith dueDate and price property refinement. [00:00] Sometimes using the built-in ZOD schemas could be not enough. For instance, making a string represent a date, making a number represent an integer value from a specific range of values, making a number positive, negative, etc. Could be not enough as our application might need to perform some more complex, more advanced, more domain specific data validation. And in this case, we're going to use the refine utility provided with Zod. So in our case, we've got a room booking schema example, which provides some basic room booking information such as room type, due date, number of guests and price. [00:38] The two properties that are important for us in this case are the due date and price since we've got two objects which are going to differ in terms of the values under these properties. So the due date here is the 30th December, and here we've got the 31st December. Also, price changes, price differs, as here we've got an integer and here we've got a float value with some fraction part. Now both are correct due dates in terms of what we have in our schema right now and both prices also pass the validation since both are positive numbers. So all objects pass right here right now But we want to make the other object the second object fail validation Despite the fact that this is a proper date, and this is a proper positive number So let's start with the date one. [01:35] So here we're going to remove the date utility and replace it with the refine. And refine accepts a callback, which is going to accept what is the value of the property that we want to refine and it's supposed to return a boolean value or any other value that is going to be casted to a boolean, determining whether the validation itself, the expression itself is valid or not. So we could use the date parse method, which is going to turn this date string representation into a number. If the date is properly formatted, then this is just going to be a number of milliseconds that passed since the Unix epoch. And if it's not correct, then it's going to return a NAN value."
