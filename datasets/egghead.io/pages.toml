full_description = "Keith Peters joins us today to talk about his experiences with experimenting with code and math, the transition from Flash to Go, woodworking and blacksmithing, and getting books published. Keith talks to us a bit about multi trochoids; they're what happens when you take a circle and roll it around something, like a spirograph. He was inspired to do this project by Sodaplay, a site back in the flash days that had stuff you could hook up to various engines. What language did Keith use to write his multi trochoid experiments? Initially, Keith wrote it in Go, but he wanted to put it out on the web and make it interactive, so he ported it to Javascript. Back in the 90s Keith worked with Flash, when Flash left he moved over to Javascript and using the html5 canvas. Javascript is great if you want it live on the web but for still images and animations it was a pain in the neck, so Keith tried out Rust, Python, and finally settling on Go. Keith is into some non-coding hobbies like woodworking and knife making, Joel has even bought some of his knives. It started when Keith wanted to build an arcade cabinet, he bought tools and got into learning how to use them. Keith has found a lot of crossover with working with his hands and building things with code, both of them can be boiled down to learning a technology to create things and solve problems. Finally, Keith explains the pros and cons of going through a publisher to get your book out. He says that self-publishing is easier than ever, but a publisher provides you with a lot of assistance with editing, marketing, artwork, and a healthy dose of pressure. John Lindquist: My guest today is Keith Peters, you may know him as bit101. If you Google Bit-101, you'll find all of his stuff. He's written nine books that I could find on Amazon. Maybe more? John Lindquist: 15, yeah. Which blows my mind. I've made it through one chapter of my own book and then gave up. So, 15 books, yeah. John Lindquist: He created Gif Loop Coder, has a video series on coding math on YouTube. He's created lessons with us on Egghead, and has created many wonderful experiments throughout the years."
