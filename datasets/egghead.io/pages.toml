full_description = "Bash is the great barrier we all face when trying to script away our daily tasks. There are some common problems that we run into when dealing with it. Like what if we want to display images? Or share our script with other devs cross platform? You know what you want your script to do. You know you could figure it out if you had the time. But it's all just too darn much. What if your scripts could be written in JavaScript, launch a configurable GUI, and were actually easy to share with your team? We even use Script Kit internally at egghead.io to manage our lesson transcripts! With a single script, we query an API to list the transcripts, modify them as necessary, then post the changes. John Lindquist, the creator of Script Kit and co-founder of egghead.io, has put together this series of lessons to give a quick overview of the features of Script Kit to help you get oriented. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public. A Community Resource means that it’s free to access for all. The instructor of this lesson requested it to be open to the public."
