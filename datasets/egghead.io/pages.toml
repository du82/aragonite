["https://egghead.io/blog/saas-app-with-nextjs-prisma-auth0-and-stripe"]
title = "Building a SaaS Application with Next.js, Prisma, Auth0 and Stripe | egghead.io"
description = "expert led courses for front-end web developers and teams that want to level up through straightforward and concise lessons on the most useful tools available."
full_description = '''← ArticlesBuilding a SaaS Application with Next.js, Prisma, Auth0 and Stripe<img alt="Jon Meyers" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="rounded-full" srcSet="/_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Finstructors%2Favatars%2F000%2F000%2F547%2Fmedium%2Fjonmeyers.jpeg&amp;w=48&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Finstructors%2Favatars%2F000%2F000%2F547%2Fmedium%2Fjonmeyers.jpeg&amp;w=96&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Finstructors%2Favatars%2F000%2F000%2F547%2Fmedium%2Fjonmeyers.jpeg&amp;w=96&amp;q=75"/>authorJon MeyersPublished4 years agoIntroduction This article is about my experience building a SaaS application. And while this won't be a step-by-step guide on how to build a SaaS app, I will be providing you valuable insight on what the process was like for me as well as teaching you about the methods and technologies that I used. Software as a Service (SaaS) is a business model whereby the user pays a subscription to access cloud-based services or an application. In my case, I wanted to build an educational course platform where users can purchase an individual course to own for life or pay a subscription to gain access to all premium courses. Before building this application, I had only used Stripe Checkout to process one-off payments. I wanted to use this opportunity to go a little deeper - primarily learning how Stripe handles recurring payments. I plan to implement what I have learned throughout this process into my site, which will house my premium courses one day. The final version of this SaaS project ended up with a few third-party services, each handling their own piece of the puzzle and using webhooks to keep them in sync. Below is an architecture diagram representing the relationships between those services. This article will focus on each chunk of the stack individually. I will talk through why I chose each technology and discuss any problems I ran into during the process. Here is the project repo for those after the code and a live version of the final project named "Courses". FYI, payments are real! You have been warned, and thank you for your donation! 😆 What will be covered? High-level explanation of why certain technologies were chosen Biggest problems encountered throughout and how they were solved Next.js and the use cases for pregeneration vs serverside rendering Hosting, secrets, and automatic deploys with Vercel Prisma as an ORM, as well as the project's database schema and migrations Using Auth0 for authentication, GitHub as a social provider, and webhooks to keep things in sync Stripe for individual payments, subscriptions, and more webhooks! What will not be covered? A step-by-step guide for building a SaaS project - I wrote a blog article each week as I was building the project, which goes into more granular detail. Tech stack Next.js was used to build the UI, as well as the small chunks of server-side logic required for fetching gated content from Prisma, initiating authentication with Auth0, and payments with Stripe Vercel was used as a hosting platform for the application and its serverless functions Prisma provides a beautiful query-building language to abstract away those scary, complex SQL queries Supabase was used to host a Postgres database instance - it is capable of so much more around authentication and real-time database events, but we already had those pieces solved Auth0 was used to authenticate users with GitHub, manage sessions and protect both client and API routes in Next.js Stripe was used to process payments, subscriptions and host a customer portal for users to manage their subscription and payment information The app When considering different framework options to build the app, I had already decided that React would be the foundation - I have the most experience with it, and it makes me the most productive. I wanted to be able to pre-generate (build static pages) any un-gated/public content. This gave me a few options: Handcrafted React and Node server ❌ Too much work! Gatsby ✅ Awesome framework ✅ Static generation of pages at build time Next.js ✅ Also an awesome framework ✅ Static generation of pages at build time ✅ Server-side rendered pages ✅ API routes (serverless functions) I chose Next.js primarily because of its server-side rendering. Authentication would be a big part of this project, so I wanted to have an easily accessible server to handle all that secret stuff! While Gatsby spins up a server when building an application, that server does not exist when your users are using the app. Therefore, if I wanted to do secret stuff, I would have to manage another server! That sounds like too much work! Additionally, with so many different technologies being used already, and one of the main outcomes of this project being a case study to share with people, I didn't want to throw in the mental overhead of GraphQL, which is somewhat unescapable with Gatsby - GraphQL is awesome. Still, we can cover it at another time! Pregeneration (SSG) Pregeneration is the process of fetching all the data for a page when building the application. This means we can request data from slow servers, do expensive computational tasks, etc., without every user needing to sit and watch a loading spinner. We do all these slow tasks once, build static HTML pages with the data, and then serve them as static assets - much cheaper to host and scale! Next.js makes pregeneration super easy! All you need to do is export a function called getStaticProps from a page-level component. It will pick this up when building the application, run the function and inject the result into the component. Here is a simple example of how this can be used. pre { font-size: 85% !important; line-height: 1.75 !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important; tab-size: 2 !important; } @media only screen and (max-width: 640px) { pre { padding: 0 !important; } } const BlogsPage = ({ blogs ) => blogs.map(blog => <p>{blog.title}</p>)export const getStaticProps = async () => { const blogs = await getBlogPosts() // fetching from remote API return { props: { blogs, }, }}export default BlogsPage Here is an example from our SaaS application where we need to fetch all of the prices from Stripe, then iterate over each one and request its associated product. pre { font-size: 85% !important; line-height: 1.75 !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important; tab-size: 2 !important; } @media only screen and (max-width: 640px) { pre { padding: 0 !important; } } const PricingPage = ({ plans }) => ( // render each plan)export const getStaticProps = async () => { const { data: prices } = await stripe.prices.list() const plans = await Promise.all( prices.map(async (price) => { const product = await stripe.products.retrieve(price.product) return { id: price.id, name: product.name, price: price.unit_amount, interval: price.recurring.interval, currency: price.currency, } }) ) return { props: { plans, }, }}export default PricingPage In this example, we have two subscription plans, so we would be making three requests - one for the list of prices and then an additional request for each one's product. Imagine if we had one hundred products. What about a thousand! This could take a while and provide a pretty bad experience for our users 🙁 Remember, happy customers, like to buy our things! If we make these requests when we build our application, then they only happen once - when we deploy. No users are sitting around and waiting for us to deploy. When they visit the site, they get a super snappy pregenerated static page that doesn't need to rely on any third-party services for its data! Pregeneration works amazingly well for public content - pages where you don't care who the user is. Great for marketing pages and things that don't need to change frequently - such as a pricing page. If the page requires a user to be signed in or you are rendering different content for different users - such as a user dashboard - pregeneration is no longer a viable option. The problem is that when the server is building these static pages, there is no user! Server-side Rendering (SSR) That's where server-side rendering comes to save the day! This process runs when the user requests the page rather than when the server builds the application. Therefore, we know who the user is and can determine what they should and shouldn't access. Additionally, because this logic is running on the server, we can do secret things - such as fetch premium content from Prisma or check whether the user has a particular role - without worrying whether the user has tinkered with it. NEVER TRUST ANYTHING ON THE CLIENT! We can only trust our server-side code! Again, Next.js makes it super simple to run some server-side code. We export a function called getServerSideProps, and it will automagically turn it into a serverless function that runs when the user requests the page. Again, the data returned is injected into the component and displayed to the user. Here is a simplified example of this logic. pre { font-size: 85% !important; line-height: 1.75 !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important; tab-size: 2 !important; } @media only screen and (max-width: 640px) { pre { padding: 0 !important; } } const SecretStuffPage = ({ secretStuff ) => ( <> <NormalStuff /> {secretStuff && <SecretStuff /> </>)export const getStaticProps = async () => { let secretStuff = null if (user.canSeeSecretStuff) { secretStuff = await getSecretStuff() } return { props: { secretStuff, }, }}export default SecretStuffPage And here is a more realistic example from our application where we only want to display a lesson's video URL if the course is free, paid for, or has an active subscription. pre { font-size: 85% !important; line-height: 1.75 !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important; tab-size: 2 !important; } @media only screen and (max-width: 640px) { pre { padding: 0 !important; } } const LessonPage = ({ videoUrl }) => videoUrl ? ( <video src={videoUrl} />) : ( <button onClick={buyCourse}>Buy course</button>)export const getServerSideProps = async ({ req, res, params }) => { const { slug } = params const session = await getSession(req, res) const email = session?.user?.email let videoUrl = null let user = null const lesson = await getLesson(slug) if (email) { user = await getUser(email) } const userAllowedCourse = lesson.course.price === 0 || user?.isSubscribed || user?.courses.find((course) => course.id === lesson.course.id) if (userAllowedCourse) { videoUrl = lesson.videoUrl } return { props: { videoUrl }, }}export default LessonPage In the above example, videoUrl is either null or a URL for the lesson's video, depending on whether the user is allowed to see this content or not. By only returning the bits of data that the user is allowed to see, we make sure that the secret stuff remains secret! If we had returned the entire lesson from getServerSideProps and simply checked in the component whether we should display it or not, then that data has still been sent across from the server to the client. The secret stuff is no longer secret! Take this example. pre { font-size: 85% !important; line-height: 1.75 !important; border-radius: 0 !important; margin: 0 !important; padding: 0 !important; tab-size: 2 !important; } @media only screen and (max-width: 640px) { pre { padding: 0 !important; } } const LessonPage = ({ lesson, user }) => { console.log(lesson) const userAllowedCourse = lesson.course.price === 0 || user?.isSubscribed || user?.courses.find((course) => course.id === lesson.course.id) return userAllowedCourse ? ( <video src={videoUrl} /> ) : ( <button onClick={buyCourse}>Buy course</button> )}export const getServerSideProps = async ({ req, res, params }) => { const { slug } = params const session = await getSession(req, res) const email = session?.user?.email let videoUrl = null let user = null const lesson = await getLesson(slug) if (email) { user = await getUser(email) } return { props: { lesson, user }, }}export default LessonPage If we were to run this in the browser, it would seem equivalent to our previous example - the video would only display if the user were allowed to see it. However, if we open the console, the entire lesson object will be displayed - including the videoUrl. Once we have sent the page to the browser, it runs on the user's machine and is very easy to tinker with! Therefore, if we only return the bits of the data that the user is allowed to see from getServerSideProps, then we can keep the secret stuff secret. Server-side rendering with getServerSideProps allows us to encapsulate some logic that we need to run on the server without needing to maintain one. Ready to pick up the pace?Enter your email and receive regular updates on our latest articles and coursesEmail:What do you want to take to the next level?Portfolio BuildingSIGN UP<img alt="" title="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fres.cloudinary.com%2Fdg3gyk0gu%2Fimage%2Fupload%2Fv1569690305%2Ftranscript-images%2Feggo_new.png&amp;w=64&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fres.cloudinary.com%2Fdg3gyk0gu%2Fimage%2Fupload%2Fv1569690305%2Ftranscript-images%2Feggo_new.png&amp;w=128&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fres.cloudinary.com%2Fdg3gyk0gu%2Fimage%2Fupload%2Fv1569690305%2Ftranscript-images%2Feggo_new.png&amp;w=128&amp;q=75"/>egghead.ioWe're here to help.Sign up for our FREE email course⭐️ Portfolio Building: Learn how to build a badass developer portfolio so you can land that next job Hosting Next up, we need a place to host this application to share it with the world! Again, there are many options that vary greatly in the amount of control vs. work done for you. Since hosting the application is not the thing my users care about, I wanted to use a service that did as much of the heavy lifting as possible. Netlify and Vercel were the main options I was considering. Netlify is awesome and has recently released a zero-config plugin that enables all the SSR Next.js magic. However, I chose to go with Vercel as they are usually slightly ahead of the curve with new Next.js features - probably because they are the creators and maintainers of that too! Hosting the application was super simple with their CLI. pre { font-size: 85% !important; line-height: 1.75 !important; bor'''
