["https://egghead.io/lessons/use-zod-schemas-partially-using-shape-and-unwrap~7zbti"]
title = "Use Zod Schemas partially using shape and unwrap | egghead.io"
description = """
In this lesson we make use of partial validation of large and nested schemas in Zod.

Instead of creating many small schemas, which can complicate maint..."""
full_description = '''Instead of creating many small schemas, which can complicate maintenance, Zod allows for the extraction of specific parts of a schema using the concept of ".shape". It "unwraps" the object schema, enabling access to sub-schemas within specific properties. Additionally, we can use the .unwrap to get into element schemas of altered schemas such as .optional or .array. [00:00] Sooner or later you will create big and nested schemas which will allow you to validate big and nested objects. However, at some point in time you will need to use only a part of the schema to run some partial validation. Now, you could extract the selected code into a separate variable with a separate schema. However, this would lead to creating lots of very small and atomic schemas and would make maintaining the overall structure quite difficult. So all in all, we might want to be able to use only a part of the schema from a bigger thing. [00:38] So here we have a Zod object schema and on Zod object schemas we can use what is called a shape. So what is the difference between a shape and a schema? So a schema's primary purpose is to run validation against it. However, a shape somehow unwraps the object schema and allows to walk into certain properties. In other words if I have the schema and I would like to walk into a separate property this is impossible as we can run the parse or save parse etc so basically run the validation. [01:18] However if you walk into the shape itself, then we can walk into separate sub-schemas that exist on separate properties. So this allows us to use some granular, some smaller parts of existing schemas. Now, let's walk into the guest details schema. In this case, what we're going to do is to walk into the room booking schema. We can walk into the shape. [01:48] Now we walk into the guest details and in this case we have an array. So if you wanted to use the schema of a certain guest details element we want to walk into the element attribute over here and this way again we have a Zod object. Essentially we have access to what is being the element of the array. Now we could use the guest detail schema basically to run the parse. Now if we want to walk into the element of the amenities, so here we have an array of strings which is also optional in our case, what we might need to do is to walk into the room booking schema again, walk into shape, now amenities, so nothing new here.'''
