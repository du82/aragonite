g to get replaced with value only if it was 1 or value itself or true. And this is what we see. So TypeScript is aware of how all these things work, although this is basically a JavaScript [02:18] runtime operator. We can also see how does TypeScript interpret it. Is that if this was truthy, then there is no need to execute the statement. The same way, we can also see the end and equal, which is going to execute the assignment only if arc was truthy. So that arc gets removed all [02:38] the truthy values. So let's just see, what would happen if we have the let arc false. And now let's just execute it with this one. So this is false false, so let's just replace it with true. So if it used to be true, then we are going to replace it with a value. And let's just quickly [02:58] write the equivalent so that we would have if arc was truthy, then replace arc with what it would be. And that would be value. So that we can see that these 2 are pretty much equivalent. And finally, there is one more, That [03:18] is the nullish coalescing operator, which basically checks whether something is a null or undefined. So what arc used to be before the operation could be any of the stuff. But what it can be after the operation is it could be any of the numbers, any of the strings [03:38] that we have included, and any of the boolean values. But it could not be null and undefined because this operator only cares about null and undefined itself. So that's basically it. Let's just put an undefined value over here as the starting one. So we can see that if it was undefined, then it's going [03:57] to be a value now a equivalent, which would be anything that is basically not a null or undefined. This is basically left untouched."
