["https://egghead.io/lessons/declare-precise-array-types-within-zod-schemas~j567b"]
title = "Declare Precise Array Types within Zod Schemas | egghead.io"
description = """
This lesson demonstrates how to provide runtime type-safety for arrays in TypeScript applications.

First we need to understand the challenges behind en..."""
full_description = "First we need to understand the challenges behind ensuring array type-safety in TypeScript. We explain how TypeScript infers arrays with an undefined length, making it difficult to guarantee that array accesses are safe. We compare how utilities such as .min, .max and .nonempty get reflected in inferred TypeScript types, and how zod processes the validation. [00:00] We need to know that guaranteeing array type safety is a tricky thing to do in TypeScript. Let's take a look at this array over here. We can see that even though we pass exactly three elements to this literal, then TypeScript is going to infer it as an array of numbers, an array of undefined length, right? So TypeScript cannot figure out what is the exact length in compile time. Now if we try to access a certain item over here then TypeScript would say that hey this is a number and it doesn't matter that this is way out of range of this array. [00:35] Now why does it happen? If we take a look at the internal TypeScript's array interface we will see that the length is just a number. So it's not a type parameter somewhere here that would get evaluated somehow, basing on what is the literal itself, it's just a plain number. So we'll also scroll down to see that this index signature is going to return the T, so whatever is the element of the array, for any number that we pass over here. So, we could also get some really stupid results, such as passing the math.py is going to return a number, or even if we pass infinity, which also doesn't make sense, this is still going to be a number. [01:20] So having said that let's use array-based Zodd schemas. Here we've got a guest detail schema with properties such as name, age, email, whatever the guests are and we're going to use that schema inside a nested property inside our nested room booking schema that we've used before so we're going to create a new property called guest details and in order to define arrays in Zod we're just creating Z dot array and we pass an existing schema, whether it's object-based, primitive-based, whatever that is, it's just going to be wrapped in an array. So what we have over here is we can use a little bit of useful utilities. And in this case, we can use that, let's say, min one, since let's say that there might be at least one guest for a certain booking. And let's say that it's not possible to provide more than four guests the same way as we have over here with the number of guests."
