title = "Building an OpenGraph image generation API with Cloudinary, Netlify Functions, and React | egghead.io"
description = "OpenGraph images are the images you see when you paste a link into a social platform and it 'unfurls' into an image, title, and description. This happen..."
full_description = 'OpenGraph images are the images you see when you paste a link into a social platform and it "unfurls" into an image, title, and description. This happens on Twitter, Discord, Slack, and many other platforms. This collection goes over everything from designing OpenGraph images in Figma, to implementing them in CodeSandbox, to returning headless browser screenshots from Netlify Functions, and finally using Cloudinary as a write-through cache. You will come away from this collection with the ability to ship an API that you can use on any of your sites, and also on-demand, that can generate images for not only OpenGraph unfurls, but also for Instagram, GitHub, and more. Using headless browsers with playwright to generate our images means we get full access to all the responsive power of CSS and all the logical power of JS to handle layout, importing assets like pngs, choosing different fonts, and more. An efficient and practical course to learn how to design and create an OpenGraph for your projects. This course is still valid and relevant, with some minor differences in name dependencies, yet there are not major breaking changes. By the end of the course, you will understand the basics of Figma so you can use it to your advantage when building your next app or website. This course is for React newbies and anyone looking to build a solid foundation. It’s designed to teach you everything you need to start building web apps in React right away. Starting from a prebuilt frontend, Jason Lengstorf guides you through the creation of a "Corgi Up-boop App" that uses Netlify Functions and Hasura. By the end of the course, you will understand the basics of Figma so you can use it to your advantage when building your next app or website. This course is for React newbies and anyone looking to build a solid foundation. It’s designed to teach you everything you need to start building web apps in React right away. Starting from a prebuilt frontend, Jason Lengstorf guides you through the creation of a "Corgi Up-boop App" that uses Netlify Functions and Hasura.'
