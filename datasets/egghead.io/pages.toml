full_description = 'Most PopularHighest RatedRecently AddedMost WatchedSupabaseSupabase is an open source Firebase alternative. A service to: Listen to database changes. Query your tables, including filtering, pagination, and deeply nested relationships (like GraphQL). Create, update, and delete rows. Manage your users and their permissions. Interact with your database using a simple UI. Supabase is not a 1-to-1 mapping of Firebase. Most notably, Supabase uses Postgres rather than a NoSQL store.70 resultsfound for "*"Search Results<img aria-hidden="true" alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Ftags%2Fimages%2F000%2F001%2F299%2Fthumb%2Fsupabase-logo-icon_1.png&amp;w=96&amp;q=100 1x, /_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Ftags%2Fimages%2F000%2F001%2F299%2Fthumb%2Fsupabase-logo-icon_1.png&amp;w=256&amp;q=100 2x" src="/_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Ftags%2Fimages%2F000%2F001%2F299%2Fthumb%2Fsupabase-logo-icon_1.png&amp;w=256&amp;q=100"/>lessonDeploy Local Database Changes to Supabase Remote Through Github Actionslesson by Ben Patton<img aria-hidden="true" alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Ftags%2Fimages%2F000%2F001%2F299%2Fthumb%2Fsupabase-logo-icon_1.png&amp;w=96&amp;q=100 1x, /_next/image?url=https%3A%2F%2Fd2eip9sf3oo6c2.cloudfront.net%2Ftags%2Fimages%2F000%2F001%2F299%2Fthumb%2Fsupabase-logo-icon_1.png&amp;w=256&amp;q=100 2x"