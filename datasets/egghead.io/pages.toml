["https://egghead.io/podcasts/math-and-functional-programming-aren-t-exclusive-to-wizards-with-brian-lonsdorf"]
title = "Math and Functional Programming Aren't Exclusive to Wizards with Brian Lonsdorf | egghead.io"
description = "Join Brian Lonsdorf in a discussion on the purity of math and how it could be used to advance the greater software community, dispelling the myth that you need to be a wizard to use math and functional programming to do anything, how we can make dry topics more approachable and fun, the daunting wall of jargon, and finally some practical advice on including functional paradigms in your day to day work."
full_description = '''Joel and Brian Lonsdorf discuss the pain and growth of learning, math as a source of truth, dispelling that idea that you need to be a wizard to enter the functional programming space, and finally how you can start including functional concepts in your day to day work. There's a reason that mathematicians tend to be the best functional programmers. The theories and patterns directly apply, it has truth and purity. It's powerful, almost powerful enough to describe everything, so what makes people turn away from it? Traditionally, math gets taught in a dry manner from a young age, tables are memorized, and facts get drilled. It isn't until much later that interesting concepts like set theory get introduced, and at that point, it's too late for many people. Material that's "dry" doesn't have to be taught that way. It's been three and a half years since Brian first put Professor's Frisby's guide up on Github and it brought light and friendly perspective to heavy material. It showed that the functional programming paradigm was learnable without requiring a deep dive into Haskell. The deep dive doesn't work for everyone. There's merit in starting with something like Gatsby and just getting something out there that you can play with immediately, and then later learn the fundamentals of Javascript. The same thing applies to learning functional programming. You can start composing with Lodash and ease into the deeper patterns and concepts. Brian: You know honestly, it has been kind of something that I wanted to avoid being that guy. I'm doing other things and trying to get into mathematics and trying to get into machine learning and AI and all that so hopefully I'll be able to kind of step out of that role, but so far that's what's define me. Joel: Yeah, I mean I was gonna ask you because we're talking about functional programming if you're a mathematician, if that's your background. Math. Brian: Yeah, no certainly not, certainly not. I always kind of put...it's funny because you see all of these Mathematicians and they come over and they're the best functional programmers or just the best programmers and they're like, "Oh yeah, I can solve that in one line if you know these theories," but yeah, no not at all. I just end up watching a lot of YouTube's about topology and whatnot. Trying to catch up and it's something I enjoy that I found out after I started functional programming that I was like, "Oh this is cool. I'm gonna try to get into this." And so far I'm still really bad, but it's a lot of fun.'''
year_published = 2025
