["https://egghead.io/personalize-your-cursor-vs-code-theme-with-workbench-color-customizations~3w44x"]
title = "Personalize Your Cursor/VS Code Theme with workbench.colorCustomizations | egghead.io"
description = "expert led courses for front-end web developers and teams that want to level up through straightforward and concise lessons on the most useful tools available."
full_description = '''Finding the perfect code editor theme is a myth. There are always small visual tweaks you'd like to make, but forking and maintaining an entire theme is overkill. This lesson shows you how to quickly and easily customize any theme directly within Cursor (or VS Code) using the workbench.colorCustomizations setting in your settings.json file. The Problem: No single theme perfectly matches everyone's preferences. Minor visual annoyances (like search highlight colors) can impact focus and productivity. Forking and publishing a theme for small changes is excessive. The Solution: workbench.colorCustomizations This setting allows you to override specific color values of your current theme without creating a new theme. You get fine-grained control over the editor's appearance. How it Works: Open Settings (JSON): Use the command palette (Cmd/Ctrl + Shift + P) and search for "Preferences: Open User Settings (JSON)". It is best to create a new editor group to the right, and then open the json settings, so that you can visualize your changes. Add workbench.colorCustomizations: Within your settings.json, add a "workbench.colorCustomizations" object. Use Autocomplete: Inside this object, start typing "editor." and use Cursor's/VS Code's autocomplete to explore the available customization options. Examples include: editor.findMatchBackground: Background color of search matches. editor.findMatchHighlightBackground: Background color of the current search match. editor.findMatchBorder: Border color of search matches. editor.findMatchHighlightBorder: Border color of the current search match. editor.background: Overall editor background color. ...and many more! Set Color Values: Assign valid color values (hex codes, named colors, etc.) to the properties you want to change. You can even use transparency (alpha channel) with hex codes (e.g., #FF000022 for a semi-transparent red). Save and See the Changes: As soon as you save settings.json, the changes are applied live to your editor. Experiment with different colors until you find what works best. Benefits: Precise Control: Tweak individual elements of your theme without affecting others. No Forking Needed: Make personal adjustments without the overhead of creating and managing a separate theme. Live Updates: See your changes instantly as you edit the JSON. Easy Experimentation: Try out different colors and settings quickly. This lesson demonstrates a simple yet powerful way to personalize your coding environment, improving focus and making your editor truly your own. No need for extensive theme development – just targeted tweaks to make things just right.'''
