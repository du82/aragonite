title = "Perform Multiple Operations using Bulk in MongoDB | egghead.io"
description = "Perform multiple operations in MongoDB using bulk operations: insert, update, and delete documents efficiently with bulkWrite and bulk.execute."
full_description = '''In this lesson, we learn that to execute multiple requests to a MongoDB server efficiently, we can use bulk operations. We start by initializing a bulk operation that can be either ordered or unordered: initializeOrderedBulOp or initializeUnorderedBulOp We demonstrate how to add an insertion operation for a document, such as "John Doe," and how to remove another document, "Bob Johnson," from the collection. After executing the bulk operation, we verify the changes made. Furthermore, we introduce the bulkWrite method for a more streamlined approach to performing multiple operations in one command, allowing us to specify each operation's details explicitly while managing both insertions and deletions effectively.'''
