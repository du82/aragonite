full_description = '''Frequently Asked QuestionsBilling What payment methods are accepted? Currently, we only accept payment via credit card for individual memberships and teams consisting of less than 30 members. We do not accept PayPal. Can I pay through invoice? If you are purchasing for a team of 30+ members, please contact us at support@egghead.io for more information on invoicing. Do you have payment plans available for an annual memberships? We don’t offer payment plans. If you’re able, you can start out with a monthly or quarterly plan and then upgrade to an annual membership in the future. Where can I find my invoices? Once you’re logged in, you can view and download all your invoices directly from here: https://egghead.io/invoices From there, you can also add any required information to the "Prepared for" section of each invoice. Renewal cost from year-to-year Your membership price will be locked in at the time you purchase, and will continue to renew at that price each billing cycle unless/until you cancel it. Can I get a refund for a new membership or a recent renewal charge? Please contact support@egghead.io to request a refund. Our refund policy lasts 30 days. If 30 days have gone by since your purchase or last renewal, unfortunately, we can’t offer you a refund. If you are issued a refund, it will be processed, and a credit will automatically be applied to your credit card or original method of payment, within 5-10 business days. If you haven’t received your refund after 10 business days, first check your bank account again. Then contact your credit card company, it may take some time before your refund is officially posted. Next, contact your bank. There is often some processing time before a refund is posted. If you’ve done all of this and you still have not received your refund yet, please contact us at support@egghead.io. Membership Will my membership automatically renew? Yes, all memberships will automatically renew at the end of each billing period unless they are canceled before the renewal date. Can I cancel my membership? Yes, you can cancel your membership at any time before your next renewal date to prevent it from automatically renewing. When you cancel, your membership will remain active until your renewal date but will not renew at that time. If you’d like to cancel, you can do that from your account profile by following the steps below: Click the "Manage Your Membership" button to open your Stripe billing screen Click the "Cancel Plan" button to the right of your current plan Is parity pricing available? If we offer parity pricing in your area, it will automatically show up on the pricing page. You'll see the discount offer under the standard pricing area, with the discount specific to your country listed. You must select the offer to have it applied at checkout. Please note, this is automated based on the IP address of the computer you are using to make the purchase. Are there any limitations with parity pricing? Yes, the specific terms and conditions are listed with the parity discount offer that is displayed on the pricing page. Do you offer gift memberships? No. Do you offer any discounts? We provide parity pricing discounts for some regions, but we don’t offer any other form of discount. However, we do have sale events periodically throughout the year where you can purchase a membership at a discounted price. Are there free courses available? Yes, there are some courses that are free to access for all. They are designated as a “Community Resource,” which means the instructor of the lesson requested it to be open to the public. You can use the search page to filter out free courses. Team Plans Do you offer team plans? Yes, you can purchase a team plan from the pricing page. Just select the number of seats required before you proceed to purchase. Learn more about team plans here. What is included with a team plan? A team plan allows you to have a single account with multiple team members and one account administrator. With a team plan, you can switch members in and out of the team throughout the year as many times as you'd like, as well as increase/decrease the total size of your team at any time. Is there a minimum/maximum number of members required for a team plan? No, team plans can consist of a single member or as many members as needed. We do offer bulk discounts based on the team size. Those are calculated automatically, and you can see the discount you’ll receive by entering the number of seats needed on the pricing page. Can I change the team administrator? Yes, you can change the team administrator at any time from your team management page. How do I add/remove members? You can manage your team from the team management page in your administrator account. You can remove team members directly but will need to send an invitation to add new team members. Account How do I log in? You can log in by requesting a login link from the Sign In page. We also allow GitHub authentication, if you'd prefer an alternative option. You can set that up from your account profile. Can I use GitHub to log in? Yes, you can set up GitHub authentication from your account profile by following the steps below: Click your name and avatar in the upper right corner of any page to open your account profile Click the "Connect your GitHub account" button under the "Connect to GitHub" section of your profile Can I delete my account? Yes, you can delete your account from your profile here. Can I change my account email address? Yes, you can change your account email address from your profile by following the steps below: Click your name in the header to open your account profile Click the "Edit" button Enter your new email address in the "Email" text box Click the "Submit" button You will receive an email with a link to confirm the update - click that to complete the change.'''
