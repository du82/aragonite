["https://egstad.com"]
title = "Egstad • Graphic Designer & Developer"
description = "Jordan Egstad is a graphic designer and web developer creating expressive and enduring brand identities, websites, apps, typefaces, imagery, and more."
full_description = "E G S T A D Hello world, I’m Jordan Egstad. I’m a graphic designer and web developer creating expressive and enduring brand identities, websites, apps, typefaces, imagery, and more. My many-sided practice is informed by a decade of brand design and product development for some of the world’s best brands. Each of my projects is approached with a sense of curiosity, care, and most importantly, play. This ethos, and the generative process it informs, consistently leads brands to discerning solutions that feel uniquely and uncompromisingly “them”. I most recently led design and development on Instrument’s brand team, where I helped them attract world-class talent and clients. During my six years there, I worked on a variety of projects for Amazon, Dwell, Ebay, Facebook, Google, Harper’s Bazaar, Hot Wheels, Levi’s, Nike, Patagonia, Sequoia Capital, Sonos, Stumptown Coffee, TEDx, Twitter, Umpqua Bank, and more. Currently, I live in Portland, Oregon and work with Loom as their Principal Brand Designer. Loom’s video messaging tool has helped over 10,000,000 people come together virtually to effectively communicate ideas in an ever-increasingly remote world. Speaking of communications, if you’d like to get in touch regarding a project, or if you just want to talk shop, don’t be shy. InstagramAre.naTwitter DESIGN • This primary font used is called “Metaphor”, a variable typeface I drew for ease of readability on screens. The monospaced font is “System85” by Colophon. TECHNOLOGY • Nuxt.js, Sanity.io, Netlify, Github, and a S3 bucket (used as a video CDN) are what make this site possible. All code is open-sourced here. © Copyright 2010-2022"
author = "Jordan Egstad"
year_published = 2025
