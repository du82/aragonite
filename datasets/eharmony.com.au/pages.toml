description = "Explore questions to get to know someone to get your conversations to the next level."
full_description = "135 Questions to get to know someone on a deeper level I am I am looking for Please specify your gender. a woman a man nonbinary a woman a man nonbinary people You can add more detail about your gender in your profile Please supply your email address. Your Email For your security, use the following password format: At least 8 characters Letters AND numbers/special characters Must not be the same as your email address Please determine your personal password. Your password is not compliant with our restrictions. Create your password Join now by eharmony Editorial Team December 4, 2024 This article has been reviewed by Dr Lalitaa Suglani, an eharmony relationship expert. The content has been checked for accuracy and legitimacy based on the qualifications of our expert prior to publication.Reviewed by Relationship expert Dr Lalitaa Suglani Table of Contents Deep questions to ask to get to know someone Expert advice: Best questions to ask Funny questions to get to know someone Questions about expectations Core Values questions to ask Thought-provoking questions to ask people Future, ambitions, hopes and dreams Childhood, family and upbringing Hobbies and interests Travel questions to ask to get to know someone Friends and social life Career questions to ask Self-reflection questions to ask Books movies and games Likes, dislikes and pet peeves Tips for selecting good questions Asking questions is a crucial part of building any relationship, making it essential to know which questions to ask when getting to know someone. Asking the right questions not only helps you learn more about the other person, but also sets the tone for the connection you’re building. “True connection comes from conversation,” explains one of the eharmony relationship experts Laurel House. “The more you ask, the more you know, the more you grow — together or apart.” While deeper, more serious questions are better suited for when you’ve established a stronger connection, light-hearted questions are perfect for breaking the ice in the early stages of any type of relationship. “Asking questions and answering those same questions is one major way to learn about them and teach about you,” expert Laurel House adds, emphasizing the importance of mutual curiosity. “This helps you see if you are a fit for each other for now, enduringly, or never.” To help guide you through different stages of getting to know someone, we’ve organized our question suggestions into various categories. Whether you’re looking for some fun questions to ask to keep the conversation lively, or deeper questions to ask to strengthen your bond, you’ll find the right ones here. We’ve also summarized the most important tips for asking questions. Experts behind this article Dr Lalitaa Suglani, eharmony Relationship Expert, is an award-winning psychologist, and author specializing in practical advice on relationships, and attachment for singles and couples. Laurel House, eharmony Relationship Expert, is a relationship expert and dating coach with decades of experience in the dating scene, focusing on the latest dating trends and relationship dynamics. Deep questions to ask to get to know someone When delving deeper into someone’s life and personality, it’s essential to explore a range of question types to gain a comprehensive understanding. To effectively get to know someone on a more profound level, explore the following different types of questions: Learn from the Expert: We asked one of our eharmony relationship expert for the best questions to ask someone Make them laugh: Ask some funny questions to lighten the mood Expectations: Explore what they envision for relationships and life goals Core Values: Uncover the principles that guide their decisions and actions Thought-provoking: Challenge their perspectives with questions that stimulate deep thinking Future & Ambitions: Find out what they envision their life to be like Childhood, Family: Learn about their upbringing and family influences Hobbies and Interests: Discover their passions and leisure activities Travel: Understand their experiences and aspirations related to travel Friends and Social Life: Gain insight into their social dynamics and preferences Career: Discuss their professional aspirations and work-life balance Self-reflection: Engage in conversations about personal growth and self-awareness Books, Movies & Games: Share and discuss their tastes in media and entertainment Likes, Dislikes, and Pet Peeves: Identify their personal preferences and quirks For each category, we’ve prepared a set of 10 thoughtfully crafted questions to ask to guide your conversations and ensure a well-rounded exploration of each topic, helping you build deeper and more meaningful connections. The best questions to ask someone – according to an expert Knowing which questions to ask can make all the difference. Experts emphasize that thoughtful inquiries about core values, lifestyles, and love languages can help you uncover compatibility early on and set the foundation for a healthy relationship. That’s why relationship expert Laurel House recommends the following questions to ask: “What’s your dating purpose? What are you looking for and why? Do you want to get married? Do you want to have children? It’s essential that you find out if you are on the same dating purpose. Because if you don’t find out this essential information early on, you might connect with them, form an attachment, and then find out that you have different dating purposes and you have to break up. It’s better to reveal the essential must-haves and can’t-stands early on. What does your lifestyle look like? Your average day, week, month? You want to know if your daily lifestyles align and if your lives can fuse together. Are you an introvert or an extrovert? Are you a homebody or adventurer? This reveals if you prefer to be out with others or at home alone. How you choose to experience life is important when you are exploring the possibility of experiencing life together. What is your work/life balance? And how do you like to travel? What your work life, relaxation life, and vacation life look like is another way to communicate what your life looks like and if your lives can align. What makes you feel loved? What is your Love Language – Quality time, Physical Touch, Gifts, Words of Affirmation, Acts of Service, or the two additional languages that eharmony has developed: Shared Activities and Feeling Seen. More than what your love language is, how your love language is experienced is important to share. You are essentially giving your potential partner a road map to make you feel the essential 3S’s (Safe, Sexy, and Seen) in order to create the feeling of care and eventually love. People naturally give care and love in the way that they experience care and love. So, if two people have different love languages, they might not feel cared for or loved by the other because the other is giving care and love in the way that they feel cared for and loved and not the way that the other person experiences feeling cared for and loved.” Funny questions to get to know someone Couples that laugh, last – it’s scientifically proven1! Here are ten questions to help tickle your funny bones (and get to know each other better in the process.) Quick, what are 3 random things that first come to your mind? Would you rather have a frog’s head or frog legs? What’s the weirdest thing you have ever eaten? What’s the most embarrassing item of clothing you have ever worn? What’s the weirdest thing you’ve ever Googled? Would you rather be bald or have a mullet? Would you rather be trapped in a room filled with snakes or spiders? Do you have a completely useless talent? What is it? What’s your favorite song to sing in the shower? What’s the oddest dream you’ve ever had? Good questions to ask to learn more about their expectations Being clear about your expectations right from the start is the best way to have a functional, healthy relationship. It can also help you sidestep the heartbreak that’s inevitable when you and your partner just aren’t on the same page. What does a balanced relationship look like to you? What are your goals in this relationship? How do you like to receive affection? What would you like to see more of in our relationship? What would you like to see less of in our relationship? Do you prefer staying in or going out? Where do you see this relationship a year from now? What can we do to make this relationship easier for each other? What is your love language? What’s your idea of a perfect date? Core Values questions to ask to get to know someone Your core values in a relationship are the things that are most important to you, the principles that guide your life. Shared values are often the key to what makes a relationship work; while opposites attracting is great in theory, in reality, people are far more likely to find happiness with partners whose values match theirs. Here are some questions to figure out your partner’s core values: What is important to you? What do you spend your free time on? What do you talk about doing but don’t actually do? If you could live anywhere, where would it be? In your opinion, what are the three things a person should be? In your opinion, is lying ever acceptable? In what circumstances? Why do you vote the way you do? How important is religion to you? Find a list of values and pick your top three. How do you define each of those values? If you were in a situation that caused conflict between your most important values, how would you proceed? Thought-provoking questions to ask people It’s fun to laugh with your partner, but you’ll want meaningful conversations too. These ten questions will push you both to really think about the answers. What keeps you up at night? If you had one day left to live, what would you do? If you could ask me anything and have me answer truthfully, what would it be? What does love mean to you? If money didn’t matter, what would you do with your time? When you were a kid, what did you think being this age would be like? Is the reality different? If you had unlimited confidence, what daring things would you do? If you were going to transport us into any era (either forward or back), where would we go and why? Who inspires you to be a better person? If you could fix one of the biggest problems in the world, what would that problem be? Questions to ask to get to know their future, ambitions, hopes and dreams No matter how great the present is, thinking about the future is important, too. Questions about the future let you find out if you have a common vision of what that future is, and are best asked early. What would you do with your life if you were suddenly awarded a billion dollars? What’s one thing you want to do together that we’ve never done before? Where do you see yourself in five years? Do you think elderly parents should move in with their children once they can no longer live on their own? What are your thoughts on having kids? What does retirement look like to you? What does your dream house look like? Do you plan on staying in this city forever? If not, where would you like to move? What are your financial goals? What steps are you taking to achieve them? Do you have a bucket list? What are your favorite items on it? Questions to ask about childhood, family and upbringing Our families make us, and our childhood experiences can shape who we are as adults. Besides all of that, it’s just fun to hear stories about when they were younger. Here are some questions to ask to get to know about their past: Where did you grow up? Do you still live there? Do you have siblings? Are you close to each other? How often do you talk to your parents? Is there anything about the way you were raised that you would like to replicate with our children? Is there anything about the way you were raised that you do not want to pass on to our children? Do you have a favorite family tradition? What is it? What’s a childhood treat you still enjoy as an adult? Is there one you miss? Were/are you close with your extended family? What was your favorite activity as a child? What was your favorite subject in school? Your least favorite? Why? Questions to ask about hobbies and interests When you think of questions to ask to get to know someone, a person’s hobbies aren’t just how they spend time, they can also be a good indicator of their values and personality. These kinds of questions work well as icebreakers, and are a good option when it comes to thinking of great first date questions. You can also ask follow-up questions if something piques your interest. How do you spend your free time? What’s your favorite thing to do on a rainy day? Do you have a passion project? What’s your favorite thing to do after work? Would you rather a quiet dinner with a few friends or a massive party with lots of people? Do you think hobbies should be monetized? Why or why not? Do you prefer hobbies you can do on your own, or ones you need other people for? What’s the oddest hobby you’ve ever heard of? Is there a hobby you pursued as a child that you’d like to take up again as an adult? Would you be okay with sharing a hobby with your significant other? Travel questions to ask to get to know someone Travel is a big part of some people’s lives… and something to be avoided at all costs for others. Even if you both love to see the world, you might have very different travel styles. Do you like to go full speed ahead or are you a more relaxed kind of traveler? What’s your favorite kind of destination? Cities, mountains, beaches, the countryside? Or a mix? What kinds of things do you think it’s important to spend money on while traveling? What’s something embarrassing that happened while you traveled? Do you prefer to be the one doing the planning, or would you rather someone else do it? What’s your dream destination that you haven’t visited yet? What’s a popular travel destination that you think is really overrated? What’s your packing style? Carry-on only or all the checked bags? What kind of activities do you like to do when you travel? What’s your favorite trip you’ve been on so far? Good questions to ask to get to know someone about Friends and social life Friendships are important not only for you but for a healthy relationship as well. You also don’t want to end up with somebody whose social life is incompatible with yours, so it’s especially important to ask these questions before you get too serious. Would you rather have a few close friends, or many acquaintances? What is your favorite way to spend time with your friends? Are you more of an extrovert, an introvert, or an ambivert? What do you value most in a friendship? How often would you ideally go out every week? Have you ever had a friendship breakup? What happened? Do you think people with vastly different viewpoints can be friends? What is your favorite thing about [Friend’s Name]? What would it take for you "
