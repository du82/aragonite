  Bleibt Sauber.





















  
  






  EHRENWORT ist ein Podcast über Skandale. Alle zwei Wochen sprechen wir über einen Skandal aus Politik, Popkultur oder Zeitgeschehen, den einer von uns beiden zuvor akribisch recherchiert hat. Egal ob falscher Doktortitel, gekaufte WM oder Shitstorms im ganz großen Stil. Ein bisschen wie True Crime, nur ohne Crime. Meistens jedenfalls. Seit Sommer 2021 wird bei EHRENWORT jeden zweiten Sonntag die schmutzige Wäsche von anderen in der Öffentlichkeit gewaschen. Mit dem Podcast erreichen wir inzwischen jeden Monat über 100.000 Hörer*innen. Nominiert für den Deutschen Podcastpreis 2024 in der Kategorie Bester Independent Podcast.





















  
  






  Die HostsFabienne, 1991 geboren in Simmern, ist freie Creative Producerin für Audio- und Video Content. Zuvor hat sie mehrere Jahre in TV- und Zeitungsredaktionen gearbeitet, u.a. beim ZDF und der BILD-Zeitung. Sie hat Politische Kommunikation an der FU Berlin studiert und sogar zu Skandalen geforscht.Jakob, 1989 geboren in München, arbeitet als freier Creative Director. Für seine Arbeit wurde er national und international vielfach ausgezeichnet. 2021 gehörte er zu den 100 meist prämierten Kreativen der Welt. Vor seiner Zeit in der Werbung hat Jakob bei Film- und Fernsehen gearbeitet.(Foto: Sheryl-Ann Tesche, 2023)





















  
  




  
  
  


  


      
                                
  
  
  
  
  
  


  
  



    
  
                    

