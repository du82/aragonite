["https://ekf.de/compactpci"]
title = "CompactPCI® - EKF"
description = "As an leading member of PICMG, EKF is significantly involved in the further development of CompactPCI Serial standard. Check out all products!"
full_description = "A modular system concept like CompactPCI® Serial adapts ﬂexibly to a variety of tasks and markets, integrating AI and Edge Computing functionality. Due to its rugged characteristics it is not only the perfect ﬁt for modular applications in industrial automation, but can be found more and more in several demanding applications in transportation, telecommunications, medical technology or even in heavy machines or agriculture. Depending on the requirements of the project, e.g. I/O or memory options can be easily added, making system design ﬂexible and cost-effective. If there are no high system requirements, the solution is already achieved with a single board CPU and side unit in a compact box housing. A wide range of CPU cards (from high performance to low power) together with an impressive portfolio of peripheral boards provides an answer for nearly all industrial applications. Bridging modules and carrier cards allow hybrid systems, mass storage arrays and much more. Besides boards, EKF offers a wide range of standard and customized housings, from full 19” racks to customized boxes. Driving the Standard! As a leading member of the PICMG working group, EKF is significantly involved in the further development of the standard. A new update for CompactPCI Serial (Rev. 3) is about to be released and will include PCIe Gen4 support, 25GBASE-KR for single star or full mesh architecture, and the definition of requirements for PCIe Gen4 channel and test paddle cards. Download CPCI Overview Brochure Our CompactPCI®/ -Serial Products All CompactPCI® Serial Products All CompactPCI® PlusIO and Classic Products All CompactPCI® Express / PXIe Products How can we help you? As these are just examples, you may ask yourself if your requirement would be a good fit with our set of competencies? Simply get in touch and find out what is possible for your specific project! EKF sees itself as a partner at the round desk. We work in collaboration with clients to create the optimal solution for the particular application. Get in touch!"
