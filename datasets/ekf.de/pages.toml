["https://ekf.de/modblox7"]
title = "ModBlox7 - EKF"
description = "With ModBlox7 the demand for industrial PCs that are optimized in space, weight, power and cost and have a lack of interoperability and flexibility from current offerings are covered."
full_description = "Just in time for Embedded World 2024, a new PICMG standard will see the light of day and is designed to make industrial box PCs more modular and cost-efficient: ModBlox7™. The specification standardizes the structure of the hardware into individual functional units and thus guarantees interoperability between different providers. The current members of the ModBlox7 working group are Ci4Rail GmbH EKF Elektronik GmbH Elma Electronic Embeck Co, Ltd ept GmbH Hirose Electric Europe B.V. Phoenix Contact GmbH & Co. KG Samtec, Inc Tews Technologies GmbH Westermo ELTEC Elektronik AG Modblox7 Press Release Download ModBlox7 Flyer Our Current Modblox7 and Matching Mezzanine Products 7L600 - ModBlox7Single Pair Ethernet Switch SLC-ARMADASoM Mezzanine expansion Benefits Meets Growing IPC Market Needs Modular and Cost Effective Scalable in Small Space Constraints Interoperability Across Suppliers and Users Enables Small Quantity Tailoring Only Pay for What You Need Standardized Modularity for Industrial PCs Expandable System Widths Based on a modular and flexible IPC system, every functional unit – power supply, CPU and I/O – are built in multioles of 7 HP. When combined, they can create a system (up to 12 x 7 HP) specifically tailored to individual needs using cost-effective standard modules. The system is based on standardized mechanical and electrical interconnection between units and can be mounted multiple ways, such as wall, DIN rail, panel or 19″ rackmount. The unique mechanical and electrical modular approach means no additional expensive components like backplanes or shelf controllers are needed. Architecture Examples There are many different architectures possible. Below are two examples. High availability solutions with redundant architectures can be easily realized. The Importance of Standardized Industrial PCs As some market observations confirm, the demand for industrial PCs is incredibly high, and will continue to grow over the next few years. No wonder; industrial PCs are used in a wide range of state-of-the- art applications such as industrial automation, Al, lloT, cloud and edge computing. Currently, there is an almost endless number of different manufacturers with equally different products in terms of performance, interfaces, market qualification, and mechanics. These are often proprietary within their own product family. Customers therefore must select and stay with a specific product for many years, binding themselves to a single manufacturer. lndustrial PCs are increasingly demanding optimized space, weight, power and cost (SWaPc), yet have a lack of interoperability and flexibility from current offerings. This formed the motivation to create a new open specification – ModBlox7. Leveraging the advantages of other modular architectures like CPCl and AMC, ModBlox7 is intentionally designed for applications where highly integrated BoxPCs are used. Widespread Applications"
year_published = 2025
year_updated = 2025
