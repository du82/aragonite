["https://ekf.de/public-transport"]
title = "Public Transport - EKF"
description = "The flexibility and modularity of EKFs embedded systems standard portfolio makes it suitable for many applications in public transportation."
full_description = "Embedded systems in public transportation help to improve efficiency, safety and user experience in buses, tramways and trains. They are used for passenger information systems, ticketing, efficiency management or fleet management in general, driver assistance, wireless communication, security and many more. Modular solutions based on CompactPCI® Serial or space-saving Box PCs provide flexible and scalable platforms for embedded systems in public transportation. These modular approaches make it possible to adapt systems to the specific requirements of different vehicles while providing a robust and reliable basis. In public transportation, embedded systems must meet a number of requirements. In the context of smart city initiatives, for example, they must enable integration into urban infrastructures and allow seamless communication with other modes of transport and smart city systems. Edge computing solutions in public transportation process and analyze data locally to make real-time decisions and minimize latency. At the same time, they play a role in cloud computing by transferring data to the cloud to support long-term analytics, maintenance predictions and fleet management. Related Products PC6 - Low-Power CompactPCI® PlusIO CPU Card SC9 - Tiger Lake Intel® XEON® CompactPCI® Serial CPU Card SRS-12xx-BLUBRICK - CompactPCI® Serial System Platform for Railway 7L600 - ModBlox7™Single Pair Ethernet Switch AL100 - Industrial Gigabit Ethernet Switch 5 to 15 Port 1000BASE-T SC6-TANGO - Apollo Lake CompactPCI® Serial CPU Card AC100 - Embedded Blue® NVIDIA DIN Rail AI Edge Computing Platform AC600 - Embedded Blue® Apollo Lake SoC DIN Rail Boxed Solution Requirements for Embedded Systems in Public Transportation Robustness and Vibration Safety Applications in public transportation are often subject to strong vibrations and shocks. The plug connections and the mechanical structure of embedded systems must therefore be particularly robust in order to ensure reliable operation even under these harsh conditions. EKFs advantageEKF provides for these markets in particular. M12 connectors are used for power supply and data. Rotating parts are avoided as much as possible. Interfaces are mechanically secured as heat sink connections or as data lines between boards. Temperature Resistance Embedded systems in transport applications must be able to cover a wide range of temperature extremes, as they are used in both summer and winter under all weather conditions. EKFs advantageBoard designs fulfill the extended temperature range from -40 up to +85°C ambient temperature, differentiated between OT4 + ST2 or OT6, depending on components. Boards and system solutions will be qualified in EKF’s own temperature chambers. Nonflammability up to Hazard Level 3 can be achieved and will be tested by an accredited laboratory. EMC Protection (electromagnetic compatibility) The electronics in public transportation are exposed to a multitude of electrical and electromagnetic interference. Consequently, the plug connections and the mechanical structure must be designed to provide optimum electromagnetic shielding. EKFs advantageEKF boards are designed to offer a reliable out-of-the-box basis for EMC certification. As the systems design including cabling, PSU and all other components influences the EMV 06 measurements, EKF supports the customers certification process. EKF also offers to take on this task for the customer. Compact Design Space is limited for many public transport applications. Compact designs of embedded systems, including connectors, are therefore crucial to facilitate integration in limited spaces. EKFs advantageThe 19″ technology results in a large pack size for the mechanical structure, while CompactPCI® Serial accelerates the electrical side to PCIe speed via independent interfaces. The combination is a compact solution. Complexity and high data rates naturally require careful design to support power consumption, but also to dissipate heat safely. Since EKF has been offering 19″ technology on various backplane standards for decades, we have learned many details about pitfalls and traps. Long-Term Availability As public transport applications are often long-term investments, the plug connections and the mechanics of the embedded systems must be designed for long-term availability. This ensures that spare parts are still available even after many years. EKFs advantageEKF is a partner you can rely on from first contact up to after-sales market. To extend the life cycle of products and to supply customers for as long as possible with the same products, we are a partner of major suppliers in the Embedded market, offering a roadmap with long-term availability for embedded and industrial components. According to our life cycle policy, we will never discontinue products due to economic reasons. Our products will continue to be offered for as long as we can obtain obsolete components from reputable sources at a comparable quality and price point. Planning even further, we work on a case by case basis to store obsolete components long time to be able to produce more products when needed. EKF owns all rights to its designs and operates its own production line, giving us independence and complete control over the process. Norms and Certifications Plug connections and the mechanical structure must comply with the applicable standards and certifications for all rail and road applications in order to ensure safety and reliability. This includes, for example, standards such as EN 50155 for electronic devices in rail vehicles and the E1 and KBA (Kraftfahrt-Bundesamt) approval for road capability in Germany. EKFs advantageDepending on the customers’ requirements, EKF can qualify custom solutions according to discrete specifications, for instance EN50155, to verify that a design fulfills the application environment. Conformal coating according to EN50155 PC2 includes coating, under-filling and sealing for maximum protection of the board against external impacts. With regard to the new ModBlox7 standard, all power supply modules come with E1 approval by default."
