["https://ekf.de/avionic-and-space"]
title = "Avionic and Space - EKF"
description = "Air traffic control, mapping via camera data from the air, and airspace security and surveillance are some uses of avionic and space embedded systems."
full_description = "Air traffic control, mapping via camera data from the air, and airspace security and surveillance are some of the uses of avionic and space embedded systems. They enable precise navigation and communication systems, as well as the capture and analysis of high-resolution images via camera data. The requirements for embedded systems in aviation are particularly high due to their need to meet very strict standards. These standards, such as DO-178C for software development in aviation, DO-160, ARINC or ATR Air Transport Rack, set strict standards for safety and reliability. The requirements of aviation safety authorities must be met by these systems to ensure safe and efficient aviation. Overall, the contribution embedded systems make to the safety and efficiency of civil aviation is significant. Embedded systems for avionic and space applications will typically require extremely high computing performance and extensive data storage. They will also need to operate without fans or any other parts that would require high maintenance. Last but not least, they need a good space/performance ratio (SWaP) and should be available for many years. Related Products SC5-FESTIVAL Intel XEON CompactPCI® Serial CPU Card SC9-TOCCATA Tiger Lake Intel® XEON® CompactPCI® Serial CPU Card SY8-CYCLONE CompactPCI® Serial FPGA Based Universal Networking Platform 7L600 ModBlox7™ Single Pair Ethernet Switch AC100 Embedded Blue® NVIDIA-based AI Edge Computing Platform EKF Services for Avionic and Space Embedded Systems Long-Term Availability According to our life cycle policy, we will never discontinue products due to economic reasons. Our products will continue to be offered as long as we can obtain obsolete components from reputable sources at a comparable quality and price point. EKFs advantagePlanning even further, EKF works on a case by case basis to store obsolete components long time to be able to produce more products when needed. EKF owns all rights to its designs and operates its own production line, giving us independence and complete control over the process. Coating, Sealing, Underfilling If required, all our products come with a conformal coating. The coating is completed by relying on experienced partners. EKFs advantageAt EKF, coating means both sealing and underfilling to protect PCB and components from harsh environments. In avionic and space applications, this may be necessary due to high differences in air pressure or temperature. Custom System Design Some applications have specific hardware requirements, need special components and individual configuration. EKFs advantageAs our product range consists mainly of modular and flexible platform solutions, system design and individual support are key to fulfilling our customers’ exact requirements. With our Intel Gold partnership, we always provide the most current and powerful CPU platforms on CompactPCI Serial, fulfilling special requirements for e.g. FPGA design, market-specific connectors (Quadrax, MIL) or mechanical rack design (ARINC 600). Modularity through a broad range of side cards is part of our core competence. We can offer unlimited possibilities to customize your systems with a wide range of expansion cards for connectors, fieldbuses or communication protocols."
