["https://ekf.de/industries/industrial-automation-and-test"]
title = "Industrial Automation and Test - EKF"
description = "Industrial embedded systems have to be robust, durable and powerful, in order to work efficiently in demanding industrial environments."
full_description = "Industrial embedded systems play a crucial role in the field of industrial automation. These systems have to be robust, durable and powerful in order to work efficiently in demanding industrial environments. CompactPCI® series products and modern BoxPCs play a central role here, as they offer a compact design and high computing power. In industrial automation, embedded systems are used in various applications such as control and regulation systems, process automation, robotics and machine learning. They enable the precise control of production processes, increase efficiency and contribute to improving the overall performance of production facilities. Industrial embedded systems are indispensable in the context of Industry 4.0 and the Industrial Internet of Things (IIoT). As edge computers with a cloud connection, they serve as the basis for networked devices and sensors, enable real-time data processing and thus support the intelligent networking of production systems. Related Products SC5-FESTIVAL - CompactPCI® Serial CPU Card Intel XEON SC9 - Tiger Lake Intel® XEON® CompactPCI® Serial CPU Card PC6 - Low-Power CompactPCI® PlusIO CPU Card SL1-COMBO - CompactPCI® Serial 7-Port Gigabit Ethernet Switch SRS-8442 - CompactPCI® Serial/PXI Express Dual Backplane System Rack AL600 - Single Pair Ethernet Switch SRS-3201-BLUBOXX - CompactPCI® Serial Small Industrial Rack 7L600 - ModBlox7™ Single Pair Ethernet Switch Connecting Worlds – Preserve PXIe, enable CompactPCI® Serial PXIe, which supports PCIe, is no longer based on CompactPCI® Serial. As a result, developers can no longer realize the advantage of combining both worlds in one system with PXIe-based systems. With the SRS-8442-SERIAL 19-inch system rack developed by EKF in cooperation with Schroff, a solution platform has now been created that can reconnect both worlds and for which EKF offers numerous CPU assemblies based on 7th and 11th generation Intel Core processors (aka Kaby Lake and Tiger Lake) that support both PXIe and CPCI-Serial. The EKF system is equipped with two backplanes, on the left for six CompactPCI® Serial cards and on the right for seven PXI Express (or CompactPCI® Express) cards."
