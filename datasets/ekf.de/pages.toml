["https://ekf.de/about"]
title = "About - EKF"
description = "Read more about EKF, the family-friendly company from Hamm, Westphalia, which is one of the leading manufacturers of modular industrial microcomputers."
full_description = "Since its foundation in 1972, EKF Elektronik GmbH has established itself as a leading manufacturer of modular industrial microcomputers. The company excels in manufacturing highly ruggedized boards and systems for various industries such as transportation and traffic, IIoT and Industry 4.0, robotics, energy, industrial automation and medical technology. EKF’s extensive product portfolio integrates the latest embedded processors from Intel, NVIDIA and ARM into its products. The company places particular emphasis on the established and powerful CompactPCI® serial/plusIO standard for complex system designs, but also offers versatile box and board-level assemblies with the Embedded Blue®/Gold series. The latter provide the same range of functions either in application-ready box designs or as board-level products for integration in the customer’s own system. The recently added product line in the Modblox7® standard enables cost-effective and cross-vendor system and box PC designs thanks to standardized and modular plug-in units. The portfolio is complemented by an extensive selection of peripheral cards and mezzanine modules. In addition, EKF provides a cloud-based software solution that enables seamless data collection, transmission and processing to facilitate intelligent maintenance and remote servicing of devices. Quality Management Both new products and customer-specific board designs are created in the company’s own development department. Through in-house SMT production and individual product controls, EKF guarantees high quality and fast delivery times. These efforts are underlined by ISO 9001 certification in quality management since 1996. The company provides a three-year guarantee for all manufactured products and ensures long-term availability. In addition, the products are also available in versions for the extended temperature range, including protective coating. Quality ManagementEnvironmental Commitment In addition to its product range, the company is actively committed to environmental protection through continuous improvements to sustainable manufacturing processes and the company building. Corporate ResponsibilityCareer As a member of the corporate initiative “Excellent Employers in Hamm”, we maintain a flat hierarchy and attach great importance to treating all our employees with respect. In this context, we are very proud to be recognized as a family-friendly company in Hamm, which underlines our efforts to provide individual solutions for every situation of our employees. Join our Team"
