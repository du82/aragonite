title = "Trainings | ekoparty"
description = "Visita la entrada para saber más."
full_description = "EKOPARTY trainings 2024 Los Ekoparty Trainings son capacitaciones y entrenamientos intensivos con cupos limitados. Son dictados por los líderes y referentes de ciberseguridad más reconocidos a nivel nacional e internacional. Tené en cuenta que la mayoría de estos cursos no están disponibles en otros lugares. ¡No te los podés perder! Importante: es necesario contar con computadora portátil (laptop) al momento de asistir a los Trainings.Podés ver los demás requisitos técnicos particulares en la información general de cada Training. ¡Reservá tu lugar! Para consultas sobre los trainings y los métodos de pago, escribinos a: capacitacion@ekoparty.org CLOUD SECURITY – THE PURPLE TEAM WAY (Incluye Cloud Security – The Red Team Way y Blue Team Way) Trainer: Santiago Abastante En este training los participantes aprenderán cómo complementar una estrategia de Cloud Security, usualmente basada en los conceptos de DevSecOps, con las herramientas que el RedTeam y el BlueTeam tiene para ofrecernos, aprenderemos a atacar y defender nuestros entornos cloud. 📆 7, 8, 11 y 12 de noviembre 2024 (4 días) 📍Buenos Aires +INFO CLOUD SECURITY – THE RED TEAM WAY Trainer: Santiago Abastante En este training los participantes aprenderán cómo complementar una estrategia de Cloud Security, usualmente basada en los conceptos de DevSecOps, con las herramientas que el Red Team tiene para ofrecernos, aprenderemos a atacar nuestros entornos cloud para entender mejor como defendernos. 📆 7 y 8 de noviembre 2024 (2 días) 📍Buenos Aires +INFO CLOUD SECURITY – THE BLUE TEAM WAY Trainer: Santiago Abastante En este training los participantes aprenderán cómo complementar una estrategia de Cloud Security, usualmente basada en los conceptos de DevSecOps, con las herramientas que el Blue Team tiene para ofrecernos, como ser Threat Intelligence, Threat Hunting, Security Detection en Incident Response 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO PRACTICAL MOBILE APPLICATION EXPLOITATION Trainer: Juan Urbano Este training está destinado a desarrolladores, consultores de seguridad y público con nivel de conocimientos básicos/intermedio sobre Android. El enfoque de las clases son progresivas, iniciando con conceptos básicos y generales de Android, metodologías OWASP enfocadas a aplicaciones móviles hasta la manipulación de la aplicación (frontend y backend). 📆 8, 11 y 12 de noviembre 2024 (3 días) 📍Buenos Aires +INFO STEALING THE CROWN: ADVANCED RED TEAM ADVERSARY OPERATIONS AND TACTICS Trainers: Javier Antunez & Diego Bruno En este training explicaremos Técnicas, Tácticas y Procedimientos (TTPs) actuales para infiltrarse en las redes, mantener persistencia, moverse lateralmente e ir escalando hasta conseguir los objetivos buscados dentro de la red. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO BOMBERCAT: EXPLOTANDO EL HARDWARE Trainer: Andres Sabas En este training nos adentraremos a los conceptos básicos de hardware para mejorar en el uso de cualquier herramienta open source, a la par de usar las capacidades de la tarjeta Bombercat, teniendo tecnologias integradas como WiFi, NFC y Magspoof, siendo capaces así de hacer emulación de tarjetas bancarias, escritura de tarjetas NFC, y emulación de tarjetas NFC, aprende algunas metodologias de ataque sobre estas tecnologias. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO CATSNIFFER TRAINING Trainer: Eduardo Contreras Flores & Kevin Jahaziel Este entrenamiento está dirigido a profesionales y entusiastas de la seguridad informática y la tecnología, especialmente aquellos interesados en la investigación de pruebas de penetración y análisis de vulnerabilidades en dispositivos IoT. Con el objetivo de capacitar a los participantes en el uso efectivo de herramientas y técnicas de análisis para investigar pruebas de penetración y vulnerabilidades en dispositivos IoT, con el fin de evaluar y validar la seguridad e integridad de las implementaciones de los diversos protocolos IoT. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO ACTIVE CYBER DEFENSE: HUNT THE FOX ON HIS LAND Trainers: Fede Pacheco, Diego Staino & Mariano Quintana En este training veremos los enfoques principales de ciberdefensa activa, entre los cuales se encuentra el ciber engaño y la caza de amenazas, y se complementa con el entrenamiento y aprendizaje mediante ejercicios de Purple Team, y el desarrollo de capacidades de inteligencia procesable orientada hacia dichos fines. 📆 11 y 12 de noviembre de 2024 (2 días) 📍Buenos Aires +INFO HACKING CULTURE: Convirtiendo usuarios vulnerables en barreras de defensa adicionales Trainers: Jorge L. Litvin y Paula Geosits El entrenamiento busca empoderar a los asistentes con el conocimiento y las habilidades necesarias para liderar y ejecutar programas de cambio cultural de ciberseguridad en las organizaciones.A lo largo de las dos jornadas intensivas, los participantes aprenderán a evaluar la cultura de seguridad las organizaciones y las capacidades de quienes la integran, así como a diseñar, implementar, medir y mantener programas de concientización y entrenamiento efectivas que puedan adaptarse a la dinámica cambiante de las amenazas cibernéticas y de los distintos tipos de organizaciones, cuyas necesidades pueden cambiar radicalmente según su naturaleza. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO INTRODUCCIÓN A LA INGENIERÍA INVERSA EDICIÓN 2024 Trainers: Daniel Kazimirow & Ricardo Narvaja El curso esta orientado a todas aquellas personas que quieran introducirse en el mundo de la ingenieria inversa, la cual entre otras cosas, es la puerta de entrada para muchas ramas de la seguridad informatica, como por ejemplo el desarrollo de exploits, cracking de software, investigacion de vulnerabilidades, analisis de malware, analisis forense, etc. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO INGENIERÍA SOCIAL Y OSINT: INVESTIGACIÓN DE FRAUDES Y CIBERDELITOS Trainers: Emiliano Piscitelli & Jorge Vila La capacitación tiene como fin impartir los conocimientos necesarios al asistenteen la obtención de información de usuarios y activos de una empresa utilizandotécnicas físicas y lógicas, para ello se analizarán sitios convencionales y noconvencionales lo cual permitirá realizan una investigación más amplia y exhaustiva. 📆 7 y 8 de noviembre 2024 (2 días) 📍Buenos Aires +INFO HANDS ON VULNERABILITY RESEARCH ON EMBEDDED DEVICES Trainers: Gastón Aznarez y Octavio Gianatiempo Los dispositivos embebidos se están volviendo cada vez más frecuentes en nuestra vida diaria y con su aumento crece la demanda y la necesidad de investigar las vulnerabilidades que los afectan. En esta capacitación, exploraremos los pasos críticos para realizar un proyecto exitoso de investigación de vulnerabilidades en este tipo de dispositivos. Seguiremos los pasos que el equipo de investigación de Faraday realizó para analizar el Totolink N100-RE y veremos como encontrar y explotar una vulnerabilidad de inyección de comandos (CVE-2022-29558). 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO INTRODUCTION TO WINDOWS USER-MODE EXPLOITATION Trainer: Josué Rojas aka Nox En este entrenamiento, te proporcionaremos los fundamentos esenciales de la ingeniería inversa para comprender qué son las vulnerabilidades y cómo explotarlas. Aprenderás a crear exploits personalizados, desarrollar habilidades para evadir mitigaciones, construir shellcodes manualmente y adaptar técnicas de explotación. Te sumergirás en el fascinante mundo de la explotación de vulnerabilidades en sistemas Windows desde el lado del usuario. Este curso no solo te preparará para enfrentar desafíos prácticos, sino que también te dará las bases necesarias de preparación de certificaciones como el OSED. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO MESSING WITH RATS: ACCESO INICIAL CON INGENIERÍA SOCIAL Trainers: Daniel Isler & César Soto Los participantes vivirán una experiencia de principio a fin como un consultor de Ingeniería Social en servicios especializados y Red Team. En la que comprenderán la importancia de la inclusión de acciones de Ingeniería Social para ejercicios de simulación de adversario. Los ejercicios de Ingeniería Social son beneficiosos tanto para pruebas de acceso no autorizado como para la medición de políticas yconcientización de colaboradores en temas de ciberseguridad.Pondrán en práctica las técnicas, tácticas, metodologías y herramientas impartidas durante el curso con el objetivo de fortalecer y confirmar estas como la puerta de entrada de todos los grandes ciberataques. 📆 11 y 12 de noviembre 2024 (2 días) 📍Buenos Aires +INFO ¡Contactá a un representante de Ekoparty para obtener más información! Nombre Dirección de correo electrónico Teléfono Mensaje 8 + 3 = Enviar"
