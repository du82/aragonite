witch Raspberry pi play with #pcm5122 audio board Nwi1252 simultaneously rs232 rs485 USB port data loop test #esp32c3 RGB matrix panelpassive drive demo test with rpi3, 2w #rpi #display Power path distribution by MOSFET #circuit Load More… Subscribe body #sb_youtube_sbyUCVFEb4mawSezJNAUDTnI3w6 .sby_caption_wrap .sby_caption { font-size: 13px !important}body #sb_youtube_sbyUCVFEb4mawSezJNAUDTnI3w6 .sby_follow_btn a:hover { box-shadow:inset 0 0 10px 20px rgb(255, 255, 255, .25) !important}body #sb_youtube_sbyUCVFEb4mawSezJNAUDTnI3w6[data-videostyle=boxed] .sby_items_wrap .sby_item .sby_inner_item { background-color: #ffffff !important} Mini Updates 🖼 Ldo power supply board opm1095, and ft4232 board to do isp programming 4x simultaneously #esp8266 .feedzy-rss .rss_item .rss_image{float:left;position:relative;border:none;text-decoration:none;max-width:100%}.feedzy-rss .rss_item .rss_image span{display:inline-block;position:absolute;width:100%;height:100%;background-position:50%;background-size:cover}.feedzy-rss .rss_item .rss_image{margin:.3em 1em 0 0;content-visibility:auto}.feedzy-rss ul{list-style:none}.feedzy-rss ul li{display:inline-block} 🎬 WIFI Camera Tori board .feedzy-rss .rss_item .rss_image{float:left;position:relative;border:none;text-decoration:none;max-width:100%}.feedzy-rss .rss_item .rss_image span{display:inline-block;position:absolute;width:100%;height:100%;background-position:50%;background-size:cover}.feedzy-rss .rss_item .rss_image{margin:.3em 1em 0 0;content-visibility:auto}.feedzy-rss ul{list-style:none}.feedzy-rss ul li{display:inline-block} 🖼 how module penalized #pcb .feedzy-rss .rss_item .rss_image{float:left;position:relative;border:none;text-decoration:none;max-width:100%}.feedzy-rss .rss_item .rss_image span{display:inline-block;position:absolute;width:100%;height:100%;background-position:50%;background-size:cover}.feedzy-rss .rss_item .rss_image{margin:.3em 1em 0 0;content-visibility:auto}.feedzy-rss ul{list-style:none}.feedzy-rss ul li{display:inline-block} 🖼 Esp32 #i2c #OLED demo .feedzy-rss .rss_item .rss_image{float:left;position:relative;border:none;text-decoration:none;max-width:100%}.feedzy-rss .rss_item .rss_image span{display:inline-block;position:absolute;width:100%;height:100%;background-position:50%;background-size:cover}.feedzy-rss .rss_item .rss_image{margin:.3em 1em 0 0;content-visibility:auto}.feedzy-rss ul{list-style:none}.feedzy-rss ul li{display:inline-block} 🎬 Esp32 camera takes the sound from #I2S microphone .feedzy-rss .rss_item .rss_image{float:left;position:relative;border:none;text-decoration:none;max-width:100%}.feedzy-rss .rss_item .rss_image span{display:inline-block;position:absolute;width:100%;height:100%;background-position:50%;background-size:cover}.feedzy-rss .rss_item .rss_image{margin:.3em 1em 0 0;content-visibility:auto}.feedzy-rss ul{list-style:none}.feedzy-rss ul li{display:inline-block} Latest Product Reviews Chao Reviewer 3/5 Sorry for the problems. The circuits probably need better fine tune. I added a few analaysis for t...Show Morehese issues here in section "circuit guides": https://w2.electrodragon.com/gollum/search?q=mosfet-dat.md We will try to represent the issues here and see if we can further improve it. Thank you very much!Show Less 2 weeks ago ESP LED Strip WIFI/BT Control Board [ESP-MOD] lukix Verified owner 5/5 I have ordered 10pcs of this fantastic controller. Using Tasmota FW in it, with combination of HomeA...Show Moressistant. Working absolutely fantastic and reliable. I have noticed 2 issues: - one is the same as Gordon and Steve have. Basicaly 1st PWM channel is not turned off completly. If you connect LED strip (24V) on it, you will notice it is ON. CAn not be turned off. Probably there is very low current, because LED strips shines very dimm, but if is dark, you notice it. - second issue is, that when the controller is turned off, and you turn it on it wil very shortly flash - than turn off, and thatn turn on again. Fantastic product, but would be nice if is little tuned to be 100% working as you expect.Show Less 4 weeks ago ESP LED Strip WIFI/BT Control Board [ESP-MOD] Bertolt Meyer Verified owner 4/5 Bought two recently together with their P4 64x64 matrices. I got them to work on a Pi4B with the hze...Show Moreller library, BUT: For driving 64x64 matrices, this boards/shield requires soldering: You need to connect P4 to GND and P8 zu #E. Either solder two small wires or jumpers like I did (see pictures: before/after). This would be easier if the board already came with jumpers in the right place. I found the tip here: https://w2.electrodragon.com/Board-dat/MPC/MPC1073-DAT/MPC1073-test-log-dat/MPC1073-test-log-dat.md#more-demos However, contrary to what it says there, --led-multiplexing=0 (instead of 1) did the trick so this demo worked after soldering: sudo examples-api-use/demo --led-rows=64 --led-cols=64 --led-multiplexing=0 However, I get quite a bit of ghosting/artefacts when displaying small images and animations on a chain of just 2 64x64 matrices, even after tweaking with things like --led-pwm-lsb-nanoseconds 50 and --led-limit-refresh=240. Thus, driving two 64x64 matrices already seems to be the limit of what the hzeller library and a Pi4B can do, because of the many address lines that 64 x 64 matrices have.Show Less 2 months ago RGB LED Matrix Panel Drive Board For Raspberry Pi Chao Reviewer 3/5 Hi Roy, 1. Enable the I2C, please see here: https://w2.electrodragon.com/gollum/search?q=I2C-dat.md...Show More 2. Try the python demo code here: https://w2.electrodragon.com/gollum/search?q=CH423-dat.md Thank you!Show Less 2 months ago RGB LED Matrix Panel Drive Board For Raspberry Pi Updates #mailpoet_form_1 .mailpoet_form { } #mailpoet_form_1 form { margin-bottom: 0; } #mailpoet_form_1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mailpoet_form_1 .mailpoet_column_with_background { padding: 10px; } #mailpoet_form_1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mailpoet_for