full_description = "Payments, Quotation, Proforma InvoiceChao2023-12-21T00:37:57+08:00 1. Payment Options ONLINE PAYMENT OPTIONS:Paypal – Safe and common used online payment options. Also support credict cards payment. Credit Cart Payment via Stripe: Please find this option when you checkout. 2Checkout – support most credict card options Crypto Payment: Please email to in**@el***********.com for details Bank TransferIf you need a profoma invoice, please check 3 below We can only accept order value over 500 usd. 1.1 Credit Card Payment Via PaypalChoose “Pay with a debit or credit card, or PayPal Credit” (in the red box) on paypal checkout page if you want to use credit card (Optionally register paypal). You must choose paypal payment option firstly, and you will be re-directed to this paypal page. 2. Quotation, Buck Order When the product item has a buck order price, you will be able to see it the product description tab called “Buck order price” or “wholesale”. If you can not find it, please use the product inquiry form to send us a quotation email, we will add the buck order price on the product. If you need a distributor price, please contact us by email too. All the buck order still has to be placed online, this really help us to save a lot of manual work.3. Request Proforma Invoice 1. Place Pending OrderPlease place an pending order online first and email us, we will send you the proforma invoice later.You can place the order manually via our online store system with all your order details.2. Leave Pending Order By CancelWhen you click “place the order” on checkout page, and redirected to the paypal page.Simply click “cancel the order” on paypal page3. Futher ContactPlease email us to in**@el***********.com, or use contact page to let us know your pending order number."
