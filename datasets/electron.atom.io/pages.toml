title = "Electron's blog | Electron"
description = "Keep up to date with what's going on with the Electron project"
full_description = "Electron 34.0.0January 14, 2025 · 3 min readVerteDindeElectron 34.0.0 has been released! It includes upgrades to Chromium 132.0.6834.83, V8 13.2, and Node 20.18.1. The Electron team is excited to announce the release of Electron 34.0.0! You can install it with npm via npm install electron@latest or download it from our releases website. Continue reading for details about this release. If you have any feedback, please share it with us on Bluesky or Mastodon, or join our community Discord! Bugs and feature requests can be reported in Electron's issue tracker. Notable Changes​ Highlights​ Added WebFrameMain.collectJavaScriptCallStack() for accessing the JavaScript call stack of unresponsive renderers. #44938 Added APIs to manage shared dictionaries for compression efficiency using Brotli or ZStandard. The new APIs are session.getSharedDictionaryUsageInfo(), session.getSharedDictionaryInfo(options), session.clearSharedDictionaryCache(), and session.clearSharedDictionaryCacheForIsolationKey(options). #44950 Stack Changes​ Chromium 132.0.6834.83 New in 131 New in 132 Node 20.18.1 Node 20.18.1 blog post V8 13.2 Electron 34 upgrades Chromium from 130.0.6723.44 to 132.0.6834.83, Node from 20.18.0 to 20.18.1, and V8 from 13.0 to 13.2. New Features​ Added APIs to manage shared dictionaries for compression efficiency using Brotli or ZStandard. The new APIs are session.getSharedDictionaryUsageInfo(), session.getSharedDictionaryInfo(options), session.clearSharedDictionaryCache(), and session.clearSharedDictionaryCacheForIsolationKey(options). #44950 Added WebFrameMain.collectJavaScriptCallStack() for accessing the JavaScript call stack of unresponsive renderers. #44938 Added WebFrameMain.detached for frames in an unloading state. Added WebFrameMain.isDestroyed() to determine if a frame has been destroyed. Fixed webFrameMain.fromId(processId, frameId) returning a WebFrameMain instance which doesn't match the given parameters when the frame is unloading. #43473 Added error event in utility process to support diagnostic reports on V8 fatal errors. #43774 Feat: GPU accelerated shared texture offscreen rendering. #42953 Breaking Changes​ Behavior Changed: menu bar will be hidden during fullscreen on Windows​ This brings the behavior to parity with Linux. Prior behavior: Menu bar is still visible during fullscreen on Windows. New behavior: Menu bar is hidden during fullscreen on Windows. Correction: This was previously listed as a breaking change in Electron 33, but was first released in Electron 34. End of Support for 31.x.y​ Electron 31.x.y has reached end-of-support as per the project's support policy. Developers and applications are encouraged to upgrade to a newer version of Electron. E34 (Jan'25)E35 (Apr'25)E36 (Jun'25)34.x.y35.x.y36.x.y33.x.y34.x.y35.x.y32.x.y33.x.y34.x.y What's Next​ In the short term, you can expect the team to continue to focus on keeping up with the development of the major components that make up Electron, including Chromium, Node, and V8. You can find Electron's public timeline here. More information about future changes can be found on the Planned Breaking Changes page.Tags:Release"
