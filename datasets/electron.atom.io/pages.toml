title = "app | Electron"
description = "Control your application's event lifecycle."
full_description = "Main Process ModulesappOn this pageapp Control your application's event lifecycle. Process: Main The following example shows how to quit the application when the last window is closed: const { app } = require('electron')app.on('window-all-closed', () => { app.quit()}) Events​ The app object emits the following events: Event: 'will-finish-launching'​ Emitted when the application has finished basic startup. On Windows and Linux, the will-finish-launching event is the same as the ready event; on macOS, this event represents the applicationWillFinishLaunching notification of NSApplication. In most cases, you should do everything in the ready event handler. Event: 'ready'​ Returns: event Event launchInfo Record<string, any> | NotificationResponse macOS Emitted once, when Electron has finished initializing. On macOS, launchInfo holds the userInfo of the NSUserNotification or information from UNNotificationResponse that was used to open the application, if it was launched from Notification Center. You can also call app.isReady() to check if this event has already fired and app.whenReady() to get a Promise that is fulfilled when Electron is initialized. Note: The ready event is only fired after the main process has finished running the first tick of the event loop. If an Electron API needs to be called before the ready event, ensure that it is called synchronously in the top-level context of the main process. Event: 'window-all-closed'​ Emitted when all windows have been closed. If you do not subscribe to this event and all windows are closed, the default behavior is to quit the app; however, if you subscribe, you control whether the app quits or not. If the user pressed Cmd + Q, or the developer called app.quit(), Electron will first try to close all the windows and then emit the will-quit event, and in this case the window-all-closed event would not be emitted. Event: 'before-quit'​ Returns: event Event Emitted before the application starts closing its windows. Calling event.preventDefault() will prevent the default behavior, which is terminating the application. Note: If application quit was initiated by autoUpdater.quitAndInstall(), then before-quit is emitted after emitting close event on all windows and closing them. Note: On Windows, this event will not be emitted if the app is closed due to a shutdown/restart of the system or a user logout. Event: 'will-quit'​ Returns: event Event Emitted when all windows have been closed and the application will quit. Calling event.preventDefault() will prevent the default behavior, which is terminating the application. See the description of the window-all-closed event for the differences between the will-quit and window-all-closed events. Note: On Windows, this event will not be emitted if the app is closed due to a shutdown/restart of the system or a user logout. Event: 'quit'​ Returns: event Event exitCode Integer Emitted when the application is quitting. Note: On Windows, this event will not be emitted if the app is closed due to a shutdown/restart of the system or a user logout. Event: 'open-file' macOS​ Returns: event Event path string Emitted when the user wants to open a file with the application. The open-file event is usually emitted when the application is already open and the OS wants to reuse the application to open the file. open-file is also emitted when a file is dropped onto the dock and the application is not yet running. Make sure to listen for the open-file event very early in your application startup to handle this case (even before the ready event is emitted). You should call event.preventDefault() if you want to handle this event. On Windows, you have to parse process.argv (in the main process) to get the filepath. Event: 'open-url' macOS​ Returns: event Event url string Emitted when the user wants to open a URL with the application. Your application's Info.plist file must define the URL scheme within the CFBundleURLTypes key, and set NSPrincipalClass to AtomApplication. As with the open-file event, be sure to register a listener for the open-url event early in your application startup to detect if the application is being opened to handle a URL. If you register the listener in response to a ready event, you'll miss URLs that trigger the launch of your application. Event: 'activate' macOS​ Returns: event Event hasVisibleWindows boolean Emitted when the application is activated. Various actions can trigger this event, such as launching the application for the first time, attempting to re-launch the application when it's already running, or clicking on the application's dock or taskbar icon. Event: 'did-become-active' macOS​ Returns: event Event Emitted when the application becomes active. This differs from the activate event in that did-become-active is emitted every time the app becomes active, not only when Dock icon is clicked or application is re-launched. It is also emitted when a user switches to the app via the macOS App Switcher. Event: 'did-resign-active' macOS​ Returns: event Event Emitted when the app is no longer active and doesn’t have focus. This can be triggered, for example, by clicking on another application or by using the macOS App Switcher to switch to another application. Event: 'continue-activity' macOS​ Returns: event Event type string - A string identifying the activity. Maps to NSUserActivity.activityType. userInfo unknown - Contains app-specific state stored by the activity on another device. details Object webpageURL string (optional) - A string identifying the URL of the webpage accessed by the activity on another device, if available. Emitted during Handoff when an activity from a different device wants to be resumed. You should call event.preventDefault() if you want to handle this event. A user activity can be continued only in an app that has the same developer Team ID as the activity's source app and that supports the activity's type. Supported activity types are specified in the app's Info.plist under the NSUserActivityTypes key. Event: 'will-continue-activity' macOS​ Returns: event Event type string - A string identifying the activity. Maps to NSUserActivity.activityType. Emitted during Handoff before an activity from a different device wants to be resumed. You should call event.preventDefault() if you want to handle this event. Event: 'continue-activity-error' macOS​ Returns: event Event type string - A string identifying the activity. Maps to NSUserActivity.activityType. error string - A string with the error's localized description. Emitted during Handoff when an activity from a different device fails to be resumed. Event: 'activity-was-continued' macOS​ Returns: event Event type string - A string identifying the activity. Maps to NSUserActivity.activityType. userInfo unknown - Contains app-specific state stored by the activity. Emitted during Handoff after an activity from this device was successfully resumed on another one. Event: 'update-activity-state' macOS​ Returns: event Event type string - A string identifying the activity. Maps to NSUserActivity.activityType. userInfo unknown - Contains app-specific state stored by the activity. Emitted when Handoff is about to be resumed on another device. If you need to update the state to be transferred, you should call event.preventDefault() immediately, construct a new userInfo dictionary and call app.updateCurrentActivity() in a timely manner. Otherwise, the operation will fail and continue-activity-error will be called. Event: 'new-window-for-tab' macOS​ Returns: event Event Emitted when the user clicks the native macOS new tab button. The new tab button is only visible if the current BrowserWindow has a tabbingIdentifier Event: 'browser-window-blur'​ Returns: event Event window BrowserWindow Emitted when a browserWindow gets blurred. Event: 'browser-window-focus'​ Returns: event Event window BrowserWindow Emitted when a browserWindow gets focused. Event: 'browser-window-created'​ Returns: event Event window BrowserWindow Emitted when a new browserWindow is created. Event: 'web-contents-created'​ Returns: event Event webContents WebContents Emitted when a new webContents is created. Event: 'certificate-error'​ Returns: event Event webContents WebContents url string error string - The error code certificate Certificate callback Function isTrusted boolean - Whether to consider the certificate as trusted isMainFrame boolean Emitted when failed to verify the certificate for url, to trust the certificate you should prevent the default behavior with event.preventDefault() and call callback(true). const { app } = require('electron')app.on('certificate-error', (event, webContents, url, error, certificate, callback) => { if (url === 'https://github.com') { // Verification logic. event.preventDefault() callback(true) } else { callback(false) }}) Event: 'select-client-certificate'​ Returns: event Event webContents WebContents url URL certificateList Certificate[] callback Function certificate Certificate (optional) Emitted when a client certificate is requested. The url corresponds to the navigation entry requesting the client certificate and callback can be called with an entry filtered from the list. Using event.preventDefault() prevents the application from using the first certificate from the store. const { app } = require('electron')app.on('select-client-certificate', (event, webContents, url, list, callback) => { event.preventDefault() callback(list[0])}) Event: 'login'​ Returns: event Event webContents WebContents (optional) authenticationResponseDetails Object url URL pid number authInfo Object isProxy boolean scheme string host string port Integer realm string callback Function username string (optional) password string (optional) Emitted when webContents or Utility process wants to do basic auth. The default behavior is to cancel all authentications. To override this you should prevent the default behavior with event.preventDefault() and call callback(username, password) with the credentials. const { app } = require('electron')app.on('login', (event, webContents, details, authInfo, callback) => { event.preventDefault() callback('username', 'secret')}) If callback is called without a username or password, the authentication request will be cancelled and the authentication error will be returned to the page. Event: 'gpu-info-update'​ Emitted whenever there is a GPU info update. Event: 'render-process-gone'​ Returns: event Event webContents WebContents details RenderProcessGoneDetails Emitted when the renderer process unexpectedly disappears. This is normally because it was crashed or killed. Event: 'child-process-gone'​ Returns: event Event details Object type string - Process type. One of the following values: Utility Zygote Sandbox helper GPU Pepper Plugin Pepper Plugin Broker Unknown reason string - The reason the child process is gone. Possible values: clean-exit - Process exited with an exit code of zero abnormal-exit - Process exited with a non-zero exit code killed - Process was sent a SIGTERM or otherwise killed externally crashed - Process crashed oom - Process ran out of memory launch-failed - Process never successfully launched integrity-failure - Windows code integrity checks failed exitCode number - The exit code for the process (e.g. status from waitpid if on POSIX, from GetExitCodeProcess on Windows). serviceName string (optional) - The non-localized name of the process. name string (optional) - The name of the process. Examples for utility: Audio Service, Content Decryption Module Service, Network Service, Video Capture, etc. Emitted when the child process unexpectedly disappears. This is normally because it was crashed or killed. It does not include renderer processes. Event: 'accessibility-support-changed' macOS Windows​ Returns: event Event accessibilitySupportEnabled boolean - true when Chrome's accessibility support is enabled, false otherwise. Emitted when Chrome's accessibility support changes. This event fires when assistive technologies, such as screen readers, are enabled or disabled. See https://www.chromium.org/developers/design-documents/accessibility for more details. Event: 'session-created'​ Returns: session Session Emitted when Electron has created a new session. const { app } = require('electron')app.on('session-created', (session) => { console.log(session)}) Event: 'second-instance'​ Returns: event Event argv string[] - An array of the second instance's command line arguments workingDirectory string - The second instance's working directory additionalData unknown - A JSON object of additional data passed from the second instance This event will be emitted inside the primary instance of your application when a second instance has been executed and calls app.requestSingleInstanceLock(). argv is an Array of the second instance's command line arguments, and workingDirectory is its current working directory. Usually applications respond to this by making their primary window focused and non-minimized. Note: argv will not be exactly the same list of arguments as those passed to the second instance. The order might change and additional arguments might be appended. If you need to maintain the exact same arguments, it's advised to use additionalData instead. Note: If the second instance is started by a different user than the first, the argv array will not include the arguments. This event is guaranteed to be emitted after the ready event of app gets emitted. Note: Extra command line arguments might be added by Chromium, such as --original-process-start-time. Methods​ The app object has the following methods: Note: Some methods are only available on specific operating systems and are labeled as such. app.quit()​ Try to close all windows. The before-quit event will be emitted first. If all windows are successfully closed, the will-quit event will be emitted and by default the application will terminate. This method guarantees that all beforeunload and unload event handlers are correctly executed. It is possible that a window cancels the quitting by returning false in the beforeunload event handler. app.exit([exitCode])​ exitCode Integer (optional) Exits immediately with exitCode. exitCode defaults to 0. All windows will be closed immediately without asking the user, and the before-quit and will-quit events will not be emitted. app.relaunch([options])​ options Object (optional) args string[] (optional) execPath string (optional) Relaunches the app when the current instance exits. By default, the new instance will use the same working directory and command line arguments as the current instance. When args is specified, the args will be passed as the command line arguments instead. When execPath is specified, the execPath will be executed for the relaunch instead of the current app. Note that this method does not quit the app when executed. You have to call app.quit or app.exit after calling app.relaunch to make the app restart. When app.relaunch i"
