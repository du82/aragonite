["https://electron.atom.io/de"]
title = "Build cross-platform desktop apps with JavaScript, HTML, and CSS | Electron"
description = "Build cross-platform desktop apps with JavaScript, HTML, and CSS"
full_description = '''web-techWeb TechnologiesElectron embeds Chromium and Node.js to enable web developers to create desktop applications.cross-platformCross PlatformCompatible with macOS, Windows, and Linux, Electron apps run on three platforms across all supported architectures.open-sourceOpen SourceElectron is an open source project maintained by the OpenJS Foundation and an active community of contributors.Trusted by best-in-class appsPopular consumer and rock-solid enterprise apps use Electron to power their desktop experiences.Desktop development made easyElectron takes care of the hard parts so you can focus on the core of your application.Native graphical user interfacesInteract with your operating system's interfaces with Electron's main process APIs. Customize your application window appearance, control application menus, or alert users through dialogs or notifications.Automatic software updatesSend out software updates to your macOS and Windows users whenever you release a new version with Electron's autoUpdater module, powered by Squirrel.Application installersUse community-supported tooling to generate platform-specific tooling like Apple Disk Image (.dmg) on macOS, Windows Installer (.msi) on Windows, or RPM Package Manager (.rpm) on Linux.App store distributionDistribute your application to more users. Electron has first-class support for the Mac App Store (macOS), the Microsoft Store (Windows), or the Snap Store (Linux).Crash reportingAutomatically collect JavaScript and native crash data from your users with the crashReporter module. Use a third-party service to collect this data or set up your own on-premise Crashpad server.Use the tools you loveWith the power of modern Chromium, Electron gives you an unopinionated blank slate to build your app. Choose to integrate your favourite libraries and frameworks from the front-end ecosystem, or carve your own path with bespoke HTML code.ReactVue.jsNext.jsTailwind CSSBootstrapThree.jsAngularTypeScriptwebpackPlaywrightTesting LibrarySassNew!Electron ForgeElectron Forge is a batteries-included toolkit for building and publishing Electron apps. Get your Electron app started the right way with first-class support for JavaScript bundling and an extensible module ecosystem.Get startedSource code$ npm init electron-app@latest my-app✔ Locating custom template: "base"✔ Initializing directory✔ Preparing template✔ Initializing template✔ Installing template dependenciesDirect downloadInstallationIf you want to figure things out for yourself, you can install the Electron package directly from the npm registry.For a production-ready experience, install the latest stable version. If you want something a bit more experimental, try the prerelease or nightly channels.StablePrereleaseNightly$ npm install --save-dev electron@latest# Electron 34.3.0# Node 20.18.3# Chromium 132.0.6834.210Experiment with the APIElectron FiddleElectron Fiddle lets you create and play with small Electron experiments. It greets you with a quick-start template after opening — change a few things, choose the version of Electron you want to run it with, and play around.Save your Fiddle either as a GitHub Gist or to a local folder. Once pushed to GitHub, anyone can quickly try your Fiddle out by just entering it in the address bar.DownloadSource codeApps users love, built with ElectronThousands of organizations spanning all industries use Electron to build cross-platform software.1PasswordDiscordDropboxFigmaLoomSignalSkypeSlackNotionVS CodeMicrosoft TeamsAsanaGitHub DesktopitchMongoDB CompassObsidianOOMOL StudioPolypanePostmanSpliceScreen StudioTrelloTwitchSee more'''
year_published = 2025
