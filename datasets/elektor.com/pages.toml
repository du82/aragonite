full_description = '''Home Blogs Reviews Inspiring the Next Generation with Arduino Alvik .no-mobile #shopify-section-template--20400319791436__daa0ea99-ed78-4ff4-be3c-72843a36a4f9 .l4ft.hover-out > li:after { background: var(--dark); } @media only screen and (min-width: 47.5em) { #shopify-section-template--20400319791436__daa0ea99-ed78-4ff4-be3c-72843a36a4f9 .l4ft { margin-bottom: 34px; } } @media only screen and (max-width: 47.5em) { #shopify-section-template--20400319791436__daa0ea99-ed78-4ff4-be3c-72843a36a4f9 .l4ft { margin-bottom: 0; } #shopify-section-template--20400319791436__daa0ea99-ed78-4ff4-be3c-72843a36a4f9 .l4ft { margin-bottom: 30px; } } Inspiring the Next Generation with Arduino Alvik by Clemens Valens Reading time: 8 minIn our rapidly evolving, technology-driven society, the demand for technicians, engineers, and developers continues to rise. Addressing the challenge of recruiting and training these essential professionals is complex. Despite numerous initiatives to popularize science and technology and the creation of low-entry-level tools and platforms, the number of individuals pursuing careers in science, technology, engineering, or mathematics (STEM) remains insufficient. Incorporating the arts transforms the acronym to STEAM, highlighting the need for a broader skill set. Sparking Interest in Technology One way to nurture future engineers is by engaging children with fun, easy-to-use tools. The Arduino Alvik is designed to do just that, offering an innovative platform to ignite a passion for technology. What is the Arduino Alvik? The Arduino Alvik is a sleek, white, flat, square autonomous robot vehicle platform, measuring 9.6 cm by ___ cm (test your STEM skills by guessing the missing dimension!). It stands approximately 45 mm tall, as measured by the reviewer. The top features abstract blue graphics and a smiley face on the front, giving it an appealing and sturdy design. Exposed Electronics: A Double-Edged Sword A don't touch warning on an educational robot for children? One notable design feature of the Arduino Alvik is the exposed electronics of the Arduino Nano ESP32 board. Accompanied by a "do not touch" warning icon, this exposed setup can be concerning, especially for an educational robot intended for children. While the removable Nano board is essential as it acts as the main controller, providing Wi-Fi, Bluetooth, and battery charging capabilities, its sensitivity and crucial role in the robot’s functionality highlight a potential vulnerability. The Arduino Alvik is Equipped with Advanced Sensors The Arduino Alvik is equipped with a range of sensors and connectors to enhance its capabilities. The front features a Time-of-Flight (ToF) sensor, while the rear houses I²C connectors compatible with Qwiic (Sparkfun) and Grove (Seeed) formats, along with an On/Off slide switch and a pin header for connecting up to two servo motors. I²C-based extension connectors on the rear. Flipping the robot reveals a line-following sensor array positioned on the front. You'll also find an accelerometer, a color sensor with a bright white LED, and two small pushbuttons (Boot and Reset) nestled in a deep recess. These buttons are not intended for frequent use but are essential for specific functions. Replaceable Battery Compartment Bottom side. The bottom of the Arduino Alvik includes a battery cover, providing access to the removable 18650-type li-ion cell. This design allows teachers to keep spare charged batteries readily available, facilitating quick battery swaps during lessons to avoid any interruptions. Mechanical Extension Options The Arduino Alvik is equipped with two wheels and a metal-ball caster wheel to ensure stability. Each side of the robot features six mechanical extension holes: two are compatible with Lego Technic, and four are designed for M3-type screws. These holes allow for various mechanical attachments. Additionally, accessories can be mounted on top of the Alvik using the top fixing screws. The top side also includes two oval notches, although their specific purpose is not detailed. Touch-Sensitive Keypad and Connectivity The top side of the Arduino Alvik, which is actually the rear side of the main circuit board, features a capacitive touch keypad with seven keys: Up, Down, Left, Right, Enter, OK, and Cancel. Additionally, there are two RGB LEDs (DL1 & DL2) positioned above each wheel. The Alvik has a capacitive touch pad on the top side. The Nano board on the Alvik includes rows of holes along both sides, designed for use with breadboard wires (Dupont or jumper wires). This allows the Nano to interface with external circuitry on a breadboard or similar setups. Notably, the TX1 pin of the Nano board is not accessible through these holes, likely for specific design reasons. The remaining small holes on the board do not contain any sensors or LEDs; they serve as fixation and alignment points for components mounted on the opposite side of the board. Inside the Alvik, the large IC visible is the STM32 MCU. A peek at the insides of the Alvik. The large IC is the STM32 MCU. Getting Started with the Arduino Alvik After charging the battery (indicated by the LED on the Nano board) and powering on the robot, it may initially appear inactive, with only some LED flashing. However, once LEDs DL1 and DL2 turn blue, the robot enters standby mode, ready for input. Using the Up and Down keys, you can select from three demo modes: Red: Program a path for the robot to follow. Blue: Black line follower mode. Green: Hand follower mode. These demos are straightforward and functional, allowing immediate experimentation. While they are not groundbreaking, they offer a solid introduction to the robot's basic capabilities. Enterin the World of MicroPython After exploring the demo modes, the next step is to dive into MicroPython. This involves installing the Arduino Lab development environment to create custom Alvik programs. While this step can be challenging for newcomers to programming, it opens up a world of possibilities. Some of the free programming lessons. (source: Arduino) For those willing to take on the challenge, there are free programming lessons available. At the time of this review, there were eleven lessons, covering topics from basic LED blinking to finding a virtual charging station. All lessons are conducted in MicroPython, and a comprehensive beginner's course is also available to help you get started. School Plan for Extended Learning Additional courses can be accessed through the Arduino Cloud-based School Plan. Since this is a paid service and I do not have access, I was unable to review these courses. The Alvik (top left) is just a small part of an extended STEM curriculum. (source: Arduino) Other Programming Languages Despite extensive searching, I found limited technical information about programming the Alvik. While it is possible to use languages other than MicroPython, the exact process is unclear. Detailed documentation, such as schematics or communication protocols between the Nano and the STM32 MCU, would have been very helpful in this regard. Final Thoughts on the Arduino Alvik The Arduino Alvik is a captivating and meticulously crafted mobile robot platform, offering versatility, expandability, wireless features, and ample processing power for a variety of exciting experiments. Despite its relatively high price of around €150, the product is solid and well-designed. Adding a protective cover for the Nano board would enhance its durability and make it an even better investment. Is the Arduino Alvik a Game Changer? The Arduino Alvik aspires to be more than just a small robot, positioning itself as an educational game changer for STE(A)M training. However, it is challenging to see how it stands out in a crowded market, as the concept is not new and there are many similar products available. Enhancing Learning with AI Support Arduino has provided a significant amount of documentation and exercises for the Alvik, which is commendable. However, these materials are incomplete and focus solely on MicroPython. Including support for the Arduino platform itself, along with detailed information about the underlying hardware, would have been beneficial for users. It appears that the Alvik hardware was launched before the content producers were fully prepared. Introducing ChatGPT-like programming support could have been a valuable enhancement, further aiding in the learning process. Alvik keeps a happy face, even when its program isn't working. Is MicroPython the Key to Inspiration? It's challenging to see how introducing MicroPython code—or any programming language—will effectively inspire children (or anyone) to pursue careers in engineering, science, or art. Learning programming doesn't necessarily require robots: Take your bikeMount itStart pedalingRide to the shopGet off your bikeEnter the shopIf they have milk, buy one literElse, wait forever /* TODO: handle exceptions gracefully */Go home Now try rewriting this using a programming language of your choice without making a single typing mistake. Jeez! Sooo boring! What’s on TikTok? Tags Alvik Arduino Arduino News Education ESP32 MicroPython Review Robotics Share on: Share X Pin it Email'''
