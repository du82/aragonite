th the DSO3D12 is well-written, covering essential information. Trigger adjustments meet quality standards, and the scope includes an X-Y mode if needed. On-screen information is clear and user-friendly, contributing to the scope's high usability. Signal Generator Accessing the signal generator is simple: press the GEN button to open a control window on the screen. The generator offers a variety of waveforms, including sine, square, triangle, sawtooth, and noise, with the sine wave reaching up to 5 MHz. The fixed output level is 2.5 V, connected via small lugs near the BNC connectors. While a better output connector and adjustable voltage would be ideal, the generator is versatile and practical for signal tracing. Digital Multimeter (DMM) The DMM function includes high-quality probes with standard 4-mm banana connectors, allowing easy use of personal probes. It measures AC/DC voltage and current, resistance, capacitance, diode testing, and continuity. Comparing measurements with my Hantek scope showed less than 1% variance, indicating high accuracy. The DMM is user-friendly, with clear socket indicators on the display. However, the lack of fuses in the current ranges requires caution (figure 4). Figure 4. DMM range selection screen. DMM range selection screen is straightforward, enhancing usability. Voice Recognition and Additional Features I tested the DSO3D12’s undocumented voice recognition feature, activated by pressing Shift and CH1 V and saying "Hello Zeeweii". and it will respond with a friendly greeting and wait for your commands. The scope responded to commands, allowing changes in settings and mode switches. There's a good demo video and a longer one showcasing many other features of the unit. Additionally, there are several other undocumented features, such as a quick press of the On/Off switch bringing up a function menu, where you can select an option and then click Auto to display it in full-screen mode. The enclosed manual is decent, but an extensive online manual would be a valuable addition. Summary Pros: Multifunctional and offers excellent value for money. User-friendly with a variety of features. Cons: The sampling rate may limit high-frequency performance. Initial keyboard layout is not intuitive. The signal generator has limited output options. Lack of comprehensive documentation for all features. Overall, the Zeeweii DSO3D12 is a highly capable oscilloscope, especially considering its multifunctionality and affordability. While some areas could be improved, it performs admirably across various tests and applications. Tags Multifunction Multimeters Oscilloscope Review Signal Generator Share on: Share X Pin it Email'''
