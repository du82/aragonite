d in stores or online. Her cuddly and magical presence is perfect for snuggling and play. Shop Now Get Inspiration Still have questions? Visit our FAQ Section Step 3 Embrace the Magic Encourage children to interact with her, understanding that while she isn’t a Scout Elf or an Elf Pet, she complements their magic and adds magic to the holiday season. Shop Now Get Inspiration Still have questions? Visit our FAQ Section arrow_back_ios_newarrow_forward_ios Related Products Noorah® Plush Extraordinary Noorah: Santa’s Magical Arctic Fox Book Noorah® Action Figure Set Claus Couture Collection® Extraordinary Noorah® Dress Santaverse™ Ornament Collection The Noorah® BIG Bundle arrow_back_ios_newarrow_forward_ios Shop All Products Also Featured In Watch Her Music Videos Watch Here Download Her Songs Listen Here Family-Friendly Games Play Here Watch Her Movies Watch Here Embrace Santaverse™! The magic and mystery of the enchanted world of Santa Claus awaits! We’ve launched The Elf on the Shelf® Santaverse™, with all the fantastical characters you’ve come to love under one new brand name you can trust. Here the Scout Elves, Elf Pets, Elf Mates, Extraordinary Noorah, Bogies, and SnoBiggies have all united to deliver epic levels of Christmas cheer, and they each have their own stories to tell. Experience Santa’s epic fantasy world for yourself. Explore Santaverse Saint Nicholas Mrs. Claus Frost Pips Reindeer Arctic Foxes Saint Bernards Extraordinary Noorah Barry the St. Bernard Chefs Toy Makers Cobblers Little Grunt SnoBiggie Yetis Bogies arrow_back_ios_newarrow_forward_ios .santaverse-banner { position: relative; background: #0A1047; color: #BFC4CA; padding: 10px 0 25px; } .santaverse-banner .wp-block-eots-media-background { top: 0; } .santaverse-banner .text-col { max-width: 568px; margin: 0 auto 160px; } .santaverse-banner .text-col .wp-block-image { margin-bottom: 20px; } .santaverse-banner .santa-decorate { position: absolute; bottom: -170px; margin: 0; max-width: 100%; lef