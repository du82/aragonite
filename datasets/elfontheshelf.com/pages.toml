["https://elfontheshelf.com/blog/funny-elf-on-the-shelf-ideas-2022"]
title = "The Silliest Elf Ideas of All Time | The Elf on the Shelf"
description = "Scout Elves sure do love bringing a smile to your face! Joy is their specialty, so they’ve created six of the silliest elf ideas to show off their"
full_description = "Scout Elves sure do love bringing a smile to your face! Joy is their specialty, so they’ve created six of the silliest elf ideas to show off their laughter-making skills in your home. Did we mention these ideas are SUPER easy? These ideas can be completed with items that you may already have at home. New Eye-Pad “Eye” spy something silly! Materials: Notepad Googly eyes Adhesive Instructions: Your elf will find a notepad and googly eyes. Then the Scout Elf will adhere the googly eyes to the notepad to make an “eye-pad”.The elf will place the “eye-pad” where you can see it so everyone can have a laugh! For general and specific warnings please click HERE sELFie Session “I think we just found our new profile picture!” Materials: Cell phone camera Instructions: The Scout Elf will secretly use your cell phone. Then, they will flood your camera roll with sELFies! For general and specific warnings please click HERE Spa Station Pop-up Anyone need a spa day? Materials: Scout Elves at Play® Insta-moments Pop-up Spa Your favorite spa items Instructions: Your Scout Elf will prepare for spa day with the Insta-moments Pop-up™ Spa. Next, they will lay out several small spa items that their family can enjoy as well. Finally, take a day of rest! Have your own spa day so everyone can relax during this busy time of year! Buy Product For general and specific warnings please click HERE Ironing Out The Wrinkles “Don’t mind me. Just ironing out a few wrinkles!” Materials: Ruffled potato chips Regular potato chips Elf-sized ironing board and iron Instructions: Your Scout Elf will find ruffled and regular potato chips. Next, they will set up their elf-sized ironing board and iron. Then the elf will get to work ironing out all the wrinkles on the ruffled chips! For general and specific warnings please click HERE Elf Yourself “You look just like me!” Materials: Cardboard or poster board Colorful construction paper Adhesive Scissors Instructions: First, your Scout Elf will find a large piece of cardboard or poster board and cut a child-sized face hole in the middle. Next, they will cut red and white construction paper in their likeness and adhere it to the board. Finally, they will set up a photo station for silly Christmas pictures! For general and specific warnings please click HERE Keep the silliness going with these adorable elf ideas! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
