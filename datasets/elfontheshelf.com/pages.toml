["https://elfontheshelf.com/scout-elf-clothing"]
title = "Props & Clothes | The Elf on the Shelf"
description = "Elf Fun: Enjoy Popular Props and Clothes for Elftastic Fun! For busy elves who need fast and easy ideas and scene setups, our North Pole-official props"
