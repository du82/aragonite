["https://elfontheshelf.com/blog/celebrate-summer-with-christmas-in-july-ideas"]
title = "Celebrate Summer with Christmas in July Ideas | The Elf on the Shelf"
description = "Celebrate the sunny season with brand-new Christmas in July Ideas! Kids will be entertained all summer long by elftastic, warm-weather ideas their Scout Elf prepared just for them!"
full_description = "Hooray! Christmas in July has arrived, and Santa’s Scout Elves have come up with seven incredibly EASY ideas to keep kids entertained during this merry and bright summer season! DIY Suncatchers Capture the sun with these adorable DIY suncatchers! Materials: Paper coffee filters Scissors Paintbrush Yellow food coloring Optional: glitter, glue Instructions: To begin, your Scout Elf will lay three to four coffee filters flat and cut them into the shape of a heart. Next, they will use a paintbrush to gently paint a thin coat of yellow food coloring on top of the paper hearts. Then they will put a border of gold glitter all the way around the heart to make it sparkle! Next, your elf will hoist the hearts up and adhere them to a window where they can catch lots of sun. Finally, they will lay out all the materials so kids can join in on this adorable craft! For general and specific warnings please click HERE Scout Elf Popsicles “Pop!”, goes the Scout Elf! Materials: Small, oval-shaped candies Toothpicks Optional: small box shaped like an elf-size cooler, mini floral foam balls Instructions: First, your Scout Elf will take the small, oval-shaped candies and place them onto toothpicks (they should be careful not to hurt themselves when shortening the toothpicks!). Next, they will kick back with their “popsicles” and enjoy beating the summer heat! For general and specific warnings please click HERE Watermelon Christmas Trees “Mmmm…I can’t see the fruit for the trees! Ha Ha. Get it?” Materials: Watermelons Knife or cookie cutter Plate Instructions: Your Scout Elf will begin making their forest of watermelon Christmas trees by cutting one large watermelon down the middle short ways. Then, they will make one-to-two-inch cuts creating circular slices (Pro tip: the thicker the slice, the more likely the watermelon Christmas trees will stand on their own). Next, starting from the rind and cutting toward the center of each slice, your Scout Elf will cut a Christmas tree shape! They will then use extra pieces of the rind to create little stars posing as tree toppers. Lastly, they will place their watermelon Christmas trees on a platter and serve! For general and specific warnings please click HERE “I’m Bored” Activity Jar For the next “I’m bored!” Materials: Empty bowl or jar Scissors Cardstock/copy paper Marker Instructions: First, your Scout Elf will begin by cutting three-to-four-inch strips of paper. Then they will come up with several cheer-filled, enjoyable activities and write one down on each strip of paper and fold. Next, they will put all the activity papers into the jar for kids to pull out one–by-one throughout summer to fill their days with joy! For general and specific warnings please click HERE Christmas Countdown Santa Printable Let the countdown to Christmas BEGIN! Materials: Color printer Cardstock/ copy paper Scissors Printable Tape String Instructions: To begin, your Scout Elf will print and cut out the Christmas countdown printable. Next, they will cut four-to-five-inch strips of white paper. Then, week by week, they will watch as kids loop one strip of paper to create Santa’s “beard” by Christmastime! Get Printable For general and specific warnings please click HERE Melted Snowman I brought you a snowman from the North Pole! Materials: Clear jar Baby carrot Two rocks Water Optional: glycerin, buttons Instructions: Your Scout Elf will begin by filling a jar with water (Pro. tip: Add glycerin to make snowman features float). Then they will add the baby carrot, rocks and possibly some buttons to the jar. Next, they will set it out for kids to find and get a good giggle! For general and specific warnings please click HERE Merry & Bright Paperdoll Luau Grab your grass skirts and floral shirts—it’s time for a luau! Materials: Color printer Cardstock/ copy paper Printable Scissors Tape or glue dots Optional: pineapple, sunglasses, luau decorations Instructions: First, your Scout Elf will print and cut out the gingerbread people along with their clothing and accessories. Finally, they will enjoy a merry and bright luau while kids keep entertained with these paperdolls! Next, they will lay them out for kids to find. Get Printable For general and specific warnings please click HERE Want more ideas for making sunny season ELFTASTIC? Check these out! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
