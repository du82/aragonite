["https://elfontheshelf.com/blog/carry-christmas-cheer-with-scout-elf-carrier-ideas"]
title = "Carry Christmas Cheer with Scout Elf Carrier Ideas | The Elf on the Shelf"
description = "Carry Christmas cheer with you all season long with the Scout Elf Carrier! Enjoy games and activities anywhere you choose to go with your favorite Christmastime pal!"
full_description = "You asked Santa and he answered—his official Scout Elf Carrier is here! Scout Elves are always ready for an adventure, and they would love to share one with YOU. These elf ideas are great ways for your jolly little friend to travel with you from place to place all season long. Kids can safely carry their elves from home to a family member’s house, while out running errands, or when they and their families are out making merry memories! Make carrying your Scout Elf a breeze by creating your own crossbody strap, printing out adorable hangtags for every occasion, playing a fun game of car bingo and much more! Make a merry fashion statement! Make a merry fashion statement! Materials: Ribbon Adhesive Your favorite craft supplies: pom-poms, glitter, rhinestones, stickers etc. Instructions: Your Scout Elf will begin by cutting two to three feet of their favorite Christmas ribbon. Then they will set out craft supplies for kids to decorate the ribbon. Once finished decorating, kids will tie the strap to the Scout Elf Carrier handle to wear cross-body or over their shoulder. Finally, leave the Scout Elf Carrier where your elf can find it and they’ll climb inside for your next adventure! For general and specific warnings please click HERE Elf Carrier Printable Poems A sweet message for any day. Materials: Color printer Card stock/copy paper Get Printable Scissors Instructions: First, your elf will pick out the perfect poem for the day ahead. Next, they will print, cut and set it out beside their Scout Elf Carrier. Finally, they’ll wait in the carrier to be found and kids will discover what the Scout Elf has planned by reading the sweet message. Get Printable For general and specific warnings please click HERE Scout Elf Journal “On the road again…” Materials: Color printer Card stock/copy paper Get Printable Scissors Instructions: Your Scout Elf will print, cut and set out the bucket list journal. Then they will tuck themselves into their Scout Elf Carrier for the day’s adventure. Lastly, kids will use the travel journal to mark off each elftastic activity they participate in with their Scout Elf! Get Printable For general and specific warnings please click HERE Scout Elf Car Bingo Mark off what you see to win a cheerful round of car BINGO! Materials: Color printer Card stock/copy paper Get Printable Scissors Instructions: Scout Elves will print, cut and set out the car bingo boards and chips printables. Then they will climb into their Scout Elf Carrier ready to keep their eyes peeled for each item on the bingo cards! Get Printable For general and specific warnings please click HERE Silly Elf Hangtags “Catch ya later!” Use these extra cute hangtags to add variety to the assortment that comes with Santa’s Official Scout Elf Carrier. Materials: Color printer Card stock/copy paper Get Printable Scissors Instructions: First, your Scout Elf will print the Halloween scavenger hunt clues. Next, they will place them around your home for kids to find and follow. Finally, your elf will place themselves to be found in the final hiding place—in a cabinet with Halloween goodies! Get Printable For general and specific warnings please click HERE For more great ideas for Scout Elves and Elf Pets, look here! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
