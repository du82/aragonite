["https://elfontheshelf.com/blog/back-to-school-ideas"]
title = "3 Cute and Easy Back-To-School Ideas | The Elf on the Shelf"
description = "Scout Elves are preparing for a great school year ahead and want to share their ideas with you! Kids will love an ABCs breakfast before their first day, a sweet note in their lunchbox and a nice card for their teacher to kick this year off on the right foot. Let’s get to learning!"
full_description = "Scout Elves are preparing for a great school year ahead and want to share their ideas with you! Kids will love an ABCs breakfast before their first day, a sweet note in their lunchbox and a nice card for their teacher to kick this year off on the right foot. Let’s get to learning! ABCs Breakfast Ready to eat your ABCs? Materials: Apples Bacon Cream cheese and bagels Milk Eggs Your favorite fruits Color printer Cardstock/copy paper Printable Scissors Instructions: First, your Scout Elf will print, cut, and set out the sign announcing the ABCs breakfast! Then they will wash and prepare all the ‘A’pples and ‘F’ruit for the fruit salad. Next, they will cook the ‘B’acon, toast the bagels and spread with ‘C’ream cheese, and prepare the ‘E’ggs your favorite way! Then they will set out the milk, or ‘D’airy. Finally, they’ll enjoy this tasty ABCs breakfast with kids before their first day of school! Get Printable For general and specific warnings please click HERE Lunch Message It’s going to be a great school year! Remind kids with this printable message! Materials: Color printer Card stock/copy paper Printable Scissors Instructions: The Scout Elf will print and cut out the printable message. Next, they will place it inside a lunchbox so it can be read when kids get to school to remind them how great this school year will be! Get Printable For general and specific warnings please click HERE Gift for Teacher Hey, Teach, you’re A+! Materials: Color printer Card stock/copy paper Printable Scissors Instructions: Your Scout Elf will print and cut out the printable card. Next, they will set it out for kids to sign and give to their teacher as a cute first-day-of-school gift! Finally, Scout Elves and kids alike will encourage their teachers to join our Teacher Resource Center! Get Printable For general and specific warnings please click HERE Want more ELFTASTIC back-to-school ideas? Click here! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
author = "emiliejohnson"
