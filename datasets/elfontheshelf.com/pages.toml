["https://elfontheshelf.com/blog/props-set"]
title = "All-in-One 24-Day Kits of Easy Elf Ideas | The Elf on the Shelf"
description = "What do your Scout Elf friends love most during a very busy season of making you merry and bright? A set of fun props for 24 days of easy elf"
full_description = "What do your Scout Elf friends love most during a very busy season of making you merry and bright? A set of fun props for 24 days of easy elf ideas! With these Polar Props, found in the Ultimate Elf Ideas Kit (available at Walmart) and the Elf Ideas Super Set, Scout Elves will have their mittens full of scene-setting tools to make their families giggle. Each elf kit comes with a calendar and set of instructions to inspire 24 days of elf scenes, but if your Scout Elf is looking for EXTRA inventive (and silly!) ways to use these props, the add-on ideas below are sure to get their creativity soaring! Deck the Halls with Creepy Crawlies It’s a mini bug invasion but your clever Scout Elf can use the tennis racket as a handy-dandy bug zapper. What do you call a zapped fly? A flew! (Hee, hee.) Materials: Green Tennis Racket (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Plastic insects Paper and pens for sign Instructions: Your Scout Elf friend will hide 10 plastic bugs around the house. They will pose with one bug and leave a note instructing you to find the rest. For general and specific warnings please click HERE Is This How You Rock ’n Roll? Your Scout Elf is ready to rock ‘n’ roll! Did they get it right? Add some music for extra flair and introduce your Scout Elf to the school of rock! Materials: Green Rolling Pin (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) A rock from the garden Paper and pens for sign Instructions: Your Scout Elf friend will pose with the garden rock and the green rolling pin. They will write a note that says, “Is this how you rock ’n roll?” For general and specific warnings please click HERE Ice Cream Cone For Sale It’s a silly sale and your Scout Elf knows you’re game for it. Your elf may even add the foldable table to set up an ice cream cone stand, if they’re feeling like an extra good sport. Materials: Orange cones (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Balls (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Cherry tomato or grapes (optional as an additional ball) Table (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart), optional Paper and pens for sign Instructions: Your elf will create a sign announcing the sale. They will balance the balls on top of the wide end of the orange cones. They will pose with the cones and await a good sport to laugh at their joke. For general and specific warnings please click HERE “Cone” I Help You? Santa’s Scout Elf pals tell the best jokes. Materials: Orange cones (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Paper and pens for sign Instructions: Your elf will make a “Cone I help you get on Santa’s Nice List?” sign and place it next to them. They will place their hands inside the orange cones and wait to be discovered with their funny joke. They may report back to Santa who laughed and who did not! For general and specific warnings please click HERE DJ Sound Check Time to mix it up! Your Scout Elf pal is blending beats to get the whole family into the groove in this easy dance party scene. Materials: Table (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Headphones (from Polar Props Elf Ideas Super Set, or the Ultimate Elf Ideas Kit – available at Walmart) Printable turntable and speakers Tape or adhesive Instructions: Your elf will cut out, fold and tape the printable turntable and speakers. They will place the speakers and turntable on the table. Wearing the headphones, they will stand behind the table and begin taking requests. Time for a dance party! Get Printable For general and specific warnings please click HERE Create more easy props ideas from the Polar Props™ Cooking School Set blog! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
author = "emiliejohnson"
