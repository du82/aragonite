full_description = '''Creating Joyful Family Moments Welcome to the Official Home of The Elf on the Shelf®! Shop Now Elf Ideas .top-hero--section { position: relative; min-height: 640px; display: flex; align-items: center; justify-content: center; overflow: hidden; } .top-hero--section .wp-block-eots-media-background { left: 0; top: 0; } .top-hero--section .hero-corner { position: absolute; top: 0; left: 0;} .top-hero--content { position: relative; z-index: 1; max-width: 610px; padding: 0 1rem; } .top-hero--content .h2 { text-shadow: 0px 56px 80px rgba(0, 0, 0, 0.07), 0px 32px 32px rgba(0, 0, 0, 0.05), 0px 20px 20px rgba(0, 0, 0, 0.04), 0px 12px 10px rgba(0, 0, 0, 0.04); margin-bottom: 24px; font-size: 4.5rem;//72px } .top-hero--content .btn{ padding: 14px 16px; } .top-hero--content .btn-light-blue{ border: none; } @media (max-width: 767px){ .top-hero--section { padding-bottom: 32px; } .top-hero--content .h2 { font-size: 40px; } .top-hero--section .hero-corner { max-width: 50%; } } @media (max-width: 767px){ .top-hero--section { align-items: flex-start; min-height: none; } .top-hero--content { max-width: none !important; } .top-hero--section .wp-block-eots-media-background { position: relative !important; aspect-ratio: 16/9; width: 100vw; } } Learn more about Extraordinary Noorah featured in the Macy’s Thanksgiving Day Parade 2024 Learn More .site-promo-alert { background: #006156; color: #fff; padding: 20px 0; } .site-promo-alert .teots-container { position: static; } .site-promo-alert a{ color: #fff; text-decoration: underline; margin-left: 10px; } .site-promo-alert p:last-child { margin-bottom: 0; } What is The Elf on the Shelf®? The original elf, with its red and white suit, has been featured in films, on the stage, and even in the Macy’s Thanksgiving Day Parade. In homes, The Elf on the Shelf Scout Elf serves as a catalyst for joy as each adoptable Scout Elf, complete with a keepsake box and storybook, helps families and communities create priceless memories together through an interactive hide-and-seek game. Shop Now Learn More .bg-snowflake1 { background: url('https://media.elfontheshelf.com/wp-content/uploads/2024/08/snoflake1-scaled.webp') no-repeat center -66px; background-size: 100% auto; } .gold-border { border-radius: 8px; border: 2px solid #CDA761; padding: 12px; } .gold-border img{ border-radius: 0 !important; } Products for Crafting Holiday Joy The Elf on the Shelf® Tradition (6 Options) Noorah® Plush Extraordinary Noorah: Santa’s Magical Arctic Fox Book Elf Pets®: A Reindeer Tradition Elf Pets®: A Saint Bernard Tradition Elf Pets®: An Arctic Fox Tradition The Elf on the Shelf® Family Cookbook Spin & Soar 12-Day Countdown to Christmas arrow_back_ios_newarrow_forward_ios Shop All Products .product-gallery-section .wp-block-eots-media-background{ top: 0; } Why ChooseThe Elf on the Shelf®? When you choose an official Scout Elf from The Elf on the Shelf Santaverse you gain a like-minded, passionate elf community, registration and fandom opportunities, as well as a whole universe of engaging holiday-centric characters and story content which offer an authentic family experience you can’t get anywhere else. Makes Every Morning Magical Finding the elf in a playful, new spoteach day keeps the holidays full of excitement! Builds Family Bonds From reading the storybook to finding the elf, the tradition sparks endless laughs and conversation. Inspires Good Deeds & Smiles Always nice and never naughty, playful Scout Elves serve as role models that inspire children toward positive actions. Offers memories that lasta lifetime Every playful elf adventure sparks joyand builds memories you’llcherish forever. Rekindles nostalgia with a wholesome authenticity Our products are rooted in the innocence of believing and anchored in classic brand values of goodwill and joy. .cards-circle img{ margin-bottom: 16px; } .cards-circle .wp-block-heading { margin-bottom: 8px; } .cards-circle p { color: var(--text-subtle); } .cards-circle p:la