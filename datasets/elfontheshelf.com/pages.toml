["https://elfontheshelf.com/blog/blog-kitchen-elfontheshelf-ideas"]
title = "Cook up Fun with This Gallery of Kitchen Elf Ideas | The Elf on the Shelf"
description = "Calling all chefs—these kitchen Elf on the Shelf ideas will give your family something to “taco” ‘bout! View the gallery below to inspire your elf, so they can cook up fun in the kitchen. From funny kitchen elf scenes like Christmas paper-wrapped cabinets to themed dinner nights such as Taco Tuesday, to “LOL moments” like a mix-up in the egg carton, your family will belly laugh at the dinner table when they discover the scene their Scout Elf created in the kitchen."
full_description = "Calling all chefs—these kitchen Elf on the Shelf ideas will give your family something to “taco” ‘bout! View the gallery below to inspire your elf, so they can cook up fun in the kitchen. From funny kitchen elf scenes like Christmas paper-wrapped cabinets, to themed dinner nights such as Taco Tuesday, to “LOL moments” like a mix-up in the egg carton, your family will belly laugh at the dinner table when they discover the scene their Scout Elf created in the kitchen. The Elf on the Shelf® Taco Tuesday It’s Taco Tuesday, AKA the best dinner night of the week, and your Scout Elf is ready to chow down on a scrumptious meal. They even have a chocolate taco for dessert! Materials: Color printer Card stock/paper Printable Scissors Tape Instructions: Your elf will print and cut out the printable. Following the instructions, they will set up the taco truck, menu, signs and other décor. They will take a bite out of a taco and wait for you to join them for your own fantasTACO Tuesday dinner! Get Printable Kitchen Cabinet Wrap Up It’s a jolly holiday kitchen with this silly wrapping paper remodel, designed exclusively by your Scout Elf! Materials: Wrapping paper Scissors Tape Gift bows Instructions: Your elf will choose their favorite Christmas paper and get to work wrapping the kitchen cabinets, hoping for a chorus of morning giggles at this goofy surprise. Sweet Treats Takeover The forks and spoons have disappeared, and candy is on the menu when your elf rearranges the utensil drawer! Materials: Utensil holder for drawer Assortment of candy (peppermints, jelly beans, candy canes, etc.) Instructions: Your silly Scout Elf will replace the utensils with their favorite candy, leaving behind sweet treats for you to enjoy. Since Scout Elves match the personalities of their families, some may choose a different switch-out: healthy foods, unexpected items like toothbrushes or other funny surprises. Scrumptious Sweet Treat Soup Recipe Your Scout Elf is ready to mix it up in the kitchen. Their special recipe for Scrumptious Sweet Treat Soup satisfies all their candy cravings! Materials: Color printer Card stock/paper Printable Scissors Bowl Spoon Optional food items to match recipe Mini marshmallows Jelly beans Sprinkles Peppermints Cookies Candy canes Instructions: Your elf will print and cut out the printable. They will gather the ingredients necessary to whip up a bowl of Scrumptious Sweet Treat Soup. They will follow the recipe step by step. They will dig into their delicious dinner. Will you try a bite? Get Printable Fresh Cocoa Your Scout Elf determined there’s no better way to enjoy a fresh cup of cocoa than drinking straight from the source—a chocolate bar! Materials: Chocolate Bar Straw Tape Instructions: Your elf will tape a straw (to hold it in place) to a chocolate bar. They’ll sit back and sip on the fresh chocolate. Holiday Scramble An eggcellent surprise from your Scout Elf! Festive stickers and Christmas doodles make the morning merrier when you open the fridge. Materials: Refrigerator Carton of eggs Markers Christmas stickers Instructions: Your elf will gather markers and/or Christmas stickers and decorate the eggshells in the refrigerator. Scout Elves are eggs-perts at funny scenes like this! Magical Candy Portal Your Scout Elf set up a mystical North Pole portal and out popped an array of sweets! Oh my! Materials: Color printer Card stock/paper Printable Scissors Empty toilet paper roll Tape Candy Instructions: Your elf will print and cut out the printable. They will cut out the circle in the middle of the portal and insert an empty toilet paper roll in the hole. They will tape the circle back on the toilet paper roll. They will fill the toilet paper roll with enough candy to pour out of the center of the portal. Get Printable On the Menu Do curious kiddos ever wonder what their Elf Pets eat? Now they’ll know, thanks to this dinner lesson from their Scout Elf. Materials: Color printer Card stock/paper Printables (one of each Elf Pet) Scissors Elf Pets® Optional food to match each printable Oats Grapes Strawberries Blueberries Carrots Herbs Apples Moss Salmon Puppy chow Bone Brown rice Instructions: Your elf will print and cut out the printable for each Elf Pet. They will display the sign next to an assortment of food, so you can learn what an Elf Pet eats. Get Printables Freezer Skating Rink Winter sports are your Scout Elf’s favorite, but how will they fare when they try skating in the freezer? Materials: Color printer Card stock/paper Printable Scissors Straw Tape Cookie sheet Blue food coloring Water Mini candy canes Glue dots Instructions: Your elf will set up their skating rink by freezing a sheet of blue water. They will print and cut out the printable. They will tape the sign to a straw. Your elf will attach their mini candy cane ice skates to their feet and then test the waters to see how they’ll do! Get Printable Christmas Cookie Decorating Party You’re invited to a Christmas Cookie Decorating Party with your Scout Elf! See the details on this free printable party invitation. Materials: Claus Couture Collection® Yummy Cookie PJs Color printer Card stock/paper Printable Scissors Pen Cookie sheet Plain sugar cookies Icing Food coloring Cookie topings (ex: sprinkles, candy, etc.) Instructions: Your elf will put on their Yummy Cookie PJs. They will print and cut out the printable. They will fill in the invitation with all the party details. They will set up the necessary materials for cookie decorating and wait for you to join them for this special party! Get Printable If your family loves spending time together in the kitchen, check out Mrs. Claus’ recipes in the Sweet Treats corner. Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
