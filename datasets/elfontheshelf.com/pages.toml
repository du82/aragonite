["https://elfontheshelf.com/blog/elf-pets-ideas-2022"]
title = "‘My Pets And Me’ Elf Ideas | The Elf on the Shelf"
description = "Grab your pals with paws and get ready to deck the halls—Elf Pets® Ideas are here! Create a cute “gingerbread” house for your Saint Bernard, make a drink"
full_description = "Grab your pals with paws and get ready to deck the halls—Elf Pets® Ideas are here! Create a cute “gingerbread” house for your Saint Bernard, make a drink pack inspired by your reindeer, build a fort for your Arctic fox, and much more. No matter the idea, Elf Pets® always add so much joy to your Christmastime fun! Gingerbread House for Elf Pets® A house built almost well enough to eat! Materials: Color printer Card stock/copy paper Printable Scissors Markers or crayons Instructions: The Scout Elf will print and cut the printables. Next, they will set out markers or crayons for you to color in the gingerbread Saint Bernard house. Then they will arrange the printables to make a home decorated for Christmas for the Elf Pets® Saint Bernard! Get Printable For general and specific warnings please click HERE Cotton Ball Fort for Elf Pets® Arctic Fox Bundle up with your Elf Pets® Arctic Fox in a cozy snow fort. Materials: Elf Pets®: An Arctic Fox Tradition Cotton balls or buffalo snow Cardboard or Styrofoam Adhesive Instructions: First, the Scout Elf will create an igloo shape out of cardboard or Styrofoam.Next, they will arrange and adhere the cotton balls or buffalo snow around the igloo to look like a snow burrow.Finally, the elf will show the Elf Pets® Arctic Fox its new home for the winter! Buy Arctic Fox For general and specific warnings please click HERE Decorative Drink Packs You’ve found the perfect gift with these reindeer drink packs! Materials: Plastic piping bags Hot cocoa powder Mini marshmallows or other favorite hot cocoa toppings Pipe cleaners Googly eyes Pom-poms Instructions: Your Scout Elf will fill the piping bags with their favorite hot cocoa mix and toppings.Then they will tie off the bag with pipe cleaners cut and bent in the shape of reindeer antlers.Your Scout Elf will then adhere googly eyes and a pom-pom nose to make your hot cocoa packs look like the Elf Pets® Reindeer!Give these sweet treats to friends and family for Christmas! For general and specific warnings please click HERE Under the Sea Dive into Christmas joy! Materials: Color printer Cardstock/copy paper Printable Scissors Adhesive Instructions: The Scout Elf will print, cut, and adhere the ocean printables to a bathroom mirror.Then they will cut out the face holes so they can disguise themselves and an Elf Pet as a sea creature! Get Printable For general and specific warnings please click HERE Sack Race Ready, set, RACE! Materials: Brown paper lunch sacks Ribbon or tape Instructions: First, your Scout Elf will prepare brown paper lunch sacks for themselves and their friends.Next, they will set out a finish line on the floor made of tape or ribbon.Finally, the elf and their friends will race in their sacks to see who can finish first! For general and specific warnings please click HERE Check out another way to include your Elf Pets® this Christmas! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
