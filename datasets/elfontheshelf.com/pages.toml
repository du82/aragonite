["https://elfontheshelf.com/blog/the-elf-on-the-shelf-props-kit-2023"]
title = "Elf Ideas are Easier Than Ever with Polar Props™  | The Elf on the Shelf"
description = "Elf ideas have never been EASIER! The Elf on the Shelf pals are here with polarific props to help make setup and cleanup of their ideas as simple as ever."
full_description = "Elf ideas have never been EASIER! The Elf on the Shelf pals are here with polarific props to help make setup and cleanup of their ideas as simple as ever. Your elf will show up to your family’s home with the Polar Props™ Cooking School Set and get cookin’! Let’s Get Cookin’ Materials: Polar Props™ Cooking School Set Small bag Optional: paper, handwritten message: “I’m here! Let’s get cooking!” Instructions: Your Scout Elf friend will appear to arrive at your family’s home with a sack full of props just like Santa! They will spread out the props to show they have a lot of ideas in mind for the days ahead. Your elf may even leave out a handwritten message saying, “I’m here! Let’s get cooking!” For general and specific warnings please click HERE A Balanced Meal Materials: Polar Props™ burger, fries, shake and cupcake Optional: paper, handwritten message: “A perfectly balanced meal!” Instructions: To begin, your elf will look for a place to best balance themselves. Then they will take the burger and fries in one hand and the shake and fries in the other. Lastly, they may leave a handwritten message talking about their silly skills! For general and specific warnings please click HERE Bake-Off Battle Royale Materials: Polar Props™ muffin tin, rolling pin, saucepan and lid Optional: Elf Pets® Saint Bernard (or other), other toys Instructions: To begin, your elf will use the muffin tin and rolling pin as a pretend shield and sword. Next, they may find an Elf Pets® pal to join their team. Their pal will use the saucepan and lid. Finally, they will set the stage for a friendly duel! For general and specific warnings please click HERE ‘Lettuce’ Eat Materials: Lettuce Polar Props™ burger Optional: paper, handwritten message: “Lettuce eat!” Instructions: First, your Scout Elf helper will seek out a piece or whole head of lettuce! Then they will write the silly joke, “Lettuce eat!” on a piece of paper and wait for kids’ giggles! For general and specific warnings please click HERE An ‘Egg-cellent’ Dish Materials: Polar Props™ saucepan and egg Real eggs Optional: paper, handwritten message: “I think you’re ‘egg-cellent’!” Instructions: Your Scout Elf will begin this idea by gathering up a few real eggs—careful not to crack them! Next, they will write, “I think you’re ‘egg-cellent’!” on a piece of paper. Finally, they will gather up their saucepan and egg and give kids this wonderful compliment! For general and specific warnings please click HERE Cooking Class Materials: Polar Props™ computer, backpack and cooking tools Optional: paper, handwritten message: “Last night, I went to cooking class!” Instructions: First, your Scout Elf helper will gather a few baking tool props from their kit and set them up on the counter. Second, they will put on their prop backpack and set their laptop somewhere close to them as if they are watching a recipe video. Finally, they may set out a handwritten message card that says, “Last night, I went to cooking class!” For general and specific warnings please click HERE Sprinkle Magic Materials: Polar Props™ cupcakes, muffin tin and mixer Sprinkles Optional: paper, handwritten message: “Sprinkle a little magic into your day!” Instructions: To begin, your Scout Elf friend will spread a few cupcake sprinkles around the kitchen counter. Next, they will gather up their prop cupcakes, muffin tin and mixer and set them close by. Finally, they may leave a message card letting kids know that they’ve sprinkled a little magic into their day! For general and specific warnings please click HERE Get a glimpse of more elftastic products that can help make Christmas merry and bright! Before you or your elf get to work recreating any of these inspirational photos, be sure to read these safety warnings. Santa wants to make sure everyone stays safe!"
