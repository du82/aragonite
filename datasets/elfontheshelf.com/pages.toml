["https://elfontheshelf.com/blog/get-personalized-keepsake-letters-from-your-elf"]
title = "Get Personalized, Keepsake Letters from Your Elf | The Elf on the Shelf"
description = "Want an elf-written, keepsake letter for your child, from your own elf, any month of the year?  Scout Elves love cozying up by Santa’s fireplace to"
full_description = "Want an elf-written, keepsake letter for your child, from your own elf, any month of the year? Scout Elves love cozying up by Santa’s fireplace to write letters. Elftastigram™ letters are the only official personalized letters — written, signed, stamped, and sealed at the North Pole by your elf, then delivered straight to families’ homes! With so many options like Elf Arrival Letters, Elf Check-In Letters, Elf Departure Letters and Birthday Letters from Your Elf, each featuring three different customizable messages, your elf will enjoy writing multiple letters throughout the year. It’s super easy, too! Just choose an elf letter and confirm a few small specifics to be sure your elf has your child’s most current details, and then your Scout Elf will get right to work to ensure your little one’s ElftastiGram is picture-perfect and full of merry magic. Get ElftastiGram Go behind the scenes to see some of our elves in action as they share a tip or two for creating the perfect elf letter: Scout Elf Lollisugardonut puts the finishing flourishes on what will certainly be an exuberant Elf Arrival Letter for the Johnson family. She’s sending TWO letters, addressing one to each child in her family so they both get their own card in the mailbox at the same time! Scout Elf Big Papa composes a playful Elf Check-In Letter for his very favorite 3rd grader in Calistoga, CA! He plans to send it at least two weeks before he wants it to arrive in the mail. Scout Elf Zipper Noodledink works on a Birthday Letter for his #1 fan, who turns 6 this year. His birthday isn’t until next month, so he’ll send his letter about two weeks before the big celebration in hopes that it will arrive just in time. Scout Elf Twinkle Toes put some just-right touches on her Elf Departure Letter for Rayleigh Faith, which she’ll seal with a kiss and send to her kiddo at season’s end—but not before she includes a fun set of peppermint-scented stickers in the envelope as a surprise! ElftastiGram is the only note to your child that is officially written by Santa’s elves and endorsed by Santa himself. Tag us on social media with #ElftastiGram and share your child’s joy at receiving mail from their very own elf! Get ElftastiGram Santa’s Scout Elves also work in the mailroom to receive all the letters children send to the North Pole each year. Go behind the scenes with the “Letters to Santa” music video and download the single for your holiday playlist!"
