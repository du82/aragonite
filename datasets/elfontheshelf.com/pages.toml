indness in their barrels and deliver it back to the North Pole, helping Santa and his Scout Elves spread holiday cheer. Their special story highlights their role in keeping Christmas magic alive. Shop Now .cards-icon-list { height: unset !important; overflow: visible !important; margin-left: -4px !important; margin-right: -4px !important; } .cards-icon-list .swiper-wrapper { align-items: stretch; } .cards-icon-list .swiper-slide { padding: 0 4px; height: unset; } @media (min-width: 768px){ .cards-icon-list .swiper-slide { padding: 0 12px; } .cards-icon-list { margin-left: -12px !important; margin-right: -12px !important; } } .cards-icon-list .swiper-slide > .wp-block-group__inner-container, .cards-icon-list .swiper-slide > .wp-block-group__inner-container > .wp-block-group > .wp-block-group__inner-container { height: 100%; } .cards-icon-list .swiper-slide > .wp-block-group__inner-container > .wp-block-group{ height: 100%; } .cards-icon-list .swiper-slide > .wp-block-group__inner-container .wp-block-image + .wp-block-group{ height: calc(100% - 107px); } .cards-icon-list .wp-block-group.purple, .cards-icon-list .wp-block-group.yellow, .cards-icon-list .wp-block-group.blue, .cards-icon-list .wp-block-group.green { border-radius: 12px; padding: 140px 24px 32px 24px; } .cards-icon-list .wp-block-group.purple .wp-block-group__inner-container, .cards-icon-list .wp-block-group.yellow .wp-block-group__inner-container, .cards-icon-list .wp-block-group.blue .wp-block-group__inner-container, .cards-icon-list .wp-block-group.green .wp-block-group__inner-container { display: flex; flex-direction: column; } .cards-icon-list .wp-block-group.purple{ background: #CFDAEF; } .cards-icon-list .wp-block-group.yellow{ background: #F1F6CC; } .cards-icon-list .wp-block-group.blue{ background: #B4DADF; } .cards-icon-list .wp-block-group.green{ background: #B7E1CB; } .cards-icon-list .wp-block-image { width: 193px; margin: 0 auto -93px; } .cards-icon-list .h5 { margin-bottom: 32px; } .cards-i