full_description = 'Elf Origins: Learn All About Us! The Elf on the Shelf—where magic meets tradition and joyful family moments flourish! Discover the story behind our beloved elf, learn more about our company and creators, explore our products and partnerships, or get help with your questions. Shop Now Our Company Our Promise To You Whether you’ve come to know us through The Elf on the Shelf or our enchanting Santaverse, we promise to craft stories, products, entertainment, and experiences with care, in order to bring joy and meaningful moments to your family and loved ones. Together, we hope to help you create magical memories that last a lifetime. – Co-Founders, The Lumistella Company Learn more Our Story, Origins, Partnerships and Social Impact Explore the history of The Elf on the Shelf and the tradition’s visionary entrepreneurs, find out how to partner with us or learn about philanthropy and social responsibility here at The Lumistella Company, the family-owned company behind the magic. Visit our company Partner with us Our Brand is aGlobal Phenomenon Our partnerships with global brands and shout-outs from devoted celebrities made The Elf on the Shelf a media darling. The holiday wonder we bring created a worldwide symbol of family celebration and made The Elf on the Shelf a top five holiday character. Learn more Haven’t Found What You’re Looking For? Contact us Visit FAQ Embrace Santaverse™! The magic and mystery of the enchanted world of Santa Claus awaits! We’ve launched The Elf on the Shelf® Santaverse™, with all the fantastical characters you’ve come to love under one new brand name you can trust. Here the Scout Elves, Elf Pets, Elf Mates, Extraordinary Noorah, Bogies, and SnoBiggies have all united to deliver epic levels of Christmas cheer, and they each have their own stories to tell. Experience Santa’s epic fantasy world for yourself. Explore Santaverse Saint Nicholas Mrs. Claus Frost Pips Reindeer Arctic Foxes Saint Bernards Extraordinary Noorah Barr