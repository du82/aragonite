["https://eliandgeorgia.com/things"]
title = "Things to Do · Eli & Georgia"
description = "Saturday, July 29, 2023 in Stowe, VT, we'll be getting celebrating our marriage. Come celebrate!"
full_description = "Things To DoActivitiesAuto Toll RoadDrive to the top of Mt. Mansfield to take in the sights from the comfort of your car.Ben and Jerry's FactoryTake a tour of everyone's favorite ice cream factory, grab a scoop from the Scoop Shop, and pay your respects at the Flavor Graveyard.Shelburne FarmsTake a stroll through this 1,400 acre property full of fields, farms, and walking trails. This is where we got engaged!Sterling Pond HikeMake your way up Smugglers' Notch to a scenic pond in the sky on this moderate 2-mile out-and-back hike.Stowe BowlGrab a Focal Banger from the bar and get in a few frames. Do your best at getting turkey legs before heading over to Stowe Golf Park!Stowe Golf ParkGet 18 holes of mini golf in, just outside of Sun & Ski Inn and Suites and Stowe Bowl.Stowe Mountain ResortThis is Stowe's main attraction during ski season, but in the summer you can still take the gondola to the top of the mountain for a scenic view.Stowe Recreation PathOn this winding 5.3-mile walking trail that goes from Stowe center to our wedding site, stop off at all Mountain Road has to offer while closing your rings.Trapp Family LodgeExperience a bit of Austria in the heart of Vermont! Stroll through the gardens, go for a hike, or play a game of disc golf while taking in the mountain views.Food and DrinkFoam BrewersPerhaps Burlington's best brewery, this one is worth driving to! And if you’ll be in the area for more than just the weekend, swing by on Tuesday for DJ night or Thursday for jazz night.Idletyme Brewing CompanyCome for the drinks, stay for the vibes! Idletyme’s large backyard is a fun place to hang, whether you’re getting a beer, some bar bites, or a full meal.PiecassoRight in the heart of Stowe, this pizzeria is a great place to share a pie with friends and family, particularly if you can snag a table on the patio!Prohibition PigPro Pig’s restaurant and adjoining brewery offer two different menus, so grab a bite and a beer at whichever suits your fancy! If you eat at the brewery, we highly recommend the nachos.The Alchemist BreweryEli's favorite brewery! Go grab the (former) number one beer in the world, Heady Topper, in their backyard, open 11am-6pm daily.The Blackback PubThis unassuming pub is home to the best beer menu in the area. Sip your way through all of Vermont's best breweries at this Waterbury institution.von Trapp Brewery & BierhallJust up the road from the Trapp Family Lodge, the von Trapps’ bierhall is a great place to grab a Hefeweizen, a bratwurst, and other Austrian fare.Woodland Baking and CoffeeA lovely coffee shop right on Mountain Road, Woodland makes some unique breakfast bites and delicious joe."
