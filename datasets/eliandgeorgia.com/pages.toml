["https://eliandgeorgia.com/faq"]
title = "FAQ · Eli & Georgia"
description = "Saturday, July 29, 2023 in Stowe, VT, we'll be getting celebrating our marriage. Come celebrate!"
full_description = '''FAQHow do I RSVP?As of June 10th, RSVPs are now closed. If you have a change in plans, please reach out to us directly.Can I bring a date or a plus-one?Your wedding invitation will indicate if you have a plus-one. As space at the venue is limited, we ask that you check your invitation before inviting a guest!Are kids invited?Kids of all ages will be welcome at the ancillary events of the weekend (e.g., the Welcome Party and Farewell Brunch), but we will be unable to accommodate children aged 10 and under at our ceremony and reception. Our venue has recommended two hotel sitting services for any parents looking to hire someone for the day of the wedding: Vermont Nanny Connection and Sitter Scout.What should I wear?The wedding is a formal event, so feel free to get glitzed and glammed up! Be sure to wear something you'll be comfortable dancing in, and keep in mind that it will be an outdoor wedding in the middle of summer. Think mid-length dresses and summer suits. 🕺💃What are your wedding colors?Our colors are slate blue, champagne and dusty rose, with gold and rose gold accents.Will the wedding be indoors or outdoors?The ceremony will take place outdoors and will be uncovered, weather-permitting. The reception will be in an open-sided tent right next to the ceremony area, with space to hang out outside of the tent.What's the weather like in Stowe, VT in July?Summer days in Vermont are quite warm, with highs in the low 80's. The evenings cool off some, with lows reaching high 50's to low 60's. Be sure to bring sun protection, as we hope for a sun-filled wedding day!Is there a dress code for the welcome party?No dress code for the welcome party! We know that most of you will be arriving on Friday, so feel free to stay in your travel clothes. Just be mindful that we will likely take some informal photos at the welcome party.Will there be food at the welcome party?There will be light snacks, but please eat dinner beforehand.Is it okay to take pictures with my phone or camera during the wedding ceremony?We ask that you refrain from taking personal photos or videos so you can be fully present during the ceremony and reception. Our photographers will take care of capturing the day, and we'll be sure to share photos afterwards!What vendors helped you put together such a lovely day?To see a full list of our vendors, visit the "Vendors" page. Special thanks to Liz Seward at Topnotch Resort for all of her guidance, organization and diligence!'''
