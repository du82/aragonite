["https://eliandgeorgia.com/travel"]
title = "Travel · Eli & Georgia"
description = "Saturday, July 29, 2023 in Stowe, VT, we'll be getting celebrating our marriage. Come celebrate!"
full_description = "TravelLodgingWe recommend booking as soon as possible, as lodging will fill up!🥂 Topnotch ResortThis is where the weekend's events will be taking place!We've secured a 10% discount at Topnotch, applicable to rooms, suites, and town homes.Book lodging at Topnotch through our custom link to get the Luddecke-Perkins Wedding room rate. Discounted lodging options will say “LUDDE Applied”.For those looking for group lodging, not only are there suites and resort homes available through our custom link, but some resort homes are privately owned and are available through Airbnb or Vrbo.🏔 Tälta LodgeTälta Lodge is a 2 minute drive or a 10-15 minute walk from Topnotch. It's right along the Stowe Recreation Path, so a fun option for those who like to stay active!A shuttle will be transporting guests between Tälta and Topnotch before and after the wedding. See more details on our Schedule page.We've secured a block of rooms with discounted rates at Tälta. Call Tälta Lodge at (802) 253-7525 and mention the “Perkins Room Block” to get our discounted rates.Our room block at Tälta has been 100% booked, meaning there are no remaining discounted rooms there. However, there may be rooms still available outside of our block.🎳 Sun & Ski Inn and SuitesThis is a quaint hotel that's a 5 minute drive from Topnotch, with a bowling alley and mini golf on site!A shuttle will be transporting guests between Sun & Ski and Topnotch before and after the wedding. See more details on our Schedule page.We've secured a discounted rate at Sun & Ski. Book lodging at Sun & Ski through our custom link to get the Perkins-Luddecke Wedding room rate.Our discount code has expired, but there are still plenty of rooms available at Sun & Ski!🍁 Green Mountain InnGreen Mountain Inn is a historic hotel on Main Street, right in the heart of Stowe. We stayed here the first time we came to Stowe as a couple!A shuttle will be transporting guests between Green Mountain Inn and Topnotch before and after the wedding. See more details on our Schedule page.Book lodging at Green Mountain Inn through their website.🏡 Airbnb or VrboIf Airbnb or Vrbo is more your style, there are plenty of listings around the Stowe area, but we still recommend booking early so you can find something near the venue!Getting Here✈️ By planeThe closest airport to Stowe is Burlington International Airport (BTV), but there are a few other options in the area. By distance:Burlington International Airport (BTV) - 45 min drive to StoweManchester - Boston Regional Airport (MHT) - 2.5 hour drive to StoweLogan Airport (BOS), Bradley International (BDL), or Albany International (ALB) - 3.5 hour drive to StoweRideshare services are readily available in the Burlington area, but it may take 5-10 minutes for drivers to arrive.🚞 By trainLooking to take the scenic route on your way up to Stowe? Amtrak's Vermonter train line stops right next door in Waterbury, at the Waterbury-Stowe Train Station.The train services:Washington, DCPhiladelphia, PANew York, NY (Penn Station)Stamford, New Haven, and Hartford, CTBrattleboro, VTWaterbury-Stowe, VT🚗 By automobileMost folks driving into Stowe from the rest of New England will likely take I-89 to VT-100, going through Waterbury on the way.Google Maps directions to Topnotch Resort will do a better job getting you into Stowe than our written directions will. 😅Parking throughout Stowe is plentiful, so there shouldn't be any concerns about where to park. Be sure to ask your hotel about any additional costs associated with parking if you're booking outside of our room blocks."
