full_description = '''Eli Perkins@eliperkins on GitHubEli Perkins on LinkedInContact Eli by Email@eliperkins on Blueksy@eliperkins on Threads@eliperkins on MastodonI'm an iOS engineer in Denver, by way of NYC and Boston. I'm currently working at GitHub as a staff software engineer, working mainly on GitHub Mobile, and supporting GitHub Desktop and GitHub CLI.Sometimes I write about things on my blog. I'm a big fan of open source, whether it be in Swift, Ruby, Go or whatever fun language or tool is out there.I'm a fan of craft beer 🍻 , coffee ☕️, and esports 👾.If you're curious and want to know more, get in touch 👋.ProjectsI started working on iOS apps in 2009. Since then, I've worked on a myriad of projects, some of which I'm particularly proud of.GitHubThe world’s development platform, in your pocket. Bringing GitHub collaboration tools to your small screens.ShortcutProject management platform for software teams, balancing simplicity and structure.VenmoConnecting the world and empowering people through payments.RobinMaking offices smarter with presence-powered automation.EitherThe internet’s largest game of "Would you rather...?"TalksUnlocking Static Type Superpowers with GraphQL IntrospectionGitHub Africa/GraphQL Berlin 2021Fastlane + React NativeReact Native RadioNote: I no longer use, contribute or work with React Native.Why Static Typing MattersEmpireConf 2017Staters Gonna StateUIKonf 2015WritingI've written for other blogs and sites than my own over the years. Here's a few I'm proud of.How GitHub reduced testing time for iOS apps with new runner featuresGitHubWhy Write ADRsGitHubHow Clubhouse.io used Objective-C + the Sentry React Native Integration for Post-Launch Error TrackingNote: I no longer use, contribute or work with React Native.SentryRead more of my own writing on my personal blog'''
