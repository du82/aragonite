["https://elisaheikura.fi/sanat-luovat-todellisuuden"]
title = "Sanat luovat todellisuuden | Elisa Heikura"
description = "Aamulehden avauksesta seurannut paskamyrsky on tuonut diskurssianalyytikon minussa jälleen lempiaiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää…"
full_description = "Kirjoitettu 18.9.2017Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Sanat luovat todellisuuden Sanat luovat todellisuuden Olen pitkään, todella pitkään, siis aivan liian pitkään, pyöritellyt päässäni artikkelia kielen vallasta. Olin saanut aikaiseksi pelkän ingressin, joka meni näin: ”Ampumalla sinua päähän, lopettaisin luultavasti maallisen taipaleesi. Ampumalla päähäsi ajatuksia, minulla on valta muuttaa maallisen taipaleesi kulkua. Näistä jälkimmäinen on nähdäkseni tuhoisampaa.” On selvää, että yritin syödä elefantin. Aamulehden avauksesta seurannut paskamyrsky on kuitenkin tuonut diskurssianalyytikon minussa jälleen aiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää, että sillä on merkitystä, millaista kieltä käytämme. Ajatuksista tulee tekoja Margaret Thatcherin suusta on kuultu (tai suuhun on pantu) yksi vaikuttavimpia sitaatteja, joihin olen kuunaan törmännyt: “Watch your thoughts, they become words; watch your words, they become actions; watch your actions, they become habits; watch your habits, they become character; watch your character, for it becomes your destiny.” Nyt on tärkeää muistaa, että voimme ajatella vain sillä kielellä, jonka olemme oppineet. On selvää, että jos käytössämme on kieli, joka ei tunne tulevaisuutta, käsittelemme nykyisyyttä hyvin eri tavalla. On yhtä lailla selvää, että voimme käsittää maailmaa – konkreettisesti – vain niiden käsitteiden kautta, jotka meillä on käytössämme. Kielen, ajattelun, tajunnan ja alitajunnan suhde on mystinen – ainakin minulle. En siksi voi suoranaisesti väittää, että sana palomies, ohjaa ammatin pariin enemmän poikia kuin tyttöjä. Maalaisjärjellä ajateltuna miten se ei kuitenkaan voisi olla vaikuttamatta? Ja jos meillä on edes teoriassa mahdollisuus muuttaa maailmaa tasa-arvoisemmaksi ja vähemmän rajoittavaksi pelkästään sanavalintoja muuttamalla, minkä ihmeen takia emme tekisi sitä? Mutta kun perustuslaki, naispiispa ja asemies Ymmärrän, että laissa on käytetty muotoa puhemies tai poliisimies. Ymmärrän myös Sanna Ukkolan asiallisen kritiikin, kuinka naurettavaa on uutisoida sukupuolineutraaleista termeistä ja samassa julkaisussa puhua naispiispasta ja asemiehestä. Mutta jos mistään ei aloita, ei mihinkään pääse. Nämä kielemme tavat eivät muutu hetkessä, mutta ainakaan ne eivät muutu siten, että kukaan ei rohkene aloittaa. Ukkolan kritiikkiin samankaltaisen vastauksen antoi myös Ellun Kanat. Voi olla perusteltua käyttää toisinaan muotoa puhemies, jos muutoin uutinen on sekava. En kuitenkaan näe mitään perustelua yrittää olla käyttämättä sukupuolineutraaleja ammattinimikkeitä aina, kun se on mahdollista. Miksi kieli on valtaa? Tutkin aikanaan kandissani perhe-termiä Kari Hotakaisen Sydänkohtauksia-romaanissa. Perhe ja ydinperhe ovat latautuneita termejä aikana, jolloin erilaisia perhemalleja on enemmän kuin koskaan. Antamalla merkityksiä kielelle, termeille määrittelemme samalla mikä on hyvää tai oikein, mikä on normaalia tai sallittu. Ajattele itse, mitä ymmärrät sanalla perhe ja miltä tuntuisi kuulua perheeseen, joka ei määritelmääsi mahdu. Valitsemalla ketkä saavat äänen, miten asioista puhutaan ja miten niitä nimitetään, teemme valintoja ja suljemme ulos. Se on välttämätöntä arkemme ja viestintämme mahdollistamiseksi. Mutta se on myös vallankäyttöä, jota on vaikea huomata, ellei siihen erityisesti kiinnitä huomiota. Aamulehden avaus on rohkea ja tervetullut. Se ei ole aukoton eikä ongelmaton. Se tuskin muuttanee mitään kertaheitolla, mutta mikä muutos koskaan olisi niin tehnyt? Silti on pakko kysyä. Ketä oikeasti satuttaa se, että poliisimies on poliisi ja lakimies on juristi? Ketä haittaa, että palomies on pelastaja? Kenelle on jotenkin hankalaa se, että ei ole enää esimiehiä, vaan johtajia, päälliköitä, pomoja ja tiiminvetäjiä? Jos sinulle on, niin kerro minulle miksi. Artikkeli kategoriassa Ajatteleminen, Filosofia, Jyrähdys, Kulttuuri, Viestintä Avainsanat Aamulehti, Debatti, Diskurssi, Kieli, Kyseenalaistaminen, Sukupuoli, Tasa-arvo, Uudelleenajattelu"
