["https://elisaheikura.fi/jos-mun-pitaa-pyytaa-niin-sa-et-oikeasti-tarkoita-sita"]
title = "Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä | Elisa Heikura"
description = "Jos mun pitää pyytää sua tekemään jotain ja sä sitten teet, niin ei se ole sama asia – ei sillä ole samanlaista arvoa? Bullshit."
full_description = "Kirjoitettu 4.3.2019Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä Aloitetaan siitä, että minulla on tähän näkökulmaan yhden sanan vastaus ja se on: BULLSHIT. Istuin iltateellä miespuolisen ystäväni kanssa, joka kiemurteli tuolillaan särkyneen sydämensä riivaamana. Hänen ihmissuhteensa oli katkeamispisteessä. Kaikki se aika, vaiva, rakkaus, yhteinen arki ja elämä oli katoamaisillaan. Hän kertoi, kuinka ei osaa käsitellä naistaan naisen haluamalla tavalla. Toisin kuin ehkä joku toinen mies, tämä mies oli kuitenkin kysynyt naiseltaan apua. Pyytänyt tätä kertomaan, mitä tarvitsee ja miten sen tarvitsee. Yrittänyt kysyä jokaisen solmun kohdalla, mitä tein väärin ja miten minun olisi pitänyt toimia. Ja mitä tähän vastasi nainen? Jos mun pitää sulle kertoo, sä et tunne mua lainkaan. Jos mun pitää pyytää sua tekemään jotain ja sä sitten teet, niin ei se ole sama asia – ei sillä ole samanlaista arvoa. Jos mun pitää pyytää, sä et oikeasti tarkoita sitä. Nyt jos leikitään, että tämä olisi yhdessä yli 50 vuotta eläneen pariskunnan 100 000. keskustelu, niin ehkäpä juu noin. (Ja jos olen ihan rehellinen, olen sitä mieltä, ettei siltikään vieläkään noin.) Mutta tämä oli toki vain muutaman vuoden yhteiselon lopputulos. Ei hyvänen päivää nyt sitten Ajatus siitä, että puolison pitäisi ajatuksia lukemalla yksinkertaisesti tietää mitä toinen joka hetki haluaa, tarvitsee tai kaipaa on niin järjetön, että ellen olisi itse joskus ollut (ja toisina päivinä edelleen olisi) ihan samanlainen nainen, en pystyisi käsittämään, miten jotain noin käsittämätöntä on koskaan kenenkään kuuppa päässyt tuottamaan. Se lienee joku kulttuurinen hypnoosi, jossa romanttisten komedioiden marinoimat aivomme kuvittelevat, että kerran puolisolle toiveistamme kerrottuamme se toinen mystisesti aina ja ikuisesti muistaa – tai arvaa oikein kertomattakin. Tai että se toinen koko ajan on virittäytyneenä sellaiselle taajuudelle, jossa hän ei mitään muuta teekään, kuin havainnoi minun tarpeitani ja toiveitani. Joita en kerro. Enkä edes vihjaa. Tai jos vihjaan, niin epämääräisesti. Ja sitten tuhahtelen. Ja vastaan, että ”ei mikään” tai ”kyllä sun pitäis tietää”, kun toinen yrittää viimein selvittää, että mitähän videota täällä nyt tällä kertaa on meneillään. Puhumattakaan siitä, että jos toinen tekee jotain, koska pyydän, se menettäisi jotenkin arvonsa. Tietysti on ihan mieletöntä, jos kumppani tajuaa täyttää toiveeni jo ennen kuin pyydän. Tai ennen kuin ehdin itsekään tajuta, että minulla jokin tarve tai toive on. Tietysti ne yllätykset ja pyytämättä saapuvat hellyydenosoitukset ovat kertaluokkaa ihanampia. Mutta että pyydetyllä teolla ei olisi arvoa? Bullshit. No okei, yksi pieni poikkeus tähän on On olemassa yksi selitys, miksi joku saattaisi perustellusti päätyä sanomaan, että ”jos mun pitää pyytää, niin sä et tarkoita sitä”. Se menee näin. Pyytäminen ei ole helppoa, koska siinä täytyy asettaa itsensä torjutuksi tulemisen uhan alle ja se vaatii aukinaisena ja haavoittuvaisena olemista. Se vaatii rohkeutta. Jos toinen osoittaa mieletöntä rohkeutta ja pyytää jotain, kumppani ei saa täyttää tuota toivetta selvästi vastentahtoisesti. Siinä käy huonosti ja esimerkki auttanee valaisemaan asiaa. Puoliso A pyytää puolisolta B esimerkiksi vaikka että ”voisitko rapsuttaa minua”. Jos puoliso B tuhisee kiukkuisena ja turhautuneena, mutta silti vastentahtoisesti ja hajamielisesti rapsuttaa toista, niin se ei palvele ketään eikä mitään. Pyytäjä kokee lähinnä huonoa omatuntoa pyynnöstään, eikä saa edes haluamaansa eli rakastavaa, hellää rapsutusta. Kuka hitto pyytäisi toiselta, että voisitko vähän sinne päin, kiukkuisesti ja vastentahtoisesti ikään kuin rapsuttaa minua? Tällaisesta tapahtumaketjusta tulee nimenomaan sellainen olo, että ”jos minun täytyy pyytää, sinä et tarkoita sitä”. Jos taas puoliso B sanoo, että ”tottakai rakas, tuu lähemmäs, niin mä yletän” ja todella tarkoittaa sitä, niin silloin pyytäjällä ei pitäisi olla mitään syytä kokea, että teolla ei olisi arvoa. No entä jos sitten puoliso B ei siinä hetkessä kerta kaikkiaan jaksaisi rapsuttaa? On meneillään joku jännä Twitter-debatti, johon tarvitsee molemmat kädet tai tekee mieli mieluummin heittää palloa koiralle? Silloin ei siis kannata lopettaa omaa hommaa ja kärsimättömän turhautuneen kiukkuisesti toteuttaa toisen pyyntöä. On paljon parempi sanoa, että: ”Rakas, just nyt on pikkuisen huono hetki, kun on Twitter-debatti käynnissä. Sopiiko, että rapsutan sua kummallakin kädellä ja keskittyneesti illalla ennen kuin mennään nukkumaan ennemmin kuin nyt vasemmalla kädellä?” Onko puolisosi ajatustenlukija? Oletko sattunut saamaan puolisoksesi ajatuksia lukevan superihmisen, joka aina joka tilanteessa osaa täyttää toiveesi ja tarpeesi juuri niin kuin haluat? Onnittelen. Pidä lujasti kiinni, äläkä ikinä päästä irti. Entä oletko sattunut saamaan puolisoksesi jommankumman näistä tyypeistä: 1) Se tyyppi, joka tulee kysymään, mitä sinä tarvitset ja kaipaat. Se, joka pyytää sinua auttamaan häntä täyttämään sinun tarpeesi ja toiveesi kertomalla niistä. 2) Se tyyppi, joka kertoo avoimesti ja jolla on riittävästi rohkeutta pyytää, kun jotain tarvitsee tai toivoo. Aika onnekas olet sinäkin. Artikkeli kategoriassa Kulttuuri, Viestintä Avainsanat Ajatustenlukija, Kommunikaatio, Parisuhde"
author = "Kirjoittaja Elisa Heikura"
