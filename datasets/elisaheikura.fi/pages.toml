["https://elisaheikura.fi/sytytetaan-tulet-pitkin-rantoja"]
title = "Sytytetään tulet pitkin rantoja | Elisa Heikura"
description = "Riko mun rytmi / tuhoo harmonia / seuraa mun jälkii / peitä ne, ettei voida palata / hiivi mun takana / tanssi mun mukana / kulje mun varjona / hyppää mun takia” -Pariisin Kevät…"
full_description = "Kirjoitettu 29.1.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Sytytetään tulet pitkin rantoja Sytytetään tulet pitkin rantoja ”Riko mun rytmi / tuhoo harmonia / seuraa mun jälkii / peitä ne, ettei voida palata / hiivi mun takana / tanssi mun mukana / kulje mun varjona / hyppää mun takia” -Pariisin Kevät (kuuntele biisi, se on hypnoottinen: Spotify/YouTube) Kerroin hiljattain Facebookille, että minulla ei ole vähääkään stressiä. Päivitystä oli pakko pohjustaa sanoin ”uskookohan kukaan, jos sanon”, koska olen ollut stressaantunut niin kauan kuin kukaan pystyy muistamaan. Ei traagista, ei koomista, ihan normaalia minulle. Mutta nyt, tadaa, ei stressiä. Mitä tapahtui? Olen ollut aina suoritusorientoitunut ihminen. Hyvässä ja pahassa. Olen noudattanut ja täyttänyt rooleja: olen ollut tai ainakin yrittänyt olla hyvä tytär, sisko, ystävä, koulukaveri, opiskelija, työntekijä, kollega, tyttöystävä, avovaimo ja yhtiökumppani. HUOM (tämä on tärkeää)! Lähestulkoon mitään näistä rooleista ei ole annettu minulle ulkoa, olen ihan itse rakennellut ne itselleni. Ja sitten suorittanut niin maan perkeleesti. Niin kauan kaikki meni ihan hienosti, kun olin sinkku, eikä ollut yritystä. Kun lopulta otin itselleni roolitehtävät myös iltoihin, viikonloppuihin ja lomiin, kulutin itseni henkiseen loppuun. Lopulta väsähdin. Onneksi tein ratkaisuja jo ennen kuin olisi käynyt hullusti. Kaikessa kamaluudessaan tämä väsähtäminen oli ihan selkeästi parasta, mitä minulle olisi voinut tapahtua. Sen myötä aloin rimpuilla irti omista ajatusvankiloistani. En kyseenalaistanut vain viimeisimpänä omaksumiani rooleja vaan ihan joka ikisen roolin, johon olen itseni elämäni aikana tunkenut. Joka ikisen. Sillä samalla sekuntin siunaamalla myös stressi lakkasi. Kun uusi vuosi vaihtui, uusi valkea syttyi. Yhtäkkiä asiat kipinöivät minussa. Tunnen poltetta asioihin, jotka ovat pitkään olleet pelkkää puuduttavaa halkojen hakkaamista. Kyseenalaistan asioita lakkaamatta ja löydän vastauksia, joista pidän ja joista en pidä. Nuo vastaukset ohjaavat minua eteenpäin pakottamatta. Koen tarvetta sytytellä tulia myös muita varten ja muiden kanssa. Sytytetään tulet pitkin rantoja. Artikkeli kategoriassa Yleinen"
