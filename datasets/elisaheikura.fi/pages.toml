["https://elisaheikura.fi/avainsanat/pohdinta"]
title = "Avainsana: Pohdinta | Elisa Heikura"
full_description = "Kirjoitettu 10.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Onko sinulla taipumusta tuijottaa viestiä ja miettiä, että mitähän tuo lähettäjä tällä oikein tarkoittaa? Entä onko sinulla tapana etsiä metatason viestejä sanottujen sanojen takana? Minulla on ollut, koska olen tällainen kielen tasoihin ja monimerkityksellisyyteen rakastunut ja huonohkolla itsetunnolla riivattu ylianalysoija. Mutta tiiäks mitä olen tässä hiljattain – vaihteeksi – tajunnut? Se on maailman turhinta ja typerintä hommaa. Se on myös yksi niitä asioita, joka vie kaiken hapen elämästä ja vieraannuttaa ihmisen hetkestä. Se uuvuttaa myös ne, jotka yrittävät meille jotain viestiä. Jaa että mitä että? No annahan kun yritän selittää. Lue lisää Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Artikkeli kategoriassa Viestintä Avainsanat ihmisyys, Meta, Pohdinta, Uudelleenajattelu, Viestintä Kirjoitettu 2.4.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Malja jokaiselle mäelle ja yksi ystävälle Malja jokaiselle mäelle ja yksi ystävälle Isälläni oli yritys. Mummollani kahvila. Ukkini myi päivätyönsä ohessa kaikkea vakuutuksista rapuihin. Ellen väärin muista, isoukkini oli suutari. Ja toisella puolen sukuhaaraa on maanviljelijöitä. Voisi ehkä sanoa, että päätös yrittäjäksi ryhtymisestä oli vain ajan kysymys ja tavallaan se olisi totta. Mutta tosiasiassa se ei ole totta ollenkaan. Tästä rohkeudesta ja päättäväisyydestä on enimmäkseen kiittäminen yhtä ihmistä elämässäni, nimittäin Janne Jääskeläistä. Lue lisää Malja jokaiselle mäelle ja yksi ystävälle Artikkeli kategoriassa Yleinen, Yrittäjyys Avainsanat asiantuntija, Elämän tarkoitus, Elisa, Pohdinta Kirjoitettu 16.12.2015Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Kaamosmöngintää Kaamosmöngintää Kaamosaika saa minussa näemmä esiin elämän kyseenalaistajan. En koe olevani kaamosmasentunut tai -lamaantunut. Tunnen vain sitä olemassaolon tuskaa, joka osaavammissa käsissä taipuisi runoiksi tai maalauksiksi. Valtaosaa meistä ajavat tietyt olemassaolon kysymykset: Miksi olemme olemassa? Mikä on elämän tarkoitus? Mitä on hyvä elämä? Lue lisää Kaamosmöngintää Artikkeli kategoriassa Filosofia, Yleinen Avainsanat Elämän tarkoitus, Elisa, Kyseenalaistaminen, Pohdinta"
