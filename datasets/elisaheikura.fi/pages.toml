["https://elisaheikura.fi/avainsanat/kehittyminen"]
title = "Avainsana: Kehittyminen | Elisa Heikura"
full_description = "Kirjoitettu 1.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Varo hopealuoteja ja yhden totuuden messiaita Varo hopealuoteja ja yhden totuuden messiaita En tiedä mistä nauttisin enemmän, kuin hurmaantumisesta. Hurmaantuminen on tietenkin äärettömän vaarallista, sillä pelkästään rakkaus ei ole sokea. Hurmion lähinäkö on myös aivan olematon. Yksi hurmion sivuvaikutus on haloefekti, joka saa aikaan sen, että hetken aikaa tämän maan päällä tallustaa olento, joka tuntuu mie-let-tö-män ylitsepääsemättömältä. Romanttisessa mielessä mieletön ylitsepääsemättömyys näyttäytyy siten, että toista ei voi lakata ajattelemasta edes unissaan. Hänestä ei kerta kaikkiaan meinaa päästä millään yli, useimmat eivät haluakaan. Kun kaksi ihmistä ei halua päästä yli toisistaan, niin sitä kutsuttaneen parisuhteeksi. Mutta oletko koskaan kokenut platonista hurmiota? Se se vasta hurja kuvio onkin. Lue lisää Varo hopealuoteja ja yhden totuuden messiaita Artikkeli kategoriassa Ajatteleminen, Kulttuuri Avainsanat Guru, Hopealuoti, Hurmio, Kasvu, Kehittyminen"
