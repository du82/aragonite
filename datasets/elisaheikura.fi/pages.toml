title = "Avainsana: Prosessi | Elisa Heikura"
full_description = "Kirjoitettu 18.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Miten niin tämä ei muka tule tänään valmiiksi? Miten niin tämä ei muka tule tänään valmiiksi? Olen äärimmäisen huono sietämään keskeneräistä työtä. Se on luonnollisesti yhtä paljon siunaus kuin se on kirouskin. Ilta-aurinko on alkanut laskea jo aikaa sitten ja silti minä ehdotan kummitädille, että josko kuitenkin haravoitaisiin tämä pelto loppuun. Eihän tätä nyt enää niin montaa kymmentä metriä ole jäljellä… Muuttolaatikot on aina käytännössä päivässä, parissa purettu. Puu-urakat tehdään kerralla liiteriin. Auringonpistoksen seurauksena saatan oksentaa koko seuraavan yön, mutta kun on kerran aloitettu, niin nurmikko leikataan kyllä todellakin loppuun asti. Mutta ne uunipellit? Lue lisää Miten niin tämä ei muka tule tänään valmiiksi? Artikkeli kategoriassa Ajatteleminen Avainsanat Kärsivällisyys, Oivallus, Prosessi, Siivoaminen"
