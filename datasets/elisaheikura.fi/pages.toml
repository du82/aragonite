title = "Avainsana: Demoni | Elisa Heikura"
full_description = "Kirjoitettu 6.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Mitä eroa on pelolla ja demonilla? Mitä eroa on pelolla ja demonilla? Pelko on ihmiskehon normaali reaktio, selviytymisstrategia. Sen tehtävä on valpastuttaa. Herää nainen, nyt tarkkana. Jotain vaarallista voi tapahtua, ellet ole juuri nyt varuillasi. Pelko on viesti. Demoni sen sijaan? Se valehtelee. Lue lisää Mitä eroa on pelolla ja demonilla? Artikkeli kategoriassa Ajatteleminen Avainsanat Demoni, Oivallus, Pelko Kirjoitettu 3.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Hylis ja riittis kävivät kylässä taas tällä viikolla Hylis ja riittis kävivät kylässä taas tällä viikolla Elämässäni on kaksi demonia. Toinen käy kylässä harvoin, mutta on valtava. Syö tyhjäksi kaikki energiavarastot, viskoo järjestyksen pitkin seiniä ja lamaannuttaa minut kuin syödyksi tulemista odottavan saaliseläimen. Toinen vierailee luonani vähän väliä. Se ei ole ihan niin kookas, mutta se on sitkeä. Se juttelee ilkeämielisesti ja saa minut epäilemään ja epäröimään. Se imee ilon, uskon ja rakkauden. Näistä ensimmäinen on hylätyksi tulemisen pelko ja jälkimmäinen on riittämättömyyden pelko. Olen antanut niille nimet hylis ja riittis. Lue lisää Hylis ja riittis kävivät kylässä taas tällä viikolla Artikkeli kategoriassa Ajatteleminen Avainsanat Demoni, Pelko, Riittämättömyys"
