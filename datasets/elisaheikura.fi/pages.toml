["https://elisaheikura.fi/kategoriat/viestinta/filosofia"]
title = "Kategoria: Filosofia | Elisa Heikura"
full_description = "Kirjoitettu 8.10.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Teko on yhdentekevä Teko on yhdentekevä Yksi päivä päässäni muljahti. Ymmärsin, kuinka tarkoitus- ja teko-orientoituneita olemme. Käytämme ihan käsittämättömiä määriä aikaa ja energiaa puhuaksemme siitä, mitä joku teki tai jätti tekemättä – sekä yllättävän paljon myös siitä, mitkä olivat ihmisen aikeet tekojen takana. Sehän on se kuuluisa tarkoitus, kun ne keinot pyhittää, vai mitä? Jos asiaa kuitenkin tarkastelee tarkemmin, niin mahtaako teolla itsellään olla ihan yhtään mitään merkitystä? Entä, jos ne ovatkin ne seuraukset, joihin meidän pitäisi kiinnittää katseemme. Lue lisää Teko on yhdentekevä Artikkeli kategoriassa Ajatteleminen, Filosofia Avainsanat Palaute, Seuraus, Teko, Viestintä Kirjoitettu 18.9.2017Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Sanat luovat todellisuuden Sanat luovat todellisuuden Olen pitkään, todella pitkään, siis aivan liian pitkään, pyöritellyt päässäni artikkelia kielen vallasta. Olin saanut aikaiseksi pelkän ingressin, joka meni näin: ”Ampumalla sinua päähän, lopettaisin luultavasti maallisen taipaleesi. Ampumalla päähäsi ajatuksia, minulla on valta muuttaa maallisen taipaleesi kulkua. Näistä jälkimmäinen on nähdäkseni tuhoisampaa.” On selvää, että yritin syödä elefantin. Aamulehden avauksesta seurannut paskamyrsky on kuitenkin tuonut diskurssianalyytikon minussa jälleen aiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää, että sillä on merkitystä, millaista kieltä käytämme. Lue lisää Sanat luovat todellisuuden Artikkeli kategoriassa Ajatteleminen, Filosofia, Jyrähdys, Kulttuuri, Viestintä Avainsanat Aamulehti, Debatti, Diskurssi, Kieli, Kyseenalaistaminen, Sukupuoli, Tasa-arvo, Uudelleenajattelu Kirjoitettu 27.12.2016Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Mitä tahansa kestää aina kymmenen sekuntia kerrallaan Mitä tahansa kestää aina kymmenen sekuntia kerrallaan ”Vuosi 2016 ei tosiaan ole ollut juuri kenenkään lempivuosi”, kirjoittaa kollegani Noora Stapleton. Ei ole ei. Itse asiassa vilkutan vuodelle 2016 tuntematta minkäänlaista ystävällistä haikeutta. Vuosi on kuitenkin vahvistanut hauskan populaarikulttuuriteorian, jonka elämääni toi Netflix-sarja Unbreakable Kimmy Schmidt. Spoilaamatta liikoja avaan sarjan ideaa tämän verran: tarina kertoo nuoresta naisesta, joka on viettänyt 15 vuotta elämästään bunkkerissa maan alla hullun uskonlahkon kidnappaamana. Bunkkerissa ollessaan Kimmyn on väännettävä valtavaa kampea tuottaakseen (tietämättään) sähköä lahkon johtajan viihdelaitteisiin. Tehtävä on uuvuttava ja yksitoikkoinen. Kun Kimmylta kysytään, miten hän jaksoi vääntää kampea tuntikausia, hän vastaa: ”I learned a long time ago that a person can stand just about anything for 10 seconds, then you just start on a new 10 seconds. All you’ve got to do is take it 10 seconds at a time.” Tämähän pätee sitten kokolailla ihan kaikkeen. Lue lisää Mitä tahansa kestää aina kymmenen sekuntia kerrallaan Artikkeli kategoriassa Filosofia, Yleinen Avainsanat Elisa, Uudelleenajattelu"
