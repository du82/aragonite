["https://elisaheikura.fi/ai-tan-ei-pitaiskaan-olla-ruskea"]
title = "Ai tän ei pitäiskään olla ruskea | Elisa Heikura"
description = "Ajatus tunnin päivässä siivoamisesta tökki aivolohkojani mielenkiintoisella tavalla. Kauanko kestäisi, ettei olisi enää mitään siivottavaa?"
full_description = "Kirjoitettu 15.9.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai tän ei pitäiskään olla ruskea Ai tän ei pitäiskään olla ruskea Viimeksi kun uumoilin, että seuraavakin hurahtamisen kohteeni olisi epäilemättä jollain tavalla hippiä, en silti villeimmissä kuvitelmissanikaan voinut aavistaa, että hurahdan seuraavaksi siivoamiseen. Kas kun minä vihaan siivoamista. Se on nähdäkseni kotitöistä se kaikkein ääliömäisin ja älyttömin. Siivota pitää vähän väliä, ja ihan kohta on taas sotkuista. Loputon suo, joka ei tuota mitään iloa. Paitsi sitten kun tuntikausien kidutuksen jälkeen on puhdasta, se on ihan kiva. Vartin. Sitten on taas sotkuista. Olen ollut valmis ulkoistamaan kotini siivouksen jo hyvän tovin. Mutta nyt? Noh, kuten Instagram-horinoitani seuraavat tietävät, siivoan about tunnin päivässä. Melkein joka päivä. Siis käytän vapaaehtoisesti yli 5 % valveillaoloajastani siivoten. Joka päivä! Ja ikään kuin nautinkin siitä vielä. Kaikki lähti siitä, kun ryhdyin katsomaan YouTubessa entisen stand-up-koomikko Kyle Ceasen videoita. Kyle on päättänyt meditoida vuoden ajan joka päivä kaksi tuntia ja siivota tunnin. Hän tekee päivittäin koetuksestaan videon ja päivän 40 kohdalla hän alkaa olla jo melko mielenkiintoisissa sfääreissä. Ajatus tunnin päivässä siivoamisesta tökki aivolohkojani mielenkiintoisella tavalla. Ryhdyin miettimään, että jos tosiaan siivoaisi tunnin päivässä joka päivä, kauanko kestäisi, että tulisi vastaan ensimmäinen päivä, ettei olisi kerrassaan mitään siivottavaa. Ehkä jouluksi on valmista Oma hiharavistukseni on se, että se päivä saavutetaan noin jouluna. Siivoukseen lasketaan siis kaikki kaapit ja varastot ja arkistot ja tietokone ja puhelin ja villavaatteet ja talvikengät ja ihan kaikki. Aloittaessani olin juuri siivonnut vaatekaapin ja pessyt ikkunat, mutta muuten koko 40-neliöinen kotini varastoineen odotti urakan alkua. En tiedä vieläkään, olenko oikeasti sitoutunut tähän touhuun vai en. Aionko todella siivota niin kauan, ettei mitään siivottavaa ole. En suhtaudu tähän tiukkapipoisesti ja jos väliin jää päivä, niin sittenpähän jää. Ja siinä kohtaa, kun eräänä keskiviikkopäivänä hinkkasin kaksi tuntia puhtaaksi vuokrakotini uunipeltiä (pitäkää jumalaare ihmiset parempaa huolta uunipelleistänne!), niin mietin kyllä, että eihän tässä mitään järkeä ole. Mutta silti toistaiseksi löydän itseni siivoamasta melkein joka päivä. Nyt takana on kaikkinensa tasan kuukausi ja keittiö alkaa olla voiton puolella. Käyn siis läpi kaikki kaapit ja karsin mielettömät määrät ylimääräistä roinaa ja ryönää kodistani ja elämästäni. Olen pessyt ja hinkannut ja jynssännyt mennessäni kaiken pinttyneen, rasvaisen pölyn, pohjaan palaneet ritilät, liesituulettimen niljaiset sisukset ja jääkaapin hieman kyseenalaisen vihanneslokeron. Miksi ihmeessä ja mistä se aika revitään? Aloitetaan helpommasta eli siitä ajasta. Olen karsinut somesta. Katsottuani Altered Carbonin peruin Netflixin. Kesän jäljiltä jatkuva ravaaminen pitkin kyliä on hieman helpottanut ja huomaan jääväni mielelläni kotiin siivoamaan. No sitten se miksi. Jostain syystä tuntuu hyvältä siivota. Mitä enemmän roinaa poistuu kodistani, sitä kevyemmältä oloni tuntuu. Kun avaan puhtauttaan kiiltävän jääkaapin oven tai uunin, jonka luukusta näkee läpi, tunnen jonkinlaista myygistä rauhaa. Sitä paitsi kyllä siitä jotain perverssiä tyydytystä saa, kun tajuaa, että sen ruoantähteitä tiskialtaan pohjalla keräävän ritilän ei pitäisikään olla ruskea vaan aivan kiiltävän harmaa. Samalla kun siivoan, kuuntelen Tim Ferrissin podcasteja, Jari Sarasvuon Yle puheita ja viimeisimmäksi mitä tahansa, mikä löytyy Yle Areenasta ja missä on haastateltu Katri Saarikiveä. Nämä tyypit viihdyttävät minua suunnattomasti siivotessani ja välillä erehdyn keräämään talteen jonkun hyödyllisen tiedonmurusenkin. Useimmiten kellon soittaessa tunnin päättymisen merkiksi, jatkan siivoamista kunnes puhe taukoaa – ja yhtäkkiä huomaan siivonneeni yli kaksi tuntia ihan huomaamattani. Sit kun loppuu, voit tulla meille, ehehe! Useimmat ihmiset keksivät tämän saman vitsin, kun kerron heille omituisesta urakastani. Ymmärrän sen kauhean hyvin, koska olisin itse kertonut saman vitsin vielä jokunen tovi sitten. Ajatus tällaisesta projektista olisi tuntunut itselleni täysin mahdottomalta, jopa vastenmieliseltä. Se tuntuu edellenkin omiin korviinikin lähes käsittämättömältä. Minä, joka siis vihaan siivoamista, nyt vaan siivoan. Joka päivä odotan, että tämä imu loppuu ja löydän itseni hölmistyneenä siivousrätti kourasta miettimästä, että miten minä tähän päädyin. Toistaiseksi loppua ei kuitenkaan näy, joten näillä lämpimillä jatketaan, kunnes toisin ilmoitetaan. Ainoastaan mietin vain, että mitähän muuta sitä voi löytää itsensä vielä tekemästä, minkä tekeminen tuntuu tällä hetkellä täysin mahdottomalta aloittaa ja älyttömältä toteuttaa… Artikkeli kategoriassa Yleinen Avainsanat Muutos, Sekoaminen, Siivoaminen"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
