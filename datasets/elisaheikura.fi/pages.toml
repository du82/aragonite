["https://elisaheikura.fi/onks-mun-aina-pakko"]
title = "Onks mun aina pakko? | Elisa Heikura"
description = "Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä raivoan keittiössä, että se en kyllä jumalauta ole taas minä, joka menen tätä tilannetta perähuoneeseen selvittämään."
full_description = "Kirjoitettu 13.6.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Onks mun aina pakko? Onks mun aina pakko? Hypoteettinen skenario: Minä suutun jostakin, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Menee tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Kuluu tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Vierähtää tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain ja koko matkan itsekseni jupisten perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Hujahtaa tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä raivoan keittiössä, että se en kyllä jumalauta ole taas minä, joka menen tätä tilannetta perähuoneeseen selvittämään. Been there, done that? Minulle ei ole käynyt näin, sillä minun ihmissuhteideni toistuvat kuviot ovat olleet ihan toisenlaisia. Mutta monelle ystävälleni on ja erään heistä kanssa kävimme aiheesta keskustelua. Hänen äänestään kuulsi valtava turhautuneisuus, kun hän avautui: ”Miks se on aina mun pakko mennä sinne perähuoneeseen? En minä kyllä loputtomiin nöyrry ja anna periksi, kun se olin alun perin minä, joka suutuin.” Valitettavasti en vastannut hänelle aivan niin, kuin hän olisi halunnut kuulla. Hän ja jokainen meistä vastaavassa tilanteessa haluaisi kuulla tällaisen vastauksen: ”No ei se kyllä ole aina sinun pakko sinne mennä, kyllä sen toisen pitäisi välillä tulla puoliväliin vastaan. On tuo nyt ihan kohtuutonta ja väärin sinua kohtaan.” On siinä muutama sana tottakin. Jos kysytään, että ”onko se aina minun pakko”, niin vastaus on tietysti, että ei missään nimessä ole mikään pakko. Ei todellakaan ole pakko. Kyllä me kaikki tiedetään, mitä siellä jokaisen ”on ihan pakko” -listalla on. Lähinnä ennen pitkää kuolla. Mitä sitten vastasin? Minähän ystävällisesti sanoa täräytin, että kyllä se ikään kuin on sinun aina pakko. Kas kun ensinnäkin tuskinpa se ihminen haluaa siellä perähuoneessa mököttää. Tai siis on toki muutama sellainenkin, jonka nauttii tällaisista valtapeleistä ja ehdottomasti haluaa olla hankala ja mököttää. Älä seurustele sellaisen ihmisen kanssa. Mutta jos seurustelet tervehenkisen ja normaalin ihmisen kanssa, niin ei hän halua mököttää. Hän ei vaan voi sille mitään. Miten niin ei voi? Ihan yhtä vähän hän voi sille asialle, kuin minä mahdan sille, että olen aivan kaoottinen ylianalysoija. Eli siis voin kyllä, mutta se vaatii aivan tolkuttoman määrän työtä ja olen luultavasti 105-vuotias ennen kuin olen tästä vaivasta kokonaan parantunut. Me kannamme opittuja, huonoja, psykologisia, temperamenttisia, verenperintönä imettyjä ja traumojen mukanaan tuomia toimintamalleja, jotka ovat tooooodella huonoja. Sinulla on niitä, minulla on niitä. Puolisollasi on niitä. Se joku niistä saattaa olla reagoida suuttumukseen mököttämällä ja painella perähuoneeseen. Ei hän itseään tästä reaktiosta kiitä, eikä ole tilanteesta mielissään. Hän tekee niin silti. Ai tästäkö on sitten kärsittävä vain? Juu-u. Tietysti rauhan tullen asiasta täytyy puhua. Toista täytyy tukea matkalla paremmaksi versioksi itsestään. Mutta kun olet kultasi valinnut, olet valinnut myös hänen traumansa ja heikkoutensa. Ihminen ei muutu kuin omasta tahdostaan ja (todennäköisesti) pitkän aikavälin myötä. Sitä ennen se on sinun velvollisuutesi olla se kypsä aikuinen ja jälleen kerran mennä purkamaan tilanne. Tai siis tietysti vaihtoehtona on myös antaa hänen mököttää. Sitten on kurjaa molemmilla. Määrättömän kauan. Onko se parempi, kuin se, että nöyrryt ja käyt korjaamassa tilanteen? Pääsette syömään iltapalaa ja yhdessä nukkumaan? Ja mitä tulee tuohon nöyrtymiseen, niin ei parisuhteessa pitäisi olla mitään nöyrtymistä. Ei egoa, jota toiselle puolustaa. Vain rakkaus. Ja rakkaus antaa anteeksi sen, että toinen mököttää, vaikkei niin pitäisi tehdä. Parisuhteessa pitäisi olla vain kypsiä aikuisia, jotka ovat valmiita kantamaan aikuisuuden taakan kummankin puolesta, kun toinen hukkuu oman sisäisen lapsensa oikkuihin. Pakko ei ole, mutta niin rakkaus tekisi. Artikkeli kategoriassa Ajatteleminen, Viestintä Avainsanat Käyttäytyminen, Konflikti, Parisuhde, Viestintä"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
