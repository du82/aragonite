["https://elisaheikura.fi/mita-tahansa-kestaa-aina-kymmenen-sekuntia-kerrallaan"]
title = "Mitä tahansa kestää aina kymmenen sekuntia kerrallaan | Elisa Heikura"
description = "Vuosi 2016 ei tosiaan ole ollut juuri kenenkään lempivuosi”, kirjoittaa kollegani Noora Stapleton. Ei ole ei. Itse asiassa vilkutan vuodelle 2016 tuntematta minkäänlaista ystävällistä haikeutta."
full_description = "Kirjoitettu 27.12.2016Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Mitä tahansa kestää aina kymmenen sekuntia kerrallaan Mitä tahansa kestää aina kymmenen sekuntia kerrallaan ”Vuosi 2016 ei tosiaan ole ollut juuri kenenkään lempivuosi”, kirjoittaa kollegani Noora Stapleton. Ei ole ei. Itse asiassa vilkutan vuodelle 2016 tuntematta minkäänlaista ystävällistä haikeutta. Vuosi on kuitenkin vahvistanut hauskan populaarikulttuuriteorian, jonka elämääni toi Netflix-sarja Unbreakable Kimmy Schmidt. Spoilaamatta liikoja avaan sarjan ideaa tämän verran: tarina kertoo nuoresta naisesta, joka on viettänyt 15 vuotta elämästään bunkkerissa maan alla hullun uskonlahkon kidnappaamana. Bunkkerissa ollessaan Kimmyn on väännettävä valtavaa kampea tuottaakseen (tietämättään) sähköä lahkon johtajan viihdelaitteisiin. Tehtävä on uuvuttava ja yksitoikkoinen. Kun Kimmylta kysytään, miten hän jaksoi vääntää kampea tuntikausia, hän vastaa: ”I learned a long time ago that a person can stand just about anything for 10 seconds, then you just start on a new 10 seconds. All you’ve got to do is take it 10 seconds at a time.” Tämähän pätee sitten kokolailla ihan kaikkeen. Pienin kestettävissä oleva aikamääre kerrallaan Usein vaikeisiin elämäntilanteisiin joutuneita taputetaan selkään ja sanotaan, että ”päivä kerrallaan”. Tosiasiassa, kun elämä potkii turpaan ihan huolella, pienin kestettävissä oleva aikamääre ei useinkaan ole edes kokonainen päivä. Se voi olla puoli päivää, kaksi tuntia tai ihan vain 10 sekuntia. Mitä perustavanlaatuisemmin yhdelle tai useammalle elämänalueelle kuorma kerrallaan kasaantuu, sitä pienemmäksi aika pilkkoutuu. Kun viime syksy toi yhtä aikaa elämääni liian suureksi kasaantuneen työkuorman ja eron mukanaan tuoman elämänmullistuksen, myös minun aikani sirpaloitui. Oli hätkähdyttävää huomata, että supersuorittajakin joutuu polvistumaan surun, kivun ja uupumuksen edessä. On myönnettävä, että nyt en pysty katsomaan huomiseen, nyt otan tämän käsillä olevan hetken kerrallaan. Mutta siinä juuri piilee selviytymisen salaisuus. Oikeastaan siinä piilee koko elämän salaisuus. Aikaa, määriä ja matkoja voi aina kasvattaa, kunhan jostain pääsee liikkeelle. Ja joskus liikkeelle lähdetään kymmenestä sekunnista. Artikkeli kategoriassa Filosofia, Yleinen Avainsanat Elisa, Uudelleenajattelu"
