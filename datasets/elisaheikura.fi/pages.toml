["https://elisaheikura.fi/avainsanat/viestinta"]
title = "Avainsana: Viestintä | Elisa Heikura"
full_description = "Kirjoitettu 10.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Onko sinulla taipumusta tuijottaa viestiä ja miettiä, että mitähän tuo lähettäjä tällä oikein tarkoittaa? Entä onko sinulla tapana etsiä metatason viestejä sanottujen sanojen takana? Minulla on ollut, koska olen tällainen kielen tasoihin ja monimerkityksellisyyteen rakastunut ja huonohkolla itsetunnolla riivattu ylianalysoija. Mutta tiiäks mitä olen tässä hiljattain – vaihteeksi – tajunnut? Se on maailman turhinta ja typerintä hommaa. Se on myös yksi niitä asioita, joka vie kaiken hapen elämästä ja vieraannuttaa ihmisen hetkestä. Se uuvuttaa myös ne, jotka yrittävät meille jotain viestiä. Jaa että mitä että? No annahan kun yritän selittää. Lue lisää Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Artikkeli kategoriassa Viestintä Avainsanat ihmisyys, Meta, Pohdinta, Uudelleenajattelu, Viestintä Kirjoitettu 8.10.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Teko on yhdentekevä Teko on yhdentekevä Yksi päivä päässäni muljahti. Ymmärsin, kuinka tarkoitus- ja teko-orientoituneita olemme. Käytämme ihan käsittämättömiä määriä aikaa ja energiaa puhuaksemme siitä, mitä joku teki tai jätti tekemättä – sekä yllättävän paljon myös siitä, mitkä olivat ihmisen aikeet tekojen takana. Sehän on se kuuluisa tarkoitus, kun ne keinot pyhittää, vai mitä? Jos asiaa kuitenkin tarkastelee tarkemmin, niin mahtaako teolla itsellään olla ihan yhtään mitään merkitystä? Entä, jos ne ovatkin ne seuraukset, joihin meidän pitäisi kiinnittää katseemme. Lue lisää Teko on yhdentekevä Artikkeli kategoriassa Ajatteleminen, Filosofia Avainsanat Palaute, Seuraus, Teko, Viestintä Kirjoitettu 13.6.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Onks mun aina pakko? Onks mun aina pakko? Hypoteettinen skenario: Minä suutun jostakin, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Menee tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Kuluu tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Vierähtää tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain ja koko matkan itsekseni jupisten perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Hujahtaa tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä raivoan keittiössä, että se en kyllä jumalauta ole taas minä, joka menen tätä tilannetta perähuoneeseen selvittämään. Lue lisää Onks mun aina pakko? Artikkeli kategoriassa Ajatteleminen, Viestintä Avainsanat Käyttäytyminen, Konflikti, Parisuhde, Viestintä"
