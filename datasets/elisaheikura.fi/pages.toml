["https://elisaheikura.fi/avainsanat/ilmio"]
title = "Avainsana: ilmiö | Elisa Heikura"
full_description = "Kirjoitettu 26.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Sinulla ei ole oikeutta mihinkään Sinulla ei ole oikeutta mihinkään Ennen kuin aloitan, niin pieni taustoittava alkukaneetti: Minä olen vahva ilmaisen koulutuksen ja terveydenhuollon kannattaja. Kannatan perustuloa. Kannatan parempaa palkkaa heille, jotka pitävät huolta lapsista, vanhuksista ja sairastuneista sekä heille, jotka pitävät huolta turvallisuudestamme. Pidä tämä mielessäsi, kun siirryt eteenpäin. Täytyy myös heti korjata vähän otsikkoa. Sinulla on oikeus olla olemassa. Se on jokaisen ihmisen yhtäläinen ja kiistaton oikeus. Tästä syystä en kannata kuolemanrangaistusta, sillä vaikka ihmisen teot olisivat kuinka hirveitä, ne eivät vie olemassaolon oikeutta. Jokainen ihminen – kamalimmatkin – ovat lähtökohtaisesti arvokkaita ja siksi jokaisella on oikeus olla olemassa. Mutta siihen oikeudet sitten loppuvat Lue lisää Sinulla ei ole oikeutta mihinkään Artikkeli kategoriassa Jyrähdys Avainsanat Ihminen, ilmiö, Oikeus, Velvollisuus, Yhteiskunta Kirjoitettu 27.3.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Pitääkö sinutkin huostaanottaa? Pitääkö sinutkin huostaanottaa? Jos olisin itseni lapsi, viimeisen vuoden aikana minut olisi huostaanotettu. Olin kakara, jolla ei ollut mitään kotiintulo- tai nukkumaanmenoaikoja, säännöllistä ruokarytmiä tai karkkipäiviä. Kanssani oli ihan turha edes aloittaa keskustelua liikunnasta tai ulkoilusta, koska nyt just ei ehdi ja on ollut vähän kiire. Annoin itseni tehdä töitä yömyöhään ja uhrasin työn alttarilla kaikki vapaapäivätkin. Ellei minulla olisi käsittämätöntä lahjaa saada unenpäästä kiinni ja nukkua kokonaisia öitä äärimmäisessä stressissäkin, en ehkä olisi tolpillani ja järjissäni juuri nyt. Meinasin pillahtaa itkuun, kun yhtäkkiä kevätauringon valjetessa minullekin valkeni, millainen mulkku olen ollut omaa kehoani kohtaan. Lue lisää Pitääkö sinutkin huostaanottaa? Artikkeli kategoriassa Kulttuuri, Yleinen Avainsanat asiantuntija, hyvinvointi, ilmiö, kantapääni"
