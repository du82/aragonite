["https://elisaheikura.fi/hylis-ja-riittis"]
title = "Hylis ja riittis kävivät kylässä taas tällä viikolla | Elisa Heikura"
description = "Elämässäni on kaksi demonia. Näistä ensimmäinen on hylätyksi tulemisen pelko ja jälkimmäinen on riittämättömyyden pelko. Olen antanut niille nimet hylis ja riittis."
full_description = "Kirjoitettu 3.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Hylis ja riittis kävivät kylässä taas tällä viikolla Hylis ja riittis kävivät kylässä taas tällä viikolla Elämässäni on kaksi demonia. Toinen käy kylässä harvoin, mutta on valtava. Syö tyhjäksi kaikki energiavarastot, viskoo järjestyksen pitkin seiniä ja lamaannuttaa minut kuin syödyksi tulemista odottavan saaliseläimen. Toinen vierailee luonani vähän väliä. Se ei ole ihan niin kookas, mutta se on sitkeä. Se juttelee ilkeämielisesti ja saa minut epäilemään ja epäröimään. Se imee ilon, uskon ja rakkauden. Näistä ensimmäinen on hylätyksi tulemisen pelko ja jälkimmäinen on riittämättömyyden pelko. Olen antanut niille nimet hylis ja riittis. Molempien kanssa olen paininut varhaisnuoruudesta asti, useassa erässä, lukuisia otteluita. Minulla on ollut elämässäni loistavia ihmisiä, ihmissuhteita ja tilanteita, joiden avulla olen hieman vahvistunut, saanut vähän voimaa näihin kamppailuihin. Pääasiassa nämä ovat kuitenkin sellaisia veikkoja, että kun ne tunkevat ovesta sisään, niin siinä ei ole minulla juurikaan sananvaltaa. Etenkin hylis, sen kanssa ei neuvotella. Elämä on ihmistä viisaampi Koska ihmisen tehtävä on kasvaa, niin ihminenhän kasvaa. Jos ihminen ei älyä kasvaa ja kasvattaa itse itseään, elämä hoitaa homman. Sieltä tulee harjoittelualustaa toisensa perään, kunnes jotain alkaa tapahtua. Niin minullakin. Viimeisen vuoden aikana olen päässyt mittelemään voimiani hyliksen kanssa kiihtyvällä tahdilla. Jälleen tällä viikolla hylis tunki väkisin ovesta sisään. Ihan tyhjästä ja todellakin kutsumatta. Se on helkkarin epäkohtelias paskiainen. Se toi riittiksen mukanaan, koska ne tykkäävät hengata kaksin. Ne saavat yhdessä enemmän tuhoa aikaan. Taistosin niiden kanssa, itkin ystävilleni lohduttomasti, lopulta hengitin itseni rauhalliseksi, söin puuron ja menin nukkumaan. Muutamassa päivässä olo tasaantui. Tällä kertaa jotain kuitenkin muuttui Heräsin lauantaiaamuun niin, että kehossani oli uusi tunne. Erikoinen tunne. Seisoin suoremmassa, keitin kahvia, elimistössä kupli, päässä humisi. Istuin lauantaiaamun puuhiini, humina jatkui. Sanelin ystävälleni muutaman ajatuksen ja samassa metrinen halko tipahti jostakin päähäni. Näin yhtäkkiä hyliksen läpi. Sen typerän tyhjyyden, josta se vetää voimansa ja puhkuu itsensä niin isoksi. Sillä ei ole perusteita, ei pohjaa. Se ei pääse käsiksi minun arkeeni, ei minun työhöni, ei rutiineihini. Ei uneeni, ei ravintooni, ei hengittämiseeni. Ei ystävyyssuhteisiini, ei arvooni, ei merkitykseeni. Ei mihinkään. Se voi riehua kotonani mielin määrin, se voi yrittää vääntää minut aivan solmuun. Mutta sen limaiset kädet eivät pääse käsiksi mihinkään minulle tärkeään. Se ei pääse käsiksi minuun. Vain niihin ajatuksiin, jotka sille luovutan. Eikä minun ole pakko luovuttaa sille mitään. En ole sille mitään velkaa. Odotan miltei innolla hyliksen seuraavaa visiittiä Hylis varmasti yrittää ennen pitkää vanhoja temppujaan. Koska riittis on vielä selättämättä, se houkuttelee hyliksen varmasti joskus mukanaan. Hyliksen suhteen olen kuitenkin nyt utelias. Vieläkö se mahtaa saada tuhoa aikaan, kun kädessäni on nuppineula? Artikkeli kategoriassa Ajatteleminen Avainsanat Demoni, Pelko, Riittämättömyys"
