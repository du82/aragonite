["https://elisaheikura.fi/kategoriat/jyrahdys"]
title = "Kategoria: Jyrähdys | Elisa Heikura"
full_description = "Kirjoitettu 18.9.2017Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Sanat luovat todellisuuden Sanat luovat todellisuuden Olen pitkään, todella pitkään, siis aivan liian pitkään, pyöritellyt päässäni artikkelia kielen vallasta. Olin saanut aikaiseksi pelkän ingressin, joka meni näin: ”Ampumalla sinua päähän, lopettaisin luultavasti maallisen taipaleesi. Ampumalla päähäsi ajatuksia, minulla on valta muuttaa maallisen taipaleesi kulkua. Näistä jälkimmäinen on nähdäkseni tuhoisampaa.” On selvää, että yritin syödä elefantin. Aamulehden avauksesta seurannut paskamyrsky on kuitenkin tuonut diskurssianalyytikon minussa jälleen aiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää, että sillä on merkitystä, millaista kieltä käytämme. Lue lisää Sanat luovat todellisuuden Artikkeli kategoriassa Ajatteleminen, Filosofia, Jyrähdys, Kulttuuri, Viestintä Avainsanat Aamulehti, Debatti, Diskurssi, Kieli, Kyseenalaistaminen, Sukupuoli, Tasa-arvo, Uudelleenajattelu Kirjoitettu 26.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Sinulla ei ole oikeutta mihinkään Sinulla ei ole oikeutta mihinkään Ennen kuin aloitan, niin pieni taustoittava alkukaneetti: Minä olen vahva ilmaisen koulutuksen ja terveydenhuollon kannattaja. Kannatan perustuloa. Kannatan parempaa palkkaa heille, jotka pitävät huolta lapsista, vanhuksista ja sairastuneista sekä heille, jotka pitävät huolta turvallisuudestamme. Pidä tämä mielessäsi, kun siirryt eteenpäin. Täytyy myös heti korjata vähän otsikkoa. Sinulla on oikeus olla olemassa. Se on jokaisen ihmisen yhtäläinen ja kiistaton oikeus. Tästä syystä en kannata kuolemanrangaistusta, sillä vaikka ihmisen teot olisivat kuinka hirveitä, ne eivät vie olemassaolon oikeutta. Jokainen ihminen – kamalimmatkin – ovat lähtökohtaisesti arvokkaita ja siksi jokaisella on oikeus olla olemassa. Mutta siihen oikeudet sitten loppuvat Lue lisää Sinulla ei ole oikeutta mihinkään Artikkeli kategoriassa Jyrähdys Avainsanat Ihminen, ilmiö, Oikeus, Velvollisuus, Yhteiskunta"
