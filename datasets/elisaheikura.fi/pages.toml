["https://elisaheikura.fi/avainsanat/kyseenalaistaminen"]
title = "Avainsana: Kyseenalaistaminen | Elisa Heikura"
full_description = "Kirjoitettu 18.9.2017Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Sanat luovat todellisuuden Sanat luovat todellisuuden Olen pitkään, todella pitkään, siis aivan liian pitkään, pyöritellyt päässäni artikkelia kielen vallasta. Olin saanut aikaiseksi pelkän ingressin, joka meni näin: ”Ampumalla sinua päähän, lopettaisin luultavasti maallisen taipaleesi. Ampumalla päähäsi ajatuksia, minulla on valta muuttaa maallisen taipaleesi kulkua. Näistä jälkimmäinen on nähdäkseni tuhoisampaa.” On selvää, että yritin syödä elefantin. Aamulehden avauksesta seurannut paskamyrsky on kuitenkin tuonut diskurssianalyytikon minussa jälleen aiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää, että sillä on merkitystä, millaista kieltä käytämme. Lue lisää Sanat luovat todellisuuden Artikkeli kategoriassa Ajatteleminen, Filosofia, Jyrähdys, Kulttuuri, Viestintä Avainsanat Aamulehti, Debatti, Diskurssi, Kieli, Kyseenalaistaminen, Sukupuoli, Tasa-arvo, Uudelleenajattelu Kirjoitettu 16.12.2015Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Kaamosmöngintää Kaamosmöngintää Kaamosaika saa minussa näemmä esiin elämän kyseenalaistajan. En koe olevani kaamosmasentunut tai -lamaantunut. Tunnen vain sitä olemassaolon tuskaa, joka osaavammissa käsissä taipuisi runoiksi tai maalauksiksi. Valtaosaa meistä ajavat tietyt olemassaolon kysymykset: Miksi olemme olemassa? Mikä on elämän tarkoitus? Mitä on hyvä elämä? Lue lisää Kaamosmöngintää Artikkeli kategoriassa Filosofia, Yleinen Avainsanat Elämän tarkoitus, Elisa, Kyseenalaistaminen, Pohdinta Kirjoitettu 11.5.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Vaikka olet nainen? Vaikka olet nainen? Mielipiteeni repeää ihan juuri kahtia. Yhtäältä olen todella onnellinen, että viime päivinä on vatvottu tasa-arvokysymyksiä hashtagin #vaikkaolennainen johdolla. Julkisuuteen ilmaantui Laura, jota oli kohdeltu pöyristyttävällä tavalla, kun hän oli hakenut suomalaiseen metsäjättiin kesätöihin. Tarina synnytti kiivaan ryöpytyksen, jossa puitiin, onko oikein kieltäytyä ottamasta naista haastatteluun, koska hän on nainen. On ehdottomasti hyvä, että yhteiskunnan piintyneisiin asenteisiin ja sukupuoleen tuijottavien jääräpäiden änkyröintiin puututaan. Epäkohdat on hyvä tuoda esiin ja niistä on tärkeää puhua julkisesti, avoimesti ja järkevästi. Lue lisää Vaikka olet nainen? Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Viestintä Avainsanat #koskaolenyksilö, #vaikkaolennainen, Kyseenalaistaminen, Tasa-arvo, Uudelleenajattelu"
