["https://elisaheikura.fi/niin-mutta-miksi"]
title = "Niin mutta miksi? | Elisa Heikura"
description = "Jos olet hiljattain viettänyt aikaa kyselyikäisen lapsen kanssa, olet ehkä huomannut vastaavasi toistuviin miksi-kysymyksiin. Aina, kun luulet keksineesi erityisen näppärän ja tyhjentävän vastauksen…"
full_description = "Kirjoitettu 23.1.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Niin mutta miksi? Niin mutta miksi? Jos olet hiljattain viettänyt aikaa kyselyikäisen lapsen kanssa, olet ehkä huomannut vastaavasi toistuviin miksi-kysymyksiin. Aina, kun luulet keksineesi erityisen näppärän ja tyhjentävän vastauksen taaperon ihmettelyyn, pommitetaan lapsen suusta uusi ”niin, mutta miksi” ja taas pohditaan syntyjä syviä. Yleensä miksi-ketju päättyy vastaajan, ei kysyjän, turhautumiseen ja esiin kaivetaan Muumit tai joku muu harhautustekijä. Niin, mutta miksi? © Minna Hokkanen Miksi-kysymyksillä pommittaminen menee kasvun myötä ohi. Tämä totaalinen asioiden kyseenalaistaminen olisi kuitenkin hyödyllinen temppu myös aikuisiällä, kirjoittaa Nigel May Barlow kirjassaan re-think. Hän muistuttaa, että vain kysymällä riittävän usein ja lapsenomaisesti ”miksi?”, voimme havaita tekemisissämme ja ajattelussamme parkkiintuneita ja huonoja käytäntöjä. Viestintään tämä liittyy siten, että voimme viestiä vain sitä, mitä olemme ensin ajatelleet. Valitsemamme sanat ja sanonnat, käyttämämme fraasit, uskomamme totuudet, julistamamme mielipiteet ja näkökulmat tarvitsevat kaikki välillä tuulettamista, jotta ajattelumme ja viestintämme pysyy raikkaana. Yksi hyvä tapa viedä ajatukset hetkeksi ulos pakkaseen raikastumaan, on ottaa jokin varmuutena pitämäsi ajatus ja alkaa kysyä itseltäsi johdonmukaisesti, että ”miksi?”. Avuksi voi ottaa vaikka ystävän tai puolison, jos itsekseen puhuminen tuntuu omituiselta. Miksi-kysymystä voi myös jalostaa esimerkiksi seuraavanlaisiin muotoihin: Miksi juuri sinne? Miksi juuri sitä? Miksi juuri nyt? Miksi ei? Mistä tiedät? Miten niin muka? Kun seuraat ketjua riittävän pitkälle löydät todennäköisesti umpikujan, jossa et osaa enää vastata tai et ole vastauksiisi tyytyväinen. Oma umpikujani on monesti ”siksi, kun minusta tuntuu siltä”. Tästä ei pidä hätääntyä tai murheellistua. Välillä vastauksen puuttuminen tai asioiden joltain tuntuminen on ihan riittävä perustelu lopettaa kyselyleikki. Alitajuntasi on kuitenkin käynyt umpikujassa tutustumassa siihen ja voi olla, että jonkin ajan päästä kysymysleikin toistaessasi päädytkin toisenlaiseen vastaukseen tai jopa miettimään alkuperäistä näkökulmaasi uudelleen. Haastankin sinut siis tänään kysymään itseltäsi ja ystäviltäsi, että ”miksi?”. Tuuleta ajatteluasi ja tutki, saatko itsesi ”siksi, kun minusta tuntuu siltä” -umpikujaan. Miksikö? Äh, katso Muumeja! PS. Jos et itse saa kysymysleikkiä alkuun, pistä ajatuksesi kommentteihin ja minä kyselen miksi-kysymykset puolestasi! Artikkeli kategoriassa Ajatteleminen Avainsanat Kirjat, Kyseenalaistaminen, Nigel May Barlow, Tehtävät, Uudelleenajattelu"
author = "Kirjoittaja Elisa Heikura"
year_published = 2015
year_updated = 2015
