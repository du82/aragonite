["https://elisaheikura.fi/avainsanat/vastuullisus"]
title = "Avainsana: vastuullisus | Elisa Heikura"
full_description = "Kirjoitettu 17.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Ei mutan muttaa Ei mutan muttaa En välttämättä sanoisi, että kulunut 12 kuukautta olisi ollut elämässäni helppo, mutta se toi mukanaan oivalluksia. Ensin niitä heiteltiin minulle lempeästi. Kas tässä, ota koppi. Sitten niitä alkoi tulla vähän rivakammalla tahdilla. Nyt on kuin istuisi tenniskentällä oikosulkuun menneen pallonsyöttökoneen edessä, housut punaisessa pinnoitteessa, naama mustelmilla. Alright, elämä, I get it. Sulla on asiaa. Näistä päin turpavärkkiä singahtelevista elämänopetuksista kouraan on tarttunut yksi erityisen väkevä, jonka haluaisin jakaa teidän kanssanne. Se menee näin. Minä olen vastuussa. Minä vain olen. Lue lisää Ei mutan muttaa Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Yleinen Avainsanat ihmisyys, vastuullisus"
