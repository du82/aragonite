title = "Avainsana: Aamulehti | Elisa Heikura"
full_description = "Kirjoitettu 18.9.2017Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Sanat luovat todellisuuden Sanat luovat todellisuuden Olen pitkään, todella pitkään, siis aivan liian pitkään, pyöritellyt päässäni artikkelia kielen vallasta. Olin saanut aikaiseksi pelkän ingressin, joka meni näin: ”Ampumalla sinua päähän, lopettaisin luultavasti maallisen taipaleesi. Ampumalla päähäsi ajatuksia, minulla on valta muuttaa maallisen taipaleesi kulkua. Näistä jälkimmäinen on nähdäkseni tuhoisampaa.” On selvää, että yritin syödä elefantin. Aamulehden avauksesta seurannut paskamyrsky on kuitenkin tuonut diskurssianalyytikon minussa jälleen aiheeni äärelle, tällä kertaa tosissani ja väkisin. Yrittäkää nyt hyvät ihmiset ymmärtää, että sillä on merkitystä, millaista kieltä käytämme. Lue lisää Sanat luovat todellisuuden Artikkeli kategoriassa Ajatteleminen, Filosofia, Jyrähdys, Kulttuuri, Viestintä Avainsanat Aamulehti, Debatti, Diskurssi, Kieli, Kyseenalaistaminen, Sukupuoli, Tasa-arvo, Uudelleenajattelu"
