["https://elisaheikura.fi/avainsanat/siivoaminen"]
title = "Avainsana: Siivoaminen | Elisa Heikura"
full_description = "Kirjoitettu 18.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Miten niin tämä ei muka tule tänään valmiiksi? Miten niin tämä ei muka tule tänään valmiiksi? Olen äärimmäisen huono sietämään keskeneräistä työtä. Se on luonnollisesti yhtä paljon siunaus kuin se on kirouskin. Ilta-aurinko on alkanut laskea jo aikaa sitten ja silti minä ehdotan kummitädille, että josko kuitenkin haravoitaisiin tämä pelto loppuun. Eihän tätä nyt enää niin montaa kymmentä metriä ole jäljellä… Muuttolaatikot on aina käytännössä päivässä, parissa purettu. Puu-urakat tehdään kerralla liiteriin. Auringonpistoksen seurauksena saatan oksentaa koko seuraavan yön, mutta kun on kerran aloitettu, niin nurmikko leikataan kyllä todellakin loppuun asti. Mutta ne uunipellit? Lue lisää Miten niin tämä ei muka tule tänään valmiiksi? Artikkeli kategoriassa Ajatteleminen Avainsanat Kärsivällisyys, Oivallus, Prosessi, Siivoaminen Kirjoitettu 15.9.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai tän ei pitäiskään olla ruskea Ai tän ei pitäiskään olla ruskea Viimeksi kun uumoilin, että seuraavakin hurahtamisen kohteeni olisi epäilemättä jollain tavalla hippiä, en silti villeimmissä kuvitelmissanikaan voinut aavistaa, että hurahdan seuraavaksi siivoamiseen. Kas kun minä vihaan siivoamista. Se on nähdäkseni kotitöistä se kaikkein ääliömäisin ja älyttömin. Siivota pitää vähän väliä, ja ihan kohta on taas sotkuista. Loputon suo, joka ei tuota mitään iloa. Paitsi sitten kun tuntikausien kidutuksen jälkeen on puhdasta, se on ihan kiva. Vartin. Sitten on taas sotkuista. Olen ollut valmis ulkoistamaan kotini siivouksen jo hyvän tovin. Mutta nyt? Lue lisää Ai tän ei pitäiskään olla ruskea Artikkeli kategoriassa Yleinen Avainsanat Muutos, Sekoaminen, Siivoaminen"
