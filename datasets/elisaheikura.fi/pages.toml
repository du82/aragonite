["https://elisaheikura.fi/ai-etta-ma-olen-seonnut"]
title = "Ai että mä olen seonnut | Elisa Heikura"
description = "Minulla on teoria, jonka pohjaan pelkästään subjektiiviseen kokemukseeni. Kyse on rakkaudesta."
full_description = "Kirjoitettu 16.4.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai että mä olen seonnut Ai että mä olen seonnut Muistatteko noin vuosi sitten, kun kerroin tajunneeni olleeni itseäni kohtaan monta vuotta ihan totaalinen mulkku? Sitä tietysti luulisi, että tämä tajuaminen olisi ajanut jonkinlaiseen muutokseen, mutta ei. Tiedosta harvoin seuraa toimintaa. Vaadittiin vielä yksi vuosi mulkkuutta ja kymmenkunta oivallusta, ennen kuin mitään tapahtui. Ja sitten kyllä tapahtui senkin edestä Kuvitelkaa, että viimeisen viikon aikana olen herännyt vapaaehtoisesti joka arkiaamu torkuttamatta kello 6.15 tekemään kaksi tuntia keskeytyksetöntä, syvää työtä. Olen lopettanut työpäiväni tietoisesti ennen viittä, parhaimpina päivinä ennen neljää. Vain yhtenä iltana lipesin. Muina en ole katsonut sähköpostiin päinkään. Keskiviikkona lopetettuani työt ennen neljää vein itseni ensin puolentoista tunnin kävelylle ulos ja sitten vielä salillekin. Nukkumaan olen mennyt vuorokauden samalla puolella. En ihan niin aikaisin kuin uusi aamurytmini vaatisi, mutta parempaan suuntaan. Ravinnossakin on tapahtunut oikeita muutoksia. Syön aamupalani kiltisti Lassen (PT) ohjeiden mukaisesti eli kera proteiinin, enkä päästä itseäni hirmumyrskyä muistuttavaan nälkäkiukkuun. Olen sallinut itselleni herkkuja. Enkä ole soimannut ja piessyt itseäni henkisesti niistä hetkistä, kun en ole ollut kaikkea sitä, mitä kuvittelen, että minun pitäisi olla. Se pieni ratkaiseva ero Olen tiennyt aina, miten nämä muutokset tehdään. Olen tiennyt aina, että nämä muutokset pitäisi tehdä. Olen tuntenut kehossani aina, mikä näiden laiminlyöntien hinta on ollut. Minulla on työmotivaatiota ja tahdonvoimaa pienen kylän edestä, miksi sitä ei ole riittänyt silloin, kun kyse on minua itseäni koskevista asioista? Minulla on teoria, jonka pohjaan pelkästään subjektiiviseen kokemukseeni. Kyse on rakkaudesta. Ai hyvänen aika, miten vähän rakkautta olen tuntenut itseäni kohtaan. Olen ollut itselleni vihainen. Itseeni tyytymätön. Itseäni kohtaan julma ja epäoikeudenmukainen. Olen kyllä yrittänyt pitää itseäni arvossa, nostaa jalustalle ja tuoda esiin. Näistä mikään ei ole rakkautta, päinvastoin. Tarvittiin laajamittainen kolmenkympin kriisi, puolitoista vuotta terapiaa, kaksi kappaletta Heikki Harjun Läpimurto-seminaareja, kymmenkunta tuntia keskusteluja Narrin kanssa ja monia kymmeniä tunteja hyvien ystävien kanssa, kuukausikaupalla itkua ja lohdutonta totuuden silmiin katsomista, maailmankuvan auki repimistä ja niin perkeleesti hyväksymistä, ettei ole tosikaan. Siitä seuraa syvä hulluus Siksipä olenkin seonnut. Maailmani on nyrjähtänyt, enkä enää tunnista tiettyjä ajatusmalleja, joita olen aiemmin imenyt ympäristöstäni. En näe järkeä niissä asioissa, joissa joskus oli kaikki järki maailmassa. En roudaa mukanani uskomuksia, joita olen vetänyt perässäni lapsuudestani asti. Sen seurauksena teen asioita enemmän oikein, mutta en siksi, että minun pitäisi. Tai siksi, koska ulkopuoliset syyt. Vaan siksi, että tunnen itseäni kohtaan hellyyttä ja lempeyttä. Syötän itselleni hyvää ruokaa, koska kehoni ansaitsee sen. Lopetan työpäiväni ajoissa ja menen ulos kävelemään, koska haluan pitää itsestäni huolta. Annan itselleni luvan olla epätäydellinen, väsynyt ja virheellinen – ja ansaita rakkauteni siitä huolimatta. En olisi saanut arkeani muuttumaan väkisin. Ei se ole 20 vuodessa muuttunut väkisin. Se muuttui vasta sitten, kun ryhdyin rakastamaan itseäni niin paljon, että missään muussa käytöksessä ei ole enää järkeä. Olen muuttunut niin paljon, että se vaikuttaa hulluudelta. Toivottavasti se on sitä ja mielellään pysyvää sorttia. Artikkeli kategoriassa Ajatteleminen, Yleinen Avainsanat Elisa, kantapääni, Minusta, Rakkaus, Uudelleenajattelu"
