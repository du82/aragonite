["https://elisaheikura.fi/varo-hopealuoteja-ja-yhden-totuuden-messiaita"]
title = "Varo hopealuoteja ja yhden totuuden messiaita | Elisa Heikura"
description = "Hurmion sivuvaikutus on halo-efekti, joka saa aikaan sen, että hetken aikaa tämän maan päällä tallustaa olento, joka tuntuu mie-let-tö-män ylitsepääsemättömältä."
full_description = "Kirjoitettu 1.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Varo hopealuoteja ja yhden totuuden messiaita Varo hopealuoteja ja yhden totuuden messiaita En tiedä mistä nauttisin enemmän, kuin hurmaantumisesta. Hurmaantuminen on tietenkin äärettömän vaarallista, sillä pelkästään rakkaus ei ole sokea. Hurmion lähinäkö on myös aivan olematon. Yksi hurmion sivuvaikutus on haloefekti, joka saa aikaan sen, että hetken aikaa tämän maan päällä tallustaa olento, joka tuntuu mie-let-tö-män ylitsepääsemättömältä. Romanttisessa mielessä mieletön ylitsepääsemättömyys näyttäytyy siten, että toista ei voi lakata ajattelemasta edes unissaan. Hänestä ei kerta kaikkiaan meinaa päästä millään yli, useimmat eivät haluakaan. Kun kaksi ihmistä ei halua päästä yli toisistaan, niin sitä kutsuttaneen parisuhteeksi. Mutta oletko koskaan kokenut platonista hurmiota? Se se vasta hurja kuvio onkin. Gurut, messiaat, opettajat, pelastajat, valmentajat Oman kokemukseni mukaan platoninen hurmio syntyy useimmiten silloin, kun kohtaa itseään viisaamman. Tai vaihtoehtoisesti silloin, kun on itse jonkinlaisessa ahdingossa ja joku pystyy juuri siinä hetkessä auttamaan. Kolmas hurmion paikka on kuunnella tai vaikka lukea ihmistä, joka tarjoaa jotain sellaista opetusta, joka yhtäkkiä selittää maailmaa niin kovin paljon. Hehkulamppujen sarja syttyy päässä, asiat helpottuvat, pilvet rakoilevat, mannerlaatat järisevät. Syvyyksistä kumpuaa kiitollisuus, kunnioitus, ihailu. Miten jollain voikin olla niin paljon viisautta, tietoa ja osaamista? Miten en ole koskaan aiemmin itse tiennyt tai osannut tätä? Osaisinpa! Sitten seuraa haloefekti. Gurun sanoja alkaa lukea erittäin hyvässä valaistuksessa. Kaikki ihmistä koskeva informaatio virtaa pastellinsävyisen monokkelin kautta. Tässä tapauksessa mieletön ylitsepääsemättömyys tulee siitä, että kyseinen ihminen on nostettu niin korkealle jalustalle, ettei sinne itse ikinä pääse kapuamaan. Paitsi että pääsee. Myös tieto tai teoria voi hurmaannuttaa Sama haloefekti koskee myös sitä tietoa tai asiaa, joka auttaa saamaan maailmaan jotain tolkkua, selvyyttä tai helpotusta. Tästä tiedosta, teoriasta tai toimintamallista tulee pyhä ja maailmaa aletaan sovittaa teoriaan eikä päinvastoin. Jos jokin ei täsmää tai vastaan tulee ristiriitaista tietoa, se selitetään jollain tavalla hyväksi. Vääräuskoiset riidellään hiljaiseksi. Olipa kyse sitten ravinnosta ja treenaamisesta, psykologiasta tai muusta mielen toiminnasta tai esimerkiksi ihmissuhteista, aina on joku teoria, joka selittää maailmaa aika hyvin. Se ei ole täydellinen, mutta selittää niin paljon, että yhtäkkiä asiat tuntuvat valkenevan. Sen jälkeen onkin hyvin helppo hengata hurmoksessa, koska emme oikeastaan kaipaa mitään muuta kuin sitä, että joku selittäisi kaiken. Mitä mikään ei tietenkään tee. Tapa gurusi, jos aiot kasvaa Aikansa hurmoksesta nautittuaan on oikeasti syytä ottaa banaani korvasta ja alkaa kuunnella muitakin ääniä. Antaa mahdollisuus kilpaileville teorioille ja nurkista kuuluville soraäänille. Lisätä repertuaariin vaihtoehtoisia tapoja hahmottaa maailmaa ja sen ilmiöitä. Muuten käy niin, että päätyy määkimään paimenen kuoroon. Yleensä hurmion aiheuttavat ihmiset, jotka uskovat yhteen asiaan todella palavasti. Tuli on tarttuvaa. Yhdessä totuudessa tai ratkaisussa ei kuitenkaan koskaan ole koko maailmaa selittävää tai parantavaa voimaa. Tietokaan on harvoin muuttumatonta ja totuus pysyvää sorttia. Siksi kaikkia guruja kannattaa kuunnella, yhtäkään ei kannata uskoa sokeana hurmoksesta. Artikkeli kategoriassa Ajatteleminen, Kulttuuri Avainsanat Guru, Hopealuoti, Hurmio, Kasvu, Kehittyminen"
author = "Kirjoittaja Elisa Heikura"
