["https://elisaheikura.fi/lakkaa-suhtautumasta-viesteihin-kuin-todistusaineistoon"]
title = "Lakkaa suhtautumasta viesteihin kuin todistusaineistoon | Elisa Heikura"
description = "Jos on pakko jotain tulkita, niin kannattaa keskittyä tulkitsemaan omaa reaktiota. Ei toisen piilotettua agendaa. Ensimmäisestä on hyötyä, jälkimmäisestä ei."
full_description = "Kirjoitettu 10.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Onko sinulla taipumusta tuijottaa viestiä ja miettiä, että mitähän tuo lähettäjä tällä oikein tarkoittaa? Entä onko sinulla tapana etsiä metatason viestejä sanottujen sanojen takana? Minulla on ollut, koska olen tällainen kielen tasoihin ja monimerkityksellisyyteen rakastunut ja huonohkolla itsetunnolla riivattu ylianalysoija. Mutta tiiäks mitä olen tässä hiljattain – vaihteeksi – tajunnut? Se on maailman turhinta ja typerintä hommaa. Se on myös yksi niitä asioita, joka vie kaiken hapen elämästä ja vieraannuttaa ihmisen hetkestä. Se uuvuttaa myös ne, jotka yrittävät meille jotain viestiä. Jaa että mitä että? No annahan kun yritän selittää. Kun se viestintä todellakin useimmiten epäonnistuu Syy, miksi Wiio on synkkien lakiensa kanssa oikeassa, on juurikin meidän ylianalysoijien. Viestin saatuamme me ryhdymme arvailemaan. Mitähän tämä viesti kertoo minusta vastaanottajana? Olenko minä hyvä ihminen, olenko tärkeä, rakas, kelvollinen? Mitä tämä viesti kertoo lähettäjästä? Arvostaako, kunnioittaako, rakastaako hän minua? Entä mitä tämä kertoo meidän suhteestamme? Onko se ennallaan, tuhoutumassa, parantumassa? Jokaisella viestillä tietysti ON metatasonsa. Viesti on lähetetty jostain syystä juuri sinulle ja siinä on käytetty niitä sanoja, mitä on, tietoisesta tai tiedostamattomasta syystä. Mutta sen metatason arvaileminen on täysin hyödytöntä, koska me emme voi sitä tietää ja arvaamme kutakuinkin aina väärin. Koska arvaamme omasta positiostamme käsin, emmekä koskaan pääse lähettäjän positioon, ajatuksiin ja tunteisiin käsiksi pelkän viestin perusteella. Sen sijaan pääsemme käsiksi itse viestiin Niin kauan, kun yritämme jahdata ja päätellä tätä metatasoa, käytämme energiaa ihan väärään asiaan. Arvailun ja oletusten sijaan meidän pitäisi lukea sitä varsinaista viestiä ja keskittyä siihen, mitä siinä sanojen tasolla ihan oikeasti sanotaan. Mitä se viesti saa minut itseni tuntemaan juuri nyt tässä hetkessä, mitä minun järkeni ja sydämeni käskee siihen juuri nyt vastata. Jos on pakko jotain tulkita, ja aina välillä on, niin kannattaa keskittyä tulkitsemaan omaa reaktiota ja tunteita. Ei toisen syitä ja piilotettua agendaa. Näistä ensimmäisestä on hyötyä, jälkimmäisestä ei. Kas kun toisen lähettämä kissavideo saattaa kertoa rakkaudesta tai sitten lähettäjällä oli vaan tylsää. Pomon lähettämä lyhyt viesti saattaa kertoa vihamielisyydestä tai sitten pomolla oli vaan kamala kiire. Vanhemman lähettämässä viestissä saattaa olla oikeasti syyllistävä sävy tai sitten se syyllistyminen tapahtuukin sinussa itsessäsi ihan automaattisesti. Metaviestittely menee usein megalomaanisesti metsään Pahinta on se, jos päättää tulkita lähettäjän viestistä metatason tai piilotetun agendan ja vastata samalla mitalla takaisin. Silloin ryhdytään käymään keskustelua keskustelun takana ja piilottamaan sitä varsinaista viestiä sanojen taakse. Kahdestikaan ihmiset eivät silloin käy samaa keskustelua. Sävy muuttuu vaan oudoksi ja kumpikin omalla puolella ruutua tai pöytää miettii, että miiiiitäääää? (Poikkeuksena flirttailu, joka onkin oma piilotettujen viestien taitolajinsa.) Ei pidä myöskään olettaa, että se toinen lukee oman, tarkoitetun metatason viestin siitä lähetetystä viestistä. Joo, saatan haluta viestittää sinulle rakkauttani lähettämällä sinulle kuvan tai videon, josta tiedän sinun pitävän. Se tunne saattaa välittyä viestistäni – ja usein välittyykin (ihan analysoimatta ja ilman arvaamista!). Mutta sen lisäksi minun täytyy muistaa kertoa rakkauteni eksplisiittisesti, suorin sanoin ja todella usein. Koska ei ole mitään takeita, että sinä olet ymmärtänyt minun kissavideoni rakkaudenosoitukseksi. Millä tämän hulluuden voi lopettaa? Tärkein askel metatasoissa kieriskelyn lopettamiseksi, on tuntea itsensä, oma arvonsa ja rakastaa itseään tarpeeksi. Silloin ei tarvitse etsiä hyväksyntää ja vahvistusta toisten ihmisten viesteistä. Eikä myöskään ryhdy niin helposti ruokkimaan pelkojaan toisten viesteillä, keksimällä niihin sävyjä, joita niissä ei ole. Toinen askel on käydä metatason keskustelut ääneen. Kysy ja kerro. Kun tiedät suhteenne laadun, olipa se sitten ystävyyssuhde, perhesuhde, kollegiaalinen suhde, esimies-alainen-suhde tai rakkaussuhde, ja voit siihen tietoon luottaa, poistuu tarve etsiä signaaleja arkisista viesteistä. Voi keskittyä elämään hetkessä, nauttimaan tilanteesta, nauramaan kissavideolle ja vastaamaan sydämestään. Kolmas askel on luottaa omaan tunteeseen, tahtoon ja intuitioon sekä sietää epävarmuutta. En tiedä ihan tarkkaan, mikä meidän suhteemme on. Sen sijaan keskityn siihen, mitä tämä viesti saa minut tuntemaan ja mitä minun tekee siihen mieli vastata. Vastaan niin kuin minä tunnen ja tahdon. Lopun näyttää aika. Artikkeli kategoriassa Viestintä Avainsanat ihmisyys, Meta, Pohdinta, Uudelleenajattelu, Viestintä"
