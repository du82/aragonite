["https://elisaheikura.fi/ajatuksen-selkeys-on-uskottavaa"]
title = "Ajatuksen selkeys on uskottavaa | Elisa Heikura"
description = "Kielen selkeys on ajatuksen selkeyttä. Olen varma, että kyseinen lause on totta ja näkemykseni on pelkästään vahvistunut kuluneen kuukauden aikana. Tähän on johtanut neljä asiaa. 1) Luin Katleena…"
full_description = "Kirjoitettu 29.4.2015Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Ajatuksen selkeys on uskottavaa Ajatuksen selkeys on uskottavaa Vaikea kieli saa ajatuksen solmuun. © Minna Hokkanen Kielen selkeys on ajatuksen selkeyttä. Olen varma, että kyseinen lause on totta ja näkemykseni on pelkästään vahvistunut kuluneen kuukauden aikana. Tähän on johtanut neljä asiaa. 1) Luin Katleena Kortesuon Tee itsestäsi brändi -kirjan. Katleena painottaa moneen otteeseen, miten tärkeää kielen selkeys on. Hän suosittelee karsimaan turhan ammattijargonin ja pyrkimään kohti ymmärrettävää ja loogista puhetta. 2) Luin töissä Fredrik Harenin kirjaa Idea book. Fredrik kehottaa ihmisiä selittämään ideansa ikään kuin puhuisi lapselle, sillä silloin on pakko selittää asiat ymmärrettävästi. Vain ymmärrettävä selitys todistaa, että puhuja itse on varmasti ymmärtänyt sen, mistä on puhumassa. 3) Koulin kahden ystäväni nettisivuprojektia. Vaikka heidän asiansa on mielestäni selkeä ja looginen, nettisivut eivät kuitenkaan ole sitä. Ongelman muodostaa usein se, kun omassa asiassaan kovin syvällä olevat ihmiset yrittävät kertoa omasta osaamisesta vakuuttavasti. Tällöin helposti unohtuu, ettei lukija tai asiakas ole käsillä olevasta asiasta välttämättä alkuunkaan perillä. Eikä edes halua olla. 4) Jari Parantainen kirjoitti blogissaan virkakielen selkeyttämisestä. Virkakieli jos mikä on usein todella vaikeaselkoista, eikä tälle epäselvyydelle ole minkäänlaisia perusteita. Ei ole kenekään etu, ettei virallisia kirjeitä tahdo ymmärtää suomeksi ollenkaan. Siis kielen selkeys on ajatuksen selkeyttä ja ajatuksen selkeys on uskottavuustekijä. Karsitpa ammattijargonin, kirjoititpa kuin lukija olisi lapsi tai selkeytitpä virkakielen, lopputulos on sama. Lopputulos on hyvä. Huomautan kuitenkin, että tämä sääntö koskee vain silloin, kun viestitään ei-asiantuntijatahoille. Jos kyseessä on oman alasi julkaisu tai keskustelu muiden asiantuntijoiden kesken, saattaa ammattijargon jopa nopeuttaa ja selkeyttää viestintää. Miten oman viestin selkeyttä voi sitten testata? Anna teksti luettavaksi tai kerro ideasi, tuotteesta tai mielipiteesi ihmiselle, joka ei tiedä asiasta mitään. Kestääkö sinun viestintäsi selkeystestin? Artikkeli kategoriassa Kirjoittaminen, Puhuminen Avainsanat Fredrik Haren, Jari Parantainen, Katleena Kortesuo, Kirjat, Selkeys"
