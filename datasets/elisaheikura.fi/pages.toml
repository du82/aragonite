["https://elisaheikura.fi/avainsanat/meta"]
title = "Avainsana: Meta | Elisa Heikura"
full_description = "Kirjoitettu 10.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Onko sinulla taipumusta tuijottaa viestiä ja miettiä, että mitähän tuo lähettäjä tällä oikein tarkoittaa? Entä onko sinulla tapana etsiä metatason viestejä sanottujen sanojen takana? Minulla on ollut, koska olen tällainen kielen tasoihin ja monimerkityksellisyyteen rakastunut ja huonohkolla itsetunnolla riivattu ylianalysoija. Mutta tiiäks mitä olen tässä hiljattain – vaihteeksi – tajunnut? Se on maailman turhinta ja typerintä hommaa. Se on myös yksi niitä asioita, joka vie kaiken hapen elämästä ja vieraannuttaa ihmisen hetkestä. Se uuvuttaa myös ne, jotka yrittävät meille jotain viestiä. Jaa että mitä että? No annahan kun yritän selittää. Lue lisää Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Artikkeli kategoriassa Viestintä Avainsanat ihmisyys, Meta, Pohdinta, Uudelleenajattelu, Viestintä"
