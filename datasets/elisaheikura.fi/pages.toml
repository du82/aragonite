["https://elisaheikura.fi/kategoriat/kayttaytyminen"]
title = "Kategoria: Käyttäytyminen | Elisa Heikura"
full_description = "Kirjoitettu 5.1.2024Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin En tiennyt että osaan näin lukea En tiennyt että osaan näin lukea Uusi vuosi alkoi, kaikenlaisia lupauksia tehtiin kaikkialla päin maailmaa. Aiempina vuosina olen suoritus- ja tavoiteorientoituneena ihmisenä itsekin tehnyt kaikenlaisia lupauksia ja tavoitteita uusille vuosille. Tänä vuonna lähestyin asiaa toisin. Olen jo pidemmän aikaa miettinyt, että olisi kiva lukea enemmän. Näin olen huokaillut mielessäni ja silti mitään ei ole tapahtunut asian tiimoilla kuitenkaan. Välillä olen laittanut itselleni jonkun lukutavoitteen ja sitten suorittanut menemään. Välillä elämää on tapahtunut ja tavoite on jäänyt kesken. Lopputulos: jatkan uudelleen ja uudelleen lukemisen perään huokailemista. Mitä teen sen sijaan että lukisin? Johonkinhan se aika kuitenkin menee. Se aika, jonka teknisesti ottaen haluaisin antaa lukemiselle. Teen jotain muuta, mutta mitä? Kylmänviileä vastaus on: digilaitteen äärellä. Viihdyn telkkarin äärellä Netflixiä katsellen, puhelimen äärellä reelsejä scrollaillen ja arpoen, onko Mastodon, Bluesky vai Threads varteenotettava Twitterin korvaaja ja erityisen paljon vietän aikaa iPadin äärellä pelaten Genshin Impactia. Niinpä päätin koittaa, että mitä tapahtuu, jos uuden vuoden lupausten sijaan iskenkin tammikuun alusta päälle digipaaston. Ei totaalilakkoa (olenhan nytkin koneella tätä kirjoittamassa), koska se ei ole työn puolesta oikein mahdollistakaan ja koska ajattelen, että pieni annos digiä on ihmiselle ihan hyväksi. Mutta paasto: pienempiä annoskokoja ja pidempiä taukoja. Digipaasto, päivä numero viisi Takana on neljä ja puoli päivää tätä kokeilua ja toistaiseksi saldona on kaksi luettua kirjaa ja useita lukutunteja. Suorituksia keskeisempää on kuitenkin se tuntuma, mikä näinä päivinä on ollut asioihin. Tuntuma on se, että lukeminen on ollut vaivatonta ja suorastaan koukuttavaa. Kun mieleni tekisi tarttua digilaitteeseen, tuumin itsekseni, että “vähän myöhemmin sitten”. Sitten odottelen hetken ja huomaan, että seuraava impulssi on tarttua kirjaan. (Viihdettähän sekin on.) On käynyt samoin kuin sokeripaastossa. Kun ei kuukauteen syö sokeria, yhtäkkiä hedelmät alkavat maistua tosi makeilta. Lukuiloa jälleen etsimässä Olin lapsena varsinainen lukutoukka. Sitten menin yliopistoon opiskelemaan kirjallisuutta ja tuhosin lukuiloni tyystin. Vuosikausia se on ollut kateissa. Nyt hiljalleen olen alkanut taas löytää lukemisen äärelle takaisin. Olen ylipäätään alkanut löytää itseni äärelle takaisin. Niinpä pyrin lukemaan vain ilolla ja vain kirjoja, jotka todella kiehtovat ja koukuttavat. Toki purin antamaan myös erikoisille, hankalille tai hitaasti aukeaville kirjoille mahdollisuuden, mutten silti pakota. Lisäksi olen pyrkinyt lukemaan loppuun kirjoja, jotka ovat olleet kesken kauan, koska tunnen valtavaa tyydytystä asioiden valmiiksi saamisesta. Jännä nähdä, miten tilanne tästä etenee. Nyt nappaan kirjan kainaloon ja lähden tutkimaan Kööpenhaminaa. Lukemisiin! Artikkeli kategoriassa Käyttäytyminen Avainsanat Lukeminen"
author = "Kirjoittaja Elisa Heikura"
year_published = 2024
