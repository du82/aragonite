title = "Avainsana: Elisa | Elisa Heikura"
full_description = "Kirjoitettu 10.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Kaikki mitä vastustat, you know Kaikki mitä vastustat, you know Tähän kuuluisi laittaa kulunut sitaatti Äiti Teresasta ja sodan vs. rauhan puolesta marssimisesta. Uumoilen, että tiedät sen laittamattakin (tai googlaat nopeasti salaa), joten voin mennä suoraan aiheeseen. Tämä minun ei-niin-surkeiden sekoamisteni sarja jatkuu ja nyt olen hurahtanut hyväksyvään lempeyteen. Vastustamalla pahenee Olen siis viimein havainnut todeksi sen, minkä viisaat ihmiset ovat tienneet aina: vastustamalla pahenee. Elämässäni pitkään vaikuttanut Hanna tapasi aina tokaista minulle, että ”älä hytise, syleile kylmyyttä”, kun hampaat loukkua lyöden ja huulet sinisenä tärisin pakkasessa. Ai että se vitutti. Ai että kuinka oikeassa hän olikaan. Lue lisää Kaikki mitä vastustat, you know Artikkeli kategoriassa Ajatteleminen Avainsanat Elisa, hyvinvointi, ihmisyys, kantapääni, Uudelleenajattelu Kirjoitettu 16.4.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai että mä olen seonnut Ai että mä olen seonnut Muistatteko noin vuosi sitten, kun kerroin tajunneeni olleeni itseäni kohtaan monta vuotta ihan totaalinen mulkku? Sitä tietysti luulisi, että tämä tajuaminen olisi ajanut jonkinlaiseen muutokseen, mutta ei. Tiedosta harvoin seuraa toimintaa. Vaadittiin vielä yksi vuosi mulkkuutta ja kymmenkunta oivallusta, ennen kuin mitään tapahtui. Ja sitten kyllä tapahtui senkin edestä Lue lisää Ai että mä olen seonnut Artikkeli kategoriassa Ajatteleminen, Yleinen Avainsanat Elisa, kantapääni, Minusta, Rakkaus, Uudelleenajattelu Kirjoitettu 2.4.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Malja jokaiselle mäelle ja yksi ystävälle Malja jokaiselle mäelle ja yksi ystävälle Isälläni oli yritys. Mummollani kahvila. Ukkini myi päivätyönsä ohessa kaikkea vakuutuksista rapuihin. Ellen väärin muista, isoukkini oli suutari. Ja toisella puolen sukuhaaraa on maanviljelijöitä. Voisi ehkä sanoa, että päätö