title = "Avainsana: Parisuhde | Elisa Heikura"
full_description = "Kirjoitettu 4.3.2019Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä Aloitetaan siitä, että minulla on tähän näkökulmaan yhden sanan vastaus ja se on: BULLSHIT. Lue lisää Jos mun pitää pyytää, niin sä et oikeasti tarkoita sitä Artikkeli kategoriassa Kulttuuri, Viestintä Avainsanat Ajatustenlukija, Kommunikaatio, Parisuhde Kirjoitettu 13.6.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Onks mun aina pakko? Onks mun aina pakko? Hypoteettinen skenario: Minä suutun jostakin, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Menee tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Kuluu tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Vierähtää tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä painelen pitkin hampain ja koko matkan itsekseni jupisten perähuoneeseen selvittämään tilannetta ja asia saadaan sovituksi. Hujahtaa tovi. Minä suutun, vastapuoli alkaa mököttää. Minä lepyn, vastapuoli mököttää edelleen. Lopulta minä raivoan keittiössä, että se en kyllä jumalauta ole taas minä, joka menen tätä tilannetta perähuoneeseen selvittämään. Lue lisää Onks mun aina pakko? Artikkeli kategoriassa Ajatteleminen, Viestintä Avainsanat Käyttäytyminen, Konflikti, Parisuhde, Viestintä"
