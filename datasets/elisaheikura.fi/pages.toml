["https://elisaheikura.fi/mita-eroa-on-pelolla-ja-demonilla"]
title = "Mitä eroa on pelolla ja demonilla? | Elisa Heikura"
description = "Demoni keksii pelkoja tilanteissa, joissa niitä ei ole. Tai liioittelee ja paisuttaa pelkoa sellaiseksi, ettei sen kanssa pysty olemaan."
full_description = "Kirjoitettu 6.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Mitä eroa on pelolla ja demonilla? Mitä eroa on pelolla ja demonilla? Pelko on ihmiskehon normaali reaktio, selviytymisstrategia. Sen tehtävä on valpastuttaa. Herää nainen, nyt tarkkana. Jotain vaarallista voi tapahtua, ellet ole juuri nyt varuillasi. Pelko on viesti. Demoni sen sijaan? Se valehtelee. Demoni keksii pelkoja tilanteissa, joissa niitä ei ole. Tai se liioittelee ja paisuttaa pelkoa sellaiseksi, ettei sen kanssa pysty olemaan. Sitten ihmisolento tekee kaikenlaista typerää oloaan helpottaakseen. Sellaista, mitä ei kuuna kullan valkeana tekisi, jos saisi täysissä ruumiillisissa ja sielullisissa voimissa asiaa hetken miettiä. Demoni on sellainen pelon muoto, joka ei valpastuta hetkeen vaan irrottaa siitä. Kauhukuvissa keksitään tulevaisuuksia tai vaihtoehtoisia todellisuuksia, jotka eivät ole totta. Demoni estää olemasta levollisesti hetkessä, sillä se pakottaa koko ajan varmistelemaan tulevaisuutta tavoilla, jotka vievät hapen pois elämästä. Onhan varmasti kaikki hyvin? Minun elämässäni demoni on näyttäytynyt yhtenä toistuvana kysymyksenä: onko kaikki hyvin? Onhan sinulla, meillä, tilanteessa, tässä, nyt ja huomennakin vielä kaikki hyvin? Ja nyt tarkkana. Tämä kysymys ei ole se sama ”onko kaikki hyvin”, joka kysytään valppaana, läsnä, kun toisen olemus antaa syytä olettaa, että hänellä on hätä. Ei. Tämä on kysymys, jota hoetaan siksi, että tarvitaan varmuus, ettei mitään pahaa vain pääse koskaan tapahtumaan. Sillä yritetään pitää hylis tyytyväisenä. Tämä sama kysymys näyttäytyy levottomuutena. Se näyttäytyy hiljaisuuden pelkona. Se näyttäytyy varmisteluna. Se näyttäytyy odotuksina, joiden täyttymättömyys ajaa yhä syvemmälle epävarmuuteen. Demonimainen pelko estää ihmistä hengittämästä ja luottamasta. Se on muuten aivan saatanan raskasta. Itselle ja muille. Tällä oivalluksella on selitysvoimaa Kun katson elämääni taaksepäin, pystyn nimeämään hetken toisensa jälkeen, joissa demoni on ottanut tilanteessa vallan. Hylis ja riittis ovat tunkeneet kylään ja alkaneet rellestää. Niissä hetkissä ei ole ollut kyse tietoisesta todellisuudesta, siitä missä ollaan ja mitä juuri nyt tapahtuu. Sen sijaan on istuttu keskellä dystopiaa ja kuviteltu, että se on totta. Kuulostaa melko mielenvikaiselta ja epäilemättä se sitä onkin. Tuntuu käsittämättömältä nähdä itsensä näin kirkkaasti ja ymmärtää, miten ahtaalle oma mielikuvitus ja mielen kieroutuneet toimintamallit voivatkaan ihmisen ajaa. Kuinka huvittavan sokea sitä on omalle käytökselleen ollut. Ihan niin kuin joku olisi laittanut valot päälle ja yhtäkkiä näkee nurkkiin ja sängyn alle. Eikä siellä olekaan mitään. Artikkeli kategoriassa Ajatteleminen Avainsanat Demoni, Oivallus, Pelko"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
year_updated = 2018
