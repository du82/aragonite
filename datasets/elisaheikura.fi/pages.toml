["https://elisaheikura.fi/pitaako-sinutkin-huostaanottaa"]
title = "Pitääkö sinutkin huostaanottaa? | Elisa Heikura"
description = "Meinasin pillahtaa itkuun, kun yhtäkkiä kevätauringon valjetessa minullekin valkeni, millainen mulkku olen ollut omaa kehoani kohtaan."
full_description = "Kirjoitettu 27.3.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Pitääkö sinutkin huostaanottaa? Pitääkö sinutkin huostaanottaa? Jos olisin itseni lapsi, viimeisen vuoden aikana minut olisi huostaanotettu. Olin kakara, jolla ei ollut mitään kotiintulo- tai nukkumaanmenoaikoja, säännöllistä ruokarytmiä tai karkkipäiviä. Kanssani oli ihan turha edes aloittaa keskustelua liikunnasta tai ulkoilusta, koska nyt just ei ehdi ja on ollut vähän kiire. Annoin itseni tehdä töitä yömyöhään ja uhrasin työn alttarilla kaikki vapaapäivätkin. Ellei minulla olisi käsittämätöntä lahjaa saada unenpäästä kiinni ja nukkua kokonaisia öitä äärimmäisessä stressissäkin, en ehkä olisi tolpillani ja järjissäni juuri nyt. Meinasin pillahtaa itkuun, kun yhtäkkiä kevätauringon valjetessa minullekin valkeni, millainen mulkku olen ollut omaa kehoani kohtaan. Sääntöjä saa rikkoa, ei hylätä Mikä ihmeen logiikka aikuisen ajattelussa kuvittelee, että me voimme tyystin unohtaa ne säännöt, jotka ovat ohjanneet hyvinvointiamme lapsena? Lapsilla on nukkumaanmenoajat, ruokarytmit ja pakolliset ulkoilut syystä, eivätkä ne syyt mihinkään häviä ajokortin myötä. Eikä kyse ole pelkästään siitä, että pahoinpitelemme kehoamme, joka vain kannattelee suurta ja mahtavaa päätämme. Jokainen laiminlyönti kehoa kohtaan kostautuu sumeina ajatuksina, huonontuvana muistina ja sairauksina. Ja voin kertoa, sen sumun syvyyden huomaa vasta jälkikäteen. Lisäksi me olemme nykyään aina töissä, emmekä pääse aivojamme karkuun koskaan – paitsi kännissä ja unessa. Ja näistä kahdesta emme tunnu priorisoivan unta. Siksi epäilen, että aika moni muukin yrittäjä ja tietotyöläinen pötköttää kanssani samassa kuopassa. Tietämättään, välinpitämättömyyttään tai typeryyttään. Niin, että pitäisikö sinutkin huostaanottaa? Artikkeli kategoriassa Kulttuuri, Yleinen Avainsanat asiantuntija, hyvinvointi, ilmiö, kantapääni"
author = "Kirjoittaja Elisa Heikura"
year_published = 2017
year_updated = 2018
