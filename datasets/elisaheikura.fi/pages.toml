["https://elisaheikura.fi/avainsanat/oikeus"]
title = "Avainsana: Oikeus | Elisa Heikura"
full_description = "Kirjoitettu 26.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Sinulla ei ole oikeutta mihinkään Sinulla ei ole oikeutta mihinkään Ennen kuin aloitan, niin pieni taustoittava alkukaneetti: Minä olen vahva ilmaisen koulutuksen ja terveydenhuollon kannattaja. Kannatan perustuloa. Kannatan parempaa palkkaa heille, jotka pitävät huolta lapsista, vanhuksista ja sairastuneista sekä heille, jotka pitävät huolta turvallisuudestamme. Pidä tämä mielessäsi, kun siirryt eteenpäin. Täytyy myös heti korjata vähän otsikkoa. Sinulla on oikeus olla olemassa. Se on jokaisen ihmisen yhtäläinen ja kiistaton oikeus. Tästä syystä en kannata kuolemanrangaistusta, sillä vaikka ihmisen teot olisivat kuinka hirveitä, ne eivät vie olemassaolon oikeutta. Jokainen ihminen – kamalimmatkin – ovat lähtökohtaisesti arvokkaita ja siksi jokaisella on oikeus olla olemassa. Mutta siihen oikeudet sitten loppuvat Lue lisää Sinulla ei ole oikeutta mihinkään Artikkeli kategoriassa Jyrähdys Avainsanat Ihminen, ilmiö, Oikeus, Velvollisuus, Yhteiskunta"
