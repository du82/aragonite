["https://elisaheikura.fi/avainsanat/kantapaani"]
title = "Avainsana: kantapääni | Elisa Heikura"
full_description = "Kirjoitettu 2.3.2021Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Olenko laiska ja huono googlaamaan, jos kysyn? Olenko laiska ja huono googlaamaan, jos kysyn? Kun tarvitsen internetistä jotain tietoa, aloitan reippaan googlaamisen. Löydän lupaavalta vaikuttavan hakutuloksen. Klikkaan tieni sivustolle ja alan etsiä. Eksyn sivupolun sivupolulle. Silmät harovat tekstimassaa toisensa perään etsien johtolankaa siitä, että olen oikeilla jäljillä. En kuitenkaan löydä etsimääni. Uuvun alta aikayksikön. Ryhti lysähtää kasaan. Luovutan. Onko keskittymiskykyni todella näin pirstaloitunut? Olenko huono googlaamaan? Eikö kärsivällisyyteni mitenkään riitä tämän enempään? Ovatko tiedonhakutaitoni alkeelliset? Enkö vaan osaa? Vai olenko laiska, tyhmä ja saamaton? Luultavasti kaikkea tästä ja ei mitään näistä On totta, että keskittymiskykyni on pirstaloitunut. Vaikka meditoin 10 minuuttia joka aamu, ei se auta palauttamaan vuosikausien nopeatempoisen työelämän, multitaskauksen ja älylaitteiden aivojen runtelua. Vasta nyt huomaan, miten nopeasti uuvun ja miten lyhyeksi sinnikkyyteni on paikoin käynyt – ja mietin kuumeisesti, mitä voin tehdä asialle. Keskittymiskyvyn ja sinnikkyyden pitää riittää hirvittävän moneen asiaan, mutta kaikkeen ne eivät riitä. Aivot ovat oppineet (laiskuuttaan, energiatehokkuuttaan ja kokemuksesta) arvioimaan lennossa, kannattaako pinnistellä vai ei. Toisinaan ne eivät jaksa pinnistellä silloinkaan, kun kannattaisi. Silloin iskee murheellinen epätoivo ja huonommuuden tunne – miten voin olla NÄIN repaleinen? Saako kysyä apua, jos ei ansaitse sitä? Viimeisimmäksi epätoivo iski Tilastokeskuksen sivuilla, kun etsin tiettyjä tilastoja tulevaa tietokirjaa varten. Olin mielestäni etsimässä selkeää asiaa ja Tilastokeskuksella on melko hyvät verkkosivut. Selasin ja kahlasin ja eksyin ja etsin. Sitten tajusin, etten löydä ja harmistuin. Iski tuttu kysymys: voinko lähettää asiakaspalveluun kysymyksen, vai ajattelevatko he siellä, että olen laiska ja tyhmä, kun en tämän vertaa heidän sivuiltaan jaksa etsiä tai osaa löytää. Kauanko pitää ensin itse yrittää, että on ansainnut oikeuden pyytää apua? Toiset harhailevat kaupoissa viimeiseen asti itse asiaa etsien ennen kuin kysyvät myyjältä. Minä taas marssin kaupassa myyjän luo melkein heti, kun sellaisen jossain näen. Sen sijaan internetissä iskee joku ihme jääräpäisyys-kainous-hävetys. Enhän minä nyt voi mitään apua pyytää tämmöisen naurettavan räpellyksen jälkeen. Vaikka kukaan ei edes tiedä eikä näe, että kauanko olen siellä päätäni seinään hakannut! Siispä kysyin ja onneksi kysyin Torhiinnuin lopulta ja laitoin Tilastokeskukseen viestin lomakkeella. Kerroin mitä etsin ja miksi etsin. Nuolin hetken haavojani ja painuin päivän muiden töiden pariin. Muutaman tunnin päästä sähköposti kilahti ja sain vastauksen Tilastokeskuksen informaatikolta. Ja minkä vastauksen sainkaan! Pitkän, monipuolisen ja perusteellisen. Siinä oli kaikki, mitä olin ikinä keksinyt etsiä ja toivoa ja aika paljon päälle. Oli selvityksiä ja selostuksia. Oli linkkejä myös muihin lähteisiin. Yhteystietoja, mistä kysyä vielä lisää tarkemmin. Luojan kiitos kysyin. Vaikka minulla olisi ollut kaikki maailman keskittymiskyky ja sinnikkyys, en ehkä silti olisi koskaan löytänyt kaikkea tätä tietoa yksin. Tietoa, joka hänellä oli jo hallussa ja jonka hän pystyi toimittamaan minulle muutamassa tunnissa selkeässä sähköpostiviestissä. Ehkä pirstaloitumistamme ei voi enää tyystin estää. Ehkä emme enää pärjää pelkästään sinnikkyydellä ja keskittymällä. Hyvä uutinen on kuitenkin se, että ehkä selviämme kysymällä ja apua pyytämällä – ja tietoa ja osaamista jakamalla. Siis jos sinun on pitänyt joskus kysyä jotain – minulta, tai joltain muulta – niin mitä jos vaan kysyisit? Artikkeli kategoriassa Käyttäytyminen Avainsanat kantapääni, kysyminen"
