["https://elisaheikura.fi/vaikka-olet-nainen"]
title = "Vaikka olet nainen? | Elisa Heikura"
description = "Mielipiteeni repeää ihan juuri kahtia. Yhtäältä olen todella onnellinen, että viime päivinä on vatvottu tasa-arvokysymyksiä hashtagin #vaikkaolennainen johdolla. Julkisuuteen ilmaantui Laura…"
full_description = "Kirjoitettu 11.5.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Vaikka olet nainen? Vaikka olet nainen? Mielipiteeni repeää ihan juuri kahtia. Yhtäältä olen todella onnellinen, että viime päivinä on vatvottu tasa-arvokysymyksiä hashtagin #vaikkaolennainen johdolla. Julkisuuteen ilmaantui Laura, jota oli kohdeltu pöyristyttävällä tavalla, kun hän oli hakenut suomalaiseen metsäjättiin kesätöihin. Tarina synnytti kiivaan ryöpytyksen, jossa puitiin, onko oikein kieltäytyä ottamasta naista haastatteluun, koska hän on nainen. On ehdottomasti hyvä, että yhteiskunnan piintyneisiin asenteisiin ja sukupuoleen tuijottavien jääräpäiden änkyröintiin puututaan. Epäkohdat on hyvä tuoda esiin ja niistä on tärkeää puhua julkisesti, avoimesti ja järkevästi. Joku nainen vaan. © Jukka Salminen Hashtag #vaikkaolennainen aiheuttaa minussa sen sijaan todella ristiriitaisia tunteita. Ymmärrän, että se oli varmasti tarkoitettu ironiseksi tai leikilliseksi ja sen oli määrä korostaa tilanteen älyttömyyttä. Kuitenkin, kun se on alkuperäisen avauksen jälkeen levinnyt kulovalkean tavoin ja se on irrotettu alkuperäisestä kontekstistaan, se kääntyy hiljalleen itseään vastaan. #vaikkaolennainen viestii, että minut tulisi palkata, vaikka olen nainen. ”Vaikka” antaa olettaa, että minussa on työmarkkinoiden näkokulmasta jotain lähtökohtaisesti huonoa, koska olen nainen ja näin ei tietenkään saa olla. Siksi hashtagin käyttäminen itseasiassa vahvistaa sitä rakennetta, josta hashtagia julkisessa keskustelussa pyörittävät tahot metsäjättiä syyttävät, eikä pura sitä. #vaikkaolennainen vahvistaa sellaista vallitsevaa puhetapaa, jossa naiset ovat heikompi kansanosa, joka vaatii erityistä tasa-arvosuojelua. Se taas tekee naisista yhteiskunnan uhreja. Me olemme heikompi kansanosa niin kauan, kun ajattelemme olevamme heikompia ja annamme muiden kohdella meitä heikompina. Me pysymme uhreina niin kauan, kuin puhumme itsestämme uhreina. Uskon vahvasti, että valitsemamme sanat muovaavat ajatteluamme ja ajattelumme muodostaa todellisuutemme. Siksi ei ole merkityksetöntä, käytämmekö hashtagia #vaikkaolennainen vai #koskaolenyksilö tai #koskaolenhyvä. Älkää suostuko uhreiksi. Älkää itse johdonmukaisesti toistako ajattelumallia, jossa naisessa on työmarkkinoiden näkökulmasta jotakin huonoa tai väärää. Älkää käyttäkö sanoja, jotka ottavat vallan pois teiltä itseltänne. Älkää käyttäkö hashtagia #vaikkaolennainen. Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Viestintä Avainsanat #koskaolenyksilö, #vaikkaolennainen, Kyseenalaistaminen, Tasa-arvo, Uudelleenajattelu"
