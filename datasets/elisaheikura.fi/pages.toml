["https://elisaheikura.fi/avainsanat/hyvinvointi"]
title = "Avainsana: hyvinvointi | Elisa Heikura"
full_description = "Kirjoitettu 10.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Kaikki mitä vastustat, you know Kaikki mitä vastustat, you know Tähän kuuluisi laittaa kulunut sitaatti Äiti Teresasta ja sodan vs. rauhan puolesta marssimisesta. Uumoilen, että tiedät sen laittamattakin (tai googlaat nopeasti salaa), joten voin mennä suoraan aiheeseen. Tämä minun ei-niin-surkeiden sekoamisteni sarja jatkuu ja nyt olen hurahtanut hyväksyvään lempeyteen. Vastustamalla pahenee Olen siis viimein havainnut todeksi sen, minkä viisaat ihmiset ovat tienneet aina: vastustamalla pahenee. Elämässäni pitkään vaikuttanut Hanna tapasi aina tokaista minulle, että ”älä hytise, syleile kylmyyttä”, kun hampaat loukkua lyöden ja huulet sinisenä tärisin pakkasessa. Ai että se vitutti. Ai että kuinka oikeassa hän olikaan. Lue lisää Kaikki mitä vastustat, you know Artikkeli kategoriassa Ajatteleminen Avainsanat Elisa, hyvinvointi, ihmisyys, kantapääni, Uudelleenajattelu Kirjoitettu 27.3.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Pitääkö sinutkin huostaanottaa? Pitääkö sinutkin huostaanottaa? Jos olisin itseni lapsi, viimeisen vuoden aikana minut olisi huostaanotettu. Olin kakara, jolla ei ollut mitään kotiintulo- tai nukkumaanmenoaikoja, säännöllistä ruokarytmiä tai karkkipäiviä. Kanssani oli ihan turha edes aloittaa keskustelua liikunnasta tai ulkoilusta, koska nyt just ei ehdi ja on ollut vähän kiire. Annoin itseni tehdä töitä yömyöhään ja uhrasin työn alttarilla kaikki vapaapäivätkin. Ellei minulla olisi käsittämätöntä lahjaa saada unenpäästä kiinni ja nukkua kokonaisia öitä äärimmäisessä stressissäkin, en ehkä olisi tolpillani ja järjissäni juuri nyt. Meinasin pillahtaa itkuun, kun yhtäkkiä kevätauringon valjetessa minullekin valkeni, millainen mulkku olen ollut omaa kehoani kohtaan. Lue lisää Pitääkö sinutkin huostaanottaa? Artikkeli kategoriassa Kulttuuri, Yleinen Avainsanat asiantuntija, hyvinvointi, ilmiö, kantapääni"
