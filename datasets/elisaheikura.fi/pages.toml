["https://elisaheikura.fi/kaikki-mita-vastustat-you-know"]
title = "Kaikki mitä vastustat, you know | Elisa Heikura"
description = "Tekeekö mieli vähän vastustaa? Että jotain tässä elämässä kuitenkin täytyy vastustaa! Väärinkohtelua, idioottimaisia tehtäväksiantoja, yleistä pölhöpäisyyttä, maanantaita, lakia tai laittomuuksia?"
full_description = "Kirjoitettu 10.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Kaikki mitä vastustat, you know Kaikki mitä vastustat, you know Tähän kuuluisi laittaa kulunut sitaatti Äiti Teresasta ja sodan vs. rauhan puolesta marssimisesta. Uumoilen, että tiedät sen laittamattakin (tai googlaat nopeasti salaa), joten voin mennä suoraan aiheeseen. Tämä minun ei-niin-surkeiden sekoamisteni sarja jatkuu ja nyt olen hurahtanut hyväksyvään lempeyteen. Vastustamalla pahenee Olen siis viimein havainnut todeksi sen, minkä viisaat ihmiset ovat tienneet aina: vastustamalla pahenee. Elämässäni pitkään vaikuttanut Hanna tapasi aina tokaista minulle, että ”älä hytise, syleile kylmyyttä”, kun hampaat loukkua lyöden ja huulet sinisenä tärisin pakkasessa. Ai että se vitutti. Ai että kuinka oikeassa hän olikaan. Kylmyys, kipu, sydänsurut, ärsyttävät ihmiset, henkinen ahdinko, ne kaikki saavat voimaa vastustamisesta. Kun tunteiden antaa pyyhkiä ylitse kuin aalto, eivät ne yleensä kauaa kestä. Kaikista optimistisimmat löytämäni arviot väittävät lupaavasti, että tunnereaktio (johon ihminen ei tartu) kestää vain 90 sekuntia. Oma viimeaikainen kokemukseni näyttäisi olevan linjassa tämän arvion kanssa. Paitsi se kylmä. Kylmä tietysti kestää niin kauan, kuin kylmässä päättää hytistä, mutta ei sekään tunnu niin pahalta, kun siihen ei takerru. Ja mitä tulee sydänsuruihin, niin suru palaa niin kauan kuin prosessia on jäljellä. Mutta niihin yksittäisiin tunteisiin matkan varrella ei ole missään tapauksessa pakko jäädä vellomaan. Paitsi tietysti, jos itku tuntuu hyvältä ja helpottavalta – niin kuin usein tuntuu, kun sen antaa vapaasti tulla. Muttaku! Tekeekö mieli vähän vastustaa? Että jotain tässä elämässä kuitenkin täytyy vastustaa! Väärinkohtelua, idioottimaisia tehtäväksiantoja, yleistä pölhöpäisyyttä, maanantaita, lakia tai laittomuuksia? No nyt on sitten kuitenkin kaivettava esiin se Äiti Teresan sitaatti: Aina on kaksi vaihtoehtoa, voi vastustaa sotaa tai marssia rauhan puolesta. Voi vastustaa väärinkohtelua tai sitten keskittää saman energian etsiäkseen reitin ratkaista, muuttaa, parantaa. Tai etsiä itselleen uutta tietä, työtä, ihmissuhdetta. Voi vastustaa tilannetta tai hyväksyä, ettei sille voi mitään, jos sille todella ei voi mitään. Voi vastustaa itseään tai katsoa itseään lempeydellä: tässä olen nyt. En vielä perillä, mutta menossa sinne päin. Luovimalla – ei väkisin vastatuuleen soutamalla Asioita ei useinkaan kannata runtata läpi väkisin. Tätä ei nyt pidä sekoittaa siihen, etteikö kannata olla sinnikäs, uuttera, riittävän periksiantamaton. Kannattaa olla. Päämääristään ei pidä luopua, mutta keinoja kannattaa tarkastella lempeydellä. Reittejä on useimmiten monia. Ensin rakkaus, nyt lempeys, mitä seuraavaksi? En tiedä, todennäköisesti jotain todella hippiä. Artikkeli kategoriassa Ajatteleminen Avainsanat Elisa, hyvinvointi, ihmisyys, kantapääni, Uudelleenajattelu"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
year_updated = 2018
