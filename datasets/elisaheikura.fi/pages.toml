["https://elisaheikura.fi/teko-on-yhdentekeva"]
title = "Teko on yhdentekevä | Elisa Heikura"
description = "Käytämme ihan käsittämättömiä määriä aikaa ja energiaa puhuaksemme siitä, mitä joku teki tai jätti tekemättä – sekä yllättävän paljon myös siitä, mitkä olivat ihmisen aikeet tekojen takana. Sehän on se kuuluisa tarkoitus, kun ne keinot pyhittää, vai mitä?"
full_description = "Kirjoitettu 8.10.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Teko on yhdentekevä Teko on yhdentekevä Yksi päivä päässäni muljahti. Ymmärsin, kuinka tarkoitus- ja teko-orientoituneita olemme. Käytämme ihan käsittämättömiä määriä aikaa ja energiaa puhuaksemme siitä, mitä joku teki tai jätti tekemättä – sekä yllättävän paljon myös siitä, mitkä olivat ihmisen aikeet tekojen takana. Sehän on se kuuluisa tarkoitus, kun ne keinot pyhittää, vai mitä? Jos asiaa kuitenkin tarkastelee tarkemmin, niin mahtaako teolla itsellään olla ihan yhtään mitään merkitystä? Entä, jos ne ovatkin ne seuraukset, joihin meidän pitäisi kiinnittää katseemme. Mitä sitten tapahtui? Tätä uutta aivoitusta muiden kanssa pallotellessani olen käyttänyt esimerkkinä tappoa. Voisi ajatella, että toisen ihmisen hengen vieminen on tekona väärin ja sillä hyvä. Mutta entä, jos kyse on eutanasiasta? Riippuen katsantokannastasi saatat olla tästä mieltä tai toista. Omassa maailmankuvassani eutanasia on armahdus ja tällöin toisen ihmisen elämänpolun pysäyttäminen ei ole tekona paha vaan hyvä, sillä sen seuraukset ovat hyvät. Teko, jolla ei ole seurauksia, ei kuohuta meitä. Vaikka meistä tuntuu, että se on se itse teko, joka meitä niin riemastuttaa tai suututtaa, niin silti tosiasiassa ne ovat ne seuraukset – tai viestit – joita teko mukanaan tuo, jotka meihin vaikuttavat. Öljyn kaataminen sademetsään olisi tekona yhdentekevä, ellei luonto saastuisi ja eläimet kärsisi siitä. Sukkien jättäminen lattialle olisi tekona yhdentekevä, ellen loukkaisi sillä sopimusta, jonka olemme tehneet ja siten viestittäisi sinulle, etten kunnioita tunteitasi ja toiveitasi. Entäs sitten? Tämä on nähdäkseni merkittävä oivallus erityisesti sen suhteen, miten annamme palautetta ja millaisia keskusteluja käymme ihmissuhteissamme. On jo tiedetty, että ”kun sä aina” ja ”kun sä et koskaan” ovat hyödyttömimmät riidanaiheet ikinä. Mutta oikeastaan ongelma on paljon isompi. ”Sä teit sitä ja tätä. Sä jätit sitä ja tätä tekemättä.” Entäs sitten? Minulla voi olla melko hyvä perustelu sille, miksi tein tai jätin tekemättä. Voi olla, että teko oli minulle merkityksetön tai tein jotain mielestäni tärkeämpää sen sijaan. En ehkä tajunnut, luulin ehkä tehneeni oikein ja onhan näitä näkökulmia. Jos kuitenkin keskittyisimme keskustelemaan siitä, mitä noista teoista seurasi, pääsisimme ehkä lopulta itse asiaan. Mitä seurauksia teoilla oli minulle, meidän ihmissuhteellemme, käsillä olevalle asialle, yhteiskunnalle, ihmiskunnalle, planeetalle? Vasta seurausten valossa pääsemme tarkastelemaan tekoni hyvyyttä tai pahuutta. Vasta seurausten myötä alan miettiä, pitäisiköhän minun ihan todella hieman muuttaa käyttäytymistäni, koska enhän suinkaan tarkoittanut näitä seurauksia tapahtuvaksi. Kahnemanilainen kolikon kääntöpuoli Toki tämä on meille ihmisille myös erittäin tyypillinen ajatusharha. Tuomitsemme tekoja – niitä tekohetkellä viattomia ja hyvin perustein tehtyjä – todella paljon tulosten ja vaikutusten perusteella. Ystävämme Kahneman käyttää siitä kirjassaan nimitystä the hindsight bias. Aina se ei ole oikeasti reilua. Joskus saamme rangaistuksen hyvästä teosta, jonka karmeita seurauksia emme tekohetkellä mitenkään voineet käsittää, ennustaa tai edes arvata. Siinä mielessä en ole lainkaan valmis heittämään vesakkoon myös teon itsensä sekä tarkoituksen tarkastelua. Enkä sano sitäkään, etteikö paha teko olisi paha silloinkin, vaikka sillä olisi hyvät seuraukset tai ei seurauksia lainkaan. (En, vaikka otsikossa julkean vähän toiseen suuntaan viitata.) Olen kuitenkin vähän väsynyt siihen, että takerrumme liiaksi tekojen ruotimiseen ja unohdamme katsoa, onko teolla itsellään lopulta mitään väliä seurausten valossa. Ja toisaalta syyttelemme toisiamme teoista ja unohdamme kertoa, mitkä ne seuraukset ovat, jotka auttaisivat sitä toistakin ymmärtämään, miksi tässä ollaan näin tuohtuneita. Tässä kohtaa ymmärrystä olen. Mitä mieltä sinä olet? Artikkeli kategoriassa Ajatteleminen, Filosofia Avainsanat Palaute, Seuraus, Teko, Viestintä"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
year_updated = 2018
clearnet = "https://elisaheikura.fi/teko-on-yhdentekeva"
