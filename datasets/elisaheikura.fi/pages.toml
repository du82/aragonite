["https://elisaheikura.fi/miten-niin-tama-ei-muka-tule-tanaan-valmiiksi"]
title = "Miten niin tämä ei muka tule tänään valmiiksi? | Elisa Heikura"
description = "Olen äärimmäisen huono sietämään keskeneräistä työtä. Se on luonnollisesti yhtä paljon siunaus kuin se on kirouskin."
full_description = "Kirjoitettu 18.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Miten niin tämä ei muka tule tänään valmiiksi? Miten niin tämä ei muka tule tänään valmiiksi? Olen äärimmäisen huono sietämään keskeneräistä työtä. Se on luonnollisesti yhtä paljon siunaus kuin se on kirouskin. Ilta-aurinko on alkanut laskea jo aikaa sitten ja silti minä ehdotan kummitädille, että josko kuitenkin haravoitaisiin tämä pelto loppuun. Eihän tätä nyt enää niin montaa kymmentä metriä ole jäljellä… Muuttolaatikot on aina käytännössä päivässä, parissa purettu. Puu-urakat tehdään kerralla liiteriin. Auringonpistoksen seurauksena saatan oksentaa koko seuraavan yön, mutta kun on kerran aloitettu, niin nurmikko leikataan kyllä todellakin loppuun asti. Mutta ne uunipellit? Kun olet illalla hinkannut kaksi ja puoli tuntia karrelle palanutta uunipeltiä, väsy painaa silmissä ja käsissä, pitäisi mennä nukkumaan ja töitäkin olisi tehtäväksi, on pakko nostaa käpälä pellistä ja lopettaa. Jättää se siihen. Jatkaa seuraavana päivänä. Kaiken siivoaminen on projekti, jota ei tehdä päivässä. Ja vaikka pääasiassa olen pyrkinyt ottamaan päivää kohden sellaisen palan, jonka saa valmiiksi, aina sekään ei onnistu. On ollut pakko opetella sietämään sitä, että nyt ei spurtata maaliin. On ollut pakko hyväksyä, että tämä on work in progress ja ottaa sen ajan, minkä se ottaa. Tässä tapauksessa takana on nyt kolme kuukautta ja epäilen, että kuukausi menee vielä, että kaikki on lopultakin siivottu. Kun ei voi keskittyä siihen, että nyt rutistetaan tämä kerralla valmiiksi, onkin tullut ruvettua tutkailemaan itse prosessia. Olet tässä Joskus muinoin olisi saattanut käydä niin, etten olisi tehnyt kolmeen viikkoon mitään muuta kuin siivonnut, kunnes kaikki on valmista ja sitten olisin huokaissut helpotuksesta. Tehokasta? Juu. Mukavat kolme viikkoa? Ei. Mitä olisin oppinut? Tuskin mitään. Sen sijaan tämä julmettu projekti on opettanut minut katsomaan kahta asiaa. Yhtäältä mikä kaikki on jo valmista. Ja toisaalta miltä missäkin kohtaa tuntuu. Koska juuri nyt palkintoa ei saa siitä, että kaikki on tehty, palkinto on otettava siitä tuopista puolimatkan krouvissa. Ei ole sitä siivouspäivän jälkeistä kaikkialla kimmeltävää puhtautta, jota voi tyytyväisenä sohvalla ihastella (ja joka kestää noin vartin). Vaan on opittava katsomaan putipuhdasta jääkaappia, eikä voi antaa keittiössä vallitsevan muun kaaoksen himmentää sitä iloa. Tämä opettelu kantaa hedelmää muillakin elämän osa-alueilla. On pari muutakin juttua, joissa keskeneräisyyden sietäminen, tilanteen levällään olemisen hyväksyminen ja odottaminen on tarpeen. On melko hyödyllistä osata olla onnellinen, kiitollinen ja iloinen osan valmistumisesta, vaikka kokonaisuus on vielä levällään. Sitäkin hyödyllisempää on opetella toteamaan, että ihan joka päivä maailmaa ei saa valmiiksi ja kyllä sitä huomennakin vielä ehtii. Artikkeli kategoriassa Ajatteleminen Avainsanat Kärsivällisyys, Oivallus, Prosessi, Siivoaminen"
author = "Kirjoittaja Elisa Heikura"
year_published = 2018
year_updated = 2018
