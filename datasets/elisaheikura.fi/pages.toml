["https://elisaheikura.fi/avainsanat/asiantuntija"]
title = "Avainsana: asiantuntija | Elisa Heikura"
full_description = "Kirjoitettu 2.4.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Malja jokaiselle mäelle ja yksi ystävälle Malja jokaiselle mäelle ja yksi ystävälle Isälläni oli yritys. Mummollani kahvila. Ukkini myi päivätyönsä ohessa kaikkea vakuutuksista rapuihin. Ellen väärin muista, isoukkini oli suutari. Ja toisella puolen sukuhaaraa on maanviljelijöitä. Voisi ehkä sanoa, että päätös yrittäjäksi ryhtymisestä oli vain ajan kysymys ja tavallaan se olisi totta. Mutta tosiasiassa se ei ole totta ollenkaan. Tästä rohkeudesta ja päättäväisyydestä on enimmäkseen kiittäminen yhtä ihmistä elämässäni, nimittäin Janne Jääskeläistä. Lue lisää Malja jokaiselle mäelle ja yksi ystävälle Artikkeli kategoriassa Yleinen, Yrittäjyys Avainsanat asiantuntija, Elämän tarkoitus, Elisa, Pohdinta Kirjoitettu 27.3.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Pitääkö sinutkin huostaanottaa? Pitääkö sinutkin huostaanottaa? Jos olisin itseni lapsi, viimeisen vuoden aikana minut olisi huostaanotettu. Olin kakara, jolla ei ollut mitään kotiintulo- tai nukkumaanmenoaikoja, säännöllistä ruokarytmiä tai karkkipäiviä. Kanssani oli ihan turha edes aloittaa keskustelua liikunnasta tai ulkoilusta, koska nyt just ei ehdi ja on ollut vähän kiire. Annoin itseni tehdä töitä yömyöhään ja uhrasin työn alttarilla kaikki vapaapäivätkin. Ellei minulla olisi käsittämätöntä lahjaa saada unenpäästä kiinni ja nukkua kokonaisia öitä äärimmäisessä stressissäkin, en ehkä olisi tolpillani ja järjissäni juuri nyt. Meinasin pillahtaa itkuun, kun yhtäkkiä kevätauringon valjetessa minullekin valkeni, millainen mulkku olen ollut omaa kehoani kohtaan. Lue lisää Pitääkö sinutkin huostaanottaa? Artikkeli kategoriassa Kulttuuri, Yleinen Avainsanat asiantuntija, hyvinvointi, ilmiö, kantapääni"
