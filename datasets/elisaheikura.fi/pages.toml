["https://elisaheikura.fi/kategoriat/kulttuuri"]
title = "Kategoria: Kulttuuri | Elisa Heikura"
full_description = 'Kirjoitettu 24.8.2020Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Minkä jälkeen sinulla ei vaan voi olla enempää? Minkä jälkeen sinulla ei vaan voi olla enempää? Tänä aamuna Instagramissa vanha koulututtuni kirjoitti, että hän toivoo ”tulevaisuudelta aina eniten sitä, että saisi pitää sen, mitä jo on”. Twitterissä Marko Suomi puolestaan jakoi Ylen artikkelin kolmesti loppuunpalaneesta naisesta. Samaistun! "Kiire, syyllisyys, #goals, ristiriitaiset odotukset, FOMO, täydellisyyden tavoittelu, loputon uutisvirta, itsekriittisyys, jatkuva viestitulva ja tavoitettavissa olemisen vaatimus, loputtomat projektit ja to do -listat, itsensä kehittäminen, riittämättömyys." — Marko Suomi (@markosuomi) August 24, 2020 TÄMÄ "" Kovat paineet ovat nykyajassa. Ennen piti menestyä. Nyt pitää menestyä JA olla onnellinen JA seurata omaa intohimoa JA näyttää hyvältä, kun tekee tämän kaiken." — Marko Suomi (@markosuomi) August 24, 2020 Nämä saivat jonkun synapsin aivoissa aktivoitumaan ja yhtäkkiä aloin miettiä, minkä verran asioita ihmisillä ylipäätään voi olla. Onko aikamme uupumisen, kiireen ja jatkuvan paremman elämän rakentamisen ytimessä virheellinen kuvitelma, että kaikki on mahdollista ja täten kaikkea pitää tavoitella? Entä jos elämämme piirillä on mitta Tulin ajatelleeksi, että mitä jos elämässä olevien asioiden määrä olisikin jollain tapaa samanlainen vakio kuin vuorokauden tunnit. Siis että jokaisella on 24 tuntia joka päivä ja jokaisella on 24 asiaa, joista on realistista pitää huolta. Leiki hetki kanssani tällä ajatuksella. Mieti, mitä sinulla jo on. Perhettäsi, ystäviäsi, hyvän päivän tuttujasi, harrastuksiasi, rutiinejasi, kotiasi, kesämökkiäsi, laivaasi tai autoasi tai polkupyörääsi, lemmikkejäsi, soittimiasi, taitojasi, fyysistä kuntoasi, muuta maallista omaisuuttasi, projektejasi ja tavoitteitasi. Montako voisit ottaa tähän kasaan lisää, että et alkaisi laiminlyödä mitään jo olemassa olevaa? Mikä on uuden arvo, jos sen suhteuttaa vanhan arvoon? Jos opettelet uuden kielen, oletko valmis unohtamaan jotain muuta? Jos löydät uuden ystävän, oletko valmis luopumaan yhdestä vanhasta? Jos otat elämääsi uuden projektin, kestätkö, jos joku muu elämäsi nurkka alkaa repsottaa? Mikä on uusien asioiden, taitojen, ihmisten ja omaisuuden haalimisen hinta? Tietenkään se, että opettelee uuden kielen, ei tarkoita vanhan unohtumista. Mutta montaako kieltä ihminen voi osata ja ylläpitää, ennen kuin joku unohtuu? Tai tarkoittaako loputon kielten opettelu sitä, ettet ehdi huoltaa polkupyörääsi? Kaikki, mistä emme pidä huolta, ennen pitkää rapistuu: ihmissuhteet, taidot, kunto ja omaisuus yhtä lailla. Vaatteet pölyyntyvät nurkissa, soitinten ääni tunkkastuu, Cooperin testin tulos laskee, puutarha pajukoituu, maali hilseilee, ystävä vastaa puhelimeen vähän vähemmän innostuneesti. Saamme pitää vain sen, mistä pidämme huolta. Montako asiaa yhden ihmisen on mahdollista pitää? Tunti on vaikea mittayksikkö Keskusteluissa vilisevät kaikki ne lukemattomat lukemattomat kirjat, ne kaikki syksyn uudet taitokurssit, itsensäkehittämisprojektit, uudet kesämökit, meditointihaasteet ja kaikki se, mihin pitäisi ryhtyä. Ihmiset kipuilevat, kun eivät voi ottaa kaikkea sitä uutta, mitä haluaisivat. Suunnilleen jokainen tuskailee sen kanssa, että vuorokauden tunnit eivät riitä kaikkeen. Ehkä tuntien miettiminen ei kuitenkaan auta meitä tarkastelemaan elämäämme kokonaisuutena? Mitä jos kyse ei ole siitä, onko meillä aikaa vaan siitä, onko elämässämme tilaa jollekin uudelle, mitä siellä ei vielä ole? Mitä jos laarini on jo täynnä? Mitä jos minulla on jo ne 24 (tai oikeastaan 240) asiaa, joiden ylläpitoon minun tulisi keskittyä, jos haluan pitää ne? Entäs jos oikea kysymys ei olekaan, että ”mitä uutta voin ottaa” vaan toteamus, että en voi ottaa enää mitään uutta! Tai siis voin, mutta minun on tehtävä se tietäen, että luovun silloin jostain vanhasta. Tarvitsemmeko jonkun sanomaan, että tämä riittää? Tuntuu, että korona antoi monelle hyvän syyn olla kotona, tehdä vähemmän ja jättäytyä pois niistä lukuisista sitoumuksista, jotka on joskus tullut tehneeksi. Tarvitsimme ulkopuolelta painavan syyn, jolle emme itse voineet mitään. Mutta mitä meille tapahtuu, kun aika joskus taas muuttuu ja koko mahdollisuuksien maailma aukeaa jälleen edessämme? Entä se mahdollisuuksien maailma, joka edelleen on saatavilla koronasta huolimatta? Helpottaisiko tuskaasi, jos olisi joku quota, jonka täyttyminen olisi merkki siitä, että nyt sinun rajasi on tässä? Loppuisiko päättymätön kaiken tavoittelu, helpottaisiko fomo? Muuttuisiko ein sanominen helpommaksi? ”Kiitos kutsusta, olisi kiva osallistua, mutta minun 24 asiaani on täynnä ja joutuisin heittämään isäni yli laidan, jos sanoisin tälle kyllä.” Vain kourallinen rakastettavia asioita Itselleni tämä kevät on ollut tärkeä. Korona pakotti minut kuukausiksi aloilleen, muutto maalle toi elämääni uusia asioita. Se myös vei elämästäni paljon asioita. Paljon asioita jäi Helsinkiin. Isoja paloja arjesta katosi koronan myötä. Silti liikutuin miltei kyyneliin ystäväni Instagram-päivityksestä. Oivalsin, että haluan pitää tämän. Tämän arjen, tämän työn, tämän kodin, tämän perheen. Se tarkoittaa sitä, että kovin monelle muulle asialle en voi enää sanoa kyllä. Saan toivottavasti pitää sen, mistä olen valmis pitämään huolta. Artikkeli kategoriassa Kulttuuri'
