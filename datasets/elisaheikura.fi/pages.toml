["https://elisaheikura.fi/sinulla-ei-ole-oikeutta-mihinkaan"]
title = "Sinulla ei ole oikeutta mihinkään | Elisa Heikura"
description = "Sinulla ei lähtökohtaisesti ole OIKEUTTA esimerkiksi ruokaan. Sinulla on siihen mahdollisuus, koska muut ihmiset valmistavat ja luonto kasvattaa sitä sinulle."
full_description = "Kirjoitettu 26.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Sinulla ei ole oikeutta mihinkään Sinulla ei ole oikeutta mihinkään Ennen kuin aloitan, niin pieni taustoittava alkukaneetti: Minä olen vahva ilmaisen koulutuksen ja terveydenhuollon kannattaja. Kannatan perustuloa. Kannatan parempaa palkkaa heille, jotka pitävät huolta lapsista, vanhuksista ja sairastuneista sekä heille, jotka pitävät huolta turvallisuudestamme. Pidä tämä mielessäsi, kun siirryt eteenpäin. Täytyy myös heti korjata vähän otsikkoa. Sinulla on oikeus olla olemassa. Se on jokaisen ihmisen yhtäläinen ja kiistaton oikeus. Tästä syystä en kannata kuolemanrangaistusta, sillä vaikka ihmisen teot olisivat kuinka hirveitä, ne eivät vie olemassaolon oikeutta. Jokainen ihminen – kamalimmatkin – ovat lähtökohtaisesti arvokkaita ja siksi jokaisella on oikeus olla olemassa. Mutta siihen oikeudet sitten loppuvat Ihmisillä on todella harhainen kuvitelma, että heillä on oikeus yhtään mihinkään. Epäilen, että tämä harha on peräisin ajatusmallista, jossa kuvittelemme olevamme riippumattomia ja kaikkivoipia oman elämämme suhteen. Me emme ole riippumattomia vaan äärimmäisen riippuvaisia muista ihmisistä ja meidän tulisi muistaa se joka päivä. Ensi alkuun olemme riippuvaisia perheestämme, myöhemmin olemme riippuvaisia yhteiskunnasta. Joka päivä olemme riippuvaisia siitä, että joku muu kasvattaa ruokamme, suojelee koskemattomuuttamme ja kouluttaa lapsemme. Olet riippuvainen maanviljelijästä, joka herää joka aamu neljältä lypsämään lehmät, jotta sinulla on aamukahvimaitoa. Olet riippuvainen lastentarhan tädistä, jonka hellään huomaan viet mukulasi, jotta voit mennä työhön, jonka itse olet itsellesi valinnut. Olet riippuvainen lähestulkoon jokaisesta ihmisestä, jota vastaan kävelet kadulla. Sinulla ei ole oikeutta ruokaan ja unelmien työpaikkaan Sinulla ei lähtökohtaisesti ole OIKEUTTA esimerkiksi ruokaan. Sinulla on siihen mahdollisuus, koska muut ihmiset valmistavat ja luonto kasvattaa sitä sinulle. Tämä ero on tärkeä ymmärtää. Sinun hyvinvointisi, turvallisuutesi, ravintosi on kaikki peräisin toisten ihmisten ja luonnon anteliaisuudesta. Meidän tulisi olla jatkuvasti kiitollisia, että joku muu tekee ne työt joita me emme halua tehdä, jotta meillä olisi asioita joita haluamme ja tarvitsemme. Jokainen meistä antaa yhteiskunnalle sen panoksen, mihin itse pystyy ja mistä on yhteiskunnalle eniten hyötyä. Tai siis pitäisi antaa. Sen sijaan meille on kehittynyt todella omituinen harhakuvitelma, että yhteiskunta olisi meille velkaa mieluisan koulutuksen, työpaikan ja aseman. Sinulla ei kuitenkaan ole oikeutta haluamaasi työhön – ei edes koulutustasi vastaavaan työhön. Sinulla on mahdollisuus haluamaasi, koulutusta vastaavaan työhön. Mutta jos sinun haluamallesi työlle tai koulutuksellesi ei kerta kaikkiaan ole kysyntää, se ei ole yhteiskunnan tai toisten ihmisten vika. Velvollisuutemme ylipäätään työhön kumpuaa kiitollisuudesta. Työllä (tai ihan millä tahansa kontribuutiolla yhteiskuntaamme) maksat takaisin kaikille niille ihmisille, jotka puolestaan antavat aikansa, jotta sinulla olisi ruokaa, turvaa ja terveyttä. Osoitamme kiitollisuutta. Kun muistamme oman riippuvuutemme, emme voi uskotella itsellemme, että meillä olisi lähtökohtaisesti oikeus mihinkään. Meillä on vain mahdollisuuksia. Artikkeli kategoriassa Jyrähdys Avainsanat Ihminen, ilmiö, Oikeus, Velvollisuus, Yhteiskunta"
author = "Kirjoittaja Elisa Heikura"
