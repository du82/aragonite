["https://elisaheikura.fi/ei-mutan-muttaa"]
title = "Ei mutan muttaa | Elisa Heikura"
description = "Näistä päin turpavärkkiä singahtelevista elämänopetuksista kouraan on tarttunut yksi erityisen väkevä, jonka haluaisin jakaa teidän kanssanne. Se menee näin."
full_description = "Kirjoitettu 17.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Ei mutan muttaa Ei mutan muttaa En välttämättä sanoisi, että kulunut 12 kuukautta olisi ollut elämässäni helppo, mutta se toi mukanaan oivalluksia. Ensin niitä heiteltiin minulle lempeästi. Kas tässä, ota koppi. Sitten niitä alkoi tulla vähän rivakammalla tahdilla. Nyt on kuin istuisi tenniskentällä oikosulkuun menneen pallonsyöttökoneen edessä, housut punaisessa pinnoitteessa, naama mustelmilla. Alright, elämä, I get it. Sulla on asiaa. Näistä päin turpavärkkiä singahtelevista elämänopetuksista kouraan on tarttunut yksi erityisen väkevä, jonka haluaisin jakaa teidän kanssanne. Se menee näin. Minä olen vastuussa. Minä vain olen. Enkä nyt puhu siitä huolenpidollisesta vastuusta, josta puhuin hiljattain, vaikka toki siitäkin olen vastuussa. Enkä edes sitä, että olen vastuussa teoistani ja sanoistani, vaikka tietysti myös niistäkin. Olen etenkin samaa mieltä Katleena Kortesuon kanssa itsevastuun periaatteesta, mutten nyt sitäkään aja tässä takaa. Ajan takaa sitä totuutta, joka monilta karkaa. Sitä, että minä olen vastuussa omista tunteistani, tarpeistani ja reaktioistani. On nimittäin äärettömän mukavaa sysätä vastuu pois omilta harteilta. Siskot, kyllä onkin. Vastuunkanto on ikävää, hankalaa, epämiellyttävää, haastavaa ja työlästä. Ja aina on melko kiva syyttää kaikkia muita tilanteesta, paitsi itseään. Mutta, ironista kyllä, kantamalla vastuun ihminen on lopulta onnellisempi, kuin ikävää tehtävää väistellessään. Voi olla että tämä ei ole uutinen Eikä sen toisaalta tarvitsekaan olla. Toivottavasti kaikki muut ovat tajunneet tämän minua ennen, mutta uumoilen, että eivät ole. Minulle se oli kerta kaikkiaan mullistava hetki, kun tajusin todella olevani yksin vastuussa omista tunteistani, tarpeistani ja reaktioistani. Se tarkoittaa sitä, että on minun velvollisuuteni kertoa, mitä tunnen ja mitä tarvitsen. Olen vastuussa siitä. Jos joku tekee minua kohtaan väärin, on velvollisuuteni kertoa siitä. Jos kaipaan lohtua, vain minä voin sanoa sen ääneen. Kukaan ei voi toimia toivomallani tavalla tai kohdella minua toivomallani tavalla, ellen kerro sitä. Paitsi joskus ihan tuurilla. Kukaan ei nimittäin vielä tänäkään päivänä lue ajatuksiani. Ja vaikka lukisikin, en voi jättää omia tunteitani ja tarpeitani ajatustenlukijan vastuulle ja olettaa hänen kuuntelevan. Se ei ole hänen vastuunsa, vaan minun. Olen myös täysin vastuussa reaktioistani. Toinen ihminen on vastuussa omista teoistaan, mutta minä yksin kannan vastuun siitä, miten siihen reagoin. Jos minua kohdellaan väärin huolimatta siitä, että olen vastuullisesti kertonut, miltä se minusta tuntuu, voin olla vihainen tai lähteä menemään tai yrittää toista keskustelutaktiikkaa. Mutta en voi enää vierittää vastuuta tilanteesta pois, sillä olen itse päättänyt reagoida, kuten reagoin. Me emme saa toista ihmistä muuttumaan. Vain itsemme. Olenko nyt viisas ja tyyni hautaan asti? Itseni tuntien tuskinpa vain. Eikä ymmärtäminen ole tietenkään sama asia, kuin asian täydellinen käytäntöön siirtäminen. Tämä ihmisen vastuu itsestään ei ole kovin kevyt taakka, enkä epäile hetkeäkään, ettenkö minäkin välillä haluaisi sysätä sen jonkun toisen harteille. Tällä oivalluksella on muuten tosi jännä sivuvaikutus. Valittaminen muuttuu todella vaikeaksi. Pelkkä valittaminen ei ole vastuullista. No, sitten jos kipuaa ensimmäisen vuoren yli ja kertoo avoimesti tunteistaan ja tarpeistaan, eikä tilanne muutu, päätyy vain uuden epämukavan tilanteen eteen. Kas, olen vastuussa myös siitä, miten suhtaudun ja reagoin tähän. Miten voin valittaa, jos itse olen päättänyt jäädä, hyväksyä, sietää? Siksi ymmärrän, että tässä tehtävässä ei voi aina onnistua. Eikä valtaosa ole koskaan valmiita kantamaan kaikkea sitä vastuuta itsestään, joka ihmiselle kuuluisi. Mutta jos joskus edes pienen sirpaleen, niin minkähänlaiset vaikutukset sillä voisi olla? Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Yleinen Avainsanat ihmisyys, vastuullisus"
author = "Kirjoittaja Elisa Heikura"
year_published = 2017
year_updated = 2018
clearnet = "https://elisaheikura.fi/ei-mutan-muttaa"
