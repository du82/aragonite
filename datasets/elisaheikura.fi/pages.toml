["https://elisaheikura.fi/avainsanat/oikeinkirjoitus"]
title = "Avainsana: Oikeinkirjoitus | Elisa Heikura"
full_description = "Kirjoitettu 4.3.2015Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Minun possessiivisuffiksini Minun possessiivisuffiksini Yksi lempiasioitani äidinkielessämme on possessiivisuffiksi ja tässäkin lausessa niitä on kaksi. Possessiivisuffiksi on nimittäin omistusliite. Omistusliite lisätään substantiivin perään, jos substantiivia edeltää genetiivissä oleva persoonapronomini: minun lempiasioitani meidän äidinkielessämme. Erityisen tärkeä possessiivisuffiksi on silloin, jos omistettu substantiivi esiintyy ilman pronominiaan: lempiasioitani äidinkielessämme. Ilman possessiivisuffiksia subjekti ei kerro kuuluvansa kenellekään: lempiasioita äidinkielessä. Puhekielessä omistusliitettä ei useimmiten käytetä: mun lempiasioita meidän äidinkielessä. Kirjakieleen se kuitenkin kuuluu. Omistusliite kertoo, kenelle asiat kuuluvat. © Minna Hokkanen Ilman omistusliitettä teksti tuntuu veltolta ja vetelältä. Vaikka omistusliite pidentää lausetta kahden tai kolmen merkin verran, se itseasiassa napakoittaa ilmaisua. Omistusliitteetön ilmaus tuntuu vaillinaiselta ja huolimattomalta, jopa laiskalta. Minulle hiljattain väitettiin, että omistusliitteet ovat täysin tarpeettomia. Mutta eiväthän ne ole! Ilman omistusliitteitä en voisi sanoa, että ”mielestäni luomamme kieli kaipaa omistusliitteitään”. Jos sinun on välttämätöntä luopua jostain omistusta ilmaisevan lauseen osasta, luovu persoonapronominista. Miten omistusliitteet sopivat sinun kirjoitukseesi? Onko omistusliitteetön teksti mielestäsi veltto, löysä, vaillinainen ja huolimaton? Jätä kommentti! Artikkeli kategoriassa Kirjoittaminen Avainsanat Oikeinkirjoitus"
