["https://elisaheikura.fi/author/aittaharjuntienpeppi/page/2"]
title = "Kirjoittajalta Elisa Heikura | Sivu 2 | Elisa Heikura"
full_description = "Kirjoitettu 10.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Kaikki mitä vastustat, you know Kaikki mitä vastustat, you know Tähän kuuluisi laittaa kulunut sitaatti Äiti Teresasta ja sodan vs. rauhan puolesta marssimisesta. Uumoilen, että tiedät sen laittamattakin (tai googlaat nopeasti salaa), joten voin mennä suoraan aiheeseen. Tämä minun ei-niin-surkeiden sekoamisteni sarja jatkuu ja nyt olen hurahtanut hyväksyvään lempeyteen. Vastustamalla pahenee Olen siis viimein havainnut todeksi sen, minkä viisaat ihmiset ovat tienneet aina: vastustamalla pahenee. Elämässäni pitkään vaikuttanut Hanna tapasi aina tokaista minulle, että ”älä hytise, syleile kylmyyttä”, kun hampaat loukkua lyöden ja huulet sinisenä tärisin pakkasessa. Ai että se vitutti. Ai että kuinka oikeassa hän olikaan. Lue lisää Kaikki mitä vastustat, you know Artikkeli kategoriassa Ajatteleminen Avainsanat Elisa, hyvinvointi, ihmisyys, kantapääni, Uudelleenajattelu Kirjoitettu 1.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Varo hopealuoteja ja yhden totuuden messiaita Varo hopealuoteja ja yhden totuuden messiaita En tiedä mistä nauttisin enemmän, kuin hurmaantumisesta. Hurmaantuminen on tietenkin äärettömän vaarallista, sillä pelkästään rakkaus ei ole sokea. Hurmion lähinäkö on myös aivan olematon. Yksi hurmion sivuvaikutus on haloefekti, joka saa aikaan sen, että hetken aikaa tämän maan päällä tallustaa olento, joka tuntuu mie-let-tö-män ylitsepääsemättömältä. Romanttisessa mielessä mieletön ylitsepääsemättömyys näyttäytyy siten, että toista ei voi lakata ajattelemasta edes unissaan. Hänestä ei kerta kaikkiaan meinaa päästä millään yli, useimmat eivät haluakaan. Kun kaksi ihmistä ei halua päästä yli toisistaan, niin sitä kutsuttaneen parisuhteeksi. Mutta oletko koskaan kokenut platonista hurmiota? Se se vasta hurja kuvio onkin. Lue lisää Varo hopealuoteja ja yhden totuuden messiaita Artikkeli kategoriassa Ajatteleminen, Kulttuuri Avainsanat Guru, Hopealuoti, Hurmio, Kasvu, Kehittyminen"
