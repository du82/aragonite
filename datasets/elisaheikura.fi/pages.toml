title = "Kirjoittajalta Elisa Heikura | Elisa Heikura"
full_description = "Kirjoitettu 11.5.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Vaikka olet nainen? Vaikka olet nainen? Mielipiteeni repeää ihan juuri kahtia. Yhtäältä olen todella onnellinen, että viime päivinä on vatvottu tasa-arvokysymyksiä hashtagin #vaikkaolennainen johdolla. Julkisuuteen ilmaantui Laura, jota oli kohdeltu pöyristyttävällä tavalla, kun hän oli hakenut suomalaiseen metsäjättiin kesätöihin. Tarina synnytti kiivaan ryöpytyksen, jossa puitiin, onko oikein kieltäytyä ottamasta naista haastatteluun, koska hän on nainen. On ehdottomasti hyvä, että yhteiskunnan piintyneisiin asenteisiin ja sukupuoleen tuijottavien jääräpäiden änkyröintiin puututaan. Epäkohdat on hyvä tuoda esiin ja niistä on tärkeää puhua julkisesti, avoimesti ja järkevästi. Lue lisää Vaikka olet nainen? Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Viestintä Avainsanat #koskaolenyksilö, #vaikkaolennainen, Kyseenalaistaminen, Tasa-arvo, Uudelleenajattelu Kirjoitettu 29.4.2015Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Ajatuksen selkeys on uskottavaa Ajatuksen selkeys on uskottavaa Vaikea kieli saa ajatuksen solmuun. © Minna Hokkanen Kielen selkeys on ajatuksen selkeyttä. Olen varma, että kyseinen lause on totta ja näkemykseni on pelkästään vahvistunut kuluneen kuukauden aikana. Tähän on johtanut neljä asiaa. 1) Luin Katleena Kortesuon Tee itsestäsi brändi -kirjan. Katleena painottaa moneen otteeseen, miten tärkeää kielen selkeys on. Hän suosittelee karsimaan turhan ammattijargonin ja pyrkimään kohti ymmärrettävää ja loogista puhetta. Lue lisää Ajatuksen selkeys on uskottavaa Artikkeli kategoriassa Kirjoittaminen, Puhuminen Avainsanat Fredrik Haren, Jari Parantainen, Katleena Kortesuo, Kirjat, Selkeys Kirjoitettu 8.4.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Älä kätke pihviä nettisivujesi syöveriin Älä kätke pihviä nettisivujesi syöveriin Missä se luuraa? © Minna Hokkanen Hei sinä nuori yrittäjä, joka pykäät yrityksellesi nettisivuja suurenmoisen innostuksen vallassa. Pysähdy hetkeksi ja mieti, minne olet kätkenyt nettisivujesi pihvin. Onko olemassa vaara, että sivujesi tärkein asia on tungettu niin syvälle sivustorakenteeseen, ettei sitä löydä tryffelipossukaan? Toisinaan lukija uuvutetaan perusteluilla, selityksillä, taustoilla ja tarinoilla ennen kuin kerrotaan se kaikkein tärkein. Malli on tuttu eurooppalaisesta tutkimuskäytännöstä, jossa ensin esitetään hypoteesi ja tehty tutkimus ja lopuksi vasta kerrotaan johtopäätökset ja lopputulos. Amerikassa tutkimukset kirjoitetaan toisin päin: ensin tulevat löydökset ja johtopäätökset, sitten vasta todisteet ja perustelut. Amerikkalainen malli toimii paremmin nettisivuilla, joiden tarkoitus on myydä. Tällöin esitetään ensin tärkein asia eli se, mitä hyötyä myytävänä olevasta asiasta on minulle eli potentiaaliselle asiakkaallesi. Kerro siis ensin, että mitä ja vastaa vasta sitten kysymyksiin miksi, miten, milloin ja mitä maksaa. Jos jemmaat pihvin sivuston syövereihin, se alkaa ennen pitkää haista todella pahalta. Eikä siitä ei ole piilossa kenellekään mitään iloakaan. Missä sinun pihvisi luuraa? Artikkeli kategoriassa Kirjoittaminen Avainsanat Internet, Nettisivut, Rakenne, Tiivistäminen, Uudelleenajattelu"
