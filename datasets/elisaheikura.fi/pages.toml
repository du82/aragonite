title = "Avainsana: Riittämättömyys | Elisa Heikura"
full_description = "Kirjoitettu 3.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Hylis ja riittis kävivät kylässä taas tällä viikolla Hylis ja riittis kävivät kylässä taas tällä viikolla Elämässäni on kaksi demonia. Toinen käy kylässä harvoin, mutta on valtava. Syö tyhjäksi kaikki energiavarastot, viskoo järjestyksen pitkin seiniä ja lamaannuttaa minut kuin syödyksi tulemista odottavan saaliseläimen. Toinen vierailee luonani vähän väliä. Se ei ole ihan niin kookas, mutta se on sitkeä. Se juttelee ilkeämielisesti ja saa minut epäilemään ja epäröimään. Se imee ilon, uskon ja rakkauden. Näistä ensimmäinen on hylätyksi tulemisen pelko ja jälkimmäinen on riittämättömyyden pelko. Olen antanut niille nimet hylis ja riittis. Lue lisää Hylis ja riittis kävivät kylässä taas tällä viikolla Artikkeli kategoriassa Ajatteleminen Avainsanat Demoni, Pelko, Riittämättömyys"
