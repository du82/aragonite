["https://elisaheikura.fi/avainsanat/uudelleenajattelu"]
title = "Avainsana: Uudelleenajattelu | Elisa Heikura"
full_description = "Kirjoitettu 10.11.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Onko sinulla taipumusta tuijottaa viestiä ja miettiä, että mitähän tuo lähettäjä tällä oikein tarkoittaa? Entä onko sinulla tapana etsiä metatason viestejä sanottujen sanojen takana? Minulla on ollut, koska olen tällainen kielen tasoihin ja monimerkityksellisyyteen rakastunut ja huonohkolla itsetunnolla riivattu ylianalysoija. Mutta tiiäks mitä olen tässä hiljattain – vaihteeksi – tajunnut? Se on maailman turhinta ja typerintä hommaa. Se on myös yksi niitä asioita, joka vie kaiken hapen elämästä ja vieraannuttaa ihmisen hetkestä. Se uuvuttaa myös ne, jotka yrittävät meille jotain viestiä. Jaa että mitä että? No annahan kun yritän selittää. Lue lisää Lakkaa suhtautumasta viesteihin kuin todistusaineistoon Artikkeli kategoriassa Viestintä Avainsanat ihmisyys, Meta, Pohdinta, Uudelleenajattelu, Viestintä Kirjoitettu 10.8.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Kaikki mitä vastustat, you know Kaikki mitä vastustat, you know Tähän kuuluisi laittaa kulunut sitaatti Äiti Teresasta ja sodan vs. rauhan puolesta marssimisesta. Uumoilen, että tiedät sen laittamattakin (tai googlaat nopeasti salaa), joten voin mennä suoraan aiheeseen. Tämä minun ei-niin-surkeiden sekoamisteni sarja jatkuu ja nyt olen hurahtanut hyväksyvään lempeyteen. Vastustamalla pahenee Olen siis viimein havainnut todeksi sen, minkä viisaat ihmiset ovat tienneet aina: vastustamalla pahenee. Elämässäni pitkään vaikuttanut Hanna tapasi aina tokaista minulle, että ”älä hytise, syleile kylmyyttä”, kun hampaat loukkua lyöden ja huulet sinisenä tärisin pakkasessa. Ai että se vitutti. Ai että kuinka oikeassa hän olikaan. Lue lisää Kaikki mitä vastustat, you know Artikkeli kategoriassa Ajatteleminen Avainsanat Elisa, hyvinvointi, ihmisyys, kantapääni, Uudelleenajattelu"
