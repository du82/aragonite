["https://elisaheikura.fi/kategoriat/yleinen"]
title = "Kategoria: Yleinen | Elisa Heikura"
full_description = "Kirjoitettu 15.9.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai tän ei pitäiskään olla ruskea Ai tän ei pitäiskään olla ruskea Viimeksi kun uumoilin, että seuraavakin hurahtamisen kohteeni olisi epäilemättä jollain tavalla hippiä, en silti villeimmissä kuvitelmissanikaan voinut aavistaa, että hurahdan seuraavaksi siivoamiseen. Kas kun minä vihaan siivoamista. Se on nähdäkseni kotitöistä se kaikkein ääliömäisin ja älyttömin. Siivota pitää vähän väliä, ja ihan kohta on taas sotkuista. Loputon suo, joka ei tuota mitään iloa. Paitsi sitten kun tuntikausien kidutuksen jälkeen on puhdasta, se on ihan kiva. Vartin. Sitten on taas sotkuista. Olen ollut valmis ulkoistamaan kotini siivouksen jo hyvän tovin. Mutta nyt? Lue lisää Ai tän ei pitäiskään olla ruskea Artikkeli kategoriassa Yleinen Avainsanat Muutos, Sekoaminen, Siivoaminen Kirjoitettu 16.4.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai että mä olen seonnut Ai että mä olen seonnut Muistatteko noin vuosi sitten, kun kerroin tajunneeni olleeni itseäni kohtaan monta vuotta ihan totaalinen mulkku? Sitä tietysti luulisi, että tämä tajuaminen olisi ajanut jonkinlaiseen muutokseen, mutta ei. Tiedosta harvoin seuraa toimintaa. Vaadittiin vielä yksi vuosi mulkkuutta ja kymmenkunta oivallusta, ennen kuin mitään tapahtui. Ja sitten kyllä tapahtui senkin edestä Lue lisää Ai että mä olen seonnut Artikkeli kategoriassa Ajatteleminen, Yleinen Avainsanat Elisa, kantapääni, Minusta, Rakkaus, Uudelleenajattelu Kirjoitettu 17.5.2017Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Ei mutan muttaa Ei mutan muttaa En välttämättä sanoisi, että kulunut 12 kuukautta olisi ollut elämässäni helppo, mutta se toi mukanaan oivalluksia. Ensin niitä heiteltiin minulle lempeästi. Kas tässä, ota koppi. Sitten niitä alkoi tulla vähän rivakammalla tahdilla. Nyt on kuin istuisi tenniskentällä oikosulkuun menneen pallonsyöttökoneen edessä, housut punaisessa pinnoitteessa, naama mustelmilla. Alright, elämä, I get it. Sulla on asiaa. Näistä päin turpavärkkiä singahtelevista elämänopetuksista kouraan on tarttunut yksi erityisen väkevä, jonka haluaisin jakaa teidän kanssanne. Se menee näin. Minä olen vastuussa. Minä vain olen. Lue lisää Ei mutan muttaa Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Yleinen Avainsanat ihmisyys, vastuullisus"
