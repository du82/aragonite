title = "Avainsana: Muutos | Elisa Heikura"
full_description = "Kirjoitettu 15.9.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Ai tän ei pitäiskään olla ruskea Ai tän ei pitäiskään olla ruskea Viimeksi kun uumoilin, että seuraavakin hurahtamisen kohteeni olisi epäilemättä jollain tavalla hippiä, en silti villeimmissä kuvitelmissanikaan voinut aavistaa, että hurahdan seuraavaksi siivoamiseen. Kas kun minä vihaan siivoamista. Se on nähdäkseni kotitöistä se kaikkein ääliömäisin ja älyttömin. Siivota pitää vähän väliä, ja ihan kohta on taas sotkuista. Loputon suo, joka ei tuota mitään iloa. Paitsi sitten kun tuntikausien kidutuksen jälkeen on puhdasta, se on ihan kiva. Vartin. Sitten on taas sotkuista. Olen ollut valmis ulkoistamaan kotini siivouksen jo hyvän tovin. Mutta nyt? Lue lisää Ai tän ei pitäiskään olla ruskea Artikkeli kategoriassa Yleinen Avainsanat Muutos, Sekoaminen, Siivoaminen"
