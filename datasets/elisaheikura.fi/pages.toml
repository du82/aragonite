full_description = "Kirjoitettu 29.4.2015Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Ajatuksen selkeys on uskottavaa Ajatuksen selkeys on uskottavaa Vaikea kieli saa ajatuksen solmuun. © Minna Hokkanen Kielen selkeys on ajatuksen selkeyttä. Olen varma, että kyseinen lause on totta ja näkemykseni on pelkästään vahvistunut kuluneen kuukauden aikana. Tähän on johtanut neljä asiaa. 1) Luin Katleena Kortesuon Tee itsestäsi brändi -kirjan. Katleena painottaa moneen otteeseen, miten tärkeää kielen selkeys on. Hän suosittelee karsimaan turhan ammattijargonin ja pyrkimään kohti ymmärrettävää ja loogista puhetta. Lue lisää Ajatuksen selkeys on uskottavaa Artikkeli kategoriassa Kirjoittaminen, Puhuminen Avainsanat Fredrik Haren, Jari Parantainen, Katleena Kortesuo, Kirjat, Selkeys"
