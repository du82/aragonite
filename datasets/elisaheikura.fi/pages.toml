["https://elisaheikura.fi/minusta"]
title = "Kuka se on? | Elisa Heikura"
description = "Muutan juonien kulkua, saan aikaan tekoja, sytytän liekkejä. Koska uskon sanojen vaikuttavan elämäämme merkittävästi, kannan omistani myös vastuuta. Ellen seiso niiden takana, en suostu niitä kirjoittamaankaan."
full_description = "Kuka se on? Elisa on se tyyppi, joka saa asiat tapahtumaan Sä tiedät sen kylmäävän innostuksen ja kauhun sekaisen tunteen, kun olet aloittamassa jotain uutta ja painat itsesi taas upoksiin syvään päähän. Ensin on pilkkopimeää ja kylmää, kun jalat etsivät pohjaa. Ei helkkari soikoon, miksi taas? Mutta kun pää puskee pinnan läpi ja keuhkot saavat ilmaa, tiedät voittaneesi. Eikä kestä kuin hetki, kun taas huomaan heittäytyväni. Sillä kun edellinen on ylitetty, haen elämääni uuden haasteen. Entistä isomman, edellistä vaikeamman. Palan kirkkaimmalla liekillä, kun minulla on riittävän kovia tavoitteita saavutettavaksi ja tarpeeksi monimutkaisia asioita valloitettavaksi. Muutan juonien kulkua, saan aikaan tekoja, sytytän liekkejä. Koska uskon sanojen vaikuttavan elämäämme merkittävästi, kannan omistani myös vastuuta. Ellen seiso niiden takana, en suostu niitä kirjoittamaankaan. Minuun voi luottaa kuin peruskallioon – vahtivuorollani asiat tulevat tehdyiksi ja tuli palaa. Mihin sytytämme seuraavan roihun? Elisa Heikura, s. 1987 Filosofian maisteri Koodarikuiskaaja etunimi@etunimisukunimi.fi +358 41 435 9191 LinkedIn Twitter Koodarikuiskaaja.fi"
