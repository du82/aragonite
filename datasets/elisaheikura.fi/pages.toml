full_description = "Kirjoitettu 11.5.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Vaikka olet nainen? Vaikka olet nainen? Mielipiteeni repeää ihan juuri kahtia. Yhtäältä olen todella onnellinen, että viime päivinä on vatvottu tasa-arvokysymyksiä hashtagin #vaikkaolennainen johdolla. Julkisuuteen ilmaantui Laura, jota oli kohdeltu pöyristyttävällä tavalla, kun hän oli hakenut suomalaiseen metsäjättiin kesätöihin. Tarina synnytti kiivaan ryöpytyksen, jossa puitiin, onko oikein kieltäytyä ottamasta naista haastatteluun, koska hän on nainen. On ehdottomasti hyvä, että yhteiskunnan piintyneisiin asenteisiin ja sukupuoleen tuijottavien jääräpäiden änkyröintiin puututaan. Epäkohdat on hyvä tuoda esiin ja niistä on tärkeää puhua julkisesti, avoimesti ja järkevästi. Lue lisää Vaikka olet nainen? Artikkeli kategoriassa Ajatteleminen, Kulttuuri, Viestintä Avainsanat #koskaolenyksilö, #vaikkaolennainen, Kyseenalaistaminen, Tasa-arvo, Uudelleenajattelu"
