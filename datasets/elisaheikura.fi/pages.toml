["https://elisaheikura.fi/kaamosmongintaa"]
title = "Kaamosmöngintää | Elisa Heikura"
description = "Valtaosaa meistä ajavat tietyt olemassaolon kysymykset: Miksi olemme olemassa? Mikä on elämän tarkoitus? Mitä on hyvä elämä? Toisia nuo elämän merkityksen kysymykset riivaavat aina."
full_description = "Kirjoitettu 16.12.2015Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Kaamosmöngintää Kaamosmöngintää Kaamosaika saa minussa näemmä esiin elämän kyseenalaistajan. En koe olevani kaamosmasentunut tai -lamaantunut. Tunnen vain sitä olemassaolon tuskaa, joka osaavammissa käsissä taipuisi runoiksi tai maalauksiksi. Valtaosaa meistä ajavat tietyt olemassaolon kysymykset: Miksi olemme olemassa? Mikä on elämän tarkoitus? Mitä on hyvä elämä? Yleensä arjessa nämä kysymykset jäävät sivuun tärkeämpien ja polttavampien kysymysten ottaessa vallan: Mitä tänään syötäisiin? Mitä ostaisin joululahjaksi isälleni? Millä junalla ehdin ajoissa illaksi kotiin? Toisilla ensimmäinen kysymyssetti syrjäyttää jälkimmäisen jonkin merkittävän tapahtuman seurauksena. Toisia nuo elämän merkityksen kysymykset riivaavat aina. Kolmannet ovat löytäneet vastauksen ja sitä myötä rauhan. Minä tunnun pohtivan näitä kysymyksiä aina vuoden pimeimpään aikaan. Vuosi sitten tämä pohdinta sai aikaan työpaikanvaihdoksen. Tänä vuonna se konkretisoitui seuraavalla kolmella tavalla: 1) Tajusin ajautuneeni mentoroitavaksi ja mentorini tajusi joutuneensa mentorikseni. 2) Pohdin oman henkilöbrändini peruskiviä ja niitä asioita, joista todella innostun elämässäni. 3) Arvioin, millä tavalla minun tulisi kehittää itseäni voidakseni olla todella motivoitunut työssäni. Olen siis palannut takaisin perimmäisten kysymysten äärelle: Kuka minä olen? Miksi minä olen? Mikä tekee minut onnelliseksi? Milloin olen hyödyksi ihmisille lähelläni – ja kauempana? Mikä motivoi minua? Kiitos ja anteeksi kaikki te, jotka olette joutuneet tämän prosessin osaksi. Kiitollisuuttani en voi sanoin kuvailla. Artikkeli kategoriassa Filosofia, Yleinen Avainsanat Elämän tarkoitus, Elisa, Kyseenalaistaminen, Pohdinta"
author = "Kirjoittaja Elisa Heikura"
year_published = 2015
year_updated = 2018
