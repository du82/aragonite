["https://elisaheikura.fi/malja-jokaiselle-maelle-ja-yksi-ystavalle"]
title = "Malja jokaiselle mäelle ja yksi ystävälle | Elisa Heikura"
description = "Isälläni oli yritys. Mummollani kahvila. Ukkini myi päivätyönsä ohessa kaikkea vakuutuksista rapuihin. Minusta ei olisi tullut yrittäjää ilman Jannea."
full_description = "Kirjoitettu 2.4.2017Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Malja jokaiselle mäelle ja yksi ystävälle Malja jokaiselle mäelle ja yksi ystävälle Isälläni oli yritys. Mummollani kahvila. Ukkini myi päivätyönsä ohessa kaikkea vakuutuksista rapuihin. Ellen väärin muista, isoukkini oli suutari. Ja toisella puolen sukuhaaraa on maanviljelijöitä. Voisi ehkä sanoa, että päätös yrittäjäksi ryhtymisestä oli vain ajan kysymys ja tavallaan se olisi totta. Mutta tosiasiassa se ei ole totta ollenkaan. Tästä rohkeudesta ja päättäväisyydestä on enimmäkseen kiittäminen yhtä ihmistä elämässäni, nimittäin Janne Jääskeläistä. Ennen kuin tapasin Jannen, olin likinäköinen yksilösuorittaja. Menin kiltisti oletetussa putkessa opintojen kautta työelämään. Kun ystäväni Riku kerran kysyi, miksi ihmeessä olen päivätöissä enkä yrittäjä, suorastaan suutuin. Niin voimakas oli se defenssimekanismi, joka suojeli minua sen tosiasian myöntämiseltä, etten ollut päivätyössä onnellinen. Eikä sillä onnella tai onnettomuudella ollut mitään tekoa niiden työpaikkojen kanssa, joissa olen ollut. Minulla on ollut hyviä työnantajia, aivan vertaansa vailla olevia kollegoita, työystäviä, mahtavia ihmisiä ympärilläni. Olen saanut oppia, kasvaa ja kehittyä ympäristöissä, joista olen ikuisesti kiitollinen. Mutta minut on luotu yrittäjäksi En vain tiedä, kuinka hiivatin kauan minulla olisi kestänyt tajuta se, ellei olisi Jannea. Eräänä turhautuneena torstai-iltana, marraskuussa 2014, löysin sattumalta hänen bloginsa ja imuroin sitä aivoihini kertaistumalta useita tunteja. Se on aika paljon sanottu silloin vielä huomattavasti punavihertävämmältä humanistitytöltä (lukekaa Jannea, niin tiedätte kyllä miksi). Internet on ihmeellinen asia. Kun sitten seuraavana päivänä kerroin Twitterissä, mitä olin edellisenä iltana löytänyt, siitä alkoi keskustelu, joka ei ole tähän päivään mennessä katkennut. It was, indeed, the beginning of a beautiful friendship. Janne on ollut minulle ensin mentori, sitten ystävä. Henkinen tuki ja turva. Riittävän voimakas potku persauksille. Tarkkaavaisin korva ja avonaisin sydän, jonka olen koskaan kohdannut. Hänen vankkumaton luottamuksensa minun voimiini riitti kasvattamaan minusta sen, kuka olen tänään. Hyvin, hyvin eri ihminen, kuin tuona torstaina, marraskuussa, 2014. Tänään olen yrittäjä Lopulta se, mikä ehkä on aina ollut tuloillaan, on totta tänään. Olen yrittäjä, kuten isäni, ukkini ja isoukkini. Kuten mummoni ja maatilaa pitävät isovanhempani. Rinnallani on huikea yhtiökumppani Janne Gylling, enkä malta odottaa, mitä yhteisen latumme seuraavan mutkan takaa paljastuu. En, vaikka siellä odottaa todennäköisesti aina uusi mäki, kuten Antti radiossa uumoilee. Tiedän olevani valmis. Mutkiin. Mäkiin. Mihin vaan. Artikkeli kategoriassa Yleinen, Yrittäjyys Avainsanat asiantuntija, Elämän tarkoitus, Elisa, Pohdinta"
author = "Kirjoittaja Elisa Heikura"
