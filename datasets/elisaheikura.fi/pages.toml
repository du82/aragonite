title = "Avainsana: Seuraus | Elisa Heikura"
full_description = "Kirjoitettu 8.10.2018Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Teko on yhdentekevä Teko on yhdentekevä Yksi päivä päässäni muljahti. Ymmärsin, kuinka tarkoitus- ja teko-orientoituneita olemme. Käytämme ihan käsittämättömiä määriä aikaa ja energiaa puhuaksemme siitä, mitä joku teki tai jätti tekemättä – sekä yllättävän paljon myös siitä, mitkä olivat ihmisen aikeet tekojen takana. Sehän on se kuuluisa tarkoitus, kun ne keinot pyhittää, vai mitä? Jos asiaa kuitenkin tarkastelee tarkemmin, niin mahtaako teolla itsellään olla ihan yhtään mitään merkitystä? Entä, jos ne ovatkin ne seuraukset, joihin meidän pitäisi kiinnittää katseemme. Lue lisää Teko on yhdentekevä Artikkeli kategoriassa Ajatteleminen, Filosofia Avainsanat Palaute, Seuraus, Teko, Viestintä"
