["https://elisaheikura.fi/avainsanat/tiivistaminen"]
title = "Avainsana: Tiivistäminen | Elisa Heikura"
full_description = "Kirjoitettu 8.4.2015Kirjoittaja Elisa Heikura Ei kommentteja artikkeliin Älä kätke pihviä nettisivujesi syöveriin Älä kätke pihviä nettisivujesi syöveriin Missä se luuraa? © Minna Hokkanen Hei sinä nuori yrittäjä, joka pykäät yrityksellesi nettisivuja suurenmoisen innostuksen vallassa. Pysähdy hetkeksi ja mieti, minne olet kätkenyt nettisivujesi pihvin. Onko olemassa vaara, että sivujesi tärkein asia on tungettu niin syvälle sivustorakenteeseen, ettei sitä löydä tryffelipossukaan? Toisinaan lukija uuvutetaan perusteluilla, selityksillä, taustoilla ja tarinoilla ennen kuin kerrotaan se kaikkein tärkein. Malli on tuttu eurooppalaisesta tutkimuskäytännöstä, jossa ensin esitetään hypoteesi ja tehty tutkimus ja lopuksi vasta kerrotaan johtopäätökset ja lopputulos. Amerikassa tutkimukset kirjoitetaan toisin päin: ensin tulevat löydökset ja johtopäätökset, sitten vasta todisteet ja perustelut. Amerikkalainen malli toimii paremmin nettisivuilla, joiden tarkoitus on myydä. Tällöin esitetään ensin tärkein asia eli se, mitä hyötyä myytävänä olevasta asiasta on minulle eli potentiaaliselle asiakkaallesi. Kerro siis ensin, että mitä ja vastaa vasta sitten kysymyksiin miksi, miten, milloin ja mitä maksaa. Jos jemmaat pihvin sivuston syövereihin, se alkaa ennen pitkää haista todella pahalta. Eikä siitä ei ole piilossa kenellekään mitään iloakaan. Missä sinun pihvisi luuraa? Artikkeli kategoriassa Kirjoittaminen Avainsanat Internet, Nettisivut, Rakenne, Tiivistäminen, Uudelleenajattelu Kirjoitettu 18.2.2015Kirjoittaja Elisa Heikura 1 kommentti artikkeliin Hylkää ensimmäinen ajatuksesi Hylkää ensimmäinen ajatuksesi Kesätöiden hakuaika ja CV:n eli ansioluettelon rakennuspuuhat ovat käsillä. Useat raapivat päätään ja repivät tukkaansa yrittäessään tiivistää itseään kappaleeseen tai kahteen. On taitolaji kertoa itsestään olennaiset, mutta jättää jäljelle myös riittävästi mielenkiintoisia epäolennaisuuksia. Hankaluutensa tehtävään tuo myös se, että tuhatkunta muuta yrittää tehdä täsmälleen samaa – ja paremmin! Annan sinulle nyt neuvon, joka minun oli hyvin, hyvin vaikea omaksua, mutta joka on elintärkeä: hylkää ensimmäinen ajatuksesi. Hylkää se. Nyt heti. Kun saat kirjoitettua itsestäsi bion ja olet siihen tyytyväinen, deletoi se ja aloita alusta. Miksi, kysyt nyt ja hyvä, että kysyt. Siksi, että arviolta liian monta muutakin ihmistä on tullut ajatelleeksi täsmälleen samaa. Se ei ole suotta ensimmäinen ajatuksesi, vaan se on ensimmäinen, koska se on helpoin. Erotu. © Minna Hokkanen Todennäköisesti biossasi lukee, että olet itsenäiseen työskentelyyn kykenevä, ulospäinsuuntautunut tiimipelaaja. Väittänet myös olevasi nopea oppimaan, tykkääväsi haasteista ja suhtautuvasi työhön intohimoisesti. Mainitsetko heikkoudeksesi olevasi liiallinen perfektionisti vai kerrotko haluavasi jatkuvasti oppia uutta? Kaikki nämä löytyvät tuhansista muistakin ansioluetteloista siksi, että ne tulevat ensimmäiseksi mieleen. Siis hylkää ne. Mieti kauemmin. Tongi syvemmälle. Kaiva esiin lukuisia tapoja kuvata itseäsi ja valitse niistä ne, jotka tuntuvat paitsi omilta myös uusilta. Hätkähdytä itsesikin. Yksi tapa tonkia syvemmältä on kirjoittaa tajunnanvirtana ainakin viisikymmentä adjektiivia itsestään mitään sensuroimatta ja poimia niiden joukosta parhaimmat, osuvimmat ja mielenkiintoisimmat. Jos alkuun pääseminen tuntuu vaikealta, selaa esimerkiksi Wikipedian adjektiiviluetteloa tai kysy mielipiteitä lähipiiriltäsi. Itse tiivistän itseni sanoihin sisukas viestintäkameleontti. Miten sinä tiivistät itsesi? Artikkeli kategoriassa Kirjoittaminen Avainsanat CV, Kill your darling, Tehtävät, Tiivistäminen, Uudelleenajattelu"
