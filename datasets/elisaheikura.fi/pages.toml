["https://elisaheikura.fi/mita-on-viestinta"]
title = "Mitä on #viestintä? | Elisa Heikura"
description = "Olen ollut viimeiset kaksi ja puoli vuotta elämästäni viestintätoimistotyöntekijä. Kun minulta kysytään, mitä teen työkseni, vastaan ”viestintää”. Työnkuvani liukuessa kokoajan enemmän ja enemmän…"
full_description = "Kirjoitettu 11.12.2014Kirjoittaja Elisa Heikura 2 kommenttia artikkeliin Mitä on #viestintä? Mitä on #viestintä? Olen ollut viimeiset kaksi ja puoli vuotta elämästäni viestintätoimistotyöntekijä. Kun minulta kysytään, mitä teen työkseni, vastaan ”viestintää”. Työnkuvani liukuessa kokoajan enemmän ja enemmän digitaalisten viestintävälineiden pariin, on vastaukseeni hiipinyt myös äänetön risuaita. Yleensä kysyjä tyytyy vastaukseeni. Viestintä, risuaidalla tai ilman, on sen verran tunnettu yleissana, että jokaisella on jonkinlainen ymmärrys sen sisällöstä. Kun kysyin Twitteriltä, mitä #viestintä on, sain muutaman hyvin intuitiivisen vastauksen. Twitter vastaa Pidän lainauksesta, jonka Tampereen yliopiston johdatus viestintätieteisiin nostaa esiin: ”Mutta ehkä viestintäkin on samalla tapaa vaikeasta selitettävä kuin ajan käsite oli filosofi ja kirkkoisä Augustinukselle (354–430): ’Jos minulta ei kysytä, mitä aika on, niin tiedän sen. Mutta jos minulta kysytään, niin en tiedä.'” Vaikka olen opiskellut yliopistossa tiedotusoppia ja tehnyt töitä viestintätoimistossa, on viestinnän tarkka ja yksiselitteinen määritteleminen minullekin vaikeaa. Etymologisesti ajatellen viestintä on suoran viestintämallin mukainen tapahtuma, jossa joku taho viestii vastaanottajataholle jonkin viestin jollain välineellä. Kuten johdatus viestintätieteisiin kertoo: ”Suomen kielen sana ’viestintä’ juontuu venäjän kielen sanasta ’vest’ (sanoma, viesti). Nykysuomen Sanakirjan mukaan viesti on ’muulla tavoin kuin välittömästi, henkilökohtaisesti perille toimitettava tai leviävä sanoma, sana, tiedotus, ilmoitus, uutinen tms.'” Wikipedia lisää määritelmään vuorovaikutteisemman näkökulman, jossa viestintä on paitsi sanomien siirtämistä myös merkitysten tuottamista. Myös johdatus viestintätieteisiin toteaa, että ”yleensä viestintä ymmärretään kaksisuuntaiseksi toiminnaksi, vuoropuheluksi, jossa toisen puhuessa toinen kuuntelee ja päinvastoin”. Ajattelimmepa viestintää informaation siirtona, merkitysten tai yhteisyyden tuottamisena, tarkastelemme viestintää aina vain yhdestä, rajallisesta näkökulmasta. Ehkä maalaisjärjellisen määritelmän kehittäminen ei vaadi näkökulmaviidakkoon eksymistä. Määritelmien ja näkökulmien moninaisuus osoittaa kuitenkin jotain, mitä olen kysyjille vastatessani mielessäni jo uumoillut: viestintä on jotain lähtökohtaisesti perustavanlaatuista ja kaiken kanssakäymisen edellytys. Aina, kun olemme kontaktissa ympäröivän maailman kanssa, olemme astuneet viestinnän alueelle. Viestit, sanalliset ja sanattomat, tahalliset ja tahattomat, sinkoilevat meistä kaikkialle ympärillemme ja kohdatessaan vastaanottavan tahon, ne aiheuttavat jonkinlaista resonointia. Mitä sitten tekee viestintäalan ammattilainen? Useimmiten viestintäalan ammattilainen keskittyy sanallisiin ja tahallisiin viesteihin ja pyrkii joko itse luomaan tai auttamaan muita luomaan sellaisia viestejä, jotka löytävät oikean yleisön ja saavat aikaa toivotunlaista resonointia. Tämä on minun maalaisjärjellinen ymmärrykseni viestinnästä. Mitä viestintä sinun mielestäsi on? Jätä kommentilla jälkesi ajatteluuni! Artikkeli kategoriassa Filosofia, Viestintä Avainsanat Määritelmä, Minusta, Pohdinta, Sorsastus, Twitter"
