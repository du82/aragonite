duction to strong arrows and how it leverages the Erlang VM to provide sound gradual typing. Continue reading → Type system updates: moving from research into development June 22, 2023 · by José Valim · in Announcements A short status update on the effort to bring a type system into Elixir. Continue reading → Elixir v1.15 released June 19, 2023 · by José Valim · in Releases Elixir v1.15 with improvements to compilation and boot times. Continue reading → Embedded and cloud Elixir for grid-management at Sparkmeter March 09, 2023 · by Hugo Baraúna · in Elixir in Production A case study of how Elixir is being used at SparkMeter. Continue reading → Cheatsheets and other 8 ExDoc features that improve the developer experience December 22, 2022 · by Hugo Baraúna · in Announcements This post explains the motivation behind the new ExDoc Cheatsheet feature. It also highlights other ExDoc features that show how ExDoc has been evolving to make the documentation experience in Elixir better and better. Continue reading → My Future with Elixir: set-theoretic types October 05, 2022 · by José Valim · in Announcements We announce and explore the possibilities for bringing set-theoretic types into Elixir. Continue reading → Elixir v1.14 released September 01, 2022 · by Andrea Leopardi · in Releases Elixir v1.14 is out with a focus on debugging and developer experience Continue reading → Elixir v1.13 released December 03, 2021 · by José Valim · in Releases Elixir v1.13 is out with a focus on developer tooling Continue reading → Embracing open data with Elixir at the Ministry of Ecological Transition in France November 10, 2021 · by José Valim · in Elixir in Production A case study of how Elixir is being used at the Ministry of Ecological Transition in France. Continue reading → Bootstrapping a multiplayer server with Elixir at X-Plane July 29, 2021 · by José Valim · in Elixir in Production A case study of how Elixir is being used at X-Plane. Continue reading → Social virtual spaces with