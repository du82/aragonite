["https://elixir-lang.org/blog/2015/09/28/elixir-v1-1-0-released"]
title = "Elixir v1.1 released - The Elixir programming language"
description = "Welcome to Elixir, a dynamic, functional language designed for building scalable and maintainable applications"
full_description = "Elixir v1.1 released September 28, 2015 · by José Valim · in Releases Elixir v1.1 has been released and it brings enhancements, bug fixes, performance improvements and more into Elixir. Elixir v1.1 supports both Erlang 17 and Erlang 18. This is, however, the last release supporting Erlang 17, so upgrading to Erlang 18 is advised. Elixir v1.2 will introduce features that are Erlang 18 only. On the standard library side, about 40 new functions have been added to Elixir public APIs. For example, Enum got dedup/1, random/1, and a couple more. The String module can now calculate the distance between strings. We use this feature to provide suggestions whenever an unknown task name is given when using Mix. You can also yield to and shutdown tasks in the Task module. The applications that ship with Elixir also has seen improvements and bug fixes. ExUnit, Elixir’s test framework, now has support for skipping tests via tags @tag :skip, as well as the ability to capture logs via @tag :capture_log, ensuring that all log messages during the tests are captured. Even better, in case of failures, all captured log messages are printed along-side the test error report. Mix ships with a mix profile.fprof, useful for profiling your application code. The mix app.start has also been publicly documented. Although you likely won’t invoke it directly through the command line, it is useful when writing your own tasks that require the current application to be up and running. Mix also provides faster re-compilation times. Every time you compile your Elixir code, Mix generates a graph of the dependencies between source files. For example, if a.ex depends on b.ex, every time b.ex changes, a.ex must be recompiled. Elixir v1.1 improves this tracking by separating compile-time dependencies from runtime ones, recompiling a file only if a compile-time dependency changed. In projects that have a main dispatch entity, like a web-app router, we have seen mix compile go from recompiling the whole project to one or two files per run. We have also seen great progress on areas that go beyond the source code. In particular, we have added a CODE_OF_CONDUCT.md to guarantee our community continues to grow into a safe and welcoming place for everyone. We have also released a new ExDoc version. It provides a beautiful, clean and readable way to navigate the Elixir documentation and it is available to any Elixir project. The latest version includes initial support for User Guides and we have more features and improvements coming on the way. The full list of changes is available in our release notes. Don’t forget to check the Install section to get Elixir installed. Happy coding!"
