["https://elixir-lang.org/blog/2012/10/20/elixir-v0-7-0-released"]
title = "Elixir v0.7.0 released - The Elixir programming language"
description = "Welcome to Elixir, a dynamic, functional language designed for building scalable and maintainable applications"
full_description = "Elixir v0.7.0 released October 20, 2012 · by José Valim · in Releases Elixir v0.7.0 was released with bug fixes and many improvements, like a String module to handle UTF-8 binaries and support to environments and nested dependencies in Mix. We have also taken important steps into normalizing our APIs. In Erlang, accesses to tuple and lists are one-based and binaries are zero-based, but in Elixir we have normalized all of them to rely on zero-based access. This release also includes some backwards incompatible changes, but the majority of changes were first deprecated, meaning your code will run just fine but with warnings. Those warnings will be removed in the next release v0.7.1, which should happen in a 2 to 4 weeks time span. For more information, read out the CHANGELOG. Thank you and don’t forget to give Elixir a try!"
