 Farmbot August 20, 2020 · by José Valim · in Elixir in Production A case study of how Elixir is being used at Farmbot. Continue reading → Elixir v1.10 released January 27, 2020 · by José Valim · in Releases Elixir v1.10 is out with standard library, compiler, and releases improvements. Continue reading → Elixir v1.9 released June 24, 2019 · by José Valim · in Releases Elixir v1.9 is out with releases support, improved configuration and more. Continue reading → Mint, a new HTTP client for Elixir February 25, 2019 · by Eric Meadows-Jönsson · in Announcements Mint is a new low-level HTTP client that aims to provide a small and functional core that others can build on top. Continue reading → Elixir v1.8 released January 14, 2019 · by José Valim · in Releases Elixir v1.8 comes with many improvements at the infrastructure level, improving compilation time, speeding up common patterns, and adding features around introspection of the system. Continue reading → Elixir v1.7 released July 25, 2018 · by José Valim · in Releases Elixir v1.7 includes many quality of life improvements, focusing on documentation, Logger and ExUnit, as well as a new Elixir Core team member! Continue reading → Google Summer of Code 2018 projects June 28, 2018 · by Andrea Leopardi · in Announcements Once again Elixir is participating in Google Summer of Code 2018. In this post, we'll have a look at the active projects. Continue reading → Elixir v1.6 released January 17, 2018 · by José Valim · in Releases Elixir v1.6 includes a code formatter, defguard, dynamic supervision and new module attributes that improves code quality and the developer experience Continue reading → StreamData: Property-based testing and data generation October 31, 2017 · by Andrea Leopardi · in Announcements We are working on data generation and property-based testing for the next versions of Elixir. Continue reading → Elixir v1.5 released July 25, 2017 · by José Valim · in Releases Elixir v1.5 integrates with Erlang/OTP 20 and bring changes that improves the language reach and the developer experience Continue reading → Elixir v1.4 released January 05, 2017 · by José Valim · in Releases Elixir v1.4 brings many improvements to the language, its standard library and the Mix build tool. Continue reading → Announcing GenStage July 14, 2016 · by José Valim · in Announcements GenStage is a new Elixir behaviour for exchanging events with back-pressure between Elixir processes. In this blog post we will cover the background that led us to GenStage, some example use cases, and what we are exploring for future releases. Continue reading → Elixir v1.3 released June 21, 2016 · by José Valim · in Releases Elixir v1.3 brings many improvements to the language, the compiler and its tooling, specially Mix (Elixir's build tool) and ExUnit (Elixir's test framework). Continue reading → Elixir v1.2 released January 03, 2016 · by José Valim · in Releases Elixir v1.2 brings enhancements, bug fixes, performance improvements and more into Elixir. Continue reading → Elixir v1.1 released September 28, 2015 · by José Valim · in Releases Elixir v1.1 brings enhancements, bug fixes, performance improvements and more into Elixir. Continue reading → Elixir v1.0 released September 18, 2014 · by José Valim · in Releases Elixir v1.0 is finally out! Continue reading → Elixir v0.15.0 released August 07, 2014 · by José Valim · in Releases Elixir v0.15.0 introduces Elixir's Logger, Mix aliases and is the last stop before Elixir v1.0. We are also glad to welcome Alexei into our team! Continue reading → Elixir v0.14.0 released June 17, 2014 · by José Valim · in Releases Elixir v0.14.0 is released and expands the work on structs and bringing more of OTP right into Elixir and Mix Continue reading → Elixir v0.13.0 released, hex.pm and ElixirConf announced April 21, 2014 · by José Valim · in Releases Elixir v0.13.0 comes with substantial improvements to the language: maps, structs, comprehensiona and more. It also marks the announcement of the hex.pm package manager and the announcement of ElixirConf! Continue reading → Elixir v0.12.0 released December 15, 2013 · by José Valim · in Releases Elixir v0.12.0 is out with improved enumerables, build patterns and welcoming a new member to our team Continue reading → Elixir's new continuable enumerators December 11, 2013 · by Peter Minten · in Internals In 0.12.0 Elixir's enumerators have gained the ability to suspend value production and to terminate early. Continue reading → Elixir v0.11.0 released November 05, 2013 · by José Valim · in Releases Elixir v0.11.0 is out and it focus on improving and optimizing the patterns often used by the community. Continue reading → Elixir Design Goals August 08, 2013 · by José Valim · in Internals Highlight of Elixir design goals. Continue reading → Elixir v0.10.0 released July 13, 2013 · by José Valim · in Releases Elixir v0.10.0 is out with support for streams, sets, pretty printing and many improvements for Mix and ExUnit. Continue reading → Elixir v0.9.0 released May 23, 2013 · by José Valim · in Releases Elixir v0.9.0 is released with support for reducers, umbrella projects, faster compilation times and dropped support for R15 and earlier OTP versions. Continue reading → Elixir on Xen May 02, 2013 · by José Valim · in Announcements The Erlang on Xen team has added support for Elixir and we will tell you how you can use it! Continue reading → Elixir v0.8.2 released April 29, 2013 · by José Valim · in Releases Elixir v0.8.2 is released with bug fixes, better Erlang R16 support and doctests. Continue reading → Google Summer of Code 2013 April 19, 2013 · by José Valim · in Announcements Elixir is taking part in Google Summer of Code 2013! Are you a student? Join us! Continue reading → Elixir v0.8.0 released January 27, 2013 · by José Valim · in Releases On the last 9th January, we celebrated two years since Elixir's first commit and to celebrate this occasion we have prepared a big release. Elixir v0.8 is out, with documentation, optimizations, bug fixes and shiny new features. Let's take a look at them! Continue reading → Elixir v0.7.2 released December 04, 2012 · by Yurii Rashkovskii · in Releases Elixir v0.7.2 is released, new, improved type specifications syntax and many other improvements. Continue reading → Elixir v0.7.1 released November 18, 2012 · by José Valim · in Releases Elixir v0.7.1 was released to celebrate the end of a two months journey traveling around Europe, United States and Brazil talking about Elixir. Continue reading → Elixir v0.7.0 released October 20, 2012 · by José Valim · in Releases Elixir v0.7.0 is released with many improvements! Read on for more information. Continue reading → Elixir v0.6.0 released August 01, 2012 · by José Valim · in Releases We have finally released Elixir v0.6.0! This release includes a build tool called Mix, support for Erlang typespecs, many improvements to IEx and improved IO, File and Macro support. Continue reading → Elixir v0.5.0 released May 25, 2012 · by José Valim · in Releases We have finally released Elixir v0.5.0! This marks the first release since the language was rewritten. In this blog post, we will discuss what we achieved during this time and what are the next steps! Continue reading → A peek inside Elixir's Parallel Compiler April 24, 2012 · by José Valim · in Internals Today, a parallel compiler just landed in Elixir main. The goal of the parallel compiler is to compile files in parallel, automatically detecting dependencies between files. In this blog post, we are going to take a peek into the parallel compiler internals and learn more about Erlang and Elixir in the process. Continue reading →"
