["https://elizabethwaterman.com/portfolio/book/moneygame"]
title = "Moneygame Photo Project, Strippers Strip Clubs, Exotic Dancers"
description = "Photography book by Elizabeth Waterman. Photos of Strippers and Strip Club Nightlife."
full_description = "UPDATE: The MONEYGAME book is sold out of bookstores. Limited copies available, please email the artist directly at elizabeth@elizabethwaterman.com “For the last four years,” says American fine art photographer Elizabeth Waterman, “I have spent most of my Saturday nights in strip clubs, photographing and building a rapport with the dancers who make their livelihoods there. I’ve captured the girls climbing the pole, giving lap dances in the VIP section, putting on glittery outfits, and counting their dollars at the end of a long night.” With the unique perspective and kindred compassion of a young female artist building her own body of work, Waterman celebrates their humanity and commitment to mastering their art in service of larger life goals. She shot the photos from 2016 to 2020 – primarily on 35mm and 120mm film – in Las Vegas, Los Angeles, Miami, New Orleans, and New York. Each dancer depicted has given permission to be photographed and published. Popular media has long characterized strip clubs as gritty dens of ill repute. The truth is, there are many dimensions and nuances to the culture. By necessity, exotic dancers are highly competitive athletes, and consummate performers. They are also women using the profession as a well-considered strategy to pay off student loans, earn money to raise their children, buy a home, or launch a business. While statistics about the sex industry are unreliable at best, those regarding strip clubs are a matter of public record. There are more than 4,000 such establishments in the U.S., generating more than six billion dollars annually, and providing living wages for about 58,000 dancers, bartenders, and other employees. Exotic dancers give stage shows for male and female patrons, demonstrating “tricks” on stationary or rotating poles, lap dances, and acts in private rooms. On a good night, a dancer can make $2,000 or more. They find the courage to preserve and maintain their dignity, and in rarified moments, they seem to transcend it all with ethereal, dazzling grace."
