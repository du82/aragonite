title = "Facciamo il Bosco — Eliza Collin"
description = "Facciamo il Bosco | Studio Rizoma: Pandemos | Parco delle Madonie, Sicily | Research | 2020 Studio Rizoma's open call during the initial months of the global..."
full_description = '''Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Facciamo il Bosco | Studio Rizoma: Pandemos | Parco delle Madonie, Sicily | Research | 2020 Studio Rizoma's open call during the initial months of the global pandemic led to the selection of Facciamo il Bosco. A research project highlighting the interconnectedness of pre-existing issues like water stress and temperature rise in Sicily, and emphasizing the need to shift perspectives towards understanding climate change effects on ecosystems, by ecosystems, and engaging communities in remediation efforts. During the first months of the global pandemic in Spring 2020, Studio Rizoma issued an open call to collect the first European artistic responses to the pandemic and it's overcoming. After being chosen by a seleciton commitee, Facciamo il Bosco was a research project in response to this call. EN Stress on water supply and temperature increase are both predicted to affect Sicily in the next 20 years. It is clear that Covid-19 has dominated the media however the problems we were facing before have not disappeared and may in fact be interconnected. This case is clearly outlined in ‘The Ecology of Disease’ (Robbins, 2012).I am speculating on a future world where we can better understand the effects climate change is having on a more than human world, the effects disasters such as drought have on complex and endemic ecosystems and how we can begin to step away from a perpetual human perspective and look at climates' effect on the world from a new lense. Due to various new stresses, plants evolve in the process of survival but they are not fast enough. I wish to draw upon these intricacies to inform the development of this work.My project stemmed from a desire to engage communities in an empowering process of better understanding how the land they live on is changing and how best to work with it to remediate the effects we have upon it. ITSi prevede che lo stress sull'approvvigionamento idrico e l'aumento della temperatura influenzeranno la Sicilia nei prossimi 20 anni. È chiaro che il Covid-19 ha dominato i media, tuttavia i problemi che stavamo affrontando prima non sono scomparsi e potrebbero in realtà essere interconnessi, come chiaramente delineato in "The Ecology of Disease" (Robbins, 2012).Sto speculando su un mondo futuro in cui possiamo comprendere meglio gli effetti che il cambiamento climatico sta avendo su un mondo più che umano, gli effetti che disastri come la siccità hanno sugli ecosistemi complessi ed endemici e su come possiamo iniziare ad allontanarci da una perpetua prospettiva umana e guardare l'effetto del clima sul mondo da una nuova lente. A causa di vari nuovi stress, le piante si evolvono nel processo di sopravvivenza, ma non sono abbastanza veloci. Desidero attingere a queste complessità per informare lo sviluppo di questo lavoro.Il mio progetto è nato dal desiderio di coinvolgere varie comunità in un processo di responsabilizzazione per comprendere meglio come sta cambiando la terra in cui vivono e come lavorarci al meglio per rimediare agli effetti che abbiamo su di essa. pandemos.studiorizoma.org'''
