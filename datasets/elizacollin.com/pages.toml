["https://elizacollin.com/Process-to-process-Interwoven"]
title = "Process to process: Interwoven — Eliza Collin"
description = "Progress to process: Interwoven | Somerset House, London | Group Exhibition | 2019 Progress to Process is Makerversity’s new public programme series..."
full_description = "Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Progress to process: Interwoven | Somerset House, London | Group Exhibition | 2019 Progress to Process is Makerversity’s new public programme series re-imagining the production processes behind the world’s most polluting industries. By breaking down and challenging unethical production chains, from materials and manufacture to marketing, we can explore new ways for makers, designers and companies alike to collaborate towards long-term sustainable change. Our first series strand is Interwoven ,a weekend festival with an interactive exhibition alongside debates and workshops exploring how textile innovation intersects with design and activism to create sustainable change within the fashion industry and beyond. Fashion is the second most polluting industry worldwide, with global repercussions in terms of climate change and social justice, caused by irresponsible manufacture alongside our own wasteful habits as consumers. By 2050, the fashion industry will have used up a quarter of the world’s carbon budget - if our own clothing habits and making processes do not change for good. . Beyond upcycling and repurposing, how can we change the ways we source, produce and consume new materials? As we bring together climate change activists, designers and fashion brands, across technology, science, textile and fashion, join us in reconsidering what you wear and how it was produced. How can we imagine new manifestos for the future of textiles, together?. . Interwoven was an interactive exhibition focusing on innovative textiles, from locally produced sustainable clothing to experimental materials. Co-curated in partnership with textile producers Bysshe Partnership, Doppelhaus Ltd and myself, the exhibition included a selection of works by fashion designers having collaborated with them to produce a range of garments made from their fabrics. We explored perspectives around textile innovation at the crossroads of design, science, fashion and activism, alongside fabrics’ current and re-imagined use from materials to production and consumption. We seek to make visible the interwoven conversations between fashion consumers, makers, climate change activists, textile producers and fashion designers, from emerging names to established brands. Note from show: 'Exhibitors will be present throughout the weekend to engage with audiences around sustainable textile initiatives and processes. Alongside a participatory space for audiences to express their relationship to fast fashion and climate justice, a textiles clinic powered by Doppelhaus will allow them to bring in garments to uncover the full story behind their production.' . ."
