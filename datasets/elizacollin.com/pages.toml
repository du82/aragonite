["https://elizacollin.com/Front-Page"]
title = "Eliza Collin"
full_description = "Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Working on a combination of self-initiated and client commissioned projects Eliza’s work explores how the way we design determines the way we value, specifically in regards to the extraction, use and disposal of what we refer to as ‘resources’. Eliza often investigates these topics on site, in specific locations through the communities which surround them and which are most affected by them. Tapping into both academic and local expertise using an array of holistic research methods such as interviews, ethnography, workshops, co-design and walking to determine suitable outcomes. It is important for the sustainable progression of every project to create moments of interdisciplinary connection and critical reflection. The process always determines the outcome which in the past have manifested as anything from films, products, policies or alternative systems of production. SOLAR, DRiR Display, the Design Museum, London. Exploring our changing relationships with the heat and light of the sun through multidisciplinary and collaborative work20th June - 22nd September 2024 WET ZONES proposes a future with localized water recycling, using a mobile kitchen unit and filtration system to promote sustainable water habits without demonizing domestic use.WET ZONES Kitchen Activation, 2023"
