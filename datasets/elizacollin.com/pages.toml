["https://elizacollin.com/Foreign-Objects"]
title = "Foreign Objects — Eliza Collin"
description = 'Foreign Objects Collaboration with Foreign Objects Description taken from Foreign Objects website "A series of embroidered jumpsuits...'
full_description = '''Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Foreign ObjectsCollaboration with Foreign Objects Description taken from Foreign Objects website "A series of embroidered jumpsuits investigating computing history at Bell Labs" In An Introduction to the Bell System, we have made 5 embroidered jumpsuits in collaboration with designer Eliza Collin, exploring the history and working culture of the Computing Sciences Research Center at Bell Labs, between 1970s-90s. Though famous for the success of the Unix operating system and surrounding tools, the group's cult status online is buoyed by a much wider array of playful, experimental and sometimes anarchic work, in an era where the identity of "tech worker" had yet to be defined. This project is a work of fan art: each suit considers a strand of research from this era at Bell through the projects, in-jokes and ephemera.The project was produced in Winter 2020 - Spring 2021, in collaboration with Eliza Collin (garment design and production) and Genie Kausto (styling and photography). Foreign Objects did the research, design and embroidery for the jumpsuits, and also contributed to the garment production. We owe a lot of thanks to Bell's archivist Ed Eckert, as well as facilitators of the Further Experiments in Art and Technology program: Domhnail Hernon, Danielle McPhatter, and Ethan Edwards. We'd also like to thank the 9front community for flying the Plan 9 flag, and making some helpful and supportive suggestions over IRC. The embroidery files for the suits were partially produced using the Studio for Creative Inquiry's open-source PEMbroider software.'''
