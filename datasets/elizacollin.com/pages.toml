["https://elizacollin.com/WET-ZONES"]
title = "WET ZONES — Eliza Collin"
description = "WET ZONES Research | Studio Rizoma | Palermo, Italy | Residency | 2022 - 2023 Commissioned by Fondazione Studio Rizoma and supported by the Rosa Luxemburg..."
full_description = "Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact WET ZONES Research | Studio Rizoma | Palermo, Italy | Residency | 2022 - 2023 Commissioned by Fondazione Studio Rizoma and supported by the Rosa Luxemburg Foundation, the WET ZONES research residency explored water histories and how they affect contemporary water management and culture in and around the city of Palermo, Sicily. Using the findings to feed into a design intervention which can be used as a discussion point for the future of water in Palermo. From the period of July 2022 - June 2023 I was exploring water histories and how they affect contemporary water management and culture in and around the city of Palermo, Sicily. Using the findings to feed into a design intervention which can be used as a discussion point for the future of water in Palermo. Palermo is not a water scarce city. It receives water from many springs, wells and reservoirs due to the artificial damming of rivers. Historically Palermo can boast of one of the most intricate sophisticated water systems. However today, over 50% of this water is lost before it reaches domestic spaces, and though water in the basin is not scarce, the cities resulting in over consumption inevitably leads to the quickening desertification of the surrounding countryside. The water which reaches the domestic space, once used, much of the time is often not cleaned properly before being discharged into rivers and oceans with devastating effects on these ecosystems. The way we dirty and dispose of water today is contributing to a global shortage of fresh water and leans us into a future of complex remediation to ensure enough clean water to go around. Contributing to this, we have also disrupted the natural water cycle through activities such as deforestation and excessive use of groundwater without conscious actions to replenish it. Cities survive from the resources which surround them, and many are designed for goods to enter and waste to leave. Water is one of the most important substances on the planet today and its quality is finite. Residency timeline: July 2022Desk research and visiting archives within the city to gather historical knowledge and documentation Mapping this knowledge Walking the hidden rivers of Palermo with local artist Gianluca Concialdi Building expert base by connecting to individuals in water quality, distribution, management, architecture, farming, tourism etc November 2022 Shooting six interviews with local filmmaker Scroll down to watch four interview extracts with experts in water histories and management in Sicily and their ideas of the future.Walkshop with Studio Rizoma and local experts along one of Palermos hidden rivers February 2023 Online co-design workshop with water experts from Italy, France, Netherlands and UK May - June 2023 Production The project is part of SCHOOL OF WATER SCARCITY, produced by Studio Rizoma and supported by the Rosa Luxemburg Foundation Tunis. Research and artistic direction: Eliza Collin Curation: Izabela Anna Moren Realisation: Marginal Studio Production: Giorgio Mega Read full article here and watch interview trailers! Read my interview with Curator Izabela Anna Moren hereComissioned by Fondazione Studio Rizoma as part of Between Land and Sea"
