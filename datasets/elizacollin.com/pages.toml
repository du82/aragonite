ed knowledges from residents, artists, architects, designers, researchers and local industries. Artwork, talks, walks, presentations, song and performance were all made. Exhibiting was: Liam Baulch, Eliza Collin, Verity Coward, Megan Jones, Lewis Prosser, Ivan Robirosa, George Ridgway, Phoebe Ridgway, Chitra Sangtani, Elinor Stanley, Jo Sweeney, Jules Varnedoe, Lizzie Watts, Jessie Whiteley, Clive Whitbourn, Yvonne Zhang ‘Jewels’ made in collaboration with Elinor Stanley"
