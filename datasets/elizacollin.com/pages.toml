title = "Stennagwin — Eliza Collin"
description = "Stennagwin: pale tin baring land | MA Material Futures | Cornwall | Research | 2020 Stennagwin is a journey back home for me. It delves into the study of kaolin..."
full_description = '''Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Stennagwin: pale tin baring land | MA Material Futures | Cornwall | Research | 2020Stennagwin is a journey back home for me. It delves into the study of kaolin slag heaps that towered over me during my childhood in the St. Austell area. 'Stennagwin - Pale Tin Bearing Land' examines the legacy of mining in Cornwall and contemplates both local and global visions for its future. It stands in stark contrast to the ongoing cleanup efforts of centuries-old mining pits. Can mining ever contribute more than it detracts? This is the question I pose. 50°22'56.2"N 4°49'45.0"W (google maps) Fired samples exposing minerals present in decomissioned quarries. Interview series of stakeholders in Cornish mining futures. .'''
