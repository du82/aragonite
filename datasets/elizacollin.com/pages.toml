full_description = "Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Olfactive Evolution | DRiR: SOLAR| the Design Museum, London | Group Exhibition | 2024Increase in global temperatures are causing the scent of plants and flowers to change. When a flower’s scent changes, it can become unrecognisable to its pollinators which puts that flower at risk of extinction. Eliza’s practice spans disciplines and species, using design to build networks and interventions exploring varied and proactive futures. Olfactive Evolution invites the viewer to dive into the science of scent and its instabilities in the context of the climate emergency. Following in-depth collaborations with scientists, perfumers, farmers and artists, Eliza’s display features a new piece of garden design for the Design Museum and speculations on the future of plant biology. Through the project, she uses smell as a gateway to sense changing environments and to bring us closer to species beyond the human."
