full_description = "Eliza Collin Research DRiR: Olfactive EvolutionHybridising Scentscapes WET ZONESGemene GrondNarratives of SoilFragile Ecosystems LIPA: Ma’litakki Muic (pig) Stennagwin ExhibitionsSOLARMaterial Power: Palestinian Embroidery Grease: Traffic Festival WET ZONES: Kitchen ActivationAcqua DentroPandemos: Facciamo il BoscoMaterial Connections: House of PrincesAll in green went my love riding: La Panchina Process to process: Interwoven Dust Sheet Embroidered SnowLife Cycles‘casapienamicrocentro’: Archivio Illegibile WithKin Projects (coming soon) Collaborations Foreign Objects x Bell Labs Giovanna: Postcards from the Modonie Bathsheba Drowned StatuesTeenage Caveman: Big Mouth Orlando Under the bridge pacing for the train Essays cv contact Muic (pig) | MA Material Futures, Central Saint Martins | London | Research | 2020 Muic (pig) is an exploration into the role of the wild boar in the British landscape and the denial of its reintroduction written down in UK law. Developed during my time on the MA Material Futures and the first covid-19 lockdown, I worked on tools which could aid humans in replacing the vital role the wild boar plays as a keystone species. Until we are ready to live alongside them again. Readings from: Feral (George Monbiot, 2013) https://www.wildculture.com/article/george-monbiot-feral-wild-boar/1209 References: Wild Boar Mythology and Folklore (Dan Puplett) https://treesforlife.org.uk/into-the-forest/trees-plants-animals/mammals/wild-boar/wild-boar-mythology-and-folklore/ The Environmental Impact of Wild Boat (Giovanna Massei and Peter V. Genov, 2004) http://www.secem.es/wp-content/uploads/2013/03/Galemys-16-NE-011-Massei-135-145.pdf Arrested Development (George Monbiot, 2011) https://www.monbiot.com/2011/09/16/arrested-development/ Record numbers of golden eagles poisoned in Scotland in 2010 (Patrick Barkham, 2011) https://www.theguardian.com/environment/2011/sep/14/golden-eagles-poisoned-scotland-rspb The Devonshire Hunting Tapestries