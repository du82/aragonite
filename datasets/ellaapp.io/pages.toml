["https://ellaapp.io/faq.html"]
title = "Ella — Privacy Policy"
description = "Ella is a sight-singing ear-training app that helps you improve your musical ear with fun and engaging exercises"
full_description = '''Ella is a sight singing app that helps you improve your musical ear with fun and engaging exercises. Ella uses the microphone on your device to detect your pitch and provide accurate evaluation and feedback. Sight singing is the practice of singing notated music that you have never seen or heard before. In addition to being a useful skill in choirs and other musical scenarios, sight singing is a powerful ear training tool. By practicing sight singing, you can better internalize music theory concepts like scales, intervals, and chords. You can deepen your understanding of notation and rhythm, and in turn improve your compositional and improvisational skills. In the Path Ella will guide you slowly through levels that gradually increase in difficulty. This is a great place to start as a beginner. In the Collections you can work independently on a variety of topics like intervals, scales, and tunes. This is a great place to start if you want to work on singing specific musical concepts. If you are a beginner user, we highly recommend starting on level 1 of the Path. You can also try ‘Introduction’ in the Collections. If you are an intermediate or advanced user, we recommend skipping ahead in the path. You can do this by playing the gold hexagonal Checkpoints in the path. We also recommend exploring the Collections. You will see a staff with a notated melody and hear the first note play. Your goal is to sing back what you see. If you need any help, you can tap on any note to hear it or tap ‘Preview Question’ to listen to the entire question. Using these features will incur a small penalty. You can also press ‘Tonic’ to hear the tonic of the key for no penalty. Once recording, sing to the best of your ability. You will see a line being drawn as you sing that represents your intonation. You can also use the tuner at the top of the screen to gauge your intonation. Ella will stop automatically once you finish a question. Don't press "Stop" unless you need to start over.'''
author = "Ensemble Eduction"
year_published = 2025
