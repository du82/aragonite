["https://www.emacswiki.org/emacs/CSS"]
title = "EmacsWiki: CSS"
full_description = "You can use different stylesheets for this wiki using the links below. If you know CSS, you can even create your own!Recommended Style SheetsDefault – the default theme by BrianBurnsClassic CSS The default theme before May 2013.With: more whitespace – big fonts – medium fonts – small fonts – tiny fontsMelonesque, maintained on a wiki pageUser Submitted Style SheetsSome of these are definitely unmaintained.Light ThemesWikipedia – A classic Wikimedia style theme.Basic CSS – For people who use custom CSS want a basic style sheet.Melonesque – A minimal light theme by muto (2024)Ruby – Bold red links on white.Cali – Modern grey on white.More text: Less whitespace, to fit more text on one page.Lots More Text – Like More Text but with a smaller font.Vanilla: A skin with very little visual distraction.Community Wiki with sidebar Minus The Sidebar: This is a nice compact skin but doesn’t use the entire page width.Grey: Modern, black-on-grey skin.Green – Green on a green backgroundOrangePink Bliss – Inspired by the ColorTheme PinkBlissHugPresentationUseitCSS by NicFerrier with sans-serif font and no line or letter spacing.Planet CSS using Bitstream Vera Sans MonoOddmuse CSSOddmuse blue headings CSSCompact Antique Beige: Like Antique Beige but less whitespace. Not recommended for viewing code.Blue Heading + Small Font – A theme by LucasBonnetBeige + Small Font CSSBlue + Small Font CSS Another color. I can’t live without Blue 😊Grey and RedGreen CSSBeige Red CSS Beige background, large text. Like an old newspaper.Beige CSS Larger font with earth tones.Grey CSS by “mad” of the czlug(Grey CSS but 100ex wide)twb's favorite CSSDark ThemesSpaceMelonesque – Automatic dark theme based on system preference.white on blue and cyan links– By Earle Martin, adapted for Oddmuse by AlexSchroeder.Adding a New ThemeNew themes are always welcome! To upload a theme to this list:Create a new page by visiting a page that doesn’t exist, like emacswiki.org/emacs/YourThemeNameClick *“Create it now”*, and at the bottom of the “edit” page, click *“Replace this text with a file”*Upload your CSS file.Now, edit this page and create a new entry to this list with the following form:* [EmacsWiki:action=browse;id=CSS;css=http://www.emacswiki.org/emacs/download/YourThemeName My Cool Theme] -- My DescriptionSee AlsoEmacsWikiAppearance – Add custom CSS to your browser.ThemeTest – A page to help you format your theme properly.Note that due to security considerations, most browsers will prevent you from loading a style sheet from a different server."
year_published = 2024
