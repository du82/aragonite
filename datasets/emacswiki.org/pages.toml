["https://www.emacswiki.org/emacs/Problems"]
title = "EmacsWiki: Emacs Wiki Problems"
full_description = "This page is for recording (or discussion) of current apparent Problems with the EmacsWiki Web site. The purpose is to point out problems to the site maintainers.This page is not for questions or problems about Emacs – see OpenQuestions for that.Suggestions: If you have suggestions (not problems) for the Emacs Wiki (not Emacs), please contribute them at EmacsWikiSuggestions.Note that this page is not about EmacsWikiMode.Add your problem descriptions below this line (ie, newest on top, oldest on bottom)Revisioning Problems editing does not get most recent versionI tried yet again to get emacs-w3m to work as described above. I edited. It didn’t work. I edited the page with Safari. It worked. Then I followed the instructions again in emacs-w3m. The Safari edit did not show up in the compose edit box, even though the page did show it. Therefore, the text that the user edits is not the same as the text that is shown. Is this a cache issue? Thanks. I don’t think I’ve ever run into this. Anybody else? – AlexSchroederRecentChanges doesn't reflect recent changesI just edited and saved a reply someone posted at DrewsElispLibraries. I refrefreshed RecentChanges (with rollbacks and minor changes included), but my edit does not appear. That wiki page is listed, but still at the time and user of the previous edit. However, after clicking List only major changes it was listed. I had previously cleared my cache, so I don’t think that was the problem. I’m guessing it was a cache problem nevertheless, but thought I’d mention it, in case it’s not. – DrewAdamsMarkup/Generation IssuesCan markup be used in headers? <code>I have failed to do so.</code>Is this documented somewhere?Use-case: putting a category-tag like CategoryNeedsAttention into a header, without actually invoking it.Interestingly, the markup in this particular header renders properly in the TOC Markup cannot be nested by default. Very few markup elements can in fact be nested. This is not documented anywhere, I think. Common sense stuff like list items and inline markup can be nested (bold list items, for example). Emphasis markup using apostrophes is the only inline markup that can be nested: ''italic '''bold''' and italic'' → italic bold and italic. – AlexSchroeder The irony being that markup in headers is rendered in the (javascript-built) TOC – MichaelPaulukonisApostrophes etc. not prettified in linksain't -- it -- \"nice\" ⇒ ain’t – it – “nice”[EmacsWikiProblems ain't -- it -- \"nice\"] ⇒ ain't -- it -- \"nice\"The link text retains its crude ASCII formatting. – VegardOye Yes, there is no recursive parsing of the link text. – AlexGeneral IssuesMeatBall links lead to a spam site now.It looks like usemod dot com domain has expired. Some of the MeatBall links now end up on spam sites eg: AppropriateMediaCategoryEmacsWikiSite"
year_published = 2024
clearnet = "https://www.emacswiki.org/emacs/Problems"
