["https://www.emacswiki.org/emacs/CategoryFiles"]
title = "EmacsWiki: Category Files"
full_description = "Click on the heading to list all pages relevant to files: How to open files, how to open files on remote sites using ftp or other protocols, how to make backup files, etc. See CategoryDirectories for managing files.AngeFtp – using ftp in the background to edit remote filesAnnotate – annotate any file and revisit your annotations laterAnything – find files from various sources (recent files, files found by locate or a desktop search engine, files in the current directory,…)ArchiveMode – files inside archives like .arc, .zip, etcAutoEncryption – encrypt when loading and saving filesAutoSave – losing your Emacs session doesn’t mean losing your work. See this page to customize the behavior of files with names like #file#.BackupDirectory – Organize your BackupFiles in one place. See this page to customize the behavior of files with names like file~.BackupEachSave – a more comprehensive system for saving backups on each buffer saving, as opposed to extending ForceBackups.BuffernameTags – decorate buffer names to aid developmentBuffersMisc – misc. things to do to buffers.CouchdbDocument – Edit couchdb document.DfMode – keep an eye on disk space usagedo-not-edit.el – read-only from DO NOT EDITDiredMode – the main mode for managing files under EmacsDiredPlus – a library which adds extra features and functionality to DiredDosToUnix – replace DOS carriage returns with UNIX line feedsEverything – Bridge to MS Windows desktop-search engine EverythingFileFormat – conversions on read/write for certain types or markupFileModes – the rwx permissions bits on filesFileSets – persistent sets of filesFilesPlus – enhancements to standard library files.elFindFileAtPoint – filename (or URL and other things) at pointFindFilesCommand – do a file find with emacs only functionalityFindOtherFile – GNU Emacs has this built-in capability for finding related files (e.g. C/C++ header files)ForceBackups – Force backups for each save. Good with version-control.GlobalFF – find and open any file on your system regardless of where it isGpicker – quickly pick a file in project by typing just few characters of it’s nameGtkFileChooser – How to use the Gtk file chooser (as opposed to selector) dialog.HoboMode – secure, remote editing via ‘scp’Icicles – use minibuffer regexp completion and completion-candidate cycling to navigate and perform operations on files anywhere in your file systemJournal – in a user-specified directory create and visit a file whose name is fashioned after the current date, e.g., 2007-09-04-Tue.html. Other time functions: yesterday inserts yesterday’s date into current buffer; tomorrow inserts tomorrow’s date</code>; and other. Together these are handy for keeping a diary for work or personal use.LocalVariables – variables changed local to files, automatically when you open the filesLocateFilesAnywhere – find files anywhere on your systemLockFiles – how Emacs can tell if you’re editing the same file as another Emacs. See this page for information on customizing the behavior of files with names like .#file.LustyExplorer – Dynamic filesystem explorer and buffer switcherOpenFilesInDifferentWays – different ways to find and open filesOrgAnnotateFile – annotate a file with org syntaxprotect-files.el – read-only for selected directories and whole treesRevertBuffer – Restore buffer contents from the file systemSaveAsHtml – save a buffer as HTMLShadowFile – having several copies of files that have to be kept in sync.SudoSave – perform file saves using ‘sudo’ to temporarily change permissionsTrampMode – using ‘scp’/‘ssh’ and a plethora of other protocols to edit remote filesUnicad – Universal Charset Auto Detector – automatically detect file coding-systemuniquify – give more useful buffer names for similarly named files than ‘generate-new-buffer-name’ does (like `file<1>’)UsePackage – describe the downloading and configuration of a package, with a remote autoload-like mechanism that can unpack tarballsLisp:arview.el – extract and view archives in the temporary directory"
