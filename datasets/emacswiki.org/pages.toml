["https://www.emacswiki.org/emacs/CategoryDisplay"]
title = "EmacsWiki: Category Display"
full_description = "Click the heading to find all pages related to display stuff. Note that colors and faces belong in CategoryFaces.Pages relating to displayCategoryFramesFrameTitle – change the title of a frameCategoryMouseCategoryCustomizeDoReMi – incremental changes or cyclingFunction ‘doremi’: use it to define other commands that let you use the arrow keys and/or mouse wheel to make incremental changes to things or cycle through a ring of things.Library doremi-frm.el – use the arrow keys and/or mouse wheel to make incremental changes to frame properties and cycle through a ring of frame configurations (undo). See DoReMi.RemoteEmacs – running Emacs from an another machine over X11HighlightingShowWhiteSpace – highlight whitespace charactersHighlightTemporarily – highlight parts of a bufferCrosshairHighlighting – highline current line and column; track cursor or show cross hairs momentarily.HighlightCurrentLineHighlightCurrentColumnHighlightIndentation – highlight indentation using vertical guide linesChangingCursorDynamically – automatically change the cursor, depending on the contextTruncateLines – the display engine can do LineWrapLineNumbers – display information about line numbersModeLine – the mode-line provides lots of informationModeLineMinorModeMenu – pop up minor-mode menus from the mode-line.ModeLinePosition – enhancements to standard minor modes ‘line-number-mode’, ‘column-number-mode’, and ‘size-indication-mode’ShowPointMode – show the value of the point in the mode lineDiminishedModes – Abbreviate minor modes appearing in the ModeLine.DelightedModes – Abbreviate/customise both major and minor mode names in the ModeLine.TransparentEmacs – how to make your wallpaper shine through the bufferWorkSpaces - an implementation based on registersFullScreen - how to switch to fullscreen (with F11 for example)MiniMap - A sidebar showing a small version of your buffer with highlighted viewport, which can be dragged with the mouse.Sublimity - Smooth-scrolling and minimap like sublime editor, similar to MiniMap.Aerial - An alternative layout for emacs (cleaner and less cluttered)XftGnuEmacs – XFT support for GnuEmacs allowing the use of anti-aliased fonts under X11.Managing Frames within EmacsCategoryFramesOneOnOneEmacs – making Emacs more Frame-oriented, less Emacs window-orientedDoReMi – incremental changes or cyclingFunction ‘doremi’: use it to define other commands that let you use the arrow keys and/or mouse wheel to make incremental changes to things or cycle through a ring of things.Library doremi-frm.el – use the arrow keys and/or mouse wheel to make incremental changes to frame properties and cycle through a ring of frame configurations (undo). See DoReMi.FisheyeWithThumbs – thumbnail frames give a fisheye view of your frames and provide an alternative to iconifyingFrame Commands – Maximize/restore (vertically, horizontally, both); tile; iconify; move or resize incrementally; manage frame configurations; copy/paste parameters (attributes); show/hide;…Maximize – Maximize frames vertically and or horizontally.WindowsAndFrames – do several tasks with one EmacsFrameConfiguration – save, restore and switch Frame configurations (see also SessionManagement)BumpWindowUp – control the position of XEmacs frames on NT WindowsScrollingScrolling – general stuffBufferScrolling – horizontal scrollingSmoothScrolling – no half-page jumpsNextLineBehavior – scroll one line at a timeScrollMargs – yet another smooth scroll modeScrollAllMode – scroll several buffers togetherFollowMode – display a buffer in two windows as if it were two columnsHalfScrolling – scrolling by half pagesIdleScrolling – scroll down one line per second when idleSwissMove – scroll with decreasing stepsizesGrabAndDrag – scroll a window by mouse draggingVerticalConsistency – make opposite vertical movement go back its trackChanging the appearance of charactersPageBreaks – change page breaks from a ^L to a horizontal lineunicode-disp.el – unicode chars as ascii fallbacks if not displayablePrettySymbol – display ascii strings as unicode/graphicallyShowWhiteSpace – highlight whitespace charactersSaving screen real-estateScrollBar – how to disable it, or how to put it on the other sideToolBar – how to disable itMenuBar – how to disable itActiveMenu – let the MenuBar enable and disable itselfFisheyeWithThumbs – thumbnail frames save space but still let you see your frames – an alternative to iconifyingFrameModes – shrink-wrap frames (resize to fit selected window/buffer); tile frames; iconify/hide framesDiredDetails – show/hide details in DiredTheaterStyle – how to disable everything except the buffer itself.GoodFonts – what fonts for what screen resolutionsSetFonts – how to set themHideModeLine – don’t display the ModeLineDiminishedModes – Abbreviate minor modes appearing in the ModeLine.DelightedModes – Abbreviate/customise both major and minor mode names in the ModeLine.LineSpacing – how to set itTheFringe – In graphical Emacs there’s a space between the buffer and the window. You either like it, or you don’t.(Add pages specific to certain displays such as MSDOS, tty, etc.)InternationalConsoleFonts – displaying international characters in a terminalEmacsOnTerminal – running Emacs with a real terminalRemoteEmacs – Emacs across machines with X11Low-level drawingXlibInterface – an xlib interface in Emacs LispPixelDrawing – a patch to the C source defining a function to draw pixelsAnd for tons of screenshotshttp://images.google.com/images?q=emacs(adding a non-link to appease the link spam filter)"
