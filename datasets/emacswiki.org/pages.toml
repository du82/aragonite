full_description = "Click on the header to list all pages related to debugging. <kensanata> everytime emacs encounters an error in InitFile, emacs cries a little.Debugging Emacs:DebugEmacs – debug the C layer using gdbDebugMessages – find out where Messages messages are coming fromEmacsMemoryDebugging – look for memory leaksDebugging EmacsLisp:DebuggerMode – debugging EmacsLispBacktraceBuffer – quick and dirty EmacsLisp debugging happens in the Backtrace bufferSourceLevelDebugger – the full Edebug for EmacsLispDebugFileLoading – finding errors in filesDataDebug – Examine large complex Emacs Lisp data structuresProfiling and tracing EmacsLisp:EmacsLispProfilerEmacsNativeProfilerEmacsLispBenchmarkEmacsLispTracingLog4E Logging For Elisp - a logging framework for ElispDebugging other programs using Emacs:DebuggingWithEmacs usually involves the GrandUnifiedDebugger (GUD) as an interface to command line debuggers such as gdb, dbx, cdb,….GdbMode – a debugger mode specialized for gdbPdbNotes – additional setup info for pythonDebugAdapterProtocol – debugging using the Debug Adapter ProtocolThere is a rewrite of GUD from scratch. The debuggers can be run stand-alone or from an existing a comint “track-mode” shell The debuggers supported include:bashdb – Bash debuggergdb – can be run stand-alone or from an existing a comint “track-mode” shellkshdb – Ksh debuggerpdb – Stock C Python debuggerperl – Stock perl5db debuggerpydb – Python 2.x debugger (but please use the newer pydbgr instead)trepan2 – Python 2.x debugger (formerly pydbgr)trepan3k – Python 3.x debuggerrdebug – Ruby debugger ruby-debug remake – GNU make debuggertrepan – Ruby 1.9 YARV debuggertrepanx – Ruby debugger for Rubiniustrepan.pl – Trepanning Debugger for Perlzshdb – Zsh debugger VisualCDebugger – interfacing with the Visual C++ debugger"
