["https://www.emacswiki.org/emacs/%E3%82%B5%E3%82%A4%E3%83%88%E3%83%9E%E3%83%83%E3%83%97"]
title = "EmacsWiki: サイトマップ"
full_description = "Deutsch | English | Español | Français | Português | Русский | 简体中文 | 繁體中文 | Svenska | 日本語 | 한국어 | Italiano | УкраїнськаHere is the Japanese page for SiteMap. English page is Here.EmacsWiki は EmacsAndXEmacs コンテンツ専用です…. 詳しくは MissionStatement を参照されたし.– SiteMap より日本語ユーザーに向けてこのサイトはEmacsen (Emacs, XEmacs, Nemacs, Mule, Meadow, NTemacs) などの日本ユーザー向けの、ユーザー自身が作るサイトです。 Emacs 用日本語文書の公開場所の提供日本人制作 Elisp の公開場所の提供、日本における掲示板、日記などからのFAQの収集、英語で開発されている Elisp の日本語による情報、 などを目指します。ここはみんなで作るサイトです。既存、新規にかかわらずのページをご自由に作成してください。詳しくは 利用手引 または、編集の仕方 をご覧ください。翻訳の場合は翻訳の手引も併せて一読ください。日本語版 サイトマップ単なる英訳にとどまらず、あなたの書いた日本語文章を作成してください。サイトの使い方 – サイトを使うにあたってのヘルプElispセクション – EmacsLispソースコードのアップロードとダウンロード編集の仕方 – どうやってこのサイトに貢献すればよいかEmacsWikiの管理者 – handling vandalism and spam on this siteWikiのダウンロード – どうやってこのサイトのコピーを手に入れるかEmacs とは？ Emacsビギナー – はじめての方にヘルプ – Emacs 上のヘルプとEmacs ユーザーによるヘルプ用語集 – Emacsユーザーの使用する用語についてドキュメント – Emacsに関するドキュメントについて歴史 – Emacsの発展日本語ＦＡＱ – ＦＡＱ収集とその英訳Emacs のダウンロードとインストール Ports / CategoryPorts – NT, Mac, GNU/Linux (Debian, BSDを含む)W32 – for w32-specific stuffビルド – ソースからどうやってビルドするかEmacs をテキストエディタとして使うには？ 改行と行折り返し – 行の折り返しについてインデント – テキストやプログラムコードのインデントを制御する括弧の対応 – それらにマッチする, それらを変更する正規表現 – 検索と置換についてなどリージョン（選択と選択範囲） / CategoryRegion – テキストを選択して操作するアウトライン / CategoryOutline – アウトライニングもしくはフォルディングとしても知られるズーミングを使って, バッファの一部を隠す編集 / CategoryEditing – 編集操作をより効率的にするためのアイディア非表示 / CategoryHideStuff – バッファの任意の部分を非表示にするファイル / CategoryFiles – ローカルファイル、リモートファイル、バックアップの作成についてコマンド / CategoryCommands – M-x コマンド、MinibufferHistory、ファイルのオープンについてバッファ切り替え / CategoryBufferSwitching – バッファの切替え方法についてテンプレート / CategoryTemplates – 定型文、テンプレート、フォームなどを利用して、タイピング量を減らす方法アンドゥ / CategoryUndo – 変更を取り消す方法、取り消し可能な変更を検索する方法Emacs をカスタマイズするには キーバインド – キーバインドのカスタマイズ設定ファイル – 設定ファイルの基本（初心者向け）プログラミング – プログラマ向けのカスタマイズフェイス – syntax highlighting, colors, font-lock表示 – ディスプレイに関連するもの (X-Window pointer shapes, Frames, …)ウィンドウ – いくつかのWindowを1つのフレーム内に管理するカテゴリ・国際化 / CategoryInternationalization – making Emacs do the parlez-vousパス – OSのパスとEmacsのパスをマージする.様々な形式のファイルを扱うための特別なモード ハイパーメディア / CategoryHypermedia – HTML, Wikis, InfoXML – XMLに関連する技術SQL – SQLとデータベースTex / CategoryTex – TeXとLaTeXものモード / CategoryModes – ポインタ, ドキュメント, その他のモードへの拡張語彙 / CategoryVocab – 新しい単語を学ぶディレクトリ / CategoryDirectories – ディレクトリの操作（dired）その他の機能 電卓 – 対話式計算機カレンダー – カレンダー, 日記, タスク管理ToDo – ToDoリストの管理チャット – PCに向かってゲーム – Emacsで時間つぶしインタフェース / CategoryInterface – オンラインサービスへのインターフェースプログラマ向けユーティリティ / CategoryProgrammerUtils – コードブラウザ等、プログラマのためのツールリモートEmacs / CategoryRemoteEmacs – 遠くのホストでEmacsを動かす外部プログラム / CategoryExternalUtilities – 外部のプログラムを呼ぶメール – メールの運用関連、Gnusはカテゴリ・GnusへGnus – 高機能なニュース・メールリーダBBDB（連絡帳） / CategoryBbdb – 電話番号、メールアドレス等のデータベースバージョン管理 / CategoryVersionControl – CVSやRCSへのインターフェース日記 / CategoryJournaling – ブログへのインターフェースPIM / CategoryPersonalInformationManager – いろいろなPIM用パッケージEmacs の機能を追加するには？（Elisp プログラムと Emacs ソースのハック） ソースコード / CategoryCode – Elisp 作者の向けのものデバッグ / CategoryDebug – Emacsのデバッギング, EmacsでデバッギングEshell / CategoryEshell – elispで完璧に実装されたシェルパッチ / CategoryPatches – 主にCレベルでの拡張のための, Emacsへのパッチ言語の拡張 / CategoryExtensionLanguage – EmacsLispの代わりに: Guile, Erlang, Python, …BiDiのサポート / SupportBiDi – Emacsへ双方向の入力と出力を追加するためのイントロダクションEmacs ユーザーたちのコミュニティ ホームページ / CategoryHomepage – Emacsの友達のウェブページユーモア / CategoryHumor – 私達がEmacsをカスタマイズしない時私達がすることEmacs Wiki Meta EmacsIRCチャンネル / EmacsChannel – みんなのIRCチャンネルサイトマップについての議論 / SiteMapDiscussion – the categories on this wiki and other stuff to put on the main pageMeatBall:EmacsWiki – wiki技術, 組織, セキュリティ, など.Emacsのバグ、要望リスト Emacsバグ要望リストメンテナンス 全ページのインデックス読み始めることとサイト改善ためにランダムは良い場所です外部リンクメンテナンスを開始script versionをチェックアーカイブをダウンロードRemove edit lock after a crash(誰もがバックアップを作成することができます)利用統計 (と古い統計)"
