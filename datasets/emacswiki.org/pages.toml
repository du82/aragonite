["https://www.emacswiki.org/emacs/CategoryFilling"]
title = "EmacsWiki: Category Filling"
full_description = "“Filling” is the term used by Emacs to describe breaking lines by inserting EndOfLine characters. It is related to LineWrap, which describes the more general process of displaying lines that are too long for the screen. Filling is sometimes used to avoid having to wrap lines.Official documentationFilling Text in the EmacsManual.Filling in the EmacsLispReference.Common ways to fillExplicit fill commandsThe FillParagraph command fills the current paragraph. By default, this is bound to M-q.See the official documentation linked above for information on ‘fill-paragraph’ and related options and commands, including ‘fill-region’, ‘fill-individual-paragraphs’, and ‘fill-region-as-paragraph’, .Auto-Fill modeAutoFillMode – MinorMode that lets Emacs break the line you are typing as soon as the last word ends beyond the right margin. Refill modeRefillMode – fills the paragraph after each editAdaptive Fill modeAdaptive Fill mode – “sets the fill prefix automatically from the text in each paragraph being filled rather than using a predetermined value”Lisp:visual-fill-comments.el – Visually wrap code comment lines which are longer than fill-column.Similar: FillAdaptUndoing fillingSee UndoFilling Highlighting or finding long linesColumnMarker – highlight a column (vertical line) of text, useful for Fortran or Cobol programmingFillColumnIndicator – a minor mode that indicates the fill column, either drawing a line or shadingFindLongLines – finding and working with long linesHighlightLongLines – another way to highlight long linesMarginMode – yet another highlight column mode See alsoErcFilling – filling ERC’s buffersFillingCommentsNobreakFade – some “nobreak” predicatesparasep.el – more things for paragraph separatorsWordWrapping – similar to AutoFillMode.WrapMode – similar to RefillMode"
year_published = 2024
clearnet = "https://www.emacswiki.org/emacs/CategoryFilling"
