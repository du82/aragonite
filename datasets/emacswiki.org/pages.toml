["https://www.emacswiki.org/emacs/CategoryDotEmacs"]
title = "EmacsWiki: Category Dot Emacs"
full_description = "If you’re not quite keen on getting into EmacsLisp yet, check out CategoryCustomize for ways you can configure Emacs without writing Lisp code. In fact, do that even if you are keen on using EmacsLisp. ;-)If you’re open to learning a little Emacs Lisp, there’s a lot you can do! Click on the page title above to list all pages related to writing your own InitFile. Here is a categorized list of selected resources.Some popular optionsAutoModeAlist – Set the MajorMode based on the filenameCustomizingBoth – Use the same InitFile for multiple operating systems or featuresEmacsCrashCode and DotEmacsChallenge – miscellaneous tipsLoadingLispFiles – How to load Emacs Lisp in separate filesModeHooks – Add code that will run after a function executes or a mode is initializedOther options and tipsAlarmBell – Turn off the beeping or change it to a visual thingAutoCodingAlist – Determine encoding by file name; use this if the encoding (ex: utf-8) is not correctly detectedAutoCompileInit – Automatically compile your InitFileAutoSave – Organize the autosave files or change the autosave intervalBackupDirectory – Organize the automatic backup files named filename~DotEmacsBankruptcy – Declare bankruptcy when things get so bad you have to start overDotEmacsDistributions – Running multiple independent configurations (or “distributions”) of EmacsDotEmacsStructuring – Organize your Emacs configInterpreterModeAlist – Set the MajorMode based on a shell script’s first lineMenuBar – Hide the menu bar or customize itModeLineConfiguration – Customize the status information displayed at the bottom of the bufferOptimizingEmacsStartup – Monitor Emacs start up and make it fasterProfileDotEmacs – Profile the InitFile to see which commands take the most timeProjectSettings – making customizations local to a projectRemoteDotEmacs – eval the InitFile you have on a web serverToolBar – Hide the tool bar or customize itInit-related packages and starter kitsSee also the StarterKits page, which tries to provide a comparative list of a larger number of popular starter kits for GNU Emacs.EmacsMacro – A “portable configuration file that configures itself.”Grail – Grand unified .emacs loader - robust and flexible load-path hackPhilHagelberg's defaultsPrelude – aims to enhance the default Emacs experienceSpacemacs – particularly for Vim convertsstartup-file-name-history.el – put command line files into the find-file historyTinyTools – JariAalto’s add-on utilitiesScimax - starterkit for Engineers and Scientists DoomEmacs – a configuration framework for GnuEmacs focused on stability and being lightweightExample ConfigurationsSee the example configurations for a list of existing users’ Emacs setups.See alsoCategoryPersistenceDotEmacsDotDDumpingEmacsEmacsNiftyTricksLearnEmacsLispSessionManagementStarterKits"
year_published = 2022
clearnet = "https://www.emacswiki.org/emacs/CategoryDotEmacs"
