["https://www.emacswiki.org/emacs/CategoryChatClient"]
title = "EmacsWiki: Category Chat Client"
full_description = "Click on the title to search for pages describing chat clients written for Emacs.IRCInternetRelayChat clients ZenIRC – old but still popularERC – the fantastic ERC, which is included with Emacs since v22rcirc – the sane alternative, which is also included with Emacs since v22Circe – the saner alternativeRiece http://www.nongnu.org/riece/ – Another alternativeBitlBee can be used as an IRC gateway to instant messaging services (AIM, ICQ, MSN)There is also an IRC bouncer, a proxy, to make your IRC connections persistent:ShoesOff - IRC bouncer in EmacsInstant MessagingMatrix protocol clientsEment.el: the standard Matrix client for Emacs.Emacs Maelstrom (Savannah): an old prototype client.Chat rooms at matrix.org#emacs:matrix.org: the main Emacs discussion#emacs-space:matrix.org: list of related chat roomsJabber clientsGajim – Some function to be able to talk with Gajim from Emacs.JabberEl – The Jabber client which appears to be the most up-to-date.GoogleTalk – How to connect to Google Talk using JabberElSmyrnoJabberClient – A Jabber client which was not finished, but still has source available.EmacsJab – An old Jabber client which has apparently been abandoned completely.EmacsMessenger – an MSN clientTNT – an AIM clienthttp://emchat.org/ - (S)XEmacs only IM client. “EMchat is an instant messaging client written entirely in elisp (emacs lisp). It currently only supports the ICQ protocol, but more protocols like Jabber are planned for the future”Yahoo! clientsElGyach – Yahoo! Chat clientYodEl – another Yahoo! clientELIM – an elisp instant messenger daemon that uses libpurple (and ∴ supports Jabber, MSN, Yahoo et al).Garak: the reference IM client based on elim. Included in the elim tarball.Telega a Telegram clientOtherEmacsTalk – open frames on other people’s displayETalk – an interface to the various flavours of the unix ‘talk’Lispy – a client for <Mtp> Chat servers(rather old) RecommendationsI can’t get any of these to work - I think ejab is a firewall issue, but I’m not sure how to determine that.Ok, the greatest thing I’ve used so far is ERC on BitlBee. That just makes everything else so easy 😊 JorgenSchaeferEicq authors says that it only support ICQ protocol v5, which is not supported anymore by mirabilis … crap. BenjaminDrieuEicq is back! It has basic support for the current ICQ protocol. login|out send|recv normal messages is working. More to come. See http://www.eicq.org/ SteveYoungsEicq is now called EMchat. http://emchat.org/ERC is a great client, and it will do almost anything for you. Also, great help on using it is available on #emacs @ irc.freenode.net TerryPatcherYodEl is brilliant too! I can now chat in text from my emacs buffer from the terminal on NetBSD. The linux emulation library was dumping core. So happy day is today. 😊 Cherry JabberEl works brilliantly nowadays. It has quite a lot of features and Magnus adopts many of the ideas people suggest. I use it as my primary IM-client for chatting with people on Jabber-, ICQ- and MSN-networks."
year_published = 2025
clearnet = "https://www.emacswiki.org/emacs/CategoryChatClient"
