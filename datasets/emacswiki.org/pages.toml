["https://www.emacswiki.org/emacs/%E7%B6%B2%E7%AB%99%E5%9C%B0%E5%9C%96"]
title = "EmacsWiki: 網站地圖"
full_description = "Deutsch | English | Español | Français | Português | Русский | 简体中文 | 繁體中文 | Svenska | 日本語 | 한국어 | Italiano | УкраїнськаEmacsWiki 致力于发展 EmacsAndXEmacs 还有 EmacsLisp.……参考 MissionStatement 以取得更多信息。任何人都可以提出贡献。请自由地加入新的內容和修改已有的文档。请参考HowTo 以取得更多信息。讨论中文翻译 – 请先阅读 翻译固然重要，针对中文世界的本地化原创wiki文档对 emacs 的普及也不可少。欢迎您针对中文用户所做的贡献。使用 Emacs Wiki你可以这样做: HowTo 怎样作– 怎样编辑Wiki; Wikis的主要内容SandBox – 在沙盒中试验, 了解怎样编辑WikiElispArea – 下载和上传Emacs Lisp (elisp)文件 其他可以做的:DownloadPartOfWiki – 应用‘wget’下载小部分的Emacs Wiki,Download the Entire Emacs Wiki 作为一个大HTML档案下载全部Emacs Wiki– 也许你’不想’这么作. 如果你的浏览器支持，文件将在服务器上压缩，否则此档案容量将达到3.5MB左右. 下载和安装 EmacsCategoryPorts – NT, Mac, GNU/Linux 包括 Debian, BSDCategoryWThirtyTwo －－ w32 特定主题学习 EmacsEmacs初学者 －－ 如果你完全是个新手的话分类－说明 －－ Emacs 或 Emacs 使用者的线上说明，辞汇，问题等分类－文件 －－ Emacs 本身就有很丰富的文件而且可从中获得帮助分类－历史 －－ Emacs 是怎么开发出来的中文Emacs网站 – 中文Emacs网络资源Emacs 中的基本文字编辑CategoryFilling －－自动换行CategoryIndentation －－控制文字或程式的缩进(indented)功能CategoryParentheses －－ matching them, changing themCategoryRegexp 分类－正则表示式 －－搜索和取代等…CategoryRegion 分类－块操作 －－选区的操作CategoryOutline －－隐藏一部分的缓存，使用 outlining 或是折叠起来 (OutlineMode 中文)CategoryEditing －－令你更有效地编辑的好主意CategoryHideStuff －－隐藏缓存的任意部分CategoryFiles －－本地文档，远程文档，备份CategoryCommands －－ M-x 指令，指令的历史记录，开档CategoryBufferSwitching －－如何在缓存(buffer)中切换CategoryTemplates – 模板，表单等使用编辑和操控各种文件格式和档案形态的特殊模式(mode)CategoryHypermedia －－ HTML, Wikis, Info分类－XML －－ XML 相关技术分类 - SQL －－ SQL 相关技术CategoryTex －－ TeX 和 LaTeX 资料CategoryModes – 其他模式的提示，文档和扩展插件CategoryVocab – 学习新单词CategoryDirectories – 目录操作(Dired)其他特殊的功能; 和调用外部程序和远程操作CategoryCalculators －－图表，计算器类CategoryCalendar －－日历，日记，行程表CategoryTodo －－维护 todo 列表CategoryChatClient – 聊天社交类CategoryGames – 游戏类分类－介面 – 一些线上工具的 Emacs 介面CategoryProgrammerUtils 分类-编程工具－－编程的好工具，如：源码浏览器等CategoryRemoteEmacs －－远程运行 EmacsCategoryExternalUtilities – 在 Emacs 中调用外部程序CategoryMail －－简单的邮件处理程序，和 Gnus 无关分類－Gnus －－強大的新闻组和邮件处理程序CategoryBbdb – Big Brother Database: 维护电话簿，邮件地址簿等CategoryVersionControl －－ 版本控制系统软件的集成CategoryJournaling – Emacs 之 web logs 介绍让 Emacs 适应你的环境CategoryKeys – 设定您的快捷键；可用性CategoryDotEmacs – .emacs文件配置建议(ELisp新手专用)CategoryProgramming – 编程相关的配置CategoryFaces – 语法高亮/配色/字体相关CategoryDisplay – 和显示相关的东西(X-Window pointer shapes, frames, …)CategoryInternationalization – Emacs 软件的国际化（包括中文化）。CategoryPaths – 合并操作系统的路径和Emacs的路径。修改 Emacs 的方法：Elisp 编程，研究(hacking) Emacs 的源码CategoryCode – stuff for Elisp authorsCategoryDebug – 如何调试EmacsCategoryEshell – 一个完全由 elisp 实现的 shellCategoryBuilding – 如何由源码编译 Emacs CategoryPatches – Emacs 的补丁，主要针对 C 一级的扩展CategoryExtensionLanguage – alternatives to EmacsLisp: Guile, Erlang, Python, …CategoryBiDi – introduction to adding bidirectional input and output to EmacsEmacs 使用者社群CategoryHomepage －－ 使用 Emacs 的朋友们的主页CategoryHumor – what we do when we are not customizing EmacsCategoryForum – 关于Emacs的论坛中文 Emacs 爱好者交流 QQ 群: 59134186Emacs Wiki 讨论EmacsChannel －－ 我们整天挂的 IRC 频道SiteMapDiscussion – the categories on this wiki and other stuff to put on the main pageMeatBall:EmacsWiki – 涉及wiki技术，组织，安全等.檔案ElispArea －－上傳和下載 elisp 檔案Emacs Bugs，期望功能EmacsBugsWishList維護、统計和下載All Pages 包括頁面數Random Page 是個開始閱讀和改進頁面的好地方External LinksRemove edit lock after a crashStart maintenance jobCheck script versionDownload the page database (任何人都可以幫忙備份)Usage Statistics (and OldStats)听起来像个好主意！人们尝试了许多方法试图汇集Emacs有关的各种智慧，可事实表明所有这些尝试都不能令人满意。当Wiki的构建和评论达到一定的数量后，这或许是一条可行的道路… …This sounds like an interesting idea! People have tried lots of different ways to bring together all of the Emacs wisdom out there, but the fact that people keep trying proves that nothing truly satisfactory has emerged. With the right amount of structure and overview, maybe a Wiki is the way to go… – JohnWiegley"
