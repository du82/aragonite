["https://www.emacswiki.org/emacs/Alex_Schroeder"]
title = "EmacsWiki: Alex Schroeder"
full_description = "I’m an editor of the EmacsWiki. I invite all Emacs and XEmacs users to take up editing responsibilities as well. All you need to do is edit new pages, correct typos, add categories, rework pages. A good rule of thumb I try to follow is to make all pages potential sections in a printed book or info manual.I usually don’t sign my contributions because I think that encourages other people to rework the page. Signing contributions would not make sense in a traditional book, either.You can contact me using mail.I use Emacs. I am an EFF Member, joined 2006-03-14. It’s sad how I need to support foreign NGOs because policy in the USA and the EU will end up affecting me whether I like it or not. I used to be a FSF Member (joined 2003-03-06, left in 2021), and I used to be a FSFE Member (joined 2005-05-22, left in 2021). These days I’m first and foremost a member of Digitale Gesellschaft.ContactBlogEmacs ScreenshotOddmuse is the wiki engine used for this wikiIf you think that Emacs Wiki is a mess and needs to be based on a different technology, feel free to read a blog post of mine, How Emacs Wiki Works.I am also known as kensanata on IRC. “Kensanata” doesn’t mean anything. It was the name of my character when I started playing PBEM games. I started my first homepage for this game on Geocities and needed an account name. I chose a name related to the game. And since Geocities and Yahoo and AOL started to cooperate, “kensanata” turned out to be the name of my Yahoo mailbox and my AIM handle. Later, I also used it on ICQ. And now I’m using it on IRC.Init filesprivate laptopwork laptopRSIRepeatedStrainInjury – saw a doctor, started physiotherapy on 2002-02-05. I bought a Kinesis keyboard. I used little programs that forced me to take a lot of breaks. It didn’t help. I stopped therapy 2002-10-21 and decided to work less, get up more often, started practicing Aikido, and no longer work in long shifts. That helped. Watch your hands.SnippetsSwiss German Hunspell on Windows using MSYS2Dictionary Server on Windows using WSLCategoryHomepage"
year_published = 2023
