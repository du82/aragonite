["https://www.emacswiki.org/emacs/CategoryExternalUtilities"]
title = "EmacsWiki: Category External Utilities"
full_description = "Click on the title to find all pages related to the use of external utilities such as music players.If the external utilities are used for the following purposes, refer to the specified page instead:when programming, CategoryProgrammerUtilsto search text, CategoryRegexpto edit remote files (ftp, scp, etc.), CategoryFilesin a W32 context only, CategoryWThirtyTwoUsing Emacs clients as external editors in other applications:EmacsClient – remote control GNU Emacs from the shell, e.g. edit files from your external mail client using an already running Emacs. It ships with GNU Emacs and does not work for XEmacs. Since GNU Emacs version 22.1 it also works on “Windows”.GnuClient – does basically the same as EmacsClient. It comes with XEmacs but works for both.EditWithViOrEmacs – a re-implementation of emacsclient in Perl; the only difference is that it execs “vi” if there isn’t already an emacsserver running.ScreenServer – automatically attaches to an Emacs running inside GNU screen.The reverse, use external applications from within Emacs. Note that only OrgMode currently tries to handle this in the best possible way for each platform. Most of the others simply uses start-process. If you do that on w32 you will have to enter the application path yourself. This is an unnecessary trouble. (I guess there are similar capabilities of other OS:es but I do not know for sure.)ExtView – open files with external viewer (orphaned)MsShellExecute – take advantage of MS Windows file associationsOrgMode which is part of Emacs also has this functionality implemented in a cross-platform manner. I would suggest that functionality of this kind use that implementation (and maybe extend it). Then the user would just need to customize it in one place.TrivialMode – register applications to open files for youThese work everywhere (find-file, DiredMode, etc):Bookmark+ + w32-browser.el – open/cycle bookmarked files (e.g. music, images) using MS Windows file associationsDired+ + w32-browser.el – use Windows file associations in DiredOpenWith – open files with external applications.SexMode – It is now using the platorm independent functionality offered by OrgMode for starting external applications. (Note that there are some differences, see the beginning of sex-mode.el.)Runner – link a set of shell commands to file and directory names while in Dired. These commands can then be run using ‘dired-do-shell-command’ (or pressing “!”).Sound and Music:EcasoundMode – interfacing with ecasoundErecMode – record and play back soundMusicPlayers – interfaces to music playersNetworking:RainOrShine – integrate weather information from the InternetMlDonkey – an EmacsLisp interface to the famous p2p clientemacs-w3m – w3m is a text browserPuTTY – free SSH client that’s Emacsen-friendly.SshWithEmacsRloginMode — Use and customize Rlogin mode which is built into Emacs to login to other systemsFilters – making things readable:AntiWord – Run antiword command on Word-doc files to read them as text.ChmView – View .chm files in Emacs.Irfc – View RFC files in Emacs.UnDoc – transform .doc files to plain text when opening themUnPdf – view .pdf files as text using pdftotextUnXls – view .xls files as text using xmhtml and w3mPrinting:PrintingFromEmacs – Printing features of Emacs.CupsInEmacs – print with CUPSPsPrint – print with a PostScript printerPrintWithWebBrowser - preview and print with your web browserCommand-line tools:EevMode – E-scipts, texts contain shell commands and hyperlinksGrepMode – using grep and igrepLocateFilesAnywhere – interfaces to the GNU/Linux or Unix ‘locate’ commandManMode – reading man pages within EmacsWomanMode – reading man pages “w/o man”TailEl – using tail within EmacsDfMode – show space left on devices in the mode line TopMode – run “top” from EmacsExecuteExternalCommand – call a shell command from emacsEukleidesMode – Full featured major mode to edit eukleides filesFiglet – Emacs interfaces to the Figlet program, which converts ordinary text to larger text using other characters in monospaced fontsSdcv – A interface for sdcv (StarDict console version).CheatFuMode – cheat_fu modeQuickRun – Run editing buffer and show its output quickly.AWK It – interactively run AWK on region.Unclassified:DictMode – Interface with a dictd server. Also see CategoryEducation for more similar packages.LookUp – an integrated search interface with electronic dictionariesPersistentProcesses: Keeping apps (especially web browsers) alive after exiting emacsSameMode – searching for duplicate lines in multiple filesSystemApropos – interface for the program aproposViewProcess – advanced interface for psOnScreenDisplay – interfaces with the X OSD Library through the `osd_cat’ utilityBibus – a reference manager in emacsVerbisteEl – conjugate/deconjugate French verbs"
year_published = 2022
clearnet = "https://www.emacswiki.org/emacs/CategoryExternalUtilities"
