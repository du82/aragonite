["https://www.emacswiki.org/emacs/CategoryBufferSwitching"]
title = "EmacsWiki: Category Buffer Switching"
full_description = "This page is about different libraries and ways to switch buffers. As always, you can click the title heading to list all pages related to buffer switching.SwitchingBuffers – Discussion comparing the various packages.ControlTABbufferCycling – methods which use or are similar to a most recently used stack of buffers, like MS Windows alt-tabThe following are specific tricks and packages for buffer switching.Anything – can be used to switch to a bufferBubbleBuffer - Similar to CycleBuffer, QuickBufferCycle, etc.BufferMenu – Like Dired, but for buffers – same thing as ListBuffers, but lets you also act on the buffersBufferMenuPlus – BufferMenu and ListBuffers enhancementsBufferQuickSwitcher – Another way to switch buffersBufferRing – simpler MTorus like ringsBufferSelection – BufferMenu alternativeCategorizingInformationManager – ‘ee-buffers’ for buffer switchingcOpenRelational – keeping in touch between header file and source file for C or C++CycleBuffer – switch to next/previous significant bufferDoReMi – ‘doremi-buffers’ (‘C-x t b’): cycle among buffersEasyBufferSwitch – A combination of number-indexed switch and cycle switchElectricBufferList – BufferMenu alternativeFindHeaderFile – open C/C++ header file on current lineFindOtherFile – GNU Emacs has this built-in capability for finding related files (e.g. C/C++ header files)FrameBufs – BufferMenu and ListBuffers enhancements for frame-relative buffer listsIbufferMode – BufferMenu alternativeIcicles – switch among buffers – cycling and enhanced completion. Perform actions on selected buffers or sets of buffers.iflipb – interactively flip between recently visited buffersInteractivelyDoThings – Same as IswitchBuffers, for buffers, but also affects file accessIswitchBuffers – choose buffer without a menu (name-based)Lisp:contentswitch.el]] – switch buffers by their contentLisp:jump-or-exec.el]] – Jump to a buffer matched by buffer name, or call function when not found. See also jump-or-exec from sawfish.ListBuffers – List buffers (default behavior for ‘C-x C-b’)LustyExplorer – Dynamic filesystem explorer and buffer switcherMTorus – provides navigation on a discrete 2-torus of buffersPerWindowPoint – Enable each window to remember and return to its value of point in each buffer it has displayed.PinBar – create tabs at the top and switch associated buffers with a single strokePointStack – go back to places in buffers that you’ve markedQuick Buffer Switch – Switch to buffer using intelligent predicates.QuickBufferCycle – Quickly switch to the previous buffer or the Nth previous one by pressing the same key repeatedly.RecreateScratchBuffer – when *scratch* disappearsShortList – an efficient way to access a short list of buffersSwBuff – another way to cycle among buffersTabBarMode – buffer tabs using arrow keys and/or mouse wheel"
year_published = 2022
clearnet = "https://www.emacswiki.org/emacs/CategoryBufferSwitching"
