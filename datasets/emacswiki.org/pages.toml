["https://www.emacswiki.org/emacs/News"]
title = "EmacsWiki: News"
full_description = "2025-02-19 The bots have been at it again! For a while, load hovered around 80 to 110. I switched off the site for a few hours. Right now it’s back up and some expensive requests that the bots like to use redirects to /nobots. If this happens more than two times, fail2ban should ban the IP number for ten minutes. If this happens more than three times, fail2ban should ban the IP number for a week. Sadly, fail2ban doesn’t ban the entire network, so all those rented machines the AI bros use to ingest the training data from sites like this one don’t all get banned. Oh well. For the moment it’s yet another band aid. Another cost they successfully offloaded to the human sysadmins out there. I can’t begin to tell you how much I hate these large language model fuckers. I can spend more time optimizing my site or my software for them. Change the architecture of the software that served me well for more than twenty years, for them. Pay more money for RAM and start adding more caches, for them. All to serve them the texts we wrote for each other, not for them. — Alex SchroederComments on this page 2025-01-24Sadly, I’m fighting bots again. The site was mostly unreachable for a day or more. Here’s a Munin graph of server load for a week. Normal load is between 0.5 and 1.0. The server has two virtual cores, so a load of up to 2.0 means happy happy. A load of nearly 40 means sad faces at Casa Emacs Wiki. There’s more on my blog for the curious. – Alex Schroeder😩– MaDaComments on this page 2024-09-16I spent more than an hour trying to figure out why my server had a load of nearly 40. All I discovered is that load went down when I shut down Emacs Wiki. Well, I needed to sleep and I‘ve got plans for the next few days so I shut it down while I slept hoping that the misconfigured spider is fixed or the inept programmer discovers their mistake. Just another day in the Butlerian Jihad. Some misguided soul probably wanted to download it all and wrote a broken web crawler and when that got blocked they bought some nice scaling infrastructure from Amazon, Hentzner, OHV or Alibaba Cloud or whatever they are called, allowing them to use a gazillion different IP numbers that will eventually lead me to implement some sort of cloud service provider block. – AlexSwitched Emacs Wiki back on after a few hours of sleep and it did fine. But then it restarted again… at 18:00, 19:00, 21:00, 22:00… and so I have switched Emacs Wiki off again. Time to ban some networks!Anybody interested in my banning of IP ranges and possibly interested in me reverting any of these, take a look at ban-cidr … from a network that isn’t banned, I guess. 😏2024-09-17. This continues to keep me busy and angry every evening. Too bad I don’t have a real fast network-lookup to firewall ban pipeline.In any case, I added over a hundred Chinese networks to the firewall rules and I’m seriously considering blocking the whole country for a week. It seems that most of the offenders are networks run by China Telecoms and China Mobile.2024-09-18. So far, so good. Load stays below two. e3d3 last week I added emacswiki to my newsfeed by using openrss.org. When reading this post I was worried that this caused the disturbance, although I expected it to refresh the feeds twice a day. I don’t know much about networking and to be sure I removed the feed, at 20240916 at 18:00 hour, plus minus 5-10 minutes. Later I became a little paranoid that I had caused it by using the “random page” link too often (20-30 times). Wish I could help more. You can find me sometimes on #emacs and leave a message there if you want to contact me. Wish you good Luck, and a good mood. Best regards. No worries. These are badly programmed crawlers that will visit every single old revision of a page, download the individual feeds for every page, and so on. They have no concept of what is important and what is not. – AlexComments on this page"
year_published = 2019
clearnet = "https://www.emacswiki.org/emacs/News"
