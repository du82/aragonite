["https://www.emacswiki.org/emacs/CategoryCompletion"]
title = "EmacsWiki: Category Completion"
full_description = "Click the heading to search for pages in this category.The scope for this page encompasses any wiki page that relates in any way to Emacs completion. For discussion, see DiscussionCategoryCompletion. OverviewCompletion can mean different things in Emacs. In particular, it refers to MinibufferCompletion, completing input in the minibuffer. Minibuffer input can be a command that you enter using ‘M-x’ or text that you enter in response to a prompt in the minibuffer. File-name input is an example of the latter.BufferTextCompletion, completing text in a buffer other than the minibuffer.Besides the question of where text is completed (minibuffer or other buffer) is the question of how. Completion can be effected in various ways (e.g. using different kinds of matching, filtering, sorting), and it can be accomplished using various user interfaces (e.g. popup selection list/menu). Other CompletionSome completions are available in modes that provide command interaction.EshellCompletion – Input filename completion.SubprocessCompletion – Handling completion by a subprocess such as a shell or a debugger, rather than by Emacs.CSense – Completion extension.irony-mode – Completion based on clangClang – Completion extension based on Clang.function-args – C++ completion extension for CEDET.SiteMap"
year_published = 2024
clearnet = "https://www.emacswiki.org/emacs/CategoryCompletion"
