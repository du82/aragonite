["https://www.emacswiki.org/emacs/CategoryFaces"]
title = "EmacsWiki: Category Faces"
full_description = "Click the title to search for all pages belonging to the Faces category.See also CategoryFrames and CategoryDisplay for info on fonts and things related to the display.Here are some of the pages in CategoryFaces.AngryFruitSalad – Get more modest font-lock faces (i.e. colorization)AnsiColor – have Emacs interpret nasty escape sequences from subprocesses such as shellsAnSys – make Emacs highlight your Ansys-FilesBufferBackgroundColor – a temporary solution for buffer background colorColorIdentifiersMode – use colors to highlight identifiers (variables and the like) instead of keywords (if, then, else, and the like)ColorPalette – examine or modify colors in various ways, including by name, RGB, and HSVColorTheme – a package with dozens of color themes to choose fromColorThemeCollection – a place for new color themesColorThemeAhei – ahei’s color themeColorsAndKde – sometimes changing the colors within Emacs has no effect if you are using KDECursorOnLinuxConsole – how to modifiy the TextCursor on the Linux consoleCustomizingFaces – how to customize facesDefineFaceConstant – a macro for defining faces (and associated variables) easilyDoReMi – WYSIWYG commands to incrementally change face colors (foreground & background) on the fly, using the arrow keys or mouse wheel to modify color components: red, green, blue, hue, saturation, value, cyan, magenta, or yellow (RGB, HSV, CMY) – see Lisp:doremi-frm.elEcholine – a minor mode for octave which highlights “echoing” lines that does not end with a “;” or that do not cause echo such as “plot” or “figure”FaceList – listing all the faces currently definedFaceMenuPlus – extensions to menu Text Properties and the ‘*Faces*’ display (‘list-faces-display’). Click some text that has a face, then change its colors in various ways (color palette, incrementally with the arrow keys or mouse wheel,…). Select some text, then choose a face to apply to it, by appearance (not just name). More…FacesForDifferentBackgroundsFacesPerBufferFacesPerWindowFacesPerFrameFontLockMode – Syntax highlighting.AddKeywords – how to add simple keywords to an existing modeEnablingFontLock – aka TurnOnTheColors – global syntax hilightingFontLockForNewModesFontLockKeywords – how to write complex font lock expressionsFontLockSpeedHighlightTemporarily – How to highlight and unhighlight regexps, regions, characters…HighLight – Highlight regexp matches in the region or a buffer; highlight the region; highlight by dragging the mouse as a highlighter (marker pen); ‘face’ and ‘mouse-face’ highlighting; use any faces to highlight.Highlight Characters – Highlight any sets of characters (including different kinds of whitespace).HiLock – Highlight regexp matches or phrases.MarkerPens – Highlight as if using a highlighter pen.Icicles – Highlight regexp matches: `C-.’ during Icicles search toggles leaving search highlighting on. Highlight multiple-regexp matches in multiple buffers, files,…MousePlus – Highlight the yank position momentarily while you press ‘mouse-2’, so you hit exactly the right spot.HighlightCurrentLineHighlightCurrentColumnHighlightSexp – highlight the s-exp at pointCrosshairHighlighting – highlight the current line and column: track the TextCursor or highlight momentarilyHighlightEndOfBufferHighlightSymbol – Highlight the current symbol throughout the bufferHighlightParentheses – Highlight parentheses surrounding pointIdleHighlight highlights all occurrences in the buffer of the word under the pointPulseRegion - Fancy temporary pulsing of the regionOnScreen - Highlight the last visible screenful when scrollingHowtoChangeFrameColorsIcicles - Search for Properties – Search for text that has certain overlay or text properties; navigate among zones of text with faces.ListColors – Show colors having defined color names.MakeColor – Alternative way of “picking” a color: change the color in context.PointerShape – Change the shape of the MousePointer (X Windows only).SetFonts – Change font or font size; install fonts.AntiAliasedFacesChangeFontsPermanentlyOnWindowsCycleFontSizes‘doremi-font’ in library Lisp:doremi-frm.el, to cycle fonts‘icicle-font’ in Icicles to cycle fonts, with CompletionMenuFontProportionalFontsWin32FontsShowWhiteSpace – Highlight various kinds of whitespaceStippleAttributeTemporaryFacesTextProperties – Properties, including ‘face’, that you can attach to text in a buffer or a string.VisibleMark – Make the mark visibleXfacesSupport for Emacs 20XTermColors – Use 256 colors with xterm.SwitchColorThemeMatlabLatex – Switch between a dark theme and a bright theme simulating the visual effect of the matlab programming environment.WikiTodo: If too many pages relate to display and frames, perhaps it would be more appropriate to put them into a separate category, or a subcategory. See FrameModes for frame configurations, functions, and commands.Preserving face information when saving:EnrichedMode – save files with special tags such that Emacs will regenerate the faces used in the text (used for plain text files with markup added by the user, not by FontLock!)Htmlize, SaveAsHtml, HtmlFontify – save files in HTML formatHowtoPrimitivelySerializeAndRestoreTextProperties"
year_published = 2014
clearnet = "https://www.emacswiki.org/emacs/CategoryFaces"
