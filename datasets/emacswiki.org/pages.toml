["https://www.emacswiki.org/emacs/CategoryExtensionLanguage"]
title = "EmacsWiki: Category Extension Language"
full_description = "just trying to wrestle meme-dominance from the language-headz on this channel!kensanata on #emacsClick on the header to list all pages discussing alternative extension languages. Emacs and XEmacs are the most popular Lisp engines. As new interpreted languages develop, however, EmacsLisp need not remain the only choice. See ExtensionLanguageAdvocacy for some ranting. ;)For an interesting view about extension languages, take a view of Comparing Different Strategies for Adding Scripting to an Application, especially the last comment.ErlangEmacs – uses ErlangGuileEmacs – uses Guile (Scheme) and LispJavaEmacs – implemented in Kawa, thus uses Scheme and JavaPyMacs – use Python in an external processEmacsLispForRuby – (el4r) use Ruby in an external processEmacsEpl – the Perl module Emacs::EPL to use Perl in an external processPerlMacs – uses Perl and Lisp (superceded by EPL)CommonLispEmacs – uses CommonLisp (not yet usable)EmacsCommonLisp – an EmacsLisp library that makes GNU Emacs and XEmacs understand CommonLispEdWin – uses scheme and is written in MitSlashGnuSchemeEmacsObjectOrientedProgrammingSystem – implements a Smalltalk-80-like language in GNU EmacsLispZile – uses Lua, in previous versions used Zile LispZileOnGuile - Proof of concept hack of C based Zile with Guile supporthttps://github.com/knupfer/haskell-emacs – Haskellhttps://github.com/janestreet/ecaml – OCamlNot Emacs but what can we say:TeXmacs – uses Guile (Scheme)EfunsEditor – a small text editor, entirely written in ObjectiveCamlMicroEmacs – also small, Linus uses it, it does have a proprietary extension languageSee also EmacsImplementations.Perhaps a section on AddingExtensionLanguages would be good?Perhaps an example of how to use other languages via syscalls/file-exec from elisp (or inferior-modes like SLIME etc do) would be more purposeful. It does not really make sense to mix several languages in a VM which is targeted and tailored towards (E)Lisp symbols and objects. Using im-/export filters would be quite a massive undertaking, so simply using external calls which pull the results into ELisp code would be the elegant way to go. Otherwise, you sooner or later end up crippling Emacs’s power and versatility by interfacing into dozens of other languages via APIs. Just saying.CategoryCode"
year_published = 2022
