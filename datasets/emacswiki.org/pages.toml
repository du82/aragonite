["https://www.emacswiki.org/emacs/CategoryDirectories"]
title = "EmacsWiki: Category Directories"
full_description = 'Click the heading to search for all pages related to manipulating files and directories.DiredMode is the standard Emacs mode for manipulating files and directories – the Emacs file manager.Bookmark+ – Dired “views” (states) as bookmarks. Open sets of file bookmarks in Dired.DiMode – Simple directory editor for Emacs.Dired+ – Many Dired extensions.‘dired-virtual’ command from DiredX.Diredful - colorful file names in dired buffers.DiredLaunch – simple launching from dired [1]DiredSync – Synchronize directories within dired.EshellRead directories. See option ‘eshell-ls-use-in-dired’.‘eshell-ls-use-in-dired’ – change em-ls.el to narrow the listing ;; starting at line 459: (format "%s" (or (nth 8 attrs) "??????????") ;; (or (nth 1 attrs) 0) ;; (or (let ((user (nth 2 attrs))) ;; (and (not numeric-uid-gid) ;; user ;; (eshell-substring ;; (if (numberp user) ;; (user-login-name user) ;; user) 8))) ;; (nth 2 attrs) ;; "") ;; (or (let ((group (nth 3 attrs))) ;; (and (not numeric-uid-gid) ;; group ;; (eshell-substring ;; (if (numberp group) ;; (eshell-group-name group) ;; group) 8))) ;; (nth 3 attrs) ;; "") )FileSets – Persistent sets of files under given directoriesIcicles – Access files and directories using completion and cycling. Act on (e.g. delete) files whose names match a regexp.Anything – Access files and directories and much moreImage directories with thumbnailsThumbsModeTummeLsLisp – ‘ls’ implemented in Emacs LispNav – a lightweight solution for Emacs users who want something like TextMate’s file browser, or the Eclipse project view [2]Norton Commander and Midnight Commander clones written for emacs:MidnightCommanderModeNortonCommanderModeSunrise Commander – also based on dired, but with many more features than mc.el and heavily influenced by the Orthodox File Manager standard.Sunrise Commander For NoobsRunner – Associate a file with a set of commands or external apps.SystemTrash - Set up emacs to use the same trash can as GNOME and KDE (the freedesktop.org trash spec)smarterNavigatingBufferLimits – “Smarter” ‘beginning-of-buffer’ & ‘end-of-buffer’ variants for diredTry C-h v directory-abbrev-alist RET for information on an elegant way to shorten your paths. Suppose you’d like long paths like /opt/some/software/project/source/file.c to be shortened to /proj/source/file.c. The solution would be setting an appropriate symlink named proj in your root directory and adding the following to your InitFile: (setq directory-abbrev-alist ‘(”^/opt/some/software/project" . "/proj”))dir-list – quickly open your frequently accessed directory or file from a configured directory/file list Concerning directory-abbrev-alist: If there is a symbolic link in the file system, why do we need this translation table, should it not work even without it? Concerning directory-abbrev-alist: Can it somehow be used on Windows XP (no symlinks)? Some of these packages, including lslisp, do not seem to be in xemacs 21.4.17, at least. those of us trying to find a way to do --time-style = iso in xemacs find ourselves stymied by the way the dired code handles switches. is xemacs on the way out, at least for dired? – gambarimasu'
year_published = 2024
clearnet = "https://www.emacswiki.org/emacs/CategoryDirectories"
