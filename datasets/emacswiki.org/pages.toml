["https://www.emacswiki.org/emacs/CategoryEditing"]
title = "EmacsWiki: Category Editing"
full_description = "Click the heading to list pages in this category. This category is about editing, not modes. See CategoryModes, instead.Moving textMoveLine – Moving the current lineMoveRegion – Moving a regionMoveLineRegion – Indifferently move the current line or regionmove-lines – Indifferently move the current line or the lines surrounding region (like Eclipse)MoViMentMode – A minor mode for easier cursor movementKilling, yanking, copying and deleting:AproposUnicode – Copy Unicode characters to the kill ring or the SecondarySelectionCopyFromAbove – Copy line or characters from previous lineCopyWithoutSelection – simply copy current line, current word and current paragraph to the kill ring without selecting each line, word or paragraphCopyingWholeLines – Copying whole linesDeleteKillAndCopy – take any motion command and prepend it with a suitable key to delete, kill or copy the text passed overDeleteSelectionMode – type to replace the current selection (or backspace to delete it)DeletingSyntax – an alternative to killing by wordsDeletingWhitespace – delete extra whitespaceKillOrCopyToIsearch – Kill or copy from point up to where you are Isearching LineCopyChar – Copy character(s) from the line before or after to the current line.Lisp:savekill.el – Save kill-ring immediately and restore to protect from emacs crash.Motion/kill do-what-I-mean – cursor movement and killing DWIM functions. Lisp:motion-and-kill-dwim.elMousePlus – highlight the yank position while you press ‘mouse-2’, so you hit the right spotRectangleCommands – commands that operate across lines in a region in a column-intelligent manner.Lisp:view-kill.el – Displays the entire kill ring as a single page menu of numbered items.WholeLineOrRegion – operate on current line if region is undefinedZapToChar – Delete the characters from point to a character you specify.KillMatchingLines – The power of ‘M-x flush-lines’ with killing.Anything – ‘M-x anything-show-kill-ring’ narrows the kill-ring by multiple patterns.MRU-yank – maintain kill ring as MRU (Most Recently Used) stack. Similar to the application stack (M-tab) on MS Windowsduplicate-previous/next-line lets you replace current line with a neighboring one by cycling through them like you can with history in Bash. I bind them to M-n and M-p. Lisp:duplicate-line.elSee also CategoryRegionRegisters:RegAdhoc – automatically add registers and show their destinationsBetterRegisters – register enhancements, keyboard macrosUnifyKillringAndRegister – make registers easy to useRegisterChannel – move around like switching TV channelsCursor indicationChangingCursorDynamically – change cursor type and color, depending on contextCrosshairHighlighting – highlight the current line and column; track cursor or show cross hairs momentarily.HighlightCurrentLine – highlight the line of the cursorHighlightCurrentColumn – highlight the column of the cursorColumn indication and finding long lines:ModeLine, ModeLinePosition – current-column in mode line; highlight when too largeRulerMode – a minor mode showing a ruler with columns, tab stops and morePopupRuler – temporarily displays a column ruler just above pointColumnEnforceMode – a minor mode for highlighting text that extends past a certain column limit.ColumnMarker – displays semi-permanent column markersHighlightCurrentColumn – highlight the column of the cursorFindLongLines – commands to find long linesNumbering:RenumberList – renumber your numbered listsReplaceRegexp – renumber lists using regular expressions, emacs >= 22ReplaceCount – renumber lists using regular expressions, emacs < 22IncrementNumber – sometimes useful while using keyboard macrosNumberLines – put line numbers in source code – useful with LaTeXLineNumbers – display line numbers (without changing the text)Text tricks:FormattingText – automagically format textRotateText – rotate a buffer string, replacing it by each of a series of predefined replacements, in turn.SwappingText – swap regions of textAlignCommands – align text with respect to spaces, assignments or regexpColumnizeWords – format a list of words or quoted strings into columnsDoubledWords – find and delete doubled wordsDuplicateLines – find and delete duplicate linesReverseWords – Reverse the order of words in the region. Words can be on the same line. Does not sort.InsertingTodaysDate – insert today’s date in letters or source codeInsertFileName – have Emacs help insert file name into the bufferParEdit – structured editing of s-expressions (parentheses)RepeatInsert – insert repeating patterns, such as lists of numbersRotateWordCapitalization – rotate the capitalization of the current wordSimplerWordCapitalization – make ‘upcase-word’ (M-u), ‘downcase-word’ (M-l), and ‘capitalize-word’ (M-c) work on regions too.Multiverse – manage multiple versions of buffers in an Emacs sessionSurroundRegion – surround the region with a string such as quotes, begin/end, etc.See also EmacsNiftyTricksLines:LineCommandsRunCommandOverLines – execute a command for several lines, like in ‘ed’ (TheTruePath)EndOfLineTips – How to convert between different system line ending characters.Jumping around, and seeing where you’ve been (See also Category Navigation)MarkCommands – Use of mark and point to jump aroundLisp:hqw-goto.el – A quick way to go to specific window line and position.quick-jump.el – -Remember current position,and jump backBookMarks – Jump to places you have recorded (persistently or not).Bookmark+ – Extensions to standard bookmark features, including VisualStudio-like bookmarksVisibleBookmarks – VisualStudio-like bookmarks for quick in-buffer navigationBreadcrumbForEmacs – Leave breadcrumb bookmarks in the buffers, and jump back to them quickly.Icicles - Tripping – Jump around among various sets of things (projects, files, bookmarks, buffers, markers, Info pages, search hits, windows, frames,…).FastNav – Multiple commands to support quick jump to, replace at, kill at, etc. the next/previous occurences of characters.Text checkingTextLint – check your scientific writing for common style errors.Spelling – spell-checkingGrammar CheckerGrammar Checker – Use Link Grammar as the grammar checker back-end.langtool.el – Use Language Tools as grammar checker back-endCollaborative Editing"
year_published = 2024
