["https://www.emacswiki.org/emacs/Suggestions"]
title = "EmacsWiki: Emacs Wiki Suggestions"
full_description = '''This page is for recording (or discussion) of Suggestions about the EmacsWiki web site.If you want to suggest changes to a particular page, or if you want to suggest a new page, please just do it. You don’t need to create an account to do it.If you want to record or discuss problems with the Web site (not with Emacs), please do so at EmacsWikiProblems.Make sure your suggestion doesn’t exist already or that your question has already been answered by checking the HowTo and WikiQuestions pages, respectively.Discussion about the front page of the Wiki is at SiteMap Discussion.Discussion about the table of contents at the top of each page is at TableOfContentsDiscussion.Discussion about the “Goto Bar”, the links at the top and bottom of each page, is at GotoBarDiscussion.Discussion about the TextFormattingRules used in contributing to pages is at TextFormattingDiscussion.Add your suggestions below this line. Does anyone object to me removing XEmacs references?Hi. The wiki still prominently refers to XEmacs, which is dead. Users aware of the current Emacs landscape get the impression that the wiki is stale. And clueless users might even install XEmacs and be disappointed with the whole Emacs concept. So, does anyone object to me removing as many XEmacs references as my time and energy permit? Thanks for asking before just doing it. Yes, I object.I don’t object to updating such text, to make clear that it describes an Emacs implementation that is no longer under development (and that is used by very few Emacs users).I don’t object to removal of some how-to information that could no longer be used by anyone.The point is that this site is about Emacs, not only GnuEmacs, and the site contains information about the history of Emacs and its different implementations, as well as references to other such info. There’s even a whole category about this (CategoryHistory), and pages about the GNU/XEmacs split (EmacsSchism, EmacsAndXEmacs, EmacsSchismDiscussion).In posing the question, you’d maybe be better off saying also which content you’d like to remove, and if not obvious, say how you think it might mislead readers rather than helping them.Just one opinion. Yeah, it’s a bit like documentation for code that is now obsolete, but if somebody were to search for information about Emacs 19 and MULE, for example, where would they find it? Sure, it’s obsolete, but it’s still interesting. It’s no longer “How To” information, but I’d still like to keep it. Like Drew, I’d love pages to be rewritten such as to clearly state what is and what isn’t obsolete, and I would love long pages containing both obsolete and current information to be split into two pages, with the obsolete stuff being relegated to the Talk page, or to a separate page altogether. As a final consideration, I’d say that rewriting pages such that they are more useful for current users than for future historians is more important. So I wouldn’t spend too much time on making the obsolete material nice to read. All I’m saying is that if at all possible, let’s keep it somewhere. – Alex Schroeder FWIW - I agree with all that Alex has said. – DrewAdamsIs it worth it to create a Category Logging?I am starting to write a few simple log functions (for debugging variables, etc in Emacs), and I have some questions about it, and I saw Log4E Logging For Elisp - does it make sense to have CategoryLogging for these things? – halloleo No, I don’t think so. I added Log4E Logging For Elisp to CategoryDebug. – DrewAdamsRevamp the GnuPlot pagesThe page ‘GnuPlot’ [[1]] gives a good two sentence description of gnuplot. But then everything after is out of date. It used to tell how to get the mode written by (dead link)BruceRavel and a screenshot of the mode.If everything after the first two sentences were replaced with a link to ‘GnuplotModes’ [[2]] that would restore it well. It has updated links to the Mr. Ravel’s mode. It also has links to a second mode.It could also use a link to a third mode, ‘GnuplotMode’ [[3]].Alt key problem when using Compiz in UbuntuIn Ubuntu (at least when using Compiz), the left Alt key brings up a HUD by default. This causes problems when you use left Alt as the meta key. Hence, this problem should go under the GNU/Linux section in the Meta Key Problems article. One solution to this problem is to disable a keyboard shortcut to display the HUD, described here.Camel Case Auto-split Syntax I think a syntax like ^EmacsWiki to automatically generate a link with spacing like Emacs Wiki would improve the overall look of the site quite a bit. On the main navigation bar for example, “Site Map,” “Elisp Area,” and “Recent Changes” would look much nicer.--MikeAbrahams JimThompson I second this suggestion. --JimThompson I wonder whether I understood this correctly. You can always create link to pages containing spaces using double square brackets [[Like This]]. And we should totally encourage people to do that, and to redirect from pages LikeThis to pages [[Like This]]. Are you arguing that typing ^LikeThis is much easier than [[Like This]] or were you unaware of the double square bracket syntax, or did I miss something? – Alex SchroederProvide alternate stylesheetsI would like to choose the stylesheet for EmacsWiki easily. If Emacswiki could provide alternate stylesheets—see Worg—then I will be able to choose the theme using View->Page Style->etc menu in Firefox. – 115.241.16.57 Does CSS correspond to your request? I don’t use alternative stylesheets myself, but last time I tried this (years ago) it seemed to do what you are suggesting.(I’ve updated HowTo to mention page CSS.) – DrewAdamsThis is how the directives on Worg looks like: <link rel="stylesheet" title="Standard" href="/worg/style/worg.css" type="text/css" /> <link rel="alternate stylesheet" title="Zenburn" href="/worg/style/worg-zenburn.css" type="text/css" /> <link rel="alternate stylesheet" title="Classic" href="/worg/style/worg-classic.css" type="text/css" /> <link rel="stylesheet" href="http://orgmode.org/css/lightbox.css" type="text/css" media="screen" />This is how it looks like on EmacsWiki pages <link type="text/css" rel="stylesheet" href="/emacs/wiki.css" />Note the absence of “alternate stylesheet” attributes. I am wondering whether such directives could be added to the site. Given the selection we have on the CSS page, which are the themes you’d like to hard-code as alternatives? – Alex I went through the available stylesheets and moved my favorites to the top. None of them are perfect but several could potentially be fixed into something decent with a bit of tweaking. In my opinion this is a very serious issue. Applying a new CSS theme made the wiki spring to life for me. --MikeAbrahams What do you guys think about updating the default theme of the site? I think it looks really nice with a lighter theme like Cali+ or Wikipedia, but the gray and orange theme is kind of dark. I’m mostly thinking of new users - it took me a couple of years to realize you could change the look of the site, but I’ve really enjoyed visiting here since discovering those other themes. – BrianBurns I’m in favor of trying something new! – AlexSchroederOkay great! I put up an album of screenshots for some themes (just things that I thought might look good as a default theme, and some others) for comparison at http://imgur.com/a/czk9D - I like the lighter themes but they could still use some tweaking - I’d like to try and make one that combinesMade in California (gray links, but larger ‘function references’ text)Cali+ (headings, have section separators but lighter dots, box around table of contents)Planet CSS (code block font, colored syntax highlighting)Wikipedia (large logo on left, maybe try a vertical sidebar)and see how it looks - other suggestions are welcome too. I’ll put the CSS on Github when I get it started - it can be a collaborative effort, and I’ll post to the dev list and reddit once I get the Github up for some more feedback.– BrianBurns Thanks! Looking forward to it. I just checked and it seems the current theme was added installed 2013-04-24.– Alex SchroederTalk link indicates whether page already existsCould there be some sort of styling or tooltip to indicate if the talk page exists/has talk on it? I like to browse the talk pages to see some meta-discussion. But if it’s not there, I don’t want to bother clicking through.On Pmwiki, Talk-links are followed by a question-mark if there is no page (it’s the default indicator that a wiki-link does not exist). I don’t actually like the question-mark. On Wikipedia… well, I can’t find an article without a talk page right now. No idea.While I’m on about Talk, is there a reason that Talk asks for a users homepage-url, while other edits only ask for username? --MichaelPaulukonis Wikipedia makes the talk link red. http://en.wikipedia.org/wiki/Inciting_incident as of 21 September 2013 at 16:30. – Anon Sure. I think there’s a related question, here: Should all links to non-existing pages get “red link” instead of the question-mark? For now, I’ll see about a simple change that only affects the comment links we have right now…Here’s what I’m doing right now: If the comment link points to a comment-page that doesn’t exist, the class “edit” is added but without changing it into a standard edit link (no questionmark!). Plus, if you’re using the default setup with bootstrap CSS, I’m adding the “warning” button style, resulting in a yellow button instead of a standard yellow button for non-existing Talk pages. What do you think? – AlexSchroederEasy navigation from talk page back to parentPages (“parents” or “parent pages”) have links to goto/create talk pages, but there’s no reverse functionality on the talk pages to go back to the parent (that I can see). This would be nice. --MichaelPaulukonis Do you see the link at the bottom that says Article? If so, that’s the one and perhaps it could use some further highlighting. If you don’t, then that’s a bug. – AlexSchroeder MichaelPaulukonis Ah! NOW I see it. I’d probably like both of them up top, next to the page name. When I’m on the talk page I more want to go back to the parent then to see what links to the talk page (default title-link behavior). --MichaelPaulukonis What do you think of the change I just made? It moves the Article or Talk link (if any) to right after the header.In case you’re interested, I added the following to emacs-bootstrap.js: // move article link and talk link below title var $link = $('a.original').add('a.comment'); if ($link) { $('.header h1').after($('<p>').append($link)); }– AlexSchroeder I don’t see it. Then again, I don’t use the bootstrap version…I agree that the link back to the page commented on should be much more prominent. And the main page is not necessarily an “article”. It is sometimes a file in ElispArea, for instance. – DrewAdams MichaelPaulukonis I like it. I’m not going to say “love”, as we’ve (I) have also got the two searchboxes up there. I know, I’m being finicky; I don’t have a complete suggestion of how to better use the space. Something like how mediawiki (or the styling that wikipedia uses) displays the Article/Talk tabs, maybe?On a related note, are there any keybindings for common functionality – like edit, talk, article/parent? That would remove part of the issue with having them below/above the fold.I agree with Drew about the “article” issue. I usually think of everything in here as a page, anyway. [for all of my caveats, I was amazed at the response time. woooh!] --MichaelPaulukonis The name “article” is just what Wikipedia uses so it is easier to understand. There are “access keys” which might work for you but I don’t know them by heart. If you use the English interface then I’d try e for edit, c for comment and a for article, perhaps? – Alex MichaelPaulukonis Okay, those work. I see e is documented at HowToEdit#accesskeys, and p is down below here in dialog, but there’s no central documentation of them? Where would be the best place to document ALL of these? I.E., I’ll do it. --MichaelPaulukonis There is no central documentation. They just get added ad-hoc. Let me check the source. 😊eedit (German: b)ssaveppreviewffindaarticleccommentAs for where to document them, I don’t know. Probably a new page to link from HowToEdit? – Alex MichaelPaulukonis Say “hello!” to AccessKey --MichaelPaulukonisUser Names on RecentChanges PageIt would be good if user names were treated normally at RecentChanges, that is, to show a non-existant page like a non-existant page is usually shown. People might be encouraged to follow it and create a home page. I haven’t thought about this in a long time. Maybe you’re right. – AlexSchroederLayoutEdit PageWhat about moving the “Please make sure…” text, plus the Username field above the text-input editing box? That would reduce the need to scroll the page by placing the Save and Preview buttons closer to the editing box (using Preview more than once while editing is common). In fact, it would be great if those two buttons could be on the same line as the “This change is a minor edit” check box, making them even closer to the edit box. – DrewAdams At the time I did this on purpose to make sure people read the blurb… :/As for hitting Preview a lot: The access key should be P, so try M-p or C-p in your browser (see this list too see which modifiers are used in different browsers).Other than that, if you have a CSS-based suggestion, we can try it out. – AlexSchroederKeys Adding some style changes to break out <code> from the surrounding text would be very helpful for key strokes. Especially if they are something like ‘C-x (’ which is used for starting a keyboard macro. – DocWhat Do you mean in addition to using a monospaced font, something like a light gray background? Alternatively, the weird accents-used-as-apostrophes such as ‘C-x C-c’ usually work. Unfortunately, the regular expression used prevents `C-x (’ from working. 😟The particular regular expressions used, straight from the Perl code: if (/\G(\`|‘)([CM][- ][- A-Za-z0-9<>;:#]+)(\'|’)/cg or /\G(\`|‘)([-A-Za-z0-9\/\*]+[=]?)(\'|’)/cg) { return $q->code('&#x2018;' . $2 . '&#x2019;'); }Any suggestions for improvement? It would obviously be easy to style these occurrences. But how? – AlexSchroederClick the heading to search for pages in this category / that link hereThis bothers me similarly to the above since it just adds clutter for anyone who knows what clicking on a header does. I would like to remove this too but this would probably not be well received. I would suggest that this information is somehow shown on all pages but in an less intrusive way.Maybe somewhere in the footer close to where the language links are too. Then again this link (“Pages linking here”) as well as the links to the translations can easily be missed. Maybe both kinds should be placed somewhere more visible? But if you do this please do so in a way that makes it easy to hide it using a style sheet. – JonasBernoulliSubscription serv'''
