["https://www.emacswiki.org/emacs/CategoryEducation"]
title = "EmacsWiki: Category Education"
full_description = "This category focuses on Emacs’s uses in education.Click the title heading to search for all pages in this category.LearningDictionary lookup packages (many of them) can be found under CategoryInterface.org-drill - Runs an interactive session where “facts” in OrgMode files are presented for review or recall, using the supermemo SM5 spaced repetition algorithm. Also on Worg.Pamparam is a spaced repetition (SR) memory cards implementation for Emacs leveraging OrgMode.ELIP - EMACS Learning Instruction Program, based on the supermemo interval learning system, requires EmacsDataBase EDB. http://www.gnuvola.org/software/elip/EtxtMode – a mode that extends ViewMode for easier reading and bookmarking of e-texts, like those found on Project GutenbergFlashCard – type complete answers, use five simulated decks of cards to practiceFlashMaker – create flashcard decks from existing dictionariesKanjiDictionary (kdic.el) – practice your kanjiRDictCc – is an english-german (and vice versa) dictionary written in Ruby. It includes an emacs module which integrates it into emacs. Get it from apps section at the author’s homepage.RevealNextTextMode – progressively hide or show text after point.SpanishTest – a small script for learning spanish vocabulary and verb conjugationsSpeedreading – Teach yourself to read faster http://www.bobnewell.net/elisp.htmlThesauriAndSynonyms – Finding roughly equivalent words in natural languages. Lists applications to other related information and tasks.VerbisteEl – Conjugate/deconjugate French verbs using the verbiste programVocabTest – a vocabulary testervoctest - Emacs-based program for vocabulary testing. It uses a dictionary file containing colon-separated translations and presents a flash card-like interface. It is small but quite useful if you need to memorize something. http://belikoff.net/stuff/soft/voctest.el, see screenshotTeachingGradeMode – tool for computing student grades by JayBelanger.Gradebook mode (gradebook.el) – http://lists.gnu.org/archive/html/gnu-emacs-sources/2006-12/msg00029.htmlSee also SpreadSheet."
