full_description = "Click on the heading to search for all pages related to emulating other software and systems in Emacs.AnsiTerm – Use any terminal-based program from within Emacs.BriefBriefMode – An once popular editor “Brief” which was famous for easy-to-learn.BrfMode – Add functionality from the editor Brief to Emacs.CuaMode – Use C-x, C-c and C-v to CopyAndPaste and more.EdMode – ed mode for EmacsImitating window and session management of GnuScreenElScreenEmacsScreenNorton Commander and Midnight Commander clones written for Emacs:MidnightCommanderModeNortonCommanderModeSunrise Commander – also based on dired, but with many more features than mc.el and heavily influenced by the Orthodox File Manager standard.PcSelectionMode – Manage your regions like Motif, MAC or MS-Windows.WholeLineOrRegion – Operate on a line if nothing is selected.Imitating Vi and Vim.vim-current-buffer - a simple asynchronous call to vim / gvim to open current bufferEvil – an extensible Vi layer, the successor of Vimpulse and VimMode (see below)ViperMode – A comprehensive mode that comes with Emacs.Emaci – A powerful reader in Emacs like vi.Vimpulse – Extends Viper with Vim features.vim-modeline – Vim modeline (similar to Emacs’ file local variables) interpretationViKeys – One command at a time.ChangeWordOpenNextLineRecenterLikeViRepeatingCommandsLikeViSearchAtPointZapUpToCharZopToChar - A visual zap-to-char command for emacsVimMode – A mode emulating many Vi and Vim features.Notes for those with VisualStudio habits:EmacsForDevStudioUsers"
