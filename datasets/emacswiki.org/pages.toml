["https://www.emacswiki.org/emacs/%C3%9Cbersicht"]
title = "EmacsWiki: Übersicht"
full_description = "Deutsch | English | Español | Français | Português | Русский | 简体中文 | 繁體中文 | Svenska | 日本語 | 한국어 | Italiano | УкраїнськаThe EmacsWiki is dedicated to documenting and discussing EmacsAndXEmacs. See the MissionStatement for more – hier geht es um Editoren der Emacs/XEmacs Familie. 😊SozialesEmacs IRC Kanal (Deutsch) – Chat zum Thema EmacsEinzelne Seiten von InteresseTextBearbeiten – Alles was mit dem Editieren von Text Quellcode… zu tun hatZyklischeBuffer – Wieviele Leute haben das schon gemacht?EinfachZwischenFensterSpringen – nicht immer C-x oAktiveMenüs – Die Menüleiste erscheint nur auf WunschEigeneHTMLTimeStamps – Beinflussung des Aussehens der HTML hhmts-ZeitstempelAUCTeXDeutsch – Für (La)TeXnikerFileVariablen – Lokale, Datei-spezifische EinstellungenEmacsOnGermanMac – Mac-Keyboard, Emacs und UmlauteAltesDeutsch – Altes Deutsch, bzw: Altes Deutſch, mit langem ſ und einem hübſcheren ʒ.OctaveMode – Octave-Mode unter Windows mit XemacsAnSysDe – Ansys mode Yasnippet - Vorlagen einfügen über Schlüsselwörtern und Tab-TasteUeberschriften in einem Org Mode File mithilfe von Abkuerzungen schneller finden – Beispiel für den Einsatz von Abbrevs und Regexeswhich-key – kontextsensitive Anzeige von key bindingsMeiner Meinung nach müssen wir mit dem Organisieren der Seiten erst anfangen, wenn die Liste der deutschen Seiten unübersichtlich lang geworden ist. Davon sind wir noch weit entfernt. 😊 – AlexSchroederXEmacs BesonderheitenSchreib einfach auf die Seite: “Folgendes gilt nur für XEmacs” - wenn es Emacs Leute gibt, die das auch können, dann werden die das schon abändern.BilderURL tippen und wenn die URL mit JPG oder PNG endet, wird ein IMG tag generiert. Ansonsten kann man einen Bilderlink mit [[image:foo]] setzen, und auf der Seite “foo” dann ein Bild speichern (denn auf jeder Seite kann entweder ein Bild oder Text (evt. mit IMG tags) stehen.Name ist auf Deutsch nicht eindeutigBeispiel: EDiff. Lösung: EDiffDeutsch, analog zu AUCTeXSpanish, wenn der Titel ohne Suffix (“EDiff”) nicht auf Deutsch übersetzt werden kann."
