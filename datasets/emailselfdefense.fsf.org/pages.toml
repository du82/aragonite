["https://emailselfdefense.fsf.org/zh-hans"]
title = "电子邮件加密指南 - 使用 GnuPG 加密对抗大规模监控"
description = "电子邮件监控侵犯了我们的基本权利，威胁了言论自由。本指南将在四十分钟里教会你如何使用 GnuPG 加密。"
full_description = "我们为计算机用户争取权利，促进自由软件发展，对抗大规模监控对我们至关重要。 捐款支持本指南。我们将一直改进它，使其充实，让普通人迈出隐私保护的第一步，并从中获益。 大规模监控侵犯了我们的基本权利，威胁了言论自由。本指南将会教授一个基本的监控自我保护技巧：加密电子邮件。学会后，你将能够收发其他人（包括截获邮件的监控代理和窃贼）无法阅读的电子邮件。你需要的是一台带网络连接的计算机，一个电子邮箱账户和大约四十分钟时间。 即使你没有不可告人的秘密，使用加密可以保护对方的隐私，使得大规模监控系统变得难以运作。如果你确实有重要的东西需要保护，那么你并不孤独；告密者在揭发人权侵犯、腐败和其他犯罪问题时，也是使用同样的工具保护他们身份。 除了使用加密技术，对抗监控还需要我们作政治斗争，以减少政府对我们的海量数据收集。但重中之重是保护好你自己，使得政府难以监控你的通信。本指南将帮助你做到这一点。它是为初学者设计的，但如果你已经掌握了 GnuPG 的基本知识，或是一位资深自由软件用户，你会喜欢进阶提示与加密探讨会指南。 本指南需要使用自由许可的软件；自由软件是完全透明的，任何人都可以复制它，制作自己的版本。这使得它比专有软件（比如 Windows 和 macOS）更难受到监控。在 fsf.org 上了解更多关于自由软件的信息。 大多数 GNU/Linux 操作系统自带 GnuPG，如果你正在使用这类系统，你不必下载 GnuPG。如果你使用的是 macOS 和 Windows，请按以下步骤下载 GnuPG。在配置 GnuPG 前，你需要一款桌面电子邮件程序。大多数 GNU/Linux 发行版已经安装好 IceDove 了，它可能叫另一个名字 Thunderbird。电子邮件程序提供了访问邮箱账户的新途径（当然你也可以像 Gmail 那样通过浏览器访问），但它拥有更多的功能。"
