["https://emailselfdefense.fsf.org/fr"]
title = """
Autodéfense courriel - un guide pour contrer la surveillance en chiffrant
avecGnuPG"""
description = """
La surveillance du courriel viole nos droits fondamentaux et fait planer un
risque sur la liberté d'expression. En 40 minutes, ce guide vous
apprendra à vous défendre avec GnuPG."""
full_description = "Nous défendons les droits des utilisateurs de l'informatique et soutenons le développement de logiciels libres. Résister à la surveillance de masse est très important pour nous. Faites un don pour soutenir Autodéfense courriel. Nous devons continuer à l'améliorer et écrire d'autres tutoriels du même genre pour aider les gens de tous les pays à faire le premier pas vers la protection de leur vie privée. La surveillance de masse viole nos droits fondamentaux et fait planer un risque sur la liberté d'expression. Ce guide vous apprendra les bases d'une méthode d'autodéfense contre la surveillance : le chiffrement du courriel. Une fois que vous l'aurez assimilée, vous serez en mesure d'envoyer et recevoir des courriels brouillés, et ainsi faire en sorte qu'un outil de surveillance ou un voleur qui les intercepterait ne puisse pas les lire. Tout ce dont vous avez besoin, c'est d'un ordinateur doté d'une connexion à Internet, d'un compte de courriel et d'environ 40 minutes. Même si vous n'avez rien à cacher, l'utilisation du chiffrement vous aidera à protéger la vie privée des personnes avec qui vous communiquez et rendra la tâche plus difficile aux systèmes de surveillance de masse. Si en revanche vous avez quelque chose d'important à cacher, vous serez en bonne compagnie ; les lanceurs d'alertes utilisent ces outils pour protéger leur identité alors qu'ils exposent au grand jour les atteintes aux droits de l'homme, la corruption et autres crimes. Outre l'utilisation du chiffrement, s'opposer à la surveillance exige un combat politique visant à réduire la quantité de données amassées à notre sujet, mais la première étape, qui est essentielle, est de nous protéger de manière à rendre la surveillance de nos communications aussi difficile que possible. Ce guide vous aide à le faire. Il est destiné aux débutants, mais si vous avez déjà une connaissance de base de GnuPG ou une certaine expérience du logiciel libre, vous apprécierez les conseils d'utilisation avancée et le guide pour initier vos amis."
