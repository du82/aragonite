["https://emailselfdefense.fsf.org/it"]
title = """
Autodifesa Email - una guida per combattere la sorveglianza di massa con la
crittografia GnuPG"""
description = """
La sorveglianza delle email viola i nostri diritti fondamentali e mette a
rischio la libertà di parola. Questa guida ti insegnerà come proteggere le
tue email in 40 minuti usando GnuPG."""
full_description = "Ci battiamo per i diritti degli utenti di computer e promuoviamo lo sviluppo di software libero (nel senso di libertà). Resistere alla sorveglianza di massa è per noi molto importante. Ti preghiamo di fare una donazione per sostenere la guida Autodifesa Email. Dobbiamo continuare a migliorarla e creare nuovi materiali, a vantaggio delle persone di tutto il mondo che fanno il primo passo verso la protezione della propria privacy. Inserisci il tuo indirizzo email per ricevere la nostra newsletter mensileSostenitore del software libero La sorveglianza di massa viola i nostri diritti fondamentali e mette a rischio la libertà di parola. Questa guida ti insegnerà le basi per autodifenderti dalla sorveglianza: la crittografia delle email. Una volta che avrai terminato di leggere la guida, sarai in grado di inviare e ricevere email criptate per assicurarti che un agente di sorveglianza o un ladro, che riesce ad intercettare le tue email, non possa leggerle. Tutto ciò che ti serve è un computer con una connessione a Internet, un account di posta elettronica e circa quaranta minuti di tempo. Anche se non hai nulla da nascondere, l'uso della crittografia ti aiuta a proteggere la privacy delle persone con cui comunichi e rende la vita difficile ai sistemi di sorveglianza di massa. Se hai qualcosa di importante da nascondere, sei in buona compagnia: questi sono gli stessi strumenti che gli informatori usano per proteggere la propria identità e allo stesso tempo fare luce su abusi dei diritti umani, corruzione ed altri crimini. Non basta utilizzare la crittografia per contrastare la sorveglianza di massa, occorre fare di più: lottare politicamente per la riduzione della quantità di dati che vengono raccolti su di noi. Il primo passo fondamentale è comunque proteggersi e rendere il più difficile possibile la sorveglianza delle tue comunicazioni. Questa guida ti aiuterà a farlo. È pensata per i principianti, ma se conosci già le basi di GnuPG o se sei utente esperto di software libero, apprezzerai i suggerimenti avanzati e la guida per insegnare ai tuoi amici."
