["https://emailselfdefense.fsf.org/tr"]
title = "E-posta Öz Savunma - GnuPG şifreleme yardımıyla gözetimle mücadele rehberi"
description = """
E-posta gözetimi temel haklarımızı ihlal eder ve ifade özgürlüğümüzü tehdit
eder. Bu rehberle 40 dakikada GnuPG yardımıyla e-posta öz savunmayı
öğreneceksiniz."""
full_description = "Bilgisayar kullanıcılarının hakları için mücadele ediyoruz ve özgür yazılım geliştirilmesini destekliyoruz. Kitlesel gözetime karşı koymak bizim için oldukça önemlidir. E-Posta Öz Savunmayı desteklemek için lütfen bağışta bulunun. Dünya genelinde gizliliklerini korumaya yönelik ilk adımlarını atmaya çalışan insanların yararı için bu rehberi geliştirmeyi sürdürmeye ve daha fazla malzeme üretmeye ihtiyacımız var. Kitlesel gözetim, temel haklarımızı ihlal eder ve ifade özgürlüğümüzü tehdit eder. Bu rehber size gözetime karşı basit bir öz savunma tekniği olan e-posta şifrelemeyi öğretecek. Bu rehberi tamamladığınızda, ele geçiren bir gözetim failinin veya hırsızın okuyamayacağına emin olabileceğiniz şekilde karıştırılmış e-postalar gönderip alabileceksiniz. Bütün ihtiyacınız olan İnternet bağlantısı olan bir bilgisayar, bir e-posta hesabı ve yaklaşık kırk dakika. Gizleyecek hiç bir şeyiniz olmasa bile şifrelemeyi kullanmak, iletişim kurduğunuz insanların gizliliğini korumaya yardımcı olur ve kitlesel gözetim sistemlerinin işini zorlaştırır. Eğer gizleyecek önemli bir şeyiniz varsa, yalnız değilsiniz, burada kullanmayı öğreneceğiniz araçlar, insan hakları ihlalleri, yolsuzluk ve diğer suçları ifşa eden kişilerin kimliklerini korumak için kullandığı araçların aynısıdır. Hakkımızda toplanan veri miktarının azaltılması için şifreleme kullanmanın yanında, gözetlemeye karşı politik bir mücadeleye de girmek gerekir. Ancak ilk aşamada kendinizi korumak ve iletişiminiz üzerindeki gözetimi zorlaştırmak önemlidir. Bu rehber size bu konuda yardımcı olacak. Bu rehber yeni başlayanlar için tasarlanmış olsa da, GnuPG hakkında temel bilgiye sahip veya deneyimli bir özgür yazılım kullanıcısı bile olsanız, gelişmiş ipuçları ve arkadaşlarınıza nasıl öğretebileceğinize ilişkin kısmıyla hoşunuza gidecek. Bu rehber, özgür lisanslı yazılımlara dayanarak hazırlanmıştır. Bu yazılımlar tamamen şeffaftır ve herhangi bir kimse bunları kopyalayabilir veya kendi sürümlerini oluşturabilir. Bu özellik sayesinde bu yazılımlar özel mülk yazılımlara (örneğin Windows veya macOS) göre gözetime karşı daha güvenlidir. Özgür yazılım hakkında daha fazla bilgi için fsf.org sitesini ziyaret edebilirsiniz."
