["https://emailselfdefense.fsf.org/sq"]
title = """
Vetëmbrojtje Email-i - një udhërrëfyes për të luftuar kundër survejimit me
fshehtëzim GnuPG"""
description = """
Survejimi i email-it cenon të drejtat tona themelore dhe vë në rrezik fjalën
e lirë. Ky udhërrëfyes do t’ju mësojë për 40 minuta vetëmbrojtje email-i me
GnuPG."""
full_description = "Luftojmë për të drejtat e përdoruesve të kompjuterit dhe promovojmë zhvillimin e software-it të lirë (si te liria). Qëndresa ndaj survejimit në masë është shumë e rëndësishme për ne. Ju lutemi, dhuroni në përkrahje të Vetëmbrojtjes së Email-it. Na duhet të vazhdojmë përmirësimin e këtij dhe të krijojmë më tepër materiale, për të mirën e njerëzve që ndërmarrin hapat e parë drejt mbrojtjes së privatësisë së tyre anembanë botës. Survejimi masiv dhunon të drejtat tona themelore dhe e vë në rrezik fjalën e lirë. Ky udhërrëfyes do t’ju mësojë një aftësi bazë vetëmbrojtjeje nga survejimi: fshehtëzimin e email-eve. Pasi t’i keni shkuar deri në fund, do të jeni në gjendje të dërgoni dhe merrni email-e që janë koduar në mënyrë të tillë që garanton se një agjent survejimi, apo një vjedhës, që po kap email-in tuaj, të mos mundet ta lexojë. Krejt sa ju nevojitet është një lidhje Internet, një llogari email dhe afërsisht dyzet minuta. Edhe kur s’keni asgjë për të fshehur, përdorimi i fshehtëzimit ndihmon të mbrohet privatësia e njerëzve me të cilët komunikoni dhe ua vështirëson punën sistemeve të survejimit në masë. Nëse keni diçka të rëndësishme për të fshehur, jeni aty ku duhet; këto janë të njëjtat mjete që sekretnxjerrësit përdorin për të mbrojtur identitetin e tyre, teksa hedhin dritë mbi abuzime të të drejtave të njeriut, mbi korrupsionin dhe mbi krime të tjera. Veç përdorimit të fshehtëzimit, qëndresa ndaj survejimit lyp të ndeshemi politikisht për një reduktim të sasisë së të dhënave të grumbulluara për ne, por hapi i parë thelbësor është mbrojtja e vetes dhe bërja e survejimit të komunikimeve tuaja aq të vështirë sa mundet. Për këtë ju ndihmon ky udhërrëfyes. Është i hartuar për fillestarë, por nëse i njihni tashmë bazat e GnuPG-së ose jeni përdorues i sprovuar i software-it të lirë, kanë për t’ju shijuar ndihmëzat e thelluara dhe udhërrëfyesi se si t’ua mësoni shokëve tuaj."
