["https://emailselfdefense.fsf.org/pl"]
title = "Mailowa samoobrona – jak walczyć z inwigilacją za pomocą szyfrowania GnuPG"
description = """
Inwigilacja poczty mailowej narusza nasze podstawowe prawa i sprawia, że
wolność słowa jest ryzykowna. Ten przewodnik nauczy Cię mailowej samoobrony
w 40 minut z GnuPG."""
full_description = "Walczymy o prawa osób korzystających z komputerów i promujemy rozwój wolnego (wolnościowego) oprogramowania. Opór wobec masowej inwigilacji jest dla nas bardzo ważny. Przekaż darowiznę na rzecz Mailowej samoobrony. Chcemy ją ciągle ulepszać i tworzyć więcej materiałów, z korzyścią dla osób na całym świecie, które stawiają pierwszy krok w kierunku ochrony swojej prywatności. Masowa inwigilacja narusza nasze podstawowe prawa i sprawia, że wolność słowa staje się ryzykowna. Ten przewodnik nauczy Cię podstawowej umiejętności samoobrony przed inwigilacją: szyfrowania maili. Kiedy go przejdziesz, będziesz wiedzieć, jak wysyłać i odbierać maile, które są zaszyfrowane, aby uniemożliwić osobom prowadzącym inwigilację lub złodziejom ich przechwycenie i odczytanie. Wszystko, czego potrzebujesz, to komputer z połączeniem internetowym, konto mailowe i około czterdzieści minut. Nawet jeśli nie masz nic do ukrycia, szyfrowanie pomaga chronić prywatność osób, z którymi się komunikujesz, i utrudnia życie masowym systemom nadzoru. Jeśli masz coś ważnego do ukrycia, jesteś w dobrym towarzystwie; są to te same narzędzia, których używają sygnaliści do ochrony swojej tożsamości, rzucając jednocześnie światło na przypadki łamania praw człowieka, korupcję i inne przestępstwa. Oprócz stosowania szyfrowania przeciwstawianie się inwigilacji wymaga walki politycznej o zmniejszenie ilości zbieranych o nas informacji. Ale kluczowym pierwszym krokiem jest ochrona siebie i maksymalne utrudnienie nadzoru nad Twoją komunikacją. Ten przewodnik pomoże Ci to zrobić. Jest przeznaczony dla początkujących, ale jeśli znasz już podstawy GnuPG lub masz doświadczenie w korzystaniu z wolnego oprogramowania, spodobają Ci się zaawansowane wskazówki i podręcznik do uczenia znajomych. Ten przewodnik opiera się na oprogramowaniu, które jest objęte darmową licencją; jest całkowicie transparentne i każdy może je skopiować lub stworzyć jego własną wersję. Dzięki temu jest lepiej zabezpieczone przed inwigilacją niż oprogramowanie komercyjne (takie jak Windows lub macOS). Więcej o wolnym oprogramowaniu dowiesz się na fsf.org."
