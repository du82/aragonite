["https://emailselfdefense.fsf.org/es"]
title = """
Defensa personal del correo electrónico: una guía para la lucha contra la
vigilancia con el cifrado GnuPG"""
description = """
La vigilancia del correo electrónico viola nuestros derechos fundamentales y
pone en peligro la libertad de expresión. Esta guía te enseñará defensa
personal del correo electrónico en 40 minutos con GnuPG."""
full_description = "Luchamos por los derechos de los usuarios de la informática, y promovemos el desarrollo del software libre. Oponernos a la vigilancia masiva es muy importante para nosotros. Por favor done para apoyar a la defensa personal del correo electrónico. Necesitamos mejorarla y realizar otros materiales similares, para beneficiar a gente de todo el mundo a dar sus primeros pasos para proteger su privacidad. Ingresa tu dirección de correo electrónico para recibir nuestro boletín mensual, elFree Software Supporter La vigilancia masiva viola nuestros derechos fundamentales y pone en peligro la libertad de expresión. Esta guía te enseñará una habilidad básica de defensa personal contra la vigilancia: el cifrado del correo electrónico. Una vez que hayas terminado, serás capaz de enviar y recibir correos electrónicos cifrados para evitar que un vigilante o un ladrón que intercepte tu correo electrónico pueda leerlos. Todo lo que necesitas es una computadora con conexión a Internet, una cuenta de correo electrónico y aproximadamente cuarenta minutos. Incluso si no tienes nada que esconder, el cifrado ayuda a proteger la privacidad de las personas con las que te comunicas y les pone las cosas difíciles a los sistemas de vigilancia masiva. Si tienes algo importante que esconder, estás en buena compañía: éstas son las mismas herramientas que usan los confidentes para proteger sus identidades cuando sacan a la luz abusos a los derechos humanos, casos de corrupción y otros crímenes. Además de utilizar el cifrado, hacer frente a la vigilancia requiere una lucha política para reducir la cantidad de datos que se recogen sobre nosotros, pero el primer paso imprescindible es protegerte a ti mismo y hacer que la vigilancia de tus comunicaciones sea lo más difícil posible. Esta guía te ayudará a hacer eso. Está diseñada para principiantes, pero si ya conoces lo básico de GnuPG o eres una persona con experiencia en el software libre, disfrutarás de los trucos avanzados y la guía para enseñar a tus amigos."
