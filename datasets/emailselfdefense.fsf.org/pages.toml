["https://emailselfdefense.fsf.org/ru"]
title = "Самозащита электронной почты: применение GnuPG в борьбе со слежкой"
description = """
Подглядывание электронной почты нарушает наши основные права и угрожает
свободе слова. Это руководство за 40 минут научит вас самозащите электронной
почты с помощью GnuPG."""
full_description = "Мы боремся за права пользователей компьютеров и содействуем разработке свободных (от слова «свобода») программ. Противостояние массовой слежке очень важно для нас. Пожалуйста, поддержите «Самозащиту электронной почты» пожертвованием. Нам нужно дальше улучшать ее, создавать новые материалы, помогающие людям из разных уголков планеты сделать первый шаг к защите своей приватности. Введите свой адрес электронной почты, чтобы получать наш ежемесячник, Сторонник свободных программ Массовая слежка нарушает наши основные права и угрожает свободе слова. Это руководство научит вас простейшему навыку самозащиты от слежки — шифрованию электронной почты. После этого вы сможете отправлять и получать зашифрованные сообщения, чтобы агент слежки или вор, перехватывающий вашу электронную почту, не мог ее прочесть. Для этого вам понадобится только компьютер с подключением к Интернету, учетная запись электронной почты и около сорока минут свободного времени. Даже если вам нечего скрывать, шифрование поможет защитить приватность людей, с которыми вы общаетесь, и усложнить жизнь системам массовой слежки. Если же вам важно что-то скрывать, вы пришли по адресу. Это те самые инструменты, которые информаторы используют, чтобы остаться неизвестными, когда проливают свет на нарушения прав человека, коррупцию и другие преступления."
