full_description = "Chapter 2 Basics: C language 2.1 Introduction Most of the firmware we encounter today is written in C. In recent months and years it seems like Rust gets a little bit traction in embedded development, but the majority still writes C. For reverse engineering and to understand things in an effective way, it is very helpful to understand some very basic concepts from C first, which is what we are going to do in the following chapter. 2.2 C language: General terms and concepts Terms explained in this chapter: compile assemble link translation unit object file relocatable object file executable object file ELF Figure 2.1: Build Process Overview Before we demystify how a firmware is build from source code, we need to introduce some terms, which are going to be important throughout the whole chapter. Figure 2.1 shows the different build stages of a firmware file, where source code files are translated into machine code There are 3 basic steps which happen each time you build your software from its source code: compile assemble link A compiler converts a high-level language like C to assembly, then an assembler converts assembly to machine code. The compiler translates one translation unit to assembly: Once you have written your code in a .c file (and maybe your .h), you have build your first translation unit. After the C Preprocessor combines the c and h files into one, the translation unit is ready to be translated by the compiler. Roughly you can say: One c file is one translation unit. The next step is to assemble the compilers output (which is is written in assembly) into a object file. At the most abstract level a firmware consist of data and machine code. This data and machine code obviously need to be organized into a well known format, to be manageable and understandable by the different tools and the developer. An object file is exactly that. It is the organized version of the data and instructions, we wrote in C. Additionally there is some meta information, as we’ll see soon. The object file format which we are going to focus on throughout this book is ELF (there are others). At the stage of the linker (see 2.1) the object files are called relocatable object files. Once all relocatable object files are linked into one, this file is called executable object file. The linker links the relocatable object files into an executable object file as specified in a linker script. They do instruct the linker on how to glue the different object files together, to build the final executable. The format of the executable object file is also ELF. Chapter 5 explains a secure world linker script in detail. You can find a graphical summary on the build process in figure 2.1. To execute your ELF file your Linux Kernel uses a ELF loader, which reads and loads the ELF you want to execute into memory. When we talk about firmware, most often one last step is done to create a firmware image. So a SoC normally does not load ELF files. In the following, I am going to use the term build process to refer to all three steps. When I try to reference a specific step, I’ll use the appropriate term: compile, assemble or link. 2.3 C objects and identifiers: Terms and Concepts Terms explained in this chapter: object scope visibility identifier declaration definition initialization storage class linkage storage duration extern specifier static specifier An object in C is a region of data storage. They have different properties, which influence how they are handled during the build process. Keep in mind that the compiler and assembler always translate and assemble one translation unit. The linker then links those, so the following concepts and terms are relevant for one translation unit. An object, as functions, enums, structs and so on are denoted by a identifier. A identifier has a scope, which is the portion of source it is visible. C has different kinds of scopes: block scope file scope function scope int a; // scope: file static int b; // scope: file void main(int argc, int argv[]){ // argv and argc: function scope int a; // scope: block. Hides the previous a (which has file scope) ... } The scope is an implicit property of an identifier. An identifier can only be used in the scope it is visible and often it is even destroyed, when its scope ends, e.g. a in main() is destroyed, after the function main ends. To influence the visibility and lifetime of an object, you can change its storage class. There are two storage class specifiers, which influence two properties: the linkage and the storage duration: extern: external linkage, static duration static: internal linkage, static duration Static duration means, that the variable lives trough the whole program lifetime (and not only in a block scope or function). All objects declared as static or extern have static storage duration. Linkage means, that the variable can be used in other scopes: Internal linkage meaning that the object can be used in all scopes of the current translation unit, external linkage means that the variable can even be used from scopes in other translation units! static int a; // storage duration: static, linkage: internal extern int b; // storage duration: static, linkage: external int c; // storage duration: static, linkage: external void main(void){ static int d; // storage duration: static, linkage: no linkage extern int e; // storage duration: static, linkage: external int f; // local only } When objects are defined at file-scope, static and extern influence only an objects linkage, since these file-scope objects are already storage duration static, per definition. File-scope identifiers have external linkage and static storage duration by default. It is absolutely possible, that an object has no linkage. Then an object is only visible in the scope where it is declared. Identifiers can be in three different states: declared defined initialized Examples: Declared variables: int a; struct myStruct; Defined variables: int a; struct myStruct {...}; Initialized variables: a = 1; myStruct = {...}; 2.4 Compiler, Assembler and Linker: Terms and concepts Terms explained in this chapter: section symbol symbol table input section output section In the previous chapter we learned how the storage duration and linkage influence the visibility of the object. In the following chapter we are going to look into how these properties are actually implemented by the compiler. State, storage duration, linkage all influence how an object is stored in memory. What happens in the background, when an object is declared with external linkage? What happens when an object is only defined but not initialized? Does static linkage influence the memory location also? To answer all these questions, we first need to introduce a new term: A section. A section is a range of addresses in a memory region. All data in one section holds data for some particular purpose. We already talked about how an object file consists of data and machine code, which you can see as two “purposes.” These are the first two sections, we are going to encounter in the following chapters. Sections are used on both relocatable object file and executable object file level: All machine code and data from one translation unit ends in sections of the relocatable object file. During the link step, ie when the executable object file is liked, these input sections (input from relocatable object files) are joined into output sections (output to executable object file). Which sections from the object file are joined into which sections of the executable is defined in the linker script. 2.4.1 Assembler terms Terms explained in this chapter: directive (assembly) instruction label statement In the previous chapter two important concepts were defined: sections and symbols. The compiler translates C code to assembler code, in which these symbols and sections are defined. The Assembler translates the assembler code into machine code and builds an object file (ELF in our case). In assembler symbols are used as kind of an umbrella term for different kind of symbols: directive, assembly instructions and labels, all are symbols. Only some symbols from assembler will be put into symbol table of the object file (see 2.6). The type of symbol is determined by special characters: A “.” in front of a symbol determines that the symbol is a directive. A “:” following a symbol, defines a label label1: ; this is a label .word variable1 ; this is the directive .word, defining a variable add R1, #1 ; this is an assembly instruction A graphical UML overview: Figure 2.2: UML summary: Assembly Terminology Then there are statements, which consist of an optional label and a directive or an assembler instruction. The whole example above is a statement. 2.5 ELF Terms explained in this chapter: execution view linking view This chapter introduces the ELF file format on a high level. We are going to see in the corresponding chapters how sections and symbols are represented in a ELF file. For now we are going to look into the header and the overall structure. Let’s start with a graphical summary of the structural elements of an ELF file. Remember, all object files are in ELF file format: Figure 2.3: ELF File Logic The life of an ELF file consists of two important tasks: Structure data and machine code during the build process, which is especially important in the linking step of the building process. strucuture data and machine code for execution. These two tasks are represented in two so-called views: The execution view and the linking view of an ELF file. Figure 2.4: ELF Linking and Execution Views All information in an object file is in a section, except the ELF header itself. A section can empty (existing but not holding any data). All sections have a section header. As we are going to see in chapter 2.7, there are some predefined sections. A segment is a collection of one or more sections, and each segment has a program header. The segment header defines metadata for the execution of the ELF file. For the linking view, the segments are irrelevant. We are going to go through all the relevant parts of a ELF file in the following chapters. Here is the list, in case you directly want to skip to a specific one: Sections are explained in chapter 2.7 Segments are explained in chapter 2.11 Symbol Tables are explained in chapter 2.6 Relocation Tables are explained in chapter 2.9 A quick recap of three types of object files: relocatable object file: holds code and data, suitable for linking with other object files. executable object file: product of the linking of multiple relocatable object files. shared object file The type of an object file is specified in its ELF header. A ELF file always begins with a well-defined header. The ELF header is the only component of a ELF file, which has a fixed place in the file. All other components are referenced: The ELF header contains references to the section headers and the program headers. Let’s take a look at the most important fields in the ELF header. The name used in the ELF specification is in parentheses. See [1] and for Arm specifics [2]). Type (e_type): Specifies the mentioned type: relocatable object file (ET_REL) executable object file (ET_EXEC) shared object file (ET_DYN) Entry point: (e_entry): Specifies where an object file starts execution. This is only for ET_EXEC. is bit[0] of the address is 1, the entry point contains Arm Thumb code, 0 means Arm code. Details for finding the section header table: offset (e_shoff) and number of entries (e_shnum). Details for finding the program header table: offset (e_phoff) and number of entries (e_phnum). A example header of a relocatable object file: ELF Header: Magic: 7f 45 4c 46 01 01 01 00 00 00 00 00 00 00 00 00 Class: ELF32 Data: 2's complement, little endian Version: 1 (current) OS/ABI: UNIX - System V ABI Version: 0 Type: REL (Relocatable file) Machine: ARM Version: 0x1 Entry point address: 0x0 Start of program headers: 0 (bytes into file) Start of section headers: 1008 (bytes into file) Flags: 0x5000000, Version5 EABI Size of this header: 52 (bytes) Size of program headers: 0 (bytes) Number of program headers: 0 Size of section headers: 40 (bytes) Number of section headers: 10 Section header string table index: 9 A example header of an executable object file: ELF Header: Magic: 7f 45 4c 46 01 01 01 00 00 00 00 00 00 00 00 00 Class: ELF32 Data: 2's complement, little endian Version: 1 (current) OS/ABI: UNIX - System V ABI Version: 0 Type: EXEC (Executable file) Machine: ARM Version: 0x1 Entry point address: 0x20000001 Start of program headers: 52 (bytes into file) Start of section headers: 132028 (bytes into file) Flags: 0x5000200, Version5 EABI, soft-float ABI Size of this header: 52 (bytes) Size of program headers: 32 (bytes) Number of program headers: 2 Size of section headers: 40 (bytes) Number of section headers: 10 Section header string table index: 9 ARM processors have two different instruction sets, a larger one called ARM and a smaller subset called Thumb. To distinguish between these two modes, Bit[0] of the address is used. If it is set to 0, the code will be executed in ARM mode, if it is set to 1, the code is executed in Thumb mode. In this case, Bit[0] of the Entry Point address is 1, so the processor will start in Thumb mode. The compiler does specify that using the directive .thumb. example1/main.s: .thumb .thumb_func .fpu softvfp .type main, %function main: ... The ELF Header examples show the Magic bytes (e_ident) of the ELF header, which are the very first bytes in any ELF object file. They encode different things, but one thing is noteworthy, especially when examining binaries: Byte 5 of the e_ident field encodes whether the data is Little (e_ident[5] = 2 (ELFDATA2LSB) or Big Endian (e_ident[5] = 2) encoded. As already mentioned, one segment holds one or many sections. Properties like the type of the segment, the addresses in memory, size are given in the program header entry of the segment. Example program headers: Program Headers: Type Offset VirtAddr PhysAddr FileSiz MemSiz Flg Align LOAD 0x010000 0x01000000 0x01000000 0x0009c 0x000a4 RWE 0x10000 LOAD 0x020000 0x20000000 0x20000000 0x00016 0x00016 R E 0x10000 There are two program headers, one is loaded at the address 0x01000000, the other one at 0x20000000. The first one is Read-Write-Execute and the second one Read-Execute only (see flags). When we go deep into linker scripts, we are going to see where segments and their properties are defined! 2.6 Symbols Terms explained in this chapter: symbol Symbols are a very central concept. They basically are names or references for data and code in the object files, they are used by every step on the build process in some form. Even after the build process when debugging your code, symbols are used to name code and data. ELF defines a symbol table, where all symbols are stored in a list. Each symbol has a binding, which represents their visibility from C "
