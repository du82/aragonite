full_description = "Chapter 10 Vendor: STM32 The following chapters provide descriptions and examples for STM32 microcontrollers. All chapters so far tried to be as vendor agnostic as possible. The following sections only apply to STM32. This chapter is stuctured as follows: Section 10.1 provides an overview and introduction on that the Bluepill evaluation board is and how it can be used. The Bluepill board is used in previously for example in the chapter about how to use a Logic Analyzer: Example 1: UART Section 10.2 provides an overview and introduction on the STM32L5, including its TrustZone capabilities. Section 10.3 provides TrustZone-enabled firmware examples for the ST32L5. 10.1 STM32 “Bluepill” STM32F103C8T6 The Bluepill is pretty popular and very cheap development board equipped with a STM32F103C8T6 microcontroller. Figure 10.1: The Bluepill board You can find the datasheet on st.com. More on Bluepill: Chapter 10.1: STM32 “Bluepill” STM32F103C8T6 Chapter 8.1.2: Logic Analyzer: UART Chapter 8.1.4: Firmware Extraction via UART (FTDI) Chapter 8.2.3: Find I2C address Chapter 8.2.5: Serial EEPROM simulation Chapter 8.3: Monodon Firmware 10.1.1 Hardware Overview Microcontroller: STM32F103C8T6 Arm Cortex M3 at 72 MHz 64 Kbytes Flash 20 Kbytes of SRAM The microcontroller supports all the basic embedded communication protocols: UART / USRT / LIN: 3 I2C: 2 CAN: 1 USB: 1 On reblag.dk you can find the following pinout diagram: Figure 10.2: Pinout Diagram (source: [9]) 10.1.2 Memory Map The full memory map can be found in the datasheet. [10] Table 10.1: The STM32F103 Memory map. Region From..To Description Aliased to Flash or system memory 0x0000 0000 .. 0x0800 0000 Aliased to either Flash Memory or system memory depending on the BOOT0 and BOOT1 configuration. See 10.1.3 Flash memory 0x0800 0000 .. 0x0801 FFFF Flash - what you program. System memory 0x1FFF F000 .. 0x1FFF F800 System Memory contains the boot loader. Option Bytes 0x1FFF F800 .. 0x1FFF F80F Here you can define read out protection or write protection for Flash. See 10.1.5 Peripheral 0x4000 0000 .. 0xFFFF FFFF Peripherals and Cortex-M3 internal Peripherals. 10.1.3 Boot Modes and Programming The microcontroller offers three boot modes, which are selectable via the BOOT-Pins. These pins BOOT0 and BOOT1 are conveniently available as jumper pins. As you can see in the pinout diagram or in the picture below, you can select 0 or 1 easy by settings the jumpers accordingly. If you have BOOT0 at 0, you will always boot from main flash memory. If you have BOOT0 at 1 and BOOT1 at 0, you will boot into the boot loader, which is programmed into the system memory. If you have BOOT0 at 1 and BOOT1 at 1, you will boot into embedded SRAM. There are multiple ways to program the main flash memory. As almost all STM32 devices a UART interface is available, when the device is booted into the boot loader. To boot into boot loader, set BOOT0 to 1 and BOOT1 to 0. Then you can program the device either via SWD or JTAG. See @ref(#bluepill-db) for details on how to connect to these ports. 10.1.4 Debugging If you want to use SWD or JTAG to program a device, you can leave BOOT0 and BOOT1 at 0 and boot into main flash memory. Altough, if you used the STM32CubeIDE to generate a bare metal firmware and did not any special configuration for the pins PA13 and PA14, the SWD and JTAG ports are disabled by default and those pins are available as GPIO ports. This means you won’t be able to program the device via JTAG or SWD. Specifically, JTAG and SWD are disabled in HAL_MspInit() via the macro __HAL_AFIO_REMAP_SWJ_DISABLE. An easy workaround is to boot into boot loader mode and program the microcontroller there - ie. set BOOT0 to 1 and reset the device. In boot loder mode JTAG and SWD are available. You can also enable the SWD interface in the MX Editor in the “System Core” -> SYS -> Debug configuration section. For Debugging the STM32F103C8T6 provides JTAG and SWD. As you can read in the Reference Manual ([11]) the STM32F103xx provides a standard Arm CoreSight debug port, which is 5 pin JTAG and a 2 pin Serial Wire (SWD) debug port. In CoreSight JTMS from JTAG and SWDIO from SWD and as well as JTCK and SWCLK are multiplexed together. The pins for SWD (SWCLK, SWDIO) are available as separate pins on the board: Figure 10.3: SWD port on the Bluepill To connect to these ports you can use a cheap ST-Link debugger and programmer. There are very cheap ones available, just search for “ST-Link v2.” I have the following device: Figure 10.4: Cheap ST-Link v2 programmer and debugger You will need 4 female to female jumper cables, hook them up to the correct pins as they are labeled on the ST-Link and your Bluepill and go. 10.1.5 Read out and write protections The STM32F103C8T6 provides only very simple protection mechanisms for the main flash memory. The read protection can be set using the STM32CubeProgrammer. Hook up the Bluepill as described in 10.1.4 and start the STM32CubeProgrammer connect the device and then you will be able to enable RDP: Figure 10.5: STM32CubeProgrammer. Enable RDP, Read protection With read protection enabled, reading from flash is only possible when the microcontroller runs from main flash memory without any debug mode active. This can be reset, but then the flash is erased. The STM32F103C8T6 flash is organized into 1 Kbyte pages. One bit of the WRP (Write protection) option bytes can set set to protect 4 pages of main flash memory in the STM32CubeProgrammer. For more information on RDP and WRP, you can check [12]. 10.2 STM32L5 and Nucleo-144 The following chapter focuses on the technical specifics and implementation details of TrustZone-M on a STM32L5 microcontroller. Chapter 10.3 accompanies this chapter and shows example firmware implementations on a STM32L5. 10.2.1 Hardware Overview The cheapest development board with TrustZone-M support I could find was the NUCLEO-L552ZE-Q, which is powered by a STM32L552ZE microcontroller by STMicroelectronics. The hardware: Microcontroller: STM32L552ZET6QU Arm Cortex-M33 at 110 MHz with TrustZone and FPU Internal Flash Memory (512 KB) Internal SRAM1 (192 KB) Internal SRAM2 (64 KB) The evaluation board provides: Different connectors like USB-Type C, SWD 3 LEDs 2 Push-Buttons On-Board ST-LINKv2-1 debugger and programmer For the rest of this chapter I am going to refer to the evaluation board as Nucleo, and when I mean explicitly the microcontroller I use STM32L5. Most of the values (memory regions,…) you will see in the next chapters are configurable by the user. I’ll use example values. 10.2.2 STM32 Product Life Cycle The life cycle of a product, which contains a STM32L5 as a component, can be a hugely complex: After STM produced the STM32L5 there might be multiple vendors involved to assemble, initialize and provision the final product, before it is sold or delivered to the end user. The product might return to the vendor for Return Material Analysis or might be decommissioned. Different stages of the life cycle have different security requirements. For example, the original vendor might want to program the secure world of a device (e.g. to ensure it’s identity by storing secrets in secure world), but having the provisioning of nonsecure world outsourced to any other vendor. 10.2.2.1 Readout Protection (RDP) The different security requirements of each development stage are reflected by Readout Protection (RDP) on STM32 devices. Different STM32 devices have different RDP levels with different features enabled or disabled per level. Transitioning between these levels is only possible in a predefined way. STM32L5 microcontrollers have the following RDP levels: RDP level Description 0 Debug: Secure and non-secure world. If TZEN=1: Boot address must target secure world. 0.5 Debug: non-secure world only if TZEN=1: Boot address must target secure world. Access to non-secure flash is allowed during debugging. Access to secure world is (SRAM, Flash) not permitted Boot from SRAM is not permitted 1 Debug: conditional, non-secure world only In Debug: No access to flash or SRAM In User Mode: COde Executing can read, write, erase flash 2 Debug: None Option Bytes are read only. RDP2 level is final. Limitations booting from SRAM and system memory When booting from flash read, write and erase is allowed from user code Figure 10.6: RDP transitions with TrustZone enabled (source: [13]) Figure 10.6 shows which transitions are possible in STM32L552x and on which transitions flash is erased. The example given above, where one vendor programs secure world and another one non-secure world, could be mapped by RDP transitions: Vendor 1 in RDP0 programs secure world and increases RDP to 0.5 and then ships the product to vendor 2, who programs non-secure world and increases to RDP 1 or 2. RDP 0.5 was introduced for these use cases and is only available, when TrustZone is enabled. 10.2.3 Option Bytes Option Bytes are STM32L5s way to implement reset-enduring system configuration. These option bytes are automatically read back by the system on PoR. Using the STM32CubeProgrammer option bytes can be programmed for example via ST-Link. There are User Manuals and descriptions for STM32CubeProgrammer available on the product website. To set the configuration bytes, the board must be plugged in and connected. To successfully connect to the board, the ST-Link drivers and the STM32CubeProgrammer (see chapter 10.3.1) need to be installed. The option bytes are part of the flash information block. They can be reprogrammed through the flash interface registers at 0x5002 2000 - 0x5002 23FF (secure) and 0x4002 2000 - 0x4002 23FF (non-secure). There is a dedicated programming sequence you can find in [5, p. 190]. See chapter 10.3.2.1 for an example how option bytes are configured using the STM32CubeProgrammer. 10.2.4 Memory Map In chapter 3.5 a high-level segmentation of the address space applicable to Arm6-M, Armv7-M and Armv8-M was introduced. The STM32L5 actually respects this Arm recommendations: Table 10.2: STM32L5 Memory Map - Overview region from..to Description C-Bus access region 0x0000 0000 .. 0x1FFF FFFF Access to flash, SRAM,… through C-Bus (with ICACHE) SRAM 1 and SRAM2 0x2000 0000 .. 0x3FFF 0000 Access to SRAM1 and 2 through S-Bus Peripherals 0x4000 0000 .. 0x5FFF 0000 Access to Peripherals FMC Bank 1 0x6000 0000 .. 0x7FFF 0000 Access to external memories managed through FSMC8 FMC Bank 3 and OCTOSPI 0x8000 0000 .. 0x9FFF 0000 Access to external memories managed through FSMC and OCTROSPI Private Peripheral Bus, System region 0xE000 0000 .. 0xFFFF FFFF Access to Cortex-M33 system control and debug. The memory map is divided into 512 MB sized regions, as Arm recommends for the system address map. The C-Bus access region is cached, where the first half of it is fixed (0x0000 0000-0x0FFF FFFF) and the other half can be used to remap external memories to be cached by ICACHE (0x1000 0000-0x1FFF FFFF). SRAM1 and SRAM 2 are accessible through the second 512 MB region (0x2000 0000 - 0x3FFF 0000). STM32L5x periperals are mapped to the region (0x4000 0000 - 0x5FFF 0000), wheras - in the Private Peripheral Bus region - Cortex-M33 peripherals and core registers are available (0xE000 0000 - 0xFFFF FFFF). Some more details on the PPB can be found in chapter 3.5. More on Arm Memory System: Chapter 10.2.4: STM32L5: Memory Map Chapter 3.5: Arm Architecture: Memory System 10.2.4.1 STM32L5: IDAU and SAU When TrustZone (TZEN=1 option byte) memory is either attributed as secure (S), non-secure (NS) or non-secure callable (NSC).The STM32L5 has one IDAU, which is used to further subdivide each of the regions from table 10.2 and attributes them to either NS and NSC areas, as you can see on figure 10.7. Figure 10.7: STM32L552xx IDAU memory mapping. [5, p. 87] More on Implementation Defined Attribution Unit: Chapter 4.5: IDAU and SAU: Security attribution Chapter 10.2.4: STM32L5: Memory Map STMicroelectronics decided not to predefine regions in IDAU as secure, but only split memory into NSC and NS. This leaves the choice to the developer to further decide which of the regions should be attributed secure (S). As mentioned in the basics chapter on TrustZone-M (see chapter 4), the division of secure and non-secure worlds is - in contrast to TrustZone-A - memory map based. That might be a little bit difficult to wrap the head around, so let’s look at an example how flash can be split up (the values are from example 1, see chapter 10.3.2): The STM32L5 has 512 KB Flash. Since we can address Flash bytewise, we need 0x0008 0000 addresses to address the whole Flash (512 * 1024). In figure 10.7 we see FLASH twice: 1: 0x0800 0000 - 0x0807 FFFF (NS) 2: 0x0C00 0000 - 0x0C07 FFFF (NSC) You can address whole Flash in both regions. When the system resets and TrustZone is enabled, whole memory (including 1 and 2) is secure by default. The next step for the developer is to configure SAU to downgrade up to 8 memory regions to either NSC or NS. In the IDAU and SAU security attribution logic, the highest of both attributes wins (see chapter 4.5). If a developer needs to define a NS region, she needs to downgrade a region in the SAU, which was also defined NS in IDAU (for the Flash example, that would be 1). The example downgrades two regions in the SAU for Flash: Non-Secure IDAU attributes flash at 0x0800 0000 to 0x0807 FFFF as NS The NS region in SAU is a subset of the NS region in IDAU, which is 0x0804 0000 to 0x0807 FFFF The rest of it is attributed as S, because SAU is per-default S. Because the other alias for Flash (region number 2) is attributed NSC in IDAU, you can’t downgrade it further than to NSC, so you need to choose region number 1 to define a NS region. Non-Secure Callable: IDAU attributes flash at 0x0C00 0000 to 0x0C07 FFFF as NSC. NSC region in SAU is a subregion of the NSC region in IDAU, which is 0x0c03 E000 to 0x0c03 ffff. The rest of it is attributed as S, because SAU is per-default S. Remember: On PoR, when TrustZone is enabled, whole memory is secure by default in SAU. This is configurable in the ALLNS bit of the SAU_CTRL register. (see chapter 7.2). This leaves the regions, which are not downgraded in the SAU, as Secure. This results in the final mapping of the whole 512 KB flash you can see on the far right on figure 10.7. Figure 10.8: Flash Mapping Example 1 More on Security Attribution Unit: Chapter 4.5: IDAU and SAU: Security attribution Chapter 5.3: CMSIS: ROM segment and Boot Process Chapter 7.2: SAU Initialization Chapter 10.2.4: STM32L5: Memory Map In CMSIS the setup of SAU is done in the parition_<device>.h (see on GitHub). (see 7.2). The final Flash security attribution: Table 10.3: SAU final memory map of example Type security attributes from..to description Flash NSC 0x0C03 E000 - 0x0C03 FFFF Flash NS 0x0804 0000 - 0x0807 FFFF Flash S 0x0C00 0000 - 0x0C03 DFFF 10.2.5 Global TrustZone Controller The Global TrustZone Controller is a block on a STM32L5, which contains subblocks and components releva"
