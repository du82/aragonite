full_description = '''Chapter 5 Bare-metal firmware build and boot process (CMSIS Core(M)) 5.1 Introduction The following chapter examines an bare metal firmware example, which is based on Cortex Microcontroller Software Interface Standard (CMSIS). CMSIS is a “vendor-independent hardware abstraction layer for microcontrollers that are based on Arm Cortex processors.” Chances are high that you are going to encounter CMSIS in your embedded research projects and even if not, the overall concepts shown here pretty much should be the same. Since the linker file is crucial for understanding the firmware layout, we are going to look into the linker file and the CMSIS source code in parallel and examine how they work together to form the firmware. We are examining a secure world firmware, but again: The concepts for non-secure and secure firmware are the same, non-secure side missing only the non-secure callable region. Topics and concepts covered in this chapter: The Boot process Initialization of the RAM layout (.data, .bss) Setup of the stack and heap Setup the non-secure callable region The following example is based on a STM32L5 SoC, however it is only used to have a descriptive, real-world example with real memory addresses to explain the concepts. Everything covered here is very similar for other systems and vendors. 5.2 Memory segments In the following chapter we will walk through an actual linker script, which is used in example-stm32-p1. The linker files for non-secure and secure world are pretty similar, so we’ll leave the detailed examination of the non-secure linker script as a task to the reader and only examine the secure world linker script. Let’s assume that we have decided to use the following memory map for our firmware: Table 5.1: secure / non-secure callable regions in an example system Type Segment Name security attributes from..to section overview Flash ROM_NSC NSC 0x0C03 E000 - 0x0C03 FFFF Explored in chapter 5.2.3 Flash ROM S 0x0C00 0000 - 0x0C03 DFFF Explored in chapter 5.2.1 SRAM RAM S 0x3000 0000 - 0x3001 7FFF Explored in chapter 5.2.2 The system memory map is predefined at a high level by Arm for M-profile architectures: See chapter 3.5. The further separation of the memory map into secure / non-secure / NSC depends on SoC design and configuration. An example where on bit[28] of the address is used to define the security attribution of the respective memory address, is shown in 4.5. More on Linker Script: Chapter 2.11: Linker Script Chapter 5.2: CMSIS: Memory segments Chapter 5.6: CMSIS: Heap and Stack Let’s start our examination of the secure world linker script on the very top. The following code block shows the beginning of the script: → example-stm32-p1(/P1_TZEN/Secure/STM32L552ZETXQ_FLASH.ld) /* Entry Point */ ENTRY(Reset_Handler) /* Highest address of the user mode stack */ _estack = ORIGIN(RAM) + LENGTH(RAM); /* end of "RAM" Ram type memory */ _Min_Heap_Size = 0x200 ; /* required amount of heap */ _Min_Stack_Size = 0x400 ; /* required amount of stack */ /* Memories definition */ MEMORY { RAM (xrw) : ORIGIN = 0x30000000, LENGTH = 96K /* Memory is divided. Actual start is 0x30000000 and actual length is 256K */ ROM (rx) : ORIGIN = 0x0C000000, LENGTH = 248K /* Memory is divided. Actual start is 0x0C000000 and actual length is 512K */ ROM_NSC (rx) : ORIGIN = 0x0C03E000, LENGTH = 8K /* Non-Secure Call-able region */ } The ENTRY commands sets the entry point of the executable object file, which is the location where program execution starts. In M-profile cores the execution starts at whatever value is loaded into PC in the Reset Vector. In the present example the system starts executing at 0x0C00.0000. _estack defines a symbol and calculates the address where the initial stack pointer will point to. Loading the initial stack pointer into SP is the very first thing the core does after coming out of reset. The initial stack pointer value is the topmost value in the vector table, just before the Reset Vector address. More on Stack: Chapter 5.6: CMSIS: Heap and Stack Chapter 3.4: Arm Architecture: Execution Modes and Privilege Levels Chapter 3.7: Arm Architecture: General-Purpose registers, special-purpose registers Chapter 6.2: AAPCS: Subroutine Call In table 5.1 we defined three memory regions, segments, where code and data should be placed into. The MEMORYcommand defines these three segments. Chapter 5.2.1, chapter 5.2.2 and chapter 5.2.3 each describe one of the three segments by showing which input sections are written into the particular segment and what their purpose is. Chapter 5.2.1 examines the segment “ROM.” Chapter 5.2.2 examines the segment “RAM.” Chapter 5.2.3 examines the segment “ROM_NSC.” Let’s quickly recap the relation between an object file’s input regions, output regions and segments: Figure 5.1: connection between object file input regions, output regions and segments More on Linking: Chapter 2.9: Relocation Chapter 2.10: Veneers Chapter 2.11: Linker Script Chapter 5.3: CMSIS: ROM segment and Boot Process 5.2.1 ROM segment The following output sections are written into the ROM segment: Table 5.2: ROM output sections output section explanation .isr_vector Vector Table. Important part of boot process. See chapter @ref(sec:stm32i-firmware-boot-process. .text This output section combines the following input sections: - .text: compiled and assembled code. - glue_7 and glue_7t. See chapter 2.12. - .init and .fini. Libc related functions, see chapter 5.3. .rodata Constants in the code. .ARM and .ARM.extab These sections contain information for unwinding the stack, when an Exception is thrown in C++. For C-Projects these should be empty. .preinit_array, .init_array, .fini_array Libc related functions. See chapter 5.3 for details. .data initialized objects with static storage duration. Explored in chapter 5.3 More on Section: Chapter 2.7: Sections Chapter 2.7.3.1: .data section Chapter 2.7.3.2: .bss section Chapter 2.8: Literal Pool 5.2.2 RAM segment The following output sections are written into the RAM segment: Table 5.3: RAM output sections section explanation .data Details discussed in chapter 5.3 and chapter 5.6 ._user_heap_stack Details discussed in chapter 5.6 .bss Details discussed in chapter 5.3 More on Section: Chapter 2.7: Sections Chapter 2.7.3.1: .data section Chapter 2.7.3.2: .bss section Chapter 2.8: Literal Pool 5.2.3 ROM_NSC segment The following output sections are written into the ROM_NSC segment: Table 5.4: ROM_NSC output sections section explanation .gnu.sgstubgs See chapter 5.4 More on Secure function calls: Chapter 5.4: CMSIS: Non-Secure Callable segment Chapter 6.2: AAPCS: Subroutine Call Chapter 4.4.1: Banked Registers Chapter 7.3: Details: Secure function call Chapter 4.6.1: Overview: Secure function call 5.3 ROM segment and Boot Process Terms explained in this chapter: .word .weak Load Memory Address (LMA) Virtual Memory Address (VMA) We defined the address where the system starts executing to be 0x0C00.0000, which corresponds to the address ROM region will be loaded to. Since the linker script is processed from top to bottom, the very first input region the linker will write into ROM segment is the output section .isr_vector → example-stm32-p1(P1_TZEN/Secure/STM32L552ZETXQ_FLASH.ld) SECTIONS { /* The startup code into "ROM" Rom type memory */ .isr_vector : { . = ALIGN(8); KEEP(*(.isr_vector)) /* Startup code */ . = ALIGN(8); } >ROM More on Vector Table: Chapter 3.6: Arm Architecture:Exceptions, Interrupts, Faults Chapter 5.3: CMSIS: ROM segment and Boot Process The section .isr_vector is defined in the CMSIS Startup file named startup_<device >.s: → example-stm32-p1(P1_TZEN/Secure/Core/Startup/startup_stm32l552zetxq.s) .section .isr_vector,"a",%progbits .type g_pfnVectors, %object .size g_pfnVectors, .-g_pfnVectors g_pfnVectors: .word _estack .word Reset_Handler .word NMI_Handler → example-stm32-p1(P1_TZEN/Secure/Core/Startup/startup_stm32l552zetxq.s) .weak NMI_Handler .thumb_set NMI_Handler,Default_Handler .weak HardFault_Handler .thumb_set HardFault_Handler,Default_Handler More on Assembler Terms: Chapter 2.4.1: Assembler Terms The label g_pfnVectors: marks the beginning of the exception vector list, which consists of .word <exception vector symbol name> directives. The .word directive reserves space and defines the symbol at hand. In startup_<device>.s each of the exception vectors is defined as a .weak symbol, which makes sure that the Default_Handler is only used when there is no other symbol defined with the same name in any of the other linked object files. Hence, to implement an exception vector you just have to define a function with the particular exception vectors name, you want to implement. This will overwrite the weak bound DefaultHandler. If an exception handler is not implemented, the DefaultHandler will be used. The Reset_Handler for example is defined in the startup_<device>.s file (see below.) _estack, the topmost value in the vector table, is the initial value of the main stack pointer. This symbol was defined in the very beginning of the linker script. See chapter 5.2. More on Stack: Chapter 5.6: CMSIS: Heap and Stack Chapter 3.4: Arm Architecture: Execution Modes and Privilege Levels Chapter 3.7: Arm Architecture: General-Purpose registers, special-purpose registers Chapter 6.2: AAPCS: Subroutine Call More on Vector Table: Chapter 3.6: Arm Architecture:Exceptions, Interrupts, Faults Chapter 5.3: CMSIS: ROM segment and Boot Process Now that we know how the exception vectors are set up, let’s look what happens on reset. The core is set up to start executing at 0x0C00 0000. On reset the first thing is to pop the first value from the vector table, which is the main stack pointer, into the SP register (vector_table[0]). Then the second entry in the vector table (vector_table[1]), which is the Reset_Handler, is called. The core register VTOR can be used to relocate the vector table from a default to a new base address. ArmV8-M core support that features, but in Armv6-M VTOR is fixed at 0x0000.0000 and can’t be changed. Some SoC designers fix that by implementing a remapping feature in their bootloader. → example-stm32-p1(P1_TZEN/Secure/Core/Startup/startup_stm32l552zetxq.s) .section .text.Reset_Handler .weak Reset_Handler .type Reset_Handler, %function Reset_Handler: ldr sp, =_estack /* set stack pointer */ /* Copy the data segment initializers from flash to SRAM */ movs r1, #0 b LoopCopyDataInit CopyDataInit: ldr r3, =_sidata ldr r3, [r3, r1] str r3, [r0, r1] adds r1, r1, #4 LoopCopyDataInit: ldr r0, =_sdata ldr r3, =_edata adds r2, r0, r1 cmp r2, r3 bcc CopyDataInit ldr r2, =_sbss b LoopFillZerobss /* Zero fill the bss segment. */ FillZerobss: movs r3, #0 str r3, [r2], #4 LoopFillZerobss: ldr r3, = _ebss cmp r2, r3 bcc FillZerobss /* Call the clock system intitialization function.*/ bl SystemInit /* Call static constructors */ bl __libc_init_array /* Call the application's entry point.*/ bl main LoopForever: b LoopForever .size Reset_Handler, .-Reset_Handler Reset_Handler starts and sets up the .data and .bss sections: copy the .data section from flash into SRAM (CopyDataInit: and LoopCopyDataInit:) initialize .bss with zeros in SRAM The symbol _sidata holds the address in flash, where the .data is going to be written to when the system is flashed The symbols _sdata and _edata on the other side hold the start and end address of the region in SRAM, where .data is being loaded to by the Reset_Handler in the startup code. The labels CopyDataInit: and LoopCopyDataInit: mark routines which copy .data data from flash into SRAM. → example-stm32-p1(P1_TZEN/Secure/STM32L552ZETXQ_FLASH.ld) /* Used by the startup to initialize data */ _sidata = LOADADDR(.data); /* Initialized data sections into "RAM" Ram type memory */ .data : { . = ALIGN(8); _sdata = .; /* create a global symbol at data start */ *(.data) /* .data sections */ *(.data*) /* .data* sections */ . = ALIGN(8); _edata = .; /* define a global symbol at data end */ } >RAM AT> ROM In many systems there are different types of memory, most often flash and RAM. Firmware is programmed into flash and during reset the system is initialized and some data is copied from flash into RAM, e.g. the .data section. The linker supports this notion by allowing to differentiate between a Virtual Memory Address (VMA) and a Load Memory Address (LMA). The former is the address where data is loaded to and the latter is the address where data is loaded from. In systems where the whole ELF file is loaded into RAM LMA and VMA do not differ, which is the case on your personal computer at home for example. By specifying >RAM AT> ROM, we define that .data is loaded from ROM into RAM. The linker can then use LOADADDR() to access the LMA of a symbol. In our example the startup code in the reset handler uses the LMA of _sidata to retrieve the address where from to read .data. → example-stm32-p1(P1_TZEN/Secure/Core/Startup/startup_stm32l552zetxq.s b LoopCopyDataInit CopyDataInit: ldr r3, =_sidata ldr r3, [r3, r1] str r3, [r0, r1] adds r1, r1, #4 LoopCopyDataInit: ldr r0, =_sdata ldr r3, =_edata adds r2, r0, r1 cmp r2, r3 bcc CopyDataInit The two routines initialize R3 with the LMA and R0 with the VMA of .data. CopyDataInit: starts at the LMA loads word by word relative to R3 and stores it relative to R0 into RAM. The offset used in R0 and R3 and number of words copied is tracked in R1 and the loop finishes as soon as all words are copied. Next up is the .bss section: → example-stm32-p1(P1_TZEN/Secure/STM32L552ZETXQ_FLASH.ld) /* Uninitialized data section into "RAM" Ram type memory */ . = ALIGN(8); .bss : { /* This is used by the startup in order to initialize the .bss section */ _sbss = .; /* define a global symbol at bss start */ __bss_start__ = _sbss; *(.bss) *(.bss*) *(COMMON) . = ALIGN(8); _ebss = .; /* define a global symbol at bss end */ __bss_end__ = _ebss; } >RAM We already learned in chapter 2 that .bss does not hold any data. All variables in .bss are initialized with zero, as you can see for yourself in the routines labeled FillZerobss and LoopFillZerobss in the startup code: → example-stm32-p1(P1_TZEN/Secure/Core/Startup/startup_stm32l552zetxq.s ldr r2, =_sbss b LoopFillZerobss /* Zero fill the bss segment. */ FillZerobss: movs r3, #0 str r3, [r2], #4 LoopFillZerobss: ldr r3, = _ebss cmp r2, r3 bcc FillZerobss The startup code uses the symbols provided in the linker script which defined the start (_sbss) and end address ( _ebss) of the output section .bss to initialize the section in RAM with zero. Nothing is loaded from flash. After initializing .data and .bss, Reset_Handler proceeds and jumps to SystemInit, which initializes SAU (details in chapter 7.2) and VTOR for NS world. Before jumping to main __libc_init_array is called, which in turn calls all libc initialization functions located in the section .preinit_array, .init_array and .init. These were also written by the linker into the ROM section: → example-stm32-p1(example-s'''
