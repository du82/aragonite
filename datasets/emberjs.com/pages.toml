full_description = "The Team Behind Ember Ember is an Open Source project that relies on the tireless support of individual contributors. These are the teams that guide the development and instruction of Ember.js. The Steering Committee The Steering Committee is responsible for the overall governance of the Ember project. Yehuda Katz Leah Silber Matthew Beale Edward Faulkner Katie Gengler Melanie Sumner Kenigbolo Meya Stephen The Ember.js Framework Core Team Yehuda Katz Tom Dale Peter Wagenet Leah Silber Matthew Beale Edward Faulkner Ricardo Mendes Katie Gengler Melanie Sumner The Ember Tooling Core Team The Ember Tooling core team is responsible for maintaining ember-cli, Embroider, Glint, Ember's TypeScript integration, and anything related to the Ember build system. The team also maintains many of the addons in the default blueprint as well as fastboot. Peter Wagenet Edward Faulkner Katie Gengler Kelly Selden Chris Manson James Davis Krystan HuffMenne Aaron Chambers Preston Sego Simon Ihmig Peter Meehan The Ember Data Core Team The Ember Data core team is responsible for the official data persistence library for Ember.js applications. Chris Thoburn Krystan HuffMenne Rich Glazerman Kirill Shaplyko The Ember Learning Core Team The mission of the Ember Learning core team is to empower Ember users to learn, build and teach. This team is responsible for keeping the guides and API documentation updated, and manages the initiatives that support learning Ember. Leah Silber Ricardo Mendes Jen Weber Chris Manson Robbie Wagner Jared Galanis Anne-Greeth Schot-van Herwijnen Ignace Maes Emeritus Serving as a member of the Core Team(s) of an open source project like Ember is a huge amount of work. These are the emeritus members of the Ember Core Teams, to whom we will always be grateful. Trek Glowacki Erik Bryn Kris Selden Stefan Penner Alex Matchneer Robert Jackson Igor Terzic Martin Muñoz Brendan McLoughlin David Baker Chad Hietala Todd Jordan Christoffer Persson Dan Gebhardt