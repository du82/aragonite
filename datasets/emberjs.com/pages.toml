["https://emberjs.com/community/meetups-getting-started"]
title = "Getting Started - Community - Ember.js"
description = "Ember.js helps developers be more productive out of the box. Designed with developer ergonomics in mind, its friendly APIs help you get your job done—fast."
full_description = "Getting Your Meetup Up and Running Running an Ember User Group can be challenging, but really rewarding: thanks so much for stepping up! We're here to help however we can. The three main things to do for your first user group meetup are: Find a location to meet Find one or two willing speakers Find interested people Location Many software companies are willing to sponsor meetups in their conference rooms or common spaces—they're a good place to start asking. Other meetups have had good results with reserving space in restaurants, pubs and co-working spaces—just make sure they have the A/V equipment you need, a wireless network powerful enough to host your audience, and ideally ample power as well. Note that when a company donates space, they're usually expecting to receive a sponsor/host shout out on the site and in person in exchange. Speakers Ideally, speakers are local and can talk about their experiences with Ember; if you're having trouble finding a speaker, let us know and we can try and set up a remote session with a member of the Core Team or other talented community member. We definitely recommend having only one speaker per meetup from any single company, as otherwise it can start to feel kinda corporate-sales-pitchy :p Attendees Hopefully, you know at least a few people who are interested in joining the user group. Most of us have been using Meetup.com to organize our groups, and it's been very effective. Most meetups spread by word of mouth, but we'll be sure to tweet about your new group to help get you the attention and attendance you need, if you let us know. Lastly, definitely go around to other relevant tech meetups in the area to talk about starting the new group. That's definitely your market right there. Sponsorship Considering that many groups are able to do most of the above for free, sponsorship is not always necessary... but it can be a good way to help cover costs and extras. At our SF and Portland meetups we seek out sponsors for space and food (we find that Pizza and Beer help increase attendance dramatically... no surprise there). If you've got some local sponsors you could talk to, here are some of the other things you might want to ask them for help with: Meetup.com fees Event space Food, drinks and snacks If you're able to raise additional cash, that's even better. Some of the most successful meetup groups we've worked with over the years (not necessarily Ember) have been able to raise enough funds to periodically fly in core team members or other bigwig speakers. On a smaller scale, you could always get swag made (as in, Ember or Meetup branded swag, versus the sort of things sponsors might give you with their branding). It's not at all required, but worth thinking about and planning for if you have options / funding. Some Other Tidbits For more content like this, check out @wifelette's blog post; much of the same content, but some new tips and tricks. Check out Meetup Resources page for help with art and assets for your Group. We don't have a ton of funding yet on the central side of things, but we do have some Tomster stickers! Send us a mailing address once you've got your first meetup scheduled and we can send some your way. There's an Ember Meetup Organizers google group that we can add you to once things start getting real (instructions on the Resources Page). Can be a really great resource for helping with the path forward. You can add your group to the Meetups page / directory on the Ember website once you're up and running (just submit a PR). Keep us in the loop—we’re excited to see Ember Meetups starting up all around the globe! And if you have questions or have other ideas for how we can help, reach out to Leah. We look forward to hearing from you."
