full_description = '''LTS Channel Long Term Support (LTS) releases receive bugfixes and security updates for an extended period. How to Install Ember # Install Ember 5.12.0: npm install --save-dev ember-source@~5.12.0 Read the changelog for Ember 5.12.0. Ember Data # Install Ember Data 5.3.0: npm install --save-dev ember-data@~5.3.0 Read the changelog for Ember Data 5.3.0. What is an LTS release? Once a release of Ember gets promoted to LTS, it receives bugfixes for 36 weeks and security updates for 54 weeks. An LTS release is the best version to use if you won't be updating your app frequently, but want to help your app stay secure and working smoothly. Another reason to use an LTS is if you have a very large, complex app, since LTS versions get even more testing and scrutiny than usual. An LTS is declared roughly every 4 minor versions, excluding the x.0 minor version. The last minor version before the next major release is also considered to be an LTS. For example, in Ember 2.x, the following versions were considered LTS's: 2.4, 2.8, 2.12, 2.16, and 2.18 (last version). Before a version can be called an "LTS" release, it has to spend at least 6 weeks as a stable release, where it is used and tested by thousands of developers. A complete release history for Ember is available on GitHub. LTS schedule Ember currently supports these LTS versions for Ember.js and Ember Data. Zoey says... EmberData made updates to its versioning strategy that mean it may maintain separate LTS versions from Ember.js. You can read more about the updates on the Ember Blog. Ember.js LTS Version Promotion date Bugfixes until Security patches until Status 5.12 September 30, 2024 April 28, 2025 October 13, 2025 Active 5.8 June 3, 2024 December 30, 2024 June 16, 2025 Active 5.4 December 11, 2023 July 8, 2024 December 23, 2024 End of life 4.12 May 14, 2023 December 10, 2023 May 26, 2024 End of life 4.8 December 8, 2022 July 6, 2023 December 21, 2023 End of life 4.4 July 13, 2022 February 8, 202