["https://emberjs.com/mascots/faq"]
title = "Ember.js"
description = "Ember.js helps developers be more productive out of the box. Designed with developer ergonomics in mind, its friendly APIs help you get your job done—fast."
full_description = "Tomster FAQ Can I use the Tomster for my product/website/company/etc.? Can I use it for my avatar/Twitter photo/OKCupid headshot/etc? Can you make a Tomster that looks like [insert thing here]? Can I make my own Tomster? Can I modify the Tomster? Do you own the Trademark to Ember and the Tomster? Who designed the original Tomster? Can I use the Tomster for my product/website/company/user group/conference/etc.? The Tomster is a registered trademark, and more importantly, a big part of our identity! He may not be used for any unofficial purposes without us granting a specific license. There are different processes whereby companies, community efforts and user groups can commission specific Tomsters and be granted license to use them. It’s affordable and easy, though we’re picky about approvals. To tell us more about your request, reach out. Can I use it for my avatar/Twitter photo/OKCupid headshot/etc? See the previous question as well. Please do not use the Tomster for anything without specific permission. Besides: you’re lovely! And also (probably) not a hamster. You can find something better <3 Can you make a Tomster that looks like [insert thing here]? Maybe! Ember is an open source project with little by way of funding, so for now, Tomsters are made as they’re needed, rather than any time a fun idea comes up (because trust us, there are LOTS of good ideas!). You’re welcome to toss us a note with an idea or request, but for right now, assume they’re designed by necessity or commissions only. Can I make my own Tomster? A big friendly and polite… absolutely not :p The Tomsters are all made in-house by a small number of official Tomster Designers we work directly with and trust to help us keep the brand and image in the right place. We’re very protective of him; please don’t customize, manipulate or otherwise commandeer our identity and assets. Can I modify the Tomster? Alas, you may not. This includes adding things to any of the illustrations, photoshopping them with other images, adding logos, removing parts, etc. Do you own the Trademark to Ember and the Tomster? We do indeed! Who designed the original Tomster? The Tomster was originally designed by the fabulous Lindsey Wilson, as part of a set of illustrations we had made for the first Ember website. From there he rapidly grew into the iconic Tomster you know today :) Lindsey has also designed something like 90% of the other Tomsters in existence. Contact Leah for any Tomster-related questions or commission requests. If you want to hire Lindsey for non Ember related work, please do! She’s great. Really."
year_published = 2025
