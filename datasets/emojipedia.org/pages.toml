full_description = "Emoji MeaningEmoji DesignsTechnical Information🤎CopyBrown HeartA brown heart emoji. As with the other color-based hearts, this emoji is often also used to express an affinity with or appreciation for various people, places, groups, objects, or ideas associated with the same color. For example, this emoji has been found to often be used to discuss topics related to racial identity. As of February 2021, this emoji was the least used of the nine colored hearts that existed at that time (the others being ❤️, 🧡, 💛, 💚, 💙, 💜,🖤, and 🤍).Brown Heart was approved as part of Unicode 12.0 in 2019 and added to Emoji 12.0 in 2019.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With❤️🩷🧡💛💚💙🩵💜🖤🩶🤍✊🪧🟤🟫🖤Juneteenth💘Valentine’s DayEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
