full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup😵CopyFace with Crossed-Out EyesA yellow face with X’s for eyes and a round, open mouth. Often depicted with raised or furrowed eyebrows. Facebook’s design features a purple forehead. Previously displayed with spiral eyes on some platforms. May convey a heightened or hyperbolic sense of such feelings as shock, surprise, disbelief, awe, and amazement, as if staggered to the point of disorientation (i.e., dizzy). May also represent sickness, nausea, intoxication, and death, e.g., slang I’m dead! Not to be confused with 😲 Astonished Face, which previously featured X-shaped eyes on several platforms, nor 😵‍💫 Face with Spiral Eyes which consistently displays spiral eyes on all platforms. Unlike other vendors, Huawei's design features a 💫 Dizzy symbol atop this emoji's head.Face with Crossed-Out Eyes was approved as part of Unicode 6.0 in 2010 under the name "Dizzy Face" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😵‍💫😟😮😯😲😦😰😫💫🌀✖️❌❎Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
