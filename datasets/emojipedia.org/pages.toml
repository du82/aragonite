description = "A heart symbol emoji,&nbsp;used in card games&nbsp;for the hearts&nbsp;suit. In emoji form, this is most commonly used for love, affectiction, romance and posit..."
full_description = '''Emoji MeaningEmoji DesignsTechnical Information♥️CopyHeart SuitA heart symbol emoji, used in card games for the hearts suit. In emoji form, this is most commonly used for love, affectiction, romance and positive intentions. Sometimes shown in a slightly darker shade of red than ❤️ Red Heart. Apple's design previously displayed the heart symbol on a white playing card. Note: the Unicode Character Database (UCD) name “Black Heart Suit” pre-dates color emoji, when the term referred to a solid, black ♥ heart suit character. See the glossary for information on the term black in Unicode character names.Heart Suit was approved as part of Unicode 1.1 in 1993 under the name "Black Heart Suit" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With❤️🖤🎲♠️♦️♣️🃏🎴♡Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
