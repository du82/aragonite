["https://emojipedia.org/snapchat"]
title = "👻 Snapchat Emoji Meanings — 💛 Friend"
description = "What the Snapchat emojis mean: 🌟 Gold Star, 💛 Yellow Heart, ❤️ Red Heart, 💕 Pink Hearts, 😬 Grimacing Face, 😎 Sunglasses, 😏 Smirk, 😊 Smile, 🔥 Fire, 💯 Hu..."
full_description = '''SnapchatSnapchatWondered “what do the emojis mean on Snapchat?” Emojis appear next to Snapchat contact names and have the following meanings: 🌟 Gold Star — Someone has replayed this person's snaps in the past 24 hours. They must have something interesting to show. 💛 Yellow Heart — You are #1 best friends (#1 BFs) with each other. You send the most snaps to this person, and they send the most snaps to you. ❤️ Red Heart — You have been #1 BFs with each other for two weeks straight. 💕 Pink Hearts — You have been #1 BFs with each other for two months straight. Dedication! freestar.config.enabled_slots.push({ placementName: "Emojipedia_MREC_middle_Snapchatpage", slotId: "Emojipedia_MREC_middle_Snapchatpage" }); 👶 Baby — You just became friends with this person. 😎 Face With Sunglasses — One of your best friends is one of their best friends. This means that you send a lot of snaps to someone that they also send a lot of snaps to. 😬 Grimacing Face — Your #1 best friend is their #1 best friend. You send the most snaps to the same person that they do. Awkward. 😏 Smirking Face — You are one of their best friends…but they are not a best friend of yours. You don’t send them many snaps, but they send you a lot of snaps. 😊 Smiling Face — Another best friend of yours. You send this person a lot of snaps. Not your #1 best friend, but they are up there. 🔥 Fire — You are on a Snapstreak! You have snapped this person every day, and they have snapped you back. Increases with number of consecutive days. 💯 Hundred — 100 Day Snapstreak. The 100 emoji appears next to the fire when you snap back and forth with someone for one hundred days in a row. ⌛ Hourglass — Your Snapstreak is about to end. Quickly send another snap to keep it alive. 🎂 Birthday Cake — This friend has a birthday today. Only displays if friend has the Birthday Party feature enabled in settings. Purple Zodiac Emojis Users who have their birthday saved in Snapchat get a small purple emoji next to their name, corresponding to the relevant zodiac symbol for their date of birth. Each zodiac emoji next to a Snapchat friend name represents a birthday in the following date ranges: ♈ Aries — March 21 - April 20 ♉ Taurus — April 21 - May 21 ♊ Gemini — May 22 - June 21 ♋ Cancer — June 22 - July 22 ♌ Leo — July 23 - August 22 ♍ Virgo — August 23 - September 23 ♎ Libra — September 24 - October 23 ♏ Scorpius — October 24 - November 22 ♐ Sagittarius — November 23 - December 21 ♑ Capricorn — December 22 - January 20 ♒ Aquarius — January 21 - February 19 ♓ Pisces — February 20 - March 20 freestar.config.enabled_slots.push({ placementName: "Emojipedia_MREC_lowermiddle_Snapchatpage", slotId: "Emojipedia_MREC_lowermiddle_Snapchatpage" }); Chat Status A smiling face emoji or Bitmoji appears as a status in chat to indicate the recipient has returned to view the chat. This changes to a blue unread-style dot when the recipient remains currently active. Verification Emojis previously showed next to Snapchat stories, as a way to verify accounts. This has been replaced by a star. Snapchat Icon Meanings Snapchat has other icons that appear in the interface. These are not emojis, but provide additional information about your snaps. Sent Icons Snap sent without sound Snap sent with sound Chat message sent Opened Icons Friend opened a Snap without sound Friend opened a Snap with sound Friend opened a Chat message Friend viewed and received Cash Received Icons You received a Snap without sound You received a Snap with sound You received a Chat message Viewed Icons Your Snap sent without sound has been viewed Your Snap sent with sound has been viewed Your Chat message has been viewed Screenshot Icons Your Snap sent without sound has been viewed Your Snap sent with sound has been viewed Your Chat message has been viewed Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
