["https://emojipedia.org/skype"]
title = "Skype Emoticons"
description = "Emoticons and emojis used in Skype and Microsoft Teams."
full_description = "Skype200420152004Swipe to see emojis from other periods2015SkypeSkype has a series of emoji-like emoticons which have their own distinct animated appearance. A subset of Skype emoticons were available in Microsoft Teams before the 3D versions of Microsoft's new Fluent emoji set began rolling out in February 2022. The Skype emoticon set differs from the emoji set from parent company Microsoft, which is used as the system-wide emoji font in Windows 10. Skype uses its own system of shortcodes to enter each emoticon, for instance: :^) = 🤨 (cwl) = 😂 (stareyes) = 🤩 These shortcodes are replaced by the emoticon within Skype. If using a Unicode-compatible emoji code point, this will be given the system-wide emoji appearance: Microsoft set on Skype for Windows, Apple set on Skype for macOS or iOS, Samsung set on phones using OneUI. The majority of Skype Emoticons have equivalents in the Unicode Standard, while a number of emoticons go beyond what is offered by the standardized emoji set. For example, Skype's offers variety of additional pride-related flags alongside 🏳️‍🌈 Pride and 🏳️‍⚧️ Transgender Flag, such as those shown below. Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
