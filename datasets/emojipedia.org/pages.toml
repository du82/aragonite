full_description = "Emoji MeaningEmoji DesignsTechnical Information🧨CopyFirecrackerA firecracker, as lit on Chinese New Year, New Year's Eve, or Independence Day. Depicted as a red tube with a burning fuse, sometimes lined with gold rings at its top and base. Often used with 🎆 Fireworks and 🎇 Sparkler for various celebrations and holidays. Also applied to figurative senses of fire, e.g., slang hot, on fire (“excellent”). While it may resemble a stick of dynamite on some platforms, several vendor designs, such as Google and Twitter's, suggest the emoji is modeled after traditional Chinese firecrackers, as are strung together and lit on such occasions as Chinese New Year.Firecracker was approved as part of Unicode 11.0 in 2018 and added to Emoji 11.0 in 2018.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🤯💖💥🐲🐉🥮🎆🎇✨🧧🔫🕯️💣🧯🇨🇳🎊New Year’s Eve🇺🇸Independence Day🐲Chinese New YearEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
