description = "A&nbsp;fingers crossed emoji which&nbsp;displays&nbsp;the&nbsp;index (first) finger crossed over the&nbsp;middle (second)&nbsp;finger. Commonly used as a gestur..."
full_description = '''Emoji MeaningEmoji DesignsTechnical Information🤞CopyRelated EmojiCrossed FingersA fingers crossed emoji which displays the index (first) finger crossed over the middle (second) finger. Commonly used as a gesture indicating luck, or to show desire of a favorable outcome. This emoji was previously displayed with an additional finger on Samsung devices.Crossed Fingers was approved as part of Unicode 9.0 in 2016 under the name "Hand with Index and Middle Fingers Crossed" and added to Emoji 3.0 in 2016.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🤥💗💓👋🖖🤏✌️🖕☝️🍀🎋🔜🎌Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
