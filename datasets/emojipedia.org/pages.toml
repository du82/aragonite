As with other color-based shape emojis (most notably the hearts), this emoji may be used to express an affinity wi..."""
full_description = '''Emoji MeaningEmoji DesignsTechnical Information🟩CopyGreen SquareA square shown in the color of green. As with other color-based shape emojis (most notably the hearts), this emoji may be used to express an affinity with or appreciation for various people, places, groups, objects, or ideas associated with the same color. When players of the word game Wordle share their results on social platforms the results are represented through a series of green, yellow, and black or white square emojis. This emoji indicates that the player guessed a correct letter in its right place. Additionally, in May 2021, this emoji was occasionally shown in X/Twitter names in support of Taproot, a Bitcoin fork (potential feature change) that would allow additional privacy measures for transactions.Green Square was approved as part of Unicode 12.0 in 2019 under the name "Large Green Square" and added to Emoji 12.0 in 2019.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With💚🌲🍏🥬🥗📗🟢🟥🟨🟦🟪🟫⬛⬜₿Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
