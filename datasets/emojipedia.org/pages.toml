full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup😰CopyAnxious Face with SweatA face with open eyes and a small, open frown. Its eyebrows are furrowed, with a single bead of cold sweat dripping down, and its forehead is pale blue, as if experiencing a cold flash. Samsung's design shows upper teeth and tongue. Meaning widely varies, but commonly conveys such feelings as sadness, disappointment, fear, and anxiety. Similar to 😥 Sad but Relieved Face, but with a blue head and larger frown. Not to be confused with 😢 Crying Face, 😪 Sleepy Face, or other emojis with tear or sweat droplets. Microsoft and Samsung previously featured smileys that appeared more excited in expression.Anxious Face with Sweat was approved as part of Unicode 6.0 in 2010 under the name "Face with Open Mouth and Cold Sweat" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😅🫣🤐😬😔🤤🥵😵😟🙁☹️😮😯😳😥😢😭😱😓😩😫👻🙀😿💦💧Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
