full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup😄CopyGrinning Face with Smiling EyesA yellow face with smiling eyes and a broad, open smile, showing upper teeth and tongue on some platforms. Often conveys general happiness and good-natured amusement. Similar to 😀 Grinning Face and 😃 Grinning Face With Big Eyes, but with warmer, less excited eyes. This emoji has a cat variant, 😸 Grinning Cat Face With Smiling Eyes.Grinning Face with Smiling Eyes was approved as part of Unicode 6.0 in 2010 under the name "Smiling Face with Open Mouth and Smiling Eyes" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😀😃😁😆😅🤣🙂😊😇😍🤩☺️😙🥲🤗🤠😎😈💩😺😸🤳😄HappyEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
