full_description = '''Emoji MeaningEmoji DesignsTechnical Information🙏CopyRelated EmojiFolded HandsTwo hands placed firmly together, meaning please or thank you in Japanese culture. A common alternative use for this emoji is for prayer, using the same gesture as praying hands. It can also represent a respectful greeting or show of adoration many in Southeast Asian religions and cultures, such as the Hindu namaste or Buddhist añjali mudra. Rarely used as a high-five, despite often being suggested as one by emoji keyboard search features. More about this emoji and its possible meanings. A previous version of this emoji displayed a yellow burst of light behind the two hands on iOS. Android once showed a blob-character with closed eyes and folded hands.Folded Hands was approved as part of Unicode 6.0 in 2010 under the name "Person with Folded Hands" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😇☺️🫡😌😔🥺🥹😢💖💙🩵🤍💥💭👋👌✊🙌👐🤲🤝🙇🙇‍♂️🙇‍♀️🧎🧎‍♂️🧎‍♀️🧎‍➡️🧎‍♀️‍➡️🧎‍♂️‍➡️🦃🍽️⛪🕋✨📿🕯️🛐✝️🦃Thanksgiving👋GesturesEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
