full_description = "201520252015Swipe to see emojis from other periods2025Emoji Version 12.0Emoji 12.0 was the first set of new emojis approved for release in 2019. Additions included new colored squares, circles, and hearts as well as a diving mask, hindu temple, and flamingo. Accessibility emojis proposed by Apple in 2018 are also included in this release, as well as a gender inclusive couple with support for mixed skin tones for those holding hands. A total of 230 new emojis were introduced in Emoji 12.0. See also: Emoji 12.1 which was a supplementary update in late 2019 and Emoji 13.0 which is the new emoji list for 2020. 📰 More About Emoji 12.0 ▶️ All 230 New Emojis For 2019 (video, sample images) 📋 Unicode Emoji 12.0 Data Files New Emojis in Version 12.0🥱Yawning Face🤎Brown Heart🤍White Heart🤏Pinching Hand🤏🏻Pinching Hand: Light Skin Tone🤏🏼Pinching Hand: Medium-Light Skin Tone🤏🏽Pinching Hand: Medium Skin Tone🤏🏾Pinching Hand: Medium-Dark Skin Tone🤏🏿Pinching Hand: Dark Skin Tone🦾Mechanical Arm🦿Mechanical Leg🦻Ear with Hearing Aid🦻🏻Ear with Hearing Aid: Light Skin Tone🦻🏼Ear with Hearing Aid: Medium-Light Skin Tone🦻🏽Ear with Hearing Aid: Medium Skin Tone🦻🏾Ear with Hearing Aid: Medium-Dark Skin Tone🦻🏿Ear with Hearing Aid: Dark Skin Tone🧏Deaf Person🧏🏻Deaf Person: Light Skin Tone🧏🏼Deaf Person: Medium-Light Skin Tone🧏🏽Deaf Person: Medium Skin Tone🧏🏾Deaf Person: Medium-Dark Skin Tone🧏🏿Deaf Person: Dark Skin Tone🧏‍♂️Deaf Man🧏🏻‍♂️Deaf Man: Light Skin Tone🧏🏼‍♂️Deaf Man: Medium-Light Skin Tone🧏🏽‍♂️Deaf Man: Medium Skin Tone🧏🏾‍♂️Deaf Man: Medium-Dark Skin Tone🧏🏿‍♂️Deaf Man: Dark Skin Tone🧏‍♀️Deaf Woman🧏🏻‍♀️Deaf Woman: Light Skin Tone🧏🏼‍♀️Deaf Woman: Medium-Light Skin Tone🧏🏽‍♀️Deaf Woman: Medium Skin Tone🧏🏾‍♀️Deaf Woman: Medium-Dark Skin Tone🧏🏿‍♀️Deaf Woman: Dark Skin Tone🧍Person Standing🧍🏻Person Standing: Light Skin Tone🧍🏼Person Standing: Medium-Light Skin Tone🧍🏽Person Standing: Medium Skin Tone🧍🏾Person Standing: Medium-Dark Skin Tone🧍🏿Person Standing: Dark Skin Tone🧍‍♂️Man Sta