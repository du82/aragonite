full_description = "Facebook201420232014Swipe to see emojis from other periods2023FacebookFacebook emojis appear for users of the Facebook website, Facebook Android app, Messenger for web, Messenger for Android, and Instagram direct messages on web. Facebook apps for iOS use native emojis for their respective platform instead of Facebook's own emoji images. Support for Emoji 15.0 is available for global Facebook users. Reactions Facebook provides animated “emoji” reactions to posts. Reactions do not correspond to specific emojis in the Unicode standard, but approximate these characters: 👍 Like — Thumbs Up ❤️ Love — Beating Heart 😂 Haha — Laughing Face ☺️ Yay — Smiling Face (discontinued) 😯 Wow — Surprised Face 😢 Sad — Crying Face, showing an animated tear 😡 Angry — Red / Angry / Pouting Face New Reactions for COVID-19 In March 2020, Facebook added a Care emoji reaction as an additional option in response to COVID-19. This is displayed similarly to a hugging face holding a red love heart. This Care emoji is not available as a standardized Unicode emoji, and can only be used in reactions to Facebook posts. Emoticons and Stickers Facebook has an emoticon implementation which uses Facebook-specific codes to show a color emoticon, as well as an extensible sticker collection. Facebook EmojisEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
