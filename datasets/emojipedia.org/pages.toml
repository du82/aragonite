title = "🤕 Face with Head-Bandage Emoji"
description = "A yellow face with a half-frown and white bandage wrapped around its head, often depicted partially over one eye. May represent physical injury or pain but also..."
full_description = "Emoji MeaningEmoji DesignsTechnical InformationMashup🤕CopyFace with Head-BandageA yellow face with a half-frown and white bandage wrapped around its head, often depicted partially over one eye. May represent physical injury or pain but also emotional hurting, sometimes for ironic effect. Differs from other smileys conveying illness, such as 🤢 Nauseated Face (appearing as if it’s going to vomit) or 🤒 Face With Thermometer (used especially for colds and flus). Huawei's design for this emoji has a heavily bruised eye as well as a head bandage.Face with Head-Bandage was approved as part of Unicode 8.0 in 2015 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😷🤮🤧🤯🤺🤼🤼‍♂️🤼‍♀️🏥🚑🥊💊🩼🛏️🆎Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
