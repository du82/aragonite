full_description = "201520252015Swipe to see emojis from other periods2025Emoji Version 15.1Emoji 15.1 is the latest set of emojis recommended for release, approved September 12, 2023 alongside Unicode 15.1. As with 2019's Emoji 12.1 and 2020's Emoji 13.1, the emojis recommended within Emoji 15.1 are sequences combining existing emoji characters from up to September 2022's Emoji 15.0. Emoji 15.1 brought the total number of emojis recommended for general interchange (RGI) by Unicode to 3,782 when all skin tone and gender variations are included. Learn more about this update. New Emojis in Version 15.1🙂‍↔️Head Shaking Horizontally🙂‍↕️Head Shaking Vertically🚶‍➡️Person Walking Facing Right🚶🏻‍➡️Person Walking Facing Right: Light Skin Tone🚶🏼‍➡️Person Walking Facing Right: Medium-Light Skin Tone🚶🏽‍➡️Person Walking Facing Right: Medium Skin Tone🚶🏾‍➡️Person Walking Facing Right: Medium-Dark Skin Tone🚶🏿‍➡️Person Walking Facing Right: Dark Skin Tone🚶‍♀️‍➡️Woman Walking Facing Right🚶🏻‍♀️‍➡️Woman Walking Facing Right: Light Skin Tone🚶🏼‍♀️‍➡️Woman Walking Facing Right: Medium-Light Skin Tone🚶🏽‍♀️‍➡️Woman Walking Facing Right: Medium Skin Tone🚶🏾‍♀️‍➡️Woman Walking Facing Right: Medium-Dark Skin Tone🚶🏿‍♀️‍➡️Woman Walking Facing Right: Dark Skin Tone🚶‍♂️‍➡️Man Walking Facing Right🚶🏻‍♂️‍➡️Man Walking Facing Right: Light Skin Tone🚶🏼‍♂️‍➡️Man Walking Facing Right: Medium-Light Skin Tone🚶🏽‍♂️‍➡️Man Walking Facing Right: Medium Skin Tone🚶🏾‍♂️‍➡️Man Walking Facing Right: Medium-Dark Skin Tone🚶🏿‍♂️‍➡️Man Walking Facing Right: Dark Skin Tone🧎‍➡️Person Kneeling Facing Right🧎🏻‍➡️Person Kneeling Facing Right: Light Skin Tone🧎🏼‍➡️Person Kneeling Facing Right: Medium-Light Skin Tone🧎🏽‍➡️Person Kneeling Facing Right: Medium Skin Tone🧎🏾‍➡️Person Kneeling Facing Right: Medium-Dark Skin Tone🧎🏿‍➡️Person Kneeling Facing Right: Dark Skin Tone🧎‍♀️‍➡️Woman Kneeling Facing Right🧎🏻‍♀️‍➡️Woman Kneeling Facing Right: Light Skin Tone🧎🏼‍♀️‍➡️Woman Kneeling Facing Right: Medium-Light Skin Tone🧎🏽‍♀️‍➡️Woman Knee