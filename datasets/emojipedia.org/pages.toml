title = "🏳️‍🌈 Rainbow Flag Emoji"
description = "A flag with six colors of the rainbow, generally including red, orange, yellow, green, blue and purple. Commonly used by the LGBT movement as a gay pride flag, ..."
full_description = '''Emoji MeaningEmoji DesignsTechnical Information🏳️‍🌈CopyRainbow FlagA flag with six colors of the rainbow, generally including red, orange, yellow, green, blue and purple. Commonly used by the LGBT movement as a gay pride flag, or simply pride flag and seen at Pride events. In February 2019 misinformation was spread about a so-called "anti-lgbt emoji" which can be created using a combining character to show a black and white glyph like 🚫 on top of the rainbow flag. This is possible with any emoji on supported platforms, in the same way keycaps are combining characters.The Rainbow Flag emoji is a ZWJ sequence combining 🏳️ White Flag, Zero Width Joiner and 🌈 Rainbow. These display as a single emoji on supported platforms.Rainbow Flag was added to Emoji 4.0 in 2016.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🦄🍭🌈⛳🏁🚩🎌🏴🏳️🏳️‍⚧️🏴‍☠️Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
