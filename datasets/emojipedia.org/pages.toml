full_description = "Emoji MeaningEmoji DesignsTechnical Information💙CopyBlue HeartA blue heart emoji, commonly used by brands as a neutral heart color. As with the other color-based hearts, this emoji is often also used to express an affinity with or appreciation for various people, places, groups, objects, or ideas associated with the same color. Can also be used to discuss someone passing away, though this use case is more explicitly associated with the 🤍 White Heart. An early Google design of this emoji depicted the heart as if it were made out of gemstone.Blue Heart was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🥰😍💘💝💖💗💓💞💕❤️🩷🧡💛💚🩵💜🤎🖤🩶🤍🫶🌻💘Valentine’s Day💑LoveEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
