Many of these are Recommended For General Interchange (RGI) which indicates they are likely to work across mu..."""
full_description = "👪 Families — List of Diverse Family EmojisUnicode supports a wide range of family emojis. Many of these are Recommended For General Interchange (RGI) which indicates they are likely to work across multiple major platforms. The majority of RGI family emojis consist of combinations of the 👩 Woman, 👨 Man, 👧 Girl, and 👦 Boy emojis. Family emojis are implemented as ZWJ Sequences which display every family member individually on platforms that do not support the sequences. As of 2024, RGI family emojis are limited to those without any skin tone modifiers that display as default-yellow or, increasingly frequently following the introduction of Emoji 15.1, with silhouette-based icon designs. Additional family sequences including skin tones are valid within Unicode, but not RGI, as are sequences that include the 🧑 Person, 🧒 Child, and 👶 Baby emoji. 🚩 Note: Windows has supported 52,000 family combinations since 2016. Sequences listed on this page are limited to a subset of these - generally those supported on two or more platforms.GridList ViewEmoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
