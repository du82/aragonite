full_description = "Emoji ProposalsAnyone can submit a proposal for a new emoji. It's free, and details on how to do this are available on the Unicode Consortium website. Proposals should indicate that an emoji (if approved) would be well used, is visually distinct, and cannot already be represented. Before proposing, first have a search of Emojipedia to check that your emoji idea doesn't already exist. 🚩 Note: new emoji proposals are currently being accepted until July 31, 2024. Criteria and instructions for submissions are found on the Unicode Consortium website: 📝 Submit an Emoji Proposal to Unicode Some useful URLs for reference: 📋 Unicode Emoji requests (list of submitted proposals and their status) 📊 Top Emojipedia Requests 2019 (popular suggestions from Emojipedia readers) 🆕 2023 Emoji List (emojis approved for release in 2023 / 2024) Image Note: Images included within a proposal don't have to be created by the proposer, but if attaching example images from elsewhere they must first be in the public domain or licensed for non-commerical use. Actual emoji designs as implemented on major operating systems or apps are each designed by their respective platform owners, and don't necessarily reflect or mirror the designs submitted in a proposal.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
