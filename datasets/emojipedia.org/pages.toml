description = """
A yellow face with closed eyes, furrowed eyebrows, broad frown, and two puffs of steam blowing out of its nose, as if in a huff or fuming.&nbsp;

May convey v..."""
full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup😤CopyFace with Steam From NoseA yellow face with closed eyes, furrowed eyebrows, broad frown, and two puffs of steam blowing out of its nose, as if in a huff or fuming. May convey various negative emotions, including irritation, anger, and contempt. May also convey feelings of pride, dominance, and empowerment. Originally named Face With Look of Triumph, and the steam from its nose may derive from a visual shorthand for frustration or disdain in anime and manga. Samsung’s design previously looked like its head was titled back in a more arrogant expression. Earlier designs from Microsoft depicted a big, open mouth without steam and from Facebook, a smiley that resembled 😬 Grimacing Face.Face with Steam From Nose was approved as part of Unicode 6.0 in 2010 under the name "Face with Look of Triumph" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🥲🤨😬🧐😡😠🤬👿😾💯💢🔥Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
