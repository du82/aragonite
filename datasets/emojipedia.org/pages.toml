full_description = "Emoji MeaningEmoji DesignsTechnical Information🎊CopyConfetti BallA golden ball, split in two halves in a shower of multicolored confetti and streamers. Like 🎉 Party Popper, commonly used to convey congratulations and celebration, as on New Year’s Eve, birthdays, wedding days, graduations, and other special occasions or good times more generally. Its design across platforms—and inclusion in early sets from au by KDDI—suggest the emoji is a Japanese kusudama, a decorative ball used at such festive occasions as opening ceremonies.Confetti Ball was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🥳🍾🎈🎉🎊New Year’s EveEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
