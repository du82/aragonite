full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup🤗CopySmiling Face with Open HandsA yellow face smiling with open hands, as if giving a hug. May be used to offer thanks and support, show love and care, or express warm, positive feelings more generally. Due to its hand gesture, often used to represent jazz hands, indicating such feelings as excitement, enthusiasm, or a sense of flourish or accomplishment. Joins 🤔 Thinking Face, 🤫 Shushing Face, and 🤭 Face With Hand Over Mouth as one of the few smileys featuring hands. For a more obvious hug, see 🫂 People Hugging (new in 2020).Smiling Face with Open Hands was approved as part of Unicode 8.0 in 2015 under the name "Hugging Face" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😄🙂😊😇🥰😍🤩😗☺️🤭🤫🤔😌🤤🤧👾💕🙌👐🫂🐻🥨🏥Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
