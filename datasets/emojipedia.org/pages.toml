full_description = "Emoji RequestsEvery year, new emojis are commonly requested on social media platforms, as well as part of petitions, studies, or campaigns. Requesting an emoji is different to the act of proposing an emoji. A formal proposal, if recommended, may lead to an emoji being approved by the Unicode Consortium. If you're wondering whether an emoji has been proposed before, consider searching Emojipedia for any approved emoji, or browse: 📝 All emoji requests submitted to Unicode The above list contains details of proposals that have been approved, declined, or held for potential future release. Emojipedia also compiles a list of emojis commonly requested by our users, which is published each year: 🗳 Top Emoji Requests 2019 🗳 Top Emoji Requests 2018 🗳 Top Emoji Requests 2017 🗳 Top Emoji Requests 2016 Learn more about submitting an emoji proposal document to the Unicode Consortium.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
