full_description = "Microsoft Teams (3D Animated)202220232022Swipe to see emojis from other periods2023Microsoft Teams (3D Animated)Microsoft's Teams software includes 3D renderings of the Fluent emoji set that make its debut within Windows 11's November 2021 update. As of February 2022, this update is available for select Microsoft Teams users, but is expected to be available for all users across both Work & School and Home additions in the near future. Initially previewed ahead of World Emoji Day 2021, many of these 3D emoji renderings are also animated. A subset of Skype emoticons were available in Microsoft Teams before the 3D Fluent set began rolling out in February 2022. Many of Skype's unique shortcodes-based emoticons have also been given a 3D Fluent design within Microsoft Teams.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
