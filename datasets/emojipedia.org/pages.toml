full_description = '''Emoji MeaningEmoji DesignsTechnical Information❤️CopyRed HeartA classic red love heart emoji. The red heart ideograph is traditionally used for expressions of love and romance across many cultures, with this being amongst the most frequence use cases for this emoji. However, the Red Heart emoji is also often used to express non-romantic positive sentiments, in part thanks to its use as one of the default reaction emoji options across many social messaging platforms (e.g. Instagram, Slack, WhatsApp). Additionally, as with the other color-based hearts, this emoji is often also used to express an affinity with or appreciation for various people, places, groups, objects, or ideas associated with the same color. This is historically the most popular heart emoji by a considerable distance and is amongst the most popular emojis of all time. A similar emoji exists for the heart suit in a deck of playing cards. On Snapchat, this emoji displays next to a friend when you have been #1 BFs with each other for two consecutive weeks. Note: the Unicode Character Database (UCD) name “Heavy Black Heart” pre-dates color emoji, when the term referred to a solid, black ❤︎ heart character. See the glossary for information on the term black in historic Unicode character names.Red Heart was approved as part of Unicode 1.1 in 1993 under the name "Heavy Black Heart" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😊🥰😍😘😚🤗😻💘💝💖💗💓💞💕💟❣️❤️‍🔥❤️‍🩹🩷🧡💛💚💙🩵💜🤎🖤🩶🤍🫶🫀💘Valentine’s Day💕Hearts💑Love💏Kisses💑Couples With HeartsEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
