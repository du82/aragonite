["https://emojipedia.org/stats"]
title = "Emoji Statistics"
description = """
Number of Emojis

In total, there are&nbsp;3,790 emojis in the Unicode Standard as of September 2024.&nbsp;This includes sequences for gender or skin tone, fl..."""
full_description = "Emoji StatisticsNumber of Emojis In total, there are 3,790 emojis in the Unicode Standard as of September 2024. This includes sequences for gender or skin tone, flags, and the components that are used to create keycap, flag, and other sequences. The latest emoji release is Emoji 16.0. The next expected release is Emoji 17.0, currently scheduled for September 2025. World Emoji Awards Each year on July 17, Emojipedia hosts the World Emoji Awards. The 2022 awards were as follows: 🆕 Most Popular New Emoji. Any emoji approved in 2021 was eligible, determined by which is most used on Twitter. Awarded to 🥹 Face Holding Back Tears 👀 Most Anticipated Emoji. The emoji is provisionally expected to be coming to platforms throughout 2022. Awarded to 🩷 Pink Heart 🗓 Most 2022 Emoji: User-voted bracket to determine which emoji best represents 2022. Awarded to 🫠 Melting Face. 🏅 Lifetime Achievement. Awarded to a member of the most beloved of all emojis, old or new. Awarded to ❤️ Red Heart Recent Emoji Trends Regarding emoji trends, recent analyses from Emojipedia have found that: 💕🆙 Based on 7 billion tweets over 10 years, emoji use has never been higher 🔝😭 2021 saw Loudly Crying Face dethron 😂 Tears of Joy as Twitter's top emoji 🔝🤏 In 2022, 😂 Tears of Joy and 😭 Loudly Crying Face are neck-and-neck 💉⏫ The use of the syringe emoji has been greatly increasing since December 2020 🥺⏫ Pleading Face experienced surging popularity in 2020, but the ✨ Sparkles replaced it as the #3 emoji in the world in late 2021. An Emojipedia analysis on emoji usage in the early stages of the COVID-19 pandemic found the following: ☺️📉 The relative use of positive smiley face emojis was on the decline (down 5.63%) 📊📈 The top ten emojis used on Twitter are relatively stable 🔝😂 Face with Tears of Joy was the most used emoji on Twitter 💕🆙 Emoji use as a whole continued to rise, with nearly one in five tweets containing at least one emoji 🤔🦠 The increase in emoji use was potentially slowed by our new normal, but its too soon to say this with certainty 😃👍 Smileys & People still dominated in terms popular emoji categories, while 🔣 Symbols are on the decline ✈️⤵️ Emojis in the Travel & Places category saw larger than usual decreases recently, possibly due to travel restrictions See also: Coronavirus-related emoji trends. Emoji Popularity: Twitter According to an Emojipedia analysis, the top 10 emojis used on Twitter across 2021 were: 😭 Loudly Crying Face 😂 Face with Tears of Joy 🥺 Pleading Face 🤣 Rolling on the Floor Laughing ❤️ Red Heart ✨ Sparkles 🙏 Folded Hands 😍 Smiling Face with Heart-Eyes 🥰 Smiling Face with Hearts 😊 Smiling Face with Smiling Eyes Emoji Popularity: Unicode Unicode has worked with vendors to rank the most popular emojis in current use. As of December 2021, these were: 😂 Face with Tears of Joy ❤️ Red Heart 🤣 Rolling on the Floor Laughing 👍 Thumbs Up 😭 Loudly Crying Face 🙏 Folded Hands 😘 Face Blowing a Kiss 🥰 Smiling Face with Hearts 😍 Smiling Face with Heart-Eyes 😊 Smiling Face with Smiling Eyes In October 2019 these were: 😂 Face With Tears of Joy ❤️ Red Heart 😍 Smiling Face With Heart-Eyes 🤣 Rolling on the Floor Laughing 😊 Smiling Face With Smiling Eyes 🙏 Folded Hands 💕 Two Hearts 😭 Loudly Crying Face 😘 Face Blowing a Kiss 👍 Thumbs Up Emojipedia pages include Google Trends intregation which show the relative popularity of emojis in search terms over time. Other emoji statistics resources include: 🐦 Twitter: emojitracker (note: emojitracker does not track any emoji approved after 2016) 🛫 Telegram: @EmojiStatsBot Emoji Usage 😲 Over one in five tweets now includes an emoji (21.54%) 💬 5 billion emojis are sent daily on Facebook Messenger 📸 By mid-2015, half of all comments on Instagram included an emoji 🍑 Only 7% of people use the peach emoji as a fruit The rest mostly use it as a butt or for other non-fruit uses Apple revealed the most used emojis on iOS in a 2017 report Emojipedia 📍 Founded: 2013 👀 Average monthly page views: 50 million 📥 Emoji Wrap email subscribers: > 18,000 During 2021, Emojipedia visitors were from, in order: 🇺🇸 USA 🇬🇧 UK 🇮🇳 India 🇨🇦 Canada 🇵🇭 Philippines 🇨🇳 China 🇧🇷 Brazil 🇮🇩 Indonesia 🇦🇺 Australia 🇩🇪 Germany Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
