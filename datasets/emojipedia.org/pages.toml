["https://emojipedia.org/downcast-face-with-sweat"]
title = "😓 Downcast Face with Sweat Emoji"
description = "A yellow face with closed eyes, frown, and a bead of sweat dripping from its forehead. Usually depicted with a single sweat bead on its right side, though Faceb..."
full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup😓CopyDowncast Face with SweatA yellow face with closed eyes, frown, and a bead of sweat dripping from its forehead. Usually depicted with a single sweat bead on its right side, though Facebook and WhatsApp include the sweat bead on its left side. Meaning widely varies, but commonly conveys a moderate degree of sadness, pain, frustration, or disappointment, similar to 😢 Crying Face and 😥 Sad But Relieved Face. Not to be confused with 😅 Grinning Face With Sweat or other emojis with tear or sweat droplets. Google previously featured a blue face. Microsoft previously depicted multiple beads of sweat from around the smiley’s forehead. Earlier designs from Samsung had more pleading eyes.Downcast Face with Sweat was approved as part of Unicode 6.0 in 2010 under the name "Face with Cold Sweat" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😅😬😔😪🤢🥵☹️😰😥😢😭😞💦💧Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
