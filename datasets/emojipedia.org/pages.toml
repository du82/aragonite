Emoji Versions document&nbsp;new emoji codepoints assigned within a..."""
full_description = "All Emoji VersionsEmoji Versions are emoji-specific documentation produced by the Unicode Consortium. Emoji Versions document new emoji codepoints assigned within a Unicode Version, as well as also emoji sequences that are recommended to be constructed via new or existing emoji codepoints. As such, Emoji Versions are usually (but not always) released alongside an update to the Unicode Standard character coding system via a Unicode Version. Emoji 2.0, Emoji 12.1, and Emoji 13.1 were published separate from any update to the Unicode Standard. This was because they exclusively recommended new emoji sequences and emoji presentations for existing codepoints from earlier Unicode Versions. Note: There were no version of Emoji 6.0-10.0. A decision was made in 2017 to align Emoji version numbers with their respective Unicode versions, starting with version 11.0. Emoji 1.0 Emoji 2.0 Emoji 3.0 Emoji 4.0 Emoji 5.0 Emoji 11.0 Emoji 12.0 Emoji 12.1 Emoji 13.0 Emoji 13.1 Emoji 14.0 Emoji 15.0 Emoji 15.1 Emoji 16.0 Emoji 17.0 Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
