full_description = "Emoji MeaningEmoji DesignsTechnical Information🌈CopyRainbowThe colorful arc of a rainbow, as may appear after rain. Generally depicted as the left half of a full rainbow, showing six bands of color: red, orange, yellow, green, blue, and violet. Commonly used to express gay pride. Also commonly used to convey various feelings of love and happiness. See also 🏳️‍🌈 Rainbow Flag. WhatsApp’s design shows the right arc of rainbow disappearing into a cloud. Facebook’s rainbow is displayed on a blue sky, as Apple, Samsung, and Twitter’s previously were. Google and Microsoft previously displayed full rainbow arcs with clouds.Rainbow was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🦄🕊️🦋☘️🍀🍩🍭☁️⛅⛈️🌤️🌥️🌦️🌧️🌨️🌩️☂️💧🪅🪟☮️🏳️‍🌈Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
