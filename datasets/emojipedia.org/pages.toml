["https://emojipedia.org/face-with-hand-over-mouth"]
title = "🤭 Face with Hand Over Mouth Emoji"
description = 'Face with Hand Over Mouth was approved as part of Unicode 10.0 in 2017 under the name "Smiling Face with Smiling Eyes and Hand Covering Mouth" and added to Emoji 5.0 in 2017.'
full_description = '''Emoji MeaningEmoji DesignsTechnical InformationMashup🤭CopyFace with Hand Over MouthA yellow face with a hand covering its mouth. Displays most often with smiling eyes and/or blushing cheeks, suggesting coy laughter or embarrassment, as if cheekily saying Oops! Prior to the release of iOS 15.4 in March 2022, Apple's design featured simple, open eyes, suggesting someone gasping Oh my! in serious surprise, shock, concern, or apology. This same update assigned Apple's original 🤭 design to Emoji 14.0's new 🫢 Face with Open Eyes and Hand Over Mouth emoji. May be used to similar effect as 🙊 Speak-No-Evil Monkey. See also 🤐 Zipper-Mouth Face. Joins 🤗 Hugging Face, 🤔 Thinking Face, and 🤫 Shushing Face as one of the few smileys featuring hands. Facebook's design previously featured open eyes, though an earlier version had smiling eyes like those in the vendor's current design.Face with Hand Over Mouth was approved as part of Unicode 10.0 in 2017 under the name "Smiling Face with Smiling Eyes and Hand Covering Mouth" and added to Emoji 5.0 in 2017.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😁🤗🫢🤫🤔🤐😬🤥😳🥱🤬🙈🙉🙊✋Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
