["https://emojipedia.org/hundred-points"]
title = "💯 Hundred Points Emoji"
description = """
100 emoji: the number one-hundred, written in red, underlined twice for emphasis.

Originating from the number 100&nbsp;written on a school exam or paper&nbsp..."""
full_description = '''Emoji MeaningEmoji DesignsTechnical Information💯CopyHundred Points100 emoji: the number one-hundred, written in red, underlined twice for emphasis. Originating from the number 100 written on a school exam or paper to indicate a perfect score of 100 out of 100. Teachers in Japan may also use a stamp in addition to the 100 mark, to indicate that a student has performed very well. This 100 emoji is commonly used as a shorthand for 100%, with the usage meaning “keep it real” or a similar sentiment. A 100 emoji can be used to express pride or general acceptance of an idea. In Snapchat, the 100 emoji appearing next to a fire emoji indicates a 100 day Snapstreak.Hundred Points was approved as part of Unicode 6.0 in 2010 under the name "Hundred Points Symbol" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🥳😎😤💥👌👊💅💪🧑‍🎓👨‍🎓👩‍🎓🧑‍🏫👨‍🏫👩‍🏫💮🏫🔥🎉🎊🕶️🎒🎓📋🔑📛✅Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
