full_description = '''Emoji MeaningEmoji DesignsTechnical Information💧CopyDropletA single, light blue droplet, as of water, sweat, or tears. May be used for various types of liquid. May also be used to expression sadness, as in 😢 Crying Face, or for various liquid-based slang expressions (e.g., drip, “exceptional style, swagger"). Not to be confused with 💦 Sweat Droplets, though their applications may overlap.Droplet was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With😅🤣😂😪🥵😎😰😥😭😓💢💦💭🏺⛲🛢️⛽⛈️🌦️🌧️🌈🌂☂️☔🌊⚗️🚰🚱Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
