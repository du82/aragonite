full_description = "Google Noto Color Emoji200820242008Swipe to see emojis from other periods2024Google Noto Color Emoji16.0 - 10 September 2024This update to Google's Noto Color Emoji set introduced support for 2024's Emoji 16.0 recommendations. It also tweaked the shading and outlines for most gesture emoji designs. First made available via Google's Noto Color Emoji font page on 2024-09-10, this update was released progressively across different Google platforms such as Chrome OS, Gmail, YouTube. It was released for mobile devices via an Android 15 update in February 2025.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow more"
