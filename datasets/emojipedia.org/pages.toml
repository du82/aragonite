full_description = "Emoji Modifier SequenceEmoji characters can be modified to use one of five different skin tone modifiers. Each tone is based on the Fitzpatrick Scale. An Emoji Modifier Sequence is created automatically when a modifier character is inserted after a supported base emoji character, resulting in a single emoji with skin tone. Many emojis with skin tones are Emoji ZWJ Sequences, due to the presence of additional characters for gender, multiple people, or a combination of people and objects.GridList ViewEmoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
