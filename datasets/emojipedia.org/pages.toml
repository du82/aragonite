As there is no single em..."""
full_description = "🌿 Four Twenty / 420Emojis commonly used to represent marijuana or cannabis include 🌿 Herb, 🥦 Broccoli and 🌳 Deciduous Tree. As there is no single emoji to represent cannabis, often emoji bigrams (two emojis in sequence) are used to represent cannabis culture or the consumption of cannabis on days such as 420. Emojis listed here are only understood to represent cannabis when used in that specific context. Marijuana / Weed / Cannabis A number of emojis are used in various contexts to describe cannabis. Usually involving the color green, including leaves, or both. 🌿 Herb 🥦 Broccoli 🌳 Deciduous Tree 🍁 Maple Leaf 🍃 Leaf Fluttering in Wind 🍀 Four Leaf Clover 🪴 Potted Plant Cannabis-related paraphernalia Some emojis used as an approximation of cannabis paraphernalia include: 🌿⚗️ – Bong 🌿🚬 – Joint Intoxication Emoji bigrams used in combination to describe the consumption and effects of cannabis: 😌💨 – High 😳🍃 – Stoned 😶🍳 – Cooked 😳🔥 – Blazed New in 2021 Two emojis available on phones in 2021 which are sometimes used to describe marijuana use and/or smoking in general: 😮‍💨 Face Exhaling 😶‍🌫️ Face in Clouds Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
