["https://emojipedia.org/tiktok"]
title = "♪ TikTok Emoji List & Emoji Meanings"
description = "Emoji meanings on TikTok and list of codes to insert hidden emojis into TikTok captions or comments. Works for emojis on iOS and Android."
full_description = '''TikTokTikTokTikTok supports native emojis on all platforms which can be inserted with the system-wide emoji keyboard. Some commonly used emojis in comments TikTok include: 🪑 Chair: used on TikTok as a placeholder with no single meaning. One use is implied to be sexual, other times simply to create confusion or to fill space. New in September 2021. ✨ Sparkles: emphasis on a point, sometimes used for sarcasm or mocking. May be used as an alternative to italics. 🤡 Clown Face: describing someone selfish or unintelligent 🎂 Birthday Cake: alternative to 🍑 Peach when referring to buttocks (eg 'nice 🎂') 💀 Skull: figurative 'I'm dead' (I found this very funny, an alternative to 😂 Face with Tears of Joy) 👁👄👁: I am observing and somewhat engrossed in this content 🧍 Person Standing: Standing awkwardly. "I don't know what I just watched" and/or mimicking a passer-by in a video 🥺👉👈: Shy or bashful; available as a hidden TikTok emote using the shortcode [wronged] These uses aren't considered universal, and may also be found on other platforms. More about emoji use on TikTok or NSFW emoji meanings. Hidden TikTok Emojis These 'secret' TikTok emoji codes work on both iOS and Android versions of the TikTok app, appearing as a shortname wrapped in square brackets. For example typing [loveface] inserts a custom emoticon which looks similar to the 😍 Smiling Face With Heart-Eyes emoji. Type or copy and paste the codes below to display the graphics as displayed below. [smile] [happy] [angry] [cry] [embarrassed] [surprised] [wronged] [shout] [flushed] [yummy] [complacent] [drool] [scream] [weep] [speechless] [funnyface] [laughwithtears] [wicked] [facewithrollingeyes] [sulk] [thinking] [lovely] [greedy] [wow] [joyful] [hehe] [slap] [tears] [stun] [cute] [blink] [disdain] [astonish] [rage] [cool] [excited] [proud] [smileface] [evil] [angel] [laugh] [pride] [nap] [loveface] [awkward] [shock] Unlike native system emojis which appear with designs from Apple, Google or Microsoft (depending on the platform being used), TikTok's hidden emoji list uses the same visual style on all operating systems, from all manufacturers. Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
