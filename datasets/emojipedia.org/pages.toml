full_description = "Chromebook Emoji SupportView Emoji Chromebooks running Google’s ChromeOS support for color emojis that can be used in any app or website. Android and ChromeOS share the same set of Google Emojis, which look like this. Instructions 1. Click the clock in the bottom-right, and choose Settings 2. Click Advanced Settings at the bottom of the Settings Window 3. Scroll down until you see the Accessibility section. Click the checkbox: Enable on-screen keyboard 4. A small keyboard icon appears in the bottom-right of the screen. Click this. 5. In the bottom-left of the keyboard, click the button with three dots 6. Choose the smiley face from the popup panel to turn on the emoii keyboard 7. That’s it! Choose a section, and click on any emoji to insert it into the tweet, Facebook post, Instagram comment, or other text field. .tg {border-collapse:collapse;border-spacing:0;} .tg td{border-color:black;border-style:solid;border-width:1px;font-size:14px; overflow:hidden;padding:10px 5px;word-break:normal;} .tg th{border-color:black;border-style:solid;border-width:1px;font-size:14px; font-weight:normal;overflow:hidden;padding:10px 5px;word-break:normal;} .tg .tg-c3ow{border-color:inherit;text-align:center;vertical-align:top} .tg .tg-ux9v{background-color:#efefef;border-color:inherit;font-size:medium;font-weight:bold;text-align:left;vertical-align:top} .tg .tg-jx4x{background-color:#efefef;border-color:inherit;font-size:medium;font-weight:bold;text-align:center;vertical-align:top} .tg .tg-0pky{border-color:inherit;text-align:left;vertical-align:top} .tg {border-collapse:collapse;border-spacing:0;} .tg td{border-color:black;border-style:solid;border-width:1px;font-size:14px; overflow:hidden;padding:10px 5px;word-break:normal;} .tg th{border-color:black;border-style:solid;border-width:1px;font-size:14px; font-weight:normal;overflow:hidden;padding:10px 5px;word-break:normal;} .tg .tg-kftd{background-color:#efefef;text-align:left;vertical-align:top} .tg .tg-0lax{text-a