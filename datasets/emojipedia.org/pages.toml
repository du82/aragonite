["https://emojipedia.org/slack"]
title = "#️⃣ Slack Emoji List — Emoji Codes to use on Slack [Updated: 2021]"
description = "How to use emojis on Slack. Search for any emoji, use new emojis and shortcodes on Slack. Find the latest emojis supported on Slack."
full_description = "SlackSlackSlack supports both regular Unicode character entries for emoji, as well as short emoji codes which are converted into an emoji image when posted. Users of iOS and macOS see Apple emoji design in Slack. All other platforms display emojis in Slack using designs from Google's Noto Color Emoji. This includes users on Windows, Linux, and Android. As of January 2021 Slack supports codes for Emoji 12.0 and above. Designs on non-Apple platforms switched to the latest Google graphics, which means some existing emojis have a new appearance, including checkmarks. A feature permitting choice of emoji design was discontinued in February 2018. Emoji Short Codes Slack permits a set of :shortcodes: to enter emojis on the platform. Typing an emoji short code such as :sparkles: inserts the ✨ Sparkles emoji. This is stored in plain text, so copying-and-pasting a block of text which includes emojis added via shortcode will display the :shortcode: instead of the emoji character. Emoji shortcodes on Slack are derived from this repository, and do not necessarily match the same codes used on platforms such as Github. More about Emoji Shortcodes. Emoji Reactions In addition to regular emoji use, reactions are also available. This allows any emoji to be chosen as a response to a message. Reactions are tallied if multiple users apply the same emojis. Slack Emoticon Codes The following codes convert emoticons into emoji images on Slack. Remote Work Emoji Set A custom set of remote work emojis from Jen Lewis is available for Slack as of June 2020. “The images range from socially distanced high fives to heads-down work and family time. There’s even one about your cat’s love for your keyboard.” Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
