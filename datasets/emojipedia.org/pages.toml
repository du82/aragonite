full_description = '''😂 Laughing EmojisEmojis that have are prominently used to express laughter or amusement. The 💀 Skull emoji is often used as a laughing emoji (in particular by Gen Z on Tiktok) to encapsulate the popular slang term "I'm dying laughing", which was further playfully shortened to "I'm dead". Thanks to its exaggerated design across platforms, the 😭 Loudly Crying Face emoji is often used to encapsulate when the user is laughing so hard they are brought to tears - even more so than the 😂 Face with Tears of Joy. Read more about the 😭 Loudly Crying Face emoji.GridList ViewEmoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
