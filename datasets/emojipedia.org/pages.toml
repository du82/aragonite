full_description = "Emoji MeaningEmoji DesignsTechnical InformationMashup😱CopyFace Screaming in FearA yellow face screaming in fear, depicted by wide, white eyes, a long, open mouth, hands pressed on cheeks, and a pale blue forehead, as if it has lost its color. Its expression evokes Edvard Munch’s iconic painting The Scream. While intended to represent horror and fright, it commonly conveys such feelings as shock, awe, disbelief, and intense excitement, as a screaming fan. Samsung’s design previously featured a ghost flying from its mouth. 🙀 Weary Cat Face bears a similar expression.Face Screaming in Fear was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🫣🤯😧😨😰😓👿💀☠️👹👺👻👽👾🙀🧛🧛‍♂️🧛‍♀️🧟🧟‍♂️🧟‍♀️🕷️🕸️🔪🎃🔦⛓️‍💥⛓️🆘🎃Halloween😞SadEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
