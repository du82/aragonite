watchOS previously&nbsp;inc..."""
full_description = "Apple WatchApple Watch supports the same emoji set as iOS and other Apple platforms, accessed via a scaled-down emoji picker interface. watchOS previously included an animated emoji feature. This provided various options to customize the appearance of various smileys, hand gestures, and hearts. An emoji-like reaction feature for iMessage remains available, allowing a message to be given a variety of responses including 👍, ❤️, and ‼️. Please note: watchOS animated emoji was unrelated to standard Unicode emojis supported by watchOS and iOS, and was also a different feature to Animoji on iOS. The watchOS animated emoji feature was retired in watchOS version 5.0 released in September 2018. This page archives options that were available. Smileys The smiley could be customized to show a number of faces including tongue-out, heart eyes, crying. These came in yellow or red. Hearts Hearts were available in red, purple and blue and include wings, arrow, and other animations. Gestures Animated emoji gestures available included fingers crossed, shaka, thumbs up, and waving hands. Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
