["https://emojipedia.org/bookmark-tabs"]
title = "📑 Bookmark Tabs Emoji"
description = "Sheets of white, printed paper with variously colored tabs to bookmark important sections or indicate signature lines. Commonly used for content concerning vari..."
full_description = "Emoji MeaningEmoji DesignsTechnical Information📑CopyBookmark TabsSheets of white, printed paper with variously colored tabs to bookmark important sections or indicate signature lines. Commonly used for content concerning various types of documents and writing. The number of pages and tabs vary, with Microsoft and Twitter’s designs featuring one page with a single, purple-colored tab. Facebook’s is printed with NDA, or nondisclosure agreement. Most platforms indicate text with dark lines. Apple’s design features an easter egg, addressed Dear Katie and signed Take care from John Appleseed with the text of its 1997–2002 Crazy Ones/Think Different ad campaign: Here’s to the crazy ones. The misfits. The rebels. The troublemakers. The round pegs in the square holes. The ones who see things differently. They’re not fond of rules. You can quote them, disagree with them, glorify or vilify them. About the only thing you can’t do is ignore them. Because they change things. They push the human race forward. And while some may see them as the crazy ones, we see genius. Because the ones who are crazy enough to think that they can change the world, are the ones who do. Early designs from au by KDDI resemble 📃 Page With Curl. Not to be confused with 📄 Page Facing Up or other emojis featuring sheets of paper.Bookmark Tabs was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With📕📗📘📙📒📃📄🔖🖋️🖊️📝🗂️Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
