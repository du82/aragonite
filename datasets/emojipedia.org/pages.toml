full_description = '''Emoji MeaningEmoji DesignsTechnical Information💣CopyBombA cartoon-styled bomb, depicted as a black ball with a burning fuse. Commonly used for various figurative bombs or explosions, e.g., slang bomb, a “home run” in baseball or softball; "excellent" or "attractive." Sometimes applied in contexts of war, weapons, or violence. Earlier designs from SoftBank and au by KDDI animated the bomb as exploding.Bomb was approved as part of Unicode 6.0 in 2010 and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🤯💥🔪🔥🎖️🪖🕯️🗡️🧯☢️☣️Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
