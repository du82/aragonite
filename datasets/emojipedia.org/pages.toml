["https://emojipedia.org/about"]
title = "About Emojipedia"
description = "Emojipedia is the world&#39;s #1 emoji&nbsp;reference site providing up-to-date and well-researched information you can trust. Our Editor-in-Chief is Keith Bron..."
full_description = "About EmojipediaEmojipedia is the world's #1 emoji reference site providing up-to-date and well-researched information you can trust. Our Editor-in-Chief is Keith Broni, who took the role in 2022. Emojipedia was founded in 2013 by Australian Jeremy Burge. Emoji names displayed on Emojipedia are official emoji names sourced from the Unicode Standard. Emoji images belong to their respective creators, and we display and archive these for the purpose of commentary and explanation. Emojipedia is a member of the Unicode Consortium. Emojipedia is owned by Zedge, Inc, the #1 phone personalization app in the world. Get AI image datasets from Zedge. Show off your creativity and compete with stunning AI-generated images in Zedge's latest product, AI Art Master. Who Writes Emojipedia's Emoji Definitions? Emoji definitions on Emojipedia are researched and written by Senior Emoji Lexicographer Jane Solomon (2020-present) and Keith Broni (2018-present). Past definitions have been written by John Kelly (2018-2019) and Jeremy Burge (2013-2018). Current Contributors Keith Broni, Editor In Chief Keith Broni is the Editor in Chief of Emojipedia. He oversees the site's day-to-day operations, which includes researching global emoji use and monitoring changes to emoji design sets. 💬 Follow Keith Broni on X / Twitter Jane Solomon, Senior Emoji Lexicographer Jane Solomon is Emojipedia's Senior Emoji Lexicographer and author of the children's book The Dictionary of Difficult Words. 💬 Follow Jane Solomon on X / Twitter Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
