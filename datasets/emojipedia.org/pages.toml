full_description = '''🧑‍🍳 Emoji Kitchen - Google's Emoji Mashup Feature ExplainedThe Emoji Kitchen is a Google feature that allows Android users to send merged or elaborated sticker versions of Google’s emoji designs. Initially launched in early 2020 as a feature within Gboard on Android devices, the feature was added directly to Google search across devices in September 2023. The emoji-inspired stickers the Emoji Kitchen displays are based on the words and emojis a user has entered into an eligible messaging or social media platform. Entering two emojis in a row will offer a combination of those two emojis in many instances. Entering two of the same emoji in a row will often lead to an especially exaggerated "doubled up" version of that emoji's Google design. Note that several emojis share the same Emoji Kitchen designs. According to a Google blog article posted on World Emoji Day 2024, as of July 2024 there are over 100,000 possible combinations. Emoji Kitchen support is not currently available for any flag emojis. An update in summer 2021 introduced several hidden designs inspired by Google’s popular blob emoji set that was active between 2013 and 2017. The blob-inspired designs are accessed by adding a 🪄 Magic Wand or a ✨ Sparkles emoji and then following it up with an additional emoji. If that additional emoji has a blob design available, it will appear as the first option in the Emoji Kitchen selection area. Learn more about the Emoji Kitchen's hidden blob emoji stickers. Shown below are all the emojis currently supported within the Emoji Kitchen. GridList ViewEmoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
