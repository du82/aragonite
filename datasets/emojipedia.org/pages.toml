["https://emojipedia.org/neutral"]
title = "Gender Neutral Emojis"
description = "This list is for emojis which do not specify a gender. This does not indicate&nbsp;that the characters&nbsp;will&nbsp;display with&nbsp;an ambiguous,&nbsp;gende..."
full_description = "Gender Neutral EmojisThis list is for emojis which do not specify a gender. This does not indicate that the characters will display with an ambiguous, gender neutral, gender inclusive, genderqueer or non-binary appearance on all (or any) platforms, but does ensure that a specific gender is not chosen. For example, the 🤦 Person Facepalming emoji does not specify a gender, but was previously shown as a woman on most platforms. This same emoji once displayed as a man on iOS, but a woman on Samsung and Windows. Truly neutral (smiley) characters such as Face With Cowboy Hat do not feature on this page. The color of the clothing worn by non-gender-specifying people emojis varies across platforms. Some platforms such as Apple, Huawei, and WhatsApp opt for gray clothing, while Google, Samsung, and Microsoft's designs are wearing orange. This color convention does not hold true for emojis where clothing is used to convey their role (e.g. 👮 Police Officer, 🧛 Vampire). GridList ViewEmoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
