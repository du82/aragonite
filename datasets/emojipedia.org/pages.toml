full_description = '''🐵 Animoji on iOS and iPadOSiOS includes an animated emoji feature known as Animoji. This responds to facial expressions via the camera to animate 3D animated emojis which can be sent as a video with sound. Animoji is joined by a 3D avatar feature on iOS called Memoji. Existing emojis remain static on the emoji keyboard, and when used within text. The following characters are available for animation using Animoji in iOS 11 and above: 👽 Alien 🐱 Cat Face 🐔 Chicken 🐶 Dog Face 🦊 Fox Face 🐵 Monkey Face 🐼 Panda Face 🐷 Pig Face 💩 Pile of Poo 🐰 Rabbit Face 🤖 Robot Face 🦄 Unicorn Face The following emojis had an Animoji option added in iOS 11.3: 🐻 Bear Face 🐲 Dragon Face 🦁 Lion Face 💀 Skull The following emojis had an Animoji option added in iOS 12: 🐨 Koala 🐯 Tiger 👻 Ghost 🦖 T-Rex The following emojis had an Animoji option added in iOS 12.2: 🐗 Boar 🦒 Giraffe 🦉 Owl 🦈 Shark The following emojis had an Animoji option added in iOS 13.0: 🐙 Octopus 🐮 Cow Face Each Animoji has a range of expressions which respond to the face being recorded. The Animoji mouth also animates to match the words being spoken, or sung in the case of "Animoji Karaoke". Animojis can be used as part of the Memoji Stickers feature in iOS 13 and above. Samples of various Animoji animations are displayed below. 👽 Alien 🐻 Bear 🐔 Chicken 🐲 Dragon 🦊 Fox 🦁 Lion 🐼 Panda 💩 Pile of Poo 🐰 Rabbit 💀 Skull 🦄 Unicorn Learn more about Animoji.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsShow more🎭 Purim🕉️ Holi Emoji List♀️ International Women's Day☘️ St Patrick’s DayLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
