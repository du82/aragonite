full_description = '''Emoji MeaningEmoji DesignsTechnical Information👉CopyRelated EmojiBackhand Index Pointing RightAn index finger pointing to the right. Since 2020 this emoji has been known to be combined with the 🥺 Pleading Face and the 👈 Backhand Index Pointing Left to indicate a bashful or shy pose (🥺👉👈), also often called a "simp" pose. An alternative "simp" pose uses the 😔 Pensive Face (😔👉👈). Additionally, using the 🙄 Rolling Eyes in between the pointing finger emojis indicates a person dismissively plugging their ears in an "I'm not listening" gesture (👉🙄👈). Backhand Index Pointing Right was approved as part of Unicode 6.0 in 2010 under the name "White Right Pointing Backhand Index" and added to Emoji 1.0 in 2015.EmojiPlaygroundA new emoji quiz game brought to you by EmojipediaAdvertisementThis Emoji Goes Great With🙄🥺👈👆👇☝️🫵👀➡️✅👋GesturesEmoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend.'''
