title = "Noto Emoji"
description = "Every emoji supported within Google's monochrome Noto Emoji font. Free to download from Google Fonts."
full_description = "Noto Emoji Font202220242022Swipe to see emojis from other periods2024Noto Emoji FontThe Noto Emoji Font is an open-source font developed by Google as part of the Noto Emoji project that supports monochrome versions the Unicode emoji set. As per standard variable text fonts, the Noto Emoji Font allows users to change each emoji character's color, size and weight. The font's designs across most categories largely mirror those of Google’s colorful Noto Emoji set, which provides standard emoji support across Google platforms and many Android devices. Notably, however, the majority of the font's people emoji designs emulate the popular blob emoji designs used on Google properties between 2013 and 2018. As such, the font does not support distinct designs for skin tone modifier sequences and many gender-specifying ZWJ sequences, instead displaying the same design as the base neutral emoji: either a blob or a humanoid silhouette. The font is free to download and is licensed under the Open Font License.Emoji PlaygroundNewShow moreEmojis for Upcoming EventsLatest newsShow moreFirst Look: New Apple Emojis in iOS 18.4 Beta 2Today Apple has previewed its latest batch of Unicode emojis as part of the second iOS 18.4 beta.Emojis & Dating Apps: Rizz, Romance, Icks & OthersIt’s no stretch to say that emojis have transformed the way people interact on the internet, and in few other areas is that truer than in the world of online dating.Emojis To Tackle The NFL & Super Bowl LIX 🏈This Sunday is the 59th annual Super Bowl, the biggest night of the American football calendar. This year's championship game is once again a showdown between the Kansas City Chiefs and the Philadelphia Eagles—so expect to see many football emojis this weekend."
