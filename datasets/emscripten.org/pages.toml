full_description = "Community Welcome to the Emscripten community! Get in touch The best ways contact the community are: The GitHub Issue Tracker Mailing list: emscripten-discuss Real-time chat: #emscripten on Discord (there was also an IRC channel on Mozilla IRC, but they are shutting those servers down). We are also open to exploring other options than Discord, if you’re interested to help out, let us know! Feel free to ask questions, share your ideas, or just join the conversation! Emscripten also has a presence on social media: @emscripten on Bluesky @emscripten on Mastodon @emscripten on Twitter Report a bug Bug reports can be posted in the GitHub Issue Tracker. Contribute Anyone can contribute to Emscripten. We’ve got some ideas to get you started on our Contributing page!"
