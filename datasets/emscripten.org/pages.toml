["https://emscripten.org/docs/api_reference/emscripten.h.html"]
title = "emscripten.h — Emscripten 4.0.5-git (dev) documentation"
full_description = '''emscripten.h This page documents the public C++ APIs provided by emscripten.h. Emscripten uses existing/familiar APIs where possible (for example: SDL). This API provides C++ support for capabilities that are specific to JavaScript or the browser environment, or for which there is no existing API. Table of Contents Inline assembly/JavaScript Calling JavaScript From C/C++ Browser Execution Environment Asynchronous File System API Asynchronous IndexedDB API Compiling Worker API Logging utilities Socket event registration Unaligned types Pseudo-synchronous functions Asyncify functions ABI functions Inline assembly/JavaScript Guide material for the following APIs can be found in Calling JavaScript from C/C++. Defines EM_JS(return_type, function_name, arguments, code) Convenient syntax for JavaScript library functions. This allows you to declare JavaScript in your C code as a function, which can be called like a normal C function. For example, the following C program would display two alerts if it was compiled with Emscripten and run in the browser: EM_JS(void, two_alerts, (), { alert('hai'); alert('bai'); }); int main() { two_alerts(); return 0; } Arguments can be passed as normal C arguments, and have the same name in the JavaScript code. These arguments can either be of type int32_t or double. EM_JS(void, take_args, (int x, float y), { console.log('I received: ' + [x, y]); }); int main() { take_args(100, 35.5); return 0; } Null-terminated C strings can also be passed into EM_JS functions, but to operate on them, they need to be copied out from the heap to convert to high-level JavaScript strings. EM_JS(void, say_hello, (const char* str), { console.log('hello ' + UTF8ToString(str)); } In the same manner, pointers to any type (including void *) can be passed inside EM_JS code, where they appear as integers like char * pointers above did. Accessing the data can be managed by reading the heap directly. EM_JS(void, read_data, (int* data), { console.log('Data: ' + HEAP32[data>>2] + ', ' + HEAP32[(data+4)>>2]); }); int main() { int arr[2] = { 30, 45 }; read_data(arr); return 0; } In addition, EM_JS functions can return a value back to C code. The output value is passed back with a return statement: EM_JS(int, add_forty_two, (int n), { return n + 42; }); EM_JS(int, get_memory_size, (), { return HEAP8.length; }); int main() { int x = add_forty_two(100); int y = get_memory_size(); // ... } Strings can be returned back to C from JavaScript, but one needs to be careful about memory management. EM_JS(char*, get_unicode_str, (), { var jsString = 'Hello with some exotic Unicode characters: Tässä on yksi lumiukko: ☃, ole hyvä.'; // 'jsString.length' would return the length of the string as UTF-16 // units, but Emscripten C strings operate as UTF-8. return stringToNewUTF8(jsString); }); int main() { char* str = get_unicode_str(); printf("UTF8 string says: %s\n", str); // Each call to _malloc() must be paired with free(), or heap memory will leak! free(str); return 0; } EM_ASM(...) Convenient syntax for inline assembly/JavaScript. This allows you to declare JavaScript in your C code “inline”, which is then executed when your compiled code is run in the browser. For example, the following C code would display two alerts if it was compiled with Emscripten and run in the browser: EM_ASM(alert('hai'); alert('bai')); Arguments can be passed inside the JavaScript code block, where they arrive as variables $0, $1 etc. These arguments can either be of type int32_t or double. EM_ASM({ console.log('I received: ' + [$0, $1]); }, 100, 35.5); Note the { and }. Null-terminated C strings can also be passed into EM_ASM blocks, but to operate on them, they need to be copied out from the heap to convert to high-level JavaScript strings. EM_ASM(console.log('hello ' + UTF8ToString($0)), "world!"); In the same manner, pointers to any type (including void *) can be passed inside EM_ASM code, where they appear as integers like char * pointers above did. Accessing the data can be managed by reading the heap directly. int arr[2] = { 30, 45 }; EM_ASM({ console.log('Data: ' + HEAP32[$0>>2] + ', ' + HEAP32[($0+4)>>2]); }, arr); Note As of Emscripten 1.30.4, the contents of EM_ASM code blocks appear inside the normal JS file, and as result, Closure compiler and other JavaScript minifiers will be able to operate on them. You may need to use safety quotes in some places (a['b'] instead of a.b) to avoid minification from occurring. The C preprocessor does not have an understanding of JavaScript tokens, and as a result, if the code block contains a comma character ,, it may be necessary to wrap the code block inside parentheses. For example, code EM_ASM(return [1,2,3].length); will not compile, but EM_ASM((return [1,2,3].length)); does. EM_ASM_INT(code, ...) This macro, as well as EM_ASM_DOUBLE and EM_ASM_PTR, behave like EM_ASM, but in addition they also return a value back to C code. The output value is passed back with a return statement: int x = EM_ASM_INT({ return $0 + 42; }, 100); int y = EM_ASM_INT(return HEAP8.length); EM_ASM_PTR(code, ...) Similar to EM_ASM_INT but for a pointer-sized return values. When building with -sMEMORY64 this results in i64 return value, otherwise it results in an i32 return value. Strings can be returned back to C from JavaScript, but one needs to be careful about memory management. char *str = (char*)EM_ASM_PTR({ var jsString = 'Hello with some exotic Unicode characters: Tässä on yksi lumiukko: ☃, ole hyvä.'; var lengthBytes = lengthBytesUTF8(jsString)+1; // 'jsString.length' would return the length of the string as UTF-16 // units, but Emscripten C strings operate as UTF-8. return stringToNewUTF8(jsString); }); printf("UTF8 string says: %s\n", str); free(str); // Each call to _malloc() must be paired with free(), or heap memory will leak! EM_ASM_DOUBLE(code, ...) Similar to EM_ASM_INT but for a double return value. MAIN_THREAD_EM_ASM(code, ...) This behaves like EM_ASM, but does the call on the main thread. This is useful in a pthreads build, when you want to interact with the DOM from a pthread; this basically proxies the call for you. This call is proxied in a synchronous way to the main thread, that is, execution will resume after the main thread has finished running the JS. Synchronous proxying also makes it possible to return a value, see the next two variants. MAIN_THREAD_EM_ASM_INT(code, ...) Similar to MAIN_THREAD_EM_ASM but returns an int value. MAIN_THREAD_EM_ASM_DOUBLE(code, ...) Similar to MAIN_THREAD_EM_ASM but returns a double value. MAIN_THREAD_EM_ASM_PTR(code, ...) Similar to MAIN_THREAD_EM_ASM but returns a pointer value. MAIN_THREAD_ASYNC_EM_ASM(code, ...) Similar to MAIN_THREAD_EM_ASM but is proxied in an asynchronous way, that is, the main thread will receive a request to run the code, and will run it when it can; the worker will not wait for that. (Note that if this is called on the main thread, then there is nothing to proxy, and the JS is executed immediately and synchronously.) Calling JavaScript From C/C++ Guide material for the following APIs can be found in Calling JavaScript from C/C++. Function pointer types for callbacks The following types are used to define function callback signatures used in a number of functions in this file. type em_callback_func General function pointer type for use in callbacks with no parameters. Defined as: typedef void (*em_callback_func)(void) type em_arg_callback_func Generic function pointer type for use in callbacks with a single void* parameter. This type is used to define function callbacks that need to pass arbitrary data. For example, emscripten_set_main_loop_arg() sets user-defined data, and passes it to a callback of this type on completion. Defined as: typedef void (*em_arg_callback_func)(void*) type em_str_callback_func General function pointer type for use in callbacks with a C string (const char *) parameter. This type is used for function callbacks that need to be passed a C string. For example, it is used in emscripten_async_wget() to pass the name of a file that has been asynchronously loaded. Defined as: typedef void (*em_str_callback_func)(const char *) Functions void emscripten_run_script(const char *script) Interface to the underlying JavaScript engine. This function will eval() the given script. Note: If -sDYNAMIC_EXECUTION=0 is set, this function will not be available. This function can be called from a pthread, and it is executed in the scope of the Web Worker that is hosting the pthread. To evaluate a function in the scope of the main runtime thread, see the function emscripten_sync_run_in_main_runtime_thread(). Parameters: script (const char*) – The script to evaluate. Return type: void int emscripten_run_script_int(const char *script) Interface to the underlying JavaScript engine. This function will eval() the given script. Note: If -sDYNAMIC_EXECUTION=0 is set, this function will not be available. This function can be called from a pthread, and it is executed in the scope of the Web Worker that is hosting the pthread. To evaluate a function in the scope of the main runtime thread, see the function emscripten_sync_run_in_main_runtime_thread(). Parameters: script (const char*) – The script to evaluate. Returns: The result of the evaluation, as an integer. Return type: int char *emscripten_run_script_string(const char *script) Interface to the underlying JavaScript engine. This function will eval() the given script. Note that this overload uses a single buffer shared between calls. Note: If -sDYNAMIC_EXECUTION=0 is set, this function will not be available. This function can be called from a pthread, and it is executed in the scope of the Web Worker that is hosting the pthread. To evaluate a function in the scope of the main runtime thread, see the function emscripten_sync_run_in_main_runtime_thread(). Parameters: script (const char*) – The script to evaluate. Returns: The result of the evaluation, as a string. Return type: char* void emscripten_async_run_script(const char *script, int millis) Asynchronously run a script, after a specified amount of time. This function can be called from a pthread, and it is executed in the scope of the Web Worker that is hosting the pthread. To evaluate a function in the scope of the main runtime thread, see the function emscripten_sync_run_in_main_runtime_thread(). Parameters: script (const char*) – The script to evaluate. millis (int) – The amount of time before the script is run, in milliseconds. Return type: void void emscripten_async_load_script(const char *script, em_callback_func onload, em_callback_func onerror) Asynchronously loads a script from a URL. This integrates with the run dependencies system, so your script can call addRunDependency multiple times, prepare various asynchronous tasks, and call removeRunDependency on them; when all are complete (or if there were no run dependencies to begin with), onload is called. An example use for this is to load an asset module, that is, the output of the file packager. This function is currently only available in main browser thread, and it will immediately fail by calling the supplied onerror() handler if called in a pthread. Parameters: script (const char*) – The script to evaluate. onload (em_callback_func) – A callback function, with no parameters, that is executed when the script has fully loaded. onerror (em_callback_func) – A callback function, with no parameters, that is executed if there is an error in loading. Return type: void Browser Execution Environment Guide material for the following APIs can be found in Emscripten Runtime Environment. Functions void emscripten_set_main_loop(em_callback_func func, int fps, bool simulate_infinite_loop) Set a C function as the main event loop for the calling thread. If the main loop function needs to receive user-defined data, use emscripten_set_main_loop_arg() instead. The JavaScript environment will call that function at a specified number of frames per second. If called on the main browser thread, setting 0 or a negative value as the fps will use the browser’s requestAnimationFrame mechanism to call the main loop function. This is HIGHLY recommended if you are doing rendering, as the browser’s requestAnimationFrame will make sure you render at a proper smooth rate that lines up properly with the browser and monitor. If you do not render at all in your application, then you should pick a specific frame rate that makes sense for your code. If simulate_infinite_loop is true, the function will throw an exception in order to stop execution of the caller. This will lead to the main loop being entered instead of code after the call to emscripten_set_main_loop() being run, which is the closest we can get to simulating an infinite loop (we do something similar in glutMainLoop in GLUT). If this parameter is false, then the behavior is the same as it was before this parameter was added to the API, which is that execution continues normally. Note that in both cases we do not run global destructors, atexit, etc., since we know the main loop will still be running, but if we do not simulate an infinite loop then the stack will be unwound. That means that if simulate_infinite_loop is false, and you created an object on the stack, it will be cleaned up before the main loop is called for the first time. This function can be called in a pthread, in which case the callback loop will be set up to be called in the context of the calling thread. In order for the loop to work, the calling thread must regularly “yield back” to the browser by exiting from its pthread main function, since the callback will be able to execute only when the calling thread is not executing any other code. This means that running a synchronously blocking main loop is not compatible with the emscripten_set_main_loop() function. Since requestAnimationFrame() API is not available in web workers, when called emscripten_set_main_loop() in a pthread with fps <= 0, the effect of syncing up to the display’s refresh rate is emulated, and generally will not precisely line up with vsync intervals. Tip There can be only one main loop function at a time, per thread. To change the main loop function, first cancel the current loop, and then call this function to set another. Note See emscripten_set_main_loop_expected_blockers(), emscripten_pause_main_loop(), emscripten_resume_main_loop() and emscripten_cancel_main_loop() for information about blocking, pausing, and resuming the main loop of the calling thread. Note Calling this function overrides the effect of any previous calls to emscripten_set_main_loop_timing() in the calling thread by applying the timing mode specified by the parameter fps. To specify a different timing mode for the current thread, call the function emscripten_set_main_loop_timing() after setting up the main loop. Note Currently, using the new Wasm exception handling and simulate_infinite_loop == true at the same time doe'''
