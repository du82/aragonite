["https://emscripten.org/docs/porting/connecting_cpp_and_javascript/Interacting-with-code.html"]
title = "Interacting with code — Emscripten 4.0.5-git (dev) documentation"
full_description = '''Interacting with code Emscripten provides numerous methods to connect and interact between JavaScript and compiled C or C++: Call compiled C functions from normal JavaScript: Using ccall or cwrap. Using direct function calls (faster but more complicated). Call compiled C++ classes from JavaScript using bindings created with: Embind or WebIDL-Binder Call JavaScript functions from C/C++: Using emscripten_run_script(). Using EM_JS() (faster). Using EM_ASM() (faster). Using a C API implemented in JavaScript. As function pointers from C. Using the Embind val class. Access compiled code memory from JavaScript. Affect execution behaviour. Access environment variables. This article explains each of the methods listed above, and provides links to more detailed information. Note For information on how compiled code interacts with the browser environment, see Emscripten Runtime Environment. For file system related manners, see the File System Overview. Note Before you can call your code, the runtime environment may need to load a memory initialization file, preload files, or do other asynchronous operations depending on optimization and build settings. See How can I tell when the page is fully loaded and it is safe to call compiled functions? in the FAQ. Calling compiled C functions from JavaScript using ccall/cwrap The easiest way to call compiled C functions from JavaScript is to use ccall() or cwrap(). ccall() calls a compiled C function with specified parameters and returns the result, while cwrap() “wraps” a compiled C function and returns a JavaScript function you can call normally. cwrap() is therefore more useful if you plan to call a compiled function a number of times. Consider the test/hello_function.cpp file shown below. The int_sqrt() function to be compiled is wrapped in extern "C" to prevent C++ name mangling. // Copyright 2012 The Emscripten Authors. All rights reserved. // Emscripten is available under two separate licenses, the MIT license and the // University of Illinois/NCSA Open Source License. Both these licenses can be // found in the LICENSE file. #include <math.h> extern "C" { int int_sqrt(int x) { return sqrt(x); } } To compile this code run the following command in the Emscripten home directory: emcc test/hello_function.cpp -o function.html -sEXPORTED_FUNCTIONS=_int_sqrt -sEXPORTED_RUNTIME_METHODS=ccall,cwrap EXPORTED_FUNCTIONS tells the compiler what we want to be accessible from the compiled code (everything else might be removed if it is not used), and EXPORTED_RUNTIME_METHODS tells the compiler that we want to use the runtime functions ccall and cwrap (otherwise, it will not include them). Note EXPORTED_FUNCTIONS affects compilation to JavaScript. If you first compile to an object file, then compile the object to JavaScript, you need that option on the second command. If you do it all together as in the example here (source straight to JavaScript) then this just works, of course. After compiling, you can call this function with cwrap() using the following JavaScript: int_sqrt = Module.cwrap('int_sqrt', 'number', ['number']) int_sqrt(12) int_sqrt(28) The first parameter is the name of the function to be wrapped, the second is the return type of the function (or a JavaScript null value if there isn’t one), and the third is an array of parameter types (which may be omitted if there are no parameters). The types are “number” (for a JavaScript number corresponding to a C integer, float, or general pointer), “string” (for a JavaScript string that corresponds to a C char* that represents a string) or “array” (for a JavaScript array or typed array that corresponds to a C array; for typed arrays, it must be a Uint8Array or Int8Array). You can run this yourself by first opening the generated page function.html in a web browser (nothing will happen on page load because there is no main()). Open a JavaScript environment (Control-Shift-K on Firefox, Control-Shift-J on Chrome), and enter the above commands as three separate commands, pressing Enter after each one. You should get the results 3 and 5 — the expected output for these inputs using C++ integer mathematics. ccall() is similar, but receives another parameter with the parameters to pass to the function: // Call C from JavaScript var result = Module.ccall('int_sqrt', // name of C function 'number', // return type ['number'], // argument types [28]); // arguments // result is 5 Note This example illustrates a few other points, which you should remember when using ccall() or cwrap(): These methods can be used with compiled C functions — name-mangled C++ functions won’t work. We highly recommended that you export functions that are to be called from JavaScript: Exporting is done at compile time. For example: -sEXPORTED_FUNCTIONS=_main,_other_function exports main() and other_function(). Note that you need _ at the beginning of the function names in the EXPORTED_FUNCTIONS list. Note that _main is mentioned in that list. If you don’t have it there, the compiler will eliminate it as dead code. The list of exported functions is the entire list that will be kept alive (unless other code was kept alive in another manner). Emscripten does dead code elimination to minimize code size — exporting ensures the functions you need aren’t removed. At higher optimisation levels (-O2 and above), code is minified, including function names. Exporting functions allows you to continue to access them using the original name through the global Module object. If you want to export a JS library function (something from a src/library*.js file, for example), then in addition to EXPORTED_FUNCTIONS, you need to add it to DEFAULT_LIBRARY_FUNCS_TO_INCLUDE, as the latter will force the method to actually be included in the build. The compiler will remove code it does not see is used, to improve code size. If you use ccall in a place it sees, like code in a --pre-js or --post-js, it will just work. If you use it in a place the compiler didn’t see, like another script tag on the HTML or in the JS console like we did in this tutorial, then because of optimizations and minification you should export ccall from the runtime, using EXPORTED_RUNTIME_METHODS, for example using -sEXPORTED_RUNTIME_METHODS=ccall,cwrap, and call it on Module (which contains everything exported, in a safe way that is not influenced by minification or optimizations). Interacting with an API written in C/C++ from NodeJS Say you have a C library that exposes some procedures: //api_example.c #include <stdio.h> #include <emscripten.h> EMSCRIPTEN_KEEPALIVE void sayHi() { printf("Hi!\n"); } EMSCRIPTEN_KEEPALIVE int daysInWeek() { return 7; } Compile the library with emcc: emcc api_example.c -o api_example.js -sMODULARIZE -sEXPORTED_RUNTIME_METHODS=ccall Require the library and call its procedures from node: var factory = require('./api_example.js'); factory().then((instance) => { instance._sayHi(); // direct calling works instance.ccall("sayHi"); // using ccall etc. also work console.log(instance._daysInWeek()); // values can be returned, etc. }); The MODULARIZE option makes emcc emit code in a modular format that is easy to import and use with require(): require() of the module returns a factory function that can instantiate the compiled code, returning a Promise to tell us when it is ready, and giving us the instance of the module as a parameter. (Note that we use ccall here, so we need to add it to the exported runtime methods, as before.) Call compiled C/C++ code “directly” from JavaScript Functions in the original source become JavaScript functions, so you can call them directly if you do type translations yourself — this will be faster than using ccall() or cwrap(), but a little more complicated. To call the method directly, you will need to use the full name as it appears in the generated code. This will be the same as the original C function, but with a leading _. Note If you use ccall() or cwrap(), you do not need to prefix function calls with _ – just use the C name. The parameters you pass to and receive from functions need to be primitive values: Integer and floating point numbers can be passed as-is. Pointers can be passed as-is also, as they are simply integers in the generated code. JavaScript string someString can be converted to a char * using ptr = stringToNewUTF8(someString). Note The conversion to a pointer allocates memory, which needs to be freed up via a call to free(ptr) afterwards (_free in JavaScript side) - char * received from C/C++ can be converted to a JavaScript string using UTF8ToString(). There are other convenience functions for converting strings and encodings in preamble.js. Other values can be passed via emscripten::val. Check out examples on as_handle and take_ownership methods. Calling JavaScript from C/C++ Emscripten provides two main approaches for calling JavaScript from C/C++: running the script using emscripten_run_script() or writing “inline JavaScript”. The most direct, but slightly slower, way is to use emscripten_run_script(). This effectively runs the specified JavaScript code from C/C++ using eval(). For example, to call the browser’s alert() function with the text ‘hi’, you would call the following JavaScript: emscripten_run_script("alert('hi')"); Note The function alert is present in browsers, but not in node or other JavaScript shells. A more generic alternative is to call console.log. A faster way to call JavaScript from C is to write “inline JavaScript”, using EM_JS() or EM_ASM() (and related macros). EM_JS is used to declare JavaScript functions from inside a C file. The “alert” example might be written using EM_JS like: #include <emscripten.h> EM_JS(void, call_alert, (), { alert('hello world!'); throw 'all done'; }); int main() { call_alert(); return 0; } EM_JS’s implementation is essentially a shorthand for implementing a JavaScript library. EM_ASM is used in a similar manner to inline assembly code. The “alert” example might be written with inline JavaScript as: #include <emscripten.h> int main() { EM_ASM( alert('hello world!'); throw 'all done'; ); return 0; } When compiled and run, Emscripten will execute the two lines of JavaScript as if they appeared directly in the generated code. The result would be an alert, followed by an exception. (Note, however, that under the hood Emscripten still does a function call even in this case, which has some amount of overhead.) You can also send values from C into JavaScript inside EM_ASM, for example: EM_ASM({ console.log('I received: ' + $0); }, 100); This will show I received: 100. You can also receive values back, for example the following will print out I received: 100 and then 101: int x = EM_ASM_INT({ console.log('I received: ' + $0); return $0 + 1; }, 100); printf("%d\n", x); See the emscripten.h docs for more details. Note You need to specify if the return value is an int, double or pointer type using the appropriate macro EM_ASM_INT, EM_ASM_DOUBLE or EM_ASM_PTR. (EM_ASM_PTR is the same as EM_ASM_INT unless MEMORY64 is used, so is mostly needed in code that wants to be compatible with MEMORY64). The input values appear as $0, $1, etc. return is used to provide the value sent from JavaScript back to C. See how { and } are used here to enclose the code. This is necessary to differentiate the code from the arguments passed later, which are the input values (this is how C macros work). When using the EM_ASM macro, ensure that you only use single quotes(‘). Double quotes(”) will cause a syntax error that is not detected by the compiler and is only shown when looking at a JavaScript console while running the offending code. clang-format may clobber Javascript constructions, such as => turning to = >. To avoid this, add to your .clang-format: WhitespaceSensitiveMacros: ['EM_ASM', 'EM_JS', 'EM_ASM_INT', 'EM_ASM_DOUBLE', 'EM_ASM_PTR', 'MAIN_THREAD_EM_ASM', 'MAIN_THREAD_EM_ASM_INT', 'MAIN_THREAD_EM_ASM_DOUBLE', 'MAIN_THREAD_EM_ASM_DOUBLE', 'MAIN_THREAD_ASYNC_EM_ASM']. Or, turn clang-format off by writing // clang-format off before the EM_ASM section and // clang-format on after it. Implement a C API in JavaScript It is possible to implement a C API in JavaScript! This is the approach used in many of Emscripten’s libraries, like SDL1 and OpenGL. You can use it to write your own APIs to call from C/C++. To do this you define the interface, decorating with extern to mark the methods in the API as external symbols. You then implement the symbols in JavaScript by simply adding their definition to library.js (by default). When compiling the C code, the compiler looks in the JavaScript libraries for relevant external symbols. By default, the implementation is added to library.js (and this is where you’ll find parts of Emscripten’s libc). You can put the JavaScript implementation in your own library file and add it using the emcc option --js-library. See test_jslib in test/test_other.py for a complete working example, including the syntax you should use inside the JavaScript library file. As a simple example, consider the case where you have some C code like this: extern void my_js(void); int main() { my_js(); return 1; } Note When using C++ you should encapsulate extern void my_js(); in an extern "C" {} block to prevent C++ name mangling: extern "C" { extern void my_js(); } Then you can implement my_js in JavaScript by simply adding the implementation to library.js (or your own file). Like our other examples of calling JavaScript from C, the example below just creates a dialog box using a simple alert() function. my_js: function() { alert('hi'); }, If you add it to your own file, you should write something like addToLibrary({ my_js: function() { alert('hi'); }, }); addToLibrary copies the properties of the input object into LibraryManager.library (the global object where all JavaScript library code lives). In this case its adds a function called my_js onto this object. JavaScript limits in library files If you’re not familiar with JavaScript, say if you’re a C/C++ programmer and just using emscripten, then the following issues probably won’t come up, but if you’re an experienced JavaScript programmer you need to be aware some common JavaScript practices can not be used in certain ways in emscripten library files. To save space, by default, emscripten only includes library properties referenced from C/C++. It does this by calling toString on each used property on the JavaScript libraries that are linked in. That means that you can’t use a closure directly, for example, as toString isn’t compatible with that - just like when using a string to create a Web Worker, where you also can’t pass a closure. (Note that this limitation is just for the values for the keys of the object passes to addToLibrary in the JS library, that is, the toplevel key-value pairs are special. Interior code inside a function can have arbitrary JS, of course). To avoid this limitation of JS libraries, you can put code in another file using the --pre-js '''
year_published = 2025
