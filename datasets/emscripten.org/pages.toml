title = "html5.h — Emscripten 4.0.5-git (dev) documentation"
full_description = 'html5.h The C++ APIs in html5.h define the Emscripten low-level glue bindings to interact with HTML5 events from native code. Tip The C++ APIs map closely to their equivalent HTML5 JavaScript APIs. The HTML5 specifications listed below provide additional detailed reference “over and above” the information provided in this document. In addition, the Test/Example code can be reviewed to see how the code is used. The HTML5 specifications for APIs that are mapped by html5.h include: DOM Level 3 Events: Keyboard, Mouse, Mouse Wheel, Resize, Scroll, Focus. Device Orientation Events for gyro and accelerometer. Screen Orientation Events for portrait/landscape handling. Fullscreen Events for browser canvas fullscreen modes transitioning. Pointer Lock Events for relative-mode mouse motion control. Vibration API for mobile device haptic vibration feedback control. Page Visibility Events for power management control. Touch Events. Gamepad API. Beforeunload event. WebGL context events. Animation and timing. Console. Throw. Table of Contents How to use this API General types Function result values Keys Mouse Wheel UI Focus Device orientation Device motion Orientation Fullscreen Pointerlock Visibility Touch Gamepad Battery Vibration Page unload WebGL context CSS Animation and Timing Throw How to use this API Most of these APIs use an event-based architecture; functionality is accessed by registering a callback function that will be called when the event occurs. Note The Gamepad API is currently an exception, as only a polling API is available. For some APIs, both an event-based and a polling-based model are exposed. Registration functions The typical format of registration functions is as follows (some methods may omit various parameters): EMSCRIPTEN_RESULT emscripten_set_some_callback( const char *target, // ID of the target HTML element. void *userData, // User-defined data to be passed to the callback. bool useCapture, // Whether or not to use capture. em_someevent_callback_func callback // Callback function. ); The target parameter is the ID of the HTML element to which the callback registration is to be applied. This field has the following special meanings: EMSCRIPTEN_EVENT_TARGET_WINDOW: The event listener is applied to the JavaScript window object. EMSCRIPTEN_EVENT_TARGET_DOCUMENT: The event listener is applied to the JavaScript document object. EMSCRIPTEN_EVENT_TARGET_SCREEN: The event listener is applied to the JavaScript window.screen object. 0 or NULL: If building with the option -sDISABLE_DEPRECATED_FIND_EVENT_TARGET_BEHAVIOR (default), NULL denotes an invalid element. If building with legacy option -sDISABLE_DEPRECATED_FIND_EVENT_TARGET_BEHAVIOR=0 (not recommended), a default element is chosen automatically based on the event type. #canvas: If building with legacy option -sDISABLE_DEPRECATED_FIND_EVENT_TARGET_BEHAVIOR=0 (not recommended), the event listener is applied to the Emscripten default WebGL canvas element. If building with the option -sDISABLE_DEPRECATED_FIND_EVENT_TARGET_BEHAVIOR (default), #canvas is interpreted as a CSS query selector: “the first element with CSS ID ‘canvas’”. Any other string: A CSS selector lookup is performed to the DOM with the passed string, and the event listener is applied to the first element that matches the query. If the above are insufficient for you, you can add custom mappings in JavaScript using something like specialHTMLTargets["!canvas"] = Module.canvas; That will let !canvas map to the canvas held in Module.canvas. (You can write that JavaScript in an EM_JS or EM_ASM block that happens before you call the registration function, for example.) The userData parameter is a user-defined value that is passed (unchanged) to the registered event callback. This can be used to, for example, pass a pointer to a C++ class or similarly to enclose the C API in a clean object-oriented manner. The useCapture parameter maps to useCapture in EventTarget.addEventListener. It indicates whether or not to initiate capture: if true the callback will be invoked only for the DOM capture and target phases; if false the callback will be triggered during the target and bubbling phases. See DOM Level 3 Events for a more detailed explanation. Most functions return the result using the type EMSCRIPTEN_RESULT. Zero and positive values denote success. Negative values signal failure. None of the functions fail or abort by throwing a JavaScript or C++ exception. If a particular browser does not support the given feature, the value EMSCRIPTEN_RESULT_NOT_SUPPORTED will be returned at the time the callback is registered. Callback functions When the event occurs the callback is invoked with the relevant event “type” (for example EMSCRIPTEN_EVENT_CLICK), a struct containing the details of the event that occurred, and the userData that was originally passed to the registration function. The general format of the callback function is: typedef bool (*em_someevent_callback_func) // Callback function. Return true if event is "consumed". ( int eventType, // The type of event. const EmscriptenSomeEvent *someEvent, // Information about the event. void *userData // User data passed from the registration function. ); Callback handlers that return a bool may specify true to signal that the handler consumed the event (this suppresses the default action for that event by calling its .preventDefault(); member). Returning false indicates that the event was not consumed — the default browser event action is carried out and the event is allowed to pass on/bubble up as normal. Calling a registration function with a null pointer for the callback causes a de-registration of that callback from the given target element. All event handlers are also automatically unregistered when the C exit() function is invoked during the atexit handler pass. Either use the function emscripten_set_main_loop() or set Module.noExitRuntime = true; to make sure that leaving main() will not immediately cause an exit() and clean up the event handlers. Functions affected by web security Some functions, including emscripten_request_pointerlock() and emscripten_request_fullscreen(), are affected by web security. While the functions can be called anywhere, the actual “requests” can only be raised inside the handler for a user-generated event (for example a key, mouse or touch press/release). When porting code, it may be difficult to ensure that the functions are called inside appropriate event handlers (so that the requests are raised immediately). As a convenience, developers can set deferUntilInEventHandler=true to automatically defer insecure requests until the user next presses a keyboard or mouse button. This simplifies porting, but often results in a poorer user experience. For example, the user must click once on the canvas to hide the pointer or transition to full screen. Where possible, the functions should only be called inside appropriate event handlers. Setting deferUntilInEventHandler=false causes the functions to abort with an error if the request is refused due to a security restriction: this is a useful mechanism for discovering instances where the functions are called outside the handler for a user-generated event. Test/Example code The HTML5 test code demonstrates how to use this API: test_html5_core.c test_html5_fullscreen.c test_html5_mouse.c General types EM_UTF8 This is the Emscripten type for a UTF8 string (maps to a char). This is used for node names, element ids, etc. Function result values Most functions in this API return a result of type EMSCRIPTEN_RESULT. None of the functions fail or abort by throwing a JavaScript or C++ exception. If a particular browser does not support the given feature, the value EMSCRIPTEN_RESULT_NOT_SUPPORTED will be returned at the time the callback is registered. EMSCRIPTEN_RESULT This type is used to return the result of most functions in this API. Zero and positive values denote success, while negative values signal failure. Possible values are listed below. EMSCRIPTEN_RESULT_SUCCESS The operation succeeded. EMSCRIPTEN_RESULT_DEFERRED The requested operation cannot be completed now for web security reasons, and has been deferred for completion in the next event handler. EMSCRIPTEN_RESULT_NOT_SUPPORTED The given operation is not supported by this browser or the target element. This value will be returned at the time the callback is registered if the operation is not supported. EMSCRIPTEN_RESULT_FAILED_NOT_DEFERRED The requested operation could not be completed now for web security reasons. It failed because the user requested the operation not be deferred. EMSCRIPTEN_RESULT_INVALID_TARGET The operation failed because the specified target element is invalid. EMSCRIPTEN_RESULT_UNKNOWN_TARGET The operation failed because the specified target element was not found. EMSCRIPTEN_RESULT_INVALID_PARAM The operation failed because an invalid parameter was passed to the function. EMSCRIPTEN_RESULT_FAILED Generic failure result message, returned if no specific result is available. EMSCRIPTEN_RESULT_NO_DATA The operation failed because no data is currently available. Keys Defines EMSCRIPTEN_EVENT_KEYPRESS EMSCRIPTEN_EVENT_KEYDOWN EMSCRIPTEN_EVENT_KEYUP Emscripten key events. DOM_KEY_LOCATION The location of the key on the keyboard; one of the values below. DOM_KEY_LOCATION_STANDARD DOM_KEY_LOCATION_LEFT DOM_KEY_LOCATION_RIGHT DOM_KEY_LOCATION_NUMPAD Locations of the key on the keyboard. Struct type EmscriptenKeyboardEvent The event structure passed in keyboard events: keypress, keydown and keyup. Note that since the DOM Level 3 Events spec is very recent at the time of writing (2014-03), uniform support for the different fields in the spec is still in flux. Be sure to check the results in multiple browsers. See the unmerged pull request #2222 for an example of how to interpret the legacy key events. double timestamp Absolute wallclock time when the data was recorded (milliseconds). EM_UTF8 key The printed representation of the pressed key. Maximum size 32 char (i.e. EM_UTF8 key[32]). EM_UTF8 code A string that identifies the physical key being pressed. The value is not affected by the current keyboard layout or modifier state, so a particular key will always return the same value. Maximum size 32 char (i.e. EM_UTF8 code[32]). unsigned int location Indicates the location of the key on the keyboard. One of the DOM_KEY_LOCATION values. bool ctrlKey bool shiftKey bool altKey bool metaKey Specifies which modifiers were active during the key event. bool repeat Specifies if this keyboard event represents a repeated press. EM_UTF8 locale A locale string indicating the configured keyboard locale. This may be an empty string if the browser or device doesn’t know the keyboard’s locale. Maximum size 32 char (i.e. EM_UTF8 locale[32]). EM_UTF8 charValue The following fields are values from previous versions of the DOM key events specifications. See the character representation of the key. This is the field char from the docs, but renamed to charValue to avoid a C reserved word. Maximum size 32 char (i.e. EM_UTF8 charValue[32]). Warning This attribute has been dropped from DOM Level 3 events. unsigned int charCode The Unicode reference number of the key; this attribute is used only by the keypress event. For keys whose char attribute contains multiple characters, this is the Unicode value of the first character in that attribute. Warning This attribute is deprecated, you should use the field key instead, if available. unsigned int keyCode A system and implementation dependent numerical code identifying the unmodified value of the pressed key. Warning This attribute is deprecated, you should use the field key instead, if available. unsigned int which A system and implementation dependent numeric code identifying the unmodified value of the pressed key; this is usually the same as keyCode. Warning This attribute is deprecated, you should use the field key instead, if available. Note thought that while this field is deprecated, the cross-browser support for which may be better than for the other fields, so experimentation is recommended. Read issue https://github.com/emscripten-core/emscripten/issues/2817 for more information. Callback functions type em_key_callback_func Function pointer for the keypress callback functions, defined as: typedef bool (*em_key_callback_func)(int eventType, const EmscriptenKeyboardEvent *keyEvent, void *userData); Param int eventType: The type of key event. Param keyEvent: Information about the key event that occurred. Type keyEvent: const EmscriptenKeyboardEvent* Param void* userData: The userData originally passed to the registration function. Returns: true (non zero) to indicate that the event was consumed by the callback handler. Rtype: bool Functions EMSCRIPTEN_RESULT emscripten_set_keypress_callback(const char *target, void *userData, bool useCapture, em_key_callback_func callback) EMSCRIPTEN_RESULT emscripten_set_keydown_callback(const char *target, void *userData, bool useCapture, em_key_callback_func callback) EMSCRIPTEN_RESULT emscripten_set_keyup_callback(const char *target, void *userData, bool useCapture, em_key_callback_func callback) Registers a callback function for receiving browser-generated keyboard input events. Parameters: target (const char*) – Target HTML element id. userData (void*) – User-defined data to be passed to the callback (opaque to the API). useCapture (bool) – Set true to use capture. callback (em_key_callback_func) – A callback function. The function is called with the type of event, information about the event, and user data passed from this registration function. The callback should return true if the event is consumed. Returns: EMSCRIPTEN_RESULT_SUCCESS, or one of the other result values. Return type: EMSCRIPTEN_RESULT See also: https://developer.mozilla.org/en/DOM/Event/UIEvent/KeyEvent http://www.javascriptkit.com/jsref/eventkeyboardmouse.shtml Note To receive events, the element must be focusable, see https://github.com/emscripten-core/emscripten/pull/7484#issuecomment-437887001 Mouse Defines EMSCRIPTEN_EVENT_CLICK EMSCRIPTEN_EVENT_MOUSEDOWN EMSCRIPTEN_EVENT_MOUSEUP EMSCRIPTEN_EVENT_DBLCLICK EMSCRIPTEN_EVENT_MOUSEMOVE EMSCRIPTEN_EVENT_MOUSEENTER EMSCRIPTEN_EVENT_MOUSELEAVE Emscripten mouse events. Struct type EmscriptenMouseEvent The event structure passed in mouse events: click, mousedown, mouseup, dblclick, mousemove, mouseenter and mouseleave. double timestamp Absolute wallclock time when the data was recorded (milliseconds). int screenX int screenY The coordinates relative to the browser screen coordinate system. int clientX int clientY The coordinates relative to the viewport associated with the event. bool ctrlKey bool shiftKey bool altKey bool metaKey Specifies which modifiers were active during the mouse event. unsigned short button Identifies which pointer device button changed s'
