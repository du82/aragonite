["https://emscripten.org/docs/porting/connecting_cpp_and_javascript/embind.html"]
title = "Embind — Emscripten 4.0.5-git (dev) documentation"
full_description = '''Embind Embind is used to bind C++ functions and classes to JavaScript, so that the compiled code can be used in a natural way by “normal” JavaScript. Embind also supports calling JavaScript classes from C++. Embind has support for binding most C++ constructs, including those introduced in C++11 and C++14. Its only significant limitation is that it does not currently support raw pointers with complicated lifetime semantics. This article shows how to use EMSCRIPTEN_BINDINGS() blocks to create bindings for functions, classes, value types, pointers (including both raw and smart pointers), enums, and constants, and how to create bindings for abstract classes that can be overridden in JavaScript. It also briefly explains how to manage the memory of C++ object handles passed to JavaScript. Tip In addition to the code in this article: There are many other examples of how to use Embind in the Test Suite. Connecting C++ and JavaScript on the Web with Embind (slides from CppCon 2014) contains more examples and information about Embind’s design philosophy and implementation. Note Embind was inspired by Boost.Python and uses a very similar approach for defining bindings. A quick example The following code uses an EMSCRIPTEN_BINDINGS() block to expose the simple C++ lerp() function() to JavaScript. // quick_example.cpp #include <emscripten/bind.h> using namespace emscripten; float lerp(float a, float b, float t) { return (1 - t) * a + t * b; } EMSCRIPTEN_BINDINGS(my_module) { function("lerp", &lerp); } To compile the above example using embind, we invoke emcc with the bind option: emcc -lembind -o quick_example.js quick_example.cpp The resulting quick_example.js file can be loaded as a node module or via a <script> tag: <!doctype html> <html> <script> var Module = { onRuntimeInitialized: function() { console.log('lerp result: ' + Module.lerp(1, 2, 0.5)); } }; </script> <script src="quick_example.js"></script> </html> Note We use the onRuntimeInitialized callback to run code when the runtime is ready, which is an asynchronous operation (in order to compile WebAssembly). Note Open the developer tools console to see the output of console.log. The code in an EMSCRIPTEN_BINDINGS() block runs when the JavaScript file is initially loaded (at the same time as the global constructors). The function lerp()’s parameter types and return type are automatically inferred by embind. All symbols exposed by embind are available on the Emscripten Module object. Important Always access objects through the Module object object, as shown above. While the objects are also available in the global namespace by default, there are cases where they will not be (for example, if you use the closure compiler to minify code or wrap compiled code in a function to avoid polluting the global namespace). You can of course use whatever name you like for the module by assigning it to a new variable: var MyModuleName = Module;. Binding libraries Binding code is run as a static constructor and static constructors only get run if the object file is included in the link, therefore when generating bindings for library files the compiler must be explicitly instructed to include the object file. For example, to generate bindings for a hypothetical library.a compiled with Emscripten run emcc with --whole-archive compiler flag: emcc -lembind -o library.js -Wl,--whole-archive library.a -Wl,--no-whole-archive Classes Exposing classes to JavaScript requires a more complicated binding statement. For example: class MyClass { public: MyClass(int x, std::string y) : x(x) , y(y) {} void incrementX() { ++x; } int getX() const { return x; } void setX(int x_) { x = x_; } static std::string getStringFromInstance(const MyClass& instance) { return instance.y; } private: int x; std::string y; }; // Binding code EMSCRIPTEN_BINDINGS(my_class_example) { class_<MyClass>("MyClass") .constructor<int, std::string>() .function("incrementX", &MyClass::incrementX) .property("x", &MyClass::getX, &MyClass::setX) .property("x_readonly", &MyClass::getX) .class_function("getStringFromInstance", &MyClass::getStringFromInstance) ; } The binding block defines a chain of member function calls on the temporary class_ object (this same style is used in Boost.Python). The functions register the class, its constructor(), member function(), class_function() (static) and property(). Note This binding block binds the class and all its methods. As a rule you should bind only those items that are actually needed, as each binding increases the code size. For example, it would be rare to bind private or internal methods. An instance of MyClass can then be created and used in JavaScript as shown below: var instance = new Module.MyClass(10, "hello"); instance.incrementX(); instance.x; // 11 instance.x = 20; // 20 Module.MyClass.getStringFromInstance(instance); // "hello" instance.delete(); Note The closure compiler is unaware of the names of symbols that are exposed to JavaScript via Embind. In order to prevent such symbols from being renamed by the closure compiler in your own code (provided for example by using the --pre-js or --post-js compiler flags) it is necessary to annotate the code accordingly. Without such annotations, the resulting JavaScript code will no longer match the symbol names used in the Embind code and runtime errors will occur as a result. In order to prevent the closure compiler from renaming the symbols in the above example code it needs to be rewritten as follows: var instance = new Module["MyClass"](10, "hello"); instance["incrementX"](); instance["x"]; // 11 instance["x"] = 20; // 20 Module["MyClass"]["getStringFromInstance"](instance); // "hello" instance.delete(); Note that this is only needed for code seen by the optimizer, for example as in --pre-js or --post-js as mentioned above, or on EM_ASM or EM_JS. For other code, that is not optimized by closure compiler, you do not need to make such changes. You also do not need it if you build without --closure 1 to enable the closure compiler. Memory management The delete() JavaScript method is provided to manually signal that a C++ object is no longer needed and can be deleted: var x = new Module.MyClass; x.method(); x.delete(); var y = Module.myFunctionThatReturnsClassInstance(); y.method(); y.delete(); Note Both C++ objects constructed from the JavaScript side as well as those returned from C++ methods must be explicitly deleted, unless a reference return value policy is used (see below). Tip The try … finally JavaScript construct can be used to guarantee C++ object handles are deleted for all code paths, regardless of early returns or errors thrown. function myFunction() { const x = new Module.MyClass; try { if (someCondition) { return; // ! } someFunctionThatMightThrow(); // oops x.method(); } finally { x.delete(); // will be called no matter what } } Automatic memory management JavaScript only gained support for finalizers in ECMAScript 2021, or ECMA-262 Edition 12. The new API is called FinalizationRegistry and it still does not offer any guarantees that the provided finalization callback will be called. Embind uses this for cleanup if available, but only for smart pointers, and only as a last resort. Warning It is strongly recommended that JavaScript code explicitly deletes any C++ object handles it has received. Cloning and Reference Counting There are situations in which multiple long-lived portions of the JavaScript codebase need to hold on to the same C++ object for different amounts of time. To accommodate that use case, Emscripten provides a reference counting mechanism in which multiple handles can be produced for the same underlying C++ object. Only when all handles have been deleted does the object get destroyed. The clone() JavaScript method returns a new handle. It must eventually also be disposed with delete(): async function myLongRunningProcess(x, milliseconds) { // sleep for the specified number of milliseconds await new Promise(resolve => setTimeout(resolve, milliseconds)); x.method(); x.delete(); } const y = new Module.MyClass; // refCount = 1 myLongRunningProcess(y.clone(), 5000); // refCount = 2 myLongRunningProcess(y.clone(), 3000); // refCount = 3 y.delete(); // refCount = 2 // (after 3000ms) refCount = 1 // (after 5000ms) refCount = 0 -> object is deleted Value types Manual memory management for basic types is onerous, so embind provides support for value types. Value arrays are converted to and from JavaScript Arrays and value objects are converted to and from JavaScript Objects. Consider the example below: struct Point2f { float x; float y; }; struct PersonRecord { std::string name; int age; }; // Array fields are treated as if they were std::array<type,size> struct ArrayInStruct { int field[2]; }; PersonRecord findPersonAtLocation(Point2f); EMSCRIPTEN_BINDINGS(my_value_example) { value_array<Point2f>("Point2f") .element(&Point2f::x) .element(&Point2f::y) ; value_object<PersonRecord>("PersonRecord") .field("name", &PersonRecord::name) .field("age", &PersonRecord::age) ; value_object<ArrayInStruct>("ArrayInStruct") .field("field", &ArrayInStruct::field) // Need to register the array type ; // Register std::array<int, 2> because ArrayInStruct::field is interpreted as such value_array<std::array<int, 2>>("array_int_2") .element(index<0>()) .element(index<1>()) ; function("findPersonAtLocation", &findPersonAtLocation); } The JavaScript code does not need to worry about lifetime management. var person = Module.findPersonAtLocation([10.2, 156.5]); console.log('Found someone! Their name is ' + person.name + ' and they are ' + person.age + ' years old'); Advanced class concepts Object Ownership JavaScript and C++ have very different memory models which can lead to it being unclear which language owns and is responsible for deleting an object when it moves between languages. To make object ownership more explicit, embind supports smart pointers and return value policies. Return value polices dictate what happens to a C++ object when it is returned to JavaScript. To use a return value policy, pass the desired policy into function, method, or property bindings. For example: EMSCRIPTEN_BINDINGS(module) { function("createData", &createData, return_value_policy::take_ownership()); } Embind supports three return value policies that behave differently depending on the return type of the function. The policies work as follows: default (no argument) - For return by value and reference a new object will be allocated using the object’s copy constructor. JS then owns the object and is responsible for deleting it. Returning a pointer is not allowed by default (use an explicit policy below). return_value_policy::take_ownership - Ownership is transferred to JS. return_value_policy::reference - Reference an existing object but do not take ownership. Care must be taken to not delete the object while it is still in use in JS. More details below: Return Type Constructor Cleanup default Value (T) copy JS must delete the copied object. Reference (T&) copy JS must delete the copied object. Pointer (T*) n/a Pointers must explicitly use a return policy. take_ownership Value (T) move JS must delete the moved object. Reference (T&) move JS must delete the moved object. Pointer (T*) none JS must delete the object. reference Value (T) n/a Reference to a value is not allowed. Reference (T&) none C++ must delete the object. Pointer (T*) none C++ must delete the object. Raw pointers Because raw pointers have unclear lifetime semantics, embind requires their use to be marked with either allow_raw_pointers or with a return_value_policy. If the function returns a pointer it is recommended to use a return_value_policy instead of the general allow_raw_pointers. For example: class C {}; C* passThrough(C* ptr) { return ptr; } C* createC() { return new C(); } EMSCRIPTEN_BINDINGS(raw_pointers) { class_<C>("C"); function("passThrough", &passThrough, allow_raw_pointers()); function("createC", &createC, return_value_policy::take_ownership()); } Note Currently allow_raw_pointers for pointer arguments only serves to allow raw pointer use, and show that you’ve thought about the use of the raw pointers. Eventually we hope to implement Boost.Python-like raw pointer policies for managing object ownership of arguments as well. External constructors There are two ways to specify constructors for a class. The zero-argument template form invokes the natural constructor with the arguments specified in the template. For example: class MyClass { public: MyClass(int, float); void someFunction(); }; EMSCRIPTEN_BINDINGS(external_constructors) { class_<MyClass>("MyClass") .constructor<int, float>() .function("someFunction", &MyClass::someFunction) ; } The second form of the constructor takes a function pointer argument, and is used for classes that construct themselves using a factory function. For example: class MyClass { virtual void someFunction() = 0; }; MyClass* makeMyClass(int, float); //Factory function. EMSCRIPTEN_BINDINGS(external_constructors) { class_<MyClass>("MyClass") .constructor(&makeMyClass, allow_raw_pointers()) .function("someFunction", &MyClass::someFunction) ; } The two constructors present exactly the same interface for constructing the object in JavaScript. Continuing the example above: var instance = new MyClass(10, 15.5); // instance is backed by a raw pointer to a MyClass in the Emscripten heap Smart pointers To manage object lifetime with smart pointers, embind must be told about the smart pointer type. For example, consider managing a class C’s lifetime with std::shared_ptr<C>. The best way to do this is to use smart_ptr_constructor() to register the smart pointer type: EMSCRIPTEN_BINDINGS(better_smart_pointers) { class_<C>("C") .smart_ptr_constructor("C", &std::make_shared<C>) ; } When an object of this type is constructed (e.g. using new Module.C()) it returns a std::shared_ptr<C>. An alternative is to use smart_ptr() in the EMSCRIPTEN_BINDINGS() block: EMSCRIPTEN_BINDINGS(smart_pointers) { class_<C>("C") .constructor<>() .smart_ptr<std::shared_ptr<C>>("C") ; } Using this definition, functions can return std::shared_ptr<C> or take std::shared_ptr<C> as arguments, but new Module.C() would still return a raw pointer. unique_ptr embind has built-in support for return values of type std::unique_ptr. Custom smart pointers To teach embind about custom smart pointer templates, you must specialize the smart_ptr_trait template. Non-member-functions on the JavaScript prototype Methods on the JavaScript class prototype can be non-member functions, as long as the instance handle can be converted to the first argument of the non-member function. The classic example is when the function exposed to JavaScript does not exactly match the behavior of a C++ method. struct Array10 { int& get(size_t index) { return data[index]; } int data[10]; }; val Array10_get(Array10& arr, size_t index) { if (index < 10) { return val(arr.get(index)); } else { return va'''
