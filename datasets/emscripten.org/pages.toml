full_description = "Code Portability and Limitations Emscripten can be used to compile almost any portable C/C++ code to JavaScript. The topics in this section help identify less portable code, and code that may need to be changed because of limitations in the browser environment or Emscripten-compiled JavaScript. Portability Guidelines API Limitations Function Pointer Issues Specific Browser Limitations Emscripten can be used to compile almost any portable C/C++ code to JavaScript. The topics in this section help identify less portable code, and code that may need to be changed because of limitations in the browser environment or Emscripten-compiled JavaScript."
