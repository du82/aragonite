["https://emscripten.org/docs/tools_reference/index.html"]
title = "Tools Reference — Emscripten 4.0.5-git (dev) documentation"
full_description = "Tools Reference This section provides reference for the main tools in the Emscripten toolchain: Emscripten Compiler Frontend (emcc) Emcc is used to call the Emscripten compiler from the command line. It is effectively a drop-in replacement for a standard compiler like gcc or clang. Emscripten SDK (emsdk): Emsdk is used to perform all SDK maintenance. You can use it to download, install, activate, and remove SDKs and tools, and even to build and use the latest compiler from source on GitHub. Emscripten Windows Command Prompt (emcmdprompt.bat) This prompt is used to call Emscripten from the command line on Windows. It is configured with the correct system paths and settings to point to the active Emscripten SDK/tools."
