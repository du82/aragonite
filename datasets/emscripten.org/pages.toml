["https://emscripten.org/docs/porting/multimedia_and_graphics/OpenGL-support.html"]
title = "OpenGL support in Emscripten — Emscripten 4.0.5-git (dev) documentation"
full_description = "OpenGL support in Emscripten Emscripten provides three OpenGL modes: WebGL-friendly subset of OpenGL ES 2.0/3.0 (default) — supports the set of OpenGL ES 2.0/3.0 commands that map directly to WebGL 1/2. OpenGL ES 2.0/3.0 emulation — support for some emulated OpenGL ES 2.0/3.0 features that are not present in WebGL. Emulation of older Desktop OpenGL API features — support for a number of legacy GL 1.x features and commands. This topic provides information about the modes, and how they are enabled. Tip We highly recommend using the WebGL-friendly subset of OpenGL ES 2.0/3.0 for new code, and porting existing code to this subset if possible. The other two modes are less efficient, and should only be considered for codebases that rely heavily on those features. WebGL-friendly subset of OpenGL ES 2.0/3.0 By default, Emscripten targets the WebGL-friendly subset of OpenGL ES 2.0. This is the set of GL ES commands that map directly to WebGL, so that each GL command has a roughly direct mapping to WebGL. It includes almost all of OpenGL ES 2.0, with the notable exception of client-side arrays, and some other features that are listed in WebGL 1.0 Specification/Chapter 6. To program against the WebGL subset of OpenGL ES, one uses the GL ES 2.0 header files and the GL ES 2.0 API, while adhering to the limitations specified in Chapter 6 of the WebGL specification. This mode is used by default because it best matches the WebGL features provided by browsers. To target WebGL 2, pass the linker flag -sMAX_WEBGL_VERSION=2. Specifying this flag enables (and defaults to, unless otherwise specified at context creation time) the creation of WebGL 2 contexts at runtime, but it is still possible to create WebGL 1 contexts, so applications can choose whether to require WebGL 2 or whether to support a fallback to WebGL 1. To only target WebGL 2 and drop support for WebGL 1 altogether to save code size, pass the linker flags -sMIN_WEBGL_VERSION=2 and -sMAX_WEBGL_VERSION=2. OpenGL ES 2.0/3.0 emulation This build mode emulates some features of OpenGL ES 2.0/3.0 that are not part of the core WebGL 1 specification. In particular, this mode emulates client-side arrays that are missing [1] from the WebGL-friendly subset of OpenGL ES 2.0/3.0. This allows you to use functions glDrawArrays and glDrawElements etc. without a bound buffer, and Emscripten’s GL bindings will set up the buffer automatically (WebGL requires that a buffer be bound). Note This build mode has a limitation that the largest index in client-side index buffer must be smaller than the total number of indices in that buffer. See issue #4214 for more details. To enable OpenGL ES 2.0 emulation, specify the emcc option -sFULL_ES2 when linking the final executable (.js/.html) of the project. To enable OpenGL ES 3.0 emulation, specify the emcc option -sFULL_ES3 when linking the final executable (.js/.html) of the project. This adds emulation for mapping memory blocks to client side memory. The flags -sFULL_ES2 and -sFULL_ES3 are orthogonal, so either one or both can be specified to emulate different features. Emulation of older Desktop OpenGL API features This OpenGL mode enables support for a number of legacy desktop OpenGL 1.x features and commands (for example “immediate mode” and glNormalPointer). While the emulation is by no means complete, it has been sufficient to port the Sauerbraten 3D game (BananaBread project) and some other real-world codebases using Emscripten. To enable this mode, specify the emcc option -sLEGACY_GL_EMULATION when linking the final executable (.js/.html) of the project. Optimization settings In this mode (-sLEGACY_GL_EMULATION), there are a few extra flags that can be used to tune the performance of the GL emulation layer: -sGL_UNSAFE_OPTS attempts to skip redundant GL work and cleanup. This optimization is unsafe, so is not enabled by default. -sGL_FFP_ONLY tells the GL emulation layer that your code will not use the programmable pipeline/shaders at all. This allows the GL emulation code to perform extra optimizations when it knows that it is safe to do so. Add the Module.GL_MAX_TEXTURE_IMAGE_UNITS integer to your shell .html file to signal the maximum number of texture units used by the code. This ensures that the GL emulation layer does not waste clock cycles iterating over unused texture units when examining which Fixed Function Pipeline (FFP) emulation shader to run. What if my codebase depends on a desktop OpenGL feature that is currently unsupported? You can consider building the codebase against the Regal Desktop OpenGL emulation library, which aims to support Desktop OpenGL features on top of OpenGL ES 2.0. This may work better or worse than Emscripten’s GL emulation depending on the project. Another option is to use gl4es which aims at fast OpenGL to GLES conversion for games. It targets OpenGL 2.1 profile on top of OpenGL ES 2.0 and has been used to port a few games with Emscripten already. OpenGL ES extensions When porting code, it should be noted that desktop OpenGL, OpenGL ES and WebGL each have their own extension registries. This means that neither desktop OpenGL or OpenGL ES extensions are automatically also WebGL extensions, although some amount of parity does exist. See the WebGL 1.0 extension registry for the full list of registered extensions. Additionally, in WebGL, unlike in desktop or mobile OpenGL, extensions must be activated first before the features they expose take effect. If you use one of the native APIs SDL, EGL, GLUT or GLFW to create your GL context, this will be done automatically for most extensions. If instead you use the HTML5 WebGL context creation API, you must explicitly choose whether to autoenable WebGL extensions. If an extension was not automatically enabled at context creation time, the HTML5 API function emscripten_webgl_enable_extension can be used to activate it. Debugging related extensions, draft extensions and vendor-prefixed extensions (MOZ_*, WEBKIT_*) are never enabled automatically at context creation time, but must always be activated manually. When migrating from WebGL 1 to WebGL 2, take note that some WebGL 1 extensions are migrated to core WebGL 2, and therefore their functionality is no longer advertised as GL extensions. This does not mean that the features would be missing, but that it is possible to utilize these features in WebGL 2 without needing to feature test the presence of a GL extension first. Test code/examples The files in test/third_party/glbook provide a number of simple examples that use only the WebGL-friendly subset of OpenGL ES 2.0/3.0. The other modes are covered in various tests, including several in test/test_browser.py. The best way to locate the tests is to search the source code for the appropriate compiler flags: FULL_ES2, LEGACY_GL_EMULATION etc. Bug Reports The Emscripten bug tracker has labels specific to OpenGL and OpenGL Emulation for tracking various GL-related issues. Footnotes: [1] Client-side arrays are missing from WebGL because they are less efficient than properly using GPU-side data."
year_published = 2025
clearnet = "https://emscripten.org/docs/porting/multimedia_and_graphics/OpenGL-support.html"
