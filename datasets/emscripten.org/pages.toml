title = "Emscripten Compiler Settings — Emscripten 4.0.5-git (dev) documentation"
full_description = 'Emscripten Compiler Settings The following is a complete list of settings that can be passed to emscripten via -s on the command line. For example -sASSERTIONS or -sASSERTIONS=0. For more details see the emcc documentation. Unless otherwise noted these settings only apply when linking and have no effect during compilation. ASSERTIONS Whether we should add runtime assertions. This affects both JS and how system libraries are built. ASSERTIONS == 2 gives even more runtime checks, that may be very slow. That includes internal dlmalloc assertions, for example. Default value: 1 STACK_OVERFLOW_CHECK Chooses what kind of stack smash checks to emit to generated code: Building with ASSERTIONS=1 causes STACK_OVERFLOW_CHECK default to 1. Since ASSERTIONS=1 is the default at -O0, which itself is the default optimization level this means that this setting also effectively defaults 1, absent any other settings: 0: Stack overflows are not checked. 1: Adds a security cookie at the top of the stack, which is checked at end of each tick and at exit (practically zero performance overhead) 2: Same as above, but also runs a binaryen pass which adds a check to all stack pointer assignments. Has a small performance cost. Default value: 0 CHECK_NULL_WRITES When STACK_OVERFLOW_CHECK is enabled we also check writes to address zero. This can help detect NULL pointer usage. If you want to skip this extra check (for example, if you want reads from the address zero to always return zero) you can disable this here. This setting has no effect when STACK_OVERFLOW_CHECK is disabled. Default value: true VERBOSE When set to 1, will generate more verbose output during compilation. [general] Default value: false INVOKE_RUN Whether we will run the main() function. Disable if you embed the generated code in your own, and will call main() yourself at the right time (which you can do with Module.callMain(), with an optional parameter of commandline args). Default value: true EXIT_RUNTIME If 0, the runtime is not quit when main() completes (allowing code to run afterwards, for example from the browser main event loop). atexit()s are also not executed, and we can avoid including code for runtime shutdown, like flushing the stdio streams. Set this to 1 if you do want atexit()s or stdio streams to be flushed on exit. This setting is controlled automatically in STANDALONE_WASM mode: For a command (has a main function) this is always 1 For a reactor (no a main function) this is always 0 Default value: false STACK_SIZE The total stack size. There is no way to enlarge the stack, so this value must be large enough for the program’s requirements. If assertions are on, we will assert on not exceeding this, otherwise, it will fail silently. Default value: 64*1024 MALLOC What malloc()/free() to use, out of: dlmalloc - a powerful general-purpose malloc emmalloc - a simple and compact malloc designed for emscripten emmalloc-debug - use emmalloc and add extra assertion checks emmalloc-memvalidate - use emmalloc with assertions+heap consistency checking. emmalloc-verbose - use emmalloc with assertions + verbose logging. emmalloc-memvalidate-verbose - use emmalloc with assertions + heap consistency checking + verbose logging. mimalloc - a powerful mulithreaded allocator. This is recommended in large applications that have malloc() contention, but it is larger and uses more memory. none - no malloc() implementation is provided, but you must implement malloc() and free() yourself. dlmalloc is necessary for split memory and other special modes, and will be used automatically in those cases. In general, if you don’t need one of those special modes, and if you don’t allocate very many small objects, you should use emmalloc since it’s smaller. Otherwise, if you do allocate many small objects, dlmalloc is usually worth the extra size. dlmalloc is also a good choice if you want the extra security checks it does (such as noticing metadata corruption in its internal data structures, which emmalloc does not do). Default value: “dlmalloc” ABORTING_MALLOC If 1, then when malloc would fail we abort(). This is nonstandard behavior, but makes sense for the web since we have a fixed amount of memory that must all be allocated up front, and so (a) failing mallocs are much more likely than on other platforms, and (b) people need a way to find out how big that initial allocation (INITIAL_MEMORY) must be. If you set this to 0, then you get the standard malloc behavior of returning NULL (0) when it fails. Setting ALLOW_MEMORY_GROWTH turns this off, as in that mode we default to the behavior of trying to grow and returning 0 from malloc on failure, like a standard system would. However, you can still set this flag to override that. This is a mostly-backwards-compatible change. Previously this option was ignored when growth was on. The current behavior is that growth turns it off by default, so for users that never specified the flag nothing changes. But if you do specify it, it will have an effect now, which it did not previously. If you don’t want that, just stop passing it in at link time. Note that this setting does not affect the behavior of operator new in C++. This function will always abort on allocation failure if exceptions are disabled. If you want new to return 0 on failure, use it with std::nothrow. Default value: true INITIAL_HEAP The initial amount of heap memory available to the program. This is the memory region available for dynamic allocations via sbrk, malloc and new. Unlike INITIAL_MEMORY, this setting allows the static and dynamic regions of your programs memory to independently grow. In most cases we recommend using this setting rather than INITIAL_MEMORY. However, this setting does not work for imported memories (e.g. when dynamic linking is used). Default value: 16777216 INITIAL_MEMORY The initial amount of memory to use. Using more memory than this will cause us to expand the heap, which can be costly with typed arrays: we need to copy the old heap into a new one in that case. If ALLOW_MEMORY_GROWTH is set, this initial amount of memory can increase later; if not, then it is the final and total amount of memory. By default, this value is calculated based on INITIAL_HEAP, STACK_SIZE, as well the size of static data in input modules. (This option was formerly called TOTAL_MEMORY.) Default value: -1 MAXIMUM_MEMORY Set the maximum size of memory in the wasm module (in bytes). This is only relevant when ALLOW_MEMORY_GROWTH is set, as without growth, the size of INITIAL_MEMORY is the final size of memory anyhow. Note that the default value here is 2GB, which means that by default if you enable memory growth then we can grow up to 2GB but no higher. 2GB is a natural limit for several reasons: If the maximum heap size is over 2GB, then pointers must be unsigned in JavaScript, which increases code size. We don’t want memory growth builds to be larger unless someone explicitly opts in to >2GB+ heaps. Historically no VM has supported more >2GB+, and only recently (Mar 2020) has support started to appear. As support is limited, it’s safer for people to opt into >2GB+ heaps rather than get a build that may not work on all VMs. To use more than 2GB, set this to something higher, like 4GB. (This option was formerly called WASM_MEM_MAX and BINARYEN_MEM_MAX.) Default value: 2147483648 ALLOW_MEMORY_GROWTH If false, we abort with an error if we try to allocate more memory than we can (INITIAL_MEMORY). If true, we will grow the memory arrays at runtime, seamlessly and dynamically. See https://code.google.com/p/v8/issues/detail?id=3907 regarding memory growth performance in chrome. Note that growing memory means we replace the JS typed array views, as once created they cannot be resized. (In wasm we can grow the Memory, but still need to create new views for JS.) Setting this option on will disable ABORTING_MALLOC, in other words, ALLOW_MEMORY_GROWTH enables fully standard behavior, of both malloc returning 0 when it fails, and also of being able to allocate more memory from the system as necessary. Default value: false MEMORY_GROWTH_GEOMETRIC_STEP If ALLOW_MEMORY_GROWTH is true, this variable specifies the geometric overgrowth rate of the heap at resize. Specify MEMORY_GROWTH_GEOMETRIC_STEP=0 to disable overgrowing the heap at all, or e.g. MEMORY_GROWTH_GEOMETRIC_STEP=1.0 to double the heap (+100%) at every grow step. The larger this value is, the more memory the WebAssembly heap overreserves to reduce performance hiccups coming from memory resize, and the smaller this value is, the more memory is conserved, at the performance of more stuttering when the heap grows. (profiled to be on the order of ~20 msecs) Default value: 0.20 MEMORY_GROWTH_GEOMETRIC_CAP Specifies a cap for the maximum geometric overgrowth size, in bytes. Use this value to constrain the geometric grow to not exceed a specific rate. Pass MEMORY_GROWTH_GEOMETRIC_CAP=0 to disable the cap and allow unbounded size increases. Default value: 96*1024*1024 MEMORY_GROWTH_LINEAR_STEP If ALLOW_MEMORY_GROWTH is true and MEMORY_GROWTH_LINEAR_STEP == -1, then geometric memory overgrowth is utilized (above variable). Set MEMORY_GROWTH_LINEAR_STEP to a multiple of WASM page size (64KB), eg. 16MB to replace geometric overgrowth rate with a constant growth step size. When MEMORY_GROWTH_LINEAR_STEP is used, the variables MEMORY_GROWTH_GEOMETRIC_STEP and MEMORY_GROWTH_GEOMETRIC_CAP are ignored. Default value: -1 MEMORY64 The “architecture” to compile for. 0 means the default wasm32, 1 is the full end-to-end wasm64 mode, and 2 is wasm64 for clang/lld but lowered to wasm32 in Binaryen (such that it can run on wasm32 engines, while internally using i64 pointers). Assumes WASM_BIGINT. Note Applicable during both linking and compilation Default value: 0 INITIAL_TABLE Sets the initial size of the table when MAIN_MODULE or SIDE_MODULE is use (and not otherwise). Normally Emscripten can determine the size of the table at link time, but in SPLIT_MODULE mode, wasm-split often needs to grow the table, so the table size baked into the JS for the instrumented build will be too small after the module is split. This is a hack to allow users to specify a large enough table size that can be consistent across both builds. This setting may be removed at any time and should not be used except in conjunction with SPLIT_MODULE and dynamic linking. Default value: -1 ALLOW_TABLE_GROWTH If true, allows more functions to be added to the table at runtime. This is necessary for dynamic linking, and set automatically in that mode. Default value: false GLOBAL_BASE Where global data begins; the start of static memory. A GLOBAL_BASE of 1024 or above is useful for optimizing load/store offsets, as it enables the –low-memory-unused pass Default value: 1024 TABLE_BASE Where table slots (function addresses) are allocated. This must be at least 1 to reserve the zero slot for the null pointer. Default value: 1 USE_CLOSURE_COMPILER Whether closure compiling is being run on this output Default value: false CLOSURE_WARNINGS Deprecated: Use the standard warnings flags instead. e.g. -Wclosure, -Wno-closure, -Werror=closure. options: ‘quiet’, ‘warn’, ‘error’. If set to ‘warn’, Closure warnings are printed out to console. If set to ‘error’, Closure warnings are treated like errors, similar to -Werror compiler flag. Note This setting is deprecated Default value: ‘quiet’ IGNORE_CLOSURE_COMPILER_ERRORS Ignore closure warnings and errors (like on duplicate definitions) Default value: false DECLARE_ASM_MODULE_EXPORTS If set to 1, each wasm module export is individually declared with a JavaScript “var” definition. This is the simple and recommended approach. However, this does increase code size (especially if you have many such exports), which can be avoided in an unsafe way by setting this to 0. In that case, no “var” is created for each export, and instead a loop (of small constant code size, no matter how many exports you have) writes all the exports received into the global scope. Doing so is dangerous since such modifications of the global scope can confuse external JS minifier tools, and also things can break if the scope the code is in is not the global scope (e.g. if you manually enclose them in a function scope). Default value: true INLINING_LIMIT If set to 1, prevents inlining. If 0, we will inline normally in LLVM. This does not affect the inlining policy in Binaryen. Note Only applicable during compilation Default value: false SUPPORT_BIG_ENDIAN If set to 1, perform acorn pass that converts each HEAP access into a function call that uses DataView to enforce LE byte order for HEAP buffer; This makes generated JavaScript run on BE as well as LE machines. (If 0, only LE systems are supported). Does not affect generated wasm. Default value: false SAFE_HEAP Check each write to the heap, for example, this will give a clear error on what would be segfaults in a native build (like dereferencing 0). See runtime_safe_heap.js for the actual checks performed. Set to value 1 to test for safe behavior for both Wasm+Wasm2JS builds. Set to value 2 to test for safe behavior for only Wasm builds. (notably, Wasm-only builds allow unaligned memory accesses. Note, however, that on some architectures unaligned accesses can be very slow, so it is still a good idea to verify your code with the more strict mode 1) Default value: 0 SAFE_HEAP_LOG Log out all SAFE_HEAP operations Default value: false EMULATE_FUNCTION_POINTER_CASTS Allows function pointers to be cast, wraps each call of an incorrect type with a runtime correction. This adds overhead and should not be used normally. Aside from making calls not fail, this tries to convert values as best it can. We use 64 bits (i64) to represent values, as if we wrote the sent value to memory and loaded the received type from the same memory (using truncs/extends/ reinterprets). This means that when types do not match the emulated values may not match (this is true of native too, for that matter - this is all undefined behavior). This approaches appears good enough to support Python, which is the main use case motivating this feature. Default value: false EXCEPTION_DEBUG Print out exceptions in emscriptened code. Default value: false DEMANGLE_SUPPORT If 1, export demangle and stackTrace JS library functions. Note This setting is deprecated Default value: false LIBRARY_DEBUG Print out when we enter a library call (library*.js). You can also unset runtimeDebug at runtime for logging to cease, and can set it when you want it back. A simple way to set it in C++ is: emscripten_run_script("runtimeDebug = ...;"); Default value: false SYSCALL_DEBUG Print out all musl syscalls, including translating their numeric index to the string name, which can be convenient for debugging. (Other system calls are not numbered and already have clear names; use LIBRARY_DEBUG to get logging for all of them.) Default value: false SOCKET_DEBUG Log ou'
