full_description = 'AUTHORS The AUTHORS file lists everyone who has contributed to Emscripten. It is optional for a contributor to add themselves to the AUTHORS file before contributing. The contributors for releases up to Emscripten 4.0.5-git (dev) inclusive (Feb 27, 2025) are listed below. Contributors to Emscripten may optionally add themselves to this list of authors if they choose to do so. This is optional because the git history is good enough for that purpose, and in fact most projects do not maintain such a manual list. While the file is not necessary, to preserve the history of the project we are not removing it. (Authors keep copyright of their contributions, of course; they just grant a license to everyone to use it as detailed in LICENSE.) * Alon Zakai <alonzakai@gmail.com> (copyright owned by Mozilla Foundation) * Tim Dawborn <tim.dawborn@gmail.com> * Max Shawabkeh <max99x@gmail.com> * Sigmund Vik <sigmund_vik@yahoo.com> * Jeff Terrace <jterrace@gmail.com> * Benoit Tremblay <trembl.ben@gmail.com> * Andreas Bergmeier <abergmeier@gmx.net> * Ben Schwartz <bens@alum.mit.edu> * David Claughton <dave@eclecticdave.com> * David Yip <yipdw@member.fsf.org> * Julien Hamaide <julien.hamaide@gmail.com> * Ehsan Akhgari <ehsan.akhgari@gmail.com> (copyright owned by Mozilla Foundation) * Adrian Taylor <adrian@macrobug.com> * Richard Assar <richard.assar@gmail.com> * Nathan Hammond <emscripten@nathanhammond.com> * Behdad Esfahbod <behdad@behdad.org> * David Benjamin <davidben@mit.edu> * Pierre Renaux <pierre@talansoft.com> * Brian Anderson <banderson@mozilla.com> * Jon Bardin <diclophis@gmail.com> * Jukka Jylänki <jujjyl@gmail.com> * Aleksander Guryanov <caiiiycuk@gmail.com> * Chad Austin <chad@chadaustin.me> (copyright owned by IMVU) * nandhp <nandhp@gmail.com> * YeZhongWen <linghuye2.0@gmail.com> * Xingxing Pan <forandom@gmail.com> * Justin Kerk <dopefishjustin@gmail.com> * Andrea Bedini <andrea.bedini@gmail.com> * James Pike <totoro.friend@chilon.net> * Mokhtar Naa