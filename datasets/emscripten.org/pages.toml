["https://emscripten.org/docs/api_reference/Filesystem-API.html"]
title = "File System API — Emscripten 4.0.5-git (dev) documentation"
full_description = "File System API File operations in Emscripten are provided by the FS library. It is used internally for all of Emscripten’s libc and libcxx file I/O. Note The API is inspired by the Linux/POSIX File System API, with each presenting a very similar interface. The underlying behaviour is also similar, except where differences between the native and browser environments make this unreasonable. For example, user and group permissions are defined but ignored in FS.open(). Emscripten predominantly compiles code that uses synchronous file I/O, so the majority of the FS member functions offer a synchronous interface (with errors being reported by raising exceptions of type FS.ErrnoError). File data in Emscripten is partitioned by mounted file systems. Several file systems are provided. An instance of MEMFS is mounted to / by default. The subdirectories /home/web_user and /tmp are also created automatically, in addition to several other special devices and streams (e.g. /dev/null, /dev/random, /dev/stdin, /proc/self/fd); see FS.staticInit() in the FS library for full details. Instances of NODEFS and IDBFS can be mounted to other directories if your application needs to persist data. The automatic tests in test/test_core.py (search for test_files) contain many examples of how to use this API. The tutorial also shows how to pre-load a file so that it can be read from compiled C/C++. A high level overview of the way File Systems work in Emscripten-ported code is provided in the File System Overview. New File System: WasmFS Note Current Status: Stable, but not yet feature-complete with the old FS. WasmFS is a high-performance, fully-multithreaded, WebAssembly-based file system layer for Emscripten that will replace the existing JavaScript version. The JavaScript-based file system was originally written before pthreads were supported and when it was more optimal to write code in JS. As a result it has overhead in pthreads builds because we must proxy to the main thread where all filesystem operations are done. WasmFS, instead, is compiled to Wasm and has full multithreading support. It also aims to be more modular and extensible. Design Doc Link GitHub Tracking Issue Differences you may notice with the original JS filesystem include: The original JS FS includes a lot of JS code by default, while WasmFS does not. As a result, if you write JS of your own, say FS.mkdir(), then the JS FS would already have added that API support, and things would just work. With WasmFS you must opt-in to including the full JS API, to avoid bloating all builds. To do so, use -sFORCE_FILESYSTEM which forces the full filesystem API to be supported from JS. WasmFS requires malloc internally, so you cannot build with -sWASMFS -sMALLOC=none. If you want the smallest possible malloc, use -sMALLOC=emmalloc. (Note that the optimizer may be able to remove WasmFS and malloc, if your code does not actually use files in a non-trivial way.) Including File System Support Emscripten decides whether to include file system support automatically. Many programs don’t need files, and file system support is not negligible in size, so Emscripten avoids including it when it doesn’t see a reason to. That means that if your C/C++ code does not access files, then the FS object and other file system APIs will not be included in the output. And, on the other hand, if your C/C++ code does use files, then file system support will be automatically included. So normally things will “just work” and you don’t need to think about this at all. However, if your C/C++ code doesn’t use files, but you want to use them from JavaScript, then you can build with -sFORCE_FILESYSTEM, which will make the compiler include file system support even though it doesn’t see it being used. On the other hand, if you want to not include any filesystem support code (which may be included even due to printf or iostreams, due to how musl and libc++ are structured), you can build with -sFILESYSTEM=0. Very simple stdout support will be included if necessary in such a case, enough for printf and such to work, but no filesystem code will be added, which can save a significant amount of code size. Persistent data Applications compiled with Emscripten usually expect synchronous I/O, so Emscripten itself provides file systems with completely synchronous interfaces. However, due to JavaScript’s event-driven nature, most persistent storage options offer only asynchronous interfaces. Emscripten offers multiple file systems that can be mounted with FS.mount() to help deal with persistence depending on the execution context. File systems Note Only the MEMFS filesystem is included by default. All others must be enabled explicitly, using -lnodefs.js (NODEFS), -lidbfs.js (IDBFS), -lworkerfs.js (WORKERFS), or -lproxyfs.js (PROXYFS). MEMFS This is the default file system mounted at / when the runtime is initialized. All files exist strictly in-memory, and any data written to them is lost when the page is reloaded. NODEFS Note This file system is only for use when running inside node.js. This file system lets a program in node map directories (via a mount operation) on the host filesystem to directories in Emscripten’s virtual filesystem. It uses node’s synchronous FS API to immediately persist any data written to the Emscripten file system to your local disk. See this test for an example. NODERAWFS Note This file system is only for use when running inside node.js. This is a special backend as it replaces all normal filesystem access with direct Node.js operations, without the need to do FS.mount(). The initial working directory will be same as process.cwd() instead of VFS root directory. Because this mode directly uses Node.js to access the real local filesystem on your OS, the code will not necessarily be portable between OSes - it will be as portable as a Node.js program would be, which means that differences in how the underlying OS handles permissions and errors and so forth may be noticeable. This has mostly been tested on Linux so far. See this section on NODEFS, where you can see a mount operation - this is not needed in NODERAWFS. IDBFS Note This file system is only for use when running code inside a browser. The IDBFS file system implements the FS.syncfs() interface, which when called will persist any operations to an IndexedDB instance. This is provided to overcome the limitation that browsers do not offer synchronous APIs for persistent storage, and so (by default) all writes exist only temporarily in-memory. If the mount option autoPersist: true is passed when mounting IDBFS, then whenever any changes are made to the IDBFS directory tree, they will be automatically persisted to the IndexedDB backend. This lets users avoid needing to manually call FS.syncfs to persist changes to the IDBFS mounted directory tree. WORKERFS Note This file system is only for use when running code inside a worker. This file system provides read-only access to File and Blob objects inside a worker without copying the entire data into memory and can potentially be used for huge files. PROXYFS This allows a module to mount another module’s file system. This is useful when separate modules need to share a file system without manually syncing file contents. For example: // Module 2 can use the path \"/fs1\" to access and modify Module 1's filesystem module2.FS.mkdir(\"/fs1\"); module2.FS.mount(module2.PROXYFS, { root: \"/\", fs: module1.FS }, \"/fs1\"); Devices Emscripten supports registering arbitrary device drivers composed of a device id and a set of device-specific stream callbacks. Once a driver has been registered with FS.registerDevice(), a device node can be created to reference it (using FS.mkdev()). The device node acts as an interface between the device and the file system. Any stream referencing the new node will inherit the stream callbacks registered for the device, making all of the high-level FS operations transparently interact with the device. Note Every device is different and unique. While common file operations like open, close, read, and write are typically supported (and inherited by file streams to provide a layer of abstraction for the equivalent libc functions to call), each device should implement whatever callbacks it needs based on its unique characteristics. FS.makedev(ma, mi) Converts a major and minor number into a single unique integer. This is used as an id to represent the device. Arguments: ma – Major number. mi – Minor number. FS.registerDevice(dev, ops) Registers the specified device driver with a set of callbacks. Arguments: dev – The specific device driver id, created using makedev(). ops (object()) – The set of callbacks required by the device. For an example, see the NODEFS default callbacks. Setting up standard I/O devices Emscripten standard I/O works by going though the virtual /dev/stdin, /dev/stdout and /dev/stderr devices. You can set them up using your own I/O functions by calling FS.init(). By default: stdin will read from the terminal in command line engines and use window.prompt() in browsers (in both cases, with line buffering). stdout will use a print function if one such is defined, printing to the terminal in command line engines and to the browser console in browsers that have a console (again, line-buffered). stderr will use the same output function as stdout. Note All the configuration should be done before the main run() method is executed, typically by implementing Module.preRun. See Interacting with code for more information. FS.init(input, output, error) Sets up standard I/O devices for stdin, stdout, and stderr. The devices are set up using the following (optional) callbacks. If any of the callbacks throw an exception, it will be caught and handled as if the device malfunctioned. Arguments: input – Input callback. This will be called with no parameters whenever the program attempts to read from stdin. It should return an ASCII character code when data is available, or null when it isn’t. output – Output callback. This will be called with an ASCII character code whenever the program writes to stdout. It may also be called with null to flush the output. error – Error callback. This is similar to output, except it is called when data is written to stderr. File system API Note Functions derived from libc like FS.readdir() use all-lowercase names, whereas added functions like FS.readFile() use camelCase names. FS.mount(type, opts, mountpoint) Mounts the FS object specified by type to the directory specified by mountpoint. The opts object is specific to each file system type. Arguments: type – The file system type: MEMFS, NODEFS, IDBFS or WORKERFS. opts (object()) – A generic settings object used by the underlying file system. NODEFS uses the root parameter to map the Emscripten directory to the physical directory. For example, to mount the current folder as a NODEFS instance: FS.mkdir('/working'); FS.mount(NODEFS, { root: '.' }, '/working'); WORKERFS accepts files and blobs parameters to map a provided flat list of files into the mountpoint directory: var blob = new Blob(['blob data']); FS.mkdir('/working'); FS.mount(WORKERFS, { blobs: [{ name: 'blob.txt', data: blob }], files: files, // Array of File objects or FileList }, '/working'); You can also pass in a package of files, created by tools/file_packager with --separate-metadata. You must provide the metadata as a JSON object, and the data as a blob: // load metadata and blob using XMLHttpRequests, or IndexedDB, or from someplace else FS.mkdir('/working'); FS.mount(WORKERFS, { packages: [{ metadata: meta, blob: blob }] }, '/working'); mountpoint (string()) – A path to an existing local Emscripten directory where the file system is to be mounted. It can be either an absolute path, or something relative to the current directory. FS.unmount(mountpoint) Unmounts the specified mountpoint. Arguments: mountpoint (string()) – The directory to unmount. FS.syncfs(populate, callback) Responsible for iterating and synchronizing all mounted file systems in an asynchronous fashion. Note Currently, only the IDBFS file system implements the interfaces needed for synchronization. All other file systems are completely synchronous and don’t require synchronization. The populate flag is used to control the intended direction of the underlying synchronization between Emscripten`s internal data, and the file system’s persistent data. For example: function myAppStartup(callback) { FS.mkdir('/data'); FS.mount(IDBFS, {}, '/data'); FS.syncfs(true, function (err) { // handle callback }); } function myAppShutdown(callback) { FS.syncfs(function (err) { // handle callback }); } A real example of this functionality can be seen in test_idbfs_sync.c. Arguments: populate (bool()) – true to initialize Emscripten’s file system data with the data from the file system’s persistent source, and false to save Emscripten`s file system data to the file system’s persistent source. callback – A notification callback function that is invoked on completion of the synchronization. If an error occurred, it will be provided as a parameter to this function. FS.mkdir(path, mode) Creates a new directory node in the file system. For example: FS.mkdir('/data'); Note The underlying implementation does not support user or group permissions. The caller is always treated as the owner of the folder, and only permissions relevant to the owner apply. Arguments: path (string()) – The path name for the new directory node. mode (int()) – File permissions for the new node. The default setting (in octal numeric notation) is 0777. FS.mkdev(path, mode, dev) Creates a new device node in the file system referencing the registered device driver (FS.registerDevice()) for dev. For example: var id = FS.makedev(64, 0); FS.registerDevice(id, {}); FS.mkdev('/dummy', id); Arguments: path (string()) – The path name for the new device node. mode (int()) – File permissions for the new node. The default setting (in octal numeric notation) is 0777. dev (int()) – The registered device driver. FS.symlink(oldpath, newpath) Creates a symlink node at newpath linking to oldpath. For example: FS.writeFile('file', 'foobar'); FS.symlink('file', 'link'); Arguments: oldpath (string()) – The path name of the file to link to. newpath (string()) – The path to the new symlink node, that points to oldpath. FS.rename(oldpath, newpath) Renames the node at oldpath to newpath. For example: FS.writeFile('file', 'foobar'); FS.rename('file', 'newfile'); Arguments: oldpath (string()) – The old path name. newpath (string()) – The new path name FS.rmdir(path) Removes an empty directory located at path. Example FS.mkdir('data'); FS.rmdir('data'); Arguments: path (string()) – Path of the directory to be removed. FS.unlink(path) Unlinks the node at path. This removes a name from the file system. If that name was the last link to a file (and no processes have the file open) the file is deleted. For example: FS.writeFile('"
