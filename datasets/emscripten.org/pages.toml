title = "About this site — Emscripten 4.0.5-git (dev) documentation"
full_description = 'About this site The site is built using Sphinx (7.1.2), the open source tool used to create the official Python documentation and many other sites. This is a very mature and stable tool, and was selected for, among other reasons, its support for defining API items and linking to them from code. The site uses a custom theme, which is based on the Read the docs theme. Searching the site Searching returns topics that contain all the specified keywords. Tip Always start by searching for single words like “interacting” or “compiling”. Generally this will be enough to find the relevant document. If not, you can refine the search by adding additional terms. Note Searches that include characters like “-” and “+” will not work. There is no support for logical operators. Reporting bugs Please report documentation bugs as you would any other Emscripten bug. Help fix them by updating existing documents or by creating new ones. Contributing to the site Contributions to this site (and indeed any part of Emscripten) are welcome! Check out the rest of this article for instructions on how to build the site and write and update articles. Building the site The site sources are stored on GitHub. Edits and additions should be submitted to this branch in the same way as any other change to the tool. The site is published to the emscripten-core/emscripten-site gh-pages branch (GitHub pages). Note Remember to update the Build version for public builds. Installing Sphinx This site requires a specific version of Sphinx to be installed. Run the following command to ensure you have the correct version installed: pip install -r requirements-dev.txt Site builds The site can be built from source on Ubuntu and Windows by navigating to the /emscripten/site directory and using the command: make clean make html SDK Builds SDK builds are virtually identical to Site builds. The main difference is that on SDK builds the home page has a clear notification that it is an SDK build. SDK builds are enabled by enabling the sdkbuild tag. This is done through the SPHINXOPTS environment variable: # Set the sdkbuild tag. set SPHINXOPTS=-t sdkbuild make html # Unset SPHINXOPTS set SPHINXOPTS= Build version The documentation version should match the Emscripten version for the current build. For a general site build this will be the latest tagged release as defined in Emscripten version. For an SDK build it will be the Emscripten version for the SDK. The version and release information is used in a few places in the documentation, for example AUTHORS. The version information is defined in conf.py — see variables version and release. These variables can be overridden by setting new values in the SPHINXOPTS environment variable. For example, to update the release variable through the command line on Windows: # Set SPHINXOPTS set SPHINXOPTS=-D release=6.40 make html # Unset SPHINXOPTS set SPHINXOPTS= Writing and updating articles Note Sphinx is well documented. This section only attempts to highlight specific styles and features used on this site. The Building the site section explains how to find the sources for articles and build the site. Site content is written using reStructured text. We recommend you read the following articles to understand the syntax: reStructured text primer. Sphinx Domains (define and link to code items). Inline markup. Style guide This section has a few very brief recommendations to help authors use common style. Tip In terms of contributions, we value your coding and content writing far more than perfect prose! Just do your best, and then ask for editorial review. Spelling: Where possible use US-English spelling. Avoid idiomatic expressions: These can be particularly confusing to non-native speakers (for example “putting your foot in your mouth” actually means “saying something embarrassing”). Emphasis: Bold : use for file names, and UI/menu instructions (for example: “Press OK to do something”). Italic : use for tool names - e.g. Clang, emcc, Closure Compiler. monotype : use for inline code (where you can’t link to the API reference) and for demonstrating tool command line options. Note Other than the above rules, emphasis should be used sparingly. Lists: Use a colon on the lead-in to the list where appropriate. Capitalize the first letter and use a full-stop for each item. How to link to a document or heading To link to a page, first define a globally unique reference before the page title (e.g. _my-page-reference) then link to it using the ref role as shown: .. _my-page-reference: My Page Title ============= This is the text of the section. To link to page use either of the options below: ref:`my-reference-label` - the link text is the heading name after the reference ref:`some text <my-reference-label>` - the link text is "some text" This is a better approach than linking to documents using the :doc: role, because the links do not get broken if the articles are moved. This approach is also recommended for linking to arbitrary headings in the site. Note There are a number of other roles that are useful for linking — including Sphinx Domains for linking to code items, and term for linking to glossary terms. Recommended section/heading markup reStructured text defines section headings using a separate line of punctuation characters after (and optionally before) the heading text. The line of characters must be at least as long as the heading. For example: A heading ========= Different punctuation characters are used to specify nested sections. Although the system does not mandate which punctuation character is used for each nested level, it is important to be consistent. The recommended heading levels are: ======================================= Page title (top and bottom bars of "=") ======================================= Level 1 heading (single bar of "=" below) ========================================= Level 2 heading (single bar of "-" below) ----------------------------------------- Level 3 heading (single bar of "+" below) +++++++++++++++++++++++++++++++++++++++++ Level 4 heading (single bar of "~" below) ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Working in markdown New articles may be authored and discussed on the wiki using Markdown syntax before being included in the documentation set. The easiest way to convert these to restructured text is to use a tool like Pandoc. Note The get_wiki.py tool (/site/source/get_wiki.py) can be used to automate getting a snapshot of the wiki. It clones the wiki and calls pandoc on each file. The output is copied to a folder wiki_static. The tool also adds a heading, a note stating that the file is a “wiki snapshot”, and fixes up links marked as “inline code” to matching links in the API Reference. Read the docs theme The site uses a modification of the Read the docs theme (this can be found in the source at /emscripten/site/source/_themes/emscripten_sphinx_rtd_theme). The main changes to the original theme are listed below. Footer.html Copyright changed to link to Emscripten authors (some code was broken by translation markup) Added footer menu bar Layout.html Added header menu bar with items Breadcrumb.html Changed the text of the first link from “docs” to “Home” Moved the “View Page Source” code into the bottom footer theme.css Changed to support 4 levels of depth in sidebar toc. Centred theme. Made sidebar reach bottom of page using absolute positioning. Site license The site is licensed under the same Open Source License as the rest of Emscripten. Contributors to the site should add themselves to AUTHORS.'
year_published = 2025
