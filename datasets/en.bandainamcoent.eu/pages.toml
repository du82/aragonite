description = "To provide an even more fun and enjoyable gaming experience, NARUTO TO BORUTO: SHINOBI STRIKER has been updated to version 2.61 and version 2.62."
full_description = ''':root { --accent-color: #ff4e02; --transparency-color: #ff4e020D; --background-color: #ffffff; } #block-views-block-newsletter-block-3 .view-content{ background-color: #ff4e02cc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #ff4e02!important; border: 1px solid #ff4e02; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #ff4e020D !important; color: #ff4e02!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #ff4e02!important; border: 2px solid #ff4e02; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #ff4e020D !important; color: #ff4e02!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/naruto/naruto-shinobi-striker/00-page-setup/nss_background_page.jpg?twic=v1/focus=auto'); } 0 Patch Notes27/02/2025 NARUTO TO BORUTO: SHINOBI STRIKER - Update Patch Version 2.61 & 2.62 To provide an even more fun and enjoyable gaming experience, NARUTO TO BORUTO: SHINOBI STRIKER has been updated to version 2.61 / 2.62. Update Patch Version 2.61 Details ■ DLC Special Master-Ninjutsu Training: Sasuke Uchiha (Young Ver. Final Battle)Additional Master Character Sasuke Uchiha (Young Ver. Final Battle) is here to join the fight!Obtain original ninjutsu and items for your avatar from this newly added ninja master!Upon release, all players will have access to him as a playable character! Rebalanced Ninjutsu and Secret Techniques[Attack Type]▲ Leaf Whirlwind- The technique now has more forward movement. ▲ Rasengan- Increased lunge tracking ability.- Adjusted the motion that enemies take when hit.- Decreased cooldown time. ▲ Massive Rasengan- Increased axis correction time. ▲ Kamui- It is now possible to activate this Secret Technique mid-air.- Decreased activation time. [Ranged Type]▲ Chidori- Added Super Armor to this technique's lunge. ▲ Fire Style: Fire Ball Jutsu- Increased projectile speed.- Increased tracking ability. ▲ Super Beast Scroll: Lion- Increased damage. ▲ Water Style: Water Dragon Jutsu- Increased damage. ▲ Kirin- Increased attack range. ▲ Host Transformation: Six Tails- Increased the Giant Bubble's damage. [Defense Type]▲ 8 Trigrams Palm Rotation- Decreased cooldown time. ▲ Earth Style: Earth Pillar Explosion- It is now possible to activate this ninjutsu mid-air. ▲ Water Prison Rosary Bondage Jutsu- It is now possible to activate this ninjutsu mid-air. [Heal Type]▲ Paralysis Jutsu- Increased ninjutsu speed.- Decreased time until the attack. ▲ Heavy Boulder Jutsu- Increased damage. ▲ Cherry Blossom Clash- Increased damage when this ninjutsu hits in the center. ▲ Crimson Drizzle- Increased damage when this ninjutsu hits in the center. ▲ 8 Trigrams: Air Palm- Increased damage.- Increased projectile speed.- Increased tracking ability. ▲ Byakugan- Adjusted so only the user does not take guard damage while this ninjutsu is active.- Adjusted so only the user can guard against guard breaking attacks. ▲ Nervous System Rupture- Reduced time required to cancel into another action when this secret technique is activated.- Adjusted the motion that enemies take when hit. ▲ Lava Style: Lava Monster Jutsu- Increased the continuous damage when hitting the lava monster before impact. ▲ Tsukuyomi- Decreased time until debuff.- Increased length of debuff time.- Increased damage. ▲ Strength of a Hundred: Flower Cannon- Increased the heal-over-time effect. Rebalanced Weapons[Defense Type]▲ Certain Defense Type Weapons- Adjusted the motion that enemies take when hit by ground Weak Attacks.Applies to: Shark Skin: Samehada (Seal), Crimson Shark Skin: Samehada (Seal), Adamantine Shark Skin: Samehada (Seal), Shark Skin: Samehada, Crimson Shark Skin: Samehada, Adamantine Shark Skin: Samehada. ▲ Sandspear "Shukaku"- There is now forward movement when attacking. Update Patch Version 2.62 Details Bug fixes implemented NARUTO TO BORUTO: SHINOBI STRIKER is set for PS4, Xbox One and PC Shop now For more information about NARUTO TO BORUTO: SHINOBI STRIKER check out the latest news NARUTO TO BORUTO: SHINOBI STRIKER - Update Patch Version 2.61 & 2.62 close NARUTO TO BORUTO: SHINOBI STRIKER Release Date: 31/08/2018 Description: NARUTO TO BORUTO : SHINOBI STRIKER is a multiplayer online game set in the universe of Naruto Platforms: PS4 - Xbox One - PC Shop now Learn more Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://www.twitter.com/narutovideogamehttps://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next NARUTO NARUTO TO BORUTO: SHINOBI STRIKER gets a new character with its latest DLC! 28/02/2025 3 NARUTO NARUTO X BORUTO Ultimate Ninja STORM CONNECTIONS - Patch 1.60 Notes 04/02/2025 57 NARUTO Naruto Ultimate Ninja STORM Series 30 Million Units Sold Worldwide! 20/12/2024 25 See more news!'''
