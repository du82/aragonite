of the mist if the button was pressed briefly while aiming. Known IssuesItsuka Kendo・ Quirk Skill β [Big Fist Shield]└ Attacks from some opponents cannot be blocked and causes her to take damage. We are currently investigating this issue and working on a fix.We sincerely apologize for the inconvenience caused and appreciate your patience in this matter. We hope you continue enjoying MY HERO ULTRA RUMBLE. MY HERO ULTRA RUMBLE is set for PS4, Xbox One, Switch and PC Learn more For more information about MY HERO ULTRA RUMBLE check out the latest news MY HERO ULTRA RUMBLE - About the adjustments made in the 2/19/2025 maintenance close MY HERO ULTRA RUMBLE Release Date: 28/09/2023 Description: For the very first time, a free to play battle royale based on the hit anime series! As a hero, or as a villain, challenge other players in MY HERO ULTRA RUMBLE. Platforms: PS4 - Xbox One - Switch - PC Learn more Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://twitter.com/MyHeroURhttps://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next MY HERO ACADEMIA Season 9 of MY HERO ULTRA RUMBLE starts today! 22/01/2025 43 MY HERO ACADEMIA MY HERO ULTRA RUMBLE – Developer’s Blog VOL. 18 22/01/2025 14 MY HERO ACADEMIA MY HERO ULTRA RUMBLE - Patch Notes 1.8.0 22/01/2025 56 See more news!'''
