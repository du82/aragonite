kup-test/_other/desktop-header-mask-test-2.png"); mask-image: url("https://static.bandainamcoent.eu/high/01-mockup-test/_other/desktop-header-mask-test-2.png"); -webkit-mask-size: 100%; mask-size: 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; } Spring 2025 PC PC PS5 Sony PlayStation 5 Xbox Series X|S Microsoft Xbox Series X|S Preorder now Add to wishlist Key features Reactive Turn-based Combat In this evolution of JRPGs, real-time actions enhance the heart of turn-based combat. Build your party and level up six characters.Craft unique builds for your expeditioners that fit your playstyle via gear, stats, skills, and character synergies. Open an active dimension in combat - dodge, parry, and counter in real time, chain combos by mastering attack rhythms, and target enemy weak points using a free-aim system. "Tomorrow Comes" With only one year left to live, join Gustave, Maelle, and their fellow Expeditioners as they embark upon a desperate quest to break the Paintress’ cycle of death. Follow the trail of previous expeditions and discover their fate. Get to know the members of Expedition 33 as they learn to work together against impossible odds. A Hauntingly Beautiful World Explore an enchanting realm populated by surreal adversaries. Wander through breathtaking landscapes, from the Island of Visages to the Forgotten Battlefield, discovering secrets and hidden quests along the way. Find allies of fortune in creatures of legend and recruit a special companion who can access new travel methods and secret areas in the World Map.Experience the debut game from Sandfall Interactive, fully realized in Unreal Engine 5 with stunning graphics and a heartbreaking soundtrack. Preorder now Select your country : Algeria Australia Austria Bahrain Belgium Bulgaria Denmark Finland France Germany Greece Hungary Ireland Italy Kuwait Luxembourg Netherlands New Zealand Norway Oman Other countries Poland Portugal Qatar Slovenia Spain Sweden Switzerland United Arab Emirates 