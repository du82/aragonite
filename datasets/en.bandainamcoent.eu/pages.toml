full_description = ":root { --accent-color: #ff4e02; --transparency-color: #ff4e020D; --background-color: #ffffff; } #block-views-block-newsletter-block-3 .view-content{ background-color: #ff4e02cc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #ff4e02!important; border: 1px solid #ff4e02; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #ff4e020D !important; color: #ff4e02!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #ff4e02!important; border: 2px solid #ff4e02; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #ff4e020D !important; color: #ff4e02!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/naruto/naruto-shinobi-striker/00-page-setup/nss_background_page.jpg?twic=v1/focus=auto'); } 3 News, Trailer28/02/2025 NARUTO TO BORUTO: SHINOBI STRIKER gets a new character with its latest DLC! Shinobi Sasuke Uchiha (Young Ver. Final Battle) joins the battle in NARUTO TO BORUTO: SHINOBI STRIKER as the newest playable character. DLC Players gets to incarnate one of the last survivors of the Uchiha’s clan, the cold and determined Sasuke, with this Special Master-Ninjutsu Training Vol.43! Sasuke’s Ninjutsu and secret technique, the Cursemark Second State, is also a real advantage against the players’ opponents.The DLC also brings avatar parts such as two costumes (Sasuke Outfit Childhood Ver. and Sasuke Outfit Back in Time Ver. for both male and female), an eyepatch, a hairstyle and an honorary title (‘The Vengeful’). Moreover, the Sasuke Uchiha Starter Pack is available as well starting today and includes: • Ten Moonlight Scrolls, • Three sets of DLCs: - DLC14 Sasuke Uchiha (BORUTO), - DLC27 Sasuke Uchiha (Last Battle),- DLC43 Sasuke Uchiha (Young Ver. Final Battle),• Three types of Top Secret Training DLCs. NARUTO TO BORUTO: SHINOBI STRIKER has now been released more than six years ago! To thank players for their support, a campaign full of surprises started yesterday and will end on March 27th, during which they can expect Battle Events, Bonuses, Emergency Special Missions and more! NARUTO TO BORUTO: SHINOBI STRIKER is set for PS4, Xbox One and PC Shop now For more information about NARUTO TO BORUTO: SHINOBI STRIKER check out the latest news NARUTO TO BORUTO: SHINOBI STRIKER gets a new character with its latest DLC! close NARUTO TO BORUTO: SHINOBI STRIKER Release Date: 31/08/2018 Description: NARUTO TO BORUTO : SHINOBI STRIKER is a multiplayer online game set in the universe of Naruto Platforms: PS4 - Xbox One - PC Shop now Learn more Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://www.twitter.com/narutovideogamehttps://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next NARUTO NARUTO TO BORUTO: SHINOBI STRIKER - Update Patch Version 2.61 & 2.62 27/02/2025 NARUTO NARUTO X BORUTO Ultimate Ninja STORM CONNECTIONS - Patch 1.60 Notes 04/02/2025 57 NARUTO Naruto Ultimate Ninja STORM Series 30 Million Units Sold Worldwide! 20/12/2024 25 See more news!"
