title = "FREEDOM WARS Remastered – Patch Note Update (February 19, 2025) | Bandai Namco Europe"
description = "Thank you for your continued support of FREEDOM WARS REMASTERED. We would like to inform you about the contents of the update released on 19 February as well as other upcoming updates."
full_description = ":root { --accent-color: #09a4ec; --transparency-color: #09a4ec0D; --background-color: #ffffff; } #block-views-block-newsletter-block-3 .view-content{ background-color: #09a4eccc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #09a4ec!important; border: 1px solid #09a4ec; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #09a4ec0D !important; color: #09a4ec!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #09a4ec!important; border: 2px solid #09a4ec; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #09a4ec0D !important; color: #09a4ec!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/freedom-wars/00-page-setup/fw_keyfeatures_background.jpg?twic=v1/focus=auto'); } 4 News, Patch Notes19/02/2025 FREEDOM WARS Remastered – Patch Note Update (February 19, 2025) Thank you for your continued support of FREEDOM WARS REMASTERED. We would like to inform you about the contents of the update released on 19 February as well as other upcoming updates. Applicable PlatformsPS5®, PS4®, Nintendo Switch™, and Steam versions of “FREEDOM WARS Remastered” Update VersionPS4®：01.05 PS5®：01.005.000 Nintendo Switch™：1.5.0 Steam®：1.05 Update ContentsBug FixesCrashes when setting the status to READY while the chat window is openFixed the bug causing the game to crash when setting the status to READY while the chat window is open. Crashes while obtaining Abductor partsFixed the bug causing the game to crash when picking up the parts dropped by the Large Abductors after destroying them. Crashes during the operation complete sequenceFixed the bug causing the game to crash during the sequence that appears right after completing an operation. Inability to move past the ranking screenFixed the bug preventing players from getting past the League of Panopticons ranking screen when inputting some specific commands. Health augmentation bugFixed the bug preventing the effects of all sorts of health augmentations from reflecting properly in the game. Damage display bugFixed the bug preventing the damage reduction effects of the defense augmentations from reflecting properly in the game. 【Steam®】Inability to open the Online Menu on 24H2 environmentsFixed the bug preventing users from reopening the Online Menu after closing the Online Lobby on computers running version 24H2 of Windows 11. 【Nintendo Switch™ 】Inability to exchange Fellow Cards when using local wireless communicationFixed the bug preventing users from exchanging Fellow Cards with other players when using local wireless communication. 【Nintendo Switch™】Crashes when switching between TV Mode and Handheld ModeFixed the bug causing the game to crash when switching between the TV Mode and the Handheld Mode at a specific timing. Other Bug FixesFixed other minor bugs. Specification adjustments/changesSupport of character names written in JapaneseIt is now possible to write in Japanese when entering character names. Voice volume adjustmentsAdjusted the volume of the voices to make it easier to hear them in-game. Fixed Critical scaling of the gold notch weaponsFixed the Critical scaling of the gold notch weapons. Loosened up the time limits of the CODE 5 & CODE 6 ExamsExtended the time limit of the CODE 5 Exam and the CODE 6 Exam. Thank you for your continued support of FREEDOM WARS REMASTERED. FREEDOM WARS Remastered is set for PC, Switch, PS4 and PS5 Shop now For more information about FREEDOM WARS Remastered check out the latest news FREEDOM WARS Remastered – Patch Note Update (February 19, 2025) close FREEDOM WARS Remastered Release Date: 10/01/2025 Description: Die in prison or live on the battlefield. The choice is yours. Platforms: PC - Switch - PS4 - PS5 Shop now Learn more Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://twitter.com/bandainamcoeu/https://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next FREEDOM WARS FREEDOM WARS Remastered – Patch Note (February 7, 2025) 06/02/2025 4 FREEDOM WARS FREEDOM WARS Remastered – Patch Note (January 17, 2025) 20/01/2025 2 FREEDOM WARS FREEDOM WARS Remastered is now AVAILABLE Worldwide on Consoles and PC 10/01/2025 7 See more news!"
