description = "DRAGON BALL Z: KAKAROT- DAIMA - ADVENTURE THROUGH THE DEMON REALM PACK is available today and brings enhancement items that can be used in the base game. This pack also includes the upcoming DAIMA two-part series of DLC, with the first part coming this summer."
full_description = "DRAGON BALL DRAGON BALL: Sparking! ZERO DLC Adds 11 Characters from DRAGON BALL SUPER: SUPER… 23/01/2025 49 :root { --accent-color: #ef3f01; --transparency-color: #ef3f010D; --background-color: #000000; } #block-views-block-newsletter-block-3 .view-content{ background-color: #ef3f01cc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #ef3f01!important; border: 1px solid #ef3f01; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #ef3f010D !important; color: #ef3f01!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #ef3f01!important; border: 2px solid #ef3f01; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #ef3f010D !important; color: #ef3f01!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/dragon-ball/dragonball-project-z/00-page-setup/dbzk_kf_backgroundnew3.jpg?twic=v1/focus=auto'); } 1 News, Trailer28/02/2025 Watch the first trailer for the DRAGON BALL Z: KAKAROT x DAIMA DLC Pack! Ready to start a new adventure in DRAGON BALL Z: KAKAROT? DRAGON BALL Z: KAKAROT- DAIMA - ADVENTURE THROUGH THE DEMON REALM PACK is available today and brings enhancement items that can be used in the base game. This pack also includes the upcoming DAIMA two-part series of DLC, with the first part coming this summer. This DLC Pack will allow players to experience the world of the new Dragon Ball DAIMA anime series. In the DAIMA story, Goku and his friends have been transformed into children to make them weaker as a new Demon Realm King sets his scheme in motion. Goku and his friends must travel to the Demon Realm and return to normal thanks to the native Dragon Balls of this new world. The DLC will bring players on an adventure into a whole new world they will get to explore recreating the Third Demon Realm, including the floating islands and mysterious Skyseed plants that dot the land. Incarnating Goku, and helped by Supreme Kai, Glorio and Panzy, they will be immersed in this thrilling new journey and relive the DAIMA story! Goku’s friends will help throughout the adventures with their support skills and Z combo. Players can also expect a new battle experience thanks to the introduction of elements unique to the DLC such as the Power Pole or the new form of Goku (mini) Super Saiyan.Discover this exciting upcoming DLC in a new trailer! DRAGON BALL Z: KAKAROT is set for Switch, PS4, Xbox One, PC, PS5 and Xbox Series X|S Shop now For more information about DRAGON BALL Z: KAKAROT check out the latest news Watch the first trailer for the DRAGON BALL Z: KAKAROT x DAIMA DLC Pack! close DRAGON BALL Z: KAKAROT Release Date: 17/01/2020 Description: DRAGON BALL Z: KAKAROT is an all-new Action-RPG recounting the beloved story of DRAGON BALL Z like never before. Platforms: Switch - PS4 - Xbox One - PC - PS5 - Xbox Series X|S Shop now Learn more Download the press assets for this announcementDOWNLOAD Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://twitter.com/bandainamcoeu/https://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next DRAGON BALL Season 8 of DRAGON BALL THE BREAKERS starts today with new updates! 26/02/2025 2 DRAGON BALL DRAGON BALL: SPARKING! ZERO SELLS MORE THAN 5 MILLION UNITS WORLDWIDE 04/02/2025 20 DRAGON BALL DRAGON BALL: Sparking! ZERO DLC Adds 11 Characters from DRAGON BALL SUPER: SUPER… 23/01/2025 49 See more news!"
