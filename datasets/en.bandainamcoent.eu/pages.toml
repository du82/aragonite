title = "Season 8 of DRAGON BALL THE BREAKERS starts today with new updates! | Bandai Namco Europe"
description = "Season 8 of DRAGON BALL THE BREAKERS launches today with two main updates: Frieza can now turn into Golden Frieza and a new Transphere called “Ultra Instinct”!"
full_description = "DRAGON BALL DRAGON BALL: Sparking! ZERO DLC Adds 11 Characters from DRAGON BALL SUPER: SUPER… 23/01/2025 49 :root { --accent-color: #584383; --transparency-color: #5843830D; --background-color: #ffffff; } #block-views-block-newsletter-block-3 .view-content{ background-color: #584383cc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #584383!important; border: 1px solid #584383; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #5843830D !important; color: #584383!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #584383!important; border: 2px solid #584383; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #5843830D !important; color: #584383!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/dragon-ball/dragon-ball-the-breakers/05-page-extension/dbtb_extension_bg_2.jpg?twic=v1/focus=auto'); } 2 News, Game Release, Trailer26/02/2025 Season 8 of DRAGON BALL THE BREAKERS starts today with new updates! Season 8 of DRAGON BALL THE BREAKERS launches today with two main updates: Frieza can now turn into Golden Frieza and a new Transphere called “Ultra Instinct”! Golden Frieza joins the fray! In addition to his four forms already available, players will now be able to reach a new form called “Golden Frieza” where the antagonist will use active skills according to the battle situation. While transformed, the player’s health gradually decreases but his movement speed is enhanced, and his techniques, such as the active skills or the Ki Blasts, will change, allowing them to play Frieza in a different way. Golden Frieza will open new possibilities in combat for the players, but this new form will end if the player receives too much damage! Discover this new form with the trailer below: The Raiders are not the only ones getting updates! The Survivors will now have access to the “Ultra Instinct” Transphere to help them in their fight! This Transphere will allow the players to pummel a locked-on target with a powerful blow or, if no one is around, charge forward based on the camera direction. The players will also be able to perform a Dragon Change for a short time and attack. Watch this new Transphere in action below: DRAGON BALL THE BREAKERS is available on PlayStation 4, Xbox One, Nintendo Switch and PC, and compatible with PlayStation 5 and Xbox Series X|S. DRAGON BALL: THE BREAKERS is set for PS4, PC, Switch and Xbox One Shop now For more information about DRAGON BALL: THE BREAKERS check out the latest news Season 8 of DRAGON BALL THE BREAKERS starts today with new updates! close DRAGON BALL: THE BREAKERS Release Date: 14/10/2022 Description: Break Through or Break DownPlatforms: PS4 - PC - Switch - Xbox One Shop now Learn more Download the press assets for this announcementDOWNLOAD Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://twitter.com/DBTB_ENhttps://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuropeInstagram Read next DRAGON BALL Watch the first trailer for the DRAGON BALL Z: KAKAROT x DAIMA DLC Pack! 28/02/2025 1 DRAGON BALL DRAGON BALL: SPARKING! ZERO SELLS MORE THAN 5 MILLION UNITS WORLDWIDE 04/02/2025 20 DRAGON BALL DRAGON BALL: Sparking! ZERO DLC Adds 11 Characters from DRAGON BALL SUPER: SUPER… 23/01/2025 49 See more news!"
