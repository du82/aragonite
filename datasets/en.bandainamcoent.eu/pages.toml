title = "MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED BRINGS THE FAN-FAVORITE ACTION RPG TO THE WEST | Bandai Namco Europe"
description = "Bandai Namco Entertainment Europe today announced MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED, bringing the fan-favorite PlayStation Vita action RPG to the West for the first time."
full_description = ":root { --accent-color: #9b357b; --transparency-color: #9b357b0D; --background-color: #ffffff; } #block-views-block-newsletter-block-3 .view-content{ background-color: #9b357bcc !important; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe{ background-color: #9b357b!important; border: 1px solid #9b357b; } #block-views-block-newsletter-block-3 .view-footer .follow_us .mail_subscribe .subscribe:hover{ background-color: #9b357b0D !important; color: #9b357b!important; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop { background-color: #9b357b!important; border: 2px solid #9b357b; } #block-views-block-news-resume-title-block-1 .view-news-resume-title .views-field-field-title-game-status-1 .shop:hover { background-color: #9b357b0D !important; color: #9b357b!important; } .page-node-type-news .main-container:before { background: url('https://p325k7wa.twic.pics/high/gundam/gundam-seed/00-page-setup/gundam-seed-page-background.jpg?twic=v1/focus=auto'); } 4 News, Game Release, Trailer14/02/2025 MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED BRINGS THE FAN-FAVORITE ACTION RPG TO THE WEST Experience intense battles in the world of Gundam SEED with enhanced visuals, English localization and more Bandai Namco Entertainment Europe today announced MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED, bringing the fan-favorite PlayStation Vita action RPG to the West for the first time. The remaster brings enhanced visuals, a redesigned UI, a new target lock-on mode and English localization to the game’s fast-paced hack-and-slash mecha combat, immersing Mobile Suit Gundam SEED fans in a game universe featuring original and recreated battles. MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED will be available on Nintendo Switch™ and PC via Steam® on 22nd May 2025. Pre-orders for the Steam version are available now, while pre-orders for the Nintendo Switch version will open at a later date. As a soldier in volatile times, players must choose from one of the three factions– Earth Alliance, Z.A.F.T or Archangel to fight alongside in various story missions based on the series’ iconic moments such as Mobile Suit Gundam SEED and Mobile Suit Gundam SEED Destiny as well as side stories including Mobile Suit Gundam SEED Astray, Mobile Suit Gundam SEED C.E. 73: STARGAZER and more. With over 100 different mobile suits to choose from, players can tune their mechs to engage in thrilling, action-packed Gundam battles. MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED will provide enhanced visuals as well as a redesigned UI catered for modern platforms, along with English localization for the first time. The remastered version retains the original title’s gameplay while adding new game mechanics and quality-of-life features such as improved tuning, mission selection and a newly added lock-on mode for a smoother, more accessible experience. MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED is set for Switch and PC Preorder now For more information about MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED check out the latest news MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED BRINGS THE FAN-FAVORITE ACTION RPG TO THE WEST close MOBILE SUIT GUNDAM SEED BATTLE DESTINY REMASTERED Release Date: 22/05/2025 Description: Become a pilot in the world of Mobile Suit Gundam SEED, for the first time available with English localization! Engage in thrilling, action-packed Gundam battles, complete missions, and tune up your newly acquired Mobile Suits!Platforms: Switch - PC Preorder now Learn more Download the press assets for this announcementDOWNLOAD Dont miss any news Get the latest updates from our products and services subscribe Follow usBecome part of the community https://www.facebook.com/BandaiNamcoEU/https://twitter.com/bandainamcoeu/https://www.youtube.com/user/NamcoBandaiGamesEUhttps://www.twitch.tv/bandainamcoeuInstagram Read next GUNDAM GUNDAM: REQUIEM FOR VENGEANCE: RED VS BLUE team-based competitive experience… 18/11/2024 6 GUNDAM GUNDAM BREAKER 4 gets more content with DLC 1 24/10/2024 6 GUNDAM ASSEMBLE YOUR ULTIMATE GUNDAM FORCE, GUNDAM BREAKER 4 IS AVAILABLE NOW! 29/08/2024 1 See more news!"
