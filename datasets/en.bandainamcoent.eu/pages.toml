title = "Cookie policy | Bandai Namco Europe"
description = "BANDAI NAMCO ENTERTAINMENT EUROPE website cookie management policy   Showcase website: https://www.bandainamcoent.eu/ and its sub-domains:"
full_description = '''BANDAI NAMCO ENTERTAINMENT EUROPE website cookie management policy Showcase website: https://www.bandainamcoent.eu/ and its sub-domains: https://en.bandainamcoent.eu/ https://fr.bandainamcoent.eu/ https://de.bandainamcoent.eu/ https://it.bandainamcoent.eu/ https://es.bandainamcoent.eu/ https://redeem.bandainamcoent.eu/ https://beta.bandainamcoent.eu/ https://account.bandainamcoent.eu/ https://login.bandainamcoent.eu/login E-commerce website: Site for the following countries: Luxembourg, Belgium, Netherlands, Ireland, Portugal, Denmark, Sweden, Finland, Austria, Greece, Great Britain, Italy, Spain, Czech Republic, Estonia, Hungary, Latvia, Lithuania, Poland, Slovakia, Slovenia, Bulgaria, Croatia, Romania, Switzerland, Iceland, Norway, Malta, Australia, France : https://store.bandainamcoent.eu/ Site for Germany only: https://de.store.bandainamcoent.eu/ Site for the following countries for digital products only (New Zealand, Turkey, India, Israel, Saudi Arabia, United Arab Emirates, Kuwait, Qatar, Oman, Jordan, Egypt, Tunisia, Algeria, Morocco): https://int.store.bandainamcoent.eu/ Customer Service website: https://service.bandainamcoent.eu/ and sub-domains: https://service-fr.bandainamcoent.eu/ https://service-en.bandainamcoent.eu/ https://service-de.bandainamcoent.eu/ https://service-it.bandainamcoent.eu/ https://service-es.bandainamcoent.eu/ SOMMAIRE 1 Foreword 2 What is a cookie? 3 Which cookies are subject to your consent? 4 What cookies do we deposit on the sites? 5 Specific cookies by sub-domain 6 Which social networks do our showcase and e-commerce sites link to? 7 How can I refuse to accept cookies? 8 In what other ways can you configure your cookies? 9 Is the information in this policy up to date? 1. Foreword You can find out more about how Bandai Namco Entertainment Europe uses cookies on websites and how you can set them according to your preferences in our Cookie Management Policy. This cookies policy is coordinated with our data protection policy accessible here: https://bandainamcoent.eu/privacy-policy. 2. What is a cookie? When you visit our site, information relating to the browsing of your terminal (computer, tablet, smartphone, etc.) on our site may be recorded in text files called "cookies" installed on your browser. Cookies are used to recognise your browser for the duration of the cookie's validity. A cookie is a file activated in write or read mode. On telephone equipment, these trackers are equipment identifiers and advertising identifiers. There are different types of cookies: technical cookies, including session cookies, which disappear as soon as you leave our site or remain permanently; functional cookies to manage the language or duration of consent; audience cookies, which remain on your terminal until they expire or until you delete them using your browser's functions; cookies used to personalise advertising and similar operations. You are informed that, when you visit our site, cookies may be installed and consulted during your visit. Bandai Namco Entertainment Europe also uses invisible pixels. These trackers take the form of tiny graphic images and may be placed on the Site or in an email. Their function is to collect technical information (e.g. your IP address or the type of device you are using) and information about your activity (e.g. the date and time you visit a page or send an email). 3. Which cookies are subject to your consent? Typology. The purposes of cookies are determined by the nature of the cookie. Some cookies, which are not subject to your consent, are essential to the use of our site. These are technical cookies or functional cookies used to: make your browsing easier; prevent malicious software; save your choices relating to cookies. Technical and functional cookies. These cookies, which are not subject to prior consent, are used for the following main functions: technical management of your session; language management; performance management; monitoring security and technical errors; improving your user experience; technical administration of services corresponding to your requests, such as sending you an email when new content corresponding to you is put online; authenticating your access to our services; administration of your performance. Audience measurement cookies. In order to be limited to what is strictly necessary for the provision of the service and thus be exempt from consent in accordance with Article 82 of the French Data Protection Act, these cookies must: have a purpose strictly limited to measuring the site's audience (measuring performance, detecting navigation problems, optimising technical performance or ergonomics, estimating the power of the servers required, analysing the content consulted), exclusively on behalf of the publisher; be used to produce anonymous statistical data only. On the other hand, to be exempt from consent, these trackers must not: lead to data being cross-checked with other processing operations or to data being passed on to third parties; allow global tracking of the browsing habits of individuals using different applications or browsing different websites. Any solution that uses the same identifier across several sites (via, for example, cookies deposited on a third-party domain loaded by several sites) to cross-reference, duplicate or measure a unified reach rate for a piece of content is excluded. 4. What cookies do we deposit on the sites? The table below lists the cookies we deposit on the sites: Technical and security cookies The technical and security cookies we use are necessary for the Site to function properly. Without them, services such as remembering the contents of your shopping basket or your choice of language would not be able to function. Therefore, they are not subject to your consent. The technical and security cookies on the Site are as follows: Audience measurement cookies We use audience measurement cookies to collect information on how you use our Sites (number of visits and traffic source) and to improve its performance. The audience measurement cookies used on the Sites are as follows: The Matomo cookies above are exempt from consent. You can choose to disable Matomo cookies below: Functionality cookies We use functionality cookies to enable us to personalise the functionality of our Sites. The functionality cookies used on the Sites are as follows: Social network and video cookies Social network cookies allow you to directly access Bandai Namco pages on social networks and review platforms. The purpose of "video" cookies is to enable you to view multimedia content directly on our Sites. The social network and video cookies used on the Sites are as follows: Advertising cookies We use advertising cookies to enable our partners to place advertisements on our Sites, measure their effectiveness and, where appropriate, adapt their content according to your browsing habits and profile. These advertisements may also be offered on other sites. The advertising cookies used on the Sites are as follows: Sources Audience measurement cookies: Google Analytics + https://developers.google.com/analytics/devguides/collection/gtagjs/cookie-usage Hotjar Matomo Functionality cookies: reCAPTCHA X Social network & video cookies: Youtube Meta Platforms Advertising cookies: X Meta Platforms Youtube Reddit 5. Specific cookies by sub-domain 5.1 https://de.bandainamcoent.eu/ Advertising cookies We use advertising cookies to enable our partners to place advertisements on this Site, measure their effectiveness and, where appropriate, adapt their content according to your browsing habits and profile. These advertisements may also be offered on other sites. The advertising cookies used on this Site are as follows: 5.2 Sites e-commerce Website for all EMEA countries except Germany: https://store.bandainamcoent.eu/ Website for Germany only: https://de.store.bandainamcoent.eu/ Site for all countries outside Europe for digital products only: https://int.store.bandainamcoent.eu/ Technical and security cookies The technical and security cookies we use are necessary for the proper operation of the e-commerce Sites referred to above. Without them, services such as remembering the contents of your shopping basket or your choice of language would not be able to function. Therefore, they are not subject to your consent. The technical and security cookies on this Site are as follows: 6. Which social networks do our showcase and e-commerce sites link to? The sites use "social plugins" from the Meta Platforms, X, Instagram, Twitch and Youtube social networks. These social plugins can be recognised by their respective logos and allow you to access our pages directly on these networks. In order to protect your data as much as possible when you use these sites, we have integrated these plugins in such a way that the connection to the operator of the social network is only established when you activate the plugin by clicking on the corresponding icon. When the connection is established by activating the plugin, we have no influence on the extent of the data collected by Meta Platforms, X, Instagram, Twitch or Youtube. To the best of our knowledge, by interacting with one of the social plugins, the operator of the social network concerned receives information about the web page of the site that you have visited. If at the same time you are connected to a social network, the operator of this social network may also associate the corresponding visits to your account with the social network. Even if you are not a member of one of the social networks mentioned, it is possible that they may retrieve and, where appropriate, record your IP address via the plugin when you click on it. For more information on the scope and purpose of the processing, collection and use of data by Meta Platforms, X, Instagram, Twitch or Youtube, as well as your rights in this regard and configuration options, we invite you to consult their respective data protection policies: for Meta Platforms (Meta) for X for Instagram for Twitch for Youtube If you are a customer of one of the social networks mentioned, but do not want it to be able to collect your data from the list and link it to your user account, you must log out of the social network concerned before clicking on a plugin. 7. How can I refuse to accept cookies? Certain features of our sites rely on the use of cookies. A module allows you to choose which cookies and other trackers you wish to accept and which you wish to reject on the sites. You can access this module at any time by clicking here or via the footer of our site, in the "Cookie management" section. 8. In what other ways can you configure your cookies? By configuring the navigation software. You can configure your browser software so that cookies are saved on your terminal or rejected, either systematically or depending on their issuer. You can also regularly delete cookies from your terminal via your browser. However, do not forget to configure all the browsers on your various terminals. To manage cookies and your choices, the configuration of each browser is different. It is described in the help menu of your browser, which will allow you to know how to change your options regarding cookies. For example: for Microsoft Edge for Safari for Chrome for Firefox for Opera However, we draw your attention to the fact that if you set your browser to refuse cookies, certain features, pages and areas of our sites that require the use of cookies will not be accessible, for which we cannot be held responsible. To find out more about how to configure your browser software, please consult the website of the local authority responsible for cookies in your country. 9. Is the information in this policy up to date? We will update this policy if we introduce new cookies or change the way we use the cookies described above. This policy comes into force on the date it is published online. The same applies for any changes. Updated on 4th November 2024'''
