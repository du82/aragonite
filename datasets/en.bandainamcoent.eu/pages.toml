size: 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; } 11/10/2024 PS5 Sony PlayStation 5 Xbox Series X|S Microsoft Xbox Series X|S PC PC Shop now Add to wishlist Key features https://static.bandainamcoent.eu/video/dbsz/dbsz-keyfeature-breathtaking3D-fights.webm BREATHTAKING 3D FIGHTS Engage in heart-pounding, high-speed 3D battles that stay true to the anime and video game series, with breathtaking visuals and authentic combat moves like beam clashes, rush attacks, movements too quick for the eyes to see, and planet-razing ultimate attacks. .field--name-field-catch-phrase { background-image: url("https://static.bandainamcoent.eu/high/dragon-ball/dragon-ball-sparking-zero/00-page-setup/Page-Setup-Revamp/bg-title-rectangle.jpg"); } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(2n) .key-feature-description .field--name-field-catch-phrase { margin-right: -80px; padding-right: 25px; border-radius: 12px; } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(odd) .key-feature-description .field--name-field-catch-phrase { margin-left: -30px; padding-left: 25px; border-radius: 12px; } https://static.bandainamcoent.eu/video/dbsz/dbsz-keyfeature-ground-will-break.webm THE GROUND WILL SHAKE Step into an arena that reacts to your every action. As you transform or unleash your most devastating attacks, watch the environment respond with stunning realism. Leave a trail of destruction in your wake as you battle to your heart’s content. https://static.bandainamcoent.eu/video/dbsz/dbsz_keyfeature3_blaze.webm BLAZE A NEW PATH Conquer the action-packed battles from the beloved original story, or discover and unlock new encounters for your favorite Z-Fighters and more. Relive your favorite moments from the series through cutscenes you can experience from the perspectives of eight characters! .field--name-field-catch-phrase { background-image: url("https://static.bandainamcoent.eu/high/dragon-ball/dragon-ball-sparking-zero/00-page-setup/bg-title-rectangle.jpg"); } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(2n) .key-feature-description .field--name-field-catch-phrase { margin-right: -80px; padding-right: 25px; border-radius: 12px; } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(odd) .key-feature-description .field--name-field-catch-phrase { margin-left: -30px; padding-left: 25px; border-radius: 12px; } https://static.bandainamcoent.eu/video/dbsz/dbsz_keyfeature4_create.webm CREATE, PLAY, AND SHARE Recreate your favorite battles from throughout the DRAGON BALL story, or set up your dream story battle with your favorite characters! Share your creations with other fans and experience the battles brought to life by imaginations around the world. .field--name-field-catch-phrase { background-image: url("https://static.bandainamcoent.eu/high/dragon-ball/dragon-ball-sparking-zero/00-page-setup/bg-title-rectangle.jpg"); } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(2n) .key-feature-description .field--name-field-catch-phrase { margin-right: -80px; padding-right: 25px; border-radius: 12px; } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(odd) .key-feature-description .field--name-field-catch-phrase { margin-left: -30px; padding-left: 25px; border-radius: 12px; } https://static.bandainamcoent.eu/video/dbsz/dbsz_feature5_rivals.webm RIVALS MAKE YOU STRONGER Challenge other players online to test your skills, or sit down with friends offline to hone your skills exclusively in the Hyperbolic Time Chamber! Fight your way to become a champion across various tournament modes and victory conditions. .field--name-field-catch-phrase { background-image: url("https://static.bandainamcoent.eu/high/dragon-ball/dragon-ball-sparking-zero/00-page-setup/bg-title-rectangle.jpg"); } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(2n) .key-feature-description .field--name-field-catch-phrase { margin-right: -80px; padding-right: 25px; border-radius: 12px; } #block-views-block-description-feature-block-1 .paragraph--type--title-key-feature-line:nth-of-type(odd) .key-feature-description .field--name-field-catch-phrase { margin-left: -30px; padding-left: 25px; border-radius: 12px; } Shop now Select your country : Algeria Australia Austria Bahrain Belgium Bulgaria Czech Republic Denmark Finland France Germany Greece Hungary Ireland Italy Kuwait Luxembourg Netherlands New Zealand Norway Oman Other countries Poland Portugal Qatar Slovenia Spain Sweden Switzerland United Arab Emirates United Kingdom Choose Platform PC PC PS5 Sony PlayStation 5 Xbox Series X|S Microsoft Xbox Series X|S Previous 1 / 5 Next Full screen This edition is not available with your current filters Standard Edition official store Retai'''
