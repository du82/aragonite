["https://en.bem.info/methodology/css"]
title = "CSS / Methodology / BEM"
full_description = "In the BEM methodology, CSS is used for page layout and is considered one of the block implementation technologies. The BEM methodology achieves the same results by using mixes, or by creating an additional block element. You don't need to create additional abstract wrappers. They don't add any specific features. The position of nested HTML elements is usually set by creating an additional block element (for example, block__inner ). BEM doesn't use tag and ID selectors. The styles of blocks and elements are defined by class selectors. Use selectors to specify a specific HTML element on the page, regardless of the tag. The class selector is accessed via the class attribute, which should be defined for every HTML element. The value of the class attribute can be a space-separated list of words. This allows you to use different BEM entities on the same DOM node. The BEM methodology doesn't recommend combining tags and classes in a selector. Combining a tag and a class (for example, button.button ) makes the CSS rules more specific, which makes it more difficult to override them. This leads to priority battles, in which stylesheets are loaded by overly complicated selectors. The .button_active selector will not redefine CSS properties of the block with the button.button selector, because button.button has higher specificity than .button_active. For successful redefinition, the selector for the block modifier also must be combined with the button.button_active tag. As the project develops, it's possible that blocks could be added with the selectors input.button ,span.button and a.button . In this case, all the modifiers of the button block and nested elements would require four different declarations for each case. The BEM methodology allows using nested selectors, but we recommend minimizing their use. Nested selectors increase code coupling and make reuse impossible. Nesting is appropriate if you need to change the styles of elements relative to the state of the block or the theme set."
year_published = 2025
clearnet = "https://en.bem.info/methodology/css"
