["https://en.bem.info/methodology/block-modification"]
title = "Block modification / Methodology / BEM"
description = "Block modification"
full_description = "Blocks — logically and functionally independent, reusable page components. The same blocks can be used in different projects. To prevent these projects from looking identical, blocks can be modified using: Use a modifier to change one specific instance of a block. Setting or removing a modifier should only affect the modified block and have no relationship to the surrounding blocks. Use context to define the block style in advance when you don't know what the content of a nested block will be. The block is changed by setting or removing a modifier containing code that describes the changes. You can add an unlimited number of modifiers to the block at once. The has-tail modifier with the true value adds to the popup block a new element — ”tail“. This modifier also adds offsets to the block to create space for the tail. The disabled modifier switches the button block, which opens the popup window, to the ”disabled“ state. In other words, it turns off the popup window so it can't be shown. The block is changed by placing additional BEM entities on the same DOM node as the block. Mixes allow you to combine the behavior and style of multiple entities without duplicating code. In the BEM methodology, a block's position on the page is set in the parent block. This allows the blocks to be independent and reusable. The example shows a header block from an integrated library. By default, the header block doesn't know anything about the position of blocks that are nested in it. To add the logo, search, and user blocks to the header, you need to define the offsets for each nested block: The header and the nested logo, search, and user blocks must remain independent. For this reason, the position of the nested blocks is set in elements of the header block that are mixed with the blocks. The styles of the nested logo, search, and user blocks haven't changed, and still don't contain any offsets. The blocks remain independent and can be reused anywhere. In the example, the text inside the article and copyright blocks needs to have the same color and font. To do this, you can mix the text block, which has styles defining the text color and font, with the article and copyright blocks."
year_published = 2025
clearnet = "https://en.bem.info/methodology/block-modification"
