title = "4.2.0 / bem-core / Classic BEM libraries / Libraries / BEM"
full_description = "Documentation on bem-core in a much more informative way is also available at bem.info. It is also available in Russian. bem-core is a base library for web interface development. It provides the minimal stack for coding client-side JavaScript and templating. The autogenerated JSDoc API can be found on bem.info. E.g. JSDoc for i-bem is here https://en.bem.info/libs/bem-core/current/desktop/i-bem/jsdoc/ You need export PATH=./node_modules/.bin:$PATH or an alternative way to run locally-installed npm dependencies. You can also watch them in a browser loading desktop.specs/functions__debounce/spec-js+browser-js+bemhtml/spec-js+browser-js+bemhtml.html. Run tests for other BEM entities in the same way. This will work for those which are equipped with .spec.js file. To build code coverage report add ISTANBUL_COVERAGE=yes environment variable to the tests run command: You can run modular testing with coverage as well by using more concrete build target as was described above. After tests finish, you can view coverage HTML report by opening coverage/index.html in your favorite browser. Browsers with more than 2% users get full compliant support, more than 0.5% — partially compliant (which means that data is accessible but not necessary 100% functional). New features testing is not provided by us for browsers with less than 0.5% users. Code and documentation copyright 2012 YANDEX LLC. Code released under the Mozilla Public License 2.0."
