["https://en.bem.info/libraries/classic/bem-components"]
title = "6.0.0 / bem-components / Classic BEM libraries / Libraries / BEM"
full_description = "bem-components is an open-source library that provides a set of ready-made visual components (blocks) for creating web interfaces. The library provides design themes. This version introduces the islands theme, which implements the new Yandex design. Features include supporting multiple themes at once, and creating new themes. design/<common|desktop|touch|touch-phone|touch-pad>.blocks — implementation of various designs (themes). style files with the *.ie.styl extension to the page. To do this, specify them in the build config (see this example) and add comments in the page section (see this example). You can also enable styles for Internet Explorer 8 at the template level. Autoprefixer — used during assembly to generate vendor prefixes for supported browsers based on the configuration. There are several ways to start using bem-components. The best approach depends on your project’s requirements and its compatibility with the technologies and tools of the library, as well as on your experience with BEM projects. As an example, you can use project-stub, where the library is enabled by default. You can also create a project and use the Yo generator to connect the library (this allows you to create the necessary project configuration). The easiest way to connect the library to the project is to download the pre-assembled library files and use <link> and <script> elements to add them to HTML pages. There are several ways to do this: bem-components.js+bemhtml.js — Combines JavaScript code and BEMHTML templates for using templates in the browser; bem-components.js+bh.js — Combines JavaScript code and BH templates for using templates in the browser; bem-components.no-autoinit.js - JavaScript without automatic initialization. Use it if you need to write your own code in i-bem.js; Each set also includes the development versions of the same files (preserving the original formatting and comments). The fastest and easiest way to connect the library to the project is to add the <link> and <script> elements to HTML pages:"
