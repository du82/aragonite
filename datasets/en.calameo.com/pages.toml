ed by the website users is manifestly unlawful. Other We would like to stress the fact that this procedure should not be construed as a refusal on our part to enforce your rights, it is simply necessary to formalize our correspondence. Lastly, ensure that your copyright infringement notification has a sound legal basis and that you are indeed the copyright holder for the works that your notification refers to Should you have the slightest doubt as to whether your claim is well-founded, please seek legal counsel prior to sending us your notification. Indeed, making abusive allegations of copyright infringement is subject to prosecution in certain countries. Furthermore, if you expect that you will need to report a lot of content, we suggest that you contact us directly, by post or e-mail. WARNING: WE ARE NOT LAWYERS AND THE PROCEDURE DESCRIBED ABOVE IS PROVIDED FOR INFORMATION PURPOSES ONLY. THIS INFORMATION DOES NOT CONSTITUTE LEGAL ADVICE IN ANY WAY WHATSOEVER."
