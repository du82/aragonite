ublication finie grâce à notre widget pratique. Utilisez le mode « Diapositive » Nous apprécions fortement l’effet et le visuel attrayant des flipbooks, mais nous aimons par-dessus tout offrir encore plus d’options à nos utilisateurs. Le mode Diapositive offre une expérience de lecture élégante et avant-tout idéale pour les présentations. Vous pourrez sélectionner ce Mode d’affichage dans les Propriétés de votre publication. Choisissez le sens de lecture de votre publication Vous souhaitez publier dans une langue qui se lit de droite à gauche ? Avec Calaméo, ce n’est pas un problème. Définissez le Mode de lecture comme tel dans les Propriétés de votre publication pour que vos lecteurs puissent la consulter de façon intuitive. Supprimez l’ombre au centre du flipbook Le design de votre publication est important et il existe de nombreuses façons de personnaliser la liseuse Calaméo afin de le mettre en valeur. Les utilisateurs qui préfèrent un design plus plat pour leurs publications numériques peuvent facilement supprimer l’ombre au centre du flipbook : il suffit d’ajouter le paramètre « pagefxopacity=0 » à l’URL de votre publication. Affichez vos publications en plein écran Empêchez les distractions et aidez les lecteurs à rester concentrés sur votre publication en ligne grâce à la lecture en plein écran. Que ce soit directement sur Calaméo ou depuis des publications intégrées sur votre site, vous êtes sûr de trouver le choix qui correspond à vos besoins en matière de publication numérique. Intégrez vos publications en ligne Calaméo rend le processus d’intégration de vos publications numériques très simple. Décidez de l’apparence que vous souhaitez donner à vos publications intégrées et copiez le code en un clic pour l’insérer sur votre site Web. De plus, vous pouvez également intégrer vos publications privées pour plus de sûreté et de contrôle. Ce ne sont que dix des meilleures raisons pour lesquelles Calaméo est la meilleure plateforme de publication en ligne. Nous aurions également pu mentionner d’autres excellentes fonctionnalités que nous vous proposons telles que nos grandes capacités de stockage, notre formidable Calaméothèque ou la simplicité de la mise à jour d’une publication existante, et bien plus encore ! Nous sommes également convaincus que vous apprécierez les fonctionnalités avancées de nos offres professionnelles, allant des statistiques détaillées à la gestion des Abonnés. Vous êtes prêt à découvrir pourquoi Calaméo est la meilleure plateforme de publication en ligne pour vos documents ? Inscrivez-vous pour obtenir votre compte gratuit et commencez à publier dès aujourd’hui."
