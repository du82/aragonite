full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Bit manipulation (since C23) From cppreference.com < c‎ | numeric C Compiler support Language Headers Type support Program utilities Variadic function support Error handling Dynamic memory management Strings library Algorithms Numerics Date and time utilities Input/output support Localization support Concurrency support (C11) Technical Specifications Symbol index [edit] Numerics Common mathematical functions Floating-point environment (C99) Pseudo-random number generation Complex number arithmetic (C99) Type-generic math (C99) Bit manipulation (C23) Checked integer arithmetic (C23) [edit] Bit manipulation Functions stdc_leading_zeros(C23) stdc_leading_ones(C23) stdc_trailing_zeros(C23) stdc_trailing_ones(C23) stdc_first_leading_zero(C23) stdc_first_leading_one(C23) stdc_first_trailing_zero(C23) stdc_first_trailing_one(C23) stdc_count_zeros(C23) stdc_count_ones(C23) stdc_has_single_bit(C23) stdc_bit_width(C23) stdc_bit_floor(C23) stdc_bit_ceil(C23) Macro constants __STDC_ENDIAN_LITTLE____STDC_ENDIAN_BIG____STDC_ENDIAN_NATIVE__(C23)(C23)(C23) [edit] Contents 1 Functions 2 Macro constants 3 References 4 See also Functions Defined in header <stdbit.h> stdc_leading_zeros(C23) counts the number of consecutive ​0​ bits, starting from the most significant bit(type-generic function macro)[edit] stdc_leading_ones(C23) counts the number of consecutive 1 bits, starting from the most significant bit(type-generic function macro)[edit] stdc_trailing_zeros(C23) counts the number of consecutive ​0​ bits, starting from the least significant bit(type-generic function macro)[edit] stdc_trailing_ones(C23) counts the number of consecutive 1 bits, starting from the least significant bit(type-generic function macro)[edit] stdc_first_leading_zero(C23) finds the first position of ​0​ bit, starting from the most significant bit(type-generic function macro)[edit] stdc_first_leading_one(C23) finds the first position of 1 bit, starting from the most significant bit(type-generic function macro)[edit] stdc_first_trailing_zero(C23) finds the first position of ​0​ bit, starting from the least significant bit(type-generic function macro)[edit] stdc_first_trailing_one(C23) finds the first position of 1 bit, starting from the least significant bit(type-generic function macro)[edit] stdc_count_zeros(C23) counts the number of ​0​ bits in an unsigned integer(type-generic function macro)[edit] stdc_count_ones(C23) counts the number of 1 bits in an unsigned integer(type-generic function macro)[edit] stdc_has_single_bit(C23) checks if a number is an integral power of 2(type-generic function macro)[edit] stdc_bit_width(C23) finds the smallest number of bits needed to represent the given value(type-generic function macro)[edit] stdc_bit_floor(C23) finds the largest integral power of 2 not greater than the given value(type-generic function macro)[edit] stdc_bit_ceil(C23) finds the smallest integral power of 2 not less than the given value(type-generic function macro)[edit] Macro constants Defined in header <stdbit.h> __STDC_ENDIAN_LITTLE____STDC_ENDIAN_BIG__ __STDC_ENDIAN_NATIVE__(C23) indicates the endianness of scalar types (macro constant) [edit] [edit] References C23 standard (ISO/IEC 9899:2024): 7.18 Bit and byte utilities <stdbit.h> [edit] See also C++ documentation for Bit manipulation Retrieved from "https://en.cppreference.com/mwiki/index.php?title=c/numeric/bit_manip&oldid=180023"'''
