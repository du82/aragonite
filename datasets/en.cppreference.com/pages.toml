title = "Numerics - cppreference.com"
full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Numerics From cppreference.com < c C Compiler support Language Headers Type support Program utilities Variadic function support Error handling Dynamic memory management Strings library Algorithms Numerics Date and time utilities Input/output support Localization support Concurrency support (C11) Technical Specifications Symbol index [edit] Numerics Common mathematical functions Floating-point environment (C99) Pseudo-random number generation Complex number arithmetic (C99) Type-generic math (C99) Bit manipulation (C23) Checked integer arithmetic (C23) [edit] The C numerics library includes common mathematical functions and types, as well as support for random number generation. Contents 1 Common mathematical functions 2 Floating-point environment 3 Pseudo-random number generation 4 Complex number arithmetic 5 Type-generic math 6 Bit manipulation (since C23) 7 Checked integer arithmetic (since C23) 8 See also [edit] Common mathematical functions The header <math.h> provides standard C library mathematical functions such as fabs, sqrt, and sin. [edit] Floating-point environment The header <fenv.h> defines flags and functions related to exceptional floating-point state, such as overflow and division by zero. [edit] Pseudo-random number generation The header <stdlib.h> also includes C-style random number generation via srand and rand. [edit] Complex number arithmetic The header <complex.h> provides types and functions to work with complex numbers. [edit] Type-generic math The header <tgmath.h> provides some macros for a function which names XXX: real function: float variant XXXf double variant XXX long double variant XXXl complex function: float variant cXXXf double variant cXXX long double variant cXXXl [edit] Bit manipulation (since C23) The header <stdbit.h> provides macros and functions to work with the byte ordering and byte and bit representation of C objects. [edit] Checked integer arithmetic (since C23) Provides some type-generic macros for checked integer arithmetic: Defined in header <stdckdint.h> ckd_add(C23) checked addition operation on two integers(type-generic function macro)[edit] ckd_sub(C23) checked subtraction operation on two integers(type-generic function macro)[edit] ckd_mul(C23) checked multiplication operation on two integers(type-generic function macro)[edit] [edit] See also C++ documentation for Numerics library Retrieved from "https://en.cppreference.com/mwiki/index.php?title=c/numeric&oldid=180191"'''
