full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Talk:Main Page From cppreference.com Archives Archive 1 Archive 2 Archive 3 Contents 1 Unexpected behaviour in cppref search 2 Hiding previous versions of standard 3 Usefulness of translated sites 4 Tracking {{noexcept}} and hidden DR comments 5 Exact match in search results 6 Wrong line breaking 7 about book 8 Can you reword http://en.cppreference.com/w/c/memory/malloc and similar pages... 9 Minor search bug 10 gadget-StandardRevisions tool to be updated 11 gadget-StandardRevisions tool to be updated 12 P0777R1/decay/remove_cvref 13 Should we have {{mark macro var}} or {{mark macro}}? 14 Return the 'Operator precedence' to the main page 15 replace semicolon by comma as interval notation 16 another minor search bug 17 finding rule of zero/three/five = 18 Adding StandardRevisions and `cppreference.com` link to vector skin 19 Inconsistent capitalization 20 Redirecting from es.cppreference.com to en.cppreference.com automagically 21 Proposal for Dark-Mode Theme 22 Where are level 2 headings? 23 How to request changes to protected pages? 24 Vector skin is missing the standard revision drop-down list. 25 A [[File]]'s image is served non-securely. 26 Searching in native language 27 Linking to WG21 and C++ draft 28 Acronym definition for SOCCC? 29 constexpr specified revboxes 30 BaseCharacteristic vs base characteristic 31 Searching for std::regular yields std::Regular in the results 32 Searching for C++20 content. 33 Several of the special mathematical functions have type inconsistent with description 34 GCC version for es.cppreference.com tops at 9.2, while it tops at 10.2 for cppreference.com 35 TS section minor clean up - 2021. 36 Search Now Going To DuckDuckGo 37 Recent Changes Partially Obscure SearchBox with [View|Edit|History|Actions] 38 Need edit help for protected template 39 Compiler support (11, 14, 17, 20) <-- 23! 40 Killing off the Ranges TS 41 Badly rendered pages in zh-version 42 Example for shared_lock::lock is broken in gcc 11.1 for C++20 43 C95 and C99 are dead links 44 In es.cppreference.com, usage of lc template with a header_name does not work, but in the English version it does 45 In es.cppreference.com, Search box is in English and provides results from English search 46 Install MediaWiki Extension:TemplateSandbox? 47 [REDIVIVUS] In es.cppreference.com, Search box is in English and provides results from English search 48 Discussion on the inconsistency of the arrangement of some related pages 49 What does the "Member types" section mean on a page? 50 Heading anchor gadget 50.1 Localized compiler messages in examples 50.2 Any chance the Searcher named requirement can be added? 51 C++ SSE and SSE2 compiler settings, and their Floating Point effects. 52 Feature proposal: auto header link 53 Mistakes in set 54 Is it possible to donate? 55 Mobile site version 56 Proposal: add User:D41D8CD98F/append-support-info.js for all users 56.1 Invalid SSL certificate in es.cppreference.com 56.2 es.cppreference.com and other companion sites (French) have been trolled with "Best is Rust" 57 Outdated autolinks 58 Zapping [[nodiscard]] from declarations? 59 inconsistency in formatting exposition-only names in decl and other source code 60 The (still uncreated) Contract Support page name has a typo: "cotract" instead of "contract" [edit] Unexpected behaviour in cppref search For some reason cppref search box is producing a browser search rather than the standard cpp type search. I am using Firefox, and there is no setting there to indicate this behaviour. BlueWhale (talk) 05:04, 24 February 2021 (PST) Same here. Sends the search to Duck Duck Go for me which shows a bunch of unrelated content. Same. Search for "bitset" gives you results for drills and other tools, along with ads. pls rollback whatever messed up the search. FYI, searching "bitset" in the search bar is yielding me this page as expected in all browsers I have --Ybab321 (talk) 08:02, 24 March 2021 (PDT) And the worse is, we lost quick jump on search box typing. when I want to viewing the vector doc page, previously I just typing "vector" in search box and click the first suggestion, now I have to navigate to duckduckgo one more step. [edit] Hiding previous versions of standard Is it possible to hide everything unrelated to particular standard? It should be, because all the "before C++14, since C++14", "before C++17, since C++17" make pages hard to read. For example, look at tuple constructor. It would be nice to be able to hide everything unrelated to C++17 <or some other> standard. — Preceding unsigned comment added by Hedede (talk • contribs) 21:04, 12 December 2017 (PST)‎ Yes, it is possible. You can go to Special:Preferences#mw-prefsection-gadgets and enable the one labeled "<gadget-StandardRevisions>". That will give you a drop-down menu, and from that you can select your interested version. --D41D8CD98F (talk) 00:58, 13 December 2017 (PST) That only works for logged-in users. I suspect most people visiting this wiki are not logged in, or even have an account. (There must be server stats for this but I don't know where they are.) It would be really useful to have that gadget visible to everyone. Is there a technical reason that prevents us from enabling a gadget for anonymous users? If not, is there non-technical reason we shouldn't do this? Guildd (talk) 12:25, 19 January 2018 (PST) The issue is that it isn't production quality. I recently spent a few hours testing it and made some notes on issues. T. Canens (talk) 13:15, 19 January 2018 (PST) I wonder if we could put these issues to https://github.com/p12tic/cppreference-doc/issues because it's so easy to lose them here. --P12 14:52, 7 June 2019 (PDT) Please see cpp/17, cpp/20. --Costa (talk) 10:17, 15 December 2019 (PST) [edit] Usefulness of translated sites Does anyone have strong feelings about the usefulness of the non-english subsites? I've gotten a non-trivial amount of feedback from non-english speakers saying that the autotranslated content on those sites is at best useless (it's not very readable and quickly falls out of sync with the english-language content) and at worst disruptive (it can contaminate search results, making it harder for good results to bubble to the top). People have been making changes to the non-english subsites, but at a very low rate compared to the english site. I don't like the idea of throwing out the translation work that people have done, but at some point the costs may outweigh the benefits. Thoughts? --Nate (talk) 10:05, 13 July 2016 (PDT) I only heard bad things about the non-English cppreference as well. --Cubbi (talk) 11:33, 13 July 2016 (PDT) There has been significant amount of work in at least Russian and Chinese wikis and I think the content there is useful, especially given that we don't let search engines index autotranslated pages. The Chinese seems to be very active even now, although it's single person effort currently. Having said that the rest of the wikis are indeed not attracting interest and are unlikely to take off. I think we could export the content, backup it and shutdown the wikis. If someone thinks he wants to contribute significant amount of time, I could fire up a wiki with the archived content on a personal server on a personal domain for a month and during that time it would become clear if the contributor was serious or only talking. --P12 03:07, 1 February 2017 (PST) Hmm, do we want to make a decision on this? Shut down everything but en (of course), zh, and ru? I have an AWB bot set up to transform the piles of language links into {{langlinks}}, but if we are doing this then that should probably wait. T. Canens (talk) 22:03, 3 July 2017 (PDT) OTOH, if we convert to using the template, then we can globally suppress links to the removed languages in the template instead of cleaning up every page, and resurrecting a language - should we ever need to do that - can also be globally done in the template with a few edits. So maybe we should do the transformation anyways... T. Canens (talk) 22:12, 3 July 2017 (PDT) A few years late to the party. I've been working to bring the Spanish version up to date, I have a few hours a week, but in case this discussion pops up again, don't shut the sites down. Eventually the idea is to promote es.cppreference.com in universities in Spain, Mexico. Latin America. ticotico (talk) 16:41, 19 March 2020 (PDT) [edit] Tracking {{noexcept}} and hidden DR comments We've decided - I think - on merging {{noexcept}} into the applicable function signatures, but there's no easy way to see which pages haven't been processed yet. What do people think of the following: Using Special:ReplaceText, replace all current uses of {{noexcept}} with a tracking template - say, {{unreviewed noexcept}} - which looks just like {{noexcept}} but has a hidden tracking category added to it. We can then process the pages in the category and remove processed pages from the category, until it eventually becomes empty. We could probably also do something similar with the <!--CWG 1234-->-style DR markers, most of which probably should go to {{dr list item}}. T. Canens (talk) 23:35, 30 March 2017 (PDT) I think some (many?) of the hidden DR comments are there to tell the future editors why the text differs from published pre-DR standard. Great idea for the noexcept migration though. --Cubbi (talk) 06:28, 31 March 2017 (PDT) I think it still makes sense to systematically review all the DR comments, though, to ensure that everything is in the DR list. We can still keep them after the review. T. Canens (talk) 10:46, 31 March 2017 (PDT) true. I started reviewing all DRs manually when DR list was invented (that's what User:Cubbi/Sandbox is about), but it fell to the bottom of priority list. --Cubbi (talk) 10:56, 31 March 2017 (PDT) Also, do we want to keep the "Exceptions" section afterwards for simple cases (where we don't have anything to add beyond some combination of (none) and just {{noexcept}})? I'm not sure I see much point in keeping them. T. Canens (talk) 10:55, 31 March 2017 (PDT) Moving exceptions to the signature sounds fine, as long as the signatures can be formatted such that they're not too hard to parse. I don't see much point in leaving behind empty "Exceptions" sections afterwards. :) --Nate (talk) 20:04, 1 April 2017 (PDT) [edit] Exact match in search results When searching, if there is only one hit the site automatically redirects to that page. (http://en.cppreference.com/mwiki/index.php?search=distance) When there are multiple results including an exact match, it does not automatically forward, although the exact match is listed on top. (http://en.cppreference.com/mwiki/index.php?search=std%3A%3Alist) This is particularly annoying since quite a lot of searches have two results, one in std and one in std::pmr for example (try searching for vector). Would there be an easy way to (locally/using an extra GET argument?) change this behaviour, so that it always opens the first page on exact matches? Also, I'm often too lazy to type the std:: part, but when searching 'set' for example, I usually just want the std::set. Ragnar (talk) 04:25, 2 May 2017 (PDT) Ragnar [edit] Wrong line breaking On page c/language/operator_logical See screenshot here: https://ibb.co/jc0DL5 [edit] about book book page & subpages seemed to need to update it uses old-style code background (need to update) it shows there is 'dynarray' in C++14 (just remove it) it shows optional appered in C++14 (C++17 in fact) it says cout means console output (character output in fact, see cpp/io/cout for more infomation) [edit] Can you reword http://en.cppreference.com/w/c/memory/malloc and similar pages... ... to avoid such: https://stackoverflow.com/questions/46734808/strictly-speaking-does-the-c-standard-require-that-free-must-be-called-after-ma misunderstandings? (I am assuming that this interpretation of your docs is the correct one: https://stackoverflow.com/a/46735077/4385532 - is this correct? ) [edit] Minor search bug Searching for nullptr yields the nullptr_t result in the C section --Ybab321 (talk) 11:14, 25 November 2017 (PST) [edit] gadget-StandardRevisions tool to be updated <gadget-StandardRevisions> is indeed useful but the problem is that, for example tuple constructor, although constructor declarations of versions other than selected are properly hidden, the description below is not. Is it a current existing bug, or just unconsidered? Will it please be fixed or added? That will be more pleasant to readers. [edit] gadget-StandardRevisions tool to be updated The tool can properly work with the (model) declarations. But it can't work with the description below. Was this ever considered? Fixing this will make it more pleasant to readers. [edit] P0777R1/decay/remove_cvref P0777R1's changes from std::decay to std:remove_cvref are behavioral no-ops, even though they might increase compiler throughput. I think revboxing the changes gives them more prominence than they deserve. Possible options I can think of: Keep the revboxen as is, even though they don't alter the behavior in any way. Drop them and use remove_cvref throughout even for pre-C++20 features. Drop them and keep using decay for pre-C++20 features (keep remove_cvref for new features in C++20 and later). Drop them and use remove_cv_t<remove_reference_t<...>> for pre-C++20 features Thoughts? T. Canens (talk) 15:40, 19 December 2017 (PST) New revisions of standards are made in order to be used by programmers. For me, I try to keep using the latest. For examples, differing standard is not a big problem (at least, not so convincing to me). A resolution that meets most of demands is to show expressions in different standards, for example: use remove_cvref in all examples (including pre-C++20 ones) and comment something like "Pre-C++20 can use decay(...) (or so) instead" so most of the users can find their interesting stuff. --LittleFlower (talk) 18:35, 23 December 2017 (PST) [edit] Should we have {{mark macro var}} or {{mark macro}}? Currently errno and RSIZE_MAX are classified as macro variable. Is it better to describe them by a separated template, e.g. {{mark macro var}} (resulting in (macro variable)). And some macros like and_eq and static_assert expand to keywords and operators, and not (constant) expressions. Is it inappropriate to classify them as (macro constant) ? And should a new template, such as {{mark macro}} (resulting in (macro)), be used for them? (together with other templates, e.g. {{dsc macro var}}) Fruderica (talk) 02:11, 23 January 2018 (PST) Partially done. But it seems that there are not a consistent definition of "variable" in C, which matters. Fruderica (talk) 08:54, 18 May 2018 (PDT) [edit] Return the 'Operator precedence' to the main page May someone do the subj.? Why have this link was removed, at all? Serge Roussak (talk) 22:12, 28 Jan'''
