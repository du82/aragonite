n) [edit] Defined in header <time.h> gmtimegmtime_rgmtime_s(C23)(C11) converts time since epoch to calendar time expressed as Coordinated Universal Time (UTC) (function) [edit] localtimelocaltime_rlocaltime_s(C23)(C11) converts time since epoch to calendar time expressed as local time (function) [edit] mktime converts calendar time to time since epoch (function) [edit] [edit] Constants Defined in header <time.h> CLOCKS_PER_SEC number of processor clock ticks per second (macro constant) [edit] [edit] Types Defined in header <time.h> tm calendar time type(struct)[edit] time_t calendar time since epoch type (typedef) [edit] clock_t processor time since era type (typedef) [edit] timespec(C11) time in seconds and nanoseconds (struct)[edit] [edit] References C23 standard (ISO/IEC 9899:2024): 7.27 Date and time <time.h> (p: TBD) 7.29.5.1 The wcsftime function (p: TBD) 7.31.14 Date and time <time.h> (p: TBD) C17 standard (ISO/IEC 9899:2018): 7.27 Date and time <time.h> (p: 284-291) 7.29.5.1 The wcsftime function (p: 320-321) 7.31.14 Date and time <time.h> (p: 333) C11 standard (ISO/IEC 9899:2011): 7.27 Date and time <time.h> (p: 388-397) 7.29.5.1 The wcsftime function (p: 439-440) 7.31.14 Date and time <time.h> (p: 456) C99 standard (ISO/IEC 9899:1999): 7.23 Date and time <time.h> (p: 338-347) 7.24.5.1 The wcsftime function (p: 385-386) C89/C90 standard (ISO/IEC 9899:1990): 4.12 DATE AND TIME <time.h> [edit] See also C++ documentation for C Date and time utilities Retrieved from "https://en.cppreference.com/mwiki/index.php?title=c/chrono&oldid=180683"'''
