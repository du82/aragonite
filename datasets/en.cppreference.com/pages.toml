title = "Help:Templates - cppreference.com"
full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Help:Templates From cppreference.com This page describes the templates used in this wiki. Templates provide means to achieve the following objectives: Quality. It becomes easy to modify the content and hence to fix errors. Duplicated content needs to be edited only once. Consistency. Templates make the right way to do things implicit. Usability. Advanced formatting is made easy by the templates. There are a lot of templates in this wiki. The list of all templates is available at Special:AllPages. Since this wiki uses Mediawiki CMS, all templates present in the Wikipedia project can be used here. As an additional benefit, the template documentation can be used to learn Mediawiki template syntax. Contents 1 Lists 1.1 List template families 2 Typography helper templates 3 Formatting 4 Syntax highlighting 5 Links and anchors 6 Anchors 7 Absolute links 7.1 Normal font 7.2 Teletype font 7.3 Italic teletype font 8 Absolute links with prefix std:: 9 Relative links 9.1 Normal font 9.2 Teletype font 9.3 Italic teletype font 10 Decorated links 11 Links and information of standardization 12 WG21 13 stddoc 14 stddocs 15 stdinfo 16 Current language 17 POSIX 17.1 Examples 17.2 Annotations 17.2.1 {{mark}} family of templates 17.2.1.1 Example 17.2.2 {{cmark}} family of templates 17.3 Versioning 17.4 Feature-test macros rendering 18 Feature-testing macros support 18.1 One-row form 18.2 Multi-row form 18.2.1 Syntax 18.2.2 Example 18.3 Inline forms 18.3.1 Examples 18.4 Navigation bars 18.5 Miscellaneous 18.5.1 Spaces 18.5.2 Handle space characters 18.5.3 Headers 18.6 Utility templates (intended to be used only by other templates) 18.6.1 Cast requirements 18.6.2 Standard containers classification 18.6.3 Examples [edit] Lists List template families dsc **** : For creation of member variable/function lists. dcl **** : For creation of detailed declaration lists (those including actual declaration code). sdsc **** : For creation of lists representing various syntaxes of a language feature. Used in subpages of cpp/language. par **** : For creation of lists explaining function parameters. spar **** : For creation of lists explaining syntax parameters. nv **** : For creation of feature lists in navbars. elink **** : For creation of External links lists. [edit] Typography helper templates [edit] [{{purge}}] Documentation This is one of the templates used to output special symbols: {{!}} - outputs | {{!!}} - outputs || {{=}} - outputs = {{==}} - outputs == {{!=}} - outputs |= {{(!}} - outputs {| {{!)}} - outputs |} The above documentation is transcluded from Template:!/doc. (edit | history) Subpages of this page. [edit] Formatting [edit] [{{purge}}] Documentation Adds formatting to the enclosed text: Usage Description Resulting HTML/MediaWiki elements Preview {{i|text}} text in italic normal font <i>text</i>{{sep}} text ﻿ {{tt|text}} text in monospace font <code> text {{ttb|text}} text in bold monospace font <code><b> text {{tti|text}} text in italic monospace font <code><i> text {{normal|text}} text in normal font weight ... font-weight: normal; ... text {{ttn|text}} text in monospace font of normal weight {{normal|<code>text</code>}} text {{ttni|text}} text in italic monospace font of normal weight {{normal|<code><i>text</i></code>}} text {{petty|text}} small-ish text {{small| text {{small|text}} small text ... font-size: 0.7em; line-height: 130%; ... text {{smalltt|text}} small text in monospace font {{small|<code>text</code>}} text {{sub|text}} subscripted text in normal font <sub> text {{sup|text}} superscripted text in normal font <sup> text {{p|text}} text in a new paragraph <p>text</p> text The above documentation is transcluded from Template:tt/doc. (edit | history) Subpages of this page. [edit] Syntax highlighting [edit] [{{purge}}] Documentation These are templates used for syntax highlighting. {{c|code ﻿|lang=language ﻿(optional)}} A base template that is intended to highlight code inline. lang is optional; value returned by {{get lang}} is used by default. Applies a semi-transparent dark background. Example: {{c|std::string(80, '_');}} results in std::string(80, '_'); Example: {{c|1= auto x = std::array{1, 2, 3};}} results in auto x = std::array{1, 2, 3}; Note that 1= is necessary if an equal sign = is present somewhere in the expression. For code snippets in ranges (such as [begin, end)), the {{range}} template family is preferred. {{c multi|line1 ﻿|line2 ﻿(optional)|... ﻿|line8 ﻿(optional)|lang=language ﻿(optional)}} Alike {{c}}, supports multi-line code snippets (up to 8 lines). lang is optional; value returned by {{get lang}} is used by default. Code highlighting does not span across lines: avoid splitting string literals ("") and multi-line comments (/* */). Example (note the padding spaces): {{c multi|std::max(std::numeric_limits<int>::max(),| std::numeric_limits<int>::min())}} or (note the convenient indentation): {{c multi|std::max(std::numeric_limits<int>::max(),| std::numeric_limits<int>::min())}} results in std::max(std::numeric_limits<int>::max(), std::numeric_limits<int>::min()). Note that if an equal sign = is present somewhere in the corresponding line, the leading |1=/|2=/|3=/.../|8= are necessary, e.g. {{c multi|1=std::any = 42;|2=std::any = 3.14;}} results in std::any = 42;std::any = 3.14;. {{cc multi|line1 ﻿|line2 ﻿(optional)|... ﻿|line8 ﻿(optional)|lang=language ﻿(optional)}} Same as {{c multi}} just no background (e.g. the bounding box) is applied. Example (note the padding spaces): {{cc multi|std::max(std::numeric_limits<int>::max(),| std::numeric_limits<int>::min())}} or {{cc multi|std::max(std::numeric_limits<int>::max(),|{{nbsp|9}}std::numeric_limits<int>::min())}} or (note the convenient indentation): {{cc multi|std::max(std::numeric_limits<int>::max(),| std::numeric_limits<int>::min())}} results in std::max(std::numeric_limits<int>::max(), std::numeric_limits<int>::min()). {{c/core|code ﻿|lang=language ﻿(optional)}} Same as {{c}} just no background (e.g. the bounding box) is applied. Intended to be used in other templates only. Example: {{c/core|std::puts("C++");}} results in std::puts("C++"); {{co|code ﻿|lang=language ﻿(optional)}} Same as {{c/core}} just no background (e.g. the bounding box) is applied. Intended to be used in tables where bounding boxes are set by the table's frame. Example: {{co|std::basic_regex<char>}} results in std::basic_regex<char> {{box|tags ﻿}} Alike {{c}}, applies one shared bounding box to a formatted text generated by several given tags. Example: {{box|{{lc|std::pair}}{{tt|''<int, char>''()}}}} results in std::pair<int, char>() Example: {{ltt std|cpp/algorithm/swap}}{{tt|''<int>''}}{{c/core|(x, y);}}}} results in std::swap<int>(x, y); {{box/core|tags ﻿}} Same as {{box}} just no background (e.g. the bounding box) is applied. Example: {{box/core|{{c/core|std::common_reference_t<ranges::range_reference_t<R1>,}}<br>{{nbspt|24}}{{c/core|ranges::range_reference_t<R2>>}}}} results in std::common_reference_t<ranges::range_reference_t<R1>, ranges::range_reference_t<R2>> {{cc|code ﻿|lang=language ﻿(optional)}} A base template that is intended to highlight larger amounts of code inline. Usually used when the {{c}} template doesn't display the code readable, but {{source}} would waste too much space. lang is optional; value returned by {{get lang}} is used by default. Example: {{cc|1= assert(std::hypot(3, 4) == 5);}} results in assert(std::hypot(3, 4) == 5); {{source|code ﻿|lang=language ﻿(optional)}} A base template that is intended to highlight large amounts of code. lang is optional; value returned by {{get lang}} is used by default. For example, the code: {{source|1= int main() { __builtin_printf("Hello, C++\n"); } }} results in int main() { __builtin_printf("Hello, C++\n"); } {{eq fun|code1 ﻿|code2 ﻿(optional)|... ﻿|code4 ﻿(optional)|lang=language ﻿(optional)}} A base template for representing code snippets in Possible implementation sections. The arguments code1, code2, etc. are code for each version of the function template being described (e.g., std::fill-family in the case below). If no code is supplied at all, the template results in {{todo}}. lang is optional — value returned by {{get lang}} is used by default. For example, the code: {{eq fun | 1= template<class ForwardIt, class T> void fill(ForwardIt first, ForwardIt last, const T& value) { for (; first != last; ++first) *first = value; } | 2= template<class OutputIt, class Size, class T> OutputIt fill_n(OutputIt first, Size count, const T& value) { for (Size i = 0; i < count; i++) *first++ = value; return first; } }} results in: First version template<class ForwardIt, class T> void fill(ForwardIt first, ForwardIt last, const T& value) { for (; first != last; ++first) *first = value; } Second version template<class OutputIt, class Size, class T> OutputIt fill_n(OutputIt first, Size count, const T& value) { for (Size i = 0; i < count; i++) *first++ = value; return first; } {{eq impl|code1 ﻿|code2 ﻿(optional)|... ﻿|code4 ﻿(optional)|title1 ﻿(optional)|... ﻿|title4 ﻿(optional)|lang=language ﻿(optional)}} Additional params: {{eq impl|ver1=link1 ﻿|... ﻿|ver4=link4 ﻿(optional)}} Same as {{eq fun}} with two additional capabilities: A substitution of any of the default title with a custom one via optional parameter(s) title1=Your title, ..., title4=Your title . Default titles are the same as of aforementioned template {{eq fun}}, i.e. First version, ..., Fourth version. An auto-generation of internal link "under" the title text. If verN is specified, this template generates an internal HTML link with target name "Version num". For example, if ver2=3 the internal link "#Version 3" will be generated. This capability works together with generation of internal anchors by {{dcla}} and {{dcl rev multi}} to link Possible implementation code sections to declarations in Synopsis. {{example|description ﻿(optional)|lang=language ﻿(optional)|std=language standard ﻿(optional)|code=code to display ﻿|p=true if nondeterministic ﻿(optional)|output=sample output ﻿(optional)}} A base template to represent examples. If code is not present, the template results in {{todo}}. lang defaults to a value returned by {{get lang}}. output specifies the output which is displayed by the code. If the output is not deterministic, p should be set to true to indicate this (then "Possible output:" is shown instead of just "Output:"). The following language standards are available: cxx98, cxx03, cxx11, cxx14, c89, c99, c11. For example, the code: {{example | Commenting string | code= int main() { __builtin_puts("Hello, C++"); } | p=true | output= Hello, C++ }} results in: Commenting stringRun this code int main() { __builtin_puts("Hello, C++"); } Possible output: Hello, C++ The above documentation is transcluded from Template:source/doc. (edit | history) Subpages of this page. [edit] Links and anchors [edit] [{{purge}}] Documentation These are templates that are used to create HTML hyperlinks and HTML anchors. [edit] Anchors {{anchor|1 ﻿|2 ﻿(optional)|3 ﻿(optional)|... ﻿(optional)|10 ﻿(optional)}} - creates one or more (up to 10) HTML anchors to refer to. [edit] Absolute links [edit] Normal font {{lt|path ﻿|title ﻿(optional)}} - creates a link to a page using absolute path. The default title is only the last part of the path. Example: {{lt|cpp/language/statements}} results in the link: statements. Example: {{lt|cpp/language/statements|Labeled statements}} results in the link: Labeled statements. Note: the previous example is just another way to create the same link using the standard template [[cpp/language/statements|Labeled statements]], which also results in Labeled statements. {{ls|path#section ﻿}} - makes a link to a section (anchor) on a page given by absolute path. The section text is also used as the title. To create a link on the same page the path part should be empty. Example: {{ls|cpp/language/lambda#Syntax}} results in the link: Syntax. To create a link to a section/anchor within the current page the path part should be omitted. Example: {{ls|#Relative links}} results in the link: Relative links (i.e. a link to the section in this page). {{lsd|path#Section ﻿}} ("lsd" stands for "Link to Section De-capitalized") - almost the same as {{ls}} except it de-capitalizes the first letter of displayed section name. To create a link on the same page the path part should be empty. Example: {{lsd|cpp/language/array#Arrays of unknown bound}} results in the link: arrays of unknown bound. Example: {{lsd|#Relative links}} results in the link: relative links (i.e. a link to the section in this page). [edit] Teletype font {{ltt|path ﻿|title ﻿(optional)}} - creates a link to a page using absolute path. The default title is only the last part of the path. Example: {{ltt|cpp/language/switch}} results in the link: switch. Example: {{ltt|cpp/language/switch|switch(expr)}} results in the link: switch(expr). {{ltf|path ﻿|title ﻿(optional)|args=arguments ﻿(optional)}} - creates a link to a page using absolute path. The default title is only the last part of the path. Parentheses indicating function are appended, which enclose the optional arguments. Example: {{ltf|cpp/error/terminate}} results in the link: terminate(). Example: {{ltf|cpp/error/terminate|std::terminate}} results in the link: std::terminate(). Example: {{ltf|cpp/error/set_terminate|std::set_terminate|args=nullptr}} results in the link: std::set_terminate(nullptr). {{ltp|path ﻿|title ﻿(optional)|targs=template arguments ﻿(optional)}} - creates a link to a page using absolute path. The default title is only the last part of the path. Angle brackets indicating template are appended, which enclose the optional template arguments. Example: {{ltp|cpp/container/vector}} results in the link: vector<>. Example: {{ltp|cpp/container/vector|targs=int}} results in the link: vector<int>. Example: {{ltp|cpp/container/vector|targs=std::size_t}} results in the link: vector<std::size_t>. {{ltpf|path ﻿|title ﻿(optional)|targs=template arguments ﻿(optional)|args=arguments ﻿(optional)}} - creates a link to a page using absolute path. The default title is only the last part of the path. Angle brackets indicating template are appended, which enclose the optional template arguments. After that, parentheses indicating function are appended, which enclose the optional arguments. Example: {{ltpf|cpp/container/vector/vector|targs=int|args=5}} results in the link: vector<int>(5). Example: {{ltpf|cpp/locale/use_facet|targs=Facet|args=loc}} results in the link: use_facet<Facet>(loc). {{lst|path#section ﻿}} - makes a link to a section (anchor) on a page given by absolute path. The section text is also used as the title. To create a link on the same page the path part should be empty. Example: {{lst|cpp/ranges#maybe-const}} results in the link: maybe-const. Example: {{lst|#top}} results in the link: top. E'''
