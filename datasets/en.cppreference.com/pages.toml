nt value towards the given value (function) [edit] copysigncopysignfcopysignl(C99)(C99)(C99) produces a value with the magnitude of a given value and the sign of another given value (function) [edit] Classification and comparison fpclassify(C99) classifies the given floating-point value (function macro) [edit] isfinite(C99) checks if the given number has finite value (function macro) [edit] isinf(C99) checks if the given number is infinite (function macro) [edit] isnan(C99) checks if the given number is NaN (function macro) [edit] isnormal(C99) checks if the given number is normal (function macro) [edit] signbit(C99) checks if the given number is negative (function macro) [edit] isgreater(C99) checks if the first floating-point argument is greater than the second (function macro) [edit] isgreaterequal(C99) checks if the first floating-point argument is greater or equal than the second (function macro) [edit] isless(C99) checks if the first floating-point argument is less than the second (function macro) [edit] islessequal(C99) checks if the first floating-point argument is less or equal than the second (function macro) [edit] islessgreater(C99) checks if the first floating-point argument is less or greater than the second (function macro) [edit] isunordered(C99) checks if two floating-point values are unordered (function macro) [edit] [edit] References C23 standard (ISO/IEC 9899:2024): 7.8 Format conversion of integer types <inttypes.h> (p: TBD) 7.12 Mathematics <math.h> (p: TBD) 7.22 General utilities <stdlib.h> (p: TBD) 7.31.5 Format conversion of integer types <inttypes.h> (p: TBD) 7.31.12 General utilities <stdlib.h> (p: TBD) C17 standard (ISO/IEC 9899:2018): 7.8 Format conversion of integer types <inttypes.h> (p: 158-160) 7.12 Mathematics <math.h> (p: 169-190) 7.22 General utilities <stdlib.h> (p: 248-262) 7.31.5 Format conversion of integer types <inttypes.h> (p: 332) 7.31.12 General utilities <stdlib.h> (p: 333) C11 standard (ISO/IEC 9899:2011): 7.8 Format co