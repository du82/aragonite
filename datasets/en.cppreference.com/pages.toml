2 Execution policies (since C++17) 3 Non-modifying sequence operations 3.1 Batch operations 3.2 Search operations 3.3 Fold operations (since C++23) 4 Modifying sequence operations 4.1 Copy operations 4.2 Swap operations 4.3 Transformation operations 4.4 Generation operations 4.5 Removing operations 4.6 Order-changing operations 4.7 Sampling operations 5 Sorting and related operations 5.1 Requirements 5.2 Partitioning operations 5.3 Sorting operations 5.4 Binary search operations (on partitioned ranges) 5.5 Set operations (on sorted ranges) 5.6 Merge operations (on sorted ranges) 5.7 Heap operations 5.8 Minimum/maximum operations 5.9 Lexicographical comparison operations 5.10 Permutation operations 6 Numeric operations 7 Operations on uninitialized memory 8 Random number generation (since C++26) 9 Notes 10 C library 11 Defect reports 12 See also [edit] Constrained algorithms (since C++20) C++20 provides constrained versions of most algorithms in the namespace std::ranges. In these algorithms, a range can be specified as either an iterator-sentinel pair or as a single range argument, and projections and pointer-to-member callables are supported. Additionally, the return types of most algorithms have been changed to return all potentially useful information computed during the execution of the algorithm. std::vector<int> v{7, 1, 4, 0, -1}; std::ranges::sort(v); // constrained algorithm [edit] Execution policies (since C++17) Most algorithms have overloads that accept execution policies. The standard library algorithms support several execution policies, and the library provides corresponding execution policy types and objects. Users may select an execution policy statically by invoking a parallel algorithm with an execution policy object of the corresponding type. Standard library implementations (but not the users) may define additional execution policies as an extension. The semantics of parallel algorithms invoked with an execution policy object of implementation-defined type is implementation-defined. Parallel version of algorithms (except for std::for_each and std::for_each_n) are allowed to make arbitrary copies of elements from ranges, as long as both std::is_trivially_copy_constructible_v<T> and std::is_trivially_destructible_v<T> are true, where T is the type of elements. Defined in header <execution> Defined in namespace std::execution sequenced_policyparallel_policyparallel_unsequenced_policyunsequenced_policy(C++17)(C++17)(C++17)(C++20) execution policy types (class) [edit] seqparpar_unsequnseq(C++17)(C++17)(C++17)(C++20) global execution policy objects (constant) [edit] Defined in namespace std is_execution_policy(C++17) test whether a class represents an execution policy (class template) [edit] Feature-test macro Value Std Feature __cpp_lib_parallel_algorithm 201603L (C++17) Parallel algorithms __cpp_lib_execution 201603L (C++17) Execution policies 201902L (C++20) std::execution::unsequenced_policy [edit] Non-modifying sequence operations [edit] Batch operations Defined in header <algorithm> for_each applies a unary function object to elements from a range (function template) [edit] ranges::for_each(C++20) applies a unary function object to elements from a range(algorithm function object)[edit] for_each_n(C++17) applies a function object to the first N elements of a sequence (function template) [edit] ranges::for_each_n(C++20) applies a function object to the first N elements of a sequence(algorithm function object)[edit] [edit] Search operations Defined in header <algorithm> all_ofany_ofnone_of(C++11)(C++11)(C++11) checks if a predicate is true for all, any or none of the elements in a range (function template) [edit] ranges::all_ofranges::any_ofranges::none_of(C++20)(C++20)(C++20) checks if a predicate is true for all, any or none of the elements in a range(algorithm function object)[edit] ranges::containsranges::contains_subrange(C++23)(C++23) checks if the range contains the given element or subrange(algorithm function object)[edit] findfind_iffind_if_not(C++11) finds the first element satisfying specific criteria (function template) [edit] ranges::findranges::find_ifranges::find_if_not(C++20)(C++20)(C++20) finds the first element satisfying specific criteria(algorithm function object)[edit] ranges::find_lastranges::find_last_ifranges::find_last_if_not(C++23)(C++23)(C++23) finds the last element satisfying specific criteria(algorithm function object)[edit] find_end finds the last sequence of elements in a certain range (function template) [edit] ranges::find_end(C++20) finds the last sequence of elements in a certain range(algorithm function object)[edit] find_first_of searches for any one of a set of elements (function template) [edit] ranges::find_first_of(C++20) searches for any one of a set of elements(algorithm function object)[edit] adjacent_find finds the first two adjacent items that are equal (or satisfy a given predicate) (function template) [edit] ranges::adjacent_find(C++20) finds the first two adjacent items that are equal (or satisfy a given predicate)(algorithm function object)[edit] countcount_if returns the number of elements satisfying specific criteria (function template) [edit] ranges::countranges::count_if(C++20)(C++20) returns the number of elements satisfying specific criteria(algorithm function object)[edit] mismatch finds the first position where two ranges differ (function template) [edit] ranges::mismatch(C++20) finds the first position where two ranges differ(algorithm function object)[edit] equal determines if two sets of elements are the same (function template) [edit] ranges::equal(C++20) determines if two sets of elements are the same(algorithm function object)[edit] search searches for the first occurrence of a range of elements (function template) [edit] ranges::search(C++20) searches for the first occurrence of a range of elements(algorithm function object)[edit] search_n searches for the first occurrence of a number consecutive copies of