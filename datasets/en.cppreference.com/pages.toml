qualifiers and static in [] within function declarations Variadic macros _Pragma preprocessor operator Standard pragmas for floating-point evaluation STDC FENV_ACCESS STDC FP_CONTRACT STDC CX_LIMITED_RANGE [edit] Feature test macros for optional features __STDC_IEC_559__ Indicates IEEE-754 binary floating-point arithmetic and required math functions are supported. __STDC_IEC_559_COMPLEX__ Indicates IEEE-754 complex arithmetic and required math functions are supported. __STDC_HOSTED__ Indicates that the implementation is hosted. __STDC_ISO_10646__ Indicates that Unicode is used by the wide literal encodings and expands to the latest supported revision. __STDC_MB_MIGHT_NEQ_WC__ Indicates that there are some characters in the basic character set having different code unit values in ordinary and wide literal encodings. [edit] New library features [edit] New headers <complex.h> <fenv.h> <inttypes.h> <stdbool.h> <stdint.h> <tgmath.h> [edit] Library features Aliases for integer types Integer types with exact width (intN_t and uintN_t) Fastest integer types with at least given width (int_fastN_t and uint_fastN_t) Smallest integer types with at least given width (int_leastN_t and uint_leastN_t) Integer types capable for cast between object pointers (intptr_t and uintptr_t) Integer types with maximum width (intmax_t and uintmax_t) Operations on long long and intmax_t llabs() imaxabs() lldiv() imaxdiv() Floating-point environment access Extended floating-point math functions New floating-point math functions -f and -l variants for existing and new floating-point math functions Math error handling Complex functions _Exit() Formatting support for long long, unsigned long long, intmax_t, and uintmax_t atoll() strtoimax() strtoll() strtoull strtoumax() wcstoimax() wcstoll() wcstoull() wcstoumax() isblank() and iswblank() snprintf() and vsnprintf() vfscanf() and vfwscanf() function families Extensions for fscanf() and fprintf() function families ll length modifier for long long and