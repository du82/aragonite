full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Containers library From cppreference.com < cpp C++ Compiler support Freestanding and hosted Language Standard library Standard library headers Named requirements Feature test macros (C++20) Language support library Concepts library (C++20) Diagnostics library Memory management library Metaprogramming library (C++11) General utilities library Containers library Iterators library Ranges library (C++20) Algorithms library Strings library Text processing library Numerics library Date and time library Input/output library Filesystem library (C++17) Concurrency support library (C++11) Execution control library (C++26) Technical specifications Symbols index External libraries [edit] Containers library Sequence array(C++11) vector vector<bool> inplace_vector(C++26) hive(C++26) deque forward_list(C++11) list Associative set multiset map multimap Unordered associative unordered_set(C++11) unordered_multiset(C++11) unordered_map(C++11) unordered_multimap(C++11) Adaptors stack queue priority_queue flat_set(C++23) flat_multiset(C++23) flat_map(C++23) flat_multimap(C++23) Views span(C++20) mdspan(C++23) Tables Iterator invalidation Member function table Non-member function table [edit] The Containers library is a generic collection of class templates and algorithms that allow programmers to easily implement common data structures like queues, lists and stacks. There are two(until C++11)three(since C++11) classes of containers: sequence containers, associative containers, unordered associative containers, (since C++11) each of which is designed to support a different set of operations. The container manages the storage space that is allocated for its elements and provides member functions to access them, either directly or through iterators (objects with properties similar to pointers). Most containers have at least several member functions in common, and share functionalities. Which container is the best for the particular application depends not only on the offered functionality, but also on its efficiency for different workloads. Contents 1 Sequence containers 2 Associative containers 3 Unordered associative containers (since C++11) 4 Container adaptors 5 Views (since C++20) 6 Iterator invalidation 7 Thread safety 8 Function table 8.1 Member function table 8.2 Non-member function table 9 Defect reports 10 See also [edit] Sequence containers Sequence containers implement data structures which can be accessed sequentially. array(C++11) fixed-sized inplace contiguous array (class template) [edit] vector resizable contiguous array (class template) [edit] inplace_vector(C++26) resizable, fixed capacity, inplace contiguous array (class template) [edit] hive(C++26) collection that reuses erased elements' memory (class template) [edit] deque double-ended queue (class template) [edit] forward_list(C++11) singly-linked list (class template) [edit] list doubly-linked list (class template) [edit] [edit] Associative containers Associative containers implement sorted data structures that can be quickly searched (O(log n) complexity). set collection of unique keys, sorted by keys (class template) [edit] map collection of key-value pairs, sorted by keys, keys are unique (class template) [edit] multiset collection of keys, sorted by keys (class template) [edit] multimap collection of key-value pairs, sorted by keys (class template) [edit] [edit] Unordered associative containers (since C++11) Unordered associative containers implement unsorted (hashed) data structures that can be quickly searched (O(1) average, O(n) worst-case complexity). unordered_set(C++11) collection of unique keys, hashed by keys (class template) [edit] unordered_map(C++11) collection of key-value pairs, hashed by keys, keys are unique (class template) [edit] unordered_multiset(C++11) collection of keys, hashed by keys (class template) [edit] unordered_multimap(C++11) collection of key-value pairs, hashed by keys (class template) [edit] [edit] Container adaptors Container adaptors provide a different interface for sequential containers. stack adapts a container to provide stack (LIFO data structure) (class template) [edit] queue adapts a container to provide queue (FIFO data structure) (class template) [edit] priority_queue adapts a container to provide priority queue (class template) [edit] flat_set(C++23) adapts a container to provide a collection of unique keys, sorted by keys (class template) [edit] flat_map(C++23) adapts two containers to provide a collection of key-value pairs, sorted by unique keys (class template) [edit] flat_multiset(C++23) adapts a container to provide a collection of keys, sorted by keys (class template) [edit] flat_multimap(C++23) adapts two containers to provide a collection of key-value pairs, sorted by keys (class template) [edit] [edit] Views (since C++20) Views provide flexible facilities for interacting with one- or multi-dimensional views over a non-owning array of elements. span(C++20) a non-owning view over a contiguous sequence of objects (class template) [edit] mdspan(C++23) a multi-dimensional non-owning array view (class template) [edit] [edit] Iterator invalidation Read-only methods never invalidate iterators or references. Methods which modify the contents of a container may invalidate iterators and/or references, as summarized in this table. Category Container After insertion, are... After erasure, are... Conditionally iterators valid? references valid? iterators valid? references valid? Sequence containers array N/A N/A vector No N/A Insertion changed capacity Yes Yes Before modified element(s)(for insertion only if capacity didn't change) No No At or after modified element(s) deque No Yes Yes, except erased element(s) Modified first or last element No No Modified middle only list Yes Yes, except erased element(s) forward_list Yes Yes, except erased element(s) Associative containers setmultisetmapmultimap Yes Yes, except erased element(s) Unordered associative containers unordered_setunordered_multisetunordered_mapunordered_multimap No Yes N/A Insertion caused rehash Yes Yes, except erased element(s) No rehash This section is incompleteReason: add iterator invalidation for C++23 "flat" adaptors (std::flat_set etc) This section is incompleteReason: add iterator invalidation for C++26 std::inplace_vector Here, insertion refers to any method which adds one or more elements to the container and erasure refers to any method which removes one or more elements from the container. Examples of insertion methods are std::set::insert, std::map::emplace, std::vector::push_back, and std::deque::push_front. Note that std::unordered_map::operator[] also counts, as it may insert an element into the map. (since C++11) Examples of erasure methods are std::set::erase, std::vector::pop_back, std::deque::pop_front, and std::map::clear. clear invalidates all iterators and references. Because it erases all elements, this technically complies with the rules above. Unless otherwise specified (either explicitly or by defining a function in terms of other functions), passing a container as an argument to a library function never invalidate iterators to, or change the values of, objects within that container. The past-the-end iterator deserves particular mention. In general this iterator is invalidated as though it were a normal iterator to a non-erased element. So std::set::end is never invalidated, std::unordered_set::end is invalidated only on rehash(since C++11), std::vector::end is always invalidated (since it is always after the modified elements), and so on. There is one exception: an erasure which deletes the last element of a std::deque does invalidate the past-the-end iterator, even though it is not an erased element of the container (or an element at all). Combined with the general rules for std::deque iterators, the net result is that the only modifying operation which does not invalidate std::deque::end is an erasure which deletes the first element, but not the last. Thread safety All container functions can be called concurrently by different threads on different containers. More generally, the C++ standard library functions do not read objects accessible by other threads unless those objects are directly or indirectly accessible via the function arguments, including the this pointer. All const member functions can be called concurrently by different threads on the same container. In addition, the member functions begin(), end(), rbegin(), rend(), front(), back(), data(), find(), lower_bound(), upper_bound(), equal_range(), at(), and, except in associative containers, operator[], behave as const for the purposes of thread safety (that is, they can also be called concurrently by different threads on the same container). More generally, the C++ standard library functions do not modify objects unless those objects are accessible, directly or indirectly, via the function's non-const arguments, including the this pointer. Different elements in the same container can be modified concurrently by different threads, except for the elements of std::vector<bool> (for example, a vector of std::future objects can be receiving values from multiple threads). Iterator operations (e.g. incrementing an iterator) read, but do not modify the underlying container, and may be executed concurrently with operations on other iterators on the same container, with the const member functions, or reads from the elements. Container operations that invalidate any iterators modify the container and cannot be executed concurrently with any operations on existing iterators even if those iterators are not invalidated. Elements of the same container can be modified concurrently with those member functions that are not specified to access these elements. More generally, the C++ standard library functions do not read objects indirectly accessible through their arguments (including other elements of a container) except when required by its specification. In any case, container operations (as well as algorithms, or any other C++ standard library functions) may be parallelized internally as long as this does not change the user-visible results (e.g. std::transform may be parallelized, but not std::for_each which is specified to visit each element of a sequence in order). (since C++11) [edit] Function table Note: std::basic_string is not treated as a container by the standard but behaves much like one due to its similarity. It is listed as 'Pseudo container' here for convenience. - functions present in C++03 - functions present since C++11 - functions present since C++17 - functions present since C++20 - functions present since C++23 This section is incompleteReason: Add C++26 "color" and fill member/non-member function table for std::inplace_vector [edit] Member function table Pseudo container Sequence containers Associative containers Unordered associative containers Container adaptors Header <string> <array> <vector> <deque> <forward_list> <list> <set> <map> <unordered_set> <unordered_map> <stack> <queue> <flat_set> <flat_map> Header Container basic_string array vector deque forward_list list set multiset map multimap unordered_set unordered_multiset unordered_map unordered_multimap stack queue priority_queue flat_set flat_multiset flat_map flat_multimap Container (constructor) basic_string (implicit) vector deque forward_list list set multiset map multimap unordered_set unordered_multiset unordered_map unordered_multimap stack queue priority_queue flat_set flat_multiset flat_map flat_multimap (constructor) (destructor) ~basic_string (implicit) ~vector ~deque ~forward_list ~list ~set ~multiset ~map ~multimap ~unordered_set ~unordered_multiset ~unordered_map ~unordered_multimap ~stack ~queue ~priority_queue ~flat_set ~flat_multiset ~flat_map ~flat_multimap (destructor) oper