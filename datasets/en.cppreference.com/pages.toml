on (function template) [edit] ranges::move(C++20) moves a range of elements to a new location(algorithm function object)[edit] move_backward(C++11) moves a range of elements to a new location in backwards order (function template) [edit] ranges::move_backward(C++20) moves a range of elements to a new location in backwards order(algorithm function object)[edit] [edit] Swap operations Defined in header <algorithm> (until C++11) Defined in header <utility> (since C++11) Defined in header <string_view> swap swaps the values of two objects (function template) [edit] Defined in header <algorithm> swap_ranges swaps two ranges of elements (function template) [edit] ranges::swap_ranges(C++20) swaps two ranges of elements(algorithm function object)[edit] iter_swap swaps the elements pointed to by two iterators (function template) [edit] [edit] Transformation operations Defined in header <algorithm> transform applies a function to a range of elements, storing results in a destination range (function template) [edit] ranges::transform(C++20) applies a function to a range of elements(algorithm function object)[edit] replacereplace_if replaces all values satisfying specific criteria with another value (function template) [edit] ranges::replaceranges::replace_if(C++20)(C++20) replaces all values satisfying specific criteria with another value(algorithm function object)[edit] replace_copyreplace_copy_if copies a range, replacing elements satisfying specific criteria with another value (function template) [edit] ranges::replace_copyranges::replace_copy_if(C++20)(C++20) copies a range, replacing elements satisfying specific criteria with another value(algorithm function object)[edit] [edit] Generation operations Defined in header <algorithm> fill copy-assigns the given value to every element in a range (function template) [edit] ranges::fill(C++20) assigns a range of elements a certain value(algorithm function object)[edit] fill_n copy-assigns the given value to N elements in a range