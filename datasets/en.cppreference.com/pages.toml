er of integer division (function) [edit] Defined in header <inttypes.h> imaxabs(C99) computes absolute value of an integral value (\(\small{|x|}\)|x|) (function) [edit] imaxdiv(C99) computes quotient and remainder of integer division (function) [edit] Defined in header <math.h> Basic operations fabsfabsffabsl(C99)(C99) computes absolute value of a floating-point value (\(\small{|x|}\)|x|) (function) [edit] fmodfmodffmodl(C99)(C99) computes remainder of the floating-point division operation (function) [edit] remainderremainderfremainderl(C99)(C99)(C99) computes signed remainder of the floating-point division operation (function) [edit] remquoremquofremquol(C99)(C99)(C99) computes signed remainder as well as the three last bits of the division operation (function) [edit] fmafmaffmal(C99)(C99)(C99) computes fused multiply-add operation (function) [edit] fmaxfmaxffmaxl(C99)(C99)(C99) determines larger of two floating-point values (function) [edit] fminfminffminl(C99)(C99)(C99) determines smaller of two floating-point values (function) [edit] fdimfdimffdiml(C99)(C99)(C99) determines positive difference of two floating-point values (\({\small\max{(0, x-y)} }\)max(0, x-y)) (function) [edit] nannanfnanl(C99)(C99)(C99) returns a NaN (not-a-number) (function) [edit] Exponential functions expexpfexpl(C99)(C99) computes e raised to the given power (\({\small e^x}\)ex) (function) [edit] exp2exp2fexp2l(C99)(C99)(C99) computes 2 raised to the given power (\({\small 2^x}\)2x) (function) [edit] expm1expm1fexpm1l(C99)(C99)(C99) computes e raised to the given power, minus one (\({\small e^x-1}\)ex-1) (function) [edit] loglogflogl(C99)(C99) computes natural (base-e) logarithm (\({\small \ln{x} }\)ln(x)) (function) [edit] log10log10flog10l(C99)(C99) computes common (base-10) logarithm (\({\small \log_{10}{x} }\)log10(x)) (function) [edit] log2log2flog2l(C99)(C99)(C99) computes base-2 logarithm (\({\small \log_{2}{x} }\)log2(x)) (function) [edit] log1plog1pflog1pl(C99)(C99)(C99) computes