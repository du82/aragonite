full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); C11 From cppreference.com < c C Compiler support Language Headers Type support Program utilities Variadic function support Error handling Dynamic memory management Strings library Algorithms Numerics Date and time utilities Input/output support Localization support Concurrency support (C11) Technical Specifications Symbol index [edit] Versions C89 C95 C99 C11 C17 C23 Current status [edit] ISO/IEC 9899:2011, a.k.a. C11. Contents 1 Obsolete features 1.1 Removed features 2 New language features 2.1 Feature test macros for optional features 3 New library features 3.1 New headers 3.2 Library features 4 Defect reports 5 Compiler support [edit] Obsolete features [edit] Removed features gets() [edit] New language features Multithreaded environments Atomic objects (_Atomic) Thread local storage (_Thread_local) Enhanced alignment support Alignment query (_Alignof) Alignment strengthening (_Alignas) Over-aligned types Unicode support u/U character constants u8/u/U string literals Generic selection expressions (_Generic) Non-returning functions (_Noreturn) Anonymous struct and union members Fine-grained evaluation order Extending the lifetime of temporary objects _Static_assert Analyzability [edit] Feature test macros for optional features __STDC_ANALYZABLE__ Indicates analyzability is supported. __STDC_LIB_EXT1__ Indicates bounds checking functions are supported. __STDC_NO_ATOMICS__ Indicates atomic objects and the atomic operation library are not supported. __STDC_NO_COMPLEX__ Indicates complex types and the complex math functions are not supported. These features were mandatory in C99. __STDC_NO_THREADS__ Indicates thread local storage and the thread support library are not supported. __STDC_NO_VLA__ Indicates variable length arrays and variably modified types are not supported. These features were mandatory in C