["https://en.cppreference.com/w/Cppreference_talk:FAQ"]
title = "Cppreference talk:FAQ - cppreference.com"
full_description = '''window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-8HW0LXMYCY'); Cppreference talk:FAQ From cppreference.com Contents 1 Grammer either/or 2 TR1? 3 2011 C++ Standard 4 C Reference 5 Broken links 6 CSS 7 Boost Documentation? 8 Too strict introduction 9 Reference to c++ standard 9.1 References 9.2 References 10 Bug with the Coliru editor 11 Which revision of the C Standard does this reference adhere to? 12 Conversion Constructors 13 Search to redirect on exact match ? 14 Typo 15 std::lower_bound description semantics - error? 16 Compiler examples are not running 17 A little edit proposal 18 const on non-static member function 19 Search on site 20 Benio's questions 20.1 {{mark}} annotations 20.1.1 Current practice 20.1.2 Desired convention 20.2 Description pattern 20.2.1 Current practice 20.2.2 Desired convention 20.3 {{langlinks}} 20.4 Spaces before {{mark}} and {{cmark}} annotations 20.5 21 <assert.h> and <errno.h> go to same link 22 References to proposals 23 Latest C++20 draft standard 24 Creating pages 25 Guide-like stuff [edit] Grammer either/or The line "Note, however, that you don't need to know neither of the complex templates, nor abovementioned guidelines in order to contribute" should read "Note, however, that you don't need to know either the complex templates, or abovementioned guidelines in order to contribute". -P Fixed, thanks! --P12 19:32, 7 August 2015 (PDT) This is not yet fixed; it still says "neither" instead of "nor". Nwn (talk) 11:49, 13 April 2018 (PDT) [edit] TR1? Should we include information about TR1? -- Jaredgrubb 07:41, 2 July 2011 (PDT) Fixed.P12 12:34, 2 July 2011 (PDT) Neither TR1 (which is now obsolete of course) nor TR2 (far from finished, but already supported in small part (#include <filesystem>) by Microsoft, of all things) are curretnly mentioned on this page. --Cubbi 08:50, 30 April 2012 (PDT) [edit] 2011 C++ Standard ISO/IEC 14882:2011 is now published. This page shouldn't be talking of drafts. Jonathan de Boyne Pollard 02:27, 24 March 2012 (PDT) The linked draft is the latest publicly downloadable --Bazzy 02:51, 24 March 2012 (PDT) That's complete rubbish. Aside from the fact that it isn't the latest draft at all but is over a year behind the actual latest draft, the URL of one of the places where members of the public can get a copy of the non-draft standard is right there, above. Jonathan de Boyne Pollard 07:11, 25 March 2012 (PDT) We can't expect all editors to have a copy of the actual standard as it isn't freely available. Aside from that, the FAQ is surely outdated, thanks for pointing that out. -- P12 08:04, 25 March 2012 (PDT) We should add the ANSI Store purchase link for C++11, which is 10 times cheaper than the ISO store currently linked: http://webstore.ansi.org/RecordDetail.aspx?sku=INCITS%2FISO%2FIEC+14882-2012 --Cubbi 07:49, 25 July 2012 (PDT) Good idea -- done. --Nate 13:07, 25 July 2012 (PDT) [edit] C Reference This page should be updated to mention the new C reference section of the site. --- Undeterminant 10:34, 22 April 2012 (PDT) Updated. Thanks. -- P12 10:52, 22 April 2012 (PDT) Might as well give the C11 ANSI store too (I can't seem to be able to edit this page). --Cubbi 12:08, 24 September 2012 (PDT) I've relaxed the permissions for this page a bit; you should be able to edit it now, @cubbi. (@p12: we can go back to admin-only write-access for the FAQ if this was done on purpose -- I'm assuming that it makes sense for this page to have the same protection as e.g. the front pages.) Nate 15:57, 24 September 2012 (PDT) There's indeed no reason why the page should be only admin-editable. -- P12 05:03, 25 September 2012 (PDT) [edit] Broken links The link to C++20 working draft should be replaced by link to n4868 https://isocpp.org/files/papers/N4868.pdf Information about broken links on this website can be reported below The link to the C17 draft PDF has been broken for a while. The PDF is still available via archive.org, so perhaps the link could be changed to that? https://web.archive.org/web/20180118051003/http://www.open-std.org/jtc1/sc22/wg14/www/abq/c17_updated_proposed_fdis.pdf There are couple of links "std::terminate_handler" on the page http://en.cppreference.com/w/cpp/error/terminate that points to http://en.cppreference.com/w/cpp/error/terminated_handler instead of http://en.cppreference.com/w/cpp/error/terminate_handler Thanks; looks like a typo in our syntax highlighter that was just fixed: https://github.com/p12tic/cppreference-doc/commit/bcb0271a87519c44b522563ddee7dccfd7c6830b. The next time we refresh, the page should be fixed. -Nate 11:25, 31 October 2012 (PDT) The book version misses working links to CSS on some pages, e.g. std::search_n. --91.96.47.34 12:06, 4 June 2014 (PDT) Not exactly a broken link, but the URL "http://en.cppreference.com/w/cpp/language/implicit_cast" is misleading. There is no such thing as an "implicit cast"; a cast is an *explicit* conversion. The page itself correctly refers to "implicit conversions". I suggest renaming that page to "implicit_conversion" and making "implicit_cast" link to it. (Removing the existing URL would cause problems.) Keith Thompson (talk) 09:03, 1 April 2016 (PDT) yes, indeed the content of the page doesn't match the URL.. renamed leaving a redirect, thanks. --Cubbi (talk) 12:45, 1 April 2016 (PDT) Not a broken link, but a non-existent link. The autolinker doesn't appear to have an entry for "std::scoped_lock", so most references to it don't have links. For example: http://en.cppreference.com/w/cpp/thread/mutex#Notes Nwn (talk) 12:00, 13 April 2018 (PDT) NULL links are the same for both languages here https://en.cppreference.com/mwiki/index.php?title=Special%3ASearch&search=null&button=. NULL for C language should reference https://en.cppreference.com/w/c/types/NULL and not https://en.cppreference.com/w/cpp/types/NULL. This seems to have been fixed some time ago. At least currently the links look fine in the search page. --178.162.222.163 01:04, 28 June 2020 (PDT) Also not really a broken link, but more like missing links. free() tries to link against aligned_alloc(), but fails to do so. I debugged this a bit and found out that {{rlp|aligned_alloc|aligned_alloc}} seems to work. The linking mechanism employed there is the {{lc|...}} template, which is using an autolinking technique according to its documentation, but the C Autolinker definition page seems to be missing stuff like aligned_alloc(). I'm pretty sure that adding it there would make the linking work, but there are multiple obstacles to that: the page is protected, so I cannot change it I don't know whether it's maintained manually or programmatically programmatically would mean that any changes would be in vain anyway until the generator or input data is fixed. Additionally, this might be just one specific instance of links missing, maybe more C11 functions are not properly... uhm... indexed. Anyone in for taking care of that? -- 217.92.117.31 07:06, 27 June 2020 (PDT) The cpplang slack channel is returning a 404. Found on https://en.cppreference.com/w/Cppreference:EditingHelp. Something is generating the occasional bogus link. For instance, https://en.cppreference.com/w/cpp/ranges#Helper_concepts. The link for ranges::iterator_t points to <a href="http://en.cppreference.com/w/cpp/ranges-ranges-placeholder/iterator_t">. Note that is in the raw html. If you hover over the link with a mouse, apparently the JS fixes is up. If you view the source, you can see the bad link, both in terms of path AND using plain http. And of course, this breaks non-JS browsers like wget and lynx. Nexushoratio (talk) 16:22, 11 July 2023 (PDT) IIRC, this is a consequence of a workaround necessary for transition from PascalNames used in early concept proposals to standard_case names. --Space Mission (talk) 11:13, 12 July 2023 (PDT) The cppreference.com/store link appears to be broken. [edit] CSS The limitation width and max-width for the whole page should be removed. I have located 3 of them in the latest HTML-Book-Version, files common/loadfe52.css and common/load7fe1.css. After removing them the pages look much better. My download of the offline version some months ago had the same "bugs". 80.147.4.22 02:49, 4 June 2014 (PDT) Are you concerned about the width settings for the HTML-book-version or the live site (or both?) --Nate (talk) 06:53, 4 June 2014 (PDT) All 3 versions, book, Raw and live, have text bodies with fixed width (and centered). At least the non-book versions should have variable width as recommended by W3, I think. Why killing one of the most reasonable features of HTML for nothing? --91.97.19.47 11:45, 4 June 2014 (PDT) The css Mediawiki:Common.css for languages other than english is not up to date. Would you please synchronize them to the english version? Hiroo (talk) 00:09, 26 May 2015 (PDT) There is a problem with http://en.cppreference.com/w/cpp/atomic/ATOMIC_FLAG_INIT it does not render correctly. [edit] Boost Documentation? According to the FAQ: Some boost libraries could also be candidates for inclusion though. While their tutorials are very good, the reference documentation is often very inflexible and inconvenient. I feel the same way, and every C++ programmer I've spoken to about Boost seems to say the same thing. I really think the inclusion of popular Boost libs on cppreference.com would be incredibly useful to the community. Is there some way we can come to a consensus on this issue? I realize this would mean a scope change for this wiki, which would raise the question about other external libraries being documented here. From an OOD standpoint, I can see the elegance of restricting the scope of this site to the pure language standards, so perhaps this is a case for a new open source library reference wiki? CStubing at EFNet 10:55, 31 December 2012 (PST) Personally, I find their tutorials to be lacking compared to the documentation, but I've been using Boost for many years so I guess I got used to it. I agree that simple examples like the ones we put for standard C++ components would be useful (making a small flood-filled .PNG file with Boost.GIL is two lines, but there is no tutorial that shows how. People see the wall of text about generic algorithms and move on to other libraries). There's still a lot of redlinks in standard C++ library, though. --Cubbi 11:29, 31 December 2012 (PST) I like this idea. I suspect that the missing piece for getting boost on cppreference.com is finding a person to lead an initial push to get the overall structure of boost docs figured out. The three main issues that I can think of are: boost is big: I don't have good numbers on this, but based on the sources for boost_1_52 and libstdc++-v3, I'd say boost might be 2-3 times the size of libstdc++. That's a lot of content to cover. boost is released more frequently: I'm not entirely satisfied with the way that we're handling versioning on the existing wiki, and any problems that we currently have involving multiple versions are going to be magnified for boost. boost is copyrighted (?): We have to check any possible licensing issues, especially if we're interested in importing any of the existing boost tutorials or reference material. If we can find satisfactory answers to those issues, I think we could start building a boost section similar to /w/c and /w/cpp. --Nate 11:22, 1 January 2013 (PST) A couple of thoughts: 1) IMO it's hardly possible to cover all boost libraries in the foreseeable future unless there's a lot of new contributors. A possible solution would be to allow all contributions, but only show the libraries in the main page once the documentation is actually useful -- i.e. sufficiently documents most popular functionality, etc. 2) This problem will be hard to solve. An additional problem is that boost is not backwards compatible in quite a lot of cases. Some libraries have had major overhauls and it's hardly possible to document them without completely separating the documentation for each version of the library. 3) Most of the documentation is distributed under Boost software license, which is a BSD-like license -- we can do anything we want if we include the copyright text somewhere. A note on the main page of each library should be sufficient. P12 09:50, 2 January 2013 (PST) [edit] Too strict introduction I think that the following text in the FAQ is overly strict. Unfortunately this means that being a good educational resource is not among our objectives. It is assumed that the reader has good knowledge of C and/or C++. As a consequence, a lot of things, e.g. tutorials, comments about usage cases of one feature or another, detailed explanations of things that are implicitly clear to an experienced programmer, etc., are not included and should not be added. Basically, we try to keep things simple and clear for a programmer looking for reference of a feature he already knows. When I wrote this some time ago I wanted to prevent the mess that appeared in some pages of the old Dokuwiki based cppreference.com website. It seems that there's little chance for that happening now, so I've relaxed the above guideline. P12 10:17, 2 January 2013 (PST) Looks peachy. --Nate 17:45, 2 January 2013 (PST) [edit] Reference to c++ standard I think, maybe it is a good idea sometimes add a link to the c++ standard ISO/IEC 14882? Like this: 8.3.6 Default arguments (1-2,4) or like this [dcl.fct.default](1-2,4). Ruslo 00:09, 19 August 2013 (PDT) This could be an useful bit of information. We could list all sections of the standard(s) the information of a particular page is derived from. It could be put into the references section, for example: [edit] References C++11 standard (ISO/IEC 14882:2011): 8.3.6 Default arguments [dcl.fct.default] (p. 1-2,4) Or (hypothetical) [edit] References C++11 standard (ISO/IEC 14882:2011): 8.3.5 Functions [dcl.fct] 8.3.6 Default arguments [dcl.fct.default] (p. 1-2,4) C++98 standard (ISO/IEC 14882:1998): 8.3.5 Functions [dcl.fct] 8.3.6 Default arguments [dcl.fct.default] (p. 1-2,4) For consistent formatting, we could optionally use templates, for example: ===References=== {{ref std c++11}} {{ref std | section=8.3.5 | title=Functions | id=dcl.fct}} {{ref std | section=8.3.6 | title=Default arguments | id=dcl.fct.default | p=1-2,4}} {{ref std c++98}} ... Note, that adding this information on all pages is a lot of work, thus I'm unsure whether this initiative is worth pursuing until there's a volunteer willing to spend some time adding this information to a major part of the wiki (say 1000 pages out of ~3000 total, this would take ~10-15 hours). P12 05:56, 19 August 2013 (PDT) Yes, I argee. It's a lot of work, but I think it's not the main goal. Like examples - hack something, if you feel it can be improved and save it (to others and to youself). The goal is not to lose some link searching work. Ruslo 07:10, 19 August 2013 (PDT) Second version '''
