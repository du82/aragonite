title = "Portal:Printing - openSUSE Wiki"
full_description = '''Portal:Printing Jump to: navigation, search Welcome to the Printing Portal edit The current content here is mainly a collection of links to articles where you find the actual documentation and help regarding printing. Known Issues For the history of Printing News see Archive:Printing News. Topics edit For plain printers, see the links in the "All of Printing"-box on this page. For all-in-one devices (i.e. when the printer has also a scanner device included) you have to set up the scanner unit separately, see HCL:Scanners SDB:Configuring Scanners SDB:How to set-up a HP printer YaST/Modules/Scanner at http://old-en.opensuse.org/YaST/Modules/Scanner Things to do edit Provide a better content here. Please note that what I (User:Jsmeix) can provide is basically only a draft of technically correct information. I am neither a native English speaker nor a technical writer nor can I imagine correctly what the appropriate wording is to address unexperienced users in the right way. If technical experts try to imagine unexperienced users, the result could be texts which treat them like idiots ("please click the [Finish] button to finish the task"). Fortunately this is a Wiki so that anyone who knows how to address unexperienced users appropriately can enhance the articles accordingly. Do not hesitate to enhance the articles or add completely new articles. I enabled Wiki's "watch" functionality for the articles which are currently listed here so that I can check if changes keep the article technically correct. Many thanks in advance for your contribution to the openSUSE Wiki! All of Printing edit Concepts_printing HCL:Printers SDB:Printer buying guide SDB:Purchasing a Printer and Compatibility SDB:GDI Printers SDB:Installing a Printer YaST Printer SDB:How to set-up a HP printer SDB:Brother How to setup a Networked Printer Scanner SDB:Landscape Printing SDB:Printing Copies SDB:Printing to PDF SDB:AirPrint via CUPS SDB:How to Report a Printing Issue SDB:CUPS in a Nutshell SDB:Print Settings with CUPS SDB:CUPS and SANE Firewall settings SDB:Printing via TCP/IP network SDB:Printing via SMB (Samba) Share or Windows Share SDB:Printing from Windows to Linux SDB:Printer Accounting SDB:Using Your Own Filters to Print with CUPS SDB:Using Your Own Backends to Print with CUPS SDB:Laser Printer Does Not Print Properly Or Does Not Print At All SDB:Information for Printer Manufacturers Regarding Linux Support openSUSE:How to contribute to the Printing project Scribus Ghostscript PostScript In the news edit More news... Retrieved from "https://en.opensuse.org/index.php?title=Portal:Printing&oldid=43977" Categories: PortalsPrinting'''
