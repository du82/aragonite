["https://en.opensuse.org/Portal:KDE"]
title = "Portal:KDE - openSUSE Wiki"
full_description = '''Portal:KDE Jump to: navigation, search Welcome to the KDE Portal EditKDE is an international technology team that creates free and open source software for desktop and portable computing. Plasma, made by KDE is one of the graphical desktop environment of openSUSE. The latest version, Plasma 5, is a fresh, elegant and powerful desktop for both beginner and advanced users. KDE software is not limited to a desktop environment. The software made by the community includes: Plasma, the graphical desktop; KDE Applications, a collection of a wide variety of applications for communication, work, education and entertainment, including famous programs like Kate; Additional high-quality applications, such as DigiKam and Krita; KDE Frameworks, a series of modules to easily build new applications upon. What makes KDE software on openSUSE special: It has a team of dedicated engineers who spend much of their time fixing bugs so you can rely on KDE. It has a large, active and highly experienced community team around it who bring multiple points of view and different interests to the project so that KDE software on openSUSE meets many users' needs Through its innovation it stimulates the openSUSE distribution to develop, evolve and progress Topics Edit Documentation KDE Install, how to install KDE on existing system. KDE Repositories, get latest stable release or testing KDE software. KDE Documentation KDE UserBase KDE TechBase (for developers) Get Help Join the KDE openSUSE community and get in contact with the members of the openSUSE KDE Team. Learn the jargon with the help of the openSUSE KDE Team Jargon File. How to report bugs in KDE The KDE Bug Screening Guide describes how to help with screening/triaging KDE bug reports. openSUSE:Bug Squashing KDE guides you through a bug squashing session. #openSUSE-KDE on #opensuse-kde:kde.org (Matrix) or irc.kde.org/irc.opensuse.org (Libera). kde@lists.opensuse.org - openSUSE KDE Mailing List.Subscribe - Unsubscribe - Help - Archives Development Packaging is the lifeblood of a project on a distribution. This is the process by which software gets included in openSUSE so it is available on the DVD or the internet repositories to install. One of openSUSE's strengths is the freshness of our KDE packages, which are frequently updated with bugfixes from KDE SVN before they become generally available in a release. Much of the KDE core packages are packaged by the KDE Team, but third party software, for example from kde-apps.org is welcome in our Community repositories. We have produced a KDE maintainers' cheat sheet to record what we do and how to do it. Guide for building KDE on openSUSE old Packaging Cookbook for KDE on openSUSE Packaging Macros KDE on openSUSE - thoughts and ideas about KDE on openSUSE openSUSE:Factory KDE3 packages - KDE3 Packages that would still be included in Factory if the desktop was dropped (historical, from before braindead decision to include all of KDE3 again) Patch Annotation Policy Things to do Edit Get a grip on all the links. The sheer amount of links on this portal is enormous. There are a couple of things where we can consolidate: openSUSE:Bugreport KDE should be a page that explains what to deliver and how. So we can get rid of all the bugzilla links here Consolidate the Developer documentation on openSUSE:KDE development guide and openSUSE:KDE packaging guide or something Transfer and update some KDE 4 tips you should know Screenshots/Screencasts KDE Sysinfo In the News EditFeb 20: Highlights of YaST development sprint 31— Yast Team Oct 15: Proprietary AMD/ATI Catalyst fglrx 15.12 rpms released for LEAP 42.2— Bruno Friedmann Mar 17: AMD Catalyst 15.12 for openSUSE – new makerpm-amd-script is available— Sebastian Siebert Dec 21: Announcing Li-f-e 42.1— Jigish Gohil Dec 06: Proprietary AMD/ATI Catalyst fglrx rpms new release 15.11 (15.300.1025-1)— Bruno Friedmann Navigation Edit KDE KDE development KDE packaging KDE setup KDE troubleshooting Baloo openSUSE:Bug Screening KDE openSUSE:Bug Squashing KDE openSUSE:Bug Squashing KDE bugreports openSUSE:Bugreport KDE openSUSE:Communicate KDE openSUSE:Conference Kde Social Dolphin openSUSE:Factory KDE3 packages Gwenview Kate KDE Portal:KDE SDB:KDE Connect SDB:KDE install openSUSE:KDE Maintainers Cheat Sheet openSUSE:KDE meeting openSUSE:KDE Meeting 20150401 SDB:KDE Plasma 5 SDB:KDE repositories openSUSE:KDE repositories maintaining KDE3 Konsole KPDF Kupdateapplet KWallet Okular SDB:Reset Dolphin Places panel Archive:SDB: KDE 4.7 Sddm Retrieved from "https://en.opensuse.org/index.php?title=Portal:KDE&oldid=189554" Categories: Pages with RSS feedsPortalsKDEDesktop Environments'''
