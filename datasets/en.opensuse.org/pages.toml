["https://en.opensuse.org/Portal:Kernel"]
title = "Portal:Kernel - openSUSE Wiki"
full_description = 'Portal:Kernel Jump to: navigation, search Welcome to the Kernel Portal EditThe Linux Kernel is the central component of a Linux operating system like openSUSE. A Kernel manages hardware resources like CPU, memory and hard disks and provides abstractions that provide applications with a consistent view of these resources. Also, the Kernel provides drivers for devices attached to various system buses like USB, PCI, SATA and IDE. For a complete overview of Operating System Kernels see the Wikipedia article. Topics Edit Community Linux Mainline On a regular basis a "kernel.org Kernel" (or mainline) is released with a name like "Linux 2.6.32". These Kernels are developed by a community of developers and maintained by Linus Torvalds. For more information about this take a look at http://kernel.org. openSUSE Kernel At the beginning of a openSUSE development cycle the Kernel team takes a released "kernel.org Kernel" and adds a number of patches to increase stability and introduce new features. These patches are kept to a minimum and most all will eventually make it into the kernel.org Kernel. This Kernel is maintained in the Kernel git repository. Contribute The easiest way to contribute to the openSUSE Kernel is to submit a bugreport. Or you code with us and submit patches to our git repository. Communicate #opensuse-kernel on the freenode IRC network is the channel that the Kernel team uses for live chat. kernel@lists.opensuse.org - The openSUSE Kernel team has its own mailing list.Subscribe - Unsubscribe - Help - Archives kernel.opensuse.org - The openSUSE Kernel resources site. kernel-source commits EditFailed to load RSS feed from https://github.com/openSUSE/kernel-source/commits/master.atom: * HTTP request timed out. There was a problem during the HTTP request: 0 Error Navigation EditKernel articles: Kernel Kernel management Portal:Kernel openSUSE:Bugreport kernel SDB:HDMI Kernel openSUSE:Kernel git Kernel Module Packages openSUSE:Kernel of the day