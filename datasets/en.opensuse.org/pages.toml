["https://en.opensuse.org/Portal:Hackweek"]
title = "Portal:Hackweek - openSUSE Wiki"
full_description = '''Portal:Hackweek Jump to: navigation, search Hackweek edit One of the ways SUSE and its developers contribute to openSUSE is through Hackweek: – a week long sprint permitting developers to work on something entirely of their own design or wishes as long as it is FOSS-related. Started in 2007, it has become a regular part of SUSE’s development. See the Hack Week site. Hack Week 24 Hack Week 24 happened from November 18 - November 22, 2024 Hack Week 23 Hack Week 23 happened from November 6 - November 10, 2023 Hack Week 22 Hack Week 22 happened from January 30 - February 3, 2023 Hack Week 21 Hack Week 21 happened from June 27th - July 1st, 2022. Hack Week 20 Hack Week 20 happened from March 22nd to 26th, 2021. Hack Week 19 Hack Week 19 happened from February 10th to 14th, 2020. (Theme:"Simplify, Modernize & Accelerate") Hack Week 15 Hack Week 15 happened from February 21st to 27th, 2017. Check the List of projects people were working on. Hack Week 14 This Hack Week kicked off at the openSUSE Conference on June 24. It ran through the week June 27 - July 1, 2016. Hack Week 13 Dec. 7-11, 2015: Hack Week 12 April 13-17, 2015: https://news.opensuse.org/2015/04/10/next-week-is-hack-week/ Hack Week 11 Oct. 20-24 2014, at SUSE offices around the world, with other developers participating remotely: https://www.suse.com/company/press/2014/10/suse-to-host-hackweek-11.html Hack Week 10 Hack Week 10 took place: from October 7th to 11th 2013 in Nuremberg and Prague, on October 3rd and 4th and from 7th to 9th in Provo and Taipei, and from October 8th to 12th in Beijing Hack Week 9 Hack Week 9 took place from April 8th to 12th 2013. Official Website Press release by SUSE: https://www.suse.com/company/press/2013/3/suse-hack-week-nine-begins-april-eight.html Hack Week announcement in openSUSE News: https://news.opensuse.org/2013/03/26/hackweek-9-is-coming/ The Prague SUSE office held a Hack Week kickoff meeting combined with an openSUSE 12.3 Release Party on March 28th 2013, see these announcements for details: http://michal.hrusecky.net/2013/03/opensuse-12-3-release-party-v-praze/ (in Czech) http://michal.hrusecky.net/2013/03/plan-opensuse-12-3-release-party/ (in Czech) Hackweek VIII Hackweek VIII took place from July 23rd to 27th 2012. Jos Poortvliet wrote a blog post summarising the week. Hackweek VII Hackweek VII took place September 26th to 30th 2011. As usual, SUSE extended the invitation to openSUSE Community contributors. Unlike in the previous years, this year's motto was: "No Motto, do what you want, but do it!" Hackweek VII on blip.tv Like in previous years, we used openFATE to track your ideas and coordinate with others that might want to join a project. Make sure to check out the ideas listed in the Hackweek VII product category (as well as some good ones left over from Hackweek VI). During the week, we had a good-morning-catering in all participating locations. Enjoy! Browse for existing hackweek projects Create a new hackweek project Hackweek VI Hackweek VI took place January 24.-28., 2011. As usual, Novell extended the invitation to openSUSE Community contributors. Hackweek VI featured the theme "Engineering Cloud" and allows developers to get their hands on related projects. In order to support that approach, we are providing access to a few select cloud providers and a setup where you can deploy cloud infrastructure software (e.g. Eucalyptus). Your favorite hack-project may or may not relate to that theme, it may well be experimental, as long as it is Linux- or SUSE-related. Like in previous years, we used openFATE to track your ideas and coordinate with others that might want to join a project. Make sure to check out all ideas listed in the Hack Week VI product category. We also plan to nominate the 3 best projects that relates to the "Engineering Cloud" theme and hand out Amazon gift vouchers. For your project to be considered we ask you to: submit your idea until Fri, Jan 21st at openFATE (opens Jan, 13) provide a introductory video of your project on Mo, Jan, 24th wrap up and do a final video submission no later than Fri, Feb 4th Participating Novell locations also try to provide a "hackspace", some comfy place to meet, work together and snack. Finally, we are trying to spread the word via #hackweek6 on twitter and look forward to hear about your updates there. Following people will be at your assistance in the various locations: Nuernberg / Prague: Holger Sickenberg Beijing: Charles Wei Taiwan: Joey Lee USA: Olli Ries India: Nirav Kumar Please check in with us for all questions related to Hack Week VI, e.g. how to get a video of you and your project done or where to submit your project to be considered for an award. For those who are busy during this week, the suggested backup slot is Hackweek VI b) February 21.-25. Welcome to Hackweek V (June 7.-11, 2010) from news.opensuse.org: Novell is once again sponsoring a Hack Week. This is an opportunity for Novell’s Open Platform Solutions developers to use their Innovation Time Off and hunker down and work on the projects that catch their fancy. Hack Week projects can be new features, new applications, or improvements to existing services and applications. Previous Hack Weeks have generated projects like Tasque, Giver, Debian package support in the openSUSE Build Service, and many others. Hack Week is also a chance for Novell employees to work with the openSUSE Community contributors if they wish on projects that help improve openSUSE. You don’t have to be a Novell employee to participate! If you’d like to hack on something cool and useful, you’re welcome to join in! We’ll be collecting ideas in openFATE for Hack Week, so if you’d like to contribute an idea, just go to openFATE and log in with your openSUSE account. Then select “Create” and add your feature, as well as any test or use cases. If you’d like to help implement one of the ideas, check out the features that are already in openFATE for Hack Week V. Go to “Browse” and select Hack Week V as the Product, and you’ll see all of the proposed features for Hack Week. Have questions about Hack Week? Email Klaas or ask in #opensuse-project on Freenode. Hack Week II-IV Hack Week I Hack Week I was the week of June 25th, 2007. Selected project edit froxlor Server Management Panel by Andrej Semen http://www.froxlor.org/ https://features.opensuse.org/309567 Adapt and add Froxlor Server Management Panel to obs for opensuse and SLES and write how to doc as I did on previous hack weeks for syscp. Froxlor a fork of syscp and is manly developed on debian. By now there is only a tar file for instalaltion no rpm packages. Froxlor is a new web-based administration software for your needs. Developed by experienced server administrators and based on the system control panel SysCP this panel has its main focus on simplicity and usability. More Hackweek V projects Navigation edit Hack Week 9: Hackweek website Hack Week 7: Hackweek VII on openFATE Hackweek VII on blip.tv Hack Week 6: Hackweek VI on openFATE Hackweek VI on youtube Hack Week 5: Hackweek V Project collection Hackweek V on youtube Hackweek V on openFATE Juergen's slides, why he uses kdenlive Related Portals: Project Portal All portals: Portals Retrieved from "https://en.opensuse.org/index.php?title=Portal:Hackweek&oldid=52523" Categories: HackweekPortals'''
