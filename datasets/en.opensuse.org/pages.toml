["https://en.opensuse.org/Portal:Project"]
title = "Portal:Project - openSUSE Wiki"
full_description = '''Portal:Project Jump to: navigation, search Welcome to the Project Portal The openSUSE project is a worldwide effort that promotes the use of Linux everywhere. openSUSE creates one of the world's best Linux distributions, as well as a variety of tools, such as OBS, OpenQA, Kiwi, YaST, OSEM, working together in an open, transparent and friendly manner as part of the worldwide Free and Open Source Software community. The project is controlled by its community and relies on the contributions of individuals, working as testers, writers, translators, usability experts, artists and ambassadors or developers. The project embraces a wide variety of technology, people with different levels of expertise, speaking different languages and having different cultural backgrounds. Have a lot of fun... Topics Community The openSUSE community is guided by a common philosophy and organized into many teams that concentrate on different areas of interest within the project. The openSUSE Guiding principles describe the philosophy that guides openSUSE in all circumstances, irrespective of changes in goals, strategies or people. The openSUSE Board is the guardian of the Guiding Principles. They provide guidance, document decisions and act as a central point of contact within the community and between the Project's sponsors. openSUSE Members are acknowledged contributors who have brought a continued and substantial contribution to the project. They elect the openSUSE Board and can give their vote on other matters. There are numerous other Teams that lead different areas of the project. Each of the teams has their own way of working together. Check out their pages to understand how. Join the openSUSE community as a contributor! Find more about how to participate in openSUSE and make a difference in a Free Software project. The openSUSE community talks and communicates on chat.opensuse.org. There are other openSUSE communication channels to talk with the community. Media Stay up to date with openSUSE News. Follow openSUSE on Twitter or Facebook, maintained by our Social media contacts. Visit Planet openSUSE for an insight into the lives of members of the SUSE community, both the openSUSE and SUSE Linux Enterprise communities. Discover what they are working on and what makes them tick. Find openSUSE people near your own location on our openSUSE map. Watch video recordings of events and talks all around the world on openSUSETV. Events The openSUSE Conference is the annual conference of the openSUSE project. All contributors and interested people are invited to gather there and have a lot of fun. Hackweek is an event where openSUSE developers hack one week on projects they are interested in. Previous Hack Weeks have generated projects like Tasque, Giver, Debian package support in the openSUSE Build Service, and much more. The openSUSE project participates in a lot of other events all over the world. Check the event category to find out more. Friends The openSUSE Project has people all over the world attending conferences and supporting the development of the community. Friends is a list of partners, donors, communities, and conferences the openSUSE Project would like to acknowledge. Navigation Search project pages: Related portals: openSUSE Teams: Team pages Community Map See the live and zoomable map Communicate project@lists.opensuse.org - The project has its own mailinglist where topics that concern everybody are discussed.Subscribe - Unsubscribe - Help - Archives openSUSE Project on the Matrix network is a channel that the project uses for live chat. #opensuse-project on the Libera IRC network is a channel that the project uses for live chat. News Feb 28: AI hands out Windows keys, but Linux never had a lock— admin@opensuse.org (Douglas DeMaio) Feb 27: Tumbleweed Monthly Update - February 2025— admin@opensuse.org (Douglas DeMaio) Feb 20: Windows to Linux, Set Up Full Disk Encryption on openSUSE— admin@opensuse.org (Douglas DeMaio) Feb 18: Reproducible-openSUSE (RBOS) Project Hits Milestone— admin@opensuse.org (Douglas DeMaio) Feb 13: Tumbleweed Adopts SELinux as Default— admin@opensuse.org (Douglas DeMaio) Retrieved from "https://en.opensuse.org/index.php?title=Portal:Project&oldid=134314" Categories: Pages with RSS feedsPortals'''
