["https://en.opensuse.org/Portal:MySQL"]
title = "Portal:MySQL - openSUSE Wiki"
full_description = 'Portal:MySQL Jump to: navigation, search Welcome to the MySQL Portal edit SQL is the most popular database language in the world. MySQL is a client/server implementation that consists of a server daemon (mysqld) and many different client programs and libraries. It famously hosts some of the biggest databases in the world and is renowned for high performance. It is commonly used as a back-end for dynamic websites and constitute the M the LAMP stack (Linux Apache MySQL PHP). The main goals of MySQL are speed, robustness, and ease of use. MySQL was originally developed because the developers at TcX needed an SQL server that could handle very large databases an order of magnitude faster than what any database vendor could offer them. The official way to pronounce MySQL is "My Ess Que Ell" (Not MY-SEQUEL). Topics edit Variants Current openSUSE contains multiple variant of MySQL. All provides at the first sight similar functionality, but they differs in details and purpose. Default variant for openSUSE is MariaDB. MariaDB MariaDB is a branch of MySQL maintained by community in collaboration with Monty Program. It incorporates many improvements provided by community and more opensource storage engines. List of differences can be found on official site. MySQL Community Server If you are unsure and just want some MySQL, this is what you want. MySQL Community Server is opensource variant of MySQL server developed mainly by Oracle. Unstable versions If you are not satisfied with these three versions, you can use server:database:UNSTABLE repository, where are newest version always available including beta versions. External documentation MySQL Community Server documentation MariaDB Reference Manual MySQL Cluster Manual How to do... MySQL installation MySQL backup Switching between MySQL variants Navigation edit Related: MySQL SDB:LAMP setup SDB:Linux Apache MySQL PHP SDB:MySQL backup SDB:MySQL installation SDB:Switching between MySQL variants Retrieved from 