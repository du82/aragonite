["https://en.opensuse.org/Portal:GNOME"]
title = "Portal:GNOME - openSUSE Wiki"
full_description = '''Portal:GNOME Jump to: navigation, search The GNOME Portal EditGNOME 3 lets you get things done with ease, comfort and control. It sports a minimal and elegant design and all the software you need. You'll find web browsers, media players, file management, backup systems and much more. GNOME is free, open source and highly stable. It can run on multiple platforms and sports first-class internationalization and accessibility support. Topics Edit Explore GNOME Find information that help you enjoy GNOME comfortably. Take the official GNOME Tour See the GNOME3 in 30 seconds videos Check problem solutions, HOWTOs, guides about GNOME. Learn about the GNOME Software Repositories. Visit GNOME Documentation Library. Categories of support database. Software and Repositories Software can be installed from an online repository via the Software Management tool inside YaST application. However certain software can only be installed if the repository which contain them are added and specified in the list of such repositories on your system. Visit Package Repositories to get a list of more repositories. Get third-party package repositories from Additional Package Repositories. See how to Add Package Repositories. Get information on how to add GNOME Repositories. Search and install software packages from the openSUSE Build Service. Participate Come join us, help us and contribute to openSUSE. Learn how to report GNOME bugs. Help us to test GNOME packages for the next openSUSE release. See how to set up a GNOME development environment. Participate in the testing of the development version of openSUSE. Tell us about software you wish to be packaged or features you would like to have implemented. Expand this wiki with GNOME pages. Communicate Get in touch with us! Share your problems, express your views and more. Learn more about who's on the openSUSE:GNOME team. Participate in our meetings or chat with us on IRC in the #opensuse-gnome channel. gnome@lists.opensuse.