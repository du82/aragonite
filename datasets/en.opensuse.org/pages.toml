["https://en.opensuse.org/Portal:How_to_participate"]
title = "Portal:How to participate - openSUSE Wiki"
full_description = '''Portal:How to participate Jump to: navigation, search Welcome to the How to participate Portal EditWhether you're an experienced Linux developer or an end user just getting started with Linux, there are many ways for you to participate in the openSUSE project. Join a forum to get help or help others with openSUSE, find and report bugs, take over an issue from the release process, review the documentation, send your wish list for new packages and features, create and submit patches, or find other creative ways to contribute. Whatever you do, take a few minutes to discuss openSUSE with other users and become an active member of the openSUSE community. For most activities a login is needed to enjoy all the fun. You might wish to create a user page and share some useful information or interests about you with others. Here's a short guide how to do this. Participate Document Translate Develop Test Spread Lead Topics Edit Participate in openSUSE Everyone can be a part of openSUSE, even without technical skills. You don't have to be a programmer or packager. Being a part of the community just means you care about openSUSE! Be part of the openSUSE Community See where other openSUSE community members are located world-wide, get to know some People of openSUSE, find local openSUSE user groups, celebrate releases, learn about the governance structure, join the openSUSE Bar and more. Follow openSUSE news on our news site and see what our developers are up to on Planet openSUSE! Help us to release the next version of openSUSE For every release there is a set of tasks available. Some are complicated, some are easy to achieve, even for beginners. Look through the issues and tell someone from openSUSE if you found an adequate task. Discuss openSUSE and help other users There are several active communities where you can discuss what is going on in openSUSE and help out other openSUSE users. We have mailing lists, IRC channels and forums. Please have a look at the communication channels for an overview. Suggest New Features or Software New features are in most cases best requested upstream, see the Submitting Feature Requests page for more information. Spread the word Be sure to spread the word on openSUSE and help others to benefit from it too! openSUSE offers a great Linux distribution and many other technologies like our Open Build Service and SUSE Studio Express which can help home users as well as sys admins and developers to get work done and have fun. Blog about openSUSE, tell your friends and family and help them install it! Additional information: Community – Communicate – Teams Navigation EditParticipation pages: Participate Bug Day Junior jobs Known bugs 15.6 Known bugs 16.0 All portals: Portals Retrieved from "https://en.opensuse.org/index.php?title=Portal:How_to_participate&oldid=150308" Categories: PortalsParticipate'''
