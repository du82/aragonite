["https://en.opensuse.org/Portal:MATE"]
title = "Portal:MATE - openSUSE Wiki"
full_description = '''Portal:MATE Jump to: navigation, search Welcome to the MATE Desktop Portal Edit The MATE Desktop provides an intuitive and attractive classic desktop experience for openSUSE users. The name MATE comes from yerba maté, a species of holly native from subtropical South America. Its leaves contain caffeine and are used to make infusions and a beverage called maté. For more information, you can check MATE Desktop official web page. The MATE Desktop is maintained on OBS in X11:MATE:Factory and provides a rolling release repository in X11:MATE. The first official community release was MATE 1.6. openSUSE Installation Edit X11:MATE The openSUSE MATE team is proud to announce the availability of MATE 1.10.2 for openSUSE. Here is how to install it on openSUSE 13.2. We have changed our schema of repositories to avoid people having to change their repositories for each update. Now there is just one place: X11:MATE:Current . To install MATE through X11:MATE:Current, please replace or add our repository (check how to add the repository). Add repository via the command and click on the icon to use the one click install files: SUSE Linux Enterprise 12: MATE Core – MATE Desktop Environment – MATE Desktop Environment Extra openSUSE Leap and Tumbleweed:sudo zypper in patterns-mate-mate Contributors Edit Contributions X11:MATE packages – package submissions in X11:MATE:Factory and X11:MATE:Next are accepted for review and fixes; bug reports, fixes and code – upstream repositories and bugtracker, openSUSE bugtracker. Translate You can translate MATE using Transifex. Mailing list for translators is located at http://ml.mate-desktop.org/listinfo/mate-i18n. Everything you need to know about translation is in MATE wiki. Things to Do Edit TASKS Warning: TASKS - available tasks and status; takers feel free to edit and follow the current style! General Portal:MATE - keep updated Efstathios Iosifidis OBS Repositories' - maintain and review Desktop Screenshots More... Repositories Edit X11:MATE:Current Team Edit Benjamin Denisart Alexei Sorokin Stefano Karapetsas Johann Luce Hillwood Yang Efstathios Iosifidis (Wiki, social media) Ish Sookun (Social media) Vennos Alexandros Contact Edit Connect Twitter: @opensuse_mate Facebook Page Forum openSUSE-MATE mailing list IRC channel #opensuse-mate at FreeNode Marketing Edit openSUSE Conference 2013 Video of the presentation Presentation File Navigation EditAll of MATE: MATE Portal:MATE Retrieved from "https://en.opensuse.org/index.php?title=Portal:MATE&oldid=189695" Categories: PortalsMATEDesktop Environments'''
