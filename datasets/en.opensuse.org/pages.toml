["https://en.opensuse.org/Portal:Packaging"]
title = "Portal:Packaging - openSUSE Wiki"
full_description = '''Portal:Packaging Jump to: navigation, search Welcome to the Packaging Portal EditPackaging is the task of building and bundling software with meta data such as the software's full name, description, a list of dependencies necessary for the software to run properly and the like. This is done so users of the software can use a package manager to conveniently install, remove or upgrade the software they use. Typical GNU/Linux distributions consist solely out of hundreds of such packages and openSUSE is no different in this regard. This makes Packaging the bread and butter development jobs for a distribution with tasks varying from writing a build description to fixing bugs in the software's source code. Topics Edit Packaging Rules Packaging mostly happens for the openSUSE distribution. The distribution tries to form a coherent product out of the vast mosaic of open source projects. Packaging is the means to form the projects and therefore packaging for the openSUSE distribution has a lot of rules. We adhere to the general Linux Standard Base (LSB) that tries to reduce the differences between individual Linux distributions. We also follow the Linux Filesystem Hierarchy Standard (FHS) which is a reference on how to manage a Linux filesystem hierarchy. Additional to these general rules every Linux distribution follows, openSUSE has its own set of Packaging guidelines which regulate all the nitty gritty details of packaging for the distribution. The article How to contribute to Factory contains tutorials and guidelines to get involved into the distribution development, for example how to fix problems in existing packages or how to add new packages to the distribution. For the above process you can become bugowner, maintainer, or project maintainer for various projects/packages in Open Build Service. The Package maintainership guide describes how to behave in such role. Packaging Help There are two very extensive guides for the RPM and Dpkg package formats that will give you an introduction. The RPM Packaging Guide and the Debian New Maintainers' Guide. We will not try to duplicate them but concentrate on the openSUSE tools and workflows which means all our documentation expects that you know your way around the package formats. For a general guide about packaging and to find useful tools and workflows we recommend the Awesome Package Maintainer guide. All packaging happens in the openSUSE Open Build Service instance, our open and complete distribution development platform. Therefore the most important piece of documentation for you as a packager is the Build Service Tutorial. Its very RPM centric so we have another document describing Debian builds. You can also have a look at the Tips and Tricks and, if you are interested to build for more than one distribution, at the Cross Distribution Howto. The process of publishing fixed packages for already released products is covered in the Maintenance Portal. Communicate #packaging:opensuse.org (Matrix) #opensuse-packaging (Libera.Chat) packaging@lists.opensuse.org - is the mailinglist to discuss packaging.Subscribe - Unsubscribe - Help - Archives New Package Commits in the Build Service EditFailed to load RSS feed from https://build.opensuse.org/main/latest_updates.rss: * Error fetching URL: Failed to connect to build.opensuse.org port 443 after 0 ms: Couldn't connect to server There was a problem during the HTTP request: 0 Error Search EditSearch packaging: Navigation Edit Packaging KDE packaging Packaging documentation Build Service AppImage builds Build Service Concept SourceService Build Service cross distribution howto Build Service Debian builds Build Service Tips and Tricks Build Service Tutorial Build system recipes Bundled software policy Create a patch file Creating a changes file (RPM) Fedora packaging GNOME packaging howto GNOME repositories Julia KDE Patch Annotation Policy Mvyskocil/Shared library packaging policy Package Conditional Build Dependencies Package description guidelines Package group guidelines Package maintainership guide Package naming guidelines Package security guidelines Package source verification Package versioning guidelines Packaging Bazel Packaging Branding Packaging Bundler Packaging checks Packaging Conventions RPM Macros Packaging Electron Packaging Erlang Packaging Fonts Packaging for transactional-updates Packaging Games Packaging Go Packaging guidelines Packaging guidelines change process Packaging Haskell Packaging init scripts Packaging Java Packaging Lisp Packaging Lua Packaging Multiple Version guidelines Packaging nodejs Packaging Patches guidelines Packaging Perl Packaging PHP Packaging PyQt and SIP Packaging Python Packaging R Packaging Ruby Packaging Rust Software Packaging Rustlang Packaging scriptlet snippets Packaging vdr Packaging wxWidgets Packaging XML Schemas and Stylesheets Packaging/Users And Groups Patches Guidelines for X11:XOrg Project RPM conditional builds Ruby Gem Strategies Rust Science HPC Packaging Shared library packaging policy SourceUrls Specfile pseudotags Systemd packaging guidelines Upstream Tracker Zig Retrieved from "https://en.opensuse.org/index.php?title=Portal:Packaging&oldid=150246" Categories: PortalsDistribution'''
