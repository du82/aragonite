["https://en.opensuse.org/Portal:Pantheon"]
title = "Portal:Pantheon - openSUSE Wiki"
full_description = '''Portal:Pantheon Jump to: navigation, search What is Pantheon?The Pantheon shell is the main desktop component of the Elementary project. It is deeply integrated with other applications like the dock called Plank, the top panel Wingpanel, application launcher Slingshot and comes with its own window manager Gala, which is based on Mutter. The traditional Unix like substitutability of components is sacrificed by a design philosophy that streamlines the user interface for better global aesthetics and out-of-the-box experience inspired by popular proprietary desktops. To do that, the Elementary project enhances the Gtk+ libraries with its own extensions for improved usability and a unique design. It also comes with its own set of programs that all adhere to the visual guidelines like: text editor, file browser, terminal emulator, desktop calendar, e-Mail client, software gallery, video player, audio player and etc. To simplify application creation designed for Elementary, an application development framework (Granite) was created. The preferred programming language is Vala. elementary apps - 3rd party elementary software Installation Warning: The packaging of the elementary project for openSUSE is still in early experimental stages. At this time we are looking for new Pantheon maintainers! Currently, there are two branches of repositories: experimental and stable. The stable branch is only available for Tumbleweed. Adding the stable Pantheon branch repository for Tumbleweed: sudo zypper ar -f https://download.opensuse.org/repositories/X11:/Pantheon:/Branch/openSUSE_Tumbleweed/ Pantheon_stable Installing Pantheon desktop: sudo zypper install patterns-pantheon-pantheon Now you can choose Pantheon as desktop environment at your login screen. Warning: The experimental branch is not recommended for new users nor is it recommended for use as a daily driver. There is constant development being done here. This means you WILL encounter bugs, some of which can result in a broken system. In order to use the experimental branch, you need to have the Gnome:Next repository including dependend factory repositories enabled. Read the requirements and instructions to add the Gnome:Next repository! Don't skip this step or you won't be able to use the experimental branch! Adding the experimental Pantheon branch repository for Tumbleweed: sudo zypper ar -f https://download.opensuse.org/repositories/X11:/Pantheon/openSUSE_Factory/ Pantheon_experimental Live ImagesCurrently no working Live ISOs, See above Screenshots Default desktop More pictures... RepositoriesDevelopment is done in in the following projects on OBS:X11:PantheonX11:Pantheon:BranchX11:Pantheon:Next TeamEveryone is welcome to join the team! ContactWant to contribute to openSUSE, Pantheon or other projects? Join us on Matrix! Navigation Elementary Pantheon Pantheon/Installation Pantheon/Live Retrieved from "https://en.opensuse.org/index.php?title=Portal:Pantheon&oldid=189701" Categories: ElementaryPortalsDesktop Environments'''
