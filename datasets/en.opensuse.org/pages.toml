["https://en.opensuse.org/Portal:Development"]
title = "Portal:Development - openSUSE Wiki"
full_description = 'Portal:Development Jump to: navigation, search Welcome to the Development Portal EditopenSUSE is a free and open source project with lots of sub-projects and software development happens in all of them. The most prominent sub-project would be the openSUSE distribution which consists of around 3500 applications, libraries and utilities. All of them are cared-for by openSUSE Package Maintainers who integrate, polish, update and maintain them. Maintaining packages is the bread and butter development task that is done in the openSUSE project. Nearly everybody who somehow develops has at least one package he maintains in the openSUSE distribution. All of this happens in the openSUSE instance of the Open Build Service which is an open and complete distribution development platform that provides infrastructure for package maintenance and more. Some of those packages contain applications, libraries or utilities that are openSUSE sub-projects by themselves. The most prominent here would be YaST - our powerful installation and system management tool. These are the projects were you will find software development in its more traditional form. A source code management (SCM) system like svn or git where developers contribute code to. A relatively new, but growing, area of development is creating customized distributions. Your software and everything it needs, in one appliance. Demo CDs, perfect for tradeshows and hand-outs. A custom distro, with your own software and branding or Virtual machines, for the data center and the desktop. The base of these efforts is a Tool called KIWI which is an operating system image solution based on XML descriptions of distributions. Topics Edit Packaging Packaging portal Packaging guidelines Creating patches Packaging in the openSUSE Build Service Cross Distribution packaging Contributing to openSUSE Factory Hacking YaST the powerful installation and system management tool Libzypp / Zypper the software management engine Build Service the distribution development platform openFATE the feature management system Hermes the personal message dispatching system Snapper the ultimate snapshot tool for linux KDE the desktop environment based on Qt GNOME the free desktop manager based on GTK+ Xfce the lightweight X11 desktop environment based on GTK+ Distribution creation The openSUSE Build Service and SUSE Studio provide everything you need to create a customized distribution. How to create an openSUSE based distribution by hand (it is easier to use studio or OBS!) Image creation in the openSUSE Build Service SUSE Studio quick tour Start your own openSUSE project! In the News Edit Developer News from news.opensuse.org: Failed to load RSS feed from https://news.opensuse.org/feed/: Error parsing XML for RSS How to Contribute EditThe following links are entry points for people that would like to start contributing to the openSUSE project. This page mainly focuses on developers, but there are many other ways to get involved. Areas of participating in the openSUSE development Junior jobs are easy tasks to introduce you to the development. If there are any questions, please contact us and we will help you :-) Tools EditThese are the tools we use to collaborate and organize our efforts efficiently: Bugzilla Bug tracking openSUSE Build Service AMQP Event Message Bus Mailing lists IRC Forums Tools EditRelated portals: Portal:Factory The Factory distribution Portal:Factory contribution Contribute to Factory Portal:How to participate How to join the project Portal:Project All about the openSUSE project Portal:Packaging Creating packages Portal:Build Service The Open Build Service Portal:Distribution The openSUSE distribution Portal:Documentation Portal:Hackweek Developers hacking on new ideas All portals: Portals Retrieved from "https://en.opensuse.org/index.php?title=Portal:Development&oldid=150230" Categories: PortalsDevelopment'
