["https://en.opensuse.org/Portal:15.6"]
title = "Portal:15.6 - openSUSE Wiki"
full_description = 'Portal:15.6 Jump to: navigation, search openSUSE 15.6 Release information Leap 15.6 was released on June 12, 2024. For details, check the packaging information and the Roadmap. openSUSE Leap 15.6 offers professional users, entrepreneurs and ISVs (Independent Software Vendors) updated support for modern hardware with better YaST functionality, including an improved installer. Users can expect 18th months (12 + 6) of support. Feature highlights openSUSE Leap 15.6 is... For a detailed overview of changes and enhancements introduced with openSUSE Leap 15.6, please visit Features_15.6. Software Craftsmanship Previous versions of openSUSE Leap maintained close alignment with SUSE Linux Enterprise, yet different build configurations resulted in varying feature sets across these distributions. openSUSE Leap 15.6 builds upon these foundations, unifying feature sets and constructing openSUSE Leap using binary packages from SUSE Linux Enterprise 15 SP6. This release ensures openSUSE Leap 15.6 and SUSE Linux Enterprise 15 SP6 are fully binary identical. Seamless migration The seamless migration experience from Leap to SUSE Linux Enterprise Server remains instantaneous. The pattern changes required for migrating to SUSE Linux Enterprise are straightforward. Should openSUSE Leap users need to migrate, they can do so with confidence in the smooth transition to enterprise support. Artificial Intelligence Many Artificial Intelligence packages are available in Leap 15.6. PyTorch: Made for both server and compute resources, this machine learning library accelerates power users’ ability to prototype a project and move it to a production deployment. ONNX: An open format built to represent machine learning models, provides interoperability in the AI tool space. It enables AI developers to use models with a variety of frameworks, tools, runtimes, and compilers. For Users KDE Plasma 5.27.11 LTS is included in Leap 15.6 as a long-term support release from the KDE Plasma team. This version offers significant improvements, including a Konqi welcome wizard for newcomers and a new tiling system that allows users to set up custom tile layouts and resize adjacent tiled windows simultaneously. Activate this feature in System Settings > Workspace Behavior > Desktop Effects. GNOME Leap 15.6 offers GNOME 45, the result of six months of development by the GNOME project. This release includes significant improvements, new features, and enhancements such as an improved Software app, new multitasking settings, and enhanced power management. Developers will benefit from a new developer documentation website, an updated Human Interface Guidelines version, new features in the Builder IDE, GTK 4 enhancements, and more. Xfce The Xfce Desktop in Leap 15.6 is version 4.18, which introduces major features like the XfceFilenameInput widget for filename validation and error feedback, and the Generic Shortcut Editor widget, now used in Thunar, Xfce Terminal, and Mousepad. Education, Research and Health Leap supports the health, science, research, and developer communities with packages like GNU Health for hospital operations and patient data collection, and QGIS for geospatial information management. Newly maintained packages like Grafana and Prometheus expand possibilities for analytical experts, offering powerful tools for interactive visual analytics and data modeling with Graphite, Elastic, and Prometheus. Internationalization This release uses Weblate for coordinating openSUSE translations into over 50 languages. The Weblate interface allows both dedicated translators and casual contributors to participate, enhancing collaboration between community and enterprise translations for SUSE Linux Enterprise. Read more... In detail Discover Feature list · Technical overview of the updates and changes in openSUSE Leap Hardware requirements · What it takes to run Leap Release notes · Important last-minute changes to the release In the press | Reception · See what the press has to say about this release Documentation Installation and Upgrade · Learn about installing openSUSE in various ways Most annoying bugs · Find out about known issues and common problems Manuals · Read or download the latest edition of the openSUSE books Help out · File a Bugreport Spread Go wild! · Meet up with the openSUSE Community and celebrate the release Buttons and banners · Sticker the world! Presentations · Spread the word Contribute to Leap Report Bugs for Leap Learn how to contribute to packages in Leap Learn how to translate Leap and contribute to localization DistributionsEdit Rolling releaseTumbleweed rolling Slowroll releaseSlowroll beta Immutable server releasesMicroOS server Leap Micro server Immutable desktop releasesAeon beta Kalpa alpha PreAlpha regular releaseLeap 16.0 pre-alpha Latest regular releaseLeap 15.6 stable Old regular releaseLeap 15.5 old stable More about derivatives Screenshots Portal:15.6/Screenshots/3 More pictures... Retrieved from "https://en.opensuse.org/index.php?title=Portal:15.6&oldid=186905" Categories: 15.6PortalsLeap'
