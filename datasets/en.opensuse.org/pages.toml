["https://en.opensuse.org/Portal:Factory"]
title = "Portal:Factory - openSUSE Wiki"
full_description = '''Portal:Factory Jump to: navigation, search Welcome to the Factory Portal Edit The Factory project is the rolling development codebase for openSUSE Tumbleweed. There is a constant flow of packages going into Factory. There is no freeze; therefore, the Factory repository is not guaranteed to be fully stable and is not made available to download by humans. The core system packages receive automated testing via openQA. When automated testing is completed and the repo is in a consistent state, the repo is synced to the download mirrors and published as openSUSE Tumbleweed. That usually happens several times a week. Factory is mainly used as an internal term for openSUSE's distribution developers, and the target project for all contributions to openSUSE's main codebase. Power users, developers, and openSUSE contributors are recommended to use the Tumbleweed rolling release. Conservative users who just need a working system ("if it ain't broke, don't fix it") are advised to stay with the Leap stable release. Topics Edit About Factory Learn how factory is developed The Release Process details how Factory becomes the next release. The openSUSE release schedule Factory is maintained by the openSUSE Release Team Contribute to Factory Learn how to report bugs on Factory Learn how to contribute to packages in Factory DOs & DON'Ts for Factory Developers Factory Dashboard Staging Dashboard Factory Build Failures Automated QA report Communicate EditDevelopment discussions happen on the openSUSE mailing lists, in Bugzilla and on IRC (#opensuse-factory). The most important mailing lists to follow Factory development are: factory@lists.opensuse.org - This is the list for technical discussions related to the development of the openSUSE Distributions..Subscribe - Unsubscribe - Help - Archives packaging@lists.opensuse.org - RPM packaging-oriented mailing list.Subscribe - Unsubscribe - Help - Archives Besides those many more mailing lists for specific topics and development projects exist. DistributionsEdit Rolling releaseTumbleweed rolling Slowroll releaseSlowroll beta Immutable server releasesMicroOS server Leap Micro server Immutable desktop releasesAeon beta Kalpa alpha PreAlpha regular releaseLeap 16.0 pre-alpha Latest regular releaseLeap 15.6 stable Old regular releaseLeap 15.5 old stable More about derivatives Navigation EditPortal:Development All about development with openSUSE Portal:How to participate How to join the project Portal:Packaging Creating packages Portal:Build Service The Build Service All portals: Portals Retrieved from "https://en.opensuse.org/index.php?title=Portal:Factory&oldid=154353" Categories: PortalsFactoryDistribution'''
