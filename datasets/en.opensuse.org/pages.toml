["https://en.opensuse.org/Portal:Conference"]
title = "Portal:Conference - openSUSE Wiki"
full_description = '''Portal:Conference Jump to: navigation, search openSUSE Conference edit The openSUSE Conference 2024 was held as a hybrid event at Z-Bau in Nuremberg and Online June 27 - 29, 2024. https://events.opensuse.org/conferences/oSC24 The openSUSE Conference 2023 was held as a hybrid event at Z-Bau in Nuremberg and Online May 26 - 28, 2023. https://events.opensuse.org/conferences/oSC23 The openSUSE Conference 2022 was held as a hybrid event at Z-Bau in Nuremberg and Online June 2 - 4, 2022. https://events.opensuse.org/conferences/oSC22 The openSUSE Virtual Conference 2021 took place from June 18 - 20, 2021, online. The COVID pandemic did not allow for a physical conference. The openSUSE + LibreOffice Conference 2020 (oSLO twitter#oSLO2020) was October 15 - 17, 2020 and took place online. It was originally scheduled to take place at the Z-Bau in Nuremberg, Germany, but the COVID pandemic did not allow for a physical conference. The openSUSE Conference oSC19 (oSC19 twitter#oSC19) took place in May 24 - 26, 2019 at the Z-Bau in Nuremberg, Germany. Find the recorded videos here: Youtube/openSUSEtv/oSC19 The openSUSE Conference 2018 (oSC18 twitter#oSC18) took place in May 25 - 27, 2018 at the the Faculty of Information Technologies of Czech Technical University in Prague, Czech Republic. Find the recorded videos here: Youtube/openSUSEtv/oSC18 The openSUSE Conference 2017 (oSC17 twitter#oSC17) took place in May 26 - 28, 2017 at the Z-Bau in Nuremberg, Germany. Find the recorded videos here: Youtube/openSUSEtv/oSC17 The openSUSE Conference 2016 (oSC16 twitter#oSC16) took place in June 22 - 26, 2016 at the Z-Bau in Nuremberg, Germany. Find the recorded videos here: Youtube/openSUSEtv/oSC16. The openSUSE Conference 2015 (oSC15 twitter#oSC15) took place in May 1 – 4, 2015 in the beautiful city of The Hague, The Netherlands. Find the recorded videos here: Youtube/openSUSEtv/oSC15 oSC15 brought together a wide variety of Free and Open Source contributors to collaborate on one of the major Linux distribution projects. In exciting talks, workshops and social events we bring alive the openSUSE slogan "Have a lot of fun". Find out about more on the conference website. In the news edit Portal:Conference/News More news... Code of Conduct edit It is important for the openSUSE Conference Team to create an environment where everyone feels accepted and welcome. We expect all our visitors to behave according to our Code of Conduct and will take decisive action against any inappropriate behavior. See also the openSUSE Guiding Principles Sponsors edit The openSUSE Conference would not be possible without our sponsors. The openSUSE community is a global community contributing to the openSUSE project in an effort to promote the use of openSUSE, Linux, and FOSS worldwide. Development in all areas relies on voluntary contributions. Friendly interaction and open collaboration is encouraged in an environment of cooperation, across cultural backgrounds and different levels of expertise, where innovation flourishes and the boundaries of FOSS are expanded. The openSUSE conference is the annual openSUSE community event that brings people from around the world together to meet and collaborate. The organized talks, workshops, and BoF sessions provide a framework around more casual meet ups and hack sessions. A party here and there provides the time to relax and have fun, making connections on a more personal level. Great reasons to sponsor the openSUSE Conference The event is organized by volunteers, who dedicate their time and effort to create one of the outstanding FOSS events of 2024, promoting collaboration and presenting new technologies. All sponsors funds are used for the conference. As a sponsor you enable the content to be free of charge for everyone. Enable those contributors with financial constraints to attend the event through openSUSE Travel Support Program in the future. Gain visibility to people involved and interested in information technology and FOSS. Financial support for the openSUSE conference from sponsors is invaluable and crucial for the success of the event. While the countless hours extended by volunteers to orchestrate the event provide the atmosphere and framework for the conference, commercial sponsorship provides the necessary financial backing. The financial support by our sponsors allows us to allocate funds for the venue, create marketing material, secure keynote speakers, and assist those that contribute to openSUSE but with some financial constraints to attend the conference. That aside, sponsors can participate in the Conference by having a booth, and help organize social events to increase both the conference atmosphere and visibility, as well as their own. Sponsorship Package View the sponsorship prospectus here. We offer partnership options to enhance the conference atmosphere. As a sponsor, your logo and name will be connected to the conference and be placed on the event's web page, among other items viewable at the conference. Depending on the partnership options, the costs range from 500 to 4500 USD. Financial and support needs for the openSUSE conference from sponsors is invaluable and crucial to the success of the event. Commercial sponsorship provides the necessary financial backing for the countless hours volunteers give to orchestrate the event, which enhances the atmosphere and framework of the conference, . Additional arrangements are always possible and we look forward to discuss options that meet your specific needs. View the sponsorship prospectus. Funds for the sponsorship of the openSUSE Conference are processed through the Geeko Foundation. For questions contact: Local contact Douglas DeMaio openSUSE Conference 2024 ddemaio at opensuse.org +49 173 587 6923 All of Conference edit Osc11 session notes Conference Conference BoF Conference code of conduct Conference FAQ Conference FAQ 2013 Conference FAQ 2015 Conference FAQ 2017 Conference How to Conference How to bid Conference How to Check List Conference meeting Conference Planning 2011 Meeting 20110421 Conference promotion todo list Conference Schedule 2011 Conference speaker guidelines Conference travelpool Conference venue requirements PosterSC19 Retrieved from "https://en.opensuse.org/index.php?title=Portal:Conference&oldid=121780" Categories: PortalsConference'''
year_published = 2025
clearnet = "https://en.opensuse.org/Portal:Conference"
tags = ["code", "conduct", "conference", "conference.", "edit", "event", "financial", "find", "great", "guiding"]
