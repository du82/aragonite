["https://en.opensuse.org/Portal:Education"]
title = "Portal:Education - openSUSE Wiki"
full_description = 'Portal:Education Jump to: navigation, search openSUSE-Education is discontinued for now Welcome to the old Education Portal edit With budgets shrinking, more and more schools are evaluating Linux as a cost-effective alternative to build PC networks in a way that will be "ready for the future of education" and as more and more "home users" find out, that their children need a PC (and good PC knowledge) to have a stake in the future, Linux becomes more and more useful. The openSUSE Education project tried to support schools using openSUSE. We created and described additional software-packages for educational projects and we have created a live DVD from the regular openSUSE distribution. As you can see in our timeline, we achieved quite a lot in the past years, had fun and meet a couple of very nice people out there in our spare time. But the main team members moved on to new projects, with the hope that we would one day find some time to work more on openSUSE-Education again. This does not seem to happen – at least not for the foreseeable future. While we currently still spend a lot of time to get over 460 packages in the Education project in the Open Build Service up to date and building, we could not find any volunteer to take over the maintenance of our webpage, the hosting of additional repositories, someone who helps users with questions in the forum or even someone who wants to create the next Li-f-e or add-on media. We could of course leave everything as it is right now and call it good enough. But we don’t think that would be fair to our users who are expecting a well thought through environment for educational activities where all details have been taken care of and maintenance and support in any form are available for them. While we still work on the packages in the Education repository, based on our time, new contributors are absolutely welcome to take over the openSUSE-Education project and shape it to their liking. The old guard will be happy to assist the new volunteers wherever needed and possible. It has been a fun ride for all of us and we very much hope that this won’t be the end of openSUSE-Education but instead a new beginning for this great project. Old Topics edit Discover Education openSUSE:Education-Li-f-e Linux Terminal Server Project with kiwi Education repositories Development Submit Bugs (use "Product: openSUSE.org"; "Component:3rd party software" and start the summary with "Education: ", please) Submit Features openSUSE:Education-Li-f-e roadmap Development hosted on Sourceforge.net Communicate openSUSE:Education team openSUSE:Education meeting Education Forum #opensuse-edu IRC Channel edu@lists.opensuse.org - Education Mailinglist.Subscribe - Unsubscribe - Help - Archives All of Education edit Education openSUSE:Education meeting Archive:Education-Li-f-e openSUSE:Education-Li-f-e roadmap SDB:KIWI-LTSP quick start SDB:LTSP quick start 11.4 Edu SDB:LTSP quick start 12.1 Edu Screenshots Welcome screen More pictures... Browse Applications edit Applications:Education In the news edit In the Press Test driving the openSUSE Education distribution Our Blog Our timeline More news... Retrieved from "https://en.opensuse.org/index.php?title=Portal:Education&oldid=126412" Category: Portals'
