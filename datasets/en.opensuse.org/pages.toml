["https://en.opensuse.org/Portal:Distribution"]
title = "Portal:Distribution - openSUSE Wiki"
full_description = '''Portal:Distribution Jump to: navigation, search Welcome to the Distribution Portal EditThe openSUSE distributions are stable, easy to use and complete multi-purpose distributions. They are aimed towards users and developers working on the desktop or server. They are great for beginners, experienced users and ultra geeks alike, in short, they are perfect for everybody! The latest release, openSUSE Leap 15.6, based on SUSE Linux Enterprise, features new and massively improved versions of all useful server and desktop applications. It comes with more than 1,000 open source applications. openSUSE Tumbleweed is the rolling release, providing the latest upstream software releases, yet only those packages that pass testing. Tumbleweed is also the base for SUSE's award-winning SUSE Linux Enterprise products. What features does openSUSE offer you? Edit Full desktop operating system openSUSE has everything you need for your work and play. Browse the web, send email, socialize online, play games, write documents, and much more; all free. Full office suite included Use LibreOffice to create professional-looking documents, spreadsheets, presentations and more. With LibreOffice, you can work on office documents created with other office suites. Enjoy your Internet experience, worry-free Forget worrying about viruses and spyware with openSUSE's trusted software repositories. The Firefox web browser is included with all openSUSE distributions, with alerts for known phishing websites protecting you from scams and identity thieves. Have fun with media Whether you're playing the latest chart-topping song, replaying your childhood memories or touching up that sunset landscape, openSUSE has you covered. Play your music, podcasts and videos with Dragon Player and Amarok. Organize, edit and share your photos with GIMP and digiKam. Make new photos and fool around with you and your friends with Cheese. Keeps up with you, wherever you're going openSUSE works great on laptops and tablets, so you don't have to be tied down to be working or having fun with openSUSE! Simply change Are you coming from another operating system and want to be free with Linux? openSUSE works with many of your favorite applications, and there are tons of application equivalents to try out. We back you up openSUSE products are backed with free software updates for 18 months after release. The openSUSE community is also helpful and ready if you have any questions or problems with openSUSE. Full and accurate source code openSUSE products allow you to retrieve the exact source code of each distributed binary package. The complete sources for openSUSE products are available online — see Source code for more information. Topics Edit Learn about your openSUSE computer Documentation Access the documentation of openSUSE. Support Get help with openSUSE. Communicate Communicate with other openSUSE users. Artwork View screenshots of openSUSE and access official artwork. Project Learn more about the openSUSE Project and the people behind it. In the News Edit In the news: Feb 28: AI hands out Windows keys, but Linux never had a lock— admin@opensuse.org (Douglas DeMaio) Feb 27: Tumbleweed Monthly Update - February 2025— admin@opensuse.org (Douglas DeMaio) Feb 20: Windows to Linux, Set Up Full Disk Encryption on openSUSE— admin@opensuse.org (Douglas DeMaio) Feb 18: Reproducible-openSUSE (RBOS) Project Hits Milestone— admin@opensuse.org (Douglas DeMaio) Feb 13: Tumbleweed Adopts SELinux as Default— admin@opensuse.org (Douglas DeMaio) More news... DistributionsEdit Rolling releaseTumbleweed rolling Slowroll releaseSlowroll beta Immutable server releasesMicroOS server Leap Micro server Immutable desktop releasesAeon beta Kalpa alpha PreAlpha regular releaseLeap 16.0 pre-alpha Latest regular releaseLeap 15.6 stable Old regular releaseLeap 15.5 old stable More about derivatives Applications EditBrowse applications: Application equivalents Applications Baloo DisplayCAL DotNet E