["https://en.opensuse.org/Portal:Libzypp"]
title = "Portal:Libzypp - openSUSE Wiki"
full_description = '''Portal:Libzypp Jump to: navigation, search Welcome to the Libzypp Portal edit ZYpp is a Linux software management engine that powers products like YaST and Zypper with a powerful dependency resolver and a convenient package management API. It is an open-source project. Features edit Built on top of SAT solver which makes libzypp fast, light and with a simple and powerful dependency solving algorithm. Supports rpm-md, YaST2 metadata and Novell Update, and plain directories as repository types. Stores known repositories in .repo files compatible with YUM. Powers the awesome package management tool Zypper. Supports Metalink for reliable downloads. Supports signed repositories, delta packages, package updates. ... read more History edit Following its consecutive acquisitions of Ximian and SuSE GmbH in 2003, Novell decided to merge both package management systems YaST package manager and Red Carpet in a best of breed approach, as the two solutions so far were used at Novell. Looking at the existing open source tools and their maturity available back in 2005, none of those fulfilled the requirements and were able to work smoothly with the existing Linux management infrastructure software developed by Ximian and SUSE, so it was decided to get the best ideas from existing pieces and to work on a new implementation: Libzypp. ... read more Packages edit Libzypp RPM packages are available on standard openSUSE installation media and online repositories. In general it is not necessary to install the packages manually.If needed you can download and install Libzypp from software.opensuse.org. Development edit General information Source code Libzypp's source code is maintained in a GIT repository at Github. You can get the most recent copy of libzypp with the following command: git clone git://github.com/openSUSE/libzypp.git This will create a local copy of the repository in a directory named libzypp in your current working directory. Contacting developers You can reach libzypp developers on the #zypp IRC channel at irc.freenode.net (look for jniq, duncanmv, mvidner, or jreidinger) zypp-devel@lists.opensuse.org - And on the Zypp Development mailinglist.Subscribe - Unsubscribe - Help - Archives ... read more General documentation Introduction | Features | SAT Solver | Supported URLs | Lockfile | History | Plugins Developer Documentation Version: HEAD Developer Documentation Version: 13.1 Developer Documentation Version: 12.3 Developer Documentation Version: 12.2 Developer Documentation Version: 12.1 Developer Documentation Version: 11.4 Developer Documentation Version: 11.3 Developer Documentation Version: 11.2 Developer Documentation Additional information Roadmap Navigation edit All of Libzypp: Zypper Inst-source-utils Portal:Libzypp openSUSE:Libzypp API openSUSE:Libzypp application layer openSUSE:Libzypp building Archive:Libzypp design openSUSE:Libzypp development openSUSE:Libzypp download source openSUSE:Libzypp features openSUSE:Libzypp history openSUSE:Libzypp introduction openSUSE:Libzypp locks file openSUSE:Libzypp metadata signature openSUSE:Libzypp plugins openSUSE:Libzypp repo identifiaction openSUSE:Libzypp satsolver openSUSE:Libzypp satsolver basics openSUSE:Libzypp satsolver internals Portal:Libzypp/Development openSUSE:Libzypp mailing lists Retrieved from "https://en.opensuse.org/index.php?title=Portal:Libzypp&oldid=73437" Categories: LibzyppPortals'''
