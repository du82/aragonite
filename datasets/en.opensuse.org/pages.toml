full_description = 'Portal:Artwork Jump to: navigation, search ArtworkButtons and Banners - Posters - Countdowns - Miscellaneous - Colors - Web Theme - Brand - Logos - Guidelines - Artwork Team Welcome to the Artwork Portal "Creativity is allowing yourself to make mistakes. Art is knowing which ones to keep". – Scott Adams Topics Trademark guidelines With the openSUSE trademark guidelines, the openSUSE Project is looking to clarify the use of the openSUSE marks and make it easier to redistribute openSUSE-based projects. Join the Artwork Team See the Artwork Team page for contact information and instructions on how to contribute. Logo openSUSE logo - The openSUSE logo in vector form Artwork Webdesign in openSUSE - Pool for design and artwork for our web pages (at Gitorious) Buttons and Banners - Help spread openSUSE by using one of these graphics Countdown - Countdown banners and buttons CD and DVD - Designs for openSUSE CDs and cases Wallpapers - Contributed past openSUSE desktop backgrounds Themes - Icons and desktop themes. Business cards - Designs for business cards T-shirts - Designs for openSUSE-themed t-shirts Miscellaneous - Designs for anything else - Stickers, Case badges, posters, t-shirts? Git repository The openSUSE Artwork is contained in a Git repository at http://github.com/openSUSE/artwork If you are not familiar with how Git works, we invite you to learn the basics here Graphic assets Tools We suggest you try these mature free software tools for creating designs for openSUSE. GIMP - Image manipulation software. Inkscape - Vector drawing software. Blender - 3D rendering software. Krita - Creative painting software. ShowFoto - Foto manipulation. Gwenview - basic image editing (quick crop, resize etc). Tutorials GIMP tutorials which will teach you the many capabilities of this wonderful photo manipulation tool Create a 3D logo using Blender Navigation Artwork drafts Banners Branding overview Buttons Images Wallpapers Archive:12.1 Marketing Hackfest ope