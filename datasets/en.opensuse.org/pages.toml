["https://en.opensuse.org/Portal:MicroOS"]
title = "Portal:MicroOS - openSUSE Wiki"
full_description = '''Portal:MicroOS Jump to: navigation, search Welcome to the MicroOS Portal EditAs a modern Linux operating system openSUSE MicroOS is Small: Lightweight images designed to be deployed for a specific use case Scalable: Optimized for large deployments while capable as a single machine OS Always up-to-date: Updates are automatically applied without impacting the running system Resilient: In case of trouble the system automatically rolls back to last working state Fast: Doesn't ship with baggage that slows it down In other words openSUSE MicroOS is an operating system you don't have to worry about. It's designed for but not limited to container hosts and edge devices. Due to the focus on unattended operation it's especially suited for large deployments. openSUSE MicroOS inherits the openSUSE Tumbleweed and SUSE Linux Enterprise knowledge while redefining the operating system into a small, efficient and reliable distribution. Features EditMain features of the openSUSE MicroOS is : Read-only root filesystem to avoid accidental modifications of the OS The Transactional Updates technology leverages btrfs snapshots to apply package updates without interfering with the running system health-checker to verify the OS is operational after updates. Automatically rolls back in case of trouble. cloud-init for initial system configuration during first boot on Cloud (includes OpenStack) Combustion and Ignition for initial system configuration during first boot on all other images. Designed to fit perfectly into existing openSUSE or SUSE Linux Enterprise environments Podman Container Runtime available Rolling Release: Every new openSUSE Tumbleweed snapshot also automatically produces a new openSUSE MicroOS release. The Leap based version automatically updates when maintenance updates for Leap are published. See the detailed design overview of MicroOS for more details. DistributionsEdit Rolling releaseTumbleweed rolling Slowroll releaseSlowroll beta Immutable server releasesMicroOS server Leap Micro server Immutable desktop releasesAeon beta Kalpa alpha PreAlpha regular releaseLeap 16.0 pre-alpha Latest regular releaseLeap 15.6 stable Old regular releaseLeap 15.5 old stable More about derivatives Navigation Edit Distribution Howto-pihole MicroOS MicroOS/cloud-init MicroOS/Combustion MicroOS/Design MicroOS/FDE MicroOS/Ignition MicroOS/RemoteAttestation MicroOS/SELinux MicroOS/Virtualization MicroOS/WifiSetup MicroOS/XEN MicroOS/Yocto MicroOS/Zypper Communication EditMailing list microos@lists.opensuse.org - MicroOS Project mailing list.Subscribe - Unsubscribe - Help - Archives IRC/Chat #opensuse-microos on the libera IRC network is the channel that the MicroOS project uses for live chat. Retrieved from "https://en.opensuse.org/index.php?title=Portal:MicroOS&oldid=189530" Categories: PortalsMicroOS'''
