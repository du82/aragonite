["https://en.opensuse.org/Portal:KIWI-LTSP"]
title = "Portal:KIWI-LTSP - openSUSE Wiki"
full_description = '''Portal:KIWI-LTSP Jump to: navigation, search This article or section refers to the version '11.3' and it is now obsolete!Please refer to this article's discussion page for more information. Welcome to the KIWI-LTSP Portal edit Welcome to the KIWI-LTSP (LTSP 5) Portal on openSUSE. Here you will find all the information required to get started. What is KIWI-LTSP? edit KIWI-LTSP utilizes ease of deployment and management provided by KIWI to bring our awesome distribution openSUSE to everyone that wishes to use thin client computing. What is LTSP The Linux Terminal Server Project (LTSP) adds thin-client support to Linux servers. LTSP is a flexible, cost effective solution that is empowering schools, businesses, and organizations all over the world to easily install and deploy desktop workstations. A growing number of Linux distributions include LTSP out-of-the-box. Shiny new thin-clients and legacy PCs alike can be used to browse the Web, send e-mail, create documents, and run other desktop applications. LTSP not only improves Total Cost of Ownership (TCO), but more importantly, provides increased value over traditional computing solutions. LTSP workstations can run applications from Linux and Windows servers. Visit LTSP home page for more information. What is KIWI The openSuSE KIWI Image System (KIWI) provides a complete operating system image solution for Linux supported hardware platforms as well as for virtualisation systems like Xen Qemu or VMware. KIWI features distribution independent design, support for virtual systems, network deployed images, live CDs, thick clients and now with kiwi-ltsp diskless clients too. Visit KIWI home page for more information. Featured article edit What "extra" does KIWI bring to LTSP? We use KIWI imaging technology to create boot as well as client images. We can use "prebuilt" images as KIWI's netboot image provides feature of serving config files through tftp server. Idea of using "prebuilt" images is that users do not have to build their own images, so the DVD media to build chroot image is not required. As KIWI provides facility to create different kind of images, we can create Live CD or USB stick image for the LTSP clients, these images work on LTSP5 server running on other distributions too. Some LTSP implementations require manual configuration of services, kiwi-ltsp-setup script provides all the tools necessary to build images and configure services. KIWI-LTSP provides easy way to create diskless distributed build farm using Icecream Apart from NFS and NBD root, KIWI-LTSP supports ATA over Ethernet also. With ATA over Ethernet it is possible to serve multiple images of different kinds from single server, including network booting Fat client images. Suggest • More articles... Getting started edit Guides Watch the Video howto on Youtube and read the quick start guide to kiwi-ltsp. Also have a look on the configuration guide and the tips and tricks page. Running into problems? Don't panic! Read the Troubleshooting information here. Try KIWI-LTSP Live server DVD Download it from here In the news edit Winner FOSS India Awards 2008 Article on osnews Google Summer of Code 2008 Idea More news... Things to do edit Portal:KIWI-LTSP/TODO Easy-LTSP Screenshots edit Suggest • More Screenshots... Navigation edit Related articles: Easy-LTSP Support pages: Easy-LTSP quick start LTSP quick start 11.4 Edu LTSP quick start 12.1 Edu KIWI-LTSP building custom image KIWI-LTSP configuration KIWI-LTSP diskless node KIWI-LTSP How it works KIWI-LTSP Icecream KIWI-LTSP iTALC KIWI-LTSP local applications KIWI-LTSP NBD or AOE KIWI-LTSP network configuration KIWI-LTSP on SLED 10 KIWI-LTSP Printing KIWI-LTSP quick start KIWI-LTSP scanner KIWI-LTSP tips and tricks KIWI-LTSP transcoding KIWI-LTSP updating KIWI-LTSP troubleshooting Project pages: Archive pages: GSOC 2008 Easy-LTSP KIWI-LTSP CD quick start KIWI-LTSP fat client KIWI-LTSP USB quick start LTSP 4.2 LTSP legacy External Links edit KIWI-LTSP Sourceforge wiki The LTSP Manual Ubuntu LTSP Fedora LTSP Debian LTSP Related Projects edit Contact us edit Please use one of the mailing lists from here or IRC Freenode #kiwi-ltsp channel. Attention Developers If you are a developer and would like to contribute to this project, please visit Sourceforge development page. Retrieved from "https://en.opensuse.org/index.php?title=Portal:KIWI-LTSP&oldid=71561" Categories: PortalsKIWI-LTSPProjectsRemote access'''
