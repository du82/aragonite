["https://en.opensuse.org/Portal:Remote_access"]
title = "Portal:Remote access - openSUSE Wiki"
full_description = '''Portal:Remote access Jump to: navigation, search Welcome to the Remote access Portal edit Welcome to the portal for remote access. Through this portal you can find various ways to set up remote access to your computer running an openSUSE distribution. The definition of "remote access" is "Running programs on one computer while you sit in front of another". This could be done in a shell, or may require a full GUI environment. Remote access implies the use of a network. This network can be both a Local network and internet connection. Although mentioned in some of the topics, it may be wise to be familiarized with networking and the SUSE firewall. Don't worry, you don't have to be a hard cooked networking admin to get remote access to work. Just make sure your network is running. Topics edit Setting up remote access, basically means your are opening your system for others to enter. Prevent this, by keeping security in mind at all times. Please refer to related articles in your topic of interest. They can give you valuable hints on securing your system, while opening it for remote access. A golden rule: Never use simple passwords. This means, use a different and more complicated password than your e-mail, facebook, msn, icq etc. If one off these accounts is compromised, an attacker knows your password and for sure he knows your IP address, so your system is easily Hijacked. Use openSSH to setup a remote shell. OpenSSH uses the SSH protocol and is currently the most secure way to remotely access your computer. SSH stands for secure shell. OpenSSH offers many configuration options and possibilities: Various authentication methods like public key authentication. Setting up TCP tunnels to secure otherwise unsecured network traffic. OpenSSH can automaticly open tunnels to forward X applications and even complete desktop sessions. A secure way to copy and transfer files between computers. X is a network transparent window system, which powers your graphical desktop. It is possible to directly connect to an X server over the network using XDMCD. Gives you the possibility to use your normal log in screen (on the client) to connect and authenticate to the server. XDMCD is Insecure it uses no encryption or secrets whatsoever. It should only be used in trusted networks behind a strong firewall. Works bad over slow, low-bandwidth connections. VNC FreeNX is a well established technology to provide a remote desktop over a secure connection. It can be used as a replacement for VNC, XDMCD or forwarding X over SSH. Works well over low-bandwidth and high latency connections. Supports suspend and resume a running session. It is not yet included in the main distribution repositories, but available from build service. Read how to install and configure FreeNX server Setting up must be done from the command line. (But is quite simple) Access from web browser (not yet) supported Guacamole allows you to provide a remote desktop in a browser. Accessible via a proxy Can do everything that VNC does; it is VNC brought into a browser Things to do edit Copied the VNC text to new article SDB:VNC usage this one need serious cleanup. Also a new article TightVNC is created to fit the main name space. The red links above need a new article. Information about it on the old wiki is sparse or still from SUSE linux 8.0. Information from the old wiki can be used, but make sure you tested it before writing! Updating SDB:OpenSSH agent Newly created articles that need expansion: TightVNC SDB:OpenSSH basics SDB:SFTP usage SDB:SCP usage Help is needed! Interested? Check the discussion page. All of Remote access edit FreeNX SDB:FreeNX FreeNX OpenSSH SDB:openSSH OpenSSH SDB:Remote access SDB:FreeNX SDB:openSSH Rdesktop Remote installation VNC usage Remote access KIWI-LTSP TightVNC Screenshots Portal:Remote access/Screenshots/3 More pictures... Retrieved from "https://en.opensuse.org/index.php?title=Portal:Remote_access&oldid=144715" Categories: PortalsNetworkRemote access'''
