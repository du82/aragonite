["https://en.opensuse.org/Portal:Installation"]
title = "Portal:Installation - openSUSE Wiki"
full_description = 'Portal:Installation Jump to: navigation, search Welcome to the Installation Portal EditThanks for choosing openSUSE! We prepared some instructions to help your installation quick and easy. openSUSE provides: Tumbleweed, rolling release with latest and stable software Leap, regular release with mature, complete software and 36 months support Each release, you can choose different types of installation images to download: DVD and Network. DVD image contains all packages needed for installation and is perfect for offline installation. Network image is very small and downloads system and packages from online repositories. You can write installation images to either DVD/CD disks or USB sticks. Always keep an installation media in case you need to rescue system. The installation can take some time (well over half a hour) to detect some hardware combinations so be very patient during initial driver install from boot media (green line at bottom of screen reaches 100% well before all drivers installed) as you might think you are dealing with an installation failure. Topics Edit Download the latest release Tumbleweed Leap 15.6 Create installation media CD/DVD USB stick Installation instructions Installation Quick Start (simple) Installation with YaST (detailed) Network installation Network installation Remote installation Advanced! Language package installation Language specific installation Official openSUSE documentation Current Leap release Releases Edit DistributionsEdit Rolling releaseTumbleweed rolling Slowroll releaseSlowroll beta Immutable server releasesMicroOS server Leap Micro server Immutable desktop releasesAeon beta Kalpa alpha PreAlpha regular releaseLeap 16.0 pre-alpha Latest regular releaseLeap 15.6 stable Old regular releaseLeap 15.5 old stable More about derivatives More... Screenshots 11.3 - Live CD - Creating primary account More pictures... Retrieved from "https://en.opensuse.org/index.php?title=Portal:Installation&oldid=166901" Categories: PortalsInstallation'
