["https://en.opensuse.org/Main_Page"]
title = "openSUSE Wiki"
full_description = '''Main Page Jump to: navigation, search Project The openSUSE project is a worldwide effort that promotes the use of Linux everywhere. openSUSE creates one of the world's best Linux distributions, as well as a variety of tools, such as OBS, OpenQA, Kiwi, YaST, OSEM, working together in an open, transparent and friendly manner as part of the worldwide Free and Open Source Software community. The project is controlled by its community and relies on the contributions of individuals, working as testers, writers, translators, usability experts, artists and ambassadors or developers. The project embraces a wide variety of technology, people with different levels of expertise, speaking different languages and having different cultural backgrounds. Have a lot of fun... Distribution The openSUSE distributions are stable, easy to use and complete multi-purpose distributions. They are aimed towards users and developers working on the desktop or server. They are great for beginners, experienced users and ultra geeks alike, in short, they are perfect for everybody! The latest release, openSUSE Leap 15.6, based on SUSE Linux Enterprise, features new and massively improved versions of all useful server and desktop applications. It comes with more than 1,000 open source applications. openSUSE Tumbleweed is the rolling release, providing the latest upstream software releases, yet only those packages that pass testing. Tumbleweed is also the base for SUSE's award-winning SUSE Linux Enterprise products. MicroOS As a modern Linux operating system openSUSE MicroOS is Small: Lightweight images designed to be deployed for a specific use case Scalable: Optimized for large deployments while capable as a single machine OS Always up-to-date: Updates are automatically applied without impacting the running system Resilient: In case of trouble the system automatically rolls back to last working state Fast: Doesn't ship with baggage that slows it down In other words openSUSE MicroOS is an operating system you don't have to worry about. It's designed for but not limited to container hosts and edge devices. Due to the focus on unattended operation it's especially suited for large deployments. openSUSE MicroOS inherits the openSUSE Tumbleweed and SUSE Linux Enterprise knowledge while redefining the operating system into a small, efficient and reliable distribution. Open Build Service The Open Build Service (OBS) is a generic system to build and distribute binary packages from sources in an automatic, consistent and reproducible way. You can release packages as well as updates, add-ons, appliances and entire distributions for a wide range of operating systems and hardware architectures. The openSUSE project runs it's own instance at https://build.opensuse.org OpenQA openQA is openSUSE's fully automated OS testing service that can be found under https://openqa.opensuse.org/. More information can be found at https://open.qa/. It is used to determine if a build/release/set of updates is good, for both Leap and Tumbleweed releases, to give users an idea about the current quality, to find serious bugs as early as possible, and avoid releasing software that contains those. OSEM OSEM is the Open Source Event Manager, an event management tool tailored to Free and Open Source Software conferences. OSEM actively participates in GSoC and RGSoC. The project needs help and is written in Ruby. There are many open issues and the code can be found on Github/openSUSE/osem Jangouts Jangouts (for "Janus Hangouts") is a solution for videoconferencing based on WebRTC and the excellent Janus Gateway with a user interface loosely inspired by Google Hangouts. It aims to provide a completely self-hosted open source alternative to Google Hangouts and similar solutions. Currently Jangouts supports conferences with video, audio, screen sharing and textual chat organized into an unlimited amount of conference rooms with a configurable limit of participants per room. YaST YaST is the installation and configuration tool for openSUSE and the SUSE Linux Enterprise distributions. It is popular for its easy use and attractive graphical interface and the capability to customize your system quickly during and after the installation. YaST actually stands for Yet another Setup Tool. YaST can be used to configure your entire system. Setup hardware, configure the network, system services and tune your security settings. All these tasks can be reached from the YaST Control Center. Kiwi KIWI is an application for making a wide variety of image sets for Linux supported hardware platforms as well as virtualisation systems including QEMU, Xen and VMware. It is developed by the openSUSE Project and used to create the openSUSE distributions, but can also be employed to build a variety of other Linux distributions. KIWI was recently integrated in OBS as Studio Express. Also see Kiwi Wiki The openSUSE wiki is the source of information about the openSUSE project and distribution. The goal is to provide high quality documentation and a place for collaboration on all parts of the project. This is done in a well structured, standardized and easy readable way. Content is created, edited and refined by all community members. Popular Portals Distribution Tumbleweed Wiki Support Documentation How to participate Project Build Service Education Hardware Factory YaST Zypper Leap Support database Development Arm MicroOS Installation KIWI-LTSP MATE GNOME Conference Xfce Packaging KDE Cinnamon Libzypp Snapper Artwork Enlightenment Medical WebYaST Remote access Kernel MySQL Wicked Security Hackweek LXQt Pantheon Maintenance PowerPC Printing OpenStack Kalpa 15.5 Marketing Popular Support Database Articles Live USB stick NVIDIA drivers System upgrade Create a Live USB stick using Windows Download help KDE repositories Configuring graphics cards Installing Java NVIDIA the hard way Network installation Add package repositories NVIDIA AMD fglrx LAMP setup Audio troubleshooting Configure openSSH NVIDIA Bumblebee ATI drivers Zypper usage 11.3 Recover root password Basics of partitions, filesystems, mount points Radeon Encrypted root file system Installing codecs from Packman repositories Retrieved from "https://en.opensuse.org/index.php?title=Main_Page&oldid=166544" Category: Pages using DynamicPageList'''
year_published = 2025
clearnet = "https://en.opensuse.org/Main_Page"
