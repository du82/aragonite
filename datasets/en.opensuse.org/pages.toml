["https://en.opensuse.org/Portal:OpenStack"]
title = "Portal:OpenStack - openSUSE Wiki"
full_description = 'Portal:OpenStack Jump to: navigation, search Welcome to the OpenStack Portal edit OpenStack provides an IaaS cloud framework. There are OpenStack packages available in the openSUSE Build Service. The packages are developed in the Cloud:OpenStack project and its subprojects. openSUSE Versions edit OpenStack Newton, Ocata, Pike, Queens and Rocky are available in the Open Build Service. Topics edit Crowbar Crowbar is a platform for server provisioning and deployment from bare metal. It is of particular use in automating deployments of OpenStack. DevStack DevStack is a set of shell scripts to build complete OpenStack development environments. It is useful to create a small OpenStack environment that will be used for hacking, testing, etc. and is therefore primarily used for upstream development. OpenStack Chef deployment You can get started quickly with a Chef deployment on openSUSE using soksolok and our OpenStack chef cookbooks. Follow this guide to deploy a simple one-node OpenStack cloud. OpenStack Documentation The OpenStack documentation site contains many guides for installing, administrating and using OpenStack. It includes the Install Guide for openSUSE. Communicate edit Development discussions happen on the openSUSE mailing lists. The most important mailing list to follow OpenStack development and discuss OpenStack related topics is: cloud@lists.opensuse.org - Discussion about openSUSE in the cloud.Subscribe - Unsubscribe - Help - Archives We also have an IRC channel on Freenode: #opensuse-cloud. Package development is a community development, feel free to join us! The list of open and ongoing tasks is available via a public Trello board. In the news edit October 2013: OpenStack Havana and openSUSE March 2013: openSUSE 12.3 is release with OpenStack Folsom March 2013: Moving to open development: OpenStack / Crowbar / Chef on SUSE March 2013: There is now an untested OpenStack Folsom on openSUSE 12.2 appliance in SUSE Studio February 2013: Coordinating efforts to create OpenStack packages for openSUSE and SUSE Linux Enterprise Server November 2011: openSUSE 12.1 released with OpenStack packages October 2010: First OpenStack packages available in the openSUSE Build Service, packaging done by Silas Sewell, Stefan Seyfried, Christian Berendt et. al More news... All of OpenStack edit OpenStack‎ (7 P) Cloud OpenStack Cloud OpenStack Quickstart Crowbar DevStack OpenStack OpenStack and Crowbar development process OpenStack:Chef Retrieved from "https://en.opensuse.org/index.php?title=Portal:OpenStack&oldid=62305" Categories: PortalsOpenStackCloud'
