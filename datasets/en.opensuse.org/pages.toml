full_description = '''Help:Search Jump to: navigation, search Searching is a powerful tool that let's you find specific pages. There is a search bar located at the upper right of every page. This article will tell you how to get more out of your searches. Or try to utilize Google var googleSearchIframeName = "cse-search-results";var googleSearchFormName = "cse-search-box";var googleSearchFrameWidth = 600;var googleSearchDomain = "www.google.com";var googleSearchPath = "/cse"; Search Help The content in this wiki is separated by topic in groups called namespaces and only some of them are searched by default. If you couldn't find what you are looking for you can include other namespaces into your search. Try prefixing your search with the support database namespace SDB: if you are looking for a solution to a problem. SDB: ATI drivers Try prefixing your search with the projects namespace openSUSE: if you are look for projects and teams. opensuse: KDE meeting Try prefixing your query with all: to search over all content in all namespaces in this this wiki all: kernel Retrieved from "https://en.opensuse.org/index.php?title=Help:Search&oldid=58744"'''
