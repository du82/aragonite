title = "UNESCO : Building Peace through Education, Science and Culture, communication and information"
description = "Learn more about UNESCO's role, vision and results. UNESCO is the United Nations Educational, Scientific and Cultural Organization. Our aim is to promote peace and security through international cooperation"
full_description = '''©UNESCOUNESCO's reconstruction of Mosul's landmarksOne year after the black flags of Daesh were lowered over Mosul, Iraq, UNESCO launched an ambitious initiative so this city could rise from the ashes. Today, “Revive the Spirit of Mosul” is writing a story of hope and resilience – and a powerful response to extremism. The rebirth of Mosul is a lasting legacy for UNESCO and multilateralism, highlighting how effective international cooperation can be.Read the storyThe rebirth of MosulMobilizing US$115 million and 15 partners, including the United Arab Emirates and the European Union, UNESCO rehabilitated 124 historical homes, renovated 404 classrooms and created more than 7,700 local jobs, while supporting the recovery of Mosul’s cultural and intellectual life. By giving Mosul back its ‘spirit’, UNESCO has proved that culture can play an essential role in post-conflict reconstruction and the promotion of peace.All about the initiative Thumbnail play_arrow© UNESCOA decade of action against antisemitism and Holocaust denialUNESCO is the UN agency specifically mandated to promote Holocaust and genocide education. We work with strategic partners to create a future where hate has no place. Over the past 10 years, through its International Programme on Holocaust and Genocide Education (IPHGE), implemented with the United States Holocaust Memorial Museum, UNESCO has supported 24 countries across the world to integrate the history of the Holocaust and other violent events into their school curricula. Discover more © Olivier Mériel/Mémorial de la ShoahUNESCO celebrates Multilingualism with a new book published in Hawaiian21 February 2025 marks the 25th anniversary of International Mother Language Day (IMLD). On this occasion, UNESCO and the Ka Haka ‘Ula O Ke’elikōlani College of Hawaiian Language celebrate the remarkable journey of revitalizing the Hawaiian language.Read more © Anna ForlatiPharrell Williams named UNESCO Goodwill AmbassadorAudrey Azoulay, Director-General of UNESCO, appointed the American artist as UNESCO Goodwill Ambassador for Arts Education and Entrepreneurship on Tuesday, December 17, 2024.Committed to promoting social inclusion, equal opportunity and mutual respect through his various artistic, educational and entrepreneurial initiatives, he thus reaffirms his attachment to UNESCO's values. Read more ©UNESCOImpact storiesFind out how UNESCO is making an impact and building resilience in local communities around the world. Echoes of Resilience: Nepali Community Radios in Disaster Response UNESCO and MeitY co-organize the 2nd AI Readiness Assessment Methodology (RAM) Consultation Norma Mamani: explorer of Andean and Amazonian botany Rebuilding lives and restoring hope: Yeslum's transformative journey Load moreOur Vision : #SharingHumanitySince wars begin in the minds of men and women, it is in the minds of men and women that peace must be built. UNESCO uses education, science, culture, communication and information to foster mutual understanding and respect for our planet. We work to strengthen the intellectual and moral solidarity of humankind and bring out the best in our shared humanity.Our Expertise#SharingHumanity Thumbnail play_arrow© UNESCOBuilding a Stronger MultilateralismUNESCO stands on the frontline of international cooperation, in close coordination with sister agencies of the UN System, and as a privileged partner of the Group of 20 (G20). UNESCO shares knowledge, data and expertise to strengthen global coordination in the field of education, the sciences, culture, communication and information, supporting all Member States in the face of current global challenges. UNESCO in the G20 © Shutterstock Delivering in times of emergenciesUNESCO supports crisis response in regions impacted by armed conflicts and climate related disasters. We support countries to ensure access to quality education, and safeguard cultural heritage and reconstruction. Building a stronger multilateralismUNESCO stands on the frontline of international cooperation, in close coordination with sister agencies of the UN System. UNESCO in briefFind out more about UNESCO's recent achievements in all fields, in every region of the world. Our expertiseUNESCO uses education, science, culture, communication and information to foster mutual understanding and respect for our planet. #SharingHumanityWe celebrate shared values and collective efforts to build a better future News Environmental stewardship in schools: Cyprus’ whole school approach to sustainability28 February 2025 The contribution of National Commissions for UNESCO to promote the Recommendation on the Ethics of AI - the case of Germany28 February 2025 UNESCO Partners’ Meeting Launches "ICH as Fashion" Initiative in East Asia28 February 2025 Launch of the 2023 UNESCO GEM Report: Transforming Education with Technology in Southeast Asia28 February 2025 Load more © UNESCOThe UNESCO CourierUNESCO’s magazine – bringing you local perspectives on global issues since 1948. Available in 6+ languages.DiscoverOur shared heritageUNESCO designated sites connect the world and bring out the best in our shared humanity 1223World Heritage Sitesof exceptional cultural and natural value. 788Intangible Heritage Elementstransmitted by communities worldwide. 759Biospheres Reserveswhere humans and nature coexist. 213Global Geoparksthat shed light on our planet’s geological heritage.'''
