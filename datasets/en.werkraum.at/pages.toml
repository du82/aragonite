2%2F2022-01-14-17werkraummitglieder-piapiapia-8-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F36533599c2-1642673852%2F2022-01-14-17werkraummitglieder-piapiapia-8-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F36533599c2-1642673852%2F2022-01-14-17werkraummitglieder-piapiapia-8-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>FairkochtWolfgang MätzlerWolfgang MätzlerHof 437, 6866 Andelsbuch+43 664 5681258info@fairkocht.atwww.fairkocht.atwolfgangfairkochtfairkochtBesondere Umstände erfordern besondere Maßnahmen. Wolfgang Mätzler, Koch seit 1988, ausgezeichnet zum Haubenkoch und nach wie vor nicht weniger überzeugt in seiner Berufung und Profession, hat mit Fairkocht sein langersehntes und gereiftes Bedürfnis – Geschichten ins Glas zu bringen – verwirklicht. Inspiriert dazu haben ihn die unzähligen Einweckgläser seiner Oma, die wie Schätze in den Kellerregalen ihren Platz fanden, den Sommer und die dazugehörigen Gerüche, Aromen, Geschichten und Anekdoten fest in sichverschlossen, darauf wartend, an kühleren Tagen wieder geöffnet zu werden und das Konservierte war imstande, mit ganzer Kraft die Erinnerungen aufleben zu lassen. Für Wolfgang war klar, dieses Phänomen, das Erlebnis des Einweckens und was dadurch entsteht, weiter zu verfolgen, an der Technik zu feilen und zu verfeinern, zu experimentieren und vielen Menschen damit eine Freude zu bereiten!<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F12fcef8536-1642673889%2F2022-01-14-