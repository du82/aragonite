5 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fadler-grossdorf%2F9289a5574b-1642673442%2F2022-01-14-17werkraummitglieder-piapiapia-3-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fadler-grossdorf%2F9289a5574b-1642673442%2F2022-01-14-17werkraummitglieder-piapiapia-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fadler-grossdorf%2F9289a5574b-1642673442%2F2022-01-14-17werkraummitglieder-piapiapia-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Adler GrossdorfIrma Renner und Küchenchef Jodok DietrichIrma Renner und Küchenchef Jodok DietrichGrossdorf 14, 6863 Egg+43 650 4563437office@adler-grossdorf.atwww.adler-grossdorf.atadlergrossdorfEs ist etwas Besonderes, wenn Menschen am Sonntag Mittag an einem Tisch sitzen und gemeinsam essen. Es gibt keinen Zeitdruck, man ist entspannt, lässt die Gedanken schweifen und ist ins Gespräch vertieft. Die Sinne sind offen und aufnahmebereit. Es ist eine Zeit des Genießens. Dieses Erlebnis schaffen Irma Renner und Jodok Dietrich jede Woche für Ihre Gäste. Tradition und Moderne. Gewohntes und Neues. Heimisches und Internationales. All das bestimmt die Küche des Adler Grossdorf. Mit den Konstanten hochwertige, saisonale Zutaten, sorgfältige Verarbeitung und bestes Kochhandwerk.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fadler-grossdorf%2F6f9c197ac1-1642673589%2F2022-01-14-17werkraummitglieder-piapiapia-7-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3