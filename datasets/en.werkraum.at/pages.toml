rghandwerk%2F9f1138dc79-1740651701%2Fkattrin-staehle-werkraum-5202-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2F9f1138dc79-1740651701%2Fkattrin-staehle-werkraum-5202-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>BerghandwerkKattrin StähleKattrin StähleRain 75, 6942 Krumbach+49 170 2972142berghandwerk@gmx.atberghandwerk.bregenzerwaldKeramik ist für Kattrin Stähle ein lebendiges Handwerk voller Möglichkeiten. Mit wechselnden Tonmassen, individuellen Formen und neuen Oberflächen entstehen einzigartige Gebrauchskeramiken, die funktional und doch lebendig sind. Ihre Motivation ist es, besondere Stücke für Menschen zu schaffen, die Individualität schätzen. Um ihr Handwerk in seiner ganzen Vielfalt zu verstehen, hat sie verschiedene Bereiche der Keramik entdeckt - von der Baukeramik über den Holzbrand bis hin zur Porzellanherstellung. Reisen und der Austausch mit Töpfer:innen aus aller Welt haben ihr Wissen erweitert und neue Inspirationen geschaffen, die sich in ihren Arbeiten widerspiegeln.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.j