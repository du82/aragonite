ax-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fcca389452e-1638879423%2Falphabet-des-lebes-c-roswitha-schneider-7-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fcca389452e-1638879423%2Falphabet-des-lebes-c-roswitha-schneider-7-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fcca389452e-1638879423%2Falphabet-des-lebes-c-roswitha-schneider-7-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F5c3c7f2604-1639385368%2Fschauraum-mohr-polster-in-andelsbuch-c-ian-ehm-friendship-is-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F5c3c7f2604-1639385368%2Fschauraum-mohr-polster-in-andelsbuch-c-ian-ehm-friendship-is-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F5c3c7f2604-1639385368%2Fschauraum-mohr-polster-in-andelsbuch-c-ian-ehm-friendship-is-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F8139d806c1-1639385406%2Fschwarzenberg-im-bregenzerwald-c-emanuel-sutterluty-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F8139d806c1-1639385406%2Fschwarzenberg-im-bregenzerwald-c-emanuel-sutterluty-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F8139d806c1-1639385406%2Fschwarzenberg-im-bregenzerwald-c-emanuel-sutterluty-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fa4b3daa7e3-1638878973%2Fwerkraumhaus-florian-holzherr-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fa4b3daa7e3-1638878973%2Fwerkraumhaus-florian-holzherr-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2Fa4b3daa7e3-1638878973%2Fwerkraumhaus-florian-holzherr-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 6Der Werkraum Bregenzerwald wurde 1999 zur Förderung von Handwerk und Baukultur gegründet und ist organisiert in einem Verein mit einer Geschäftsstelle in Andelsbuch. Kern des Vereins ist das kooperative Miteinander. Im Werkraum Bregenzerwald sind aktuell rund 100 Mitgliedsbetriebe zusammengeschlossen – eine innovative Plattform des zeitgenössischen Handwerks.Timeline2018Eröffnung Werkraum Depot im Untergeschoss des Werkraum Hauses2016Aufnahme in das UNESCO-Register guter Praxisbeispiele für die Erhaltung des immateriellen Kulturerbes2016Start der Werkraum Schule Bregenzerwald2013Eröffnung Werkraum Haus2012Bau Werkraum Haus2000Der Werkraum Bregenzerwald schreibt erstmal den Wettbewerb Handwerk+Form aus1999VereinsgründungGut 40 Prozent der Mitgliedsbetriebe sind aus holzverarbeitenden Branchen. Knapp 60 Prozent der Mitglieder kommen aus dem Baugewerbe und Bauhandwerk, sind Sanitär- und Elektrounternehmen oder verarbeiten Glas, Metall, Textil, Leder und Stein. Garten- und Landschaftsbau, Goldschmiede, Lebensmittelhandwerk, Grafikdesign und andere Dienstleistungsunternehmen runden das breite berufliche Spektrum im Handwerk ab. Die Mitglieder sind mittelständische, in der Regel familiengeführte Unternehmen, manche mit einer reichen Tradition.Gemeinsam fördern sie, was sie seit vielen Jahren auszeichnet: die Verbindung von Produkt-, Arbeits- und Lebensqualität. Zuverlässigkeit, solide Verarbeitung und gute Gestaltung haben zur Folge, dass das Handwerk und das Gewerbe im Bregenzerwald die größten Arbeitgeber sind. Nirgendwo in Europa gibt es eine vergleichbare Dichte an Handwerksbetrieben.Der Verein wirkt nach außen mit Ausstellungen, Wettbewerben und Vorträgen, nach innen mit Entwicklungsarbeit und Nachwuchspflege. Die Ziele des Vereins sind die umfassende Präsentation und Vermittlung der Leistungen seiner Mitglieder, die Förderung von Handwerk und Baukultur, sowie das Arbeiten in Kooperationen. Die Begegnung mit Gestalter:innen aus den Bereichen Architektur, Design und Kunst geschieht auf Augenhöhe. Mit dem Gestaltungswettbewerb Handwerk+Form wurde dafür in zwei Jahrzehnten ein einzigartiges Instrument geschaffen. Seit 2013 weist der Werkraum den Weg für die Kultur der Handwerkstechniken in einem neuen Gebäude – dem Werkraumhaus, das vom bekannten Schweizer Architekten Peter Zumthor entworfen und von den Werkraum Mitgliedern gebaut wurde.'
