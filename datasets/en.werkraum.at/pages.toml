ntrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F793cea21a8-1638547853%2F2021-02-03elektrowilli-piapiapia-bearbeitet-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F793cea21a8-1638547853%2F2021-02-03elektrowilli-piapiapia-bearbeitet-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F793cea21a8-1638547853%2F2021-02-03elektrowilli-piapiapia-bearbeitet-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 4„Als Bregenzerwälder Elektrobetrieb sind wir stolz darauf, einen kleinen Beitrag für das Bregenzerwälder Handwerk zu leisten, dessen Qualität weit über die Region hinaus bekannt ist. Aus der Mitgliedschaft des Werkraums ergeben sich für uns wichtige Kontakte und die Zusammenarbeit mit den anderen Bregenzerwälder Handwerksbetrieben. Durch die gemeinsame Nachwuchsarbeit eröffnen sich neue Möglichkeiten, interessierte Jugendliche zu Fachkräften von Morgen auszubilden und für den spannenden Beruf der Elektrikerin bzw. des Elektrikers zu begeistern.“Art des HandwerksElektrikGründungsjahr1969Werkraum Mitglied seit2004Gründer, Meilensteine1969: Katharina und Kurt Willi gründen das Unternehmen, Bau eines Geschäftslokals mit Werkstatt und Lager; 1970: Erster Lehrling; 1976: Filiale in Schwarzach wird eröffnet; 1979: Auf Expansionskurs mit 13 Monteuren, 3 Angestellten und 10 Lehrlingen; 1983: Neubau des Wohn- und Geschäftshauses mit Verkaufsfläche, Büros, Werkstatt, Lager in Andelsbuch; 1984: Eröffnung Filiale Lauterach, bereits über 50 Mitarbeiter:innen; 1994: Gründung der Elektro Willi GmbH & Co KG. Eintritt von Peter Willi als Geschäftsführer. Neuer Zubau. Eröffnung der Filiale Lech; 1995: Josef Willi tritt als weiterer Geschäftsführer ein; 1997: Erstmals „Ausgezeichneter Lehrbetrieb“. Erfolg wird in den Folgejahren bis heute immer wieder bestätigt. 2002: Übergabe der Firma an Peter und Josef Willi; 2016: Neue Firmenstruktur: „Elektro Willi“ steht für den Bereich Elektroinstallation und „Willi Elektrogeräte“ für den Handelsbereich; 2017: Umbau von Büro und Werkstatt, unterkellerter Zubau für vergrößertes LagerBetriebsartGmbH & Co KGAngestellte81–100VertriebMontage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukte„Auf die komplette Leistungspalette der Elektroinstallation speziali'
