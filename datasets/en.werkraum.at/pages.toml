onsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>KategorienDie Jurysitzung fand am 16. und 17. September statt. Die eingereichten Objekte wurden in den Kategorien Exzellenz, Auszeichnung und Anerkennung prämiert. Insgesamt durften sich 18 Handwerker:innen über eine Auszeichnung freuen.ExzellenzDie Jury zeichnet außergewöhnliches Handwerk, Innovation und avantgardistisches Denken aus, die das Handwerk auf ein neues Level bringen.AuszeichnungDie Jury zeichnet außergewöhnliches Handwerk aus, das perfekt in der Ausführung ist und die ganze Bandbreite des Handwerks ausschöpft.AnerkennungDie Jury anerkennt das Potenzial, das in herausfordernden Ideen steckt und zu einer interessanten Neuinterpretation geführt hat.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F0b24c842fb-1697290840%2Fa-handwerk-und-form-23-dominic-kummer-22023a-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Krützstock HEREKategorie: ExzellenzFensterfrontFichte, Eiche, Messing, Vakuumglas, Netzplane210 x 210 cmEinreichung: Schwarzmann Fenster GmbH & Co KG, Felix, Claus und Jan Schwarzmann, SchoppernauEntwurf: Architekturbüro Felder Geser, EggMitbeteiligte: Figer Kunstschmiede, Peter Figer, BezauJurykommentar:Ein dreiflügeliges Massivholzfenster nach historischem Vorbild wurde innovativ ohne Kämpfer oder Setzholz weiterentwickelt. Auf beeindruckende Art und Weise nimmt es die historische Architektur der Region auf und verwandelt sie in etwas Modernes, Zeitgenössisches und Ästhetisches. Eine perfekte Repräsentation des Bregenzerwälder Handwerks und eine gelungene Neuinterpretation eines traditionellen Fensters.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2F44c47a16eb-1697297328%2Fa-handwerk-und-form-23-dominic-kummer-22023a-b-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="laz