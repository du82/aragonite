box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2F3e80f8d518-1638547844%2F2021-02-brauereiegg-johannesfink-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2F3e80f8d518-1638547844%2F2021-02-brauereiegg-johannesfink-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2F3e80f8d518-1638547844%2F2021-02-brauereiegg-johannesfink-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 4„Es ist die Verbindung zu den anderen Handwerksbetrieben, das Netzwerk, der Austausch und die Möglichkeit zur Produktpräsentation, die den Werkraum ausmachen. Das Bregenzerwälder Handwerk ist ein fantastischer Imageträger.“Art des HandwerksLebensmittelhandwerkGründungsjahr1894Werkraum Mitglied seit2019Gründer, Meilensteine1894: In der Brauerei Egg wird unter dem Namen „Simma, Kohler & Cie“ am 24. März 1894 das erste Bier gezapft; 1902: Durch die Eröffnung der Wälderbahnstrecke von Bregenz nach Bezau konnte das Egger Bier auch in die Landeshauptstadt und Umgebung geliefert werden. Nach dem Zweiten Weltkrieg hielt Bier langsam auch in den Haushalten Einzug und verdrängte den bis dahin vorherrschenden selbst gemachten Most. Kleine Brauereien wurden seltener, größere Brauereien schlossen sich im Verbund zusammen. Von den ehemals über 30 Brauereien im Bregenzerwald ist die Brauerei in Egg die einzige, die traditionelles Brauhandwerk bis in die Gegenwart gerettet hat; 2021: Auszeichnung „Bestes Spezialbier Österreichs“BetriebsartGmbH & Co KGAngestellte21–50VertriebEigener VerkaufsraumSchlüsselprodukteWälder Spezial Bier, Keller Bier, Jokl, LimoArbeitsmittel, -materialienLebensmittel (Hopfen aus Tettnang, Malz aus Deutschland, Wasser aus eigener Quelle)Technologie / MaschinenOriginal Kupfer Sudhaus aus den 70er JahrenSonderlösungenKeine Kurzzeiterhitzung'
