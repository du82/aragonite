um.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F030fd0c690-1638547852%2F2021-02-03elektrowilli-piapiapia-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F030fd0c690-1638547852%2F2021-02-03elektrowilli-piapiapia-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Elektro WilliPeter WilliPeter WilliFeld 167, 6866 Andelsbuch+43 5512 2397office@elektrowilli.atwww.elektrowilli.atelektrowilli_andelsbuchElektro Willi AndelsbuchWo ein Willi ist, ist auch ein Weg. Peter Willi und seine Mitarbeiter:innen sind eine verschworene Gemeinschaft. Eine Mannschaft, die sich auf breites Fachwissen und praktische Erfahrung eingeschworen hat. Beides ergibt in Summe: Kompetenz. Und die hat das Team von Elektro Willi seit zwei Generationen für elektrische Installationen in Einfamilienhäusern, Wohnanlagen, im Gewerbe- sowie Industriebau und in öffentlichen Bauten. Die 80 Mitarbeiter:innen, die Großteils im Unternehmen ausgebildet wurden und ihren Beruf von der Pike auf gelernt haben, zeichnen sich durch ganz typische Bregenzerwälder Eigenschaften aus - wie vorbildliche Arbeitseinstellung, wie die Verlässlichkeit in Person und wie echte Handschlagqualität. Diese Qualitäten schätzen die Kunden.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F2e6b9f26b4-1638547852%2Felektro-willi-team-c-marcel-mayer-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Felektro-willi%2F2e6b9f26b4-1638547852%2Felektro-willi-team-c-marcel-mayer-2560x1706-crop-50-50.jpg&a