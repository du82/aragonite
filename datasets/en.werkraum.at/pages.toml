50-50.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fanton-bereuter-handwerkholz%2Feebb3539d4-1638547844%2F2021-01-19tischlereibereuter-bypiapiapia-640x640-crop-50-50.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fanton-bereuter-handwerkholz%2Feebb3539d4-1638547844%2F2021-01-19tischlereibereuter-bypiapiapia-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fanton-bereuter-handwerkholz%2Feebb3539d4-1638547844%2F2021-01-19tischlereibereuter-bypiapiapia-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fanton-bereuter-handwerkholz%2Feebb3539d4-1638547844%2F2021-01-19tischlereibereuter-bypiapiapia-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Anton Bereuter HandwerkholzAnton BereuterAnton BereuterAchrain 65a, 6861 Alberschwende+43 664 1231914anton.bereuter@handwerkholz.atwww.handwerkholz.atLändlerodelAnton Bereuter, Tischlermeister aus Alberschwende, verarbeitet den Rohstoff Holz in die verschiedensten Arten und zu unterschiedlichsten Formen. Richtige Holzschlägerung und Jahresringe sind für ihn nicht nur überlieferte Tradition, sondern werden bei Handwerkholz angewendet, gelebt und weitergegeben. Mit seinem Namen steht Anton für Qualität und genaue Ausführungen. Ob auf der Suche nach Möbeln fürs Leben oder einem der bekannten Ländlerodel – Menschen, die handgefertigte Produkte und nachhaltiges Handwerk schätzen sind bei Anton Bereuter richtig.<img alt="" srcSet="/_next/image?url=https%3