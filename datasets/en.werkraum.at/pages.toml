s%2Fder-verein%2Fmitglieder%2Ffink-martin-installationstechnik%2Fe2d5f3334b-1638547853%2F2021-03-15martinfink-johannesfink-3-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffink-martin-installationstechnik%2Fe2d5f3334b-1638547853%2F2021-03-15martinfink-johannesfink-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffink-martin-installationstechnik%2Fe2d5f3334b-1638547853%2F2021-03-15martinfink-johannesfink-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Mein Vater Peter Fink ist Gründungsmitglied des Werkraums, war viele Jahre Vizeobmann und in die Entwicklung der Werkraumschule integriert. Der Werkraum Bregenzerwald als Zusammenschluss von regionalen Handwerksbetrieben samt zugehörigem Werkraumhaus, ist etwas Besonderes.“Art des HandwerksInstallationGründungsjahr1865Werkraum Mitglied seit1999Gründer, Meilensteine1865: Anton Fink, Schlossermeister aus Krumbach, kauft 1865 das Anwesen Mittlere 81 in Bezau und richte eine Schlosserwerkstatt ein. In den Dreißigerjahren Start mit der Durchführung von Installationsarbeiten durch Josef Fink, der eine Lehre als Schlosser bei seinem Vater Peter Fink absolvierte. Nach den Kriegsjahren wird die Schlosserei allmählich auf die Installationen von Heizungen und sanitäre Anlagen umgestellt; 2008: Peter Fink übergibt den Betrieb an seinen Sohn Martin Fink. Um den vielseitigen Anforderungen gerecht zu werden, wird für alle Kund:innen die Anlage abgestimmt, um das bestmögliche Ergebnis zu erzielenBetriebsartGmbHAngestellte5–10VertriebBeratung in kleinem Schauraum (sanitäre Einrichtungen), Montage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukteKundenspezifische Lösungen im Heizungs- und Sanitärbereich, Schwerpunkt liegt besonders auf Sanierungsbereich. Termingerechte und saubere Ausführung der Arbeiten bei maximaler Kundenorientierung und bester Beratung.Arbeitsmittel, -materialienMetallBesonderheiten, EinzigartigesFink Martin Installationen verwendet für ihre Installationen die sinnvollsten und adäquatesten Systeme unter Berücksichtigung aller ökologischen und ökonomischen Gesichtspunkte.'
