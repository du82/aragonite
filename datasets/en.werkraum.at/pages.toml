betung der Asche.“ – Gustav MahlerArt des HandwerksDienstleistung BauGründungsjahr2005Werkraum Mitglied seit2006Gründer, MeilensteineAusbildung an der HTL-Rankweil – Hochbau. Architektur-Studium an der TU Graz, danach Mitarbeit im Büro von Hermann Kaufmann und Dietrich Untertrifaller; 2005: Gründung des eigenen Büros; 2005–2008: Sanierung der Hauptschule Bezau in Passivhaus-Standard; 2013: Holzbaupreis für die Sanierung der alten Säge Bezau mit Kaspar Greber; 2015: Holzbaupreis für das Sicherheitszentrum Bezau mit Hermann Kaufmann und Querformat. Firmengründung Broger Greber Projekt mit Kaspar Greber; 2016: Komot Bezau; 2020 und 2021: Anerkennung beim Holzbaupreis für die Werkhalle Gobbi mit Holger FritzBetriebsartGmbHAngestellte2–4VertriebVerkauf nur auf AnmeldungSchlüsselprodukteKomot Bezau, Lebelle Bezau, Kinderdorf Schönenbach, Sicherheitszentrum Bezau, Alte Säge Bezau, Gobbi Produktionshalle HöchstArbeitsmittel, -materialienBüro, Dienstleistung, ServiceleistungenTechnologie / MaschinenEntwürfe werden anhand von Modellen entwickelt und mit CAD umgesetztBesonderheiten, EinzigartigesDurch Fachkompetenz und Erfahrung – gepaart mit visionärem Denken und mutigem Innovationsgeist werden zukunftsweisende Projekte entwickelt. Wichtig ist, für den jeweiligen Standort eine optimale Lösung zu finden. Ein Bauprojekt soll auf die örtlichen Gegebenheiten maßgeschneidert zugeschnitten sein und sich in die lokale Struktur einfügen. Eine nachhaltige Bauweise mit regionalen Materialien ist selbstverständlich.'
