pia-16-640x640-crop-50-50.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fgebrueder-johler%2F3d89a07d8c-1642673977%2F2022-01-14-17werkraummitglieder-piapiapia-16-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fgebrueder-johler%2F3d89a07d8c-1642673977%2F2022-01-14-17werkraummitglieder-piapiapia-16-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fgebrueder-johler%2F3d89a07d8c-1642673977%2F2022-01-14-17werkraummitglieder-piapiapia-16-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Gebrüder JohlerEdmund Johler, Reinhard Johler und Werner JohlerEdmund Johler, Reinhard Johler und Werner JohlerGschwend 341, 6861 Alberschwende+43 5579 4206rodel.johler@aon.atwww.johler-rodel.atjohler_rodelJohler RodelAuf Basis jahrzehntelanger Erfahrung, großer Sorgfalt und Genauigkeit erzeugen die Gebrüder Johler qualitativ hochwertige Produkte – ausschließlich aus heimischem Eschenholz. Das sorgfältig ausgewählte Holz wird in den Wintermonaten (im richtigen Mond) geschlagen und anschließend für zumindest zwei Jahre luftgetrocknet. Damit erreicht das Holz die höchstmöglichste mechanische Festigkeit und Elastizität, die sich in der Langlebigkeit der Produkte wieder spiegelt.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fgebrueder-johler%2F3d89a07d8c-1642673977%2F2022-01-14-17werkraummitglieder-piapiapia-16-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2