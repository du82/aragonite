ute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Ein Licht für die WandKategorie: ExzellenzLeuchteAluminium317 x 230 x 206 cmEinreichung: Bechter Licht GmbH, Georg Bechter, HittisauEntwurf: Georg Bechter, HittisauMitbeteiligte: Gerola Metalltechnik GmbH, Manfred Kloser, Langenegg; Fetz Malerei GmbH, Michael Fetz, AlberschwendeJurykommentar:Ein Leuchtkörper, mit dem ein Raum perfekt bespielt werden kann. Ein äußerst innovatives Produkt, technisch sehr überzeugend umgesetzt. Mit seiner geringen Größe und seiner Unscheinbarkeit steht es in starkem Kontrast zur optischen Wirkung, die es erzeugt. Die Qualität der gefertigten Kleinteile ist einzigartig. Dieses nahezu unsichtbare Produkt mit seiner technischen Perfektion hebt das Handwerk auf ein ganz neues Level.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2Fd43bd2b857-1697297778%2Fa-handwerk-und-form-23-dominic-kummer-50220-a-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2Fd43bd2b857-1697297778%2Fa-handwerk-und-form-23-dominic-kummer-50220-a-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2Fd43bd2b857-1697297778%2Fa-handwerk-und-form-23-dominic-kummer-50220-a-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2Fd43bd2b857-1697297778%2Fa-handwerk-und-form-23-dominic-kummer-50220-a-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fpreistraeger-2023%2Fd43bd2b857-1697297778%2Fa-handwerk-und-form-23-dominic-kummer-50220-a-1536x-q95.jpg&amp;w=1200&amp;q=75 