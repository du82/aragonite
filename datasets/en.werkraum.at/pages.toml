r-verein%2Fmitglieder%2Fbrauerei-egg%2Facc3c8aec5-1638547844%2F2021-02-brauereiegg-johannesfink-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2Facc3c8aec5-1638547844%2F2021-02-brauereiegg-johannesfink-3-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Brauerei EggHubert Berkmann und Lukas DornerHubert Berkmann und Lukas DornerGerbe 500, 6863 Egg+43 5512 2201brauerei@brauerei-egg.atwww.brauerei-egg.ateggerbierBrauerei EggDie Brauerei Egg ist die kleinste Privatbrauerei in Vorarlberg mit Sitz in Egg. Ein regionaler Familienbetrieb und starker Partner für Gastronomie, Handwerk und Tourismus. Das Brauen von Bierspezialitäten gehört seit 1894 zu ihrer Kernkompetenz. Der direkte Kontakt zum Kunden, der prompte Service und die hohe Qualität der Produkte sind seit vielen Jahren die markanten Merkmale der Brauerei. Sowohl die Gastronomie als auch den heimischen Handel beliefert die Brauerei mit ihren hochwertigen Getränken, die von einem breiten Biersortiment über Limonaden bis hin zu leckeren Erfrischungsgetränken reichen. Alle ausschließlich in Mehrweg-Flaschen abgefüllt. Denn das ist die tiefste Überzeugung der Brauerei – im Sinne des Geschmacks und der Nachhaltigkeit.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2Ff952d1522b-1638547844%2F2021-02-brauereiegg-johannesfink-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fbrauerei-egg%2Ff952d1522b-1638547844%2F2021-02-brauereiegg-johannesfink-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" 