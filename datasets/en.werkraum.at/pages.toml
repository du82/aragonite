A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fcasimo%2Fdf36d3c5ff-1725530646%2Fwerkraum-mitglieder-casimo-dominic-kummer-2024-4009-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fcasimo%2Fdf36d3c5ff-1725530646%2Fwerkraum-mitglieder-casimo-dominic-kummer-2024-4009-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fcasimo%2Fdf36d3c5ff-1725530646%2Fwerkraum-mitglieder-casimo-dominic-kummer-2024-4009-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>casimoKarlheinz EberleKarlheinz EberleZeihenbühl 493, 6951 Lingenau+43 664 5348946info@casimo.eucasimo.eucasimo.euHinter dem Betrieb casimo steht Karlheinz Eberle, an den die Liebe zum Handwerk bereits in der dritten Generation weitergegeben wurde. Er und sein Team entwerfen und realisieren Unikate, passend für die Lebensräume ihrer Kund:innen. Traditionelles Handwerk verschmilzt dabei mit modernem Design. Sie gestalten Lieblingsräume mit Herzblut, Gespür und Können und sind überzeugt davon, dass diese für Gesundheit und Lebenskraft entscheidend sind. Mit ausgesuchtem Naturholz für hochwertige Vollholzmöbel werden Orte zum Wohlfühlen geschaffen.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fcasimo%2Fdf36d3c5ff-1725530646%2Fwerkraum-mitglieder-casimo-dominic-kummer-2024-4009-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fcasimo%2Fdf36d3c5ff-1725530646%2Fwerkraum-mitglieder-casimo-dominic-kummer-2024-4009-2560x1706-cr