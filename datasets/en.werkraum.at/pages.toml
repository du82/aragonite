es%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2Fa3494bfdec-1740651819%2Fkattrin-staehle-werkraum-5322-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2F061b3fc2fc-1740651843%2Fkattrin-staehle-werkraum-5315-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2F061b3fc2fc-1740651843%2Fkattrin-staehle-werkraum-5315-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fberghandwerk%2F061b3fc2fc-1740651843%2Fkattrin-staehle-werkraum-5315-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 5Der Werkraum bietet einen umfassenden Blick auf das Handwerk der Region. Er zeigt, wie ein Museum, wechselnde Ausstellungen, in denen man die Schönheit und den besonderen Wert von Handgemachtem erfahren kann.Art des HandwerksKeramikGründungsjahr2022Werkraum Mitglied seit2024Gründer, Meilensteine1983 Gesellenprüfung als Keramikerin Danach Gesellin in verschiedenen Keramikwerkstätten. 2000 im Auftrag der GTZ nach Cochabamba/Bolivien um in dem Sozialprojekt Talleres Winay indigene Frauen zu Keramikerinnen auszubilden. 2001 präsentiert sie das Projekt mit seinen keramischen Produkten in einer Sonderausstellung im Keramikmuseum Höhr-Grenzhausen.2002 Mitarbeit in der Keramikwerkstatt Casa San Pedro in Garachico/Teneriffa. Seit 2003 Leitung der Keramikwerkstatt in dem Familienferiendorf und Seminarhaus Vogelsbergdorf in Hessen.2004 bis 2006 Studium am Englischen Institut in Heidelberg. Diplom als Übersetzerin Spanisch/Deutsch Fachbereich Wirtschaft.2007 bis 2009 Mitarbeit in der Porzellanmanufaktur Eiden in Ulm. 2008 Kursangebot in der Keramikwerkstatt im Künstlerhaus Spiekeroog. 2013 Teilnahme an der Ausstellung "Das Vogelhaus" im Handwerksmuseum in Deggendorf. Lebt und arbeitet seit 2022 in Krumbach.VertriebTermine nach Vereinbarung in der WerkstattSchlüs'
