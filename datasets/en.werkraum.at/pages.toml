title = "Education Programm - Werkraum Bregenzerwald GmbH"
description = "Mit dem Vermittlungsprogramm wird Kindern und Jugendlichen von Beginn an die Bedeutung einer regional verwurzelten Handwerkskultur nähergebracht."
full_description = 'Next Generation, Education ProgrammEducation ProgrammEin wesentlicher Schwerpunkt des Werkraum sind die Nachwuchsaktivitäten. In den Mitgliedsbetrieben, Ausbildungsstätten und im Werkraum Haus gibt es für jede Altersgruppe verschiedene Projekte und Programme.Anfragen und Anmeldungeninfo@werkraum.at+43 (0) 5512 26386<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2F75e6530cfb-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-9-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Mit dem Vermittlungsprogramm wird Kindern und Jugendlichen von Beginn an die Bedeutung einer regional verwurzelten Handwerkskultur nähergebracht und ein starkes Zeichen einer gesellschaftlichen Verantwortung für das langfristige Überleben des Handwerks in der Region gesetzt.KinderprogrammFür Kinder und Jugendliche, sowie für Schulklassen und Kindergartengruppen, bieten wir im Werkraum Haus ein buntes Programm an.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2Ff7617699e9-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2Ff7617699e9-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2Ff7617699e9-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2Ff7617699e9-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittlung%2Ff7617699e9-1638547854%2Fkinderbaustelle-h-f-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fvermittl