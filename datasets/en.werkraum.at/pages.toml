full_description = 'Das Haus, Werkraum DepotWerkraum DepotNamensgebend für das Werkraum Depot war der erste, von 2004 bis 2013 betriebene Schauraum des Werkraum Bregenzerwald.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Schon damals wurden im werkraum depot in Schwarzenberg – einem wichtigen Vorläufer des Zumthor Baus in Andelsbuch als Ausstellungs- und Vermittlungsort – auch Ankäufe des vorarlberg museum gezeigt. Die jetzige Neuaufstellung wurde mit Mitteln der Freunde des Werkraum Bregenzerwald ermöglicht und kann als Führungsangebot von vorarlberg museum und Werkraum Bregenzerwald auf Anfrage besichtigt werden.Auslöser für die Neuaufstellung war die im Sommer 2017 gezeigte Ausstellung Archiv der Formen. Handwerk und Design im Bregenzerwald. Die Überblicksschau mit mehr als 200 Exponaten aus bisher 632 Einreichungen zu Handwerk+Form gab einen Gesamteindruck von den Entwicklungen und dem Gestaltungsreichtum des Bregenzerwälder Handwerks seit der Erstausgabe des Gestaltungswettbewerbs 1991. Viele der Ausstellungsstücke waren Leihgaben aus der Sammlung des vorarlberg museum, die teilweise bereits im Untergeschoss des Werkraumhauses eingelagert waren. Die Überlegung lag also nahe, diese sonst unsichtbare „Schatzkammer“ für das interessierte Publikum in einer permanenten Präsentation – zumindest zu bestimmten Zeiten – zugänglich zu machen.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F6c45ea848f-1639084658%2Fwerkraumdepot-roswitha-schneider-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2Fb2aa9116cf-1639084661%2Fwerkraumdepot-c-johannes-fink-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2Fb2aa9116cf-1639084661%2Fwerkraumdepot-c-johannes-fink-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2Fb2aa9116cf-1639084661%2Fwerkraumdepot-c-johannes-fink-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F0007f32a5c-1639084650%2Fwerkraumdepot-1-roswitha-schneider-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fzur-zeit%2Fausstellungen%2Fwerkraum-depot%2F5b251fba82-1639084645%2Feroeffnung-neues-werkraumdepot-werkraumhaus-c-johannes-fink-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 4Das Werkraum Depot erstreckt sich auf knapp 200m2 im Untergeschoss des Werkraumhauses und zeigt rund 80 Objekte aus der Sammlung des vorarlberg museums sowie zusätzlich einige wenige Leihgaben direkt aus den Werkstätten der Handwerksbetriebe. Die daraus zusammengestellte Studiensammlung ergibt somit einen sehr guten Einblick in das Werken und Wirken der regionalen Handwerksbetriebe und zeigt das Niveau und die Qualität ihrer Erzeugnisse mit höchstem, gestalterischem Anspruch.Das Werkraum Depot ist somit ein wichtiger Ort der Vermittlung – nicht nur der handwerklichen und gestalterischen Qualitäten und Fertigkeiten in der Region – sondern auch der jungen, von Veränderung erzählenden Geschichte des Werkraum Bregenzerwald. Es ergänzt und vertieft das sonstige Angebot im Werkraum Haus, wie Sonderausstellungen und Werkraumschauen. Für die Werkraum Schule Bregenzerwald ist die Studiensammlung und das Depot ein zentraler Lernort zu Handwerk und Design, der die Kreativität der Schüler:innen am Beispiel herausragender Sammlungsobjekte anregen und fördern soll.Führungen durch das Werkraum Depot finden derzeit nur auf Anfrage statt. Weitere Informationen dazu:Führungen durch das Werkraumdepot'
