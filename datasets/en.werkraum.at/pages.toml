title = "Der Verein - Werkraum Bregenzerwald GmbH"
description = "Die Ziele des Vereins sind die umfassende Präsentation und Vermittlung der Leistungen seiner Mitglieder, die Förderung von Handwerk und Baukultur, sowie das Arbeiten in Kooperationen."
full_description = "Der VereinMach mit!Als Werkraum MitgliedsbetriebBei den Werkraum FreundenIn der Werkraum SchuleDer Werkraum Bregenzerwald wurde 1999 zur Förderung von Handwerk und Baukultur gegründet und ist organisiert in einem Verein mit einer Geschäftsstelle in Andelsbuch. Die Ziele des Vereins sind die umfassende Präsentation und Vermittlung der Leistungen seiner Mitglieder, die Förderung von Handwerk und Baukultur, sowie das Arbeiten in Kooperationen.Aktuell sind im Werkraum Bregenzerwald knapp 95 Mitgliedsbetriebe zusammengeschlossen – eine innovative Plattform des zeitgenössischen Handwerks. Diese wirkt nach außen mit Ausstellungen, Wettbewerben und Vorträgen, nach innen mit Entwicklungsarbeit und Nachwuchspflege.Der Werkraum Bregenzerwald verfügt über gestalterische Kompetenz, Bildung und Selbstbildung. Die Begegnung mit Partner:innen und Gestalter:innen aus den Bereichen Architektur, Design und Kunst geschieht auf Augenhöhe.Seit 2013 weist der Werkraum den Weg für die Kultur der Handwerkstechniken in einem neuen Gebäude – dem Werkraum Haus, das vom bekannten Schweizer Architekten Peter Zumthor entworfen und von den Werkraum Mitgliedern gebaut wurde.MitgliederVorstandHistorieHotelpartnerFördererWerkraum Freunde"
author = "Werkraum Bregenzerwald GmbH"
