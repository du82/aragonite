er-2024-9-640x640-crop-50-50.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2Fc459518f7e-1725530098%2Fwerkraum-mitglieder-duer-dominic-kummer-2024-9-640x640-crop-50-50.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2Fc459518f7e-1725530098%2Fwerkraum-mitglieder-duer-dominic-kummer-2024-9-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2Fc459518f7e-1725530098%2Fwerkraum-mitglieder-duer-dominic-kummer-2024-9-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Dür NaturholzmöbelLukas DürLukas DürVorholz 264/2, 6861 Alberschwende+43 664 1439315info@duer-naturholzmoebel.atwww.duer-naturholzmoebel.atduer.naturholzmoebelHeimisches Holz nach ökologischen und baubiologischen Kriterien zu verarbeiten hat sich Lukas Dür groß auf die Fahne geschrieben. Mit Fachwissen, Praxiserfahrung und einer großen Portion Gespür entstehen in der Tischlerei in Alberschwende nachhaltige Naturholzmöbel und Produkte, bei denen man den Unterschied spürt, sieht und riecht. Langlebig und schön erfüllen die Möbel zeitgerechte Ansprüche und machen Freude. Jeden Tag aufs Neue.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2Fc4ea445916-1725530957%2Fwerkraum-mitglieder-duer-dominic-kummer-2024-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2Fc4ea445916-1