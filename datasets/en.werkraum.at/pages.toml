title = "The Werkraumschule - Werkraum Bregenzerwald GmbH"
description = "Die Werkraum Schule Bregenzerwald kombiniert Lehre und Fachschule und dient der kaufmännischen und dualen handwerklichen Berufsausbildung."
full_description = 'Next Generation, The WerkraumschuleThe Werkraum SchuleThe Werkraum Schule Bregenzerwald combines apprenticeship and a trade school into a 5-year educational program that can open all doors and gives you enough time to get a sense of what you are really drawn to. Material and your hands communicate. You can intensively familiarise yourself with the different materials such as wood, cloth, skin/hair, metal, electric, water, concrete, paint, IT, stone, eat, nature or food on 25 afternoons. Additionally in a 4-week internship twice, you will gain an accurate picture of the professions, the companies and the working methods. Your heart will listen.The new Werkraum Schule Bregenzerwald gives you insight into many descriptions and allows you a wide variety of education in the trades: Joiner, glazier, window installer, carpenter, floor layer, upholsterer, tailer/seamstress, shoemaker, feltmaker, hairdresser, metal technician, goldsmith, car mechanic, electrical installation technician, plumber, roofer, tinsmith, bricklayer, painter, printer, baker, butcher, IT technician, graphic artist, stone sculptor, stonemason, gardener, furcae builder<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fdie-werkraum-schule%2Ff8ca16610d-1638547854%2Fbautage-mit-serge-lunin-2018-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fdie-werkraum-schule%2Ff8ca16610d-1638547854%2Fbautage-mit-serge-lunin-2018-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fdie-werkraum-schule%2Ff8ca16610d-1638547854%2Fbautage-mit-serge-lunin-2018-c-fotograf-unbekannt-8-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-nachwuchs%2Fdie-werkraum-schule%2Ff8ca16610d-1638547854%2Fbautage-mit-serg