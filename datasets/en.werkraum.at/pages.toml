title = "Historie - Werkraum Bregenzerwald GmbH"
description = "Der Werkraum Bregenzerwald wurde 1999 zur Förderung von Handwerk und Baukultur gegründet. Kern des Vereins ist das kooperative Miteinander."
full_description = 'Der Verein, HistorieDie Geschichte des Werkraum BregenzerwaldDer Bregenzerwald ist eine höchst interessante Kulturregion. Was die Geschichte der Bau- und Wohnkultur anlangt, trägt diese Züge urbaner Verfeinerung, wie sie in Europa kaum anderswo zu finden ist.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F141f7a7ded-1638876739%2Fwerkraum-bregenzerwald-dorfansicht-andelsbuch-peter-loewy-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Vertreter:innen der Auer Baumeisterzunft haben mit ihren Barockkirchen und Klöstern bedeutsame kunsthistorische Beispiele geliefert. Weit über die Kleinheit der Region und die geringe Bevölkerungszahl hinaus (32.000 Einwohner:innen), sind aus dem Bregenzerwald bedeutsame Vertreter:innen der Kunst und der Politik erwachsen. Auch an der gegenwärtigen Vorarlberger Baukunst hat der Bregenzerwald einen hohen Anteil. Einerseits stammen bedeutende Vorarlberger Architekt:innen aus dem Bregenzerwald, andererseits ist das Handwerk auch Formbildner und Kulturträger. Parallel zur neuen Architektur Vorarlbergs hat es zu einer unverwechselbaren Handschrift gefunden.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fhistorie%2F004fba1864-1639385423%2Fwanderer-warten-auf-den-bus-haltestelle-glatzegg-bus-stop-krumbach-c-alex-kaiser-bregenzerwald-tourismus-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" sty