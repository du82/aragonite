raum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F7971054958-1639157459%2Fschtubat-kueche-200521-147-1024x683-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F7971054958-1639157459%2Fschtubat-kueche-200521-147-1024x683-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F12fcef8536-1642673889%2F2022-01-14-17werkraummitglieder-piapiapia-11-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F12fcef8536-1642673889%2F2022-01-14-17werkraummitglieder-piapiapia-11-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2F12fcef8536-1642673889%2F2022-01-14-17werkraummitglieder-piapiapia-11-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2Fa2a0f2764f-1642673872%2F2022-01-14-17werkraummitglieder-piapiapia-9-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2Fa2a0f2764f-1642673872%2F2022-01-14-17werkraummitglieder-piapiapia-9-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffairkocht%2Fa2a0f2764f-1642673872%2F2022-01-14-17werkraummitglieder-piapiapia-9-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Die FAIRKOCHT-Produkte sind hochwertigste, regionale Nahrungsmittel bei denen Reinheit, Natürlichkeit, umweltfreundliche Nachhaltigkeit und Fairness state of the art sind. Eine Haltung, die wir im Werkraum Bregenzerwald wieder finden und weswegen wir gerne Mitglied sind.“Art des HandwerksLebensmittelhandwerkGründungsjahr2020Werkraum Mitglied seit2021BetriebsartGmbHAngestellte2–4VertriebOnlineshop und VerkaufsraumSchlüsselprodukteGeschichten im Glas, Gastronomiebelieferung, SchulverpflegungArbeitsmittel, -materialienLebensmittelArbeitsmaterialRegionale LebensmittelTechnologie / MaschinenEinweckenBesonderheiten, EinzigartigesReine Naturprodukte. Ohne Geschmacksverstärker. Ohne Konservierungsstoffe. Ohne Zuckerzusatz. Ohne Gluten.'
