h:100%;min-height:100%;max-height:100%" loading="lazy"/>CLARISSAKORKClarissa Steurer, Edwin Steurer und Markus KilgaClarissa Steurer, Edwin Steurer und Markus KilgaDorf 343, 6942 Krumbach+43 664 2675750hallo@clarissakork.comwww.clarissakork.comclarissakorkCLARISSAKORKCLARISSAKORK ist ein unkonventionelles Label für Teppiche und Wohnaccessoires aus Kork – inspiriert von grafischen Mustern, klaren Linien und zurückhaltenden Farben. Ganz Pur und schlicht, hochwertig bestickt oder liebevoll bedruckt für unsere Kleinsten. Alle Produkte werden mit viel Liebe zum Detail von Hand gefertigt. Für die Langlebigkeit ihrer Produkte setzt das Unternehmen von Clarissa Steurer auf die allerhöchste Qualität an Materialien – frei von giftigen Chemikalien und Schadstoffen.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2F86fa4d8fac-1647346219%2Fbroell-cc-032-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2F86fa4d8fac-1647346219%2Fbroell-cc-032-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2F86fa4d8fac-1647346219%2Fbroell-cc-032-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2Ffd007d3100-1647348876%2Fbroell-cc-071-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2Ffd007d3100-1647348876%2Fbroell-cc-071-2560x1706-crop-50-