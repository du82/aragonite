title = "Vorstand - Werkraum Bregenzerwald GmbH"
description = "Aktuell sind im Werkraum Bregenzerwald rund 100 Mitgliedsbetriebe aus den verschiedensten Gewerken zusammengeschlossen. Nirgendwo in Europa gibt es eine vergleichbare Dichte an Handwerksbetrieben."
full_description = 'Der Verein, VorstandVorstand„Als Handwerker:innen, Gewerbetreibende und Partner:innen im Bregenzerwald sehen wir uns in der Pflicht, unsere vielfältigen Möglichkeiten im gemeinsamen Tun zu erhalten und weiter zu entwickeln. Uns verbindet die Überzeugung, dass wir gemeinsam mehr schaffen als alleine. Als Vorstand unterstützen wir gemeinsam mit der Geschäftsstelle im Werkraum Haus diese Zusammenarbeit. Für unsere Region und für die Zukunftsfähigkeit des regionalen Handwerks. Wir gestalten und leben den Werkraum als Plattform und Ort für Austausch, Kooperation und Motivation. So bleibt er auch für künftige Generationen bestehen. In diesem Sinne laden wir unsere regionalen und internationalen Partner:innen, Kund:innen, Gäste und Freunde doch vor allem auch die Jugend ein, mit uns die Zukunftsfähigkeit von regionalem Handwerk zu erleben und zu gestalten.“ – Der Vorstand<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fvorstand%2Ff232eb739b-1686899664%2F20235-2562x.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Neben Cornel Hess, Geschäftsführer der Werkraum Bregenzerwald GmbH, das neue Vorstandsteam (von links nach rechts) Fredy Kloser, Simon Voppichler, Anita Lehner, Helmut Fink, Alois BerchtoldDie Mitglieder vom Werkraum Bregenzerwald Verein haben auf der ordentlichen Generalversammlung am 26.5. 2023 in Au Rehmen im Gebäude von Holzbau Stephan Muxel einen neuen Vorstand gewählt.Das neue Vorstandsteam verzichtet bewusst auf die klassischen Vorstandsstrukturen und möchte die anstehenden Themen als Team voranbringen.'
