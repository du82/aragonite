full_description = 'Handwerk + Form, About Handwerk+FormAbout Handwerk+FormHandwerk + Form is one of the most significant competitions combining design and craftsmanship and a vital force in establishing relationships between local manufacturers and designers from Austria and abroad.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>High quality standards in building and living and great awareness for the importance of materials and proportions have a long-standing tradition in the Bregenzerwald region. The Handwerk+Form competition seeks to bring this heritage to the spotlight and to keep it aliveIt highlights the versatility and innovative capacity of the region’s crafts and trades, ranging from food production to furniture makers, the building industry and service providers. An exhibition showcasing all submissions is arranged alongside the competition.Founded more than two decades ago by the Crafts and Trades Association of the local community of Andelsbuch in cooperation with graphic designer Harry Metzler. Handwerk + Form took place for the eighth time in October 2018. Ever since 2000, Werkraum Bregenzerwald organises this competition – and the legendary walkabout – every three years.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>„The concept of locally made craft products in collaboration with designers can flourish because it addresses a hot topic: the acceleration of the demand of local products with high-end quality which are sustainable for the future. Sustainable in the sense of environmental friendly materialisation and to inherit the pieces to another generation.“ – Rianne MakkinkJury member 2018, architect and partner Studio Makkink&Bey, Rotterdam<img alt="" srcS