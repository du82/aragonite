w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fuber-das-haus%2Fcba17369c9-1658846607%2Fbaukulturtage-bregenzerwald-c-angela-lamprecht-fur-bsbk-und-werkraum-bregenzerwald-141-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Mit dem Werkraum Haus Bregenzerwald möchten wir einen Ort schaffen, der unverkennbare Impulse aussendet, die Tradition des kreativen Miteinander lebendig hält und Innovation ermöglicht. An diesem Ort geben wir der Vielfalt, der Ursprünglichkeit, dem Ideenreichtum und dem Können der Bregenzerwälder Handwerker:innen eine Heimat.Handwerk lebt im Bregenzerwald. Es sind die Menschen im Bregenzerwald, die ihr Herz hier haben und mit ihrem Schaffen andere berühren und inspirieren. Dieses unverkennbare Wälder Lebensgefühl möchte das Werkraum Haus mit Weitsicht und Wertschätzung über die Grenzen hinaus vermitteln und weiterentwickeln.EntdeckenDie Werkraum Ausstellungen – Handwerk und noch mehr erlebenMenschen verfügen über Fähigkeiten, die unser Leben kulturell und qualitativ bereichern. Jedes Gespräch, das wir führen, hat eine Wirkung. Jedes Handwerkstück hat seine Aussagekraft. Mit Architektur können wir Haltung zeigen. Gestaltung und Design führen uns über die Grenzen des Vorstellbaren. Mit den wechselnden Ausstellungen und Veranstaltungen machen wir die Möglichkeiten unseres Schaffens erlebbar.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fuber-das-haus%2F388afa85cc-1658847057%2Fhandwerk-der-zeit-c-angela-lamprecht-fur-werkraum-bregenzerwald-3-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fuber-das-haus%2F388afa85cc-165884705