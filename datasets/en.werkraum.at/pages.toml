1999Gründer, Meilensteine1971: Gründung durch Walter Albrecht; 2008: Betriebsübergabe an Sohn Dieter AlbrechtBetriebsartGmbHAngestellte2–4VertriebMontage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukteHeizung- und Sanitär-Installationen, Planung, energieeffiziente Gebäudetechnik, ModulbauArbeitsmittel, -materialienBüro, Dienst- und Serviceleistungen wie Steuerung, Planung, EnergieserviceTechnologie / Maschinen3D-Planung in den Bereichen Heizung und SanitärSonderlösungenSteuerungen von awa sind hochkomplexe Unikate; maßgeschneiderte, individualisierte Lösungen'
