on:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2Ffd007d3100-1647348876%2Fbroell-cc-071-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2Ffd007d3100-1647348876%2Fbroell-cc-071-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fclarissakork%2Ffd007d3100-1647348876%2Fbroell-cc-071-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Wir sind Mitgliedsbetrieb im Werkraum Bregenzerwald, weil wir die Arbeit jedes einzelnen Mitgliedes sehr schätzen. Es sind alles Expert:innen auf höchstem Niveau, die Arbeiten eines jeden befruchten und inspirieren. Der Austausch miteinander schafft neue Perspektiven und Herangehensweisen. Die Zusammenarbeit macht jede:n Einzelne:n stärker, es ergeben sich viele Chancen, die man als einzelner Betrieb wahrscheinlich nicht hätte.“Art des HandwerksTextil- und NaturstoffbearbeitungGründungsjahr2018Werkraum Mitglied seit2019Gründer, Meilensteine2018: Gründung durch Clarissa Steurer. Start Produktentwicklung, Design, Marketing und Vertriebsaufbau; 2019: Start der eigenen Manufaktur, erste Mitarbeiterin; 2021: Umgründung zur GmbH. Shop-Eröffnung in Langenegg. Vertrieb erfolgt großteils über Onlineshop, zusätzlich 18 Fachhändler für Kinderartikel und fünf Fachhändler für Interior-Teppiche und Accessoires. Release der eigenen Augmented Reality App. Teilnahme bei der TV-Sendung „2 Minuten 2 Millionen“. Speakerin bei der IAW Bodensee. Gewinnerin vom Innovationspreis des Landes Vorarlberg.BetriebsartGmbHAngestellte11–20VertriebOnlineshop, Fachhandelspartner und eigener ShopSchlüsselprodukteTeppiche aus KorkArbeitsmittel, -materialienKorkleder; es kann vielseitig eingesetzt werden, beispielsweise auch für Möbelfronten oder den Bezug von PolstermöbelTechnologie / MaschinenTeil des BetriebsgeheimnissesSonderlösungen99% der Teppiche werden nach Wunschmaß gefertigt, dafür findet sich auf der Website ein Konfigurator; das Korkleder kann individuell bestickt werden, fast alle Produkte sind individualisierbarBesonderheiten, EinzigartigesBestickte Teppiche aus Korkleder gibt es nur bei CLARISSAKORK. Der hohe Grad an Individualisierung in Kombination mit einem Onlineshop ist einzigartig.'
