herei-fetz%2Fa50eaf67bf-1638547843%2F2021-01-20viehundfleischverarbeitungfetz-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffleischerei-fetz%2Fa50eaf67bf-1638547843%2F2021-01-20viehundfleischverarbeitungfetz-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffleischerei-fetz%2Fa50eaf67bf-1638547843%2F2021-01-20viehundfleischverarbeitungfetz-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Durch unsere Mitgliedschaft im Werkraum haben wir den Stellenwert unseres handwerklichen Wissens wieder selbst erkannt und schätzen gelernt. Die gelebte Gemeinschaft im Verein macht Spaß und ist auf viele Arten bereichernd.“Art des HandwerksLebensmittelhandwerkGründungsjahr1962Werkraum Mitglied seit2016Gründer, Meilensteine1962: Gründung des Betriebes durch Kaspar Fetz. Anfangs Handel mit landwirtschaftlichen Waren, kurz darauf Konzentration auf den Vieh- und Fleischhandel inkl. Schlachtung; 1977: Neubau und Vergrößerung der Betriebsstätte in Andelsbuch; 1995: Anton Fetz wird Geschäftsführer; 1997: Der Schlachthof wird erweitert und auf EU-Standard ausgebaut. Export von Fleisch in andere EU-Länder ist somit möglich. Spezialisierung auf Rinder, Kühe und Kälber, ausschließlich aus der Region; 2009: Übernahme von „Rudi’s Metzg“ in Lauterach; 2019: Übersiedlung des Produktionsbetriebs „Rudi’s Metzg“ in den Hauptbetrieb nach Andelsbuch, somit befinden sich nun Schlachtung, Zerlegung und Produktion unter einem DachBetriebsartGmbH & Co KGAngestellte11–20VertriebEigener VerkaufsraumSchlüsselprodukteFleischwaren aus unserer RegionArbeitsmittel, -materialienLebensmittel (Wurst- und Speckwaren)Technologie / MaschinenSchlachtung und Zerlegung von Rindern und Kälbern, für den Handel, Gastronomie und PrivatkundenSonderlösungenKomplette Schlachtlinie nach EU-Standard; spezielle Lagerung von Rindfleisch: Dry Age- und FettlagerungBesonderheiten, EinzigartigesDie Fleischerei Fetz kauft den Landwirt:innen im Bregenzerwald und Vorarlberg ihr Schlachtvieh ab und trägt somit zu einer funktionierenden Landwirtschaft in Vorarlberg bei.'
