ia%2Fpages%2Fder-verein%2Fmitglieder%2Ffrau-kaufmann%2F9fe144470b-1638547846%2F2021-02-03karinkaufmann-piapiapia-2-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffrau-kaufmann%2F9fe144470b-1638547846%2F2021-02-03karinkaufmann-piapiapia-2-640x640-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Frau KaufmannKarin und Ernst KaufmannKarin und Ernst KaufmannMühle 1197, 6863 Egg+43 676 4954144karin@fraukaufmann.atwww.fraukaufmann.atfrau_kaufmann_Frau KaufmannDie Küche von Karin Kaufmann ist saisonal und regional. Eine Ausnahme macht sie nur bei Gewürzen, wenn sie ein einzigartiges Aroma haben. Die Produkte, die sie in ihrer Gewürzwerkstatt herstellt, sollen das mühsame Suchen und Kombinieren von Zutaten erleichtern. Zum Einsatz kommen Karins Gewürze in der Kochschule. Dort kocht sie gemeinsam mit ihren Gästen Menüs laut Programm oder bietet maßgeschneiderte Kochformate für besondere Anlässe. Dabei immer zu spüren ist, dass Kochen für Karin keine Arbeit, sondern konzentrierte Entspannung ist. Vor allem ist es ein sinnliches Handwerk. Das, worauf es ankommt, kann man nicht aus einem Kochbuch nehmen oder vom Fernsehen abschauen. Das muss man selber mit den Händen spüren, gesehen und probiert haben.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffrau-kaufmann%2F901e408e52-1638547846%2F2021-02-03karinkaufmann-piapiapia-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffrau-kaufmann%2F901e408e52-1638547846%2F2021-02-03karinkaufmann-piapiapia-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 