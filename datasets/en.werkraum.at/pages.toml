full_description = 'Das Haus, KinderprogrammHandwerk erleben für KinderEin wichtiger Teil unserer Aufgabe im Werkraum ist die Wissensvermittlung an Kinder. Mit unserem Programm bieten wir jungen Menschen die Möglichkeit, mit dem Handwerk in Berührung zu kommen und dieses mit allen Sinnen zu begreifen.Termine und Anmeldunginfo@werkraum.at+43 (0) 5512 26386Angebot für Schulklassen und KindergärtenKinderworkshopsWerde zur/zum Handwerker:in! Im Rahmen des Workshops können die Kinder ganz frei ein eigenes Möbelstück entwerfen und mit unterschiedlichen Materialien als kleines Modell bauen.Gruppenpreis auf Anfrage.Dauer ca. 2,5 StundenTermine und Anmeldung unter: info@werkraum.at / +43 5512 26386<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Fkinderprogramm%2F650cddeccc-1709213421%2Fhandwerk-form-juryrundgang-dominic-kummer-2023-4300-kl-1536x-q95.jpg&amp;w=1920&amp;q=75 192