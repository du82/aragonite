full_description = 'AnreiseAnreiseWerkraum Bregenzerwald GmbHHof 8006866 AndelsbuchÖsterreichAnfahrt via Google MapsMit dem AutoAus Deutschland kommend: Autobahn A14 bis Ausfahrt DORNBIRN NORD – Achraintunnel – Alberschwende – Egg – Andelsbuch Aus der Schweiz kommend: Dornbirn – Autobahn A 14 bis Ausfahrt DORNBIRN NORD – Achraintunnel – Alberschwende – Egg – Andelsbuch Vom Arlberg kommend: Lech – Warth – Au – Mellau – Andelsbuch Von Oberstaufen/ Allgäu kommend: Oberstaufen – Riefensberg – Langenegg – Egg – Andelsbuch Über den Riedbergpass kommend: Riedbergpass – Hittisau – Egg – AndelsbuchÖffentliche AnreiseAnreise mit der Bahn bis Bregenz oder Dornbirn – Umstieg auf einen öffentlichen Bus. An der Haltestelle „Andelsbuch Gemeindeamt“ halten die Buslinien 850 und 840. Von dort führt ein 2-minütiger Fußweg zum Werkraum Bregenzerwald.Mehr Informationen:fahrplan.vmobil.at<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.png&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.png&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fanreise%2F485c7d92c7-1638778727%2Fanreise-ins-werkraumhaus-c-bregenzerwald-tourismus-2560x.p