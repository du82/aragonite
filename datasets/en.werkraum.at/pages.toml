pia-640x640-crop-42-35.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fda3fb89fca-1638547845%2F2021-02-03fetzcolor-piapiapia-640x640-crop-42-35.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Fetz MalereiMichael FetzMichael FetzBühel 521, 6861 Alberschwende+43 5579 4319info@fetzcolor.atwww.fetzcolor.atfetzcolorEin Rockgitarrist spielt mit 3 Griffen vor 1000 Leuten. Ein Jazzgitarrist spielt mit 1000 Griffen vor 3 Leuten. Wenn Fetzcolor aus Alberschwende diesen Gedanken auf ihr Handwerk überträgt, ist eines klar: Der Handwerksbetrieb von Veronika und Michael Fetz ist der Jazzer unter den Malern und verpasst dem Farbhandwerk gemeinsam mit ihren 10 Mitarbeiter:innen good vibrations in allen erdenklichen Farbtönen. Das Portfolio reicht von Farbkonzepten über Malereien, Restaurierungen und Beschriftungen.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-wid