title = "Handwerk+Form 2023 - Werkraum Bregenzerwald GmbH"
description = "2023 findet der bedeutende Gestaltungswettbewerb Handwerk+Form zum neunten Mal statt."
full_description = 'Handwerk + Form, Handwerk+Form 2023Handwerk+Form 2023Handwerk+Form, einer der bedeutendsten Gestaltungswettbewerbe im Handwerk und fand vom 13. bis 22. Oktober 2023 zum 9. Mal statt.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F3447ac7797-1692121609%2F20236-1536x-q95-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Impulsgeber für regionale HandwerkskulturDer Gestaltungswettbewerb Handwerk+Form forciert den Austausch von Bregenzerwälder Handwerksbetrieben mit gestaltungskompetenten Menschen aus dem In- und Ausland. Durch den Wettbewerb entstehen neue und oft langjährige Arbeits- und Geschäftsbeziehungen mit internationaler Reichweite. Die Handwerk+Form wurde 2023 zum neunten Mal ausgetragen.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F9350d58af5-1697443024%2Fh-f-preistraeger-2023-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>EinreichungenÜber 35 Handwerksbetriebe aus dem Bregenzerwald entwickelten zusammen mit nationalen wie internationalen Gestalter:innen 79 Objekte in hoher Ausführungs-, Form- und Materialqualität.H+F Preisträger 2023JuryAm 16. und 17. September 2023 hat eine unabhängige, international besetzte, fachkundige Jury ihre Bewertung vorgenommen: Nicola Stattmann (Designerin, Frankfurt), Corvin Cristian (Architekt, Bukarest), Stefan Diez (Designer, München), Eckart Maise (Design Consultant, Basel), Harry Metzler (Grafikdesigner, Schwarzenberg).<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F5b81100c9b-1692122897%2F20236-1536x-q95-3-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fb90e7a67a2-1692123202%2F20236-1536x-q95-5-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>RundgangDer Rundgang führte durch historische Andelsbucher Gebäude, die als Schauplätze für die Ausstellung und eingereichten Objekte dienten.Handwerk+Form 2023 wurde wieder durch die Raiffeisenbanken im Bregenzerwald unterstützt, die das Preisgeld zur Verfügung gestellt hat.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2Fe2bdd7eac8-1676385794%2Fac-005apetrarainer-fur-cukrowicz-nachbaur-architekten-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>„Handwerk braucht Form und umgekehrt. Der Anreiz, über gemeinsames Arbeiten schöne und praktische Dinge zu erfinden, bringt Menschen zusammen. Die Belohnungsind Freundschaften, gute Produkte und ein einzigartiges Ausstellungsformat.“Andreas Cukrowicz, Architekt„Handwerk+Form ist meiner Meinung nach eine super Möglichkeit, um aufzuzeigen, was sich im Handwerk und auch im eigenen Betrieb designmäßig wie auch technisch alles tut. Es ist außerdem spannend, sich der „Konkurrenz“ und einer Jury zu stellen und so neue Inputs und Meinungen zu erhalten. Ganz abgesehen von der Reichweite und dem Stellenwert des Wettbewerbs.“Simon Voppichler, Ofenbau Voppichler<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fhandwerk-form-2023%2F2def25df40-1639139514%2F2021-01-19voppichler-bypiapiapia-1536x-q95.jpg&amp;w=3840&amp;q=75" decodi