full_description = 'Der Verein, Werkraum FreundeWerkraum Freunde„Der Verein der Freunde unterstützt den Werkraum Bregenzerwald, im Besonderen das Kulturangebot und das Forschungs- und Bildungsprogramm im Werkraum Haus.“– Valerie Keiper-Knorr, Obfrau der Werkraum Freunde<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fc4812a24cd-1639149264%2Ffreunde-gv-wochenende2021-7freunde-hinterholzer-1536x-q95.png&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Die Werkraum Freunde setzen sich zur Aufgabe, das kulturelle Programm im Werkraum Bregenzerwald zu fördern. Allen Menschen, die sich mit gesellschaftlichen und kulturellen Belangen des Handwerks befassen und sich engagieren möchten, bieten die Freunde eine einzigartige Plattform.Die Freunde sind Botschafter für den Werkraum und für die Region. Ihre Erfahrungen und Perspektiven aus anderen Regionen und Lebensbereichen tragen sie in den Werkraum hinein. Im Gegenzug bietet der Freunde Verein seinen Mitgliedern ein abwechslungsreiches Veranstaltungsprogramm mit Werkstattbesuchen, Vorträgen und organisierten Reisen.VorstandObfrau: Valerie Keiper-KnorrVizeobfrau: Traudl HerrhausenSchriftführerin: Tanja KronibusKassier: Markus StrolzBeirat: Markus Beer, Margit Hinterholzer, Walter Lingg, Anton Wirth<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fb2eb69980d-1639150023%2Fvon-der-hand-in-den-mund-iv-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fb2eb69980d-1639150023%2Fvon-der-hand-in-den-mund-iv-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fwerkraum-freunde%2Fb2eb69980d-1639150023%2Fvon-der-hand-in-den-mund-iv-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border: