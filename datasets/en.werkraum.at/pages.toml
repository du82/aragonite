-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fadler-grossdorf%2Fd724cd15ae-1642673614%2F2022-01-14-17werkraummitglieder-piapiapia-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Mir gefällt die Idee des Werkraum Bregenzerwald, die Leistungen seiner Mitglieder unter einem Dach professionell und innovativ zu präsentieren. Zudem entstehen durch Kooperationen Ideen, Herausforderungen und auch neue Kontakte.“Art des HandwerksLebensmittelhandwerkGründungsjahr2013Werkraum Mitglied seit2021BetriebsartEinzelunternehmenAngestellte5–10VertriebIm Wirtshaus bzw. auch teilweise DeliverySchlüsselprodukteSonntagsessenArbeitsmittel, -materialienLebensmittelArbeitsmaterialIm Adler in Grossdorf wird Sonntag für Sonntag ein möglichst authentisches immer wechselndes Menü serviert.Technologie / MaschinenKonventionelle Küchengeräte und viel HandarbeitBesonderheiten, EinzigartigesSonntagsgasthaus'
