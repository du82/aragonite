iner, Ingenieur- und SachverständigenbüroErich ReinerErich ReinerPlatz 39, 6870 Bezau+43 5514 4170info@reiner.atwww.reiner.atIn seinem Ingenieurbüro für Holzwirtschaft und Bauphysik in Bezau stellt Erich Reiner den Umgang mit Holz sowie energieeffizientes Bauen, Immobilienbewertung und Nachhaltigkeit in den Fokus seiner Arbeit als Berater und Sachverständiger. Mit Hilfe der Branchenspezialisierung, langjährigen Erfahrung und Fachkompetenz durfte das Büro nicht nur die Projektleitung für das Österreich-Haus für die Olympischen Winterspiele 2010 in Vancouver übernehmen, sondern auch schon verschiedenste kleinere und größere Projekte unterstützen. Erich Reiner ist der Regionalvertreter von www.holz-von-hier.eu in Österreich, Südtirol und Liechtenstein. Holz-von-Hier® ist ein international anerkanntes Umweltzeichen und bringt auf einfache Art und Weise Verbindlichkeit in das aktuelle Thema Regionalität, auch im Bauwesen. Mit Holz-von-Hier® regional-klimaneutral.<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fdi-erich-reiner-ingenieur-und-sachverstaendigenbuero%2F633871d9d3-1638547849%2F2021-01-22erichreineringenieur-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fdi-erich-reiner-ingenieur-und-sachverstaendigenbuero%2F633871d9d3-1638547849%2F2021-01-22erichreineringenieur-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fdi-erich-reiner-ingenieur-und-sachverstaendigenbuero%2F633871d9d3-1638547849%2F2021-01-22erichreineringenieur-bypiapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min