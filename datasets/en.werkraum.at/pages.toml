["https://en.werkraum.at/das-haus/fuehrungen"]
title = "Führungen - Werkraum Bregenzerwald GmbH"
description = "Der Werkraum Bregenzerwald bietet exklusive Führungen mit verschiedenen Themenschwerpunkten durch das Werkraum Haus an."
full_description = 'Das Haus, FührungenFührungenIm Werkraum Haus sind Führungen durch die aktuelle Ausstellung und zur Architektur des Werkraum Hauses möglich. Wir möchten dadurch die außergewöhnliche Geschichte des Hauses und des Vereins weitertragen. Dabei entstehen Einblicke in unsere Arbeit und die Themenvielfalt, die uns jeden Tag begleitet.Anfragen und Anmeldungeninfo@werkraum.at+43 (0) 5512 26386Öffentliche FührungenÖffentliche Führungen durch das Werkraum Haus und Depot finden jeden Mittwoch um 11 Uhr und jeden Donnerstag um 16 Uhr statt. Regulär: € 13,00 pro PersonErmäßigt: € 12,00 pro PersonKeine Anmeldung erforderlich.Hinweis: Das Werkraum Depot ist nur über eine Treppe zugänglich.Individuelle FührungenIndividuelle Führung durch das Werkraum DepotMindestbeitrag Führung: € 150,00Regulär: € 13,00 pro PersonErmäßigt: € 12,00 pro PersonIndividuelle Führungen nur mit Voranmeldung: info@werkraum.at / +43 5512 26386<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Ffuehrungen%2Ffead6f2dfc-1740823415%2Fwerkraum-depot-4965-c-michael-felder-fontain-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Ffuehrungen%2Ffead6f2dfc-1740823415%2Fwerkraum-depot-4965-c-michael-felder-fontain-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Ffuehrungen%2Ffead6f2dfc-1740823415%2Fwerkraum-depot-4965-c-michael-felder-fontain-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fdas-haus%2Ffuehrungen%2Fabaef1a2a8-1740823269%2Fwerkraum-depot-4864-c-michael-f