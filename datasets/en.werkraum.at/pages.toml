full_description = 'Handwerk + Form, Über Handwerk+FormÜber Handwerk+FormHandwerk+Form ist ein wichtiger Impulsgeber für die regionale Handwerkskultur im Bregenzerwald. Als Gestaltungswettbewerb forciert er den Austausch mit gestaltungskompetenten Menschen aus dem In- und Ausland. <img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fda805afa55-1638785105%2Fh-f-2018-juryrundgang-c-matthias-dietrich-5-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bau- und Wohnkultur stehen im Bregenzerwald in einer langen Tradition, gestalterisches Feingefühl für Material und Maß wurden hier schon früh entwickelt. Handwerk+Form soll das Verständnis dafür fördern und lebendig halten. Im Vordergrund des Wettbewerbs steht die Vielseitigkeit und Innovationskraft in allen Bereichen des Handwerks, von der Lebensmittelerzeugung über die Möbel- und Baubranche bis hin zu Dienstleister:innen. Der Wettbewerb soll die aktuellen Leistungen und die Produktqualität im Handwerk beeinflussen und heben. In einer begleitenden Ausstellung werden sämtliche Einreichungen gezeigt.Gegründet wurde Handwerk+Form mit dem legendären Ausstellungsrundgang 1991 auf Anregung des Handwerkervereins Andelsbuch in Zusammenarbeit mit dem Grafikdesigner Harry Metzler. Seit dem Jahr 2000 schreibt der Werkraum Bregenzerwald den Wettbewerb alle drei Jahre aus.<img alt="" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2Fb9bb4301e7-1638785061%2Fh-f-2018-juryrundgang-c-matthias-dietrich-7-1536x-q95.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>„Qualität und Bandbreite der eingereichten Arbeiten sind beeindrucken und machen große Lust darauf, mehr über die Aktivitäten der Bregenzerwälder Betriebe zu erfahren.“ – Marianne Goebl, Jurymitglied 2018, Geschäftsführerin artek, Helsinki<img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fhandwerk-form%2Fueber-handwerk-form%2F85a97987da-1639389615%2Ffruehschoppen-handwerk-form-2018-by-matthias-dietrich-web-001-2560x