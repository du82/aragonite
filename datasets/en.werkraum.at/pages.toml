-1638547846%2F2021-01-20werkraummitglieder-johannes-17-2560x1706-crop-54-31.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2Fa72b9735bc-1638547846%2F2021-01-20werkraummitglieder-johannes-19-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2Fa72b9735bc-1638547846%2F2021-01-20werkraummitglieder-johannes-19-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2Fa72b9735bc-1638547846%2F2021-01-20werkraummitglieder-johannes-19-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2F35825c061b-1638547846%2F2021-01-20werkraummitglieder-johannes-18-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2F35825c061b-1638547846%2F2021-01-20werkraummitglieder-johannes-18-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffiger-kunstschmiede%2F35825c061b-1638547846%2F2021-01-20werkraummitglieder-johannes-18-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Der Werkraum Bregenzerwald ist eine sehr gute Plattform für die Präsentation unseres Unternehmens für eine umfangreiches Zielpublikum. Er zeichnet sich durch die große Dichte an regionalen, ausgezeichneten Handwerksbetrieben aus. Auch kleine Betriebe bekommen ein Netzwerk, das ihnen den Zugang zu gewünschten Kund:innen ermöglicht.“Art des HandwerksMetallhandwerkGründungsjahr1997Werkraum Mitglied seit1999Gründer, Meilensteine1997: Gründung durch Peter Figer in Andelsbuch, in der ehemaligen Schlosserei Pfanner, anfangs mit einem Mitarbeiter; 2000: Umzug nach Bezau in das neu errichtete Firmengebäude, Aufstockung auf 7–9 Mitarbeiter:innenBetriebsartEinzelunternehmenAngestellte5–10VertriebMontage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukteAlle Arten von Sonderlösungen und Anfertigung von Einzelstücken für Privatpersonen und Architekt:innen, Möbel- und Designprojekte aller Art inklusive KunstschmiedearbeitenArbeitsmittel, -materialienAlle Arten von Metall, abgestimmt auf Kund:innenwünscheTechnologie / MaschinenHandwerksmaschinenSonderlösungenSchmiedearbeiten, Grabkreuze, Restaurationen, Schriften, Gravuren, Messing-Arbeiten für den gehobenen MöbelbauBesonderheiten, EinzigartigesGemeinsam mit den Kund:innen wird die passende Lösung erarbeitet.'
