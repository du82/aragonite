l=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Fduer-naturholzmoebel%2F98d60292e0-1638547845%2F2021-01-19tischlereiduer-bypiapiapia-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Seit der Gründung sind wir Mitgliedsbetrieb beim Werkraum Bregenzerwald. Ich sehe das als Chance, als Kleinbetrieb sichtbar zu werden – sei es bei der Mitwirkung diverser Ausstellungen oder auch bei der Teilnahme an Handwerk+Form. Ich schätze das Miteinander und die Kommunikation der Mitglieder untereinander.“Art des HandwerksTischlereiGründungsjahr1994Werkraum Mitglied seit1999BetriebsartEinzelunternehmenAngestellte1–2VertriebMontage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukteSowohl Einzelmöbel als auch gesamte Wohnhauseinrichtungen in Massivholz, möglichst mit einer natürlichen Oberflächenbehandlung Arbeitsmittel, -materialienHeimische Hölzer, vorwiegend heimische Weißtanne, die direkt beim Produzent eingekauft wirdTechnologie / MaschinenModerne StandardmaschinenSonderlösungenSchranktüren aus massiver Weißtanne mit eingefrästen, außen nicht sichtbaren GratleistenBesonderheiten, EinzigartigesSeit dem Bestehen von Handwerk+Form jedes Mal gemeinsam mit namhaften Designer:innen oder mit Eigenentwürfen vertreten: mehrmals als Preisträger bei Handwerk+Form ausgezeichnet.'
