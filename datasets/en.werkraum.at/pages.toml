erei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fd5ee6133da-1638547845%2F2021-02-03fetzcolor-piapiapia-3-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="" srcSet="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fac5481f47a-1638547845%2F2021-02-03fetzcolor-piapiapia-2-2560x1706-crop-50-50.jpg&amp;w=1920&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fac5481f47a-1638547845%2F2021-02-03fetzcolor-piapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fcms.werkraum.at%2Fmedia%2Fpages%2Fder-verein%2Fmitglieder%2Ffetz-malerei%2Fac5481f47a-1638547845%2F2021-02-03fetzcolor-piapiapia-2-2560x1706-crop-50-50.jpg&amp;w=3840&amp;q=75" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 3„Der Werkraum Bregenzerwald ist Netzwerk und steht für Austausch mit den anderen Handwerkern:innen, er bietet eine Plattform für die Zusammenarbeit.“Art des HandwerksMalereiGründungsjahr1966Werkraum Mitglied seit2004Gründer, Meilensteine1966: Firmengründung durch Ewald Fetz; 2005: Umbau und Erweiterung Werkstatt. Der Betrieb wird jetzt in zweiter Generation von Sohn Michael Fetz geführt; Erfolge: 2021: Ausgezeichneter Lehrbetrieb in Vorarlberg, zum zehnten Mal in Folge. Staatliche Auszeichnungen als Lehr- und Qualtitätsbetrieb. Zwei Weltmeistertitel / Goldmedaillen im Beruf der Maler:innen bei den „Worldskills“ durch Teilnehmer:innen aus dem Betrieb. Jeweils ein erster und zweiter Platz bei „Fit for Future“, einer Auszeichnung für Lehrbetriebe in der Kategorie bis 25 Mitarbeiter:innen.BetriebsartGmbHAngestellte11–20VertriebMontage der Produkte, Produktion vor Ort bzw. auf BaustellenSchlüsselprodukteFarbkonzept, Malen, Restaurieren, BeschriftenArbeitsmittel, -materialienFarben aller Art, Kalk, Ton, Lehmputz, Gold, Tapeten, FolienTechnologie / MaschinenHistorische und moderne Techniken, auch in KombinationSonderlösungenHandwerk = tägliche Sonderlösungen und Spezialanfertigungen, individuell auf jede Baustelle abgestimmt für Gastronomie, Privatbereich und SakralbautenBesonderheiten, EinzigartigesFetz Malerei kennt sowohl historische als auch moderne Materialien und Techniken und wenden diese oft auch in Kombination und als Sonderlösung an. Starker Fokus auf Lehrlingsausbildung.'
