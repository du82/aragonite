["https://en.werkraum.at/der-nachwuchs/die-werkraum-schule"]
title = "Die Werkraumschule - Werkraum Bregenzerwald GmbH"
description = "Die Werkraum Schule Bregenzerwald kombiniert Lehre und Fachschule und dient der kaufmännischen und dualen handwerklichen Berufsausbildung."
full_description = "1. JahrIm ersten Jahr erfolgt eine spannende Einführung in die Welt der Werkstoffe. Durch praxisnahe Werkunterrichtseinheiten und Betriebsbesuche werden die handwerklichen Fertigkeiten trainiert und in den Betrieben direkt angewendet. Ein kaufmännisches Praktikum und zwei Schnupperwochen im Sommer bieten erste Einblicke ins Arbeitsleben. Zudem stehen von Anfang an Werkraum-Coaches zur Seite, um den Ausbildungsweg der Schüler:innen optimal zu gestalten. 2. JahrIm zweiten Jahr liegt der Fokus auf den Handwerkstagen. Hier besteht die Möglichkeit, ein oder zwei Unternehmen auszuwählen, um deren Betriebsabläufe, Arbeitsweisen und Aufgaben im Detail kennenzulernen. Im Sommer wird das Wissen in einem 4-wöchigen Praktikum vertieft, wodurch ein hautnaher Einblick in den Berufsalltag gewonnen wird. 3. JahrDas dritte Jahr bringt den Abschluss der Handelsschule mit sich und umfasst ein spannendes praktisches Projekt. In Teamarbeit erfolgt die Planung, Umsetzung und Präsentation des Projekts. Die gesammelten praktischen Erfahrungen unterstützen dabei, eine fundierte Entscheidung für die berufliche Zukunft zu treffen. Nach dem 3. JahrNach dem dritten Jahr beginnt die Lehrzeit. Mit dem Abschluss der Handelsschule besteht die Möglichkeit, in vielen Betrieben eine verkürzte Lehre zu absolvieren. Der Besuch einer fachspezifischen Berufsschule sorgt für optimale Voraussetzungen für den späteren Erfolg."
author = "Werkraum Bregenzerwald GmbH"
year_published = 2025
clearnet = "https://en.werkraum.at/der-nachwuchs/die-werkraum-schule"
