ta-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Bild 1 von 6Lasst uns Freunde werden!Tragt mit euren Mitgliedsbeiträgen und Spenden dazu bei, das kulturelle Programm im Werkraum Bregenzerwald zu fördern. Interessierten stehen folgende Möglichkeiten zum Beitritt zur Verfügung:Freund Jahresbeitrag € 100FreundePartner-Tarif (2 Personen) € 150Förderer Jahresbeitrag € 250Firma Jahresbeitrag € 400Ihre Vorteile#1 Freier Eintritt: Deine Mitgliedschaft öffnet dir ganzjährig die Tür zu allen Ausstellungen im Werkraum Haus#2 Persönliche Einladungen: Du wirst zu allen Eröffnungen und Veranstaltungen im Werkraum Haus eingeladen#3 Werkstattbesuche und Kulturreisen: Die Werkraum Freunde organisieren fachlich begleitete Exkursionen für dich#4 Führungen, Vorträge, Gespräche: Du erhältst bei ausgewählten Sonderveranstaltungen des Werkraum Bregenzerwald ErmäßigungenIch beantrage zum nächstmöglichen Termin meine unbefristete Mitgliedschaft (kündbar jährlich bis spätestens 30. November) alsFreundJahresbeitrag € 100Freund Partner-Tarif(2 Personen) € 150FördererJahresbeitrag € 250FirmaJahresbeitrag € 400Meinen Mitgliedsbeitrag überweise ich nach Erhalt des Aufnahmeschreibens auf das Konto „Verein der Freunde des Werkraum Bregenzerwald“ Raiffeisenbank Mittel- und Hinterbregenzerwald IBAN AT98 3742 3000 0005 5400, BIC RVVGAT2B423.AnredeFrauHerrVornameNachnameStraße, HausnummerPLZ, Ort, LandE-Mail-AdresseBerufAbschickenNoch Fragen? Dann schreib an: info@werkraum.at'
