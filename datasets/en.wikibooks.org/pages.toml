["https://en.wikibooks.org/wiki/OpenSCAD_User_Manual"]
title = "OpenSCAD User Manual - Wikibooks, open books for an open world"
full_description = '''Toggle the table of contents OpenSCAD User Manual 6 languages EspañolFrançaisItaliano日本語Русский中文 Edit links BookDiscussion English ReadEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadEditEdit sourceView history General What links hereRelated changesUpload fileSpecial pagesPermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikimedia CommonsWikipediaWikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world OpenSCAD logo Introduction[edit | edit source] OpenSCAD is software for creating solid 3D CAD objects. It is free software and available for GNU/Linux, Microsoft Windows and Mac OS X. Unlike most free software for creating 3D models (such as the well-known application Blender), OpenSCAD does not focus on the artistic aspects of 3D modelling, but instead focuses on the CAD aspects. So it might be the application you are looking for when you are planning to create 3D models of machine parts, but probably is not what you are looking for when you are more interested in creating computer-animated movies or organic life-like models. OpenSCAD, unlike many CAD products, is not an interactive modeler. Instead it is something like a 2D/3D-compiler that reads in a program file that describes the object and renders the model from this file. This gives you (the designer) full control over the modelling process. This enables you to easily change any step in the modelling process and make designs that are defined by configurable parameters. OpenSCAD has two main operating modes, Preview and Render. Preview is relatively fast using 3D graphics and the computer's GPU, but is an approximation of the model and can produce artifacts; Preview uses OpenCSG and OpenGL. Render generates exact geometry and a fully tessellated mesh. It is not an approximation and as such it is often a lengthy process, taking minutes or hours for larger designs. Render uses CGAL as its geometry engine. OpenSCAD provides two types of 3D modelling: Constructive Solid Geometry (CSG) extrusion of 2D primitives into 3D space. SVG is used for 2D while Autocad DXF files can be used as well for the data exchange format for 2D outlines. In addition to 2D paths for extrusion it is also possible to read design parameters from DXF files. Besides DXF files, OpenSCAD can read and create 3D models in the open 3mf, STL, OFF and many more file formats. OpenSCAD can be downloaded from https://www.openscad.org/. More information is available on the mailing list. Additional Resources[edit | edit source] A clear guided introduction to using OpenSCAD and to the OpenSCAD language is available in the OpenSCAD Tutorial. For Teachers: a basic 25-slide presentation from 2014 is available under GNUFDL to walk your students through the process of using OpenSCAD here. Fablab Lannion (France) edited a nice French-language interactive tutorial that you might appreciate. A "cheat sheet" is a useful quick reference for the OpenSCAD language, with each item linking back to this Wikibook. A list of books can be found here. History[edit | edit source] Periodically the two manuals below get cleaned up or have major transitions. Consider archiving the manuals prior to starting a major update. This can be done for the two 'printable version' links below to the Internet Archive 2018-04-25 The OpenSCAD User Manual - Print Version & The OpenSCAD Language - Print Version 2019-07-22 The OpenSCAD User Manual Which includes links to the archives of the above two printed versions (as of this date). The Wayback Machine no longer has a free user requested site archive, so below is just the two 'printable version' manuals 2020-12-11 The OpenSCAD User Manual - Print Version & The OpenSCAD Language - Print Version The OpenSCAD User Manual[edit | edit source] A printable version of OpenSCAD User Manual is available. OpenSCAD_User_Manual (edit it) Introduction First Steps The OpenSCAD User Interface Input Devices Customizer Import - STL, 3MF, OFF, AMF, DXF, SVG, CSG SVG Import Export - STL, 3MF, OFF, AMF, DXF, SVG, CSG, PNG STL Export CSG Export DXF Extrusion Other 2D formats Example Projects Strandbeest Paths Using an external Editor with OpenSCAD Integration with other applications Using OpenSCAD in a command line environment Building OpenSCAD from Sources Building on Linux/UNIX Cross-compiling for Windows on Linux or Mac OS X Building on Windows (Outdated) Building on Windows (New) Building on Mac OS X Submitting patches Frequently Asked Questions Libraries Tips and Tricks Command Glossary - Very short name and syntax reference The OpenSCAD Language Reference[edit | edit source] A printable version of OpenSCAD User Manual is available. The_OpenSCAD_Language (edit it) The OpenSCAD Language General - READ THIS FIRST - comments, values and data types, variables, vectors, objects, getting input 3D objects - 3D Primitive Solids - cube, sphere, cylinder, polyhedron 3D to 2D Projection 2D Objects 2D Primitives - square, circle, polygon Text - Generate text using installed or user supplied font files; functions to retrieve text metrics. 2D to 3D - linear_extrude, rotate_extrude Transform color rotate, translate, mirror, multmatrix scale, resize offset, minkowski, hull Combining transformations Boolean combination union, difference, intersection, render Other Functions and Operators Conditional and Iterator Functions - for, intersection_for, if, conditional ? :, assign, let Mathematical Operators - General, Vectors, Matrix multiplication Mathematical Functions Trigonometric (cos sin tan acos asin atan atan2) Other (abs ceil concat cross exp floor ln len let log lookup max min norm pow rands round sign sqrt) String Functions - str, chr, ord Type Test Functions - is_undef, is_bool, is_num, is_string, is_list, is_object List Comprehensions Other Language Features - Special '$' variables, echo, render, surface, search , version(), version_num(), parent_module(n) and $parent_modules, assert User-Defined Functions and Modules - Functions, Modules, Children Debugging aids - % # ! * echo External libraries and code files include - SCAD, CSG use - SCAD import - STL, OFF, DXF import_dxf - Deprecated import_stl - Deprecated export - STL, OFF, AMF, 3MF, DXF, SVG, PNG, CSG surface - PNG Work in progress[edit | edit source] This section contains documentation about ongoing work which is available as experimental features in snapshot versions of OpenSCAD or not yet integrated at all and pending in a branch or pull-request at the OpenSCAD github repository. Work in progress<img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=OpenSCAD_User_Manual&oldid=4463870" Categories: Book:OpenSCAD User ManualShelf:3D graphics softwareShelf:Computer programming languagesShelf:Computer aided designHidden categories: Books with print versionAlphabetical/OSubject:3D graphics softwareSubject:3D graphics software/all booksSubject:Multimedia software/all booksSubject:Computer software/all booksSubject:Computing/all booksSubject:Books by subject/all booksSubject:Computer programming languagesSubject:Computer programming languages/all booksSubject:Computer programming/all booksSubject:Computer science/all booksSubject:Computer aided designSubject:Computer aided design/all booksSubject:Design/all booksSubject:Visual arts/all booksSubject:Fine arts/all booksSubject:Humanities/all booksBook:Wikibooks Stacks/BooksShelf:3D graphics software/all booksShelf:Computer software/all booksDepartment:Computing/all booksShelf:Multimedia software/all booksShelf:Computer programming languages/all booksShelf: