full_description = '''Sanskrit 4 languages বাংলাEspañolहिन्दी中文 Edit links BookDiscussion English ReadLatest draftEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadLatest draftEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikimedia CommonsWikifunctionsWikipediaWikiquoteWikivoyageWiktionaryWikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world The latest reviewed version was checked on 19 February 2023. There is 1 pending change awaiting review. Sanskrit is an old Indo-Aryan language once spoken throughout India. Many poems, epics, and prayers are written in it. Although not widely spoken anymore, it gave rise to many of the modern languages of India and influenced several more languages that are not related to it; Sanskrit is also still used as a language of culture and religion in India. In the past, Sanskrit was written in a variety of scripts by people from various places. Today, a modified version of the Devanagari script has been agreed upon as a standard. General Sanskrit lessons[edit | edit source] Introduction to Sanskrit Basic grammar Nouns Verbs Pronouns Adjectives Sandhi Words and Phrases Cultural[edit | edit source] History Culture Clothing Sanskrit script[edit | edit source] Devanagari Transliteration Harvard-Kyoto coding[edit | edit source] a A i I u U e ai o au aM aH (or a:) ka kha ga gha Ga (nasal "ng") ca cha ja jha Ja (nasal "ny") ta tha da dha na Ta Tha Da Dha Na (retroflex) pa pha (not "fa") ba bha ma ya ra la va ha A bb ah Glossary[edit | edit source] Nouns Verbs Adjectives Numbers Phrases and idioms See also[edit | edit source] Wikner's introduction to Sanskrit is a good start. Sanskrit: An Easy Introduction to an Enchanting Language by Professor Ashok Aklujkar is also recommended. <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Sanskrit&oldid=4352668" Categories: Book:SanskritShelf:Languages of AsiaHidden categories: Subject:Languages of AsiaSubject:Languages of Asia/all booksSubject:Languages/all booksSubject:Books by subject/all booksBook:Wikibooks Stacks/BooksShelf:Languages of Asia/all booksDepartment:Languages/all booksAlphabetical/SFreshly started booksBooks by completion status/all books'''
