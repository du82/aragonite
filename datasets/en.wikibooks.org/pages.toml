title = "Marathi - Wikibooks, open books for an open world"
full_description = '''Marathi 1 language 한국어 Edit links BookDiscussion English ReadEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikimedia CommonsWikifunctionsWikipediaWikiquoteWikivoyageWikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world Learn Marathi (marAThi) मराठी language To type in Marathi language on Wiki Projects as shown in this video supprt clip first select, मराठी and then अक्षरांतरण option, or select 'मराठी लिपी' for inscript option, Click on the 'cc to change the subtitle languages to Marathi, English, Sanskrit, Kokani,Ahirani. Note: To use this book, your web browser must first be configured to display Marathi language characters (i.e. Devnagari script). If the characters in the grey box below appear as blank boxes or garbage, it is not properly configured. येथे तुम्हाला मराठी अक्षरे दिसावयास हवीत ! Marathi is 15th largest language by number of people who speak Marathi. There is large ethnic Marathi diaspora across the globe. If you are staying overseas you can look for Maharashtra Mandals for getting coaching support in Marathi language in many countries across the globe. To know more about Marathi language click the following links. Brief Index • Marathi language • Marathi Alphabet • Marathi Grammar : • Nouns, • Pronouns • Verbs • Vocabulary: • Marathi Words • Family Relationships • Numbers • Days • Months • Phrases: • Common Phrases • Colours: • Common Colours We need your help in: • Improving this book; • Need pictures of Maharashtra and Marathi culture at Wikimedia commons so we can use them to have more content in this book • Need sound files for following individual Marathi words : दिंडी, पगडी, उपरणे, कुर्ता, धोती, घागर, चोळी, नऊवारी, तुतारी, बी • Need Marathi 30 seconds to 60 seconds songs and rhymes audio-video media clips. Show new selections Who can learn Marathi ?There are following categories of people who use or study Marathi as second language. People having Marathi mother-tongue but studied in English or semi-English medium People having Marathi mother-tongue but lost or on the verge of losing touch with Marathi language Such people whose family is multilingual in the sense one of the parent or family member is Marathi speaking. Such people whose mother-tongue is other than Marathi but studied Marathi language as first or second language. Pupils of Marathi speaking non resident Indians Pupils of Migrants to non Marathi speaking areas Those who want to learn Marathi language as foreign language. If one informs us on talk page of this article, which of the above background people want to learn Marathi language, then probable we can have more customised support for the given audience. The teaching approach While the traditional teaching method will be available; We additionally provide here a different approach. Adult education experts say that human beings usually remember words as pictures and not as single alphabet so we support here with randomly displayed Marathi words with pronunciation with few additional tips on the main page itself so every time you visit you learn new word with ease is the target. Similarly we are also supporting on this page with learn with pictures feature This helps to understand words with cultural context and again makes easy to understand and remember. We will also do an effort to explain words from Marathi songs and rhymes We will also try to highlight similarities of Marathi and European words as Indoeuropean languages, also along with Latin and Sanskrit info where available. Marathi language has borrowed words also from Arabic, Persian and other geologically neighbouring languages we will make endeavour to explain those words also wherever possible. For advance users we will show sentence translations randomly. And also in near future for those who know Hindi already we will try to provide support from Hindi language Wikibooks project. Have you understood the concepts and if you have some good ideas you also can join adding up info to this book as you learn. For this book we need support also from flash 'Gif' image experts and sound experts So we hope you will enjoy learning and contributing to knowledge with this book. Learn with pictures दिंडी = dinDi; a ritual pilgrimage in Maharashtra. Note Marathi language does not have small or capital letters, for Roman transliteration when we use small d it pronounced for द as in delhi. When we use capital D pronounced for ड as Doctor as most of D pronunciations in English language. पगडी = pagaDi; alternate पागोटे = pAgoTe The pinkish red turban traditional Marathi head gear. उपरणे = uparaNe; a cotton maffalar/stroll (many times used like a long cotton napkin) कुर्ता = kurtA; a cotton shirt with long sleeves Every time a different random picture, Keep coming keep learning! Learn with easeबी = Seed pronounced as B Pronunciation as of English alphabet B same pronunciation is in Marathi as बी = In Marathi बी means seed (of any plant; for singular usage only, plural is different we will not get in to plural at this stage) Note pronunciation of English word "Bee" is also similar. Remember pronunciation बी is not necessarily as of other words starting with B Remember pronunciation बी consonant ब् as in 'Bucket'; so just ब् is without vowel. To make sound as in English word Bee vowel sound ई 's is added to consonant ब् with ी sign. Hence, ब् + ी = बी We learned: Consonant ब् Series of this consonant : प्, फ्, ब्, भ् , म् and vowel sign to go with consonants ी for vowel ई ; In English many spellings with ee like Bee, See, Pee contain longer sound like ई ( ी) also few English words with single e like 'me' have longer ई ( ी) vowel sound. (Sounds formed with English i vowel are usually shorter like 'big', 'pig' are shown in Marathi with different vowel इ ( ि) ; To make the difference more clearer; English word 'keen' contains longer vowel pronunciation as of ई ( ी) and word 'kin' has shorter pronunciation as of इ ( ि) ) Vowels in Marathi language अ, आ, इ, ई = ी , उ, ऊ, ए, ऐ, ओ, औ, ऋ,ॠ, ऌ,ॡ, ॲ, ऑ Useful external resources A Kaushik Lele blog supported with youtube helps Marathi Online from uchicago.edu (Need to use download feature) A support page from Marathi language wikipedia Understanding Devanagari alphabates for Tamilians How to write Marathi essay ? (निबंध लेखन कसे करावे ?) on Marathi Wikibooks project. References Devanagari script (Wikibooks) Marathi literature List of Marathi writers http://www.culturopedia.com/Literature/marathi_literature.html https://www.manase.org/en/maharashtra.php?mid=68&smid=21&did=0&dsid=0&pmid=0&id=486 http://www.nd.edu/~milind/posts/marathi.html https://www.manase.org/en/maharashtra.php?mid=68&smid=21&did=0&dsid=0&pmid=0&id=486 http://dsal.uchicago.edu/dictionaries/molesworth/ तुम्ही काय करू शकता नमस्कार Pronounce: 'namaskār' (audio needed) Greeting or Salutation by folding hand as shown in the picture <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Marathi&oldid=4413388" Categories: Book:MarathiShelf:Languages of AsiaHidden categories: Alphabetical/MSubject:Languages of AsiaSubject:Languages of Asia/all booksSubject:Languages/all booksSubject:Books by subject/all booksBook:Wikibooks Stacks/BooksShelf:Languages of Asia/all booksDepartment:Languages/all booksFreshly started booksBooks by completion status/all books'''
