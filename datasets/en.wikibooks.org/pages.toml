full_description = '''LaTeX 23 languages العربيةবাংলাČeštinaDeutschEspañolفارسیFrançaisGalegoעבריתՀայերենBahasa Indonesia日本語한국어മലയാളംNederlandsPolskiPortuguêsRomânăРусскийСрпски / srpskiTürkçeTiếng Việt中文 Edit links BookDiscussion English ReadLatest draftEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadLatest draftEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikimedia CommonsWikipediaWikiversityWikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world The latest reviewed version was checked on 10 November 2024. There is 1 pending change awaiting review. LaTeX is a featured book on Wikibooks because it contains substantial content, it is well-formatted, and the Wikibooks community has decided to feature it on the main page or in other places. Please continue to improve it and thanks for the great work so far! You can edit its advertisement template. This book is also available as a PDF version. This is a guide to the LaTeX typesetting system. It is intended as a useful resource for everybody, from new users who wish to learn, to old hands who need a quick reference. TeX and LaTeX TeX is a typesetting computer program created by Donald Knuth, originally for his magnum opus, The Art of Computer Programming. It takes a "plain" text file and converts it into a high-quality document for printing or on-screen viewing. LaTeX is a macro system built on top of TeX that aims to simplify its use and automate many common formatting tasks. It is the de-facto standard for academic journals and books in several fields, such as mathematics and physics, and provides some of the best typography free software has to offer. This book is organized into different parts: Getting Started will provide you with the very first steps to print your first document, from installing the needed software to basic concepts and syntax. Common Elements discusses common features you would expect from a document processor, including fonts, layout, colors, lists, and figures. Mechanics are some topics that are not really necessary to write a basic document, but could help you understand how some parts of the system work. These topics are required for fine-tuning documents. Use them as support for various chapters, as they are often being referred to. Technical Text focuses on different specialized matters, mostly for scientific work. Special Pages is for the structured pages usually put in appendices. Special Documents: this part tackles other kind of documents different from the classic article style. Creating Graphics is for the process of writing graphics from a LaTeX document. Programming or how to create your own macros and packages. Miscellaneous contains everything that does not fit in the previous parts, like project management and other subjects related to LaTeX but not inherent to LaTeX itself. Help and Recommendations : the FAQ encompasses very common pitfalls and important recommendations for everyone, we urge you to read it; the Tips and Tricks are much more specific matters. Appendices. Contents[edit | edit source] This book has a collection for ordering a printed copy of this book for a fee. (edit) (help) A PDF version is available. Created with LaTeX (info) An E-Book Reader optimized PDF Version is available. Wikipedia has related information at TeX and LaTeX If you have questions related to LaTeX, ask at the Q&A. Edit the TOC or the stages Getting Started Introduction Installation Installing Extra Packages Basics How to get help Common Elements Document Structure Text Formatting Paragraph Formatting Colors Fonts List Structures Special Characters Internationalization Rotations Tables Title 