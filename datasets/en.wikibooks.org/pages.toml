title = "কোথায়? কখন? - Where? When? - Wikibooks, open books for an open world"
full_description = '''Toggle the table of contents কোথায়? কখন? - Where? When? Add languages Add links BookDiscussion English ReadEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadEditEdit sourceView history General What links hereRelated changesUpload filePage informationGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Appearance move to sidebar hide From Wikibooks, open books for an open world < BengaliThis page may need to be reviewed for quality. .mw-parser-output .tooltip-dotted{border-bottom:1px dotted;cursor:help}কথা[edit | edit source] Imagine you are at a famous place in Dhaka, and get a call from your friend Myra. বক্তা বাংলা উচ্চারণ ইংরেজি মাইরা আপনি কোথায়? apni kôthae? Where are you? আপনি আমি ধানমন্ডি লেকে আছি। ami dhanmondi leke achi. I'm at Dhanmondi Lake. মাইরা আপনি কখন পৌঁছালেন? apni kôkhon pôuchhalen? When did you arrive? আপনি দুপুরে পৌঁছালাম। dupure pôuchhalam. I arrived in the afternoon. মাইরা ওটা সুন্দর জায়গা! কতক্ষন থাকবেন? oţa shundôr jayga! kôtôkhon thakben? That's a beautiful place! How long will you stay? আপনি আরেকটু ঘুরব, সন্ধ্যায় ফিরব। arekţu ghurbo, shondhae firbo. I'll explore a bit more. I'll return in the evening. মাইরা চা খেতে যাবেন কখন?। cha khete jaben kôkhon? When will you go for tea? আপনি কিছুক্ষণের মধ্যেই যাব। Kichukṣaṇēra madhyē'i yāba I'll go in a little while. <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/wiki/Bengali/Lesson_3" Category: Book:Bengali'''
