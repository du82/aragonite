title = "Bengali/Asking questions - Wikibooks, open books for an open world"
full_description = '''Toggle the table of contents Bengali/Asking questions Add languages Add links BookDiscussion English ReadEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world < Bengali কি সমস্যা? In this chapter we shall discuss the basics of question-asking. কথা[edit | edit source] মানুষ বাংলা বলা ইংরেজি হাবিব এই গাছের মধ্যে, এটা কি? ei gachher môddhe, eţa ki? In this plant, what is this? বাপ্পা জানি না, আমাকে দাও। কোথায় থাকে? jani na, amake dao. kothai thake? I don't know, give it to me. Where is it? হাবিব পাতার নিচে বসে। আমার জন্যে দাঁড়াও। patar niche boshe. amar jônno dârao. It sits beneath the leaves. Wait for me. বাপ্পা কতক্ষণ লাগে ওটা নাওয়া? kôtôkkhon lage oţa nawa? How long does it take, getting that out? হাবিব এখন ভুলে যাই। কেন উঠে না এই জিনিস? ekhon bhule jai. keno uţhe na ei jinish? Now I forget. Why doesn't this stand? বাপ্পা একি! কিভাবে তাড়াতাড়ি চলে যায়? eki! kibhabe taŗataŗi chole jae? Whoa! How does it go away so fast? হাবিব ওর ফুল রাখে; নাও ওটা। কখন আসে আমাদের গাড়ি? or ful rakhe; nao oţa. kôkhon ashe amader gari? It leaves its flower: take it. When does our car come? মানে[edit | edit source] We have inundated the dialogue with lots of question words, which we hope you caught on to; here's a rundown of what they are: বাংলা বলা ইংরেজি কি? / কী? ki? what? কে? ke? who? কখন? kôkhon? when? কোথায়? kothae? where? কীভাবে? kibhabe? in what manner? কতক্ষণ? kôtôkkhon? how long [in time]? কেন? keno? why? আর ক্রিয়াপদ - more verbs[edit | edit source] The dialogue was also inundated with more verbs, some of whose simple present tense conjugations are given below. Remember the scheme we introduced in the last section. বাংলা ধাতুরূপ ইংরেজি জানা জানি জানিস জানো জানে জানেন to know ভুলে যাওয়া (see যাওয়া) to forget দেওয়া দেই দিস দাও দেয় দেন to give নেওয়া নেই নিস নাও নেয় নেন to take থাকা থাকি থাকিস থাকো থাকে থাকেন to stay চলে যাওয়া (see যাওয়া) to leave [a place] ওঠা উঠি উঠিস ওঠো ওঠে ওঠেন to stand রাখা রাখি রাখিস রাখো রাখে রাখেন to leave [in a place] চর্চা[edit | edit source] TODO <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Bengali/Asking_questions&oldid=3538021" Category: Book:Bengali'''
