title = "Eric 6 User's Guide - Wikibooks, open books for an open world"
full_description = '''Eric 6 User's Guide Add languages Add links BookDiscussion English ReadLatest draftEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadLatest draftEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Appearance move to sidebar hide From Wikibooks, open books for an open world The latest reviewed version was checked on 7 June 2024. There are template/file changes awaiting review. Eric logotype featuring a snake. About This Guide[edit | edit source] .mw-parser-output .ambox{border:1px solid #a2a9b1;border-left:10px solid #36c;background-color:#fbfbfb;box-sizing:border-box}.mw-parser-output .ambox+link+.ambox,.mw-parser-output .ambox+link+style+.ambox,.mw-parser-output .ambox+link+link+.ambox,.mw-parser-output .ambox+.mw-empty-elt+link+.ambox,.mw-parser-output .ambox+.mw-empty-elt+link+style+.ambox,.mw-parser-output .ambox+.mw-empty-elt+link+link+.ambox{margin-top:-1px}html body.mediawiki .mw-parser-output .ambox.mbox-small-left{margin:4px 1em 4px 0;overflow:hidden;width:238px;border-collapse:collapse;font-size:88%;line-height:1.25em}.mw-parser-output .ambox-speedy{border-left:10px solid #b32424;background-color:#fee7e6}.mw-parser-output .ambox-delete{border-left:10px solid #b32424}.mw-parser-output .ambox-content{border-left:10px solid #f28500}.mw-parser-output .ambox-style{border-left:10px solid #fc3}.mw-parser-output .ambox-move{border-left:10px solid #9932cc}.mw-parser-output .ambox-protection{border-left:10px solid #a2a9b1}.mw-parser-output .ambox .mbox-text{border:none;padding:0.25em 0.5em;width:100%}.mw-parser-output .ambox .mbox-image{border:none;padding:2px 0 2px 0.5em;text-align:center}.mw-parser-output .ambox .mbox-imageright{border:none;padding:2px 0.5em 2px 0;text-align:center}.mw-parser-output .ambox .mbox-empty-cell{border:none;padding:0;width:1px}.mw-parser-output .ambox .mbox-image-div{width:52px}html.client-js body.skin-minerva .mw-parser-output .mbox-text-span{margin-left:23px!important}@media(min-width:720px){.mw-parser-output .ambox{margin:0 10%}}@media print{body.ns-0 .mw-parser-output .ambox{display:none!important}}Eric 6 was first released in 2014 and has been updated from time to time by the developer, Detlev Offenbach. This guide was started in mid-2020, based on the then-current Eric 6 version 20. The developer subsequently announced that he was planning changes to the Human Machine Interface, and later, that Eric 7 was in development. In that light, work was suspended on the guide. The intention is to re-purpose this material in support of a User's Guide to Eric 7, once it is released, with perhaps some updates here in non-version specific areas. The goal of the Eric 6 User's Guide is to help users of Eric 6, a rich and sophisticated integrated development environment (IDE) for Python and other programming languages, notably Ruby. The Eric 6 User’s Guide is under development. The intention is that it will contain detailed information about Eric’s main features, tools and benefits and demonstrate them through some typical use-cases. The guide will probably be most useful to those with some Python experience who are new, occasional or basic users of Eric. Although it may turn into it, the guide is not currently intended to be comprehensive documentation of Eric’s every feature; rather, it focuses on the most popular, useful and powerful ones. It supplements the information available in the Technical Report prepared by Pietro Moras. The Eric developer is not involved in the creation of this Wikibook. Any errors, omissions or misstatements here should not be blamed on him. You Can Help![edit | edit source] The guide is being built by a group of grateful Eric users. You can help by joining in - if you have something to add, don't hesitate. You are strongly encouraged to do so. There are many things you can do: edit existing text to correct errors, improve the writing, or make additions. add new material: use-cases, tutorials or reference material. It doesn't have to be a magnum opus. Pick a favourite Setting or Extra - maybe only a few sentences or paragraphs. upload new images (screen shots or sample renders) - read the details below before you do though. join Wikibooks as a writer/editor by creating an account. Click here for details. You can join Wikibooks as a writer/editor and contribute your own content or improve the existing text. If you're planning to join Wikibooks, you should probably first review the Wikibooks policies and guidelines. You don't actually need to join Wikibooks to edit a page - joining brings added benefits but doesn't prevent others from editing. If you edit that way, you will be listed as anonymous; your IP address will be recorded and displayed. There's a very useful summary of how to edit here. If you're not ready to edit directly, you could make suggestions on a page's Discussion tab or on the Eric Mailing List. How to Edit a Page[edit | edit source] To edit any wiki page (including this one): Click on the Edit tab at the top of the page. Make your change in the large text box. Type an explanation of your change in the Edit summary text box below. Click on the Show preview button below the edit summary to preview your change. If you're satisfied with the result, click on the Save page button. Note that you don't need a Wikibooks user ID to edit - you will be listed as anonymous. Instead of a user name, your IP address will be recorded and displayed. Your contribution will be reviewed before it is officially published. Things you shouldn't add to pages: external links that are not directly related to the module comments or questions regarding the text To ask questions and make comments about exiting material: Click on the Discussion tab at the top of the page. This will take you to the corresponding talk page. Note that the talk page name begins with the "Talk:" prefix. If the topic of your question or comment is under discussion, edit the relevant section. If it's a new topic, click on the Add topic tab at the top of the talk page to start a new discussion. Sign your message by typing ~~~~ at the end. (This will expand to your username and the date.) Remember to save your edit when you're done! To return to the WikiBook, click on the Book tab at the top of the talk page. TODO: adapt to E6UG How to Add a Page[edit | edit source] To add a new page (a section, use-case, subsection) to this book: Edit the Table of Contents section (below) and add a list item with a descriptive wikilink. When you save your edit, the link to the new page will display in red (as a red link); links that connect to an existing pate display as a blue link. After saving your edit, follow the red link to create the module and begin adding content to it. To make it easy to read the book in sequence, each module should have navigation links to the previous module and the next module. Provide these links by transcluding the NAV template at the top and bottom of the page, as shown on the demo page. (If you expect the module to be moved elsewhere in the sequence, you can skip this step.) Preview your work. When you're satisfied with it, use the Save page button to add your new module to the wiki. If you provided navigation links, update the NAV templates on the previous and next modules, if they exist. If you didn't provide navigation links, please ask someone to insert your new module in an appropriate place. One way to do this would be to create a talk page for your new module and type your request there. Images[edit | edit source] Images are a vital part of the User's Guide. They clarify instructions, provide a point of reference, and improve the learning process. However, if the image's copyright is not attributed correctly, we must remove it. This can make a once-great addition useless. Even if you believe you know what copyright to use, please check the Checking copyright page to see how and where you should add copyright information. Please make sure every image you use is not copyrighted or that you have permission to use it. Before uploading an image: Search Wikimedia Commons or look in to see if the image you want to use already exists. (Uploading duplicate images is wasteful.) Remember to attribute the work of others. TODO: adapt B3D:N2P copyright stuff. If you use a Commons image in this WikiBook, please use one of the categories shown in the templates on proper Blender images copyright to make it visible from the category links in the image portfolio. How to Create a Wikibooks Account[edit | edit source] Creating a WikiBooks account is simple. Having an account brings several advantages. Click on Create Account in the first line of any Wikibooks page. Adding your email address is optional but low risk, as it is not disclosed to others when they send you a message. Organization[edit | edit source] The guide is organized into the following sections: Getting Started Overview Installation and Upgrading Quick Start UI Tour Editing with Eric Quick-And-Dirty Editor Eric for GUI Development Settings Extras Virtual Environments Other Tools Appendices Troubleshooting FAQ Licensing and Attributions Contributors Acknowledgments .mw-parser-output .hlist dl,.mw-parser-output .hlist ol,.mw-parser-output .hlist ul{margin:0;padding:0}.mw-parser-output .hlist dd,.mw-parser-output .hlist dt,.mw-parser-output .hlist li{margin:0;display:inline}.mw-parser-output .hlist.inline,.mw-parser-output .hlist.inline dl,.mw-parser-output .hlist.inline ol,.mw-parser-output .hlist.inline ul,.mw-parser-output .hlist dl dl,.mw-parser-output .hlist dl ol,.mw-parser-output .hlist dl ul,.mw-parser-output .hlist ol dl,.mw-parser-output .hlist ol ol,.mw-parser-output .hlist ol ul,