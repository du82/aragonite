full_description = '''Main Page Main PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesUpload fileSpecial pagesPermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Wikimedia CommonsWikimedia FoundationMediaWikiMeta-WikiWikimedia OutreachMultilingual WikisourceWikispeciesWikidataWikifunctionsWikimaniaWikinewsWikipediaWikiquoteWikisourceWikiversityWikivoyageWiktionaryWikidata item Appearance move to sidebar hide From Wikibooks, open books for an open world Featured books • Wikijunior • Cookbook • Browse books • Help • Forum • Using Wikibooks Welcome to Wikibooks, the open-content textbooks collection that anyone can edit. 3,305 books with 97,334 pages. Computing Engineering Humanities Languages Mathematics Miscellaneous Recreational activities Science Social sciences Standard curricula Wikijunior All subjects More featured books... A concise approach to New Zealand History, this textbook covers the first inhabitants, the Maori, the discovery of New Zealand by the Europeans and some of the significant events that have led up to the way the country is in the present day. Image credit More featured children's books... Explore and discover the human body, an incredible machine, with Human Body. For children ages 8–12. Image credit More featured recipes... Pesto is a sauce that originates in the city of Genoa in the Liguria region of northern Italy (pesto alla genovese). It can be used as a sauce for pasta or meat, or can be used as an ingredient in a variety of dishes. One classic use is to spread the pesto onto slices of bread which are then toasted. Image credit More promoted shelves... The Games shelf contains books on games, and includes the subsection shelves athletic games, board games, card games, electronic games, and game design. Image credit More promoted shelves... The Computer Programming shelf contains books on programming, such as LaTeX, OpenSCAD User Manual, Python Programming, and Java Programming. Image credit More promoted shelves... The Languages of Asia shelf contains books on Asian languages, such as Marathi, Bengali, Kannada, Hindi, and Sanskrit. Image credit Wikibooks is hosted by the Wikimedia Foundation, which also hosts: Wikiversity Learning resources Wikipedia Encyclopedia Wiktionary Dictionary and thesaurus Wikiquote Quotations Wikisource Documents Wikispecies Species directory Wikinews News reports Wikivoyage Travel guide Wikidata Knowledge database Commons Media repository Meta Coordination MediaWiki MediaWiki software Phabricator MediaWiki bug tracker Wikimedia Labs MediaWiki development The Wikimedia Foundation is a non-profit organization that depends on your voluntarism and donations to operate. If you find Wikibooks or other projects hosted by the Wikimedia Foundation useful, please volunteer or make a donation. Your donations primarily helps to purchase server equipment, launch new projects, and develop MediaWiki—the software that makes Wikibooks possible. <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Main_Page&oldid=4437578" Category: Main page 83 languages Qafár afAfrikaansÆngliscالعربيةAsturianuAzərbaycancaБашҡортсаБеларускаяБългарскиবাংলাBosanskiCatalàČeštinaЧӑвашлаCymraegDanskDeutschΕλληνικάEsperantoEspañolEestiEuskaraفارسیSuomiFrançaisFryskGalegoעבריתहिन्दीHrvatskiMagyarՀայերենInterlinguaBahasa IndonesiaInterlingueÍslenskaItaliano日本語ქართულიҚазақшаភាសាខ្មែរ한국어KurdîКыргызчаLatinaLimburgsLietuviųLatviešuMalagasyМакедонскиമലയാളംमराठीBahasa MelayuनेपालीNederlandsNorskOc