["https://en.wikibooks.org/wiki/Bengali/Liking_and_disliking"]
title = "Bengali/Liking and disliking - Wikibooks, open books for an open world"
full_description = 'Toggle the table of contents Bengali/Liking and disliking Add languages Add links BookDiscussion English ReadEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Appearance move to sidebar hide From Wikibooks, open books for an open world < Bengali Liking[edit | edit source] In English, liking is expressed by using verbs such as "like", "love" and "enjoy". In Bengali, it is mainly expressed using the verbs "pôchondo kôra" (=like), "bhalobasha" (=love) and "upobhog kôra" (=enjoy). In English, the verbs "like", "love" and "enjoy" take the finite form (that is, they bear signs of their grammatical relation with the subject) and they are followed by a to-infinitive clause or an -ing clause. For example, "he likes sailing" or "she loves to cook", or "I enjoy having a cup of tea in the morning". In Bengali, the verbs "pôchondo kôra", "bhalobasha" and "upobhog kôra" take the finite form (that is, they bear signs of their grammatical relation with the subject) and they are preceded by a clause that finishes in a non-finite verb (verb root + suffix "-te"). How to form a non-finite verb? Take the dictionary form of the verb, such as "pora" (=read), then strip off the final "-a" to get the verb root "por", and finally add a "-te" in the end to get the non-finite form "porte". Pora - a + te = porte. This is equivalent to the to-infinitive ("to read") or the -ing form ("reading") of the verb in English. Observe the following examples. English Bengali Transliteration Samia likes reading books.or Samia likes to read books. সামিয়া বই পড়তে পছন্দ করে Samia boi porte pôchondo kôre. Indrani loves cooking.or Indrani loves to cook. ইন্দ্রানী রাঁধতে ভালবাসে। Indrani randhte bhalobashe. I enjoy the morning breeze very much. আমি ভোরের হাওয়াটা খুব উপভোগ করি। Ami bhorer hawata khub upobhog kori. Disliking[edit | edit source] In English, disliking is expressed by using verbs such as "dislike", "hate" and "loathe". Preference[edit | edit source] In English, preference is expressed by using patterns such as "prefer A to B" or "prefer A rather than B". <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Bengali/Liking_and_disliking&oldid=1873942" Category: Book:Bengali'
