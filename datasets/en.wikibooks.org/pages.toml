full_description = '''Toggle the table of contents Bengali/Common phrases Add languages Add links BookDiscussion English ReadLatest draftEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadLatest draftEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Appearance move to sidebar hide From Wikibooks, open books for an open world < BengaliThe latest reviewed version was checked on 5 July 2022. There is 1 pending change awaiting review. Bengali Phrases[edit | edit source] These are the most commonly used phrases in Bengali. Phrase (বাক্য) IPA (আধ্বব) Bengali script (বাংলা লিপি) Transliteration (প্রতিবর্ণীকরণ) Remarks (মন্তব্য) Hello /ˈnɔmoʃkaɹ/ /ˈasːalamu ˈalaikum/ নমস্কারআসসালামু আলাইকুম nomoskar assalamu alaikum Used by Hindus. Used by Muslims. How are you? /ˈt̪umi ˈkɛmon ˈatɕʰo//ˈapni ˈkɛmon ˈatʃʰen/ তুমি কেমন আছ? আপনি কেমন আছেন? tumi kemon acho?apni kemon achen? (informal) (formal) (I'm) fine. /ˈami ˈbʰalo ˈatɕʰi/ আমি ভাল আছি ami bhalo achi How's it going? /ˈki ˈkʰɔboɹ/ কী খবর? ki khobor? That's okay/fine. /ˈtʰik atɕʰe/] ঠিক আছে ṭhik ache Okay. [ˈatɕːʰa] আচ্ছা। accha. Good-bye. /ˈnɔmoʃkaɹ/ /ˈkʰod̪aɦafez/ নমস্কার খোদা হাফেজ nomoskar khoda haphej Used by Hindus. Used by Muslims. See you later. /ˈpɔɹe ˈd̪ɛkʰa ˈhɔbe/ পরে দেখা হবে pore dekha hobe Talk to you later. /ˈpɔɹe ˈkɔt̪ʰa ˈhɔbe/ পরে কথা হবে Pore kotha hobe See you again. /ˈabaɹ ˈd̪ɛkʰa ˈhɔbe/ আবার দেখা হবে abar dekha hobe Please /ektu/ /ˈd̪ɔe̯a kore/ একটু দয়া করে ekṭu doẏa kore (before verbs)(formal) Thank you. /ˈd̪ʰonːobad̪/ ধন্যবাদ dhonyobad I'm sorry. /ˈami ˈkʰubi ˈd̪ukʰːit̪o/ আমি খুবই দুঃখিত ami khubi duḥkhito. Forgive me. /ˈkʰɔma kɔɹo/ [/ˈkʰɔma koɹben/ ক্ষমা করো ক্ষমা করবেন kṣoma koro kṣoma korben (informal) (formal) English /ˈiŋɹedʑi/ ইংরেজি iṁreji Bengali/Bangla /ˈbaŋla/ বাংলা baṁla Nice/good /ˈbʰalo/ ভাল bhalo Bad /ˈkʰaɹap/ /ˈbadʑe/ খারাপ বাজে kharap baje That one [ˈota] ওটা oṭa How much does this cost? [ˈetaɹ ˈd̪am ˈkɔt̪o] এটার দাম কত? eṭar dam koto? How much does that cost? [ˈotaɹ ˈd̪am ˈkɔt̪o] ওটার দাম কত? oṭar dam koto? What is your name? /ˈt̪omaɹ ˈnam ˈki/ [/ˈapnaɹ ˈnam ˈki/ তোমার নাম কী? আপনার নাম কী? tōmar nam kī? apnar nam kī? (informal) (formal) My name is ___. /ˈamaɹ ˈnam ___/ আমার নাম ___. amar nam ___. I can't understand. /ˈami ˈbudʑʱt̪e ˈpaɹtɕʰi na/] আমি বুঝতে পারছি না ami bujhte parchi na Can you help me? /ˈt̪umi ki ˈamake ˈʃahadʒːo ˈkoɹt̪e ˈpaɹbe/ /ˈapni ki ˈamake ˈʃahadʒːo ˈkoɹt̪e ˈpaɹben/ তুমি কি আমাকে সাহায্য করতে পারবে? আপনি কি আমাকে সাহায্য করতে পারবেন? tumi ki amake sahaĵyo korte parbe? apni ki amake sahaĵyo korte parben? (informal) (formal) I don’t know. /ˈami ˈdʑani na/ আমি জানি না ami jani na I can’t speak Bengali. /ˈami ˈbaŋla ˈbolt̪e ˈpaɹi na/ আমি বাংলা বলতে পারি না ami baṁla bolte pari na I don’t understand Bengali. /ˈami ˈbaŋla ˈbudʑʱi na/ আমি বাংলা বুঝি না ami baṁla bujhi na Can you speak English? /ˈt̪umi ki ˈiŋɹedʑi ˈbolt̪e ˈpaɹo/ /ˈapni ki ˈiŋɹedʑi ˈbolt̪e ˈpaɹen/ তুমি কি ইংরেজি বলতে পারো? আপনি কী ইংরেজি বলতে পারেন? tumi ki iṁreji bolte paro? apni ki iṁreji bolte paren? (informal) (formal) Could you please repeat what you just said? /ˈd̪ɔe̯a koɹe ˈaɹekbaɹ ˈektu ˈbolbe//ˈd̪ɔe̯a koɹe ˈaɹekbaɹ ˈektu ˈbolben/ দয়া করে আরেকবার একটু বলবে? দয়া করে আরেকবার বলবেন? doẏa kore arekbar ekṭu bolbe? doẏakore arekbar ekṭu bolben? (informal)(formal) Yes. /ˈhæ̃/ হ্যাঁ hyã No. [ˈna] না na What? [ˈki] কী? kī? How? [ˈkibʰabe] কীভাবে? kībhabe? <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://en.wikibooks.org/w/index.php?title=Bengali/Common_phrases&oldid=4246405" Category: 