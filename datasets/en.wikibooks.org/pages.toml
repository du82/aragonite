full_description = 'Toggle the table of contents Bengali/Numbers Add languages Add links BookDiscussion English ReadLatest draftEditEdit sourceView history Tools Tools move to sidebar hide Actions ReadLatest draftEditEdit sourceView history General What links hereRelated changesUpload filePermanent linkPage informationCite this pageGet shortened URLDownload QR code Sister projects WikipediaWikiversityWiktionaryWikiquoteWikisourceWikinewsWikivoyageCommonsWikidataMediaWikiMeta-Wiki Print/export Create a collectionDownload as PDFPrintable version In other projects Appearance move to sidebar hide From Wikibooks, open books for an open world < BengaliThe latest reviewed version was checked on 18 January 2025. There are 2 pending changes awaiting review. কত আছে? In this chapter, the subject matter is pretty obvious: but first we need to start by giving the numbers in Bengali from 0 to 99. ১১৩৮৮৫সংখ্যা - Numbers[edit | edit source] (in the form সংখ্যা বাংলা ইংরেজি) ০ শূন্য zero ১ এক one ২ দুই two ৩ তিন three ৪ চার four ৫ পাঁচ five ৬ ছয় six ৭ সাত seven ৮ আট eight ৯ নয় nine ১০ দশ ten ১১ এগারো eleven ১২ বারো twelve ১৩ তেরো thirteen ১৪ চৌদ্দ fourteen ১৫ পনেরো fifteen ১৬ ষোল sixteen ১৭ সতেরো seventeen ১৮ আঠারো eighteen ১৯ উনিশ nineteen ২০ বিশ twenty ২১ একুশ twenty-one ২২ বাইশ twenty-two ২৩ তেইশ twenty-three ২৪ চব্বিশ twenty-four ২৫ পঁচিশ twenty-five ২৬ ছাব্বিশ twenty-six ২৭ সাতাশ twenty-seven ২৮ আটাশ twenty-eight ২৯ ঊনত্রিশ twenty-nine ৩০ ত্রিশ thirty ৩১ একত্রিশ thirty-one ৩২ বত্রিশ thirty-two ৩৩ তেত্রিশ thirty-three ৩৪ চৌত্রিশ thirty-four ৩৫ পঁয়ত্রিশ thirty-five ৩৬ ছত্রিশ thirty-six ৩৭ সাঁইত্রিশ thirty-seven ৩৮ আটত্রিশ thirty-eight ৩৯ ঊনচল্লিশ thirty-nine ৪০ চল্লিশ forty ৪১ একচল্লিশ forty-one ৪২ বিয়াল্লিশ forty-two ৪৩ তেতাল্লিশ forty-three ৪৪ চুয়াল্লিশ forty-four ৪৫ পঁয়তাল্লিশ forty-five ৪৬ ছেচল্লিশ forty-six ৪৭ সাতচল্লিশ forty-seven ৪৮ আটচল্লিশ forty-eight ৪৯ ঊনপঞ্চাশ forty-nine ৫০ পঞ্চাশ fifty ৫১ একান্ন fifty-one ৫২বায়ান্ন fifty-two ৫৩ তিপ্পান্ন fifty-three ৫৪ চুয়ান্