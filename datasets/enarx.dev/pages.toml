title = "Introduction | Enarx"
description = "WebAssembly (abbreviated Wasm) is a binary instruction format for a stack-based virtual machine. Wasm is designed as a portable target for compilation of various programming languages."
full_description = "WebAssembly GuideIntroductionIntroductionWebAssembly (abbreviated Wasm) is a binary instruction format for a stack-based virtual machine. Wasm is designed as a portable target for compilation of various programming languages.Enarx provides a WebAssembly runtime, based on wasmtime, offering developers a wide range of language choices for implementation.WASI (WebAssembly System Interface) is an API that provides access to several operating-system-like features, including I/O, filesystem, sockets, threads, and crypto.Support for WebAssembly and WASI (WebAssembly System Interface) varies from language to language.The following table shows Enarx support and tier information for each language, as well as links to a dedicated Wasm Guide and to the Codex repository with code examples.Wasm GuideCodex RepoEnarx SupportEnarx TierRustRepoExcellentTier 1C++RepoExcellentTier 1CRepoExcellentTier 1GolangRepoExcellentTier 1JavaScriptRepoExperimentalTier 2TypeScriptRepoExperimentalTier 2PythonRepoExperimentalTier 2.NETRepoExperimentalTier 2JavaRepoExperimentalTier 2ZigRepoExperimentalTier 3RubyRepoExperimentalTier 3SwiftRepoExperimentalTier 3AssemblyScriptRepoExperimentalTier 3GrainRepoExperimentalTier 3More information about Wasm/WASI language support are available here:Wasm/WASI popularity/desirabilityWasm/WASI featuresEdit this page"
