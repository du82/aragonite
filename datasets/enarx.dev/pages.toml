title = '43 posts tagged with "Event" | Enarx'
full_description = "Enarx & Steward AttestationMarch 28, 2024Richard ZakSenior Software EngineerTitle: Enarx & Steward Attestation Author: Richard Zak Date: March 28, 2024A discussion on how Enarx and Steward use Certificate Signing Requests (CSRs) to provide remote attestation of a Keep. Steward is a Confidential Computing-aware Certificate Authority which signs CSRs if and only if all attestation checks are successfully validated. This way, the signed certificate, which is part of the Steward CA certificate chain, becomes a token for third parties to ensure that an application secured with Enarx really is secured.Source: EuroProofNet 2024 Working Group 3Link: https://europroofnet.github.io/wg3-dresden24/PDF: Enarx_Steward_Attestation_EuroProofNet24.pdfTags:Event Confidential Computing with EnarxNovember 19, 2023Nick VidalCommunity ManagerTitle: Confidential Computing with Enarx Author: Nick Vidal Date: November 19, 2023Presentation about Confidential Computing and Enarx with leading Rust developers from Europe.Source: RustlabLink: https://rustlab.it/past-editions/2023Tags:Event Modern Community Management: A lesson through acronymOctober 2, 2022Jen Wike HugerVP of MarketingTitle: Modern Community Management: A lesson through acronym Author: Jen Wike Huger Date: November 2, 2022 Learning how to start and run open source community programs starts with m-a-i-n-t-a-i-n-e-r-s. In this talk, find out what each letter in this acronym means for you, whether you’re interested in the field, just getting started in your new role, or a season community manager looking for some new tips!Source: All Things Open 2022Link: https://2022.allthingsopen.org/sessions/2-for-1-the-secret-to-sustainable-open-source-create-your-open-source-project/Tags:Event Unlocking the Cloud with Confidential ComputingOctober 1, 2022Nathaniel McCallumCo-founder of EnarxTitle: Unlocking the Cloud with Confidential Computing Author: Nathaniel McCallum Date: November 1, 2022 CPUs (and even GPUs) which support Confidential Computing are rapidly making inroads into the Cloud, unlocking the Cloud to organizations from sectors like healthcare and finance, who require greater assurances that their sensitive code and data are protected, and who have so far been unable to benefit from the Cloud’s many advantages.In this session, we’ll define Confidential Computing, explain how process-based and VM-based TEEs (Trusted Execution Environments) differ, describe the importance of attestation, and explore existing and upcoming CPUs (and GPUs) that support Confidential Computing: from Intel’s SGX2 and TDX, AMD’s SEV-SNP, IBM’s PEF, Arm’s Realms, RISC-V’s Sanctum, to NVIDIA’s A100.We’ll use Enarx, an open source project which is part of the Linux Foundation, to illustrate how Confidential Computing works, and we’ll showcase some examples to demonstrate why Confidential Computing is key to unlocking the Cloud’s true potential.Source: All Things Open 2022Link: https://2022.allthingsopen.org/sessions/unlocking-the-cloud-with-confidential-computing/Tags:Event"
