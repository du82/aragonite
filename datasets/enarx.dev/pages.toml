["https://enarx.dev/docs/Technical/Attestation-Syscall"]
title = "Attestation Syscall - User Space | Enarx"
description = "syscall number 0xEA01"
full_description = "Technical OverviewAttestation Syscall - User SpaceOn this pageAttestation Syscall - User Spacesyscall number 0xEA01NAME​get_attestation - get the attestation from the CPUSYNOPSIS​For Cssize_t get_attestation(void *nonce, size_t nonce_length, void *buf, size_t buf_length, size_t *technology);Note: a C wrapper has to store the second return value in rdx into technology and a negative rax in errno.RETURN VALUE​On error a negative number is returned as -errno.On success, this call returns the number of bytes placed in buf.technology is filled in with | value | TEE technology identifier | |--------|---------------| | 0 | NONE | | 1 | SEV | | 2 | SGX |LOW LEVEL INTERFACE​Inputs​rdi - input data buffer (const)rsi - input data buffer length, must be 64rdx - output data bufferr10 - output data buffer lengthOutputs​rax - number of bytes written or negative errno (per Linux convention)rdx - TEE technology identifier (enum)Special Case​When rdx (input) is 0 (i.e. NULL):r10 is ignoredno data is written (since the buffer is non-existent)other outputs are the same as if the call had succeeded with a large enough bufferFormat of buf​Serialization is done on the host and deserialization is done in the Wasmtime code payload. Both have access to full std, so all features of serde should be used to ensure a safe data transfer from the untrusted host data.rdx or technology from thegetatt() call decides which of the union members to use.Example union for buf:#[repr(C)]pub union Attestation { Sev_PrivateKeyInfo, Sgx_Attestation, // … to be extended}Suggested serde formats:json - best maintained - most languages have bindingscbor - smaller transfer - standardized, a lot of languages have bindingsbincode - smaller transferERRORS​EFAULT: buf extends outside the process's allocated address space.EINVAL: bufsiz is not positive.EIO: an error occurred getting the attestationEMSGSIZE: provided buffer too smallAttestation Syscall - Shim to HostBecause the method of attestation differs for every architecture, the internal syscall handling differs for each.SEV - post attestation - Shim​No special handling besides the usual is needed.SEV - post attestation - Host​The Loader requests the attestation with the nonce included and places the result at the address given by the shim.SGX - post attestation - Shim​No special handling besides the usual is needed.SGX - post attestation - Host​The Loader requests the attestation with the nonce included and places the result at the address given by the shim.Edit this page"
