["https://enarx.dev/docs/Contributing/Git-hook"]
title = "Git hook | Enarx"
description = "This is a simple script that will run linting and formatting checks when you run git push."
full_description = '''Contributing GuideGit hookGit hookThis is a simple script that will run linting and formatting checks when you run git push.NOTE: This is an optional step! It's valid to run these checks in some other way.To install the hook paste the following into .git/hooks/pre-push:#!/bin/shset -xe# Run linting checks (not completely exhaustive)cargo clippy --all-features --manifest-path=Cargo.toml -- -D warningsif [ -d "internal" ]; then cargo clippy --target=x86_64-unknown-linux-musl --all-features --manifest-path=internal/shim-sgx/Cargo.toml -- -D warnings cargo clippy --target=x86_64-unknown-linux-musl --all-features --manifest-path=internal/shim-sev/Cargo.toml -- -D warnings cargo clippy --target=x86_64-unknown-linux-musl --all-features --manifest-path=internal/wasmldr/Cargo.toml -- -D warningsfi# Run formatting testscargo fmt -- --checkif [ -d "internal" ]; then cargo fmt --manifest-path=internal/shim-sgx/Cargo.toml -- --check cargo fmt --manifest-path=internal/shim-sev/Cargo.toml -- --check cargo fmt --manifest-path=internal/wasmldr/Cargo.toml -- --checkfiexit 0You can skip running this check with:git push --no-verifyEdit this page'''
