full_description = "Enarx 0.7.0: Gutenberg CastleJanuary 16, 2023Dmitri PalVP of Software EngineeringEnarx 0.7.0 has been released with a series of new features, bug fixes and automation improvements.Source: Enarx's BlogLink: https://blog.enarx.dev/enarx-0-7-0-gutenberg-castleTags:Enarx's BlogRelease Unlocking the Cloud with Confidential ComputingDecember 14, 2022Nathaniel McCallumCo-founder of EnarxNathaniel McCallum, co-founder of the Enarx project, gave a talk about Enarx and Confidential Computing at the 10th edition of All Things Open. How do we unlock all of the potential of the cloud while decreasing the risks that are associated and the cost?Source: Enarx's BlogLink: https://blog.enarx.dev/unlocking-the-cloud-with-confidential-computing/Tags:Enarx's Blog WASI language support (part 2)November 8, 2022Nick VidalCommunity ManagerCurrently there are several WASI proposals that are being developed. The State of WebAssembly survey provides a comprehensive overview of the existing WASI proposals and which ones the community are most interested in. There is a lot of interest in I/O, sockets, filesystem, and threads. The Enarx project in particular is investing in advancing WASI support in the Rust language, and we have contributed upstream to sockets, threads, and crypto.Source: Enarx's BlogLink: https://blog.enarx.dev/language-support-for-wasi-2/Tags:Enarx's Blog WASI language support (part 1)November 1, 2022Nick VidalCommunity ManagerSupport for WebAssembly (and WASI) is advancing well across all major programming languages. Assessing how well a language supports WebAssembly/WASI is important because it allows us to understand what's possible with wasmtime and Enarx.Source: Enarx's BlogLink: https://blog.enarx.dev/language-support-for-wasi/Tags:Enarx's Blog CCC at Black Hat and DEF CONAugust 22, 2022Nick VidalCommunity ManagerRichard ZakSenior Software EngineerThe Confidential Computing Consortium (CCC) was present at the 25th edition of Black Hat USA and the 30th