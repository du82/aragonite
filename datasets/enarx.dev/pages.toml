title = "Issues | Enarx"
description = "The Enarx project welcomes bug and feature requests!"
full_description = "Contributing GuideIssuesOn this pageIssuesThe Enarx project welcomes bug and feature requests!This page will help you understand how we use the issue tracker and give you insight into reporting bugs and requesting features.All our work takes place in the main enarx/enarx repo.Bug report​noteBefore filing a bug report, please search to see if an issue already exists for the bug you encountered.Please provide a description of the current behavior you are experiencing and what behavior you were expecting. What steps are needed to reproduce that behavior and what environment are you working on?Bug reportFeature request​Please provide a concise description of the requested feature and justification. If applicable, please provide a suggested approach on how to implement this feature.Feature requestLab machines​noteFor Lab machines, issues should exceptionally be filed on GitLab instead of GitHub.If you found an issue with our Lab machines, please file it on GitLab. If you have a proposed solution, please file a merge request on GitLab.File issue for Lab machines For more information about the Lab machines, please check this page.Labels​To keep our work organised, we make heavy use of labels. These allow us to quickly see all issues relating to conferences, infrastructure or WebAssembly, for instance. Here are the labels we use:documentation: Improvements or additions to documentationbug: Something isn't workingduplicate: This issue or pull request already existsenhancement: New feature or requestexpert help needed:This needs special attention from an area specialist.good first issue: Good for newcomershelp wanted: Extra attention is neededinfrastructure: Improvements or additions to project infrastructureinvalid: This doesn't seem rightquestion: Further information is requestedtech debt: Issues that we recognize create technical debt which will need to be addressed later on. Helps to make this obvious and start planning for it.technology/sev: All SEV related issuestechnology/sgx: All SGX related issuestechnology/wasm: All WASM related issuestriage: news issues are tagged with this label automatically. wontfix: Issues that will not be worked onYou can click on a label name to see the issues that have been tagged with it.Edit this page"
year_published = 2025
