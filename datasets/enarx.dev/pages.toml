["https://enarx.dev"]
title = "Enarx | Enarx"
description = "Enarx: Confidential Computing with WebAssembly"
full_description = "100% Open SourceEnarx is the leading open source framework for running applications in TEEs (Trusted Execution Environments). It's part of the Confidential Computing Consortium from the Linux Foundation.Easy DeploymentEnarx provides a run-time TEE based on WebAssembly, allowing developers to deploy applications without any rewrites from languages like Rust, C/C++, C#, Go, Java, Python, Haskell and many more.Cloud Native, Hardware NeutralEnarx is CPU-architecture independent, letting developers deploy the same application code transparently across multiple targets. It provides a single run-time and attestation framework which is hardware vendor and CSP neutral.DocsLearn more about Enarx. Documentation includes: Getting Started, Installation Guide, Contributing Guide, and Technical Overview.ResourcesFind a list of useful resources: from articles, blog posts, podcasts, to videos. Everything Enarx related gathered in one place.GitHubThe source code of Enarx is available at GitHub. You'll also be able to track issues, bugs, pull requests, and release notes.trainingEventsThe Enarx team is present at the top conferences worldwide, including Linux Security Summit, Open Source Summit, DevConf, and RSA Conference.schedule-calendarMeetingsYou are welcome to join the Enarx Daily meetings. These meetings are open to the public. If you are a newcomer, feel free to join and introduce yourself.chat-bubbleChatJoin the chat at chat.enarx.dev and come say hi, read the conversations, and ask questions. We are happy to answer any questions you might have."
