["https://enarx.dev/resources/tags/article"]
title = '16 posts tagged with "Article" | Enarx'
full_description = "Solving a Confidential Computing Pain Point with WebAssemblyAugust 3, 2022Heather JoslynBack when they worked at Red Hat, Mike Bursell and Nathaniel McCallum grappled with the challenges of confidential computing — isolating an organization’s most sensitive data in a secure enclave while processing it.Confidential computing is of particular use to organizations that deal in sensitive, high value data — such as financial institutions, but also a wide variety of organizations.Source: The New StackLink: https://thenewstack.io/confidential-computing-with-webassembly/Tags:Article What Is WebAssemblyJuly 7, 2021Mary BranscombeAlthough WebAssembly brings languages other than HTML, CSS and JavaScript to the browser, it’s not a JavaScript replacement and it takes a very different approach from Flash, Active X plugins and other techniques that encapsulated non-web code for browsers. Think of it as a small, fast, efficient and very secure, stack-based virtual machine that doesn’t care what CPU or OS it runs on, that’s designed to execute portable bytecode — compiled from code originally written in C, C++, Rust, Python or Ruby — at near-native speed. WebAssembly doesn’t only run in the browser: It started on the client, but is proving very useful on the server.Source: The New StackLink: https://thenewstack.io/what-is-webassembly/Tags:Article Confidential ComputingOctober 15, 2020Nataraj NagaratnamConfidential computing technology protects data during processing. Exclusive control of encryption keys delivers stronger end-to-end data security in the cloud.Source: IBM Cloud Learn HubLink: https://www.ibm.com/cloud/learn/confidential-computingTags:Article Confidential Computing—the emerging paradigm for protecting data in-useSeptember 21, 2020Intel IT Peer NetworkAs computing moves to span multiple environments—from on-prem to public cloud to edge computing—organizations need security controls that can safeguard sensitive intellectual property (IP) and workload data wherever the data resides. Highly regulated applications and mission critical applications need data protection through all its modalities—at-rest, in-transit and in-use, for companies to migrate the data to the cloud where there is a lack of control and visibility in a multitenant environment. As an industry we have generally figured out how to protect data at-rest, and, in-transit. Confidential Computing (CC) is an emerging industry paradigm focused on securing the data in-use.Source: Intel IT Peer NetworkLink: https://itpeernetwork.intel.com/confidential-computing/Tags:Article"
