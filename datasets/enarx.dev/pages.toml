title = '12 posts tagged with "White Paper" | Enarx'
full_description = "White Paper: An Introduction to Confidential ComputingOctober 30, 2022Mike BursellCo-founder of EnarxIf you agree that deploying to the untrusted cloud means that you cannot control access, this technical look at Confidential Computing is for you.Source: ProfianLink: https://profian.com/white-paper/an-introduction-to-confidential-computing/PDF: An Introduction to Confidential Computing.pdfTags:White Paper What is Confidential Computing?October 26, 2022Jen Wike HugerVP of MarketingConfidential Computing is a leading-edge security technology that encrypts sensitive data in use in a public cloud, private cloud or on-premises. It completes the data security triangle since data at rest (in storage) and in transit (across networks) is routinely encrypted.Source: Profian's BlogLink: https://profian.com/what-is-confidential-computing/PDF: What is Confidential Computing.pdfTags:Profian's BlogWhite Paper White Paper: PETs and Confidential Computing ComparedOctober 25, 2022Mike BursellCo-founder of EnarxLearn more about the important characteristics of Privacy-enhancing technologies and how they differ from Confidential Computing.Source: ProfianLink: https://profian.com/white-paper/pets-and-confidential-computing-compared/PDF: PETS and Confidential Computing compared.pdfTags:White Paper White Paper: Enhancing WebAssembly Security with Enarx and Profian AssureOctober 20, 2022Mike BursellCo-founder of EnarxLearn why WebAssembly is a popular way to run applications and is emerging as an alternative to containers.Source: ProfianLink: https://profian.com/white-paper/enhancing-webassembly-security-with-enarx-and-profian-assure/Tags:White Paper White Paper: What Are Confidential VMs?October 15, 2022Mike BursellCo-founder of EnarxConfidential VMs are aimed at “lift and shift” legacy workloads and thus harder to manage. Learn why this makes them difficult to attest and why that matters.Source: ProfianLink: https://profian.com/white-paper/what-are-confidential-vms/Tags:White Paper White Paper: The 3 Types of Runtime Security IsolationOctober 10, 2022Mike BursellCo-founder of EnarxEvery time an application runs on any platform – from the largest mainframe to the smallest IoT device – it executes code as on physical hardware. Given that not all applications, nor all users, are friendly in all...Source: ProfianLink: https://profian.com/white-paper/white-paper-the-3-types-of-runtime-security-isolation/PDF: The Three Types of Runtime IsolationTags:White Paper"
