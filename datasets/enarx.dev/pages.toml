full_description = "Enarx Repo GuideIntroductionOn this pageIntroductionIn this guide, you'll find a walkthrough of the Enarx repositories on GitHub. The outline of the Enarx repositories are:Main crates​enarx:src: backends (code that runs in the host side)internal: wasmldr, shin-sev, shin-sgxexamples: tcp_servertestshelpersallyport: communication channel between untrusted host and guest: mostly syscalls.Secondary crates​ctr0stack: read write stack from Linux kernel for things like environment variablesvsdo: used by SGX to enter an enclaverct1: load binary from disk (static or dynamic)xsave: save x86 cpu stateflagset: handle flagssgx: set of data structures related to SGXmmarinus: Rust mmap (memory map) wrapper (runtime-safe)iocuddle: Rust ioctl (input/output control) wrapper (runtime-safe)noted: macro to generate notes (define size of enclave, etc)Helper crates​lset: types for measuring linear setsnbytes: define constantsuabs: calculates the absolute value of input and returns unsigned integersignrel: maps relationships between integers that only differ by signednessLab machines & workflow​linux: used by the Lab machines (SGX and SEV)spdx: GitHub Actions to find OSI license (written in Python)Edit this page"
