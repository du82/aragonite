full_description = "Enarx & Steward AttestationMarch 28, 2024Richard ZakSenior Software EngineerTitle: Enarx & Steward Attestation Author: Richard Zak Date: March 28, 2024A discussion on how Enarx and Steward use Certificate Signing Requests (CSRs) to provide remote attestation of a Keep. Steward is a Confidential Computing-aware Certificate Authority which signs CSRs if and only if all attestation checks are successfully validated. This way, the signed certificate, which is part of the Steward CA certificate chain, becomes a token for third parties to ensure that an application secured with Enarx really is secured.Source: EuroProofNet 2024 Working Group 3Link: https://europroofnet.github.io/wg3-dresden24/PDF: Enarx_Steward_Attestation_EuroProofNet24.pdfTags:Event Confidential Computing with EnarxNovember 19, 2023Nick VidalCommunity ManagerTitle: Confidential Computing with Enarx Author: Nick Vidal Date: November 19, 2023Presentation about Confidential Computing and Enarx with leading Rust developers from Europe.Source: RustlabLink: https://rustlab.it/past-editions/2023Tags:Event Enarx 0.7.0: Gutenberg CastleJanuary 16, 2023Dmitri PalVP of Software EngineeringEnarx 0.7.0 has been released with a series of new features, bug fixes and automation improvements.Source: Enarx's BlogLink: https://blog.enarx.dev/enarx-0-7-0-gutenberg-castleTags:Enarx's BlogRelease Predictions for powerful WebAssembly in 2023December 22, 2022Mike BursellCo-founder of EnarxThere’s been a flurry of articles over the past few weeks about WebAssembly (often shortened to Wasm) and its future in cloud Computing. This may come as something of a surprise to those who know Wasm only in its initial incarnation, which was as a browser technology, or its second main use case, which is as a gaming technology. Both of these uses are flourishing, but there’s a third, which is as a server technology.Source: Profian's BlogLink: https://profian.com/predictions-for-powerful-webassembly-in-2023/Tags:Profian's Blog What are confidential VMs?December 19, 2022Mike BursellCo-founder of EnarxIf you are keeping up with the latest technology in cloud computing-related security, you have probably seen that several Cloud Service Providers (CSPs) have announced “confidential VMs” as part of their Confidential Computing offering. So, what exactly is a confidential VM? How does this compare to Confidential Computing? And why are cloud providers offering this?Source: Profian's BlogLink: https://profian.com/what-are-confidential-vms/PDF: Enarx and Confidential VMs Compared.pdfTags:Profian's Blog"
