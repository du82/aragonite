["https://enarx.dev/docs/Quickstart"]
title = "Quick Installation | Enarx"
description = "This is the quick installation guide for Enarx. The goal is to help you get started using Enarx right away for development/debugging purposes on Windows, macOS, and Linux."
full_description = '''Installation GuideQuick InstallationQuick InstallationThis is the quick installation guide for Enarx. The goal is to help you get started using Enarx right away for development/debugging purposes on Windows, macOS, and Linux.noteTo build from source, please refer to the complete installation guide.noteFull TEE (Intel SGX/AMD SEV-SNP) and KVM support is available with the published statically compiled Linux binary.Please select your operating system:WindowsmacOSLinuxBefore installing Enarx, we need to install PowerShell (Windows' command line) and winget (Windows' package manager) from the Microsoft Store.Click on the Start menu, type store, and open Microsoft Store.In the search bar, type powershell and click on the Get button to install PowerShell. Do the same for winget. Type winget in the search bar, and click on the Get button to install winget.Open PowerShell from the Start menu and type winget install Enarx to install Enarx.To test enarx we should download a sample WebAssembly file (hello-word.wasm):iwr https://enarx.dev/hello-world.wasm -OutFile hello-world.wasmNow run it using the enarx run command:enarx run hello-world.wasmThere are two ways to install Enarx on macOS, either downloading the binary or using Homebrew.To download and install the macOS binary, enter in the macOS terminal the following commands:curl -L https://github.com/enarx/enarx/releases/download/v0.7.1/enarx-universal-darwin --output enarxsudo install -m 755 enarx /usr/local/bin/enarxYou can also install Enarx using Homebrew, an open-source macOS package manager:https://brew.sh/Type the following command in the macOS terminal to install Homebrew:/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"To install Enarx from the Enarx tap, simply type:brew install enarx/enarx/enarxTo test enarx we should download a sample WebAssembly file (hello-word.wasm):curl https://enarx.dev/hello-world.wasm -o hello-world.wasmNow run it using the enarx run command:enarx run hello-world.wasmThere are a few ways to install Enarx on Linux, either downloading the binary directlty or by using a package manager.RPM InstallationTo install the RPM package on Fedora, CentOS, or RHEL, you can use the following command:sudo yum install -y --nogpgcheck https://github.com/enarx/enarx/releases/download/v0.7.1/enarx-0.7.1-1.x86_64.rpmDPKG InstallationTo install the DPKG package on Ubuntu or Debian systems, you can use the following command:wget https://github.com/enarx/enarx/releases/download/v0.7.1/enarx-0.7.1-1_amd64.debsudo dpkg -i enarx-0.7.1-1_amd64.debBinary InstallationTo install Enarx on Linux, you can download the Enarx binary. For X86_64 architectures (the most common), you would download the enarx-x86_64-unknown-linux-musl binary and for AARCH64 architectures (ARM64 processors) you would download the enarx-aarch64-unknown-linux-musl binary.Download the appropriate Enarx binary (in the case below, we are downloading for X86_64):wget https://github.com/enarx/enarx/releases/download/v0.7.1/enarx-x86_64-unknown-linux-muslnoteThe enarx-aarch64-unknown-linux-musl binary supports only the "nil" backend, and does not use a Trusted Execution Environment (TEE) to run the Wasm application, unlike the enarx-x86_64-unknown-linux-musl binary.Now type the following to install Enarx:sudo install -m 4755 -o root enarx-x86_64-unknown-linux-musl /usr/bin/enarxIf you are on the X86_64 host, it is recommended to also install the signature file:wget https://github.com/enarx/enarx/releases/download/v0.7.1/enarx-x86_64-unknown-linux-musl.sigsudo install -D -m 444 -o root -g root enarx-x86_64-unknown-linux-musl.sig /usr/lib/enarx/enarx.sigTest InstallationTo test enarx we should download a sample WebAssembly file (hello-word.wasm):wget https://enarx.dev/hello-world.wasmNow run it using the enarx run command:enarx run hello-world.wasmWhat's next? Learn how you can compile your application to WebAssembly from various programming languages by studying the WebAssembly Guide.Edit this page'''
year_published = 2025
clearnet = "https://enarx.dev/docs/Quickstart"
