title = '10 posts tagged with "Release" | Enarx'
full_description = "Enarx 0.7.0: Gutenberg CastleJanuary 16, 2023Dmitri PalVP of Software EngineeringEnarx 0.7.0 has been released with a series of new features, bug fixes and automation improvements.Source: Enarx's BlogLink: https://blog.enarx.dev/enarx-0-7-0-gutenberg-castleTags:Enarx's BlogRelease Enarx 0.6.0: Fushimi CastleJuly 6, 2022Paul PietkiewiczProduct ManagerEnarx 0.6.0 has been released with various UX improvementsSource: Enarx's BlogLink: https://blog.enarx.dev/enarx-0-6-0-fushimi-castle/Tags:Enarx's BlogRelease Enarx 0.5.0: Elmina CastleMay 10, 2022Paul PietkiewiczProduct ManagerEnarx 0.5.0 Released! Many new/improved features: New enarx deploy subcommand. SGX with EDMM / SGX2 support. Dev/testing from MacOS and Raspberry Pi 4B now possible.Source: Enarx's BlogLink: https://blog.enarx.dev/elmina-castle/Tags:Enarx's BlogRelease Enarx 0.4.0: Fort of Dhat al-HajjApril 12, 2022Paul PietkiewiczProduct ManagerEnarx 0.4.0 has been released with SGX2 support, improved TLS support, and much more.Source: Enarx's BlogLink: https://blog.enarx.dev/enarx-0-4-0-fort-dhat-al-hajj/Tags:Enarx's BlogRelease Enarx 0.3.0 (Chittorgarh Fort)March 16, 2022Mike BursellCo-founder of EnarxA fair amount of the development for this release has been in functionality which won’t be visible to most users, including a major rewrite of the TEE/host interface component that we call sallyport. You will, however, notice that TLS support has been added to network connections from applications within the Keep. This is transparent to the application, so “Where does the certificate come from?” I hear you ask. The answer to that is from the attestation service that’s also part of this release. We’ll be talking more about that in further releases and articles, but key to the approach we’re taking is that interactions with the service (we call it the “Steward”) is pretty much transparent to users and applications.Source: Alice, Eve and Bob – a security blogLink: https://aliceevebob.com/2022/03/1