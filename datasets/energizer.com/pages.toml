["https://energizer.com/about-flashlights/how-does-a-flashlight-work"]
title = "How Do Flashlights Work? - Energizer"
description = "How Do Flashlights Work? About Flashlights How do Flashlights Work? Flashlight History Flashlight Care 1 – Case   The tube that houses the parts of the flashlight, including the batteries and lamp (light bulb). 2 – Contacts   A very thin spring or strip of metal (usually copper or brass) that is located throughout the […]"
full_description = "1 – Case The tube that houses the parts of the flashlight, including the batteries and lamp (light bulb). 2 – Contacts A very thin spring or strip of metal (usually copper or brass) that is located throughout the flashlight, making the electrical connection between the various parts – the batteries, the lamp, and the switch. These parts conduct electricity and “hook everything up,” completing the circuit. 3 – Switch The flow of the electricity is activated when you push the switch into the ON position, giving you light. The flow of electricity is broken when the switch is pushed into the OFF position, thus turning off the light. 4 – Reflector A plastic part, coated with a shiny aluminum layer that rests around the lamp (light bulb) and redirects the light rays from the lamp to allow a steady light beam, which is the light you see emitting from the flashlight. 5 – Lamp The light source in a flashlight. In most flashlights, the lamp is either a tungsten filament (incandescent bulb) or a light emitting diode (solid state bulb), also known as an LED. The tungsten filament or LED glows when electricity flows through it, thus producing visible light. Tungsten is a natural element and the tungsten filament is a very thin wire. Tungsten lamps must be replaces when the tungsten filament breaks. An LED contains a very small semiconductor (diode) that is encapsulated in epoxy and this part emits light when electricity flows through it. LED’s om flashlights are widely considered “unbreakable” and not replaced – a lifetime lamp. 6 – Lens The lens is the clear, plastic part you see on the front of the flashlight that protects the lamp, since the lamp is made if glass and can easily be broken. 7 – Batteries When activated, the batteries are the power source for your flashlight. Whether you’re outdoors for a nighttime adventure or find yourself in the dark from a power outage after a storm, the convenience of portable light is as close as a simple button on your flashlight. But just how does a flashlight work?"
year_published = 2025
year_updated = 2024
