["https://energizer.com/about-batteries/battery-care"]
title = "Proper disposal, storage, care and handling of your batteries. - Energizer"
description = "Proper disposal, storage, care and handling of your batteries. About Batteries How Batteries Work What is Inside a Battery Battery Chemistry Battery Leakage Battery History Battery Care No Leak Guarantee Battery FAQ Battery Do’s and Don’ts Does storing a battery in the refrigerator help extend its life? Learn some helpful tips on the best way […]"
full_description = "Does storing a battery in the refrigerator help extend its life? Learn some helpful tips on the best way to store, handle and care for your batteries, whether at home or on the road. How does proper or improper charging or storage impact the life of rechargeable batteries? Learn some helpful tips on the best way to store, handle and care for your rechargeable batteries, whether at home, work or at play. Is there a right way and a wrong way to travel with batteries? Learn some helpful tips on the best way to store, handle and care for your batteries when traveling. Planning a trip? You don’t need to leave your batteries at home. Batteries and battery-powered devices are safe to fly with if you follow these simple guidelines from the U.S. Department of Transportation: Per the U.S. Department of Transportation, “batteries pose little risk contained in the devices they power and that taking the battery out of the device does not enhance safety.” For additional information and the latest in battery and battery-powered device transportation, please visit httpss://safetravel.dot.gov/. Although it’s often safe to dispose of used batteries via your normal waste management process, Energizer encourages everyone to recycle their batteries – it’s simply the responsible thing to do. That’s why we’re partnering with important organizations like Call2Recycle for information on recycling single-use batteries and for recycling rechargeable batteries. Disposal in the U.S.As a first step, please determine the type of battery you have and then determine the appropriate disposal method. Note that regulations may vary in your municipality or state so please check your local regulations. If you’re a business disposing of a large quantity of button cell batteries, please contact Energizer’s Customer Service Line at 800-383-7323 or email us. Although it’s often safe to dispose of used batteries via your normal waste management process, Energizer encourages everyone to recycle their batteries – it’s simply the responsible thing to do. That’s why we’re partnering with important organizations like Call2Recycle for information on recycling single-use batteries."
