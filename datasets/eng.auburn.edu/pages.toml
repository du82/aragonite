title = "#Ginning Podcast"
description = "Samuel Ginn College of Engineering"
full_description = '''document.addEventListener('DOMContentLoaded', function() { document.querySelectorAll('.card-text').forEach((cardText) => { const container = cardText.closest('.card-body'); const col1Div = container.querySelector('.col-3'); const computedStyle = window.getComputedStyle(cardText); const lineHeight = parseInt(computedStyle.lineHeight); const maxHeight = lineHeight * 6; const isTruncated = cardText.scrollHeight > maxHeight; if (isTruncated) { const toggle = document.createElement('i'); toggle.className = 'toggle-expand fa fa-angle-down'; // Initial down arrow toggle.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-label', 'Toggle description'); // Positioning styles toggle.style.position = 'absolute'; toggle.style.background = window.getComputedStyle(container).backgroundColor; toggle.style.zIndex = '1'; toggle.addEventListener('click', (e) => { const expanded = toggle.getAttribute('aria-expanded') === 'true'; cardText.style.webkitLineClamp = expanded ? 5 : 'unset'; cardText.style.overflow = expanded ? 'hidden' : 'visible'; toggle.setAttribute('aria-expanded', !expanded); // Toggle arrow direction toggle.classList.toggle('fa-angle-down'); toggle.classList.toggle('fa-angle-up'); }); container.style.position = 'relative'; col1Div.appendChild(toggle); } }); }); .card-body { position: relative; overflow: visible !important; } .toggle-expand { border: none; cursor: pointer; padding: 0 0 0 4px; margin: 0; color: inherit; line-height: 1; } .toggle-expand:hover { color: #0065A3; background: inherit !important; } .card-text { position: relative; padding-bottom: 1em; } Ginning Podcast Hosted by Austin Phillips and Jeremy Henderson from Auburn Engineering's Office of Communications and Marketing, each episode is educational, relatable, sensational. The country's best engineering college deserves the country's best engineering podcast. Advantage Engineering Talk about net worth! Yes, mechanically minded tennis talent (and Lady Tiger legacy) Julie Bedard goes hard — on the court, in the classroom, in life in dang general. In other words, Advantage Auburn. Fri, 14 Feb 2025 Listen: Episode 301 That Creed Speed Auburn Creed? More like Auburn Speed. Check out the #GINNing gang's conversation with Samantha Korac, vehicle dynamics and controls engineer for Auburn's Autonomous Tiger Racing team, who recently helped steer the GAVLAB's gears around the Las Vegas Motor Speedway at up to 170 driver-less miles per hour. Listen below, or on Apple Podcasts, Spotify, Google Play, iHeartRadio or wherever you listen to your favorite podcasts by searching #GINNing. Fri, 07 Feb 2025 Listen: Episode 300 Madison from Madison This senior wants nothing more than to use her communication skills and knack for logistics to help people and overcome the world's greatest challenges. Which is to say, when it comes to selling the strengths and benefits of industrial and systems engineering, nobody's struttin' like Madison Dutton. Fri, 31 Jan 2025 Listen: Episode 299 Smarter Carter From the woods of Columbiana to the Costa da Caparica, junior Anna Carter is living the dream, Birdsonging her away around this great material world of ours one extra engineering mile at a time. Sun, 26 Jan 2025 Listen: Episode 298 Exoskeletons in the Closet Brendon Allen has some exoskeletons in his closet, and the National Science Foundation (NSF) wants to find out more about them.The assistant professor in the Department of Mechanical Engineering was recently tapped for a five-year $588,408 NSF CAREER Award aimed at increasing access to rehabilitation for individuals with movement disorders through a deep learning control framework for home-based hybrid exoskeletons. Fri, 17 Jan 2025 Listen: Episode 297 Computer Scientist, M.D. Assistant computer science professor by day, computational biologist by day, medical doctor by day — Haynes Heaton does it all. Great news for Auburn. Bad news for leukemia. Fri, 10 Jan 2025 Listen: Episode 296 Jon Wilson's War Eagle The legacy of leadership with the Samuel Ginn College of Engineering's Office of Advancement continues. Ladies and gentlemen, welcome back Jon Wilson. Sun, 05 Jan 2025 Listen: Episode 295 The Ambassador Bradley Johnson didn't just want the paper — he wanted Auburn Engineering. Listen to our conversation with the premiere ambassador for one of the highest-ranked online master's of engineering programs in the country on the latest episode of the best podcast in higher education. Fri, 27 Dec 2024 Listen: Episode 294 Mr. Materials He may work in Wilmore. But materials engineering program chair Bart Prorok does his thinking outside the box. Thu, 19 Dec 2024 Listen: Episode 293 Power Player Nintendo? More like GINNtendo. Because senior Caitlinn White, a chemical engineering undergraduate researcher in Auburn's acclaimed Nuclear Power Generation Systems minor who's focusing on developing virtual reality simulations of nuclear concepts, is definitely playing with power. Thu, 12 Dec 2024 Listen: Episode 292 Just Prewitt As a child, Avry Prewitt’s world was filled with construction — Lego towers, pillow forts and elaborate Minecraft creations. That early passion for building grew into a planet-saving purpose. Learn all about the Department of Civil and Environmental Engineering's latest wastewater wunderkind — and the Samuel Ginn College of Engineering's latest graduation marshal — on the latest episode of the best podcast in higher education. Fri, 06 Dec 2024 Listen: Episode 291 Moose Tracks He’s fresh off a win at the 2024 SEC Machining competition in Starkville, working through several pitch competitions en route to Tiger Cage, majoring in industrial and systems engineering, minoring in business engineering technology, and working for the weekend at Auburn Engineering's renowned Interdisciplinary Center for Advanced Manufacturing Systems. In other words, the Moose is loose. Listen to the #GINNing gang's conversation with senior Johnathan Deery on the latest episode of the best podcast in higher education. Fri, 29 Nov 2024 Listen: Episode 290 The Influencer STEM advocating influencer extraordinaire Ruha Tacey may have hit the social media stratosphere. But she hasn't forgotten her roots. Learn about the 2012 chemical engineering graduate's Auburn journey and plans for the future on the latest episode of the best podcast in higher education. Fri, 22 Nov 2024 Listen: Episode 289 High Kicks, High Efficiency From high kicks to high efficiency, from the dance line to the supply line, Nyah Dedeaux does it all. Listen to the industrial and systems engineering senior discuss her Auburn journey on the latest episode of the best podcast in higher education. Fri, 15 Nov 2024 Listen: Episode 288 Not-So-Rotten Tomatoes We've always said "never let a good tomato go to waste." Unless, of course, Bipasyana Dhungana could use it to change the world. Listen to our conversation with the biosystems engineering graduate student and ASABE all-star on the latest episode of the best podcast in higher education. Fri, 08 Nov 2024 Listen: Episode 287 The Marine From the mountains of Nevada to the doors of Wiggins Hall, Avery Wells will fight our country's battle with his degree — mechanical. Fri, 01 Nov 2024 Listen: Episode 286 Goal Keeping The latest episode of the best podcast in higher education explores the drive and determination of mechanical engineering sophomore Jenna Sapong, who knows a little bit about keeping goals. Fri, 25 Oct 2024 Listen: Episode 285 Boom Word to your moms — Ben Bauldree came to drop bombs. Check out the explosive interview with the Auburn aerospace engineering alumnus and pickle pro on the latest episode of the best podcast in higher education. Fri, 18 Oct 2024 Listen: Episode 284 Where There's a Wills, There's a Way Where there's a Wills, there's a way. And an adjustable cup holders for chairs. And a magic cable machine attachment. And, from the sounds of it, an unbelievably bright future. The other thing this Crook has stolen is our hearts. Listen to industrial and systems engineering senior Wills Crook discuss his Auburn-born aspirations on the latest episode of the award-winning #GINNing Podcast. Fri, 11 Oct 2024 Listen: Episode 283 Phantastic Phedra Is there some sort of hocus pocus behind Phedra Peter's fervid focus? Is it just that the industrial and systems engineering junior and student leader superstar believes work — hard work? Find out on the latest episode of the best podcast in higher education. Fri, 04 Oct 2024 Listen: Episode 282 Miss Mercedes Go ahead and call her Miss Mercedes. Because this Jersey-born mechanical engineering senior and Design and Manufacturing Lab devotee has logged more internship hours in Vance, Alabama than LinkedIn can count. Haley Bhend? More like Haley Benz. Thu, 26 Sep 2024 Listen: Episode 281 Parker Thompson Can't Lose Parker Lewis couldn't lose. And neither can Parker Thomas. From touring Würzburg to securing the World Wide Web, this cybersecurity engineering grad student has synchronized his Swatch for success. Thu, 19 Sep 2024 Listen: Episode 280 Handel the Truth Second lieutenant in the Air Force. Three-time Space Camp alum. Third-generation Auburn grad. Second-generation Auburn Engineering grad. ChemE grad student. Graduate Research Assistant. Future astronaut. Future president of Mars. (Don't worry — Handel can handle it.) Thu, 12 Sep 2024 Listen: Episode 279 Dude, You're Getting Adele When it comes to diabetes, America is unfortunately rolling in the deep. Enter 2013 Auburn mechanical engineering grad Mark Norton, co-founder of Adele. After all, be it glucose levels or insulin levels, who better to help people take portable, personal control of their diabetic deets than a man who worked for a sweet little company called Apple? Fri, 06 Sep 2024 Listen: Episode 278 Count Off All right Tiger Fans — let's get it up for a podcast. Senior Ben Timm is one of the leaders down in the Design and Manufacturing Lab in Wiggins Hall. He’s the guy in charge of teaching folks how to machine safely. He chose mechanical engineering because he loved working with his hands. But for the next year, he'll be better known for working with his voice. Are you ready? Fri, 30 Aug 2024 Listen: Episode 277 Story's Time From Sand Mountain to American Water, from commencement stages to the NYT business pages, 1981 industrial engineering graduate Susan Story's legacy of leadership is as dynamic as they come. Fri, 23 Aug 2024 Listen: Episode 276 Track Star Someone has to manage that beautiful, 1.7-mile oval over at the National Center for Asphalt Technology. And DOTs across the fruited, asphalted plains better be thanking their lucky, trucky stars — that someone is Jason Nelson. Thu, 15 Aug 2024 Listen: Episode 275 Slime Time From the Loveliest Village of the Plain comes Mari Miles Dempsey, a senior chemical engineering honors student concentrating in biomedical engineering, and currently researching the effect of acoustics in the growth and further development of physarum polycephalum in the Nature Inspired Fluids and Elasticity Lab at Auburn University. In other words, it's slime time. Fri, 09 Aug 2024 Listen: Episode 274 Ride for the Branford Learn the origin story of an Auburn Engineering ChemE commando on the latest episode of the #GINNing Podcast. Ladies and gentlemen, JaVaris Branford. Sat, 03 Aug 2024 Listen: Episode 273 Leave it to Steber Learn about Auburn's latest College of Engineering grad marshal, Ben Steber. This engineer may not have borders. But he's definitely about to have a banner. Thu, 25 Jul 2024 Listen: Episode 272 Let's Make a Deal Hey Office of Naval Research, why don't you give assistant electrical and computer engineering professor Matthew Kirchner $307,000, and in return he'll figure out which control sequences and flight conditions make it possible for trained pilots to land in the event of engine failure. Sound good? OK, let's make a deal. Thu, 18 Jul 2024 Listen: Episode 271 No One Engineers Like Gaston No one engineers like Gaston, Polymers like Gaston, Does confidential research work like Gaston, As a grad student, yes, she's intimidating, My what a gal, Gaston... Fri, 12 Jul 2024 Listen: Episode 270 Up-Levelin' with Evelyn Cupola Engineering Ambassadors. American Society of Civil Engineers. 100+ Women Strong. Society of Women Engineers. Undergraduate research. Chick-fil-A. Rising civil engineering senior Evelyn Chavez does it all. Sat, 06 Jul 2024 Listen: Episode 269 Of Resins and Residences Plucked from the plastic producing province of El Salvador, Lucila Carias, protege of Auburn polymer pundit Maria Auad, and a bio-resin backing GRA in the Department of Chemical Engineering, is researching ways to 3D print — yep — houses. Thu, 27 Jun 2024 Listen: Episode 268 DBF's BFF Meagan Blosser, outgoing president of Auburn University's Top-20 Design, Build, Fly team, doesn't care how you pronounce her name, because this new Auburn aerospace engineering alumna definitely knows how to... go with the flow.Listen to Blosser describe how she's spreading her wings on the latest episode of the best podcast in higher education. Tue, 11 Jun 2024 Listen: Episode 267 Real Deal Jada Neal Which upcoming bioprocesses engineering senior is grabbing undergraduate research by the horns in order to harness the power of pectin for skincare applications? Which student leader overachiever is ready to make a believer out of Unilever? Yep, it's Jada Neal. She's the real deal. Tue, 11 Jun 2024 Listen: Episode 266 The Death-Watch Beetle of Metal Fatigue The name's Beretta — Stefano Beretta. Learn the origin story of this world-class structural integrity scholar who recently joined Auburn's National Center for Additive Manufacturing Excellence to assist on several projects focused on developing defect-sensitive predictive fatigue models for AM materials. Topics discussed include additive manufacturing, salary cuts, salami and James Bond. Mon, 03 Jun 2024 Listen: Episode 265 Lettuce Now Praise Famous Men Great name. Fresh ideas. Yep, enjoy this conversation with biosystems engineering doctoral student Wellington Arthur on long-term nutrient utilization and evaluation of pathogenic bacteria in a pilot-scale wastewater treatment system for hydroponic irrigation — and lettuce. Tue, 21 May 2024 Listen: Episode 264 The Right Turn at Albuquerque From Albuquerque to Auburn, Los Almosin', Lipke Labbin' ChemE commando Nicole Habbit has found the Loveliest Village a hard habit to break. Tue, 21 May 2024 Listen: Episode 263 Materials Girl Marisa Kelley. Just graduated materials engineering major. Knows who Madonna is. And Tom Petty. In other words, basically a genius. (You're welcome, Florida.) Fri, 10 May 2024 Listen: Episode 262 The Great Grelli With yet another internship locked up at Lockheed, Jersey born aerospace aficionado Ava Grelli is going places — and Boeing places. So buckle up and get your ears on because this rocket retriever overachiever is racing toward space at a breakneck space. Tue, 30 Ap'''
