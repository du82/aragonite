["https://eng.auburn.edu/alumni"]
title = "Alumni"
description = "Samuel Ginn College of Engineering"
full_description = "Alumni Auburn's 40,000 alumni and friends are the foundation of the engineering family. Our graduates span the globe and carry with them the spirit that sets Auburn men and women apart in the workplace and community. Engineering News Engineering Magazine Update your Alumni Profile Recruiting as an Auburn Engineering Alum Mentoring Alumni News Go Emmy Go: Mechanical engineering students design adaptive toy car At just three days old, Emerson “Emmy” Wild had her first seizure. At three weeks old, she received a life-changing diagnosis. She had KCNT1-related epilepsy, a rare form of treatment-resistant epilepsy with around 3,000 known cases worldwide. Through her ongoing involvement on campus, mom and Auburn alumnae Alex eventually connected with the Department of Mechanical Engineering with the idea to create a customized toy that Emmy could use. 12/5/24 10:30 AM Auburn University engineering alumnus makes $10M scholarship pledge to his alma mater Jeff Hills, ’93 BSCE, recently established the Jeffery S. Hills Scholarship in the Samuel Ginn College of Engineering with a pledge of $10 million. The scholarship program will provide an estimated more than 300 scholarships to Auburn Engineering students during the next 20 years, making it the largest single commitment to scholarships in Auburn University history. 11/6/24 12:00 AM Auburn engineers strive to revolutionize diabetes technology with startup Adele Health Mark Norton, ‘13 mechanical engineering, quit his Silicon Valley job in 2022 to develop a product he believes will change the world. He soon convinced fellow Auburn alumnus Tyler Boyd, ‘13 electrical engineering, to join him on this transformative journey. For the Adele Health co-founders, their mission is deeply personal. When Norton was tasked with helping his mom find a blood glucose meter after she was diagnosed as pre-diabetic, he noticed how outdated the options were. Not only that, but no one meter could test for all the necessary biomarkers. He knew there had to be a better way. 9/6/24 2:00 PM More News Auburn Alumni Engineering Council The Auburn Alumni Engineering Council (AAEC) is a group of Auburn Engineering alumni who work together to support the vision and goals of the Samuel Ginn College of Engineering. The council meets twice annually to assist and advise the college, and its members serve on a variety of committees geared to the mission and operation of the college. Council members are an active and valued component of the College of Engineering family. They demonstrate a continuing commitment to move the college to new levels of excellence and take its place among the nation’s premier engineering institutions. The council provides leadership and participation in areas such as academics, development, governmental affairs and public relations. Member Login Visit Site Young Alumni Council The Samuel Ginn College of Engineering is committed to engaging its young Auburn engineers with the activities of the college. To demonstrate the value of its young alumni, the college has formed a young alumni board to serve as a focus group to help keep our young alumni involved in Auburn Engineering. We would like to invite all engineering young alumni to stay engaged . . . whether you participate in Auburn Engineering's great on-line education program to further your education, serve as mentors or develop projects for our senior design classes, attend alumni events and help promote the college in your social networks and companies, or choose to give back financially to Auburn. We hope you value your Auburn education and that you will choose to stay engaged in Auburn Engineering. Member Login Visit Site 100+ Women Strong Auburn Engineering boasts many successful female alumnae, from CEOs of companies to executives in industry to various entrepreneurs and innovators. These women represent the quality of Auburn engineers that we produce each year and they understand the importance of attracting and retaining women in the field. In addition to our outstanding alumni, you, and the many friends and spouses of Auburn Engineering alumni are a special group of people who are dedicated to the future of women in engineering. The college’s 100+ Women Strong is made up of alumni and friends of the college who embrace our vision to provide resources and programming that will enable us to attract, support and retain female students in Auburn Engineering. 100+ Women Strong members recognize the importance of connecting with the next generation of female engineers – those who will bring innovation and discovery to bear on the quality of life for people throughout the world. LEARN MORE CONTACT US GIVING"
