full_description = "During the fall and spring semesters, engineering employers are visiting Auburn's campus almost daily in an effort to recruit Auburn Engineers. Consider connecting with employers at: Table Talks | Typically located in the Brown-Kopel Atrium, this is an informal way to network with companies on campus. Employers set up a table where you can stop by between classes for a quick chat about the company and any available opportunities. Employer-in-Residence | Events meant for you to get professional development advice from recruiters interested in hiring Auburn engineers. An employer-in-residence session may focus on providing advice to prepare for an interview, review your resume, or offer guidance in seeking opportunities at their particular company. Lunch and Learn | One-on-one or small group informal Q&A sessions. You can learn about the day-to-day life of a professional after graduation. When employers visit Auburn, they commonly post one of more internships, co-ops, or full-time jobs on Handshake. Check out the featured positions below posted by companies who will be recruiting on-campus this year at Table Talks, Employer-in-Residence, Lunch and Learns, or Career Fair & Interview events. Once you review the job posting, make sure to attend the event so you can speak with a representative about the role! On-Campus Interview Days Some employers choose to host screening interviews right on campus during their recruiting visit to Auburn. You can find jobs associated with On-Campus Interview Days posted on Handshake! How does it work? Explore posted positions and note application deadlines Apply to position(s) Depending on the type of interview designated by the employer, your next step will be to self-schedule your on-campus interview OR wait to receive an interview invitation from the employer! Explore + Apply to Positions with On-Campus Interviews Featured Co-ops Cooperative Education Program at The Comfort Group Energy Management Co-op at Auburn U