title = "Auburn Engineering News Center"
description = "The Samuel Ginn College of Engineering has a long and rich tradition of excellence in engineering education. We are the highest ranked engineering program in the state, and consistently rank among the top institutions in the country."
full_description = "AUBURN ENGINEERING NEWS CENTER Auburn hosts 68th annual Alabama Transportation Conference 2/14/25 1:45 PM Alumni, students, faculty gather at college's annual scholarship, fellows 2/14/25 12:00 PM NSF CAREER Award-winning study investigates how sound boosts pollination 2/14/25 10:00 AM #GINNing Podcast: Net Worth 2/14/25 9:00 AM RoboCrop: BSEB students win big at worldwide farming robotics challenge 2/13/25 3:30 PM More News In the News Alumni News Giving News E-Magazine Submit News Ginning Podcast Advantage Engineering Season 6 Episode 301 Talk about net worth! Yes, mechanically minded tennis talent (and Lady Tiger legacy) Julie Bedard goes hard — on the court, in the classroom, in life in dang general. In other words, Advantage Auburn. Listen: Episode 301 That Creed Speed Season 6 Episode 300 Auburn Creed? More like Auburn Speed. Check out the #GINNing gang's conversation with Samantha Korac, vehicle dynamics and controls engineer for Auburn's Autonomous Tiger Racing team, who recently helped steer the GAVLAB's gears around the Las Vegas Motor Speedway at up to 170 driver-less miles per hour. Listen below, or on Apple Podcasts, Spotify, Google Play, iHeartRadio or wherever you listen to your favorite podcasts by searching #GINNing. Listen: Episode 300 Madison from Madison Season 6 Episode 299 This senior wants nothing more than to use her communication skills and knack for logistics to help people and overcome the world's greatest challenges. Which is to say, when it comes to selling the strengths and benefits of industrial and systems engineering, nobody's struttin' like Madison Dutton. Listen: Episode 299 Smarter Carter Season 6 Episode 298 From the woods of Columbiana to the Costa da Caparica, junior Anna Carter is living the dream, Birdsonging her away around this great material world of ours one extra engineering mile at a time. Listen: Episode 298 Exoskeletons in the Closet Season 6 Episode 297 Brendon Allen has some exoskeletons in his closet, and the National Science Foundation (NSF) wants to find out more about them.The assistant professor in the Department of Mechanical Engineering was recently tapped for a five-year $588,408 NSF CAREER Award aimed at increasing access to rehabilitation for individuals with movement disorders through a deep learning control framework for home-based hybrid exoskeletons. Listen: Episode 297 Computer Scientist, M.D. Season 6 Episode 296 Assistant computer science professor by day, computational biologist by day, medical doctor by day — Haynes Heaton does it all. Great news for Auburn. Bad news for leukemia. Listen: Episode 296 Jon Wilson's War Eagle Season 6 Episode 295 The legacy of leadership with the Samuel Ginn College of Engineering's Office of Advancement continues. Ladies and gentlemen, welcome back Jon Wilson. Listen: Episode 295 The Ambassador Season 6 Episode 294 Bradley Johnson didn't just want the paper — he wanted Auburn Engineering. Listen to our conversation with the premiere ambassador for one of the highest-ranked online master's of engineering programs in the country on the latest episode of the best podcast in higher education. Listen: Episode 294 All Episodes"
