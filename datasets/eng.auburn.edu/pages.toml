["https://eng.auburn.edu/future-students/graduate"]
title = "Future Graduate Students"
description = "Samuel Ginn College of Engineering"
full_description = '''Future Graduate Students Your decision to become an Auburn engineer will be one of the best you make in your lifetime. From our academic support services to hands-on experiences, we offer unique opportunities for students to engage in programs at the frontier of engineering education and innovative research. Auburn Engineering Graduate School We believe in work, hard work. APPLY NOW AREAS OF STUDY ONLINE DEGREES RESEARCH FELLOWSHIPS SCHEDULE A VISIT GRADUATE SCHOOL CONTACT US Please Select ON CAMPUS ONLINE Close "If you're sure about what you want to be, if you're sure about where you're headed, and you're looking for a university that will lead you there, then Auburn is the university for you." Echezona Ugonna Ezeodili Electrical and Computer Engineering Graduate Teaching Assistant Echezona Ugonna Ezeodili "Given my research interests in the space industry and where it's headed, the new faculty that were hired in and that eventually became my advisor and committee members, we really have matching research interests." Kanak Parmar Aerospace Engineering Graduate Research Assistant Kanak Parmar Interview "At Auburn, I get a high amount of expertise of my faculty members and my committee, and I can use that to further develop my skills." David Hollinger Mechanical Engineering Graduate Research Assistant David Hollinger Interview Auburn Engineering's Graduate Programs are designed to provide students with multidisciplinary, collaborative research opportunities for scholarship and discovery. A key component of our strategic plan is to significantly increase our number of exceptional graduate students, and our commitment to world-class research. We offer unique opportunities for students to engage in programs at the frontier of engineering education and innovative research. Support is available to graduate students through teaching and research assistantships. Full tuition fellowships are also available to all graduate students on a 33 percent or greater assistantship assignment. Additionally, renewable fellowships are available that create opportunities for financial packages including stipends of $24,000 to $32,000 plus a tuition fellowship. These highly competitive packages enable Auburn Engineering to recruit and support outstanding graduate students. MASTER'S AND DOCTORAL DEGREES OFFERED IN THESE DISCIPLINES AEROSPACE BIOSYSTEMS* CHEMICAL CIVIL AND ENVIRONMENTAL COMPUTER SCIENCE AND SOFTWARE ELECTRICAL AND COMPUTER INDUSTRIAL AND SYSTEMS MASTER OF ENGINEERING MANAGEMENT MASTER OF ENGINEERING MATERIALS MECHANICAL M.S. IN CYBERSECURITY ENGINEERING M.S. IN DATA SCIENCE AND ENGINEERING POLYMER AND FIBER *Biosystems degrees only offered on campus Register Here ON CAMPUS. ONLINE. EVERYWHERE. EVERY TIME. APPLY NOW Contact for questions: Maria Auad Associate Dean for Graduate Studies and Faculty Development auad@auburn.edu 334-844-5459 Launch Experience'''
