["https://eng.auburn.edu/global"]
title = "Engineering Global Programs"
description = "Samuel Ginn College of Engineering"
full_description = "The College of Engineering offers many exciting international opportunities for students through our Engineering Abroad programs. Learning about and experiencing a different culture, building a worldwide network of contacts, and learning a new language and skillset are just a few of the advantages of traveling and studying internationally. An added bonus of a global engineering experience is that it demonstrates to potential employers your ability to work in multicultural teams, which can be a powerful differentiator between you and others competing for a similar job. Upcoming for 2024 Engineering Abroad information sessions in Fall 2024 (dates to be announced) September 16, 2024: AU Study Abroad Fair, 11:00 AM – 2:00 PM, Cater Lawn October 25, 2024: Early-Bird Deadline to apply for Summer 2025 faculty-led programs November 1, 2024: Deadline to apply for Spring 2025 exchange programs I'm Interested! Engineering Abroad Brochure Study Abroad Scholarships Engineering Abroad Exchange Programs Exchange programs are based on agreements that are established between the College of Engineering and partner universities in other countries. Auburn Engineering students can spend a semester taking classes at a partner university, while the College of Engineering hosts students from that partner to take courses here. Auburn students pay their normal tuition to Auburn University, not to the partner university, and can receive transfer credit for courses taken abroad. Current exchange partners include: Germany Technical University of Applied Sciences Würzburg-Schweinfurt, Würzburg and Schweinfurt, Germany Karlsruhe University of Applied Sciences, Karlsruhe, Germany University of Applied Sciences Offenburg, Offenburg, Germany Aalen University of Applied Sciences, Aalen, Germany Italy Politecnico di Torino, Torino, Italy Faculty-Led Programs In a faculty-led program, a group of Auburn Engineering students travel to an international location where they attend courses taught by Auburn Engineering faculty. Coursework for engineering credit can involve lectures, labs, projects, site visits, and other activities. Cultural experiences are integral parts of these programs. Faculty-led programs are typically offered during the summer and range from four to eight weeks in duration. Current faculty-led programs include: Italy Engineering in the Arts, Florence, Italy Spain International Engineering Project, Pamplona, Spain Germany International Engineering Project, Schweinfurt, Germany New Zealand EnviroSensing in New Zealand: Bridging Geology, Culture, and Environmental Technology Service Learning Non-credit service learning opportunities are offered through the local chapter of Engineers Without Borders, and allow students to engage in public service and make difference in developing countries. Individuals must be a member of Engineers Without Borders student chapter and must participate in a planning meeting prior to being selected on the travel team. This is a great opportunity for students to apply their engineering skills toward improving the lives of people worldwide. Bolivia Irrigation Project, Quesimpuco, Bolivia Guatemala Water Distribution Project, Saloj, Guatemala Engineering and German Dual Degree The Dual Degree Program in German and Engineering allows students to pursue a bachelor’s degree in German and a bachelor’s degree in an Engineering discipline concurrently and receive two separate diplomas in two distinct fields of study. Students in the program will learn from expert faculty both at Auburn and a partner university in Germany while gaining real-world practical experience, developing intercultural competence, and attaining advanced German language proficiency. This exciting blend of classroom instruction, applied laboratory work, and a required international internship opens doors to excellent career opportunities at some of the most innovative and respected engineering companies in the world. Engineering and German Dual Degree Study + Internship Students can combine an exchange semester with an internship to create a truly immersive experience in another country and culture. A study semester at a partner university from March through July can be followed by an internship with a company in that country from August through December, combining both academics and practical work experience in a 9- or 12-month time abroad. Birdsong Experience This is a unique experience designed to broaden the educational experience of undergraduate engineering students. The program requires students to submit a proposal for an international experience that focuses on study and learning in a discipline or endeavor other than engineering. Proposals are evaluated on a competitive basis and those selected are funded in part by the Fred and Mary Lou Birdsong Endowed Scholarship. Birdsong scholarships have been awarded for a variety of endeavors, such as developing expertise in playing flamenco guitar in Spain, experiencing a culinary tour of Europe, investigating tropic marine ecology on the Great Barrier Reef off Australia, and a study of Italian literature in Taormina, Italy. News Auburn University visits Institute for Technical Business Administration in Steinfurt, Germany Hendrix named associate dean for undergraduate studies and program assessment Auburn engineers abroad: How one electrical engineering alumnus has grown his global perspective Contact Dean Hendrix Director, Engineering Global Programs dean.hendrix@auburn.edu"
