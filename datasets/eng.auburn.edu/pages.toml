title = "Departments"
description = "Samuel Ginn College of Engineering"
full_description = "Departments The disciplines represented in Auburn University's Samuel Ginn College of Engineering ensure that students will find an area of study to match their academic interests. To learn more about these programs please view the programs of study below. Visit Campus Engineering News Programs of Study Aerospace Aerospace engineers apply their knowledge of aerodynamics, astrodynamics, propulsion, structures, controls and performance in the design, development, testing and analysis of aerospace vehicles and systems used for national defense, communications, earth observation, space exploration and the transport of people and goods. Aerospace Website Tour Aerospace Biosystems Biosystems engineers ensure that we have the necessities of life: a safe and plentiful supply of food and fiber, clean water to drink, renewable fuels, alternative energy sources and a healthy environment. They combine engineering concepts with biology to meet challenges and opportunities presented by living ecosystems and the natural environment. Biosystems Website Tour Biosystems Chemical From the medicines we take and the fuel that powers our cars to the foods we eat and the environment in which we live, chemical engineering touches every part of our lives. Chemical engineers develop, design and control processes and products that involve molecular change. Chemical Website Tour Chemical Civil and Environmental Civil and environmental engineers conceive, plan, design, construct, operate and maintain facilities and systems that serve the basic needs of our society. From buildings, bridges and transportation systems to power and water systems, they provide the foundation of our infrastructure while also protecting the environment. Civil and Environmental Website Tour Civil and Environmental Computer Science and Software Computer scientists and software engineers design, analyze and develop software for the computer systems and networks that drive today’s world, from personal computing and entertainment systems to critical applications such as medical, flight and space systems. CSSE Website Tour CSSE Electrical and Computer Electrical and computer engineers design the complex systems and electronic circuits that power today’s world and improve communications, from wireless systems and computers to energy management systems and national defense. Electrical and Computer Website Tour Electrical and Computer Industrial and Systems Industrial and systems engineers look at the big picture of what makes organizations run most efficiently: the right combination of human and natural resources, technology and equipment, as well as information and finance to design and refine processes that improve quality, safety, profitability and productivity. Industrial and Systems Website Tour Industrial and Systems Materials Materials engineers address the science and technology of producing materials, including metals, ceramics, plastics, semiconductors and composites that have properties for expanding capabilities and improving performance in a wide range of applications such as aerospace, transportation, electronics, energy conversion and biomedical systems. Materials Website Tour Materials Mechanical Mechanical engineers are involved in the conceptualization, design, manufacture, testing, marketing and maintenance of the systems that make our lives easier, including construction, transportation, energy, water, waste and computers. Mechanical Website Tour Mechanical Wireless Wireless engineers design and build wireless communication systems with embedded radio frequency circuits and network hardware and software for use in consumer products such as cell phones, computers and smart phones, as well as medical, emergency, military and security systems. Wireless Website Find Your Degree Auburn Engineering is focused on providing the best student-centered experience in America. Through our more than 25 high-quality graduate and undergraduate degrees across eight departments, we pride ourselves on providing hands-on, experiential learning opportunities for students both inside and outside the classroom. VIEW DEGREE AND CERTIFICATE OPTIONS Aerospace Bachelor of Aerospace Engineering Master of Science - Aerospace Engineering Ph.D. - Aerospace Engineering Biosystems Bachelor of Biosystems Engineering Master of Science - Biosystems Engineering Ph.D. - Biosystems Engineering Chemical Bachelor of Chemical Engineering Master of Science - Chemical Engineering Ph.D. - Chemical Engineering Pulp and Paper Graduate Certificate Civil and Environmental Engineering Bachelor of Civil Engineering Master of Civil Engineering Master of Science - Civil Engineering Ph.D. - Civil Engineering Geotechnical Engineering Graduate Certificate Structural Analysis Graduate Certificate Structural Design Graduate Certificate Pavement Analysis and Design Graduate Certificate Pavement Materials Graduate Certificate Water Environmental Modeling Graduate Certificate Water Resources Engineering Graduate Certificate Computer Science and Software Bachelor of Computer Science Bachelor of Science - Computer Science Bachelor of Software Engineering Master of Science - Artificial Intelligence Engineering Master of Science - Computer Science and Software Engineering Master of Science - Cybersecurity Engineering Master of Science - Data Science and Engineering Ph.D. - Computer Science and Software Engineering Artificial Intelligence Engineering Graduate Certificate Undergraduate Certificate Cyber Defense Cybersecurity Engineering Graduate Certificate Dual Degrees Engineering/German Dual Degree Master of Industrial and Systems Engineering/MBA Electrical and Computer Bachelor of Computer Engineering Bachelor of Electrical Engineering Master of Science - Electrical Engineering Ph.D. - Electrical Engineering Power Engineering Graduate Certificate Engineering Management Master of Engineering Management Industrial and Systems Bachelor of Industrial and Systems Engineering Master of Industrial and Systems Engineering/MBA Master of Industrial and Systems Engineering Master of Science - Industrial and Systems Engineering Ph.D. - Industrial and Systems Engineering Automotive Manufacturing Systems Graduate Certificate Modeling for Data Analytics & Operations Graduate Certificate Occupational Safety and Ergonomics Graduate Certificate Master of Engineering Master of Engineering Materials Bachelor of Materials Engineering Master of Science - Materials Engineering Ph.D. - Materials Engineering Mechanical Bachelor of Mechanical Engineering Master of Science - Mechanical Engineering Ph.D. - Mechanical Engineering Tribology Engineering Graduate Certificate Polymer and Fiber Master of Science - Polymer and Fiber Engineering Ph.D. - Polymer and Fiber Engineering Wireless Bachelor of Wireless Engineering Minors Business-Engineering-Technology (BET) This minor is designed to enhance all majors offered in the Colleges of Business and College of Engineering. A typical BET class may have up to 15 different majors. Learn More - BET Computer Science The computer science minor provides a basic background in computer science theory and practice, including programming in a high-level language, algorithms, and data structures. Learn More - Computer Science Information Technology Pursuing a 15-hour minor in information technology will sharpen your skills in advanced web development and broaden your knowledge in computer ethics and object-oriented programming. Learn More - Information Technology Materials Engineering This minor includes 15 hours of required materials engineering-related courses and is geared toward students with more of an interest toward the engineering side of materials. Learn More - Materials Engineering Materials Science The materials science minor is designed to appeal to students who are interested more in the science aspect of materials and requires 15 credit hours. Learn More - Materials Science Nuclear Power Generation Systems This minor includes 16-credit hours to prepare students careers specializing in the operation, support and service of America’s nuclear power generation industry. Learn More - Nuclear Power Generation Systems Tribology and Lubrication Science This 15-hour multidisciplinary minor prepares students from various engineering and science majors for careers that require a background in friction, wear and lubrication (tribology). Learn More - Tribology and Lubrication Science Program Curriculum Aerospace Engineering Biosystems Engineering Biosystems/Ecological Engineering option Biosystems/Forest Engineering option Biosystems/Bioprocess Engineering option Chemical Engineering Civil and Environmental Engineering Computer Engineering Computer Science Electrical Engineering Industrial and Systems Engineering Materials Engineering Mechanical Engineering Software Engineering Wireless Engineering"
