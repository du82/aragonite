["https://eng.auburn.edu/center-for-bioenergy-and-bioproducts/index.html"]
title = "Center for Bioenergy and Bioproducts"
description = "Samuel Ginn College of Engineering"
full_description = "Alabama is a state rich in renewable forest and agricultural resources, many of which may be the keys to new forms of energy and products that could reduce our nation's dependence on foreign energy sources AND bring new jobs and sources of income to our state. The Bioenergy and Bioproducts Center was established to help bring both natural and human resources to bear on bioenergy and bioproduct opportunities in our state and region. Auburn's location at the center of a region rich in renewable forest and agricultural biomass resources, and its status as the state's largest land-grant and comprehensive research university make it ideally suited to address these issues. The AU Bioenergy and Bioproducts Center is a catalyst for the development of bioenergy and bioproduct ideas, which, ultimately, will enhance Alabama's economy and the quality of life for all citizens of the state. Overview About Us Research Capabilities Work With Us News Auburn Biosystems Engineering dominates at 2024 ASABE International Meeting Auburn University's Department of Biosystems Engineering (BSEN) was hard to miss at the 2024 American Society of Agricultural and Biological Engineers (ASABE) Annual International Meeting held last week in Anaheim, California. And hard to beat. 8/5/24 2:00 PM David named associate dean for research Allan David has been named associate dean for research for Auburn University’s Samuel Ginn College of Engineering, according to an announcement by Dean Mario Eden. 5/29/24 7:45 AM BSE doctoral student's presentation on bio-resin application for 3D-printing houses places first at ASABE Auburn's Department of Biosystems Engineering shows no signs of changing its award-winning ways for the American Society of Agricultural and Biological Engineers (ASABE). The most recent example? Doctoral student Manish Sakhakarmy, whose oral presentation on the pyrolysis of Douglas firs, eucalyptus and poplar trees for novolac resin production recently placed first in the oral / poster competition at the ASABE Annual International Meeting in Omaha, Nebraska. 2/19/24 4:15 PM"
