title = "Transfer Students"
description = "I believe in education, which gives me the knowledge to work wisely and trains my mind and my hands to work skillfully. - George Petrie, 1943"
full_description = "Welcome Future Engineers! This is a very exciting time to be a part of the Samuel Ginn College of Engineering as we are continuously building and improving services, resources, and opportunities for our transfer students. We recognize your unique needs and have created specialized support and transition programs to help ensure your success! We look forward to guiding you through this next stage of your academic career. This page provides you with various links to help make your transition to Auburn Engineering a smooth process. We also have dedicated staff for our transfer students so please feel free to reach out for more information. Visit Engineering for Transfer Info Session SOS Transfer Orientation Transfer Admissions Info Do My Courses Transfer? Laura Olds Academic Advisor Serves as first point of contact andacademic advisor for pre-engineering transfer students. Laura also teaches the transfer student section of Engineering Orientation. laura.olds@auburn.edu 334-844-7741 1155 M Brown-Kopel Center Candi Vann Director, Advising Meets with prospective students/families and oversees pre-engineering advising staff. cpv0002@auburn.edu 334-844-4310 1155 N Brown-Kopel Center Transfer Process Determine your level of interest by exploring programs & curriculum Use the transfer equivalency tables to determine what will transfer into your chosen curriculum Complete transfer application – plan of study, official transcripts from EVERY institution, & application fee After acceptance into the program, reserve your spot in the next available orientation session Quick Links Minors AU Core Requirements Transfer Course Guides Scholarships Majors and Curriculum Aerospace Biosystems Chemical Civil and Environmental Computer Engineering Computer Science Electrical Industrial & Systems Materials Mechanical Software"
