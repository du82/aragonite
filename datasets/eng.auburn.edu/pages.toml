description = "Samuel Ginn College of Engineering"
full_description = "Giving Your gifts and support allow the Samuel Ginn College of Engineering to provide the best student-centered engineering experience in America through cutting-edge programs, innovative research and a dynamic faculty. Learn how you can make the future of Auburn Engineering even brighter. Give Now Annual Giving 2018 Campaign Celebration Support Engineering Programs Support Your Department Contact Us Support Engineering Programs 100+ Women Strong With a commitment to recruiting, retaining and rewarding Auburn women in engineering, this program provides valuable resources for the next generation of female engineers. Members pledge $1,000 per year to support the program, with those less than 10 years out of college pledging a minimum of $500 annually. Learn More Give Now Center for Inclusive Engineering Excellence This nationally recognized program enhances the recruitment and retention of underrepresented students by focusing on expanding academic preparation, professional readiness and exploration of career paths. Learn More Give Now Support Your Department The goal of each of the college’s 10 departments and programs of study is to provide a premier education and research opportunities for our students, while also helping to equip and develop the next generation of engineers. Private gifts make this possible. Visit AERO Give to AERO Visit BSEN Give to BSEN Visit CHEN Give to CHEN Visit CEE Give to CEE Visit CSSE Give to CSSE Visit ECE Give to ECE Visit INSY Give to INSY Visit MATL Give to MATL Visit MECH Give to MECH Visit WIRELESS Give to WIRELESS Contact Us The Engineering Advancement team can help you tailor a gift that fulfills your long-term charitable and financial goals. Our specialty is helping you find ways to support the College of Engineering and we would be happy to discuss charitable giving options with you and your advisers. Meet our Team Ways to give Giving News Auburn University engineering alumnus makes $10M scholarship pledge to his alma mater Jeff Hills, ’93 BSCE, recently established the Jeffery S. Hills Scholarship in the Samuel Ginn College of Engineering with a pledge of $10 million. The scholarship program will provide an estimated more than 300 scholarships to Auburn Engineering students during the next 20 years, making it the largest single commitment to scholarships in Auburn University history. 11/6/24 12:00 AM Auburn engineers abroad: Chemical engineering alumnae takes nuclear expertise to London Auburn chemical engineering alumnae Lauren Lathem served as a panelist at CORE POWER’s fifth New Nuclear for Maritime Summit, held at the Royal College of Surgeons in London on June 13. Lathem, the Advanced Nuclear Research and Development (R&D) manager at Southern Company, challenged various attendees to engage a sense of personal responsibility in the growth of nuclear power technology development. 8/1/24 3:00 PM Philanthropy shapes Auburn experience Support from the Auburn Family created opportunities for Dremere Woods, including outside-the-classroom experiences like his current internship with Enterprise Holdings. 7/30/24 8:00 AM"
