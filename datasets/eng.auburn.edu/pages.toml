","details":"Grab FREE dinner and catch up with your E-Team!","starts":"1698100200000","title":"E-Teams Huddle","ends":"1698103800000"}, {"path":"/2023/11/E-Teams Huddle","location":"Brown-Kopel 2151","details":"Grab FREE dinner and catch up with your E-Team!","starts":"1699918200000","title":"E-Teams Huddle","ends":"1699921800000"}, {"path":"/2023/08/E-Teams Walk My Schedule","location":"Gavin Gardens","details":"All first-semester students are invited to join upperclassman E-Team leaders to walk to their class locations.","starts":"1692126000000","title":"E-Teams \"Walk My Schedule\"","ends":"1692133200000"}, {"path":"/2023/08/Transfer Student Lunch","location":"","details":"First-semester transfer students can register to attend at aub.ie/transferlunchfall2023.","starts":"1692982800000","title":"Transfer Student Welcome Lunch","ends":"1692986400000"}, {"path":"/2023/09/Engineering Undergraduate Research Panel","location":"Brown-Kopel 2117","details":"Are you interested in undergraduate research but aren't quite sure how to get started? Join us for our undergraduate research panel of engineering faculty and students involved in research. We hope to see you there!","starts":"1695844800000","title":"Engineering Undergraduate Research Panel","ends":"1695848400000"}, {"path":"/2023/10/Donuts with the Deans","location":"Brown-Kopel Atrium","details":"","starts":"1696946400000","title":"Donuts with the Deans","ends":"1696953600000"}, {"path":"/2023/10/Trick-or-Treat in Brown-Kopel","location":"Brown-Kopel Atrium","details":"Trick-or-treat in Brown-Kopel Center on Halloween to learn more about the offices that offer student support and resources and get your Halloween candy fix! There will be a costume contest and Hocus Pocus 1 &amp; 2 will be showing. We hope to see you there!","starts":"1698764400000","title":"Trick-or-Treat in Brown-Kopel","ends":"1698775200000"}, {"path":"/2023/09/Brown-Kopel Closed","location":"Brown-Kopel","details":"Brown-Kopel will be closed from 5:00 pm on Friday, September 1 until 7:00 am on Tuesday, September 5 in observance of Labor Day.&#160;","starts":"1693605600000","title":"Brown-Kopel Closed","ends":"1693915200000"}, {"path":"/2023/07/Discover Lockheed Martin","location":"Virtual","details":"Join us for our upcoming virtual Discover LM series that will be held July 24th &#8211; August 3rd. During this time we will have multiple technical and informational sessions covering different job functions, such as, Engineering &amp; Computer Science, Production Operations, and Finance &amp; Business Operations. You will also have the chance to hear from our technical representatives about Lockheed Martin and our business areas. To participate and claim your spot, please pre-register for the event in advance by clicking the RSVP link: https://tinyurl.com/25f7995x If you are interested in a career with Lockheed Martin, but unable to attend, you too are welcome to pre register for this event using the RSVP link to ensure you are invited to future events. We are excited to connect with you!","starts":"1690236000000","title":"Discover Lockheed Martin","ends":"1691110800000"}, {"path":"/2023/08/City of Auburn Traffic Engineering Table Talk","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"The City of Auburn Traffic Engineering Division investigates complaints regarding traffic problems and monitors traffic volume information in order to improve safety and efficiency. It also maintains the City's traffic signals, signs and pavement markings, and is responsible for the design and implementation of the City's bike paths. \nMajors: Civil Engineering Positions: Co-op Positions Stop by 8/22 between 10:00 a.m. - 2:00 p.m. to learn more! \nDress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23","starts":"1692716400000","title":"City of Auburn Traffic Engineering Table Talk","ends":"1692730800000"}, {"path":"/2023/08/Engineering Professional Headshots","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium, Auburn University, Auburn, AL 36849, USA ","details":"Recruitment season is here! As you update your Handshake and LinkedIn profiles, as well as any other platforms where you'll interact with employers and other professionals, be sure to have a fresh professional headshot.The Samuel Ginn College of Engineering will be offering **FREE** professional headshots on Tuesday, August 22 and Wednesday, August 23 from 10A- 4P in the Brown-Kopel Engineering Center Atrium. Headshots will be held in conjunction with the Engineering Career Fair Ready with Career Coaches event.NO APPOINTMENT NEEDED! Please join the Handshake event so that we know to expect you, and feel free to drop in at any time between 10am and 4pm the 22nd or 23rd. It will take 3-5 minutes to take your headshot and the photographer will deliver your photos via email within two weeks.Recommended dress: Business Professional","starts":"1692802800000","title":"Engineering Professional Headshots","ends":"1692824400000"}, {"path":"/2023/08/Engineering Professional Headshots1","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium, Auburn University, Auburn, AL 36849, USA ","details":"Recruitment season is here! As you update your Handshake and LinkedIn profiles, as well as any other platforms where you'll interact with employers and other professionals, be sure to have a fresh professional headshot.The Samuel Ginn College of Engineering will be offering **FREE** professional headshots on Tuesday, August 22 and Wednesday, August 23 from 10A- 4P in the Brown-Kopel Engineering Center Atrium. Headshots will be held in conjunction with the Engineering Career Fair Ready with Career Coaches event.NO APPOINTMENT NEEDED! Please join the Handshake event so that we know to expect you, and feel free to drop in at any time between 10am and 4pm the 22nd or 23rd. It will take 3-5 minutes to take your headshot and the photographer will deliver your photos via email within two weeks.Recommended dress: Business Professional","starts":"1692716400000","title":"Engineering Professional Headshots","ends":"1692738000000"}, {"path":"/2023/08/Jefferson County Roads and Transportation Engineering Table Talk + Lunch","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"Jefferson County is governed by five Commissioners elected from specific districts of the County. Each Commissioner is responsible for administering assigned departments and functions of County government. \nThe Jefferson County Commission recognizes the value of a qualified and diverse workforce, and through the Human Resources Department facilitates a fair, equitable, and productive work environment for all County employees - our most valuable resource. \nGreat Benefits include: Medical Insurance, Dental Insurance, Vision Insurance, Paid Holidays, Paid Vacation, Paid Sick Leave, Pension Plan, Deferred Compensation, and Credit Union. \nMajors: Civil Engineering \nPositions: Internships and full-time positions. \nStop by the Roberts Atrium in the morning or for lunch and coffee in the Vulcan Materials Conference Room, BKESAC 1131 from 12-3. \nDress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23","starts":"1692802800000","title":"Jefferson County Roads and Transportation Engineering Table Talk + Lunch","ends":"1692820800000"}, {"path":"/2023/08/Procter and Gamble Employer-in-Residence","location":"Brown-Kopel Engineering Student Achievement Center, Vulcan Materials Corporate Conference Room 1131","details":"Making every day more than ordinary!Our brands are trusted in millions of living rooms, kitchens, laundry rooms, and bathrooms&#8212;and have been passed down from generation to generation. We are the people behind the brands you trust, and we&#8217;re committed to making peoples&#8217; lives better in small but meaningful ways, every day.As P&amp;G grows, we stay grounded in our purpose, values, and principles and a deep-rooted understanding between each other and our company that being our best and doing our best&#8212;for the people who buy our products, for one another, and for the world around us&#8212;will lead to mutual success.No appointment needed! Just drop by CDCR (1133 Brown-Kopel) to meet with Procter &amp; Gamble about your career fair prep.Dress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23Engineering Majors: All","starts":"1692637200000","title":"Procter and Gamble Employer-in-Residence","ends":"1692651600000"}, {"path":"/2023/08/Schneider Electric Table Talk","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"Schneider Electric&#8482; is the global specialist in energy management and automation. With Revenues of 25 billion euros, our 144,000 employees thrive in more than 100 countries, helping them to manage their energy and process in ways that are safe, reliable, efficient and sustainable. From the simplest of switches to complex operational systems, our technology, software and services improve the way our customers manage and automate their operations. Our connected technologies reshape industries, transform cities and enrich lives. At Schneider Electric, we call this Life is On.\nDress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23 Engineering \nMajors: Civil &amp; Environmental Engineering, Electrical &amp; Computer Engineering, Industrial &amp; Systems Engineering, Mechanical Engineering","starts":"1692889200000","title":"Schneider Electric Table Talk","ends":"1692903600000"}, {"path":"/2023/10/Spire Energy Table Talk","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"Energy exists to help people. To enrich their lives, grow their businesses, advance their communities. It&#8217;s a simple idea, but it&#8217;s one that&#8217;s at the heart of our business. \nAcross the regions and companies within our portfolio, we at Spire dedicate ourselves to helping our 1.5 million residential, commercial and industrial customers across Missouri and Alabama reach their personal and professional goals, every day. \nTo help address those needs, we provide both regulated and non-regulated natural gas services. \nSince 1857, our teams have lived by a different definition of service. One that empowers our employees and the people we serve. Maybe that&#8217;s why we&#8217;re the eighth longest listed stock on the NYSE. And why we plan to continue to move our communities forward. \nPlease join us in the Brown-Kopel Atrium to learn more about internships at Spire. \nMajors: Mechanical Engineering \nDress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23","starts":"1696863600000","title":"Spire Energy Table Talk","ends":"1696834800000"}, {"path":"/2023/08/WestRock Lunch and Learn","location":"Brown-Kopel Engineering Student Achievement Center, CDCR, Suite 1133","details":"You are invited to attend a Lunch and Learn with WestRock to learn about Co-ops and Internships available with the company. \nWestrock is a leading global paper and packaging company with a vision to be the premier partner and unrivaled provider of sustainable, winning solutions to our customers. Westrock has 300 operating locations with 50,000 teammates working in 30 countries around the world. \nMajors Recruited: Chemical Engineering, Electrical and Computer Engineering, Industrial and Systems Engineering, Mechanical Engineering \nDress: Casual - https://issuu.com/aucc/docs/jobsearch_revised/23","starts":"1692896400000","title":"WestRock Lunch and Learn","ends":"1692900000000"}, {"path":"/2023/08/Career Fair Ready with Engineering Career Coaches","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"Preparing your engineering resume? Scheduling career fair interviews for co-op, internships or full-time roles? Crafting your elevator pitch? \nJoin Engineering CDCR for this drop-in event for all day resume reviews, career fair interview scheduling, and ask any career fair-related questions as you prepare for the upcoming Samuel Ginn College of Engineering Career Fairs this fall semester. \n**FREE Professional Headshots** will take place alongside our Career Fair Ready events on Tuesday, August 22 and Wednesday, August 23. See details here: https://auburn.joinhandshake.com/events/1320900/share_preview","starts":"1692716400000","title":"Career Fair Ready with Engineering Career Coaches","ends":"1692738000000"}, {"path":"/2023/08/Career Fair Ready with Engineering Career Coaches1","location":"Brown-Kopel Engineering Student Achievement Center, Christopher B. Roberts Atrium","details":"Preparing your engineering resume? Scheduling career fair interviews for co-op, internships or full-time roles? Crafting your elevator pitch? \nJoin Engineering CDCR for this drop-in event for all day resume reviews, career fai'''
