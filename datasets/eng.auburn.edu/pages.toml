title = "Engineer Together"
description = "Samuel Ginn College of Engineering"
full_description = '''Engineer Together p { font-size: 1.1em; } I belong. You belong. Together, we engineer solutions for a diverse world. .sticky-top { width: 32%; margin-right: 0; margin-bottom: 10px; } @media (max-width: 995px) { .sticky-top { margin-top: 10px; margin-bottom: 10px; margin-right: auto; min-width: 300px; padding: 10px; } } The Samuel Ginn College of Engineering is committed to providing a welcoming learning and working environment for all our students, faculty and staff. Engineer Together is an initiative to engage and share with everyone the efforts our college is making to ensure a valuable and positive Auburn Engineering experience is available to all. Part of being the best student-centered engineering experience in America is providing opportunities and access to an environment where everyone feels welcomed, valued, respected and engaged. We all win when we engineer together. Mario Eden, Dean Women in Engineering | 100+ Women Strong Center for InspiringEngineering Excellence Dr. Dean Hendrix, Associate Dean College of Engineering The Engineering Together Committee curated an access list of some college and campus resources for students, faculty and staff. Resources for students, faculty, and staff: Future Students Current Students Faculty Staff Up Coming Events May 13 12:00 AM Erosion and Sediment Control Installer Workshop May 15 8:00 AM Erosion and Sediment Control Field Day News Office of Career Development and Corporate Relations to host Design for Humanity Engineering Challenge The Office of Career Development and Corporate Relations (CDCR) will host its Design for Humanity Engineering Challenge Thursday, Feb. 6, as part of the Samuel Ginn College of Engineering's Engineer Together Day. 1/30/25 9:30 AM 2024 in review: Top Auburn Engineering videos of the year Auburn Engineering counts down the top five most-engaging videos of 2024 across all of our social media platforms. 12/31/24 10:00 AM 2024 in review: Top #GINNing podcasts of the year Here's the Top 5 most downloaded #GINNing Podcast episodes of 2024. 12/24/24 10:00 AM More News ul.fontawesome { list-style-type: none; padding-left: 20px; color: #666; } li.arrow { position: relative; padding-left: 20px; margin-bottom: 10px } li.arrow:before { position: absolute; top: 0; left: 0; font-family: FontAwesome; content: "\f054"; color: #f68026; } Report Bias Student Demographic Enrollment Data ASEE Award ABET'''
