["https://eng.auburn.edu/autri"]
title = "Transportation Research Institute"
description = "Samuel Ginn College of Engineering"
full_description = "NCAT Test Track Nearly 12 million miles of cutting-edge experimentation on the only high-speed, full-scale accelerated pavement testing track in the world. Alabama Bridges Getting Alabamians from Point A to Point B more safely — and efficiently — than ever. Autonomous Racing The Driving Force in Driverless Research Previous Next Transportation Research Institute The Nation's Infrastructure Leader Established in 2021, the Auburn University Transportation Research Institute provides a unified presence and strategic direction for promoting the renowned transportation-related research conducted within the academic departments and research centers in the Samuel Ginn College of Engineering. Thanks to the reputation of the units under the institute’s umbrella — the National Center for Asphalt Technology (NCAT) and its affiliated asphalt test track, the Highway Research Center (HRC), the Alabama Transportation Assistance Program (ATAP), Advanced Structural Engineering Laboratory (ASEL) and the GPS and Vehicle Dynamics Laboratory (GAVLAB) — extramural funding for transportation is greater than any other single topic within Auburn University’s research footprint. Explore Our Research Advanced Structural Engineering Laboratory (ASEL) Alabama Transportation Assistance Program (ATAP) Alabama Transportation Assistance Program Highway Research Center (HRC) GPS and Vehicle Dynamics Laboratory (GAVLAB) National Center for Asphalt Technology (NCAT) Asphalt Test Track Recent News Auburn hosts 68th annual Alabama Transportation Conference The Auburn University Samuel Ginn College of Engineering hosted the 68th annual Alabama Transportation Conference on Feb. 11-12 at the Birmingham-Jefferson Convention Complex. 2/14/25 1:45 PM Auburn prepares to host 68th Annual Alabama Transportation Conference Auburn University Transportation Research Institute (AUTRI) is once again shaping Alabama’s transportation future by hosting the 68th Annual Alabama Transportation Conference (ATC). 1/31/25 12:00 AM The American Railway Engineering and Maintenance-of-Way Association introduces Auburn student chapter The American Railway Engineering and Maintenance-of-Way Association (AREMA) student chapter at Auburn University becomes the first AREMA student chapter in Alabama and the 26th nationwide. 1/29/25 5:00 PM Auburn researchers shine at national transportation conference AUTRI faculty, staff and students participated in 19 lectern sessions, 21 poster sessions and several workshops at the 104th Transportation Research Board Annual Meeting, held Jan. 5-9 in Washington, D.C. 1/29/25 3:30 PM Auburn University Transportation Research Institute partners with Selma to address traffic concerns The Alabama Transportation Assistance Program (ATAP), part of the Auburn University Transportation Research Institute (AUTRI), is partnering with the city of Selma to address safety concerns across the city, with a particular focus along the Highland Avenue corridor. 12/3/24 1:00 PM Computer Science and Software Engineering graduate student wins Eisenhower Fellowship from Federal Highway Administration Corey McDaniels, a master’s student in the Department of Computer Science and Software Engineering (CSSE), has been awarded the 2024 Dwight David Eisenhower Transportation Fellowship by the Federal Highway Administration. 11/14/24 10:45 AM More News"
