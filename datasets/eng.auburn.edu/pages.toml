["https://eng.auburn.edu/about/facilities/auburn-university-research-innovation-campus"]
title = "Auburn University Research and Innovation Campus"
description = "Samuel Ginn College of Engineering"
full_description = "The Auburn University Research and Innovation Campus has quickly become the Huntsville community’s primary connection to the research and resources of Auburn University. Only minutes from the Gate 9 entrance to Redstone Arsenal, the facility’s highly visible 9-acre property is located within Huntsville's Cummings Research Park close to numerous defense and aerospace collaborators, as well as the Bridge Street commercial development and Hudson Alpha. Home to the Auburn University Applied Research Institute, the campus facilitates cross-domain collaboration among agencies, and supplies our partners access to our talented student researchers pursuing fields in Defense, Aerospace and Biotech sectors. It is well equipped to support applied research and development work for Huntsville / Redstone customers as well as hosting alumni and development events. WHAT'S INSIDE: Configurable laboratories for on-site research and development in critical technology areas Work areas for Auburn interns, co-op students, and graduate students engaged in R&D for Huntsville customers Facilities for space and cyber security operations, modeling and simulation, and tabletop exercises Meeting spaces and engagement opportunities for government, industry and academia to allow for in-person and virtual meetings, exercises, etc. A venue for student and alumni activities such as poster sessions, recruiting events, development events, etc. Sculptures, paintings and other works from the university art collection to inspire all To discuss partnership opportunities or the availability of the campus’ facilities and resources, contact Vicki Kretzschmar , Business Manager, Auburn University Applied Research Institute."
