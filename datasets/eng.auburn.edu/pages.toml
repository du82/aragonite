["https://eng.auburn.edu/admin/center-for-inspiring-engineering-excellence/index"]
title = "Center for Inspiring Engineering Excellence"
description = "Samuel Ginn College of Engineering"
full_description = "The Center for Inspiring Engineering Excellence plays a vital role in promoting diversity among the Auburn University student body. The goal of the program is to strengthen the recruitment and retention of underrepresented students in the Samuel Ginn College of Engineering. While this program is open to all students, it is designed to encourage and foster support for students from underrepresented populations. With a wide range of student support, the Center for Inspiring Engineering Excellence supports participants from pre-college through graduation, both in and out of the classroom, by focusing on expanding academic preparation and career readiness. Through academic and professional development workshops, collaborative study groups and one-on-one peer learning, the Center for Inspiring Engineering Excellence is preparing students to confidently take the next steps on their Auburn Engineering career path. About Contact Us Celebrating 25 Years MITE Program Summer Enrichment Program Feedback Form Give Now Future Students Current Students News and Events Office of Career Development and Corporate Relations to host Design for Humanity Engineering Challenge The Office of Career Development and Corporate Relations (CDCR) will host its Design for Humanity Engineering Challenge Thursday, Feb. 6, as part of the Samuel Ginn College of Engineering's Engineer Together Day. 1/30/25 9:30 AM Professors receive $400K NSF grant for Lean Manufacturing education Three Auburn University professors have been awarded a nearly $400K grant from the National Science Foundation (NSF) to enhance Lean Manufacturing education. 9/25/24 2:10 PM Hope for the future: Summer program introduces STEM principles to underrepresented students For 45 rising ninth through 12th graders, envisioning themselves as future engineering undergraduates just became that much easier after spending a week at Auburn University enrolled in the Minority Introduction to Engineering (MITE) program. 7/30/24 12:00 PM More News"
