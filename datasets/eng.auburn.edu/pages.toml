title = "About"
description = "Samuel Ginn College of Engineering"
full_description = "About Auburn Engineering has a long and rich tradition of excellence in engineering education. We are the highest ranked engineering program in the state, and consistently rank among the top institutions in the country. Our college produces more than one third of Alabama's engineering graduates and our prominent alumni include four astronauts and Tim Cook, CEO of Apple Inc. Students Faculty Facilities Engineer Together History Samuel Ginn Our Mission The Samuel Ginn College of Engineering embraces its land-grant values in order to transform lives and enhance society through impactful engineering education and research. The Samuel Ginn College of Engineering will… Prepare our students, through high quality internationally recognized instructional programs, to practice engineering professionally and ethically in a competitive global environment. Expand scientific and engineering knowledge through innovative research and creative partnerships involving academia, industry and government. Provide programs to assist individuals and organizations to find solutions to engineering problems through education, consulting and practical research Our Vision The Samuel Ginn College of Engineering will be an innovative and engaged community of faculty, staff and students who exemplify excellence through an exceptional student-centered engineering experience and transformational research that improves quality of life and fosters economic growth. The Samuel Ginn College of Engineering will be… The best student-centered engineering experience in America! A leader in research and service that improves the quality of life and fosters economic growth. A community of faculty, staff and students that exemplifies excellence and innovation. Strategic Plan Students Our students make the difference in the College of Engineering. We represent one of the largest colleges on Auburn University's campus with approximately 5,300 undergraduate and 1,100 graduate students. We cultivate an environment that puts an emphasis on fundamentals, hands-on engineering and a strong work ethic that sets Auburn Engineering graduates apart as leaders in the workplace and the community. Faculty Following our vision to provide a dynamic faculty that exemplifies excellence in education, these individuals are what create the highest-quality education to our students. Our faculty constantly raise the bar for our students to be better in the classroom and industry. Because of our faculty, students are knowledgeable and prepared to enter the work force to meet tomorrow's engineering challenges. Facilities Advanced Structural Engineering Laboratory The Advanced Structural Engineering Laboratory is home to one of the nation’s premier structural engineering research facilities, including a strong wall, strong floor and geotechnical chamber. Broun Hall Broun Hall houses the Department of Electrical and Computer Engineering. Brown-Kopel Engineering Student Achievement Center The Brown-Kopel Center is home to Engineering Student Services, including advising, recruiting and tutoring, the Center for Inspiring Engineering Excellence and Career Development and Corporate Relations. Charles E. Davis Aerospace Hall Davis Hall serves as the home to the Department of Aerospace Engineering. Corley Hall Corley Hall houses the Department of Biosystems Engineering. Gavin Engineering Research Laboratory The Gavin Engineering Research Laboratory houses advanced research technologies and laboratory space, including the National Center for Additive Manufacturing Excellence. Harbert Center The Harbert Center houses the Department of Civil and Environmental Engineering. Auburn University Research and Innovation Campus Fosters interagency and interdisciplinary collaboration in the Huntsville technology sector. MRI Center The Auburn MRI Research Center houses 3T and 7T MRI scanners, along with a wet lab and educational training center. NCAT The National Center for Asphalt Technology houses the NCAT Test Track and conducts research, education and outreach related to asphalt pavements. Ramsay Hall Ramsay Hall includes Auburn Engineering's online and continuing education programs and classrooms. Ross Hall Ross Hall is the home of the Department of Chemical Engineering. Shelby Center The Shelby Center for Engineering Technology complex houses the departments of computer science and software engineering and industrial and systems engineering as well as administrative offices. Stormwater Research Facility Established in 2009, the Stormwater Research Facility at Auburn University is dedicated to producing innovative and practical solutions for stormwater management. Wiggins Hall Wiggins Hall is the home of the Department of Mechanical Engineering. Wilmore Laboratories Wilmore includes laboratories for several academic departments. Woltosz Engineering Research Laboratory The Woltosz Engineering Research building includes laboratories and administrative offices. History <!-- ul.timeline { list-style-type: none; position: relative; } ul.timeline:before { content: ' '; background: #d4d9df; display: inline-block; position: absolute; left: 29px; width: 2px; height: 100%; z-index: 1; } ul.timeline > li { margin: 20px 0; padding-left: 20px; font-size: 1.15em; } ul.timeline > li:before { content: ' '; background: #cc4e0b; outline: 5px solid #cc4e0b55; display: inline-block; position: absolute; border-radius: 50%; border: 4px solid #cc4e0b; left: 22px; width: 16px; height: 16px; margin-top: .25em; z-index: 2; transition: all .6s; } ul.timeline > li.viewed:before { background: white !important; outline: 5px solid #fff !important; } ul.timeline .timeline-date { font-weight: bold; margin-bottom: .5em; } --> window.addEventListener('scroll', function () { var timelineItems = document.querySelectorAll('.timeline li'); timelineItems.forEach(function (item) { var rect = item.getBoundingClientRect(); var halfwayPoint = 2 * window.innerHeight / 3; if (rect.top <= halfwayPoint) { // Element is at or above the halfway mark item.classList.add('viewed'); } }); }); The Samuel Ginn College of Engineering has a rich history at Auburn University. In 1872, the then-named Agricultural and Mechanical College of Alabama awarded its first degrees, including four bachelor's, two master's and one professional degree in civil engineering. Since that time, Auburn Engineering has become known for producing the nation's best and most innovative engineers. Since 1872, we have seen many milestones including: 1872 Awarded first undergraduate bachelor's degree of engineering to B.H. Johnson 1908 Named the College of Engineering with the inclusion of civil, electrical, mechanical and mining departments 1913 Formed the Department of Chemical Engineering 1923 Maria Rogan Whitson becomes first female graduate, earning a degree in electrical engineering 1930-1932 The first courses in aeronautical engineering were offered and taught in the Department of Mechanical Engineering; name changed to the Department of Mechanical and Aeronautical Engineering 1945 Now a school, Auburn Engineering is reorganized into five departments: aeronautical, civil, electrical, industrial and mechanical and two management programs: aviation and industrial 1965 Materials engineering becomes an official degree program 1984 The Department of Computer Science and Software Engineering is established 1998 Department of Agricultural Engineering, formed in 1919, changes name to Department of Biosystems Engineering to reflect its mission and scope 1999 College offers the Southeast's first bachelor's and master's degrees in software engineering 2001 College is renamed as the Samuel Ginn College of Engineering in honor of his vision and philanthropy 2002 College offers the nation's first wireless engineering degree 2005-2011 The Shelby Center for Engineering Technology is constructed, housing the Department of Industrial and Systems Engineering, the Department of Computer Science and Software Engineering, labs, classrooms and administrative areas 2016 Construction begins on the Brown-Kopel Engineering Student Achievement Center which will house flexible classrooms, computer laboratories, study rooms, project incubators and more, to enhance the Auburn Engineering student experience 2019 Brown-Kopel Engineering Student Achievement Center opens 2021 Advanced Structural Engineering Laboratory opens 2022 Auburn University Research and Innovation Campus opens in Huntsville 2022 150th anniversary commemoration Samuel Ginn Samuel Ginn, a native of Anniston, Alabama, is a 1959 graduate of Auburn University's College of Engineering, and was awarded the institution's honorary doctorate in 1998. He was inducted into the State of Alabama Engineering Hall of Fame in 1992. Ginn also served on the university's board of trustees from 2005-2013. Ginn has more than four decades of experience in the telecommunications industry. Following his service with the Army Signal Corps, he built a 27 year career with AT&T beginning as a student engineer in 1960. He rose through the ranks in management and operations, and in 1977 was appointed vice president of network operations for AT&T Long Lines. After the Bell Systems breakup, Ginn joined Pacific Telephone in 1978 as vice president–Los Angeles, going on to serve as chairman and CEO of Pacific Telesis from 1988 until 1994. When he resigned, Ginn launched AirTouch, an early pioneer in the cellular industry that went public in 1994 with an IPO of $10 billion. In 1999, the company was sold for $65 billion to Vodafone where Ginn assumed the position of chairman in the United Kingdom. During his tenure, Vodafone merged with Verizon to create Verizon Wireless, the largest wireless telecommunications network in the U.S. Ginn retired from Vodafone in 2000. Ginn serves on the boards of the Franklin Templeton Fund and ICO Global Communications. His past corporate board memberships have included CH2M Hill, First Interstate Bank, Pacific Telesis Group, Safeway, Transamerica Corporation, Vodafone, AirTouch Communications, Chevron Corporation, Hewlett-Packard and the Fremont Group. He has also served as chairman of the California Business-Higher Education Forum, the California Business Roundtable and the Committee on Jobs, and is an overseer at the Hoover Institute in Palo Alto, as well as a Sloan fellow at Stanford University's School of Business. An investor and advisor to several start-up companies in telecommunications, Ginn is the namesake for the Samuel Ginn College of Engineering at Auburn University. He has served as the impetus behind the wireless engineering degree program at Auburn and continues his involvement with the institution through its wireless advisory board. As part of its philanthropic activities, the Ginn Family Foundation supports merit scholarships within the college. Married to Ann Vance Ginn, they have three children and six grandchildren. Samuel Ginn College of Engineering Awards Each year, we recognize outstanding faculty and students who are making a difference in our college through our awards program. From scholarship to research opportunities Auburn Engineering is proud to recognize and aid individuals who represent our vision of being the best student-centered engineering experience in America. 100+ Women Strong Graduate Student Fellowship 100+ Women Strong Leadership Award (Graduate) 100+ Women Strong Leadership Award (Undergraduate) 100+ Women Strong Leadership in Diversity Faculty/Staff Award 100+ Women Strong Outstanding Departmental Annual Graduate Award 100+ Women Strong Study Abroad Award Distinguished Auburn Engineer Award Engineering Student Organization Award Fred H. Pumphrey Teaching Award / SGA Outstanding Faculty Award J. Alley Family Graduate Student Leadership Fellowship Jeff and Linda Stone Leadership Awards Mark A. Spencer Creative Mentorship Outstanding Departmental Alumni Awards Outstanding Departmental Faculty Awards Outstanding Departmental Student Awards Outstanding International Student Awards Outstanding Staff Award Outstanding Young Auburn Engineer Award Research Awards for Excellence (Junior Faculty) Research Awards for Excellence (Senior Faculty) Samuel Ginn Outstanding Engineering Student Staff Champion for the Student Experience Superior Service Award Vandegrift Co-op Student of the Year William F. Walker Teaching Awards"
