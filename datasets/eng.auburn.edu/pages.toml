full_description = ".title-container { max-height: 50vh; } .page-content { padding-top: 0px; } /* Container for the Flip Card */ .research-flip-card { background-color: transparent; width: 100%; height: auto; aspect-ratio: 3 / 2; perspective: 1000px; position: relative; } /* Inner Container for the Flip Effect */ .research-flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; } /* Flip the Card on Hover */ .research-flip-card:hover .research-flip-card-inner { transform: rotateY(180deg); } /* Front and Back Side of the Flip Card */ .research-flip-card-front, .research-flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; overflow: hidden; } /* Front Card Styles */ .research-flip-card-front { background-color: rgba(11, 35, 65, 0.8); color: #fff; } .research-flip-card-front img { width: 100%; height: 100%; object-fit: cover; } /* Back Card Styles */ .research-flip-card-back { background-color: rgb(11, 35, 65); color: white; transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); } /* Styling the Focus Areas on Back Side */ .research-focus-areas { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; width: 100%; padding: 10px; flex-wrap: wrap; /* Ensure buttons stack on smaller screens */ } /* Adjust the button/link width to prevent overflow */ .research-focus-areas a { color: #ffffff; text-decoration: none; font-size: 1em; margin: 4px 0; padding: 4px 6px; transition: background-color 0.3s, transform 0.3s; line-height: 1.3; display: block; width: 90%; /* Restrict the button width */ max-width: 300px; /* Prevent them from becoming too wide */ background-color: rgba(255, 255, 255, 0.1); text-align: center; } /* Media queries to reduce button font size by 20% */ @media (max-width: 1200px), (max-width: 992px), (max-width: 768px), (max-width: 576px) { .research-focus-areas a { font-size: 0.65em; width: 100%; /* Full width for all smaller screens */ max-width: 300px; /* Prevent the buttons from being too wide */ } } /* Additional styles */ .card-label .card-img-overlay { background-color: #0B2241; } .card-label { overflow: hidden; border: 2px solid #0b2241; } .card-label .card-title { font-size: 1.2rem; color: #fff; } .card-img-overlay { background-color: rgba(11, 34, 65, 0.8); transition: background-color 0.3s ease-in-out; position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; } .card-label:hover .card-img-overlay { background-color: rgba(11, 34, 65, 1); } .card-title { color: #fff; font-size: 1.5rem; text-align: center; width: 100%; } .zoom-img { overflow: hidden; } .research-flip-card, .card-label { height: auto; aspect-ratio: 3 / 2; } .row { margin: 0; } .mb-4 { margin-bottom: 1.5rem; } Find an Expert Engineering Research Administration Focus Areas Advanced Manufacturing and Materials Infrastructure and Transportation Cybersecurity and Intelligent Systems Energy and Environment Biomedical and Health Systems Research Centers Engineering Analytical Lab The Samuel Ginn College of Engineering is among the nation's top academic institutions for research expenditures. We welcome the opportunity to collaborate with government agencies, businesses and foundations to identify research needs, expand established technologies and develop new ones, and transfer knowledge and technology to industry. Our researchers are experts in their fields and have been honored at the international, national, regional and state levels for their academic and professional contributions. Our list of early and emerging investigator awardees continues to grow as our faculty's breadth and depth of knowledge expands. With safety at the forefront, our faculty, staff, students and external partners are committed to the discovery of new engineering technologies, concepts and processes and the hardware necessary to realize them."
