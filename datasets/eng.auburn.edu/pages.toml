["https://eng.auburn.edu/auari"]
title = "Samuel Ginn College of Engineering"
description = "Samuel Ginn College of Engineering"
full_description = "The Auburn University Applied Research Institute operates within the Auburn University Research and Innovation Campus in Huntsville's Cummings Research Park near the Redstone Arsenal, a 38,000-acre federal research, development, test and engineering center housing NASA's Marshall Space Flight Center and the Army's missile, aviation and missile defense programs. Our 40,000 square feet of laboratory space allows Auburn faculty and students to conduct cutting-edge research and development across a range of technology readiness levels to help customers overcome national security, aerospace and biotechnology challenges. We're focused on advanced manufacturing, additive manufacturing, biotechnology, quantum metrology, cyber and critical infrastructure security and assured position, navigation and timing. Our facilities are also available for use as an operations center for NASA, the Department of Defense and private sector missions. 40,000 square feet of laboratory space allows Auburn faculty and students to conduct cutting-edge research and development across a range of technology readiness levels to help customers overcome national security, aerospace and biotechnology challenges. Focused on advanced manufacturing, additive manufacturing, biotechnology, quantum metrology, cyber and critical infrastructure security and assured position, navigation and timing. Facilities are available for use as an operations center for NASA, Department of Defense and private sector missions. Contact Us:256.692.7133345 Voyager Way NW, Huntsville, AL 35806 Institute News Pettus named executive director of Auburn University Applied Research Institute in Huntsville Auburn University’s Office of the Senior Vice President for Research and Economic Development has hired Jonathan Pettus as executive director of the Auburn University Applied Research Institute (AUARI) in Huntsville, effective February 1. Auburn Engineering secures record $117.7 million in new research awards and contracts for FY24 David named associate dean for research Vice Chairman of the Joint Chiefs of Staff tours Auburn Engineering research centers Visit the Newsroom Right-pointing arrow"
