full_description = "What is commissioning? Commissioning is the process of assessing needs, planning and prioritising, purchasing and monitoring health services, to get the best health outcomes. Who commissions NHS services? Services are commissioned by integrated care boards and are overseen by NHS England on a regional basis. How commissioning is changing Commissioning continues to develop in line with the aims set out in the NHS Long Term Plan. Commissioning oversight We have a statutory duty to conduct an annual assessment of every integrated care board. Public health commissioning NHS England works closely with UK Health Security Agency and the Department of Health and Social Care to provide and commission a range of public health services."
