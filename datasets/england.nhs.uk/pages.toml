full_description = "About urgent and emergency care Our ambition is to ensure patients get the right care in the right place, whenever they need it. NHS 111 NHS 111 is the free number to call when you have an urgent healthcare need. It directs you to the right local service, first time. Ambulance Find out how we support commissioners and ambulance services to further improve services for patients. Reducing length of stay Find out how we're continuing to improve performance at getting people home without unnecessary delay when they are ready to leave hospital. Same day emergency care Under this model of care, patients presenting at hospital with relevant conditions can be assessed, diagnosed, treated and discharged home the same day if clinically safe to do so, rather than being admitted to hospital. Urgent treatment centres Urgent treatment centres will provide fast and efficient care closer to home, improve patient care and reduce unnecessary A&E attendances. Waiting list falls as NHS staff treated record numbers last year 13 February 2025 CancerElective careUrgent and emergency care NHS staff delivered a record 18 million treatments in 2024, as the waiting list fell in December for the fourth month in a row. The overall backlog has dropped again from 7.48 million to 7.46 million, while the estimated number of patients waiting is down from 6.28 million to 6.24 million. Monthly figures show that […]"
