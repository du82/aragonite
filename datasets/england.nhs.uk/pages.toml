["https://www.england.nhs.uk/cancer"]
title = "NHS England » Cancer"
description = "NHS England » Cancer"
full_description = "About cancer Cancer affects us all. Delivering the best outcomes for cancer patients is an absolute priority; we want every person with cancer to have the very best diagnosis, treatment and care. Prevention and public health We will significantly reduce the 40% of cancers caused by behavioural, lifestyle and environmental factors. Diagnosing cancer earlier Earlier diagnosis makes it more likely that patients will receive treatments that can cure cancer. It saves lives. Diagnosing cancer faster Waiting to find out whether you have cancer is a hugely anxious time - we are putting in place measures to speed up cancer diagnoses. Cancer Experience of Care We are improving patient experience and putting it on an equal footing with other clinical outcomes. Personalised care and improving quality of life outcomes We will support people affected by cancer to live healthy and happy lives. Cancer Alliances, improving care locally People affected by cancer and clinical leaders will be in the driving seat for improving quality. Operational management, administration and performance Information and resources for cancer managers, multidisciplinary team co-ordinators and other operational colleagues that work in cancer services. The NHS Long Term Plan and commitments for cancer Cally Palmer, NHS England’s National Cancer Director shares her thoughts on the NHS Long Term Plan and what it means for cancer. Cally gives an overview of cancer screening programmes, the new 28-day faster diagnosis standard and the care and treatment options available. Cally also talks about the Targeted Lung Health Checks programme, one of the first programmes to roll out of the Long Term Plan. Investing in radiotherapy to fight cancer Watch this short video which shows how we are investing in radiotherapy to fight cancer. Funded by NHS England, University College London Hospitals are one of the first hospitals to receive a new LINAC radiotherapy machine. In this video, patient Chris Duggan talks about the treatment he is experiencing, and Dr. Yen-Ching Chang describes how this new equipment works."
