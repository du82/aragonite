["https://www.england.nhs.uk/2025/02/nhs-chief-to-stand-down-at-end-of-march"]
title = "NHS England » NHS Chief to stand down at end of March"
description = "Amanda Pritchard has today formally notified the NHS England Board of her decision to stand down as chief executive at the end of this financial year. Amanda has been Chief Executive since August 2021 and chief operating officer since 2019, leading the NHS through the most challenging period in its 76-year history. Having discussed this […]"
full_description = "NHS Chief to stand down at end of March 25 February 2025 About us Amanda Pritchard has today formally notified the NHS England Board of her decision to stand down as chief executive at the end of this financial year. Amanda has been Chief Executive since August 2021 and chief operating officer since 2019, leading the NHS through the most challenging period in its 76-year history. Having discussed this with the Secretary of State for Health and Social Care over recent months – now that the NHS has turned a corner on recovery from the pandemic and the foundations are in place to make the necessary changes to the centre to best support the wider NHS – Amanda has decided now is the right time to stand down. Sir James Mackey will be taking over as Transition CEO of NHS England, working closely with Amanda for the next month before taking up post formally on the first of April. During Amanda’s time as chief executive, the NHS has responded to the Omicron wave of Covid-19, protecting tens of millions of adults in England with a booster vaccine, published the first ever NHS Long Term Workforce Plan and turned the corner on the inevitable impacts of the pandemic – with A&E waiting times, elective and cancer performance, acute sector productivity, and staff survey results all now improving. Under Amanda’s leadership, NHS England has also reduced its headcount by over a third and already made savings of nearly £500 million to reinvest in frontline care. At the same time she has overseen reforms in the Health and Care Act 2022, including the replacement of almost 200 clinical commissioning groups with 42 integrated care boards; major improvements in the NHS’s digital infrastructure, including far more services available through the NHS App and the rollout of virtual wards; and the forging of groundbreaking partnerships to improve care options for patients, including the NHS Genomic Medicine Strategy, the Cancer Vaccine Launch Pad, and CAR-T cancer therapies. Jim will step in on a secondment basis, with a remit to radically reshape how NHS England and DHSC work together. To ensure a smooth transition, he will work closely with Amanda until the end of her time in post. He is currently the Chief Executive of Newcastle Hospitals NHS Foundation Trust and National Director of Elective Recovery, with demonstrable experience of leadership at a local, regional and national level. Jim has previous experience of national leadership within the NHS – notably during his previous tenure as chief executive of NHS Improvement. The first woman in the health service’s history to hold the post of chief executive, Amanda began her NHS career as a graduate management trainee in 1997 after studying at Oxford University and has held a variety of other NHS management positions. Before joining NHS England in 2019, she served as Chief Executive of Guy’s and St Thomas’ NHS Foundation Trust, was previously Deputy Chief Executive at Chelsea and Westminster NHS Foundation Trust and also served as a health team leader in the Prime Minister’s Delivery Unit. Amanda Pritchard, NHS Chief Executive said: “It has been an enormous privilege to lead the NHS in England through what has undoubtedly been the most difficult period in its history. “I am immensely proud of the NHS response to COVID-19, and how we have delivered steady recovery from the inevitable impacts of the pandemic – with performance in urgent and emergency care, elective and cancer all improving over the past two years, while NHS teams delivered record levels of activity in primary care, community and mental health services, meaning millions more appointments for patients. “We always knew the recovery period after a once-in-a-century pandemic was going to be incredibly challenging, and whilst the timeliness and experience of care is still not good enough for too many people, the NHS has achieved a great deal in the face of historic pressure thanks to a relentless focus on innovation and reform. “From the rollout of community diagnostic centres and mental health teams in schools, to world-leading cancer vaccines and the development of the App, the NHS now feels very different to when I became chief executive over three and a half years ago. “While it has been a hugely difficult decision for me to stand down, I believe now is the right time – with the NHS making continued progress in our recovery, and with the foundations firmly in place to deliver the 10 Year Health Plan. “The NHS is full of extraordinary people, who do extraordinary things every day for patients. The achievements I have listed above, and many more, are theirs – and I am confident they will continue to achieve incredible things for patients now, and into the future”. Wes Streeting, Secretary of State for Health and Social Care, said: “Amanda can be enormously proud of the leadership she has given in the face of the biggest health emergency for our country in modern history, as well as steering NHS England during turbulent political waters and six secretaries of state in her time as Chief Executive. She has led with integrity and unwavering commitment. “The start of the next financial year and the publication of the 10 Year Plan for Health will be pivotal moments on the road to reform. We will also require a new relationship between the Department of Health and Social Care and NHS England. “I am delighted that Jim Mackey has agreed to step up to provide new leadership for a new era for the NHS. He knows the NHS inside out, can see how it needs to change, and will work with the speed and urgency we need.” Sir James Mackey said: “I have always been very proud to work for the NHS and it will be an honour to lead the service through the next phase as we radically reshape the role of NHS England and work with the Government to build an NHS that is fit for the future through the 10 Year Health Plan. “The NHS has experienced the most challenging period in its history – not only the shock of the pandemic but picking up the pieces after. Amanda has done an extraordinary job of leading the NHS through this difficult period. “I am sad to be stepping away from Newcastle Hospitals, and it has been a privilege to be part of the dedicated and talented team there over the last 14 months. I have learned a great deal from colleagues there as we have successfully tackled some difficult issues and made significant improvements. I look forward to rejoining them in due course.” Richard Meddings, Chair of NHS England said: “While I understand Amanda’s wish to stand down to facilitate the reshaping of the roles and relationship between NHSE and the DHSC, this is a huge loss for the NHS. “Under her leadership, the NHS has delivered a huge amount for patients – in the face of pandemic recovery, unprecedented strikes and consecutive even busier winter periods, the NHS has continued to improve performance, reform and innovate. And the NHS in England today is delivering record levels of healthcare as it faces ever increasing demand. “Not only that but Amanda has driven forward significant productivity improvements and made billions of pounds of savings for taxpayers. “Amanda is without doubt one of the most skilled and driven people I have had the privilege to work with and I wish her every success for the future.” Former NHS chief executive Lord Simon Stevens, reflecting on his time working alongside Amanda Pritchard, said: “Having been a widely respected chief executive of Guy’s and St Thomas’ hospitals, Amanda then agreed to step up and serve as NHS chief operating officer and subsequently CEO under some of the most demanding circumstances the Health Service has ever faced. I am personally hugely grateful for her outstanding leadership as my deputy during Covid, when she played such a critical role in successfully leading the NHS through the pandemic.” Former health secretary Sajid Javid said: “Amanda’s departure is a great loss for NHS England. She has been a tireless NHS champion, showing exceptional leadership through the pandemic and recovery. Despite immense pressures, she has led with skill and dedication, achieving much for patients. I thank her for her service and wish her the very best.” Former health secretary Jeremy Hunt said: “Amanda Pritchard has been an outstanding CEO in troubled times for the NHS. One of her biggest legacies will be the long term workforce plan which doubles the number of doctors we train. She will be greatly missed for the principled and effective way she got things done.” Lord Ara Darzi said: “I have known Amanda since she was at Chelsea and Westminster over 20 years ago and I can say that she has always been a true champion of the NHS. “There is absolutely no doubt that Amanda has led the NHS through its most difficult periods in recovering from the shock of the pandemic – she should be immensely proud of the exceptional leadership she has shown during this time. I know Amanda will succeed in whatever she chooses to do next.” Chair of the Academy of Medical Royal Colleges, Dr Jeanette Dickson said: “Today’s disappointing news has hit people hard. She is an extraordinary leader who has led the NHS through some of its toughest times. We wish her well.” Charity Director at Age UK, Caroline Abrahams said: “Much will be written about what this means, but I’d like to sincerely thank Amanda for always giving 110% to the toughest of jobs at an incredibly challenging time.” Interim Chief Executive of NHS Providers, Saffron Cordery said: “I would like to pay tribute to the immense contribution that Amanda Pritchard has made to the NHS, as chief executive of NHS England, a trustee at NHS Providers, and throughout her long and distinguished career in the health service to date. “Amanda has been an inspirational leader. She has embodied the values of the NHS, acting on her genuine passion to ensure high quality care for NHS patients. “She has shown immense fortitude in a range of leadership roles, helping to steer the NHS through some of the most difficult days in its history, including the pandemic and its aftermath, unprecedented financial pressures and structural upheavals. “Amanda has never shied away from the scale of the challenges the health service faces, but her desire to engage with colleagues at all levels across the NHS has helped forge a closer relationship between NHS England and the frontline. “She leaves a legacy of hope for a renewed and resilient NHS as work continues in shaping the forthcoming 10 Year Health Plan.” Chief Executive of NHS Confederation, Matthew Taylor said: “On behalf of our members, I would like to thank Amanda for her leadership of NHS England over the last 3 and a half years. “During her tenure, she has helped the NHS to navigate pivotal moments including the COVID-19 pandemic and subsequent recovery efforts, the advent of integrated care systems and primary care networks, the NHS’s first workforce strategy and dealing with the impact of industrial action and significant funding boosts. As the first woman in the NHS’s history to hold this post, her appointment was a landmark occasion for the sector and its staff. “While her role has seen her face many challenges, including constraints on capital, rising demand for services and ill-health, the large-scale restructuring of NHS England, and navigating 6 health secretaries, her commitment to the service has been evident in everything she has done. “I have enjoyed the opportunity to work closely with Amanda and hope that she will be able to continue supporting the NHS. “As we look to the future, we remain committed to working collaboratively with NHS England and Jim Mackey as its transition chief executive to continue building on the progress made to support the NHS and as work continues to develop the ten-year plan.” Chief Executive of The King’s Fund, Sarah Woolnough said: “Leading the NHS is one of the most important public sector jobs in our country. Amanda Pritchard took over as Chief Executive during the profound challenges of the Covid-19 pandemic having served as chief operating officer and oversaw much of the recovery process. “Since then, she has delivered several positive improvements to the NHS including publication of the first long term workforce plan for the NHS and rolling out huge developments in the NHS app to make it easier for people to access services. “Amanda is passionate about the needs of NHS staff and patients, understands the challenges the NHS faces, and has strived to make the health care system better in extremely difficult financial and operational circumstances.” Dr Rich Scott, Chief Executive Officer at Genomics England said: “Under Amanda’s leadership, thousands of NHS patients have been able to benefit from cutting-edge genomic testing that has led to diagnoses and treatments for rare conditions and cancers. “In her time as Chief Executive, Amanda has championed genomics research programmes, supporting the generation of evidence needed to design healthcare for the future and demonstrating the potential of the country to be the place to test, prove and roll out innovations. “The publication of the 10 Year Health Plan will be a landmark moment in the health service’s reform and for the health of the nation. Thanks to the foundations laid during Amanda’s leadership, genomics will play a critical role in supporting the three shifts needed to build a health service fit for the future and driving the growth agenda.” Michelle Mitchell, chief executive of Cancer Research UK, said: “On behalf of Cancer Research UK, I’d like to extend our gratitude to Amanda Pritchard for her time and dedication as chief executive of NHS England. I’ve always been struck by her commitment to improve our health service, and she has worked particularly hard to improve the lives of cancer patients. I appreciate all that she has done. “We look forward to continuing to work with NHS England and the UK government on the upcoming National Cancer Plan for England. This plan is a huge opportunity to transform cancer services, support the NHS and help people live longer, better lives.” Jacob Lant, Chief Executive of National Voices said: “Amanda Pritchard took over as Chief Executive of NHS England during the COVID-19 pandemic. She showed strong and calm leadership during this extremely testing time and has continued to do so as the NHS has sought to recover performance and deliver the care people need. “We would like to thank Amanda for her dedication to the NHS, and to acknowledge her willingness to work with the VCSE sector to hear from the most marginalised and minoritised communities. Last month’s Elective Care Reform plan is just one example of how Amanda has brought an increased focus to addressing health inequalities and improving patient experience. “We look forward to continuing these conversations with Sir James Mackey as he transitions into his new role, and stand ready to support at this crucial moment helping to develop and implement the NH"
