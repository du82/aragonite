["https://www.england.nhs.uk/nhs-at-home"]
title = "NHS England » NHS @home"
description = "NHS @home is an approach to providing better connected, more personalised care in people’s homes including care homes. It aims to ensure people have faster access to more appropriate and targeted care, without necessarily having to attend emergency care or arrange GP appointments. NHS @home builds upon what we have learned during the COVID-19 pandemic […]"
full_description = "NHS @home is one part of increasing operational resilience in urgent and emergency care this winter. For more information about different elements of this work, follow the links below or email england.home@nhs.net COVID oximetry @home This service supports people who have been diagnosed with coronavirus and are most at risk of becoming seriously unwell. People are given pulse oximeters to monitor their oxygen levels at home. Blood pressure monitoring @home Also known as home blood pressure monitoring. This service enables people to measure and share their blood pressure readings with their GP from their home. Acute respiratory infection hubs Acute respiratory infection hubs can support systems to manage a rise in respiratory infections (eg Covid-19, respiratory syncytial virus (RSV), influenza and other infections). Managing heart failure @home Managing heart failure @home is an approach that aims to support people to better manage their heart failure condition and keep well at home. Other current projects include Lung Health @home and Long Term Conditions Care @home. For more information about any of these projects, email the team or visit FutureNHS (health and care professionals only and requires a log in)."
