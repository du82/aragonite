full_description = "Reforming elective care for patients Document first published: 6 January 2025 Page updated: 9 January 2025 Topic: Elective care Publication type: Policy or strategy Our new plan sets out how the NHS will reform elective care services and meet the 18 week referral to treatment standard by March 2029. Under this plan elective care will be increasingly personalised and digital, with a focus on improving experience and convenience, and empowering people with choice and control over when and where they will be treated. Document Reforming elective care for patients PDF725 KB Summary Our plan for reforming elective care. Published 6 Jan 2025. Link Reforming elective care for patients NHS England is not responsible for content on external websites. Summary Our plan for reforming elective care. Accessible content. Published 6 January 2025. Link Patients’ guide to the elective care reform plan NHS England is not responsible for content on external websites. Summary Patients’ guide to the elective care reform plan. Accessible content. Published 6 January 2025. Link Elective recovery: a partnership agreement between the NHS and the independent sector NHS England is not responsible for content on external websites. Summary Agreement between NHS England and the Independent Healthcare Providers Network to work together for the benefit of NHS patients. Accessible content. Published 6 January 2025. Link Publication of the plan to reform elective care for patients NHS England is not responsible for content on external websites. Summary NHS elective reform plan letter. Accessible content. Published 6 January 2025."
