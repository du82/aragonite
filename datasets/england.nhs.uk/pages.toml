["https://www.england.nhs.uk/ltwp"]
title = "NHS England » NHS Long Term Workforce Plan"
description = "NHS England » NHS Long Term Workforce Plan"
full_description = "The plan will deliver the biggest increase in training numbers in our 75-year history with record numbers of nurses, doctors, dentists, allied health professionals and other key healthcare staff to address the gaps in the current workforce and meet the challenge of a growing and ageing population. About the plan How the NHS Long Term Workforce Plan is meeting the challenges of a growing and ageing population. Reforming the workforce How we can put the NHS on a sustainable future footing by training, retaining and reforming the workforce to deliver multi-disciplinary teams serving patients across the NHS."
