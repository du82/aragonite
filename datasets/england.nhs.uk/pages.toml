evious passwords. Contains a mixture of characters including, upper case, lower case, numbers and symbols found on the keyboard (e.g. {, !, %, *, etc.) Passwords must not under any circumstances be shared with anyone. For increased security consider using a passphrase. See additional tips for creating strong passwords and passphrases. Information about you and your visits to our sites NHS England processes information about you in accordance with our privacy and cookies policy. By using our sites, you consent to such processing and you warrant that all data provided by you is accurate. Or further information see our privacy and cookies policy. Freedom of information The data rights and responsibilities of NHS England, its staff and of patients is governed by the Freedom of Information Act 2000 and the Data Protection Act 1998. For policy and other information see: Read further information on freedom of information. Linking to the NHS England website We do not object to you linking directly to pages on this site. We reserve the right to move or change our website URLs at any time. Rather than deep linking we recommend linking to section homepages, which are less likely to move or change. However, we don’t give permission to suggest that your website is associated, or endorsed by, NHS England. Linking from the NHS England website We are not responsible for the content or reliability of the websites we link to and do not necessarily endorse the views expressed within them. We aim to replace broken links to other sites but cannot guarantee that these links will always work as we have no control over the availability of other sites. Due to the very nature of the internet we cannot guarantee our site or other sites we link to will always be available to you. Social media, bookmarking and digital engagement NHS England may from time to time provide third party or owned social media and interactive services on our site or linked to our site, currently this includes and is n