full_description = "Comparison between the recently published ONS quarterly public service productivity statistics and NHS England productivity statistics 13 February 2025 Office for National Statistics and NHS England Information StandardOperational performance Joint note by the Office for National Statistics and NHS England, February 2025. The Office for National Statistics (ONS) publishes annual public service productivity analysis for all service areas in the UK, including healthcare. The methodology used for annual productivity analysis is considered ‘gold standard’ and is the most robust productivity estimate available. ONS, NHS […] Read more Tackling digital exclusion and health literacy: How libraries can help bridge the gap 23 January 2025 Dr Vin Diwakar and Professor Bola Owolabi DigitalHealthcare inequalities In today’s digital age, managing your health online should be easier than ever – yet for many, it’s still a challenge. Digital exclusion and low health literacy are significant barriers stopping people from fully engaging with their health via NHS.UK or the NHS App. So, why is this happening, and what can we do about […] Read more NHS Research Secure Data Environments – how collaboration is helping drive improved public health and patient care 17 January 2025 Jake Marshall Information governancePatient care Jake Marshall, Head of Life Sciences and Public Sector Partnerships for the Data for Research and Development Programme, shares his perspective on how collaboration is shaping the NHS Research Secure Data Environment (SDE) Network to meet the needs of researchers and bring benefits for patients and the public. NHS England’s Data for Research and Development […] Read more Creating the conditions for improvement and the leadership challenge – reflections from a chief executive officer 18 December 2024 Professor Andy Hardy Improvement Professor Andy Hardy, Chief Executive at University Hospitals Coventry and Warwickshire (UHCW) and Deputy Chair of the National Improvement Board shares his learning from embedding improvement into UHCW. Our quality improvement journey at UHCW started in 2014 when we launched the Together Towards World Class programme. We got a new vision ‘to be a national […] Read more"
