description = "2025/26 priorities and operational planning guidance  In line with the Government Mandate, the 2025/26 priorities and operational planning guidance sets out a focused, smaller number of national priorities for 2025/26 with an emphasis on improving access to timely care for patients, increasing productivity and living within allocated budgets, and driving reform. To support this, systems […]"
full_description = "2025/26 priorities and operational planning guidance In line with the Government Mandate, the 2025/26 priorities and operational planning guidance sets out a focused, smaller number of national priorities for 2025/26 with an emphasis on improving access to timely care for patients, increasing productivity and living within allocated budgets, and driving reform. To support this, systems will have greater control and flexibility over how they use local funding to best meet the needs of their local population. 2025/26 priorities and operational planning guidance Our new operating model: supporting you to deliver high quality care for patients Revenue finance and contracting guidance for 2025/26 NHS financial framework: integrated care board and system finance business rules Capital guidance for 2025-26 Guidance on developing the joint forward plan The guidance on developing the joint forward plan supports integrated care boards, their partner NHS trusts and foundation trusts to continue to develop their joint forward plans with system partners. We expect that integrated care boards (ICBs) and their partner trusts will wish to perform a limited refresh of their existing plans before the start of the new financial year given the anticipated publication of the 10 Year Health Plan in spring 2025 and a multi-year financial settlement for the public sector as part of the Spending Review 2025. Guidance on developing the joint forward plan Other useful links NHS Payment Scheme 2025/26 consultation Allocation of resources 2025/26 Better Care Fund policy framework 2025 to 2026 (published on GOV.UK) Better Care Fund (BCF) planning requirements Previous planning guidance can be found on the following page: NHS England » Previous planning guidance"
