["https://www.england.nhs.uk/accessibility"]
title = "NHS England » Accessibility statement for NHS England"
description = "This accessibility statement applies to www.england.nhs.uk This website is run by NHS England. In April 2023 NHS England merged with Health Education England and NHS Digital to form a new organisation. We are reviewing our legacy website estate to simplify the experience and improve accessibility for our users. We want as many people as possible […]"
full_description = "This accessibility statement applies to www.england.nhs.uk This website is run by NHS England. In April 2023 NHS England merged with Health Education England and NHS Digital to form a new organisation. We are reviewing our legacy website estate to simplify the experience and improve accessibility for our users. We want as many people as possible to be able to use this website. For example, that means you should be able to: use your web browser to change colours, contrast levels and fonts zoom in up to 400% with text staying visible on the screen, and most images scaling without resolution loss navigate most of the website using a keyboard navigate most of the website using speech recognition software read most of the website using a screen reader, including the latest versions of JAWS, NVDA, and VoiceOver read most of the website on devices without a screen, like a braille computer use the website even if Javascript is switched off access the website using a mobile or tablet. We’ve also made the website text as simple as possible to understand. Some of our content is technical, and we use technical terms where there is no easier wording we could use without changing what the text means. If you have a disability then AbilityNet has advice to help you make your device easier to use. How accessible this website is This website is partially compliant with the Web Content Accessibility Guidelines 2.2 AA standard. We know some parts of this website are not fully accessible: Some essential but older PDF documents and other file formats are not fully accessible to screen reader software. For example, we publish PDFs which provide medical policy information Live video streams do not have captions The events area has some link descriptions missing Tableau visual data Feedback and contact information If you need information on this website in a different format like an accessible PDF, large print, easy read, audio recording or braille email england.contactus@nhs.net or call 0300 311 22 333. We will consider your request and get back to you as soon as possible. Reporting accessibility problems with this website We’re always looking to improve the accessibility of this website. If you find any problems not listed on this page or think we’re not meeting accessibility requirements, email england.web@england.nhs.uk with details of the problem you have encountered. There are several other ways that you can contact us, including a British Sign Language service and a Next Generation Text service for customers who are deaf, hard of hearing or speech impaired. Find out more about how to contact NHS England."
author = "NHS England"
year_published = 2025
clearnet = "https://www.england.nhs.uk/accessibility"
