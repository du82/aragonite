["https://enlitic.com/blogs/rsna-stories"]
title = "My Favorite Stories From RSNA - Enlitic"
description = "Anyone who's ever attended RSNA knows that what happens in Chicago definitely doesn't stay in Chicago."
full_description = "Overcoming Data Incompatibilities in Healthcare Mergers: Best Practices for PACS and VNA Systems January 24, 2025 Dave Wilson, a seasoned healthcare professional with over two decades of experience, has a treasure trove of stories from his time at the Radiological Society of North America (RSNA) annual meetings. As the VP of Marketing & Communications at Enlitic, Dave brings a unique perspective to the world of radiology, having started his career as a Nuclear Medicine and MRI technologist before transitioning to marketing and leadership roles. His passion for improving patient care and reducing burnout among healthcare providers shines through in the anecdotes he shares from past RSNA events. Don’t miss the opportunity to meet Dave and the Enlitic team at RSNA 2024! Visit them at Booth 4365 in the South Hall, the Laitek Booth 7707 in the North Hall, or the Radiology Reimagined AI Showcase Booth 5104 in the South Hall to learn how Enlitic is revolutionizing radiology and data migration with innovative AI solutions. Anyone who’s ever attended RSNA knows that what happens in Chicago definitely doesn’t stay in Chicago. So, a big shoutout to my former colleagues (and still friends, for now) DK, Hoover, and Renee Marie—sorry in advance for airing our dirty laundry! This year marks my 25th Thanksgiving at RSNA. Yes, you heard that right! I’ve been celebrating turkey day by mingling with radiologists since 1999. Over the years, Chicago has transformed dramatically—remember when the area around McCormick Place felt more like a scene from a horror movie than a convention center? Back in 2001, we thought it would be a brilliant idea to WALK to dinner nearby. Spoiler alert: it was not! Upon returning to the hotel, the concierge looked at us like we were survivors of a zombie apocalypse, relieved that we hadn’t been eaten alive by the neighborhood. And yes, the urban legend about people sleeping in bathtubs? Totally true. One year, our booth was so terrible that we spent as much time fixing things as we did demonstrating. After long days of booth duty, we hit the bars harder than we hit our deadlines—bedtimes were more like “what’s sleep?” at 3-4 AM with a 7:30 AM wake-up call. Thank goodness for the Hyatt at McCormick Place; it was our oasis in a desert of regret!"
author = "Charlie Kayser"
year_published = 2020
year_updated = 2024
