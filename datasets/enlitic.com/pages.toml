title = "Privacy Policy - Enlitic"
description = "This privacy notice applies to the personal data Enlitic, Inc. (“Enlitic”) collects on this website."
full_description = "Privacy PolicyLast reviewed on January 23, 2024Table of Contents Purpose What Data Do We Collect? How Do We Collect Data? How To Opt Out of Cookies Enlitic’s Purpose For Processing This Data Is My Data Secure? Does This Privacy Notice Apply To Other Websites? Your Rights Pertaining Your Data How Long Will Your Personal Data Be Retained? Data Protection Officer. Authorized Representative. Changes To This Privacy Policy 1. PurposeThis privacy notice applies to all personal data Enlitic, Inc. (“Enlitic”) collects on this website. If you are an Enlitic customer, our privacy obligations to you shall be governed by this privacy policy, the terms of our contractual arrangement(s), as well as applicable local privacy laws and regulations. If you are applying for a job at Enlitic, Enlitic will process your personal information as described in this Privacy Policy and will be responsible for complying with applicable regulations. No matter where you are located, we are committed to processing your data in accordance with the principles outlined in Article 5 of the General Data Protection Regulation (GDPR) and other applicable laws. 2. What Data Do We Collect?Enlitic minimizes the information collected to only what is needed. Enlitic may process the following personal data on this website:Personal Identification Information (Name, Email Address, Phone Number, other contact information, etc.Employment DetailsBackground Information – such as academic/professional qualifications, education, CV/résumé, criminal records data (for vetting purposes, where permissible and in accordance with applicable law).Government Identifiers – such as government issued ID/passport, immigration/visa status, social security or national insurance numbers.Any other information you choose to provide via the forms presented on our websiteStrictly necessary cookies to enable the functionality of the websiteNon-essential cookies that gather the following information to support our enterprise marketing efforts: IP address, operating system, browser type, website usage, device type, region. 3. How Do We Collect Data?Enlitic collects data directly through the following methods:You voluntarily fill out a form presented on our websiteYou create an account in our Customer PortalYou submit a resume for our considerationWe obtain information from recruitment agencies, academic institutions, referees, background checking agencies and other third parties during your recruitment.Enlitic collects data automatically through the following method(s):Temporary and permanent cookies to identify users, track website navigation, and gather demographic information about visitors/usersEnlitic does not conduct any automated profiling of personal data on this website. 4. How To Opt Out of CookiesClick on the link shown, located at the bottom left of the page:This will open a page that will allow you to modify cookie settings used while on the website. This includes control over Strictly Necessary Cookies and Third Party Cookies. 5. Enlitic’s Purpose For Processing This DataWe will collect and process your personal data for the purpose of delivering services and/or to provide you with information that you have requested. If you submit a job application on our career page, we will process the personal data you choose to submit on the basis of our legitimate interests for ensuring that we recruit the appropriate employees. Enlitic will obtain specific consent before using non-essential cookies for the purposes of marketing performance and website analytics. Enlitic does not sell, trade, or otherwise transfer your personally identifiable information to any outside parties. 6. Is My Data Secure?Enlitic is committed to ensuring that your information is secure and held in compliance with applicable laws. In order to prevent unauthorized access or disclosure, we have put in place suitable physical, electronic and administrative procedures to safeguard and secure the information we collect. 7. Does This Privacy Notice Apply To Other Websites?This privacy notice only applies to this Enlitic website. Please note, our website may contain links to third-party websites. If you choose to follow a link and leave our site, we do not have any control over such website and we are not responsible for the protection and privacy of any information which you provide or make available while visiting such site. 8. Your Rights Pertaining Your DataIf you have personal data that is stored by Enlitic on this website you have the right to request an exported file of your personal data, including any data you have provided to us. You also have the right to request that we rectify or erase any personal data we hold about you. Requests can be directed to our Data Protection Officer as listed in the section below. Under the GDPR you are also guaranteed the following rights to your personal data:The right to withdraw consentThe right of accessThe right to erasureThe right to rectificationThe right to data portabilityThe right to objectNotification of data breachesThe right to lodge a complaint with a supervisory authority 9. How Long Will Your Personal Data Be Retained?Enlitic will maintain your personal data for only as long as is required to achieve the purpose for which the information was collected. 10. Data Protection OfficerEnlitic has appointed the following Data Protection Officer to oversee the management of all personal information in accordance with this privacy policy. If you have any questions or concerns you may reach out to our Data Protection Officer by emailing or writing to:Treya Collinstcollins@enlitic.com2510 East Harmony RoadSuite 202Fort Collins CO 8052811. Authorized RepresentativeEnlitic has appointed DataRep as our authorized representative for all GDPR related matters in the EU/EEA and UK. For details on how to contact our Data Protection Representative please see the following document: 12. Changes To This Privacy PolicyWe may make changes to this privacy policy in the future to reflect changes to the ways in which we handle personal data or changes in applicable laws. Please check back frequently to see any updates or changes to our privacy notice. The Privacy Policy modification date will be updated at the top of this page. If we make changes to the ways in which we use or share your personal information collected through this website we will notify you through the contact information you provide, whenever possible."
