full_description = "Be Enlitic WORKING HARD TO REFRAME OUR FUTURE. If you think that you’re Enlitic, introduce yourself! View Current Job Openings Check out Enlitic for your next career opportunity At Enlitic, our mission is heartfelt and we know we can only achieve it by hiring the most compassionate and sensible employees. Our values and principles are what guide us in our interactions every day and are what makes Enlitic feel more like a family then a workplace. Flexible schedules, learning the ins and outs of a growing company, and rich benefits are just a few aspects of what makes Enlitic a great Fort Collins career opportunity. Working closely with our innovative staff will provide you the opportunity to develop new skills to help you move forward in your career. We are looking for individuals that think beyond their new role and envision a career path in which their voice can be heard, and their intuition can thrive.To be Enlitic is to believe that intelligence can transform healthcare. It’s being committed to positively impacting patient care. We’re developing solutions that will determine the future of healthcare and we want to work with passionate professionals that show care for that cause. Our Mission Empower healthcare providers with the transformative capabilities of artificial intelligence. Our Vision Our vision is to be the leading provider of data management solutions for the medical imaging industry. The Perks of Being Enlitic Healthcare We offer premium medical, dental, vision, life insurance, short term disability (STD), and long term disability (LTD) for full time employees. We also offer HSA and FSA options and Enlitic makes a generous contribution to employee HSA accounts. Enlitic pays a generous portion of the premium for medical and dental and fully pays for vision, life insurance, STD, and LTD plans. Work / Life Enlitic has a generous PTO policy, and we offer Unlimited Paid Vacation. In addition, we have a one week Re-energize break in December and 10 observed annual holidays (US). Stay Fit Employees can receive up to $150 per month for wellness expenses including gym and exercise memberships, massage, and sporting equipment. Retirement We offer a 6% match for 401k with immediate participation and vesting. Learning & Development Along with group collaborations, our team delivers internal training on various topics. We offer education reimbursement for employees who wish to obtain degrees or certifications. Equity We offer full-time employees equity based on performance so we can all share in the success and growth of the company. View Current Job Openings"
