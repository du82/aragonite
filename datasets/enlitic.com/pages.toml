["https://enlitic.com/press/enlitic-acquires-laitek"]
title = "Enlitic Acquires LAITEK | Enlitic News"
description = "Enlitic acquires LAITEK, merging AI-powered data standardization with medical data migration expertise."
full_description = "Overcoming Data Incompatibilities in Healthcare Mergers: Best Practices for PACS and VNA Systems January 24, 2025 · Enlitic’s acquisition of LAITEK advances Enlitic’s strategic roadmap and represents an inflection point for the Company · Enlitic has raised AU$22.5M via an Equity Raising with funds applied to the purchase and ongoing operations · Synergistic benefits have been identified for both Enlitic and LAITEK, particularly in relation to competitive positioning Fort Collins, CO – Enlitic, Inc. (ASX:ENL, the “Company”), a leader in healthcare data standardization, announced today it has acquired LAITEK Inc., a global leader in medical imaging solutions with over 40 years of experience. This strategic move bolsters Enlitic’s market position and expands its data management capabilities. The acquisition merges Enlitic’s AI-powered data standardization with LAITEK’s expertise in medical imaging data migration. This powerful combination will transform how healthcare organizations manage and utilize patient imaging data. Michael Sistenich, Enlitic’s CEO, expressed enthusiasm: “LAITEK’s integration aligns perfectly with our mission to enhance clinical workflows and efficiencies. Their innovative migration approach will significantly boost our capabilities and drive customer satisfaction. This milestone marks a significant point in Enlitic’s journey of strategic growth.” Fred M. Behlen, LAITEK’s President, added: “Joining Enlitic creates an exciting opportunity to deliver unparalleled value to healthcare providers, addressing data fragmentation and interoperability challenges.” This acquisition enables Enlitic to deliver greater product value by enhancing both new and archived data. Enlitic benefits from greater technological resources and immediate access to decades of archived data, accelerating the value of Enlitic’s technology’s use cases. LAITEK can now offer improved data quality in its migration services, ensuring accuracy, completeness, and standardized study and series descriptions."
