["https://enn.com/articles/51385-handwashing--cool-water-as-effective-as-hot-for-removing-germs"]
title = "Environmental News Network - Handwashing: Cool Water as Effective as Hot for Removing Germs"
description = "We all know that washing our hands can keep us from spreading germs and getting sick. But a new Rutgers-New Brunswick study found that cool water removes the same amount of harmful bacteria as hot.“People need to feel comfortable when they are washing their hands but as far as effectiveness, this study shows us that the temperature of the water used didn’t matter,” said Donald Schaffner, distinguished professor and extension specialist in food science."
full_description = "Handwashing: Cool Water as Effective as Hot for Removing Germs Details 30 May 2017 Previous Article NOAA's newest geostationary satellite will be positioned as GOES-East this fall Next Article Nation's Beekeepers Lost 33 Percent of Bees in 2016-17 Typography Font Size Default Reading Mode Share This We all know that washing our hands can keep us from spreading germs and getting sick. But a new Rutgers-New Brunswick study found that cool water removes the same amount of harmful bacteria as hot.“People need to feel comfortable when they are washing their hands but as far as effectiveness, this study shows us that the temperature of the water used didn’t matter,” said Donald Schaffner, distinguished professor and extension specialist in food science. We all know that washing our hands can keep us from spreading germs and getting sick. But a new Rutgers-New Brunswick study found that cool water removes the same amount of harmful bacteria as hot.“People need to feel comfortable when they are washing their hands but as far as effectiveness, this study shows us that the temperature of the water used didn’t matter,” said Donald Schaffner, distinguished professor and extension specialist in food science.In the Rutgers study, published in the June issue of the Journal of Food Protection, high levels of a harmless bacteria were put on the hands of 21 participants multiple times over a six-month period before they were asked to wash their hands in 60-degree, 79-degree or 100-degree water temperatures using 0.5 ml, 1 ml or 2 ml volumes of soap. “This study may have significant implications towards water energy, since using cold water saves more energy than warm or hot water,” said Schaffner. “Also we learned even washing for 10 seconds significantly removed bacteria from the hands.”Continue reading at Rutgers University.Image via Rutgers University. ENN Original News Health Top Stories Sustainability Previous Article NOAA's newest geostationary satellite will be positioned as GOES-East this fall Next Article Nation's Beekeepers Lost 33 Percent of Bees in 2016-17"
