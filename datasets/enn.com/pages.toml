full_description = "The threat of flash flooding on the Chilcotin River in British Columbia has subsided following a large landslide on July 30, 2024, that dammed the river. The CAIRT satellite mission is becoming increasingly likely. The European Space Agency (ESA) has now selected the concept, that was coordinated by Karlsruhe Institute of Technology (KIT), as one of two remaining candidates for an Earth observation mission. NOAA/NASA's Suomi NPP satellite captured these series of images (made into an animated GIF) showing the winds changing direction on Sep. 06, 2020 when choking clouds of brown smoke began to billow and cascade into the Pacific Ocean. The fate of emperor penguins is largely tied to sea ice, making them particulary vulnerable to warming. Faced with a lawsuit by 15 states, the U.S. Environmental Protection Agency announced this week it would no longer delay the implementation of a rule requiring states to reduce emissions of smog-creating air pollution. Crafted by the Obama administration in 2015, the regulation calls for states to begin meeting stricter ozone standards as of October 1, 2017, lowering the air pollution limit from 0.075 parts per million to 0.070 ppm. Ground-level ozone, or smog, is created when pollutants from cars, power plants, and other common industrial activities react with sunlight. It can cause respiratory and other health problems. In June, U.S. EPA head Scott Pruitt announced the agency would delay implementation of the new standards by one year. Fluctuations in sea surface temperature are a factor in causing persistent droughts in North America and around the Mediterranean, new research suggests. There are so many Antarctic krill in the Southern Ocean that the combined mass of these tiny aquatic organisms is more than that of the world’s 7.5 billion human inhabitants. Scientists have long known about this important zooplankton species, but they haven’t been certain why particular regions or “hotspots” in the Southern Ocean are so productive."
