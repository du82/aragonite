full_description = "Student Refines 100-Year-Old Math Problem, Expanding Wind Energy Possibilities Details Penn State 28 February 2025 Previous Article Influencer Marketing Can Help Tourism Industry Mitigate Waste, Pollution Next Article Are Our Refrigerants Safe? The Lingering Questions About the Chemicals Keeping Us Cool Typography Font Size Default Reading Mode Share This A Penn State engineering student refined a century-old math problem into a simpler, more elegant form, making it easier to use and explore. A Penn State engineering student refined a century-old math problem into a simpler, more elegant form, making it easier to use and explore. Divya Tyagi’s work expands research in aerodynamics, unlocking new possibilities in wind turbine design that Hermann Glauert, a British aerodynamicist and the original author, did not consider. Tyagi, a graduate student pursuing her master’s degree in aerospace engineering, completed this work as a Penn State undergraduate for her Schreyer Honors College thesis. Her research was published in Wind Energy Science. “I created an addendum to Glauert’s problem which determines the optimal aerodynamic performance of a wind turbine by solving for the ideal flow conditions for a turbine in order to maximize its power output,” said Tyagi, who earned her bachelor’s degree in aerospace engineering. Read more at Penn State Image: Divya Tyagi, right, a Penn State engineering graduate student, shows her work on a century-old math problem to Sven Schmitz, a College of Engineering faculty member and Tyagi's adviser. (Credit: Kevin Sliman/Penn State) Sci/Tech Energy Top Stories Previous Article Influencer Marketing Can Help Tourism Industry Mitigate Waste, Pollution Next Article Are Our Refrigerants Safe? The Lingering Questions About the Chemicals Keeping Us Cool"
