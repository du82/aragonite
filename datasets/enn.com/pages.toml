["https://enn.com/about-enn/2-uncategorised/56008-rising-sea-levels-may-build-rather-than-destroy-coral-reef-islands"]
title = "Environmental News Network - Rising Sea Levels May Build, Rather Than Destroy, Coral Reef Islands"
description = "Rising global sea levels may actually be beneficial to the long-term future of coral reef islands, such as the Maldives, according to new research published in Geophysical Research Letters."
full_description = "Rising Sea Levels May Build, Rather Than Destroy, Coral Reef Islands Previous Article About ENN Next Article Climate Change Damaging Male Fertility Typography Font Size Default Reading Mode Share This Rising global sea levels may actually be beneficial to the long-term future of coral reef islands, such as the Maldives, according to new research published in Geophysical Research Letters. Low-lying coral reef islands are typically less than three metres above sea level, making them highly vulnerable to rising sea levels associated with climate change. However, research has found new evidence that the Maldives – the world’s lowest country – formed when sea levels were higher than they are today. The evidence was discovered by researchers who studied the formation of five islands in the southern Maldives. Using a coring technique, they were able to reconstruct how and when the islands formed. They found that large waves caused by distant storms off the coast of South Africa led to the formation of the islands approximately three to four thousand years ago. These large waves – known as high-energy wave events – broke coral rubble off the reef and transported it onto reef platforms creating the foundations for the reef islands. Continue reading at University of Northumbria Image via University of Northumbria Top Stories Climate Ecosystems Previous Article About ENN Next Article Climate Change Damaging Male Fertility"
year_published = 2025
