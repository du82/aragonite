 submerged sandbanks and troughs determines which areas they prefer to travel through, at what time of day, and in what sea conditions. Ultimately, this work will help federal, state, and local officials develop science-based management strategies to minimize potential interactions between humans and sharks. This innovative study was initially developed by the CCS Geology Department in collaboration with State shark biologist, Dr. Greg Skomal. Local businesses and community members also threw their support behind the project, hosting fundraising events and providing opportunities for Legare to engage with the public at venues in Provincetown. A contract with the Massachusetts Division of Marine Fisheries (MA DMF) allowed Legare to expand the project into the nearshore waters off Nauset Beach in 2020. The recently announced three-year, $386,000 award from the National Park Service will increase the number of Cape Cod National Seashore beaches included in the study to five, and extend the work through 2024. The Shark Ecology Research Program will also receive an additional $75,000 from the State of Massachusetts via the DMF. “This program developed directly out of questions the local community has over the re-emergence of the white shark population along the nearshore waters of Cape Cod” said Legare. “As we share space with sharks, seals, and other wildlife, the best course of action is to understand their role in the ecosystem through interdisciplinary science; to understand how these organisms use resources, move among to grow and survive in the habitats we share.” Contact: Bryan Legare, Center for Coastal Studies Manager, Shark Ecology Research Program This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak66936a07853e8211d3c15dcf0a90f811').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy66936a07853e8211d3c15dcf0a90f811 = 'bl&#101;g&#97;r&#101;'