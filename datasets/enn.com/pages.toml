title = "Environmental News Network - Microplastics in Ocean Linked to Disabilities for Coastal Residents"
description = "A global perspective on environmental issues.  Our mission is to inform, educate, enable and create a platform for global environmental action."
full_description = "Microplastics in Ocean Linked to Disabilities for Coastal Residents Details American Academy of Neurology 27 February 2025 Previous Article Select Corn Lines Contain Compounds That Sicken, Kill Major Crop Pest Next Article Beyond the Burn: Harvesting Dead Wood to Reduce Wildfires Typography Font Size Default Reading Mode Share This Mobility, self-care, independent living disability higher in areas with high microplastics. Mobility, self-care, independent living disability higher in areas with high microplastics. Tiny bits of plastic found in the ocean may be tied to a higher risk of disability for people who live in coastal areas with high levels, according to a preliminary study released today, February 25, 2025, that will be presented at the American Academy of Neurology's 77th Annual Meeting taking place April 5–9, 2025, in San Diego and online. The study looked at disabilities affecting memory and thinking, mobility and a person’s ability to take care of oneself. The study does not prove that microplastics cause disabilities; it only shows an association. Marine microplastics are microscopic pieces of plastic, less than 5 millimeters in length, found in oceans and seas. They come from broken-down plastic trash or products like face scrubs, fishing nets and food wrappers or take-out containers. Read more at American Academy of Neurology Photo Credit: Oregon State University via Wikimedia Commons Health Sci/Tech Pollution Top Stories Previous Article Select Corn Lines Contain Compounds That Sicken, Kill Major Crop Pest Next Article Beyond the Burn: Harvesting Dead Wood to Reduce Wildfires"
