["https://enn.com/articles/53613-el-cambio-clim%C3%A1tico-impulsa-el-colapso-en-las-redes-de-alimentos-marinos"]
title = "Environmental News Network - El cambio climático impulsa el colapso en las redes de alimentos marinos"
description = 'Un nuevo estudio descubrió que los niveles de las poblaciones de peces comerciales podrían verse perjudicados a medida que el aumento de la temperatura del mar afecta su fuente de alimentos. Científicos de la Universidad de Adelaida han demostrado cómo el cambio climático puede conducir al colapso de las "redes alimenticias" marinas.'
full_description = 'El cambio climático impulsa el colapso en las redes de alimentos marinos Details 10 January 2018 Previous Article University of Windsor researcher champions collaborative freshwater research project Next Article How Bioluminescent Deep Sea Creatures Are Helping Us in the Fight Against Cancer Typography Font Size Default Reading Mode Share This Un nuevo estudio descubrió que los niveles de las poblaciones de peces comerciales podrían verse perjudicados a medida que el aumento de la temperatura del mar afecta su fuente de alimentos. Científicos de la Universidad de Adelaida han demostrado cómo el cambio climático puede conducir al colapso de las "redes alimenticias" marinas. Un nuevo estudio descubrió que los niveles de las poblaciones de peces comerciales podrían verse perjudicados a medida que el aumento de la temperatura del mar afecta su fuente de alimentos.Científicos de la Universidad de Adelaida han demostrado cómo el cambio climático puede conducir al colapso de las "redes alimenticias" marinas.Publicado en la revista PLOS Biology, el autor principal del estudio, Hadayet Ullah y los supervisores, el profesor Ivan Nagelkerken y el profesor asociado Damien Fordham del Instituto de Medio Ambiente de la Universidad, muestran que el aumento de las temperaturas reduce el flujo vital de energía de los productores de alimentos primarios en la base (por ejemplo, las algas), a los consumidores intermedios (herbívoros), a los depredadores en la parte superior de las redes alimentarias marinas.Esas perturbaciones en la transferencia de energía pueden conducir a una disminución en la disponibilidad de alimentos para los principales depredadores, lo que a su vez puede generar impactos negativos para muchas especies marinas dentro de estas redes tróficas.La reducción del flujo de energía significa que se reduce la cantidad de alimentos disponibles para los depredadores, como los peces, en la parte superior de las redes tróficas, con posibles consecuencias para las especies pesqueras.Continúe leyendo en University of AdelaideCrédito de la imagen: Lance Anderson, Unsplash Spanish Previous Article University of Windsor researcher champions collaborative freshwater research project Next Article How Bioluminescent Deep Sea Creatures Are Helping Us in the Fight Against Cancer'
