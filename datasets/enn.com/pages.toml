full_description = "Ambitious government plans for the expansion of solar farms could be achieved without sacrificing farmland, according to new research on a technology that could meet the UK’s electricity needs four times over. Recent advances in astronomical observations have found a significant number of extrasolar planets that can sustain surface water, and the search for extraterrestrial life on such planets is gaining momentum. Although preventing all the consequences of climate change is now impossible, we can adopt policies to mitigate its impact. Social media influencers who are passionate about environmental causes can help the tourism industry inspire tourists to engage in pro-environmental behavior to help mitigate waste and pollution, according to a new study from researchers in the Penn State School of Hospitality Management. A Penn State engineering student refined a century-old math problem into a simpler, more elegant form, making it easier to use and explore. The latest chemicals used in refrigerants and aerosols can break down into pollutants, UNSW scientists say. A century of fire suppression, combined with global warming and drought, has led to increasingly destructive wildfires in the Western United States."
