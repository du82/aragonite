["https://enn.com/articles/53714-limitados-por-la-naturaleza--la-evoluci%C3%B3n-cultural-no-liber%C3%B3-a-los-cazadores-recolectores-de-las-presiones-ambientales-"]
title = "Environmental News Network - Limitados por la naturaleza: La evolución cultural no liberó a los cazadores-recolectores de las presiones ambientales"
description = "La evolución cultural ha hecho que los humanos sean ingenieros de ecosistemas enormemente poderosos y nos ha permitido sobrevivir y prosperar bajo una gran variedad de condiciones ambientales. Incluso los cazadores-recolectores, que obtienen su alimento de plantas silvestres y recursos animales usando tecnologías aparentemente simples, han sido capaces de extraer energía en las duras condiciones árticas y desérticas y compilar un amplio conocimiento sobre plantas medicinales para luchar contra los patógenos en los trópicos."
full_description = "Limitados por la naturaleza: La evolución cultural no liberó a los cazadores-recolectores de las presiones ambientales Details 19 January 2018 Previous Article Mejores Prácticas en un Sistema de Gestión integrado QEHS (Calidad, Ambiente, Seguridad e Higiene) Next Article Methane from Indian Livestock Adds to Global Warming Typography Font Size Default Reading Mode Share This La evolución cultural ha hecho que los humanos sean ingenieros de ecosistemas enormemente poderosos y nos ha permitido sobrevivir y prosperar bajo una gran variedad de condiciones ambientales. Incluso los cazadores-recolectores, que obtienen su alimento de plantas silvestres y recursos animales usando tecnologías aparentemente simples, han sido capaces de extraer energía en las duras condiciones árticas y desérticas y compilar un amplio conocimiento sobre plantas medicinales para luchar contra los patógenos en los trópicos. La evolución cultural ha hecho que los humanos sean ingenieros de ecosistemas enormemente poderosos y nos ha permitido sobrevivir y prosperar bajo una gran variedad de condiciones ambientales.Incluso los cazadores-recolectores, que obtienen su alimento de plantas silvestres y recursos animales usando tecnologías aparentemente simples, han sido capaces de extraer energía en las duras condiciones árticas y desérticas y compilar un amplio conocimiento sobre plantas medicinales para luchar contra los patógenos en los trópicos. Debido a la cultura, a los humanos se les considera divorciados del medio ambiente y no bajo las mismas presiones ecológicas que otras especies.La densidad de población de cazadores-recolectores está limitada por las condiciones ambientalesSin embargo, en un nuevo artículo publicado en Proceedings of the National of Sciences USA (PNAS) científicos de la Facultad de Ciencias de la Universidad de Helsinki muestran que los parámetros ambientales clave, es decir, la productividad primaria relacionada con el clima, la biodiversidad y el estrés patógeno tienen una gran influencia en el patrón global de densidades de población de cazadores-recolectores documentados etnográficamenteEn la imagen las flechas azules, rojas y grises indican un efecto positivo, negativo y estadísticamente insignificante de una variable. El grosor de una flecha indica la fuerza del efecto de una variable. La productividad primaria neta también tiene efectos indirectos sobre la densidad de población mediada por la biodiversidad y los patógenos. Continúe leyendo en University of HelsinkiCrédito de la imagen: Miska Luoto Spanish Previous Article Mejores Prácticas en un Sistema de Gestión integrado QEHS (Calidad, Ambiente, Seguridad e Higiene) Next Article Methane from Indian Livestock Adds to Global Warming"
