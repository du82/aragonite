["https://enn.com/articles/53695-el-gas-shale-es-una-de-las-formas-menos-sostenibles-de-producir-electricidad"]
title = "Environmental News Network - El gas Shale es una de las formas menos sostenibles de producir electricidad"
description = "A global perspective on environmental issues.  Our mission is to inform, educate, enable and create a platform for global environmental action."
full_description = "El gas Shale es una de las formas menos sostenibles de producir electricidad Details 18 January 2018 Previous Article Fruit fly breakthrough may help human blindness research Next Article Researchers Explore Psychological Effects of Climate Change Typography Font Size Default Reading Mode Share This El gas Shale es una de las formas menos sostenibles de producir electricidad, según una nueva investigación de la Universidad de Manchester. El gas Shale es una de las formas menos sostenibles de producir electricidad, según una nueva investigación de la Universidad de Manchester.El estudio principal, que es el primero de su tipo, consideró la sostenibilidad ambiental, económica y social del gas de esquisto bituminoso en el Reino Unido y lo comparó con otras opciones de generación de electricidad. Estos fueron carbón, nuclear, gas natural, gas natural licuado (GNL), energía solar fotovoltaica (PV), eólica, hidroeléctrica y biomasa.Teniendo en cuenta una serie de aspectos de sostenibilidad y asumiendo que todos son igualmente importantes, la investigación encontró que el gas de esquisto en general ocupa el séptimo lugar entre las nueve opciones de electricidad. El estudio también encontró que:El gas de esquisto se clasifica entre el cuarto y el octavo en relación con otras opciones de electricidadPara convertirse en la opción más sostenible, se necesitarían grandes mejorasEsto incluye una reducción de 329 veces en los impactos ambientales y un aumento de 16 veces en el empleoUna mezcla de electricidad con menos gas de esquisto es más sostenibleContinúe leyendo en University of Manchester.Imagen vía University of Manchester. Spanish Previous Article Fruit fly breakthrough may help human blindness research Next Article Researchers Explore Psychological Effects of Climate Change"
year_published = 2018
