full_description = "Sea temperature changes contributing to droughts Details 19 July 2017 Previous Article Developing new technology for cheaper biofuel Next Article Non-toxic alternative for next-generation solar cells Typography Font Size Default Reading Mode Share This Fluctuations in sea surface temperature are a factor in causing persistent droughts in North America and around the Mediterranean, new research suggests. Fluctuations in sea surface temperature are a factor in causing persistent droughts in North America and around the Mediterranean, new research suggests. A team from the universities of Exeter, Montpellier and Wageningen analysed data from 1957–2002 and found sea surface temperatures in the North Pacific and North Atlantic became increasingly variable, and extremes lasted for longer.Ocean temperatures are a major driver of conditions on land, and the researchers showed that the changes they observed correlated with increases in land temperature variability, and persistence of extreme temperatures.This in turn was associated with persistent droughts in North America and on land around the Mediterranean.“Our evidence shows that larger and more persistent variations in sea surface temperature have occurred in the North Atlantic and North Pacific and these contributed to more extreme and persistent temperature anomalies on parts of the world’s land surface,” said Professor Tim Lenton, of the University of Exeter.Continue reading at the University of Exeter.Image via Unitersity of Exeter. Ecosystems Climate Top Stories ENN Original News Previous Article Developing new technology for cheaper biofuel Next Article Non-toxic alternative for next-generation solar cells"
