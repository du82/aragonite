["https://enn.com/articles/71558-how-floating-wetlands-are-helping-to-clean-up-urban-waters"]
title = "Environmental News Network - How Floating Wetlands Are Helping to Clean Up Urban Waters"
description = "Five small islands roughly the size of backyard swimming pools float next to the concrete riverbank of Bubbly Creek, a stretch of the Chicago River named for the gas that once rose to the surface after stockyards dumped animal waste and byproducts into the waterway."
full_description = "How Floating Wetlands Are Helping to Clean Up Urban Waters Details Yale Environment 360 22 November 2022 Previous Article Sweet Corn Sweltering in Summer Heat Spells Uncertainty for Corn Lovers Next Article Building Green Energy Facilities May Produce Substantial Carbon Emissions, Says Study Typography Font Size Default Reading Mode Share This Five small islands roughly the size of backyard swimming pools float next to the concrete riverbank of Bubbly Creek, a stretch of the Chicago River named for the gas that once rose to the surface after stockyards dumped animal waste and byproducts into the waterway. Five small islands roughly the size of backyard swimming pools float next to the concrete riverbank of Bubbly Creek, a stretch of the Chicago River named for the gas that once rose to the surface after stockyards dumped animal waste and byproducts into the waterway. Clumps of short, native grasses and plants, including sedges, swamp milkweed, and queen of the prairie, rise from a gravel-like material spread across each artificial island’s surface. A few rectangles cut from their middles hold bottomless baskets, structures that will, project designers hope, provide an attachment surface for freshwater mussels that once flourished in the river. Three thousand square feet in total, these artificial wetlands are part of an effort to clean up a portion of a river that has long served the interests of industry. This floating wetland project is one of many proliferating around the world as cities increasingly look to green infrastructure to address toxic legacies. In the United States, researchers are conducting experiments in Boston and Baltimore as well as in Chicago, each team sharing best practices with the other to maximize the ecological benefits of their systems. The Canadian government and local municipalities are allotting more funding for innovative projects. Floating wetlands are also multiplying in the United Kingdom, and studies to quantify additional benefits continue in Australia and Brazil. Like natural wetlands, floating versions provide a range of ecosystem services. They filter sediment and contaminants from stormwater, and laboratory experiments show that some plants have the ability to lock up some chemicals and metals found in acid mine drainage. These systems take up excess agricultural nutrients that can lead to algal blooms and dead zones, and recent research suggests they could be used to reduce manmade contaminants that persist in the environment. Though it’s difficult to quantify the exact benefits these systems offer, and they have limitations as a tool in remediating polluted waterways, they could provide another option, researchers say. Read more at Yale Environment 360 Image: Floating wetlands along the Chicago River's Wild Mile. (Credit: DAVE BURK / SOM) Sci/Tech Top Stories Ecosystems Green Building Previous Article Sweet Corn Sweltering in Summer Heat Spells Uncertainty for Corn Lovers Next Article Building Green Energy Facilities May Produce Substantial Carbon Emissions, Says Study"
author = "Yale Environment 360"
year_published = 2022
