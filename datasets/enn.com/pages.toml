["https://enn.com/articles/53685-anomal%C3%ADas-clim%C3%A1ticas-aceleran-el-derretimiento-del-hielo-marino"]
title = "Environmental News Network - Anomalías climáticas aceleran el derretimiento del hielo marino"
description = "En el invierno de 2015/16, sucedió algo que nunca se había visto en esta escala: a finales de diciembre, las temperaturas se elevaron por encima de cero grados centígrados durante varios días en algunas partes del Ártico. Se registraron temperaturas de hasta ocho grados al norte de Svalbard."
full_description = '''Anomalías climáticas aceleran el derretimiento del hielo marino Details 17 January 2018 Previous Article With China's Ban on Waste Imports, Europe Announces New Recycling Initiatives Next Article Scientists on the road to discovering impact of urban road dust Typography Font Size Default Reading Mode Share This En el invierno de 2015/16, sucedió algo que nunca se había visto en esta escala: a finales de diciembre, las temperaturas se elevaron por encima de cero grados centígrados durante varios días en algunas partes del Ártico. Se registraron temperaturas de hasta ocho grados al norte de Svalbard. En el invierno de 2015/16, sucedió algo que nunca se había visto en esta escala: a finales de diciembre, las temperaturas se elevaron por encima de cero grados centígrados durante varios días en algunas partes del Ártico. Se registraron temperaturas de hasta ocho grados al norte de Svalbard. Las temperaturas tan altas no se registraron en la mitad del año invernal desde el comienzo de las mediciones sistemáticas a fines de los años setenta. Como resultado de esta calidez inusual, el hielo marino comenzó a derretirse."Escuchamos sobre esto por los medios", dice Heini Wernli, profesor de Dinámica Atmosférica en ETH Zurich. Las noticias despertaron su curiosidad científica y un equipo dirigido por su entonces estudiante de doctorado Hanin Binder investigó el tema. En noviembre de 2017 publicaron su análisis de este evento excepcional en la revista Geophysical Research Letters.En él, los investigadores muestran cómo surgieron estas temperaturas inusuales: tres corrientes de aire diferentes se encontraron sobre el Mar del Norte entre Escocia y el sur de Noruega, llevando el aire cálido hacia el norte a gran velocidad como en una "autopista".Esta “carretera” de corrientes de aire fue posible gracias a una constelación particular de sistemas de presión sobre el norte de Europa. Durante el período en cuestión, se desarrollaron sistemas intensos de baja presión sobre Islandia, mientras que un área de alta presión extremadamente estable se formó sobre Escandinavia. Esto creó una especie de embudo sobre el Mar del Norte, entre Escocia y el sur de Noruega, que canalizó las diversas corrientes de aire y las condujo hacia el norte hasta el Ártico.Continúe leyendo en ETH ZurichImagen vía Sandro Bösch, ETH Zurich Spanish Previous Article With China's Ban on Waste Imports, Europe Announces New Recycling Initiatives Next Article Scientists on the road to discovering impact of urban road dust'''
year_published = 2018
