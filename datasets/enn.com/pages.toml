["https://enn.com/articles/76078-from-waste-to-wonder-revolutionary-green-grout-for-sustainable-construction-practices"]
title = "Environmental News Network - From Waste to Wonder: Revolutionary Green Grout for Sustainable Construction Practices"
description = "A global perspective on environmental issues.  Our mission is to inform, educate, enable and create a platform for global environmental action."
full_description = "From Waste to Wonder: Revolutionary Green Grout for Sustainable Construction Practices Details Shibaura Institute of Technology 26 February 2025 Previous Article Today’s Forecast: Partially Cloudy Skies on an “Ultra-Hot Neptune” Next Article Research Reveals Potential Alternatives to ‘Forever Chemicals’ Typography Font Size Default Reading Mode Share This Scientists develop a novel soil-reenforcing material by recycling waste fluids from geothermal energy harvesting plants. Scientists develop a novel soil-reenforcing material by recycling waste fluids from geothermal energy harvesting plants. Grouting is a widely used construction technique that involves injecting stabilizing materials into soil to ensure structural stability, which is especially beneficial in earthquake-prone regions. Now, scientists from Japan have developed an innovative, carbon-neutral grout made from waste fluids of geothermal energy harvesting systems. Their new material shows a 50% increase in liquefaction resistance compared to conventional grouts, while also addressing environmental concerns associated with the construction industry. In modern construction projects, ground improvement through grouting is commonly used to ensure structural stability and safety. This technique, which involves injecting stabilizing materials into the soil, is essential for buildings in earthquake-prone regions and areas with adverse ground conditions. From securing foundations and preventing soil erosion to strengthening underground structures, grouting plays a vital role in creating a resilient infrastructure capable of withstanding environmental stresses and geological challenges. Read more at Shibaura Institute of Technology Image: This schematic diagram illustrates the typical components of a chemical grouting system, where gel-forming chemicals are applied to the soil to prevent erosion and liquefaction that could threaten the structural integrity. Researchers developed a new type of grout made from a byproduct of geothermal energy harvesting, minimizing carbon emissions linked to grouting. (Credit: Shinya Inazumi from Shibaura Institute of Technology, Japan) Sci/Tech Climate Green Building Top Stories Previous Article Today’s Forecast: Partially Cloudy Skies on an “Ultra-Hot Neptune” Next Article Research Reveals Potential Alternatives to ‘Forever Chemicals’"
