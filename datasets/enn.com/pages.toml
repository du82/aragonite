["https://enn.com/articles/52081-u.s.-epa-releasing-smog-rule"]
title = "Environmental News Network - U.S. EPA Releasing Smog Rule"
description = "Faced with a lawsuit by 15 states, the U.S. Environmental Protection Agency announced this week it would no longer delay the implementation of a rule requiring states to reduce emissions of smog-creating air pollution. Crafted by the Obama administration in 2015, the regulation calls for states to begin meeting stricter ozone standards as of October 1, 2017, lowering the air pollution limit from 0.075 parts per million to 0.070 ppm.  Ground-level ozone, or smog, is created when pollutants from cars, power plants, and other common industrial activities react with sunlight.  It can cause respiratory and other health problems.  In June, U.S. EPA head Scott Pruitt announced the agency would delay implementation of the new standards by one year."
full_description = "U.S. EPA Releasing Smog Rule Details 04 August 2017 Previous Article Benefits of Advanced Wood-Burning Stoves Greater Than Thought Next Article Vertical Axis Wind Turbines Can Offer Cheaper Electricity for Urban and Suburban Areas Typography Font Size Default Reading Mode Share This Faced with a lawsuit by 15 states, the U.S. Environmental Protection Agency announced this week it would no longer delay the implementation of a rule requiring states to reduce emissions of smog-creating air pollution. Crafted by the Obama administration in 2015, the regulation calls for states to begin meeting stricter ozone standards as of October 1, 2017, lowering the air pollution limit from 0.075 parts per million to 0.070 ppm. Ground-level ozone, or smog, is created when pollutants from cars, power plants, and other common industrial activities react with sunlight. It can cause respiratory and other health problems. In June, U.S. EPA head Scott Pruitt announced the agency would delay implementation of the new standards by one year. Faced with a lawsuit by 15 states, the U.S. Environmental Protection Agency announced this week it would no longer delay the implementation of a rule requiring states to reduce emissions of smog-creating air pollution. Crafted by the Obama administration in 2015, the regulation calls for states to begin meeting stricter ozone standards as of October 1, 2017, lowering the air pollution limit from 0.075 parts per million to 0.070 ppm. Ground-level ozone, or smog, is created when pollutants from cars, power plants, and other common industrial activities react with sunlight. It can cause respiratory and other health problems. In June, U.S. EPA head Scott Pruitt announced the agency would delay implementation of the new standards by one year.Earlier this week, however, 15 states sued the EPA for its decision to delay the rule. “By blocking these clean air protections, Administrator Pruitt is endangering the health and safety of millions,” New York Attorney General Eric Schneiderman, who led the lawsuit, said in a statement. “But Attorneys General have made clear: we won’t hesitate to fight back to protect our residents and our states.”New York was joined in the suit by 14 other Democratic states, including California, Massachusetts, New Mexico, and Pennsylvania.Continue reading at Yale Environment 360 Pollution Climate Top Stories ENN Original News Previous Article Benefits of Advanced Wood-Burning Stoves Greater Than Thought Next Article Vertical Axis Wind Turbines Can Offer Cheaper Electricity for Urban and Suburban Areas"
