["https://enn.com/articles/74187-ubco-researchers-look-to-the-past-to-improve-construction-sustainability"]
title = "Environmental News Network - UBCO Researchers Look to the Past to Improve Construction Sustainability"
description = "Researchers at UBC Okanagan are revisiting old building practices—the use of by-products and cast-offs—as a way to improve building materials and sustainability of the trade."
full_description = "UBCO Researchers Look to the Past to Improve Construction Sustainability Details University of British Columbia Okanagan Campus 28 February 2024 Previous Article Study Finds Drought Fuels Invasive Species After Wildfires Next Article New Study Is First Step in Predicting Carbon Emissions in Agriculture Typography Font Size Default Reading Mode Share This Researchers at UBC Okanagan are revisiting old building practices—the use of by-products and cast-offs—as a way to improve building materials and sustainability of the trade. Researchers at UBC Okanagan are revisiting old building practices—the use of by-products and cast-offs—as a way to improve building materials and sustainability of the trade. A technique known as rammed earth construction uses materials that are alternatives to cement and are often more readily available in the environment. One such alternative is wood fly ash, a by-product of pulp mills and coal-fired power plants, explains Dr. Sumi Siddiqua, with UBC Okanagan’s School of Engineering. Industry has been trying to find a use for materials like fly ash that predominantly end up in landfills, she explains. Better described as a fine powder, fly ash shares the same strength and texture characteristics as cement, which is often added to concrete to enhance its strength. “There are many benefits to using this material,” explains Dr. Siddiqua, Civil Engineering Professor and lead researcher with UBC’s Advanced Geomaterials Testing Lab. “Using local soil along with rammed earth products reduces sand exploitation. And just as importantly, this material is not affected by wildfires to the same extent as current wooden structures.” Read more at University of British Columbia Okanagan Campus Sci/Tech Green Building Previous Article Study Finds Drought Fuels Invasive Species After Wildfires Next Article New Study Is First Step in Predicting Carbon Emissions in Agriculture"
