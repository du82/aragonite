title = "Environmental News Network - Winds of Change Move Western Smoke Into the Pacific"
description = "NOAA/NASA's Suomi NPP satellite captured these series of images (made into an animated GIF) showing the winds changing direction on Sep. 06, 2020 when choking clouds of brown smoke began to billow and cascade into the Pacific Ocean."
full_description = '''Winds of Change Move Western Smoke Into the Pacific Details NASA Goddard Space Flight Center 11 September 2020 Previous Article California Heatwave Fits a Trend Next Article NASA Satellite Finds an Elongated Tropical Storm Rene Caused by Wind Shear Typography Font Size Default Reading Mode Share This NOAA/NASA's Suomi NPP satellite captured these series of images (made into an animated GIF) showing the winds changing direction on Sep. 06, 2020 when choking clouds of brown smoke began to billow and cascade into the Pacific Ocean. By Sep. 10, the smoke cloud had traveled over 1,300 miles. The square miles of smoke in the image below totals 963,269. That estimate has been computed using the measurement tool within the NASA Worldview application. A stunning 3.1 million acres have burned this year in California alone (per CAL fire), which is up from a total of 2.5 million acres as of Wednesday, Sep. 09, 2020. In addition, 805,314 acres have been lost in Oregon (State of Oregon Fires and Hotspots Dashboard, as of 9:30am EDT Sep. 11) and 500,000 acres (Northwest Interagency Coordination Center) in Washington state. Winds blowing through the west have been stoking fires and helping spread them quickly as evidenced in the growth of over a half million acres in less than two days. There have been 12 wildfire-related fatalities this year. Records have been shattered during this fire season and experts continue to blame drought, excessive heat and strong winds for this tragedy. Because the climate continues to change, scientists also believe that these types of fire events will not only continue but will worsen. Predictive meterologist for the National Interagency Fire Center, Nick Nausler, tweeted: "Multiple fires made 20-plus mile runs in 24 hours over the last few days in California, Oregon and Washington. Such distances traveled so quickly may not be all that rare in grassland fires. However, most of these fires are making massive runs in timber and burning tens of thousands of acres and in some cases 100,000-plus acres in one day. The sheer amount of fire on the landscape is surreal." Continue reading at NASA Goddard Space Flight Center Image via NASA Goddard Space Flight Center Sci/Tech Top Stories ENN Original News Agriculture Previous Article California Heatwave Fits a Trend Next Article NASA Satellite Finds an Elongated Tropical Storm Rene Caused by Wind Shear'''
