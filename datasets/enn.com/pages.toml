["https://enn.com/articles/53729-ingenier%C3%ADa-clim%C3%A1tica--una-vez-iniciada,-tendr%C3%ADa-graves-impactos-si-se-detuviera"]
title = "Environmental News Network - Ingeniería climática: Una vez iniciada, tendría graves impactos si se detuviera"
description = "Enfrentando una crisis climática, algún día podemos rociar dióxido de azufre en la atmósfera superior para formar una nube que enfría la Tierra, pero suspender repentinamente esta fumigación tendría un impacto global severo en animales y plantas, según el primer estudio sobre los impactos biológicos potenciales. de geoingeniería o intervención climática."
full_description = 'Ingeniería climática: Una vez iniciada, tendría graves impactos si se detuviera Details 23 January 2018 Previous Article From the eruption of the Timanfaya volcano in the Canary Islands to the coniferous forests in the Pyrenees Next Article Use of Dirty Heating Oil in NYC Concentrated Uptown Typography Font Size Default Reading Mode Share This Enfrentando una crisis climática, algún día podemos rociar dióxido de azufre en la atmósfera superior para formar una nube que enfría la Tierra, pero suspender repentinamente esta fumigación tendría un impacto global severo en animales y plantas, según el primer estudio sobre los impactos biológicos potenciales. de geoingeniería o intervención climática. Enfrentando una crisis climática, algún día podemos rociar dióxido de azufre en la atmósfera superior para formar una nube que enfría la Tierra, pero suspender repentinamente esta fumigación tendría un impacto global severo en animales y plantas, según el primer estudio sobre los impactos biológicos potenciales. de geoingeniería o intervención climática.El estudio fue publicado en línea en Nature Ecology & Evolution. El documento fue escrito por el Profesor Distinguido Alan Robock de Rutgers, la investigadora asociada Lili Xia y el postdoc Brian Zambri, todos del Departamento de Ciencias Ambientales de la Universidad Rutgers-New Brunswick. Otros coautores fueron de la Universidad de Maryland, la Universidad de Yale y la Universidad Stony Brook."El calentamiento rápido después de detener la geoingeniería sería una gran amenaza para el medio ambiente natural y la biodiversidad", dijo Robock. "Si la geoingeniería alguna vez se detuviera abruptamente, sería devastador, por lo que tendría que estar seguro de que podría detenerse gradualmente, y es fácil pensar en escenarios que evitarían eso. Imagine grandes sequías o inundaciones en todo el mundo a las que se puede atribuir la geoingeniería y exige que se detengan. ¿Podemos arriesgar eso alguna vez?Continúe leyendo en Rutgers University Spanish Previous Article From the eruption of the Timanfaya volcano in the Canary Islands to the coniferous forests in the Pyrenees Next Article Use of Dirty Heating Oil in NYC Concentrated Uptown'
