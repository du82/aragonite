full_description = "Innovative Material for Sustainable Building Details Karlsruher Institut für Technologie (KIT) 28 May 2024 Previous Article Texas A&M-Led Team Creates First Global Map Of Seafloor Biodiversity Activity Next Article Caterpillars Can Detect Their Predators by the Static Electricity They Emit Typography Font Size Default Reading Mode Share This Researchers at KIT develop a transparent metamaterial for energy-efficient light and temperature regulation in buildings. Researchers at KIT develop a transparent metamaterial for energy-efficient light and temperature regulation in buildings. Researchers at the Karlsruhe Institute of Technology (KIT) introduce a polymer-based material with unique properties in the latest issue of the journal Nature Communications. This material allows sunlight to enter, maintains a more comfortable indoor climate without additional energy, and cleans itself like a lotus leaf. The new development could replace glass components in walls and roofs in the future. The research team has successfully tested the material in outdoor tests on the KIT campus. Maximizing natural light in buildings is popular and can save on energy costs. However, traditional glass roofs and walls also present problems such as glare, lack of privacy, and overheating. Alternative solutions, such as coatings and light-diffusing materials, have not yet provided a comprehensive remedy. Read more at Karlsruher Institut für Technologie (KIT) Image: Cooling, light-Transmissive, and glare-Free: the new material combines several unique properties. (Photo: Gan Huang, KIT) Sci/Tech Green Building Energy Top Stories Previous Article Texas A&M-Led Team Creates First Global Map Of Seafloor Biodiversity Activity Next Article Caterpillars Can Detect Their Predators by the Static Electricity They Emit"
