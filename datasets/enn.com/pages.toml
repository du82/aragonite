full_description = '''Upstream and Closed Loop Partners Announce Winners of Inaugural National Reuse Awards (The Reusies) Celebrating Heroes of the Reuse Movement Details Upstream and Closed Loop Partners 27 October 2021 Four heroes of the reuse movement have been announced as winners of the National Reuse Awards (The Reusies). The virtual awards show was presented by Upstream, a non-profit sparking innovative solutions to plastic pollution, in partnership with Closed Loop Partners, a circular economy-focused investment firm and innovation center. Read more ... FOR IMMEDIATE RELEASE: New Shark Ecology Research Program Launched at the Center for Coastal Studies. Details Center for Coastal Studies 14 October 2021 Contact: Bryan Legare, Center for Coastal Studies Manager, Shark Ecology Research Program This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak93c14eb908f5e0ade20294acfdea7f96').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy93c14eb908f5e0ade20294acfdea7f96 = 'bl&#101;g&#97;r&#101;' + '&#64;'; addy93c14eb908f5e0ade20294acfdea7f96 = addy93c14eb908f5e0ade20294acfdea7f96 + 'c&#111;&#97;st&#97;lst&#117;d&#105;&#101;s' + '&#46;' + '&#111;rg'; var addy_text93c14eb908f5e0ade20294acfdea7f96 = 'bl&#101;g&#97;r&#101;' + '&#64;' + 'c&#111;&#97;st&#97;lst&#117;d&#105;&#101;s' + '&#46;' + '&#111;rg';document.getElementById('cloak93c14eb908f5e0ade20294acfdea7f96').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy93c14eb908f5e0ade20294acfdea7f96 + '\'>'+addy_text93c14eb908f5e0ade20294acfdea7f96+'<\/a>'; , 508-487-3623 x 124 Cathrine Macort, Center for Coastal Studies Communications Coordinator This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloakefbd5ca75d1e55b3b635f5c7492007f1').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addyefbd5ca75d1e55b3b635f5c7492007f1 = 'cm&#97;c&#111;rt' + '&#64;'; addyefbd5ca75d1e55b3b635f5c7492007f1 = addyefbd5ca75d1e55b3b635f5c7492007f1 + 'c&#111;&#97;st&#97;lst&#117;d&#105;&#101;s' + '&#46;' + '&#111;rg'; var addy_textefbd5ca75d1e55b3b635f5c7492007f1 = 'cm&#97;c&#111;rt' + '&#64;' + 'c&#111;&#97;st&#97;lst&#117;d&#105;&#101;s' + '&#46;' + '&#111;rg';document.getElementById('cloakefbd5ca75d1e55b3b635f5c7492007f1').innerHTML += '<a ' + path + '\'' + prefix + ':' + addyefbd5ca75d1e55b3b635f5c7492007f1 + '\'>'+addy_textefbd5ca75d1e55b3b635f5c7492007f1+'<\/a>'; , 508-808-9660 Provincetown, MA - The Center for Coastal Studies (CCS) in Provincetown has received major funding from the National Park Service and the State of Massachusetts to establish a new Shark Ecology Research Program. The foundation of the program is an ongoing study conducted by Bryan Legare, a seascape ecologist in the Center’s Marine Geology department. Legare is examining the relationship between white shark behavior and habitat use in the shallow nearshore waters off the Cape Cod National Seashore to understand how sharks use the environment. For the last three summers, Legare has deployed a dense array of acoustic receivers in a study area at Head of the Meadow beach in North Truro; he added a second array off Nauset Beach in 2020. The receivers record the acoustic signal of previously-tagged white sharks as they pass through the area, allowing scientists to generate the tracks of individual white sharks. Those tracks are then compared to detailed, 3-dimensional images of the seabed collected during side-scan sonar surveys of the area by the Center’s Seafloor Mapping Program, as well as data on oceanographic conditions such as speed and direction of currents, tides, wave conditions and turbidity. Analysis of the sharks’ movements relative to the physical environment and the submerged sandbanks and troughs determines which areas they prefer to travel through, at what time of day, and in what sea conditions. Ultimately, this work will help federal, state, and local officials develop science-based management strategies to minimize potential interactions between humans and sharks. This innovative study was initially developed by the CCS Geology Department in collaboration with State shark biologist, Dr. Greg Skomal. Local businesses and community members also threw their support behind the project, hosting fundraising events and providing opportunities for Legare to engage with the public at venues in Provincetown. A contract with the Massachusetts Division of Marine Fisheries (MA DMF) allowed Legare to expand the project into the nearshore waters off Nauset Beach in 2020. The recently announced three-year, $386,000 award from the National Park Service will increase the number of Cape Cod National Seashore beaches included in the study to five, and extend the work through 2024. The Shark Ecology Research Program will also receive an additional $75,000 from the State of Massachusetts via the DMF. “This program developed directly out of questions the local community has over the re-emergence of the white shark population along the nearshore waters of Cape Cod” said Legare. “As we share space with sharks, seals, and other wildlife, the best course of action is to understand their role in the ecosystem through interdisciplinary science; to understand how these organisms use resources, move among to grow and survive in the habitats we share.”'''
author = "Upstream and Closed Loop Partners"
year_published = 2021
