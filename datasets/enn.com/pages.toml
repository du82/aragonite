["https://enn.com/articles/51407-human-activity-has-polluted-european-air-for-2000-years,-study-finds"]
title = "Environmental News Network - Human Activity has Polluted European Air for 2000 Years, Study Finds"
description = "A new study combining European ice core data and historical records of the infamous Black Death pandemic of 1349-1353 shows metal mining and smelting have polluted the environment for thousands of years, challenging the widespread belief that environmental pollution began with the Industrial Revolution in the 1700s and 1800s."
full_description = "Human Activity has Polluted European Air for 2000 Years, Study Finds Details 01 June 2017 Previous Article Professor proposes using artificial intelligence to predict aquatic ecosystem health Next Article Cold conversion of food waste into renewable energy and fertilizer has 'enormous potential' Typography Font Size Default Reading Mode Share This A new study combining European ice core data and historical records of the infamous Black Death pandemic of 1349-1353 shows metal mining and smelting have polluted the environment for thousands of years, challenging the widespread belief that environmental pollution began with the Industrial Revolution in the 1700s and 1800s. A new study combining European ice core data and historical records of the infamous Black Death pandemic of 1349-1353 shows metal mining and smelting have polluted the environment for thousands of years, challenging the widespread belief that environmental pollution began with the Industrial Revolution in the 1700s and 1800s.The new study, accepted for publication in GeoHealth, a journal of the American Geophysical Union, provides evidence that the natural level of lead in the air is essentially zero, contrary to common assumptions. The research shows lead pollution from mining and smelting was detectable well before the Industrial Revolution and only when the Black Death pandemic halted those activities did lead in the air return to natural levels.“These new data show that human activity has polluted European air almost uninterruptedly for the last ca. 2000 years,” the study’s authors write. “Only a devastating collapse in population and economic activity caused by pandemic disease reduced atmospheric pollution to what can now more accurately be termed ‘background’ or natural levels.”The new findings could affect the current standards for lead pollution. Current public health and environmental policy deem pre-industrial lead pollution levels to be “natural” and thus presumably “safe,” but this assumption may need to be re-examined, according to the study’s authors.Continue reading at the American Geophysical Union.Image Credit: Nicole Spaulding, Climate Change Institute, University of Maine. Pollution Health Top Stories ENN Original News Previous Article Professor proposes using artificial intelligence to predict aquatic ecosystem health Next Article Cold conversion of food waste into renewable energy and fertilizer has 'enormous potential'"
year_published = 2017
