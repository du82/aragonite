["https://enn.com/about-enn"]
title = "Environmental News Network - ABOUT ENN"
description = 'When ENN was started over twenty years ago, it was our intention that our service would bring attention to the present and future environmental issues facing the health of our planet and the people it supports. Now, in a world where these issues have migrated to the mainstream, we are looking forward and asking: what more can we do to help? ENN has a serious editorial mission. Our mission is to inform, educate, enable and create a platform for global environmental action.  As a result, our readers are top environmental leaders from government, business and educators, as well as a broad spectrum of "intellectually curious" citizens. While in the past we were mainly aggregators of environmental news, ENN has become more than just a collection of content. It is rapidly becoming a collection of resources, teachers, experts and tools that provide objective information and knowledge about the increasingly complex field of environmental science. This distinction is important. As readers drown in too much information, then the sifting, sorting and organizing skills of the staff and editors at ENN becomes more and more critical. As part of this solution, ENN has, under new management, just entered into a variety of new partnerships with highly experienced environmental experts and editorial affiliates to bring to ENN a greater balance and depth of understanding about complex environmental issues, as well as front line reporting, that will be unlike that available to any other environmental news organization. I hope you will take a minute and explore the new ENN and get to know our services, meet our Partners and make use of what we feel is a critical information service for anyone who cares about improving our world.'
