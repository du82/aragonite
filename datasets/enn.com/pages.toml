["https://enn.com/articles/53651-pensando-fuera-de-la-caja-en-la-mitigaci%C3%B3n-del-clima"]
title = "Environmental News Network - Pensando fuera de la caja en la mitigación del clima"
description = "En un nuevo comentario en la revista Nature Climate Change, los investigadores de IIASA argumentan que se necesita una gama más amplia de escenarios para apoyar a los formuladores de políticas internacionales en el objetivo de limitar el cambio climático a menos de 2 ° C por encima de los niveles preindustriales, y evitar potenciales y las consecuencias sociales de la eliminación de dióxido de carbono a gran escala."
full_description = 'Pensando fuera de la caja en la mitigación del clima Details 12 January 2018 Previous Article Surprise: A Virus-Like Protein Is Important for Cognition and Memory Next Article Species identification in the water bottle Typography Font Size Default Reading Mode Share This En un nuevo comentario en la revista Nature Climate Change, los investigadores de IIASA argumentan que se necesita una gama más amplia de escenarios para apoyar a los formuladores de políticas internacionales en el objetivo de limitar el cambio climático a menos de 2 ° C por encima de los niveles preindustriales, y evitar potenciales y las consecuencias sociales de la eliminación de dióxido de carbono a gran escala. En un nuevo comentario en la revista Nature Climate Change, los investigadores de IIASA argumentan que se necesita una gama más amplia de escenarios para apoyar a los formuladores de políticas internacionales en el objetivo de limitar el cambio climático a menos de 2 ° C por encima de los niveles preindustriales, y evitar potenciales y las consecuencias sociales de la eliminación de dióxido de carbono a gran escala."Muchos supuestos caminos seguidos por las emisiones presumen que podemos disminuir lentamente las emisiones de combustibles fósiles hoy y compensarlos más tarde con una implementación pesada de tecnologías de emisiones negativas", dice Michael Obersteiner, director del Programa de Gestión de Servicios Ecosistémicos de IIASA, autor principal del artículo. "Este es un problema porque supone que podemos cargar a las generaciones futuras, lo que no es una suposición realista ni tampoco es moralmente aceptable desde el punto de vista de la equidad intergeneracional".Los investigadores señalan que el 87% de los escenarios en el Quinto Informe de Evaluación del IPCC que limitan el cambio climático a menos de 2 ° C dependen en gran medida de las emisiones negativas en la segunda mitad del siglo, y la mayoría de la eliminación de dióxido de carbono proviene de un grupo de tecnologías conocidas como Bioenergía con captura y almacenamiento de carbono (BECCS). Asumiendo que incluso es posible implementar BECCS en la escala requerida (una gran pregunta para una tecnología que aún no se ha probado o implementado ampliamente), la implementación masiva de estrategias de remoción de dióxido de carbono terrestre tendría impactos tanto en el ambiente como en el sistema de alimentación, con investigaciones previas que muestran compensaciones para la seguridad alimentaria y la conservación del medio ambiente.Continúe leyendo en International Institute for Applied Systems Analysis Spanish Previous Article Surprise: A Virus-Like Protein Is Important for Cognition and Memory Next Article Species identification in the water bottle'
