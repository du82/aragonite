full_description = "Applying Artificial Intelligence To Decarbonize Buildings Details Texas A&M University 10 January 2023 Previous Article Broccoli Looks More Like Cauliflower in a Warmer World Next Article ‘Learn To Live With Ugly’ After Freeze Damage Typography Font Size Default Reading Mode Share This An international team of researchers is applying artificial intelligence techniques to design energy-efficient district heat pump systems that better serve human needs and behaviors while reducing the carbon footprint of buildings. An international team of researchers is applying artificial intelligence techniques to design energy-efficient district heat pump systems that better serve human needs and behaviors while reducing the carbon footprint of buildings. The $1.5-million project is funded by the National Science Foundation’s (NSF) Partnerships for International Research and Education (PIRE) program and led by Zheng O’Neill of the J. Mike Walker ’66 Department of Mechanical Engineering at Texas A&M University. The PIRE program funds only an estimated 10-15 projects nationwide at a time, according to NSF. The research is also supported by the Texas A&M Engineering Experiment Station’s Energy Systems Laboratory, of which O’Neill is an associate director. The project focuses on the technology of district heat pump systems, which distribute energy to buildings through a system of heat pumps and insulated networked pipes. Read More: Texas A&M University Photo Credit: Pexels via Pixabay Sci/Tech Top Stories Energy Green Building Previous Article Broccoli Looks More Like Cauliflower in a Warmer World Next Article ‘Learn To Live With Ugly’ After Freeze Damage"
