["https://enn.com/articles/53665-descubrimiento-sorprendente-podr%C3%ADa-mejorar-las-bater%C3%ADas"]
title = "Environmental News Network - Descubrimiento sorprendente podría mejorar las baterías"
description = "Una colaboración liderada por científicos del Laboratorio Nacional de Brookhaven del Departamento de Energía de los EE. UU. (DOE) ha observado un fenómeno inesperado en las baterías de iones de litio, el tipo más común de batería utilizada para alimentar teléfonos celulares y automóviles eléctricos"
full_description = 'Descubrimiento sorprendente podría mejorar las baterías Details 15 January 2018 Previous Article Sanchi Oil Spill Contamination Could Take Three Months to Reach Mainland Next Article Lanternfish reveal how ocean warming impacts the twilight zone Typography Font Size Default Reading Mode Share This Una colaboración liderada por científicos del Laboratorio Nacional de Brookhaven del Departamento de Energía de los EE. UU. (DOE) ha observado un fenómeno inesperado en las baterías de iones de litio, el tipo más común de batería utilizada para alimentar teléfonos celulares y automóviles eléctricos Una colaboración liderada por científicos del Laboratorio Nacional de Brookhaven del Departamento de Energía de los EE. UU. (DOE) ha observado un fenómeno inesperado en las baterías de iones de litio, el tipo más común de batería utilizada para alimentar teléfonos celulares y automóviles eléctricos. Como modelo de batería que genera corriente eléctrica, los científicos presenciaron la concentración de litio dentro de nanopartículas individuales en reversa en un cierto punto, en lugar de aumentar constantemente. Este descubrimiento, que se publicó el 12 de enero en la revista Science Advances, es un paso importante para mejorar la duración de la batería de los productos electrónicos de consumo."Si tiene un teléfono celular, es probable que deba cargar su batería todos los días, debido a la capacidad limitada de los electrodos de la batería", dijo Esther Takeuchi, profesora distinguida de SUNY en la Universidad Stony Brook y científica jefe en la Dirección de Ciencias de la Energía en Brookhaven Lab. "Los hallazgos en este estudio podrían ayudar a desarrollar baterías que se cargan más rápido y duran más".Visualización de baterías en la nano escala: Dentro de cada batería de iones de litio hay partículas cuyos átomos están dispuestos en una red, una estructura periódica con huecos entre los átomos. Cuando una batería de iones de litio suministra electricidad, los iones de litio fluyen a sitios vacíos en la red atómica.Continúe leyendo en DOE/Brookhaven National LaboratoryImagen: Los científicos de Brookhaven se muestran en la instalación TEM del Departamento de Física de Materia Condensada y Ciencias de Materiales donde se realizó parte del estudio. En la foto de izquierda a derecha están Jianming Bai, Feng Wang, Wei Zhang, Yimei Zhu y Lijun Wu. (Crédito: Brookhaven National Laboratory) Spanish Previous Article Sanchi Oil Spill Contamination Could Take Three Months to Reach Mainland Next Article Lanternfish reveal how ocean warming impacts the twilight zone'
