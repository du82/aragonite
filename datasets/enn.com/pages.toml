full_description = "Green Houses Made From Glass Waste Details University of Technology Sydney 07 October 2022 Previous Article Making the Invisible Water Crisis Visible Next Article How Fish Survive Extreme Pressures of Ocean Life Typography Font Size Default Reading Mode Share This A recyclable ceramic material made from glass powder promises to reduce the carbon footprint of your bathroom, kitchen and roof. A recyclable ceramic material made from glass powder promises to reduce the carbon footprint of your bathroom, kitchen and roof. A research team led by Dr Stefan Lie and Associate Professor Tim Schork, from the UTS Faculty of Design, Architecture and Building, have invented a new construction material that takes glass waste that can be fired to produce a ceramic for tiles or wall cladding. The promising innovation was awarded first place in the UTS Research Translation Competition. “The traditional ceramics used in tiles and bricks are made from clay, earth or cement. They can’t be easily recycled and have a high carbon footprint,” says Dr Lie. Read more at University of Technology Sydney Photo Credit: EDDIE_LEE_KR via Pixabay Sci/Tech Top Stories Green Building Previous Article Making the Invisible Water Crisis Visible Next Article How Fish Survive Extreme Pressures of Ocean Life"
