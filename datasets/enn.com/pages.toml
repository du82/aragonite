["https://enn.com/articles/53591-estudio-de-la-nasa--primera-prueba-directa-de-la-recuperaci%C3%B3n-de-agujeros-de-ozono-debido-a-la-prohibici%C3%B3n-de-sustancias-qu%C3%ADmicas"]
title = "Environmental News Network - Estudio de la NASA: Primera prueba directa de la recuperación de agujeros de ozono debido a la prohibición de sustancias químicas"
description = "Por primera vez, los científicos han demostrado, a través de observaciones satelitales directas del agujero de ozono, que los niveles de cloro que destruye el ozono están disminuyendo, lo que reduce el agotamiento de la capa de ozono."
full_description = 'Estudio de la NASA: Primera prueba directa de la recuperación de agujeros de ozono debido a la prohibición de sustancias químicas Details 08 January 2018 Previous Article Will Self-Driving Cars Usher in a Transportation Utopia or Dystopia? Next Article FSU researcher: Ocean acidification means major changes for California mussels Typography Font Size Default Reading Mode Share This Por primera vez, los científicos han demostrado, a través de observaciones satelitales directas del agujero de ozono, que los niveles de cloro que destruye el ozono están disminuyendo, lo que reduce el agotamiento de la capa de ozono. Por primera vez, los científicos han demostrado, a través de observaciones satelitales directas del agujero de ozono, que los niveles de cloro que destruye el ozono están disminuyendo, lo que reduce el agotamiento de la capa de ozono.Las mediciones muestran que la disminución del cloro, resultado de una prohibición internacional de productos químicos que contienen cloro, llamados clorofluorocarbonos (CFC), ha resultado en un 20 por ciento menos de agotamiento de la capa de ozono durante el invierno antártico comparado con el 2005, el primer año que las mediciones del cloro y el ozono durante el invierno antártico fueron hechas por el satélite Aura de la NASA."Vemos muy claramente que el cloro de los CFC está bajando en el agujero de ozono y que está ocurriendo menos agotamiento del ozono debido a él", dijo la autora principal Susan Strahan, científica atmosférica del Centro de Vuelos Espaciales Goddard de la NASA en Greenbelt, Maryland.Los CFC son compuestos químicos de larga vida que finalmente se elevan a la estratosfera, donde sus moléculas son separadas por la radiación ultravioleta del Sol, liberando átomos de cloro que destruyen las moléculas de ozono. El ozono estratosférico protege la vida en el planeta mediante la absorción de la radiación ultravioleta potencialmente dañina que puede causar cáncer de piel y cataratas, suprimir el sistema inmunológico y dañar la vida de las plantas.Continúe leyendo en NASA/Goddard Space Flight CenterImagen: Una vista de la atmósfera de la tierra desde el espacio. Crédito: NASA Spanish Previous Article Will Self-Driving Cars Usher in a Transportation Utopia or Dystopia? Next Article FSU researcher: Ocean acidification means major changes for California mussels'
year_published = 2018
