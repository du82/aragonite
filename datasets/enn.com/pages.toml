["https://enn.com/articles/76090-are-our-refrigerants-safe-the-lingering-questions-about-the-chemicals-keeping-us-cool"]
title = "Environmental News Network - Are Our Refrigerants Safe? The Lingering Questions About the Chemicals Keeping Us Cool"
description = "A global perspective on environmental issues.  Our mission is to inform, educate, enable and create a platform for global environmental action."
full_description = "Are Our Refrigerants Safe? The Lingering Questions About the Chemicals Keeping Us Cool Details University of New South Wales 28 February 2025 Previous Article Student Refines 100-Year-Old Math Problem, Expanding Wind Energy Possibilities Next Article Select Corn Lines Contain Compounds That Sicken, Kill Major Crop Pest Typography Font Size Default Reading Mode Share This The latest chemicals used in refrigerants and aerosols can break down into pollutants, UNSW scientists say. The latest chemicals used in refrigerants and aerosols can break down into pollutants, UNSW scientists say. A team of scientists at UNSW has discovered that some of the most important new refrigerants break down, in part, into persistent greenhouse gas pollutants, including compounds that have been banned internationally. Refrigerants are chemicals that turn from a liquid to a gas – and vice-versa – and transfer heat in the process, that are used for refrigeration and indoor heating and cooling. The chemicals are also used as aerosol propellants, fire retardants and in the manufacture of foamed plastics. Hydrofluoroolefins (HFOs), which react rapidly in the lower atmosphere, have emerged as the lead synthetic chemical for refrigerants, and are considered a more environmentally friendly alternative to their chemical predecessors. While it’s known that HFOs decompose into chemicals like trifluoroacetaldehyde, there has been persistent discussion about whether this compound further breaks down into fluoroform – the most environmentally damaging HFC they were used to replace. Read more at University of New South Wales Image: A team at UNSW produced a gas mixture at various pressures to simulate the atmosphere and observe the chemical reaction. (Credit: Photo: Supplied to UNSW) Sci/Tech Climate Pollution Top Stories Previous Article Student Refines 100-Year-Old Math Problem, Expanding Wind Energy Possibilities Next Article Select Corn Lines Contain Compounds That Sicken, Kill Major Crop Pest"
