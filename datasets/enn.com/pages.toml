full_description = '''Stopping Native Forest Logging Key to Getting to Net Zero Details Australian National University 14 October 2022 Previous Article Alpine Plants Respond to Climate Change Next Article Animals in National Parks Impacted by Even Just a Few People Typography Font Size Default Reading Mode Share This Leading researchers are calling for a cease to native forest logging if Australia wants to meet its net zero targets in coming decades. The researchers, from The Australian National University (ANU) and Griffith University, say only native forests can remove carbon from the atmosphere at the rapid rate required. The Federal Government has legislated a 43 per cent reduction in greenhouse gas emissions from 2005 levels by the year 2030. Professor Brendan Mackey from Griffith University said carbon emissions need to be reduced by around 15.3 megatons each year for the next nine years if the government's target is to be met. "This is about the same as the annual net carbon emissions generated by logging our native forests," Professor Mackey said. "Protecting and restoring native forests is a critical mitigation action if Australia is to meet its net zero emissions targets." Continue reading at Australian National University Image via Australian National University Top Stories Business Climate Green Building Ecosystems Agriculture Previous Article Alpine Plants Respond to Climate Change Next Article Animals in National Parks Impacted by Even Just a Few People'''
