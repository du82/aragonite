full_description = "Scientists develop a novel soil-reenforcing material by recycling waste fluids from geothermal energy harvesting plants. Surrey's Global Centre for Clean Air Research (GCARE), working with 30 co-authors from seven countries, found that parks may be the most effective solution for reducing overall air pollution – cutting air pollution by 22% city-wide. Researchers at KIT develop a transparent metamaterial for energy-efficient light and temperature regulation in buildings. Researchers at UBC Okanagan are revisiting old building practices—the use of by-products and cast-offs—as a way to improve building materials and sustainability of the trade. With its zinc roofs and minimal tree cover, Paris was not built to handle the new era of extreme heat. Office buildings are typically not energy efficient, and globally they contribute to nearly a third of greenhouse gas emissions from construction to end of life. An international team of researchers is applying artificial intelligence techniques to design energy-efficient district heat pump systems that better serve human needs and behaviors while reducing the carbon footprint of buildings. Five small islands roughly the size of backyard swimming pools float next to the concrete riverbank of Bubbly Creek, a stretch of the Chicago River named for the gas that once rose to the surface after stockyards dumped animal waste and byproducts into the waterway. Leading researchers are calling for a cease to native forest logging if Australia wants to meet its net zero targets in coming decades. A recyclable ceramic material made from glass powder promises to reduce the carbon footprint of your bathroom, kitchen and roof."
