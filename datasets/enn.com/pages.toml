["https://enn.com/articles/76086-environmental-impact-of-unexploded-ordnance-in-the-baltic-sea"]
title = "Environmental News Network - Environmental Impact of Unexploded Ordnance in the Baltic Sea"
description = "The south-western Baltic Sea has about 3,000 kilograms of dissolved toxic chemicals released from unexploded ordnance, according to a new study by the GEOMAR Helmholtz Centre for Ocean Research Kiel."
full_description = "Environmental Impact of Unexploded Ordnance in the Baltic Sea Details Helmholtz Centre for Ocean Research Kiel (GEOMAR) 27 February 2025 Previous Article Beyond the Burn: Harvesting Dead Wood to Reduce Wildfires Next Article Researchers Uncover Key Insights Into Co₂ Reduction Using Sno-Based Electrocatalysts Typography Font Size Default Reading Mode Share This The south-western Baltic Sea has about 3,000 kilograms of dissolved toxic chemicals released from unexploded ordnance, according to a new study by the GEOMAR Helmholtz Centre for Ocean Research Kiel. The south-western Baltic Sea has about 3,000 kilograms of dissolved toxic chemicals released from unexploded ordnance, according to a new study by the GEOMAR Helmholtz Centre for Ocean Research Kiel. The substances were detected in almost all water samples taken in 2017 and 2018, with particularly high concentrations in the Bights of Kiel and Lübeck. The levels are still below thresholds for health risk, but highlight the urgent need for munitions clearance to minimise long-term risks. The study has now been published in the journal Chemosphere. It is estimated that around 300,000 tonnes of unexploded ordnance (UXO) remain in the German Baltic Sea. Most of this originates from deliberate dumping after the end of the Second World War. These dumping sites are well documented, with much of the ordnance lying visibly on the seabed, allowing it to be mapped and documented using underwater robots. However, explosive compounds are spreading beyond these dumping sites. As corrosion progresses, contamination is expected to increase, heightening risks if these legacy munitions are not removed. Rising temperatures and increased storm activity due to climate change further accelerate the release of these explosive chemicals. Toxins Found in Almost Every Sample A new study from the GEOMAR Helmholtz Centre for Ocean Research Kiel highlights the long-term environmental contamination caused by unexploded ordnance in the south-western Baltic Sea. Water samples were taken from the region in 2017 and 2018, including from the Bay of Kiel and the Bay of Lübeck. Ammunition-related chemicals were detected in almost every water sample. The concentrations detected were generally well below drinking water limits or toxicological thresholds for marine organisms. In some cases, however, concentrations approached critical levels. Read more at Helmholtz Centre for Ocean Research Kiel (GEOMAR) Photo Credit: manfredrichter via Pixabay Sci/Tech Pollution Top Stories Previous Article Beyond the Burn: Harvesting Dead Wood to Reduce Wildfires Next Article Researchers Uncover Key Insights Into Co₂ Reduction Using Sno-Based Electrocatalysts"
author = "Helmholtz Centre for Ocean Research Kiel (GEOMAR)"
year_published = 2025
