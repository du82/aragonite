["https://enn.com/about-enn/2-uncategorised/56522-major-northeastern-snowstorms-expected-to-continue-with-climate-change"]
title = "Environmental News Network - Major Northeastern Snowstorms Expected to Continue with Climate Change"
description = "Even though climate change is expected to reduce the total amount of U.S. snowfall this century, it's unlikely to significantly rein in the most powerful nor'easters that pummel the East Coast, new research indicates."
full_description = '''Major Northeastern Snowstorms Expected to Continue with Climate Change Previous Article How Sponges Undermine Coral Reefs from Within Next Article About ENN Typography Font Size Default Reading Mode Share This Even though climate change is expected to reduce the total amount of U.S. snowfall this century, it's unlikely to significantly rein in the most powerful nor'easters that pummel the East Coast, new research indicates. Even though climate change is expected to reduce the total amount of U.S. snowfall this century, it's unlikely to significantly rein in the most powerful nor'easters that pummel the East Coast, new research indicates. The study finds that smaller snowstorms that drop a few inches will diminish greatly in number by late century. But the most damaging types of storms along the Eastern Seaboard, which strike every few years or so and cause widespread disruption, will remain about as frequent in a warming world. "What this research finds is almost all of the decrease in snow occurs in weaker, more nuisance-type events," said atmospheric scientist Colin Zarzycki, the author of the study. "The really crippling storms that have major regional impacts on transportation, on the economy, on infrastructure are not significantly mitigated in a warming climate." Read more at National Center for Atmospheric Research Image: This January 2018 satellite image shows an intense nor'easter with a hurricane-like eye at its center. CREDIT: National Oceanic and Atmospheric Administration, using GOES-16 data. Sci/Tech Top Stories Climate Previous Article How Sponges Undermine Coral Reefs from Within Next Article About ENN'''
