description = "Ambitious government plans for the expansion of solar farms could be achieved without sacrificing farmland, according to new research on a technology that could meet the UK’s electricity needs four times over."
full_description = "Solar Technology Could Meet UK’s Electricity Needs Without Sacrificing Farmland Details University of Sheffield 28 February 2025 Next Article Can We Find Floating Vegetation on Ocean Planets? Typography Font Size Default Reading Mode Share This Ambitious government plans for the expansion of solar farms could be achieved without sacrificing farmland, according to new research on a technology that could meet the UK’s electricity needs four times over. Ambitious government plans for the expansion of solar farms could be achieved without sacrificing farmland, according to new research on a technology that could meet the UK’s electricity needs four times over. The University of Sheffield study assessed how agrivoltaics technology - integrating solar panels into farmland in a way that maintains agricultural activities - could help the UK reach its solar energy targets (PV) and meet its commitment to reach net zero by 2050. Current government plans to significantly increase ground-mounted solar parks, which are already in use across the UK, have proven contentious and unpopular with farmers and the public alike. Concerns about the loss of high-quality agricultural land, potential impacts on food production and cost of living, and the visual impact on landscapes are among factors fuelling the criticism. Read more at University of Sheffield Photo Credit: StockSnap via Pixabay Sci/Tech Climate Agriculture Energy Top Stories Next Article Can We Find Floating Vegetation on Ocean Planets?"
