full_description = '''Latest posts for tag debian Debugging printing to a remote printer I upgraded to Debian testing/trixie, and my network printer stopped appearing in print dialogs. These are notes from the debugging session. Check firewall configuration I tried out kde, which installed plasma-firewall, which installed firewalld, which closed by default the ports used for printing. For extra fun, appindicators are not working in Gnome and so firewall-applet is currently useless, although one can run firewall-config manually, or use the command line that might be more user friendly than the UI. Step 1: change the zone for the home wifi to "Home": firewall-cmd --zone home --list-interfaces firewall-cmd --zone home --add-interface wlp1s0 Step 2: make sure the home zone can print: firewall-cmd --zone home --list-services firewall-cmd --zone home --add-service=ipp firewall-cmd --zone home --add-service=ipp-client firewall-cmd --zone home --add-service=mdns I searched and searched but I could not find out whether ipp is needed, ipp-client is needed, or both are needed. Check if avahi can see the printer Is the printer advertised correctly over mdns? When it didn't work: $ avahi-browse -avrt = wlp1s0 IPv6 Brother HL-2030 series @ server UNIX Printer local hostname = [server.local] address = [...ipv6 address...] port = [0] txt = [] = wlp1s0 IPv4 Brother HL-2030 series @ server UNIX Printer local hostname = [server.local] address = [...ipv4 address...] port = [0] txt = [] $ avahi-browse -rt _ipp._tcp [empty] When it works: $ avahi-browse -avrt = wlp1s0 IPv6 Brother HL-2030 series @ server Secure Internet Printer local hostname = [server.local] address = [...ipv6 address...] port = [631] txt = ["printer-type=0x1046" "printer-state=3" "Copies=T" "TLS=1.2" "UUID=…" "URF=DM3" "pdl=application/octet-stream,application/pdf,application/postscript,image/jpeg,image/png,image/pwg-raster,image/urf" "product=(HL-2030 series)" "priority=0" "note=" "adminurl=https://server.local.:631/printers/Brother_HL-2030_series" "ty=Brother HL-2030 series, using brlaser v6" "rp=printers/Brother_HL-2030_series" "qtotal=1" "txtvers=1"] = wlp1s0 IPv6 Brother HL-2030 series @ server UNIX Printer local hostname = [server.local] address = [...ipv6 address...] port = [0] txt = [] = wlp1s0 IPv4 Brother HL-2030 series @ server Secure Internet Printer local hostname = [server.local] address = [...ipv4 address...] port = [631] txt = ["printer-type=0x1046" "printer-state=3" "Copies=T" "TLS=1.2" "UUID=…" "URF=DM3" "pdl=application/octet-stream,application/pdf,application/postscript,image/jpeg,image/png,image/pwg-raster,image/urf" "product=(HL-2030 series)" "priority=0" "note=" "adminurl=https://server.local.:631/printers/Brother_HL-2030_series" "ty=Brother HL-2030 series, using brlaser v6" "rp=printers/Brother_HL-2030_series" "qtotal=1" "txtvers=1"] = wlp1s0 IPv4 Brother HL-2030 series @ server UNIX Printer local hostname = [server.local] address = [...ipv4 address...] port = [0] txt = [] $ avahi-browse -rt _ipp._tcp + wlp1s0 IPv6 Brother HL-2030 series @ server Internet Printer local + wlp1s0 IPv4 Brother HL-2030 series @ server Internet Printer local = wlp1s0 IPv4 Brother HL-2030 series @ server Internet Printer local hostname = [server.local] address = [...ipv4 address...] port = [631] txt = ["printer-type=0x1046" "printer-state=3" "Copies=T" "TLS=1.2" "UUID=…" "URF=DM3" "pdl=application/octet-stream,application/pdf,application/postscript,image/jpeg,image/png,image/pwg-raster,image/urf" "product=(HL-2030 series)" "priority=0" "note=" "adminurl=https://server.local.:631/printers/Brother_HL-2030_series" "ty=Brother HL-2030 series, using brlaser v6" "rp=printers/Brother_HL-2030_series" "qtotal=1" "txtvers=1"] = wlp1s0 IPv6 Brother HL-2030 series @ server Internet Printer local hostname = [server.local]https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1092109 address = [...ipv6 address...] port = [631] txt = ["printer-type=0x1046" "printer-state=3" "Copies=T" "TLS=1.2" "UUID=…" "URF=DM3" "pdl=application/octet-stream,application/pdf,application/postscript,image/jpeg,image/png,image/pwg-raster,image/urf" "product=(HL-2030 series)" "priority=0" "note=" "adminurl=https://server.local.:631/printers/Brother_HL-2030_series" "ty=Brother HL-2030 series, using brlaser v6" "rp=printers/Brother_HL-2030_series" "qtotal=1" "txtvers=1"] Check if cups can see the printer From CUPS' Using Network Printers: $ /usr/sbin/lpinfo --include-schemes dnssd -v network dnssd://Brother%20HL-2030%20series%20%40%20server._ipp._tcp.local/cups?uuid=… Debugging session interrupted At this point, the printer appeared. It could be that: lpinfo somehow made it work after opening ipp services on the firewall and spending enough minutes researching, eventually cups-browsed could see the printer logging into the remote server to list printers woke it up somehow the printer just realised I was level headed, determined and not in a hurry. In the end, debugging failed successfully, and this log now remains as a reference for possible further issues. 2025-01-07 pdo debian eng cups firewalld ncdu on files to back up I use borg and restic to backup files in my system. Sometimes I run a huge download or clone a large git repo and forget to mark it with CACHEDIR.TAG, and it gets picked up slowing the backup process and wasting backup space uselessly. I would like to occasionally audit the system to have an idea of what is a candidate for backup. ncdu would be great for this, but it doesn't know about backup exclusion filters. Let's teach it then. Here's a script that simulates a backup and feeds the results to ncdu: #!/usr/bin/python3 import argparse import os import sys import time import stat import json import subprocess import tempfile from pathlib import Path from typing import Any FILTER_ARGS = [ "--one-file-system", "--exclude-caches", "--exclude", "*/.cache", ] BACKUP_PATHS = [ "/home", ] class Dir: """ Dispatch borg output into a hierarchical directory structure. borg prints a flat file list, ncdu needs a hierarchical JSON. """ def __init__(self, path: Path, name: str): self.path = path self.name = name self.subdirs: dict[str, "Dir"] = {} self.files: list[str] = [] def print(self, indent: str = "") -> None: for name, subdir in self.subdirs.items(): print(f"{indent}{name:}/") subdir.print(indent + " ") for name in self.files: print(f"{indent}{name}") def add(self, parts: tuple[str, ...]) -> None: if len(parts) == 1: self.files.append(parts[0]) return subdir = self.subdirs.get(parts[0]) if subdir is None: subdir = Dir(self.path / parts[0], parts[0]) self.subdirs[parts[0]] = subdir subdir.add(parts[1:]) def to_data(self) -> list[Any]: res: list[Any] = [] st = self.path.stat() res.append(self.collect_stat(self.name, st)) for name, subdir in self.subdirs.items(): res.append(subdir.to_data()) dir_fd = os.open(self.path, os.O_DIRECTORY) try: for name in self.files: try: st = os.lstat(name, dir_fd=dir_fd) except FileNotFoundError: print( "Possibly broken encoding:", self.path, repr(name), file=sys.stderr, ) continue if stat.S_ISDIR(st.st_mode): continue res.append(self.collect_stat(name, st)) finally: os.close(dir_fd) return res def collect_stat(self, fname: str, st) -> dict[str, Any]: res = { "name": fname, "ino": st.st_ino, "asize": st.st_size, "dsize": st.st_blocks * 512, } if stat.S_ISDIR(st.st_mode): res["dev"] = st.st_dev return res class Scanner: def __init__(self) -> None: self.root = Dir(Path("/"), "/") self.data = None def scan(self) -> None: with tempfile.TemporaryDirectory() as tmpdir_name: mock_backup_dir = Path(tmpdir_name) / "backup" subprocess.run( ["borg", "init", mock_backup_dir.as_posix(), "--encryption", "none"], cwd=Path.home(), check=True, ) proc = subprocess.Popen( [ "borg", "create", "--list", "--dry-run", ] + FILTER_ARGS + [ f"{mock_backup_dir}::test", ] + BACKUP_PATHS, cwd=Path.home(), stderr=subprocess.PIPE, ) assert proc.stderr is not None for line in proc.stderr: match line[0:2]: case b"- ": path = Path(line[2:].strip().decode()) case b"x ": continue case _: raise RuntimeError(f"Unparsable borg output: {line!r}") if path.parts[0] != "/": raise RuntimeError(f"Unsupported path: {path.parts!r}") self.root.add(path.parts[1:]) def to_json(self) -> list[Any]: return [ 1, 0, { "progname": "backup-ncdu", "progver": "0.1", "timestamp": int(time.time()), }, self.root.to_data(), ] def export(self): return json.dumps(self.to_json()).encode() def main(): parser = argparse.ArgumentParser( description="Run ncdu to estimate sizes of files to backup." ) parser.parse_args() scanner = Scanner() scanner.scan() # scanner.root.print() res = subprocess.run(["ncdu", "-f-"], input=scanner.export()) sys.exit(res.returncode) if __name__ == "__main__": main() 2025-01-05 pdo debian eng backup python How to right click I climbed on top of a mountain with a beautiful view, and when I started readying my new laptop for a work call (as one does on top of mountains), I realised that I couldn't right click and it kind of spoiled the mood. Clicking on the bottom right corner of my touchpad left-clicked. Clicking with two fingers left-clicked. Alt-clicking, Super-clicking, Control-clicking, left clicked. Here's there are two ways to simulate mouse buttons with touchpads in Wayland: clicking on different areas at the bottom of the touchpad double or triple-tapping, as long as the fingers are not too far apart Skippable digression: I'm not sure why Gnome insists in following Macs for defaults, which is what people with non-Mac hardware are less likely to be used to. In my experience, Macs are as arbitrarily awkward to use as anything else, but they managed to build a community where if you don't understand how it works you get told you're stupid. All other systems (including Gnome) have communities where instead you get told (as is generally the case) that the system design is stupid, which at least gives you some amount of validation in your suffering. Oh well. How to configure right click Surprisingly, this is not available in Gnome Shell settings. It can be found in gnome-tweaks: under "Keyboard & Mouse", "Mouse Click Emulation", one can choose between "Fingers" or "Area". I tried both and went for "Area": I use right-drag a lot to resize windows, and I couldn't find a way, at least with this touchpad, to make it work consistently in "Fingers" mode. 2024-12-04 pdo debian eng New laptop setup My new laptop Framework (Framework Laptop 13 DIY Edition (AMD Ryzen™ 7040 Series)) arrived, all the hardware works out of the box on Debian Stable, and I'm very happy indeed. This post has the notes of all the provisioning steps, so that I can replicate them again if needed. Installing Debian 12 Debian 12's installer just worked, with Secure Boot enabled no less, which was nice. The only glitch is an argument with the guided partitioner, which was uncooperative: I have been hit before by a /boot partition too small, and I wanted 1G of EFI and 1G of boot, while the partitioner decided that 512Mb were good enough. Frustratingly, there was no way of changing that, nor I found how to get more than 1G of swap, as I wanted enough swap to fit RAM for hybernation. I let it install the way it pleased, then I booted into grml for a round of gparted. The tricky part of that was resizing the root btrfs filesystem, which is in an LV, which is in a VG, which is in a PV, which is in LUKS. Here's a cheatsheet. Shrink partitions: mount the root filesystem in /mnt btrfs filesystem resize 6G /mnt umount the root filesystem lvresize -L 7G vgname/lvname pvresize --setphysicalvolumesize /dev/mapper/pvname 8G cryptsetup resize --device-size 9G name note that I used an increasing size because I don't trust that each tool has a way of representing sizes that aligns to the byte. I'd be happy to find out that they do, but didn't want to find out the hard way that they didn't. Resize with gparted: Move and resize partitions at will. Shrinking first means it all takes a reasonable time, and you won't have to wait almost an hour for a terabyte-sized empty partition to be carefully moved around. Don't ask me why I know. Regrow partitions: cryptsetup resize name pvresize /dev/mapper/pvname lvresize -L 100% vgname/lvname mount the root filesystem in /mnt btrfs filesystem resize max /mnt umount the root filesystem Setup gnome When I get a new laptop I have a tradition of trying to make it work with Gnome and Wayland, which normally ended up in frustration and a swift move to X11 and Xfce: I have a lot of long-time muscle memory involved in how I use a computer, and it needs to fit like prosthetics. I can learn to do a thing or two in a different way, but any papercut that makes me break flow and I cannot fix will soon become a dealbreaker. This applies to Gnome as present in Debian Stable. General Gnome settings tips I can list all available settings with: gsettings list-recursively which is handy for grepping things like hotkeys. I can manually set a value with: gsettings set <schema> <key> <value> and I can reset it to its default with: gsettings reset <schema> <key> Some applications like Gnome Terminal use "relocatable schemas", and in those cases you also need to specify a path, which can be discovered using dconf-editor: gsettings set <schema>:<path> <key> <value> Install appindicators First thing first: app install gnome-shell-extension-appindicator, log out and in again: the Gnome Extension manager won't see the extension as available until you restart the whole session. I have no idea why that is so, and I have no idea why a notification area is not present in Gnome by default, but at least now I can get one. Fix font sizes across monitors My laptop screen and monitor have significantly different DPIs, so: gsettings set org.gnome.mutter experimental-features "['scale-monitor-framebuffer']" And in Settings/Displays, set a reasonable scaling factor for each display. Disable Alt/Super as hotkey for the Overlay Seeing all my screen reorganize and reshuffle every time I accidentally press Alt leaves me disoriented and seasick: gsettings set org.gnome.mutter overlay-key '' Focus-follows-mouse and Raise-or-lower My desktop is like my desktop: messy and cluttered. I have lots of overlapping window and I switch between them by moving the focus with the mouse, and when the visible part is not enough I have a handy hotkey mapped to raise-or-lower to bring forward what I need and send back what I don't need anymore. Thankfully Gnome can be configured that way, with some work: In gnome-shell settings, keyboard, shortcuts, windows, set "Raise window if covered, otherwise lower it" to "Super+Escape" In gnome-tweak-tool, Windows, set "Focus on Hover" This almost worked, but sometimes it didn't do what I wanted, like I expected to find a window to the front but another window disappeared instead. I eventually figured that by default Gnome delays focus changes by a perceivable amount, which is evidently too slow for the way I move around windows. The amount cannot be shortened, but it'''
