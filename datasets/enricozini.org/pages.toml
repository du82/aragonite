title = "Doing things /together/"
full_description = '''Doing things /together/ pdo debian eng talk Here are the slides of mine and Ulrike's talk Doing things /together/. Our thoughts about cooperation aspects of doing things together. Sometimes in Debian we do work together with others, and sometimes we are a number of people who work alone, and happen to all upload their work in the same place. In times when we have needed to take important decisions together, this distinction has become crucial, and some of us might have found that we were not as good at cooperation as we would have thought. This talk is intended for everyone who is part of a larger community. We will show concepts and tools that we think could help understand and shape cooperation. Video of the talk: full quality low quality The slides have extensive notes: you can use View → Notes in LibreOffice Impress to see them. Here are the Inkscape sources for the graphs: Carlo Maria Cipolla's graph Thomas Kilmann Conflict Mode Instrument Kahler's Drivers Here are links to resources quoted in the talk: Carlo M. Cipolla - Wikipedia Thomas–Kilmann Conflict Mode Instrument - Wikipedia The Evolution of Trust Moral behavior in animals Taibi Kahler - Wikipedia Kahler's Drivers questionnaire / Antreiber Test - English and German Alison Green Coaching - Behavioural Drivers Questionnaire Founder's syndrome - Wikipedia Peter principle - Wikipedia Benevolent dictator for life - Wikipedia Difficult Conversations: How to Discuss What Matters Most Getting to Yes - Wikipedia Webcomics - Pepper&Carrot In the Q&A, pollo asked: How can we still have a good code review process without making it a "you need to be perfect" scenario? I often find picky code reviews help me write better code. Ulrike wrote a more detailed answer: Code reviews: from nitpicking to cooperation'''
