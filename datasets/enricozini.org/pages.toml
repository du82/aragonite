["https://enricozini.org/series/qt-cross"]
title = "Latest posts of series <strong>Qt Creator cross-platform development in Stretch: exploration</strong>"
description = "Most recent posts of series Qt Creator cross-platform development in Stretch: exploration"
full_description = '''Latest posts of series Qt Creator cross-platform development in Stretch: exploration Updating cbqt for bullseye Back in 2017 I did work to setup a cross-building toolchain for QT Creator, that takes advantage of Debian's packaging for all the dependency ecosystem. It ended with cbqt which is a little script that sets up a chroot to hold cross-build-dependencies, to avoid conflicting with packages in the host system, and sets up a qmake alternative to make use of them. Today I'm dusting off that work, to ensure it works on Debian bullseye. Resetting QT Creator To make things reproducible, I wanted to reset QT Creator's configuration. Besides purging and reinstalling the package, one needs to manually remove: ~/.config/QtProject ~/.cache/QtProject/ /usr/share/qtcreator/QtProject which is where configuration is stored if you used sdktool to programmatically configure Qt Creator (see for example this post and see Debian bug #1012561. Updating cbqt Easy start, change the distribution for the chroot: -DIST_CODENAME = "stretch" +DIST_CODENAME = "bullseye" Adding LIBDIR Something else does not work: Test$ qmake-armhf -makefile Info: creating stash file …/Test/.qmake.stash Test$ make [...] /usr/bin/arm-linux-gnueabihf-g++ -Wl,-O1 -Wl,-rpath-link,…/armhf/lib/arm-linux-gnueabihf -Wl,-rpath-link,…/armhf/usr/lib/arm-linux-gnueabihf -Wl,-rpath-link,…/armhf/usr/lib/ -o Test main.o mainwindow.o moc_mainwindow.o …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Widgets.so …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Gui.so …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Core.so -lGLESv2 -lpthread /usr/lib/gcc-cross/arm-linux-gnueabihf/10/../../../../arm-linux-gnueabihf/bin/ld: cannot find -lGLESv2 collect2: error: ld returned 1 exit status make: *** [Makefile:146: Test] Error 1 I figured that now I also need to set QMAKE_LIBDIR and not just QMAKE_RPATHLINKDIR: --- a/cbqt +++ b/cbqt @@ -241,18 +241,21 @@ include(../common/linux.conf) include(../common/gcc-base-unix.conf) include(../common/g++-unix.conf) +QMAKE_LIBDIR += {chroot.abspath}/lib/arm-linux-gnueabihf +QMAKE_LIBDIR += {chroot.abspath}/usr/lib/arm-linux-gnueabihf +QMAKE_LIBDIR += {chroot.abspath}/usr/lib/ QMAKE_RPATHLINKDIR += {chroot.abspath}/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += {chroot.abspath}/usr/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += {chroot.abspath}/usr/lib/ Now it links again: Test$ qmake-armhf -makefile Test$ make /usr/bin/arm-linux-gnueabihf-g++ -Wl,-O1 -Wl,-rpath-link,…/armhf/lib/arm-linux-gnueabihf -Wl,-rpath-link,…/armhf/usr/lib/arm-linux-gnueabihf -Wl,-rpath-link,…/armhf/usr/lib/ -o Test main.o mainwindow.o moc_mainwindow.o -L…/armhf/lib/arm-linux-gnueabihf -L…/armhf/usr/lib/arm-linux-gnueabihf -L…/armhf/usr/lib/ …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Widgets.so …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Gui.so …/armhf/usr/lib/arm-linux-gnueabihf/libQt5Core.so -lGLESv2 -lpthread Making it work in Qt Creator Time to try it in Qt Creator, and sadly it fails: …/armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/features/toolchain.prf:76: Variable QMAKE_CXX.COMPILER_MACROS is not defined. QMAKE_CXX.COMPILER_MACROS is not defined I traced it to this bit in armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/features/toolchain.prf (nonrelevant bits deleted): isEmpty($${target_prefix}.COMPILER_MACROS) { msvc { # … } else: gcc|ghs { vars = $$qtVariablesFromGCC($$QMAKE_CXX) } for (v, vars) { # … $${target_prefix}.COMPILER_MACROS += $$v } cache($${target_prefix}.COMPILER_MACROS, set stash) } else { # … } It turns out that qmake is not able to realise that the compiler is gcc, so vars does not get set, nothing is set in COMPILER_MACROS, and qmake fails. Reproducing it on the command line When run manually, however, qmake-armhf worked, so it would be good to know how Qt Creator is actually running qmake. Since it frustratingly does not show what commands it runs, I'll have to strace it: strace -e trace=execve --string-limit=123456 -o qtcreator.trace -f qtcreator And there it is: $ grep qmake- qtcreator.trace 1015841 execve("/usr/local/bin/qmake-armhf", ["/usr/local/bin/qmake-armhf", "-query"], 0x56096e923040 /* 54 vars */) = 0 1015865 execve("/usr/local/bin/qmake-armhf", ["/usr/local/bin/qmake-armhf", "…/Test/Test.pro", "-spec", "arm-linux-gnueabihf", "CONFIG+=debug", "CONFIG+=qml_debug"], 0x7f5cb4023e20 /* 55 vars */) = 0 I run the command manually and indeed I reproduce the problem: $ /usr/local/bin/qmake-armhf Test.pro -spec arm-linux-gnueabihf CONFIG+=debug CONFIG+=qml_debug …/armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/features/toolchain.prf:76: Variable QMAKE_CXX.COMPILER_MACROS is not defined. I try removing options until I find the one that breaks it and... now it's always broken! Even manually running qmake-armhf, like I did earlier, stopped working: $ rm .qmake.stash $ qmake-armhf -makefile …/armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/features/toolchain.prf:76: Variable QMAKE_CXX.COMPILER_MACROS is not defined. Debugging toolchain.prf I tried purging and reinstalling qtcreator, and recreating the chroot, but qmake-armhf is staying broken. I'll let that be, and try to debug toolchain.prf. By grepping gcc in the mkspecs directory, I managed to figure out that: The } else: gcc|ghs { test is matching the value(s) of QMAKE_COMPILER QMAKE_COMPILER can have multiple values, separated by space If in armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/arm-linux-gnueabihf/qmake.conf I set QMAKE_COMPILER = gcc arm-linux-gnueabihf-gcc, then things work again. Sadly, I failed to find reference documentation for QMAKE_COMPILER's syntax and behaviour. I also failed to find why qmake-armhf worked earlier, and I am also failing to restore the system to a situation where it works again. Maybe I dreamt that it worked? I had some manual change laying around from some previous fiddling with things? Anyway at least now I have the fix: --- a/cbqt +++ b/cbqt @@ -248,7 +248,7 @@ QMAKE_RPATHLINKDIR += {chroot.abspath}/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += {chroot.abspath}/usr/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += {chroot.abspath}/usr/lib/ -QMAKE_COMPILER = {chroot.arch_triplet}-gcc +QMAKE_COMPILER = gcc {chroot.arch_triplet}-gcc QMAKE_CC = /usr/bin/{chroot.arch_triplet}-gcc Fixing a compiler mismatch warning In setting up the kit, Qt Creator also complained that the compiler from qmake did not match the one configured in the kit. That was easy to fix, by pointing at the host system cross-compiler in qmake.conf: QMAKE_COMPILER = {chroot.arch_triplet}-gcc -QMAKE_CC = {chroot.arch_triplet}-gcc +QMAKE_CC = /usr/bin/{chroot.arch_triplet}-gcc QMAKE_LINK_C = $$QMAKE_CC QMAKE_LINK_C_SHLIB = $$QMAKE_CC -QMAKE_CXX = {chroot.arch_triplet}-g++ +QMAKE_CXX = /usr/bin/{chroot.arch_triplet}-g++ QMAKE_LINK = $$QMAKE_CXX QMAKE_LINK_SHLIB = $$QMAKE_CXX Updated setup instructions Create an armhf environment: sudo cbqt ./armhf --create --verbose Create a qmake wrapper that builds with this environment: sudo ./cbqt ./armhf --qmake -o /usr/local/bin/qmake-armhf Install the build-dependencies that you need: # Note: :arch is added automatically to package names if no arch is explicitly specified sudo ./cbqt ./armhf --install libqt5svg5-dev libmosquittopp-dev qtwebengine5-dev Build with qmake Use qmake-armhf instead of qmake and it works perfectly: qmake-armhf -makefile make Set up Qt Creator Configure a new Kit in Qt Creator: Tools/Options, then Kits, then Add Name: armhf (or anything you like) In the Qt Versions tab, click Add then set the path of the new Qt to /usr/local/bin/qmake-armhf. Click Apply. Back in the Kits, select the Qt version you just created in the Qt version field In Compilers, select the ARM versions of GCC. If they do not appear, install crossbuild-essential-armhf, then in the Compilers tab click Re-detect and then Apply to make them available for selection Dismiss the dialog with "OK": the new kit is ready Now you can choose the default kit to build and run locally, and the armhf kit for remote cross-development. I tried looking at sdktool to automate this step, and it requires a nontrivial amount of work to do it reliably, so these manual instructions will have to do. Credits This has been done as part of my work with Truelite. 2022-06-09 pdo debian sw eng Qt Creator cross-platform development in Stretch: chroot automation I wrote a tool to automate the creation and maintenance of Qt cross-build environments built from packages in Debian Stretch. It allows to: Do cross-architecture development with Qt Creator, including remote debugging on the target architecture Compile using native compilers and cross-compilers, to avoid running the compilers inside an emulator making the build slower Leverage all of Debian as development environment, using existing Debian packages for cross-build-dependencies Getting started # Creates an armhf environment under the current directory $ sudo cbqt ./armhf --create --verbose 2017-11-30 14:09:23,715 INFO armhf: Creating /home/enrico/lavori/truelite/system/cross/armhf … 2017-11-30 14:14:49,887 INFO armhf: Configuring cross-build environment # Get information about an existing chroot. # Note: the output is machine-parsable yaml $ cbqt ./armhf --info name: armhf path: ./armhf arch: armhf arch_triplet: arm-linux-gnueabihf exists: true configured: true issues: [] # Create a qmake wrapper for this environment $ sudo ./cbqt ./armhf --qmake -o /usr/local/bin/qmake-armhf # Install the build-depends you need # Note: :arch is added automatically to package names if no arch is explicitly # specified $ sudo ./cbqt ./armhf --install libqt5svg5-dev libmosquittopp-dev qtwebengine5-dev Building packages To build a package, use the qmake wrapper generated with cbqt --qmake instead of the normal qmake: $ qmake-armhf -makefile $ make arm-linux-gnueabihf-g++ … -I../armhf/usr/include/arm-linux-gnueabihf/… -I../armhf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/arm-linux-gnueabihf -o browser.o browser.cpp … /home/enrico/…/armhf/usr/bin/moc … … arm-linux-gnueabihf-g++ … -Wl,-rpath-link,/home/enrico/…/armhf/lib/arm-linux-gnueabihf -Wl,-rpath-link,/home/enrico/…/armhf/usr/lib/arm-linux-gnueabihf -Wl,-rpath-link,/home/enrico/…/armhf/usr/lib/ -o program browser.o … -L/home/enrico/…/armhf/usr/lib/arm-linux-gnueabihf … Building in Qt Creator Configure a new Kit in Qt Creator: Tools/Options, then Build & Run, then Kits, then Add Name: armhf (or anything you like) Qt version: choose the one autodetected from /usr/local/bin/qmake-armhf In Compilers, add a GCC C compiler with path arm-linux-gnueabihf-gcc, and a GCC C++ compiler with path arm-linux-gnueabihf-g++ Choose the newly created compilers in the kit Dismiss the dialog with "OK": the new kit is ready Now you can choose the default kit to build and run locally, and the armhf kit for remote cross-development. Where to get it Here! Credits This has been done as part of my work with Truelite. 2017-11-30 pdo debian eng qt-cross Qt Creator cross-platform development in Stretch: chroots My next step in creating a cross-platform Qt development environment is trying to set it up on a chroot and make it usable from Qt Creator, so that both buil-dependencies and cross-build-dependencies can be available even when they are not coinstallable. Building a chroot I built a chroot to host the armhf build-dependencies: $ sudo cdebootstrap stretch arm-linux-gnueabihf $ sudo systemd-nspawn -D arm-linux-gnueabihf # dpkg --add-architecture armhf # apt update # apt install qtbase5-dev qtbase5-dev-tools qtbase5-dev:armhf The cross-compilers need to be outside the chroot. I tried to use cross-compilers installed inside the chroot while building outside the chroot, and they fail to link at runtime, since they expect their shared libraries to be in /usr. I put this qt.conf in the chroot: [Paths] Prefix=/home/enrico/…/arm-linux-gnueabihf/usr ArchData=lib/arm-linux-gnueabihf/qt5 Binaries=lib/qt5/bin Data=share/qt5 Documentation=share/qt5/doc Examples=lib/arm-linux-gnueabihf/qt5/examples Headers=include/arm-linux-gnueabihf/qt5 HostBinaries=bin HostData=lib/arm-linux-gnueabihf/qt5 HostLibraries=lib/arm-linux-gnueabihf Imports=lib/arm-linux-gnueabihf/qt5/imports Libraries=lib/arm-linux-gnueabihf LibraryExecutables=lib/arm-linux-gnueabihf/qt5/libexec Plugins=lib/arm-linux-gnueabihf/qt5/plugins Qml2Imports=lib/arm-linux-gnueabihf/qt5/qml Settings=/etc/xdg Translations=share/qt5/translations TargetSpec=arm-linux-gnueabihf I added the custom mkspecs to the chroot: $ cd arm-linux-gnueabihf/usr/lib/arm-linux-gnueabihf/qt5/mkspecs/ $ sudo cp -r linux-g++ arm-linux-gnueabihf $ sudo vi arm-linux-gnueabihf/qmake.conf This is the content of usr/lib/arm-linux-gnueabihf/qt5/mkspecs/arm-linux-gnueabihf/qmake.conf: # # qmake configuration for arm-linux-gnueabihf # MAKEFILE_GENERATOR = UNIX CONFIG += incremental QMAKE_INCREMENTAL_STYLE = sublib include(../common/linux.conf) include(../common/gcc-base-unix.conf) include(../common/g++-unix.conf) QMAKE_RPATHLINKDIR += /home/enrico/…/arm-linux-gnueabihf/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += /home/enrico/…/arm-linux-gnueabihf/usr/lib/arm-linux-gnueabihf QMAKE_RPATHLINKDIR += /home/enrico/…/arm-linux-gnueabihf/usr/lib/ QMAKE_COMPILER = arm-linux-gnueabihf-gcc QMAKE_CC = arm-linux-gnueabihf-gcc QMAKE_LINK_C = $$QMAKE_CC QMAKE_LINK_C_SHLIB = $$QMAKE_CC QMAKE_CXX = arm-linux-gnueabihf-g++ QMAKE_LINK = $$QMAKE_CXX QMAKE_LINK_SHLIB = $$QMAKE_CXX load(qt_config) Note QMAKE_RPATHLINKDIR, which was not present in the previous post: since linking needs to happen against libraries in /home/enrico/…/arm-linux-gnueabihf/…, we need to tell the linker not to go and search in /. The extra QMAKE_RPATHLINKDIR pointing to usr/lib is a workaround for libsrtp0 installing files outside multiarch directories (#765173): # dpkg -L libsrtp0 | grep usr/lib /usr/lib /usr/lib/libsrtp.so.0.0 /usr/lib/libsrtp.so.0 (libsrtp0 is a dependency of libqt5webenginecore5) I changed the wrapper /usr/local/bin/qmake-arm-linux-gnueabihf to point to the chroot: #!/usr/bin/python3 import sys, os QT_CONFIG = "/home/enrico/…/arm-linux-gnueabihf/qt.conf" argv0 = os.path.join(os.path.dirname(sys.argv[0]), "qmake") if len(sys.argv) == 1: os.execv("/usr/bin/qmake", [argv0] + sys.argv[1:]) else: os.execv("/usr/bin/qmake", [argv0] + sys.argv[1:] + ["-qtconf", QT_CONFIG]) And it all works. Even the test application that requires QtWebEngine builds and links fine. Credits This has been done as part of my work with Truelite. 2017-11-29 pdo debian eng qt-cross Qt Creator cross-platform development in Stretch: consolidation Time to consolidate the exploration done yesterday. qmake -qtconf Looking at the work done by the Qt/KDE team I found that there is no need to rebuild qmake, as it can be configured by using the -qtconf option. The work recently done on debhelper provides a starting point that I can build on. This qtconf makes qmake use the right paths, including running rcc, moc and uic from /usr/bin/, removing the need for the dirty hack: [Paths] Prefix=/usr ArchData=lib/arm-linu'''
