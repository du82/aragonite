full_description = '''Latest posts of series Transilience Systemd containers with unittest This is part of a series of posts on ideas for an ansible-like provisioning system, implemented in Transilience. Unit testing some parts of Transilience, like the apt and systemd actions, or remote Mitogen connections, can really use a containerized system for testing. To have that, I reused my work on nspawn-runner. to build a simple and very fast system of ephemeral containers, with minimal dependencies, based on systemd-nspawn and btrfs snapshots: Setup To be able to use systemd-nspawn --ephemeral, the chroots needs to be btrfs subvolumes. If you are not running on a btrfs filesystem, you can create one to run the tests, even on a file: fallocate -l 1.5G testfile /usr/sbin/mkfs.btrfs testfile sudo mount -o loop testfile test_chroots/ I created a script to setup the test environment, here is an extract: mkdir -p test_chroots cat << EOF > "test_chroots/CACHEDIR.TAG" Signature: 8a477f597d28d172789f06886806bc55 # chroots used for testing transilience, can be regenerated with make-test-chroot EOF btrfs subvolume create test_chroots/buster eatmydata debootstrap --variant=minbase --include=python3,dbus,systemd buster test_chroots/buster CACHEDIR.TAG is a nice trick to tell backup software not to bother backing up the contents of this directory, since it can be easily regenerated. eatmydata is optional, and it speeds up debootstrap quite a bit. Running unittest with sudo Here's a simple helper to drop root as soon as possible, and regain it only when needed. Note that it needs $SUDO_UID and $SUDO_GID, that are set by sudo, to know which user to drop into: class ProcessPrivs: """ Drop root privileges and regain them only when needed """ def __init__(self): self.orig_uid, self.orig_euid, self.orig_suid = os.getresuid() self.orig_gid, self.orig_egid, self.orig_sgid = os.getresgid() if "SUDO_UID" not in os.environ: raise RuntimeError("Tests need to be run under sudo") self.user_uid = int(os.environ["SUDO_UID"]) self.user_gid = int(os.environ["SUDO_GID"]) self.dropped = False def drop(self): """ Drop root privileges """ if self.dropped: return os.setresgid(self.user_gid, self.user_gid, 0) os.setresuid(self.user_uid, self.user_uid, 0) self.dropped = True def regain(self): """ Regain root privileges """ if not self.dropped: return os.setresuid(self.orig_suid, self.orig_suid, self.user_uid) os.setresgid(self.orig_sgid, self.orig_sgid, self.user_gid) self.dropped = False @contextlib.contextmanager def root(self): """ Regain root privileges for the duration of this context manager """ if not self.dropped: yield else: self.regain() try: yield finally: self.drop() @contextlib.contextmanager def user(self): """ Drop root privileges for the duration of this context manager """ if self.dropped: yield else: self.drop() try: yield finally: self.regain() privs = ProcessPrivs() privs.drop() As soon as this module is loaded, root privileges are dropped, and can be regained for as little as possible using a handy context manager: with privs.root(): subprocess.run(["systemd-run", ...], check=True, capture_output=True) Using the chroot from test cases The infrastructure to setup and spin down ephemeral machine is relatively simple, once one has worked out the nspawn incantations: class Chroot: """ Manage an ephemeral chroot """ running_chroots: Dict[str, "Chroot"] = {} def __init__(self, name: str, chroot_dir: Optional[str] = None): self.name = name if chroot_dir is None: self.chroot_dir = self.get_chroot_dir(name) else: self.chroot_dir = chroot_dir self.machine_name = f"transilience-{uuid.uuid4()}" def start(self): """ Start nspawn on this given chroot. The systemd-nspawn command is run contained into its own unit using systemd-run """ unit_config = [ 'KillMode=mixed', 'Type=notify', 'RestartForceExitStatus=133', 'SuccessExitStatus=133', 'Slice=machine.slice', 'Delegate=yes', 'TasksMax=16384', 'WatchdogSec=3min', ] cmd = ["systemd-run"] for c in unit_config: cmd.append(f"--property={c}") cmd.extend(( "systemd-nspawn", "--quiet", "--ephemeral", f"--directory={self.chroot_dir}", f"--machine={self.machine_name}", "--boot", "--notify-ready=yes")) log.info("%s: starting machine using image %s", self.machine_name, self.chroot_dir) log.debug("%s: running %s", self.machine_name, " ".join(shlex.quote(c) for c in cmd)) with privs.root(): subprocess.run(cmd, check=True, capture_output=True) log.debug("%s: started", self.machine_name) self.running_chroots[self.machine_name] = self def stop(self): """ Stop the running ephemeral containers """ cmd = ["machinectl", "terminate", self.machine_name] log.debug("%s: running %s", self.machine_name, " ".join(shlex.quote(c) for c in cmd)) with privs.root(): subprocess.run(cmd, check=True, capture_output=True) log.debug("%s: stopped", self.machine_name) del self.running_chroots[self.machine_name] @classmethod def create(cls, chroot_name: str) -> "Chroot": """ Start an ephemeral machine from the given master chroot """ res = cls(chroot_name) res.start() return res @classmethod def get_chroot_dir(cls, chroot_name: str): """ Locate a master chroot under test_chroots/ """ chroot_dir = os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "test_chroots", chroot_name)) if not os.path.isdir(chroot_dir): raise RuntimeError(f"{chroot_dir} does not exists or is not a chroot directory") return chroot_dir # We need to use atextit, because unittest won't run # tearDown/tearDownClass/tearDownModule methods in case of KeyboardInterrupt # and we need to make sure to terminate the nspawn containers at exit @atexit.register def cleanup(): # Use a list to prevent changing running_chroots during iteration for chroot in list(Chroot.running_chroots.values()): chroot.stop() And here's a TestCase mixin that starts a containerized systems and opens a Mitogen connection to it: class ChrootTestMixin: """ Mixin to run tests over a setns connection to an ephemeral systemd-nspawn container running one of the test chroots """ chroot_name = "buster" @classmethod def setUpClass(cls): super().setUpClass() import mitogen from transilience.system import Mitogen cls.broker = mitogen.master.Broker() cls.router = mitogen.master.Router(cls.broker) cls.chroot = Chroot.create(cls.chroot_name) with privs.root(): cls.system = Mitogen( cls.chroot.name, "setns", kind="machinectl", python_path="/usr/bin/python3", container=cls.chroot.machine_name, router=cls.router) @classmethod def tearDownClass(cls): super().tearDownClass() cls.system.close() cls.broker.shutdown() cls.chroot.stop() Running tests Once the tests are set up, everything goes on as normal, except one needs to run nose2 with sudo: sudo nose2-3 Spin up time for containers is pretty fast, and the tests drop root as soon as possible, and only regain it for as little as needed. Also, dependencies for all this are minimal and available on most systems, and the setup instructions seem pretty straightforward 2021-06-30 pdo debian sw eng Building a Transilience playbook in a zipapp This is part of a series of posts on ideas for an ansible-like provisioning system, implemented in Transilience. Mitogen is a great library, but scarily complicated, and I've been wondering how hard it would be to make alternative connection methods for Transilience. Here's a wild idea: can I package a whole Transilience playbook, plus dependencies, in a zipapp, then send the zipapp to the machine to be provisioned, and run it locally? It turns out I can. Creating the zipapp This is somewhat hackish, but until I can rely on Python 3.9's improved importlib.resources module, I cannot think of a better way: def zipapp(self, target: str, interpreter=None): """ Bundle this playbook into a self-contained zipapp """ import zipapp import jinja2 import transilience if interpreter is None: interpreter = sys.executable if getattr(transilience.__loader__, "archive", None): # Recursively iterating module directories requires Python 3.9+ raise NotImplementedError("Cannot currently create a zipapp from a zipapp") with tempfile.TemporaryDirectory() as workdir: # Copy transilience shutil.copytree(os.path.dirname(__file__), os.path.join(workdir, "transilience")) # Copy jinja2 shutil.copytree(os.path.dirname(jinja2.__file__), os.path.join(workdir, "jinja2")) # Copy argv[0] as __main__.py shutil.copy(sys.argv[0], os.path.join(workdir, "__main__.py")) # Copy argv[0]/roles role_dir = os.path.join(os.path.dirname(sys.argv[0]), "roles") if os.path.isdir(role_dir): shutil.copytree(role_dir, os.path.join(workdir, "roles")) # Turn everything into a zipapp zipapp.create_archive(workdir, target, interpreter=interpreter, compressed=True) Since the zipapp contains not just the playbook, the roles, and the roles' assets, but also Transilience and Jinja2, it can run on any system that has a Python 3.7+ interpreter, and nothing else! I added it to the standard set of playbook command line options, so any Transilience playbook can turn itself into a self-contained zipapp: $ ./provision --help usage: provision [-h] [-v] [--debug] [-C] [--local LOCAL] [--ansible-to-python role | --ansible-to-ast role | --zipapp file.pyz] [...] --zipapp file.pyz bundle this playbook in a self-contained executable python zipapp Loading assets from the zipapp I had to create ZipFile varieties of some bits of infrastructure in Transilience, to load templates, files, and Ansible yaml files from zip files. You can see above a way to detect if a module is loaded from a zipfile: check if the module's __loader__ attribute has an archive attribute. Here's a Jinja2 template loader that looks into a zip: class ZipLoader(jinja2.BaseLoader): def __init__(self, archive: zipfile.ZipFile, root: str): self.zipfile = archive self.root = root def get_source(self, environment: jinja2.Environment, template: str): path = os.path.join(self.root, template) with self.zipfile.open(path, "r") as fd: source = fd.read().decode() return source, None, lambda: True I also created a FileAsset abstract interface to represent a local file, and had Role.lookup_file return an appropriate instance: def lookup_file(self, path: str) -> str: """ Resolve a pathname inside the place where the role assets are stored. Returns a pathname to the file """ if self.role_assets_zipfile is not None: return ZipFileAsset(self.role_assets_zipfile, os.path.join(self.role_assets_root, path)) else: return LocalFileAsset(os.path.join(self.role_assets_root, path)) An interesting side effect of having smarter local file accessors is that I can cache the contents of small files and transmit them to the remote host together with the other action parameters, saving a potential network round trip for each builtin.copy action that has a small source. The result The result is kind of fun: $ time ./provision --zipapp test.pyz real 0m0.203s user 0m0.174s sys 0m0.029s $ time scp test.pyz root@test: test.pyz 100% 528KB 388.9KB/s 00:01 real 0m1.576s user 0m0.010s sys 0m0.007s And on the remote: # time ./test.pyz --local=test 2021-06-29 18:05:41,546 test: [connected 0.000s] [...] 2021-06-29 18:12:31,555 test: 88 total actions in 0.00ms: 87 unchanged, 0 changed, 1 skipped, 0 failed, 0 not executed. real 0m0.979s user 0m0.783s sys 0m0.172s Compare with a Mitogen run: $ time PYTHONPATH=../transilience/ ./provision 2021-06-29 18:13:44 test: [connected 0.427s] [...] 2021-06-29 18:13:46 test: 88 total actions in 2.50s: 87 unchanged, 0 changed, 1 skipped, 0 failed, 0 not executed. real 0m2.697s user 0m0.856s sys 0m0.042s From a single test run, not a good benchmark, it's 0.203 + 1.576 + 0.979 = 2.758s with the zipapp and 2.697s with Mitogen. Even if I've been lucky, it's a similar order of magnitude. What can I use this for? This was mostly a fun hack. It could however be the basis for a Fabric-based connector, or a clusterssh-based connector, or for bundling a Transilience playbook into an installation image, or to add a provisioning script to the boot partition of a Raspberry Pi. It looks like an interesting trick to have up one's sleeve. One could even build an Ansible-based connector(!) in which a simple Ansible playbook, with no facts gathering, is used to build the zipapp, push it to remote systems and run it. That would be the wackiest way of speeding up Ansible, ever! Next: using Systemd containers with unittest, for Transilience's test suite. 2021-06-29 pdo debian sw eng Ansible conditionals in Transilience This is part of a series of posts on ideas for an ansible-like provisioning system, implemented in Transilience. I thought a lot of what I managed to do so far with Transilience would be impossible, but then here I am. How about Ansible conditionals? Those must be impossible, right? Let's give it a try. A quick recon of Ansible sources Looking into Ansible's sources, when expressions are lists of strings AND-ed together. The expressions are Jinja2 expressions that Ansible pastes into a mini-template, renders, and checks the string that comes out. A quick recon of Jinja2 Jinja2 has a convenient function (jinja2.Environment.compile_expression) that compiles a template snippet into a Python function. It can also parse a template into an AST that can be inspected in various ways. Evaluating Ansible conditionals in Python Environment.compile_expression seems to really do precisely what we need for this, straight out of the box. There is an issue with the concept of "defined": for Ansible it seems to mean "the variable is present in the template context". In Transilience instead, all variables are fields in the Role dataclass, and can be None when not set. This means that we need to remove variables that are set to None before passing the parameters to the compiled Jinjae expression: class Conditional: """ An Ansible conditional expression """ def __init__(self, engine: template.Engine, body: str): # Original unparsed expression self.body: str = body # Expression compiled to a callable self.expression: Callable = engine.env.compile_expression(body) def evaluate(self, ctx: Dict[str, Any]): ctx = {name: val for name, val in ctx.items() if val is not None} return self.expression(**ctx) Generating Python code Transilience does not only support running Ansible roles, but also converting them to Python code. I can keep this up by traversing the Jinja2 AST generating Python expressions. The code is straightforward enough that I can throw in a bit of pattern matching to make some expressions more idiomatic for Python: class Conditional: def __init__(self, engine: template.Engine, body: str): ... parser = jinja2.parser.Parser(engine.env, body, state='variable') self.jinja2_ast: nodes.Node = parser.parse_expression() def get_python_code(self) -> str: return to_python_code(self.jinja2_ast def to_python_code(node: nodes.Node) -> str: if isinstance(node, nodes.Name): if node.ctx == "load": return f"self.{node.name}" else: raise NotImplementedError(f"jinja2 Name nodes with ctx={node.ctx!r} are not supported: {node!r}") elif isinstance(node, nodes.Test): if node.name == "defined": return f"'''
