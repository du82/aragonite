["https://ensingers.com/Bill222E"]
title = "Bill Ensinger on the web"
full_description = '''The most important thing in this life is to know where you will spend eternity. The images below are the front and back of a 5 by 8 card with verses from the Bible. These verses talk about salvation according to the Christian Bible. Biblical salvation (being saved from God's wrath on unrepentant sinners) offers the hope and reality of a better life now as well as assurance of where you will spend eternity. My parents selected these verses and designed the card. They have distributed these cards on street corners in New York City and other places. God does the saving (John 6:44). A saved person will begin to obey God's commandments (John 14:15) and want to learn more about Him (Psalm 1:1-2). There are many more verses that talk about Salvation, and all too often these verses are overlooked. I believe the serious Christian should consider these verses and what they say about salvation. Salvation is only through the Messiah The Bible makes it pretty clear that salvation is only through Christ, and not through any other religious leader, profit, or supposed deity. This is clear in the first and second commandments, Acts 4:12 quoted below, and this verse: John 14:6 "Jesus saith unto him, I am the way, the truth, and the life: no man comes unto the Father, but by me." Salvation and the need for baptism? While I don't know of a verse that says presicely that you must be baptised to be saved, Acts 2:38 comes pretty close. Do we need to be baptised? I think of the man on the cross next to Christ. He certainly wasn't baptized in any sense that we would recognize as baptism, so it would seem the answer is no. But it IS certainly appropriate to be baptised after salvation. Here's what the Bible says. Peter had just been asked "What must we do to be saved?" And peter said: Acts 2:38: "Then Peter said unto them, Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Spirit." Salvation and the need for repentance Acts 2:38 places as much emphasis on baptism as it does on repentance. Repentance involves confessing our sins before God and asking Him for forgiveness. It also means turning away from our sin and living righteously.'''
