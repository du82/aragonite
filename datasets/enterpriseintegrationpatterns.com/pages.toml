title = "Invalid Message Channel - Enterprise Integration Patterns"
description = "How can a messaging receiver gracefully handle receiving a message that makes no sense?"
full_description = "The receiver should move the improper message to an Invalid Message Channel, a special channel for messages that could not be processed by their receivers. When designing a messaging system for applications to use, the administrator will need to define one or more Invalid Message Channels for the applications to use. The Invalid Message Channel will not be used for normal, successful communication, so its being cluttered with improper messages will not cause a problem. An error handler that wants to diagnose improper messages can use a receiver on the invalid channel to detect messages as they become available. Command Message, Correlation Identifier, Datatype Channel, Dead Letter Channel, Message, Message Channel, Message Sequence, Messaging, Service Activator, Messaging Gateway, JMS Request/Reply Example, .NET Request/Reply Example, Return Address You can reuse the following elements under the Creative Commons Attribution license: pattern icon, pattern name, problem and solution statements (in bold), and the sketch. Other portions are protected by copyright. Enterprise Integration PatternsThe de-facto language for designing asynchronous, distributed systems. Over 100,000 copies sold. The Software Architect Elevator Rethink the role of architects as a connecting element across organizational layers. Acquire the technical, communication, and organizational skills to succeed in this new role. Cloud Strategy Make your cloud migration a success by translating high-level goals into conscious decisions with well-understood trade-offs. Platform Strategy Platforms can boost innovation through harmonization, but they aren't easy to build. Learn from over a decade of designing and rolling out IT platforms."
