["https://enterpriseintegrationpatterns.com/DatatypeChannel.html"]
title = "Datatype Channel - Enterprise Integration Patterns"
description = "How can the application send a data item such that the receiver will know how to process it?"
full_description = "An application is using Messaging to transfer different types of data, such as different types of documents. Use a separate Datatype Channel for each data type, so that all data on a particular channel is of the same type. By using a separate Datatype Channel for each type of data, all of the messages on a given channel will contain the same type of data. The sender, knowing what type the data is, will need to select the appropriate channel to send it on. The receiver, knowing what channel the data was received on, will know what its type is. Canonical Data Model, Command Message, Format Indicator, Message Channel, Message Dispatcher, Selective Consumer, Messaging You can reuse the following elements under the Creative Commons Attribution license: pattern icon, pattern name, problem and solution statements (in bold), and the sketch. Other portions are protected by copyright. Enterprise Integration PatternsThe de-facto language for designing asynchronous, distributed systems. Over 100,000 copies sold. The Software Architect Elevator Rethink the role of architects as a connecting element across organizational layers. Acquire the technical, communication, and organizational skills to succeed in this new role. Cloud Strategy Make your cloud migration a success by translating high-level goals into conscious decisions with well-understood trade-offs. Platform Strategy Platforms can boost innovation through harmonization, but they aren't easy to build. Learn from over a decade of designing and rolling out IT platforms."
