["https://enterpriseintegrationpatterns.com/ramblings/16_patternscomponents.html"]
title = 'Are "Pattern" and "Component" Antonyms? - Enterprise Integration Patterns'
description = "Last year's OOPSLA tutorial on Enterprise Integration Patterns was quite well received"
full_description = '''Find my posts on IT strategy, enterprise architecture, and digital transformation at ArchitectElevator.com. After last year's OOPSLA my goal was to develop a messaging toolkit that allows people to run the patterns from our book and observe a live messaging system in action. Well, it took a bit longer than originally expected but I now have a kit that implements about a dozen key patterns as individual executables. These executables can be composed into messaging solutions straight from the command line or with simple batch scripts. Most components have a cute little GUI as shown in the following figure. The example domain for the messaging toolkit is a coffee shop where customers place orders that are then fulfilled by baristas. Along the way orders can be enriched, split, aggregated, resequenced etc. The diagram shows a simple example of a customer placing an order, which is split into individual order items by a Splitter. Two baristas act as Competing Consumers to process orders. A Logger displays messages on the orderCompletedChannel. The scenario can be scripted in a simple batch file: These scripts make up a nice Domain-Specific Language which is based on the vocabulary in our book. The free composability makes it interesting in fun to build larger messaging solutions from these relatively simple building blocks. Typically, when people ask me about "codifying" or "toolifying" patterns my first reaction is one of skepticism. Patterns are meant to be a human-to-human communication mechanism, not a human-to-machine mechanism. After all, I have pointed many people to the fact that a pattern is not just the piece of code in the example section. It's the context-problem-forces-solution combination that makes patterns so useful. A pattern applies most of the time, but not always. Patterns can be combined and morphed. Most patterns lead to multiple different implementation strategies. And last but not least a pattern has to be realized, i.e. mapped into a specific programming environment to be used.'''
author = "Gregor Hohpe"
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/ramblings/16_patternscomponents.html"
