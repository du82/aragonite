["https://enterpriseintegrationpatterns.com/patterns/messaging/DynamicRouter.html"]
title = "Dynamic Router - Enterprise Integration Patterns"
description = "How can you avoid the dependency of the router on all possible destinations while maintaining its efficiency?"
full_description = "How can you avoid the dependency of the router on all possible destinations while maintaining its efficiency? Use a Dynamic Router, a Router that can self-configure based on special configuration messages from participating destinations. Besides the usual input and output channels the Dynamic Router uses an additional control channel. During system start-up, each potential recipient sends a special message to the Dynamic Router on this control channel, announcing its presence and listing the conditions under which it can handle a message. The Dynamic Router stores the 'preferences' for each participant in a rule base. When a message arrives, the Dynamic Router evaluates all rules and routes the message to the recipient whose rules are fulfilled. This allows for efficient, predictive routing without the maintenance dependency of the Dynamic Router on each potential recipient. Content-Based Router, Message Filter, Message Router, Publish-Subscribe Channel, Recipient List, Routing Slip You can reuse the following elements under the Creative Commons Attribution license: pattern icon, pattern name, problem and solution statements (in bold), and the sketch. Other portions are protected by copyright. Enterprise Integration PatternsThe de-facto language for designing asynchronous, distributed systems. Over 100,000 copies sold. The Software Architect Elevator Rethink the role of architects as a connecting element across organizational layers. Acquire the technical, communication, and organizational skills to succeed in this new role. Cloud Strategy Make your cloud migration a success by translating high-level goals into conscious decisions with well-understood trade-offs. Platform Strategy Platforms can boost innovation through harmonization, but they aren't easy to build. Learn from over a decade of designing and rolling out IT platforms."
