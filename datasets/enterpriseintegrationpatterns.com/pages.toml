["https://enterpriseintegrationpatterns.com/ramblings/queues_control_flow.html"]
title = "Control Flow—The Other Half of Integration Patterns - Enterprise Integration Patterns"
description = "When describing messaging systems, it's natural to focus on data flow"
full_description = '''Find my posts on IT strategy, enterprise architecture, and digital transformation at ArchitectElevator.com. It's hard to imagine an asynchronous system without queues aka Message Channels. Queues are the core element that provides location and temporal decoupling between sender and receiver. But there is quite a bit more behind the little barrel icons: control flow, traffic shaping, back pressure, and dead letters. When Bobby and I wrote Enterprise Integration Patterns, we naturally spent most of the time on the data flow of messaging systems: how messages are generated, transformed, and routed. Some patterns, especially Endpoint Patterns such as Polling Consumer or Event-Driven Consumer clearly have a ring of control flow to it, but we never actually mention the term in the entire book (funnily there is one occurrence in Recipient List, but it's actually a verb and object: "In order for the Recipient List to control flow of information"). The term gets a few mentions in the blog, although we conclude that "Message-oriented API's steer towards a data flow architecture". So, it's time to make control flow a first-class citizen. Like so many terms, Control Flow is also an overloaded term. In most imperative programming languages, control flow relates to branching and loop statements. That control flow also exists in distributed systems, where multiple entities execute local control flows. For example, a recipient may be in a loop waiting for data whereas a sender may send a message whenever a user clicks a button. Those control flows assume linearity, meaning one thing happens after another: an if statement determines which branch will be executed, but it's only one or the other (let's ignore speculative execution at the CPU level). When designing asynchronous systems, we are interested in how these local control flows relate to each other. For example, when the user pushes a button and the sender sends a message, where does that message stay until the receiver's loop gets around to asking for a message? So, we are looking at the coordination across these local entities that determines the flow of messages:'''
author = "Gregor Hohpe"
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/ramblings/queues_control_flow.html"
