["https://enterpriseintegrationpatterns.com/patterns/conversation"]
title = "Overview - Enterprise Integration Patterns 2"
description = "Enterprise Integration Patterns"
full_description = "Asynchronous Messaging is a great way for distributed systems to communicate while maintaining loose coupling. Sending a single message isn't always enough for a meaningful exchange, though: a request expects a response; a certificate exchange may be needed for initial authentication; an order message is supposed to lead to a payment message, and if something goes wrong, additional messages may be needed to handle or correct errors. In these situations, participants engage in Conversations, an exchange of related messages. Examples of conversations occur at many levels: traditional web services are orchestrated into larger services, REST services provide referrals or use HATEOAS to trigger subsequent interactions, low-level networking protocols discover services. Conversations also occur in real world: coworkers schedule a suitable meeting time by exchanging their availability, vendors issue offers to be followed by orders, shipments, and payments. Designing robust conversations is no simple task, though: lost messages, participants' state getting out of sync, timeouts, and lots of other annoying stuff can happen in distributed systems that communicate over unreliable networks. Developers may have a 1000-page TCP/IP tome on the shelf, but are quietly happy that someone else already figured this out for them. Conversations quickly sneak up on developers, though, even when things start out pretty simple: a basic Asynchronous Request-Response interaction may foresee re-sending the request if no response is received within a specific time window. Doing so may result in a duplicate response being received if the original response was simply delayed, forcing the requestor to detect and ignore duplicate responses. The requestor likely also shouldn't send indefinite retry messages as this may overburden the system. Quickly the simple sending of a message turned up a number of considerations that govern how multiple messages can be exchanged: we need to decide the rules of the conversation."
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/patterns/conversation"
tags = ["between", "comparison:", "contents", "conversation", "conversations", "coupled", "eai", "eai patterns", "enterprise", "enterprise integration"]
language = "en"
