["https://enterpriseintegrationpatterns.com/MessageSelector.html"]
title = "Selective Consumer - Enterprise Integration Patterns"
description = "How can a message consumer select which messages it wishes to receive?"
full_description = "An application is using Messaging. It consumes Messages from a Message Channel, but it does not necessarily want to consume all of the messages on that channel, just some of them. Make the consumer a Selective Consumer, one that filteres the messages delivered by its channel so that it only receives the ones that match its criteria. When multiple Selective Consumers are used with a Point-to-Point Channel, they effectively become Competing Consumers that are also selective. If two consumer’s criteria overlap, and a message’s selection value meets both of their criteria, either consumer can consume the message. Consumers should be designed to ensure that at least one of them is eligable to consume every valid selection value. Otherwise, a message with an unmatched selection value will never be consumed and will clutter the channel forever (or at least until Message Expiration occurrs). When multiple Selective Consumers are used with a Publish-Subscribe Channel, each message will be delivered to each subscriber, but a subscriber will simply ignore its copy of a message that does not fit its criteria. Once a consumer decides to ignore a message, the messaging system can discard the message since it has been successfully delivered and will never be consumed. A messaging system can optimize this process by not even delivering a message it knows the consumer will ignore, thereby decreasing the number of copies of a message that must be produced and transmitted. This behavior of discarding ignored messages is independent of whatever Guaranteed Delivery, Durable Subscriber, and/or Message Expiration settings are used. Selective Consumers make a single channel act like multiple Datatype Channels. If different message types have distinct selection values, each consumer that is specialized for a particular type will only receive messages of that type. This approach facilitates sending many message types using a small number of channels, which can be beneficial in an enterprise that requires more channels than their messaging system can support."
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/MessageSelector.html"
