["https://enterpriseintegrationpatterns.com/patterns/messaging/DocumentMessage.html"]
title = "Document Message - Enterprise Integration Patterns"
description = "How can messaging be used to transfer data between applications?"
full_description = "An application would like to transfer data to another application. It could do so using File Transfer or Shared Database, but those approaches have shortcomings. The transfer might work better using Messaging. Whereas a Command Message tells the receiver to invoke certain behavior, a Document Message just passes data and lets the receiver decide what, if anything, to do with the data. The data is a single unit of data, a single object or data structure which may decompose into smaller units. Document Messages can seem very much like Event Messages; the main difference is a matter of timing and content. The important part of a Document Message is its content, the document. Successfully transferring the document is important; the timing of when it is sent and received is less important. Guaranteed Delivery may be a consideration; Message Expiration probably is not. Command Message, Remote Procedure Invocation, Event Message, File Transfer, Guaranteed Delivery, Message, Message Expiration, Messaging, Point-to-Point Channel, Publish-Subscribe Channel, Request-Reply, Shared Database You can reuse the following elements under the Creative Commons Attribution license: pattern icon, pattern name, problem and solution statements (in bold), and the sketch. Other portions are protected by copyright. Enterprise Integration PatternsThe de-facto language for designing asynchronous, distributed systems. Over 100,000 copies sold. The Software Architect Elevator Rethink the role of architects as a connecting element across organizational layers. Acquire the technical, communication, and organizational skills to succeed in this new role. Cloud Strategy Make your cloud migration a success by translating high-level goals into conscious decisions with well-understood trade-offs. Platform Strategy Platforms can boost innovation through harmonization, but they aren't easy to build. Learn from over a decade of designing and rolling out IT platforms."
