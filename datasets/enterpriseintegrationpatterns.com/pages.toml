["https://enterpriseintegrationpatterns.com/CommandMessage.html"]
title = "Command Message - Enterprise Integration Patterns"
description = "How can messaging be used to invoke a procedure in another application?"
full_description = "An application needs to invoke functionality provided by other applications. It would typically use Remote Procedure Invocation, but would like to take advantage of the benefits of using Messaging. There is no specific message type for commands; a Command Message is simply a regular message that happens to contain a command. In JMS, the command message could be any type of message; examples include an ObjectMessage containing a Serializable command object, a TextMessage containing the command in XML form, etc. In .NET, a command message is a Message with a command stored in it. A Simple Object Access Protocol (SOAP) request is a command message. You can reuse the following elements under the Creative Commons Attribution license: pattern icon, pattern name, problem and solution statements (in bold), and the sketch. Other portions are protected by copyright. Enterprise Integration PatternsThe de-facto language for designing asynchronous, distributed systems. Over 100,000 copies sold. The Software Architect Elevator Rethink the role of architects as a connecting element across organizational layers. Acquire the technical, communication, and organizational skills to succeed in this new role. Cloud Strategy Make your cloud migration a success by translating high-level goals into conscious decisions with well-understood trade-offs. Platform Strategy Platforms can boost innovation through harmonization, but they aren't easy to build. Learn from over a decade of designing and rolling out IT platforms."
