["https://enterpriseintegrationpatterns.com/MessageExpiration.html"]
title = "Message Expiration - Enterprise Integration Patterns"
description = "How can a sender indicate when a message should be considered stale and thus shouldn’t be processed?"
full_description = "My application is using Messaging. If a Message’s data or request is not received by a certain time, it is useless and should be ignored. How can a sender indicate when a message should be considered stale and thus shouldn’t be processed? Once the time for which a message is viable passes, and the message still has not been consumed, then the message will expire. The messaging system’s consumers will ignore an expired message; they treat the message as if it where never sent in the first place. Most messaging system implementations reroute expired messages to the Dead Letter Channel, while others simply discard expired messages; this may be configurable. A Message Expiration is like the expiration date on a carton of milk—after that date, you’re not supposed to drink the milk. If the expiration date passes while the milk is on the grocery store shelf, the grocer is supposed to pull the milk off the shelf and not sell it. If you end up with a carton on milk that expires, you’re supposed to pour it out. Likewise, when a message expires, the messaging system should no longer deliver it. If a receiver nevertheless receives a message but cannot process it before the expiration, the receiver should throw away the message. Azure Service Bus implements Message Expiration both at the entity and the message level. Messages expire at the earliest of the Message Expiration set in the message or the entity, e.g. the queue or topic. Expired messages are sent to a Dead Letter Channel if one is specified. Messages that are locked for delivery (see Transactional Client) won't expire as long as they are locked. Amazon EventBridge uses a built-in Message Expiration that can trigger on elapsed time or the number of failed delivery attempts, whichever comes first. The default values are 24 hours and 185 retries, but can be customized in the console or via the command-line by using the RetryPolicy setting of the EventBridge target: Asynchronous targets like SQS, SNS, or CloudWatch logs rarely trigger the Message Expiration because they can consume messages at the same rate as they arrive on the event bus. However, Message Expiration is an important setting when using rate-limited targets like API Destinations (HTTP calls)."
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/MessageExpiration.html"
