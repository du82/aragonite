["https://enterpriseintegrationpatterns.com/downloads.html"]
title = "Tools & Downloads - Enterprise Integration Patterns"
full_description = '''Matthew Oskowis (contact) created a Visio stencil that contains 51 integration pattern icons as Visio shapes. Each shape includes the solution text for the corresponding pattern. This stencil is invaluable when drawing out solutions based on the notation defined in the book. The stencil is available in Visio 2002 and a Visio 5 versions. If soneone if willing to port these to a newer version of visio, let me know. Gunnar Peterson created a stencil for Omnigraffle. According to the site it has over 18000 downloads! You can download most of my articles from the Articles page and many of my presentations from the Talks page. You may also want to check out my blog. Pearson has generously made the Introduction, Chapter 2 ("Integration Styles") and Chapter 3 ("Messaging Systems") of our book available for download. If you like what you see, please consider buying the book. Chapter 2: "Integration Styles" PDF Download from Pearson Education (1073 KB) Chapter 3: "Messaging Systems" PDF (614 KB) For my ACM Middleware and OOPSLA tutorials I used a messaging toolkit that implements many of the basic patterns in our book. The toolkit allows users to compose solutions from the basic patterns and observe them in action. I developed the toolkit in C#, mostly because I am more familiar with the .NET user interface libraries. The kit is likely not 100% robust yet, but I am looking for feedback on the usefulness of the concept. The individual components can be run directly from the DOS command line or from a batch script. These scripts have a very nice, Domain-specific language feel to them. These example implementations are not the patterns, but only a consistent example pattern implementations. Patterns comprise intent, forces, context etc. and are generally technology independent. For this toolkit I chose a specific implementation technology and created a collection of examples of the patterns. Read [more on the relationship between the toolkit and the patterns] 1) Extract the ZIP file, preserving the folder structure. 2) Make sure your Windows Message Queuing service is active (see reference Sheet for details). 3) Run "Exercise1a.bat" from the "Exercises" folder. 4) Select values from the drop-down lists in the Customer window and click ' Send Order'. 5) Follow the Tutorial Presentation for more complex examples and exercises.'''
