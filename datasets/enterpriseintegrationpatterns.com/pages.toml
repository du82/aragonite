["https://enterpriseintegrationpatterns.com/MessagingEndpointsIntro.html"]
title = "Introduction to Messaging Endpoints - Enterprise Integration Patterns"
description = "In Introduction to Messaging Systems, we discussed Message Endpoint. This is how an application connects to a messaging system so that it can send and receive messages. As an application programmer, when you program to a messaging API such as JMS or the System.Messaging namespace, you’re developing endpoint code. If you are using a commercial middleware package, most of this coding is already done for you using the libraries and tools provided by the vendor."
full_description = "In Introduction to Messaging Systems, we discussed Message Endpoint. This is how an application connects to a messaging system so that it can send and receive messages. As an application programmer, when you program to a messaging API such as JMS or the System.Messaging namespace, you’re developing endpoint code. If you are using a commercial middleware package, most of this coding is already done for you using the libraries and tools provided by the vendor. Some endpoint patterns apply to both senders and receivers. They concern how the application relates to the messaging system in general. Encapsulate the messaging code — In general, an application should not be aware that it is using Messaging to integrate with other applications. Most of the application’s code should be written without messaging in mind. At the points where the application integrate with others, there should be a thin layer of code that performs the application’s part of the integration. When the integration is implemented with messaging, that thin layer of code that attches the application to the messaging system is a Messaging Gateway. Data translation — It’s great when the internal data representation the sender and receiver applications use are the same, and when the message format uses that same representation as well. However, this is often not the case. Either the sender and receiver disagree on data format, or the messages use a different format (usually to support other senders and receivers). In this situation, use a Messaging Mapper to convert data between the application’s format and the message’s format. Externally-controlled transactions — Messaging systems use transactions internally; externally, by default, each send or receive method call runs in its own transaction. However, message producers and consumers have the option of using a Transactional Client to control these transactions externally, which is useful when you need to batch together multiple messages or to coordinate messaging with other transactional services."
