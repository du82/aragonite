["https://enterpriseintegrationpatterns.com/ramblings/eventdriven_coupling.html"]
title = "Event-driven = Loosely coupled? Not so fast! - Enterprise Integration Patterns"
description = "Event-driven architectures (EDAs) are frequently pitched as loosely coupled, when compared to other forms of integration"
full_description = '''Find my posts on IT strategy, enterprise architecture, and digital transformation at ArchitectElevator.com. Event-driven architectures (EDA) are seeing a marked renaissance, especially in the context of serverless applications. That's great, but it's also not a new topic by any means. Besides my EDA presentation at Distributed Event-Based Systems (DEBS) from 2007, you might recall my ambitious plans to write an EIP volume on Event Patterns about a decade ago, right after Conversation Patterns, ahem. As EDA isn't a new topic, it behooves us to not be caught celebrating our new discovery without acknowledging past challenges and understanding architecture trade-offs. One such trade-off is coupling. "Decoupled" is a frequently cited benefit of EDAs, routinely showing up in many definitions of EDA: "Decoupled systems that run in response to events". The assumption behind such statements is that "decoupled" is a simple and universally positive thing. But architects know that life isn't that simple. Coupling is a sliding scale and has many dimensions, so perhaps there's more behind events and coupling! Before we can discuss the magical properties of events, we first want to gain clarity on whether events are something entirely unique, or whether the benefits commonly associated with events exist more broadly. "My chicken laid an egg" is mighty interesting for a person who's only ever seen a chicken but less so for people who know about birds in general (apologies for my poor attempt at making a non-car analogy). Events are commonly described as a notification of a change in state, or something that took place. Such notifications must be conveyed to other systems, and the natural way to do so is via a message. Whereas some narratives contrast events with messages, EIP takes a clear stance on the relationship between events and messages (Akka and the reactive manifesto appear to agree): EIP underlines this is-a relationship by calling events Event Message. In hindsight, this naming sets an appropriate context. As Eric Evans of DDD fame pointed out in a recent conversation, an event could be something different depending on the domain. In the domain of integration, it denotes a message. The Message Construction Introduction clarifies the distinction between the interaction style and message semantics (there are actually quite a few hidden gems in these introductions):'''
author = "Gregor Hohpe"
year_published = 2025
clearnet = "https://enterpriseintegrationpatterns.com/ramblings/eventdriven_coupling.html"
