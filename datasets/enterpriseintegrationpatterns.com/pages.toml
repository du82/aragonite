["https://enterpriseintegrationpatterns.com/articles.html"]
title = "Articles - Enterprise Integration Patterns"
description = "I've been a steady contributor to IEEE Software over the years. Find all published articles on this page."
full_description = "I like to write and speak about EAI, SOA, Web Services, Agile Development, and Patterns. This page lists my white papers and articles. Please check out the Links section for interesting works by other authors. If you find any of these articles useful, feel free to contact me directly. A Decade of Enterprise Integration Patterns [Download PDF from IEEE Explore] IEEE Software Magazine January/February 2016 A little over a decade after EIP was published, Bobby and I sat down with Cesare Pautasso and Olaf Zimmermann to discuss how integration platforms evolved, why the patterns remained relevant, and what we would do differently today. 20 Years of Patterns' Impact [Download PDF from IEEE Explore] IEEE Software Magazine November/December 2013 This article under the Impacts column of IEEE Software Magazine celebrates 20 years of software patterns. IEEE Software advisory board members teamed up with members of the Hillside Group, a nonprofit organization that promotes the use of patterns and pattern languages, to reflect on the state of the practice and impact of patterns. Design Patterns have enjoyed enormous popularity in the software community and have become somewhat of a fad. This can make it challenging to distinguish patterns that convey new knowledge from recipes or tutorials that have been cast into patterns form. This article examines the role patterns play in the adoption of new technologies and architectural styles. In particular it describes why the shift to service-oriented architectures requires us to discover, document, and share new patterns. Communicating inside a single program is trivial: one method calls another, the result comes back, and the calling method continues. If anything goes wrong, an exception is thrown. If the program aborts altogether, both caller and callee share the same fate, making the interaction an all-or-nothing affair. In the land of loosely coupled distributed systems, things are a little more complicated. Messages are sent, correlated, lost, retried, timed out. Soon we are looking at a full fledged conversation between multiple systems."
