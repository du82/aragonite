["https://enterpriseintegrationpatterns.com/docs/agileEAI.html"]
title = "Agile EAI - Enterprise Integration Patterns"
full_description = '''Enterprise Application Integration (EAI) is a top priority in many enterprises. Requirements for improved customer service or self-service, rapidly changing business environments and support for mergers and acquisitions are major drivers for increased integration between "stovepipe" systems. However, despite increasingly sophisticated EAI suites, enterprise integration remains difficult. Technical, business and political challenges require EAI implementations to be carefully planned, but adaptable to inevitable change. The apparent dichotomy between careful planning and the ability to absorb changes has been the subject of much discussion in the world of application development. In the past years, a new set of development methods referred to as "Agile Methods" has garnered a lot of attention. Agile Methods are founded on the realization that long-term predictive planning is not appropriate for software development efforts supporting today's business environments. These new methods combine disciplined development methods with the ability to absorb change throughout the development process. This article examines how the notion of agile software development can benefit integration projects. It examines four best practices proposed by Agile Methods and their applicability in the EAI world. Enterprise integration efforts are as vital to today's enterprises as they are difficult. Enterprise integration by definition has to deal with multiple applications running on multiple platforms in different locations. Current EAI suites offer good solutions to multi-platform, multi-language integration and provide pre-built adapters to most common packaged business applications. However, it turns out that the technical infrastructure presents only a small portion of the EAI complexities. The true challenges of EAI implementations span far across business and technical issues. Enterprise integration requires a significant shift in corporate politics. Business applications generally focus on a specific functional area, such as Customer Relationship Management (CRM), Billing, Finance, etc. In most instances, the business and IT groups are organized along the same functional areas. Successful enterprise integration requires communication and sharing of responsibilities across units. Application groups no longer control a specific application because the application is now part of an overall flow of integrated applications and services.'''
year_published = 2025
