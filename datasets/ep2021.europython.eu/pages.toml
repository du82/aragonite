title = "Call for Proposals (CFP) — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = "For the online EuroPython 2021 we're looking for proposals on every aspect of Python: programming from novice to advanced levels, applications and frameworks, or how you have been involved in introducing Python into your organization. EuroPython is a community conference and we are eager to hear about your experience. Please also forward this Call for Proposals to anyone that you feel may be interested. The CFP will open on Monday, April 26. Last year, we ran a second CFP after we added more slots for the Americas, India/Asian/Pacific time zones. This year we are planning on adding these time slots right off the bat so hopefully a second CfP will not be required. Once the CfP is open, descriptions of your submission will need to include sufficient information for reviewers to judge the nature and significance of the topic. A typical submission should be around 200-300 words, please provide as many details as possible. The Call for Proposals has ended. Conference Structure This is our conference structure for the online EuroPython 2021 taking place from Jul 26 to Aug 1, 2021. Monday & Tuesday: training sessions and workshops Wednesday to Friday: keynotes, talks, lightning talks, poster session Saturday & Sunday: code sprints / hackathons Let’s make this an engaging event for everyone Even though we're running an online event, our aim is to make the conference as engaging as possible. We will provide ways for direct interaction with the speakers after their talk in separate virtual rooms and additionally a chat system for asynchronous interaction. The conference system will also allow live polls and text or audio/video based Q&A sessions, so please consider this when preparing your sessions and add any polls you’d like to run in the submission notes section (“Additional information for talk reviewers”). The conference will be held between 09:00 CEST and 20:00 CEST on the three conference days. We will try to schedule talks based on location and timezone of the speaker. Please indicate your timezone in submission notes. Presenting at EuroPython We will accept a broad range of presentations, from reports on academic and commercial projects to case studies. As long as the presentation is interesting and potentially useful to the Python community, it will be considered for inclusion in the program. Can you show something new and useful? Can you show the attendees how to use a module? Explore a Python language feature? Package an application? If so, please consider submitting a talk. There are multiple kinds of contributions that you can present at EuroPython: Regular Talk These are standard “talks with slides”, allocated in slots of 30 minutes 45 minutes The Q&A session, if present, is included in the time slot. 3–5 Minutes for Q&A is a good practice. Please choose a time slot you see most suitable to keep your presentation compact (so the audience can follow it without getting bored). We are looking for an approx. distribution of expertise (Python or domain expertise): 30% Beginners 30% Intermediate 40% Advanced Training sessions / Workshops Hand-on, deep-dive into a subject with all details. Training attendees are encouraged to actively follow the training on their PCs/laptops. These sessions are approx. 3 hours long, with breaks. We will run these using virtual rooms, we'll make available during the training-day days. Room capacity for the training rooms is approx. 100 seats. Posters Posters are a graphical way to describe a project or a technology; posters will be online, can be read at any time by participants, and can be discussed with their authors during the poster session. We are planning to collect all posters on a gallery page, together with PDF versions to read during the event. The speaker will then be available during the poster session to answer questions and present more details using screen sharing. Helpdesk / Panels / Interactive We will run these using virtual rooms, we'll make it available during the conference days. Lightning Talks A lightning talk (LT) is a short presentation which must not be longer than five minutes. LTs will not proposed via the CFP, but instead collected closer to the event using a separate form or Google sheet - similar to how we run this at the in-person conference (see here). Sprints For submitting sprints, please check our sprints page. Tag Your Submissions Please tag your submissions, these tags will guide us to put your submission close to those with similar topics. Tags are provided, just select up to five tags for your submission. Speaker Mentorship Program In the EuroPython community, we emphasize the importance of diversity and inclusion. We also encourage and support potential first-time speakers. To help us achieve the goal, we will have the Speaker Mentorship program for EuroPython 2021. We are looking for mentors and mentees of the Speaker Mentorship Program of EuroPython 2021. Applications will remain open until April 30, 2021 (Friday). The mentorship program can be summerize into two types of activities: One to One Mentorship Program A mentee from the underrepresented or marginalised group in the tech industry will be matched with an experienced speaker. Webinar Workshops Ask Me Anything about CFP workshop - 29th April 2021 (Thursday): We encourage anyone who has no or less experience submitting to EuroPython's CFP to join and ask questions. Questions can be range from talk ideas, what makes a good proposal to what is the selection process of the talk. Recording of the session can be found here. First Time Speaker Workshop - 24th June 2021 (Thursday): EuroPython will provide a speaker training session to all selected speakers regarding how to set up the technology to present at EuroPython, however, we would like to give the first time speaker more support about how to prepare their talk and what to expect to give a talk live at EuroPython. Recording of the session can be found here. Mentors To become a Mentor you need to fill in the application form here: Fill in your application form (application now closed, if you want to help in the panel session of the First Time Speaker Workshop please contact Program WG Helpdesk) We expect mentors to have past speaking experience at conferences similar to EuroPython. For mentors who took on a mentee, you are expected to provide 4 one hour sessions with your mentee to: Prepare their CFP submission Review their CFP before submission If the mentee is selected, help them prepare the talk. If the mentee is not selected, help them submit to another meetup/ conference. Help mentee to rehearse for their talk You will also be invited to join the panel of the Webinar Workshops Mentee If you are from the underrepresented or marginalised group in the tech industry and have no prior speaking experience but would like to submit to EuroPython 2021, please fill in the form here: Fill in your application form (application now closed) We assigned mentors to mentees on a first come first serve basis. If you are assigned a mentor, you will be notified before 2nd May 2021. Data Science @ EuroPython 2021 In recent years, data science has become a very important part of the Python's eco system. EuroPython has been dedicated to showcasing Python's use in data science for many years. As usual there will be a Data Science track at the online conference. Please submit your papers for the Data Science Track through the EuroPython form. Any suitable (i.e. data science, AI and analytics) submission will be considered for the Data Science Track. Given that we usually get quite a few submissions for the track, it's likely that we'll run the EuroPython 2021 Data Science Track on two days. More information will follow. Discounts for Content Contributors Speakers and Poster Presenters will receive a 100% discount coupon for the online conference ticket. Trainers will receive a 100% discount coupon for a combined ticket to recognize the extra work needed in preparing a tutorial. We highly recommend you invest the saved money in a webcam/headset. More information about recommended streaming equipment will be available soon. Please note that we only give out one coupon per speaker/trainer, even if a speaker/trainer in some cases gives more than one talk/tutorial. In case you have already purchased a ticket for the conference before knowing whether you have been accepted as a speaker or trainer and thus cannot use the discount coupon, we can refund you the corresponding amount after the conference upon request. Please provide us with your order, invoice and ticket numbers by sending them to our refunds@europython.eu email address so we can issue you the refund. Refund coupons which are not used and speaker refunds for already bought tickets which are not requested until one week after the conference (August 8, 2021), will be put to good use and automatically go into the financial aid budget for next year's conference. Topics and Goals Suggested topics for EuroPython presentations include, but are not limited to: Core Python Python libraries and extensions Python 2 to 3 migration Data Science Artificial Intelligence Machine Learning Databases Documentation Frameworks Game Programming Hardware (Sensors, RaspberryPi, Gadgets,…) Network Programming Open Source Python projects Packaging Programming Tools Project Best Practices Embedding and Extending Education, Science and Math Community Ethics (related to Programming) Web-based Systems Use Cases API GUI Programming Testing Failures and Mistakes Alternative Python implementations: e.g. Jython, IronPython, PyPy, and Stackless Presentation goals are usually some of the following: Introduce the audience to a new topic Introduce the audience to new developments on a well-known topic Show the audience real-world usage scenarios for a specific topic (case study) Dig into advanced and relatively unknown details on a topic Compare different solutions available on the market for a topic Language for Talks Talks should be held in English. Technical Requirements for Online Presentation Since the event will be run live, we ask speakers to make sure they have the following equipment ready on the conference days: PC / notebook Good Internet connectivity Headset Webcam Conference app installed (available for macOS, Linux, Windows; details will follow) Because we’re using networks, we’d also like to ask for a few backup setups: Make sure you can use mobile Internet as backup Send in a PDF with the talk slides, if possible Chromium-based browser to use as a fallback streaming solution If you feel uncomfortable with giving a live talk via webcam, you can also pre-record the talk and then answer questions in the live session. No worries: we will run prep sessions with all speakers to make sure that your setups work correctly. Submission with Multiple Speakers Please see the FAQ: How can I add another speaker to my proposal? Inappropriate Language and Imagery Please consider that EuroPython is a conference with an audience from a broad geographical area which spans countries and regions with vastly different cultures. What might be considered a “funny, inoffensive joke” in a region might be really offensive (if not even unlawful) in another. If you want to add humor, references and images to your talk, avoid any choice that might be offensive to a group which is different from yours, and pay attention to our EuroPython Code of Conduct. Community Based Talk Voting Attendees who have bought a ticket in time for the Talk Voting period gain the right to vote for talks submitted during the Call For Proposals. Please note, sprints-only tickets holders are not eligible for talk voting, After the talk voting phase, the EuroPython Program Workgroup (WG) will use the votes to select the talks and build a schedule. The talk voting is a good and strong indicator what attendees are interested to see. Submissions are also selected based on editorial criteria to e.g. increase diversity, giving a chance to less mainstream topics as well as avoiding too much of the same topic. In general, the Program WG will try to give as many speakers a chance to talk as possible. If speakers have submitted multiple talks, the one with the highest rating will most likely get selected. Waiting List Some speakers cannot make it to the conference on short notice and we need a replace. Once we receive a cancellation we get a suitable replacement talk from the waiting list, reconfirming with the speaker. We replace talks until the day before the conference starts. You can cancel your waiting list participation any time if you feel it's not enough time left to prepare your presentation properly. As a thank-you for the patience speakers on the waiting list receive a contributor discount coupon as well. Release agreement for submissions All submissions will be made public during the community talk voting, to allow all registrants to discuss the proposals. After finalizing the schedule, talks that are not accepted will be removed from the public website. Accepted submissions will stay online for the foreseeable future. We also ask all speakers to: accept the video recording of their presentation upload their talk materials to the EuroPython website accept the EuroPython Speaker Release Agreement which allows the EPS to make the talk recordings and uploaded materials available under a CC BY-NC-SA license To simplify the organization, we ask all speakers to accept the video recording and publishing of their session. All talks will be recorded. Talk slides will be made available on the EuroPython website. Talk video recordings will be uploaded to the EuroPython YouTube channel and archived on archive.org. For more privacy related information, please consult our privacy policy. Contact For further questions, feel free to contact our Program WG Helpdesk."
