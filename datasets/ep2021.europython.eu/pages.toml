["https://ep2021.europython.eu/events/django-girls"]
title = "Django Girls Workshop @ EuroPython — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = "If you are a woman and want to learn how to make websites, we have good news for you: we are holding a workshop for beginners! We are part of Europython 2021 and we are bringing the world together, from the safety of our homes, with a common goal: learn how to program! You do not need a EuroPython conference/combined ticket to join! It will take place on Monday, the 26th of July 2021, online!! We want you to stay at home and be safe, but this doesn't mean that we can't have fun and learn! We will have a full day online workshop were you will learn to build a website! We believe the IT industry will greatly benefit from bringing more women into technology. We want to give you an opportunity to learn how to program and become one of us – women programmers! Workshops are free of charge. Don't wait too long: fill in your application now! What to expect During the workshop you will work through a tutorial in a small group of three attendees and one coach. Our coaches are software developers who contribute their time, knowledge and energy for you and Django Girls. We'll be following the Django Girls tutorial - an awesome tutorial that leads you through building your own blog from scratch! The workshop tutorial has been translated into different languages, for sure you will find one for you. Our coaches speak English and one or two other languages too. All you need is a working laptop, and we'll help you with the rest. Being our attendee, you will: take part in our one day workshop, learning how to program your own website from scratch. get to know something about programming and internet technologies. meet great people and have loads of fun :) Workshop Schedule We will start at 09:00 CEST and we will finish at 16:30 CEST. Details of the schedule will be posted here shortly! Apply for the workshop! If you are a woman and have a laptop and access to the internet, you can apply for our event! You don't need to know any technical stuff – our workshop is for people who are new to programming. We are trans-inclusive and welcome applications from all women. As a workshop attendee you will: attend a one-day Django workshop during which you will create your first website make friend and have fun from the safey of your own home! Django Girls is dedicated to providing a harassment-free workshop experience for everyone, regardless of age, gender, sexual orientation, disability, physical appearance, body size, race, or religion. Every participant needs to follow the Code of Conduct. Applications are now open! Application process closes on Sunday the 25th of July and you'll be informed as soon as we receive your application! Fill in your application form FAQ Do I need to know anything about websites or programming? No! Workshops are for beginners. You don’t need to know anything about it. However, if you have a little bit of technical knowledge (i.e. you know what HTML or CSS are) you still can apply! Do I need to have something installed on my laptop? It would be helpful to have discord and zoom installed before workshops, we will send you an email with installation details. Installation of python and django can take place durin, the workshop. We will make sure that one of our coaches will help you out with this task. I am not living in Europe, can I attend? Of course! We are part of Europython 2021 which will be online, so you can attend from anywhere in the world! If you have no troubles with speaking and understanding English - you should apply. We will try our best to find a coach that can assist you. We are willing to help you! Should I use my own laptop? Yes. We have no hardware, so we expect you to have your computer with you. It is also important for us that you will take home everything you’ll write and create during workshops. Workshop coaches We can't run this workshop without coaches! A coach will be assigned to each group of 3 attendees. Their job is to support and encourage their team as they work through the DjangoGirls tutorial at their own pace. You'll have the extremely fun and rewarding experience of helping your team take their first steps in Python and Django. If you have been a Django Girls coach before and you'd like to apply to be a coach for us this time, please contact us at program@europython.eu Django Girls This workshop is a part of bigger initiative: Django Girls. It is a non-profit organization and events are organized by volunteers in different places of the world. To see the source for the program find us on Github: github.com/DjangoGirls. If you want to bring Django Girls to your city, drop us a line"
author = "EuroPython"
