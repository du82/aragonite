title = "Program / Events — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = '''Online Conference Structure This is the overall structure for the conference from Jul 26 to Aug 1: Monday & Tuesday, Jul 26-27: Tutorials Wednesday–Friday, Jul 28–30: Conference talks, keynotes & posters Saturday & Sunday, Jul 31-Aug 1: Sprints This year's conference will be our second online conference and it will have a more traditional schedule. We will have training days followed by a the three-day main conference packed with talks sessions, keynotes, lightning talks just like the in-person event. The conference ticket will grant you access to everything we have on offer during the main conference days while the combined ticket will give you access to both the conference and the tutorials. Attending the sprints is for free. But you still need to "purchase" the free sprint ticket to gain access. We ask you to do this so that we can have an idea of how many people will join the spints and what kind of software licenses, infrastructure etc. we will need for that. Please see our registration page for full details. Sessions We will have several exciting sessions waiting for you, including: keynotes talks posters interactive sessions panels help desks lightning talks sprints etc. To get a feel for what the schedule might look like, you can have a look at the programs of past EuroPython editions.'''
