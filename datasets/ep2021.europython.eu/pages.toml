["https://ep2021.europython.eu/events/beginners-day"]
title = "Beginners' Day run by HumbleData — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = "Learn Python for data science at home in this one day remote bootcamp Would you like to learn to code but don’t know where to start? Taking your first steps in programming can seem like an impossible task so we’ve decided to put on a workshop to show beginners how it can be done and share our passion for the world of data science! “We want our community to be more diverse: whoever you are, and whatever your background, we welcome you.” – Python Software Foundation’s Diversity Statement We invite all beginners, especially those from underrepresented groups in data to apply to join us on Tuesday 27th July 2021 at the Silly-Walk track for the EuroPython Beginners' Day. In this one day online workshop you will learn the basics of programming in Python, as well as how to use tools such as Jupyter Notebook to analyse data. You will be learning in small groups, each with an assigned mentor to guide you through the workshop materials and answer your questions. This will all be facilitated online through the wonders of modern technology. You can expect plenty of exercises, quizzes and games, and inspiring talks from those who were once in your shoes. Key details as follows: When? Tuesday 27th July 2021 at 9:30am - 4:30pm CEST. Where? What do I need to bring? Online! You will need a computer with reliable internet access. We also require all our attendees (mentors included) to be participants of EuroPython 2021. Please make sure you get a ticket in advance, if you require financial aid, please apply here before 19th July 2021. Please feel free to get in touch if you have questions or need further assistance. What do I need to know? If you have zero programming experience, this workshop is made for you! If you already have some experience but are new to Python, we’ve got you covered too – the materials are designed for attendees to progress through the materials at their own rate. If you want to set up the working enviroment before hand, here is the instruction. Don't worry if you cannot do it, your mentor will help you on the day. How to join? Due to the avalibilities of mentors, the workshop will be offer to a limited amount of attendees on a first come first serve bases. Please register with the form below to get your spot. I want to join the workshop We may have a few spots for walk-ins on the day, you can come to the Zoom for Silly-Walks track at the start of the workshop. However, if you know you will be joining in advance, we highly recommend you to register with the form above."
