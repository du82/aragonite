["https://ep2021.europython.eu/europython/help"]
title = "Help run EuroPython — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = "The EuroPython conference series was initiated by the European Python community in 2001 and started with EuroPython 2002 in Charleroi, Belgium, as the first major Python conference entirely run by volunteers. Since then we’ve come a long way. EuroPython Organization Today's EuroPython conferences are run by a collaboration between on-site teams and the EuroPython Workgroups, which are embedded into the EuroPython Society (EPS), the organization behind the EuroPython conference series and legal owner of the trademark. This year, the conference is run by the EuroPython 2021 Team (the EuroPython Workgroups for 2021) If you'd like to know more about how EuroPython is run, please consider attending the session “EuroPython 2022: Help us build the next edition!” which will provide a short introduction. Please also see the other “EuroPython” menu entries for additional references. Participate in the Organization There are three ways to participate in the EuroPython organization: as EuroPython Society (EPS) member: any EuroPython attendee can become EPS member. as EuroPython Workgroup member: please see the workgroup page for how to apply (you don't have to be an EPS member to participate in the EuroPython Workgroups). as an on-site volunteer: this would not be available for the online edition. But check back in 2022 when we hopefully host the conference in Dublin! If you have questions, please write to board@europython-society.org."
