title = "EuroPython Merchandise Shop — EuroPython 2021 Online · July 26 - Aug. 1, 2021"
full_description = "We’re very happy to announce our EuroPython merchandise shop for EuroPython 2021, with a fabulous new design for the attendee t-shirts: EuroPython 2021 Merch Shop The shop is run on the Spreadshirt platform and so Spreadshirt will handle all payments, invoicing and shipping. We have preconfigured a large number of items in the shop based on the designs for EuroPython 2021, but you can also customize the colors and looks. Any profit this creates will go towards the EuroPython financial aid budget, so will be put to good use. Discounts To make things a little easier for you, we have configured the following discounts Spreadshirt offers: 20% off from July 8 - 11 15% off from July 12 - 15 free shipping from July 16 - 19 Create your own merchandise for EuroPython 2021 The Spreadshirt shop also allows using our logos on custom products and in custom ways. Simply choose one of the existing designs and click on the pen icon below the product views. It is also possible to upload your own graphics to add to the product. Be sure to upload the graphics using 200dpi and in sufficient size to fit you use on the product. Shipping worldwide Spreadshirt is shipping to a lot of destinations worldwide. Unfortunately, they don’t support shipping to the US, Australia, Brasil and a few other countries on their European shop system for tax reasons. If you'd like to order from one of those countries, perhaps you can find a friendly Pythonista who would be willing to forward you the merch from Europe."
