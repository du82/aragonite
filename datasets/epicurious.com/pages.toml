full_description = '''Recipe RoundupOur 47 Best Recipes for Mardi GrasGet your fill on Fat Tuesday with these New Orleans–inspired favorites like King Cake, shrimp etouffée, and crawfish seafood cocktail.By The Epicurious EditorsMarch 5, 2019FacebookXPinterestCrawfish GravyAnders OvergaardFacebookXPinterestAnders Overgaard1/47Crawfish GravyThe foundation of this étouffée-like dish is a brown roux that lends a deep, nutty flavor. The gravy pairs well with Grits Dressing and biscuits.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_120%2Cc_limit/51134500_fried-oysters_1x1.jpg 120w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_240%2Cc_limit/51134500_fried-oysters_1x1.jpg 240w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_320%2Cc_limit/51134500_fried-oysters_1x1.jpg 320w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_640%2Cc_limit/51134500_fried-oysters_1x1.jpg 640w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_800%2Cc_limit/51134500_fried-oysters_1x1.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_320%2Cc_limit/51134500_fried-oysters_1x1.jpg 320w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_640%2Cc_limit/51134500_fried-oysters_1x1.jpg 640w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_960%2Cc_limit/51134500_fried-oysters_1x1.jpg 960w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_1280%2Cc_limit/51134500_fried-oysters_1x1.jpg 1280w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_1600%2Cc_limit/51134500_fried-oysters_1x1.jpg 1600w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc361/1:1/w_1920%2Cc_limit/51134500_fried-oysters_1x1.jpg 1920w, https://assets.epicurious.com/photos/54b053f8a7baf2e46eefc36