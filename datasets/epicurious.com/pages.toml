title = "23 Air Fryer Recipes We Love | Epicurious"
description = "Our best air fryer recipes include mains like easy chicken wings and glazed salmon, sides like crispy brussels sprouts and garlic fries, and more great dishes."
full_description = 'Recipe Roundup23 Air Fryer Recipes We LoveLike chicken wings with a crackly crust, tamarind-glazed salmon, and crispy brussels sprouts with honey butter.By Rebecca Firkser and The Editors of EpicuriousFebruary 23, 2025FacebookXPinterestPhotograph by Isa Zapata, food styling by Judy Kim, prop styling by Gözde EkerFacebookXPinterestPerhaps you’ve found your way to these air fryer recipes as a neophyte: Eager to learn about your new device but not sure where to start. So before we trudge ahead into our best air fryer recipes, let us take one step back. An air fryer is essentially a countertop convection oven. Its fan furiously circulates hot air, quickly crisping veggies, chicken wings, frozen food—whatever you want to put in it, really. Because of the constant, even heat, most dishes—including a whole chicken—have a significantly lower cooking time when air-fried as compared to oven roasting. Air-frying requires less oil than deep-frying but still produces deeply flavorful food. (Bonus: It’s a safer option for beginners who may be nervous about managing a pot of hot oil.)You can simply hit your favorite protein with a little olive oil, salt, and pepper to make air fryer pork chops or steak—toss in some frozen fries to crisp up too. But if it’s easy air fryer recipes you’re looking for, you’ve found your happy place. Whether you’re searching for a weeknight main dish or a side of the crispiest brussels sprouts, you may find yourself no longer in need of a stovetop. (Would you like some of our favorite air fryer accessories with that?)Photo by Joseph De Leo, Food Styling by Drew Aichele1/23Air-Fryer Brussels Sprouts Salad With Spiced Maple VinaigretteThis healthy air fryer recipe travels well. Make a double batch for dinner and pack what’s left for a not-sad desk lunch tomorrow.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_120%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 120w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_240%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 240w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_320%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 320w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_640%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 640w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_800%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_320%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 320w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_640%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 640w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_960%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 960w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_1280%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 1280w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_1600%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 1600w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_1920%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 1920w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_2240%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 2240w, https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_2580%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg 2580w" sizes="100vw"/><img alt="A plate of rice topped with shallots sliced cucumbers and glazed airfryer salmon with a fork and a glass of white wine." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/639c9f2e4dd8218481a7362f/1:1/w_320%2Cc_limit/AirFryerSalmon_RECIPE_121522_44370.jpg"/>Photo by Joseph De Leo, Food Styling by Drew Aichele2/23Air Fryer Salmon With Sweet Tamarind GlazeSalmon in the air fryer? Coated in a tamarind glaze and store-bought fried shallots, this restaurant-worthy dinner comes together in less than 40 minutes.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_120%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 120w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_240%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 240w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_320%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 320w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_640%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 640w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_800%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_320%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 320w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_640%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 640w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_960%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 960w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_1280%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 1280w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_1600%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 1600w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_1920%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 1920w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_2240%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 2240w, https://assets.epicurious.com/photos/65e105ccff0094f439ea88c0/1:1/w_2580%2Cc_limit/Tater-Tot-Chaat_RECIPE.jpg 2580w" sizes="100vw"/><img alt="Tater Tot Chaat in a platter topped with fresh mint cilantro and pomegranate seeds." class="ResponsiveImageCont