66d735d5aed3cbe1be2915fe/1:1/w_1920%2Cc_limit/168_BigVegan_9780593328934_tx_r1_VOG_final.jpg 1920w, https://assets.epicurious.com/photos/66d735d5aed3cbe1be2915fe/1:1/w_2240%2Cc_limit/168_BigVegan_9780593328934_tx_r1_VOG_final.jpg 2240w, https://assets.epicurious.com/photos/66d735d5aed3cbe1be2915fe/1:1/w_2580%2Cc_limit/168_BigVegan_9780593328934_tx_r1_VOG_final.jpg 2580w" sizes="100vw"/><img alt="Glazed Torn Beets with Pistachio Butter on a plate with drinks." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/66d735d5aed3cbe1be2915fe/1:1/w_320%2Cc_limit/168_BigVegan_9780593328934_tx_r1_VOG_final.jpg"/>Photo by Nisha Vora4/23Glazed Torn Beets With Pistachio Butter and MintPistachio butter is everywhere these days, but most packaged versions are sweet. This homemade one goes savory and serves as a bed for roasted, balsamic-glazed root veg. Serve with sliced poached chicken breast drizzled with any remaining balsamic glaze.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_120%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 120w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_240%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 240w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_320%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 320w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_640%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 640w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_800%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_320%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 320w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_640%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 640w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_960%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 960w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_1280%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 1280w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_1600%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 1600w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_1920%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 1920w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_2240%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 2240w, https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_2580%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg 2580w" sizes="100vw"/><img alt="Split buttermilk olive oil biscuits loaded with whipped cream cut berries and balsamic syrup." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/5ee9387e12a2a1a32cffeef7/1:1/w_320%2Cc_limit/strawberry-balsamic-shortcakes-recipe-061620.jpg"/>Photo by Jerrelle Guy5/23Strawberry Balsamic ShortcakesIf you thought strawberries and cream were a match made in heaven, just wait until you try strawberries and balsamic glaze. Paired with olive oil biscuits (yes.), the duo makes this riff on strawberry shortcakes tangier, fruitier, and brighter. And, yes, there is also whipped cream (we’re not monsters).Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/67191a37e4f4f04717907af2/1:1/w_120%2Cc_limit/BALSAMIC%2C%2520BURRATA%2C%2520AMEN.jpg 120w, https://assets.epicurious.com/photos/67191a37e4f4f04717907af2/1:1/w_240%2Cc_limit/BALSAMIC%2C%2520BURRATA%2C%2520AMEN.jpg 240w, https://assets.epicurious.com/photos/67191a37e4f4f0