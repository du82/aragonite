full_description = '''Recipe RoundupThe Most-Saved Recipes in the Epicurious App in February 2025Like golden chicken and “one of the best soups I’ve ever made.”By The Editors of EpicuriousMarch 1, 2025FacebookXPinterestPhotography by Isa Zapata, Food Styling by Thu Buser, Prop Styling by Christina AllenFacebookXPinterestOur knockout recipes of February leaned into soup season, like this winter-vegetable one packed with potatoes, peas, and carrots, and soul-warming homemade ramen. Also on this month’s list: crowd-pleasing chicken dinners. Try out this chicken tikka that’s made in an air fryer, but has the charred depth of a clay tandoor. Or make this Golden Chicken With Mustard and Shallots, part of this year’s Bon Appétit 56. The chicken breasts sit atop a sunny cream sauce that will remind you spring is just around the corner. Scroll down for the most-saved recipes in the Epicurious app this month.Not using the Epi iOS app yet? Grab a digital subscription today so you can start saving (and eating) your way through this list.Photo by Alex Lau, Food Styling by Anna Stockwell1/21Citrus Shrimp Rice Bowls“The whole family says it's one of their favorite meals.”Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_120%2Cc_limit/20231020-WEB-3997.jpg 120w, https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_240%2Cc_limit/20231020-WEB-3997.jpg 240w, https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_320%2Cc_limit/20231020-WEB-3997.jpg 320w, https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_640%2Cc_limit/20231020-WEB-3997.jpg 640w, https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_800%2Cc_limit/20231020-WEB-3997.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/w_320%2Cc_limit/20231020-WEB-3997.jpg 320w, https://assets.epicurious.c