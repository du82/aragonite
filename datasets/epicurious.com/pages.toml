0%2Cc_limit/367141_shrimp-grits_6x4.jpg 1920w, https://assets.epicurious.com/photos/552ec11420ca5d650ed252cb/1:1/w_2240%2Cc_limit/367141_shrimp-grits_6x4.jpg 2240w, https://assets.epicurious.com/photos/552ec11420ca5d650ed252cb/1:1/w_2580%2Cc_limit/367141_shrimp-grits_6x4.jpg 2580w" sizes="100vw"/><img alt="Image may contain Burger Food Dish Meal and Egg" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/552ec11420ca5d650ed252cb/1:1/w_320%2Cc_limit/367141_shrimp-grits_6x4.jpg"/>Photo by Ditte Isager3/47Shrimp & GritsAt Peels in New York City, chefs Preston and Ginger Madson tweak this Low Country favorite with two secret ingredients: a little Budweiser and a lot of tasso, a Cajun-spiced ham. You can sub in andouille sausage if tasso is not available.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_120%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 120w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_240%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 240w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_320%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 320w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_640%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 640w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_800%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_320%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 320w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_640%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 640w, https://assets.epicurious.com/photos/54b3413f460b4423363f2996/1:1/w_960%2Cc_limit/356850_buttermilk-beignets_1x1.jpg 960w, https://assets.epicurious.com/photos/54b3413f460b4423363