["https://epicurious.com/expert-advice/the-best-soda-maker-for-the-sparkliest-water-and-the-bubbliest-cocktails-article"]
title = "Best Soda Maker of 2025: Expert Tested for Fizz and Flavor | Epicurious"
description = "To crown the best soda maker, we tested and reviewed models from SodaStream, Drinkmate, Aarke, and more to find one that will ensure you never buy sparkling water again."
full_description = '''Product ReviewsDiscover The Best Soda Maker to Spare You From Buying Sparkling Water Ever AgainWe carbonated water using the leading home soda makers to find the best one on the market.By Wilder DaviesFebruary 10, 2025Photo by Joseph De LeoSave RecipeSaveSave RecipeSaveAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Table of contentsThe best soda makerThe best budget soda makerA handsome, versatile upgrade How do soda makers work?How we tested soda makersWhy we don’t recommend automatic soda makersOther soda makers we testedAs recently as 2020, no one was really asking about the best soda maker; they just didn’t have that many choices. But you might be surprised to learn that when SodaStream—the longtime alpha of home soda making—made its 2009 global debut, it wasn’t actually a debut. It was a relaunch for a now 117-year-old company. SodaStream had been largely inactive for decades, but at certain points in the ’70s and ’80s you could have purchased the groovy, tangerine ancestor of today’s modern machine.The best soda makersArrowArrowBut we live in the future now and SodaStream is no longer the only name in the game—not even close. On our mission to find the best soda maker on the market we tested 15 machines from six different companies. Read below for our top picks. For more about how soda and seltzer makers work, and our testing criteria, scroll to the bottom of the page.The best soda maker: The Drinkmate Omnifizz<img loading="lazy" alt="DrinkMate OmniFizz" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4c/3:4/w_748%2Cc_limit/DrinkMate%2520OmniFizz.png" srcSet="https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4c/3:4/w_120,c_limit/DrinkMate%20OmniFizz.png 120w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4c/3:4/w_240,c_limit/DrinkMate%20OmniFizz.png 240w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4c/3:4/w_320,c_limit/DrinkMate%20OmniFizz.png 320w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4c/3:4/w_640,c_limit/DrinkMate%20OmniFizz.png 640w" sizes="100vw"/>DrinkMate OmniFizz$111 $100 Amazon$200 $160 Target$140 $110 Home DepotPros: Can carbonate non-water beverages Cons: Has a plastic, utilitarian look The Drinkmate Omnifizz is easy to use and makes sharp and zingy sparkling water in a matter of seconds. But what stands out most is the increased control it offers as well as the greater range in utility.The Drinkmate is built a little differently than almost all other soda makers. The infuser—the thing you attach the bottle to—has slow and fast pressure release tabs, making it easy to avoid any messes from an over-carbonated beverage. The slow release of pressure is also important for the Omnifizz’s best feature: its ability to carbonate things other than water.Drinkmate is one of only two soda maker manufacturers we’ve come across that allows you to carbonate non-water liquids. Try making bubbly wine with a SodaStream and you could void your warranty and possibly end up damaging the machine. We tested Drinkmate’s all-beverages-welcome policy using white wine and a batched Boulevardier recipe and were pleased with the results. In fact, it carbonated the wine so well that it deceived one of my colleagues into thinking they were drinking a glass of Crémant. This means you could carbonate things like apple juice, or even milk (if you're feeling like a real sicko). The slow pressure release is the key to success here, because liquids that have any sugar (like juice or wine) or fat (like milk) foam more when hit with CO2, and so a quick release of pressure can result in a blowup.What we didn’t like about the Drinkmate OmnifizzSimply put, the Drinkmate Omnifizz is the best carbonator on the market due to its sheer versatility and relatively affordable price tag. If we had to choose a flaw, we’d say that it’s not the best-looking machine, but that’s easy to overlook after a few sips of carbonated Negroni.SpecsAccordionItemContainerButtonLargeChevronHeight: 16.14"Machine material(s): PlasticBottle material: PlasticComes with starter CO2 tank: Yes (size varies by retailer)Requires proprietary CO2 tank: NoWarranty: 2 yearsThe best budget soda maker: Mysoda Woody Sparkling Water Maker<img loading="lazy" alt="Mysoda Woody Soda Maker" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4d/3:4/w_748%2Cc_limit/Mysoda%2520Woody.png" srcSet="https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4d/3:4/w_120,c_limit/Mysoda%20Woody.png 120w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4d/3:4/w_240,c_limit/Mysoda%20Woody.png 240w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4d/3:4/w_320,c_limit/Mysoda%20Woody.png 320w, https://assets.epicurious.com/photos/65188873dff4993c7f1f2c4d/3:4/w_640,c_limit/Mysoda%20Woody.png 640w" sizes="100vw"/>Mysoda Woody$85 $70 Amazon$68 Finnish Design ShopPros: Made of sustainable materials, great sparkly water Cons: Doesn't come with a CO2 canister What makes the Mysoda Woody unique is that it’s made from renewable biocomposite, a biodegradable material consisting of resin and natural fibers. This is likely why the Woody earned both a Red Dot and iF Gold design awards. It has a beautiful natural texture and sturdy weight compared to its plastic brethren and comes in five muted colors. Ultimately, it’s that design that pushed it over the top for us.In terms of function, the Woody has just one button and was intuitive to use. We found that it produced carbonated water on par with leading SodaStream models. Mysoda also makes the Toby and Ruby, two higher-priced models that look a little sleeker, but we liked the Woody just fine and appreciated the concerted move toward using plastic alternatives.What we didn’t like about the Mysoda WoodyThe Woody uses the same, easy to find screw-in canisters employed by a wide range of machines. But the price point does have a bit of a caveat: This model doesn’t come with a CO2 canister, unlike other soda makers on the market that almost always include one with purchase. Factoring in the combined cost, the Mysoda Woody clocks in around the same as SodaStream’s basic Terra machine. However, keep in mind that the latter uses a newer proprietary CO2 cartridge called Quick Connect that’s only compatible with SodaStream models. For this reason, we still prefer the Mysoda Woody.SpecsAccordionItemContainerButtonLargeChevronHeight: 16"Machine material(s): Resin and wood fiberBottle material: PlasticComes with starter CO2 tank: NoRequires proprietary CO2 tank: NoWarranty: 2 yearsA handsome, versatile upgrade: The Breville Infizz Fusion<img loading="lazy" alt="Breville Infizz Fusion Soda Maker" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/66353d3aa70a3844f209261b/3:4/w_748%2Cc_limit/Screen%2520Shot%25202024-05-03%2520at%25203.38.31%2520PM.png" srcSet="https://assets.epicurious.com/photos/66353d3aa70a3844f209261b/3:4/w_120,c_limit/Screen%20Shot%202024-05-03%20at%203.38.31%20PM.png 120w, https://assets.epicurious.com/photos/66353d3aa70a3844f209261b/3:4/w_240,c_limit/Screen%20Shot%202024-05-03%20at%203.38.31%20PM.png 240w, https://assets.epicurious.com/photos/66353d3aa70a3844f209261b/3:4/w_320,c_limit/Screen%20Shot%202024-05-03%20at%203.38.31%20PM.png 320w, https://assets.epicurious.com/photos/66353d3aa70a3844f209261b/3:4/w_640,c_limit/Screen%20Shot%202024-05-03%20at%203.38.31%20PM.png 640w" sizes="100vw"/>Breville InFizz Fusion$250 Breville$250 Williams SonomaPros: Can carbonate non-water beverages, brings that Breville design-forward element Cons: Pricey for a carbonator Breville is pretty new to the soda maker game, and as is the case with the majority of their appliances, the Infizz Fusion does not disappoint. It performs just as well as the Drinkmate Omnifizz, and is capable of carbonating fruit juices, mixed drinks, tea, and just about any other potable liquid you’d like to carbonate (for better or worse). The downside is that the Infizz Fusion has a significantly higher price tag: $150 higher than the Omnifizz at the time of writing. However, that money buys you a sturdy stainless-steel build and a more considered design that quite literally outshines the Drinkmate Omnifizz. If looks matter and you want the versatility of carbonating cocktails and juice, the Breville is absolutely what we’d recommend.What we didn’t like about the Breville Infizz FusionIt’s the price. Soda makers are simple machines that don’t need to cost much to work well. With the Breville you are clearly paying a premium for aesthetics.SpecsAccordionItemContainerButtonLargeChevronHeight: 16.9"Machine material(s): Stainless steelBottle material: PlasticComes with starter CO2 tank: Only if you buy the bundleRequires proprietary CO2 tank: NoWarranty: 2 yearsHow do soda makers work?All but one of the soda makers tested were gas canister carbonators that rely on pressurized carbon dioxide to introduce carbonation to a liquid (the outlier was the Spärkel, which used a powder). The gas comes through a siphon and then into the water in a sealed bottle. At-home soda making is a great alternative to buying seltzer, because it cuts down on the number of plastic bottles you’re bringing home from the store and then recycling after a single use. While the bottles that come with most soda makers have expiration dates and must be replaced every couple of years because the pressure inside wears them down, you will certainly get more use out of them than your average store-bought seltzer bottle. You can exchange the CO2 canisters via retailer websites and at some stores for a discount, though they do last for a while. One avid soda maker at the Epicurious office said she got 60 liters of soda out of a single canister in her Aarke Carbonator.<img alt="The Breville InFizz Soda Maker carbonating water" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_1600%2Cc_limit/breville%2520infizz%2520noah.jpg" srcSet="https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_120,c_limit/breville%20infizz%20noah.jpg 120w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_240,c_limit/breville%20infizz%20noah.jpg 240w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_320,c_limit/breville%20infizz%20noah.jpg 320w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_640,c_limit/breville%20infizz%20noah.jpg 640w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_960,c_limit/breville%20infizz%20noah.jpg 960w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_1280,c_limit/breville%20infizz%20noah.jpg 1280w, https://assets.epicurious.com/photos/663a4f6b77cb76dcf70c190e/master/w_1600,c_limit/breville%20infizz%20noah.jpg 1600w" sizes="100vw"/>Noah KaufmanHow we tested and what we looked forWe limited our test to soda makers designed as countertop appliances. We did not include soda siphons like the Isi, which rely on small, individual CO2 cartridges because the cartridges need frequent replacement and are more of a nuisance to deal with than the standard 60-ml canister.We first evaluated each machine by reading the assembly and operation instructions. Then, using cold water, we tested the highest carbonation setting for each model. We then had several coworkers do a blind tasting out of identical drinking glasses to assess the carbonation levels, and I tasted the water myself.During the tests, we found that there was little difference in noise level, carbonation time, and amount of carbonation between the different models. All of the machines we successfully tested (there was one failure) were equally quiet, capable of lighter or stronger levels of carbonation, and took between 3–10 seconds to carbonate. Aside from the Spärkel, which we’ll get into below, all brands also used more or less the same type of gas canister.As for other qualities, we evaluated the general build and appearance. Does it look nice? Does it feel sturdy or cheap? How much counter space does it take up? Does it come with multiple BPA-free water bottles? Is it easy or hard to replace CO2 cylinders? Does the company offer a CO2 tank exchange program?Other soda makers we testedPhilips Sparkling Water Maker<img loading="lazy" alt="" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/65188874f1928827abbb3f6b/3:4/w_748%2Cc_limit/Philips%2520Sparkling%2520Water%2520Maker.png" srcSet="https://assets.epicurious.com/photos/65188874f1928827abbb3f6b/3:4/w_120,c_limit/Philips%20Sparkling%20Water%20Maker.png 120w, https://assets.epicurious.com/photos/65188874f1928827abbb3f6b/3:4/w_240,c_limit/Philips%20Sparkling%20Water%20Maker.png 240w, https://assets.epicurious.com/photos/65188874f1928827abbb3f6b/3:4/w_320,c_limit/Philips%20Sparkling%20Water%20Maker.png 320w, https://assets.epicurious.com/photos/65188874f1928827abbb3f6b/3:4/w_640,c_limit/Philips%20Sparkling%20Water%20Maker.png 640w" sizes="100vw"/>Philips Sparkling Water Maker$56 Amazon$70 PhilipsThe Philips Sparkling Water Maker is a great machine with a price that’s in line with the Mysoda Woody. It is capable of making sharply fizzy soda water and has a pleasing appearance that won’t look garish next to your coffee maker—all for only $60. It’s simple to set up, uses the same single-button design that pretty much all countertop carbonators have, and it performs as well. Ultimately, we prefer the Mysoda as far as build quality is concerned, but this is still a worthwhile budget machine.Mysoda Glassy<img loading="lazy" alt="Mysoda glassy soda maker" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/67aa30e8e630a36eb8d99334/3:4/w_748%2Cc_limit/mysoda%2520glassy%2520soda%2520maker.jpg" srcSet="https://assets.epicurious.com/photos/67aa30e8e630a36eb8d99334/3:4/w_120,c_limit/mysoda%20glassy%20soda%20maker.jpg 120w, https://assets.epicurious.com/photos/67aa30e8e630a36eb8d99334/3:4/w_240,c_limit/mysoda%20glassy%20soda%20maker.jpg 240w, https://assets.epicurious.com/photos/67aa30e8e630a36eb8d99334/3:4/w_320,c_limit/mysoda%20glassy%20soda%20maker.jpg 320w, https://assets.epicurious.com/photos/67aa30e8e630a36eb8d99334/3:4/w_640,c_limit/mysoda%20glassy%20soda%20maker.jpg 640w" sizes="100vw"/>Mysoda Glassy$190 AmazonWe were charmed by the Mysoda Glassy. Generally, we think that carbonating in glass bottles isn’t worth the extra design precautions machines need to take to avoid any explosive accidents, and in the past, we’ve been underwhelmed by the glass bottle attempts of competing brands. But the sliding door on the Glassy m'''
