title = "Epicurious User Help | Epicurious"
description = "Subscription information, membership management, and more."
full_description = "Frequently Asked Questions: Epicurious and Bon Appétit Recipe SubscriptionSubscription information, subscription management, and more.Jump to a section:Becoming a SubscriberSubscriptionAccount Creation/ManagementCancellationBilling & RefundsMiscellaneousEpicurious AppContact UsBecoming a SubscriberQ: How do I subscribe?A: Please visit our subscription page to find the best option for your needs. You can also visit epicurious.com or bonappetit.com and click subscribe.Q: Can I sign up internationally?A: Yes, those located outside the United States can subscribe. Payment will be taken in U.S. dollars.SubscriptionQ: What do I receive with my subscription?A: We’ve created a recipe service that is helpful, fun, and makes you a better cook. A single subscription gives you unlimited access to over 50,000 recipes across Epicurious.com and Bonappetit.com, with many more recipes to come.Q: What happens if I already have an Epicurious digital account?A: You can add a paid subscription to your existing account and log in with the same credentials. Please visit our subscription page to find the best option for your needs.Q: What happens if I don’t have an Epicurious digital account?A: When you purchase a subscription, you will be able to create a digital account.Account Creation/ManagementQ: I have recently become a subscriber. How do I log in?A: Upon subscribing you will receive an email containing a link to log in along with any additional log-in instructions. The link will automatically log you into the site you've subscribed to. You may also use an email and password if the user has previously generated one. If you have any issues, please reach out to Customer Service and we’ll be happy to assist.Q: I’m trying to verify my subscription, but I get an error that my email is already associated with another account. What should I do?A: If you cannot remember which email address is associated with your subscription, please contact Customer Service.Q: How do I change my term (e.g., monthly to annual)?A: If you wish to change your term, then you must reach out to Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: Can I pause my subscription?A: Unfortunately, you cannot pause your subscription at this time.Q: Can I purchase multiple / group subscriptions?Unfortunately, this is not an option at this time.Q: How do I make changes to my email address or password?A: You may make updates to your email or password by calling Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: How do I make changes to my delivery address for the magazine?A: Please reach out to Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: I forgot my password, or need to reset it. How can I do that?A: Please reach out to Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.CancellationQ: How do I cancel my subscription?A: You can cancel your subscription within the manage subscription section via your account page. You can also cancel your subscription by calling Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: If I cancel my subscription, do I get a refund?A: At this point, we do not offer refunds. If you call or email Customer Service and cancel your subscription, you will continue to have access until the end of that rolling month.Q: If I cancel my subscription, do I still get my benefits and perks?A: If you are a monthly member, you will still receive your benefits until the end of that month, as well as any perks scheduled for that month. You will not receive perks or benefits scheduled for later in the year.If you are an annual Member you will have continued access and available member benefits and perks until the end of your annual subscription period.Q: If I have cancelled my subscription previously, how can I subscribe again?A: If you would like to subscribe again after canceling, you can go to bonappetit.com or epicurious.com and follow the prompts to subscribe. If you have any further questions, you can contact Customer Service.Billing & RefundsQ: What forms of payment do you accept?A: We accept Visa, MasterCard, American Express and Discover. We also accept PayPal, Apple Pay, and Google Pay.Q: When will I be charged for my subscription?A: Credit cards are charged upon receipt of annual orders and after your free month for monthly orders. It may take two to three days for the charge to appear on your credit card statement. Monthly subscriptions will be automatically renewed each month thereafter unless you tell us to stop. Before the start of each annual renewal, you will be sent a reminder notice sufficiently in advance of your renewal date stating the term and rate then in effect that will be charged to your payment account.If you choose not to continue your monthly or annual subscription before your credit card is charged, please contact Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: How do I update my payment information associated with my subscription?A: You can update your payment information by calling Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com.Q: How do I get a refund, and what are the refund timings?A: If your order type is eligible for a refund, you can request a refund by calling Customer Service at 855-753-1037 (+1 332-239-2921 if outside of the U.S.) or by email at Help@epicurious.com. Refunds are processed to the original form of payment within 5-7 business days by the Customer Care center.Miscellaneous (Gift, Referral, Discount)Q: Can I buy a gift subscription for someone else?A: At this time you can only gift a Bon Appétit print subscription or a combination print-and-digital subscription. We do not yet offer digital-only gift subscriptions.Q: Can I refer a friend and get a discount / offer for doing so?A: At this time we do not have a referral program.Q: Do you offer a student discount?A: We currently do not offer discounts to students.Epicurious AppQ: Does my subscription give me access to the Epicurious app?A: Yes, subscribers have unlimited access to the app. Sign in by using the email address associated with your subscription.Q: I used a previous version of the Epicurious app. Will all my saved recipes still be available to me?A: Yes. To access your saved recipes in the new app, simply sign in using the same email address associated with your previous account.Q: Where is the Epicurious app available?A: The Epicurious app is currently only available on iOS devices. You can download the app from the Apple App Store on your phone or tablet device.If you have any questions regarding our app, please visit our App FAQ. You can also email apps@epicurious.com or call 1-855-753-1037 (+1 332-239-2921 if outside of the U.S.).Contact UsHours of OperationMonday - Friday: 9am - 9pm ETSaturday - Sunday: 9am - 5pm ETEpicuriousToll-free Number: 855-753-1037International Number: +1 332-239-2921Email Address: Help@epicurious.comBon AppétitToll-free Number: 855-756-1671International Number: +1 332-248-1214Email Address: Help@bonappetit.com"
