o-boy-080816.jpg 960w, https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_1280%2Cc_limit/shrimp-po-boy-080816.jpg 1280w, https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_1600%2Cc_limit/shrimp-po-boy-080816.jpg 1600w, https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_1920%2Cc_limit/shrimp-po-boy-080816.jpg 1920w, https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_2240%2Cc_limit/shrimp-po-boy-080816.jpg 2240w, https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_2580%2Cc_limit/shrimp-po-boy-080816.jpg 2580w" sizes="100vw"/><img alt="Image may contain Burger Food and Sandwich" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/57ac8a615dc5a16b3e65cb5f/1:1/w_320%2Cc_limit/shrimp-po-boy-080816.jpg"/>Photo by Marcus Nilsson5/47Shrimp Po'BoyThe paper-thin crust and pillowy crumb of a New Orleans-style French roll is essential to this classic sandwich, as is Crystal hot sauce.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_120%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 120w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_240%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 240w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_320%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 320w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_640%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 640w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_800%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_320%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 320w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_640%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 640w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_960%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 960w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_1280%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 1280w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_1600%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 1600w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_1920%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 1920w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_2240%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 2240w, https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_2580%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg 2580w" sizes="100vw"/><img alt="Valentine&#x27;s Day Desserts like this one are sure to make your sweetheart swoon. Pictured Cherries jubilee in bowls." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/5a78cba2833ab61b13e334d0/1:1/w_320%2Cc_limit/Cherries-Jubilee-plated-31012018.jpg"/>Photo by Chelsea Kyle, Food Styling by Olivia Mack Anderson6/47Triple-Cherries JubileeFlaming desserts-like this one were all the rage at fine dining establishments in the sixties. The title here refers to the sweet cherries, dried cherries and cherry juice-enhanced by vanilla bean and orange peel-that provide such terrific flavor.Get This RecipeSave Storyrecipe saved<source media="(max-width: 767px)" srcSet="https://assets.epicurious.com/photos/54ab49f719925f464b3a2f90/1:1/w_120%2Cc_limit/51252530_chicken-andouille-gumbo_1x1.jpg 120w, https://assets.epicurious.com/photos/54ab49f719925f464b3a2f90/1:1/w_240%2Cc_limit/51252530_chicken-andouille-gumbo_1x1.jpg 240w, https://assets.epicurious.com/photos/54ab49f719925f464b3a2f90/1:1/w_320%2Cc_limit/51252530_chicken-andouille-gumbo_1x1.jpg 320w, https://assets.epicurious.com/photos/54ab49f719925f464b