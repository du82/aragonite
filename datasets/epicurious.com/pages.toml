full_description = '''Note from EpicuriousAccessibility HelpEpi's official accessibility policy.By Epicurious EditorsAugust 15, 2017Save RecipeSaveSave RecipeSaveWe strive to have websites that are accessible to individuals with disabilities. However, if you encounter any difficulty in using our site, please email us for assistance with accessibility issues. Note from EpicuriousAccessibility HelpEpi's official accessibility policy.By Epicurious EditorsAugust 15, 2017Save RecipeSaveSave RecipeSaveWe strive to have websites that are accessible to individuals with disabilities. However, if you encounter any difficulty in using our site, please email us for assistance with accessibility issues.Read More<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="What’s the Difference Between Coconut Milk and Coconut Cream?" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/67c0af70a1a34f5fd6b6c334/1:1/pass/undefined"/>What’s the Difference Between Coconut Milk and Coconut Cream?And what about cream of coconut? Here’s how to use each ingredient.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="These Boiled Greens Are My Go-To Side" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/67c0a3a8373d33100eb89cd3/1:1/pass/undefined"/>These Boiled Greens Are My Go-To SideQuickly boiled and simply seasoned, this Taiwanese-style dish goes with a million meals.<source media="(max-width: 767px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1738750728/epicurious_hot-takes-pepper-x-creator-ed-currie-tastes-17-hot-condiments-from-around-the-world.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1738750728/epicurious_hot-takes-pepper-x-creator-ed-currie-tastes-17-hot-condiments-from-around-the-world.jpg 800w" sizes="100vw"/><img alt="‘Pepper X’ Creator Ed Currie Tastes 17 Hot Condiments From Around the World" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1738750728/epicurious_hot-takes-pepper-x-creator-ed-currie-tastes-17-hot-condiments-from-around-the-world.jpg"/>‘Pepper X’ Creator Ed Currie Tastes 17 Hot Condiments From Around the WorldProfessional hot sauce maker Smokin’ Ed Currie, the founder and president of PuckerButt Pepper Company, returns to Epicurious to taste 17 hot condiments from around the world. From Japanese Yuzu koshō to Yemeni Zhug, find out what spicy condiments are on offer worldwide.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="All the Recipes From &lt;em&gt;Bon Appétit&lt;/em&gt;’s February Issue" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/677d1743ef933c9441263cdc/1:1/pass/undefined"/>All the Recipes From Bon Appétit’s February IssueWe’ve got make-ahead breakfasts, a happy fridge salad, and one-pan dinners.<source media="(max-width: 767px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739976178/epicurious_12-chefs-cook-steak-michelin-star-japanese-and-more.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739976178/epicurious_12-chefs-cook-steak-michelin-star-japanese-and-more.jpg 800w" sizes="100vw"/><img alt="12 Chefs Cook Steak (Michelin Star, Japanese &amp; More)" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739976178/epicurious_12-chefs-cook-steak-michelin-star-japanese-and-more.jpg"/>12 Chefs Cook Steak (Michelin Star, Japanese & More)Filet mignon, ribeye, and wagyu are just a few of the steak cuts you can cook, but what if you had 12 different chefs create their version of a steak dinner? From the school cafeteria to Michelin-starred restaurants, discover how these chefs prepare the perfect steak.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="The Most-Saved Recipes in the Epicurious App in January 2025" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/5e67e496a83d920008f7394f/1:1/pass/undefined"/>The Most-Saved Recipes in the Epicurious App in January 2025Like one-pot ginger chicken, oven risotto, and flourless chocolate cake.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="The Best Chef’s Knife, Tested and Reviewed" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/625f21714e4ac56c58188c80/1:1/pass/undefined"/>The Best Chef’s Knife, Tested and ReviewedYou’ll use your chef’s knife more than any other in the kitchen, so you might as well make it a good one.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="The Most-Saved Recipes in the Epicurious App in February 2025" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/65422fd1c4e04424df3bb7e1/1:1/pass/undefined"/>The Most-Saved Recipes in the Epicurious App in February 2025Like golden chicken and “one of the best soups I’ve ever made.”<source media="(max-width: 767px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739368591/epicurious_big-taste-test-ep-taste-panel-chocolate-chip-cookie-dough.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739368591/epicurious_big-taste-test-ep-taste-panel-chocolate-chip-cookie-dough.jpg 800w" sizes="100vw"/><img alt="Pro Chefs Blind Taste Test Every Chocolate Chip Cookie Dough &amp; Mix" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://dwgyu36up6iuz.cloudfront.net/heru80fdn/image/upload/c_fill%2Cd_placeholder_image.jpg%2Cfl_progressive%2Cg_center%2Ch_800%2Cq_80%2Cw_800/v1739368591/epicurious_big-taste-test-ep-taste-panel-chocolate-chip-cookie-dough.jpg"/>Pro Chefs Blind Taste Test Every Chocolate Chip Cookie Dough & MixChefs Camari Mick, Laurie Ellen Pellicano, and Umber Ahmad are used to thinking outside the box when it comes to cooking; however, today on Epicurious we’ve asked them to give us their unfiltered, honest reviews of some prominent chocolate chip cookie doughs and mixes found on supermarket shelves. Which cookies pack the most bang for your budget, and which should you avoid at all costs?<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="The Best Drip Coffee Makers, Because You Don’t Need to Make Pour-Over to Make Good Coffee" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/61649549804c6460b6ebfd7e/1:1/pass/undefined"/>The Best Drip Coffee Makers, Because You Don’t Need to Make Pour-Over to Make Good CoffeeWe drank a lot of coffee to find the best machine for caffeinating your mornings.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="23 Grilled Fish Recipes for Your Next Cookout" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/63650555ffa891d39b916b94/1:1/pass/undefined"/>23 Grilled Fish Recipes for Your Next CookoutLike cedar-plank salmon, fish tacos al pastor, and grilled halibut Niçoise.<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="8 Cookbooks We’re Loving This Month" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://assets.epicurious.com/photos/67a11029d4bd467d7e5ac181/1:1/pass/undefined"/>8 Cookbooks We’re Loving This MonthOur editors cooked up spicy orange shrimp, tuna melt nachos, and passion fruit olive oil cake.'''
