["https://epochai.org/research"]
title = "Research | Epoch AI"
description = "Epoch AI is a multidisciplinary research institute investigating the trajectory of AI and forecasting its economic and societal impact."
full_description = "Epoch AI is a multidisciplinary research institute investigating the trajectory of Artificial Intelligence (AI). We scrutinize the driving forces behind AI and forecast its ramifications on the economy and society. We emphasize making our research accessible through our reports, models and visualizations to help ground the discussion of AI on a solid empirical footing. Our goal is to create a healthy scientific environment, where claims about AI are discussed with the rigor they merit. We conduct in-depth analyses on compute, data, and investment trends to solidify our understanding of AI's trajectory. We investigate how innovations in AI are allowing us to build more capable models with fewer resources. Our expanded AI model database shows that the compute used to train recent models grew 4-5x yearly from 2010 to May 2024. We find similar growth in frontier models, recent large language models, and models from leading companies. Progress in language model performance surpasses what we'd expect from merely increasing computing resources, occurring at a pace equivalent to doubling computational power every 5 to 14 months. We estimate the stock of human-generated public text at around 300 trillion tokens. If trends continue, language models will fully utilize this stock between 2026 and 2032, or even earlier if intensely overtrained."
