title = "Announcing Epoch AI: A Research Initiative Investigating the Road to Transformative AI | Epoch AI"
description = "We are a new research initiative forecasting developments in AI. Come join us!"
full_description = '''.citation-modal .modal-content { flex-direction: column; } /* fix toc */ d-article d-contents { position: initial; } d-article d-contents a { color: black !important; } .banner-img-wrapper img { border-radius: 0px; } .person-resources { display: none; } .people-grid { grid-gap: 1.3rem !important; grid-template-columns: repeat(auto-fill, 200px); } .person { max-width: 200px; width: 100%; } .logos { display: flex; flex-wrap: wrap; justify-content: center; justify-items: stretch; } .logos a { text-decoration: none !important; border: 0 !important; outline: none !important; } .logos img { height: 105px; } .workshow { display: flex; flex-wrap: wrap; text-align: center; justify-content: space-around; gap: 10px; margin-bottom: 1em; } .workshow .work { width: 300px; padding: 5px; text-decoration: none !important; border: none !important; border-radius: var(--card-border-radius); } .workshow .work:hover { box-shadow: 0 0 6px 3px rgb(0 0 0 / 55%); } .workshow .work .thumbnail { height: 200px; } .workshow .work .thumbnail img { height: 100%; width: 100%; object-fit: scale-down; } .workshow .work .description { font-size: 0.9em; } Summary We are a new research initiative working on investigating trends in machine learning and forecasting the development of transformative Artificial Intelligence This work is done in close collaboration with other organizations, like Rethink Priorities and Open Philanthropy We will be hiring for 2-4 full-time roles this summer – more information here What is Epoch AI? Epoch AI is a new research organization that works to support AI strategy and improve forecasts around the development of transformative Artificial Intelligence – AI systems that have the potential to have an effect on society as large as that of the industrial revolution. Our founding team consists of seven members – Jaime Sevilla, Tamay Besiroglu, Lennart Heim, Pablo Villalobos, Edu Roldán, Marius Hobbhahn, and Anson Ho. Collectively, we have backgrounds in Machine Learning, Statistics, Economics, Forecasting, Physics, Computer Engineering, and Software Engineering. .people-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; text-align: center; } .person { flex: 0 1 210px; max-width: 250px; width: 100%; border-radius: var(--default-radius); } @media (max-width: 550px) { .people-grid { justify-items: center; } .person { max-width: 300px; width: 100%; } } .person { padding: 5px; } .person .mug { padding-top: 100%; width: initial; height: initial; margin-bottom: 10px; box-shadow: 0 0 4px 1px rgb(0 0 0 / 55%); background-size: cover; background-position: center; display: block; border-radius: var(--default-radius); background-repeat: no-repeat; } #jaime-sevilla .mug { background-size: 135%, 100%; background-position: -40px -3px, 0px 0px; } #tamay-besiroglu .mug { background-size: 148%, 100%; background-position: -48px -8px, 0 0; } #pablo-villalobos .mug { background-size: 163%, 100%; background-position: -82px -51px, 0 0; } #anson-ho .mug { background-size: 141%, 100%; background-position: -56px -56px, 0 0; } #edu-roldan .mug { background-size: 140%, 100%; background-position: -44px -23px, 0 0; } #david-atkinson .mug { background-size: 126%, 100%; background-position: -28px -15px, 0 0; } #keith-wynroe .mug { background-size: 116%, 100%; background-position: -32px -2px, 0 0; } #owen-dudney .mug { background-size: 124%, 100%; background-position: -31px -23px, 0 0; } #tom-davidson .mug { background-size: 131%; background-position: -29px -21px; } #neil-thompson .mug { background-size: 123%; background-position: -28px -14px; } #jenny-xiao .mug { background-size: 119%, 100%; background-position: -21px -17px, 0 0; } #ben-cottier .mug { background-size: 127%, 100%; background-position: -32px -26px, 0 0; } #maria-de-la-lama .mug { background-size: 128%, 100%; background-position: -26px -45px, 0 0; } #robi-rahman .mug { background-size: 137%, 100%; background-position: -42px -35px, 0 0; } .person:not(.mouse-over-resources):hover { cursor: pointer; } .person:hover, .person.selected { box-shadow: 0 0 6px 3px rgb(0 0 0 / 55%); } .person-resource, .person-resource:hover { color: black !important; margin-right: 0.4em; } .profile-modal .person-resource { margin-right: 0.5em; } .profile-modal .mug { width: 100%; border-radius: var(--default-radius); transition: 0.3s; width: 200px; height: 200px; object-fit: cover; } .person a { color: black !important; text-decoration: none; } .person-info { padding: 4px; } .person-role { font-weight: bold; font-size: 13px !important; font-height: 15px; } .person-name, .person-role { font-weight: bold; font-size: 20px; margin-bottom: 2px; } .person-description { margin-top: 15px; display: none; } .modal-header { align-items: flex-start; } .modal-content { display: flex; } .modal-content .description { flex: 0 0 60%; margin-right: 1em; } .modal-content .image { width: 100%; } @media (max-width: 650px) { .profile-modal .image { display: none; } .profile-modal .description { margin-right: 0; flex-grow: 1; } .profile-modal-content { display: block; } } Jaime Sevilla Director Jaime Sevilla is the director of Epoch AI. His research is focused on technological forecasting and the trajectory of AI. He has a background in Mathematics and Computer Science. Tamay Besiroglu Associate Director Tamay Besiroglu is the associate director at Epoch AI. His work focuses on the economics of computing and big-picture trends in machine learning. Previously, he was a researcher at the Future Tech Lab at MIT, led strategy for Metaculus, consulted for the UK Government, and worked at the Future of Humanity Institute. Lennart Heim Strategy Specialist Lennart Heim supports Epoch AI’s research and strategy. He extracts the strategy and policy implications of Epoch AI’s investigation for the AI governance community. In his primary role, Lennart is a researcher at RAND. He leads the compute research in the Technology and Security Policy Center within RAND Global and Emerging Risks. His research interests include the role of compute in the production of AI, the compute supply chain, forecasting emerging technologies, and the security of AI systems. Pablo Villalobos Staff Researcher Pablo Villalobos has a background in Mathematics and Computer Science. After spending some time as a software engineer, he decided to pivot towards AI. His interests include the economic consequences of advanced AI systems and the role of algorithmic improvements in AI progress. Marius Hobbhahn Research Fellow Marius Hobbhahn builds models for AI timelines and takeoff using historical trends and his best understanding of the future. Anson Ho Staff Researcher Anson Ho is a researcher at Epoch AI. He is interested in helping develop a more rigorous understanding of future developments in AI and its societal impacts. Prior to this, he completed his BSc in physics at the University of St Andrews. Edu Roldán Lead Software Engineer Edu Roldán is a software developer at Epoch AI. He helps maintaining the website and assists with other programming tasks, helping the team to delve into research. let people = { 'jaime-sevilla': { id: 'jaime-sevilla', name: "Jaime Sevilla", description: `<span class="description-name">Jaime Sevilla</span> is the director of Epoch AI. His research is focused on technological forecasting and the trajectory of AI. He has a background in Mathematics and Computer Science.`, role: 'Director', imageUrl: '/assets/images/team/original/jaime-sevilla.jpg', resources: [ {name: 'mail', icon: 'envelope', url: 'amFpbWVAZXBvY2guYWk='}, {name: 'twitter', icon: 'twitter', url: 'https://twitter.com/Jsevillamol'}, {name: 'website', icon: 'globe', url: 'https://jaimesevilla.me/'}, ], }, 'tamay-besiroglu': { id: 'tamay-besiroglu', name: "Tamay Besiroglu", description: `<span class="description-name">Tamay Besiroglu</span> is the associate director at Epoch AI. His work focuses on the economics of computing and big-picture trends in machine learning. Previous