title = "A Time-Invariant Version of Laplace’s Rule | Epoch AI"
description = "We explore how to estimate the probability of an event given information of past occurrences. We explain a problem with the naive application of Laplace’s rule in this context, and suggest a modification to correct it."
full_description = 'What is the probability that the sun will rise tomorrow? What are the chances of a pandemic happening next year? What are the odds of survival of a new surgery that has been successfully executed only once? These and many other questions can be answered appealing to a general rule: Laplace’s rule of succession. This rule describes the probability of a positive outcome given information about past successes. The versatility and generality of the rule makes it an invaluable tool to forecasters, who use it to estimate base rates1. Laplace’s rule can be stated in simple terms. If we have repeated an experiment \(T\) times, and observed \(S\) successes, we can estimate the posterior probability of obtaining a success in the next trial as \(p = \frac{S+1}{T+2}\). However, there is a fatal problem when applying the rule to observations over a time period, where the definition of what constitutes a trial is not as clear. For example, if we were to estimate the chances of a pandemic happening next year. Should we take \(T\) as the number of years that our dataset of past pandemics covers? Or as the number of days? This essentially arbitrary choice leads to different answers to our question2. After grappling with this problem, our final recommendation is a simple formula. Essentially, if we have data on a time period of \(T\) years, and we have observed \(S\) successes over that period, the chances that no successes will happen in the next \(t\) years are \((1+\frac{t}{T})^{-(S+1)}\). We call this formula the time-invariant Laplace’s rule. If we have chosen the observation period \(T\) so that it is equal to the time since the first recorded success, we will subtract one success from our count, and the probability ought to be instead \((1+\frac{t}{T})^{-S}\). This is because in this case we always expect the sampling period to have at least one success, so the first success provides us with no new information to update our prior on. Number of observed successes S during time TProbability of no successes during t time\(S = 0\)\((1+\frac{t}{T})^{-1}\)\(S > 0\)\((1+\frac{t}{T})^{-S}\) if the sampling time period is variable\((1+\frac{t}{T})^{-(S+1)}\) if the sampling time period is fixed Graph showing values of the formula \((1+\frac{t}{T})^{-S}\) for various values of \(S\) It’s important to note that this rule is recommended only as a replacement for Laplace’s rule and suffers from most of the same problems. In cases where Laplace’s rule is too aggressive because of its assumption of a virtual success, our time-invariant rule will also be too aggressive for the same reason. This problem becomes more pronounced the less evidence we’ve had to update on, so we should expect the rule to perform particularly poorly in cases when prior knowledge suggests the time until a success should be long but our observation period so far has been short. In such cases a more careful analysis would try to integrate that information to the prior, for example as outlined in this article. In practice, approaches which take such information into account are superior, but they take us into the realm of semi-informative priors from the realm of uninformative priors, and this subject is outside the scope of our post. This article is structured as follows: First, we will refresh Laplace’s rule of succession and how to apply it. Second, we will expose the time-inconsistency problem by way of an example. Third, we will explain how to fix it and derive a time-invariant version of Laplace’s rule. Fourth, we will illustrate the application of the time-invariant version of Laplace’s rule with an example. We conclude with a set of recommendations for forecasters. Familiarity with Laplace´s rule of succession is recommended for this article. If you haven´t encountered Laplace´s rule before, we recommend you this past article by Ege Erdil to learn more. A refresher: Laplace’s rule of succession Laplace’s rule of succession says that if we have observed S successes over T trials we should estimate the probability of success in the next trial as \(\frac{S+1}{T+2}\). This is derived starting from a uniform prior on the probability of success per trial \(p \sim U(0,1)\), and applying a Bayesian update and taking the expected value of the result. We will not enter into the details of the derivation here, though we refer interested readers to this article. Laplace’s rule of succession is often interpreted as introducing one virtual instance of success and one virtual instance of failure to our actual success and failure counts. This prevents us from reducing to \(0\) the probability of an event that has not happened before. Laplace’s rule of succession can be applied successively to infer the probability that no successes will happen over the next \(t\) trials: \[P(\text{No successes in $t$ attempts} | \text{$S$ successes in $T$ attempts}) = \\\]\[= P(\text{No success in attempt T+1} | \text{$S$ successes in $T$ attempts}) \cdots P(\text{No success in attempt T+t} | \text{$S$ successes in $T+t-1$ attempts}) =\]\[= (1 - \frac{S+1}{T+2}) \cdots (1-\frac{S+1}{T+t+1}) = \prod_{i=1}^{t}(1 - \frac{S+1}{T+i+1})\] When expanding the chain, we have taken care of updating on the failures so far. Success becomes more and more unlikely the more time goes on without ever seeing it. The problem of time The problem with Laplace’s rule becomes apparent when we try applying it to a problem when there isn’t a clear definition of what constitutes a trial. Instead, we have observations of success gathered over a period of time. Let’s suppose we are studying the likelihood of an earthquake. We have observed the seismograph of the Exampletopia region for a decade, and observed no earthquakes so far. The guild of architects of Exampletopia wants to know if the good luck will continue onto the next decade. Ada the chief seismologist wastes no time in answering. We have seen no earthquakes over a decade. So by Laplace’s rule, the likelihood of no earthquakes happening in the next decade is \(1 - \frac{S+1}{N+2} = 1 - \frac{0+1}{1+2} = \frac{2}{3}\). Byron the assistant seismologist takes a bit more time to answer. A decade is made of \(10\) years. So the likelihood of no earthquakes happening in the next 10 years, per our reasoning above, is: \[(1 - \frac{S+1}{T+2}) \cdots (1-\frac{S+1}{T+t+1}) =\]\[= (1 - \frac{0+1}{10+2}) \cdots (1-\frac{0+1}{10+10+1}) =\]\[= \frac{11}{12} \frac{12}{13} \cdots \frac{19}{20} \frac{20}{21} = \frac{11}{21}\] The seismologists are getting different results! Furthermore, these are not the only two possible results. had they divided the decade of observations into \(N\) periods, then they would have found a probability of no earthquakes happening equal to: \[(1 - \frac{S+1}{T+2}) \cdots (1-\frac{S+1}{T+t+1}) =\]\[= (1 - \frac{0+1}{N+2}) \cdots (1-\frac{0+1}{N+N+1}) =\]\[= \frac{N+1}{N+2} \cdots \frac{2N}{2N+1} = \frac{N+1}{2N+1}\] This result is absurd - the probability should not depend on how finely we subdivide the observations. Clearly Laplace’s rule cannot be applied naively in this setting. But what should we do instead? A problem of priors The reason the seismologists are getting different results is because they are starting from different priors for the probability of an earthquake. Recall that Laplace´s rule is derived assuming a uniform distribution on the prior probability of the event of interest in each trial. Ada defines each trial as a decade, so her prior probability (before taking into account the observations) of the chances of no earthquake over a decade (a single trial) is \(\frac{1}{2}\). In contrast, Byron is working with years as his trial probability. The prior probability of no earthquakes for a decade from his point of view is \(\frac{1}{2} \frac{2}{3}\cdots \frac{10}{11} = \frac{1}{11}\). No wonder their results are distinct! If you start from different assumptions it stands to reason that you will get different results. This also suggests what we ought to do in order to fix the problem. We want a recipe to choose an (improper) prior that assigns the same probability of no earthquakes over any unit of time, no matter how finely you subdivide time. But before we need to shift our perspective, from the discrete to the continuous. Continuous improvement So far we have been thinking about Laplace’s rule in a discrete setting. We have a number of \(T\) discrete trials, and \(S\) of those result in successes. Instead, we want to take this process to the limit. We observe our process of interest over a continuous interval of time of length \(T\). And we observe \(S\) successes over that time. The natural way to model the amount of occurrences that happen in an interval of time is a Poisson distribution. The Poisson distribution is parameterized by a rate parameter \(\lambda\), that represents the mean of events per unit of time we expect to observe. Since we are observing the interval over \(T\) units of time, we model the number of observations we have seen so far as a \(\text{Poisson}(\lambda T)\). This continuous setup encompasses all possible step lengths in the discrete one. We could recover the discrete setup defining binary variables that indicate if a success happened in a day, a month or a year. So we aren’t losing any flexibility by switching to the continuous setup3. And when forecasting, we can vary the \(T\) variable to infer how likely is to observe a given quantity of successes over a period of arbitrary length. But before, we need to settle on a prior for \(\lambda\) and update it given the observations we have. The scale invariant prior Given that we want to do Bayesian inference, we have to pick some prior for \(\lambda\). How do we go about making this choice? Suppose for the moment that the only fact we know about the arrival rate \(\lambda\) is that it’s an arrival rate and strictly greater than zero, though it could be arbitrarily close to zero. Since it’s an arrival rate, we know that it’s measured in units of time inverse, i.e. in units of frequency. So a particularly natural condition we could ask for in a state of total agnosticism about \(\lambda\) is that the prior distribution \(f(\lambda) \, d \lambda\) we assign to it does not change when we perform a change of time units. In formal terms, we want to get the same answer when we do a change of units and then use \(f\) to get a prior as we would when we use \(f\) first and then do a change of units - we want the two operations to commute. If this condition holds, we won’t have the problem we had with Laplace’s rule above. Regardless of how we end up subdividing the original interval we’ll always get the same prior distribution on \(\lambda\), and then performing a Bayesian update on it will always get us to the same posterior. It will be measured in different units, but this won’t affect any of the probabilities we calculate. Let’s find which \(f\) makes this condition hold. Say that the two units of time we consider are related by a scaling constant \(1/c\), so that a unit change amounts to a substitution \(\lambda \to c \lambda_n\) - the subscript is used to denote that the right hand side is measured in the “new frequency unit”. If we get the prior first and then do a change of units, we’ll get \(c f(c \lambda_n) d \lambda_n\) as our probability measure. On the other hand, if we do a change of units first and then compute the prior, we’ll just get \(f(\lambda_n) d \lambda_n\). For these to be equal, we must have \(c f(c \lambda_n) = f(\lambda_n)\) for all \(c, \lambda_n > 0\), which implies that \(f(\lambda) \propto 1/\lambda\).4 There’s a problem with the scale-invariant prior \(f(\lambda) \, d\lambda = d\lambda/\lambda\): its integral over the whole positive reals is infinite, so though it defines a legitimate measure over the positive real numbers, this measure is not a probability measure. We can’t divide it by some finite constant to normalize it so that the total probability mass equals 1, as it must for a genuine probability distribution. This means it’s an improper prior. Even though improper priors are not normalizable, we can still use Bayes’ rule on them. In some cases, the posterior we get after some Bayesian updates can kill off their divergences that make them non-normalizable. In our case, these are the bad divergences the integral of \(d\lambda/\lambda\), or the natural logarithm, has at \(\lambda = 0, \, \infty\). Intuitively this is because given that we don’t know what units we’re measuring the arrival rate in, it can both be “very small” and “very large”. Unless the evidence we have excludes both possibilities, we will be unable to get any answers out of the scale-invariant prior. Inference with the scale-invariant prior Fortunately, the scale-invariant prior falls into the conjugate class of the Poisson likelihood. In particular, it can be expressed as a Gamma distribution with shape parameter \(\alpha=0\) and inverse-scale parameter \(\beta=0\). This means that it is straightforward to update the distribution of \(\lambda\) given the observed number of successes \(S\) and the length of observed time \(T\). The posterior distribution will be \(\lambda \sim \text{Gamma}(S, T)\). Then the amount of successes in the next \(t\) units of time is distributed as a Poisson with rate \(t \lambda\). The chances that no successes will be observed during this period are then:5 \[P(S’=0) = \int_0^\infty P(S’=0 | \lambda) f(\lambda) d\lambda = \int_0^\infty e^{-t\lambda} \frac{T^S}{\Gamma(S)} \lambda^{S-1}e^{-T\lambda} d\lambda = (1+\frac{t}{T})^{-S}\] Summarizing, when we observe \(S\) successes over a period \(T\) of time, we recommend estimating the probability of no successes for an additional time t as \((1+\frac{t}{T})^{-S}\) 6. Unprecedented success In the case where the observed number of success is equal to zero the formula we presented no longer works; we would get the absurd result \(P(S’ = 0) = (1+\frac{t}{T})^{-S} = (1+\frac{t}{T})^0 = 1\). This is because we have that the posterior distribution for \(\lambda\) is \(\text{Gamma}(0, T)\), whose PDF is \(f(\lambda) = \frac{T^S}{\Gamma(S)} \lambda^{S-1}e^{-T\lambda} = \lambda^{-1}e^{-T\lambda}\). This distribution is still not integrable, leading to the absurd result. We have worked out two reasonable alternatives in this situation. One is to take the limit of the Laplace’s rule estimate as we divide time into \(N\to \infty\) parts. The second is to apply a weak version of Solomonoff induction . These approaches are worked out in appendices A and B, respectively. Both alternatives lead to the same recommendation: if we have observed for a time \(T\), then the probability of seeing no successes during \(t\) extra time is \((1+\frac{t}{T})^{-1}\). This result is astonishingly similar in form to the formula we worked out before. We can interpret it as adding one virtual success to make the prior integrable, as noted in the previous section. This echoes how a virtual success and a virtual fail'
author = "Jaime Sevilla"
