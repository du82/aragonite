 id: 'marius-hobbhahn', name: "Marius Hobbhahn", description: `<span class="description-name">Marius Hobbhahn</span> builds models for AI timelines and takeoff using historical trends and his best understanding of the future.`, role: 'Research Fellow', imageUrl: '/assets/images/team/original/marius-hobbhahn.jpg', resources: [ ], }, 'anson-ho': { id: 'anson-ho', name: "Anson Ho", description: `<span class="description-name">Anson Ho</span> is a researcher at Epoch AI. He is interested in helping develop a more rigorous understanding of future developments in AI and its societal impacts. Prior to this, he completed his BSc in physics at the University of St Andrews.`, role: 'Staff Researcher', imageUrl: '/assets/images/team/original/anson-ho.jpg', resources: [ {name: 'mail', icon: 'envelope', url: 'YW5zb25AZXBvY2guYWk='}, {name: 'website', icon: 'globe', url: 'https://ansonwhho.github.io/'}, ], }, 'edu-roldan': { id: 'edu-roldan', name: "Edu Roldán", description: `<span class="description-name">Edu Roldán</span> is a software developer at Epoch AI. He helps maintaining the website and assists with other programming tasks, helping the team to delve into research.`, role: 'Lead Software Engineer', imageUrl: '/assets/images/team/original/edu-roldan.jpg', resources: [ {name: 'mail', icon: 'envelope', url: 'ZWR1QGVwb2NoLmFp'}, ], }, }; document.addEventListener("DOMContentLoaded", function() { MicroModal.init({ awaitCloseAnimation: true, }); let backgroundImage = null; let modal = document.querySelector('#person-modal'); document.body.appendChild(modal); // In case it's defined deep, let's move the modal up function showModal(personDom, person) { let modal = document.querySelector('#person-modal'); modal.querySelector('.modal-title').innerHTML = person.name; modal.querySelector('.person-role').innerHTML = person.role; modal.querySelector('.description').innerHTML = person.description; modal.querySelector('.modal-container').scrollTop = 0; modal.querySelector('.mug').src = ''; modal.querySelector('.mug').src = person.imageUrl; if (backgroundImage) { modal.querySelector('.mug').style.backgroundImage = `url(${backgroundImage})`; } modal.querySelector('.modal-footer').innerHTML = ''; for (let resource of person.resources) { let resourceDom; if (resource.name == "mail") { resourceDom = u(`<a class="person-resource" data-contact="${resource.url}" href="#"><i class="bi bi-${resource.icon}"></i></a>`).first(); addMailDeobfuscator(resourceDom); } else { resourceDom = u(`<a class="person-resource" href="${resource.url}"><i class="bi bi-${resource.icon}"></i></a>`).first(); } modal.querySelector('.modal-footer').appendChild(resourceDom); } MicroModal.show('person-modal', { onShow: () => { personDom.classList.add('selected'); // For some reason, the resources get focused when the modal is shown document.activeElement.blur(); }, onClose: () => { personDom.classList.remove('selected'); }, }); } for (let person of document.querySelectorAll('.person')) { let mug = person.querySelector('.mug'); let resources = person.querySelector('.person-resources'); resources.addEventListener('mouseenter', () => person.classList.add('mouse-over-resources')); resources.addEventListener('mouseleave', () => person.classList.remove('mouse-over-resources')); person.addEventListener('click', (e) => { if (e.target != resources && !resources.contains(e.target)) { showModal(person, people[person.id]); } }); } }); Our work involves close collaboration with other organizations, Open Philanthropy, and Rethink Priorities’ AI Governance and Strategy team. We are advised by Tom Davidson from Open Philanthropy and Neil Thompson. Rethink Priorities is also our fiscal sponsor. Our mission Epoch AI seeks to clarify when and how transformative AI capabilities will be developed. We see these two problems as core questions for informing AI strategy decisions by grantmakers, policy-makers, and technical researchers.1 We believe that to make good progress on these questions we need to advance towards a field of AI forecasting. We are committed to developing tools, gathering data and creating a scientific ecosystem to make collective progress towards this goal. Our research agenda Our work at Epoch AI encompasses two interconnected lines of research: The analysis of trends in machine learning. We aim to gather data on what has been happening in the field during the last two decades, explain it, and extrapolate the results to inform our views on the future of AI. The development of quantitative forecasting models related to advanced AI capabilities. We seek to use techniques from economics and statistics to predict when and how AI will be developed. These two research strands feed into each other: the analysis of trends informs the choice of parameters in quantitative models, and the development of these models brings clarity on the most important trends to analyze. A sketch of Epoch AI’s research agenda. We plan to develop quantitative models to forecast advanced AI capabilities, and to res'''
