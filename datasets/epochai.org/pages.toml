["https://epochai.org/blog/announcing-epoch-ai-data-hub"]
title = "Announcing Epoch AI’s Data Hub | Epoch AI"
description = "We are launching a hub for data and visualizations, to make our databases more accessible for users and researchers. It currently features our data on notable and large-scale AI models."
full_description = '''Our data on the trajectory of AI has been valuable for policymakers, journalists, and other stakeholders. Our research, for example on training compute or model development costs, relies on our data. Now, we are creating a new Data on AI page as a central hub for all of this data. This includes key insights, interactive visualizations, and detailed documentation to inform users on how the data were collected. Currently, the page hosts two datasets. Our collection of notable AI models tracks key factors driving machine learning progress in over 800 historically significant AI models. The database contains information on development, training details, and more. Among other key information, we track training compute, dataset sizes, parameter counts, and training hardware. A new interactive visualization tool allows users to explore these details, examining trends in time and breakdowns by machine learning domain. Figure 1: Visualization of notable AI models and the overall trend of training compute overtime. The second dataset, devoted to large-scale AI models, features over 180 models that have been trained with large-scale compute: 1023 floating-point operations or more. You can compare the largest models to regulatory thresholds, learn why we chose to focus on training compute to define large models, and which organizations and countries developed these models. {"title": "Large-scale models by domain and publication date", "xAxis": {"label": "Publication date", "lim": [2016.6269748858447, 2024.8335273972605], "scaleType": "linear", "ticks": [2016.0, 2017.0, 2018.0, 2019.0, 2020.0, 2021.0, 2022.0, 2023.0, 2024.0, 2025.0], "tickLabels": ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"], "hideMinorGrid": true, "nice": false}, "yAxis": {"label": "Training compute (FLOP)", "lim": [7.40608926488071e+22, 6.818713385008506e+25], "scaleType": "log", "ticks": [1e+21, 1e+22, 1.0000000000000001e+23, 1e+24, 1e+25, 1e+26, 1e+27