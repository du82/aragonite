["https://epsil.github.io/gll"]
title = "General Parser Combinators in Racket"
description = "How to implement a general parser combinator framework which handles left-recursive and ambiguous grammars."
full_description = '''General Parser Combinators in Racket Vegard Øye How to implement a general parser combinator framework which handles left-recursive and ambiguous grammars. This article explains how to implement a general parser combinator framework in Racket, a Lisp dialect with roots in Scheme. However, the principles are not specific to Racket and could be expressed in any language; porting is outlined at the end of the article. All the code is released freely on GitHub under the MIT License. You can download a Zip file, or you can clone the repository with the following command: git clone https://github.com/epsil/gll.git The repository also includes the full text of the article in Markdown format (Pandoc flavor). I welcome suggestions and improvements! Feel free to open an issue on the bug tracker, or to fork the repository. You can also contact me, Vegard Øye, at vegard (underline) oye (at) hotmail (dot) com. The article aims to be an accessible introduction to the ideas found in the papers “Memoization in Top-Down Parsing” by Mark Johnson and “Generalized Parser Combinators” by Daniel Spiewak. If you are interested in the topic, I especially recommend you go on to read Spiewak’s paper. It is very good. Other reading suggestions are provided at the end. Introduction Traditional top-down parsers cannot handle all recursive grammars, even if recursion may be the most natural way to express the language. An example is the following grammar for left-associative arithmetic on 0’s and 1’s: expr -> expr "+" num | expr "-" num | num num -> "0" | "1" If we attempt to translate the first rule directly into a self-calling function, the resulting parser will never terminate; instead it enters an infinite regress before consuming any input. The traditional approaches to parsing left-recursive grammars are to rewrite the grammar or use a bottom-up parser generator. The parsers in this article, by contrast, can be freely composed without regard for left-recursion. Defining a parser for the above grammar is straightforward: (define-parser expr (alt (seq expr (string "+") num) (seq expr (string "-") num) num)) (define-parser num (alt (string "0") (string "1"))) Furthermore, the parsers support ambiguity. Parse results are computed one at a time and returned as a lazy stream: > (expr "1+0") #<stream> The worst-case efficiency of the parser in this article is O(n4), but with more efficient data structures, O(n3) is achievable. Furthermore, by adorning the parsers with additional metadata, LL(1) grammars can be parsed in O(n) time. See the references for details on optimization. The article is organized into several stages, leading up to a complete interpreter for arithmetic expressions. To get there, the parsers will be rewritten multiple times: First, we will write a simple, top-down combinator framework, implementing things in the conventional way. This won’t handle left-recursive grammars in any form, but introduces a simple syntax for composing parsers. Next, we will rewrite the parsers to continuation-passing style. Although functionally equivalent to the previous version, the continuations make the code more flexible and set the stage for implementing general parsers. We will now add support for left-recursive grammars. This is done by memoizing parse results and continuations, so that nothing is computed more than once. This is the most important step, and we will study it in some detail to develop our intuition. To optimize the code, we will add a trampoline to store parse results and dispatch function calls. The trampoline is a shared data structure passed down from one parser to another. Now we have the wherewithal to implement a lazy parse process. The parsers will return a stream of parse results, computing the results as they are requested. The article aims to be easy to understand, but is necessarily of some length. If you are familiar with parser combinators, you can skim through the first sections. The key ideas are introduced in the section on continuation-passing style. The rest of the text deals with optimization of those ideas. Simple parser combinators Let us start by defining some terms. A parser is a function that takes a string as input and returns a parse result. A parse result is either a success or a failure. (All our parsers will work on strings, but one could easily define parsers working on a stream of symbols or tokens.) A parser combinator is a function that takes parsers as input and returns a new parser. In other words, it’s a higher-order function, taking functions as input and returning another function as output. Using parser combinators, we can build larger parsers out of smaller parsers. First we will define data types for parse results. A successful result contains two values: a value and the current string position. The value can for example be an abstract syntax tree, while the position is represented as the rest of the string. A failing result just contains the position where the parser failed, which can be used for error reporting. (struct success (val rest) #:transparent) (struct failure (rest) #:transparent) This Racket code defines success and failure as constructor functions for parse results. For example, we can create a successful result with the expression (success val rest), and a failure with (failure rest). We can also pattern match against these expressions, which will be demonstrated later. The #:transparent option makes the values printable. First, we look at a trivial parser that accepts any input and returns a successful result containing some predefined value. For creating such parsers, we define the function succeed, which takes the predefined value as a parameter. (This common function is also known as “empty”, “epsilon”, “result”, “yield”, or “return”.) (define (succeed val) (lambda (str) (success val str))) Note that succeed returns another function (lambda (str) ...), that is, a parser. For example, (succeed '()) creates a parser which succeeds with the empty list: > (succeed '()) #<procedure> > ((succeed '()) "foo") (success '() "foo") The next step is to compare the beginning of the input against some match string. Let us create a general function string for constructing such a parser. This function takes a matching string as input and returns a parser for matching against that string: (define (string match) (lambda (str) (let* ((len (min (string-length str) (string-length match))) (head (substring str 0 len)) (tail (substring str len))) (if (equal? head match) (success head tail) (failure str))))) We can create a parser for matching, say, "foo" with (string "foo"). If the input matches, then the parser returns a successful result where the "foo" part is consumed; otherwise it returns a failure. For example, the input "foobar" gives a value of "foo" and a rest of "bar": > ((string "foo") "foobar") (success "foo" "bar") > ((string "foo") "bar") (failure "bar") The functions succeed and string could be regarded as basic “parser generators”: both create parsers on the basis of a given specification. The parsers they create are often called terminal parsers, because they match against a terminal expression in the grammar. All the terminal parsers in this article work on strings, but one could easily modify them to accept a stream of symbols or tokens. Now that we have some basic parsers, it is time to combine them. The first combinator is the alternatives combinator, which chooses between alternative parsers. It returns a combined parser that tries each alternative in turn until one of them matches. (define (alt a b) (lambda (str) (let ((result (a str))) (match result [(success val rest) result] [failure (b str)])))) Here we see Racket’s pattern matching in action. We invoke the first parser with (a str) and match against its result. If we get a successful parse result (success val rest), we return that. Otherwise, we invoke the second parser with (b str). The next combinator is the sequence combinator, which chains parsers together. The output of one parser is taken as the input to another. Here is our first attempt at defining this combinator, using pattern matching: (define (seq a b) (lambda (str) (match (a str) [(success val1 rest1) (match (b rest1) [(success val2 rest2) (success (list val1 val2) rest2)] [failure failure])] [failure failure]))) If we get a successful result (success val1 rest1) from the first parser, we pass its remainder to the next parser with (b rest1). If it also succeeds, we return a combined parse result. In all other cases, we return failure. (For simplicity, the alt and seq combinators take exactly two arguments; later we will write general versions accepting any number of arguments.) However, because we are going to rewrite the parsers several times, it will be beneficial to express this combinator in a more abstract way. We therefore define a low-level “plumbing” function, bind, for chaining things together: (define (bind p fn) (lambda (str) (match (p str) [(success val rest) ((fn val) rest)] [failure failure]))) The bind function takes two arguments, a parser p and a function fn, and returns another parser. The fn function must be of the same kind as the “parser generators” we saw earlier: it must return a parser on the basis of an input value. Together, p and fn become a parser which initially invokes p on the input. If the result is successful, then its value-part is passed to fn to create another parser. That parser is then invoked on the rest of the input. We can now define seq in terms of bind: (define (seq a b) (bind a (lambda (x) (bind b (lambda (y) (succeed (list x y))))))) This terse definition can be read as: “Invoke the first parser a and bind the value-part of the result to x. Then invoke the second parser b and bind the value-part of the result to y. Finally, create a combined parse result from x and y.” If any of the parsers fail, then bind stops; only successful results are passed down the chain. Thus, bind frees us from the burden of repeatedly doing pattern matching and discarding failing results. Let us now look at a complete example. The following implements a simple linguistic grammar taken from Structure and Interpretation of Computer Programs: (define article (alt (string "the ") (string "a "))) (define noun (alt (string "student ") (string "professor "))) (define verb (alt (string "studies ") (string "lectures "))) (define noun-phrase (seq article noun)) (define verb-phrase (seq verb noun-phrase)) (define sentence (seq noun-phrase verb-phrase)) We can parse a sentence with: > (sentence "the professor lectures the student ") (success '(("the " "professor ") ("lectures " ("the " "student "))) "") > (sentence "not a sentence ") (failure "not a sentence ") For the time being, the parse result isn’t too informative; later we will define a combinator for modifying it. In any case, we can definitely see that there is parsing going on! Memoization We now turn to the issue of efficiency. Currently, none of the functions cache their results. That is wasteful because parsing is a such a repetitious task. If each function maintains a table over its input and output values, it can avoid calculating things twice by returning the cached value instead. This is called memoization. In Racket, it is easy to write a memo function that takes any function as input and wraps it in a memoization routine. The wrapper takes the input arguments and looks them up in a memoization table. If it finds an output value, it just returns that. If not, then it calls the original function, saves its output in the table, and returns the output. Future calls with the same arguments will return the memoized value. The following is loosely adapted from SICP: (define (memo fn) (let ((alist (mlist))) (lambda args (match (massoc args alist) [(mcons args result) result] [_ (let* ((result (apply fn args)) (entry (mcons args result))) (set! alist (mcons entry alist)) result)])))) We implement the memoization table as a mutable association list, using the Racket function massoc to access it. It is actually a list of mutable cons cells (args . result). If massoc returns a cons cell, we match against it and return the result. Otherwise (the wildcard pattern is denoted by _), we call the original function with (apply fn args), store the result in a cons cell, insert it into the table, and then return the result. Now we can easily memoize our definitions. For example, here is a memoized version of alt: (define (alt a b) (memo (lambda (str) (let ((result (a str))) (match result [(success val rest) result] [failure (b str)]))))) This combinator returns a memoized parser. We can memoize all the functions in this way. There is one more wrinkle to sort out. Because Racket evaluates expressions eagerly, we run into a “tying the knot” problem when defining self-referential parsers: (define r (alt (seq (string "a") r) (string "a"))) This will give an error because r is evaluated as an argument to seq before r is defined. We need to delay the evaluation somehow. One solution is to wrap the code in a function: (define r (lambda (arg) ((alt (seq (string "a") r) (string "a")) arg))) Now the code is evaluated not when the parser is defined, but when it is invoked. To make things more convenient, we can create a delay-parser macro which automatically delays the code for us, as well as a define-parser macro for delayed parser definitions. (define-syntax-rule (delay-parser parser) (lambda args (apply parser args))) (define-syntax-rule (define-parser parser body) (define parser (delay-parser body))) Now we can write: (define-parser r (alt (seq (string "a") r) (string "a"))) However, because the evaluation is delayed, a new parser instance is created each time the parser is used! This is solved by memoizing the combinators too: each combinator will only create a given parser once. Recall that (define (alt a b) ...) is syntactic sugar for (define alt (lambda (a b) ...)): (define alt (lambda (a b) (memo (lambda (str) ...)))) This is the same combinator as before, just written in a slightly different way that emphasizes the function that is bound to alt. Now we can memoize the combinator itself: (define alt (memo (lambda (a b) (memo (lambda (str) ...))))) When we memoize both the parsers and the parser combinators, parsing is efficient and the delayed execution only creates a single parser instance. The current parser combinators support recursion to a limited degree. The r parser is right-recursive because the self-reference is “to the right” in the sequence. Therefore, r will always consume some part of the input string (an "a") before recursing. In a left-recursive grammar, on the other hand, the self-reference comes first: (define-parser s (alt (seq s (string "a")) (string "a"))) This parser will enter an infinite regress because it repeatedly calls itself before consuming any input. To handle left-recursive grammars, we need to reimagine the parser combinators. Continuation-passing style So f'''
