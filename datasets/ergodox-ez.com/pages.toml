title = "Our Keycaps | ErgoDox EZ"
description = "No coupons, no hype, no tooting our own horn. The Ergo has interviews, curated finds from all over the Web, and a monthly wallpaper that's, frankly, addictive."
full_description = "Our KeycapsBlank, sculpted keycapsThe professional name for these keycaps is DCS, and they are made by Signature Plastics. There are a few things you should know about them:They are sculptured, which means each row of keys is differently shaped. If you carefully look at the first image, you will see this: The bottom keys are angled upwards to meet your fingers, while the top keys are angled down.They come with tactile nubs on the two keys where F and J usually sit (for QWERTY). So you can rest your fingers on them and know you're on the home row.They are made of PBT plastic.The blank keycaps are ideal for users who are comfortable touch typing and don't need to locate individual keys out of context (i.e, hit just the J key on its own suddenly).Printed, uniform keycapsThese keycaps, also made by Signature Plastics, come with letters and characters printed on them. Here's what you need to know about them:Only the 1x1 keys on the body of the keyboard have characters, as you can see here. This is an intentional choice, as it allows you to decide what the keys on the periphery of the keyboard do. Those outside keys are blank so you'll never end up with labels that are wrong.All of the keys are the same profile (DSA). This means you can move them around as needed — if you use Colemak, Norman, Dvorak, or any other alternate keyboard layout, for exampleWhen ordering printed keycaps you get two sets of F and J keys, with tactile nubs and without tactile nubs. You can choose which to use.They are made of ABS plastic.Printed, backlit keycaps[For ErgoDox EZ Glow]To make the ErgoDox EZ Glow happen, we partnered with an entirely new keycap vendor, Tai-Hao. These printed keycaps are made in Taiwan according to our specifications, in black and white.The characters are doubleshot with milky see-through plastic, and are placed directly over the LED for maximum visibility.Only the 1x1 keys on the body of the keyboard have characters, as you can see here. This is an intentional choice, as it allows you to decide what the keys on the periphery of the keyboard do. Those outside keys are blank so you'll never end up with labels that are wrong.All of the keys are the same profile (OEM Row 3). This means you can move them around as needed. If you use Colemak, Norman, Dvorak, or any other alternative keyboard layout, you'll be able to move them around.As of January 2019, when ordering Glow keycaps you get two sets of F and J keys, with tactile nubs and without tactile nubs. You can choose which to use.They are made of PBT plastic."
