nActuation Force60±10gfPre-travel2.0±0.6mmFeeltactileCompared to Cherry MX Brown, its sound is pitched a little lower and more subdued, and its return action is less pronounced.Listen to Tisha talk about this switch in more detailKailh BronzeActuation Force50±10gfPre-travel1.1±0.4mmFeelclickyClicks once on the downstroke, and clicks again on the upstroke. A high-pitched, crisp click. Light, precise, and utterly unique - this keyswitch is addictive.Listen to Tisha talk about this switch in more detailKailh GoldActuation Force60±10gfPre-travel1.4±0.3mmFeelclickyIts click is crisp and precise, and its actuation is smooth.Listen to Tisha talk about this switch in more detailKailh SilverActuation Force40±10gfPre-travel1.1±0.3mmFeellinearThis is an extremely smooth keyswitch. Light enough not to tire your fingers, and quiet, too. Ideal for soft typing in an office environment.Listen to Tisha talk about this switch in more detailKailh CopperActuation Force40±10gfPre-travel1.1±0.3mmFeeltactileQuite similar to the Kailh Silver, only these are tactile. Think “Brown lite”.Listen to Tisha talk about this switch in more detailKailh Box BrownActuation Force50±15gfPre-travel1.8±0.3mmFeeltactileAs we've come to expect from a switch labeled Brown, the tactile bump is gentle. These feel solid, right between a loud clicky switch and a smooth linear. Actuated slowly, you'd feel an almost buckling effect as the switch reaches its tactile point.Listen to Tisha talk about this switch in more detailKailh Box RedActuation Force45±15gfPre-travel1.8±0.3mmFeellinearThese are very civil switches. Typing on them is a pleasant, gentle experience. The linear action is easy on the fingers, and the sound is a little muted. Like other Kailh switches, actuation is beautifully smooth and fluid.Listen to Tisha talk about this switch in more detailKailh Box WhiteActuation Force45±10gfPre-travel1.8±0.3mmFeelclickySlightly lower in pitch than the Kailh Gold, these are clicky to the point of being crunchy. Actuation is a smidge lighter, and it feels as though the box design might result in a slightly more resonant click.Listen to Tisha talk about this switch in more detailKailh Box BlackActuation Force60±10gfPre-travel1.8±0.3mmFeellinearOh, such springy smoothness. We often think of Black switches as somewhat firm due to the high actuation force, but the buttery smooth action of the Box Black makes them feel lighter somehow. These switches still push back, but they don't feel tiresome.Listen to Tisha talk about this switch in more detailA SummaryHere are the keyswitches we currently offer.SWITCHForcePre-TravelFeelCherry MX Clear65±15gf2.0±0.6mmtactileMore infoA slightly heavier sibling to the Brown switch. The MX Clear has the same qualities of Brown with a bit more resistance, for those who want more pronounced tactile feedback.65±15gfActuation Force2.0±0.6mmPre-traveltactileFeelTisha Talks SwitchesCherry MX Black60±20gf2.0±0.6mmlinearMore infoThink Cherry MX Red, but heavier. Linear, with no tactile or audible feedback.60±20gfActuation Force2.0±0.6mmPre-travellinearFeelTisha Talks SwitchesKailh Gold60±10gf1.4±0.3mmclickyMore infoIts click is crisp and precise, and its actuation is smooth.60±10gfActuation Force1.4±0.3mmPre-travelclickyFeelTisha Talks SwitchesKailh Brown60±10gf2.0±0.6mmtactileMore infoCompared to Cherry MX Brown, its sound is pitched a little lower and more subdued, and its return action is less pronounced.60±10gfActuation Force2.0±0.6mmPre-traveltactileFeelTisha Talks SwitchesKailh Box Black60±10gf1.8±0.3mmlinearMore infoOh, such springy smoothness. We often think of Black switches as somewhat firm due to the high actuation force, but the buttery smooth action of the Box Black makes them feel lighter somehow. These switches still push back, but they don't feel tiresome.60±10gfActuation Force1.8±0.3mmPre-travellinearFeelTisha Talks SwitchesKailh Box Brown50±15gf1.8±0.3mmtactileMore infoAs we've come to expect from a switch labeled Brown, the tactile b