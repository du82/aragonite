["https://ergodox-ez.com/faq"]
title = "FAQ | ErgoDox EZ"
description = "No coupons, no hype, no tooting our own horn. The Ergo has interviews, curated finds from all over the Web, and a monthly wallpaper that's, frankly, addictive."
full_description = '''Magnifying GlassSearchFrequently Asked QuestionsWhen will I receive my EZ? Our current lead time is around two weeks. Most of that time is spent in manufacturing and quality control — actual shipping is very fast, via courier. If you think your keyboard should have shipped but you did not yet get an email with tracking information, you can always write us and ask.Where do you ship? Our keyboards ship to most countries in the world. We use UPS, DHL and FedEx to get your keyboards to you quickly and safely. We ship from Taiwan. We cannot ship to P.O. boxes.How much does shipping cost? The ErgoDox EZ ships for free, woohoo! This is courier shipping, fast and fully tracked.Who is responsible for customs, duties and taxes? If you're ordering from the US, there are no import duties (that's due to US regulations). If you're ordering from the EU, you will be required to pay customs and handling charges. These are typically charged by the local shipping company upon arrival. We are not able to estimate or charge these fees in advance, nor do we have any control over them. These charges are unrelated to the shipping charge. If you're ordering from Canada, you will be charged sales tax at the time of purchase, and you'll be charged sales tax again when you receive your keyboard, since it is shipped from Taiwan by another company. You will also be charged handling charges from the courier, usually under $20 CAD. We will be refunding the second sales tax charge, but not the handling charges from the courier. For us to refund the second charge, please send us a copy of the receipt from the courier. If you're ordering from elsewhere (Brazil, Mexico, India, anywhere else in the world), it is almost certain you will have to pay customs and handling charges. We understand that taxes can be frustrating, but if you order a keyboard and then change your mind because of the taxes your country charges, it means we have to pay UPS to ship it back to us. Therefore, we will not be able to issue a full refund. You can try to get an estimate of these taxes by searching for "Duty Calculator" (we don't link to a specific one as each country has its own, usually). The HS code for our keyboards is 8471.60.20, and we ship from Taiwan.What happens if I don't accept my keyboard when it arrives? If you don't take delivery of your keyboard once it arrives, the courier will try to reach you and eventually return it to us at our expense. We would then refund you the cost of the keyboard, minus $97 shipping fees (the typical cost of a round-trip by courier).What if the courier loses my parcel or it gets stolen? We ship our boards with a signature requirement. If a signature is required on your parcel and it is lost or stolen, the courier will reimburse us, and thus we will be able to refund you. If, however, you contact the courier and explicitly ask them to waive the signature requirement on your parcel, and it then gets stolen (it happens!) we will not be able to refund you in full, but only 50% of your purchase price. In other words, please do not waive the signature requirement on your parcel — it is there so we can refund you if it gets lost or stolen.How much memory does the ErgoDox EZ have? As of September 2024, the ErgoDox EZ comes with 256kb of memory, and the same processor used on our Moonlander and Voyager keyboards. ErgoDox EZ units sold before September 2024 have 32kb of memory and use a Teensy-type processor.What cables ship with the ErgoDox EZ? For orders made prior to February 15, 2022, the ErgoDox EZ came with USB A to mini USB cable for connecting your keyboard to your computer. On February 15 we switched to a USB Type C connector. The board also ships with a TRRS cable for connecting the two halves together. The USB cable is 210cm long and the TRRS cable is 70cm long.What keyswitches work with the "change-it-yourself" feature?' Change-it-yourself (CIY) is a standard feature on all keyboards sold from January 2018 onwards (revision 5 and up). You're not limited to using our keyswitches — any plate-mounted Cherry-compatible keyswitch would work. PCB-mounted switches could work too, but don't always fit as well.What is your warranty policy? We cover our keyboards with our extensive 2-year warranty from original delivery date for the original buyer. Read our full warranty policy. If you feel that something isn't working right, or have any questions regarding our warranty, please contact us.Can I return the keyboard? Absolutely! We have a 30-day return window from the time you get the keyboard. Read our full return policy.What are the red washers that came with my ErgoDox EZ for? The washers you received with your ErgoDox EZ make your tilt/tent kit infinitely adjustable. Simply place the washers between the teeth of the legs and pick any angle you want.Why is the ErgoDox EZ expensive? The base ErgoDox design is open-source, so the answer to this question is easy to determine on your own: Build an ErgoDox! Source the parts, assemble the SMT components, solder everything else, get the acrylic etc. Then look at how long it took, how much the parts cost, and how your end result looks next to an ErgoDox EZ. The base ErgoDox design was never meant to be produced at scale. Still, we liked it and rose to the challenge — but its inherent complexity is translated to extremely high manufacturing costs, as any hobbyist can find out for themselves. Additionally, the keyboard is made in an office building in Taiwan by fairly paid employees who enjoy full benefits and holidays — not contractors in a factory in China. That impacts the cost as well, and we're proud to be able to offer good working conditions.Can I have the keyboard with no keyswitches? I already have some. Unfortunately, we do not offer a switchless variant. We gave it a shot for a few weeks, but market demand and manufacturing costs didn't make sense in the end. The main problem is in QA: When we make the unit, we have to actually put all the switches in and test each key to make sure it works. And then for a switchless variant, we have to pull them all out again. So we end up doing more work per unit, but obviously can't justify charging more because we're actually shipping you less stuff.What does the keyboard sound like? That's a deeper question than it seems on the surface. Here are a few things consider: Mechanical keyboards are not silent. Even if you get a quiet keyswitch such as the linear Kailh Silver, you will still get plastic-on-plastic "thwacking" sounds if you're an energetic typist. While you will have the quietest typing experience with linear switches, you will also have to type quite softly. Sometimes, keyswitches "ping" on the upstroke. Not just clicky switches — this also happens with linear and tactile switches. It isn't a defect, that's just what they sound like. See the first point above — mechanical parts make all sorts of noises, by their nature. Keyboards made years apart will sound different, even if they're specced out exactly the same. Same switches, same color, same lighting — different sound. We don't actually know why that is. Sound is an extremely complicated topic, and it is not a factor we can optimize for in manufacturing. We optimize for ergonomics, repairability, sustainability — carefully "tuning" each keyboard for sound would simply make our keyboards too expensive to make. All of this is to say that if you have very particular audio preferences, we cannot guarantee that our keyboards would serve your needs. To be a bit Zen about it: They sound what they sound like.Will the keyboard work on a Chromebook? Yes, as an input device. You'd be able to use it for typing and Live Training. However, to flash new firmware, you would need to use a machine running Windows, macOS, or Linux.Will the keyboard work on an iPad? Maybe. Anecdotally, some of our boards do work on some iPad models, but not all. The board was not explicitly designed from the ground up to work with an iPad, and it may draw more power than the iPad has to give. We've also seen our boards work with some Android phones and tablets.How do I disassemble the ErgoDox EZ? The ErgoDox EZ comes apart using a standard Philips screwdriver. The board does have a single hidden central screw located under the sticker on its underside. To open the board you can either remove the sticker or you can just poke something through the middle of the sticker into the screw hole. We generally recommend the latter because the former will leave behind sticky residue that's tricky to clean off. You can see that central screw and the rest of the board's disassembly here in iFixit's "repairability assessment" for the board.'''
