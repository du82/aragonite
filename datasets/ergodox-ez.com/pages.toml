full_description = '''Choosing your keyswitches? Start here.Keyswitches are one of the most important aspects of a mechanical keyboard. Getting to know your options will help you get the most out of your keyboard.What are mechanical keyswitches?Each key on a mechanical keyboard hides an actual physical switch under it, unlike the squishy rubber membrane you'd find on most keyboards. Typing on these mechanical switches is a very different experience from typing on regular ones. The keys have more travel, and are much more tactile; you don't have to press the keys all the way down to get them to register, which makes typing easier on the fingers; and of course, mechanical keyboards have their own unique sound. They sound like a keyboard.What are your options?Listen to the introWhen buying one of our keyboards, you get to choose from many keyswitch types.When thinking about your switches, there are several things you should consider.First, how much noise do you want your keyboard to make?Do you want a clicky switch or a non-clicky switch?Second, do you prefer a smoother typing experience, or do you want to feel a little bump when the key is actuated?So, do you want a linear switch with no bump or a tactile switch with a bump?And how much force do you want to use when typing on your keyboard?This is measured in grams of pressure.So do you want something really light, or do you want something that pushes back on your fingers a little?If you can find some friends who have mechanical keyboards, try different switches to see what you like best: See what feels best under your fingers.And remember, this decision isn't forever: you can swap out the keyswitches on your keyboard anytime, no soldering required.Enjoyed that? Listen to Tisha talk some more about switches!Our keyswitchesHere are the keyswitches we currently offer.alltactilelinearclickyCherry MX BrownActuation Force45±20gfPre-travel2.0±0.6mmFeeltactileOur most popular switch. Cherry MX Brown switches are tactile and 