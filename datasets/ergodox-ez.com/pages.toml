["https://ergodox-ez.com"]
title = "ErgoDox EZ: An Incredible Mechanical Ergonomic Keyboard | ErgoDox EZ"
description = "An open-source keyboard for serious developers, gamers, and people who care deeply about their craft."
full_description = "A proven ergonomic powerhouse.Customize anything.A split keyboard: Work at shoulder widthColumnar layout: For improved typing comfortReliable: A workhorse that keeps going for yearsCustomizable: A powerful graphical configurator you can try before you buyHot-swappable: Choose your own keyswitches and swap them out anytimeOpen-source: One of the first keyboards to use QMK firmwareBacked by a serious warranty: Two years. Ask around about the ZSA warranty — we're famousGets better with time: New features constantly developed — see our blog“A no-compromises ergonomic keyboard that actually looks as good as it feels.”Linus Tech Tips | Watch the full review The ErgoDox EZ is a proven design.Since our successful crowdfunding campaign all the way back in 2015, well over 100,000 people have relied on the ErgoDox EZ to get important work done. It’s a reliable design that works well and is deeply supported.A crowdfunding successLovingly maintained.The ErgoDox EZ is not a legacy product. We are continually updating and improving this model. It’s now powered by the same modern processor as the Moonlander and the Voyager, and it’s got a USB-C connector. This classic is getting the love it deserves.SplitOpen SourceErgonomicColumnarAWESOME.Split DesignWith a truly split layout, the ErgoDox EZ allows you to position each half where it makes sense to you. Typing at shoulder width allows you to keep your chest open and instantly leads to a more relaxed posture. No more hunching over the keyboard.Download a life-size printable PDF, to try it out on your deskComes from a great familyWe've been making high-end keyboards since 2015. Here's our lineup.Ultra-thin, compact, powerful.Ultimate portability. Ergonomics, anywhere.Learn More Comfortable and modular.Features an articulating thumb cluster. Over 40,000 units sold.Learn More A time-tested classic.Our first keyboard, going strong for years. An ergonomic classic with a big community.Customize yours Best Ergonomic Keyboard:The Upgrade PickGolden Hardware Award:What powerful looks likeColumnarWhen you extend your finger, it doesn't go sideways, does it? So why are the keys on your keyboard not directly on top of each other? The answer is archaic design, which we fixed. The ErgoDox EZ has linear columns of keys, reducing finger travel and fatigue.Uncompromising 2-year warrantyThe ErgoDox EZ is a serious investment in your future well being, and our warranty policy reflects this. Every unit comes with a two-year, no-BS, no fine-print warranty.You can even extend this by two additional years, for a four-year warranty on your ErgoDox EZ.Read more at zsa.ioSpacesReal people, in a real workspace, that happen to use one of our keyboards.1/4Holger MatthiesVoyager UserI really didn't have to remap my brain. That was super helpfulShy RuparelMoonlander UserI’ve come to really like the layout, it doesn’t hurt as much, its really nice to use.Russell MatneyMoonlander UserI didn’t think about my typing improving, it just was very natural, so that was kinda a nice surprise.Josh AdamsErgoDox EZ UserIt felt really good to have my wrists at whichever angle I wantedSmart LayersSwitch to Photoshop, and the “Photoshop” layer on your ZSA keyboard automatically activates. Click into Fortnite, and now your “Game” layer is suddenly active.See Smart LayersLightDarkPrintedBlankCustomize YoursEvery unit made to order. Create a keyboard that's perfect for you.MechanicalNo more squishy keys: With a mechanical keyboard, each keypress is distinct and tactile. The ErgoDox EZ is available with many switch types, from soft and quiet to firm and clicky.Learn more about our switchesChange your own keyswitchesGain ultimate control over your hardware: Change any keyswitch on your ErgoDox EZ, at any time, without soldering and without voiding the warranty. Your keyboard, your switches, your way.Find out why this is a game changerFlatA littleA lotTilt/Tent KitThe third dimension: Thanks to our custom tilt/tent kit, you can control the angle of the keyboard in relation to your desk. Angle both halves to create a “pyramid”, create a negative incline, or any other angle that works for you.Wing Wrist RestOur heavy, custom-molded Wing wrist rest was designed to complement the contour of the ErgoDox EZ. We made it separate from the keyboard to allow you to control the distance between the wrist rest and the keyboard.Being a separate part, the Wing is fully washable and is easy to clean.Printed or BlankOur printed keycaps cover the alphanumeric characters of the keyboard, leaving the edges completely open to remapping. They are all the same profile so you can easily move them around for Colemak, Norman, or any other layout. Our blank keycaps are sculpted, DCS profiles.Learn more about our keycapsComes with great toolsFree, industry-leading software to make it easier to master and customize your keyboard.OryxIt’s your keyboard: Set it up just the way you want it. You can play with the full version of Oryx right now, even before buying a ZSA keyboard.Try it outKeymappSee your layout update on your screen as you type. Remember where your keys are without straining your neck. Entirely optional; your layout is always saved to the keyboard itself.Read MoreLive TrainingPractice your custom layout until it becomes second nature. Includes modes to focus on standard text, numbers and symbols, programming syntax, and unlabeled keys within layers.See howSee your layout in real timeOur native app, Keymapp, displays your entire layout right in front of you. It updates as you use your board, so you'll never get lost while navigating layers. Pin Keymapp to the corner of your screen and you'll always know what each key does at a glance, even while working in other windows.Keymapp's “heatmap” feature gives you personalized, always-local data about which keys you use most to help optimize your layout for your own particular workload.Most important, Keymapp is entirely optional. Take your keyboard from one computer to another and all your customizations come with you — not locked in an app sitting in your system tray.See what's possibleYour browser does not support the video tag.Three Lighting OptionsWant backlit keys? We've got them. The ErgoDox EZ Glow comes with powerful, fully-programmable RGB LEDs under the letter clusters. It ships with custom doubleshot keycaps, and supports fun animations, too.GlowShineOriginalCustomize YoursEZ GlowWith the ErgoDox EZ Glow, you can highlight just the keys that are active in the current layer — or the whole layer, in any color you choose.EZ ShineFor the ErgoDox EZ Shine, set a distinct hue for every layer and make it easy to tell at a glance which layer is active.The most interesting and powerful keyboard we’ve ever laid hands on - and yes, this thing is killer for gaming.Christopher Coke, MMORPG.com | Read the full reviewThe ErgoDox EZ, in my opinion, is the most versatile keyboard on the market. It can do anything you need it to do, and if it’s not right by default, you have unlimited options to create the perfect solution for your individual needs.Bryan Clark | Read the full reviewAs long as you are prepared to invest some time re-learning your typing, it might be the best $350 you can invest in your personal hardware, and perhaps even personal well-being.Ben Frain, Smashing Magazine | Read the full reviewAfter a thousand hours of typing on ErgoDoxEZ (4+ hours every day for 8 months) I can say it is the best keyboard I have ever typed on.Roman Zolotarev, Software EngineerOne of the coolest keyboards I've ever come across. [...] Ten times cooler than DIY kits. [...] Its simplicity and modern look is fascinating.randomfrankp | Watch the full reviewI've been using my ErgoDox EZ with Kailh switches every day for the past three weeks, and it's easily the best keyboard I've ever owned.Aaron Patterson, Ruby core team, Rails core team | See the TweetA sustainable keyboardToo many devices are built to break or become obsolete in a year or two. That's bad for your pocket, and for the planet. We made sure our keyboards stay useful for many years to come.Learn more at zsa.ioUsed by We make keyboards for pros. Five key questions,answered by our users.Learn more at zsa.ioErgodox EZ, or Moonlander Mark 1?We don’t like to compare the Ergodox EZ and the Moonlander, simply because they are just different boards, not necessarily better or worse than the other. But, if you’re deciding between the two, here are some stats that may help you decide which will suit you better.Read moreLearn by doingIt's deliberate practice, for typing. Our Live Training tool includes everything you need to master your new keyboard layout and level up over time, for your own comfort and productivity nirvana.Learn moreAnd you can make it your own.Open-SourceThe powerful firmware that runs on your ErgoDox EZ is called QMK and it's open-source, available on GitHub. While you can use the configurator to quickly put together a layout, having complete access to the firmware source code means you can dig as deep as you'd like.Fork us on GithubGraphical ConfiguratorA big part of what makes a keyboard ergonomic is making it work for you. Our powerful configurator allows you to change virtually anything about the keyboard, save your layouts, and iterate on them to create your very own perfect keyboard.Try it outWatch How-To VideoMultiple layersNeed easy access to your F-keys? Want a mechanical numpad? Need programmer-friendly symbols right on your home row? With multiple layers, all of this becomes trivial. It's like a Shift key on steroids.Dedicated Hyper and Meh keysUnlock the power of system-wide shortcuts. Hyper is Ctrl+Shift+Alt+Cmd, while Meh is Ctrl+Shift+Alt. No sane application on your machine uses these, which means you get free system-wide shortcuts.Mouse ControlNever take your hands off the keyboard. The ErgoDox EZ can emulate a mouse, allowing you to control your cursor, scrollwheel and mouse buttons quickly and effectively.Dual-function KeysTap your Z key, and it sends the letter Z as expected. Press and hold it down... and it becomes Alt. That is the power of dual-function keys: When tapped, they send a character. When held, they act as a modifier. Alt, Ctrl and friends have never been easier to reach.Buy Nowor ask us anythingCustomize"
