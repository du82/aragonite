full_description = "MainShortsSayonaraPublished: April 19, 20119:39 pmUpdated: April 22, 20134:12 amAuthor Eric Bates Sayonara 2011 Experimental Short, 3min 40sec A short story about two unlikely friends saying goodbye. A young man named Charles just lost his home. He spends one last day with his best friend, a sea turtle, before moving on. This graduation project was made while at the Kyoto University of Art and Design. It brings together a lot of the research I had done over the three years I spent in Kyoto, and is based abstractly on my own experiences living in Japan. Most of the concepts relate somehow to my experiences, friends, foods, things I saw, and things I felt over this time; in particular the idea of saying goodbye to close friends. Directed by Eric Bates Puppeteer/ Sound Editing Rulo Sky Paintings Yuki Murabayashi Lacquer Transfer Textures Judith Umana Motion Tracking Assistant Jeon Tae Hwan 3D Stereo Consultant Masayoshi Arimoto Taisei Enterprise Media Services Kasuo Hirose Kazuyoshi Tsuji Shineisha Company Special Thanks Ayumi Bates Yasu Suzuka Hirokazu Sato Masahiro Kashima Robert Boland Kyoto University of Art Monbukagakusho BlogMain Just married… Life in Kyoto has begun! Here’s a picture of Ayumi and I today out on a walk by the lake to… Published: June 15, 200812:49 amUpdated: April 19, 20133:15 amAuthor Eric Bates MainShorts One Month In Tokyo I spent the month of July, 2010 working as an animator at Shirogumi VFX in Tokyo. I had a great… Published: August 18, 20107:00 pmUpdated: April 22, 20134:25 amAuthor Eric Bates BlogEventsMain Open Studio 2009 We are having our Open Studio Show for all the Master’s Program students at the Kyoto… Published: October 15, 200910:44 pmUpdated: April 19, 20133:12 amAuthor Eric Bates BlogMain rigging screengrabs I’ve been rigging this character charles since I wrapped up a second pass on the turtle rig… Published: June 19, 20105:37 pmUpdated: April 19, 20133:08 amAuthor Eric Bates"
