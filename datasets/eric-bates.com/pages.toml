full_description = "BlogMainShortsIntrospection at TojiPublished: April 11, 20119:16 pmUpdated: April 22, 20134:16 amAuthor Eric Bates Introspection 2010 Experimental Animation, 4 minutes Directed by, Judith UmaÃ±a Eric Bates Rulo LÃ³pez This was one of our first collaborative projects between the three of us. It has undergone quite a few different versions as we developed the idea and techniques. We used, print making techniques, drawing, painting, photography, stop motion animation, as well as digital animation. So it is very much a mixed media piece. This final version was made for an exhibit with our professor, Yasu Suzuka, at the Toji Temple in Kyoto. It was also made in remembrance of the Hiroshima bombing, with the theme of heiwa (peace). Not often do artists get to show their work at temples, so this was a really special opportunity to show at one of the major temples in Kyoto and we knew that we would get a lot of visitors. During the exhibit I had a chance to speak with many of the visitors. It was great hearing how people interpreted our animation and the message. I was surprised and delighted to see some of the kids playing, making hand shadows on the screen. Yasu Suzuka Official Web Site Rulo Official Web Site AnimationExhibitExperimentalJapanJournalPhoto MainPhotography Rainy London Published: July 21, 20078:10 amUpdated: April 19, 20133:16 amAuthor Eric Bates MainShorts Sayonara Sayonara 2011 Experimental Short, 3min 40sec A short story about two unlikely friends saying… Published: April 19, 20119:39 pmUpdated: April 22, 20134:12 amAuthor Eric Bates BlogMain Persistence of Story Imagine_we’re_walking down a path and we see an object off in the distance, lets say we see a… Published: April 1, 20076:42 pmUpdated: April 19, 20133:15 amAuthor Eric Bates BlogMain Lost in Regents Park Had an interesting night tonight on my way to a trial Japanese lesson at Regents College. First of… Published: February 5, 20077:07 pmUpdated: April 19, 20133:17 amAuthor Eric Bates"
