description = "This website is an outlet for my thoughts, creative ideas, work, and anything else I decide to put here. I graduated from the animation department at the Emily Carr University of Art in 2003(Vancou…"
full_description = "About This website is an outlet for my thoughts, creative ideas, work, and anything else I decide to put here. I graduated from the animation department at the Emily Carr University of Art in 2003(Vancouver, Canada). Since then I’ve been doing quite a bit of traveling and I’ve been lucky enough to have worked in some great studios doing animation/VFX in Canada, England, and Australia. At the moment I am in Japan, doing a masters in experimental animation at the Kyoto University of Art and Design through a Monbusho Scholarship (Japanese Ministry of Education). It’s a great chance to experiment with some personal projects, experience life in Japan and become a ninja. Click here to contact me."
