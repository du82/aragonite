title = "Project Planning Template – Eric Bates"
description = "Google docs has been an indispensable tool for collaboration online, especially with small teams scattered all over the globe. I put together this automatically updating Gantt style project managem…"
full_description = "BlogMainMakeProject Planning TemplatePublished: January 2, 20158:52 amUpdated: January 23, 201612:30 amAuthor Eric Bates Link To Template **Updated v2 Google docs has been an indispensable tool for collaboration online, especially with small teams scattered all over the globe. I put together this automatically updating Gantt style project management template for a recent project and thought it might be helpful for others as well. Its based on the new google sheets sparkline graphing tools. Feel free to copy this for yourself and modify it however you like. The Date Increment sets how many days are displayed for each column. By this and also by changing the date on the first column you can essentially ‘zoom’ the chart and it will dynamically update. A couple of tips: Alt Color, enter other color names here to override the default colors. %, this will show visually the completed portion of the task in the chart. In general the only things you will need to change are the Start/End Date, the date in the first column, Task names, % and Team members. Drop me a line if you found this useful. Happy project managing! CollaborationTechTools BlogEventsMain Future Boy Keita Proud to announce the birth of our first baby boy. Keita Bates Born Aug 7th 2011 in Takarazuka,… Published: August 23, 201110:51 pmUpdated: April 19, 20133:08 amAuthor Eric Bates BlogMainMake 3D Printed Camera Rigs For a recent project, I wanted to try and film several unique camera angles using a goPro. I… Published: August 14, 20137:08 amUpdated: 6:18 pmAuthor Eric Bates MainMake Panasonic Flip-hAcK Success *May 12, 2010 - Update in response to a Question from Billy at bottom of post; The great thing… Published: December 29, 20084:15 pmUpdated: April 19, 20133:44 amAuthor Eric Bates MainPhotography Sakura Season The cherry blossoms won’t last long but I wanted to get out and shoot some of them. I think… Published: April 8, 20109:28 pmUpdated: April 22, 20134:28 amAuthor Eric Bates"
