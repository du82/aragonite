title = "3D Printed Camera Rigs – Eric Bates"
description = "For a recent project, I wanted to try and film several unique camera angles using a goPro. I focused on making a couple of rigs that fit a specific shot, rather than something more versatile. So, I…"
full_description = "BlogMainMake3D Printed Camera RigsPublished: August 14, 20137:08 amUpdated: 6:18 pmAuthor Eric Bates For a recent project, I wanted to try and film several unique camera angles using a goPro. I focused on making a couple of rigs that fit a specific shot, rather than something more versatile. So, I kept that in mind and came up with something pretty simple. This was also a great chance to put my 3D printer to the test. Here are two of the rigs, one for filming a book as people wrote while passing it back and forth. As well as a wearable hand rig for filming a pen’s-eye-view of writing on paper. Don’t forget to leave a comment, thanks! The Book Rig I used a sheet of glass for the base, if part of the frame ended up being visible to the camera, I thought it may as well be transparent. It was also quite rigid, so once I duct taped the pieces to the glass it was all quite stable. Two long strips were taped to the glass underneath the book, rubber bands around the hard cover (and hidden under the pages) kept it all firm against the glass. The Pen Rig The idea here was to have a rig strapped directly to the actors hand that would look down along the pen to the paper. The tolerances were tight enough that, once adjusted, the wire would hold its position in the plastic base. It was all adjustable so we were able to fit it to the actor’s hand in no time with the velcro strap. 3D PrintingExperimentalHackJournalmakerbotTechVideowip MainMake Sparks, work in progress If the lights are out, it's because I'm in the basement working. Yep, a lot has happened since my… Published: May 1, 200910:50 amUpdated: April 19, 20133:14 amAuthor Eric Bates BlogMain Atmosphere Wins VES award!! Congratulations to Atmosphere VFX and everyone who worked on Battlestar Galactica episode Exodus.… Published: February 18, 20075:53 pmUpdated: April 19, 20133:15 amAuthor Eric Bates BlogMain Ayumi by the fridge Click to see full image... Published: April 9, 201011:07 pmUpdated: April 19, 20133:12 amAuthor Eric Bates"
