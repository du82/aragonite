full_description = "What are Senders Good For, Anyway? Posted on February 4, 2024 by Eric Niebler — 22 Comments ↓ Some colleagues of mine and I have been working for the past few years to give C++ a standard async programming model. That effort has resulted in a proposal, P2300, that has been design-approved for C++26. If you know me Continue reading What are Senders Good For, Anyway?→ Posted in concurrency, coroutines, generic-programming | 22 Replies Asynchronous Stacks and Scopes Posted on August 29, 2021 by Eric Niebler — 5 Comments ↓ In Structured Concurrency, I talk about what structured concurrency is and why it’s a big deal for C++ especially. In this post I discuss some more interesting properties of asynchronous code that is structured: async stacks and async scopes. Structured Continue reading Asynchronous Stacks and Scopes→ Posted in Uncategorized | 5 Replies Structured Concurrency Posted on November 8, 2020 by Eric Niebler — 28 Comments ↓ TL;DR: “Structured concurrency” refers to a way to structure async computations so that child operations are guaranteed to complete before their parents, just the way a function is guaranteed to complete before its caller. This sounds simple and boring, but Continue reading Structured Concurrency→ Posted in concurrency, coroutines | 28 Replies Standard Ranges Posted on December 5, 2018 by Eric Niebler — 51 Comments ↓ As you may have heard by now, Ranges got merged and will be part of C++20. This is huge news and represents probably the biggest shift the Standard Library has seen since it was first standardized way back in 1998. Continue reading Standard Ranges→ Posted in generic-programming, library-design, ranges, std, std2 | 51 Replies Ranges, Coroutines, and React: Early Musings on the Future of Async in C++ Posted on August 17, 2017 by Eric Niebler — 20 Comments ↓ Disclaimer: these are my early thoughts. None of this is battle ready. You’ve been warned. Hello, Coroutines! At the recent C++ Committee meeting in Toronto, the Coroutines TS was forwarded to ISO for publication. That roughly means that the coroutine Continue reading Ranges, Coroutines, and React: Early Musings on the Future of Async in C++→ Posted in coroutines, generic-programming, library-design, ranges, reactive, std, std2 | 20 Replies"
