full_description = "Meet Me at Meeting C++ Posted on June 16, 2013 by Eric Niebler — No Comments ↓ Jens Weller was foolish enough to give me the prime keynote slot at this year’s Meeting C++ in Düsseldorf. For 2 hours in November, I’ll be in TOTAL CONTROL of the newest and fastest growing C++ conference in Europe. Mwahaha! Continue reading Meet Me at Meeting C++→ Posted in Uncategorized | Leave a reply Optimizing Expressions with Boost.Proto Posted on January 29, 2011 by Eric Niebler — 7 Comments ↓ Finally, a new “Expressive C++” article. I’m pretty excited because I’ve covered enough of Proto’s basics to get to talk about the good stuff: how to manipulate expressions using grammars and transforms. This is potent stuff. In this article, I Continue reading Optimizing Expressions with Boost.Proto→ Posted in boost, edsl, proto | 7 Replies Expressive C++: Expressions and Domains Posted on October 18, 2010 by Eric Niebler — No Comments ↓ My latest article about EDSLs and Boost.Proto is up at Cpp-Next. This one completes a little lambda library in about 30 lines of C++. I also ruminate on the many layers of understandings about expressions in C++. Swing on over, Continue reading Expressive C++: Expressions and Domains→ Posted in boost, edsl, proto | Leave a reply Expressive C++ Continues Posted on October 4, 2010 by Eric Niebler — No Comments ↓ The latest in my series of posts on embedded Domain-Specific Languages in C++ continues. This one sketches the outline of a simple lambda library using Boost.Proto. Expressive C++: A Lambda Library in 30 Lines (Part 1 of 2) Enjoy! Posted in boost, edsl, proto | Leave a reply Xpressive To Get Multi-Capture Posted on October 2, 2010 by Eric Niebler — No Comments ↓ For Boost.Xpressive, multi-capture (the ability of a capturing group to remember all the times matches, instead of only the last) is an oft-requested feature. Since it could be faked with Xpressive’s implementation of named regexes, so adding multi-capture has never Continue reading Xpressive To Get Multi-Capture→ Posted in boost, xpressive | Leave a reply"
