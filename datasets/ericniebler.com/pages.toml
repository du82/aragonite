ct that iterators that return proxy references instead of real references don’t sit comfortably within the STL’s framework. Real, interesting, and useful iterators fall foul of this line, Continue reading Iterators++, Part 1→ Posted in generic-programming, library-design, ranges, std | 27 Replies"
