ted on November 23, 2013 by Eric Niebler — 34 Comments ↓ This post describes some utilities I’ve recently developed for doing concept checking in C++11. These utilities are part of an ongoing project to reimplement ranges, also for C++11, but I think the concept checking utilities are useful and interesting in Continue reading Concept Checking in C++11→ Posted in Uncategorized | 34 Replies"
