["https://ericniebler.com/2018/12/05/standard-ranges"]
title = "Standard Ranges – Eric Niebler"
description = "As you may have heard by now, Ranges got merged and will be part of C++20. This is huge news and represents probably the biggest shift the Standard Library has seen since it was first standardized …"
full_description = '''Standard Ranges Posted on December 5, 2018 by Eric Niebler — 51 Comments ↓ As you may have heard by now, Ranges got merged and will be part of C++20. This is huge news and represents probably the biggest shift the Standard Library has seen since it was first standardized way back in 1998. This has been a long time coming. Personally, I’ve been working toward this since at least November 2013, when I opined, “In my opinion, it’s time for a range library for the modern world,” in a blog post on input ranges. Since then, I’ve been busy building that modern range library and nailing down its specification with the help of some very talented people. Future blog posts will discuss how we got here and the gritty details of how the old stuff and the new stuff play together (we’re C++ programmers, we love gritty details), but this post is strictly about the what. What is coming in C++20? All of the Ranges TS — and then some — will ship as part of C++20. Here’s a handy table of all the major features that will be shipping as part of the next standard: Feature Example Fundamental concepts std::Copyable<T> Iterator and range concepts std::InputIterator<I> New convenience iterator traits std::iter_value_t<I> Safer range access functions std::ranges::begin(rng) Proxy iterator support std::iter_value_t<I> tmp = std::ranges::iter_move(i); Contiguous iterator support std::ContiguousIterator<I> Constrained algorithms std::ranges::sort(v.begin(), v.end()); Range algorithms std::ranges::sort(v); Constrained function objects std::ranges::less Generalized callables std::ranges::for_each(v, &T::frobnicate); Projections std::ranges::sort(employees, less{}, &Employee::id); Range utilities struct my_view : std::view_interface<my_view> { Range generators auto indices = std::view::iota(0u, v.size()); Range adaptors for (auto x : v | std::view::filter(pred)) { Below, I say a few words about each. But first I wanted to revisit an old coding challenge and recast its solution in terms of standard C++20. Pythagorian Triples, Revisited Some years ago now, I wrote a blog post about how to use ranges to generate an infinite list of Pythagorean triples: 3-tuples of integers where the sum of the squares of the first two equals the square of the third. Below is the complete solution as it will look in standard C++20. I take the solution apart after the break. // A sample standard C++20 program that prints // the first N Pythagorean triples. #include <iostream> #include <optional> #include <ranges> // New header! using namespace std; // maybe_view defines a view over zero or one // objects. template<Semiregular T> struct maybe_view : view_interface<maybe_view<T>> { maybe_view() = default; maybe_view(T t) : data_(std::move(t)) { } T const *begin() const noexcept { return data_ ? &*data_ : nullptr; } T const *end() const noexcept { return data_ ? &*data_ + 1 : nullptr; } private: optional<T> data_{}; }; // "for_each" creates a new view by applying a // transformation to each element in an input // range, and flattening the resulting range of // ranges. // (This uses one syntax for constrained lambdas // in C++20.) inline constexpr auto for_each = []<Range R, Iterator I = iterator_t<R>, IndirectUnaryInvocable<I> Fun>(R&& r, Fun fun) requires Range<indirect_result_t<Fun, I>> { return std::forward<R>(r) | view::transform(std::move(fun)) | view::join; }; // "yield_if" takes a bool and a value and // returns a view of zero or one elements. inline constexpr auto yield_if = []<Semiregular T>(bool b, T x) { return b ? maybe_view{std::move(x)} : maybe_view<T>{}; }; int main() { // Define an infinite range of all the // Pythagorean triples: using view::iota; auto triples = for_each(iota(1), [](int z) { return for_each(iota(1, z+1), [=](int x) { return for_each(iota(x, z+1), [=](int y) { return yield_if(x*x + y*y == z*z, make_tuple(x, y, z)); }); }); }); // Display the first 10 triples for(auto triple : triples | view::take(10)) { cout << '(' << get<0>(triple) << ',' << get<1>(triple) << ',' << get<2>(triple) << ')' << '\n'; } } The above program prints the following: (3,4,5) (6,8,10) (5,12,13) (9,12,15) (8,15,17) (12,16,20) (7,24,25) (15,20,25) (10,24,26) (20,21,29) This program is (lazily) generating an infinite list of Pythagorean triples, taking the first 10, and printing them out. Below is a quick rundown on how it works. Along the way, I’ll point out the parts of that solution that will be standard starting in C++20. main() First, let’s look at main, which creates the infinite list of triples and prints out the first 10. It makes repeated use of for_each to define the infinite list. A use like this: auto x = for_each( some-range, [](auto elem) { return some-view; } ); means: For every element in some-range, call the lambda. Lazily collect all the views thus generated and flatten them into a new view. If the lambda were to return view::single(elem), for instance — which returns a view of exactly one element — then the above is a no-op: first carve some-range into N subranges of 1-element each, then flatten them all back into a single range. Armed with that knowledge, we can make sense of the triply-nested invocations of for_each: for_each(iota(1), [](int z) { return for_each(iota(1, z+1), [=](int x) { return for_each(iota(x, z+1), [=](int y) { This code is generating every combination of integers x, y, and z in some order (selecting the bounds so that x and y are never larger than z, because those can’t be Pythagorean triples). At each level we create structure: we start with a single range (iota(1), described below), and then get a range of ranges where each inner range corresponds to all the combinations that share a value for z. Those inner ranges are themselves further decomposed into subranges, each of which represents all the combinations that share a value of x. And so on. The innermost lambda has x, y, and z and can decide whether to emit the triple or not: return yield_if(x*x + y*y == z*z, make_tuple(x, y, z)); yield_if takes a Boolean (have we found a Pythagorean triple?) and the triple, and either emits an empty range or a 1-element range containing the triple. That set of ranges then gets flattened, flattened, and flattened again into the infinite list of the Pythagorean triples. We then pipe that infinite list to view::take(10), which truncates the infinite list to the first 10 elements. Then we iterate over those elements with an ordinary range-based for loop and print out the results. Phwew! Now that we have a high-level understanding of what this program is doing, we can take a closer look at the individual components. view::iota This is a very simple view. It takes either one or two objects of Incrementable type. It builds a range out of them, using the second argument as the upper bound of a half-closed (i.e., exclusive) range, taking the upper bound to be an unreachable sentinel if none is specified (i.e., the range is infinite). Here we use it to build a range of integers, but any incrementable types will do, including iterators. The name “iota” comes from the std::iota numeric algorithm, which itself has an interesting naming history. for_each The range-v3 library comes with view::for_each and yield_if, but those haven’t been proposed yet. But view::for_each is a trivial composition of view::transform and view::join which will be part of C++20, so we can implement it as follows: inline constexpr auto for_each = []<Range R, Iterator I = iterator_t<R>, IndirectUnaryInvocable<I> Fun>(R&& r, Fun fun) requires Range<indirect_result_t<Fun, I>> { return std::forward<R>(r) | view::transform(std::move(fun)) | view::join; }; This declares an object for_each that is a C++20 constrained generic lambda with explicitly specified template parameters. “Range” and “IndirectUnaryInvocable” are standard concepts in C++20 that live in namespace std. They constrain the arguments r and fun of the lambda to be a range (duh) and a function that is callable with the values of the range. We then further constrain the lambda with a trailing requires clause, ensuring that the function’s return type must be a Range as well. indirect_result_t will also be standard in C++20. It answers the question: if I call this function with the result of dereferencing this iterator, what type do I get back? The lambda first lazily transforms the range r by piping it to view::transform, moving fun in. view:: is a namespace within std:: in which all the new lazy range adaptors live. Since fun returns a Range (we required that!), the result of the transformation is a range of ranges. We then pipe that to view::join to flatten the ranges into one big range. The actual code, lines 6-8, kind of gets lost in the sea of constraints, which are not strictly necessary to use the library; I’m being a bit pedantic for didactic purposes here, so please don’t let that trip you up. I also could have very easily written for_each as a vanilla function template instead of making it an object initialized with a constrained generic lambda. I opted for an object in large part because I wanted to demonstrate how to use concepts with lambdas in C++20. Function objects have other nice properties, besides. yield_if yield_if is simpler conceptually, but it requires a little legwork on our part. It is a function that takes a Boolean and an object, and it returns either an empty range (if the Boolean is false), or a range of length one containing the object. For that, we need to write our own view type, called maybe_view, since there isn’t one in C++20. (Not yet, at least. There is a proposal.) Writing views is made a little simpler with the help of std::view_interface, which generates some of the boilerplate from begin() and end() functions that you provide. view_interface provides some handy members like .size(), .operator[], .front(), and .back(). maybe_view is reproduced below. Notice how it is trivially implemented in terms of std::optional and std::view_interface. template<Semiregular T> struct maybe_view : view_interface<maybe_view<T>> { maybe_view() = default; maybe_view(T t) : data_(std::move(t)) { } T const *begin() const noexcept { return data_ ? &*data_ : nullptr; } T const *end() const noexcept { return data_ ? &*data_ + 1 : nullptr; } private: optional<T> data_{}; }; Once we have maybe_view, the implementation of yield_if is also trivial. It returns either an empty maybe_view, or one containing a single element, depending on the Boolean argument. inline constexpr auto yield_if = []<Semiregular T>(bool b, T x) { return b ? maybe_view{std::move(x)} : maybe_view<T>{}; }; Note: maybe_view owns its elements. It is generally a violation of the View concept’s semantic requirements for a view to own its elements because it gives the type’s copy and move operations O(N) behavior. However, in this case — where N is either 0 or 1 — we just squeak by. And that’s it. This program demonstrates how to use view::iota, view::transform, view::join, view_interface, and some standard concepts to implement a very useful bit of library functionality, and then uses it to construct an infinite list with some interesting properties. If you have used list comprehensions in Python or Haskell, this should feel pretty natural. But these features are just a tiny slice of the range support in C++20. Below, I go through each row of the table at the top of the post, and give an example of each. Fundamental Concepts The C++20 Standard Library is getting a host of generally useful concept definitions that users can use in their own code to constrain their templates and to define higher-level concepts that are meaningful for them. These all live in the new <concepts> header, and they include things like Same<A, B>, ConvertibleTo<From, To>, Constructible<T, Args...>, and Regular<T>. Say for instance that you have a thread pool class with an enqueue member function that takes something that is callable with no arguments. Today, you would write it like this: struct ThreadPool { template <class Fun> void enqueue( Fun fun ); }; Users reading this code might wonder: what are the requirements on the type Fun? We can enforce the requirement in code using C++20’s std::Invocable concept, along with the recently-added support for abreviated function syntax: #include <concepts> struct ThreadPool { void enqueue( std::Invocable auto fun ); }; This states that fun has to be invocable with no arguments. We didn’t even have to type template <class ...>! (std::Invocable<std::error_code &> auto fun would declare a function that must be callable with a reference to a std::error_code, to take another example.) Iterator and Range Concepts A large part of the Standard Library concerns itself with containers, iterators, and algorithms, so it makes sense that the conceptual vocabulary would be especially rich in this area. Look for useful concept definitions like Sentinel<S, I>, InputIterator<I>, and RandomAccessIterator<I> in the <iterator> header, in addition to useful compositions like IndirectRelation<R, I1, I2> which test that R imposes a relation on the result of dereferencing iterators I1 and I2. Say for example that you have a custom container type in your codebase called SmallVector that, like std::vector, can be initialized by passing it two iterators denoting a range. We can write this with concepts from <iterator> and <concepts> as follows: template <std::Semiregular T> struct SmallVector { template <std::InputIterator I> requires std::Same<T, std::iter_value_t<I>> SmallVector( I i, std::Sentinel<I> auto s ) { // ...push back all elements in [i,s) } // ... Likewise, this type can get a constructor that takes a range directly using concepts defined in the new <ranges> header: // ... as before template <std::InputRange R> requires std::Same<T, std::range_value_t<R>> explicit SmallVector( R && r ) : SmallVector(std::ranges::begin(r), std::ranges::end(r)) { } }; Note: range_value_t<R> hasn’t been formally accepted yet. It is an alias for iter_value_t<iterator_t<R>>. New Convenience Iterator Traits In C++17, if you want to know the value type of an iterator I, you have to type typename std::iterator_traits<I>::value_type. That is a mouthful. In C++20, that is vastly shortened to std::iter_value_t<I>. Here are the newer, shorter type aliases and what they mean: New iterator type alias Old equivalent iter_difference_t<I> typename iterator_traits<I>::difference_type iter_value_t<I> typename iterator_traits<I>::value_type iter_reference_t<I> typename iterator_traits<I>::reference iter_rvalue_reference<I> no equivalent, see below There is no iter_category_t<I> to get an iterator’s tag type because tag dispatching is now passé. Now that you can dispatch on iterator concept using language support, there is no need for tags. Safe Range Access Functions What is wrong with std::begin and std::end? Surprise! they are not memory safe. Consider what this code does: extern std::vector<int> get_data(); auto it = std::begin(get_data()); int i = *it; // BOOM std::b'''
