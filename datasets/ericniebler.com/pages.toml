["https://ericniebler.com/about"]
title = "About – Eric Niebler"
description = "Hi. My name is Eric Niebler, and I love C++. I am currently a Distinguished Engineer at NVIDIA, where I work on the next generation of high-performance C++ libraries for their accelerated platform.…"
full_description = "About Hi. My name is Eric Niebler, and I love C++. I am currently a Distinguished Engineer at NVIDIA, where I work on the next generation of high-performance C++ libraries for their accelerated platform. I have also spent many years as a freelance software developer, consultant, trainer and author. My specialty is C++ library and application development, with special emphasis on Generic Programming, modern C++ techniques, and the functional programming style. I have written code for Meta, Microsoft Research, Microsoft Visual C++, and Boost.org, where I have authored 4 Boost libraries: Proto, Foreach, Xpressive, and Accumulators. I have also served as the release manager for Boost and as a member of the Boost Steering Committee. I have been a member of the ISO C++ Standardization Committee for over 20 years where, among other things, I drove the effort to bring std::ranges to C++20. Presently, I am leading the effort to give C++26 a standard async programming model and a suite of Generic async algorithms. I have spoken at C++Now, OOPSLA, and the Northwest C++ Users’ Group (NWCPP), and been a featured speaker at C++Now, C++Con, and C++ Russia. I gave the keynote presentation at Meeting C++ in 2013. My public key can be found here. Feel free to drop me a line. The opinions expressed on this site are mine and do not necessarily represent those of my employer. You won’t find any confidential company information here, and while you’re welcome to get in touch with me, I’m afraid I can’t put you in contact with my employer."
