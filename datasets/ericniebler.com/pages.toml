["https://ericniebler.com/2011/01/29/optimizing-expressions-with-boost-proto"]
title = "Optimizing Expressions with Boost.Proto – Eric Niebler"
description = "Finally, a new “Expressive C++” article. I’m pretty excited because I’ve covered enough of Proto’s basics to get to talk about the good stuff: how to manipulate expres…"
full_description = 'Optimizing Expressions with Boost.Proto Posted on January 29, 2011 by Eric Niebler — 7 Comments ↓ Finally, a new “Expressive C++” article. I’m pretty excited because I’ve covered enough of Proto’s basics to get to talk about the good stuff: how to manipulate expressions using grammars and transforms. This is potent stuff. In this article, I show how to use Proto to completely eliminate the abstraction overhead in a simple linear algebra library. Without giving up the accepted domain syntax. And without a pile of nasty template spaghetti code. Enjoy. Expressive C++: Expression Optimization //<![CDATA[ reddit_url="https://ericniebler.com/2011/01/29/optimizing-expressions-with-boost-proto/"; //]]&gt; This entry was posted in boost, edsl, proto by Eric Niebler. Bookmark the permalink. harry on May 24, 2014 at 5:38 am said: Hi Eric, seems like cpp-next disappeared some time ago. Any chance of you re-posting the articles you had on “expressive C++” here? Reply ↓ Eric Niebler on May 24, 2014 at 6:03 am said: I have every intention of doing just that when I get some free time. Reply ↓ alfC on May 24, 2014 at 7:45 pm said: What happened to CPPnext? The articles were very interesting. I am still waiting for the next article of “Algebraic Data Types in C++” by David Sankel. 🙂 Reply ↓ Eric Niebler on May 24, 2014 at 10:06 pm said: That’s the million dollar question. I don’t know what happened. I talked with David Sankel last week at C++Now, and he hasn’t forgotten about his incomplete article series. I’m not sure where he’ll publish it, if he should ever finish it. Reply ↓ Barrett Adair on November 4, 2015 at 11:44 am said: Eric, is there any chance you still have the text for this article lying around? I’d really love to read it. Reply ↓ Eric Niebler on November 4, 2015 at 2:41 pm said: You can find it — and all the old Expressive C++ series — on the Wayback Machine: http://web.archive.org/web/20120906070131/http://cpp-next.com/archive/2011/01/expressive-c-expression-optimization/ Hope that helps! Reply ↓'
