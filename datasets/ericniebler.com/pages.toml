["https://ericniebler.com/2014/10/11/n4128-ranges-for-the-standard-library"]
title = "N4128: Ranges for the Standard Library – Eric Niebler"
description = "Eleven months ago, I began work on an updated range library for modern C++. Yesterday, I submitted a proposal to the C++ standardization committee to add ranges to the Standard Library. The proposa…"
full_description = 'N4128: Ranges for the Standard Library Posted on October 11, 2014 by Eric Niebler — 28 Comments ↓ Eleven months ago, I began work on an updated range library for modern C++. Yesterday, I submitted a proposal to the C++ standardization committee to add ranges to the Standard Library. The proposal presents a vision for a future Standard Library that is familiar and yet more powerful, more usable, and more efficient than today’s. My goal is nothing less than to change how C++ programmers write code. Seriously. I want more people to use the standard algorithms. I want it to be simple to do so. I want operations on data to compose in logical, simple, succinct and powerful ways. I want it to be easy for people to adapt their data so that those operations can be applied to them. I want it to be easy to create new operations that compose: lazy algorithms that snap together like Lego blocks and that give your programs a literate, declarative feel. I want it to be efficient. And it has to be safe. D4128 lays the foundation. I’m honored to list Sean Parent and Andrew Sutton as coauthors. Although most of the text of the proposal is mine, many of the ideas in it are not. Next month I fly to Urbana to present our work to the committee. Come to Urbana and watch the fun. And wish me luck. //<![CDATA[ reddit_url="https://ericniebler.com/2014/10/11/n4128-ranges-for-the-standard-library/"; //]]&gt; This entry was posted in Uncategorized by Eric Niebler. Bookmark the permalink. Nicola Gigante on October 12, 2014 at 5:16 am said: I’ve read the proposal and I find it wonderful! Good luck for Urbana 😉 Reply ↓ German Diago on October 12, 2014 at 11:57 am said: Will read it when I have some time. It’s long! Good luck. Many eyes will be watching your paper 😀 Reply ↓ German Diago on October 13, 2014 at 4:10 am said: A bit unrelated strictly to your proposal, but here I go: If uniform call syntax was in for the next standard, I think it would be good to integrate lazy range pipelines with dot notation, without having to write extra code for the pipe support: auto result = iota(1).filtered([](auto v) { return v % 2 == 0; }) .transformed([](auto v) { return v * v; }) .take(10) .accumulate(0); Stroustrup & Dos Reis paper: https://isocpp.org/files/papers/N4174.pdf Herb Sutter paper: https://isocpp.org/files/papers/N4165.pdf Reply ↓'
