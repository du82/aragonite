full_description = 'Cpp-Next.Com and the Expressive C++ Series Posted on May 24, 2014 by Eric Niebler — 7 Comments ↓ The C++ community is suffering from the loss of the cpp-next.com website and all the great content that was once hosted there. In the past 2 months, I’ve gotten many questions both about the site and about the fate of my “Expressive C++” article series. In response, I will re-post my old articles on this blog. But I’m busy and it’ll take time. In the meanwhile, if you have a desperate need for a readable introduction to Boost.Proto and domain-specific embedded languages in C++, and you don’t mind reading raw markdown, email me. I’ll send you what I have. //<![CDATA[ reddit_url="https://ericniebler.com/2014/05/24/cpp-next-com-and-the-expressive-cxx-series-2/"; //]]&gt; This entry was posted in boost, edsl, proto by Eric Niebler. Bookmark the permalink. Mikhail Borisov on May 24, 2014 at 12:19 pm said: Just to save one’s time, web.archive.org has a saved copy of the article in question: http://web.archive.org/web/20120906070131/http://cpp-next.com/archive/2011/01/expressive-c-expression-optimization/ Reply ↓ Eric Niebler on May 24, 2014 at 12:32 pm said: Wow, cool! I didn’t know this existed. THANKS! Reply ↓ Andrzej Krzemieński on June 26, 2014 at 5:06 am said: Do you know what happened to cpp-next.com? Is it gone forever? Reply ↓ Eric Niebler on August 6, 2014 at 8:43 am said: I wish I knew. It was administered by Dave Abrahams and went away about the time he moved from Boston to the Bay Area. That’s all I know. Reply ↓ redwap on December 9, 2019 at 12:42 am said: Eric Niebler, author of Boost.Expressive and the GRETA regular expression component, has shared several important ideas, in a series of long discussions. Reply ↓'
