["https://ericsink.com/about_author.html"]
title = "About Eric Sink"
full_description = 'About Eric Sink In my day job I am a software developer at SourceGear. SourceGear Vault, still supported and maintained as a compelling replacement for SourceSafe, was one of the first products built on .NET. Our mobile data sync solution for SQL Server is called Zumero Our team built the cross-platform support for Team Foundation Server (under the name Teamprise) and sold it to Microsoft in 2009. In October 2002, SourceGear was named one of the fastest growing companies in the nation by Inc magazine. I have a B.S. in Computer Science from the University of Illinois at Urbana-Champaign. Go Illini! I founded the AbiWord project and was responsible for much of the original design and implementation. The title on my business card says "Software Craftsman". Prior to founding SourceGear, I was at Spyglass for around five years. I served there as Project Lead for the browser team. We built the original versions of the browser you now know as "Internet Explorer". You can email me at eric@sourcegear.com My Twitter handle is @eric_sink My GitHub account is @ericsink I have a Facebook account, but I use it primarily for personal and family stuff, so please do not be offended if I do not accept a friend request.'
