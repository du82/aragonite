full_description = "Eric van Rees Freelance Content Writer & Editor Hello! I am a freelance writer with 15+ years of experience. Hire me for your next content writing project. Here’s what other people say about me: “Eric has been a regular contributor to Geo Week News (formerly ILMF and SPAR 3D) for several years. His professionalism, quick turnaround times, and added geospatial insights make his writing stand out among other freelancers we’ve worked with. He is also not afraid to dive into the technical and go beyond the surface when writing articles, which is a much-needed skill in our industry. We appreciate his contributions and he is top of mind for us when we have new writing opportunities.”Carla Lauter, Content Manager Geo Week News & Commercial UAV News Conference Content “Eric’s ability to turn an idea or thought into an entire article is truly unmatched. He’s taken what are glorified notes and turned them into articles that continue to generate traffic for multiple sites. He’s someone you can trust with sources and to deliver high-quality content, and that’s made all the difference with our editorial calendar, to our audience and for our entire team.“Jeremiah Karpowicz, Group Editorial Director at Diversified Communications HQ Questions? Looking for a content writer or want to know more about my writing services? Please use the following form and I’ll follow up ASAP: Your name Your email Subject Your message (optional)"
