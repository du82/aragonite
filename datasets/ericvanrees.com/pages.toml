full_description = "About Me Writing has always been my passion. In 2016, I started my own writing business and have been working directly with various geospatial businesses, after being editor-in-chief of an international geospatial publication for eight years. B2B Copywriting Since 2016, I have been producing content that helps companies be more successful, generate leads and more traffic. I specialize in the following content: Tech blogsCase studiesSoftware tutorials InterviewsPress releasesWeb page content Some of the companies I have been working for include: TrimbleGeospatial Training ServicesMagnasoftSOARThe People GroupDiversified Communications Why hire me for your next project? As a writer, I can explain difficult concepts in simple, understandable language. Clients have called me reliable and dependable with high personal standards and attention to detail, as well as dependable in meeting objectives, hard-working and used to meet tight deadlines. Want to know more? Please get in touch!"
