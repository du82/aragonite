["https://erlang.org/community"]
title = "Community - Erlang/OTP"
description = "The official home of the Erlang Programming Language"
full_description = "Contributing Bug Report You can report bugs, improvements or new features on the Erlang issue tracker. Security Disclosure Please follow the guidelines in order to report the issues regarding security in Erlang/OTP, and do not create a public issue for a security issue. Contributing to Erlang/OTP Go to the Erlang issue tracker and search for issues labelled with Help Wanted. Follow the contribution guidelines to submit a contribution. Erlang Enhancement Process For enhancements of the Erlang language itself or the core libraries to be thoroughly reviewed there is the Erlang Enhancement Process involving Erlang Extension Proposals (EEPs) stored in a GIT repository currently at Github. One of the Mailing Lists is dedicated for EEPs. Discussions Erlang Forums Discussion about Erlang and other languages running on the Erlang VM. Chat Slack team for Erlang Get invitation here. Then visit erlanger.slack.com. Erlang IRC channel For IRC users, please use irc://irc.libera.chat/erlang StackOverflow Q&A Erlang on StackOverflow an active topic on StackOverflow. Exchange your Erlang programming knowledge with other Erlang developers. Mailing List Archives Archived threads from the mailing lists. erlang-questions The main forum for Erlang/OTP questions and discussions. This list is mirrored by the Google Group Erlang Programming. erlang-announce The announcements are also sent to erlang-questions. eeps Discussions regarding specific Erlang Enhancement Proposals (EEPs). See more at Erlang Enhancement Proposals.​​ Erlang resources The OTP team Blog A blog written by members of the Erlang/OTP team at Ericsson. Contains interesting technical posts about the development of Erlang/OTP.​ Spawned Shelter Contains a comprehensive list of Erlang resources suited for beginners and experts alike. Erlang Battleground Funny & Weird Stories found while coding on the BEAM Planet Erlang Planet Erlang is a meta blog that collects posts from the blogs of various Erlang developers and contributors. Erlang Companies A curated list of companies using Erlang in production, organized by industry. Editor/IDE Erlang LS An Erlang server implementing Microsoft’s Language Server Protocol ELP A language server for Erlang, designed at WhatsApp Visual Studio Code Erlang language extension for Visual Studio Code Erlang mode for Emacs Follow the guide to set up the Erlang mode for Emacs. Also available on Melpa. Vim Erlang plugins for Vim. Erlang plugin for IntelliJ IDEA IntelliJ plugin for Erlang. Sublime Text Erlang support for Sublime Text. Atom Erlang package for Atom. Erlang plugin for Eclipse Erlide is the Eclipse plugin for Erlang. Learning Free Online Courses Functional Programming in Erlang Learn the theory and practice of functional programming in Erlang, by University of Kent. Functional Programming with Erlang A free online course for beginners by University of Kent. Erlang Master Classes A free online for advanced Erlang users by University of Kent. Learning Erlang Learn You Some Erlang One of the most popular learning tutorials in Erlang. How I start with Erlang? A quick tutorial to build your first Erlang application. Erlang Tutorials on Tutorialspoint Beginner’s tutorial for Erlang. Erlang on Exercism Solve programming problems in Erlang. Erlang on Wikibooks Erlang on Wikibooks.org. Erlang in anger This book intends to be a little guide about how to be the Erlang medic in a time of war. Adopting Erlang Adopting Erlang is an ongoing effort to gather all the resources that will help you use Erlang in a business. Events Meetup Groups Discover local Erlang Meetup groups in your city on Meetup.com. Conferences & Events CodeBeam The Erlang User Conference and The Erlang Factory were merged into CodeBeam after 2017, and takes place in many cities around the world. Erlang User Conference The Erlang User Conference was one of the major Erlang conferences. It took place in Stockholm, Sweden every year up to 2017, now renamed to CodeBeam STO, above. Erlang Factory The Erlang Factory conferences provided inspiring talks, trainings and workshops with leading Erlang experts. In San Francisco Bay Area, London, Berlin and many other cities, ran last year 2017. Now renamed to CodeBeam *, above. ACM SIGPLAN Erlang Workshops Erlang Workshops held in conjunction to ACM SIGPLAN International Conference on Functional Programming (ICFP). Popular Erlang Applications Hex.pm Hex.pm is a package manager for the Erlang ecosystem where you can discover or upload new Erlang/Elixir packages. Rebar3 Rebar3 is a build tool in Erlang, which provides deterministic builds, conflict resolution, packages and more. Erlang.mk Erlang.mk is a build tool in Erlang, which allows you to build your project with a Makefile. RabbitMQ Open source multi-protocol messaging broker. VerneMQ A scalable MQTT message broker. ejabberd Ejabberd is a Jabber/XMPP instant messaging server. ejabberd is cross-platform, fault-tolerant, clusterable, and modular. MongooseIM MongooseIM is a base platform for building high performance messaging systems leveraging XMPP. cowboy Small, fast, modular HTTP server. Research Projects Prowess The Prowess project advances property-based testing into the domain of web services and other open, evolving systems. Paraphrase, an EU FP7 project The ParaPhrase project aims to produce a new structured design and implementation process for heterogeneous parallel architectures. RELEASE, an EU FP7 project A project that is working with scalability over massive numbers of cores and nodes. The work is done as enhancements and additions to the Erlang/OTP system. HiPE (High Performance Erlang) Information about the High-Performance Erlang project at Uppsala university, Sweden."
