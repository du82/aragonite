["https://erlang.org/docs"]
title = "Documentation - Erlang/OTP"
description = "The official home of the Erlang Programming Language"
full_description = "On-line documentation Erlang/OTP Documentation Online documentation for the latest version of the run-time system as well as all the libraries. Programming Erlang: Software for a Concurrent World (Limited Free) Programming Erlang: Software for a Concurrent World (Joe Armstrong) is a book about Erlang written by one of the original inventors, published in 2007. You can buy it on paper from Amazon and other online bookstores, or directly from the publisher. Erlang Reference Manual - User's Guide Description of Erlang the language Efficiency Guide - User's Guide A guide that teaches you what to use and what to avoid in Erlang, as well as how certain Erlang features are implemented. System Principles - User's Guide A guide on a number of Erlang system principles. OTP Design Principles - User’s Guide The OTP design principles define how to structure Erlang code in terms of processes, modules, and directories. OTP Versions Tree All released OTP versions since OTP 17.0, with links to GitHub source tags and to README:s. As of OTP 23, Windows installers for all patches can be downloaded from here as well. Erlang Books Programming Erlang: Software for a Concurrent World (Full Edition) Programming Erlang: Software for a Concurrent World (Joe Armstrong) is a book about Erlang written by one of the original inventors, published in 2007. You can buy it on paper from Amazon and other online bookstores, or directly from the publisher. Learn You Some Erlang for Great Good! Learn You Some Erlang for Great Good! by Fred Hebert is a beginner's book about Erlang, published in 2013. It is available in paper copies and online. Erlang Programming Erlang Programming (A Concurrent Approach to Software Development) by Francesco Cesarini and Simon Thompson was published in 2009. Get it from Amazon etc or directly from the publisher. Erlang and OTP in Action Erlang and OTP in Action by Martin Logan, Eric Merritt and Richard Carlsson was published in 2010. You can buy it from various online bookstores, or directly from the publisher. Introducing Erlang Introducing Erlang by Simon St. Laurent, 2013, is an introduction to Erlang for beginners. It is available directly from the publisher. Designing for Scalability with Erlang/OTP With this hands-on book, you’ll learn how to apply OTP libraries and techniques to develop concurrent, fault-tolerant systems with no single point of failure. Erlang Papers Making reliable distributed systems in the presence of software errors PhD thesis of Joe Armstrong, Erlang’s co-inventor, describing the origins of Erlang."
