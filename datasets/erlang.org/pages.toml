full_description = "Erlang/OTP 27 Highlights May 20, 2024 · by Björn Gustavsson Erlang/OTP 27 is finally here. This blog post will introduce the new features that we are most excited about. Read More The Optimizations in Erlang/OTP 27 April 23, 2024 · by Björn Gustavsson This post explores the new optimizations for record updates as well as some of the other improvements. It also gives a brief historic overview of recent optimizations leading up to Erlang/OTP 27. Read More Erlang/OTP 26 Highlights May 16, 2023 · by Björn Gustavsson Erlang/OTP 26 is finally here. This blog post will introduce the new features that we are most excited about. Read More More Optimizations in the Compiler and JIT April 19, 2023 · by Björn Gustavsson This post explores the enhanced type-based optimizations and the other performance improvements in Erlang/OTP 26. Read More Erlang/OTP 25 Highlights May 18, 2022 · by Kenneth Lundin OTP 25 is finally here. This post will introduce the new features that I am most excited about. Read More Fast random integers May 12, 2022 · by Raimo Niskanen When you need “random” integers, and it is essential to generate them fast and cheap; then maybe the full featured Pseudo Random Number Generators in the rand module are overkill. This blog post will dive in to new additions to the said module, how the Just-In-Time compiler optimizes them, known tricks, and tries to compare these apples and potatoes. Read More Type-Based Optimizations in the JIT April 26, 2022 · by Björn Gustavsson This post explores the new type-based optimizations in Erlang/OTP 25 where the compiler embeds type information in the BEAM files to help the JIT (Just-In-Time compiler) to generate better code. Read More The Many-to-One Parallel Signal Sending Optimization November 05, 2021 · by Kjell Winblad This blog post discusses the parallel signal sending optimization that recently got merged into the master branch (scheduled to be included in Erlang/OTP 25). The optimization improves signal sending throughput when several processes send signals to a single process simultaneously on multicore machines. At the moment, the optimization is only active when one configures the receiving process with the {message_queue_data, off_heap} setting. The following figure gives an idea of what type of scalability improvement the optimization can give in extreme scenarios (number of Erlang processes sending signals on the x-axis and throughput on the y-axis): Read More"
