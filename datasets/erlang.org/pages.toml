full_description = "Download Erlang/OTP The latest version of Erlang/OTP is 27.2.4. To install Erlang you can either build it from source or use a pre-built package. Take a look at the Erlang/OTP 27 release description to see what changes Erlang/OTP 27 brings over the previous major version. The Erlang/OTP version scheme is described in the Erlang/OTP Systems Principles Guide. Compiling Erlang from source # You can build Erlang from source on your own, following the building and installation instructions. In a nutshell to install a pre-built archive you need only do: ./configure && make && make install If you clone the release from git, there may be some additional steps needed depending on which version of Erlang/OTP you are compiling. So always make sure to read the build and install instruction of the release you are compiling. You can also use third-party tools such as Kerl, asdf or mise to compile Erlang. They help to remove the differences between Erlang/OTP releases and the OS you are compiling on. Pre-built Binary Packages # Most OS package managers provide pre-built binary packages. For Homebrew on macOS: brew install erlang For MacPorts on macOS: port install erlang For Ubuntu and Debian: apt-get install erlang For Fedora: dnf install erlang For ArchLinux and Manjaro: pacman -S erlang For FreeBSD: pkg install erlang For Github Actions: setup-beam License Since Erlang/OTP 18.0, Erlang/OTP is released under Apache License 2.0. The older releases prior to Erlang/OTP 18.0 were released under Erlang Public License (EPL), a derivative work of the Mozilla Public License (MPL). Erlang/OTP 27.2.4 View on github.com Download source Download Windows installer Download 64-bit Installer Download 32-bit Installer Download 64-bit Zip Archive Download 32-bit Zip Archive Download Release notes View documentation Download HTML+PDF Documentation Download Man Pages All releases Erlang/OTP 27 Highlights 27.2.4 27.2.3 27.2.2 27.2.1 27.2 27.1.3 27.1.2 27.1.1 27.1 27.0.1 27.0 Erl