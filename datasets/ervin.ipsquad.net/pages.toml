full_description = "Tags: web-review, systemd, gitlab, infrastructure, cloud, databases, interviews, ssd, rust, streaming, sql, modules, hacking, debugging, hiring, culture, bug, fediverse, change, project-management, blog, gaming, tech, ux, mathematics, colors, history, security, quality, tools, self-hosting, raspberry-pi, spam, htmx, reliability, web, command-line, design, processes, agile, api, shell, frontend, postgresql, gui, git, foss, sustainability, business, safety, conference, communication, system, floats, javascript, performance, linux, storage, phone, management, networking, criticism, anonymity Making sure maintainers are well paid is indeed an ongoing problem. There is currently no perfect solution within the world we live in. This is indeed no reason to blame the maintainers themselves for the approach they picked. Looks like an interesting and comprehensive reference to squeeze as much reliability as possible from a Raspberry Pi. Plenty of good tips in there. I knew quite a few, but there are a few nuggets that I’ll test drive I think. Nice advices for API design. First time I see the term “inert” used in this context. Definitely one I should keep in mind and use when appropriate. Interesting, I didn’t know that user space schedulers were coming to Linux. It opens the door to exciting experiments. Check out the docs branch for detailed explanations. This exhibits a loop hole in the Rust compiler allowing to break lifetime inference… and from there all the usual guarantees go through the window. Nice exploration of the GitLab database schema. This highlights and finds quite a few of the choices made with an eye on performances. Something is definitely bonkers regarding the use of JavaScript on the web. The amount of bloat is staggering. Looks like an interesting trick for more dynamic HTML frontends with very limited used of Javascript. Inspired by htmx it seems to go one step further in the same direction. Neat article about colorspaces. Definitely worth reading if you’re curious about the topic. It also has interactive bits to ease the understanding."
