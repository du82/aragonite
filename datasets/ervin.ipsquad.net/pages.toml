full_description = "Tags: web-review, management, social-media, economics, tech-lead, 3d, tech, complexity, architecture, design, remote-working, craftsmanship, ethics, mathematics, programming, docker, go, codereview, microsoft, hr, habits, security, ai, linear-algebra, supply-chain Wow… that’s a lot of bribery and sloppy behavior. Almost surprising it slipped through, at such a scale it’s a matter of time before it gets noticed. https://www.theverge.com/2022/3/25/22995144/microsoft-foreign-corrupt-practices-bribery-whistleblower-contracting I like the noise metaphor it briefly mentions. It’s indeed similar, you’re within constant noise, you don’t notice it anymore but still when it stops you feel relieved. The benefits listed are indeed to be expected. This article is spot on in my opinion. This resonates so much with my own experience and ethos… I guess I could have written that if my prose was any good. Admittedly, the go toolchain seems to handle supply chain problems in a neat way. I especially like the VCS as the source of truth. Good refresher about linear algebra. I see it so underused in projects that really we need good resources to embark people into using linear algebra more. This sounds like it could be a game changer for some uses including robotics or XR. Will need to look at this deeper. Interesting paper, shows a surprisingly large percentage of jobs doable from home. Also shows that the frontier between doable or not seems to be at least partly related to inequalities. If you already have high wages, you got higher chances of having the privilege to work from home. This stresses how important to put specific procedures in place regarding remote workers. It’s in particular essential to have emergency contacts on both sides."
