["https://ervin.ipsquad.net/blog/2023/10/20/web-review-week-2023-42"]
title = "Web Review, Week 2023-42 - ervin"
description = "Website Description"
full_description = "Tags: web-review, 3d, tech, gpu, software, security, metrics, ssh, business, facebook, foss, geometry, computation, ai, wayland, htmx, c++, community, energy, surveillance, privacy, agile, licensing, engineering, programming, web, api, automation, google, distributed, politics, browser, craftsmanship, asynchronous, tests, mathematics, learning, law, architecture, frontend, crdt, git, trust, simulation, time, management, design, android, productivity, tools, machine-learning, attention-economy, criticism, graphics, gpt, rust This will lower even more the trust we can have in those devices. The only way to really own them seems be to just blow the warranty and flash them… The risks of too much automation… this is chilling to see what using machine learning based system all the way can lead to. It’s just a ridiculous situation and no way to get out of it. Interesting line of argument regarding Free Software licenses. I wonder what the judges will conclude in the end… this could have important consequences. This is a bad case of content moderation if it gets presented to users like this… but Google is not going to leave advertisement money on the table. The way browsers changed in recent years also make this kind of deceptions easier (harder to check certificates, hard to spot punycoding). https://arstechnica.com/security/2023/10/google-hosted-malvertising-leads-to-fake-keepass-site-that-looks-genuine/ US centric but a very welcome tool. Let’s hope we get similar initiatives for other countries as well. On specialized and formalized domains like this it might lead to something interesting. That said there’s a tension with the fact that it doesn’t know when it doesn’t know which might be problematic. Also I wonder how it fares compared to computational models like WolframAlpha. In the end very formal domains like this have large knowledge bases already available. A good way to get some control back if you want to use a LLM. You can host it locally, it’s free software. Definitely a step in the right direction."
