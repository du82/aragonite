description = "Website Description"
full_description = "Tags: web-review, networking, git, surveillance, law, economics, p2p, fediverse, ethics, art, security, writing, apple, ai, protocols, cpu, attention-economy, machine-learning, 3d, optimization, infrastructure, gpt, foss, tech, facebook, copyright, craftsmanship, fonts, war, communication, css, business, remote-working, gpu, computation, vlc, interoperability, data, self-hosting, documentation, web, supply-chain, politics, engineering, history, tools How does it feel to just want to put something creative out there without being exploited? Very touching comic on the topic. As an industry we definitely should think more often about the consequences of our actions. The incentives are indeed pushing us to go faster without much critical thinking. Unsurprising move, they claim it’s for the betterment of mankind but in practice it’s mostly about capturing as much market share as possible. The tone pointing at “open models” is wrong but the research is interesting. It still proves models can be poisoned (open or not) so traceability and secured supply-chains will become very important when using large language models. https://arstechnica.com/information-technology/2024/01/ai-poisoning-could-turn-open-models-into-destructive-sleeper-agents-says-anthropic/ Very interesting ruling, this opens the door to more parties being able to sue to enforce the GPL not just the authors. This is a stupid move on Unity’s part… they’re built on LGPL but ban others in their store to have LGPL dependencies. Shame on them. Good move from Videolabs though, wish them lots of success. Apple keep indeed attracting a bunch of cultists… and this allows them to keep abusing their other customers. https://themarkup.org/privacy/2024/01/17/each-facebook-user-is-monitored-by-thousands-of-companies-study-indicates Interesting notes, there seems to be good faith on the Meta side for now… but this leaves more questions than answers still. Interesting stats, not that easy to gather. This gives a good overview of where the fediverse instances are hosted though."
