description = "Website Description"
full_description = "Tags: web-review, ethics, design, rust, culture, github, craftsmanship, type-systems, browser, organization, microsoft, project-management, community, economics, html, gaming, machine-learning, business, ai, science, copyright, blog, team, django, sound, tech, architecture, learning, 3d, product-management, cloud, mathematics, conway, javascript, c++, life, icons, webcomponents, memory, nature, law, tdd, self-hosting, conversation, foss, copilot, htmx, ecology, tests, urbanization, frontend, complexity, mypy, geometry, programming, python Not much new in this article regarding Stable Diffusion. That being said the section about ethics is spot on. This is the toughest part to grapple with regarding the latest batch of generative AIs. The legal traceability of the training set might end up being required (even though I doubt it will happen). Alright, this going to be interesting. Pass me the pop corn. It’s definitely a welcome move in any case. Hear! Hear! No, moving your infrastructure to managed services doesn’t make sense in all cases. You need to be in the right place in term of complexity and traffic to really benefit from it. It’s less common than you’d think due to the marketing pressure. Interesting data point about a service moving completely to the htmx and web components approaches. Not all applications are going to see such drastic improvements, that being said the change in team structure alone feels like a very good thing to me (and is more likely to be the constant in such moves). Interesting examples where the Python type hints are used. This still needs improvements but it’s clearly improving. Lots of very good points, I’m a proponent of TDD but I strongly agree with this. If it’s painful and not fun, find a way to do it differently. There’s likely a tool or some API you miss. Manage your effort. Very good overview about RAII, ownership, borrowing references. All that comparing C++ and Rust in their ways to handle those concepts. Definitely a must-read even though it’s a bit long."
