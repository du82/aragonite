description = "Website Description"
full_description = "Tags: web-review, type-systems, databases, web, typescript, open-access, microsoft, services, attention-economy, design, java, security, infrastructure, train, censorship, cloud, map, advertisement, tech, vendor-lockin, tor, search, google, surveillance https://arstechnica.com/information-technology/2022/07/how-tor-is-fighting-and-beating-russian-censorship/ The paradox of how walled gardens could kill search engines in the end. I’m not too concerned for Google in practice though, it’s been a long time since it’s an ad agency and not a search engine, and they’ll always have something to advertise… This is definitely a good musing on when not to go for “cloudy architectures”. Most often people don’t really need it, this needs to be properly thought out for each project. There are costs involved which you might not make sense to pay for in your context. This looks like an interesting set of extensions for Java projects. Unsure if it’s been properly battle tested yet. Likely need that before being really advisable. That’s an intersecting Typescript pattern to get to nominal and refinement types despite the fact they lack from the language."
