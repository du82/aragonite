["https://ervin.ipsquad.net/blog/2022/12/16/web-review-week-2022-50"]
title = "Web Review, Week 2022-50 - ervin"
description = "Website Description"
full_description = "Tags: web-review, 3d, tech, rss, performance, ai, programming, optimization, kindness, physics, twitter, simulation, fediverse, gpt, culture, java, work, machine-learning, politics, team, surveillance, peertube, codereview, feedback, linking, censorship, social-media, management The EU Commission clearly doesn’t have the best interest of the people at heart there. Let’s see what it’ll give with the CJEU. You like Peertube? I do love this project. And it’s still mostly a single developer behind it. This needs to be supported. A few months old but a good piece to put things in perspective after the recent craze around large language models in general and GPT in particular. Noteworthy is the “wishful mnemonics” phrase mentioned and how it impacts the debate. Let’s have less talks about AIs and more about SALAMIs please? At least a good balanced post about Generative AI and programming. It’s not overestimating abilities of the latest trend in large language models and moves away from the “I’ll loose my job, developers will be replaced with AI” stance. Don’t bank it all on faster hardware, make sure your software isn’t slow first. Otherwise it’ll bring quite some hidden costs. Don’t underestimate performance of the generated code when a JIT is in the picture. Very good example with the JVM just there. https://itnext.io/auto-vectorization-how-to-get-beaten-by-compiler-optimization-java-jit-vector-api-92c72b97fba3 Wise advices on how to approach disagreements. Obviously requires psychological safety at work though. The culture will matter. Interesting article. I especially like how it makes the difference between being kind and nice. That honesty is required if you want to be really kind to others. It nicely shows examples on how to apply this (for instance, but not only, in the context of code reviews)."
