["https://ervin.ipsquad.net/blog/2023/12/29/web-review-week-2023-52"]
title = "Web Review, Week 2023-52 - ervin"
description = "Website Description"
full_description = "Tags: web-review, research, css, android, google, graphics, reliability, javascript, qt, ai, management, metrics, school, developer-experience, complexity, ecology, psychology, fediverse, telemetry, mobile, craftsmanship, attention-economy, maintenance, tech, bug, energy, dependencies, git, tools, type-systems, gpt, smells, profiling, community, moderation, copyright, law, leadership, quality, optimization, productivity, observability, mozilla, education, sociology, blog, performance, machine-learning, ios, organization, self-hosting, version-control, linkedin, learning, twitter, economics, social-media Despite understandable limitations, this studies has a few interesting findings on how communities can more easily switch platforms (in this case from Twitter to Mastodon). At least one is a bit counter-intuitive. An important question for proper statistics about the content itself. Surprisingly harder to get an answer to it than one would think. It was only a question of time until we’d see such lawsuits appear. We’ll see where this one goes. https://www.theverge.com/2023/12/27/24016212/new-york-times-openai-microsoft-lawsuit-copyright-infringement Very interesting paper about the energy footprint of the latest trend in generator models. The conclusion is fairly clear: we should think twice before using them. When underfunded schools systems preaching obedience and conformity meet something like large language models, this tips over the balance enough that no proper learning can really happen anymore. Time to reform our school systems? https://medium.com/bits-and-behavior/more-than-calculators-why-large-language-models-threaten-public-education-480dd5300939 Definitely true… never had use for more than the server logs for understanding the traffic on my blog. No need to invade the privacy of people through their browser. The experience is still not great on iOS and Android. This is in part due to the platforms design though, this still make Qt a great fit when you control the platform like for Plasma Mobile. For less friendly platforms this still limits the use to cases where you already have quite some Qt code. Still the same situation than a few years ago."
