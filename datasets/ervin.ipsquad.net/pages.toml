["https://ervin.ipsquad.net/blog/2024/08/16/web-review-week-2024-33"]
title = "Web Review, Week 2024-33 - ervin"
description = "Website Description"
full_description = "Tags: web-review, databases, cpu, web, frontend, law, time, type-systems, distributed, windows, garbage-collector, postgresql, c++, business, 3d, recovery, sqlite, blender, design, performance, ssh, html, security, technical-debt, organization, failure, memory, tech, amd, hacking, strategy, python, standard, reflection, tools, leadership, google, safety, complexity, funny, foss, browser, economics, management, monopoly, networking I wish more product companies would pick this license. Going for AGPL with a support and/or double license offering is a strong model in my opinion. Of course it sounds complicated to break Google up… but that’s not the point. It’s about avoiding its monopolistic position, the fact that it’s complicated is just another symptom. Luckily this kind of very low level vulnerabilities are not too common and difficult to exploit. But when they get exploited all things break loose and you can’t trust your hardware anymore. Interesting take, those bugs are more convenient to exploit. Logic bugs are too specific to easily exploit at scale. Clearly a new OpenSSH feature to keep an eye on. This should improved security of the server by default. That said, it needs to be a bit more in the wild before knowing how to best tune it. This is indeed surprising behavior and specific to Windows. If you wonder why TCP connect is slow and you got IPv6 support active this might be why. A new HTML attribute to keep an eye on. I can expect people to abuse it with hard to debug problems in the frontend if you don’t know it is there. Interesting, it confirms garbage collectors can be the source of unrecoverable performance degradation in request based systems. Retries are becoming common place to deal with transient errors. That said, they can be a problem with recovery of longer failures due to amplification. There are options on the table to solve this though. Or why anticipating too much is merely a gamble. You can be lucky, but how often will you be? Also I agree that in such cases the performance will be impacted longer term leading to a death by thousands of paper cuts."
