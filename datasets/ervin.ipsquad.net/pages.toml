title = "Web Review, Week 2021-26 - ervin"
description = "Website Description"
full_description = "Tags: web-review, smartphone, social-media, supply-chain, http, architecture, performance, fair, legacy, profiling, farming, vendor-lockin, git, tech, programming, surveillance, hr, university, system, security, remote-working, tests, commons, free-software, windows, conspiracy A rootkit in a driver… OK that’s not new. Signed by the provider of the number 1 desktop OS and there you got a major security issue. Again a supply chain attack. A good reminder of why you don’t want to mess too much with the VCS history for systems with long term maintenance and several stable releases. Very good rant which explains nicely why rewriting some software from scratch is almost never the right answer. Lots of good advice in there. Per usual quite some of it also makes sense in non-remote teams. Not sure I’d do everything exactly in the same way but that gives a good overall idea of the important points. It is indeed important that serious research and conversation arise on this topic. The bomb is ticking. https://www.vox.com/recode/2021/6/26/22550981/carl-bergstrom-joe-bak-coleman-biologists-ecologists-social-media-risk-humanity-research-academics Obviously I’m convinced it’s necessary for students to learn how to contribute as soon as possible. That being said, this leave unanswered the very important question of not burning out project maintainers. Indeed, it needs to be structured in some way, most projects can’t cope up with swarm of students dropping potential contributions on them. https://cacm.acm.org/magazines/2021/7/253459-why-computing-students-should-contribute-to-open-source-software-projects/fulltext Seeing the bad practices of Amazon with its Android AppStore, it really feels like another supply chain mess in the making with Windows 11 Android support… If it wasn’t clear that Microsoft never abandoned it’s Palladium plans but merely went for a detour after the backslash… now it’s getting very clear with Windows 11. They’re clearly back at it and this could become a problem to install something else than Windows on PCs…"
