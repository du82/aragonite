title = "Web Review, Week 2023-35 - ervin"
description = "Website Description"
full_description = "Tags: web-review, 3d, system, gpt, complexity, programming, research, distributed, maintenance, optimization, change, tech, technical-debt, microsoft, windows, crdt, web, mathematics, economics, interviews, graphics, business, criticism, performance, management, frontend, ai, ux, kernel, messaging, agile, e-ink, copyright, hacking, machine-learning, elixir, cost, hiring, productivity, object-oriented, automation, social-media, law, culture, c++, architecture, streaming, work, shader, hr, browser, javascript Microsoft doing Microsoft things in Windows… unsurprising, will never end. Maybe at some point people will move to platforms they really have control on? Interesting evolution… looks like people will all go back to some chat system? It’ll be the 90’s all over again? Maybe IRC will make a comeback? :-) https://www.businessinsider.com/social-media-dead-instagram-tiktok-bereal-replaced-group-chats-messaging-2023-8?r=US&IR=T Interesting analysis around the current situation around web scraping and intellectual property. This moved to being mostly dealt with using contract law which makes it a terrible minefield. Lots of hypocrisy all around too which doesn’t help. GPT and the likes will likely be the next area where cases will rise. https://blog.ericgoldman.org/archives/2023/08/web-scraping-for-me-but-not-for-thee-guest-blog-post.htm Interesting opinion piece about GPT and LLMs. When you ignore the hype, consider the available facts, then you can see how it’s another extra tool and unlikely to replace many people. If you only stream it, it won’t be available forever. Keep this in mind when it’s something you find culturally relevant… it might require some conservation work. I agree with this. They are very interesting devices. Not necessarily easily hackable yet though. It’s definitely getting there. The claim is huge. The story doesn’t quite say how much is really about Elixir and how much from the revised architecture. That being said, going for something like Elixir has definitely an impact on the architecture… could it be that it pushes for better patterns?"
