["https://ervin.ipsquad.net/blog/2023/11/11/web-review-week-2023-45"]
title = "Web Review, Week 2023-45 - ervin"
description = "Website Description"
full_description = "Tags: web-review, kde, hardware, browser, teaching, colors, community, wikipedia, matrix, sql, atlassian, ai, databases, webcomponents, graphics, career, object-oriented, tools, machine-learning, engineering, messaging, tech, system, security, repair, logging, politics, web, vector, command-line, ninja, http, remote-working, typescript, licensing, git, frontend, learning, buildsystems A bit later than usual since I got a failure on my hosting infrastructure which required some love. Anyway, let’s go for my web review for the week 2023-45. Interesting move in the Matrix space. It’s nice to see them go for a dual license business model involving AGPLv3. I’m a bit more concerned about the CLA though. Let’s hope they setup something equivalent to the KDE-FreeQt Foundatio going through the Matrix Foundation. Otherwise, AFAICT, there’s no safeguard against some nefarious relicensing years down the line. Interesting exploration of the Wikipedia community dynamics. This explains quite a few things on its evolution. It highlights how it became a beacon of sanity in the insane political landscape we’re collectively facing. https://www.cambridge.org/core/journals/american-political-science-review/article/rule-ambiguity-institutional-clashes-and-population-loss-how-wikipedia-became-the-last-good-place-on-the-internet/FC3F7B9CBF951DD30C2648E7DEFB65EE Looks like Valve is delivering on its promise to do further iterations on their hardware. Looks like they paid further attention to repairability which is very welcome. It’ll put KDE products in an even better light now. 😉 This is indeed a very nasty vulnerability. This won’t improve my low trust in this product. They’ve been trying to phase it out for a while, it shows now. https://arstechnica.com/security/2023/11/critical-vulnerability-in-atlassian-confluence-server-is-under-mass-exploitation/ Interesting tidbits I didn’t know about. The little Python API provided to generate Ninja files could turn out interesting."
