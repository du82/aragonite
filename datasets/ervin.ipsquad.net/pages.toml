full_description = "Tags: web-review, vendor-lockin, mobile, security, linux, leadership, http, performance, management, tech, tdd, c++, command-line, desktop, politics, version-control, tools, ux, memory, safety, web, business, cloud, law, mathematics, design, google, criticism, programming, cryptography, logic, teaching, surveillance, apple, architecture, android, smartphone, privacy, complexity, git, browser, craftsmanship They really never learn… Whatever the country politician try to blindly fight against cryptography again and again. Let’s hope this one is stopped. Maybe it’ll at least be a wake up call for governments and businesses to let go of their US cloud addiction. There are reasons why you don’t want such vendor lock-in. The political drama unfolding in the United States makes obvious why you should think carefully at how dependent you are from your service and infrastructure providers. I’m still baffled people are coming with ideas like this for their businesses… The level of cynicism you must have to build such a startup. https://www.zdnet.com/article/a-new-android-feature-is-scanning-your-photos-for-sensitive-content-how-to-stop-it/ Or why even the core git developers don’t really use the defaults. This piece gives good knobs to play with in order to have a nicer experience. They help with some issues… but they can’t solve all the memory safety issues of the language I’m afraid. It could be so much better indeed. Unfortunately in great part this is about UX design and carrying heavyweight frontend frameworks though… Interesting endeavor… this is nice to have an attempt at a formal definition with no axiom introduced. Very interesting discussion weighting the main differences and disagreements between a Philosophy of Software Design, and Clean Code. I read and own both books and those differences were crystal clear, it’s nice to see the authors debate them. I’m a bit disappointed at the section about TDD though, I think it could have been a bit more conclusive. It gives me food for thought about my TDD teaching though and confirms some of the messages I’m trying to push to reduce confusion."
