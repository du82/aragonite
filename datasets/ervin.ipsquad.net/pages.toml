["https://ervin.ipsquad.net/slides/talks/ak2020-lost-knowledge-in-kde"]
title = "Akademy 2020: Lost Knowledge in KDE"
description = "Website Description"
full_description = "Extreme example to make the point. Egyptian people was apparently good at making them… but we don’t really know how anymore. Organizational knowledge loss can be defined as the intentional or unintentional evaporation of knowledge that accumulates from learning and from individual and collective actions (Perrott, 2007). The HR literature has studied knowledge loss from an employee turnover perspective. HR practices such as motivation and reward systems (Menon and Pfeffer, 2003) were mentioned among suggested retention strategies to reduce knowledge loss in organizations. Departing employees take with them subject-matter expertise, routines explaining why decisions are made, awareness about work practices and routines and knowledge about company’s failures and successes. like recently due to the job, I realized that the knowledge about KConfigXT has been completely lost it’s still there, but everyone does KCModules the wrong way for it to be effective and whoever designed the QML integration with KCModule was so ignorant about the thing that it’s just impossible to make KConfigXT work properly with it we did a pass of porting and fixing but there’d be more to do it’s interesting in some way, first hand witnessing knowledge loss inside a group of humans with the generational changes and so on Plasma Active was an attempt to go on mobile while staying out of the race of who has the most applications The results of the study indicate that knowledge loss can lead to significant and widespread performance implications for an organization. They show that strategies that target the retention of tacit knowledge and its inclusion in firm’s routines are effective to mitigate knowledge loss. Hopefully now you see why I think about it and would like to see KDE improve there, so the obvious question is on the slide now. :-) Knowledge retention also known as Knowledge Continuation: activities addressing the challenge of knowledge loss as a result of people leaving"
