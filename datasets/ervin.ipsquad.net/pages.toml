description = "Website Description"
full_description = "Tags: web-review, research, knowledge, craftsmanship, 3d, ai, security, fake, machine-learning, movie, map, gpt, xp, notifications, tech, ethics, blender, android, refactoring, python, programming, architecture, tests, surveillance, translation, github, tdd, mobile, generator, supply-chain, neural-networks, art, copilot https://arstechnica.com/tech-policy/2022/12/facial-recognition-flags-girl-scout-mom-as-security-risk-at-rockettes-show/ https://www.bleepingcomputer.com/news/security/oktas-source-code-stolen-after-github-repositories-hacked/ This is indeed very much true… there’s a clear crisis in research. It turned into a hamster wheel of publishing articles at a constantly faster pace. The incentives are misguided which pushes that behavior to even have a career. Meanwhile, knowledge building suffers. Don’t worry, so called AI isn’t going to take away your jobs. But do worry though, this marks the end of trusting any pictures or texts you see in the media. Everything needs to be challenged, even more so now. https://petapixel.com/2022/12/15/photographer-fools-the-internet-with-ai-generated-cameras-that-dont-exist/ Interesting tool to for the automatic transcription and translation of videos using off the shelf components. Seems to work nicely. Interesting reverse engineering job of Copilot’s client side to have a better idea at which information it actually feeds to the model. A couple of funny tricks to prepare the prompt are involved. Obviously some telemetry involved as well, again with interesting heuristics to try to figure out if the user kept the suggestion or not. This is indeed a problem in the way Pipenv handle this kind of cases. Makes for bisecting clearly troublesome. Good piece. I like how it frames the debate, asking the right questions on where might be the assumptions on how testing is done. Good points, this shows quite effectively the problem with blindly following rules without keeping in mind the reasoning behind them. Excellent piece about naming things in code. The conclusion is perfect of course: it’s hard but it pays off."
