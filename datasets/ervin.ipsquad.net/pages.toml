title = "Web Review, Week 2021-27 - ervin"
description = "Website Description"
full_description = "Tags: web-review, surveillance, dystopia, python, technical-debt, logging, mob-programming, design, programming, 3d, craftsmanship, amazon, elegance, free-software, tech, europe https://www.patrick-breyer.de/en/chatcontrol-european-parliament-approves-mass-surveillance-of-private-communications/ As if monitoring communications wasn’t enough… biometric surveillance is already on going in some of the EU states. https://edri.org/our-work/new-edri-report-reveals-depths-of-biometric-mass-surveillance-in-germany-the-netherlands-and-poland/ OK, this is actually a very big deal. I think it’s the first AAA game 3D engine which gets open sourced. This could be very impactful to the industry. https://venturebeat.com/2021/07/06/amazons-lumberyard-becomes-an-open-source-3d-game-engine-with-support-from-20-companies/ This is actually a good list. Clearly doesn’t try to invalidate YAGNI at all, focuses more on this infrastructure things you need on most projects anyway either for debug purpose or because they allow you to change the system easily later which in fact… supports YAGNI. Very good points about why elegance matters in code. It’s definitely something I try to keep in mind in code reviews. One has to be careful not to use too obscure features of the language though. For instance, you’re mostly fine in Python where what it considered idiomatic is somewhat well defined, you’re much more in trouble in C++ which isn’t as cohesive."
