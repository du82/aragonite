["https://ervin.ipsquad.net/blog/2024/03/29/web-review-week-2024-13"]
title = "Web Review, Week 2024-13 - ervin"
description = "Website Description"
full_description = "Tags: web-review, communication, architecture, foss, licensing, machine-learning, cpu, hardware, ai, tools, bias, redis, google, browser, tech, supply-chain, maintenance, complexity, json, movie, automation, security, coroutine, tdd, statistics, documentation, surveillance, production, wifi, processes, community, python, filesystem, debugging, streaming, multithreading, rust, craftsmanship, quality, memory, creativity, linux, criticism, law, frontend, data, copyright, web, gpt, economics, mozilla This is a worrying trend we see in law enforcement a bit everywhere. It’s a bit too convenient to make such requests even though it is unconstitutional. https://www.forbes.com/sites/thomasbrewster/2024/03/22/feds-ordered-google-to-unmask-certain-youtube-users-critics-say-its-terrifying/ Indeed, time to leave Redis behind in favor of Redict. It’s not like one can expect new things to come out to such a project. Interesting, with the price hikes and bundles to come, we might indeed see a resurgence in physical media. It will stay niche for sure, but looks like demand is about to grow. Interesting study on the impact generative AI can have on people performances in business settings. There are a few nuggets in there. In particular anything related to problem solving people do worse with generative AI tools than without. And even worse than that when they’ve been trained (probably due to overconfidence). The place where it seems to help is for more creativity related tasks… at the individual level, but at the collective level creativity decreases due to homogenization. Definitely things to keep in mind. https://www.bcg.com/publications/2023/how-people-create-and-destroy-value-with-gen-ai?ref=wheresyoured.at Very interesting piece. The chances that it is another bubble are high. It’s currently surviving on a lot of wishful thinking and hypothetical. This really feels like borrowed time… I wonder what useful will remain once it all collapses. Coding assistants are very likely to survive. Clearly there could be interesting uses in a more sober approach."
