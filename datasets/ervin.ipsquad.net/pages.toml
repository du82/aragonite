description = "Website Description"
full_description = "Tags: web-review, tech, hype, history, physics, ai, foss, criticism, mathematics, linux, windows, ci, security, web, bias, frontend, server, gpt, google, version-control, webassembly, search, writing, communication, git, firefox, debugging, ux, microsoft, social-media, bookmarks, data, cad, quality, privacy, gui, machine-learning, email, art A bit too GitHub centric for my taste. Still it shows some unwarranted bias, especially when outsiders to a project are identified as women. We should do better. https://www.researchgate.net/publication/308716997_Gender_bias_in_open_source_Pull_request_acceptance_of_women_versus_men The training dataset crisis is looming in the case of large language models. They’ll sooner or later run out of genuine content to use… and the generated toxic waste will end up in training data, probably leading to dismal results. https://www.404media.co/google-is-paying-reddit-60-million-for-fucksmith-to-tell-its-users-to-eat-glue/ This is indeed sad to see another platform turn against its users. This was once a place to nurture young artists… it’s now another ad driven platform full of AI made scams. https://www.vox.com/future-perfect/2024/5/17/24158478/openai-departures-sam-altman-employees-chatgpt-release This is completely nuts… they really want to unleash a security and privacy nightmare. The irony is that it does respect DRM content on the other hand, we can see where the priorities are. https://arstechnica.com/gadgets/2024/05/microsofts-new-recall-feature-will-record-everything-you-do-on-your-pc/ Definitely this, it’s not the first time we see such a hype cycle around “AI”. When it bursts the technology which created it is just not called “AI” anymore. I wonder how long this one will last though. Definitely too much hype around large models right now. This over shadows the more useful specialized models. We’re still fairly dependent on just two major web indices… time for an index built as a common for everyone to use?"
