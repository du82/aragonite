["https://ervin.ipsquad.net/blog/2022/09/30/web-review-week-2022-39"]
title = "Web Review, Week 2022-39 - ervin"
description = "Website Description"
full_description = "Tags: web-review, performance, penpot, product-management, debugging, command-line, programming, mypy, memory, small, embedded, complexity, project-management, interviews, hr, bug, technical-debt, compiler, organization, python, metrics, automotive, statemachines, microsoft, rust, management, learning, tech, team, type-systems, vendor-lockin, design, vision, flatpak, agile, json, computers https://techcrunch.com/2022/09/27/penpot-inks-8m-as-signups-for-its-open-source-spin-on-figma-jump-5600-after-adobes-20b-acquisition-move/?guccounter=1 This! There’s definitely something interesting with those very focused devices. The problem though is carrying them + something else for other uses. This adds up quickly. This looks interesting. Definitely something to add to the tool belt. Coupled with jq this becomes very powerful. Interesting interview about some serious usage of Rust in the embedded space. That’s where I’d expect it to shine. https://medium.com/volvo-cars-engineering/why-volvo-thinks-you-should-have-rust-in-your-car-4320bd639e09 This is good news, this provide more venues for improving performances in Python modules next to switching to compiled Rust with something like PyO3. There’s clearly a case to be more for not having to rewrite when the codebase was already mostly Python. Definitely a case of a very interesting bug found in production. In the end, the root cause is the loss of context because people working on the components changed. Never underestimate the knowledge lost when someone leaves. Interesting points about complexity. Indeed it’s everywhere the problem is when you start to silently (and unwillingly) worship it… coupled with fear of changes this can only lead to piling more and more complexity in your systems. This is an interesting way to frame it. I generally talk with people about making sure you got vision and horizon in your product backlog (which then requires adequate grooming). Still this sounds like a simpler to grasp wording here. Probably good for a first approach."
