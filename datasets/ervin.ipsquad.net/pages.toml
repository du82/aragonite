title = "Web Review, Week 2023-01 - ervin"
description = "Website Description"
full_description = "Tags: web-review, web, http, culture, webassembly, surveillance, microservices, social-media, 3d, tech, empathy, vendor-lockin, attention-economy, blog, supply-chain, ux, twitter, architecture, fediverse, multithreading, management, web3, commons, organization, c++, tdd, tests, scam, facebook, politics, internet, programming, economics, performance, protocols, project-management, foss Maybe they’ll finally realize it just make no sense? It’s time for this absurdity to be put to rest. Let’s hope journalists hear that call. It’s indeed sad that so far it’s mostly words and not many actions to move away from Twitter in that profession. https://www.techdirt.com/2023/01/04/journalists-and-others-should-leave-twitter-heres-how-they-can-get-started/ Interesting take, let’s see if it’s true and things will decentralize (or at least audiences fragment, the author seems to confuse both) more in the future. Let’s hope it’s one good resolution for 2023 that plenty will go for. We need blogs to be back, massively. It would be better for everyone. That’s a lot which happened in this community over the past year. It’s important that is keeps pushing forward and luckily it does. Interesting piece. It shows quite well what users have lost with the over reliance on HTTP for everything. Moving more and more things in the brother fosters walled gardens indeed. Compound this with branding obsession from most company and you indeed end up with an absurd situation. Excellent piece, looking back to history to justify why microservices are mostly a fad. Check what your needs really are and depending on them pick the right way to decompose the problem or organize your teams. A little reminder that those too often forgotten execution policies for C++ algorithms actually exist and can give interesting results nowadays. Time to look a bit at the maze of WebAssembly runtimes. Good overview on how they currently perform and how well they are documented or easy to use. Since I’m also a bit of a nerd of nice programming language features, that’s an interesting list (mostly) coming from less known languages. Some of that syntactic sugar would be welcome in more main stream languages I think."
