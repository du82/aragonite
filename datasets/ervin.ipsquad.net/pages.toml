full_description = "Tags: web-review, compiler, history, work, metaverse, cyberpunk, gafam, mathematics, management, burnout, security, tech, team, geometry, 2d, capitalism, complexity, 3d, economics, supply-chain Interesting findings about team dynamics. It’s actually a good thing that we seem to usually prefer people exhibiting skills + friendly and trustworthy, but that if we can get only one of the two we favor friendly and trustworthy over skills. It’s healthy, just skills tend to drag teams down. https://www.binghamton.edu/news/story/3318/research-people-prefer-friendliness-trustworthiness-in-teammates-over-skill-competency Definitely this. We got a bunch of rich people with a very shallow understanding of cyberpunk literature. They’re focusing on the gimmicks, missing completely the big picture… all of this to not face they’d be the villains in those stories. The paper is very “cloud focused” but most of the arguments make sense overall. Managing complexity is really the core issue of what we do as engineers… or at least it should be. Very very nice post. Explains from the basics how to build Bezier curves and patches but also Splines, B-splines, NURBS and Catmull-Clark subdivision surfaces. Talks about curvature, normals, etc. You name it."
