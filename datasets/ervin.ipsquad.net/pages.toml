title = "Web Review, Week 2023-24 - ervin"
description = "Website Description"
full_description = "Tags: web-review, deployment, tech, metaprogramming, programming, security, surveillance, gpt, dependencies, social-media, memory, multithreading, command-line, tests, internet, cryptography, architecture, reddit, business, java, tools, hardware, agile, dns, history, benchmarking, values, risk, product-management, ai, community, ux, logging, productivity, asynchronous, c++, python, geography, organization, embedded, distributed, performance, project-management, erlang, supply-chain You might remember we were hosted in Toulouse for the KDEPIM Sprint this year. Very nice venue, they do other things locally of course. They need to raise some money to get to the next level. It’d be nice to see them receive lots of love. Head to their fundraising page! (in french though) Things improved a bit… they also got worse in a way. This stays an ongoing fight for the years to come. https://www.theguardian.com/us-news/2023/jun/08/no-regrets-says-edward-snowden-after-10-years-in-exile Another centralized tool for communication going down the drain. I wonder what the IPO will look like in this case. Interesting and provoking thought… Indeed it’s hard to build communities while also aiming for rapid and constant growth. There’s no chance of having communities properly stabilize which leads to the tribalism and bad behavior we see on social media. Signature of digital documents is definitely not as safe as we would like. All the serious formats have known flaws at this point. The results of this annual survey are available. A few interesting insights in there even though I find some of the categorization weird. For instance why splitting so much in details the various Linux flavors? If they didn’t it’d show them as the most popular option for professional use. There are a few other cases where one might want to aggregate by hand or split in several groups among questions. It’s also the first time they integrate the use from AI tools but that doesn’t give any surprising or interesting insight yet. It just confirms the hype and the domination of a couple of giant players."
