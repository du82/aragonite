full_description = "Yes, I’ll obviously attend this year Gnome Summit. I expect this to be very interesting, I’m planning to meet at least a part of the HAL crew… I’ll surely learn a lot of things which is always a good thing. I’m looking forward to meet clee again, I just hope I’ll interact more with him this time (we didn’t succeed during Malaga, shame). I’ll take my flight tomorrow around noon. I hope I won’t be too tired when I’ll land there. I just need to finish to pack my stuff, I’m almost done. That’s really a great opportunity, I’m really feeling a lot of gratitude for Waldo and the persons at Intel involved in this trip. It would have been impossible to make it without this Intel sponsoring."
