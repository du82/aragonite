title = "Web Review, Week 2021-25 - ervin"
description = "Website Description"
full_description = "Tags: web-review, memory, ssd, censorship, dystopia, legacy, frontend, coaching, craftsmanship, agile, hr, mob-programming, storage, web, pairing, surveillance, tech, javascript, profiling, windows, tests Self-censorship is indeed the worst type of censorship. It’s also the one the power that be prefer, it’s better when peoples just stay quiet, less work to control them this way. How do you like your dystopia? You better be happy about it apparently… This really shows that unlike some fantasies we’re unlikely to be replaced by machines, it’s clear that instead we’re being pushed to act and think like machines. https://ntdotdev.wordpress.com/2021/02/06/state-of-the-windows-how-many-layers-of-ui-inconsistencies-are-in-windows-10/ At last some interesting tooling for profiling memory usage of web frontends. Clearly this is very early days though, this will get more interesting as the tooling makes progress. Some of the numbers in the benchmarks they came up with in this article are very scary though. Interesting coaching approach for teams. It’s indeed hard to get teams to stick to some of the difficult development practices… By mixing several approaches, this looks like she’s onto something here. A bit US centric but likely to apply more generally. It seems like their will be a developer shortage and recruiting skilled people will become harder."
