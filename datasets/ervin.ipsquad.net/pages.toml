title = "Web Review, Week 2024-51 - ervin"
description = "Website Description"
full_description = "Tags: web-review, ai, asynchronous, gpt, web, type-systems, attention-economy, moderation, linkedin, ecology, energy, career, criticism, project-management, leadership, tools, social-media, foss, knowledge, bluesky, hardware, advertisement, neural-networks, machine-learning, complexity, management, pattern, filesystem, tv, tech, learning, geospatial, analogic, law, community, design, fediverse, sqlite, databases, rust, politics, communication, java, estimates, internet, system, architecture, fake IRIS² is the friendly reminder that tens of thousand of low orbit satellites is not the only design… and likely not the smartest one. https://arstechnica.com/gadgets/2024/12/buying-a-tv-in-2025-expect-lower-prices-more-ads-and-an-os-war/ Yet another long piece in this interesting and in depth conversation about Bluesky. The fact that it stays civil is called out explicitly and this is appreciated. Bluesky is already hitting growth pains regarding moderation and its guidelines. By being centralized it is also more at risk within the current US political climate. https://techcrunch.com/2024/12/13/bluesky-is-at-a-crossroads-as-users-petition-to-ban-jesse-singal-over-anti-trans-views-harassment/ Kind of unsurprising right? I mean LinkedIn is clearly a deformed version of reality where people write like corporate drones most of the time. It was only a matter of time until robot generated content would be prevalent there, it’s just harder to spot since even humans aren’t behaving genuinely there. Indeed, we’ll have to relearn “internet hygiene”, it is changing quickly now that we prematurely unleashed LLM content on the open web. A good balanced post on the topic. Maybe we’ll finally see a resurgence of real research innovation and not just stupid scaling at all costs. Reliability will stay the important factor of course and this one is still hard to crack. It looks like analog chips for neural network workloads are on the verge of finally becoming reality. This would reduce consumption by an order of magnitude and hopefully more later on. Very early days for this new attempt, let’s see if it holds its promises."
