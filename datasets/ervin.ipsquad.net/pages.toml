["https://ervin.ipsquad.net/blog/2022/06/17/web-review-week-2022-24"]
title = "Web Review, Week 2022-24 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, firefox, linux, surveillance, optimization, google, surprising, performance, funny, agile, product-management, desktop, economics, craftsmanship, data-science, cult, c++, foss, project-management, programming, maintenance, engineering, browser, tech, python, low-tech Such cults are freaky… I’m always baffled at their ability to put their fangs into an organization and grow in there. https://blog.mozilla.org/en/products/firefox/firefox-rolls-out-total-cookie-protection-by-default-to-all-users-worldwide/ This is definitely well put, users shouldn’t feel entitled. Maintainers do what they can (even if there’s a company backing up your favorite FOSS project) and if you use the software for free with no support contract… things will be done when they’re done. I didn’t know about the Lindy effect, this is an interesting point. Obviously I have a different setup (Plasma has been around longer than XMonad after all) but the overall advice is good. And this is why you likely need to optimize your data pipelines at some point. There are plenty of levers available. Good ideas to improve your user stories. I often see not so complete stories, it doesn’t stop at the title, there’s more to do. The proposed canvas is interesting and definitely helps. Interesting take as usual. Utilization doesn’t matter, throughput is what you need to keep in mind. https://medium.com/@kentbeck_7670/tune-software-development-for-rate-of-change-not-rate-of-progress-56f93c15a769"
