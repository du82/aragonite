["https://ervin.ipsquad.net/blog/2025/01/10/web-review-week-2025-02"]
title = "Web Review, Week 2025-02 - ervin"
description = "Website Description"
full_description = "Tags: web-review, unix, security, social-media, css, xp, htmx, webassembly, tests, web, politics, webgpu, frontend, agile, productivity, email, facebook, maintenance, usability, twitter, law, computation, management, attention-economy, microservices, learning, autonomy, browser, fediverse, ntp, gpu, leadership, architecture, engineering, career, tech, time, supply-chain, developer-experience, property-based-testing https://www.openpetition.eu/petition/online/an-open-letter-to-all-european-politicians-and-leaders-to-abandon-x-twitter Good reaction and opinion piece about the latest policy changes at Meta. This is really going to be toxic, but they just don’t care at the top. I wish other platforms would go through so much scrutiny. Still it gives a good idea about the mental health issue they collectively represent. Interesting little study of engagement on various platforms. Clearly the Fediverse could do better in terms of avoiding “friendly fire”, I suspect it’s the top reason limiting its growth. The browser extension ecosystems are definitely a weak link in term of security. Better not have too many random extensions installed. https://arstechnica.com/security/2025/01/dozens-of-backdoored-chrome-extensions-discovered-on-2-6-million-devices/ And now we got all the pieces to run CUDA code in the browser. How will you like your cryptominer? Joke aside this opens interesting use cases. Very interesting research. Property-Based Testing made quite some progress the past few years but indeed it still needs to improve in term of usability. Looking forward to some of that research to get available in existing testing tools. I’m not a huge fan microservice based architectures. That said the parallel done there is interesting and a good reminder that the “write programs that do one thing and do it well” quote is incomplete. Interesting exploration on the difficulties to switch a team to XP. I’m not fully aligned with some of the fine details pointed there… That said there is a core truth that “XP is about social change” so if you mandate it as a managerial decision it can’t be XP anymore."
