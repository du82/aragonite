description = "Website Description"
full_description = "Tags: web-review, decision-making, foss, architecture, web, programming, copyright, ai, infrastructure, codereview, databases, agile, criticism, business, cpu, logging, availability, improving, craftsmanship, optimization, multithreading, ethics, tools, gpt, http, kde, pairing, trust, vendor-lockin, performance, python, technical-debt, cost, safety, machine-learning, developer-experience, tech, science, management, security Very good interview. She really point out the main issues. Quite a lot of the current debate is poisoned by simplistic extrapolations based on sci-fi. This distracts everyone from the very real and present problems. https://www.fastcompany.com/90892235/researcher-meredith-whittaker-says-ais-biggest-risk-isnt-consciousness-its-the-corporations-that-control-them Interesting new tool for easily setting up dev environments. The real added value to previous such tools is it’s open source nature and the fact that you can fully control on which infrastructure the environments will be created. Interesting take. Will it lead to paying more attention to performance in software? Will it be the rise of the specialized CPUs? Time will tell. Good explanation of how flame graphs are produced and how to read them. Gives a few tips on what to look for to optimize. Updating database schema or interfaces between services should take time if you want to limit the downtime. The extra work involved might mean you should accept a little downtime instead. It probably should be on a case by case basis rather than a blanket policy. Definitely this. It takes time of course, I don’t do it nearly enough… I never regretted it though. Interesting points in this article. The exact definition doesn’t matter much. What really matters is the common understanding within a team of what technical debt is. It’s also a good idea to be able to link it to actual money and business impacts. Definitely this. This is an interesting talk, most thing shouldn’t be shiny. It’s not about stagnating of course, but you should think more than twice before adding a new technology to your stack. Mastery is when you know everything that’s wrong with a piece of tech, before that keep in mind the amount of unknown unknowns and the cost of exploiting something new."
