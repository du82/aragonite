["https://ervin.ipsquad.net/blog/2024/03/01/web-review-week-2024-09"]
title = "Web Review, Week 2024-09 - ervin"
description = "Website Description"
full_description = "Tags: web-review, rss, criticism, ethics, mozilla, power, gpt, complexity, craftsmanship, fediverse, tools, python, mathematics, tech, performance, ai, social-media, project-management, science, graphics, machine-learning, c++, kde, agile, apple, version-control, architecture, law, video, management, transparency, frontend, google, 3d, hdmi, git, physics, programming, trust, browser, learning, privacy, autonomy, web, software, matrix, foss A nice little review of our latest major releases. Looks like it’s well accepted so far. Very glad! All good reasons to use Firefox! I’m always about the market share of engines where we need diversity, but more good points are brought up here. It’s the only going the extra mile to respect your privacy while bringing innovative features too (tested the in browser translation recently and it’s great). A bit of a long rant, still the core of the argument stays true. Apple will do everything in its power to keep their platform captive of their app store. A good exploration of the Fediverse to Bluesky bridging debate from the angle of consent and the GDPR. It’s complicated and that shouldn’t come as unexpected. Interesting paper attempting to prove that hallucinations are unavoidable in those models. It is well balanced though, and explains why it’s not necessarily a bad thing in theory. In my opinion, the problem is the marketing talk around those models making grand claims or denying the phenomenon. Might be an interesting trick to reduce the computation and energy costs of large language models. Let’s see if it gets replicated and generalized, this is a single short paper not peer reviewed anywhere as far as I can tell. Ever wondered how look-up tables are used for graphics? This is a good summary. Shows quite a few use cases which can come in handy. Interesting exploration of what could be done in a 3D engine using plane-based geometric algebra (PGA). This brings in nice properties that matrices don’t have. And the performance impact is apparently not as bad as one could have suspected. I definitely look more into it."
