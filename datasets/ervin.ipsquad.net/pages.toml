["https://ervin.ipsquad.net/blog/2024/07/26/web-review-week-2024-30"]
title = "Web Review, Week 2024-30 - ervin"
description = "Website Description"
full_description = "Tags: web-review, sustainability, networking, machine-learning, foss, tools, hiring, remote-working, developer-experience, physics, tech, safety, data, graphics, astronomy, benchmarking, windows, research, c++, transportation, crdt, security, gpt, hardware, time, psychology, commons, programming, javascript, storage, bios, type-systems, politics, rust, ai, tests, criticism, licensing It’s a piece which really resonates with me. I’ve been thinking and saying for a while that focusing mostly on the technical (licensing and dev) aspects of Open Source was a mistake. This completely overlooked the political side of the Free Software equation. This is why the industry is as it is now. We need stronger commons and indeed the AGPL is best for that. A few surprises in there but otherwise it feels a bit like a repeat from last year. I keep being dismayed at how low the ethical concern of the energy impact of generative AI scores in this survey. https://arstechnica.com/information-technology/2024/07/microsoft-says-8-5m-systems-hit-by-crowdstrike-bsod-releases-usb-recovery-tool/ Content creators are clearly annoyed at the lack of consent. The more technical ones are trying to take the matter in their own hands. https://arstechnica.com/information-technology/2024/07/astronomers-discover-technique-to-spot-ai-fakes-using-galaxy-measurement-tools/ More discussion about models collapse. The provenance of data will become a crucial factor to our ability to train further models. A reminder that Secure Boot is worth nothing if the device makers don’t manage cryptographic keys properly… https://arstechnica.com/security/2024/07/secure-boot-is-completely-compromised-on-200-models-from-5-big-device-makers/ Make sure to read also part 2. You’d expect critical infrastructure like this to not be exposed over the Internet, and to be properly protected… Interesting comparisons, some of it was a bit unexpected to me. I didn’t expect SSHFS to be that OK. This can definitely come in handy. I can see myself using it for testing behaviors in the past or the future on a real application. This should also help writing automated tests in some cases."
