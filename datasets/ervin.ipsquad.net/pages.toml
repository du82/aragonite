["https://ervin.ipsquad.net/blog/2021/03/12/web-review-week-2021-10"]
title = "Web Review, Week 2021-10 - ervin"
description = "Website Description"
full_description = "Tags: web-review, hr, sqlite, machine-learning, rss, reliability, framework, rust, ecology, hacking, surprising, mathematics, strikes, databases, science, resources, social-media, sensors, covid, hollywood, 3d, pentesting, security, data-science, complexity, movies, capitalism, tech, economics, ai, geospatial, asynchronous, spy, neural-networks, git, hiring, emacs, javascript, mantis-shrimp, culture, physics, sql, vim, history Interesting summary about the debate around the existence of complex numbers or the fact that they are just a convenient mathematical tool. Once again quantum mechanics are at it creating issues. ;-) Or why having everything market driven is a bad idea… we could have a patent-free COVID-19 vaccine by now which could be mass produced everywhere, we collectively decided to not even try. Fascinating findings around artificial multimodal neurons. Especially interesting is how they encode information but also how they open the door to new attacks to the corresponding neural networks. Interesting discussion… could people go on strike toward providing data to big tech to demand change? At that point it seems to me more like an interesting thought experiment than something really doable… Probably worth monitoring where the conversation goes. Now this is a massive hack… and it might be more widespread than it sounds, I have a hard time believing it’s only one group exploiting this. That’s kind of the problem when you put all your eggs in the same basket. https://arstechnica.com/gadgets/2021/03/tens-of-thousands-of-us-organizations-hit-in-ongoing-microsoft-exchange-hack/ Interestingly it’s likely we’ll see more of those shortages in the future, probably in cycles and not only for cars. In the end this is mainly because the access to the raw materials to make semiconductors is becoming harder. As more parts of our society make things “smarter” there will be more competition from different industries to get access to those semiconductors."
