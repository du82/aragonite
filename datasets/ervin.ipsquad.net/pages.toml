full_description = "Tags: web-review, javascript, history, pdf, business, water, databases, robotic, browser, amazon, codereview, web, surveillance, tools, attention-economy, caching, redis, tech, apple, low-tech, social-media, java, organization, automation, processes With some of the late moves from iRobot to hoard data from their robots as they are mapping homes during their work, this acquisition is a tad worrying. https://www.cnbc.com/2022/08/05/amazon-to-acquire-maker-of-roomba-vacuum-for-roughly-1point7-billion.html Good news for anyone who got to target that evil platform… if you have to make a multiplatform application this might ease your pain. https://gregoryszorc.com/blog/2022/08/08/achieving-a-completely-open-source-implementation-of-apple-code-signing-and-notarization/ Interesting Java history put in perspective. Indeed it’s been stagnant and have been picking up again… reminds me of another famous language. Lots of good advices about processes and organizations. It’s nicely points out that friction is not necessarily wrong… if you get something out of it. Also neat reminder in there that code review are here to complete work which is already socialized somehow. If you can’t find reviewers it’s a sign of an organizational problem when the work started. Let’s get the record about medieval time straight, shall we? They weren’t as filthy as we like to pretend, far from it."
