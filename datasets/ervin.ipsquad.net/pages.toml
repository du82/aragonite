["https://ervin.ipsquad.net/blog/2022/06/03/web-review-week-2022-22"]
title = "Web Review, Week 2022-22 - ervin"
description = "Website Description"
full_description = "Tags: web-review, community, tech, mob-programming, architecture, psychology, remote-working, optimization, tdd, performance, refactoring, system, fonts, programming, browser, css, complexity, unix, decision-making, javascript, craftsmanship, web, management, linux, science, culture, privacy, surprising, politics, python, memory, asynchronous, low-tech Good exercise of prospective for our field. I don’t subscribe to all the analyses in there but the value is in at least starting the conversation about it. Interesting conversation around complexity in code bases. I especially like the point about imagination getting out of control and getting us into speculation. This is indeed often a reason for unwarranted complexity. That’s why you need to always keep the context in mind to make your choices. Also indeed fascinating to me is our ability to forget and reinvent something which was already there years ago. We really need more frameworks where we understand what’s going on all the way through… Excellent deepdive about pipes, on the path to optimization we see how perf is used, how memory is managed by the kernel etc. Very thorough. Excellent collection of surprising behaviors in Python. If stuck or wondering why something works in a surprising way to you, it’s a good place to look. Excellent answer, really loves how humble Ron Jeffries writings usually are. I like how he doesn’t prescribe what to do, but instead describes what happens to him when he does something he shouldn’t (or doesn’t do something he should). He’s definitely human and slips like us all. Interesting interview which explores quite a bit mob programming, where it’s coming from, why Woody Zuill pushed for it, how it is done, etc. I didn’t expect his opinion on why he thinks the name being controversial actually helped spark the conversation around the practice… Very inspiring how he practiced for years to feel comfortable being on stage. I also love at how humble this person is through and through."
