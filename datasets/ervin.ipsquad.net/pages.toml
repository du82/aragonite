["https://ervin.ipsquad.net/blog/2014/08/31/akademy-2014-navigating-the-tracks"]
title = "Akademy 2014: Navigating the tracks - ervin"
description = "Website Description"
full_description = "I meant to write a post about the upcoming Akademy for a while now. Since I submitted quite a few sessions (obviously requiring preparation) and I had to prepare for the KDE Frameworks BoF, I never quite found the time… until now! I’m all done! Actually I just have to pack my bags and hit the road at that point. It’s probably the first Akademy where I’m ready four days before the first flight of my journey. Anyway, Paul’s post on what he plans to see inspired me to do something similar. Let’s see how I’ll navigate the tracks during Akademy. The day before the fun begins for the community at large, the KDE e.V. membership gathers for its annual general assembly. It can be perceived as a day long boring meeting (I know some do), but it’s clearly not like that. It is a very crucial event as KDE e.V. has important responsibilities in order to help the community. For instance such a body is necessary for Akademy itself to exist! It is also represented in the KDE-FreeQt foundation… Clearly an organization not to be underestimated. This year assembly will be especially exciting as several positions are opening in the Board of Directors, which means elections… and candidates. We have quite a few this year which is a good sign of liveliness. Obviously I can’t miss Sascha Meinrath’s keynote. I had the opportunity to meet Sascha during FISL 15 earlier this year. He is probably one of the most interesting persons I met during the last couple of years! I discussed with him some of the points he’ll likely touch in his keynote about Digital Feudalism. Definitely something people should attend as it is crucial for the years to come in the Free Software movement. Then I will obviously attend the fast track session. To me we got a few which clearly stand out like GCompris transition to QtQuick, Everything Qt, A year with Akonadi and Using KF5 in commercial applications. This fast track will conclude my first morning. The afternoon is then packed with quite a few interesting talks. Since I can’t duplicate myself I won’t be able to attend everything I’d like to… I urge application developers to attend Porting to KDE Frameworks 5 and Porting to QML."
