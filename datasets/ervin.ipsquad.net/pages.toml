description = "Website Description"
full_description = "Tags: web-review, tech, profiling, tests, kanban, search, technical-debt, science, c++, history, diagrams, interviews, c, culture, agile, performance, javascript, java, product-management, security, engineering, vaccines, management, go, python, shell, craftsmanship, programming, project-management, refactoring, markdown, estimates This is an interesting (and concerning) type of rootkits. Hard to tell how much of it really is in the wild at the moment. One of the best developer tools around for analysis and profiling. I’m glad it exists, saved me a few times. Looks like a somewhat recent alternative in the search engine and document indexing space. Sounds potentially interesting. Good collection of tools, I knew a couple but not all of them. Will go well with markdown uses or similar. Wow, this is a very good exploration of the performances of several common languages and runtimes. This is one of the most thorough I’ve seen. A good resource for deciding what to pick. Nice new feature coming to C. This is useful stuff. It required quite some fighting to get in though. Very interesting musing about the technical terms we often use wrongly and how it difficult it is to be understood. Now this is a well balanced piece about estimates. Starting from the “why” to decide how you approach the estimates and the level of details is just very good advice. That’s nice to see a reusable framework to help organizations get started with their engineering ladder. I already do some of that reading code for some profiles, although it’s more geared towards finding mistakes in the code. I like the proposed approach here, will try to do some more of it."
