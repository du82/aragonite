title = "Web Review, Week 2022-19 - ervin"
description = "Website Description"
full_description = "Tags: web-review, foss, bluetooth, nvidia, craftsmanship, sqlite, xp, ecology, python, databases, rust, networking, lobbying, security, backend, type-systems, simplicity, complexity, gpu, safety, plastics, wifi, tech Indeed, we loath wires… but going wireless has its own set of issues. It never completely breaks but it can easily degrade for no apparent reason which could be anywhere in the stack. The tone of the article isn’t exactly to my liking, sounds “too good to be true” at times ignoring important details driving the choices (despite some warnings early on). Still, depending on the amount of data stored in your database, SQLite looks increasingly viable on the server, replication even coming down the road. I like it when type systems can express this kind of constraints. It clearly allows to catch mistakes early in the development cycle. The best waste is the one you didn’t create in the first place. If you still had doubts that recycling plastics is a scam, it’s definitely something to read. It was again a trick to turn into a “personal responsibility” something which was a collective failure."
