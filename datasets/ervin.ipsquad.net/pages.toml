["https://ervin.ipsquad.net/blog/2022/12/30/web-review-week-2022-52"]
title = "Web Review, Week 2022-52 - ervin"
description = "Website Description"
full_description = "Tags: web-review, hash, public-domain, social-media, dns, linux, c++, foss, culture, life, business, rust, gpt, performance, programming, desktop, politics, frontend, neural-networks, probability, python, ai, philosophy, security, simulation, trust, DRM, system, values, webassembly, safety, vendor-lockin, networking, go, tech As they say: follow the money. That gives an idea about the incentives and various agendas behind this take over. There are a few reasons to worry about the latest strain of generative neural networks. One of them is the trust we can place in new generated content. The other one is indeed the impact on our culture. There’s been already a trend at focusing on what sells rather than what’s truly novel or avant-garde. This could well push it further. We’ll we drown in mediocre content? A few compelling arguments for the impact of the latest strain of generative neural networks. The consequences for the eroded trust about online content are clear. I’m less convinced about some of the longer term predictions this piece proposes though. International Domain Names indeed opened a whole can of worms. This creates plenty of opportunities for confusions and mistakes waiting to happen… or to be exploited. Like it or not, this is definitely filling a very unique niche. It’s a very good fit for system software where safety is important and available time limited. There is no better option for now. Python is getting faster but is still far from what you can get with C++ of course. That said, for simulations you likely don’t want everything in Python or in C++. Part of the challenge is to split the subsystems properly and use C++ where it matters. https://medium.com/agents-and-robots/the-bitter-truth-python-3-11-vs-cython-vs-c-performance-for-simulations-babc85cdfef5 Nice article. Keep an eye on potential collisions indeed. Depending on the use of your hashes this can be critical. This is indeed a strange default used for sockets there… will have bad consequences for sure in more situations than expected."
