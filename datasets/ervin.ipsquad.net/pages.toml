["https://ervin.ipsquad.net/blog/2022/11/11/web-review-week-2022-45"]
title = "Web Review, Week 2022-45 - ervin"
description = "Website Description"
full_description = "Tags: web-review, tdd, biology, economics, tests, microsoft, management, docker, architecture, surveillance, command-line, framasoft, tech, ai, leadership, science, psychology, burnout, problem-solving, optimization, politics, design, project-management, linguistics, funny, business, genomics, failure, developer-experience, tools, work, machine-learning, chroot, strategy, java, programming Very early days for research on this topic and the sample is rather small still. That said the results are interesting, there seems to have a few biases inherent to the use of such an assistant, there’s also clearly a link between the AI agency and the quality of what gets produced. We’ll see if those result holds to larger studies. Indeed in the context of the feature it kind of make sense… still, where was the consent or the warning to the user? Indeed, I encounter that same idea in some people. I’m unsure where it comes from, it feels like reading and extrapolating from something more reasonable (it’s like the “one test per line” I sometimes hear about). Bad idea indeed, it’s fine to have several assertions, it’s probably often required to avoid complexity explosion in your tests. This of course doesn’t mean your test should become unfocused. Very important topic. Nice to see more such teams appearing and thinking now focusing on how to structure them. Interesting framework for sustaining a strategic train of thoughts for the long term. This can’t be a fix thing, it needs to live and breather which this approach seems to foster. Interesting story on how power plays can sometimes completely hide the fate of a project until it’s too late. Definitely a cautionary tale. Interesting food for thought. Not necessarily easy to see it used in as many fields as the article claims. Maybe a bit too much on the techno solutionist side at times. Still, that sounds like an interesting guideline and path to explore. Interesting take on burnout as an organizational phenomenon and the consequences. This is not simply about the amount of work."
