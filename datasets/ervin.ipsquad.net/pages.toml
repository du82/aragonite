["https://ervin.ipsquad.net/blog/2024/10/25/web-review-week-2024-43"]
title = "Web Review, Week 2024-43 - ervin"
description = "Website Description"
full_description = "Tags: web-review, career, hr, cognition, design, machine-learning, debugging, economics, browser, funny, tech, ip, developer-experience, protocols, optimization, politics, knowledge, craftsmanship, python, democracy, language, fair, energy, management, backend, microsoft, programming, bookmarks, learning, copilot, ai, internet, tests, tools, neuroscience, note-taking, sqlite, research, markdown, engineering, transparency, databases, complexity, framework, firefox, postgresql, statistics, security, logic, qt, gpt, unix, criticism Let’s go for my web review for the week 2024-43. It’s published later than usual since I’m attending the Ubuntu Summit 2024 and had to travel because of it. This is indeed telling unfortunately. It’s kind of ironic that they felt the need of having their own debloat scripts. This is just insane, claiming two opposite things to different demographic groups for political gains. And if you try to stop this kind of manipulative stunts they’d probably cry wolf about free speech… https://www.404media.co/this-is-exactly-how-an-elon-musk-funded-pac-is-microtargeting-muslims-and-jews-with-opposing-messages/ https://www.theatlantic.com/newsletters/archive/2024/10/big-tech-has-given-itself-an-ai-deadline/680301/ This is what you get by making bots spewing text based on statistics without a proper knowledge base behind it. https://arstechnica.com/ai/2024/10/google-microsoft-and-perplexity-promote-scientific-racism-in-ai-search-results/ Using the right metaphors will definitely help with the conversation in our industry around AI. This proposal is an interesting one. Very interesting research. Looks like we’re slowly moving away from the “language and thinking are intertwined” hypothesis. This is probably the last straw for Chomsky’s theory of language. It served us well but neuroscience points that it’s time to leave it behind. Now this is an interesting paper. Neurosymbolic approaches are starting to go somewhere now. This is definitely helped by the NLP abilities of LLMs (which should be used only for that). The natural language to Prolog idea makes sense, now it needs to be more reliable. I’d be curious to know how many times the multiple-try path is exercised (the paper doesn’t quite focus on that). More research is required obviously."
