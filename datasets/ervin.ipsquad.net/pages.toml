["https://ervin.ipsquad.net/blog/2024/10/11/web-review-week-2024-41"]
title = "Web Review, Week 2024-41 - ervin"
description = "Website Description"
full_description = "Tags: web-review, android, linux, decision-making, gpt, machine-learning, wayland, design, self-hosting, htmx, programming, databases, graphics, web, html, research, business, unix, tech, cognition, ai, coroutine, foss, colors, frontend, google, codereview, cpu, complexity, shader, data-visualization, surveillance, energy, psychology, scam, multithreading, engineering, tech-lead, governance, kde, gpu, system, anxiety, c++, performance, science, ux, memory Looks like we properly live by the “simple by default, powerful when needed” tagline. Now there are also challenges, this article gives a nice balanced view. Nice paper which debunks the choice of the language as an important factor for energy efficiency. The previous papers had a too simple model, this one puts forth a more complete causal model. There are many factors at play regarding energy efficiency, the programming language itself is not really one of them. Indeed, we should stop listening to such people who are basically pushing fantasies in order to raise more money. Excellent point, we made the web too complex for regular users. This is actually an issue in term of access and democracy for people to write content there. There is hope! Nice intro for regular people who want to get into publishing a web site. Good way to bring some democracy back to the web. I don’t think I would side with the conclusion. It’s a worthwhile article to get a better idea of the pain points around htmx. Yes, the governance of Open Source projects can be tricky. This is part of the job though, and properly embraced we all go further. An example from the Wayland space. Indeed, we should likely revisit what we put in our PATH environment variable. Some of it is old cruft which is now unnecessary. Several ways to deal with the task, which are the performance implications? Clearly coroutines aren’t the best tool for the job here. https://lemire.me/blog/2024/10/06/iterating-through-matched-characters-in-modern-c-viewsfilter-and-coroutine/"
