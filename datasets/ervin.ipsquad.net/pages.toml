description = "Website Description"
full_description = "Tags: web-review, react, leadership, team, postgresql, privacy, ssh, shell, services, databases, security, anonymity, processes, debugging, productivity, ai, system, c++, hardware, tdd, complexity, philosophy, python, criticism, architecture, cognition, machine-learning, software, profiling, bias, performance, tech, css, standard, posix, telegram, unix, management, linux, web, maintenance, codereview, frontend, tests, asynchronous, spam, internet, programming, organization, go, gpt, ethics, planning, quality, tools There’s clearly an interesting balance between full anonymity and no anonymity at all. This is a path to keep discussions genuine and civil. https://theconversation.com/online-anonymity-study-found-stable-pseudonyms-created-a-more-civil-environment-than-real-user-names-171374 This organization indeed doesn’t seem healthy. Especially regarding the amount of user data they are responsible of. https://techcrunch.com/2024/06/24/experts-say-telegrams-30-engineers-team-is-a-security-red-flag/?guccounter=1 Makes a strong case about why LLMs are better described as “bullshit machine”. In any case this is a good introduction into bullshit as a philosophical concept. I guess with our current relationship to truth these are products well suited to their context… From the perspective of a given implementation. Still this is a good list of what POSIX 2024 changes. I’m particularly interested to see that per-file-descriptor advisory locks finally made it to the standard. Still some progress to make in this department but it’s a good step already. Looks like C++26 is going to be a big deal. The reflection and generation features alone are going to be a game changer. Now if it also gets contracts it’d be really nice. Obviously very opinionated. Still probably a nice list to pick from when making your own project specific coding guidelines. Not really Rust specific, this might be an interesting way to structure your code once async gets introduced. Should avoid some of the usual traps."
