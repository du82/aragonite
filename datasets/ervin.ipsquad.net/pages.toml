["https://ervin.ipsquad.net/blog/2022/03/25/web-review-week-2022-12"]
title = "Web Review, Week 2022-12 - ervin"
description = "Website Description"
full_description = "Tags: web-review, design, sustainability, scam, sociology, music, legal, gafam, architecture, power, supply-chain, community, amazon, complexity, blockchain, physics, culture, politics, programming, commons, team, web3, tech, debugging, tcp, static-analyzer, science, foss, 3d, craftsmanship Yet another (well deserved) rant aiming at web3. The decentralized claim is indeed preposterous. I hope no one is being fooled. Now that’s an interesting idea to give back money to maintainers… can be sustainable only if enough company do this on a regular basis though. Interesting list of criteria about why you might not use some piece of tech. Also delves into why this is often not public knowledge. Bunch of good advice. In a way it boils down to: name things properly and use static analysis tools extensively. Still, couple of nice operational guidelines which work in most languages. Real-time rendering is catching up fast… Even humans are being very realistic now, we’re almost out of the uncanny valley now. You think you don’t use power on others? Think again, this can be more subtle than you think. Keep it in mind, be mindful and try to use your advantages fairly."
