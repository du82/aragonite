["https://ervin.ipsquad.net/blog/2021/05/28/web-review-week-2021-21"]
title = "Web Review, Week 2021-21 - ervin"
description = "Website Description"
full_description = "Tags: web-review, japan, climate, liberachat, arm, frontend, book, web, healthdatahub, philosophy, craftsmanship, surveillance, css, freenode, surprising, repair, logging, estimates, javascript, irc, cpu, metadata, speech, tech, tracing, fediverse, ai, art, programming, intent, covidtracker, react What is the existence of CovidTracker, the definition of the HealthDataHub and the communication around them by the French Government says about the abilities and mindset of the French State? Not much good… it’s basically about trumping individualism and abandoning the regalian to the platforms even more. If you still wonder how ads work on the web and on mobile, this thread summarizes it well. They just farm us. This is definitely not for technical reasons only. Another case of “this is not a tool problem”, it’s really politics. Interesting article about tracing, especially on the client side and how to correlate it with the server side tracing. https://slack.engineering/client-tracing-understanding-mobile-and-desktop-application-performance-at-scale/ https://www.anandtech.com/show/16693/arm-announces-mobile-armv9-cpu-microarchitectures-cortexx2-cortexa710-cortexa510 Interestingly, I’m going through this book right now and indeed I have to agree with most of this article. It didn’t age well, it’s become a mix of nice advises, things which are kind of obvious nowadays and points which are clearly obsolete. I find that “The Clean Coder” (different topic I know) aged way better. I think I’ll give a shot to the proposed alternative book to see… Looks like an interesting alternative to three point estimates. Indeed it feels a bit more complex at first but in practice it might require less discipline than three point estimates. Often three point estimates can devolve into forced distribution for tasks. I have already seen enough time cases where most likely is always say twice the optimistic case, and pessimistic four times the optimistic case for all tasks. By forcing to explicitly treat the uncertainty as a separate metric it’s seems less error prone."
