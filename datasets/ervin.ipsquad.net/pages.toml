["https://ervin.ipsquad.net/blog/2021/06/11/web-review-week-2021-23"]
title = "Web Review, Week 2021-23 - ervin"
description = "Website Description"
full_description = "Tags: web-review, social-media, economics, tech, refactoring, management, decision-making, project-management, facial-recognition, kde, python, quality, estimates, attention-economy, forecasting, surveillance I read that book out of curiosity a long while ago. This post articulates quite well why I hated it. It’s built upon selfishness and inequalities. A good illustration on why social media are toxic for our thinking. They push us to focus on anecdotes and as such miss the big picture. No wonder everything got so polarized so quickly there. Very important open letter, this kind of biometric surveillance is becoming pervasive and should be stopped earlier than later. AST tooling is great for porting code and code quality checks. Here are a couple of examples in python. Very interesting discussion about decision making and forecasting. I’m discovering Tetlock as he is mentioned and his findings are interesting in their own right as well. Last part about estimates. Plenty of very good advises again on how to deal not meeting a deadline. Communicating the bad news early is key. Excellent advises on project planning and management. It explains pretty well why being optimist in those areas will just drive your project through a wall. https://blog.devgenius.io/stockdale-paradox-why-optimists-dont-survive-software-projects-27ada5b3fec1"
