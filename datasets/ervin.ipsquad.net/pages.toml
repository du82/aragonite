["https://ervin.ipsquad.net/blog/2023/03/03/web-review-week-2023-09"]
title = "Web Review, Week 2023-09 - ervin"
description = "Website Description"
full_description = "Tags: web-review, university, quality, gui, godot, complexity, frontend, python, gaming, mathematics, design, teaching, learning, maintenance, ux, gpt, ecology, team, tools, ethics, culture, nokia, 3d, web, criticism, mobile, business, tech, ai, react, technical-debt, c++, craftsmanship, compression, programming, decision-making, product-management, tests Coming from Zombie Nokia, still I think we need more options like this. It is the number one solution to reduce ecological footprints of computing. https://www.theguardian.com/technology/2023/feb/25/nokia-launches-diy-repairable-budget-android-phone When they changed their statutes it was the first sign… now it’s clear all ethics went through the window. It’s about fueling the hype to drive money home. https://www.vice.com/en/article/5d3naz/openai-is-now-everything-it-promised-not-to-be-corporate-closed-source-and-for-profit That’s a good set of questions to ask ourselves when in contact with a product claiming the use of “AI”. This newer standard brings up interesting features again. I’m especially interested in std:expected myself. This really looks like a nice library for symbolic maths. Keep in mind it’s python based but it goes all the way to generating solutions to the given problem in various languages. Interesting new compression format around the corner. Might turn out useful in some cases. I could definitely have used it last year for a test harness with very large reference data (so no, not gaming). A bit of a rant so brace yourselves. Still, it’s very much aligned with the current backslash against “everything must be an SPA” trend and makes very good points on how it happened. This indeed turned into a popularity contest based on false premises. Meanwhile… complexity increased dramatically on the web frontend side and the performances are bad for most users. Very nice set of rules. They are very simple to apply individually. The art is in respecting it all of course. Good musing about simple code and complexity. We definitely should avoid unwarranted complexity in our code, or at least try to prevent it’s spreading."
