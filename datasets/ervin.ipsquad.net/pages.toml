["https://ervin.ipsquad.net/blog/2022/01/07/web-review-week-2022-01"]
title = "Web Review, Week 2022-01 - ervin"
description = "Website Description"
full_description = "Tags: web-review, tech, cors, self-hosting, children, ai, web, performance, monitoring, knowledge, gafam, decision-making, http, security, neural-networks, book, floats, history, notifications, ux, mathematics, management, surprising, multithreading, profiling, funny, infrastructure, hr, design, captcha, interviews Indeed, don’t use this by default. This is likely overkill and has terrible side effects. Look up for the alternatives proposed in this article first. Interesting article about how we badly design AI systems which make them very vulnerable to the quality of the data they receive. That’s in part why I’d expect that somehow we’ll see knowledge representation somehow come back in fashion because they have some potential to lead to better explicability in models. Very well makes the point on why general AI or good conversational bots are nowhere in sight with neural networks. It’s just freaking hard to push general knowledge into those networks… Also there’s the limit of not having a body and not feeling pain. This is indeed still a requirement to learn things and give them meaning. Interesting ideas for hosting your own infrastructure. Some things I do similarly, others I do differently. Good food for thought. Now this is a really neat way to explain how floats work and how you loose precision. Definitely a good trick I should keep in mind when I have to talk about them, it’s always been a chore to explain them. Excellent series about work sample tests during interviews. Definitely good food for thought in there, I already changed how I was doing a few things with it and what I tested worked nicely so far. This is a funny satire about children from the UX point of view. You can tell this designer would want a few improvements. :-)"
