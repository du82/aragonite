title = "Web Review, Week 2021-13 - ervin"
description = "Website Description"
full_description = "Tags: web-review, hr, interviews, tools, economics, optimization, pandemic, php, python, ecology, privacy, security, vaccines, tech, fungi, science, surprising, anonymity, hiring, sponsorship, fonts, unix, rust, frontend, mentoring, profiling, green-it, amazon, diversity, dystopia Granted the whole pandemic thing is horrible, but there’s still some light in the darkness. Despite all the suffering we made a couple of steps forward as a species. Now this is a very surprising and intriguing approach. I’m fascinated about all the uses we find for fungi lately. https://www.eff.org/deeplinks/2021/03/dystopia-prime-amazon-subjects-its-drivers-biometric-surveillance When you can’t trust your git repository anymore you’re in big trouble… This makes GitHub even more of a tempting target now though and it has its own ACLs challenges… Interesting data point about hiring someone. I stay convinced that it needs to take time, it kinds of confirm it. Another one about the hiring process. Focuses mostly on the time used for the interviews though. Same thing it takes time: several long interviews. Also especially interesting it focuses on the real questions underneath the interview and there are not many of them: it’s mostly about can we work together and if yes where is the candidate positioned skill wise compared to current employees. As it’s very well put: “everything else is literature”. When we’re reminded that “software eating up the world” is in fact a very material things. More and more things around us are getting electronics and batteries due to this. This should all be treated as a non renewable resource because the raw materials it depends on are getting depleted fast. Tension on nickel could increase as early as 2027. https://ec.europa.eu/jrc/en/publication/study-future-demand-and-supply-security-nickel-electric-vehicle-batteries Yes, fonts are hard to deal with… No it doesn’t need to be like this. I suspect it’ll stay like this for a long while though."
