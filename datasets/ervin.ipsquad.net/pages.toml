["https://ervin.ipsquad.net/blog/2024/05/03/web-review-week-2024-18"]
title = "Web Review, Week 2024-18 - ervin"
description = "Website Description"
full_description = "Tags: web-review, apple, parsing, google, tech, systemd, security, deployment, physics, mathematics, bytecode, flutter, advertisement, social-media, history, vendor-lockin, culture, java, project-management, fediverse, streaming, infrastructure, rust, tools, foss, web, graphics, c++, criticism, python, 3d, hardware, programming, command-line, shader, funny, internet, blog I’ve been listening to these radio channels the past few weeks. It’s quirky, it’s weird, it’s wild. I definitely recommend them to get out of your usual music bubble. Very nice account of how the Internet is nowadays and how it got there. I like the gardening metaphor which works nicely here. And yes, we can go back to a better Web again. It’s a collective decision though, that’s what makes it hard. Definitely this. Get the content you like known, send appreciation messages to the authors. This should keep the moribund web alive. Ever wondered why the quality of websites seems to go down? Well, here is a case study of what you end up needing to do if you try to fund a website through ads (like most websites). Looks like Flutter’s days are counted. It seems it has peeked and announcements like this are likely to move people away from it. Time will tell of course. Indeed there are more and more signs of the Apple vendor lock-in to be in trouble. And that’s a good thing. Sure you can expect mice, but raccoons? This is a funny finding… well scary if you’re responsible of this machine room. Looks like an interesting tool for infrastructure automation. It’s all Python based which is an interesting departure from yaml files in that space. Could be a nice alternative to Ansible. I might take it out for a spin. Probably shouldn’t do this in most case… but if it’s really needed and you can bare the pain, Java has solutions for you. This is an interesting dive in lower parts of the APIs. Interesting musing about the concept of friction in strategy. There are indeed a few lessons to learn from it in the context of software projects."
