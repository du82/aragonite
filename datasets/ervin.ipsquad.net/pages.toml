["https://ervin.ipsquad.net/blog/2023/02/03/web-review-week-2023-05"]
title = "Web Review, Week 2023-05 - ervin"
description = "Website Description"
full_description = "Tags: web-review, facebook, foss, tech, knowledge, c++, ai, decision-making, c, machine-learning, agile, sqlite, gpt, data, programming, work, mathematics, hr, business A few interesting points in there. Too much hype and important points are glanced over, we’d all benefit from them being more actively explored. Oh the irony! Are we surprised? No not really… apparently who wields the tool makes it acceptable or not. https://www.bloomberg.com/news/articles/2023-02-02/meta-was-scraping-sites-for-years-while-fighting-the-practice Looks like an attempt to sow fear in the workers at Big Tech. Hopefully it’ll lead instead to a better organization of the workers across the industry and people leaving Big Tech altogether to join less toxic environments. https://www.latimes.com/business/technology/story/2023-01-30/column-how-big-tech-is-using-mass-layoffs-to-bring-workers-to-heel Very nice summary of the architecture in the latest trend of transformer models. Long but comprehensive, a good way to start diving in the topic. An interesting but sometimes forgotten possibility for extending SQLite. Keep in mind this can lead to bad coupling between the software and the DB though which could carry interesting challenges around upgrades for instance. Excellent conclusion to the recent turmoil around undefined behaviors. The way they are currently used as definitely a problem, they shouldn’t be ignored in your code (although that’s admittedly not that easy). There’s hopefully a path forward. Too often forgotten. Data is indeed a mean to an end. It’s not outright knowledge and will require work to be useful. It better be aligned with your needs if you want to use it for decision making. OK, this is the best critique of the “Spotify Model” I’ve seen around. There’s been plenty of unfair criticism thrown at this “model” (never aimed to be something you fully replicate though, hence the complaints I think). This one is properly balanced and doesn’t just throw everything in the garbage bin, it takes the model bits by bits and try to highlight where the limits are. Very constructive."
