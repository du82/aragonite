["https://ervin.ipsquad.net/blog/2023/09/22/web-review-week-2023-38"]
title = "Web Review, Week 2023-38 - ervin"
description = "Website Description"
full_description = "Tags: web-review, python, programming, business, gaming, type-systems, spam, java, repair, servo, rust, kernel, 3d, licensing, matrix, databases, tech, messaging, linux, sql, foss, fonts, talk, blog, supply-chain, funny, communication, apple, presentation, metaprogramming, map, ecology, community, web Unsurprisingly after people massively converged to two main closed source engines for their games, they start to be massively screwed over. Maybe it’s time for them to finally turn to Free Software alternatives? https://ramatak.com/2023/09/15/unitys-new-pricing-a-wake-up-call-on-the-importance-of-open-source-in-gaming/ Sure they’re pulling some effort on the way their hardware is produced and cheap. But don’t be fooled by the grand claims, this can’t be carbon neutral. What are the hardware improvements good for if it’s all locked down through software? This is wasted. Interesting review, this seems mostly aligned with my own experience. That said I got less mileage since I use it mostly when walking around places I don’t know well. Interesting, the situation for kernel maintainers is actually harder than I thought. You’d expect more of them could do the maintainer job on work time… https://www.zdnet.com/article/long-term-support-for-linux-kernel-to-be-cut-as-maintainence-remains-under-strain/ Lots of progress, they’re finally delivering on past announcements at FOSDEM it seems. Let’s hope the spec effort catches up though. There’s still some work to secure the Python supply chain. It’s clearly suffering from fragmentation and ambiguous data. Lots of possibilities in the JVM to monkey-patch some behavior. Most of them are a bit involved though. Interesting free font. Made for aeronautics, but brings interesting properties which might be useful in other contexts as well. Created around Toulouse and my old University too! Interesting trick indeed. I’ll try this when I get the chance. Clearly this avoids the underwhelming atmosphere closing after most Q&A session."
