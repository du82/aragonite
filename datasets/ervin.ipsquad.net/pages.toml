["https://ervin.ipsquad.net/blog/2024/04/05/web-review-week-2024-14"]
title = "Web Review, Week 2024-14 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, community, rss, type-systems, server, performance, frontend, developer-experience, teaching, power, craftsmanship, communication, cpu, kde, refactoring, tdd, copilot, asynchronous, supply-chain, safety, memory, quality, javascript, machine-learning, git, compiler, python, mathematics, version-control, ai, learning, social-media, privacy, django, foss, design, pairing, management, tests, sustainability, logic, dbus, dns, sqlite, gpt, optimization, mentoring, apple, burnout, databases, llama, ntp, static-analyzer, energy, rust, ssh, programming, processes, organization, web, coaching, complexity, c, tech, system, remote-working, time, scam Let’s go for my web review for the week 2024-14. I will be vacationing next week, so I might skip next week post. We’ll see. Good analysis of the backdoor recently discovered in xz. Really a bad situation. Luckily it was probably detected before it could do any real damage. What’s especially striking is the amount of patience it required, it’s really been put in place over a long stretch of time to reduce chances of detection. Excellent post showing unhealthy consumer/maintainer dynamics in FOSS projects. This particular example was instrumental in getting the xz backdoor in place. https://robmensching.com/blog/posts/2024/03/30/a-microcosm-of-the-interactions-in-open-source-projects/ You think the xz vulnerability was a one time event? Think again, this kind of bullying with ulterior motives happen regularly to critical projects. https://www.404media.co/xz-backdoor-bullying-in-open-source-software-is-a-massive-security-vulnerability/ Definitely a good idea, we’d need several such institutes across the world. Would governments be willing to try this? Can we let the myth of Apple being a proper steward with data privacy to rest please? I don’t know why people took their claims for granted to start… with so much opacity, it’s not a claim you could trust. You should be mindful of the dependencies you add. Even more so when the name of the dependency has been proposed by a coding assistant."
