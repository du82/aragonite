["https://ervin.ipsquad.net/blog/2024/11/22/web-review-week-2024-47"]
title = "Web Review, Week 2024-47 - ervin"
description = "Website Description"
full_description = "Tags: web-review, graphics, hardware, foss, data-science, vr, tools, fediverse, debugging, data, ecology, water, php, politics, c++, security, vendor-lockin, gpt, business, twitter, performance, gpu, career, tech, management, social-media, machine-learning, framework, python, pandas, engineering, ai, economics, craftsmanship, energy, learning We always think about the energy consumption, but large data centers gobble billion liters of water too. This would need to be improved. You’re on the fediverse and you want to reach out bluesky users? This might be the right tool for you (unclear if it’ll scale yet though). At least if and when Bluesky turns bad, people will know where to reach friends next. Excellent post showing reasons to be skeptical about Bluesky’s future. Despite all their likely sincere claims I don’t see how they’ll escape enclosure and enshittification when their sketchy VCs will want to see money back. Sad to see people predominantly jumping from Twitter to other tech moguls walled gardens. This feels more and more like a missed opportunity for the fediverse. That said I’m amazed at how efficient Musk has been at killing the network effect of his platform. This proves it’s actually doable. https://fortune.com/2024/11/14/x-elon-musk-leaving-election-trump-threads-bluesky-social-media-fragmentation/ This is what we get for refusing to regulate social media and for not auditing their algorithms. Their owners can game and bias the platforms as they see fit for their own gains. They became massive forces of manipulation in the process. Good reminder that models shouldn’t be used as a service except maybe for prototyping. This has felt obvious to me since the beginning of this hype cycle… but here we are people are falling in the trap today. OK, the numbers are indeed impressive. And it’s API is fully compatible apparently, looks like a good replacement if you got Pandas code around. Will we see more deployments of C++ standard library with bound checking by default? It definitely looks tempting."
