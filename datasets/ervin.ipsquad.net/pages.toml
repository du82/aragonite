full_description = "Tags: web-review, risk, self-hosting, communication, architecture, language, hiring, complexity, hardware, foss, neural-networks, design, library, react, networking, google, asynchronous, optimization, frontend, mathematics, work, business, api, web, funny, gaming, 3d, hr, machine-learning, version-control, culture, tech, git, decision-making, debian, safety, type-systems, security, programming, performance, elixir, fake, management, portability, privacy, politics, conflict, rust, data-oriented, knowledge, ssh, c4, microsoft, browser, surveillance, c++, ai, life, backend, remote-working, coroutine, phoenix, postgresql, tools, system, webcomponents, http, law, trust, geometry, memory, gui, france, dns, object-oriented, databases, zoom, licensing, geospatial, framework, censorship Let’s go for my web review for the week 2023-34. It’s bigger than usual since it’s a double issue. Please, even if you’re not French go and sign this. It can’t be allowed to pass, this would create a dangerous precedent. https://foundation.mozilla.org/en/campaigns/sign-our-petition-to-stop-france-from-forcing-browsers-like-mozillas-firefox-to-censor-websites/ I admit I’d love it if it made a come back. That’d be a big boost to self-hosting websites for people. Our infrastructures are not quite ready for it though. Definitely this! There are awesome Free Software alternatives to Zoom. We need to get more people to use them https://themarkup.org/hello-world/2023/08/12/this-is-what-happens-when-people-start-actually-reading-privacy-policies Good reminder on how the W3C works and what it evaluates. If Web Environment Integrity would become a “standard” it’d likely be more of a “de facto” thing because a major player shoved it everyone’s throat. https://arstechnica.com/security/2023/08/windows-feature-that-resets-system-clocks-based-on-random-data-is-wreaking-havoc/ Now this could turn out to be interesting. To be confirmed when this get closer to production (if it does), especially on the power consumption side. This will be the important factor to make this viable I think."
