["https://ervin.ipsquad.net/blog/2023/01/20/web-review-week-2023-03"]
title = "Web Review, Week 2023-03 - ervin"
description = "Website Description"
full_description = "Tags: web-review, webgpu, science, hr, gpt, machine-learning, security, project-management, ai, writing, kanban, python, tech, 3d, photography, web, communication, mathematics, performance, programming, management, frontend, technical-debt, estimates, ethics, airline, interviews, kde, biology Very good piece about that dangerous moment in the creation of the latest large language models. We’re about to drown in misinformation, can we get out of it? The human labor behind AI training is still on going. This is clearly gruesome and sent over to other countries… ignoring the price for a minute this is also a good way to hide its consequences I guess. That’s an “interesting” leak, both for how it happens and what it contains. I shows serious biases in the “no fly list” used by airlines. That’s really a massive leak again! The amount of personal data in the wild… will likely help with identity theft too. Nice to see kind words out there. A couple of issues are pointed out of course but nothing which seems critical I think. Yes… python packaging is a mess. I wonder when it’ll get properly unified and get a proper single tool and workflow. Excellent analysis and explanation of the stutter problem people experience with game engines. It’s an artifact of the graphics pipeline becoming more asynchronous with no way to know when something is really displayed. Extra graphics APIs will be needed to solve this for real. This WebGPU framework is getting interesting. Definitely something to keep an eye on and evaluate for productive uses. Obviously requires WebGPU to be widely available before banking on it. Excellent piece about technical debt. The approach proposed is definitely the good one, it’s the only thing which I know to work to keep technical debt at bay. Interesting approach regarding estimates. Might especially make sense combined with kanban like project management. It’s coming from the job interview domain… but I wonder if it could be more largely useful due to how simple it is (but not easy mind you). I guess I’ll experiment with it for my next project postmortem."
