["https://ervin.ipsquad.net/blog/2024/09/14/web-review-week-2024-37"]
title = "Web Review, Week 2024-37 - ervin"
description = "Website Description"
full_description = "Tags: web-review, kernel, memory, browser, packaging, architecture, exceptions, ai, failure, json, business, performance, web, foss, git, product-management, learning, networking, security, search, multithreading, debian, redhat, version-control, project-management, system, c++, design, quality, fediverse, python, tools, engineering, gpt, power, tech, quic, servo, linux, unix, agile, html, community, career, machine-learning, processes, windows, law, profiling Alright… this is published a bit later than usual due to travels and lack of energy. Anyway, let’s go for my web review for the week 2024-37. This is bad. There was no way to know the book was AI generated and clearly it contained errors and lies. https://www.reddit.com/r/LegalAdviceUK/comments/1etko9h/family_poisoned_after_using_aigenerated_mushroom/ It’s good to see servo getting closer to being usable in a browser. Makes me dream of Falkon or Konqueror being resurrected with Servo as the engine. Interesting exploration of the NT design compared to Unix. There was less legacy to carry around which explains some of the choices which could be made. In practice similarities abound. Interesting comparison of the difference in approaches between RedHat and Debian about default system hardening. Ever wondered what happens when you suspend or hibernate on Linux? Here is a very deep exploration of the process from the kernel perspective. Good reminder of what OS threads entails and why they can’t be optimized much further. There’s so much you can do properly in userland. Looks like an interesting little profiling tool. The article explains quite well how it’s been done. Can be a nice blueprint to make other such tools. A couple of flaws in this article I think. For instance, the benchmark part looks fishy to me. Also it’s a bit opinionated and goes too far in advocating exceptions at the expense of error values. Still, I think it shows quite well that we can’t do without exceptions at all, even in the case of error values being available. In my opinion, we’re still learning how both can be cleverly used in code base."
