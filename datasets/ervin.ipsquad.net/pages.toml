title = "Web Review, Week 2024-49 - ervin"
description = "Website Description"
full_description = "Tags: web-review, tech, fediverse, law, safety, engineering, unix, gpu, product-management, research, web, risk, social-media, frontend, react, language, performance, gpt, ai, system, politics, security, management, compiler, benchmarking, foss, project-management, criticism, bluesky, copyright, vision, c++, machine-learning, business, networking, hardware, metrics Very good piece explaining why the Ferdiverse is currently our only option for a decentralized social media platform. Maybe Bluesky will become another option… maybe… but so far it’s only empty promises with a real risk of capture. https://blogs.mediapart.fr/gaetan-le-feuvre/blog/291124/pourquoi-les-medias-devraient-creer-des-serveurs-mastodon-maintenant https://www.niemanlab.org/2024/11/copyright-claim-moves-ahead-in-the-intercepts-lawsuit-against-openai/ Nice vision model. Looks like it strikes and interesting balance between performance and memory consumption. Looks doable to run cheaply and on premise. This is an excellent milestone reached for the OpenWrt project. Easily available hardware is a must. It’s rather cheap too. Good post about the very much overlooked fact that lots of command buffer internally when their output is not a TTY. Interesting research about feasibility of making compilers parallelized on the GPU. I wonder how far this will go. Interesting piece, it highlights well the struggle for the C++ community to come up with a cohesive approach to improve safety. It doesn’t look like the solution is going to come from the standardization committee (unfortunately). Very nice improvements finally coming to structured bindings indeed. Should make them even more useful. Comparing languages based on some benchmark is probably a fool’s errand indeed. To many factors can change between language and benchmark implementations. Excellent piece which shows why React (or Angular) is almost always a bad choice and that you’d be better off banking on the underlying web platform. It leads to better user experience full stop. The article also goes in great length debunking the claims which keep React dominant."
