["https://ervin.ipsquad.net/blog/2023/02/10/web-review-week-2023-06"]
title = "Web Review, Week 2023-06 - ervin"
description = "Website Description"
full_description = "Tags: web-review, criticism, generator, politics, c++, statistics, valve, culture, type-systems, microsoft, tech, gpt, lua, python, machine-learning, energy, memory, security, privacy, data, ai, profiling, google, mypy, kde, dns Very in depth article about the Steam Deck. Interesting look back at it story and situation after a year in the wild. Are we really surprised? This continues a trend they started a few years ago, they don’t want to be left behind Android in that regard. Its limits and biases are well documented. But, what about the ideologies of the people behind those models? What can it tell us about their aims behind those models? Questions worth exploring in my opinion. Interesting work, trying to get back to the source material used by a generative model. This is definitely necessary as well. Interesting post with a good perspective on big data projects over time. It confirms that most people don’t fall in the big data bucket, it’s likely less than a percent of the projects which would qualify. Looks very interesting, I guess I will switch some of my devices to using this and we’ll see how it goes. Good explanation about how sampling works. Does a good job explaining why it shines and where it is limited. Looks like a young but interesting tool to assess the power consumption of a service. There’s been quite some work in this domain on the client side, not so much on the server side. This is welcome. This is lesser known and probably should stay obscure… don’t do that at home kids. Those alternative operators (more like tokens really) don’t help with readability at all and make not much sense with UTF8 code bases. Early days but could become an interesting alternative to Lua for an embedded scripting language in some projects. I very much agree with this. It is a real concern with our industry, we seem indeed to keep reinventing the wheel a lot. How do we stop forgetting? How do we move forward? Very good essay on why we shouldn’t look down on the Luddite. They had plenty of their questioning right and it’s actually pervasive now. We use the term as libel only because back then they lost…"
