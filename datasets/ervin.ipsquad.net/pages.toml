title = "Web Review, Week 2022-08 - ervin"
description = "Website Description"
full_description = "Tags: web-review, surveillance, gif, web, browser, security, tech, amazon, privacy, frontend, information, news, bloat, python, google, linux, legal, multithreading Wow, this indeed looks like a major flaw in the US legal system. It’s at least a good illustration at how major corporations can leverage it for bullying people. https://medium.com/@amy_riveter/the-united-states-of-amazon-the-day-amazon-sent-the-fbi-to-take-my-familys-bank-accounts-b5172b4ddda3 Interesting statistics on how responsive several vendors and projects are regarding security vulnerabilities. Sometimes there can be interesting deviations between specs and implementations. Clearly this is still the case for the GIF format, with surprising results. Contrary to popular belief, data races are definitely a reality in Python. Don’t be fooled, the Global Interpreter Lock won’t prevent them. Please remember to strip your symbols when you build software for production before it gets that bad… This indeed would be nice to see such a move. We’ll see if that’s doable or not in the near future I guess. This is so true… It’s just almost always better to use standard components in my experience. In particular it makes things easier for keyboard navigation and accessibility."
