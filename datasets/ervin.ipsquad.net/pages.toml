["https://ervin.ipsquad.net/blog/2023/10/27/web-review-week-2023-43"]
title = "Web Review, Week 2023-43 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, ai, geography, rust, geospatial, criticism, web, programming, apple, internet, map, networking, surveillance, machine-learning, desktop, consistency, craftsmanship, agile, tech, politics, date, cryptography, blog, mobile, complexity, foss, ux, storage, frontend, gpt, simulation, cyberpunk, social-media, design, gaming, refactoring, management, self-hosting, copyright, cost, information, webcomponents, knowledge, scam, privacy, engineering, learning, cloud, optimization, science, 3d, http, mathematics, shader, usability, asynchronous, infrastructure, compression, performance, history, distributed, twitter, time, fediverse, tools, estimates, caching, project-management Let’s go for my web review for the week 2023-43. A bit on the finishing line compared to the usual, I didn’t manage to post it earlier today… Well, technically it’s still Friday. 😉 This is a very worrying development in Europe. This feels a lot like a dream come true for police states… Let’s not go there. A longer account of a seminar showing the amount of people and arguments against chat control. The EU commission is pretty isolated in this madness. An important read in my opinion. This whole manifesto from Andreesen is just ludicrous and this explains very well why. In any case we need more techno-pragmatists and less techno-optimists. A very needed tool unfortunately. This is fascinating research as well. The world is really so cyberpunk now. I never liked the “it’s neutral, it’s just a tool”. A very naive view in my opinion. New illustration of this with Twitter. Tools are inserted in a socio-technical system, and the sociology side will influence the design enough to make the tool not so neutral. Here clearly all hell broke loose and it became a massive danger to democracy due to the level of misinformation and the type of messages which are advantaged by the changes. More organizations leaving Twitter (now X… rofl). It’s a good thing and a logical step if you take values and code of conduct into account. It clearly became a cesspool from what I see."
