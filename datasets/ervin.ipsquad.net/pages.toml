full_description = "Tags: web-review, empathy, mathematics, supply-chain, blog, machine-learning, gpu, computation, craftsmanship, tools, type-systems, culture, 3d, gpt, bbc, amd, windows, multithreading, social-media, dependencies, security, floats, management, ai, metrics, webgpu, nvidia, c++, command-line, estimates, ecology, programming, politics, rss, fediverse, communication, organization, tech, rust, architecture, community, data, gui, foss, energy, team, python Good reminder that contributions are not only about code. Documentation, support, release management and so on are very important as well and too often underrated. Looks like the BBC likes the fediverse experiment so far. Engagement is even better than on Twitter at times. Let’s hope they keep expanding. https://www.eureporter.co/world/human-rights-category/european-court-of-human-rights-echr/2024/02/14/european-court-of-human-rights-bans-weakening-of-secure-end-to-endencryption-the-end-of-eus-chat-control-csar-mass-surveillance-plans/ Interesting paper evaluating a Life Cycle Assessment (LCA) method to estimate the power consumption and environmental impact of generative AI services. This is illustrated on a single service, hopefully we’ll see more such assessments. It’s hard to argue that the Rust type system isn’t superior to the C++ type system… it’s definitely nice how it actively prevents data races at compile time. https://opensource.googleblog.com/2024/02/magika-ai-powered-fast-and-efficient-file-type-identification.html Definitely this, the software bloat directly impacts the attack surface of what gets shipped. Even though this is far from a panacea in terms of security, it’s time for people to critically examine their dependencies also for other reasons. This is a bit cartoonish I’d say but there’s some truth to it. I indeed regularly get onto consulting gigs where you find out that the people already had the solution to their problem. In those cases it’s very often because communication channels are broken somewhere (team don’t feel at liberty to share what they noticed, managers having a hard time to listen, etc.)."
