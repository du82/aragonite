["https://ervin.ipsquad.net/blog/2024/03/22/web-review-week-2024-12"]
title = "Web Review, Week 2024-12 - ervin"
description = "Website Description"
full_description = "Tags: web-review, mobile, tdd, apple, obsolescence, security, copilot, tech, frontend, c++, gdpr, productivity, vr, law, economics, ai, tests, python, evolution, surveillance, programming, complexity, quality, machine-learning, web, history, performance, gpt Very thorough analysis of the Vision Pro value proposition. It shows quite well where it shines and where it should be improved. Definitely this. It might ultimately impact the abstraction levels accessible to us for coding… but the skills will still be needed. Natural language is too ambiguous for the task. When guidelines contradict each other. You need a proper way to communicate where a piece of code stands. As usual measure and don’t just assume when you want to optimize something. This is an interesting case in Python using Numba. Indeed this. It’s not only about payload size, it’s also about CPU consumption. Our profession is still assuming too much that users will get faster CPU on a regular basis. Interesting paper showing the main reasons why people ultimately change their phones. I find interesting that the opacity of storage management on mobile devices is such a factor. Indeed, don’t mindlessly add tests. I find interesting that the doubts raised in this piece are once again concluded using an old quote of Kent Beck. What he was proposing was fine and then over time people became clearly unreasonable. Very interesting piece. The DORA metrics are a good thing but I always felt they’re kind of dry and missing something. On the other hand surveys which are more qualitative give also interesting results but come with their own biases. The idea pushed here for better qualitative surveys and to combine them with quantitative metrics like the DORA one is definitely a tempting way forward."
