["https://ervin.ipsquad.net/blog/2021/06/04/web-review-week-2021-22"]
title = "Web Review, Week 2021-22 - ervin"
description = "Website Description"
full_description = "Tags: web-review, shortage, docker, frontend, neural-networks, amazon, blender, management, problem-solving, economics, programming, caching, logging, web, ai, cpu, project-management, estimates, css, 3d, http, attention-economy, remote-working, tests, linkedin, hr, gaming, craftsmanship, social-media, tech Per usual the sponsor placement is a bit annoying. Still the content is very interesting if you were still wondering why we have a chip shortage. Complex supply chains for the win. I’m on that social media for work reason, still oh boy… how much I hate it. This article pretty much summarizes why. Where we’re reminded that the stacking contexts with CSS is not tied to the DOM tree… Yay for making complicated rules which means you’ll create such stacking contexts unexpectedly. This article comes with a couple of nice tricks to make things easier though like the isolation property. The CSS Stacking Context Inspector browser extension is good too. Lots of good ideas on how to use docker-compose in development vs in production. Very web app oriented as the title imply but contains a few nuggets which make sense for desktop or embedded use as well. Very sensible and simple advises on how to do logging in your application. Just lacks a bit a discussion on how to use the different log levels. I’ve been banging the testing drum for so long I’d have a hard time to not violently agree with that article. I have a couple of beefs with it though, like the sacrificing encapsulation point but other than that… More on the test pyramid debate… As usual looking at the history of a concept and carefully evaluating how things are named is very enlightening. This is a must read. After the denoiser of raytracing images from Nvidia, here is a neural network approach from Intel to make game output photorealistic. Using the G-buffers as input is particularly clever. Not that I’m able to do anything really meaningful and beautiful with it and still… I’m super excited by all the progress they’re making. It’s really great tool and great tech."
