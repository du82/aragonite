["https://ervin.ipsquad.net/blog/2025/01/03/web-review-week-2025-01"]
title = "Web Review, Week 2025-01 - ervin"
description = "Website Description"
full_description = "Tags: web-review, git, gpt, version-control, ecology, web, engineering, wikipedia, design, browser, software, documentation, reliability, economics, tech, ai, machine-learning, tutorial, complexity, tools, secrets, business, standard, knowledge, legacy, parsing, politics, performance, organization, foss, simplicity, emergence, writing, criticism, databases, copilot Unsurprisingly this week we got a couple of nice “2024 retrospective” articles in this edition, I expect more to show up in the coming weeks. Anyway, let’s go for my web review for the week 2025-01. Or why making a dent in the enterprise software space is hard for FOSS… The good news is, it’d require setting up whole ecosystems of services. The Web standards are indeed too complex. That severely limits the possibility of browser engine incumbents. I agree there’s a deeper lesson here about the scale of technologies. The results are unsurprising. They definitely confirm what we expected. The models are good at predicting the past, they’re not so great at solving problems. Good perspective on how the generative AI space evolved in 2024. There are good news and more concerning ones in there. We’ll see what 2025 brings. Need to write a tutorial? Here is a good set of rules to follow. Don’t be fooled, it sounds simple but it is hard work. Good advice to work with large legacy code bases. You better know it very well before you make large changes to it. Or why you shouldn’t insert an abstraction just for the sake of it. Also clearly not all abstractions are created equal. Very nice piece. This is indeed mostly about building organizational knowledge. If someone leaves a project that person better not be alone to ensure some continuity… lost knowledge is very hard to piece back together."
