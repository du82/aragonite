["https://ervin.ipsquad.net/blog/2013/05/10/kde-manifesto-on-the-doorstep"]
title = "KDE Manifesto: On The Doorstep - ervin"
description = "Website Description"
full_description = "As mentionned in my previous post, I have been on a very needed hiatus from public communication. It also means that I delayed indefinitely my series about the KDE Manifesto. If you don’t remember the first part, I advise you to read it again first. Now… Let’s resume the story telling. We’ve previously seen why we needed a tool to answer this question of “What is a KDE project?“, in this part we’ll see how we tackled the task which led to the KDE Manifesto. Because of all the events and the questions without answers related in the previous part, some people finally noticed some actions were needed and that we couldn’t ignore the symptoms any longer. At one point the discussion started in the KDE e.V. about trying to provide a definition of what is a “KDE project”. Then in the KDE e.V. was created a small team which had the mandate to create that definition. I had the honor to be part of that team, and the other members were Cornelius Schumacher, Eike Hein, Ivan Čukić, and Sebastian Sauer. We should really be grateful to the work they put in that task (I know I am). We started with the right first step in my opinion: collecting feedback from the community and from different projects to see how they perceive themselves and the community. But doing it this way had a downside, we ended up with way too much data, and got completely overwhelmed. That was clearly not easy, and everyone being busy as usual at some point the data got ignored, collecting dust in a dark corner of our hard drives. The team became completely dormant and no communication was going on anymore. Until… one night… I don’t really know why, I picked up everything and tried to map it on paper. I extracted criterias and definitions out of the pieces of text we received. After all, I used to do Knowledge Engineering, that couldn’t be an impossible task! That’s when I noticed why we felt overwhelmed and silently gave up on the task at hand. If you took all the criterias and considered them equals (which was our mindset all along), you could end up only with a tautological situation: “A KDE project is a project considering itself part of KDE or started by a known KDE contributor”. Not a terribly useful outcome, but at least I then knew how to move forward."
