["https://ervin.ipsquad.net/blog/2023/03/17/web-review-week-2023-11"]
title = "Web Review, Week 2023-11 - ervin"
description = "Website Description"
full_description = "Tags: web-review, frontend, refactoring, culture, project-management, complexity, microsoft, gpt, tools, remote-working, neuroscience, organization, debugging, ethics, hiring, email, self-hosting, react, japan, decentralized, backend, 3d, vim, mobile, ci, hr, htmx, management, foss, science, git, movie, system, ai, django, team, ide, tech, career, architecture This is very very centralized. No good surprise here unfortunately… and still email is really tough to fully self-host. Well, people asking relevant questions slow you down obviously… since the goal about the latest set of generative models is to “move them into customers hands at a very high speed” this creates tension. Instead of slowing down they seem hell bent at throwing ethics out of the window. The lack of transparency is staggering… this is purely about hype and at that point they’re not making any effort to push science forward anymore. I find debuggers to be underused at quite a few places. A shame when you see what they can do nowadays, and they keep improving! An often forgotten feature of git. That said it is very convenient when we need to juggle several branches at the same time. This can save some time and space. Early days but could turn out useful when it gets more complete. Good way to easily have a CI pipeline targeting mobile platforms. Excellent post about getting too invested in a single tool. We can loose flexibility in the process. Also in the case of React, I didn’t realize until now that half of the web developers have never known a time when React didn’t exist! Nice exploration of Django + HTMX + web components for a CRUD use case. Interesting insights and highlights some of the limitations with HTMX. Definitely this. If it’s too fancy and fashionable you’re likely to pay it in later with the undue complexity it introduced. Indeed, it’s important for architects to get their “hands dirty”. Organizations where it’s not the case prevent their architects to challenge their assumptions pushing them to stay in their ivory tower. It’s a good way for bad decisions to pile up over time."
