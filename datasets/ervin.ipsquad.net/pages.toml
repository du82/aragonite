full_description = "Tags: web-review, unix, architecture, 2d, programming, gpt, security, complexity, frontend, web, tech, physics, governance, communication, collision, optimization, microservices, linux, elf, teaching, copilot, simulation, profiling, social-media, processes, dns, python, foss, democracy, css, system, graphql, privacy, debugging, cognition, performance, neuroscience, history Very nice piece. Hopefully it’ll push people to remember that the big social media enclosures are not really the Web. We can have more democracy on the Web again if we collectively want to. Definitely this. In a world where LLM would actually be accurate and would never spit outright crappy code, programmers would still be needed. It’d mean spending less time writing but more time investigating and debugging the produced code. Interesting results. It’s especially nice to see how sched-ext allows to easily iterate and experiment with process scheduling strategies. Definitely to keep in mind when using sampling profilers indeed. They’re useful, they help to get a starting point in the analysis but they’re far from enough to find the root cause of a performance issue. Shows well why you likely don’t want to use GraphQL. The chances you need the extra complexity and caveats are very slim. Since this particular fad apparently doesn’t want to die… this is a good reminder about why you want to do something simpler. Not necessarily my favorite governance model, but if you’re on that scheme… those are good guiding principles. Interesting research! Is reading code a math and logic task? Is it a language task? Well… it might be its own thing."
