["https://ervin.ipsquad.net/blog/2024/06/14/web-review-week-2024-24"]
title = "Web Review, Week 2024-24 - ervin"
description = "Website Description"
full_description = "Tags: web-review, ethics, history, performance, unix, machine-learning, backend, design, http, quic, privacy, firewall, databases, cpu, vscode, compiler, system, fuzzing, gpt, algorithm, sqlite, ai, tests, matrix, geometry, architecture, kernel, gui, c++, criticism, software, communication, SIMD, microsoft, tech, processes, documentation, ide, mathematics, security, django, linux Unsurprisingly they had to adjust under the pressure. The most blatant issues might be gone, it is still a bad idea at its core. Chatbots can be useful in some cases… but definitely not when people expect to connect with other humans. https://theconversation.com/ai-chatbots-are-intruding-into-online-communities-where-people-are-trying-to-connect-with-other-humans-229473 How trustworthy are the extensions you get in your editor or IDE? I’d expect most marketplaces to not be well harmed against such attacks. https://www.bleepingcomputer.com/news/security/malicious-vscode-extensions-with-millions-of-installs-discovered/ Interesting status report about HTTP/3 support in curl. Shows quite well the various alternatives and how special HTTP/3 can be. Interesting deep dive in where the PIDs seen in user space come from. And also yes, there is something matching PID 0 which can be traced back to early UNIX systems. https://lemire.me/blog/2024/06/13/rolling-your-own-fast-matrix-multiplication-loop-order-and-vectorization/ Good advice on designing your database tables. The comments are good too, they allow to complete the picture. Little and to the point reference on safer SQLite use. I should check if some of this would apply or is used by Akonadi as well. Nice reminder that even though we try to make things simpler to understand to people, there is a point where we can go too far. Indeed this is not for any environment and projects. So take it with a grain of salt. That said, I think this piece has a core truth to it which is more general. Software architectures shouldn’t be considered as something fixed as soon as they are planned, they need to be validated through use and to be prepared to evolve over time as needed."
