["https://ervin.ipsquad.net/blog/2024/09/27/web-review-week-2024-39"]
title = "Web Review, Week 2024-39 - ervin"
description = "Website Description"
full_description = "Tags: web-review, history, gpt, research, c++, quality, surveillance, project-management, ux, criticism, python, automotive, architecture, tools, privacy, version-control, science, tech, conway, rust, data, git, mozilla, system, microservices, law, security, safety, culture, reliability, matrix, ai, design, gdpr, refactoring, kernel, organization, cpu, software, ecology, linux, machine-learning, portability, metrics Definitely a big announcement for Matrix. Could it be the beginning of going mainstream? I suspect it’ll be now or never. I’m slightly concerned about the desktop support being apparently ignored, the UX there is far from great still. It was to be expected that complaints against Mozilla could happen in Europe. They’ve been asking for it lately… Excellent piece, we’re a civilisation whose culture is built on shifting sands and… toy plastics. Guess what will survive us? This is clearly less high profile than the Scarlett Johanssen vs OpenAI one. Still this shows it has the potential to become a widespread (even though shady) practice. This might need some regulation fairly soon. This is indeed important to be able to run such models locally. Will still require more optimization but it’s slowly getting there. The reproducibility it brings is especially necessary for science. People are putting LLM related feature out there too hastily for my taste. At least they should keep in mind the security and safety implications. Lots of good stuff definitely coming. This should definitely help make it more approachable to lots of people. Excellent proof of why you don’t want to “rewrite it all in Rust”. It’s important to respect the old code and focus on applying safety practices on the new code. This is also why the upcoming changes to C++ are worth it, it might improve the interoperability factor almost for free. Nice list of common portability issues one can encounter at the machine architecture level. But don’t be fooled, this doesn’t have implications only for C and C++, those problems leak in higher level languages as well."
