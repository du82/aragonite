title = "D+3: I'm back home! - ervin"
description = "Website Description"
full_description = "I obviously survived the trip… It’s nice to be home again. I’ll surely miss a bit the MIT Stata Center it’s really a unique building (as you might notice from the linked pictures). For the last day in Boston, I managed to walk a bit around before going to the airport, it was pleasant. Moreover I managed to buy postcard… but not stamps. The only place I’ve found stamps I needed to use a machine and I didn’t figure out how to use it. So I’ll deliver my postcards by hand it seems. :-) In the airport I noticed that the booked Paris/Toulouse flight was planned for Paris Orly, while I was supposed to arrive in Paris CDG… hmm changing airport, lot of trouble ahead. Luckily the Air France crew in the Boston airport was kind enough to modify my ticket in order to get my connection in CDG, which doesn’t mean “no trouble” either since CDG is really messy. Here what happened. My plane landed in the terminal 2F but we didn’t have the right to go in 2F ourselves, so we had to take a bus to go in 2C (still following?). But (and that’s where it starts to be ridiculous), when I arrived in 2C I had to take yet another bus since I was supposed to check-in my Paris/Toulouse flight in 2F… that’s sick. In particular when you have only 30 minutes between the two flights. But, I don’t care anymore I’m finally home! Now it’s time to relax a bit, before going back to work tomorrow. I’m also happy to see that some of my feelings about the discussions I had during the Gnome Summit are shared. It was definitely worth it, thanks again to all the people involved!"
