["https://ervin.ipsquad.net/blog/2023/02/17/web-review-week-2023-07"]
title = "Web Review, Week 2023-07 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, knowledge, command-line, politics, ecology, agile, apple, asynchronous, performance, linux, complexity, desktop, ethics, law, copyright, tech, react, retrospective, api, project-management, programming, cpu, safety, python, quality, intel, kde, physics, frontend, ai, config, amd, gpt, tools, metrics, multithreading, rust, c++, web, architecture, encodings Interesting, this is likely a good thing for everyone to have AMD very much alive and the dominance of Intel fading away a bit. I wonder how the ARM based processors will position themselves in the server space in the future, this is still not much there (contrary to mobile). https://wccftech.com/amd-grabs-over-30-percent-market-share-with-epyc-cpus-intel-continues-to-decline/ This is really a stupid rule they got there. I really don’t get why makers would turn to this ecosystem it makes everything difficult. There’s really something rotten in this AI “arms race”… they’re clearly making mistakes to go fast for PR purposes and using tools the wrong way. This can only lead to large scale disinformation if they don’t correct course quickly. This has more political impacts than it looks at first sight. For all the conversations about how chat GPT might displace jobs, there’s a big untold: how much of copyright is violated in the process? It’s also very concerning about how much data it collects when interacted with. https://theconversation.com/chatgpt-is-a-data-privacy-nightmare-if-youve-ever-posted-online-you-ought-to-be-concerned-199283 Are we surprised? Not really no… you don’t own any of the data you’re feeding it. Keep it away from your secrets. So transformer models produce things that look plausible… and that’s it. What would it look like if we started to make hybrid models in which a transformer model is also tied to proper computation tools with general knowledge? This piece is a good illustration of what it could provide. https://writings.stephenwolfram.com/2023/01/wolframalpha-as-the-way-to-bring-computational-knowledge-superpowers-to-chatgpt/"
