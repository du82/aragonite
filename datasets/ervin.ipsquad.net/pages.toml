["https://ervin.ipsquad.net/blog/2023/03/24/web-review-week-2023-12"]
title = "Web Review, Week 2023-12 - ervin"
description = "Website Description"
full_description = "Tags: web-review, tools, cryptography, object-oriented, 3d, machine-learning, microsoft, fonts, surveillance, architecture, codec, fake, productivity, encodings, project-management, ai, web, animation, frontend, photography, graphics, complexity, google, management, nft, language, engineering, docker, agile, facebook, technical-debt, hash, culture, bug, tech, business, criticism, programming, command-line, estimates, climate, neural-networks, vector, emergence, art, gpt, hr, funny, browser, computation This browser is really an horrible data harvesting platform for Microsoft’s benefit. They never learn… The climate constraints are currently not compatible with the ongoing arm race on large neural networks models. The training seems kinda OK, but the inferences… and it’s currently just rolled out as shiny gadgets. This really need to be rethought. Now, this is interesting research. With all that complexity, emergence is bound to happen. There’s a chance to explain how and why. The links with the training data quality and the prompts themselves are interesting. It also explains a lot of the uncertainty. Now this is a properly balanced piece which looks beyond the hype. Usable yes, if hallucinations don’t have a high impact. Can the hallucinations be solved? To be seen, I personally have my doubts with the current architecture… at least banking it all on human feedback is being very naive about the scale of the task. Training sets are obviously already contaminated… now it’ll be a race of hiding such mistake under the carpet with human interventions. That’ll be a boon for misinformation. That’s what we get for a useless large models arm race. Now, this starts to become interesting. This is a first example of trying to plug symbolic and sub-symbolic approaches together in the wild. This highlights some limitations of this particular (quite a bit rough) approach, we’ll see how far that can go before another finer approach is needed. Now this is a truly impressive technology! This will make facial motion capture a really smoother process."
