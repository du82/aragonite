full_description = "Tags: web-review, frontend, presentation, amd, ci, design, social-media, twitter, surveillance, security, architecture, trust, data-oriented, memory, databases, video, fediverse, type-systems, law, editor, system, multithreading, framework, messaging, c++, search, 3d, copyright, complexity, web, vim, python, community, go, linux, gaming, cost, ai, self-hosting, knowledge, product-management, writing, performance, politics, kernel, protocols, blog, postgresql, autonomy, hardware, cpu, business, foss, vector, life, programming, api, vision, remote-working, ux, tests, hiring, gpt, graphics, distributed, expertise, queuing, optimization, google, information, habits, organization, learning, codereview, tech, project-management, legal, http, management, webgpu, unicode, language, encodings, microsoft, emotions, gdpr, browser, maintenance, note-taking Let’s go for my web review for the week 2023-30… You remember I “took a break”? Well, I did kind of. I confess I checked things from time to time. And that’s how we end up with a month worth of content. Let’s have the July Mega-Compilation this week! I also inserted a couple of very old articles I had on the side (I’ll try to do this a bit more often). Since it’s really big, I added sections this time to group things a bit better. Hopefully this will make things easier to navigate. Let’s hope this doesn’t get any sort of adoption… that said seeing the amount of people using mostly Chrome and Google services, they can pretty much do as they wish. More details and analysis about the events unfolding around the Google “Web Environment Integrity” proposal. This still doesn’t bode well. Whatever they claim it seems clear it’s about getting rid of ad-blockers. I was indeed thinking this looks awfully similar to some things we’ve seen in the past… It needs to be fought as well. This is a welcome consequence of the CJUE ruling. Be warned, think twice before reaching for Google Analytics. https://www.theverge.com/2