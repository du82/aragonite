["https://ervin.ipsquad.net/blog/2023/02/24/web-review-week-2023-08"]
title = "Web Review, Week 2023-08 - ervin"
description = "Website Description"
full_description = "Tags: web-review, type-systems, tools, tech, fediverse, architecture, object-oriented, gui, culture, static-analyzer, greenwashing, ai, performance, science, security, ecology, funny, twitter, gaming, yagni, agile, google, webgpu, programming, energy, surprising, github, react, debugging, management, django, art, kotlin, c++, profiling, self-hosting, attention-economy, generator, social-media, microservices, product-management, portability, ux, project-management, frontend, xp, safety, databases, neural-networks, web, search, hr, python, gpt, machine-learning, postgresql, ethics, small, memory, map, webassembly, velocity, cpu, 3d, geospatial, refactoring, foss, rust, java, distributed, criticism, c, ssh I don’t know if it’s early spring and articles I found interesting are sprouting anywhere… In any case this week issue is massive. Brace yourselves and let’s go for my web review for the week 2023-08. This is indeed a massive greenwashing operation right there. And then they will claim things like “AI for good” or such… Interesting position from AMD regarding the race on the next super computers. They’re all being caught up by energy efficiency so it’ll need to be addressed both at the processor architecture level but also at the software architecture level. How we design our computing tasks will matter more and more. Definitely agree with this, Github benefited from a powerful network effect and now a good chunk of important projects are “trapped” there. This can’t be good long term. Lengthy but thorough. The evidences are now getting much clearer. Admittedly, the most worrying bit I find is that getting off the social media wagon might not help the impacted people to get better… indeed they might still be isolated if everyone else is still trapped on social media. If you didn’t have an adblocker yet (who doesn’t really?) it’s time to really think about it. When even the FBI starts to advocate for ad blockers it’s a sign of how bad the online ad market has become."
