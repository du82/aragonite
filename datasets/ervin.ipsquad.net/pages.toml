["https://ervin.ipsquad.net/blog/2024/10/18/web-review-week-2024-42"]
title = "Web Review, Week 2024-42 - ervin"
description = "Website Description"
full_description = "Tags: web-review, rust, social-media, embedded, design, neural-networks, browser, developer-experience, supply-chain, crdt, collaborative, machine-learning, raspberry-pi, complexity, gaming, rss, web, capitalism, python, vendor-lockin, google, architecture, politics, debugging, programming, gpu, tests, cloudflare, criticism, ecology, marketing, wordpress, train, gpt, security, prolog, 2d, blog, privacy, research, knowledge, tech, hardware, logic, ai, archive, cognition, philosophy, optimization, graphics, mathematics, reliability People have to realize that tycoons like the ones from big tech companies can both be rich and mediocre. They were smart enough to seize opportunities at the right time but they are not exceptional. In fact, they’re even boring and spineless. The best quote in this paper I think is: “There is nothing special about Elon Musk, Sam Altman, or Mark Zuckerberg. Accepting that requires you to also accept that the world itself is not one that rewards the remarkable, or the brilliant, or the truly incredible, but those who are able to take advantage of opportunities, which in turn leads to the horrible truth that those who often have the most opportunities are some of the most boring and privileged people alive.” The real problem is that lots of journalists can’t come to term with the fairy tale and so fall prey to all their publicity stunts as if it had any hidden meaning. This is dangerous because of all the political power they try to seize for their own gains. Meanwhile, “the most powerful companies enjoy a level of impunity, with their founders asked only the most superficial, softball of questions — and deflecting anything tougher by throwing out dead cats when the situation demands.” It’s actually unsurprising, all those tech and crypto bros have assets in jeopardy if some regulation is applied to their industry. No wonder they’d support the one with the most libertarian agenda after the current administration which did look into antitrust cases and increased regulation (even though marginally)."
