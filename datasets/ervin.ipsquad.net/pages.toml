full_description = "Tags: web-review, obsolescence, python, statistics, tech, psychology, life, science, management, profiling, performance, memory, interviews, TV, low-tech, remote-working Let’s go for my web review for the week 2022-16. I need some rest, so no web review next week. If I’m motivated we might have a double issue the week after. We’ll see. I feel less alone. I guess my next TV (hoping the current one will last though) will be a video projector. That looks like a very interesting tool for larger Python based projects. Definitely need a way to profile memory use in there. I like this approach to technical interview questions. I do something similar in some cases with a mix of reading and writing. Interesting to see how a more widespread remote work impact people. Unexpected patterns appear, it’s clearly not all for the better though. Very interesting debunk of the Dunning-Kruger effect. This is welcome since I see it pervasively cited. Also comes with a few interesting facts introduced by the papers which critiqued it first."
