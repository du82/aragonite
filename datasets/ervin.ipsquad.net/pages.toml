description = "Website Description"
full_description = "Tags: web-review, design, history, internet, architecture, politics, performance, foss, system, influence, social-media, protocols, flatpak, learning, desktop, software, gpt, linux, art, storage, ux, copyright, supply-chain, funny, japan, data, fediverse, tech, surveillance, smartphone, machine-learning, vector, ai, ethics, security, engineering, expertise, paper, attention-economy, privacy, origami, ietf This is looking like a bad move. Clearly the fault of western countries though which let things unfold ambiguously regarding copyright… Now Japan is weakening copyright for everyone. This is early research of course but still the results are interesting. Once again, we’re much easier to influence than we’d like. Tags: tech, internet, ietf, protocols, privacy, surveillance, attention-economy, security, history, politics This is an excellent and needed work of contextualization. Ten years after, looking back at how the Snowden Revelations impacted the internet and the work done by the IETF. It also shows there is plenty more to do… Clearly the UI design matters quite a bit in term of how addictive all those social network systems are. The alternative proposed here is interesting, I wish it’d be more widely implemented. Nice and thorough workshop on vectorization, where it comes from, what it can do and how you can write code which is easier to vectorize for the compiler. Interesting way to list all the data stores of your system and map them. Has the advantage of being very lean and simple to apply. Interesting idea, for sure on a complex enough system just managing the dependencies can quickly become a full time job."
