title = "Web Review, Week 2022-44 - ervin"
description = "Website Description"
full_description = "Tags: web-review, twitter, programming, communication, writing, agile, kde, criticism, type-systems, performance, tech, python, optimization, safe, supply-chain, safety, attention-economy, security Spot on analysis. What could Musk do with Twitter? Why? Several theories but clearly this will impact and distort even more the information landscape. Finally out of Google Docs it seems. Better version for sharing around. Still an interesting list of case studies and opinions around SAFe. I learned a few things, I didn’t realize it’s creation was so disconnected from the pre-existing agile community. It all seems to confirm my opinion that it’s better to stay away from it though. The few organizations I know of which use it are clearly very much in a command and control mode. This is going backwards. https://blog.phylum.io/phylum-discovers-dozens-more-pypi-packages-attempting-to-deliver-w4sp-stealer-in-ongoing-supply-chain-attack Definitely this! It’s important to model properly your domain and leverage smart value types everywhere it makes sense. This can prevent quite a few different types of bugs. Good reminder that “premature” doesn’t mean “early”. Poor Knuth is so often badly quoted in the context of optimization that it’s really sad. The number of times I see “early pessimisation” on the pretense of avoiding “premature optimization”. Such a waste… What the title said, there’s nothing fancy about optimizations. It’s mostly well known knowledge, doesn’t change much over time or on different stacks… still it’s very satisfying. If you like remote work, then you need to make sure your written communication is good. There’s a handful of proper guidelines in this paper. Good reminders."
