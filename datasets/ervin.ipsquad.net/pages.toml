["https://ervin.ipsquad.net/blog/2006/02/19/kde-promoting-week"]
title = "KDE promoting week - ervin"
description = "Website Description"
full_description = "Past week I’ve done some KDE promotion. It was interesting because I did this using two radically different methods. On monday and tuesday, I gave two talks in my university about Qt and KDE as a development platform. I gave Kubuntu CDs to the students and since they are in computer engineering they’ll hopefully install it. It seems that they enjoyed the topic. They started to wonder why they had to suffer with other non-free toolkits when I showcased Qt and QtDesigner. Then they were impressed about the niceties provided by kdecore, kdeui, and DCOP. After that, I explained them how to use the KParts and their jaw dropped when I showcased the small browser George Staikos wrote for OSDW. And finally having network transparency in their applications using KIO finished to convince them. I also took some time to present what will hopefully be in KDE4 The result? Several amazed students, that will surely want to experiment with Qt and KDE in the future. It even looks like some of them are really hooked and I had the opportunity to discuss more with them on friday answering some late questions. On saturday, I participated in an event organized by Toulibre. I showcased a laptop running Kubuntu, there was also some boxes running Ubuntu. A talk took place, but I didn’t attend since I was involved in the booth with the rest of the team. People were really interested in the topic and we even had a journalist from the local press that came and asked questions for a paper. I think we were all impressed by the age diversity of the attendees (the youngest was under 10 and the oldest surely over 70). I find nice to be able to propose KDE to people that could be your grandparents for their daily use. Really a nice week, I’d love to have more occasions to do this kind of things… I’ll surely try to invest more of my spare time for promotion."
