["https://ervin.ipsquad.net/blog/2024/02/02/web-review-week-2024-05"]
title = "Web Review, Week 2024-05 - ervin"
description = "Website Description"
full_description = "Tags: web-review, apple, hardware, multithreading, tests, standard, rust, management, linux, python, quality, 2d, engineering, software, VR, embedded, ux, c++, gpt, programming, kernel, refactoring, craftsmanship, copilot, ai, vector, foss, game, gui, processes, system, machine-learning, tech, vendor-lockin, browser, atomics, version-control, codereview, web A little victory for European users trapped in the iOS ecosystem… still more needs to be done though. It’s good to see this initiative keeps thriving. It’s the best way to ensure the standard is well implemented everywhere. https://www.ign.com/articles/disney-unveils-the-holotile-floor-inching-us-closer-to-a-real-life-holodeck Very nice progress on this type of architecture. It’s definitely needed in part because it lowers the inference cost quite a lot. It’s also nice to see it released with under the Apache 2 license and the training set be documented. I like this kind of rabbit holes. This gives a few interesting information on how forking processes behaves on Linux. Interesting little web framework to run on MicroPython. Clearly could make some IoT project more accessible. This introduced lack on consistency and predictability in how you can interact with a GUI component is a problem, this will also reduce accessibility. There was value in this “tradition” of the square checkbox vs round radio button. Indeed the example is a bit extreme. Still it illustrate quite well what should be found in a commit message. It needs to tell a story and motivate the reasons behind a change. Excellent post about code reviews. I particularly like the introduction about the motivations, it’s often forgotten. Interesting idea, why not use similar workflows than to develop software? For sure this would bring more transparency and automation, should help focusing on higher value tasks."
