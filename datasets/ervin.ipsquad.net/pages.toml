["https://ervin.ipsquad.net/blog/2021/05/21/web-review-week-2021-20"]
title = "Web Review, Week 2021-20 - ervin"
description = "Website Description"
full_description = "Tags: web-review, web, tech, innovation, ai, machine-learning, irc, project-management, fonts, democracy, javascript, linux, elf, security, frontend, funny, 3d, privacy, portability, estimates, freenode, rust There is so much more to criticize about tech giants than just privacy and fake news issues. It’s important to not mistake the tree for the forest. They’re also killing quite a lot of democratic and institurional innovations. OK, now that’s a funny consequence of how authorities behave which are taken into account by criminals. Very nice tutorial, explores a good set of common biases. Also show that it’s not that simple to get rid of them. https://towardsdatascience.com/tutorial-breaking-myths-about-ai-fairness-the-case-of-biased-automated-recruitment-9ee9b2ecc3a This is Rust focused but still, shows a good way to increase binary portability across distributions. I suspect a couple of things would be easier with elf-dissector even. The Freenode network is very much in trouble… This is so sad, my account there dated back from the early days of my KDE involvement. Needless to say it felt a bit weird to let it go. Not that I needed to be convinced, but it’s now becoming clear 3D engines are getting out of games to become more pervasive. I got a slightly different view on the topic. To me there’s value in the process of estimating, the estimation itself less so. The process often helps you refine both your understanding of the technical domain but also of the business domain."
