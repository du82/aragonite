["https://ervin.ipsquad.net/blog/2021/02/19/web-review-week-2021-07"]
title = "Web Review, Week 2021-07 - ervin"
description = "Website Description"
full_description = "Tags: web-review, politics, surprising, linux, mooc, war, literacy, culture, security, history, mentoring, free-software, japan, science, repair, python, css, ring, cryptography, tcp, agriculture, c++, capitalism, vendor-lockin, bug, amazon, design, animation, framasoft, criticism, surveillance, feminism, economics, ethics, tech, authoritarianism, embedded, lies, supply-chain, epistemology We’re now well into February 2021 and I didn’t even do a proper recap of 2020. Needless to say I’ve been quite a bit neglecting this space… at the same time I’ve been reading quite a lot (as usual) and I have been posting said articles on the Fediverse (with a bot cross-posting to Twitter as well). Very often I posted just the title and they’d happen in batches which was probably annoying. That’s why for 2021 I think it’s time for a new experiment in this space. I’ll try to post a weekly web review here. Obviously topics of choice will be Free Software but I might cover other areas which might be a bit more surprising (management, business, sociology… you name it). Hopefully that will make it more interesting than if I stay too focused. Very interesting FOSDEM talk which I see as part of the debate about “Open Source as just licenses”/“Post Open Source”. This shows very well how the OSD is very narrow and that their should be a better alignment between what is labelled FOSS and the actual customs. This is something which licenses alone can’t capture. https://mail.python.org/archives/list/python-committers@python.org/message/SQC2FTLFV5A7DV7RCEAR2I2IKJKGK7W3/ Interesting use of reference_wrapper… I wonder why it didn’t occur to me earlier as a good use to deal with ownership like that. https://www.nextptr.com/tutorial/ta1450413058/unique_ptr-shared_ptr-weak_ptr-or-reference_wrapper-for-class-relationships This is a bit of a less rigorous counterpoint of the paper from Nathan Schneider “the tyranny of openness”. I think it’s interesting to see that despite a few strawmen it reaches a somewhat similar conclusion: it’s not just about licenses, it’s also about customs”."
