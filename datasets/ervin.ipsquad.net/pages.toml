full_description = "Tags: web-review, free-software, data-visualization, management, culture, javascript, hr, low-tech, ip, simplicity, facebook, ethics, gafam, surveillance, decentralized, programming, web, search, storage, tech, memory, networking, codereview, google, irc, performance, bing, obsolescence Ever had a Facebook account? Deactivated it since then? Well apparently the surveillance anti-feature is for life… Don’t be fooled, just delete it, which is apparently harder than it sounds. https://digiday.com/media/why-facebook-keeps-collecting-peoples-data-and-building-their-profiles-even-when-their-accounts-are-deactivated/ Interesting look at the results from two search engines and seeing where they’re good and where they fail. Still very early days, but if that gets industrialized and the prices are not too horrible, this could bridge the gap in access times between memory and storage. Don’t use it much anymore for various reasons, but I still find the simplicity of IRC still appealing and elegant. It is a really neat protocol. Looks like a very interesting approach. This is still clearly for techies though, but time will tell. https://changelog.complete.org/archives/10319-make-the-internet-yours-again-with-an-instant-mesh-network Interesting piece which points out (despite its title) that it’s not simply about funding, this is also about the relationship between projects and large companies which try to squeeze value out of them. Interesting exploration on why we see a large resignation movement (at least in the US, the study is US centric anyway). It’s clearly not only about wages and they are other even more powerful forces at play. First and foremost: mind your corporate culture."
