description = "Website Description"
full_description = "Tags: web-review, web, smartphone, security, refactoring, tech, complexity, social-media, microsoft, multithreading, burnout, performance, low-tech, book, management, history, dotnet, programming, software, optimization, culture, architecture, cloud, benchmarking, fediverse, java, vendor-lockin, ecology, team, framework, c++, etymology Let’s go for my web review for the week 2022-46. With all the turmoil in the social media space, this looks a bit like a special edition on this topic (more links to articles related to that than usual). https://arstechnica.com/tech-policy/2022/11/microsoft-irreparably-damaging-eus-cloud-ecosystem-industry-group-claims/ Shady practices clearly… don’t commit secrets in repositories. There are even tools to check this doesn’t happen. Interesting point of view, also lays out nicely how social networks degenerated into social media. I appreciate this kind of perspective. Good thinking about the recent Mastodon users increase. Highlights fairly well why it’s desirable, why it’s a better social media platform but also the challenges ahead… including resources consumption. Success is a two sided coin. Clearly this mass exodus of Twitter users will overwhelm existing Mastodon users and a few instance administrators. It’s understandable that is can be perceived as some kind of assault from people not used to the customs. How will the preexisting culture hold? The Pandora box is now opened we shall see. There are indeed a few architectural problems with the Fediverse as it is. Can this be solved? Hopefully yes. https://ar.al/2022/11/09/is-the-fediverse-about-to-get-fryed-or-why-every-toot-is-also-a-potential-denial-of-service-attack/ Don’t believe too good to be true marketing claims by vendors. Clearly something went wrong there and the benchmark has been gamed. Illustrated with Java, still this highlight fairly well the caveats of mutable collections in multithreaded code. Interesting take about how performance optimizations can sometimes leverage even more performance gains than you would expect."
