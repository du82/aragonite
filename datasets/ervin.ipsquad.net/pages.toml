["https://ervin.ipsquad.net/blog/2024/03/15/web-review-week-2024-11"]
title = "Web Review, Week 2024-11 - ervin"
description = "Website Description"
full_description = "Tags: web-review, optimization, pairing, animation, tools, unix, engineering, storage, agile, standard, art, project-management, performance, web, 3d, architecture, career, linux, c++, cloud, graphics, memory, portability, posix, foss, git, protocols, browser, shader, quic, craftsmanship, map, product-management, safety, fediverse, amazon, command-line, tech, networking, windows, history, frontend, benchmarking, culture, organization, estimates, geospatial, mob-programming, management, version-control https://www.openculture.com/2024/03/the-getty-makes-nearly-88000-art-images-free-to-use-however-you-like.html This is nice to see a new benchmark being published. This seems to follow real life scenarios. We can expect browser engines performance to increase. Neat early experiments on query OSM for nearest potential point of interests and of geolocation support in ActivityPub implementations. Interesting stuff coming in that space, but at a very slow pace. This is unfortunate since it makes adoption slower too. Very interesting trick! I didn’t know you could use NVME over TCP. This is indeed perfect for cloning a laptop. This sounds slow but this is the kind of things you can run over night. Good explanations on how HEAD works in git and what it means. It’s indeed one of those terms where the consistency isn’t great in git. Excellent piece from Herb Sutter once again. This is a very well balanced view about language safety and how far C++ could go in this direction. This is a nice call to action, would like to see quite some of that happen. An old article, but a fascinating read. This gives a good account on the evolution of POSIX and Win32. The differences in design and approaches are covered. Very much recommended. Interesting take and theory about pair and mob programming. Indeed finding the right path to optimize a piece of code is likely harder in such setups. Very interesting insights from someone who’s been practicing this trade for a long time. I agree with most of it, it’s inspiring."
