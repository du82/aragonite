["https://ervin.ipsquad.net/blog/2023/09/08/web-review-week-2023-36"]
title = "Web Review, Week 2023-36 - ervin"
description = "Website Description"
full_description = "Tags: web-review, gps, matrix, social-media, storage, newsgroups, ai, architecture, surveillance, caching, science, performance, mathematics, archive, simulation, linux, tech, repair, php, compiler, cpu, cto, metrics, climate, copyright, language, tdd, criticism, security, technical-debt, bug, c++, design, twitter, conversation, automotive, management, smartphone, business, gafam, graphics, productivity, tools, date, fediverse, machine-learning, wayland, map, vendor-lockin, history, messaging, tests, gpt https://repair.eu/news/new-eu-rules-smartphones-and-tablets-will-follow-new-ecodesign-requirements-by-june-2025/ First time I hear about this application. It seems really nice, I’m taking it for a spin. Not sure I’ll use it to replace OsmAnd just yet. That said it’s UX seems better than OsmAnd so far. I think I’d have gone further in the past for such a thought experiment… still if you wonder why people are fighting for digital freedom, here is why. This is really bad… it’s way worse than I suspected. The car makers really need to change their practices. Go and sign the petition. https://foundation.mozilla.org/en/privacynotincluded/articles/its-official-cars-are-the-worst-product-category-we-have-ever-reviewed-for-privacy/ Interesting look at the challenges ahead for the fediverse. Not easy since some of this is cultural clash, some of it is technical and solvable though. Clearly a list of concerns to keep an eye on for wider Matrix adoption. Clearly some basics are not covered still. Indeed, at this point it’s not that people don’t want to switch. Very often they just don’t have a choice. What’s worse than a compiler bug? A processor one… very interesting deep dive in this particularly nasty one. Interesting tale and exploration on how a change in includes impacted cache misses. This is sneaky (and solved with more recent compilers). A good proof that it’s still possible to innovate with interesting performance gains for rather mundane tasks. If you’re into calendars this is an interesting read."
