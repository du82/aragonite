title = "Web Review, Week 2023-26 - ervin"
description = "Website Description"
full_description = "Tags: web-review, ai, research, complexity, memory, fediverse, hype, machine-learning, copyright, engineering, design, google, craftsmanship, cryptography, community, copilot, burnout, law, xmpp, technical-debt, architecture, tech, distributed, gpt, surveillance, rust, static-analyzer, github, management, criticism, france, logic, standard, gafam, tests, productivity, safety, java, foss, art, facebook, programming, c++, compiler A reminder of what’s going on in France… and it’s bleak. Lots of things can turn you into a suspect at this point. You encrypt your communications or data? You try to avoid surveillance from the GAFAM? You use Tor or a VPN? If anything bad happens around you, then you’ll turn into a suspect, this is due to the “clandestine behavior” you entertain… so for sure you are part of some “conspiracy”. Facebook getting interested in the fediverse indeed looks like XMPP or OOXML all over again. Beware of those old tactics, they are very efficient against communities. Excellent piece from an excellent artist. I really thought this through and I think he’s going in the right direction. https://www.davidrevoy.com/article977/artificial-inteligence-why-i-ll-not-hashtag-my-art-humanart-humanmade-or-noai It smells a bit like hypocrisy isn’t it? On one hand they claim it can make developers more productive on the other they think they shouldn’t use it. Basically the wording allows them to feed whatever system they want with your code… even in private repositories. Very comprehensive (didn’t read it all yet) guide about self-supervised learning. It’ll likely become good reference material. Especially important in the context of tests indeed. As soon as you depend on some form of elapsed time you get into the territory of flaky tests. Nice set of advises when dealing with concurrency. Don’t fall into some of the anti-patterns which are pointed out. This is a neat example of what programming languages could check at compile time. This clearly brings way more safety when you get such contract validation at build time."
