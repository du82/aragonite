["https://ervin.ipsquad.net/blog/2024/08/30/web-review-week-2024-35"]
title = "Web Review, Week 2024-35 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, databases, values, debugging, design, maintenance, web, tests, supply-chain, reliability, sql, business, monitoring, telegram, law, tech, rss, metaprogramming, programming, fundraising, linux, performance, airline, foss, language, frontend, python, architecture, licensing, privacy Here a good reminder that the PR of Telegram is highly misleading. It’s not very secure, they don’t really care about your privacy. Yes, such an arrest is concerning. Now, lots of people are voicing the wrong concerns… this article actually does a good job explaining it. I’m not sure the “bubble” comparison properly applies. Still there are indeed signs of the Open Source movement getting in troubles. It’ll be all the more important to stick to the Free Software values. It’s about time… I wish they would have gone for the AGPL + proprietary double license scheme instead of their odd licenses the last time. Interesting to see Typescript and Rust picking up pace slowly. Otherwise Python, Java, Javascript and C++ are still the big four overall. For jobs, C# and SQL are good to have in your tool belt. Very good list of the challenges ahead for RSS as a popular protocol. It’d be great to see some of it being tackled. Interesting comparison between old attempts at backdooring OpenSSH and the latest xz attempt. There are lessons to be learned from this. It makes a good case for starting to sandbox everything. Woops, this was clearly a very bad security issue allowing to completely bypass airport security screening in the US. Looks like an interesting way to improve SQL. This feels like a nice extension, it’s much better than throwing out the baby with the bathwater. Definitely a good advice, I see very complex expressions in if (or while BTW) conditions way too often. They tend to accumulate over time. Interesting reason which would explain the Selenium flakiness. It’s just harder to write tests with race conditions using Playwright. How to avoid drowning in errors when getting serious about monitoring. Finding class of errors and treating them one by one will definitely help."
