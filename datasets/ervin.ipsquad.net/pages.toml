["https://ervin.ipsquad.net/blog/2024/07/12/web-review-week-2024-28"]
title = "Web Review, Week 2024-28 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, dependencies, law, uefi, cloud, politics, organization, agile, kernel, history, programming, complexity, quality, gpt, packaging, linux, system, fonts, python, uuid, storage, rust, machine-learning, ubuntu, boot, simd, browser, gui, cryptography, ai, computer-vision, databases, team, tools, privacy, engineering, performance, systemd, craftsmanship, tech, supply-chain Good tour of all the way dependencies might get compromised in your supply chain. Getting this easy to detect is needed. The title is a bit pushing it. Still, I didn’t realize some of the fine prints of the Ubuntu support schemes. It’s nice to have a balanced view on the matter. It’s not just roses and rainbows. This gives a good overview of the current limitations and where Rust can give most benefits in the kernel. Looks like GRUB days as the standard bootloader are counted. Booting straight using the Linux kernel could bring interesting benefits. Probably not doable on every hardware platform though. An interesting puzzle to pursue. Is it possible to rebuild exactly the same binary distribution packages? It’s really a good reminder of how powerful ptrace is. You can nicely intercept and change the behavior of syscalls with it. Forced to use UUID as primary key in a table? Then make sure to use them properly to not kill the performance more than necessary. Ideally use something else though. Very long read but will be an essential resource to have a fine understanding of text rendering in its current form. Interesting musing about the “software crisis” which was declared in the late 60s. We’re coping with it by piling levels of abstractions but clearly we’re still not out of it. Our craft still needs to grow. Good reminder that teams are made out of people. It’s good to look at the daily standups less as a technical management tool and more as a need to get into the work."
