["https://ervin.ipsquad.net/blog/2022/09/23/web-review-week-2022-38"]
title = "Web Review, Week 2022-38 - ervin"
description = "Website Description"
full_description = "Tags: web-review, c++, ux, hr, complexity, photography, search, safety, 3d, web, portability, tech, culture, organization, economics, business, surprising, self-hosting, low-tech, google, work, community, surveillance, rust, webassembly, foss, life, ethics, design Very interesting report although I admit I’m a bit skeptical at the strong “apolitical” message in it. This highlights very well a few challenges specific to Europe. We need to see them tackled I think. It’s nice to see moves in the public sector but clearly it needs to go further and faster. Same thing regarding the creation of OSPOs in companies. We all know you shouldn’t use Google Analytics. Now we also know that if you’re in Europe and you’re using it, it’s probably illegal. Slightly depressing when it’s laid out like this… still there is some truth to it. Maybe it’s time to rethink a few things. Since I regularly see Figma used by customers I really hope this will boost adoption on Penpot. A good open alternative you can even self-host. Definitely a big deal for the development of WebAssembly. We’ll have to see if the security promises hold but this definitely shows interesting features. Interesting set of challenges indeed. I think Rust is a bit at a crossroad now. The next few years will be crucial, either they will lead to further adoption or it will stagnate and slowly disappear. Now this is very interesting. An excellent teaser for Herb Sutter’s CppCon 2022 talk. Let’s see where that goes. Good reminder of the sometimes uneasy relationship between users and maintainers. This needs to stay healthy. Users need to know their place and maintainers should feel OK saying no to things. A long and complete article about the important parameters when taking photos and processing them. So it gives a few tricks for shooting the picture but also when you sit in front of the computer."
