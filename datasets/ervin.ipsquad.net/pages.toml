title = "Web Review, Week 2024-06 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, software, hr, memory, virtualization, resilience, law, databases, business, culture, blog, postgresql, rss, management, streaming, search, transparency, capitalism, crash, history, vendor-lockin, zsh, criticism, foss, web, 3d, safety, mathematics, erlang, browser, rust, linux, interviews, tech, video, microsoft, economics, webcomponents, opml, google, sql, shell, automotive Looks like good progress has been made. A few more adjustments would be welcome before it gets ratified. Things don’t look great in this giant… it’s astonishing how much eroding vision and transparency can hurt an organization. Unsurprising trend… this was a market where there was no chance to have a single dominant platform due to the existing studio behemoths. So now we’re in the streaming wars, people can’t afford to pay for every silos… and they turn to piracy again. Could have been all avoided if we went the “global license” route instead of dumping money on platforms. A bit opinionated and sarcastic maybe… still it feels right, the web browsers landscape is in a sad state. Not unexpected of course, but at least it makes it clear that Microsoft is actively trying to prevent users from using the browser they want. https://research.mozilla.org/browser-competition/over-the-edge-the-use-of-design-tactics-to-undermine-browser-choice/ If they really commit to it, this means Microsoft will really invest big in Rust. Let’s wait and see… https://www.techspot.com/news/101739-microsoft-seeking-software-architect-port-microsoft-365-rust.html Indeed, not all security issues are due to memory related problems. It’s 20% of the security issues. This is of course massive, but there’s still 80% of the security issues coming from wrong authentication, appliances and so on. This is an interesting VirtualBox fork for Linux. Using KVM as backend should bring interesting benefits. It’s here to sell something. That said it does a good job explaining the Erlang model and its “let it crash” approach to failures. Also highlights the obvious limitations."
