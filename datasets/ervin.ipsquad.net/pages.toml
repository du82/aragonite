full_description = "Tags: web-review, cloudflare, gaming, self-hosting, scrum, KDE, facebook, c++, linux, interviews, agile, assembly, hr, logging, programming, tech, networking, surveillance, valve https://www.cityam.com/mark-zuckerberg-and-team-consider-shutting-down-facebook-and-instagram-in-europe-if-meta-can-not-process-europeans-data-on-us-servers/ Thank you indeed. The amount of upstream contributions their efforts fostered is enormous at this point. It is nice to hear from a happy user from time to time. And yes, KWin is a very nice tiling environment once you have the right extensions (I use Bismuth and dynamic virtual desktops nowadays). I’m fairly happy with those. https://changelog.complete.org/archives/10338-kde-a-nice-tiling-envieonment-and-a-surprisingly-awesome-de You thought averaging two unsigned was trivial? Think again, here what needs to happen in all its glory. Excellent article about best practices for logging errors, most of it applies for other type of logs though. This asks very valid questions. I’m a bit less optimistic than in the conclusion though… I suspect that if it truly falls, it will be replaced by another cargo cult. As I keep saying to people I interview… it’s also about you interviewing us! I wish I had more questions from them. This list is a bit biased to some type of companies but that’s a good starting point."
