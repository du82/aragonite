full_description = "Tags: web-review, simulation, ai, time, gnome, criticism, serialization, physics, blog, machine-learning, security, twitter, cpu, hr, computers, community, command-line, nvidia, business, shell, performance, tests, data, databases, productivity, web, vandalism, management, social-media, tools, programming, tech, gui, amd, ux, fediverse, rest, postgresql, accessibility, smarthome, http, information, craftsmanship, creativity, writing, funny, gpu, services The first signs of journalism finding some independence from social media? That would be very welcome. https://techcrunch.com/2023/10/11/wordpress-com-blogs-can-now-be-followed-on-mastodon-and-other-federated-platforms/?guccounter=1 This is nice to see how easy it is to make sure a WordPress blog appears on the Fediverse. Hopefully will bring lots of activity. Definitely this, I think people are very much overdoing the smart home thing. I far prefer something not too “smart” in this space. I agree with this, be precise about what you’re using. Blanket terms won’t lead you anywhere to creating proper systems. If you’re using a GNOME base environment be responsible and make sure you install your security patches. Very good exploration about how to get time on computers. As usual it’s way less straightforward than what you might think. This is a very important point. Communities should make sure that new blood gets in. Companies should also avoid just recruiting top talent and groom juniors to contribute. https://redmonk.com/jgovernor/2023/10/10/postgres-the-next-generation-investing-in-the-next-generation-of-committers/ Looks like an interesting serialization framework. If it holds true to its claims it could be very useful in some place. This one is a lot. This is a very interesting exploration in rigid body simulation though. Shows well the trade-offs in term of performance and how to keep it usable for third party developers. Some things we tend to not notice… the scroll bars need a way to be brought back and to be large for better accessibility."
