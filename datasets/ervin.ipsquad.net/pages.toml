["https://ervin.ipsquad.net/blog/2024/11/15/web-review-week-2024-46"]
title = "Web Review, Week 2024-46 - ervin"
description = "Website Description"
full_description = "Tags: web-review, gps, complexity, linux, databases, distributed, programming, problem-solving, licensing, vendor-lockin, tools, craftsmanship, design, sensors, foss, conflict, git, algorithm, tech, hardware, ai, self-hosting, machine-learning, mobile, security, transportation, system, copyright, research, data, cloud, version-control, gpt, unix, privacy, type-systems, cpu, engineering https://www.bloomberg.com/news/articles/2024-11-13/openai-google-and-anthropic-are-struggling-to-build-more-advanced-ai It shouldn’t be, but it is a big deal. Having such training corpus openly available is one of the big missing pieces to build models. https://simonwillison.net/2024/Nov/14/releasing-the-largest-multilingual-open-pretraining-dataset/#atom-blogmarks This is an interesting and balanced view. Also nice to see that local inference is really getting closer. This is mostly a UI problem now. Fascinating research about side-channel attacks. Learned a lot about them and website fingerprinting here. Also interesting the explanations of how the use of machine learning models can actually get in the way of proper understanding of the side-channel really used by an attack which can prevent developing actually useful counter-measures. Nice chain of attacks. This shows more than one vulnerability needs to be leveraged to lead to root access. This provides valuable lessons. The title says it all. This is very fragmented and there are several options to fulfill the task. Knowing the tradeoffs can be handy. This is a nice view into how a query planner roughly works and a nice algorithm which can be used internally to properly estimate the number of distinct values in a column. Definitely a good post. No you don’t have to go all in with cloud providers and signing with your blood. It’s often much more expensive for little gain but much more complexity and vendor lock in. Avoiding boolean parameters in library APIs should be a well known advice by now. Still they should probably be avoided when modeling domain types as well."
