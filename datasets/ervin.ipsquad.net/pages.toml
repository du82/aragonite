["https://ervin.ipsquad.net/blog/2005/08/29/d3-developers-conference-started"]
title = "D+3 : Developers conference started! - ervin"
description = "Website Description"
full_description = "Today is the first day of the developers conference, I had hard time to wake up at 7am since I stayed awake discussing with a bunch of hacker until 1:30am… Aaron was there, which is good news, I was wondering if he was trying to join the ocean swimming with migrating turtles or some other weirdness. Well, anyway I managed to wake up and attend lot of talks… Just like last year the speaker was Eirik Chambe-Eng. He covered what happened within Trolltech since last year, and in particular the fact that Qt4 is out, and GPL on Windows. I’m still thinking that he’s a quite good speaker! It’s informative, but he has really good ideas to make his talks entertaining which is a very good thing. Thanks to him, we’ve seen some great photos of Matthias Ettrich. :-) Nice talk about the new KDEMM, which needs a new name obviously. I liked this talk, it was well structured, and has really good ideas, in particular the fact to have several backends available (aRTs, gstreamer, NMM, etc.). It’s clearly not targetting pro-audio, which surely requires a tight coupling to a particular framework for performances anyway. Here it’s more about having a nice API, easy to use for multimedia applications (jukebox, video players, etc.). Moreover it’s really planned to hide the tedious work to the user, and autodetect or auto-configure for him as much as possible. Finally, it seems that the NMM backend will have a separate GUI application to allow using it’s more advanced feature (since it’s a fully network enabled multimedia framework, I’ve been really impressed last year by the NMM guys talk!). This talk was very interesting, and obviously very technical. It gives some insight on how to design asynchronous API, and which points are proven to be difficult while building this kind of API. Liked it, Till and David really master their subject. It was nice, to have this one grouped with the asynchronous programming one. It gives another aspect on how responsiveness can be achieved, but through the use of thread. Mirko even introduced the ThreadWeaver API, which looks like something very convenient to use."
