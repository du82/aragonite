["https://ervin.ipsquad.net/blog/2023/11/03/web-review-week-2023-44"]
title = "Web Review, Week 2023-44 - ervin"
description = "Website Description"
full_description = "Tags: web-review, design, optimization, databases, google, encodings, rest, 3d, community, ai, surveillance, storytelling, politics, git, tech, copyright, tests, craftsmanship, security, android, DRM, fake-news, matrix, exceptions, attention-economy, privacy, performance, fake, frontend, graphics, sqlite, criticism, css, services, programming, api, interviews, machine-learning, mathematics, java, web, geometry, funny, mozilla, tdd, complexity, communication, lobbying, physics, social-media, gpt, tools, browser, python, advertisement https://www.reuters.com/technology/facebook-owner-faces-eu-ban-targeted-advertising-norway-says-2023-11-01/ Some people lash out at the wrong group… they should be angry at YouTube not at the tiny team making the extension trying to help block the ads. After the backlash about WEI on Chrome, now they’re going for something similar but scoped only for medias. At least now things are clear that it was mainly about pushing for DRMs to serve media producers. I fully agree with this. All those doomsayers about AI are there to sell something willingly or not. Let’s look at the current threats we’re seeing now, not the imaginary ones being the results of people taking SciFi a bit too literally. https://www.businessinsider.com/sam-altman-and-demis-hassabis-just-want-to-control-ai-2023-10?r=US&IR=T Attacks on machine learning models are getting more accessible. This means even more care will have to be taken to deploy and use those. Things could indeed be more convenient… if this was the case we’d probably have less security breaches. Making super complex tools and then complaining that people are holding them wrong isn’t gonna help. Interesting set of advices. There are a couple I tend to disagree or doubt they really matter though. Other than that probably worth keeping in mind. Definitely this, it’s been tried in Java, now we know it was a bad design decision… but it had to be tried to realize it. Neat walk through the Base64 encoding. It’s very useful so it’s better if it’s well understood."
