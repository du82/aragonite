full_description = "Tags: web-review, rss, fosdem, minimalism, complexity, python, anonymity, postgresql, vendor-lockin, systemd, zig, multithreading, tests, version-control, politics, social-media, rust, tools, linux, vision, tech, git, frontend, type-systems, web, surveillance, gdpr, risk, databases, learning, foss, colors, tdd, teaching, product-management, mathematics, writing, data, performance, c++, funny, business, ai, safety, backend, programming, DRM, c, react, system, machine-learning, gpt, project-management, 3d, documentation I think this is a very welcome protest at FOSDEM. This keynote would be a shame on the conference. Unfortunately I already planned to not attend FOSDEM this year, but if you are: please participate to this sit-in. This is indeed clear, the centralized web platforms are fragile by default. They are very prone to capture, this is what just happened. Very nice editorial. It’s clear that the level of trust in the technologies we depend on is low… but that’s not due to the technologies themselves it’s more about the business practices around them. In the end the solution will have to be political, in the meantime we ought to support the good players. https://www.vintagecomputing.com/index.php/archives/3292/the-pc-is-dead-its-time-to-make-computing-personal-again There was a time when scraping bots were well behaved… Now apparently we have to add software to actively defend against AI scrapers. This article is feature packed, lots of great ideas to exploit git trailers. This can help automate some workflows easily. Looks like a really nice tool to work with systemd services. It also integrates with my trusty lnav for the journal handling. I’ll definitely give it a try going forward. A bit long and a bit too much framed in a “vs Python” fashion for my taste. That said it contains good advice on how to prototype or start simple with Rust. It’s aligned with some of the advice I give as well. People tend to turn to low level details too quickly forcing themselves into a corner. There are better ways to handle it."
