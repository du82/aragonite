["https://ervin.ipsquad.net/blog/2022/12/09/web-review-week-2022-49"]
title = "Web Review, Week 2022-49 - ervin"
description = "Website Description"
full_description = "Tags: web-review, architecture, tech, 3d, git, databases, twitter, programming, pairing, java, multithreading, ai, social-media, surprising, linguistics, debugging, machine-learning, fediverse, management, science, tests, security, gpt, android, ants, politics Hard not to have at least some ChatGPT related news this week. Plenty of impressive experiments out there… I think this one is hands down the most impressive one. I’m biased though, I like linguistics inspired works. Words of caution regarding the use of language models for producing code. This can derail fairly quickly and earlier than you’d expect… without noticing it. This is really going down the drain. Right wings extremists basically took over the content moderation vacuum. I wonder how long before this turns into simply into an extremist echo chamber with no real user on it. https://arstechnica.com/gadgets/2022/12/samsungs-android-app-signing-key-has-leaked-is-being-used-to-sign-malware/ Nice explanation of the Mastodon architecture, how it propagates messages and interactions or how it scales. Looks like an interesting tool when you need to diff databases. Definitely something I’d see myself using for large pin tests. An old piece, I sometimes like to revisit the basics so here it goes. A nice explanation of how Git is built and how it works internally. It’s of course a simplification in some way but close enough to have a good mental model of what goes on behind the commands we use. Good balanced view about pair programming. I’d definitely like to practice it more, although whole days might be a bit too much and too exhausting. I’m not a huge fan of the “Steve Jobs said…” to justify thing, a clear rhetoric trick. Still, I think this short piece nails it down, it’s just better when managers actually know the job. It’s better to promote someone who knows it and coach that person into the job. There’s only one challenge then (which is glanced over in the paper): how to keep this manager technically relevant over time. It’s not that easy in our field."
