["https://ervin.ipsquad.net/blog/2023/04/21/web-review-week-2023-16"]
title = "Web Review, Week 2023-16 - ervin"
description = "Website Description"
full_description = "Tags: web-review, history, webgpu, windows, surveillance, cryptography, linking, c++, storage, science, climate, markdown, web, machine-learning, vendor-lockin, law, tools, http, data-visualization, gpt, mozilla, gui, power, networking, ethics, attention-economy, self-hosting, geospatial, latency, information, interviews, ai, funny, security, microsoft, foss, hr, internet, blog, supply-chain, hiring, tech, music, ux, reporting, leadership, business-intelligence, 3d, neural-networks, gpu, keepassxc, linux, server, culture, business, knowledge, copyright, performance, management This will be a welcome feature. There are extensions of course but at least users will have it by default when it lands. This is a good thing that Google makes such a move. Still, it could be so much more. Tidelift still seems to be the best offer for securing your dependencies. Definitely this! Major FOSS projects should think twice before giving their street creds to such closed systems. They’ve been produced with dubious ethics and copyright practices and since they’re usable only through APIs the induced vendor lock-in will be strong. There’s the carbon footprint but of course there’s also the water consumption… and with increased droughts this will become more and more of a problem. This was only a matter of time. It’ll be interesting to see how this will unfold. Potentially it could turn into lawsuit cases being built up, it could also mean content producers get a cut down the line… of course could be both. Since FOSS code also ends up in training those models I’m even wondering if that could lead to money going back to the authors. We’ll see where that goes. OK, this is a pre-print so to take with a truckload of salt. If further nice results get built up on this it could turn out interesting though. This is a much more intellectually satisfying approach than the current arm race of “let’s throw bigger models at the problem”. This has the potentially of reducing the computational complexity of those models, this is definitely welcome in term of energy and hardware requirements. Let’s wait and see…"
