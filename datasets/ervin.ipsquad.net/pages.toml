["https://ervin.ipsquad.net/blog/2021/04/23/web-review-week-2021-16"]
title = "Web Review, Week 2021-16 - ervin"
description = "Website Description"
full_description = "Tags: web-review, security, community, surveillance, vision, tech, ai, programming, feedback, strategy, twitter, maintenance, neural-networks, business, floc, hr, ci, management, gender, social-media, google, wordpress, execution, codereview, hype, neuroscience, linux Very good advices to analyse dysfunctions in teams and organization. One thing I’d add is to be careful to look for symptoms at the right level. Indeed problems at the Vision level will also lead to issues at the Strategy level which will in turn lead to pains at the Tactical level. So for instamce, don’t stop at symptoms listed at the strategy level also look for symptoms coming from the vision level otherwise you might be blinded and miss something. A bit of discouraging results… looks like gender parity in AI avatars is not for tomorrow. It seems we are in a catch 22, using male avatars reduce adoption while using female avatars reinforce women objectification. Since most people designing such systems are likely white male engineers… the outcome is unfortunately fairly clear. Plenty of good advices for code reviews. Fairly comprehensive since it covers both ends of the review. https://hackernoon.com/5-critical-topics-covered-at-once-code-review-practises-you-cannot-miss-kgm337k?source=rss Once again this highlight the toxic architecture of those social networks. They create frustration and anger and it’s by design. The trending topics on Twitter is one of the worst form of audience clashes. https://www.neowin.net/news/linux-bans-university-of-minnesota-for-sending-buggy-patches-in-the-name-of-research/ Looks like an interesting tool for semantic checks on a codebase, especially on CI. Looks like it makes writing such checks easier. Interesting simple exploration. This seems to confirm that there’s a lot of hype all around. Whatever the language, even if it is hot today it probably won’t look as fun tomorrow when you’ll have to maintain millions of lines of it."
