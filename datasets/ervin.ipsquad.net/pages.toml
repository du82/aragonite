full_description = "Tags: web-review, gpt, css, work, cryptography, email, privacy, multithreading, postgresql, failure, api, history, floats, politics, web, browser, performance, quality, criticism, python, safety, attention-economy, management, dns, risk, java, google, command-line, e-ink, postmortem, databases, raspberry-pi, censorship, productivity, programming, rss, security, complexity, DRM, graphics, project-management, resources, machine-learning, ai, networking, javascript, memory, tech, law, git, spam, speech, tools, version-control, automotive, frontend Ironically, I think this is one of the best analysis I’ve seen regarding OpenAI and the recent turmoil around of one of its founders. Excellent piece about everything which is wrong in the current industrialization moment of generative AI. Don’t you love DRMs in cars? Especially when the business people at the helm are pathological liars? Interesting a new name system being standardized. It’s supposed to protect privacy and be censorship resistant. We’ll see how it gets adopted. Floating-point numbers are really a complicated species. This is an interesting deep dive in some of their representation. Good reminder that false sharing is a real thing. It’s easier to encounter than you think when you start to dabble into multi-threading. Nice little article with simulations demonstrating why you want exponential backoff and how jitter is an extra layer of protection for the server. Yes, I have a thing for bringing RSS back. This time it’s a library enabling the feature for Java projects. Looks easy to use. Looks like RAII is finally making its way in Javascript. This looks like a good thing, it’s still rough around the edges though. Won’t be easy to get rid of the GIL in the Python ecosystem. There are notable differences of behavior between implementations and even versions of the same implementation… Lots of user code will unwillingly depend on a specific set of guarantees. Ever wondered how to programmatically introspect query plans? This is a long article but good starting point on how it’s represented under the hood."
