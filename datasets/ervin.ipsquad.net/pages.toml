title = "Web Review, Week 2024-40 - ervin"
description = "Website Description"
full_description = "Tags: web-review, programming, distributed, product-management, laptop, microsoft, c++, copyright, productivity, criticism, social-media, automotive, fake-news, copilot, html, patents, htmx, mozilla, economics, frontend, marketing, surveillance, project-management, philosophy, energy, history, system, gpt, commons, performance, research, reliability, safety, rust, map, collaborative, machine-learning, business, mathematics, privacy, tech, foss, ethics, logic, web, freebsd, cognition, tests, linux, neuroscience, advertisement, multithreading, crdt, fake, security, metaprogramming, ai, ecology, public-domain, scam An excellent service to provide. Let’s hope it stays sustainable, the risk is commercial leeches not giving back a dime. Be responsible, sponsor it if you use it commercially. https://freebsdfoundation.org/blog/why-laptop-support-why-now-freebsds-strategic-move-toward-broader-adoption/ Putting things in the public domain voluntarily is indeed more difficult than it should be. The best tool we got is CC0, but it still raises (probably unwarranted) concerns for software. Mozilla is clearly loosing its way, this is sad to watch. I guess the forks which remove the online advertising measures will become more popular. They’re trying a come back… of course they added layers of security to pretend it’s all solved and shiny. They totally ignore the social implications or if something like this even needs to be done. At least one can remove it… for now… https://arstechnica.com/gadgets/2024/09/microsoft-details-security-privacy-overhaul-for-windows-recall-ahead-of-relaunch/ Tags: tech, ai, machine-learning, gpt, cognition, neuroscience, philosophy, mathematics, logic, research This is a short article summarizing a research paper at the surface level. It is clearly the last nail in the coffin for the generative AI grand marketing claims. Of course, I recommend reading the actual research paper (link at the end) but if you prefer this very short form, here it is. It’s clearly time to go back to the initial goals of the AI field: understanding cognition. The latest industrial trends tend to confuse too much the map with the territory."
