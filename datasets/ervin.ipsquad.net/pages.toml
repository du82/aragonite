["https://ervin.ipsquad.net/blog/2023/12/22/web-review-week-2023-51"]
title = "Web Review, Week 2023-51 - ervin"
description = "Website Description"
full_description = "Tags: web-review, gpt, history, email, ai, distributed, java, 3d, wikipedia, api, optimization, foss, social-media, databases, mathematics, uuid, c++, multithreading, product-management, tech, project-management, rust, management, search, ethics, leadership, unix, interviews, business, ssh, learning, safety, performance, knowledge, facebook, physics, google, oauth, licensing, tests, compiler, craftsmanship, memory, profiling, machine-learning, web, shader, simulation, decision-making, design, python, criticism, embedded, system, programming, economics, technical-debt, elf, fediverse, object-oriented, version-control, lego, security, metrics, git A bit of an older article I’m bumping into again. It lays out fairly well the current limits and issues with Free Software as it is defined today. I’m unconvinced it can be solved via licenses but the debate needs to happen… I feel that somehow it’s too much ignored. Looks like Meta is moving forward with more ActivityPub compatibility for Threads. This raises real questions about what they genuinely want to implement and what they’ll abandon along the way. As Threads being connected to the Fediverse might turn into a reality, this article becomes all the more important. The question of this connection being even desirable is an important one. When SEO and generated content meet… this isn’t pretty. The amount of good content on the web reduced in the past decade, it looks like we’re happily crossing another threshold in mediocrity. The actual dangers of generative AI. Once the web is flooded with generated content, what will happen to knowledge representation and verifiability? https://ethanzuckerman.com/2023/10/10/heather-ford-is-the-web-eating-itself-llms-versus-verifiability/ Here we are… We’re really close to crossing into this territory where any fiction can disguise itself for reality. The problem is that we’ll literally be drowning in such content. The social impacts can’t be underestimated. https://www.404media.co/facebook-is-being-overrun-with-stolen-ai-generated-images-that-people-think-are-real/"
