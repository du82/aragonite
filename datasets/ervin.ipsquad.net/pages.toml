["https://ervin.ipsquad.net/blog/2024/05/10/web-review-week-2024-19"]
title = "Web Review, Week 2024-19 - ervin"
description = "Website Description"
full_description = "Tags: web-review, bios, machine-learning, tools, linux, spreadsheets, productivity, tech, internet, learning, failure, gdpr, networking, programming, gpt, css, search, ux, hardware, uefi, complexity, uuid, culture, language, frontend, ai, ethics, email, refactoring, benchmarking, tests, criticism, encodings, qt, web, craftsmanship, python, teaching, copyright, research, systemd, htmx, satire, copilot, tcp Nice article. It’s a good reminder that the benchmarks used to evaluate generative AI systems have many caveats. Interesting data point. This is a very specialized experience but the fact that those systems are kind of random and slow clearly play a good part in limiting the productivity you could get from them. Well, maybe our profession will make a leap forward. If instead of drinking the generative AI cool aid, if we really get a whole cohort of programmers better at critical skills (ethical issues, being skeptical of their tools, testing, software design and debugging) it’ll clearly be some progress. Let’s hope we don’t fall in the obvious pitfalls. Interesting questions and state of the art around model “unlearning”. This became important due to the opacity of data sets used to train some models. It’ll also be important in any case for managing models over time. If you wonder why information retrieval from natural language texts is a tough domain, here is a short article listing the important things to keep in mind. Not a reason to make no effort into having as proper error messages as possible. Still there’s some truth there that trying to have a really useful error message is a fool’s errand. Good exploration of the many ways contact forms fail us regularly. Also shows a few cases where you might still want to us them… in most cases you shouldn’t. Good advice indeed. Having asserts using appropriate matchers can go a long way understanding what went wrong. Definitely this. We tend to like complexity too much as a profession and field. It’s also a good reminder that the complexity of the problem and the complexity of the solution shouldn’t be conflated."
