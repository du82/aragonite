description = "Website Description"
full_description = "Tags: web-review, science, fediverse, html, browser, architecture, design, modules, france, server, anonymity, career, programming, retrospective, tech, self-hosting, management, tools, learning, tor, language, surveillance, web, hr, attention-economy, foss, google, funny, project-management, git, frontend, performance, multithreading, python, politics, history, security This is well deserved. She’s doing a very important work for the progress of science. All those pay walls are nonsense. https://torrentfreak.com/sci-hubs-alexandra-elbakyan-receives-eff-award-for-providing-access-to-scientific-knowledge-230728/ The FSF words are strong but deserved in this case. Let’s hope it marks the beginning of an efficient campaign against this move from Google. https://www.fsf.org/blogs/community/web-environment-integrity-is-an-all-out-attack-on-the-free-internet Good explanations, the parallel and history perspective on Palladium is right. It’s the same fight than 20 years ago, it shows up its ugly head regularly. Time to collectively say no once more. https://www.techdirt.com/2023/08/02/googles-plan-to-drm-the-web-goes-against-everything-google-once-stood-for/ Interesting point of view. We have two worlds now coexisting on the Web and they tend to ignore each other more and more. Welcome in France, this country which claims to be a beacon for Human Rights but has a problem with its law enforcement for the past two centuries… surveillance abounds and its accelerating. https://www.politico.eu/article/france-surveillance-cameras-privacy-security-big-brother-paris-olympics/ This is a good list, should be seen as a starting point there are more things to do after this. I’m thinking for instance about adding fail2ban to the mix. Interesting look at module systems and what they entail. It’s funny to see that most languages do things slightly differently in this area. OK, this could be big for Python. Let’s see how they execute this plan. It carries some risks as