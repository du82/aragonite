["https://ervin.ipsquad.net/blog/2025/01/31/web-review-week-2025-05"]
title = "Web Review, Week 2025-05 - ervin"
description = "Website Description"
full_description = "Tags: web-review, ai, performance, culture, tools, criticism, machine-learning, psychology, fediverse, tech, supply-chain, satire, date, programming, foss, community, politics, energy, gpt, complexity, wayland, regex, funny, neural-networks, portability, time, maintenance, dependencies, cpu, safety, business, javascript, science, security https://techcrunch.com/2025/01/24/open-source-alternatives-to-instagram-tiktok-and-whatsapp-raise-funds-on-kickstarter/ Maybe at some point the big providers will get the message and their scrapers will finally respect robots.txt? Let’s hope so. https://arstechnica.com/tech-policy/2025/01/ai-haters-build-tarpits-to-trap-and-trick-ai-scrapers-that-ignore-robots-txt/ I guess this was just a matter of time, the obsession of “just make it bigger” was making most player myopic. Now this obviously collides with geopolitics since this time it’s about a Chinese company being ahead. Looks like the monopolists are vexed and are looking for arguments to discredit the competition… of all the arguments, this one is likely the most ridiculous seeing their own behavior. https://www.thebeaverton.com/2025/01/chinas-new-and-cheaper-magic-beans-shock-americas-unprepared-magic-bean-salesmen/ I mostly agree with this piece. There’s lots of room for optimization still so we might see a temporary drop in the energy consumption of those systems. That said, longer term energy consumption is indeed the main leverage to improve performance of those systems. It can only get us so far, so new techniques will be needed. Hence why my position is that we’ll come back to symbolic approaches at some point, there’s a clear challenge at interfacing both worlds. Nice primer on the impact of too many branches in your code on the CPU. This is sometimes a good way to boost performance when you’re mindful about that. Of course I agree with this piece. You need enough culture in your field to know about a breadth of topics. It will definitely help pick up the next one you don’t know about yet or help you build parallels for the tougher problems you encounter."
