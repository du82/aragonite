full_description = "Tags: web-review, performance, security, climate, postgresql, air-quality, web, databases, tech, surveillance, apple, frontend, css, saml, ecology, science, privacy, google https://www.sciencemag.org/news/2021/08/scientist-says-cleaning-indoor-air-could-make-us-healthier-and-smarter https://www.reuters.com/business/environment/atlantic-ocean-currents-weaken-signalling-big-weather-changes-study-2021-08-05/ The Apple ecosystem hell bent on becoming extremely privacy invasive… Per usual it’s justified by “protecting the children” or some other false pretense. Don’t be fooled, once it’s in, it’ll just expand in scope and governments will do everything they can to tap in the content of those scans. Thanks you Apple for creating the perfect tools for private and governmental surveillance. Now, we can probably expect a race to the bottom from the other players as well. https://www.eff.org/deeplinks/2021/08/if-you-build-it-they-will-come-apple-has-opened-backdoor-increased-surveillance https://www.morningbrew.com/emerging-tech/stories/2021/08/04/deepminds-cofounder-placed-leave-bullying-google-promoted Interesting exploration and rough explanation of why SAML has so many issues. Complexity by design in such critical components is a bad idea…"
