["https://ervin.ipsquad.net/blog/2021/03/26/web-review-week-2021-12"]
title = "Web Review, Week 2021-12 - ervin"
description = "Website Description"
full_description = "Tags: web-review, sql, go, tech, sms, ecology, performance, vscode, security, data-science, rust, 2fa, openssl, refactoring, html, plan9, medecine, craftsmanship, history, javascript, malthus, web, hygiene, biology, tutorial, economics, kde, css, dystopia, surveillance, mentoring, databases, frontend, sqlite This kind of moments make me proud of the KDE e.V. in general and the current board in particular. This is a very level headed statement. Way more honorable than the mudslinging we’ve been seeing lately. It points at the right issue which is institutional. French Senate validated a whole lot of surveillance measures… More cameras and biometric controls everywhere. We have money for that apparently but not to have decent prison cells or to fight inequalities… This country is really on an authoritarian path. https://www.laquadrature.net/2021/03/19/securite-globale-le-senat-dit-oui-a-la-surveillance-de-masse/ Or why you should think twice before embarking into a refactoring when it’s not directly related to some feature development… I like this kind of list of “gotchas” for languages or frameworks. This one seems to be fairly comprehensive in the case of Go. There are a few I wouldn’t expect in such a recent and fashionable language, oh well… Very thorough analysis on the kind of web frontend performances you can expect for most people on mobile. Since we basically need to reduce the footprint of such frontends to make this sustainable again this is a very welcome article. Interesting use of CSS custom properties to make dynamic color schemes easy and manageable for webpages. Plan 9 is getting its own foundation. That’s kind of unexpected, I wonder where this will lead. :-) Still keeping an eye on what’s available for crunching numbers in Rust. Apache Arrow looks like an interesting option. Interesting take, it’s a bit what I feel coming from C++ and keeping an eye on Rust, it’s accumulating features fast and there’s a risk of things becoming inconsistent."
