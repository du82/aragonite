["https://ervin.ipsquad.net/blog/2024/06/28/web-review-week-2024-26"]
title = "Web Review, Week 2024-26 - ervin"
description = "Website Description"
full_description = "Tags: web-review, performance, tools, safety, design, funny, databases, architecture, surveillance, c++, foss, security, self-hosting, python, hardware, nfc, privacy, cryptography, history, cpu, gpt, supply-chain, machine-learning, tech, politics, failure, research, version-control, pattern, memory, system, project-management, algorithm, crdt, distributed, law, tests, web, ai Very neat piece, shows quite well the problems with Chat Control like laws. It’s been postponed this time, but expect it to comeback somehow. This is becoming an important industry. Regulation is needed to avoid consumers to be in a mouse trap. This is necessary to reap the benefits of those technologies. This is bad for two reasons: 1) people clearly put too much trust in random CDNs to distribute their dependencies and 2) people don’t track depencendies obsolescence properly. This is ignoring the energy consumption aspect. That said, it is spot on regarding the social and economics aspects of those transformer models. They have to be open and self hostable. Interesting paper showing a promising path to reduce the memory and workload of transformer models. This is much more interesting than the race to the gigantic size. Interesting approach for using CRDT through a file sync application. Probably something to see somehow generalized on traditional desktop applications. Interesting case, when everything else gets faster, memory copies might start to become the bottleneck. If you needed to be reminded that allocating small blocks of memory is a bad idea… here is a paper explaining it. Definitely not the rules you want to apply on your projects. Still it’s interesting to know how the STL uses explicit. https://quuxplusone.github.io/blog/2024/06/25/most-stl-ctors-arent-explicit-but-yours-still-should-be/ https://nesbitt.io/2024/06/24/from-zerover-to-semver-a-comprehensive-list-of-versioning-schemes-in-open-source.html Another story of precursors in the tech space. They basically invented the palmtop and spawned Symbian which was very much dominant on mobile for a while. The end of the Nokia story is a bit oversimplified for my taste just glancing over Maemo, but it is forgivable since it wasn’t the focus of this piece."
