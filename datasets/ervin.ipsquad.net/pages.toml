description = "Website Description"
full_description = "Tags: web-review, css, tech, energy, cognition, ai, nvidia, research, science, machine-learning, time, tests, work, web, type-systems, law, water, technical-debt, computer-vision, complexity, gpt, neural-networks, apple, copyright, java, agile, computation, performance, game, project-management, culture, product-management, vendor-lockin, automotive, ux, p2p, ecology, graph, javascript, foss, frontend, tools, management, criticism, 3d, git, matrix, history, architecture, life, neuroscience, version-control, kde, craftsmanship, programming, mathematics https://www.zdnet.com/article/kde-neon-shows-that-the-plasma-6-linux-distro-is-something-truly-special/ This is an important request. It has safety implications. It is non-binding request of course, but the insurance companies pay attention to it and so could have an impact. https://arstechnica.com/cars/2024/03/carmakers-must-bring-back-buttons-to-get-good-safety-scores-in-europe/ https://appleinsider.com/articles/24/03/01/apple-reverses-course-on-death-of-progressive-web-apps-in-eu This was only a matter of time before we’d see such a move. This doesn’t bode well for things like ZLUDA. https://www.tomshardware.com/pc-components/gpus/nvidia-bans-using-translation-layers-for-cuda-software-to-run-on-other-chips-new-restriction-apparently-targets-zluda-and-some-chinese-gpu-makers This is one of the main problems with using those generative models as currently provided. It’s time for the legislators to step up, we can’t let a couple of players hoard energy and water for themselves. Friendly reminder that the neural networks we use are very much artificial. They’re also far from working like biological ones do. https://theconversation.com/were-told-ai-neural-networks-learn-the-way-humans-do-a-neuroscientist-explains-why-thats-not-the-case-183993 Looks like an interesting approach for a new family of development forges. Fully distributed and peer to peer, I wonder if it’ll pick up. Indeed, graphs are peculiar beasts. When dealing with graph related problems there are so many choices to make that it’s hard or impossible to come up with a generic solution."
