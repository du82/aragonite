["https://ervin.ipsquad.net/blog/2022/10/28/web-review-week-2022-43"]
title = "Web Review, Week 2022-43 - ervin"
description = "Website Description"
full_description = "Tags: web-review, python, design, tech, japan, command-line, leak, farming, gaming, blending, art, twitter, history, gui, cloud, collaborative, tests, agile, programming, business, pairing, management, linux, microsoft, production, server, hr, sql, sqlite, safe, ecology, security, coverage, criticism, feedback, origami, casual, blog, graphics, culture Very much later in the day than the usual, I was busy doing things with interlocking brick somehow… Anyway, let’s go for my web review for the week 2022-43. Interesting bug in SQLite. In particular look for the conclusion regarding tests and coverage. It’s something I often have to remind people of. Very interesting musing about the UX divide between GUI and CLI/text and how this could be approached to have both interacting better. OK, the writing is sometimes a bit biased in my opinion (didn’t you know Python is superior to any other language?). That being said, this is an interesting resource to get ideas on how the GoF proposed set of design patterns apply in the Python world. I like this kind of “how do things relate” resources. This feels odd to be hosted on a Google Doc, but this is an interesting list of case studies and opinions around SAFe. I learned a few things, I didn’t realize it’s creation was so disconnected from the pre-existing agile community. It all seems to confirm my opinion that it’s better to stay away from it though. The few organizations I know of which use it are clearly very much in a command and control mode. This is going backwards. As I could experience both, I concur. Anniversary reviews are just much better for everyone involved. Interesting point. It’s clearly not easy to get proper feedback depending the size of the group we’re reaching out to. Maybe a bit heavy handed in the way it is presented in this piece. Still, constant brainstorming can get in the way of true focus or getting in the zone. This is definitely needed for some problems. Very interesting article. The medieval pig is totally not like we imagined, both on how it looked or how it behaved."
