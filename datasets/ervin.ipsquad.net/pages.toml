["https://ervin.ipsquad.net/blog/2024/11/01/web-review-week-2024-44"]
title = "Web Review, Week 2024-44 - ervin"
description = "Website Description"
full_description = "Tags: web-review, neuroscience, ai, craftsmanship, memory, posix, tools, philosophy, graphics, webgpu, framework, type-systems, unix, 3d, rust, mobile, criticism, web, matrix, history, postgresql, agile, profiling, science, decision-making, product-management, legacy, politics, sqlite, python, java, spring, culture, architecture, mathematics, databases, security, complexity, ssh, internationalization, react, language, time, foss, project-management, tests, learning, ci, protocols, c++, github, git, shader, machine-learning, tech, quality, career, data-visualization, dns, 2d A very precious philosopher from the 20th century. Her texts are still very precious and resonate today. In this piece it’s focusing about tech relevant excerpts, she had plenty to say about today’s politics as well. Nice initiative from the OSI. It is timely, such a definition was surely needed. The data information part seems fairly weak though… for sure you could make a system which doesn’t respect the four freedoms that way. Like me, you find the Open Source AI Definition weak on the training data information side? You’d be right and there’s a reason for it… it’s probably hiding quite some open washing for the larger models. This is a good explanation of the motives and consequences. This is definitely true. As long as web frontends are dominated by large frameworks, the web will always have subpar experience on mobile. And the solution isn’t going to come from the mobile providers too happy to gatekeep their app store. This is definitely getting there in terms of performance and usability. The mobile clients seem mature enough, just need the desktop clients to catch up before this becomes really something I’d feel confident enough to recommend and push for. Time management and timezones are definitely complicated. In a way it’s culture colliding with computers and localisation… it can’t be simple. Nice technique for automating the verification of SSH host keys. It’d be nice to see wider adoption."
