description = "Website Description"
full_description = "Tags: web-review, web, copyright, c++, rust, static-analyzer, gui, programming, c, ethics, graphql, funny, gpu, criticism, architecture, standard, postgresql, law, self-hosting, databases, api, 3d, browser, management, java, design, tech, production, productivity, data-visualization, data-science, parsing, pattern, history, performance, github, apple, pandas, polars, gpt, python, tests This lawsuit and the first ruling are indeed very concerning. Let’s hope we keep the Internet Archive alive, their work is invaluable. This is a big milestone for 3D and computation on GPUs from the browser. I suspect it will have interesting security implications though, we’ll see. This ecosystem suffers from the same warts and doesn’t seem to make any progress… lack of transparency, “we know better” mentality, tight coupling, lack of communication. This is especially problematic for something like a browser. Indeed, it’s important. You should own your content, you can eventually syndicate on trendy platforms but keep your own base for your own content. This is a very concerning for C… and it drifts apart from C++ further. The old “C as a subset of C++” position is less and less valid. Very unfortunate. Well, this is a bit obscure but we have to know it’s there somehow. Better not rely on it too much though. Looks like a nice Faker alternative for Java projects. Turns out I was looking for something like that. Really nice little tool, this is indeed surprising how little code is needed for something like this. Treesitter is definitely a huge help there. Polars really looks like a nice alternative to Pandas with a nice upgrade path from data exploration to production. I definitely used this trick from time to time. In the right context it definitely work. Leaving some easy mess on purpose is a good way to get back into a task the next day. Lots of nice advices in the followups. The previous article clearly lead to a good conversation around it."
