["https://ervin.ipsquad.net/blog/2021/02/27/web-review-week-2021-08"]
title = "Web Review, Week 2021-08 - ervin"
description = "Website Description"
full_description = "Tags: web-review, nasa, xslt, complexity, vendor-lockin, facial-recognition, npm, productivity, emergence, ecology, leak, politics, devops, reliability, tech, design, popper, epistemology, machine-learning, ai, mars, rich-client, production, ethics, optimization, apple, green-it, surveillance, web, git, json, rust, sustainability, performance, free-software, science, monitoring Clearly the use of facial recognition will soon be out of control if even soccer clubs need to be reminded to drastically limit its use. https://www.numerama.com/tech/690077-la-cnil-avertit-un-club-de-foot-il-ne-faut-pas-faire-nimporte-quoi-avec-la-reconnaissance-faciale.html#utm_medium=distibuted&utm_source=rss&utm_campaign=690077 Looks like an interesting book (didn’t read it yet, would love an epub version out of the box) about AI and machine learning. Large leak of health data from french patients found on the blackmarket… The source of the leak is still being investigated. Interesting analysis showing how the M1 SoC from Apple is really a good way for them to close and control their desktop ecosystem even more than before. In my opinion, if you care even one bit about your personal freedom you should likely stay away from this ecosystem. This is an excellent reminder on how the Popperian falsification came to be and how weak it is. More surprising are the ethics and politics ramifications of it and how they got used. Or why our world is more and more looking like a bad dystopian sci-fi movie… EU now funding drone swarms for border control… Very nice set of tip and tricks for git. Quite a few are probably known to the more advanced users but still there might be one or two for everyone’s taste. Still a young project but that looks like an interesting approach. At least it would make for much smaller bundles than Electron while still enabling the same type of uses. I still have slight concerns about the complexity involved because of all the layers or how much memory this can consume (akin to Electron). Let’s wait and see how it evolves."
