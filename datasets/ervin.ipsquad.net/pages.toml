["https://ervin.ipsquad.net/blog/2023/03/31/web-review-week-2023-13"]
title = "Web Review, Week 2023-13 - ervin"
description = "Website Description"
full_description = "Tags: web-review, leadership, ai, bike, management, profiling, team, architecture, security, science, performance, tech, engineering, machine-learning, cryptography, culture, java, productivity, rust, career, type-systems, python, fediverse, design, history, writing, programming, organization, foss, remote-working, twitter, gpt, craftsmanship, physics Twitter continues its slow death… That likely explains why the Mastodon to Twitter bridge I’m using has become so unreliable. I’ll just keep ignoring it I guess. Clearly aims to demonstrate the superiority of their specialized hardware for training. That said it’s nice to have proper open models available (architecture, training data, weights… it’s all in the open). Nice walk through for a use of PyO3 to make some Python code much faster. Nice to see how useful py-spy turn out to be in such scenarii as well. There are nice mechanism in the Java type system nowadays to no rely on Optional all the time. This is a good reminder of the main alternative. We might start in a software career attracted by the “perfection of the machines” (already debatable) but indeed to make anything meaningful we need to interact with other people. I often say it but I’ll say it again: it is a team sport. Indeed, this is the most important skill we need next to coding. Especially in a remote work culture. Nice (even though a bit long) explanation of the skills needed for a senior software engineers. Definitely a bunch of good advises in there. Note it’s not about impostor syndrome, I guess lots of us think we’re in this category, that doesn’t make it real. Anyway, from the management point of view this is indeed a baffling situation when you encounter someone like this. What to do? Definitely not always easy, sometimes induced by the organization as well so it would be too easy to blame on the person alone. We need to pay more attention to those and there’s clearly no magical recipe to handle them. This is indeed a phenomenon which I find odd. Everywhere you look, culture seems like it became homogeneous… I don’t like this much, but indeed it means it’s easy to be distinctive if you want to."
