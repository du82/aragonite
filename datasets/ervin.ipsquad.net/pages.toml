["https://ervin.ipsquad.net/blog/2023/04/28/web-review-week-2023-17"]
title = "Web Review, Week 2023-17 - ervin"
description = "Website Description"
full_description = "Tags: web-review, gpt, multithreading, project-management, comments, filesystem, security, postgresql, criticism, api, geometry, focus, databases, ai, science, web, law, mob-programming, copilot, architecture, git, craftsmanship, c++, complexity, foss, politics, windows, tech-lead, remote-working, http, rust, ethics, neuroscience, tech, management, notifications, codereview, 3d, surprising, dns, programming, gui, product-management, technical-debt, smartphone, performance, android Concerning moves on the ICANN side… already in the agreements around .com and now trying to make its way into .net. https://freespeech.com/2023/04/19/red-alert-icann-and-verisign-proposal-would-allow-any-government-in-the-world-to-seize-domain-names/ Yep, disappointing indeed… I got a phone with a third party ROM and had to debug the A-GPS in there (don’t ask), it’s indeed reaching to this website as well. There’s enough to criticize without crying wolf for nothing. Are we surprised? Not at all… this is an ethical problem, this is a legal risk. The alternatives will hopefully know better. Interesting experiment even though it’s still early days for this kind of research and we’d need more such evaluations. They found that it produces mostly insecure code. This is not really surprising in the end, this manipulates language but has not execution model. It can be fixed only by coupling to some outside system. Definitely complicated to identify and resolve paths on this platform. I had to deal with it from time to time and this can definitely turn into a pain in the neck. Since I’ve seen this argument floating around more than once, it’s nice to have a properly done rebuttal of it. This is nicely done, listing the own bias of the author, still in the end that shows the logical flaw of the argument. https://blog.ploeh.dk/2023/04/24/are-pull-requests-bad-because-they-originate-from-open-source-development/ Interesting results. This gives a couple of insights in terms or adoption, perception of problems by people on C++ projects and tooling. It’s definitely worth skimming through."
