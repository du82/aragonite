["https://ervin.ipsquad.net/blog/2022/09/02/web-review-week-2022-35"]
title = "Web Review, Week 2022-35 - ervin"
description = "Website Description"
full_description = "Tags: web-review, web, microsoft, performance, optimization, estimates, hiring, velocity, ocaml, browser, art, programming, product-management, machine-learning, python, ai, tech, processes, planning, quality, tools, xslt, debugging, design, docker, foss, rss, email, project-management More elements on why we should all be concerned about Visual Studio Code and the state of development tools overall. It’s clearly moving more and more proprietary. Visual Studio Code’s ecosystem is a very well designed trap. I see it more and more around me (even tried it for a little while to see what it was all about). What can I say… Go Kate Go! And also we clearly need many more LSP servers. Interesting first exploration of a tiny part of the data set. If you read closely, this shows some of the potential biases in there. https://waxy.org/2022/08/exploring-12-million-of-the-images-used-to-train-stable-diffusions-image-generator/ It’s at least nice to see people paying attention to this and fixing their applications accordingly. I think this is a fair account on the state of OCaml in 2022. I wish it’d have grown more and have a bigger community by now. Nice little language still. Nice categorization of the knowledge and skills needed for debugging. Definitely something to keep in mind to focus your efforts. Still controversial in the Python community, this post shows a balanced view on where it makes sense and where it doesn’t. Unfortunately seems to subscribe to the 10x programmer myth at least partly while trying to debunk another one… apart from that, it was very insightful, shows well how it’s a team sport and how you want people to complete each other. The whole “rockstar developer” thing is a recruitment marketing scheme. Good explanations on why trading quality for speed is always a bad idea. It also goes on about how to avoid sacrificing quality through the definition of done and proper estimates. Wise words, if you’re always too busy and overloading your team, it’s a sign of something… but what? It’s important to know since it’s what will drive the necessary conversation you need to have."
