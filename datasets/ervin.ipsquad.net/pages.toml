["https://ervin.ipsquad.net/blog/2021/06/18/web-review-week-2021-24"]
title = "Web Review, Week 2021-24 - ervin"
description = "Website Description"
full_description = "Tags: web-review, irc, python, scrum, frontend, command-line, leadership, design, apple, economics, security, uber, microservices, databases, freenode, tech-lead, management, tech, backend, complexity, programming Getting ready for giving out a training tonight. Still, here is my latest web review for the week 2021-24. https://www.theverge.com/2021/6/11/22528701/apple-rank-own-app-over-competitor-files-dropbox-wwdc-2017 Clearly that’s a big “if”… I don’t think we’ll ever see the Scrum Alliance really care about developers. I think this is a very good summary of what being in the position of a tech lead entails. I especially like the bottom line of this article: it’s a constant balancing act between your heart or your mind. Most of the points pushed forward in this article are things I’ve been trying to achieve for a long time. It also summarizes fairly well most of the topics I go through for coaching situations with tech leads or people growing in the position. Stay away from the hype and introduce complexity in your systems only if it’s warranted by the problem space you have to tackle. Most organizations don’t need microservices, use them responsibly. Second time I bump into this book being mentioned somewhere. This good summary really makes me want to read it. At least it gives a clear overview of complexity and how it’s tied to other softer topics. I especially like the distinction between tactical and strategic, it’s one I do often. I think I’m particularly willing to read the chapters about comments and TDD… from the summary it seems it’s where I’m the most at odd with the ideas in there. A collection of nice CLI tools. Got some of them already, still there are a few more which look interesting."
