["https://ervin.ipsquad.net/blog/2022/12/02/web-review-week-2022-48"]
title = "Web Review, Week 2022-48 - ervin"
description = "Website Description"
full_description = "Tags: web-review, memory, low-tech, architecture, webassembly, git, performance, tech, programming, c++, multithreading, type-systems, metaprogramming, rust, maintenance, compiler, book, debugging, project-management, monitoring, note-taking, c Little simple benchmark of WebAssembly performances for the most common languages found there. Careful to the payload size though. Don’t believe claims about Rust (or any other options in fact) being a language for universal use. It has a few spaces where it shines and others where it’ll be a drag. Picking the right language and stack is a multi-factor decision process where the technical advantages of the language itself say less than half of the story. Interesting take about what could make dynamic typing truly shine if it got all the way to runtime manipulation in a consistent manner. We’re far from it though. Obscure feature definitely but we’re happy it’s there… maybe one day it’ll indeed allow to have much more independence from the code forges. Definitely this, we have to stop pointing disk I/O so much for performance issues. This is just not really slow anymore. Obviously network is a different story. Undefined behavior do exist and well… they’re really undefined, don’t make any assumption about them. Nice summary on the false sharing problem with caches and how it can impact your performances in multithreaded contexts. https://surfingcomplexity.blog/2022/11/25/cache-invalidation-really-is-one-of-the-hardest-things-in-computer-science/ Interesting set of memory patterns. Didn’t know all of them, some are definitely useful and I already use, I’ll try to look for the others next time I need to. Nice list of things to keep in mind when working on projects, even small personal ones. This greatly improve maintainability in the long run. There’s definitely a tension between something which you can organize and search easily (by typing) and something you can remember better (by hand writing). That’s why I can’t get rid of hand written notes completely, I practice a mix of both depending on the use."
