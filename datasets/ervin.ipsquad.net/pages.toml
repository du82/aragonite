["https://ervin.ipsquad.net/blog/2021/04/09/web-review-week-2021-14"]
title = "Web Review, Week 2021-14 - ervin"
description = "Website Description"
full_description = "Tags: web-review, machine-learning, hacking, strace, postgresql, c++, python, craftsmanship, frontend, architecture, web, vendor-lockin, backup, movie, pinephone, security, programming, sms, tech, backend, ai, sql, streaming, system, agile, licensing, self-hosting, scrum I recognize myself quite a bit into that: boring but pervasive technologies is generally good for users. Excellent reminder of how awesome strace is. This is one tool every developer needs to know, it often saves the day when everything else fails. Because when things are presented a bit too rosy I get suspicious… it’s nice to have such counterpoints to realize PostgreSQL is not perfect which means there are scenarios where you might not want it. Excellent take from Ron Jeffries about the current state of the Scrum industry. So many certified Scrum Masters that it’s not fun anymore and likely useless… if not outright harmful. That’s in part why I always refused to be certified. This kind of schemes tend to lead to such abuses. It exactly explains my beef toward the streaming platforms. It just creates the old movie studios cartel and push them to hoard intellectual property to have exclusive content. Things would probably have been less dire with a global licensing system. If you’re a bit technical this is completely doable. It’s somewhat similar to what I’m doing at home. Gave me a couple of ideas on what to improve too. Very good advice, there’s a lot in programming which is really just mundane and boring. That doesn’t make it easy but you might end up doing what everyone else tried to avoid."
