description = "Website Description"
full_description = "Tags: web-review, mathematics, internet, tech, tdd, productivity, gpu, learning, research, programming, teaching, radio, gpt, science, copilot, maintenance, machine-learning, privacy, security, satire, performance, problem-solving, ip, innovation, surveillance, foss, politics, reliability, python, ai, networking, logic, ethics, google A good reminder that everything they buy they turn it into a surveillance system indeed… This time under the pretense of security. https://boingboing.net/2025/02/07/recaptcha-819-million-hours-of-wasted-human-time-and-billions-of-dollars-google-profit.html That’s a lot of stalkerware in the wild. And this exploit is only about two such apps. What’s wrong with people that they install this kind of crap on their loved ones smarphones? https://techcrunch.com/2025/02/20/stalkerware-apps-cocospy-spyic-exposing-phone-data-of-millions-of-people/ The security implications of using LLMs are real. With the high complexity and low explainability of such models it opens the door to hiding attacks in plain sight. Interesting research, looking forward to the follow ups to see how it evolves over time. For sure the number of issues is way to high still to make trustworthy systems around search and news. https://www.bbc.com/mediacentre/2025/bbc-research-shows-issues-with-answers-from-artificial-intelligence-assistants This might be accidental but this highlights the lack of transparency on how those models are produced. It also means we should get ready for future generation of such models to turn into very subtle propaganda machines. Indeed even if for now it’s accidental I doubt it’ll be the case much longer. People really need to be careful about the short term productivity boost… If it kills maintainability in the process you’re trading that short term productivity for a crashing long term productivity. I like this paper, it’s well balanced. The conclusion says is all: if you’re not actively working on reducing the harms then you might be doing something unethical. It’s not just a toy to play with, you have to think about the impacts and actively reduce them."
