title = "Web Review, Week 2024-31 - ervin"
description = "Website Description"
full_description = "Tags: web-review, debugging, gpt, tech, graphics, management, performance, tools, internet, storage, sustainability, machine-learning, trust, databases, ai, privacy, shader, python, kernel, amd, product-management, empathy, complexity, version-control, 3d, infrastructure, engineering, simulation, virtualization, google, filesystem, networking, safety, cpu, git, cloud, security, marketing, c++, linux, browser, sqlite Looks like we really get back to the same type of vulnerabilities… it’s only a couple of dozens usual suspects. A very good piece, it’s nice it’s been resurrected. This is a good reminder that the blame and shame of the user for general computing security is plain wrong. It’s we the developers and the UX designers who should be kept on our toes. Interesting finding. Looks like the trust is not very high in the general public towards products with AI. https://news.wsu.edu/press-release/2024/07/30/using-the-term-artificial-intelligence-in-product-descriptions-reduces-purchase-intentions/ Interesting article about what’s coming for the branch predictor in the Zen 5 architecture from AMD. https://chipsandcheese.com/2024/07/26/zen-5s-2-ahead-branch-predictor-unit-how-30-year-old-idea-allows-for-new-tricks/ Having a bootstrappable build is definitely not an easy feat! It is something necessary to do though for trust and for longevity reasons. Interesting experiment showing that BLOBs in a database can be a good alternative to individual files on a filesystem in some contexts. This is not said enough but this is indeed a very useful tool. There is a few tricks I didn’t know in this list. Very neat shader for a procedural earth simulation. The breakdown is interesting covering the tricks being used in this shader. Definitely not as fashionable as the kubernetes craze. This gives very interesting properties that multi-tenant applications can’t really provide. The article is nice as it lays out properly the pros and cons, helps make the choice depending on the context."
