full_description = "Tags: web-review, documentation, performance, design, team, python, memory, funny, architecture, latency, databases, copyright, values, foss, storage, management, community, semantic, programming, interviews, law, tests, art, colors, machine-learning, safety, linux, ai, kernel, politics, hiring, tech, learning, criticism, protocols, oauth, rust, cognition, security, craftsmanship, data-visualization, organization, language, library, sandbox, surveillance, advertisement, communication, privacy, gpt On my way to Akademy, looking forward to meeting people there. Even though I’m traveling with spotty Internet access for now, let’s not loose good habits. Here is my web review for the week 2024-36. This is really bad news… Clearly the publishers cartel would try to outlaw libraries if they were invented today. There, now this seems like a real thing… your phone recording you while you’re not aware for advertisement purposes. Nice surveillance apparatus. Thanks but no thanks. An excellent essay about generative AI and art. Goes deep in the topic and explains very well how you can hardly make art with those tools. It’s just too remote from how they work. I also particularly like the distinction between skill and intelligence. Indeed, we can make highly skilled but not intelligent systems using this technology. Does a good job listing the main myths the marketing around generative AI is built on. Don’t fall for the marketing, exert critical thinking and rely on real properties of those systems. Interesting analysis. For sure the Rust for Linux drama tells something about the Linux kernel community and its complicated social norms. Politics in the Linux kernel can indeed be tough. The alternative path proposed to the Rust-for-Linux team is indeed an interesting one, it could bear interesting results quickly. Indeed this is a much better visualization. It shows quite well how the Python programmers pool is growing. Nice post explaining the basics of OAuth. If you wonder why the flow seems so convoluted, this article is for you."
