full_description = "Tags: web-review, SIMD, tech, capitalism, deportation, ecology, generator, tools, fake-news, surveillance, optimization, medieval, science, b-tree, amazon, processes, performance, craftsmanship, map, google, social-media, facebook, gafam, algorithm, battery Yet another lovely company… very lucrative business, so it’s unsurprising it attracts fat cats with dubious values like Amazon. The big platforms clearly created the incentives for clickbait actors to rise… And then political actors entered the scene. Definitely a welcome move… will need to be enforced of course. Let’s hope it won’t turn into yet another text without teeth. https://repair.eu/news/the-european-parliament-carves-the-path-to-removabe-and-replaceable-batteries/ Really cool optimizations for B-Trees. Once the layout is reworked this is a neat way to use SIMD as well. A good reminder that there is not a one size fits all solution in the tech world. Also be skeptical of the silver bullets that “obviously” everyone should use. Project context matters above all. Very cool tool to generate random maps, go all the way to per-city generators through this: https://watabou.github.io/city-generator/ Definitely a fascinating research. It’s surprising how little we know about the topic… the article shows how difficult it is to collect data about it in the first place."
