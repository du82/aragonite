full_description = "Tags: web-review, programming, web, microsoft, mozilla, routing, complexity, nvidia, ai, optimization, framasoft, internet, python, copyright, google, javascript, arm, tech, peertube, security, git, public-domain, antitrust, machine-learning, sourcehut https://www.neowin.net/news/microsoft-says-its-own-edge-browser-is-more-trustworthy-than-so-2008-google-chrome/ https://www.ftc.gov/news-events/press-releases/2021/12/ftc-sues-block-40-billion-semiconductor-chip-merger A reminder of why machine learning is currently so power hungry. It’s in fact (still) highly inefficient. https://theconversation.com/it-takes-a-lot-of-energy-for-machines-to-learn-heres-why-ai-is-so-power-hungry-151825 Or why we should keep an eye on transfer learning. This is one of the promising way to get a more efficient machine learning process. Might come with its own challenges in methodology complexity though, it’ll likely be easy to do it wrong and to notice that too late. Despite the problems with Mozilla’s politics and funding, this is the main reason why I use Firefox as my main browser (even on my smartphone). We can’t have a monopoly on which organization influence the web standards… unfortunately we get fairly close from that position. Really nice to see PeerTube making so much progress. Hope we’ll see more and more nice content hosted on PeerTube instances. This is a good way to get into how Javascript engines try to optimize the code thrown at them. It’s definitely not an easy job with Javascript… Good reminder on why mypy is an essential mitigation to use when dealing with Python. This avoids some quite common mistakes."
