["https://ervin.ipsquad.net/blog/2021/04/30/web-review-week-2021-17"]
title = "Web Review, Week 2021-17 - ervin"
description = "Website Description"
full_description = "Tags: web-review, css, hiring, agile, product-management, cors, surprising, science, cloud, tech, leadership, internet, frontend, hr, ai, web, history, management, free-software, metadata, http A bit too much on the advertising tone for my taste. But still there is a good point trying to get out of that piece: we need more independent cloud providers. I wish companies would stop running to the big ones by default. Or why you need proper product management: it requires skills and time. Otherwise it’s just botched and product gets developed in “firefighting mode” all the time. This article is a good primer on a few technics for grooming the product backlog. Very good piece, I agree with all the advices in there. That being said, it’s often difficult to apply. This is because it requires quite a lot of self-awareness from teams and not everyone is willing to work on themselves to realize their weaknesses in the first place. Also I’d stress one point which I don’t find pushed enough in that article. Very often you want persons who might not make your team stronger now but will over time. This even works better in my experience. Hiring is a bit like gardening in a way: it’s also about keeping in mind how the people joining the team will bloom in that particular context and how it’ll improve the landscape. Nice collection of effects which can be done purely using CSS. Really shows that JavaScript is often over used. Never trust a beaver! More seriously this is a good reminder of how fragile our infrastructures can be. This is a good resource explaining most of what one needs to know about Cross Origin Resource Sharing (CORS). As usual in such articles, the historical bits are particularly insightful. Interesting question, and luckily the top answer is coming from someone who put in the work and memory to do a thorough history recap. Interesting stuff. https://superuser.com/questions/784978/why-did-the-ietf-specifically-choose-192-168-16-to-be-a-private-ip-address-class"
