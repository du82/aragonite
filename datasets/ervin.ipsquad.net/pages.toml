["https://ervin.ipsquad.net/blog/2023/04/14/web-review-week-2023-15"]
title = "Web Review, Week 2023-15 - ervin"
description = "Website Description"
full_description = "Tags: web-review, memory, physics, automotive, foss, messaging, astronomy, embedded, ai, gpt, history, video, postgresql, animation, internet, networking, c++, criticism, tests, presentation, can, architecture, programming, science, business, rabbitmq, drawing, java, meetings, team, engineering, git, sharding, databases, tech, management, security, conference, complexity, machine-learning, tools I don’t necessarily agree with the fine points in the proposed actions. That said the diagnosis is unfortunately very true I think. I’m still doubtful about it but maybe I’m wrong so a counterpoint to my own opinions. Of course this is a purely productivity standpoint in here which overlooks my main concerns with how this is currently deployed and used. This is important. We need truly open generator models. This can’t be left in the hands of a few with only API access, especially since they lack basic transparency. https://www.databricks.com/blog/2023/04/12/dolly-first-open-commercially-viable-instruction-tuned-llm Excellent piece which summarises the big design decisions behind the Internet. It’s very didactic, also highlights the flaw toward the end. This is reference material. https://m-cacm.acm.org/magazines/2023/2/268956-extracting-the-essential-simplicity-of-the-internet/fulltext This is an incredibly informative deep dive regarding a new attack on CAN buses. Also proposes potential fixes. Let’s see how car makers deal with it. They were probably using RabbitMQ for the wrong scenario in the first place. That said it’s a good reminder that sometimes a simpler architecture is what you want and it can bring benefits. Need to update your Java knowledge because it evolved quite a bit? Here is a little list of the features to focus on. https://blog.microideation.com/2023/04/05/supercharge-your-java-development-must-know-advanced-features-for-every-java-dev/ I’m not necessarily convinced by all of those. Still there are interesting ballpark numbers I didn’t have on my radar as far as management goes."
