description = "Website Description"
full_description = "Tags: web-review, law, architecture, quality, engineering, infrastructure, dns, design, autonomy, machine-learning, unix, browser, programming, 3d, tools, git, politics, consistency, protocols, ai, tech, command-line, tech-lead, blender, standard, privacy, blog, organization, leadership, developer-experience, france, decision-making, debugging, web, security, tdd, bug, trust, optimization, craftsmanship, science, google, system, rust, management, productivity, surveillance, json Welcome in France, a country scared of its own population where the police uses facial recognition illegally. But don’t worry, we can expect attempts to make it legal in the coming months or years instead of addressing the problem. Will it make it less shameful? I don’t think so. https://disclose.ngo/en/article/the-french-national-police-is-unlawfully-using-an-israeli-facial-recognition-software This is going to be interesting to see how this new regulation unfolds. Its impacts are well beyond just Microsoft. https://arstechnica.com/gadgets/2023/11/europeans-can-soon-strip-bing-edge-other-microsoft-cruft-from-windows-11/ https://www.domaintools.com/resources/blog/the-use-cases-and-benefits-of-svcb-and-https-dns-record-types/ A balanced view, that’s refreshing. Indeed we see too many “let’s call the OpenAI APIs and magic will happen”. This is very short sighted, much better can be done. Half a rant but interesting… Why are people making popular solutions to problems they’ll never have? Just because it’s been released by Google? Definitely looks interesting. Might be a good way to uniformize developer environment management across projects. This is a well balanced view on the Rust ecosystem as of today. It highlights fairly well where it shines (safety, predictability, bugs found early) but it also mentions the current issues linked to its maturity. Looks like a very good tool for handling JSON files. Might come in handy next to jq… maybe it’ll replace jless. Ever wondered how git implements cherry-pick and revert? Here are a good way to understand them. Also explains what is the 3-way merge git uses widely."
