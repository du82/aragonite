["https://ervin.ipsquad.net/blog/2022/02/04/web-review-week-2022-05"]
title = "Web Review, Week 2022-05 - ervin"
description = "Website Description"
full_description = "Tags: web-review, agile, surveillance, facebook, performance, advertisement, hiring, hr, refactoring, gdpr, tech, bizarre, kde, webassembly, cognition, craftsmanship, settings, science, interviews, reading, rust, xp, web, tests, privacy, design, low-tech, gafam, amazon, javascript, mob-programming, attention-economy, programming The beginning of the end for this one? Too early to tell and so big it can limp along for a long time. As one could suspect the moves toward VR are to try to counterbalance their current situation which was clearly to come… still can it be their new cash cow? Hard to tell. If only it means that the war for attention and the accompanying surveillance is likely to rage on even more. https://imlefthanded.com/2022/adblocking-people-and-non-adblocking-people-experience-a-totally-different-web/ If you didn’t try Kate for a while… the next release in the spring will be a good time to try it again. Good reminder that the words we use matter. Fuzzy terms like “clean” indeed hide various dimensions to look at the code and the tradeoffs we make. Interesting musing on the skills required, why it’s actually hard to apply them… clearly it’s because you never find a real place to learn them so that ends up being on the job. Interesting use of WebAssembly for fast and very portable code. Also especially interesting is the care in the move to the new software architecture. I like this position. There’s been too much of a move to “kill all the settings!” in some products. Some of them definitely make sense, and the “on boarding” point of view mentioned here makes sense. https://www.askamanager.org/2022/01/the-new-hire-who-showed-up-is-not-the-same-person-we-interviewed.html Unsurprising following previous findings with ebooks. It’s interesting to see the potential reasons of why this happens though… the link with respiration is fascinating. Now it’s early days and a small study so usual disclaimers apply."
