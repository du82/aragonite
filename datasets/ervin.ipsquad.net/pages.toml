title = "Web Review, Week 2024-29 - ervin"
description = "Website Description"
full_description = "Tags: web-review, performance, leak, memory, facebook, privacy, agile, browser, tests, engineering, ecology, community, tech, pattern, sqlite, project-management, habits, career, hardware, gpt, git, criticism, tools, improving, databases, funny, social-media, product-management, safety, coaching, leadership, computation, economics, django, mozilla, ai, work, gpu, c++, optimization, backend, law, security, codereview, foss, twitter, history, life, estimates, management, storage, machine-learning You’d expect Mozilla to know better. This is disappointing, they’re no living up to their responsibility. The European Commission starts showing it’s muscles. Twitter is an obvious one to pursue since it became the X cesspool. I’m rarely on the side of a Goldman Sachs… Still this paper seems to be spot on. The equation between the costs (financial and ecological) and the value we get out of generative AI isn’t balanced at all. Also, since it is stuck on trying to improve mostly on model scale and amount of data it is doomed to plateau in its current form. Or examples of the collapse of a shared reality. This has nothing to do with “social” media anymore. Very nice investigation in any case. Wow! This is a really bad data breach. Apparently related to the recent data theft on the Snowflake end. Interesting approach to building a new code review system. I somehow doubt it’ll get traction unfortunately but it has nice ideas baked in. Looks like an interesting library to build portable GPU compute workloads. Cleverly tries to leverage WebGPU. A paper listing patterns to reduce latency as much as possible. There are lesser known tricks in there. Definitely this. C++ isn’t going away anytime soon. Rewrites won’t be worth it in important cases, so improving the safety of the language matters. Django doesn’t always generate the migration you’d expect. Read them before going to production. Also it’s fine to adjust them. A bit long and a couple of mistakes when pointing out the flaws of story points. Still, it’s definitely a worthwhile read. Quite a lot of the criticism of story points is warranted and the proposed approach based on queue theory is welcome. This is stuff you can find in Kanban like approaches and mature XP."
