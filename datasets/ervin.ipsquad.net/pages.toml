["https://ervin.ipsquad.net/blog/2024/06/07/web-review-week-2024-23"]
title = "Web Review, Week 2024-23 - ervin"
description = "Website Description"
full_description = "Tags: web-review, benchmarking, cpu, foss, gpt, python, game, criticism, filesystem, management, strategy, machine-learning, tech, programming, science, social-media, tools, art, hardware, safety, 3d, networking, research, data, distributed, vulkan, portability, vision, reliability, data-visualization, security, data-science, ai, cryptography, history Another cruel reminder that basic reasoning is not to be expected from LLMs. Here is a quote from the conclusion of the paper which makes it clear: “We think that observations made in our study should serve as strong reminder that current SOTA LLMs are not capable of sound, consistent reasoning, as shown here by their breakdown on even such a simple task as the presented AIW problem, and enabling such reasoning is still subject of basic research. This should be also a strong warning against overblown claims for such models beyond being basic research artifacts to serve as problem solvers in various real world settings, which are often made by different commercial entities in attempt to position their models as a strong mature product for end-users. […] Observed breakdown of basic reasoning capabilities, coupled with such public claims (which are also based on standardized benchmarks), present an inherent safety problem. Models with insufficient basic reasoning are inherently unsafe, as they will produce wrong decisions in various important scenarios that do require intact reasoning.” Interesting critique of this new platform… it’s the beginning of the hype cycle but will probably exhibit the same decay phenomenon than other platforms. https://www.davidrevoy.com/article1032/a-critique-of-caraapp-the-no-ai-instagram-and-artstation-copycat-child The more releases out there the more vulnerabilities are (and could be) discovered. Some actions are necessary to get things under control properly. A good reminder of everything which might go wrong when connectivity is bad. Most tools let you down in such a case. Interesting use of cryptography without a security concern. It’s more about safety and ensuring something wasn’t missed by mistake."
