full_description = "Tags: web-review, management hr, tech, memory, programming, rust, python, wifi, pairing, performance, cpu, security This is a very interesting deep dive in how branch predictors work. Also comparing timing profiles between different families of CPUs. Interesting piece covering: how a memory allocator works, why it can be slow, how to use it the best way possible and how to pick an allocator for your project. The use of PyO3 keeps being very interesting for Rust / Python interoperability. The porting experiment in this article is well done and shows well the strength and weaknesses of both. Like everything, Pair programming also has a dark side. It’s obviously more potent if you do it too much. Very insightful view on the differences between praises and positive feedback. It’s indeed very easy to conflate the two by mistake."
