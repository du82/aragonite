description = "Website Description"
full_description = "Tags: web-review, networking, c++, shader, 3d, metrics, tools, http, machine-learning, monopoly, debugging, physics, programming, codereview, version-control, ai, benchmarking, postgresql, git, databases, google, tech, java, javascript, law, type-systems, quic, engineering, productivity, neural-networks, mozilla, gpt, quality, typescript, safety Exciting new type of neural networks. There are limits to use them at large scale for now. Still, they have very interesting properties like the interpretability. And also, they tend to give similar performance to traditional neural networks for a smaller size. Looks like the US Department of Justice is back pushing for antitrust trials. This is likely a good thing, will it go all the way to breaking down some of the big tech companies? I doubt it but it’d probably be welcome. Interesting guesses at what could change with the Google ruling. It doesn’t look too good for Mozilla. Clearly there’s a silent transition going on. It’s not necessarily bad that it’s on-going without making too much noise. This is a very important distinction to keep in mind. It’s one of those source of bad mistakes in C++. Enum classes keep being improved. Nice features are already available, more might be coming through reflection in C++26. The TypeScript type system is really a beast. There are little known features in this, looks definitely like one of them. I like the idea of getting all the review comments back into Git once things are merged. This works offline, makes you less dependent on the forge for historical data etc. Now we’d probably need to have the notes feature easier to use somehow. Maybe we could store metrics about the code in the history as well? This would indeed reduce vendor lock-in. This tool makes it easy. Unsurprisingly seems built upon git notes. Aren’t we loosing something if we focus on productivity numbers too much? A good reminder that intrinsic motivation is an important driver in people behavior. I wouldn’t throw all the metrics out of the door but they’d better be a limited amount and they’d better be informative rather than objectives."
