["https://ervin.ipsquad.net/blog/2021/08/06/web-review-week-2021-31"]
title = "Web Review, Week 2021-31 - ervin"
description = "Website Description"
full_description = "Tags: web-review, design, optimization, tech, amazon, python, collaborative, ecology, waste, remote-working, funny, management, smartphone, javascript, psychology, interviews, html, pollution, economics, react, frontend, git, surveillance, vuejs, profiling, web, statistics, hr, npm, todo, security, benchmarking, machine-learning, exercising, supply-chain, ai This is a bad trend. One needs a properly setup space for remote work. This obviously raises questions of real estate and money. I wonder how far employers would go to support remote working there… Buying a chair might not be enough. Good reminder of the limits of machine learning. There’s no clear path from machine learning to more general intelligence. This article doesn’t account for emergence effects though. They are a possibility but that’s a long stretch from what being exhibited so far: it’s “just” statistics. https://www.bloomberg.com/news/articles/2021-07-30/amazon-given-record-888-million-eu-fine-for-data-privacy-breach No solution in sight for plastic waste… The best waste is still the one which is not produced in the first place. Interesting exploration of to do lists systems and our relationship to them. It’s complicated and it’s in good part because of empathy towards ourselves and our relationship to time. Long and nice article about collaborative editing algorithms and their implementation. The problem space is tough, benchmarking is hard, profiling as well and optimizing even more so. Very thorough. This is welcome changes in the git cli interface which I noticed… that said I’m already so used to the old method it’ll take me some time to adjust. This ecosystem keeps baffling me… How come there are so little checks on what can get published or how the command line process parameters. https://www.bleepingcomputer.com/news/software/empty-npm-package-has-over-700-000-downloads-heres-why/ Another couple of attempts at supply chain attacks. This time in the Python ecosystem. The skill level of those attempts isn’t high though."
