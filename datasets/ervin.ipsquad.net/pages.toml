["https://ervin.ipsquad.net/blog/2024/08/23/web-review-week-2024-34"]
title = "Web Review, Week 2024-34 - ervin"
description = "Website Description"
full_description = "Tags: web-review, history, web, agile, python, javascript, benchmarking, tech, cpu, gpt, c++, performance, design, codereview, physics, copyright, simd, ux, interviews, product-management, tools, open-access, ai, hr, funny, linux, frontend, machine-learning, research, privacy, book, leak, security, programming, mozilla, semantic, criticism, kernel, ip, debugging, simulation, markov-chains, memory, networking It’s good to see major institutions like this get out of contracts with scientific publishing companies. Those unfortunately became mostly parasitic. Open access should be the norm for research. Since they unfortunately turned on private attribution by default (why? Mozilla, why?). Here is an easy automated way to turn it off. With all those bots and scripts crawling the Web, some of the semantic web vision got silently implemented. Interesting musing. The predictability in tone doesn’t make for very funny content indeed. Also as a side-effect this might help people remember that Markov chain are a thing and much less expensive. Scary thread… developers should know better than do this and ship it on devices around the world. Their data is now anyone for the taking and users’ privacy can’t be ensured. Be sure to pick the right behavior model when you make a benchmark. Otherwise you might just measure the wrong thing. A little refresher about std::ref and std::cref. They come in handy sometimes, but also if you don’t realize you need them you’ll generate more copies than necessary. SIMD is hard to use, not all problems can apply to it. But when they can, the performance gain can be great. Looks like there’s another contender for package management for Python. This is sooo fragmented now… this one is compelling though. There are many ways to create a memory leak in Javascript. Here is a good list of the things to pay attention to. Interesting series about the rise of the javascript frontend framework, the bad practices which came with them and the very real impacts on the users. There are indeed better ways."
