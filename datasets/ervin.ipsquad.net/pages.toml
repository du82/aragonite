["https://ervin.ipsquad.net/blog/2024/11/29/web-review-week-2024-48"]
title = "Web Review, Week 2024-48 - ervin"
description = "Website Description"
full_description = "Tags: web-review, dns, ai, programming, twitter, self-hosting, productivity, metaprogramming, rust, tech, ecology, water, community, algorithm, type-systems, gpt, java, garbage-collector, politics, fediverse, law, xslt, memory, business, social-media, bluesky, kde, documentation, machine-learning, craftsmanship, decentralized, design, complexity, security, tests, safety, privacy, copyright, gdpr, c++ Can you see this kind of models getting abused quickly? Clearly it says something about the tech industry wanting to reduce costs. Technology isn’t neutral. It’s impossible to ignore the ideologies of the moguls funding or leading big tech companies. We can’t afford to trust their promises. https://www.404media.co/xs-objection-to-the-onion-buying-infowars-is-a-reminder-you-do-not-own-your-social-media-accounts/ https://arstechnica.com/tech-policy/2024/11/tech-problems-plague-openai-court-battles-judge-rejects-a-key-fair-use-defense/ The water problem is obviously hard to ignore. This piece does a good job illustrating how large the impact is. https://www.thetimes.com/uk/technology-uk/article/thirsty-chatgpt-uses-four-times-more-water-than-previously-thought-bc0pqswdr Definitely this. Sure we should seek for decentralization, but this is not going to happen or be effective without regulation. Ensuring privacy is a legislative and political problem as much as a technical one. A long and comprehensive analysis of Bluesky. Also brings interesting critiques about both Bluesky and the Fediverse. Clearly Bluesky as of today is not effectively decentralized and shouldn’t be considered as such. The debate about how BlueSky and decentralisation or federation continues. It’s nice to see how civilized the people involved are. This is how we can make progress. Since the documentation is severely lacking in this area, this ends up being a nice how to. I wish we’d have more like this in the official documentation. It’s clear that a split is forming in the C++ community on how to evolve the language. Could it lead to a full fledged divorce?"
