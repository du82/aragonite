["https://ervin.ipsquad.net/blog/2021/03/05/web-review-week-2021-09"]
title = "Web Review, Week 2021-09 - ervin"
description = "Website Description"
full_description = "Tags: web-review, facebook, tech, biology, amazon, monitoring, pandas, security, surveillance, authoritarianism, zoom, medecine, nginx, gdpr, google, sociology, data-science, gafam, linux, privacy, vaccines, activism, india, statistics, rust, ecology The usual suspects from Silicon Valley silently complying (again…) with the demands of a government becoming more and more authoritarian… This time to crackdown on labor and climate activists in India. Those companies really lack any form of moral centre, as long as there’s money to be made from surveillance and public influence. A nice list of easy mistakes one can make in their Nginx configuration opening the door to security issues. Sitting on a massive trove of data, prioritizing growth over all else and driven by hubris… What could possibly go wrong? Well not knowing what data you really have and risks of breaches. Nothing much. ;-) Interesting comparison even though the conclusion is slightly unsurprising: Pandas is slower but more convenient, Rust is fast, consumes less memory but more work is involved. At least this gives a few indications on what type of APIs could be added to Rust to ease some things. It also indicates that Pandas can be great to develop the pipeline with then a switch to Rust when this needs to be optimized for higher volumes of data. Now this is kind of a surprising move… At least that shows that when some strong regulation comes around even behemoths need to move with it. I guess now let’s wait and see for an actual implementation, the devil is often in the details. I mean, in the end it doesn’t mark the end of profiling just maybe reduction of the ability to identify a particular person. And we know the root cause of most current problems is the profiling and the impact on personal behavior which goes with it. This is unlikely to go away. So talking about the devil being in the details… That confirms profiling is still very much in the picture (unsurprisingly) but more disturbing:"
