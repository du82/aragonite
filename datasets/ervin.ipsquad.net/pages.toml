full_description = "Tags: web-review, data, data-science, fediverse, sqlite, democracy, security, accessibility, product-management, html, embedded, complexity, databases, systemd, remote-working, tech, networking, xmpp, ux, c++, web, decentralized, tools, low-tech, frontend, management, protocols, syncing, governance Looks like there are people out there to get Tor relays down… and they found a smart networking trick I’d expect to not work anymore. Interesting dimensions to use when classifying syncing solutions and to see which ones will meet your constraints. This is a good point. systemd is kind of turning into a monoculture, but what are we loosing? Indeed, right now things could be better on deeply embedded systems (I insist on the “deep embedded” here which is often more limited in resources). Unlike the author I think they could be improved and they don’t quite apply to a good chunk of recent embedded platforms though. If you wonder how the protocol is designed and how the actual implementation works, this is a nice introduction. Clearly it’s helped by the size of that program which is fairly small. Still, C++ improved in recent years. The problem is that we tend to stick too much to the old constructs we already know and that things keep piling up but nothing is removed. Each has a use, they shouldn’t be conflated. It makes for poor user experience and accessibility otherwise. A bit biased toward stable product teams only. Still, there are good tips which are more widely applicable here. This gives a good idea of the management of a distributed team of remote workers."
