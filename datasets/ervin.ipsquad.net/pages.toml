["https://ervin.ipsquad.net/blog/2023/06/09/web-review-week-2023-23"]
title = "Web Review, Week 2023-23 - ervin"
description = "Website Description"
full_description = "Tags: web-review, ar, tools, command-line, language, type-systems, design, patents, automation, law, python, xr, ux, architecture, pyright, vr, tech, celery, linux, packaging, community, flatpak, rust, tests, project-management, complexity, frontend, config, debugging, apple Probably the best analysis of the new Apple device I’ve seen so far. Focuses more on the design of the user experience and compares with the strategy behind other similar devices. There are likely a lesson or two to be drawn from it. A good reminder that Flatpak is no silver bullet. It’s a bit of a rant at times still it has some good points in particular the security implications are not always properly conveyed to the users. Some thinking might be required regarding what’s lost compared to “traditional” packaging approaches. There’s a new grep alternative in town. Looks really fast and has an interesting interactive mode. Definitely something to check out. Very interesting case full of lessons. Of course, increasing the complexity of the system overall can lead to such hard to find issues. It’s also a tale into how seemingly innocuous settings can interact in unexpected ways. I also like the lessons learn pointing to the fact that you can and should debug even the systems you use through abstractions, diving into the code is almost always a good thing (even if in this particular case it wasn’t strictly necessary in the end). And last but not least it shows the tension between mastery and automation… the more you automate the least you master the system, and at the same time this automation is necessary for building resilience in the system. Interesting post, highlights why it’s better when languages are designed in a more community fashion (make sure to read until the conclusion). At least in term of popularity it seems to help. This will hopefully solve most of the oddities in the generic types syntax of Python. Will be available with CPython 3.12 and will need support from type checkers of course."
