["https://ervin.ipsquad.net/blog/2024/04/12/web-review-week-2024-15"]
title = "Web Review, Week 2024-15 - ervin"
description = "Website Description"
full_description = "Tags: web-review, machine-learning, infrastructure, management, debugging, tls, writing, zsh, open-access, copilot, meetings, java, repair, javascript, gpt, craftsmanship, tech, self-hosting, browser, archive, cryptography, cloud, multithreading, leadership, documentation, reliability, criticism, complexity, scam, object-oriented, 3d, cost, programming, architecture, c++, pairing, shell, homelab, research, scripting, portability, web, cognition, hardware, empathy, security, performance, tools, deployment, ecology, ai, history, energy, sound, gpu, certificates Turns out I managed to squeeze reading here and there and have enough content for a regular review… So let’s go for my web review for the week 2024-15. Another type of devices where clearly they could be repairable and batteries could be swappable if manufacturers would put care in the design. At least, Fairphone is showing it’s doable. https://arstechnica.com/gadgets/2024/04/fairbuds-take-the-fairphones-repairability-down-to-seemingly-impossible-size/?comments=1 Interesting history behind the company which was instrumental in pushing computer graphics forward during its time. More work about eco-design of software. This is definitely welcome. I found this work a bit weak on the state of the art and the interview parts (10 people in the same company). But the field is so nascent that it’s to be expected I guess, PhD students have to do with what they have access to. Unsurprisingly this shows a great lack of proper tools to tackle the measurement problem. This thesis shows interesting prospects to reduce variations in measurements though, some of the proposed guidelines might help but cannot offset the hardware heterogeneity completely… The parts focusing on practical advices around Java use and deployment are interestingly easy to apply though. You need to take into account the context of your application to make the right choices of course. Interesting take on why people see more in LLM based systems than there really is. The parallels with psychics and mentalists tricks are well thought out."
