full_description = "Tags: web-review, breach, data-science, surprising, iot, python, backup, science, energy, legal, raspberry-pi, rust, supply-chain, docker, templating, wood, mypy, intrusion-detection, astronomy, latex, go, surveillance, security, css, github, automotive, recovery, electricity, tech, markdown, history, data-visualization, funny, embedded, monitoring This looks like a very interesting board to play with. It’s a bit on the pricey range but other than that… Nice specs. That shows one of the issues of the kind of centralization IoT as currently done pushes for. Breach in one company? Plenty more people impacted… Best part of the article is probably the stated motives: “Kottmann said their reasons for hacking are “lots of curiosity, fighting for freedom of information and against intellectual property, a huge dose of anti-capitalism, a hint of anarchism – and it’s also just too much fun not to do it.”” https://www.bloomberg.com/news/articles/2021-03-09/hackers-expose-tesla-jails-in-breach-of-150-000-security-cams Always fascinating when astronomers spot an event we suspected possible but so rare that it wasn’t really witnessed. It was only a matter of time before regulators tried to catch up with car makers regarding self driving cars. Is it the beginning of a new trend there? https://arstechnica.com/cars/2021/03/federal-investigators-blast-tesla-call-for-stricter-safety-standads/ Interesting use of templates for markdown based legal documents. Probably got a few ideas on how to use this… Ah, finally looks like we got an interesting dataframe crate in the Rust world. Performances seems nice too. To be seen how it behaves in practice. The explanations of how it’s designed are interesting in any case. :-) After the disaster in the OVH centers, a good reminder of a proper backup strategy that should be applied as soon as you manage some data. Somewhat surprising, never looked at ketchup this way but indeed it’s a fair non-newtonian fluid. I guess it didn’t occur to me because I user and encounter it too seldomly. :-)"
