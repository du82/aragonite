["https://ervin.ipsquad.net/blog/2022/07/01/web-review-week-2022-26"]
title = "Web Review, Week 2022-26 - ervin"
description = "Website Description"
full_description = "Tags: web-review, business, codereview, python, remote-working, tech, surprising, censorship, github, virtualization, hr, scifi, facebook, management, refactoring, architecture, copyright, product-management, data-oriented, machine-learning, politics, gitlab, philosophy, java, type-systems, engineering, git, craftsmanship, programming, licensing, interviews, databases Let’s go for my web review for the week 2022-26. It’ll be the last one for a little while, I’m taking an extended break, other reviews will follow after that. Their moderation rules keep being opaque, random and then… dangerous. Especially telling is this quote: “Ukrainians get to say violent shit, Palestinians don’t. White supremacists do, pro-choice people don’t.” They privately get to pick who they like or not. There’s really a problem with GitHub overall… and the Copilot move is definitely worrying. Not Copilot by itself really but how they just don’t want to tackle the questions it raises. It’s great to see GitLab be such a public and outspoken champion of remote work. Let’s hope more organizations walk the path. https://fortune.com/2022/06/21/gitlab-ceo-remote-work-just-work-careers-success-leadership-pandemic-sid-sijbrandij/ Looks like an interesting tool to port code to newer APIs… too bad this seems to be very much Java focused only. OK, this looks like an interesting release, next to the performance improvements there are quite a few neat new features as well. Good set of advices around dicts. This is Python centric but some of it applies to other languages as well. Mind the lack of anti-corruption layer. Nice primer of important characteristics of databases and transactions. With doodles so I’m biased. ;-) This explains fairly well the reason why I spend so much time doing git rebases or push for more readable history in branches submitted for reviews. It helps a lot with the reviews and with finding root causes of issues later on. Very good set of advices in my opinion on how to prioritize product work in an organization. It very well accounts for the natural tension between sales/marketing and product/engineering."
