["https://ervin.ipsquad.net/blog/2022/09/16/web-review-week-2022-37"]
title = "Web Review, Week 2022-37 - ervin"
description = "Website Description"
full_description = "Tags: web-review, book, bike, safety, qrcode, barcode, tdd, microsoft, posix, failure, self-hosting, psychology, tech, business, management, agile, 3d, information, quality, metrics, scrum, library, tests, organization, travel, urbanization, project-management, unix, team, godot, system, surveillance, privacy, postmortem, security As if we still need people to be convinced… apparently we do. So just in case we need a well built argument about it, this post does it. So they’re seriously not using the system credential management to store these… I mean OK if your machine is compromised there’s not much you can do. But for a laptop being stolen for instance it’d make sense for such tokens to be protected by default and require a passphrase to be read by a local application, otherwise you could just easily recover it from the disk if it’s not encrypted. https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/ This is a welcome list of options to clarify what we’re talking about when we talk about “self-hosting”. It’s not a single concept but a range of approaches. Nice explanation on how QR codes are made. The most gritty details are left out so it’s easy to follow. Very interesting piece. Goes in length about the UNIX history and the evolution of POSIX. It also highlight its limitations and where the design needs to evolve. Some good points in this list although I’m not in full agreement with everything (especially the one about the lack of usefulness for TDD). The importance and the impacts of the tooling is often underestimated indeed. The last two random opinions about mocking and overtesting are very much true as well. Lots of truth in there. Indeed the proposed “practices” when they get in just kill the promises of things like Scrum. A good reminder about the impacts of Goodhart’s law, or even simply of measuring the wrong thing. I like the conclusion overall: it’s fine to measure things but that shouldn’t be the center of the decision taking and conversations need to take a larger role into it."
