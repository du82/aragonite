full_description = "Tags: web-review, benchmarking, privacy, machine-learning, ai, blog, processes, kde, foss, pandas, raii, communication, tech, usability, business, performance, wayland, history, resources, video, programming, medecine, criticism, ux, safety, learning, polling, design, sustainability, sociology, microsoft, gpt, tools, 3d, python, self-hosting, security, dns, command-line, unix, project-management, quality, craftsmanship, ethics, browser, social-media, web, portability, debugging, graphics, css, vision, redhat, vim, compiler, data, polars, opencv, animation, c++, noise Excellent piece from Cory Doctorow, it’s a good summary of where the real debates about AI should be… and it’s nowhere near the OpenAI soap opera. https://www.theguardian.com/global-development/2023/nov/27/uk-school-pupils-using-ai-create-indecent-sexual-abuse-images-of-other-children That’s the beginning of interesting benchmarks for AI assistants. Still a long way to go but this is a good start. There was definitely something we lost from the early days of the web. It was not perfect, far from it, but some of that spark is missing. How the medical sector is struggling with badly designed software. Also important to note how security is just getting in the way of nurses and doctors jobs. Looking forward to Encrypted Client Hello to be widely available. This was no more clear text SNI, and privacy should be really ensured when browsing the web. Seen this a bit too often indeed. When people learn about std::move they tend to sprinkle it too much preventing proper optimizations. Its use should be fairly limited usually. Interesting dive on the limits of destructors and when they’re called. This can have implications on how programs are stopped. If you wonder what’s happening on the JIT front in CPython land, here is a talk explaining what’s coming in 3.13. Interesting terminal oriented tool to interacting with LLM. Let you choose to self-host or run locally. I keep being baffled at how