["https://ervin.ipsquad.net/blog/2024/01/12/web-review-week-2024-02"]
title = "Web Review, Week 2024-02 - ervin"
description = "Website Description"
full_description = "Tags: web-review, type-systems, self-hosting, hiring, book, shader, email, tls, law, messaging, git, surveillance, vulkan, version-control, browser, craftsmanship, battery, windows, filesystem, tech, c++, web, teaching, python, refactoring, microsoft, docker, tools, facebook, android, webmention, hr, management, attention-economy, blog, optimization, culture, ssh, product-management, security, jit This is in part why I started my web review… maybe I should start a kind of blogroll, or maybe have links to websites I like straight on my front page. https://www.digitalcameraworld.com/news/this-holographic-camera-turns-any-window-into-an-invisible-camera Looks like Microsoft is really catching up fast for its surveillance apparatus to be on par with Google and Meta. Very welcome complaont, Meta is trying to workaround the GDPR to increase paid accounts. Can only hope they get fined and that this shady practice disappear (they’re not the only ones doing this). Looks like a nice way to ease the use of webmentions. Also comes with a command line option not relying on third party hosted service apparently. Fascinating script which jumps over SSH servers in several hops and replicates itself without a file upload. Some of that certificate chain validation is troublesome… in Chrome based browsers it’s even truly insane. If you’re wondering where your battery power goes… this is a nice list of measures for various clients on Android. It looks like XMPP is still hard to beat. Looks like an interesting tool if you’re dealing with docker image. This kind of analysis is definitely missing from docker itself. Interesting proof of concept to compile C++ into shaders. This reminds CUDA a bit without being tied to a given GPU brand. Interesting trick even though I always cringe at such difference of behavior between runtime and “compile” time. Want to better understand the JIT approach introduced in Python 3.13, this is a good little article. This JIT is a first step towards more optimizations."
