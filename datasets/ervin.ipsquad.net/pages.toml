full_description = "Tags: web-review, django, management, frontend, change, javascript, framasoft, scam, improving, flatpak, linux, tech, git, cryptoassets, security, email, html, smarthome, complexity, iot, web This is a good summary of why I think those crypto currencies are mainly a scam and used to entertain a perpetual delusion on their use. This is a bit of a rant but that summarizes quite well why I fail to fall in love with snap, flatpack and the likes. Everytime I tried to use one of those I ended up with GBs of extra runtime to deal with and the security arguments are frankly debatable… I wish the LSB wasn’t defunct. Always wanted to try this particular way of dealing with patches. But none of the projects I contributed to so far work in that mode. Interesting way to combine Django and a couple of JS based tiny frameworks to make simpler frontends. Good summary on why overengineering is bad, why it happens and how to try to prevent it. We deal with complexity we better make sure there’s no undue complexity in our systems. Interesting musing about change management: don’t come up with something too perfect if you want people to make it their own."
