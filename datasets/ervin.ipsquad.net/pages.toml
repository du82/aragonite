full_description = "Tags: web-review, estimates, type-systems, programming, habits, multithreading, time, gpt, system, wayland, ai, tech, linux, knowledge, optimization, shader, 3d, criticism, memory, management, rust, politics, networking, ada, cognition, wikipedia, learning, teaching, gpu, machine-learning, marketing, privacy, business, research, copilot, focus, ux Some powerful bullies want to make the life of editors impossible. Looks like the foundation has the right tools in store to protect those contributors. https://www.404media.co/wikipedia-prepares-for-increase-in-threats-to-us-editors-from-musk-and-his-allies/ Alright, this piece is full of vitriol… And I like it. The CES has clearly become a mirror of the absurdities our industry is going through. The vision proposed by a good chunk of the companies is not appealing and lazy. This is clearly pointing in the direction of UX challenges around LLM uses. For some tasks the user’s critical thinking must be fostered otherwise bad decisions will ensue. Of course it would be less of a problem if explainability was better with such models. It’s not the case though, so it means they can spew very subtle propaganda. This is bound to become even more of a political power tool. This is an interesting way to frame the problem. We can’t rely too much on LLMs for computer science problems without loosing important skills and hindering learning. This is to be kept in mind. Due to NetworkManager you forgot how to setup an interface and the networking stack manually? Here is a good summary of the important steps. Surprising idea… I guess I’ll mull this one over and maybe try. This is not a small change of habit though. Interesting comparison. Ada doesn’t fare as good as I’d have expected as soon as pointers are in the mix… but there is a twist, you can go a very long way without pointers in Ada. This is indeed something easy to get wrong. Also this misconception is very widespread, so it’s good to debunk it. This is obviously all good news on the Wayland front. Took time to get there, got lots of justified (and even more unjustified) complaints, but now things are looking bright."
