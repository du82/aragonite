full_description = "Tags: web-review, management, tech, frontend, html, interviews, spiders, hiring, cognition, communication, web, biology, hr Excellent advice for managers. Framing the context is always important. Otherwise this can create stress. Definitely this… the amount of times I’ve seen this type of “x years of y” constraints for hiring people. It’s completely backwards, someone senior should be able to pick up new technologies quickly. Better focus on the ability to learn and other factors than limiting things to a particular stack. https://mikemcquaid.com/2021/11/08/stop-requiring-specific-technology-experience-for-senior-plus-engineers/ Definitely agree with this. People are generally not used to this though. That’s why one of the things I tell people during interviews is “I got a bunch of questions but there’s no good or bad answer to them, they are conversation starters mostly”. It’s really all about knowing each other better first. Another frontend framework which seems lightweight. Especially nice is the fact that it’s built on top of Web Components and that properties are properly reactive."
