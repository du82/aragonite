title = "Web Review, Week 2022-29 - ervin"
description = "Website Description"
full_description = "Tags: web-review, system, databases, blockchain, bug, windows, orm, programming, spring, tech, copyright, licensing, unix, design, 3d, tdd, browser, wikipedia, lenovo, vendor-lockin, irc, leadership, search, tests, pandas, polars, c++, history, unity, godot, hacking, web, python, type-systems, craftsmanship, uber, firefox, rss, politics, services, business, foss, ethics, ai, rust, funny, javascript, linux, estimates, smartphone, backend, command-line, surveillance, complexity, html, machine-learning, hr, remote-working, interviews, api, attention-economy, surprising, social-media, ecology, java, automotive, dns, react, data-science, web3, postgresql, project-management, privacy, zig, css, frontend, management, distributed, memory, github, culture, safety, terminal, microsoft Let’s go for my web review for the week 2022-29. This is a very large triple issue since I was mostly away from the keyboard lately. That summer break was good. :-) An excellent piece which raises interesting questions about computer literacy. There’s indeed be a generation of people before the so called “digital natives” who had to know how computers work. Are we loosing this by cuddling people with too much convenience? How much are we then loosing as a society? I don’t understand this “it is illegal and bad for workers” leading to “let’s change the law to make it happen anyway”. Change your business model already! Mysterious event… that’s the problem with such centralized and homogeneous system, when something fails it is quickly at scale. https://thelastdriverlicenseholder.com/2022/06/29/driverless-robotaxi-fleet-paralyzed-for-hours-in-san-francisco/ Very interesting thought experiment around Copilot’s legality. I’d love to see that happen and see what the outcome would be. Microsoft being its usual self… now trying to make sure Free Software developers can’t make money through their app store. They claim they like Open Source but only when that’s about getting a benefit for them on platforms they control."
