["https://ervin.ipsquad.net/blog/2021/10/01/web-review-week-2021-39"]
title = "Web Review, Week 2021-39 - ervin"
description = "Website Description"
full_description = "Tags: web-review, low-tech, tech, craftsmanship, project-management, programming, facebook, politics, durability, estimates, delegation, social-media, rust, go, fft, management, science, scrum, bug, cryptocurrencies, photography, agile, kanban A good reminder on how science and politics are more intertwined than we’d like to believe. It also shows why trying to have politics determined only by science brings its own set of biases in itself and can only lead to killing any form of debate or compromises. There’s something rotten in the cryptocurrency craze. This opinion piece lays it out really well I think. Clearly the next Cambridge Analytica-like campaigns are getting prepared today… Those systems really have a toxic architecture. It’s by construct, I don’t think there’s anything good to be gained from engaging with those ecosystems. This sounds like a good approach for optimizing on software durability. Obviously this means you loose other things. This is a trade-off. Potentially interesting tricks for estimating. Some of it I did, some not… I guess I’ll try some more of what’s proposed here at some point. https://shekhargulati.com/2021/09/23/doing-software-estimation-within-constraints-of-hofstadters-law-and-parkinsons-law/ Interesting musing on how different types of companies manage their projects. I’m glad to see there’s less cargo-cult Scrum than I expected. I also find funny that Scrum is perceived as “heavy weight”. :-D I still think there are indeed options that work better than others. They are then best practices… BUT they are very much contextual. Due to that complexity, the “personal preference” labelled as “best practice” is indeed pervasive in our industry. This is a good highlight of the differences. It’s not “one is best”, it is really “pick what is best in your context”. Excellent use of inverse-FFT to remove halftone dots in a picture. No need for fancy ML, pure simple math does the job."
