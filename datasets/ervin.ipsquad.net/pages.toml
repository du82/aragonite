description = "Website Description"
full_description = "Tags: web-review, linux, performance, tools, memory, book, robots, competition, cpu, cto, hardware, python, note-taking, capitalism, security, automation, business, mathematics, politics, social-media, c++, multithreading, safety, history, programming, funny, economics, rust, management, c, twitter, tech, command-line Very thorough overview on how registers are used when you get closer to the hardware. Very good resource to use as reference. Everything you always wanted to know but didn’t dare asking about memory allocators. OK, maybe not “everything everything” but this gives a very good overview on how they work and the trade-offs they have to make. Doesn’t give the whole picture (memory isn’t the only important parameter) but interesting results nonetheless. A few surprises in there, Java and C# do much better than one might assume for instance. Indeed, the story of integrating C and C++ with Rust isn’t a simple one right now. It might introduce larger attack surfaces. Some improvements are proposed in this paper. Looks like a smart and interesting little tool. I definitely needed something like it more than once. https://medium.com/cto-as-a-service/5-things-founders-investors-and-recruiters-should-know-about-the-cto-role-a65d7bb66264 Definitely something I learned way to late. I wish I had started with such summaries and book notes earlier. Very interesting explorations of the early days of automation and computation. This shows another face of Babbage which is often ignored. It is a cruel demonstration on how his machine were first and foremost encroached on division of labor as inspired by plantations. The fascinating world of micromice competitions. There’s a lot of thinking leading to those really smart designs."
