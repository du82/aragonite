["https://ervin.ipsquad.net/slides/lectures/lab-zero-to-formulas"]
title = "Lab - Zero to Formulas with Qt and TDD"
description = "Website Description"
full_description = "Now, the basics being in place, we’ll build our GUI. This way, you’ll be able to test the classes used to build a standard window. So far, we have only put building blocks together. Let’s put in place the basic GUI features now. Our first automated unit test will appear. We will now create our own data model for the spreadsheet. Most features will be implemented in the model. The TDD approach will be fully applied. Information: rowCount() and columnCount() must return 0 when the QModelIndex given as parameter is valid (see QAbstractItemModel documentation) Information: This latest modification should be done without modifying any test, this is your first refactoring with the unit tests safety net In this section, it is wise to add the asserts of each proposed test one by one or to separate them in several different tests, or also to add tests. It really depends on your confidence level about parsing. The client notices that he forgot to ask for the support of the substract, divide and negate operators… This section will allow us to add the necessary features to really have a usable spreadsheet. Without the support for references, we’d only have a big calculator… Once again, it is wise to add intermediate tests if necessary. Some aspects are ignored in this lab, and it would be necessary to see them to complete the application:"
