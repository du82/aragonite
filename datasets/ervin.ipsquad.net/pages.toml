description = "Website Description"
full_description = "Tags: web-review, open-access, architecture, research, microservices, academia, gafam, http, programming, cognition, smarthome, css, culture, frontend, mathematics, complexity, microsoft, 3d, java, benchmarking, scihub, history, commons, memory, tech, japan, repair The rebellion against the academic publishers is still going on. Hopefully this will really change soon. That cartel of publishers needs to go back to its rightful place. https://walledculture.org/rights-retention-one-small-step-for-academics-one-giant-leap-for-global-access-to-knowledge/ Interesting research on how relying on digital systems reshape our memory and our perception of our own abilities. https://www.howtogeek.com/774542/windows-11-officially-shuts-down-firefoxs-default-browser-workaround/ Now that looks like a really nice CSS framework. I like the approach with a very limited set of classes and pushing you to focus on semantic. And that’s why I find hard to swallow that “microservices” is the go to answer from lots of people nowadays when you discuss architecture. There are interesting promises on paper but that requires you to ignore several layers of complexity. It’s likely fine to get there at some point, but bake in all that complexity from the start? I don’t think so. Good explanation of how repair turned into an art in Japan. It also shows that imperfections can bring values to an object and are part of its history. It makes each object unique."
