description = "Website Description"
full_description = "Tags: web-review, matrix, history, surveillance, surprising, physics, garbage-collector, spreadsheets, health, delegation, estimates, data-science, security, management, rust, laptop, linux, facebook, quality, project-management, dystopia, data, repair, optics, programming, knowledge, frontend, hardware, memory, engineering, tech This company is just an enabling environment for toxic behaviors… it’s so clear each time some information about how they work leaks out. https://www.theguardian.com/world/2021/jul/18/revealed-leak-uncovers-global-abuse-of-cyber-surveillance-weapon-nso-group-pegasus This is excellent news. I like to see more adoption of Matrix. We’ll finally find out how it scales in practice. ;-) Now that looks like a very interesting modular laptop. I’d be interested to test it and would love to see some KDE stuff installed on it by default. ;-) Very interesting exploration on software engineering “facts” and what we can really do to increase quality. Unsurprisingly caring for the people seems to be the top factor. It’s a very nice paper on spreadsheets and how we use them. It got enough history in it to make me tick (goes back all the way to the 1300s!). Also it’s well balanced, it’s not just about blindly blaming tools but looks at their shortcomings but also how we often use the wrong tool for the task… and then end up managing data and knowledge really badly. Fascinating exploration of our perception of the blue color. Bottom line: our eyes aren’t great cameras at all and the brain compensate quite a lot. This together plays against our perception of blue."
