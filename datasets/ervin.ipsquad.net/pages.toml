full_description = "Tags: web-review, coaching, ai, tech, refactoring, machine-learning, webgpu, static-analyzer, programming, criticism, web, c++, agile, internet, rust, psychology, gpu, barcode, vulkan, neural-networks, state, war, browser, 3d, java Excellent article in French from one of the most influential people of the agile community in France. He delivers an interesting story about how state agencies started to apply some of the agile values and principles but how unfortunately this wave is already receding. https://acteurspublics.fr/articles/laurent-bossavit-les-methodes-agiles-impliquent-une-forme-de-rebellion At last we might wake up from the “deep learning alone can solve every problems” fantasy. Looking forward to seeing human interactions and symbol manipulation come back in the AI field. Finding ways to pick and mix approaches is essential. Otherwise it’s meant to stagnate and lead to industrial hazards. Interesting introduction into WebGPU. Nice to see it’s not quite Vulkan because some abstraction is needed in the browser (although, of course the approach is similar). There’s also a couple of design choices which are welcome to improve portability. Interesting and fair list of pain points around Rust. This is a change from the pure fan boy articles we see most times. Good primer on refactoring, I especially appreciate the big fat warning about language erosion… the number of times I hear “refactoring” for something which is not a refactoring at all… Interesting research explained. Apparently it’s more than time to put the catharsis hypothesis to rest."
