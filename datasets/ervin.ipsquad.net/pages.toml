["https://ervin.ipsquad.net/blog/2022/05/06/web-review-week-2022-18"]
title = "Web Review, Week 2022-18 - ervin"
description = "Website Description"
full_description = "Tags: web-review, interviews, architecture, career, css, science, type-systems, web, go, life, remote-working, mechanical, profiling, nft, culture, politics, physics, engineering, patents, complexity, tech, frontend, wisdom, watch, mypy, debugging, management, browser, japan, performance, javascript, html, scam, webassembly, social-media, python, web3, tracing, microservices, craftsmanship, backend, work, blockchain, hr, law, rust Let’s go for my web review for the week 2022-18. After a one week break, I mentioned we might have a double issue next… Here it is! Excellent news, hoping to see more such bogus patents cancelled. Also, one can hope, that patent offices would start becoming less sloppy… A good reminder that it’s not all rosy with Python type-hints. There’s definitely room for improvements. Good arguments around the microservices hype. People advocate for it way more than reasonable, this applies only in rare contexts. This is in part a rant but lots of points in there are very valid. This is in part why I don’t find Go a very compelling option so far. Modern tooling indeed, nice runtime in some areas but leaves way too much of the complexity in imperative code. It was only a matter of time until this kind of things would be doable through webassembly. I’m wondering about the size of the payloads the browser needs to download though. There is indeed a trade-off approach available nowadays between “backend computes the whole page” and “frontend computes it all in JS”. This sounds like an interesting patch depending on the project context. This is indeed a nice set of tasks to evaluate a frontend tech or your mastery of it. Potentially usable in interviews? OK, if true this is indeed an interesting test… kind of a social experiment really. Probably quite a bit ambiguous though. Lots of nice advices, both for mentors and mentees. This is definitely hard work but it’s worth it for people to grow. About growth again, definitely from the point of view of the mentee though. This looks like a nice and lean framework to figure out where you are and where you want to go."
