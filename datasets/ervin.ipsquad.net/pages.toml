["https://ervin.ipsquad.net/blog/2024/09/20/web-review-week-2024-38"]
title = "Web Review, Week 2024-38 - ervin"
description = "Website Description"
full_description = "Tags: web-review, oracle, frontend, surveillance, security, backup, directx, gpt, vulkan, ecology, law, metrics, politics, webgpu, battery, trademark, css, web, scripting, graphics, linux, shell, ai, team, tor, shader, business, io, html, javascript, kernel, 2d, machine-learning, war, economics, complexity, tech, rust, criticism, realtime, databases, privacy, gui, multithreading, management, asynchronous, c++, sqlite The quick answer is yes. The longer answer is that more effort is still required to ensure the network has enough diversity of nodes to stay healthy. This is a very harsh and bleak view on the current generative AI craze. Clearly it survives on some sort of weird faith that things will magically improve. Some decision makers clearly run fully on said faith and lost all kind of realistic view of the situation. They are just very disconnected from the user’s needs. There’s even a funny quote in there: “Generative AI must seem kind of magical when your entire life is either being in a meeting or reading an email”. When this bubble bursts, it’s hard to predict what the fallout will be on the tech industry… for sure it won’t be pretty. It also begs the question: what is this industry going to do next? There’s clearly no plan after generative AI. Need to illustrate how much the current AI arm race is an ecological and social problem? Here is a very pathological case. This is what you get when you let the tycoons behind this completely unchecked. People are gasping in horror with Larry Ellison’s latest claims… but really they should realize he’s not dreaming big. All of that is already here in one form or another. Maybe it was time to protest years ago? Or why we should all be concerned and condemn the latest pager and walkie-talkie attacks. They clearly opened a Pandora’s box, it’d be surprising not to see more of those from various organizations. The funds and efforts required make it affordable enough. This is a good initiative. It makes no sense for Oracle to still cling onto JavaScript as a trademark."
