["https://ervin.ipsquad.net/blog/2023/06/23/web-review-week-2023-25"]
title = "Web Review, Week 2023-25 - ervin"
description = "Website Description"
full_description = "Tags: web-review, api, sql, scrum, project-management, geography, java, map, history, criticism, craftsmanship, compiler, xslt, productivity, community, ai, estimates, gpt, type-systems, kde, self-hosting, licensing, memory, foss, rss, design, machine-learning, interoperability, google, python, graphics, unix, tech, agile, research, change, complexity, product-management, language, system, blog, c++, optimization, plan9, tests, 3d, databases, bytecode, safety, performance, programming, organization, vim, linux, rust Happy birthday the KDE Free Qt Foundation! It’s really nice to see it survived the test of time. It is for sure an essential tool of the KDE ecosystem. I wish there would be more such foundations around. Following up on his “The Free Software Foundation is dying” post, Drew DeVault has been working on the messaging part of his recommendations. The result is not bad at all! Despite the (sometimes valid) criticism floating around RMS and the FSF, we can’t deny RMS has been proven right more than once. Maybe it’s time to make so called “reinforcement learning from human feedback” actually humane? It’s not the first account along those lines in the industry. Oh the bad feedback loop this introduces… this clearly poison the well of AI training when it goes through such platforms. We went from quality to quantity it seems. We also have whole swats of developers who are just consuming content without critical thinking and it’s a problem. The conclusion says it all: “Don’t consume. Create. Ask questions. Stay curious.” Looks like a really nifty 3D procedural generator. I wish I’d have an excuse to use it on a project. This compilation technique brings very interesting results. Hopefully should find its way in some JIT compilers. Interesting point of view on why static typing seems to make a come back right now and why it’s likely to continue. I think a few of the arguments in here are wrongly framed (like some of the benefits of using an interpreter rather than a compiler are attributed to dynamic typing while it’s rather orthogonal) but a large part of the analysis seems valid to me."
