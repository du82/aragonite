["https://ervin.ipsquad.net/blog/2024/04/19/web-review-week-2024-16"]
title = "Web Review, Week 2024-16 - ervin"
description = "Website Description"
full_description = "Tags: web-review, infrastructure, 3d, tests, xr, coaching, health, memory, art, tools, management, work, learning, command-line, dependencies, javascript, failure, project-management, sociology, internet, performance, postgresql, life, politics, product-management, burnout, data-visualization, organization, tech, ssh, library, email, c++, physics, security, databases, web Very fascinating piece. This shows the underappreciated job of maintaining the subsea cables needed for the Internet to function and how extreme the conditions can be. Definitely a peculiar life for the folks in that trade… also shows the repairs are clearly underfunded and that not enough people are embracing this career. And now, add geopolitics to the mix, it should make you wonder how all of this work at all and for how long it’ll keep working. Interesting study on the brute force attacks against SSH. It gives plenty of insights and leads to a potential approach to detect most of them. Looks like a nice tool to backup and restore emails. Probably to check out next time you migrate your emails to another server. Neat little tool. Since I had to do this kind of work a few times, this is indeed a good idea to have a public and maintained script for it. Funny side project. This shows well many of the challenges one should expect when working on mixed reality projects. It’s also nice to see how the ecosystem matured for such features in the browser. Interesting approach to have a ray tracer which doesn’t quite follow physics for artistic purposes. This is definitely an ambiguous term. You need to know where stand the people employing it in order to figure out the exact meaning of “root cause”. Definitely this. Listen and write down issues before you start to complain. There might be reasons why things are as they are. Take the time to understand them and refine to have a better feedback. A good reminder that mental health can be hard to keep in check in our profession. Pay attention to how you feel, anxiety is a sneaky foe. Lots can be done to improve if taken care of early enough."
