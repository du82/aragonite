["https://ervin.ipsquad.net/blog/2024/01/05/web-review-week-2024-01"]
title = "Web Review, Week 2024-01 - ervin"
description = "Website Description"
full_description = "Tags: web-review, valve, gpt, foss, django, complexity, gpu, ai, databases, dependencies, shader, assembly, low-code, management, tools, mozilla, amd, developer-experience, culture, search, design, rss, fediverse, python, machine-learning, social-media, webassembly, security, php, performance, linux, profiling, nlp, automotive, docker, system, craftsmanship, tesla, web, orm, command-line, tech, architecture, law, engineering, c++, safety Alright, it’s 2024… Looking for a New Year Resolution? This is definitely the one you should contemplate! Maybe also prepare your switch to Plasma 6, but different story. 😉 Very inspiring article. I really wish we’ll indeed see more and more weird and creative websites. People apparently feels uneasy in their current social media jails, the time is ripe to leap in the unknown again. https://www.rollingstone.com/culture/culture-commentary/internet-future-about-to-get-weird-1234938403/ The current compromise might not be as bad as anticipated. Some things could be improved still. The community needs to be involved in the process. Indeed there are a few trends at play right now which lead to RSS being in use again. I can only hope it’ll keep growing. This looks like now is the time for smaller search engines to shine. Clearly the dominant ones are not doing a really good job anymore. The results of this investigation are actually super scary… Even if you don’t own one, those are in our streets. In any case it is a clear statement that you can’t and shall not run an automotive company like a startup… Funny reverse engineering of the latest SteamOS to use it in a different context. Give some information on their system design. Nice ode to simplifying web projects, to great effects. You can go a long way serving millions of requests if you choose your tools properly. Very interesting exploration of the design choices behind the creation of a key value storage engine. Overview of the differences in behavior between the two most popular ORMs in the Python ecosystem. This shows interesting different design options for such things."
