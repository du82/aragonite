description = "Website Description"
full_description = "Tags: web-review, funny, attention-economy, web, microservices, management, complexity, tech, asynchronous, cpu, ecology, bias, frontend, maintenance, gui, criticism, debugging, queuing, culture, programming, rust, storage, organization, design, patience, filesystem, ux, language, gpt, performance, law, crdt, system, ai, ethics, networking, craftsmanship, memory, gaming, caching, fonts, music, unix, io, google, surveillance, public-domain, kernel This is unclear on the technicalities (is it even possible to just claim it like this? is CC0 required? etc.). Still this is a bold move, hats off to this renowned author. If you’re still using Chrome, maybe you shouldn’t… They’re clearly making it easier to overcome ad blocker and the tracking won’t be a third party thing anymore, this browser will directly report on your behavior. https://arstechnica.com/gadgets/2023/09/googles-widely-opposed-ad-platform-the-privacy-sandbox-launches-in-chrome/ Interesting conservation work. Video games being part of our culture, especially indie ones, it’s important for such work to happen and be funded. https://www.404media.co/meet-the-guy-preserving-the-new-history-of-pc-games-one-linux-port-at-a-time/ Lays out the ethical problems with the current trend of AI system very well. They’re definitely not neutral tools and currently suffer from major issues. Now this is a very good article highlighting the pros and cons of large language models for natural language processing tasks. It can help on some things but definitely shouldn’t be relied on for longer term systems. I didn’t read it since it’s basically a whole book. Still from the outline it looks like a very good resource for beginners or to dig deeper on some lower level topics. A good reminder that depending what happens in the kernel, the I/O time you were expecting might turn out to be purely CPU time. A bit of a rambling, there’s something interesting in it though. Splitting small functions early will do more harm than good if they’re not reused. Don’t assume they automatically make things easier to read."
