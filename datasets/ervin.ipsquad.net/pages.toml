["https://ervin.ipsquad.net/blog/2022/05/27/web-review-week-2022-21"]
title = "Web Review, Week 2022-21 - ervin"
description = "Website Description"
full_description = "Tags: web-review, google, web, electronics, supply-chain, architecture, ux, security, rust, ci, performance, frontend, low-tech, go, browser, craftsmanship, complexity, usability, gaming, surveillance, git, politics, tech The EU Commission is going down a very dangerous path. Clearly pushing the agenda of global surveillance behind false pretenses, not terrorism this time but “protecting children”. It’s usually one of those two excuses being used to justify such attack on privacy. Debatable “feature”, bad implementation, dubious community handling… Clearly not a good example to follow from the Go space. Interesting forensic of a supply chain attack targetting crates.io. Especially fascinating to me is how it then tries to target CI build environments as preparation for larger attacks. https://www.sentinelone.com/labs/cratedepression-rust-supply-chain-attack-infects-cloud-ci-pipelines-with-go-malware/ A bit on the sarcastic side but there’s definitely some truth to it. This definitely goes against the YAGNI principle. Interesting opinion. Indeed, as the browsers are packing more features they can deal with more frontend complexity themselves. This is an opportunity to reduce the amount of code in the frontend code at least for some use cases. An excellent reminder that usability wise, high-tech is not always the best path. It’s good to also evaluate low-tech options at every turn. This is important to know the pros and cons of all the options you can pick. There’s also an interesting point in there about how those more constrained technologies in fact force and help designers to focus on the most important user features. Very cool reverse engineering of the schematics of the infamous Pong game. It had no software and no CPU either. Quite a feat."
