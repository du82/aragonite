["https://ervin.ipsquad.net/blog/2021/07/30/web-review-week-2021-30"]
title = "Web Review, Week 2021-30 - ervin"
description = "Website Description"
full_description = "Tags: web-review, linux, rust, evil-maid, postgresql, assange, tests, frontend, ai, machine-learning, history, self-hosting, life, statemachines, health, google, networking, databases, gpu, politics, search, python, web, joy, biology, justice, tech, agile, surveillance, pandemic, management, data-science, birds, programming, security Very interesting series of articles about the pandemic in various countries. It’s a few months old now though so things evolved, still it gives an interesting account about the early days. I wish they’d just drop the charges now… this has been running for way too long. Maybe it’s time freedom of the press gets back to the center stage? Pretty much this! Indeed it won’t stop until those weapons are banned and the companies selling them treated as criminals. Will take a while to get there though as long as the people in power use them as diplomatic tools… Good reminder of why if you got mobile devices which are outside of a secured office (like most companies nowadays) you should never underestimate the Evil-Maid scenario… A very interesting look at the history of the Agile movement. What it really meant and what it degenerated into. Nice extracts with comments about finding joy in your (work) life or not. Two paths really… which one are you on? Too bad this is stretching a bit too far on the politics side (although it’s not unjustified, I think it muddies the initial message in this context). https://www.techdirt.com/articles/20210726/09441047251/techdirt-is-now-entirely-without-any-google-ads-tracking-code.shtml Nice piece advocating for self hosting. I especially like the fact that it stresses that it doesn’t mean “one server for one person” it’d be unrealistic to turn everyone into sysadmins. The journey of Rust inside of the Linux kernel is still in its early days. I find especially interesting the questions raised by the community. It’s especially healthy in my opinion, it’s not just “fancy let’s have it”. They also wonder about the learning path for people to join the community if it’s accepted or where to best use it. It’s a good account of the social aspects triggered by technical changes."
