["https://ervin.ipsquad.net/blog/2024/06/21/web-review-week-2024-25"]
title = "Web Review, Week 2024-25 - ervin"
description = "Website Description"
full_description = "Tags: web-review, gpt, programming, information, history, communication, library, maintenance, api, life, foss, ai, memory, data-visualization, python, performance, management, surveillance, ethics, complexity, git, organization, software, criticism, requirements, privacy, tools, security, data-science, microsoft, simulation, funny, social-media, copilot, product-management, machine-learning, cad, probability, java, networking, shell, talk, work, rust, tech, scripting, self-hosting, internet, json Oracle doing Oracle things I guess… The surprising bit to me is the fact that so many people still seem to use Java SE while there are other excellent alternatives. A deep dive into the events which led to the SolarWinds breaches. The responsibility from Microsoft as an organization is staggering. Their handling of security matters massively failed once more. I don’t get how governmental agencies or other companies can still turn to Microsoft with sensitive data. Very unsurprising, the harm is probably done though. They’ll have to work hard for their reputation to recover (even though it was probably low already). https://arstechnica.com/gadgets/2024/06/microsoft-delays-data-scraping-recall-feature-again-commits-to-public-beta-test/ It was already hard to trust this company, but now… that clearly gives an idea of the kind of monetization channels they’re contemplating. OK, this is a rant about the state of the market and people drinking kool-aid. A bit long but I found it funny and well deserved at times. Since there are ways to offset the plagiarism a bit, let’s do it. Obviously it’s not perfect but that’s a start. Very interesting piece… shows how someone can end up maintaining something essential for decades. This is a lesson for us all. On the peculiarities of running a network for a university… this is an interesting way to frame it as basically being an ISP with benefits. That’s what happens where references are half hidden in a language. You think each closure get a different copy but in fact they all refer to the same object."
