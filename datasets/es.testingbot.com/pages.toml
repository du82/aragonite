["https://es.testingbot.com/security"]
title = "Seguridad de nivel empresarial: TestingBot"
description = "Seguridad de grado empresarial para pruebas de Selenium basadas en la nube."
full_description = "Para cada prueba que ejecuta, activamos una máquina virtual (VM) completamente nueva con la plataforma / navegador / dispositivo que desea probar. Cada prueba se ejecuta en una máquina prístina, recién arrancada. Todo lo que hace su prueba en la VM se escribe en un disco RAM (memoria) a través de COW (Copiar en escritura). Al final de su prueba, después de que hayamos recopilado capturas de pantalla, registros y video de la prueba, le indicamos a nuestro hipervisor que borre por completo el disco RAM y la máquina virtual. Cada prueba se ejecuta sola, cortafuegos, VM. TestingBot garantiza que solo usted puede acceder a la máquina virtual, el resto del tráfico se bloquea mediante la aplicación de un firewall para cada máquina virtual que ejecuta. Las máquinas virtuales solo pueden acceder a Internet pública. O, en caso de que esté ejecutando un Túnel de TestingBot, el contenido en su computadora / red. De forma predeterminada, tomamos capturas de pantalla y un video de su prueba, junto con el registro de varios componentes (Registros de Selenio, Registros de Controlador de Chrome, Registros de Controlador de Firefox, Registros de Consola, ...) Estos activos se cargan en nuestros servidores de activos a través de SSL. El acceso a estos activos está restringido: creamos una URL firmada para cada activo. A cada activo solo se puede acceder a través de SSL durante 30 minutos. También puede desactivar cualquier registro, captura de pantalla y grabación de video. De esta forma no registraremos nada que suceda durante su prueba. Agregue colegas a su equipo y haga cumplir las políticas del usuario como propietario de la cuenta, como por ejemplo: Como propietario o administrador, puede distribuir la cantidad de pruebas paralelas que su suscripción puede ejecutar entre los miembros de su equipo. Puede ver una descripción general de la actividad de cualquier usuario (pruebas, inicios de sesión, ...) y agregar / eliminar usuarios a su equipo."
year_published = 2025
