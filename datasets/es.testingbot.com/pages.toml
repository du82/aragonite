full_description = "Dispositivos iOS y Android dedicados para usted y su equipo. Aprovisionamos los dispositivos que desee, personalizados según sus necesidades. Elige tus propios dispositivos iOS y Android. Compraremos estos dispositivos, los instalaremos y configuraremos en nuestro centro de datos seguro. Estos dispositivos estarán disponibles para usted, 24x7, y solo serán utilizados por usted. Ya que estos son sus dispositivos, puede hacer que deshabilitemos / configuremos el progreso de la limpieza después de cada prueba. Pídanos que instalemos aplicaciones y perfiles específicos o que modifiquemos configuraciones específicas del dispositivo. Tú decides. Podemos equipar sus dispositivos con una tarjeta SIM. Esto le permite ejecutar pruebas con conectividad de operador. Esta función le permite ejecutar escenarios de prueba que no son posibles con Wi-Fi. Por ejemplo, un mensaje de texto desde / hacia el dispositivo, marcando / recibiendo llamadas, ... Con nuestra nube de dispositivos privados, los dispositivos solo son utilizados por usted. Aunque TestingBot realiza una limpieza completa del dispositivo después de cada prueba, debido a la complejidad de los dispositivos móviles, no podemos garantizar que todos los datos se eliminen después de sus pruebas. No tiene que esperar a que otra persona termine de usar un dispositivo público. Los dispositivos están listos para su prueba manual y automatizada, 24x7."
