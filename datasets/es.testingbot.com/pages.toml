full_description = "Cree pruebas automatizadas de forma rápida y fácil. Grabe sus acciones una vez, reproduzca en más de 5200 navegadores y dispositivos móviles. Utilice el complemento oficial del navegador Selenium IDE para registrar fácilmente su flujo de prueba desde su propio navegador. Importe la prueba y ejecute la prueba grabada en paralelo en más de 5200 combinaciones de navegador y dispositivo. No se requieren conocimientos de programación. Los probadores manuales pueden registrar sus flujos de prueba y crear fácilmente pruebas automatizadas sin escribir una sola línea de código. Ejecute su prueba importada en paralelo en cientos de navegadores, dispositivos y combinaciones de SO. Vea videos, capturas de pantalla y registros de su prueba ejecutándose en navegadores genuinos, emuladores iOS y Android o dispositivos móviles físicos iOS y Android. Especifique un formato cron, indique qué días y horas desea ejecutar su prueba en paralelo en nuestros navegadores. TestingBot le informará cuándo falla una prueba, junto con detalles sobre por qué falló la prueba. Reciba alertas por correo electrónico o mensajes de texto. Programe informes diarios o semanales de sus pruebas."
