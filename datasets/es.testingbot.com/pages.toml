full_description = "Cada plan incluye todas las plataformas de sistemas operativos / explorador / del dispositivo con disponibilidad en tiempo real de las máquinas virtuales. También se incluye la reproducción de vídeo de la prueba, las pruebas manuales ilimitadas, las capturas ilimitadas y herramientas de depuración. TestingBot se integra con cualquier marco lenguaje y sistema de CI No, usted no necesita una tarjeta de crédito Con nuestro plan gratuito que puede probar nuestro servicio durante 2 semanas sin pagar nada. Cuando se desea actualizar a un plan de pago, puede actualizar fácilmente con tarjeta de crédito o transferencia bancaria. Nuestros planes vienen con una suscripción mensual que se puede cancelar en cualquier momento Si cancela en la mitad del mes se le cobrará para ese mes, pero que no va a someter a los contratos anuales o cargos adicionales Las pruebas paralelas indican cuántas pruebas puede ejecutar al mismo tiempo. Más pruebas paralelas significan una mayor disminución en el tiempo de prueba general. ¡Nos encantan los proyectos de código abierto! Si tiene un proyecto de código abierto, regístrese en nuestro plan de código abierto. Una vez finalizado el tiempo de prueba disponibles durante un mes ya no se puede ejecutar ningún examen durante ese mes Si desea continuar las pruebas de funcionamiento por favor, considere actualizar su plan"
