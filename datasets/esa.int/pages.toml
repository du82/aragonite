["https://esa.int/ESA_Multimedia/Videos/2025/02/Fly!_Project_media_briefing"]
title = "ESA - Fly! Project media briefing"
description = "Watch the latest updates on ESA’s Fly! Feasibility Study with Daniel Neuenschwander, ESA Director of Human and Robotic Exploration, John McFall, Member of the ESA Astronaut Reserve & Fly! Subject Matter Expert, Jerome Reineix, Fly! Study Manager, and Alessandro Alcibiade, Fly! Flight Surgeon.Announced in November 2022 during the Ministerial Council held in Paris, France, this unique and groundbreaking study is aimed at understanding and challenging the limitations posed by physical disabilities to human spaceflight. Concluded in late 2024, the Fly! Feasibility Study successfully demonstrated it is technically feasible to fly someone with a physical disability, like John’s, on a six-month mission to the International Space Station as a fully integrated crew member. It underpinned the desire to ensure that space exploration is not limited by physical constraints and that every individual can contribute to our collective understanding of the cosmos and of the benefits of spaceflight for life on Earth.The end of the feasibility study marks the start of the next phase: Fly! Mission Ready . This is an essential step to carry out the first long-term mission for an astronaut with a physical disability."
full_description = "Watch the latest updates on ESA’s Fly! Feasibility Study with Daniel Neuenschwander, ESA Director of Human and Robotic Exploration, John McFall, Member of the ESA Astronaut Reserve & Fly! Subject Matter Expert, Jerome Reineix, Fly! Study Manager, and Alessandro Alcibiade, Fly! Flight Surgeon. Announced in November 2022 during the Ministerial Council held in Paris, France, this unique and groundbreaking study is aimed at understanding and challenging the limitations posed by physical disabilities to human spaceflight. Concluded in late 2024, the Fly! Feasibility Study successfully demonstrated it is technically feasible to fly someone with a physical disability, like John’s, on a six-month mission to the International Space Station as a fully integrated crew member. It underpinned the desire to ensure that space exploration is not limited by physical constraints and that every individual can contribute to our collective understanding of the cosmos and of the benefits of spaceflight for life on Earth. The end of the feasibility study marks the start of the next phase: Fly! Mission Ready . This is an essential step to carry out the first long-term mission for an astronaut with a physical disability."
