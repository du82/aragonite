["https://esa.int/Enabling_Support/Space_Transportation/Ariane/Watch_live_Ariane_6_second_flight"]
title = "ESA - Watch live: Ariane 6 second flight"
full_description = "Enabling & Support Watch live: Ariane 6 second flight 27/02/2025 26402 views 120 likes ESA / Enabling & Support / Space Transportation / Ariane Ariane 6 is scheduled to launch from Europe’s Spaceport in French Guiana at 13:24 local time on 6 March (16:24 GMT, 17:24 CET). This is the first commercial flight for Ariane 6, flight number VA263, operated by Arianespace, carrying the CSO-3 satellite for the French Procurement Agency (DGA) and the French space agency (CNES) on behalf of the French Air and Space Force’s Space Command (CDE). Follow the launch live Tune in here on 6 March from 16:35 CET to watch the Ariane 6 rocket take flight for the second time. Time in CET Time after liftoff (hours:minutes) Event 16:35 Programme begins 17:24 00:00 Liftoff 17:26 00:02 Boosters separation 17:28 00:04 Fairing jettison 17:32 00:07 Vulcain 2.1 engine shuts off 17:32 00:07 Core stage separation 17:32 00:07 First Vinci ignition – first boost starts 17:43 00:19 End of first boost 17:54 - 18:15 00:29 - 00:51 Programme break 18:20 00:56 Second Vinci ignition – second boost starts 18:21 00:56 End of second boost 18:31 01:06 Payload CSO-3 released into its orbit About Ariane 6 Ariane 6 blueprint Ariane 6 is Europe’s heavy launcher and a key element of ESA’s efforts to ensure autonomous access to space for Europe’s citizens. Its modular and versatile design allows it to launch all missions from low-Earth orbit into deep space. Standing over 60 metres tall, Ariane 6 can weigh almost 900 tonnes when launched with a full payload.Ariane 6 has three stages: two or four boosters, and a main and upper stage. For this launch, the rocket will be used in its two-booster configuration.The main stage and the solid rocket boosters are responsible for the first phase of flight. The stage is powered by the Vulcain 2.1 engine (fuelled by oxygen and hydrogen), with the main thrust at liftoff provided by the P120C boosters.The upper stage is powered by the reignitable Vinci engine fuelled by cryogenic liquid oxygen and hydrogen. The upper stage will fire two times to reach the required orbit for this mission. After separation of the payload, Ariane 6 has a final burn planned to deorbit the upper stage and reduce space debris.For more information download the media kit. Ariane 6 defies gravity in breathtaking first flight Like Thank you for liking You have already liked this page, you can only like it once!"
