title = "ESA - 10 remarkable Earth facts"
description = "Every year on 22 April, we’ve celebrated Earth Day&nbsp;and the&nbsp;beautiful planet we call home. Earth Day, established in 1970, has been used to highlight our planet’s environmental challenges and raise awareness of the importance of protecting our world for future generations. But shouldn’t every day be Earth Day? We only have one beautiful planet after all.&nbsp;We hope you enjoy this curated list of 10 of the most remarkable facts about Earth.&nbsp;Scroll to the end of the article to take part in ESA's 'You like, we plant' campaign."
full_description = "Applications 10 remarkable Earth facts 18/04/2023 499942 views 2633 likes ESA / Applications / Observing the Earth Every year on 22 April, we’ve celebrated Earth Day and the beautiful planet we call home. Earth Day, established in 1970, has been used to highlight our planet’s environmental challenges and raise awareness of the importance of protecting our world for future generations. But shouldn’t every day be Earth Day? We only have one beautiful planet after all. We hope you enjoy this curated list of 10 of the most remarkable facts about Earth. Scroll to the end of the article to take part in ESA's 'You like, we plant' campaign. 10 Earth facts Earth isn’t actually round Coral reefs are Earth’s largest living structure Earth has a squishy interior Antarctica is home to the largest ice sheet on Earth The Moon is drifting away from Earth Atacama is the driest place on Earth Earth’s magnetic pole is creeping westward Europe is the second smallest continent in size but the third largest in population Tibetan plateau is Earth’s ‘third pole’ Trees are breathers You like, we plant! 1. Earth isn’t actually round While this sounds like an elaborate joke, we’re actually serious. Earth isn’t flat, but it’s not perfectly round either. Earth’s rotation causes the planet to bulge at the equator and flatten at the poles, while the distribution of mass on Earth (which is not perfectly uniform) causes small variations in the gravitational pull at different locations on the planet. These variations are too small to be seen in pictures of Earth from space, so it appears round to the human eye. Best view yet of global gravity Access the video The shape seen in the video above is not technically the shape of the planet, but its ‘geoid’, the shape of its mean sea-level surface extending around the entire globe. The map was produced using data collected from ESA’s Gravity and Steady-State Ocean Circulation Explorer (GOCE) and shows the most detailed map ever created of Earth’s gravity field. 2. Coral reefs are Earth’s largest living structure Coral reefs are not only beautiful natural wonders, but also the largest living structure on Earth. These underwater ecosystems are made up of colonies of tiny animals called coral polyps, which build calcium carbonate skeletons that accumulate over time and form the complex structures we know as coral reefs. Coral reefs are incredibly diverse and play a vital role in the ocean ecosystem, providing habitat and protection for many species, and acting as a natural barrier that helps to protect coastlines from storms and erosion. Great Barrier Reef Unfortunately, coral reefs are under threat from a range of environmental factors, including ocean acidification, rising temperatures and global warming. ESA research has shown how our ocean waters have become more acidic over the last three decades and how this is having a detrimental effect on marine life. By using satellite technology to measure ocean colour, temperature and salinity, scientists can track changes in ocean chemistry and detect areas where acidification is occurring. Rising temperatures can also have a direct impact on coral reefs, causing coral bleaching, which occurs when corals expel the algae that live in their tissues and provide them with food. Coral bleaching can lead to the death of the coral, which can have knock-on effects on the wider ecosystem. 3. Earth has a squishy interior Earth’s interior is not solid, but rather has a semi-solid or ‘squishy’ consistency owing to high temperatures and pressures. This squishy consistency allows the mantle to flow and move over geological timescales, which is responsible for phenomena such as plate tectonics, volcanic activity and earthquakes. One consequence of this squishy interior is a process known as post-glacial rebound. During the last ice age, large portions of Earth's surface were covered by glaciers, causing the underlying mantle to deform and sink. As the glaciers melted and receded, the mantle slowly rebounded back to its original position over thousands of years, causing the land above it to rise. This process is still occurring today in places such as Canada, Scandinavia, and Greenland, where the land is still rebounding from the weight of the glaciers that once covered the region. Recent research had found that West Antarctica is rising faster than anywhere else in the world, thanks to data from ESA’s GOCE gravity mission. The study of post-glacial rebound provides important insights into the structure and behaviour of Earth's interior, and how it responds to changes in the surface environment over long timescales. 4. Antarctica is home to the largest ice sheet on Earth More than six times as large as Greenland, Antarctica is the southernmost continent and is the coldest and windiest place on Earth – with temperatures that can drop as low as -89.2°C and winds that can exceed 320 km per hour. Antarctica is home to the largest ice sheet on Earth, containing a staggering 30 million cubic kilometres of ice. This represents an incredible 70% of Earth's freshwater and 90% of its ice. As a result, changes to the Antarctic ice sheet can have significant implications for global sea levels and ocean currents. Monitoring the Antarctic ice sheet is therefore of paramount importance and satellite data plays a crucial role in this effort. Data from satellites such as CryoSat, ESA’s ice mission, allow scientists to track changes in the thickness and movement of the ice sheet over time, providing insights into how it is responding to a changing climate. ESA has recently teamed up with NASA and the British Antarctic Survey (BAS) to carry out an ambitious campaign in Antarctica which involved taking simultaneous measurements of sea ice from ESA’s CryoSat and NASA’s ICESat-2 satellites. This research is essential for informing policy decisions on issues such as climate change and sea level rise, and for developing strategies to mitigate their impact on coastal communities around the world. 5. The Moon is drifting away from Earth You read that correctly! The Moon is gradually drifting away from Earth at a rate of approximately 4 cm per year. This phenomenon is caused by the Moon pulling on Earth’s oceans creating tidal forces that produce a bulge of water on the side of Earth facing the Moon. This bulge in turn creates a gravitational pull on the Moon, causing it to accelerate slightly and move further away from Earth. Over time, this process has caused the Moon to move farther away from Earth each year. This gradual drift is not noticeable on a day-to-day basis, but over millions of years, it can have significant effects on Earth's rotation. Today, most scientists believe the Moon is ‘Earth's child’ – a large body collided with Earth, destroying our planet’s mantle and sending material into orbit from which the Moon formed. This ‘big splash’ theory would explain why the Moon’s rocks are similar to those on Earth.Bonus fun fact: Australia is actually wider than the Moon. The Moon sits at 3400 km in diameter, while Australia’s diameter from east to west is almost 4000 km. The Moon, as a sphere, has more surface area, but it’s still pretty impressive. 6. Atacama is the driest place on Earth The Atacama Desert, located in South America, is widely considered to be the driest place on Earth, outside of the Antarctic dry valleys. This vast expanse of land spans over 100 000 sq km and receives an average of less than 1 mm of rainfall per year. Atacama Desert The harsh climate of the Atacama is due to a combination of factors including its location in a rain shadow caused by the Andes mountains, the presence of the cold Humboldt Current offshore and a lack of moisture-bearing winds. Despite its arid conditions, the Atacama is home to a number of unique species of plants and animals that have adapted to survive in this harsh environment. The desert is also known for its stunning landscapes, including salt flats, geysers and towering volcanoes – making it a popular destination for adventurous travellers. 7. Earth’s magnetic pole is creeping westward Unlike our geographic North Pole, which is in a fixed location, Earth’s magnetic north wanders. Until the early 1990s, the magnetic North Pole was known to lie some 1600 km south of true north, in Canada. Yet scientists realised that the location of magnetic north wasn’t fixed and was drifting at a rate of 15 km a year. Since the 1990s, however, the drift of Earth’s magnetic pole has turned into more of a sprint. Its present speed is around 50-60 km a year and is making a dash towards Siberia at a pace not seen before. Why? Scientists studying the drift of Earth’s magnetic north pole, using data from ESA’s Swarm mission, have pinpointed a change in the circulation pattern of magnetic blobs deep below Earth’s surface. They learned a change in the flow underneath Canada has caused a patch of magnetic field at the edge of Earth’s core, deep within the Earth, to be stretched out. This has weakened the Canadian patch and resulted in the pole shifting towards Siberia. 8. Europe is the second smallest continent in size but the third largest in population Europe is known for its diverse cultures, rich history and stunning landmarks. Despite being the second smallest continent in size (after Australia), Europe is home to a staggering population of over 746 million people, making it the third largest continent in terms of population (after Asia and Africa). Europe has one of the highest levels of urbanisation in the world, with over 75% of its population living in urban areas. With the world’s population expected to reach 9.7 billion in 2050, we must increase efforts to understand and mitigate the challenges brought by rapid and unplanned urbanisation, air pollution, as well as issues related to the management of water and energy. Dubai, United Arab Emirates ESA and the German Aerospace Center (DLR), in collaboration with the Google Earth Engine team, have developed the World Settlement Footprint – the world’s most comprehensive dataset on human settlement. Featuring data from the Copernicus Sentinel-1 and Sentinel-2 missions, this unprecedented collection of data on human settlement will advance our understanding of urbanisation on a global scale. 9. Tibetan plateau is Earth’s ‘third pole’ The Tibetan Plateau is often referred to as the 'third pole' owing to the amount of freshwater it contains. With over 46 000 glaciers, the Tibetan Plateau holds the largest reserve of freshwater outside of the North and South Poles. These glaciers feed the rivers that run through the region, including the Mekong, Yangtze, and Yellow River, providing a vital source of water for millions of people in China and Southeast Asia. The Tibetan Plateau's glaciers, along with other glaciers around the world, are under threat from climate change. Rising temperatures are causing the glaciers to melt at an unprecedented rate, which could have devastating consequences for the people and ecosystems that depend on them. New findings have found that values of ice lost from Himalayan glaciers during 2000 to 2020 were, on average, underestimated by 6.5%. This discovery has critical implications for predicting the demise of the region’s glaciers and for managing critical water resources. 10. Trees are breathers Trees are one of the most effective tools we have to combat climate change. Forests are home to around 80% of biodiversity on land and tropical forests alone produce over 40% of the oxygen we breathe. Covering around 30% of Earth’s land surface, we depend on forests for our survival. Forests absorb around 8 Gigatonnes a year of carbon dioxide from the atmosphere and play a crucial role in the carbon cycle and climate system. However, climate change, forest degradation and deforestation are causing much of this stored carbon to be released back into the atmosphere. Recent research found that recovering tropical forests were only successfully combatting a quarter of the current carbon emissions and indicates the importance of preserving and restoring our tropical forests.To better understand the role of trees in regulating our planet's carbon cycle, ESA’s upcoming mission called Biomass will use advanced radar technology to measure the amount of carbon stored in Earth's forests and other biomass, providing a more accurate assessment of carbon storage and uptake than ever before. By monitoring changes in biomass over time, scientists will be able to assess the effectiveness of forest conservation efforts and better understand the impact of deforestation on our climate. You like, we plant!For Earth Day 2023, we need your help in growing the ESA forest. As mentioned, trees play a vital role in maintaining a healthy planet. They absorb carbon dioxide, provide oxygen and help to regulate Earth’s climate. To kick-start our campaign, ESA has already planted 500 trees but we need your help doubling that number. For every ‘like’ this article receives as of Saturday 22 April (23:59 CEST), ESA will plant an additional tree in its existing ESA forest – in collaboration with Treedom. If you’d like to participate, it couldn’t be easier: Just click the ‘like’ button below. Every like counts (literally!) Climate change, threats to biodiversity and environmental protection are some of the biggest challenges of our times and Earth Days aim to raise awareness and inspire action to tackle these. We consider this campaign to be a small step in this direction and that can complement broader conservation action worldwide. Like Thank you for liking You have already liked this page, you can only like it once!"
