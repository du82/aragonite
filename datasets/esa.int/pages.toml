["https://esa.int/Services/Privacy_notice"]
title = "ESA - Privacy notice"
description = """
Released by: European Space Agency, as Data Controller
Addressed to: individuals whose personal data is collected and processedConcerning collection and processing initiated by: ESA Communication Department"""
full_description = "Agency Privacy notice 18278 views 73 likes ESA / Services Released by: European Space Agency, as Data Controller Addressed to: individuals whose personal data is collected and processedConcerning collection and processing initiated by: ESA Communication Department European Space Agency (herein the “Agency” or “ESA” or “We”) is committed to protect Personal Data in line with the ESA Framework on Personal Data Protection (herein the “ESA PDP Framework”) available at: https://www.esa.int/About_Us/Law_at_ESA/Highlights_of_ESA_rules_and_regulations composed by The Principles of Personal Data Protection adopted by ESA Council on 13 June 2017 The Rules of Procedure for the Data Protection Supervisory Authority adopted by ESA Council on 13 June 2017 The Policy on Personal Data Protection (including its Annex “Governance Scheme of the Agency’s Personal Data Protection”) adopted by Director General of ESA on 1 March 2022 (“ESA PDP Policy”). This notice is intended to describe why and how Your personal data are collected and processed by, or on behalf of, the Agency, as Data Controller, upon initiative of ESA Communication Department, as well as what rights You have in relation to Your personal data. It also informs You about the contact details of the Data Protection Officer. This privacy notice was last updated on 18/10/2023. It must be read in conjunction with the ESA PDP Framework and other privacy notices referred to herein.(1) What are the relevant contact details for this notice?ESA Data Protection Officer (“DPO”) may be contacted in line with the ESA PDP Framework at DPO@esa.int. As the collection and processing concerned by this notice is performed upon initiative of the ESA Communications Department, questions may also be addressed to the e-mail address: commppdp@esa.int.(2) What kind of personal data are collected and further processed?We collect and process a variety of Your personal data and may require You to provide personal data for the purposes mentioned further below. Depending on the purpose for which they are collected and further processed, the personal data may include: Identity Data: including names, date of birth, passport number or other official identity number, gender indication, nationality, marital status; Contact information: including address, email address and telephone number; Professional information: including job title, email address, phone number and addresses,; Professional career data: including your previous positions and professional experience; Technical data, including online identifiers: for example, internet protocol (IP) address or domain names of the devices utilised, login data, browser type and version, uniform resource identifier (URI) address, time zone setting and location, browser plug-in types and versions, ESA or other operating system and platform and other technology on the devices you are using – collected when you access our Website, our electronic portals and platforms which we offer or which we have agreed with you to use or made available to you where you have agreed to their use; logs; Photo: including photographs, likeness, image; Audio-video recording, statements, interviews; CCTV (“close circuit television”) and physical security data: CCTV footage and other information relating to access of our facilities obtained through electronic means, Financial data: bank account number, payment card details; Social media data: when you are an user of social media and depending on the circumstances or the social media in question, the personal data that we may collect are derived from: Your user profile, e.g. Your profile picture published on social media, your pseudonym, nickname or avatar), Your interactions (e.g. interacting with a story, following or unfollowing a web page, linking or unlinking a web page or post, recommending a web page, sharing a post, reacting to a web page or a post, commenting a web page or a post, or other action related to a specific topic, network and /or connection) on the social media or other information related to your habits, hobbies, interests, professional and educational background etc Your online identifiers, including Technical Data related to your social media use; personal data processed via third-party platform, app or a website (connected to social media platform) that may be obtained when a user visits or uses their services; the audiovisual content that might be published on the social media platforms; this may include information in or about the content provided by a user (e.g., metadata), such as the location / date of a photo, voice recordings, video recordings, or an image of a data subject other personal information You may disclose via the social media or in the use thereof. Other personal information You may provide, in particular content of exchanges with the Agency, as for instance dietary preferences, assistance data; Other personal data, to the extent you made them public; Other data, such as : Your messages, date, and time the message has been sent; the content of the questions you asked other data mentioned in Your messages, data You made public. (3) How are Your personal data collected or further processed?In addition to the personal data, We collect directly from You (e.g. you fill in a form submitted by, or for, ESA), We may, depending on Your situation, collect certain personal data about You indirectly by various means. This includes collection of personal data from availably sources or from third parties, including from analytics providers or from social media platforms (e.g., from the content you post on your social media, cookies deposited on your device if you have accepted their deposit etc.).(4) Why are Your personal data collected and further processed?We collect and process Your personal data because it is necessary for the activities conducted to fulfil Our purpose, which is “to provide for and to promote, for exclusively peaceful purposes, cooperation among European States in space research and technology and their space applications, with a view to their being used for scientific purposes and for operational space applications systems” (as per ESA Convention). We serve the public interest, and we wish to foster the public interest in space activities and programmes.All the processing carried out by, or on behalf of, the Agency upon initiative of the Communication Department falls in this general purpose and, in particular, into one of the reasons permitted under ESA PDP Framework, in particular under ESA PDP Policy.In any case, we do not use your personal data for activities where our interests are overridden by the impact on you, unless we have your consent or are otherwise required or legally permitted.You will find more information on this matter in the below. What is the purpose of processing Your personal data? 4.1 IF YOU ARE A (PROSPECTIVE) PARTICIPANT TO AN EVENTYour personal data is collected and further processed for the following purposes: to manage Your registration for the event; to correspond with You about the event, including sending you pre- and post-event information; to secure Your access to the premises of the event (admission checks); to deliver the event You have registered for; to accommodate special needs in terms of dietary restrictions or special health needs You may have and communicate to us; to take photos and audio-video recordings; possibly to distribute / publish them (offline and/or online) for documenting the event, or for event reporting or; for ESA outreach purposes; photos taken under private capacity do not fall under the responsibility of ESA; to provide you with feedback on the current (purpose of evaluating the event and optimizing future events) and/or invitations to future events; as the case may be (if so provided in the terms applicable to the event), to ensure reimbursement of certain (e.g. travel) expenses; as the case may be (if so provided in the terms applicable to the event), to ensure creation of an account of a platform used for the organisation of the event to produce statistics; to enable the analysis of the participation indicators in order to better manage the events in the future; to defend the Agency from possible liability claims that may arise in connection with Your participation to the event; Any CCTV and security data are collected and processed in order to ensure that only authorised persons enter into the event premises and to be able to take the necessary actions to protect the legitimate interests of the Agency, of the participants, including You. 4.2 IF YOU ARE A SPEAKER TO AN EVENTYour personal data is collected and further processed for all the purposes mentioned in 4.1 above, which more particularly includes: to facilitate Your registration for, and venue at, the speaking engagement, to communicate with you regarding event logistics, scheduling and any updates related to Your speaking engagement, to enable You to deliver a speech during the event and where it is recorded, to make it public via any media world-wide; to transcribe the content of Your participation to a different format, for example, transcribing audio to text; to communicate with, and send marketing materials about, and invitations to, our events to potential participants; to publish information and content from the event on websites or media belonging to, or used by, ESA, in particular in our newsletters and/or in our social media channels. 4.3 IF YOU SUBSCRIBED TO ESA COMMUNICATION NEWSLETTERS OR OTHERWISE EXPRESSED YOUR INTEREST IN RECEIVING INFORMATION RELATED TO ESA ACTIVITIES AND PROGRAMMESYour personal data is collected and further processed for the following purposes: to provide you with information about ESA activities and programmes and about ESA events, via newsletters and their updates; to collect feedback to help ESA monitor and improve future newsletters; to defend the Agency from possible liability claims that may arise in connection with your use of the information You have received; to respond to your request related to ESA activities and programmes and, generally, to space-related matters, initiatives and activities. 4.4 IF YOU ARE VISITING ESA WEBSITE(S)Informing the broad public (including raising awareness about ESA activities among the general public in ESA Member States) and qualitative media monitoring, including monitoring and analysis of website use, traffic and interactions are public service tasks related to ESA mission as resulting from the ESA Convention. Your personal data are collected and further processed as necessary for the performance of such tasks.Your personal data - collected and/or processed either directly by the Agency or by third-party companies, for the Agency - is used by or for the Agency for the communication activities, such as sending e-mails and invitations (this entails the management of contact lists for correspondence), for statistical and analytical purposes and, generally, for the promotion of the Agency’s communication campaigns and related activities and programmes.In particular, Your personal data is collected and further processed for the following purposes: to raise awareness or conduct surveys on topics related to space activities, programmes, initiatives and to ESA mission, programmes and activities; to analyse and monitor Your interactions with the website; to deal with your current and future queries or requests formulated on such website(s) or to otherwise engage with you; to analyse and monitor Your reactions to ESA activities, programmes and initiatives as well as to various posts, statements or declarations made in connection with space activities, programmes, initiatives in particular to optimise Our communication and engagement on websites; to ensure audience measurement; to grant a user access to specific functionalities of the website that require authentication; to better understand the needs and the browsing experience of ESA website visitors; to gather statistics with a view to improving our communication and to enhance user experience; to identify and track unauthorized access or any attempts of accessing our servers without permission; to defend the Agency from possible liability claims that may arise in connection with Our communication activities; to delete comments that seem to us as not relevant to the topic of website or account, offensive, abusive, etc. In the use of ESA websites You may find information (e.g., links to) third party websites that will be governed by separate Terms and Conditions. In case of voluntary registration and use of such third- party websites, their applicable terms and conditions and privacy policies will apply and the Agency has no control thereof. The use of third-party websites accessible via information present on ESA websites does not entail endorsement by ESA of the related terms and conditions or of their privacy policies. 4.5 IF YOU ARE USING SOCIAL MEDIA OR INTERACTING WITH ESA ACCOUNT(S) ON SOCIAL MEDIAInforming the broad public (including raising awareness about ESA activities among the general public in ESA Member States) and qualitative media monitoring, including monitoring and analysis of social media activities are public service tasks related to ESA mission as resulting from the ESA Convention. Your personal data are collected and further processed as necessary for the performance of such tasks.The processing of your social media personal data follows Your voluntary registration and use of social media (including forums, blogs, related APIs) and Your voluntary acceptance of their applicable terms and conditions and privacy policies, over which the Agency has no control. The use of social media by ESA does not entail endorsement by ESA of the related terms and conditions or of their privacy policies.Your social media personal data - collected and processed either directly by the Agency or by third-party companies, for the Agency or for the social media platforms - is used by or for the Agency for the communication activities, such as coordinating social media presence, for sending e-mails and invitations (this entails the management of contact lists for correspondence), for statistical and analytical purposes and, generally, for the promotion of the Agency’s communication campaigns and related activities and programmes.In particular, Your personal data is collected and further processed for the following purposes: to raise awareness or conduct surveys on topics related to space activities, programmes, initiatives and to ESA mission, programmes and activities; to deal with your current and future queries or requests formulated on such social media, platforms, account(s) or to otherwise engage with you; to ensure audience measurement; to gather statistics with a view to improving our communications and to enhance user experience; to analyse and monitor Your interactions with other users, in relation to space activities, programmes, initiat"
year_published = 2025
