["https://esa.int/About_Us/Careers_at_ESA/Five_reasons_to_join_the_European_Space_Agency"]
title = "ESA - Five reasons to join the European Space Agency!"
description = "In 2023, ESA published more than 400 vacancies in engineering, science and business and administration and more positions continue to be published as we are always on the lookout for talented new colleagues to join us. So, what does it mean to join ESA? Here are five reasons why you should consider ESA as the next step in your career!"
full_description = "Agency Five reasons to join the European Space Agency! 09/10/2024 30734 views 96 likes ESA / About Us / Careers at ESA In 2023, ESA published more than 400 vacancies in engineering, science and business and administration and more positions continue to be published as we are always on the lookout for talented new colleagues to join us. So, what does it mean to join ESA? Here are five reasons why you should consider ESA as the next step in your career! Euclid’s new image of star-forming region Messier 78 1. Inspiring space missionsOur mission is to watch over Earth, develop and launch inspiring space projects, train astronauts and push the boundaries of science and technology, seeking answers to the big questions about the Universe. Each person at ESA plays a part in making our objectives a reality and we are very proud to have already enjoyed many successes this year.So here are some examples of what has happened so far in 2024 to give you a taste of the kind of projects that you could be part of when you work at ESA (click on the links to find out more): Euclid’s new image of spiral galaxy NGC 6744 Most recently, in October, ESA's first planetary defence mission, Hera, was successfully launched from Cape Canaveral in Florida. In July, we celebrated the inaugural flight of Ariane 6, an outstanding achievement for all the teams working on the latest in Europe's Ariane rocket series. Thanks to the precise navigation by ESA’s Flight Dynamics team, Juice performed the first ever lunar-Earth flyby to reroute its path through space. ESA’s Euclid space mission, launched in 2023, revealed five unprecedented new views of the Universe. We also successfully launched the Arctic Weather Satellite in August and Sentinel-2C joined the Copernicus family in orbit in September.Interested to learn more about ESA’s missions? Visit the ESA portal. 1: 11 steps to make a space mission 2. Our employment packageESA is proud to be a place that looks after its people from the moment they sign their contract through to retirement – and beyond. So, in addition to our inspiring space missions, what else do we offer when you join us as an ESA staff member? ESA salaries and allowances: ESA salaries are exempt from national income tax in ESA Member States and depending on your personal circumstances, you may receive additional allowances such as family allowances, an expatriation allowance and an education allowance. Learn more here. Flexibility and work-life balance: Our flexible scheme is designed to help you tailor your work schedule to fit your personal needs. It includes the possibility to work remotely, flexible working hours and part-time opportunities (more details below: reason number 3!) Affiliation to the ESA social security scheme providing cover for sickness, maternity, accident and disability, as well as a full medical check each year and access to psychological support. A relocation support package for those who need to move country to work for ESA, which includes reimbursement of removal expenses and an installation allowance. A comprehensive catalogue of training courses on a wide range of topics covering technical skills, project management, leadership and more to support your professional growth. Affiliation to ESA’s pension scheme through which pension rights are accrued yearly and staff are eligible for a retirement pension from the age of 63 after completing 10 years of service. Learn more about these benefits here.Please note that the conditions for entry-level programmes may vary. Check the dedicated pages to see what they offer: Graduate Trainees, National Trainees, Research Fellows and Junior Professionals. Aeolus launch at Mission Control 3. Flexible working arrangements and leaveFlexible working arrangementsAt ESA, we work a 40-hour week, based on eight-hour days. Our flexible working hours scheme allows you to adjust your daily start and finish times to better suit your individual needs and commitments.When you join ESA, you also have the option to work remotely from your principal residence (within 100 km of your workplace in your duty country) for 40% of your work hours each month and up to 80% with the agreement of your management. With some limitations, it is also possible to work remotely from another country.In addition, we also offer part-time schemes at 50%, 60% or 80% of full-time hours, which can be adopted after you have been working at ESA for a certain amount of time.LeaveEach year, you are entitled to 12 public holidays and 32.5 days of annual leave (30 days for Young Graduate Trainees and Internal Research Fellows). Under certain conditions, an additional eight days’ home leave are granted to expatriate staff every two years. We also make provision for pregnancy leave, parental/family care and sick leave, special leave for personal and family related reasons. ESRIN and staff in 2013 4. Life at ESA: facilities and clubsESA offers a range of facilities and services at all establishments to improve the quality of your working life and work-life balance. Most ESA sites offer a subsidised restaurant and coffee bar, a medical centre, free car parking and electric car charging facilities, as well as sports facilities including gym and exercise classes (depending on the ESA establishment).While the ESA establishments vary in size and character, they all share a sense of community and team spirit that is tangible on each site. This is due in part to the wide variety of social, cultural and sports clubs all run by ESA volunteers, which are a great way to meet colleagues beyond your team while also pursuing your interests - or discovering new ones! ESA – made of people ESA Team DaysOnce a year, everyone at ESA is invited to participate in the ESA Team Day, when ESA people put aside their work duties and meet at their establishment to celebrate their achievements and the ESA team spirit. Each site offers a programme packed full of activities for this event that is a real highlight of the ESA calendar. ESA floating patch 5. International teamworkWhen you join ESA, you become part of a unique environment: a truly international space agency. Our 22 Member States work together, sharing financial and scientific resources to achieve the best results. But ESA's international collaboration doesn't stop there: we collaborate with nine further Cooperating States and Associate Members, national space agencies from across the globe, as well as space industries and partners. At ESA, we work at over nine locations in seven countries (France, Germany, the Netherlands, Italy, Belgium, Spain and the UK) and while the two official languages are English and French, you hear so many more just walking through your office building!We are professionals from more than 30 countries with expertise in diverse fields of science, engineering and business administration working together to make space work for everyone. We are passionate about what we do and this enthusiasm shines through in all aspects of life at ESA. Ready to join us?We regularly post job openings on our recruiting site and we recommend that you set up a job alert to be notified as soon as a vacancy matching your profile is published. Find out how to do so here.If you would like to receive notifications about news from ESA Careers, you can subscribe here.Finally, follow us on LinkedIn for vacancy highlights, ESA missions’ media and our very own careers newsletter. Like Thank you for liking You have already liked this page, you can only like it once!"
year_published = 2025
