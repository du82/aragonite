title = "esbuild - Gradient Transformation Tests"
full_description = "This page is a visual test of esbuild's transformation of modern CSS gradient syntax for older browsers. Each test case compares the browser's native rendering of the modern syntax to esbuild's transformation (which uses the legacy syntax instead). This makes it easy to visually verify that esbuild's transformation is correct as well as to visually inspect a given browser's rendering of these gradient syntax features. At the time of writing, the latest versions of Chrome and Safari (Chrome 120 and Safari 17.1) can natively render all of these test cases correctly, so you should expect these results to match in Chrome and Safari. However, the latest version of Firefox (Firefox 120) contains multiple gradient rendering bugs, so esbuild's transformation is currently necessary to get these test cases to render correctly in Firefox."
year_published = 2025
clearnet = "https://esbuild.github.io/gradient-tests"
