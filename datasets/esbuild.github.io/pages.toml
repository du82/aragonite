title = "esbuild - API"
full_description = '''APIThe API can be accessed in one of three languages: on the command line, in JavaScript, and in Go. The concepts and parameters are largely identical between the three languages so they will be presented together here instead of having separate documentation for each language. You can switch between languages using the CLI, JS, and Go tabs in the top-right corner of each code example. Some specifics for each language: CLI: If you are using the command-line API, it may be helpful to know that the flags come in one of three forms: --foo, --foo=bar, or --foo:bar. The form --foo is used for enabling boolean flags such as --minify, the form --foo=bar is used for flags that have a single value and are only specified once such as --platform=, and the form --foo:bar is used for flags that have multiple values and can be re-specified multiple times such as --external:. Also keep in mind that using a CLI (in general, not specific to esbuild) means that your current shell interprets the command's arguments before the command you are running sees them. For example, even though the echo command just writes out what it reads in, echo "foo" can print foo instead of "foo", and echo *.json can print package.json instead of *.json (the specific behavior depends on which shell you use). If you want to avoid the problems that shell-specific behavior can cause, then you should use esbuild's JavaScript or Go APIs instead of esbuild's CLI. JavaScript: If you are using JavaScript be sure to check out the JS-specific details and browser sections below. You may also find the TypeScript type definitions for esbuild helpful as a reference. Go: If you are using Go, you may find the automatically generated Go documentation for esbuild helpful as a reference. There is separate documentation for both of the public Go packages: pkg/api and pkg/cli. #OverviewThe two most commonly-used esbuild APIs are build and transform. Each is described below at a high level, followed by documentation for each individual API option.#BuildThis is the primary interface to esbuild. You typically pass one or more entry point files to process along with various options, and then esbuild writes the results back out to the file system. Here's a simple example that enables bundling with an output directory: CLI JS Go esbuild app.ts --bundle --outdir=dist import * as esbuild from 'esbuild' let result = await esbuild.build({ entryPoints: ['app.ts'], bundle: true, outdir: 'dist', }) console.log(result) package main import "github.com/evanw/esbuild/pkg/api" import "os" func main() { result := api.Build(api.BuildOptions{ EntryPoints: []string{"app.ts"}, Bundle: true, Outdir: "dist", }) if len(result.Errors) != 0 { os.Exit(1) } } Advanced use of the build API involves setting up a long-running build context. This context is an explicit object in JS and Go but is implicit with the CLI. All builds done with a given context share the same build options, and subsequent builds are done incrementally (i.e. they reuse some work from previous builds to improve performance). This is useful for development because esbuild can rebuild your app in the background for you while you work.There are three different incremental build APIs:Watch mode tells esbuild to watch the file system and automatically rebuild for you whenever you edit and save a file that could invalidate the build. Here's an example: CLI JS Go esbuild app.ts --bundle --outdir=dist --watch [watch] build finished, watching for changes... let ctx = await esbuild.context({ entryPoints: ['app.ts'], bundle: true, outdir: 'dist', }) await ctx.watch() ctx, err := api.Context(api.BuildOptions{ EntryPoints: []string{"app.ts"}, Bundle: true, Outdir: "dist", }) err2 := ctx.Watch(api.WatchOptions{}) Serve mode starts a local development server that serves the results of the latest build. Incoming requests automatically start new builds so your web app is always up to date when you reload the page in the browser. Here's an example: CLI JS Go esbuild app.ts --bundle --outdir=dist --serve > Local: http://127.0.0.1:8000/ > Network: http://192.168.0.1:8000/ 127.0.0.1:61302 - "GET /" 200 [1ms] let ctx = await esbuild.context({ entryPoints: ['app.ts'], bundle: true, outdir: 'dist', }) let { host, port } = await ctx.serve() ctx, err := api.Context(api.BuildOptions{ EntryPoints: []string{"app.ts"}, Bundle: true, Outdir: "dist", }) server, err2 := ctx.Serve(api.ServeOptions{}) Rebuild mode lets you manually invoke a build. This is useful when integrating esbuild with other tools (e.g. using a custom file watcher or development server instead of esbuild's built-in ones). Here's an example: CLI JS Go # The CLI does not have an API for "rebuild" let ctx = await esbuild.context({ entryPoints: ['app.ts'], bundle: true, outdir: 'dist', }) for (let i = 0; i < 5; i++) { let result = await ctx.rebuild() } ctx, err := api.Context(api.BuildOptions{ EntryPoints: []string{"app.ts"}, Bundle: true, Outdir: "dist", }) for i := 0; i < 5; i++ { result := ctx.Rebuild() } These three incremental build APIs can be combined. To enable live reloading (automatically reloading the page when you edit and save a file) you'll need to enable watch and serve together on the same context.When you are done with a context object, you can call dispose() on the context to wait for existing builds to finish, stop watch and/or serve mode, and free up resources.The build and context APIs both take the following options:General options:BundleCancelLive reloadPlatformRebuildServeTsconfigTsconfig rawWatchInput:Entry pointsLoaderStdinOutput contents:BannerCharsetFooterFormatGlobal nameLegal commentsLine limitSplittingOutput location:Allow overwriteAsset namesChunk namesEntry namesOut extensionOutbaseOutdirOutfilePublic pathWritePath resolution:AliasConditionsExternalMain fieldsNode pathsPackagesPreserve symlinksResolve extensionsWorking directoryTransformation:JSXJSX devJSX factoryJSX fragmentJSX import sourceJSX side effectsSupportedTargetOptimization:DefineDropDrop labelsIgnore annotationsInjectKeep namesMangle propsMinifyPureTree shakingSource maps:Source rootSourcefileSourcemapSources contentBuild metadata:AnalyzeMetafileLogging:ColorFormat messagesLog levelLog limitLog override#TransformThis is a limited special-case of build that transforms a string of code representing an in-memory file in an isolated environment that's completely disconnected from any other files. Common uses include minifying code and transforming TypeScript into JavaScript. Here's an example: CLI JS Go echo 'let x: number = 1' | esbuild --loader=ts let x = 1; import * as esbuild from 'esbuild' let ts = 'let x: number = 1' let result = await esbuild.transform(ts, { loader: 'ts', }) console.log(result) package main import "fmt" import "github.com/evanw/esbuild/pkg/api" func main() { ts := "let x: number = 1" result := api.Transform(ts, api.TransformOptions{ Loader: api.LoaderTS, }) if len(result.Errors) == 0 { fmt.Printf("%s", result.Code) } } Taking a string instead of a file as input is more ergonomic for certain use cases. File system isolation has certain advantages (e.g. works in the browser, not affected by nearby package.json files) and certain disadvantages (e.g. can't be used with bundling or plugins). If your use case doesn't fit the transform API then you should use the more general build API instead.The transform API takes the following options:General options:PlatformTsconfig rawInput:LoaderOutput contents:BannerCharsetFooterFormatGlobal nameLegal commentsLine limitTransformation:JSXJSX devJSX factoryJSX fragmentJSX import sourceJSX side effectsSupportedTargetOptimization:DefineDropDrop labelsIgnore annotationsKeep namesMangle propsMinifyPureTree shakingSource maps:Source rootSourcefileSourcemapSources contentLogging:ColorFormat messagesLog levelLog limitLog override#JS-specific detailsThe JS API for esbuild comes in both asynchronous and synchronous flavors. The asynchronous API is recommended because it works in all environments and it's faster and more powerful. The synchronous API only works in node and can only do certain things, but it's sometimes necessary in certain node-specific situations. In detail:#Async APIAsynchronous API calls return their results using a promise. Note that you'll likely have to use the .mjs file extension in node due to the use of the import and top-level await keywords:import * as esbuild from 'esbuild' let result1 = await esbuild.transform(code, options) let result2 = await esbuild.build(options)Pros:You can use plugins with the asynchronous APIThe current thread is not blocked so you can perform other work in the meantimeYou can run many simultaneous esbuild API calls concurrently which are then spread across all available CPUs for maximum performanceCons:Using promises can result in messier code, especially in CommonJS where top-level await is not availableDoesn't work in situations that must be synchronous such as within require.extensions#Sync APISynchronous API calls return their results inline:let esbuild = require('esbuild') let result1 = esbuild.transformSync(code, options) let result2 = esbuild.buildSync(options)Pros:Avoiding promises can result in cleaner code, especially when top-level await is not availableWorks in situations that must be synchronous such as within require.extensionsCons:You can't use plugins with the synchronous API since plugins are asynchronousIt blocks the current thread so you can't perform other work in the meantimeUsing the synchronous API prevents esbuild from parallelizing esbuild API calls#In the browserThe esbuild API can also run in the browser using WebAssembly in a Web Worker. To take advantage of this you will need to install the esbuild-wasm package instead of the esbuild package:npm install esbuild-wasmThe API for the browser is similar to the API for node except that you need to call initialize() first, and you need to pass the URL of the WebAssembly binary. The synchronous versions of the API are also not available. Assuming you are using a bundler, that would look something like this:import * as esbuild from 'esbuild-wasm' await esbuild.initialize({ wasmURL: './node_modules/esbuild-wasm/esbuild.wasm', }) let result1 = await esbuild.transform(code, options) let result2 = esbuild.build(options)If you're already running this code from a worker and don't want initialize to create another worker, you can pass worker: false to it. Then it will create a WebAssembly module in the same thread as the thread that calls initialize.You can also use esbuild's API as a script tag in a HTML file without needing to use a bundler by loading the lib/browser.min.js file with a <script> tag. In this case the API creates a global called esbuild that holds the API object:<script src="./node_modules/esbuild-wasm/lib/browser.min.js"></script> <script> esbuild.initialize({ wasmURL: './node_modules/esbuild-wasm/esbuild.wasm', }).then(() => { ... }) </script>If you want to use this API with ECMAScript modules, you should import the esm/browser.min.js file instead:<script type="module"> import * as esbuild from './node_modules/esbuild-wasm/esm/browser.min.js' await esbuild.initialize({ wasmURL: './node_modules/esbuild-wasm/esbuild.wasm', }) ... </script>#General options#BundleSupported by: BuildTo bundle a file means to inline any imported dependencies into the file itself. This process is recursive so dependencies of dependencies (and so on) will also be inlined. By default esbuild will not bundle the input files. Bundling must be explicitly enabled like this: CLI JS Go esbuild in.js --bundle import * as esbuild from 'esbuild' console.log(await esbuild.build({ entryPoints: ['in.js'], bundle: true, outfile: 'out.js', })) package main import "github.com/evanw/esbuild/pkg/api" import "os" func main() { result := api.Build(api.BuildOptions{ EntryPoints: []string{"in.js"}, Bundle: true, }) if len(result.Errors) > 0 { os.Exit(1) } } Refer to the getting started guide for an example of bundling with real-world code.Note that bundling is different than file concatenation. Passing esbuild multiple input files with bundling enabled will create multiple separate bundles instead of joining the input files together. To join a set of files together with esbuild, import them all into a single entry point file and bundle just that one file with esbuild.#Non-analyzable importsImport paths are currently only bundled if they are a string literal or a glob pattern. Other forms of import paths are not bundled, and are instead preserved verbatim in the generated output. This is because bundling is a compile-time operation and esbuild doesn't support all forms of run-time path resolution. Here are some examples:// Analyzable imports (will be bundled by esbuild) import 'pkg'; import('pkg'); require('pkg'); import(`./locale-${foo}.json`); require(`./locale-${foo}.json`); // Non-analyzable imports (will not be bundled by esbuild) import(`pkg/${foo}`); require(`pkg/${foo}`); ['pkg'].map(require);The way to work around non-analyzable imports is to mark the package containing this problematic code as external so that it's not included in the bundle. You will then need to ensure that a copy of the external package is available to your bundled code at run-time.Some bundlers such as Webpack try to support all forms of run-time path resolution by including all potentially-reachable files in the bundle and then emulating a file system at run-time. However, run-time file system emulation is out of scope and will not be implemented in esbuild. If you really need to bundle code that does this, you will likely need to use another bundler instead of esbuild.#Glob-style importsImport paths that are evaluated at run-time can now be bundled in certain limited situations. The import path expression must be a form of string concatenation and must start with either ./ or ../. Each non-string expression in the string concatenation chain becomes a wildcard in a glob pattern. Some examples:// These two forms are equivalent const json1 = require('./data/' + kind + '.json') const json2 = require(`./data/${kind}.json`)When you do this, esbuild will search the file system for all files that match the pattern and include all of them in the bundle along with a map that maps the matching import path to the bundled module. The import expression will be replaced with a lookup into that map. An error will be thrown at run-time if the import path is not present in the map. The generated code will look something like this (unimportant parts were omitted for brevity):// data/bar.json var require_bar = ...; // data/foo.json var require_foo = ...; // require("./data/**/*.json") in example.js var globRequire_data_json = __glob({ "./data/bar.json": () => require_bar(), "./data/foo.json": () => require_foo() }); // example.js var json1 = globRequire_data_json("./data/" + kind + ".json"); var json2 = globRequire_data_json(`./data/${kind}.json`);This feature works with require(...) and import(...) because'''
