title = "esbuild - An extremely fast bundler for the web"
full_description = 'esbuildAn extremely fast bundler for the web@keyframes bench0-anim{0%{left:0}to{left:85.915%}}#bench0-progress{animation:bench0-anim 41.21s linear;left:85.915%}.bench0-bar0{animation:scale-bar .39s linear;transform-origin:left}.bench0-bar1{animation:scale-bar 14.91s linear;transform-origin:left}.bench0-bar2{animation:scale-bar 34.1s linear;transform-origin:left}.bench0-bar3{animation:scale-bar 41.21s linear;transform-origin:left}esbuild0.39sparcel 214.91srollup 4 + terser34.10swebpack 541.21s0s10s20s30s40s(function(){var e=document.getElementById("bench0-progress"),n,t,a=function(){t||(t=e.getAnimations()[0]),t&&(e.textContent=Math.floor(t.timeline.currentTime/1e3)+"s",t.playState==="finished"&&(clearInterval(n),e.style.display="none"))};e.getAnimations&&(n=setInterval(a,250),a())})();Above: the time to do a production bundle of 10 copies of the three.js library from scratch using default settings, including minification and source maps. More info here.Our current build tools for the web are 10-100x slower than they could be. The main goal of the esbuild bundler project is to bring about a new era of build tool performance, and create an easy-to-use modern bundler along the way.Major features:Extreme speed without needing a cacheJavaScript, CSS, TypeScript, and JSX built-inA straightforward API for CLI, JS, and GoBundles ESM and CommonJS modulesBundles CSS including CSS modulesTree shaking, minification, and source mapsLocal server, watch mode, and pluginsCheck out the getting started instructions if you want to give esbuild a try.'
