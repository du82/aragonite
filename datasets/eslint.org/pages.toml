full_description = "Published under: Financials 6 min read Paying contributors, sponsoring projects, and more: ESLint's 2022 spending plan When ESLint first started accepting donations, we weren't quite sure how to fairly distribute the proceeds. Now, three years into accepting donations, we've settled on a plan for how to use our funds for the betterment of the ESLint project and ecosystem. Nicholas C. Zakas 23 Feb, 2022 Published under: Financials 4 min read A year of paying contributors: Review As part of the goals of the ESLint Collective, we have been paying contributors over the past year. We share the different approaches we tried and their results. We value the time of our contributors and we are continuously finding better ways to reward their work. Nicholas C. Zakas 07 Oct, 2020 Published under: Financials 2 min read Supporting ESLint's dependencies As part of our goal for open source sustainability, we are happy to announce that we're starting to support ESLint's dependencies. We're grateful to the projects upon which ESLint is built and we want to share our success with them. Thanks to our sponsors, we're able to help them, and we hope to extend this to more dependencies. Nicholas C. Zakas 16 Sep, 2020 Published under: Financials 3 min read Funding ESLint's Future: November Update We are happy to announce that we are currently sponsored at just under $10,000 per month. We share how we've used the money and what our sponsors are telling us. Thanks to the ESLint Collective, we are looking forward to a brighter future for ESLint. Kai Cataldo 07 Nov, 2019"
