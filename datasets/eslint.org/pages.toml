["https://eslint.org/docs/latest/use/getting-started"]
title = "Getting Started with ESLint - ESLint - Pluggable JavaScript Linter"
description = "A pluggable and configurable linter tool for identifying and reporting on patterns in JavaScript. Maintain your code quality with ease."
full_description = '''Getting Started with ESLint Table of Contents Prerequisites Quick start Configuration Global Install Manual Set Up Next Steps ESLint is a tool for identifying and reporting on patterns found in ECMAScript/JavaScript code, with the goal of making code more consistent and avoiding bugs. ESLint is completely pluggable. Every single rule is a plugin and you can add more at runtime. You can also add community plugins, configurations, and parsers to extend the functionality of ESLint. Prerequisites To use ESLint, you must have Node.js (^18.18.0, ^20.9.0, or >=21.1.0) installed and built with SSL support. (If you are using an official Node.js distribution, SSL is always built in.) Quick start You can install and configure ESLint using this command: npm yarn pnpm bun npm npm init @eslint/config@latest 1 yarn yarn create @eslint/config 1 pnpm pnpm create @eslint/config@latest 1 bun bun create @eslint/config@latest 1 If you want to use a specific shareable config that is hosted on npm, you can use the --config option and specify the package name: npm yarn pnpm bun npm # use `eslint-config-standard` shared config - npm 7+ npm init @eslint/config@latest -- --config eslint-config-standard 12 yarn # use `eslint-config-standard` shared config - npm 7+ yarn create @eslint/config -- --config eslint-config-standard 12 pnpm # use `eslint-config-standard` shared config - npm 7+ pnpm create @eslint/config@latest -- --config eslint-config-standard 12 bun # use `eslint-config-standard` shared config - npm 7+ bun create @eslint/config@latest -- --config eslint-config-standard 12 Note: npm init @eslint/config assumes you have a package.json file already. If you don’t, make sure to run npm init or yarn init beforehand. After that, you can run ESLint on any file or directory like this: npm yarn pnpm bun npm npx eslint yourfile.js 1 yarn yarn dlx eslint yourfile.js 1 pnpm pnpm dlx eslint yourfile.js 1 bun bunx eslint yourfile.js 1 Configuration Note: If you are coming from a version before 9.0.0 please see the migration guide. When you run npm init @eslint/config, you’ll be asked a series of questions to determine how you’re using ESLint and what options should be included. After answering these questions, you’ll have an eslint.config.js (or eslint.config.mjs) file created in your directory. For example, one of the questions is “Where does your code run?” If you select “Browser” then your configuration file will contain the definitions for global variables found in web browsers. Here’s an example: import globals from "globals"; import pluginJs from "@eslint/js"; /** @type {import('eslint').Linter.Config[]} */ export default [ {languageOptions: { globals: globals.browser }}, pluginJs.configs.recommended, ]; 123456789The pluginJs.configs.recommended object contains configuration to ensure that all of the rules marked as recommended on the rules page will be turned on. Alternatively, you can use configurations that others have created by searching for “eslint-config” on npmjs.com. ESLint will not lint your code unless you extend from a shared configuration or explicitly turn rules on in your configuration. You can configure rules individually by defining a new object with a rules key, as in this example: import pluginJs from "@eslint/js"; export default [ pluginJs.configs.recommended, { rules: { "no-unused-vars": "warn", "no-undef": "warn" } } ]; 123456789101112The names "no-unused-vars" and "no-undef" are the names of rules in ESLint. The first value is the error level of the rule and can be one of these values: “off” or 0 - turn the rule off “warn” or 1 - turn the rule on as a warning (doesn’t affect exit code) “error” or 2 - turn the rule on as an error (exit code will be 1) The three error levels allow you fine-grained control over how ESLint applies rules (for more configuration options and details, see the configuration docs). Global Install It is also possible to install ESLint globally, rather than locally, using npm install eslint --global. However, this is not recommended, and any plugins or shareable configs that you use must still be installed locally if you install ESLint globally. Manual Set Up You can also manually set up ESLint in your project. Important If you are using pnpm, be sure to create a .npmrc file with at least the following settings: auto-install-peers=true node-linker=hoisted 12This ensures that pnpm installs dependencies in a way that is more compatible with npm and is less likely to produce errors. Before you begin, you must already have a package.json file. If you don’t, make sure to run npm init or yarn init to create the file beforehand. Install the ESLint packages in your project: npm yarn pnpm bun npm npm install --save-dev eslint @eslint/js 1 yarn yarn add --dev eslint @eslint/js 1 pnpm pnpm add --save-dev eslint @eslint/js 1 bun bun add --dev eslint @eslint/js 1 Add an eslint.config.js file: # Create JavaScript configuration file touch eslint.config.js 12 Add configuration to the eslint.config.js file. Refer to the Configure ESLint documentation to learn how to add rules, custom configurations, plugins, and more. import pluginJs from "@eslint/js"; export default [ pluginJs.configs.recommended, { rules: { "no-unused-vars": "warn", "no-undef": "warn" } } ]; 123456789101112 Lint code using the ESLint CLI: npm yarn pnpm bun npm npx eslint project-dir/ file.js 1 yarn yarn dlx eslint project-dir/ file.js 1 pnpm pnpm dlx eslint project-dir/ file.js 1 bun bunx eslint project-dir/ file.js 1 For more information on the available CLI options, refer to Command Line Interface. Next Steps Learn about advanced configuration of ESLint. Get familiar with the command line options. Explore ESLint integrations into other tools like editors, build systems, and more. Can’t find just the right rule? Make your own custom rule. Make ESLint even better by contributing. Edit this page'''
