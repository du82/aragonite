["https://eslint.org/docs/latest/use/configure/configuration-files"]
title = "Configuration Files - ESLint - Pluggable JavaScript Linter"
description = "A pluggable and configurable linter tool for identifying and reporting on patterns in JavaScript. Maintain your code quality with ease."
full_description = 'Configuration Files Table of Contents Configuration File Configuration Objects Specifying files and ignores Excluding files with ignores Specifying files with arbitrary extensions Specifying files without extension Globally ignoring files with ignores Cascading Configuration Objects Configuring Linter Options Disabling Inline Configuration Reporting Unused Disable Directives Reporting Unused Inline Configs Configuring Rules Configuring Shared Settings Using Predefined Configurations Configuration Naming Conventions Using a Shareable Configuration Package Configuration File Resolution Experimental Configuration File Resolution TypeScript Configuration Files Configuration File Precedence Tip This page explains how to use flat config files. For the deprecated eslintrc format, see the deprecated documentation. You can put your ESLint project configuration in a configuration file. You can include built-in rules, how you want them enforced, plugins with custom rules, shareable configurations, which files you want rules to apply to, and more. Configuration File The ESLint configuration file may be named any of the following: eslint.config.js eslint.config.mjs eslint.config.cjs eslint.config.ts (requires additional setup) eslint.config.mts (requires additional setup) eslint.config.cts (requires additional setup) It should be placed in the root directory of your project and export an array of configuration objects. Here’s an example: // eslint.config.js export default [ { rules: { semi: "error", "prefer-const": "error" } } ]; 123456789In this example, the configuration array contains just one configuration object. The configuration object enables two rules: semi and prefer-const. These rules are applied to all of the files ESLint processes using this config file. If your project does not specify "type":"module" in its package.json file, then eslint.config.js must be in CommonJS format, such as: // eslint.config.js module.exports = [ { rules: { semi: "error", "prefer-const": "error" } } ]; 123456789Configuration Objects Each configuration object contains all of the information ESLint needs to execute on a set of files. Each configuration object is made up of these properties: name - A name for the configuration object. This is used in error messages and config inspector to help identify which configuration object is being used. (Naming Convention) files - An array of glob patterns indicating the files that the configuration object should apply to. If not specified, the configuration object applies to all files matched by any other configuration object. ignores - An array of glob patterns indicating the files that the configuration object should not apply to. If not specified, the configuration object applies to all files matched by files. If ignores is used without any other keys in the configuration object, then the patterns act as global ignores and it gets applied to every configuration object. languageOptions - An object containing settings related to how JavaScript is configured for linting. ecmaVersion - The version of ECMAScript to support. May be any year (i.e., 2022) or version (i.e., 5). Set to "latest" for the most recent supported version. (default: "latest") sourceType - The type of JavaScript source code. Possible values are "script" for traditional script files, "module" for ECMAScript modules (ESM), and "commonjs" for CommonJS files. (default: "module" for .js and .mjs files; "commonjs" for .cjs files) globals - An object specifying additional objects that should be added to the global scope during linting. parser - An object containing a parse() method or a parseForESLint() method. (default: espree) parserOptions - An object specifying additional options that are passed directly to the parse() or parseForESLint() method on the parser. The available options are parser-dependent. linterOptions - An object containing settings related to the linting process. noInlineConfig - A Boolean value indicating if inline configuration is allowed. reportUnusedDisableDirectives - A severity string indicating if and how unused disable and enable directives should be tracked and reported. For legacy compatibility, true is equivalent to "warn" and false is equivalent to "off". (default: "warn"). reportUnusedInlineConfigs - A severity string indicating if and how unused inline configs should be tracked and reported. (default: "off") processor - Either an object containing preprocess() and postprocess() methods or a string indicating the name of a processor inside of a plugin (i.e., "pluginName/processorName"). plugins - An object containing a name-value mapping of plugin names to plugin objects. When files is specified, these plugins are only available to the matching files. rules - An object containing the configured rules. When files or ignores are specified, these rule configurations are only available to the matching files. settings - An object containing name-value pairs of information that should be available to all rules. Specifying files and ignores Tip Patterns specified in files and ignores use minimatch syntax and are evaluated relative to the location of the eslint.config.js file. If using an alternate config file via the --config command line option, then all patterns are evaluated relative to the current working directory. You can use a combination of files and ignores to determine which files the configuration object should apply to and which not. By default, ESLint lints files that match the patterns **/*.js, **/*.cjs, and **/*.mjs. Those files are always matched unless you explicitly exclude them using global ignores. Because config objects that don’t specify files or ignores apply to all files that have been matched by any other configuration object, they will apply to all JavaScript files. For example: // eslint.config.js export default [ { rules: { semi: "error" } } ]; 12345678With this configuration, the semi rule is enabled for all files that match the default files in ESLint. So if you pass example.js to ESLint, the semi rule is applied. If you pass a non-JavaScript file, like example.txt, the semi rule is not applied because there are no other configuration objects that match that filename. (ESLint outputs an error message letting you know that the file was ignored due to missing configuration.) Excluding files with ignores You can limit which files a configuration object applies to by specifying a combination of files and ignores patterns. For example, you may want certain rules to apply only to files in your src directory: // eslint.config.js export default [ { files: ["src/**/*.js"], rules: { semi: "error" } } ]; 123456789Here, only the JavaScript files in the src directory have the semi rule applied. If you run ESLint on files in another directory, this configuration object is skipped. By adding ignores, you can also remove some of the files in src from this configuration object: export default [ { files: ["src/**/*.js"], ignores: ["**/*.config.js"], rules: { semi: "error" } } ]; 123456789This configuration object matches all JavaScript files in the src directory except those that end with .config.js. You can also use negation patterns in ignores to exclude files from the ignore patterns, such as: export default [ { files: ["src/**/*.js"], ignores: ["**/*.config.js", "!**/eslint.config.js"], rules: { semi: "error" } } ]; 123456789Here, the configuration object excludes files ending with .config.js except for eslint.config.js. That file still has semi applied. Non-global ignores patterns can only match file names. A pattern like "dir-to-exclude/" will not ignore anything. To ignore everything in a particular directory, a pattern like "dir-to-exclude/**" should be used instead. If ignores is used without files and there are other keys (such as rules), then the configuration object applies to all linted files except the ones excluded by ignores, for example: export default [ { ignores: ["**/*.config.js"], rules: { semi: "error" } } ]; 12345678This configuration object applies to all JavaScript files except those ending with .config.js. Effectively, this is like having files set to **/*. In general, it’s a good idea to always include files if you are specifying ignores. Note that when files is not specified, negated ignores patterns do not cause any matching files to be linted automatically. ESLint only lints files that are matched either by default or by a files pattern that is not * and does not end with /* or /**. Tip Use the config inspector (--inspect-config in the CLI) to test which config objects apply to a specific file. Specifying files with arbitrary extensions To lint files with extensions other than the default .js, .cjs and .mjs, include them in files with a pattern in the format of "**/*.extension". Any pattern will work except if it is * or if it ends with /* or /**. For example, to lint TypeScript files with .ts, .cts and .mts extensions, you would specify a configuration object like this: // eslint.config.js export default [ { files: [ "**/*.ts", "**/*.cts", "**.*.mts" ] }, // ...other config ]; 1234567891011Specifying files without extension Files without an extension can be matched with the pattern !(*.*). For example: // eslint.config.js export default [ { files: ["**/!(*.*)"] }, // ...other config ]; 1234567The above config lints files without extension besides the default .js, .cjs and .mjs extensions in all directories. Tip Filenames starting with a dot, such as .gitignore, are considered to have only an extension without a base name. In the case of .gitignore, the extension is gitignore, so the file matches the pattern "**/.gitignore" but not "**/*.gitignore". Globally ignoring files with ignores Depending on how the ignores property is used, it can behave as non-global ignores or as global ignores. When ignores is used without any other keys (besides name) in the configuration object, then the patterns act as global ignores. This means they apply to every configuration object (not only to the configuration object in which it is defined). Global ignores allows you not to have to copy and keep the ignores property synchronized in more than one configuration object. If ignores is used with other properties in the same configuration object, then the patterns act as non-global ignores. This way ignores applies only to the configuration object in which it is defined. Global and non-global ignores have some usage differences: patterns in non-global ignores only match the files (dir/filename.js) or files within directories (dir/**) patterns in global ignores can match directories (dir/) in addition to the patterns that non-global ignores supports. For all uses of ignores: The patterns you define are added after the default ESLint patterns, which are ["**/node_modules/", ".git/"]. The patterns always match files and directories that begin with a dot, such as .foo.js or .fixtures, unless those files are explicitly ignored. The only dot directory ignored by default is .git. // eslint.config.js // Example of global ignores export default [ { ignores: [".config/", "dist/", "tsconfig.json"] // acts as global ignores, due to the absence of other properties }, { ... }, // ... other configuration object, inherit global ignores { ... }, // ... other configuration object inherit global ignores ]; // Example of non-global ignores export default [ { ignores: [".config/**", "dir1/script1.js"], rules: { ... } // the presence of this property dictates non-global ignores }, { ignores: ["other-dir/**", "dist/script2.js"], rules: { ... } // the presence of this property dictates non-global ignores }, ]; 12345678910111213141516171819202122For more information and examples on configuring rules regarding ignores, see Ignore Files. Cascading Configuration Objects When more than one configuration object matches a given filename, the configuration objects are merged with later objects overriding previous objects when there is a conflict. For example: // eslint.config.js export default [ { files: ["**/*.js"], languageOptions: { globals: { MY_CUSTOM_GLOBAL: "readonly" } } }, { files: ["tests/**/*.js"], languageOptions: { globals: { it: "readonly", describe: "readonly" } } } ]; 1234567891011121314151617181920Using this configuration, all JavaScript files define a custom global object defined called MY_CUSTOM_GLOBAL while those JavaScript files in the tests directory have it and describe defined as global objects in addition to MY_CUSTOM_GLOBAL. For any JavaScript file in the tests directory, both configuration objects are applied, so languageOptions.globals are merged to create a final result. Configuring Linter Options Options specific to the linting process can be configured using the linterOptions object. These effect how linting proceeds and does not affect how the source code of the file is interpreted. Disabling Inline Configuration Inline configuration is implemented using an /*eslint*/ comment, such as /*eslint semi: error*/. You can disallow inline configuration by setting noInlineConfig to true. When enabled, all inline configuration is ignored. Here’s an example: // eslint.config.js export default [ { files: ["**/*.js"], linterOptions: { noInlineConfig: true } } ]; 123456789Reporting Unused Disable Directives Disable and enable directives such as /*eslint-disable*/, /*eslint-enable*/ and /*eslint-disable-next-line*/ are used to disable ESLint rules around certain portions of code. As code changes, it’s possible for these directives to no longer be needed because the code has changed in such a way that the rule is no longer triggered. You can enable reporting of these unused disable directives by setting the reportUnusedDisableDirectives option to a severity string, as in this example: // eslint.config.js export default [ { files: ["**/*.js"], linterOptions: { reportUnusedDisableDirectives: "error" } } ]; 123456789This setting defaults to "warn". You can override this setting using the --report-unused-disable-directives or the --report-unused-disable-directives-severity command line options. For legacy compatibility, true is equivalent to "warn" and false is equivalent to "off". Reporting Unused Inline Configs Inline config comments such as /* eslint rule-name: "error" */ are used to change ESLint rule severity and/or options around certain portions of code. As a project’s ESLint configuration file changes, it’s possible for these directives to no longer be different from what was already set. You can enable reporting of these unused inline config comments by setting the reportUnusedInlineConfigs option to a severity string, as in this example: // eslint.config.js export default [ { files: ["**/*.js"], linterOptions: { reportUnusedInlineConfigs: "error" } } ]; 123456789You can override this setting using the --report-unused-inline-configs command line option. Configuring Rules You can configure any number of rules in a configuration object by add a rules property containing an object with your rule co'
