title = "Migrate to v9.x - ESLint - Pluggable JavaScript Linter"
description = "A pluggable and configurable linter tool for identifying and reporting on patterns in JavaScript. Maintain your code quality with ease."
full_description = '''Migrate to v9.x Table of Contents Table of Contents Breaking changes for users Breaking changes for plugin developers Breaking changes for integration developers Node.js < v18.18, v19 are no longer supported New default config format (eslint.config.js) Removed multiple formatters Removed require-jsdoc and valid-jsdoc rules eslint:recommended has been updated --quiet no longer runs rules set to "warn" --output-file now writes a file to disk even with an empty output Change in behavior when no patterns are passed to CLI /* eslint */ comments with only severity now retain options from the config file Multiple /* eslint */ comments for the same rule are now disallowed Stricter /* exported */ parsing no-constructor-return and no-sequences rule schemas are stricter New checks in no-implicit-coercion by default Case-sensitive flags in no-invalid-regexp varsIgnorePattern option of no-unused-vars no longer applies to catch arguments no-restricted-imports now accepts multiple config entries with the same name "eslint:recommended" and "eslint:all" no longer accepted in flat config no-inner-declarations has a new default behavior with a new option no-unused-vars now defaults caughtErrors to "all" no-useless-computed-key flags unnecessary computed member names in classes by default camelcase allow option only accepts an array of strings Removed multiple context methods Removed sourceCode.getComments() Removed CodePath#currentSegments Code paths are now precalculated Function-style rules are no longer supported meta.schema is required for rules with options FlatRuleTester is now RuleTester Stricter RuleTester checks FlatESLint is now ESLint Linter now expects flat config format ESLint v9.0.0 is a major release of ESLint, and as such, has several breaking changes that you need to be aware of. This guide is intended to walk you through the breaking changes. The lists below are ordered roughly by the number of users each change is expected to affect, where the first items are expected to affect the most users. Table of Contents Breaking changes for users Node.js < v18.18, v19 are no longer supported New default config format (eslint.config.js) Removed multiple formatters Removed require-jsdoc and valid-jsdoc rules eslint:recommended has been updated --quiet no longer runs rules set to "warn" --output-file now writes a file to disk even with an empty output Change in behavior when no patterns are passed to CLI /* eslint */ comments with only severity now retain options from the config file Multiple /* eslint */ comments for the same rule are now disallowed Stricter /* exported */ parsing no-constructor-return and no-sequences rule schemas are stricter New checks in no-implicit-coercion by default Case-sensitive flags in no-invalid-regexp varsIgnorePattern option of no-unused-vars no longer applies to catch arguments no-restricted-imports now accepts multiple config entries with the same name "eslint:recommended" and "eslint:all" strings no longer accepted in flat config no-inner-declarations has a new default behavior with a new option no-unused-vars now defaults caughtErrors to "all" no-useless-computed-key flags unnecessary computed member names in classes by default camelcase allow option only accepts an array of strings Breaking changes for plugin developers Node.js < v18.18, v19 are no longer supported Removed multiple context methods Removed sourceCode.getComments() Removed CodePath#currentSegments Code paths are now precalculated Function-style rules are no longer supported meta.schema is required for rules with options FlatRuleTester is now RuleTester Stricter RuleTester checks Breaking changes for integration developers Node.js < v18.18, v19 are no longer supported FlatESLint is now ESLint Linter now expects flat config format Node.js < v18.18, v19 are no longer supported ESLint is officially dropping support for these versions of Node.js starting with ESLint v9.0.0. ESLint now supports the following versions of Node.js: Node.js v18.18.0 and above Node.js v20.9.0 and above Node.js v21 and above To address: Make sure you upgrade to at least Node.js v18.18.0 when using ESLint v9.0.0. One important thing to double check is the Node.js version supported by your editor when using ESLint via editor integrations. If you are unable to upgrade, we recommend continuing to use ESLint v8.56.0 until you are able to upgrade Node.js. Related issue(s): #17595 New default config format (eslint.config.js) As announced in our blog post, in ESLint v9.0.0, eslint.config.js is the new default configuration format. The previous format, eslintrc, is now deprecated and will not automatically be searched for. To address: Update your configuration to the new format following the Configuration Migration Guide. In case you still need to use the deprecated eslintrc config format, set environment variable ESLINT_USE_FLAT_CONFIG to false. Related Issues(s): #13481 Removed multiple formatters ESLint v9.0.0 has removed the following formatters from the core: Removed Formatter Replacement npm Package checkstyle eslint-formatter-checkstyle compact eslint-formatter-compact jslint-xml eslint-formatter-jslint-xml junit eslint-formatter-junit tap eslint-formatter-tap unix eslint-formatter-unix visualstudio eslint-formatter-visualstudio To address: If you are using any of these formatters via the -f command line flag, you’ll need to install the respective package for the formatter. Related issue(s): #17524 Removed require-jsdoc and valid-jsdoc rules The require-jsdoc and valid-jsdoc rules have been removed in ESLint v9.0.0. These rules were initially deprecated in 2018. To address: Use the replacement rules in eslint-plugin-jsdoc. Related issue(s): #15820 eslint:recommended has been updated Four new rules have been enabled in eslint:recommended: no-constant-binary-expression no-empty-static-block no-new-native-nonconstructor no-unused-private-class-members Additionally, the following rules have been removed from eslint:recommended: no-extra-semi no-inner-declarations no-mixed-spaces-and-tabs no-new-symbol To address: Fix errors or disable these rules. Related issue(s): #15576, #17446, #17596 --quiet no longer runs rules set to "warn" Prior to ESLint v9.0.0, the --quiet CLI flag would run all rules set to either "error" or "warn" and then hide the results from rules set to "warn". In ESLint v9.0.0, --quiet will prevent rules from being executed when set to "warn". This can result in a performance improvement for configurations containing many rules set to "warn". If --max-warnings is used then --quiet will not suppress the execution of rules set to "warn" but the output of those rules will be suppressed. To address: In most cases, this change is transparent. If, however, you are running a rule set to "warn" that makes changes to the data available to other rules (for example, if the rule uses sourceCode.markVariableAsUsed()), then this can result in a behavior change. In such a case, you’ll need to either set the rule to "error" or stop using --quiet. Related issue(s): #16450 --output-file now writes a file to disk even with an empty output Prior to ESLint v9.0.0, the --output-file flag would skip writing a file to disk if the output was empty. However, in ESLint v9.0.0, --output-file now consistently writes a file to disk, even when the output is empty. This update ensures a more consistent and reliable behavior for --output-file. To address: Review your usage of the --output-file flag, especially if your processes depend on the file’s presence or absence based on output content. If necessary, update your scripts or configurations to accommodate this change. Related Issues(s): #17660 Change in behavior when no patterns are passed to CLI Prior to ESLint v9.0.0, running the ESLint CLI without any file or directory patterns would result in no files being linted and would exit with code 0. This was confusing because it wasn’t clear that nothing had actually happened. In ESLint v9.0.0, this behavior has been updated: Flat config. If you are using flat config, you can run npx eslint or eslint (if globally installed) and ESLint will assume you want to lint the current directory. Effectively, passing no patterns is equivalent to passing .. eslintrc. If you are using the deprecated eslintrc config, you’ll now receive an error when running the CLI without any patterns. To address: In most cases, no change is necessary, and you may find some locations where you thought ESLint was running but it wasn’t. If you’d like to keep the v8.x behavior, where passing no patterns results in ESLint exiting with code 0, add the --pass-on-no-patterns flag to the CLI call. Related issue(s): #14308 /* eslint */ comments with only severity now retain options from the config file Prior to ESLint v9.0.0, configuration comments such as /* eslint curly: "warn" */ or /* eslint curly: ["warn"] */ would completely override any configuration specified for the rule in the config file, and thus enforce the default options of the rule. In ESLint v9.0.0, the behavior of configuration comments is aligned with how rule configurations in config files are merged, meaning that a configuration comment with only severity now retains options specified in the config file and just overrides the severity. For example, if you have the following config file: // eslint.config.js export default [{ rules: { curly: ["error", "multi"] } }]; 1234567and the following configuration comment: // my-file.js /* eslint curly: "warn" */ 123the resulting configuration for the curly rule when linting my-file.js will be curly: ["warn", "multi"]. Note that this change only affects cases where the same rule is configured in the config file with options and using a configuration comment without options. In all other cases (e.g. the rule is only configured using a configuration comment), the behavior remains the same as prior to ESLint v9.0.0. To address: We expect that in most cases no change is necessary, as rules configured using configuration comments are typically not already configured in the config file. However, if you need a configuration comment to completely override configuration from the config file and enforce the default options, you’ll need to specify at least one option: // my-file.js /* eslint curly: ["warn", "all"] */ 123Related issue(s): #17381 Multiple /* eslint */ comments for the same rule are now disallowed Prior to ESLint v9.0.0, if the file being linted contained multiple /* eslint */ configuration comments for the same rule, the last one would be applied, while the others would be silently ignored. For example: /* eslint semi: ["error", "always"] */ /* eslint semi: ["error", "never"] */ foo() // valid, because the configuration is "never" 1234In ESLint v9.0.0, the first one is applied, while the others are reported as lint errors: /* eslint semi: ["error", "always"] */ /* eslint semi: ["error", "never"] */ // error: Rule "semi" is already configured by another configuration comment in the preceding code. This configuration is ignored. foo() // error: Missing semicolon 1234To address: Remove duplicate /* eslint */ comments. Related issue(s): #18132 Stricter /* exported */ parsing Prior to ESLint v9.0.0, the /* exported */ directive incorrectly allowed the following syntax: /* exported foo: true, bar: false */ // and /* exported foo bar */ 12345The true and false in this example had no effect on ESLint’s behavior, and in fact, was a parsing bug. In ESLint v9.0.0, any /* exported */ variables followed by a colon and value will be ignored as invalid. To address: Update any /* exported */ directives to eliminate the colons and subsequent values, and ensure there are commas between variable names such as: /* exported foo, bar */ 1Related issue(s): #17622 no-constructor-return and no-sequences rule schemas are stricter In previous versions of ESLint, no-constructor-return and no-sequences rules were mistakenly accepting invalid options. This has been fixed in ESLint v9.0.0: The no-constructor-return rule does not accept any options. The no-sequences rule can take one option, an object with a property "allowInParentheses" (boolean). { "rules": { "no-constructor-return": ["error"], "no-sequences": ["error", { "allowInParentheses": false }] } } 123456To address: If ESLint reports invalid configuration for any of these rules, update your configuration. Related issue(s): #16879 New checks in no-implicit-coercion by default In ESLint v9.0.0, the no-implicit-coercion rule additionally reports the following cases by default: -(-foo); foo - 0; 12To address: If you want to retain the previous behavior of this rule, set "allow": ["-", "- -"]. { "rules": { "no-implicit-coercion": [2, { "allow": ["-", "- -"] } ], } } 12345Related issue(s): #17832 Case-sensitive flags in no-invalid-regexp In ESLint v9.0.0, the option allowConstructorFlags is now case-sensitive. To address: Update your configuration if needed. Related issue(s): #16574 varsIgnorePattern option of no-unused-vars no longer applies to catch arguments In previous versions of ESLint, the varsIgnorePattern option of no-unused-vars incorrectly ignored errors specified in a catch clause. In ESLint v9.0.0, varsIgnorePattern no longer applies to errors in catch clauses. For example: /*eslint no-unused-vars: ["error", { "caughtErrors": "all", "varsIgnorePattern": "^err" }]*/ try { //... } catch (err) { // 'err' will be reported. console.error("errors"); } 12345678To address: If you want to specify ignore patterns for catch clause variable names, use the caughtErrorsIgnorePattern option in addition to varsIgnorePattern. Related issue(s): #17540 no-restricted-imports now accepts multiple config entries with the same name In previous versions of ESLint, if multiple entries in the paths array of your configuration for the no-restricted-imports rule had the same name property, only the last one would apply, while the previous ones would be ignored. As of ESLint v9.0.0, all entries apply, allowing for specifying different messages for different imported names. For example, you can now configure the rule like this: { rules: { "no-restricted-imports": ["error", { paths: [ { name: "react-native", importNames: ["Text"], message: "import 'Text' from 'ui/_components' instead" }, { name: "react-native", importNames: ["View"], message: "import 'View' from 'ui/_components' instead" } ] }] } } 123456789101112131415161718and both import { Text } from "react-native" and import { View } from "react-native" will be reported, with different messages. In previous versions of ESLint, with this configuration only import { View } from "react-native" would be reported. To address: If your configuration for this rule has multiple entries with the same name, you may need to remove unintentional ones. Related issue(s): #15261 "eslint:recommended" and "eslint:all" no longer accepted in flat config In ESLint v8.x, eslint.config.js could refer to "eslint:recommended" and "eslint:all" configurations by ins'''
