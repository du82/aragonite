title = "Configure ESLint - ESLint - Pluggable JavaScript Linter"
description = "A pluggable and configurable linter tool for identifying and reporting on patterns in JavaScript. Maintain your code quality with ease."
full_description = "Configure ESLint Table of Contents Table of Contents ESLint is designed to be flexible and configurable for your use case. You can turn off every rule and run only with basic syntax validation or mix and match the bundled rules and your custom rules to fit the needs of your project. There are two primary ways to configure ESLint: Configuration Comments - use JavaScript comments to embed configuration information directly into a file. Configuration Files - use a JavaScript file to specify configuration information for an entire directory and all of its subdirectories. This can be in the form of an eslint.config.js file which ESLint will look for and read automatically, or you can specify a configuration file on the command line. Here are some of the options that you can configure in ESLint: Globals - the additional global variables your script accesses during execution. Rules - which rules are enabled and at what error level. Plugins - which third-party plugins define additional rules, languages, configs, etc. for ESLint to use. All of these options give you fine-grained control over how ESLint treats your code. Table of Contents Configuration Files Configuration File Format Configuration Objects Configuring Shared Settings Configuration File Resolution Configure Language Options Specifying JavaScript Options Specifying Globals Configure Rules Configuring Rules Disabling Rules Configure Plugins Configure Plugins Specify a Processor Configure a Parser Configure a Custom Parser Ignore Files Ignoring Files Ignoring Directories Unignoring Files and Directories Ignored File Warnings Edit this page"
