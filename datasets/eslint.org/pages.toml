full_description = "Published under: Sponsorships 1 min read Trunk becomes ESLint gold sponsor We are happy to announce that Trunk is a gold sponsor of ESLint. We are grateful to founders Eli Schleifer and David Apirian, as well as the whole Trunk team. Nicholas C. Zakas 04 Sep, 2024 Published under: Sponsorships 1 min read Contra becomes ESLint gold sponsor We are happy to announce that Contra is a gold sponsor of ESLint. It is an honor to be supported by Contra. We are grateful to Gajus Kuizinas, Co-Founder/CTO, and to the Contra team. Nicholas C. Zakas 01 Dec, 2021 Published under: Sponsorships 1 min read Nx becomes ESLint gold sponsor We are happy to announce that Nx is a gold sponsor of ESLint. It is an honor to be supported by Nx. We are grateful to Jeff Cross, Co-founder and Principal Architect, and Victor Savkin, Co-founder, and to the Nx team. Nicholas C. Zakas 18 Feb, 2021 Published under: Sponsorships 1 min read Google Chrome becomes ESLint gold sponsor We are happy to announce that Google Chrome is a gold sponsor of ESLint. It is an honor to be supported by Google Chrome. We are grateful to Addy Osmani, Senior Staff Engineering Manager, for recommending us for the sponsorship, and to the Chrome team. Nicholas C. Zakas 13 Jan, 2021 Published under: Sponsorships 1 min read Automattic becomes ESLint's first platinum sponsor We are happy to announce that Automattic is the first platinum sponsor of ESLint. It is an honor to be supported by Automattic. We are grateful to the engineers using ESLint, and specially to Sarah Gooding of WPTavern for covering ESLint in her article about funding open source projects. Nicholas C. Zakas 10 Dec, 2020 Published under: Sponsorships 2 min read Microsoft donates $10,000 to ESLint as first FOSS Fund recipient We are happy to announce that Microsoft has donated $10,000 to ESLint, as part of their FOSS Contributor Fund. It is an honor to be supported by Microsoft and to be their first recipient. We are grateful to the software engineers, Jan Pilzer and Steve Faulkner, for nominating ESLint, and the employees who voted for us. Nicholas C. Zakas 13 Aug, 2020"
