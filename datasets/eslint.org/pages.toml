["https://eslint.org/docs/latest/use/command-line-interface"]
title = "Command Line Interface Reference - ESLint - Pluggable JavaScript Linter"
description = "A pluggable and configurable linter tool for identifying and reporting on patterns in JavaScript. Maintain your code quality with ease."
full_description = '''Command Line Interface Reference Table of Contents Run the CLI Pass Multiple Values to an Option Options Basic Configuration --no-eslintrc -c, --config --inspect-config --env --ext --global --parser --parser-options --resolve-plugins-relative-to Specify Rules and Plugins --plugin --rule --rulesdir Fix Problems --fix --fix-dry-run --fix-type Ignore Files --ignore-path --no-ignore --ignore-pattern Use stdin --stdin --stdin-filename Handle Warnings --quiet --max-warnings Output -o, --output-file -f, --format --color and --no-color Inline Configuration Comments --no-inline-config --report-unused-disable-directives --report-unused-disable-directives-severity --report-unused-inline-configs Caching --cache --cache-file --cache-location --cache-strategy Miscellaneous --init --env-info --no-error-on-unmatched-pattern --exit-on-fatal-error --no-warn-ignored --pass-on-no-patterns --debug -h, --help -v, --version --print-config --stats --flag Exit Codes The ESLint Command Line Interface (CLI) lets you execute linting from the terminal. The CLI has a variety of options that you can pass to configure ESLint. Run the CLI ESLint requires Node.js for installation. Follow the instructions in the Getting Started Guide to install ESLint. Most users use npx to run ESLint on the command line like this: npm yarn pnpm bun npm npx eslint [options] [file|dir|glob]* 1 yarn yarn dlx eslint [options] [file|dir|glob]* 1 pnpm pnpm dlx eslint [options] [file|dir|glob]* 1 bun bunx eslint [options] [file|dir|glob]* 1 Such as: npm yarn pnpm bun npm # Run on two files npx eslint file1.js file2.js 12 yarn # Run on two files yarn dlx eslint file1.js file2.js 12 pnpm # Run on two files pnpm dlx eslint file1.js file2.js 12 bun # Run on two files bunx eslint file1.js file2.js 12 or npm yarn pnpm bun npm # Run on multiple files npx eslint lib/** 12 yarn # Run on multiple files yarn dlx eslint lib/** 12 pnpm # Run on multiple files pnpm dlx eslint lib/** 12 bun # Run on multiple files bunx eslint lib/** 12 Please note that when passing a glob as a parameter, it is expanded by your shell. The results of the expansion can vary depending on your shell, and its configuration. If you want to use node glob syntax, you have to quote your parameter (using double quotes if you need it to run in Windows), as follows: npm yarn pnpm bun npm npx eslint "lib/**" 1 yarn yarn dlx eslint "lib/**" 1 pnpm pnpm dlx eslint "lib/**" 1 bun bunx eslint "lib/**" 1 If you are using a flat configuration file (eslint.config.js), you can also omit the file arguments and ESLint will use .. For instance, these two lines perform the same operation: npm yarn pnpm bun npm npx eslint . 1 yarn yarn dlx eslint . 1 pnpm pnpm dlx eslint . 1 bun bunx eslint . 1 npm yarn pnpm bun npm npx eslint 1 yarn yarn dlx eslint 1 pnpm pnpm dlx eslint 1 bun bunx eslint 1 If you are not using a flat configuration file, running ESLint without file arguments results in an error. Note: You can also use alternative package managers such as Yarn or pnpm to run ESLint. For pnpm use pnpm dlx eslint and for Yarn use yarn dlx eslint. Pass Multiple Values to an Option Options that accept multiple values can be specified by repeating the option or with a comma-delimited list (other than --ignore-pattern, which does not allow the second style). Examples of options that accept multiple values: npm yarn pnpm bun npm npx eslint --global describe --global it tests/ 1 yarn yarn dlx eslint --global describe --global it tests/ 1 pnpm pnpm dlx eslint --global describe --global it tests/ 1 bun bunx eslint --global describe --global it tests/ 1 OR npm yarn pnpm bun npm npx eslint --global describe,it tests/ 1 yarn yarn dlx eslint --global describe,it tests/ 1 pnpm pnpm dlx eslint --global describe,it tests/ 1 bun bunx eslint --global describe,it tests/ 1 Options You can view all the CLI options by running npx eslint -h. eslint [options] file.js [file.js] [dir] Basic configuration: --no-config-lookup Disable look up for eslint.config.js -c, --config path::String Use this configuration instead of eslint.config.js, eslint.config.mjs, or eslint.config.cjs --inspect-config Open the config inspector with the current configuration --ext [String] Specify additional file extensions to lint --global [String] Define global variables --parser String Specify the parser to be used --parser-options Object Specify parser options Specify Rules and Plugins: --plugin [String] Specify plugins --rule Object Specify rules Fix Problems: --fix Automatically fix problems --fix-dry-run Automatically fix problems without saving the changes to the file system --fix-type Array Specify the types of fixes to apply (directive, problem, suggestion, layout) Ignore Files: --no-ignore Disable use of ignore files and patterns --ignore-pattern [String] Patterns of files to ignore Use stdin: --stdin Lint code provided on <STDIN> - default: false --stdin-filename String Specify filename to process STDIN as Handle Warnings: --quiet Report errors only - default: false --max-warnings Int Number of warnings to trigger nonzero exit code - default: -1 Output: -o, --output-file path::String Specify file to write report to -f, --format String Use a specific output format - default: stylish --color, --no-color Force enabling/disabling of color Inline configuration comments: --no-inline-config Prevent comments from changing config or rules --report-unused-disable-directives Adds reported errors for unused eslint-disable and eslint-enable directives --report-unused-disable-directives-severity String Chooses severity level for reporting unused eslint-disable and eslint-enable directives - either: off, warn, error, 0, 1, or 2 --report-unused-inline-configs String Adds reported errors for unused eslint inline config comments - either: off, warn, error, 0, 1, or 2 Caching: --cache Only check changed files - default: false --cache-file path::String Path to the cache file. Deprecated: use --cache-location - default: .eslintcache --cache-location path::String Path to the cache file or directory --cache-strategy String Strategy to use for detecting changed files in the cache - either: metadata or content - default: metadata Miscellaneous: --init Run config initialization wizard - default: false --env-info Output execution environment information - default: false --no-error-on-unmatched-pattern Prevent errors when pattern is unmatched --exit-on-fatal-error Exit with exit code 2 in case of fatal error - default: false --no-warn-ignored Suppress warnings when the file list includes ignored files --pass-on-no-patterns Exit with exit code 0 in case no file patterns are passed --debug Output debugging information -h, --help Show help -v, --version Output the version number --print-config path::String Print the configuration for the given file --stats Add statistics to the lint report - default: false --flag [String] Enable a feature flag 1234567891011121314151617181920212223242526272829303132333435363738394041424344454647484950515253545556575859606162636465Basic Configuration --no-eslintrc eslintrc Mode Only. Disables use of configuration from .eslintrc.* and package.json files. For flat config mode, use --no-config-lookup instead. Argument Type: No argument. --no-eslintrc example npm yarn pnpm bun npm npx eslint --no-eslintrc file.js 1 yarn yarn dlx eslint --no-eslintrc file.js 1 pnpm pnpm dlx eslint --no-eslintrc file.js 1 bun bunx eslint --no-eslintrc file.js 1 -c, --config This option allows you to specify an additional configuration file for ESLint (see Configure ESLint for more). Argument Type: String. Path to file. Multiple Arguments: No -c, --config example npm yarn pnpm bun npm npx eslint -c ~/my.eslint.config.js file.js 1 yarn yarn dlx eslint -c ~/my.eslint.config.js file.js 1 pnpm pnpm dlx eslint -c ~/my.eslint.config.js file.js 1 bun bunx eslint -c ~/my.eslint.config.js file.js 1 This example uses the configuration file at ~/my.eslint.config.js, which is used instead of searching for an eslint.config.js file. --inspect-config Flat Config Mode Only. This option runs npx @eslint/config-inspector@latest to start the config inspector. You can use the config inspector to better understand what your configuration is doing and which files it applies to. When you use this flag, the CLI does not perform linting. Argument Type: No argument. --inspect-config example npm yarn pnpm bun npm npx eslint --inspect-config 1 yarn yarn dlx eslint --inspect-config 1 pnpm pnpm dlx eslint --inspect-config 1 bun bunx eslint --inspect-config 1 --env eslintrc Mode Only. This option enables specific environments. Argument Type: String. One of the available environments. Multiple Arguments: Yes Details about the global variables defined by each environment are available in the Specifying Environments documentation. This option only enables environments. It does not disable environments set in other configuration files. To specify multiple environments, separate them using commas, or use the option multiple times. --env example npm yarn pnpm bun npm npx eslint --env browser,node file.js 1 yarn yarn dlx eslint --env browser,node file.js 1 pnpm pnpm dlx eslint --env browser,node file.js 1 bun bunx eslint --env browser,node file.js 1 npm yarn pnpm bun npm npx eslint --env browser --env node file.js 1 yarn yarn dlx eslint --env browser --env node file.js 1 pnpm pnpm dlx eslint --env browser --env node file.js 1 bun bunx eslint --env browser --env node file.js 1 --ext This option allows you to specify additional file extensions to lint. Argument Type: String. File extension. Multiple Arguments: Yes Default Value: By default, ESLint lints files with extensions .js, .mjs, .cjs, and additional extensions specified in the configuration file. This option is primarely intended for use in combination with the --no-config-lookup option, since in that case there is no configuration file in which the additional extensions would be specified. --ext example npm yarn pnpm bun npm # Include .ts files npx eslint . --ext .ts 12 yarn # Include .ts files yarn dlx eslint . --ext .ts 12 pnpm # Include .ts files pnpm dlx eslint . --ext .ts 12 bun # Include .ts files bunx eslint . --ext .ts 12 npm yarn pnpm bun npm # Include .ts and .tsx files npx eslint . --ext .ts --ext .tsx 12 yarn # Include .ts and .tsx files yarn dlx eslint . --ext .ts --ext .tsx 12 pnpm # Include .ts and .tsx files pnpm dlx eslint . --ext .ts --ext .tsx 12 bun # Include .ts and .tsx files bunx eslint . --ext .ts --ext .tsx 12 npm yarn pnpm bun npm # Also include .ts and .tsx files npx eslint . --ext .ts,.tsx 12 yarn # Also include .ts and .tsx files yarn dlx eslint . --ext .ts,.tsx 12 pnpm # Also include .ts and .tsx files pnpm dlx eslint . --ext .ts,.tsx 12 bun # Also include .ts and .tsx files bunx eslint . --ext .ts,.tsx 12 --global This option defines global variables so that they are not flagged as undefined by the no-undef rule. Argument Type: String. Name of the global variable. Any specified global variables are assumed to be read-only by default, but appending :true to a variable’s name ensures that no-undef also allows writes. Multiple Arguments: Yes --global example npm yarn pnpm bun npm npx eslint --global require,exports:true file.js 1 yarn yarn dlx eslint --global require,exports:true file.js 1 pnpm pnpm dlx eslint --global require,exports:true file.js 1 bun bunx eslint --global require,exports:true file.js 1 npm yarn pnpm bun npm npx eslint --global require --global exports:true 1 yarn yarn dlx eslint --global require --global exports:true 1 pnpm pnpm dlx eslint --global require --global exports:true 1 bun bunx eslint --global require --global exports:true 1 --parser This option allows you to specify a parser to be used by ESLint. Argument Type: String. Parser to be used by ESLint. Multiple Arguments: No Default Value: espree --parser example npm yarn pnpm bun npm # Use TypeScript ESLint parser npx eslint --parser @typescript-eslint/parser file.ts 12 yarn # Use TypeScript ESLint parser yarn dlx eslint --parser @typescript-eslint/parser file.ts 12 pnpm # Use TypeScript ESLint parser pnpm dlx eslint --parser @typescript-eslint/parser file.ts 12 bun # Use TypeScript ESLint parser bunx eslint --parser @typescript-eslint/parser file.ts 12 --parser-options This option allows you to specify parser options to be used by ESLint. The available parser options are determined by the parser being used. Argument Type: Key/value pair separated by colon (:). Multiple Arguments: Yes --parser-options example npm yarn pnpm bun npm # fails with a parsing error echo '3 ** 4' | npx eslint --stdin --parser-options ecmaVersion:6 12 yarn # fails with a parsing error echo '3 ** 4' | yarn dlx eslint --stdin --parser-options ecmaVersion:6 12 pnpm # fails with a parsing error echo '3 ** 4' | pnpm dlx eslint --stdin --parser-options ecmaVersion:6 12 bun # fails with a parsing error echo '3 ** 4' | bunx eslint --stdin --parser-options ecmaVersion:6 12 npm yarn pnpm bun npm # succeds, yay! echo '3 ** 4' | npx eslint --stdin --parser-options ecmaVersion:7 12 yarn # succeds, yay! echo '3 ** 4' | yarn dlx eslint --stdin --parser-options ecmaVersion:7 12 pnpm # succeds, yay! echo '3 ** 4' | pnpm dlx eslint --stdin --parser-options ecmaVersion:7 12 bun # succeds, yay! echo '3 ** 4' | bunx eslint --stdin --parser-options ecmaVersion:7 12 --resolve-plugins-relative-to eslintrc Mode Only. Changes the directory where plugins are resolved from. Argument Type: String. Path to directory. Multiple Arguments: No Default Value: By default, plugins are resolved from the directory in which your configuration file is found. This option should be used when plugins were installed by someone other than the end user. It should be set to the project directory of the project that has a dependency on the necessary plugins. For example: When using a config file that is located outside of the current project (with the --config flag), if the config uses plugins which are installed locally to itself, --resolve-plugins-relative-to should be set to the directory containing the config file. If an integration has dependencies on ESLint and a set of plugins, and the tool invokes ESLint on behalf of the user with a preset configuration, the tool should set --resolve-plugins-relative-to to the top-level directory of the tool. --resolve-plugins-relative-to example npm yarn pnpm bun npm npx eslint --config ~/personal-eslintrc.js --resolve-plugins-relative-to /usr/local/lib/ 1 yarn yarn dlx eslint --config ~/personal-eslintrc.js --resolve-plugins-relative-to /usr/local/lib/ 1 pnpm pnpm dlx eslint --config ~/personal-eslintrc.js --resolve-plugins-relative-to /usr/local/lib/ 1 bun bunx eslint --config ~/personal-eslintrc.js --resolve-plugins-relative-to /usr/local/lib/ 1 Specify Rules and Plugins --plugin This option specifies a plugin to load. Argument Type: String. Plugin name. You can optionally omit the prefix eslint-plugin- from the plugin name. Multiple Arguments: Yes Before using the plugin, you have to install i'''
