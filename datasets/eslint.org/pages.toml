full_description = '''Sponsors 171 companies, organizations, and individuals are currently contributing $11,675.00 each month to support ESLint's ongoing maintenance and development. Become a Sponsor if (window.innerWidth > 800) { var s = document.createElement("script"); s.type = "text/javascript"; s.src = "//media.ethicalads.io/media/client/ethicalads.min.js"; document.getElementById("eslint-sponsor").after(s); document.getElementById("eslint-sponsor").remove(); } Platinum Sponsors Become a platinum sponsor with a monthly donation of $2,000 USD (providing 25-40 hours of maintenance and development) Open Collective or GitHub avatar image on our READMEs on GitHub and the home page of eslint.org. We will also tweet a thank you from our Twitter account (over 38,000 followers). Gold Sponsors Become a gold sponsor with a monthly donation of $1,000 USD (providing 12-20 hours of maintenance and development) and get your Open Collective or GitHub avatar image on our README on GitHub and the front page of eslint.org. We will also tweet a thank you from our Twitter account (over 38,000 followers). Silver Sponsors Become a silver sponsor with a monthly donation of $500 USD (providing 6-10 hours of maintenance and development) and get your Open Collective or GitHub avatar image on our README on GitHub and the front page of eslint.org. Bronze Sponsors Become a bronze sponsor with a monthly donation of $200 USD (providing four hours of maintenance and development) and get your Open Collective or GitHub avatar image on our README on GitHub and the front page of eslint.org. Technology Sponsors Technology sponsors allow us to use their products and services for free as part of a contribution to the open source ecosystem and our work. Recent one-time donations We also receive a lot of one-time contributions from fantastic people. Here are some recent ones from OpenCollective and GitHub. Backend engineer February 12, 2025 + $2.00 Mike DiDomizio February 12, 2025 + $5.00 Mykhailo Mary