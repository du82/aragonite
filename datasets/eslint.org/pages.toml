full_description = "Open Collective Our most popular plan for companies. Donate directly to a 501(c)(6) non-profit One-time and recurring donations Pay by credit card, bank transfer, or PayPal Set up an open source fund to donate to multiple projects Available in most countries Contribute on Open Collective GitHub Sponsors Advanced features and reporting. Donate through GitHub billing One-time and recurring donations Pay by credit card or use your existing billing relationship with GitHub (including invoicing) Show a “sponsor” badge on your GitHub profile Use your existing GitHub login Contribute on GitHub Team Development We pay our team members an hourly rate based on their seniority, currently $80.00 USD/hour for TSC members and Reviewers and $50.00 USD/hour for committers. Contributor Pool We set aside $1,000.00 USD each month to pay outside contributors who have made significant contributions to the project. Contributions include submitting code, writing documentation, answering questions in our Discord server, and more. This money is allocated each month by the TSC. Dependencies We set aside $1,500.00 USD each month to help support our dependencies. We believe that open source projects who are lucky enough to get funded have a responsibility to help support the smaller projects they rely on. Community Projects We set aside $1,500.00 USD each month to help support plugins, parsers, and other projects that are of benefit to the ESLint ecosystem as a whole. We believe the strength of the project is in its ecosystem and we want to ensure important projects remain well-maintained. Support Systems We use a small amount each month to pay for software the team uses to help manage the project, which includes things like Google Workspace and cloud storage."
