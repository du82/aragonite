title = "ESPHome — ESPHome"
description = "ESPHome Homepage - Reimagining DIY Home Automation. ESPHome is a framework that tries to provide the best possible use experience for using IoT microcontrollers for Home Automation. Just write a simple YAML configuration file and get your own customized firmware."
full_description = "ESPHome is a system which allows you to turn common microcontrollers into smart home devices. It uses YAML configuration files and, based on the content of these file(s), it creates custom firmware which you can then install directly onto your device. Hardware defined in the configuration–such as sensors, switches, lights, and so on–will automatically appear in Home Assistant’s user interface or can be made available via a simple web user interface or MQTT. Getting started from Home Assistant using the command line install ready-made project by migrating from Tasmota FAQ and Tips esphome: name: awesome esp32: board: nodemcu-32s Next steps Documentation Automations Configuration types Device configuration examples DIY Examples Sharing ESPHome devices Made for ESPHome program Keeping up What's new? Changelog Community/Social Discord Forums Development Contributing Supporters Device Database¶ You will find configurations for specific devices in our ESPHome Devices database. Documentation¶ You will find all ESPHome documentation here. Contributing¶ ESPHome depends on and welcomes contributions from our community. If you’d like to contribute, please see Contributing."
