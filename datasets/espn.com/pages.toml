["http://www.espn.com/fantasy/basketball/story/_/id/44057746/mens-fantasy-basketball-risers-fallers-steve-alexander-ty-jerome-bol-bol"]
title = "Fantasy basketball: Dr. A's weekly risers and fallers - ESPN"
description = "Steve Alexander highlights five names trending upward and five downward, with key takeaways for each."
full_description = '''Dr. A's fantasy basketball risers and fallers: Ty Jerome, Bol Bol emerging as starsTy Jerome might see increased opportunity heading into the final months of the regular season. Photo by Noah Graham/NBAE via Getty ImagesSteve AlexanderCloseSteve Alexander is a contributing writer for men's fantasy basketball at ESPN. Steve is a member of the FSWA Hall of Fame.Follow on XFeb 28, 2025, 06:00 PM ETEmailPrintOpen Extended ReactionsWelcome to this week's roundup of the biggest risers and fallers in fantasy basketball! As the season unfolds, player performances continue to shake up the rankings and impact fantasy rosters. Whether it's a breakout star making waves or a struggling veteran losing ground, staying ahead of the trends is crucial for your fantasy success. In this weekly breakdown, we'll highlight the top performers climbing the charts and those whose value is slipping, helping you make smarter lineup decisions.RisersLuka Doncic, PG, Los Angeles Lakers (100% rostered in ESPN leagues)Men's Tournament ChallengeSign up now to play the #1 Men's bracket game for FREE! $135,000 in prizes. Play Men's Tournament Challenge Doncic was clearly shaken by the trade that sent him to the Lakers, and he didn't play very well in his first few games with his new team. His confidence was shaken, but he suddenly looks like the Luka of old. It started with a 32-point, 10-rebound, 7-assist explosion in a win over the Denver Nuggets last Saturday, was bolstered by a 19-15-12 triple-double against the Dallas Mavericks on Tuesday, then carried over with a 21-13-5 game against the Minnesota Timberwolves on Thursday. Doncic is as motivated as any player in the league and is set on going on a tear in the final stretch of the season. He's now LeBron James' quarterback, and the Lakers have their sights set on winning a championship. As long as he can stay healthy, Doncic is going to go off the rest of the way.Tyrese Haliburton, PG/SG, Indiana Pacers (100% rostered)Haliburton has been on a bit of a roller-coaster ride this season but is on fire now. He has been arguably the best player in the league over his past four games, and the Pacers are the No. 4 seed in the East as a result. Haliburton is shooting 62% from the floor over his past four games, averaging nearly 26 points, 12 assists, 2.5 steals and 5.0 3-pointers, and he hasn't missed a free throw since Feb. 3. He has double-doubled in three straight games and will have to continue to play well if the Pacers are going to hold off the Bucks and Pistons to retain the 4-seed in the East. Haliburton will help fantasy managers win leagues if he can keep his production up.Josh Giddey, PG/SG/SF, Chicago Bulls (89.5% rostered)Giddey has found a home in Chicago and is playing at an incredibly high level, flirting nightly with triple-doubles and posting gaudy numbers (24 points, 12 rebounds, 8 assists, 1.5 steals, 1.3 blocks and 3.5 3-pointers over his past four games). He's shooting lights-out at 58% from the floor and making a ton of free throws. He's healthy and should continue to run the point the rest of the way for the Bulls as they look to make the play-in tournament as the No. 10 seed in the East.Ty Jerome, PG, Cleveland Cavaliers (12% rostered)Darius Garland has been banged up, and Jerome has responded, racking up points, rebounds, assists, steals and 3-pointers in February while hitting nearly 52% of his shots and 87% of his free throws off the bench. He plays only 21 minutes per game, but still produces for his fantasy managers. De'Andre Hunter gets more hype for being a Sixth Man of the Year candidate, but Jerome has actually been Cleveland's sixth man for most of the season. He's only another Garland or Donovan Mitchell injury away from becoming a bona fide fantasy star. Simply put, he should be rostered in a lot more leagues going forward.Bol Bol, PF/C, Phoenix Suns (11% rostered)Bol went on a four-game tear from Feb. 7 to Feb. 12, scoring in double digits while racking up points, rebounds, steals, blocks and 3-pointers and getting 30 minutes per game. For some reason, coach Mike Budenholzer limited Bol's minutes in the next three games, causing him to be dropped by many managers who had just picked him up. But Budenholzer has gone back to Bol the past two games, playing him 29 and 32 minutes. Bol responded by averaging 19 points, 7 boards, 2 blocks and 2.5 3-pointers. Though we don't know if Budenholzer will stick with Bol going forward, there is no reason for him not to. The Suns are on the outside looking in at the playoffs, and Bol could be a fantasy force down the stretch for a team going nowhere.FallersDomantas Sabonis, PF/C, Sacramento Kings (100% rostered)Editor's PicksFantasy basketball: Six rising rookies who can help win your league3dAndre SnellingsFantasy basketball: Don't be surprised if ... we never see the old Joel Embiid again3dEric Karabell1 RelatedPlaying alongside DeMar DeRozan, Zach LaVine, Malik Monk and Keegan Murray has not done Sabonis any fantasy favors: He has failed to score more than 16 points in five of his past six games. He's still a force to be reckoned with, piling up rebounds and assists, but the drop in scoring combined with a lack of steals, blocks and 3-pointers in February has fantasy managers shaking their collective heads. He could snap out of his scoring funk, but DeRozan and LaVine will make it tough for Sabonis to score consistently on a nightly basis. Monk (83% rostered) has also taken a hit with the arrival of LaVine, and has scored 20 points in only one of his past seven games.Ja Morant, PG, Memphis Grizzlies (99% rostered)Morant has been unreliable this season, playing in just 36 of Memphis' 58 games thus far, and shot just 40% from the floor for the month heading into Friday's game against the Knicks. He's also a turnover machine (3.8 per game in February), isn't a big threat from downtown (1.6 per game for the month) and has been getting just one steal per game. Desmond Bane, Jaren Jackson Jr., Jaylen Wells and Santi Aldama have been taking shots away from Morant, and he hit just 7-of-25 attempts in his last game Tuesday. Morant is still worth starting any time he is playing, but fantasy managers were clearly looking for more when they drafted him last fall.Women's Tournament ChallengeCreate up to 25 women's brackets to be eligible for special prizes! FREE to play. Play Women's Tournament Challenge Rui Hachimura, SF/PF, Los Angeles Lakers (37% rostered)Hachimura has played a big role for the Lakers since the trade of Anthony Davis, but he played just 18 minutes Thursday, scoring five points. He has scored six or fewer points in two of his past four games and might continue to struggle for touches while Doncic, James and Austin Reaves do the heavy lifting for the Lakers offensively. Hachimura averaged only 5.5 rebounds, 0.5 steals and 0.4 blocks in February, and though there's a chance he can turn it around against the Clippers on Friday, he's simply not worth rostering if he's not going to try to score at least 15 points per game.De'Andre Hunter, SF/PF, Cleveland Cavaliers (30% rostered)Hunter was in the running for Sixth Man of the Year while playing for the Atlanta Hawks, but he was traded to Cleveland, where things are much more crowded. He not only has to compete for shots with starters Darius Garland, Donovan Mitchell, Evan Mobley and Jarrett Allen, but Ty Jerome is also playing very well off the Cavaliers' bench. Hunter has scored in double digits and has hit at least two 3-pointers in five of his six games for the Cavs, but the rest of his numbers have fallen off. He has amassed totals of just 21 rebounds, 6 assists, 2 steals and 1 block in those six games for Cleveland. The scoring and 3-pointers are fine, but the Cavs simply don't need Hunter to do much more to keep winning games. The Sixth Man of the Year race has come down to Malik Beasley and Payton Pritchard, leaving Hunter in its wake. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://www.espn.com/espn/corrections"}]}]'); needConsent = 'false'; } catch (e) { console.log(e); } window.espn.footerLinks = footerLinks || {}; window.espn.needConsent = needConsent || false })(); Terms of UsePrivacy PolicyYour US State Privacy RightsChildren's Online Privacy PolicyInterest-Based AdsAbout Nielsen MeasurementDo Not Sell or Share My Personal InformationContact UsDisney Ad Sales SiteWork for ESPNCorrectionsESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries ('PENN'