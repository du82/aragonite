title = "Bubble Watch 2025: Conference locks for men's March Madness - ESPN"
description = "As Selection Sunday nears, let's track which teams can play their way in or out of the NCAA tournament."
full_description = '''EXCLUSIVE CONTENT Get ESPN+ Bubble Watch 2025: Conference locks for men's March MadnessChris Mañon led Vanderbilt with 23 points in its overtime win against Missouri on Saturday. Carly Mackler/Getty ImagesNeil PaineMar 1, 2025, 08:54 PM ETCloseNeil Paine writes about sports using data and analytics. Previously, he was Sports Editor at FiveThirtyEight.Follow on XEmailOpen Extended ReactionsSelection Sunday will be exactly two weeks from this Sunday, and the Bubble Watch picture for the 2025 men's NCAA tournament continues to sharpen.According to ESPN Analytics' tourney forecast model, 31 teams have achieved at least a 95% chance to make the tournament, while nine others are in solid shape (70-95%). But that leaves 20 teams sitting between 25% and 70% odds, their fates currently unknown.After a loaded Saturday slate, let's break down teams by conference into categories based on their projected NCAA tournament status.Teams with Lock status have at least a 95% chance to make the tournament, according to the BPI forecast. (Yes, this means that 5% of the time, a team marked as a lock will miss the tourney. We set the threshold there as a nod to the traditional standard for significance testing.)A team marked Should Be In has a BPI probability from 70% to 94%. These are teams that, most likely, will get into the field of 68, though their fates are not completely assured yet.And a team with the Work To Do tag has anywhere from 25% to 69% tourney odds per the BPI, or is featured in ESPN's most recent Bracketology column by Joe Lunardi -- who, let's be honest, probably knows better than the algorithm -- or has at least a 10% chance to make the tourney conditional on not getting an automatic bid. We'll mark these Bracketology teams with an asterisk. (This is our failsafe for catching teams that the BPI might be too low on.) The percentages will be more accurate the closer we get to Selection Sunday, as teams' bodies of work become more solidified.One other note: The ESPN Analytics model is a predictive forecast, meaning it is not representative of whether a team would make the tournament if its season ended today but rather gives each team a probability to make the tourney after simulating the remainder of the season 10,000 times.Here is our current projection of the bubble:Auto-bids available (conference tournament champs): 31 teams At-large bids available: 37 teams Locks: 31 teams The Bubble: 29 total teams Should be in: 9 teams Work to do: 20 teamsHere's the rundown of teams -- conference by conference -- in order of which conferences projects to get the most NCAA bids. And we've listed expected number of bids for each of the power conferences. The teams are listed in order within each category based on their chances to get a tourney bid.Notes: All times are Eastern. SOR = strength of record. SOS = strength of schedule. NET rankings = The NCAA's official evaluation tool, which is the recommended rating for the committee to look at. SRS = Simple Rating System. WAB = Wins Above Bubble, a team's extra wins beyond what a typical bubble team would have against its schedule.Jump to a conference: SEC | Big Ten Big 12 | ACC | Big East Mid-majors | OthersSEC (11.2 expected bids)Locks (95% tourney chance) ESPN + Continue reading this article and more from top writers, for only $11.99/mo. Continue Reading Already an ESPN+ subscriber? Log in here. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers":["ESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries (%27PENN%27). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER."],"copyright":"Copyright: \u00a9 %{year} ESPN Enterprises, Inc. All rights reserved.","footer":[{"label":"Terms of Use","href":"https://disneytermsofuse.com/english/"},{"label":"Privacy Policy","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/"},{"label":"Your US State Privacy Rights","href":"https://privacy.thewaltdisneycompany.com/en/current-privacy-policy/your-us-state-privacy-rights/"},{"label":"Children%27s Online Privacy Policy","href":"https://disneyprivacycenter.com/kids-privacy-policy/english/"},{"label":"Interest-Based Ads","href":"http://preferences-mgr.truste.com/?type=espn&affiliateId=148"},{"label":"About Nielsen Measurement","href":"http://www.nielsen.com/digitalprivacy"},{"className":"ot-sdk-show-settings","label":"Do Not Sell or Share My Personal Information","href":"https://privacy.thewaltdisneycompany.com/en/dnssmpi/"},{"label":"Contact Us","href":"https://www.espn.com/espn/news/story?page=contact-index"},{"label":"Disney Ad Sales Site","href":"https://disneyadsales.com/"},{"label":"Work for ESPN","href":"https://jobs.disneycareers.com/espn"},{"label":"Corrections","href":"https://www.espn.com/espn/corrections"}]}]'); needConsent = 'false'; } catch (e) { console.log(e); } window.espn.footerLinks = footerLinks || {}; window.espn.needConsent = needConsent || false })(); Terms of UsePrivacy PolicyYour US State Privacy RightsChildren's Online Privacy PolicyInterest-Based AdsAbout Nielsen MeasurementDo Not Sell or Share My Personal InformationContact UsDisney Ad Sales SiteWork for ESPNCorrectionsESPN BET Sportsbook is owned and operated by PENN Entertainment, Inc. and its subsidiaries ('PENN'). ESPN BET is available in states where PENN is licensed to offer sports wagering. Must be 21+ to wager. If you or someone you know has a gambling problem and wants help, call 1-800-GAMBLER.Copyright: © 2025 ESPN Enterprises, Inc. All rights reserved.'''
