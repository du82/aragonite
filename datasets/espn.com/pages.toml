["https://espn.com/nfl/insider/story/_/id/43957885/2025-nfl-free-agency-grades-signings-trades-latest-best-worst-deals-draft-outlook"]
title = "2025 NFL free agency, trade grades: Deebo Samuel to Commanders - ESPN"
description = "The Commanders made a splash in dealing for receiver Deebo Samuel. But will the move pay off? And were the 49ers right to trade him?"
full_description = '''EXCLUSIVE CONTENT Get ESPN+ 2025 NFL free agency, trade grades: Deebo Samuel to CommandersSeth WalderMar 1, 2025, 08:15 PM ETCloseSeth Walder is an analytics writer at ESPN, specializing in quantitative analysis. He is also a regular on "ESPN Bet Live" and helps cover sports betting. Seth has been at ESPN since 2017. He previously worked at the New York Daily News covering the Jets and Giants. You can follow Seth on X via @SethWalder.EmailOpen Extended ReactionsThe 2025 NFL offseason picked up some steam Saturday, when the Commanders traded for 49ers receiver Deebo Samuel Sr. Washington landed the standout pass catcher for a fifth-round pick. It's the first big move as we near free agency, which begins with the legal negotiating window March 10 and officially opens March 12.ESPN analytics writer Seth Walder is grading every 2025 NFL signing and trade of the offseason, putting each deal into perspective for teams and players. To determine each grade, Walder is evaluating moves based on multiple factors, including on-field impact, salary cap implications, compensation, player value/age and the context of a team's short-term and long-term outlook. How large is the effect of this decision, and how sure are we it's a good or bad choice? How does this affect a team's chance to win the Super Bowl, either this season or in the future?Follow along as Walder evaluates and grades each move, with the most recent grades at the top. We begin with Samuel's move to the NFC East. coverage: Graziano: Big salary cap questions Bowen: Best fits for top 50 free agents Schatz: Projecting one signing for every team Walder: Starting QB predictionsSamuel to the CommandersCommanders get: WR Deebo Samuel Sr. 49ers get: 2025 fifth-round pick ESPN + Continue reading this article and more from top writers, for only $11.99/mo. Continue Reading Already an ESPN+ subscriber? Log in here. (function () { var footerLinks, needConsent; try { footerLinks = JSON.parse('[{"disclaimers"